    description: "Read the append-only audit log for a festival, ordered by created_at ascending.  Roles other than AuditViewer, FestivalProducer, and PlatformAdmin get ERR_AUDIT_LOG_FORBIDDEN.  Supports filtering by event_category, subject_entity_type, and a created_at_after timestamp."
    roles: [AuditViewer, FestivalProducer, PlatformAdmin]
    code: 200
    input: ["limit?", "offset?", "event_category?", "subject_entity_type?", "created_at_after?"]
    output: "AuditEntry[]"
    side_effects: []

  # ------- Dev/test-only operator endpoints (required by the §1.5 testability
  #          principle so every time-gated or external-event-driven transition
  #          is reachable from empty-DB state).  These are PlatformAdmin-only
  #          and are part of the API contract — the PRD must spell them out so
  #          the test harness can reach the otherwise-unreachable states.
  # -----------------------------------------------------------------------
  - method: POST
    path: "/_clock/advance"
    description: "Move the test clock forward by `seconds` for all festivals, OR by a per-festival amount when a `festival_id` is supplied with `to_unix_seconds`.  Triggers the auto-transition sweep for festivals (start_time crossing → LIVE, end_time + grace crossing → CLOSED), program-items (start_time crossing → ON_STAGE while festival is LIVE, end_time crossing → PERFORMED), and rehearsals (start_time crossing → IN_PROGRESS, end_time + grace crossing → ARCHIVED).  Each transition appends an AuditEntry of event_category=CLOCK_TICK.  The body's shape is {`festival_id?`, `delta_seconds?`, `to_unix_seconds?`} with exactly one of the two time arguments supplied.  When festival_id is null, the advance applies to every festival's clock_offset_seconds in a single transaction."
    roles: [PlatformAdmin]
    code: 200
    input: ["festival_id?", "delta_seconds?", "to_unix_seconds?"]
    output: "ClockAdvanceResult (a synthetic view listing the festivals affected and the transitions fired)"
    side_effects:
      - "Festival.clock_offset_seconds increments (or is set absolutely)."
      - "Every time-gated transition documented in §1.2 that fires on the new clock value runs in deterministic chronological order: festival starts first, then program-item starts, then sound-check completes-eligible, then rehearsal starts, then program-item ends, then rehearsal ends + grace, then festival ends + grace.  Within a single tick crossing multiple thresholds, the order is the wall-clock order of the thresholds; ties broken by the entity-type order listed."
      - "AuditEntry(s) appended.  Cascade C of rule 4 (festival-close → rehearsal-auto-archive → audit-fanout) lives entirely inside this endpoint's side-effect tree."

  - method: GET
    path: "/_clock"
    description: "Read the current per-festival clock offsets (and the implied wall-clock-of-record for each festival).  Useful for tests to assert clock state."
    roles: [PlatformAdmin, AuditViewer]
    code: 200
    input: ["festival_id?"]
    output: "ClockView"
    side_effects: []

  - method: POST
    path: "/_events/sync-ack"
    description: "External-system-acknowledgement ingress.  Body: {festival_id, schedule_change_id, target ∈ {ticketing,im,broadcasting,sponsor}, succeeded: bool, payload_hash}.  Flips the corresponding sync_envelopes element from QUEUED to ACKNOWLEDGED (when succeeded=true) or FAILED (when succeeded=false).  When the change's last QUEUED envelope flips ACKNOWLEDGED, the change advances APPLIED → SYNCED.  ProgramItem.announcement_sync_state is also flipped on the IM target's ACK for TICKET_NOTIFY-kind changes."
    roles: [PlatformAdmin]
    code: 200
    input: ["festival_id", "schedule_change_id", "target", "succeeded", "payload_hash"]
    output: ScheduleChange
    side_effects: ["AuditEntry of event_category=SYNC_ACK."]

  - method: POST
    path: "/_events/refund-confirmed"
    description: "External-ticketing-system refund-confirmation ingress.  Body: {festival_id, schedule_change_id, refund_breakdown: [{ticket_type_id, refunded_count_delta, final_cents_total_for_type}]}.  Runs the chronological-variant `final_refund_amount` calculation: increments TicketType.refunded_count and TicketType issuance-record bookkeeping, decrements provisional_refund_cents_outstanding, stamps ScheduleChange.final_refund_cents_total.  Subject to ERR_CROSS_FESTIVAL_REFUND, ERR_REFUND_EXCEEDS_PROVISIONAL.  Also functions as the ticketing-target sync-ack; the test harness can use either /_events/sync-ack with the ticketing target or this endpoint, but only this one carries the final-cents breakdown payload that completes the dual-variant pair.  Festival.outstanding_tickets_total is recomputed as a side effect."
    roles: [PlatformAdmin]
    code: 200
    input: ["festival_id", "schedule_change_id", "refund_breakdown"]
    output: ScheduleChange
    side_effects:
      - "Per-type TicketType.refunded_count incremented; provisional_refund_cents_outstanding decremented."
      - "ScheduleChange.final_refund_cents_total stamped (the rule 1 instance A chronological number)."
      - "The ticketing element of the change's sync_envelopes is flipped to ACKNOWLEDGED.  When the other three targets have also ACKed via /_events/sync-ack, the change advances to SYNCED."
      - "Festival.outstanding_tickets_total recomputed."
      - "AuditEntry of event_category=SYNC_ACK with a `final_cents_total` field in payload_summary."

  - method: POST
    path: "/_sweep/run"
    description: "Post-event tally sweep.  Walks every ExposureAllocation in the festival's FulfilmentLog stream, recomputes delivered_units for each, flips DELIVERED → REPORTED while writing a closing REPORTED FulfilmentLog row, updates SponsorTier.actual_fulfilment_pct, and recomputes sponsor_payout_total_cents per §1.3 `sponsor_payout_total`.  Idempotent: multiple invocations after the festival has closed return the same numeric snapshot.  Pre-close sweeps refresh projected_fulfilment_pct only — they do not flip the actual-percentage field or write REPORTED rows.  Body: {festival_id, compute_payout: bool}."
    roles: [PlatformAdmin, SponsorshipAdmin]
    code: 200
    input: ["festival_id", "compute_payout?"]
    output: "SweepResultView"
    side_effects:
      - "ExposureAllocation rows in DELIVERED state flip to REPORTED with a closing FulfilmentLog row appended."
      - "SponsorTier.actual_fulfilment_pct stamped (the rule-1 instance B chronological variant)."
      - "SponsorTier.tier_remaining_quota recomputed."
      - "AuditEntry of event_category=EXPOSURE per affected tier."

# -----------------------------------------------------------------------------
# §1.6  Error Code Catalog
# -----------------------------------------------------------------------------
errors:

  # --- Auth / headers --------------------------------------------------------
  - { id: ERR_MISSING_USER_CONTEXT_HEADER, http: 400, condition: "X-User-Id or X-User-Role header is missing or empty." }
  - { id: ERR_UNKNOWN_ROLE,                http: 403, condition: "X-User-Role is not one of the declared roles in the RBAC matrix." }
  - { id: ERR_INSUFFICIENT_PERMISSIONS,    http: 403, condition: "Role does not permit the requested endpoint operation." }
  - { id: ERR_AUDIT_LOG_FORBIDDEN,         http: 403, condition: "Role is not in the audit-log read allowlist (AuditViewer, FestivalProducer, PlatformAdmin)." }

  # --- Not found / mis-parented ---------------------------------------------
  - { id: ERR_FESTIVAL_NOT_FOUND,            http: 404, condition: "The festival id in the URL path does not resolve." }
  - { id: ERR_PROGRAM_VERSION_NOT_FOUND,     http: 404, condition: "The program-version id does not resolve under the festival path." }
  - { id: ERR_STAGE_NOT_FOUND,               http: 404, condition: "The stage id does not resolve under the festival path." }
  - { id: ERR_EQUIPMENT_KIT_NOT_FOUND,       http: 404, condition: "The equipment-kit id does not resolve under the festival path." }
  - { id: ERR_ARTIST_NOT_FOUND,              http: 404, condition: "The artist id in the URL or in a referencing body field does not resolve." }
  - { id: ERR_PROGRAM_ITEM_NOT_FOUND,        http: 404, condition: "The program-item id does not resolve under the festival path." }
  - { id: ERR_RIDER_NOT_FOUND,               http: 404, condition: "The rider id does not resolve under the program-item path." }
  - { id: ERR_SOUND_ENGINEER_TEAM_NOT_FOUND, http: 404, condition: "The sound-engineer-team id does not resolve under the festival path." }
  - { id: ERR_SOUND_CHECK_NOT_FOUND,         http: 404, condition: "The sound-check slot id does not resolve under the festival path." }
  - { id: ERR_REHEARSAL_NOT_FOUND,           http: 404, condition: "The rehearsal id does not resolve under the festival path." }
  - { id: ERR_TICKET_TYPE_NOT_FOUND,         http: 404, condition: "The ticket-type id does not resolve under the festival path." }
  - { id: ERR_SPONSOR_TIER_NOT_FOUND,        http: 404, condition: "The sponsor-tier id does not resolve under the festival path." }
  - { id: ERR_EXPOSURE_ALLOCATION_NOT_FOUND, http: 404, condition: "The exposure-allocation id does not resolve under the festival path." }
  - { id: ERR_SCHEDULE_CHANGE_NOT_FOUND,     http: 404, condition: "The schedule-change id does not resolve under the festival path." }
  - { id: ERR_RESOURCE_MISMATCHED_PARENT,    http: 404, condition: "A child resource's parent foreign key does not match the URL's parent id." }

  # --- Request schema --------------------------------------------------------
  - { id: ERR_INVALID_REQUEST_BODY, http: 400, condition: "JSON body malformed or required fields missing." }
  - { id: ERR_INVALID_FIELD_VALUE,  http: 400, condition: "A specific field's value violates its declared type or enum set; the message names the field." }
  - { id: ERR_INVALID_PAGINATION,   http: 400, condition: "limit out of [1,100] or offset negative." }
  - { id: ERR_INVALID_FESTIVAL_WINDOW, http: 400, condition: "Festival's start_time/end_time pair invalid (end ≤ start, non-positive, or day count zero)." }

  # --- State and cross-state gates ------------------------------------------
  - { id: ERR_FESTIVAL_NOT_SCHEDULING_OR_PUBLISHED, http: 409, condition: "Operation requires Festival.status in {SCHEDULING, PUBLISHED}." }
  - { id: ERR_FESTIVAL_NOT_PUBLISHED,               http: 409, condition: "ProgramItem.announce requires Festival.status == PUBLISHED." }
  - { id: ERR_FESTIVAL_ALREADY_CLOSED,              http: 409, condition: "Operation is not permitted after Festival.status reaches CLOSED, e.g., late refund-confirmed ACKs against a closed festival." }
  - { id: ERR_PROGRAM_VERSION_SUPERSEDED,           http: 409, condition: "Item references a ProgramVersion that is not Festival.current_program_version_id even though a version has been published.  Cross-entity-state gate, rule 7 instance A." }
  - { id: ERR_EMPTY_PROGRAM_VERSION,                http: 409, condition: "Submit-for-review on a version with zero attached ProgramItems while ALLOW_EMPTY_PROGRAM is false." }
  - { id: ERR_MISSING_REVISION_REASON,              http: 400, condition: "Return-for-revision call without a reason string." }
  - { id: ERR_MISSING_REJECTION_REASON,             http: 400, condition: "ScheduleChange reject call without a reason string." }
  - { id: ERR_MISSING_VOID_REASON,                  http: 400, condition: "Void-delivery call without a reason string." }
  - { id: ERR_PROGRAM_ITEM_NOT_PROPOSED,            http: 409, condition: "Confirm endpoint called on a non-PROPOSED item." }
  - { id: ERR_PROGRAM_ITEM_NOT_CONFIRMED,           http: 409, condition: "Announce endpoint called on a non-CONFIRMED item." }
  - { id: ERR_PROGRAM_ITEM_NOT_MUTABLE,             http: 409, condition: "PATCH on an item past ANNOUNCED.  The orchestrator must use a ScheduleChange." }
  - { id: ERR_PROGRAM_ITEM_ALREADY_CANCELLED,       http: 409, condition: "Cancel a program item that is already CANCELLED.  The race outcome in §1.2.1 'two simultaneous cancels' uses this error for the loser." }
  - { id: ERR_PROGRAM_ITEM_NOT_TERMINAL_FOR_PERFORM, http: 409, condition: "Internal-consistency check: an attempt to mark PERFORMED outside the standard ON_STAGE→PERFORMED clock-tick path." }
  - { id: ERR_PARENT_ITEM_NOT_READY,                http: 409, condition: "Sound-check schedule call on a slot whose parent ProgramItem is not in {CONFIRMED, ANNOUNCED}.  Rule 7 instance B." }
  - { id: ERR_TEAM_NOT_AVAILABLE,                   http: 409, condition: "Sound-check schedule on a team currently BUSY or WITHDRAWN.  Sibling of the §1.2.1 'two-riders-on-same-slot' race error." }
  - { id: ERR_TEAM_HAS_ACTIVE_SLOT,                 http: 409, condition: "Withdraw a team that is the current_booking_id of a SCHEDULED slot." }
  - { id: ERR_SOUND_CHECK_NOT_SCHEDULED,            http: 409, condition: "Complete a slot that is not in SCHEDULED." }
  - { id: ERR_SOUND_CHECK_NOT_TERMINAL,             http: 409, condition: "Cancel a slot already terminal (COMPLETED or CANCELLED)." }
  - { id: ERR_SOUND_CHECK_STAGE_MISMATCH,           http: 409, condition: "Slot's persisted stage_id differs from the parent ProgramItem's current stage_id (a STAGE_SWAP elapsed)." }
  - { id: ERR_SOUND_CHECK_WINDOW_INVALID,           http: 422, condition: "Slot scheduled_window does not lie within the festival window and at least TEAM_HANDOFF_SECONDS before the parent ProgramItem.start_time." }
  - { id: ERR_REHEARSAL_NOT_BOOKED,                 http: 409, condition: "Cancel a rehearsal not in BOOKED." }
  - { id: ERR_TICKET_TYPE_NOT_ACTIVE,               http: 409, condition: "Issue on a ticket type not in ACTIVE." }
  - { id: ERR_TICKET_TYPE_TIE_INVALID,              http: 409, condition: "tied_program_item_ids is empty after a cascade pruned it, or the tied item id does not resolve.  Also the race-outcome error for the §1.2.1 'issue races cascade' scenario." }
  - { id: ERR_CHANGE_NOT_PROPOSED,                  http: 409, condition: "Apply or reject called on a non-PROPOSED ScheduleChange.  The §1.2.1 'apply-vs-reject race' uses this for the loser." }
  - { id: ERR_CHANGE_NOT_APPLIED,                   http: 409, condition: "Revert called on a non-APPLIED ScheduleChange." }
  - { id: ERR_CHANGE_ALREADY_ACKED,                 http: 409, condition: "Revert called on an APPLIED change at least one of whose sync_envelopes has reached ACKNOWLEDGED." }
  - { id: ERR_SYNC_ENVELOPE_NOT_QUEUED,             http: 409, condition: "Sync-ack targets an envelope element whose status is not QUEUED.  Also the §1.2.1 ack-vs-revert race loser's error." }

  # --- Business safety / temporal / referential / fiscal --------------------
  - { id: ERR_STAGE_LACKS_EQUIPMENT_KIT,    http: 409, condition: "A ProgramItem's equipment_kit_codes list contains a code not in the parent Stage.equipment_kits[] array." }
  - { id: ERR_EQUIPMENT_KIT_OVERSUBSCRIBED, http: 409, condition: "Aggregate-capacity rule: the festival-wide peak simultaneous demand for an equipment kit would exceed its total_units.  Rule 8 instance 2." }
  - { id: ERR_STAGE_CHANGEOVER_OVERLAP,     http: 409, condition: "Pairwise stage-changeover-buffered overlap on the same stage.  Rule 8 instance 1." }
  - { id: ERR_ARTIST_TRAVEL_BUFFER_VIOLATION, http: 409, condition: "Gap between an artist's preceding external commitment and the new slot is less than minimum_travel_buffer_seconds.  Inclusive ≥ boundary; the test pins the equality case as accepted.  Rule 6 instance A." }
  - { id: ERR_ARTIST_MULTI_FESTIVAL_CONFLICT, http: 409, condition: "The new slot's half-open window overlaps one of the artist's external_commitments' half-open windows.  Pairs with the program-version-supersession state gate in the rule-5 instance A priority conflict." }
  - { id: ERR_ARTIST_SELF_OVERLAP,          http: 409, condition: "Two of the same artist's ProgramItems in {CONFIRMED, ANNOUNCED, ON_STAGE} overlap each other." }
  - { id: ERR_ENGINEER_TEAM_DOUBLE_BOOKED,  http: 409, condition: "A SoundEngineerTeam's closed-closed-with-warmup-gap interval set is violated by the candidate slot.  Rule 8 instance 3.  Also the §1.2.1 'two-slots-on-same-team' race loser." }
  - { id: ERR_REHEARSAL_ROOM_OVERLAP,       http: 409, condition: "Half-open intersection in the rehearsal_room_name string namespace.  An optional rule-8 third-flavour cousin." }
  - { id: ERR_CHILD_WINDOW_OUT_OF_FESTIVAL_RANGE, http: 422, condition: "A child entity's window is not contained in the festival's half-open window." }
  - { id: ERR_EXPOSURE_KIND_NOT_CONTRACTED, http: 422, condition: "ExposureAllocation.kind not in SponsorTier.contract_kinds_allowed." }
  - { id: ERR_ARTIST_NOT_ELIGIBLE_FOR_TIER, http: 422, condition: "ExposureAllocation.kind == 'artist_mention' and the parent SponsorTier's contract_kinds_allowed does not contain 'artist_mention'.  The artist-mention carve-out (the specific-flavour cousin of the generic kind-not-contracted error).  Rule 5 instance B's referential-half." }
  - { id: ERR_EXPOSURE_PROGRAM_ITEM_CROSS_FESTIVAL, http: 422, condition: "ExposureAllocation.program_item_id references a ProgramItem in a different festival." }
  - { id: ERR_TIER_CONTRACT_UNITS_EXCEEDED, http: 422, condition: "Sum of an ExposureAllocation request plus the tier's existing allocations of the same kind exceeds SponsorTier.contracted_units.  Rule 5 instance B's fiscal-half." }
  - { id: ERR_EXPOSURE_CATALOG_BELOW_DISBURSED, http: 422, condition: "Catalog PATCH would lower a kind's total_units below the currently-disbursed sum.  Also reused by EquipmentKit.total_units PATCH for the analogous floor." }
  - { id: ERR_TIER_POOL_EXHAUSTED, http: 409, condition: "The festival-wide exposure catalog pool for a given kind is exhausted at sweep time and a new allocation arrives during the sweep's advisory lock.  Companion to the §1.2.1 ERR_CONCURRENT_SWEEP_IN_PROGRESS." }
  - { id: ERR_CONCURRENT_SWEEP_IN_PROGRESS, http: 409, condition: "An exposure-allocation POST arrives while the festival's allocation sweep holds the advisory lock.  §1.2.1." }
  - { id: ERR_TICKET_ZONE_CAPACITY_EXCEEDED, http: 422, condition: "Issuance would push the zone-group's cumulative net-issued count strictly above the zone capacity.  Rule 6 instance B." }
  - { id: ERR_TICKET_ZONE_NO_STAGE, http: 422, condition: "The zone group has no tied stage from which to derive a zone capacity (the zero-capacity edge of the same metric)." }
  - { id: ERR_REFUND_EXCEEDS_PROVISIONAL, http: 422, condition: "An /_events/refund-confirmed payload reports a final cents total greater than the matching provisional figure." }
  - { id: ERR_CROSS_FESTIVAL_REFUND, http: 422, condition: "An /_events/refund-confirmed payload references a TicketType in a different festival than the targeted ScheduleChange." }
  - { id: ERR_HEADLINER_MISSING_BLOCKING_RIDER, http: 422, condition: "A HEADLINER ProgramItem is being announced with zero blocking RiderRequirements on file (the cardinality-0-vs-1 boundary).  Rule 6 instance C." }
  - { id: ERR_BLOCKING_RIDERS_UNFULFILLED, http: 422, condition: "One or more blocking RiderRequirements on the item are still un-fulfilled (fulfilled_at is null) when announce is called." }

  # --- Concurrency / idempotency / OCC ---------------------------------------
  - { id: ERR_VERSION_CONFLICT,        http: 409, condition: "If-Match header's integer doesn't match the target row's version field — the OCC contract.  AuditEntry of event_category=OCC_CONFLICT is appended." }
  - { id: ERR_IDEMPOTENCY_KEY_REUSED,  http: 409, condition: "Same idempotency_key seen within IDEMPOTENCY_WINDOW_SECONDS=86400 on the same endpoint with a different body hash." }
  - { id: ERR_TIER_POOL_RACE,          http: 409, condition: "Reserved for a sponsor-allocation race that the §1.2.1 'two-sponsors-last-unit' scenario splits into ERR_TIER_POOL_EXHAUSTED (lock-loss outcome) and the zero-units-success outcome.  Held in the catalog for forward compatibility with a sponsor-management-system retry contract.  (Optional but listed for completeness.)" }

  # --- Sponsor and exposure miscellany --------------------------------------
  - { id: ERR_EXPOSURE_ALLOCATION_NOT_DELIVERABLE, http: 409, condition: "Deliver on an allocation whose tied ProgramItem.status is not PERFORMED (or, for festival-wide allocations, the festival is not yet LIVE).  Rule 7 instance C's failure mode." }
  - { id: ERR_EXPOSURE_ALLOCATION_TERMINAL, http: 409, condition: "Deliver or void on an allocation already in VOIDED or REPORTED status." }

  # --- Clock / events / sweep ----------------------------------------------
  - { id: ERR_CLOCK_ADVANCE_BACKWARD, http: 400, condition: "POST /_clock/advance carrying a negative delta_seconds or a to_unix_seconds in the past.  The clock is monotonic non-decreasing." }
  - { id: ERR_CLOCK_INVALID_ARGS, http: 400, condition: "POST /_clock/advance with neither delta_seconds nor to_unix_seconds, or with both." }
  - { id: ERR_SWEEP_FESTIVAL_NOT_FOUND, http: 404, condition: "POST /_sweep/run with a festival_id that does not resolve." }
  - { id: ERR_SYNC_TARGET_UNKNOWN, http: 400, condition: "POST /_events/sync-ack with a target string outside {ticketing, im, broadcasting, sponsor}." }

# -----------------------------------------------------------------------------
# §1.7  RBAC Matrix
# -----------------------------------------------------------------------------
roles:

  - name: FestivalProducer
    description: "Owns the festival's lifecycle, the program-version draft-and-publish workflow, and the apply path on ScheduleChanges.  May read the audit log."
    identity: opaque
    exclusive_operations:
      - "POST /festivals (create festival)"
      - "POST /festivals/{fid}/open-scheduling"
      - "POST /festivals/{fid}/program-versions/* (create, submit-for-review, publish, withdraw)"
      - "POST /festivals/{fid}/schedule-changes (create, apply, reject, revert)"
      - "POST /festivals/{fid}/exposure-catalog (seed and PATCH)"
    shared_operations:
      - "POST /festivals/{fid}/cancel (shared with PlatformAdmin)"
      - "POST /festivals/{fid}/stages (shared with StageManager)"
      - "POST /festivals/{fid}/equipment-kits (shared with StageManager)"
      - "POST /artists (shared with ArtistLiaison, PlatformAdmin)"
      - "POST /festivals/{fid}/program-items (shared with ArtistLiaison)"
      - "PATCH /festivals/{fid}/program-items/{piid} (shared with ArtistLiaison)"
      - "POST /festivals/{fid}/program-items/{piid}/confirm (shared with ArtistLiaison)"
      - "POST /festivals/{fid}/program-items/{piid}/cancel (shared with ArtistLiaison)"
      - "POST /festivals/{fid}/program-items/{piid}/sound-check/waive (shared with StageManager)"
      - "POST /festivals/{fid}/sponsor-tiers (shared with SponsorshipAdmin)"
      - "POST /festivals/{fid}/sponsor-allocation-sweep (shared with SponsorshipAdmin)"
      - "POST /festivals/{fid}/program-items/{piid}/recompute-priority (shared with PlatformAdmin)"
      - "GET /festivals/{fid}/audit-entries (shared with AuditViewer and PlatformAdmin)"
      - "All GETs."

  - name: ArtistLiaison
    description: "Handles artists, riders, the program-item lifecycle short of publish, and the return-for-revision edge of the program-version cycle."
    identity: opaque
    exclusive_operations:
      - "POST /artists (also shared, but the primary actor is ArtistLiaison)"
      - "PATCH /artists/{aid}"
      - "POST /festivals/{fid}/program-versions/{vid}/return-for-revision"
      - "POST /festivals/{fid}/program-items"
      - "PATCH /festivals/{fid}/program-items/{piid}"
      - "POST /festivals/{fid}/program-items/{piid}/confirm"
      - "POST /festivals/{fid}/program-items/{piid}/announce"
      - "POST /festivals/{fid}/program-items/{piid}/cancel (shared with FestivalProducer)"
      - "POST /festivals/{fid}/program-items/{piid}/riders"
      - "PATCH /festivals/{fid}/program-items/{piid}/riders/{rid}"
    shared_operations:
      - "All GETs."

  - name: StageManager
    description: "Owns stages, equipment kits, sound-engineer teams, sound-check slots, and rehearsals.  May waive a program-item's sound-check."
    identity: opaque
    exclusive_operations:
      - "POST and PATCH on /festivals/{fid}/stages"
      - "POST /festivals/{fid}/sound-engineer-teams"
      - "POST /festivals/{fid}/sound-engineer-teams/{tid}/withdraw"
      - "POST /festivals/{fid}/program-items/{piid}/sound-checks"
      - "PATCH /festivals/{fid}/sound-checks/{scid}"
      - "POST /festivals/{fid}/sound-checks/{scid}/complete"
      - "POST /festivals/{fid}/sound-checks/{scid}/cancel"
      - "POST /festivals/{fid}/rehearsals"
      - "POST /festivals/{fid}/rehearsals/{rid}/cancel"
    shared_operations:
      - "POST /festivals/{fid}/equipment-kits and the PATCH variant (shared with FestivalProducer)."
      - "POST /festivals/{fid}/program-items/{piid}/sound-check/waive (shared with FestivalProducer)."
      - "All GETs."

  - name: TicketingAdmin
    description: "Owns ticket types and their issuance, suspension/resumption.  Receives the four-target sync-envelope's ticketing leg via /_events/refund-confirmed."
    identity: opaque
    exclusive_operations:
      - "POST /festivals/{fid}/ticket-types"
      - "POST /festivals/{fid}/ticket-types/{ttid}/issue"
      - "POST /festivals/{fid}/ticket-types/{ttid}/suspend"
      - "POST /festivals/{fid}/ticket-types/{ttid}/resume"
    shared_operations:
      - "All GETs."

  - name: SponsorshipAdmin
    description: "Owns sponsor tiers, the catalog, the waterfall sweep, individual exposure-allocations, and the fulfilment report.  Also a permissible cascade-source-actor for void-delivery in the parent-ProgramItem-cancel cascade B (the implementation logs the actor as 'system' for those auto-emitted void-deliveries)."
    identity: opaque
    exclusive_operations:
      - "POST /festivals/{fid}/sponsor-tiers (shared with FestivalProducer)"
      - "POST /festivals/{fid}/sponsor-tiers/{stid}/exposure-allocations"
      - "POST /festivals/{fid}/exposure-allocations/{aid}/deliver"
      - "POST /festivals/{fid}/exposure-allocations/{aid}/void-delivery"
      - "POST /festivals/{fid}/sponsor-allocation-sweep (shared with FestivalProducer)"
    shared_operations:
      - "GET /festivals/{fid}/sponsor-tiers/{stid}/fulfilment-report (shared with FestivalProducer and AuditViewer)."
      - "POST /_sweep/run (shared with PlatformAdmin)."
      - "All GETs."

  - name: AuditViewer
    description: "Read-only role on the audit log and on the fulfilment report.  No mutating operations.  This role exists to surface the audit-log access-control restriction the scenario hints at ('audit logging for schedule changes and exposure records' is a regulatory concern and a separate role is the standard way to express that)."
    identity: opaque
    exclusive_operations: []
    shared_operations:
      - "GET /festivals/{fid}/audit-entries (shared with FestivalProducer and PlatformAdmin)."
      - "GET /festivals/{fid}/sponsor-tiers/{stid}/fulfilment-report."
      - "GET /_clock (shared with PlatformAdmin)."
      - "All other GETs."

  - name: PlatformAdmin
    description: "Superuser on operational endpoints: clock advance, external-event ingress, sweep, and festival-level cancel.  Not the standard actor on resource CRUD — those go through the per-domain roles."
    identity: opaque
    exclusive_operations:
      - "POST /_clock/advance"
      - "POST /_events/sync-ack"
      - "POST /_events/refund-confirmed"
      - "POST /_sweep/run (shared with SponsorshipAdmin)"
      - "POST /festivals/{fid}/cancel (shared with FestivalProducer)"
      - "POST /artists (shared with ArtistLiaison)"
      - "PATCH /artists/{aid} (shared with ArtistLiaison)"
      - "POST /festivals/{fid}/program-items/{piid}/recompute-priority (shared with FestivalProducer)"
    shared_operations:
      - "GET /festivals/{fid}/audit-entries."
      - "All GETs."

  - name: Any
    description: "Synthetic catch-all label used in the endpoint table when a GET is open to every authenticated role.  Not a real role — every request still presents a concrete X-User-Role from the list above, and the audit-log gate on /audit-entries is enforced regardless of the 'Any' shorthand."
    identity: opaque
    exclusive_operations: []
    shared_operations: ["all GETs that list 'Any' in their roles[]"]

