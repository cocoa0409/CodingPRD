      - call: POST /va-loans/entitlement-restoration-requests/${rest25}/grant
        payload: {}
        as: ProgramAdmin
        as_user_id: admin-1
      - call: GET /va-loans/veterans/${v25}/entitlement-account
        as: LoanOfficer
        as_user_id: lo-1
        captures:
          inv_charged: $.data[0].total_charged_cents
          inv_restored: $.data[0].total_restored_cents
          inv_remaining: $.data[0].remaining_with_bonus_cents
      assert:
      - 'after close (forward action): remaining_with_bonus_cents == 11663750 (${inv_after_charge})'
      - 'after grant (compensating action): total_charged_cents == 7500000'
      - 'after grant: total_restored_cents == 7500000'
      - 'after grant: remaining_with_bonus_cents == 19163750'
      - 'invariant: total_charged_cents - total_restored_cents + remaining_with_bonus_cents == 19163750 at every step'
  - name: assumption_substitution_conserves_global_entitlement
    grounds:
    - state_machines.AssumptionRequest.SUBMITTED_to_APPROVED
    - entities.AssumptionRequest.fields.substitute_entitlement
    distinguishing_aspect: "Conserved quantity = system-wide entitlement in use: an approved\nassumption WITH substitution moves the 7500000 charge\
      \ from seller to\nbuyer (seller restored +7500000, buyer charged +7500000), leaving\nSUM over all EntitlementAccounts of (total_charged_cents\
      \ -\ntotal_restored_cents) == 7500000 unchanged \u2014 a different conserved\nquantity (cross-account sum) than the single-account capacity\n\
      invariant.\n"
    test_recipe:
      setup:
      - Seller v26s with CLOSED loan26 ($300,000, charge 7500000); buyer veteran v26b with full entitlement (no loans)
      - AssumptionRequest asm26 substitute_entitlement=true created BEFORE payoff (loan still CLOSED)
      setup_api_calls:
      - call: POST /va-loans/veterans
        payload:
          full_name: V Sell
          ssn_last4: '1032'
          service_category: REGULAR_MILITARY
          character_of_discharge: HONORABLE
          receives_disability_compensation: false
        as: LoanOfficer
        as_user_id: lo-1
        captures:
          v26s: $.data.id
      - call: POST /va-loans/veterans/${v26s}/service-periods
        payload:
          branch: ARMY
          start_date: '2020-01-10'
          end_date: '2022-06-15'
          discharge_character: HONORABLE
        as: LoanOfficer
        as_user_id: lo-1
      - call: POST /va-loans/veterans/${v26s}/coe-requests
        payload:
          entitlement_code: ERA_GULF
        as: LoanOfficer
        as_user_id: lo-1
        captures:
          coe26s: $.data.id
      - call: POST /va-loans/coe-requests/${coe26s}/issue
        payload: {}
        as: ProgramAdmin
        as_user_id: admin-1
      - call: POST /va-loans/veterans/${v26s}/loans
        payload:
          coe_id: ${coe26s}
          purpose: PURCHASE
          property_region: SOUTH
          purchase_price_cents: 30000000
          down_payment_cents: 0
          interest_rate_percent: 6.5
          rate_type: FIXED
        as: LoanOfficer
        as_user_id: lo-1
        captures:
          loan26: $.data.id
      - call: POST /va-loans/appraisers
        payload:
          name: App S12
          region: SOUTH
        as: ProgramAdmin
        as_user_id: admin-1
        captures:
          appS12: $.data.id
      - call: POST /va-loans/loans/${loan26}/appraisal-requests
        payload: {}
        as: LoanOfficer
        as_user_id: lo-1
        captures:
          apr26: $.data.id
      - call: POST /va-loans/appraisal-requests/${apr26}/submit-report
        payload:
          outcome: VALUE_ISSUED
          appraised_value_cents: 30000000
        as: Appraiser
        as_user_id: ${appS12}
      - call: POST /va-loans/loans/${loan26}/underwriting-decisions
        payload:
          gross_monthly_income_cents: 600000
          new_housing_payment_cents: 150000
          other_obligations_annual_cents: []
          family_size: 4
          region: SOUTH
        as: Underwriter
        as_user_id: uw-1
      - call: POST /va-loans/loans/${loan26}/close
        payload:
          closing_date: '2026-03-10'
          first_payment_due_date: '2026-05-01'
        as: LoanOfficer
        as_user_id: lo-1
      - call: POST /va-loans/veterans
        payload:
          full_name: V Buy
          ssn_last4: '1033'
          service_category: REGULAR_MILITARY
          character_of_discharge: HONORABLE
          receives_disability_compensation: false
        as: LoanOfficer
        as_user_id: lo-1
        captures:
          v26b: $.data.id
      - call: POST /va-loans/veterans/${v26b}/service-periods
        payload:
          branch: NAVY
          start_date: '2019-03-01'
          end_date: '2019-06-30'
          discharge_character: HONORABLE
        as: LoanOfficer
        as_user_id: lo-1
      - call: POST /va-loans/loans/${loan26}/assumption-requests
        payload:
          buyer_name: V Buy
          buyer_is_veteran: true
          buyer_veteran_id: ${v26b}
          substitute_entitlement: true
          release_of_liability: true
        as: LoanOfficer
        as_user_id: lo-1
        captures:
          asm26: $.data.id
      trigger:
      - call: POST /va-loans/assumption-requests/${asm26}/approve
        payload: {}
        as: Underwriter
        as_user_id: uw-1
        captures:
          asm26_status: $.data.status
      - call: GET /va-loans/veterans/${v26s}/entitlement-account
        as: LoanOfficer
        as_user_id: lo-1
        captures:
          s26_charged: $.data[0].total_charged_cents
          s26_restored: $.data[0].total_restored_cents
          s26_rem: $.data[0].remaining_with_bonus_cents
      - call: GET /va-loans/veterans/${v26b}/entitlement-account
        as: LoanOfficer
        as_user_id: lo-1
        captures:
          b26_charged: $.data[0].total_charged_cents
          b26_rem: $.data[0].remaining_with_bonus_cents
      assert:
      - AssumptionRequest.${asm26}.status == APPROVED
      - 'seller account: total_charged_cents == 7500000 AND total_restored_cents == 7500000 AND remaining_with_bonus_cents == 19163750'
      - 'buyer account: total_charged_cents == 7500000 AND remaining_with_bonus_cents == 11663750'
      - 'global invariant: (seller charged - seller restored) + (buyer charged - buyer restored) == 7500000, identical to the pre-approval sum'
