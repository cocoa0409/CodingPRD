  - committed_cases_per_quarter
  - tier_breaks
  - quarter_start
  output: ManufacturingAgreement
  side_effects: []
- method: GET
  path: /mfg/agreements
  description: List agreements; BrandCustomerRep must pass own customer_id
  roles:
  - PlantAdmin
  - ProductionPlanner
  - QualityManager
  - BrandCustomerRep
  code: 200
  input:
  - customer_id?
  - status?
  - limit?
  - offset?
  output: ManufacturingAgreement[]
  side_effects: []
- method: GET
  path: /mfg/agreements/{id}
  description: Read one agreement incl. computed quarter rollup
  roles:
  - PlantAdmin
  - ProductionPlanner
  - QualityManager
  - BrandCustomerRep
  code: 200
  input: []
  output: ManufacturingAgreement
  side_effects: []
- method: POST
  path: /mfg/agreements/{id}/activate
  description: NEGOTIATION -> ACTIVE
  roles:
  - PlantAdmin
  code: 200
  input: []
  output: ManufacturingAgreement
  side_effects:
  - increments agreement.version
- method: POST
  path: /mfg/agreements/{id}/suspend
  description: ACTIVE -> SUSPENDED
  roles:
  - PlantAdmin
  code: 200
  input: []
  output: ManufacturingAgreement
  side_effects:
  - increments agreement.version
- method: POST
  path: /mfg/agreements/{id}/resume
  description: SUSPENDED -> ACTIVE
  roles:
  - PlantAdmin
  code: 200
  input: []
  output: ManufacturingAgreement
  side_effects:
  - increments agreement.version
- method: POST
  path: /mfg/agreements/{id}/terminate
  description: ACTIVE|SUSPENDED -> TERMINATED (terminal)
  roles:
  - PlantAdmin
  code: 200
  input: []
  output: ManufacturingAgreement
  side_effects:
  - increments agreement.version
- method: GET
  path: /mfg/agreements/{id}/quote
  description: Tiered pricing quote for a case volume under this agreement's pricing_mode (agreement_case_pricing)
  roles:
  - PlantAdmin
  - ProductionPlanner
  - BrandCustomerRep
  code: 200
  input:
  - cases
  output:
    cases: integer
    total_cents: integer
    per_case_cents: integer
  side_effects: []
- method: POST
  path: /mfg/formulas
  description: Create a formula for a brand customer
  roles:
  - FormulationScientist
  - BrandCustomerRep
  code: 201
  input:
  - customer_id
  - name
  - bar_weight_g
  - serving_count_per_bar?
  - status?
  output: Formula
  side_effects:
  - customer must be ACTIVE else ERR_CUSTOMER_SUSPENDED
- method: GET
  path: /mfg/formulas
  description: List formulas; BrandCustomerRep must pass own customer_id
  roles:
  - PlantAdmin
  - FormulationScientist
  - QualityManager
  - ProductionPlanner
  - LabTechnician
  - BrandCustomerRep
  code: 200
  input:
  - customer_id?
  - status?
  - limit?
  - offset?
  output: Formula[]
  side_effects: []
- method: GET
  path: /mfg/formulas/{id}
  description: Read one formula incl. computed approved_revision_id
  roles:
  - PlantAdmin
  - FormulationScientist
  - QualityManager
  - ProductionPlanner
  - LabTechnician
  - BrandCustomerRep
  code: 200
  input: []
  output: Formula
  side_effects: []
- method: POST
  path: /mfg/formulas/{id}/revisions
  description: Create a DRAFT revision of the formula
  roles:
  - FormulationScientist
  code: 201
  input:
  - ingredient_lines
  - batch_size_kg
  - target_protein_g_per_serving
  - claim_tags?
  output: FormulaRevision
  side_effects:
  - revision_no assigned
  - allergen_profile computed
- method: GET
  path: /mfg/formulas/{id}/revisions
  description: List revisions of a formula
  roles:
  - PlantAdmin
  - FormulationScientist
  - QualityManager
  - ProductionPlanner
  - LabTechnician
  - BrandCustomerRep
  code: 200
  input:
  - status?
  - limit?
  - offset?
  output: FormulaRevision[]
  side_effects: []
- method: GET
  path: /mfg/revisions/{id}
  description: Read one revision incl. label/composite protein
  roles:
  - PlantAdmin
  - FormulationScientist
  - QualityManager
  - ProductionPlanner
  - LabTechnician
  - BrandCustomerRep
  code: 200
  input: []
  output: FormulaRevision
  side_effects: []
- method: POST
  path: /mfg/revisions/{id}/submit
  description: DRAFT -> SUBMITTED
  roles:
  - FormulationScientist
  code: 200
  input: []
  output: FormulaRevision
  side_effects:
  - increments revision.version
- method: POST
  path: /mfg/revisions/{id}/verify-nutrition
  description: SUBMITTED -> NUTRITION_VERIFIED; computes LABEL protein
  roles:
  - QualityManager
  code: 200
  input: []
  output: FormulaRevision
  side_effects:
  - computes label_protein_g_per_serving
  - recomputes ClaimReview.substantiation_ok
  - increments revision.version
- method: POST
  path: /mfg/revisions/{id}/send-claim-review
  description: NUTRITION_VERIFIED -> CLAIM_REVIEW
  roles:
  - FormulationScientist
  code: 200
  input: []
  output: FormulaRevision
  side_effects:
  - increments revision.version
- method: POST
  path: /mfg/revisions/{id}/approve
  description: CLAIM_REVIEW -> APPROVED; CASCADE-SUPERSEDE
  roles:
  - QualityManager
  code: 200
  input: []
  output: FormulaRevision
  side_effects:
  - supersedes prior APPROVED revision
  - cancels its open runs, releases their slots/changeovers/reservations
  - recomputes Formula.approved_revision_id
  - increments revision.version
- method: POST
  path: /mfg/revisions/{id}/reject-back
  description: CLAIM_REVIEW -> DRAFT (cycle)
  roles:
  - QualityManager
  code: 200
  input: []
  output: FormulaRevision
  side_effects:
  - increments revision.version
- method: GET
  path: /mfg/revisions/{id}/shelf-life-studies
  description: List shelf-life studies of a revision
  roles:
  - PlantAdmin
  - FormulationScientist
  - QualityManager
  - LabTechnician
  code: 200
  input:
  - limit?
  - offset?
  output: ShelfLifeStudy[]
  side_effects: []
- method: GET
  path: /mfg/revisions/{id}/claim-reviews
  description: List claim reviews of a revision
  roles:
  - PlantAdmin
  - FormulationScientist
  - QualityManager
  - BrandCustomerRep
  code: 200
  input:
  - limit?
  - offset?
  output: ClaimReview[]
  side_effects: []
- method: POST
  path: /mfg/lines
