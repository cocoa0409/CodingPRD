              captures: { cl2: $.data.id }
            - call: "POST /trustee/cases/${case_id}/claims"
              payload: { creditor_id: "${cred_d}", received_at: "2026-02-03T00:00:00Z", filed_amount_cents: 100000, priority_class: "GENERAL_UNSECURED" }
              as: Creditor
              as_user_id: "${cred_d}"
              captures: { cl3: $.data.id }
            - call: "POST /trustee/claims/${cl1}/review"
              payload: {}
              as: Trustee
              as_user_id: "trust-0001"
            - call: "POST /trustee/claims/${cl1}/allow"
              payload: {}
              as: Trustee
              as_user_id: "trust-0001"
            - call: "POST /trustee/claims/${cl2}/review"
              payload: {}
              as: Trustee
              as_user_id: "trust-0001"
            - call: "POST /trustee/claims/${cl2}/allow"
              payload: {}
              as: Trustee
