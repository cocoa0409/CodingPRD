      - name: a_standard_truck_cannot_run_a_longer_combination_route
        claim_type: violation_to_error
        grounds:
          - validations[priority=80]
          - errors[ERR_PERMIT_CLASS_INSUFFICIENT]
          - entities.Truck.fields.permit_class
        distinguishing_aspect: |
          Permit ranks are STANDARD 1, DIVISIBLE_LOAD_PERMIT 2 and LONGER_COMBINATION 3, and
          the truck's rank must be at least the route's. With the carrier fully compliant at
          score 100, nothing above priority 80 fires and ERR_PERMIT_CLASS_INSUFFICIENT is the
          unmasked answer.
        test_recipe:
          setup:
