          assert: ["error_id == ERR_FORBIDDEN_ROLE"]

      - name: rbac_scheduler_cannot_generate_invoice
        claim_type: role_denial
        grounds: [roles]
        distinguishing_aspect: "PressScheduler calling POST /invoices -> 403; invoicing is PlantManager-exclusive."
        test_recipe:
          setup: ["empty DB"]
          setup_api_calls: []
          trigger:
            - { call: "POST /invoices", payload: { job_id: "8a3e1c0b-2f4d-4a91-9c8b-12e7b6a0f1d2" }, as: PressScheduler, captures: { err: $.data.error_id } }
          assert: ["error_id == ERR_FORBIDDEN_ROLE"]

