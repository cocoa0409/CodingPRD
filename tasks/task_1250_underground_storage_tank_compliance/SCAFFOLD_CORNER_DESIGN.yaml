              as_user_id: "owner-1"
              captures: { err: $.data.error_id }
          assert:
            - "${err} == ERR_CLAIM_RELEASE_MISMATCH (release ${rel2} belongs to ${fac2})"

      - name: fees_not_current_blocks_claim
        claim_type: violation_to_error
        grounds:
          - validations[priority=18]
          - errors[ERR_FEES_NOT_CURRENT]
        distinguishing_aspect: "Fund eligibility requires annual_fee_paid_through >= clock; a lapsed-fee facility with a CONFIRMED release and clean posture still gets ERR_FEES_NOT_CURRENT."
        test_recipe:
          setup: ["Facility ACTIVE with fees paid through 2026-06-01 and a CONFIRMED release; clock advanced to 2026-07-01"]
          setup_api_calls:
            - { call: "POST /_clock/set_current_utc", payload: { to_iso8601: "2026-05-01T00:00:00Z" }, as: ContractorAdmin }
            - { call: "POST /facilities", payload: { facility_name: "Fee Site", state_code: "CA", annual_fee_paid_through: "2026-06-01T00:00:00Z", fund_program_election: "PER_OCCURRENCE" }, as: FacilityOwner, as_user_id: "owner-1", captures: { fac: $.data.id } }
            - { call: "POST /tank-systems", payload: { facility_id: "${fac}", tank_tag: "T1", substance: "GASOLINE", capacity_gallons: 8000, installed_on: "2018-01-01T00:00:00Z", tank_construction: "FRP", piping_type: "SUCTION", release_detection_mode: "ATG_INVENTORY" }, as: FacilityOwner, as_user_id: "owner-1", captures: { tank: $.data.id } }
            - { call: "POST /facilities/${fac}/activate", payload: {}, as: FacilityOwner, as_user_id: "owner-1" }
            - { call: "POST /tank-systems/${tank}/place-in-service", payload: {}, as: FacilityOwner, as_user_id: "owner-1" }
            - { call: "POST /release-events", payload: { facility_id: "${fac}", discovered_at: "2026-05-01T08:00:00Z", source_description: "sheen" }, as: FacilityOwner, as_user_id: "owner-1", captures: { rel: $.data.id } }
            - { call: "POST /release-events/${rel}/confirm", payload: {}, as: StateRegulator }
            - { call: "POST /_clock/set_current_utc", payload: { to_iso8601: "2026-07-01T00:00:00Z" }, as: ContractorAdmin }
          trigger:
            - call: "POST /fund-claims"
              payload: { facility_id: "${fac}", release_event_id: "${rel}", expense_lines: [{ description: "cleanup", amount_cents: 3000000 }] }
              as: FacilityOwner
              as_user_id: "owner-1"
              captures: { err: $.data.error_id }
            - { call: "GET /fund-claims?facility_id=${fac}", as: Any }
          assert:
            - "${err} == ERR_FEES_NOT_CURRENT (annual_fee_paid_through 2026-06-01 < clock 2026-07-01)"
