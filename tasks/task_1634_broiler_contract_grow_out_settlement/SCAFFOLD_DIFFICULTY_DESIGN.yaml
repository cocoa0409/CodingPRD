            - { call: "POST /api/houses", payload: { grower_id: "${g}", house_no: "H1", capacity_birds: 20000 }, as: IntegratorAdmin, captures: { h: $.data.id } }
            - { call: "POST /api/contracts", payload: { grower_id: "${g}", contract_no: "C-W", base_pay_cents_per_lb: 6, committed_house_count: 1, term_start_date: "2026-01-01", term_end_date: "2027-01-01" }, as: IntegratorAdmin, captures: { c: $.data.id } }
            - { call: "POST /api/contracts/${c}/activate", payload: {}, as: IntegratorAdmin }
            - { call: "POST /api/settlement-groups", payload: { group_code: "WK-38", week_ending_date: "2026-10-24" }, as: SettlementAnalyst, captures: { grp: $.data.id } }
            - { call: "POST /api/flocks", payload: { house_id: "${h}", contract_id: "${c}", settlement_group_id: "${grp}", flock_no: "F-W" }, as: IntegratorAdmin, captures: { f: $.data.id } }
            - { call: "POST /api/flocks/${f}/placements", payload: { scheduled_date: "2026-08-01", head_count: 10000 }, as: IntegratorAdmin, captures: { p: $.data.id } }
            - { call: "POST /api/placements/${p}/confirm", payload: {}, as: IntegratorAdmin }
            - { call: "POST /api/flocks/${f}/feed-deliveries", payload: { delivered_date: "2026-08-10", feed_lbs: 100000, feed_type: STARTER, ticket_no: "FT-W1" }, as: IntegratorAdmin }
            - { call: "POST /api/catch-crews", payload: { crew_code: "CREW-W", max_catches_per_day: 2 }, as: LivehaulScheduler, captures: { crew: $.data.id } }
            - { call: "POST /api/_clock/set_current_utc", payload: { to_iso8601: "2026-09-10T00:00:00Z" }, as: IntegratorAdmin }
            - { call: "POST /api/flocks/${f}/catch-schedules", payload: { crew_id: "${crew}", catch_date: "2026-09-10" }, as: LivehaulScheduler, captures: { cs: $.data.id } }
            - { call: "POST /api/flocks/${f}/weight-tickets", payload: { ticket_no: "WT-W1", weighed_at: "2026-09-10T08:00:00Z", live_weight_lbs: 50000 }, as: LivehaulScheduler }
            - { call: "POST /api/catch-schedules/${cs}/complete", payload: {}, as: LivehaulScheduler }
            - { call: "POST /api/settlement-groups/${grp}/lock", payload: {}, as: SettlementAnalyst }
            - { call: "GET /api/flocks/${f}/settlement", payload: {}, as: SettlementAnalyst, captures: { s: "$.data[0].id" } }
          trigger:
            - { call: "POST /api/settlements/${s}/approve", payload: {}, as: SettlementAnalyst }
            - { call: "GET /api/growers/${g}/loans", payload: {}, as: IntegratorAdmin, captures: { l1_out: "$.data[0].outstanding_cents", l2_out: "$.data[1].outstanding_cents" } }
          assert:
            - "settlement loan_repayment_cents == 46875 (single-member group: base 300000; group_avg_fcr == adj_fcr 1.96 so bonus 0.25 c/lb = 12500; subtotal 312500; repay min(0.15*312500, 120000) = 46875)"
            - "oldest loan ${loan1} outstanding_cents == 0 and status REPAID (30000 absorbed first)"
            - "second loan ${loan2} outstanding_cents == 90000 - (46875 - 30000) = 73125"
            - "Grower.${g}.loan_outstanding_cents == 73125 (hop 2 recomputed from loan mutation)"
            - "Flock.${f}.status == SETTLED"

  # ------------------------------------------------------------------
  # Rule 5 — priority_pair_validation_conflict (different error-category pairs)
  # ------------------------------------------------------------------
  - rule_id: priority_pair_validation_conflict
    instances:
      - name: state_before_safety_on_placement_into_placed_house
        grounds:
          - "validations[priority=5]"
          - "validations[priority=7]"
          - "errors[ERR_INVALID_STATE]"
          - "errors[ERR_HOUSE_IN_DOWNTIME]"
        distinguishing_aspect: |
          state (priority 5) vs business_safety (priority 7) pair: a
          placement-confirm attempted on an already-CANCELLED placement whose
          house has since been QUARANTINED by a FAIL biosecurity audit must
          surface ERR_INVALID_STATE, not ERR_HOUSE_IN_DOWNTIME.
        test_recipe:
          setup:
            - "Flock F-P1B with a CANCELLED placement (scheduled 2026-09-30); its house QUARANTINED by a FAIL audit (2026-09-15 + 21 days covers the scheduled date)"
          setup_api_calls:
            - { call: "POST /api/_clock/set_current_utc", payload: { to_iso8601: "2026-08-01T00:00:00Z" }, as: IntegratorAdmin }
            - { call: "POST /api/growers", payload: { grower_code: "G-P1", full_name: "Priority Grower" }, as: IntegratorAdmin, captures: { g: $.data.id } }
            - { call: "POST /api/houses", payload: { grower_id: "${g}", house_no: "H1", capacity_birds: 10000 }, as: IntegratorAdmin, captures: { h: $.data.id } }
            - { call: "POST /api/contracts", payload: { grower_id: "${g}", contract_no: "C-P1", base_pay_cents_per_lb: 6, committed_house_count: 1, term_start_date: "2026-01-01", term_end_date: "2027-01-01" }, as: IntegratorAdmin, captures: { c: $.data.id } }
            - { call: "POST /api/contracts/${c}/activate", payload: {}, as: IntegratorAdmin }
            - { call: "POST /api/settlement-groups", payload: { group_code: "WK-39", week_ending_date: "2026-10-31" }, as: SettlementAnalyst, captures: { grp: $.data.id } }
            - { call: "POST /api/flocks", payload: { house_id: "${h}", contract_id: "${c}", settlement_group_id: "${grp}", flock_no: "F-P1" }, as: IntegratorAdmin, captures: { f1: $.data.id } }
            - { call: "POST /api/flocks/${f1}/placements", payload: { scheduled_date: "2026-08-01", head_count: 5000 }, as: IntegratorAdmin, captures: { p1: $.data.id } }
            - { call: "POST /api/placements/${p1}/confirm", payload: {}, as: IntegratorAdmin }
            - { call: "POST /api/flocks/${f1}/feed-deliveries", payload: { delivered_date: "2026-08-05", feed_lbs: 10000, feed_type: STARTER, ticket_no: "FT-P1" }, as: IntegratorAdmin }
            - { call: "POST /api/catch-crews", payload: { crew_code: "CREW-P1", max_catches_per_day: 2 }, as: LivehaulScheduler, captures: { crew: $.data.id } }
            - { call: "POST /api/_clock/set_current_utc", payload: { to_iso8601: "2026-09-10T00:00:00Z" }, as: IntegratorAdmin }
            - { call: "POST /api/flocks/${f1}/catch-schedules", payload: { crew_id: "${crew}", catch_date: "2026-09-10" }, as: LivehaulScheduler, captures: { cs1: $.data.id } }
            - { call: "POST /api/flocks/${f1}/weight-tickets", payload: { ticket_no: "WT-P1", weighed_at: "2026-09-10T08:00:00Z", live_weight_lbs: 5000 }, as: LivehaulScheduler }
            - { call: "POST /api/catch-schedules/${cs1}/complete", payload: {}, as: LivehaulScheduler }
            - { call: "POST /api/flocks", payload: { house_id: "${h}", contract_id: "${c}", settlement_group_id: "${grp}", flock_no: "F-P1B" }, as: IntegratorAdmin, captures: { f2: $.data.id } }
            - { call: "POST /api/flocks/${f2}/placements", payload: { scheduled_date: "2026-09-30", head_count: 5000 }, as: IntegratorAdmin, captures: { p2: $.data.id } }
            - { call: "POST /api/houses/${h}/audits", payload: { audit_date: "2026-09-15", result: FAIL, quarantine_days: 21 }, as: ServiceTech }
            - { call: "POST /api/placements/${p2}/cancel", payload: {}, as: IntegratorAdmin }
          trigger:
            - { call: "POST /api/placements/${p2}/confirm", payload: {}, as: IntegratorAdmin, captures: { err: $.data.error_id } }
          assert:
            - "response error_id == ERR_INVALID_STATE (placement already CANCELLED; state priority 5 beats the business_safety quarantine check at priority 7 even though the house is QUARANTINED)"

      - name: temporal_before_constraint_on_young_flock_over_capacity_catch
        grounds:
          - "validations[priority=9]"
          - "validations[priority=11]"
          - "errors[ERR_FLOCK_TOO_YOUNG]"
          - "errors[ERR_QUANTITY_INVALID]"
        distinguishing_aspect: |
          business_temporal (priority 9/10) vs business_constraint
          (priority 11) pair — a different category pair than
          state-vs-safety: a mortality report that would overshoot
          placed_head filed together with a catch-schedule attempt on a
          too-young flock surfaces ERR_FLOCK_TOO_YOUNG for the catch first;
          constraint category never reached on the catch endpoint.
