            - "Trigger 4: the area groom_coverage_pct == 63.0 and groom_ready is false and opening_state is still PREP."
            - "Trigger 7: the second task coverage_pct == 100.0 (23 * 0.75 * 0.8 * 0.9 = 12.42 acres, clamped after rounding)."
            - "Trigger 8: the area groom_coverage_pct == 100.0, groom_ready is true, and opening_state == READY - every other gate was already satisfied."
            - "The first task still reports coverage_pct 63.0; the area figure is the latest completed task, not a sum."
            - "The area last_groomed_at == '2026-08-01T00:00:00Z'."

      - name: crowding_density_at_exactly_twenty_five_does_not_trigger_the_reduction
        claim_type: constants_applied
        grounds:
          - calculations.day_guest_capacity
          - entities.DayPlan.fields.guest_capacity
          - entities.DayPlan.fields.raw_ccc
        distinguishing_aspect: |
          CROWDING_DENSITY_THRESHOLD is a strict greater-than test, so the density is engineered to land
          exactly on 25.0: a 750 pph lift gives raw_ccc floor(450.0) = 450 over 18.0 open acres. No
          reduction may apply, so guest_capacity == raw_ccc == 450. Opening a second 60 pph lift then
          nudges the density to 27.0 and the 0.85 factor engages, which is the smallest possible
          perturbation that flips the branch.
