      - name: corner_certification_issuance_derives_courier_gates
        claim_type: side_effect_execution
        grounds:
          - endpoints.POST /courier-certifications
          - state_machines.Courier.certification_state.UNCERTIFIED_to_CERTIFIED
          - entities.Courier.fields.dispatch_eligible
          - entities.CourierCertification.fields.expires_at
        distinguishing_aspect: |
          Every declared side effect of POST /courier-certifications fires in one request:
          issued_at 2026-08-01T00:00:00Z from the logical clock, expires_at 2027-08-01T00:00:00Z
          from valid_days 365, state ACTIVE, renewal_count 0, and the re-derivation that flips
          Courier.certification_state UNCERTIFIED -> CERTIFIED with dispatch_eligible true.
        test_recipe:
          setup:
            - "logical clock 2026-08-01T00:00:00Z; one OPEN partner with one courier holding no certification"
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { current_utc: "2026-08-01T00:00:00Z" }
              as: PlatformAdmin
            - call: "POST /delivery-partners"
              payload: { legal_name: "Empire Last Mile", contract_tier: "STANDARD", license_reference: "NY-DEL-0001" }
              as: PlatformAdmin
              captures: { partner: $.data.id }
            - call: "POST /couriers"
              payload: { delivery_partner_id: "${partner}", full_name: "Dana Reyes", hired_at: "2026-05-01" }
              as: PartnerManager
              as_user_id: "${partner}"
              captures: { courier: $.data.id }
          trigger:
            - call: "POST /courier-certifications"
              payload: { courier_id: "${courier}", restriction_type: "ALCOHOL", training_score: 92, training_completed_at: "2026-07-15", valid_days: 365 }
              as: PartnerManager
              as_user_id: "${partner}"
              captures: { cert: $.data.id }
          assert:
            - "HTTP status is 201"
            - "CourierCertification.${cert}.state == ACTIVE"
            - 'CourierCertification.${cert}.issued_at == "2026-08-01T00:00:00Z"'
            - 'CourierCertification.${cert}.expires_at == "2027-08-01T00:00:00Z"'
            - "CourierCertification.${cert}.renewal_count == 0"
            - "Courier.${courier}.certification_state == CERTIFIED"
            - "Courier.${courier}.dispatch_eligible == true"
            - "Courier.${courier}.compliance_score == 100.00"
            - "Courier.${courier}.compliant_handover_count == 0"

      - name: corner_plan_verification_bubbles_the_case_to_closed_verified
        claim_type: bubble_up
        grounds:
          - state_machines.CorrectiveActionPlan.transitions.ACCEPTED_to_VERIFIED
          - state_machines.ViolationCase.transitions.SUBSTANTIATED_to_CLOSED_VERIFIED
          - calculations.partner_license_risk_score.constants.CAP_VERIFIED_CREDIT
          - state_machines.DeliveryPartner.posture.RESTRICTED_to_OPEN
        distinguishing_aspect: |
          Verifying the child plan bubbles up two levels in one request: the parent case moves
          SUBSTANTIATED -> CLOSED_VERIFIED and its 40.00 CRITICAL contribution is halved by
          CAP_VERIFIED_CREDIT to 20.00, which drops DeliveryPartner.license_risk_score from
          40.00 to 20.00 and re-derives posture RESTRICTED -> OPEN.
        test_recipe:
          setup:
            - "logical clock 2026-08-20T12:00:00Z; a CRITICAL case substantiated by officer_a at that instant, so license_risk_score is 40.00 and posture is RESTRICTED"
            - "a corrective action plan filed by the partner and accepted by officer_b"
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { current_utc: "2026-08-20T12:00:00Z" }
              as: PlatformAdmin
            - call: "POST /jurisdictions"
              payload: { code: "US-NY", name: "New York", dry_status: "WET", utc_offset_minutes: -240 }
              as: PlatformAdmin
              captures: { j_ny: $.data.id }
            - call: "POST /customers"
              payload: { full_name: "Ada Lin", email: "ada@example.com", jurisdiction_id: "${j_ny}" }
              as: PlatformAdmin
              captures: { cust: $.data.id }
            - call: "POST /delivery-partners"
              payload: { legal_name: "Empire Last Mile", contract_tier: "STANDARD", license_reference: "NY-DEL-0001" }
              as: PlatformAdmin
              captures: { partner: $.data.id }
            - call: "POST /couriers"
              payload: { delivery_partner_id: "${partner}", full_name: "Dana Reyes", hired_at: "2026-05-01" }
              as: PartnerManager
              as_user_id: "${partner}"
              captures: { courier: $.data.id }
            - call: "POST /orders"
              payload: { customer_id: "${cust}", delivery_jurisdiction_id: "${j_ny}", delivery_partner_id: "${partner}", scheduled_delivery_at: "2026-08-20T18:00:00Z", delivery_fee_cents: 600 }
              as: Customer
              as_user_id: "${cust}"
              captures: { order: $.data.id }
            - call: "POST /secret-shopper-tests"
              payload: { courier_id: "${courier}", order_id: "${order}", scenario_type: "UNDERAGE_PRESENTER", scheduled_at: "2026-08-20T18:00:00Z", expected_outcome: "REFUSAL" }
              as: SecretShopperAuditor
              captures: { sst: $.data.id }
            - call: "POST /violation-cases"
              payload: { delivery_partner_id: "${partner}", secret_shopper_test_id: "${sst}", severity: "CRITICAL", summary: "Alcohol handed to an underage presenter." }
              as: ComplianceOfficer
              as_user_id: "officer_a"
              captures: { case: $.data.id }
            - call: "POST /violation-cases/${case}/investigate"
              payload: {}
              as: ComplianceOfficer
              as_user_id: "officer_a"
            - call: "POST /violation-cases/${case}/decide"
              payload: { decision: "SUBSTANTIATED", assessed_severity: "CRITICAL", notes: "Substantiated on audit evidence." }
              as: ComplianceOfficer
              as_user_id: "officer_a"
            - call: "GET /violation-cases/${case}"
              payload: {}
              as: PartnerManager
              as_user_id: "${partner}"
              captures: { case_v: $.data.version }
            - call: "POST /violation-cases/${case}/corrective-action-plans"
              payload: { expected_violation_case_version: "${case_v}", remediation_items: ["Retrain courier Dana Reyes", "Mandatory scan gate before handover"], due_at: "2026-09-30T12:00:00Z" }
              as: PartnerManager
              as_user_id: "${partner}"
              captures: { plan: $.data.id }
            - call: "POST /corrective-action-plans/${plan}/review"
              payload: { decision: "ACCEPT", notes: "Plan accepted." }
              as: ComplianceOfficer
              as_user_id: "officer_b"
          trigger:
            - call: "POST /corrective-action-plans/${plan}/verify"
              payload: { verification_outcome: "PASSED", notes: "Retraining records verified." }
              as: ComplianceOfficer
              as_user_id: "officer_b"
          assert:
            - "HTTP status is 200"
            - "CorrectiveActionPlan.${plan}.state == VERIFIED"
            - 'CorrectiveActionPlan.${plan}.verified_by_user_id == "officer_b"'
            - 'CorrectiveActionPlan.${plan}.reviewed_by_user_id == "officer_b"'
            - "ViolationCase.${case}.state == CLOSED_VERIFIED"
            - "ViolationCase.${case}.risk_contribution == 20.00"
            - 'ViolationCase.${case}.substantiated_by_user_id == "officer_a"'
            - "DeliveryPartner.${partner}.license_risk_score == 20.00"
            - "DeliveryPartner.${partner}.lifetime_risk_score == 20.00"
            - "DeliveryPartner.${partner}.posture == OPEN"
            - "DeliveryPartner.${partner}.open_case_count == 0"

      - name: corner_courier_state_is_recomputed_when_its_last_certification_is_revoked
        claim_type: compound
        grounds:
          - state_machines.CourierCertification.transitions.ACTIVE_to_REVOKED
          - state_machines.Courier.certification_state.CERTIFIED_to_UNCERTIFIED
          - entities.Courier.fields.dispatch_eligible
          - endpoints.POST /courier-certifications/{id}/revoke
        distinguishing_aspect: |
          Courier.certification_state is a compound state derived from its child certifications:
          revoking the courier's only ACTIVE row re-derives the parent from CERTIFIED to
          UNCERTIFIED and clears dispatch_eligible, while compliance_score stays 100.00 because
          revocation carries no score penalty.
        test_recipe:
          setup:
            - "logical clock 2026-08-01T00:00:00Z; one courier holding exactly one ACTIVE ALCOHOL certification (certification_state CERTIFIED)"
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { current_utc: "2026-08-01T00:00:00Z" }
              as: PlatformAdmin
            - call: "POST /delivery-partners"
              payload: { legal_name: "Empire Last Mile", contract_tier: "STANDARD", license_reference: "NY-DEL-0001" }
              as: PlatformAdmin
              captures: { partner: $.data.id }
            - call: "POST /couriers"
              payload: { delivery_partner_id: "${partner}", full_name: "Dana Reyes", hired_at: "2026-05-01" }
              as: PartnerManager
              as_user_id: "${partner}"
              captures: { courier: $.data.id }
            - call: "POST /courier-certifications"
              payload: { courier_id: "${courier}", restriction_type: "ALCOHOL", training_score: 92, training_completed_at: "2026-07-15", valid_days: 365 }
              as: PartnerManager
              as_user_id: "${partner}"
              captures: { cert: $.data.id }
          trigger:
            - call: "POST /courier-certifications/${cert}/revoke"
              payload: { revocation_reason: "Falsified training record" }
              as: ComplianceOfficer
              as_user_id: "officer_a"
          assert:
            - "HTTP status is 200"
            - "CourierCertification.${cert}.state == REVOKED"
            - 'CourierCertification.${cert}.revocation_reason == "Falsified training record"'
            - "Courier.${courier}.certification_state == UNCERTIFIED"
            - "Courier.${courier}.dispatch_eligible == false"
            - "Courier.${courier}.compliance_score == 100.00"
            - "GET /couriers/${courier}/certifications with state=ACTIVE returns total_count == 0"

      - name: corner_partner_posture_cascade_holds_dispatched_orders
        claim_type: cascade_down
        grounds:
          - state_machines.DeliveryPartner.posture.OPEN_to_RESTRICTED
          - state_machines.Order.fulfillment_state.DISPATCHED_to_HELD_AT_HUB
        excluded_because:
          difficulty_instance: transitive_cascade / door_refusal_cascades_through_case_posture_and_a_second_order
          rationale: "That §1.8 instance asserts link 4 end-to-end: the refusal-opened case raises open_case_count to 3, posture moves OPEN -> RESTRICTED, and the partner's DISPATCHED order_b lands in HELD_AT_HUB with hold_reason PARTNER_POSTURE_RESTRICTED."

      - name: corner_order_dimensions_advance_independently
        claim_type: parallel
        grounds:
          - state_machines.Order.compliance_state
          - state_machines.Order.fulfillment_state
        excluded_because:
          difficulty_instance: non_linear_state_machine / order_compliance_and_fulfillment_dimensions_move_independently
          rationale: "That §1.8 instance drives a RECIPIENT_ABSENT refusal that advances fulfillment_state to RETURN_COMPLETED while compliance_state stays PREVERIFIED, which is exactly the parallel-dimension claim."

      - name: corner_plan_revision_loop_returns_to_submitted
        claim_type: cyclic
        grounds:
          - state_machines.CorrectiveActionPlan.transitions.REVISION_REQUESTED_to_SUBMITTED
          - domain_constants.MAX_REVISION_ROUNDS
        excluded_because:
          difficulty_instance: non_linear_state_machine / corrective_action_plan_revision_cycle_bounded_at_three_rounds
          rationale: "That §1.8 instance walks the REVISION_REQUESTED -> SUBMITTED loop three times and asserts the fourth resubmit is rejected with ERR_REVISION_LIMIT_REACHED at revision_round 3."

      - name: corner_case_reopen_reverses_every_risk_side_effect
        claim_type: compensation
        grounds:
          - state_machines.ViolationCase.transitions.SUBSTANTIATED_to_UNDER_INVESTIGATION
          - entities.ViolationCase.fields.risk_contribution
        excluded_because:
          difficulty_instance: compensating_invariant / reopen_and_dismiss_restores_the_partner_license_risk_score_exactly
          rationale: "That §1.8 instance asserts the reopen path restores license_risk_score to its exact pre-decision value and zeroes risk_contribution, with no drift."

  # =========================================================================
  # Section 3 — Calculations (§1.3)
  # =========================================================================
  - section: calculations
    instances:

      - name: corner_identity_confidence_exactly_at_the_match_threshold_is_match
        claim_type: threshold
        grounds:
          - calculations.identity_prevalidation_confidence
          - calculations.identity_prevalidation_confidence.constants.MATCH_THRESHOLD
          - entities.IdentityCheck.fields.confidence
          - entities.Customer.fields.latest_identity_check_result
        distinguishing_aspect: |
          GOVERNMENT_ID_DB 0.5000 + CREDIT_BUREAU 0.2500 + WATCHLIST_NEGATIVE 0.1000 lands on
          confidence exactly 0.8500, and MATCH_THRESHOLD is compared with >= rather than >, so
          the result is MATCH (not PARTIAL) and verified_dob is taken from source_dob.
        test_recipe:
          setup:
            - "logical clock 2026-08-20T12:00:00Z; customer attested with attested_dob 2000-03-15"
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { current_utc: "2026-08-20T12:00:00Z" }
              as: PlatformAdmin
            - call: "POST /jurisdictions"
              payload: { code: "US-NY", name: "New York", dry_status: "WET", utc_offset_minutes: -240 }
              as: PlatformAdmin
              captures: { j_ny: $.data.id }
            - call: "POST /customers"
              payload: { full_name: "Ada Lin", email: "ada@example.com", jurisdiction_id: "${j_ny}" }
              as: PlatformAdmin
              captures: { cust: $.data.id }
            - call: "POST /customers/${cust}/age-attestation"
              payload: { attested_dob: "2000-03-15", attestation_channel: "WEB_CHECKBOX" }
              as: Customer
              as_user_id: "${cust}"
              captures: { cust_v: $.data.version }
          trigger:
            - call: "POST /customers/${cust}/identity-checks"
              payload: { expected_customer_version: "${cust_v}", provider: "STATE_DMV_GATEWAY", provided_dob: "2000-03-15", source_dob: "2000-03-15", source_signals: [{ source_type: "GOVERNMENT_ID_DB", matched: true }, { source_type: "CREDIT_BUREAU", matched: true }, { source_type: "WATCHLIST_NEGATIVE", matched: true }], validity_days: 90 }
              as: PlatformAdmin
              captures: { idc: $.data.id }
          assert:
            - "HTTP status is 201"
            - "IdentityCheck.${idc}.confidence == 0.8500"
            - "IdentityCheck.${idc}.result == MATCH"
            - 'IdentityCheck.${idc}.verified_dob == "2000-03-15"'
            - "IdentityCheck.${idc}.status == VALID"
            - 'IdentityCheck.${idc}.expires_at == "2026-11-18T12:00:00Z"'
            - "Customer.${cust}.latest_identity_check_result == MATCH"
            - "Customer.${cust}.attestation_state == ATTESTED"

      - name: corner_identity_confidence_dob_mismatch_penalty_drops_to_partial
        claim_type: correct_result
        grounds:
          - calculations.identity_prevalidation_confidence
          - calculations.identity_prevalidation_confidence.constants.DOB_MISMATCH_PENALTY
          - entities.IdentityCheck.fields.verified_dob
        distinguishing_aspect: |
          All four signals matched sum to 1.0000, but because provided_dob 2000-03-15 disagrees
          with source_dob 2000-03-16 while a GOVERNMENT_ID_DB signal matched, the 0.2000 penalty
          applies and the result is PARTIAL at 0.8000 with verified_dob falling back to the
          purchaser-provided 2000-03-15.
        test_recipe:
          setup:
            - "logical clock 2026-08-20T12:00:00Z; customer attested with attested_dob 2000-03-15"
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { current_utc: "2026-08-20T12:00:00Z" }
              as: PlatformAdmin
            - call: "POST /jurisdictions"
              payload: { code: "US-NY", name: "New York", dry_status: "WET", utc_offset_minutes: -240 }
              as: PlatformAdmin
              captures: { j_ny: $.data.id }
            - call: "POST /customers"
              payload: { full_name: "Ada Lin", email: "ada@example.com", jurisdiction_id: "${j_ny}" }
              as: PlatformAdmin
              captures: { cust: $.data.id }
            - call: "POST /customers/${cust}/age-attestation"
              payload: { attested_dob: "2000-03-15", attestation_channel: "WEB_CHECKBOX" }
              as: Customer
              as_user_id: "${cust}"
              captures: { cust_v: $.data.version }
          trigger:
            - call: "POST /customers/${cust}/identity-checks"
              payload: { expected_customer_version: "${cust_v}", provider: "NATIONAL_ID_VENDOR", provided_dob: "2000-03-15", source_dob: "2000-03-16", source_signals: [{ source_type: "GOVERNMENT_ID_DB", matched: true }, { source_type: "CREDIT_BUREAU", matched: true }, { source_type: "MOBILE_CARRIER", matched: true }, { source_type: "WATCHLIST_NEGATIVE", matched: true }], validity_days: 90 }
              as: ComplianceOfficer
              as_user_id: "officer_a"
              captures: { idc: $.data.id }
          assert:
            - "HTTP status is 201"
            - "IdentityCheck.${idc}.confidence == 0.8000"
            - "IdentityCheck.${idc}.result == PARTIAL"
            - 'IdentityCheck.${idc}.verified_dob == "2000-03-15"'
            - "Customer.${cust}.latest_identity_check_result == PARTIAL"

      - name: corner_identity_confidence_below_partial_threshold_is_no_match
        claim_type: correct_result
        grounds:
          - calculations.identity_prevalidation_confidence
          - calculations.identity_prevalidation_confidence.constants.PARTIAL_THRESHOLD
          - calculations.identity_prevalidation_confidence.constants.SIGNAL_WEIGHT
        distinguishing_aspect: |
          A lone matched GOVERNMENT_ID_DB signal yields confidence 0.5000, below
          PARTIAL_THRESHOLD 0.6000, so the result is NO_MATCH and verified_dob is null — the
          unmatched signals contribute nothing rather than a partial weight.
        test_recipe:
          setup:
            - "logical clock 2026-08-20T12:00:00Z; customer attested with attested_dob 2000-03-15"
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { current_utc: "2026-08-20T12:00:00Z" }
              as: PlatformAdmin
            - call: "POST /jurisdictions"
              payload: { code: "US-NY", name: "New York", dry_status: "WET", utc_offset_minutes: -240 }
              as: PlatformAdmin
              captures: { j_ny: $.data.id }
            - call: "POST /customers"
              payload: { full_name: "Ada Lin", email: "ada@example.com", jurisdiction_id: "${j_ny}" }
              as: PlatformAdmin
              captures: { cust: $.data.id }
            - call: "POST /customers/${cust}/age-attestation"
              payload: { attested_dob: "2000-03-15", attestation_channel: "MOBILE_APP" }
              as: Customer
              as_user_id: "${cust}"
              captures: { cust_v: $.data.version }
          trigger:
            - call: "POST /customers/${cust}/identity-checks"
              payload: { expected_customer_version: "${cust_v}", provider: "TELCO_VERIFY", provided_dob: "2000-03-15", source_dob: "2000-03-15", source_signals: [{ source_type: "GOVERNMENT_ID_DB", matched: true }, { source_type: "CREDIT_BUREAU", matched: false }, { source_type: "MOBILE_CARRIER", matched: false }, { source_type: "WATCHLIST_NEGATIVE", matched: false }], validity_days: 90 }
              as: PlatformAdmin
              captures: { idc: $.data.id }
          assert:
            - "HTTP status is 201"
            - "IdentityCheck.${idc}.confidence == 0.5000"
            - "IdentityCheck.${idc}.result == NO_MATCH"
            - "IdentityCheck.${idc}.verified_dob is null"
            - "Customer.${cust}.latest_identity_check_result == NO_MATCH"

      - name: corner_training_score_exactly_at_the_minimum_constant_is_accepted
        claim_type: constants_applied
        grounds:
          - domain_constants.CERT_MIN_TRAINING_SCORE
          - endpoints.POST /courier-certifications
          - errors[ERR_TRAINING_SCORE_TOO_LOW]
        distinguishing_aspect: |
          CERT_MIN_TRAINING_SCORE 80 is applied as >=: training_score 79 is rejected 422
          ERR_TRAINING_SCORE_TOO_LOW while training_score 80 on the very next call issues an
          ACTIVE certification, so the constant is used as an inclusive floor, not a strict one.
        test_recipe:
          setup:
            - "logical clock 2026-08-01T00:00:00Z; one partner with one uncertified courier"
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { current_utc: "2026-08-01T00:00:00Z" }
              as: PlatformAdmin
            - call: "POST /delivery-partners"
              payload: { legal_name: "Empire Last Mile", contract_tier: "STANDARD", license_reference: "NY-DEL-0001" }
              as: PlatformAdmin
              captures: { partner: $.data.id }
            - call: "POST /couriers"
              payload: { delivery_partner_id: "${partner}", full_name: "Dana Reyes", hired_at: "2026-05-01" }
              as: PartnerManager
              as_user_id: "${partner}"
              captures: { courier: $.data.id }
          trigger:
            - call: "POST /courier-certifications"
              payload: { courier_id: "${courier}", restriction_type: "ALCOHOL", training_score: 79, training_completed_at: "2026-07-15", valid_days: 365 }
              as: PartnerManager
              as_user_id: "${partner}"
              captures: { err: $.data.error_id }
            - call: "POST /courier-certifications"
              payload: { courier_id: "${courier}", restriction_type: "ALCOHOL", training_score: 80, training_completed_at: "2026-07-15", valid_days: 365 }
              as: PartnerManager
              as_user_id: "${partner}"
              captures: { cert: $.data.id }
          assert:
            - "first response: HTTP status 422 and data.error_id == \"ERR_TRAINING_SCORE_TOO_LOW\""
            - "second response: HTTP status 201"
            - "CourierCertification.${cert}.state == ACTIVE"
            - "CourierCertification.${cert}.training_score == 80"
            - "Courier.${courier}.certification_state == CERTIFIED"
            - "GET /couriers/${courier}/certifications returns total_count == 1"

      - name: corner_lifetime_weight_steps_down_at_exactly_ninety_days
        claim_type: decay_function
        grounds:
          - calculations.partner_license_risk_score.variants.LIFETIME_WEIGHTED
          - calculations.partner_license_risk_score.constants.DECAY_STEP_DAYS
          - calculations.partner_license_risk_score.constants.ROLLING_WINDOW_DAYS
          - endpoints.GET /delivery-partners/{id}/risk-assessment
        distinguishing_aspect: |
          At age_days exactly 90 the two age rules disagree by construction: ROLLING_90D still
          includes the case (age_days <= 90) at weight 1.00 for 15.00 points, while
          LIFETIME_WEIGHTED has already taken one decay step (floor(90/90) == 1) to weight 0.90
          for 13.50 points.
        test_recipe:
          setup:
            - "logical clock 2026-08-02T12:00:00Z; one MAJOR case substantiated at that instant (decided_at 2026-08-02T12:00:00Z) against a STANDARD partner"
            - "clock advanced to 2026-10-31T12:00:00Z, exactly 90 days later, which re-runs the risk sweep"
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { current_utc: "2026-08-02T12:00:00Z" }
              as: PlatformAdmin
            - call: "POST /jurisdictions"
