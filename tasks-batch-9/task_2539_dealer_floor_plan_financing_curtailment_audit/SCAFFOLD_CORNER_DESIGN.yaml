              captures: { c16_err: "$.data.error_id" }
          assert:
            - "${c16_released} == \"RELEASED_FOR_SALE\" and ${c16_relver} == 3"
            - "HTTP status is 409 and ${c16_err} == \"ERR_INVALID_TITLE_TRANSITION\""
            - "InventoryUnit.${c16_u}.title_custody_status is still RELEASED_FOR_SALE and version is still 3"
            - "a further attempt with new_custody_status \"LOST\" also returns 409 ERR_INVALID_TITLE_TRANSITION"

      - name: second_activate_on_an_already_active_line_returns_not_active
        claim_type: idempotency
        grounds:
          - state_machines.CreditLine.PENDING_to_ACTIVE
          - validations[priority=61]
          - errors.ERR_CREDIT_LINE_NOT_ACTIVE
        distinguishing_aspect: "activate is not idempotent by design: the second call finds the line already ACTIVE, returns 409 ERR_CREDIT_LINE_NOT_ACTIVE and leaves activated_at at the first activation instant rather than restamping it with the later clock."
        test_recipe:
          setup:
            - "Logical clock at 2026-08-01T00:00:00Z, then moved to 2026-08-08T00:00:00Z between the two calls."
            - "One Dealer with one PENDING CreditLine carrying one NEW tier."
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-08-01T00:00:00Z" }
