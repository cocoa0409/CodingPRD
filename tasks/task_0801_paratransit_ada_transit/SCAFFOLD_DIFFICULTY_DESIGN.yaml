# §1.8 Scaffold Difficulty Design (Test Targeting Index) — Expert
# Depth probe: the nine §0.5 Difficulty Rules, 2 adversarial instances each (18 total).
# Every grounds/ref resolves into SCAFFOLD.yaml §1.1–§1.7. setup_api_calls drive
# empty-DB -> precondition using only §1.5 endpoints. Numeric asserts on fully-pinned
# constants (fares, on-time window, haversine, OTP) are literals computed from §1.3;
# point-based asserts that depend on the (PRD-pinned) NO_SHOW_POINTS constant use
# invariants/relative comparisons per §1.8 contract item 6.
scaffold_difficulty_design:

  # =========================================================================
  - rule_id: dual_variant_calc
    instances:
      - name: trip_fare_provisional_vs_final_diverge_on_actual_dropoff_zone
        grounds:
          - calculations.trip_fare
          - entities.TripReservation.fields.estimated_fare_cents
          - entities.TripReservation.fields.final_fare_cents
          - state_machines.TripReservation.OFFERED_to_SCHEDULED
          - state_machines.TripReservation.PICKED_UP_to_COMPLETED
        distinguishing_aspect: |
          trip_fare's provisional variant (requested zones ZA->ZA) yields estimated_fare_cents==500
          while the final variant (actual zones ZA->ZB at dropoff) yields final_fare_cents==580 —
          same formula, divergent inputs, on the TripReservation fare domain.
        test_recipe:
          setup:
            - "Clock 2026-06-01. Two zones: ZA(base 500,fixed 290) and ZB(base 700,fixed 290)."
            - "Rider certified FULL. Trip requested ZA->ZA (same-zone), offered, accepted onto a run."
            - "Provisional computed at accept from requested same-zone -> 500. Driver picks up in ZA, drops off in ZB."
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-06-01T00:00:00Z" }
              as: Admin
            - call: "POST /service-zones"
              payload: { zone_code: "ZA", name: "Zone A", center_lat: 40.0, center_lng: -74.0, service_radius_miles: 0.75, base_fare_cents: 500, fixed_route_fare_cents: 290 }
              as: Admin
              captures: { za_id: "$.data.id" }
            - call: "POST /service-zones"
              payload: { zone_code: "ZB", name: "Zone B", center_lat: 40.05, center_lng: -74.0, service_radius_miles: 0.75, base_fare_cents: 700, fixed_route_fare_cents: 290 }
              as: Admin
              captures: { zb_id: "$.data.id" }
            - call: "POST /riders"
              payload: { full_name: "R One", phone: "555-0001", email: "r1@x.com", home_lat: 40.0, home_lng: -74.0 }
              as: EligibilitySpecialist
              captures: { r_id: "$.data.id" }
            - call: "POST /eligibility-applications"
              payload: { rider_id: "${r_id}" }
              as: EligibilitySpecialist
              captures: { app_id: "$.data.id" }
            - call: "POST /functional-assessments"
              payload: { application_id: "${app_id}", scheduled_at: "2026-06-02T10:00:00Z" }
              as: EligibilitySpecialist
              captures: { fa_id: "$.data.id" }
            - call: "POST /functional-assessments/${fa_id}/complete"
              payload: { outcome: "PASS_UNCONDITIONAL", assessed_mobility_device: "NONE" }
              as: EligibilitySpecialist
            - call: "POST /eligibility-applications/${app_id}/certify"
              payload: {}
              as: EligibilitySpecialist
            - call: "POST /vehicle-runs"
              payload: { service_zone_id: "${za_id}", service_date: "2026-06-05", total_ambulatory_seats: 4, total_wheelchair_positions: 2 }
              as: Dispatcher
              captures: { run_id: "$.data.id", run_v: "$.data.version" }
            - call: "POST /trip-reservations"
              payload: { rider_id: "${r_id}", pickup_zone_id: "${za_id}", dropoff_zone_id: "${za_id}", pickup_lat: 40.0, pickup_lng: -74.0, dropoff_lat: 40.0, dropoff_lng: -74.0, requested_pickup_at: "2026-06-05T09:00:00Z" }
              as: Rider
              as_user_id: "${r_id}"
              captures: { trip_id: "$.data.id" }
            - call: "POST /trip-reservations/${trip_id}/offer"
              payload: { proposed_pickup_at: "2026-06-05T09:00:00Z" }
              as: Dispatcher
            - call: "POST /trip-reservations/${trip_id}/accept"
              payload: { run_id: "${run_id}", expected_run_version: "${run_v}" }
              as: Rider
              as_user_id: "${r_id}"
            - call: "POST /trip-reservations/${trip_id}/pickup"
              payload: { actual_pickup_at: "2026-06-05T09:00:00Z", actual_pickup_zone_id: "${za_id}" }
              as: Driver
          trigger:
            - call: "POST /trip-reservations/${trip_id}/dropoff"
              payload: { actual_dropoff_at: "2026-06-05T09:20:00Z", actual_dropoff_zone_id: "${zb_id}" }
              as: Driver
          assert:
            - "TripReservation.${trip_id}.estimated_fare_cents == 500"
            - "TripReservation.${trip_id}.final_fare_cents == 580"
            - "TripReservation.${trip_id}.final_fare_cents != TripReservation.${trip_id}.estimated_fare_cents"
            - "TripReservation.${trip_id}.status == COMPLETED"

      - name: no_show_rolling_vs_lifetime_diverge_after_window_aging
        grounds:
          - calculations.no_show_scoring
          - entities.Rider.fields.no_show_points_rolling
          - entities.Rider.fields.no_show_points_lifetime
          - state_machines.TripReservation.SCHEDULED_to_NO_SHOW
        distinguishing_aspect: |
          no_show_scoring's rolling_window variant drops the aged NO_SHOW event (occurred_at before
          clock-ROLLING_WINDOW_DAYS) to 0 while the lifetime variant retains it (>0) — a dual variant
          on the Rider risk-scoring domain, a different entity domain than the TripReservation fare instance.
        test_recipe:
          setup:
            - "Clock 2026-06-01. Rider certified FULL, one trip scheduled then marked NO_SHOW -> PenaltyEvent occurred_at 2026-06-01."
            - "One no-show only, so rolling stays below SUSPENSION_THRESHOLD (6) and the account is not suspended."
            - "Clock then advanced to 2026-07-05 (>30 days later); rolling/lifetime are read-computed on GET."
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-06-01T00:00:00Z" }
              as: Admin
            - call: "POST /service-zones"
              payload: { zone_code: "ZA", name: "Zone A", center_lat: 40.0, center_lng: -74.0, service_radius_miles: 0.75, base_fare_cents: 500, fixed_route_fare_cents: 290 }
              as: Admin
              captures: { za_id: "$.data.id" }
            - call: "POST /riders"
              payload: { full_name: "R Two", phone: "555-0002", email: "r2@x.com", home_lat: 40.0, home_lng: -74.0 }
              as: EligibilitySpecialist
              captures: { r_id: "$.data.id" }
            - call: "POST /eligibility-applications"
              payload: { rider_id: "${r_id}" }
              as: EligibilitySpecialist
              captures: { app_id: "$.data.id" }
            - call: "POST /functional-assessments"
              payload: { application_id: "${app_id}", scheduled_at: "2026-06-02T10:00:00Z" }
              as: EligibilitySpecialist
              captures: { fa_id: "$.data.id" }
            - call: "POST /functional-assessments/${fa_id}/complete"
              payload: { outcome: "PASS_UNCONDITIONAL", assessed_mobility_device: "NONE" }
              as: EligibilitySpecialist
            - call: "POST /eligibility-applications/${app_id}/certify"
              payload: {}
              as: EligibilitySpecialist
            - call: "POST /vehicle-runs"
              payload: { service_zone_id: "${za_id}", service_date: "2026-06-05", total_ambulatory_seats: 4, total_wheelchair_positions: 2 }
              as: Dispatcher
              captures: { run_id: "$.data.id", run_v: "$.data.version" }
            - call: "POST /trip-reservations"
              payload: { rider_id: "${r_id}", pickup_zone_id: "${za_id}", dropoff_zone_id: "${za_id}", pickup_lat: 40.0, pickup_lng: -74.0, dropoff_lat: 40.0, dropoff_lng: -74.0, requested_pickup_at: "2026-06-05T09:00:00Z" }
              as: Rider
              as_user_id: "${r_id}"
              captures: { trip_id: "$.data.id" }
            - call: "POST /trip-reservations/${trip_id}/offer"
              payload: { proposed_pickup_at: "2026-06-05T09:00:00Z" }
              as: Dispatcher
            - call: "POST /trip-reservations/${trip_id}/accept"
              payload: { run_id: "${run_id}", expected_run_version: "${run_v}" }
              as: Rider
              as_user_id: "${r_id}"
            - call: "POST /trip-reservations/${trip_id}/no-show"
              payload: {}
              as: Driver
          trigger:
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-07-05T00:00:00Z" }
              as: Admin
          assert:
            - "Rider.${r_id}.no_show_points_rolling == 0"
            - "Rider.${r_id}.no_show_points_lifetime > 0"
            - "Rider.${r_id}.no_show_points_lifetime != Rider.${r_id}.no_show_points_rolling"

  # =========================================================================
  - rule_id: combinatorial_formula
    instances:
      - name: trip_fare_nonlinear_cross_zone_cap_binds_then_companions_add
        grounds:
          - calculations.trip_fare
          - state_machines.TripReservation.OFFERED_to_SCHEDULED
          - entities.TripReservation.fields.estimated_fare_cents
          - entities.TripReservation.fields.num_companions
        distinguishing_aspect: |
          Mode (a): trip_fare combines >=3 inputs with non-linear interaction — max(pickup.base,dropoff.base)+
          CROSS_ZONE_SURCHARGE, then a min() ADA cap on 2x pickup.fixed_route (the cap binds: 580<850),
          then +COMPANION_FARE*2 — producing 1130, not 850+550=1400.
        test_recipe:
          setup:
            - "Clock 2026-06-01. ZA(base 500,fixed 290), ZB(base 700,fixed 290). Rider certified FULL."
            - "Run with >=3 ambulatory seats. Trip requested ZA->ZB with num_companions=2, no wheelchair."
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-06-01T00:00:00Z" }
              as: Admin
            - call: "POST /service-zones"
              payload: { zone_code: "ZA", name: "Zone A", center_lat: 40.0, center_lng: -74.0, service_radius_miles: 0.75, base_fare_cents: 500, fixed_route_fare_cents: 290 }
              as: Admin
              captures: { za_id: "$.data.id" }
            - call: "POST /service-zones"
              payload: { zone_code: "ZB", name: "Zone B", center_lat: 40.05, center_lng: -74.0, service_radius_miles: 0.75, base_fare_cents: 700, fixed_route_fare_cents: 290 }
              as: Admin
              captures: { zb_id: "$.data.id" }
            - call: "POST /riders"
              payload: { full_name: "R Three", phone: "555-0003", email: "r3@x.com", home_lat: 40.0, home_lng: -74.0 }
              as: EligibilitySpecialist
              captures: { r_id: "$.data.id" }
            - call: "POST /eligibility-applications"
              payload: { rider_id: "${r_id}" }
              as: EligibilitySpecialist
              captures: { app_id: "$.data.id" }
            - call: "POST /functional-assessments"
              payload: { application_id: "${app_id}", scheduled_at: "2026-06-02T10:00:00Z" }
              as: EligibilitySpecialist
              captures: { fa_id: "$.data.id" }
            - call: "POST /functional-assessments/${fa_id}/complete"
              payload: { outcome: "PASS_UNCONDITIONAL", assessed_mobility_device: "NONE" }
              as: EligibilitySpecialist
            - call: "POST /eligibility-applications/${app_id}/certify"
              payload: {}
              as: EligibilitySpecialist
            - call: "POST /vehicle-runs"
              payload: { service_zone_id: "${za_id}", service_date: "2026-06-05", total_ambulatory_seats: 4, total_wheelchair_positions: 2 }
              as: Dispatcher
              captures: { run_id: "$.data.id", run_v: "$.data.version" }
            - call: "POST /trip-reservations"
              payload: { rider_id: "${r_id}", pickup_zone_id: "${za_id}", dropoff_zone_id: "${zb_id}", pickup_lat: 40.0, pickup_lng: -74.0, dropoff_lat: 40.05, dropoff_lng: -74.0, requested_pickup_at: "2026-06-05T09:00:00Z", num_companions: 2 }
              as: Rider
              as_user_id: "${r_id}"
              captures: { trip_id: "$.data.id" }
            - call: "POST /trip-reservations/${trip_id}/offer"
              payload: { proposed_pickup_at: "2026-06-05T09:00:00Z" }
              as: Dispatcher
          trigger:
            - call: "POST /trip-reservations/${trip_id}/accept"
              payload: { run_id: "${run_id}", expected_run_version: "${run_v}" }
              as: Rider
              as_user_id: "${r_id}"
          assert:
            - "TripReservation.${trip_id}.estimated_fare_cents == 1130"
            - "TripReservation.${trip_id}.status == SCHEDULED"

      - name: fleet_otp_sum_then_divide_then_round_once_not_zone_average
        grounds:
          - calculations.fleet_on_time_performance
          - calculations.pickup_on_time
          - entities.TripReservation.fields.on_time
        distinguishing_aspect: |
          Mode (b): the pinned order sums on-time (2) and totals (3) across ALL trips then divides then
          rounds once -> otp_pct==66.67; averaging the two zones' rates (100% and 0%) would give 50.00.
          The scaffold pins sum-then-divide-then-round.
        test_recipe:
          setup:
            - "Clock 2026-06-01. ZA and ZB zones. One certified rider takes three well-separated trips."
            - "Two ZA trips picked up exactly on time (on_time true); one ZB trip picked up 31 min late (on_time false)."
            - "Report is fleet-wide (no zone/date filter): 2 on-time of 3 total."
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-06-01T00:00:00Z" }
              as: Admin
            - call: "POST /service-zones"
              payload: { zone_code: "ZA", name: "Zone A", center_lat: 40.0, center_lng: -74.0, service_radius_miles: 0.75, base_fare_cents: 500, fixed_route_fare_cents: 290 }
              as: Admin
              captures: { za_id: "$.data.id" }
            - call: "POST /service-zones"
              payload: { zone_code: "ZB", name: "Zone B", center_lat: 40.05, center_lng: -74.0, service_radius_miles: 0.75, base_fare_cents: 700, fixed_route_fare_cents: 290 }
              as: Admin
              captures: { zb_id: "$.data.id" }
            - call: "POST /riders"
              payload: { full_name: "R Four", phone: "555-0004", email: "r4@x.com", home_lat: 40.0, home_lng: -74.0 }
              as: EligibilitySpecialist
              captures: { r_id: "$.data.id" }
            - call: "POST /eligibility-applications"
              payload: { rider_id: "${r_id}" }
              as: EligibilitySpecialist
              captures: { app_id: "$.data.id" }
            - call: "POST /functional-assessments"
              payload: { application_id: "${app_id}", scheduled_at: "2026-06-02T10:00:00Z" }
              as: EligibilitySpecialist
              captures: { fa_id: "$.data.id" }
            - call: "POST /functional-assessments/${fa_id}/complete"
              payload: { outcome: "PASS_UNCONDITIONAL", assessed_mobility_device: "NONE" }
              as: EligibilitySpecialist
            - call: "POST /eligibility-applications/${app_id}/certify"
              payload: {}
              as: EligibilitySpecialist
            - call: "POST /vehicle-runs"
              payload: { service_zone_id: "${za_id}", service_date: "2026-06-05", total_ambulatory_seats: 4, total_wheelchair_positions: 2 }
              as: Dispatcher
              captures: { run_a1: "$.data.id", run_a1_v: "$.data.version" }
            - call: "POST /vehicle-runs"
              payload: { service_zone_id: "${za_id}", service_date: "2026-06-05", total_ambulatory_seats: 4, total_wheelchair_positions: 2 }
              as: Dispatcher
              captures: { run_a2: "$.data.id", run_a2_v: "$.data.version" }
            - call: "POST /vehicle-runs"
              payload: { service_zone_id: "${zb_id}", service_date: "2026-06-05", total_ambulatory_seats: 4, total_wheelchair_positions: 2 }
              as: Dispatcher
              captures: { run_b: "$.data.id", run_b_v: "$.data.version" }
            - call: "POST /trip-reservations"
              payload: { rider_id: "${r_id}", pickup_zone_id: "${za_id}", dropoff_zone_id: "${za_id}", pickup_lat: 40.0, pickup_lng: -74.0, dropoff_lat: 40.0, dropoff_lng: -74.0, requested_pickup_at: "2026-06-05T09:00:00Z" }
              as: Rider
              as_user_id: "${r_id}"
              captures: { t1: "$.data.id" }
            - call: "POST /trip-reservations/${t1}/offer"
              payload: { proposed_pickup_at: "2026-06-05T09:00:00Z" }
              as: Dispatcher
            - call: "POST /trip-reservations/${t1}/accept"
              payload: { run_id: "${run_a1}", expected_run_version: "${run_a1_v}" }
              as: Rider
              as_user_id: "${r_id}"
            - call: "POST /trip-reservations/${t1}/pickup"
              payload: { actual_pickup_at: "2026-06-05T09:00:00Z", actual_pickup_zone_id: "${za_id}" }
              as: Driver
            - call: "POST /trip-reservations"
              payload: { rider_id: "${r_id}", pickup_zone_id: "${za_id}", dropoff_zone_id: "${za_id}", pickup_lat: 40.0, pickup_lng: -74.0, dropoff_lat: 40.0, dropoff_lng: -74.0, requested_pickup_at: "2026-06-05T12:00:00Z" }
              as: Rider
              as_user_id: "${r_id}"
              captures: { t2: "$.data.id" }
            - call: "POST /trip-reservations/${t2}/offer"
              payload: { proposed_pickup_at: "2026-06-05T12:00:00Z" }
              as: Dispatcher
            - call: "POST /trip-reservations/${t2}/accept"
              payload: { run_id: "${run_a2}", expected_run_version: "${run_a2_v}" }
              as: Rider
              as_user_id: "${r_id}"
            - call: "POST /trip-reservations/${t2}/pickup"
              payload: { actual_pickup_at: "2026-06-05T12:00:00Z", actual_pickup_zone_id: "${za_id}" }
              as: Driver
            - call: "POST /trip-reservations"
              payload: { rider_id: "${r_id}", pickup_zone_id: "${zb_id}", dropoff_zone_id: "${zb_id}", pickup_lat: 40.05, pickup_lng: -74.0, dropoff_lat: 40.05, dropoff_lng: -74.0, requested_pickup_at: "2026-06-05T15:00:00Z" }
              as: Rider
              as_user_id: "${r_id}"
              captures: { t3: "$.data.id" }
            - call: "POST /trip-reservations/${t3}/offer"
              payload: { proposed_pickup_at: "2026-06-05T15:00:00Z" }
              as: Dispatcher
            - call: "POST /trip-reservations/${t3}/accept"
              payload: { run_id: "${run_b}", expected_run_version: "${run_b_v}" }
              as: Rider
              as_user_id: "${r_id}"
            - call: "POST /trip-reservations/${t3}/pickup"
              payload: { actual_pickup_at: "2026-06-05T15:31:00Z", actual_pickup_zone_id: "${zb_id}" }
              as: Driver
          trigger:
            - call: "GET /reports/on-time-performance"
              payload: {}
              as: Dispatcher
          assert:
            - "report.total_pickups == 3"
            - "report.on_time_pickups == 2"
            - "report.otp_pct == 66.67"

  # =========================================================================
  - rule_id: non_linear_state_machine
    instances:
      - name: trip_negotiation_offered_countered_cycle_increments_offer_round
        grounds:
          - state_machines.TripReservation.REQUESTED_to_OFFERED
          - state_machines.TripReservation.OFFERED_to_COUNTERED
          - state_machines.TripReservation.COUNTERED_to_OFFERED
          - entities.TripReservation.fields.offer_round
        distinguishing_aspect: |
          TripReservation cycles REQUESTED->OFFERED->COUNTERED->OFFERED (cyclic, non-linear); offer_round
          increments each hop reaching 3 and status returns to OFFERED — a cycle on TripReservation, a
          different entity than the EligibilityApplication appeal cycle.
        test_recipe:
          setup:
            - "Clock 2026-06-01. Certified rider with an ad-hoc trip in REQUESTED."
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-06-01T00:00:00Z" }
              as: Admin
            - call: "POST /service-zones"
              payload: { zone_code: "ZA", name: "Zone A", center_lat: 40.0, center_lng: -74.0, service_radius_miles: 0.75, base_fare_cents: 500, fixed_route_fare_cents: 290 }
              as: Admin
              captures: { za_id: "$.data.id" }
            - call: "POST /riders"
              payload: { full_name: "R Five", phone: "555-0005", email: "r5@x.com", home_lat: 40.0, home_lng: -74.0 }
              as: EligibilitySpecialist
              captures: { r_id: "$.data.id" }
            - call: "POST /eligibility-applications"
              payload: { rider_id: "${r_id}" }
              as: EligibilitySpecialist
              captures: { app_id: "$.data.id" }
            - call: "POST /functional-assessments"
              payload: { application_id: "${app_id}", scheduled_at: "2026-06-02T10:00:00Z" }
              as: EligibilitySpecialist
              captures: { fa_id: "$.data.id" }
            - call: "POST /functional-assessments/${fa_id}/complete"
              payload: { outcome: "PASS_UNCONDITIONAL", assessed_mobility_device: "NONE" }
              as: EligibilitySpecialist
            - call: "POST /eligibility-applications/${app_id}/certify"
              payload: {}
              as: EligibilitySpecialist
            - call: "POST /trip-reservations"
              payload: { rider_id: "${r_id}", pickup_zone_id: "${za_id}", dropoff_zone_id: "${za_id}", pickup_lat: 40.0, pickup_lng: -74.0, dropoff_lat: 40.0, dropoff_lng: -74.0, requested_pickup_at: "2026-06-05T09:00:00Z" }
              as: Rider
              as_user_id: "${r_id}"
              captures: { trip_id: "$.data.id" }
            - call: "POST /trip-reservations/${trip_id}/offer"
              payload: { proposed_pickup_at: "2026-06-05T09:00:00Z" }
              as: Dispatcher
            - call: "POST /trip-reservations/${trip_id}/counter"
              payload: { proposed_pickup_at: "2026-06-05T09:30:00Z" }
              as: Rider
              as_user_id: "${r_id}"
          trigger:
            - call: "POST /trip-reservations/${trip_id}/offer"
              payload: { proposed_pickup_at: "2026-06-05T09:15:00Z" }
              as: Dispatcher
          assert:
            - "TripReservation.${trip_id}.status == OFFERED"
            - "TripReservation.${trip_id}.offer_round == 3"
            - "TripReservation.${trip_id}.current_offer_pickup_at == 2026-06-05T09:15:00Z"

      - name: eligibility_denial_appeal_reassessment_cycle_increments_appeal_count
        grounds:
          - state_machines.EligibilityApplication.ASSESSED_to_DENIED
          - state_machines.EligibilityApplication.DENIED_to_APPEALED
          - state_machines.EligibilityApplication.APPEALED_to_ASSESSMENT_SCHEDULED
          - entities.EligibilityApplication.fields.appeal_count
        distinguishing_aspect: |
          EligibilityApplication loops DENIED->APPEALED->ASSESSMENT_SCHEDULED (revision cycle) with
          appeal_count incremented to 1 — non-linear on EligibilityApplication, a different entity than
          the TripReservation negotiation cycle.
        test_recipe:
          setup:
            - "Clock 2026-06-01. Rider registered. Application assessed FAIL -> DENIED -> APPEALED."
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-06-01T00:00:00Z" }
              as: Admin
            - call: "POST /riders"
