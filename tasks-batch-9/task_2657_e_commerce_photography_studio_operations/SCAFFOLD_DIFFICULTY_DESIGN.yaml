            - "after the first attempt ShootSession.${ses_id}.session_state == \"BOOKED\""
            - "Sample.${smp_id}.custody_state == \"IN_STUDIO\" after the custody move"
            - "Style.${sty_id}.content_state == \"SAMPLE_READY\" after the custody move"
