      - name: sm_valid_transition_cycle_spine_scheduled_oven_running_cooling_demolded
        claim_type: Valid Transition
        grounds:
          - state_machines.MoldingCycle.SCHEDULED_to_OVEN_RUNNING
          - state_machines.MoldingCycle.OVEN_RUNNING_to_COOLING
          - state_machines.MoldingCycle.COOLING_to_DEMOLDED
          - state_machines.ProductionOrder.READY_TO_SCHEDULE_to_IN_PRODUCTION
          - calculations.cycle_window_projection
        distinguishing_aspect: "The three happy-path cycle triggers each land on their declared target state AND stamp their own actual timestamp from the logical clock, so actual_oven_minutes 60 and actual_cooling_minutes 35 must differ from the scheduled 60/30 the cycle was created with."
        test_recipe:
          setup:
            - "ProductModel PM-SM-SPINE (KAYAK/MID, nominal_charge_kg 24.000, charge_tolerance_pct 5.00, min_cooling_minutes 30, max_regrind_pct 30.00, melt band 2.50..6.00)."
            - "Mold MLD-SM-SPINE with cavity_count 1 and nominal_charge_kg 24.000; OvenStation OVN-SM-SPINE; CoolingBay BAY-SM-SPINE."
            - "ResinLot LOT-SM-SPINE qualified for the model with received_kg 500.000; Warehouse WHS-SM-SPINE; Technicians for the resin and operator roles."
            - "ProductionOrder POR-SM-SPINE (ordered_qty 1) RELEASED, so it is READY_TO_SCHEDULE with blocked_reason null."
            - "One ResinCharge of 24.000 kg reserved against the cycle so every start-oven resin precondition is satisfied."
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { current_utc: "2026-08-01T00:00:00Z" }
              as: PlantAdmin
              as_user_id: "admin-1"
            - call: "POST /product-models"
              payload: { model_code: "PM-SM-SPINE", hull_type: "KAYAK", size_class: "MID", resin_grade: "HDPE_LINEAR", master_color_code: "SEAFOAM", max_color_delta_e: 1.50, required_additive_package_code: "UV12", max_regrind_pct: 30.00, min_melt_index_g10min: 2.50, max_melt_index_g10min: 6.00, nominal_charge_kg: 24.000, charge_tolerance_pct: 5.00, min_cooling_minutes: 30, target_wall_thickness_mm: 6.00, wall_thickness_min_mm: 4.50, wall_cv_max_pct: 12.00, impact_test_min_joules: 90.00, gross_cube_m3: 2.0000, nest_factor: 0.5000, unit_weight_kg: 24.000, msrp_cents: 180000, warranty_basis: "PRO_RATA_AGE", initial_warranty_reserve_cents: 500000, seasonal_family: "PADDLE" }
              as: PlantAdmin
              as_user_id: "admin-1"
              captures: { pm: $.data.id }
            - call: "POST /molds"
              payload: { mold_code: "MLD-SM-SPINE", product_model_id: "${pm}", size_class: "MID", cavity_count: 1, nominal_charge_kg: 24.000, service_interval_cycles: 10 }
              as: PlantAdmin
              as_user_id: "admin-1"
              captures: { mold: $.data.id }
            - call: "POST /oven-stations"
              payload: { station_code: "OVN-SM-SPINE", arm_count: 2, max_size_class: "OVERSIZE", changeover_buffer_min: 15, energy_cents_per_min: 100 }
              as: PlantAdmin
              as_user_id: "admin-1"
              captures: { station: $.data.id }
            - call: "POST /cooling-bays"
              payload: { bay_code: "BAY-SM-SPINE", concurrent_slot_capacity: 2, airflow_mode: "FORCED_AIR" }
              as: PlantAdmin
              as_user_id: "admin-1"
              captures: { bay: $.data.id }
            - call: "POST /technicians"
              payload: { employee_code: "TEC-SM-SPINE-RES", full_name: "Rhea Resin", role_code: "RESIN_TECH", certifications: ["RESIN_BLENDING"] }
