    path: "/accreditation/complaints/{complaint_id}"
    description: "Fetch one complaint or appeal with its resolution and MRA-escalation fields."
    roles: [SchemeManager, AssessmentManager, LeadAssessor, TechnicalExpert, DecisionPanelMember, ApplicantContact, ComplaintOfficer]
    code: 200
    input: []
    output: ComplaintAppeal
    side_effects: []

  # ---------- scheme rule development ----------
  - method: POST
    path: "/accreditation/schemes"
    description: "Create an accreditation program in DRAFT with its rule set: standard alignment, witnessing floor, competence threshold, surveillance and reassessment intervals and the three nonconformity closure windows."
    roles: [SchemeManager]
    code: 201
    input: ["program_code", "name", "standard_ref", "complexity_multiplier?", "witness_min_count?", "qualification_points_required?", "surveillance_interval_days?", "reassessment_interval_days?", "critical_nc_close_days?", "major_nc_close_days?", "minor_nc_close_days?", "unannounced_authority?", "remote_assessment_allowed?"]
    output: AccreditationScheme
    side_effects: ["status DRAFT, rule_revision 1"]
  - method: POST
    path: "/accreditation/schemes/{scheme_id}/status"
    description: "Drive the scheme rule set through DRAFT, UNDER_REVIEW, PUBLISHED and WITHDRAWN. Re-opening a PUBLISHED scheme for review bumps rule_revision, which strands any in-flight cycle pinned to the older revision."
    roles: [SchemeManager]
    code: 200
    input: ["to_status", "revision_note?"]
    output: AccreditationScheme
    side_effects: ["rule_revision bump on PUBLISHED->UNDER_REVIEW", "published_at set on UNDER_REVIEW->PUBLISHED"]
  # ---------- assessor recruitment, qualification and impartiality ----------
  - method: POST
    path: "/accreditation/assessors"
    description: "Recruit an assessor or technical expert. Starts in qualification_status APPLICANT and impartiality_status UNDECLARED."
    roles: [AssessmentManager]
    code: 201
    input: ["full_name", "email", "employment_type", "annual_witness_capacity_days?"]
    output: Assessor
    side_effects: ["committed_witness_days 0, available_witness_days set to annual_witness_capacity_days"]
  - method: POST
    path: "/accreditation/assessors/{assessor_id}/qualifications"
    description: "Register the assessor's self-declared competence evidence for one scheme and role. Computes declared_points under the DECLARED_PROVISIONAL variant and moves a first-time assessor from APPLICANT to SCREENING."
    roles: [AssessmentManager]
    code: 201
    input: ["scheme_id", "role_type", "years_experience", "declared_witness_days", "declared_training_modules", "last_witness_on?"]
    output: AssessorQualification
    side_effects: ["assessor_competence_points DECLARED_PROVISIONAL", "Assessor.qualification_status APPLICANT->SCREENING on the assessor's first qualification"]
  - method: POST
    path: "/accreditation/assessors/{assessor_id}/impartiality-declarations"
    description: "File an immutable impartiality declaration against one applicant organization. The declaration's severity_class and cooling_off_months are derived from relationship_type; a later declaration for the same pair supersedes the earlier one."
    roles: [AssessmentManager, LeadAssessor, TechnicalExpert, DecisionPanelMember]
    code: 201
    input: ["organization_id", "relationship_type", "started_on", "ended_on?", "detail?"]
    output: ImpartialityDeclaration
    side_effects: ["Assessor.impartiality_status -> RESTRICTED when the new declaration is STRUCTURAL or SERVICE with a null ended_on"]
  - method: POST
    path: "/accreditation/assessors/{assessor_id}/screen"
    description: "Re-run impartiality screening for the assessor across every organization they have declared against, and admit a SCREENING assessor to QUALIFIED. Sets impartiality_status to SCREENED when no latest declaration blocks, RESTRICTED otherwise."
    roles: [SchemeManager]
    code: 200
    input: []
    output: Assessor
    side_effects: ["impartiality_conflict_verdict re-evaluated for every declared organization", "last_screened_on set to the current logical-clock date", "qualification_status SCREENING->QUALIFIED"]
  - method: POST
    path: "/accreditation/assessors/{assessor_id}/status"
    description: "Suspend, reinstate or withdraw an assessor. Suspension and withdrawal cascade into team assignments and scheduled witnessing."
    roles: [SchemeManager]
    code: 200
    input: ["to_status", "reason?"]
    output: Assessor
    side_effects: ["PROPOSED TeamAssignments -> REJECTED and CONFIRMED ones -> RECUSED", "SCHEDULED WitnessSessions -> ABORTED with the witness-day ledger restored", "qualifications -> REVOKED on WITHDRAWN"]
  - method: POST
    path: "/accreditation/qualifications/{qualification_id}/verify-evidence"
    description: "Record the verified competence evidence. Computes verified_points under the VERIFIED_FINAL variant with the recency factor and grants the qualification when both the points threshold and the role's witness-day floor are met; otherwise the qualification stays PENDING without an error."
    roles: [SchemeManager]
    code: 200
    input: ["verified_years_experience", "verified_witness_days", "verified_training_modules"]
    output: AssessorQualification
    side_effects: ["assessor_competence_points VERIFIED_FINAL", "status PENDING->GRANTED with granted_on and expires_on, and Assessor.granted_qualification_count incremented"]
  # ---------- cycles, teams and planning ----------
  - method: POST
    path: "/accreditation/organizations"
    description: "Register an applicant organization seeking accreditation."
    roles: [AssessmentManager]
    code: 201
    input: ["legal_name", "country_code", "contact_email"]
    output: ApplicantOrganization
    side_effects: ["status APPLIED, risk_score 0"]
  - method: POST
    path: "/accreditation/applications"
    description: "Open an initial assessment cycle for an organization against a PUBLISHED scheme. Pins the scheme's current rule_revision onto the cycle so later rule revisions cannot silently change the cycle's obligations."
    roles: [AssessmentManager, ApplicantContact]
    code: 201
    input: ["organization_id", "scheme_id", "cycle_type", "requested_scope_lines", "notice_days?"]
    output: AccreditationApplication
    side_effects: ["pinned_scheme_rule_revision copied from the scheme", "ApplicantOrganization.status -> UNDER_ASSESSMENT"]
  - method: POST
    path: "/accreditation/applications/{application_id}/team-assignments"
    description: "Propose an assessor for the cycle's assessment team. Screens the assessor against the applicant organization and records the resulting conflict verdict."
    roles: [AssessmentManager]
    code: 201
    input: ["assessor_id", "role_type"]
    output: TeamAssignment
    side_effects: ["impartiality_conflict_verdict evaluated and stored with conflict_checked_at", "status PROPOSED"]
  - method: POST
    path: "/accreditation/team-assignments/{assignment_id}/confirm"
    description: "Confirm a proposed team member. Re-screens impartiality and qualification validity at confirmation time, lazily expiring a lapsed qualification."
    roles: [AssessmentManager]
    code: 200
    input: []
    output: TeamAssignment
    side_effects: ["GRANTED qualification whose expires_on has passed -> EXPIRED", "AccreditationApplication SUBMITTED->TEAM_ASSIGNED on the first confirmed LEAD_ASSESSOR"]
  - method: POST
    path: "/accreditation/team-assignments/{assignment_id}/recuse"
    description: "Recuse a confirmed team member. Losing the last confirmed lead assessor pushes the cycle back to SUBMITTED."
    roles: [AssessmentManager]
    code: 200
    input: ["reason"]
    output: TeamAssignment
    side_effects: ["AccreditationApplication TEAM_ASSIGNED->SUBMITTED when no CONFIRMED LEAD_ASSESSOR remains"]
  - method: POST
    path: "/accreditation/applications/{application_id}/assessment-plans"
    description: "Create an assessment plan for the cycle, on-site or remote or mixed. Computes the witnessing coverage, the day breakdown and the four fee lines, and supersedes any DRAFT plan of the same cycle. Requires expected_application_version to match the cycle's current version."
    roles: [AssessmentManager, LeadAssessor]
    code: 201
    input: ["expected_application_version", "mode", "planned_start", "planned_end", "on_site_days", "remote_days"]
    output: AssessmentPlan
    side_effects: ["assessment_effort_days then assessment_fee", "the previous DRAFT plan -> CANCELLED with superseded_by_plan_id set", "AccreditationApplication.version incremented"]
  - method: POST
    path: "/accreditation/assessment-plans/{plan_id}/approve"
    description: "Approve a DRAFT assessment plan and move the cycle to PLANNED."
    roles: [AssessmentManager]
    code: 200
    input: []
    output: AssessmentPlan
    side_effects: ["approved_at set", "AccreditationApplication TEAM_ASSIGNED->PLANNED and planned_effort_days copied from the plan"]
  - method: POST
    path: "/accreditation/assessment-plans/{plan_id}/return-to-draft"
    description: "Return an APPROVED plan to DRAFT for revision. Aborts every SCHEDULED witnessing session under the plan and restores each assessor's witness-day ledger."
    roles: [AssessmentManager]
    code: 200
    input: ["revision_note"]
    output: AssessmentPlan
    side_effects: ["SCHEDULED WitnessSessions -> ABORTED with committed_witness_days decremented", "AccreditationApplication PLANNED->TEAM_ASSIGNED"]
  # ---------- witnessing ----------
  - method: POST
    path: "/accreditation/assessment-plans/{plan_id}/witness-sessions"
    description: "Schedule the witnessing of an actual conformity assessment activity performed by the applicant. Computes day_count from the session duration and books it against the assessor's annual witness capacity."
    roles: [AssessmentManager, LeadAssessor]
    code: 201
    input: ["assessor_id", "activity_type", "site_ref", "delivery_mode", "starts_at", "ends_at"]
    output: WitnessSession
    side_effects: ["witness_session_day_count", "Assessor.committed_witness_days and available_witness_days updated"]
  - method: POST
    path: "/accreditation/witness-sessions/{session_id}/outcome"
    description: "Record the result of a scheduled witnessing session. Completing the first session of an approved plan moves the cycle into IN_ASSESSMENT; aborting one returns the booked witness days."
    roles: [LeadAssessor, TechnicalExpert]
    code: 200
    input: ["result_status", "outcome?", "evidence_note?"]
    output: WitnessSession
    side_effects: ["AccreditationApplication.completed_witness_session_count incremented and PLANNED->IN_ASSESSMENT on the first completion", "AssessorQualification.last_witness_on refreshed on completion", "committed_witness_days restored on abort"]
  - method: POST
    path: "/accreditation/applications/{application_id}/close-assessment"
    description: "Close the on-site and remote assessment work. Requires completed_witness_session_count to be at least the pinned scheme revision's witness_min_count and the completed witness day_count total under the approved plan to be at least that plan's witness_days_planned; routes the cycle to NC_OPEN when blocking findings are open and straight to DECISION_PENDING with a fresh voting record otherwise."
    roles: [AssessmentManager]
    code: 200
    input: []
    output: AccreditationApplication
    side_effects: ["AssessmentPlan APPROVED->EXECUTED", "IN_ASSESSMENT->NC_OPEN or IN_ASSESSMENT->DECISION_PENDING", "a DecisionRecord in VOTING is created when the cycle goes straight to DECISION_PENDING"]

  # ---------- nonconformity and corrective action ----------
  - method: POST
    path: "/accreditation/applications/{application_id}/nonconformities"
    description: "Raise a finding against the cycle. The closure window is derived from the classification and the closure days of the scheme revision pinned on the cycle; OBSERVATION findings get no due date and never block the decision."
    roles: [LeadAssessor, TechnicalExpert]
    code: 201
    input: ["clause_ref", "classification", "statement"]
    output: Nonconformity
    side_effects: ["nonconformity_due_date", "raised_by_assessor_id set from X-User-ID", "AccreditationApplication.nc_total_count and either nc_blocking_open_count or nc_observation_count incremented"]
  - method: POST
    path: "/accreditation/nonconformities/{nonconformity_id}/responses"
    description: "Submit the applicant's root-cause analysis and corrective-action plan for a finding. Requires expected_nonconformity_version to match, and the current logical-clock date to be on or before the finding's due date."
    roles: [ApplicantContact]
    code: 200
    input: ["expected_nonconformity_version", "root_cause", "action_plan"]
    output: Nonconformity
    side_effects: ["response_round incremented, response_submitted_on set", "status OPEN->RESPONSE_SUBMITTED"]
  - method: POST
    path: "/accreditation/nonconformities/{nonconformity_id}/review"
    description: "Review the submitted corrective action. ACCEPT moves the finding to RESPONSE_ACCEPTED and records the reviewer; REJECT sends it back to OPEN for another response round."
    roles: [LeadAssessor]
    code: 200
    input: ["outcome", "review_note"]
    output: Nonconformity
    side_effects: ["reviewed_by_assessor_id set from X-User-ID", "status RESPONSE_SUBMITTED->RESPONSE_ACCEPTED or ->OPEN"]
  - method: POST
    path: "/accreditation/nonconformities/{nonconformity_id}/verify-effectiveness"
    description: "Verify that the accepted corrective action was effective. Must be performed by an assessor other than the reviewer, with at least the classification's minimum number of evidence items. PASS closes the finding and may release the cycle to the decision panel; FAIL reopens it."
    roles: [LeadAssessor, TechnicalExpert]
    code: 200
    input: ["outcome", "verified_evidence_count"]
    output: Nonconformity
    side_effects: ["verified_by_assessor_id set from X-User-ID", "on PASS: status->CLOSED, nc ledger moved, NC_OPEN->DECISION_PENDING with a DecisionRecord created, organization_risk_score recomputed", "on FAIL: status->OPEN"]
  - method: POST
    path: "/accreditation/nonconformities/{nonconformity_id}/escalate"
    description: "Escalate an overdue CRITICAL or MAJOR finding. Suspends the scope that spawned the cycle, which suspends the organization and freezes its other in-flight cycles."
    roles: [AssessmentManager]
    code: 200
    input: []
    output: Nonconformity
    side_effects: ["escalated_on set", "AccreditationScope ACTIVE->SUSPENDED with mra_notified", "ApplicantOrganization -> SUSPENDED", "other in-flight applications suspension_blocked, their DRAFT plans CANCELLED and SCHEDULED sessions ABORTED", "organization_risk_score recomputed"]
  - method: POST
    path: "/accreditation/nonconformities/{nonconformity_id}/reopen"
    description: "Reopen a closed finding when later evidence contradicts the effectiveness verification. Reverses the ledger movement and defers any decision record still voting."
    roles: [AssessmentManager]
    code: 200
    input: ["reason"]
    output: Nonconformity
    side_effects: ["reopen_count incremented, closed_on and effectiveness_outcome cleared", "nc_blocking_open_count restored and nc_closed_count decremented", "DECISION_PENDING->NC_OPEN with decision_round incremented and the VOTING DecisionRecord -> DEFERRED"]
  # ---------- independent decision panel ----------
  - method: POST
    path: "/accreditation/decisions/{decision_id}/votes"
    description: "Cast one ballot on the decision record. The voter must be a qualified assessor who never sat on the cycle's assessment team, and may vote only once per record."
    roles: [DecisionPanelMember]
    code: 200
    input: ["vote", "rationale"]
    output: DecisionRecord
    side_effects: ["votes appended, vote_count recomputed"]
  - method: POST
    path: "/accreditation/decisions/{decision_id}/finalize"
    description: "Finalize the accreditation decision once quorum is reached. A refusal majority is checked before any grant majority. A grant defines the accredited scope and creates the AccreditationScope with its risk-driven surveillance schedule; a DEFER outcome returns the cycle to NC_OPEN."
    roles: [DecisionPanelMember]
    code: 200
    input: ["granted_scope_lines?"]
    output: DecisionRecord
    side_effects: ["panel_decision_outcome", "AccreditationApplication -> GRANTED, REFUSED or back to NC_OPEN", "on a grant: AccreditationScope created with surveillance_schedule applied", "ApplicantOrganization status, active_scope_count and risk_score updated"]
  # ---------- scope, surveillance and reassessment ----------
  - method: POST
    path: "/accreditation/scopes/{scope_id}/status"
    description: "Suspend, restore or withdraw an accredited scope. Suspension and withdrawal cascade to the organization, its in-flight cycles and their draft plans and scheduled sessions, and flag the mutual-recognition notification."
    roles: [SchemeManager]
    code: 200
    input: ["to_status", "reason?"]
    output: AccreditationScope
    side_effects: ["mra_notified set on suspension and withdrawal", "ApplicantOrganization status and active_scope_count updated", "in-flight applications suspension_blocked toggled, DRAFT plans CANCELLED, SCHEDULED sessions ABORTED"]
  - method: POST
    path: "/accreditation/scopes/{scope_id}/surveillance-applications"
    description: "Open a surveillance, reassessment or unannounced cycle against an active scope. Recomputes the organization's risk score under the AT_SURVEILLANCE_PLANNING variant and re-derives the scope's surveillance interval from it. An unannounced cycle carries zero notice and requires the scheme revision to grant unannounced authority."
    roles: [SchemeManager, AssessmentManager]
    code: 201
    input: ["cycle_type", "requested_scope_lines?", "notice_days?"]
    output: AccreditationApplication
    side_effects: ["origin_scope_id set to the scope", "organization_risk_score AT_SURVEILLANCE_PLANNING written to surveillance_risk_score", "surveillance_schedule re-derived, updating surveillance_interval_days_effective and next_surveillance_due"]
  # ---------- complaints, appeals and mutual recognition ----------
  - method: POST
    path: "/accreditation/complaints"
    description: "File a complaint about an accredited organization or an appeal against a refused cycle."
    roles: [ApplicantContact, ComplaintOfficer]
    code: 201
    input: ["kind", "organization_id", "summary", "filed_by_name", "application_id?"]
    output: ComplaintAppeal
    side_effects: ["status RECEIVED"]
  - method: POST
    path: "/accreditation/complaints/{complaint_id}/review"
    description: "Assign an independent reviewer to the case. For an appeal the reviewer must never have sat on the appealed cycle's assessment team nor cast a vote on any of its decision records."
    roles: [ComplaintOfficer]
    code: 200
    input: ["reviewer_assessor_id"]
    output: ComplaintAppeal
    side_effects: ["reviewer_assessor_id set, status RECEIVED->UNDER_REVIEW"]
  - method: POST
    path: "/accreditation/complaints/{complaint_id}/resolve"
    description: "Uphold or dismiss the case. Upholding an appeal against a refused cycle reopens that cycle for a fresh decision round; upholding any case raises the organization's risk score."
    roles: [ComplaintOfficer]
    code: 200
    input: ["outcome", "resolution_note"]
    output: ComplaintAppeal
    side_effects: ["resolved_on set", "on UPHELD: upheld_complaint_count incremented and organization_risk_score recomputed", "on an upheld APPEAL: AccreditationApplication REFUSED->DECISION_PENDING with decision_round incremented and a new VOTING DecisionRecord"]
  - method: POST
    path: "/accreditation/complaints/{complaint_id}/mra-escalation"
    description: "Escalate an upheld appeal to the international mutual-recognition arrangement peer body, discharging the accreditation body's notification obligation across every live scope of the organization."
    roles: [ComplaintOfficer]
    code: 200
    input: ["mra_body"]
    output: ComplaintAppeal
    side_effects: ["mra_escalated_on set", "ApplicantOrganization.mra_escalation_count incremented", "mra_notified set on every ACTIVE or SUSPENDED AccreditationScope of the organization"]
  # ---------- test-driving surface ----------
  - method: POST
    path: "/_clock/set_current_utc"
    description: "Set the server's logical UTC clock, used by every deadline, cooling-off, recency, expiry and surveillance-due rule. Before any call to this endpoint the logical clock reads exactly 2026-08-01T00:00:00Z and never falls back to real wall-clock time."
    roles: [SchemeManager, AssessmentManager, LeadAssessor, TechnicalExpert, DecisionPanelMember, ApplicantContact, ComplaintOfficer]
    code: 200
    input: ["current_utc"]
    output: null
    side_effects: ["the logical clock used by all date and window comparisons is moved; no stored entity is mutated"]

errors:
  # --- authentication and authorization ---
  - id: ERR_UNAUTHENTICATED
    http: 401
    condition: "X-User-Role or X-User-ID header missing or empty"
  - id: ERR_ROLE_NOT_PERMITTED
    http: 403
    condition: "the acting role is not listed in the target endpoint's roles"
  - id: ERR_NOT_RESOURCE_OWNER
    http: 403
    condition: "an ApplicantContact acts on a resource belonging to a different applicant organization"
  # --- request shape ---
  - id: ERR_INVALID_REQUEST
    http: 400
    condition: "missing required input, unknown enum member, malformed date or datetime, or a negative count"
  - id: ERR_INVALID_PAGINATION
    http: 400
    condition: "limit outside 1..100 or offset below 0"
  - id: ERR_INVALID_DATE_RANGE
    http: 422
    condition: "planned_end before planned_start, ends_at not after starts_at, or ended_on before started_on"
  # --- existence ---
  - id: ERR_SCHEME_NOT_FOUND
    http: 404
    condition: "no AccreditationScheme with the given id"
  - id: ERR_ASSESSOR_NOT_FOUND
    http: 404
    condition: "no Assessor with the given id"
  - id: ERR_QUALIFICATION_NOT_FOUND
    http: 404
    condition: "no AssessorQualification with the given id"
  - id: ERR_DECLARATION_NOT_FOUND
    http: 404
    condition: "no ImpartialityDeclaration with the given id"
  - id: ERR_ORGANIZATION_NOT_FOUND
    http: 404
    condition: "no ApplicantOrganization with the given id"
  - id: ERR_APPLICATION_NOT_FOUND
    http: 404
    condition: "no AccreditationApplication with the given id"
  - id: ERR_TEAM_ASSIGNMENT_NOT_FOUND
    http: 404
    condition: "no TeamAssignment with the given id"
  - id: ERR_PLAN_NOT_FOUND
    http: 404
    condition: "no AssessmentPlan with the given id"
  - id: ERR_WITNESS_SESSION_NOT_FOUND
    http: 404
    condition: "no WitnessSession with the given id"
  - id: ERR_NONCONFORMITY_NOT_FOUND
    http: 404
    condition: "no Nonconformity with the given id"
  - id: ERR_DECISION_NOT_FOUND
    http: 404
    condition: "no DecisionRecord with the given id"
  - id: ERR_SCOPE_NOT_FOUND
    http: 404
    condition: "no AccreditationScope with the given id"
  - id: ERR_COMPLAINT_NOT_FOUND
    http: 404
    condition: "no ComplaintAppeal with the given id"
  # --- optimistic concurrency ---
  - id: ERR_STALE_APPLICATION_VERSION
    http: 412
    condition: "expected_application_version does not match the cycle's current version"
  - id: ERR_STALE_NONCONFORMITY_VERSION
    http: 412
    condition: "expected_nonconformity_version does not match the finding's current version"
  # --- state ---
  - id: ERR_INVALID_STATE_TRANSITION
    http: 409
    condition: "the target resource's current status has no declared transition to the requested status, or the action is not defined from its current status"
  - id: ERR_APPLICATION_STATE_INVALID
    http: 409
    condition: "the owning cycle is in a status that forbids the operation, or its suspension_blocked flag is true"
  - id: ERR_NONCONFORMITY_STATE_INVALID
    http: 409
    condition: "the owning finding is in a status that forbids the operation"
  # --- impartiality, independence and segregation of duties ---
  - id: ERR_IMPARTIALITY_CONFLICT
    http: 422
    condition: "the assessor's governing impartiality declaration for the applicant organization is still inside its cooling-off window"
  - id: ERR_ASSESSOR_IMPARTIALITY_RESTRICTED
    http: 422
    condition: "the assessor's impartiality_status is RESTRICTED and has not been re-screened"
  - id: ERR_PANEL_INDEPENDENCE_BREACH
    http: 422
    condition: "a decision-panel voter also sits or sat on the cycle's assessment team"
  - id: ERR_SEGREGATION_OF_DUTIES
    http: 422
    condition: "the effectiveness verifier is the same assessor who reviewed the corrective action, or the finalizing panel member cast no ballot on the record"
  - id: ERR_APPEAL_REVIEWER_CONFLICT
    http: 422
    condition: "the nominated appeal reviewer sat on the appealed cycle's team or voted on one of its decision records"
  - id: ERR_NOT_ASSIGNED_TEAM_MEMBER
    http: 422
    condition: "the acting assessor holds no CONFIRMED TeamAssignment of the required role_type on the cycle"
  # --- referential business rules ---
  - id: ERR_SCHEME_NOT_PUBLISHED
    http: 422
    condition: "the referenced accreditation program is not in status PUBLISHED"
  - id: ERR_SCHEME_VERSION_SUPERSEDED
    http: 422
    condition: "the cycle's pinned_scheme_rule_revision no longer equals the scheme's current rule_revision"
  - id: ERR_QUALIFICATION_NOT_GRANTED
    http: 422
    condition: "the nominated assessor holds no live GRANTED qualification for the cycle's scheme and requested role_type"
  - id: ERR_SCOPE_NOT_ACTIVE
    http: 422
    condition: "a surveillance, reassessment or unannounced cycle is opened against a scope that is not ACTIVE"
  - id: ERR_PLAN_NOT_APPROVED
    http: 422
    condition: "the operation depends on an APPROVED assessment plan and none exists"
  - id: ERR_SCOPE_LINE_NOT_REQUESTED
    http: 422
    condition: "granted_scope_lines contains a line the cycle never requested"
  # --- temporal business rules ---
  - id: ERR_ASSESSOR_SCHEDULE_CONFLICT
    http: 409
    condition: "the assessor already has a SCHEDULED or COMPLETED witnessing session whose half-open interval intersects the requested half-open interval"
  - id: ERR_SITE_BUFFER_CONFLICT
    http: 409
    condition: "another organization's ON_SITE witnessing at the same site_ref leaves a whole-day gap of 14 days or fewer before the requested start"
  - id: ERR_NOT_YET_OVERDUE
    http: 422
    condition: "an escalation is attempted on or before the finding's due date"
  - id: ERR_RESPONSE_WINDOW_CLOSED
    http: 422
    condition: "a corrective-action response is submitted after the finding's due date"
  - id: ERR_INVALID_NOTICE_PERIOD
    http: 422
    condition: "an UNANNOUNCED cycle carries non-zero notice_days, or any other cycle carries fewer than 14 notice days"
  # --- constraint and capacity business rules ---
  - id: ERR_WITNESS_COVERAGE_INSUFFICIENT
    http: 422
    condition: "completed_witness_session_count is below the pinned scheme revision's witness_min_count, or the completed witness day_count total under the approved plan is below that plan's witness_days_planned"
  - id: ERR_PANEL_QUORUM_NOT_MET
    http: 422
    condition: "the decision record has fewer than three ballots"
  - id: ERR_ASSESSOR_CAPACITY_EXCEEDED
    http: 422
    condition: "the requested witnessing days would push committed_witness_days above the assessor's annual capacity"
  - id: ERR_EFFECTIVENESS_EVIDENCE_INSUFFICIENT
    http: 422
    condition: "verified_evidence_count is below the classification's minimum evidence count"
  - id: ERR_DUPLICATE_PANEL_VOTE
    http: 409
    condition: "the acting panel member already cast a ballot on this decision record"
  - id: ERR_DUPLICATE_ACTIVE_APPLICATION
    http: 409
    condition: "the organization already has a non-terminal cycle for the same scheme"
  - id: ERR_CONDITIONS_REQUIRE_REDUCED_SCOPE
    http: 422
    condition: "a GRANT_WITH_CONDITIONS outcome carries the full requested scope, or a GRANT outcome carries a reduced scope"
  - id: ERR_UNANNOUNCED_NOT_AUTHORIZED
    http: 422
    condition: "an UNANNOUNCED cycle is opened under a scheme revision without unannounced authority"
  - id: ERR_REMOTE_WITNESS_NOT_PERMITTED
    http: 422
    condition: "a REMOTE witnessing session is scheduled under a scheme revision that forbids remote assessment"
  - id: ERR_MRA_ESCALATION_NOT_ELIGIBLE
    http: 422
    condition: "an MRA escalation is attempted on a case that is not an upheld appeal, or on an organization with no live scope"

roles:
  - name: SchemeManager
    description: "Owns scheme rule development and the accreditation body's own competence decisions: publishes and revises scheme rules, screens assessors for impartiality, grants qualifications, and manages accredited scopes."
    identity: opaque
    exclusive_operations:
      - "create an accreditation program and drive its rule revision lifecycle"
      - "re-screen an assessor and admit them to QUALIFIED"
      - "suspend, reinstate or withdraw an assessor"
      - "verify competence evidence and grant a qualification"
      - "suspend, restore or withdraw an accredited scope"
    shared_operations:
      - "open a surveillance, reassessment or unannounced cycle against an active scope (with AssessmentManager)"
      - "read the whole registry"
      - "set the logical clock"
  - name: AssessmentManager
    description: "Runs assessment cycles: recruits assessors, registers declared evidence, assembles conflict-free assessment teams, approves plans, closes assessment work and manages overdue findings. Cannot qualify the assessors it assigns."
    identity: opaque
    exclusive_operations:
      - "recruit an assessor and register their declared competence evidence"
      - "register an applicant organization"
      - "propose, confirm and recuse assessment-team members"
      - "approve an assessment plan and return an approved plan to draft"
      - "close the assessment work of a cycle"
      - "escalate an overdue finding and reopen a closed one"
    shared_operations:
      - "open an initial cycle for an organization (with ApplicantContact)"
      - "create an assessment plan (with LeadAssessor)"
      - "schedule a witnessing session (with LeadAssessor)"
      - "file an impartiality declaration on an assessor's behalf (with the assessor roles)"
      - "open a surveillance, reassessment or unannounced cycle (with SchemeManager)"
      - "read the whole registry"
      - "set the logical clock"
  - name: LeadAssessor
    description: "The assessor leading an assessment team. Plans and performs the assessment, witnesses conformity assessment activity, raises findings and reviews corrective action. X-User-ID is the assessor's own id."
    identity: "entity_backed:Assessor"
    exclusive_operations:
      - "review a submitted corrective action and accept or reject it"
    shared_operations:
      - "create an assessment plan (with AssessmentManager)"
      - "schedule a witnessing session (with AssessmentManager)"
      - "record a witnessing outcome (with TechnicalExpert)"
      - "raise a nonconformity against the cycle (with TechnicalExpert)"
      - "verify the effectiveness of an accepted corrective action, provided they are not its reviewer (with TechnicalExpert)"
      - "file their own impartiality declaration"
      - "read the whole registry"
      - "set the logical clock"
  - name: TechnicalExpert
    description: "A technical specialist on the assessment team. Witnesses activity, raises technical findings and may verify effectiveness, but never reviews a corrective action. X-User-ID is the assessor's own id."
    identity: "entity_backed:Assessor"
    exclusive_operations: []
    shared_operations:
      - "record a witnessing outcome (with LeadAssessor)"
      - "raise a nonconformity against the cycle (with LeadAssessor)"
      - "verify the effectiveness of an accepted corrective action, provided they are not its reviewer (with LeadAssessor)"
      - "file their own impartiality declaration"
      - "read the whole registry"
      - "set the logical clock"
  - name: DecisionPanelMember
    description: "A member of the independent accreditation decision panel. Votes on and finalizes accreditation decisions, and must never have taken part in the cycle's assessment. X-User-ID is the assessor's own id."
    identity: "entity_backed:Assessor"
    exclusive_operations:
      - "cast a ballot on a decision record"
      - "finalize an accreditation decision and define the granted scope"
    shared_operations:
      - "file their own impartiality declaration"
      - "read the whole registry"
      - "set the logical clock"
  - name: ApplicantContact
    description: "The applicant organization's own contact. Applies for accreditation, submits corrective-action responses for its own findings and files appeals. X-User-ID is the applicant organization's id."
    identity: "entity_backed:ApplicantOrganization"
    exclusive_operations:
      - "submit a corrective-action response for a finding of its own cycle"
    shared_operations:
      - "open an initial cycle for its own organization (with AssessmentManager)"
      - "file a complaint or an appeal (with ComplaintOfficer)"
      - "read the whole registry"
      - "set the logical clock"
  - name: ComplaintOfficer
    description: "Handles complaints and appeals independently of the assessment and decision functions, and discharges the body's international mutual-recognition notification obligations."
    identity: opaque
    exclusive_operations:
      - "assign an independent reviewer to a complaint or appeal"
      - "uphold or dismiss a complaint or appeal"
      - "escalate an upheld appeal to a mutual-recognition peer body"
    shared_operations:
      - "file a complaint or an appeal (with ApplicantContact)"
      - "read the whole registry"
      - "set the logical clock"
