      - name: drafting_an_inquiry_response_after_the_due_date_is_rejected
        claim_type: temporal_validation
        grounds:
          - validations[priority=18]
          - errors[ERR_RESPONSE_WINDOW_EXPIRED]
        distinguishing_aspect: "The response window is closed by the clock rather than by any state change, and it guards BOTH response edges: an inquiry that is still RECEIVED at one second past response_due_at can never be answered, only escalated by the regulator."
        test_recipe:
          setup:
            - "An ACTIVE property with a RECEIVED inquiry whose response_due_at is 2026-10-01T00:00:00Z"
            - "The clock is advanced to 2026-10-01T00:00:01Z, one second past the deadline"
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
