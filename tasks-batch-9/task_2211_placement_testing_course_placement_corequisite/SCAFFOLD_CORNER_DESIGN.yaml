      - name: retake_gate_answers_before_the_attempt_limit_when_both_are_violated
        claim_type: Priority Ordering
        grounds: ["validations[priority=20]", "validations[priority=23]", "errors[ERR_ATTEMPT_LIMIT_REACHED]", calculations.retake_eligibility_window]
        distinguishing_aspect: |
          After three scored attempts BOTH the temporal gate (priority 20) and the
          retake cap (priority 23) are violated, and the two answers are
          distinguishable only by which session the student aims at: a session inside
          the 180-day tier answers ERR_RETAKE_WAITING_PERIOD, while one beyond it
          answers ERR_ATTEMPT_LIMIT_REACHED. Both are 422, so only the error_id
