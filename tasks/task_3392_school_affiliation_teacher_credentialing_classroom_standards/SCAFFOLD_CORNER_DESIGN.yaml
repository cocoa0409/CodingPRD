            - "err == ERR_STALE_VERSION (http 412): the replayed respond carries the now-stale captured version"
            - "ImprovementPlan.${opid}.response_notes == \"first response\" (the rejected replay did not overwrite)"

      - name: brand_update_recomputes_compliance_and_bumps_version
        claim_type: Violation → Error
        grounds:
          - entities.School.fields.brand_compliant
          - endpoints.POST_/society/schools/{id}/brand
          - errors.ERR_BRAND_DIFFERENTIATION_REQUIRED
        distinguishing_aspect: "derived_field_reconciliation layer: a brand update that would break the differentiation rule is rejected 422 and changes nothing (version stays); a compliant update to use the method name with descriptor succeeds and bumps version 1 -> 2 with brand_compliant recomputed true; dropping the descriptor afterwards is rejected again."
        test_recipe:
          setup:
            - "School created with uses_method_name false (brand_compliant true, version 1)."
          setup_api_calls:
            - *c_clk
            - call: "POST /society/schools"
