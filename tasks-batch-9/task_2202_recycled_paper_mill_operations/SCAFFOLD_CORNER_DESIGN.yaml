        claim_type: temporal_validation
        grounds:
          - validations.priority_63
          - entities.PaperMachine.fields.changeover_buffer_minutes
          - endpoints.POST_paper_machines_id_runs
        distinguishing_aspect: "PM1 carries changeover_buffer_minutes 30 and already owns the SCHEDULED window [2026-09-01T06:00, 14:00]. The new request [14:30, 18:00] widened by 30 minutes on both ends becomes [14:00, 18:30], whose lower endpoint touches the incumbent's closed upper endpoint at exactly 14:00 — a collision, because the occupancy interval is CLOSED. A half-open implementation lets this through."
        test_recipe:
          setup: ["The spine with an APPROVED 18.000-ton batch and one SCHEDULED run occupying 2026-09-01T06:00-14:00 on PM1 (changeover_buffer_minutes 30). The machine version is re-read after that run's creation because scheduling a run bumps PaperMachine.version."]
