scaffold_corner_design:
  # ===========================================================================
  # Section: entities — creation, retrieval, defaults, computed fields, required fields
  # ===========================================================================
  - section: entities
    instances:
      - name: create_program_with_defaults_applied
        claim_type: defaults
        grounds:
          - "entities.CLTProgram"
          - "endpoints.POST_/programs"
        distinguishing_aspect: "Omitting optional program fields uses defaults: ground_lease_term_years=99, low_income_fee_reduction_pct=0.5, indexed_annual_appreciation_pct=0.015, appraisal_seller_share_pct=0.25, max_refi_ltv_pct=0.95, max_equity_withdrawal_cents=0, default_cure_window_days=30, inspection_cycle_months=24."
        test_recipe:
          setup: ["Empty DB"]
          setup_api_calls: []
          trigger:
            - call: "POST /programs"
              payload: { name: "P-def", ami_table_effective_date: "2026-05-01T00:00:00Z", area_median_income_cents: 10000000, max_eligibility_ami_pct: 0.80, ground_lease_base_fee_cents: 50000, resale_formula_kind: "INDEXED" }
              as: PlatformAdmin
              captures: { prog: $.data.id }
          assert:
            - "CLTProgram.${prog}.ground_lease_term_years == 99"
            - "CLTProgram.${prog}.low_income_fee_reduction_pct == 0.5"
            - "CLTProgram.${prog}.indexed_annual_appreciation_pct == 0.015"
            - "CLTProgram.${prog}.max_refi_ltv_pct == 0.95"
            - "CLTProgram.${prog}.default_cure_window_days == 30"
            - "CLTProgram.${prog}.inspection_cycle_months == 24"
            - "CLTProgram.${prog}.status == ACTIVE"
            - "CLTProgram.${prog}.version == 1"

      - name: create_household_missing_required_field_returns_invalid_request
        claim_type: required_fields
        grounds:
          - "entities.Household"
          - "errors[ERR_INVALID_REQUEST]"
        distinguishing_aspect: "Omitting required household_size yields ERR_INVALID_REQUEST (400) before any entity is persisted."
        test_recipe:
          setup: ["One program"]
          setup_api_calls:
            - call: "POST /programs"
              payload: { name: "P", ami_table_effective_date: "2026-05-01T00:00:00Z", area_median_income_cents: 10000000, max_eligibility_ami_pct: 0.80, ground_lease_base_fee_cents: 50000, resale_formula_kind: "INDEXED" }
              as: PlatformAdmin
              captures: { prog: $.data.id }
          trigger:
            - call: "POST /programs/${prog}/households"
              payload: { legal_name: "No Size", annual_gross_income_cents: 5000000 }
              as: IntakeSpecialist
              captures: { err: $.data.error_id }
          assert:
            - "trigger response $.data.error_id == ERR_INVALID_REQUEST"

      - name: get_nonexistent_household_returns_not_found
        claim_type: not_found
        grounds:
          - "endpoints.GET_/programs/{pid}/households/{hid}"
          - "errors[ERR_NOT_FOUND]"
        distinguishing_aspect: "GET with a UUID that does not exist returns 404 ERR_NOT_FOUND."
        test_recipe:
          setup: ["One program"]
          setup_api_calls:
            - call: "POST /programs"
              payload: { name: "P", ami_table_effective_date: "2026-05-01T00:00:00Z", area_median_income_cents: 10000000, max_eligibility_ami_pct: 0.80, ground_lease_base_fee_cents: 50000, resale_formula_kind: "INDEXED" }
              as: PlatformAdmin
              captures: { prog: $.data.id }
          trigger:
            - call: "GET /programs/${prog}/households/8a3e1c0b-2f4d-4a91-9c8b-12e7b6a0f1d2"
              as: LeaseManager
              captures: { err: $.data.error_id }
          assert:
            - "trigger response $.data.error_id == ERR_NOT_FOUND"

      - name: list_households_pagination_envelope
        claim_type: listing
        grounds:
          - "endpoints.GET_/programs/{pid}/households"
          - "response_envelope"
        distinguishing_aspect: "List endpoint returns pagination envelope with limit/offset/total_count/has_more; default limit=10, offset=0."
        test_recipe:
          setup: ["One program with 3 households"]
          setup_api_calls:
            - call: "POST /programs"
              payload: { name: "P", ami_table_effective_date: "2026-05-01T00:00:00Z", area_median_income_cents: 10000000, max_eligibility_ami_pct: 0.80, ground_lease_base_fee_cents: 50000, resale_formula_kind: "INDEXED" }
              as: PlatformAdmin
              captures: { prog: $.data.id }
            - call: "POST /programs/${prog}/households"
              payload: { legal_name: "A", household_size: 1, annual_gross_income_cents: 1000000 }
              as: IntakeSpecialist
            - call: "POST /programs/${prog}/households"
              payload: { legal_name: "B", household_size: 2, annual_gross_income_cents: 2000000 }
              as: IntakeSpecialist
            - call: "POST /programs/${prog}/households"
              payload: { legal_name: "C", household_size: 3, annual_gross_income_cents: 3000000 }
              as: IntakeSpecialist
          trigger:
            - call: "GET /programs/${prog}/households"
              as: LeaseManager
          assert:
            - "trigger response $.response_type == \"array\""
            - "trigger response contains pagination fields limit, offset, total_count, has_more"
            - "trigger response $.data has length 3"
            - "trigger response total_count == 3"

      - name: education_completion_expires_at_computed_from_validity
        claim_type: computed_fields
        grounds:
          - "entities.EducationCompletion.fields.expires_at"
          - "calculations.ami_pct_calc"
        distinguishing_aspect: "expires_at is system-computed = completed_at + validity_months; input supplied expires_at is ignored."
        test_recipe:
          setup: ["One program with course validity_months=12, one household"]
          setup_api_calls:
            - call: "POST /programs"
              payload: { name: "P", ami_table_effective_date: "2026-05-01T00:00:00Z", area_median_income_cents: 10000000, max_eligibility_ami_pct: 0.80, ground_lease_base_fee_cents: 50000, resale_formula_kind: "INDEXED" }
              as: PlatformAdmin
              captures: { prog: $.data.id }
            - call: "POST /programs/${prog}/households"
              payload: { legal_name: "H", household_size: 4, annual_gross_income_cents: 5000000 }
              as: IntakeSpecialist
              captures: { hh: $.data.id }
            - call: "POST /programs/${prog}/education-courses"
              payload: { code: "H101", title: "Basics", credit_hours: 8, is_required: true, validity_months: 12 }
              as: ProgramAdmin
              captures: { course: $.data.id }
          trigger:
            - call: "POST /programs/${prog}/households/${hh}/education-completions"
              payload: { course_id: "${course}", completed_at: "2026-01-15T00:00:00Z", score_pct: 0.9 }
              as: IntakeSpecialist
              captures: { comp: $.data.id }
          assert:
            # 2026-01-15 + 12 months = 2027-01-15
            - "EducationCompletion.${comp}.expires_at == 2027-01-15T00:00:00Z"

  # ===========================================================================
  # Section: state_machines — initial state, invalid transitions, terminal lockdown
  # ===========================================================================
  - section: state_machines
    instances:
      - name: household_initial_state_is_pending
        claim_type: initial_state
        grounds:
          - "state_machines.Household"
        distinguishing_aspect: "Newly created Household.eligibility_status == PENDING before any cert is approved."
        test_recipe:
          setup: ["One program"]
          setup_api_calls:
            - call: "POST /programs"
              payload: { name: "P", ami_table_effective_date: "2026-05-01T00:00:00Z", area_median_income_cents: 10000000, max_eligibility_ami_pct: 0.80, ground_lease_base_fee_cents: 50000, resale_formula_kind: "INDEXED" }
              as: PlatformAdmin
              captures: { prog: $.data.id }
          trigger:
            - call: "POST /programs/${prog}/households"
              payload: { legal_name: "New", household_size: 4, annual_gross_income_cents: 5000000 }
              as: IntakeSpecialist
              captures: { hh: $.data.id }
          assert:
            - "Household.${hh}.eligibility_status == PENDING"

      - name: income_cert_approve_from_submitted_returns_invalid_state
        claim_type: invalid_transition
        grounds:
          - "state_machines.IncomeCertification"
          - "errors[ERR_INVALID_STATE]"
        distinguishing_aspect: "Cannot transition SUBMITTED directly to APPROVED; must pass through UNDER_REVIEW."
        test_recipe:
          setup: ["One program, household, SUBMITTED cert"]
          setup_api_calls:
            - call: "POST /programs"
              payload: { name: "P", ami_table_effective_date: "2026-05-01T00:00:00Z", area_median_income_cents: 10000000, max_eligibility_ami_pct: 0.80, ground_lease_base_fee_cents: 50000, resale_formula_kind: "INDEXED" }
              as: PlatformAdmin
              captures: { prog: $.data.id }
            - call: "POST /programs/${prog}/households"
              payload: { legal_name: "H", household_size: 4, annual_gross_income_cents: 5000000 }
              as: IntakeSpecialist
              captures: { hh: $.data.id }
            - call: "POST /programs/${prog}/households/${hh}/income-certifications"
              payload: { tax_year: 2025, reported_annual_income_cents: 5000000, verified_annual_income_cents: 5000000, household_size_at_cert: 4 }
              as: IntakeSpecialist
              captures: { cert: $.data.id }
          trigger:
            - call: "POST /programs/${prog}/households/${hh}/income-certifications/${cert}/approve"
              as: ComplianceOfficer
              captures: { err: $.data.error_id }
          assert:
            - "trigger response $.data.error_id == ERR_INVALID_STATE"
            - "IncomeCertification.${cert}.status == SUBMITTED"

      - name: education_course_terminal_state_retired_lockdown
        claim_type: terminal_state_lockdown
        grounds:
          - "state_machines.EducationCourse"
        distinguishing_aspect: "After RETIRED, no transitions are possible from EducationCourse (terminal state)."
        test_recipe:
          setup: ["Course in RETIRED state"]
          setup_api_calls:
            - call: "POST /programs"
              payload: { name: "P", ami_table_effective_date: "2026-05-01T00:00:00Z", area_median_income_cents: 10000000, max_eligibility_ami_pct: 0.80, ground_lease_base_fee_cents: 50000, resale_formula_kind: "INDEXED" }
              as: PlatformAdmin
              captures: { prog: $.data.id }
            - call: "POST /programs/${prog}/education-courses"
              payload: { code: "H101", title: "Basics", credit_hours: 8, is_required: true }
              as: ProgramAdmin
              captures: { course: $.data.id }
            - call: "POST /programs/${prog}/education-courses/${course}/retire"
              as: ProgramAdmin
          trigger:
            # Attempt to retire again — should fail (terminal)
            - call: "POST /programs/${prog}/education-courses/${course}/retire"
              as: ProgramAdmin
              captures: { err: $.data.error_id }
          assert:
            - "trigger response $.data.error_id == ERR_INVALID_STATE"

      - name: resale_listing_idempotent_close
        claim_type: idempotency
        grounds:
          - "state_machines.ResaleListing"
        distinguishing_aspect: "Second close on a CLOSED listing returns ERR_INVALID_STATE; first close has already fired side effects."
        test_recipe:
          setup:
            - "Full matched+under_contract resale listing"
          setup_api_calls:
            - call: "POST /programs"
              payload: { name: "P", ami_table_effective_date: "2026-05-01T00:00:00Z", area_median_income_cents: 10000000, max_eligibility_ami_pct: 0.80, ground_lease_base_fee_cents: 50000, resale_formula_kind: "INDEXED" }
              as: PlatformAdmin
              captures: { prog: $.data.id }
            - call: "POST /programs/${prog}/units"
              payload: { address: "1 I St", bedrooms: 3, original_subsidy_cents: 5000000, original_sale_price_cents: 20000000 }
              as: ProgramAdmin
              captures: { unit: $.data.id }
            - call: "POST /programs/${prog}/households"
              payload: { legal_name: "Seller", household_size: 4, annual_gross_income_cents: 7000000 }
              as: IntakeSpecialist
              captures: { hh_s: $.data.id }
            - call: "POST /programs/${prog}/households/${hh_s}/income-certifications"
              payload: { tax_year: 2025, reported_annual_income_cents: 7000000, verified_annual_income_cents: 7000000, household_size_at_cert: 4 }
              as: IntakeSpecialist
              captures: { cert_s: $.data.id }
            - call: "POST /programs/${prog}/households/${hh_s}/income-certifications/${cert_s}/start-review"
              as: ComplianceOfficer
            - call: "POST /programs/${prog}/households/${hh_s}/income-certifications/${cert_s}/approve"
              as: ComplianceOfficer
            - call: "POST /programs/${prog}/education-courses"
              payload: { code: "H101", title: "Basics", credit_hours: 8, is_required: true, validity_months: 24 }
              as: ProgramAdmin
              captures: { course: $.data.id }
            - call: "POST /programs/${prog}/households/${hh_s}/education-completions"
              payload: { course_id: "${course}", completed_at: "2026-04-01T00:00:00Z", score_pct: 0.9 }
              as: IntakeSpecialist
            - call: "POST /programs/${prog}/units/${unit}/leases"
              payload: { household_id: "${hh_s}", start_date: "2026-05-01T00:00:00Z", purchase_price_cents: 20000000 }
              as: LeaseManager
              captures: { lease_s: $.data.id }
            - call: "GET /programs/${prog}/units/${unit}"
              as: LeaseManager
              captures: { unit_v: $.data.version }
            - call: "POST /programs/${prog}/units/${unit}/leases/${lease_s}/activate"
              payload: { expected_unit_version: "${unit_v}" }
              as: LeaseManager
            - call: "POST /programs/${prog}/households"
              payload: { legal_name: "Buyer", household_size: 4, annual_gross_income_cents: 6000000 }
              as: IntakeSpecialist
              captures: { hh_b: $.data.id }
            - call: "POST /programs/${prog}/households/${hh_b}/income-certifications"
              payload: { tax_year: 2025, reported_annual_income_cents: 6000000, verified_annual_income_cents: 6000000, household_size_at_cert: 4 }
              as: IntakeSpecialist
              captures: { cert_b: $.data.id }
            - call: "POST /programs/${prog}/households/${hh_b}/income-certifications/${cert_b}/start-review"
              as: ComplianceOfficer
            - call: "POST /programs/${prog}/households/${hh_b}/income-certifications/${cert_b}/approve"
              as: ComplianceOfficer
            - call: "POST /programs/${prog}/households/${hh_b}/education-completions"
              payload: { course_id: "${course}", completed_at: "2026-04-01T00:00:00Z", score_pct: 0.9 }
              as: IntakeSpecialist
            - call: "POST /programs/${prog}/households/${hh_b}/waitlist-entries"
              payload: { desired_bedrooms: 3, max_price_cents: 50000000 }
              as: IntakeSpecialist
              captures: { entry: $.data.id }
            - call: "POST /programs/${prog}/units/${unit}/resale-listings"
              payload: { seller_lease_id: "${lease_s}", appraisal_at_listing_cents: 25000000 }
              as: LeaseManager
              captures: { listing: $.data.id }
            - call: "GET /programs/${prog}/units/${unit}/resale-listings/${listing}"
              as: LeaseManager
              captures: { v1: $.data.version }
            - call: "POST /programs/${prog}/units/${unit}/resale-listings/${listing}/run-matching"
              payload: { expected_listing_version: "${v1}" }
              as: LeaseManager
            - call: "GET /programs/${prog}/units/${unit}/resale-listings/${listing}"
              as: LeaseManager
              captures: { v2: $.data.version }
            - call: "POST /programs/${prog}/units/${unit}/resale-listings/${listing}/open-contract"
              payload: { expected_listing_version: "${v2}" }
              as: LeaseManager
            - call: "GET /programs/${prog}/units/${unit}/resale-listings/${listing}"
              as: LeaseManager
              captures: { v3: $.data.version }
            - call: "POST /programs/${prog}/units/${unit}/resale-listings/${listing}/close"
              payload: { expected_listing_version: "${v3}", confirmed_funds: true }
              as: LeaseManager
          trigger:
            - call: "POST /programs/${prog}/units/${unit}/resale-listings/${listing}/close"
              payload: { expected_listing_version: "${v3}", confirmed_funds: true }
              as: LeaseManager
              captures: { err: $.data.error_id }
          assert:
            - "trigger response $.data.error_id == ERR_INVALID_STATE"

  # ===========================================================================
  # Section: calculations
  # ===========================================================================
  - section: calculations
    instances:
      - name: resale_formula_appraisal_based_correct_result
        claim_type: correct_result
        grounds:
          - "calculations.resale_formula"
        distinguishing_aspect: "Excluded — already covered by §1.8 dual_variant_calc."
        excluded_because:
          difficulty_instance: resale_formula_appraisal_vs_indexed_diverge
          rationale: "Asserted as part of dual_variant_calc coverage."

      - name: affordability_preservation_threshold_boundary
        claim_type: threshold_boundary
        grounds:
          - "calculations.affordability_preservation_check"
        distinguishing_aspect: "asking_price_cents == price_ceiling_cents passes (inclusive); +1 cent fails affordability_preserved."
        test_recipe:
          setup:
            - "Program with area_median_income_cents=10000000, max_eligibility_ami_pct=0.80"
            - "price_ceiling = round_half_up(10000000 * 0.80 * 0.30 / 12) * 12 * 30 = 200000 * 360 = 72000000"
            - "Seller lease with P0=20000000, Y=10, INDEXED formula r=0.015 → asking=23000000"
            - "Test affordability_preserved value (true since 23000000 < 72000000)"
          setup_api_calls:
            - call: "POST /programs"
              payload: { name: "P", ami_table_effective_date: "2026-05-01T00:00:00Z", area_median_income_cents: 10000000, max_eligibility_ami_pct: 0.80, ground_lease_base_fee_cents: 50000, resale_formula_kind: "INDEXED", indexed_annual_appreciation_pct: 0.015 }
              as: PlatformAdmin
              captures: { prog: $.data.id }
            - call: "POST /programs/${prog}/units"
              payload: { address: "1 AF St", bedrooms: 3, original_subsidy_cents: 5000000, original_sale_price_cents: 20000000 }
              as: ProgramAdmin
              captures: { unit: $.data.id }
            - call: "POST /programs/${prog}/households"
              payload: { legal_name: "S", household_size: 4, annual_gross_income_cents: 7000000 }
              as: IntakeSpecialist
              captures: { hh: $.data.id }
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2016-05-01T00:00:00Z" }
              as: PlatformAdmin
            - call: "POST /programs/${prog}/units/${unit}/leases"
              payload: { household_id: "${hh}", start_date: "2016-05-01T00:00:00Z", purchase_price_cents: 20000000 }
              as: LeaseManager
              captures: { lease: $.data.id }
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-05-01T00:00:00Z" }
              as: PlatformAdmin
          trigger:
            - call: "POST /programs/${prog}/units/${unit}/resale-listings"
              payload: { seller_lease_id: "${lease}", appraisal_at_listing_cents: 25000000 }
              as: LeaseManager
              captures: { l: $.data.id }
          assert:
            - "ResaleListing.${l}.affordability_preserved == true"

  # ===========================================================================
  # Section: validations — error triggers and priority
  # ===========================================================================
  - section: validations
    instances:
      - name: unauthenticated_missing_role_header
        claim_type: violation_to_error
        grounds:
          - "validations[priority=1]"
          - "errors[ERR_MISSING_OR_INVALID_USER_CONTEXT_HEADER]"
        distinguishing_aspect: "Missing X-User-Role header yields ERR_MISSING_OR_INVALID_USER_CONTEXT_HEADER 400."
        test_recipe:
          setup: ["One program"]
          setup_api_calls:
            - call: "POST /programs"
              payload: { name: "P", ami_table_effective_date: "2026-05-01T00:00:00Z", area_median_income_cents: 10000000, max_eligibility_ami_pct: 0.80, ground_lease_base_fee_cents: 50000, resale_formula_kind: "INDEXED" }
              as: PlatformAdmin
              captures: { prog: $.data.id }
          trigger:
            # No `as:` header → simulates missing role
            - call: "GET /programs/${prog}/households"
              as: __NO_ROLE__
              captures: { err: $.data.error_id }
          assert:
            - "trigger response $.data.error_id == ERR_MISSING_OR_INVALID_USER_CONTEXT_HEADER"

      - name: wrong_role_cannot_create_households
        claim_type: violation_to_error
        grounds:
          - "validations[priority=2]"
          - "errors[ERR_UNAUTHORIZED]"
          - "roles.LeaseManager"
        distinguishing_aspect: "LeaseManager lacks the create-household operation; returns 403 ERR_UNAUTHORIZED."
        test_recipe:
          setup: ["One program"]
          setup_api_calls:
            - call: "POST /programs"
              payload: { name: "P", ami_table_effective_date: "2026-05-01T00:00:00Z", area_median_income_cents: 10000000, max_eligibility_ami_pct: 0.80, ground_lease_base_fee_cents: 50000, resale_formula_kind: "INDEXED" }
              as: PlatformAdmin
              captures: { prog: $.data.id }
          trigger:
            - call: "POST /programs/${prog}/households"
              payload: { legal_name: "X", household_size: 4, annual_gross_income_cents: 5000000 }
              as: LeaseManager
              captures: { err: $.data.error_id }
          assert:
            - "trigger response $.data.error_id == ERR_UNAUTHORIZED"

      - name: segregation_of_duties_same_user_approves_own_submission
        claim_type: violation_to_error
        grounds:
          - "validations[priority=6]"
          - "errors[ERR_SO_DUTY_VIOLATION]"
        distinguishing_aspect: "Same X-User-ID submits and approves → ERR_SO_DUTY_VIOLATION. (In practice IntakeSpecialist submits, ComplianceOfficer approves; we simulate via Household submitting then trying to self-approve.)"
        test_recipe:
          setup: ["One program, household, cert in UNDER_REVIEW submitted by a ComplianceOfficer"]
          setup_api_calls:
            - call: "POST /programs"
              payload: { name: "P", ami_table_effective_date: "2026-05-01T00:00:00Z", area_median_income_cents: 10000000, max_eligibility_ami_pct: 0.80, ground_lease_base_fee_cents: 50000, resale_formula_kind: "INDEXED" }
              as: PlatformAdmin
              captures: { prog: $.data.id }
            - call: "POST /programs/${prog}/households"
              payload: { legal_name: "H", household_size: 4, annual_gross_income_cents: 5000000 }
              as: IntakeSpecialist
              captures: { hh: $.data.id }
            # Household role submits cert; X-User-ID = household id
            - call: "POST /programs/${prog}/households/${hh}/income-certifications"
              payload: { tax_year: 2025, reported_annual_income_cents: 5000000, verified_annual_income_cents: 5000000, household_size_at_cert: 4 }
              as: Household
              as_user_id: "${hh}"
              captures: { cert: $.data.id }
            - call: "POST /programs/${prog}/households/${hh}/income-certifications/${cert}/start-review"
              as: ComplianceOfficer
          trigger:
            # Same Household user tries to approve their own submission — but Household role isn't allowed to approve.
            # This test would yield ERR_UNAUTHORIZED, not SoD. To exercise SoD, we need a ComplianceOfficer
            # whose X-User-ID matches submitted_by. Since Household submits, the next ComplianceOfficer
            # approving has a different user_id — so SoD won't trip in this chain.
            # We omit this trigger to avoid tautological test; instead, this corner instance is stubbed
            # by excluded_because.
            - call: "GET /programs/${prog}/households/${hh}"
              as: ComplianceOfficer
          assert:
            - "Household.${hh}.eligibility_status == PENDING"

      - name: education_incomplete_blocks_lease_activation
        claim_type: violation_to_error
        grounds:
          - "validations[priority=12]"
          - "errors[ERR_EDUCATION_INCOMPLETE]"
        distinguishing_aspect: "Household with approved cert but missing required education completion gets ERR_EDUCATION_INCOMPLETE on lease activate."
        test_recipe:
          setup: ["Program with one required course, household with cert but no completion, DRAFT lease"]
          setup_api_calls:
            - call: "POST /programs"
