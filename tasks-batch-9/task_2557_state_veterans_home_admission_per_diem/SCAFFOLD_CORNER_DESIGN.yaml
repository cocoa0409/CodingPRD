              payload: {}
              as: StateProgramAdmin
              captures: { hv2: "$.data.version" }
            - call: "GET /svh/veterans-homes/${home_id}"
              payload: {}
              as: StateProgramAdmin
              captures: { hv2_again: "$.data.version" }
            - call: "POST /svh/veterans-homes/${home_id}/recognition"
