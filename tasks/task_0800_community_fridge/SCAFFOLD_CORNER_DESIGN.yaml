              captures: { sh_id: $.data.id }
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-03-01T09:30:00Z" }
              as: NetworkAdmin
            - call: "POST /shifts/${sh_id}/complete"
              payload: { miles_traveled: 0, handled_cold_chain: false }
              as: Steward
              as_user_id: "${sid}"
          trigger:
            - call: "POST /grants/${g_id}/cancel"
              payload: {}
              as: SponsorAgent
              captures: { err: $.data.error_id }
          assert:
            - "response.data.error_id == ERR_BUDGET_EXCEEDED"
            - "response.status == 402"

