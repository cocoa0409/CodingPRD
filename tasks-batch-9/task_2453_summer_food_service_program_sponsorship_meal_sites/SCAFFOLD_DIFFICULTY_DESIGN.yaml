              as: StateAgencyReviewer
            - call: "POST /sfsp/_clock/set_current_utc"
              payload: { to_iso8601: "2026-06-08T08:00:00Z" }
              as: StateAgencyReviewer
            - call: "POST /sfsp/sites/${site_id}/operating-status"
              payload: { to_status: "OPERATING" }
              as: SponsorAdmin
              as_user_id: "${sp_id}"
          trigger:
            - call: "POST /sfsp/meal-service-days"
              payload: { site_id: "${site_id}", service_date: "2026-06-08", meal_services: [{ meal_type: "LUNCH", planned_meals: 150, service_start: "11:30", service_end: "12:30" }, { meal_type: "PM_SNACK", planned_meals: 100, service_start: "13:30", service_end: "14:00" }] }
              as: SiteSupervisor
              as_user_id: "${site_id}"
              captures: { d_ok_id: $.data.id }
            - call: "POST /sfsp/meal-service-days"
