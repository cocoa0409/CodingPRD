            - "ACTIVE COREQUISITE CourseRequisite MATH-100 -> MATH-100S, so the minted determination picks up coreq_course_id MATH-100S."
            - "One ACTIVE PlacementRule TRANSCRIPT_GPA -> MATH-050 (min_hs_gpa 2.0, V1); no rule targets MATH-100, so MATH-100 is reachable ONLY through an appeal."
            - "Section sec050 (MATH-050, seat_capacity 1, OPEN, UNPAIRED) — capacity 1 is what forces SF onto the waitlist."
            - "Students SE and SF: hs_gpa 2.50 VERIFIED, transcript_recorded_at 2025-06-01T00:00:00Z, each with a PROVISIONAL MATH-050 determination determined_by staff-1."
            - "instructor-1 issues one PrerequisiteOverride per student against the MATH-050 -> READ-050 edge, expires_at 2026-12-01T00:00:00Z."
            - "SE confirms first (override CONSUMED, ENROLLED); SF confirms second and is WAITLISTED with its override still ISSUED."
            - "The appeal is filed by SE, reviewed by registrar-1 (SoD-2 vs staff-1), endorsed by instructor-1 (SoD-3 vs registrar-1) and decided by registrar-1."
