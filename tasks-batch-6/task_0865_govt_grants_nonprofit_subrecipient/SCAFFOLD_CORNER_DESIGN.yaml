  # ---------------- Cross-cutting / consistency (stubs already covered by §1.8) ----------------
  - section: cross_cutting_complexity_layers
    instances:
      - name: dual_variant_indirect_covered_by_difficulty
        claim_type: dual_variant_calculation
        grounds: [calculations.indirect_cost_recovery]
        excluded_because:
          difficulty_instance: dual_variant_calc / indirect_recovery_de_minimis_vs_negotiated
          rationale: "The DE_MINIMIS vs NEGOTIATED divergence on indirect_cost_cents is asserted directly in the named §1.8 instance."
      - name: cascade_suspension_covered_by_difficulty
        claim_type: cascading_side_effects
        grounds: [state_machines.Subaward.ACTIVE_to_SUSPENDED]
        excluded_because:
          difficulty_instance: transitive_cascade / critical_finding_suspends_subaward_and_returns_drawdown
          rationale: "The depth-4 cascade end-to-end is asserted by the named §1.8 instance."
  - section: consistency_model
    instances:
      - name: obligation_ledger_immediate_covered_by_difficulty
        claim_type: immediate
        grounds: [entities.Subaward.fields.obligated_cents]
        excluded_because:
          difficulty_instance: compensating_invariant / obligation_conserved_across_submit_then_return
          rationale: "Immediate visibility of the obligation ledger after submit/return is asserted by the named §1.8 instance."
