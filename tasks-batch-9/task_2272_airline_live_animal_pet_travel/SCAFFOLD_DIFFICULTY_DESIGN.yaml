scaffold_difficulty_design:
  - rule_id: dual_variant_calc
    instances:
      - name: travel_fee_provisional_vs_final_diverges_on_same_segment
        grounds:
          - calculations.animal_travel_fee
          - entities.SegmentAssignment.fields.fee_variant
          - entities.SegmentAssignment.fields.segment_fee_amount
          - state_machines.SegmentAssignment.RESERVED_to_ACCEPTED
        distinguishing_aspect: |
          This dual-variant calculation lives in the COST-ACCOUNTING domain on SegmentAssignment: the
          PROVISIONAL_AT_RESERVATION variant prices the declared 20 kg animal at 33180 and the
          FINAL_AT_ACCEPTANCE variant reprices the same segment at 37560 from the measured 27 kg, a delta
          of 4380 on identical container and leg data.
        test_recipe:
          setup:
            - "SpeciesProfile DOG (max_cabin_weight_kg 12, min_age_weeks 16), ContainerModel K9-L (60x40x45 cm, tare 7 kg, vent 15 pct, 3 sides), stations HKG (HK) and LAX (US)"
            - "FlightLeg AN101 HKG->LAX 2026-09-10T02:00Z -> 15:00Z, block_minutes 780 (long-haul), checked_animal_limit 2, forecast 25/15 so posture is OPEN"
            - "Reservation CHECKED booked by agent-01 with one AnimalRecord (Labrador, declared 20 kg, height 35 cm, length 50 cm) screened COMPLIANT and one RESERVED segment priced provisionally at 33180"
            - "HEALTH_CERTIFICATE verified, compliance_status VERIFIED, animal TRAVEL_READY, booking_status CONFIRMED, measured_weight_kg 27 recorded at the counter"
          setup_api_calls:
            - { call: "POST /species-profiles", payload: { species_code: "DOG", common_name: "Dog", acceptance_class: "ACCEPTED_ALL_ROUTINGS", max_cabin_weight_kg: 12, min_age_weeks: 16 }, as: ProgramAdmin, as_user_id: "admin-01", captures: { sp_dog: $.data.id } }
            - { call: "POST /container-models", payload: { model_code: "K9-L", interior_length_cm: 60, interior_width_cm: 40, interior_height_cm: 45, tare_weight_kg: 7, ventilation_area_pct: 15, ventilated_side_count: 3, wheels_removable: true, cabin_eligible: false }, as: ProgramAdmin, as_user_id: "admin-01", captures: { cm_k9l: $.data.id } }
            - { call: "POST /stations", payload: { iata_code: "HKG", country_code: "HK", kennel_bay_count: 4 }, as: ProgramAdmin, as_user_id: "admin-01", captures: { st_hkg: $.data.id } }
            - { call: "POST /stations", payload: { iata_code: "LAX", country_code: "US", kennel_bay_count: 6 }, as: ProgramAdmin, as_user_id: "admin-01", captures: { st_lax: $.data.id } }
            - { call: "POST /destination-requirements", payload: { species_profile_id: "${sp_dog}", destination_country_code: "US", document_type: "HEALTH_CERTIFICATE", max_age_days_at_arrival: 60, mandatory: true }, as: ProgramAdmin, as_user_id: "admin-01" }
            - { call: "POST /flight-legs", payload: { flight_number: "AN101", origin_station_id: "${st_hkg}", destination_station_id: "${st_lax}", scheduled_departure_utc: "2026-09-10T02:00:00Z", scheduled_arrival_utc: "2026-09-10T15:00:00Z", forecast_high_c: 25, forecast_low_c: 15, cabin_animal_limit: 2, checked_animal_limit: 2, cargo_animal_limit: 4 }, as: ProgramAdmin, as_user_id: "admin-01", captures: { leg1: $.data.id } }
            - { call: "POST /reservations", payload: { passenger_name: "Wu", contact_email: "wu@example.com", routing_type: "CHECKED" }, as: ReservationsAgent, as_user_id: "agent-01", captures: { res1: $.data.id } }
            - { call: "POST /animal-records", payload: { reservation_id: "${res1}", species_profile_id: "${sp_dog}", container_model_id: "${cm_k9l}", animal_name: "Mochi", breed_name: "Labrador", declared_weight_kg: 20, height_at_shoulder_cm: 35, length_nose_to_tail_cm: 50, age_weeks: 52 }, as: ReservationsAgent, as_user_id: "agent-01", captures: { an1: $.data.id } }
            - { call: "GET /flight-legs/${leg1}", payload: {}, as: ReservationsAgent, as_user_id: "agent-01", captures: { leg1_v1: $.data.version } }
            - { call: "POST /segment-assignments", payload: { animal_record_id: "${an1}", flight_leg_id: "${leg1}", routing_type: "CHECKED", sequence_index: 1, expected_flight_leg_version: "${leg1_v1}" }, as: ReservationsAgent, as_user_id: "agent-01", captures: { seg1: $.data.id } }
            - { call: "POST /animal-records/${an1}/screen", payload: {}, as: AcceptanceAgent, as_user_id: "accept-01" }
            - { call: "POST /health-documents", payload: { animal_record_id: "${an1}", document_type: "HEALTH_CERTIFICATE", issuing_country_code: "HK", issued_at: "2026-07-20T00:00:00Z", expires_at: "2026-10-01T00:00:00Z" }, as: ReservationsAgent, as_user_id: "agent-01", captures: { doc1: $.data.id } }
            - { call: "POST /health-documents/${doc1}/start-review", payload: {}, as: VeterinaryReviewer, as_user_id: "vet-01" }
            - { call: "POST /health-documents/${doc1}/verify", payload: {}, as: VeterinaryReviewer, as_user_id: "vet-01" }
            - { call: "POST /reservations/${res1}/verify-compliance", payload: {}, as: VeterinaryReviewer, as_user_id: "vet-01" }
            - { call: "POST /animal-records/${an1}/mark-travel-ready", payload: {}, as: AcceptanceAgent, as_user_id: "accept-01" }
            - { call: "POST /reservations/${res1}/confirm", payload: {}, as: ReservationsAgent, as_user_id: "agent-01" }
            - { call: "GET /segment-assignments/${seg1}", payload: {}, as: AcceptanceAgent, as_user_id: "accept-01" }
            - { call: "PUT /animal-records/${an1}", payload: { measured_weight_kg: 27 }, as: AcceptanceAgent, as_user_id: "accept-01" }
          trigger:
            - { call: "POST /segment-assignments/${seg1}/accept", payload: {}, as: AcceptanceAgent, as_user_id: "accept-02" }
          assert:
            - "SegmentAssignment.${seg1}.segment_fee_amount == 37560"
            - "SegmentAssignment.${seg1}.fee_variant == FINAL_AT_ACCEPTANCE"
            - "SegmentAssignment.${seg1}.status == ACCEPTED"
            - "AnimalRecord.${an1}.chargeable_weight_kg == 34"
            - "Reservation.${res1}.subtotal_amount == 37560"
            - "Reservation.${res1}.net_payable_amount == 37560"
            - "the segment_fee_amount observed before the trigger was 33180 with fee_variant PROVISIONAL_AT_RESERVATION, so the provisional-to-final delta is exactly 4380"

      - name: incident_severity_preliminary_vs_adjudicated_diverges
        grounds:
          - calculations.incident_severity_score
          - entities.AnimalIncident.fields.preliminary_severity_score
          - entities.AnimalIncident.fields.adjudicated_severity_score
          - state_machines.AnimalIncident.INVESTIGATING_to_CLOSED
        distinguishing_aspect: |
          This second dual-variant calculation lives in the RISK-SCORING domain on AnimalIncident, a
          different entity domain from the SegmentAssignment cost accounting: the same INJURY event scores
          62 as PRELIMINARY and 56 as ADJUDICATED because only the ADJUDICATED variant applies the
          INDETERMINATE finding factor 0.9 with round_half_up.
        test_recipe:
          setup:
            - "Two-leg CHECKED itinerary for one animal: AN101 HKG->LAX (02:00Z-15:00Z) and AN205 LAX->JFK (17:00Z-22:00Z) on 2026-09-10, connection 120 minutes so required_welfare_check_count is 1 on the second segment"
            - "Reservation CONFIRMED, animal TRAVEL_READY, first segment ACCEPTED, second segment RESERVED with zero welfare checks recorded (welfare_gap 1 is not yet used - the incident is filed against the second segment which requires 1 check and has 0)"
            - "An INJURY incident is reported against the second segment while the animal is TRAVEL_READY, with welfare gap 2 produced by a 720-minute connection"
          setup_api_calls:
            - { call: "POST /species-profiles", payload: { species_code: "DOG", common_name: "Dog", acceptance_class: "ACCEPTED_ALL_ROUTINGS", max_cabin_weight_kg: 12, min_age_weeks: 16 }, as: ProgramAdmin, as_user_id: "admin-01", captures: { sp_dog: $.data.id } }
            - { call: "POST /container-models", payload: { model_code: "K9-L", interior_length_cm: 60, interior_width_cm: 40, interior_height_cm: 45, tare_weight_kg: 7, ventilation_area_pct: 15, ventilated_side_count: 3, wheels_removable: true, cabin_eligible: false }, as: ProgramAdmin, as_user_id: "admin-01", captures: { cm_k9l: $.data.id } }
            - { call: "POST /stations", payload: { iata_code: "HKG", country_code: "HK", kennel_bay_count: 4 }, as: ProgramAdmin, as_user_id: "admin-01", captures: { st_hkg: $.data.id } }
            - { call: "POST /stations", payload: { iata_code: "LAX", country_code: "US", kennel_bay_count: 6 }, as: ProgramAdmin, as_user_id: "admin-01", captures: { st_lax: $.data.id } }
            - { call: "POST /stations", payload: { iata_code: "JFK", country_code: "US", kennel_bay_count: 6 }, as: ProgramAdmin, as_user_id: "admin-01", captures: { st_jfk: $.data.id } }
            - { call: "POST /flight-legs", payload: { flight_number: "AN101", origin_station_id: "${st_hkg}", destination_station_id: "${st_lax}", scheduled_departure_utc: "2026-09-10T02:00:00Z", scheduled_arrival_utc: "2026-09-10T15:00:00Z", forecast_high_c: 25, forecast_low_c: 15, cabin_animal_limit: 2, checked_animal_limit: 2, cargo_animal_limit: 4 }, as: ProgramAdmin, as_user_id: "admin-01", captures: { leg1: $.data.id } }
            - { call: "POST /flight-legs", payload: { flight_number: "AN205", origin_station_id: "${st_lax}", destination_station_id: "${st_jfk}", scheduled_departure_utc: "2026-09-11T03:00:00Z", scheduled_arrival_utc: "2026-09-11T08:00:00Z", forecast_high_c: 22, forecast_low_c: 12, cabin_animal_limit: 2, checked_animal_limit: 2, cargo_animal_limit: 4 }, as: ProgramAdmin, as_user_id: "admin-01", captures: { leg2: $.data.id } }
            - { call: "POST /reservations", payload: { passenger_name: "Wu", contact_email: "wu@example.com", routing_type: "CHECKED" }, as: ReservationsAgent, as_user_id: "agent-01", captures: { res1: $.data.id } }
            - { call: "POST /animal-records", payload: { reservation_id: "${res1}", species_profile_id: "${sp_dog}", container_model_id: "${cm_k9l}", animal_name: "Mochi", breed_name: "Labrador", declared_weight_kg: 20, height_at_shoulder_cm: 35, length_nose_to_tail_cm: 50, age_weeks: 52 }, as: ReservationsAgent, as_user_id: "agent-01", captures: { an1: $.data.id } }
            - { call: "GET /flight-legs/${leg1}", payload: {}, as: ReservationsAgent, as_user_id: "agent-01", captures: { leg1_v1: $.data.version } }
            - { call: "POST /segment-assignments", payload: { animal_record_id: "${an1}", flight_leg_id: "${leg1}", routing_type: "CHECKED", sequence_index: 1, expected_flight_leg_version: "${leg1_v1}" }, as: ReservationsAgent, as_user_id: "agent-01", captures: { seg1: $.data.id } }
            - { call: "GET /flight-legs/${leg2}", payload: {}, as: ReservationsAgent, as_user_id: "agent-01", captures: { leg2_v1: $.data.version } }
            - { call: "POST /segment-assignments", payload: { animal_record_id: "${an1}", flight_leg_id: "${leg2}", routing_type: "CHECKED", sequence_index: 2, expected_flight_leg_version: "${leg2_v1}" }, as: ReservationsAgent, as_user_id: "agent-01", captures: { seg2: $.data.id } }
            - { call: "POST /animal-records/${an1}/screen", payload: {}, as: AcceptanceAgent, as_user_id: "accept-01" }
            - { call: "POST /animal-incidents", payload: { animal_record_id: "${an1}", segment_assignment_id: "${seg2}", incident_type: "INJURY", discovered_at_utc: "2026-08-01T00:00:00Z" }, as: AcceptanceAgent, as_user_id: "accept-01", captures: { inc1: $.data.id } }
            - { call: "POST /animal-incidents/${inc1}/investigate", payload: {}, as: ComplianceOfficer, as_user_id: "officer-01" }
            - { call: "POST /animal-incidents/${inc1}/disclose", payload: { regulator_reference: "REG-2026-0001" }, as: ComplianceOfficer, as_user_id: "officer-01" }
          trigger:
            - { call: "POST /animal-incidents/${inc1}/close", payload: { veterinary_finding: "INDETERMINATE" }, as: ComplianceOfficer, as_user_id: "officer-02" }
          assert:
            - "AnimalIncident.${inc1}.preliminary_severity_score == 62"
            - "AnimalIncident.${inc1}.adjudicated_severity_score == 56"
            - "AnimalIncident.${inc1}.disclosure_required == true"
            - "AnimalIncident.${inc1}.disclosure_on_time == true"
            - "AnimalIncident.${inc1}.status == CLOSED"
            - "AnimalIncident.${inc1}.closed_by_user_id == officer-02"

      - name: mixed_variant_subtotal_crosses_loyalty_tier_on_acceptance
        grounds:
          - calculations.animal_travel_fee
          - calculations.reservation_charge_assembly
          - entities.Reservation.fields.loyalty_tier_pct
          - entities.SegmentAssignment.fields.fee_variant
        distinguishing_aspect: |
          Variant reconciliation: accepting only the first of two segments leaves the itinerary holding one
          FINAL_AT_ACCEPTANCE fee (37560) and one PROVISIONAL_AT_RESERVATION fee (27650), and that mixed-variant
          subtotal of 65210 is what crosses LOYALTY_TIER1_THRESHOLD 65000 - the pre-acceptance subtotal of
          60830 sits below it.
        test_recipe:
          setup:
            - "Same two-leg CHECKED itinerary as the incident instance, but the second leg departs 2026-09-10T17:00Z so the connection is 120 minutes"
            - "Both segments RESERVED and provisionally priced 33180 (long-haul leg 1) and 27650 (short leg 2), subtotal 60830, loyalty_tier_pct 0"
            - "Documents verified, compliance VERIFIED, animal TRAVEL_READY with measured_weight_kg 27, reservation CONFIRMED"
