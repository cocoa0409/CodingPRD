              as: LicensingManager
              captures: { auth_a1_id: "$.data.id" }
          trigger:
            - call: "POST /delegate-authorizations"
              payload: { delegate_id: "${del_id}", state_license_id: "${lic_ca_id}", effective_date: "2026-09-30T00:00:00Z", expiry_date: "2026-10-31T00:00:00Z", monthly_volume_cap_cents: 5000000 }
              as: LicensingManager
              captures: { err_id: "$.data.error_id" }
            - call: "POST /delegate-authorizations"
              payload: { delegate_id: "${del_id}", state_license_id: "${lic_ca_id}", effective_date: "2026-10-01T00:00:00Z", expiry_date: "2026-10-31T00:00:00Z", monthly_volume_cap_cents: 5000000 }
              as: LicensingManager
              captures: { auth_a3_id: "$.data.id" }
            - call: "POST /delegate-authorizations"
              payload: { delegate_id: "${del_id}", state_license_id: "${lic_tx_id}", effective_date: "2026-09-01T00:00:00Z", expiry_date: "2026-09-30T00:00:00Z", monthly_volume_cap_cents: 5000000 }
              as: LicensingManager
              captures: { auth_a4_id: "$.data.id" }
          assert:
            - "trigger call 1: HTTP 409 with error_id == ERR_DELEGATE_PERIOD_OVERLAP (2026-09-30 touches the closed end of the existing CA period)"
            - "trigger call 2: HTTP 201 — DelegateAuthorization.${auth_a3_id}.status == PENDING_OVERSIGHT (a one-day gap clears the closed-interval test)"
            - "trigger call 3: HTTP 201 — DelegateAuthorization.${auth_a4_id}.status == PENDING_OVERSIGHT (the identical calendar period is legal under the TX license because overlap is scoped per delegate AND jurisdiction)"
            - "GET /delegate-authorizations?delegate_id=${del_id} returns exactly 3 rows"
            - "StateLicense.${lic_ca_id}.active_delegate_count == 0 and StateLicense.${lic_tx_id}.active_delegate_count == 0 (none of these authorizations was activated)"

  - rule_id: compensating_invariant
    instances:
      - name: obligation_aggregate_and_posture_reconcile_after_full_reversal
        grounds:
          - calculations.licensee_obligation_aggregate
          - calculations.licensee_coverage_posture
          - entities.Licensee.fields.aggregate_outstanding_obligations_cents
          - entities.StateLicense.fields.outstanding_obligations_cents
          - validations[priority=114]
        distinguishing_aspect: |
          Conserved quantity: money (integer cents). Licensee.aggregate_outstanding_obligations_cents
          must equal the sum of its non-terminal licenses' outstanding_obligations_cents after every
          single call, and reversing both deltas restores 0 with coverage_ratio_bps back at the
          vacuous 10000 and coverage_posture back to COMPLIANT — no drift, no residue.
        test_recipe:
          setup:
            - "Jurisdictions CA and TX; one licensee with an ACTIVE license in each and zero obligations."
          setup_api_calls:
            - call: "POST /jurisdictions"
              payload: { state_code: "CA", name: "California DFPI", min_net_worth_cents: 50000000, base_bond_cents: 5000000, per_delegate_bond_cents: 100000, bond_cap_cents: 40000000, response_window_days: 15, renewal_fee_cents: 500000, assessment_rate_bps: 25, call_report_frequency: "QUARTERLY", participates_in_multistate: true }
              as: PlatformAdmin
              captures: { ca_id: "$.data.id" }
            - call: "POST /jurisdictions"
              payload: { state_code: "TX", name: "Texas DOB", min_net_worth_cents: 100000000, base_bond_cents: 30000000, per_delegate_bond_cents: 250000, bond_cap_cents: 60000000, response_window_days: 10, renewal_fee_cents: 750000, assessment_rate_bps: 40, call_report_frequency: "QUARTERLY", participates_in_multistate: true }
              as: PlatformAdmin
              captures: { tx_id: "$.data.id" }
            - call: "POST /licensees"
              payload: { legal_name: "Meridian Transfer LLC", ein: "74-1100018", reported_tangible_net_worth_cents: 500000000, net_worth_statement_date: "2026-06-30T00:00:00Z" }
              as: LicensingManager
              captures: { lic_id: "$.data.id" }
            - call: "POST /license-applications"
              payload: { licensee_id: "${lic_id}", jurisdiction_id: "${ca_id}", license_class: "MONEY_TRANSMISSION", projected_annual_volume_cents: 90000000, new_product_narrative: "Domestic P2P transfers." }
              as: LicensingManager
              captures: { app_ca_id: "$.data.id" }
            - call: "POST /license-applications/${app_ca_id}/submit"
              payload: {}
              as: LicensingManager
            - call: "POST /license-applications/${app_ca_id}/review-actions"
              payload: { action: "START_REVIEW" }
              as: StateRegulator
              as_user_id: "${ca_id}"
            - call: "POST /license-applications/${app_ca_id}/review-actions"
              payload: { action: "APPROVE" }
              as: StateRegulator
              as_user_id: "${ca_id}"
            - call: "GET /state-licenses?application_id=${app_ca_id}"
              as: LicensingManager
              captures: { lic_ca_id: "$.data[0].id" }
            - call: "POST /state-licenses/${lic_ca_id}/bond"
              payload: { amount_cents: 5000000, bond_issuer: "Atlas Surety", effective_date: "2026-08-01T00:00:00Z" }
              as: LicensingManager
            - call: "POST /license-applications"
              payload: { licensee_id: "${lic_id}", jurisdiction_id: "${tx_id}", license_class: "MONEY_TRANSMISSION", projected_annual_volume_cents: 90000000, new_product_narrative: "Domestic P2P transfers." }
              as: LicensingManager
              captures: { app_tx_id: "$.data.id" }
            - call: "POST /license-applications/${app_tx_id}/submit"
              payload: {}
              as: LicensingManager
            - call: "POST /license-applications/${app_tx_id}/review-actions"
              payload: { action: "START_REVIEW" }
              as: StateRegulator
              as_user_id: "${tx_id}"
            - call: "POST /license-applications/${app_tx_id}/review-actions"
              payload: { action: "APPROVE" }
              as: StateRegulator
              as_user_id: "${tx_id}"
            - call: "GET /state-licenses?application_id=${app_tx_id}"
              as: LicensingManager
              captures: { lic_tx_id: "$.data[0].id" }
            - call: "POST /state-licenses/${lic_tx_id}/bond"
              payload: { amount_cents: 30000000, bond_issuer: "Atlas Surety", effective_date: "2026-08-01T00:00:00Z" }
              as: LicensingManager
          trigger:
            - call: "PATCH /state-licenses/${lic_ca_id}/obligations"
              payload: { delta_cents: 6024000, memo: "CA settlement float" }
              as: LicensingManager
            - call: "PATCH /state-licenses/${lic_tx_id}/obligations"
              payload: { delta_cents: 2515000, memo: "TX settlement float" }
              as: LicensingManager
            - call: "PATCH /state-licenses/${lic_ca_id}/obligations"
              payload: { delta_cents: -6024000, memo: "CA float settled" }
              as: LicensingManager
            - call: "PATCH /state-licenses/${lic_tx_id}/obligations"
              payload: { delta_cents: -2515000, memo: "TX float settled" }
              as: LicensingManager
          assert:
            - "after trigger call 1: Licensee.${lic_id}.aggregate_outstanding_obligations_cents == 6024000"
            - "after trigger call 2: Licensee.${lic_id}.aggregate_outstanding_obligations_cents == 8539000 == 6024000 + 2515000"
            - "after trigger call 3: StateLicense.${lic_ca_id}.outstanding_obligations_cents == 0 and Licensee.${lic_id}.aggregate_outstanding_obligations_cents == 2515000"
            - "after trigger call 4: StateLicense.${lic_tx_id}.outstanding_obligations_cents == 0 and Licensee.${lic_id}.aggregate_outstanding_obligations_cents == 0"
            - "after trigger call 4: Licensee.${lic_id}.coverage_ratio_bps == 10000 and coverage_posture == COMPLIANT (restored exactly, not left at DEFICIENT)"
            - "at no point does aggregate_outstanding_obligations_cents differ from the sum of the two licenses' outstanding_obligations_cents"

      - name: delegate_counters_and_bond_requirement_restore_after_termination
        grounds:
          - calculations.surety_bond_requirement
          - entities.StateLicense.fields.active_delegate_count
          - entities.StateLicense.fields.bond_requirement_cents
          - entities.Delegate.fields.authorized_state_count
          - state_machines.DelegateAuthorization.ACTIVE_to_TERMINATED
        distinguishing_aspect: |
          A different conserved quantity from the money invariant: the (active_delegate_count,
          authorized_state_count, bond_requirement_cents) triple. Activation raises the CA bond
          requirement from 10000000 to 10100000 and both counters to 1; terminating the same
          authorization returns all three to exactly 10000000 / 0 / 0 while bond_posted_cents stays
          untouched at 10000000.
        test_recipe:
          setup:
            - "Jurisdiction CA; licensee with one ACTIVE CA license, bond 10000000 posted."
            - "A timely 2026Q2 call report of 250000000 cents sets annual_volume_cents so the license-context bond tier is the 10000000 band."
            - "Delegate with oversight_score 85 and a PENDING_OVERSIGHT authorization."
          setup_api_calls:
            - call: "POST /jurisdictions"
              payload: { state_code: "CA", name: "California DFPI", min_net_worth_cents: 50000000, base_bond_cents: 5000000, per_delegate_bond_cents: 100000, bond_cap_cents: 40000000, response_window_days: 15, renewal_fee_cents: 500000, assessment_rate_bps: 25, call_report_frequency: "QUARTERLY", participates_in_multistate: true }
              as: PlatformAdmin
              captures: { ca_id: "$.data.id" }
            - call: "POST /licensees"
              payload: { legal_name: "Meridian Transfer LLC", ein: "74-1100019", reported_tangible_net_worth_cents: 500000000, net_worth_statement_date: "2026-06-30T00:00:00Z" }
              as: LicensingManager
              captures: { lic_id: "$.data.id" }
            - call: "POST /license-applications"
              payload: { licensee_id: "${lic_id}", jurisdiction_id: "${ca_id}", license_class: "MONEY_TRANSMISSION", projected_annual_volume_cents: 250000000, new_product_narrative: "Domestic P2P transfers." }
              as: LicensingManager
              captures: { app_id: "$.data.id" }
            - call: "POST /license-applications/${app_id}/submit"
              payload: {}
              as: LicensingManager
            - call: "POST /license-applications/${app_id}/review-actions"
              payload: { action: "START_REVIEW" }
              as: StateRegulator
              as_user_id: "${ca_id}"
            - call: "POST /license-applications/${app_id}/review-actions"
              payload: { action: "APPROVE" }
              as: StateRegulator
              as_user_id: "${ca_id}"
            - call: "GET /state-licenses?application_id=${app_id}"
              as: LicensingManager
              captures: { lic_ca_id: "$.data[0].id" }
            - call: "POST /state-licenses/${lic_ca_id}/bond"
              payload: { amount_cents: 10000000, bond_issuer: "Atlas Surety", effective_date: "2026-08-01T00:00:00Z" }
              as: LicensingManager
            - call: "POST /call-reports"
              payload: { state_license_id: "${lic_ca_id}", period_label: "2026Q2", transmission_volume_cents: 250000000, transaction_count: 1200 }
              as: LicensingManager
              captures: { cr_id: "$.data.id" }
            - call: "POST /delegates"
              payload: { licensee_id: "${lic_id}", legal_name: "Sunrise Checks Inc", delegate_type: "AUTHORIZED_DELEGATE" }
              as: LicensingManager
              captures: { del_id: "$.data.id" }
            - call: "POST /delegates/${del_id}/oversight-reviews"
              payload: { training_score: 90, aml_test_score: 90, recordkeeping_score: 70 }
              as: ComplianceOfficer
            - call: "POST /delegate-authorizations"
              payload: { delegate_id: "${del_id}", state_license_id: "${lic_ca_id}", effective_date: "2026-09-01T00:00:00Z", expiry_date: "2027-08-31T00:00:00Z", monthly_volume_cap_cents: 5000000 }
              as: LicensingManager
              captures: { auth_id: "$.data.id" }
          trigger:
            - call: "POST /delegate-authorizations/${auth_id}/activate"
              payload: {}
              as: LicensingManager
            - call: "POST /delegate-authorizations/${auth_id}/terminate"
              payload: { reason: "Agent contract wound down." }
              as: LicensingManager
          assert:
            - "CallReport.${cr_id}.status == FILED and assessment_fee_cents == 625000; StateLicense.${lic_ca_id}.annual_volume_cents == 250000000 and bond_requirement_cents == 10000000 before the trigger"
            - "after trigger call 1: StateLicense.${lic_ca_id}.active_delegate_count == 1 and bond_requirement_cents == 10100000; Delegate.${del_id}.authorized_state_count == 1"
            - "after trigger call 2: StateLicense.${lic_ca_id}.active_delegate_count == 0 and bond_requirement_cents == 10000000 (exactly the pre-activation value)"
            - "after trigger call 2: Delegate.${del_id}.authorized_state_count == 0 and status == ACTIVE (termination compensates counters without terminating the delegate)"
            - "StateLicense.${lic_ca_id}.bond_posted_cents == 10000000 throughout and bond_status == POSTED"
            - "DelegateAuthorization.${auth_id}.status == TERMINATED and activated_at is still stamped (the audit trail is not rewound)"
