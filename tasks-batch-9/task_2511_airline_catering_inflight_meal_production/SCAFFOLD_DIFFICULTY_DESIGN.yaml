  # =========================================================================
  - rule_id: non_linear_state_machine
    instances:

      - name: batch_cycles_twice_through_haccp_hold_and_is_then_barred_from_release
        grounds:
          - state_machines.ProductionBatch.IN_PRODUCTION_to_HACCP_HOLD
          - state_machines.ProductionBatch.HACCP_HOLD_to_IN_PRODUCTION
          - calculations.haccp_risk_score
          - validations[priority=80]
          - errors[ERR_HACCP_REWORK_LIMIT]
        distinguishing_aspect: |
          The batch traverses IN_PRODUCTION -> HACCP_HOLD -> IN_PRODUCTION twice, so the SAME endpoint
          POST /production-batches/{id}/start performs two different transitions: the PLANNED entry that
          leaves haccp_rework_rounds at 0 and the HACCP_HOLD re-entry that increments it. After the
          second loop the batch can still be COMPLETED and can still record a PASSing HOLD_TEMP check,
          yet release is permanently barred by ERR_HACCP_REWORK_LIMIT — a cycle whose exit gate is
          driven by the loop counter, not by the current verdicts.
        test_recipe:
          setup:
            - "Flight AN411 is planned into a single CHILL batch of 180 AN-Y-STD units with release_deadline_utc 2026-09-15T08:30:00Z."
            - "The batch is started at 2026-09-15T04:30:00Z and passes its CHILL_DOWN step at 6.0 C."
            - "The clock is 2026-09-15T05:00:00Z, well inside the release deadline, for the whole rework ladder."
          setup_api_calls:
            - *c_clk_cfg
            - *c_air_an
            - *c_spec_y
            - *c_flt_y180
            - *c_clk_lock
            - *c_lock_y
            - *c_clk_plan
            - *c_plan_y180
            - *c_clk_prod
            - *c_start_y
            - *c_clk_qa
            - *c_hc_y_ch
          trigger:
            - { call: "POST /production-batches/${b_y_id}/haccp-checks", payload: { step_code: "HOLD_TEMP", measured_temp_c: 9.5 }, as: QaOfficer, captures: { hc_f1: $.data.verdict } }
            - { call: "GET /production-batches/${b_y_id}", payload: {}, as: QaOfficer, captures: { risk_f1: $.data.haccp_risk_score, st_f1: $.data.production_status } }
            - { call: "POST /production-batches/${b_y_id}/start", payload: {}, as: ProductionSupervisor }
            - { call: "GET /production-batches/${b_y_id}", payload: {}, as: QaOfficer, captures: { risk_r1: $.data.haccp_risk_score, rr_r1: $.data.haccp_rework_rounds } }
            - { call: "POST /production-batches/${b_y_id}/haccp-checks", payload: { step_code: "HOLD_TEMP", measured_temp_c: 9.0 }, as: QaOfficer }
            - { call: "GET /production-batches/${b_y_id}", payload: {}, as: QaOfficer, captures: { risk_f2: $.data.haccp_risk_score, st_f2: $.data.production_status } }
            - { call: "POST /production-batches/${b_y_id}/start", payload: {}, as: ProductionSupervisor }
            - { call: "GET /production-batches/${b_y_id}", payload: {}, as: QaOfficer, captures: { risk_r2: $.data.haccp_risk_score, rr_r2: $.data.haccp_rework_rounds } }
            - { call: "POST /production-batches/${b_y_id}/haccp-checks", payload: { step_code: "HOLD_TEMP", measured_temp_c: 4.0 }, as: QaOfficer, captures: { hc_p3: $.data.verdict, seq_p3: $.data.sequence_no } }
            - *c_clk_cmpl
            - *c_cmpl_y180
            - { call: "POST /production-batches/${b_y_id}/release", payload: {}, as: ProductionSupervisor, captures: { rel_err: $.data.error_id } }
          assert:
            - "${hc_f1} == FAIL — HOLD_TEMP 9.5 exceeds HOLD_TEMP_MAX_C 5.0"
            - "${st_f1} == HACCP_HOLD and ${risk_f1} == 40.00 == min(100.00, 40.0*1 + 15.0*0)"
            - "${rr_r1} == 1 and ${risk_r1} == 55.00 == 40.0*1 + 15.0*1 — the HACCP_HOLD re-entry alone moved the score"
            - "${st_f2} == HACCP_HOLD and ${risk_f2} == 95.00 == 40.0*2 + 15.0*1, and fail_count 2 is still <= HACCP_MAX_FAILS 2 so the batch was NOT rejected"
            - "${rr_r2} == 2 and ${risk_r2} == 100.00 — the raw score 40.0*2 + 15.0*2 == 110.00 is clamped to 100.00"
            - "${hc_p3} == PASS and ${seq_p3} == 3 — sequence_no counts only the (batch, HOLD_TEMP) pair"
            - "ProductionBatch.${b_y_id}.production_status == COMPLETED and produced_qty == 180 and scrapped_qty == 0"
            - "${rel_err} == ERR_HACCP_REWORK_LIMIT with HTTP 422 — gate (iii) fires even though every required step's highest-sequence check now PASSes and the clock 05:30 is before the 08:30 deadline"
            - "ProductionBatch.${b_y_id}.production_status is still COMPLETED and released_at is null"

      - name: cart_build_axis_and_seal_axis_advance_without_touching_each_other
        grounds:
          - state_machines.Cart.build_status
          - state_machines.Cart.seal_status
          - entities.Cart.fields.seal_count
          - endpoints[POST /carts/{id}/seals]
          - complexity_profile.state_machine_shape
        distinguishing_aspect: |
          Cart carries two independent state dimensions. EMPTY -> BUILDING -> BUILT leaves seal_status
          pinned at UNSEALED across two writes, and UNSEALED -> SEALED -> RESEALED leaves build_status
          pinned at BUILT across two more writes while seal_count climbs 0 -> 1 -> 2. Collapsing the
          two axes into a single status enum makes at least one of those four observations impossible.
        test_recipe:
          setup:
            - "Flight AN411's single CHILL batch of 180 units is RELEASED at 2026-09-15T05:30:00Z."
            - "Cart CHL-01 (STD_FULL, CHILL, capacity 200) exists for the flight at 2026-09-15T06:10:00Z with build_status EMPTY and seal_status UNSEALED."
            - "The manifest has NOT been created yet, so the reseal has nothing pinned to amend."
          setup_api_calls:
            - *c_clk_cfg
            - *c_air_an
            - *c_spec_y
            - *c_flt_y180
            - *c_clk_lock
            - *c_lock_y
            - *c_clk_plan
            - *c_plan_y180
            - *c_clk_prod
            - *c_start_y
            - *c_clk_qa
            - *c_hc_y_ch
            - *c_hc_y_hd
            - *c_clk_cmpl
            - *c_cmpl_y180
            - *c_rel_y
            - *c_clk_cart
            - *c_cart_y
            - { call: "GET /carts/${cart_y_id}", payload: {}, as: LoadMaster, as_user_id: "lm_alice", captures: { c0_build: $.data.build_status, c0_seal: $.data.seal_status, c0_count: $.data.seal_count } }
          trigger:
            - *c_item_y180
            - { call: "GET /carts/${cart_y_id}", payload: {}, as: LoadMaster, as_user_id: "lm_alice", captures: { c1_build: $.data.build_status, c1_seal: $.data.seal_status } }
            - *c_build_y
            - { call: "GET /carts/${cart_y_id}", payload: {}, as: LoadMaster, as_user_id: "lm_alice", captures: { c2_build: $.data.build_status, c2_seal: $.data.seal_status, c2_v: $.data.version } }
            - { call: "POST /carts/${cart_y_id}/seals", payload: { expected_cart_version: "${c2_v}", seal_number: "SEAL-AN411-01" }, as: LoadMaster, as_user_id: "lm_alice", captures: { c3_build: $.data.build_status, c3_seal: $.data.seal_status, c3_count: $.data.seal_count, c3_v: $.data.version } }
            - { call: "POST /carts/${cart_y_id}/seals", payload: { expected_cart_version: "${c3_v}", seal_number: "SEAL-AN411-02" }, as: LoadMaster, as_user_id: "lm_carol", captures: { c4_build: $.data.build_status, c4_seal: $.data.seal_status, c4_count: $.data.seal_count } }
          assert:
            - "${c0_build} == EMPTY and ${c0_seal} == UNSEALED and ${c0_count} == 0"
            - "${c1_build} == BUILDING while ${c1_seal} == UNSEALED — the build axis moved and the seal axis did not"
            - "${c2_build} == BUILT while ${c2_seal} == UNSEALED — two consecutive build-axis writes, seal axis still untouched"
            - "${c3_seal} == SEALED and ${c3_count} == 1 while ${c3_build} == BUILT — the seal axis moved and the build axis did not"
            - "${c4_seal} == RESEALED and ${c4_count} == 2 while ${c4_build} == BUILT — a second seal-axis write, build axis still pinned"
            - "Cart.${cart_y_id}.seal_number == SEAL-AN411-02 and sealed_by_user_id == lm_carol — the reseal replaced both"
            - "Cart.${cart_y_id}.loaded_units == 180 and Flight.${f_id}.units_loaded == 180 throughout the seal-axis writes"
            - "Flight.${f_id}.status == PLANNED — neither axis advanced the flight, because no manifest was issued"

      - name: flight_departs_only_after_every_run_of_the_issued_manifest_is_terminal
        grounds:
          - state_machines.Flight.LOADED_to_DEPARTED
          - state_machines.DeliveryRun.AT_AIRCRAFT_to_DELIVERED
          - state_machines.Cart.BUILT_to_LOADED
          - endpoints[POST /delivery-runs/{id}/events]
        distinguishing_aspect: |
          The LOADED -> DEPARTED edge is a join, not a step: the first run reaching DELIVERED leaves the
          flight in LOADED because a sibling run is still RESERVED, and only the second run's DELIVER
          event closes the join and cascades every BUILT cart to LOADED. A per-run implementation that
          departs the flight on the first delivery is caught by the intermediate observation.
        test_recipe:
          setup:
            - "Flight AN411 is loaded into cart CHL-01, sealed by lm_alice and manifested and ISSUED by lm_bob, so the flight is LOADED."
            - "Run 1 covers 07:30-08:00 and run 2 covers 08:20-08:50 on truck HL-101, whose 20-minute buffer is exactly satisfied because 08:20 is not before 08:00 + 20 minutes."
            - "Both windows sit inside the flight's admissible slot band 05:00-09:15."
          setup_api_calls:
            - *c_clk_cfg
            - *c_air_an
            - *c_spec_y
            - *c_truck1
            - *c_stand1
            - *c_flt_y180
            - *c_clk_lock
            - *c_lock_y
            - *c_clk_plan
            - *c_plan_y180
            - *c_clk_prod
            - *c_start_y
            - *c_clk_qa
            - *c_hc_y_ch
            - *c_hc_y_hd
            - *c_clk_cmpl
            - *c_cmpl_y180
            - *c_rel_y
            - *c_clk_cart
            - *c_cart_y
            - *c_item_y180
            - *c_build_y
            - *c_getcart_y
            - *c_seal_y
            - *c_clk_mfst
            - *c_getflt_1
            - *c_mfst_y
            - *c_issue_y
            - *c_run1
            - &c_run2 { call: "POST /delivery-runs", payload: { loading_manifest_id: "${mf_id}", truck_id: "${truck1_id}", stand_id: "${stand1_id}", window_start_utc: "2026-09-15T08:20:00Z", window_end_utc: "2026-09-15T08:50:00Z" }, as: LoadMaster, as_user_id: "lm_bob", captures: { run2_id: $.data.id } }
          trigger:
            - *c_clk_disp
            - *c_disp1
            - *c_clk_arr
            - *c_arr1
            - *c_clk_del
            - *c_del1
            - { call: "GET /flights/${f_id}", payload: {}, as: LoadMaster, as_user_id: "lm_bob", captures: { mid_status: $.data.status } }
            - { call: "GET /carts/${cart_y_id}", payload: {}, as: LoadMaster, as_user_id: "lm_bob", captures: { mid_cart: $.data.build_status } }
            - { call: "POST /_clock/set_current_utc", payload: { current_utc: "2026-09-15T08:15:00Z" }, as: PlatformAdmin }
            - { call: "POST /delivery-runs/${run2_id}/events", payload: { event_type: "DISPATCH" }, as: LoadMaster, as_user_id: "lm_bob" }
            - { call: "POST /_clock/set_current_utc", payload: { current_utc: "2026-09-15T08:30:00Z" }, as: PlatformAdmin }
            - { call: "POST /delivery-runs/${run2_id}/events", payload: { event_type: "ARRIVE" }, as: LoadMaster, as_user_id: "lm_bob" }
            - { call: "POST /_clock/set_current_utc", payload: { current_utc: "2026-09-15T08:45:00Z" }, as: PlatformAdmin }
            - { call: "POST /delivery-runs/${run2_id}/events", payload: { event_type: "DELIVER" }, as: LoadMaster, as_user_id: "lm_bob" }
          assert:
            - "DeliveryRun.${run1_id}.status == DELIVERED with lateness_minutes == 0 and penalty_cents == 0 (delivered 07:55, window_end 08:00)"
            - "${mid_status} == LOADED — the flight did NOT depart on the first delivery because ${run2_id} was still RESERVED"
            - "${mid_cart} == BUILT — the BUILT -> LOADED cart cascade had not fired yet"
            - "DeliveryRun.${run2_id}.status == DELIVERED with lateness_minutes == 0 and penalty_cents == 0 (delivered 08:45, window_end 08:50)"
            - "Flight.${f_id}.status == DEPARTED — the join closed only when both runs were terminal and at least one was DELIVERED"
            - "Cart.${cart_y_id}.build_status == LOADED and seal_status == SEALED and seal_number == SEAL-AN411-01"
            - "LoadingManifest.${mf_id}.status == ISSUED with amendment_count == 0 and total_units == 180"
            - "Airline.${an_id}.open_finding_count == 0 — no LATE_DELIVERY finding was raised by either run"

  # =========================================================================
  - rule_id: transitive_cascade
    instances:

      - name: post_release_haccp_fail_cascades_batch_to_cart_to_manifest_to_flight
        grounds:
          - state_machines.ProductionBatch.RELEASED_to_REJECTED
          - state_machines.Cart.BUILT_to_BUILDING
          - state_machines.LoadingManifest.ISSUED_to_AMENDED
          - state_machines.Flight.LOADED_to_PLANNED
          - calculations.audit_penalty
        distinguishing_aspect: |
          One QaOfficer call propagates four hops in a fixed order — ProductionBatch RELEASED -> REJECTED,
          then every ACTIVE CartItem of that batch to VOID which drives Cart BUILT -> BUILDING and
          SEALED -> BROKEN on the same row, then the ISSUED LoadingManifest to AMENDED with
          amendment_count 1, then the Flight LOADED -> PLANNED. Stopping the chain at any hop leaves an
          observable contradiction, such as an ISSUED manifest pinning a seal whose cart is BROKEN.
        test_recipe:
          setup:
            - "Flight AN411's CHILL batch of 180 units is RELEASED, loaded into cart CHL-01, sealed by lm_alice as SEAL-AN411-01 and pinned into manifest issued by lm_bob, so the flight is LOADED."
            - "The batch has one PASSing CHILL_DOWN check and one PASSing HOLD_TEMP check on the record."
            - "The clock is 2026-09-15T07:00:00Z and no delivery run exists, so nothing else competes for the flight."
          setup_api_calls:
            - *c_clk_cfg
            - *c_air_an
            - *c_spec_y
            - *c_flt_y180
            - *c_clk_lock
            - *c_lock_y
            - *c_clk_plan
            - *c_plan_y180
            - *c_clk_prod
            - *c_start_y
            - *c_clk_qa
            - *c_hc_y_ch
            - *c_hc_y_hd
            - *c_clk_cmpl
            - *c_cmpl_y180
            - *c_rel_y
            - *c_clk_cart
            - *c_cart_y
            - *c_item_y180
            - *c_build_y
            - *c_getcart_y
            - *c_seal_y
            - *c_clk_mfst
            - *c_getflt_1
            - *c_mfst_y
            - *c_issue_y
          trigger:
            - { call: "POST /production-batches/${b_y_id}/haccp-checks", payload: { step_code: "HOLD_TEMP", measured_temp_c: 9.5 }, as: QaOfficer, captures: { casc_verdict: $.data.verdict, casc_seq: $.data.sequence_no } }
          assert:
            - "${casc_verdict} == FAIL and ${casc_seq} == 2 — the second HOLD_TEMP measurement on this batch"
            - "hop 1 — ProductionBatch.${b_y_id}.production_status == REJECTED, scrapped_qty == 180 and haccp_risk_score == 40.00; fail_count 1 was NOT consulted against HACCP_MAX_FAILS because the batch was RELEASED"
            - "hop 2 — CartItem.${item_y_id}.status == VOID, Cart.${cart_y_id}.build_status == BUILDING, seal_status == BROKEN, loaded_units == 0, seal_number still SEAL-AN411-01 and sealed_by_user_id == null"
            - "hop 3 — LoadingManifest.${mf_id}.status == AMENDED with amendment_count == 1"
            - "hop 4 — Flight.${f_id}.status == PLANNED, units_loaded == 0 and units_scrapped == 180"
            - "exactly one AuditFinding exists for Flight.${f_id} with finding_type HACCP_BREACH, severity CRITICAL, source SYSTEM, status OPEN and penalty_cents == 2500000 == round_half_up(500000 * 5.0)"
            - "Airline.${an_id}.open_finding_count == 1, penalty_accrued_cents == 0 and status == ACTIVE — one finding is below OPEN_FINDING_SUSPEND_THRESHOLD 3"
            - "Flight.${f_id}.units_produced == 0 — the rejected batch's produced units no longer count"

      - name: third_open_finding_suspends_the_airline_and_blocks_then_unblocks_planning
        grounds:
          - state_machines.Airline.ACTIVE_to_SUSPENDED
          - state_machines.Airline.SUSPENDED_to_ACTIVE
          - state_machines.AuditFinding.OPEN_to_DISPUTED
          - validations[priority=85]
          - errors[ERR_AIRLINE_SUSPENDED]
        distinguishing_aspect: |
          The third OPEN finding travels AuditFinding -> Airline.open_finding_count -> Airline.status ->
          Flight.production_hold -> refusal of POST /flights/{id}/production-plan, and a single DISPUTE
          walks the identical chain backwards, clearing production_hold on both flights and letting the
          previously refused plan succeed. The chain is only correct if the flight-level hold is derived
          during the airline transition rather than checked live at planning time.
        test_recipe:
          setup:
            - "Airline SB is DOMESTIC and ACTIVE with open_finding_count 0 and penalty_accrued_cents 0."
            - "Flights SB901 (100 ECONOMY) and SB902 (50 ECONOMY) both depart 2026-09-20T10:00:00Z and are SCHEDULED."
            - "Two SPEC_DEVIATION MINOR findings are already raised by the ComplianceOfficer, so open_finding_count is 2 — one short of OPEN_FINDING_SUSPEND_THRESHOLD."
          setup_api_calls:
            - *c_clk_cfg
            - *c_air_sb
            - *c_spec_sb_y
            - { call: "POST /flights", payload: { airline_id: "${sb_id}", flight_number: "SB901", service_date: "2026-09-20", std_utc: "2026-09-20T10:00:00Z", tail_number: "SE-CCC", station_code: "OSL", pax_economy: 100 }, as: ScheduleFeedOperator, captures: { f_s1: $.data.id } }
            - { call: "POST /flights", payload: { airline_id: "${sb_id}", flight_number: "SB902", service_date: "2026-09-20", std_utc: "2026-09-20T10:00:00Z", tail_number: "SE-DDD", station_code: "OSL", pax_economy: 50 }, as: ScheduleFeedOperator, captures: { f_s2: $.data.id } }
            - { call: "POST /audit-findings", payload: { airline_id: "${sb_id}", flight_id: "${f_s1}", finding_type: "SPEC_DEVIATION", severity: "MINOR", evidence_ref: "AUD-1" }, as: ComplianceOfficer, captures: { af1: $.data.id } }
            - { call: "POST /audit-findings", payload: { airline_id: "${sb_id}", flight_id: "${f_s2}", finding_type: "SPEC_DEVIATION", severity: "MINOR", evidence_ref: "AUD-2" }, as: ComplianceOfficer, captures: { af2: $.data.id } }
            - { call: "GET /airlines/${sb_id}", payload: {}, as: ComplianceOfficer, captures: { sb_count_2: $.data.open_finding_count, sb_status_2: $.data.status } }
          trigger:
            - { call: "POST /audit-findings", payload: { airline_id: "${sb_id}", flight_id: "${f_s1}", finding_type: "LATE_DELIVERY", severity: "MAJOR", evidence_ref: "AUD-3" }, as: ComplianceOfficer, captures: { af3: $.data.id, af3_penalty: $.data.penalty_cents } }
            - { call: "POST /flights/${f_s1}/lock-counts", payload: {}, as: ScheduleFeedOperator }
            - { call: "POST /flights/${f_s1}/production-plan", payload: {}, as: ProductionSupervisor, captures: { plan_err: $.data.error_id } }
            - { call: "POST /audit-findings/${af1}/resolution", payload: { action: "DISPUTE", note: "specification supplied late" }, as: ComplianceOfficer }
            - { call: "POST /flights/${f_s1}/production-plan", payload: {}, as: ProductionSupervisor, captures: { plan_ok_batch: "$.data[0].id" } }
          assert:
            - "${sb_count_2} == 2 and ${sb_status_2} == ACTIVE — two findings do not reach the threshold"
            - "${af3_penalty} == 200000 == round_half_up(80000 * 2.5) for LATE_DELIVERY MAJOR"
            - "hop 1 — Airline.${sb_id}.open_finding_count == 3"
            - "hop 2 — Airline.${sb_id}.status == SUSPENDED and penalty_accrued_cents == 0, because no finding was ACCEPTED"
            - "hop 3 — Flight.${f_s1}.production_hold == true and Flight.${f_s2}.production_hold == true"
            - "hop 4 — ${plan_err} == ERR_AIRLINE_SUSPENDED with HTTP 422, and Flight.${f_s1}.status is still COUNTS_LOCKED with units_planned == 0"
            - "after the DISPUTE: AuditFinding.${af1}.status == DISPUTED, Airline.${sb_id}.open_finding_count == 2 and status == ACTIVE"
            - "the reverse cascade cleared Flight.${f_s1}.production_hold == false and Flight.${f_s2}.production_hold == false"
            - "the second production-plan call now succeeds: ProductionBatch.${plan_ok_batch}.planned_qty == 100, store_zone == CHILL, is_overflow == false, and Flight.${f_s1}.status == PLANNED with units_planned == 100"
            - "AuditFinding.${af2}.status == OPEN and AuditFinding.${af3}.status == OPEN — only the disputed finding changed"

  # =========================================================================
  - rule_id: priority_pair_validation_conflict
    instances:

      - name: counts_locked_at_priority_70_outranks_the_special_meal_cutoff_at_110
        grounds:
          - priority_conflict_pairs[0]
          - validations[priority=70]
          - validations[priority=110]
          - errors[ERR_FLIGHT_COUNTS_LOCKED]
          - errors[ERR_SPECIAL_MEAL_CUTOFF_PASSED]
        distinguishing_aspect: |
          One POST /special-meal-orders request violates priority 70 (the flight is COUNTS_LOCKED) and
          priority 110 (the clock is past special_meal_cutoff_utc) at once and must return
          ERR_FLIGHT_COUNTS_LOCKED with HTTP 409, never ERR_SPECIAL_MEAL_CUTOFF_PASSED with HTTP 422.
          A control request against an unlocked flight at the same instant proves priority 110 is
          genuinely violated, so returning it for the conflict case is a real ordering failure.
        test_recipe:
          setup:
            - "Airline AN has special_meal_cutoff_minutes 720, so both flights have special_meal_cutoff_utc 2026-09-14T22:00:00Z."
            - "Flight AN411 (180 ECONOMY) has had its counts locked and is therefore COUNTS_LOCKED."
            - "Flight AN413 (120 ECONOMY) is identical but has NOT been locked and is still SCHEDULED."
            - "The clock is 2026-09-15T03:00:00Z, five hours past both cutoffs."
          setup_api_calls:
            - *c_clk_cfg
            - *c_air_an
            - *c_spec_y
            - *c_spec_v
            - *c_flt_y180
            - &c_flt_ctl { call: "POST /flights", payload: { airline_id: "${an_id}", flight_number: "AN413", service_date: "2026-09-15", std_utc: "2026-09-15T10:00:00Z", tail_number: "LN-DDD", station_code: "OSL", pax_economy: 120 }, as: ScheduleFeedOperator, captures: { f_ctl_id: $.data.id } }
            - *c_clk_lock
            - *c_lock_y
          trigger:
            - { call: "POST /special-meal-orders", payload: { flight_id: "${f_ctl_id}", meal_specification_id: "${spec_v_id}", passenger_ref: "PAX-101", seat_number: "22A" }, as: AirlineRep, as_user_id: "${an_id}", captures: { ctl_err: $.data.error_id } }
            - { call: "POST /special-meal-orders", payload: { flight_id: "${f_id}", meal_specification_id: "${spec_v_id}", passenger_ref: "PAX-102", seat_number: "22B" }, as: AirlineRep, as_user_id: "${an_id}", captures: { conflict_err: $.data.error_id } }
          assert:
            - "${ctl_err} == ERR_SPECIAL_MEAL_CUTOFF_PASSED with HTTP 422 — on the SCHEDULED control flight only priority 110 is violated"
            - "${conflict_err} == ERR_FLIGHT_COUNTS_LOCKED with HTTP 409 — priority 70 wins on the locked flight even though priority 110 is violated identically"
            - "${conflict_err} != ERR_SPECIAL_MEAL_CUTOFF_PASSED"
            - "no SpecialMealOrder row exists for Flight.${f_id} or Flight.${f_ctl_id} — both requests were rejected before any write"
            - "Flight.${f_id}.status == COUNTS_LOCKED and Flight.${f_ctl_id}.status == SCHEDULED are unchanged"

      - name: release_deadline_at_priority_80_outranks_cart_capacity_at_100
        grounds:
          - priority_conflict_pairs[1]
          - validations[priority=80]
          - validations[priority=100]
          - errors[ERR_RELEASE_DEADLINE_PASSED]
          - errors[ERR_CART_CAPACITY_EXCEEDED]
        distinguishing_aspect: |
          A single POST /carts/{id}/items request loads 10 units from a batch whose release_deadline_utc
          08:30 has passed into a cart with capacity_units 5, violating priority 80 and priority 100 at
          the same time; the response must be ERR_RELEASE_DEADLINE_PASSED. A control request issued
          before the deadline against the same undersized cart returns ERR_CART_CAPACITY_EXCEEDED,
          proving both rules fire independently.
        test_recipe:
          setup:
            - "Flight AN411's CHILL batch of 180 AN-Y-STD units is RELEASED with release_deadline_utc 2026-09-15T08:30:00Z."
            - "A second cart CHL-02 is created as STD_HALF / CHILL with capacity_units 5."
            - "The control request runs at 2026-09-15T06:10:00Z, before the deadline; the conflict request runs at 2026-09-15T08:45:00Z, after it."
          setup_api_calls:
            - *c_clk_cfg
            - *c_air_an
            - *c_spec_y
            - *c_flt_y180
            - *c_clk_lock
            - *c_lock_y
            - *c_clk_plan
            - *c_plan_y180
            - *c_clk_prod
            - *c_start_y
            - *c_clk_qa
            - *c_hc_y_ch
            - *c_hc_y_hd
            - *c_clk_cmpl
            - *c_cmpl_y180
            - *c_rel_y
            - *c_clk_cart
            - &c_cart_small { call: "POST /carts", payload: { flight_id: "${f_id}", cart_code: "CHL-02", cart_type: "STD_HALF", storage_class: "CHILL", capacity_units: 5, galley_position: "G3" }, as: LoadMaster, as_user_id: "lm_alice", captures: { cart_sm_id: $.data.id } }
          trigger:
            - { call: "POST /carts/${cart_sm_id}/items", payload: { production_batch_id: "${b_y_id}", qty_units: 10 }, as: LoadMaster, as_user_id: "lm_alice", captures: { cap_only_err: $.data.error_id } }
            - { call: "POST /_clock/set_current_utc", payload: { current_utc: "2026-09-15T08:45:00Z" }, as: PlatformAdmin }
            - { call: "POST /carts/${cart_sm_id}/items", payload: { production_batch_id: "${b_y_id}", qty_units: 10 }, as: LoadMaster, as_user_id: "lm_alice", captures: { conflict_err_2: $.data.error_id } }
          assert:
            - "ProductionBatch.${b_y_id}.release_deadline_utc == 2026-09-15T08:30:00Z == min(05:30 + 72h, 10:00 - 90min, 04:00 + 72h) pinned at planning time"
            - "${cap_only_err} == ERR_CART_CAPACITY_EXCEEDED with HTTP 422 — at 06:10 only priority 100 is violated"
            - "${conflict_err_2} == ERR_RELEASE_DEADLINE_PASSED with HTTP 422 — at 08:45 priority 80 wins over the identical capacity breach"
            - "${conflict_err_2} != ERR_CART_CAPACITY_EXCEEDED"
            - "Cart.${cart_sm_id}.build_status == EMPTY and loaded_units == 0 after both rejections"
            - "Flight.${f_id}.units_loaded == 0 and cost_per_pax_cents == 0"

      - name: storage_class_mismatch_at_priority_90_outranks_the_cost_cap_at_120
        grounds:
          - priority_conflict_pairs[2]
          - validations[priority=90]
          - validations[priority=120]
          - errors[ERR_STORAGE_CLASS_MISMATCH]
          - errors[ERR_COST_CAP_EXCEEDED]
        distinguishing_aspect: |
          Airline CC's cost_cap_per_pax_cents is 1500 while one FIRST tray costs 4704 cents gross, so a
          single unit breaches the cap. Loading that HOT batch into a CHILL cart violates priority 90 and
          priority 120 together and must return ERR_STORAGE_CLASS_MISMATCH; loading it into a correctly
          classed HOT cart isolates priority 120 and returns ERR_COST_CAP_EXCEEDED.
        test_recipe:
          setup:
            - "Airline CC 'CapCheck Air' is DOMESTIC with cost_cap_per_pax_cents 1500."
            - "Specification CC-F-STD is FIRST / STANDARD / HOT at 4200 cents with shelf_life_hours 4 and required steps COOK_TEMP and HOLD_TEMP."
            - "Flight CC902 carries exactly 1 FIRST passenger, so the FINAL requirement is a single HOT batch of 1 unit, RELEASED before its 2026-09-15T08:00:00Z deadline."
            - "Two carts exist for the flight: HOT-01 (OVEN_RACK / HOT / capacity 10) and CHL-01 (STD_FULL / CHILL / capacity 10)."
          setup_api_calls:
            - *c_clk_cfg
            - &c_air_cc { call: "POST /airlines", payload: { name: "CapCheck Air", iata_code: "CC", waste_regime: "DOMESTIC", cost_cap_per_pax_cents: 1500 }, as: PlatformAdmin, captures: { cc_id: $.data.id } }
            - &c_spec_cc_f { call: "POST /meal-specifications", payload: { airline_id: "${cc_id}", spec_code: "CC-F-STD", cabin: "FIRST", meal_code: "STANDARD", storage_class: "HOT", portion_grams: 420, gross_weight_grams: 900, unit_cost_cents: 4200, shelf_life_hours: 4, required_haccp_steps: ["COOK_TEMP", "HOLD_TEMP"], load_factor_pct: 0.00 }, as: PlatformAdmin, captures: { spec_cc_f_id: $.data.id } }
            - { call: "POST /flights", payload: { airline_id: "${cc_id}", flight_number: "CC902", service_date: "2026-09-15", std_utc: "2026-09-15T10:00:00Z", tail_number: "OY-EEE", station_code: "OSL", pax_first: 1 }, as: ScheduleFeedOperator, captures: { f_cc_id: $.data.id } }
            - *c_clk_lock
            - { call: "POST /flights/${f_cc_id}/lock-counts", payload: {}, as: ScheduleFeedOperator }
            - *c_clk_plan
            - { call: "POST /flights/${f_cc_id}/production-plan", payload: {}, as: ProductionSupervisor, captures: { b_cc_id: "$.data[0].id" } }
            - *c_clk_prod
            - { call: "POST /production-batches/${b_cc_id}/start", payload: {}, as: ProductionSupervisor }
            - *c_clk_qa
            - { call: "POST /production-batches/${b_cc_id}/haccp-checks", payload: { step_code: "COOK_TEMP", measured_temp_c: 80.0 }, as: QaOfficer }
            - { call: "POST /production-batches/${b_cc_id}/haccp-checks", payload: { step_code: "HOLD_TEMP", measured_temp_c: 4.0 }, as: QaOfficer }
            - *c_clk_cmpl
            - { call: "POST /production-batches/${b_cc_id}/complete", payload: { produced_qty: 1 }, as: ProductionSupervisor }
            - { call: "POST /production-batches/${b_cc_id}/release", payload: {}, as: ProductionSupervisor }
            - *c_clk_cart
            - { call: "POST /carts", payload: { flight_id: "${f_cc_id}", cart_code: "HOT-01", cart_type: "OVEN_RACK", storage_class: "HOT", capacity_units: 10, galley_position: "G1" }, as: LoadMaster, as_user_id: "lm_alice", captures: { cart_cc_hot: $.data.id } }
            - { call: "POST /carts", payload: { flight_id: "${f_cc_id}", cart_code: "CHL-01", cart_type: "STD_FULL", storage_class: "CHILL", capacity_units: 10, galley_position: "G2" }, as: LoadMaster, as_user_id: "lm_alice", captures: { cart_cc_chl: $.data.id } }
          trigger:
            - { call: "POST /carts/${cart_cc_hot}/items", payload: { production_batch_id: "${b_cc_id}", qty_units: 1 }, as: LoadMaster, as_user_id: "lm_alice", captures: { cap_err: $.data.error_id } }
            - { call: "POST /carts/${cart_cc_chl}/items", payload: { production_batch_id: "${b_cc_id}", qty_units: 1 }, as: LoadMaster, as_user_id: "lm_alice", captures: { mismatch_err: $.data.error_id } }
          assert:
            - "ProductionBatch.${b_cc_id}.store_zone == HOT, planned_qty == 1, is_overflow == false and release_deadline_utc == 2026-09-15T08:00:00Z"
            - "the would-be cost is round_half_up(1 * 4200 * 1.12) == 4704, cabin_cpp(FIRST) == round_half_up(4704/1) == 4704 and cost_per_pax_cents == 4704 > cost_cap_per_pax_cents 1500"
            - "${cap_err} == ERR_COST_CAP_EXCEEDED with HTTP 422 — into the correctly classed HOT cart only priority 120 is violated"
            - "${mismatch_err} == ERR_STORAGE_CLASS_MISMATCH with HTTP 422 — priority 90 wins over the identical cap breach"
            - "${mismatch_err} != ERR_COST_CAP_EXCEEDED"
            - "no CartItem row exists for either cart; Cart.${cart_cc_hot}.loaded_units == 0 and Cart.${cart_cc_chl}.loaded_units == 0"
            - "Flight.${f_cc_id}.cost_per_pax_cents == 0 and units_loaded == 0"

  # =========================================================================
  - rule_id: boundary_precision_check
    instances:

      - name: hold_temp_exactly_at_the_maximum_passes_and_one_tenth_above_fails
        grounds:
          - calculations.haccp_check_verdict
          - calculations.haccp_risk_score
          - entities.HaccpCheck.fields.verdict
          - entities.HaccpCheck.fields.sequence_no
          - state_machines.ProductionBatch.IN_PRODUCTION_to_HACCP_HOLD
        distinguishing_aspect: |
          HOLD_TEMP_MAX_C is 5.0 and the comparison is inclusive, so measured_temp_c 5.0 must be PASS and
          leave the batch IN_PRODUCTION while 5.1 — one representable tenth higher — must be FAIL and
          drive HACCP_HOLD with haccp_risk_score 40.00. An exclusive comparison flips the first
          observation and a rounded comparison flips the second.
        test_recipe:
          setup:
            - "Flight AN411's CHILL batch of 180 units is IN_PRODUCTION at 2026-09-15T04:30:00Z with no HaccpCheck rows yet."
            - "Its release_deadline_utc is 2026-09-15T08:30:00Z, so the clock never interferes."
          setup_api_calls:
            - *c_clk_cfg
            - *c_air_an
            - *c_spec_y
            - *c_flt_y180
            - *c_clk_lock
            - *c_lock_y
            - *c_clk_plan
            - *c_plan_y180
            - *c_clk_prod
            - *c_start_y
            - *c_clk_qa
          trigger:
            - { call: "POST /production-batches/${b_y_id}/haccp-checks", payload: { step_code: "HOLD_TEMP", measured_temp_c: 5.0 }, as: QaOfficer, captures: { v_at: $.data.verdict, seq_at: $.data.sequence_no } }
            - { call: "GET /production-batches/${b_y_id}", payload: {}, as: QaOfficer, captures: { st_at: $.data.production_status, risk_at: $.data.haccp_risk_score } }
            - { call: "POST /production-batches/${b_y_id}/haccp-checks", payload: { step_code: "HOLD_TEMP", measured_temp_c: 5.1 }, as: QaOfficer, captures: { v_above: $.data.verdict, seq_above: $.data.sequence_no } }
          assert:
            - "${v_at} == PASS and ${seq_at} == 1 — 5.0 is inclusive at HOLD_TEMP_MAX_C"
            - "${st_at} == IN_PRODUCTION and ${risk_at} == 0.00 — a PASS never moves the batch and never scores"
            - "${v_above} == FAIL and ${seq_above} == 2 — 5.1 is above the maximum"
            - "ProductionBatch.${b_y_id}.production_status == HACCP_HOLD and haccp_risk_score == 40.00 == min(100.00, 40.0*1 + 15.0*0)"
            - "ProductionBatch.${b_y_id}.haccp_rework_rounds == 0 — entering HACCP_HOLD does not itself count as a rework round"
            - "exactly 2 HaccpCheck rows exist for ProductionBatch.${b_y_id}, both with step_code HOLD_TEMP"

      - name: spec_deviation_exactly_at_the_tolerance_raises_a_minor_finding
        grounds:
          - calculations.spec_compliance_deviation
          - calculations.audit_penalty
          - calculations.flight_billing_total
          - state_machines.Flight.DEPARTED_to_RECONCILED
          - entities.Airline.fields.spec_deviation_tolerance_pct
        distinguishing_aspect: |
          Delivering 171 of the 180 required units puts spec_deviation_pct at exactly 5.00, the inclusive
          lower edge of both Airline.spec_deviation_tolerance_pct and the MINOR severity band, so a
          SPEC_DEVIATION MINOR finding of 120000 cents must be raised; 172 units would give 4.44 and no
          finding at all, so the comparison must be >= and not >.
        test_recipe:
          setup:
            - "Flight AN411 is planned for 180 AN-Y-STD units but only 171 are produced, leaving scrapped_qty 9."
            - "All 171 produced units are loaded into cart CHL-01, sealed and manifested, and the single run is delivered at 07:55, inside its window."
            - "Airline AN's spec_deviation_tolerance_pct is 5.00 and its waste_regime is BONDED."
          setup_api_calls:
            - *c_clk_cfg
            - *c_air_an
            - *c_spec_y
            - *c_truck1
            - *c_stand1
            - *c_flt_y180
            - *c_clk_lock
            - *c_lock_y
            - *c_clk_plan
            - *c_plan_y180
            - *c_clk_prod
            - *c_start_y
            - *c_clk_qa
            - *c_hc_y_ch
            - *c_hc_y_hd
            - *c_clk_cmpl
            - { call: "POST /production-batches/${b_y_id}/complete", payload: { produced_qty: 171 }, as: ProductionSupervisor }
            - *c_rel_y
            - *c_clk_cart
            - *c_cart_y
            - { call: "POST /carts/${cart_y_id}/items", payload: { production_batch_id: "${b_y_id}", qty_units: 171 }, as: LoadMaster, as_user_id: "lm_alice" }
            - *c_build_y
            - *c_getcart_y
            - *c_seal_y
            - *c_clk_mfst
            - *c_getflt_1
            - *c_mfst_y
            - *c_issue_y
            - *c_run1
            - *c_clk_disp
            - *c_disp1
            - *c_clk_arr
            - *c_arr1
            - *c_clk_del
            - *c_del1
            - *c_clk_upl
            - *c_getflt_2
          trigger:
            - { call: "POST /flights/${f_id}/uplift-records", payload: { expected_flight_version: "${f_v2}", lines: [{ meal_specification_id: "${spec_y_id}", consumed_units: 160, returned_units: 11 }] }, as: ComplianceOfficer, captures: { upl_d_id: $.data.id, dev_pct: $.data.spec_deviation_pct, dev_gross: $.data.gross_cost_cents } }
          assert:
            - "${dev_pct} == 5.00 == round_half_up(abs(171 - 180) / 180 * 100, 2) — exactly at the tolerance, not above it"
            - "exactly one AuditFinding exists for Flight.${f_id} with finding_type SPEC_DEVIATION, severity MINOR, source SYSTEM, status OPEN and penalty_cents == 120000 == round_half_up(120000 * 1.0)"
            - "no SEAL_MISMATCH and no LATE_DELIVERY finding exists — seal_mismatch_count == 0 and late_penalty_cents == 0"
            - "${dev_gross} == 277704 == round_half_up(171 * 1450 * 1.12)"
            - "UpliftRecord.${upl_d_id}.uplifted_units == 171, consumed_units == 160, returned_units == 11 and unused_units == 11"
            - "UpliftRecord.${upl_d_id}.net_cost_cents == 277704, handling_fee_cents == 19439 == round_half_up(277704 * 0.07) and billing_total_cents == 297143"
            - "UpliftRecord.${upl_d_id}.cost_per_pax_cents == 1543 == round_half_up(round_half_up(277704/180) * 180 / 180)"
            - "Flight.${f_id}.status == RECONCILED, units_planned == 180, units_produced == 171, units_scrapped == 9 and units_loaded == 171"
            - "Airline.${an_id}.open_finding_count == 1 and status == ACTIVE"

      - name: lateness_one_minute_past_the_grace_window_becomes_billable
        grounds:
          - calculations.delivery_lateness_penalty
          - entities.Airline.fields.late_delivery_grace_minutes
          - entities.DeliveryRun.fields.lateness_minutes
          - state_machines.DeliveryRun.AT_AIRCRAFT_to_DELIVERED
          - calculations.audit_penalty
        distinguishing_aspect: |
          With late_delivery_grace_minutes 10, a run delivered exactly 10 minutes after window_end has
          lateness_minutes 10, billable_minutes 0, penalty_cents 0 and raises no finding, while a sibling
          run delivered 11 minutes late has billable_minutes 1 and penalty_cents 250 and raises exactly
          one LATE_DELIVERY MINOR finding of 80000 cents. The grace subtraction must therefore be
          applied before the band lookup, and the finding gate keyed on penalty_cents >= 1.
        test_recipe:
          setup:
            - "Flight AN411 is loaded, sealed, manifested and ISSUED, so the flight is LOADED."
            - "Run 1 covers 07:30-08:00 and run 2 covers 08:20-08:50 on truck HL-101 with its 20-minute buffer exactly satisfied."
            - "Run 1 is delivered at 2026-09-15T08:10:00Z and run 2 at 2026-09-15T09:01:00Z."
          setup_api_calls:
            - *c_clk_cfg
            - *c_air_an
            - *c_spec_y
            - *c_truck1
            - *c_stand1
            - *c_flt_y180
            - *c_clk_lock
            - *c_lock_y
            - *c_clk_plan
            - *c_plan_y180
            - *c_clk_prod
            - *c_start_y
            - *c_clk_qa
            - *c_hc_y_ch
            - *c_hc_y_hd
            - *c_clk_cmpl
            - *c_cmpl_y180
            - *c_rel_y
            - *c_clk_cart
            - *c_cart_y
            - *c_item_y180
            - *c_build_y
            - *c_getcart_y
            - *c_seal_y
            - *c_clk_mfst
            - *c_getflt_1
            - *c_mfst_y
            - *c_issue_y
            - *c_run1
            - *c_run2
            - *c_clk_disp
            - *c_disp1
            - { call: "POST /_clock/set_current_utc", payload: { current_utc: "2026-09-15T08:05:00Z" }, as: PlatformAdmin }
            - *c_arr1
          trigger:
            - { call: "POST /_clock/set_current_utc", payload: { current_utc: "2026-09-15T08:10:00Z" }, as: PlatformAdmin }
            - { call: "POST /delivery-runs/${run1_id}/events", payload: { event_type: "DELIVER" }, as: LoadMaster, as_user_id: "lm_bob", captures: { late1: $.data.lateness_minutes, pen1: $.data.penalty_cents } }
            - { call: "POST /_clock/set_current_utc", payload: { current_utc: "2026-09-15T08:15:00Z" }, as: PlatformAdmin }
            - { call: "POST /delivery-runs/${run2_id}/events", payload: { event_type: "DISPATCH" }, as: LoadMaster, as_user_id: "lm_bob" }
            - { call: "POST /_clock/set_current_utc", payload: { current_utc: "2026-09-15T08:55:00Z" }, as: PlatformAdmin }
            - { call: "POST /delivery-runs/${run2_id}/events", payload: { event_type: "ARRIVE" }, as: LoadMaster, as_user_id: "lm_bob" }
            - { call: "POST /_clock/set_current_utc", payload: { current_utc: "2026-09-15T09:01:00Z" }, as: PlatformAdmin }
            - { call: "POST /delivery-runs/${run2_id}/events", payload: { event_type: "DELIVER" }, as: LoadMaster, as_user_id: "lm_bob", captures: { late2: $.data.lateness_minutes, pen2: $.data.penalty_cents } }
          assert:
            - "${late1} == 10 == ceil((08:10:00Z - 08:00:00Z) / 60s) and ${pen1} == 0 because billable_minutes == max(0, 10 - 10) == 0"
            - "${late2} == 11 == ceil((09:01:00Z - 08:50:00Z) / 60s) and ${pen2} == 250 == 1 * 250, the first band's rate on a single billable minute"
            - "exactly one AuditFinding exists for Flight.${f_id}: finding_type LATE_DELIVERY, severity MINOR, source SYSTEM, penalty_cents == 80000 — run 1's zero penalty raised nothing"
            - "Airline.${an_id}.open_finding_count == 1 and penalty_accrued_cents == 0"
            - "both runs are DELIVERED, Flight.${f_id}.status == DEPARTED and Cart.${cart_y_id}.build_status == LOADED"

  # =========================================================================
  - rule_id: cross_entity_state_dependency
    instances:

      - name: cart_item_load_requires_the_source_batch_to_be_released
        grounds:
          - validations[priority=70]
          - errors[ERR_BATCH_NOT_RELEASED]
          - state_machines.Cart.EMPTY_to_BUILDING
          - state_machines.ProductionBatch.COMPLETED_to_RELEASED
          - endpoints[POST /carts/{id}/items]
        distinguishing_aspect: |
          The identical POST /carts/{id}/items payload is refused with ERR_BATCH_NOT_RELEASED and then
          accepted, with nothing changed except the referenced ProductionBatch's production_status. The
          gate therefore lives on the other entity's state, and the cart itself must be untouched by the
          refusal — still EMPTY with loaded_units 0 and no CartItem row.
        test_recipe:
          setup:
            - "Flight AN411 is PLANNED with a single CHILL batch of 180 units still in production_status PLANNED."
            - "Cart CHL-01 exists at 2026-09-15T06:10:00Z as EMPTY / UNSEALED with capacity_units 200."
            - "The clock 06:10 is comfortably before the batch's 08:30 release deadline for every call."
          setup_api_calls:
            - *c_clk_cfg
            - *c_air_an
            - *c_spec_y
            - *c_flt_y180
            - *c_clk_lock
            - *c_lock_y
            - *c_clk_plan
            - *c_plan_y180
            - *c_clk_cart
            - *c_cart_y
          trigger:
            - { call: "POST /carts/${cart_y_id}/items", payload: { production_batch_id: "${b_y_id}", qty_units: 180 }, as: LoadMaster, as_user_id: "lm_alice", captures: { pre_err: $.data.error_id } }
            - { call: "GET /carts/${cart_y_id}", payload: {}, as: LoadMaster, as_user_id: "lm_alice", captures: { cart_after_refusal: $.data.build_status, units_after_refusal: $.data.loaded_units } }
            - *c_start_y
            - *c_hc_y_ch
            - *c_hc_y_hd
            - *c_cmpl_y180
            - *c_rel_y
            - { call: "POST /carts/${cart_y_id}/items", payload: { production_batch_id: "${b_y_id}", qty_units: 180 }, as: LoadMaster, as_user_id: "lm_alice", captures: { ok_item_id: $.data.id, ok_qty: $.data.qty_units, ok_meal_code: $.data.meal_code } }
          assert:
            - "${pre_err} == ERR_BATCH_NOT_RELEASED with HTTP 409 while ProductionBatch.${b_y_id}.production_status == PLANNED"
            - "${cart_after_refusal} == EMPTY and ${units_after_refusal} == 0 — the refusal left no partial write"
            - "after the release, ProductionBatch.${b_y_id}.production_status == RELEASED with released_at 2026-09-15T06:10:00Z"
            - "${ok_qty} == 180 and ${ok_meal_code} == STANDARD and CartItem.${ok_item_id}.status == ACTIVE"
            - "Cart.${cart_y_id}.build_status == BUILDING, loaded_units == 180 and seal_status == UNSEALED"
            - "Flight.${f_id}.units_loaded == 180 and cost_per_pax_cents == 1624 == round_half_up(round_half_up(180 * 1450 * 1.12) / 180)"
            - "exactly one CartItem row exists for Cart.${cart_y_id} — the refused call created none"

      - name: dispatch_requires_the_manifest_to_be_issued_after_a_reseal_amended_it
        grounds:
          - validations[priority=70]
          - errors[ERR_MANIFEST_NOT_ISSUED]
          - state_machines.LoadingManifest.ISSUED_to_AMENDED
          - state_machines.DeliveryRun.RESERVED_to_EN_ROUTE
          - state_machines.Cart.SEALED_to_RESEALED
        distinguishing_aspect: |
          A cart reseal two hops away from the delivery run flips the run's dispatch eligibility: the run
          stays RESERVED and the clock stays inside its DISPATCH_LEAD_MINUTES window, yet DISPATCH is
          refused with ERR_MANIFEST_NOT_ISSUED purely because the manifest moved ISSUED -> AMENDED.
          Re-issuing the manifest restores eligibility with no change to the run itself.
        test_recipe:
          setup:
            - "Flight AN411 is loaded into cart CHL-01, sealed by lm_alice as SEAL-AN411-01, manifested and ISSUED by lm_bob, so the flight is LOADED."
            - "Run 1 covers 07:30-08:00 and the clock is 2026-09-15T07:25:00Z, inside window_start minus DISPATCH_LEAD_MINUTES 60."
            - "lm_carol refits the seal as SEAL-AN411-02, so the manifest issuer lm_bob still differs from the sealer at re-issue."
          setup_api_calls:
            - *c_clk_cfg
            - *c_air_an
            - *c_spec_y
            - *c_truck1
            - *c_stand1
            - *c_flt_y180
            - *c_clk_lock
            - *c_lock_y
            - *c_clk_plan
            - *c_plan_y180
            - *c_clk_prod
            - *c_start_y
            - *c_clk_qa
            - *c_hc_y_ch
            - *c_hc_y_hd
            - *c_clk_cmpl
            - *c_cmpl_y180
            - *c_rel_y
            - *c_clk_cart
            - *c_cart_y
            - *c_item_y180
            - *c_build_y
            - *c_getcart_y
            - *c_seal_y
            - *c_clk_mfst
            - *c_getflt_1
            - *c_mfst_y
            - *c_issue_y
            - *c_run1
            - *c_clk_disp
          trigger:
            - { call: "GET /carts/${cart_y_id}", payload: {}, as: LoadMaster, as_user_id: "lm_carol", captures: { reseal_v: $.data.version } }
            - { call: "POST /carts/${cart_y_id}/seals", payload: { expected_cart_version: "${reseal_v}", seal_number: "SEAL-AN411-02" }, as: LoadMaster, as_user_id: "lm_carol", captures: { reseal_status: $.data.seal_status, reseal_count: $.data.seal_count } }
            - { call: "POST /delivery-runs/${run1_id}/events", payload: { event_type: "DISPATCH" }, as: LoadMaster, as_user_id: "lm_bob", captures: { dispatch_err: $.data.error_id } }
            - { call: "POST /loading-manifests/${mf_id}/issue", payload: {}, as: LoadMaster, as_user_id: "lm_bob" }
            - { call: "POST /delivery-runs/${run1_id}/events", payload: { event_type: "DISPATCH" }, as: LoadMaster, as_user_id: "lm_bob", captures: { run_status_ok: $.data.status, run_dispatched: $.data.dispatched_at_utc } }
          assert:
            - "${reseal_status} == RESEALED and ${reseal_count} == 2 with Cart.${cart_y_id}.seal_number == SEAL-AN411-02 and build_status still BUILT"
            - "the reseal drove LoadingManifest.${mf_id} to AMENDED with amendment_count == 1 and Flight.${f_id} from LOADED to PLANNED"
            - "${dispatch_err} == ERR_MANIFEST_NOT_ISSUED with HTTP 409 even though DeliveryRun.${run1_id}.status == RESERVED and the clock 07:25 is at or after 07:30 minus 60 minutes"
            - "DeliveryRun.${run1_id}.dispatched_at_utc is still null after the refusal"
            - "the re-issue set LoadingManifest.${mf_id}.status == ISSUED, amendment_count == 1, total_units == 180 and Flight.${f_id}.status == LOADED, re-pinning SEAL-AN411-02 in cart_seal_snapshot"
            - "${run_status_ok} == EN_ROUTE and ${run_dispatched} == 2026-09-15T07:25:00Z"

  # =========================================================================
  - rule_id: resource_temporal_overlap
    instances:

      - name: truck_half_open_window_plus_buffer_rejects_and_accepts_at_the_boundary
        grounds:
          - validations[priority=110]
          - errors[ERR_TRUCK_SLOT_CONFLICT]
          - entities.Truck.fields.buffer_minutes
          - endpoints[POST /delivery-runs]
        distinguishing_aspect: |
          Truck occupancy is half-open with a 20-minute buffer, so with an existing run [07:30, 08:00) a
          candidate starting 08:10 is refused (08:10 < 08:20) while a candidate starting exactly 08:20 is
          accepted (08:20 is not < 08:20). The two requests differ by ten minutes and must land on
          opposite sides of the comparison, which pins both the buffer arithmetic and the strictness.
        test_recipe:
          setup:
            - "Truck HL-101 has buffer_minutes 20 and already holds run 1 on window 2026-09-15T07:30:00Z - 2026-09-15T08:00:00Z for the ISSUED manifest of flight AN411."
            - "Stand A12 has max_concurrent_runs 2 and no run shares an instant with the candidates."
            - "The flight's admissible slot band is 2026-09-15T05:00:00Z - 2026-09-15T09:15:00Z, so all candidate windows are inside it."
          setup_api_calls:
            - *c_clk_cfg
            - *c_air_an
            - *c_spec_y
            - *c_truck1
            - *c_stand1
            - *c_flt_y180
            - *c_clk_lock
            - *c_lock_y
            - *c_clk_plan
            - *c_plan_y180
            - *c_clk_prod
            - *c_start_y
            - *c_clk_qa
            - *c_hc_y_ch
            - *c_hc_y_hd
            - *c_clk_cmpl
            - *c_cmpl_y180
            - *c_rel_y
            - *c_clk_cart
            - *c_cart_y
            - *c_item_y180
            - *c_build_y
            - *c_getcart_y
            - *c_seal_y
            - *c_clk_mfst
            - *c_getflt_1
            - *c_mfst_y
            - *c_issue_y
            - *c_run1
          trigger:
            - { call: "POST /delivery-runs", payload: { loading_manifest_id: "${mf_id}", truck_id: "${truck1_id}", stand_id: "${stand1_id}", window_start_utc: "2026-09-15T08:10:00Z", window_end_utc: "2026-09-15T08:40:00Z" }, as: LoadMaster, as_user_id: "lm_bob", captures: { truck_err: $.data.error_id } }
            - { call: "POST /delivery-runs", payload: { loading_manifest_id: "${mf_id}", truck_id: "${truck1_id}", stand_id: "${stand1_id}", window_start_utc: "2026-09-15T08:20:00Z", window_end_utc: "2026-09-15T08:50:00Z" }, as: LoadMaster, as_user_id: "lm_bob", captures: { ok_run_id: $.data.id, ok_run_status: $.data.status } }
          assert:
            - "${truck_err} == ERR_TRUCK_SLOT_CONFLICT with HTTP 422 — 08:10 < 08:00 + 20 minutes and 08:40 > 07:30, so both half-open conditions hold"
            - "${ok_run_status} == RESERVED and DeliveryRun.${ok_run_id}.window_start_utc == 2026-09-15T08:20:00Z — 08:20 is not strictly before 08:20, so the buffer is exactly cleared"
            - "exactly 2 DeliveryRun rows exist for LoadingManifest.${mf_id}: ${run1_id} and ${ok_run_id}"
            - "DeliveryRun.${run1_id} is unchanged: status RESERVED with window 07:30-08:00 and dispatched_at_utc null"
            - "Flight.${f_id}.status == LOADED — a refused run reservation does not touch the flight"

      - name: stand_closed_interval_aggregate_limit_rejects_the_third_run_sharing_one_instant
        grounds:
          - validations[priority=110]
          - errors[ERR_STAND_CAPACITY_CONFLICT]
          - entities.Stand.fields.max_concurrent_runs
          - endpoints[POST /delivery-runs]
        distinguishing_aspect: |
          Stand occupancy is a CLOSED interval with an aggregate limit, the opposite convention to the
          truck rule. Runs [07:30, 08:00] and [08:00, 08:30] share the single instant 08:00 and are both
          admitted at max_concurrent_runs 2, but a third run [08:00, 08:20] covering that same instant
          is refused. Treating the stand interval as half-open would admit all three.
        test_recipe:
          setup:
            - "Stand A12 has max_concurrent_runs 2 and already holds run 1 on 07:30-08:00 for the ISSUED manifest of flight AN411."
            - "Trucks HL-102 and HL-103 exist with buffer_minutes 20 and hold no runs at all, so the truck rule never fires for the candidates."
            - "All candidate windows sit inside the flight's admissible band 05:00-09:15."
          setup_api_calls:
            - *c_clk_cfg
            - *c_air_an
            - *c_spec_y
            - *c_truck1
            - &c_truck2 { call: "POST /trucks", payload: { station_code: "OSL", registration: "HL-102", buffer_minutes: 20 }, as: PlatformAdmin, captures: { truck2_id: $.data.id } }
            - &c_truck3 { call: "POST /trucks", payload: { station_code: "OSL", registration: "HL-103", buffer_minutes: 20 }, as: PlatformAdmin, captures: { truck3_id: $.data.id } }
            - *c_stand1
            - *c_flt_y180
            - *c_clk_lock
            - *c_lock_y
            - *c_clk_plan
            - *c_plan_y180
            - *c_clk_prod
            - *c_start_y
            - *c_clk_qa
            - *c_hc_y_ch
            - *c_hc_y_hd
            - *c_clk_cmpl
            - *c_cmpl_y180
            - *c_rel_y
            - *c_clk_cart
            - *c_cart_y
            - *c_item_y180
            - *c_build_y
            - *c_getcart_y
            - *c_seal_y
            - *c_clk_mfst
            - *c_getflt_1
            - *c_mfst_y
            - *c_issue_y
            - *c_run1
          trigger:
            - { call: "POST /delivery-runs", payload: { loading_manifest_id: "${mf_id}", truck_id: "${truck2_id}", stand_id: "${stand1_id}", window_start_utc: "2026-09-15T08:00:00Z", window_end_utc: "2026-09-15T08:30:00Z" }, as: LoadMaster, as_user_id: "lm_bob", captures: { second_run_id: $.data.id, second_status: $.data.status } }
            - { call: "POST /delivery-runs", payload: { loading_manifest_id: "${mf_id}", truck_id: "${truck3_id}", stand_id: "${stand1_id}", window_start_utc: "2026-09-15T08:00:00Z", window_end_utc: "2026-09-15T08:20:00Z" }, as: LoadMaster, as_user_id: "lm_bob", captures: { stand_err: $.data.error_id } }
          assert:
            - "${second_status} == RESERVED — [07:30, 08:00] and [08:00, 08:30] both cover 08:00, giving exactly max_concurrent_runs 2 at that instant"
            - "${stand_err} == ERR_STAND_CAPACITY_CONFLICT with HTTP 422 — the third run would make 3 non-cancelled runs cover 08:00"
            - "the third request was NOT refused with ERR_TRUCK_SLOT_CONFLICT, because truck HL-103 holds no other run"
            - "exactly 2 DeliveryRun rows exist for LoadingManifest.${mf_id}: ${run1_id} and ${second_run_id}"
            - "DeliveryRun.${second_run_id}.truck_id == ${truck2_id} and stand_id == ${stand1_id}"
            - "Flight.${f_id}.status == LOADED and LoadingManifest.${mf_id}.amendment_count == 0"

  # =========================================================================
  - rule_id: compensating_invariant
    instances:

      - name: voiding_a_cart_item_restores_every_loaded_unit_and_cost_aggregate
        grounds:
          - endpoints[DELETE /carts/{id}/items/{cart_item_id}]
          - state_machines.Cart.BUILT_to_BUILDING
          - calculations.cost_per_passenger_report
          - entities.Flight.fields.units_loaded
          - entities.CartItem.fields.status
        distinguishing_aspect: |
          Deleting the only cart item must return Cart.loaded_units, Flight.units_loaded and
          Flight.cost_per_pax_cents to the exact pre-load triple (0, 0, 0) after they had reached
          (180, 180, 1624), while the CartItem row survives as VOID with a voided_at stamp. Any
          implementation that recomputes from a stale denominator, or that deletes the row outright,
          leaves an observable drift on at least one of the four fields.
        test_recipe:
          setup:
            - "Flight AN411's CHILL batch of 180 units is RELEASED and cart CHL-01 exists as EMPTY / UNSEALED with capacity 200."
            - "The pre-load aggregates are captured before anything is loaded."
            - "The cart is never sealed, so the seal axis stays UNSEALED throughout and no manifest exists to amend."
          setup_api_calls:
            - *c_clk_cfg
            - *c_air_an
            - *c_spec_y
            - *c_flt_y180
            - *c_clk_lock
            - *c_lock_y
            - *c_clk_plan
            - *c_plan_y180
            - *c_clk_prod
            - *c_start_y
            - *c_clk_qa
            - *c_hc_y_ch
            - *c_hc_y_hd
            - *c_clk_cmpl
            - *c_cmpl_y180
            - *c_rel_y
            - *c_clk_cart
            - *c_cart_y
            - { call: "GET /flights/${f_id}", payload: {}, as: LoadMaster, as_user_id: "lm_alice", captures: { pre_units: $.data.units_loaded, pre_cpp: $.data.cost_per_pax_cents } }
          trigger:
            - *c_item_y180
            - *c_build_y
            - { call: "GET /flights/${f_id}", payload: {}, as: LoadMaster, as_user_id: "lm_alice", captures: { mid_units: $.data.units_loaded, mid_cpp: $.data.cost_per_pax_cents } }
            - { call: "DELETE /carts/${cart_y_id}/items/${item_y_id}", payload: {}, as: LoadMaster, as_user_id: "lm_alice" }
            - { call: "GET /flights/${f_id}", payload: {}, as: LoadMaster, as_user_id: "lm_alice", captures: { post_units: $.data.units_loaded, post_cpp: $.data.cost_per_pax_cents } }
          assert:
            - "${pre_units} == 0 and ${pre_cpp} == 0"
            - "${mid_units} == 180 and ${mid_cpp} == 1624 == round_half_up(round_half_up(180 * 1450 * 1.12) / 180)"
            - "${post_units} == 0 and ${post_cpp} == 0 — byte-identical to the pre-load pair, with no residual"
            - "CartItem.${item_y_id}.status == VOID with voided_at == 2026-09-15T06:10:00Z; the row still exists and still reports qty_units 180"
            - "Cart.${cart_y_id}.build_status == BUILDING (reverted from BUILT), loaded_units == 0 and seal_status == UNSEALED"
            - "ProductionBatch.${b_y_id}.production_status == RELEASED and produced_qty == 180 — voiding a cart item does not unwind production"
            - "Flight.${f_id}.status == PLANNED and units_produced == 180"

      - name: withdrawing_an_accepted_finding_restores_the_airline_penalty_accrual
        grounds:
          - state_machines.AuditFinding.OPEN_to_ACCEPTED
          - state_machines.AuditFinding.ACCEPTED_to_WITHDRAWN
          - entities.Airline.fields.penalty_accrued_cents
          - entities.Airline.fields.open_finding_count
          - roles.AirlineRep
        distinguishing_aspect: |
          ACCEPT adds penalty_cents to Airline.penalty_accrued_cents and decrements open_finding_count,
          and WITHDRAW must subtract the same amount without touching open_finding_count a second time —
          the decrement is conditional on the PRIOR status being OPEN. The end state is therefore
          (penalty_accrued_cents 0, open_finding_count 0), and a naive symmetric undo would produce
          open_finding_count -1.
        test_recipe:
          setup:
            - "Airline SB is DOMESTIC and ACTIVE with open_finding_count 0 and penalty_accrued_cents 0."
            - "Flight SB901 (100 ECONOMY) departs 2026-09-20T10:00:00Z."
            - "The ComplianceOfficer raises one SEAL_MISMATCH MAJOR finding against it, so penalty_cents is 500000."
          setup_api_calls:
            - *c_clk_cfg
            - *c_air_sb
            - { call: "POST /flights", payload: { airline_id: "${sb_id}", flight_number: "SB901", service_date: "2026-09-20", std_utc: "2026-09-20T10:00:00Z", tail_number: "SE-CCC", station_code: "OSL", pax_economy: 100 }, as: ScheduleFeedOperator, captures: { f_w_id: $.data.id } }
            - { call: "POST /audit-findings", payload: { airline_id: "${sb_id}", flight_id: "${f_w_id}", finding_type: "SEAL_MISMATCH", severity: "MAJOR", evidence_ref: "AUD-W1" }, as: ComplianceOfficer, captures: { af_w: $.data.id, af_w_penalty: $.data.penalty_cents, af_w_source: $.data.source } }
            - { call: "GET /airlines/${sb_id}", payload: {}, as: ComplianceOfficer, captures: { w_count_0: $.data.open_finding_count, w_accrued_0: $.data.penalty_accrued_cents } }
          trigger:
            - { call: "POST /audit-findings/${af_w}/resolution", payload: { action: "ACCEPT", note: "seal register reconciled" }, as: ComplianceOfficer, captures: { af_w_status_1: $.data.status } }
            - { call: "GET /airlines/${sb_id}", payload: {}, as: ComplianceOfficer, captures: { w_count_1: $.data.open_finding_count, w_accrued_1: $.data.penalty_accrued_cents } }
            - { call: "POST /audit-findings/${af_w}/resolution", payload: { action: "WITHDRAW", note: "carrier withdrew the claim" }, as: AirlineRep, as_user_id: "${sb_id}", captures: { af_w_status_2: $.data.status } }
          assert:
            - "${af_w_penalty} == 500000 == round_half_up(200000 * 2.5) for SEAL_MISMATCH MAJOR, and ${af_w_source} == SYSTEM because a ComplianceOfficer raised it"
            - "${w_count_0} == 1 and ${w_accrued_0} == 0 — an OPEN finding counts but accrues nothing"
            - "${af_w_status_1} == ACCEPTED, ${w_count_1} == 0 and ${w_accrued_1} == 500000"
            - "${af_w_status_2} == WITHDRAWN"
            - "Airline.${sb_id}.penalty_accrued_cents == 0 — exactly the pre-ACCEPT value, with no drift"
            - "Airline.${sb_id}.open_finding_count == 0 and NOT -1, because the WITHDRAW decrement applies only when the prior status was OPEN"
            - "Airline.${sb_id}.status == ACTIVE throughout — the count never reached OPEN_FINDING_SUSPEND_THRESHOLD 3"

      - name: replacing_a_rejected_waste_manifest_reproduces_the_identical_sealed_mass
        grounds:
          - calculations.waste_manifest_mass
          - state_machines.WasteManifest.DRAFT_to_REJECTED
          - state_machines.WasteManifest.DRAFT_to_SEALED
          - validations[priority=100]
          - errors[ERR_SEAL_NUMBER_DUPLICATE]
        distinguishing_aspect: |
          Rejecting a bonded waste manifest releases its seal_number for reuse and must leave the
          immutable disposition lines untouched, so the replacement manifest recomputes exactly the same
          sealed_weight_grams 7000 under the same seal number WST-AN411-01. An implementation that
          consumes the disposition units on the first manifest, or that keeps the seal reserved, cannot
          reproduce both the mass and the seal.
        test_recipe:
          setup:
            - "Flight AN411 is RECONCILED and its UpliftRecord is DISPOSITIONED with 10 destroyed units of AN-Y-STD (gross_weight_grams 700)."
            - "Airline AN is BONDED, so INCINERATION is the only admissible disposal_method."
            - "The clock is 2026-09-15T13:00:00Z and no waste manifest exists yet."
          setup_api_calls:
            - *c_clk_cfg
            - *c_air_an
            - *c_spec_y
            - *c_truck1
            - *c_stand1
            - *c_flt_y180
            - *c_clk_lock
            - *c_lock_y
            - *c_clk_plan
            - *c_plan_y180
            - *c_clk_prod
            - *c_start_y
            - *c_clk_qa
            - *c_hc_y_ch
            - *c_hc_y_hd
            - *c_clk_cmpl
            - *c_cmpl_y180
            - *c_rel_y
            - *c_clk_cart
            - *c_cart_y
            - *c_item_y180
            - *c_build_y
            - *c_getcart_y
            - *c_seal_y
            - *c_clk_mfst
            - *c_getflt_1
            - *c_mfst_y
            - *c_issue_y
            - *c_run1
            - *c_clk_disp
            - *c_disp1
            - *c_clk_arr
            - *c_arr1
            - *c_clk_del
            - *c_del1
            - *c_clk_upl
            - *c_getflt_2
            - *c_upl_y
            - *c_disp_y
          trigger:
            - { call: "POST /waste-manifests", payload: { uplift_record_id: "${upl_id}", disposal_method: "INCINERATION", seal_number: "WST-AN411-01" }, as: ComplianceOfficer, captures: { wm1_id: $.data.id, wm1_mass: $.data.sealed_weight_grams, wm1_regime: $.data.regime } }
            - { call: "POST /waste-manifests/${wm1_id}/transitions", payload: { action: "REJECT", rejection_reason: "bonded seal tampered in transit" }, as: ComplianceOfficer, captures: { wm1_status: $.data.status } }
            - { call: "POST /waste-manifests", payload: { uplift_record_id: "${upl_id}", disposal_method: "INCINERATION", seal_number: "WST-AN411-01" }, as: ComplianceOfficer, captures: { wm2_id: $.data.id, wm2_mass: $.data.sealed_weight_grams } }
            - { call: "POST /waste-manifests/${wm2_id}/transitions", payload: { action: "SEAL" }, as: ComplianceOfficer, captures: { wm2_status: $.data.status } }
          assert:
            - "${wm1_mass} == 7000 == 10 destroy_units * 700 gross_weight_grams, and ${wm1_regime} == BONDED copied from the airline"
            - "${wm1_status} == REJECTED with rejection_reason recorded"
            - "${wm2_mass} == 7000 — byte-identical to ${wm1_mass}, recomputed from the same immutable disposition lines"
            - "the replacement reused seal_number WST-AN411-01 without ERR_SEAL_NUMBER_DUPLICATE, because the REJECT released it"
            - "${wm2_status} == SEALED and WasteManifest.${wm2_id}.disposal_method == INCINERATION"
            - "UpliftRecord.${upl_id}.status == DISPOSITIONED — it becomes CLOSED only when a manifest reaches DISPOSED, which neither did"
            - "Cart.${cart_y_id}.build_status == RETURNED and seal_status == BROKEN with seal_number still SEAL-AN411-01 — the first manifest creation returned the cart exactly once"
            - "ProductionBatch.${b_y_id}.production_status == DISPOSED and Airline.${an_id}.open_finding_count == 0"
