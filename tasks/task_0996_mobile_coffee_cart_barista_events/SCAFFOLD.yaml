scenario: |
  996. Mobile Coffee-Cart & Barista Events: event & package (hours/drinks), setup/power/water, setup/water/power site requirements, barista staff & inventory, add-on (latte-art/branding), travel & scheduling, deposit/balance, per-cup vs flat pricing, cancellation

domain_name: mobile-coffee-cart-events
api_prefix: /coffee-cart

complexity_profile:
  primary_archetype: Temporal windowing
  secondary_archetype: Pricing engine
  complexity_layers:
    - optimistic_concurrency
    - cascading_side_effects
    - dual_variant_calculation
    - rate_threshold_triggers
  entity_topology: hybrid
  state_machine_shape: branching
  relationship_patterns:
    - one_to_many
    - many_to_many
    - cross_aggregate
  role_model: hierarchical_override
  consistency_model: immediate

# =============================================================================
# 1.0 Response Envelope (FIXED — verbatim per SKILL §1.0)
# =============================================================================
response_envelope:
  success: |
    { "meta": { "api_request_id": "req_xxx", "api_request_timestamp": "ISO8601" },
      "response_type": "object" | "array", "data": {} }
  error: |
    { "meta": { ... }, "response_type": "error",
      "data": { "error_id": "ERR_XXX", "message": "..." } }
  pagination_fields: ["limit", "offset", "total_count", "has_more"]
  pagination_defaults: { limit: 10, min: 1, max: 100, offset: 0 }

# =============================================================================
# 1.1 Entity-Relationship Table
# =============================================================================
entities:
  - name: Client
    parent: null
    common_fields: true
    fields:
      - { name: company_name, type: string, source: input, description: "Client company or individual name" }
      - { name: contact_email, type: string, source: input, description: "Primary contact email (unique per client)" }
      - { name: status, type: enum, source: system, description: "ACTIVE | SUSPENDED | CLOSED" }

  - name: CoffeeCart
    parent: null
    common_fields: true
    fields:
      - { name: cart_code, type: string, source: input, description: "Unique cart identifier (e.g. CART-A)" }
      - { name: status, type: enum, source: system, description: "ACTIVE | MAINTENANCE | RETIRED" }
      - { name: max_drinks_per_hour, type: integer, source: input, description: "Cart throughput ceiling used for capacity checks" }
      - { name: requires_power_hookup, type: boolean, source: input, description: "True if cart must plug into venue power" }
      - { name: requires_water_hookup, type: boolean, source: input, description: "True if cart must connect to venue water line" }
      - { name: home_base_lat, type: number, source: input, description: "Cart depot latitude (for travel distance)" }
      - { name: home_base_lng, type: number, source: input, description: "Cart depot longitude (for travel distance)" }
      - { name: committed_event_count, type: integer, source: computed, description: "Read-only: number of EventBooking rows in CONFIRMED or IN_PROGRESS referencing this cart" }

  - name: Barista
    parent: null
    common_fields: true
    fields:
      - { name: full_name, type: string, source: input, description: "Barista full name" }
      - { name: status, type: enum, source: system, description: "ACTIVE | ON_LEAVE | TERMINATED" }
      - { name: skill_level, type: enum, source: input, description: "JUNIOR | SENIOR | LEAD — LEAD required for branding add-on" }
      - { name: latte_art_certified, type: boolean, source: input, description: "True if barista holds latte-art certification required for LATTE_ART add-on" }
      - { name: hourly_rate_cents, type: integer, source: input, description: "Base hourly pay in cents" }
      - { name: weekly_hour_cap, type: integer, source: input, description: "Maximum committed hours per ISO week" }
      - { name: committed_hours_this_week, type: integer, source: computed, description: "Read-only: sum of assignment.duration_hours for BaristaAssignment rows in {ACCEPTED, CONFIRMED} with event_start inside current ISO week" }

  - name: Package
    parent: null
    common_fields: true
    fields:
      - { name: package_code, type: string, source: input, description: "Unique package code (e.g. ESPRESSO-2H)" }
      - { name: status, type: enum, source: system, description: "ACTIVE | DISCONTINUED" }
      - { name: pricing_model, type: enum, source: input, description: "FLAT | PER_CUP — selects pricing variant in quote calculation" }
      - { name: base_hours, type: integer, source: input, description: "Service hours included in the package" }
      - { name: included_drinks, type: integer, source: input, description: "Drink count included (0 for PER_CUP packages)" }
      - { name: flat_price_cents, type: integer, source: input, description: "Flat package price in cents (0 for PER_CUP)" }
      - { name: per_cup_price_cents, type: integer, source: input, description: "Price per cup in cents (0 for FLAT)" }
      - { name: per_cup_minimum_cents, type: integer, source: input, description: "Floor for PER_CUP total; quote is at least this amount (0 for FLAT)" }
      - { name: max_guests, type: integer, source: input, description: "Maximum supported guest count for the package" }

  - name: AddOn
    parent: null
    common_fields: true
    fields:
      - { name: addon_code, type: string, source: input, description: "Unique add-on code (LATTE_ART | BRANDING | EXTRA_HOUR | SYRUP_FLIGHT)" }
      - { name: status, type: enum, source: system, description: "ACTIVE | DISCONTINUED" }
      - { name: price_cents, type: integer, source: input, description: "Add-on flat price in cents" }
      - { name: requires_lead_barista, type: boolean, source: input, description: "True if at least one assigned barista must be skill_level=LEAD" }
      - { name: requires_latte_art_cert, type: boolean, source: input, description: "True if at least one assigned barista must hold latte_art_certified=true" }

  - name: TravelZone
    parent: null
    common_fields: true
    fields:
      - { name: zone_code, type: string, source: input, description: "Unique zone code (ZONE-1 | ZONE-2 | ZONE-3)" }
      - { name: status, type: enum, source: system, description: "ACTIVE | DISCONTINUED" }
      - { name: max_distance_km, type: integer, source: input, description: "Upper bound (exclusive) of distance band in km" }
      - { name: banded_fee_cents, type: integer, source: input, description: "Flat fee in cents when banded variant applies" }
      - { name: per_km_rate_cents, type: integer, source: input, description: "Per-km rate in cents when metered variant applies" }
      - { name: min_booking_subtotal_cents, type: integer, source: input, description: "Minimum pre-travel subtotal required for this zone to be selectable (tier-gating)" }

  - name: EventBooking
    parent: null
    common_fields: true
    fields:
      - { name: client_id, type: string, source: input, description: "FK -> Client.id; booking owner" }
      - { name: package_id, type: string, source: input, description: "FK -> Package.id; immutable once set" }
      - { name: cart_id, type: string, source: input, description: "FK -> CoffeeCart.id; immutable once set" }
      - { name: travel_zone_id, type: string, source: input, description: "FK -> TravelZone.id; immutable once set" }
      - { name: status, type: enum, source: system, description: "QUOTE | PENDING_DEPOSIT | CONFIRMED | IN_PROGRESS | COMPLETED | CANCELLED | REFUNDED" }
      - { name: event_start, type: datetime, source: input, description: "Service start (ISO 8601 UTC)" }
      - { name: event_end, type: datetime, source: input, description: "Service end (ISO 8601 UTC) — must be > event_start" }
      - { name: guest_count, type: integer, source: input, description: "Expected guests; drives PER_CUP drink estimate" }
      - { name: venue_provides_power, type: boolean, source: input, description: "True if venue supplies power hookup" }
      - { name: venue_provides_water, type: boolean, source: input, description: "True if venue supplies water hookup" }
      - { name: distance_km, type: integer, source: input, description: "Round-trip distance in km from cart home base to venue" }
      - { name: quoted_subtotal_cents, type: integer, source: computed, description: "Read-only: package price + add-on sum (before travel fee)" }
      - { name: quoted_travel_fee_cents, type: integer, source: computed, description: "Read-only: travel fee at quote time, per active pricing variant" }
      - { name: quoted_total_cents, type: integer, source: computed, description: "Read-only: quoted_subtotal_cents + quoted_travel_fee_cents" }
      - { name: deposit_due_cents, type: integer, source: computed, description: "Read-only: 30% of quoted_total_cents clamped to [1000, 50000] (cents), rounded half-up" }
      - { name: deposit_paid_cents, type: integer, source: computed, description: "Read-only: sum of Payment rows of kind=DEPOSIT with status=SUCCEEDED" }
      - { name: balance_due_cents, type: integer, source: computed, description: "Read-only: quoted_total_cents - deposit_paid_cents - balance_paid_cents" }
      - { name: balance_paid_cents, type: integer, source: computed, description: "Read-only: sum of Payment rows of kind=BALANCE with status=SUCCEEDED" }
      - { name: refund_paid_cents, type: integer, source: computed, description: "Read-only: sum of Payment rows of kind=REFUND with status=SUCCEEDED" }
      - { name: pricing_variant_used, type: enum, source: computed, description: "Read-only: FLAT_PACKAGE | PER_CUP_METERED — pinned at confirm time, records which pricing algorithm produced quoted_*" }
      - { name: travel_variant_used, type: enum, source: computed, description: "Read-only: BANDED | METERED — pinned at confirm time, records which travel-fee algorithm was used" }
      - { name: cancellation_reason, type: string, source: input, description: "Optional free-text reason on cancel" }
      - { name: cancelled_at, type: datetime, source: system, description: "Server timestamp of cancellation, if any" }

  - name: BookingAddOn
    parent: EventBooking
    common_fields: false
    fields:
      - { name: booking_id, type: string, source: system, description: "FK -> EventBooking.id" }
      - { name: addon_id, type: string, source: input, description: "FK -> AddOn.id" }
      - { name: applied_price_cents, type: integer, source: computed, description: "Read-only: snapshot of AddOn.price_cents at attach time (immutable after attach)" }

  - name: BaristaAssignment
    parent: EventBooking
    common_fields: true
    fields:
      - { name: booking_id, type: string, source: system, description: "FK -> EventBooking.id" }
      - { name: barista_id, type: string, source: input, description: "FK -> Barista.id" }
      - { name: status, type: enum, source: system, description: "OFFERED | ACCEPTED | CONFIRMED | DECLINED | CANCELLED | NO_SHOW | COMPLETED" }
      - { name: duration_hours, type: integer, source: computed, description: "Read-only: ceil((event_end - event_start)/3600) — committed hours used for weekly cap" }
      - { name: is_primary, type: boolean, source: input, description: "True if this is the primary barista for the event (exactly one per booking)" }
      - { name: decline_reason, type: string, source: input, description: "Optional free-text decline reason" }

  - name: InventoryItem
    parent: null
    common_fields: true
    fields:
      - { name: sku, type: string, source: input, description: "Unique SKU (e.g. BEAN-ESPRESSO-KG)" }
      - { name: status, type: enum, source: system, description: "ACTIVE | DISCONTINUED" }
      - { name: on_hand_units, type: integer, source: input, description: "Total physical units in depot" }
      - { name: reserved_units, type: integer, source: computed, description: "Read-only: sum of InventoryReservation.qty_units in {RESERVED, COMMITTED} status" }
      - { name: consumed_units_lifetime, type: integer, source: computed, description: "Read-only: sum of InventoryReservation.qty_consumed for RECONCILED reservations" }
      - { name: reorder_threshold_units, type: integer, source: input, description: "Low-stock alert threshold" }

  - name: InventoryReservation
    parent: EventBooking
    common_fields: true
    fields:
      - { name: booking_id, type: string, source: system, description: "FK -> EventBooking.id" }
      - { name: item_id, type: string, source: input, description: "FK -> InventoryItem.id" }
      - { name: qty_units, type: integer, source: input, description: "Units reserved for the booking (must be >= 1)" }
      - { name: qty_consumed, type: integer, source: system, description: "Units actually consumed; written during reconcile (default 0)" }
      - { name: status, type: enum, source: system, description: "RESERVED | COMMITTED | PARTIALLY_CONSUMED | RELEASED | RECONCILED" }

  - name: Payment
    parent: EventBooking
    common_fields: false
    fields:
      - { name: booking_id, type: string, source: system, description: "FK -> EventBooking.id" }
      - { name: kind, type: enum, source: input, description: "DEPOSIT | BALANCE | REFUND" }
      - { name: amount_cents, type: integer, source: input, description: "Positive for DEPOSIT/BALANCE, positive magnitude for REFUND" }
      - { name: status, type: enum, source: system, description: "PENDING | SUCCEEDED | FAILED" }
      - { name: idempotency_key, type: string, source: input, description: "Client-supplied idempotency key (unique per booking+kind)" }

  - name: CancellationPolicyTier
    parent: null
    common_fields: true
    fields:
      - { name: tier_code, type: string, source: input, description: "Unique tier code (T1 | T2 | T3)" }
      - { name: min_notice_hours, type: integer, source: input, description: "Lower bound (inclusive) of notice-hours band for the tier" }
      - { name: max_notice_hours, type: integer, source: input, description: "Upper bound (exclusive) of notice-hours band; -1 means unbounded" }
      - { name: deposit_refund_pct, type: number, source: input, description: "Fraction of deposit_paid_cents refundable in this tier (0.0 – 1.0)" }
      - { name: balance_waived, type: boolean, source: input, description: "True if outstanding balance is waived in this tier" }
      - { name: status, type: enum, source: system, description: "ACTIVE | DISCONTINUED" }

# =============================================================================
# 1.2 State Machine Table
# =============================================================================
state_machines:
  - entity: EventBooking
    initial_state: QUOTE
    terminal_states: [REFUNDED, COMPLETED, CANCELLED]
    transitions:
      - from: QUOTE
        to: PENDING_DEPOSIT
        trigger: "POST /coffee-cart/bookings/{bookingId}/submit"
        actor: Client
        preconditions:
          - "booking.status == QUOTE"
          - "booking has at least one BaristaAssignment row in any non-terminal status (ERR_NO_BARISTA_ASSIGNED)"
          - "package.status == ACTIVE (ERR_PACKAGE_NOT_ACTIVE)"
          - "cart.status == ACTIVE (ERR_CART_NOT_ACTIVE)"
          - "quoted_total_cents was recomputed within the same request"
        side_effects:
          - "recompute quoted_subtotal_cents, quoted_travel_fee_cents, quoted_total_cents per pricing_variant + travel_variant"
          - "pin pricing_variant_used and travel_variant_used"
          - "recompute deposit_due_cents"

      - from: PENDING_DEPOSIT
        to: CONFIRMED
        trigger: "system (automatic when deposit_paid_cents >= deposit_due_cents after a successful DEPOSIT payment)"
        actor: system
        preconditions:
          - "booking.status == PENDING_DEPOSIT"
          - "deposit_paid_cents >= deposit_due_cents"
        side_effects:
          - "for each BaristaAssignment of booking in OFFERED or ACCEPTED: transition to CONFIRMED"
          - "for each InventoryReservation of booking in RESERVED: transition to COMMITTED; InventoryItem.reserved_units stays (still counted), but reservation is no longer cancellable via booking-amend"
          - "cart.committed_event_count increments by 1 (derived on read)"
          - "every CONFIRMED BaristaAssignment.barista_id recomputes Barista.committed_hours_this_week"

      - from: PENDING_DEPOSIT
        to: QUOTE
        trigger: "POST /coffee-cart/bookings/{bookingId}/reopen"
        actor: Client
        preconditions:
          - "booking.status == PENDING_DEPOSIT"
          - "no Payment row of kind=DEPOSIT exists with status=SUCCEEDED (ERR_DEPOSIT_ALREADY_PAID)"
        side_effects:
          - "pricing_variant_used, travel_variant_used cleared (recomputed on next submit)"

      - from: CONFIRMED
        to: QUOTE
        trigger: "POST /coffee-cart/bookings/{bookingId}/amend (when amendment changes package_id, cart_id, event_start, event_end, guest_count, distance_km, or add-ons)"
        actor: Client
        preconditions:
          - "booking.status == CONFIRMED"
          - "event_start > current_clock + 48h (ERR_AMEND_WINDOW_CLOSED)"
        side_effects:
          - "every BaristaAssignment in CONFIRMED transitions to OFFERED (re-offer loop) with barista notified"
          - "every InventoryReservation in COMMITTED transitions back to RESERVED (still holding stock)"
          - "cart.committed_event_count decrements (derived on read)"
          - "Barista.committed_hours_this_week recomputed for affected baristas (decremented)"
          - "DEPOSIT payments remain SUCCEEDED (credit carried forward); deposit_paid_cents unchanged"

      - from: CONFIRMED
        to: IN_PROGRESS
        trigger: "system (automatic when current_clock >= event_start)"
        actor: system
        preconditions:
          - "booking.status == CONFIRMED"
        side_effects:
          - "none (assignments stay CONFIRMED until barista completes or no-show)"

      - from: IN_PROGRESS
        to: COMPLETED
        trigger: "POST /coffee-cart/bookings/{bookingId}/complete"
        actor: OperationsManager
        preconditions:
          - "booking.status == IN_PROGRESS"
          - "current_clock >= event_end"
          - "every BaristaAssignment in {ACCEPTED, CONFIRMED} is transitioned to COMPLETED or NO_SHOW first (ERR_UNRESOLVED_ASSIGNMENTS)"
        side_effects:
          - "for each BaristaAssignment in {ACCEPTED, CONFIRMED}: if barista logged attendance then COMPLETED else NO_SHOW"
          - "for each InventoryReservation in COMMITTED: transition to PARTIALLY_CONSUMED with qty_consumed recorded"
          - "auto-create BALANCE Payment row (status=PENDING) for balance_due_cents if balance_due_cents > 0"

      - from: IN_PROGRESS
        to: COMPLETED
        trigger: "POST /coffee-cart/bookings/{bookingId}/complete (all assignments already resolved)"
        actor: OperationsManager
        preconditions:
          - "booking.status == IN_PROGRESS"
          - "current_clock >= event_end"
          - "all BaristaAssignment rows already in {COMPLETED, NO_SHOW, CANCELLED, DECLINED}"
        side_effects:
          - "for each InventoryReservation in COMMITTED: transition to PARTIALLY_CONSUMED with qty_consumed recorded"
          - "auto-create BALANCE Payment row (status=PENDING) for balance_due_cents if balance_due_cents > 0"

      - from: QUOTE
        to: CANCELLED
        trigger: "POST /coffee-cart/bookings/{bookingId}/cancel"
        actor: Client
        preconditions:
          - "booking.status == QUOTE"
        side_effects:
          - "all BaristaAssignment in {OFFERED, ACCEPTED} -> CANCELLED"
          - "all InventoryReservation in RESERVED -> RELEASED; InventoryItem.reserved_units decremented"
          - "no refund computation (nothing paid)"

      - from: PENDING_DEPOSIT
        to: CANCELLED
        trigger: "POST /coffee-cart/bookings/{bookingId}/cancel"
        actor: Client
        preconditions:
          - "booking.status == PENDING_DEPOSIT"
          - "no DEPOSIT payment SUCCEEDED (use refund path otherwise)"
        side_effects:
          - "all BaristaAssignment in {OFFERED, ACCEPTED} -> CANCELLED"
          - "all InventoryReservation in RESERVED -> RELEASED"

      - from: CONFIRMED
        to: CANCELLED
        trigger: "POST /coffee-cart/bookings/{bookingId}/cancel"
        actor: Client
        preconditions:
          - "booking.status == CONFIRMED"
          - "current_clock < event_start (cannot cancel after service began)"
        side_effects:
          - "all BaristaAssignment in {OFFERED, ACCEPTED, CONFIRMED} -> CANCELLED; affected Barista.committed_hours_this_week recomputed (decremented)"
          - "all InventoryReservation in {RESERVED, COMMITTED} -> RELEASED; InventoryItem.reserved_units decremented"
          - "cart.committed_event_count decremented (derived on read)"
          - "compute cancellation_tier via notice-hours; if deposit_refund_pct > 0, auto-create REFUND Payment row (status=PENDING) of amount floor(deposit_paid_cents * deposit_refund_pct)"
          - "if tier.balance_waived == true, set balance_due_cents := 0 by writing a waiver marker (balance_waived_flag)"

      - from: CANCELLED
        to: REFUNDED
        trigger: "system (automatic when the auto-created REFUND Payment transitions to SUCCEEDED)"
        actor: system
        preconditions:
          - "booking.status == CANCELLED"
          - "a REFUND Payment row exists with status=SUCCEEDED"
        side_effects:
          - "none (terminal)"

  - entity: BaristaAssignment
    initial_state: OFFERED
    terminal_states: [DECLINED, CANCELLED, COMPLETED, NO_SHOW]
    transitions:
      - from: OFFERED
        to: ACCEPTED
        trigger: "POST /coffee-cart/assignments/{assignmentId}/accept"
        actor: Barista
        preconditions:
          - "assignment.status == OFFERED"
          - "barista.status == ACTIVE"
          - "booking.status in {QUOTE, PENDING_DEPOSIT, CONFIRMED}"
          - "committing duration_hours to Barista.committed_hours_this_week must not exceed weekly_hour_cap (ERR_WEEKLY_CAP_EXCEEDED)"
          - "no time overlap with another ACCEPTED/CONFIRMED assignment for same barista (ERR_BARISTA_DOUBLE_BOOKED)"
        side_effects:
          - "Barista.committed_hours_this_week increments by duration_hours"

      - from: OFFERED
        to: DECLINED
        trigger: "POST /coffee-cart/assignments/{assignmentId}/decline"
        actor: Barista
        preconditions:
          - "assignment.status == OFFERED"
        side_effects: []

      - from: ACCEPTED
        to: CONFIRMED
        trigger: "system (cascade from EventBooking PENDING_DEPOSIT -> CONFIRMED)"
        actor: system
        preconditions: []
        side_effects: []

      - from: OFFERED
        to: CANCELLED
        trigger: "system (cascade from booking cancel or booking amend)"
        actor: system
        preconditions: []
        side_effects: []

      - from: ACCEPTED
        to: CANCELLED
        trigger: "system (cascade from booking cancel) or POST /coffee-cart/assignments/{assignmentId}/withdraw"
        actor: "system | Barista"
        preconditions:
          - "booking.status != IN_PROGRESS (cannot withdraw mid-event)"
        side_effects:
          - "Barista.committed_hours_this_week decrements by duration_hours"

      - from: CONFIRMED
        to: CANCELLED
        trigger: "system (cascade from booking cancel or booking amend)"
        actor: system
        preconditions: []
        side_effects:
          - "Barista.committed_hours_this_week decrements by duration_hours"

      - from: CONFIRMED
        to: OFFERED
        trigger: "system (cascade from booking amend — re-offer loop)"
        actor: system
        preconditions: []
        side_effects:
          - "Barista.committed_hours_this_week decrements by duration_hours (will re-increment on re-accept)"

      - from: ACCEPTED
        to: COMPLETED
        trigger: "POST /coffee-cart/assignments/{assignmentId}/resolve (attendance logged true)"
        actor: OperationsManager
        preconditions:
          - "booking.status == IN_PROGRESS"
          - "current_clock >= booking.event_end"
        side_effects: []

      - from: CONFIRMED
        to: COMPLETED
        trigger: "POST /coffee-cart/assignments/{assignmentId}/resolve (attendance logged true)"
        actor: OperationsManager
        preconditions:
          - "booking.status == IN_PROGRESS"
          - "current_clock >= booking.event_end"
        side_effects: []

      - from: ACCEPTED
        to: NO_SHOW
        trigger: "POST /coffee-cart/assignments/{assignmentId}/resolve (attendance logged false)"
        actor: OperationsManager
        preconditions:
          - "booking.status == IN_PROGRESS"
          - "current_clock >= booking.event_end"
        side_effects:
          - "Barista.committed_hours_this_week decrements by duration_hours (no-show releases hours)"

      - from: CONFIRMED
        to: NO_SHOW
        trigger: "POST /coffee-cart/assignments/{assignmentId}/resolve (attendance logged false)"
        actor: OperationsManager
        preconditions:
          - "booking.status == IN_PROGRESS"
          - "current_clock >= booking.event_end"
        side_effects:
          - "Barista.committed_hours_this_week decrements by duration_hours"

  - entity: InventoryReservation
    initial_state: RESERVED
    terminal_states: [RELEASED, RECONCILED]
    transitions:
      - from: RESERVED
        to: COMMITTED
        trigger: "system (cascade from booking PENDING_DEPOSIT -> CONFIRMED)"
        actor: system
        preconditions: []
        side_effects:
          - "InventoryItem.reserved_units unchanged (still counted as reserved, but locked)"

      - from: COMMITTED
        to: RESERVED
        trigger: "system (cascade from booking amend CONFIRMED -> QUOTE)"
        actor: system
        preconditions: []
        side_effects: []

      - from: RESERVED
        to: RELEASED
        trigger: "system (cascade from booking cancel from QUOTE or PENDING_DEPOSIT)"
        actor: system
        preconditions: []
        side_effects:
          - "InventoryItem.reserved_units -= qty_units"

      - from: COMMITTED
        to: RELEASED
        trigger: "system (cascade from booking cancel from CONFIRMED)"
        actor: system
        preconditions: []
        side_effects:
          - "InventoryItem.reserved_units -= qty_units"

      - from: COMMITTED
        to: PARTIALLY_CONSUMED
        trigger: "POST /coffee-cart/reservations/{reservationId}/record-consumption"
        actor: OperationsManager
        preconditions:
          - "booking.status == IN_PROGRESS or booking.status == COMPLETED-pending-reconcile"
          - "qty_consumed >= 0 and qty_consumed <= qty_units (ERR_CONSUMPTION_OUT_OF_RANGE)"
        side_effects:
          - "InventoryItem.reserved_units -= qty_units (release full reservation)"
          - "InventoryItem.consumed_units_lifetime += qty_consumed"
          - "InventoryItem.on_hand_units -= qty_consumed"

      - from: PARTIALLY_CONSUMED
        to: RECONCILED
        trigger: "POST /coffee-cart/reservations/{reservationId}/reconcile"
        actor: OperationsManager
        preconditions:
          - "reservation.status == PARTIALLY_CONSUMED"
          - "booking.status == COMPLETED"
        side_effects: []

  - entity: Payment
    initial_state: PENDING
    terminal_states: [SUCCEEDED, FAILED]
    transitions:
      - from: PENDING
        to: SUCCEEDED
        trigger: "POST /coffee-cart/payments/{paymentId}/mark-succeeded"
        actor: OperationsManager
        preconditions:
          - "payment.status == PENDING"
          - "for kind=DEPOSIT: booking.status must be PENDING_DEPOSIT (else ERR_BOOKING_NOT_AWAITING_DEPOSIT)"
          - "for kind=BALANCE: booking.status must be in {CONFIRMED, IN_PROGRESS, COMPLETED}"
          - "for kind=REFUND: booking.status must be CANCELLED"
        side_effects:
          - "if kind=DEPOSIT and booking.deposit_paid_cents >= deposit_due_cents after this payment: cascade booking PENDING_DEPOSIT -> CONFIRMED"
          - "if kind=REFUND and booking.status == CANCELLED: cascade booking CANCELLED -> REFUNDED"
          - "idempotent on idempotency_key: repeated POST with same key returns same Payment row, no duplicate state change"

      - from: PENDING
        to: FAILED
        trigger: "POST /coffee-cart/payments/{paymentId}/mark-failed"
        actor: OperationsManager
        preconditions:
          - "payment.status == PENDING"
        side_effects: []

# =============================================================================
# 1.2.1 Concurrency Rules (OCC only)
# =============================================================================
concurrency_rules:
  - rule_id: booking-submit-stale-cart-version
    parent_entity: CoffeeCart
    write_endpoint: "POST /coffee-cart/bookings/{bookingId}/submit"
    occ_field: "expected_cart_version"
    description: |
      Submitting a booking whose cart_id refers to a CoffeeCart whose version has advanced since the client last observed it is rejected. This captures the case where another writer has just confirmed a different booking against the same cart (which legitimately decrements that cart's effective availability via committed_event_count) and the current writer's view of the cart is therefore stale.
    error_id: ERR_STALE_VERSION
    http_status: 412

  - rule_id: booking-submit-stale-barista-version
    parent_entity: Barista
    write_endpoint: "POST /coffee-cart/bookings/{bookingId}/submit"
    occ_field: "expected_primary_barista_version"
    description: |
      Submitting a booking whose primary barista's version has advanced since the client last observed it is rejected. Captures the case where another booking committed hours against the same barista and the current writer's view of Barista.committed_hours_this_week is stale.
    error_id: ERR_STALE_VERSION
    http_status: 412

# =============================================================================
# 1.3 Calculation Rules Table
# =============================================================================
calculations:
  - name: quoted_subtotal_cents
    trigger: "booking submit (QUOTE -> PENDING_DEPOSIT) and re-quoted on amend"
    algorithm: dual_variant_pricing
    formula: |
      variant FLAT_PACKAGE (used when package.pricing_model == FLAT):
        subtotal = package.flat_price_cents
                 + sum(BookingAddOn.applied_price_cents for all add-ons attached)
      variant PER_CUP_METERED (used when package.pricing_model == PER_CUP):
        estimated_cups = ceil(guest_count * CUPS_PER_GUEST)
        metered = estimated_cups * package.per_cup_price_cents
        subtotal = max(metered, package.per_cup_minimum_cents)
                 + sum(BookingAddOn.applied_price_cents for all add-ons attached)
      Both variants then apply package.max_guests as a hard validation, not a clamp.
    input_set: "Package (ACTIVE), BookingAddOn rows for this booking"
    constants:
      CUPS_PER_GUEST: 1.5
    precision: "integer cents; ceil applied to cup count, max applied to cents"

  - name: quoted_travel_fee_cents
    trigger: "booking submit (QUOTE -> PENDING_DEPOSIT) and re-quoted on amend"
    algorithm: dual_variant_travel
    formula: |
      Travel variant selection (deterministic, pinned by zone):
        if booking.distance_km <= METERED_MAX_KM: variant = METERED
        else: variant = BANDED
      variant METERED:
        travel_fee = booking.distance_km * zone.per_km_rate_cents
      variant BANDED:
        travel_fee = zone.banded_fee_cents
      Zone tier gating (applies to BOTH variants, evaluated BEFORE fee math):
        if quoted_subtotal_cents < zone.min_booking_subtotal_cents:
          reject ERR_SUBTOTAL_BELOW_ZONE_MINIMUM
    input_set: "TravelZone (ACTIVE), booking.distance_km, quoted_subtotal_cents (must be evaluated first)"
    constants:
      METERED_MAX_KM: 25
    precision: "integer cents"
    note: "Circular-looking dependency resolved by explicit evaluation order: subtotal first, then zone tier check, then fee. Total = subtotal + fee."

  - name: quoted_total_cents
    trigger: "booking submit and amend"
    algorithm: aggregation
    formula: |
      quoted_total_cents = quoted_subtotal_cents + quoted_travel_fee_cents
      (order matters: subtotal computed first; travel fee computed against subtotal; then summed)
    input_set: "quoted_subtotal_cents, quoted_travel_fee_cents"
    precision: "integer cents"

  - name: deposit_due_cents
    trigger: "computed after quoted_total_cents on submit/amend"
    algorithm: threshold
    formula: |
      raw = round_half_up(quoted_total_cents * DEPOSIT_PCT)
      deposit_due_cents = min(max(raw, DEPOSIT_MIN_CENTS), DEPOSIT_MAX_CENTS)
    input_set: "quoted_total_cents"
    constants:
      DEPOSIT_PCT: 0.30
      DEPOSIT_MIN_CENTS: 1000
      DEPOSIT_MAX_CENTS: 50000
    precision: "integer cents; round_half_up applied before min/max clamp"

  - name: cancellation_refund_cents
    trigger: "POST /bookings/{id}/cancel from CONFIRMED"
    algorithm: dual_variant_refund
    formula: |
      variant FORWARD_LOOKING (used when current_clock <= event_start - 168h, i.e., 7+ days notice):
        notice_hours = floor((event_start - current_clock) / 3600)
        tier = first CancellationPolicyTier (ACTIVE) where min_notice_hours <= notice_hours < max_notice_hours (or max==-1)
        refund = floor(deposit_paid_cents * tier.deposit_refund_pct)
      variant CHRONOLOGICAL (used when current_clock > event_start - 168h, i.e., <7 days notice):
        notice_hours = floor((event_start - current_clock) / 3600)
        tier = first CancellationPolicyTier (ACTIVE) where min_notice_hours <= notice_hours < max_notice_hours (or max==-1)
        # chronological applies an additional short-notice haircut
        refund = floor(deposit_paid_cents * tier.deposit_refund_pct * SHORT_NOTICE_FACTOR)
      Boundary: notice_hours exactly equal to min_notice_hours IS included in that tier (>= semantics).
      notice_hours exactly equal to max_notice_hours belongs to the NEXT tier up (< semantics, half-open).
    input_set: "CancellationPolicyTier (ACTIVE), deposit_paid_cents, event_start, current_clock"
    constants:
      SHORT_NOTICE_FACTOR: 0.5
      LONG_NOTICE_THRESHOLD_HOURS: 168
    precision: "integer cents; floor applied last"

  - name: barista_weekly_hours_check
    trigger: "assignment accept (OFFERED -> ACCEPTED)"
    algorithm: threshold
    formula: |
      projected = barista.committed_hours_this_week + assignment.duration_hours
      if projected > barista.weekly_hour_cap: reject ERR_WEEKLY_CAP_EXCEEDED
      Boundary: projected == weekly_hour_cap is ALLOWED (<= semantics for admission, > for rejection).
    input_set: "Barista.committed_hours_this_week, Barista.weekly_hour_cap, assignment.duration_hours"
    precision: "integer hours"

  - name: barista_overlap_check
    trigger: "assignment accept"
    algorithm: interval_overlap
    formula: |
      For the candidate assignment's booking interval [event_start, event_end) (half-open):
        for each other BaristaAssignment (status in {ACCEPTED, CONFIRMED}) for same barista:
          other_interval = [other_booking.event_start, other_booking.event_end) (half-open)
          overlap = (event_start < other_end) AND (other_start < event_end)
          if overlap: reject ERR_BARISTA_DOUBLE_BOOKED
      Adjacency is ALLOWED (back-to-back events OK; end == start of next is not an overlap).
    input_set: "BaristaAssignment rows for same barista in {ACCEPTED, CONFIRMED}"
    precision: "datetime exact"

  - name: cart_overlap_check
    trigger: "booking submit"
    algorithm: interval_overlap_with_buffer
    formula: |
      For the candidate booking interval [event_start, event_end):
        buffered_start = event_start - TRAVEL_BUFFER_MINUTES
        buffered_end   = event_end   + TRAVEL_BUFFER_MINUTES
        for each other EventBooking (status in {PENDING_DEPOSIT, CONFIRMED, IN_PROGRESS}) with same cart_id:
          other_buffered_start = other.event_start - TRAVEL_BUFFER_MINUTES
          other_buffered_end   = other.event_end   + TRAVEL_BUFFER_MINUTES
          overlap = (buffered_start < other_buffered_end) AND (other_buffered_start < buffered_end)
          if overlap: reject ERR_CART_DOUBLE_BOOKED
      Adjacency of RAW intervals still triggers rejection if travel buffers collide.
    input_set: "EventBooking rows for same cart in {PENDING_DEPOSIT, CONFIRMED, IN_PROGRESS}"
    constants:
      TRAVEL_BUFFER_MINUTES: 90
    precision: "datetime exact"

  - name: inventory_availability_check
    trigger: "creating InventoryReservation (status RESERVED)"
    algorithm: aggregation
    formula: |
      available = item.on_hand_units - item.reserved_units
      if qty_units > available: reject ERR_INSUFFICIENT_INVENTORY
      Boundary: qty_units == available is ALLOWED; qty_units == available + 1 is rejected.
    input_set: "InventoryItem.on_hand_units, InventoryItem.reserved_units, request qty_units"
    precision: "integer units"

  - name: addon_skill_gate
    trigger: "booking submit"
    algorithm: constraint
    formula: |
      For each BookingAddOn row of booking:
        if addon.requires_latte_art_cert:
          at least one BaristaAssignment (status in {OFFERED, ACCEPTED, CONFIRMED}) of the booking must have
          barista.latte_art_certified == true; else reject ERR_ADDON_SKILL_MISSING
        if addon.requires_lead_barista:
          at least one BaristaAssignment (status in {OFFERED, ACCEPTED, CONFIRMED}) must have
          barista.skill_level == LEAD; else reject ERR_ADDON_SKILL_MISSING
    input_set: "BookingAddOn, AddOn, BaristaAssignment, Barista"

  - name: payment_reconciliation_invariant
    trigger: "on every Payment PENDING -> SUCCEEDED"
    algorithm: invariant
    formula: |
      For each booking:
        sum(payments amount where kind=DEPOSIT and status=SUCCEEDED)
        + sum(payments amount where kind=BALANCE and status=SUCCEEDED)
        - sum(payments amount where kind=REFUND and status=SUCCEEDED)
        == booking.deposit_paid_cents + booking.balance_paid_cents - booking.refund_paid_cents
      And globally, total_cents_received - total_cents_refunded across all bookings equals
      sum over all bookings of (deposit_paid_cents + balance_paid_cents - refund_paid_cents).
      Any drift is a bug; invariant is conserved under every forward+compensating pair.

  - name: inventory_conservation_invariant
    trigger: "on every InventoryReservation transition"
    algorithm: invariant
    formula: |
      For each InventoryItem:
        on_hand_units_initial - on_hand_units_current == consumed_units_lifetime
        reserved_units == sum(qty_units of reservations in {RESERVED, COMMITTED})
      Forward action (create reservation) + compensating action (release reservation) MUST leave
      reserved_units unchanged. Forward action (record consumption) is NOT compensated but IS
      accounted: consumed_units_lifetime and on_hand_units move together by qty_consumed.

# =============================================================================
# 1.4 Validation Rules Table (ordered by priority)
# =============================================================================
validations:
  - priority: 1
    category: auth
    check: "X-User-ID and X-User-Role headers present and role is a declared §1.7 role"
    error_id: ERR_MISSING_OR_INVALID_USER_CONTEXT_HEADER
    http_status: 400
    applies_to: "all"

  - priority: 2
    category: auth
    check: "Role is permitted for the endpoint per §1.5 roles list"
    error_id: ERR_UNAUTHORIZED
    http_status: 403
    applies_to: "all"

  - priority: 3
    category: existence
    check: "Path-template ids (bookingId, assignmentId, etc.) exist and belong to declared parents"
    error_id: "ERR_RESOURCE_NOT_FOUND"
    http_status: 404
    applies_to: "all nested resource endpoints"

  - priority: 4
    category: existence
    check: "Body-supplied FK ids (client_id, package_id, cart_id, travel_zone_id, addon_id, barista_id, item_id) exist"
    error_id: ERR_RESOURCE_NOT_FOUND
    http_status: 404
    applies_to: "POST/PATCH endpoints with body FKs"

  - priority: 5
    category: state
    check: "EventBooking.status permits the requested transition"
    error_id: ERR_INVALID_STATE
    http_status: 409
    applies_to: "all booking action endpoints (submit, reopen, amend, cancel, complete)"

  - priority: 6
    category: state
    check: "Referenced catalog entities (Package, CoffeeCart, TravelZone, AddOn, InventoryItem) are in ACTIVE status"
    error_id: "ERR_PACKAGE_NOT_ACTIVE | ERR_CART_NOT_ACTIVE | ERR_ZONE_NOT_ACTIVE | ERR_ADDON_NOT_ACTIVE | ERR_ITEM_NOT_ACTIVE"
    http_status: 409
    applies_to: "booking create, booking submit, addon attach, reservation create"

  - priority: 7
    category: business_temporal
    check: "event_start < event_end; event_start is at least MIN_BOOKING_LEAD_HOURS in the future"
    error_id: ERR_EVENT_WINDOW_INVALID
    http_status: 422
    applies_to: "booking create, booking amend"
    constants:
      MIN_BOOKING_LEAD_HOURS: 24

  - priority: 8
    category: business_temporal
    check: "Venue flags consistent with cart requirements: if cart.requires_power_hookup then venue_provides_power must be true; if cart.requires_water_hookup then venue_provides_water must be true"
    error_id: ERR_VENUE_HOOKUP_MISMATCH
    http_status: 422
    applies_to: "booking create, booking amend"

  - priority: 9
    category: business_temporal
    check: "Cart is not double-booked for the requested interval including travel buffer"
    error_id: ERR_CART_DOUBLE_BOOKED
    http_status: 409
    applies_to: "booking submit, booking amend"

  - priority: 10
    category: business_constraint
    check: "guest_count <= package.max_guests; guest_count >= 1"
    error_id: ERR_GUEST_COUNT_OUT_OF_RANGE
    http_status: 422
    applies_to: "booking create, booking amend"

  - priority: 11
    category: business_constraint
    check: "Barista add-on skill gate (latte_art cert / LEAD) satisfied"
    error_id: ERR_ADDON_SKILL_MISSING
    http_status: 422
    applies_to: "booking submit"

  - priority: 12
    category: business_constraint
    check: "Barista double-booking: candidate assignment does not overlap existing ACCEPTED/CONFIRMED assignments for the barista"
    error_id: ERR_BARISTA_DOUBLE_BOOKED
    http_status: 409
    applies_to: "assignment accept"

  - priority: 13
    category: business_constraint
    check: "Barista weekly hour cap not exceeded by this assignment"
    error_id: ERR_WEEKLY_CAP_EXCEEDED
    http_status: 422
    applies_to: "assignment accept"

  - priority: 14
    category: business_referential
    check: "Booking has at least one non-terminal BaristaAssignment (submit gate)"
    error_id: ERR_NO_BARISTA_ASSIGNED
    http_status: 422
    applies_to: "booking submit"

  - priority: 15
    category: business_fiscal
    check: "Inventory availability: qty_units <= on_hand_units - reserved_units"
    error_id: ERR_INSUFFICIENT_INVENTORY
    http_status: 422
    applies_to: "reservation create"

  - priority: 16
    category: business_fiscal
    check: "quoted_subtotal_cents >= TravelZone.min_booking_subtotal_cents"
    error_id: ERR_SUBTOTAL_BELOW_ZONE_MINIMUM
    http_status: 422
    applies_to: "booking submit"

  - priority: 17
    category: business_fiscal
    check: "OCC: expected_cart_version == CoffeeCart.version AND expected_primary_barista_version == Barista.version at submit"
    error_id: ERR_STALE_VERSION
    http_status: 412
    applies_to: "booking submit"

  - priority: 18
    category: business_fiscal
    check: "Payment amount matches expected: DEPOSIT amount >= remaining deposit_due - deposit_paid (at submit time); BALANCE amount == balance_due_cents at pay time; REFUND amount == computed refund"
    error_id: ERR_PAYMENT_AMOUNT_MISMATCH
    http_status: 422
    applies_to: "payment create, payment mark-succeeded"

  - priority: 19
    category: business_fiscal
    check: "Idempotency: a Payment with the same idempotency_key already SUCCEEDED -> return existing Payment, do not error; same key with FAILED -> allow retry"
    error_id: ERR_IDEMPOTENCY_CONFLICT
    http_status: 409
    applies_to: "payment create"

  - priority: 20
    category: business_temporal
    check: "Amend window: current_clock <= event_start - 48h"
    error_id: ERR_AMEND_WINDOW_CLOSED
    http_status: 409
    applies_to: "booking amend"

  - priority: 21
    category: business_temporal
    check: "Cannot cancel after service started: current_clock < event_start for cancel-from-CONFIRMED"
    error_id: ERR_CANCEL_WINDOW_CLOSED
    http_status: 409
    applies_to: "booking cancel"

  - priority: 22
    category: business_referential
    check: "Cannot complete booking while unresolved BaristaAssignment rows exist in {ACCEPTED, CONFIRMED}"
    error_id: ERR_UNRESOLVED_ASSIGNMENTS
    http_status: 409
    applies_to: "booking complete"

  - priority: 23
    category: business_referential
    check: "Consumption recording: 0 <= qty_consumed <= qty_units"
    error_id: ERR_CONSUMPTION_OUT_OF_RANGE
    http_status: 422
    applies_to: "reservation record-consumption"

  - priority: 24
    category: state
    check: "Cannot reopen a booking whose deposit is already paid (must use refund path)"
    error_id: ERR_DEPOSIT_ALREADY_PAID
    http_status: 409
    applies_to: "booking reopen"

