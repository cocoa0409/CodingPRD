            - { call: "POST /mill/kiln-chambers", payload: { chamber_code: "K1", capacity_board_feet: 12000 }, as: MillAdmin, captures: { chamber_id: "$.data.id" } }
            - { call: "POST /mill/kiln-chambers", payload: { chamber_code: "K2", capacity_board_feet: 12000 }, as: MillAdmin, captures: { chamber2_id: "$.data.id" } }
            - { call: "POST /mill/kiln-charges", payload: { drying_schedule_id: "${sched_id}", kiln_chamber_id: "${chamber_id}", planned_start_utc: "2026-08-05T00:00:00.000Z" }, as: KilnOperator, captures: { charge_a: "$.data.id" } }
          trigger:
            - { call: "POST /mill/kiln-charges", payload: { drying_schedule_id: "${sched_id}", kiln_chamber_id: "${chamber_id}", planned_start_utc: "2026-08-16T07:00:00.000Z" }, as: KilnOperator }
            - { call: "POST /mill/kiln-charges", payload: { drying_schedule_id: "${sched_id}", kiln_chamber_id: "${chamber_id}", planned_start_utc: "2026-08-16T08:00:00.000Z" }, as: KilnOperator }
            - { call: "POST /mill/kiln-charges", payload: { drying_schedule_id: "${sched_id}", kiln_chamber_id: "${chamber2_id}", planned_start_utc: "2026-08-05T00:00:00.000Z" }, as: KilnOperator }
          assert:
            - "Charge A was created with data.planned_end_utc == \"2026-08-16T01:00:00.000Z\" and data.blocked_until_utc == \"2026-08-16T07:00:00.000Z\"."
            - "First trigger call: status 409 with data.error_id == \"ERR_CHAMBER_WINDOW_CONFLICT\" - starting exactly at blocked_until_utc collides because the interval is closed."
            - "Second trigger call: status 201 with data.planned_start_utc == \"2026-08-16T08:00:00.000Z\", data.planned_end_utc == \"2026-08-27T09:00:00.000Z\" and data.blocked_until_utc == \"2026-08-27T15:00:00.000Z\"."
            - "Third trigger call: status 201 - the identical window on chamber K2 is fine, so the constraint is per chamber, not global."
            - "GET /mill/kiln-charges?kiln_chamber_id={chamber_id} returns total_count 2."

