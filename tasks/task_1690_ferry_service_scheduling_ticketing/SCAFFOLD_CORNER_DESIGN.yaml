# =============================================================================
# §1.9: Scaffold Corner Design (Coverage Index for Non-Difficulty Tests)
# Ferry Service Scheduling & Ticketing
# =============================================================================
scaffold_corner_design:

  # ===========================================================================
  # Section: entities
  # ===========================================================================
  - section: entities
    instances:
      - name: route_creation_applies_defaults
        claim_type: defaults
        grounds: [entities.Route.fields.status]
        distinguishing_aspect: "Route created without status input starts ACTIVE with version 1 and server-minted UUID id."
        test_recipe:
          setup: ["empty DB"]
          setup_api_calls:
            - call: "POST /ferry/routes"
              payload: { route_code: "SEA-BI", origin_terminal: "Seattle", destination_terminal: "Bainbridge", crossing_minutes: 35, turnaround_minutes: 15 }
              as: SchedulerAdmin
              captures: { route_id: $.data.id }
          trigger:
            - call: "GET /ferry/routes/${route_id}"
              payload: {}
              as: SchedulerAdmin
              captures: { r_status: $.data.status, r_version: $.data.version }
          assert:
            - "Route.status == ACTIVE"
            - "Route.version == 1"

      - name: route_list_pagination_envelope
        claim_type: listing
        grounds: [response_envelope, "endpoints[GET /ferry/routes]"]
        distinguishing_aspect: "List endpoint returns envelope with meta.api_request_id, response_type=array, and pagination fields limit/offset/total_count/has_more; defaults limit=10 offset=0."
        test_recipe:
          setup: ["one route exists"]
          setup_api_calls:
            - call: "POST /ferry/routes"
              payload: { route_code: "SEA-BI", origin_terminal: "Seattle", destination_terminal: "Bainbridge", crossing_minutes: 35, turnaround_minutes: 15 }
              as: SchedulerAdmin
          trigger:
            - call: "GET /ferry/routes"
              payload: {}
              as: SchedulerAdmin
          assert:
            - "response envelope contains meta.api_request_id and meta.api_request_timestamp"
            - "response_type == array"
            - "data has 1 entry; pagination shows total_count == 1, has_more == false, limit == 10, offset == 0"

      - name: get_nonexistent_vessel_returns_not_found
        claim_type: not_found
        grounds: ["errors[ERR_NOT_FOUND]", "validations[priority=3]"]
        distinguishing_aspect: "GET with a well-formed but absent UUID returns 404 ERR_NOT_FOUND in the error envelope."
        test_recipe:
          setup: ["empty DB"]
          setup_api_calls: []
          trigger:
            - call: "GET /ferry/vessels/8a3e1c0b-2f4d-4a91-9c8b-12e7b6a0f1d2"
              payload: {}
              as: SchedulerAdmin
              captures: { err: $.data.error_id }
          assert:
            - "error_id == ERR_NOT_FOUND"
            - "HTTP status == 404"

      - name: booking_computed_fields_extra_field_ignored
        claim_type: computed_fields
        grounds: [entities.Booking.fields.quoted_fare_cents, entities.Booking.fields.status]
        distinguishing_aspect: "Client-supplied quoted_fare_cents/status on booking create are ignored; server computes quote (3200 for 1 pax + 18 ft vehicle at index 350 tier 100: 1000 + 2000 + 100*2) and sets status=RESERVED."
        test_recipe:
          setup: ["base setup: route, vessel 200 ft MEDIUM, OFF_PEAK schedule EFFECTIVE (surcharge 100), crewed sailing OPEN_FOR_BOOKING, STANDARD customer"]
          setup_api_calls:
            - call: "POST /ferry/routes"
              payload: { route_code: "SEA-BI", origin_terminal: "Seattle", destination_terminal: "Bainbridge", crossing_minutes: 35, turnaround_minutes: 15 }
              as: SchedulerAdmin
              captures: { route_id: $.data.id, route_v: $.data.version }
            - call: "POST /ferry/vessels"
              payload: { vessel_name: "MV Kittitas", vehicle_deck_linear_feet: 200, passenger_capacity: 600, crew_class: "MEDIUM" }
              as: SchedulerAdmin
              captures: { vessel_id: $.data.id }
            - call: "POST /ferry/routes/${route_id}/fare-schedules"
              payload: { season: "OFF_PEAK", effective_from: "2026-08-01T00:00:00Z", effective_to: "2026-11-01T00:00:00Z", passenger_standard_cents: 1000, passenger_resident_cents: 800, passenger_commuter_cents: 600, vehicle_standard_base_cents: 2000, vehicle_oversize_base_cents: 4000, vehicle_overlength_per_foot_cents: 100, fuel_surcharge_cents: 0, expected_route_version: "${route_v}" }
              as: SchedulerAdmin
              captures: { fs_id: $.data.id }
            - call: "POST /ferry/fare-schedules/${fs_id}/submit"
              payload: { fuel_price_index_cents: 350 }
              as: SchedulerAdmin
            - call: "POST /ferry/fare-schedules/${fs_id}/approve"
              payload: {}
              as: SchedulerAdmin
            - call: "POST /ferry/crew-members"
              payload: { full_name: "Cap A", credential_class: "CAPTAIN" }
              as: CrewPlanner
              captures: { cap_id: $.data.id }
            - call: "POST /ferry/crew-members"
              payload: { full_name: "Deck A", credential_class: "DECK" }
              as: CrewPlanner
              captures: { deck1_id: $.data.id }
            - call: "POST /ferry/crew-members"
              payload: { full_name: "Deck B", credential_class: "DECK" }
              as: CrewPlanner
              captures: { deck2_id: $.data.id }
            - call: "POST /ferry/crew-members"
              payload: { full_name: "Eng A", credential_class: "ENGINE" }
              as: CrewPlanner
              captures: { eng_id: $.data.id }
            - call: "POST /ferry/routes/${route_id}/sailings"
              payload: { vessel_id: "${vessel_id}", departure_time: "2026-09-01T10:00:00Z", season: "OFF_PEAK" }
              as: SchedulerAdmin
              captures: { s_id: $.data.id }
            - call: "POST /ferry/sailings/${s_id}/crew-assignments"
              payload: { crew_member_id: "${cap_id}", shift_start: "2026-09-01T08:00:00Z", shift_end: "2026-09-01T16:00:00Z" }
              as: CrewPlanner
            - call: "POST /ferry/sailings/${s_id}/crew-assignments"
              payload: { crew_member_id: "${deck1_id}", shift_start: "2026-09-01T08:00:00Z", shift_end: "2026-09-01T16:00:00Z" }
              as: CrewPlanner
            - call: "POST /ferry/sailings/${s_id}/crew-assignments"
              payload: { crew_member_id: "${deck2_id}", shift_start: "2026-09-01T08:00:00Z", shift_end: "2026-09-01T16:00:00Z" }
              as: CrewPlanner
            - call: "POST /ferry/sailings/${s_id}/crew-assignments"
              payload: { crew_member_id: "${eng_id}", shift_start: "2026-09-01T08:00:00Z", shift_end: "2026-09-01T16:00:00Z" }
              as: CrewPlanner
            - call: "POST /ferry/_clock/set_current_utc"
              payload: { to_iso8601: "2026-08-15T00:00:00Z" }
              as: SchedulerAdmin
            - call: "POST /ferry/sailings/${s_id}/open-booking"
              payload: {}
              as: SchedulerAdmin
            - call: "POST /ferry/customers"
              payload: { full_name: "Std Pat", email: "std@x.com", fare_class: "STANDARD" }
              as: SchedulerAdmin
              captures: { cust_id: $.data.id }
          trigger:
            - call: "POST /ferry/sailings/${s_id}/bookings"
              payload: { customer_id: "${cust_id}", passenger_count: 1, has_vehicle: true, vehicle_length_feet: 18, quoted_fare_cents: 1, status: "COMPLETED" }
              as: Customer
              as_user_id: ${cust_id}
              captures: { b_status: $.data.status, b_quote: $.data.quoted_fare_cents }
          assert:
            - "Booking.status == RESERVED (server-set; injected COMPLETED ignored)"
            - "Booking.quoted_fare_cents == 3200  # 1*1000 + 2000 + 100*2; injected 1 ignored"

      - name: fk_reverse_reachability_route_sailings
        claim_type: parent_relationship
        grounds: [entities.Sailing.fields.route_id, "endpoints[GET /ferry/routes/{id}/sailings]"]
        distinguishing_aspect: "Every sailing created under route R is discoverable via GET /ferry/routes/{R}/sailings; a sailing created under route R2 does not appear in R's list."
        test_recipe:
          setup: ["two routes R1, R2; one vessel; one sailing under R1"]
          setup_api_calls:
            - call: "POST /ferry/routes"
              payload: { route_code: "SEA-BI", origin_terminal: "Seattle", destination_terminal: "Bainbridge", crossing_minutes: 35, turnaround_minutes: 15 }
              as: SchedulerAdmin
              captures: { r1_id: $.data.id }
            - call: "POST /ferry/routes"
              payload: { route_code: "EDM-KIN", origin_terminal: "Edmonds", destination_terminal: "Kingston", crossing_minutes: 30, turnaround_minutes: 15 }
              as: SchedulerAdmin
              captures: { r2_id: $.data.id }
            - call: "POST /ferry/vessels"
              payload: { vessel_name: "MV Kittitas", vehicle_deck_linear_feet: 200, passenger_capacity: 600, crew_class: "MEDIUM" }
              as: SchedulerAdmin
              captures: { vessel_id: $.data.id }
            - call: "POST /ferry/routes/${r1_id}/sailings"
              payload: { vessel_id: "${vessel_id}", departure_time: "2026-09-01T10:00:00Z", season: "OFF_PEAK" }
              as: SchedulerAdmin
              captures: { s1_id: $.data.id }
          trigger:
            - call: "GET /ferry/routes/${r1_id}/sailings"
              payload: {}
              as: SchedulerAdmin
            - call: "GET /ferry/routes/${r2_id}/sailings"
              payload: {}
              as: SchedulerAdmin
          assert:
            - "R1 sailings list contains exactly ${s1_id} (total_count == 1)"
            - "R2 sailings list is empty (total_count == 0)"

  # ===========================================================================
  # Section: state_machines
  # ===========================================================================
  - section: state_machines
    instances:
      - name: sailing_initial_state_scheduled
        claim_type: initial_state
        grounds: [state_machines.Sailing]
        distinguishing_aspect: "A newly created sailing starts in SCHEDULED with arrival_time == departure_time + crossing_minutes."
        test_recipe:
          setup: ["route crossing 35 min; vessel"]
          setup_api_calls:
            - call: "POST /ferry/routes"
              payload: { route_code: "SEA-BI", origin_terminal: "Seattle", destination_terminal: "Bainbridge", crossing_minutes: 35, turnaround_minutes: 15 }
              as: SchedulerAdmin
              captures: { route_id: $.data.id }
            - call: "POST /ferry/vessels"
              payload: { vessel_name: "MV Kittitas", vehicle_deck_linear_feet: 200, passenger_capacity: 600, crew_class: "MEDIUM" }
              as: SchedulerAdmin
              captures: { vessel_id: $.data.id }
          trigger:
            - call: "POST /ferry/routes/${route_id}/sailings"
              payload: { vessel_id: "${vessel_id}", departure_time: "2026-09-01T10:00:00Z", season: "OFF_PEAK" }
              as: SchedulerAdmin
              captures: { s_status: $.data.status, s_arrival: $.data.arrival_time }
          assert:
            - "Sailing.status == SCHEDULED"
            - "Sailing.arrival_time == 2026-09-01T10:35:00Z"

      - name: cancel_terminal_sailing_rejected
