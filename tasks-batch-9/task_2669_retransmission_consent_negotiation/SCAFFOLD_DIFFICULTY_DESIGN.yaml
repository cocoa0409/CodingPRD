  - rule_id: boundary_precision_check
    instances:
      - name: penetration_shortfall_grace_band_exactly_fifty_basis_points
        grounds:
          - calculations.penetration_shortfall_penalty
          - calculations.penetration_shortfall_penalty.constants.PENETRATION_GRACE_BP
          - calculations.penetration_shortfall_penalty.constants.PENALTY_MULTIPLIER
          - endpoints[POST /retrans/agreements/{id}/fee-settlements]
          - entities.FeeSettlement.fields.penetration_penalty_cents
        distinguishing_aspect: |
          Metric under test is the penetration shortfall in basis points, exercised on the settlement
          issuance endpoint. A basis of 99600 against 240000 video households is exactly 4150 bp, a
          shortfall of exactly PENETRATION_GRACE_BP (50), which the grace band absorbs; one
          subscriber-report step lower, 99576, is 4149 bp and a shortfall of 51, one basis point
          outside the band, which triggers the full multiplied penalty rather than a penalty on the
          single excess basis point. Also pins round_half_up on 253918.8 cents.
        test_recipe:
          setup:
            - "One CBS station and one CABLE distributor with exactly 240000 video households"
            - "An EXECUTED agreement from a 250-cent offer with penetration_commitment_bp 4200"
            - "A 2027-01 subscriber report of 99600 subscribers (4150 bp, shortfall exactly 50)"
            - "A 2027-02 subscriber report of 99576 subscribers (4149 bp, shortfall 51)"
