        grounds:
          - validations.priority_73
          - validations.priority_100
          - validations.priority_117
          - errors.ERR_DISPUTE_NOT_ALLOWED_YET
          - errors.ERR_PLAN_SCOPE_MISMATCH
          - errors.ERR_DISPUTE_ADJUSTMENT_EXCEEDS_LIMIT
          - "state_machines.ParticipantAward: payment_status=PENDING -> payment_status=DEFERRED"
        distinguishing_aspect: |
          Three gates on the same dispute lifecycle. Filing while the plan is
          only ALLOCATION_OPEN is premature (409): an award is not disputable until
          it is final. Filing with a participant_id that belongs to a DIFFERENT
          participant of the same plan passes the ownership rule at priority 55
          (the Employee does own the award being disputed) and is caught instead by
          the scope rule at 100. Finally, resolving at 9,000,000 exceeds
          2 x final_award_cents = 8,000,000 by 1,000,000, so the award stays
          DEFERRED and the dispute stays UNDER_REVIEW — while Bea's undisputed award
          was paid in the same run.
