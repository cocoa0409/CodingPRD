            - "GET /payments?claim_id=${c_id} returns amount_cents == 45600"

      - name: claim_filed_at_exact_deadline_instant_rejected
        grounds:
          - validations[priority=8]
          - errors[ERR_CLAIM_WINDOW_CLOSED]
          - entities.Settlement.fields.claim_filing_deadline
        distinguishing_aspect: |
          Metric B: a datetime half-open-window boundary (different metric and a
