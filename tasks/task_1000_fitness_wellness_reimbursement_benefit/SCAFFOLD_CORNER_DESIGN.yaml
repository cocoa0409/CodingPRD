  - section: errors
    instances:
      - name: error_envelope_shape
        claim_type: violation_to_error
        grounds: [response_envelope, "errors[ERR_CLAIM_NOT_FOUND]"]
        distinguishing_aspect: "Error responses carry response_type 'error', data.error_id, data.message, and meta.api_request_id — verified on a claim 404."
        test_recipe:
          setup: ["empty DB"]
          setup_api_calls: []
          trigger:
            - { call: "GET /api/claims/7b2e0d1c-4a5f-4c93-8e7d-31a6c5b2d4e9", payload: {}, as: BenefitsAdmin, captures: { err: $.data.error_id } }
          assert:
            - "error_id == ERR_CLAIM_NOT_FOUND; response_type == error; meta.api_request_id present; data.message non-empty"

      - name: statement_provisional_variant_covered
        claim_type: violation_to_error
        grounds: [calculations.calc_statement_totals]
        excluded_because:
          difficulty_instance: statement_provisional_vs_final
          rationale: "Both statement variants and their divergence are asserted in the named §1.8 instance."

      - name: fraud_flag_thresholds_covered
        claim_type: violation_to_error
        grounds: [calculations.calc_fraud_score, "errors[ERR_FRAUD_HOLD]"]
        excluded_because:
          difficulty_instance: approve_fraud_hold_beats_allowance_exceeded
          rationale: "Flag auto-creation at score 50 and the ERR_FRAUD_HOLD gate are asserted in the named §1.8 instance."

      - name: exhaustion_cascade_covered
        claim_type: side_effect_execution
        grounds: [state_machines.Enrollment.ACTIVE_to_EXHAUSTED]
        excluded_because:
          difficulty_instance: claim_pay_exhaustion_cascade
          rationale: "EXHAUSTED flip, claim auto-rejection, and reservation release are asserted in the named §1.8 instance."

      - name: member_termination_cascade_covered
        claim_type: side_effect_execution
        grounds: [state_machines.Member.ELIGIBLE_to_TERMINATED]
        excluded_because:
          difficulty_instance: member_terminate_cascade
          rationale: "Dependent/enrollment/claim cascade from termination is asserted in the named §1.8 instance."

