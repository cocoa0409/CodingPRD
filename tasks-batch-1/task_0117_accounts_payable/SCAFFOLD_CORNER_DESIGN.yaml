            - call: "GET /ap/invoices/${inv}/audit-events"
              payload: {}
              as: Auditor
              captures: { ev0: "$.data[0].event_type" }
          assert:
            - "response.status == 200"
            - "data length >= 1"

  # =========================================================================
  # Errors
  # =========================================================================
  - section: errors
    instances:
      - name: error_unauthenticated_missing_headers
        claim_type: violation_to_error
        grounds:
          - "validations[priority=1]"
          - "errors[ERR_UNAUTHENTICATED]"
        distinguishing_aspect: "POST /ap/vendors with no X-User-Role/X-User-ID headers -> 401 ERR_UNAUTHENTICATED."
        test_recipe:
          setup: ["Empty DB; request omits auth headers."]
          setup_api_calls: []
          trigger:
            - call: "POST /ap/vendors"
              payload: { legal_name: "NoAuth", payment_method: "ACH" }
              as: Anonymous
              captures: { err: $.data.error_id }
          assert:
            - "response.status == 401"
            - "error_id == ERR_UNAUTHENTICATED"

      - name: error_po_closed_excluded
        claim_type: violation_to_error
        grounds:
          - "errors[ERR_PO_CLOSED]"
        excluded_because:
          difficulty_instance: cross_entity_state_dependency / goods_receipt_post_blocked_by_closed_po
          rationale: "ERR_PO_CLOSED is asserted as the failure path of the named §1.8 instance."

      - name: error_stale_batch_version_excluded
        claim_type: violation_to_error
        grounds:
          - "errors[ERR_STALE_BATCH_VERSION]"
          - "concurrency_rules[batch-release-stale-batch]"
        excluded_because:
          difficulty_instance: priority_pair_validation_conflict / segregation_beats_stale_version_on_release
          rationale: "The stale-version branch is grounded by the named §1.8 priority instance; a dedicated positive OCC stale test is added under cross_cutting_layers below."

  # =========================================================================
  # RBAC
  # =========================================================================
  - section: rbac
    instances:
      - name: clerk_cannot_create_vendor_unauthorized
        claim_type: permission_denied
        grounds:
          - "roles"
          - "validations[priority=2]"
          - "errors[ERR_UNAUTHORIZED]"
        distinguishing_aspect: "APClerk calling POST /ap/vendors (an APManager exclusive op) -> 403 ERR_UNAUTHORIZED."
        test_recipe:
          setup: ["Empty DB."]
          setup_api_calls: []
          trigger:
            - call: "POST /ap/vendors"
              payload: { legal_name: "ByClerk", payment_method: "ACH" }
              as: APClerk
              captures: { err: $.data.error_id }
          assert:
            - "response.status == 403"
            - "error_id == ERR_UNAUTHORIZED"

      - name: approver_cannot_code_invoice_unauthorized
        claim_type: permission_denied
        grounds:
          - "roles"
          - "validations[priority=2]"
          - "errors[ERR_UNAUTHORIZED]"
        distinguishing_aspect: "Approver calling POST /ap/invoices/{id}/code (an APClerk exclusive op) -> 403 ERR_UNAUTHORIZED."
        test_recipe:
          setup: ["A CAPTURED non-PO invoice with one line."]
          setup_api_calls:
            - call: "POST /ap/gl-accounts"
              payload: { code: "5000", name: "COGS", is_postable: true }
              as: APManager
            - call: "POST /ap/vendors"
              payload: { legal_name: "RB", payment_method: "ACH" }
              as: APManager
              captures: { ven: $.data.id }
            - call: "POST /ap/invoices"
              payload: { vendor_id: "${ven}", invoice_number: "RB-1", invoice_date: "2026-05-01" }
              as: APClerk
              captures: { inv: $.data.id }
            - call: "POST /ap/invoices/${inv}/lines"
              payload: { gl_account_code: "5000", amount_cents: 1000, description: "x" }
              as: APClerk
          trigger:
            - call: "POST /ap/invoices/${inv}/code"
              payload: {}
              as: Approver
              captures: { err: $.data.error_id }
          assert:
            - "response.status == 403"
            - "error_id == ERR_UNAUTHORIZED"

      - name: auditor_read_shared_op_allowed
        claim_type: permission_granted
        grounds: [roles]
        distinguishing_aspect: "Auditor calling GET /ap/vendors/{id} (a shared read op) succeeds with 200."
        test_recipe:
          setup: ["One vendor exists."]
          setup_api_calls:
            - call: "POST /ap/vendors"
              payload: { legal_name: "Read", payment_method: "ACH" }
              as: APManager
              captures: { ven: $.data.id }
          trigger:
            - call: "GET /ap/vendors/${ven}"
              payload: {}
              as: Auditor
              captures: { name: $.data.legal_name }
          assert:
            - "response.status == 200"
            - "Vendor.${ven}.legal_name == Read"

      - name: segregation_release_excluded
        claim_type: permission_denied
        grounds:
          - "validations[priority=9]"
          - "errors[ERR_SEGREGATION_OF_DUTIES]"
        excluded_because:
          difficulty_instance: priority_pair_validation_conflict / segregation_beats_stale_version_on_release
          rationale: "Segregation-of-duties denial on release is the named §1.8 instance."

  # =========================================================================
  # Cross-Cutting Complexity Layers
  # =========================================================================
  - section: cross_cutting_layers
    instances:
      - name: occ_correct_version_release_succeeds
        claim_type: optimistic_concurrency
        grounds:
          - "concurrency_rules[batch-release-stale-batch]"
          - "entities.PaymentBatch.fields.version"
          - "state_machines.PaymentBatch.BUILDING_to_RELEASED"
        distinguishing_aspect: "Releasing with expected_paymentbatch_version equal to the batch's current version succeeds (200, status RELEASED) and bumps version by 1."
        test_recipe:
          setup: ["A non-PO invoice 50000 scheduled into an ACH batch; releaser distinct from coder/approver; version read just before release."]
          setup_api_calls:
            - call: "POST /ap/gl-accounts"
              payload: { code: "5000", name: "COGS", is_postable: true }
              as: APManager
            - call: "POST /ap/vendors"
              payload: { legal_name: "OCC", payment_method: "ACH" }
              as: APManager
              captures: { ven: $.data.id }
            - call: "POST /ap/approval-routes"
              payload: { min_amount_cents: 0, max_amount_cents: 1000000000, required_levels: 1 }
              as: APManager
            - call: "POST /ap/invoices"
              payload: { vendor_id: "${ven}", invoice_number: "OCC-1", invoice_date: "2026-05-01" }
              as: APClerk
              as_user_id: "CLERK1"
              captures: { inv: $.data.id }
            - call: "POST /ap/invoices/${inv}/lines"
              payload: { gl_account_code: "5000", amount_cents: 50000, description: "x" }
              as: APClerk
              as_user_id: "CLERK1"
            - call: "POST /ap/invoices/${inv}/code"
              payload: {}
              as: APClerk
              as_user_id: "CLERK1"
            - call: "POST /ap/invoices/${inv}/submit-approval"
              payload: {}
              as: APClerk
              as_user_id: "CLERK1"
            - call: "GET /ap/invoices/${inv}/approval-steps"
              payload: {}
              as: APManager
              captures: { step: "$.data[0].id" }
            - call: "POST /ap/approval-steps/${step}/approve"
              payload: {}
              as: Approver
              as_user_id: "APV1"
            - call: "POST /ap/payment-batches"
              payload: { payment_method: "ACH", run_date: "2026-05-10" }
              as: APManager
              as_user_id: "MGR1"
              captures: { batch: $.data.id }
            - call: "POST /ap/payment-batches/${batch}/payments"
              payload: { invoice_id: "${inv}" }
              as: APManager
              as_user_id: "MGR1"
            - call: "GET /ap/payment-batches/${batch}"
              payload: {}
              as: APManager
              captures: { bv: $.data.version }
          trigger:
            - call: "POST /ap/payment-batches/${batch}/release"
              payload: { expected_paymentbatch_version: "${bv}" }
              as: APManager
              as_user_id: "MGR1"
              captures: { st: $.data.status, nv: $.data.version }
          assert:
            - "response.status == 200"
            - "PaymentBatch.${batch}.status == RELEASED"
            - "Invoice.${inv}.status == PAID"

      - name: occ_stale_version_release_rejected
        claim_type: optimistic_concurrency
        grounds:
          - "concurrency_rules[batch-release-stale-batch]"
          - "errors[ERR_STALE_BATCH_VERSION]"
          - "entities.PaymentBatch.fields.version"
        distinguishing_aspect: "Releasing with a stale expected_paymentbatch_version (the version observed before a second add/delete bumped it) -> 412 ERR_STALE_BATCH_VERSION."
        test_recipe:
          setup: ["Two approved ACH invoices; batch version captured after the first add, then a second add advances it, making the captured version stale."]
          setup_api_calls:
            - call: "POST /ap/gl-accounts"
              payload: { code: "5000", name: "COGS", is_postable: true }
              as: APManager
            - call: "POST /ap/vendors"
              payload: { legal_name: "Stale", payment_method: "ACH" }
              as: APManager
              captures: { ven: $.data.id }
            - call: "POST /ap/approval-routes"
              payload: { min_amount_cents: 0, max_amount_cents: 1000000000, required_levels: 1 }
              as: APManager
            - call: "POST /ap/invoices"
              payload: { vendor_id: "${ven}", invoice_number: "ST-A", invoice_date: "2026-05-01" }
              as: APClerk
              as_user_id: "CLERK1"
              captures: { inv_a: $.data.id }
            - call: "POST /ap/invoices/${inv_a}/lines"
              payload: { gl_account_code: "5000", amount_cents: 50000, description: "a" }
              as: APClerk
              as_user_id: "CLERK1"
            - call: "POST /ap/invoices/${inv_a}/code"
              payload: {}
              as: APClerk
              as_user_id: "CLERK1"
            - call: "POST /ap/invoices/${inv_a}/submit-approval"
              payload: {}
              as: APClerk
              as_user_id: "CLERK1"
            - call: "GET /ap/invoices/${inv_a}/approval-steps"
              payload: {}
              as: APManager
              captures: { step_a: "$.data[0].id" }
            - call: "POST /ap/approval-steps/${step_a}/approve"
              payload: {}
              as: Approver
              as_user_id: "APV1"
            - call: "POST /ap/invoices"
              payload: { vendor_id: "${ven}", invoice_number: "ST-B", invoice_date: "2026-05-01" }
              as: APClerk
              as_user_id: "CLERK1"
              captures: { inv_b: $.data.id }
            - call: "POST /ap/invoices/${inv_b}/lines"
              payload: { gl_account_code: "5000", amount_cents: 50000, description: "b" }
              as: APClerk
              as_user_id: "CLERK1"
            - call: "POST /ap/invoices/${inv_b}/code"
              payload: {}
              as: APClerk
              as_user_id: "CLERK1"
            - call: "POST /ap/invoices/${inv_b}/submit-approval"
              payload: {}
              as: APClerk
              as_user_id: "CLERK1"
            - call: "GET /ap/invoices/${inv_b}/approval-steps"
              payload: {}
              as: APManager
              captures: { step_b: "$.data[0].id" }
            - call: "POST /ap/approval-steps/${step_b}/approve"
              payload: {}
              as: Approver
              as_user_id: "APV1"
            - call: "POST /ap/payment-batches"
              payload: { payment_method: "ACH", run_date: "2026-05-10" }
              as: APManager
              as_user_id: "MGR1"
              captures: { batch: $.data.id }
            - call: "POST /ap/payment-batches/${batch}/payments"
              payload: { invoice_id: "${inv_a}" }
              as: APManager
              as_user_id: "MGR1"
            - call: "GET /ap/payment-batches/${batch}"
              payload: {}
              as: APManager
              captures: { bv_stale: $.data.version }
            - call: "POST /ap/payment-batches/${batch}/payments"
              payload: { invoice_id: "${inv_b}" }
              as: APManager
              as_user_id: "MGR1"
          trigger:
            - call: "POST /ap/payment-batches/${batch}/release"
              payload: { expected_paymentbatch_version: "${bv_stale}" }
              as: APManager
              as_user_id: "MGR1"
              captures: { err: $.data.error_id }
          assert:
            - "response.status == 412"
            - "error_id == ERR_STALE_BATCH_VERSION"

      - name: derived_po_matched_amount_recomputed_on_match
        claim_type: derived_field_reconciliation
        grounds: [entities.PurchaseOrder.fields.matched_amount_cents, state_machines.Invoice.CAPTURED_to_MATCHED]
        distinguishing_aspect: "After a THREE_WAY invoice 100000 matches, PurchaseOrder.matched_amount_cents recomputes to 100000 while ordered 200000 keeps status OPEN."
        test_recipe:
          setup: ["PO ordered 200000, POSTED receipt 100000; one invoice 100000 coded in tolerance."]
          setup_api_calls:
            - call: "POST /ap/gl-accounts"
              payload: { code: "5000", name: "COGS", is_postable: true }
              as: APManager
            - call: "POST /ap/vendors"
              payload: { legal_name: "Der", payment_method: "ACH" }
              as: APManager
              captures: { ven: $.data.id }
            - call: "POST /ap/purchase-orders"
              payload: { vendor_id: "${ven}", gl_account_code: "5000", ordered_amount_cents: 200000 }
              as: APManager
              captures: { po: $.data.id }
            - call: "POST /ap/goods-receipts"
              payload: { po_id: "${po}", received_amount_cents: 100000, received_date: "2026-05-01", coverage_days: 5 }
              as: APClerk
              captures: { gr: $.data.id }
            - call: "POST /ap/goods-receipts/${gr}/post"
              payload: {}
              as: APClerk
            - call: "POST /ap/invoices"
              payload: { vendor_id: "${ven}", po_id: "${po}", invoice_number: "DER-1", invoice_date: "2026-05-10" }
              as: APClerk
              captures: { inv: $.data.id }
            - call: "POST /ap/invoices/${inv}/lines"
              payload: { gl_account_code: "5000", amount_cents: 100000, description: "x" }
              as: APClerk
          trigger:
            - call: "POST /ap/invoices/${inv}/code"
              payload: {}
              as: APClerk
              captures: { st: $.data.status }
          assert:
            - "Invoice.${inv}.status == MATCHED"
            - "PurchaseOrder.${po}.matched_amount_cents == 100000"
            - "PurchaseOrder.${po}.status == OPEN"

      - name: settle_cascade_depth3_excluded
        claim_type: cascading_side_effects
        grounds: [state_machines.PaymentBatch.RELEASED_to_SETTLED]
        excluded_because:
          difficulty_instance: transitive_cascade / settle_cascade_payment_then_vendor_ytd_depth3
          rationale: "The settle -> payment -> vendor-ytd cascade is the named §1.8 transitive-cascade instance."

  # =========================================================================
  # Consistency Model
  # =========================================================================
  - section: consistency_model
    instances:
      - name: code_response_reflects_match_immediately
        claim_type: immediate
        grounds: [entities.Invoice.fields.variance_cents, state_machines.Invoice.CAPTURED_to_MATCHED]
        distinguishing_aspect: "The POST code response carries the freshly computed status MATCHED and variance_cents in the same request (immediate consistency)."
        test_recipe:
          setup: ["A THREE_WAY invoice 100500 against PO ordered 100000 received 100000."]
          setup_api_calls:
            - call: "POST /ap/gl-accounts"
              payload: { code: "5000", name: "COGS", is_postable: true }
              as: APManager
            - call: "POST /ap/vendors"
              payload: { legal_name: "Imm", payment_method: "ACH" }
              as: APManager
              captures: { ven: $.data.id }
            - call: "POST /ap/purchase-orders"
              payload: { vendor_id: "${ven}", gl_account_code: "5000", ordered_amount_cents: 100000 }
              as: APManager
              captures: { po: $.data.id }
            - call: "POST /ap/goods-receipts"
              payload: { po_id: "${po}", received_amount_cents: 100000, received_date: "2026-05-01", coverage_days: 5 }
              as: APClerk
              captures: { gr: $.data.id }
            - call: "POST /ap/goods-receipts/${gr}/post"
              payload: {}
              as: APClerk
            - call: "POST /ap/invoices"
              payload: { vendor_id: "${ven}", po_id: "${po}", invoice_number: "IMM-1", invoice_date: "2026-05-10" }
              as: APClerk
              captures: { inv: $.data.id }
            - call: "POST /ap/invoices/${inv}/lines"
              payload: { gl_account_code: "5000", amount_cents: 100500, description: "x" }
              as: APClerk
          trigger:
            - call: "POST /ap/invoices/${inv}/code"
              payload: {}
              as: APClerk
              captures: { st: $.data.status, var: $.data.variance_cents }
          assert:
            - "Invoice.${inv}.status == MATCHED"
            - "Invoice.${inv}.variance_cents == 500"
