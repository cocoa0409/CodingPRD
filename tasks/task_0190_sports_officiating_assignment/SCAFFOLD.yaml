# =============================================================================
# Sports Officiating Assignment — benchmark seed tables (§1.0–§1.7)
# Expert difficulty band (§0.4 Expert).
# =============================================================================

scenario: "Sports Officiating Assignment: official certification/rank, game assignment/availability, conflict/travel radius, crew composition, pay rate/mileage, evaluation/rating, decline/no-show penalty, postseason eligibility"

domain_name: sports-officiating-assignment
api_prefix: ""    # flat topology: peer resource collections at the API root (/leagues, /officials, /games, ...)

# -----------------------------------------------------------------------------
# Complexity profile (§0.1–§0.4)
# -----------------------------------------------------------------------------
complexity_profile:
  primary_archetype: quota_allocation        # finite crew slots competed for, reserved, committed, released
  secondary_archetype: temporal_windowing    # availability windows + travel-radius/COI interval reasoning
  complexity_layers:
    - optimistic_concurrency                 # OCC on Game.version for crew-slot fill races
    - cascading_side_effects                 # decline/no-show ripples through slot -> game -> ledger -> rating
    - dual_variant_calculation               # provisional game pay vs finalized settlement pay
    - rate_threshold_triggers                # postseason eligibility + penalty escalation breakpoints
    - derived_field_reconciliation           # Official.reliability_score / Game.crew_filled_count denormalized

  entity_topology: flat                      # peer entities linked by FK; no deep URL nesting
  state_machine_shape: cyclic                # Assignment OFFERED->DECLINED->(re-offer) loop; parallel dims on Game/Official
  relationship_patterns:
    - one_to_many                            # Game -> CrewSlot -> Assignment
    - many_to_many                           # Official <-> Game via Assignment; ConflictDeclaration junction
    - self_referential                       # ConflictDeclaration pairs Official with Official
    - cross_aggregate                        # Assignment side-effects mutate Official + SeasonLedger

  role_model: peer_roles                     # Assignor owns assignment ops; Official owns own availability/responses; LeagueAdmin owns config; Evaluator owns ratings
  consistency_model: immediate

# =============================================================================
# §1.0 Response Envelope (FIXED — verbatim)
# =============================================================================
response_envelope:
  success: |
    { "meta": { "api_request_id": "req_xxx", "api_request_timestamp": "ISO8601" },
      "response_type": "object" | "array", "data": {} }
  error: |
    { "meta": { ... }, "response_type": "error",
      "data": { "error_id": "ERR_XXX", "message": "..." } }
  pagination_fields: ["limit", "offset", "total_count", "has_more"]
  pagination_defaults: { limit: 10, min: 1, max: 100, offset: 0 }

# =============================================================================
# §1.1 Entity-Relationship Table
# =============================================================================
entities:
  - name: League
    parent: null
    common_fields: true   # id, created_at, updated_at, version
    fields:
      - { name: name, type: string, source: input, description: "League name" }
      - { name: sport, type: enum, source: input, description: "BASKETBALL | SOCCER | HOCKEY | FOOTBALL" }
      - { name: base_game_fee_cents, type: integer, source: input, description: "Base per-official game fee in cents before rank multiplier", constraints: ">= 0" }
      - { name: mileage_rate_cents_per_mile, type: integer, source: input, description: "Reimbursement rate per mile in cents (integer)", constraints: ">= 0" }
      - { name: postseason_min_games, type: integer, source: input, default: 8, description: "Minimum regular-season games worked to be postseason eligible", constraints: ">= 0" }
      - { name: postseason_min_rating, type: number, source: input, default: 3.5, description: "Minimum mean evaluation rating (1.00-5.00 scale) for postseason eligibility" }
      - { name: postseason_max_noshows, type: integer, source: input, default: 0, description: "Maximum no-shows allowed in the season to remain postseason eligible" }
      - { name: status, type: enum, source: system, default: "SETUP", description: "SETUP | OPEN | POSTSEASON | ARCHIVED" }

  - name: Official
    parent: null
    common_fields: true
    fields:
      - { name: league_id, type: string, source: input, description: "FK -> League.id" }
      - { name: full_name, type: string, source: input, description: "Official's full name" }
      - { name: rank, type: enum, source: input, default: "ROOKIE", description: "ROOKIE | CERTIFIED | SENIOR | MASTER — sets pay multiplier and referee eligibility" }
      - { name: home_lat, type: number, source: input, description: "Home latitude (decimal degrees) for travel-radius math" }
      - { name: home_lon, type: number, source: input, description: "Home longitude (decimal degrees) for travel-radius math" }
      - { name: max_travel_miles, type: number, source: input, default: 50, description: "Official will not be auto-eligible for games beyond this great-circle distance" }
      - { name: status, type: enum, source: system, default: "ACTIVE", description: "ACTIVE | SUSPENDED — SUSPENDED blocks new offers" }
      - { name: games_worked_count, type: integer, source: computed, description: "Read-only: count of Assignment in COMPLETED for this official this season" }
      - { name: noshow_count, type: integer, source: computed, description: "Read-only: count of Assignment that reached NO_SHOW for this official this season" }
      - { name: penalty_points, type: integer, source: computed, description: "Read-only: running penalty total from declines/no-shows, mirrors SeasonLedger.penalty_points" }
      - { name: mean_rating, type: number, source: computed, description: "Read-only: mean Evaluation.score over COMPLETED assignments, 2dp, null when no evaluations" }
      - { name: reliability_score, type: number, source: computed, description: "Read-only: 100 - penalty_points, floored at 0, denormalized reliability gauge" }
      - { name: postseason_eligible, type: boolean, source: computed, description: "Read-only: derived eligibility per Postseason Eligibility calc" }

  - name: Game
    parent: null
    common_fields: true
    fields:
      - { name: league_id, type: string, source: input, description: "FK -> League.id" }
      - { name: home_team, type: string, source: input, description: "Home team name" }
      - { name: away_team, type: string, source: input, description: "Away team name" }
      - { name: venue_lat, type: number, source: input, description: "Venue latitude (decimal degrees)" }
      - { name: venue_lon, type: number, source: input, description: "Venue longitude (decimal degrees)" }
      - { name: start_utc, type: datetime, source: input, description: "Game start time, ISO 8601 UTC" }
      - { name: duration_minutes, type: integer, source: input, default: 120, description: "Scheduled duration; defines occupied interval [start_utc, start_utc+duration]", constraints: "> 0" }
      - { name: required_crew_size, type: integer, source: input, description: "Number of crew slots required to fill the game", constraints: ">= 1" }
      - { name: is_postseason, type: boolean, source: input, default: false, description: "True for postseason games; gates eligibility checks on fill" }
      - { name: status, type: enum, source: system, default: "DRAFT", description: "DRAFT | OPEN | STAFFED | LOCKED | COMPLETED | CANCELLED" }
      - { name: crew_filled_count, type: integer, source: computed, description: "Read-only: count of CrewSlot in FILLED for this game, denormalized" }
      - { name: settlement_total_cents, type: integer, source: computed, description: "Read-only: sum of Assignment.final_pay_cents over COMPLETED assignments after settlement, else 0" }

  - name: CrewSlot
    parent: null
    common_fields: true
    fields:
      - { name: game_id, type: string, source: input, description: "FK -> Game.id" }
      - { name: position, type: enum, source: input, description: "REFEREE | ASSISTANT | OBSERVER — REFEREE requires SENIOR+ rank" }
      - { name: slot_fee_multiplier, type: number, source: input, default: 1.0, description: "Position fee multiplier applied to league base fee" }
      - { name: status, type: enum, source: system, default: "VACANT", description: "VACANT | OFFERED | FILLED | RELEASED" }
      - { name: current_assignment_id, type: string, source: system, description: "Denormalized back-pointer to the live (non-terminal) Assignment.id holding this slot, null when VACANT/RELEASED; not a hierarchical parent FK — slot->assignment history is read via GET /crew-slots/{id}/assignments" }

  - name: Assignment
    parent: null
    common_fields: true
    fields:
      - { name: crew_slot_id, type: string, source: input, description: "FK -> CrewSlot.id" }
      - { name: game_id, type: string, source: system, description: "FK -> Game.id; copied from the slot at offer time" }
      - { name: official_id, type: string, source: input, description: "FK -> Official.id" }
      - { name: status, type: enum, source: system, default: "OFFERED", description: "OFFERED | ACCEPTED | DECLINED | CANCELLED | COMPLETED | NO_SHOW" }
      - { name: distance_miles, type: number, source: computed, description: "Read-only: great-circle miles between official home and game venue, 2dp, frozen at offer time" }
      - { name: provisional_pay_cents, type: integer, source: computed, description: "Read-only: estimated pay at offer/accept time (Provisional Game Pay calc)" }
      - { name: final_pay_cents, type: integer, source: computed, description: "Read-only: settled pay computed at game settlement (Finalized Settlement Pay calc), 0 until settled" }
      - { name: mileage_cents, type: integer, source: computed, description: "Read-only: reimbursed mileage = round(distance_miles) * league.mileage_rate_cents_per_mile" }
      - { name: penalty_assessed_points, type: integer, source: computed, description: "Read-only: penalty points charged when this assignment hit DECLINED or NO_SHOW, 0 otherwise" }

  - name: Availability
    parent: null
    common_fields: true
    fields:
      - { name: official_id, type: string, source: input, description: "FK -> Official.id" }
      - { name: window_start_utc, type: datetime, source: input, description: "Window start, ISO 8601 UTC — half-open interval start [start, end)" }
      - { name: window_end_utc, type: datetime, source: input, description: "Window end, ISO 8601 UTC — half-open interval end [start, end), end exclusive", constraints: "window_end_utc > window_start_utc" }
      - { name: kind, type: enum, source: input, default: "AVAILABLE", description: "AVAILABLE | BLACKOUT — BLACKOUT subtracts from availability" }
      - { name: status, type: enum, source: system, default: "ACTIVE", description: "ACTIVE | WITHDRAWN" }

  - name: ConflictDeclaration
    parent: null
    common_fields: false   # id + created_at only; immutable junction
    fields:
      - { name: official_id, type: string, source: input, description: "FK -> Official.id; the official who has a conflict" }
      - { name: scope, type: enum, source: input, description: "TEAM | OFFICIAL — conflict against a team name or a peer official" }
      - { name: team_name, type: string, source: input, description: "Team the official cannot officiate (required when scope=TEAM, else null)" }
      - { name: peer_official_id, type: string, source: input, description: "FK -> Official.id; peer the official cannot share a crew with (required when scope=OFFICIAL, else null)" }

  - name: Evaluation
    parent: null
    common_fields: false   # id + created_at only; append-only rating record
    fields:
      - { name: assignment_id, type: string, source: input, description: "FK -> Assignment.id; the COMPLETED assignment being rated" }
      - { name: official_id, type: string, source: system, description: "Denormalized copy of the rated Official.id (copied from the assignment); not a hierarchical parent FK — evaluations are read via GET /assignments/{id}/evaluations" }
      - { name: score, type: number, source: input, description: "Rating on a 1.00-5.00 scale", constraints: "1.0 <= score <= 5.0" }
      - { name: comment, type: string, source: input, description: "Optional reviewer comment" }

  - name: SeasonLedger
    parent: null
    common_fields: true
    fields:
      - { name: league_id, type: string, source: input, description: "FK -> League.id; one ledger per league (singleton, created with the league)" }
      - { name: official_id, type: string, source: input, description: "FK -> Official.id; one ledger row per official per league" }
      - { name: penalty_points, type: integer, source: system, default: 0, description: "Accumulated penalty points from declines/no-shows" }
      - { name: total_pay_accrued_cents, type: integer, source: system, default: 0, description: "Sum of final_pay_cents settled to this official this season" }
      - { name: total_mileage_accrued_cents, type: integer, source: system, default: 0, description: "Sum of mileage_cents settled to this official this season" }

  - name: PenaltyAppeal
    parent: null
    common_fields: true
    fields:
      - { name: assignment_id, type: string, source: input, description: "FK -> Assignment.id; the DECLINED or NO_SHOW assignment whose penalty is being appealed" }
      - { name: official_id, type: string, source: system, description: "Denormalized copy of the appealing Official.id (copied from the assignment); not a hierarchical parent FK — appeals are read via GET /assignments/{id}/appeals" }
      - { name: reason, type: string, source: input, description: "Official's stated grounds for the appeal" }
      - { name: status, type: enum, source: system, default: "PENDING", description: "PENDING | UPHELD | DENIED — UPHELD reverses the assessed penalty points" }
      - { name: reversed_points, type: integer, source: computed, description: "Read-only: points reversed when UPHELD (== the appealed assignment's penalty_assessed_points), 0 while PENDING/DENIED" }

# =============================================================================
# §1.2 State Machine Table
# =============================================================================
state_machines:
  # ---- Game: parallel-dimension lifecycle (staffing dim + completion dim) ----
  - entity: Game
    initial_state: DRAFT
    terminal_states: [COMPLETED, CANCELLED]
    transitions:
      - from: DRAFT
        to: OPEN
        trigger: "POST /games/{gameId}/open"
        actor: Assignor
        preconditions:
          - "Game in DRAFT (ERR_INVALID_STATE)"
          - "League.status == OPEN (ERR_LEAGUE_NOT_OPEN)"
          - "exactly required_crew_size CrewSlot rows exist for this game (ERR_CREW_NOT_PROVISIONED)"
        side_effects:
          - "all CrewSlot for this game move VACANT (no change; remain VACANT, now offerable)"

      - from: OPEN
        to: STAFFED
        trigger: "system (auto): fires when crew_filled_count reaches required_crew_size after an Assignment ACCEPTED"
        actor: system
        preconditions:
          - "crew_filled_count == required_crew_size"
        side_effects:
          - "Game.status -> STAFFED"

      - from: STAFFED
        to: OPEN
        trigger: "system (auto): fires when crew_filled_count drops below required_crew_size due to a decline/no-show/cancel cascade"
        actor: system
        preconditions:
          - "crew_filled_count < required_crew_size"
        side_effects:
          - "Game.status -> OPEN (slot reopened for re-offer)"

      - from: STAFFED
        to: LOCKED
        trigger: "POST /games/{gameId}/lock"
        actor: Assignor
        preconditions:
          - "Game in STAFFED (ERR_INVALID_STATE)"
          - "crew_filled_count == required_crew_size (ERR_CREW_INCOMPLETE)"
        side_effects:
          - "all FILLED CrewSlot frozen; no further offers accepted"

      - from: LOCKED
        to: COMPLETED
        trigger: "POST /games/{gameId}/settle"
        actor: Assignor
        preconditions:
          - "Game in LOCKED (ERR_INVALID_STATE)"
          - "Game.start_utc <= current clock (ERR_GAME_NOT_STARTED)"
        side_effects:
          - "each FILLED slot's ACCEPTED Assignment -> COMPLETED with final_pay_cents computed (Finalized Settlement Pay)"
          - "SeasonLedger.total_pay_accrued_cents += sum(final_pay_cents); total_mileage_accrued_cents += sum(mileage_cents) [Pay Conservation invariant]"
          - "Game.settlement_total_cents recomputed; Official.games_worked_count recomputed"

      - from: DRAFT
        to: CANCELLED
        trigger: "POST /games/{gameId}/cancel"
        actor: Assignor
        preconditions:
          - "Game in {DRAFT, OPEN, STAFFED, LOCKED} (ERR_INVALID_STATE)"
        side_effects:
          - "all non-terminal Assignment for this game -> CANCELLED (no penalty)"
          - "all CrewSlot -> RELEASED [cascade depth 2: game->slot->assignment]"

      - from: OPEN
        to: CANCELLED
        trigger: "POST /games/{gameId}/cancel"
        actor: Assignor
        preconditions:
          - "Game in {DRAFT, OPEN, STAFFED, LOCKED} (ERR_INVALID_STATE)"
        side_effects:
          - "all non-terminal Assignment -> CANCELLED (no penalty); all CrewSlot -> RELEASED"

      - from: STAFFED
        to: CANCELLED
        trigger: "POST /games/{gameId}/cancel"
        actor: Assignor
        preconditions:
          - "Game in {DRAFT, OPEN, STAFFED, LOCKED} (ERR_INVALID_STATE)"
        side_effects:
          - "all non-terminal Assignment -> CANCELLED (no penalty); all CrewSlot -> RELEASED"

      - from: LOCKED
        to: CANCELLED
        trigger: "POST /games/{gameId}/cancel"
        actor: Assignor
        preconditions:
          - "Game in {DRAFT, OPEN, STAFFED, LOCKED} (ERR_INVALID_STATE)"
        side_effects:
          - "all non-terminal Assignment -> CANCELLED (no penalty); all CrewSlot -> RELEASED"

  # ---- CrewSlot: quota-allocation lifecycle ----
  - entity: CrewSlot
    initial_state: VACANT
    terminal_states: [RELEASED]
    transitions:
      - from: VACANT
        to: OFFERED
        trigger: "POST /crew-slots/{slotId}/offer"
        actor: Assignor
        preconditions:
          - "CrewSlot in VACANT (ERR_SLOT_NOT_VACANT)"
          - "Game.status == OPEN (ERR_GAME_NOT_OPEN)"
          - "all offer-eligibility validations pass (see §1.4: rank, availability, COI, travel, double-book)"
        side_effects:
          - "create Assignment in OFFERED; set current_assignment_id; freeze distance_miles + provisional_pay_cents on the Assignment"

      - from: OFFERED
        to: FILLED
        trigger: "system (auto): the live Assignment transitions OFFERED -> ACCEPTED"
        actor: system
        preconditions:
          - "current_assignment_id Assignment is in ACCEPTED"
        side_effects:
          - "CrewSlot.status -> FILLED; Game.crew_filled_count recomputed; may bubble Game OPEN -> STAFFED"

      - from: OFFERED
        to: VACANT
        trigger: "system (auto): the live Assignment transitions OFFERED -> DECLINED, or Assignor revokes"
        actor: system
        preconditions:
          - "current_assignment_id Assignment is in {DECLINED, CANCELLED}"
        side_effects:
          - "clear current_assignment_id; CrewSlot.status -> VACANT (re-offerable) [cyclic]"

      - from: FILLED
        to: VACANT
        trigger: "system (auto): the live Assignment transitions ACCEPTED -> NO_SHOW or is cancelled before lock"
        actor: system
        preconditions:
          - "current_assignment_id Assignment left ACCEPTED into {NO_SHOW, CANCELLED}"
        side_effects:
          - "clear current_assignment_id; CrewSlot.status -> VACANT; Game.crew_filled_count recomputed; may bubble Game STAFFED -> OPEN [cascade depth 3: assignment->slot->game]"

      - from: VACANT
        to: RELEASED
        trigger: "system (auto): Game -> CANCELLED"
        actor: system
        preconditions:
          - "owning Game in CANCELLED"
        side_effects: []

      - from: OFFERED
        to: RELEASED
        trigger: "system (auto): Game -> CANCELLED"
        actor: system
        preconditions:
          - "owning Game in CANCELLED"
        side_effects:
          - "live Assignment -> CANCELLED"

      - from: FILLED
        to: RELEASED
        trigger: "system (auto): Game -> CANCELLED"
        actor: system
        preconditions:
          - "owning Game in CANCELLED"
        side_effects:
          - "live Assignment -> CANCELLED"

  # ---- Assignment: cyclic offer/response lifecycle (re-offer loop on slot) ----
  - entity: Assignment
    initial_state: OFFERED
    terminal_states: [DECLINED, CANCELLED, COMPLETED, NO_SHOW]
    transitions:
      - from: OFFERED
        to: ACCEPTED
        trigger: "POST /assignments/{assignmentId}/accept"
        actor: Official
        preconditions:
          - "Assignment in OFFERED (ERR_INVALID_STATE)"
          - "acting Official is Assignment.official_id (ERR_NOT_ASSIGNMENT_OWNER)"
          - "Game.status == OPEN (ERR_GAME_NOT_OPEN)"
          - "no ACCEPTED assignment for this official overlaps this game's interval (ERR_OFFICIAL_DOUBLE_BOOKED)"
        side_effects:
          - "CrewSlot -> FILLED; Game.crew_filled_count recomputed; may bubble Game OPEN -> STAFFED"

      - from: OFFERED
        to: DECLINED
        trigger: "POST /assignments/{assignmentId}/decline"
        actor: Official
        preconditions:
          - "Assignment in OFFERED (ERR_INVALID_STATE)"
          - "acting Official is Assignment.official_id (ERR_NOT_ASSIGNMENT_OWNER)"
        side_effects:
          - "penalty_assessed_points = Decline Penalty calc; SeasonLedger.penalty_points += that; Official.penalty_points/reliability_score recomputed"
          - "CrewSlot -> VACANT (re-offerable) [cyclic re-offer]; current_assignment_id cleared"

      - from: ACCEPTED
        to: NO_SHOW
        trigger: "POST /assignments/{assignmentId}/no-show"
        actor: Assignor
        preconditions:
          - "Assignment in ACCEPTED (ERR_INVALID_STATE)"
          - "Game.status in {STAFFED, LOCKED} (ERR_INVALID_STATE)"
          - "Game.start_utc <= current clock (ERR_GAME_NOT_STARTED)"
        side_effects:
          - "penalty_assessed_points = No-Show Penalty calc; SeasonLedger.penalty_points += that; Official.noshow_count/penalty_points/reliability_score recomputed"
          - "CrewSlot -> VACANT; Game.crew_filled_count recomputed; may bubble Game STAFFED -> OPEN [cascade: assignment->slot->game], else LOCKED game stays LOCKED with a vacant slot"

      - from: ACCEPTED
        to: CANCELLED
        trigger: "POST /assignments/{assignmentId}/withdraw"
        actor: Official
        preconditions:
          - "Assignment in ACCEPTED (ERR_INVALID_STATE)"
          - "acting Official is Assignment.official_id (ERR_NOT_ASSIGNMENT_OWNER)"
          - "Game.status in {OPEN, STAFFED} (ERR_GAME_LOCKED)"
        side_effects:
          - "penalty_assessed_points = Decline Penalty calc (withdrawal treated as a late decline); SeasonLedger.penalty_points += that"
          - "CrewSlot -> VACANT; Game.crew_filled_count recomputed; may bubble Game STAFFED -> OPEN"

      - from: ACCEPTED
        to: COMPLETED
        trigger: "system (auto): Game -> COMPLETED via settle"
        actor: system
        preconditions:
          - "owning Game transitioning LOCKED -> COMPLETED"
        side_effects:
          - "final_pay_cents = Finalized Settlement Pay calc; SeasonLedger accruals updated [Pay Conservation invariant]; Official.games_worked_count recomputed"

  # ---- League: configuration + posture lifecycle ----
  - entity: League
    initial_state: SETUP
    terminal_states: [ARCHIVED]
    transitions:
      - from: SETUP
        to: OPEN
        trigger: "POST /leagues/{leagueId}/activate"
        actor: LeagueAdmin
        preconditions:
          - "League in SETUP (ERR_INVALID_STATE)"
        side_effects: []

      - from: OPEN
        to: POSTSEASON
        trigger: "POST /leagues/{leagueId}/start-postseason"
        actor: LeagueAdmin
        preconditions:
          - "League in OPEN (ERR_INVALID_STATE)"
        side_effects:
          - "recompute Official.postseason_eligible for every official in the league [cascade: league->officials]"

      - from: POSTSEASON
        to: ARCHIVED
        trigger: "POST /leagues/{leagueId}/archive"
        actor: LeagueAdmin
        preconditions:
          - "League in POSTSEASON (ERR_INVALID_STATE)"
        side_effects: []

  # ---- PenaltyAppeal: branching review (fork-join with divergent side effects) ----
  - entity: PenaltyAppeal
    initial_state: PENDING
    terminal_states: [UPHELD, DENIED]
    transitions:
      - from: PENDING
        to: UPHELD
        trigger: "POST /penalty-appeals/{appealId}/uphold"
        actor: LeagueAdmin
        preconditions:
          - "PenaltyAppeal in PENDING (ERR_INVALID_STATE)"
          - "appealed Assignment.status in {DECLINED, NO_SHOW} (ERR_INVALID_STATE)"
        side_effects:
          - "reversed_points = appealed Assignment.penalty_assessed_points"
          - "SeasonLedger.penalty_points -= reversed_points (floored at 0); Official.penalty_points/reliability_score recomputed [Penalty Conservation invariant: ledger.penalty_points == sum(penalty_assessed_points over terminal assignments) - sum(reversed_points over UPHELD appeals)]"
          - "if the appealed assignment was a NO_SHOW, Official.noshow_count is recomputed excluding this assignment [cascade: appeal->official noshow_count->postseason_eligible]"

      - from: PENDING
        to: DENIED
        trigger: "POST /penalty-appeals/{appealId}/deny"
        actor: LeagueAdmin
        preconditions:
          - "PenaltyAppeal in PENDING (ERR_INVALID_STATE)"
        side_effects:
          - "reversed_points stays 0; no ledger change (divergent from UPHELD branch)"

# -----------------------------------------------------------------------------
# §1.2.1 Concurrency Rules — OCC on Game.version only (true CREATE-with-supersede race)
# -----------------------------------------------------------------------------
concurrency_rules:
  - rule_id: slot-offer-stale-game
    parent_entity: Game
    write_endpoint: "POST /crew-slots/{slotId}/offer"
    occ_field: "expected_game_version"
    description: |
      Offering a CrewSlot against a Game whose version has advanced since the
      Assignor last observed it is rejected with a stale-version error. A prior
      offer against a sibling slot legitimately fills crew and bumps the game's
      version (crew_filled_count recompute / possible STAFFED bubble); an
      Assignor still holding the older game version is working from a stale view
      of remaining capacity, so the second offer is rejected on version mismatch.
    error_id: ERR_STALE_GAME_VERSION
    http_status: 412

  - rule_id: accept-stale-game
    parent_entity: Game
    write_endpoint: "POST /assignments/{assignmentId}/accept"
    occ_field: "expected_game_version"
    description: |
      Accepting an OFFERED assignment against a Game whose version advanced since
      the Official last fetched it is rejected. Another official accepting a
      sibling slot bumps the game version (crew_filled_count recompute, possible
      OPEN -> STAFFED bubble); an acceptance still carrying the older version is
      operating on a stale crew picture and is rejected on version mismatch.
    error_id: ERR_STALE_GAME_VERSION
    http_status: 412

# =============================================================================
# §1.3 Calculation Rules Table
# =============================================================================
calculations:
  # ---- DUAL-VARIANT pair, instance A (provisional, Assignment domain) ----
  - name: provisional_game_pay
    trigger: "CrewSlot VACANT -> OFFERED (Assignment created in OFFERED); frozen on the Assignment at offer time"
    algorithm: forward_looking
    formula: |
      rank_mult   = RANK_MULTIPLIER[official.rank]
      base        = league.base_game_fee_cents * crew_slot.slot_fee_multiplier
      game_pay    = round_half_up(base * rank_mult)        # integer cents
      mileage     = round_half_up(distance_miles) * league.mileage_rate_cents_per_mile
      # Provisional includes a postseason uplift ESTIMATE if game.is_postseason,
      # applied to game_pay BEFORE adding mileage:
      if game.is_postseason: game_pay = round_half_up(game_pay * POSTSEASON_UPLIFT)
      provisional_pay_cents = game_pay + mileage
    input_set: "single Assignment at offer time; uses the official's rank AT OFFER TIME (frozen)"
    constants:
      RANK_MULTIPLIER: { ROOKIE: 1.0, CERTIFIED: 1.25, SENIOR: 1.5, MASTER: 2.0 }
      POSTSEASON_UPLIFT: 1.20
    precision: "integer cents, round_half_up at each round_half_up() step"
    variants:
      - name: estimate_uses_offer_time_rank
        when: "official is promoted between offer and settlement"
        difference: "provisional uses rank frozen at offer; finalized uses rank at settlement — values diverge"

  # ---- DUAL-VARIANT pair, instance B (finalized, Assignment domain at settle) ----
  - name: finalized_settlement_pay
    trigger: "Game LOCKED -> COMPLETED (settle); Assignment ACCEPTED -> COMPLETED"
    algorithm: chronological
    formula: |
      rank_mult   = RANK_MULTIPLIER[official.rank]         # rank AT SETTLEMENT TIME (may differ from offer)
      base        = league.base_game_fee_cents * crew_slot.slot_fee_multiplier
      game_pay    = round_half_up(base * rank_mult)
      if game.is_postseason: game_pay = round_half_up(game_pay * POSTSEASON_UPLIFT)
      mileage     = round_half_up(distance_miles) * league.mileage_rate_cents_per_mile  # distance frozen at offer
      # Reliability deduction: officials with penalty_points above a floor forfeit a fraction of game_pay
      if official.penalty_points >= RELIABILITY_DEDUCTION_THRESHOLD:
          game_pay = round_half_up(game_pay * (1 - RELIABILITY_DEDUCTION_PCT))
      final_pay_cents = game_pay + mileage
    input_set: "single COMPLETED Assignment; uses rank and penalty_points AS OF settlement"
    constants:
      RANK_MULTIPLIER: { ROOKIE: 1.0, CERTIFIED: 1.25, SENIOR: 1.5, MASTER: 2.0 }
      POSTSEASON_UPLIFT: 1.20
      RELIABILITY_DEDUCTION_THRESHOLD: 10
      RELIABILITY_DEDUCTION_PCT: 0.10
    precision: "integer cents, round_half_up at each round_half_up() step"
    variants:
      - name: final_reflects_settlement_rank_and_penalty
        when: "settlement time"
        difference: "diverges from provisional by current rank and by the reliability deduction absent from the estimate"

  # ---- COMBINATORIAL mode (a): non-linear multi-input formula (Official domain) ----
  - name: decline_penalty
    trigger: "Assignment OFFERED -> DECLINED, or ACCEPTED -> CANCELLED (withdraw)"
    algorithm: threshold
    formula: |
      hours_to_game = (game.start_utc - current_clock) / 3600        # may be negative if past
      # tiered base by lead time (nested branch, >=3 inputs: lead time, prior declines, postseason flag):
      if   hours_to_game <  LATE_HOURS:   base_pen = LATE_DECLINE_POINTS      # late decline
      elif hours_to_game < SHORT_HOURS:   base_pen = SHORT_DECLINE_POINTS
      else:                               base_pen = STANDARD_DECLINE_POINTS
      # escalation by prior declines this season (count of DECLINED+CANCELLED-with-penalty assignments BEFORE this one):
      escalation = min(prior_penalised_declines, MAX_ESCALATION_STEPS) * ESCALATION_STEP_POINTS
      mult = POSTSEASON_PENALTY_MULT if game.is_postseason else 1.0
      penalty = round_half_up((base_pen + escalation) * mult)        # integer points
    input_set: "the declining/withdrawing Assignment; prior_penalised_declines = count of this official's terminal assignments with penalty_assessed_points > 0 created before this assignment, ordered by created_at ASC"
    constants:
      LATE_HOURS: 24
      SHORT_HOURS: 72
      LATE_DECLINE_POINTS: 8
      SHORT_DECLINE_POINTS: 4
      STANDARD_DECLINE_POINTS: 1
      ESCALATION_STEP_POINTS: 2
      MAX_ESCALATION_STEPS: 3
      POSTSEASON_PENALTY_MULT: 2.0
    precision: "integer points, round_half_up"

  # ---- No-Show Penalty (Official domain; distinct from decline) ----
  - name: no_show_penalty
    trigger: "Assignment ACCEPTED -> NO_SHOW"
    algorithm: threshold
    formula: |
      escalation = min(prior_noshows, NS_MAX_STEPS) * NS_ESCALATION_POINTS
      mult = NS_POSTSEASON_MULT if game.is_postseason else 1.0
      penalty = round_half_up((NOSHOW_BASE_POINTS + escalation) * mult)   # integer points
    input_set: "the no-showing Assignment; prior_noshows = count of this official's NO_SHOW assignments created before this one, ordered by created_at ASC"
    constants:
      NOSHOW_BASE_POINTS: 15
      NS_ESCALATION_POINTS: 5
      NS_MAX_STEPS: 3
      NS_POSTSEASON_MULT: 2.0
    precision: "integer points, round_half_up"

  # ---- COMBINATORIAL mode (b): order-dependent rounding (League domain aggregate) ----
  - name: postseason_eligibility
    trigger: "League OPEN -> POSTSEASON (recompute per official); also exposed via GET /officials/{id}/eligibility"
    algorithm: aggregation
    formula: |
      games = official.games_worked_count                 # COMPLETED assignments this season
      # mean_rating is computed round-then-aggregate: round EACH evaluation score to 2dp,
      # then take the arithmetic mean of those rounded values, THEN round the mean to 2dp.
      # (Pinned order: round-per-item THEN average THEN round; NOT average-raw-then-round.)
      per_item     = [round_half_up(e.score, 2) for e in evaluations_for_official]   # COMPLETED-assignment evals
      mean_rating  = round_half_up(sum(per_item) / count(per_item), 2) if per_item else null
      eligible = (games >= league.postseason_min_games)
                 AND (mean_rating is not null AND mean_rating >= league.postseason_min_rating)
                 AND (official.noshow_count <= league.postseason_max_noshows)
                 AND (official.status == ACTIVE)
    input_set: "Evaluations tied to this official's COMPLETED assignments; games_worked_count and noshow_count as of evaluation time"
    constants: {}
    precision: "rating 2 decimal places, round_half_up; round-per-item THEN average THEN round"

  # ---- AGGREGATION: denormalized reliability + crew counters ----
  - name: reliability_score
    trigger: "any change to SeasonLedger.penalty_points (decline/no-show side-effects)"
    algorithm: aggregation
    formula: |
      reliability_score = max(0, 100 - season_ledger.penalty_points)
    input_set: "single SeasonLedger row for (league, official)"
    constants: { FLOOR: 0, CEIL: 100 }
    precision: "integer"

# =============================================================================
# §1.4 Validation Rules Table (ordered by priority)
# =============================================================================
validations:
  - priority: 1
    category: auth
    check: "X-User-Role and X-User-ID headers present and well-formed"
    error_id: ERR_UNAUTHENTICATED
    http_status: 401
    applies_to: "all"

  - priority: 2
    category: auth
    check: "acting role is permitted for this operation per §1.7"
    error_id: ERR_FORBIDDEN_ROLE
    http_status: 403
    applies_to: "all"

  - priority: 3
    category: existence
    check: "all path/body referenced resources exist (League, Official, Game, CrewSlot, Assignment, Availability), validated left-to-right in path"
    error_id: ERR_NOT_FOUND
    http_status: 404
    applies_to: "all endpoints with path/body ids"

  - priority: 4
    category: state
    check: "target resource is in a state from which the requested transition is defined (§1.2)"
    error_id: ERR_INVALID_STATE
    http_status: 409
    applies_to: "all state-transition endpoints"

  - priority: 5
    category: business_referential
    check: "on accept/decline/withdraw/appeal: acting Official is the Assignment.official_id (entity_backed ownership)"
    error_id: ERR_NOT_ASSIGNMENT_OWNER
    http_status: 403
    applies_to: "POST /assignments/{assignmentId}/accept, /decline, /withdraw, /appeals"

  - priority: 6
    category: business_constraint
    check: "Official.status == ACTIVE when receiving a new offer (SUSPENDED officials cannot be offered)"
    error_id: ERR_OFFICIAL_SUSPENDED
    http_status: 409
    applies_to: "POST /crew-slots/{slotId}/offer"

  - priority: 7
    category: business_safety
    check: "rank eligibility: CrewSlot.position == REFEREE requires Official.rank in {SENIOR, MASTER}"
    error_id: ERR_RANK_INELIGIBLE
    http_status: 422
    applies_to: "POST /crew-slots/{slotId}/offer"

  - priority: 8
    category: business_safety
    check: "conflict of interest: no ConflictDeclaration where (official vs game's home_team/away_team via scope=TEAM) and no scope=OFFICIAL conflict with any official already FILLED on the same game"
    error_id: ERR_CONFLICT_OF_INTEREST
    http_status: 422
    applies_to: "POST /crew-slots/{slotId}/offer"

  - priority: 9
    category: business_temporal
    check: "availability cover: game interval [start_utc, start_utc+duration) is fully inside at least one ACTIVE AVAILABLE window and intersects NO ACTIVE BLACKOUT window for the official (half-open interval arithmetic, end exclusive)"
    error_id: ERR_OUTSIDE_AVAILABILITY
    http_status: 422
    applies_to: "POST /crew-slots/{slotId}/offer"

  - priority: 10
    category: business_temporal
    check: "double-booking on offer: the game interval must not overlap any OTHER game interval where this official already holds an OFFERED or ACCEPTED assignment (closed-on-start, open-on-end; touching-at-endpoint allowed)"
    error_id: ERR_OFFICIAL_DOUBLE_BOOKED
    http_status: 409
    applies_to: "POST /crew-slots/{slotId}/offer, POST /assignments/{assignmentId}/accept"

  - priority: 11
    category: business_constraint
    check: "travel radius: great-circle distance(official.home, game.venue) <= official.max_travel_miles"
    error_id: ERR_OUTSIDE_TRAVEL_RADIUS
    http_status: 422
    applies_to: "POST /crew-slots/{slotId}/offer"

  - priority: 12
    category: business_constraint
    check: "postseason gate: if Game.is_postseason, the offered Official must be postseason_eligible (Postseason Eligibility calc)"
    error_id: ERR_NOT_POSTSEASON_ELIGIBLE
    http_status: 422
    applies_to: "POST /crew-slots/{slotId}/offer"

  - priority: 13
    category: business_constraint
    check: "Evaluation may only target an Assignment in COMPLETED; one Evaluation per assignment"
    error_id: ERR_ASSIGNMENT_NOT_COMPLETED
    http_status: 409
    applies_to: "POST /assignments/{assignmentId}/evaluations"

  - priority: 14
    category: business_constraint
    check: "PenaltyAppeal may only target an Assignment in {DECLINED, NO_SHOW} with penalty_assessed_points > 0; at most one PENDING/UPHELD appeal per assignment"
    error_id: ERR_NOT_APPEALABLE
    http_status: 409
    applies_to: "POST /assignments/{assignmentId}/appeals"

  - priority: 15
    category: business_constraint
    check: "OCC: expected_game_version must equal current Game.version on offer/accept/lock/settle"
    error_id: ERR_STALE_GAME_VERSION
    http_status: 412
    applies_to: "POST /crew-slots/{slotId}/offer, POST /assignments/{assignmentId}/accept, POST /games/{gameId}/lock, POST /games/{gameId}/settle"

  - priority: 16
    category: business_constraint
    check: "OCC: expected_official_version must equal current Official.version on PATCH /officials/{id}"
    error_id: ERR_STALE_OFFICIAL_VERSION
    http_status: 412
    applies_to: "PATCH /officials/{officialId}"

  - priority: 17
    category: business_constraint
    check: "input field validity: required fields present, enums valid, score within 1.0-5.0, window_end > window_start, required_crew_size >= 1, lat/lon numeric"
    error_id: ERR_INVALID_REQUEST
    http_status: 400
    applies_to: "all create/update endpoints"

# =============================================================================
# §1.5 API Endpoint Table
# =============================================================================
endpoints:
  # ---- League ----
  - method: POST
    path: "/leagues"
    description: "Create a league (and its singleton SeasonLedger scaffolding)"
    roles: [LeagueAdmin]
    code: 201
    input: [name, sport, base_game_fee_cents, mileage_rate_cents_per_mile, "postseason_min_games?", "postseason_min_rating?", "postseason_max_noshows?"]
    output: League
    side_effects: ["League created in SETUP"]

  - method: GET
    path: "/leagues"
    description: "List leagues"
    roles: [LeagueAdmin, Assignor, Official, Evaluator]
    code: 200
    input: ["limit?", "offset?"]
    output: "League[]"
    side_effects: []

  - method: GET
    path: "/leagues/{id}"
    description: "Get a league"
    roles: [LeagueAdmin, Assignor, Official, Evaluator]
    code: 200
    input: []
    output: League
    side_effects: []

  - method: GET
    path: "/leagues/{id}/season-ledgers"
    description: "Reverse-reachability: SeasonLedger rows for a league"
    roles: [LeagueAdmin, Assignor, Official, Evaluator]
    code: 200
    input: ["limit?", "offset?"]
    output: "SeasonLedger[]"
    side_effects: []

  - method: POST
    path: "/leagues/{id}/activate"
    description: "SETUP -> OPEN"
    roles: [LeagueAdmin]
    code: 200
    input: []
    output: League
    side_effects: ["League.status -> OPEN"]

  - method: POST
    path: "/leagues/{id}/start-postseason"
    description: "OPEN -> POSTSEASON; recompute every official's postseason_eligible"
    roles: [LeagueAdmin]
    code: 200
    input: []
    output: League
    side_effects: ["cascade: recompute Official.postseason_eligible for all officials in league"]

  - method: POST
    path: "/leagues/{id}/archive"
    description: "POSTSEASON -> ARCHIVED"
    roles: [LeagueAdmin]
    code: 200
    input: []
    output: League
    side_effects: ["League.status -> ARCHIVED"]

  # ---- Official ----
  - method: POST
    path: "/officials"
    description: "Register an official under a league; creates the official's SeasonLedger row"
    roles: [LeagueAdmin]
    code: 201
    input: [league_id, full_name, "rank?", home_lat, home_lon, "max_travel_miles?"]
    output: Official
    side_effects: ["Official created ACTIVE; SeasonLedger row created with penalty_points=0"]

  - method: GET
    path: "/officials"
    description: "List/filter officials (by league_id)"
    roles: [LeagueAdmin, Assignor, Official, Evaluator]
    code: 200
    input: ["league_id?", "limit?", "offset?"]
    output: "Official[]"
    side_effects: []

  - method: GET
    path: "/officials/{id}"
    description: "Get an official with all computed fields"
    roles: [LeagueAdmin, Assignor, Official, Evaluator]
    code: 200
    input: []
    output: Official
    side_effects: []

  - method: PATCH
    path: "/officials/{id}"
    description: "Update mutable official fields (rank promotion, max_travel_miles, status)"
    roles: [LeagueAdmin]
    code: 200
    input: ["rank?", "max_travel_miles?", "status?", "expected_official_version"]
    output: Official
    side_effects: ["increments Official.version by 1"]

  - method: GET
    path: "/officials/{id}/eligibility"
    description: "Computed read: postseason eligibility breakdown (games, mean_rating, noshow_count, eligible)"
    roles: [LeagueAdmin, Assignor, Official, Evaluator]
    code: 200
    input: []
    output: Official
    side_effects: ["recompute Postseason Eligibility (read-only)"]

  - method: GET
    path: "/officials/{id}/assignments"
    description: "Reverse-reachability: assignments for an official"
    roles: [LeagueAdmin, Assignor, Official, Evaluator]
    code: 200
    input: ["limit?", "offset?"]
    output: "Assignment[]"
    side_effects: []

  - method: GET
    path: "/officials/{id}/ledger"
    description: "Reverse-reachability: SeasonLedger rows for an official"
    roles: [LeagueAdmin, Assignor, Official, Evaluator]
    code: 200
    input: ["limit?", "offset?"]
    output: "SeasonLedger[]"
    side_effects: []

  # ---- Availability ----
  - method: POST
    path: "/availabilities"
    description: "Declare an availability or blackout window for an official"
    roles: [Official, LeagueAdmin]
    code: 201
    input: [official_id, window_start_utc, window_end_utc, "kind?"]
    output: Availability
    side_effects: ["window created ACTIVE"]

  - method: GET
    path: "/availabilities"
    description: "List/filter availability windows (by official_id)"
    roles: [LeagueAdmin, Assignor, Official, Evaluator]
    code: 200
    input: ["official_id?", "limit?", "offset?"]
    output: "Availability[]"
    side_effects: []

  - method: GET
    path: "/availabilities/{id}"
    description: "Get an availability window"
    roles: [LeagueAdmin, Assignor, Official, Evaluator]
    code: 200
    input: []
    output: Availability
    side_effects: []

  - method: POST
    path: "/availabilities/{id}/withdraw"
    description: "ACTIVE -> WITHDRAWN"
    roles: [Official, LeagueAdmin]
    code: 200
    input: []
    output: Availability
    side_effects: ["status -> WITHDRAWN"]

  # ---- ConflictDeclaration ----
  - method: POST
    path: "/conflict-declarations"
    description: "Declare a conflict of interest (team or peer official)"
    roles: [LeagueAdmin, Official]
    code: 201
    input: [official_id, scope, "team_name?", "peer_official_id?"]
    output: ConflictDeclaration
    side_effects: []

  - method: GET
    path: "/conflict-declarations/{id}"
    description: "Get a conflict declaration"
    roles: [LeagueAdmin, Assignor, Official]
    code: 200
    input: []
    output: ConflictDeclaration
    side_effects: []

  - method: GET
    path: "/conflict-declarations"
    description: "List/filter conflict declarations (by official_id or peer_official_id)"
    roles: [LeagueAdmin, Assignor, Official]
    code: 200
    input: ["official_id?", "peer_official_id?", "limit?", "offset?"]
    output: "ConflictDeclaration[]"
    side_effects: []

  # ---- Game ----
  - method: POST
    path: "/games"
    description: "Create a game in DRAFT"
    roles: [Assignor]
    code: 201
    input: [league_id, home_team, away_team, venue_lat, venue_lon, start_utc, required_crew_size, "duration_minutes?", "is_postseason?"]
    output: Game
    side_effects: ["Game created DRAFT"]

  - method: GET
    path: "/games"
    description: "List/filter games (by league_id)"
    roles: [LeagueAdmin, Assignor, Official, Evaluator]
    code: 200
    input: ["league_id?", "limit?", "offset?"]
    output: "Game[]"
    side_effects: []

  - method: GET
    path: "/games/{id}"
    description: "Get a game with computed counters"
    roles: [LeagueAdmin, Assignor, Official, Evaluator]
    code: 200
    input: []
    output: Game
    side_effects: []

  - method: POST
    path: "/games/{id}/crew-slots"
    description: "Provision a crew slot on a DRAFT game"
    roles: [Assignor]
    code: 201
    input: [position, "slot_fee_multiplier?"]
    output: CrewSlot
    side_effects: ["CrewSlot created VACANT"]

  - method: GET
    path: "/games/{id}/crew-slots"
    description: "Reverse-reachability: crew slots for a game"
    roles: [LeagueAdmin, Assignor, Official, Evaluator]
    code: 200
    input: ["limit?", "offset?"]
    output: "CrewSlot[]"
    side_effects: []

  - method: POST
    path: "/games/{id}/open"
    description: "DRAFT -> OPEN"
    roles: [Assignor]
    code: 200
    input: []
    output: Game
    side_effects: ["Game.status -> OPEN"]

  - method: POST
    path: "/games/{id}/lock"
    description: "STAFFED -> LOCKED"
    roles: [Assignor]
    code: 200
    input: ["expected_game_version"]
    output: Game
    side_effects: ["Game.status -> LOCKED; increments Game.version by 1"]

  - method: POST
    path: "/games/{id}/settle"
    description: "LOCKED -> COMPLETED; settle all FILLED assignments"
    roles: [Assignor]
    code: 200
    input: ["expected_game_version"]
    output: Game
    side_effects: ["each ACCEPTED Assignment -> COMPLETED, final_pay_cents computed; SeasonLedger accruals; increments Game.version by 1"]

  - method: POST
    path: "/games/{id}/cancel"
    description: "Cancel a game; cascade-release slots + cancel live assignments"
    roles: [Assignor]
    code: 200
    input: []
    output: Game
    side_effects: ["cascade: assignments -> CANCELLED, slots -> RELEASED; increments Game.version by 1"]

  # ---- CrewSlot / Assignment ----
  - method: GET
    path: "/crew-slots/{id}"
    description: "Get a crew slot"
    roles: [LeagueAdmin, Assignor, Official, Evaluator]
    code: 200
    input: []
    output: CrewSlot
    side_effects: []

  - method: GET
    path: "/crew-slots/{id}/assignments"
    description: "Reverse-reachability: assignments for a crew slot (history incl. terminal)"
    roles: [LeagueAdmin, Assignor, Official, Evaluator]
    code: 200
    input: ["limit?", "offset?"]
    output: "Assignment[]"
    side_effects: []

