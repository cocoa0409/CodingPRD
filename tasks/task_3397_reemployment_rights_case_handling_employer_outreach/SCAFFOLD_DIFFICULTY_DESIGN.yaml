# =============================================================================
# §1.8 Scaffold Difficulty Design (Test Targeting Index)
# Task: task_3397_reemployment_rights_case_handling_employer_outreach
# 19 instances across the nine §0.5 rules (rule 2 carries three: one per mode).
# Anchors &k_* are defined once below and reused across instances; every
# ${var} is bound by a captures: block earlier in the SAME instance.
# =============================================================================
scaffold_difficulty_design:

  - rule_id: dual_variant_calc
    instances:
      - name: notice_excuse_strict_vs_lenient_eligibility
        grounds:
          - calculations.notice_hours_advance
          - calculations.eligibility_determination
          - entities.EligibilityAnalysis.fields.variant
        distinguishing_aspect: |
          Same case, same service period, same inputs — only the analysis
          variant flips: STRICT ignores the excused-notice claim so
          notice_satisfied=false and overall_eligible=false, while LENIENT
          honors excuse_claimed+excuse_category so both become true. This is
          the statutory-interpretation domain (EligibilityAnalysis), distinct
          from the pension/benefits domain of the sibling instance.
        test_recipe:
          setup:
            - "Logical clock 2026-09-01T00:00:00Z. Employer, member, one completed 45-day service period (2026-03-01 to 2026-04-15) with notice given only 4 hours in advance; case claims excuse ORDERS_SHORT_FUSE and applied 2026-04-20."
          setup_api_calls:
            - &k_clock
              call: "POST /reemployment/_clock/set_current_utc"
              payload: { to_iso8601: "2026-09-01T00:00:00Z" }
              as: ProgramCoordinator
            - &k_emp
              call: "POST /reemployment/employers"
              payload: { legal_name: "Cascade Outfitters Inc", sector: "RETAIL", size_tier: "MEDIUM" }
              as: ProgramCoordinator
              captures: { emp_id: $.data.id }
            - &k_member
              call: "POST /reemployment/members"
              payload: { full_name: "Rae Torres", email: "rae@example.com", branch: "ARMY", component: "ARMY_RESERVE" }
              as: Anonymous
              captures: { mem_id: $.data.id }
            - call: "POST /reemployment/service-periods"
              payload: { member_id: "${mem_id}", employer_id: "${emp_id}", start_date: "2026-03-01T00:00:00Z", end_date: "2026-04-15T00:00:00Z", orders_type: "ACTIVE_DUTY", notice_given_at: "2026-02-28T20:00:00Z" }
              as: ServiceMember
              as_user_id: "${mem_id}"
            - &k_case
              call: "POST /reemployment/cases"
              payload: { member_id: "${mem_id}", employer_id: "${emp_id}", issue_type: "REEMPLOYMENT", description: "Refused reinstatement after 45-day activation", application_submitted_at: "2026-04-20T00:00:00Z", excuse_claimed: true, excuse_category: "ORDERS_SHORT_FUSE" }
              as: ServiceMember
              as_user_id: "${mem_id}"
              captures: { case_id: $.data.id, case_v: $.data.version }
          trigger:
            - call: "POST /reemployment/cases/${case_id}/eligibility-analysis"
              payload: { variant: "STRICT", expected_case_version: "${case_v}" }
              as: ProgramCoordinator
              captures: { ana_strict: $.data.overall_eligible }
            - call: "GET /reemployment/cases/${case_id}"
              payload: {}
              as: ProgramCoordinator
              captures: { case_v2: $.data.version }
            - call: "POST /reemployment/cases/${case_id}/eligibility-analysis"
              payload: { variant: "LENIENT", expected_case_version: "${case_v2}" }
              as: ProgramCoordinator
          assert:
            - "STRICT analysis: notice_hours_advance == 4, duration_band == MID, application_deadline_days == 14, application_deadline_date == 2026-04-29T00:00:00Z, deadline_satisfied == true, service_limit_ok == true"
            - "STRICT analysis: notice_satisfied == false and overall_eligible == false (ana_strict == false)"
            - "LENIENT analysis: notice_satisfied == true and overall_eligible == true, escalator_position_class == SENIORITY_ESCALATED"
            - "the two analyses have sequence_number 1 and 2 on GET /reemployment/cases/${case_id}/eligibility-analyses"

      - name: pension_credit_per_period_vs_aggregate_rounding
        grounds:
          - calculations.pension_accrual_credit
          - entities.BenefitAssessment.fields.pension_credit_months_official
          - entities.BenefitAssessment.fields.pension_credit_months_alternate
        distinguishing_aspect: |
          Identical three service periods (10, 20, 30 days) credit
          pension_credit_months_official == 1.98 under the pinned
          per-period-then-sum rounding but pension_credit_months_alternate
          == 1.97 under sum-then-round. Benefits/pension domain — a different
          entity domain from the eligibility-notice variant instance.
        test_recipe:
          setup:
            - "Logical clock 2026-09-01T00:00:00Z. Employer, member with three completed non-overlapping periods of 10, 20 and 30 days; case with issue_type BENEFITS."
          setup_api_calls:
            - *k_clock
            - *k_emp
            - &k_member2
              call: "POST /reemployment/members"
              payload: { full_name: "Sam Okafor", email: "sam@example.com", branch: "NAVY", component: "NAVY_RESERVE" }
              as: Anonymous
              captures: { mem2_id: $.data.id }
            - call: "POST /reemployment/service-periods"
              payload: { member_id: "${mem2_id}", employer_id: "${emp_id}", start_date: "2026-01-01T00:00:00Z", end_date: "2026-01-11T00:00:00Z", orders_type: "DRILL" }
              as: ServiceMember
              as_user_id: "${mem2_id}"
            - call: "POST /reemployment/service-periods"
              payload: { member_id: "${mem2_id}", employer_id: "${emp_id}", start_date: "2026-02-01T00:00:00Z", end_date: "2026-02-21T00:00:00Z", orders_type: "ANNUAL_TRAINING" }
              as: ServiceMember
              as_user_id: "${mem2_id}"
            - call: "POST /reemployment/service-periods"
              payload: { member_id: "${mem2_id}", employer_id: "${emp_id}", start_date: "2026-03-01T00:00:00Z", end_date: "2026-03-31T00:00:00Z", orders_type: "ACTIVE_DUTY" }
              as: ServiceMember
              as_user_id: "${mem2_id}"
            - call: "POST /reemployment/cases"
              payload: { member_id: "${mem2_id}", employer_id: "${emp_id}", issue_type: "BENEFITS", description: "Pension accrual and health continuation questions" }
              as: ServiceMember
              as_user_id: "${mem2_id}"
              captures: { case2_id: $.data.id }
          trigger:
            - call: "POST /reemployment/benefit-assessments"
              payload: { case_id: "${case2_id}" }
              as: ProgramCoordinator
          assert:
            - "BenefitAssessment.pension_credit_months_official == 1.98"
            - "BenefitAssessment.pension_credit_months_alternate == 1.97"
            - "pension_credit_months_official != pension_credit_months_alternate"
            - "health_continuation_months == 1.97 (60 days / 30.44, round_half_up 2dp, below the 24 cap)"
            - "education_required == true and education_satisfied == false (BENEFITS issue, no EMPLOYER_EDUCATION note yet)"

  - rule_id: combinatorial_formula
    instances:
      - name: eligibility_band_nested_thresholds
        grounds:
          - calculations.application_deadline_window
          - calculations.cumulative_chargeable_service_days
          - calculations.eligibility_determination
        distinguishing_aspect: |
          Mode (a): a >= 3-input nested interaction — duration-band selection
          (SHORT/MID/LONG) nested inside the 1825-day cap check nested with the
          notice check — yielding deadline 90 days and ESCALATED_WITH_RETRAINING
          for a 200-day period; the sibling instances are modes (b) and (c).
        test_recipe:
          setup:
            - "Logical clock 2026-09-01T00:00:00Z. Employer, member with one 200-day completed period (2026-01-01 to 2026-07-20), notice 288h in advance, application 2026-09-05."
          setup_api_calls:
            - *k_clock
            - *k_emp
            - call: "POST /reemployment/members"
              payload: { full_name: "Lee Park", email: "lee@example.com", branch: "AIR_FORCE", component: "AIR_GUARD" }
              as: Anonymous
              captures: { mem3_id: $.data.id }
            - call: "POST /reemployment/service-periods"
              payload: { member_id: "${mem3_id}", employer_id: "${emp_id}", start_date: "2026-01-01T00:00:00Z", end_date: "2026-07-20T00:00:00Z", orders_type: "ACTIVE_DUTY", notice_given_at: "2025-12-20T00:00:00Z" }
              as: ServiceMember
              as_user_id: "${mem3_id}"
            - call: "POST /reemployment/cases"
              payload: { member_id: "${mem3_id}", employer_id: "${emp_id}", issue_type: "REEMPLOYMENT", description: "Escalator position dispute after 200-day deployment", application_submitted_at: "2026-09-05T00:00:00Z" }
              as: ServiceMember
              as_user_id: "${mem3_id}"
              captures: { case3_id: $.data.id, case3_v: $.data.version }
          trigger:
            - call: "POST /reemployment/cases/${case3_id}/eligibility-analysis"
              payload: { variant: "STRICT", expected_case_version: "${case3_v}" }
              as: ProgramCoordinator
          assert:
            - "disputed_period_duration_days == 200 and duration_band == LONG"
            - "application_deadline_days == 90 and application_deadline_date == 2026-10-18T00:00:00Z"
            - "deadline_satisfied == true (2026-09-05 <= 2026-10-18)"
            - "notice_hours_advance == 288 and notice_satisfied == true"
            - "cumulative_chargeable_days == 200 and service_limit_ok == true"
            - "escalator_position_class == ESCALATED_WITH_RETRAINING and overall_eligible == true"

      - name: pension_rounding_order_pinned
        grounds:
          - calculations.pension_accrual_credit
        distinguishing_aspect: |
          Mode (b): nested rounding order is pinned — each period's days/30.44
          is rounded to 2dp half-up BEFORE summation; three 5-day periods give
          0.16+0.16+0.16 == 0.48 officially, while summing days first would
          give round(15/30.44, 2) == 0.49. The sibling instances are modes
          (a) and (c).
        test_recipe:
          setup:
            - "Logical clock 2026-09-01T00:00:00Z. Employer, member with three completed 5-day periods; case with issue_type PENSION."
          setup_api_calls:
            - *k_clock
            - *k_emp
            - call: "POST /reemployment/members"
              payload: { full_name: "Kit Reyes", email: "kit@example.com", branch: "MARINES", component: "MARINE_RESERVE" }
              as: Anonymous
              captures: { mem4_id: $.data.id }
            - call: "POST /reemployment/service-periods"
              payload: { member_id: "${mem4_id}", employer_id: "${emp_id}", start_date: "2026-01-01T00:00:00Z", end_date: "2026-01-06T00:00:00Z", orders_type: "DRILL" }
              as: ServiceMember
              as_user_id: "${mem4_id}"
            - call: "POST /reemployment/service-periods"
              payload: { member_id: "${mem4_id}", employer_id: "${emp_id}", start_date: "2026-02-01T00:00:00Z", end_date: "2026-02-06T00:00:00Z", orders_type: "DRILL" }
              as: ServiceMember
              as_user_id: "${mem4_id}"
            - call: "POST /reemployment/service-periods"
              payload: { member_id: "${mem4_id}", employer_id: "${emp_id}", start_date: "2026-03-01T00:00:00Z", end_date: "2026-03-06T00:00:00Z", orders_type: "DRILL" }
              as: ServiceMember
              as_user_id: "${mem4_id}"
            - call: "POST /reemployment/cases"
              payload: { member_id: "${mem4_id}", employer_id: "${emp_id}", issue_type: "PENSION", description: "Pension crediting dispute over drill weekends" }
              as: ServiceMember
              as_user_id: "${mem4_id}"
              captures: { case4_id: $.data.id }
          trigger:
            - call: "POST /reemployment/benefit-assessments"
              payload: { case_id: "${case4_id}" }
              as: ProgramCoordinator
          assert:
            - "BenefitAssessment.pension_credit_months_official == 0.48"
            - "BenefitAssessment.pension_credit_months_alternate == 0.49"
            - "official < alternate for this fixture, proving per-period rounding was applied before summation"

      - name: award_score_base_tier_then_bonus
        grounds:
          - calculations.employer_recognition_score
          - entities.RecognitionAward.fields.tier_qualified
          - state_machines.RecognitionAward.NOMINATED_to_VETTED
        distinguishing_aspect: |
          Mode (c): circular-looking dependency pinned by evaluation order —
          score_final = score_base + bonus(tier), where tier is keyed on
          score_base ALONE. With base 35 the tier is BRONZE and the +5 bonus
          lifts the final to 40, which would meet the SILVER gate (40) if the
          tier were recomputed from the final — it is not. Sibling instances
          are modes (a) and (b).
        test_recipe:
          setup:
            - "Logical clock 2026-09-01T00:00:00Z. Employer with exactly 2 RESOLVED_INFORMAL cases, 1 SIGNED statement of support, 0 open cases; award nominated at tier BRONZE by the coordinator."
          setup_api_calls:
            - *k_clock
            - &k_emp5
              call: "POST /reemployment/employers"
              payload: { legal_name: "Meridian Grocers Co-op", sector: "RETAIL", size_tier: "LARGE" }
              as: ProgramCoordinator
              captures: { emp5_id: $.data.id }
            - &k_omb5
              call: "POST /reemployment/ombudsmen"
              payload: { full_name: "Ada Weiss", email: "ada@example.com" }
              as: Anonymous
              captures: { omb5_id: $.data.id }
            - &k_tr5a
              call: "POST /reemployment/training-records"
              payload: { ombudsman_id: "${omb5_id}", module_code: "CORE_LAW", hours: 8, exam_score: 90, completed_on: "2026-08-01T00:00:00Z" }
              as: ProgramCoordinator
              as_user_id: "pc-admin"
            - &k_tr5b
              call: "POST /reemployment/training-records"
              payload: { ombudsman_id: "${omb5_id}", module_code: "MEDIATION_SKILLS", hours: 8, exam_score: 88, completed_on: "2026-08-05T00:00:00Z" }
              as: ProgramCoordinator
              as_user_id: "pc-admin"
            - &k_tr5c
              call: "POST /reemployment/training-records"
              payload: { ombudsman_id: "${omb5_id}", module_code: "DOCUMENTATION", hours: 6, exam_score: 95, completed_on: "2026-08-10T00:00:00Z" }
              as: ProgramCoordinator
              as_user_id: "pc-admin"
            - &k_certify5
              call: "POST /reemployment/ombudsmen/${omb5_id}/state"
              payload: { to_status: "CERTIFIED" }
              as: ProgramCoordinator
              as_user_id: "pc-lead"
            - &k_stmt5
              call: "POST /reemployment/statements-of-support"
              payload: { employer_id: "${emp5_id}", signer_name: "J. Ho", signer_title: "CEO" }
              as: ProgramCoordinator
              captures: { stmt5_id: $.data.id }
            - &k_stmt5_sign
              call: "POST /reemployment/statements-of-support/${stmt5_id}/state"
              payload: { to_status: "SIGNED" }
              as: ProgramCoordinator
            - &k_m5a
              call: "POST /reemployment/members"
              payload: { full_name: "Pat Quinn", email: "pat@example.com", branch: "ARMY", component: "ARMY_GUARD" }
              as: Anonymous
              captures: { m5a_id: $.data.id }
            - &k_c5a
              call: "POST /reemployment/cases"
              payload: { member_id: "${m5a_id}", employer_id: "${emp5_id}", issue_type: "REEMPLOYMENT", description: "Not reinstated after AT", application_submitted_at: "2026-08-20T00:00:00Z" }
              as: ServiceMember
              as_user_id: "${m5a_id}"
              captures: { c5a_id: $.data.id }
            - &k_c5a_triage
              call: "POST /reemployment/cases/${c5a_id}/state"
              payload: { to_status: "TRIAGE" }
              as: ProgramCoordinator
              captures: { c5a_v: $.data.version }
            - &k_c5a_assign
              call: "POST /reemployment/cases/${c5a_id}/assign"
              payload: { ombudsman_id: "${omb5_id}", expected_case_version: "${c5a_v}" }
              as: ProgramCoordinator
            - &k_c5a_n1
              call: "POST /reemployment/case-notes"
              payload: { case_id: "${c5a_id}", note_type: "INTAKE", body: "Intake interview completed." }
              as: ProgramCoordinator
            - &k_c5a_r1
              call: "POST /reemployment/mediation-rounds"
              payload: { case_id: "${c5a_id}", proposal_text: "Reinstate at prior role with back pay.", addressed_to: "EMPLOYER" }
              as: Ombudsman
              as_user_id: "${omb5_id}"
              captures: { c5a_r1: $.data.id }
            - &k_c5a_n2
              call: "POST /reemployment/case-notes"
              payload: { case_id: "${c5a_id}", note_type: "CONTACT", body: "Employer contact documented for round 1." }
              as: ProgramCoordinator
            - &k_c5a_n3
              call: "POST /reemployment/case-notes"
              payload: { case_id: "${c5a_id}", note_type: "RESOLUTION", body: "Terms memorialized." }
              as: ProgramCoordinator
            - &k_c5a_accept
              call: "POST /reemployment/mediation-rounds/${c5a_r1}/respond"
              payload: { response: "ACCEPT" }
              as: Employer
              as_user_id: "${emp5_id}"
            - call: "POST /reemployment/members"
              payload: { full_name: "Jo Silva", email: "jo@example.com", branch: "COAST_GUARD", component: "NAVY_RESERVE" }
              as: Anonymous
              captures: { m5b_id: $.data.id }
            - call: "POST /reemployment/cases"
              payload: { member_id: "${m5b_id}", employer_id: "${emp5_id}", issue_type: "REEMPLOYMENT", description: "Demoted on return", application_submitted_at: "2026-08-25T00:00:00Z" }
              as: ServiceMember
              as_user_id: "${m5b_id}"
              captures: { c5b_id: $.data.id }
            - call: "POST /reemployment/cases/${c5b_id}/state"
              payload: { to_status: "TRIAGE" }
              as: ProgramCoordinator
              captures: { c5b_v: $.data.version }
            - call: "POST /reemployment/cases/${c5b_id}/assign"
              payload: { ombudsman_id: "${omb5_id}", expected_case_version: "${c5b_v}" }
              as: ProgramCoordinator
            - call: "POST /reemployment/case-notes"
              payload: { case_id: "${c5b_id}", note_type: "INTAKE", body: "Intake completed." }
              as: ProgramCoordinator
            - call: "POST /reemployment/mediation-rounds"
              payload: { case_id: "${c5b_id}", proposal_text: "Restore seniority-based schedule.", addressed_to: "EMPLOYER" }
              as: Ombudsman
              as_user_id: "${omb5_id}"
              captures: { c5b_r1: $.data.id }
            - call: "POST /reemployment/case-notes"
              payload: { case_id: "${c5b_id}", note_type: "CONTACT", body: "Round 1 employer contact." }
              as: ProgramCoordinator
            - call: "POST /reemployment/case-notes"
              payload: { case_id: "${c5b_id}", note_type: "RESOLUTION", body: "Resolution documented." }
              as: ProgramCoordinator
            - call: "POST /reemployment/mediation-rounds/${c5b_r1}/respond"
              payload: { response: "ACCEPT" }
              as: Employer
              as_user_id: "${emp5_id}"
            - call: "POST /reemployment/recognition-awards"
              payload: { employer_id: "${emp5_id}", tier: "BRONZE", rationale: "Two clean informal resolutions and a signed statement." }
              as: ProgramCoordinator
              captures: { aw5_id: $.data.id }
          trigger:
            - call: "POST /reemployment/recognition-awards/${aw5_id}/state"
              payload: { to_status: "VETTED" }
              as: ProgramCoordinator
          assert:
            - "RecognitionAward.${aw5_id}.score_base == 35 (2 resolved * 10 + 15 signed - 0 open * 10)"
            - "RecognitionAward.${aw5_id}.tier_qualified == BRONZE (35 >= 20, < 40)"
            - "RecognitionAward.${aw5_id}.score_bonus == 5"
            - "RecognitionAward.${aw5_id}.score_final == 40"
            - "tier_qualified stays BRONZE even though score_final 40 >= SILVER gate 40 — the tier is keyed on score_base alone"

  - rule_id: non_linear_state_machine
    instances:
      - name: case_reopen_cycle_and_mediation_loop
        grounds:
          - state_machines.ReemploymentCase.AWAITING_RESPONSE_to_IN_MEDIATION
          - state_machines.ReemploymentCase.IN_MEDIATION_to_AWAITING_RESPONSE
          - state_machines.ReemploymentCase.CLOSED_UNRESOLVED_to_TRIAGE
        distinguishing_aspect: |
          ReemploymentCase's machine is cyclic on TWO edges — the
          AWAITING_RESPONSE -> IN_MEDIATION negotiation loop (taken twice) and
          the CLOSED_UNRESOLVED -> TRIAGE member reopen — whereas the sibling
          instance exercises cyclic edges on a different entity (Ombudsman).
        test_recipe:
          setup:
            - "Logical clock 2026-09-01T00:00:00Z. Certified ombudsman; member with a case against the employer; one mediation round declined twice."
          setup_api_calls:
            - *k_clock
            - *k_emp
            - &k_omb_std
              call: "POST /reemployment/ombudsmen"
              payload: { full_name: "Ada Weiss", email: "ada@example.com" }
              as: Anonymous
              captures: { omb_id: $.data.id }
            - &k_tra
              call: "POST /reemployment/training-records"
              payload: { ombudsman_id: "${omb_id}", module_code: "CORE_LAW", hours: 8, exam_score: 90, completed_on: "2026-08-01T00:00:00Z" }
              as: ProgramCoordinator
              as_user_id: "pc-admin"
            - &k_trb
              call: "POST /reemployment/training-records"
              payload: { ombudsman_id: "${omb_id}", module_code: "MEDIATION_SKILLS", hours: 8, exam_score: 88, completed_on: "2026-08-05T00:00:00Z" }
              as: ProgramCoordinator
              as_user_id: "pc-admin"
            - &k_trc
              call: "POST /reemployment/training-records"
              payload: { ombudsman_id: "${omb_id}", module_code: "DOCUMENTATION", hours: 6, exam_score: 95, completed_on: "2026-08-10T00:00:00Z" }
              as: ProgramCoordinator
              as_user_id: "pc-admin"
            - &k_cert
              call: "POST /reemployment/ombudsmen/${omb_id}/state"
              payload: { to_status: "CERTIFIED" }
              as: ProgramCoordinator
              as_user_id: "pc-lead"
            - *k_member
            - *k_case
            - call: "POST /reemployment/cases/${case_id}/state"
              payload: { to_status: "TRIAGE" }
              as: ProgramCoordinator
              captures: { case_vt: $.data.version }
            - call: "POST /reemployment/cases/${case_id}/assign"
              payload: { ombudsman_id: "${omb_id}", expected_case_version: "${case_vt}" }
              as: ProgramCoordinator
            - call: "POST /reemployment/mediation-rounds"
              payload: { case_id: "${case_id}", proposal_text: "Reinstate with back pay.", addressed_to: "EMPLOYER" }
              as: Ombudsman
              as_user_id: "${omb_id}"
              captures: { r1_id: $.data.id }
            - call: "POST /reemployment/mediation-rounds/${r1_id}/respond"
              payload: { response: "DECLINE" }
              as: Employer
              as_user_id: "${emp_id}"
            - call: "POST /reemployment/mediation-rounds"
              payload: { case_id: "${case_id}", proposal_text: "Reinstate without back pay.", addressed_to: "EMPLOYER" }
              as: Ombudsman
              as_user_id: "${omb_id}"
              captures: { r2_id: $.data.id }
            - call: "POST /reemployment/mediation-rounds/${r2_id}/respond"
              payload: { response: "DECLINE" }
              as: Employer
              as_user_id: "${emp_id}"
            - call: "POST /reemployment/cases/${case_id}/state"
              payload: { to_status: "CLOSED_UNRESOLVED", reason: "Mediation exhausted informally" }
              as: Ombudsman
              as_user_id: "${omb_id}"
            - call: "POST /reemployment/_clock/set_current_utc"
              payload: { to_iso8601: "2026-10-01T00:00:00Z" }
              as: ProgramCoordinator
          trigger:
            - call: "POST /reemployment/cases/${case_id}/state"
              payload: { to_status: "TRIAGE" }
              as: ServiceMember
              as_user_id: "${mem_id}"
          assert:
            - "MediationRound.${r1_id}.status == DECLINED and MediationRound.${r2_id}.status == DECLINED"
            - "after each DECLINE the case returned to IN_MEDIATION (loop edge taken twice)"
            - "the ombudsman close moved the case to CLOSED_UNRESOLVED and cleared assigned_ombudsman_id"
            - "30 days later the member reopen succeeds: ReemploymentCase.${case_id}.status == TRIAGE"
            - "ReemploymentCase.${case_id}.assigned_ombudsman_id is null and open_round_count == 0 after reopen"

      - name: ombudsman_leave_and_recertify_cycles
        grounds:
          - state_machines.Ombudsman.CERTIFIED_to_ON_LEAVE
          - state_machines.Ombudsman.ON_LEAVE_to_CERTIFIED
          - state_machines.Ombudsman.CERTIFIED_to_EXPIRED
          - state_machines.Ombudsman.EXPIRED_to_CERTIFIED
          - calculations.lazy_expiry
        distinguishing_aspect: |
          Ombudsman's machine is cyclic on CERTIFIED <-> ON_LEAVE and on
          EXPIRED -> CERTIFIED (recertification), with a lazy clock-driven
          CERTIFIED -> EXPIRED edge — a different entity from the Case machine
          of the sibling instance.
        test_recipe:
          setup:
            - "Logical clock 2026-09-01T00:00:00Z. Ombudsman with three core training records proctored by pc-admin, certified by pc-lead."
          setup_api_calls:
            - *k_clock
            - *k_omb_std
            - *k_tra
            - *k_trb
            - *k_trc
            - call: "POST /reemployment/ombudsmen/${omb_id}/state"
              payload: { to_status: "CERTIFIED" }
              as: ProgramCoordinator
              as_user_id: "pc-lead"
              captures: { exp1: $.data.certification_expires_on }
            - call: "POST /reemployment/ombudsmen/${omb_id}/state"
              payload: { to_status: "ON_LEAVE" }
              as: ProgramCoordinator
            - call: "POST /reemployment/ombudsmen/${omb_id}/state"
              payload: { to_status: "CERTIFIED" }
              as: ProgramCoordinator
            - call: "POST /reemployment/_clock/set_current_utc"
              payload: { to_iso8601: "2028-09-01T00:00:00Z" }
              as: ProgramCoordinator
            - call: "GET /reemployment/ombudsmen/${omb_id}"
              payload: {}
              as: ProgramCoordinator
              captures: { st_at_expiry: $.data.status }
            - call: "POST /reemployment/_clock/set_current_utc"
              payload: { to_iso8601: "2028-10-01T00:00:00Z" }
              as: ProgramCoordinator
            - call: "GET /reemployment/ombudsmen/${omb_id}"
              payload: {}
              as: ProgramCoordinator
              captures: { st_after_expiry: $.data.status }
            - call: "POST /reemployment/training-records"
              payload: { ombudsman_id: "${omb_id}", module_code: "ELECTIVE", hours: 8, exam_score: 70, completed_on: "2028-09-15T00:00:00Z" }
              as: ProgramCoordinator
              as_user_id: "pc-admin"
          trigger:
            - call: "POST /reemployment/ombudsmen/${omb_id}/state"
              payload: { to_status: "CERTIFIED" }
              as: ProgramCoordinator
              as_user_id: "pc-lead"
          assert:
            - "first certify: certified_on == 2026-09-01T00:00:00Z and exp1 == 2028-09-01T00:00:00Z"
            - "CERTIFIED -> ON_LEAVE -> CERTIFIED succeeds while unexpired"
            - "at the clock exactly equal to expires_on (2028-09-01T00:00:00Z) st_at_expiry == CERTIFIED (strictly-greater comparison)"
            - "at 2028-10-01 the lazy expiry flipped status: st_after_expiry == EXPIRED"
            - "recertification with an 8-hour record completed within the trailing 24 months succeeds: status CERTIFIED, certified_on == 2028-10-01T00:00:00Z, certification_expires_on == 2030-10-01T00:00:00Z"

  - rule_id: transitive_cascade
    instances:
      - name: decertify_reverts_cases_rounds_notes
        grounds:
          - state_machines.Ombudsman.CERTIFIED_to_DECERTIFIED
          - state_machines.MediationRound.PROPOSED_to_CLOSED_MOOT
          - entities.CaseNote.fields.note_type
        distinguishing_aspect: |
          Depth-3 cascade from the decertify trigger: decertifying the
          ombudsman reverts two assigned cases to TRIAGE (link 1); each
          reverted case's PROPOSED round flips to CLOSED_MOOT (link 2); each
          mooted round appends a system AUDIT CaseNote (link 3). Different
          trigger and greater depth than the referral cascade instance.
        test_recipe:
          setup:
            - "Logical clock 2026-09-01T00:00:00Z. Certified ombudsman with two assigned cases: case A AWAITING_RESPONSE with a PROPOSED round and one INTAKE note; case B ASSIGNED with no rounds."
          setup_api_calls:
            - *k_clock
            - *k_emp
            - *k_omb_std
            - *k_tra
            - *k_trb
            - *k_trc
            - *k_cert
            - *k_member
            - *k_case
            - call: "POST /reemployment/cases/${case_id}/state"
              payload: { to_status: "TRIAGE" }
              as: ProgramCoordinator
              captures: { case_vt: $.data.version }
            - call: "POST /reemployment/cases/${case_id}/assign"
              payload: { ombudsman_id: "${omb_id}", expected_case_version: "${case_vt}" }
              as: ProgramCoordinator
            - call: "POST /reemployment/case-notes"
              payload: { case_id: "${case_id}", note_type: "INTAKE", body: "Intake done." }
              as: ProgramCoordinator
            - call: "POST /reemployment/mediation-rounds"
              payload: { case_id: "${case_id}", proposal_text: "Reinstate promptly.", addressed_to: "EMPLOYER" }
              as: Ombudsman
              as_user_id: "${omb_id}"
              captures: { rd1_id: $.data.id }
            - call: "POST /reemployment/members"
              payload: { full_name: "Jo Silva", email: "jo@example.com", branch: "NAVY", component: "NAVY_RESERVE" }
              as: Anonymous
              captures: { memb_id: $.data.id }
            - call: "POST /reemployment/cases"
              payload: { member_id: "${memb_id}", employer_id: "${emp_id}", issue_type: "BENEFITS", description: "Health coverage dropped during service" }
              as: ServiceMember
              as_user_id: "${memb_id}"
              captures: { caseb_id: $.data.id }
            - call: "POST /reemployment/cases/${caseb_id}/state"
              payload: { to_status: "TRIAGE" }
              as: ProgramCoordinator
              captures: { caseb_v: $.data.version }
            - call: "POST /reemployment/cases/${caseb_id}/assign"
              payload: { ombudsman_id: "${omb_id}", expected_case_version: "${caseb_v}" }
              as: ProgramCoordinator
          trigger:
            - call: "POST /reemployment/ombudsmen/${omb_id}/state"
              payload: { to_status: "DECERTIFIED", reason: "Ethics violation" }
              as: ProgramCoordinator
              as_user_id: "pc-lead"
          assert:
            - "Ombudsman.${omb_id}.status == DECERTIFIED and active_caseload == 0"
            - "ReemploymentCase.${case_id}.status == TRIAGE with assigned_ombudsman_id null (link 1)"
            - "ReemploymentCase.${caseb_id}.status == TRIAGE with assigned_ombudsman_id null (link 1)"
            - "MediationRound.${rd1_id}.status == CLOSED_MOOT (link 2, caused by the case revert)"
            - "GET /reemployment/cases/${case_id}/notes returns exactly 2 notes: the manual INTAKE plus one system note with note_type == AUDIT (link 3, caused by the round closing)"

      - name: referral_submit_refers_case_and_moots_round
        grounds:
          - state_machines.Referral.DRAFT_to_SUBMITTED
          - state_machines.ReemploymentCase.ESCALATION_PENDING_to_REFERRED
          - state_machines.MediationRound.PROPOSED_to_CLOSED_MOOT
        distinguishing_aspect: |
          Depth-2 cascade from the referral-submission trigger: SUBMITTED
          flips the case ESCALATION_PENDING -> REFERRED (link 1); the case
          transition moots the still-PROPOSED round to CLOSED_MOOT and
          appends an AUDIT note (link 2). Different trigger and shallower
          depth than the decertify cascade instance.
        test_recipe:
          setup:
            - "Logical clock 2026-09-01T00:00:00Z. Certified ombudsman assigned; case escalated after one DECLINED round while a second round is still PROPOSED; a DRAFT referral exists."
          setup_api_calls:
            - *k_clock
            - *k_emp
            - *k_omb_std
            - *k_tra
            - *k_trb
            - *k_trc
            - *k_cert
            - *k_member
            - *k_case
            - call: "POST /reemployment/cases/${case_id}/state"
              payload: { to_status: "TRIAGE" }
              as: ProgramCoordinator
              captures: { case_vt: $.data.version }
            - call: "POST /reemployment/cases/${case_id}/assign"
              payload: { ombudsman_id: "${omb_id}", expected_case_version: "${case_vt}" }
              as: ProgramCoordinator
            - call: "POST /reemployment/mediation-rounds"
              payload: { case_id: "${case_id}", proposal_text: "Reinstate with back pay.", addressed_to: "EMPLOYER" }
              as: Ombudsman
              as_user_id: "${omb_id}"
              captures: { rr1_id: $.data.id }
            - call: "POST /reemployment/mediation-rounds/${rr1_id}/respond"
              payload: { response: "DECLINE" }
              as: Employer
              as_user_id: "${emp_id}"
            - call: "POST /reemployment/mediation-rounds"
              payload: { case_id: "${case_id}", proposal_text: "Reinstate, seniority intact.", addressed_to: "EMPLOYER" }
              as: Ombudsman
              as_user_id: "${omb_id}"
              captures: { rr2_id: $.data.id }
            - call: "POST /reemployment/cases/${case_id}/state"
              payload: { to_status: "ESCALATION_PENDING", reason: "Employer stonewalling" }
              as: Ombudsman
              as_user_id: "${omb_id}"
            - call: "POST /reemployment/referrals"
              payload: { case_id: "${case_id}", agency: "DOL_VETS", summary: "Informal resolution failed; statutory violation alleged." }
              as: Ombudsman
              as_user_id: "${omb_id}"
              captures: { ref_id: $.data.id }
          trigger:
            - call: "POST /reemployment/referrals/${ref_id}/state"
              payload: { to_status: "SUBMITTED" }
              as: ProgramCoordinator
          assert:
            - "Referral.${ref_id}.status == SUBMITTED and submitted_at == 2026-09-01T00:00:00Z"
            - "ReemploymentCase.${case_id}.status == REFERRED (link 1, caused by the submission)"
            - "MediationRound.${rr2_id}.status == CLOSED_MOOT (link 2, caused by the case transition)"
            - "an AUDIT CaseNote was appended to the case for the mooted round"
            - "Ombudsman.${omb_id}.active_caseload == 0 after the cascade"

  - rule_id: priority_pair_validation_conflict
    instances:
      - name: respond_closed_round_with_passed_deadline_state_wins
        grounds:
          - validations[priority=6]
          - validations[priority=9]
          - errors.ERR_ROUND_NOT_OPEN
          - errors.ERR_RESPONSE_DEADLINE_PASSED
        distinguishing_aspect: |
          Category pair state vs business_temporal: the round is already
          COUNTERED (terminal) AND the clock is past its response_deadline —
          the state-tier error ERR_ROUND_NOT_OPEN (priority 6) must win over
          the temporal-tier ERR_RESPONSE_DEADLINE_PASSED (priority 9), and no
          side effects fire. Different category pair than the sibling.
        test_recipe:
          setup:
            - "Logical clock 2026-09-01T00:00:00Z. Certified ombudsman, assigned case, round created 2026-09-01 (deadline 2026-09-15T00:00:00Z), employer COUNTERs, then clock advances to 2026-09-20."
