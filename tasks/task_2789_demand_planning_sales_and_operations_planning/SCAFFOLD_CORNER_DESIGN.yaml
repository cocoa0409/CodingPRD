              captures: { v_supply: $.data.version }
            - call: "POST /sop/supply-plans"
              payload: { cycle_id: "${cycle_id}", item_id: "${item_id}" }
              as: SupplyPlanner
              as_user_id: "supply-1"
            - call: "POST /sop/planning-cycles/${cycle_id}/transitions"
              payload: { target_status: "SCENARIO_REVIEW" }
              as: SopAdmin
              captures: { v_scenario: $.data.version }
            - call: "POST /sop/scenarios"
              payload: { cycle_id: "${cycle_id}", scenario_type: "CAPACITY_INVESTMENT", name: "Buy 5 hours", target_item_id: "${item_id}", added_capacity_hours: 5 }
              as: SupplyPlanner
              as_user_id: "supply-1"
              captures: { sc_id: $.data.id }
            - call: "POST /sop/scenarios/${sc_id}/evaluate"
              payload: {}
              as: SupplyPlanner
              as_user_id: "supply-1"
            - call: "POST /sop/planning-cycles/${cycle_id}/transitions"
              payload: { target_status: "EXECUTIVE_REVIEW" }
              as: SopAdmin
              captures: { v_exec: $.data.version }
          trigger:
            - call: "POST /sop/scenarios/${sc_id}/select"
              payload: { expected_cycle_version: "${v_scenario}" }
              as: ExecutiveSponsor
              as_user_id: "exec-1"
              captures: { err: $.data.error_id }
            - call: "POST /sop/scenarios/${sc_id}/select"
              payload: { expected_cycle_version: "${v_exec}" }
              as: ExecutiveSponsor
              as_user_id: "exec-1"
              captures: { sc_status: $.data.status }
          assert:
            - "${v_exec} == ${v_scenario} + 1 — the SCENARIO_REVIEW -> EXECUTIVE_REVIEW transition is the only cycle write between the two captures, even though a scenario was created and evaluated in between"
            - "${v_supply} > ${v_create} and ${v_scenario} > ${v_supply} — every transition advances the version monotonically"
            - "The one-behind select returns 412 with ${err} == \"ERR_STALE_CYCLE_VERSION\", not 409 and not the forecast-scoped ERR_STALE_FORECAST_VERSION"
            - "The refused select leaves PlanningCycle.${cycle_id}.selected_closure_cents == 0, residual_gap_cents == 1100000 and version == ${v_exec}"
            - "The retry with ${v_exec} returns 200 with ${sc_status} == \"SELECTED\", selected_closure_cents == 287800 and residual_gap_cents == 812200"

      - name: revision_round_and_reopen_count_are_independent_threshold_counters
        claim_type: rate_threshold_triggers
        grounds:
          - validations[priority=160]
          - entities.PlanningCycle.fields.reopen_count
          - entities.ConsensusAdjustment.fields.revision_round
          - state_machines.PlanningCycle.EXECUTIVE_REVIEW_to_DEMAND_REVIEW
        distinguishing_aspect: |
          The two cumulative counters live on different entities and must not be conflated:
          exhausting MAX_REVISION_ROUNDS on one adjustment consumes none of the cycle's two
          reopens, a reopen does NOT reset the exhausted adjustment's revision_round, and a fresh
          adjustment created after the reopen starts again at revision_round 0. Sharing one
          counter, or resetting revision_round on reopen, breaks at least one of these.
        test_recipe:
          setup:
            - "The base family, one MATURE item and one customer; a cycle over 2026-09..2026-09 (commitment 0) in DEMAND_REVIEW with one 1000-unit forecast."
            - "One SALES_INTELLIGENCE adjustment is driven through three REQUEST_REVISION / resubmit rounds to revision_round 3, then REJECTED so the cycle can advance."
          setup_api_calls:
            - call: "POST /sop/product-families"
              payload: { family_code: "FAM-BASE", name: "Base Family", accountable_planner_user_id: "planner-1", units_per_hour: 100, max_monthly_hours: 800 }
              as: SopAdmin
              captures: { fam_id: $.data.id }
            - call: "POST /sop/items"
              payload: { sku: "SKU-BASE", family_id: "${fam_id}", unit_price_cents: 1000, unit_cost_cents: 400, on_hand_units: 0, material_supply_cap_units: 100000, avg_monthly_demand_units: 1000, lifecycle_state: "MATURE" }
              as: SopAdmin
              captures: { item_id: $.data.id }
            - call: "POST /sop/customers"
              payload: { customer_code: "CUST-BASE", name: "Base Grocery", channel: "GROCERY", priority_rank: 3 }
              as: SopAdmin
              captures: { cust_id: $.data.id }
            - call: "POST /sop/planning-cycles"
              payload: { cycle_code: "CY-COUNTERS", horizon_start_month: "2026-09", horizon_end_month: "2026-09", financial_commitment_cents: 0, supply_review_policy: "NET_INVENTORY_FIRST" }
              as: SopAdmin
              captures: { cycle_id: $.data.id }
            - call: "POST /sop/demand-forecasts"
              payload: { cycle_id: "${cycle_id}", item_id: "${item_id}", customer_id: "${cust_id}", month: "2026-09", level_units: 1000, trend_units_per_month: 0, seasonal_index: 1.0, causal_uplift_pct: 0 }
              as: DemandPlanner
              as_user_id: "planner-1"
              captures: { fc_id: $.data.id, fc_v0: $.data.version }
            - call: "POST /sop/consensus-adjustments"
              payload: { demand_forecast_id: "${fc_id}", adjustment_type: "SALES_INTELLIGENCE", delta_units: 100, rationale: "round zero", expected_demand_forecast_version: "${fc_v0}" }
              as: DemandPlanner
              as_user_id: "planner-1"
              captures: { adj_id: $.data.id }
            - call: "POST /sop/consensus-adjustments/${adj_id}/reviews"
              payload: { decision: "REQUEST_REVISION", review_note: "again" }
              as: DemandReviewLead
              as_user_id: "lead-1"
            - call: "GET /sop/demand-forecasts/${fc_id}"
              payload: {}
              as: DemandPlanner
              as_user_id: "planner-1"
              captures: { fc_va: $.data.version }
            - call: "POST /sop/consensus-adjustments/${adj_id}/resubmit"
              payload: { rationale: "round one", expected_demand_forecast_version: "${fc_va}" }
              as: DemandPlanner
              as_user_id: "planner-1"
            - call: "POST /sop/consensus-adjustments/${adj_id}/reviews"
              payload: { decision: "REQUEST_REVISION", review_note: "again" }
              as: DemandReviewLead
              as_user_id: "lead-1"
            - call: "GET /sop/demand-forecasts/${fc_id}"
              payload: {}
              as: DemandPlanner
              as_user_id: "planner-1"
              captures: { fc_vb: $.data.version }
            - call: "POST /sop/consensus-adjustments/${adj_id}/resubmit"
              payload: { rationale: "round two", expected_demand_forecast_version: "${fc_vb}" }
              as: DemandPlanner
              as_user_id: "planner-1"
            - call: "POST /sop/consensus-adjustments/${adj_id}/reviews"
              payload: { decision: "REQUEST_REVISION", review_note: "again" }
              as: DemandReviewLead
              as_user_id: "lead-1"
            - call: "GET /sop/demand-forecasts/${fc_id}"
              payload: {}
              as: DemandPlanner
              as_user_id: "planner-1"
              captures: { fc_vc: $.data.version }
            - call: "POST /sop/consensus-adjustments/${adj_id}/resubmit"
              payload: { rationale: "round three", expected_demand_forecast_version: "${fc_vc}" }
              as: DemandPlanner
              as_user_id: "planner-1"
              captures: { round_3: $.data.revision_round }
            - call: "POST /sop/consensus-adjustments/${adj_id}/reviews"
              payload: { decision: "REJECT", review_note: "never substantiated" }
              as: DemandReviewLead
              as_user_id: "lead-1"
              captures: { adj_status: $.data.status }
            - call: "POST /sop/planning-cycles/${cycle_id}/transitions"
              payload: { target_status: "SUPPLY_REVIEW" }
              as: SopAdmin
            - call: "POST /sop/planning-cycles/${cycle_id}/transitions"
              payload: { target_status: "SCENARIO_REVIEW" }
              as: SopAdmin
            - call: "POST /sop/planning-cycles/${cycle_id}/transitions"
              payload: { target_status: "EXECUTIVE_REVIEW" }
              as: SopAdmin
          trigger:
            - call: "POST /sop/planning-cycles/${cycle_id}/transitions"
              payload: { target_status: "DEMAND_REVIEW", reopen_reason: "sales wants another pass" }
              as: ExecutiveSponsor
              as_user_id: "exec-1"
              captures: { reopen_count: $.data.reopen_count }
            - call: "GET /sop/consensus-adjustments/${adj_id}"
              payload: {}
              as: DemandPlanner
              as_user_id: "planner-1"
              captures: { round_after: $.data.revision_round, status_after: $.data.status }
            - call: "GET /sop/demand-forecasts/${fc_id}"
              payload: {}
              as: DemandPlanner
              as_user_id: "planner-1"
              captures: { fc_vd: $.data.version, fc_status: $.data.status }
            - call: "POST /sop/consensus-adjustments"
              payload: { demand_forecast_id: "${fc_id}", adjustment_type: "SALES_INTELLIGENCE", delta_units: 50, rationale: "fresh proposal after the reopen", expected_demand_forecast_version: "${fc_vd}" }
              as: DemandPlanner
              as_user_id: "planner-1"
              captures: { new_round: $.data.revision_round, new_status: $.data.status }
          assert:
            - "${round_3} == 3 and ${adj_status} == \"REJECTED\" — the adjustment reached the MAX_REVISION_ROUNDS ceiling before being rejected"
            - "${reopen_count} == 1 — three exhausted revision rounds consumed NO reopen budget, so the cycle still has one reopen left of MAX_REOPENS 2"
            - "${round_after} == 3 and ${status_after} == \"REJECTED\" — the reopen did not reset the counter or revive the terminal adjustment"
            - "${fc_status} == \"UNDER_CONSENSUS\" — the reopen unlocked the forecast, which is why a fresh adjustment is admissible"
            - "${new_round} == 0 and ${new_status} == \"PROPOSED\" — revision_round is per-adjustment, so the new row starts at zero and has its own three rounds available"
            - "GET /sop/consensus-adjustments?demand_forecast_id=${fc_id} returns total_count == 2 — the REJECTED row is retained alongside the new PROPOSED row"

      - name: item_runout_cascade_reaches_promotions_adjustments_and_consensus
        claim_type: cascading_side_effects
        grounds:
          - state_machines.Item.MATURE_to_RUNOUT
          - state_machines.DemandForecast.CONSENSUS_LOCKED_to_RUNOUT_TRUNCATED
        excluded_because:
          difficulty_instance: "transitive_cascade / item_runout_cascades_to_promotion_then_adjustment_then_consensus"
          rationale: |
            That difficulty instance already walks the full three-level chain end to end — item
            lifecycle to promotion voiding to adjustment voiding to recomputed consensus_units and
            the cycle's money — asserting each level's rows individually, so a corner instance
            could only re-verify a prefix of the same cascade.

      - name: supply_review_policy_switch_changes_constrained_units
        claim_type: dual_variant_calculation
        grounds:
          - calculations.calc_constrained_supply.variants
          - entities.PlanningCycle.fields.supply_review_policy
        excluded_because:
          difficulty_instance: "dual_variant_calc / supply_constraint_net_inventory_first_vs_gross_capacity_first"
          rationale: |
            The named difficulty instance runs both variants over one identical fixture and
            asserts the divergence in demand_side_units, constrained_units, shortfall_units and
            constraint_type, including the INVENTORY_TARGET to CAPACITY flip; a corner instance
            would restate the same two-variant comparison.

  - section: consistency_model
    instances:
      - name: endorse_response_and_the_immediate_forecast_read_agree_on_consensus_units
        claim_type: immediate
        grounds:
          - complexity_profile.consistency_model
          - calculations.calc_consensus_units
          - state_machines.ConsensusAdjustment.PROPOSED_to_ENDORSED
        distinguishing_aspect: |
          The declared model is immediate, so the endorsement's own 200 response already carries
          the derived applied_delta_units 80 for a promotion-driven adjustment, and the very next
          read of the parent forecast shows consensus_units 1080 with no intervening write and no
          re-read delay. Nothing here is allowed to lag until the cycle advance.
        test_recipe:
          setup:
            - "The base family, one MATURE item and one customer; an APPROVED promotion for 2026-09 with lift_pct 10 and cannibalization_pct 2 (approved at the default logical clock 2026-08-01T00:00:00Z)."
            - "A cycle over 2026-09..2026-09 (commitment 0) in DEMAND_REVIEW with one BASELINE forecast of 1000 units."
          setup_api_calls:
            - call: "POST /sop/product-families"
              payload: { family_code: "FAM-BASE", name: "Base Family", accountable_planner_user_id: "planner-1", units_per_hour: 100, max_monthly_hours: 800 }
              as: SopAdmin
              captures: { fam_id: $.data.id }
