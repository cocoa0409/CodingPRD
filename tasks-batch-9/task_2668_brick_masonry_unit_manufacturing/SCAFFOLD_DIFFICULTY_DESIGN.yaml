            - "${status_3} == REVISION_REQUESTED and ${status_resub} == SUBMITTED, proving the machine returns to a state it already occupied"
            - "${err} == ERR_PANEL_REVISION_LIMIT with HTTP 409"
            - "The panel remains in SUBMITTED with revision_round still 3 - the rejected request mutated nothing"
            - "The panel is still approvable: it never left the cycle in a dead state"

