# =============================================================================
# Task 1856: Renewable Fuel Standard & RIN Compliance Reporting
# Obligated-party RFS desk: blending records & RIN generation/separation,
# RVO obligation calculation, RIN purchase/retirement & position tracking,
# EPA reporting deadlines & attest engagement, invalid-RIN risk & vendor due
# diligence, state low-carbon program overlay, price volatility exposure,
# recordkeeping retention.
# =============================================================================

scenario: |
  1856. Renewable Fuel Standard & RIN Compliance Reporting (obligated party RFS desk):
  gallon blending records & RIN generation/separation, obligation calculation by
  renewable volume obligation, RIN purchase/retirement & position tracking, EPA
  reporting deadlines & attest engagement, invalid-RIN risk & vendor due diligence,
  state low-carbon program overlay, price volatility exposure, recordkeeping retention

domain_name: rfs-rin-compliance
api_prefix: /rfs

# =============================================================================
# Step 0: Complexity Profile
# =============================================================================
complexity_profile:
  primary_archetype: compliance_audit        # regulatory deadlines, attest, segregation of duties, retention
  secondary_archetype: ledger_reconciliation # RIN lot conservation + escrow ledger vs obligation ledger
  complexity_layers:
    - dual_variant_calculation    # provisional vs final RVO; default-CI vs measured-CI state credits
    - cascading_side_effects      # vendor revocation -> trade invalidation -> lot invalidation -> year recompute -> report reflag
    - rate_threshold_triggers     # 20% carryover cap, verification window, retention cutoff, RIN vintage expiry
    - optimistic_concurrency      # OCC on ObligationYear.version for report create-with-supersede

  entity_topology: flat            # peer entities joined by foreign keys; no nested URL ownership
  state_machine_shape: branching   # plus cycles on ComplianceReport / AttestEngagement and parallel dims on RINTrade

  relationship_patterns:
    - one_to_many       # account -> lots/trades/reports; year -> batches/reports/engagements
    - cross_aggregate   # trades reference vendors; lots reference trades; reports reference years + engagements

  role_model: segregation_of_duties  # trade creator cannot verify; report preparer cannot attest

  consistency_model: immediate       # all mutations + cascades atomic in the triggering request

  # Difficulty calibration: Expert band (12 entities, ~50 endpoints incl. reads,
  # 22 error codes, 8 state machines, 9 calculation rules). The scenario's eight
  # regulatory facets genuinely require the breadth; density comes from the
  # invalidation cascade and nested-obligation accounting, not entity count.

# =============================================================================
# Table 1.1: Entity-Relationship Table
# =============================================================================
entities:
  - name: ComplianceAccount
    parent: null
    common_fields: true
    fields:
      - { name: company_name, type: string, source: input, description: "Obligated party legal name" }
      - { name: epa_registration_id, type: string, source: input, description: "EPA-issued company registration identifier; unique across accounts" }
      - { name: escrow_reserved_cents, type: integer, source: computed, description: "Funds reserved by open RIN purchases: sum of total_price_cents over RINTrade with payment_status UNPAID and transfer_status PENDING", default: 0 }
      - { name: spent_cents, type: integer, source: computed, description: "Cumulative realized purchase spend: sum of total_price_cents over trades that reached payment_status PAID", default: 0 }

  - name: ObligationYear
    parent: null
    common_fields: true
    fields:
      - { name: account_id, type: string, source: input, description: "FK -> ComplianceAccount.id; owning obligated party" }
      - { name: year, type: integer, source: input, description: "Compliance year (e.g. 2026); unique per account" }
      - { name: projected_volume_gal, type: integer, source: input, description: "Projected non-renewable gasoline+diesel volume in gallons (> 0)" }
      - { name: actual_volume_gal, type: integer, source: input, description: "Actual non-renewable volume in gallons; set by close-volume; null until VOLUME_CLOSED" , default: null }
      - { name: std_cellulosic_pct, type: number, source: input, description: "EPA standard percentage for CELLULOSIC (e.g. 10.0 means 10%)" }
      - { name: std_biomass_diesel_pct, type: number, source: input, description: "EPA standard percentage for BIOMASS_DIESEL" }
      - { name: std_advanced_pct, type: number, source: input, description: "EPA standard percentage for ADVANCED" }
      - { name: std_total_pct, type: number, source: input, description: "EPA standard percentage for TOTAL_RENEWABLE" }
      - { name: status, type: enum, source: system, description: "OPEN | VOLUME_CLOSED | FINALIZED", default: OPEN }
      - { name: provisional_rvo_cellulosic_rins, type: integer, source: computed, description: "round_half_up(projected_volume_gal * std_cellulosic_pct / 100) at creation" }
      - { name: provisional_rvo_biomass_diesel_rins, type: integer, source: computed, description: "round_half_up(projected_volume_gal * std_biomass_diesel_pct / 100) at creation" }
      - { name: provisional_rvo_advanced_rins, type: integer, source: computed, description: "round_half_up(projected_volume_gal * std_advanced_pct / 100) at creation" }
      - { name: provisional_rvo_total_rins, type: integer, source: computed, description: "round_half_up(projected_volume_gal * std_total_pct / 100) at creation" }
      - { name: final_rvo_cellulosic_rins, type: integer, source: computed, description: "round_half_up(actual_volume_gal * std_cellulosic_pct / 100); null until VOLUME_CLOSED", default: null }
      - { name: final_rvo_biomass_diesel_rins, type: integer, source: computed, description: "null until VOLUME_CLOSED", default: null }
      - { name: final_rvo_advanced_rins, type: integer, source: computed, description: "null until VOLUME_CLOSED", default: null }
      - { name: final_rvo_total_rins, type: integer, source: computed, description: "null until VOLUME_CLOSED", default: null }
      - { name: retired_cellulosic_rins, type: integer, source: computed, description: "RINs retired toward CELLULOSIC by ACCEPTED batches (nested: D3 lots only)", default: 0 }
      - { name: retired_biomass_diesel_rins, type: integer, source: computed, description: "ACCEPTED retirements of D3 or D4 lots", default: 0 }
      - { name: retired_advanced_rins, type: integer, source: computed, description: "ACCEPTED retirements of D3, D4, or D5 lots", default: 0 }
      - { name: retired_total_rins, type: integer, source: computed, description: "ACCEPTED retirements of any D-code", default: 0 }
      - { name: retired_prior_cellulosic_rins, type: integer, source: computed, description: "Portion of retired_cellulosic_rins drawn from vintage_year == year-1 lots (carryover cap accounting)", default: 0 }
      - { name: retired_prior_biomass_diesel_rins, type: integer, source: computed, description: "Prior-vintage portion toward BIOMASS_DIESEL", default: 0 }
      - { name: retired_prior_advanced_rins, type: integer, source: computed, description: "Prior-vintage portion toward ADVANCED", default: 0 }
      - { name: retired_prior_total_rins, type: integer, source: computed, description: "Prior-vintage portion toward TOTAL_RENEWABLE", default: 0 }
      - { name: compliance_posture, type: enum, source: computed, description: "ON_TRACK | SHORTFALL | SATISFIED; see calculation posture_derivation" }

  - name: Vendor
    parent: null
    common_fields: true
    fields:
      - { name: account_id, type: string, source: input, description: "FK -> ComplianceAccount.id; desk that onboarded this counterparty" }
      - { name: vendor_name, type: string, source: input, description: "RIN seller name" }
      - { name: qap_audited, type: boolean, source: input, description: "Whether the seller's RINs are covered by a Quality Assurance Program audit" }
      - { name: diligence_status, type: enum, source: system, description: "UNVETTED | APPROVED | REJECTED | REVOKED", default: UNVETTED }
      - { name: last_diligence_at, type: datetime, source: system, description: "Logical-clock timestamp of most recent diligence decision; null until first diligence", default: null }

  - name: RINLot
    parent: null
    common_fields: true
    fields:
      - { name: account_id, type: string, source: input, description: "FK -> ComplianceAccount.id; owner of the lot" }
      - { name: origin, type: enum, source: system, description: "GENERATED (created via POST /rfs/rin-lots) | PURCHASED (created by trade delivery)" }
      - { name: vendor_id, type: string, source: system, description: "FK -> Vendor.id; set on PURCHASED lots from the delivering trade, null on GENERATED", default: null }
      - { name: trade_id, type: string, source: system, description: "FK -> RINTrade.id; set on PURCHASED lots, null on GENERATED", default: null }
      - { name: d_code, type: enum, source: input, description: "D3 (cellulosic) | D4 (biomass-based diesel) | D5 (advanced) | D6 (conventional renewable)" }
      - { name: vintage_year, type: integer, source: input, description: "RIN vintage (calendar year of generation); on PURCHASED lots copied from the trade" }
      - { name: gallon_qty, type: integer, source: input, description: "Wet gallons of renewable fuel; on PURCHASED lots 0 (RINs bought already separated)" }
      - { name: equivalence_value, type: number, source: input, description: "RINs per gallon (e.g. 1.0 ethanol, 1.5 biodiesel); on PURCHASED lots 1.0", default: 1.0 }
      - { name: rin_qty, type: integer, source: computed, description: "round_half_up(gallon_qty * equivalence_value) for GENERATED; equals trade rin_qty for PURCHASED" }
      - { name: attached_qty, type: integer, source: computed, description: "RINs still attached to wet gallons (only GENERATED lots); separated_qty + attached_qty accounts for unretired generated RINs" }
      - { name: separated_qty, type: integer, source: computed, description: "RINs separated from gallons and trade/retirement-eligible" }
      - { name: pending_retired_qty, type: integer, source: computed, description: "RINs allocated to SUBMITTED (not yet decided) retirement batches", default: 0 }
      - { name: retired_qty, type: integer, source: computed, description: "RINs retired by ACCEPTED batches", default: 0 }
      - { name: invalidated_qty, type: integer, source: computed, description: "RINs invalidated (EPA-invalid or vendor revocation cascade)", default: 0 }
      - { name: expired_qty, type: integer, source: computed, description: "RINs expired by vintage sweep", default: 0 }
      - { name: available_qty, type: integer, source: computed, description: "Retirement-eligible: rin_qty - attached_qty - pending_retired_qty - retired_qty - invalidated_qty - expired_qty" }
      - { name: unit_cost_cents, type: integer, source: computed, description: "Cost basis per RIN: trade price_per_rin_cents for PURCHASED, 0 for GENERATED" }
      - { name: status, type: enum, source: system, description: "ACTIVE | EXHAUSTED | EXPIRED | INVALIDATED", default: ACTIVE }
      - { name: retention_until, type: datetime, source: computed, description: "created_at + 1825 days (5-year recordkeeping retention)" }

  - name: BlendingRecord
    parent: null
    common_fields: false   # immutable event log: id + created_at only
    fields:
      - { name: account_id, type: string, source: system, description: "FK -> ComplianceAccount.id; copied from the separated lot" }
      - { name: rin_lot_id, type: string, source: system, description: "FK -> RINLot.id; the GENERATED lot whose gallons were blended (path parameter)" }
      - { name: blended_gallons, type: integer, source: input, description: "Gallons of renewable fuel blended into motor fuel (> 0); separates that many RINs" }
      - { name: blended_at, type: datetime, source: system, description: "Logical-clock timestamp at record creation" }
      - { name: retention_until, type: datetime, source: computed, description: "created_at + 1825 days (5-year recordkeeping retention)" }

  - name: RINTrade
    parent: null
    common_fields: true
    fields:
      - { name: account_id, type: string, source: input, description: "FK -> ComplianceAccount.id; buying desk" }
      - { name: vendor_id, type: string, source: input, description: "FK -> Vendor.id; selling counterparty" }
      - { name: d_code, type: enum, source: input, description: "D3 | D4 | D5 | D6" }
      - { name: vintage_year, type: integer, source: input, description: "RIN vintage purchased" }
      - { name: rin_qty, type: integer, source: input, description: "Number of RINs purchased (> 0)" }
      - { name: price_per_rin_cents, type: integer, source: input, description: "Agreed price per RIN in cents (> 0)" }
      - { name: total_price_cents, type: integer, source: computed, description: "rin_qty * price_per_rin_cents (both integers; no rounding)" }
      - { name: payment_status, type: enum, source: system, description: "UNPAID | PAID | REFUNDED", default: UNPAID }
      - { name: transfer_status, type: enum, source: system, description: "PENDING | DELIVERED | VERIFIED | INVALIDATED | CANCELLED", default: PENDING }
      - { name: created_by_user_id, type: string, source: system, description: "X-User-ID of the Trader who created the trade (segregation-of-duties anchor)" }
      - { name: delivered_at, type: datetime, source: system, description: "Logical-clock timestamp of delivery; null until delivered", default: null }
      - { name: verified_by_user_id, type: string, source: system, description: "X-User-ID of verifying ComplianceManager; null until verified", default: null }
      - { name: retention_until, type: datetime, source: computed, description: "created_at + 1825 days" }

  - name: RetirementBatch
    parent: null
    common_fields: true
    fields:
      - { name: obligation_year_id, type: string, source: input, description: "FK -> ObligationYear.id" }
      - { name: category, type: enum, source: input, description: "CELLULOSIC | BIOMASS_DIESEL | ADVANCED | TOTAL_RENEWABLE" }
      - { name: d_code, type: enum, source: input, description: "D3 | D4 | D5 | D6; must be eligible for category (see calculation nested_retirement_accounting)" }
      - { name: rin_qty, type: integer, source: input, description: "RINs to retire toward the category (> 0)" }
      - { name: allocations, type: array, source: system, description: "FIFO lot draw computed at submit: array of {rin_lot_id, qty} ordered by lot created_at ASC then rin_qty ASC; empty while DRAFT", default: [] }
      - { name: prior_vintage_qty, type: integer, source: computed, description: "Portion of allocations drawn from lots with vintage_year == ObligationYear.year - 1; 0 while DRAFT", default: 0 }
      - { name: status, type: enum, source: system, description: "DRAFT | SUBMITTED | ACCEPTED | REJECTED", default: DRAFT }
      - { name: submitted_at, type: datetime, source: system, description: "Logical-clock timestamp of submit; null until SUBMITTED", default: null }

  - name: ComplianceReport
    parent: null
    common_fields: true
    fields:
      - { name: obligation_year_id, type: string, source: input, description: "FK -> ObligationYear.id" }
      - { name: report_type, type: enum, source: input, description: "QUARTERLY | ANNUAL" }
      - { name: quarter_end_date, type: datetime, source: input, description: "Required for QUARTERLY: last day of the reported quarter; forbidden for ANNUAL", default: null }
      - { name: due_date, type: datetime, source: computed, description: "QUARTERLY: quarter_end_date + 60 days. ANNUAL: (year+1)-03-31T23:59:59Z" }
      - { name: status, type: enum, source: system, description: "DRAFT | SUBMITTED | ACCEPTED | REJECTED | SUPERSEDED", default: DRAFT }
      - { name: created_by_user_id, type: string, source: system, description: "X-User-ID of the ComplianceManager who created the report (segregation-of-duties anchor)" }
      - { name: submitted_at, type: datetime, source: system, description: "Logical-clock timestamp of submit; null until SUBMITTED", default: null }
      - { name: is_late, type: boolean, source: computed, description: "submitted_at > due_date (evaluated at submit)", default: false }
      - { name: amendment_required, type: boolean, source: computed, description: "Set true when the invalid-RIN cascade mutates year retirement counters under an ACCEPTED report", default: false }
      - { name: retention_until, type: datetime, source: computed, description: "created_at + 1825 days" }

  - name: AttestEngagement
    parent: null
    common_fields: true
    fields:
      - { name: obligation_year_id, type: string, source: input, description: "FK -> ObligationYear.id; the compliance year under attest" }
      - { name: auditor_user_id, type: string, source: input, description: "Opaque user id of the engaged Auditor-role user; attest action endpoints require X-User-ID to equal this value" }
      - { name: fieldwork_start, type: datetime, source: input, description: "Planned fieldwork window start (inclusive)" }
      - { name: fieldwork_end, type: datetime, source: input, description: "Planned fieldwork window end (exclusive); must be > fieldwork_start" }
      - { name: status, type: enum, source: system, description: "ENGAGED | FIELDWORK | FINDINGS_ISSUED | REMEDIATION | CLOSED_CLEAN", default: ENGAGED }
      - { name: findings, type: enum, source: input, description: "CLEAN | ADVERSE; set by issue-findings, null until issued", default: null }

  - name: StateProgram
    parent: null
    common_fields: true
    fields:
      - { name: account_id, type: string, source: input, description: "FK -> ComplianceAccount.id" }
      - { name: state_code, type: string, source: input, description: "Two-letter state code (e.g. CA); unique per account" }
      - { name: program_type, type: enum, source: input, description: "LCFS (low-carbon fuel standard style credit program)" }
      - { name: ci_standard_gco2e_mj, type: number, source: input, description: "State carbon-intensity standard (gCO2e/MJ)" }
      - { name: default_ci_gco2e_mj, type: number, source: input, description: "Default pathway CI used for provisional credits" }
      - { name: total_credits_tons, type: number, source: computed, description: "Sum of credits_tons over this program's reports (4 decimal places)", default: 0 }

  - name: StateCreditReport
    parent: null
    common_fields: true
    fields:
      - { name: state_program_id, type: string, source: input, description: "FK -> StateProgram.id" }
      - { name: period_label, type: string, source: input, description: "Reporting period label (e.g. 2026-Q3); unique per program" }
      - { name: fuel_gallons, type: integer, source: input, description: "Low-carbon fuel gallons dispensed in the period (> 0)" }
      - { name: status, type: enum, source: system, description: "PROVISIONAL | VERIFIED", default: PROVISIONAL }
      - { name: measured_ci_gco2e_mj, type: number, source: input, description: "Measured CI used at verification; null until VERIFIED", default: null }
      - { name: credits_tons, type: number, source: computed, description: "state_credit_generation; provisional uses program default_ci, verified uses measured_ci (4 dp round_half_up)" }
      - { name: verified_at, type: datetime, source: system, description: "Logical-clock timestamp of verification; null until VERIFIED", default: null }

  - name: PriceQuote
    parent: null
    common_fields: true
    fields:
      - { name: account_id, type: string, source: input, description: "FK -> ComplianceAccount.id; desk recording the observed market quote" }
      - { name: d_code, type: enum, source: input, description: "D3 | D4 | D5 | D6" }
      - { name: vintage_year, type: integer, source: input, description: "RIN vintage the quote applies to" }
      - { name: price_cents, type: integer, source: input, description: "Observed market price per RIN in cents (> 0)" }
      - { name: effective_start, type: datetime, source: input, description: "Effective window start (inclusive)" }
      - { name: effective_end, type: datetime, source: input, description: "Effective window end (inclusive); must be >= effective_start; CLOSED-interval semantics" }
      - { name: retention_until, type: datetime, source: computed, description: "created_at + 1825 days" }

# =============================================================================
# Table 1.2: State Machine Table
# =============================================================================
state_machines:
  - entity: ObligationYear
    field: status
    initial_state: OPEN
    terminal_states: [FINALIZED]
    transitions:
      - from: OPEN
        to: VOLUME_CLOSED
        trigger: "POST /rfs/obligation-years/{id}/close-volume"
        actor: ComplianceManager
        preconditions:
          - "actual_volume_gal > 0 (ERR_INVALID_REQUEST)"
        side_effects:
          - "final_rvo_*_rins computed from actual_volume_gal (calculation rvo_obligation, final variant)"
          - "compliance_posture re-derived against final RVOs (calculation posture_derivation)"
          - "increments ObligationYear.version by 1"

      - from: VOLUME_CLOSED
        to: FINALIZED
        trigger: "POST /rfs/obligation-years/{id}/finalize"
        actor: ComplianceManager
        preconditions:
          - "An ANNUAL ComplianceReport for this year with status ACCEPTED exists (ERR_YEAR_NOT_FINALIZABLE)"
          - "An AttestEngagement for this year with status CLOSED_CLEAN exists (ERR_YEAR_NOT_FINALIZABLE)"
        side_effects:
          - "status -> FINALIZED; no further retirement batches or reports may be created for the year"
          - "increments ObligationYear.version by 1"

  - entity: ObligationYear
    field: compliance_posture
    derivation: |
      Derived, never directly set (calculation posture_derivation):
      1) SATISFIED when retired_X_rins >= active_rvo_X_rins for ALL four categories
         (active = final_* when status != OPEN, else provisional_*).
      2) SHORTFALL when not satisfied AND logical clock > retirement deadline
         (year+1)-03-31T23:59:59Z.
      3) Otherwise ON_TRACK.
      Re-derived after every retirement decide, lot invalidation, volume close,
      and clock advance.

  - entity: Vendor
    field: diligence_status
    initial_state: UNVETTED
    terminal_states: [REVOKED]
    transitions:
      - from: UNVETTED
        to: APPROVED
        trigger: "POST /rfs/vendors/{id}/diligence (outcome=APPROVED)"
        actor: ComplianceManager
        preconditions: []
        side_effects:
          - "last_diligence_at := current logical clock"

      - from: UNVETTED
        to: REJECTED
        trigger: "POST /rfs/vendors/{id}/diligence (outcome=REJECTED)"
        actor: ComplianceManager
        preconditions: []
        side_effects:
          - "last_diligence_at := current logical clock"

      - from: REJECTED
        to: APPROVED
        trigger: "POST /rfs/vendors/{id}/diligence (outcome=APPROVED)"
        actor: ComplianceManager
        preconditions: []
        side_effects:
          - "last_diligence_at := current logical clock"

      - from: APPROVED
        to: REVOKED
        trigger: "POST /rfs/vendors/{id}/diligence (outcome=REVOKED)"
        actor: ComplianceManager
        preconditions: []
        side_effects:
          - "CASCADE link 1: every RINTrade of this vendor with transfer_status DELIVERED or VERIFIED -> INVALIDATED (per-trade invalidation side effects fire, i.e. cascade continues per RINTrade -> RINLot -> ObligationYear -> ComplianceReport as declared on those transitions)"
          - "last_diligence_at := current logical clock"

  - entity: RINLot
    field: status
    initial_state: ACTIVE
    terminal_states: [EXHAUSTED, EXPIRED, INVALIDATED]
    transitions:
      - from: ACTIVE
        to: EXHAUSTED
        trigger: "system (a retirement decide=ACCEPT debits the lot's remaining available_qty to 0)"
        actor: system
        preconditions:
          - "available_qty == 0 after the debit"
        side_effects:
          - "Lot no longer eligible for separation, trade-verification gating, or FIFO allocation"

      - from: ACTIVE
        to: EXPIRED
        trigger: "system (POST /_clock/set_current_utc advances clock past (vintage_year+2)-03-31T23:59:59Z)"
        actor: system
        preconditions:
          - "current_utc > (vintage_year+2)-03-31T23:59:59Z"
        side_effects:
          - "expired_qty := rin_qty - retired_qty - invalidated_qty (all remaining RINs expire: available + pending + attached)"
          - "attached_qty := 0; separated_qty := 0; pending_retired_qty := 0; available_qty := 0"
          - "Pending allocations on expired lots are NOT released into retirement; their batches fail decide with ERR_INSUFFICIENT_RINS"

      - from: ACTIVE
        to: INVALIDATED
        trigger: "POST /rfs/rin-trades/{id}/invalidate on the source trade, or system via vendor REVOKED cascade"
        actor: "ComplianceManager or system"
        preconditions: []
        side_effects:
          - "invalidated_qty := rin_qty - retired_qty - expired_qty (all remaining RINs invalidated: available + pending + attached)"
          - "attached_qty := 0; separated_qty := 0; pending_retired_qty := 0; available_qty := 0"
          - "Pending allocations are released from their batches (those batches stay SUBMITTED and will fail decide with ERR_INSUFFICIENT_RINS)"
          - "CASCADE: ObligationYear retired_* counters re-derived excluding invalidated lots (calculation nested_retirement_accounting reversal); compliance_posture re-derived; ACCEPTED ComplianceReports for that year -> REJECTED with amendment_required = true"

  - entity: RINTrade
    field: payment_status
    initial_state: UNPAID
    terminal_states: [REFUNDED]
    transitions:
      - from: UNPAID
        to: PAID
        trigger: "POST /rfs/rin-trades/{id}/pay"
        actor: Trader
        preconditions:
          - "transfer_status == PENDING (ERR_INVALID_STATE)"
        side_effects:
          - "ComplianceAccount.escrow_reserved_cents -= total_price_cents; spent_cents += total_price_cents"

      - from: PAID
        to: REFUNDED
        trigger: "POST /rfs/rin-trades/{id}/cancel (while still PENDING delivery)"
        actor: Trader
        preconditions: []
        side_effects:
          - "ComplianceAccount.spent_cents -= total_price_cents"

      - from: UNPAID
        to: UNPAID
        trigger: "POST /rfs/rin-trades/{id}/cancel (escrow release; payment_status unchanged)"
        actor: Trader
        preconditions: []
        side_effects:
          - "ComplianceAccount.escrow_reserved_cents -= total_price_cents (compensating invariant escrow_conservation)"

  - entity: RINTrade
    field: transfer_status
    initial_state: PENDING
    terminal_states: [VERIFIED, INVALIDATED, CANCELLED]
    transitions:
      - from: PENDING
        to: DELIVERED
        trigger: "POST /rfs/rin-trades/{id}/deliver"
        actor: Trader
        preconditions:
          - "payment_status == PAID (ERR_INVALID_STATE)"
        side_effects:
          - "Creates RINLot: origin PURCHASED, account/vendor/trade FKs copied, d_code and vintage_year copied, gallon_qty 0, rin_qty = trade rin_qty, attached_qty 0, separated_qty = rin_qty, unit_cost_cents = price_per_rin_cents, status ACTIVE"
          - "delivered_at := current logical clock"

      - from: DELIVERED
        to: VERIFIED
        trigger: "POST /rfs/rin-trades/{id}/verify"
        actor: ComplianceManager
        preconditions:
          - "X-User-ID != created_by_user_id (ERR_SEGREGATION_OF_DUTIES)"
          - "Vendor.diligence_status == APPROVED (ERR_VENDOR_NOT_APPROVED)"
          - "current_utc <= delivered_at + 30 days (ERR_VERIFICATION_WINDOW_EXPIRED)"
        side_effects:
          - "verified_by_user_id := X-User-ID"
          - "The PURCHASED RINLot becomes retirement-eligible"

      - from: DELIVERED
        to: INVALIDATED
        trigger: "POST /rfs/rin-trades/{id}/invalidate, or system via vendor REVOKED cascade"
        actor: "ComplianceManager or system"
        preconditions: []
        side_effects:
          - "The PURCHASED RINLot -> INVALIDATED (its invalidation cascade to ObligationYear and ComplianceReport fires)"

      - from: VERIFIED
        to: INVALIDATED
        trigger: "POST /rfs/rin-trades/{id}/invalidate, or system via vendor REVOKED cascade"
        actor: "ComplianceManager or system"
        preconditions: []
        side_effects:
          - "The PURCHASED RINLot -> INVALIDATED (including retired_qty clawback: ObligationYear retired_* counters re-derived; ACCEPTED reports -> REJECTED with amendment_required = true)"

      - from: PENDING
        to: CANCELLED
        trigger: "POST /rfs/rin-trades/{id}/cancel"
        actor: Trader
        preconditions: []
        side_effects:
          - "Escrow release / refund per payment_status dimension (compensating invariant escrow_conservation)"

  - entity: RetirementBatch
    field: status
    initial_state: DRAFT
    terminal_states: [ACCEPTED, REJECTED]
    transitions:
      - from: DRAFT
        to: SUBMITTED
        trigger: "POST /rfs/retirement-batches/{id}/submit"
        actor: ComplianceManager
        preconditions:
          - "ObligationYear.status == OPEN or VOLUME_CLOSED (ERR_INVALID_STATE if FINALIZED)"
          - "current_utc <= (year+1)-03-31T23:59:59Z (ERR_DEADLINE_PASSED)"
          - "FIFO-eligible lots (calculation retirement_fifo_allocation) sum to >= rin_qty (ERR_INSUFFICIENT_RINS)"
          - "Carryover cap (calculation carryover_cap_check): prior_vintage_qty + retired_prior_<category>_rins <= round_half_up(0.20 * active_rvo_<category>) (ERR_CARRYOVER_CAP_EXCEEDED)"
        side_effects:
          - "allocations computed by FIFO (created_at ASC, rin_qty ASC tie-break); prior_vintage_qty computed"
          - "Each allocated RINLot: separated_qty -= qty, pending_retired_qty += qty"
          - "submitted_at := current logical clock"

      - from: SUBMITTED
        to: ACCEPTED
        trigger: "POST /rfs/retirement-batches/{id}/decide (decision=ACCEPT)"
        actor: OpsAdmin
        preconditions:
          - "Every allocated lot still ACTIVE with pending_retired_qty covering its allocation (ERR_INSUFFICIENT_RINS if a lot expired or was invalidated while SUBMITTED)"
        side_effects:
          - "CASCADE link 1: each allocated RINLot pending_retired_qty -= qty, retired_qty += qty; a lot whose available_qty reaches 0 -> EXHAUSTED"
          - "CASCADE link 2: ObligationYear retired_* and retired_prior_* counters re-derived (calculation nested_retirement_accounting); compliance_posture re-derived (may flip to SATISFIED)"

      - from: SUBMITTED
        to: REJECTED
        trigger: "POST /rfs/retirement-batches/{id}/decide (decision=REJECT)"
        actor: OpsAdmin
        preconditions: []
        side_effects:
          - "Each allocated RINLot pending_retired_qty -= qty, separated_qty += qty (compensating invariant lot_rin_conservation restored)"

  - entity: ComplianceReport
    field: status
    initial_state: DRAFT
    terminal_states: [SUPERSEDED]
    transitions:
      - from: DRAFT
        to: SUBMITTED
        trigger: "POST /rfs/compliance-reports/{id}/submit"
        actor: ComplianceManager
        preconditions:
          - "Segregation: no AttestEngagement on this ObligationYear has auditor_user_id == X-User-ID (ERR_SEGREGATION_OF_DUTIES)"
          - "ANNUAL only: an AttestEngagement for this year with status CLOSED_CLEAN exists (ERR_ATTEST_NOT_CLEAN)"
          - "ObligationYear.status != FINALIZED (ERR_INVALID_STATE)"
        side_effects:
          - "submitted_at := current logical clock; is_late := submitted_at > due_date"

      - from: SUBMITTED
        to: ACCEPTED
        trigger: "POST /rfs/compliance-reports/{id}/decide (decision=ACCEPT)"
        actor: OpsAdmin
        preconditions: []
        side_effects: []

      - from: SUBMITTED
        to: REJECTED
        trigger: "POST /rfs/compliance-reports/{id}/decide (decision=REJECT)"
        actor: OpsAdmin
        preconditions: []
        side_effects: []

      - from: ACCEPTED
        to: REJECTED
        trigger: "system (invalid-RIN cascade: an allocated lot was invalidated, mutating the year's retired_* counters)"
        actor: system
        preconditions: []
        side_effects:
          - "amendment_required := true"

      - from: REJECTED
        to: DRAFT
        trigger: "POST /rfs/compliance-reports/{id}/reopen"
        actor: ComplianceManager
        preconditions: []
        side_effects:
          - "submitted_at := null; is_late := false"

      - from: ACCEPTED
        to: DRAFT
        trigger: "POST /rfs/compliance-reports/{id}/reopen (voluntary amendment)"
        actor: ComplianceManager
        preconditions: []
        side_effects:
          - "amendment_required := false; submitted_at := null; is_late := false"

      - from: DRAFT
        to: SUPERSEDED
        trigger: "system (a new ComplianceReport for the same ObligationYear and report_type is created via POST /rfs/compliance-reports)"
        actor: system
        preconditions: []
        side_effects:
          - "Only DRAFT reports are superseded; SUBMITTED/ACCEPTED/REJECTED reports block creation of a same-type report (ERR_INVALID_STATE)"

  - entity: AttestEngagement
    field: status
    initial_state: ENGAGED
    terminal_states: [CLOSED_CLEAN]
    transitions:
      - from: ENGAGED
        to: FIELDWORK
        trigger: "POST /rfs/attest-engagements/{id}/begin-fieldwork"
        actor: Auditor
        preconditions:
          - "X-User-ID == auditor_user_id (ERR_FORBIDDEN)"
        side_effects: []

      - from: FIELDWORK
        to: FINDINGS_ISSUED
        trigger: "POST /rfs/attest-engagements/{id}/issue-findings"
        actor: Auditor
        preconditions:
          - "X-User-ID == auditor_user_id (ERR_FORBIDDEN)"
          - "findings input is CLEAN or ADVERSE (ERR_INVALID_REQUEST)"
        side_effects: []

      - from: FINDINGS_ISSUED
        to: REMEDIATION
        trigger: "POST /rfs/attest-engagements/{id}/remediate"
        actor: ComplianceManager
        preconditions:
          - "findings == ADVERSE (ERR_INVALID_STATE when findings == CLEAN; use close)"
        side_effects: []

      - from: REMEDIATION
        to: FIELDWORK
        trigger: "POST /rfs/attest-engagements/{id}/begin-fieldwork (re-examination loop)"
        actor: Auditor
        preconditions:
          - "X-User-ID == auditor_user_id (ERR_FORBIDDEN)"
        side_effects: []

      - from: FINDINGS_ISSUED
        to: CLOSED_CLEAN
        trigger: "POST /rfs/attest-engagements/{id}/close"
        actor: Auditor
        preconditions:
          - "X-User-ID == auditor_user_id (ERR_FORBIDDEN)"
          - "findings == CLEAN (ERR_INVALID_STATE when findings == ADVERSE; remediate first)"
        side_effects:
          - "Enables ANNUAL ComplianceReport submission for the ObligationYear"

  - entity: StateCreditReport
    field: status
    initial_state: PROVISIONAL
    terminal_states: [VERIFIED]
    transitions:
      - from: PROVISIONAL
        to: VERIFIED
        trigger: "POST /rfs/state-credit-reports/{id}/verify"
        actor: ComplianceManager
        preconditions:
          - "measured_ci_gco2e_mj > 0 (ERR_INVALID_REQUEST)"
        side_effects:
          - "credits_tons recomputed with measured CI (calculation state_credit_generation, verified variant)"
          - "StateProgram.total_credits_tons re-derived (delta between provisional and verified applied)"
          - "verified_at := current logical clock"

# =============================================================================
# Section 1.2.1: Concurrency Rules
# =============================================================================
concurrency_rules:
  - rule_id: report-create-stale-year
    parent_entity: ObligationYear
    write_endpoint: "POST /rfs/compliance-reports"
    occ_field: expected_obligation_year_version
    description: |
      Creating a ComplianceReport against an ObligationYear whose version has
      advanced since the client last observed it is rejected. This captures the
      case where another writer has just created a report for the same year
      (which legitimately supersedes the prior DRAFT of that report_type and
      bumps the year's version) and the current writer's view of the year is
      therefore stale.
    error_id: ERR_STALE_VERSION
    http_status: 412

# =============================================================================
# Table 1.3: Calculation Rules Table
# =============================================================================
calculations:
  - name: rin_generation_qty
    trigger: "RINLot creation with origin GENERATED (POST /rfs/rin-lots)"
    algorithm: unit_conversion
    formula: |
      rin_qty = round_half_up(gallon_qty * equivalence_value)  # integer RINs
      attached_qty = rin_qty
      separated_qty = 0
      available_qty = rin_qty
      Rounding is applied PER LOT at generation. Position totals sum the
      already-rounded per-lot rin_qty values; the system MUST NOT round the
      aggregate (round-half-up per lot, then sum: 1 gal x 1.5 twice = 2 + 2 = 4,
      not round(3.0) = 3).
    input_set: "the single RINLot being created"
    precision: "0 decimal places, round_half_up, applied per lot"

  - name: rvo_obligation
    trigger: "ObligationYear creation (provisional variant); close-volume (final variant)"
    algorithm: aggregation
    formula: |
      Provisional (at creation, from projected_volume_gal):
        provisional_rvo_cellulosic_rins     = round_half_up(projected_volume_gal * std_cellulosic_pct / 100)
        provisional_rvo_biomass_diesel_rins = round_half_up(projected_volume_gal * std_biomass_diesel_pct / 100)
        provisional_rvo_advanced_rins       = round_half_up(projected_volume_gal * std_advanced_pct / 100)
        provisional_rvo_total_rins          = round_half_up(projected_volume_gal * std_total_pct / 100)
      Final (at close-volume, from actual_volume_gal): same formula with
      actual_volume_gal substituted, written to final_rvo_* fields.
      Active RVO used by caps and posture = final_* when status != OPEN,
      else provisional_*.
    input_set: "the ObligationYear row"
    precision: "0 decimal places, round_half_up"
    variants:
      - name: provisional
        when: "year creation and while status == OPEN"
        difference: "uses projected_volume_gal; final_rvo_* remain null"
      - name: final
        when: "after close-volume"
        difference: "uses actual_volume_gal; identical inputs would produce identical values, but projected vs actual volumes diverge so provisional and final RVOs differ for the same year"

  - name: carryover_cap_check
    trigger: "RetirementBatch submit"
    algorithm: threshold
    formula: |
      cap_category = round_half_up(0.20 * active_rvo_category)
      active_rvo_category = final_rvo_<category>_rins when ObligationYear.status != OPEN
                            else provisional_rvo_<category>_rins
      batch_prior_qty = sum of allocation qty drawn from lots with
                        vintage_year == ObligationYear.year - 1
      PASS when: batch_prior_qty + ObligationYear.retired_prior_<category>_rins <= cap_category
      (boundary: exactly AT the cap passes; cap + 1 fails with ERR_CARRYOVER_CAP_EXCEEDED)
      Current-vintage RINs are uncapped. retired_prior_* counts only ACCEPTED batches.
    input_set: "the batch's computed FIFO allocations plus the ObligationYear's retired_prior_<category>_rins and active RVO"
    constants:
      CARRYOVER_CAP_FRACTION: 0.20
    precision: "cap rounded to 0 decimal places, round_half_up"

  - name: retirement_fifo_allocation
    trigger: "RetirementBatch submit"
    algorithm: chronological
    formula: |
      Eligible lots (ALL must hold):
        RINLot.account_id == ObligationYear.account_id
        RINLot.status == ACTIVE
        RINLot.d_code == batch.d_code
        RINLot.vintage_year IN { ObligationYear.year, ObligationYear.year - 1 }
        available_qty > 0
        if origin == GENERATED: eligible portion is separated RINs (available_qty)
        if origin == PURCHASED: source RINTrade.transfer_status == VERIFIED
      Order: created_at ASC; tie-break rin_qty ASC (never id).
      Draw greedily: take min(lot.available_qty, remaining) per lot until
      remaining == 0. If total eligible < rin_qty -> ERR_INSUFFICIENT_RINS.
      allocations[] = the draw list in draw order; prior_vintage_qty = sum of
      qty from lots with vintage_year == year - 1.
    input_set: "RINLots of the account filtered as above"
    precision: "integer RINs; no rounding"

  - name: nested_retirement_accounting
    trigger: "RetirementBatch decide=ACCEPT (forward); RINLot invalidation (reversal)"
    algorithm: aggregation
    formula: |
      A retired RIN counts toward every category its d_code maps to:
        D3 -> { CELLULOSIC, ADVANCED, TOTAL_RENEWABLE }
        D4 -> { BIOMASS_DIESEL, ADVANCED, TOTAL_RENEWABLE }
        D5 -> { ADVANCED, TOTAL_RENEWABLE }
        D6 -> { TOTAL_RENEWABLE }
      On ACCEPT of a batch with d_code D and rin_qty Q:
        for each category C in mapping(D): retired_<C>_rins += Q
        for each category C in mapping(D): retired_prior_<C>_rins += prior_vintage_qty
      On RINLot invalidation (invalidated_qty I from lots with retired_qty R):
        retired_* and retired_prior_* counters are RE-DERIVED from scratch over
        ACCEPTED batches excluding RINs on INVALIDATED lots (reversal is
        full-recompute, not decrement-by-delta).
      Batch/category eligibility at creation (ERR_D_CODE_NOT_ELIGIBLE):
        category must be in mapping(d_code).
    input_set: "ACCEPTED RetirementBatches of the year and their allocations"
    precision: "integer RINs; no rounding"

  - name: position_aggregation
    trigger: "GET /rfs/compliance-accounts/{id}/position (computed on read)"
    algorithm: aggregation
    formula: |
      Group the account's RINLots by (d_code, vintage_year). Per bucket:
        generated_rins    = sum(rin_qty) over origin == GENERATED lots
        purchased_rins    = sum(rin_qty) over origin == PURCHASED lots
        separated_rins    = sum(separated_qty)
        retired_rins      = sum(retired_qty)
        invalidated_rins  = sum(invalidated_qty)
        expired_rins      = sum(expired_qty)
        available_rins    = sum(available_qty)
        eligible_rins     = sum(available_qty) over lots that pass
                            retirement_fifo_allocation's eligibility filter
                            (excluding the vintage term, which is year-relative)
      Totals = sum over buckets. Per-lot rin_qty values were already rounded
      at generation (see rin_generation_qty); this aggregation never re-rounds.
    input_set: "all RINLots of the account regardless of status (status surfaced per lot; buckets include EXPIRED/INVALIDATED lots so position reconciles)"
    precision: "integer RINs; no rounding"

  - name: exposure_mark_to_market
    trigger: "GET /rfs/compliance-accounts/{id}/exposure (computed on read)"
    algorithm: weighted_scoring
    formula: |
      Buckets = (d_code, vintage_year) groups of the account's RINLots with
      available_qty > 0 and status == ACTIVE.
      Per bucket:
        wac_cents = round_half_up( sum(available_qty * unit_cost_cents) / sum(available_qty), 4 )
        market quote selector: PriceQuotes of the account with matching d_code
          and vintage_year whose CLOSED window covers current_utc
          (effective_start <= current_utc <= effective_end); at most one can
          exist because closed-interval overlap is rejected. If none, the bucket
          is excluded from the total and counted in unpriced_bucket_count.
        bucket_gain_cents = round_half_up( sum(available_qty) * (price_cents - wac_cents) )
      total_exposure_cents = sum of bucket_gain_cents over priced buckets
      Note: bucket gains are integers because sum(available_qty)*wac telescopes;
      the 4-dp wac rounding pin exists so intermediate reads are deterministic.
    input_set: "ACTIVE RINLots with available_qty > 0, plus covering PriceQuotes"
    precision: "wac 4 decimal places round_half_up; bucket gain and total 0 decimal places round_half_up"

  - name: state_credit_generation
    trigger: "StateCreditReport creation (provisional variant); verify (verified variant)"
    algorithm: aggregation
    formula: |
      credits_tons = round_half_up(
        (StateProgram.ci_standard_gco2e_mj - ci_used) * ENERGY_DENSITY_MJ_PER_GAL * fuel_gallons / 1000000, 4)
      ci_used = StateProgram.default_ci_gco2e_mj        (provisional variant)
      ci_used = StateCreditReport.measured_ci_gco2e_mj  (verified variant)
      Negative credits (ci_used > standard) are permitted (deficits).
      StateProgram.total_credits_tons = sum of credits_tons over the program's
      reports, rounded_half_up to 4 decimal places after summing.
    input_set: "the StateCreditReport and its StateProgram"
    constants:
      ENERGY_DENSITY_MJ_PER_GAL: 120.0
    precision: "4 decimal places, round_half_up"
    variants:
      - name: provisional
        when: "report creation (status PROVISIONAL)"
        difference: "uses the program's default CI pathway"
      - name: verified
        when: "verify with measured_ci_gco2e_mj"
        difference: "uses the measured CI; same fuel_gallons yields different credits whenever measured != default"

  - name: retention_cutoff
    trigger: "POST /rfs/compliance-accounts/{id}/purge-records; retention_until computed at record creation"
    algorithm: threshold
    formula: |
      retention_until = created_at + 1825 days (fixed 5-year retention; leap
      years absorbed by the fixed day count).
      A BlendingRecord or PriceQuote of the account is purgeable when
      retention_until <= current_utc (boundary: exactly AT retention_until is
      purgeable; one second before is not -> ERR_RETENTION_ACTIVE if any
      targeted record is not yet purgeable).
    input_set: "BlendingRecords and PriceQuotes of the account"
    constants:
      RETENTION_DAYS: 1825
    precision: "second precision on logical clock"

  - name: rin_vintage_expiry
    trigger: "POST /_clock/set_current_utc (system sweep after clock advance)"
    algorithm: threshold
    formula: |
      A vintage_year V RIN is usable for compliance years V and V+1.
      RINLot (status ACTIVE) with current_utc > (vintage_year+2)-03-31T23:59:59Z
      transitions to EXPIRED: expired_qty += available_qty + pending_retired_qty,
      separated_qty := 0, pending_retired_qty := 0, available_qty := 0.
      (Retirement deadline for ObligationYear Y is the same formula with V=Y:
      submit requires current_utc <= (Y+1)-03-31T23:59:59Z.)
    input_set: "all ACTIVE RINLots"
    precision: "second precision on logical clock"

  - name: posture_derivation
    trigger: "retirement decide, lot invalidation, volume close, clock advance"
    algorithm: threshold
    formula: |
      active_rvo_C = final_rvo_C when ObligationYear.status != OPEN else provisional_rvo_C
      1) SATISFIED when retired_C >= active_rvo_C for all C in
         {CELLULOSIC, BIOMASS_DIESEL, ADVANCED, TOTAL_RENEWABLE}
      2) SHORTFALL when not satisfied AND current_utc > (year+1)-03-31T23:59:59Z
      3) Otherwise ON_TRACK
    input_set: "the ObligationYear's retired_* counters and active RVOs"
    precision: "integer comparison, >= boundary (exactly equal IS satisfied)"

# =============================================================================
# Table 1.4: Validation Rules Table (ordered by priority)
# =============================================================================
validations:
  - priority: 1
    category: auth
    check: "X-User-Role and X-User-ID headers present; role is one of OpsAdmin, ComplianceManager, Trader, Auditor"
    error_id: ERR_UNAUTHENTICATED
    http_status: 401
    applies_to: all

  - priority: 2
    category: auth
    check: "The caller's role is listed in the endpoint's roles"
    error_id: ERR_FORBIDDEN
    http_status: 403
    applies_to: all

  - priority: 3
    category: auth
    check: "Segregation of duties: trade verify requires X-User-ID != RINTrade.created_by_user_id; report submit requires X-User-ID != auditor_user_id of every AttestEngagement on the same ObligationYear"
    error_id: ERR_SEGREGATION_OF_DUTIES
    http_status: 403
    applies_to: "POST /rfs/rin-trades/{id}/verify, POST /rfs/compliance-reports/{id}/submit"

  - priority: 4
    category: existence
    check: "Path identifiers exist, validated left-to-right"
    error_id: ERR_NOT_FOUND
    http_status: 404
    applies_to: all

  - priority: 5
    category: business_constraint
    check: "Request shape: required fields present; enum values valid; quantities > 0; std_* percentages satisfy 0 <= cellulosic <= biomass_diesel <= advanced <= total; quarter_end_date required for QUARTERLY and forbidden for ANNUAL; fieldwork_end > fieldwork_start; effective_end >= effective_start"
    error_id: ERR_INVALID_REQUEST
    http_status: 400
    applies_to: all

  - priority: 6
    category: business_referential
    check: "Body foreign keys reference existing resources (account_id, vendor_id, obligation_year_id, state_program_id, rin_lot_id); referenced account of a child must match the account of sibling references (e.g. trade vendor must belong to trade account)"
    error_id: ERR_REFERENCE_NOT_FOUND
    http_status: 422
    applies_to: all creation endpoints with body FKs

  - priority: 7
    category: state
    check: "OCC: expected_obligation_year_version matches ObligationYear.version"
    error_id: ERR_STALE_VERSION
    http_status: 412
    applies_to: "POST /rfs/compliance-reports"

  - priority: 8
    category: state
    check: "Target resource is in a valid from-state for the requested transition (incl. year not FINALIZED, trade payment/transfer dimension cross-guards, report supersede blocking by same-type non-DRAFT report)"
    error_id: ERR_INVALID_STATE
    http_status: 409
    applies_to: all state transition endpoints

  - priority: 9
    category: business_safety
    check: "Regulatory gates: vendor must be APPROVED for trade verify; lot must not be INVALIDATED for separation/invalidation; ANNUAL report submit requires a CLOSED_CLEAN AttestEngagement for the year; d_code must be eligible for the batch category"
    error_id: "ERR_VENDOR_NOT_APPROVED | ERR_RIN_INVALIDATED | ERR_ATTEST_NOT_CLEAN | ERR_D_CODE_NOT_ELIGIBLE"
    http_status: 409
    applies_to: "verify, separations, invalidate, report submit, batch create"

  - priority: 10
    category: business_constraint
    check: "Uniqueness and overlap: epa_registration_id unique; (account_id, year) unique for ObligationYear; (account_id, state_code) unique for StateProgram; (state_program_id, period_label) unique; attest fieldwork windows for the same auditor_user_id must not overlap under HALF-OPEN [start, end) semantics (touching windows allowed); price-quote windows for the same (account_id, d_code, vintage_year) must not overlap under CLOSED [start, end] semantics (sharing an endpoint IS a conflict)"
    error_id: "ERR_INVALID_REQUEST (uniqueness) | ERR_ENGAGEMENT_WINDOW_OVERLAP | ERR_PRICE_WINDOW_OVERLAP"
    http_status: 409
    applies_to: "creation endpoints, attest engagement creation, price quote creation"

  - priority: 11
    category: business_temporal
    check: "Time gates: lot vintage_year within {clock year - 1, clock year}; retirement submit before (year+1)-03-31T23:59:59Z; trade verify within 30 days of delivery; purge only records with retention_until <= current_utc"
    error_id: "ERR_INVALID_VINTAGE | ERR_DEADLINE_PASSED | ERR_VERIFICATION_WINDOW_EXPIRED | ERR_RETENTION_ACTIVE"
    http_status: 409
    applies_to: "lot create, batch submit, trade verify, purge"

  - priority: 12
    category: business_fiscal
    check: "Quantity sufficiency and caps: separation gallons <= attached_qty; FIFO-eligible RINs >= batch rin_qty; carryover cap (20% of active category RVO, at-cap allowed)"
    error_id: "ERR_SEPARATION_EXCEEDS_ATTACHED | ERR_INSUFFICIENT_RINS | ERR_CARRYOVER_CAP_EXCEEDED"
    http_status: 409
    applies_to: "separations, batch submit, batch decide"

# =============================================================================
# Table 1.0: Response Envelope (FIXED)
# =============================================================================
response_envelope:
  success: |
    { "meta": { "api_request_id": "req_xxx", "api_request_timestamp": "ISO8601" },
      "response_type": "object" | "array", "data": {} }
  error: |
    { "meta": { ... }, "response_type": "error",
      "data": { "error_id": "ERR_XXX", "message": "..." } }
  pagination_fields: ["limit", "offset", "total_count", "has_more"]
  pagination_defaults: { limit: 10, min: 1, max: 100, offset: 0 }

# =============================================================================
# Table 1.5: API Endpoint Table
# =============================================================================
endpoints:
  # --- Logical clock (test-driving) ---
  - method: POST
    path: "/_clock/set_current_utc"
    description: "Set the logical clock. Startup default (before any call) is exactly 2026-08-01T00:00:00Z and MUST NOT fall back to wall-clock time. Advancing the clock applies the rin_vintage_expiry sweep and posture re-derivation."
    roles: [OpsAdmin]
    code: 200
    input: [to_iso8601]
    output: "{ current_utc: string }"
    side_effects: ["rin_vintage_expiry sweep", "posture_derivation for all years"]

  # --- ComplianceAccount ---
  - method: POST
    path: "/rfs/compliance-accounts"
    description: "Register an obligated party"
    roles: [OpsAdmin]
    code: 201
    input: [company_name, epa_registration_id]
    output: ComplianceAccount
    side_effects: ["escrow_reserved_cents=0, spent_cents=0"]

  - method: GET
    path: "/rfs/compliance-accounts/{id}"
    description: "Get one account"
    roles: [OpsAdmin, ComplianceManager, Trader, Auditor]
    code: 200
    input: []
    output: ComplianceAccount
    side_effects: []

  - method: GET
    path: "/rfs/compliance-accounts/{id}/position"
    description: "Computed RIN position by (d_code, vintage_year) bucket"
    roles: [OpsAdmin, ComplianceManager, Trader]
    code: 200
    input: []
    output: "{ buckets: array, total_available_rins: integer, total_retired_rins: integer, total_invalidated_rins: integer }"
    side_effects: []

  - method: GET
    path: "/rfs/compliance-accounts/{id}/exposure"
    description: "Computed mark-to-market price exposure (calculation exposure_mark_to_market)"
    roles: [OpsAdmin, ComplianceManager, Trader]
    code: 200
    input: []
    output: "{ total_exposure_cents: integer, priced_bucket_count: integer, unpriced_bucket_count: integer }"
    side_effects: []

  # --- ObligationYear ---
  - method: POST
    path: "/rfs/obligation-years"
    description: "Open a compliance year with projected volume and EPA standards (provisional RVOs computed)"
    roles: [ComplianceManager]
    code: 201
    input: [account_id, year, projected_volume_gal, std_cellulosic_pct, std_biomass_diesel_pct, std_advanced_pct, std_total_pct]
    output: ObligationYear
    side_effects: ["status=OPEN, posture=ON_TRACK, provisional RVOs computed (rvo_obligation provisional)"]

  - method: GET
    path: "/rfs/obligation-years/{id}"
    description: "Get one obligation year"
    roles: [OpsAdmin, ComplianceManager, Trader, Auditor]
    code: 200
    input: []
    output: ObligationYear
    side_effects: []

  - method: GET
    path: "/rfs/obligation-years"
    description: "List obligation years, optionally filtered by account_id"
    roles: [OpsAdmin, ComplianceManager, Trader, Auditor]
    code: 200
    input: ["account_id?"]
    output: "ObligationYear[]"
    side_effects: []

  - method: POST
    path: "/rfs/obligation-years/{id}/close-volume"
    description: "Record actual non-renewable volume; computes final RVOs (replaces provisional as active)"
    roles: [ComplianceManager]
    code: 200
    input: [actual_volume_gal]
    output: ObligationYear
    side_effects: ["status OPEN -> VOLUME_CLOSED", "final RVOs computed (rvo_obligation final)", "posture re-derived", "increments ObligationYear.version by 1"]

  - method: POST
    path: "/rfs/obligation-years/{id}/finalize"
    description: "Finalize the year (terminal) once annual report accepted and attest clean"
    roles: [ComplianceManager]
    code: 200
    input: []
    output: ObligationYear
    side_effects: ["status VOLUME_CLOSED -> FINALIZED", "increments ObligationYear.version by 1"]

  # --- Vendor ---
  - method: POST
    path: "/rfs/vendors"
    description: "Onboard a RIN counterparty (starts UNVETTED)"
    roles: [Trader]
    code: 201
    input: [account_id, vendor_name, qap_audited]
    output: Vendor
    side_effects: ["diligence_status=UNVETTED"]

  - method: GET
    path: "/rfs/vendors/{id}"
    description: "Get one vendor"
    roles: [OpsAdmin, ComplianceManager, Trader]
    code: 200
    input: []
    output: Vendor
    side_effects: []

  - method: GET
    path: "/rfs/vendors"
    description: "List vendors, optionally filtered by account_id"
    roles: [OpsAdmin, ComplianceManager, Trader]
    code: 200
    input: ["account_id?"]
    output: "Vendor[]"
    side_effects: []

  - method: POST
    path: "/rfs/vendors/{id}/diligence"
    description: "Record due-diligence outcome; REVOKED triggers the invalid-RIN cascade"
    roles: [ComplianceManager]
    code: 200
    input: [outcome]
    output: Vendor
    side_effects: ["diligence_status transition per state machine", "REVOKED: cascade invalidates DELIVERED/VERIFIED trades -> lots -> year counters -> accepted reports"]

  # --- RINLot & BlendingRecord ---
  - method: POST
    path: "/rfs/rin-lots"
    description: "Record renewable fuel production and RIN generation (origin GENERATED)"
    roles: [ComplianceManager]
    code: 201
    input: [account_id, d_code, vintage_year, gallon_qty, equivalence_value]
    output: RINLot
    side_effects: ["rin_qty computed (rin_generation_qty)", "status=ACTIVE", "retention_until set"]

  - method: GET
    path: "/rfs/rin-lots/{id}"
    description: "Get one RIN lot"
    roles: [OpsAdmin, ComplianceManager, Trader]
    code: 200
    input: []
    output: RINLot
    side_effects: []

  - method: GET
    path: "/rfs/rin-lots"
    description: "List RIN lots, optionally filtered by account_id, vendor_id, or trade_id"
    roles: [OpsAdmin, ComplianceManager, Trader]
    code: 200
    input: ["account_id?", "vendor_id?", "trade_id?"]
    output: "RINLot[]"
    side_effects: []

  - method: POST
    path: "/rfs/rin-lots/{id}/separations"
    description: "Record blending of gallons from a GENERATED lot; separates that many RINs (creates BlendingRecord)"
    roles: [ComplianceManager]
    code: 201
    input: [blended_gallons]
    output: BlendingRecord
    side_effects: ["lot attached_qty -= blended_gallons, separated_qty += blended_gallons (available_qty unchanged)", "blended_at := logical clock"]

  - method: GET
    path: "/rfs/blending-records/{id}"
    description: "Get one blending record"
    roles: [OpsAdmin, ComplianceManager, Trader]
    code: 200
    input: []
    output: BlendingRecord
    side_effects: []

  - method: GET
    path: "/rfs/blending-records"
    description: "List blending records, optionally filtered by account_id or rin_lot_id"
    roles: [OpsAdmin, ComplianceManager, Trader]
    code: 200
    input: ["account_id?", "rin_lot_id?"]
    output: "BlendingRecord[]"
    side_effects: []

  # --- RINTrade ---
  - method: POST
    path: "/rfs/rin-trades"
    description: "Execute a RIN purchase (payment UNPAID, transfer PENDING); reserves escrow"
    roles: [Trader]
    code: 201
    input: [account_id, vendor_id, d_code, vintage_year, rin_qty, price_per_rin_cents]
    output: RINTrade
    side_effects: ["total_price_cents computed", "ComplianceAccount.escrow_reserved_cents += total_price_cents", "created_by_user_id := X-User-ID"]

  - method: GET
    path: "/rfs/rin-trades/{id}"
    description: "Get one trade"
    roles: [OpsAdmin, ComplianceManager, Trader]
    code: 200
    input: []
    output: RINTrade
    side_effects: []

  - method: GET
    path: "/rfs/rin-trades"
    description: "List trades, optionally filtered by account_id or vendor_id"
    roles: [OpsAdmin, ComplianceManager, Trader]
    code: 200
    input: ["account_id?", "vendor_id?"]
    output: "RINTrade[]"
    side_effects: []

  - method: POST
    path: "/rfs/rin-trades/{id}/pay"
    description: "Pay for a PENDING trade (escrow -> spend)"
    roles: [Trader]
    code: 200
    input: []
    output: RINTrade
    side_effects: ["payment_status -> PAID", "escrow_reserved_cents -= total; spent_cents += total"]

  - method: POST
    path: "/rfs/rin-trades/{id}/deliver"
    description: "Record RIN delivery; creates the PURCHASED RINLot"
    roles: [Trader]
    code: 200
    input: []
    output: RINTrade
    side_effects: ["transfer_status -> DELIVERED", "creates PURCHASED RINLot (separated_qty = rin_qty)", "delivered_at := logical clock"]

  - method: POST
    path: "/rfs/rin-trades/{id}/verify"
    description: "Due-diligence verification of delivered RINs (segregated from trade creator; vendor must be APPROVED; within 30 days of delivery)"
    roles: [ComplianceManager]
    code: 200
    input: []
    output: RINTrade
    side_effects: ["transfer_status -> VERIFIED", "verified_by_user_id := X-User-ID", "PURCHASED lot becomes retirement-eligible"]

  - method: POST
    path: "/rfs/rin-trades/{id}/cancel"
    description: "Cancel a trade before delivery (escrow released / spend refunded)"
    roles: [Trader]
    code: 200
    input: []
    output: RINTrade
    side_effects: ["transfer_status -> CANCELLED", "escrow/spend compensated per payment_status"]

  - method: POST
    path: "/rfs/rin-trades/{id}/invalidate"
    description: "Mark delivered/verified RINs as EPA-invalid; cascades to lot, year counters, and accepted reports"
    roles: [ComplianceManager]
    code: 200
    input: []
    output: RINTrade
    side_effects: ["transfer_status -> INVALIDATED", "PURCHASED RINLot -> INVALIDATED (retired_qty clawback via full re-derive)", "ACCEPTED reports for the year -> REJECTED with amendment_required=true"]

  # --- RetirementBatch ---
  - method: POST
    path: "/rfs/retirement-batches"
    description: "Create a DRAFT retirement batch for a category/d_code"
    roles: [ComplianceManager]
    code: 201
    input: [obligation_year_id, category, d_code, rin_qty]
    output: RetirementBatch
    side_effects: ["status=DRAFT", "d_code/category eligibility checked (ERR_D_CODE_NOT_ELIGIBLE)"]

  - method: GET
    path: "/rfs/retirement-batches/{id}"
    description: "Get one retirement batch"
    roles: [OpsAdmin, ComplianceManager, Trader]
    code: 200
    input: []
    output: RetirementBatch
    side_effects: []

  - method: GET
    path: "/rfs/retirement-batches"
    description: "List retirement batches, optionally filtered by obligation_year_id"
    roles: [OpsAdmin, ComplianceManager, Trader]
    code: 200
    input: ["obligation_year_id?"]
    output: "RetirementBatch[]"
    side_effects: []

  - method: POST
    path: "/rfs/retirement-batches/{id}/submit"
    description: "Submit to EPA: FIFO allocation computed, deadline and carryover cap enforced"
    roles: [ComplianceManager]
    code: 200
    input: []
    output: RetirementBatch
    side_effects: ["status DRAFT -> SUBMITTED", "allocations computed (retirement_fifo_allocation)", "lots: separated_qty -> pending_retired_qty", "carryover_cap_check"]

  - method: POST
    path: "/rfs/retirement-batches/{id}/decide"
    description: "EPA decision: ACCEPT debits lots and re-derives year counters; REJECT releases pending allocations"
    roles: [OpsAdmin]
    code: 200
    input: [decision]
    output: RetirementBatch
    side_effects: ["status SUBMITTED -> ACCEPTED or REJECTED", "ACCEPT: lots debited (EXHAUSTED at zero), nested_retirement_accounting, posture re-derived", "REJECT: pending allocations released"]

  # --- ComplianceReport ---
  - method: POST
    path: "/rfs/compliance-reports"
    description: "Create a DRAFT report for a year; supersedes the prior same-type DRAFT; OCC on the year's version"
    roles: [ComplianceManager]
    code: 201
    input: [obligation_year_id, report_type, "quarter_end_date?", expected_obligation_year_version]
    output: ComplianceReport
    side_effects: ["status=DRAFT", "due_date computed", "prior same-type DRAFT -> SUPERSEDED", "increments ObligationYear.version by 1", "created_by_user_id := X-User-ID"]

  - method: GET
    path: "/rfs/compliance-reports/{id}"
    description: "Get one report"
    roles: [OpsAdmin, ComplianceManager, Trader, Auditor]
    code: 200
    input: []
    output: ComplianceReport
    side_effects: []

  - method: GET
    path: "/rfs/compliance-reports"
    description: "List reports, optionally filtered by obligation_year_id"
    roles: [OpsAdmin, ComplianceManager, Trader, Auditor]
    code: 200
    input: ["obligation_year_id?"]
    output: "ComplianceReport[]"
    side_effects: []

  - method: POST
    path: "/rfs/compliance-reports/{id}/submit"
    description: "Submit a DRAFT report to EPA (ANNUAL requires CLOSED_CLEAN attest; sets is_late)"
    roles: [ComplianceManager]
    code: 200
    input: []
    output: ComplianceReport
    side_effects: ["status DRAFT -> SUBMITTED", "submitted_at := logical clock", "is_late computed"]

  - method: POST
    path: "/rfs/compliance-reports/{id}/decide"
    description: "EPA review decision: ACCEPT or REJECT a SUBMITTED report"
    roles: [OpsAdmin]
    code: 200
    input: [decision]
    output: ComplianceReport
    side_effects: ["status SUBMITTED -> ACCEPTED or REJECTED"]

  - method: POST
    path: "/rfs/compliance-reports/{id}/reopen"
    description: "Revise a REJECTED report or amend an ACCEPTED report back to DRAFT"
    roles: [ComplianceManager]
    code: 200
    input: []
    output: ComplianceReport
    side_effects: ["status -> DRAFT", "amendment_required=false, submitted_at=null, is_late=false"]

  # --- AttestEngagement ---
  - method: POST
    path: "/rfs/attest-engagements"
    description: "Engage a third-party auditor for a compliance year; auditor fieldwork windows must not overlap (half-open)"
    roles: [ComplianceManager]
    code: 201
    input: [obligation_year_id, auditor_user_id, fieldwork_start, fieldwork_end]
    output: AttestEngagement
    side_effects: ["status=ENGAGED", "auditor_user_id recorded from input (an Auditor-role opaque user id)"]

  - method: GET
    path: "/rfs/attest-engagements/{id}"
    description: "Get one attest engagement"
    roles: [OpsAdmin, ComplianceManager, Auditor]
    code: 200
    input: []
    output: AttestEngagement
    side_effects: []

  - method: GET
    path: "/rfs/attest-engagements"
    description: "List attest engagements, optionally filtered by obligation_year_id"
    roles: [OpsAdmin, ComplianceManager, Auditor]
    code: 200
    input: ["obligation_year_id?"]
    output: "AttestEngagement[]"
    side_effects: []

  - method: POST
    path: "/rfs/attest-engagements/{id}/begin-fieldwork"
    description: "Begin fieldwork (from ENGAGED) or re-examine (from REMEDIATION) — the remediation loop"
    roles: [Auditor]
    code: 200
    input: []
    output: AttestEngagement
    side_effects: ["status -> FIELDWORK"]

  - method: POST
    path: "/rfs/attest-engagements/{id}/issue-findings"
    description: "Issue findings (CLEAN or ADVERSE)"
    roles: [Auditor]
    code: 200
    input: [findings]
    output: AttestEngagement
    side_effects: ["status FIELDWORK -> FINDINGS_ISSUED", "findings recorded"]

  - method: POST
    path: "/rfs/attest-engagements/{id}/remediate"
    description: "Open remediation for ADVERSE findings (ComplianceManager)"
    roles: [ComplianceManager]
    code: 200
    input: []
    output: AttestEngagement
    side_effects: ["status FINDINGS_ISSUED -> REMEDIATION"]

  - method: POST
    path: "/rfs/attest-engagements/{id}/close"
    description: "Close the engagement (findings must be CLEAN)"
    roles: [Auditor]
    code: 200
    input: []
    output: AttestEngagement
    side_effects: ["status FINDINGS_ISSUED -> CLOSED_CLEAN", "enables ANNUAL report submission"]

  # --- StateProgram / StateCreditReport ---
  - method: POST
    path: "/rfs/state-programs"
    description: "Enroll the account in a state low-carbon program"
    roles: [ComplianceManager]
    code: 201
    input: [account_id, state_code, program_type, ci_standard_gco2e_mj, default_ci_gco2e_mj]
    output: StateProgram
    side_effects: ["total_credits_tons=0"]

  - method: GET
    path: "/rfs/state-programs/{id}"
    description: "Get one state program enrollment"
    roles: [OpsAdmin, ComplianceManager, Trader]
    code: 200
    input: []
    output: StateProgram
    side_effects: []

  - method: GET
    path: "/rfs/state-programs"
    description: "List state program enrollments, optionally filtered by account_id"
    roles: [OpsAdmin, ComplianceManager, Trader]
    code: 200
    input: ["account_id?"]
    output: "StateProgram[]"
    side_effects: []

  - method: POST
    path: "/rfs/state-credit-reports"
    description: "File a period fuel report; provisional credits computed with the program default CI"
    roles: [ComplianceManager]
    code: 201
    input: [state_program_id, period_label, fuel_gallons]
    output: StateCreditReport
    side_effects: ["status=PROVISIONAL", "credits_tons computed (state_credit_generation provisional)", "program total_credits_tons re-derived"]

  - method: GET
    path: "/rfs/state-credit-reports/{id}"
    description: "Get one state credit report"
    roles: [OpsAdmin, ComplianceManager, Trader]
    code: 200
    input: []
    output: StateCreditReport
    side_effects: []

  - method: GET
    path: "/rfs/state-credit-reports"
    description: "List state credit reports, optionally filtered by state_program_id"
    roles: [OpsAdmin, ComplianceManager, Trader]
    code: 200
    input: ["state_program_id?"]
    output: "StateCreditReport[]"
    side_effects: []

  - method: POST
    path: "/rfs/state-credit-reports/{id}/verify"
    description: "Verify with measured CI; credits recomputed (verified variant) and program total adjusted"
    roles: [ComplianceManager]
    code: 200
    input: [measured_ci_gco2e_mj]
    output: StateCreditReport
    side_effects: ["status PROVISIONAL -> VERIFIED", "credits_tons recomputed (state_credit_generation verified)", "program total_credits_tons re-derived", "verified_at := logical clock"]

  # --- PriceQuote ---
  - method: POST
    path: "/rfs/price-quotes"
    description: "Record an observed market price for a (d_code, vintage_year); closed effective windows must not overlap"
    roles: [OpsAdmin]
    code: 201
    input: [account_id, d_code, vintage_year, price_cents, effective_start, effective_end]
    output: PriceQuote
    side_effects: ["retention_until set"]

  - method: GET
    path: "/rfs/price-quotes/{id}"
    description: "Get one price quote"
    roles: [OpsAdmin, ComplianceManager, Trader]
    code: 200
    input: []
    output: PriceQuote
    side_effects: []

  - method: GET
    path: "/rfs/price-quotes"
    description: "List price quotes, optionally filtered by account_id"
    roles: [OpsAdmin, ComplianceManager, Trader]
    code: 200
    input: ["account_id?"]
    output: "PriceQuote[]"
    side_effects: []

  # --- Recordkeeping retention ---
  - method: POST
    path: "/rfs/compliance-accounts/{id}/purge-records"
    description: "Purge BlendingRecords and PriceQuotes of the account whose retention_until <= current logical clock; fails entirely if any targeted record is still within retention"
    roles: [OpsAdmin]
    code: 200
    input: []
    output: "{ purged_blending_records: integer, purged_price_quotes: integer }"
    side_effects: ["eligible records hard-deleted (retention_cutoff)"]

# =============================================================================
# Table 1.6: Error Code Catalog
# =============================================================================
errors:
  - { id: ERR_UNAUTHENTICATED, http: 401, condition: "Missing or invalid X-User-Role / X-User-ID headers" }
  - { id: ERR_FORBIDDEN, http: 403, condition: "Role not permitted for this endpoint; or attest action by a user other than the engagement's auditor_user_id" }
  - { id: ERR_SEGREGATION_OF_DUTIES, http: 403, condition: "Trade creator attempting to verify own trade; or report submitter is an auditor on the same obligation year" }
  - { id: ERR_NOT_FOUND, http: 404, condition: "Path identifier does not exist (validated left-to-right)" }
  - { id: ERR_INVALID_REQUEST, http: 400, condition: "Missing required field, invalid enum, non-positive quantity, non-monotone standards, malformed window, or uniqueness violation on natural keys (epa_registration_id, account+year, account+state_code, program+period_label)" }
  - { id: ERR_REFERENCE_NOT_FOUND, http: 422, condition: "Body foreign key references a missing resource, or sibling references belong to different accounts" }
  - { id: ERR_STALE_VERSION, http: 412, condition: "expected_obligation_year_version does not match ObligationYear.version (OCC on report create-with-supersede)" }
  - { id: ERR_INVALID_STATE, http: 409, condition: "Resource not in a valid from-state for the requested transition (incl. FINALIZED year gates, trade payment/transfer cross-guards, same-type non-DRAFT report blocking creation)" }
  - { id: ERR_VENDOR_NOT_APPROVED, http: 409, condition: "Trade verify requires Vendor.diligence_status == APPROVED" }
  - { id: ERR_RIN_INVALIDATED, http: 409, condition: "Operation targets an INVALIDATED lot or trade (separation, re-invalidation, verify after invalidation)" }
  - { id: ERR_ATTEST_NOT_CLEAN, http: 409, condition: "ANNUAL report submit requires an AttestEngagement for the year with status CLOSED_CLEAN" }
  - { id: ERR_D_CODE_NOT_ELIGIBLE, http: 409, condition: "Batch d_code is not eligible for the batch category (nested mapping: D3->cellulosic/advanced/total, D4->bbd/advanced/total, D5->advanced/total, D6->total)" }
  - { id: ERR_ENGAGEMENT_WINDOW_OVERLAP, http: 409, condition: "New engagement's half-open [fieldwork_start, fieldwork_end) overlaps another non-CLOSED_CLEAN engagement for the same auditor_user_id" }
  - { id: ERR_PRICE_WINDOW_OVERLAP, http: 409, condition: "New quote's closed [effective_start, effective_end] overlaps an existing quote for the same (account_id, d_code, vintage_year); shared endpoints conflict" }
  - { id: ERR_INVALID_VINTAGE, http: 409, condition: "RINLot vintage_year outside {clock year - 1, clock year} at generation" }
  - { id: ERR_DEADLINE_PASSED, http: 409, condition: "Retirement submit after (year+1)-03-31T23:59:59Z" }
  - { id: ERR_VERIFICATION_WINDOW_EXPIRED, http: 409, condition: "Trade verify after delivered_at + 30 days" }
  - { id: ERR_RETENTION_ACTIVE, http: 409, condition: "Purge targets a record whose retention_until > current_utc" }
  - { id: ERR_SEPARATION_EXCEEDS_ATTACHED, http: 409, condition: "blended_gallons exceeds the lot's attached_qty (boundary: exactly attached_qty succeeds)" }
  - { id: ERR_INSUFFICIENT_RINS, http: 409, condition: "FIFO-eligible RIN supply below batch rin_qty at submit, or an allocated lot expired/was invalidated before decide" }
  - { id: ERR_CARRYOVER_CAP_EXCEEDED, http: 409, condition: "Prior-vintage RINs would exceed 20% of the active category RVO (at-cap exactly is allowed)" }
  - { id: ERR_YEAR_NOT_FINALIZABLE, http: 409, condition: "Finalize requires VOLUME_CLOSED plus an ACCEPTED annual report and a CLOSED_CLEAN attest engagement" }

# =============================================================================
# Table 1.7: RBAC Matrix
# =============================================================================
roles:
  - name: OpsAdmin
    description: "Platform operator doubling as the EPA/regulator proxy: registers accounts, records market quotes, decides retirement batches and reports, sets the clock, purges retained records"
    identity: opaque
    exclusive_operations:
      - "POST /rfs/compliance-accounts"
      - "POST /rfs/retirement-batches/{id}/decide"
      - "POST /rfs/compliance-reports/{id}/decide"
      - "POST /rfs/price-quotes"
      - "POST /rfs/compliance-accounts/{id}/purge-records"
      - "POST /_clock/set_current_utc"
    shared_operations:
      - "GET reads across all resources"

  - name: ComplianceManager
    description: "RFS compliance desk lead: opens obligation years, records generation and blending/separation, runs vendor diligence, builds and submits retirement batches and reports, manages state-program overlay, verifies and invalidates delivered RINs"
    identity: opaque
    exclusive_operations:
      - "POST /rfs/obligation-years (+ close-volume, finalize)"
      - "POST /rfs/rin-lots and /rfs/rin-lots/{id}/separations"
      - "POST /rfs/vendors/{id}/diligence"
      - "POST /rfs/retirement-batches (+ submit)"
      - "POST /rfs/compliance-reports (+ submit, reopen)"
      - "POST /rfs/attest-engagements (+ remediate)"
      - "POST /rfs/state-programs and /rfs/state-credit-reports (+ verify)"
      - "POST /rfs/rin-trades/{id}/verify and /rfs/rin-trades/{id}/invalidate"
    shared_operations:
      - "GET reads across all resources"

  - name: Trader
    description: "RIN desk trader: onboards vendors and executes purchases (create/pay/deliver/cancel); may NOT verify own purchases (segregation of duties)"
    identity: opaque
    exclusive_operations:
      - "POST /rfs/vendors"
      - "POST /rfs/rin-trades (+ pay, deliver, cancel)"
    shared_operations:
      - "GET reads across trading resources"

  - name: Auditor
    description: "Independent attest auditor: runs fieldwork, issues findings, closes engagements. Identity is captured per engagement as auditor_user_id"
    identity: opaque
    exclusive_operations:
      - "POST /rfs/attest-engagements/{id}/begin-fieldwork"
      - "POST /rfs/attest-engagements/{id}/issue-findings"
      - "POST /rfs/attest-engagements/{id}/close"
    shared_operations:
      - "GET reads on accounts, years, reports, engagements"
