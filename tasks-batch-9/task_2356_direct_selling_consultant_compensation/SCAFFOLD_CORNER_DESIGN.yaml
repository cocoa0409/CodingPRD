            - "e_notclosed39 == ERR_PERIOD_NOT_CLOSED with HTTP 409 from priority 39: a run cannot be opened against an OPEN period, and the quoted version is the period's current one, so only the state check fails"
            - "lk == LOCKED then e_notopen == ERR_PERIOD_NOT_OPEN (locking twice is refused, so lock is not idempotent)"
