          - state_machines.Kit.DISPENSED_to_RETURNED
        distinguishing_aspect: |
          Conserved quantity = KIT UNITS: the forward dispense(q) paired with its
          compensating return(q) leaves book_on_hand == units_received exactly,
          per on_hand = received - dispensed + returned - destroyed - lost.
