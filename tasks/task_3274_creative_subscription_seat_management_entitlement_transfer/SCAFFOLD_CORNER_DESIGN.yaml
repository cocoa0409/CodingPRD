  - name: subscription_terminal_lockdown_cancelled_in_window
    claim_type: terminal_state_lockdown
    grounds:
    - state_machines.Subscription
    - errors[ERR_INVALID_STATE]
    distinguishing_aspect: From terminal CANCELLED_IN_WINDOW no transition exists; settle attempt returns ERR_INVALID_STATE.
    test_recipe:
      setup:
      - Org; MONTHLY plan window 14; subscription activated then cancelled in-window at day 1
      setup_api_calls:
      - call: POST /licensing/organizations
        payload:
          name: B0
          org_type: INDIVIDUAL
          primary_admin_id: 00000000-0000-0000-0000-000000000000
        as: SystemAdmin
        captures:
          b0: $.data.id
      - call: POST /licensing/admins
        payload:
          email: ba0@b0.com
          full_name: Boot
          admin_kind: SYSTEM_ADMIN
          org_id: ${b0}
        as: SystemAdmin
        captures:
          ba0: $.data.id
      - call: POST /licensing/organizations
        payload:
          name: SM2
          org_type: TEAM
          primary_admin_id: ${ba0}
        as: SystemAdmin
        captures:
          o: $.data.id
      - call: POST /licensing/admins
        payload:
          email: oa@o.com
          full_name: Org Admin
          admin_kind: SYSTEM_ADMIN
          org_id: ${o}
        as: SystemAdmin
        captures:
          oa: $.data.id
      - call: POST /licensing/plans
        payload:
          code: PX
          segment: TEAM
          billing_model: MONTHLY
          monthly_price_cents: 3000
          annual_monthly_price_cents: 3000
          storage_gb_per_seat: 20
          seat_limit: -1
          deployment_modes:
          - NAMED_USER
          allows_offline_activation: false
          max_devices_per_seat: 2
          cancellation_window_days: 14
          etf_rate_pct: 0
        as: SystemAdmin
        captures:
          pl: $.data.id
      - call: POST /licensing/product-versions
        payload:
          plan_id: ${pl}
          version_label: '2026.1'
          release_date: '2026-01-15T00:00:00Z'
        as: SystemAdmin
      - call: POST /licensing/subscriptions
        payload:
          org_id: ${o}
          plan_id: ${pl}
          seats_purchased: 1
        as: SystemAdmin
        captures:
          s: $.data.id
      - call: POST /licensing/subscriptions/${s}/activate
        payload: {}
        as: SystemAdmin
        captures:
          sv: $.data.version
      - call: POST /licensing/cancellation-requests
        payload:
          subscription_id: ${s}
          requested_by_admin_id: ${oa}
        as: OrgAdmin
        as_user_id: ${oa}
        captures:
          cr: $.data.id
      - call: POST /licensing/_clock/set_current_utc
        payload:
          to_iso8601: '2026-09-02T00:00:00Z'
        as: SystemAdmin
      - call: POST /licensing/cancellation-requests/${cr}/finalize
        payload: {}
        as: SystemAdmin
      trigger:
      - call: POST /licensing/subscriptions/${s}/settle
        payload: {}
        as: SystemAdmin
        captures:
          e: $.data.error_id
      assert:
      - response error_id == ERR_INVALID_STATE
      - Subscription.${s}.status == CANCELLED_IN_WINDOW
  - name: transfer_request_invalid_from_executed
    claim_type: invalid_transition
    grounds:
    - state_machines.TransferRequest
    - errors[ERR_INVALID_STATE]
    distinguishing_aspect: Approve on an EXECUTED transfer request returns ERR_INVALID_STATE (trigger not listed from EXECUTED).
    test_recipe:
      setup:
      - Org with two admins; assigned seat; transfer created by admin1, approved by admin2, executed
      setup_api_calls:
      - call: POST /licensing/organizations
        payload:
          name: B0
          org_type: INDIVIDUAL
          primary_admin_id: 00000000-0000-0000-0000-000000000000
        as: SystemAdmin
