  - section: rbac
    instances:
      - name: rbac_exclusive_operation_denials_rejected
        claim_type: authorization
        grounds:
          - rbac.ProgramAdmin.exclusive_operations
          - rbac.EligibilityAnalyst.exclusive_operations
          - rbac.CapabilityReviewer.exclusive_operations
          - rbac.ScoringOfficer.exclusive_operations
          - rbac.EnvironmentalReviewer.exclusive_operations
          - rbac.AuditOfficer.exclusive_operations
          - rbac.Subgrantee.exclusive_operations
          - validations.ERR_UNAUTHORIZED
        distinguishing_aspect: |
          The role model is segregation_of_duties rather than hierarchical_override, so ProgramAdmin is
          deliberately NOT a superset: it cannot triage a challenge, cannot record a capability
          determination, cannot produce a score sheet, cannot clear an environmental review, cannot
          record an audit result and cannot submit milestone evidence. Every denial is priority 12,
