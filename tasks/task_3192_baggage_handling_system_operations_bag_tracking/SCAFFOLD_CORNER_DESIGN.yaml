            - "the second resolve returns 409 with error_id ERR_SCREENING_EVENT_NOT_ALARMED"
            - "ScreeningEvent.${se}.resolution_outcome is still CLEARED, not REJECTED"
            - "Bag.${bag}.screening_status is still CLEARED and custody_status is still SORTED"
            - "ScreeningEvent.${se}.version advanced by exactly 1 across the two calls"

      - name: resolved_screening_reopen_requires_a_closed_window
