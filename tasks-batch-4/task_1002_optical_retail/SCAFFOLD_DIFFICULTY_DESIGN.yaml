scaffold_difficulty_design:

  # ===========================================================================
  # Rule 1 — Dual-variant calculations across different entity domains
  # ===========================================================================
  - rule_id: dual_variant_calc
    instances:

      - name: order_quote_estimated_vs_final_after_in_network_adjudication
        grounds:
          - calculations.order_price_quote
          - calculations.lens_upcharge
          - entities.Order.fields.quote_variant
          - entities.Order.fields.benefit_applied_cents
          - entities.Order.fields.customer_due_cents
          - state_machines.InsuranceClaim.SUBMITTED_to_ADJUDICATED_APPROVED
        distinguishing_aspect: |
          This dual variant lives in the MONEY domain on the Order entity: the identical order
          (frame 19500, lens_upcharge 17950, discount 3745, FSA 5000) yields customer_due_cents
          == 50 under the ESTIMATED variant and customer_due_cents == 8705 under the FINAL
          variant, because FINAL caps benefit_applied_cents at the insurer's allowed_amount_cents
          (20000) while ESTIMATED uses the retailer's own 28655 allowance reading.
        test_recipe:
          setup:
            - "IN_NETWORK policy with frame_allowance_cents 15000, lens_copay_cents 2500."
            - "Customer enrolled on that policy with fsa_balance_cents 10000."
            - "VERIFIED prescription with rx_power exactly 6.00; frame 19500c; lens M167 + coatings AR + BLUE."
            - "Order confirmed with fsa_amount_cents 5000 — ESTIMATED quote stands at customer_due_cents 50, and confirmation minted an InsuranceClaim in SUBMITTED."
          setup_api_calls:
            - call: "POST /optical/insurance-policies"
              payload: { member_id: "VSP-001", network: "IN_NETWORK", frame_allowance_cents: 15000, lens_copay_cents: 2500, annual_max_cents: 30000, plan_year_start: "2026-01-01T00:00:00Z" }
              as: PlatformAdmin
              captures: { pol_id: $.data.id }
            - call: "POST /optical/frames"
              payload: { sku: "FRM-001", name: "Percey", brand: "WP", price_cents: 19500, tryon_stock: 2, min_pd_mm: 54.0, max_pd_mm: 70.0 }
              as: PlatformAdmin
              captures: { frame_id: $.data.id }
            - call: "POST /optical/lens-options"
              payload: { code: "M167", category: "MATERIAL", base_price_cents: 12000, material_index: 1.67 }
              as: PlatformAdmin
              captures: { m167_id: $.data.id }
            - call: "POST /optical/lens-options"
              payload: { code: "AR", category: "COATING", base_price_cents: 4000 }
              as: PlatformAdmin
              captures: { ar_id: $.data.id }
            - call: "POST /optical/lens-options"
              payload: { code: "BLUE", category: "COATING", base_price_cents: 3000 }
              as: PlatformAdmin
              captures: { blue_id: $.data.id }
            - call: "POST /optical/customers"
              payload: { full_name: "Ada Lens", email: "ada@x.com", dob: "1990-03-04T00:00:00Z", insurance_policy_id: "${pol_id}", fsa_balance_cents: 10000 }
              as: PlatformAdmin
              captures: { cust_id: $.data.id }
            - call: "POST /optical/prescriptions"
              payload: { customer_id: "${cust_id}", od_sphere: -5.50, od_cylinder: -1.00, os_sphere: -5.00, os_cylinder: 0.00, pd_mm: 63.0, prism_diopters: 0.0, issued_at: "2026-04-01T00:00:00Z", expires_at: "2027-04-01T00:00:00Z" }
              as: Customer
              as_user_id: "${cust_id}"
              captures: { rx_id: $.data.id }
            - call: "POST /optical/prescriptions/${rx_id}/verify"
              payload: { decision: "VERIFIED" }
              as: OpticianVerifier
            - call: "POST /optical/orders"
              payload: { customer_id: "${cust_id}", prescription_id: "${rx_id}", frame_id: "${frame_id}", material_option_id: "${m167_id}", coating_option_ids: ["${ar_id}", "${blue_id}"], delivery_method: "SHIP" }
              as: Customer
              as_user_id: "${cust_id}"
              captures: { ord_id: $.data.id }
            - call: "POST /optical/orders/${ord_id}/confirm"
              payload: { fsa_amount_cents: 5000 }
              as: Customer
              as_user_id: "${cust_id}"
            - call: "GET /optical/insurance-claims?order_id=${ord_id}"
              as: BenefitsAdmin
              captures: { claim_id: "$.data[0].id" }
          trigger:
            - call: "POST /optical/insurance-claims/${claim_id}/adjudicate"
              payload: { decision: "APPROVED", allowed_amount_cents: 20000 }
              as: BenefitsAdmin
          assert:
            - "Order.${ord_id}.lens_upcharge_cents == 17950"
            - "Order.${ord_id}.subtotal_cents == 37450"
            - "Order.${ord_id}.discount_cents == 3745"
            - "Order.${ord_id}.quote_variant == FINAL"
            - "Order.${ord_id}.benefit_applied_cents == 20000"
            - "Order.${ord_id}.fsa_applied_cents == 5000"
            - "Order.${ord_id}.customer_due_cents == 8705"
            - "InsuranceClaim.${claim_id}.approved_amount_cents == 20000"
            - "InsuranceClaim.${claim_id}.status == ADJUDICATED_APPROVED"

      - name: risk_score_rolling_vs_strict_variant_on_customer
        grounds:
          - calculations.customer_return_risk_score
          - entities.Customer.fields.return_risk_score
          - entities.Customer.fields.lifetime_kit_count
          - state_machines.HomeTryOnKit.SHIPPED_to_OVERDUE
        distinguishing_aspect: |
          This dual variant lives in the RISK-SCORING domain on the Customer entity, not the money
          domain: with three lifetime kits (one clean kit due 2025-11-12, two zero-kept overdue
          kits) the STRICT variant is selected (lifetime_kit_count >= 3) and yields
          return_risk_score == 67, whereas the ROLLING 180-day variant would drop the 2025-11-12
          kit out of the window and yield 100.
        test_recipe:
          setup:
            - "Frame with tryon_stock 3, customer with no policy."
            - "Kit K0: window 2025-11-02..2025-11-12, shipped, returned on time on 2025-11-10 keeping the frame (kept_count 1, was_overdue false)."
            - "Kit K1: window 2026-04-02..2026-04-12, shipped, flipped OVERDUE by the clock at 2026-04-20, returned keeping nothing (kept_count 0, was_overdue true) — score is 50 at that point, below the 70 gate."
            - "Kit K2: window 2026-04-21..2026-05-01, shipped, still out."
          setup_api_calls:
            - call: "POST /optical/frames"
              payload: { sku: "FRM-TRY", name: "Haskell", brand: "WP", price_cents: 9500, tryon_stock: 3, min_pd_mm: 50.0, max_pd_mm: 75.0 }
              as: PlatformAdmin
              captures: { frame_id: $.data.id }
            - call: "POST /optical/customers"
              payload: { full_name: "Rex Roamer", email: "rex@x.com", dob: "1988-01-01T00:00:00Z" }
              as: PlatformAdmin
              captures: { cust_id: $.data.id }
            - call: "POST /optical/_clock/set_current_utc"
              payload: { to_iso8601: "2025-11-01T00:00:00Z" }
              as: PlatformAdmin
            - call: "POST /optical/home-try-on-kits"
              payload: { customer_id: "${cust_id}", frame_ids: ["${frame_id}"], ship_date: "2025-11-02T00:00:00Z", due_date: "2025-11-12T00:00:00Z" }
              as: Customer
              as_user_id: "${cust_id}"
              captures: { k0_id: $.data.id }
            - call: "POST /optical/home-try-on-kits/${k0_id}/ship"
              payload: {}
              as: StoreAssociate
            - call: "POST /optical/_clock/set_current_utc"
              payload: { to_iso8601: "2025-11-10T00:00:00Z" }
              as: PlatformAdmin
            - call: "POST /optical/home-try-on-kits/${k0_id}/return"
              payload: { kept_frame_ids: ["${frame_id}"] }
              as: Customer
              as_user_id: "${cust_id}"
            - call: "POST /optical/_clock/set_current_utc"
              payload: { to_iso8601: "2026-04-01T00:00:00Z" }
              as: PlatformAdmin
            - call: "POST /optical/home-try-on-kits"
              payload: { customer_id: "${cust_id}", frame_ids: ["${frame_id}"], ship_date: "2026-04-02T00:00:00Z", due_date: "2026-04-12T00:00:00Z" }
              as: Customer
              as_user_id: "${cust_id}"
              captures: { k1_id: $.data.id }
            - call: "POST /optical/home-try-on-kits/${k1_id}/ship"
              payload: {}
              as: StoreAssociate
            - call: "POST /optical/_clock/set_current_utc"
              payload: { to_iso8601: "2026-04-20T00:00:00Z" }
              as: PlatformAdmin
            - call: "POST /optical/home-try-on-kits/${k1_id}/return"
              payload: { kept_frame_ids: [] }
              as: Customer
              as_user_id: "${cust_id}"
            - call: "POST /optical/home-try-on-kits"
              payload: { customer_id: "${cust_id}", frame_ids: ["${frame_id}"], ship_date: "2026-04-21T00:00:00Z", due_date: "2026-05-01T00:00:00Z" }
              as: Customer
              as_user_id: "${cust_id}"
              captures: { k2_id: $.data.id }
            - call: "POST /optical/home-try-on-kits/${k2_id}/ship"
              payload: {}
              as: StoreAssociate
          trigger:
            - call: "POST /optical/_clock/set_current_utc"
              payload: { to_iso8601: "2026-05-20T00:00:00Z" }
              as: PlatformAdmin
          assert:
            - "HomeTryOnKit.${k2_id}.status == OVERDUE"
            - "HomeTryOnKit.${k2_id}.was_overdue == true"
            - "HomeTryOnKit.${k1_id}.late_fee_cents == 4000"
            - "Customer.${cust_id}.lifetime_kit_count == 3"
            - "Customer.${cust_id}.return_risk_score == 67"

  # ===========================================================================
  # Rule 2 — Combinatorial formulas across different modes
  # ===========================================================================
  - rule_id: combinatorial_formula
    instances:

      - name: lens_upcharge_nested_min_max_tier_and_prism_branch
        grounds:
          - calculations.lens_upcharge
          - entities.Order.fields.lens_upcharge_cents
          - entities.Order.fields.subtotal_cents
          - entities.Order.fields.discount_cents
        distinguishing_aspect: |
          MODE (a): a five-input non-linear formula — rx_power (derived from four Rx fields via a
          nested max/max), a tiered required-index selection, a conditional prism branch, a
          count-conditional coating bundle discount, and a min/max-clamped high-power surcharge —
          giving lens_upcharge_cents == 31500 (20000 material + 4000 coating - 0 bundle
          + 4500 prism + min(6000, round_half_up((9.00-6.00)*1000)) == 3000).
        test_recipe:
          setup:
            - "Self-pay customer (no policy)."
            - "Frame priced 19500 with PD range 54.0-70.0."
            - "LensOption M174 (MATERIAL, index 1.74, 20000c) and AR (COATING, 4000c)."
            - "VERIFIED prescription od_sphere -8.00 / od_cylinder -2.00 / os_sphere -7.00 / os_cylinder -1.00 / prism 0.75 → rx_power 9.00, required tier 1.74."
          setup_api_calls:
            - call: "POST /optical/frames"
              payload: { sku: "FRM-002", name: "Wilkie", brand: "WP", price_cents: 19500, tryon_stock: 1, min_pd_mm: 54.0, max_pd_mm: 70.0 }
              as: PlatformAdmin
              captures: { frame_id: $.data.id }
            - call: "POST /optical/lens-options"
              payload: { code: "M174", category: "MATERIAL", base_price_cents: 20000, material_index: 1.74 }
              as: PlatformAdmin
              captures: { m174_id: $.data.id }
            - call: "POST /optical/lens-options"
              payload: { code: "AR", category: "COATING", base_price_cents: 4000 }
              as: PlatformAdmin
              captures: { ar_id: $.data.id }
            - call: "POST /optical/customers"
              payload: { full_name: "Ivo High", email: "ivo@x.com", dob: "1975-06-06T00:00:00Z" }
              as: PlatformAdmin
              captures: { cust_id: $.data.id }
            - call: "POST /optical/prescriptions"
              payload: { customer_id: "${cust_id}", od_sphere: -8.00, od_cylinder: -2.00, os_sphere: -7.00, os_cylinder: -1.00, pd_mm: 63.0, prism_diopters: 0.75, issued_at: "2026-04-01T00:00:00Z", expires_at: "2027-04-01T00:00:00Z" }
              as: Customer
              as_user_id: "${cust_id}"
              captures: { rx_id: $.data.id }
            - call: "POST /optical/prescriptions/${rx_id}/verify"
              payload: { decision: "VERIFIED" }
              as: OpticianVerifier
          trigger:
            - call: "POST /optical/orders"
              payload: { customer_id: "${cust_id}", prescription_id: "${rx_id}", frame_id: "${frame_id}", material_option_id: "${m174_id}", coating_option_ids: ["${ar_id}"], delivery_method: "SHIP" }
              as: Customer
              as_user_id: "${cust_id}"
              captures: { ord_id: $.data.id }
          assert:
            - "Order.${ord_id}.lens_upcharge_cents == 31500"
            - "Order.${ord_id}.subtotal_cents == 51000"
            - "Order.${ord_id}.discount_cents == 7650"
            - "Order.${ord_id}.benefit_applied_cents == 0"
            - "Order.${ord_id}.customer_due_cents == 43350"
            - "Order.${ord_id}.quote_variant == ESTIMATED"

      - name: oon_reimbursement_rounds_per_line_then_sums
        grounds:
          - calculations.oon_reimbursement
          - state_machines.InsuranceClaim.ADJUDICATED_APPROVED_to_REIMBURSED
          - entities.InsuranceClaim.fields.reimbursed_amount_cents
          - entities.InsurancePolicy.fields.annual_reimbursed_cents
          - concurrency_rules[claim-create-stale-order]
        distinguishing_aspect: |
          MODE (b): the rounding ORDER is what changes the answer. Two service lines each eligible
          for 4999c at 0.75 reimbursement give 3749 + 3749 == 7498 when each line is rounded first
          (the pinned order), but 7499 when the raw products are summed (9998 * 0.75 == 7498.5)
          and rounded once. reimbursed_amount_cents MUST be 7498, never 7499.
        test_recipe:
          setup:
            - "OUT_OF_NETWORK policy: oon_reimburse_pct 0.75, oon_fee_schedule {92004: 5000, V2020: 5000}, annual_max_cents 25000, frame_allowance_cents 0, lens_copay_cents 0."
            - "Customer on that policy; self-pay order confirmed (OON gives no point-of-sale benefit), so an auto-claim with empty service_lines exists."
            - "BenefitsAdmin files a superseding claim carrying the two 4999c service lines, and the insurer approves it."
          setup_api_calls:
            - call: "POST /optical/insurance-policies"
              payload: { member_id: "OON-001", network: "OUT_OF_NETWORK", frame_allowance_cents: 0, lens_copay_cents: 0, annual_max_cents: 25000, plan_year_start: "2026-01-01T00:00:00Z", oon_reimburse_pct: 0.75, oon_fee_schedule: { "92004": 5000, "V2020": 5000 } }
              as: PlatformAdmin
              captures: { pol_id: $.data.id }
            - call: "POST /optical/frames"
              payload: { sku: "FRM-003", name: "Chamberlain", brand: "WP", price_cents: 19500, tryon_stock: 1, min_pd_mm: 54.0, max_pd_mm: 70.0 }
              as: PlatformAdmin
              captures: { frame_id: $.data.id }
            - call: "POST /optical/lens-options"
              payload: { code: "M150", category: "MATERIAL", base_price_cents: 0, material_index: 1.50 }
              as: PlatformAdmin
              captures: { m150_id: $.data.id }
            - call: "POST /optical/customers"
              payload: { full_name: "Oona Netz", email: "oona@x.com", dob: "1992-02-02T00:00:00Z", insurance_policy_id: "${pol_id}" }
              as: PlatformAdmin
              captures: { cust_id: $.data.id }
            - call: "POST /optical/prescriptions"
              payload: { customer_id: "${cust_id}", od_sphere: -3.00, od_cylinder: -1.00, os_sphere: -2.50, os_cylinder: -0.50, pd_mm: 63.0, issued_at: "2026-04-01T00:00:00Z", expires_at: "2027-04-01T00:00:00Z" }
              as: Customer
              as_user_id: "${cust_id}"
              captures: { rx_id: $.data.id }
            - call: "POST /optical/prescriptions/${rx_id}/verify"
              payload: { decision: "VERIFIED" }
              as: OpticianVerifier
            - call: "POST /optical/orders"
              payload: { customer_id: "${cust_id}", prescription_id: "${rx_id}", frame_id: "${frame_id}", material_option_id: "${m150_id}", delivery_method: "SHIP" }
              as: Customer
              as_user_id: "${cust_id}"
              captures: { ord_id: $.data.id }
            - call: "POST /optical/orders/${ord_id}/confirm"
              payload: { fsa_amount_cents: 0 }
              as: Customer
              as_user_id: "${cust_id}"
              captures: { ord_v: $.data.version }
            - call: "POST /optical/insurance-claims"
              payload: { order_id: "${ord_id}", service_lines: [{ code: "92004", billed_cents: 4999 }, { code: "V2020", billed_cents: 4999 }], expected_order_version: "${ord_v}" }
              as: BenefitsAdmin
              captures: { claim_id: $.data.id }
            - call: "POST /optical/insurance-claims/${claim_id}/adjudicate"
              payload: { decision: "APPROVED", allowed_amount_cents: 7498 }
              as: BenefitsAdmin
          trigger:
            - call: "POST /optical/insurance-claims/${claim_id}/reimburse"
              payload: {}
              as: BenefitsAdmin
          assert:
            - "InsuranceClaim.${claim_id}.reimbursed_amount_cents == 7498"
            - "InsuranceClaim.${claim_id}.status == REIMBURSED"
            - "InsurancePolicy.${pol_id}.annual_reimbursed_cents == 7498"
            - "Order.${ord_id}.quote_variant == ESTIMATED"
            - "Order.${ord_id}.customer_due_cents == 19500"

  # ===========================================================================
  # Rule 3 — Non-linear state-machine shape on different entities
  # ===========================================================================
  - rule_id: non_linear_state_machine
    instances:

      - name: lab_order_remake_cycle_reenters_in_production
        grounds:
          - state_machines.LabOrder.IN_PRODUCTION_to_REMAKE_QUEUED
          - state_machines.LabOrder.REMAKE_QUEUED_to_IN_PRODUCTION
          - entities.LabOrder.fields.remake_count
        distinguishing_aspect: |
          CYCLE on the LabOrder entity: IN_PRODUCTION -> REMAKE_QUEUED -> IN_PRODUCTION is a true
          loop back to a previously-occupied state, and each traversal bumps remake_count while
          leaving the parent Order pinned at IN_LAB.
        test_recipe:
          setup:
            - "A confirmed self-pay order whose LabOrder is QUEUED."
            - "LabOrder started (IN_PRODUCTION, parent Order at IN_LAB) and failed QC once (REMAKE_QUEUED, remake_count 1)."
          setup_api_calls:
            - call: "POST /optical/frames"
              payload: { sku: "FRM-004", name: "Durand", brand: "WP", price_cents: 9500, tryon_stock: 1, min_pd_mm: 54.0, max_pd_mm: 70.0 }
              as: PlatformAdmin
              captures: { frame_id: $.data.id }
            - call: "POST /optical/lens-options"
              payload: { code: "M150", category: "MATERIAL", base_price_cents: 0, material_index: 1.50 }
              as: PlatformAdmin
              captures: { m150_id: $.data.id }
            - call: "POST /optical/customers"
              payload: { full_name: "Cy Cle", email: "cy@x.com", dob: "1991-01-01T00:00:00Z" }
              as: PlatformAdmin
              captures: { cust_id: $.data.id }
            - call: "POST /optical/prescriptions"
              payload: { customer_id: "${cust_id}", od_sphere: -1.00, od_cylinder: 0.00, os_sphere: -1.00, os_cylinder: 0.00, pd_mm: 62.0, issued_at: "2026-04-01T00:00:00Z", expires_at: "2027-04-01T00:00:00Z" }
              as: Customer
              as_user_id: "${cust_id}"
              captures: { rx_id: $.data.id }
            - call: "POST /optical/prescriptions/${rx_id}/verify"
              payload: { decision: "VERIFIED" }
              as: OpticianVerifier
            - call: "POST /optical/orders"
              payload: { customer_id: "${cust_id}", prescription_id: "${rx_id}", frame_id: "${frame_id}", material_option_id: "${m150_id}", delivery_method: "SHIP" }
              as: Customer
              as_user_id: "${cust_id}"
              captures: { ord_id: $.data.id }
            - call: "POST /optical/orders/${ord_id}/confirm"
              payload: {}
              as: Customer
              as_user_id: "${cust_id}"
            - call: "GET /optical/lab-orders?order_id=${ord_id}"
              as: LabTechnician
              captures: { lab_id: "$.data[0].id" }
            - call: "POST /optical/lab-orders/${lab_id}/start"
              payload: {}
              as: LabTechnician
            - call: "POST /optical/lab-orders/${lab_id}/qc"
              payload: { result: "FAIL", failure_reason: "axis off by 4 degrees" }
              as: LabTechnician
          trigger:
            - call: "POST /optical/lab-orders/${lab_id}/start"
              payload: {}
              as: LabTechnician
          assert:
            - "LabOrder.${lab_id}.status == IN_PRODUCTION"
            - "LabOrder.${lab_id}.remake_count == 1"
            - "LabOrder.${lab_id}.qc_failure_reason == 'axis off by 4 degrees'"
            - "Order.${ord_id}.fulfillment_status == IN_LAB"
            - "Order.${ord_id}.payment_status == AUTHORIZED"

      - name: order_payment_and_fulfillment_dimensions_advance_independently
        grounds:
          - entities.Order.fields.fulfillment_status
          - entities.Order.fields.payment_status
          - state_machines.Order.IN_LAB_to_SHIPPED
          - state_machines.LabOrder.QC_PASSED_to_SHIPPED
        distinguishing_aspect: |
          PARALLEL dimensions on the Order entity (a different entity from the cyclic LabOrder):
          fulfillment_status walks DRAFT -> CONFIRMED -> IN_LAB -> SHIPPED across three separate
          triggers while payment_status sits at AUTHORIZED for two of them and only moves to
          CAPTURED on the third; the two axes are never in lock-step.
        test_recipe:
          setup:
            - "A confirmed self-pay order (fulfillment CONFIRMED, payment AUTHORIZED)."
            - "LabOrder started — fulfillment advanced to IN_LAB while payment stayed AUTHORIZED."
            - "LabOrder passed QC (QC_PASSED) — neither Order dimension moved."
          setup_api_calls:
            - call: "POST /optical/frames"
              payload: { sku: "FRM-005", name: "Reilly", brand: "WP", price_cents: 9500, tryon_stock: 1, min_pd_mm: 54.0, max_pd_mm: 70.0 }
              as: PlatformAdmin
              captures: { frame_id: $.data.id }
            - call: "POST /optical/lens-options"
              payload: { code: "M150", category: "MATERIAL", base_price_cents: 0, material_index: 1.50 }
              as: PlatformAdmin
              captures: { m150_id: $.data.id }
            - call: "POST /optical/customers"
              payload: { full_name: "Pia Rallel", email: "pia@x.com", dob: "1993-03-03T00:00:00Z" }
              as: PlatformAdmin
              captures: { cust_id: $.data.id }
            - call: "POST /optical/prescriptions"
              payload: { customer_id: "${cust_id}", od_sphere: -1.00, od_cylinder: 0.00, os_sphere: -1.00, os_cylinder: 0.00, pd_mm: 62.0, issued_at: "2026-04-01T00:00:00Z", expires_at: "2027-04-01T00:00:00Z" }
              as: Customer
              as_user_id: "${cust_id}"
              captures: { rx_id: $.data.id }
            - call: "POST /optical/prescriptions/${rx_id}/verify"
              payload: { decision: "VERIFIED" }
              as: OpticianVerifier
            - call: "POST /optical/orders"
              payload: { customer_id: "${cust_id}", prescription_id: "${rx_id}", frame_id: "${frame_id}", material_option_id: "${m150_id}", delivery_method: "SHIP" }
              as: Customer
              as_user_id: "${cust_id}"
              captures: { ord_id: $.data.id }
            - call: "POST /optical/orders/${ord_id}/confirm"
              payload: {}
              as: Customer
              as_user_id: "${cust_id}"
            - call: "GET /optical/lab-orders?order_id=${ord_id}"
              as: LabTechnician
              captures: { lab_id: "$.data[0].id" }
            - call: "POST /optical/lab-orders/${lab_id}/start"
              payload: {}
              as: LabTechnician
            - call: "GET /optical/orders/${ord_id}"
              as: StoreAssociate
              captures: { fs_mid: $.data.fulfillment_status, ps_mid: $.data.payment_status }
            - call: "POST /optical/lab-orders/${lab_id}/qc"
              payload: { result: "PASS" }
              as: LabTechnician
          trigger:
            - call: "POST /optical/lab-orders/${lab_id}/ship"
              payload: {}
              as: LabTechnician
          assert:
            - "${fs_mid} == IN_LAB and ${ps_mid} == AUTHORIZED (the fulfillment axis moved twice while the payment axis moved once)"
            - "Order.${ord_id}.fulfillment_status == SHIPPED"
            - "Order.${ord_id}.payment_status == CAPTURED"
            - "LabOrder.${lab_id}.status == SHIPPED"
            - "LabOrder.${lab_id}.shipped_to_store_id == null"

  # ===========================================================================
  # Rule 4 — Transitive cascade chains from different triggers
  # ===========================================================================
  - rule_id: transitive_cascade
    instances:

      - name: order_cancel_cascades_order_to_lab_to_claim_to_policy_ledger
        grounds:
          - state_machines.Order.CONFIRMED_to_CANCELLED
          - state_machines.LabOrder.IN_PRODUCTION_to_CANCELLED
          - state_machines.InsuranceClaim.SUBMITTED_to_VOID
          - entities.InsurancePolicy.fields.frame_allowance_remaining_cents
        distinguishing_aspect: |
          Depth-4 chain originating at POST /orders/{id}/cancel: (L1) Order -> CANCELLED, which
          (L2) cancels its LabOrder, whose cancellation (L3) VOIDs the order's active
          InsuranceClaim, whose VOID (L4) credits 15000c back to the policy's
          frame_allowance_remaining_cents. Each hop is caused by the previous hop, not by the
          cancel call directly.
        test_recipe:
          setup:
            - "IN_NETWORK policy with frame_allowance_cents 15000; customer with fsa_balance_cents 10000."
            - "Order confirmed with fsa_amount_cents 5000: claim reserved 15000c (policy remaining 0), FSA balance dropped to 5000."
            - "LabOrder started — order fulfillment is IN_LAB, payment AUTHORIZED."
          setup_api_calls:
            - call: "POST /optical/insurance-policies"
              payload: { member_id: "VSP-002", network: "IN_NETWORK", frame_allowance_cents: 15000, lens_copay_cents: 2500, annual_max_cents: 30000, plan_year_start: "2026-01-01T00:00:00Z" }
              as: PlatformAdmin
              captures: { pol_id: $.data.id }
            - call: "POST /optical/frames"
              payload: { sku: "FRM-006", name: "Percey", brand: "WP", price_cents: 19500, tryon_stock: 1, min_pd_mm: 54.0, max_pd_mm: 70.0 }
              as: PlatformAdmin
              captures: { frame_id: $.data.id }
            - call: "POST /optical/lens-options"
              payload: { code: "M167", category: "MATERIAL", base_price_cents: 12000, material_index: 1.67 }
              as: PlatformAdmin
              captures: { m167_id: $.data.id }
            - call: "POST /optical/lens-options"
              payload: { code: "AR", category: "COATING", base_price_cents: 4000 }
              as: PlatformAdmin
              captures: { ar_id: $.data.id }
            - call: "POST /optical/lens-options"
              payload: { code: "BLUE", category: "COATING", base_price_cents: 3000 }
              as: PlatformAdmin
              captures: { blue_id: $.data.id }
            - call: "POST /optical/customers"
              payload: { full_name: "Cass Cade", email: "cass@x.com", dob: "1990-03-04T00:00:00Z", insurance_policy_id: "${pol_id}", fsa_balance_cents: 10000 }
              as: PlatformAdmin
              captures: { cust_id: $.data.id }
            - call: "POST /optical/prescriptions"
              payload: { customer_id: "${cust_id}", od_sphere: -5.50, od_cylinder: -1.00, os_sphere: -5.00, os_cylinder: 0.00, pd_mm: 63.0, issued_at: "2026-04-01T00:00:00Z", expires_at: "2027-04-01T00:00:00Z" }
              as: Customer
              as_user_id: "${cust_id}"
              captures: { rx_id: $.data.id }
            - call: "POST /optical/prescriptions/${rx_id}/verify"
              payload: { decision: "VERIFIED" }
              as: OpticianVerifier
            - call: "POST /optical/orders"
              payload: { customer_id: "${cust_id}", prescription_id: "${rx_id}", frame_id: "${frame_id}", material_option_id: "${m167_id}", coating_option_ids: ["${ar_id}", "${blue_id}"], delivery_method: "SHIP" }
              as: Customer
              as_user_id: "${cust_id}"
              captures: { ord_id: $.data.id }
            - call: "POST /optical/orders/${ord_id}/confirm"
              payload: { fsa_amount_cents: 5000 }
              as: Customer
              as_user_id: "${cust_id}"
            - call: "GET /optical/lab-orders?order_id=${ord_id}"
              as: LabTechnician
              captures: { lab_id: "$.data[0].id" }
            - call: "GET /optical/insurance-claims?order_id=${ord_id}"
              as: BenefitsAdmin
              captures: { claim_id: "$.data[0].id" }
            - call: "POST /optical/lab-orders/${lab_id}/start"
              payload: {}
              as: LabTechnician
          trigger:
            - call: "POST /optical/orders/${ord_id}/cancel"
              payload: { reason: "changed my mind" }
              as: Customer
              as_user_id: "${cust_id}"
          assert:
            - "Order.${ord_id}.fulfillment_status == CANCELLED"
            - "Order.${ord_id}.payment_status == REFUNDED"
            - "Order.${ord_id}.active_claim_id == null"
            - "LabOrder.${lab_id}.status == CANCELLED"
            - "InsuranceClaim.${claim_id}.status == VOID"
            - "InsuranceClaim.${claim_id}.reserved_frame_benefit_cents == 15000"
            - "InsurancePolicy.${pol_id}.frame_allowance_remaining_cents == 15000"
            - "Customer.${cust_id}.fsa_balance_cents == 10000"

      - name: kit_return_cascades_kit_to_items_to_frame_availability
        grounds:
          - state_machines.HomeTryOnKit.SHIPPED_to_RETURNED
          - entities.TryOnKitItem.fields.outcome
          - entities.Frame.fields.tryon_available
          - calculations.kit_late_fee
        distinguishing_aspect: |
          Depth-3 chain originating at a DIFFERENT trigger (POST /home-try-on-kits/{id}/return):
          (L1) kit -> RETURNED, which (L2) resolves each PENDING TryOnKitItem to KEPT or RETURNED,
          and each item's resolution (L3) increments its Frame's tryon_available by exactly one —
          including the KEPT item, because the physical sample comes back either way.
        test_recipe:
          setup:
            - "Frame F1 with tryon_stock 2 and Frame F2 with tryon_stock 1."
            - "Customer requested a kit holding [F1, F2] over 2026-05-05..2026-05-15 → F1.tryon_available 1, F2.tryon_available 0."
            - "Kit shipped; the clock is still at its 2026-05-01T00:00:00Z default, so the return is on time."
          setup_api_calls:
            - call: "POST /optical/frames"
              payload: { sku: "FRM-F1", name: "Wright", brand: "WP", price_cents: 9500, tryon_stock: 2, min_pd_mm: 50.0, max_pd_mm: 75.0 }
