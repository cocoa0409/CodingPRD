          - state_machines.PickupAppointment.status.BOOKED_to_MISSED
          - calculations.pickup_units
        excluded_because:
          difficulty_instance: compensating_invariant / appointment_cancel_and_missed_conserve_route_capacity_units
          rationale: "booked_units / available_units reconciliation across BOOKED, CANCELLED and MISSED is asserted at five observable instants there."

      - name: the_fulfillment_axis_reverts_to_delivered_while_the_trial_axis_holds_break_in
        claim_type: Valid Transition
        grounds:
          - state_machines.TrialOrder.fulfillment_status
          - state_machines.TrialOrder.trial_status
          - complexity_profile.state_machine_shape
        excluded_because:
          difficulty_instance: non_linear_state_machine / fulfillment_axis_cycles_damaged_reported_back_to_delivered_while_trial_axis_holds_break_in
          rationale: "That instance drives the DELIVERED -> DAMAGED_REPORTED -> DELIVERED cycle and asserts the combined state after every hop, including the untouched trial axis."
      - name: the_financial_axis_re_enters_authorized_after_a_void_via_supersede
        claim_type: Valid Transition
        grounds:
          - state_machines.ReturnCase.financial_status
          - endpoints[POST /refund-authorizations]
        excluded_because:
          difficulty_instance: non_linear_state_machine / return_case_financial_axis_returns_to_authorized_after_void_via_supersede
          rationale: "The VOID -> AUTHORIZED re-entry, the supersedes_refund_id chain and the refusal of a supersede without a voided predecessor are all asserted there."
      - name: voiding_a_released_refund_reverses_every_ledger_movement
        claim_type: Compensation
        grounds:
          - endpoints[POST /refund-authorizations/{id}/void]
          - state_machines.RefundAuthorization.status.RELEASED_to_VOIDED
        excluded_because:
          difficulty_instance: compensating_invariant / refund_release_then_void_conserves_the_paid_amount_ledger_identity
          rationale: "That instance asserts the ledger triple before the release, after the release and after the void, proving the compensation leaves no drift."
  - section: calculations
    instances:
      - name: order_pricing_rounds_the_bundle_discount_half_up
        claim_type: Precision
        grounds:
          - calculations.order_pricing
          - entities.TrialOrder.fields.bundle_discount_cents
        distinguishing_aspect: "12.5% off an odd gross price lands exactly on a half cent: 119999 * 1250 / 10000 = 14999.875, so round_half_up gives 15000 (not 14999 from truncation) and paid_amount_cents is 104999."
        test_recipe:
          setup:
            - "One QUEEN MattressModel and a FORFEIT_NONE PromotionBundle with percent_off_bps 1250."
            - "One Customer."
          setup_api_calls:
            - call: "POST /mattress-models"
              payload: { sku: "MDL-Q-C1", name: "Comfort Q", firmness: "MEDIUM", size: "QUEEN", list_price_cents: 119999 }
              as: PlatformAdmin
              captures: { model_id: $.data.id }
            - call: "POST /promotion-bundles"
              payload: { code: "BND-C1", unwind_policy: "FORFEIT_NONE", percent_off_bps: 1250 }
              as: PlatformAdmin
              captures: { bundle_id: $.data.id }
            - call: "POST /customers"
              payload: { email: "c1@example.com", full_name: "Cal One", household_hash: "HH-C1" }
              as: PlatformAdmin
              captures: { cust_id: $.data.id }
          trigger:
            - call: "POST /trial-orders"
              payload: { customer_id: "${cust_id}", model_id: "${model_id}", channel: "DTC", gross_price_cents: 119999, bundle_id: "${bundle_id}" }
              as: TrialSupportAgent
              captures: { order_id: $.data.id }
          assert:
            - "TrialOrder.${order_id}.bundle_discount_cents == 15000"
            - "TrialOrder.${order_id}.paid_amount_cents == 104999"
            - "TrialOrder.${order_id}.outstanding_refundable_cents == 104999"
            - "TrialOrder.${order_id}.refunded_total_cents == 0 and retained_amount_cents == 0"

      - name: warranty_indentation_credit_decays_one_thousand_bps_per_ownership_year
        claim_type: Correct Result
        grounds:
          - calculations.quality_claim_credit
          - validations[priority=28]
          - state_machines.QualityClaim.status.SUBMITTED_to_APPROVED
        distinguishing_aspect: "An indentation claim filed 2028-09-10 on a mattress delivered 2026-08-01 is 771 days old, so ownership_years = floor(771 / 365) = 2, coverage_bps = 10000 - 2 * 1000 = 8000 and the CREDIT is 120000 * 8000 / 10000 = 96000 - well above the 2000 bps floor. LASER_SCAN needs only 1 photograph."
        test_recipe:
          setup:
            - "One QUEEN MattressModel at 120000 cents with the default indentation_warranty_threshold_mm 25."
            - "One Customer whose DTC order was delivered 2026-08-01 and KEPT on 2026-09-10 (trial_status KEPT is required by validations[priority=28])."
            - "Clock advanced to 2028-09-10."
          setup_api_calls:
            - call: "POST /mattress-models"
              payload: { sku: "MDL-Q-C2", name: "Comfort Q", firmness: "MEDIUM", size: "QUEEN", list_price_cents: 120000 }
              as: PlatformAdmin
              captures: { model_id: $.data.id }
            - call: "POST /customers"
              payload: { email: "c2@example.com", full_name: "Cara Two", household_hash: "HH-C2" }
              as: PlatformAdmin
              captures: { cust_id: $.data.id }
            - call: "POST /trial-orders"
              payload: { customer_id: "${cust_id}", model_id: "${model_id}", channel: "DTC", gross_price_cents: 120000 }
              as: TrialSupportAgent
              captures: { order_id: $.data.id }
            - call: "POST /trial-orders/${order_id}/dispatch"
              payload: {}
              as: LogisticsCoordinator
            - call: "POST /trial-orders/${order_id}/deliver"
              payload: {}
              as: LogisticsCoordinator
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-09-10T00:00:00Z" }
              as: PlatformAdmin
            - call: "POST /trial-orders/${order_id}/keep"
              payload: {}
              as: Customer
              as_user_id: "${cust_id}"
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2028-09-10T00:00:00Z" }
              as: PlatformAdmin
          trigger:
            - call: "POST /quality-claims"
              payload: { order_id: "${order_id}", claim_type: "WARRANTY_INDENTATION", photo_evidence_count: 1, measurement_method: "LASER_SCAN", measured_indentation_mm: 30 }
              as: Customer
              as_user_id: "${cust_id}"
              captures: { claim_id: $.data.id }
            - call: "POST /quality-claims/${claim_id}/adjudicate"
              payload: { resolution: "CREDIT" }
              as: TrialSupportAgent
              as_user_id: "agent-c2"
          assert:
            - "trigger call 1 -> 201 (1 photograph satisfies MIN_PHOTOS_LASER and 30 mm clears the 25 mm threshold)"
            - "QualityClaim.${claim_id}.ownership_years == 2 and coverage_bps == 8000"
            - "QualityClaim.${claim_id}.status == APPROVED and resolution == CREDIT and credit_cents == 96000"
            - "QualityClaim.${claim_id}.approved_by_user_id == agent-c2"
            - "TrialOrder.${order_id}.fulfillment_status == CLOSED (a warranty claim never reopens a closed order) and goodwill_credit_cents == 0 until settlement"

