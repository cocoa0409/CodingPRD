              payload: { full_name: "Payer", email: "py@example.com", household_id: "HH-1" }
              as: Anonymous
              captures: { c1: $.data.id }
            - call: "POST /mint/collectors"
              payload: { full_name: "Waiter", email: "wt@example.com", household_id: "HH-2" }
              as: Anonymous
              captures: { c2: $.data.id }
            - call: "POST /mint/orders"
              payload: { product_id: "${p_id}", quantity: 3 }
              as: Collector
              as_user_id: "${c1}"
              captures: { o1: $.data.id }
            - call: "POST /mint/orders/${o1}/pay"
              payload: { amount_cents: 6000 }
              as: Collector
              as_user_id: "${c1}"
            - call: "POST /mint/orders"
              payload: { product_id: "${p_id}", quantity: 1 }
              as: Collector
              as_user_id: "${c2}"
              captures: { o2: $.data.id }
          trigger:
            - call: "POST /mint/products/${p_id}/withdraw"
              as: ProgramManager
          assert:
            - "NumismaticProduct.${p_id}.status == WITHDRAWN and allocated_units == 0"
            - "NumismaticOrder.${o1}.payment_status == REFUNDED and allocation_status == RELEASED and status == CANCELLED"
            - "NumismaticOrder.${o2}.allocation_status == RELEASED and payment_status == UNPAID and status == CANCELLED (no promotion into a terminal product)"

      - name: lot_double_receive_rejected
        claim_type: invalid_transition
        grounds: ["state_machines.MetalProcurementLot", "errors[ERR_LOT_NOT_RECEIVABLE]"]
        distinguishing_aspect: "Receiving a DELIVERED (terminal) lot again fails ERR_LOT_NOT_RECEIVABLE; blank stock is credited exactly once."
