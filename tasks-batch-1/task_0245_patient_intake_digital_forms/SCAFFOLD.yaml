# =============================================================================
# PRD Benchmark Scaffold — Patient Intake & Digital Forms
# Difficulty band: EXPERT (§0.4)
# =============================================================================

scenario: |
  245. Patient Intake & Digital Forms: pre-visit registration, insurance-card
  capture & eligibility, consent/HIPAA e-signature, medical-history
  questionnaire, copay collection, demographics sync, kiosk/queue, reminder &
  form expiration

domain_name: patient-intake-digital-forms
api_prefix: ""

# -----------------------------------------------------------------------------
# Complexity Profile (§0.3) — Expert band
# -----------------------------------------------------------------------------
complexity_profile:
  primary_archetype: workflow_orchestration
  secondary_archetype: compliance_audit
  complexity_layers:
    - cascading_side_effects
    - dual_variant_calculation
    - scheduled_actions
    - derived_field_reconciliation
    - optimistic_concurrency
    - rate_threshold_triggers

  entity_topology: flat
  # Peer entities (Clinic, Provider, Patient, Appointment, IntakeSession, ...)
  # linked by FK references; paths are flat (/intake-sessions/{id}), not nested.

  state_machine_shape: parallel
  # IntakeSession carries two independent dimensions: workflow_status and
  # financial_status. Several child machines (EligibilityCheck, ConsentDocument,
  # QuestionnaireResponse) are cyclic (re-verify / re-issue / revise loops);
  # CopayPayment and KioskQueueEntry branch with compensation.

  relationship_patterns:
    - one_to_many        # IntakeSession -> ConsentDocument / QuestionnaireResponse / Reminder
    - cross_aggregate    # KioskQueueEntry references ExamRoom across the session tree
    - polymorphic        # Reminder.target_kind selects which child completion it nudges

  role_model: peer_roles
  # FrontDeskStaff owns registration/queue; Patient signs/answers on the kiosk;
  # BillingClerk owns copay; ClinicAdmin owns clinic/provider/room config.

  consistency_model: immediate

# -----------------------------------------------------------------------------
# §1.0 Response Envelope (FIXED — EMITTED VERBATIM)
# -----------------------------------------------------------------------------
response_envelope:
  success: |
    { "meta": { "api_request_id": "req_xxx", "api_request_timestamp": "ISO8601" },
      "response_type": "object" | "array", "data": {} }
  error: |
    { "meta": { ... }, "response_type": "error",
      "data": { "error_id": "ERR_XXX", "message": "..." } }
  pagination_fields: ["limit", "offset", "total_count", "has_more"]
  pagination_defaults: { limit: 10, min: 1, max: 100, offset: 0 }

# =============================================================================
# §1.1 Entity-Relationship Table
# =============================================================================
entities:
  - name: Clinic
    parent: null
    common_fields: true   # id, created_at, updated_at, version
    fields:
      - { name: name, type: string, source: input, description: "Clinic display name" }
      - { name: timezone, type: string, source: input, default: "UTC", description: "IANA timezone used for quiet-hours and expiration math" }
      - { name: form_expiration_hours, type: integer, source: input, default: 72, description: "Hours after IntakeSession creation at which an incomplete packet auto-expires; must be > 0" }
      - { name: reminder_quiet_start_min, type: integer, source: input, default: 1320, description: "Quiet-hours window start, minutes-from-midnight local (default 22:00)" }
      - { name: reminder_quiet_end_min, type: integer, source: input, default: 420, description: "Quiet-hours window end, minutes-from-midnight local (default 07:00); window wraps past midnight" }
      - { name: reminder_min_gap_minutes, type: integer, source: input, default: 240, description: "Minimum gap between two reminders on the same IntakeSession; must be > 0" }
      - { name: copay_rounding, type: enum, source: input, default: "PER_LINE_THEN_SUM", description: "PER_LINE_THEN_SUM | SUM_THEN_ROUND — pins patient-responsibility rounding order" }
      - { name: facility_fee_cents, type: integer, source: input, default: 0, description: "Flat per-visit facility fee added into patient responsibility; non-negative" }
      - { name: current_utc, type: datetime, source: system, default: "1970-01-01T00:00:00.000Z", description: "Deterministic clock; advances only via POST /_clock/set_current_utc" }
      - { name: collected_copay_cents, type: integer, source: computed, default: 0, description: "Sum of captured CopayPayment.amount_cents minus refunded amounts across this clinic; conserved-quantity ledger; never negative" }
      - { name: active_queue_count, type: integer, source: computed, default: 0, description: "Count of KioskQueueEntry in {WAITING, CALLED, IN_ROOM} for this clinic" }

  - name: Provider
    parent: null
    common_fields: true
    fields:
      - { name: clinic_id, type: string, source: input, description: "FK -> Clinic.id" }
      - { name: full_name, type: string, source: input, description: "Provider name" }
      - { name: cleanup_buffer_minutes, type: integer, source: input, default: 0, description: "Buffer appended after each appointment's end before the provider is free again; non-negative" }
      - { name: required_consent_codes, type: array, source: input, description: "Consent template codes every IntakeSession for this provider must collect (e.g. [HIPAA_NPP, TREATMENT_CONSENT]); empty array allowed" }
      - { name: questionnaire_required_sections, type: array, source: input, description: "Section keys the medical-history questionnaire must answer for this provider (e.g. [ALLERGIES, MEDICATIONS, HISTORY]); empty array means questionnaire trivially complete" }

  - name: ExamRoom
    parent: null
    common_fields: true
    fields:
      - { name: clinic_id, type: string, source: input, description: "FK -> Clinic.id" }
      - { name: label, type: string, source: input, description: "Room label, e.g. Room 3" }

  - name: Patient
    parent: null
    common_fields: true
    fields:
      - { name: clinic_id, type: string, source: input, description: "FK -> Clinic.id" }
      - { name: legal_name, type: string, source: input, description: "Patient legal name" }
      - { name: date_of_birth, type: string, source: input, description: "ISO date YYYY-MM-DD" }
      - { name: phone, type: string, source: input, description: "Contact phone for reminders" }
      - { name: demographics_revision, type: integer, source: system, default: 1, description: "Bumps each time a DemographicsSyncJob commits new demographics into the patient of record" }

  - name: Appointment
    parent: null
    common_fields: true
    fields:
      - { name: clinic_id, type: string, source: input, description: "FK -> Clinic.id" }
      - { name: provider_id, type: string, source: input, description: "FK -> Provider.id" }
      - { name: patient_id, type: string, source: input, description: "FK -> Patient.id" }
      - { name: start_utc, type: datetime, source: input, description: "Appointment start, ISO 8601 UTC" }
      - { name: end_utc, type: datetime, source: input, description: "Appointment end, ISO 8601 UTC; must be strictly after start_utc" }
      - { name: plan_default_copay_cents, type: integer, source: input, default: 0, description: "Plan's posted office-visit copay used for the provisional estimate; non-negative" }
      - { name: provisional_copay_cents, type: integer, source: computed, description: "Forward-looking copay estimate computed at appointment creation (see calc estimate_copay)" }
      - { name: status, type: enum, source: system, default: "SCHEDULED", description: "SCHEDULED | INTAKE_OPENED | CANCELLED" }

  - name: IntakeSession
    parent: null
    common_fields: true
    fields:
      - { name: appointment_id, type: string, source: input, description: "FK -> Appointment.id; one open session per appointment" }
      - { name: clinic_id, type: string, source: system, description: "FK -> Clinic.id; copied from appointment" }
      - { name: provider_id, type: string, source: system, description: "FK -> Provider.id; copied from appointment" }
      - { name: patient_id, type: string, source: system, description: "FK -> Patient.id; copied from appointment" }
      - { name: expires_at, type: datetime, source: computed, description: "= created_at + clinic.form_expiration_hours; packet auto-expires at-or-after this instant" }
      - { name: workflow_status, type: enum, source: system, default: "DRAFT", description: "DRAFT | IN_PROGRESS | READY_FOR_VISIT | CHECKED_IN | COMPLETED | EXPIRED | CANCELLED — independent dimension" }
      - { name: financial_status, type: enum, source: system, default: "PENDING_ELIGIBILITY", description: "PENDING_ELIGIBILITY | INSURED | SELF_PAY | COPAY_DUE | COPAY_SETTLED | WAIVED — independent dimension" }
      - { name: forms_complete, type: boolean, source: computed, default: false, description: "True iff every required ConsentDocument is SIGNED AND the QuestionnaireResponse is ACCEPTED AND insurance eligibility is resolved (not VERIFYING)" }
      - { name: final_patient_responsibility_cents, type: integer, source: computed, description: "Finalized patient responsibility after eligibility resolves (see calc finalize_patient_responsibility); null until eligibility resolved" }

  - name: InsuranceCard
    parent: null
    common_fields: true
    fields:
      - { name: intake_session_id, type: string, source: input, description: "FK -> IntakeSession.id" }
      - { name: payer_name, type: string, source: input, description: "Insurance payer" }
      - { name: member_id, type: string, source: input, description: "Member/subscriber id printed on card" }
      - { name: plan_copay_cents, type: integer, source: input, default: 0, description: "Copay printed on card for office visits; non-negative" }
      - { name: plan_coinsurance_pct, type: integer, source: input, default: 0, description: "Medical coinsurance percent (0-100) applied to the above-deductible portion of the allowed amount" }
      - { name: facility_coinsurance_pct, type: integer, source: input, default: 0, description: "Facility coinsurance percent (0-100) applied to clinic.facility_fee_cents; second fractional leg" }
      - { name: remaining_deductible_cents, type: integer, source: input, default: 0, description: "Deductible the member still owes before coinsurance kicks in; non-negative" }
      - { name: visit_allowed_amount_cents, type: integer, source: input, default: 0, description: "Plan's allowed amount for this visit, basis for coinsurance; non-negative" }
      - { name: eligibility_status, type: enum, source: system, default: "UNVERIFIED", description: "UNVERIFIED | VERIFYING | ELIGIBLE | INELIGIBLE | NEEDS_REVIEW" }

  - name: EligibilityCheck
    parent: null
    common_fields: false   # append-only event: id + created_at only
    fields:
      - { name: insurance_card_id, type: string, source: input, description: "FK -> InsuranceCard.id" }
      - { name: intake_session_id, type: string, source: system, description: "FK -> IntakeSession.id; copied from card" }
      - { name: outcome, type: enum, source: input, description: "ELIGIBLE | INELIGIBLE | NEEDS_REVIEW — payer response simulated by the verification endpoint" }
      - { name: provisional_responsibility_cents, type: integer, source: computed, description: "Provisional patient responsibility recorded at check time, deductible-unmet assumption (see calc finalize_patient_responsibility variant)" }

  - name: ConsentDocument
    parent: null
    common_fields: true
    fields:
      - { name: intake_session_id, type: string, source: input, description: "FK -> IntakeSession.id" }
      - { name: consent_code, type: string, source: input, description: "Template code, must be one of the provider.required_consent_codes" }
      - { name: signer_name, type: string, source: input, required: false, description: "Typed legal name captured at signing" }
      - { name: signed_at, type: datetime, source: system, required: false, description: "Clock instant the e-signature was applied; null until SIGNED" }
      - { name: revision, type: integer, source: system, default: 1, description: "Increments each time the document is re-issued after a revoke" }
      - { name: status, type: enum, source: system, default: "PENDING", description: "PENDING | SIGNED | REVOKED" }

  - name: QuestionnaireResponse
    parent: null
    common_fields: true
    fields:
      - { name: intake_session_id, type: string, source: input, description: "FK -> IntakeSession.id; one per session" }
      - { name: answered_sections, type: array, source: input, description: "Section keys answered so far, each with a section_key and a risk_weight integer 0-10" }
      - { name: provisional_risk_score, type: integer, source: computed, default: 0, description: "Sum of risk_weight over answered_sections at submit time (see calc questionnaire_risk_score provisional variant)" }
      - { name: final_risk_score, type: integer, source: computed, description: "Weighted final score over all required sections once accepted (see calc questionnaire_risk_score final variant); null until ACCEPTED" }
      - { name: high_risk_flag, type: boolean, source: computed, default: false, description: "True iff final_risk_score >= clinic-wide HIGH_RISK_THRESHOLD constant" }
      - { name: status, type: enum, source: system, default: "DRAFT", description: "DRAFT | SUBMITTED | ACCEPTED | FLAGGED" }

  - name: CopayPayment
    parent: null
    common_fields: true
    fields:
      - { name: intake_session_id, type: string, source: input, description: "FK -> IntakeSession.id" }
      - { name: amount_cents, type: integer, source: input, description: "Amount the front desk is authorizing; must equal the session's amount due at authorization time" }
      - { name: refunded_cents, type: integer, source: computed, default: 0, description: "Amount refunded after capture; 0 until REFUNDED" }
      - { name: status, type: enum, source: system, default: "AUTHORIZED", description: "AUTHORIZED | CAPTURED | VOIDED | REFUNDED" }

  - name: KioskQueueEntry
    parent: null
    common_fields: true
    fields:
      - { name: intake_session_id, type: string, source: input, description: "FK -> IntakeSession.id; one active entry per session" }
      - { name: clinic_id, type: string, source: system, description: "FK -> Clinic.id; copied from session" }
      - { name: exam_room_id, type: string, source: system, required: false, description: "FK -> ExamRoom.id; assigned when CALLED, null while WAITING" }
      - { name: enqueued_seq, type: integer, source: system, description: "Monotonic per-clinic sequence stamped at enqueue; FIFO ordering key" }
      - { name: status, type: enum, source: system, default: "WAITING", description: "WAITING | CALLED | IN_ROOM | DONE | NO_SHOW" }

  - name: RoomBooking
    parent: null
    common_fields: true
    fields:
      - { name: exam_room_id, type: string, source: input, description: "FK -> ExamRoom.id" }
      - { name: queue_entry_id, type: string, source: input, description: "FK -> KioskQueueEntry.id" }
      - { name: start_utc, type: datetime, source: input, description: "Booking start, ISO 8601 UTC" }
      - { name: end_utc, type: datetime, source: input, description: "Booking end, ISO 8601 UTC; must be strictly after start_utc" }

  - name: Reminder
    parent: null
    common_fields: true
    fields:
      - { name: intake_session_id, type: string, source: input, description: "FK -> IntakeSession.id" }
      - { name: target_kind, type: enum, source: input, description: "CONSENT | QUESTIONNAIRE | COPAY | GENERIC — which incomplete step this reminder nudges (polymorphic target)" }
      - { name: scheduled_utc, type: datetime, source: input, description: "When the reminder is meant to fire, ISO 8601 UTC" }
      - { name: scheduled_local_min, type: integer, source: input, description: "Minutes-from-midnight in clinic-local time for the scheduled instant; used for quiet-hours check" }
      - { name: status, type: enum, source: system, default: "SCHEDULED", description: "SCHEDULED | SENT | CANCELLED | SUPPRESSED" }

  - name: DemographicsSyncJob
    parent: null
    common_fields: true
    fields:
      - { name: intake_session_id, type: string, source: input, description: "FK -> IntakeSession.id" }
      - { name: idempotency_key, type: string, source: input, description: "Client-supplied key; a repeat with the same key returns the original job instead of creating a new one" }
      - { name: synced_legal_name, type: string, source: input, description: "Demographics snapshot pushed to the patient of record" }
      - { name: synced_phone, type: string, source: input, description: "Phone snapshot pushed to the patient of record" }
      - { name: status, type: enum, source: system, default: "QUEUED", description: "QUEUED | COMMITTED | SKIPPED_DUPLICATE" }

# =============================================================================
# §1.2 State Machine Table
# =============================================================================
state_machines:
  # --- IntakeSession: workflow_status dimension ---
  - entity: IntakeSession
    dimension: workflow_status
    initial_state: DRAFT
    terminal_states: [COMPLETED, EXPIRED, CANCELLED]
    transitions:
      - from: DRAFT
        to: IN_PROGRESS
        trigger: "system (automatic on first child create: InsuranceCard, ConsentDocument, or QuestionnaireResponse against this session)"
        actor: system
        preconditions:
          - "Session workflow_status == DRAFT"
          - "Session not EXPIRED (clinic.current_utc < expires_at) (ERR_SESSION_EXPIRED)"
        side_effects:
          - "workflow_status -> IN_PROGRESS"

      - from: IN_PROGRESS
        to: READY_FOR_VISIT
        trigger: "system (automatic when forms_complete recomputes to true — see calc forms_complete)"
        actor: system
        preconditions:
          - "forms_complete == true"
          - "financial_status IN {INSURED, SELF_PAY, COPAY_SETTLED, WAIVED} (eligibility resolved, copay not still due) (ERR_COPAY_REQUIRED_BEFORE_READY)"
        side_effects:
          - "workflow_status -> READY_FOR_VISIT"
          - "CASCADE: auto-create one KioskQueueEntry with status WAITING for this session (enqueue side effect); clinic.active_queue_count += 1; clinic.version += 1"

      - from: READY_FOR_VISIT
        to: CHECKED_IN
        trigger: "POST /intake-sessions/{id}/check-in"
        actor: FrontDeskStaff
        preconditions:
          - "workflow_status == READY_FOR_VISIT (ERR_SESSION_NOT_READY)"
          - "Every required ConsentDocument for this session is SIGNED (cross-entity: ConsentDocument) (ERR_CONSENT_NOT_SIGNED)"
        side_effects:
          - "workflow_status -> CHECKED_IN"

      - from: CHECKED_IN
        to: COMPLETED
        trigger: "POST /intake-sessions/{id}/complete"
        actor: FrontDeskStaff
        preconditions:
          - "workflow_status == CHECKED_IN (ERR_SESSION_NOT_CHECKED_IN)"
          - "The session's KioskQueueEntry is DONE (cross-entity: KioskQueueEntry) (ERR_QUEUE_ENTRY_NOT_DONE)"
          - "financial_status IN {COPAY_SETTLED, WAIVED, INSURED, SELF_PAY} (ERR_COPAY_UNSETTLED)"
        side_effects:
          - "workflow_status -> COMPLETED"

      - from: DRAFT
        to: EXPIRED
        trigger: "POST /_clock/set_current_utc (automatic sweep when clinic.current_utc >= session.expires_at)"
        actor: system
        preconditions:
          - "workflow_status IN {DRAFT, IN_PROGRESS}"
          - "clinic.current_utc >= session.expires_at"
        side_effects:
          - "workflow_status -> EXPIRED"
          - "CASCADE: every SCHEDULED Reminder for this session -> SUPPRESSED"
          - "Every ConsentDocument PENDING for this session stays PENDING (signing later is blocked by ERR_SESSION_EXPIRED)"

      - from: IN_PROGRESS
        to: EXPIRED
        trigger: "POST /_clock/set_current_utc (automatic sweep when clinic.current_utc >= session.expires_at)"
        actor: system
        preconditions:
          - "workflow_status IN {DRAFT, IN_PROGRESS}"
          - "clinic.current_utc >= session.expires_at"
        side_effects:
          - "workflow_status -> EXPIRED"
          - "CASCADE: every SCHEDULED Reminder for this session -> SUPPRESSED"

      - from: DRAFT
        to: CANCELLED
        trigger: "POST /intake-sessions/{id}/cancel"
        actor: FrontDeskStaff
        preconditions:
          - "workflow_status IN {DRAFT, IN_PROGRESS, READY_FOR_VISIT} (ERR_SESSION_NOT_CANCELLABLE)"
        side_effects:
          - "workflow_status -> CANCELLED"
          - "CASCADE: if a non-terminal KioskQueueEntry exists, it -> NO_SHOW and clinic.active_queue_count -= 1 and clinic.version += 1"
          - "CASCADE: every SCHEDULED Reminder for this session -> CANCELLED"

      - from: IN_PROGRESS
        to: CANCELLED
        trigger: "POST /intake-sessions/{id}/cancel"
        actor: FrontDeskStaff
        preconditions:
          - "workflow_status IN {DRAFT, IN_PROGRESS, READY_FOR_VISIT} (ERR_SESSION_NOT_CANCELLABLE)"
        side_effects:
          - "workflow_status -> CANCELLED"
          - "CASCADE: every SCHEDULED Reminder for this session -> CANCELLED"

      - from: READY_FOR_VISIT
        to: CANCELLED
        trigger: "POST /intake-sessions/{id}/cancel"
        actor: FrontDeskStaff
        preconditions:
          - "workflow_status IN {DRAFT, IN_PROGRESS, READY_FOR_VISIT} (ERR_SESSION_NOT_CANCELLABLE)"
        side_effects:
          - "workflow_status -> CANCELLED"
          - "CASCADE: the WAITING KioskQueueEntry -> NO_SHOW; clinic.active_queue_count -= 1; clinic.version += 1"
          - "CASCADE: every SCHEDULED Reminder for this session -> CANCELLED"

  # --- IntakeSession: financial_status dimension (independent of workflow) ---
  - entity: IntakeSession
    dimension: financial_status
    initial_state: PENDING_ELIGIBILITY
    terminal_states: [COPAY_SETTLED, WAIVED]
    transitions:
      - from: PENDING_ELIGIBILITY
        to: INSURED
        trigger: "system (automatic when an EligibilityCheck with outcome ELIGIBLE resolves and final_patient_responsibility_cents == 0)"
        actor: system
        preconditions:
          - "Linked InsuranceCard eligibility_status -> ELIGIBLE"
          - "final_patient_responsibility_cents == 0"
        side_effects:
          - "financial_status -> INSURED"

      - from: PENDING_ELIGIBILITY
        to: COPAY_DUE
        trigger: "system (automatic when an EligibilityCheck with outcome ELIGIBLE resolves and final_patient_responsibility_cents > 0)"
        actor: system
        preconditions:
          - "Linked InsuranceCard eligibility_status -> ELIGIBLE"
          - "final_patient_responsibility_cents > 0"
        side_effects:
          - "financial_status -> COPAY_DUE"

      - from: PENDING_ELIGIBILITY
        to: SELF_PAY
        trigger: "system (automatic when an EligibilityCheck resolves INELIGIBLE — see cascade eligibility_ineligible)"
        actor: system
        preconditions:
          - "Linked InsuranceCard eligibility_status -> INELIGIBLE"
        side_effects:
          - "financial_status -> SELF_PAY"
          - "final_patient_responsibility_cents recomputed at self-pay rate (allowed amount, no plan offset)"

      - from: COPAY_DUE
        to: COPAY_SETTLED
        trigger: "system (automatic when a CopayPayment for this session reaches CAPTURED)"
        actor: system
        preconditions:
          - "A CopayPayment for this session is CAPTURED"
          - "captured amount_cents == final_patient_responsibility_cents"
        side_effects:
          - "financial_status -> COPAY_SETTLED"

      - from: COPAY_DUE
        to: WAIVED
        trigger: "POST /intake-sessions/{id}/waive-copay"
        actor: BillingClerk
        preconditions:
          - "financial_status == COPAY_DUE (ERR_COPAY_NOT_DUE)"
          - "high_risk_flag == false on the session's QuestionnaireResponse OR session has no questionnaire (ERR_WAIVE_BLOCKED_HIGH_RISK)"
        side_effects:
          - "financial_status -> WAIVED"

      - from: COPAY_SETTLED
        to: COPAY_DUE
        trigger: "system (automatic when the CAPTURED CopayPayment is REFUNDED — compensation)"
        actor: system
        preconditions:
          - "The session's CAPTURED CopayPayment -> REFUNDED"
        side_effects:
          - "financial_status -> COPAY_DUE"

  # --- InsuranceCard / eligibility: cyclic (NEEDS_REVIEW -> VERIFYING re-check) ---
  - entity: InsuranceCard
    initial_state: UNVERIFIED
    terminal_states: []
    transitions:
      - from: UNVERIFIED
        to: VERIFYING
        trigger: "POST /insurance-cards/{id}/verify"
        actor: FrontDeskStaff
        preconditions:
          - "eligibility_status IN {UNVERIFIED, NEEDS_REVIEW} (ERR_CARD_NOT_VERIFIABLE)"
          - "Parent IntakeSession not EXPIRED/CANCELLED (ERR_SESSION_EXPIRED)"
        side_effects:
          - "eligibility_status -> VERIFYING"

      - from: VERIFYING
        to: ELIGIBLE
        trigger: "POST /insurance-cards/{id}/resolve-eligibility (outcome=ELIGIBLE)"
        actor: FrontDeskStaff
        preconditions:
          - "eligibility_status == VERIFYING (ERR_CARD_NOT_VERIFYING)"
        side_effects:
          - "eligibility_status -> ELIGIBLE"
          - "create EligibilityCheck(outcome=ELIGIBLE); compute final_patient_responsibility_cents on session"
          - "CASCADE: session financial_status -> INSURED (resp==0) or COPAY_DUE (resp>0)"

      - from: VERIFYING
        to: INELIGIBLE
        trigger: "POST /insurance-cards/{id}/resolve-eligibility (outcome=INELIGIBLE)"
        actor: FrontDeskStaff
        preconditions:
          - "eligibility_status == VERIFYING (ERR_CARD_NOT_VERIFYING)"
        side_effects:
          - "eligibility_status -> INELIGIBLE"
          - "create EligibilityCheck(outcome=INELIGIBLE)"
          - "CASCADE chain (eligibility_ineligible): card INELIGIBLE -> session.final_patient_responsibility_cents recomputed at self-pay rate -> session financial_status -> SELF_PAY"

      - from: VERIFYING
        to: NEEDS_REVIEW
        trigger: "POST /insurance-cards/{id}/resolve-eligibility (outcome=NEEDS_REVIEW)"
        actor: FrontDeskStaff
        preconditions:
          - "eligibility_status == VERIFYING (ERR_CARD_NOT_VERIFYING)"
        side_effects:
          - "eligibility_status -> NEEDS_REVIEW"
          - "create EligibilityCheck(outcome=NEEDS_REVIEW)"

      - from: NEEDS_REVIEW
        to: VERIFYING
        trigger: "POST /insurance-cards/{id}/verify"
        actor: FrontDeskStaff
        preconditions:
          - "eligibility_status IN {UNVERIFIED, NEEDS_REVIEW} (ERR_CARD_NOT_VERIFIABLE)"
        side_effects:
          - "eligibility_status -> VERIFYING"
        note: "Re-verification loop: NEEDS_REVIEW can be retried, forming a cycle."

  # --- ConsentDocument: cyclic (revoke -> re-issue, revision bump) ---
  - entity: ConsentDocument
    initial_state: PENDING
    terminal_states: []
    transitions:
      - from: PENDING
        to: SIGNED
        trigger: "POST /consent-documents/{id}/sign"
        actor: Patient
        preconditions:
          - "status == PENDING (ERR_CONSENT_NOT_PENDING)"
          - "Parent IntakeSession workflow_status NOT IN {EXPIRED, CANCELLED, COMPLETED}; clinic.current_utc < session.expires_at (ERR_SESSION_EXPIRED)"
          - "signer_name present and non-empty (ERR_INVALID_REQUEST)"
        side_effects:
          - "status -> SIGNED; signed_at = clinic.current_utc"
          - "BUBBLE UP: recompute session.forms_complete; if it flips true and financial gate met, session workflow_status -> READY_FOR_VISIT (which itself enqueues a KioskQueueEntry)"

      - from: SIGNED
        to: REVOKED
        trigger: "POST /consent-documents/{id}/revoke"
        actor: Patient
        preconditions:
          - "status == SIGNED (ERR_CONSENT_NOT_SIGNED)"
          - "Parent IntakeSession workflow_status != CHECKED_IN and != COMPLETED (ERR_SESSION_LOCKED)"
        side_effects:
          - "status -> REVOKED; signed_at = null"
          - "BUBBLE UP: recompute session.forms_complete (now false); if session was READY_FOR_VISIT, revert it to IN_PROGRESS and set its WAITING KioskQueueEntry -> NO_SHOW (clinic.active_queue_count -= 1; clinic.version += 1)"

      - from: REVOKED
        to: PENDING
        trigger: "POST /consent-documents/{id}/reissue"
        actor: FrontDeskStaff
        preconditions:
          - "status == REVOKED (ERR_CONSENT_NOT_REVOKED)"
          - "Parent IntakeSession not EXPIRED/CANCELLED/COMPLETED (ERR_SESSION_EXPIRED)"
        side_effects:
          - "status -> PENDING; revision += 1"
        note: "Re-issue loop forms a cycle PENDING -> SIGNED -> REVOKED -> PENDING."

  # --- QuestionnaireResponse: cyclic (revise loop) ---
  - entity: QuestionnaireResponse
    initial_state: DRAFT
    terminal_states: []
    transitions:
      - from: DRAFT
        to: SUBMITTED
        trigger: "POST /questionnaire-responses/{id}/submit"
        actor: Patient
        preconditions:
          - "status == DRAFT (ERR_QUESTIONNAIRE_NOT_DRAFT)"
          - "Parent IntakeSession not EXPIRED/CANCELLED (ERR_SESSION_EXPIRED)"
        side_effects:
          - "status -> SUBMITTED; provisional_risk_score = sum of answered_sections[].risk_weight"

      - from: SUBMITTED
        to: ACCEPTED
        trigger: "POST /questionnaire-responses/{id}/accept"
        actor: FrontDeskStaff
        preconditions:
          - "status == SUBMITTED (ERR_QUESTIONNAIRE_NOT_SUBMITTED)"
          - "answered_sections cover every key in provider.questionnaire_required_sections (ERR_QUESTIONNAIRE_INCOMPLETE)"
        side_effects:
          - "status -> ACCEPTED; final_risk_score computed (weighted); high_risk_flag set"
          - "BUBBLE UP: recompute session.forms_complete; may trigger session READY_FOR_VISIT"

      - from: SUBMITTED
        to: FLAGGED
        trigger: "POST /questionnaire-responses/{id}/accept"
        actor: FrontDeskStaff
        preconditions:
          - "status == SUBMITTED (ERR_QUESTIONNAIRE_NOT_SUBMITTED)"
          - "answered_sections cover required keys AND final_risk_score >= HIGH_RISK_THRESHOLD"
        side_effects:
          - "status -> FLAGGED; final_risk_score computed; high_risk_flag = true"
        note: "Acceptance of a high-risk questionnaire lands in FLAGGED instead of ACCEPTED; FLAGGED does NOT satisfy forms_complete."

      - from: FLAGGED
        to: DRAFT
        trigger: "POST /questionnaire-responses/{id}/revise"
        actor: Patient
        preconditions:
          - "status IN {SUBMITTED, FLAGGED} (ERR_QUESTIONNAIRE_NOT_REVISABLE)"
        side_effects:
          - "status -> DRAFT; final_risk_score = null; high_risk_flag = false"
        note: "Revise loop forms a cycle DRAFT -> SUBMITTED -> FLAGGED -> DRAFT."

      - from: SUBMITTED
        to: DRAFT
        trigger: "POST /questionnaire-responses/{id}/revise"
        actor: Patient
        preconditions:
          - "status IN {SUBMITTED, FLAGGED} (ERR_QUESTIONNAIRE_NOT_REVISABLE)"
        side_effects:
          - "status -> DRAFT; final_risk_score = null; high_risk_flag = false"

  # --- CopayPayment: branching + compensation ---
  - entity: CopayPayment
    initial_state: AUTHORIZED
    terminal_states: [VOIDED, REFUNDED]
    transitions:
      - from: AUTHORIZED
        to: CAPTURED
        trigger: "POST /copay-payments/{id}/capture"
        actor: BillingClerk
        preconditions:
          - "status == AUTHORIZED (ERR_PAYMENT_NOT_AUTHORIZED)"
          - "session financial_status == COPAY_DUE (cross-entity: IntakeSession) (ERR_COPAY_NOT_DUE)"
          - "amount_cents == session.final_patient_responsibility_cents (ERR_COPAY_AMOUNT_MISMATCH)"
        side_effects:
          - "status -> CAPTURED"
          - "LEDGER: clinic.collected_copay_cents += amount_cents"
          - "CASCADE: session financial_status -> COPAY_SETTLED"

      - from: AUTHORIZED
        to: VOIDED
        trigger: "POST /copay-payments/{id}/void"
        actor: BillingClerk
        preconditions:
          - "status == AUTHORIZED (ERR_PAYMENT_NOT_AUTHORIZED)"
        side_effects:
          - "status -> VOIDED"

      - from: CAPTURED
        to: REFUNDED
        trigger: "POST /copay-payments/{id}/refund"
        actor: BillingClerk
        preconditions:
          - "status == CAPTURED (ERR_PAYMENT_NOT_CAPTURED)"
        side_effects:
          - "status -> REFUNDED; refunded_cents = amount_cents"
          - "LEDGER (compensation): clinic.collected_copay_cents -= amount_cents (net effect of capture+refund is zero)"
          - "CASCADE: session financial_status COPAY_SETTLED -> COPAY_DUE"

  # --- KioskQueueEntry: branching ---
  - entity: KioskQueueEntry
    initial_state: WAITING
    terminal_states: [DONE, NO_SHOW]
    transitions:
      - from: WAITING
        to: CALLED
        trigger: "POST /queue-entries/{id}/call"
        actor: FrontDeskStaff
        preconditions:
          - "status == WAITING (ERR_QUEUE_ENTRY_NOT_WAITING)"
          - "Parent IntakeSession workflow_status IN {READY_FOR_VISIT, CHECKED_IN} (cross-entity: IntakeSession) (ERR_SESSION_NOT_READY)"
          - "exam_room_id in body references an ExamRoom of the same clinic (ERR_ROOM_CLINIC_MISMATCH)"
        side_effects:
          - "status -> CALLED; exam_room_id assigned"

      - from: CALLED
        to: IN_ROOM
        trigger: "POST /queue-entries/{id}/room-in"
        actor: FrontDeskStaff
        preconditions:
          - "status == CALLED (ERR_QUEUE_ENTRY_NOT_CALLED)"
        side_effects:
          - "status -> IN_ROOM"

      - from: IN_ROOM
        to: DONE
        trigger: "POST /queue-entries/{id}/done"
        actor: FrontDeskStaff
        preconditions:
          - "status == IN_ROOM (ERR_QUEUE_ENTRY_NOT_IN_ROOM)"
        side_effects:
          - "status -> DONE; clinic.active_queue_count -= 1; clinic.version += 1"

      - from: WAITING
        to: NO_SHOW
        trigger: "POST /queue-entries/{id}/no-show"
        actor: FrontDeskStaff
        preconditions:
          - "status IN {WAITING, CALLED} (ERR_QUEUE_ENTRY_NOT_ACTIVE)"
        side_effects:
          - "status -> NO_SHOW; clinic.active_queue_count -= 1; clinic.version += 1"

      - from: CALLED
        to: NO_SHOW
        trigger: "POST /queue-entries/{id}/no-show"
        actor: FrontDeskStaff
        preconditions:
          - "status IN {WAITING, CALLED} (ERR_QUEUE_ENTRY_NOT_ACTIVE)"
        side_effects:
          - "status -> NO_SHOW; clinic.active_queue_count -= 1; clinic.version += 1"

  # --- Reminder: scheduled / deferred ---
  - entity: Reminder
    initial_state: SCHEDULED
    terminal_states: [SENT, CANCELLED, SUPPRESSED]
    transitions:
      - from: SCHEDULED
        to: SENT
        trigger: "POST /_clock/set_current_utc (automatic fire when clinic.current_utc >= scheduled_utc and target step still incomplete)"
        actor: system
        preconditions:
          - "clinic.current_utc >= scheduled_utc"
          - "Parent IntakeSession workflow_status NOT IN {EXPIRED, CANCELLED, COMPLETED}"
          - "The reminder's target step is still incomplete (polymorphic on target_kind)"
        side_effects:
          - "status -> SENT"

      - from: SCHEDULED
        to: SUPPRESSED
        trigger: "POST /_clock/set_current_utc (automatic when target step already complete at fire time, or session expired)"
        actor: system
        preconditions:
          - "clinic.current_utc >= scheduled_utc"
          - "Target step already complete OR parent session EXPIRED"
        side_effects:
          - "status -> SUPPRESSED"

      - from: SCHEDULED
        to: CANCELLED
        trigger: "POST /reminders/{id}/cancel"
        actor: FrontDeskStaff
        preconditions:
          - "status == SCHEDULED (ERR_REMINDER_NOT_SCHEDULED)"
        side_effects:
          - "status -> CANCELLED"

# -----------------------------------------------------------------------------
# §1.2.1 Concurrency Rules
# -----------------------------------------------------------------------------
concurrency_rules:
  - rule_id: copay-authorize-stale-session
    parent_entity: IntakeSession
    write_endpoint: "POST /copay-payments"
    occ_field: "expected_intake_session_version"
    description: |
      Authorizing a CopayPayment against an IntakeSession whose version has
      advanced since the client last observed it is rejected. This captures the
      case where eligibility has just re-resolved (changing
      final_patient_responsibility_cents and bumping the session version), so the
      authorizing client's amount-due view is stale and a fresh authorization for
      the old amount must not be created.
    error_id: ERR_STALE_SESSION_VERSION
    http_status: 412

  - rule_id: room-booking-stale-room
    parent_entity: ExamRoom
    write_endpoint: "POST /room-bookings"
    occ_field: "expected_exam_room_version"
    description: |
      Creating a RoomBooking against an ExamRoom whose version has advanced since
      the client last observed it is rejected. This captures the case where
      another booking has just been written against the room (advancing its
      version), so the current writer's view of the room's occupancy is stale.
    error_id: ERR_STALE_ROOM_VERSION
    http_status: 412

# =============================================================================
# §1.3 Calculation Rules Table
# =============================================================================
calculations:
  - name: estimate_copay
    trigger: "Appointment creation (POST /appointments)"
    algorithm: forward_looking
    formula: |
      # Forward-looking estimate: no eligibility data yet, use the plan's posted
      # office-visit copay only, clamped to the facility cap.
      provisional_copay_cents = min(plan_default_copay_cents,
                                     plan_default_copay_cents)   # posted copay
      # Estimate intentionally ignores deductible/coinsurance (unknown pre-check).
    input_set: "Appointment fields only; no InsuranceCard or EligibilityCheck exists yet."
    constants: {}
    precision: "integer cents (no rounding needed; inputs are integer cents)"
    note: "Dual-variant partner of finalize_patient_responsibility — same subject family (visit cost) but the forward-looking estimate and the chronological finalized figure diverge."

  - name: finalize_patient_responsibility
    trigger: "InsuranceCard eligibility resolves (POST /insurance-cards/{id}/resolve-eligibility)"
    algorithm: chronological
    formula: |
      # Mode (a): >=3 inputs with nested min/max and a conditional branch on
      # outcome. Evaluation order is pinned: legs first, then the rounding policy
      # (copay_total_rounding) combines them. NO allowed-amount cap is applied to
      # the combined sum (the legs are summed as-is).
      if outcome == INELIGIBLE:
          # self-pay: full allowed amount + facility fee, no plan offset, no
          # coinsurance (integer, no rounding needed).
          final_patient_responsibility_cents = visit_allowed_amount_cents
                                                + facility_fee_cents
      else:  # ELIGIBLE
          # Four legs (two integer, two fractional):
          copay_leg      = min(plan_copay_cents, visit_allowed_amount_cents)   # integer
          deductible_leg = min(remaining_deductible_cents,
                               visit_allowed_amount_cents)                     # integer
          above_deductible    = max(visit_allowed_amount_cents
                                    - remaining_deductible_cents, 0)
          medical_coins_leg   = above_deductible * plan_coinsurance_pct / 100  # fractional
          facility_coins_leg  = facility_fee_cents * facility_coinsurance_pct / 100  # fractional
          # Combine per the clinic.copay_rounding policy — see copay_total_rounding.
          final_patient_responsibility_cents = combine_legs(
              [copay_leg, deductible_leg, facility_fee_cents],   # integer legs
              [medical_coins_leg, facility_coins_leg],           # fractional legs
              clinic.copay_rounding)
    input_set: "The InsuranceCard being resolved + clinic.facility_fee_cents + clinic.copay_rounding; outcome from the resolve call."
    constants: {}
    precision: "round_half_up to integer cents; multi-leg order pinned by copay_total_rounding"
    variants:
      - name: provisional_deductible_unmet
        when: "Recorded on the EligibilityCheck at check time (provisional_responsibility_cents), assuming the full deductible is still unmet so coinsurance is not reached."
        difference: "Provisional = min(plan_copay_cents, allowed) + min(remaining_deductible_cents, allowed) + facility_fee_cents, with ZERO coinsurance legs (deductible treated as unmet). For the SAME card with above-deductible exposure, final > provisional because final adds the coinsurance legs."
      - name: final_chronological
        when: "Written to session.final_patient_responsibility_cents when eligibility resolves."
        difference: "Final applies the full four-leg split above; for the SAME card it can differ from the forward-looking estimate_copay (which uses only plan_default_copay_cents) and from the provisional figure (which drops coinsurance)."

  - name: copay_total_rounding
    trigger: "finalize_patient_responsibility (same call), ELIGIBLE branch only"
    algorithm: aggregation
    formula: |
      # Mode (b): nested rounding where order matters. There are TWO fractional
      # legs (medical_coins_leg, facility_coins_leg); the integer legs (copay_leg,
      # deductible_leg, facility_fee_cents) need no rounding. clinic.copay_rounding
      # PINS the order:
      #   PER_LINE_THEN_SUM (default):
      #     total = copay_leg + deductible_leg + facility_fee_cents
      #             + round_half_up(medical_coins_leg)
      #             + round_half_up(facility_coins_leg)
      #   SUM_THEN_ROUND:
      #     total = round_half_up( copay_leg + deductible_leg + facility_fee_cents
      #                            + medical_coins_leg + facility_coins_leg )
      # With two legs each ending in .5 (e.g. 100.5 and 50.5), PER_LINE rounds each
      # up (101 + 51) while SUM rounds the integer total (151.0 -> 151): the two
      # orders differ by exactly 1 cent.
    input_set: "The five legs from finalize_patient_responsibility plus clinic.copay_rounding."
    constants: {}
    precision: "round_half_up; order fixed by clinic.copay_rounding (default PER_LINE_THEN_SUM)"

  - name: questionnaire_risk_score
    trigger: "Questionnaire submit (provisional) and accept (final)"
    algorithm: weighted_scoring
    formula: |
      # Provisional (at SUBMIT): plain sum of answered weights.
      provisional_risk_score = sum(s.risk_weight for s in answered_sections)
      # Final (at ACCEPT): weighted by section importance. Required sections carry
      # weight x REQUIRED_MULTIPLIER; non-required answered sections carry weight x1.
      final_risk_score = round_half_up(
          sum(s.risk_weight * (REQUIRED_MULTIPLIER if s.section_key in
              provider.questionnaire_required_sections else 1)
              for s in answered_sections))
      high_risk_flag = (final_risk_score >= HIGH_RISK_THRESHOLD)
    input_set: "answered_sections on the QuestionnaireResponse + provider.questionnaire_required_sections."
    constants:
      REQUIRED_MULTIPLIER: 2
      HIGH_RISK_THRESHOLD: 20
    precision: "round_half_up to integer"
    note: "Dual-variant calc on a DIFFERENT entity domain (QuestionnaireResponse risk) than the copay calcs (visit cost): provisional sum vs weighted final diverge for the same answers."

  - name: forms_complete
    trigger: "Any ConsentDocument sign/revoke, QuestionnaireResponse accept/revise, or eligibility resolution"
    algorithm: aggregation
    formula: |
      consents_ok = (for every code in provider.required_consent_codes there
                     exists a ConsentDocument with that consent_code and
                     status == SIGNED for this session)
      questionnaire_ok = (provider.questionnaire_required_sections is empty)
                         OR (session has a QuestionnaireResponse with
                             status == ACCEPTED)   # FLAGGED does NOT count
      eligibility_ok = (the session's InsuranceCard eligibility_status IN
                        {ELIGIBLE, INELIGIBLE})    # VERIFYING/UNVERIFIED/NEEDS_REVIEW do not
      forms_complete = consents_ok AND questionnaire_ok AND eligibility_ok
    input_set: "All ConsentDocuments, the QuestionnaireResponse, and the InsuranceCard for the session."
    constants: {}
    precision: "boolean"
    note: "Empty-set edge: a provider with required_consent_codes == [] makes consents_ok trivially true; a provider with questionnaire_required_sections == [] makes questionnaire_ok trivially true."

  - name: expires_at
    trigger: "IntakeSession creation"
    algorithm: aggregation
    formula: |
      expires_at = created_at + (clinic.form_expiration_hours hours)
      # Boundary: the session is EXPIRED when clinic.current_utc >= expires_at
      # (at-or-after, not strictly after).
    input_set: "session.created_at + clinic.form_expiration_hours."
    constants: {}
    precision: "ISO 8601 UTC, millisecond"

  - name: provider_busy_interval
    trigger: "Appointment creation (overlap check)"
    algorithm: interval_merge
    formula: |
      # Each existing non-CANCELLED appointment for the provider occupies the
      # half-open interval [start_utc, end_utc + cleanup_buffer_minutes). A new
      # appointment's half-open interval [new.start, new.end) collides iff it
      # overlaps any occupied interval. Touching at a single instant does NOT
      # collide (half-open): existing.end+buffer == new.start is allowed.
    input_set: "All Appointments for the provider with status != CANCELLED."
    constants: {}
    precision: "instant comparison, millisecond"

  - name: room_busy_interval
    trigger: "RoomBooking creation (overlap check)"
    algorithm: interval_merge
    formula: |
      # Each existing RoomBooking for the room occupies the CLOSED interval
      # [start_utc, end_utc]. A new booking [new.start, new.end] collides iff the
      # closed intervals overlap on more than a single shared endpoint —
      # adjacency (existing.end == new.start) is ALLOWED (gap == 0 OK), but any
      # strictly-interior overlap is rejected. No buffer is applied.
    input_set: "All RoomBookings for the exam room."
    constants: {}
    precision: "instant comparison, millisecond"
    note: "Different interval semantics from provider_busy_interval: closed vs half-open, buffer vs no buffer."

# =============================================================================
# §1.4 Validation Rules Table (ordered by priority)
# =============================================================================
validations:
  - priority: 1
    category: auth
    check: "X-User-ID and X-User-Role headers present and well-formed"
    error_id: ERR_MISSING_OR_INVALID_USER_CONTEXT_HEADER
    http_status: 400
    applies_to: "all"

  - priority: 2
    category: auth
    check: "Role is permitted to perform this operation per §1.7 RBAC"
    error_id: ERR_INSUFFICIENT_PERMISSIONS
    http_status: 403
    applies_to: "all"

  - priority: 3
    category: existence
    check: "Every resource id in the path exists (validated left-to-right)"
    error_id: "ERR_*_NOT_FOUND"
    http_status: 404
    applies_to: "all id-bearing endpoints"

  - priority: 4
    category: existence
    check: "Every FK in the body references an existing resource of the right type"
    error_id: "ERR_*_NOT_FOUND"
    http_status: 404
    applies_to: "all create endpoints with FK body fields"

  - priority: 5
    category: state
    check: "Optimistic-concurrency: when expected_<parent>_version is supplied it must equal the parent's current version"
    error_id: "ERR_STALE_SESSION_VERSION / ERR_STALE_ROOM_VERSION"
    http_status: 412
    applies_to: "POST /copay-payments, POST /room-bookings"
    note: "Checked before any business validation on those two endpoints."

  - priority: 6
    category: state
    check: "Target resource is in a state from which the requested operation is legal (transition endpoints; also POST /copay-payments requires session.financial_status == COPAY_DUE -> ERR_COPAY_NOT_DUE before the fiscal amount check)"
    error_id: "ERR_*_NOT_* (domain state errors); ERR_COPAY_NOT_DUE for copay authorize/capture"
    http_status: 409
    applies_to: "all transition endpoints; POST /copay-payments"

  - priority: 7
    category: business_temporal
    check: "Parent IntakeSession is not EXPIRED and not past expires_at at the clinic clock"
    error_id: ERR_SESSION_EXPIRED
    http_status: 409
    applies_to: "consent sign/revoke/reissue, questionnaire submit, card verify"

  - priority: 8
    category: business_referential
    check: "Child entity's clinic matches the parent's clinic (ExamRoom vs IntakeSession; consent_code vs provider.required_consent_codes)"
    error_id: "ERR_ROOM_CLINIC_MISMATCH / ERR_CONSENT_CODE_NOT_REQUIRED"
    http_status: 409
    applies_to: "queue-entries call, consent-documents create"

  - priority: 9
    category: business_temporal
    check: "Provider appointment overlap: new [start,end) must not collide with any non-CANCELLED appointment interval [start, end+buffer)"
    error_id: ERR_PROVIDER_DOUBLE_BOOKED
    http_status: 409
    applies_to: "POST /appointments"

  - priority: 10
    category: business_temporal
    check: "Room booking overlap: new closed [start,end] must not strictly-interior-overlap any existing booking; adjacency allowed"
    error_id: ERR_ROOM_DOUBLE_BOOKED
    http_status: 409
    applies_to: "POST /room-bookings"

  - priority: 11
    category: business_constraint
    check: "Reminder quiet-hours: scheduled_local_min must not fall inside the clinic's wrap-around quiet window [quiet_start, quiet_end)"
    error_id: ERR_REMINDER_IN_QUIET_HOURS
    http_status: 409
    applies_to: "POST /reminders"

  - priority: 12
    category: business_constraint
    check: "Reminder min-gap: scheduled_utc must be at least clinic.reminder_min_gap_minutes from every other non-CANCELLED reminder on the same session"
    error_id: ERR_REMINDER_TOO_CLOSE
    http_status: 409
    applies_to: "POST /reminders"

  - priority: 13
    category: business_constraint
    check: "Questionnaire acceptance requires answered_sections to cover every provider.questionnaire_required_sections key"
    error_id: ERR_QUESTIONNAIRE_INCOMPLETE
    http_status: 409
    applies_to: "POST /questionnaire-responses/{id}/accept"

  - priority: 14
    category: business_safety
    check: "Copay may not be waived when the session's QuestionnaireResponse high_risk_flag is true"
    error_id: ERR_WAIVE_BLOCKED_HIGH_RISK
    http_status: 403
    applies_to: "POST /intake-sessions/{id}/waive-copay"

  - priority: 15
    category: business_fiscal
    check: "CopayPayment.amount_cents at authorization must equal session.final_patient_responsibility_cents"
    error_id: ERR_COPAY_AMOUNT_MISMATCH
    http_status: 422
    applies_to: "POST /copay-payments, POST /copay-payments/{id}/capture"

  - priority: 16
    category: business_fiscal
    check: "An IntakeSession may not COMPLETE while financial_status == COPAY_DUE"
    error_id: ERR_COPAY_UNSETTLED
    http_status: 409
    applies_to: "POST /intake-sessions/{id}/complete"

# =============================================================================
# §1.5 API Endpoint Table
# =============================================================================
endpoints:
  # ---- Test-driving: clock ----
  - method: POST
    path: "/_clock/set_current_utc"
    description: "Set the deterministic clinic clock; runs the expiration + reminder-fire sweep across all sessions/reminders"
    roles: [ClinicAdmin]
    code: 200
    input: [clinic_id, to_iso8601]
    output: Clinic
    side_effects:
      - "clinic.current_utc = to_iso8601"
      - "Sweep: every DRAFT/IN_PROGRESS IntakeSession with current_utc >= expires_at -> EXPIRED (cascade: SCHEDULED reminders -> SUPPRESSED)"
      - "Sweep: every SCHEDULED Reminder with current_utc >= scheduled_utc -> SENT (target incomplete) or SUPPRESSED (target complete / session expired)"

  # ---- Clinic ----
  - method: POST
    path: "/clinics"
    description: "Create a clinic (configuration root)"
    roles: [ClinicAdmin]
    code: 201
    input: [name, "timezone?", "form_expiration_hours?", "reminder_quiet_start_min?", "reminder_quiet_end_min?", "reminder_min_gap_minutes?", "copay_rounding?", "facility_fee_cents?"]
    output: Clinic
    side_effects: ["current_utc initialized to epoch; collected_copay_cents = 0; active_queue_count = 0"]

  - method: GET
    path: "/clinics/{id}"
    description: "Get a clinic"
    roles: [ClinicAdmin, FrontDeskStaff, BillingClerk]
    code: 200
    input: []
    output: Clinic
    side_effects: []

  - method: GET
    path: "/clinics"
    description: "List clinics"
    roles: [ClinicAdmin, FrontDeskStaff, BillingClerk]
    code: 200
    input: ["limit?", "offset?"]
    output: "Clinic[]"
    side_effects: []

  # ---- Provider ----
  - method: POST
    path: "/providers"
    description: "Create a provider"
    roles: [ClinicAdmin]
    code: 201
    input: [clinic_id, full_name, "cleanup_buffer_minutes?", "required_consent_codes?", "questionnaire_required_sections?"]
    output: Provider
    side_effects: []

  - method: GET
    path: "/providers/{id}"
    description: "Get a provider"
    roles: [ClinicAdmin, FrontDeskStaff, BillingClerk]
    code: 200
    input: []
    output: Provider
    side_effects: []

  - method: GET
    path: "/providers"
    description: "List providers, filterable by clinic"
    roles: [ClinicAdmin, FrontDeskStaff, BillingClerk]
    code: 200
    input: ["clinic_id?", "limit?", "offset?"]
    output: "Provider[]"
    side_effects: []

  # ---- ExamRoom ----
  - method: POST
    path: "/exam-rooms"
    description: "Create an exam room"
    roles: [ClinicAdmin]
    code: 201
    input: [clinic_id, label]
    output: ExamRoom
    side_effects: []

  - method: GET
    path: "/exam-rooms/{id}"
    description: "Get an exam room"
    roles: [ClinicAdmin, FrontDeskStaff, BillingClerk]
    code: 200
    input: []
    output: ExamRoom
    side_effects: []

  - method: GET
    path: "/exam-rooms"
    description: "List exam rooms, filterable by clinic"
    roles: [ClinicAdmin, FrontDeskStaff, BillingClerk]
    code: 200
    input: ["clinic_id?", "limit?", "offset?"]
    output: "ExamRoom[]"
    side_effects: []

  # ---- Patient ----
  - method: POST
    path: "/patients"
    description: "Pre-visit registration: create a patient"
    roles: [ClinicAdmin, FrontDeskStaff]
    code: 201
    input: [clinic_id, legal_name, date_of_birth, phone]
    output: Patient
    side_effects: []

  - method: GET
    path: "/patients/{id}"
    description: "Get a patient"
    roles: [ClinicAdmin, FrontDeskStaff, BillingClerk]
    code: 200
    input: []
    output: Patient
    side_effects: []

  - method: GET
    path: "/patients"
    description: "List patients, filterable by clinic"
    roles: [ClinicAdmin, FrontDeskStaff, BillingClerk]
    code: 200
    input: ["clinic_id?", "limit?", "offset?"]
    output: "Patient[]"
    side_effects: []

  # ---- Appointment ----
  - method: POST
    path: "/appointments"
    description: "Schedule an appointment (provider overlap checked, provisional copay estimated)"
    roles: [ClinicAdmin, FrontDeskStaff]
    code: 201
    input: [clinic_id, provider_id, patient_id, start_utc, end_utc, "plan_default_copay_cents?"]
    output: Appointment
    side_effects: ["provider overlap check (provider_busy_interval)", "provisional_copay_cents computed (estimate_copay)"]

  - method: GET
    path: "/appointments/{id}"
    description: "Get an appointment"
    roles: [ClinicAdmin, FrontDeskStaff, BillingClerk]
    code: 200
    input: []
    output: Appointment
    side_effects: []

  - method: GET
    path: "/appointments"
    description: "List appointments, filterable by clinic / provider / patient"
    roles: [ClinicAdmin, FrontDeskStaff, BillingClerk]
    code: 200
    input: ["clinic_id?", "provider_id?", "patient_id?", "limit?", "offset?"]
    output: "Appointment[]"
    side_effects: []

  # ---- IntakeSession ----
  - method: POST
    path: "/intake-sessions"
    description: "Open an intake session for an appointment; stamps expires_at"
    roles: [ClinicAdmin, FrontDeskStaff]
    code: 201
    input: [appointment_id]
    output: IntakeSession
    side_effects: ["clinic_id/provider_id/patient_id copied from appointment", "expires_at = created_at + clinic.form_expiration_hours", "appointment.status -> INTAKE_OPENED"]

  - method: GET
    path: "/intake-sessions/{id}"
    description: "Get an intake session (both status dimensions, derived fields)"
    roles: [ClinicAdmin, FrontDeskStaff, BillingClerk]
    code: 200
    input: []
    output: IntakeSession
    side_effects: []

  - method: GET
    path: "/intake-sessions"
    description: "List intake sessions, filterable by appointment / clinic / provider / patient"
    roles: [ClinicAdmin, FrontDeskStaff, BillingClerk]
    code: 200
    input: ["appointment_id?", "clinic_id?", "provider_id?", "patient_id?", "limit?", "offset?"]
    output: "IntakeSession[]"
    side_effects: []

  - method: POST
    path: "/intake-sessions/{id}/check-in"
    description: "Front desk checks the patient in (requires READY_FOR_VISIT + all consents signed)"
    roles: [FrontDeskStaff]
    code: 200
    input: []
    output: IntakeSession
    side_effects: ["workflow_status -> CHECKED_IN"]

  - method: POST
    path: "/intake-sessions/{id}/complete"
    description: "Complete the intake session (requires queue DONE + copay settled)"
    roles: [FrontDeskStaff]
    code: 200
    input: []
    output: IntakeSession
    side_effects: ["workflow_status -> COMPLETED"]

  - method: POST
    path: "/intake-sessions/{id}/cancel"
    description: "Cancel the intake session; cascades to queue entry and reminders"
    roles: [FrontDeskStaff]
    code: 200
    input: []
    output: IntakeSession
    side_effects: ["workflow_status -> CANCELLED", "cascade NO_SHOW any active queue entry (clinic.active_queue_count, clinic.version)", "cascade CANCELLED all SCHEDULED reminders"]

  - method: POST
    path: "/intake-sessions/{id}/waive-copay"
    description: "Billing waives the copay (blocked when questionnaire high_risk_flag)"
    roles: [BillingClerk]
    code: 200
    input: []
    output: IntakeSession
    side_effects: ["financial_status COPAY_DUE -> WAIVED"]

  # ---- InsuranceCard ----
  - method: POST
    path: "/insurance-cards"
    description: "Capture an insurance card for a session"
    roles: [FrontDeskStaff]
    code: 201
    input: [intake_session_id, payer_name, member_id, "plan_copay_cents?", "plan_coinsurance_pct?", "facility_coinsurance_pct?", "remaining_deductible_cents?", "visit_allowed_amount_cents?"]
    output: InsuranceCard
    side_effects: ["if session DRAFT -> IN_PROGRESS"]

  - method: GET
    path: "/insurance-cards/{id}"
    description: "Get an insurance card"
    roles: [ClinicAdmin, FrontDeskStaff, BillingClerk]
    code: 200
    input: []
    output: InsuranceCard
    side_effects: []

  - method: GET
    path: "/insurance-cards"
    description: "List insurance cards, filterable by session"
    roles: [ClinicAdmin, FrontDeskStaff, BillingClerk]
    code: 200
    input: ["intake_session_id?", "limit?", "offset?"]
    output: "InsuranceCard[]"
    side_effects: []

  - method: POST
    path: "/insurance-cards/{id}/verify"
    description: "Begin eligibility verification (UNVERIFIED/NEEDS_REVIEW -> VERIFYING)"
    roles: [FrontDeskStaff]
    code: 200
    input: []
    output: InsuranceCard
    side_effects: ["eligibility_status -> VERIFYING"]

  - method: POST
    path: "/insurance-cards/{id}/resolve-eligibility"
    description: "Resolve verification with a simulated payer outcome; records EligibilityCheck and cascades session financial_status"
    roles: [FrontDeskStaff]
    code: 200
    input: [outcome]
    output: InsuranceCard
    side_effects: ["eligibility_status -> ELIGIBLE/INELIGIBLE/NEEDS_REVIEW", "create EligibilityCheck", "finalize_patient_responsibility", "session financial_status cascade", "session.version += 1"]

  # ---- EligibilityCheck (read) ----
  - method: GET
    path: "/eligibility-checks/{id}"
    description: "Get an eligibility check record"
    roles: [ClinicAdmin, FrontDeskStaff, BillingClerk]
    code: 200
    input: []
    output: EligibilityCheck
    side_effects: []

  - method: GET
    path: "/eligibility-checks"
    description: "List eligibility checks, filterable by card or session"
    roles: [ClinicAdmin, FrontDeskStaff, BillingClerk]
    code: 200
    input: ["insurance_card_id?", "intake_session_id?", "limit?", "offset?"]
    output: "EligibilityCheck[]"
    side_effects: []

  # ---- ConsentDocument ----
  - method: POST
    path: "/consent-documents"
    description: "Issue a consent/HIPAA form for a session (consent_code must be required by the provider)"
    roles: [FrontDeskStaff]
    code: 201
    input: [intake_session_id, consent_code]
    output: ConsentDocument
    side_effects: ["if session DRAFT -> IN_PROGRESS"]

  - method: GET
    path: "/consent-documents/{id}"
    description: "Get a consent document"
    roles: [ClinicAdmin, FrontDeskStaff, BillingClerk, Patient]
    code: 200
    input: []
    output: ConsentDocument
    side_effects: []

  - method: GET
    path: "/consent-documents"
    description: "List consent documents, filterable by session"
    roles: [ClinicAdmin, FrontDeskStaff, BillingClerk, Patient]
    code: 200
    input: ["intake_session_id?", "limit?", "offset?"]
    output: "ConsentDocument[]"
    side_effects: []

  - method: POST
    path: "/consent-documents/{id}/sign"
    description: "Patient applies e-signature"
    roles: [Patient]
    code: 200
    input: [signer_name]
    output: ConsentDocument
    side_effects: ["status -> SIGNED; signed_at stamped", "bubble up forms_complete; may trigger session READY_FOR_VISIT + queue enqueue"]

  - method: POST
    path: "/consent-documents/{id}/revoke"
    description: "Patient revokes a signed consent"
    roles: [Patient]
    code: 200
    input: []
    output: ConsentDocument
    side_effects: ["status -> REVOKED", "bubble up forms_complete; may revert session READY_FOR_VISIT -> IN_PROGRESS and NO_SHOW its queue entry"]

  - method: POST
    path: "/consent-documents/{id}/reissue"
    description: "Front desk re-issues a revoked consent (revision bump)"
    roles: [FrontDeskStaff]
    code: 200
    input: []
    output: ConsentDocument
    side_effects: ["status -> PENDING; revision += 1"]

  # ---- QuestionnaireResponse ----
  - method: POST
    path: "/questionnaire-responses"
    description: "Start the medical-history questionnaire for a session"
    roles: [FrontDeskStaff, Patient]
    code: 201
    input: [intake_session_id, "answered_sections?"]
    output: QuestionnaireResponse
    side_effects: ["if session DRAFT -> IN_PROGRESS"]

  - method: GET
    path: "/questionnaire-responses/{id}"
    description: "Get a questionnaire response"
    roles: [ClinicAdmin, FrontDeskStaff, BillingClerk, Patient]
    code: 200
    input: []
    output: QuestionnaireResponse
    side_effects: []

  - method: GET
    path: "/questionnaire-responses"
    description: "List questionnaire responses, filterable by session"
    roles: [ClinicAdmin, FrontDeskStaff, BillingClerk, Patient]
    code: 200
    input: ["intake_session_id?", "limit?", "offset?"]
    output: "QuestionnaireResponse[]"
    side_effects: []

  - method: PATCH
    path: "/questionnaire-responses/{id}"
    description: "Update answered_sections while in DRAFT"
    roles: [Patient, FrontDeskStaff]
    code: 200
    input: [answered_sections]
    output: QuestionnaireResponse
    side_effects: ["answered_sections replaced (DRAFT only)"]

  - method: POST
    path: "/questionnaire-responses/{id}/submit"
    description: "Patient submits the questionnaire (provisional score computed)"
    roles: [Patient]
    code: 200
    input: []
    output: QuestionnaireResponse
    side_effects: ["status -> SUBMITTED; provisional_risk_score computed"]

  - method: POST
    path: "/questionnaire-responses/{id}/accept"
    description: "Front desk accepts a submitted questionnaire (final score; high-risk lands in FLAGGED)"
    roles: [FrontDeskStaff]
    code: 200
    input: []
    output: QuestionnaireResponse
    side_effects: ["status -> ACCEPTED or FLAGGED; final_risk_score + high_risk_flag computed", "bubble up forms_complete (ACCEPTED only)"]

  - method: POST
    path: "/questionnaire-responses/{id}/revise"
    description: "Patient revises a submitted/flagged questionnaire back to DRAFT"
    roles: [Patient]
    code: 200
    input: []
    output: QuestionnaireResponse
    side_effects: ["status -> DRAFT; final_risk_score/high_risk_flag cleared"]

  # ---- CopayPayment ----
  - method: POST
    path: "/copay-payments"
    description: "Authorize a copay payment (amount must equal session amount due; OCC on session version)"
    roles: [BillingClerk]
    code: 201
    input: [intake_session_id, amount_cents, expected_intake_session_version]
    output: CopayPayment
    side_effects: ["status = AUTHORIZED", "OCC: rejects if expected_intake_session_version != session.version"]

  - method: GET
    path: "/copay-payments/{id}"
    description: "Get a copay payment"
    roles: [ClinicAdmin, FrontDeskStaff, BillingClerk]
    code: 200
    input: []
    output: CopayPayment
    side_effects: []

  - method: GET
    path: "/copay-payments"
    description: "List copay payments, filterable by session"
    roles: [ClinicAdmin, FrontDeskStaff, BillingClerk]
    code: 200
    input: ["intake_session_id?", "limit?", "offset?"]
    output: "CopayPayment[]"
    side_effects: []

  - method: POST
    path: "/copay-payments/{id}/capture"
    description: "Capture an authorized copay (ledger credit; session -> COPAY_SETTLED)"
    roles: [BillingClerk]
    code: 200
    input: []
    output: CopayPayment
    side_effects: ["status -> CAPTURED", "clinic.collected_copay_cents += amount_cents", "session financial_status -> COPAY_SETTLED"]

  - method: POST
    path: "/copay-payments/{id}/void"
    description: "Void an authorized (uncaptured) copay"
    roles: [BillingClerk]
    code: 200
    input: []
    output: CopayPayment
    side_effects: ["status -> VOIDED"]

  - method: POST
    path: "/copay-payments/{id}/refund"
    description: "Refund a captured copay (compensation; ledger debit; session -> COPAY_DUE)"
    roles: [BillingClerk]
    code: 200
    input: []
    output: CopayPayment
    side_effects: ["status -> REFUNDED; refunded_cents = amount_cents", "clinic.collected_copay_cents -= amount_cents", "session financial_status COPAY_SETTLED -> COPAY_DUE"]

  # ---- KioskQueueEntry ----
  - method: GET
    path: "/queue-entries/{id}"
    description: "Get a kiosk queue entry"
    roles: [ClinicAdmin, FrontDeskStaff, BillingClerk]
    code: 200
    input: []
    output: KioskQueueEntry
    side_effects: []

  - method: GET
    path: "/queue-entries"
    description: "List queue entries, filterable by session / clinic / exam room / status"
    roles: [ClinicAdmin, FrontDeskStaff, BillingClerk]
    code: 200
    input: ["intake_session_id?", "clinic_id?", "exam_room_id?", "status?", "limit?", "offset?"]
    output: "KioskQueueEntry[]"
    side_effects: []

  - method: POST
    path: "/queue-entries/{id}/call"
    description: "Call the next patient and assign a room"
    roles: [FrontDeskStaff]
    code: 200
    input: [exam_room_id]
    output: KioskQueueEntry
    side_effects: ["status -> CALLED; exam_room_id assigned"]

  - method: POST
    path: "/queue-entries/{id}/room-in"
    description: "Move a called patient into the room"
    roles: [FrontDeskStaff]
    code: 200
    input: []
    output: KioskQueueEntry
    side_effects: ["status -> IN_ROOM"]

  - method: POST
    path: "/queue-entries/{id}/done"
    description: "Mark the visit done (queue count decrements)"
    roles: [FrontDeskStaff]
    code: 200
    input: []
    output: KioskQueueEntry
    side_effects: ["status -> DONE; clinic.active_queue_count -= 1; clinic.version += 1"]

  - method: POST
    path: "/queue-entries/{id}/no-show"
    description: "Mark a waiting/called patient as a no-show"
    roles: [FrontDeskStaff]
    code: 200
    input: []
    output: KioskQueueEntry
    side_effects: ["status -> NO_SHOW; clinic.active_queue_count -= 1; clinic.version += 1"]

  # ---- RoomBooking ----
  - method: POST
    path: "/room-bookings"
    description: "Book an exam room for a window (closed-interval overlap check; OCC on room version)"
    roles: [FrontDeskStaff]
    code: 201
    input: [exam_room_id, queue_entry_id, start_utc, end_utc, expected_exam_room_version]
    output: RoomBooking
    side_effects: ["room_busy_interval overlap check", "OCC: rejects if expected_exam_room_version != room.version", "exam_room.version += 1"]

  - method: GET
    path: "/room-bookings/{id}"
    description: "Get a room booking"
    roles: [ClinicAdmin, FrontDeskStaff, BillingClerk]
    code: 200
    input: []
    output: RoomBooking
    side_effects: []

  - method: GET
    path: "/room-bookings"
    description: "List room bookings, filterable by room or queue entry"
    roles: [ClinicAdmin, FrontDeskStaff, BillingClerk]
    code: 200
    input: ["exam_room_id?", "queue_entry_id?", "limit?", "offset?"]
    output: "RoomBooking[]"
    side_effects: []

  # ---- Reminder ----
  - method: POST
    path: "/reminders"
    description: "Schedule a reminder (quiet-hours + min-gap checked)"
    roles: [FrontDeskStaff]
    code: 201
    input: [intake_session_id, target_kind, scheduled_utc, scheduled_local_min]
    output: Reminder
    side_effects: ["quiet-hours check", "min-gap check"]

  - method: GET
    path: "/reminders/{id}"
    description: "Get a reminder"
    roles: [ClinicAdmin, FrontDeskStaff, BillingClerk]
    code: 200
    input: []
    output: Reminder
    side_effects: []

  - method: GET
    path: "/reminders"
    description: "List reminders, filterable by session"
    roles: [ClinicAdmin, FrontDeskStaff, BillingClerk]
    code: 200
    input: ["intake_session_id?", "limit?", "offset?"]
    output: "Reminder[]"
    side_effects: []

  - method: POST
    path: "/reminders/{id}/cancel"
    description: "Cancel a scheduled reminder"
    roles: [FrontDeskStaff]
    code: 200
    input: []
    output: Reminder
    side_effects: ["status -> CANCELLED"]

  # ---- DemographicsSyncJob ----
  - method: POST
    path: "/demographics-sync-jobs"
    description: "Sync session demographics to the patient of record (idempotent by idempotency_key)"
    roles: [FrontDeskStaff]
    code: 201
    input: [intake_session_id, idempotency_key, synced_legal_name, synced_phone]
    output: DemographicsSyncJob
    side_effects: ["if idempotency_key unused: status=COMMITTED, patient legal_name/phone updated, patient.demographics_revision += 1", "if idempotency_key already used on this session: status=SKIPPED_DUPLICATE, no patient mutation, original job returned"]

  - method: GET
    path: "/demographics-sync-jobs/{id}"
    description: "Get a demographics sync job"
    roles: [ClinicAdmin, FrontDeskStaff, BillingClerk]
    code: 200
    input: []
    output: DemographicsSyncJob
    side_effects: []

  - method: GET
    path: "/demographics-sync-jobs"
    description: "List demographics sync jobs, filterable by session"
    roles: [ClinicAdmin, FrontDeskStaff, BillingClerk]
    code: 200
    input: ["intake_session_id?", "limit?", "offset?"]
    output: "DemographicsSyncJob[]"
    side_effects: []

# =============================================================================
# §1.6 Error Code Catalog
# =============================================================================
errors:
  # --- Auth ---
  - { id: ERR_MISSING_OR_INVALID_USER_CONTEXT_HEADER, http: 400, condition: "X-User-ID or X-User-Role header missing or malformed" }
  - { id: ERR_INSUFFICIENT_PERMISSIONS, http: 403, condition: "Role not permitted for this operation" }
  - { id: ERR_INVALID_REQUEST, http: 400, condition: "Malformed body, missing required field, type mismatch, or empty signer_name" }
  # --- Not Found ---
  - { id: ERR_CLINIC_NOT_FOUND, http: 404, condition: "Clinic id not found" }
  - { id: ERR_PROVIDER_NOT_FOUND, http: 404, condition: "Provider id not found" }
  - { id: ERR_EXAM_ROOM_NOT_FOUND, http: 404, condition: "ExamRoom id not found" }
  - { id: ERR_PATIENT_NOT_FOUND, http: 404, condition: "Patient id not found" }
  - { id: ERR_APPOINTMENT_NOT_FOUND, http: 404, condition: "Appointment id not found" }
  - { id: ERR_SESSION_NOT_FOUND, http: 404, condition: "IntakeSession id not found" }
  - { id: ERR_INSURANCE_CARD_NOT_FOUND, http: 404, condition: "InsuranceCard id not found" }
  - { id: ERR_ELIGIBILITY_CHECK_NOT_FOUND, http: 404, condition: "EligibilityCheck id not found" }
  - { id: ERR_CONSENT_NOT_FOUND, http: 404, condition: "ConsentDocument id not found" }
  - { id: ERR_QUESTIONNAIRE_NOT_FOUND, http: 404, condition: "QuestionnaireResponse id not found" }
  - { id: ERR_PAYMENT_NOT_FOUND, http: 404, condition: "CopayPayment id not found" }
  - { id: ERR_QUEUE_ENTRY_NOT_FOUND, http: 404, condition: "KioskQueueEntry id not found" }
  - { id: ERR_ROOM_BOOKING_NOT_FOUND, http: 404, condition: "RoomBooking id not found" }
  - { id: ERR_REMINDER_NOT_FOUND, http: 404, condition: "Reminder id not found" }
  - { id: ERR_SYNC_JOB_NOT_FOUND, http: 404, condition: "DemographicsSyncJob id not found" }
  # --- OCC ---
  - { id: ERR_STALE_SESSION_VERSION, http: 412, condition: "expected_intake_session_version != session.version on copay authorization" }
  - { id: ERR_STALE_ROOM_VERSION, http: 412, condition: "expected_exam_room_version != exam_room.version on room booking" }
  # --- Session state / temporal ---
  - { id: ERR_SESSION_EXPIRED, http: 409, condition: "Operation on a session at-or-after expires_at, or session already EXPIRED/CANCELLED" }
  - { id: ERR_SESSION_LOCKED, http: 409, condition: "Mutation blocked because session is CHECKED_IN or COMPLETED" }
  - { id: ERR_SESSION_NOT_READY, http: 409, condition: "Session not in READY_FOR_VISIT (check-in / queue call)" }
  - { id: ERR_SESSION_NOT_CHECKED_IN, http: 409, condition: "Complete requested but session not CHECKED_IN" }
  - { id: ERR_SESSION_NOT_CANCELLABLE, http: 409, condition: "Cancel requested but session in a terminal/checked-in state" }
  - { id: ERR_COPAY_REQUIRED_BEFORE_READY, http: 409, condition: "READY_FOR_VISIT blocked while financial_status still COPAY_DUE/PENDING_ELIGIBILITY" }
  # --- Eligibility / card ---
  - { id: ERR_CARD_NOT_VERIFIABLE, http: 409, condition: "verify called when eligibility_status not in {UNVERIFIED, NEEDS_REVIEW}" }
  - { id: ERR_CARD_NOT_VERIFYING, http: 409, condition: "resolve-eligibility called when eligibility_status != VERIFYING" }
  - { id: ERR_INVALID_OUTCOME, http: 400, condition: "resolve-eligibility outcome not in {ELIGIBLE, INELIGIBLE, NEEDS_REVIEW}" }
  # --- Consent ---
  - { id: ERR_CONSENT_CODE_NOT_REQUIRED, http: 409, condition: "consent_code not in provider.required_consent_codes" }
  - { id: ERR_CONSENT_NOT_PENDING, http: 409, condition: "sign called when consent not PENDING" }
  - { id: ERR_CONSENT_NOT_SIGNED, http: 409, condition: "revoke called when consent not SIGNED, or check-in blocked by an unsigned required consent" }
  - { id: ERR_CONSENT_NOT_REVOKED, http: 409, condition: "reissue called when consent not REVOKED" }
  # --- Questionnaire ---
  - { id: ERR_QUESTIONNAIRE_NOT_DRAFT, http: 409, condition: "submit/patch called when questionnaire not DRAFT" }
  - { id: ERR_QUESTIONNAIRE_NOT_SUBMITTED, http: 409, condition: "accept called when questionnaire not SUBMITTED" }
  - { id: ERR_QUESTIONNAIRE_NOT_REVISABLE, http: 409, condition: "revise called when questionnaire not in {SUBMITTED, FLAGGED}" }
  - { id: ERR_QUESTIONNAIRE_INCOMPLETE, http: 409, condition: "accept blocked because answered_sections miss a required section" }
  # --- Copay ---
  - { id: ERR_COPAY_NOT_DUE, http: 409, condition: "copay authorize/capture/waive when financial_status != COPAY_DUE" }
  - { id: ERR_COPAY_AMOUNT_MISMATCH, http: 422, condition: "amount_cents != session.final_patient_responsibility_cents" }
  - { id: ERR_PAYMENT_NOT_AUTHORIZED, http: 409, condition: "capture/void when payment not AUTHORIZED" }
  - { id: ERR_PAYMENT_NOT_CAPTURED, http: 409, condition: "refund when payment not CAPTURED" }
  - { id: ERR_COPAY_UNSETTLED, http: 409, condition: "complete blocked while financial_status == COPAY_DUE" }
  - { id: ERR_WAIVE_BLOCKED_HIGH_RISK, http: 403, condition: "waive-copay blocked because questionnaire high_risk_flag is true" }
  # --- Queue / room ---
  - { id: ERR_QUEUE_ENTRY_NOT_WAITING, http: 409, condition: "call when queue entry not WAITING" }
  - { id: ERR_QUEUE_ENTRY_NOT_CALLED, http: 409, condition: "room-in when queue entry not CALLED" }
  - { id: ERR_QUEUE_ENTRY_NOT_IN_ROOM, http: 409, condition: "done when queue entry not IN_ROOM" }
  - { id: ERR_QUEUE_ENTRY_NOT_ACTIVE, http: 409, condition: "no-show when queue entry not in {WAITING, CALLED}" }
  - { id: ERR_QUEUE_ENTRY_NOT_DONE, http: 409, condition: "complete blocked because the session's queue entry is not DONE" }
  - { id: ERR_ROOM_CLINIC_MISMATCH, http: 409, condition: "exam_room belongs to a different clinic than the session" }
  - { id: ERR_PROVIDER_DOUBLE_BOOKED, http: 409, condition: "appointment overlaps provider's busy interval (with buffer)" }
  - { id: ERR_ROOM_DOUBLE_BOOKED, http: 409, condition: "room booking strictly-interior-overlaps an existing booking" }
  # --- Reminder ---
  - { id: ERR_REMINDER_IN_QUIET_HOURS, http: 409, condition: "reminder scheduled inside clinic quiet-hours window" }
  - { id: ERR_REMINDER_TOO_CLOSE, http: 409, condition: "reminder within reminder_min_gap_minutes of another reminder on the session" }
  - { id: ERR_REMINDER_NOT_SCHEDULED, http: 409, condition: "cancel when reminder not SCHEDULED" }

# =============================================================================
# §1.7 RBAC Matrix
# =============================================================================
roles:
  - name: ClinicAdmin
    description: "Configures clinics, providers, exam rooms; drives the deterministic clock; read-all"
    identity: "opaque"
    exclusive_operations:
      - "POST /_clock/set_current_utc — Advance clock + run sweeps"
      - "POST /clinics — Create clinic"
      - "POST /providers — Create provider"
      - "POST /exam-rooms — Create exam room"
    shared_operations:
      - "POST /patients — Register patient (with FrontDeskStaff)"
      - "POST /appointments — Schedule appointment (with FrontDeskStaff)"
      - "POST /intake-sessions — Open intake session (with FrontDeskStaff)"
      - "GET ... — Read all resources"

  - name: FrontDeskStaff
    description: "Runs registration, insurance capture/verification, consent issue/reissue, questionnaire accept, queue, reminders, demographics sync"
    identity: "opaque"
    exclusive_operations:
      - "POST /insurance-cards + /verify + /resolve-eligibility — Insurance capture & eligibility"
      - "POST /consent-documents + /reissue — Issue / re-issue consent"
      - "POST /questionnaire-responses/{id}/accept — Accept questionnaire"
      - "POST /intake-sessions/{id}/check-in | /complete | /cancel — Session lifecycle"
      - "POST /queue-entries/{id}/call | /room-in | /done | /no-show — Queue control"
      - "POST /room-bookings — Book exam room"
      - "POST /reminders + /cancel — Reminder scheduling"
      - "POST /demographics-sync-jobs — Demographics sync"
    shared_operations:
      - "POST /patients — Register patient (with ClinicAdmin)"
      - "POST /appointments — Schedule appointment (with ClinicAdmin)"
      - "POST /intake-sessions — Open intake session (with ClinicAdmin)"
      - "POST /questionnaire-responses — Start questionnaire (with Patient)"
      - "PATCH /questionnaire-responses/{id} — Edit draft answers (with Patient)"
      - "GET ... — Read all resources"

  - name: Patient
    description: "Acts on the kiosk: signs/revokes consent, fills and submits/revises the questionnaire"
    identity: "opaque"
    exclusive_operations:
      - "POST /consent-documents/{id}/sign | /revoke — E-signature lifecycle"
      - "POST /questionnaire-responses/{id}/submit | /revise — Questionnaire lifecycle"
    shared_operations:
      - "POST /questionnaire-responses — Start questionnaire (with FrontDeskStaff)"
      - "PATCH /questionnaire-responses/{id} — Edit draft answers (with FrontDeskStaff)"
      - "GET /consent-documents, /questionnaire-responses — Read own forms"

  - name: BillingClerk
    description: "Owns the copay money path: authorize/capture/void/refund and waive"
    identity: "opaque"
    exclusive_operations:
      - "POST /copay-payments + /capture | /void | /refund — Copay money path"
      - "POST /intake-sessions/{id}/waive-copay — Waive copay"
    shared_operations:
      - "GET ... — Read all resources"
