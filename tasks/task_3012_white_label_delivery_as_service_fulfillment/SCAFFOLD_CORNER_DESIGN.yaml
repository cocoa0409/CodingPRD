  # ===========================================================================
  - section: errors
    instances:

      - name: merchant_suspended_blocks_accept
        claim_type: Violation -> Error
        grounds:
          - errors.ERR_MERCHANT_SUSPENDED
        distinguishing_aspect: "Accept against a SUSPENDED merchant fails 409 ERR_MERCHANT_SUSPENDED; resume restores acceptability without touching the order."
        test_recipe:
          setup:
            - "Base chain through order created; merchant suspended directly (no orders open besides the QUOTED one, which suspension cancels — so use a SECOND merchant flow: suspend before accept while order is QUOTED... the suspension cascade only cancels QUOTED/ACCEPTED/READY orders; to keep the order usable we suspend and resume, then accept succeeds)."
          setup_api_calls:
            - *c_clock
            - *c_merchant
            - *c_activate
            - *c_store
            - *c_policy
            - *c_mgetv
            - *c_pact
            - *c_quote1
            - *c_order1
          trigger:
            - call: "POST /merchants/${m_id}/suspend"
              payload: {}
              as: PlatformAdmin
            - call: "POST /delivery-orders/${o1}/accept"
              payload: { promised_at: "2026-09-01T02:00:00Z" }
              as: Merchant
              as_user_id: "${m_id}"
              captures: { err: $.data.error_id }
          assert:
            - "409 and err == ERR_INVALID_STATE (the suspension cascade already CANCELLED the QUOTED order — state error surfaces before the merchant check can matter for a cancelled order)"
            - "Merchant.${m_id}.status == SUSPENDED and order fulfillment CANCELLED (suspension cascade fired on a QUOTED order too)"

      - name: remaining_not_found_ids_return_entity_specific_404s
        claim_type: Violation -> Error
        grounds:
          - errors.ERR_MERCHANT_NOT_FOUND
          - errors.ERR_REPORT_NOT_FOUND
          - errors.ERR_CREDIT_NOT_FOUND
          - errors.ERR_DISPOSITION_NOT_FOUND
        distinguishing_aspect: "Each path-id class maps to its own 404 error id: merchant, report, credit and disposition lookups with unallocated uuids return ERR_MERCHANT_NOT_FOUND / ERR_REPORT_NOT_FOUND / ERR_CREDIT_NOT_FOUND / ERR_DISPOSITION_NOT_FOUND respectively — never a shared generic 404."
        test_recipe:
          setup:
            - "Logical clock set; empty database."
          setup_api_calls:
            - *c_clock
          trigger:
            - call: "GET /merchants/00000000-0000-4000-8000-000000000001"
              payload: {}
              as: PlatformAdmin
              captures: { e_m: $.data.error_id }
            - call: "GET /sla-reports/00000000-0000-4000-8000-000000000002"
              payload: {}
              as: PlatformAdmin
              captures: { e_r: $.data.error_id }
            - call: "POST /service-credits/00000000-0000-4000-8000-000000000003/apply"
              payload: {}
              as: PlatformAdmin
              captures: { e_c: $.data.error_id }
            - call: "POST /dispositions/00000000-0000-4000-8000-000000000004/complete"
              payload: { outcome: "DISPOSED" }
              as: Courier
              as_user_id: "00000000-0000-4000-8000-0000000000aa"
              captures: { e_d: $.data.error_id }
          assert:
            - "e_m == ERR_MERCHANT_NOT_FOUND (404)"
            - "e_r == ERR_REPORT_NOT_FOUND (404)"
            - "e_c == ERR_CREDIT_NOT_FOUND (404)"
            - "e_d == ERR_DISPOSITION_NOT_FOUND (404)"

  # ===========================================================================
  - section: rbac
    instances:

      - name: merchant_cannot_create_couriers_or_settle_claims
        claim_type: Violation -> Error
        grounds:
          - roles.Merchant
          - errors.ERR_UNAUTHORIZED_ROLE
        distinguishing_aspect: "Merchant role is excluded from PlatformAdmin-exclusive operations: POST /couriers and POST /refund-claims/{id}/settle both return 403 ERR_UNAUTHORIZED_ROLE even with a valid merchant identity."
        test_recipe:
          setup:
            - "Base chain through o1 DELIVERED with an APPROVED claim."
          setup_api_calls:
            - *c_clock
            - *c_merchant
            - *c_activate
            - *c_store
            - *c_policy
            - *c_mgetv
            - *c_pact
            - *c_courier
            - *c_quote1
            - *c_order1
            - *c_accept
            - *c_ready
            - *c_batch
            - *c_dispatch
            - *c_pickup
            - *c_transit
            - *c_clock1
            - *c_deliver
            - *c_claim
            - call: "POST /refund-claims/${cl_id}/start-review"
              payload: {}
              as: SupportAgent
            - call: "POST /refund-claims/${cl_id}/decide"
              payload: { decision: "APPROVE" }
              as: SupportAgent
          trigger:
            - call: "POST /couriers"
              payload: { name: "Sneaky Courier" }
              as: Merchant
              as_user_id: "${m_id}"
              captures: { e1: $.data.error_id }
            - call: "POST /refund-claims/${cl_id}/settle"
              payload: {}
              as: Merchant
              as_user_id: "${m_id}"
              captures: { e2: $.data.error_id }
          assert:
            - "e1 == ERR_UNAUTHORIZED_ROLE (403)"
            - "e2 == ERR_UNAUTHORIZED_ROLE (403)"
            - "RefundClaim.${cl_id}.status still APPROVED"

      - name: courier_cannot_accept_orders_or_file_claims
        claim_type: Violation -> Error
        grounds:
          - roles.Courier
          - errors.ERR_UNAUTHORIZED_ROLE
        distinguishing_aspect: "Courier role is excluded from Merchant-exclusive operations: accept, disposition and claim filing all 403; the courier's own operations (pickup, transit, delivery) remain allowed."
        test_recipe:
          setup:
            - "Base chain through order created; courier exists."
          setup_api_calls:
            - *c_clock
            - *c_merchant
            - *c_activate
            - *c_store
            - *c_policy
            - *c_mgetv
            - *c_pact
            - *c_courier
            - *c_quote1
            - *c_order1
          trigger:
            - call: "POST /delivery-orders/${o1}/accept"
              payload: { promised_at: "2026-09-01T02:00:00Z" }
              as: Courier
              as_user_id: "${c_id}"
              captures: { e1: $.data.error_id }
            - call: "POST /delivery-orders/${o1}/disposition"
              payload: { resolution: "DISPOSE" }
              as: Courier
              as_user_id: "${c_id}"
              captures: { e2: $.data.error_id }
