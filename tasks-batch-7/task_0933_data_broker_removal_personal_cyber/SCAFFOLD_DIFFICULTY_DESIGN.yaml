  # =========================================================================
  # Rule 7 — Cross-entity state dependencies across different entity pairs
  # =========================================================================
  - rule_id: cross_entity_state_dependency
    instances:

      - name: scan_retry_blocked_by_paused_profile
        grounds:
          - validations[priority=20]
          - state_machines.ScanRun.FAILED_to_QUEUED
          - state_machines.MonitoredProfile.ACTIVE_to_PAUSED
          - errors[ERR_PROFILE_NOT_ACTIVE]
        distinguishing_aspect: |
          Entity pair ScanRun -> MonitoredProfile: a FAILED scan survives the pause cascade (which
          only cancels QUEUED scans), so retry is the one reachable path on which the profile's
          non-ACTIVE state blocks a ScanRun transition with ERR_PROFILE_NOT_ACTIVE.
        test_recipe:
          setup:
            - "FAMILY plan, ACTIVE account, one profile with an identifier, activated."
            - "One ScanRun taken to FAILED (retry_count 0)."
            - "The profile is then paused; the FAILED scan is untouched because the pause cascade only cancels QUEUED scans."
          setup_api_calls:
            - call: "POST /plans"
              payload: { tier: "FAMILY", name: "Family Shield", monthly_fee_cents: 2200, max_members: 4, profile_quota_per_cycle: 4, scan_quota_per_cycle: 12, removal_quota_per_cycle: 60, per_member_removal_subcap: 25 }
              as: PlatformAdmin
              as_user_id: "admin-1"
              captures: { plan_family_id: $.data.id }
            - call: "POST /accounts"
              payload: { plan_id: "${plan_family_id}", primary_member_email: "owner@example.com", primary_member_full_name: "Dana Owner" }
              as: PlatformAdmin
              as_user_id: "admin-1"
              captures: { acct_id: $.data.id, owner_id: $.data.primary_member_id }
            - call: "POST /monitored-profiles"
              payload: { member_id: "${owner_id}", full_name: "Dana Owner", date_of_birth: "1984-03-02", primary_address: "12 Elm St, Springfield", rescan_cadence_days: 30, two_factor_attested: false }
              as: AccountOwner
              as_user_id: "${owner_id}"
              captures: { prof_id: $.data.id, prof_v1: $.data.version }
            - call: "POST /monitored-profiles/${prof_id}/identifiers"
              payload: { identifier_type: "EMAIL", identifier_value: "dana@example.com", expected_profile_version: "${prof_v1}" }
              as: AccountOwner
              as_user_id: "${owner_id}"
            - call: "POST /monitored-profiles/${prof_id}/activate"
              payload: {}
              as: AccountOwner
              as_user_id: "${owner_id}"
            - call: "POST /scan-runs"
              payload: { profile_id: "${prof_id}", kind: "INITIAL" }
              as: PrivacyAgent
              as_user_id: "agent-alpha"
              captures: { scan_id: $.data.id }
            - call: "POST /scan-runs/${scan_id}/start"
              payload: {}
              as: PrivacyAgent
              as_user_id: "agent-alpha"
            - call: "POST /scan-runs/${scan_id}/fail"
              payload: { failure_reason: "broker portal timeout" }
              as: PrivacyAgent
              as_user_id: "agent-alpha"
            - call: "POST /monitored-profiles/${prof_id}/pause"
              payload: {}
              as: AccountOwner
              as_user_id: "${owner_id}"
          trigger:
            - call: "POST /scan-runs/${scan_id}/retry"
              payload: {}
              as: PrivacyAgent
              as_user_id: "agent-alpha"
              captures: { err: $.data.error_id }
          assert:
            - "HTTP status is 409 and data.error_id == ERR_PROFILE_NOT_ACTIVE"
            - "ScanRun.${scan_id}.status == FAILED (unchanged) and retry_count == 0"
            - "MonitoredProfile.${prof_id}.status == PAUSED"
            - "Re-activating the profile with POST /monitored-profiles/${prof_id}/activate and repeating the retry then succeeds with ScanRun.${scan_id}.status == QUEUED and retry_count == 1"

      - name: seat_rebind_blocked_by_suspended_addon
        grounds:
          - validations[priority=23]
          - state_machines.DeviceSeat.RELEASED_to_BOUND
          - state_machines.AddOnSubscription.ACTIVE_to_SUSPENDED
          - errors[ERR_ADDON_NOT_ACTIVE]
          - calculations.seat_rebind_eligibility
        distinguishing_aspect: |
          A different entity pair, DeviceSeat -> AddOnSubscription: a RELEASED seat is not voided by
          the add-on suspension (only BOUND seats are), so it survives into a state where its own
          72-hour cool-off has elapsed and the ONLY thing still blocking the rebind is the add-on's
          SUSPENDED status.
        test_recipe:
          setup:
            - "FAMILY plan, ACTIVE account, one ACTIVE VPN add-on with seats_total 2."
            - "One DeviceSeat bound then released at 2026-05-01T00:00:00Z, giving rebind_eligible_at 2026-05-04T00:00:00Z."
            - "The add-on is suspended (the RELEASED seat is untouched) and the clock is moved to 2026-05-05T00:00:00Z, well past the cool-off."
          setup_api_calls:
            - call: "POST /plans"
              payload: { tier: "FAMILY", name: "Family Shield", monthly_fee_cents: 2200, max_members: 4, profile_quota_per_cycle: 4, scan_quota_per_cycle: 12, removal_quota_per_cycle: 60, per_member_removal_subcap: 25 }
              as: PlatformAdmin
              as_user_id: "admin-1"
              captures: { plan_family_id: $.data.id }
            - call: "POST /accounts"
              payload: { plan_id: "${plan_family_id}", primary_member_email: "owner@example.com", primary_member_full_name: "Dana Owner" }
              as: PlatformAdmin
              as_user_id: "admin-1"
              captures: { acct_id: $.data.id, owner_id: $.data.primary_member_id }
            - call: "POST /accounts/${acct_id}/addons"
              payload: { addon_type: "DEVICE_PROTECTION", seats_total: 2, per_seat_fee_cents: 300 }
              as: AccountOwner
              as_user_id: "${owner_id}"
              captures: { addon_id: $.data.id, addon_v1: $.data.version }
            - call: "POST /device-seats"
              payload: { addon_id: "${addon_id}", member_id: "${owner_id}", device_label: "Dana Phone", expected_addon_version: "${addon_v1}" }
              as: AccountOwner
              as_user_id: "${owner_id}"
              captures: { seat_id: $.data.id }
            - call: "POST /device-seats/${seat_id}/release"
              payload: {}
              as: AccountOwner
              as_user_id: "${owner_id}"
            - call: "POST /addons/${addon_id}/suspend"
              payload: {}
              as: AccountOwner
              as_user_id: "${owner_id}"
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-05-05T00:00:00Z" }
              as: PlatformAdmin
              as_user_id: "admin-1"
          trigger:
            - call: "POST /device-seats/${seat_id}/rebind"
              payload: { device_label: "Dana Phone 2" }
              as: AccountOwner
              as_user_id: "${owner_id}"
              captures: { err: $.data.error_id }
          assert:
            - "HTTP status is 409 and data.error_id == ERR_ADDON_NOT_ACTIVE (rung 23), NOT ERR_SEAT_REBIND_COOLOFF"
            - "DeviceSeat.${seat_id}.status == RELEASED (unchanged) and bind_count == 1"
            - "DeviceSeat.${seat_id}.rebind_eligible_at == 2026-05-04T00:00:00.000Z, which is in the past, proving the cool-off rung was satisfied"
            - "AddOnSubscription.${addon_id}.status == SUSPENDED and seats_bound == 0"
            - "Resuming the add-on and repeating the rebind then succeeds with DeviceSeat.${seat_id}.status == BOUND and bind_count == 2"

      - name: removal_submit_gated_by_identity_document_state
        grounds:
          - validations[priority=25]
          - validations[priority=26]
          - calculations.identity_document_effective_status
          - state_machines.IdentityDocument.PENDING_to_VERIFIED
          - errors[ERR_IDENTITY_VERIFICATION_REQUIRED]
          - errors[ERR_IDENTITY_DOCUMENT_EXPIRED]
        distinguishing_aspect: |
          A third entity pair, RemovalRequest -> IdentityDocument, on a broker whose
          requires_identity_verification is true: with no document at all the submit fails with
