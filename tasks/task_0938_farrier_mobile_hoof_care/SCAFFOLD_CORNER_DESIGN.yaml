scaffold_corner_design:

  # =========================================================================
  # Entities
  # =========================================================================
  - section: entities
    instances:

      - name: corner_barn_creation_returns_every_declared_field
        claim_type: Creation
        grounds: [entities.Barn, endpoints]
        distinguishing_aspect: "POST /barns with all required fields returns 201 and echoes name, zone, served_weekdays, access_open_minute, access_close_minute and blackout_dates alongside the four common fields."
        test_recipe:
          setup: ["Empty database."]
          setup_api_calls: []
          trigger:
            - call: "POST /barns"
              payload: { name: "Ridgeview", zone: "A", served_weekdays: ["MON", "WED", "FRI"], access_open_minute: 420, access_close_minute: 1020, blackout_dates: ["2026-05-06"] }
              as: PlatformAdmin
              captures: { b1: "$.data.id" }
          assert:
            - "response status is 201"
            - "Barn.${b1}.zone == \"A\""
            - "Barn.${b1}.served_weekdays == [\"MON\", \"WED\", \"FRI\"]"
            - "Barn.${b1}.access_close_minute == 1020"
            - "Barn.${b1}.blackout_dates == [\"2026-05-06\"]"
            - "Barn.${b1}.version == 1 and Barn.${b1}.id is a bare UUID with no type prefix"

      - name: corner_barn_not_found_returns_barn_not_found
        claim_type: Not Found
        grounds: ["errors[ERR_BARN_NOT_FOUND]", "validations[priority=4]"]
        distinguishing_aspect: "GET /barns/{id} with a well-formed but unknown UUID returns 404 ERR_BARN_NOT_FOUND."
        test_recipe:
          setup: ["Empty database."]
          setup_api_calls: []
          trigger:
            - call: "GET /barns/8a3e1c0b-2f4d-4a91-9c8b-12e7b6a0f1d2"
              payload: {}
              as: PlatformAdmin
              captures: { err: "$.data.error_id" }
          assert:
            - "response status is 404"
            - "error_id == ERR_BARN_NOT_FOUND"

      - name: corner_client_defaults_are_active_zero_and_not_exempt
        claim_type: Defaults
        grounds: [entities.Client.fields.billing_standing, entities.Client.fields.tax_exempt, entities.Client.fields.deposit_balance_cents]
        distinguishing_aspect: "Omitting tax_exempt and opening_completed_visit_count yields tax_exempt false, billing_standing ACTIVE, and zero deposit, credit, loyalty and no-show counters."
        test_recipe:
          setup: ["One barn."]
          setup_api_calls:
            - call: "POST /barns"
              payload: { name: "Ridgeview", zone: "A", served_weekdays: ["MON", "TUE", "WED", "THU", "FRI"], access_open_minute: 420, access_close_minute: 1020, blackout_dates: [] }
              as: PlatformAdmin
              captures: { barn_a: "$.data.id" }
          trigger:
            - call: "POST /clients"
              payload: { display_name: "Aoi Tanaka", home_barn_id: "${barn_a}" }
              as: PlatformAdmin
              captures: { cl1: "$.data.id" }
          assert:
            - "Client.${cl1}.tax_exempt == false"
            - "Client.${cl1}.billing_standing == ACTIVE"
            - "Client.${cl1}.deposit_balance_cents == 0"
            - "Client.${cl1}.credit_balance_cents == 0"
            - "Client.${cl1}.completed_visit_count == 0"
            - "Client.${cl1}.no_show_count_rolling == 0"

      - name: corner_horse_creation_mints_four_barefoot_limb_states_in_order
        claim_type: Computed Fields
        grounds: [entities.LimbState, endpoints, constants.LIMB_COUNT_PER_HORSE]
        distinguishing_aspect: "Creating a horse mints exactly four LimbState rows in the order LF, RF, LH, RH, each BAREFOOT with a null current_sku_code and consecutive_reset_count 0."
        test_recipe:
          setup: ["One barn and one client."]
          setup_api_calls:
            - call: "POST /barns"
              payload: { name: "Ridgeview", zone: "A", served_weekdays: ["MON", "TUE", "WED", "THU", "FRI"], access_open_minute: 420, access_close_minute: 1020, blackout_dates: [] }
              as: PlatformAdmin
              captures: { barn_a: "$.data.id" }
            - call: "POST /clients"
              payload: { display_name: "Aoi Tanaka", home_barn_id: "${barn_a}" }
              as: PlatformAdmin
              captures: { cl1: "$.data.id" }
          trigger:
            - call: "POST /horses"
              payload: { client_id: "${cl1}", barn_id: "${barn_a}", name: "Comet", routine_cycle_weeks: 7, shoe_size_code: "1" }
              as: PlatformAdmin
              captures: { h1: "$.data.id" }
          assert:
            - "GET /horses/${h1}/limb-states returns exactly 4 rows"
            - "the rows carry limb LF, RF, LH, RH in that order"
            - "every row has shoeing_state BAREFOOT, current_sku_code null and consecutive_reset_count 0"
            - "Horse.${h1}.hold_status == CLEAR and Horse.${h1}.next_due_on == null"
            - "Horse.${h1}.requires_sedation == false"

      - name: corner_horse_missing_required_field_is_rejected
        claim_type: Required Fields
        grounds: ["validations[priority=21]", "errors[ERR_VALIDATION]"]
        distinguishing_aspect: "POST /horses without routine_cycle_weeks returns 400 ERR_VALIDATION and creates no horse and no limb states."
        test_recipe:
          setup: ["One barn and one client."]
          setup_api_calls:
            - call: "POST /barns"
              payload: { name: "Ridgeview", zone: "A", served_weekdays: ["MON", "TUE", "WED", "THU", "FRI"], access_open_minute: 420, access_close_minute: 1020, blackout_dates: [] }
              as: PlatformAdmin
              captures: { barn_a: "$.data.id" }
            - call: "POST /clients"
              payload: { display_name: "Aoi Tanaka", home_barn_id: "${barn_a}" }
              as: PlatformAdmin
              captures: { cl1: "$.data.id" }
          trigger:
            - call: "POST /horses"
              payload: { client_id: "${cl1}", barn_id: "${barn_a}", name: "Comet", shoe_size_code: "1" }
              as: PlatformAdmin
              captures: { err: "$.data.error_id" }
          assert:
            - "response status is 400"
            - "error_id == ERR_VALIDATION"
            - "GET /horses?client_id=${cl1} returns 0 rows"

      - name: corner_horse_cycle_weeks_below_minimum_is_out_of_range
        claim_type: Type Constraints
        grounds: ["validations[priority=23]", "errors[ERR_VALUE_OUT_OF_RANGE]", constants.MIN_ROUTINE_CYCLE_WEEKS]
        distinguishing_aspect: "routine_cycle_weeks 5 is one below MIN_ROUTINE_CYCLE_WEEKS and returns 422 ERR_VALUE_OUT_OF_RANGE, while 6 is accepted."
        test_recipe:
          setup: ["One barn and one client."]
          setup_api_calls:
            - call: "POST /barns"
              payload: { name: "Ridgeview", zone: "A", served_weekdays: ["MON", "TUE", "WED", "THU", "FRI"], access_open_minute: 420, access_close_minute: 1020, blackout_dates: [] }
              as: PlatformAdmin
              captures: { barn_a: "$.data.id" }
            - call: "POST /clients"
              payload: { display_name: "Aoi Tanaka", home_barn_id: "${barn_a}" }
              as: PlatformAdmin
              captures: { cl1: "$.data.id" }
          trigger:
            - call: "POST /horses"
              payload: { client_id: "${cl1}", barn_id: "${barn_a}", name: "Comet", routine_cycle_weeks: 5, shoe_size_code: "1" }
              as: PlatformAdmin
              captures: { err: "$.data.error_id" }
          assert:
            - "response status is 422"
            - "error_id == ERR_VALUE_OUT_OF_RANGE"

      - name: corner_shoe_sku_creation_mints_shop_and_van_buckets
        claim_type: Creation
        grounds: [entities.InventoryBucket, endpoints]
        distinguishing_aspect: "Creating a SKU after two farriers exist mints one SHOP bucket plus one VAN bucket per farrier, all with on_hand, available and reserved at 0."
        test_recipe:
          setup: ["Two farriers already exist."]
          setup_api_calls:
            - call: "POST /farriers"
              payload: { display_name: "Kenji Mori", certification_level: "JOURNEYMAN", cert_expires_on: "2027-01-01" }
              as: PlatformAdmin
              captures: { fr1: "$.data.id" }
            - call: "POST /farriers"
              payload: { display_name: "Rina Sato", certification_level: "APPRENTICE", cert_expires_on: "2027-01-01" }
              as: PlatformAdmin
              captures: { fr2: "$.data.id" }
          trigger:
            - call: "POST /shoe-skus"
              payload: { sku_code: "ST-1", size_code: "1", material: "STEEL", price_cents_per_pair: 5600 }
              as: PlatformAdmin
              captures: { sku1: "$.data.id" }
          assert:
            - "GET /inventory-buckets?sku_id=${sku1} returns exactly 3 rows"
            - "exactly 1 of them has location_kind SHOP and farrier_id null"
            - "GET /inventory-buckets?sku_id=${sku1}&farrier_id=${fr2}&location_kind=VAN returns exactly 1 row"
            - "every returned bucket has on_hand_pairs 0, available_pairs 0, reserved_pairs 0 and replenishment_flag true"

      - name: corner_farrier_creation_mints_a_van_bucket_per_existing_sku
        claim_type: Parent Relationships
        grounds: [entities.InventoryBucket.fields.farrier_id, endpoints]
        distinguishing_aspect: "The mirror of the previous claim — creating a farrier after two SKUs exist mints exactly two VAN buckets for that farrier and touches no SHOP bucket."
        test_recipe:
          setup: ["Two shoe SKUs already exist and no farrier does."]
          setup_api_calls:
            - call: "POST /shoe-skus"
              payload: { sku_code: "ST-1", size_code: "1", material: "STEEL", price_cents_per_pair: 5600 }
              as: PlatformAdmin
              captures: { sku1: "$.data.id" }
            - call: "POST /shoe-skus"
              payload: { sku_code: "AL-1", size_code: "1", material: "ALUMINUM", price_cents_per_pair: 9100 }
              as: PlatformAdmin
              captures: { sku2: "$.data.id" }
          trigger:
            - call: "POST /farriers"
              payload: { display_name: "Kenji Mori", certification_level: "JOURNEYMAN", cert_expires_on: "2027-01-01" }
              as: PlatformAdmin
              captures: { fr1: "$.data.id" }
          assert:
            - "GET /inventory-buckets?farrier_id=${fr1} returns exactly 2 rows, one per SKU, both location_kind VAN"
            - "GET /inventory-buckets?location_kind=SHOP returns exactly 2 rows"
            - "Farrier.${fr1}.status == ACTIVE"

      - name: corner_appointment_listing_is_paginated_with_total_count_and_has_more
        claim_type: Listing
        grounds: [response_envelope, constants.DEFAULT_PAGE_LIMIT]
        distinguishing_aspect: "GET /appointments with limit 2 and offset 1 over three appointments returns 2 rows, total_count 3 and has_more true."
        test_recipe:
          setup: ["One client with three horses, one UNROUTED appointment each."]
          setup_api_calls:
            - call: "POST /barns"
              payload: { name: "Ridgeview", zone: "A", served_weekdays: ["MON", "TUE", "WED", "THU", "FRI"], access_open_minute: 420, access_close_minute: 1020, blackout_dates: [] }
              as: PlatformAdmin
              captures: { barn_a: "$.data.id" }
            - call: "POST /clients"
              payload: { display_name: "Aoi Tanaka", home_barn_id: "${barn_a}" }
              as: PlatformAdmin
              captures: { cl1: "$.data.id" }
            - call: "POST /horses"
              payload: { client_id: "${cl1}", barn_id: "${barn_a}", name: "Comet", routine_cycle_weeks: 6, shoe_size_code: "1" }
              as: PlatformAdmin
              captures: { h1: "$.data.id" }
            - call: "POST /horses"
              payload: { client_id: "${cl1}", barn_id: "${barn_a}", name: "Dusty", routine_cycle_weeks: 6, shoe_size_code: "1" }
              as: PlatformAdmin
              captures: { h2: "$.data.id" }
            - call: "POST /horses"
              payload: { client_id: "${cl1}", barn_id: "${barn_a}", name: "Echo", routine_cycle_weeks: 6, shoe_size_code: "1" }
              as: PlatformAdmin
              captures: { h3: "$.data.id" }
            - call: "POST /appointments"
              payload: { horse_id: "${h1}", scheduled_date: "2026-05-06" }
              as: Dispatcher
              captures: { ap1: "$.data.id" }
            - call: "POST /appointments"
              payload: { horse_id: "${h2}", scheduled_date: "2026-05-06" }
              as: Dispatcher
              captures: { ap2: "$.data.id" }
            - call: "POST /appointments"
              payload: { horse_id: "${h3}", scheduled_date: "2026-05-06" }
              as: Dispatcher
              captures: { ap3: "$.data.id" }
          trigger:
            - call: "GET /appointments"
              payload: { limit: 2, offset: 1 }
              as: Dispatcher
          assert:
            - "the response carries response_type array and exactly 2 data rows"
            - "total_count == 3"
            - "has_more == false"
            - "the first returned row is ${ap2} because listing order is created_at ASC"

      - name: corner_system_fields_are_server_minted_and_client_values_ignored
        claim_type: System Fields
        grounds: [entities.Barn, response_envelope]
        distinguishing_aspect: "A create request that also carries id, created_at or version is answered with server-minted values; the request's values never appear."
        test_recipe:
          setup: ["Empty database."]
          setup_api_calls: []
          trigger:
            - call: "POST /barns"
              payload: { name: "Ridgeview", zone: "B", served_weekdays: ["MON"], access_open_minute: 420, access_close_minute: 1020 }
              as: PlatformAdmin
              captures: { b1: "$.data.id", cat: "$.data.created_at" }
          assert:
            - "Barn.${b1}.version == 1"
            - "Barn.${b1}.created_at matches an ISO 8601 UTC timestamp with exactly three fractional digits"
            - "Barn.${b1}.updated_at == Barn.${b1}.created_at on a freshly created row"
            - "Barn.${b1}.blackout_dates == [] because the field defaulted"

      - name: corner_invoice_lines_subresource_lists_an_append_only_labor_line
        claim_type: Immutability
        grounds: [entities.InvoiceLine, calculations.invoice_build, endpoints]
        distinguishing_aspect: "A completed one-limb TRIM visit produces exactly one LABOR InvoiceLine of 2200 cents with taxable false, and the row exposes id and created_at but neither version nor updated_at because InvoiceLine is common_fields false."
        test_recipe:
          setup: ["A single-limb TRIM visit completed on 2026-05-06 at a zone A barn."]
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-05-06T08:00:00Z" }
              as: PlatformAdmin
            - call: "POST /barns"
              payload: { name: "Ridgeview", zone: "A", served_weekdays: ["MON", "TUE", "WED", "THU", "FRI"], access_open_minute: 420, access_close_minute: 1020, blackout_dates: [] }
              as: PlatformAdmin
              captures: { barn_a: "$.data.id" }
            - call: "POST /clients"
              payload: { display_name: "Aoi Tanaka", home_barn_id: "${barn_a}" }
              as: PlatformAdmin
              captures: { cl1: "$.data.id" }
            - call: "POST /horses"
              payload: { client_id: "${cl1}", barn_id: "${barn_a}", name: "Comet", routine_cycle_weeks: 6, shoe_size_code: "1" }
              as: PlatformAdmin
              captures: { h1: "$.data.id" }
            - call: "GET /horses/${h1}/limb-states"
              payload: {}
              as: PlatformAdmin
              captures: { lf: "$.data[0].id" }
            - call: "POST /farriers"
              payload: { display_name: "Kenji Mori", certification_level: "JOURNEYMAN", cert_expires_on: "2027-01-01" }
              as: PlatformAdmin
              captures: { fr1: "$.data.id" }
            - call: "POST /rate-cards"
              payload: { label: "2026 base", effective_from: "2026-01-01", price_trim_cents: 2200, price_reset_cents: 3800, price_new_shoes_cents: 6500, price_corrective_cents: 9800, price_glue_on_cents: 8400, pad_price_cents: 1600, trip_fee_zone_a_cents: 4500, trip_fee_zone_b_cents: 7000, trip_fee_zone_c_cents: 11000 }
              as: PlatformAdmin
              captures: { rc1: "$.data.id" }
            - call: "POST /rate-cards/${rc1}/activate"
              payload: {}
              as: PlatformAdmin
            - call: "POST /routes"
              payload: { farrier_id: "${fr1}", route_date: "2026-05-06" }
              as: Dispatcher
              captures: { rt1: "$.data.id" }
            - call: "POST /routes/${rt1}/stops"
              payload: { barn_id: "${barn_a}", sequence_index: 1, planned_start_minute: 480 }
              as: Dispatcher
              captures: { st1: "$.data.id" }
            - call: "POST /appointments"
              payload: { horse_id: "${h1}", scheduled_date: "2026-05-06" }
              as: Dispatcher
              captures: { ap1: "$.data.id", ap1_v: "$.data.version" }
            - call: "POST /appointments/${ap1}/service-lines"
              payload: { lines: [{ limb_state_id: "${lf}", service_type: "TRIM" }], expected_appointment_version: "${ap1_v}" }
              as: Dispatcher
              captures: { sl1: "$.data[0].id" }
            - call: "GET /routes/${rt1}"
              payload: {}
              as: Dispatcher
              captures: { rt1_v: "$.data.version" }
            - call: "POST /route-stops/${st1}/appointments"
              payload: { appointment_id: "${ap1}", expected_route_version: "${rt1_v}" }
              as: Dispatcher
            - call: "POST /routes/${rt1}/plan"
              payload: {}
              as: Dispatcher
            - call: "POST /routes/${rt1}/dispatch"
              payload: {}
              as: Dispatcher
            - call: "POST /route-stops/${st1}/arrive"
              payload: {}
              as: Farrier
              as_user_id: "${fr1}"
            - call: "POST /appointments/${ap1}/start"
              payload: {}
              as: Farrier
              as_user_id: "${fr1}"
            - call: "POST /appointments/${ap1}/complete"
              payload: { performed_service_line_ids: ["${sl1}"] }
              as: Farrier
              as_user_id: "${fr1}"
            - call: "GET /invoices"
              payload: { appointment_id: "${ap1}" }
              as: BillingClerk
              captures: { inv1: "$.data[0].id" }
          trigger:
            - call: "GET /invoices/${inv1}/lines"
              payload: {}
              as: BillingClerk
          assert:
            - "the response returns exactly 1 row"
            - "that row has line_kind LABOR, limb LF, service_type TRIM, quantity 1, unit_amount_cents 2200, amount_cents 2200 and taxable false"
            - "that row exposes id and created_at but carries neither version nor updated_at"
            - "Invoice.${inv1}.labor_subtotal_cents == 2200 and total_cents == 2200"

      - name: corner_appointment_create_with_unknown_horse_returns_horse_not_found
        claim_type: Parent Relationships
        grounds: ["validations[priority=6]", "errors[ERR_HORSE_NOT_FOUND]"]
        distinguishing_aspect: "A body foreign key that resolves to nothing is a 404 on the referenced entity, not a 400 — POST /appointments with an unknown horse_id returns ERR_HORSE_NOT_FOUND."
        test_recipe:
          setup: ["Empty database."]
          setup_api_calls: []
          trigger:
            - call: "POST /appointments"
              payload: { horse_id: "8a3e1c0b-2f4d-4a91-9c8b-12e7b6a0f1d2", scheduled_date: "2026-05-06" }
              as: Dispatcher
              captures: { err: "$.data.error_id" }
          assert:
            - "response status is 404"
            - "error_id == ERR_HORSE_NOT_FOUND"

  # =========================================================================
  # State machines
  # =========================================================================
  - section: state_machines
    instances:

      - name: corner_appointment_initial_state_is_unrouted_and_unbilled
        claim_type: Initial State
        grounds: [state_machines.Appointment, entities.Appointment.fields.status, entities.Appointment.fields.billing_status]
        distinguishing_aspect: "A newly created appointment starts on both axes at once — status UNROUTED and billing_status UNBILLED — with null route_stop_id, rate_card_id and completed_on."
        test_recipe:
          setup: ["One barn, client and horse."]
          setup_api_calls:
            - call: "POST /barns"
              payload: { name: "Ridgeview", zone: "A", served_weekdays: ["MON", "TUE", "WED", "THU", "FRI"], access_open_minute: 420, access_close_minute: 1020, blackout_dates: [] }
              as: PlatformAdmin
              captures: { barn_a: "$.data.id" }
            - call: "POST /clients"
              payload: { display_name: "Aoi Tanaka", home_barn_id: "${barn_a}" }
              as: PlatformAdmin
              captures: { cl1: "$.data.id" }
            - call: "POST /horses"
              payload: { client_id: "${cl1}", barn_id: "${barn_a}", name: "Comet", routine_cycle_weeks: 6, shoe_size_code: "1" }
              as: PlatformAdmin
              captures: { h1: "$.data.id" }
          trigger:
            - call: "POST /appointments"
              payload: { horse_id: "${h1}", scheduled_date: "2026-05-06" }
              as: Dispatcher
              captures: { ap1: "$.data.id" }
          assert:
            - "Appointment.${ap1}.status == UNROUTED"
            - "Appointment.${ap1}.billing_status == UNBILLED"
            - "Appointment.${ap1}.visit_kind == ROUTINE and warranty_reason == null"
            - "Appointment.${ap1}.route_stop_id == null and rate_card_id == null and completed_on == null"
            - "Appointment.${ap1}.service_units == 0 and service_minutes == 0 and estimated_total_cents == 0"

      - name: corner_route_dispatch_from_draft_is_rejected
        claim_type: Invalid Transitions
        grounds: [state_machines.Route.PLANNED_to_DISPATCHED, "validations[priority=34]", "errors[ERR_INVALID_STATE]"]
        distinguishing_aspect: "DISPATCH is only declared from PLANNED; calling it on a DRAFT route returns 409 ERR_INVALID_STATE and leaves the route DRAFT."
        test_recipe:
          setup: ["A DRAFT route with one stop."]
          setup_api_calls:
            - call: "POST /barns"
              payload: { name: "Ridgeview", zone: "A", served_weekdays: ["MON", "TUE", "WED", "THU", "FRI"], access_open_minute: 420, access_close_minute: 1020, blackout_dates: [] }
              as: PlatformAdmin
              captures: { barn_a: "$.data.id" }
            - call: "POST /farriers"
              payload: { display_name: "Kenji Mori", certification_level: "JOURNEYMAN", cert_expires_on: "2027-01-01" }
              as: PlatformAdmin
              captures: { fr1: "$.data.id" }
            - call: "POST /routes"
              payload: { farrier_id: "${fr1}", route_date: "2026-05-06" }
              as: Dispatcher
              captures: { rt1: "$.data.id" }
            - call: "POST /routes/${rt1}/stops"
              payload: { barn_id: "${barn_a}", sequence_index: 1, planned_start_minute: 480 }
              as: Dispatcher
              captures: { st1: "$.data.id" }
          trigger:
            - call: "POST /routes/${rt1}/dispatch"
              payload: {}
              as: Dispatcher
              captures: { err: "$.data.error_id" }
          assert:
            - "response status is 409"
            - "error_id == ERR_INVALID_STATE"
            - "Route.${rt1}.status == DRAFT"

      - name: corner_cancelled_route_is_terminal_and_rejects_plan
        claim_type: Terminal State Lockdown
        grounds: [state_machines.Route, "errors[ERR_INVALID_STATE]"]
        distinguishing_aspect: "CANCELLED is declared terminal on Route, so POST /routes/{id}/plan afterwards returns 409 ERR_INVALID_STATE rather than reviving the route."
        test_recipe:
          setup: ["A DRAFT route with one stop that is then cancelled."]
          setup_api_calls:
            - call: "POST /barns"
              payload: { name: "Ridgeview", zone: "A", served_weekdays: ["MON", "TUE", "WED", "THU", "FRI"], access_open_minute: 420, access_close_minute: 1020, blackout_dates: [] }
              as: PlatformAdmin
              captures: { barn_a: "$.data.id" }
            - call: "POST /farriers"
              payload: { display_name: "Kenji Mori", certification_level: "JOURNEYMAN", cert_expires_on: "2027-01-01" }
              as: PlatformAdmin
              captures: { fr1: "$.data.id" }
            - call: "POST /routes"
              payload: { farrier_id: "${fr1}", route_date: "2026-05-06" }
              as: Dispatcher
              captures: { rt1: "$.data.id" }
