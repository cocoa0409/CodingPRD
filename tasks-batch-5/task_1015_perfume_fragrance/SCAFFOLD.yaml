scenario: "1015. Perfume & Fragrance Retail/Sampling: SKU & note/finder, sample/decant & discovery-set, subscription (scent-of-month), loyalty, hygiene/return, gift-set & bundle, allocation/exclusive, inventory"
domain_name: "perfume-fragrance-retail"
api_prefix: "/"

complexity_profile:
  primary_archetype: "Quota / allocation"
  secondary_archetype: "Pricing engine"
  complexity_layers:
    - optimistic_concurrency
    - cascading_side_effects
    - dual_variant_calculation
    - rate_threshold_triggers
  entity_topology: hybrid
  state_machine_shape: parallel
  relationship_patterns:
    - one_to_many
    - many_to_many
    - cross_aggregate
  role_model: hierarchical_override
  consistency_model: immediate

response_envelope:
  success: |
    { "meta": { "api_request_id": "req_xxx", "api_request_timestamp": "ISO8601" },
      "response_type": "object" | "array", "data": {} }
  error: |
    { "meta": { ... }, "response_type": "error",
      "data": { "error_id": "ERR_XXX", "message": "..." } }
  pagination_fields: ["limit", "offset", "total_count", "has_more"]
  pagination_defaults: { limit: 10, min: 1, max: 100, offset: 0 }

# =====================================================================
# §1.1 Entity-Relationship Table
# =====================================================================
entities:
  - name: Customer
    parent: null
    common_fields: true
    fields:
      - name: email
        type: string
        source: input
        description: "Login/contact email; unique across customers."
        constraints: "unique, non-empty"
      - name: full_name
        type: string
        source: input
        description: "Customer display name."
      - name: status
        type: enum
        source: system
        description: "Account status."
        default: ACTIVE
        constraints: "one of {ACTIVE, SUSPENDED}"
      - name: loyalty_points_balance
        type: integer
        source: computed
        description: "Current redeemable loyalty points; equals the sum of all LoyaltyTransaction.points_delta rows for this customer (1 point == 1 cent of discount)."
        default: 0
      - name: lifetime_spend_cents
        type: integer
        source: computed
        description: "Cumulative net merchandise paid (net_after_loyalty at fulfill, decremented on return approval). Drives tier."
        default: 0
      - name: tier
        type: enum
        source: computed
        description: "Loyalty tier derived from lifetime_spend_cents via calculations.customer_tier."
        default: BRONZE
        constraints: "one of {BRONZE, SILVER, GOLD}"

  - name: Product
    parent: null
    common_fields: true
    fields:
      - name: name
        type: string
        source: input
        description: "Product/SKU name."
      - name: brand
        type: string
        source: input
        description: "Fragrance house / brand."
      - name: kind
        type: enum
        source: input
        description: "Merchandising kind."
        default: SINGLE
        constraints: "one of {SINGLE, BUNDLE, DISCOVERY_SET}"
      - name: concentration
        type: enum
        source: input
        description: "Fragrance concentration class."
        constraints: "one of {EDT, EDP, PARFUM, COLOGNE}"
      - name: notes
        type: array
        source: input
        description: "Embedded scent notes: array of objects { name:string, family:enum(CITRUS,FLORAL,WOODY,ORIENTAL,FOUGERE,GOURMAND), level:enum(TOP,HEART,BASE) }. Basis of the note/finder query GET /products."
        default: []
      - name: is_exclusive
        type: boolean
        source: input
        description: "When true, purchasable only by claiming allocation from an OPEN AllocationWindow; subject to per_customer_limit."
        default: false
      - name: per_customer_limit
        type: integer
        source: input
        description: "Max cumulative allocation units one Customer may claim across ALL of this product's windows (only meaningful when is_exclusive). Null means unlimited."
        default: null
      - name: component_variant_ids
        type: array
        source: input
        description: "For kind in {BUNDLE, DISCOVERY_SET}: the Variant ids bundled together (informational manifest). Not FK-parsed (array)."
        default: []
      - name: hygiene_returnable
        type: boolean
        source: input
        description: "When false (default for fragrances), OrderLines of this product's variants reported OPENED are non-returnable (hygiene rule)."
        default: false

  - name: Variant
    parent: Product
    common_fields: true
    fields:
      - name: product_id
        type: string
        source: input
        description: "FK -> Product.id; the parent SKU this purchasable form belongs to."
      - name: kind
        type: enum
        source: input
        description: "Purchasable form."
        constraints: "one of {FULL_BOTTLE, DECANT, SAMPLE}"
      - name: volume_ml
        type: number
        source: input
        description: "Volume of this variant in millilitres."
      - name: unit_price_cents
        type: integer
        source: input
        description: "Unit price in cents; snapshotted onto OrderLine.unit_price_cents at line creation."
        constraints: ">= 0"
      - name: on_hand_qty
        type: integer
        source: input
        description: "Physical units on hand and sellable (seed value at creation; mutated by reserve/release/commit). Availability = on_hand_qty."
        default: 0
        constraints: ">= 0"
      - name: reserved_qty
        type: integer
        source: computed
        description: "Units reserved by PLACED-but-unfulfilled orders. Conserved quantity units_total = on_hand_qty + reserved_qty is invariant across reserve(place)/release(cancel)."
        default: 0
      - name: status
        type: enum
        source: computed
        description: "AVAILABLE when on_hand_qty > 0 else OUT_OF_STOCK."
        default: AVAILABLE
        constraints: "one of {AVAILABLE, OUT_OF_STOCK}"

  - name: Order
    parent: null
    common_fields: true
    fields:
      - name: customer_id
        type: string
        source: input
        description: "FK -> Customer.id; the owning customer."
      - name: fulfillment_status
        type: enum
        source: computed
        description: "Fulfillment dimension (evolves independently of payment_status)."
        default: CART
        constraints: "one of {CART, PLACED, FULFILLED, CANCELLED, PARTIALLY_RETURNED, RETURNED}"
      - name: payment_status
        type: enum
        source: computed
        description: "Payment dimension (evolves independently of fulfillment_status)."
        default: UNPAID
        constraints: "one of {UNPAID, PAID, REFUNDED, PARTIALLY_REFUNDED}"
      - name: subtotal_cents
        type: integer
        source: computed
        description: "Sum of OrderLine.line_total_cents over ACTIVE lines at place time."
        default: 0
      - name: discount_cents
        type: integer
        source: computed
        description: "Volume-tier discount at place (calculations.order_pricing)."
        default: 0
      - name: loyalty_redeemed_cents
        type: integer
        source: computed
        description: "Cents of order value paid by redeemed loyalty points at place (1 point == 1 cent)."
        default: 0
      - name: shipping_fee_cents
        type: integer
        source: computed
        description: "Shipping fee at place; 0 when net_after_loyalty >= FREE_SHIP_THRESHOLD_CENTS else SHIPPING_FLAT_CENTS."
        default: 0
      - name: total_cents
        type: integer
        source: computed
        description: "Amount charged at place = net_after_loyalty + shipping_fee_cents."
        default: 0

  - name: OrderLine
    parent: Order
    common_fields: true
    fields:
      - name: order_id
        type: string
        source: input
        description: "FK -> Order.id; the owning order."
      - name: variant_id
        type: string
        source: input
        description: "FK -> Variant.id; the purchased variant."
      - name: quantity
        type: integer
        source: input
        description: "Units of the variant on this line."
        constraints: ">= 1"
      - name: unit_price_cents
        type: integer
        source: computed
        description: "Snapshot of Variant.unit_price_cents at line creation."
      - name: line_total_cents
        type: integer
        source: computed
        description: "unit_price_cents * quantity."
      - name: points_earned
        type: integer
        source: computed
        description: "Loyalty points attributed to this line, set at order fulfill = round_half_up(line_total_cents/100 * tier_multiplier). Clawed back exactly on return approval."
        default: 0
      - name: status
        type: enum
        source: computed
        description: "Line lifecycle."
        default: ACTIVE
        constraints: "one of {ACTIVE, RETURNED, CANCELLED}"

  - name: Subscription
    parent: null
    common_fields: true
    fields:
      - name: customer_id
        type: string
        source: input
        description: "FK -> Customer.id; scent-of-month subscriber."
      - name: tier
        type: enum
        source: input
        description: "Scent-of-month tier."
        constraints: "one of {BASIC, PREMIUM}"
      - name: monthly_fee_cents
        type: integer
        source: input
        description: "Fee currently in effect per monthly shipment (cents)."
        constraints: ">= 0"
      - name: pending_fee_cents
        type: integer
        source: input
        description: "Scheduled new fee that takes effect on/after fee_effective_date; null if no change scheduled."
        default: null
      - name: fee_effective_date
        type: datetime
        source: input
        description: "ISO 8601 UTC date the pending_fee_cents becomes effective; null if none."
        default: null
      - name: included_sample_credits
        type: integer
        source: input
        description: "Sample credits granted per shipment."
        default: 0
      - name: status
        type: enum
        source: computed
        description: "Subscription lifecycle (cyclic ACTIVE<->PAUSED)."
        default: ACTIVE
        constraints: "one of {ACTIVE, PAUSED, CANCELLED}"
      - name: current_period_end
        type: datetime
        source: computed
        description: "End of the current billing period (period_start + 1 month), used by projected_next_charge_cents."
      - name: projected_next_charge_cents
        type: integer
        source: computed
        description: "Forward-looking projected charge for the NEXT period (calculations.subscription_charge, variant=projected). Differs from a shipment's actual charge when a fee change straddles the boundary."
        default: 0

  - name: Shipment
    parent: Subscription
    common_fields: true
    fields:
      - name: subscription_id
        type: string
        source: input
        description: "FK -> Subscription.id; the parent subscription."
      - name: period_start
        type: datetime
        source: input
        description: "Inclusive start of this shipment's billing period (half-open [period_start, period_end))."
      - name: period_end
        type: datetime
        source: input
        description: "Exclusive end of this shipment's billing period."
      - name: charge_cents
        type: integer
        source: computed
        description: "Actual charge (calculations.subscription_charge, variant=actual) = fee effective at period_start."
        default: 0
      - name: status
        type: enum
        source: computed
        description: "Shipment lifecycle."
        default: PENDING
        constraints: "one of {PENDING, FULFILLED}"

  - name: AllocationWindow
    parent: Product
    common_fields: true
    fields:
      - name: product_id
        type: string
        source: input
        description: "FK -> Product.id; the exclusive product whose allocation this window releases."
      - name: window_start
        type: datetime
        source: input
        description: "Inclusive start of the claimable window (closed interval [window_start, window_end])."
      - name: window_end
        type: datetime
        source: input
        description: "Inclusive end of the claimable window."
      - name: total_allocation
        type: integer
        source: input
        description: "Total units releasable in this window."
        constraints: ">= 1"
      - name: per_customer_cap
        type: integer
        source: input
        description: "Max units a single customer may claim within THIS window."
        constraints: ">= 1"
      - name: claimed_units
        type: integer
        source: computed
        description: "Sum of AllocationClaim.units for this window; conserved: claimed_units == sum(claim.units)."
        default: 0
      - name: status
        type: enum
        source: computed
        description: "Clock-derived: SCHEDULED (now < window_start), OPEN (window_start <= now <= window_end), CLOSED (now > window_end)."
        default: SCHEDULED
        constraints: "one of {SCHEDULED, OPEN, CLOSED}"

  - name: AllocationClaim
    parent: AllocationWindow
    common_fields: false
    fields:
      - name: window_id
        type: string
        source: input
        description: "FK -> AllocationWindow.id; the window this claim draws from."
      - name: customer_id
        type: string
        source: input
        description: "FK -> Customer.id; the claiming customer."
      - name: units
        type: integer
        source: input
        description: "Units claimed."
        constraints: ">= 1"

  - name: ReturnRequest
    parent: Order
    common_fields: true
    fields:
      - name: order_id
        type: string
        source: input
        description: "FK -> Order.id; the order being returned (customer derived from order.customer_id)."
      - name: line_ids
        type: array
        source: input
        description: "Array of OrderLine.id values (all must belong to order_id) being returned."
      - name: condition
        type: enum
        source: input
        description: "Reported physical condition of the returned merchandise."
        constraints: "one of {SEALED, OPENED}"
      - name: refund_estimate_cents
        type: integer
        source: computed
        description: "Provisional refund quoted at request (calculations.return_refund, variant=estimate) = sum(returned line_total) - RESTOCK_FEE_ESTIMATE_CENTS."
        default: 0
      - name: final_refund_cents
        type: integer
        source: computed
        description: "Final refund settled at approval (calculations.return_refund, variant=final); depends on condition + product.hygiene_returnable."
        default: 0
      - name: status
        type: enum
        source: computed
        description: "Return lifecycle (branching REQUESTED -> {APPROVED, REJECTED})."
        default: REQUESTED
        constraints: "one of {REQUESTED, APPROVED, REJECTED}"

  - name: LoyaltyTransaction
    parent: Customer
    common_fields: false
    fields:
      - name: customer_id
        type: string
        source: input
        description: "FK -> Customer.id; the ledger owner."
      - name: points_delta
        type: integer
        source: system
        description: "Signed points change (+EARN, -REDEEM, -REVERSAL). Customer.loyalty_points_balance == sum of these."
      - name: reason
        type: enum
        source: system
        description: "Ledger reason."
        constraints: "one of {EARN, REDEEM, REVERSAL}"
      - name: source_type
        type: enum
        source: system
        description: "Polymorphic origin kind (not an FK)."
        constraints: "one of {ORDER, RETURN}"
      - name: source_id
        type: string
        source: system
        description: "Id of the originating Order or ReturnRequest (polymorphic reference, not FK-parsed)."

# =====================================================================
# §1.2 State Machine Table
# =====================================================================
state_machines:
  - entity: Customer
    initial_state: ACTIVE
    terminal_states: [SUSPENDED]
    transitions:
      - from: ACTIVE
        to: SUSPENDED
        trigger: "POST /customers/{id}/suspend"
        actor: PlatformAdmin
        preconditions: ["customer.status == ACTIVE"]
        side_effects: ["increments Customer.version by 1"]
        note: "A SUSPENDED customer cannot place orders or claim allocation (cross-entity gate)."

  - entity: Order
    initial_state: CART
    terminal_states: [CANCELLED, RETURNED]
    transitions:
      - from: CART
        to: PLACED
        trigger: "POST /orders/{id}/place"
        actor: Customer
        preconditions:
          - "order.fulfillment_status == CART"
          - "order has >= 1 ACTIVE line (else ERR_EMPTY_ORDER)"
          - "owning Customer.status == ACTIVE (else ERR_CUSTOMER_SUSPENDED)"
          - "for each line: variant.on_hand_qty >= line.quantity (else ERR_INSUFFICIENT_STOCK)"
          - "redeem_points <= customer.loyalty_points_balance (else ERR_INSUFFICIENT_POINTS)"
        side_effects:
          - "compute subtotal_cents, discount_cents, loyalty_redeemed_cents, shipping_fee_cents, total_cents (calculations.order_pricing)"
          - "for each line: variant.on_hand_qty -= line.quantity; variant.reserved_qty += line.quantity (reserve; units_total conserved)"
          - "set payment_status = PAID"
          - "if redeem_points > 0: create LoyaltyTransaction{reason=REDEEM, points_delta=-loyalty_redeemed_cents}; Customer.loyalty_points_balance -= loyalty_redeemed_cents"
        note: "fulfillment dimension advances to PLACED; payment dimension advances to PAID (parallel dimensions)."
      - from: PLACED
        to: FULFILLED
        trigger: "POST /orders/{id}/fulfill"
        actor: FulfillmentOps
        preconditions: ["order.fulfillment_status == PLACED"]
        side_effects:
          - "for each ACTIVE line: variant.reserved_qty -= line.quantity (commit; units leave inventory as sold)"
          - "for each ACTIVE line: set OrderLine.points_earned = round_half_up(line.line_total_cents/100 * tier_multiplier(customer.tier))"
          - "create LoyaltyTransaction{reason=EARN, points_delta=+sum(line.points_earned)}; Customer.loyalty_points_balance += that sum"
          - "Customer.lifetime_spend_cents += net_after_loyalty (= subtotal - discount - loyalty_redeemed)"
          - "recompute Customer.tier (calculations.customer_tier)"
        note: "Cascade Order->Customer(ledger,balance,lifetime,tier)."
      - from: CART
        to: CANCELLED
        trigger: "POST /orders/{id}/cancel"
        actor: Customer
        preconditions: ["order.fulfillment_status == CART"]
        side_effects: ["set fulfillment_status = CANCELLED"]
      - from: PLACED
        to: CANCELLED
        trigger: "POST /orders/{id}/cancel"
        actor: Customer
        preconditions: ["order.fulfillment_status == PLACED"]
        side_effects:
          - "for each ACTIVE line: OrderLine.status = CANCELLED; that line-cancellation releases its variant: variant.reserved_qty -= line.quantity; variant.on_hand_qty += line.quantity (units_total conserved)"
          - "set payment_status = REFUNDED"
          - "if loyalty_redeemed_cents > 0: create LoyaltyTransaction{reason=EARN? no -> REVERSAL of redeem}; restore Customer.loyalty_points_balance += loyalty_redeemed_cents"
        note: "Depth-2 cascade: Order cancel -> OrderLine cancelled -> Variant inventory released."
      - from: FULFILLED
        to: PARTIALLY_RETURNED
        trigger: "system: ReturnRequest APPROVED for a strict subset of ACTIVE lines"
        actor: system
        preconditions: ["at least one but not all ACTIVE lines returned"]
        side_effects: ["payment_status = PARTIALLY_REFUNDED"]
      - from: FULFILLED
        to: RETURNED
        trigger: "system: ReturnRequest APPROVED covering all remaining ACTIVE lines"
        actor: system
        preconditions: ["all ACTIVE lines returned"]
        side_effects: ["payment_status = REFUNDED"]
      - from: PARTIALLY_RETURNED
        to: RETURNED
        trigger: "system: subsequent ReturnRequest APPROVED covering the rest"
        actor: system
        preconditions: ["all remaining ACTIVE lines returned"]
        side_effects: ["payment_status = REFUNDED"]

  - entity: Subscription
    initial_state: ACTIVE
    terminal_states: [CANCELLED]
    transitions:
      - from: ACTIVE
        to: PAUSED
        trigger: "POST /subscriptions/{id}/pause"
        actor: Customer
        preconditions: ["subscription.status == ACTIVE"]
        side_effects: ["increments Subscription.version by 1"]
      - from: PAUSED
        to: ACTIVE
        trigger: "POST /subscriptions/{id}/resume"
        actor: Customer
        preconditions: ["subscription.status == PAUSED"]
        side_effects: ["increments Subscription.version by 1"]
        note: "Cyclic ACTIVE<->PAUSED (non-linear)."
      - from: ACTIVE
        to: CANCELLED
        trigger: "POST /subscriptions/{id}/cancel"
        actor: Customer
        preconditions: ["subscription.status == ACTIVE"]
        side_effects: ["set status = CANCELLED"]
      - from: PAUSED
        to: CANCELLED
        trigger: "POST /subscriptions/{id}/cancel"
        actor: Customer
        preconditions: ["subscription.status == PAUSED"]
        side_effects: ["set status = CANCELLED"]

  - entity: Shipment
    initial_state: PENDING
    terminal_states: [FULFILLED]
    transitions:
      - from: none
        to: PENDING
        trigger: "POST /subscriptions/{id}/shipments"
        actor: FulfillmentOps
        preconditions:
          - "subscription.status == ACTIVE (else ERR_SUBSCRIPTION_NOT_ACTIVE) [cross-entity gate Shipment->Subscription]"
          - "period [period_start, period_end) does NOT overlap any existing shipment period for this subscription (half-open; adjacency period_end==next.period_start allowed) (else ERR_SHIPMENT_PERIOD_OVERLAP)"
        side_effects: ["compute charge_cents (calculations.subscription_charge, variant=actual)"]
      - from: PENDING
        to: FULFILLED
        trigger: "POST /shipments/{id}/fulfill"
        actor: FulfillmentOps
        preconditions: ["shipment.status == PENDING"]
        side_effects:
          - "create LoyaltyTransaction{reason=EARN, points_delta=+round_half_up(charge_cents/100 * tier_multiplier(customer.tier))}; Customer.loyalty_points_balance += that"
          - "Customer.lifetime_spend_cents += charge_cents; recompute Customer.tier"
        note: "Cascade Shipment->Customer (depth-2 chain via subscription owner)."

  - entity: ReturnRequest
    initial_state: REQUESTED
    terminal_states: [APPROVED, REJECTED]
    transitions:
      - from: none
        to: REQUESTED
        trigger: "POST /returns"
        actor: Customer
        preconditions:
          - "order.fulfillment_status IN {FULFILLED, PARTIALLY_RETURNED} (else ERR_ORDER_NOT_FULFILLED) [cross-entity gate ReturnRequest->Order]"
          - "every id in line_ids belongs to order_id and is an ACTIVE line (else ERR_LINE_NOT_IN_ORDER)"
          - "if condition == OPENED: product.hygiene_returnable == true for every returned line's variant's product (else ERR_HYGIENE_NON_RETURNABLE)"
        side_effects: ["compute refund_estimate_cents (calculations.return_refund, variant=estimate)"]
      - from: REQUESTED
        to: APPROVED
        trigger: "POST /returns/{id}/approve"
        actor: FulfillmentOps
        preconditions: ["return.status == REQUESTED"]
        side_effects:
          - "compute final_refund_cents (calculations.return_refund, variant=final)"
          - "for each returned line: OrderLine.status = RETURNED"
          - "that line-return recomputes Order.fulfillment_status (PARTIALLY_RETURNED or RETURNED) and Order.payment_status (PARTIALLY_REFUNDED or REFUNDED)"
          - "the Order recompute triggers loyalty claw-back: create LoyaltyTransaction{reason=REVERSAL, points_delta=-sum(returned OrderLine.points_earned)}; Customer.loyalty_points_balance -= that sum"
          - "Customer.lifetime_spend_cents -= sum(returned line net contribution); recompute Customer.tier"
        note: "Depth->=3 cascade: ReturnApprove -> OrderLine.status -> Order.status -> Customer(ledger,balance,lifetime,tier)."
      - from: REQUESTED
        to: REJECTED
        trigger: "POST /returns/{id}/reject"
        actor: FulfillmentOps
        preconditions: ["return.status == REQUESTED"]
        side_effects: ["no refund; no line/inventory/loyalty change"]

  - entity: AllocationWindow
    initial_state: SCHEDULED
    terminal_states: [CLOSED]
    transitions:
      - from: SCHEDULED
        to: OPEN
        trigger: "system: logical clock reaches window_start"
        actor: system
        preconditions: ["now >= window_start"]
        side_effects: ["window becomes claimable"]
      - from: OPEN
        to: CLOSED
        trigger: "system: logical clock passes window_end"
        actor: system
        preconditions: ["now > window_end"]
        side_effects: ["further claims rejected with ERR_ALLOCATION_WINDOW_NOT_OPEN"]

# =====================================================================
# §1.2.1 Concurrency Rules
# =====================================================================
concurrency_rules:
  - rule_id: claim-create-stale-window
    parent_entity: AllocationWindow
    write_endpoint: "POST /allocation-windows/{id}/claims"
    occ_field: "expected_window_version"
    description: |
      Creating an AllocationClaim against a window whose version has advanced
      since the client last observed it is rejected. Another claim has already
      consumed allocation from the same window (legitimately advancing
      claimed_units and version), so the current writer's remaining-allocation
      view is stale. Reduced to a stale-version check on the window.
    error_id: ERR_STALE_VERSION
    http_status: 412

# =====================================================================
# §1.3 Calculation Rules Table
# =====================================================================
calculations:
  - name: order_pricing
    trigger: "POST /orders/{id}/place (transition Order CART->PLACED)"
    algorithm: threshold
    formula: |
      subtotal = sum(line.unit_price_cents * line.quantity) over ACTIVE lines
      # volume-tier discount keyed on subtotal:
      if   subtotal <  10000: rate = 0.00
      elif subtotal <  30000: rate = 0.05
      else:                   rate = 0.10
      discount = round_half_up(subtotal * rate)
      net = subtotal - discount
      # loyalty redemption (1 point == 1 cent):
      loyalty_redeemed = min(redeem_points, customer.loyalty_points_balance, net)
      net_after_loyalty = net - loyalty_redeemed
      # EVALUATION ORDER PINNED (mode c): the free-shipping threshold is keyed on
      # net_after_loyalty (pre-shipping), NOT on total. shipping is then added.
      shipping_fee = 0 if net_after_loyalty >= FREE_SHIP_THRESHOLD_CENTS else SHIPPING_FLAT_CENTS
      total = net_after_loyalty + shipping_fee
    input_set: "ACTIVE OrderLines of the order; customer's current loyalty_points_balance"
    constants:
      DISCOUNT_TIER_1_MIN_CENTS: 10000
      DISCOUNT_TIER_2_MIN_CENTS: 30000
      DISCOUNT_TIER_1_RATE: 0.05
      DISCOUNT_TIER_2_RATE: 0.10
      FREE_SHIP_THRESHOLD_CENTS: 7500
      SHIPPING_FLAT_CENTS: 595
      POINT_VALUE_CENTS: 1
    precision: "integer cents; round_half_up on discount"

  - name: loyalty_points_earned
    trigger: "POST /orders/{id}/fulfill (transition Order PLACED->FULFILLED)"
    algorithm: weighted_scoring
    formula: |
      mult = tier_multiplier(customer.tier)   # BRONZE 1.0, SILVER 1.25, GOLD 1.5
      # ROUNDING ORDER PINNED (mode b): round PER LINE, THEN sum.
      per_line_points(line) = round_half_up(line.line_total_cents / 100 * mult)
      points_earned = sum(per_line_points(line)) over ACTIVE lines
      # NOT: round_half_up(sum(line_total)/100 * mult)  -- that produces a
      # different total when line remainders each round up.
    input_set: "ACTIVE OrderLines at fulfill; customer.tier at fulfill"
    constants:
      TIER_MULT_BRONZE: 1.0
      TIER_MULT_SILVER: 1.25
      TIER_MULT_GOLD: 1.5
    precision: "integer points; round_half_up per line before summing"

  - name: customer_tier
    trigger: "recomputed after Customer.lifetime_spend_cents changes (order fulfill, shipment fulfill, return approve)"
    algorithm: threshold
    formula: |
      if   lifetime_spend_cents >= 200000: tier = GOLD
      elif lifetime_spend_cents >=  50000: tier = SILVER
      else:                                tier = BRONZE
    input_set: "single Customer.lifetime_spend_cents"
    constants:
      SILVER_MIN_CENTS: 50000
      GOLD_MIN_CENTS: 200000
    precision: "exact integer boundaries (>=)"

  - name: return_refund
    trigger: "POST /returns (estimate) and POST /returns/{id}/approve (final)"
    algorithm: forward_looking
    formula: |
      returned_merch = sum(OrderLine.line_total_cents for id in line_ids)
      # variant=estimate (at request, forward-looking flat restock):
      refund_estimate = returned_merch - RESTOCK_FEE_ESTIMATE_CENTS
      # variant=final (at approval, condition-driven actual):
      if condition == SEALED:
        final_refund = returned_merch
      elif condition == OPENED and product.hygiene_returnable == true:
        final_refund = round_half_up(returned_merch * (1 - OPENED_RESTOCK_PCT))
      # (condition==OPENED and not hygiene_returnable is rejected earlier by validation)
    input_set: "the OrderLines named in ReturnRequest.line_ids; their product.hygiene_returnable; reported condition"
    constants:
      RESTOCK_FEE_ESTIMATE_CENTS: 500
      OPENED_RESTOCK_PCT: 0.20
    precision: "integer cents; round_half_up on the opened-restock final"
    variants:
      - name: estimate
        when: "at POST /returns (request time)"
        difference: "flat RESTOCK_FEE_ESTIMATE_CENTS subtracted, condition-agnostic"
      - name: final
        when: "at POST /returns/{id}/approve"
        difference: "condition-driven: full for SEALED, percentage restock for OPENED-returnable"

  - name: subscription_charge
    trigger: "POST /subscriptions/{id}/shipments (actual) and computed field projected_next_charge_cents (projected)"
    algorithm: forward_looking
    formula: |
      def fee_effective_at(t):
        if sub.fee_effective_date is not null and t >= sub.fee_effective_date:
          return sub.pending_fee_cents
        return sub.monthly_fee_cents
      # variant=actual (at shipment generation): fee effective at THIS period_start
      actual_charge = fee_effective_at(shipment.period_start)
      # variant=projected (forward-looking): fee effective at the NEXT period boundary
      projected_next_charge = fee_effective_at(sub.current_period_end)
    input_set: "the subscription's monthly_fee_cents, pending_fee_cents, fee_effective_date; the target instant"
    constants: {}
    precision: "integer cents"
    variants:
      - name: actual
        when: "at shipment generation, keyed on shipment.period_start"
        difference: "uses the fee effective at the shipment's own period_start"
      - name: projected
        when: "computed field projected_next_charge_cents on the subscription"
        difference: "forward-looking; uses the fee effective at current_period_end (next boundary)"

  - name: allocation_remaining
    trigger: "read/derived on AllocationWindow and on POST /allocation-windows/{id}/claims"
    algorithm: aggregation
    formula: |
      claimed_units = sum(AllocationClaim.units where window_id == window.id)
      remaining = total_allocation - claimed_units
      # a claim of `units` is admissible iff units <= remaining (boundary: == remaining OK, remaining+1 rejected)
      customer_claimed = sum(AllocationClaim.units where window_id==window.id AND customer_id==C)  # per-window vs per_customer_cap
      product_claimed  = sum(AllocationClaim.units where claim.window.product_id==P AND customer_id==C)  # vs product.per_customer_limit
    input_set: "AllocationClaim rows filtered by window and/or customer"
    constants: {}
    precision: "exact integer; tie/order irrelevant (commutative sum)"

# =====================================================================
# §1.4 Validation Rules Table (ordered by priority)
# =====================================================================
validations:
  - priority: 1
    category: auth
    check: "X-User-Role and X-User-ID headers present and X-User-Role is a known role"
    error_id: ERR_UNAUTHENTICATED
    http_status: 401
    applies_to: "all except POST /_clock/set_current_utc header-optional? no -> all"
  - priority: 2
    category: auth
    check: "role is permitted for this endpoint per §1.7; for entity_backed Customer acting on an owned resource, X-User-ID == resource.customer_id (else ERR_NOT_ORDER_OWNER on order/return ownership)"
    error_id: ERR_UNAUTHORIZED
    http_status: 403
    applies_to: "all"
  - priority: 3
    category: existence
    check: "every path/body-referenced resource exists, validated left-to-right in the path then body FKs"
    error_id: ERR_PRODUCT_NOT_FOUND | ERR_VARIANT_NOT_FOUND | ERR_CUSTOMER_NOT_FOUND | ERR_ORDER_NOT_FOUND | ERR_ORDER_LINE_NOT_FOUND | ERR_SUBSCRIPTION_NOT_FOUND | ERR_SHIPMENT_NOT_FOUND | ERR_ALLOCATION_WINDOW_NOT_FOUND | ERR_RETURN_NOT_FOUND
    http_status: 404
    applies_to: "all id-bearing endpoints"
  - priority: 4
    category: state
    check: "target resource is in a valid state for the requested transition (state-machine from/preconditions)"
    error_id: ERR_INVALID_STATE
    http_status: 409
    applies_to: "all transition endpoints"
  - priority: 5
    category: business_safety
    check: "hygiene: a return with condition==OPENED is only allowed when every returned line's product.hygiene_returnable == true"
    error_id: ERR_HYGIENE_NON_RETURNABLE
    http_status: 422
    applies_to: "POST /returns"
  - priority: 6
    category: business_referential
    check: "every ReturnRequest.line_ids id belongs to order_id and is ACTIVE; claim product must be exclusive"
    error_id: ERR_LINE_NOT_IN_ORDER
    http_status: 422
    applies_to: "POST /returns, POST /allocation-windows/{id}/claims"
  - priority: 6
    category: business_referential
    check: "AllocationClaim target product must be is_exclusive"
    error_id: ERR_PRODUCT_NOT_EXCLUSIVE
    http_status: 422
    applies_to: "POST /allocation-windows/{id}/claims"
  - priority: 7
    category: business_temporal
    check: "AllocationWindow being created must not overlap an existing window of the same product (closed intervals) and must be separated by >= ALLOCATION_BUFFER_HOURS (= 24 hours) from adjacent windows"
    error_id: ERR_ALLOCATION_WINDOW_OVERLAP
    http_status: 409
    applies_to: "POST /products/{id}/allocation-windows"
  - priority: 7
    category: business_temporal
    check: "Shipment period [period_start, period_end) must not overlap an existing shipment period of the same subscription (half-open; adjacency allowed)"
    error_id: ERR_SHIPMENT_PERIOD_OVERLAP
    http_status: 409
    applies_to: "POST /subscriptions/{id}/shipments"
  - priority: 7
    category: business_temporal
    check: "claim only against an OPEN window (window_start <= now <= window_end)"
    error_id: ERR_ALLOCATION_WINDOW_NOT_OPEN
    http_status: 409
    applies_to: "POST /allocation-windows/{id}/claims"
  - priority: 8
    category: business_constraint
    check: "customer status must be ACTIVE to place an order or claim allocation"
    error_id: ERR_CUSTOMER_SUSPENDED
    http_status: 403
    applies_to: "POST /orders/{id}/place, POST /allocation-windows/{id}/claims"
  - priority: 8
    category: business_constraint
    check: "place must have >= 1 ACTIVE line"
    error_id: ERR_EMPTY_ORDER
    http_status: 422
    applies_to: "POST /orders/{id}/place"
  - priority: 8
    category: business_constraint
    check: "sufficient inventory: variant.on_hand_qty >= line.quantity for each line (boundary: == allowed, +1 short rejects)"
    error_id: ERR_INSUFFICIENT_STOCK
    http_status: 409
    applies_to: "POST /orders/{id}/place"
  - priority: 8
    category: business_constraint
    check: "allocation availability: claim.units <= (total_allocation - claimed_units) (boundary: == remaining OK)"
    error_id: ERR_ALLOCATION_EXHAUSTED
    http_status: 409
    applies_to: "POST /allocation-windows/{id}/claims"
  - priority: 8
    category: business_constraint
    check: "per-customer limit: customer cumulative units within window <= per_customer_cap AND across product windows <= product.per_customer_limit (boundary: == limit OK, +1 rejects)"
    error_id: ERR_PER_CUSTOMER_LIMIT
    http_status: 409
    applies_to: "POST /allocation-windows/{id}/claims"
  - priority: 9
    category: business_fiscal
    check: "redeem_points <= customer.loyalty_points_balance"
    error_id: ERR_INSUFFICIENT_POINTS
    http_status: 422
    applies_to: "POST /orders/{id}/place"
  - priority: 9
    category: business_fiscal
    check: "OCC: expected_window_version must equal current AllocationWindow.version"
    error_id: ERR_STALE_VERSION
    http_status: 412
    applies_to: "POST /allocation-windows/{id}/claims"
  - priority: 10
    category: business_constraint
    check: "generic required-field / enum / type validation of the request body"
    error_id: ERR_INVALID_REQUEST
    http_status: 400
    applies_to: "all POST"

# =====================================================================
# §1.5 API Endpoint Table
# =====================================================================
endpoints:
  # ---- Customers ----
  - method: POST
    path: "/customers"
    description: "Register a customer (starts ACTIVE, BRONZE, 0 points)."
    roles: [PlatformAdmin]
    code: 201
    input: [email, full_name]
    output: Customer
    side_effects: []
  - method: GET
    path: "/customers/{id}"
    description: "Fetch a customer."
    roles: [Customer, Merchandiser, FulfillmentOps, PlatformAdmin]
    code: 200
    input: []
    output: Customer
    side_effects: []
  - method: POST
    path: "/customers/{id}/suspend"
    description: "Suspend a customer account (ACTIVE->SUSPENDED)."
    roles: [PlatformAdmin]
    code: 200
    input: []
    output: Customer
    side_effects: ["Customer.status=SUSPENDED", "increments Customer.version by 1"]
  - method: GET
    path: "/customers/{id}/allocation-claims"
    description: "List a customer's allocation claims (reverse-reachability for AllocationClaim.customer_id)."
    roles: [Customer, Merchandiser, FulfillmentOps, PlatformAdmin]
    code: 200
    input: ["limit?", "offset?"]
    output: AllocationClaim[]
    side_effects: []
  - method: GET
    path: "/customers/{id}/loyalty-transactions"
    description: "List a customer's loyalty ledger (reverse-reachability for LoyaltyTransaction.customer_id)."
    roles: [Customer, Merchandiser, FulfillmentOps, PlatformAdmin]
    code: 200
    input: ["limit?", "offset?"]
    output: LoyaltyTransaction[]
    side_effects: []

  # ---- Products / Variants / note finder ----
  - method: POST
    path: "/products"
    description: "Create a product SKU (single, bundle, or discovery-set) with embedded notes."
    roles: [Merchandiser, PlatformAdmin]
    code: 201
    input: [name, brand, concentration, "kind?", "notes?", "is_exclusive?", "per_customer_limit?", "component_variant_ids?", "hygiene_returnable?"]
    output: Product
    side_effects: []
  - method: GET
    path: "/products/{id}"
    description: "Fetch a product."
    roles: [Customer, Merchandiser, FulfillmentOps, PlatformAdmin]
    code: 200
    input: []
    output: Product
    side_effects: []
  - method: GET
    path: "/products"
    description: "Note/finder + catalog list: filter products by embedded note name, note family, and/or kind."
    roles: [Customer, Merchandiser, FulfillmentOps, PlatformAdmin]
    code: 200
    input: ["note?", "family?", "kind?", "limit?", "offset?"]
    output: Product[]
    side_effects: []
  - method: POST
    path: "/products/{id}/variants"
    description: "Create a purchasable variant (full bottle / decant / sample) with seed inventory."
    roles: [Merchandiser, PlatformAdmin]
    code: 201
    input: [kind, volume_ml, unit_price_cents, on_hand_qty]
    output: Variant
    side_effects: []
  - method: GET
    path: "/products/{id}/variants"
    description: "List a product's variants (reverse-reachability for Variant.product_id)."
    roles: [Customer, Merchandiser, FulfillmentOps, PlatformAdmin]
    code: 200
    input: ["limit?", "offset?"]
    output: Variant[]
    side_effects: []
  - method: GET
    path: "/variants/{id}"
    description: "Fetch a variant (includes live on_hand_qty / reserved_qty)."
    roles: [Customer, Merchandiser, FulfillmentOps, PlatformAdmin]
    code: 200
    input: []
    output: Variant
    side_effects: []
  - method: GET
    path: "/variants/{id}/order-lines"
    description: "List order lines referencing this variant (reverse-reachability for OrderLine.variant_id)."
    roles: [Merchandiser, FulfillmentOps, PlatformAdmin]
    code: 200
    input: ["limit?", "offset?"]
    output: OrderLine[]
    side_effects: []

  # ---- Allocation windows / claims (exclusive) ----
  - method: POST
    path: "/products/{id}/allocation-windows"
    description: "Create an allocation release window for an exclusive product."
    roles: [Merchandiser, PlatformAdmin]
    code: 201
    input: [window_start, window_end, total_allocation, per_customer_cap]
    output: AllocationWindow
    side_effects: []
  - method: GET
    path: "/products/{id}/allocation-windows"
    description: "List a product's allocation windows (reverse-reachability for AllocationWindow.product_id)."
    roles: [Customer, Merchandiser, FulfillmentOps, PlatformAdmin]
    code: 200
    input: ["limit?", "offset?"]
    output: AllocationWindow[]
    side_effects: []
  - method: GET
    path: "/allocation-windows/{id}"
    description: "Fetch an allocation window (includes claimed_units and clock-derived status/version)."
    roles: [Customer, Merchandiser, FulfillmentOps, PlatformAdmin]
    code: 200
    input: []
    output: AllocationWindow
    side_effects: []
  - method: POST
    path: "/allocation-windows/{id}/claims"
    description: "Claim exclusive allocation. OCC-guarded on the window's version."
    roles: [Customer]
    code: 201
    input: [customer_id, units, expected_window_version]
    output: AllocationClaim
    side_effects:
      - "AllocationWindow.claimed_units += units"
      - "increments AllocationWindow.version by 1"
  - method: GET
    path: "/allocation-windows/{id}/claims"
    description: "List a window's claims (reverse-reachability for AllocationClaim.window_id)."
    roles: [Customer, Merchandiser, FulfillmentOps, PlatformAdmin]
    code: 200
    input: ["limit?", "offset?"]
    output: AllocationClaim[]
    side_effects: []

  # ---- Subscriptions / shipments (scent-of-month) ----
  - method: POST
    path: "/subscriptions"
    description: "Create a scent-of-month subscription for a customer (ACTIVE; current_period_end = start + 1 month)."
    roles: [Customer, PlatformAdmin]
    code: 201
    input: [customer_id, tier, monthly_fee_cents, "included_sample_credits?", "pending_fee_cents?", "fee_effective_date?"]
    output: Subscription
    side_effects: []
  - method: GET
    path: "/subscriptions/{id}"
    description: "Fetch a subscription (includes projected_next_charge_cents)."
    roles: [Customer, Merchandiser, FulfillmentOps, PlatformAdmin]
    code: 200
    input: []
    output: Subscription
    side_effects: []
  - method: GET
    path: "/subscriptions"
    description: "List subscriptions, optionally filtered by customer (reverse-reachability for Subscription.customer_id)."
    roles: [Customer, Merchandiser, FulfillmentOps, PlatformAdmin]
    code: 200
    input: ["customer_id?", "limit?", "offset?"]
    output: Subscription[]
    side_effects: []
  - method: POST
    path: "/subscriptions/{id}/pause"
    description: "Pause an ACTIVE subscription (ACTIVE->PAUSED)."
    roles: [Customer, PlatformAdmin]
    code: 200
    input: []
    output: Subscription
    side_effects: ["increments Subscription.version by 1"]
  - method: POST
    path: "/subscriptions/{id}/resume"
    description: "Resume a PAUSED subscription (PAUSED->ACTIVE)."
    roles: [Customer, PlatformAdmin]
    code: 200
    input: []
    output: Subscription
    side_effects: ["increments Subscription.version by 1"]
  - method: POST
    path: "/subscriptions/{id}/cancel"
    description: "Cancel a subscription (terminal)."
    roles: [Customer, PlatformAdmin]
    code: 200
    input: []
    output: Subscription
    side_effects: ["status=CANCELLED"]
  - method: POST
    path: "/subscriptions/{id}/shipments"
    description: "Generate a monthly shipment for a period; computes actual charge; requires ACTIVE subscription and non-overlapping period."
    roles: [FulfillmentOps, PlatformAdmin]
    code: 201
    input: [period_start, period_end]
    output: Shipment
    side_effects: ["compute charge_cents (subscription_charge actual)"]
  - method: GET
    path: "/subscriptions/{id}/shipments"
    description: "List a subscription's shipments (reverse-reachability for Shipment.subscription_id)."
    roles: [Customer, Merchandiser, FulfillmentOps, PlatformAdmin]
    code: 200
    input: ["limit?", "offset?"]
    output: Shipment[]
    side_effects: []
  - method: GET
    path: "/shipments/{id}"
    description: "Fetch a shipment."
    roles: [Customer, Merchandiser, FulfillmentOps, PlatformAdmin]
    code: 200
    input: []
    output: Shipment
    side_effects: []
  - method: POST
    path: "/shipments/{id}/fulfill"
    description: "Fulfill a shipment; charges and earns loyalty for the subscriber."
    roles: [FulfillmentOps, PlatformAdmin]
    code: 200
    input: []
    output: Shipment
    side_effects:
      - "create LoyaltyTransaction EARN for subscriber"
      - "Customer.lifetime_spend_cents += charge_cents; recompute Customer.tier"

  # ---- Orders / lines ----
  - method: POST
    path: "/orders"
    description: "Open a cart for a customer."
    roles: [Customer, PlatformAdmin]
    code: 201
    input: [customer_id]
    output: Order
    side_effects: []
  - method: GET
    path: "/orders/{id}"
    description: "Fetch an order (both status dimensions + pricing fields)."
    roles: [Customer, Merchandiser, FulfillmentOps, PlatformAdmin]
    code: 200
    input: []
    output: Order
    side_effects: []
  - method: GET
    path: "/orders"
    description: "List orders, optionally filtered by customer/status (reverse-reachability for Order.customer_id)."
    roles: [Customer, Merchandiser, FulfillmentOps, PlatformAdmin]
    code: 200
    input: ["customer_id?", "status?", "limit?", "offset?"]
    output: Order[]
    side_effects: []
  - method: POST
    path: "/orders/{id}/lines"
    description: "Add a line to a CART order (snapshots variant unit price)."
    roles: [Customer, PlatformAdmin]
    code: 201
    input: [variant_id, quantity]
    output: OrderLine
    side_effects: ["OrderLine.unit_price_cents snapshot; line_total_cents computed"]
  - method: GET
    path: "/orders/{id}/lines"
    description: "List an order's lines (reverse-reachability for OrderLine.order_id)."
    roles: [Customer, Merchandiser, FulfillmentOps, PlatformAdmin]
    code: 200
    input: ["limit?", "offset?"]
    output: OrderLine[]
    side_effects: []
  - method: POST
    path: "/orders/{id}/place"
    description: "Checkout: price, optionally redeem points, reserve inventory (CART->PLACED, payment PAID)."
    roles: [Customer]
    code: 200
    input: ["redeem_points?"]
    output: Order
    side_effects:
      - "order_pricing computed"
      - "reserve inventory on each line"
      - "payment_status=PAID; REDEEM LoyaltyTransaction if redeem_points>0"
  - method: POST
    path: "/orders/{id}/fulfill"
    description: "Ship the order (PLACED->FULFILLED): commit inventory, earn loyalty, bump lifetime spend + tier."
    roles: [FulfillmentOps, PlatformAdmin]
    code: 200
    input: []
    output: Order
    side_effects:
      - "commit reserved inventory"
      - "set OrderLine.points_earned; EARN LoyaltyTransaction"
      - "Customer.lifetime_spend_cents += net_after_loyalty; recompute tier"
  - method: POST
    path: "/orders/{id}/cancel"
    description: "Cancel a CART or PLACED order; PLACED cancel releases reserved inventory and refunds."
    roles: [Customer, FulfillmentOps, PlatformAdmin]
    code: 200
    input: []
    output: Order
    side_effects:
      - "if PLACED: release inventory, payment_status=REFUNDED, restore redeemed points"

  # ---- Returns (hygiene) ----
  - method: POST
    path: "/returns"
    description: "Request a return for fulfilled order lines; computes provisional refund estimate; enforces hygiene rule."
    roles: [Customer]
    code: 201
    input: [order_id, line_ids, condition]
    output: ReturnRequest
    side_effects: ["compute refund_estimate_cents (return_refund estimate)"]
  - method: GET
    path: "/returns/{id}"
    description: "Fetch a return request."
    roles: [Customer, Merchandiser, FulfillmentOps, PlatformAdmin]
    code: 200
    input: []
    output: ReturnRequest
    side_effects: []
  - method: GET
    path: "/returns"
    description: "List returns, optionally filtered by order (reverse-reachability for ReturnRequest.order_id)."
    roles: [Customer, Merchandiser, FulfillmentOps, PlatformAdmin]
    code: 200
    input: ["order_id?", "limit?", "offset?"]
    output: ReturnRequest[]
    side_effects: []
  - method: POST
    path: "/returns/{id}/approve"
    description: "Approve a return: settle final refund, mark lines RETURNED, cascade order/payment status + loyalty claw-back + tier."
    roles: [FulfillmentOps, PlatformAdmin]
    code: 200
    input: []
    output: ReturnRequest
    side_effects:
      - "compute final_refund_cents"
      - "OrderLine.status=RETURNED; Order.fulfillment_status/payment_status recompute"
      - "REVERSAL LoyaltyTransaction; Customer balance/lifetime/tier recompute"
  - method: POST
    path: "/returns/{id}/reject"
    description: "Reject a return (no refund, no side effects)."
    roles: [FulfillmentOps, PlatformAdmin]
    code: 200
    input: []
    output: ReturnRequest
    side_effects: []

  # ---- Test-driving clock ----
  - method: POST
    path: "/_clock/set_current_utc"
    description: "Set the server logical clock (drives AllocationWindow OPEN/CLOSED and subscription_charge effective-date checks). Startup default is 2026-07-01T00:00:00Z; before any set call the clock reads exactly this default and never falls back to wall-clock."
    roles: [PlatformAdmin]
    code: 200
    input: [to_iso8601]
    output: null
    side_effects: ["logical clock advanced; AllocationWindow.status re-derived"]

# =====================================================================
# §1.6 Error Code Catalog
# =====================================================================
errors:
  - id: ERR_UNAUTHENTICATED
    http: 401
    condition: "missing/unknown X-User-Role or missing X-User-ID"
  - id: ERR_UNAUTHORIZED
    http: 403
    condition: "role not permitted for this operation"
  - id: ERR_NOT_ORDER_OWNER
    http: 403
    condition: "Customer acts on an Order/ReturnRequest whose customer_id != X-User-ID"
  - id: ERR_CUSTOMER_NOT_FOUND
    http: 404
    condition: "referenced customer id does not exist"
  - id: ERR_PRODUCT_NOT_FOUND
    http: 404
    condition: "referenced product id does not exist"
  - id: ERR_VARIANT_NOT_FOUND
    http: 404
    condition: "referenced variant id does not exist"
  - id: ERR_ORDER_NOT_FOUND
    http: 404
    condition: "referenced order id does not exist"
  - id: ERR_ORDER_LINE_NOT_FOUND
    http: 404
    condition: "referenced order line id does not exist"
  - id: ERR_SUBSCRIPTION_NOT_FOUND
    http: 404
    condition: "referenced subscription id does not exist"
  - id: ERR_SHIPMENT_NOT_FOUND
    http: 404
    condition: "referenced shipment id does not exist"
  - id: ERR_ALLOCATION_WINDOW_NOT_FOUND
    http: 404
    condition: "referenced allocation window id does not exist"
  - id: ERR_RETURN_NOT_FOUND
    http: 404
    condition: "referenced return request id does not exist"
  - id: ERR_INVALID_REQUEST
    http: 400
    condition: "missing required field, bad enum, or type error in request body"
  - id: ERR_INVALID_STATE
    http: 409
    condition: "resource not in a valid state for the requested transition"
  - id: ERR_CUSTOMER_SUSPENDED
    http: 403
    condition: "customer.status != ACTIVE on place/claim"
  - id: ERR_EMPTY_ORDER
    http: 422
    condition: "place an order with zero ACTIVE lines"
  - id: ERR_INSUFFICIENT_STOCK
    http: 409
    condition: "variant.on_hand_qty < requested line quantity at place"
  - id: ERR_INSUFFICIENT_POINTS
    http: 422
    condition: "redeem_points > customer.loyalty_points_balance"
  - id: ERR_HYGIENE_NON_RETURNABLE
    http: 422
    condition: "return condition OPENED on a product with hygiene_returnable == false"
  - id: ERR_LINE_NOT_IN_ORDER
    http: 422
    condition: "ReturnRequest.line_ids contains an id not belonging to order_id or not ACTIVE"
  - id: ERR_ORDER_NOT_FULFILLED
    http: 409
    condition: "return requested against an order not in {FULFILLED, PARTIALLY_RETURNED}"
  - id: ERR_PRODUCT_NOT_EXCLUSIVE
    http: 422
    condition: "allocation claim against a non-exclusive product"
  - id: ERR_ALLOCATION_WINDOW_NOT_OPEN
    http: 409
    condition: "claim against a window whose clock-derived status != OPEN"
  - id: ERR_ALLOCATION_EXHAUSTED
    http: 409
    condition: "claim.units > (total_allocation - claimed_units)"
  - id: ERR_PER_CUSTOMER_LIMIT
    http: 409
    condition: "customer cumulative units would exceed per_customer_cap or product.per_customer_limit"
  - id: ERR_ALLOCATION_WINDOW_OVERLAP
    http: 409
    condition: "new allocation window overlaps or is within ALLOCATION_BUFFER_HOURS (= 24 hours) of an existing window of the same product"
  - id: ERR_SHIPMENT_PERIOD_OVERLAP
    http: 409
    condition: "new shipment period overlaps an existing shipment period of the same subscription"
  - id: ERR_SUBSCRIPTION_NOT_ACTIVE
    http: 409
    condition: "generate a shipment for a subscription not in ACTIVE"
  - id: ERR_STALE_VERSION
    http: 412
    condition: "expected_window_version != current AllocationWindow.version"

# =====================================================================
# §1.7 RBAC Matrix
# =====================================================================
roles:
  - name: Customer
    description: "A registered shopper; acts as themselves (owns orders, returns, subscriptions, claims)."
    identity: "entity_backed:Customer"
    exclusive_operations:
      - "POST /orders/{id}/place"
      - "POST /allocation-windows/{id}/claims"
      - "POST /returns"
    shared_operations:
      - "POST /orders"
      - "POST /orders/{id}/lines"
      - "POST /orders/{id}/cancel"
      - "POST /subscriptions"
      - "POST /subscriptions/{id}/pause"
      - "POST /subscriptions/{id}/resume"
      - "POST /subscriptions/{id}/cancel"
      - "all GET reads"
  - name: Merchandiser
    description: "Catalog and allocation operator; manages products, variants, and allocation windows."
    identity: "opaque"
    exclusive_operations:
      - "POST /products"
      - "POST /products/{id}/variants"
      - "POST /products/{id}/allocation-windows"
    shared_operations:
      - "all GET reads"
  - name: FulfillmentOps
    description: "Operations role; fulfills orders/shipments, generates shipments, and adjudicates returns."
    identity: "opaque"
    exclusive_operations:
      - "POST /orders/{id}/fulfill"
      - "POST /subscriptions/{id}/shipments"
      - "POST /shipments/{id}/fulfill"
      - "POST /returns/{id}/approve"
      - "POST /returns/{id}/reject"
    shared_operations:
      - "POST /orders/{id}/cancel"
      - "all GET reads"
  - name: PlatformAdmin
    description: "Superset operator (hierarchical override): can perform every Merchandiser/FulfillmentOps/Customer-shared operation, plus customer registration/suspension and clock control."
    identity: "opaque"
    exclusive_operations:
      - "POST /customers"
      - "POST /customers/{id}/suspend"
      - "POST /_clock/set_current_utc"
    shared_operations:
      - "POST /products"
      - "POST /products/{id}/variants"
      - "POST /products/{id}/allocation-windows"
      - "POST /orders"
      - "POST /orders/{id}/lines"
      - "POST /orders/{id}/fulfill"
      - "POST /orders/{id}/cancel"
      - "POST /subscriptions"
      - "POST /subscriptions/{id}/pause"
      - "POST /subscriptions/{id}/resume"
      - "POST /subscriptions/{id}/cancel"
      - "POST /subscriptions/{id}/shipments"
      - "POST /shipments/{id}/fulfill"
      - "POST /returns/{id}/approve"
      - "POST /returns/{id}/reject"
      - "all GET reads"
