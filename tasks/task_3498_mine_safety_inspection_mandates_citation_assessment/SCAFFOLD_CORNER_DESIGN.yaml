              as: OperatorRep
              as_user_id: "${op_id}"
              captures: { err: $.data.error_id }
          assert:
            - "the response is 409 with error_id ERR_ABATEMENT_WINDOW_PASSED (extension budget intact, so the temporal rule fires)"
            - "Citation.${cit1}.abatement_deadline remains 2026-02-15T09:00:00Z and abatement_extended == false"

  # ===========================================================================
  - section: rbac
    instances:
      - name: operatorrep_cannot_approve_plans
        claim_type: role_denial
        grounds:
          - roles.DistrictManager
          - errors.ERR_UNAUTHORIZED
        distinguishing_aspect: "Plan approval is exclusive to DistrictManager; an OperatorRep — even the mine's own operator — is refused with 403 ERR_UNAUTHORIZED and the plan stays SUBMITTED."
        test_recipe:
          setup:
            - "Mine with a SUBMITTED VENTILATION plan."
          setup_api_calls:
            - *clk_feb10_0800
            - *mk_operator
            - *mk_mine_ug
            - call: "POST /msha/mines/${m_id}/mine-plans"
              payload: { plan_type: "VENTILATION", document_ref: "doc-vent-r1" }
              as: OperatorRep
              as_user_id: "${op_id}"
              captures: { plan_v: $.data.id }
            - call: "GET /msha/mines/${m_id}"
              payload: {}
              as: DistrictManager
              captures: { mv1: $.data.version }
          trigger:
            - call: "POST /msha/mine-plans/${plan_v}/approve"
              payload: { expected_mine_version: "${mv1}" }
