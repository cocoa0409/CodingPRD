  rule_name: Boundary and precision check
  instances:
  - name: deviation_index_exactly_at_auto_approve_ceiling_is_accepted
    grounds: §1.3 parameter_deviation_index declares auto-approval when the index is <= AUTO_APPROVE_MAX_INDEX of 0.50, and §1.4 priority 24 demands consent only above that ceiling.
    distinguishing_aspect: An exclusive comparison rejects the 0.50 case with ERR_CONSENT_REQUIRED, and a floating-point implementation of 4*(8.70-8.60) + 2*(14.25-14.20) lands on 0.4999999999999998 and also rejects it. The correct implementation accepts the substitution with parameter_deviation_index exactly 0.50 and no patient_consent flag, while still rejecting the 0.80 neighbour.
    test_recipe:
      setup:
