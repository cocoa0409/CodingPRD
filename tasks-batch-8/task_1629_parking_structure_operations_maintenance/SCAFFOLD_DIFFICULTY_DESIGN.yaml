scaffold_difficulty_design:
- rule_id: dual_variant_calc
  instances:
  - name: transient_fee_calendar_vs_rolling_cap
    grounds:
    - calculations.transient_fee_calculation
    - entities.RateSchedule.fields.cap_mode
    - entities.ParkingSession.fields.settled_fee_cents
    distinguishing_aspect: 'Identical 22.5h stay crossing midnight: CALENDAR_DAY cap bills two capped

      date-segments (2400+2400=4800) while ROLLING_24H bills one anchored window

      (2400) — same inputs, different totals, on the ParkingSession/fee domain.

      '
    test_recipe:
      setup:
      - Two facilities A (cap_mode CALENDAR_DAY) and B (cap_mode ROLLING_24H), each with the reference tariff published and one ONLINE entry gate
      - One PARKED session per facility entered 2026-08-01T10:00:00Z
      setup_api_calls:
      - call: POST /ops/facilities
        payload:
          name: Cal Facility
          total_spaces: 200
          monthly_capacity: 50
          event_pool_spaces: 40
        as: FacilityManager
        captures:
          facA: $.data.id
          facA_v: $.data.version
      - call: POST /ops/rate-schedules
        payload:
          facility_id: ${facA}
          label: A
          grace_minutes: 15
          first_hour_cents: 500
          additional_hour_cents: 300
          daily_max_cents: 2400
          event_flat_cents: 1500
          lost_ticket_daily_cents: 2400
          cap_mode: CALENDAR_DAY
          effective_from: '2026-08-01T00:00:00Z'
        as: FacilityManager
        captures:
          rsA: $.data.id
      - call: POST /ops/rate-schedules/${rsA}/publish
        payload:
          expected_facility_version: ${facA_v}
        as: FacilityManager
      - call: POST /ops/access-devices
        payload:
          facility_id: ${facA}
          device_label: A-Entry
          device_kind: ENTRY_GATE
        as: FacilityManager
        captures:
          devA: $.data.id
      - call: POST /ops/access-devices/${devA}/heartbeat
        as: GateDevice
        as_user_id: ${devA}
      - call: POST /ops/facilities
        payload:
          name: Roll Facility
          total_spaces: 200
          monthly_capacity: 50
          event_pool_spaces: 40
        as: FacilityManager
        captures:
          facB: $.data.id
          facB_v: $.data.version
      - call: POST /ops/rate-schedules
        payload:
          facility_id: ${facB}
          label: B
          grace_minutes: 15
          first_hour_cents: 500
          additional_hour_cents: 300
          daily_max_cents: 2400
          event_flat_cents: 1500
          lost_ticket_daily_cents: 2400
          cap_mode: ROLLING_24H
          effective_from: '2026-08-01T00:00:00Z'
        as: FacilityManager
        captures:
          rsB: $.data.id
      - call: POST /ops/rate-schedules/${rsB}/publish
        payload:
          expected_facility_version: ${facB_v}
        as: FacilityManager
      - call: POST /ops/access-devices
        payload:
          facility_id: ${facB}
          device_label: B-Entry
          device_kind: ENTRY_GATE
        as: FacilityManager
        captures:
          devB: $.data.id
      - call: POST /ops/access-devices/${devB}/heartbeat
        as: GateDevice
        as_user_id: ${devB}
      - call: POST /ops/_clock/set_current_utc
        payload:
          to_iso8601: '2026-08-01T10:00:00Z'
        as: FacilityManager
      - call: POST /ops/parking-sessions
        payload:
          facility_id: ${facA}
          entry_device_id: ${devA}
          ticket_barcode: TA-1
        as: GateDevice
        as_user_id: ${devA}
        captures:
          sessA: $.data.id
      - call: POST /ops/parking-sessions
        payload:
          facility_id: ${facB}
          entry_device_id: ${devB}
          ticket_barcode: TB-1
        as: GateDevice
        as_user_id: ${devB}
        captures:
          sessB: $.data.id
      - call: POST /ops/_clock/set_current_utc
        payload:
          to_iso8601: '2026-08-02T08:30:00Z'
        as: FacilityManager
      trigger:
      - call: POST /ops/parking-sessions/${sessA}/quote
        as: ParkingAttendant
        as_user_id: att-1
        captures:
          feeA: $.data.fee_cents
      - call: POST /ops/parking-sessions/${sessB}/quote
        as: ParkingAttendant
        as_user_id: att-1
        captures:
          feeB: $.data.fee_cents
      assert:
      - ParkingSession.${sessA} quote fee_cents == 4800 (day1 14h -> 4400 capped 2400; day2 8.5h -> ceil 9h -> 2900 capped 2400)
      - 'ParkingSession.${sessB} quote fee_cents == 2400 (single rolling window: ceil 22.5h = 23h -> 7100 capped 2400)'
      - feeA != feeB for identical entry_at and quote time
  - name: ev_utilization_session_vs_energy_basis
    grounds:
    - calculations.ev_charger_utilization
    - entities.EVCharger.fields.utilization_session_pct
    - entities.EVCharger.fields.utilization_energy_pct
    distinguishing_aspect: 'Same charger and same single completed session: time-basis utilization is

      0.30% while energy-basis is 0.15% — dual variants on the EVCharger domain,

      a different entity domain than transient fees.

      '
    test_recipe:
      setup:
      - Facility with a charger commissioned at 2026-08-01T00:00:00Z (max_kw 7)
      - One COMPLETED charging session 2026-08-10T10:00 -> 12:00 (120 min) delivering 7.2 kWh
      - Logical clock at 2026-08-29T00:00:00Z for the close-of-business recompute
      setup_api_calls:
      - call: POST /ops/facilities
        payload:
          name: EV Fac
          total_spaces: 200
          monthly_capacity: 50
          event_pool_spaces: 40
        as: FacilityManager
        captures:
          fac: $.data.id
      - call: POST /ops/ev-chargers
        payload:
          facility_id: ${fac}
          charger_label: EV-01
          max_kw: 7
        as: MaintenanceSupervisor
        captures:
          chg: $.data.id
      - call: POST /ops/_clock/set_current_utc
        payload:
          to_iso8601: '2026-08-01T00:00:00Z'
        as: FacilityManager
      - call: POST /ops/ev-chargers/${chg}/permit
        as: MaintenanceSupervisor
      - call: POST /ops/ev-chargers/${chg}/install
        as: MaintenanceSupervisor
      - call: POST /ops/ev-chargers/${chg}/commission
        as: MaintenanceSupervisor
      - call: POST /ops/_clock/set_current_utc
        payload:
          to_iso8601: '2026-08-10T10:00:00Z'
        as: FacilityManager
      - call: POST /ops/charging-sessions
        payload:
          charger_id: ${chg}
        as: MaintenanceSupervisor
        captures:
          cs: $.data.id
      - call: POST /ops/_clock/set_current_utc
        payload:
          to_iso8601: '2026-08-10T12:00:00Z'
        as: FacilityManager
      - call: POST /ops/charging-sessions/${cs}/complete
        payload:
          kwh_delivered: 7.2
        as: MaintenanceSupervisor
      - call: POST /ops/_clock/set_current_utc
        payload:
          to_iso8601: '2026-08-29T00:00:00Z'
        as: FacilityManager
      trigger:
      - call: POST /ops/facilities/${fac}/close-of-business
        as: FacilityManager
      - call: GET /ops/ev-chargers/${chg}
        as: FacilityManager
        captures:
          sess_pct: $.data.utilization_session_pct
          energy_pct: $.data.utilization_energy_pct
      assert:
      - EVCharger.${chg}.utilization_session_pct == 0.30 (120 / 40320 min window * 100, round_half_up 2dp)
      - EVCharger.${chg}.utilization_energy_pct == 0.15 (7.2 / (7 kW * 672 h) * 100, round_half_up 2dp)
      - session_pct != energy_pct for identical session data
  - name: event_cancellation_fee_forfeit_vs_sliding
    grounds:
    - calculations.event_cancellation_fee
    - entities.EventBooking.fields.cancellation_policy
    - entities.EventBooking.fields.cancellation_fee_cents
    distinguishing_aspect: 'Two CONFIRMED events with identical 10000 deposits cancelled 72h before start:

      FORFEIT_DEPOSIT charges 10000, SLIDING_NOTICE charges 5000 — dual variants on

      the EventBooking domain, distinct from fees and utilization.

      '
    test_recipe:
      setup:
      - Facility; two CONFIRMED events starting 2026-08-10T00:00:00Z, deposit 10000 each, policies FORFEIT_DEPOSIT and SLIDING_NOTICE
      - Logical clock 2026-08-07T00:00:00Z (exactly 72h notice, >= 48h threshold)
      setup_api_calls:
      - call: POST /ops/facilities
        payload:
          name: Evt Fac
          total_spaces: 200
          monthly_capacity: 50
          event_pool_spaces: 40
        as: FacilityManager
        captures:
          fac: $.data.id
      - call: POST /ops/event-bookings
        payload:
          facility_id: ${fac}
          event_name: Forfeit Expo
          start_at: '2026-08-10T00:00:00Z'
          end_at: '2026-08-10T23:00:00Z'
          presale_allocation: 0
          min_staff: 0
          deposit_cents: 10000
          cancellation_policy: FORFEIT_DEPOSIT
        as: FacilityManager
        captures:
          evA: $.data.id
      - call: POST /ops/event-bookings
        payload:
          facility_id: ${fac}
          event_name: Sliding Expo
          start_at: '2026-08-10T00:00:00Z'
          end_at: '2026-08-10T23:00:00Z'
          presale_allocation: 0
          min_staff: 0
          deposit_cents: 10000
          cancellation_policy: SLIDING_NOTICE
        as: FacilityManager
        captures:
          evB: $.data.id
      - call: POST /ops/event-bookings/${evA}/confirm
        payload:
          staffing_assignments: []
        as: FacilityManager
      - call: POST /ops/event-bookings/${evB}/confirm
        payload:
          staffing_assignments: []
        as: FacilityManager
      - call: POST /ops/_clock/set_current_utc
        payload:
          to_iso8601: '2026-08-07T00:00:00Z'
        as: FacilityManager
      trigger:
      - call: POST /ops/event-bookings/${evA}/cancel
        payload:
          reason: organizer pulled out
        as: FacilityManager
        captures:
          feeA: $.data.cancellation_fee_cents
          refundA: $.data.deposit_refund_cents
      - call: POST /ops/event-bookings/${evB}/cancel
        payload:
          reason: organizer pulled out
        as: FacilityManager
        captures:
          feeB: $.data.cancellation_fee_cents
          refundB: $.data.deposit_refund_cents
      assert:
      - EventBooking.${evA}.cancellation_fee_cents == 10000 and deposit_refund_cents == 0
      - EventBooking.${evB}.cancellation_fee_cents == 5000 and deposit_refund_cents == 5000 (notice 72h >= 48h -> half)
      - feeA != feeB for identical deposit and notice
- rule_id: combinatorial_formula
  instances:
  - name: transient_fee_tier_cap_grace_mode_a
    grounds:
    - calculations.transient_fee_calculation
    - validations[priority=13]
    distinguishing_aspect: 'Mode (a): >= 3 inputs (elapsed minutes, tier rates, daily cap, grace) with

      non-linear min() cap binding and conditional grace branch — a 2h quote is 800,

      the same session at 14h is capped to 2400 instead of the linear 4400.

      '
    test_recipe:
      setup:
      - Facility with reference tariff published and ONLINE gate; session entered 2026-08-01T09:50:00Z
      setup_api_calls:
      - call: POST /ops/facilities
        payload:
          name: Tier Fac
          total_spaces: 200
          monthly_capacity: 50
          event_pool_spaces: 40
        as: FacilityManager
        captures:
          fac: $.data.id
          fac_v: $.data.version
      - call: POST /ops/rate-schedules
        payload:
          facility_id: ${fac}
          label: T
          grace_minutes: 15
          first_hour_cents: 500
          additional_hour_cents: 300
          daily_max_cents: 2400
          event_flat_cents: 1500
          lost_ticket_daily_cents: 2400
          cap_mode: CALENDAR_DAY
          effective_from: '2026-08-01T00:00:00Z'
        as: FacilityManager
        captures:
          rs: $.data.id
      - call: POST /ops/rate-schedules/${rs}/publish
        payload:
          expected_facility_version: ${fac_v}
        as: FacilityManager
      - call: POST /ops/access-devices
        payload:
          facility_id: ${fac}
          device_label: E1
          device_kind: ENTRY_GATE
        as: FacilityManager
        captures:
          dev: $.data.id
      - call: POST /ops/access-devices/${dev}/heartbeat
        as: GateDevice
        as_user_id: ${dev}
      - call: POST /ops/_clock/set_current_utc
        payload:
          to_iso8601: '2026-08-01T09:50:00Z'
        as: FacilityManager
      - call: POST /ops/parking-sessions
        payload:
          facility_id: ${fac}
          entry_device_id: ${dev}
          ticket_barcode: TT-1
        as: GateDevice
        as_user_id: ${dev}
        captures:
          sess: $.data.id
      trigger:
      - call: POST /ops/_clock/set_current_utc
        payload:
          to_iso8601: '2026-08-01T11:50:00Z'
        as: FacilityManager
      - call: POST /ops/parking-sessions/${sess}/quote
        as: ParkingAttendant
        as_user_id: att-1
        captures:
          fee_early: $.data.fee_cents
      - call: POST /ops/_clock/set_current_utc
        payload:
          to_iso8601: '2026-08-01T23:50:00Z'
        as: FacilityManager
      - call: POST /ops/parking-sessions/${sess}/quote
        as: ParkingAttendant
        as_user_id: att-1
        captures:
          fee_late: $.data.fee_cents
      assert:
      - quote at 2h elapsed == 800 (500 + 1*300, grace exceeded so billed from minute 0)
      - quote at 14h elapsed == 2400 (500 + 13*300 = 4400, min() cap binds)
      - ParkingSession.${sess}.billing_state == QUOTED and quoted_fee_cents == 2400 after re-quote
  - name: monthly_proration_component_rounding_mode_b
    grounds:
    - calculations.monthly_proration
    - entities.MonthlyAgreement.fields.first_invoice_cents
    distinguishing_aspect: 'Mode (b): nested rounding order pinned per-component-then-sum — rate 19999 +

      EV 2999 over 18/31 August days yields 11612 + 1741 = 13353, one cent LESS

      than sum-then-round (13354); the scaffold pins per-component order.

      '
    test_recipe:
      setup:
      - Facility monthly_capacity 50; APPROVED agreement (rate 19999, ev_surcharge 2999)
      - Logical clock at activation time 2026-08-14T09:00:00Z (18 of 31 days remaining, activation day inclusive)
      setup_api_calls:
      - call: POST /ops/facilities
        payload:
          name: Pro Fac
          total_spaces: 200
          monthly_capacity: 50
          event_pool_spaces: 40
        as: FacilityManager
        captures:
          fac: $.data.id
      - call: POST /ops/parker-accounts
        payload:
          full_name: Pat Parker
          email: pat@x.com
        as: ParkingAttendant
        as_user_id: att-1
        captures:
          pk: $.data.id
      - call: POST /ops/monthly-agreements
        payload:
          facility_id: ${fac}
          parker_account_id: ${pk}
          tier: EV
          monthly_rate_cents: 19999
          ev_surcharge_cents: 2999
        as: ParkingAttendant
        as_user_id: att-1
        captures:
          agr: $.data.id
      - call: POST /ops/_clock/set_current_utc
        payload:
          to_iso8601: '2026-08-14T09:00:00Z'
        as: FacilityManager
      trigger:
      - call: POST /ops/monthly-agreements/${agr}/activate
        as: ParkingAttendant
        as_user_id: att-1
        captures:
          inv: $.data.first_invoice_cents
      assert:
      - MonthlyAgreement.${agr}.first_invoice_cents == 13353 (round_half_up(19999*18/31)=11612 plus round_half_up(2999*18/31)=1741, summed after rounding)
      - first_invoice_cents != 13354 (the sum-then-round value is explicitly rejected)
      - MonthlyAgreement.${agr}.agreement_status == ACTIVE
  - name: capital_reserve_levy_order_mode_c
    grounds:
    - calculations.capital_reserve_ledger
    - entities.Facility.fields.capital_reserve_cents
    distinguishing_aspect: 'Mode (c): circular-looking dependency — levy reads gross_collected BEFORE

      refunds? No: pinned order is settles-minus-refunds first, levy on that, then

      net = gross - levy; levy never reads net. Same-day settle 3500 with a 2400

      refund yields levy 110, not 350 and not an undefined loop.

      '
    test_recipe:
      setup:
      - Facility with published tariff, ONLINE gate, one OPEN shift (float 10000)
      - 'On 2026-08-01: cash settle 2400 (10:00->19:00, capped) in the shift; card settle 1100 (10:05->12:35, 3h); refund of the 2400 cash session same day'
      setup_api_calls:
      - call: POST /ops/facilities
        payload:
          name: Levy Fac
          total_spaces: 200
          monthly_capacity: 50
          event_pool_spaces: 40
        as: FacilityManager
        captures:
          fac: $.data.id
          fac_v: $.data.version
      - call: POST /ops/rate-schedules
        payload:
          facility_id: ${fac}
          label: L
          grace_minutes: 15
          first_hour_cents: 500
          additional_hour_cents: 300
          daily_max_cents: 2400
          event_flat_cents: 1500
          lost_ticket_daily_cents: 2400
          cap_mode: CALENDAR_DAY
          effective_from: '2026-08-01T00:00:00Z'
        as: FacilityManager
        captures:
          rs: $.data.id
      - call: POST /ops/rate-schedules/${rs}/publish
        payload:
          expected_facility_version: ${fac_v}
        as: FacilityManager
      - call: POST /ops/access-devices
        payload:
          facility_id: ${fac}
          device_label: E1
          device_kind: ENTRY_GATE
        as: FacilityManager
        captures:
          dev: $.data.id
      - call: POST /ops/access-devices/${dev}/heartbeat
        as: GateDevice
        as_user_id: ${dev}
      - call: POST /ops/shifts
        payload:
          facility_id: ${fac}
          opening_float_cents: 10000
        as: ParkingAttendant
        as_user_id: att-1
        captures:
          sh: $.data.id
      - call: POST /ops/_clock/set_current_utc
        payload:
          to_iso8601: '2026-08-01T10:00:00Z'
        as: FacilityManager
      - call: POST /ops/parking-sessions
        payload:
          facility_id: ${fac}
          entry_device_id: ${dev}
          ticket_barcode: LV-1
        as: GateDevice
        as_user_id: ${dev}
        captures:
          s1: $.data.id
      - call: POST /ops/_clock/set_current_utc
        payload:
          to_iso8601: '2026-08-01T10:05:00Z'
        as: FacilityManager
      - call: POST /ops/parking-sessions
        payload:
          facility_id: ${fac}
          entry_device_id: ${dev}
          ticket_barcode: LV-2
        as: GateDevice
        as_user_id: ${dev}
        captures:
          s2: $.data.id
      - call: POST /ops/_clock/set_current_utc
        payload:
          to_iso8601: '2026-08-01T12:35:00Z'
        as: FacilityManager
      - call: POST /ops/parking-sessions/${s2}/pay
        payload:
          tender_type: CARD
        as: ParkingAttendant
        as_user_id: att-1
      - call: POST /ops/_clock/set_current_utc
        payload:
          to_iso8601: '2026-08-01T19:00:00Z'
        as: FacilityManager
      - call: POST /ops/parking-sessions/${s1}/pay
        payload:
          tender_type: CASH
          shift_id: ${sh}
        as: ParkingAttendant
        as_user_id: att-1
      - call: POST /ops/parking-sessions/${s1}/refund
        payload:
          amount_cents: 2400
          reason: overcharge
        as: RevenueAuditor
        as_user_id: aud-1
      - call: POST /ops/_clock/set_current_utc
        payload:
          to_iso8601: '2026-08-01T23:00:00Z'
        as: FacilityManager
      trigger:
      - call: POST /ops/facilities/${fac}/close-of-business
        as: FacilityManager
        captures:
          levy: $.data.levy_credited_cents
      - call: GET /ops/facilities/${fac}
        as: FacilityManager
        captures:
          reserve: $.data.capital_reserve_cents
      assert:
      - close-of-business levy_credited_cents == 110 (gross_D = 2400 + 1100 - 2400 = 1100; levy = round_half_up(1100 * 0.10))
      - Facility.${fac}.capital_reserve_cents == 110
      - Facility.${fac}.cumulative_collected_cents == 1100 (2400 + 1100 - 2400)
- rule_id: non_linear_state_machine
  instances:
  - name: parking_session_parallel_dimensions
    grounds:
    - state_machines.ParkingSession.OPEN_to_QUOTED
    - state_machines.ParkingSession.PARKED_to_EXITED
    - entities.ParkingSession.fields.billing_state
    distinguishing_aspect: 'Parallel dimensions: billing moves OPEN -> QUOTED -> COMPED while occupancy

      stays PARKED, then occupancy moves PARKED -> EXITED while billing stays

      COMPED — the two axes evolve independently on one row (ParkingSession).

      '
    test_recipe:
      setup:
      - Facility with published tariff, ONLINE gate, OPEN shift (float 10000)
      - Session entered 2026-08-01T10:00:00Z
      setup_api_calls:
      - call: POST /ops/facilities
        payload:
          name: Par Fac
          total_spaces: 200
          monthly_capacity: 50
          event_pool_spaces: 40
        as: FacilityManager
        captures:
          fac: $.data.id
          fac_v: $.data.version
      - call: POST /ops/rate-schedules
        payload:
          facility_id: ${fac}
          label: P
          grace_minutes: 15
          first_hour_cents: 500
          additional_hour_cents: 300
          daily_max_cents: 2400
          event_flat_cents: 1500
          lost_ticket_daily_cents: 2400
          cap_mode: CALENDAR_DAY
          effective_from: '2026-08-01T00:00:00Z'
        as: FacilityManager
        captures:
          rs: $.data.id
      - call: POST /ops/rate-schedules/${rs}/publish
        payload:
          expected_facility_version: ${fac_v}
        as: FacilityManager
      - call: POST /ops/access-devices
        payload:
          facility_id: ${fac}
          device_label: E1
          device_kind: ENTRY_GATE
        as: FacilityManager
        captures:
          dev: $.data.id
      - call: POST /ops/access-devices/${dev}/heartbeat
        as: GateDevice
        as_user_id: ${dev}
      - call: POST /ops/shifts
        payload:
          facility_id: ${fac}
          opening_float_cents: 10000
        as: ParkingAttendant
        as_user_id: att-1
        captures:
          sh: $.data.id
      - call: POST /ops/_clock/set_current_utc
        payload:
          to_iso8601: '2026-08-01T10:00:00Z'
        as: FacilityManager
      - call: POST /ops/parking-sessions
        payload:
          facility_id: ${fac}
          entry_device_id: ${dev}
          ticket_barcode: PD-1
        as: GateDevice
        as_user_id: ${dev}
        captures:
          sess: $.data.id
      trigger:
      - call: POST /ops/_clock/set_current_utc
        payload:
          to_iso8601: '2026-08-01T12:00:00Z'
        as: FacilityManager
      - call: POST /ops/parking-sessions/${sess}/quote
        as: ParkingAttendant
        as_user_id: att-1
      - call: POST /ops/parking-sessions/${sess}/comp
        payload:
          reason: VIP
          shift_id: ${sh}
        as: ParkingAttendant
        as_user_id: att-1
      - call: POST /ops/parking-sessions/${sess}/exit
        as: GateDevice
        as_user_id: ${dev}
        captures:
          occ: $.data.occupancy_state
          bil: $.data.billing_state
      assert:
      - 'After quote: occupancy_state == PARKED while billing_state == QUOTED (billing moved, occupancy did not)'
      - 'After comp: occupancy_state == PARKED while billing_state == COMPED and settled_fee_cents == 0'
      - 'After exit: occupancy_state == EXITED while billing_state == COMPED (occupancy moved, billing did not)'
      - AttendantShift.${sh}.comp_total_cents == 800 (2h waived value)
  - name: monthly_agreement_active_suspended_cycle
    grounds:
