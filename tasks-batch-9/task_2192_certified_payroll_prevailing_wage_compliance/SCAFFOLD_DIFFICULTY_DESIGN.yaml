            - "WageDetermination.${wd_a_id}.status == ACTIVE"
            - "WageDetermination.${wd_a_id}.expiry_date == 2026-06-01T00:00:00.000Z"
            - "WageDetermination.${wd_b_id}.status == ACTIVE"

      - name: interview_window_buffered_overlap_on_a_worker
        resource_entity: Worker
        interval_semantics: "HALF-OPEN [window_start, window_end) widened by a 60-minute buffer on BOTH sides before intersection"
        grounds:
