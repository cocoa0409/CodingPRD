            - { call: "POST /turnarounds/${t_id}/work-items", payload: { title: "Drum inspection", system_area: "CRU-2-D", work_type: "INSPECTION", risk_class: "B", estimated_hours: 30, estimated_cost_cents: 60000, requires_permit: false }, as: Planner, captures: { w1_id: "$.data.id" } }
            - { call: "POST /turnarounds/${t_id}/freeze-scope", payload: { scope_cutoff_count: 1 }, as: TurnaroundManager }
            - { call: "POST /turnarounds/${t_id}/contractors", payload: { name: "Delta Mechanical", craft: "PIPEFITTING", headcount_cap: 5 }, as: TurnaroundManager, captures: { c_id: "$.data.id" } }
            - { call: "POST /turnarounds/${t_id}/advance", payload: {}, as: TurnaroundManager }
            - { call: "POST /contractors/${c_id}/mobilize", payload: {}, as: ContractorSupervisor, as_user_id: "${c_id}" }
            - { call: "POST /contractors/${c_id}/workers", payload: { full_name: "Rae Wolder", trade: "WELDER" }, as: ContractorSupervisor, as_user_id: "${c_id}", captures: { wk_id: "$.data.id" } }
            - { call: "POST /workers/${wk_id}/vet", payload: {}, as: PermitCoordinator }
            - { call: "POST /workers/${wk_id}/badge", payload: {}, as: PermitCoordinator }
            - { call: "POST /contractors/${c_id}/mobilize", payload: {}, as: ContractorSupervisor, as_user_id: "${c_id}" }
            - { call: "POST /turnarounds/${t_id}/advance", payload: {}, as: TurnaroundManager }
            - { call: "POST /turnarounds/${t_id}/discoveries", payload: { origin_work_item_id: "${w1_id}", description: "Tray damage beyond inspection scope", quoted_cost_cents: 90000, quoted_hours: 20 }, as: TurnaroundManager, as_user_id: "tm-100", captures: { d1_id: "$.data.id" } }
            - { call: "POST /discoveries/${d1_id}/triage", payload: { triage_note: "Genuine scope gap" }, as: TurnaroundManager }
          trigger:
            - { call: "POST /discoveries/${d1_id}/decide", payload: { outcome: "REJECTED" }, as: TurnaroundManager, as_user_id: "tm-200", captures: { st1: "$.data.status" } }
            - { call: "POST /discoveries/${d1_id}/appeal", payload: {}, as: TurnaroundManager, as_user_id: "tm-100", captures: { st2: "$.data.status", appeals: "$.data.appeal_count" } }
            - { call: "POST /discoveries/${d1_id}/decide", payload: { outcome: "AUTHORIZED", authorized_cost_cents: 90000 }, as: TurnaroundManager, as_user_id: "tm-200", captures: { st3: "$.data.status" } }
            - { call: "GET /discoveries/${d1_id}/work-items", payload: {}, as: TurnaroundManager, captures: { add_status: "$.data[0].status", add_cost: "$.data[0].estimated_cost_cents", add_type: "$.data[0].work_type" } }
          assert:
            - "first decide -> status REJECTED"
            - "appeal -> status TRIAGED with appeal_count == 1 (cycle REJECTED -> TRIAGED)"
            - "second decide AUTHORIZED succeeds (decider tm-200 != reporter tm-100; 90000 <= 1000000 contingency remaining)"
            - "addendum WorkItem exists with status FROZEN, work_type DISCOVERY_ADDENDUM, estimated_cost_cents == 90000"

  - rule_id: transitive_cascade
    instances:
      - name: permit_revoke_hold_slip_posture_cascade
        grounds:
          - state_machines.Permit.ACTIVE_to_REVOKED
          - state_machines.WorkItem.IN_PROGRESS_to_ON_HOLD
          - calculations.critical_path_float
          - calculations.eac_cost_forecast
          - entities.Turnaround.fields.critical_path_slip_hours
        distinguishing_aspect: |
          Depth-3 chain from the revoke trigger: Permit ACTIVE -> REVOKED (link 1)
          forces covered WorkItem IN_PROGRESS -> ON_HOLD (link 2, caused by the
          permit mutation, not the API caller), which recomputes
          critical_path_slip_hours 0 -> 100 and flips cost_posture
          WITHIN_BUDGET -> AT_RISK via eac_cost_forecast (link 3, caused by the
          work-item mutation).
        test_recipe:
          setup:
            - "Turnaround (budget 400000, contingency 1000000) in EXECUTION; critical-path work item W1 (estimated_hours 100, estimated_cost_cents 200000, requires_permit true) IN_PROGRESS under ACTIVE permit P1 backed by VERIFIED isolation I1; logical clock 2026-06-15T09:00:00Z inside the permit window"
          setup_api_calls:
            - { call: "POST /turnarounds", payload: { name: "TA-CAS", plant_unit: "CRU-2", planned_start: "2026-06-10T00:00:00Z", planned_end: "2026-07-10T00:00:00Z", authorized_budget_cents: 400000, contingency_budget_cents: 1000000 }, as: TurnaroundManager, captures: { t_id: "$.data.id" } }
            - { call: "POST /turnarounds/${t_id}/work-items", payload: { title: "Exchanger tube bundle pull", system_area: "CRU-2-E1", work_type: "CORRECTIVE", risk_class: "A", estimated_hours: 100, estimated_cost_cents: 200000, requires_permit: true }, as: Planner, captures: { w1_id: "$.data.id" } }
            - { call: "POST /turnarounds/${t_id}/freeze-scope", payload: { scope_cutoff_count: 1 }, as: TurnaroundManager }
            - { call: "POST /turnarounds/${t_id}/contractors", payload: { name: "Delta Mechanical", craft: "PIPEFITTING", headcount_cap: 5 }, as: TurnaroundManager, captures: { c_id: "$.data.id" } }
            - { call: "POST /turnarounds/${t_id}/advance", payload: {}, as: TurnaroundManager }
            - { call: "POST /contractors/${c_id}/mobilize", payload: {}, as: ContractorSupervisor, as_user_id: "${c_id}" }
            - { call: "POST /contractors/${c_id}/workers", payload: { full_name: "Rae Wolder", trade: "WELDER" }, as: ContractorSupervisor, as_user_id: "${c_id}", captures: { wk_id: "$.data.id" } }
            - { call: "POST /workers/${wk_id}/vet", payload: {}, as: PermitCoordinator }
            - { call: "POST /workers/${wk_id}/badge", payload: {}, as: PermitCoordinator }
            - { call: "POST /contractors/${c_id}/mobilize", payload: {}, as: ContractorSupervisor, as_user_id: "${c_id}" }
            - { call: "POST /turnarounds/${t_id}/advance", payload: {}, as: TurnaroundManager }
            - { call: "POST /work-items/${w1_id}/schedule", payload: {}, as: Planner }
            - { call: "POST /turnarounds/${t_id}/isolations", payload: { equipment_tag: "EXCH-E201", isolation_mode: "EXCLUSIVE", isolated_from: "2026-06-10T00:00:00Z", isolated_until: "2026-06-25T00:00:00Z" }, as: PermitCoordinator, captures: { i1_id: "$.data.id" } }
            - { call: "POST /isolations/${i1_id}/transition", payload: { to: "ISOLATED" }, as: PermitCoordinator }
            - { call: "POST /isolations/${i1_id}/transition", payload: { to: "VERIFIED" }, as: PermitCoordinator }
            - { call: "POST /work-items/${w1_id}/permits", payload: { permit_type: "COLD_WORK", hazard_class: "LOW", valid_from: "2026-06-12T00:00:00Z", valid_until: "2026-06-20T00:00:00Z", required_isolation_ids: [ "${i1_id}" ] }, as: PermitCoordinator, captures: { p1_id: "$.data.id" } }
            - { call: "POST /_clock/set_current_utc", payload: { to_iso8601: "2026-06-15T09:00:00Z" }, as: TurnaroundManager }
            - { call: "POST /permits/${p1_id}/transition", payload: { to: "ISSUED" }, as: PermitCoordinator }
            - { call: "POST /permits/${p1_id}/transition", payload: { to: "ACTIVE" }, as: PermitCoordinator }
            - { call: "POST /work-items/${w1_id}/start", payload: {}, as: ContractorSupervisor, as_user_id: "${c_id}" }
          trigger:
            - { call: "POST /permits/${p1_id}/transition", payload: { to: "REVOKED" }, as: PermitCoordinator, captures: { p_st: "$.data.status" } }
            - { call: "GET /work-items/${w1_id}", payload: {}, as: Planner, captures: { w_st: "$.data.status", w_crit: "$.data.is_critical_path" } }
            - { call: "GET /turnarounds/${t_id}", payload: {}, as: TurnaroundManager, captures: { slip: "$.data.critical_path_slip_hours", posture: "$.data.cost_posture" } }
          assert:
            - "Permit.${p1_id}.status == REVOKED"
            - "WorkItem.${w1_id}.status == ON_HOLD (link 2 fired from the permit mutation) and is_critical_path == true"
            - "Turnaround.critical_path_slip_hours == 100 (remaining_hours = 100 - 0 on the single ON_HOLD critical item; link 3)"
            - "Turnaround.cost_posture == AT_RISK (provisional = 200000 committed + 0 pending + floor(100/8)*50000 = 800000 > 400000; committed 200000 <= 400000)"

      - name: discovery_authorize_committed_posture_cascade
        grounds:
          - state_machines.DiscoveryWork.TRIAGED_to_AUTHORIZED
          - calculations.eac_cost_forecast
          - state_machines.Turnaround.cost_posture
        distinguishing_aspect: |
          Depth-2 chain from a DIFFERENT trigger (decide AUTHORIZED, not revoke):
          authorization creates the addendum WorkItem and bumps
          committed_cost_cents 200000 -> 350000 (link 1); that committed mutation
          itself flips cost_posture WITHIN_BUDGET -> OVERRUN (link 2: 350000 >
          budget 300000).
        test_recipe:
          setup:
            - "Turnaround (authorized_budget_cents=300000, contingency_budget_cents=1000000) in EXECUTION with one FROZEN work item estimated at 200000"
            - "Discovery D1 REPORTED by tm-100 (quoted 150000 / 40h) and TRIAGED"
          setup_api_calls:
            - { call: "POST /turnarounds", payload: { name: "TA-AUT", plant_unit: "CRU-2", planned_start: "2026-06-10T00:00:00Z", planned_end: "2026-07-10T00:00:00Z", authorized_budget_cents: 300000, contingency_budget_cents: 1000000 }, as: TurnaroundManager, captures: { t_id: "$.data.id" } }
            - { call: "POST /turnarounds/${t_id}/work-items", payload: { title: "Drum inspection", system_area: "CRU-2-D", work_type: "INSPECTION", risk_class: "B", estimated_hours: 30, estimated_cost_cents: 200000, requires_permit: false }, as: Planner, captures: { w1_id: "$.data.id" } }
            - { call: "POST /turnarounds/${t_id}/freeze-scope", payload: { scope_cutoff_count: 1 }, as: TurnaroundManager }
            - { call: "POST /turnarounds/${t_id}/contractors", payload: { name: "Delta Mechanical", craft: "PIPEFITTING", headcount_cap: 5 }, as: TurnaroundManager, captures: { c_id: "$.data.id" } }
            - { call: "POST /turnarounds/${t_id}/advance", payload: {}, as: TurnaroundManager }
            - { call: "POST /contractors/${c_id}/mobilize", payload: {}, as: ContractorSupervisor, as_user_id: "${c_id}" }
            - { call: "POST /contractors/${c_id}/workers", payload: { full_name: "Rae Wolder", trade: "WELDER" }, as: ContractorSupervisor, as_user_id: "${c_id}", captures: { wk_id: "$.data.id" } }
            - { call: "POST /workers/${wk_id}/vet", payload: {}, as: PermitCoordinator }
            - { call: "POST /workers/${wk_id}/badge", payload: {}, as: PermitCoordinator }
            - { call: "POST /contractors/${c_id}/mobilize", payload: {}, as: ContractorSupervisor, as_user_id: "${c_id}" }
            - { call: "POST /turnarounds/${t_id}/advance", payload: {}, as: TurnaroundManager }
            - { call: "POST /turnarounds/${t_id}/discoveries", payload: { origin_work_item_id: "${w1_id}", description: "Internal corrosion found", quoted_cost_cents: 150000, quoted_hours: 40 }, as: TurnaroundManager, as_user_id: "tm-100", captures: { d1_id: "$.data.id" } }
            - { call: "POST /discoveries/${d1_id}/triage", payload: {}, as: TurnaroundManager }
          trigger:
            - { call: "POST /discoveries/${d1_id}/decide", payload: { outcome: "AUTHORIZED", authorized_cost_cents: 150000 }, as: TurnaroundManager, as_user_id: "tm-200", captures: { d_st: "$.data.status" } }
            - { call: "GET /discoveries/${d1_id}/work-items", payload: {}, as: TurnaroundManager, captures: { add_status: "$.data[0].status", add_cost: "$.data[0].estimated_cost_cents" } }
            - { call: "GET /turnarounds/${t_id}", payload: {}, as: TurnaroundManager, captures: { committed: "$.data.committed_cost_cents", posture: "$.data.cost_posture" } }
          assert:
            - "DiscoveryWork.${d1_id}.status == AUTHORIZED"
            - "addendum WorkItem created: status FROZEN, estimated_cost_cents == 150000 (link 1 side effect)"
            - "Turnaround.committed_cost_cents == 350000 (200000 + 150000)"
            - "Turnaround.cost_posture == OVERRUN (link 2: committed 350000 > budget 300000)"

  - rule_id: priority_pair_validation_conflict
    instances:
      - name: decide_rejected_state_error_beats_contingency_fiscal
        grounds:
          - validations[priority=7]
          - validations[priority=12]
          - errors[ERR_INVALID_STATE]
          - errors[ERR_CONTINGENCY_EXCEEDED]
        distinguishing_aspect: |
          Error-category pair state (priority 7) vs business_fiscal (priority 12):
          deciding AUTHORIZED on a REJECTED discovery whose cost (150000) also
          exceeds remaining contingency (100000) MUST return ERR_INVALID_STATE,
          not ERR_CONTINGENCY_EXCEEDED.
        test_recipe:
          setup:
            - "Turnaround (contingency 100000) in EXECUTION; discovery D1 reported by tm-100, triaged, then decided REJECTED by tm-200"
          setup_api_calls:
            - { call: "POST /turnarounds", payload: { name: "TA-PRI", plant_unit: "CRU-2", planned_start: "2026-06-10T00:00:00Z", planned_end: "2026-07-10T00:00:00Z", authorized_budget_cents: 900000000, contingency_budget_cents: 100000 }, as: TurnaroundManager, captures: { t_id: "$.data.id" } }
            - { call: "POST /turnarounds/${t_id}/work-items", payload: { title: "Seal replacement", system_area: "CRU-2-S", work_type: "CORRECTIVE", risk_class: "C", estimated_hours: 20, estimated_cost_cents: 50000, requires_permit: false }, as: Planner, captures: { w1_id: "$.data.id" } }
            - { call: "POST /turnarounds/${t_id}/freeze-scope", payload: { scope_cutoff_count: 1 }, as: TurnaroundManager }
            - { call: "POST /turnarounds/${t_id}/contractors", payload: { name: "Delta Mechanical", craft: "PIPEFITTING", headcount_cap: 5 }, as: TurnaroundManager, captures: { c_id: "$.data.id" } }
            - { call: "POST /turnarounds/${t_id}/advance", payload: {}, as: TurnaroundManager }
            - { call: "POST /contractors/${c_id}/mobilize", payload: {}, as: ContractorSupervisor, as_user_id: "${c_id}" }
            - { call: "POST /contractors/${c_id}/workers", payload: { full_name: "Rae Wolder", trade: "WELDER" }, as: ContractorSupervisor, as_user_id: "${c_id}", captures: { wk_id: "$.data.id" } }
            - { call: "POST /workers/${wk_id}/vet", payload: {}, as: PermitCoordinator }
            - { call: "POST /workers/${wk_id}/badge", payload: {}, as: PermitCoordinator }
            - { call: "POST /contractors/${c_id}/mobilize", payload: {}, as: ContractorSupervisor, as_user_id: "${c_id}" }
            - { call: "POST /turnarounds/${t_id}/advance", payload: {}, as: TurnaroundManager }
            - { call: "POST /turnarounds/${t_id}/discoveries", payload: { description: "Flange face damage", quoted_cost_cents: 90000, quoted_hours: 20 }, as: TurnaroundManager, as_user_id: "tm-100", captures: { d1_id: "$.data.id" } }
            - { call: "POST /discoveries/${d1_id}/triage", payload: {}, as: TurnaroundManager }
            - { call: "POST /discoveries/${d1_id}/decide", payload: { outcome: "REJECTED" }, as: TurnaroundManager, as_user_id: "tm-200" }
          trigger:
            - { call: "POST /discoveries/${d1_id}/decide", payload: { outcome: "AUTHORIZED", authorized_cost_cents: 150000 }, as: TurnaroundManager, as_user_id: "tm-200", captures: { err: "$.data.error_id" } }
          assert:
            - "rejected with ERR_INVALID_STATE (409): discovery is REJECTED; the state precondition (priority 7) fires before the contingency fiscal check (priority 12), so ERR_CONTINGENCY_EXCEEDED MUST NOT surface"
            - "DiscoveryWork.${d1_id} remains REJECTED with authorized_cost_cents null"

      - name: assign_badge_safety_error_beats_rest_temporal
        grounds:
          - validations[priority=9]
