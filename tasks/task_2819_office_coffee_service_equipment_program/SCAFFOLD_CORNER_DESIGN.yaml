      - name: corner_posture_gates_are_evaluated_in_priority_order_across_three_entities
        claim_type: cascading_validation
        grounds:
          - validations[priority=11]
          - validations[priority=12]
          - validations[priority=13]
          - validations[priority=15]
          - errors[ERR_ACCOUNT_NOT_OPERATING]
          - errors[ERR_SITE_NOT_SERVICEABLE]
          - errors[ERR_PLACEMENT_STATE_INVALID]
        distinguishing_aspect: "After cancellation the account, the site, the visit and one superseded placement are ALL in refusing states, and each endpoint reports the gate that owns it: scheduling reports the account gate (11) even though the site gate would also fail, completion reports the site gate (12) rather than the visit-status gate (15) because 11 does not apply to /complete, and the superseded placement reports 13."
        test_recipe:
          setup:
            - "clock at 2026-08-03T08:00:00Z, then 2026-08-10T08:00:00Z; MON route; one COFFEE product; model URN-30; two PLACEMENT assets"
            - "one account with one planned site holding two successive placements, so placement 1 is SUPERSEDED and placement 2 is ACTIVE; one SCHEDULED visit for 2026-08-03T09:00:00Z"
            - "the account is then cancelled with retrieval_due_by 2026-09-30T00:00:00Z, which makes it CANCELLATION_PENDING, the site SUSPENDED, placement 2 RETRIEVAL_SCHEDULED and the visit CANCELLED"
          setup_api_calls:
            - call: "POST /ocs/_clock/set_current_utc"
              payload: { to_iso8601: "2026-08-03T08:00:00Z" }
              as: ProgramAdmin
            - call: "POST /ocs/routes"
