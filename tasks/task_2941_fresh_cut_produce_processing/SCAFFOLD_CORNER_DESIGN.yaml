          assert:
            - "${err} == ERR_LINE_RUN_IN_PROGRESS with HTTP 409 while RUN1 is RUNNING"
            - "${seq_b} == 2: the second event on the line takes the next per-line sequence number"
            - "${closed_status} == CLOSED, and the retry then returns ${st} == IN_PROGRESS with ${started} == sant-4"
            - "the block is therefore keyed on run_status == RUNNING, not on SETUP or CLOSED runs existing on the line"

      - name: corner_swab_cannot_skip_the_presumptive_step
        claim_type: Invalid Transitions
        grounds:
          - state_machines[EnvironmentalSwab].transitions
          - validations[priority=32]
        distinguishing_aspect: "PENDING accepts only NEGATIVE or PRESUMPTIVE_POSITIVE, so a direct jump to CONFIRMED_POSITIVE is refused; a swab already resolved NEGATIVE is terminal and refuses even a repeat of its own value."
        test_recipe:
          setup: ["execute BASE steps 1-5, so line L1 exists and the clock is 2026-08-02T05:00:00Z"]
          setup_api_calls:
            - call: "POST /lines/${line_id}/environmental-swabs"
              payload: { zone: "ZONE_1", site_code: "BLADE-2", organism: "LISTERIA_MONOCYTOGENES", collected_at: "2026-08-02T04:00:00Z" }
              as: QATechnician
              captures: { sw1: "$.data.id" }
            - call: "POST /lines/${line_id}/environmental-swabs"
              payload: { zone: "ZONE_2", site_code: "DRAIN-9", organism: "LISTERIA_SPP", collected_at: "2026-08-02T04:05:00Z" }
              as: QATechnician
              captures: { sw2: "$.data.id" }
          trigger:
            - call: "POST /environmental-swabs/${sw1}/result"
              payload: { result: "CONFIRMED_POSITIVE" }
              as: QATechnician
              captures: { e_skip: "$.data.error_id" }
            - call: "POST /environmental-swabs/${sw2}/result"
              payload: { result: "NEGATIVE" }
              as: QATechnician
              as_user_id: "qat-5"
              captures: { sw2_res: "$.data.result", sw2_by: "$.data.resulted_by_user_id" }
            - call: "POST /environmental-swabs/${sw2}/result"
              payload: { result: "NEGATIVE" }
              as: QATechnician
              captures: { e_terminal: "$.data.error_id" }
            - call: "POST /environmental-swabs/${sw2}/result"
              payload: { result: "PRESUMPTIVE_POSITIVE" }
              as: QATechnician
              captures: { e_backwards: "$.data.error_id" }
            - call: "GET /lines/${line_id}"
              as: QAManager
              captures: { posture: "$.data.posture", cas: "$.data.open_corrective_action_count" }
          assert:
            - "${e_skip} == ERR_SWAB_INVALID_RESULT_TRANSITION with HTTP 409: CONFIRMED_POSITIVE is reachable only from PRESUMPTIVE_POSITIVE, so the confirmation cascade cannot be triggered in one step"
            - "${sw2_res} == NEGATIVE with ${sw2_by} == qat-5"
            - "${e_terminal} == ERR_SWAB_INVALID_RESULT_TRANSITION: NEGATIVE is terminal, so re-sending the same value is refused rather than treated as a no-op"
            - "${e_backwards} == ERR_SWAB_INVALID_RESULT_TRANSITION for the backwards move"
            - "${posture} == RESTRICTED (no VALIDATED clean yet on this line) with ${cas} == 0: none of the refused calls opened a corrective action"

      - name: corner_corrective_action_verify_fail_reopens_the_cycle
        claim_type: Valid Transition
        grounds:
          - state_machines[CorrectiveAction].transitions[VERIFICATION_PENDING->IN_PROGRESS]
          - validations[priority=33]
        distinguishing_aspect: "A FAIL verification sends the action back to IN_PROGRESS, increments reopen_count and clears action_taken while leaving the line posture untouched; a second submit-verification then re-enters the cycle and a start call on the reopened action is refused."
        test_recipe:
          setup:
            - "execute BASE steps 1-9, then fail a sanitation clean on L1 so exactly one OPEN MAJOR corrective action ${ca_id} exists and L1 is RESTRICTED"
          setup_api_calls:
            - call: "POST /lines/${line_id}/sanitation-events"
              payload: { shift: "SANITATION", scheduled_for: "2026-08-02T06:00:00Z", is_allergen_changeover: false }
              as: SanitationTech
              captures: { sanz: "$.data.id" }
            - call: "POST /sanitation-events/${sanz}/start"
              as: SanitationTech
              as_user_id: "sant-1"
            - call: "POST /sanitation-events/${sanz}/submit"
              payload: { disassembled_component_count: 12, atp_rlu: 250, allergen_swab_result: "NEGATIVE" }
              as: SanitationTech
              as_user_id: "sant-1"
            - call: "POST /sanitation-events/${sanz}/validate"
              payload: { outcome: "FAIL" }
              as: QATechnician
              as_user_id: "qat-1"
              captures: { san_reason: "$.data.failed_reason" }
            - call: "GET /lines/${line_id}/corrective-actions"
              as: QAManager
              captures: { ca_id: "$.data[0].id", ca_open: "$.data[0].status", ca_reopens: "$.data[0].reopen_count" }
          trigger:
            - call: "POST /corrective-actions/${ca_id}/start"
              as: QATechnician
              as_user_id: "qat-3"
              captures: { st1: "$.data.status", impl: "$.data.implemented_by_user_id" }
            - call: "POST /corrective-actions/${ca_id}/start"
              as: QATechnician
              as_user_id: "qat-3"
              captures: { e_restart: "$.data.error_id" }
            - call: "POST /corrective-actions/${ca_id}/submit-verification"
              payload: { action_taken: "Wiped down the blade housing" }
              as: QATechnician
              as_user_id: "qat-3"
              captures: { st2: "$.data.status", taken: "$.data.action_taken" }
            - call: "POST /corrective-actions/${ca_id}/verify"
              payload: { outcome: "FAIL" }
              as: QAManager
              as_user_id: "qam-1"
              captures: { st3: "$.data.status", reopens: "$.data.reopen_count", taken2: "$.data.action_taken", vat: "$.data.verified_at" }
            - call: "GET /lines/${line_id}"
              as: QAManager
              captures: { posture: "$.data.posture", cas: "$.data.open_corrective_action_count" }
            - call: "POST /corrective-actions/${ca_id}/submit-verification"
              payload: { action_taken: "Disassembled and replaced the blade housing seals" }
              as: QATechnician
              as_user_id: "qat-3"
              captures: { st4: "$.data.status", taken3: "$.data.action_taken" }
          assert:
            - "${san_reason} == MANUAL_FAIL: an explicit FAIL outcome is recorded as MANUAL_FAIL even though atp_rlu 250 also exceeds the limit, because the reasons are evaluated in the declared order and ATP is checked first only for a PASS request"
            - "${ca_open} == OPEN and ${ca_reopens} == 0 on the freshly opened action"
            - "${st1} == IN_PROGRESS with ${impl} == qat-3, and ${e_restart} == ERR_CORRECTIVE_ACTION_INVALID_STATE because start requires OPEN"
            - "${st2} == VERIFICATION_PENDING with ${taken} recorded from the request"
            - "${st3} == IN_PROGRESS, ${reopens} == 1, ${taken2} null and ${vat} null: the FAIL branch reopens without stamping a verification"
            - "${posture} == RESTRICTED and ${cas} == 1: a failed verification leaves the action open, so the posture is unchanged"
            - "${st4} == VERIFICATION_PENDING again with ${taken3} the new text: the cycle is unbounded and only a PASS terminates it"

      - name: corner_hold_retest_rounds_exhaust_then_reject_destroys_cases
        claim_type: Terminal State Lockdown
        grounds:
          - state_machines[HoldRecord].transitions[RETEST_REQUIRED->UNDER_TEST]
          - validations[priority=58]
          - state_machines[FinishedCase].transitions[ON_HOLD->DESTROYED]
        distinguishing_aspect: "Three INDETERMINATE rounds exhaust MAX_TEST_ROUNDS, a fourth submit is refused, release is refused from RETEST_REQUIRED, and the reject escape hatch destroys all 900 cases while keeping the conservation invariant."
        test_recipe:
          setup: ["execute the BASE chain, so RUN1 is CLOSED with 900 ON_HOLD cases and hold ${hold_id} is HELD with test_round 0"]
          setup_api_calls: []
          trigger:
            - call: "POST /hold-records/${hold_id}/submit-sample"
              payload: { latest_test_type: "LISTERIA" }
              as: QATechnician
              as_user_id: "qat-2"
              captures: { r1: "$.data.test_round", s1: "$.data.status" }
            - call: "POST /hold-records/${hold_id}/record-result"
              payload: { latest_test_result: "INDETERMINATE" }
              as: QATechnician
              as_user_id: "qat-2"
              captures: { r2: "$.data.test_round", s2: "$.data.status" }
            - call: "POST /hold-records/${hold_id}/release"
              as: QAManager
              as_user_id: "qam-1"
              captures: { e_release: "$.data.error_id" }
            - call: "POST /hold-records/${hold_id}/submit-sample"
              payload: { latest_test_type: "LISTERIA" }
              as: QATechnician
              as_user_id: "qat-2"
              captures: { r3: "$.data.test_round", res_cleared: "$.data.latest_test_result" }
            - call: "POST /hold-records/${hold_id}/record-result"
              payload: { latest_test_result: "INDETERMINATE" }
              as: QATechnician
              as_user_id: "qat-2"
            - call: "POST /hold-records/${hold_id}/submit-sample"
              payload: { latest_test_type: "LISTERIA" }
              as: QATechnician
              as_user_id: "qat-2"
              captures: { r4: "$.data.test_round" }
            - call: "POST /hold-records/${hold_id}/record-result"
              payload: { latest_test_result: "INDETERMINATE" }
              as: QATechnician
              as_user_id: "qat-2"
              captures: { s5: "$.data.status" }
            - call: "POST /hold-records/${hold_id}/submit-sample"
              payload: { latest_test_type: "LISTERIA" }
              as: QATechnician
              as_user_id: "qat-2"
              captures: { e_rounds: "$.data.error_id" }
            - call: "POST /hold-records/${hold_id}/reject"
              as: QAManager
              as_user_id: "qam-1"
              captures: { s6: "$.data.status", closed: "$.data.closed_at", relby: "$.data.released_by_user_id" }
            - call: "GET /process-runs/${run_id}"
              as: QAManager
              captures: { disp: "$.data.disposition_status", avail: "$.data.cases_available", onhold: "$.data.cases_on_hold", destroyed: "$.data.cases_destroyed", shipped: "$.data.cases_shipped", produced: "$.data.cases_produced" }
            - call: "GET /process-runs/${run_id}/finished-cases"
              payload: { limit: 1, offset: 0 }
              as: QAManager
              captures: { case_status: "$.data[0].status" }
            - call: "POST /hold-records/${hold_id}/reject"
              as: QAManager
              as_user_id: "qam-1"
              captures: { e_reject_again: "$.data.error_id" }
          assert:
            - "${r1} == 1 with ${s1} == UNDER_TEST; ${r2} == 1 with ${s2} == RETEST_REQUIRED - an INDETERMINATE result does not consume a round by itself"
            - "${e_release} == ERR_HOLD_INVALID_STATE: release requires UNDER_TEST, so RETEST_REQUIRED is not releasable even before the result is inspected"
            - "${r3} == 2 with ${res_cleared} null: each submit-sample clears the previous result"
            - "${r4} == 3 and ${s5} == RETEST_REQUIRED"
            - "${e_rounds} == ERR_MAX_RETEST_ROUNDS_EXCEEDED with HTTP 409 on the fourth submit, because test_round 3 is not < MAX_TEST_ROUNDS 3"
            - "${s6} == REJECTED with ${closed} non-null and ${relby} == qam-1"
            - "${disp} == REJECTED, ${destroyed} == 900, ${onhold} == 0, ${avail} == 0, ${shipped} == 0 and ${avail} + ${onhold} + ${shipped} + ${destroyed} == ${produced} == 900"
            - "${case_status} == DESTROYED"
            - "${e_reject_again} == ERR_HOLD_INVALID_STATE: RELEASED and REJECTED are the hold's terminal states"

      - name: corner_void_twice_is_refused
        claim_type: Idempotency
        grounds:
          - validations[priority=30]
          - validations[priority=25]
          - state_machines[LotConsumption]
        distinguishing_aspect: "The second void carries a correct expected_process_run_version and still fails with ERR_CONSUMPTION_ALREADY_VOIDED, proving the state check is reached only after the version check passes."
        test_recipe:
          setup: ["execute BASE steps 1-19, so RUN1 is RUNNING with one ACTIVE consumption of 30000.00 lb"]
          setup_api_calls:
            - call: "GET /process-runs/${run_id}/lot-consumptions"
              as: LineOperator
              captures: { cons_id: "$.data[0].id", cons_status: "$.data[0].status", cons_by: "$.data[0].recorded_by_user_id" }
            - call: "GET /process-runs/${run_id}"
              as: LineOperator
              captures: { rv3: "$.data.version" }
          trigger:
            - call: "POST /lot-consumptions/${cons_id}/void"
              payload: { expected_process_run_version: "${rv3}" }
              as: LineOperator
              captures: { st: "$.data.status", vat: "$.data.voided_at" }
            - call: "GET /process-runs/${run_id}"
              as: LineOperator
              captures: { rv4: "$.data.version" }
            - call: "POST /lot-consumptions/${cons_id}/void"
              payload: { expected_process_run_version: "${rv3}" }
              as: LineOperator
              captures: { e_stale: "$.data.error_id" }
            - call: "POST /lot-consumptions/${cons_id}/void"
              payload: { expected_process_run_version: "${rv4}" }
              as: LineOperator
              captures: { e_voided: "$.data.error_id" }
          assert:
            - "${cons_status} == ACTIVE and ${st} == VOIDED with ${vat} == the logical clock at the void instant"
            - "${rv4} == ${rv3} + 1: the void is a write on the parent run"
            - "${e_stale} == ERR_STALE_PROCESS_RUN_VERSION with HTTP 412 when the first version is replayed"
            - "${e_voided} == ERR_CONSUMPTION_ALREADY_VOIDED with HTTP 409 once the version is current, so priority 25 is evaluated before priority 30"

      - name: corner_receipt_reject_branch_leaves_no_consumable_pounds
        claim_type: Valid Transition
        grounds:
          - state_machines[RawReceipt].transitions[PENDING_INSPECTION->REJECTED]
          - validations[priority=27]
        distinguishing_aspect: "The REJECT branch of the same disposition trigger leaves accepted_lb and remaining_lb null rather than zero, does not count toward out_of_spec_receipt_count, and makes the receipt terminal so a second disposition is refused."
        test_recipe:
          setup: ["execute BASE steps 1-8, so G1 is APPROVED with both scores 100 and receipt R1 is PENDING_INSPECTION with net_weight_lb 40000.00 and temp_grade IN_SPEC"]
          setup_api_calls: []
          trigger:
            - call: "POST /raw-receipts/${rcpt_id}/disposition"
              payload: { decision: "REJECT" }
              as: QATechnician
              as_user_id: "qat-9"
              captures: { st: "$.data.status", acc: "$.data.accepted_lb", rem: "$.data.remaining_lb", trim: "$.data.trim_loss_lb", by: "$.data.dispositioned_by_user_id" }
            - call: "GET /grower-lots/${lot_id}"
              as: QAManager
              captures: { oos: "$.data.out_of_spec_receipt_count", trail: "$.data.trailing_risk_score", lot_st: "$.data.status" }
            - call: "POST /raw-receipts/${rcpt_id}/disposition"
              payload: { decision: "ACCEPT", trim_loss_lb: 0.00 }
              as: QATechnician
              captures: { e_again: "$.data.error_id" }
            - call: "GET /grower-lots/${lot_id}/raw-receipts"
              payload: { status: "REJECTED", limit: 10, offset: 0 }
              as: QAManager
              captures: { listed: "$.data[0].id" }
          assert:
            - "${st} == REJECTED with ${acc} null, ${rem} null and ${trim} null: no trim loss was declared and no pounds were ever released"
            - "${by} == qat-9 - the stamp is written on both branches"
            - "${oos} == 0 and ${trail} == 100 with ${lot_st} == APPROVED: a REJECTED load is not an out-of-spec load, so the trailing recompute leaves the score alone"
            - "${e_again} == ERR_RECEIPT_NOT_PENDING with HTTP 409: REJECTED is terminal"
            - "${listed} == ${rcpt_id}: the rejected load is still visible under the lot's status filter"

      - name: corner_finished_case_terminal_lockdown
        claim_type: Terminal State Lockdown
        grounds:
          - state_machines[FinishedCase].terminal_states
          - validations[priority=36]
        excluded_because:
          difficulty_instance: case_ship_requires_released_hold_on_run
          rationale: "That instance already ships a case and then re-ships the same case, asserting ERR_CASE_NOT_IN_INVENTORY at priority 36 with the run disposition still permitting shipment, plus the shipped_at timestamp surviving the later hold and release. Repeating it here would duplicate both the trigger and the assertions."

      - name: corner_run_status_and_disposition_dimensions_are_independent
        claim_type: Valid Transition
        grounds:
          - state_machines[ProcessRun].dimension=run_status
          - state_machines[ProcessRun].dimension=disposition_status
        excluded_because:
          difficulty_instance: process_run_parallel_run_and_disposition_dimensions
          rationale: "That instance holds a run while it is still RUNNING, closes it into a second automatic hold, and shows the two dimensions advancing without gating each other, including the release refusal while a sibling hold is non-terminal. Any breadth version of the claim would be a strict subset."

      - name: corner_release_restores_case_counters_exactly
        claim_type: Side Effect Execution
        grounds:
          - state_machines[FinishedCase].transitions[ON_HOLD->IN_INVENTORY]
          - state_machines[ProcessRun].dimension=disposition_status.transitions[HELD->RELEASED]
        excluded_because:
          difficulty_instance: hold_then_release_restores_case_disposition_counts
          rationale: "That instance is the compensating-invariant case: it holds a run with two already-shipped cases, captures cases_held_count 898, releases, and asserts the counters return to 898 available rather than 900 while the shipped cases keep their original shipped_at and code_date. The restoration claim cannot be stated more sharply here."

  - section: calculations
    instances:

      - name: corner_load_index_at_exact_ceiling_forces_changeout_and_reset
        claim_type: Constants Applied
        grounds:
          - calculations.wash_water_load_and_target_ppm.constants.CHANGEOUT_LOAD_INDEX_MAX
          - state_machines[WashSystem].transitions[IN_SERVICE->DUMP_REQUIRED]
          - state_machines[WashSystem].transitions[DUMP_REQUIRED->IN_SERVICE]
          - validations[priority=42]
        distinguishing_aspect: "A 1000-gallon flume that absorbs exactly 30000 LEAFY pounds lands on an organic_load_index of exactly 3.000, which is the inclusive ceiling: the target ppm becomes null, the next run start is refused, and the change-out resets the window to 0.000 / 20.0 while incrementing changeout_count."
        test_recipe:
          setup:
            - "execute BASE steps 1-13, so P_ROMAINE (LEAFY), S_FS, L1 with a VALIDATED clean, W1, G1 APPROVED and R1 ACCEPTED with 36000.00 lb remain, and the clock is 2026-08-02T05:00:00Z"
            - "a second wash system W2 of 1000 gal with max_concurrent_runs 1 exists"
          setup_api_calls:
            - call: "POST /wash-systems"
              payload: { system_code: "W2", water_volume_gal: 1000, max_concurrent_runs: 1 }
              as: PlantAdmin
              captures: { ws2: "$.data.id" }
            - call: "POST /process-runs"
              payload: { line_id: "${line_id}", product_id: "${prod_id}", customer_spec_id: "${spec_id}", wash_system_id: "${ws2}", planned_start_at: "2026-08-03T07:00:00Z", planned_end_at: "2026-08-03T12:00:00Z", crew_size: 6 }
              as: LineOperator
              captures: { run_a: "$.data.id" }
            - call: "POST /_clock/set_current_utc"
              payload: { current_utc: "2026-08-03T06:30:00Z" }
              as: PlantAdmin
            - call: "POST /wash-systems/${ws2}/antimicrobial-readings"
              payload: { reading_at: "2026-08-03T06:30:00Z", free_chlorine_ppm: 24.0, ph: 6.8, orp_mv: 700, turbidity_ntu: 1.0 }
              as: LineOperator
            - call: "POST /_clock/set_current_utc"
              payload: { current_utc: "2026-08-03T07:00:00Z" }
              as: PlantAdmin
            - call: "POST /process-runs/${run_a}/start"
              as: LineOperator
              captures: { va: "$.data.version", frozen_target: "$.data.target_ppm_at_start" }
          trigger:
            - call: "POST /process-runs/${run_a}/lot-consumptions"
              payload: { raw_receipt_id: "${rcpt_id}", consumed_lb: 30000.00, expected_process_run_version: "${va}" }
              as: LineOperator
            - call: "GET /wash-systems/${ws2}"
              as: LineOperator
              captures: { load: "$.data.weighted_load_lb", idx: "$.data.organic_load_index" }
            - call: "POST /_clock/set_current_utc"
              payload: { current_utc: "2026-08-03T09:00:00Z" }
              as: PlantAdmin
            - call: "POST /wash-systems/${ws2}/antimicrobial-readings"
              payload: { reading_at: "2026-08-03T09:00:00Z", free_chlorine_ppm: 26.0, ph: 6.7, orp_mv: 690, turbidity_ntu: 4.0 }
              as: LineOperator
              captures: { rd_target: "$.data.target_free_chlorine_ppm_at_reading", rd_idx: "$.data.organic_load_index_at_reading" }
            - call: "GET /wash-systems/${ws2}"
              as: LineOperator
              captures: { st_dump: "$.data.status", target_dump: "$.data.target_free_chlorine_ppm" }
            - call: "POST /process-runs"
              payload: { line_id: "${line_id}", product_id: "${prod_id}", customer_spec_id: "${spec_id}", wash_system_id: "${ws2}", planned_start_at: "2026-08-03T13:00:00Z", planned_end_at: "2026-08-03T15:00:00Z", crew_size: 6 }
              as: LineOperator
              captures: { run_b: "$.data.id" }
            - call: "POST /_clock/set_current_utc"
              payload: { current_utc: "2026-08-03T13:00:00Z" }
              as: PlantAdmin
            - call: "POST /process-runs/${run_b}/start"
              as: LineOperator
              captures: { e_dump: "$.data.error_id" }
            - call: "POST /wash-systems/${ws2}/changeout"
              as: SanitationTech
              captures: { st_back: "$.data.status", idx_back: "$.data.organic_load_index", target_back: "$.data.target_free_chlorine_ppm", load_back: "$.data.weighted_load_lb", cnt: "$.data.changeout_count", lca: "$.data.last_changeout_at" }
          assert:
            - "${frozen_target} == 20.0: the run froze its target before its own pounds existed"
            - "${load} == 30000.00 == 30000.00 x LOAD_FACTOR[LEAFY] 1.0, and ${idx} == 3.000 == round_half_up(30000.00 / (1000 x 10), 3)"
            - "${rd_idx} == 3.000 and ${rd_target} is null on the reading row: no tier is defined at or above the ceiling"
            - "${st_dump} == DUMP_REQUIRED with ${target_dump} null, because the ceiling comparison is >= and not >"
            - "${e_dump} == ERR_WASH_SYSTEM_DUMP_REQUIRED with HTTP 422 at priority 42, reached before any reading freshness check"
            - "${st_back} == IN_SERVICE, ${load_back} == 0.00, ${idx_back} == 0.000, ${target_back} == 20.0, ${cnt} == 1 and ${lca} == 2026-08-03T13:00:00.000Z"
            - "the reset comes from moving last_changeout_at forward, so the 30000 lb consumption still exists and still counts toward the run's input_lb"

      - name: corner_tier_breakpoints_are_inclusive_lower
        claim_type: Precision
        grounds:
          - calculations.wash_water_load_and_target_ppm.formula
          - calculations.wash_water_load_and_target_ppm.precision
        distinguishing_aspect: "On a 4000-gallon flume the index is rounded to exactly three decimals before the tier is chosen, so 19960 lb gives 0.499 and the 20.0 tier, 40 more pounds give exactly 0.500 and the 35.0 tier, and 60000 lb give exactly 1.500 and the 55.0 tier."
        test_recipe:
          setup:
            - "execute BASE steps 1-13, then add a 4000 gal wash system W3 and a second ACCEPTED receipt R_B on G1 with accepted_lb 44000.00"
            - "a run RUN_C on L1 using W3 is RUNNING as of 2026-08-03T07:00:00Z"
          setup_api_calls:
            - call: "POST /wash-systems"
              payload: { system_code: "W3", water_volume_gal: 4000, max_concurrent_runs: 2 }
              as: PlantAdmin
