            - "AnalysisRun.${r1}.impact_ratio_raw == 0.6250"
            - "AnalysisRun.${r1}.impact_ratio_net != AnalysisRun.${r1}.impact_ratio_raw"
            - "AnalysisRun.${r1}.adverse_classification == MARGINAL (classified on the net variant)"
            - "AnalysisRun.${r1}.screening_flag == true (raw variant below 0.80)"
            - "exactly 1 auto finding: kind == DENIAL_DISPARITY, source == AUTO, status == FLAGGED, metric_value == 0.6250, threshold_value == 0.80"
            - "AnalysisRun.${r1}.pricing_disparity_unadjusted_bps == 0.0000 (no PRICING_DISPARITY auto-finding)"
            - "AnalysisRun.${r1}.open_finding_count == 1"

