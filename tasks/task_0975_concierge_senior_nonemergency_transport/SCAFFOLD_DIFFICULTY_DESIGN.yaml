          assert:
            - "First offer went to zone-matching D1: offered1 == ${d1}"
            - "After release: Ride.status == DISPATCHING, dispatch_round == 2, assigned_driver_id == null"
            - "Assignment.${asg1}.status == RELEASED with release_reason DRIVER_RELEASE"
            - "Re-offer excludes releaser: offered2 == ${d2} (D1 in excluded_driver_ids)"
            - "After D2 accepts: Ride.status == ASSIGNED, assigned_driver_id == ${d2}, dispatch_round == 3"

      - name: invoice_issuance_and_dispute_dimensions_independent
