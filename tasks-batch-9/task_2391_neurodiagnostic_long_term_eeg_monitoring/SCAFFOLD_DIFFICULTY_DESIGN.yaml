              as: UnitCoordinator
            - call: "POST /neurodiagnostics/authorizations/${auth_id}/payer-decision"
              payload: { outcome: "PEND", payer_note: "need prior AED trials" }
              as: PayerReviewer
            - call: "POST /neurodiagnostics/authorizations/${auth_id}/submit"
              payload: {}
              as: UnitCoordinator
            - call: "POST /neurodiagnostics/authorizations/${auth_id}/payer-decision"
