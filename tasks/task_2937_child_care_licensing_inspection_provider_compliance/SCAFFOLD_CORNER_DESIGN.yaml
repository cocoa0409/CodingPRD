      - name: endpoint_conditional_action_promote_to_full_needs_the_period_and_a_pass
        claim_type: conditional_action
        grounds:
          - endpoints.POST /licensing/providers/{provider_id}/promote-to-full
          - validations.priority_72_ERR_PROVISIONAL_PERIOD_NOT_ELAPSED
          - errors[ERR_PROVISIONAL_PERIOD_NOT_ELAPSED]
          - state_machines.Provider.license_status.PROVISIONAL_to_FULL
          - global_constants.PROVISIONAL_PERIOD_MONTHS
        distinguishing_aspect: "Promotion is gated on two independent conditions: at the moment of licensure it fails with ERR_PROVISIONAL_PERIOD_NOT_ELAPSED 409, and only after the clock passes provisional_started_at plus six months AND a passing ANNUAL inspection is finalized does license_status move PROVISIONAL to FULL."
        test_recipe:
          setup:
            - "A CENTER provider licensed PROVISIONAL at 2026-08-05T09:00:00Z through the full application path (cleared DIRECTOR, PRESCHOOL roster of 10, passing INITIAL inspection)."
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-08-01T00:00:00Z" }
              as: AgencyAdmin
            - call: "POST /licensing/providers"
              payload: { legal_name: "Bright Start Center", county_code: "CTY-01", site_address: "12 Elm St", program_type: "CENTER", requested_capacity: 10 }
