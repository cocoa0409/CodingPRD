            - "Incident.${inc_in}.linked_release_id == ${rel_late} (cut_at 2026-08-11T00:00:00Z beats 2026-08-10T00:00:00Z)"
            - "Incident.${inc_in}.linked_deployment_id == null because neither release has a COMPLETED deployment"
            - "Incident.${inc_in}.state == OPEN and decision == null"
            - "Incident.${inc_out}.linked_release_id == null and linked_deployment_id == null"
            - "GET /incidents filtered by linked_release_id == ${rel_late} returns total_count == 1"

      - name: risk_score_variant_selected_by_lifecycle_point_not_by_recompute
        claim_type: variant_selection
        grounds:
          - calculations.change_risk_score
          - state_machines.ChangeRequest.DRAFT_to_RISK_CLASSIFIED
          - state_machines.ChangeRequest.RISK_CLASSIFIED_to_APPROVED
        distinguishing_aspect: "The preliminary variant is pinned only at submit and the final variant only when APPROVED is entered: right after submit risk_score_final is null with preliminary 33, and after the TECHNICAL approval final is 33 while preliminary is left untouched at 33 rather than recomputed."
        test_recipe:
          setup:
            - "Clock at 2026-08-01T00:00:00Z; Release 2026.08.1 OPEN."
            - "CR_M: 300 lines, 2 subsystems, SINGLE_TENANT, no schema migration, no rollback plan, no flag links, no dependencies."
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-08-01T00:00:00Z" }
              as: PlatformAdmin
              as_user_id: "u-pa-1"
            - call: "POST /release-trains"
              payload: { name: "core-train", cadence_days: 14, code_freeze_lead_hours: 48, stabilization_hours: 72, risk_budget_points: 120 }
              as: ReleaseManager
              as_user_id: "u-rm-1"
              captures: { train_id: $.data.id }
            - call: "POST /release-trains/${train_id}/releases"
              payload: { version_label: "2026.08.1", cut_at: "2026-08-10T00:00:00Z" }
              as: ReleaseManager
              as_user_id: "u-rm-1"
              captures: { rel_id: $.data.id }
            - call: "POST /releases/${rel_id}/change-requests"
              payload: { title: "Retry policy rewrite", summary_internal: "two-subsystem rewrite", lines_changed: 300, touched_subsystem_count: 2, declared_blast_radius: "SINGLE_TENANT" }
              as: Engineer
              as_user_id: "u-eng-1"
              captures: { cr_m: $.data.id }
          trigger:
            - call: "POST /change-requests/${cr_m}/submit"
              payload: {}
              as: Engineer
              as_user_id: "u-eng-1"
              captures: { prelim: $.data.risk_score_preliminary, final_at_submit: $.data.risk_score_final }
            - call: "POST /change-requests/${cr_m}/approvals"
              payload: { kind: "TECHNICAL", decision: "APPROVE" }
              as: ChangeApprover
              as_user_id: "u-appr-1"
              captures: { appr_id: $.data.id }
          assert:
            - "After submit: risk_score_preliminary == 33, risk_score_final == null, risk_class == MEDIUM, state == RISK_CLASSIFIED"
            - "After the approval: ChangeRequest.${cr_m}.state == APPROVED"
            - "ChangeRequest.${cr_m}.risk_score_final == 33 and risk_score_preliminary is still 33"
            - "ChangeRequest.${cr_m}.approval_technical_count == 1"
            - "Approval.${appr_id}.pinned_risk_score == 33"
            - "Release.${rel_id}.risk_budget_consumed_points == 33 and committed_change_count == 1"

      - name: canary_rounding_precision_covered_by_difficulty_instance
        claim_type: precision
        grounds:
          - calculations.canary_health_verdict
        excluded_because:
          difficulty_instance: combinatorial_formula / canary_error_rate_per_signal_rounding_then_request_weighted_mean
          rationale: "The named §1.8 instance pins the two-stage ROUND_HALF_UP result 22.23 against the naive 22.22 and the 59.59 weighted score."

      - name: readiness_forward_looking_covered_by_difficulty_instance
        claim_type: forward_looking
        grounds:
          - calculations.release_readiness_score
        excluded_because:
          difficulty_instance: dual_variant_calc / release_readiness_projected_vs_attested_diverge_on_deferred_change
          rationale: "The named §1.8 instance asserts the projected variant over pending states and its re-evaluation when a pending change is deferred."

      - name: canary_aggregation_covered_by_difficulty_instance
        claim_type: aggregation
        grounds:
          - calculations.canary_health_verdict
        excluded_because:
          difficulty_instance: combinatorial_formula / canary_error_rate_per_signal_rounding_then_request_weighted_mean
          rationale: "The named §1.8 instance aggregates several CANARY signals over a half-open window and asserts sample_count, max latency and the request-weighted mean."

      - name: risk_weighted_scoring_covered_by_difficulty_instance
        claim_type: weighted_scoring
        grounds:
          - calculations.change_risk_score
        excluded_because:
          difficulty_instance: boundary_precision_check / risk_class_boundary_score_exactly_fifty_is_high_forty_six_is_medium
          rationale: "The named §1.8 instance asserts the additive weight components and the exact tier boundary at 50 with no rounding drift."

      - name: evidence_constraint_propagation_covered_by_difficulty_instance
        claim_type: constraint_propagation
        grounds:
          - calculations.evidence_completeness_index
        excluded_because:
          difficulty_instance: combinatorial_formula / evidence_completeness_waiver_cap_tier_selected_from_base_index
          rationale: "The named §1.8 instance propagates two waivers through the cap tier to a fixed point and asserts the seal refusal at 85."

      - name: risk_variant_divergence_covered_by_difficulty_instance
        claim_type: variant_divergence
        grounds:
          - calculations.change_risk_score
        excluded_because:
          difficulty_instance: dual_variant_calc / change_risk_score_preliminary_vs_final_diverge_on_dependency_depth
          rationale: "The named §1.8 instance asserts the 62 vs 67 divergence produced solely by the dependency_depth term."

      - name: risk_variant_reconciliation_covered_by_difficulty_instance
        claim_type: reconciliation
        grounds:
          - entities.Release.fields.risk_budget_consumed_points
        excluded_because:
          difficulty_instance: dual_variant_calc / change_risk_score_preliminary_vs_final_diverge_on_dependency_depth
          rationale: "The named §1.8 instance asserts that the ledger takes the final variant (budget 76 = 9 + 67), reconciling the preliminary-to-final delta."

  # =======================================================================
  - section: validations
    instances:

      - name: start_deployment_inside_environment_blackout_returns_blackout_active
        claim_type: violation_to_error
        grounds:
          - validations[priority=32]
          - errors[ERR_BLACKOUT_ACTIVE]
          - entities.Environment.fields.blackout_start_at
          - endpoints[POST /deployments/{id}/start]
        distinguishing_aspect: "The blackout interval is checked only at start and only against the logical clock: a deployment created inside the blackout is accepted, its start at 02:05 is refused with 409 ERR_BLACKOUT_ACTIVE, and a second deployment starting at 05:05 after the closed interval [02:00, 05:00] succeeds."
        test_recipe:
          setup:
            - "Clock at 2026-08-01T00:00:00Z; Environment prod-blackout: tier PROD, window hours 2..6, cooldown_minutes 30, blackout 2026-08-10T02:00:00Z..2026-08-10T05:00:00Z."
            - "Release 2026.08.1 (cut_at 2026-08-10T00:00:00Z, freeze_at 2026-08-08T00:00:00Z) cut at 2026-08-08T00:00:00Z."
            - "dep_early window [02:00, 04:00) and dep_late window [05:00, 06:00) both created on 2026-08-10 while the clock is still 2026-08-08."
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-08-01T00:00:00Z" }
              as: PlatformAdmin
              as_user_id: "u-pa-1"
            - call: "POST /environments"
              payload: { name: "prod-blackout", tier: "PROD", deploy_window_start_hour_utc: 2, deploy_window_end_hour_utc: 6, cooldown_minutes: 30, blackout_start_at: "2026-08-10T02:00:00Z", blackout_end_at: "2026-08-10T05:00:00Z" }
              as: PlatformAdmin
              as_user_id: "u-pa-1"
              captures: { env_id: "$.data.id" }
            - call: "POST /release-trains"
              payload: { name: "core-train", cadence_days: 14, code_freeze_lead_hours: 48, stabilization_hours: 72, risk_budget_points: 120 }
              as: ReleaseManager
              as_user_id: "u-rm-1"
              captures: { train_id: "$.data.id" }
            - call: "POST /release-trains/${train_id}/releases"
              payload: { version_label: "2026.08.1", cut_at: "2026-08-10T00:00:00Z" }
              as: ReleaseManager
              as_user_id: "u-rm-1"
              captures: { rel_id: "$.data.id" }
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-08-08T00:00:00Z" }
              as: PlatformAdmin
              as_user_id: "u-pa-1"
            - call: "POST /releases/${rel_id}/cut"
              payload: {}
              as: ReleaseManager
              as_user_id: "u-rm-1"
            - call: "POST /releases/${rel_id}/deployments"
              payload: { environment_id: "${env_id}", window_start_at: "2026-08-10T02:00:00Z", window_end_at: "2026-08-10T04:00:00Z", strategy: "ALL_AT_ONCE", abort_error_rate_pct: 25.0, abort_latency_p95_ms: 800 }
              as: SRE
              as_user_id: "u-sre-1"
              captures: { dep_early: "$.data.id" }
            - call: "POST /releases/${rel_id}/deployments"
              payload: { environment_id: "${env_id}", window_start_at: "2026-08-10T05:00:00Z", window_end_at: "2026-08-10T06:00:00Z", strategy: "ALL_AT_ONCE", abort_error_rate_pct: 25.0, abort_latency_p95_ms: 800 }
              as: SRE
              as_user_id: "u-sre-1"
              captures: { dep_late: "$.data.id" }
          trigger:
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-08-10T02:05:00Z" }
              as: PlatformAdmin
              as_user_id: "u-pa-1"
            - call: "POST /deployments/${dep_early}/start"
              payload: {}
              as: SRE
              as_user_id: "u-sre-1"
              captures: { err: "$.data.error_id" }
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-08-10T05:05:00Z" }
              as: PlatformAdmin
              as_user_id: "u-pa-1"
