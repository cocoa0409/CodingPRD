              captures: { fac_id: "$.data.id", fac_v0: "$.data.version" }
            - call: "POST /fca/asset-systems"
              payload: { facility_id: "${fac_id}", system_category: "HVAC", name: "S", install_year: 2010, design_life_years: 25, replacement_cost_cents: 100000000, condition_rating: 3 }
              as: Consultant
              captures: { sys_id: "$.data.id" }
            - call: "POST /fca/deficiencies"
              payload: { asset_system_id: "${sys_id}", description: "d", cost_estimate_cents: 10000000, severity: 3, urgency: 3, recommended_year: 2027 }
              as: Consultant
          trigger:
            - call: "POST /fca/facilities/${fac_id}/recompute"
              payload: {}
              as: Consultant
              captures: { ver: "$.data.version", fci: "$.data.facility_condition_index" }
          assert:
            - "facility_condition_index == 0.1000 after recompute"
            - "version incremented by 1 relative to the version observed just before recompute"

  - section: errors
    instances:
      - name: error_envelope_shape_on_failure
        claim_type: violation_to_error
        grounds: [response_envelope, "errors[ERR_NOT_FOUND]"]
        distinguishing_aspect: "Error responses carry meta.api_request_id, response_type 'error', and data.error_id + data.message per the fixed envelope."
        test_recipe:
          setup: ["empty DB"]
          setup_api_calls: []
          trigger:
            - call: "GET /fca/clients/00000000-0000-0000-0000-000000000000"
              payload: {}
              as: Consultant
              captures: { err: "$.data.error_id", msg: "$.data.message" }
          assert:
            - "response_type == 'error'"
            - "data.error_id == ERR_NOT_FOUND and data.message is a non-empty string"
            - "meta contains api_request_id and api_request_timestamp"
      - name: err_duplicate_covered
        claim_type: violation_to_error
        grounds: ["errors[ERR_DUPLICATE]"]
        excluded_because:
          difficulty_instance: refresh_cycle_single_open_interval_per_facility
          rationale: "ERR_DUPLICATE is the asserted outcome of the double-open refresh-cycle difficulty instance (rule resource_temporal_overlap)."

