        distinguishing_aspect: |
          business_safety versus business_constraint: the same request violates
          both the host-posture gate (priority 5) and the member-eligibility gate
          (priority 18), and the response must be ERR_HOST_NOT_ACCEPTING_STAYS,
          never ERR_MEMBER_NOT_ELIGIBLE.
