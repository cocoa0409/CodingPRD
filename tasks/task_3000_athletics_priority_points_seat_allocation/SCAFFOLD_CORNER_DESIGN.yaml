          The EXISTING_HOLDER_POOL variant applies to POSTSEASON and AWAY_GAME
          events only, so the 67.50-point donor with no seat is excluded from a
          postseason publication while the 15.00-point donor who actually holds an
          ASSIGNED seat is included — the pool restriction beats the point order.
          The single published slot must therefore carry slot_index 0 with
          rank_at_publish 2, because rank_at_publish copies the donor's STORED
          global rank_position (the staleness comparand) rather than the
