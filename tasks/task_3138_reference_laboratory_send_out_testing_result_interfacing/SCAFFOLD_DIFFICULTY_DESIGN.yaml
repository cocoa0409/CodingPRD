  - rule_id: priority_pair_validation_conflict
    instances:

      # -----------------------------------------------------------------------
      - name: client_not_active_outranks_catalog_publication_currency
        grounds:
          - validations.priority_21_business_constraint
          - validations.priority_6_business_referential
          - errors.ERR_CLIENT_NOT_ACTIVE
          - errors.ERR_CATALOG_ENTRY_NOT_PUBLISHED
          - state_machines.ClientLaboratory.ACTIVE_to_SUSPENDED
        distinguishing_aspect: |
          This conflict pairs a client-state error class with a catalog-referential error
          class: a suspended client submitting an order for a withdrawn test violates priority
          21 and priority 6 at once and must receive ERR_CLIENT_NOT_ACTIVE, unlike the reflex
          conflict below which pairs two safety classes.
        test_recipe:
          setup:
            - "Logical clock at 2026-09-01T07:00:00Z. One client suspended after activation, a certified build, and a ferritin entry that has been DEPRECATED, with a SERUM_SST specimen already on file."
          setup_api_calls:
            - *clk
            - *c1
            - *t1
            - *t1p
            - *ib
            - *ibs
            - *ibc
            - *c1v
            - *cr
            - *pr
            - *act
            - *spec1
            - call: "POST /reference-lab/test-catalog-entries/${t1_id}/deprecate"
              payload: {}
              as: LabClientAdmin
              as_user_id: "${c1_id}"
            - call: "POST /reference-lab/client-laboratories/${c1_id}/suspend"
              payload: {}
              as: ReferenceLabOperations
              captures: { c1_susp: $.data.status }
          trigger:
            - call: "POST /reference-lab/send-out-orders"
              payload: { client_laboratory_id: "${c1_id}", specimen_id: "${sp1_id}", order_number: "REQ-8101", patient_mrn: "MRN-5001", client_requested_at: "2026-09-01T06:40:00Z", priority: "ROUTINE", test_lines: [{ test_catalog_entry_id: "${t1_id}", line_sequence: 1 }], override_utilization_guard: false }
              as: AccessioningTechnologist
              captures: { err_a: $.data.error_id }
          assert:
            - "the response is a 403 with error_id ERR_CLIENT_NOT_ACTIVE"
            - "error_id is not ERR_CATALOG_ENTRY_NOT_PUBLISHED even though the ferritin entry is DEPRECATED and the build is stale"
            - "GET /reference-lab/send-out-orders?client_laboratory_id=${c1_id} returns 0 rows"

