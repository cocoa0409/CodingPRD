          - errors[ERR_REVISION_WINDOW_CLOSED]
        distinguishing_aspect: |
          Metric = elapsed-seconds in revision window. The rule is STRICTLY BEFORE:
          a revision opened at delivered_at + 71:59:59 succeeds; at exactly
          delivered_at + 72:00:00 it fails with ERR_REVISION_WINDOW_CLOSED.
          Reached via POST /shoot-bookings/{id}/revisions.
