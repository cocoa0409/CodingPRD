      - name: premium_weight_cap_constant_applied_per_claim
        claim_type: Constants Applied
        grounds:
          - calculations.risk_score_dual
          - entities.ExchangeRule.fields.premium_weight_cap_cents
        distinguishing_aspect: "The cap is read from the ExchangeRule singleton at report time, not hardcoded: after PATCHing premium_weight_cap_cents from 500000 to 100000, the same claims produce a lower premium-weighted score."
        test_recipe:
          setup:
            - "Logical clock at 2026-09-01T00:00:00Z; ExchangeRule initialized (cap 500000). Carrier B3 ACTIVE; consumer Gil with 1 claim of 300000 cents; report R1 issued under the default cap; then cap patched to 100000 and a second report issued."
          setup_api_calls:
            - *k_clock
            - *k_rules
            - &k_carrier_b3
              call: "POST /carriers"
              payload: { legal_name: "Blue Star Casualty", naic_code: "90013" }
              as: PlatformAdmin
              captures: { cb3_id: $.data.id }
            - &k_consumer_gil
              call: "POST /consumers"
              payload: { full_name: "Gil Gant", date_of_birth: "1981-12-09", address_line: "31 Grape St, Allen TX", driver_license_number: "GIL-1" }
              as: PlatformAdmin
              captures: { cgil_id: $.data.id }
            - call: "POST /carriers/${cb3_id}/batches"
              payload:
                claims:
                  - { consumer_id: "${cgil_id}", policy_number: "PG-3", claim_number: "G3-1", loss_date: "2025-06-15", loss_type: "LIABILITY", cause_of_loss_code: "GL1", paid_amount_cents: 300000, claim_status_code: "CLOSED_WITH_PAYMENT", vehicle_identifier: "" }
              as: CarrierDataSteward
              as_user_id: "${cb3_id}"
            - call: "POST /carriers/${cb3_id}/inquiries"
              payload: { subject_name: "Gil Gant", subject_dob: "1981-12-09", subject_address: "31 Grape St, Allen TX", subject_driver_license: "GIL-1", permissible_purpose: "UNDERWRITING" }
              as: CarrierUnderwriter
              as_user_id: "${cb3_id}"
              captures: { rep_g1: $.data.report_id }
            - call: "PATCH /exchange-rules"
              payload: { premium_weight_cap_cents: 100000 }
              as: PlatformAdmin
          trigger:
            - call: "POST /carriers/${cb3_id}/inquiries"
              payload: { subject_name: "Gil Gant", subject_dob: "1981-12-09", subject_address: "31 Grape St, Allen TX", subject_driver_license: "GIL-1", permissible_purpose: "UNDERWRITING" }
              as: CarrierUnderwriter
              as_user_id: "${cb3_id}"
              captures: { rep_g2: $.data.report_id }
          assert:
            - "LossHistoryReport.${rep_g1}.risk_score_premium_weighted_cents == 181500 (300000 x 60.50 / 100; certainty 60.50 from EXACT individual 5000 + EXACT address 1000 + 1 loss x 50 = 6050)"
            - "LossHistoryReport.${rep_g2}.risk_score_premium_weighted_cents == 60500 (capped 100000 x 60.50 / 100) — the patched constant governs new reports"
            - "LossHistoryReport.${rep_g1}.risk_score_premium_weighted_cents is unchanged by the PATCH (persisted at issuance)"

  # ===========================================================================
  - section: validations
    instances:
      - name: unauthenticated_request_missing_role_header_returns_401
        claim_type: Violation → Error
        grounds:
          - validations.priority_1_auth
          - errors.ERR_UNAUTHENTICATED
        distinguishing_aspect: "A request with no X-User-Role header is rejected at priority 1 with 401 ERR_UNAUTHENTICATED before any existence or role check runs."
        test_recipe:
          setup:
            - "Logical clock at 2026-09-01T00:00:00Z. Empty database."
          setup_api_calls:
            - *k_clock
          trigger:
            - call: "GET /carriers"
              payload: {}
              as: ""
              captures: { error_id: $.data.error_id }
          assert:
            - "the response status is 401 and error_id == ERR_UNAUTHENTICATED"

      - name: consumer_request_purpose_must_resolve_to_acting_consumer
        claim_type: Violation → Error
        grounds:
          - validations.priority_7_business_safety
          - errors.ERR_PERMISSIBLE_PURPOSE
        distinguishing_aspect: "permissible_purpose CONSUMER_REQUEST from a carrier underwriter is structurally invalid — only a consumer may self-request, and a carrier filing with that purpose gets 403 ERR_PERMISSIBLE_PURPOSE."
        test_recipe:
          setup:
            - "Logical clock at 2026-09-01T00:00:00Z; ExchangeRule defaults. Carrier B4 ACTIVE (batch for consumer Hal)."
          setup_api_calls:
            - *k_clock
            - *k_rules
            - &k_carrier_b4
              call: "POST /carriers"
              payload: { legal_name: "Bosque Mutual", naic_code: "90014" }
              as: PlatformAdmin
              captures: { cb4_id: $.data.id }
            - &k_consumer_hal
              call: "POST /consumers"
              payload: { full_name: "Hal Hales", date_of_birth: "1978-10-02", address_line: "40 Hawthorn Hl, Tyler TX", driver_license_number: "HAL-1" }
              as: PlatformAdmin
              captures: { chal_id: $.data.id }
            - call: "POST /carriers/${cb4_id}/batches"
              payload:
                claims:
                  - { consumer_id: "${chal_id}", policy_number: "PH-4", claim_number: "H4-1", loss_date: "2025-02-14", loss_type: "OTHER", cause_of_loss_code: "HH1", paid_amount_cents: 12000, claim_status_code: "CLOSED_WITH_PAYMENT", vehicle_identifier: "" }
              as: CarrierDataSteward
              as_user_id: "${cb4_id}"
          trigger:
            - call: "POST /carriers/${cb4_id}/inquiries"
              payload: { subject_name: "Hal Hales", subject_dob: "1978-10-02", subject_address: "40 Hawthorn Hl, Tyler TX", subject_driver_license: "HAL-1", permissible_purpose: "CONSUMER_REQUEST" }
              as: CarrierUnderwriter
              as_user_id: "${cb4_id}"
              captures: { error_id: $.data.error_id }
          assert:
            - "the response status is 403 and error_id == ERR_PERMISSIBLE_PURPOSE"

      - name: duplicate_claim_number_within_carrier_rejected
        claim_type: Violation → Error
        grounds:
          - validations.priority_10_business_constraint
          - errors.ERR_BATCH_CONSTRAINT
          - entities.LossClaim.fields.claim_number
        distinguishing_aspect: "claim_number is unique per contributing carrier: a batch repeating an already-accepted claim_number from the same carrier fails 422 ERR_BATCH_CONSTRAINT; the same claim_number from a different carrier is fine."
        test_recipe:
          setup:
            - "Logical clock at 2026-09-01T00:00:00Z; ExchangeRule defaults. Carrier B5 ACTIVE with claim DUP-1 accepted; carrier B6 registered; consumer Ida exists."
          setup_api_calls:
            - *k_clock
            - *k_rules
            - &k_carrier_b5
              call: "POST /carriers"
              payload: { legal_name: "Burnet General", naic_code: "90015" }
              as: PlatformAdmin
              captures: { cb5_id: $.data.id }
            - &k_carrier_b6
              call: "POST /carriers"
              payload: { legal_name: "Bastrop National", naic_code: "90016" }
              as: PlatformAdmin
              captures: { cb6_id: $.data.id }
            - &k_consumer_ida
              call: "POST /consumers"
              payload: { full_name: "Ida Innes", date_of_birth: "1985-11-11", address_line: "3 Iris St, Austin TX", driver_license_number: "IDA-1" }
              as: PlatformAdmin
              captures: { cida_id: $.data.id }
            - call: "POST /carriers/${cb5_id}/batches"
              payload:
                claims:
                  - { consumer_id: "${cida_id}", policy_number: "PI-5", claim_number: "DUP-1", loss_date: "2025-01-20", loss_type: "OTHER", cause_of_loss_code: "II1", paid_amount_cents: 4000, claim_status_code: "CLOSED_WITH_PAYMENT", vehicle_identifier: "" }
              as: CarrierDataSteward
              as_user_id: "${cb5_id}"
          trigger:
            - call: "POST /carriers/${cb5_id}/batches"
              payload:
                claims:
                  - { consumer_id: "${cida_id}", policy_number: "PI-5", claim_number: "DUP-1", loss_date: "2025-02-20", loss_type: "OTHER", cause_of_loss_code: "II2", paid_amount_cents: 5000, claim_status_code: "CLOSED_WITH_PAYMENT", vehicle_identifier: "" }
              as: CarrierDataSteward
              as_user_id: "${cb5_id}"
              captures: { dup_err: $.data.error_id }
            - call: "POST /carriers/${cb6_id}/batches"
              payload:
                claims:
                  - { consumer_id: "${cida_id}", policy_number: "PI-6", claim_number: "DUP-1", loss_date: "2025-02-20", loss_type: "OTHER", cause_of_loss_code: "II2", paid_amount_cents: 5000, claim_status_code: "CLOSED_WITH_PAYMENT", vehicle_identifier: "" }
              as: CarrierDataSteward
              as_user_id: "${cb6_id}"
              captures: { b6_batch: $.data.id }
          assert:
            - "the same-carrier duplicate returns 422 with dup_err == ERR_BATCH_CONSTRAINT"
            - "the cross-carrier reuse succeeds: ContributionBatch.${b6_batch}.status == COMPLETED"

      - name: dispute_against_withdrawn_claim_returns_invalid_state
        claim_type: Violation → Error
        grounds:
          - validations.priority_5_state
          - state_machines.LossClaim
          - errors.ERR_INVALID_STATE
        distinguishing_aspect: "Disputes may only target ACTIVE claims; a claim resolved DELETED in a prior dispute is WITHDRAWN and a fresh dispute against it fails 409 ERR_INVALID_STATE (not ERR_DISPUTE_ALREADY_OPEN — the prior dispute is resolved)."
        test_recipe:
          setup:
            - "Logical clock at 2026-09-01T00:00:00Z; ExchangeRule defaults. Carrier B7 ACTIVE; consumer Jay with 1 claim; dispute filed and resolved DELETED."
          setup_api_calls:
            - *k_clock
            - *k_rules
            - &k_carrier_b7
              call: "POST /carriers"
              payload: { legal_name: "Bell County Mutual", naic_code: "90017" }
              as: PlatformAdmin
              captures: { cb7_id: $.data.id }
            - &k_consumer_jay
              call: "POST /consumers"
              payload: { full_name: "Jay Jarrell", date_of_birth: "1980-07-04", address_line: "12 Juniper Cv, Belton TX", driver_license_number: "JAY-1" }
              as: PlatformAdmin
              captures: { cjay_id: $.data.id, cjay_v: $.data.version }
            - call: "POST /carriers/${cb7_id}/batches"
              payload:
                claims:
                  - { consumer_id: "${cjay_id}", policy_number: "PJ-7", claim_number: "J7-1", loss_date: "2025-03-15", loss_type: "COLLISION", cause_of_loss_code: "JJ1", paid_amount_cents: 60000, claim_status_code: "CLOSED_WITH_PAYMENT", vehicle_identifier: "" }
              as: CarrierDataSteward
              as_user_id: "${cb7_id}"
            - call: "GET /consumers/${cjay_id}/claims"
              payload: { status: "ACTIVE" }
              as: ExchangeComplianceOfficer
              captures: { jay_claim: "$.data[0].id" }
            - call: "POST /consumers/${cjay_id}/disputes"
              payload: { loss_claim_id: "${jay_claim}", dispute_reason: "NOT_MY_CLAIM", dispute_statement: "Not mine", expected_consumer_version: "${cjay_v}" }
              as: Consumer
              as_user_id: "${cjay_id}"
              captures: { jay_disp: $.data.id, cjay_v1: $.data.version }
            - call: "POST /disputes/${jay_disp}/resolve"
              payload: { resolution_code: "DELETED", resolution_notes: "Confirmed wrong household" }
              as: ExchangeComplianceOfficer
          trigger:
            - call: "POST /consumers/${cjay_id}/disputes"
              payload: { loss_claim_id: "${jay_claim}", dispute_reason: "WRONG_AMOUNT", dispute_statement: "Still wrong", expected_consumer_version: "${cjay_v1}" }
              as: Consumer
              as_user_id: "${cjay_id}"
              captures: { error_id: $.data.error_id }
          assert:
            - "the response status is 409 and error_id == ERR_INVALID_STATE"
            - "error_id != ERR_DISPUTE_ALREADY_OPEN"

      - name: body_fk_checked_in_input_declaration_order
        claim_type: Priority Ordering
        grounds:
          - validations.priority_4_existence
          - endpoints.POST_/consumers/{consumerId}/disputes
          - errors.ERR_REFERENCED_NOT_FOUND
        distinguishing_aspect: "When both the path consumer and the body loss_claim_id are unknown, existence is validated path-first: the 404 from the path check wins over the body FK check."
        test_recipe:
          setup:
            - "Logical clock at 2026-09-01T00:00:00Z. One consumer QuinnX exists (its version is captured for the OCC field); the dispute targets a DIFFERENT, nonexistent path consumer and a nonexistent claim."
          setup_api_calls:
            - *k_clock
            - &k_consumer_qx
              call: "POST /consumers"
              payload: { full_name: "Quinn Xylon", date_of_birth: "1980-01-01", address_line: "1 Xenon St, Austin TX", driver_license_number: "QX-1" }
              as: PlatformAdmin
              captures: { cqx_id: $.data.id, cqx_v: $.data.version }
          trigger:
            - call: "POST /consumers/00000000-0000-4000-8000-0000000000aa/disputes"
              payload: { loss_claim_id: "00000000-0000-4000-8000-0000000000bb", dispute_reason: "OTHER", dispute_statement: "x", expected_consumer_version: "${cqx_v}" }
              as: Consumer
              as_user_id: "${cqx_id}"
              captures: { error_id: $.data.error_id }
          assert:
            - "the response status is 404 and error_id == ERR_NOT_FOUND — the path consumer is checked before the body loss_claim_id"
            - "error_id != ERR_REFERENCED_NOT_FOUND"

      - name: existence_beats_state_when_both_fail
        claim_type: Priority Ordering
        grounds:
          - validations.priority_3_existence
          - validations.priority_5_state
        distinguishing_aspect: "Sending an adverse-action notice whose id does not exist returns 404 ERR_NOT_FOUND; the never-reached state check on the report cannot mask it with ERR_INVALID_STATE."
        test_recipe:
          setup:
            - "Logical clock at 2026-09-01T00:00:00Z; ExchangeRule defaults. Carrier B4 exists."
          setup_api_calls:
            - *k_clock
            - *k_rules
