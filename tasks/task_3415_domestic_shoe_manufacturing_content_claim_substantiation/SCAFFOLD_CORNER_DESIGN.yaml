  # ===========================================================================
  - section: calculations
    instances:

      - name: fifo_consumption_respects_received_at_then_unit_cost
        claim_type: Correct Result
        grounds:
          - calculations.fifo_lot_consumption
          - entities.MaterialLot.fields.received_at
        distinguishing_aspect: "Two ordering rules pinned: (1) an earlier-received lot wins even at a HIGHER unit cost (lot A @500 received 2026-09-01 is consumed before lot B @300 received 2026-09-02); (2) on a received_at tie the cheaper lot wins (lot D @300 before lot C @700, both received 2026-09-03). Entity ids never participate."
        test_recipe:
          setup:
            - "Factory, thread component; lot A (10 @500) received 2026-09-01, lot B (10 @300) received 2026-09-02; model MFIFO1; week 2026-W36 allocation; STOCK run of 3."
            - "Then at clock 2026-09-03: UPPER-component lots C (10 @700) and D (10 @300) — the earlier thread lots are ineligible for model MFIFO2; week 2026-W37 allocation; STOCK run of 2."
          setup_api_calls:
            - *k_clk
            - *k_fac
            - *k_comp_t
            - &k_lot_fa
              call: "POST /footwear/lots"
              payload: { component_id: "${c_t}", supplier_name: "Fall River Mills", is_domestic: true, quantity_received: 10, unit_cost_cents: 500 }
              as: SourcingManager
              captures: { l_fa: $.data.id }
            - &k_clk2
              call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-09-02T00:00:00Z" }
              as: PlatformAdmin
            - &k_lot_fb
              call: "POST /footwear/lots"
              payload: { component_id: "${c_t}", supplier_name: "Fall River Mills", is_domestic: true, quantity_received: 10, unit_cost_cents: 300 }
              as: SourcingManager
              captures: { l_fb: $.data.id }
            - &k_model_fifo1
              call: "POST /footwear/models"
              payload: { style_code: "MFIFO1", production_policy: "DUAL_SOURCE", base_price_cents: 5000, import_cost_basis_cents: 2000, bom_lines: [ { component_id: "${c_t}", quantity_per_pair: 1.0, sourcing_requirement: "IMPORT_ALLOWED", planned_unit_cost_cents: 100, planned_is_domestic: false } ], standard_stitching_minutes: 0, standard_lasting_minutes: 0, standard_assembly_minutes: 0 }
              as: SourcingManager
              captures: { m_f1: $.data.id }
            - *k_alloc
            - &k_run_fifo1
              call: "POST /footwear/production-runs"
              payload: { model_id: "${m_f1}", factory_id: "${f_id}", run_type: "STOCK", planned_units: 3, line_index: 1, start_day: "2026-09-07", end_day: "2026-09-11", iso_week: "2026-W36" }
              as: ProductionPlanner
              captures: { r_f1: $.data.id }
            - *k_lock
            - &k_reserve_fifo1
              call: "POST /footwear/production-runs/${r_f1}/reserve-materials"
              payload: {}
              as: ProductionPlanner
