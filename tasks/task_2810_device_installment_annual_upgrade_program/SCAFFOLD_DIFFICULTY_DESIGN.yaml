  # ===========================================================================
  - rule_id: cross_entity_state_dependency
    instances:
      - name: upgrade_request_requires_device_unit_activated
        grounds:
          - validations.priority_62_ERR_DEVICE_NOT_ACTIVATED
          - state_machines.DeviceUnit.activation_status
          - state_machines.UpgradeRequest.null_to_ELIGIBILITY_PASSED
          - entities.DeviceUnit.fields.activation_status
          - endpoints.POST_/upgrade-requests
        distinguishing_aspect: |
          Entity pair (UpgradeRequest, DeviceUnit): whether an UpgradeRequest may be created
          depends on a state dimension of a THIRD entity that the request never names in its
          payload — the DeviceUnit minted by POST /loans, reachable only through
          DeviceUnit.loan_id. Every property of the loan itself is perfect (12 of 24 PAID,
          delinquency CURRENT, window open on 2027-06-27, target capacity free), so the only
          possible cause of rejection is the handset's activation_status being UNACTIVATED;
          activating it with no other change must flip the identical request from 409 to 201.
          An implementation that validates only the loan and the target model accepts the
          first call.
        test_recipe:
          setup:
            - "PRIME customer with an ACTIVE Handset B loan originated 2026-08-01 and 12 installments PAID (PAYMENT 56940); the loan's DeviceUnit is still UNACTIVATED / LOCKED / WITH_CUSTOMER and no CarrierAccount has been registered."
