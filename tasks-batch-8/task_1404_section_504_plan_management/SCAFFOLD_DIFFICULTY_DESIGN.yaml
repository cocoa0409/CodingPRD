              as: Section504Coordinator
              as_user_id: "${co_id}"
              captures: { plan1_id: $.data.id }
            - call: "POST /accommodations"
              payload: { plan_id: "${plan1_id}", accommodation_type: "EXTENDED_TIME", description: "X", applies_to_testing: false }
