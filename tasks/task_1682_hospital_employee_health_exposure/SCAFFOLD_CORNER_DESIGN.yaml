  - section: calculations
    instances:
      - name: titer_threshold_inclusive_boundary
        claim_type: constants_applied
        grounds: ["calculations.immunity_interpretation"]
        distinguishing_aspect: "HEP_B quantitative threshold 10.0 is INCLUSIVE: 10.0 -> IMMUNE, 9.99 -> NON_IMMUNE."
        test_recipe:
          setup: ["Employee exists"]
          setup_api_calls:
            - call: "POST /employee-health/employees"
              payload: { employee_ref: "E-CL1", full_name: "Thresh Old", job_category: "NURSE", department: "ICU", hire_date: "2025-01-05T00:00:00Z", requires_respirator: false }
              as: EmployeeHealthNurse
              captures: { emp_id: $.data.id }
          trigger:
            - call: "POST /employee-health/employees/${emp_id}/titer-results"
              payload: { disease: "HEP_B", assay_type: "QUANTITATIVE", numeric_value: 10.0, resulted_at: "2026-07-22T09:00:00Z" }
              as: EmployeeHealthNurse
              captures: { at_thresh: $.data.immunity_status }
            - call: "POST /employee-health/employees/${emp_id}/titer-results"
              payload: { disease: "HEP_B", assay_type: "QUANTITATIVE", numeric_value: 9.99, resulted_at: "2026-07-22T10:00:00Z" }
              as: EmployeeHealthNurse
              captures: { below_thresh: $.data.immunity_status }
          assert:
            - "${at_thresh} == IMMUNE (numeric_value == threshold is INCLUSIVE)"
            - "${below_thresh} == NON_IMMUNE (9.99 < 10.0)"

      - name: serology_schedule_dates_literal
        claim_type: correct_result
