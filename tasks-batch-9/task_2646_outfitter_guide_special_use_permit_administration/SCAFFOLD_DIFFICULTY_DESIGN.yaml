          equal the sum of authorized_client_capacity over the permit's AUTHORIZED authorizations, and
          nothing else. A third distinct conserved quantity, and the only one recomputed as a FRESH
          SUM rather than adjusted incrementally: revoked rows keep their frozen capacity for the
          audit record, so an implementation that decrements on revoke and increments on
