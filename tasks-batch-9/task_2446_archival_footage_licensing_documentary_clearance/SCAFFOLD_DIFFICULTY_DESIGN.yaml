# =============================================================================
# §1.8 Scaffold Difficulty Design — Test Targeting Index
# Task 2446 · Archival Footage Licensing & Documentary Clearance
# Nine §0.5 Difficulty Rules × 2 differentiated instances each = 18 instances.
# Every instance grounds exclusively in SCAFFOLD.yaml §1.1–§1.7.
# =============================================================================
scaffold_difficulty_design:

  - rule_id: dual_variant_calc
    instances:

      - name: license_fee_festival_versus_all_media_window_variant
        grounds:
          - calculations.license_rate_card_fee_cents
          - entities.License.fields.window_class
          - entities.License.fields.rate_card_fee_cents
          - entities.RateCard.fields.festival_window_multiplier
          - entities.RateCard.fields.all_media_window_multiplier
          - entities.RateCard.fields.festival_minimum_fee_cents
          - entities.RateCard.fields.minimum_fee_cents
        distinguishing_aspect: |
          This instance's variant switch is License.window_class on the MONEY path: the two
          variants differ in BOTH a multiplier (0.35 vs 1.00) and the fee floor they compare
          against (festival_minimum_fee_cents vs minimum_fee_cents), so two licences with
          byte-identical duration, media, territory and term diverge by 235462 cents.
        test_recipe:
          setup:
            - "A production 'Reel Histories' in status CLEARANCE."
            - "An ACTIVE archive 'Pathe Vault' with one ACTIVE rate card: base 60000 cents / 30s, all-media floor 150000, festival floor 40000, every multiplier left at its declared default."
            - "Two ARCHIVAL_FOOTAGE assets, each exactly 45 seconds long (billable_units 2, duration tier 2), each with one AVAILABLE source candidate at Pathe Vault already SELECTED."
          setup_api_calls:
            - call: "POST /productions"
              payload: { title: "Reel Histories", delivery_deadline_date: "2027-06-30" }
              as: ProductionAdmin
              captures: { prod_id: $.data.id }
            - call: "POST /productions/${prod_id}/state"
              payload: { to_status: "CLEARANCE" }
              as: ProductionAdmin
            - call: "POST /archives"
              payload: { name: "Pathe Vault", holder_type: "FILM_ARCHIVE" }
              as: ArchiveResearcher
              captures: { arch_id: $.data.id }
            - call: "POST /archives/${arch_id}/rate-cards"
              payload: { base_rate_per_30s_cents: 60000, minimum_fee_cents: 150000, festival_minimum_fee_cents: 40000, effective_from_date: "2026-01-01" }
              as: ArchiveResearcher
              captures: { rc_id: $.data.id }
            - call: "POST /productions/${prod_id}/assets"
              payload: { asset_type: "ARCHIVAL_FOOTAGE", title: "Bus boycott exterior", timecode_in_seconds: 0, timecode_out_seconds: 45, usage_purpose: "CRITICAL_COMMENTARY" }
              as: ArchiveResearcher
              captures: { asset_a_id: $.data.id }
            - call: "POST /assets/${asset_a_id}/source-candidates"
              payload: { archive_id: "${arch_id}", availability_status: "AVAILABLE" }
              as: ArchiveResearcher
              captures: { cand_a_id: $.data.id }
            - call: "POST /assets/${asset_a_id}/select-source"
              payload: { source_candidate_id: "${cand_a_id}" }
              as: ArchiveResearcher
            - call: "POST /productions/${prod_id}/assets"
              payload: { asset_type: "ARCHIVAL_FOOTAGE", title: "Courthouse steps", timecode_in_seconds: 100, timecode_out_seconds: 145, usage_purpose: "CRITICAL_COMMENTARY" }
              as: ArchiveResearcher
              captures: { asset_b_id: $.data.id }
            - call: "POST /assets/${asset_b_id}/source-candidates"
              payload: { archive_id: "${arch_id}", availability_status: "AVAILABLE" }
              as: ArchiveResearcher
              captures: { cand_b_id: $.data.id }
            - call: "POST /assets/${asset_b_id}/select-source"
              payload: { source_candidate_id: "${cand_b_id}" }
              as: ArchiveResearcher
          trigger:
            - call: "POST /licenses"
              payload: { production_id: "${prod_id}", asset_id: "${asset_a_id}", archive_id: "${arch_id}", rights_leg: "FOOTAGE", media: "BROADCAST", territory: "WORLD", window_class: "ALL_MEDIA_WINDOW", term_months: 36, term_start_date: "2026-08-15", term_end_date: "2029-08-15" }
              as: ClearanceSupervisor
              captures: { lic_all_media_id: $.data.id, fee_all_media: $.data.rate_card_fee_cents }
            - call: "POST /licenses"
              payload: { production_id: "${prod_id}", asset_id: "${asset_b_id}", archive_id: "${arch_id}", rights_leg: "FOOTAGE", media: "BROADCAST", territory: "WORLD", window_class: "FESTIVAL_ONLY", term_months: 36, term_start_date: "2026-08-15", term_end_date: "2029-08-15" }
              as: ClearanceSupervisor
              captures: { lic_festival_id: $.data.id, fee_festival: $.data.rate_card_fee_cents }
          assert:
            - "License.${lic_all_media_id}.billable_units == 2 and License.${lic_festival_id}.billable_units == 2"
            - "License.${lic_all_media_id}.rate_card_fee_cents == 362250"
            - "License.${lic_festival_id}.rate_card_fee_cents == 126788"
            - "the divergence between the two variants is exactly 235462 cents on otherwise identical inputs"
            - "License.${lic_festival_id}.rate_card_fee_cents was rounded ONCE from the full-precision product 126787.5, not accumulated from pre-rounded factors"
            - "both licences have rate_card_fee_cents above their respective floors, so neither result is the floor value 150000 or 40000"

      - name: fair_use_weighting_variant_divergence_on_identical_factors
        grounds:
          - calculations.fair_use_strength_score
          - entities.Asset.fields.usage_purpose
          - entities.FairUseAnalysis.fields.weighting_variant
          - entities.FairUseAnalysis.fields.strength_score
          - validations[priority=42]
          - state_machines.FairUseAnalysis.SUBMITTED_to_ACCEPTED
        distinguishing_aspect: |
          A different entity domain and a different selector from the fee instance: the variant is
          chosen from the PARENT Asset's usage_purpose (never from the request body), it re-weights
          four factors rather than switching a multiplier and a floor, and the divergence flips a
          BUSINESS OUTCOME (0.6750 accepts, 0.5700 is refused with ERR_FAIR_USE_SCORE_INSUFFICIENT)
          rather than only a money amount.
        test_recipe:
          setup:
            - "A production in status CLEARANCE."
            - "Two ARCHIVAL_FOOTAGE assets with no licences at all: asset C with usage_purpose CRITICAL_COMMENTARY, asset D with usage_purpose ILLUSTRATIVE_BACKGROUND."
            - "Each asset carries one SUBMITTED FairUseAnalysis with the identical factor vector (90, 60, 40, 50) and one ISSUED OpinionLetter, so the priority-22 opinion-letter gate is already satisfied and only the priority-42 score gate can fire."
          setup_api_calls:
            - call: "POST /productions"
              payload: { title: "Grain and Memory", delivery_deadline_date: "2027-09-30" }
              as: ProductionAdmin
              captures: { prod_id: $.data.id }
            - call: "POST /productions/${prod_id}/state"
              payload: { to_status: "CLEARANCE" }
              as: ProductionAdmin
            - call: "POST /productions/${prod_id}/assets"
              payload: { asset_type: "ARCHIVAL_FOOTAGE", title: "Newsreel excerpt under critique", timecode_in_seconds: 0, timecode_out_seconds: 20, usage_purpose: "CRITICAL_COMMENTARY" }
              as: ArchiveResearcher
              captures: { asset_c_id: $.data.id }
            - call: "POST /productions/${prod_id}/assets"
              payload: { asset_type: "ARCHIVAL_FOOTAGE", title: "Newsreel excerpt as wallpaper", timecode_in_seconds: 0, timecode_out_seconds: 20, usage_purpose: "ILLUSTRATIVE_BACKGROUND" }
              as: ArchiveResearcher
              captures: { asset_d_id: $.data.id }
            - call: "POST /assets/${asset_c_id}/fair-use-analyses"
              payload: { transformative_score: 90, nature_score: 60, amount_used_score: 40, market_harm_score: 50 }
              as: LegalCounsel
              as_user_id: "counsel-alpha"
              captures: { fu_c_id: $.data.id, variant_c: $.data.weighting_variant, score_c: $.data.strength_score }
            - call: "POST /assets/${asset_d_id}/fair-use-analyses"
              payload: { transformative_score: 90, nature_score: 60, amount_used_score: 40, market_harm_score: 50 }
              as: LegalCounsel
              as_user_id: "counsel-alpha"
              captures: { fu_d_id: $.data.id, variant_d: $.data.weighting_variant, score_d: $.data.strength_score }
            - call: "POST /fair-use-analyses/${fu_c_id}/state"
              payload: { to_status: "SUBMITTED" }
              as: LegalCounsel
              as_user_id: "counsel-alpha"
            - call: "POST /fair-use-analyses/${fu_d_id}/state"
              payload: { to_status: "SUBMITTED" }
              as: LegalCounsel
              as_user_id: "counsel-alpha"
            - call: "POST /fair-use-analyses/${fu_c_id}/opinion-letters"
              payload: { counsel_firm: "Donaldson & Callif", letter_reference: "OL-C-1", risk_rating: "LOW" }
              as: LegalCounsel
              as_user_id: "counsel-alpha"
              captures: { ol_c_id: $.data.id }
            - call: "POST /opinion-letters/${ol_c_id}/state"
              payload: { to_status: "ISSUED" }
              as: LegalCounsel
              as_user_id: "counsel-alpha"
            - call: "POST /fair-use-analyses/${fu_d_id}/opinion-letters"
              payload: { counsel_firm: "Donaldson & Callif", letter_reference: "OL-D-1", risk_rating: "MODERATE" }
              as: LegalCounsel
              as_user_id: "counsel-alpha"
              captures: { ol_d_id: $.data.id }
            - call: "POST /opinion-letters/${ol_d_id}/state"
              payload: { to_status: "ISSUED" }
              as: LegalCounsel
              as_user_id: "counsel-alpha"
          trigger:
            - call: "POST /fair-use-analyses/${fu_c_id}/state"
              payload: { to_status: "ACCEPTED", decision_rationale: "Transformative critique" }
              as: LegalCounsel
              as_user_id: "counsel-alpha"
            - call: "POST /fair-use-analyses/${fu_d_id}/state"
              payload: { to_status: "ACCEPTED", decision_rationale: "Attempted on identical factors" }
              as: LegalCounsel
              as_user_id: "counsel-alpha"
          assert:
            - "FairUseAnalysis.${fu_c_id}.weighting_variant == TRANSFORMATIVE_WEIGHTED and FairUseAnalysis.${fu_d_id}.weighting_variant == MARKET_HARM_WEIGHTED"
            - "FairUseAnalysis.${fu_c_id}.strength_score == 0.6750"
            - "FairUseAnalysis.${fu_d_id}.strength_score == 0.5700"
            - "the first trigger call returns 200 and FairUseAnalysis.${fu_c_id}.status == ACCEPTED"
            - "the second trigger call returns 422 with error_id ERR_FAIR_USE_SCORE_INSUFFICIENT and FairUseAnalysis.${fu_d_id}.status remains SUBMITTED"
            - "Asset.${asset_c_id}.rights_basis == FAIR_USE and Asset.${asset_c_id}.licensing_status == CLEARED"
            - "Asset.${asset_d_id}.rights_basis == UNDETERMINED and Asset.${asset_d_id}.licensing_status == UNCLEARED"
            - "Production.${prod_id}.cleared_asset_count == 1 and Production.${prod_id}.open_asset_count == 1"

  - rule_id: combinatorial_formula
    instances:

      - name: license_fee_six_factor_product_rounds_once_at_the_end
        grounds:
          - calculations.license_rate_card_fee_cents
          - entities.RateCard.fields.tier2_rate_multiplier
          - entities.RateCard.fields.media_multiplier_streaming
          - entities.RateCard.fields.territory_multiplier_world
          - entities.RateCard.fields.term_multiplier_per_year
          - entities.RateCard.fields.festival_window_multiplier
          - entities.License.fields.billable_units
        distinguishing_aspect: |
          §0.5 mode (a) — six independent inputs (billable_units, duration tier, media, territory,
          term-year uplift, window class) are multiplied into ONE fee with a single terminal
          round_half_up. Pinned with an odd base rate (33333) so the honest order yields 68249
          while the forbidden round-after-each-factor order yields 68250: a one-cent oracle that
          only a correct rounding ORDER can hit.
        test_recipe:
          setup:
            - "A production in status CLEARANCE."
            - "An ACTIVE archive with one ACTIVE rate card whose base_rate_per_30s_cents is the odd value 33333 and whose floors are both 1000 (so no floor can mask the arithmetic); every multiplier is left at its declared default."
            - "One 45-second ARCHIVAL_FOOTAGE asset (billable_units 2, duration tier 2) with an AVAILABLE candidate at that archive already SELECTED."
          setup_api_calls:
            - call: "POST /productions"
              payload: { title: "Odd Rate Study", delivery_deadline_date: "2028-01-31" }
              as: ProductionAdmin
              captures: { prod_id: $.data.id }
            - call: "POST /productions/${prod_id}/state"
              payload: { to_status: "CLEARANCE" }
              as: ProductionAdmin
            - call: "POST /archives"
              payload: { name: "Kinolibrary", holder_type: "NEWS_ARCHIVE" }
              as: ArchiveResearcher
              captures: { arch_id: $.data.id }
            - call: "POST /archives/${arch_id}/rate-cards"
              payload: { base_rate_per_30s_cents: 33333, minimum_fee_cents: 1000, festival_minimum_fee_cents: 1000, effective_from_date: "2026-01-01" }
              as: ArchiveResearcher
              captures: { rc_id: $.data.id }
            - call: "POST /productions/${prod_id}/assets"
              payload: { asset_type: "ARCHIVAL_FOOTAGE", title: "Dockyard strike", timecode_in_seconds: 5, timecode_out_seconds: 50, usage_purpose: "CRITICAL_COMMENTARY" }
              as: ArchiveResearcher
              captures: { asset_id: $.data.id }
            - call: "POST /assets/${asset_id}/source-candidates"
              payload: { archive_id: "${arch_id}", availability_status: "AVAILABLE", provenance_confidence: 80 }
              as: ArchiveResearcher
              captures: { cand_id: $.data.id }
            - call: "POST /assets/${asset_id}/select-source"
              payload: { source_candidate_id: "${cand_id}" }
              as: ArchiveResearcher
          trigger:
            - call: "POST /licenses"
              payload: { production_id: "${prod_id}", asset_id: "${asset_id}", archive_id: "${arch_id}", rights_leg: "FOOTAGE", media: "STREAMING", territory: "WORLD", window_class: "FESTIVAL_ONLY", term_months: 18, term_start_date: "2026-09-01", term_end_date: "2028-03-01" }
              as: ClearanceSupervisor
              captures: { lic_id: $.data.id, fee: $.data.rate_card_fee_cents }
          assert:
            - "Asset.${asset_id}.duration_seconds == 45"
            - "License.${lic_id}.billable_units == 2"
            - "License.${lic_id}.rate_card_fee_cents == 68249"
            - "License.${lic_id}.rate_card_fee_cents != 68250 (the value produced by rounding after each factor)"
            - "License.${lic_id}.current_proposed_fee_cents == 68249 at creation"
            - "License.${lic_id}.status == DRAFT"

      - name: eo_premium_rounds_per_asset_then_sums
        grounds:
          - calculations.eo_premium_cents
          - entities.EOApplication.fields.premium_cents
          - entities.EOApplication.fields.coverage_limit_cents
          - entities.EOApplication.fields.retention_cents
          - entities.ClearanceChart.fields.pinned_rows
          - state_machines.EOApplication.DRAFT_to_SUBMITTED
        distinguishing_aspect: |
          §0.5 mode (b) — NESTED ROUNDING whose ORDER changes the answer, a different
          combinatorial failure mode from the flat product above: the per-asset loading is
          round_half_up'd BEFORE the sum (two loadings of 10000.4 become 10000 + 10000 = 20000,
          not round(20000.8) = 20001), so the correct premium is 26501 and the sum-then-round
          order gives 26502.
        test_recipe:
          setup:
            - "A production in status CLEARANCE with TWO 45-second ARCHIVAL_FOOTAGE assets, each with a SELECTED AVAILABLE candidate, each carrying one EXECUTED FOOTAGE licence, so both assets are rights_basis LICENSED / licensing_status CLEARED and posture is OPEN."
            - "One PINNED ClearanceChart with pinned_row_count 2, both rows LICENSED and depiction_status NOT_REQUIRED (no depiction surcharge)."
            - "One DRAFT EOApplication against that chart with coverage_limit_cents 1000040 and retention_cents 20000."
          setup_api_calls:
            - call: "POST /productions"
              payload: { title: "Two Reels", delivery_deadline_date: "2027-12-31" }
              as: ProductionAdmin
              captures: { prod_id: $.data.id }
            - call: "POST /productions/${prod_id}/state"
              payload: { to_status: "CLEARANCE" }
              as: ProductionAdmin
            - call: "POST /archives"
              payload: { name: "Pathe Vault", holder_type: "FILM_ARCHIVE" }
              as: ArchiveResearcher
              captures: { arch_id: $.data.id }
            - call: "POST /archives/${arch_id}/rate-cards"
              payload: { base_rate_per_30s_cents: 60000, minimum_fee_cents: 150000, festival_minimum_fee_cents: 40000, effective_from_date: "2026-01-01" }
              as: ArchiveResearcher
              captures: { rc_id: $.data.id }
            - call: "POST /productions/${prod_id}/assets"
              payload: { asset_type: "ARCHIVAL_FOOTAGE", title: "Reel one", timecode_in_seconds: 0, timecode_out_seconds: 45, usage_purpose: "CRITICAL_COMMENTARY" }
              as: ArchiveResearcher
              captures: { asset_a_id: $.data.id }
            - call: "POST /assets/${asset_a_id}/source-candidates"
              payload: { archive_id: "${arch_id}", availability_status: "AVAILABLE" }
              as: ArchiveResearcher
              captures: { cand_a_id: $.data.id }
            - call: "POST /assets/${asset_a_id}/select-source"
              payload: { source_candidate_id: "${cand_a_id}" }
              as: ArchiveResearcher
            - call: "POST /licenses"
              payload: { production_id: "${prod_id}", asset_id: "${asset_a_id}", archive_id: "${arch_id}", rights_leg: "FOOTAGE", media: "BROADCAST", territory: "WORLD", window_class: "ALL_MEDIA_WINDOW", term_months: 36, term_start_date: "2026-08-15", term_end_date: "2029-08-15" }
              as: ClearanceSupervisor
              captures: { lic_a_id: $.data.id, lic_a_v: $.data.version }
            - call: "POST /licenses/${lic_a_id}/negotiation-rounds"
              payload: { party: "LICENSOR", proposed_fee_cents: 362250, expected_license_version: "${lic_a_v}" }
              as: RightsHolderRep
              as_user_id: "${arch_id}"
            - call: "POST /licenses/${lic_a_id}/state"
              payload: { to_status: "EXECUTED" }
              as: ClearanceSupervisor
            - call: "POST /productions/${prod_id}/assets"
              payload: { asset_type: "ARCHIVAL_FOOTAGE", title: "Reel two", timecode_in_seconds: 0, timecode_out_seconds: 45, usage_purpose: "CRITICAL_COMMENTARY" }
              as: ArchiveResearcher
              captures: { asset_b_id: $.data.id }
            - call: "POST /assets/${asset_b_id}/source-candidates"
              payload: { archive_id: "${arch_id}", availability_status: "AVAILABLE" }
              as: ArchiveResearcher
              captures: { cand_b_id: $.data.id }
            - call: "POST /assets/${asset_b_id}/select-source"
              payload: { source_candidate_id: "${cand_b_id}" }
              as: ArchiveResearcher
            - call: "POST /licenses"
              payload: { production_id: "${prod_id}", asset_id: "${asset_b_id}", archive_id: "${arch_id}", rights_leg: "FOOTAGE", media: "BROADCAST", territory: "WORLD", window_class: "ALL_MEDIA_WINDOW", term_months: 36, term_start_date: "2026-08-15", term_end_date: "2029-08-15" }
              as: ClearanceSupervisor
              captures: { lic_b_id: $.data.id, lic_b_v: $.data.version }
            - call: "POST /licenses/${lic_b_id}/negotiation-rounds"
              payload: { party: "LICENSOR", proposed_fee_cents: 362250, expected_license_version: "${lic_b_v}" }
              as: RightsHolderRep
              as_user_id: "${arch_id}"
            - call: "POST /licenses/${lic_b_id}/state"
              payload: { to_status: "EXECUTED" }
              as: ClearanceSupervisor
            - call: "GET /productions/${prod_id}"
              payload: {}
              as: ClearanceSupervisor
              captures: { prod_v: $.data.version }
            - call: "POST /productions/${prod_id}/clearance-charts"
              payload: { chart_label: "v1 pre-E&O", expected_production_version: "${prod_v}" }
              as: ClearanceSupervisor
              captures: { chart_id: $.data.id }
            - call: "POST /productions/${prod_id}/eo-applications"
              payload: { clearance_chart_id: "${chart_id}", coverage_limit_cents: 1000040, retention_cents: 20000 }
              as: ProductionAdmin
              captures: { eo_id: $.data.id }
          trigger:
            - call: "POST /eo-applications/${eo_id}/state"
              payload: { to_status: "SUBMITTED" }
              as: ProductionAdmin
              captures: { premium: $.data.premium_cents }
          assert:
            - "ClearanceChart.${chart_id}.pinned_row_count == 2 and ClearanceChart.${chart_id}.music_leg_gap_count == 0"
            - "EOApplication.${eo_id}.premium_cents == 26501"
            - "EOApplication.${eo_id}.premium_cents != 26502 (the value produced by summing un-rounded loadings and rounding once)"
            - "the 26501 decomposes as base 12501 (round_half_up of 12500.5) + loading 20000 (10000 + 10000) - retention credit 6000"
            - "EOApplication.${eo_id}.status == IN_REVIEW is NOT yet true — status == SUBMITTED with legal_review_status PENDING and underwriting_review_status PENDING"
            - "Production.${prod_id}.committed_fee_cents == 724500 (two executed licences at 362250)"

  - rule_id: non_linear_state_machine
    instances:

      - name: license_negotiation_cycle_revisits_quoted_and_caps_at_six_rounds
        grounds:
          - state_machines.License.DRAFT_to_QUOTED
          - state_machines.License.QUOTED_to_COUNTERED
          - state_machines.License.COUNTERED_to_QUOTED
          - validations[priority=34]
          - entities.License.fields.round_count
          - entities.NegotiationRound.fields.license_status_after
          - entities.NegotiationRound.fields.license_version_after
        distinguishing_aspect: |
          A true CYCLE with a termination counter: QUOTED -> COUNTERED -> QUOTED is re-entered
          three times on one licence, so status alone cannot tell a test how far the negotiation
          has gone — only the monotonic round_count can — and the loop is bounded at six rounds
          by ERR_NEGOTIATION_ROUND_LIMIT rather than by any state.
        test_recipe:
          setup:
            - "A production in status CLEARANCE, an ACTIVE archive with an ACTIVE rate card, one 45-second asset with a SELECTED AVAILABLE candidate."
            - "One DRAFT licence on that asset (round_count 0, version 1, rate_card_fee_cents 362250)."
          setup_api_calls:
            - call: "POST /productions"
              payload: { title: "Six Rounds", delivery_deadline_date: "2027-11-30" }
              as: ProductionAdmin
              captures: { prod_id: $.data.id }
            - call: "POST /productions/${prod_id}/state"
              payload: { to_status: "CLEARANCE" }
              as: ProductionAdmin
            - call: "POST /archives"
              payload: { name: "Pathe Vault", holder_type: "FILM_ARCHIVE" }
              as: ArchiveResearcher
              captures: { arch_id: $.data.id }
            - call: "POST /archives/${arch_id}/rate-cards"
              payload: { base_rate_per_30s_cents: 60000, minimum_fee_cents: 150000, festival_minimum_fee_cents: 40000, effective_from_date: "2026-01-01" }
              as: ArchiveResearcher
              captures: { rc_id: $.data.id }
            - call: "POST /productions/${prod_id}/assets"
              payload: { asset_type: "ARCHIVAL_FOOTAGE", title: "Haggling reel", timecode_in_seconds: 0, timecode_out_seconds: 45, usage_purpose: "CRITICAL_COMMENTARY" }
              as: ArchiveResearcher
              captures: { asset_id: $.data.id }
            - call: "POST /assets/${asset_id}/source-candidates"
              payload: { archive_id: "${arch_id}", availability_status: "AVAILABLE" }
              as: ArchiveResearcher
              captures: { cand_id: $.data.id }
            - call: "POST /assets/${asset_id}/select-source"
              payload: { source_candidate_id: "${cand_id}" }
              as: ArchiveResearcher
            - call: "POST /licenses"
              payload: { production_id: "${prod_id}", asset_id: "${asset_id}", archive_id: "${arch_id}", rights_leg: "FOOTAGE", media: "BROADCAST", territory: "WORLD", window_class: "ALL_MEDIA_WINDOW", term_months: 36, term_start_date: "2026-08-15", term_end_date: "2029-08-15" }
              as: ClearanceSupervisor
              captures: { lic_id: $.data.id, v1: $.data.version }
          trigger:
            - call: "POST /licenses/${lic_id}/negotiation-rounds"
              payload: { party: "LICENSOR", proposed_fee_cents: 500000, expected_license_version: "${v1}" }
              as: RightsHolderRep
