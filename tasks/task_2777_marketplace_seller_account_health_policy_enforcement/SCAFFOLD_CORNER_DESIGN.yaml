      - name: endpoint_detected_registration_link_is_readable_by_id
        claim_type: cross_reference_link
        grounds:
          - "endpoints[GET /related-account-links]"
          - "endpoints[GET /related-account-links/{id}]"
          - "endpoints[POST /sellers].side_effects"
        distinguishing_aspect: |
          A link row is never created by a client call — it is minted as a side effect of registration —
          so the only way to observe it is the pair of link reads, and they must be reachable from
          BOTH sides of the pair through candidate_seller_id and matched_seller_id. A single shared
          tax id scores exactly RELATED_LINK_MIN_SCORE, which mints the row while staying below the
          watch score, so the link exists with both sellers left in a clean posture.
        test_recipe:
          setup:
            - "Clock at 2026-08-01T00:00:00.000Z."
            - "Seller A registers first with tax_id_hash TAX-SHARED-9; seller B reuses only that tax id and differs in bank token, address fingerprint and email domain."
            - "SIGNAL_WEIGHT TAX_ID 0.35 alone == RELATED_LINK_MIN_SCORE 0.35, so exactly one link is minted and, being below RELATED_LINK_WATCH_SCORE 0.60 against an ACTIVE incumbent, it leaves registration_risk_flag false."
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-08-01T00:00:00.000Z" }
              as: ComplianceOfficer
              as_user_id: "co-1"
            - call: "POST /sellers"
              payload: { legal_name: "Harbor Tools LLC", email: "ops@harbor-tools.example", tax_id_hash: "TAX-SHARED-9", payout_bank_token: "BANK-HT-0001", address_fingerprint: "ADDR-HT-0001" }
              as: Anonymous
              captures: { s_a: $.data.id }
            - call: "POST /sellers"
              payload: { legal_name: "Delta Supply Co", email: "ops@delta-supply.example", tax_id_hash: "TAX-SHARED-9", payout_bank_token: "BANK-DS-0002", address_fingerprint: "ADDR-DS-0002" }
              as: Anonymous
              captures: { s_b: $.data.id, b_flag: $.data.registration_risk_flag, b_root: $.data.root_seller_id, b_enf: $.data.enforcement_state }
          trigger:
            - call: "GET /related-account-links"
              payload: { candidate_seller_id: "${s_b}" }
              as: PolicyInvestigator
              as_user_id: "inv-1"
              captures: { link_id: "$.data[0].id", link_score: "$.data[0].confidence_score", link_state: "$.data[0].state" }
            - call: "GET /related-account-links"
              payload: { matched_seller_id: "${s_a}" }
              as: ComplianceOfficer
              as_user_id: "co-1"
              captures: { link_from_other_side: "$.data[0].id" }
            - call: "GET /related-account-links/${link_id}"
              payload: {}
              as: ComplianceOfficer
              as_user_id: "co-1"
              captures: { read_candidate: $.data.candidate_seller_id, read_matched: $.data.matched_seller_id, read_score: $.data.confidence_score, read_state_at_detection: $.data.matched_seller_state_at_detection }
          assert:
            - "${b_flag} == false, ${b_root} == ${s_a} and ${b_enf} == ACTIVE"
            - "candidate-side list: total_count == 1, ${link_score} == 0.35 and ${link_state} == DETECTED"
            - "matched-side list: total_count == 1 and ${link_from_other_side} == ${link_id} — the same row from both directions"
            - "link by id: HTTP 200, ${read_candidate} == ${s_b}, ${read_matched} == ${s_a}, ${read_score} == 0.35"
            - "${read_state_at_detection} == ACTIVE and matched_signals == [TAX_ID] only"
            - "the reverse query candidate_seller_id == ${s_a} returns total_count 0 — links point from the newcomer to the incumbent"

  # =========================================================================
  # SECTION 6 — Errors (§1.6)
  # =========================================================================
  - section: errors
    instances:

      - name: error_every_path_and_body_reference_family_returns_its_own_not_found
        claim_type: every_error_triggerable
        grounds:
          - "validations[priority 30]"
          - "validations[priority 40]"
          - "errors[ERR_SELLER_NOT_FOUND .. ERR_LINK_NOT_FOUND]"
          - "errors[ERR_POLICY_RULE_NOT_FOUND]"
        distinguishing_aspect: |
          Ten distinct 404 codes exist and each is owned by exactly one reference family, so a single
          generic "not found" is wrong. Nine are path-segment codes at priority 30 and the tenth
          (ERR_POLICY_RULE_NOT_FOUND) can only surface through a request BODY at priority 40, which
          also proves the two priorities are separate: a request with both a dead path id and a dead
          body id must report the path code.
        test_recipe:
          setup:
            - "Clock at 2026-08-01T00:00:00.000Z; one valid seller exists so the body-FK probe has a live path."
            - "MISSING = 00000000-0000-0000-0000-000000000000 for every family."
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
