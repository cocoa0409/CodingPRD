            - "trigger call 1 -> HTTP 403 with data.error_id == \"ERR_SEGREGATION_OF_DUTIES\" (not ERR_ROLE_NOT_PERMITTED — FilingAgent is a permitted role)"
            - "after trigger call 1 nothing moved: FilingSubmission.${fs_id}.status still \"QUEUED\", transmitted_by_user_id == null, transmitted_at_utc == null, ScheduleVersion.${sv_id}.filing_charge_accrued_cents == 0 and filing_status still \"VALIDATED\""
            - "trigger call 2 -> HTTP 200; FilingSubmission.${fs_id}.status == \"TRANSMITTED\" with transmitted_by_user_id == \"usr-file-1\" and transmitted_at_utc == \"2026-08-01T00:00:00Z\""
            - "ScheduleVersion.${sv_id}.filing_status == \"FILED\", filing_charge_accrued_cents == 8450, and both FlightLeg.${leg1_id} and FlightLeg.${leg2_id} are \"FILED\""

  # ===================================================================
  # SECTION 8 — cross_cutting_complexity_layers  (§1.2 / §1.3 layers)
  # ===================================================================
  - section: cross_cutting_complexity_layers
    instances:

      - name: superseding_a_version_from_a_stale_read_creates_no_successor_at_all
        claim_type: optimistic_concurrency
        grounds:
          - concurrency_rules.schedule_version_supersede_occ
          - errors.ERR_STALE_SCHEDULE_VERSION
        distinguishing_aspect: |
          The supersede token is checked against the version bumped by ANY write in the subtree — here a
          leg create — and the 412 must be total: no successor ScheduleVersion row, no status change on
          the original, no version bump from the failed attempt. Re-reading and retrying with the fresh
          token then forks the plan. An implementation that ignores expected_schedule_version_version, or
          that only bumps version on direct writes to the version row, silently forks a plan the caller
          never saw.
        test_recipe:
          setup:
            - "Home carrier HX; MUC and TXL LEVEL_2_FACILITATED; Season W26 OPEN."
            - "ScheduleVersion W26-O1 created and its version captured at creation time, BEFORE any leg exists."
            - "Then one MUC->TXL leg is added, which bumps ScheduleVersion.version and makes the captured token stale."
          setup_api_calls:
            - call: "POST /carriers"
              payload: { iata_code: "HX", icao_code: "HXA", country_code: "DE", is_home_carrier: true }
              as: SystemAdmin
              as_user_id: "usr-admin-1"
              captures: { home_carrier_id: "$.data.id" }
            - call: "POST /stations"
              payload: { iata_code: "MUC", country_code: "DE", coordination_level: "LEVEL_2_FACILITATED", utc_offset_minutes: 120, gate_count: 3, maintenance_capable: true }
              as: SystemAdmin
              as_user_id: "usr-admin-1"
              captures: { muc_id: "$.data.id" }
            - call: "POST /stations"
              payload: { iata_code: "TXL", country_code: "DE", coordination_level: "LEVEL_2_FACILITATED", utc_offset_minutes: 120, gate_count: 2, maintenance_capable: false }
              as: SystemAdmin
              as_user_id: "usr-admin-1"
              captures: { txl_id: "$.data.id" }
            - call: "POST /seasons"
              payload: { season_code: "W26", start_date: "2026-10-25T00:00:00Z", end_date: "2027-03-27T00:00:00Z", slot_return_deadline_utc: "2026-09-15T23:59:59Z", filing_change_window_close_utc: "2026-10-11T23:59:59Z" }
              as: SystemAdmin
              as_user_id: "usr-admin-1"
              captures: { season_id: "$.data.id" }
            - call: "POST /seasons/${season_id}/transition"
              payload: { to_status: "OPEN" }
              as: SystemAdmin
              as_user_id: "usr-admin-1"
            - call: "POST /schedule-versions"
              payload: { carrier_id: "${home_carrier_id}", season_id: "${season_id}", version_label: "W26-O1" }
              as: NetworkPlanner
              as_user_id: "${home_carrier_id}"
              captures: { sv_id: "$.data.id", stale_version: "$.data.version" }
            - call: "POST /flight-legs"
              payload: { schedule_version_id: "${sv_id}", flight_number: "HX320", origin_station_id: "${muc_id}", dest_station_id: "${txl_id}", dep_utc: "2026-11-03T08:00:00Z", arr_utc: "2026-11-03T09:00:00Z", fleet_type_code: "B738" }
              as: NetworkPlanner
              as_user_id: "${home_carrier_id}"
              captures: { leg_id: "$.data.id" }
          trigger:
            - call: "POST /schedule-versions/${sv_id}/supersede"
              payload: { version_label: "W26-O2", expected_schedule_version_version: "${stale_version}" }
              as: NetworkPlanner
              as_user_id: "${home_carrier_id}"
              captures: { e_stale: "$.data.error_id" }
            - call: "GET /schedule-versions/${sv_id}"
              payload: {}
              as: NetworkPlanner
              as_user_id: "${home_carrier_id}"
              captures: { fresh_version: "$.data.version" }
            - call: "POST /schedule-versions/${sv_id}/supersede"
              payload: { version_label: "W26-O2", expected_schedule_version_version: "${fresh_version}" }
              as: NetworkPlanner
              as_user_id: "${home_carrier_id}"
              captures: { successor_id: "$.data.id" }
          assert:
            - "trigger call 1 -> HTTP 412 with data.error_id == \"ERR_STALE_SCHEDULE_VERSION\""
            - "immediately after the 412: GET /schedule-versions filtered by carrier_id ${home_carrier_id} returns total_count == 1 — no successor row was created"
            - "ScheduleVersion.${sv_id}.filing_status is still \"DRAFT\" and its version equals ${fresh_version}, i.e. the failed attempt did not bump it"
            - "${fresh_version} > ${stale_version} — the leg create incremented the version even though it wrote a different row"
            - "trigger call 3 -> HTTP 201 with supersedes_version_id == \"${sv_id}\", filing_status \"DRAFT\", compliance_state \"CLEAN\", leg_count == 0, filing_charge_accrued_cents == 0, and the same carrier_id and season_id"
            - "ScheduleVersion.${sv_id}.filing_status == \"SUPERSEDED\" and its version is ${fresh_version} + 1; FlightLeg.${leg_id} still belongs to ${sv_id} and was not copied to the successor"

      - name: one_write_propagates_through_the_whole_dependent_subtree
        claim_type: cascading_side_effects
        grounds:
          - complexity_profile.cascading_side_effects
        excluded_because:
          difficulty_instance: transitive_cascade / retiming_a_filed_leg_cascades_five_levels_to_filing_submission_rejection
          rationale: "That instance walks a single PATCH through five levels — leg, slot holding, schedule version counters, compliance state and the in-flight filing submission — asserting the state of every level."

      - name: a_dual_variant_calculation_keeps_both_variants_live
        claim_type: dual_variant_calculation
        grounds:
          - calculations.slot_utilization_pct
        excluded_because:
          difficulty_instance: dual_variant_calc / slot_utilization_as_operated_versus_as_filed_diverge_on_one_holding
          rationale: "That instance builds a holding where utilization_pct and utilization_pct_as_filed disagree numerically and asserts both, plus which variant the season audit consumes."

      - name: a_rate_threshold_flips_a_derived_flag_at_its_boundary
        claim_type: rate_threshold_triggers
        grounds:
          - calculations.slot_utilization_pct
        excluded_because:
          difficulty_instance: boundary_precision_check / at_risk_of_loss_stays_false_at_zero_attached_operations_and_flips_at_one
          rationale: "That instance pins the 80% use-it-or-lose-it threshold's vacuous-truth edge and the first non-vacuous step, which is exactly the rate-threshold trigger for this domain."

  # ===================================================================
  # SECTION 9 — consistency_model  (§1.4 read-after-write and counters)
  # ===================================================================
  - section: consistency_model
    instances:

      - name: derived_counters_agree_between_the_detail_read_and_the_list_read
        claim_type: read_after_write
        grounds:
          - complexity_profile.consistency_model
          - endpoints.GET_schedule_versions_schedule_version_id
          - endpoints.GET_slot_holdings
        distinguishing_aspect: |
          Every derived counter must be recomputed synchronously inside the writing request, so the very
          next read — whether by id or through a filtered list — already shows it, and the two projections
          must never disagree. Here one attach call is followed immediately by four reads spanning two
          entities and both projection shapes. An implementation that caches counters on the list path, or
          recomputes them lazily on the detail path only, produces two different truths for one row.
        test_recipe:
          setup:
            - "Home carrier HX; FRA LEVEL_3_COORDINATED; MUC LEVEL_2_FACILITATED; Season W26 OPEN."
            - "One FRA DEPARTURE series at 2026-11-02T08:00:00Z, days_of_week \"1\", series_weeks 5 (planned_operations 5)."
            - "ScheduleVersion W26-C1 with one FRA->MUC leg on 2026-11-02 08:00Z->09:00Z, not yet slotted."
