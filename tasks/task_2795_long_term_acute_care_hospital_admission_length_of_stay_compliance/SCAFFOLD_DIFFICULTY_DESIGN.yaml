  - rule_id: cross_entity_state_dependency
    instances:
      - name: tolerated_sbt_blocked_until_the_idt_notes_are_refreshed
        grounds:
          - validations.priority_32_ERR_IDT_DOCUMENTATION_STALE
          - state_machines.WeaningPlan.PROGRESSING_to_PROGRESSING
          - entities.IdtNote.fields.documented_at
          - entities.WeaningPlan.fields.last_progression_at
        distinguishing_aspect: |
          The gate lives on a SIBLING collection, not on the plan: whether a TOLERATED trial may be
          recorded depends on the documented_at of IdtNote rows belonging to the plan's Stay, compared
          against the plan's own last_progression_at. The dependency is therefore time-shifted - the
          same two notes are sufficient for the first progression and stale for the second, with no
          state change on the plan itself in between.
        test_recipe:
          setup:
            - "OPEN period FY2027, ACTIVE criteria set CS-2026A, DRG 207 loaded; patient Mona Wean admitted at the default clock 2026-08-01T00:00:00Z on the PMV track."
            - "One RESPIRATORY_THERAPY and one PHYSICIAN note are filed at 2026-08-01T00:00:00Z and a weaning plan is created at the same instant."
            - "The clock advances to 2026-08-02 and the first TOLERATED trial is recorded - the 08-01 notes satisfy the window because the plan has no last_progression_at yet and its created_at is 08-01. That trial sets last_progression_at to 2026-08-02T00:00:00Z, which is now AHEAD of both notes."
          setup_api_calls:
            - call: "POST /ltch/cost-reporting-periods"
              payload: { period_label: "FY2027", start_date: "2026-07-01", end_date: "2027-06-30" }
              as: ComplianceOfficer
              captures: { period_id: $.data.id }
            - call: "POST /ltch/referring-hospitals"
              payload: { name: "Metro General", npi: "1000000001", hospital_type: "ACUTE_CARE", is_colocated: false }
              as: ComplianceOfficer
              captures: { rh_metro_id: $.data.id }
            - call: "POST /ltch/admission-criteria-sets"
              payload: { label: "CS-2026A", effective_from: "2026-01-01", pmv_min_vent_hours: 96, pmv_min_icu_days: 3, wound_min_stage: 3, wound_min_count: 2 }
              as: ComplianceOfficer
              captures: { cs_a_id: $.data.id }
            - call: "POST /ltch/drg-rates"
              payload: { drg_code: "207", relative_weight: 1.25, alos_days: 30, standard_federal_rate_cents: 4800000, ipps_comparable_per_diem_cents: 90000, ipps_comparable_full_cents: 2400000 }
              as: ComplianceOfficer
              captures: { drg207_id: $.data.id }
            - call: "POST /ltch/patients"
              payload: { mrn: "MRN-120", full_name: "Mona Wean", birth_date: "1953-03-13", primary_payer: "MEDICARE_FFS" }
              as: IntakeCoordinator
              captures: { pat120_id: $.data.id, pat120_v: $.data.version }
            - call: "POST /ltch/referrals"
              payload: { patient_id: "${pat120_id}", referring_hospital_id: "${rh_metro_id}", drg_rate_id: "${drg207_id}", expected_patient_version: "${pat120_v}", vent_hours_at_referral: 240, icu_days_at_referral: 5, wound_stage: 1, wound_count: 0, prior_acute_discharge_at: "2026-07-31T00:00:00Z" }
              as: IntakeCoordinator
              captures: { ref120_id: $.data.id }
            - call: "POST /ltch/referrals/${ref120_id}/screen"
              payload: {}
              as: IntakeCoordinator
            - call: "POST /ltch/referrals/${ref120_id}/admit"
              payload: {}
              as: IntakeCoordinator
              captures: { stay120_id: $.data.id }
            - call: "POST /ltch/stays/${stay120_id}/idt-notes"
              payload: { discipline: "RESPIRATORY_THERAPY", note_text: "Baseline SBT tolerance documented.", goals_documented: true }
              as: UtilizationReviewNurse
              captures: { note_rt1_at: $.data.documented_at }
            - call: "POST /ltch/stays/${stay120_id}/idt-notes"
              payload: { discipline: "PHYSICIAN", note_text: "Weaning plan reviewed at admission.", goals_documented: true }
              as: UtilizationReviewNurse
            - call: "POST /ltch/stays/${stay120_id}/weaning-plans"
              payload: { protocol_label: "STANDARD_SBT" }
              as: UtilizationReviewNurse
              captures: { plan120_id: $.data.id }
            - call: "POST /ltch/_clock/set_current_utc"
              payload: { current_utc: "2026-08-02T00:00:00Z" }
              as: ComplianceOfficer
            - call: "POST /ltch/weaning-plans/${plan120_id}/record-sbt"
              payload: { outcome: "TOLERATED", sbt_hours: 2, vent_hours_since_last: 4 }
              as: UtilizationReviewNurse
              captures: { plan120_step1: $.data.current_step, plan120_prog_at: $.data.last_progression_at }
            - call: "POST /ltch/_clock/set_current_utc"
              payload: { current_utc: "2026-08-03T00:00:00Z" }
              as: ComplianceOfficer
          trigger:
            - call: "POST /ltch/weaning-plans/${plan120_id}/record-sbt"
              payload: { outcome: "TOLERATED", sbt_hours: 3, vent_hours_since_last: 2 }
              as: UtilizationReviewNurse
              captures: { stale_error: $.data.error_id }
            - call: "POST /ltch/stays/${stay120_id}/idt-notes"
              payload: { discipline: "RESPIRATORY_THERAPY", note_text: "SBT tolerance re-assessed after progression.", goals_documented: true }
              as: UtilizationReviewNurse
            - call: "POST /ltch/stays/${stay120_id}/idt-notes"
              payload: { discipline: "PHYSICIAN", note_text: "Team re-reviewed the weaning trajectory.", goals_documented: true }
              as: AttendingPhysician
            - call: "POST /ltch/weaning-plans/${plan120_id}/record-sbt"
              payload: { outcome: "TOLERATED", sbt_hours: 3, vent_hours_since_last: 2 }
              as: UtilizationReviewNurse
          assert:
            - "note_rt1_at == 2026-08-01T00:00:00.000Z, plan120_step1 == 1 and plan120_prog_at == 2026-08-02T00:00:00.000Z"
            - "The first trigger call returns HTTP 422 with stale_error == ERR_IDT_DOCUMENTATION_STALE - the 08-01 notes are older than last_progression_at 08-02"
            - "After the refused call WeaningPlan.${plan120_id}.sbt_attempt_count == 1 and current_step == 1 and vent_hours_total == 4.0 - a rejected trial records nothing"
            - "GET /ltch/stays/${stay120_id}/idt-notes returns 4 items, the two newest with documented_at == 2026-08-03T00:00:00.000Z"
            - "After the refiled notes the retry succeeds: WeaningPlan.${plan120_id}.status == PROGRESSING, current_step == 2, sbt_attempt_count == 2, consecutive_failed_sbt == 0"
            - "WeaningPlan.${plan120_id}.vent_hours_total == 6.0 and max_tolerated_sbt_hours == 3"
            - "WeaningPlan.${plan120_id}.liberation_eligible == true and last_progression_at == 2026-08-03T00:00:00.000Z"

      - name: admit_blocked_after_a_newer_criteria_set_supersedes_the_pinned_one
        grounds:
          - validations.priority_31_ERR_CRITERIA_SET_SUPERSEDED
          - entities.AdmissionCriteriaSet.fields.status
          - entities.Referral.fields.pinned_criteria_set_id
          - calculations.referral_screening_evaluation
        distinguishing_aspect: |
          Here the dependency is on a REFERENCE-DATA entity that a third party mutates: the referral
