      - name: clock_endpoint_expires_an_active_bid_and_returns_its_id
        claim_type: Action endpoint
        grounds:
          - state_machines.Bid.ACTIVE_to_EXPIRED
          - endpoints["POST /_clock/set_current_utc"]
        distinguishing_aspect: "Advancing the logical clock to exactly the bid's expires_at flips the ACTIVE bid to EXPIRED and returns its id in expired_bid_ids, while a DRAFT bid at the same elevator is untouched."
        test_recipe:
          setup:
            - "One desk, one elevator, one ACTIVE CORN bid expiring 2026-08-10T00:00:00Z, and one DRAFT SOYBEANS bid with the same expiry."
          setup_api_calls:
            - call: "POST /grain/trading-desks"
              payload: { desk_code: "CD43", name: "Corner Desk 43", credit_line_usd: 250000.00 }
              as: DeskAdmin
              as_user_id: "u-admin-1"
              captures: { desk_id: $.data.id }
