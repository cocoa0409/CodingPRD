      - name: claim_adjudication_follows_service_partner_authorization_state_across_suspend_and_reinstate
        grounds:
          - validations[priority=32]
          - state_machines.ServicePartner.AUTHORIZED_to_SUSPENDED
          - state_machines.ServicePartner.SUSPENDED_to_AUTHORIZED
          - state_machines.WarrantyClaim.SUBMITTED_to_APPROVED
          - calculations.service_partner_claim_authority
        distinguishing_aspect: |
          The dependency is re-evaluated on the ADJUDICATION step rather than at filing time, and
          the controlling entity is a channel-side sibling (ServicePartner) of the claim, not an
          ancestor of the money being spent. An already-SUBMITTED claim that was legitimately filed
          becomes un-adjudicable the moment its partner is SUSPENDED, and becomes adjudicable again
          on REINSTATE with the payout unchanged -- so the check reads live partner state, not a
          value stamped on the claim.
