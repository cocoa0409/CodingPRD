            - "first clear-customs rejected: err == ERR_CONTAINER_QUARANTINE_BLOCK"
            - "Item.${item_id}.lifecycle_status == ACTIVE after recall close (open_recall_count back to 0)"
            - "second clear-customs succeeds: Container.${cont_id}.status == CLEARED"

  # ---------------------------------------------------------------------------
  - rule_id: resource_temporal_overlap
    instances:
      - name: coupon_window_half_open_membership
        grounds:
          - calculations.coupon_redemption_gate
          - errors[ERR_COUPON_OUTSIDE_WINDOW]
        distinguishing_aspect: |
          Half-open interval semantics on the Coupon resource: window_start is
          INCLUSIVE and window_end EXCLUSIVE — redemption at exactly
          window_start succeeds and at exactly window_end fails, two instants
          on the same resource with opposite outcomes.
        test_recipe:
          setup:
            - "Item ACTIVE; store; customer; coupon window [2026-10-01T00:00:00Z, 2026-10-02T00:00:00Z), limit 9, ACTIVE"
          setup_api_calls:
            - call: "POST /items"
              payload: { sku: "TO1", name: "Gloves", brand_tier: "VALUE", origin_country: "VN", unit_retail_cents: 1500, member_price_cents: 1500, floor_margin_pct: 0.05, lead_time_days: 20, unit_weight_kg: 0.2 }
              as: PurchasingManager
              captures: { item_id: $.data.id }
            - call: "POST /items/${item_id}/activate"
              payload: {}
              as: PurchasingManager
            - call: "POST /stores"
              payload: { store_code: "ST11", name: "Store 11", format: "STANDARD", market_tier: "PRIMARY", receiving_capacity_units: 500, assortment_item_ids: ["${item_id}"] }
              as: OpsAdmin
              captures: { store_id: $.data.id }
            - call: "POST /customers"
              payload: { email: "c11@x.com", full_name: "Cust Eleven" }
              as: StoreClerk
              captures: { cust_id: $.data.id }
            - call: "POST /coupons"
              payload: { code: "WIN1", channel: "APP", audience: "ALL", discount_type: "PERCENT_OFF_BASKET", discount_value: 5, per_customer_limit: 9, budget_cents: 50000, window_start: "2026-10-01T00:00:00Z", window_end: "2026-10-02T00:00:00Z" }
              as: MarketingManager
              captures: { coupon_id: $.data.id }
            - call: "POST /coupons/${coupon_id}/activate"
              payload: {}
              as: MarketingManager
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-10-01T00:00:00Z" }
              as: OpsAdmin
            - call: "POST /sales"
              payload: { store_id: "${store_id}", customer_id: "${cust_id}" }
              as: StoreClerk
              captures: { s1: $.data.id }
            - call: "POST /sales/${s1}/lines"
              payload: { item_id: "${item_id}", quantity: 1 }
              as: StoreClerk
            - call: "POST /sales"
              payload: { store_id: "${store_id}", customer_id: "${cust_id}" }
              as: StoreClerk
              captures: { s2: $.data.id }
            - call: "POST /sales/${s2}/lines"
              payload: { item_id: "${item_id}", quantity: 1 }
              as: StoreClerk
          trigger:
            - call: "POST /sales/${s1}/apply-coupon"
              payload: { coupon_code: "WIN1" }
              as: StoreClerk
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-10-02T00:00:00Z" }
              as: OpsAdmin
            - call: "POST /sales/${s2}/apply-coupon"
              payload: { coupon_code: "WIN1" }
              as: StoreClerk
              captures: { err: $.data.error_id }
          assert:
            - "at window_start (inclusive): Sale.${s1}.applied_coupon_id == ${coupon_id}"
            - "at window_end (exclusive): err == ERR_COUPON_OUTSIDE_WINDOW"

      - name: store_dock_daily_bucket_capacity
        grounds:
          - calculations.daily_receiving_capacity
        distinguishing_aspect: |
          Different interval semantics on a different resource: the Store dock
          uses AGGREGATE PER-DAY BUCKET capacity (units summed per calendar
          date), not point-in-window membership — two containers received on
          the same date compete for one bucket, and advancing the clock to the
          next date resets the bucket so the overflow receive then succeeds.
        test_recipe:
          setup:
            - "Item ACTIVE; PO qty 9 in containers C1 (5) and C2 (4); store capacity 6; committed allocations A1=5, A2=4; both containers CLEARED; clock at 2026-11-03T08:00:00Z"
            - "C1 received (bucket 5/6 used)"
          setup_api_calls:
            - call: "POST /items"
              payload: { sku: "TO2", name: "Trolley", brand_tier: "MID", origin_country: "CN", unit_retail_cents: 9000, member_price_cents: 8500, floor_margin_pct: 0.10, lead_time_days: 40, unit_weight_kg: 8.0 }
              as: PurchasingManager
              captures: { item_id: $.data.id }
            - call: "POST /items/${item_id}/activate"
              payload: {}
              as: PurchasingManager
            - call: "POST /purchase-orders"
              payload:
                po_number: "PO-TO2"
                lines: [ { item_id: "${item_id}", quantity: 9, unit_cost_cents: 4000 } ]
                estimated_duty_cents: 200
                estimated_freight_cents: 200
              as: PurchasingManager
              captures: { po_id: $.data.id }
            - call: "POST /purchase-orders/${po_id}/issue"
              payload: {}
              as: PurchasingManager
            - call: "POST /containers"
              payload:
                po_id: "${po_id}"
                container_number: "C-TO2-1"
                lines: [ { item_id: "${item_id}", quantity: 5 } ]
              as: LogisticsCoordinator
              captures: { c1: $.data.id, c1_v: $.data.version }
            - call: "POST /containers"
              payload:
                po_id: "${po_id}"
                container_number: "C-TO2-2"
                lines: [ { item_id: "${item_id}", quantity: 4 } ]
              as: LogisticsCoordinator
              captures: { c2: $.data.id, c2_v: $.data.version }
            - call: "POST /stores"
              payload: { store_code: "ST12", name: "Store 12", format: "STANDARD", market_tier: "PRIMARY", receiving_capacity_units: 6, assortment_item_ids: ["${item_id}"] }
              as: OpsAdmin
              captures: { store_id: $.data.id }
            - call: "POST /stores/${store_id}/allocations"
              payload: { container_id: "${c1}", item_id: "${item_id}", quantity: 5 }
              as: InventoryPlanner
              captures: { a1: $.data.id }
            - call: "POST /store-allocations/${a1}/commit"
              payload: { expected_container_version: "${c1_v}" }
              as: InventoryPlanner
            - call: "POST /stores/${store_id}/allocations"
              payload: { container_id: "${c2}", item_id: "${item_id}", quantity: 4 }
              as: InventoryPlanner
              captures: { a2: $.data.id }
            - call: "POST /store-allocations/${a2}/commit"
              payload: { expected_container_version: "${c2_v}" }
              as: InventoryPlanner
            - call: "POST /containers/${c1}/depart"
              payload: {}
              as: LogisticsCoordinator
            - call: "POST /containers/${c1}/arrive-port"
              payload: {}
              as: LogisticsCoordinator
            - call: "POST /containers/${c1}/clear-customs"
              payload: {}
              as: ComplianceOfficer
            - call: "POST /containers/${c2}/depart"
              payload: {}
              as: LogisticsCoordinator
            - call: "POST /containers/${c2}/arrive-port"
              payload: {}
              as: LogisticsCoordinator
            - call: "POST /containers/${c2}/clear-customs"
              payload: {}
              as: ComplianceOfficer
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-11-03T08:00:00Z" }
              as: OpsAdmin
            - call: "POST /containers/${c1}/receive"
              payload: { actual_duty_cents: 200, actual_freight_cents: 200 }
              as: LogisticsCoordinator
          trigger:
            - call: "POST /containers/${c2}/receive"
              payload: {}
              as: LogisticsCoordinator
              captures: { err: $.data.error_id }
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-11-04T00:00:00Z" }
              as: OpsAdmin
            - call: "POST /containers/${c2}/receive"
              payload: {}
              as: LogisticsCoordinator
          assert:
            - "same-day overflow rejected: err == ERR_STORE_DOCK_CAPACITY_EXCEEDED (5 + 4 > 6)"
            - "next-day retry succeeds: Container.${c2}.status == RECEIVED (bucket reset by date)"

  # ---------------------------------------------------------------------------
  - rule_id: compensating_invariant
    instances:
      - name: container_pool_conserved_under_commit_decommit
        grounds:
          - state_machines.StoreAllocation.PLANNED_to_COMMITTED
          - state_machines.StoreAllocation.COMMITTED_to_PLANNED
        distinguishing_aspect: |
          Conserved quantity: container line pool. INVARIANT: for every
          container line, unallocated_quantities[item] + sum(quantities of
          allocations with status PLANNED or COMMITTED) == line quantity.
          Commit then decommit must restore the exact pool (5), no drift.
        test_recipe:
          setup:
            - "Item ACTIVE; PO issued; container line qty 5; allocation A of 2 PLANNED"
          setup_api_calls:
            - call: "POST /items"
              payload: { sku: "CI1", name: "Anvil", brand_tier: "PROFESSIONAL", origin_country: "DE", unit_retail_cents: 45000, member_price_cents: 43000, floor_margin_pct: 0.10, lead_time_days: 60, unit_weight_kg: 30.0 }
              as: PurchasingManager
              captures: { item_id: $.data.id }
            - call: "POST /items/${item_id}/activate"
              payload: {}
              as: PurchasingManager
            - call: "POST /purchase-orders"
              payload:
                po_number: "PO-CI1"
                lines: [ { item_id: "${item_id}", quantity: 5, unit_cost_cents: 20000 } ]
                estimated_duty_cents: 500
                estimated_freight_cents: 500
              as: PurchasingManager
              captures: { po_id: $.data.id }
            - call: "POST /purchase-orders/${po_id}/issue"
              payload: {}
              as: PurchasingManager
            - call: "POST /containers"
              payload:
                po_id: "${po_id}"
                container_number: "C-CI1"
                lines: [ { item_id: "${item_id}", quantity: 5 } ]
              as: LogisticsCoordinator
              captures: { cont_id: $.data.id, cont_v: $.data.version }
            - call: "POST /stores"
              payload: { store_code: "ST13", name: "Store 13", format: "STANDARD", market_tier: "PRIMARY", receiving_capacity_units: 500, assortment_item_ids: ["${item_id}"] }
              as: OpsAdmin
              captures: { store_id: $.data.id }
            - call: "POST /stores/${store_id}/allocations"
              payload: { container_id: "${cont_id}", item_id: "${item_id}", quantity: 2 }
              as: InventoryPlanner
              captures: { alloc_id: $.data.id }
          trigger:
            - call: "POST /store-allocations/${alloc_id}/commit"
              payload: { expected_container_version: "${cont_v}" }
              as: InventoryPlanner
            - call: "POST /store-allocations/${alloc_id}/decommit"
              payload: {}
              as: InventoryPlanner
          assert:
            - "after decommit: Container.${cont_id}.unallocated_quantities[${item_id}] == 5 (commit took it to 3; decommit restored it)"
            - "invariant: unallocated (5) + COMMITTED quantities (0) == line quantity (5) — no drift from the commit/decommit pair"
            - "StoreAllocation.${alloc_id}.status == PLANNED"

      - name: coupon_budget_conserved_under_apply_void
        grounds:
          - state_machines.Sale.OPEN_to_VOID
          - state_machines.Sale.OPEN_to_COMPLETED
          - calculations.coupon_redemption_gate
        distinguishing_aspect: |
          Different conserved quantity: coupon budget. INVARIANT: budget_spent +
          budget_reserved changes only when a discount is newly applied
          (reserved += d), completed (reserved -= d AND spent += d, net zero),
          or voided (reserved -= d). Apply-then-void leaves spent+reserved
          exactly at its pre-apply value (0), while apply-then-complete keeps
          the SUM constant at the discount value.
        test_recipe:
          setup:
            - "Item ACTIVE retail 2000; store; customer; coupon FIXED_AMOUNT_OFF_BASKET 300, limit 9, budget 10000, ACTIVE, window covers now"
            - "Sale S_VOID: line + coupon applied; Sale S_DONE: line + coupon applied"
          setup_api_calls:
            - call: "POST /items"
              payload: { sku: "CI2", name: "Pry Bar", brand_tier: "VALUE", origin_country: "CN", unit_retail_cents: 2000, member_price_cents: 2000, floor_margin_pct: 0.05, lead_time_days: 20, unit_weight_kg: 1.2 }
              as: PurchasingManager
              captures: { item_id: $.data.id }
            - call: "POST /items/${item_id}/activate"
              payload: {}
              as: PurchasingManager
            - call: "POST /stores"
              payload: { store_code: "ST14", name: "Store 14", format: "STANDARD", market_tier: "PRIMARY", receiving_capacity_units: 500, assortment_item_ids: ["${item_id}"] }
              as: OpsAdmin
              captures: { store_id: $.data.id }
            - call: "POST /customers"
              payload: { email: "c14@x.com", full_name: "Cust Fourteen" }
              as: StoreClerk
              captures: { cust_id: $.data.id }
            - call: "POST /coupons"
              payload: { code: "FIX3", channel: "EMAIL", audience: "ALL", discount_type: "FIXED_AMOUNT_OFF_BASKET", discount_value: 300, per_customer_limit: 9, budget_cents: 10000, window_start: "2026-08-01T00:00:00Z", window_end: "2026-12-31T00:00:00Z" }
              as: MarketingManager
              captures: { coupon_id: $.data.id }
            - call: "POST /coupons/${coupon_id}/activate"
              payload: {}
              as: MarketingManager
            - call: "POST /sales"
              payload: { store_id: "${store_id}", customer_id: "${cust_id}" }
              as: StoreClerk
              captures: { s_void: $.data.id }
            - call: "POST /sales/${s_void}/lines"
              payload: { item_id: "${item_id}", quantity: 1 }
              as: StoreClerk
            - call: "POST /sales/${s_void}/apply-coupon"
              payload: { coupon_code: "FIX3" }
              as: StoreClerk
            - call: "POST /sales"
              payload: { store_id: "${store_id}", customer_id: "${cust_id}" }
              as: StoreClerk
              captures: { s_done: $.data.id }
            - call: "POST /sales/${s_done}/lines"
              payload: { item_id: "${item_id}", quantity: 1 }
              as: StoreClerk
            - call: "POST /sales/${s_done}/apply-coupon"
              payload: { coupon_code: "FIX3" }
              as: StoreClerk
          trigger:
            - call: "POST /sales/${s_void}/void"
              payload: {}
              as: StoreClerk
            - call: "POST /sales/${s_done}/complete"
              payload: {}
              as: StoreClerk
            - call: "GET /coupons/${coupon_id}"
              payload: {}
              as: MarketingManager
          assert:
            - "Coupon.${coupon_id}.budget_reserved_cents == 0 (void released 300, complete moved 300 out of reserved)"
            - "Coupon.${coupon_id}.budget_spent_cents == 300 (only the completed sale spent)"
            - "spent + reserved == 300 == discount of the single completed sale (invariant: no leak from the voided reservation)"
