              captures: { employer_v2: $.data.version }
            - call: "POST /perks/employers/${employer_id}/eligibility-files"
              payload: { expected_employer_version: "${employer_v2}", effective_from: "2026-08-05T00:00:00Z", checksum: "sha-sideeffect-2", records: [{ external_employee_ref: "E-001", employment_status: "LEAVE", region_code: "CA", eligibility_valid_from: "2026-07-01T00:00:00Z", eligibility_valid_until: "2027-07-01T00:00:00Z" }] }
