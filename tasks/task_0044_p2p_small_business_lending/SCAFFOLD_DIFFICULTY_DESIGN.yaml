scaffold_difficulty_design:

  # =================================================================
  # Rule 1 — Dual-variant calculations across different entity domains
  # =================================================================
  - rule_id: dual_variant_calc
    instances:
      - name: repayment_allocation_scheduled_vs_recovery_variant
        grounds:
          - calculations.allocate_repayment
          - state_machines.Loan.REPAYMENT_to_REPAYMENT
          - state_machines.Loan.CHARGED_OFF_to_CHARGED_OFF
          - entities.Repayment.fields.kind
        distinguishing_aspect: >
          The same Repayment amount of 600000 cents fills four ordered buckets
          (late_fee/interest/scheduled_principal/prepayment with a servicing fee)
          under the SCHEDULED variant on a REPAYMENT loan, but is treated wholly
          as principal recovery with NO servicing fee under the RECOVERY variant
          on a CHARGED_OFF loan — divergence lives on the Repayment/Loan domain.
        test_recipe:
          setup:
            - "Two separate A-grade loans of principal 1,200,000, apr 0.0599, term 12, each fully funded by investor X (800000) and investor Y (400000) and disbursed at funded_at=2026-06-01."
            - "Loan L1 stays in REPAYMENT; Loan L2 is driven to CHARGED_OFF via 3 late-fee assessments then charge-off."
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-06-01T00:00:00.000Z" }
              as: PlatformAdmin
            - call: "POST /borrowers"
              payload: { business_name: "Acme L1", ein: "11-0000001", state_code: "CA" }
              as: PlatformAdmin
              captures: { b1_id: $.data.id }
            - call: "POST /loan-applications"
              payload: { borrower_id: "${b1_id}", requested_principal_cents: 1200000, term_months: 12, plaid_avg_monthly_revenue_cents: 3000000, plaid_monthly_debt_payment_cents: 1000000, plaid_nsf_count_90d: 0, plaid_account_age_months: 48 }
              as: Borrower
              as_user_id: "${b1_id}"
              captures: { app1_id: $.data.id }
            - call: "POST /loan-applications/${app1_id}/score"
              payload: {}
              as: Underwriter
              as_user_id: "uw_scorer"
            - call: "POST /loan-applications/${app1_id}/approve"
              payload: {}
              as: Underwriter
              as_user_id: "uw_approver"
            - call: "GET /loans?application_id=${app1_id}"
              payload: {}
              as: PlatformAdmin
              captures: { l1_id: $.data.0.id, l1_v0: $.data.0.version }
            - call: "POST /compliance-disclosures"
              payload: { loan_id: "${l1_id}", document_type: "SERIES_NOTE_PROSPECTUS" }
              as: ComplianceOfficer
              as_user_id: "co_1"
            - call: "POST /investors"
              payload: { display_name: "Inv X", max_single_loan_pct: 1 }
              as: PlatformAdmin
              captures: { invx_id: $.data.id }
            - call: "POST /investors/${invx_id}/deposit"
              payload: { amount_cents: 5000000 }
              as: PlatformAdmin
            - call: "POST /investors"
              payload: { display_name: "Inv Y", max_single_loan_pct: 1 }
              as: PlatformAdmin
              captures: { invy_id: $.data.id }
            - call: "POST /investors/${invy_id}/deposit"
              payload: { amount_cents: 5000000 }
              as: PlatformAdmin
            - call: "POST /investments"
              payload: { investor_id: "${invx_id}", loan_id: "${l1_id}", amount_cents: 800000, expected_loan_version: "${l1_v0}" }
              as: Investor
              as_user_id: "${invx_id}"
              captures: { l1_invx_id: $.data.id }
            - call: "GET /loans/${l1_id}"
              payload: {}
              as: PlatformAdmin
              captures: { l1_v1: $.data.version }
            - call: "POST /investments"
              payload: { investor_id: "${invy_id}", loan_id: "${l1_id}", amount_cents: 400000, expected_loan_version: "${l1_v1}" }
              as: Investor
              as_user_id: "${invy_id}"
            - call: "POST /loans/${l1_id}/disburse"
              payload: {}
              as: PlatformAdmin
          trigger:
            - call: "POST /loans/${l1_id}/repayments"
              payload: { loan_id: "${l1_id}", amount_cents: 600000, kind: "SCHEDULED" }
              as: Borrower
              as_user_id: "${b1_id}"
              captures: { rep_sched_id: $.data.id }
          assert:
            - "Repayment.${rep_sched_id}.interest_paid_cents == 5990"
            - "Repayment.${rep_sched_id}.platform_fee_cents == 60"
            - "Repayment.${rep_sched_id}.principal_paid_cents == 594010"
            - "Repayment.${rep_sched_id}.late_fee_paid_cents == 0"

      - name: investor_net_receipt_scheduled_servicing_fee_vs_recovery_no_fee
        grounds:
          - calculations.compute_servicing_fee
          - calculations.distribute_pro_rata
          - calculations.distribute_recovery
          - entities.RepaymentAllocation.fields.interest_amount_cents
          - entities.RepaymentAllocation.fields.principal_amount_cents
        distinguishing_aspect: >
          The amount an investor actually receives diverges by variant on the
          Investment/Investor domain: a SCHEDULED period payment routes its 5990
          interest bucket through compute_servicing_fee (1% = 60) so the single
          investor nets 5930 of interest, whereas an equal 5990 RECOVERY payment on
          a charged-off loan applies NO servicing fee and the investor nets the full
          5990 as principal — a different domain than instance 1's Repayment-bucket split.
        test_recipe:
          setup:
            - "Loan L_sched: single investor X funds 1,200,000, disbursed, in REPAYMENT; X receives the net-of-fee interest on a scheduled period-1 payment."
            - "Loan L_rec: single investor W funds 1,200,000, disbursed, driven to DEFAULTED via 3 late fees, charged off; W receives a 5990 RECOVERY with no fee."
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-06-01T00:00:00.000Z" }
              as: PlatformAdmin
            - call: "POST /borrowers"
              payload: { business_name: "Sched Co", ein: "11-0000002", state_code: "CA" }
              as: PlatformAdmin
              captures: { bs_id: $.data.id }
            - call: "POST /loan-applications"
              payload: { borrower_id: "${bs_id}", requested_principal_cents: 1200000, term_months: 12, plaid_avg_monthly_revenue_cents: 3000000, plaid_monthly_debt_payment_cents: 1000000, plaid_nsf_count_90d: 0, plaid_account_age_months: 48 }
              as: Borrower
              as_user_id: "${bs_id}"
              captures: { apps_id: $.data.id }
            - call: "POST /loan-applications/${apps_id}/score"
              payload: {}
              as: Underwriter
              as_user_id: "uw_scorer"
            - call: "POST /loan-applications/${apps_id}/approve"
              payload: {}
              as: Underwriter
              as_user_id: "uw_approver"
            - call: "GET /loans?application_id=${apps_id}"
              payload: {}
              as: PlatformAdmin
              captures: { ls_id: $.data.0.id, ls_v0: $.data.0.version }
            - call: "POST /compliance-disclosures"
              payload: { loan_id: "${ls_id}", document_type: "SERIES_NOTE_PROSPECTUS" }
              as: ComplianceOfficer
              as_user_id: "co_1"
            - call: "POST /investors"
              payload: { display_name: "Inv X", max_single_loan_pct: 1 }
              as: PlatformAdmin
              captures: { invx_id: $.data.id }
            - call: "POST /investors/${invx_id}/deposit"
              payload: { amount_cents: 5000000 }
              as: PlatformAdmin
            - call: "POST /investments"
              payload: { investor_id: "${invx_id}", loan_id: "${ls_id}", amount_cents: 1200000, expected_loan_version: "${ls_v0}" }
              as: Investor
              as_user_id: "${invx_id}"
              captures: { invx_inv_id: $.data.id }
            - call: "POST /loans/${ls_id}/disburse"
              payload: {}
              as: PlatformAdmin
            - call: "POST /borrowers"
              payload: { business_name: "Rec Co", ein: "11-0000003", state_code: "CA" }
              as: PlatformAdmin
              captures: { br_id: $.data.id }
            - call: "POST /loan-applications"
              payload: { borrower_id: "${br_id}", requested_principal_cents: 1200000, term_months: 12, plaid_avg_monthly_revenue_cents: 3000000, plaid_monthly_debt_payment_cents: 1000000, plaid_nsf_count_90d: 0, plaid_account_age_months: 48 }
              as: Borrower
              as_user_id: "${br_id}"
              captures: { appr_id: $.data.id }
            - call: "POST /loan-applications/${appr_id}/score"
              payload: {}
              as: Underwriter
              as_user_id: "uw_scorer"
            - call: "POST /loan-applications/${appr_id}/approve"
              payload: {}
              as: Underwriter
              as_user_id: "uw_approver"
            - call: "GET /loans?application_id=${appr_id}"
              payload: {}
              as: PlatformAdmin
              captures: { lr_id: $.data.0.id, lr_v0: $.data.0.version }
            - call: "POST /compliance-disclosures"
              payload: { loan_id: "${lr_id}", document_type: "SERIES_NOTE_PROSPECTUS" }
              as: ComplianceOfficer
              as_user_id: "co_1"
            - call: "POST /investors"
              payload: { display_name: "Inv W", max_single_loan_pct: 1 }
              as: PlatformAdmin
              captures: { invw_id: $.data.id }
            - call: "POST /investors/${invw_id}/deposit"
              payload: { amount_cents: 5000000 }
              as: PlatformAdmin
            - call: "POST /investments"
              payload: { investor_id: "${invw_id}", loan_id: "${lr_id}", amount_cents: 1200000, expected_loan_version: "${lr_v0}" }
              as: Investor
              as_user_id: "${invw_id}"
              captures: { invw_inv_id: $.data.id }
            - call: "POST /loans/${lr_id}/disburse"
              payload: {}
              as: PlatformAdmin
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-09-02T00:00:00.000Z" }
              as: PlatformAdmin
            - call: "POST /loans/${lr_id}/assess-late-fee"
              payload: {}
              as: PlatformAdmin
            - call: "POST /loans/${lr_id}/assess-late-fee"
              payload: {}
              as: PlatformAdmin
            - call: "POST /loans/${lr_id}/assess-late-fee"
              payload: {}
              as: PlatformAdmin
            - call: "POST /loans/${lr_id}/charge-off"
              payload: {}
              as: PlatformAdmin
          trigger:
            - call: "POST /loans/${ls_id}/repayments"
              payload: { loan_id: "${ls_id}", amount_cents: 103274, kind: "SCHEDULED" }
              as: Borrower
              as_user_id: "${bs_id}"
              captures: { rep_sched_id: $.data.id }
            - call: "POST /loans/${lr_id}/repayments"
              payload: { loan_id: "${lr_id}", amount_cents: 5990, kind: "RECOVERY" }
              as: PlatformAdmin
              captures: { rep_rec_id: $.data.id }
          assert:
            - "Repayment.${rep_sched_id}.interest_paid_cents == 5990 and Repayment.${rep_sched_id}.platform_fee_cents == 60"
            - "GET /investments/${invx_inv_id}/allocations for ${rep_sched_id} has interest_amount_cents == 5930 (net of the 60 fee)"
            - "Repayment.${rep_rec_id}.platform_fee_cents == 0"
            - "GET /investments/${invw_inv_id}/allocations for ${rep_rec_id} has principal_amount_cents == 5990 (full amount, no fee)"

  # =================================================================
  # Rule 2 — Combinatorial formulas across different modes
  # =================================================================
  - rule_id: combinatorial_formula
    instances:
      - name: score_borrower_nonlinear_min_max_tier_interaction
        grounds:
          - calculations.score_borrower
          - calculations.apr_for_grade
          - entities.LoanApplication.fields.credit_score
          - entities.LoanApplication.fields.risk_grade
        distinguishing_aspect: >
          Mode (a): score_borrower combines four inputs through min-capped DSCR,
          a four-branch revenue-tier step, a floored NSF penalty, and a capped age
          ratio, then a tier table maps the weighted score to a grade — a single
          input change can flip the grade and thus offered_apr non-linearly.
        test_recipe:
          setup:
            - "An application with rev=3,000,000, debt=1,000,000, nsf=0, age=48."
          setup_api_calls:
            - call: "POST /borrowers"
              payload: { business_name: "Score Co", ein: "22-0000001", state_code: "TX" }
              as: PlatformAdmin
              captures: { b_id: $.data.id }
            - call: "POST /loan-applications"
              payload: { borrower_id: "${b_id}", requested_principal_cents: 1200000, term_months: 12, plaid_avg_monthly_revenue_cents: 3000000, plaid_monthly_debt_payment_cents: 1000000, plaid_nsf_count_90d: 0, plaid_account_age_months: 48 }
              as: Borrower
              as_user_id: "${b_id}"
              captures: { app_id: $.data.id }
          trigger:
            - call: "POST /loan-applications/${app_id}/score"
              payload: {}
              as: Underwriter
              as_user_id: "uw_scorer"
              captures: { sc: $.data.credit_score, gr: $.data.risk_grade }
          assert:
            - "LoanApplication.${app_id}.credit_score == 92.0"
            - "LoanApplication.${app_id}.risk_grade == A"
            - "LoanApplication.${app_id}.offered_apr == 0.0599"

      - name: amortization_round_interest_then_subtract_principal_order
        grounds:
          - calculations.amortization_schedule
          - entities.Loan.fields.apr
          - entities.Loan.fields.principal_cents
        distinguishing_aspect: >
          Mode (b): per-period interest is rounded to whole cents BEFORE principal
          is derived (principal_due = level_payment - rounded_interest), and the
          final period absorbs residual balance — round-then-subtract is pinned, so
          period-1 interest=5990 and principal=97284 are exact, not a sum-then-round
          variant.
        test_recipe:
          setup:
            - "Loan L (A-grade) principal 1,200,000, apr 0.0599, term 12, originated."
          setup_api_calls:
            - call: "POST /borrowers"
              payload: { business_name: "Amort Co", ein: "22-0000002", state_code: "TX" }
              as: PlatformAdmin
              captures: { b_id: $.data.id }
            - call: "POST /loan-applications"
              payload: { borrower_id: "${b_id}", requested_principal_cents: 1200000, term_months: 12, plaid_avg_monthly_revenue_cents: 3000000, plaid_monthly_debt_payment_cents: 1000000, plaid_nsf_count_90d: 0, plaid_account_age_months: 48 }
              as: Borrower
              as_user_id: "${b_id}"
              captures: { app_id: $.data.id }
            - call: "POST /loan-applications/${app_id}/score"
              payload: {}
              as: Underwriter
              as_user_id: "uw_scorer"
            - call: "POST /loan-applications/${app_id}/approve"
              payload: {}
              as: Underwriter
              as_user_id: "uw_approver"
            - call: "GET /loans?application_id=${app_id}"
              payload: {}
              as: PlatformAdmin
              captures: { l_id: $.data.0.id }
          trigger:
            - call: "GET /loans/${l_id}/schedule"
              payload: {}
              as: Underwriter
              as_user_id: "uw_scorer"
              captures: { lp: $.data.level_payment_cents }
          assert:
            - "schedule.level_payment_cents == 103274"
            - "schedule.periods[0].interest_due_cents == 5990"
            - "schedule.periods[0].principal_due_cents == 97284"
            - "schedule.periods[11].principal_due_cents equals the residual balance so sum(principal_due) == 1200000 exactly"

  # =================================================================
  # Rule 3 — Non-linear state-machine shape on different entities
  # =================================================================
  - rule_id: non_linear_state_machine
    instances:
      - name: loan_application_branch_scored_to_approved_vs_rejected
        grounds:
          - state_machines.LoanApplication.SCORED_to_APPROVED
          - state_machines.LoanApplication.SCORED_to_REJECTED
          - validations[priority=6]
        distinguishing_aspect: >
          Branching fork: from SCORED an application goes to APPROVED (side effect:
          a Loan is originated) OR to REJECTED (no Loan) — divergent side-effect sets
          per branch on the LoanApplication entity.
        test_recipe:
          setup:
            - "Two scored applications: app_ok (grade A) and app_f (grade F)."
          setup_api_calls:
            - call: "POST /borrowers"
              payload: { business_name: "Branch OK", ein: "33-0000001", state_code: "NY" }
              as: PlatformAdmin
              captures: { b_ok: $.data.id }
            - call: "POST /loan-applications"
              payload: { borrower_id: "${b_ok}", requested_principal_cents: 1200000, term_months: 12, plaid_avg_monthly_revenue_cents: 3000000, plaid_monthly_debt_payment_cents: 1000000, plaid_nsf_count_90d: 0, plaid_account_age_months: 48 }
              as: Borrower
              as_user_id: "${b_ok}"
              captures: { app_ok: $.data.id }
            - call: "POST /loan-applications/${app_ok}/score"
              payload: {}
              as: Underwriter
              as_user_id: "uw_scorer"
            - call: "POST /borrowers"
              payload: { business_name: "Branch F", ein: "33-0000002", state_code: "NY" }
              as: PlatformAdmin
              captures: { b_f: $.data.id }
            - call: "POST /loan-applications"
              payload: { borrower_id: "${b_f}", requested_principal_cents: 1200000, term_months: 12, plaid_avg_monthly_revenue_cents: 300000, plaid_monthly_debt_payment_cents: 2000000, plaid_nsf_count_90d: 6, plaid_account_age_months: 6 }
              as: Borrower
              as_user_id: "${b_f}"
              captures: { app_f: $.data.id }
            - call: "POST /loan-applications/${app_f}/score"
              payload: {}
              as: Underwriter
              as_user_id: "uw_scorer"
          trigger:
            - call: "POST /loan-applications/${app_ok}/approve"
              payload: {}
              as: Underwriter
              as_user_id: "uw_approver"
            - call: "POST /loan-applications/${app_f}/reject"
              payload: {}
              as: Underwriter
              as_user_id: "uw_approver"
          assert:
            - "LoanApplication.${app_ok}.status == APPROVED"
            - "GET /loans?application_id=${app_ok} returns exactly 1 Loan (origination side effect fired)"
            - "LoanApplication.${app_f}.status == REJECTED"
            - "GET /loans?application_id=${app_f} returns 0 Loans (no origination)"

      - name: loan_branch_repayment_to_paidoff_vs_defaulted_chargedoff
        grounds:
          - state_machines.Loan.REPAYMENT_to_PAID_OFF
          - state_machines.Loan.REPAYMENT_to_DEFAULTED
          - state_machines.Loan.DEFAULTED_to_CHARGED_OFF
        distinguishing_aspect: >
          Branching fork on the Loan entity: from REPAYMENT a loan reaches PAID_OFF
          (full payoff distributes principal to investors) OR DEFAULTED then
          CHARGED_OFF (writes off investments) — disjoint terminal branches with
          opposite investor side effects, on a different entity than Rule-3 instance 1.
        test_recipe:
          setup:
            - "Loan L_paid funded by X(800000)+Y(400000) disbursed, then paid off in one payment of 1,205,990."
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-06-01T00:00:00.000Z" }
              as: PlatformAdmin
            - call: "POST /borrowers"
              payload: { business_name: "Payoff Co", ein: "33-0000003", state_code: "NY" }
              as: PlatformAdmin
              captures: { b_id: $.data.id }
            - call: "POST /loan-applications"
              payload: { borrower_id: "${b_id}", requested_principal_cents: 1200000, term_months: 12, plaid_avg_monthly_revenue_cents: 3000000, plaid_monthly_debt_payment_cents: 1000000, plaid_nsf_count_90d: 0, plaid_account_age_months: 48 }
              as: Borrower
              as_user_id: "${b_id}"
              captures: { app_id: $.data.id }
            - call: "POST /loan-applications/${app_id}/score"
              payload: {}
              as: Underwriter
              as_user_id: "uw_scorer"
            - call: "POST /loan-applications/${app_id}/approve"
              payload: {}
              as: Underwriter
              as_user_id: "uw_approver"
            - call: "GET /loans?application_id=${app_id}"
              payload: {}
              as: PlatformAdmin
              captures: { l_id: $.data.0.id, l_v0: $.data.0.version }
            - call: "POST /compliance-disclosures"
              payload: { loan_id: "${l_id}", document_type: "SERIES_NOTE_PROSPECTUS" }
              as: ComplianceOfficer
              as_user_id: "co_1"
            - call: "POST /investors"
              payload: { display_name: "Inv X", max_single_loan_pct: 1 }
              as: PlatformAdmin
              captures: { invx_id: $.data.id }
            - call: "POST /investors/${invx_id}/deposit"
              payload: { amount_cents: 5000000 }
              as: PlatformAdmin
            - call: "POST /investors"
              payload: { display_name: "Inv Y", max_single_loan_pct: 1 }
              as: PlatformAdmin
              captures: { invy_id: $.data.id }
            - call: "POST /investors/${invy_id}/deposit"
              payload: { amount_cents: 5000000 }
              as: PlatformAdmin
            - call: "POST /investments"
              payload: { investor_id: "${invx_id}", loan_id: "${l_id}", amount_cents: 800000, expected_loan_version: "${l_v0}" }
              as: Investor
              as_user_id: "${invx_id}"
            - call: "GET /loans/${l_id}"
              payload: {}
              as: PlatformAdmin
              captures: { l_v1: $.data.version }
            - call: "POST /investments"
              payload: { investor_id: "${invy_id}", loan_id: "${l_id}", amount_cents: 400000, expected_loan_version: "${l_v1}" }
              as: Investor
              as_user_id: "${invy_id}"
            - call: "POST /loans/${l_id}/disburse"
              payload: {}
              as: PlatformAdmin
          trigger:
            - call: "POST /loans/${l_id}/repayments"
              payload: { loan_id: "${l_id}", amount_cents: 1205990, kind: "SCHEDULED" }
              as: Borrower
              as_user_id: "${b_id}"
          assert:
            - "Loan.${l_id}.status == PAID_OFF"
            - "Loan.${l_id}.outstanding_principal_cents == 0"

  # =================================================================
  # Rule 4 — Transitive cascade chains from different triggers
  # =================================================================
  - rule_id: transitive_cascade
    instances:
      - name: chargeoff_cascade_loan_investment_investor_depth3
        grounds:
          - state_machines.Loan.DEFAULTED_to_CHARGED_OFF
          - entities.Investment.fields.status
          - entities.Investor.fields.committed_capital_cents
          - entities.Investor.fields.capital_base_cents
        distinguishing_aspect: >
          Depth-3 cascade from charge-off: charge-off mutates the Loan (status →
          CHARGED_OFF) which itself causes each Investment to be WRITTEN_OFF, which
          itself causes its Investor's committed_capital_cents and capital_base_cents
          to be written down — three caused-by links from the charge-off trigger.
        test_recipe:
          setup:
            - "Loan L funded by X(800000)+Y(400000) disbursed; X capital_base 5,000,000 committed 800000; Y capital_base 5,000,000 committed 400000; loan driven to DEFAULTED."
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-06-01T00:00:00.000Z" }
              as: PlatformAdmin
            - call: "POST /borrowers"
              payload: { business_name: "Cascade Co", ein: "44-0000001", state_code: "FL" }
              as: PlatformAdmin
              captures: { b_id: $.data.id }
            - call: "POST /loan-applications"
              payload: { borrower_id: "${b_id}", requested_principal_cents: 1200000, term_months: 12, plaid_avg_monthly_revenue_cents: 3000000, plaid_monthly_debt_payment_cents: 1000000, plaid_nsf_count_90d: 0, plaid_account_age_months: 48 }
              as: Borrower
              as_user_id: "${b_id}"
              captures: { app_id: $.data.id }
            - call: "POST /loan-applications/${app_id}/score"
              payload: {}
              as: Underwriter
              as_user_id: "uw_scorer"
            - call: "POST /loan-applications/${app_id}/approve"
              payload: {}
              as: Underwriter
