  # ===========================================================================
  # Rule 9 — Compensating-action invariants across different conserved quantities
  # ===========================================================================
  - rule_id: compensating_invariant
    instances:
      - name: invoice_void_restores_community_fee_balance_to_pre_issue_value
        grounds:
          - state_machines.ReferralInvoice.DRAFT_to_ISSUED
          - state_machines.ReferralInvoice.ISSUED_to_VOIDED
          - calculations.community_fee_balance
          - entities.Community.fields.fee_balance_cents
          - entities.FeeLedgerEntry.fields.balance_after_cents
        distinguishing_aspect: |
          CONSERVED QUANTITY = MONEY, pinned as
          Community.fee_balance_cents == sum(FeeLedgerEntry.amount_cents for that community).
          Issue books ACCRUAL +180583 taking the balance from 0 to 180583; the compensating void
          books WRITE_OFF -180583 taking it back to exactly 0 with zero drift, and
          net_recognized_fee_cents returns to 0 as well.
