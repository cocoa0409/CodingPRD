          - errors[ERR_EVALUATION_ALREADY_SIGNED]
        distinguishing_aspect: "The DRAFT -> SIGNED transition is not idempotent: a second sign against the same evaluation is refused 409 ERR_EVALUATION_ALREADY_SIGNED and, critically, does not re-stamp signed_at to the later clock value, so the statutory anchor cannot be moved."
