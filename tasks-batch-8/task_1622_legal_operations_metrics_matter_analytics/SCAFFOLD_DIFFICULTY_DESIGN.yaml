            - call: "POST /legal-ops/practice-areas/${pa_id}/matter-types"
              payload: { code: "LIT-C", display_name: "C" }
              as: LegalOpsManager
              captures: { mt_id: $.data.id }
            - call: "POST /legal-ops/firms"
              payload: { name: "F", tier: "TIER_1", blended_hourly_rate_cents: 25000 }
              as: LegalOpsManager
              captures: { firm_id: $.data.id }
            - call: "POST /legal-ops/in-house-counsel"
              payload: { full_name: "C", email: "c@x.com", annual_capacity_hours: 100, loaded_hourly_cost_cents: 15000 }
              as: LegalOpsManager
              captures: { counsel_id: $.data.id }
            - call: "POST /legal-ops/matters"
              payload: { matter_number: "LGL-2026-00001", title: "M1", practice_area_id: "${pa_id}", matter_type_id: "${mt_id}", fiscal_period_id: "${fp_id}", lead_counsel_id: "${counsel_id}", primary_firm_id: "${firm_id}" }
              as: LegalOpsAnalyst
              captures: { m1_id: $.data.id }
            - call: "POST /legal-ops/matters/${m1_id}/assignments"
              payload: { counsel_id: "${counsel_id}", allocated_hours: 60 }
              as: LegalOpsAnalyst
            - call: "POST /legal-ops/matters/${m1_id}/activate"
              payload: {}
              as: LegalOpsAnalyst
            - call: "POST /legal-ops/matters"
              payload: { matter_number: "LGL-2026-00002", title: "M2", practice_area_id: "${pa_id}", matter_type_id: "${mt_id}", fiscal_period_id: "${fp_id}", lead_counsel_id: "${counsel_id}", primary_firm_id: "${firm_id}" }
              as: LegalOpsAnalyst
              captures: { m2_id: $.data.id }
            - call: "POST /legal-ops/matters/${m2_id}/assignments"
              payload: { counsel_id: "${counsel_id}", allocated_hours: 40 }
