            - call: "POST /price-integrity/price-change-files/${file_a}/label-tasks"
              payload: { store_id: "${store_a}", price_change_line_id: "${line_3}", aisle_id: "${aisle_a1}", assigned_associate_id: "${la1}", scheduled_start_at: "2026-08-03T10:01:00Z", scheduled_end_at: "2026-08-03T11:00:00Z", expected_price_change_file_version: "${file_v2}" }
              as: PricingAdmin
