  # ===========================================================================
  - rule_id: boundary_precision_check
    instances:

      - name: tier_lower_bound_is_inclusive_lower_basis_higher_royalty
        grounds:
          - calculations.royalty_due_computation
          - entities.ProductCategory.fields.tier_schedule
          - entities.RoyaltyReport.fields.applied_tier_rate_bps
        distinguishing_aspect: |
          The tier predicate is from_cents <= basis < to_cents, so a basis of exactly
          5000000 lands in the 800 bps tier (royalty 400000) while 4999999 stays in the
          1000 bps tier (royalty 500000). One cent LESS revenue produces 100000 cents
          MORE royalty. An exclusive lower bound or an inclusive upper bound flips one
          of the two reports.
        test_recipe:
          setup:
            - "clock at the mandatory default 2026-08-01T00:00:00Z"
            - "licensee LIC_Q ACTIVE; agreement AGR_Q ACTIVE on category JERSEY, MG 1000000, required_advance 250000 fully paid, term 2026-01-01..2027-12-31"
            - "one AUTHORIZED DEPARTMENT authorization covering 2026-01-01..2028-12-31"
            - "two reports on AGR_Q: 2026Q1 with gross 5000000 (exactly the tier boundary) and 2026Q2 with gross 4999999 (one cent below); both single-line, no closeout, no deductions"
            - "neither report is accepted, so both are rated against the same untouched ledger"
          setup_api_calls:
            - call: "POST /licensing/_clock/set_current_utc"
              payload: { current_utc: "2026-08-01T00:00:00Z" }
              as: LeagueLicensingManager
