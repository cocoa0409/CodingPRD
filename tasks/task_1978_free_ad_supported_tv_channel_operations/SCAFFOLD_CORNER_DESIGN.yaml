      - name: partner_reads_only_own_reports
        claim_type: peer_roles
        grounds: ["roles", "validations[priority=5]"]
        distinguishing_aspect: "Entity-backed scoping: partner p2's report list contains only p2's reports; reading p1's report by id is denied."
        test_recipe:
          setup: ["Channel ch; platforms p1, p2 ACTIVE; agreements + reports rp1 (p1) and rp2 (p2) for 2026-09, both DRAFT"]
