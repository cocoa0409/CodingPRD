scaffold_difficulty_design:

  # ===================================================================================
  - rule_id: dual_variant_calc
    instances:
      - name: energy_provisional_vs_actual_on_flight
        grounds:
          - calculations.flight_energy_requirement
          - entities.Flight.fields.required_energy_pct
          - entities.Flight.fields.actual_energy_pct
          - state_machines.Flight.RETURNING_to_RECOVERED
        distinguishing_aspect: |
          Entity domain #1 = sortie energy accounting on Flight: the provisional variant
          (required_energy_pct, written at dispatch) adds RESERVE_PCT=15.0 while the actual variant
          (actual_energy_pct, written at recovery) omits it, so feeding the identical route
          (actual_route_km == planned_route_km == 11.100) yields 38.6 and 23.6 on the same row.
        test_recipe:
          setup:
            - "Logical clock at 2026-06-01T09:00:00Z; service area Bay (centre 37.0/-122.0, max_range 12.0 km, max_payload 2500 g) with nest N1 at the centroid, 2 pads."
            - "Drone N101 (HEAVY, 2500 g, 60 km/h, 0 h since service) with a READY 100% pack installed; no weather observation exists, so wind is 0."
            - "Order for customer Ann (dropoff 37.05/-122.0 => one-way 5.550 km) of 2000 g STANDARD, dispatched, authorized, released, launched, arrived and dropped; flight is RETURNING with required_energy_pct already pinned at 38.6."
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-06-01T09:00:00Z" }
              as: PlatformAdmin
            - call: "POST /service-areas"
              payload: { name: "Bay", center_lat: 37.0, center_lon: -122.0, max_range_km: 12.0, max_payload_g: 2500 }
              as: PlatformAdmin
              captures: { sa_id: $.data.id }
            - call: "POST /nests"
              payload: { service_area_id: "${sa_id}", name: "N1", lat: 37.0, lon: -122.0, pad_count: 2, status: "OPEN" }
              as: PlatformAdmin
              captures: { nest_id: $.data.id }
            - call: "POST /batteries"
              payload: { nest_id: "${nest_id}", serial: "B-1", charge_pct: 100, cycle_count: 0 }
              as: MaintenanceTech
              captures: { bat_id: $.data.id }
            - call: "POST /batteries/${bat_id}/charge"
              payload: { target_charge_pct: 100 }
              as: MaintenanceTech
            - call: "POST /drones"
              payload: { home_nest_id: "${nest_id}", tail_number: "N101", airframe_class: "HEAVY", max_payload_g: 2500, cruise_speed_kmh: 60, hours_since_service: 0 }
              as: PlatformAdmin
              captures: { drone_id: $.data.id }
            - call: "POST /drones/${drone_id}/install-battery"
              payload: { battery_id: "${bat_id}" }
              as: MaintenanceTech
            - call: "POST /customers"
              payload: { name: "Ann", email: "ann@x.com", dropoff_lat: 37.05, dropoff_lon: -122.0 }
              as: PlatformAdmin
              captures: { cust_id: $.data.id }
            - call: "POST /orders"
              payload: { customer_id: "${cust_id}", service_area_id: "${sa_id}", payload_weight_g: 2000, priority: "STANDARD" }
              as: DispatchOperator
              as_user_id: "op-1"
              captures: { order_id: $.data.id, order_v: $.data.version }
            - call: "POST /orders/${order_id}/dispatch"
              payload: { nest_id: "${nest_id}", expected_order_version: "${order_v}" }
              as: DispatchOperator
              as_user_id: "op-1"
              captures: { flight_id: $.data.id }
            - call: "POST /flights/${flight_id}/file-authorization"
              payload: { grid_cells: ["37N122W-01"], requested_alt_ft: 350, window_start: "2026-06-01T08:00:00Z", window_end: "2026-06-01T12:00:00Z" }
              as: DispatchOperator
              as_user_id: "op-1"
              captures: { auth_id: $.data.id }
            - call: "POST /_laanc/decision"
              payload: { authorization_id: "${auth_id}", outcome: "APPROVED" }
              as: PlatformAdmin
            - call: "POST /flights/${flight_id}/release"
              payload: {}
              as: FlightDirector
              as_user_id: "fd-1"
            - call: "POST /flights/${flight_id}/launch"
              payload: {}
              as: DispatchOperator
              as_user_id: "op-1"
            - call: "POST /flights/${flight_id}/arrive"
              payload: {}
              as: DispatchOperator
              as_user_id: "op-1"
            - call: "POST /flights/${flight_id}/drop"
              payload: { hover_alt_ft: 15, photo_ref: "photo-1" }
              as: DispatchOperator
              as_user_id: "op-1"
          trigger:
            - call: "POST /flights/${flight_id}/recover"
              payload: { actual_route_km: 11.100 }
              as: DispatchOperator
              as_user_id: "op-1"
          assert:
            - "Flight.${flight_id}.planned_route_km == 11.100"
            - "Flight.${flight_id}.required_energy_pct == 38.6"
            - "Flight.${flight_id}.actual_energy_pct == 23.6"
            - "Flight.${flight_id}.required_energy_pct - Flight.${flight_id}.actual_energy_pct == 15.0"
            - "Battery.${bat_id}.charge_pct == 76.4"

      - name: risk_advisory_vs_blocking_on_drone
        grounds:
          - calculations.drone_airworthiness_risk
          - entities.Drone.fields.advisory_risk_score
          - entities.Drone.fields.blocking_risk_score
          - "validations[priority=15]"
        distinguishing_aspect: |
          Entity domain #2 = airworthiness scoring on Drone (a different subject and a different
          formula shape from the Flight energy pair): with hours_since_service=50, an installed pack
          at cycle_count=150 and one OPEN MAJOR incident, the advisory variant reads 55.0 (CLOSED
          bucket only) while the blocking variant reads 70.0 (OPEN+UNDER_REVIEW+CLOSED bucket), and
          only the blocking number gates POST /flights/{id}/release.
        test_recipe:
          setup:
            - "Clock at 2026-06-01T09:00:00Z; Bay service area with nest N1 (2 pads)."
            - "Drone N102 imported with hours_since_service=50 and a pack at cycle_count=150 charged to 100% (service_term 40.0 + cycle_term 15.0 = 55.0 base risk, below the 70.0 block threshold, so dispatch still selects it)."
            - "Order 2000 g STANDARD dispatched (required_energy_pct 38.6) and its authorization filed and APPROVED; a MAJOR incident is then filed against the drone and left OPEN."
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-06-01T09:00:00Z" }
              as: PlatformAdmin
            - call: "POST /service-areas"
              payload: { name: "Bay", center_lat: 37.0, center_lon: -122.0, max_range_km: 12.0, max_payload_g: 2500 }
              as: PlatformAdmin
              captures: { sa_id: $.data.id }
            - call: "POST /nests"
              payload: { service_area_id: "${sa_id}", name: "N1", lat: 37.0, lon: -122.0, pad_count: 2, status: "OPEN" }
              as: PlatformAdmin
              captures: { nest_id: $.data.id }
            - call: "POST /batteries"
              payload: { nest_id: "${nest_id}", serial: "B-2", charge_pct: 100, cycle_count: 150 }
              as: MaintenanceTech
              captures: { bat_id: $.data.id }
            - call: "POST /batteries/${bat_id}/charge"
              payload: { target_charge_pct: 100 }
              as: MaintenanceTech
            - call: "POST /drones"
              payload: { home_nest_id: "${nest_id}", tail_number: "N102", airframe_class: "HEAVY", max_payload_g: 2500, cruise_speed_kmh: 60, hours_since_service: 50 }
              as: PlatformAdmin
              captures: { drone_id: $.data.id }
            - call: "POST /drones/${drone_id}/install-battery"
              payload: { battery_id: "${bat_id}" }
              as: MaintenanceTech
            - call: "POST /customers"
              payload: { name: "Ann", email: "ann@x.com", dropoff_lat: 37.05, dropoff_lon: -122.0 }
              as: PlatformAdmin
              captures: { cust_id: $.data.id }
            - call: "POST /orders"
              payload: { customer_id: "${cust_id}", service_area_id: "${sa_id}", payload_weight_g: 2000, priority: "STANDARD" }
              as: DispatchOperator
              as_user_id: "op-1"
              captures: { order_id: $.data.id, order_v: $.data.version }
            - call: "POST /orders/${order_id}/dispatch"
              payload: { nest_id: "${nest_id}", expected_order_version: "${order_v}" }
              as: DispatchOperator
              as_user_id: "op-1"
              captures: { flight_id: $.data.id }
            - call: "POST /flights/${flight_id}/file-authorization"
              payload: { grid_cells: ["37N122W-01"], requested_alt_ft: 350, window_start: "2026-06-01T08:00:00Z", window_end: "2026-06-01T12:00:00Z" }
              as: DispatchOperator
              as_user_id: "op-1"
              captures: { auth_id: $.data.id }
            - call: "POST /_laanc/decision"
              payload: { authorization_id: "${auth_id}", outcome: "APPROVED" }
              as: PlatformAdmin
            - call: "POST /incidents"
              payload: { drone_id: "${drone_id}", severity: "MAJOR", category: "LOST_LINK", narrative: "C2 link dropped on the previous sortie", flight_id: "${flight_id}" }
              as: DispatchOperator
              as_user_id: "op-1"
              captures: { inc_id: $.data.id }
          trigger:
            - call: "GET /drones/${drone_id}"
              payload: {}
              as: MaintenanceTech
              as_user_id: "mt-1"
            - call: "POST /flights/${flight_id}/release"
              payload: {}
              as: FlightDirector
              as_user_id: "fd-1"
          assert:
            - "GET /drones/${drone_id} returns Drone.advisory_risk_score == 55.0"
            - "GET /drones/${drone_id} returns Drone.blocking_risk_score == 70.0"
            - "Drone.${drone_id}.advisory_risk_score != Drone.${drone_id}.blocking_risk_score"
            - "POST /flights/${flight_id}/release -> 409 with error_id ERR_DRONE_RISK_TOO_HIGH"
            - "Flight.${flight_id}.clearance_state == FILED (unchanged)"

  # ===================================================================================
  - rule_id: combinatorial_formula
    instances:
      - name: energy_formula_three_input_nonlinear_wind_clamp
        grounds:
          - calculations.flight_energy_requirement
          - calculations.planar_distance_km
          - entities.Flight.fields.wind_kph_at_dispatch
          - state_machines.Order.QUOTED_to_ASSIGNED
        distinguishing_aspect: |
          Mode (a): required_energy_pct multiplies three independent inputs with a clamped
          non-linear term — route_km * 1.6 * (1 + kg*0.08) * (1 + max(0, wind-10)*0.02) + 3.0 + 15.0.
          At wind 30 km/h the clamp contributes 1.4, giving 46.8 rather than the 38.6 the same order
          produces at wind <= 10; an implementation that drops the max(0, ...) clamp or applies the
          wind penalty additively lands on a different number.
        test_recipe:
          setup:
            - "Clock at 2026-06-01T09:00:00Z; Bay service area + nest N1 at the centroid, 2 pads; drone N101 (60 km/h) with a READY 100% pack."
            - "A single WeatherObservation for Bay at 2026-06-01T08:30:00Z: wind 30 km/h, gust 40 km/h, visibility 5 km, precip NONE (flyable, since 30 <= 35 and 40 <= 45)."
            - "Order 2000 g STANDARD, one-way 5.550 km => planned_route_km 11.100."
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-06-01T09:00:00Z" }
              as: PlatformAdmin
            - call: "POST /service-areas"
              payload: { name: "Bay", center_lat: 37.0, center_lon: -122.0, max_range_km: 12.0, max_payload_g: 2500 }
              as: PlatformAdmin
              captures: { sa_id: $.data.id }
            - call: "POST /nests"
              payload: { service_area_id: "${sa_id}", name: "N1", lat: 37.0, lon: -122.0, pad_count: 2, status: "OPEN" }
              as: PlatformAdmin
              captures: { nest_id: $.data.id }
            - call: "POST /weather-observations"
              payload: { service_area_id: "${sa_id}", observed_at: "2026-06-01T08:30:00Z", wind_kph: 30, gust_kph: 40, visibility_km: 5, precip: "NONE" }
              as: PlatformAdmin
            - call: "POST /batteries"
              payload: { nest_id: "${nest_id}", serial: "B-1", charge_pct: 100, cycle_count: 0 }
              as: MaintenanceTech
              captures: { bat_id: $.data.id }
            - call: "POST /batteries/${bat_id}/charge"
              payload: { target_charge_pct: 100 }
              as: MaintenanceTech
            - call: "POST /drones"
              payload: { home_nest_id: "${nest_id}", tail_number: "N101", airframe_class: "HEAVY", max_payload_g: 2500, cruise_speed_kmh: 60, hours_since_service: 0 }
              as: PlatformAdmin
              captures: { drone_id: $.data.id }
            - call: "POST /drones/${drone_id}/install-battery"
              payload: { battery_id: "${bat_id}" }
              as: MaintenanceTech
            - call: "POST /customers"
              payload: { name: "Ann", email: "ann@x.com", dropoff_lat: 37.05, dropoff_lon: -122.0 }
              as: PlatformAdmin
              captures: { cust_id: $.data.id }
            - call: "POST /orders"
              payload: { customer_id: "${cust_id}", service_area_id: "${sa_id}", payload_weight_g: 2000, priority: "STANDARD" }
              as: DispatchOperator
              as_user_id: "op-1"
              captures: { order_id: $.data.id, order_v: $.data.version }
          trigger:
            - call: "POST /orders/${order_id}/dispatch"
              payload: { nest_id: "${nest_id}", expected_order_version: "${order_v}" }
              as: DispatchOperator
              as_user_id: "op-1"
              captures: { flight_id: $.data.id }
          assert:
            - "Flight.${flight_id}.wind_kph_at_dispatch == 30.0"
            - "Flight.${flight_id}.planned_route_km == 11.100"
            - "Flight.${flight_id}.required_energy_pct == 46.8"
            - "Flight.${flight_id}.eta_recovery_at == 2026-06-01T09:15:00Z"

      - name: fee_component_rounding_order_pinned
        grounds:
          - calculations.order_fee_components
          - entities.Order.fields.delivery_fee
          - entities.Order.fields.airspace_surcharge
        distinguishing_aspect: |
          Mode (b): nested rounding whose ORDER changes the cents. For a 1050 g URGENT order at
          5.550 km the pinned order (round each component to 2 dp, sum to 7.45, then multiply by
          1.35 and round) gives delivery_fee == 10.06, whereas the forbidden "sum then round once"
          order ((6.50 + 0.945) * 1.35 = 10.05075) gives 10.05 — a one-cent divergence that pins
          which order the implementation used.
        test_recipe:
          setup:
            - "Clock at 2026-06-01T09:00:00Z; Bay service area (max_range 12.0 km, max_payload 2500 g); customer Ann at 37.05/-122.0 (5.550 km => tier-2 base 6.50)."
            - "No drone, nest or battery is needed: the fee is computed at order intake."
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-06-01T09:00:00Z" }
              as: PlatformAdmin
            - call: "POST /service-areas"
              payload: { name: "Bay", center_lat: 37.0, center_lon: -122.0, max_range_km: 12.0, max_payload_g: 2500 }
              as: PlatformAdmin
              captures: { sa_id: $.data.id }
            - call: "POST /customers"
              payload: { name: "Ann", email: "ann@x.com", dropoff_lat: 37.05, dropoff_lon: -122.0 }
              as: PlatformAdmin
              captures: { cust_id: $.data.id }
          trigger:
            - call: "POST /orders"
              payload: { customer_id: "${cust_id}", service_area_id: "${sa_id}", payload_weight_g: 1050, priority: "URGENT" }
              as: DispatchOperator
              as_user_id: "op-1"
              captures: { order_id: $.data.id }
          assert:
            - "Order.${order_id}.distance_km == 5.550"
            - "Order.${order_id}.delivery_fee == 10.06"
            - "Order.${order_id}.airspace_surcharge == 0.80"
            - "Order.${order_id}.order_total == 10.86"

      - name: surcharge_tier_keyed_on_presurcharge_fee
        grounds:
          - calculations.order_billing_total
          - entities.Order.fields.order_total
        distinguishing_aspect: |
          Mode (c): the circular-looking dependency total = fee + surcharge where surcharge is a
          tiered percentage — resolved by pinning the tier lookup on delivery_fee. A 1500 g STANDARD
          order has delivery_fee 7.85 (<= 8.00 => 5% => 0.39 => total 8.24); keying the tier on
          order_total instead (8.24 > 8.00 => 8%) would yield 0.63 and a total of 8.48.
        test_recipe:
          setup:
            - "Clock at 2026-06-01T09:00:00Z; Bay service area; customer Ann at 5.550 km (tier-2 base 6.50)."
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-06-01T09:00:00Z" }
              as: PlatformAdmin
            - call: "POST /service-areas"
              payload: { name: "Bay", center_lat: 37.0, center_lon: -122.0, max_range_km: 12.0, max_payload_g: 2500 }
              as: PlatformAdmin
              captures: { sa_id: $.data.id }
            - call: "POST /customers"
              payload: { name: "Ann", email: "ann@x.com", dropoff_lat: 37.05, dropoff_lon: -122.0 }
              as: PlatformAdmin
              captures: { cust_id: $.data.id }
          trigger:
            - call: "POST /orders"
              payload: { customer_id: "${cust_id}", service_area_id: "${sa_id}", payload_weight_g: 1500, priority: "STANDARD" }
              as: DispatchOperator
              as_user_id: "op-1"
              captures: { order_id: $.data.id }
          assert:
            - "Order.${order_id}.delivery_fee == 7.85"
            - "Order.${order_id}.airspace_surcharge == 0.39"
            - "Order.${order_id}.order_total == 8.24"

  # ===================================================================================
  - rule_id: non_linear_state_machine
    instances:
      - name: flight_parallel_ops_and_clearance_dimensions
        grounds:
          - state_machines.Flight.UNFILED_to_FILED
          - state_machines.Flight.FILED_to_CLEARED
          - state_machines.Flight.PLANNED_to_LAUNCHED
          - entities.Flight.fields.ops_state
          - entities.Flight.fields.clearance_state
        distinguishing_aspect: |
          Non-linear shape #1, entity Flight: two INDEPENDENT state dimensions on one row.
          file-authorization and release advance clearance_state UNFILED -> FILED -> CLEARED while
          ops_state stays pinned at PLANNED across all three observations; only launch moves
          ops_state, and it does so while clearance_state stays CLEARED.
        test_recipe:
          setup:
            - "Clock 2026-06-01T09:00:00Z; Bay + nest N1 (2 pads); drone N101 with a READY 100% pack; order 2000 g STANDARD dispatched => Flight(ops_state=PLANNED, clearance_state=UNFILED)."
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-06-01T09:00:00Z" }
              as: PlatformAdmin
            - call: "POST /service-areas"
              payload: { name: "Bay", center_lat: 37.0, center_lon: -122.0, max_range_km: 12.0, max_payload_g: 2500 }
              as: PlatformAdmin
              captures: { sa_id: $.data.id }
            - call: "POST /nests"
              payload: { service_area_id: "${sa_id}", name: "N1", lat: 37.0, lon: -122.0, pad_count: 2, status: "OPEN" }
              as: PlatformAdmin
              captures: { nest_id: $.data.id }
            - call: "POST /batteries"
              payload: { nest_id: "${nest_id}", serial: "B-1", charge_pct: 100, cycle_count: 0 }
              as: MaintenanceTech
              captures: { bat_id: $.data.id }
            - call: "POST /batteries/${bat_id}/charge"
              payload: { target_charge_pct: 100 }
              as: MaintenanceTech
            - call: "POST /drones"
              payload: { home_nest_id: "${nest_id}", tail_number: "N101", airframe_class: "HEAVY", max_payload_g: 2500, cruise_speed_kmh: 60, hours_since_service: 0 }
              as: PlatformAdmin
              captures: { drone_id: $.data.id }
            - call: "POST /drones/${drone_id}/install-battery"
              payload: { battery_id: "${bat_id}" }
              as: MaintenanceTech
            - call: "POST /customers"
              payload: { name: "Ann", email: "ann@x.com", dropoff_lat: 37.05, dropoff_lon: -122.0 }
              as: PlatformAdmin
              captures: { cust_id: $.data.id }
            - call: "POST /orders"
              payload: { customer_id: "${cust_id}", service_area_id: "${sa_id}", payload_weight_g: 2000, priority: "STANDARD" }
              as: DispatchOperator
              as_user_id: "op-1"
              captures: { order_id: $.data.id, order_v: $.data.version }
            - call: "POST /orders/${order_id}/dispatch"
              payload: { nest_id: "${nest_id}", expected_order_version: "${order_v}" }
              as: DispatchOperator
              as_user_id: "op-1"
              captures: { flight_id: $.data.id }
          trigger:
            - call: "POST /flights/${flight_id}/file-authorization"
              payload: { grid_cells: ["37N122W-01"], requested_alt_ft: 350, window_start: "2026-06-01T08:00:00Z", window_end: "2026-06-01T12:00:00Z" }
              as: DispatchOperator
              as_user_id: "op-1"
              captures: { auth_id: $.data.id }
            - call: "POST /_laanc/decision"
              payload: { authorization_id: "${auth_id}", outcome: "APPROVED" }
              as: PlatformAdmin
            - call: "POST /flights/${flight_id}/release"
              payload: {}
              as: FlightDirector
              as_user_id: "fd-1"
            - call: "POST /flights/${flight_id}/launch"
              payload: {}
              as: DispatchOperator
              as_user_id: "op-1"
          assert:
            - "after file-authorization: Flight.${flight_id}.clearance_state == FILED and Flight.${flight_id}.ops_state == PLANNED"
            - "after release: Flight.${flight_id}.clearance_state == CLEARED and Flight.${flight_id}.ops_state == PLANNED"
            - "after launch: Flight.${flight_id}.ops_state == LAUNCHED and Flight.${flight_id}.clearance_state == CLEARED"
            - "Flight.${flight_id}.filed_by_user_id == op-1 and Flight.${flight_id}.released_by_user_id == fd-1"

      - name: drone_cyclic_idle_reserved_inflight_idle_twice
        grounds:
          - state_machines.Drone.IDLE_to_RESERVED
          - state_machines.Drone.RESERVED_to_IN_FLIGHT
          - state_machines.Drone.IN_FLIGHT_to_IDLE
          - entities.Drone.fields.status
          - entities.Drone.fields.flight_hours
        distinguishing_aspect: |
          Non-linear shape #2, entity Drone (different entity from the Flight instance above):
          a genuine cycle IDLE -> RESERVED -> IN_FLIGHT -> IDLE that the SAME airframe traverses
          twice, accumulating flight_hours 0.19 then 0.38 while returning to status IDLE each lap.
        test_recipe:
          setup:
            - "Clock 2026-06-01T09:00:00Z; Bay + nest N1 (2 pads); drone N101 (60 km/h) with a READY 100% pack; two orders for Ann, each 2000 g STANDARD."
            - "Sortie 1 flown end to end (dispatch -> recover with actual_route_km 11.100), leaving the drone IDLE with flight_hours 0.19 and the pack COOLDOWN at 76.4%."
            - "Pack recharged to 100% (COOLDOWN -> READY) so the airframe is eligible again."
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-06-01T09:00:00Z" }
              as: PlatformAdmin
            - call: "POST /service-areas"
              payload: { name: "Bay", center_lat: 37.0, center_lon: -122.0, max_range_km: 12.0, max_payload_g: 2500 }
              as: PlatformAdmin
              captures: { sa_id: $.data.id }
            - call: "POST /nests"
              payload: { service_area_id: "${sa_id}", name: "N1", lat: 37.0, lon: -122.0, pad_count: 2, status: "OPEN" }
              as: PlatformAdmin
