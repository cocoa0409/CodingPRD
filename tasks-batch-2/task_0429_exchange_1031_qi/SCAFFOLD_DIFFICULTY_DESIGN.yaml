scaffold_difficulty_design:

  # =====================================================================
  # Rule 1 — Dual-variant calculations across different entity domains
  # =====================================================================
  - rule_id: dual_variant_calc
    instances:
      - name: boot_final_vs_improvement_variant_on_replacement
        grounds:
          - calculations.boot_and_recognized_gain
          - entities.ReplacementProperty.fields.improvement_value
          - entities.Exchange.fields.recognized_gain
        distinguishing_aspect: |
          On the ReplacementProperty/Exchange-gain domain, an IMPROVEMENT exchange counts
          improvement_value into replacement_value (cash_applied 420000, cash_boot 50000),
          whereas the FORWARD final_boot variant on the SAME purchase_price ignores
          improvements (cash_applied 300000, cash_boot 170000) — different recognized_gain.
        test_recipe:
          setup:
            - "An IMPROVEMENT exchange, relinquished closed: FMV 500000, selling_expenses 30000, mortgage_payoff 0, adjusted_basis 200000 -> net_proceeds 470000, realized_gain 270000."
            - "A FINALIZED identification with one acquired candidate of estimated_fmv 420000."
            - "Clock at 2026-03-15 (within both windows)."
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-03-01T00:00:00Z" }
              as: QICoordinator
            - call: "POST /exchangers"
              payload: { legal_name: "Imp Taxpayer", taxpayer_id: "TP-IMP-1", email: "imp@x.com" }
              as: QICoordinator
              captures: { exr_id: $.data.id }
            - call: "POST /exchanges"
              payload: { exchanger_id: "${exr_id}", exchange_type: "IMPROVEMENT" }
              as: QICoordinator
              as_user_id: "coord-imp"
              captures: { ex_id: $.data.id }
            - call: "POST /exchanges/${ex_id}/relinquished-properties"
              payload: { address: "1 Old St", fair_market_value: 500000, selling_expenses: 30000, mortgage_payoff: 0, adjusted_basis: 200000 }
              as: QICoordinator
              captures: { rel_id: $.data.id }
            - call: "POST /exchanges/${ex_id}/trust"
              payload: {}
              as: QICoordinator
              captures: { tr_id: $.data.id }
            - call: "POST /exchanges/${ex_id}/close-relinquished"
              payload: {}
              as: QICoordinator
            - call: "POST /exchanges/${ex_id}/identifications"
              payload: { method: "THREE_PROPERTY" }
              as: QICoordinator
              captures: { idn_id: $.data.id }
            - call: "POST /identifications/${idn_id}/candidates"
              payload: { description: "New build lot", estimated_fmv: 420000 }
              as: QICoordinator
              captures: { cand_id: $.data.id }
            - call: "POST /identifications/${idn_id}/finalize"
              payload: {}
              as: QICoordinator
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-03-15T00:00:00Z" }
              as: QICoordinator
          trigger:
            - call: "POST /exchanges/${ex_id}/replacement-properties"
              payload: { identified_property_id: "${cand_id}", purchase_price: 300000, replacement_debt: 0, improvement_value: 120000 }
              as: QICoordinator
              captures: { rp_id: $.data.id }
          assert:
            - "ReplacementProperty.${rp_id}.cash_applied == 420000.00"
            - "Exchange.${ex_id}.recognized_gain == 50000.00"
            - "Exchange.${ex_id}.deferred_gain == 220000.00"
            - "If improvement_value were ignored (final_boot variant) cash_applied would be 300000.00 and recognized_gain 170000.00 — the variant divergence is observable on recognized_gain."

      - name: trust_balance_cleared_vs_reserved_variant
        grounds:
          - calculations.trust_available_balance
          - entities.QualifiedTrust.fields.available_balance
          - entities.Disbursement.fields.settlement_status
        distinguishing_aspect: |
          On the QualifiedTrust ledger domain, available_balance counts ONLY SETTLED
          disbursements (cleared variant -> 350000 with a REQUESTED-but-unapproved 1500
          fee outstanding), not REQUESTED reservations; a reserved-view interpretation
          would yield 348500 — the scaffold pins the cleared variant.
        test_recipe:
          setup:
            - "A FORWARD exchange closed with net_proceeds 350000 deposited in trust."
            - "One QI_FEE disbursement of 1500 created but NOT yet approved (settlement_status REQUESTED)."
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-03-01T00:00:00Z" }
              as: QICoordinator
            - call: "POST /exchangers"
              payload: { legal_name: "Fwd Taxpayer", taxpayer_id: "TP-FWD-1", email: "fwd@x.com" }
              as: QICoordinator
              captures: { exr_id: $.data.id }
            - call: "POST /exchanges"
              payload: { exchanger_id: "${exr_id}", exchange_type: "FORWARD" }
              as: QICoordinator
              as_user_id: "coord-fwd"
              captures: { ex_id: $.data.id }
            - call: "POST /exchanges/${ex_id}/relinquished-properties"
              payload: { address: "2 Old St", fair_market_value: 500000, selling_expenses: 30000, mortgage_payoff: 120000, adjusted_basis: 180000 }
              as: QICoordinator
            - call: "POST /exchanges/${ex_id}/trust"
              payload: {}
              as: QICoordinator
              captures: { tr_id: $.data.id }
            - call: "POST /exchanges/${ex_id}/close-relinquished"
              payload: {}
              as: QICoordinator
            - call: "GET /exchanges/${ex_id}/trust"
              payload: {}
              as: QICoordinator
              captures: { tr_v: "$.data[0].version" }
            - call: "POST /disbursements"
              payload: { exchange_id: "${ex_id}", purpose: "QI_FEE", amount: 1500, expected_qualified_trust_version: "${tr_v}" }
              as: QICoordinator
          trigger:
            - call: "GET /exchanges/${ex_id}/trust"
              payload: {}
              as: SettlementOfficer
              captures: { avail: "$.data[0].available_balance" }
          assert:
            - "QualifiedTrust.${tr_id}.available_balance == 350000.00 (cleared variant: REQUESTED 1500 fee not yet deducted)"
            - "deposited_amount == 350000.00"

  # =====================================================================
  # Rule 2 — Combinatorial formulas across different modes
  # =====================================================================
  - rule_id: combinatorial_formula
    instances:
      - name: boot_recognized_gain_nonlinear_min_max_branch
        grounds:
          - calculations.boot_and_recognized_gain
          - entities.RelinquishedProperty.fields.mortgage_payoff
          - entities.ReplacementProperty.fields.replacement_debt
        distinguishing_aspect: |
          Mode (a): recognized_gain combines >=3 inputs with nested max/min and an
          exchange_type branch — cash_boot=max(0, deposited-cash_applied),
          mortgage_boot=max(0, mortgage_payoff-replacement_debt),
          recognized=min(realized_gain, cash_boot+mortgage_boot) — a non-linear interaction.
        test_recipe:
          setup:
            - "FORWARD exchange closed: net_proceeds 350000, realized_gain 290000, mortgage_payoff 120000."
            - "FINALIZED identification with one candidate of estimated_fmv 420000."
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-03-01T00:00:00Z" }
              as: QICoordinator
            - call: "POST /exchangers"
              payload: { legal_name: "Boot TP", taxpayer_id: "TP-BOOT-1", email: "boot@x.com" }
              as: QICoordinator
              captures: { exr_id: $.data.id }
            - call: "POST /exchanges"
              payload: { exchanger_id: "${exr_id}", exchange_type: "FORWARD" }
              as: QICoordinator
              as_user_id: "coord-boot"
              captures: { ex_id: $.data.id }
            - call: "POST /exchanges/${ex_id}/relinquished-properties"
              payload: { address: "3 Old St", fair_market_value: 500000, selling_expenses: 30000, mortgage_payoff: 120000, adjusted_basis: 180000 }
              as: QICoordinator
            - call: "POST /exchanges/${ex_id}/trust"
              payload: {}
              as: QICoordinator
            - call: "POST /exchanges/${ex_id}/close-relinquished"
              payload: {}
              as: QICoordinator
            - call: "POST /exchanges/${ex_id}/identifications"
              payload: { method: "THREE_PROPERTY" }
              as: QICoordinator
              captures: { idn_id: $.data.id }
            - call: "POST /identifications/${idn_id}/candidates"
              payload: { description: "Replacement A", estimated_fmv: 420000 }
              as: QICoordinator
              captures: { cand_id: $.data.id }
            - call: "POST /identifications/${idn_id}/finalize"
              payload: {}
              as: QICoordinator
          trigger:
            - call: "POST /exchanges/${ex_id}/replacement-properties"
              payload: { identified_property_id: "${cand_id}", purchase_price: 420000, replacement_debt: 100000 }
              as: QICoordinator
              captures: { rp_id: $.data.id }
          assert:
            - "ReplacementProperty.${rp_id}.cash_applied == 320000.00"
            - "Exchange.${ex_id}.recognized_gain == 50000.00 (cash_boot 30000 + mortgage_boot 20000, capped by realized 290000)"
            - "Exchange.${ex_id}.deferred_gain == 240000.00"

      - name: deadline_evaluation_order_pinned_dependency
        grounds:
          - calculations.net_proceeds
          - calculations.realized_gain
          - entities.Exchange.fields.id_deadline_at
          - entities.Exchange.fields.exchange_deadline_at
        distinguishing_aspect: |
          Mode (c): the close action has a pinned evaluation chain where order is explicit —
          relinquished_closing_at must be stamped first (Day-0), then id_deadline_at and
          exchange_deadline_at derive from it, then net_proceeds is computed and deposited;
          computing deadlines before stamping the anchor would be undefined. The scaffold
          pins relinquished_closing_at -> deadlines -> deposit order.
        test_recipe:
          setup:
            - "A DRAFT FORWARD exchange with relinquished property (FMV 500000, expenses 30000, payoff 120000) and an empty trust, clock at 2026-03-01."
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-03-01T00:00:00Z" }
              as: QICoordinator
            - call: "POST /exchangers"
              payload: { legal_name: "Deadline TP", taxpayer_id: "TP-DL-1", email: "dl@x.com" }
              as: QICoordinator
              captures: { exr_id: $.data.id }
            - call: "POST /exchanges"
              payload: { exchanger_id: "${exr_id}", exchange_type: "FORWARD" }
              as: QICoordinator
              as_user_id: "coord-dl"
              captures: { ex_id: $.data.id }
            - call: "POST /exchanges/${ex_id}/relinquished-properties"
              payload: { address: "4 Old St", fair_market_value: 500000, selling_expenses: 30000, mortgage_payoff: 120000, adjusted_basis: 180000 }
              as: QICoordinator
            - call: "POST /exchanges/${ex_id}/trust"
              payload: {}
              as: QICoordinator
              captures: { tr_id: $.data.id }
          trigger:
            - call: "POST /exchanges/${ex_id}/close-relinquished"
              payload: {}
              as: QICoordinator
              captures: { idd: $.data.id_deadline_at, exd: $.data.exchange_deadline_at }
          assert:
            - "Exchange.${ex_id}.relinquished_closing_at == 2026-03-01T00:00:00.000Z"
            - "Exchange.${ex_id}.id_deadline_at == 2026-04-15T00:00:00.000Z"
            - "Exchange.${ex_id}.exchange_deadline_at == 2026-08-28T00:00:00.000Z"
            - "Exchange.${ex_id}.realized_gain == 290000.00"
            - "QualifiedTrust.${tr_id}.deposited_amount == 350000.00 (computed and deposited AFTER the anchor/deadlines, per pinned order)"

  # =====================================================================
  # Rule 3 — Non-linear state-machine shape on different entities
  # =====================================================================
  - rule_id: non_linear_state_machine
    instances:
      - name: disbursement_settle_then_void_revert_cycle
        grounds:
          - state_machines.Disbursement.REQUESTED_to_SETTLED
          - state_machines.Disbursement.SETTLED_to_VOIDED
          - entities.Disbursement.fields.settlement_status
        distinguishing_aspect: |
          On Disbursement, SETTLED->VOIDED is a compensating revert (not a forward-only
          pipeline): an approved disbursement can be voided, restoring the trust credit —
          a non-linear branch where REQUESTED has two outgoing edges (SETTLED, VOIDED).
        test_recipe:
          setup:
            - "FORWARD exchange closed, trust holds 350000; a QI_FEE disbursement of 1500 is created and APPROVED (SETTLED), trust available 348500."
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-03-01T00:00:00Z" }
              as: QICoordinator
            - call: "POST /exchangers"
              payload: { legal_name: "Void TP", taxpayer_id: "TP-VOID-1", email: "void@x.com" }
              as: QICoordinator
              captures: { exr_id: $.data.id }
            - call: "POST /exchanges"
              payload: { exchanger_id: "${exr_id}", exchange_type: "FORWARD" }
              as: QICoordinator
              as_user_id: "coord-void"
              captures: { ex_id: $.data.id }
            - call: "POST /exchanges/${ex_id}/relinquished-properties"
              payload: { address: "5 Old St", fair_market_value: 500000, selling_expenses: 30000, mortgage_payoff: 120000, adjusted_basis: 180000 }
              as: QICoordinator
            - call: "POST /exchanges/${ex_id}/trust"
              payload: {}
              as: QICoordinator
              captures: { tr_id: $.data.id }
            - call: "POST /exchanges/${ex_id}/close-relinquished"
              payload: {}
              as: QICoordinator
            - call: "GET /exchanges/${ex_id}/trust"
              payload: {}
              as: QICoordinator
              captures: { tr_v: "$.data[0].version" }
            - call: "POST /disbursements"
              payload: { exchange_id: "${ex_id}", purpose: "QI_FEE", amount: 1500, expected_qualified_trust_version: "${tr_v}" }
              as: QICoordinator
              captures: { dis_id: $.data.id }
            - call: "POST /disbursements/${dis_id}/approve"
              payload: {}
              as: SettlementOfficer
              as_user_id: "officer-1"
          trigger:
            - call: "POST /disbursements/${dis_id}/void"
              payload: {}
              as: SettlementOfficer
              as_user_id: "officer-1"
          assert:
            - "Disbursement.${dis_id}.settlement_status == VOIDED"
            - "QualifiedTrust.${tr_id}.available_balance == 350000.00 (credit restored from 348500 after void)"

      - name: identification_draft_branches_finalize_or_revoke
        grounds:
          - state_machines.Identification.DRAFT_to_FINALIZED
          - state_machines.Identification.DRAFT_to_REVOKED
          - entities.Identification.fields.status
        distinguishing_aspect: |
          On Identification (a different entity from Disbursement), DRAFT forks to two
          mutually exclusive terminals FINALIZED and REVOKED with divergent side-effects
          (finalize cascades posture->IDENTIFIED; revoke withdraws candidates) — a branching
          fork, not a linear chain.
        test_recipe:
          setup:
            - "FORWARD exchange ACTIVE; a DRAFT identification with one candidate (estimated_fmv 420000)."
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-03-01T00:00:00Z" }
              as: QICoordinator
            - call: "POST /exchangers"
              payload: { legal_name: "Revoke TP", taxpayer_id: "TP-REV-1", email: "rev@x.com" }
              as: QICoordinator
              captures: { exr_id: $.data.id }
            - call: "POST /exchanges"
              payload: { exchanger_id: "${exr_id}", exchange_type: "FORWARD" }
              as: QICoordinator
              as_user_id: "coord-rev"
              captures: { ex_id: $.data.id }
            - call: "POST /exchanges/${ex_id}/relinquished-properties"
              payload: { address: "6 Old St", fair_market_value: 500000, selling_expenses: 30000, mortgage_payoff: 120000, adjusted_basis: 180000 }
              as: QICoordinator
            - call: "POST /exchanges/${ex_id}/trust"
              payload: {}
              as: QICoordinator
            - call: "POST /exchanges/${ex_id}/close-relinquished"
              payload: {}
              as: QICoordinator
            - call: "POST /exchanges/${ex_id}/identifications"
              payload: { method: "THREE_PROPERTY" }
              as: QICoordinator
              captures: { idn_id: $.data.id }
            - call: "POST /identifications/${idn_id}/candidates"
              payload: { description: "Cand R", estimated_fmv: 420000 }
              as: QICoordinator
              captures: { cand_id: $.data.id }
          trigger:
            - call: "POST /identifications/${idn_id}/revoke"
              payload: {}
              as: QICoordinator
          assert:
            - "Identification.${idn_id}.status == REVOKED"
            - "IdentifiedProperty.${cand_id}.status == WITHDRAWN (cascade down)"
            - "Exchange.${ex_id}.compliance_posture == OPEN (no FINALIZED identification; revoke branch did not set IDENTIFIED)"

  # =====================================================================
  # Rule 4 — Transitive cascade chains from different triggers
  # =====================================================================
  - rule_id: transitive_cascade
    instances:
      - name: close_relinquished_cascade_depth3
        grounds:
          - state_machines.Exchange.DRAFT_to_ACTIVE
          - calculations.net_proceeds
          - entities.QualifiedTrust.fields.available_balance
          - entities.RelinquishedProperty.fields.net_proceeds
        distinguishing_aspect: |
          Depth-3 chain from close-relinquished: close stamps the RelinquishedProperty and
          computes its net_proceeds (link 1: Exchange->RelinquishedProperty), that net_proceeds
          deposit then credits QualifiedTrust.deposited_amount (link 2: RelinquishedProperty->
          QualifiedTrust), which then sets QualifiedTrust.available_balance to the same figure
          (link 3: deposited_amount->available_balance). Each link is caused by the prior.
        test_recipe:
          setup:
            - "A DRAFT FORWARD exchange with relinquished property (FMV 500000, expenses 30000, payoff 120000) and an empty trust (available 0)."
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-03-01T00:00:00Z" }
              as: QICoordinator
            - call: "POST /exchangers"
              payload: { legal_name: "Cascade TP", taxpayer_id: "TP-CAS-1", email: "cas@x.com" }
              as: QICoordinator
              captures: { exr_id: $.data.id }
            - call: "POST /exchanges"
              payload: { exchanger_id: "${exr_id}", exchange_type: "FORWARD" }
              as: QICoordinator
              as_user_id: "coord-cas"
              captures: { ex_id: $.data.id }
            - call: "POST /exchanges/${ex_id}/relinquished-properties"
              payload: { address: "7 Old St", fair_market_value: 500000, selling_expenses: 30000, mortgage_payoff: 120000, adjusted_basis: 180000 }
              as: QICoordinator
              captures: { rel_id: $.data.id }
            - call: "POST /exchanges/${ex_id}/trust"
              payload: {}
              as: QICoordinator
              captures: { tr_id: $.data.id }
          trigger:
            - call: "POST /exchanges/${ex_id}/close-relinquished"
              payload: {}
              as: QICoordinator
          assert:
            - "RelinquishedProperty.${rel_id}.net_proceeds == 350000.00"
            - "QualifiedTrust.${tr_id}.deposited_amount == 350000.00"
            - "QualifiedTrust.${tr_id}.available_balance == 350000.00"

      - name: complete_exchange_cascade_depth2_trust_lock
        grounds:
          - state_machines.Exchange.ACTIVE_to_COMPLETED
          - entities.QualifiedTrust.fields.is_locked
          - entities.Exchange.fields.compliance_posture
        distinguishing_aspect: |
          Depth-2 chain from a DIFFERENT trigger (complete, not close): completing the exchange
          recomputes compliance_posture->COMPLETED (link 1: Exchange status->posture), which then
          locks the QualifiedTrust (link 2: posture->QualifiedTrust.is_locked=true). The lock is
          caused by the posture change, not directly by the complete call.
        test_recipe:
          setup:
            - "FORWARD exchange ACTIVE with a FINALIZED identification of one candidate (420000), the replacement acquired (so candidate status ACQUIRED), recognized/deferred gain set; clock within 180-day window."
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-03-01T00:00:00Z" }
              as: QICoordinator
            - call: "POST /exchangers"
              payload: { legal_name: "Complete TP", taxpayer_id: "TP-CMP-1", email: "cmp@x.com" }
              as: QICoordinator
              captures: { exr_id: $.data.id }
            - call: "POST /exchanges"
              payload: { exchanger_id: "${exr_id}", exchange_type: "FORWARD" }
              as: QICoordinator
              as_user_id: "coord-cmp"
              captures: { ex_id: $.data.id }
            - call: "POST /exchanges/${ex_id}/relinquished-properties"
              payload: { address: "8 Old St", fair_market_value: 500000, selling_expenses: 30000, mortgage_payoff: 120000, adjusted_basis: 180000 }
              as: QICoordinator
            - call: "POST /exchanges/${ex_id}/trust"
              payload: {}
              as: QICoordinator
              captures: { tr_id: $.data.id }
            - call: "POST /exchanges/${ex_id}/close-relinquished"
              payload: {}
              as: QICoordinator
            - call: "POST /exchanges/${ex_id}/identifications"
              payload: { method: "THREE_PROPERTY" }
              as: QICoordinator
              captures: { idn_id: $.data.id }
            - call: "POST /identifications/${idn_id}/candidates"
              payload: { description: "Cand C", estimated_fmv: 420000 }
              as: QICoordinator
              captures: { cand_id: $.data.id }
            - call: "POST /identifications/${idn_id}/finalize"
              payload: {}
              as: QICoordinator
            - call: "POST /exchanges/${ex_id}/replacement-properties"
              payload: { identified_property_id: "${cand_id}", purchase_price: 420000, replacement_debt: 120000 }
              as: QICoordinator
          trigger:
            - call: "POST /exchanges/${ex_id}/complete"
              payload: {}
              as: QICoordinator
          assert:
            - "Exchange.${ex_id}.compliance_posture == COMPLETED"
            - "Exchange.${ex_id}.status == COMPLETED"
            - "QualifiedTrust.${tr_id}.is_locked == true (cascade from posture)"

  # =====================================================================
  # Rule 5 — Validation priority conflicts across different error-category pairs
  # =====================================================================
  - rule_id: priority_pair_validation_conflict
    instances:
      - name: state_locked_beats_fiscal_insufficient_funds
        grounds:
          - validations[priority=12]
          - validations[priority=13]
          - errors[ERR_TRUST_LOCKED]
          - errors[ERR_INSUFFICIENT_TRUST_FUNDS]
        distinguishing_aspect: |
          state (ERR_TRUST_LOCKED, priority 12) vs business_fiscal (ERR_INSUFFICIENT_TRUST_FUNDS,
          priority 13): approving a disbursement of amount 999999 (would overdraw) on a trust
          that is ALSO locked must return ERR_TRUST_LOCKED, proving the state check precedes
          the fiscal check.
        test_recipe:
          setup:
            - "FORWARD exchange FAILED (trust locked) but with a leftover REQUESTED disbursement of amount 999999 created before failure."
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-03-01T00:00:00Z" }
              as: QICoordinator
            - call: "POST /exchangers"
              payload: { legal_name: "Lock TP", taxpayer_id: "TP-LCK-1", email: "lck@x.com" }
              as: QICoordinator
              captures: { exr_id: $.data.id }
            - call: "POST /exchanges"
              payload: { exchanger_id: "${exr_id}", exchange_type: "FORWARD" }
              as: QICoordinator
              as_user_id: "coord-lck"
              captures: { ex_id: $.data.id }
            - call: "POST /exchanges/${ex_id}/relinquished-properties"
              payload: { address: "9 Old St", fair_market_value: 500000, selling_expenses: 30000, mortgage_payoff: 120000, adjusted_basis: 180000 }
              as: QICoordinator
            - call: "POST /exchanges/${ex_id}/trust"
              payload: {}
              as: QICoordinator
            - call: "POST /exchanges/${ex_id}/close-relinquished"
              payload: {}
              as: QICoordinator
            - call: "GET /exchanges/${ex_id}/trust"
              payload: {}
              as: QICoordinator
              captures: { tr_v: "$.data[0].version" }
            - call: "POST /disbursements"
              payload: { exchange_id: "${ex_id}", purpose: "BOOT_RETURN", amount: 999999, expected_qualified_trust_version: "${tr_v}" }
              as: QICoordinator
              captures: { dis_id: $.data.id }
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-09-01T00:00:00Z" }
              as: QICoordinator
            - call: "POST /exchanges/${ex_id}/fail"
              payload: {}
              as: QICoordinator
          trigger:
            - call: "POST /disbursements/${dis_id}/approve"
              payload: {}
              as: SettlementOfficer
              as_user_id: "officer-1"
              captures: { err: $.data.error_id }
          assert:
            - "response error_id == ERR_TRUST_LOCKED (priority-12 state beats priority-13 fiscal)"
            - "HTTP status == 409"

      - name: segregation_beats_fiscal_insufficient_funds
        grounds:
          - validations[priority=6]
          - validations[priority=13]
          - errors[ERR_SEGREGATION_OF_DUTIES]
          - errors[ERR_INSUFFICIENT_TRUST_FUNDS]
        distinguishing_aspect: |
          business_safety (ERR_SEGREGATION_OF_DUTIES, priority 6) vs business_fiscal
          (ERR_INSUFFICIENT_TRUST_FUNDS, priority 13): on the approve endpoint a single call
          where the officer is the same operator as the coordinator AND the amount (999999)
          overdraws the 350000 trust must return ERR_SEGREGATION_OF_DUTIES, proving the safety
          check precedes the fiscal check. This is a different error-category pair than the
          state-vs-fiscal conflict of state_locked_beats_fiscal_insufficient_funds.
        test_recipe:
          setup:
            - "FORWARD exchange ACTIVE (trust unlocked, available 350000) with coordinator_user_id 'dual-op'; a REQUESTED ACQUISITION disbursement of 999999."
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-03-01T00:00:00Z" }
