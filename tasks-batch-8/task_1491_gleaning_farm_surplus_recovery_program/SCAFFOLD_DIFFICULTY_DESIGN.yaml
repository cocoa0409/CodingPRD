  # ===========================================================================
  # Rule 5 — priority_pair_validation_conflict (different error-category pairs)
  # ===========================================================================
  - rule_id: priority_pair_validation_conflict
    instances:
      - name: deliver_state_vs_safety_pair
        grounds:
          - validations[priority=4]
          - validations[priority=5]
          - state_machines.Distribution.SCHEDULED_to_DELIVERED
        distinguishing_aspect: |
          Pair state vs business_safety: a deliver attempt where BOTH (a) the
          distribution is already CANCELLED (state violation, priority 4) and
          (b) the event has a breaching TempLog on a refrigeration-required offer
          (safety violation, priority 5) MUST return ERR_INVALID_STATE — the
          state check outranks the safety check even though safety is
          domain-critical.
        test_recipe:
          setup:
            - "Refrigeration-required offer/event harvested 100.0; breaching TempLog 45.0F recorded; distribution planned 50.0 SCHEDULED then CANCELLED"
