            - "The cure returns HTTP 409 with error_id == \"ERR_INVALID_STATE_TRANSITION\" — the substantially-all percentage being far below 85.00 does NOT make the QEI curable; only an AT_RISK status does"
            - "QEI.${qei_id}.uninvested_cash_cents is still 65000000 and substantially_all_pct_direct is still 31.58"
            - "The follow-up list shows total_count == 1 — no created_by_cure QLICI was written"
