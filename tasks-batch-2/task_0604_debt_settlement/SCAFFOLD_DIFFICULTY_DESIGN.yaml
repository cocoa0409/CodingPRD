  # =========================================================================
  - rule_id: compensating_invariant
    instances:
      - name: account_cash_conserved_on_settlement_void
        grounds:
          - state_machines.Settlement.FUNDED_to_VOIDED
          - entities.DedicatedAccount.fields.balance
          - calculations.account_reserve_state
        distinguishing_aspect: |
          Conserved quantity = dedicated-account CASH. funding then voiding leaves
          DedicatedAccount.balance == sum(CLEARED deposits) - 0; the funded principal is
          credited back and the fee is WAIVED (never debited), so balance returns exactly
          to its pre-funding value.
        test_recipe:
          setup:
            - "Clock 2026-06-01T00:00:00Z. Client+Program. One debt 5000 (tier 0.25). Program ACTIVE."
            - "Six CLEARED deposits of 600 (balance 3600). Offer 0.40 accepted (need 2500). Settlement funded (balance 1600, fee 500 OUTSTANDING not yet paid)."
