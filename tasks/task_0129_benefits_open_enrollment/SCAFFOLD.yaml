    output: PlanTier
    side_effects: ["benefit_type for downstream enrollments derived from the offering"]

  - method: GET
    path: "/plan-tiers/{id}"
    description: "Fetch a plan tier"
    roles: [BenefitsAdmin, PayrollOfficer, ComplianceOfficer, DependentVerifier]
    code: 200
    input: []
    output: PlanTier
    side_effects: []

