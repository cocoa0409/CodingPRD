      - name: offer_capacity_counts_seats_plus_outstanding_offers
        claim_type: aggregate_validation
        grounds:
          - validations[priority=90]
          - errors[ERR_SECTION_CAPACITY_EXCEEDED]
          - entities.Ensemble.fields.offered_count
        distinguishing_aspect: |
          The capacity guard is an aggregate over two row sets, not a single stored
          counter: filled_count (0) PLUS the count of OFFERED placements for the section (1)
          must stay strictly below max_count (1). So a second OFFER is refused with
          ERR_SECTION_CAPACITY_EXCEEDED even though not one seat is filled - and the same
          request as a WAITLIST row is admitted, because waitlist rows are exempt from both
          the section and the ensemble aggregate.
        test_recipe:
          setup:
            - "Season in PLACEMENT with one PHILHARMONIC ensemble (max_total_size 4) whose"
            - "VIOLIN quota is min 1 / target 1 / max 1."
            - "Ada Strings and Ben Bow are both ADJUDICATED at 81.80 with no placement yet."
            - "Ada's OFFER has been created (offered_count 1, filled_count 0) and the live"
            - "Ensemble.version has been re-read into ${ens_v9}."
