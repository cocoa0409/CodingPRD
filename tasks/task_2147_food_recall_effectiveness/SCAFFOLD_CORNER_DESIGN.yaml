        distinguishing_aspect: "For a CLASS_II recall the level is C (10 percent) while every consignee is tier 1 and flips to B (50 percent) the moment a tier-2 consignee exists: required_sample_size moves from max(1, ceil(3 * 0.10)) = 1 to ceil(4 * 0.50) = 2."
