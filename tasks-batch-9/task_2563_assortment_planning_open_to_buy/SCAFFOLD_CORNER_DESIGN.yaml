            - "${pstatus} == APPROVED and ${rounds} == 0: no post in the sequence reached BREACH, so no VARIANCE_BREACH cycle opened and the four posts are all judged against a plan that never moved"

      - name: overlay_chain_rounds_after_each_pinned_step
        claim_type: constraint_propagation
        grounds:
          - calculations.overlay_effective_multiplier
          - calculations.overlay_effective_multiplier.constants
          - calculations.item_sell_through_forecast
          - state_machines.LocalizationOverlay.transitions.DRAFT_to_ACTIVE
        distinguishing_aspect: "Three overlays of three different types stack on one cluster, and the multipliers are chosen so that rounding after each step (12417) differs by one bps from multiplying all three factors and rounding once (12416), and so that applying the same three overlays in any order other than CLIMATE -> DEMOGRAPHIC -> VOLUME also yields 12416. The one-bps difference is not cosmetic: it moves the item's sell_through_bps from 7853 to 7854, so the pinned order and the per-step rounding are both directly observable on a persisted field."
