            - "after CX accepts: Dispute.${dispute_id}.status == ACCEPTED, resolution_amount_cents == 4700 (falls back to disputed_amount_cents because no counter was ever made)"
            - "after CX accepts: CarHireMovement.${m3_id}.adjusted_net_hire_cents == 0 and a DISPUTE_ADJUSTMENT HireLedgerEntry of -4700 exists"
            - "after CX accepts: SettlementCycle.${cycle_id}.status is STILL EXCHANGED, variant_applied == RECONCILED, dispute_adjustment_cents == -4700, pre_fee_net_cents == 14008, clearinghouse_fee_cents == 70, net_settlement_cents == 13938"
            - "second settle attempt (identical call): HTTP 200, SettlementCycle.${cycle_id}.status == SETTLED, settled_at == 2026-09-01T00:00:00Z, reopen_deadline_at == 2026-10-01T00:00:00Z"
            - "a SETTLEMENT_PAYMENT HireLedgerEntry of -13938 exists (not -18614)"

      - name: reclaim_embargo_reason_depends_on_a_third_entity_covering_the_window
        grounds:
          - validations.priority_27_ERR_EMBARGO_DOES_NOT_COVER_WINDOW
          - validations.priority_26_ERR_RECLAIM_EVIDENCE_MISSING
          - validations.priority_21_ERR_EMBARGO_SELF_ISSUED
          - calculations.reclaim_credit_amount
          - entities.EmbargoOrder.fields.effective_from
          - entities.ReclaimClaim.fields.supporting_embargo_id
        distinguishing_aspect: |
          Whether an EMBARGO reclaim is admissible is decided by the state of a third
          entity that the payload only references: the EmbargoOrder's closed interval
          must contain the claim's half-open window, its car_type_id must match the car
          and its junction_id must be one of the movement's own two events' junctions.
          A window of [2026-08-25T00:00:00Z, 2026-08-26T00:00:00Z) inside the embargo is
          accepted and credits 2843; the immediately following window
          [2026-08-26T00:00:00Z, 2026-08-27T00:00:00Z) — equally valid against the
          movement, equally 24.00 hours, non-overlapping with the first claim — is
          refused with ERR_EMBARGO_DOES_NOT_COVER_WINDOW. Nothing on ReclaimClaim or
          CarHireMovement distinguishes the two filings.
