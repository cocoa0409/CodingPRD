  # ---------------------------------------------------------------------------
  # Section: calculations
  # ---------------------------------------------------------------------------
  - section: calculations
    instances:
      - name: weather_missing_report_day_not_dry
        claim_type: input_set_filtering
        grounds: [calculations.weather_window_evaluation]
        distinguishing_aspect: "A day with NO WeatherReport counts as not-dry: dry reports on 06-10 and 06-12 with 06-11 missing leave the cutting SCHEDULED."
        test_recipe:
          setup: ["Grower/Field; Cutting window 2026-06-10..2026-06-20"]
          setup_api_calls:
            - { call: "POST /api/growers", payload: { name: "Grower L", region_code: "OR-WILLAMETTE" }, as: PlatformAdmin, captures: { g_id: "$.data.id" } }
            - { call: "POST /api/fields", payload: { grower_id: "${g_id}", name: "Field L", acres: 18.0, forage_type: "GRASS" }, as: Grower, as_user_id: "${g_id}", captures: { f_id: "$.data.id" } }
            - { call: "POST /api/cuttings", payload: { field_id: "${f_id}", cutting_number: 1, season_year: 2026, planned_window_start: "2026-06-10", planned_window_end: "2026-06-20" }, as: Grower, as_user_id: "${g_id}", captures: { c_id: "$.data.id" } }
          trigger:
            - { call: "POST /api/weather-reports", payload: { region_code: "OR-WILLAMETTE", report_date: "2026-06-10", precipitation_mm: 0.0, drying_index: 70 }, as: PlatformAdmin }
            - { call: "POST /api/weather-reports", payload: { region_code: "OR-WILLAMETTE", report_date: "2026-06-12", precipitation_mm: 0.0, drying_index: 70 }, as: PlatformAdmin }
            - { call: "GET /api/cuttings/${c_id}", payload: {}, as: Grower, as_user_id: "${g_id}", captures: { c_st: "$.data.status" } }
          assert:
            - "Cutting.${c_id}.status == SCHEDULED (2026-06-11 has no report -> trailing-3 not all dry)"
      - name: market_regime_boundary_classifications
        claim_type: constants_applied
        grounds: [calculations.market_regime_classification]
        distinguishing_aspect: "Exactly +15% vs prior index is DROUGHT (>= boundary); +14.5% is only VOLATILE (>= 8% on abs value); regime window limited to 30-day lookback."
        test_recipe:
          setup: ["Base indices posted 2026-05-01 @ 20000 for ALFALFA and GRASS in OR-WILLAMETTE"]
          setup_api_calls:
            - { call: "POST /api/market-indices", payload: { region_code: "OR-WILLAMETTE", forage_type: "ALFALFA", effective_date: "2026-05-01", price_per_ton_cents: 20000 }, as: PlatformAdmin, captures: { i_base_a: "$.data.id" } }
            - { call: "POST /api/market-indices", payload: { region_code: "OR-WILLAMETTE", forage_type: "GRASS", effective_date: "2026-05-01", price_per_ton_cents: 20000 }, as: PlatformAdmin, captures: { i_base_g: "$.data.id" } }
          trigger:
            - { call: "POST /api/market-indices", payload: { region_code: "OR-WILLAMETTE", forage_type: "ALFALFA", effective_date: "2026-05-20", price_per_ton_cents: 23000 }, as: PlatformAdmin, captures: { reg_drought: "$.data.drought_regime" } }
            - { call: "POST /api/market-indices", payload: { region_code: "OR-WILLAMETTE", forage_type: "GRASS", effective_date: "2026-05-20", price_per_ton_cents: 22900 }, as: PlatformAdmin, captures: { reg_volatile: "$.data.drought_regime" } }
          assert:
            - "+15.0% posting classifies DROUGHT (>= DROUGHT_REGIME_PCT 0.15)"
            - "+14.5% posting classifies VOLATILE (>= 0.08 but < 0.15)"
            - "base postings with no prior index classified STABLE"
      - name: freight_surcharge_tier_boundaries_299_300
        claim_type: correct_result
        grounds: [calculations.freight_charge, calculations.quote_pricing]
        distinguishing_aspect: "Fuel surcharge tier flips at exactly 300 miles: 299mi -> 6%, 300mi -> 11%, changing quote totals 130929 vs 136550 for otherwise identical 1.0t GOOD quotes."
        test_recipe:
          setup: ["Index 20000; two lanes 299mi (->CA-NORTH) and 300mi (->CA-CENTRAL); buyer 5000000"]
          setup_api_calls:
            - { call: "POST /api/market-indices", payload: { region_code: "OR-WILLAMETTE", forage_type: "ALFALFA", effective_date: "2026-05-01", price_per_ton_cents: 20000 }, as: PlatformAdmin }
            - { call: "POST /api/freight-lanes", payload: { origin_region_code: "OR-WILLAMETTE", dest_region_code: "CA-NORTH", distance_miles: 299, rate_per_mile_cents: 350, min_charge_cents: 90000 }, as: PlatformAdmin }
            - { call: "POST /api/freight-lanes", payload: { origin_region_code: "OR-WILLAMETTE", dest_region_code: "CA-CENTRAL", distance_miles: 300, rate_per_mile_cents: 350, min_charge_cents: 90000 }, as: PlatformAdmin }
            - { call: "POST /api/buyers", payload: { name: "Buyer V", region_code: "CA-NORTH", credit_limit_cents: 5000000 }, as: PlatformAdmin, captures: { b_id: "$.data.id" } }
          trigger:
            - { call: "POST /api/quotes", payload: { buyer_id: "${b_id}", forage_type: "ALFALFA", quality_tier: "GOOD", tons: 1.0, origin_region_code: "OR-WILLAMETTE", dest_region_code: "CA-NORTH", requested_delivery_by: "2026-08-20" }, as: Buyer, as_user_id: "${b_id}", captures: { q299: "$.data.id" } }
            - { call: "POST /api/quotes", payload: { buyer_id: "${b_id}", forage_type: "ALFALFA", quality_tier: "GOOD", tons: 1.0, origin_region_code: "OR-WILLAMETTE", dest_region_code: "CA-CENTRAL", requested_delivery_by: "2026-08-20" }, as: Buyer, as_user_id: "${b_id}", captures: { q300: "$.data.id" } }
          assert:
            - "Quote.${q299}.freight_cents == 110929 (base 104650 + 6% surcharge 6279)"
            - "Quote.${q299}.total_cents == 130929"
            - "Quote.${q300}.freight_cents == 116550 (base 105000 + 11% surcharge 11550)"
            - "Quote.${q300}.total_cents == 136550"
      - name: shrink_moisture_controlled_half_rate
        claim_type: correct_result
        grounds: [calculations.shrink_tonnage, entities.StorageSite.fields.moisture_controlled]
        distinguishing_aspect: "Conditional calculation: a moisture-controlled site halves the monthly shrink rate (0.75% vs 1.5%), so the same 100.0t/3-month lot reads 97.75 instead of 95.5."
        test_recipe:
          setup: ["Grower chain; CUT 2026-06-01; controlled site; lot 100.0t harvested 2026-06-01; clock 2026-09-15"]
          setup_api_calls:
            - { call: "POST /api/growers", payload: { name: "Grower M", region_code: "OR-WILLAMETTE" }, as: PlatformAdmin, captures: { g_id: "$.data.id" } }
