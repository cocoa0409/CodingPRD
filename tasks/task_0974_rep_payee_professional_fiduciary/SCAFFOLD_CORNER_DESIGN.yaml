      - name: deposit_post_to_frozen_account_rejected
        claim_type: cross_entity_validation
        grounds: [state_machines.Deposit.RECEIVED_to_POSTED, "errors[ERR_ACCOUNT_NOT_OPEN]"]

        distinguishing_aspect: "The account state gates the deposit post: after a client suspension freezes the account, posting a previously-received deposit fails with ERR_ACCOUNT_NOT_OPEN."
        test_recipe:
          setup: ["ACTIVE client with OPERATING account and a RECEIVED deposit; client then suspended (account FROZEN)"]
