            - "the third award returns HTTP 201 even though its window shares 2026-08-20 with the incumbent by only one second of separation"
            - "VendorEngagement.${ve3}.award_amount_cents == 90000 and VendorEngagement.${ve3}.volume_discount_pct == 0.00"
