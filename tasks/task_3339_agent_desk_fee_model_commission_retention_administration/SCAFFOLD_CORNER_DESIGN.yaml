        excluded_because:
          difficulty_instance: boundary_precision_check / retention_report_zero_baseline_rejected
          rationale: "Asserted in the named §1.8 instance."

  # ===========================================================================
  - section: roles
    instances:

      - name: agent_cannot_pay_another_agents_invoice
        claim_type: RBAC denial
        grounds:
          - roles.Agent
          - endpoints.POST_/invoices/{invoiceId}/pay
        distinguishing_aspect: "Entity-backed ownership: Bob (X-User-ID = bob_id) paying Alice's invoice is rejected 403 ERR_FORBIDDEN even though Agent is the correct role for the endpoint."
        test_recipe:
          setup: ["Logical clock 2026-09-01. Alice and Bob both ACTIVE; September invoices generated for both."]
          setup_api_calls:
            - *k_clock_sep1
            - *k_office
            - *k_sched
            - *k_alice
            - *k_fa_alice
            - *k_fa_alice_accept
            - *k_bob
            - *k_fa_bob
            - *k_fa_bob_accept
            - *k_gen_sep2
          trigger:
            - call: "POST /invoices/${inv_a_id}/pay"
              payload: { amount_cents: 365000 }
              as: Agent
              as_user_id: "${bob_id}"
              captures: { err_id: $.data.error_id }
          assert:
            - "the response status is 403 and err_id == ERR_FORBIDDEN"
            - "Invoice.${inv_a_id}.amount_paid_cents == 0"

      - name: trust_accountant_cannot_generate_invoices
        claim_type: RBAC denial
        grounds:
          - roles.TrustAccountant
          - endpoints.POST_/offices/{officeId}/generate-invoices
        distinguishing_aspect: "generate-invoices is a ManagingBroker exclusive; TrustAccountant is rejected 403 ERR_FORBIDDEN."
        test_recipe:
          setup: ["Logical clock 2026-09-01. Denver office with ACTIVE Alice."]
          setup_api_calls:
            - *k_clock_sep1
            - *k_office
            - *k_sched
            - *k_alice
            - *k_fa_alice
            - *k_fa_alice_accept
          trigger:
            - call: "POST /offices/${office_id}/generate-invoices"
              payload: { billing_month: "2026-09" }
              as: TrustAccountant
              captures: { err_id: $.data.error_id }
          assert:
            - "the response status is 403 and err_id == ERR_FORBIDDEN"
            - "GET /invoices?office_id=${office_id} returns 0 rows"

      - name: compliance_auditor_reviews_rung_zero_but_not_rung_two
        claim_type: RBAC denial
        grounds:
          - roles.ComplianceAuditor
          - errors.ERR_REVIEW_RUNG_MISMATCH
        distinguishing_aspect: "The ladder's rung ownership is role-bound: ComplianceAuditor succeeds at rung 0 but the same role at rung 2 (BROKER_SIGNOFF) is rejected 409 ERR_REVIEW_RUNG_MISMATCH."
        test_recipe:
          setup: ["Logical clock 2026-09-10. Alice ACTIVE; T1 UNDER_CONTRACT; CDA1 advanced to rung 2."]
          setup_api_calls:
            - *k_clock
            - *k_office
            - *k_sched
            - *k_alice
            - *k_fa_alice
            - *k_fa_alice_accept
            - *k_offer1
            - *k_offer1_accept
            - *k_txn1
            - *k_cda1
            - *k_cda1_r0
            - *k_cda1_r1
          trigger:
            - call: "POST /cdas/${cda1_id}/review"
              payload: { verdict: "APPROVE" }
              as: ComplianceAuditor
              captures: { err_id: $.data.error_id }
          assert:
            - "the response status is 409 and err_id == ERR_REVIEW_RUNG_MISMATCH"
            - "CDA.${cda1_id}.current_rung == 2 and status remains IN_REVIEW"

  # ===========================================================================
  - section: cross_cutting_layers
    instances:

      - name: occ_version_increments_on_every_mutation
        claim_type: optimistic_concurrency
        grounds:
          - concurrency_rules[fee-assignment-stale-agent]
          - complexity_profile.complexity_layers
        excluded_because:
          difficulty_instance: endpoints / fee_assignment_create_with_stale_agent_version_returns_412
          rationale: "The OCC stale-version rejection and version increment are asserted in the named endpoints corner (a §1.9 sibling, cited by name)."

      - name: cascading_side_effects_close_chain
        claim_type: cascading_side_effects
        grounds:
          - complexity_profile.complexity_layers
        excluded_because:
          difficulty_instance: transitive_cascade / close_cascade_receipt_to_split_to_referral_fulfillment
          rationale: "The 3-level cascade is asserted in the named §1.8 instance."

      - name: scheduled_clock_gated_actions_fire_on_advance
        claim_type: scheduled_actions
        grounds:
          - complexity_profile.complexity_layers
          - endpoints.POST_/_clock/set_current_utc
        excluded_because:
          difficulty_instance: calculations / invoice_escalation_issued_overdue_collections_on_clock_advance
          rationale: "Clock-advance firing of OVERDUE/COLLECTIONS escalations is asserted in the named calculations corner; offer TTL is asserted in §1.8 boundary_precision_check / offer_ttl_72h_exact_boundary_expires."

      - name: dual_variant_layer
        claim_type: dual_variant_calculation
        grounds:
          - complexity_profile.complexity_layers
        excluded_because:
          difficulty_instance: dual_variant_calc / closing_statement_standard_vs_former_agent_overhead_waiver
          rationale: "Both dual-variant pairs are asserted in the two §1.8 dual_variant_calc instances."

  # ===========================================================================
  - section: consistency_model
    instances:

      - name: immediate_consistency_close_effects_visible_in_same_read
        claim_type: immediate
        grounds:
          - complexity_profile.consistency_model
        distinguishing_aspect: "All close side effects are visible immediately: the GETs following POST /transactions/{id}/close in the same test see CLOSED status, finalized lines, and the posted ledger entries with no delay or recompute endpoint."
        test_recipe:
          setup: ["Logical clock 2026-09-10. Alice ACTIVE; T1 PENDING_CLOSE with approved CDA."]
          setup_api_calls:
            - *k_clock
            - *k_office
            - *k_sched
            - *k_alice
            - *k_fa_alice
            - *k_fa_alice_accept
            - *k_offer1
            - *k_offer1_accept
            - *k_txn1
            - *k_cda1
            - *k_cda1_r0
            - *k_cda1_r1
            - *k_cda1_r2
            - *k_rc1
          trigger:
            - *k_close1
            - call: "GET /transactions/${txn1_id}/closing-statement-lines"
              payload: {}
              as: TrustAccountant
            - call: "GET /commission-entries"
              payload: { transaction_id: "${txn1_id}" }
              as: TrustAccountant
          assert:
            - "Transaction.${txn1_id}.status == CLOSED in the close response itself"
            - "the immediately-following closing-statement-lines GET returns the finalized lines (status FINAL)"
            - "the immediately-following commission-entries GET returns the receipt and split entries with their post-close statuses"
