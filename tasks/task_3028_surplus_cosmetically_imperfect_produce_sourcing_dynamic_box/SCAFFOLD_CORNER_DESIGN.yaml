- section: endpoints
  instances:
  - name: center_update_repins_the_regions_subscribers_to_the_new_winner
    claim_type: action_endpoint
    grounds:
    - endpoints.PUT_/produce/fulfillment-centers/{id}
    - calculations.regional_center_assignment
    - entities.Customer.fields.home_fulfillment_center_id
    distinguishing_aspect: Deactivating a region's active center runs the assignment rule again, and every customer of that region is re-pinned to the surviving active center, which is observable because a later order routes to the new center.
    test_recipe:
      setup: One region holding two centers AAA-NE and ZZZ-NE with a customer registered into AAA-NE and one DRAFT order left unused.
      setup_api_calls:
      - call: POST /produce/fulfillment-centers
        payload:
          code: AAA-NE
          name: Aaa Center
          region: NE
          insulation_profile: LIGHT
        as: PlatformAdmin
        captures:
          ra_aaa: $.data.id
      - call: POST /produce/fulfillment-centers
        payload:
          code: ZZZ-NE
          name: Zzz Center
          region: NE
          insulation_profile: LIGHT
        as: PlatformAdmin
        captures:
          ra_zzz: $.data.id
      - call: POST /produce/suppliers
        payload:
          name: Repin Farms
          region: NE
        as: PlatformAdmin
        captures:
          ra_s: $.data.id
      - call: POST /produce/customers/register
        payload:
          email: repin@example.com
          full_name: Repin Rae
          service_region: NE
        as: Anonymous
        captures:
          ra_cu: $.data.id
      - call: POST /produce/subscriptions
        payload:
          customer_id: ${ra_cu}
          cadence: WEEKLY
        as: PlatformAdmin
        captures:
          ra_sub: $.data.id
      - call: GET /produce/fulfillment-centers/${ra_aaa}
        payload: {}
        as: PlatformAdmin
        captures:
          ra_aaa_v: $.data.version
      trigger:
      - call: PUT /produce/fulfillment-centers/${ra_aaa}
        payload:
          is_active: false
          expected_fulfillment_center_version: ${ra_aaa_v}
        as: PlatformAdmin
      - call: GET /produce/customers/${ra_cu}
        as: PlatformAdmin
      - call: POST /produce/box-orders
        payload:
          customer_id: ${ra_cu}
          subscription_id: ${ra_sub}
          serving_cycle_index: 1
          cuisine_preference: STANDARD
        as: PlatformAdmin
        captures:
          ra_o1: $.data.id
      assert:
      - the center update returns 200 and the updated center has is_active == false
      - Customer.${ra_cu}.home_fulfillment_center_id == ${ra_zzz} (re-pinned to the surviving active center)
      - BoxOrder.${ra_o1}.fulfillment_center_id == ${ra_zzz}
      - GET /produce/fulfillment-centers/${ra_zzz}/customers returns exactly 1 row
  - name: claim_create_snapshots_the_cited_lots_quality_status
    claim_type: standard_crud
    grounds:
    - endpoints.POST_/produce/box-orders/{id}/quality-claims
    - entities.QualityClaim.fields.cited_lot_quality_status
    - entities.QualityClaim.fields.supply_lot_id
    distinguishing_aspect: The claim create derives supply_lot_id from the cited build item rather than from the request, and snapshots the cited lot's quality_status at that instant, so a later change to the lot does not rewrite the snapshot.
    test_recipe:
      setup: One center, supplier, lot and customer with an order built from the lot and packed; the lot then moves to INVESTIGATION via an upheld sibling claim.
      setup_api_calls:
      - call: POST /produce/fulfillment-centers
        payload:
          code: DEMO-NE
          name: Demo Center
          region: NE
          insulation_profile: LIGHT
          max_concurrent_building_cycles: 5
        as: PlatformAdmin
        captures:
          sn_c: $.data.id
      - call: POST /produce/suppliers
        payload:
          name: Supply Co SN
          region: NE
        as: PlatformAdmin
        captures:
          sn_s: $.data.id
      - call: POST /produce/suppliers/${sn_s}/lots
        payload:
          fulfillment_center_id: ${sn_c}
          product_name: SN1
          category: FRUIT
          procurement_grade: SURPLUS
          unit_weight_grams: 100
          quantity_available: 300
          unit_cost_cents: 100
          harvest_date: '2026-09-01T00:00:00Z'
          expiry_date: '2026-09-20T00:00:00Z'
          ready_date: '2026-09-05T00:00:00Z'
        as: PlatformAdmin
        captures:
          sn_l: $.data.id
          sn_lv: $.data.version
      - call: POST /produce/sourcing-bids
        payload:
          supply_lot_id: ${sn_l}
          supplier_id: ${sn_s}
          bid_unit_cost_cents: 100
          quantity_offered: 300
        as: Supplier
        as_user_id: ${sn_s}
      - call: POST /produce/supply-lots/${sn_l}/award
        payload:
          bidder_quota: 1
          expected_supply_lot_version: ${sn_lv}
        as: PlatformAdmin
        captures:
          sn_lv2: $.data.version
      - call: POST /produce/supply-lots/${sn_l}/make-ready
        payload:
          quality_outcome: PASS
          expected_supply_lot_version: ${sn_lv2}
        as: PlatformAdmin
      - call: POST /produce/customers/register
        payload:
          email: sn@example.com
          full_name: Sub Sn
          service_region: NE
        as: Anonymous
        captures:
          sn_cu: $.data.id
      - call: POST /produce/subscriptions
        payload:
          customer_id: ${sn_cu}
          cadence: WEEKLY
        as: PlatformAdmin
        captures:
          sn_sub: $.data.id
          sn_subv: $.data.version
      - call: POST /produce/box-orders
        payload:
          customer_id: ${sn_cu}
          subscription_id: ${sn_sub}
          serving_cycle_index: 1
          cuisine_preference: STANDARD
        as: PlatformAdmin
        captures:
          sn_o1: $.data.id
          sn_o1v: $.data.version
      - call: POST /produce/box-orders/${sn_o1}/build
        payload:
          expected_box_order_version: ${sn_o1v}
          line_plan:
          - supply_lot_id: ${sn_l}
            units: 6
        as: FulfillmentOperator
        as_user_id: ${sn_c}
        captures:
          sn_o1v2: $.data.version
      - call: POST /produce/box-orders/${sn_o1}/pack
        payload:
          expected_box_order_version: ${sn_o1v2}
        as: FulfillmentOperator
        as_user_id: ${sn_c}
      - call: POST /_clock/set_current_utc
        payload: *id001
        as: PlatformAdmin
      - call: GET /produce/box-orders/${sn_o1}/items?status=INCLUDED
        payload: {}
        as: PlatformAdmin
        captures:
          sn_i0: $.data[0].id
      - call: POST /produce/box-orders/${sn_o1}/quality-claims
        payload:
          box_build_item_id: ${sn_i0}
          reason_code: SPOILED
          photo_url: https://cdn.example.com/evo/sn0.jpg
          requested_credit_cents: 500
        as: PlatformAdmin
        captures:
          sn_cl0: $.data.id
          sn_cl0v: $.data.version
      trigger:
      - call: POST /produce/quality-claims/${sn_cl0}/review
        payload:
          outcome: UPHELD
          expected_claim_version: ${sn_cl0v}
        as: PlatformAdmin
      - call: GET /produce/box-orders/${sn_o1}/quality-claims
        payload: {}
        as: PlatformAdmin
        captures:
          sn_c2: $.data[0].id
      assert:
      - QualityClaim.${sn_cl0}.supply_lot_id == ${sn_l} (derived from the build item, not supplied)
      - QualityClaim.${sn_cl0}.cited_lot_quality_status == INVESTIGATION (the snapshot taken after the sibling claim moved the lot)
      - SupplyLot.${sn_l}.quality_status == INVESTIGATION
      - the claim list returns exactly 1 row
  - name: clock_endpoint_reads_back_the_value_it_was_set_to
    claim_type: computed_read
    grounds:
    - endpoints.POST_/produce/_clock/set_current_utc
    distinguishing_aspect: The logical clock endpoint is the one place the server's time is observable, and it reads back exactly the instant it was set so every deadline rule downstream is deterministic.
    test_recipe:
      setup: Empty database.
      setup_api_calls: []
      trigger:
      - call: POST /_clock/set_current_utc
        payload:
          to_iso8601: '2026-09-05T00:00:00Z'
        as: PlatformAdmin
        captures:
          ck: $.data.current_utc
      - call: POST /_clock/set_current_utc
        payload:
          to_iso8601: '2026-09-01T00:00:00Z'
        as: PlatformAdmin
      assert:
      - the first clock call returns 200 and ck == 2026-09-05T00:00:00Z
      - the second clock call returns 200 with current_utc 2026-09-01T00:00:00Z
      - a customer registered after the second call has created_at 2026-09-01T00:00:00Z
  - name: make_ready_stamps_the_arrival_and_moves_the_supplier_score
    claim_type: action_endpoint
    grounds:
