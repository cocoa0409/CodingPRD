              as: NetworkPlanner
              captures: { p: $.data.id, p_v: $.data.version }
            - call: "POST /rail/train-plans/${p}/activate"
              payload: { expected_train_plan_version: "${p_v}" }
              as: NetworkPlanner
              captures: { p_v2: $.data.version }
            - call: "POST /rail/customers"
              payload: { customer_code: "RG-CU", name: "Retire Gate Shipper" }
              as: ServiceManager
              captures: { cu: $.data.id }
            - call: "POST /rail/shipments"
              payload: { customer_id: "${cu}", origin_yard_id: "${yA}", destination_yard_id: "${yB}", car_count: 2, first_mile_pickup_by: "2026-09-02T06:00:00Z", last_mile_delivery_by: "2026-09-05T00:00:00Z", committed_route_miles: 300 }
              as: ServiceManager
