scaffold_difficulty_design:
  # =========================================================================
  # Rule 1 — Dual-variant calculations across different entity domains
  # =========================================================================
  - rule_id: dual_variant_calc
    instances:
      - name: per_person_price_quoted_vs_final_on_booking
        grounds:
          - calculations.per_person_price
          - entities.Booking.fields.quoted_per_person_cents
          - entities.Booking.fields.final_per_person_cents
          - state_machines.Departure.GUARANTEED_to_DEPARTED
        distinguishing_aspect: "On Booking A (pricing domain), quoted_per_person uses the forward-looking projected band (SMALL,1.20) while final_per_person uses the actual occupancy band at depart (STANDARD,1.00): 120000 vs 100000."
        test_recipe:
          setup:
            - "TourProduct base 100000, deposit 20000, duration 3; Coach cap 10; Driver; Guide."
            - "Departure OPEN with coach/driver/guide assigned, guaranteed_min_pax 6."
            - "Booking A pax 1 confirmed while confirmed_pax was 0 (quoted SMALL); Booking B pax 5 pushing confirmed_pax to 6 (STANDARD); departure departed."
          setup_api_calls:
            - call: "POST /api/tour-products"
              payload: { name: "Grand Tour", duration_days: 3, base_price_per_person_cents: 100000, deposit_per_person_cents: 20000 }
              as: OpsManager
              captures: { tp: $.data.id }
            - call: "POST /api/coaches"
              payload: { code: "C1", seat_capacity: 10, day_rate_cents: 50000 }
              as: OpsManager
              captures: { coach: $.data.id }
            - call: "POST /api/drivers"
              payload: { name: "Dan", license_no: "CDL1", day_rate_cents: 40000 }
              as: OpsManager
              captures: { driver: $.data.id }
            - call: "POST /api/guides"
              payload: { name: "Gina", day_rate_cents: 30000 }
              as: OpsManager
              captures: { guide: $.data.id }
            - call: "POST /api/departures"
              payload: { tour_product_id: "${tp}", name: "Aug Grand", start_date: "2026-08-01", end_date: "2026-08-03", guaranteed_min_pax: 6, itinerary_days: [ { day_index: 1, service_date: "2026-08-01", from_city: "NYC", to_city: "BOS", planned_drive_hours: 8 } ] }
              as: OpsManager
              captures: { dep: $.data.id }
            - call: "POST /api/departures/${dep}/publish"
              payload: {}
              as: OpsManager
              captures: { pv: $.data.version }
            - call: "POST /api/departures/${dep}/assign"
              payload: { resource_kind: "COACH", coach_id: "${coach}", expected_departure_version: "${pv}" }
              as: OpsManager
              captures: { v2: $.data.version }
            - call: "POST /api/departures/${dep}/assign"
              payload: { resource_kind: "DRIVER", driver_id: "${driver}", expected_departure_version: "${v2}" }
              as: OpsManager
              captures: { v3: $.data.version }
            - call: "POST /api/departures/${dep}/assign"
              payload: { resource_kind: "GUIDE", guide_id: "${guide}", expected_departure_version: "${v3}" }
              as: OpsManager
            - call: "POST /api/bookings"
              payload: { departure_id: "${dep}", lead_name: "Party A", pax_count: 1, rooms_requested: 0 }
              as: SalesAgent
              captures: { bk_a: $.data.id }
            - call: "POST /api/passengers"
              payload: { booking_id: "${bk_a}", full_name: "A1", is_lead: true }
              as: SalesAgent
            - call: "POST /api/payments"
              payload: { booking_id: "${bk_a}", kind: "DEPOSIT", amount_cents: 20000 }
              as: SalesAgent
            - call: "POST /api/bookings/${bk_a}/confirm"
              payload: {}
              as: SalesAgent
            - call: "POST /api/bookings"
              payload: { departure_id: "${dep}", lead_name: "Party B", pax_count: 5, rooms_requested: 0 }
              as: SalesAgent
              captures: { bk_b: $.data.id }
            - call: "POST /api/passengers"
              payload: { booking_id: "${bk_b}", full_name: "B1", is_lead: true }
              as: SalesAgent
            - call: "POST /api/passengers"
              payload: { booking_id: "${bk_b}", full_name: "B2" }
              as: SalesAgent
            - call: "POST /api/passengers"
              payload: { booking_id: "${bk_b}", full_name: "B3" }
              as: SalesAgent
            - call: "POST /api/passengers"
              payload: { booking_id: "${bk_b}", full_name: "B4" }
              as: SalesAgent
            - call: "POST /api/passengers"
              payload: { booking_id: "${bk_b}", full_name: "B5" }
              as: SalesAgent
            - call: "POST /api/payments"
              payload: { booking_id: "${bk_b}", kind: "DEPOSIT", amount_cents: 100000 }
              as: SalesAgent
            - call: "POST /api/bookings/${bk_b}/confirm"
              payload: {}
              as: SalesAgent
          trigger:
            - call: "POST /api/departures/${dep}/depart"
              payload: {}
              as: OpsManager
          assert:
            - "Booking.${bk_a}.quoted_per_person_cents == 120000"
            - "Booking.${bk_a}.final_per_person_cents == 100000"
            - "Booking.${bk_b}.quoted_per_person_cents == 100000"
            - "Booking.${bk_b}.final_per_person_cents == 100000"

      - name: departure_settlement_provisional_vs_final
        grounds:
          - calculations.departure_settlement
          - entities.Departure.fields.settlement_net_cents
          - state_machines.Voucher.ISSUED_to_REDEEMED
        distinguishing_aspect: "On the Departure (settlement domain), provisional net counts 2 ISSUED vouchers (cost 5000) → -127600, final net counts only 1 REDEEMED voucher (cost 2500) → -125100."
        test_recipe:
          setup:
            - "Departure OPEN with coach(day 50000)/driver(40000)/guide(30000), duration 3, min_pax 2."
            - "One CONFIRMED booking pax 2 paid in full (booking_total 257400); one CONFIRMED hotel block cost 20000; 2 MEAL vouchers issued."
          setup_api_calls:
            - call: "POST /api/tour-products"
              payload: { name: "Coastal", duration_days: 3, base_price_per_person_cents: 100000, deposit_per_person_cents: 20000 }
              as: OpsManager
              captures: { tp: $.data.id }
            - call: "POST /api/coaches"
              payload: { code: "C2", seat_capacity: 10, day_rate_cents: 50000 }
              as: OpsManager
              captures: { coach: $.data.id }
            - call: "POST /api/drivers"
              payload: { name: "Deb", license_no: "CDL2", day_rate_cents: 40000 }
              as: OpsManager
              captures: { driver: $.data.id }
            - call: "POST /api/guides"
              payload: { name: "Gus", day_rate_cents: 30000 }
              as: OpsManager
              captures: { guide: $.data.id }
            - call: "POST /api/departures"
              payload: { tour_product_id: "${tp}", name: "Coastal Aug", start_date: "2026-08-01", end_date: "2026-08-03", guaranteed_min_pax: 2, itinerary_days: [ { day_index: 1, service_date: "2026-08-01", from_city: "NYC", to_city: "PHL", planned_drive_hours: 6 } ] }
              as: OpsManager
              captures: { dep: $.data.id }
            - call: "POST /api/departures/${dep}/publish"
              payload: {}
              as: OpsManager
              captures: { pv: $.data.version }
            - call: "POST /api/departures/${dep}/assign"
              payload: { resource_kind: "COACH", coach_id: "${coach}", expected_departure_version: "${pv}" }
              as: OpsManager
              captures: { v2: $.data.version }
            - call: "POST /api/departures/${dep}/assign"
              payload: { resource_kind: "DRIVER", driver_id: "${driver}", expected_departure_version: "${v2}" }
              as: OpsManager
              captures: { v3: $.data.version }
            - call: "POST /api/departures/${dep}/assign"
              payload: { resource_kind: "GUIDE", guide_id: "${guide}", expected_departure_version: "${v3}" }
              as: OpsManager
            - call: "POST /api/hotel-blocks"
              payload: { departure_id: "${dep}", hotel_name: "Bay Inn", city: "PHL", room_count: 1, nights: 2, rate_per_room_night_cents: 10000 }
              as: OpsManager
              captures: { hb: $.data.id }
            - call: "POST /api/bookings"
              payload: { departure_id: "${dep}", lead_name: "Party C", pax_count: 2, rooms_requested: 1 }
              as: SalesAgent
              captures: { bk: $.data.id }
            - call: "POST /api/passengers"
              payload: { booking_id: "${bk}", full_name: "C1", is_lead: true }
              as: SalesAgent
            - call: "POST /api/passengers"
              payload: { booking_id: "${bk}", full_name: "C2" }
              as: SalesAgent
            - call: "POST /api/payments"
              payload: { booking_id: "${bk}", kind: "DEPOSIT", amount_cents: 40000 }
              as: SalesAgent
            - call: "POST /api/payments"
              payload: { booking_id: "${bk}", kind: "BALANCE", amount_cents: 217400 }
              as: SalesAgent
            - call: "POST /api/bookings/${bk}/confirm"
              payload: {}
              as: SalesAgent
            - call: "POST /api/hotel-blocks/${hb}/confirm"
              payload: {}
              as: OpsManager
            - call: "GET /api/vouchers"
              payload: { booking_id: "${bk}" }
              as: SalesAgent
              captures: { v0: "$.data[0].id" }
          trigger:
            - call: "GET /api/departures/${dep}/settlement"
              payload: {}
              as: Finance
            - call: "POST /api/departures/${dep}/depart"
              payload: {}
              as: OpsManager
            - call: "POST /api/vouchers/${v0}/redeem"
              payload: {}
              as: SalesAgent
            - call: "POST /api/departures/${dep}/settle"
              payload: {}
              as: Finance
          assert:
            - "GET /api/departures/${dep}/settlement BEFORE depart returns variant=='provisional' and net_cents == -127600"
            - "Departure.${dep}.settlement_net_cents == -125100"
            - "final net_cents (-125100) != provisional net_cents (-127600) solely from voucher basis 2500 vs 5000"

  # =========================================================================
  # Rule 2 — Combinatorial formulas across different modes
  # =========================================================================
  - rule_id: combinatorial_formula
    instances:
      - name: cancellation_penalty_tier_and_deposit_floor_mode_a
        grounds:
          - calculations.cancellation_refund
          - entities.Booking.fields.penalty_charged_cents
          - state_machines.Booking.CONFIRMED_to_CANCELLED
        distinguishing_aspect: "Mode (a): penalty = max(round(base_subtotal*penalty_pct), deposit_due) with penalty_pct from a days-before tier — 3+ inputs, nested max over a tiered branch; at 9 days (pct 1.00) penalty=240000, refund=17400."
        test_recipe:
          setup:
            - "Clock default 2026-07-01; Departure start 2026-07-10 (9 days out); Booking pax 2 no insurance paid in full (257400)."
          setup_api_calls:
            - call: "POST /api/tour-products"
              payload: { name: "Quick Trip", duration_days: 2, base_price_per_person_cents: 100000, deposit_per_person_cents: 20000 }
              as: OpsManager
              captures: { tp: $.data.id }
            - call: "POST /api/coaches"
              payload: { code: "C3", seat_capacity: 10, day_rate_cents: 50000 }
              as: OpsManager
              captures: { coach: $.data.id }
            - call: "POST /api/departures"
              payload: { tour_product_id: "${tp}", name: "Jul Quick", start_date: "2026-07-10", end_date: "2026-07-11", guaranteed_min_pax: 5, itinerary_days: [ { day_index: 1, service_date: "2026-07-10", from_city: "NYC", to_city: "DC", planned_drive_hours: 5 } ] }
              as: OpsManager
              captures: { dep: $.data.id }
            - call: "POST /api/departures/${dep}/publish"
              payload: {}
              as: OpsManager
              captures: { pv: $.data.version }
            - call: "POST /api/departures/${dep}/assign"
              payload: { resource_kind: "COACH", coach_id: "${coach}", expected_departure_version: "${pv}" }
              as: OpsManager
            - call: "POST /api/bookings"
              payload: { departure_id: "${dep}", lead_name: "Party D", pax_count: 2, rooms_requested: 0, insurance_opt_in: false }
              as: SalesAgent
              captures: { bk: $.data.id }
            - call: "POST /api/passengers"
              payload: { booking_id: "${bk}", full_name: "D1", is_lead: true }
              as: SalesAgent
            - call: "POST /api/passengers"
              payload: { booking_id: "${bk}", full_name: "D2" }
              as: SalesAgent
            - call: "POST /api/payments"
              payload: { booking_id: "${bk}", kind: "DEPOSIT", amount_cents: 40000 }
              as: SalesAgent
            - call: "POST /api/payments"
              payload: { booking_id: "${bk}", kind: "BALANCE", amount_cents: 217400 }
              as: SalesAgent
            - call: "POST /api/bookings/${bk}/confirm"
              payload: {}
              as: SalesAgent
          trigger:
            - call: "POST /api/bookings/${bk}/cancel"
              payload: { reason: "party withdrew" }
              as: SalesAgent
          assert:
            - "Booking.${bk}.penalty_charged_cents == 240000"
            - "Booking.${bk}.amount_refunded_cents == 17400"
            - "Booking.${bk}.reservation_status == CANCELLED"

      - name: service_fee_round_per_person_then_multiply_mode_b
        grounds:
          - calculations.booking_service_fee
          - entities.Booking.fields.service_fee_cents
          - entities.Booking.fields.quoted_per_person_cents
        distinguishing_aspect: "Mode (b): round the per-person fee to whole cents FIRST then multiply by pax — round(119880*0.0725)=8691, *3 = 26073, NOT round(119880*3*0.0725)=26074."
        test_recipe:
          setup:
            - "TourProduct base 99900; Booking pax 3 on empty departure (SMALL band, quoted 119880)."
          setup_api_calls:
            - call: "POST /api/tour-products"
              payload: { name: "Odd Price", duration_days: 2, base_price_per_person_cents: 99900, deposit_per_person_cents: 20000 }
              as: OpsManager
              captures: { tp: $.data.id }
            - call: "POST /api/departures"
              payload: { tour_product_id: "${tp}", name: "Odd Dep", start_date: "2026-08-10", end_date: "2026-08-11", guaranteed_min_pax: 5, itinerary_days: [ { day_index: 1, service_date: "2026-08-10", from_city: "NYC", to_city: "DC", planned_drive_hours: 5 } ] }
              as: OpsManager
              captures: { dep: $.data.id }
            - call: "POST /api/departures/${dep}/publish"
              payload: {}
              as: OpsManager
          trigger:
            - call: "POST /api/bookings"
              payload: { departure_id: "${dep}", lead_name: "Party E", pax_count: 3, rooms_requested: 0 }
              as: SalesAgent
              captures: { bk: $.data.id }
          assert:
            - "Booking.${bk}.quoted_per_person_cents == 119880"
            - "Booking.${bk}.service_fee_cents == 26073"
            - "Booking.${bk}.base_subtotal_cents == 359640"

  # =========================================================================
  # Rule 3 — Non-linear state-machine shapes on different entities
  # =========================================================================
  - rule_id: non_linear_state_machine
    instances:
      - name: booking_parallel_reservation_and_payment_dims
        grounds:
          - state_machines.Booking.DRAFT_to_CONFIRMED
          - entities.Booking.fields.reservation_status
          - entities.Booking.fields.payment_status
        distinguishing_aspect: "Booking carries two independent axes: after paying only a deposit then confirming, reservation_status==CONFIRMED while payment_status stays DEPOSIT_PAID (neither axis forces the other to its terminal)."
        test_recipe:
          setup:
            - "Departure OPEN with coach assigned, min_pax 5; Booking pax 2, 2 passengers, deposit paid (40000, not full)."
          setup_api_calls:
            - call: "POST /api/tour-products"
              payload: { name: "Parallel", duration_days: 2, base_price_per_person_cents: 100000, deposit_per_person_cents: 20000 }
              as: OpsManager
              captures: { tp: $.data.id }
            - call: "POST /api/coaches"
              payload: { code: "C4", seat_capacity: 10, day_rate_cents: 50000 }
              as: OpsManager
              captures: { coach: $.data.id }
            - call: "POST /api/departures"
              payload: { tour_product_id: "${tp}", name: "Par Dep", start_date: "2026-08-20", end_date: "2026-08-21", guaranteed_min_pax: 5, itinerary_days: [ { day_index: 1, service_date: "2026-08-20", from_city: "NYC", to_city: "DC", planned_drive_hours: 5 } ] }
              as: OpsManager
              captures: { dep: $.data.id }
            - call: "POST /api/departures/${dep}/publish"
              payload: {}
              as: OpsManager
              captures: { pv: $.data.version }
            - call: "POST /api/departures/${dep}/assign"
              payload: { resource_kind: "COACH", coach_id: "${coach}", expected_departure_version: "${pv}" }
              as: OpsManager
            - call: "POST /api/bookings"
              payload: { departure_id: "${dep}", lead_name: "Party F", pax_count: 2, rooms_requested: 0 }
              as: SalesAgent
              captures: { bk: $.data.id }
            - call: "POST /api/passengers"
              payload: { booking_id: "${bk}", full_name: "F1", is_lead: true }
              as: SalesAgent
            - call: "POST /api/passengers"
              payload: { booking_id: "${bk}", full_name: "F2" }
              as: SalesAgent
            - call: "POST /api/payments"
              payload: { booking_id: "${bk}", kind: "DEPOSIT", amount_cents: 40000 }
              as: SalesAgent
          trigger:
            - call: "POST /api/bookings/${bk}/confirm"
              payload: {}
              as: SalesAgent
          assert:
            - "Booking.${bk}.reservation_status == CONFIRMED"
            - "Booking.${bk}.payment_status == DEPOSIT_PAID"

      - name: departure_cyclic_open_guaranteed_open
        grounds:
          - state_machines.Departure.OPEN_to_GUARANTEED
          - state_machines.Departure.GUARANTEED_to_OPEN
          - entities.Departure.fields.confirmed_pax
        distinguishing_aspect: "Departure cycles A->B->A: confirming a pax-2 booking drives OPEN->GUARANTEED (confirmed_pax 2 >= min 2), and cancelling it drives GUARANTEED->OPEN (confirmed_pax 0 < 2)."
        test_recipe:
          setup:
            - "Departure OPEN with coach assigned, min_pax 2; Booking pax 2 confirmed (departure now GUARANTEED)."
          setup_api_calls:
            - call: "POST /api/tour-products"
              payload: { name: "Cycle", duration_days: 2, base_price_per_person_cents: 100000, deposit_per_person_cents: 20000 }
              as: OpsManager
              captures: { tp: $.data.id }
            - call: "POST /api/coaches"
              payload: { code: "C5", seat_capacity: 10, day_rate_cents: 50000 }
              as: OpsManager
              captures: { coach: $.data.id }
            - call: "POST /api/departures"
              payload: { tour_product_id: "${tp}", name: "Cyc Dep", start_date: "2026-09-01", end_date: "2026-09-02", guaranteed_min_pax: 2, itinerary_days: [ { day_index: 1, service_date: "2026-09-01", from_city: "NYC", to_city: "DC", planned_drive_hours: 5 } ] }
              as: OpsManager
              captures: { dep: $.data.id }
            - call: "POST /api/departures/${dep}/publish"
              payload: {}
              as: OpsManager
              captures: { pv: $.data.version }
            - call: "POST /api/departures/${dep}/assign"
              payload: { resource_kind: "COACH", coach_id: "${coach}", expected_departure_version: "${pv}" }
              as: OpsManager
            - call: "POST /api/bookings"
              payload: { departure_id: "${dep}", lead_name: "Party G", pax_count: 2, rooms_requested: 0 }
              as: SalesAgent
              captures: { bk: $.data.id }
            - call: "POST /api/passengers"
              payload: { booking_id: "${bk}", full_name: "G1", is_lead: true }
              as: SalesAgent
            - call: "POST /api/passengers"
              payload: { booking_id: "${bk}", full_name: "G2" }
              as: SalesAgent
            - call: "POST /api/payments"
              payload: { booking_id: "${bk}", kind: "DEPOSIT", amount_cents: 40000 }
              as: SalesAgent
            - call: "POST /api/bookings/${bk}/confirm"
              payload: {}
              as: SalesAgent
          trigger:
            - call: "POST /api/bookings/${bk}/cancel"
              payload: { reason: "cycle back" }
              as: SalesAgent
          assert:
            - "Departure.${dep}.confirmed_pax == 0"
            - "Departure.${dep}.status == OPEN"

  # =========================================================================
  # Rule 4 — Transitive cascade chains from different triggers
  # =========================================================================
  - rule_id: transitive_cascade
    instances:
      - name: departure_cancel_cascades_booking_then_voucher_depth3
        grounds:
          - state_machines.Departure.GUARANTEED_to_CANCELLED
          - state_machines.Booking.CONFIRMED_to_CANCELLED
          - state_machines.Voucher.ISSUED_to_VOIDED
        distinguishing_aspect: "Depth-3 chain from Departure cancel: Departure->CANCELLED forces Booking->CANCELLED, which itself forces that booking's Voucher->VOIDED (each hop caused by the prior hop)."
        test_recipe:
          setup:
            - "Departure GUARANTEED with coach assigned; one CONFIRMED booking pax 2 (2 issued MEAL vouchers)."
          setup_api_calls:
            - call: "POST /api/tour-products"
              payload: { name: "Casc3", duration_days: 2, base_price_per_person_cents: 100000, deposit_per_person_cents: 20000 }
              as: OpsManager
              captures: { tp: $.data.id }
            - call: "POST /api/coaches"
              payload: { code: "C6", seat_capacity: 10, day_rate_cents: 50000 }
              as: OpsManager
              captures: { coach: $.data.id }
            - call: "POST /api/departures"
              payload: { tour_product_id: "${tp}", name: "Casc Dep", start_date: "2026-09-10", end_date: "2026-09-11", guaranteed_min_pax: 2, itinerary_days: [ { day_index: 1, service_date: "2026-09-10", from_city: "NYC", to_city: "DC", planned_drive_hours: 5 } ] }
              as: OpsManager
              captures: { dep: $.data.id }
            - call: "POST /api/departures/${dep}/publish"
              payload: {}
              as: OpsManager
              captures: { pv: $.data.version }
            - call: "POST /api/departures/${dep}/assign"
              payload: { resource_kind: "COACH", coach_id: "${coach}", expected_departure_version: "${pv}" }
              as: OpsManager
            - call: "POST /api/bookings"
              payload: { departure_id: "${dep}", lead_name: "Party H", pax_count: 2, rooms_requested: 0 }
              as: SalesAgent
              captures: { bk: $.data.id }
            - call: "POST /api/passengers"
              payload: { booking_id: "${bk}", full_name: "H1", is_lead: true }
              as: SalesAgent
            - call: "POST /api/passengers"
              payload: { booking_id: "${bk}", full_name: "H2" }
              as: SalesAgent
            - call: "POST /api/payments"
              payload: { booking_id: "${bk}", kind: "DEPOSIT", amount_cents: 40000 }
              as: SalesAgent
            - call: "POST /api/bookings/${bk}/confirm"
              payload: {}
              as: SalesAgent
            - call: "GET /api/vouchers"
              payload: { booking_id: "${bk}" }
              as: SalesAgent
              captures: { v0: "$.data[0].id" }
          trigger:
            - call: "POST /api/departures/${dep}/cancel"
              payload: { reason: "operator cancel" }
              as: OpsManager
          assert:
            - "Departure.${dep}.status == CANCELLED"
            - "Booking.${bk}.reservation_status == CANCELLED"
            - "Voucher.${v0}.status == VOIDED"

      - name: booking_cancel_releases_passenger_seat_then_confirmed_pax_depth2
        grounds:
          - state_machines.Booking.CONFIRMED_to_CANCELLED
          - entities.Passenger.fields.seat_no
          - calculations.seat_occupancy
        distinguishing_aspect: "Depth-2 chain from a different trigger (Booking cancel): Booking->CANCELLED clears each Passenger.seat_no, which recomputes Departure.confirmed_pax down by pax_count."
        test_recipe:
          setup:
            - "Departure OPEN with coach assigned min_pax 5; one CONFIRMED booking pax 2 (passengers hold seats, confirmed_pax 2)."
          setup_api_calls:
            - call: "POST /api/tour-products"
