  # ---------------------------------------------------------------------------
  - section: cross_cutting_layers
    instances:
      - name: c_occ_stale_version_on_establishment_patch
        claim_type: optimistic_concurrency
        grounds: ["concurrency_rules[establishment-update-stale-version]", "errors[ERR_STALE_VERSION]"]
        distinguishing_aspect: "PATCH with the version observed at creation succeeds and bumps version to 2; replaying the same stale expected_establishment_version is rejected 412 ERR_STALE_VERSION."
        test_recipe:
          setup: ["establishment created; version captured from the create response"]
          setup_api_calls:
            - call: "POST /establishments"
              payload: { name: "OCC Omelets", street_address: "39 Z St", seating_capacity: 10, fryer_count: 0, cuisine_profile: LOW_GREASE }
              as: ProgramAdmin
              captures: { est_id: $.data.id, est_v: $.data.version }
          trigger:
            - call: "PATCH /establishments/${est_id}"
              payload: { street_address: "39 Z St Ste B", expected_establishment_version: "${est_v}" }
              as: ProgramAdmin
            - call: "PATCH /establishments/${est_id}"
              payload: { street_address: "39 Z St Ste C", expected_establishment_version: "${est_v}" }
              as: ProgramAdmin
              captures: { err: $.data.error_id }
          assert:
            - "first PATCH succeeds (fresh version): street_address updated, version == 2"
            - "second PATCH with the same stale version returns error_id == ERR_STALE_VERSION and HTTP status 412"
            - "street_address remains '39 Z St Ste B'"

      - name: c_occ_stale_version_on_variance_approve
        claim_type: optimistic_concurrency
        grounds: ["concurrency_rules[variance-approve-stale-establishment]", "errors[ERR_STALE_VERSION]"]
        distinguishing_aspect: "Approving V1 bumps the establishment version; approving a second, non-overlapping variance V2 with the pre-V1 version is rejected 412 ERR_STALE_VERSION — the OCC guard fires before the window-overlap rule (isolated by choosing a disjoint window)."
        test_recipe:
          setup:
            - "LOW establishment; V1 PUMPING_FREQUENCY [2027-01-01, 2027-07-01) UNDER_REVIEW; V2 PUMPING_FREQUENCY [2028-01-01, 2028-07-01) created after V1's approval (disjoint window)"
            - "est_v captured BEFORE V1's approval"
          setup_api_calls:
            - call: "POST /establishments"
              payload: { name: "OCC Variance", street_address: "40 Z St", seating_capacity: 10, fryer_count: 0, cuisine_profile: LOW_GREASE }
              as: ProgramAdmin
              captures: { est_id: $.data.id, est_v: $.data.version }
            - call: "POST /variance-requests"
              payload: { establishment_id: "${est_id}", scope: "PUMPING_FREQUENCY", requested_frequency_days: 120, justification: "v1", effective_from: "2027-01-01T00:00:00Z", effective_to: "2027-07-01T00:00:00Z" }
              as: FseContact
              as_user_id: "${est_id}"
              captures: { v1: $.data.id }
            - call: "POST /variance-requests/${v1}/approve"
              payload: { expected_establishment_version: "${est_v}" }
              as: ComplianceOfficer
            - call: "POST /variance-requests"
              payload: { establishment_id: "${est_id}", scope: "PUMPING_FREQUENCY", requested_frequency_days: 150, justification: "v2", effective_from: "2028-01-01T00:00:00Z", effective_to: "2028-07-01T00:00:00Z" }
              as: FseContact
              as_user_id: "${est_id}"
              captures: { v2: $.data.id }
          trigger:
            - call: "POST /variance-requests/${v2}/approve"
              payload: { expected_establishment_version: "${est_v}" }
              as: ComplianceOfficer
              captures: { err: $.data.error_id }
          assert:
            - "V1 approve succeeded (fresh version at the time): VarianceRequest.${v1}.status == APPROVED"
            - "V2 approve with the pre-V1 stale version returns error_id == ERR_STALE_VERSION (412)"
            - "VarianceRequest.${v2}.status remains UNDER_REVIEW"

      - name: c_derived_field_recompute_on_profile_patch
        claim_type: derived_field_reconciliation
        grounds: [calculations.risk_classification, entities.Establishment.fields.pumping_frequency_days, calculations.compliance_posture]
        distinguishing_aspect: "PATCHing fryer_count 3 -> 0 recomputes risk_score 80 -> 50, flips risk_class HIGH -> MEDIUM, and stretches pumping_frequency_days 90 -> 180 in the same response (immediate reconciliation of derived fields)."
        test_recipe:
          setup: ["HIGH establishment (seats 200, fryers 3, HIGH_GREASE): score 80, freq 90"]
          setup_api_calls:
            - call: "POST /establishments"
              payload: { name: "Recompute Ramen", street_address: "41 Z St", seating_capacity: 200, fryer_count: 3, has_charbroiler: false, cuisine_profile: HIGH_GREASE }
              as: ProgramAdmin
              captures: { est_id: $.data.id, est_v: $.data.version }
          trigger:
            - call: "PATCH /establishments/${est_id}"
              payload: { fryer_count: 0, expected_establishment_version: "${est_v}" }
              as: ProgramAdmin
          assert:
            - "Establishment.${est_id}.risk_score == 50 (min(40, 20) + min(30, 0) + 30)"
            - "risk_class == MEDIUM and pumping_frequency_days == 180 (recomputed in the same request)"
            - "version == 2 after the PATCH"

      - name: c_cascading_side_effects_excluded
        claim_type: cascading_side_effects
        grounds: [state_machines.PumpManifest.SUBMITTED_to_REJECTED, state_machines.Violation.NOTICED_to_CITATION]
        excluded_because:
          difficulty_instance: "transitive_cascade / manifest_rejection_suspends_hauler_and_orphans_manifests"
          rationale: "Both declared cascades are exercised end-to-end by the two §1.8 transitive_cascade instances (reject chain and sweep chain)."

      - name: c_rate_threshold_triggers_excluded
        claim_type: rate_threshold_triggers
        grounds: [calculations.inspection_score, entities.Hauler.fields.mismatch_count]
        excluded_because:
          difficulty_instance: "transitive_cascade / manifest_rejection_suspends_hauler_and_orphans_manifests"
          rationale: "The cumulative mismatch threshold (2 -> 3 auto-suspension) is asserted there; the instantaneous score threshold (70) is asserted by boundary_precision_check / inspection_score_exactly_seventy_passes."

  # ---------------------------------------------------------------------------
  - section: consistency_model
    instances:
      - name: c_immediate_read_after_write
        claim_type: immediate
        grounds: [entities.GreaseInterceptor, calculations.interceptor_required_capacity]
        distinguishing_aspect: "Under the immediate consistency model, the interceptor's create response and a follow-up GET show identical state, including the computed provisional_required_gal (495 for a 200-seat/3-fryer/HIGH profile), with no reconciliation delay."
        test_recipe:
          setup: ["HIGH establishment"]
          setup_api_calls:
            - call: "POST /establishments"
              payload: { name: "Immediate Inc", street_address: "42 Z St", seating_capacity: 200, fryer_count: 3, has_charbroiler: false, cuisine_profile: HIGH_GREASE }
              as: ProgramAdmin
              captures: { est_id: $.data.id }
          trigger:
            - call: "POST /interceptors"
              payload: { establishment_id: "${est_id}", nominal_capacity_gal: 600 }
              as: ProgramAdmin
              captures: { int_id: $.data.id }
            - call: "GET /interceptors/${int_id}"
              as: ProgramAdmin
          assert:
            - "create response and GET agree: status == PROPOSED, provisional_required_gal == 495"
            - "GET /interceptors?establishment_id=${est_id} already contains ${int_id} (list visibility is immediate)"
