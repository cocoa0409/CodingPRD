  # ===========================================================================
  # Section: endpoints (pagination, reverse lookup)
  # ===========================================================================
  - section: endpoints
    instances:
      - name: orders_list_pagination_envelope
        claim_type: listing
        grounds: ["endpoints[GET /api/reman-orders]", response_envelope]
        distinguishing_aspect: "GET /api/reman-orders?limit=1 returns exactly 1 item with pagination fields total_count == 2 and has_more == true; offset=1 returns the second item with has_more == false."
        test_recipe:
          setup: ["one MIN model; two reman orders created"]
          setup_api_calls:
            - call: "POST /api/transmission-models"
              payload: { model_code: "MIN-6L80", year_start: 2014, year_end: 2019, make: "GM", model: "Silverado", core_deposit_cents: 50000, flat_rate_hours: 6.0, labor_cap_cents: 90000, dyno_targets: [ {gear: 1, target_pressure_kpa: 200} ], required_parts: [] }
              as: ProgramAdmin
              captures: { m_id: "$.data.id" }
            - call: "POST /api/reman-orders"
              payload: { transmission_model_id: "${m_id}", buyer_ref: "BUYER-1" }
              as: RemanPlanner
              captures: { o1_id: "$.data.id" }
            - call: "POST /api/reman-orders"
              payload: { transmission_model_id: "${m_id}", buyer_ref: "BUYER-2" }
              as: RemanPlanner
              captures: { o2_id: "$.data.id" }
          trigger:
            - call: "GET /api/reman-orders?limit=1&offset=0"
              as: Any
            - call: "GET /api/reman-orders?limit=1&offset=1"
              as: Any
          assert:
            - "first page: data length == 1, total_count == 2, has_more == true"
            - "second page: data length == 1, total_count == 2, has_more == false"
            - "the two pages return distinct order ids ${o1_id} and ${o2_id}"

      - name: interchange_filtered_list_reverse_lookup
        claim_type: parent_relationships
        grounds: ["endpoints[GET /api/interchange-mappings]", entities.InterchangeMapping.fields.transmission_model_id]
        distinguishing_aspect: "Children are discoverable from the parent: GET /api/interchange-mappings?transmission_model_id=<m> returns the mapping row(s) for that model."
        test_recipe:
          setup: ["one model, one part, one DIRECT mapping between them"]
          setup_api_calls:
            - call: "POST /api/transmission-models"
              payload: { model_code: "MIN-6L80", year_start: 2014, year_end: 2019, make: "GM", model: "Silverado", core_deposit_cents: 50000, flat_rate_hours: 6.0, labor_cap_cents: 90000, dyno_targets: [ {gear: 1, target_pressure_kpa: 200} ], required_parts: [] }
              as: ProgramAdmin
              captures: { m_id: "$.data.id" }
            - call: "POST /api/hard-parts"
              payload: { part_number: "P-100", part_family: "PUMP", unit_cost_cents: 1000, qty_on_hand: 5 }
              as: InventoryPlanner
              captures: { p_id: "$.data.id" }
            - call: "POST /api/interchange-mappings"
              payload: { hard_part_id: "${p_id}", transmission_model_id: "${m_id}", tier: "DIRECT" }
              as: InventoryPlanner
          trigger:
            - call: "GET /api/interchange-mappings?transmission_model_id=${m_id}"
              as: Any
          assert:
            - "response data length == 1 and data[0].hard_part_id == ${p_id}"
            - "GET /api/interchange-mappings?hard_part_id=${p_id} also returns the same single mapping"

