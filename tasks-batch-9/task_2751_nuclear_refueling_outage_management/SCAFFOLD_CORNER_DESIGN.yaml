              as: StationAdmin
              captures: { ra_y: "$.data.id" }
            - call: "POST /outages"
              payload: { station_unit: "UNIT_1", designation: "1R24", duration_target_hours: 720, dose_budget_total_mrem: 5000, cost_budget_usd: 40000000, scope_freeze_at: "2026-08-15T00:00:00.000Z" }
              as: StationAdmin
              captures: { o_id: "$.data.id" }
            - call: "POST /outages/${o_id}/work-orders"
              payload: { wo_type: "INSPECTION", title: "Survey X", estimated_hours: 60, estimated_cost_usd: 100000, estimated_dose_mrem: 100, requires_rad_work: true }
              as: OutagePlanner
              captures: { wo_x: "$.data.id" }
            - call: "POST /outages/${o_id}/work-orders"
              payload: { wo_type: "INSPECTION", title: "Survey Y", estimated_hours: 60, estimated_cost_usd: 100000, estimated_dose_mrem: 100, requires_rad_work: true }
              as: OutagePlanner
              captures: { wo_y: "$.data.id" }
            - call: "POST /work-orders/${wo_x}/plan"
              payload: {}
              as: OutagePlanner
            - call: "POST /work-orders/${wo_x}/approve-scope"
              payload: {}
              as: OutageDirector
            - call: "POST /work-orders/${wo_y}/plan"
              payload: {}
              as: OutagePlanner
            - call: "POST /work-orders/${wo_y}/approve-scope"
              payload: {}
              as: OutageDirector
