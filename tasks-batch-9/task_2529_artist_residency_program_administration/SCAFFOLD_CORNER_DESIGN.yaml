              as: FacilitiesManager
              as_user_id: "fac-01"
              captures: { sa: "$.data.id", chosen: "$.data.studio_id" }
          assert:
            - "201 with selection_mode == 'AUTO_SELECTED' and ${chosen} == ${s_c} - S-C wins the ordering (VENTILATION_RANK 1, 2 tags, headcount 1, code 'S-C')"
            - "the two filtered studios never compete: S-E fails the capability subset test (WELDING not in ['PRINT_PRESS']) and S-F fails ventilation (VENTILATION_RANK['NONE'] 0 < VENTILATION_RANK['LOCAL'] 1) even though S-F has the FEWEST tags, proving filtering runs before ranking"
            - "the first key is ventilation rank, not equipment breadth: S-B (FUME_HOOD, rank 2) loses to S-C despite being over-provisioned in exactly the way the ranking is meant to avoid"
            - "the second key breaks the remaining rank-1 tie: S-A (3 tags) loses to S-C (2 tags)"
            - "the last key is the business code, not the id: S-C and S-D are identical on every substantive key and S-C wins because 'S-C' < 'S-D' - the outcome is unchanged if the studios are registered in the opposite order (S-D created before S-C), which would flip an insertion-order or id-order selector"
            - "the assignment's derived fields are correct: occupied_days == 56 (2026-12-27 - 2026-11-02 + 1)"
            - "the ledgers moved on the chosen studio only: GET /studios/${s_c} shows reserved_resident_days == 56 and active_assignment_count == 1, while S-A, S-B and S-D all still read reserved_resident_days == 0 and active_assignment_count == 0"
            - "Residency.assigned_studio_code == 'S-C', copied from the chosen studio's code"
            - "an explicit choice bypasses the selector entirely: the same call with studio_id ${s_a} returns selection_mode == 'EXPLICIT' and studio_id ${s_a}, because S-A is eligible even though it is not the ranked winner"

      - name: studio_selector_ignores_unavailable_studios_and_released_assignments
        claim_type: input_set_filtering
        grounds: ["calculations.studio_auto_selection.input_set", "entities.Studio.status", "errors[ERR_NO_STUDIO_AVAILABLE]", "errors[ERR_FACILITY_UNAVAILABLE]"]
        distinguishing_aspect: "The candidate set is doubly filtered by state: only Studio rows in AVAILABLE are considered, and only StudioAssignment rows in ACTIVE block a window. Both halves are exercised on the SAME two studios by flipping S-C to MAINTENANCE and by releasing an assignment - and the empty-set fallback (ERR_NO_STUDIO_AVAILABLE 409) is distinguished from naming an unavailable studio explicitly (ERR_FACILITY_UNAVAILABLE 422)."
        test_recipe:
          setup: ["A scheduled 8-week SCULPT residency (2026-11-02 .. 2026-12-27, discipline requires WELDING and LOCAL) and exactly two eligible studios, S-C and S-D, both ['WELDING','KILN'] LOCAL max_concurrent_residents 1."]
          setup_api_calls:
            - call: "POST /cycles"
              payload: { code: "CY-2027", open_at: "2026-08-01T00:00:00Z", close_at: "2026-09-30T00:00:00Z",
                         application_fee_cents: 5000, panel_quorum: 2, cohort_target_size: 10,
                         alumni_reserve_pct: 0.25, stipend_pool_cents: 20000000, slate_min_score: 60.00,
                         stipend_weekly_rate_cents: 70000, session_length_options_weeks: [4, 5, 8, 9] }
              as: ProgramAdmin
              as_user_id: "admin-01"
              captures: { cyc: "$.data.id" }
            - call: "POST /disciplines"
              payload: { cycle_id: "${cyc}", code: "SCULPT", name: "Sculpture", portfolio_min_items: 1,
                         portfolio_max_items: 6, required_media_types: ["IMAGE"], requires_hazmat_review: false,
                         cohort_min_slots: 1, cohort_max_slots: 6, required_capability_tags: ["WELDING"],
                         required_ventilation_class: "LOCAL" }
              as: ProgramAdmin
              as_user_id: "admin-01"
              captures: { disc: "$.data.id" }
            - call: "POST /applicants"
              payload: { full_name: "Ada Rivet", email: "ada.rivet@example.org",
                         affiliation_org: "North Shore Collective", citizenship_country: "US",
                         treaty_country: false, declared_annual_income_cents: 2000000 }
              as: ProgramAdmin
              as_user_id: "admin-01"
              captures: { art: "$.data.id" }
            - call: "POST /cycles/${cyc}/stage"
              payload: { to_status: "OPEN" }
              as: ProgramAdmin
              as_user_id: "admin-01"
            - call: "POST /residencies"
              payload: { cycle_id: "${cyc}", applicant_id: "${art}", discipline_id: "${disc}" }
              as: ProgramAdmin
              as_user_id: "admin-01"
              captures: { res: "$.data.id" }
            - call: "POST /residencies/${res}/schedule"
              payload: { session_start_date: "2026-11-02", session_length_weeks: 8 }
              as: ProgramAdmin
              as_user_id: "admin-01"
              captures: { res_v0: "$.data.version" }
            - call: "POST /studios"
              payload: { code: "S-C", capability_tags: ["WELDING", "KILN"], ventilation_class: "LOCAL", max_concurrent_residents: 1, status: "AVAILABLE" }
              as: FacilitiesManager
              as_user_id: "fac-01"
              captures: { s_c: "$.data.id" }
            - call: "POST /studios"
              payload: { code: "S-D", capability_tags: ["WELDING", "KILN"], ventilation_class: "LOCAL", max_concurrent_residents: 1, status: "AVAILABLE" }
              as: FacilitiesManager
              as_user_id: "fac-01"
              captures: { s_d: "$.data.id" }
            - call: "PATCH /studios/${s_c}"
              payload: { status: "MAINTENANCE" }
              as: FacilitiesManager
              as_user_id: "fac-01"
          trigger:
            - call: "POST /studio-assignments"
              payload: { residency_id: "${res}", start_date: "2026-11-02", end_date: "2026-12-27", expected_residency_version: "${res_v0}" }
              as: FacilitiesManager
              as_user_id: "fac-01"
              captures: { sa: "$.data.id", chosen: "$.data.studio_id" }
          assert:
            - "S-C is excluded by status alone: the winner is ${chosen} == ${s_d} with selection_mode 'AUTO_SELECTED', even though 'S-C' < 'S-D' would have won the tie-break had S-C been AVAILABLE"
            - "naming the unavailable studio explicitly is a different failure from an empty candidate set: the same call with studio_id ${s_c} returns 422 ERR_FACILITY_UNAVAILABLE, not 409 ERR_NO_STUDIO_AVAILABLE"
            - "DECOMMISSIONED is filtered identically to MAINTENANCE: with S-C DECOMMISSIONED and S-D also patched to MAINTENANCE, an auto-select request returns 409 ERR_NO_STUDIO_AVAILABLE and no StudioAssignment row is created"
            - "the ACTIVE filter is the second half: with S-C restored to AVAILABLE and S-D holding the ACTIVE assignment above, a second auto-select request for the same window picks S-C, because S-D's window is blocked but S-C's is free"
            - "released rows free their window immediately, with no turnaround wait for the SELECTOR's set membership: POST /studio-assignments/${sa}/release, then a fresh GET /residencies/${res} to re-read version, then an auto-select request for the identical window 2026-11-02 .. 2026-12-27 succeeds again on S-D"
            - "the release restored the ledger exactly: GET /studios/${s_d} reads reserved_resident_days == 0 and active_assignment_count == 0 between the release and the re-assignment"
            - "eligibility is evaluated per request, never cached: the winner changes across these calls without any change to the residency or the discipline"

      - name: obligation_provisioning_floors_the_workshop_count_and_re_derives_in_place
        claim_type: aggregation
        grounds: ["calculations.obligation_provisioning", "constants.OBLIGATION_WORKSHOP_WEEKS_PER_UNIT", "endpoints[POST /residencies/{id}/schedule]", "entities.Residency.obligations_required_total"]
        distinguishing_aspect: "floor(weeks / 4) is only observable across session lengths that are NOT multiples of 4: a 5-week session yields the same single workshop as a 4-week one (floor(5/4) == 1), while an 8-week session yields 2. Because MIN_SESSION_WEEKS is 4, the count is never 0, so the interesting behaviour is the floor plus the in-place re-derivation on reschedule - which must move required_count without creating a fifth row."
        test_recipe:
          setup: ["An OPEN cycle offering session lengths [4, 5, 8, 9] and three invited residencies for three applicants, scheduled at 4, 5 and 8 weeks respectively, all starting 2026-11-02."]
          setup_api_calls:
            - call: "POST /cycles"
              payload: { code: "CY-2027", open_at: "2026-08-01T00:00:00Z", close_at: "2026-09-30T00:00:00Z",
