              captures: { cli_v: $.data.version, accrual_0: $.data.unbilled_accrual_cents }
            - call: "POST /care/care-plans"
              payload: { client_id: "${cli}", source_assessment_id: "${asm}", expected_client_version: "${cli_v}", goals: ["Weekday coordination"] }
              as: CareManager
              as_user_id: "${cm_dana}"
              captures: { cp: $.data.id }
            - call: "PATCH /care/care-plans/${cp}/state"
              payload: { to_state: "PENDING_FAMILY_APPROVAL" }
              as: CareManager
              as_user_id: "${cm_dana}"
            - call: "PATCH /care/care-plans/${cp}/state"
              payload: { to_state: "ACTIVE" }
              as: FamilyDecisionMaker
              as_user_id: "${fc}"
          trigger:
            - call: "POST /care/time-entries"
              payload: { client_id: "${cli}", care_manager_id: "${cm_dana}", service_type: "CARE_COORDINATION", start_at: "2026-09-14T10:00:00Z", end_at: "2026-09-14T11:00:00Z", service_location_id: "OFFICE" }
              as: CareManager
              as_user_id: "${cm_dana}"
              captures: { t1: $.data.id, t1_amt: $.data.billable_amount_cents }
            - call: "GET /care/clients/${cli}"
              as: CareManager
              as_user_id: "${cm_dana}"
              captures: { accrual_1: $.data.unbilled_accrual_cents }
            - call: "PATCH /care/time-entries/${t1}/state"
              payload: { to_state: "SUBMITTED" }
              as: CareManager
              as_user_id: "${cm_dana}"
            - call: "PATCH /care/time-entries/${t1}/state"
              payload: { to_state: "APPROVED" }
              as: PracticeSupervisor
              as_user_id: "${cm_iris}"
            - call: "GET /care/clients/${cli}"
              as: CareManager
              as_user_id: "${cm_dana}"
              captures: { accrual_2: $.data.unbilled_accrual_cents }
            - call: "POST /care/time-entries"
              payload: { client_id: "${cli}", care_manager_id: "${cm_dana}", service_type: "CARE_COORDINATION", start_at: "2026-09-14T13:00:00Z", end_at: "2026-09-14T13:20:00Z", service_location_id: "OFFICE" }
              as: CareManager
              as_user_id: "${cm_dana}"
              captures: { t2: $.data.id, t2_amt: $.data.billable_amount_cents }
            - call: "GET /care/clients/${cli}"
              as: CareManager
              as_user_id: "${cm_dana}"
              captures: { accrual_3: $.data.unbilled_accrual_cents }
            - call: "PATCH /care/time-entries/${t2}/state"
              payload: { to_state: "SUBMITTED" }
              as: CareManager
              as_user_id: "${cm_dana}"
            - call: "PATCH /care/time-entries/${t2}/state"
              payload: { to_state: "REJECTED", reason: "Duplicate of the morning call" }
              as: PracticeSupervisor
              as_user_id: "${cm_iris}"
              captures: { t2_status: $.data.status }
            - call: "GET /care/clients/${cli}"
              as: CareManager
              as_user_id: "${cm_dana}"
              captures: { accrual_4: $.data.unbilled_accrual_cents }
            - call: "POST /care/time-entries"
              payload: { client_id: "${cli}", care_manager_id: "${cm_dana}", service_type: "CARE_COORDINATION", start_at: "2026-09-14T19:00:00Z", end_at: "2026-09-14T20:00:00Z", service_location_id: "CLIENT_HOME" }
              as: CareManager
              as_user_id: "${cm_dana}"
              captures: { t3: $.data.id, t3_amt: $.data.billable_amount_cents }
            - call: "PATCH /care/time-entries/${t3}/state"
              payload: { to_state: "SUBMITTED" }
              as: CareManager
              as_user_id: "${cm_dana}"
            - call: "PATCH /care/time-entries/${t3}/state"
              payload: { to_state: "APPROVED" }
              as: PracticeSupervisor
              as_user_id: "${cm_iris}"
            - call: "GET /care/clients/${cli}"
              as: CareManager
              as_user_id: "${cm_dana}"
              captures: { accrual_5: $.data.unbilled_accrual_cents }
            - call: "POST /care/invoices"
              payload: { client_id: "${cli}", period_start: "2026-09-01", period_end: "2026-09-30" }
              as: BillingAdministrator
              captures: { inv: $.data.id, prov_subtotal: $.data.line_subtotal_cents }
            - call: "GET /care/clients/${cli}"
              as: CareManager
              as_user_id: "${cm_dana}"
              captures: { accrual_6: $.data.unbilled_accrual_cents }
            - call: "PATCH /care/invoices/${inv}/state"
              payload: { to_state: "ISSUED" }
              as: BillingAdministrator
              captures: { final_subtotal: $.data.line_subtotal_cents, fee: $.data.admin_fee_cents, total: $.data.total_due_cents }
            - call: "GET /care/clients/${cli}"
              as: CareManager
              as_user_id: "${cm_dana}"
              captures: { accrual_7: $.data.unbilled_accrual_cents, cli_status: $.data.status }
          assert:
            - "Per-entry amounts: ${t1_amt} == 22500 (60 min at 22500/h, daytime), ${t2_amt} == 11250 (20 min ceilinged to 30), ${t3_amt} == 27000 (60 min at the 1.20 after-hours factor since 19:00 UTC >= 18)"
            - "Accrual before any entry is 0: ${accrual_0} == 0"
            - "A DRAFT entry already counts: ${accrual_1} == 22500, and approval does not change it: ${accrual_2} == 22500"
            - "The second DRAFT entry adds in: ${accrual_3} == 33750; its rejection removes it again: ${accrual_4} == 22500 with ${t2_status} == \"REJECTED\""
            - "After the after-hours entry is approved: ${accrual_5} == 49500"
            - "Creating the DRAFT invoice moves no money and leaves the accrual untouched: ${prov_subtotal} == 49500 and ${accrual_6} == 49500"
            - "Issuing the invoice flips both entries to INVOICED, so the accrual drops to zero: ${final_subtotal} == 49500, ${fee} == 3465, ${total} == 52965, ${accrual_7} == 0"
            - "The rejected entry is never invoiced: its invoice_id stays null and ${cli_status} == \"ACTIVE_CARE\" (retainer_floor_cents is 0, so no nonpayment suspension fires)"

      - name: five_level_cascade_verified_end_to_end
        claim_type: cascading_side_effects
        grounds:
          - state_machines.Invoice.ISSUED_to_VOIDED.side_effects
          - complexity_profile.complexity_layers[cascading_side_effects]
        excluded_because:
          difficulty_instance: "transitive_cascade / invoice_void_five_hop_release_cascade"
          rationale: "The deepest cascade in the scaffold — invoice void releasing entries, reversing the retainer draw, reactivating suspended authorizations, recomputing coverage hours and reverting the client's nonpayment suspension — is already asserted hop by hop there; a second end-to-end walk would duplicate its assertions."

      - name: cascade_reversal_leaves_no_ledger_drift
        claim_type: cascading_side_effects
        grounds:
          - calculations.client_retainer_and_accrual_ledger
          - complexity_profile.complexity_layers[cascading_side_effects]
        excluded_because:
          difficulty_instance: "compensating_invariant / retainer_money_conserved_across_invoice_issue_and_void"
          rationale: "The forward/compensating pair and the conserved-money invariant across it are the entire subject of that difficulty instance, including the assertion that no rounding residue is left behind."

      - name: invoice_variant_divergence_and_switch_delta
        claim_type: dual_variant_calculation
        grounds:
          - calculations.invoice_totals.variants
          - complexity_profile.complexity_layers[dual_variant_calculation]
        excluded_because:
          difficulty_instance: "dual_variant_calc / invoice_provisional_versus_final_variant_divergence"
          rationale: "That instance holds the data fixed and shows PROVISIONAL (SUBMITTED + APPROVED) and FINAL (APPROVED only) diverging on the same invoice row, plus the exact delta debited at issue."

      - name: acuity_variant_divergence_on_identical_domain_scores
        claim_type: dual_variant_calculation
        grounds:
          - calculations.assessment_acuity.variants
          - complexity_profile.complexity_layers[dual_variant_calculation]
        excluded_because:
          difficulty_instance: "dual_variant_calc / assessment_screening_versus_comprehensive_acuity_divergence"
          rationale: "The unweighted SCREENING mean versus the safety/cognition-weighted COMPREHENSIVE sum over one unchanged domain_scores map is exactly what that instance asserts, including the resulting risk_posture."

  - section: consistency_model
    instances:
      - name: every_cascaded_change_is_visible_in_the_same_response
        claim_type: immediate
        grounds:
          - complexity_profile.consistency_model
          - endpoints[PATCH /care/invoices/{invoiceId}/state].side_effects
          - endpoints[PATCH /care/clients/{clientId}/state].side_effects
        distinguishing_aspect: "The consistency model is immediate, so a single mutation's own response body already carries every derived field the cascade touched — a follow-up GET issued immediately afterwards returns byte-identical derived values, with no second call needed to settle them."
        test_recipe:
          setup:
            - "CareManager Dana, supervisor Iris, Client Kalev (billing_increment_min 15, retainer_floor_cents 50000, authorized_concurrent_caregivers 2), surrogate Lida, vendor Northgate."
            - "ACCEPTED assessment, ACTIVE plan, one AUTHORIZED authorization, one APPROVED four-hour time entry, and a 50000-cent retainer deposit that exactly meets the floor."
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-09-17T09:00:00Z" }
              as: PracticeAdmin
            - call: "POST /care/care-managers"
              payload: { full_name: "Dana Reyes", credential: "CMC", hourly_rate_cents: 22500 }
              as: PracticeAdmin
              captures: { cm_dana: $.data.id }
            - call: "POST /care/care-managers"
              payload: { full_name: "Iris Vance", credential: "CCM", hourly_rate_cents: 30000, is_supervisor: true }
              as: PracticeAdmin
              captures: { cm_iris: $.data.id }
            - call: "POST /care/clients"
              payload: { full_name: "Kalev Saar", residence_setting: "PRIVATE_HOME", billing_increment_min: 15, retainer_floor_cents: 50000, authorized_concurrent_caregivers: 2 }
              as: PracticeAdmin
              captures: { cli: $.data.id }
            - call: "POST /care/family-contacts"
              payload: { client_id: "${cli}", full_name: "Lida Saar", contact_role: "POA_HEALTHCARE", is_surrogate_decision_maker: true }
              as: PracticeAdmin
              captures: { fc: $.data.id }
            - call: "POST /care/vendors"
              payload: { name: "Northgate Home Care", vendor_type: "HOME_CARE", has_referral_relationship: false }
              as: PracticeAdmin
              captures: { vnd: $.data.id }
            - call: "POST /care/clients/${cli}/retainer-deposits"
              payload: { amount_cents: 50000, received_at: "2026-09-17T09:00:00Z" }
              as: BillingAdministrator
              captures: { bal_0: $.data.retainer_balance_cents }
            - call: "POST /care/assessments"
              payload: { client_id: "${cli}", care_manager_id: "${cm_dana}", domain_scores: { adl: 2, cognition: 2, medical_complexity: 2, social_support: 2, safety: 2, finances: 2 } }
              as: CareManager
              as_user_id: "${cm_dana}"
              captures: { asm: $.data.id }
            - call: "PATCH /care/assessments/${asm}/state"
              payload: { to_state: "SUBMITTED" }
              as: CareManager
              as_user_id: "${cm_dana}"
            - call: "PATCH /care/assessments/${asm}/state"
              payload: { to_state: "ACCEPTED" }
              as: PracticeSupervisor
              as_user_id: "${cm_iris}"
            - call: "GET /care/clients/${cli}"
              as: CareManager
              as_user_id: "${cm_dana}"
              captures: { cli_v: $.data.version }
            - call: "POST /care/care-plans"
              payload: { client_id: "${cli}", source_assessment_id: "${asm}", expected_client_version: "${cli_v}", goals: ["Evening coverage"] }
              as: CareManager
              as_user_id: "${cm_dana}"
              captures: { cp: $.data.id }
            - call: "PATCH /care/care-plans/${cp}/state"
              payload: { to_state: "PENDING_FAMILY_APPROVAL" }
              as: CareManager
              as_user_id: "${cm_dana}"
            - call: "PATCH /care/care-plans/${cp}/state"
              payload: { to_state: "ACTIVE" }
              as: FamilyDecisionMaker
              as_user_id: "${fc}"
              captures: { cp_v: $.data.version }
            - call: "POST /care/service-authorizations"
              payload: { care_plan_id: "${cp}", vendor_id: "${vnd}", expected_care_plan_version: "${cp_v}", coverage_start: "2026-09-20T08:00:00Z", coverage_end: "2026-09-20T14:00:00Z", concurrent_caregivers: 1, hourly_cost_cents: 4000 }
              as: CareManager
              as_user_id: "${cm_dana}"
              captures: { auth: $.data.id }
            - call: "PATCH /care/service-authorizations/${auth}/state"
              payload: { to_state: "AUTHORIZED" }
              as: PracticeSupervisor
              as_user_id: "${cm_iris}"
              captures: { auth_hours: $.data.coverage_hours }
            - call: "POST /care/time-entries"
              payload: { client_id: "${cli}", care_manager_id: "${cm_dana}", service_type: "CARE_COORDINATION", start_at: "2026-09-14T10:00:00Z", end_at: "2026-09-14T14:00:00Z", service_location_id: "OFFICE" }
              as: CareManager
              as_user_id: "${cm_dana}"
              captures: { te: $.data.id, te_amt: $.data.billable_amount_cents }
            - call: "PATCH /care/time-entries/${te}/state"
              payload: { to_state: "SUBMITTED" }
              as: CareManager
              as_user_id: "${cm_dana}"
            - call: "PATCH /care/time-entries/${te}/state"
              payload: { to_state: "APPROVED" }
              as: PracticeSupervisor
              as_user_id: "${cm_iris}"
            - call: "POST /care/invoices"
              payload: { client_id: "${cli}", period_start: "2026-09-01", period_end: "2026-09-30" }
              as: BillingAdministrator
              captures: { inv: $.data.id }
          trigger:
            - call: "PATCH /care/invoices/${inv}/state"
              payload: { to_state: "ISSUED" }
              as: BillingAdministrator
              captures: { inv_status: $.data.status, applied: $.data.retainer_applied_cents, balance: $.data.balance_due_cents }
            - call: "GET /care/clients/${cli}"
              as: BillingAdministrator
              captures: { cli_status: $.data.status, bal_1: $.data.retainer_balance_cents, hours_1: $.data.authorized_coverage_hours, accrual_1: $.data.unbilled_accrual_cents }
            - call: "GET /care/service-authorizations/${auth}"
              as: BillingAdministrator
              captures: { auth_status_1: $.data.auth_status, susp_reason: $.data.suspension_reason }
            - call: "GET /care/invoices/${inv}"
              as: BillingAdministrator
              captures: { inv_status_2: $.data.status, applied_2: $.data.retainer_applied_cents, balance_2: $.data.balance_due_cents }
          assert:
            - "The deposit response already shows ${bal_0} == 50000 — no separate read is needed to see a derived field settle — and it is exactly the retainer floor, so the AUTHORIZED transition passes priority 75"
            - "The four-hour entry is ${te_amt} == 90000, so the invoice totals are line_subtotal 90000, admin_fee 6300 and total_due 96300"
            - "The issue response itself reports ${inv_status} == \"ISSUED\", ${applied} == 50000 (the whole retainer, since total_due 96300 exceeds it) and ${balance} == 46300"
            - "The immediately following client read agrees with that response: ${bal_1} == 0, ${accrual_1} == 0, and ${cli_status} == \"SUSPENDED_NONPAYMENT\" because 0 < the 50000 floor while balance_due > 0"
            - "The nonpayment cascade is visible in the same round: ${auth_status_1} == \"SUSPENDED\" with ${susp_reason} == \"NONPAYMENT\", and ${hours_1} == 0 even though ${auth_hours} was 6 before the issue"
            - "Re-reading the invoice returns identical money fields: ${inv_status_2} == ${inv_status}, ${applied_2} == ${applied}, ${balance_2} == ${balance} — nothing lags or settles later"
