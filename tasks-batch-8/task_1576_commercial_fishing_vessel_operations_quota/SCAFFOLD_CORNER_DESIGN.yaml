          assert:
            - "error_id == ERR_DECLARATION_EXISTS (http 409)"

      - name: compliance_too_low_reinstate_rejected
        claim_type: precondition_enforcement
        grounds:
          - state_machines.Vessel.SUSPENDED_to_ACTIVE
          - errors[ERR_COMPLIANCE_TOO_LOW]
        distinguishing_aspect: "Reinstatement requires compliance_points >= 50; a vessel sitting at 5 stays suspended."
        test_recipe:
          setup: ["vessel SUSPENDED at 5 points after three OVER_QUOTA adjudications (20, 30, 45)"]
          setup_api_calls:
            - { call: "POST /vessels", payload: { vessel_name: "FV Aurora", license_number: "LIC-Z7", home_port: "HOMER", length_ft: 58, observer_coverage_class: "PARTIAL" }, as: FisheriesRegulator, captures: { v1: $.data.id } }
