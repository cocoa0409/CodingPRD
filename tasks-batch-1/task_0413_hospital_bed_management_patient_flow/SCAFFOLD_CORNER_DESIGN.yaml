# =============================================================================
# §1.9 Scaffold Corner Design (Coverage Index for Non-Difficulty Tests)
# Hospital Bed Management & Patient Flow — breadth probe.
# Walks references/claim-extraction-guide.md section-by-section against §1.1–§1.7.
# excluded_because stubs cite §1.8 instances by name.
# =============================================================================
scaffold_corner_design:

  # ===========================================================================
  - section: entities
    instances:
      - name: create_unit_returns_201_with_computed_defaults
        claim_type: Creation
        grounds: [entities.Unit, endpoints]
        distinguishing_aspect: "POST /units with name+unit_type returns 201; staffed/occupied/clean counts 0, derived_posture=CLOSED, effective_posture=CLOSED, declared_surge_level=GREEN, version=1."
        test_recipe:
          setup: ["Empty DB."]
          setup_api_calls:
            - call: "POST /_clock/set"
              payload: { to_iso8601: "2026-06-01T00:00:00Z" }
              as: FlowAdmin
          trigger:
            - call: "POST /units"
              payload: { name: "Ward A", unit_type: "MEDSURG" }
              as: FlowAdmin
              captures: { u1: $.data.id }
          assert:
            - "response code == 201"
            - "Unit.${u1}.staffed_bed_count == 0"
            - "Unit.${u1}.derived_posture == CLOSED"
            - "Unit.${u1}.effective_posture == CLOSED"
            - "Unit.${u1}.declared_surge_level == GREEN"
            - "Unit.${u1}.version == 1"

      - name: create_unit_gmlos_default_applied
        claim_type: Defaults
        grounds: [entities.Unit.fields.gmlos_days]
        distinguishing_aspect: "Omitting gmlos_days on POST /units applies default 3."
        test_recipe:
          setup: ["Empty DB."]
          setup_api_calls: []
          trigger:
            - call: "POST /units"
              payload: { name: "Ward B", unit_type: "ICU" }
              as: FlowAdmin
              captures: { u1: $.data.id }
          assert:
            - "Unit.${u1}.gmlos_days == 3"

      - name: create_encounter_missing_sex_returns_invalid_request
        claim_type: Required Fields
        grounds: [entities.Encounter.fields.sex, "validations[priority=5]", "errors[ERR_INVALID_REQUEST]"]
        distinguishing_aspect: "POST /encounters without sex (required, no default) → ERR_INVALID_REQUEST (422)."
        test_recipe:
          setup: ["Empty DB."]
          setup_api_calls: []
          trigger:
            - call: "POST /encounters"
              payload: { mrn: "MX1", origin: "ED" }
              as: BedControlCoordinator
              captures: { eid: $.data.error_id }
          assert:
            - "response error_id == ERR_INVALID_REQUEST"
            - "response code == 422"

      - name: create_encounter_invalid_enum_origin_returns_invalid_request
        claim_type: Type Constraints
        grounds: [entities.Encounter.fields.origin, "errors[ERR_INVALID_REQUEST]"]
        distinguishing_aspect: "POST /encounters with origin not in {ED,DIRECT,TRANSFER_IN} → ERR_INVALID_REQUEST."
        test_recipe:
          setup: ["Empty DB."]
          setup_api_calls: []
          trigger:
            - call: "POST /encounters"
              payload: { mrn: "MX2", sex: "MALE", origin: "WALKIN" }
              as: BedControlCoordinator
              captures: { eid: $.data.error_id }
          assert:
            - "response error_id == ERR_INVALID_REQUEST"

      - name: create_encounter_defaults_origin_ed_and_flags_false
        claim_type: Defaults
        grounds: [entities.Encounter.fields.origin, entities.Encounter.fields.requires_isolation, entities.Encounter.fields.requires_telemetry]
        distinguishing_aspect: "Omitting origin/requires_isolation/requires_telemetry applies origin=ED, both flags false; status=REGISTERED."
        test_recipe:
          setup: ["Empty DB."]
          setup_api_calls: []
          trigger:
            - call: "POST /encounters"
              payload: { mrn: "MX3", sex: "FEMALE" }
              as: BedControlCoordinator
              captures: { e1: $.data.id }
          assert:
            - "Encounter.${e1}.origin == ED"
            - "Encounter.${e1}.requires_isolation == false"
            - "Encounter.${e1}.requires_telemetry == false"
            - "Encounter.${e1}.status == REGISTERED"

      - name: get_unit_nonexistent_returns_not_found
        claim_type: Not Found
        grounds: [endpoints, "validations[priority=3]", "errors[ERR_NOT_FOUND]"]
        distinguishing_aspect: "GET /units/{random-uuid} → ERR_NOT_FOUND (404)."
        test_recipe:
          setup: ["Empty DB."]
          setup_api_calls: []
          trigger:
            - call: "GET /units/00000000-0000-4000-8000-000000000000"
              payload: {}
              as: BedControlCoordinator
              captures: { eid: $.data.error_id }
          assert:
            - "response error_id == ERR_NOT_FOUND"
            - "response code == 404"

      - name: create_bed_system_fields_ignored_and_starts_dirty
        claim_type: System Fields
        grounds: [entities.Bed.fields.status, entities.Bed.fields.sex_cohort]
        distinguishing_aspect: "POST /units/{id}/beds ignores any client-supplied status; bed starts DIRTY with sex_cohort=NONE and server-minted id."
        test_recipe:
          setup: ["Unit U1 exists."]
          setup_api_calls:
            - call: "POST /units"
              payload: { name: "Ward C", unit_type: "MEDSURG" }
              as: FlowAdmin
              captures: { u1: $.data.id }
          trigger:
            - call: "POST /units/${u1}/beds"
              payload: { unit_id: "${u1}", label: "C1" }
              as: ChargeNurse
              captures: { b1: $.data.id }
          assert:
            - "Bed.${b1}.status == DIRTY"
            - "Bed.${b1}.sex_cohort == NONE"
            - "Bed.${b1}.version == 1"

      - name: create_bedrequest_reference_not_found_encounter
        claim_type: Parent Relationships
        grounds: [entities.BedRequest.fields.encounter_id, "validations[priority=4]", "errors[ERR_REFERENCE_NOT_FOUND]"]
        distinguishing_aspect: "POST /bed-requests with encounter_id that does not resolve → ERR_REFERENCE_NOT_FOUND (404)."
        test_recipe:
          setup: ["Empty DB."]
          setup_api_calls: []
          trigger:
            - call: "POST /bed-requests"
              payload: { encounter_id: "00000000-0000-4000-8000-000000000001" }
              as: TransferCenterAgent
              captures: { eid: $.data.error_id }
          assert:
            - "response error_id == ERR_REFERENCE_NOT_FOUND"

  # ===========================================================================
  - section: state_machines
    instances:
      - name: admit_order_from_already_pending_returns_invalid_state
        claim_type: Invalid Transitions
        grounds: [state_machines.Encounter.REGISTERED_to_ADMIT_PENDING, "validations[priority=6]", "errors[ERR_INVALID_STATE]"]
        distinguishing_aspect: "Second admit-order on an encounter already ADMIT_PENDING (DIRECT origin) → ERR_INVALID_STATE; no AdtEvent appended."
        test_recipe:
          setup: ["DIRECT encounter E1 already ADMIT_PENDING."]
          setup_api_calls:
            - call: "POST /encounters"
              payload: { mrn: "MS1", sex: "MALE", origin: "DIRECT" }
              as: BedControlCoordinator
              captures: { e1: $.data.id }
            - call: "POST /encounters/${e1}/admit-order"
              payload: {}
              as: BedControlCoordinator
          trigger:
            - call: "POST /encounters/${e1}/admit-order"
              payload: {}
              as: BedControlCoordinator
              captures: { eid: $.data.error_id }
          assert:
            - "response error_id == ERR_INVALID_STATE"
            - "Encounter.${e1}.status == ADMIT_PENDING"

      - name: discharge_from_placed_without_order_returns_invalid_state
        claim_type: Invalid Transitions
        grounds: [state_machines.Encounter.DISCHARGE_ORDERED_to_DISCHARGED, "errors[ERR_INVALID_STATE]"]
        distinguishing_aspect: "Discharging a PLACED encounter that was never DISCHARGE_ORDERED → ERR_INVALID_STATE (no barrier check reached)."
        test_recipe:
          setup: ["ED encounter E1 PLACED in B1, status PLACED (no discharge order), zero barriers."]
          setup_api_calls:
            - call: "POST /_clock/set"
              payload: { to_iso8601: "2026-06-05T08:00:00Z" }
              as: FlowAdmin
            - call: "POST /units"
              payload: { name: "DWard", unit_type: "MEDSURG" }
              as: FlowAdmin
              captures: { u1: $.data.id }
            - call: "POST /units/${u1}/beds"
              payload: { unit_id: "${u1}", label: "DD1" }
              as: ChargeNurse
              captures: { b1: $.data.id }
            - call: "POST /units/${u1}/beds/${b1}/mark-clean"
              payload: {}
              as: ChargeNurse
              captures: { b1_v: $.data.version }
            - call: "POST /encounters"
              payload: { mrn: "MS2", sex: "FEMALE", origin: "ED" }
              as: BedControlCoordinator
              captures: { e1: $.data.id }
            - call: "POST /encounters/${e1}/admit-order"
              payload: {}
              as: BedControlCoordinator
            - call: "POST /bed-requests"
              payload: { encounter_id: "${e1}", preferred_unit_id: "${u1}" }
              as: TransferCenterAgent
              captures: { r1: $.data.id }
            - call: "POST /bed-requests/${r1}/assign"
              payload: { bed_id: "${b1}" }
              as: BedControlCoordinator
            - call: "POST /bed-requests/${r1}/confirm"
              payload: { expected_bed_version: "${b1_v}" }
              as: BedControlCoordinator
          trigger:
            - call: "POST /encounters/${e1}/discharge"
              payload: {}
              as: CaseManager
              captures: { eid: $.data.error_id }
          assert:
            - "response error_id == ERR_INVALID_STATE"
            - "Encounter.${e1}.status == PLACED"

      - name: rescind_discharge_revert_loop_to_placed
        claim_type: Valid Transition
        grounds: [state_machines.Encounter.DISCHARGE_ORDERED_to_PLACED, entities.Encounter.fields.discharge_order_at]
        distinguishing_aspect: "rescind-discharge moves DISCHARGE_ORDERED→PLACED and nulls discharge_order_at (the revert loop)."
        test_recipe:
          setup: ["Encounter E1 DISCHARGE_ORDERED in B1."]
          setup_api_calls:
            - call: "POST /_clock/set"
              payload: { to_iso8601: "2026-06-05T08:00:00Z" }
              as: FlowAdmin
            - call: "POST /units"
              payload: { name: "RWard", unit_type: "MEDSURG" }
              as: FlowAdmin
              captures: { u1: $.data.id }
            - call: "POST /units/${u1}/beds"
              payload: { unit_id: "${u1}", label: "RR1" }
              as: ChargeNurse
              captures: { b1: $.data.id }
            - call: "POST /units/${u1}/beds/${b1}/mark-clean"
              payload: {}
              as: ChargeNurse
              captures: { b1_v: $.data.version }
            - call: "POST /encounters"
              payload: { mrn: "MS3", sex: "MALE", origin: "ED" }
              as: BedControlCoordinator
              captures: { e1: $.data.id }
            - call: "POST /encounters/${e1}/admit-order"
              payload: {}
              as: BedControlCoordinator
            - call: "POST /bed-requests"
              payload: { encounter_id: "${e1}", preferred_unit_id: "${u1}" }
              as: TransferCenterAgent
              captures: { r1: $.data.id }
            - call: "POST /bed-requests/${r1}/assign"
              payload: { bed_id: "${b1}" }
              as: BedControlCoordinator
            - call: "POST /bed-requests/${r1}/confirm"
              payload: { expected_bed_version: "${b1_v}" }
              as: BedControlCoordinator
            - call: "POST /encounters/${e1}/discharge-order"
              payload: {}
              as: CaseManager
          trigger:
            - call: "POST /encounters/${e1}/rescind-discharge"
              payload: {}
              as: CaseManager
          assert:
            - "Encounter.${e1}.status == PLACED"
            - "Encounter.${e1}.discharge_order_at == null"

      - name: terminal_discharged_lockdown_no_further_transitions
        claim_type: Terminal State Lockdown
        grounds: [state_machines.Encounter, "errors[ERR_INVALID_STATE]"]
        distinguishing_aspect: "A DISCHARGED encounter rejects discharge-order with ERR_INVALID_STATE (terminal lockdown)."
        test_recipe:
          setup: ["Encounter E1 fully DISCHARGED."]
          setup_api_calls:
            - call: "POST /_clock/set"
              payload: { to_iso8601: "2026-06-05T08:00:00Z" }
              as: FlowAdmin
            - call: "POST /units"
              payload: { name: "TWard", unit_type: "MEDSURG" }
              as: FlowAdmin
              captures: { u1: $.data.id }
            - call: "POST /units/${u1}/beds"
              payload: { unit_id: "${u1}", label: "TT1" }
              as: ChargeNurse
              captures: { b1: $.data.id }
            - call: "POST /units/${u1}/beds/${b1}/mark-clean"
              payload: {}
              as: ChargeNurse
              captures: { b1_v: $.data.version }
            - call: "POST /encounters"
              payload: { mrn: "MS4", sex: "FEMALE", origin: "ED" }
              as: BedControlCoordinator
              captures: { e1: $.data.id }
            - call: "POST /encounters/${e1}/admit-order"
              payload: {}
              as: BedControlCoordinator
            - call: "POST /bed-requests"
              payload: { encounter_id: "${e1}", preferred_unit_id: "${u1}" }
              as: TransferCenterAgent
              captures: { r1: $.data.id }
            - call: "POST /bed-requests/${r1}/assign"
              payload: { bed_id: "${b1}" }
              as: BedControlCoordinator
            - call: "POST /bed-requests/${r1}/confirm"
              payload: { expected_bed_version: "${b1_v}" }
              as: BedControlCoordinator
            - call: "POST /encounters/${e1}/discharge-order"
              payload: {}
              as: CaseManager
            - call: "POST /encounters/${e1}/discharge"
              payload: {}
              as: CaseManager
          trigger:
            - call: "POST /encounters/${e1}/discharge-order"
              payload: {}
              as: CaseManager
              captures: { eid: $.data.error_id }
          assert:
            - "response error_id == ERR_INVALID_STATE"
            - "Encounter.${e1}.status == DISCHARGED"

      - name: retire_from_clean_bed_returns_invalid_state
        claim_type: Invalid Transitions
        grounds: [state_machines.Bed.BLOCKED_to_RETIRED, "errors[ERR_INVALID_STATE]"]
        distinguishing_aspect: "Retire requires BLOCKED; retiring a CLEAN bed → ERR_INVALID_STATE (RETIRED only reachable from BLOCKED)."
        test_recipe:
          setup: ["CLEAN bed B1 in unit U1."]
          setup_api_calls:
            - call: "POST /units"
              payload: { name: "RtWard", unit_type: "MEDSURG" }
              as: FlowAdmin
              captures: { u1: $.data.id }
            - call: "POST /units/${u1}/beds"
              payload: { unit_id: "${u1}", label: "RT1" }
              as: ChargeNurse
              captures: { b1: $.data.id }
            - call: "POST /units/${u1}/beds/${b1}/mark-clean"
              payload: {}
              as: ChargeNurse
          trigger:
            - call: "POST /units/${u1}/beds/${b1}/retire"
              payload: {}
              as: FlowAdmin
              captures: { eid: $.data.error_id }
          assert:
            - "response error_id == ERR_INVALID_STATE"
            - "Bed.${b1}.status == CLEAN"

      - name: evstask_complete_marks_bed_clean
        claim_type: Side Effect Execution
        grounds: [state_machines.EvsTask.IN_PROGRESS_to_COMPLETED, state_machines.Bed.DIRTY_to_CLEAN, entities.Bed.fields.sex_cohort]
        distinguishing_aspect: "EvsTask complete (IN_PROGRESS→COMPLETED) flips its DIRTY bed to CLEAN; sex_cohort preserved (here NONE, bed never occupied)."
        test_recipe:
          setup: ["DIRTY bed B1 with EvsTask T1 IN_PROGRESS."]
          setup_api_calls:
            - call: "POST /units"
              payload: { name: "EWard", unit_type: "MEDSURG" }
              as: FlowAdmin
              captures: { u1: $.data.id }
            - call: "POST /units/${u1}/beds"
              payload: { unit_id: "${u1}", label: "EE1" }
              as: ChargeNurse
              captures: { b1: $.data.id }
            - call: "POST /evs-tasks"
              payload: { bed_id: "${b1}", task_type: "ROUTINE" }
              as: ChargeNurse
              captures: { t1: $.data.id }
            - call: "POST /evs-tasks/${t1}/assign"
              payload: {}
              as: EvsTech
              as_user_id: tech-7
            - call: "POST /evs-tasks/${t1}/start"
              payload: {}
              as: EvsTech
              as_user_id: tech-7
          trigger:
            - call: "POST /evs-tasks/${t1}/complete"
              payload: {}
              as: EvsTech
              as_user_id: tech-7
          assert:
            - "EvsTask.${t1}.status == COMPLETED"
            - "Bed.${b1}.status == CLEAN"
            - "Bed.${b1}.sex_cohort == NONE"

      - name: block_dirty_bed_cancels_open_evstask
        claim_type: Side Effect Execution
        grounds: [state_machines.Bed.DIRTY_to_BLOCKED, state_machines.EvsTask.REQUESTED_to_CANCELLED]
        distinguishing_aspect: "Blocking a DIRTY bed cancels its open (REQUESTED) EvsTask as a system side-effect."
        test_recipe:
          setup: ["DIRTY bed B1 with a REQUESTED EvsTask T1."]
          setup_api_calls:
            - call: "POST /units"
              payload: { name: "BWard", unit_type: "MEDSURG" }
              as: FlowAdmin
              captures: { u1: $.data.id }
            - call: "POST /units/${u1}/beds"
              payload: { unit_id: "${u1}", label: "BB1" }
              as: ChargeNurse
              captures: { b1: $.data.id }
            - call: "POST /evs-tasks"
              payload: { bed_id: "${b1}", task_type: "ROUTINE" }
              as: ChargeNurse
              captures: { t1: $.data.id }
          trigger:
            - call: "POST /units/${u1}/beds/${b1}/block"
              payload: { blocked_reason: "INFECTION_CONTROL" }
              as: ChargeNurse
            - call: "GET /evs-tasks/${t1}"
              payload: {}
              as: ChargeNurse
          assert:
            - "Bed.${b1}.status == BLOCKED"
            - "EvsTask.${t1}.status == CANCELLED"

      - name: surge_stand_down_drops_declared_level
        claim_type: Side Effect Execution
        grounds: [state_machines.SurgeEvent.OPEN_to_STOOD_DOWN, entities.Unit.fields.declared_surge_level]
        distinguishing_aspect: "Standing down the only OPEN surge drops Unit.declared_surge_level back to GREEN."
        test_recipe:
          setup: ["Unit U1 with one OPEN YELLOW surge."]
          setup_api_calls:
            - call: "POST /units"
              payload: { name: "SWard", unit_type: "MEDSURG" }
              as: FlowAdmin
              captures: { u1: $.data.id }
            - call: "POST /surge-events"
              payload: { unit_id: "${u1}", level: "YELLOW" }
              as: BedControlCoordinator
              captures: { s1: $.data.id }
          trigger:
            - call: "POST /surge-events/${s1}/stand-down"
              payload: {}
              as: BedControlCoordinator
            - call: "GET /units/${u1}"
              payload: {}
              as: BedControlCoordinator
          assert:
            - "SurgeEvent.${s1}.status == STOOD_DOWN"
            - "Unit.${u1}.declared_surge_level == GREEN"

      - name: error_bed_not_dirty_on_evs_create
        claim_type: violation_to_error
        grounds: ["validations[priority=17]", "errors[ERR_BED_NOT_DIRTY]"]
        distinguishing_aspect: "POST /evs-tasks for a CLEAN bed → ERR_BED_NOT_DIRTY (409)."
        test_recipe:
          setup: ["CLEAN bed B1."]
          setup_api_calls:
            - call: "POST /units"
              payload: { name: "CWard", unit_type: "MEDSURG" }
              as: FlowAdmin
              captures: { u1: $.data.id }
            - call: "POST /units/${u1}/beds"
              payload: { unit_id: "${u1}", label: "CC9" }
              as: ChargeNurse
              captures: { b1: $.data.id }
            - call: "POST /units/${u1}/beds/${b1}/mark-clean"
              payload: {}
              as: ChargeNurse
          trigger:
            - call: "POST /evs-tasks"
              payload: { bed_id: "${b1}" }
              as: ChargeNurse
              captures: { eid: $.data.error_id }
          assert:
            - "response error_id == ERR_BED_NOT_DIRTY"

      - name: error_bed_occupied_on_block
        claim_type: violation_to_error
        grounds: ["validations[priority=19]", "errors[ERR_BED_OCCUPIED]", state_machines.Bed.CLEAN_to_OCCUPIED]
        distinguishing_aspect: "Block on an OCCUPIED bed → ERR_BED_OCCUPIED (409)."
        test_recipe:
          setup: ["Bed B1 OCCUPIED by E1."]
          setup_api_calls:
            - call: "POST /_clock/set"
              payload: { to_iso8601: "2026-06-05T08:00:00Z" }
              as: FlowAdmin
            - call: "POST /units"
              payload: { name: "OWard", unit_type: "MEDSURG" }
              as: FlowAdmin
              captures: { u1: $.data.id }
            - call: "POST /units/${u1}/beds"
              payload: { unit_id: "${u1}", label: "OO1" }
              as: ChargeNurse
              captures: { b1: $.data.id }
            - call: "POST /units/${u1}/beds/${b1}/mark-clean"
              payload: {}
              as: ChargeNurse
              captures: { b1_v: $.data.version }
            - call: "POST /encounters"
              payload: { mrn: "MS5", sex: "MALE", origin: "ED" }
              as: BedControlCoordinator
              captures: { e1: $.data.id }
            - call: "POST /encounters/${e1}/admit-order"
              payload: {}
              as: BedControlCoordinator
            - call: "POST /bed-requests"
              payload: { encounter_id: "${e1}", preferred_unit_id: "${u1}" }
              as: TransferCenterAgent
              captures: { r1: $.data.id }
            - call: "POST /bed-requests/${r1}/assign"
              payload: { bed_id: "${b1}" }
              as: BedControlCoordinator
            - call: "POST /bed-requests/${r1}/confirm"
              payload: { expected_bed_version: "${b1_v}" }
              as: BedControlCoordinator
          trigger:
            - call: "POST /units/${u1}/beds/${b1}/block"
              payload: { blocked_reason: "MAINTENANCE" }
              as: ChargeNurse
              captures: { eid: $.data.error_id }
          assert:
            - "response error_id == ERR_BED_OCCUPIED"
            - "Bed.${b1}.status == OCCUPIED"

      - name: error_same_bed_on_transfer
        claim_type: violation_to_error
        grounds: ["validations[priority=14]", "errors[ERR_SAME_BED]", state_machines.Encounter.PLACED_to_PLACED]
        distinguishing_aspect: "Transfer with target_bed_id equal to current bed → ERR_SAME_BED (409)."
        test_recipe:
          setup: ["Encounter E1 PLACED in B1."]
          setup_api_calls:
            - call: "POST /_clock/set"
              payload: { to_iso8601: "2026-06-05T08:00:00Z" }
              as: FlowAdmin
            - call: "POST /units"
              payload: { name: "SbWard", unit_type: "MEDSURG" }
              as: FlowAdmin
              captures: { u1: $.data.id }
            - call: "POST /units/${u1}/beds"
              payload: { unit_id: "${u1}", label: "SB1" }
              as: ChargeNurse
              captures: { b1: $.data.id }
            - call: "POST /units/${u1}/beds/${b1}/mark-clean"
              payload: {}
              as: ChargeNurse
              captures: { b1_v: $.data.version }
            - call: "POST /encounters"
              payload: { mrn: "MS6", sex: "MALE", origin: "DIRECT" }
              as: BedControlCoordinator
              captures: { e1: $.data.id }
            - call: "POST /encounters/${e1}/admit-order"
              payload: {}
              as: BedControlCoordinator
            - call: "POST /bed-requests"
              payload: { encounter_id: "${e1}" }
              as: BedControlCoordinator
              captures: { r1: $.data.id }
            - call: "POST /bed-requests/${r1}/assign"
              payload: { bed_id: "${b1}" }
              as: BedControlCoordinator
            - call: "POST /bed-requests/${r1}/confirm"
