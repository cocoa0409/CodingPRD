          ws_on_hand: $.data.on_hand_qty
      assert:
      - 'The approval alone re-quoted the order with the substitute: SubstitutionEndorsement.${se_id}.status
        == ${se_status} == "APPROVED" and data.unit_price_cents == ${po_price_after_approve} == 715000'
      - POST /api/v1/production-orders/${po_id}/release returns HTTP 200 with data.status == ${rl_status}
        == "RELEASED"
      - data.version == ${rl_version} == 4 (create 1 -> reserve 2 -> endorsement create 3 -> release 4),
        so the release's own increment landed
      - data.unit_price_cents == ${rl_price} == 715000 == ceil((4*100000 + 25000)/100)*100 + ceil((2*80000
        + 25000)/100)*100 + 2*45000 + min(15000, floor(700000*8/100)), i.e. the endorsed committed quote
      - 'The endorsement''s declared transition fired: GET /substitution-endorsements/${se_id} returns
        status == ${se_after} == "APPLIED"'
      - Component.${ws2_id}.on_hand_qty == ${ws2_on_hand} == 80, i.e. the substitute absorbed the 4 *
        5 == 20 committed units
      - Component.${ws_id}.on_hand_qty == ${ws_on_hand} == 100, i.e. the original's committed stock was
        replaced and fully restored
  - name: endpoint_action_changeover_starts_head_of_backlog_and_sets_window_width
    claim_type: Action endpoint
    grounds:
    - state_machines.ProductionOrder.RELEASED_to_IN_PRODUCTION
    - entities.ProductionOrder.fields.planned_shop_days
    - POST /api/v1/production-lines/{line}/changeover
    distinguishing_aspect: 'POST /production-lines/{line}/changeover fires RELEASED -> IN_PRODUCTION on
      the sole head-of-backlog order and its declared side effect lands: planned_shop_days is re-stamped
      to the changeover window''s width 10, which equals car_type.build_hours 2 * quantity 5.'
    test_recipe:
      setup:
