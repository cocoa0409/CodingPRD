    path: "/housing-assignments"
    description: "Lists housing bookings (reverse reachability for housing_unit_id and residency_id)."
    roles: [ProgramAdmin, FacilitiesManager]
    code: 200
    input: ["housing_unit_id?", "residency_id?", "status?", "meal_plan_selected?", "limit?", "offset?"]
