          - endpoints[POST /mep/eligibility-terms/sweep]
        distinguishing_aspect: "With the clock at 2029-09-01 both the expiry test and the lapse test are already true for the same term, but the sweep applies at most ONE step per call: the first call yields expired_count 1 / lapsed_count 0 and the second call yields expired_count 0 / lapsed_count 1, which is also when the student's DRAFT plan closes with REIDENTIFICATION_LAPSED."
        test_recipe:
          setup:
            - "logical clock at its 2026-08-01T00:00:00Z startup default for the certification chain"
            - "one OPEN AgriculturalArea, one ACTIVE Recruiter"
            - "one ENROLLED Student born 2010-03-20 certified from a VERIFIED 2026-06-15 move with residency_date 2026-07-01, giving term_end_on 2029-06-30 and reidentification_due_on 2029-08-14"
            - "one DRAFT SUMMER_PROGRAM ServicePlan for that student"
            - "the clock then moved to 2029-09-01T00:00:00Z, past both term_end_on and reidentification_due_on"
          setup_api_calls:
            - call: "POST /mep/areas"
              payload: { name: "Yakima Valley", state_code: "WA", primary_activity: "AGRICULTURE", peak_season_start_date: "2026-06-01", peak_season_end_date: "2026-09-30", recruiter_capacity: 3 }
