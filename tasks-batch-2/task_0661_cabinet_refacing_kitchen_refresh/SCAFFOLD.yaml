scenario: "661. Cabinet Refacing & Kitchen Refresh (Kitchen Tune-Up style): in-home measure & door/finish selection, scope (reface/redoor/paint) & quote, material order & lead time, install scheduling & crew, hardware/countertop add-on, change order, warranty, financing"
domain_name: "cabinet-refacing-kitchen-refresh"
api_prefix: "/"

complexity_profile:
  primary_archetype: workflow_orchestration
  secondary_archetype: pricing_engine
  complexity_layers:
    - dual_variant_calculation        # provisional ballpark estimate vs final firm quote
    - cascading_side_effects          # change order re-prices quote -> shifts material lead time -> may invalidate install window
    - optimistic_concurrency          # change orders / approvals against a Quote's version
    - scheduled_deferred_actions      # logical clock drives lead-time ready dates, install windows, warranty windows
    - resource_temporal_overlap       # crew day-capacity + install-window overlap

  entity_topology: flat
  # Peer entities (Customer, Project, Measure, Quote, MaterialOrder, InstallJob,
  # Crew, ChangeOrder, AddOn, WarrantyClaim, FinancingApplication) linked by FK
  # references in request bodies; URL paths are mostly flat collections with a
  # few sub-resources for reverse-reachability.

  state_machine_shape: cyclic
  # Quote QUOTED -> (change order) -> REVISING -> QUOTED loop; Project has a
  # branching lifecycle gated on child states. Non-linear on more than one entity.

  relationship_patterns:
    - one_to_many        # Project has many Quotes (versions), Measures, ChangeOrders
    - flat_references    # FK links in body, not nested URLs
    - cross_aggregate    # InstallJob references Crew (different aggregate) and Quote

  role_model: peer_roles
  # SalesRep owns measures/quotes; Scheduler owns orders/install/crew; Customer
  # owns approvals/financing on own project; InstallCrew reports install progress;
  # PlatformAdmin operates clock & warranty adjudication.

  consistency_model: immediate

response_envelope:
  success: |
    { "meta": { "api_request_id": "req_xxx", "api_request_timestamp": "ISO8601" },
      "response_type": "object" | "array", "data": {} }
  error: |
    { "meta": { ... }, "response_type": "error",
      "data": { "error_id": "ERR_XXX", "message": "..." } }
  pagination_fields: ["limit", "offset", "total_count", "has_more"]
  pagination_defaults: { limit: 10, min: 1, max: 100, offset: 0 }

# =====================================================================
# §1.1 Entity-Relationship Table
# =====================================================================
entities:
  - name: Customer
    parent: null
    common_fields: true
    fields:
      - name: email
        type: string
        source: input
        description: contact email; unique among customers
        constraints: "unique; non-empty"
      - name: full_name
        type: string
        source: input
        description: homeowner full name
      - name: state_code
        type: string
        source: input
        description: two-letter US state of the residence (affects financing eligibility)
        constraints: "two uppercase letters"
      - name: annual_income_cents
        type: integer
        source: input
        description: self-reported annual income in cents; used for financing DTI check
        constraints: ">= 0"

  - name: Project
    parent: null
    common_fields: true
    fields:
      - name: customer_id
        type: string
        source: input
        description: "FK -> Customer.id; the homeowner who owns this project"
      - name: address_line
        type: string
        source: input
        description: street address of the kitchen
      - name: status
        type: enum
        source: computed
        description: lifecycle posture of the project; auto-derived from child states and explicit transitions
        default: LEAD
        constraints: "one of LEAD, MEASURED, QUOTED, SOLD, IN_PRODUCTION, INSTALLED, CLOSED, CANCELLED"
      - name: active_quote_id
        type: string
        source: computed
        description: "denormalized pointer to Quote.id of the single non-superseded (is_active) quote currently representing the project's price; null until first quote. Discoverable via GET /projects/{id}/quotes filtered to is_active=true; not a structural child FK."
      - name: linear_feet
        type: number
        source: computed
        description: total linear feet of cabinetry captured by the accepted Measure; null until a measure is COMPLETED
      - name: door_count
        type: integer
        source: computed
        description: total cabinet door+drawer-front count from the accepted Measure; null until a measure is COMPLETED
        constraints: ">= 0"

  - name: Measure
    parent: null
    common_fields: true
    fields:
      - name: project_id
        type: string
        source: input
        description: "FK -> Project.id; the project being measured"
      - name: scheduled_for
        type: datetime
        source: input
        description: ISO 8601 UTC instant of the in-home measure appointment
      - name: status
        type: enum
        source: computed
        description: measure appointment lifecycle
        default: SCHEDULED
        constraints: "one of SCHEDULED, COMPLETED, CANCELLED"
      - name: linear_feet
        type: number
        source: input
        description: measured total linear feet of cabinetry (supplied when completing the measure)
        constraints: "> 0 when status COMPLETED"
      - name: door_count
        type: integer
        source: input
        description: measured number of doors plus drawer fronts (supplied when completing the measure)
        constraints: ">= 0 when status COMPLETED"
      - name: door_style
        type: string
        source: input
        description: selected door style code captured during the in-home visit
      - name: finish_code
        type: enum
        source: input
        description: selected finish/material family
        constraints: "one of LAMINATE, THERMOFOIL, WOOD_VENEER, SOLID_WOOD, PAINT"

  - name: Quote
    parent: null
    common_fields: true
    fields:
      - name: project_id
        type: string
        source: input
        description: "FK -> Project.id; the project this quote prices"
      - name: measure_id
        type: string
        source: input
        description: "FK -> Measure.id; the COMPLETED measure whose dimensions feed pricing"
      - name: scope
        type: enum
        source: input
        description: chosen work scope
        constraints: "one of PAINT, REFACE, REDOOR"
      - name: status
        type: enum
        source: computed
        description: quote lifecycle
        default: DRAFT
        constraints: "one of DRAFT, QUOTED, REVISING, APPROVED, SUPERSEDED, EXPIRED, DECLINED"
      - name: estimate_total_cents
        type: integer
        source: computed
        description: provisional ballpark estimate computed at DRAFT creation (variant A); see calc provisional_estimate
        constraints: ">= 0"
      - name: firm_total_cents
        type: integer
        source: computed
        description: firm itemized quote total computed at QUOTED issuance (variant B); see calc firm_quote_total
        constraints: ">= 0"
      - name: addons_total_cents
        type: integer
        source: computed
        description: sum of approved AddOn.price_cents linked to this quote
        default: 0
        constraints: ">= 0"
      - name: expires_at
        type: datetime
        source: computed
        description: instant after which a QUOTED quote auto-EXPIRES; set to issuance clock + QUOTE_VALID_DAYS
      - name: is_active
        type: boolean
        source: computed
        description: true iff this quote is the project's current non-superseded quote
        default: false

  - name: AddOn
    parent: null
    common_fields: true
    fields:
      - name: quote_id
        type: string
        source: input
        description: "FK -> Quote.id; the quote this add-on attaches to"
      - name: kind
        type: enum
        source: input
        description: add-on category
        constraints: "one of HARDWARE, COUNTERTOP"
      - name: unit_price_cents
        type: integer
        source: input
        description: per-unit price (per knob/pull for HARDWARE, per square foot for COUNTERTOP) in cents
        constraints: ">= 0"
      - name: quantity
        type: number
        source: input
        description: quantity (knob/pull count for HARDWARE, square feet for COUNTERTOP)
        constraints: "> 0"
      - name: status
        type: enum
        source: computed
        description: add-on lifecycle
        default: PROPOSED
        constraints: "one of PROPOSED, APPROVED, REMOVED"
      - name: price_cents
        type: integer
        source: computed
        description: extended price = round(unit_price_cents * quantity) per round_half_up
        constraints: ">= 0"

  - name: ChangeOrder
    parent: null
    common_fields: true
    fields:
      - name: quote_id
        type: string
        source: input
        description: "FK -> Quote.id; the APPROVED quote being amended"
      - name: delta_linear_feet
        type: number
        source: input
        description: signed change to billed linear feet (e.g. +2.0 adds two feet of cabinetry)
        default: 0
      - name: delta_door_count
        type: integer
        source: input
        description: signed change to billed door+drawer-front count
        default: 0
      - name: rush
        type: boolean
        source: input
        description: when true, customer pays a rush surcharge to compress added lead time
        default: false
      - name: status
        type: enum
        source: computed
        description: change-order lifecycle
        default: PENDING
        constraints: "one of PENDING, ACCEPTED, REJECTED"
      - name: price_delta_cents
        type: integer
        source: computed
        description: signed change to the project price produced when ACCEPTED; see calc change_order_delta
      - name: lead_time_delta_days
        type: integer
        source: computed
        description: signed change to material lead time produced when ACCEPTED; see calc change_order_delta
        constraints: ">= 0"

  - name: MaterialOrder
    parent: null
    common_fields: true
    fields:
      - name: project_id
        type: string
        source: input
        description: "FK -> Project.id; the project these materials are for"
      - name: quote_id
        type: string
        source: input
        description: "FK -> Quote.id; the APPROVED quote this order fulfills"
      - name: status
        type: enum
        source: computed
        description: material-order lifecycle
        default: PLACED
        constraints: "one of PLACED, READY, RECEIVED, CANCELLED"
      - name: base_lead_time_days
        type: integer
        source: computed
        description: lead time in days from the finish family + scope; see calc base_lead_time
        constraints: ">= 0"
      - name: ready_at
        type: datetime
        source: computed
        description: clock-at-placement + (base_lead_time_days + accumulated change-order lead deltas) days; the earliest install date
      - name: lead_extension_days
        type: integer
        source: computed
        description: accumulated lead_time_delta_days from ACCEPTED change orders applied after placement
        default: 0
        constraints: ">= 0"

  - name: Crew
    parent: null
    common_fields: true
    fields:
      - name: name
        type: string
        source: input
        description: crew display name
      - name: daily_job_capacity
        type: integer
        source: input
        description: max number of install jobs this crew can be booked for on a single calendar day
        constraints: ">= 1"
      - name: skill_finishes
        type: array
        source: input
        description: finish_code values this crew is certified to install
        constraints: "non-empty array of finish_code enum values"
      - name: is_active
        type: boolean
        source: input
        description: whether the crew is available for new bookings
        default: true

  - name: InstallJob
    parent: null
    common_fields: true
    fields:
      - name: project_id
        type: string
        source: input
        description: "FK -> Project.id; the project being installed"
      - name: material_order_id
        type: string
        source: input
        description: "FK -> MaterialOrder.id; the order whose ready_at gates scheduling"
      - name: crew_id
        type: string
        source: input
        description: "FK -> Crew.id; the assigned installation crew"
      - name: window_start
        type: datetime
        source: input
        description: ISO 8601 UTC start of the install window (inclusive)
      - name: window_end
        type: datetime
        source: input
        description: ISO 8601 UTC end of the install window (exclusive)
      - name: status
        type: enum
        source: computed
        description: install lifecycle
        default: SCHEDULED
        constraints: "one of SCHEDULED, IN_PROGRESS, DONE, CANCELLED"
      - name: install_day
        type: string
        source: computed
        description: the calendar date (YYYY-MM-DD, UTC) derived from window_start; used for crew day-capacity counting

  - name: WarrantyClaim
    parent: null
    common_fields: true
    fields:
      - name: project_id
        type: string
        source: input
        description: "FK -> Project.id; the INSTALLED project under warranty"
      - name: description
        type: string
        source: input
        description: customer-reported defect description
      - name: status
        type: enum
        source: computed
        description: claim lifecycle
        default: SUBMITTED
        constraints: "one of SUBMITTED, APPROVED, DENIED, RESOLVED"
      - name: covered
        type: boolean
        source: computed
        description: whether the claim falls inside the warranty window (install completion + WARRANTY_DAYS); set at submission
      - name: filed_at
        type: datetime
        source: computed
        description: logical-clock instant when the claim was submitted

  - name: FinancingApplication
    parent: null
    common_fields: true
    fields:
      - name: project_id
        type: string
        source: input
        description: "FK -> Project.id; the project being financed"
      - name: customer_id
        type: string
        source: input
        description: "FK -> Customer.id; the applicant (must own the project)"
      - name: amount_cents
        type: integer
        source: input
        description: requested financed amount in cents
        constraints: "> 0"
      - name: term_months
        type: integer
        source: input
        description: requested repayment term in months
        constraints: "one of 12, 24, 36, 48, 60"
      - name: status
        type: enum
        source: computed
        description: application lifecycle
        default: SUBMITTED
        constraints: "one of SUBMITTED, APPROVED, DECLINED"
      - name: monthly_payment_cents
        type: integer
        source: computed
        description: amortized monthly payment; see calc financing_monthly_payment
        constraints: ">= 0"
      - name: dti_ratio
        type: number
        source: computed
        description: (monthly_payment_cents * 12) / annual_income_cents, rounded to 4 decimals; gates approval
        constraints: ">= 0"

# =====================================================================
# §1.2 State Machine Table
# =====================================================================
state_machines:
  - entity: Measure
    initial_state: SCHEDULED
    terminal_states: [COMPLETED, CANCELLED]
    transitions:
      - from: SCHEDULED
        to: COMPLETED
        trigger: "POST /projects/{id}/measures/{id}/complete"
        actor: SalesRep
        preconditions:
          - "measure.status == SCHEDULED"
          - "linear_feet > 0 and door_count >= 0 supplied in body"
          - "parent Project.status in {LEAD, MEASURED}"
        side_effects:
          - "sets Measure.linear_feet, door_count, door_style, finish_code from body"
          - "copies linear_feet and door_count onto parent Project.linear_feet / Project.door_count"
          - "if Project.status == LEAD, Project transitions LEAD -> MEASURED (bubble up)"
          - "increments Project.version by 1"
      - from: SCHEDULED
        to: CANCELLED
        trigger: "POST /projects/{id}/measures/{id}/cancel"
        actor: SalesRep
        preconditions:
          - "measure.status == SCHEDULED"
        side_effects:
          - "no change to Project dimensions"

  - entity: Quote
    initial_state: DRAFT
    terminal_states: [SUPERSEDED, EXPIRED, DECLINED]
    transitions:
      - from: DRAFT
        to: QUOTED
        trigger: "POST /quotes/{id}/issue"
        actor: SalesRep
        preconditions:
          - "quote.status == DRAFT"
          - "linked Measure.status == COMPLETED"
          - "Project.status in {MEASURED, QUOTED}"
        side_effects:
          - "computes firm_total_cents via calc firm_quote_total"
          - "sets expires_at = clock_now + QUOTE_VALID_DAYS days"
          - "marks this quote is_active=true and any prior is_active quote on the project SUPERSEDED (is_active=false)"
          - "sets Project.active_quote_id = this quote.id"
          - "if Project.status == MEASURED, Project transitions MEASURED -> QUOTED (bubble up)"
          - "increments Quote.version by 1"
      - from: QUOTED
        to: APPROVED
        trigger: "POST /quotes/{id}/approve"
        actor: Customer
        preconditions:
          - "quote.status == QUOTED"
          - "quote.is_active == true"
          - "clock_now < quote.expires_at"
          - "acting Customer owns the parent Project"
          - "expected_quote_version matches quote.version (OCC)"
        side_effects:
          - "Project transitions QUOTED -> SOLD (bubble up)"
          - "freezes addons_total_cents at the sum of APPROVED AddOns on this quote"
          - "increments Quote.version by 1"
      - from: QUOTED
        to: REVISING
        trigger: "POST /quotes/{id}/reopen"
        actor: SalesRep
        preconditions:
          - "quote.status == QUOTED"
          - "quote.is_active == true"
        side_effects:
          - "increments Quote.version by 1"
        note: "revision loop entry; SalesRep edits scope/addons then re-issues"
      - from: REVISING
        to: QUOTED
        trigger: "POST /quotes/{id}/issue"
        actor: SalesRep
        preconditions:
          - "quote.status == REVISING"
          - "linked Measure.status == COMPLETED"
        side_effects:
          - "recomputes firm_total_cents via calc firm_quote_total (cyclic re-issue)"
          - "resets expires_at = clock_now + QUOTE_VALID_DAYS days"
          - "increments Quote.version by 1"
        note: "REVISING -> QUOTED closes the revision loop (cyclic shape)"
      - from: QUOTED
        to: DECLINED
        trigger: "POST /quotes/{id}/decline"
        actor: Customer
        preconditions:
          - "quote.status == QUOTED"
          - "acting Customer owns the parent Project"
        side_effects:
          - "marks is_active=false; Project.active_quote_id cleared if it pointed here"
      - from: QUOTED
        to: EXPIRED
        trigger: "system: clock advance past expires_at (evaluated lazily on next read or transition of this quote)"
        actor: system
        preconditions:
          - "quote.status == QUOTED"
          - "clock_now >= quote.expires_at"
        side_effects:
          - "marks is_active=false; Project.active_quote_id cleared if it pointed here"

  - entity: ChangeOrder
    initial_state: PENDING
    terminal_states: [ACCEPTED, REJECTED]
    transitions:
      - from: PENDING
        to: ACCEPTED
        trigger: "POST /change-orders/{id}/accept"
        actor: Customer
        preconditions:
          - "change_order.status == PENDING"
          - "linked Quote.status == APPROVED"
          - "Project.status in {SOLD, IN_PRODUCTION}"
          - "acting Customer owns the parent Project"
          - "expected_quote_version matches Quote.version (OCC)"
        side_effects:
          - "computes price_delta_cents and lead_time_delta_days via calc change_order_delta"
          - "adds price_delta_cents to the project price by recomputing Quote.firm_total_cents (cascade hop 1: ChangeOrder ACCEPTED -> Quote re-priced)"
          - "if a MaterialOrder for this quote exists and is in {PLACED, READY}, adds lead_time_delta_days to MaterialOrder.lead_extension_days and recomputes MaterialOrder.ready_at (cascade hop 2: Quote re-priced -> MaterialOrder lead extended)"
          - "if an InstallJob references that MaterialOrder, is SCHEDULED, and its window_start < the new MaterialOrder.ready_at, transitions InstallJob SCHEDULED -> CANCELLED and reverts Project IN_PRODUCTION -> SOLD (cascade hop 3: MaterialOrder lead extended -> InstallJob cancelled -> Project reverted)"
          - "increments Quote.version by 1"
      - from: PENDING
        to: REJECTED
        trigger: "POST /change-orders/{id}/reject"
        actor: Customer
        preconditions:
          - "change_order.status == PENDING"
          - "acting Customer owns the parent Project"
        side_effects:
          - "no price or lead-time change"

  - entity: MaterialOrder
    initial_state: PLACED
    terminal_states: [RECEIVED, CANCELLED]
    transitions:
      - from: PLACED
        to: READY
        trigger: "POST /material-orders/{id}/mark-ready"
        actor: Scheduler
        preconditions:
          - "material_order.status == PLACED"
          - "clock_now >= material_order.ready_at"
        side_effects:
          - "no project state change"
        note: "lead-time gate: cannot be READY before ready_at"
      - from: READY
        to: RECEIVED
        trigger: "POST /material-orders/{id}/receive"
        actor: Scheduler
        preconditions:
          - "material_order.status == READY"
        side_effects:
          - "no project state change"
      - from: PLACED
        to: CANCELLED
        trigger: "POST /material-orders/{id}/cancel"
        actor: Scheduler
        preconditions:
          - "material_order.status == PLACED"
          - "no InstallJob referencing this order is in {SCHEDULED, IN_PROGRESS, DONE}"
        side_effects:
          - "reverts Project IN_PRODUCTION -> SOLD if Project.status == IN_PRODUCTION"

  - entity: InstallJob
    initial_state: SCHEDULED
    terminal_states: [DONE, CANCELLED]
    transitions:
      - from: SCHEDULED
        to: IN_PROGRESS
        trigger: "POST /install-jobs/{id}/start"
        actor: InstallCrew
        preconditions:
          - "install_job.status == SCHEDULED"
          - "linked MaterialOrder.status in {READY, RECEIVED}"
          - "clock_now >= install_job.window_start"
        side_effects:
          - "no project state change"
      - from: IN_PROGRESS
        to: DONE
        trigger: "POST /install-jobs/{id}/complete"
        actor: InstallCrew
        preconditions:
          - "install_job.status == IN_PROGRESS"
        side_effects:
          - "transitions linked MaterialOrder READY -> RECEIVED if still READY"
          - "Project transitions IN_PRODUCTION -> INSTALLED (bubble up); records install completion clock instant for warranty window"
          - "increments Project.version by 1"
      - from: SCHEDULED
        to: CANCELLED
        trigger: "POST /install-jobs/{id}/cancel"
        actor: Scheduler
        preconditions:
          - "install_job.status == SCHEDULED"
        side_effects:
          - "reverts Project IN_PRODUCTION -> SOLD if Project.status == IN_PRODUCTION"

  - entity: Project
    initial_state: LEAD
    terminal_states: [CLOSED, CANCELLED]
    transitions:
      - from: SOLD
        to: IN_PRODUCTION
        trigger: "POST /projects/{id}/material-orders"
        actor: Scheduler
        preconditions:
          - "Project.status == SOLD"
          - "the referenced Quote.status == APPROVED and is_active == true"
        side_effects:
          - "creates the MaterialOrder (PLACED); computes base_lead_time_days and ready_at"
          - "Project transitions SOLD -> IN_PRODUCTION"
          - "increments Project.version by 1"
      - from: INSTALLED
        to: CLOSED
        trigger: "POST /projects/{id}/close"
        actor: Scheduler
        preconditions:
          - "Project.status == INSTALLED"
          - "no WarrantyClaim on the project is in {SUBMITTED, APPROVED}"
        side_effects:
          - "project is closed; no further quotes/orders accepted"
      - from: LEAD
        to: CANCELLED
        trigger: "POST /projects/{id}/cancel"
        actor: SalesRep
        preconditions:
          - "Project.status in {LEAD, MEASURED, QUOTED}"
        side_effects:
          - "cancels all SCHEDULED Measures on the project"
          - "marks any is_active Quote SUPERSEDED"
        note: "cancel only allowed pre-sale; SOLD+ projects must be unwound via order/install cancels"

# ---------------------------------------------------------------------
# §1.2.1 Concurrency Rules
# ---------------------------------------------------------------------
concurrency_rules:
  - rule_id: change-order-accept-stale-quote
    parent_entity: Quote
    write_endpoint: "POST /change-orders/{id}/accept"
    occ_field: "expected_quote_version"
    description: |
      Accepting a ChangeOrder against a Quote whose version has advanced since
      the client last observed it is rejected. The new firm price legitimately
      supersedes the prior under the re-pricing cascade; a second acceptance
      that still carries the pre-cascade version is operating on a stale view
      of the quote and is rejected on the version check.
    error_id: ERR_STALE_QUOTE_VERSION
    http_status: 412

  - rule_id: quote-approve-stale-quote
    parent_entity: Quote
    write_endpoint: "POST /quotes/{id}/approve"
    occ_field: "expected_quote_version"
    description: |
      Approving a Quote whose version has advanced since the client last read
      it is rejected. A reopen->re-issue cycle (each bumping version) changes the
      firm price; an approval carrying the stale version is rejected so the
      customer never approves a price they did not see.
    error_id: ERR_STALE_QUOTE_VERSION
    http_status: 412

# =====================================================================
# §1.3 Calculation Rules Table
# =====================================================================
calculations:
  - name: provisional_estimate
    trigger: "on POST /projects/{id}/quotes (Quote created in DRAFT) — variant A"
    algorithm: forward_looking
    formula: |
      # Ballpark estimate from the MEASURE dimensions using a single blended
      # per-linear-foot rate for the scope. Deliberately coarse: ignores
      # door_count and finish multiplier (those enter only the firm quote).
      rate = SCOPE_BALLPARK_RATE_CENTS[scope]            # PAINT/REFACE/REDOOR
      estimate_total_cents = round_half_up(rate * measure.linear_feet)
    input_set: "the single linked COMPLETED Measure; door_count and finish_code are NOT inputs to the estimate"
    constants:
      SCOPE_BALLPARK_RATE_CENTS: { PAINT: 12000, REFACE: 28000, REDOOR: 45000 }
    precision: "integer cents, round_half_up"
    variants:
      - name: estimate_variant
        when: "at DRAFT quote creation"
        difference: "blended per-foot rate only; excludes door_count term and finish multiplier that the firm quote applies"

  - name: firm_quote_total
    trigger: "on POST /quotes/{id}/issue (DRAFT->QUOTED and REVISING->QUOTED) — variant B"
    algorithm: tiered_pricing
    formula: |
      # Firm itemized quote. Evaluation order is PINNED:
      #   step 1: labor_base   = SCOPE_FOOT_RATE_CENTS[scope] * measure.linear_feet
      #   step 2: door_labor   = SCOPE_DOOR_RATE_CENTS[scope] * measure.door_count
      #   step 3: pre_finish    = labor_base + door_labor
      #   step 4: finish_mult   = FINISH_MULTIPLIER[measure.finish_code]   (1.00..1.40)
      #   step 5: materials     = round_half_up(pre_finish * (finish_mult - 1.0))
      #   step 6: subtotal      = pre_finish + materials
      #   step 7: volume_disc_pct = VOLUME_DISCOUNT by subtotal tier (see constants)
      #   step 8: discount      = round_half_up(subtotal * volume_disc_pct)
      #   step 9: firm_total_cents = subtotal - discount + quote.addons_total_cents
      # Rounding order is pinned: round materials (step5) and discount (step8)
      # to integer cents INDEPENDENTLY (round-per-component, then sum), NOT
      # round once at the end. addons_total_cents is the already-rounded sum of
      # per-AddOn round_half_up(unit_price_cents*quantity).
    input_set: "the single linked COMPLETED Measure (linear_feet, door_count, finish_code), the quote.scope, and APPROVED AddOns on this quote (sum = addons_total_cents)"
    constants:
      SCOPE_FOOT_RATE_CENTS: { PAINT: 9000, REFACE: 20000, REDOOR: 30000 }
      SCOPE_DOOR_RATE_CENTS: { PAINT: 1500, REFACE: 4000, REDOOR: 7000 }
      FINISH_MULTIPLIER: { PAINT: 1.00, LAMINATE: 1.10, THERMOFOIL: 1.15, WOOD_VENEER: 1.25, SOLID_WOOD: 1.40 }
      VOLUME_DISCOUNT: "0.00 if subtotal < 1500000; 0.05 if 1500000 <= subtotal < 3000000; 0.10 if subtotal >= 3000000"
    precision: "integer cents, round_half_up; materials and discount rounded independently (round-per-component then sum)"
    variants:
      - name: firm_variant
        when: "at QUOTED issuance / re-issuance"
        difference: "full itemization with door_count term, finish multiplier, tiered volume discount, and add-ons; diverges from the provisional estimate on identical Measure data"

  - name: change_order_delta
    trigger: "on POST /change-orders/{id}/accept (ChangeOrder PENDING->ACCEPTED)"
    algorithm: aggregation
    formula: |
      # Signed price delta and lead-time delta from the change order's deltas,
      # priced at the SAME scope rates as the firm quote (no re-discount: the
      # delta is applied on top of the already-discounted firm total).
      foot_delta_cents = SCOPE_FOOT_RATE_CENTS[quote.scope] * delta_linear_feet
      door_delta_cents = SCOPE_DOOR_RATE_CENTS[quote.scope] * delta_door_count
      raw_delta = foot_delta_cents + door_delta_cents
      finish_mult = FINISH_MULTIPLIER[measure.finish_code]
      price_delta_cents = round_half_up(raw_delta * finish_mult)
      # lead time: every positive linear-foot increment adds CO_LEAD_PER_FOOT_DAYS
      # (ceil per foot); door-only changes add CO_LEAD_DOOR_FLAT_DAYS if delta_door_count > 0.
      foot_lead = ceil(max(delta_linear_feet, 0)) * CO_LEAD_PER_FOOT_DAYS
      door_lead = CO_LEAD_DOOR_FLAT_DAYS if delta_door_count > 0 else 0
      base_lead = foot_lead + door_lead
      lead_time_delta_days = ceil(base_lead * RUSH_FACTOR) if rush else base_lead
      # RUSH_FACTOR < 1 compresses added lead time at a rush surcharge.
    input_set: "the single ChangeOrder, its linked Quote.scope and Quote's Measure.finish_code"
    constants:
      CO_LEAD_PER_FOOT_DAYS: 2
      CO_LEAD_DOOR_FLAT_DAYS: 3
      RUSH_FACTOR: 0.5
    precision: "integer cents and integer days, round_half_up for cents, ceil for days; lead delta floored at 0"
    variants:
      - name: rush_variant
        when: "change_order.rush == true"
        difference: "added lead-time days multiplied by RUSH_FACTOR then ceil'd, compressing schedule impact (price delta unchanged by rush)"

  - name: base_lead_time
    trigger: "on POST /projects/{id}/material-orders (MaterialOrder created PLACED)"
    algorithm: threshold
    formula: |
      # Lead time from finish family plus a scope surcharge plus a volume step.
      base = FINISH_LEAD_DAYS[measure.finish_code]
      scope_add = SCOPE_LEAD_ADD_DAYS[quote.scope]
      # volume step: large jobs ship in two batches -> +VOLUME_LEAD_STEP_DAYS
      volume_add = VOLUME_LEAD_STEP_DAYS if measure.linear_feet >= LARGE_JOB_FEET else 0
      base_lead_time_days = base + scope_add + volume_add
      ready_at = clock_at_placement + (base_lead_time_days + lead_extension_days) days
    input_set: "the linked Quote's Measure.finish_code, Quote.scope, Measure.linear_feet; lead_extension_days starts at 0 and accrues from ACCEPTED change orders"
    constants:
      FINISH_LEAD_DAYS: { PAINT: 7, LAMINATE: 14, THERMOFOIL: 21, WOOD_VENEER: 28, SOLID_WOOD: 42 }
      SCOPE_LEAD_ADD_DAYS: { PAINT: 0, REFACE: 5, REDOOR: 10 }
      VOLUME_LEAD_STEP_DAYS: 7
      LARGE_JOB_FEET: 30
    precision: "integer days; ready_at computed as datetime add of whole days (UTC)"

  - name: financing_monthly_payment
    trigger: "on POST /projects/{id}/financing-applications (FinancingApplication created SUBMITTED)"
    algorithm: tiered_pricing
    formula: |
      # Standard amortization with an APR chosen by a credit-tier proxy.
      # APR tier keyed on term_months (longer term -> higher APR).
      apr = APR_BY_TERM[term_months]            # annual, e.g. 0.0599
      r = apr / 12.0                            # monthly rate
      n = term_months
      if r == 0:
        monthly_payment_cents = round_half_up(amount_cents / n)
      else:
        factor = (r * (1 + r)**n) / ((1 + r)**n - 1)
        monthly_payment_cents = round_half_up(amount_cents * factor)
      dti_ratio = round((monthly_payment_cents * 12) / annual_income_cents, 4)
    input_set: "the single FinancingApplication (amount_cents, term_months) and the applicant Customer.annual_income_cents"
    constants:
      APR_BY_TERM: { 12: 0.0399, 24: 0.0599, 36: 0.0799, 48: 0.0999, 60: 0.1199 }
      DTI_MAX: 0.20
    precision: "integer cents, round_half_up; dti_ratio rounded to 4 decimals (round_half_up)"

# =====================================================================
# §1.4 Validation Rules Table (ordered by priority)
# =====================================================================
validations:
  - priority: 1
    category: auth
    check: "X-User-Role and X-User-ID headers present and X-User-Role is a known role"
    error_id: ERR_UNAUTHENTICATED
    http_status: 401
    applies_to: "all except POST /_clock/set_current_utc which still requires PlatformAdmin"

  - priority: 2
    category: auth
    check: "the role is permitted to perform this operation per §1.7"
    error_id: ERR_FORBIDDEN_ROLE
    http_status: 403
    applies_to: "all"

  - priority: 3
    category: existence
    check: "every path/body resource id resolves to an existing entity, validated left-to-right in the path"
    error_id: ERR_NOT_FOUND
    http_status: 404
    applies_to: "all endpoints referencing an id"

  - priority: 4
    category: auth
    check: "for Customer-scoped operations, the acting Customer (X-User-ID) owns the target Project (Project.customer_id == X-User-ID)"
    error_id: ERR_NOT_PROJECT_OWNER
    http_status: 403
    applies_to: "POST /quotes/{id}/approve, POST /quotes/{id}/decline, POST /change-orders/{id}/accept, POST /change-orders/{id}/reject, POST /projects/{id}/financing-applications"

  - priority: 5
    category: business_referential
    check: "a Quote's measure_id must reference a Measure whose project_id equals the Quote's project_id"
    error_id: ERR_MEASURE_PROJECT_MISMATCH
    http_status: 422
    applies_to: "POST /projects/{id}/quotes"

  - priority: 6
    category: state
    check: "the target entity is in a state from which the requested transition is defined in §1.2"
    error_id: ERR_INVALID_STATE
    http_status: 409
    applies_to: "all transition endpoints"

  - priority: 7
    category: state
    check: "a Quote may be issued only when its linked Measure.status == COMPLETED"
    error_id: ERR_MEASURE_NOT_COMPLETED
    http_status: 409
    applies_to: "POST /quotes/{id}/issue"

  - priority: 8
    category: state
    check: "a QUOTED quote past its expires_at is treated as EXPIRED and cannot be approved"
    error_id: ERR_QUOTE_EXPIRED
    http_status: 409
    applies_to: "POST /quotes/{id}/approve"

  - priority: 9
    category: business_referential
    check: "the Quote referenced when creating a MaterialOrder must be APPROVED and is_active on the same Project"
    error_id: ERR_QUOTE_NOT_APPROVED
    http_status: 409
    applies_to: "POST /projects/{id}/material-orders"

  - priority: 10
    category: business_constraint
    check: "a MaterialOrder may not be marked READY before clock_now >= ready_at (lead-time gate)"
    error_id: ERR_LEAD_TIME_NOT_ELAPSED
    http_status: 409
    applies_to: "POST /material-orders/{id}/mark-ready"

  - priority: 11
    category: business_safety
    check: "an InstallJob's assigned Crew must be is_active and certified for the Measure.finish_code (finish_code in Crew.skill_finishes)"
    error_id: ERR_CREW_NOT_CERTIFIED
    http_status: 422
    applies_to: "POST /projects/{id}/install-jobs"

  - priority: 12
    category: business_temporal
    check: "an InstallJob window_start must be >= the linked MaterialOrder.ready_at (cannot install before materials arrive)"
    error_id: ERR_WINDOW_BEFORE_READY
    http_status: 409
    applies_to: "POST /projects/{id}/install-jobs"

  - priority: 13
    category: business_temporal
    check: "an InstallJob's [window_start, window_end) must not overlap any non-CANCELLED InstallJob already booked for the SAME Crew (half-open interval overlap)"
    error_id: ERR_CREW_WINDOW_CONFLICT
    http_status: 409
    applies_to: "POST /projects/{id}/install-jobs"

  - priority: 14
    category: business_constraint
    check: "the number of non-CANCELLED InstallJobs for the assigned Crew sharing the same install_day must not exceed Crew.daily_job_capacity (>=, capacity reached blocks the next booking)"
    error_id: ERR_CREW_DAY_FULL
    http_status: 409
    applies_to: "POST /projects/{id}/install-jobs"

  - priority: 15
    category: business_temporal
    check: "window_end must be strictly greater than window_start"
    error_id: ERR_INVALID_WINDOW
    http_status: 422
    applies_to: "POST /projects/{id}/install-jobs"

  - priority: 16
    category: business_constraint
    check: "a WarrantyClaim may only be submitted for an INSTALLED (or CLOSED) project; coverage requires clock_now <= install_completed_at + WARRANTY_DAYS"
    error_id: ERR_OUT_OF_WARRANTY
    http_status: 409
    applies_to: "POST /projects/{id}/warranty-claims"

  - priority: 17
    category: business_fiscal
    check: "a FinancingApplication may be APPROVED only when dti_ratio <= DTI_MAX (0.20)"
    error_id: ERR_DTI_EXCEEDED
    http_status: 422
    applies_to: "POST /financing-applications/{id}/approve"

  - priority: 18
    category: business_constraint
    check: "request body field-level validation: required fields present, enums in range, numerics within stated constraints (e.g., quantity > 0, term_months in allowed set)"
    error_id: ERR_INVALID_REQUEST
    http_status: 422
    applies_to: "all POST/PATCH with a body"

  - priority: 19
    category: business_constraint
    check: "OCC: expected_quote_version must equal the current Quote.version on approve/change-order accept"
    error_id: ERR_STALE_QUOTE_VERSION
    http_status: 412
    applies_to: "POST /quotes/{id}/approve, POST /change-orders/{id}/accept"

# =====================================================================
# §1.5 API Endpoint Table
# =====================================================================
endpoints:
  # ---- Customer ----
  - method: POST
    path: "/customers"
    description: "register a homeowner"
    roles: [SalesRep, PlatformAdmin]
    code: 201
    input: [email, full_name, state_code, annual_income_cents]
    output: Customer
    side_effects: []
  - method: GET
    path: "/customers/{id}"
    description: "fetch a customer"
    roles: [SalesRep, PlatformAdmin, Customer]
    code: 200
    input: []
    output: Customer
    side_effects: []

  # ---- Project ----
  - method: POST
    path: "/projects"
    description: "create a kitchen-refresh project in LEAD"
    roles: [SalesRep, PlatformAdmin]
    code: 201
    input: [customer_id, address_line]
    output: Project
    side_effects: ["Project created in LEAD"]
  - method: GET
    path: "/projects/{id}"
    description: "fetch a project with computed posture and dimensions"
    roles: [SalesRep, Scheduler, PlatformAdmin, Customer]
    code: 200
    input: []
    output: Project
    side_effects: ["lazily EXPIREs the active quote if clock_now >= its expires_at"]
  - method: GET
    path: "/projects"
    description: "list projects (paginated), optionally filtered by customer"
    roles: [SalesRep, Scheduler, PlatformAdmin]
    code: 200
    input: ["customer_id?", "status?", "limit?", "offset?"]
    output: Project[]
    side_effects: []
  - method: POST
    path: "/projects/{id}/cancel"
    description: "cancel a pre-sale project"
    roles: [SalesRep, PlatformAdmin]
    code: 200
    input: []
    output: Project
    side_effects: ["Project -> CANCELLED; cancels SCHEDULED measures; supersedes active quote"]
  - method: POST
    path: "/projects/{id}/close"
    description: "close an INSTALLED project"
    roles: [Scheduler, PlatformAdmin]
    code: 200
    input: []
    output: Project
    side_effects: ["Project INSTALLED -> CLOSED"]

  # ---- Measure (sub-resource of Project) ----
  - method: POST
    path: "/projects/{id}/measures"
    description: "schedule an in-home measure appointment"
    roles: [SalesRep, PlatformAdmin]
    code: 201
    input: [scheduled_for]
    output: Measure
    side_effects: ["Measure created SCHEDULED"]
  - method: GET
    path: "/projects/{id}/measures"
    description: "list measures for a project (reverse-reachability for Measure.project_id)"
    roles: [SalesRep, Scheduler, PlatformAdmin, Customer]
    code: 200
    input: ["status?", "limit?", "offset?"]
    output: Measure[]
    side_effects: []
  - method: GET
    path: "/measures/{id}"
    description: "fetch a measure"
    roles: [SalesRep, Scheduler, PlatformAdmin, Customer]
    code: 200
    input: []
    output: Measure
    side_effects: []
  - method: POST
    path: "/projects/{id}/measures/{id}/complete"
    description: "complete the measure with captured dimensions, style and finish"
    roles: [SalesRep, PlatformAdmin]
    code: 200
    input: [linear_feet, door_count, door_style, finish_code]
    output: Measure
    side_effects: ["Measure -> COMPLETED; copies dims to Project; LEAD -> MEASURED; bumps Project.version"]
  - method: POST
    path: "/projects/{id}/measures/{id}/cancel"
    description: "cancel a scheduled measure"
    roles: [SalesRep, PlatformAdmin]
    code: 200
    input: []
    output: Measure
    side_effects: ["Measure -> CANCELLED"]

  # ---- Quote ----
  - method: POST
    path: "/projects/{id}/quotes"
    description: "create a DRAFT quote with a provisional estimate"
    roles: [SalesRep, PlatformAdmin]
    code: 201
    input: [measure_id, scope]
    output: Quote
    side_effects: ["Quote created DRAFT; computes estimate_total_cents (calc provisional_estimate)"]
  - method: GET
    path: "/projects/{id}/quotes"
    description: "list quotes for a project (reverse-reachability for Quote.project_id)"
    roles: [SalesRep, Scheduler, PlatformAdmin, Customer]
    code: 200
    input: ["status?", "is_active?", "limit?", "offset?"]
    output: Quote[]
    side_effects: ["lazily EXPIREs QUOTED quotes whose expires_at has passed"]
  - method: GET
    path: "/quotes"
    description: "list quotes, filterable by measure or project (reverse-reachability for Quote.measure_id)"
    roles: [SalesRep, Scheduler, PlatformAdmin]
    code: 200
    input: ["measure_id?", "project_id?", "status?", "is_active?", "limit?", "offset?"]
    output: Quote[]
    side_effects: ["lazily EXPIREs QUOTED quotes whose expires_at has passed"]
  - method: GET
    path: "/quotes/{id}"
    description: "fetch a quote with provisional and firm totals"
    roles: [SalesRep, Scheduler, PlatformAdmin, Customer]
    code: 200
    input: []
    output: Quote
    side_effects: ["lazily EXPIREs this quote if QUOTED and clock_now >= expires_at"]
  - method: POST
    path: "/quotes/{id}/issue"
    description: "issue or re-issue the firm quote (DRAFT->QUOTED or REVISING->QUOTED)"
    roles: [SalesRep, PlatformAdmin]
    code: 200
    input: []
    output: Quote
    side_effects: ["computes firm_total_cents; sets expires_at; supersedes prior active quote; MEASURED->QUOTED; bumps Quote.version"]
  - method: POST
    path: "/quotes/{id}/reopen"
    description: "reopen a QUOTED quote for revision (QUOTED->REVISING)"
    roles: [SalesRep, PlatformAdmin]
    code: 200
    input: []
    output: Quote
    side_effects: ["Quote QUOTED -> REVISING; bumps Quote.version"]
  - method: POST
    path: "/quotes/{id}/approve"
    description: "customer approves the active QUOTED quote (QUOTED->APPROVED)"
    roles: [Customer]
    code: 200
    input: [expected_quote_version]
    output: Quote
    side_effects: ["Quote -> APPROVED; freezes addons_total_cents; QUOTED->SOLD; increments Quote.version by 1"]
  - method: POST
    path: "/quotes/{id}/decline"
    description: "customer declines the active QUOTED quote (QUOTED->DECLINED)"
    roles: [Customer]
    code: 200
    input: []
    output: Quote
    side_effects: ["Quote -> DECLINED; clears active_quote_id"]

  # ---- AddOn (hardware / countertop) ----
  - method: POST
    path: "/quotes/{id}/addons"
    description: "propose a hardware or countertop add-on on a quote"
    roles: [SalesRep, PlatformAdmin]
    code: 201
    input: [kind, unit_price_cents, quantity]
    output: AddOn
    side_effects: ["AddOn created PROPOSED; computes price_cents = round_half_up(unit_price_cents*quantity)"]
  - method: GET
    path: "/quotes/{id}/addons"
    description: "list add-ons for a quote (reverse-reachability for AddOn.quote_id)"
    roles: [SalesRep, Scheduler, PlatformAdmin, Customer]
    code: 200
    input: ["status?", "limit?", "offset?"]
    output: AddOn[]
    side_effects: []
  - method: POST
    path: "/addons/{id}/approve"
    description: "approve a proposed add-on so it enters the firm quote total"
    roles: [SalesRep, PlatformAdmin]
    code: 200
    input: []
    output: AddOn
    side_effects: ["AddOn PROPOSED -> APPROVED; recomputed into Quote.addons_total_cents on next issue"]
  - method: POST
    path: "/addons/{id}/remove"
    description: "remove an add-on"
    roles: [SalesRep, PlatformAdmin]
    code: 200
    input: []
    output: AddOn
    side_effects: ["AddOn -> REMOVED"]

  # ---- ChangeOrder ----
  - method: POST
    path: "/quotes/{id}/change-orders"
    description: "raise a change order against an APPROVED quote"
    roles: [SalesRep, PlatformAdmin]
    code: 201
    input: [delta_linear_feet, delta_door_count, rush]
    output: ChangeOrder
    side_effects: ["ChangeOrder created PENDING"]
  - method: GET
    path: "/quotes/{id}/change-orders"
    description: "list change orders for a quote (reverse-reachability for ChangeOrder.quote_id)"
    roles: [SalesRep, Scheduler, PlatformAdmin, Customer]
    code: 200
    input: ["status?", "limit?", "offset?"]
    output: ChangeOrder[]
    side_effects: []
  - method: GET
    path: "/change-orders/{id}"
    description: "fetch a change order"
    roles: [SalesRep, Scheduler, PlatformAdmin, Customer]
    code: 200
    input: []
    output: ChangeOrder
    side_effects: []
  - method: POST
    path: "/change-orders/{id}/accept"
    description: "customer accepts a change order (cascade re-price + lead extension + maybe install cancel)"
    roles: [Customer]
    code: 200
    input: [expected_quote_version]
    output: ChangeOrder
    side_effects: ["ChangeOrder -> ACCEPTED; calc change_order_delta; re-prices Quote; extends MaterialOrder lead; may cancel InstallJob & revert Project; increments Quote.version by 1"]
  - method: POST
    path: "/change-orders/{id}/reject"
    description: "customer rejects a change order"
    roles: [Customer]
    code: 200
    input: []
    output: ChangeOrder
    side_effects: ["ChangeOrder -> REJECTED"]

  # ---- MaterialOrder ----
  - method: POST
    path: "/projects/{id}/material-orders"
    description: "place a material order against an APPROVED quote (SOLD->IN_PRODUCTION)"
    roles: [Scheduler, PlatformAdmin]
    code: 201
    input: [quote_id]
    output: MaterialOrder
    side_effects: ["MaterialOrder PLACED; calc base_lead_time; Project SOLD->IN_PRODUCTION; bumps Project.version"]
  - method: GET
    path: "/projects/{id}/material-orders"
    description: "list material orders for a project (reverse-reachability for MaterialOrder.project_id)"
    roles: [SalesRep, Scheduler, PlatformAdmin, Customer]
    code: 200
    input: ["status?", "limit?", "offset?"]
    output: MaterialOrder[]
    side_effects: []
  - method: GET
    path: "/material-orders/{id}"
    description: "fetch a material order with computed ready_at"
    roles: [SalesRep, Scheduler, PlatformAdmin, Customer]
    code: 200
    input: []
    output: MaterialOrder
    side_effects: []
  - method: GET
    path: "/material-orders"
    description: "list material orders, filterable by quote (reverse-reachability for MaterialOrder.quote_id)"
    roles: [SalesRep, Scheduler, PlatformAdmin]
    code: 200
    input: ["quote_id?", "status?", "limit?", "offset?"]
    output: MaterialOrder[]
    side_effects: []
  - method: POST
    path: "/material-orders/{id}/mark-ready"
    description: "mark materials ready once lead time elapsed (PLACED->READY)"
    roles: [Scheduler, PlatformAdmin]
    code: 200
    input: []
    output: MaterialOrder
    side_effects: ["MaterialOrder PLACED -> READY"]
  - method: POST
    path: "/material-orders/{id}/receive"
    description: "mark materials received (READY->RECEIVED)"
    roles: [Scheduler, PlatformAdmin]
    code: 200
    input: []
    output: MaterialOrder
    side_effects: ["MaterialOrder READY -> RECEIVED"]
  - method: POST
    path: "/material-orders/{id}/cancel"
    description: "cancel a PLACED material order"
    roles: [Scheduler, PlatformAdmin]
    code: 200
    input: []
    output: MaterialOrder
    side_effects: ["MaterialOrder PLACED -> CANCELLED; reverts Project IN_PRODUCTION -> SOLD"]

  # ---- Crew ----
  - method: POST
    path: "/crews"
    description: "register an install crew"
    roles: [Scheduler, PlatformAdmin]
    code: 201
    input: ["name", "daily_job_capacity", "skill_finishes", "is_active?"]
    output: Crew
    side_effects: ["Crew created"]
  - method: GET
    path: "/crews/{id}"
    description: "fetch a crew"
    roles: [Scheduler, PlatformAdmin]
    code: 200
    input: []
    output: Crew
    side_effects: []
  - method: GET
    path: "/crews"
    description: "list crews"
    roles: [Scheduler, PlatformAdmin]
    code: 200
    input: ["is_active?", "limit?", "offset?"]
    output: Crew[]
    side_effects: []

  # ---- InstallJob ----
  - method: POST
    path: "/projects/{id}/install-jobs"
    description: "schedule an install window with a crew (validates ready_at, crew cert, overlap, day-capacity)"
    roles: [Scheduler, PlatformAdmin]
    code: 201
    input: [material_order_id, crew_id, window_start, window_end]
    output: InstallJob
    side_effects: ["InstallJob created SCHEDULED; computes install_day"]
  - method: GET
    path: "/projects/{id}/install-jobs"
    description: "list install jobs for a project (reverse-reachability for InstallJob.project_id)"
    roles: [SalesRep, Scheduler, PlatformAdmin, Customer]
    code: 200
    input: ["status?", "limit?", "offset?"]
    output: InstallJob[]
    side_effects: []
  - method: GET
    path: "/install-jobs/{id}"
    description: "fetch an install job"
    roles: [SalesRep, Scheduler, PlatformAdmin, Customer, InstallCrew]
    code: 200
    input: []
    output: InstallJob
    side_effects: []
  - method: GET
    path: "/install-jobs"
    description: "list install jobs, filterable by crew or material order (reverse-reachability for InstallJob.crew_id and InstallJob.material_order_id)"
    roles: [Scheduler, PlatformAdmin, InstallCrew]
    code: 200
    input: ["crew_id?", "material_order_id?", "status?", "limit?", "offset?"]
    output: InstallJob[]
    side_effects: []
  - method: POST
    path: "/install-jobs/{id}/start"
    description: "crew starts the install (SCHEDULED->IN_PROGRESS)"
    roles: [InstallCrew, PlatformAdmin]
    code: 200
    input: []
    output: InstallJob
    side_effects: ["InstallJob SCHEDULED -> IN_PROGRESS"]
  - method: POST
    path: "/install-jobs/{id}/complete"
    description: "crew completes the install (IN_PROGRESS->DONE)"
    roles: [InstallCrew, PlatformAdmin]
    code: 200
    input: []
    output: InstallJob
    side_effects: ["InstallJob -> DONE; MaterialOrder READY->RECEIVED; Project IN_PRODUCTION->INSTALLED; records install_completed_at; bumps Project.version"]
  - method: POST
    path: "/install-jobs/{id}/cancel"
    description: "scheduler cancels a scheduled install (SCHEDULED->CANCELLED)"
    roles: [Scheduler, PlatformAdmin]
    code: 200
    input: []
    output: InstallJob
    side_effects: ["InstallJob -> CANCELLED; reverts Project IN_PRODUCTION -> SOLD"]

  # ---- WarrantyClaim ----
  - method: POST
    path: "/projects/{id}/warranty-claims"
    description: "submit a warranty claim on an installed project"
    roles: [Customer, SalesRep, PlatformAdmin]
    code: 201
    input: [description]
    output: WarrantyClaim
    side_effects: ["WarrantyClaim SUBMITTED; sets covered from warranty window; sets filed_at = clock_now"]
  - method: GET
    path: "/projects/{id}/warranty-claims"
    description: "list warranty claims for a project (reverse-reachability for WarrantyClaim.project_id)"
    roles: [Customer, SalesRep, Scheduler, PlatformAdmin]
    code: 200
    input: ["status?", "limit?", "offset?"]
    output: WarrantyClaim[]
    side_effects: []
  - method: GET
    path: "/warranty-claims/{id}"
    description: "fetch a warranty claim"
    roles: [Customer, SalesRep, Scheduler, PlatformAdmin]
    code: 200
    input: []
    output: WarrantyClaim
    side_effects: []
  - method: POST
    path: "/warranty-claims/{id}/adjudicate"
    description: "approve or deny a submitted warranty claim"
    roles: [PlatformAdmin]
    code: 200
    input: [decision]
    output: WarrantyClaim
    side_effects: ["WarrantyClaim SUBMITTED -> APPROVED (decision=APPROVE, requires covered==true) or DENIED (decision=DENY)"]
  - method: POST
    path: "/warranty-claims/{id}/resolve"
    description: "mark an approved warranty claim resolved"
    roles: [PlatformAdmin]
    code: 200
    input: []
    output: WarrantyClaim
    side_effects: ["WarrantyClaim APPROVED -> RESOLVED"]

  # ---- FinancingApplication ----
  - method: POST
    path: "/projects/{id}/financing-applications"
    description: "customer applies for financing on their project"
    roles: [Customer, SalesRep, PlatformAdmin]
    code: 201
    input: [customer_id, amount_cents, term_months]
    output: FinancingApplication
    side_effects: ["FinancingApplication SUBMITTED; calc financing_monthly_payment (monthly_payment_cents, dti_ratio)"]
  - method: GET
    path: "/projects/{id}/financing-applications"
    description: "list financing applications for a project (reverse-reachability for FinancingApplication.project_id)"
    roles: [Customer, SalesRep, PlatformAdmin]
    code: 200
    input: ["status?", "limit?", "offset?"]
    output: FinancingApplication[]
    side_effects: []
  - method: GET
    path: "/financing-applications/{id}"
    description: "fetch a financing application with monthly payment and DTI"
    roles: [Customer, SalesRep, PlatformAdmin]
    code: 200
    input: []
    output: FinancingApplication
    side_effects: []
  - method: GET
    path: "/financing-applications"
    description: "list financing applications, filterable by customer (reverse-reachability for FinancingApplication.customer_id)"
    roles: [SalesRep, PlatformAdmin]
    code: 200
    input: ["customer_id?", "status?", "limit?", "offset?"]
    output: FinancingApplication[]
    side_effects: []
  - method: POST
    path: "/financing-applications/{id}/approve"
    description: "approve a financing application (requires dti_ratio <= DTI_MAX)"
    roles: [PlatformAdmin]
    code: 200
    input: []
    output: FinancingApplication
    side_effects: ["FinancingApplication SUBMITTED -> APPROVED"]
  - method: POST
    path: "/financing-applications/{id}/decline"
    description: "decline a financing application"
    roles: [PlatformAdmin]
    code: 200
    input: []
    output: FinancingApplication
    side_effects: ["FinancingApplication SUBMITTED -> DECLINED"]

  # ---- Test-driving: logical clock ----
  - method: POST
    path: "/_clock/set_current_utc"
    description: "set the server logical clock (test-driving). Server startup default is 2026-04-01T00:00:00Z; before any set call the clock reads exactly this default and never falls back to wall-clock time."
    roles: [PlatformAdmin]
    code: 200
    input: [to_iso8601]
    output: null
    side_effects: ["advances or sets the logical clock used for ready_at, expires_at, warranty windows, and install window gates"]

# =====================================================================
# §1.6 Error Code Catalog
# =====================================================================
errors:
  - id: ERR_UNAUTHENTICATED
    http: 401
    condition: "missing/unknown X-User-Role or missing X-User-ID header"
  - id: ERR_FORBIDDEN_ROLE
    http: 403
    condition: "role not permitted for this operation per §1.7"
  - id: ERR_NOT_PROJECT_OWNER
    http: 403
    condition: "acting Customer does not own the target Project"
  - id: ERR_NOT_FOUND
    http: 404
    condition: "a referenced resource id does not resolve"
  - id: ERR_INVALID_REQUEST
    http: 422
    condition: "missing required field, enum out of range, or numeric constraint violated (e.g., quantity <= 0, bad term_months)"
  - id: ERR_INVALID_STATE
    http: 409
    condition: "requested transition not defined from the entity's current state"
  - id: ERR_MEASURE_PROJECT_MISMATCH
    http: 422
    condition: "Quote.measure_id references a Measure belonging to a different Project"
  - id: ERR_MEASURE_NOT_COMPLETED
    http: 409
    condition: "issuing a quote whose linked Measure is not COMPLETED"
  - id: ERR_QUOTE_EXPIRED
    http: 409
    condition: "approving a quote whose expires_at has passed (treated EXPIRED)"
  - id: ERR_QUOTE_NOT_APPROVED
    http: 409
    condition: "placing a material order against a quote that is not APPROVED/is_active"
  - id: ERR_STALE_QUOTE_VERSION
    http: 412
    condition: "expected_quote_version does not equal current Quote.version on approve or change-order accept"
  - id: ERR_LEAD_TIME_NOT_ELAPSED
    http: 409
    condition: "marking a material order READY before clock_now >= ready_at"
  - id: ERR_CREW_NOT_CERTIFIED
    http: 422
    condition: "assigned crew is inactive or not certified for the project's finish_code"
  - id: ERR_WINDOW_BEFORE_READY
    http: 409
    condition: "install window_start is before the material order ready_at"
  - id: ERR_CREW_WINDOW_CONFLICT
    http: 409
    condition: "install window overlaps an existing non-CANCELLED window for the same crew"
  - id: ERR_CREW_DAY_FULL
    http: 409
    condition: "crew daily_job_capacity reached for the install_day"
  - id: ERR_INVALID_WINDOW
    http: 422
    condition: "window_end not strictly greater than window_start"
  - id: ERR_OUT_OF_WARRANTY
    http: 409
    condition: "warranty claim submitted on a non-INSTALLED/non-CLOSED project, or warranty action invalid for claim state"
  - id: ERR_DTI_EXCEEDED
    http: 422
    condition: "financing approval attempted when dti_ratio > DTI_MAX"
  - id: ERR_WARRANTY_NOT_COVERED
    http: 409
    condition: "approving a warranty claim whose covered flag is false (outside warranty window)"

# =====================================================================
# §1.7 RBAC Matrix
# =====================================================================
roles:
  - name: Customer
    description: "homeowner; approves/declines quotes, accepts/rejects change orders, applies for financing, files warranty claims on own project"
    identity: "entity_backed:Customer"
    exclusive_operations:
      - "POST /quotes/{id}/approve"
      - "POST /quotes/{id}/decline"
      - "POST /change-orders/{id}/accept"
      - "POST /change-orders/{id}/reject"
    shared_operations:
      - "POST /projects/{id}/financing-applications (with SalesRep, PlatformAdmin)"
      - "POST /projects/{id}/warranty-claims (with SalesRep, PlatformAdmin)"
      - "GET reads on own project and its children"

  - name: SalesRep
    description: "field sales; creates customers/projects, schedules & completes measures, drafts/issues/reopens quotes, manages add-ons and change-order creation"
    identity: "opaque"
    exclusive_operations:
      - "POST /projects/{id}/measures/{id}/complete"
      - "POST /quotes/{id}/issue"
      - "POST /quotes/{id}/reopen"
      - "POST /quotes/{id}/addons"
      - "POST /addons/{id}/approve"
    shared_operations:
      - "POST /customers, POST /projects (with PlatformAdmin)"
      - "POST /projects/{id}/measures (with PlatformAdmin)"
      - "POST /quotes/{id}/change-orders (with PlatformAdmin)"
      - "GET reads"

  - name: Scheduler
    description: "operations; places/cancels material orders, manages crews, schedules/cancels install jobs, closes projects"
    identity: "opaque"
    exclusive_operations:
      - "POST /projects/{id}/material-orders"
      - "POST /material-orders/{id}/mark-ready"
      - "POST /material-orders/{id}/receive"
      - "POST /material-orders/{id}/cancel"
      - "POST /crews"
      - "POST /projects/{id}/install-jobs"
      - "POST /install-jobs/{id}/cancel"
      - "POST /projects/{id}/close"
    shared_operations:
      - "GET reads"

  - name: InstallCrew
    description: "field installers; start and complete install jobs"
    identity: "opaque"
    exclusive_operations:
      - "POST /install-jobs/{id}/start"
      - "POST /install-jobs/{id}/complete"
    shared_operations:
      - "GET /install-jobs, GET /install-jobs/{id}"

  - name: PlatformAdmin
    description: "operator superset; adjudicates warranty & financing, operates the logical clock, may perform any operation"
    identity: "opaque"
    exclusive_operations:
      - "POST /warranty-claims/{id}/adjudicate"
      - "POST /warranty-claims/{id}/resolve"
      - "POST /financing-applications/{id}/approve"
      - "POST /financing-applications/{id}/decline"
      - "POST /_clock/set_current_utc"
    shared_operations:
      - "all SalesRep, Scheduler, and Customer-creation operations (operator override); GET reads"
