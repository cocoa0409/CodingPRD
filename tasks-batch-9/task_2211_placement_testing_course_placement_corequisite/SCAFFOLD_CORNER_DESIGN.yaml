            - call: "GET /students/${sel}"
              payload: {}
              as: AssessmentStaff
              as_user_id: "staff-1"
              captures: { sel_v2: $.data.version }
            - call: "POST /placement-determinations"
              payload: { student_id: "${sel}", subject_area: "ENGLISH", expected_student_version: "${sel_v2}" }
              as: AssessmentStaff
              as_user_id: "staff-1"
              captures: { err_el_2: $.data.error_id }
            - call: "POST /placement-rules/${rg}/retire"
              payload: {}
              as: AssessmentDirector
              as_user_id: "director-1"
              captures: { rg_status: $.data.status }
            - call: "GET /students/${sel}"
              payload: {}
              as: AssessmentStaff
              as_user_id: "staff-1"
              captures: { sel_v3: $.data.version }
            - call: "POST /placement-determinations"
              payload: { student_id: "${sel}", subject_area: "ENGLISH", expected_student_version: "${sel_v3}" }
              as: AssessmentStaff
              as_user_id: "staff-1"
              captures: { det_el: $.data.id, det_el_rule: $.data.applied_rule_id, det_el_course: $.data.placed_course_id, det_el_measure: $.data.measure_type_used }
            - call: "GET /students/${sel}"
              payload: {}
              as: AssessmentStaff
              as_user_id: "staff-1"
              captures: { sel_v4: $.data.version }
            - call: "POST /placement-determinations"
              payload: { student_id: "${sel}", subject_area: "MATH", expected_student_version: "${sel_v4}" }
              as: AssessmentStaff
              as_user_id: "staff-1"
              captures: { det_el_m: $.data.id, det_el_m_rule: $.data.applied_rule_id, det_el_m_course: $.data.placed_course_id }
            - call: "POST /placement-appeals"
              payload: { determination_id: "${det_ne}", requested_course_id: "${c_e050}", grounds: "EL_PATHWAY", statement: "I want the multilingual writers pathway.", expected_determination_version: "${det_ne_v}" }
              as: Student
              as_user_id: "${sne}"
              captures: { err_el_appeal: $.data.error_id }
          assert:
            - "${rg_el} == null, ${re_status} == \"DRAFT\", ${sne_el} == \"NOT_EL\", ${sel_el} == \"EL_ACTIVE\" (setup)"
            - "${det_ne_rule} == \"${rg}\" and ${det_ne_course} == \"${c_e100}\" — a NOT_EL student is placed by the rule with required_el_status null, so a null requirement is open to everyone"
            - "${err_el_1} == \"ERR_EL_PATHWAY_VIOLATION\" with HTTP 422 — the ONLY candidate is RG, whose required_el_status is null, and an EL_ACTIVE student in ENGLISH demands EL_ACTIVE exactly"
            - "${re_active} == \"ACTIVE\" then ${err_el_2} == \"ERR_EL_PATHWAY_VIOLATION\" — the EL-appropriate rule is now a candidate, but RG still wins on level_rank 100 > 80 and the gate refuses the WINNER; the selector does NOT fall back to the runner-up"
            - "${rg_status} == \"RETIRED\" and ${det_el_rule} == \"${re}\" and ${det_el_course} == \"${c_e050}\" and ${det_el_measure} == \"TRANSCRIPT_GPA\" — only removing RG from the candidate set produces a placement"
            - "${det_el_m_rule} == \"${rm}\" and ${det_el_m_course} == \"${c_m050}\" — the same EL_ACTIVE student places in MATH through a rule with required_el_status null, because the gate is scoped to subject_area IN {ENGLISH, ESL}"
            - "${err_el_appeal} == \"ERR_EL_PATHWAY_VIOLATION\" with HTTP 422 — the second half of priority 13: grounds EL_PATHWAY requires el_status IN {EL_ACTIVE, EL_EXITED}, and SNE is NOT_EL"

      - name: booking_state_check_precedes_the_retake_waiting_period
        claim_type: Priority Ordering
        grounds: ["validations[priority=8]", "validations[priority=20]"]
        excluded_because:
          difficulty_instance: priority_pair_validation_conflict / booking_state_precedes_retake_waiting_period
          rationale: "The named §1.8 instance constructs the doubly-invalid booking and asserts the state error answers ahead of the temporal one."

      - name: prerequisite_check_precedes_the_placement_course_mismatch
        claim_type: Priority Ordering
        grounds: ["validations[priority=12]", "validations[priority=16]"]
        excluded_because:
          difficulty_instance: priority_pair_validation_conflict / prerequisite_safety_precedes_placement_referential_mismatch
          rationale: "The named §1.8 instance confirms a registration that violates both and asserts the business_safety error answers ahead of the business_referential one."

      - name: appeal_endorsement_state_precedes_the_reviewer_binding
        claim_type: Priority Ordering
        grounds: ["validations[priority=8]", "validations[priority=11]"]
        excluded_because:
          difficulty_instance: priority_pair_validation_conflict / appeal_endorsement_state_precedes_reviewer_binding
          rationale: "The named §1.8 instance decides an un-endorsed appeal as the wrong reviewer and asserts the state error answers ahead of the actor-binding one."

      - name: room_double_booking_is_refused_with_a_turnaround_buffer
        claim_type: Violation → Error
        grounds: ["validations[priority=17]", "errors[ERR_ROOM_TIME_CONFLICT]"]
        excluded_because:
          difficulty_instance: resource_temporal_overlap / exam_room_turnaround_buffer_of_exactly_thirty_minutes_is_allowed
          rationale: "The named §1.8 instance walks the buffered interval semantics at the exact boundary and one minute inside it."

      - name: paired_section_meeting_blocks_may_not_overlap
        claim_type: Violation → Error
        grounds: ["validations[priority=18]", "errors[ERR_COREQ_TIME_CONFLICT]"]
        excluded_because:
          difficulty_instance: resource_temporal_overlap / paired_section_meeting_blocks_may_be_exactly_adjacent
          rationale: "The named §1.8 instance pins the half-open zero-buffer semantics for the corequisite pair."

      - name: proctor_daily_minutes_are_capped
        claim_type: Violation → Error
        grounds: ["validations[priority=19]", "errors[ERR_PROCTOR_DAILY_CAP_EXCEEDED]"]
        excluded_because:
          difficulty_instance: resource_temporal_overlap / proctor_daily_minutes_clipped_at_each_utc_midnight
          rationale: "The named §1.8 instance asserts the per-UTC-day clipped aggregate at the inclusive cap."

      - name: full_section_falls_back_to_the_waitlist
        claim_type: Satisfaction → Pass
        grounds: ["validations[priority=30]", "errors[ERR_SECTION_FULL]"]
        excluded_because:
          difficulty_instance: transitive_cascade / attempt_void_five_hop_cascade_to_waitlist_promotion
          rationale: "The named §1.8 instance drives a confirm into WAITLISTED on a full section and then promotes it, covering both the fallback and its release."

  # ===========================================================================
  # 5. From Table 5 (Endpoints)
  # ===========================================================================
  - section: Endpoints
    instances:

      - name: equity_summary_uses_a_half_open_placement_window_and_a_grading_lookahead
        claim_type: Computed read
        grounds: ["endpoints[GET /courses/{course_id}/equity-summary]", calculations.equity_throughput_gap]
        distinguishing_aspect: |
          The report has TWO different time filters that must not be conflated: the
          placement window is half-open on determined_at, while throughput accepts any
          COMPLETED grade posted before window_end_at + 240 days. A determination
          minted exactly at window_end_at drops out of the report entirely, an A posted
          one day past the lookahead counts as NOT through, and a student holding two
          in-window determinations for the same course is counted ONCE. A single-group
          disaggregation yields throughput_gap null rather than 0.
        test_recipe:
          setup:
            - "Logical clock starts at 2026-08-01T00:00:00Z."
            - "Course MATH-050 (no requisites), one ACTIVE rule TRANSCRIPT_GPA -> MATH-050 (min_hs_gpa 2.0), Section secQ (room R781, capacity 5) OPEN."
            - "Five students placed into MATH-050 at determined_at 2026-08-01T00:00:00Z: SQ1 HISPANIC, SQ2 HISPANIC, SQ2B HISPANIC, SQ3 WHITE, SQ5 ASIAN — all with hs_gpa 2.50 VERIFIED, transcript 2025-06-01T00:00:00Z, el_status defaulting to NOT_EL."
            - "SQ1, SQ2, SQ3 and SQ5 are ENROLLED in secQ; SQ2B is placed but never registers."
            - "SQ1 is graded A and SQ3 is graded B at 2026-08-01T00:00:00Z; SQ2 is graded F; SQ5 is graded A only at 2027-04-01T00:00:00Z, which is past the lookahead cutoff 2027-03-30T00:00:00Z."
            - "SQ1 receives a SECOND determination for MATH into the same course, which supersedes the first; both rows sit inside the window."
            - "SQ4 MULTI is placed at determined_at 2026-08-02T00:00:00Z, exactly the window's exclusive upper bound."
          setup_api_calls:
            - call: "POST /courses"
              payload: { course_code: "MATH-050", title: "Pre-Algebra", subject_area: "MATH", level_rank: 50, units: 5.0, is_support_course: false, transfer_level: false }
