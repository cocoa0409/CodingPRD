# =============================================================================
# Allergy & Immunotherapy Clinic — seed tables (Expert band)
# =============================================================================

scenario: |
  624. Allergy & Immunotherapy Clinic: testing (skin/blood) & panel, diagnosis &
  immunotherapy plan, allergy-serum mixing & vial/lot tracking, build-up vs
  maintenance dosing schedule, in-office shot visits & wait-observation, refill &
  expiration, billing (antigen units/injection codes), reaction/epinephrine protocol

domain_name: allergy-immunotherapy
# Flat topology: each entity owns a top-level collection (/patients, /panels,
# /immunotherapy-plans, /serum-lots, /serum-vials, /shot-visits, /billing-entries).
# No single resource path is the parent of all others, so api_prefix is empty.
api_prefix: ""

# Complexity profile -----------------------------------------------------------
complexity_profile:
  primary_archetype: workflow_orchestration      # multi-step clinical pipeline: test -> diagnose -> mix -> dose -> observe
  secondary_archetype: compliance_audit           # pharmaceutical dispensing: lot tracking, expiry, epinephrine protocol
  complexity_layers:
    - dual_variant_calculation                    # screening vs clinical panel score; provisional vs final 95165 billing
    - cascading_side_effects                      # systemic reaction -> dose hold -> plan suspend -> billing reversal
    - scheduled_actions                            # logical clock drives expiry / observation windows / refill due
    - derived_field_reconciliation                # vial.remaining_volume_ml, plan.current_step, ledger balances

  entity_topology: flat
  # Patient is the URL root, but DiagnosticPanel, ImmunotherapyPlan, SerumVial,
  # ShotVisit, BillingEntry are peer entities linked by FK rather than deep URL nesting.

  state_machine_shape: branching
  # ShotVisit forks on observation outcome {RELEASED, REACTION_LOCAL, REACTION_SYSTEMIC}
  # with divergent side-effect sets; ImmunotherapyPlan has a build-up <-> hold revert cycle.

  relationship_patterns:
    - one_to_many        # Patient -> DiagnosticPanel, Patient -> ImmunotherapyPlan
    - cross_aggregate    # ShotVisit references SerumVial (different aggregate) and ImmunotherapyPlan

  role_model: peer_roles
  # Allergist owns diagnosis/plan authoring; Pharmacist owns mixing/lot/vial;
  # Nurse owns shot administration/observation; Biller owns billing; FrontDesk reads/schedules.

  consistency_model: immediate

# =============================================================================
# 1.0 Response Envelope (FIXED — verbatim)
# =============================================================================
response_envelope:
  success: |
    { "meta": { "api_request_id": "req_xxx", "api_request_timestamp": "ISO8601" },
      "response_type": "object" | "array", "data": {} }
  error: |
    { "meta": { ... }, "response_type": "error",
      "data": { "error_id": "ERR_XXX", "message": "..." } }
  pagination_fields: ["limit", "offset", "total_count", "has_more"]
  pagination_defaults: { limit: 10, min: 1, max: 100, offset: 0 }

# =============================================================================
# 1.1 Entity-Relationship Table
# =============================================================================
entities:
  - name: Patient
    parent: null
    common_fields: true   # id, created_at, updated_at, version
    fields:
      - { name: full_name, type: string, source: input, description: "Patient legal name" }
      - { name: date_of_birth, type: string, source: input, description: "ISO 8601 date (YYYY-MM-DD)" }
      - { name: epinephrine_on_file, type: boolean, source: input, default: false, description: "Whether patient has an epinephrine auto-injector documented; required true before any maintenance-concentration injection" }
      - { name: prior_systemic_reaction, type: boolean, source: computed, default: false, description: "True once any ShotVisit on this patient resolves to REACTION_SYSTEMIC; widens observation window to extended" }
      - { name: status, type: enum, source: system, default: ACTIVE, description: "ACTIVE | INACTIVE; INACTIVE patients reject new panels/plans/visits", constraints: "enum: ACTIVE, INACTIVE" }

  - name: DiagnosticPanel
    parent: null
    common_fields: true
    fields:
      - { name: patient_id, type: string, source: input, description: "FK -> Patient.id" }
      - { name: panel_name, type: string, source: input, description: "Free-text panel label (e.g. 'Northeast Tree+Grass')" }
      - { name: control_wheal_mm, type: number, source: input, default: 3, description: "Negative-control wheal diameter in mm used as the skin-test baseline; a skin test is positive when wheal_mm - control_wheal_mm >= 3" }
      - { name: screening_composite, type: number, source: computed, description: "Weighted-scoring SCREENING variant: mean sensitization index over ALL AllergenTest rows; 2 dp round_half_up" }
      - { name: clinical_composite, type: number, source: computed, description: "Weighted-scoring CLINICAL variant: mean sensitization index over AllergenTest rows with clinically_relevant=true; 2 dp round_half_up" }
      - { name: recommended_tier, type: enum, source: computed, description: "Severity tier from clinical_composite: <4 LOW, [4,7) MODERATE, >=7 HIGH", constraints: "enum: LOW, MODERATE, HIGH" }
      - { name: status, type: enum, source: system, default: OPEN, description: "OPEN (accepting tests) -> FINALIZED (immutable, composites locked) ; FINALIZED required before a plan may reference it", constraints: "enum: OPEN, FINALIZED" }

  - name: AllergenTest
    parent: null
    common_fields: true
    fields:
      - { name: panel_id, type: string, source: input, description: "FK -> DiagnosticPanel.id" }
      - { name: allergen_code, type: string, source: input, description: "Allergen identifier (e.g. 'D_FARINAE', 'TIMOTHY_GRASS')" }
      - { name: method, type: enum, source: input, description: "Test method", constraints: "enum: SKIN, BLOOD" }
      - { name: wheal_mm, type: number, source: input, required: false, description: "Skin wheal diameter in mm; required when method=SKIN, forbidden when method=BLOOD" }
      - { name: specific_ige_ku, type: number, source: input, required: false, description: "Specific IgE in kU/L; required when method=BLOOD, forbidden when method=SKIN" }
      - { name: clinically_relevant, type: boolean, source: input, default: false, description: "Allergist flag: include in the CLINICAL composite" }
      - { name: sensitization_index, type: number, source: computed, description: "SKIN: max(0, wheal_mm - panel.control_wheal_mm); BLOOD: CAP IgE class 0-6 from specific_ige_ku" }
      - { name: is_positive, type: boolean, source: computed, description: "SKIN: (wheal_mm - control_wheal_mm) >= 3; BLOOD: ige_class >= 1 (specific_ige_ku >= 0.35)" }

  - name: ImmunotherapyPlan
    parent: null
    common_fields: true
    fields:
      - { name: patient_id, type: string, source: input, description: "FK -> Patient.id" }
      - { name: panel_id, type: string, source: input, description: "FK -> DiagnosticPanel.id; the FINALIZED panel that justifies this plan" }
      - { name: starting_vial_color, type: enum, source: computed, description: "Derived from panel.recommended_tier: HIGH->GREEN, MODERATE->YELLOW, LOW->RED", constraints: "enum: GREEN, YELLOW, RED, SILVER" }
      - { name: current_vial_color, type: enum, source: computed, description: "Vial color of the next scheduled dose; advances through build-up ladder GREEN->YELLOW->RED->SILVER", constraints: "enum: GREEN, YELLOW, RED, SILVER" }
      - { name: current_step_index, type: integer, source: computed, default: 1, description: "1-based index into the active vial's build-up step list; resets to 1 on each vial advance" }
      - { name: phase, type: enum, source: computed, default: BUILD_UP, description: "BUILD_UP while climbing the ladder; MAINTENANCE once SILVER top dose reached", constraints: "enum: BUILD_UP, MAINTENANCE" }
      - { name: last_dose_volume_ml, type: number, source: computed, default: 0, description: "Volume of the most recently RELEASED or reaction-resolved administration; basis for reaction reduction" }
      - { name: status, type: enum, source: system, default: DRAFT, description: "DRAFT -> ACTIVE -> (HELD <-> ACTIVE) -> COMPLETED | DISCONTINUED", constraints: "enum: DRAFT, ACTIVE, HELD, COMPLETED, DISCONTINUED" }

  - name: SerumLot
    parent: null
    common_fields: true
    fields:
      - { name: vial_color, type: enum, source: input, description: "Dilution rung this lot's concentrate serves", constraints: "enum: GREEN, YELLOW, RED, SILVER" }
      - { name: lot_number, type: string, source: input, description: "Manufacturer lot number; unique among non-RECALLED lots" }
      - { name: concentrate_potency_pnu_per_ml, type: number, source: input, description: "Protein-nitrogen units per mL at the lot's labeled concentration" }
      - { name: received_at_iso, type: string, source: input, description: "ISO 8601 timestamp the lot was received" }
      - { name: status, type: enum, source: system, default: AVAILABLE, description: "AVAILABLE -> (RECALLED terminal); RECALLED lots cannot back new vials and recall cascades to vials/plans", constraints: "enum: AVAILABLE, RECALLED" }

  - name: SerumVial
    parent: null
    common_fields: true
    fields:
      - { name: plan_id, type: string, source: input, description: "FK -> ImmunotherapyPlan.id; the patient board this vial belongs to" }
      - { name: lot_id, type: string, source: input, description: "FK -> SerumLot.id; the concentrate lot this vial was mixed from" }
      - { name: vial_color, type: enum, source: computed, description: "Copied from the backing lot at mix time", constraints: "enum: GREEN, YELLOW, RED, SILVER" }
      - { name: dilution_factor, type: number, source: computed, description: "Concentration relative to SILVER maintenance concentrate: GREEN 0.001, YELLOW 0.01, RED 0.1, SILVER 1.0" }
      - { name: prepared_volume_ml, type: number, source: input, description: "Total mL drawn into the vial at mixing (positive)" }
      - { name: remaining_volume_ml, type: number, source: computed, description: "prepared_volume_ml minus the sum of administered volumes from RELEASED/reaction-resolved ShotVisits on this vial" }
      - { name: shelf_life_days, type: integer, source: computed, description: "By color: GREEN 30, YELLOW 90, RED 180, SILVER 365" }
      - { name: beyond_use_date_iso, type: string, source: computed, description: "mixed_at_iso + shelf_life_days; a vial is expired when clock >= beyond_use_date_iso (inclusive)" }
      - { name: mixed_at_iso, type: string, source: system, description: "Logical-clock timestamp at vial creation" }
      - { name: needs_refill, type: boolean, source: computed, default: false, description: "True when remaining_volume_ml < 1.0 mL (strict)" }
      - { name: status, type: enum, source: system, default: IN_USE, description: "IN_USE -> EXHAUSTED (auto when remaining < 1.0 and dose attempted) | EXPIRED (auto on clock advance past BUD) | DISCARDED (lot recall)", constraints: "enum: IN_USE, EXHAUSTED, EXPIRED, DISCARDED" }

  - name: ShotVisit
    parent: null
    common_fields: true
    fields:
      - { name: plan_id, type: string, source: input, description: "FK -> ImmunotherapyPlan.id" }
      - { name: vial_id, type: string, source: input, description: "FK -> SerumVial.id; the vial drawn from for this injection" }
      - { name: scheduled_dose_volume_ml, type: number, source: computed, description: "Volume the build-up/maintenance schedule prescribes for this visit before any reaction reduction" }
      - { name: administered_volume_ml, type: number, source: computed, description: "Volume actually injected; equals scheduled minus reaction reduction applied at administration" }
      - { name: antigen_units_delivered, type: number, source: computed, description: "administered_volume_ml * vial.dilution_factor * lot.concentrate_potency_pnu_per_ml; 2 dp round_half_up" }
      - { name: injection_count, type: integer, source: input, default: 1, description: "Number of distinct allergen boards injected at this visit; drives CPT 95115 (1) vs 95117 (>=2)" }
      - { name: administered_at_iso, type: string, source: system, description: "Logical-clock timestamp at administration" }
      - { name: observation_window_min, type: integer, source: computed, description: "30 standard; 45 extended when patient.prior_systemic_reaction or this dose escalated the ladder" }
      - { name: released_at_iso, type: string, source: input, required: false, description: "Logical-clock timestamp the nurse releases the patient; must be >= administered_at_iso + observation_window_min" }
      - { name: reaction_grade, type: enum, source: input, required: false, description: "Observation outcome recorded at release/reaction", constraints: "enum: NONE, LOCAL, SYSTEMIC" }
      - { name: epinephrine_administered, type: boolean, source: input, default: false, description: "True if epinephrine was given; required true when reaction_grade=SYSTEMIC" }
      - { name: status, type: enum, source: system, default: ADMINISTERED, description: "Created directly in ADMINISTERED by the shot-visit POST, then -> (RELEASED | REACTION_LOCAL | REACTION_SYSTEMIC) terminal", constraints: "enum: ADMINISTERED, RELEASED, REACTION_LOCAL, REACTION_SYSTEMIC" }

  - name: BillingEntry
    parent: null
    common_fields: true
    fields:
      - { name: visit_id, type: string, source: system, required: false, description: "FK -> ShotVisit.id; set on injection-code entries (CPT_95115/95117), null on 95165 prep entries" }
      - { name: vial_id, type: string, source: system, required: false, description: "FK -> SerumVial.id; set on antigen-prep entries (CPT_95165), null on injection-code entries" }
      - { name: patient_id, type: string, source: system, description: "FK -> Patient.id; denormalized owner of the charge for billing-summary rollup" }
      - { name: cpt_code, type: enum, source: computed, description: "95115 (single injection), 95117 (2+ injections), 95165 (antigen prep/doses)", constraints: "enum: CPT_95115, CPT_95117, CPT_95165" }
      - { name: billed_dose_units, type: integer, source: computed, description: "For 95165: provisional = ceil(prepared_volume_ml) capped at 10; final = doses actually drawn capped at 10. For injection codes: 1" }
      - { name: charge_cents, type: integer, source: computed, description: "billed_dose_units * unit price; injection codes are flat" }
      - { name: variant, type: enum, source: computed, description: "PROVISIONAL (billed at mix) vs FINAL (reconciled at vial exhaustion/discard)", constraints: "enum: PROVISIONAL, FINAL" }
      - { name: status, type: enum, source: system, default: POSTED, description: "POSTED -> REVERSED (systemic reaction voids the visit's injection charge) | RECONCILED (provisional->final delta applied)", constraints: "enum: POSTED, REVERSED, RECONCILED" }

# =============================================================================
# 1.2 State Machine Table
# =============================================================================
state_machines:
  - entity: DiagnosticPanel
    initial_state: OPEN
    terminal_states: [FINALIZED]
    transitions:
      - from: OPEN
        to: OPEN
        trigger: "POST /patients/{patientId}/panels/{panelId}/tests"
        actor: Allergist
        preconditions:
          - "Panel exists and is OPEN (ERR_PANEL_NOT_OPEN)"
          - "method/value coherence: SKIN requires wheal_mm and forbids specific_ige_ku; BLOOD requires specific_ige_ku and forbids wheal_mm (ERR_TEST_METHOD_MISMATCH)"
        side_effects:
          - "AllergenTest.sensitization_index and is_positive computed per §1.3 panel_sensitization_score inputs"
          - "DiagnosticPanel.screening_composite and clinical_composite recomputed (derived-field reconciliation)"
          - "DiagnosticPanel.recommended_tier recomputed from clinical_composite"
      - from: OPEN
        to: FINALIZED
        trigger: "POST /patients/{patientId}/panels/{panelId}/finalize"
        actor: Allergist
        preconditions:
          - "Panel is OPEN (ERR_PANEL_NOT_OPEN)"
          - "Panel has at least one AllergenTest (ERR_PANEL_EMPTY)"
          - "Panel has at least one test with is_positive=true (ERR_NO_POSITIVE_TEST)"
        side_effects:
          - "screening_composite, clinical_composite, recommended_tier frozen; no further tests accepted"

  - entity: ImmunotherapyPlan
    initial_state: DRAFT
    terminal_states: [COMPLETED, DISCONTINUED]
    transitions:
      - from: DRAFT
        to: ACTIVE
        trigger: "POST /immunotherapy-plans/{planId}/activate"
        actor: Allergist
        preconditions:
          - "Plan is DRAFT (ERR_PLAN_NOT_DRAFT)"
          - "Referenced panel is FINALIZED (ERR_PANEL_NOT_FINALIZED)"
          - "Patient is ACTIVE (ERR_PATIENT_INACTIVE)"
          - "At least one IN_USE SerumVial whose vial_color == plan.starting_vial_color exists for this plan (ERR_NO_STARTING_VIAL)"
        side_effects:
          - "current_vial_color set to starting_vial_color; current_step_index set to 1; phase set to BUILD_UP"
      - from: ACTIVE
        to: HELD
        trigger: "system: ShotVisit resolves to REACTION_SYSTEMIC (cross-entity cascade)"
        actor: system
        preconditions:
          - "Plan is ACTIVE"
        side_effects:
          - "Plan frozen: no new ShotVisit may be administered while HELD (ERR_PLAN_HELD on attempt)"
          - "last_dose_volume_ml retained for the reduced re-entry dose"
      - from: HELD
        to: ACTIVE
        trigger: "POST /immunotherapy-plans/{planId}/resume"
        actor: Allergist
        preconditions:
          - "Plan is HELD (ERR_PLAN_NOT_HELD)"
          - "Patient.epinephrine_on_file is true (ERR_EPINEPHRINE_NOT_ON_FILE)"
        side_effects:
          - "current_step_index steps back by one rung per §1.3 reaction_reduction (build-up reduction variant); if already at vial step 1 the vial color steps down one rung (SILVER->RED->YELLOW->GREEN, floored at GREEN)"
      - from: ACTIVE
        to: COMPLETED
        trigger: "POST /immunotherapy-plans/{planId}/complete"
        actor: Allergist
        preconditions:
          - "Plan is ACTIVE (ERR_PLAN_NOT_ACTIVE)"
          - "phase == MAINTENANCE (ERR_NOT_AT_MAINTENANCE)"
          - "No ShotVisit on this plan in ADMINISTERED status (ERR_OPEN_VISIT_EXISTS)"
        side_effects: []
      - from: ACTIVE
        to: DISCONTINUED
        trigger: "POST /immunotherapy-plans/{planId}/discontinue"
        actor: Allergist
        preconditions:
          - "Plan is ACTIVE or HELD (ERR_PLAN_NOT_DISCONTINUABLE)"
        side_effects:
          - "All IN_USE SerumVials on this plan -> DISCARDED (cascade); each discard reconciles its provisional 95165 BillingEntry to FINAL (cascade depth >= 3)"
      - from: HELD
        to: DISCONTINUED
        trigger: "POST /immunotherapy-plans/{planId}/discontinue"
        actor: Allergist
        preconditions:
          - "Plan is ACTIVE or HELD (ERR_PLAN_NOT_DISCONTINUABLE)"
        side_effects:
          - "All IN_USE SerumVials on this plan -> DISCARDED (cascade); each discard reconciles its provisional 95165 BillingEntry to FINAL"

  - entity: SerumLot
    initial_state: AVAILABLE
    terminal_states: [RECALLED]
    transitions:
      - from: AVAILABLE
        to: RECALLED
        trigger: "POST /serum-lots/{lotId}/recall"
        actor: Pharmacist
        preconditions:
          - "Lot is AVAILABLE (ERR_LOT_NOT_AVAILABLE)"
        side_effects:
          - "Every IN_USE SerumVial backed by this lot -> DISCARDED (cascade hop 1)"
          - "Each discarded vial's PROVISIONAL 95165 BillingEntry -> RECONCILED to FINAL on doses actually drawn (cascade hop 2)"
          - "Any ImmunotherapyPlan whose current_vial_color has no surviving IN_USE vial -> HELD (cascade hop 3)"

  - entity: SerumVial
    initial_state: IN_USE
    terminal_states: [EXHAUSTED, EXPIRED, DISCARDED]
    transitions:
      - from: IN_USE
        to: EXHAUSTED
        trigger: "system: dose attempted when remaining_volume_ml < scheduled draw"
        actor: system
        preconditions:
          - "remaining_volume_ml < requested draw volume (ERR_VIAL_INSUFFICIENT_VOLUME on the dose call)"
        side_effects:
          - "Vial closed; provisional 95165 BillingEntry reconciled to FINAL on doses drawn"
      - from: IN_USE
        to: EXPIRED
        trigger: "system: clock advanced to >= beyond_use_date_iso"
        actor: system
        preconditions:
          - "clock >= beyond_use_date_iso (inclusive)"
        side_effects:
          - "Vial unusable for future doses; provisional 95165 BillingEntry reconciled to FINAL on doses drawn"
      - from: IN_USE
        to: DISCARDED
        trigger: "system: backing lot recalled or owning plan discontinued"
        actor: system
        preconditions:
          - "Lot RECALLED or Plan DISCONTINUED"
        side_effects:
          - "provisional 95165 BillingEntry reconciled to FINAL on doses drawn"

  - entity: ShotVisit
    initial_state: ADMINISTERED
    terminal_states: [RELEASED, REACTION_LOCAL, REACTION_SYSTEMIC]
    transitions:
      - from: NEW
        to: ADMINISTERED
        trigger: "POST /immunotherapy-plans/{planId}/shot-visits (creates the visit directly in ADMINISTERED; NEW denotes pre-creation)"
        actor: Nurse
        preconditions:
          - "Plan is ACTIVE (ERR_PLAN_NOT_ACTIVE / ERR_PLAN_HELD)"
          - "Vial belongs to plan and is IN_USE and not expired (ERR_VIAL_NOT_USABLE)"
          - "Vial.remaining_volume_ml >= scheduled_dose_volume_ml (ERR_VIAL_INSUFFICIENT_VOLUME)"
          - "If vial_color == SILVER then patient.epinephrine_on_file is true (ERR_EPINEPHRINE_NOT_ON_FILE)"
        side_effects:
          - "scheduled_dose_volume_ml, administered_volume_ml, antigen_units_delivered computed per §1.3 dosing_schedule + antigen_units"
          - "observation_window_min computed (30 or 45) per §1.3 observation_window"
          - "vial.remaining_volume_ml provisionally reserved (debited) by administered_volume_ml; vial.needs_refill recomputed"
          - "A PROVISIONAL injection BillingEntry posted (CPT_95115 or CPT_95117 by injection_count)"
      - from: ADMINISTERED
        to: RELEASED
        trigger: "POST /shot-visits/{visitId}/release"
        actor: Nurse
        preconditions:
          - "Visit is ADMINISTERED (ERR_VISIT_NOT_ADMINISTERED)"
          - "reaction_grade is NONE (ERR_REACTION_GRADE_MISMATCH if LOCAL/SYSTEMIC sent to release)"
          - "released_at_iso >= administered_at_iso + observation_window_min (ERR_OBSERVATION_NOT_ELAPSED)"
        side_effects:
          - "Plan.last_dose_volume_ml set to administered_volume_ml"
          - "Plan advances one build-up step (current_step_index++ or vial advance GREEN->YELLOW->RED->SILVER); phase becomes MAINTENANCE on SILVER top step (bubble-up to plan)"
      - from: ADMINISTERED
        to: REACTION_LOCAL
        trigger: "POST /shot-visits/{visitId}/record-reaction"
        actor: Nurse
        preconditions:
          - "Visit is ADMINISTERED (ERR_VISIT_NOT_ADMINISTERED)"
          - "reaction_grade == LOCAL (ERR_REACTION_GRADE_MISMATCH)"
        side_effects:
          - "Plan.last_dose_volume_ml set to administered_volume_ml; plan does NOT advance (current_step_index unchanged — repeat same step next visit)"
      - from: ADMINISTERED
        to: REACTION_SYSTEMIC
        trigger: "POST /shot-visits/{visitId}/record-reaction"
        actor: Nurse
        preconditions:
          - "Visit is ADMINISTERED (ERR_VISIT_NOT_ADMINISTERED)"
          - "reaction_grade == SYSTEMIC (ERR_REACTION_GRADE_MISMATCH)"
          - "epinephrine_administered is true (ERR_EPINEPHRINE_REQUIRED)"
        side_effects:
          - "Cascade hop 1: owning ImmunotherapyPlan ACTIVE -> HELD"
          - "Cascade hop 2: this visit's PROVISIONAL injection BillingEntry -> REVERSED"
          - "Cascade hop 3: Patient.prior_systemic_reaction set true (widens all future observation windows to extended)"
          - "Plan.last_dose_volume_ml set to administered_volume_ml (basis for reduced re-entry on resume)"

  - entity: BillingEntry
    initial_state: POSTED
    terminal_states: [REVERSED, RECONCILED]
    transitions:
      - from: POSTED
        to: REVERSED
        trigger: "system: owning ShotVisit resolves REACTION_SYSTEMIC"
        actor: system
        preconditions:
          - "Entry is POSTED and is an injection code (CPT_95115/CPT_95117)"
        side_effects:
          - "charge_cents retained for audit but excluded from the patient's billed total"
      - from: POSTED
        to: RECONCILED
        trigger: "system: backing vial EXHAUSTED/EXPIRED/DISCARDED (95165 provisional->final)"
        actor: system
        preconditions:
          - "Entry is POSTED, variant PROVISIONAL, CPT_95165"
        side_effects:
          - "billed_dose_units recomputed to FINAL (doses actually drawn, capped at 10); charge_cents recomputed; variant set FINAL"

# -----------------------------------------------------------------------------
# 1.2.1 Concurrency Rules
# -----------------------------------------------------------------------------
concurrency_rules:
  - rule_id: vial-mix-stale-plan
    parent_entity: ImmunotherapyPlan
    write_endpoint: "POST /immunotherapy-plans/{planId}/vials"
    occ_field: "expected_plan_version"
    description: |
      Mixing a new SerumVial onto an ImmunotherapyPlan whose version has advanced
      since the client last observed it is rejected on a stale version. This
      captures the case where the plan's ladder position has already moved (a
      prior vial mix advanced current_vial_color, or a cascade from a systemic
      reaction flipped the plan to HELD) so the pharmacist's view of which rung
      to mix is stale.
    error_id: ERR_STALE_PLAN_VERSION
    http_status: 412

  - rule_id: shot-visit-stale-plan
    parent_entity: ImmunotherapyPlan
    write_endpoint: "POST /immunotherapy-plans/{planId}/shot-visits"
    occ_field: "expected_plan_version"
    description: |
      Administering a ShotVisit against an ImmunotherapyPlan whose version has
      advanced since the client last observed it is rejected on a stale version.
      This captures the case where the schedule position changed (a prior visit
      released and advanced the ladder, or a cascade put the plan in HELD) between
      the nurse reading the plan and submitting the injection, so the dose the
      nurse is about to draw no longer matches the plan's true next step.
    error_id: ERR_STALE_PLAN_VERSION
    http_status: 412

# =============================================================================
# 1.3 Calculation Rules Table
# =============================================================================
calculations:
  - name: panel_sensitization_score
    trigger: "On AllergenTest create and on DiagnosticPanel finalize; recomputes panel composites"
    algorithm: weighted_scoring
    formula: |
      # per-test sensitization_index
      if test.method == SKIN:
        diff = test.wheal_mm - panel.control_wheal_mm
        sensitization_index = max(0, diff)
        is_positive = (diff >= 3)
      else: # BLOOD
        ku = test.specific_ige_ku
        ige_class = 0 if ku < 0.35 else 1 if ku < 0.70 else 2 if ku < 3.5
                    else 3 if ku < 17.5 else 4 if ku < 50 else 5 if ku < 100 else 6
        sensitization_index = ige_class
        is_positive = (ige_class >= 1)
      # panel composites (variants differ ONLY by inclusion set)
      screening_composite = round( mean(sensitization_index over ALL tests), 2 )      # SCREENING variant
      clinical_composite  = round( mean(sensitization_index over tests where clinically_relevant=true), 2 )  # CLINICAL variant
      # if no clinically_relevant test exists, clinical_composite = 0
      recommended_tier = LOW if clinical_composite < 4 else MODERATE if clinical_composite < 7 else HIGH
    input_set: "All AllergenTest rows with panel_id == this panel (SCREENING); subset clinically_relevant=true (CLINICAL)"
    constants:
      IGE_CLASS_BOUNDS_KU: [0.35, 0.70, 3.5, 17.5, 50, 100]
      SKIN_POSITIVE_DIFF_MM: 3
      TIER_MODERATE_FLOOR: 4
      TIER_HIGH_FLOOR: 7
    precision: "2 decimal places, round_half_up"
    variants:
      - name: SCREENING
        when: "Inclusion = all tests on the panel"
        difference: "Denominator is total test count; dilutes high indices with low ones -> lower composite, more conservative tier"
      - name: CLINICAL
        when: "Inclusion = only clinically_relevant=true tests"
        difference: "Denominator is the relevant subset; drives recommended_tier and therefore the plan's starting vial. Same panel can yield LOW under SCREENING (composite 3.67 -> RED) and MODERATE under CLINICAL (composite 4.5 -> YELLOW)."

  - name: dosing_schedule
    trigger: "On ShotVisit administration; produces scheduled_dose_volume_ml and the post-release ladder advance"
    algorithm: threshold
    formula: |
      # Build-up ladder: each vial color has an ordered step list of volumes (mL).
      BUILD_UP_STEPS = {
        GREEN:  [0.10, 0.20, 0.40],
        YELLOW: [0.10, 0.20, 0.40],
        RED:    [0.10, 0.20, 0.30, 0.40],
        SILVER: [0.10, 0.20, 0.30, 0.40, 0.50],   # last SILVER step is the maintenance top dose
      }
      steps = BUILD_UP_STEPS[plan.current_vial_color]
      scheduled_dose_volume_ml = steps[plan.current_step_index - 1]   # 1-based
      # ADVANCE (only on RELEASED — see ShotVisit.RELEASED side_effects):
      if plan.current_step_index < len(steps):
        plan.current_step_index += 1
      else:
        # advance to next vial color in ladder; reset step to 1
        next_color = {GREEN:YELLOW, YELLOW:RED, RED:SILVER, SILVER:SILVER}[plan.current_vial_color]
        if next_color == plan.current_vial_color and plan.current_vial_color == SILVER:
          plan.phase = MAINTENANCE     # reached and held SILVER top dose
        else:
          plan.current_vial_color = next_color
          plan.current_step_index = 1
    input_set: "plan.current_vial_color, plan.current_step_index at administration time"
    constants:
      MAINTENANCE_TOP_VOLUME_ML: 0.50
    precision: "volumes are 2 dp literals; no rounding needed on lookup"
    variants:
      - name: BUILD_UP
        when: "phase == BUILD_UP; dose escalates step-by-step and color advances"
        difference: "scheduled_dose_volume_ml climbs the ladder; observation widens to 45 on a step that escalates"
      - name: MAINTENANCE
        when: "phase == MAINTENANCE; SILVER top dose repeats"
        difference: "scheduled_dose_volume_ml fixed at MAINTENANCE_TOP_VOLUME_ML (0.50); no further advance; observation 30 unless prior_systemic_reaction"

  - name: reaction_reduction
    trigger: "On POST /immunotherapy-plans/{planId}/resume after a HELD (systemic) plan, and on REACTION_LOCAL repeat"
    algorithm: threshold
    formula: |
      # SYSTEMIC re-entry (resume): reduce the last administered dose by REDUCTION_PCT
      reduced_volume_ml = round(plan.last_dose_volume_ml * (1 - REDUCTION_PCT), 2)   # 0.30 -> 0.23
      # AND step the ladder back one rung:
      if plan.current_step_index > 1:
        plan.current_step_index -= 1
      else:
        prev_color = {SILVER:RED, RED:YELLOW, YELLOW:GREEN, GREEN:GREEN}[plan.current_vial_color]
        plan.current_vial_color = prev_color   # GREEN floors (cannot go below GREEN)
        plan.current_step_index = 1
      # The reduced_volume_ml overrides the schedule lookup for the FIRST visit after resume.
      # LOCAL reaction: no reduction, no step change — next visit repeats current_step_index dose.
    input_set: "plan.last_dose_volume_ml, plan.current_vial_color, plan.current_step_index"
    constants:
      REDUCTION_PCT: 0.25
    precision: "2 decimal places, round_half_up"
    variants:
      - name: SYSTEMIC_REENTRY
        when: "resume from HELD"
        difference: "Volume reduced 25% AND ladder steps back one rung (this is the reduction side of the dose dual-variant: build-up escalates, reaction reduces — same Dose subject, opposite direction)"
      - name: LOCAL_REPEAT
        when: "REACTION_LOCAL recorded"
        difference: "No reduction; same step repeats; ladder does not advance"

  - name: antigen_units
    trigger: "On ShotVisit administration"
    algorithm: aggregation
    formula: |
      antigen_units_delivered = round(
        administered_volume_ml * vial.dilution_factor * lot.concentrate_potency_pnu_per_ml, 2)
      # dilution_factor by color: GREEN 0.001, YELLOW 0.01, RED 0.1, SILVER 1.0
      # Evaluation order is PINNED: multiply the three factors first, THEN round once at the end
      # (round-at-end, NOT round-per-factor) — see combinatorial_formula rule (b).
    input_set: "administered_volume_ml (this visit), vial.dilution_factor, lot.concentrate_potency_pnu_per_ml"
    constants:
      DILUTION_BY_COLOR: { GREEN: 0.001, YELLOW: 0.01, RED: 0.1, SILVER: 1.0 }
      STANDARD_POTENCY_PNU_PER_ML: 10000
    precision: "2 decimal places, round_half_up, applied ONCE after the full product"

  - name: billing_charge
    trigger: "On ShotVisit administration (injection code provisional) and on vial close (95165 provisional->final reconcile)"
    algorithm: tiered_pricing
    formula: |
      # Injection code at the visit (BillingEntry.visit_id = visit.id, vial_id = null,
      # patient_id = plan.patient_id):
      if visit.injection_count >= 2: cpt = CPT_95117; charge_cents = PRICE_95117_CENTS  # flat 3900
      else:                          cpt = CPT_95115; charge_cents = PRICE_95115_CENTS  # flat 2600
      # 95165 antigen-prep code (BillingEntry.vial_id = vial.id, visit_id = null,
      # patient_id = plan.patient_id), posted PROVISIONAL at vial mix, RECONCILED to FINAL at vial close:
      #   PROVISIONAL billed_dose_units = min(ceil(vial.prepared_volume_ml), DOSE_CAP)   # doses = whole mL of board
      #   FINAL       billed_dose_units = min(ceil(sum of administered volumes drawn from vial), DOSE_CAP)
      #   charge_cents = billed_dose_units * PRICE_95165_PER_DOSE_CENTS
      # Patient billed_total_cents (GET /patients/{id}/billing-summary) = SUM(charge_cents)
      # over BillingEntry where patient_id == patient AND status != REVERSED.
    input_set: "visit.injection_count; vial.prepared_volume_ml (provisional); sum of administered volumes on vial (final)"
    constants:
      PRICE_95115_CENTS: 2600
      PRICE_95117_CENTS: 3900
      PRICE_95165_PER_DOSE_CENTS: 1450
      DOSE_CAP: 10
    precision: "integer cents; ceil on dose units; no fractional doses"
    variants:
      - name: PROVISIONAL
        when: "Posted at vial mix; dose units from prepared_volume_ml"
        difference: "Bills the full board capacity ceil(prepared_volume_ml) capped at 10 — optimistic"
      - name: FINAL
        when: "Reconciled at vial EXHAUSTED/EXPIRED/DISCARDED; dose units from actual draws"
        difference: "Bills only doses actually drawn ceil(sum administered) capped at 10 — a vial discarded early bills fewer doses than provisioned; delta credited"

  - name: observation_window
    trigger: "On ShotVisit administration"
    algorithm: threshold
    formula: |
      extended = patient.prior_systemic_reaction OR this_dose_escalated_ladder
      # this_dose_escalated_ladder = the scheduled step is a higher volume than the plan's last_dose_volume_ml
      observation_window_min = OBS_EXTENDED_MIN if extended else OBS_STANDARD_MIN
      # Release precondition: released_at_iso >= administered_at_iso + observation_window_min minutes (inclusive)
    input_set: "patient.prior_systemic_reaction, plan.last_dose_volume_ml vs scheduled_dose_volume_ml"
    constants:
      OBS_STANDARD_MIN: 30
      OBS_EXTENDED_MIN: 45

# =============================================================================
# 1.4 Validation Rules Table (ordered by priority)
# =============================================================================
validations:
  - { priority: 1,  category: auth, check: "X-User-Role and X-User-ID headers present and well-formed", error_id: ERR_UNAUTHENTICATED, http_status: 401, applies_to: all }
  - { priority: 2,  category: auth, check: "Role permitted for this operation per §1.7 RBAC", error_id: ERR_FORBIDDEN, http_status: 403, applies_to: all }
  - { priority: 3,  category: existence, check: "Path resources exist, validated left-to-right (patient then panel/plan then nested)", error_id: ERR_NOT_FOUND, http_status: 404, applies_to: all }
  - { priority: 4,  category: existence, check: "FK targets in body exist (patient_id, panel_id, plan_id, vial_id, lot_id, visit_id)", error_id: ERR_FK_NOT_FOUND, http_status: 404, applies_to: "create endpoints" }
  - { priority: 5,  category: state, check: "Optimistic-concurrency: expected_plan_version matches ImmunotherapyPlan.version on guarded writes (the two §1.2.1 concurrency rules cover /vials and /shot-visits; /resume carries the same guard as a defensive optimistic check)", error_id: ERR_STALE_PLAN_VERSION, http_status: 412, applies_to: "POST /immunotherapy-plans/{planId}/vials; POST /immunotherapy-plans/{planId}/shot-visits; POST /immunotherapy-plans/{planId}/resume" }
  - { priority: 6,  category: state, check: "Target resource is in a state that permits the requested transition (panel OPEN/FINALIZED, plan DRAFT/ACTIVE/HELD, vial IN_USE, visit ADMINISTERED, lot AVAILABLE)", error_id: ERR_INVALID_STATE, http_status: 409, applies_to: "all transition endpoints" }
  - { priority: 7,  category: business_safety, check: "SILVER (maintenance-concentration) injection and HELD-plan resume require patient.epinephrine_on_file=true", error_id: ERR_EPINEPHRINE_NOT_ON_FILE, http_status: 422, applies_to: "POST /immunotherapy-plans/{planId}/shot-visits; POST /immunotherapy-plans/{planId}/resume" }
  - { priority: 8,  category: business_safety, check: "Recording reaction_grade=SYSTEMIC requires epinephrine_administered=true", error_id: ERR_EPINEPHRINE_REQUIRED, http_status: 422, applies_to: "POST /shot-visits/{visitId}/record-reaction" }
  - { priority: 9,  category: business_safety, check: "A vial used for a dose must not be EXPIRED (clock < beyond_use_date_iso) and lot not RECALLED", error_id: ERR_VIAL_NOT_USABLE, http_status: 422, applies_to: "POST /immunotherapy-plans/{planId}/shot-visits" }
  - { priority: 10, category: business_constraint, check: "AllergenTest method/value coherence: SKIN<->wheal_mm only; BLOOD<->specific_ige_ku only", error_id: ERR_TEST_METHOD_MISMATCH, http_status: 422, applies_to: "POST /patients/{patientId}/panels/{panelId}/tests" }
  - { priority: 11, category: business_constraint, check: "Finalize requires >=1 test and >=1 positive test", error_id: ERR_NO_POSITIVE_TEST, http_status: 422, applies_to: "POST /patients/{patientId}/panels/{panelId}/finalize" }
  - { priority: 12, category: business_temporal, check: "Release requires released_at_iso >= administered_at_iso + observation_window_min (inclusive)", error_id: ERR_OBSERVATION_NOT_ELAPSED, http_status: 422, applies_to: "POST /shot-visits/{visitId}/release" }
  - { priority: 13, category: business_constraint, check: "record-reaction / release reaction_grade must match the called endpoint (NONE->release; LOCAL/SYSTEMIC->record-reaction)", error_id: ERR_REACTION_GRADE_MISMATCH, http_status: 422, applies_to: "POST /shot-visits/{visitId}/release; POST /shot-visits/{visitId}/record-reaction" }
  - { priority: 14, category: business_referential, check: "Vial for a shot visit must belong to the same plan named in the path", error_id: ERR_VIAL_PLAN_MISMATCH, http_status: 422, applies_to: "POST /immunotherapy-plans/{planId}/shot-visits" }
  - { priority: 15, category: business_constraint, check: "lot_number unique among non-RECALLED SerumLots", error_id: ERR_DUPLICATE_LOT_NUMBER, http_status: 409, applies_to: "POST /serum-lots" }
  - { priority: 16, category: business_fiscal, check: "Vial draw must not exceed remaining_volume_ml (scheduled_dose_volume_ml <= remaining_volume_ml)", error_id: ERR_VIAL_INSUFFICIENT_VOLUME, http_status: 422, applies_to: "POST /immunotherapy-plans/{planId}/shot-visits" }
  - { priority: 17, category: business_constraint, check: "Request body required fields present and well-typed; enums in range; volumes positive", error_id: ERR_INVALID_REQUEST, http_status: 400, applies_to: all }

# =============================================================================
# 1.5 API Endpoint Table
# =============================================================================
endpoints:
  # --- system / clock -------------------------------------------------------
  - method: POST
    path: "/_clock/set_current_utc"
    description: "Set the logical clock to an explicit UTC instant. Server startup default is 2026-01-01T00:00:00Z; before any call here the clock reads exactly this default and never falls back to wall-clock time. Advancing the clock auto-expires any IN_USE vial whose beyond_use_date_iso <= new clock (reconciling its 95165 entry to FINAL)."
    roles: [Allergist, Pharmacist, Nurse, Biller, FrontDesk]
    code: 200
    input: [to_iso8601]
    output: "{ current_utc: string, expired_vial_ids: string[] }"
    side_effects: ["Vials past BUD transition IN_USE->EXPIRED; their 95165 entries RECONCILE to FINAL"]

  # --- patients -------------------------------------------------------------
  - method: POST
    path: "/patients"
    description: "Register a patient"
    roles: [FrontDesk, Allergist]
    code: 201
    input: [full_name, date_of_birth, "epinephrine_on_file?"]
    output: Patient
    side_effects: []
  - method: GET
    path: "/patients/{patientId}"
    description: "Fetch a patient"
    roles: [FrontDesk, Allergist, Nurse, Biller, Pharmacist]
    code: 200
    input: []
    output: Patient
    side_effects: []
  - method: GET
    path: "/patients"
    description: "List patients (paginated)"
    roles: [FrontDesk, Allergist, Nurse, Biller, Pharmacist]
    code: 200
    input: ["limit?", "offset?", "status?"]
    output: Patient[]
    side_effects: []
  - method: PATCH
    path: "/patients/{patientId}"
    description: "Update patient demographics / epinephrine_on_file / status"
    roles: [FrontDesk, Allergist]
    code: 200
    input: ["full_name?", "epinephrine_on_file?", "status?"]
    output: Patient
    side_effects: []

  # --- diagnostic panels & tests -------------------------------------------
  - method: POST
    path: "/patients/{patientId}/panels"
    description: "Open a diagnostic panel for a patient"
    roles: [Allergist]
    code: 201
    input: [panel_name, "control_wheal_mm?"]
    output: DiagnosticPanel
    side_effects: []
  - method: GET
    path: "/patients/{id}/panels"
    description: "List a patient's diagnostic panels (reverse-reachability for DiagnosticPanel.patient_id)"
    roles: [Allergist, Nurse, FrontDesk]
    code: 200
    input: ["limit?", "offset?"]
    output: DiagnosticPanel[]
    side_effects: []
  - method: GET
    path: "/panels/{panelId}"
    description: "Fetch a panel with computed composites"
    roles: [Allergist, Nurse, FrontDesk]
    code: 200
    input: []
    output: DiagnosticPanel
    side_effects: []
  - method: POST
    path: "/patients/{patientId}/panels/{panelId}/tests"
    description: "Add an allergen test result to an OPEN panel; recomputes composites"
    roles: [Allergist]
    code: 201
    input: [allergen_code, method, "wheal_mm?", "specific_ige_ku?", "clinically_relevant?"]
    output: AllergenTest
    side_effects: ["compute sensitization_index, is_positive; recompute panel composites & recommended_tier"]
  - method: GET
    path: "/panels/{id}/tests"
    description: "List tests on a panel (reverse-reachability for AllergenTest.panel_id)"
    roles: [Allergist, Nurse]
    code: 200
    input: ["limit?", "offset?"]
    output: AllergenTest[]
    side_effects: []
  - method: POST
    path: "/patients/{patientId}/panels/{panelId}/finalize"
    description: "Finalize a panel; freezes composites and recommended_tier"
    roles: [Allergist]
    code: 200
    input: []
    output: DiagnosticPanel
    side_effects: ["panel OPEN->FINALIZED"]

  # --- immunotherapy plans --------------------------------------------------
  - method: POST
    path: "/immunotherapy-plans"
    description: "Author a DRAFT immunotherapy plan from a FINALIZED panel; starting_vial_color derived from recommended_tier"
    roles: [Allergist]
    code: 201
    input: [patient_id, panel_id]
    output: ImmunotherapyPlan
    side_effects: ["starting_vial_color/current_vial_color derived from panel.recommended_tier"]
  - method: GET
    path: "/immunotherapy-plans/{planId}"
    description: "Fetch a plan with computed ladder position and version"
    roles: [Allergist, Nurse, Pharmacist, Biller, FrontDesk]
    code: 200
    input: []
    output: ImmunotherapyPlan
    side_effects: []
  - method: GET
    path: "/immunotherapy-plans"
    description: "List plans; filter by patient_id (reverse-reachability for ImmunotherapyPlan.patient_id) or panel_id (reverse-reachability for ImmunotherapyPlan.panel_id)"
    roles: [Allergist, Nurse, Pharmacist, Biller, FrontDesk]
    code: 200
    input: ["limit?", "offset?", "patient_id?", "panel_id?", "status?"]
    output: ImmunotherapyPlan[]
    side_effects: []
  - method: POST
    path: "/immunotherapy-plans/{planId}/activate"
    description: "Activate a DRAFT plan once a starting vial exists"
    roles: [Allergist]
    code: 200
    input: []
    output: ImmunotherapyPlan
    side_effects: ["DRAFT->ACTIVE; ladder initialized; increments ImmunotherapyPlan.version by 1"]
  - method: POST
    path: "/immunotherapy-plans/{planId}/resume"
    description: "Resume a HELD plan after a systemic reaction; applies reaction_reduction (reduced dose + step-back)"
    roles: [Allergist]
    code: 200
    input: [expected_plan_version]
    output: ImmunotherapyPlan
    side_effects: ["HELD->ACTIVE; reaction_reduction applied; increments ImmunotherapyPlan.version by 1"]
  - method: POST
    path: "/immunotherapy-plans/{planId}/complete"
    description: "Complete a plan at maintenance"
    roles: [Allergist]
    code: 200
    input: []
    output: ImmunotherapyPlan
    side_effects: ["ACTIVE->COMPLETED; increments ImmunotherapyPlan.version by 1"]
  - method: POST
    path: "/immunotherapy-plans/{planId}/discontinue"
    description: "Discontinue a plan; discards all IN_USE vials and reconciles their 95165 entries"
    roles: [Allergist]
    code: 200
    input: []
    output: ImmunotherapyPlan
    side_effects: ["ACTIVE/HELD->DISCONTINUED; cascade vials->DISCARDED; 95165 entries->RECONCILED; increments ImmunotherapyPlan.version by 1"]

  # --- serum lots -----------------------------------------------------------
  - method: POST
    path: "/serum-lots"
    description: "Register a manufacturer serum lot"
    roles: [Pharmacist]
    code: 201
    input: [vial_color, lot_number, concentrate_potency_pnu_per_ml, received_at_iso]
    output: SerumLot
    side_effects: []
  - method: GET
    path: "/serum-lots/{lotId}"
    description: "Fetch a lot"
    roles: [Pharmacist, Allergist, Nurse]
    code: 200
    input: []
    output: SerumLot
    side_effects: []
  - method: GET
    path: "/serum-lots"
    description: "List serum lots"
    roles: [Pharmacist, Allergist, Nurse]
    code: 200
    input: ["limit?", "offset?", "status?", "vial_color?"]
    output: SerumLot[]
    side_effects: []
  - method: POST
    path: "/serum-lots/{lotId}/recall"
    description: "Recall a lot; cascades to vials/billing/plans"
    roles: [Pharmacist]
    code: 200
    input: []
    output: SerumLot
    side_effects: ["AVAILABLE->RECALLED; vials->DISCARDED; 95165->RECONCILED; affected plans->HELD"]

  # --- serum vials (mixing) -------------------------------------------------
  - method: POST
    path: "/immunotherapy-plans/{planId}/vials"
    description: "Mix a serum vial onto a plan board from a lot; posts a PROVISIONAL 95165 billing entry. OCC-guarded on plan version."
    roles: [Pharmacist]
    code: 201
    input: [lot_id, prepared_volume_ml, expected_plan_version]
    output: SerumVial
    side_effects: ["vial IN_USE; vial_color/dilution_factor/shelf_life_days/beyond_use_date_iso/mixed_at_iso computed; PROVISIONAL CPT_95165 BillingEntry posted; increments ImmunotherapyPlan.version by 1"]
  - method: GET
    path: "/serum-vials/{vialId}"
    description: "Fetch a vial with remaining_volume_ml and needs_refill"
    roles: [Pharmacist, Nurse, Allergist]
    code: 200
    input: []
    output: SerumVial
    side_effects: []
  - method: GET
    path: "/serum-vials"
    description: "List vials; filter by plan_id (reverse-reachability for SerumVial.plan_id) or lot_id (reverse-reachability for SerumVial.lot_id)"
    roles: [Pharmacist, Nurse, Allergist]
    code: 200
    input: ["limit?", "offset?", "plan_id?", "lot_id?", "status?"]
    output: SerumVial[]
    side_effects: []

  # --- shot visits ----------------------------------------------------------
  - method: POST
    path: "/immunotherapy-plans/{planId}/shot-visits"
    description: "Administer an injection on an ACTIVE plan from a vial; computes dose, antigen units, observation window; posts PROVISIONAL injection billing. OCC-guarded on plan version."
    roles: [Nurse]
    code: 201
    input: [vial_id, "injection_count?", expected_plan_version]
    output: ShotVisit
    side_effects: ["ShotVisit ADMINISTERED; dose/antigen/observation computed; vial remaining debited; PROVISIONAL CPT_95115/95117 posted; increments ImmunotherapyPlan.version by 1"]
  - method: GET
    path: "/shot-visits/{visitId}"
    description: "Fetch a shot visit"
    roles: [Nurse, Allergist, Biller, FrontDesk]
    code: 200
    input: []
    output: ShotVisit
    side_effects: []
  - method: GET
    path: "/shot-visits"
    description: "List shot visits; filter by plan_id (reverse-reachability for ShotVisit.plan_id) or vial_id (reverse-reachability for ShotVisit.vial_id)"
    roles: [Nurse, Allergist, Biller, FrontDesk]
    code: 200
    input: ["limit?", "offset?", "plan_id?", "vial_id?", "status?"]
    output: ShotVisit[]
    side_effects: []
  - method: POST
    path: "/shot-visits/{visitId}/release"
    description: "Release a patient after the observation window; advances the build-up ladder"
    roles: [Nurse]
    code: 200
    input: [released_at_iso, "reaction_grade?"]
    output: ShotVisit
    side_effects: ["ADMINISTERED->RELEASED; plan ladder advances; plan.last_dose_volume_ml set; phase may bubble to MAINTENANCE"]
  - method: POST
    path: "/shot-visits/{visitId}/record-reaction"
    description: "Record a LOCAL or SYSTEMIC reaction; SYSTEMIC cascades plan->HELD, reverses injection billing, sets prior_systemic_reaction"
    roles: [Nurse]
    code: 200
    input: [reaction_grade, "epinephrine_administered?"]
    output: ShotVisit
    side_effects: ["ADMINISTERED->REACTION_LOCAL or REACTION_SYSTEMIC; SYSTEMIC: plan->HELD, billing->REVERSED, patient.prior_systemic_reaction=true"]

  # --- billing --------------------------------------------------------------
  - method: GET
    path: "/billing-entries/{entryId}"
    description: "Fetch a billing entry"
    roles: [Biller, Allergist]
    code: 200
    input: []
    output: BillingEntry
    side_effects: []
  - method: GET
    path: "/billing-entries"
    description: "List billing entries; filter by visit_id (reverse-reachability for BillingEntry.visit_id), vial_id (reverse-reachability for BillingEntry.vial_id), or patient_id (reverse-reachability for BillingEntry.patient_id)"
    roles: [Biller, Allergist]
    code: 200
    input: ["limit?", "offset?", "visit_id?", "vial_id?", "patient_id?", "status?", "cpt_code?"]
    output: BillingEntry[]
    side_effects: []
  - method: GET
    path: "/patients/{patientId}/billing-summary"
    description: "Computed read: patient's billed total in cents excluding REVERSED entries, plus per-CPT breakdown"
    roles: [Biller, Allergist]
    code: 200
    input: []
    output: "{ patient_id: string, billed_total_cents: integer, reversed_total_cents: integer, by_cpt: object }"
    side_effects: []

# =============================================================================
# 1.6 Error Code Catalog
# =============================================================================
errors:
  - { id: ERR_UNAUTHENTICATED, http: 401, condition: "Missing/invalid X-User-Role or X-User-ID header" }
  - { id: ERR_FORBIDDEN, http: 403, condition: "Role not permitted for this operation per RBAC" }
  - { id: ERR_NOT_FOUND, http: 404, condition: "Path-referenced resource does not exist" }
  - { id: ERR_FK_NOT_FOUND, http: 404, condition: "Body foreign-key target does not exist" }
  - { id: ERR_STALE_PLAN_VERSION, http: 412, condition: "expected_plan_version does not match ImmunotherapyPlan.version on an OCC-guarded write" }
  - { id: ERR_INVALID_STATE, http: 409, condition: "Generic: target resource not in a state permitting the requested transition" }
  - { id: ERR_PANEL_NOT_OPEN, http: 409, condition: "Adding tests / finalizing a panel that is not OPEN" }
  - { id: ERR_PANEL_EMPTY, http: 422, condition: "Finalize a panel with zero tests" }
  - { id: ERR_NO_POSITIVE_TEST, http: 422, condition: "Finalize a panel with no is_positive test" }
  - { id: ERR_PANEL_NOT_FINALIZED, http: 409, condition: "Activate a plan whose panel is not FINALIZED" }
  - { id: ERR_PLAN_NOT_DRAFT, http: 409, condition: "Activate a plan not in DRAFT" }
  - { id: ERR_PLAN_NOT_ACTIVE, http: 409, condition: "Administer/complete on a plan not ACTIVE" }
  - { id: ERR_PLAN_HELD, http: 409, condition: "Administer a shot on a HELD plan" }
  - { id: ERR_PLAN_NOT_HELD, http: 409, condition: "Resume a plan not in HELD" }
  - { id: ERR_NOT_AT_MAINTENANCE, http: 409, condition: "Complete a plan whose phase is not MAINTENANCE" }
  - { id: ERR_OPEN_VISIT_EXISTS, http: 409, condition: "Complete a plan with a visit still ADMINISTERED" }
  - { id: ERR_PLAN_NOT_DISCONTINUABLE, http: 409, condition: "Discontinue a plan not ACTIVE/HELD" }
  - { id: ERR_NO_STARTING_VIAL, http: 422, condition: "Activate a plan with no IN_USE vial of starting_vial_color" }
  - { id: ERR_PATIENT_INACTIVE, http: 422, condition: "New panel/plan/visit against an INACTIVE patient" }
  - { id: ERR_LOT_NOT_AVAILABLE, http: 409, condition: "Recall / mix from a lot not AVAILABLE" }
  - { id: ERR_DUPLICATE_LOT_NUMBER, http: 409, condition: "lot_number collides with an existing non-RECALLED lot" }
  - { id: ERR_VIAL_NOT_USABLE, http: 422, condition: "Dose from an EXPIRED/DISCARDED vial or RECALLED lot" }
  - { id: ERR_VIAL_INSUFFICIENT_VOLUME, http: 422, condition: "scheduled_dose_volume_ml exceeds vial.remaining_volume_ml" }
  - { id: ERR_VIAL_PLAN_MISMATCH, http: 422, condition: "Vial does not belong to the plan named in the path" }
  - { id: ERR_EPINEPHRINE_NOT_ON_FILE, http: 422, condition: "SILVER injection or HELD resume without patient.epinephrine_on_file" }
  - { id: ERR_EPINEPHRINE_REQUIRED, http: 422, condition: "reaction_grade=SYSTEMIC without epinephrine_administered=true" }
  - { id: ERR_TEST_METHOD_MISMATCH, http: 422, condition: "SKIN test missing wheal_mm or carrying specific_ige_ku (or vice-versa for BLOOD)" }
  - { id: ERR_OBSERVATION_NOT_ELAPSED, http: 422, condition: "released_at_iso earlier than administered_at_iso + observation_window_min" }
  - { id: ERR_REACTION_GRADE_MISMATCH, http: 422, condition: "reaction_grade does not match the called endpoint (release expects NONE; record-reaction expects LOCAL/SYSTEMIC)" }
  - { id: ERR_VISIT_NOT_ADMINISTERED, http: 409, condition: "release/record-reaction on a visit not in ADMINISTERED" }
  - { id: ERR_INVALID_REQUEST, http: 400, condition: "Missing/malformed body field, bad enum, non-positive volume, bad pagination" }

# =============================================================================
# 1.7 RBAC Matrix
# =============================================================================
roles:
  - name: Allergist
    description: "Physician who authors panels, finalizes diagnosis, authors/activates/resumes/completes/discontinues immunotherapy plans"
    identity: opaque
    exclusive_operations:
      - "POST /patients/{patientId}/panels"
      - "POST /patients/{patientId}/panels/{panelId}/tests"
      - "POST /patients/{patientId}/panels/{panelId}/finalize"
      - "POST /immunotherapy-plans"
      - "POST /immunotherapy-plans/{planId}/activate"
      - "POST /immunotherapy-plans/{planId}/resume"
      - "POST /immunotherapy-plans/{planId}/complete"
      - "POST /immunotherapy-plans/{planId}/discontinue"
    shared_operations:
      - "POST /patients"
      - "PATCH /patients/{patientId}"
      - "GET (panels, plans, vials, lots, visits, billing)"
      - "POST /_clock/set_current_utc"
  - name: Pharmacist
    description: "Compounds serum, manages lots and vials, issues recalls"
    identity: opaque
    exclusive_operations:
      - "POST /serum-lots"
      - "POST /serum-lots/{lotId}/recall"
      - "POST /immunotherapy-plans/{planId}/vials"
    shared_operations:
      - "GET (lots, vials, plans, patients)"
      - "POST /_clock/set_current_utc"
  - name: Nurse
    description: "Administers shot visits, observes patients, records reactions and releases"
    identity: opaque
    exclusive_operations:
      - "POST /immunotherapy-plans/{planId}/shot-visits"
      - "POST /shot-visits/{visitId}/release"
      - "POST /shot-visits/{visitId}/record-reaction"
    shared_operations:
      - "GET (patients, panels, plans, vials, lots, visits)"
      - "POST /_clock/set_current_utc"
  - name: Biller
    description: "Reviews billing entries and patient billing summaries"
    identity: opaque
    exclusive_operations: []
    shared_operations:
      - "GET (billing-entries, billing-summary, patients, plans, visits)"
      - "POST /_clock/set_current_utc"
  - name: FrontDesk
    description: "Registers patients, schedules, reads records"
    identity: opaque
    exclusive_operations: []
    shared_operations:
      - "POST /patients"
      - "PATCH /patients/{patientId}"
      - "GET (patients, panels, plans, visits)"
      - "POST /_clock/set_current_utc"
