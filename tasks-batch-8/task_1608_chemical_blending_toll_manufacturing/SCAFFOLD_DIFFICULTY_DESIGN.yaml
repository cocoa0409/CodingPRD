scaffold_difficulty_design:
  # =========================================================================
  # Rule 1 — Dual-variant calculations across different entity domains
  # =========================================================================
  - rule_id: dual_variant_calc
    instances:
      - name: price_batch_job_provisional_vs_final_formulated_mode
        grounds:
          - calculations.price_batch_job
          - entities.BatchJob.fields.quoted_price_cents
          - entities.BatchJob.fields.invoiced_price_cents
        distinguishing_aspect: |
          Same PricingAgreement (FORMULATED_PRICE mode) yields two different
          prices because PROVISIONAL uses theoretical_output_kg while FINAL
          uses actual_output_kg AND applies an over-yield credit — a
          formulation-side (BatchJob) dual-variant.
        test_recipe:
          setup:
            - "Customer C1 (ACTIVE, credit_hold=false) exists"
            - "PricingAgreement PA1 for C1: pricing_mode=FORMULATED_PRICE, formulated_price_per_kg_cents=200, over_yield_split_pct=50, window [2026-08-01, 2026-12-31), status=ACTIVE"
            - "Recipe R1 for C1: target_density_kg_per_l=1.200, theoretical_yield_pct=80, components=[{material_code:'M-A', mass_fraction_pct:100.000, charge_order:1}], status=APPROVED (highest_component_ghs=NON_HAZ since no lots have been received for M-A yet — the recipe's hazard class is derived from existing lots; for NON_HAZ classification we receive a NON_HAZ lot for M-A BEFORE approving R1)"
            - "Lot L1 for C1: material_code='M-A', ghS_class=NON_HAZ, quantity_kg_received=1000, storage_zone=Z_GENERAL"
            - "Tank T1: capacity_l=1000, working_capacity_l=800, current_zone=Z_GENERAL, cleaning_state=CLEAN_VALIDATED, last_product_ghs=null"
            - "BatchJob BJ1: recipe_id=R1, pricing_agreement_id=PA1, tank_id=T1, batch_size_l=500, scheduled 2026-09-01T10:00:00Z..2026-09-01T12:00:00Z"
            - "BJ1 driven to HOLD_QA"
            - "SDS issued for BJ1 with ghs_classification=NON_HAZ, signal_word=NONE, hazard_statements=[]"
            - "PackageConfig created for BJ1: package_type=DRUM_205L, un_rated=false, package_count=3 (total_volume_l=615)"
            - "HeelDisposalRecord POSTED for (BJ1, L1): heel_returned_kg=0, heel_disposed_kg=0 — wait, spec says at least one must be > 0; so heel_returned_kg=50, heel_disposed_kg=0"
            - "current_utc = 2026-09-01T10:00:00Z"
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-08-01T00:00:00Z" }
              as: QualityManager
            - call: "POST /toll-operations/customers"
              payload: { legal_name: "Acme Coatings", credit_hold: false }
              as: QualityManager
              captures: { c1: $.data.id }
            - call: "POST /toll-operations/customers/${c1}/raw-material-lots"
              payload: { material_code: "M-A", ghS_class: "NON_HAZ", quantity_kg_received: 1000, storage_zone: "Z_GENERAL", received_at: "2026-08-15T08:00:00Z" }
              as: BatchScheduler
              captures: { l1: $.data.id }
            - call: "POST /toll-operations/recipes"
              payload: { name: "Clear Coat Base", revision: 1, customer_id: "${c1}", target_density_kg_per_l: 1.200, theoretical_yield_pct: 80, components: [{ material_code: "M-A", mass_fraction_pct: 100.000, charge_order: 1 }] }
              as: QualityManager
              captures: { r1: $.data.id }
            - call: "POST /toll-operations/recipes/${r1}/approve"
              payload: {}
              as: QualityManager
            - call: "POST /toll-operations/customers/${c1}/pricing-agreements"
              payload: { pricing_mode: "FORMULATED_PRICE", tolling_base_fee_cents: 0, tolling_per_kg_cents: 0, formulated_price_per_kg_cents: 200, over_yield_split_pct: 50, effective_from: "2026-08-01T00:00:00Z", effective_to: "2026-12-31T00:00:00Z" }
              as: QualityManager
              captures: { pa1: $.data.id, pa1_v: $.data.version }
            - call: "POST /toll-operations/customers/${c1}/pricing-agreements/${pa1}/activate"
              payload: { expected_pricing_agreement_version: "${pa1_v}" }
              as: QualityManager
            - call: "POST /toll-operations/tanks"
              payload: { tank_code: "TK-201", capacity_l: 1000, working_capacity_l: 800, current_zone: "Z_GENERAL" }
              as: QualityManager
              captures: { t1: $.data.id }
            - call: "POST /toll-operations/tanks/${t1}/cleaning-records"
              payload: { method: "DRY_PURGE", started_at: "2026-08-20T08:00:00Z", completed_at: "2026-08-20T09:00:00Z", residue_ppm: 0 }
              as: TankOperator
              captures: { cr1: $.data.id }
            - call: "POST /toll-operations/tanks/${t1}/cleaning-records/${cr1}/submit"
              payload: {}
              as: TankOperator
            - call: "POST /toll-operations/tanks/${t1}/cleaning-records/${cr1}/validate"
              payload: { decision: "PASS" }
              as: QAValidator
            - call: "POST /toll-operations/customers/${c1}/batch-jobs"
              payload: { recipe_id: "${r1}", pricing_agreement_id: "${pa1}", tank_id: "${t1}", batch_size_l: 500, scheduled_start: "2026-09-01T10:00:00Z", scheduled_end: "2026-09-01T12:00:00Z" }
              as: BatchScheduler
              captures: { bj1: $.data.id, bj1_v: $.data.version, bj1_quoted: $.data.quoted_price_cents }
            - call: "POST /toll-operations/customers/${c1}/batch-jobs/${bj1}/release"
              payload: { expected_batch_job_version: "${bj1_v}" }
              as: BatchScheduler
            - call: "POST /toll-operations/customers/${c1}/batch-jobs/${bj1}/batch-charges"
              payload: { raw_material_lot_id: "${l1}", charge_order: 1, charged_qty_kg: 400 }
              as: TankOperator
            - call: "POST /toll-operations/customers/${c1}/batch-jobs/${bj1}/start-charging"
              payload: {}
              as: TankOperator
            - call: "POST /toll-operations/customers/${c1}/batch-jobs/${bj1}/start-mixing"
              payload: {}
              as: TankOperator
            - call: "POST /toll-operations/customers/${c1}/batch-jobs/${bj1}/hold-for-qa"
              payload: {}
              as: TankOperator
            - call: "POST /toll-operations/customers/${c1}/batch-jobs/${bj1}/sds"
              payload: { ghs_classification: "NON_HAZ", signal_word: "NONE", hazard_statements: [] }
              as: SDSAuthor
              captures: { sds1: $.data.id }
            - call: "POST /toll-operations/customers/${c1}/batch-jobs/${bj1}/sds/${sds1}/issue"
              payload: {}
              as: SDSAuthor
            - call: "POST /toll-operations/customers/${c1}/batch-jobs/${bj1}/package-config"
              payload: { package_type: "DRUM_205L", un_rated: false, package_count: 3 }
              as: ShippingClerk
            - call: "POST /toll-operations/customers/${c1}/batch-jobs/${bj1}/heel-disposals"
              payload: { raw_material_lot_id: "${l1}", heel_returned_kg: 50, heel_disposed_kg: 0, disposed_at: "2026-09-01T11:30:00Z" }
              as: TankOperator
              captures: { hd1: $.data.id }
            - call: "POST /toll-operations/customers/${c1}/batch-jobs/${bj1}/heel-disposals/${hd1}/post"
              payload: {}
              as: TankOperator
          trigger:
            - call: "POST /toll-operations/customers/${c1}/batch-jobs/${bj1}/complete"
              payload: { actual_output_kg: 500 }
              as: QAValidator
          assert:
            # theo_kg = 500 * 1.2 * 0.80 = 480 kg
            # PROVISIONAL quoted = 200 * 480 = 96000 cents
            # FINAL invoiced base = 200 * 500 = 100000; over_kg = 500-480=20; credit = 20*200*0.5=2000; final = 98000
            - "BatchJob.${bj1}.quoted_price_cents == 96000"
            - "BatchJob.${bj1}.invoiced_price_cents == 98000"
            - "BatchJob.${bj1}.theoretical_output_kg == 480.000"
            - "BatchJob.${bj1}.yield_variance_pct == 4.166667 (within 1e-3)"

      - name: lot_available_kg_consignment_reconciliation
        grounds:
          - calculations.lot_available_kg
          - entities.RawMaterialLot.fields.quantity_kg_available
          - entities.RawMaterialLot.fields.quantity_kg_committed
        distinguishing_aspect: |
          RawMaterialLot availability uses a CHRONOLOGICAL running-balance
          variant (sum of COMMITTED charge deltas minus POSTED disposal
          deltas) while the sibling price_batch_job (instance 1) uses a
          tiered_pricing dual-variant — different entity domain (consignment
          inventory vs. pricing) and different algorithm family.
        test_recipe:
          setup:
            - "Customer C2 ACTIVE, no credit hold"
            - "Two lots of material_code='SOLV' for C2: L_A with quantity_kg_received=1000 (Z_GENERAL, NON_HAZ), L_B with quantity_kg_received=500 (Z_GENERAL, NON_HAZ)"
            - "Recipe R2 APPROVED for C2 with single component SOLV 100%"
            - "PricingAgreement PA2 TOLLING_FEE ACTIVE window covering now"
            - "Tank T2 CLEAN_VALIDATED in Z_GENERAL"
            - "Two BatchJobs BJ_A and BJ_B created and RELEASED"
            - "BJ_A: charge 200 from L_A (COMMITTED); BJ_B: charge 100 from L_B (COMMITTED) AND charge 50 from L_A (COMMITTED)"
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-08-01T00:00:00Z" }
              as: QualityManager
            - call: "POST /toll-operations/customers"
              payload: { legal_name: "Beta Chemicals" }
              as: QualityManager
              captures: { c2: $.data.id }
            - call: "POST /toll-operations/customers/${c2}/raw-material-lots"
              payload: { material_code: "SOLV", ghS_class: "NON_HAZ", quantity_kg_received: 1000, storage_zone: "Z_GENERAL", received_at: "2026-08-02T08:00:00Z" }
              as: BatchScheduler
              captures: { la: $.data.id }
            - call: "POST /toll-operations/customers/${c2}/raw-material-lots"
              payload: { material_code: "SOLV", ghS_class: "NON_HAZ", quantity_kg_received: 500, storage_zone: "Z_GENERAL", received_at: "2026-08-02T09:00:00Z" }
              as: BatchScheduler
              captures: { lb: $.data.id }
            - call: "POST /toll-operations/recipes"
              payload: { name: "Solvent Blend", revision: 1, customer_id: "${c2}", target_density_kg_per_l: 1.0, theoretical_yield_pct: 100, components: [{ material_code: "SOLV", mass_fraction_pct: 100.000, charge_order: 1 }] }
              as: QualityManager
              captures: { r2: $.data.id }
            - call: "POST /toll-operations/recipes/${r2}/approve"
              payload: {}
              as: QualityManager
            - call: "POST /toll-operations/customers/${c2}/pricing-agreements"
              payload: { pricing_mode: "TOLLING_FEE", tolling_base_fee_cents: 5000, tolling_per_kg_cents: 10, formulated_price_per_kg_cents: 0, effective_from: "2026-08-01T00:00:00Z", effective_to: "2026-12-31T00:00:00Z" }
              as: QualityManager
              captures: { pa2: $.data.id, pa2_v: $.data.version }
            - call: "POST /toll-operations/customers/${c2}/pricing-agreements/${pa2}/activate"
              payload: { expected_pricing_agreement_version: "${pa2_v}" }
              as: QualityManager
            - call: "POST /toll-operations/tanks"
              payload: { tank_code: "TK-202", capacity_l: 2000, working_capacity_l: 2000, current_zone: "Z_GENERAL" }
              as: QualityManager
              captures: { t2: $.data.id }
            - call: "POST /toll-operations/tanks/${t2}/cleaning-records"
              payload: { method: "DRY_PURGE", started_at: "2026-08-03T08:00:00Z", completed_at: "2026-08-03T09:00:00Z", residue_ppm: 0 }
              as: TankOperator
              captures: { cr2: $.data.id }
            - call: "POST /toll-operations/tanks/${t2}/cleaning-records/${cr2}/submit"
              payload: {}
              as: TankOperator
            - call: "POST /toll-operations/tanks/${t2}/cleaning-records/${cr2}/validate"
              payload: { decision: "PASS" }
              as: QAValidator
            - call: "POST /toll-operations/customers/${c2}/batch-jobs"
              payload: { recipe_id: "${r2}", pricing_agreement_id: "${pa2}", tank_id: "${t2}", batch_size_l: 300, scheduled_start: "2026-09-05T08:00:00Z", scheduled_end: "2026-09-05T12:00:00Z" }
              as: BatchScheduler
              captures: { bj_a: $.data.id, bj_a_v: $.data.version }
            - call: "POST /toll-operations/customers/${c2}/batch-jobs/${bj_a}/release"
              payload: { expected_batch_job_version: "${bj_a_v}" }
              as: BatchScheduler
            - call: "POST /toll-operations/customers/${c2}/batch-jobs/${bj_a}/batch-charges"
              payload: { raw_material_lot_id: "${la}", charge_order: 1, charged_qty_kg: 200 }
              as: TankOperator
            - call: "POST /toll-operations/customers/${c2}/batch-jobs/${bj_a}/batch-charges"
              payload: { raw_material_lot_id: "${lb}", charge_order: 1, charged_qty_kg: 100 }
              as: TankOperator
          trigger:
            - call: "POST /toll-operations/customers/${c2}/batch-jobs/${bj_a}/batch-charges"
              payload: { raw_material_lot_id: "${la}", charge_order: 1, charged_qty_kg: 50 }
              as: TankOperator
            - call: "GET /toll-operations/customers/${c2}/raw-material-lots/${la}"
              as: Any
              captures: { la_avail: $.data.quantity_kg_available, la_on_hand: $.data.quantity_kg_on_hand, la_committed: $.data.quantity_kg_committed }
            - call: "GET /toll-operations/customers/${c2}/raw-material-lots/${lb}"
              as: Any
              captures: { lb_avail: $.data.quantity_kg_available }
          assert:
            - "RawMaterialLot.${la}.quantity_kg_on_hand == 1000 (no CONSUMED yet, no POSTED disposals)"
            - "RawMaterialLot.${la}.quantity_kg_committed == 250 (200 + 50)"
            - "RawMaterialLot.${la}.quantity_kg_available == 750"
            - "RawMaterialLot.${lb}.quantity_kg_on_hand == 500"
            - "RawMaterialLot.${lb}.quantity_kg_committed == 100"
            - "RawMaterialLot.${lb}.quantity_kg_available == 400"

  # =========================================================================
  # Rule 2 — Combinatorial formulas across different modes
  # =========================================================================
  - rule_id: combinatorial_formula
    instances:
      - name: price_batch_job_formulated_over_yield_credit_combinatorial
        grounds:
          - calculations.price_batch_job
        distinguishing_aspect: |
          Mode (a) — formula with >=3 inputs and non-linear interaction:
          FINAL price in FORMULATED_PRICE mode = f(actual_output_kg,
          theoretical_output_kg, formulated_price_per_kg_cents,
          over_yield_split_pct) with a conditional branch
          (if actual > theoretical) that subtracts a credit — three-input
          branchy form.
        test_recipe:
          setup:
            - "Customer C3 ACTIVE"
            - "PricingAgreement PA3: FORMULATED_PRICE, formulated_price_per_kg_cents=150, over_yield_split_pct=60, ACTIVE window covering now"
            - "Recipe R3: density=1.000, yield=90, single NON_HAZ component, APPROVED"
            - "Tank T3 CLEAN_VALIDATED"
            - "Lot L3 received 2000 kg NON_HAZ"
            - "BatchJob BJ3 batch_size_l=1000 driven to HOLD_QA; SDS issued; PackageConfig 5x DRUM_205L (=1025 L); Heel posted"
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-08-01T00:00:00Z" }
              as: QualityManager
            - call: "POST /toll-operations/customers"
              payload: { legal_name: "Gamma Solvents" }
              as: QualityManager
              captures: { c3: $.data.id }
            - call: "POST /toll-operations/customers/${c3}/raw-material-lots"
              payload: { material_code: "BINDER", ghS_class: "NON_HAZ", quantity_kg_received: 2000, storage_zone: "Z_GENERAL", received_at: "2026-08-02T08:00:00Z" }
              as: BatchScheduler
              captures: { l3: $.data.id }
            - call: "POST /toll-operations/recipes"
              payload: { name: "Binder Mix", revision: 1, customer_id: "${c3}", target_density_kg_per_l: 1.0, theoretical_yield_pct: 90, components: [{ material_code: "BINDER", mass_fraction_pct: 100.000, charge_order: 1 }] }
              as: QualityManager
              captures: { r3: $.data.id }
            - call: "POST /toll-operations/recipes/${r3}/approve"
              payload: {}
              as: QualityManager
            - call: "POST /toll-operations/customers/${c3}/pricing-agreements"
              payload: { pricing_mode: "FORMULATED_PRICE", tolling_base_fee_cents: 0, tolling_per_kg_cents: 0, formulated_price_per_kg_cents: 150, over_yield_split_pct: 60, effective_from: "2026-08-01T00:00:00Z", effective_to: "2026-12-31T00:00:00Z" }
              as: QualityManager
              captures: { pa3: $.data.id, pa3_v: $.data.version }
            - call: "POST /toll-operations/customers/${c3}/pricing-agreements/${pa3}/activate"
              payload: { expected_pricing_agreement_version: "${pa3_v}" }
              as: QualityManager
            - call: "POST /toll-operations/tanks"
              payload: { tank_code: "TK-301", capacity_l: 1500, working_capacity_l: 1500, current_zone: "Z_GENERAL" }
              as: QualityManager
              captures: { t3: $.data.id }
            - call: "POST /toll-operations/tanks/${t3}/cleaning-records"
              payload: { method: "DRY_PURGE", started_at: "2026-08-02T08:00:00Z", completed_at: "2026-08-02T09:00:00Z", residue_ppm: 0 }
              as: TankOperator
              captures: { cr3: $.data.id }
            - call: "POST /toll-operations/tanks/${t3}/cleaning-records/${cr3}/submit"
              payload: {}
              as: TankOperator
            - call: "POST /toll-operations/tanks/${t3}/cleaning-records/${cr3}/validate"
              payload: { decision: "PASS" }
              as: QAValidator
            - call: "POST /toll-operations/customers/${c3}/batch-jobs"
              payload: { recipe_id: "${r3}", pricing_agreement_id: "${pa3}", tank_id: "${t3}", batch_size_l: 1000, scheduled_start: "2026-09-10T08:00:00Z", scheduled_end: "2026-09-10T12:00:00Z" }
              as: BatchScheduler
              captures: { bj3: $.data.id, bj3_v: $.data.version }
            - call: "POST /toll-operations/customers/${c3}/batch-jobs/${bj3}/release"
              payload: { expected_batch_job_version: "${bj3_v}" }
              as: BatchScheduler
            - call: "POST /toll-operations/customers/${c3}/batch-jobs/${bj3}/batch-charges"
              payload: { raw_material_lot_id: "${l3}", charge_order: 1, charged_qty_kg: 900 }
              as: TankOperator
            - call: "POST /toll-operations/customers/${c3}/batch-jobs/${bj3}/start-charging"
              payload: {}
              as: TankOperator
            - call: "POST /toll-operations/customers/${c3}/batch-jobs/${bj3}/start-mixing"
              payload: {}
              as: TankOperator
            - call: "POST /toll-operations/customers/${c3}/batch-jobs/${bj3}/hold-for-qa"
              payload: {}
              as: TankOperator
            - call: "POST /toll-operations/customers/${c3}/batch-jobs/${bj3}/sds"
              payload: { ghs_classification: "NON_HAZ", signal_word: "NONE", hazard_statements: [] }
              as: SDSAuthor
              captures: { sds3: $.data.id }
            - call: "POST /toll-operations/customers/${c3}/batch-jobs/${bj3}/sds/${sds3}/issue"
              payload: {}
              as: SDSAuthor
            - call: "POST /toll-operations/customers/${c3}/batch-jobs/${bj3}/package-config"
              payload: { package_type: "DRUM_205L", un_rated: false, package_count: 5 }
              as: ShippingClerk
            - call: "POST /toll-operations/customers/${c3}/batch-jobs/${bj3}/heel-disposals"
              payload: { raw_material_lot_id: "${l3}", heel_returned_kg: 100, heel_disposed_kg: 0, disposed_at: "2026-09-10T11:00:00Z" }
              as: TankOperator
              captures: { hd3: $.data.id }
            - call: "POST /toll-operations/customers/${c3}/batch-jobs/${bj3}/heel-disposals/${hd3}/post"
              payload: {}
              as: TankOperator
          trigger:
            - call: "POST /toll-operations/customers/${c3}/batch-jobs/${bj3}/complete"
              payload: { actual_output_kg: 950 }
              as: QAValidator
          assert:
            # theo_kg = 1000 * 1.0 * 0.90 = 900 kg
            # FINAL base = 150 * 950 = 142500; over_kg = 950-900 = 50
            # credit = 50 * 150 * 0.60 = 4500; invoiced = 142500 - 4500 = 138000
            - "BatchJob.${bj3}.theoretical_output_kg == 900.000"
            - "BatchJob.${bj3}.invoiced_price_cents == 138000"
            - "BatchJob.${bj3}.yield_variance_pct == 5.555556 (within 1e-3)"

      - name: placard_threshold_at_454l_boundary
        grounds:
          - calculations.placard_determination
          - entities.PackageConfig.fields.placard_required
          - entities.PackageConfig.fields.placard_class
        distinguishing_aspect: |
          Mode (b/c hybrid pinned to (a)-with-threshold) — threshold-style
          nested evaluation with boundary semantics: placard_required uses
          `total_volume_l >= 454` (>=, not >). Boundary inputs at 453 L
          vs 454 L vs 455 L produce different placard_required values,
          exercising a different mode from instance 1 (which has no
          threshold boundary). Distinct from mode (a) branchy form.
        test_recipe:
          setup:
            - "Customer C4 ACTIVE"
            - "PricingAgreement PA4 TOLLING_FEE ACTIVE"
            - "Recipe R4 with FLAMMABLE component; APPROVED; highest_component_ghs=FLAMMABLE"
            - "Lot L4 FLAMMABLE received"
            - "Tank T4 Z_FLAM CLEAN_VALIDATED"
            - "Three BatchJobs BJ_453, BJ_454, BJ_455 each batch_size_l=200 driven to HOLD_QA with FLAMMABLE SDS issued; heel posted"
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-08-01T00:00:00Z" }
              as: QualityManager
            - call: "POST /toll-operations/customers"
              payload: { legal_name: "Delta Flammables" }
              as: QualityManager
              captures: { c4: $.data.id }
            - call: "POST /toll-operations/customers/${c4}/raw-material-lots"
              payload: { material_code: "MEK", ghS_class: "FLAMMABLE", quantity_kg_received: 5000, storage_zone: "Z_FLAM", received_at: "2026-08-02T08:00:00Z" }
              as: BatchScheduler
              captures: { l4: $.data.id }
            - call: "POST /toll-operations/recipes"
              payload: { name: "MEK Carrier", revision: 1, customer_id: "${c4}", target_density_kg_per_l: 0.8, theoretical_yield_pct: 95, components: [{ material_code: "MEK", mass_fraction_pct: 100.000, charge_order: 1 }] }
              as: QualityManager
              captures: { r4: $.data.id }
            - call: "POST /toll-operations/recipes/${r4}/approve"
              payload: {}
              as: QualityManager
            - call: "POST /toll-operations/customers/${c4}/pricing-agreements"
              payload: { pricing_mode: "TOLLING_FEE", tolling_base_fee_cents: 1000, tolling_per_kg_cents: 5, formulated_price_per_kg_cents: 0, effective_from: "2026-08-01T00:00:00Z", effective_to: "2026-12-31T00:00:00Z" }
              as: QualityManager
              captures: { pa4: $.data.id, pa4_v: $.data.version }
            - call: "POST /toll-operations/customers/${c4}/pricing-agreements/${pa4}/activate"
              payload: { expected_pricing_agreement_version: "${pa4_v}" }
              as: QualityManager
            - call: "POST /toll-operations/tanks"
