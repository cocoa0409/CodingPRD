          expected_program_version: ${pv1}
        as: ProgramManager
        as_user_id: pm-user-1
        captures:
          rep: $.data.id
      trigger:
      - call: POST /streetlights/savings-reports/${rep}/attest
        payload: {}
        as: Auditor
        as_user_id: auditor-1
        captures:
          e0: $.data.error_id
      - call: POST /streetlights/savings-reports/${rep}/submit
        payload: {}
        as: ProgramManager
        as_user_id: pm-user-1
        captures:
          e1: $.data.error_id
      - call: POST /streetlights/tariff-accounts/${acct}/close-period
        payload: {}
        as: BillingAnalyst
      - call: POST /streetlights/savings-reports/${rep}/submit
        payload: {}
        as: ProgramManager
        as_user_id: pm-user-1
      - call: POST /streetlights/savings-reports/${rep}/submit
        payload: {}
        as: ProgramManager
        as_user_id: pm-user-1
        captures:
          e2: $.data.error_id
      - call: POST /streetlights/savings-reports/${rep}/attest
        payload: {}
        as: Auditor
        as_user_id: auditor-1
      - call: POST /streetlights/savings-reports/${rep}/revise
        payload: {}
