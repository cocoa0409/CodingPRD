  - rule_id: combinatorial_formula
    instances:
      - name: pool_distributable_three_way_min_max_with_cap
        grounds:
          - calculations.pool_distributable_amount
          - entities.RoyaltyPool.fields.allocation_basis
          - entities.RoyaltyPool.fields.distributable_cents
        distinguishing_aspect: |
          distributable_cents is not a single formula but a nested min/max over THREE
          independently computed quantities (revenue share, per-subscriber minimum, statutory
          floor) plus a cap of MAX_POOL_CAP_MULTIPLE times the minimum, and the reported
          allocation_basis is decided by a separate pinned chain of >= comparisons — so the cap
          can bind the amount (150000) while the basis still reports PER_SUBSCRIBER_MINIMUM.
        test_recipe:
          setup:
            - "Three EFFECTIVE WORLD rate schedules, one per subscription tier (FAMILY, STUDENT, FREE_AD_SUPPORTED), all with revenue_share_bps 7000, per_subscriber_minimum_cents 500, statutory_floor_per_play_millicents 100, mechanical 4000 / performance 6000."
            - "One period 2026-06 with a sealed, matched batch carrying one GB line per tier: 200000 plays FAMILY, 900000 plays STUDENT, 100000 plays FREE_AD_SUPPORTED, all matched by exact ISRC."
            - "Three GB pools: FAMILY subscriber_count 1400 gross_revenue_cents 1000000; STUDENT subscriber_count 1 gross_revenue_cents 1000; FREE_AD_SUPPORTED subscriber_count 100 gross_revenue_cents 10000000."
