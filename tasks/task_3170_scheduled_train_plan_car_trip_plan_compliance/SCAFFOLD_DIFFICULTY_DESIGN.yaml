            - "first finalize: error_id == ERR_NO_CREW_AVAILABLE and TrainDeparture.${d2}.status stays SCHEDULED"
            - "after replenish (pool REOPENED, crews_available 2): second finalize succeeds, TrainDeparture.${d2}.status == DEPARTED"
            - "CrewPool.${pool}.crews_booked == 2 == crews_available -> pool EXHAUSTED again"

      - name: plan_retirement_gated_by_trip_leg_state
        grounds:
          - state_machines.TrainPlan.ACTIVE_to_RETIRED
          - state_machines.TripLeg
          - errors[ERR_PLAN_IN_USE]
        distinguishing_aspect: |
          A DIFFERENT entity pair — TrainPlan x TripLeg: retire is rejected
          with ERR_PLAN_IN_USE while any PLANNED leg references the plan;
          once the shipment is cancelled (legs cascade to REPLACED), the SAME
          retire call succeeds. The plan's own state never changed — only a
          child entity's state gated the parent transition.
        test_recipe:
          setup:
            - "Yards RG-A, RG-B; ACTIVE plan RG-P (no departures scheduled); customer; shipment RS OPEN with itinerary [RG-P] (leg PLANNED)."
            - "Shipment version captured at creation (v1), then bumped to v2 by trip-leg assignment."
