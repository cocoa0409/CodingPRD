            - "Response status == 403 and data.error_id == ERR_FORBIDDEN_ROLE"

  # ===========================================================================
  - section: cross_cutting_complexity_layers
    instances:
      - name: occ_stale_version_on_knockdown
        claim_type: optimistic_concurrency
        grounds: ["concurrency_rules[knockdown-stale-lot]", "errors[ERR_STALE_VERSION]", "validations[priority=9]"]
        distinguishing_aspect: "Knock-down carrying an expected_lot_version one less than current (a bid bumped the lot's version after the read) -> 412 ERR_STALE_VERSION."
        test_recipe:
          setup: ["OPEN lot; client read lot version, then another bid advanced it; stale knock-down uses ${lv} - 1."]
          setup_api_calls:
            - call: "POST /premium-schedules"
              payload: { name: "Std18", tiers: [ { upper_bound_cents: null, rate_bps: 2000 } ] }
              as: SaleAdministrator
              captures: { sched_id: $.data.id }
            - call: "POST /sellers"
              payload: { legal_name: "Estate OCC", email: "occ@x.com", country_code: "US", payout_iban: "US00000000000000000000118" }
              as: SaleAdministrator
              captures: { seller_id: $.data.id }
            - call: "POST /bidders"
              payload: { legal_name: "Buyer OCC", email: "bocc@x.com", country_code: "US", credit_limit_cents: 500000000 }
              as: SaleAdministrator
              captures: { bidder_id: $.data.id }
            - call: "POST /consignments"
              payload: { seller_id: "${seller_id}", seller_commission_bps: 1000 }
              as: SaleAdministrator
              captures: { cons_id: $.data.id, cons_v: $.data.version }
            - call: "POST /consignments/${cons_id}/activate"
              payload: { expected_consignment_version: "${cons_v}" }
              as: SaleAdministrator
            - call: "POST /auction-sales"
              payload: { title: "OCC Sale", sale_date_utc: "2026-08-04T15:00:00Z", currency: "USD", buyers_premium_schedule_id: "${sched_id}" }
              as: SaleAdministrator
              captures: { sale_id: $.data.id }
            - call: "POST /auction-sales/${sale_id}/lots"
              payload: { consignment_id: "${cons_id}", lot_number: 1, title: "OCC Work", artist_name: "X", artist_alive: false, low_estimate_cents: 1300000, high_estimate_cents: 1800000, reserve_cents: 1000000 }
              as: SaleAdministrator
              captures: { lot_id: $.data.id }
            - call: "POST /paddle-registrations"
              payload: { auction_sale_id: "${sale_id}", bidder_id: "${bidder_id}", registration_type: "FLOOR" }
              as: SaleAdministrator
              captures: { paddle_id: $.data.id }
            - call: "GET /auction-sales/${sale_id}"
              payload: {}
              as: SaleAdministrator
              captures: { sv1: $.data.version }
            - call: "POST /auction-sales/${sale_id}/publish"
              payload: { expected_auction_sale_version: "${sv1}" }
              as: SaleAdministrator
              captures: { sv2: $.data.version }
            - call: "POST /auction-sales/${sale_id}/open-bidding"
              payload: { expected_auction_sale_version: "${sv2}" }
              as: Auctioneer
            - call: "POST /lots/${lot_id}/bids"
              payload: { paddle_registration_id: "${paddle_id}", amount_cents: 1100000, bid_channel: "FLOOR" }
              as: Auctioneer
            - call: "GET /lots/${lot_id}"
              payload: {}
              as: Auctioneer
              captures: { lv_stale: $.data.version }
            - call: "POST /lots/${lot_id}/bids"
              payload: { paddle_registration_id: "${paddle_id}", amount_cents: 1250000, bid_channel: "FLOOR" }
              as: Auctioneer
          trigger:
            - call: "POST /lots/${lot_id}/knock-down"
              payload: { expected_lot_version: "${lv_stale}" }
              as: Auctioneer
              captures: { err: $.data.error_id }
          assert:
            - "Response status == 412 and data.error_id == ERR_STALE_VERSION (lv_stale is now behind current after the second bid bumped the lot version)"

      - name: occ_stale_version_on_invoice
        claim_type: optimistic_concurrency
        grounds: ["concurrency_rules[invoice-create-stale-lot]", "errors[ERR_STALE_VERSION]", "validations[priority=9]"]
        distinguishing_aspect: "A second invoice attempt carrying the pre-invoice expected_lot_version (the first invoice already bumped the lot's version) -> 412 ERR_STALE_VERSION."
        test_recipe:
          setup: ["Lot SOLD in CLOSED sale; first invoice succeeds (bumps lot version); a second invoice reuses the stale version."]
          setup_api_calls:
            - call: "POST /premium-schedules"
              payload: { name: "Standard", tiers: [ { upper_bound_cents: 3000000, rate_bps: 2600 }, { upper_bound_cents: null, rate_bps: 1450 } ] }
              as: SaleAdministrator
              captures: { sched_id: $.data.id }
            - call: "POST /sellers"
              payload: { legal_name: "Estate OCC2", email: "occ2@x.com", country_code: "US", payout_iban: "US00000000000000000000119" }
              as: SaleAdministrator
              captures: { seller_id: $.data.id }
            - call: "POST /bidders"
              payload: { legal_name: "Buyer OCC2", email: "bocc2@x.com", country_code: "US", credit_limit_cents: 500000000 }
              as: SaleAdministrator
              captures: { bidder_id: $.data.id }
            - call: "POST /consignments"
