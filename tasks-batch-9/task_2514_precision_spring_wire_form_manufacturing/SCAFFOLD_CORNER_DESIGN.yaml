      - GET /spring-designs as DesignEngineer returns total_count == 0
  - name: wire_lot_create_against_an_unknown_material_spec_is_not_found
    claim_type: violation_to_error
    grounds:
    - errors[ERR_MATERIAL_SPEC_NOT_FOUND]
    - validations[priority 7]
    distinguishing_aspect: 'A wire heat cannot be received against a specification that does not exist: the material_spec_id
      in the body is resolved before the lot row is written, even though a different spec is on file.'
    test_recipe:
      setup:
