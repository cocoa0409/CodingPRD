              payload: { legal_name: "Thin Margin Co", lei: "LEI-FS2", participant_class: "BROKER_DEALER", net_capital_cents: 400000000 }
              as: PlatformAdmin
              captures: { p_fs2: $.data.id }
          trigger:
            - call: "POST /clearing/participants/${p_fs2}/activate"
