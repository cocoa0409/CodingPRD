        distinguishing_aspect: |
          Metric weeks-on-floor via the markdown-events endpoint: age is compared
          with >= ROTATION_WEEKS, so at week 4 an item floored at week 0 (age exactly
          4) is pulled while a sibling floored at week 1 (age exactly 3) survives with
          exactly one markdown step.
        test_recipe:
          setup:
            - "Clock starts at 2026-01-05 (week 0): item A priced at week 0. Clock advances to 2026-01-12 (week 1): item B priced, then the week-1 markdown event runs (A steps to 1, B untouched at age 0)."
