scenario: |
  Ready-Mix Concrete Plant & Dispatch (CEMEX/Vulcan ready-mix): mix design catalog &
  admixture dosing, order intake with pour window & slump spec, truck dispatch & load
  rotation, water added on site & strength liability, short-load/wait-time & Saturday
  surcharge, batch ticket & QC cylinder chain, returned concrete & washout, cement
  price escalation

domain_name: ready-mix-dispatch
api_prefix: /v1

complexity_profile:
  primary_archetype: pricing_engine
  secondary_archetype: temporal_windowing
  complexity_layers:
    - optimistic_concurrency
    - cascading_side_effects
    - rate_threshold_triggers
    - derived_field_reconciliation
  entity_topology: flat
  state_machine_shape: parallel   # Order carries delivery_status x billing_status; Invoice and Truck are cyclic
  relationship_patterns: [one_to_many, cross_aggregate]
  role_model: segregation_of_duties
  consistency_model: immediate

# =============================================================================
# 1.0 Response Envelope (FIXED)
# =============================================================================
response_envelope:
  success: |
    { "meta": { "api_request_id": "req_xxx", "api_request_timestamp": "ISO8601" },
      "response_type": "object" | "array", "data": {} }
  error: |
    { "meta": { ... }, "response_type": "error",
      "data": { "error_id": "ERR_XXX", "message": "..." } }
  pagination_fields: ["limit", "offset", "total_count", "has_more"]
  pagination_defaults: { limit: 10, min: 1, max: 100, offset: 0 }

# =============================================================================
# 1.1 Entity-Relationship Table
# =============================================================================
entities:
  - name: Plant
    parent: null
    common_fields: true
    fields:
      - { name: name, type: string, source: input, description: "Plant name" }
      - { name: batch_cycle_minutes, type: integer, source: input, description: "Minutes one batch occupies the plant; defines the half-open batch interval [batch_time, batch_time + batch_cycle_minutes)" }
      - { name: daily_capacity_yd3, type: number, source: input, description: "Nominal daily plant capacity in cubic yards" }
      - { name: status, type: enum, source: system, default: ACTIVE, description: "ACTIVE | DOWN", constraints: "enum {ACTIVE, DOWN}" }

  - name: MixDesign
    parent: null
    common_fields: true
    fields:
      - { name: plant_id, type: string, source: input, description: "FK -> Plant.id" }
      - { name: code, type: string, source: input, description: "Mix code; unique per plant", constraints: "unique (plant_id, code)" }
      - { name: name, type: string, source: input, description: "Human-readable mix name" }
      - { name: design_strength_psi, type: integer, source: input, description: "Specified 28-day compressive strength f'c" }
      - { name: slump_in, type: number, source: input, description: "Design slump in inches" }
      - { name: cement_content_lb_per_yd3, type: integer, source: input, description: "Cement content per cubic yard" }
      - { name: design_wc_ratio, type: number, source: input, description: "Design water/cement ratio batched at plant" }
      - { name: max_wc_ratio, type: number, source: input, description: "Absolute legal w/c ceiling including all on-site water" }
      - { name: admixtures, type: array, source: input, description: "Array of {admixture_code, dose_oz_per_cwt}" }
      - { name: status, type: enum, source: system, default: DRAFT, description: "DRAFT | ACTIVE | RETIRED", constraints: "enum {DRAFT, ACTIVE, RETIRED}" }

  - name: PriceList
    parent: null
    common_fields: true
    fields:
      - { name: plant_id, type: string, source: input, description: "FK -> Plant.id" }
      - { name: mix_design_id, type: string, source: input, description: "FK -> MixDesign.id" }
      - { name: base_price_per_yd3_cents, type: integer, source: input, description: "Base price per cubic yard before escalation" }
      - { name: escalation_base_index_points, type: number, source: input, description: "Cement index baseline for the escalation ratio" }
      - { name: min_load_yd3, type: number, source: input, description: "Minimum load size; discharged qty strictly below this triggers the short-load fee" }
      - { name: short_load_fee_cents, type: integer, source: input, description: "Flat fee for a short load" }
      - { name: wait_free_minutes, type: integer, source: input, description: "Free on-site minutes; billable wait = max(0, on_site_minutes - wait_free_minutes)" }
      - { name: wait_rate_per_minute_cents, type: integer, source: input, description: "Per-minute wait charge beyond free minutes" }
      - { name: wait_fee_cap_cents, type: integer, source: input, description: "Cap on the wait fee per load" }
      - { name: saturday_surcharge_pct, type: number, source: input, description: "Fraction (e.g. 0.10) applied to concrete + short-load subtotal when pour_date is Saturday" }
      - { name: status, type: enum, source: system, description: "DRAFT | ACTIVE | SUPERSEDED; ACTIVE when created with activate=true", constraints: "enum {DRAFT, ACTIVE, SUPERSEDED}" }
      - { name: activated_at, type: datetime, source: system, description: "Logical-clock timestamp when activated; null while DRAFT" }

  - name: CementPriceIndex
    parent: null
    common_fields: false
    fields:
      - { name: plant_id, type: string, source: input, description: "FK -> Plant.id" }
      - { name: effective_month, type: string, source: input, description: "Month the index applies to, YYYY-MM; unique per plant", constraints: "unique (plant_id, effective_month)" }
      - { name: index_points, type: number, source: input, description: "Published index value" }

  - name: Customer
    parent: null
    common_fields: true
    fields:
      - { name: name, type: string, source: input, description: "Customer name" }
      - { name: credit_limit_cents, type: integer, source: input, description: "Credit limit; exposure >= limit puts the customer on HOLD" }
      - { name: short_load_allowed, type: boolean, source: input, default: true, description: "When false, scheduling a load below min_load_yd3 is rejected" }
      - { name: credit_status, type: enum, source: system, default: GOOD, description: "GOOD | HOLD — derived from credit_exposure_cents vs credit_limit_cents", constraints: "enum {GOOD, HOLD}" }
      - { name: credit_exposure_cents, type: integer, source: computed, default: 0, description: "Open exposure per calculation credit_exposure" }

  - name: Order
    parent: null
    common_fields: true
    fields:
      - { name: customer_id, type: string, source: system, description: "FK -> Customer.id; set from X-User-ID of the placing Customer" }
      - { name: plant_id, type: string, source: input, description: "FK -> Plant.id" }
      - { name: mix_design_id, type: string, source: input, description: "FK -> MixDesign.id" }
      - { name: price_list_id, type: string, source: system, description: "FK -> PriceList.id; version-pinned at confirm to the ACTIVE list for (plant_id, mix_design_id)" }
      - { name: qty_yd3, type: number, source: input, description: "Ordered quantity" }
      - { name: pour_date, type: string, source: input, description: "Pour date YYYY-MM-DD (drives Saturday surcharge and escalation month)" }
      - { name: pour_window_start, type: string, source: input, description: "Pour window start HH:MM (24h)" }
      - { name: pour_window_end, type: string, source: input, description: "Pour window end HH:MM; must be strictly after start" }
      - { name: slump_in, type: number, source: input, description: "Ordered slump; must be within +/-1.0 in of the mix design slump" }
      - { name: delivery_status, type: enum, source: system, default: PLACED, description: "PLACED | CONFIRMED | SCHEDULED | IN_PROGRESS | DELIVERED | CANCELLED", constraints: "enum {PLACED, CONFIRMED, SCHEDULED, IN_PROGRESS, DELIVERED, CANCELLED}" }
      - { name: billing_status, type: enum, source: system, default: UNPRICED, description: "UNPRICED | PRICED | INVOICED | DISPUTED | PAID | VOID — parallel dimension, evolves independently of delivery_status", constraints: "enum {UNPRICED, PRICED, INVOICED, DISPUTED, PAID, VOID}" }
      - { name: delivered_qty_yd3, type: number, source: computed, default: 0, description: "Sum of discharged_qty_yd3 over loads with status COMPLETED" }
      - { name: escalated_base_cents, type: integer, source: computed, description: "Escalated base price per yd3 pinned at confirm (provisional variant); null until CONFIRMED" }
      - { name: provisional_total_cents, type: integer, source: computed, description: "Provisional order quote at confirm; null until CONFIRMED" }

  - name: Truck
    parent: null
    common_fields: true
    fields:
      - { name: plant_id, type: string, source: input, description: "FK -> Plant.id" }
      - { name: fleet_number, type: string, source: input, description: "Fleet number; unique per plant", constraints: "unique (plant_id, fleet_number)" }
      - { name: capacity_yd3, type: number, source: input, description: "Drum capacity" }
      - { name: status, type: enum, source: system, default: AVAILABLE, description: "AVAILABLE | ON_DELIVERY | IN_WASHOUT | OUT_OF_SERVICE", constraints: "enum {AVAILABLE, ON_DELIVERY, IN_WASHOUT, OUT_OF_SERVICE}" }
      - { name: last_available_at, type: datetime, source: system, description: "Logical-clock timestamp of the most recent transition into AVAILABLE; selector ranking key" }

  - name: Load
    parent: null
    common_fields: true
    fields:
      - { name: order_id, type: string, source: system, description: "FK -> Order.id; from the scheduling path" }
      - { name: truck_id, type: string, source: system, description: "FK -> Truck.id; request truck_id when given, otherwise chosen by truck_selector" }
      - { name: plant_id, type: string, source: system, description: "FK -> Plant.id; denormalized from Order.plant_id at schedule" }
      - { name: qty_yd3, type: number, source: input, description: "Scheduled (batched) quantity for this load" }
      - { name: status, type: enum, source: system, default: SCHEDULED, description: "SCHEDULED | BATCHED | EN_ROUTE | ON_SITE | POURING | COMPLETED | RETURNED | WASHED_OUT | CANCELLED", constraints: "enum {SCHEDULED, BATCHED, EN_ROUTE, ON_SITE, POURING, COMPLETED, RETURNED, WASHED_OUT, CANCELLED}" }
      - { name: batch_time, type: datetime, source: system, description: "Logical-clock time of batching (or explicit batch_time input)" }
      - { name: arrival_time, type: datetime, source: system, description: "On-site arrival timestamp; null until arrive" }
      - { name: complete_time, type: datetime, source: system, description: "Completion timestamp; null until complete" }
      - { name: on_site_minutes, type: integer, source: computed, description: "floor((complete_time - arrival_time) / 60s); null until complete" }
      - { name: discharged_qty_yd3, type: number, source: system, default: 0, description: "Cubic yards discharged (set by complete or return)" }
      - { name: returned_qty_yd3, type: number, source: computed, default: 0, description: "Cubic yards returned (mirrors ReturnRecord)" }
      - { name: actual_wc_ratio, type: number, source: computed, description: "Recomputed on batch and on every water addition; 3 decimals" }
      - { name: over_watered, type: boolean, source: computed, default: false, description: "true iff actual_wc_ratio > mix max_wc_ratio (strict >)" }
      - { name: strength_liability, type: enum, source: computed, default: NONE, description: "NONE | CUSTOMER | PLANT — set when over_watered flips true or when a cylinder set is FLAGGED", constraints: "enum {NONE, CUSTOMER, PLANT}" }
      - { name: concrete_cents, type: integer, source: computed, description: "Final concrete line; null until complete" }
      - { name: short_load_fee_cents, type: integer, source: computed, description: "Final short-load line; null until complete" }
      - { name: wait_fee_cents, type: integer, source: computed, description: "Final wait line; null until complete" }
      - { name: saturday_fee_cents, type: integer, source: computed, description: "Final Saturday surcharge line; null until complete" }
      - { name: final_charge_cents, type: integer, source: computed, description: "Sum of the four pre-rounded lines; null until complete" }

  - name: BatchTicket
    parent: null
    common_fields: false
    fields:
      - { name: load_id, type: string, source: system, description: "FK -> Load.id; 1:1, created by batch" }
      - { name: ticket_number, type: integer, source: system, description: "Sequential per plant: count of existing tickets for the plant + 1" }
      - { name: cement_lb, type: integer, source: computed, description: "round(cement_content_lb_per_yd3 x qty_yd3, 0)" }
      - { name: batch_water_lb, type: integer, source: computed, description: "round(design_wc_ratio x cement_lb, 0) + extra water in lb" }
      - { name: extra_batch_water_gal, type: number, source: input, default: 0, description: "Extra batch water requested at the plant; echoed from batch input" }
      - { name: admixture_doses, type: array, source: computed, description: "Per-admixture {admixture_code, dose_oz}, each rounded to 0.1 oz" }
      - { name: total_admixture_oz, type: number, source: computed, description: "Sum of the per-line rounded doses (round-per-line then sum)" }

  - name: WaterAddition
    parent: null
    common_fields: false
    fields:
      - { name: load_id, type: string, source: system, description: "FK -> Load.id" }
      - { name: gallons, type: number, source: input, description: "Water added on site, gallons" }
      - { name: customer_authorized, type: boolean, source: input, description: "Whether the customer authorized the addition" }
      - { name: added_by_user_id, type: string, source: system, description: "X-User-ID of the Driver who recorded the addition" }
      - { name: added_at, type: datetime, source: system, description: "Logical-clock timestamp" }

  - name: CylinderSet
    parent: null
    common_fields: true
    fields:
      - { name: load_id, type: string, source: system, description: "FK -> Load.id" }
      - { name: num_cylinders, type: integer, source: input, description: "Cylinders cast in this set" }
      - { name: cast_by_user_id, type: string, source: system, description: "X-User-ID of the casting QCTech" }
      - { name: cast_at, type: datetime, source: system, description: "Logical-clock timestamp of casting" }
      - { name: status, type: enum, source: system, default: CURING, description: "CURING | SEVEN_DAY_RECORDED | FINAL_RECORDED | CERTIFIED | FLAGGED", constraints: "enum {CURING, SEVEN_DAY_RECORDED, FINAL_RECORDED, CERTIFIED, FLAGGED}" }
      - { name: seven_day_strength_psi, type: integer, source: input, description: "7-day break result; null until recorded" }
      - { name: seven_day_recorded_by, type: string, source: system, description: "X-User-ID recording the 7-day break" }
      - { name: final_strength_psi, type: integer, source: input, description: "28-day break result; null until recorded" }
      - { name: final_recorded_by, type: string, source: system, description: "X-User-ID recording the 28-day break" }
      - { name: acceptance_basis, type: enum, source: computed, default: DESIGN_BASIS, description: "DESIGN_BASIS | AS_PLACED; flips to AS_PLACED when the load becomes over_watered", constraints: "enum {DESIGN_BASIS, AS_PLACED}" }
      - { name: required_strength_psi, type: integer, source: computed, description: "Acceptance bar: mix design_strength_psi under both variants" }
      - { name: acceptance_passed, type: boolean, source: computed, description: "Set at certify: final_strength_psi >= required_strength_psi" }
      - { name: certified_by_user_id, type: string, source: system, description: "X-User-ID of certifying QCTech; must differ from cast_by_user_id and final_recorded_by" }

  - name: ReturnRecord
    parent: null
    common_fields: true
    fields:
      - { name: load_id, type: string, source: system, description: "FK -> Load.id; 1:1, created by return" }
      - { name: returned_qty_yd3, type: number, source: input, description: "Cubic yards returned to the plant" }
      - { name: disposition, type: enum, source: input, description: "DUMPED | RECYCLED | FILL", constraints: "enum {DUMPED, RECYCLED, FILL}" }
      - { name: washout_water_gal, type: number, source: system, description: "Washout water recorded by the washout step; null until WASHED_OUT" }

  - name: Invoice
    parent: null
    common_fields: true
    fields:
      - { name: order_id, type: string, source: system, description: "FK -> Order.id; auto-created in DRAFT when the order becomes DELIVERED" }
      - { name: customer_id, type: string, source: system, description: "FK -> Customer.id; denormalized from Order.customer_id" }
      - { name: line_items, type: array, source: computed, description: "Array of {kind, description, amount_cents}; one LOAD line per COMPLETED load plus adjustment lines" }
      - { name: total_cents, type: integer, source: computed, description: "Invariant: total_cents == sum(line_items.amount_cents)" }
      - { name: status, type: enum, source: system, default: DRAFT, description: "DRAFT | ISSUED | DISPUTED | PAID | VOID", constraints: "enum {DRAFT, ISSUED, DISPUTED, PAID, VOID}" }
      - { name: issued_at, type: datetime, source: system, description: "Logical-clock timestamp of issue; null while DRAFT" }

# =============================================================================
# 1.2 State Machine Table
# =============================================================================
state_machines:
  - entity: Order
    initial_state: PLACED   # delivery_status; billing_status starts UNPRICED (parallel dimension)
    terminal_states: [DELIVERED, CANCELLED]   # billing PAID and VOID are terminal for billing_status
    transitions:
      - from: PLACED
        to: CONFIRMED
        trigger: "POST /v1/orders/{id}/confirm"
        actor: Dispatcher
        preconditions:
          - "delivery_status == PLACED"
          - "Customer (Order.customer_id) credit_status != HOLD (ERR_CREDIT_HOLD)"
          - "MixDesign (Order.mix_design_id) status == ACTIVE (ERR_MIX_NOT_ACTIVE)"
          - "Exactly one PriceList with status == ACTIVE exists for (plant_id, mix_design_id) (ERR_PRICE_LIST_MISSING)"
          - "pour_date >= current logical-clock date (ERR_POUR_DATE_PAST)"
        side_effects:
          - "Pins Order.price_list_id to the ACTIVE PriceList; increments Order.version"
          - "billing_status UNPRICED -> PRICED"
          - "Runs provisional_quote: sets escalated_base_cents and provisional_total_cents (provisional variant of load_final_charge)"
      - from: CONFIRMED
        to: SCHEDULED
        trigger: "system (automatic on first successful POST /v1/orders/{id}/loads)"
        actor: system
        preconditions: []
        side_effects: []
      - from: SCHEDULED
        to: IN_PROGRESS
        trigger: "system (automatic when the order's first load reaches BATCHED)"
        actor: system
        preconditions: []
        side_effects: []
      - from: SCHEDULED
        to: DELIVERED
        trigger: "system (automatic when order_fulfillment: delivered_qty_yd3 >= qty_yd3 after a load completes)"
        actor: system
        preconditions: []
        side_effects:
          - "Cascade link 1: delivered_qty_yd3 recomputed by order_fulfillment"
          - "Cascade link 2: auto-create Invoice for the order in DRAFT with one LOAD line per COMPLETED load at final_charge_cents; total_cents = sum of lines"
          - "Cascade link 3: Customer.credit_exposure_cents recomputed (credit_exposure); credit_status -> HOLD iff exposure >= credit_limit_cents"
      - from: IN_PROGRESS
        to: DELIVERED
        trigger: "system (automatic when order_fulfillment: delivered_qty_yd3 >= qty_yd3 after a load completes)"
        actor: system
        preconditions: []
        side_effects:
          - "Cascade link 1: delivered_qty_yd3 recomputed by order_fulfillment"
          - "Cascade link 2: auto-create Invoice for the order in DRAFT with one LOAD line per COMPLETED load at final_charge_cents"
          - "Cascade link 3: Customer.credit_exposure_cents recomputed; credit_status -> HOLD iff exposure >= credit_limit_cents"
      - from: PLACED
        to: CANCELLED
        trigger: "POST /v1/orders/{id}/cancel"
        actor: Customer (owner) | Dispatcher
        preconditions: []
        side_effects:
          - "billing_status UNPRICED -> VOID"
      - from: CONFIRMED
        to: CANCELLED
        trigger: "POST /v1/orders/{id}/cancel"
        actor: Customer (owner) | Dispatcher
        preconditions:
          - "No load of this order in {SCHEDULED, BATCHED, EN_ROUTE, ON_SITE, POURING} (ERR_ORDER_HAS_ACTIVE_LOADS)"
        side_effects:
          - "billing_status PRICED -> VOID (compensation: provisional pricing voided)"
          - "Customer.credit_exposure_cents recomputed; credit_status -> GOOD iff exposure < credit_limit_cents"
      - from: SCHEDULED
        to: CANCELLED
        trigger: "POST /v1/orders/{id}/cancel"
        actor: Customer (owner) | Dispatcher
        preconditions:
          - "No load of this order in {SCHEDULED, BATCHED, EN_ROUTE, ON_SITE, POURING} (ERR_ORDER_HAS_ACTIVE_LOADS)"
        side_effects:
          - "billing_status PRICED -> VOID"
          - "Customer.credit_exposure_cents recomputed; credit_status -> GOOD iff exposure < credit_limit_cents"
      - from: IN_PROGRESS
        to: CANCELLED
        trigger: "POST /v1/orders/{id}/cancel"
        actor: Customer (owner) | Dispatcher
        preconditions:
          - "No load of this order in {SCHEDULED, BATCHED, EN_ROUTE, ON_SITE, POURING} (ERR_ORDER_HAS_ACTIVE_LOADS)"
        side_effects:
          - "billing_status PRICED -> VOID"
          - "Customer.credit_exposure_cents recomputed; credit_status -> GOOD iff exposure < credit_limit_cents"
      - from: PRICED_BILLING
        to: INVOICED_BILLING
        trigger: "system (automatic when the order's Invoice transitions DRAFT -> ISSUED)"
        actor: system
        preconditions: []
        side_effects: []
        note: "billing_status dimension: PRICED -> INVOICED"
      - from: INVOICED_BILLING
        to: DISPUTED_BILLING
        trigger: "system (automatic when the order's Invoice transitions ISSUED -> DISPUTED)"
        actor: system
        preconditions: []
        side_effects: []
      - from: DISPUTED_BILLING
        to: INVOICED_BILLING
        trigger: "system (automatic when the order's Invoice is adjusted DISPUTED -> ISSUED)"
        actor: system
        preconditions: []
        side_effects: []
        note: "billing_status cycle: INVOICED -> DISPUTED -> INVOICED"
      - from: INVOICED_BILLING
        to: PAID_BILLING
        trigger: "system (automatic when the order's Invoice transitions ISSUED -> PAID)"
        actor: system
        preconditions: []
        side_effects:
          - "Customer.credit_exposure_cents recomputed (paid invoice drops out of exposure); credit_status -> GOOD iff exposure < credit_limit_cents"

  - entity: Load
    initial_state: SCHEDULED
    terminal_states: [COMPLETED, WASHED_OUT, CANCELLED]
    transitions:
      - from: SCHEDULED
        to: BATCHED
        trigger: "POST /v1/loads/{id}/batch"
        actor: BatchOperator
        preconditions:
          - "Order (Load.order_id) delivery_status IN {SCHEDULED, IN_PROGRESS}"
          - "MixDesign (Order.mix_design_id) status == ACTIVE (ERR_MIX_NOT_ACTIVE)"
          - "Truck (Load.truck_id) status == AVAILABLE (ERR_TRUCK_NOT_AVAILABLE)"
          - "w/c safety: (design batch water + extra_batch_water_gal x 8.34) / cement_lb <= max_wc_ratio (ERR_WC_RATIO_EXCEEDED)"
          - "Plant interval: [batch_time, batch_time + Plant.batch_cycle_minutes) does not intersect any other load's batch interval on the same plant with status IN {BATCHED, EN_ROUTE, ON_SITE, POURING}; half-open, adjacency allowed (ERR_PLANT_BATCH_CONFLICT)"
          - "Truck turnaround: batch_time >= max prior batch_time of this truck's non-CANCELLED loads + 90 minutes; closed interval, equality allowed (ERR_TRUCK_OVERLAP)"
        side_effects:
          - "Creates the load's BatchTicket (batch_weights_and_dosing: cement_lb, batch_water_lb, admixture_doses, total_admixture_oz)"
          - "Sets batch_time; computes initial actual_wc_ratio from batch water only"
          - "Truck.status AVAILABLE -> ON_DELIVERY"
          - "If the order's first BATCHED load: Order SCHEDULED -> IN_PROGRESS"
      - from: BATCHED
        to: EN_ROUTE
        trigger: "POST /v1/loads/{id}/depart"
        actor: Driver
        preconditions: []
        side_effects: []
      - from: EN_ROUTE
        to: ON_SITE
        trigger: "POST /v1/loads/{id}/arrive"
        actor: Driver
        preconditions: []
        side_effects:
          - "Sets arrival_time (logical clock); wait metering starts"
      - from: ON_SITE
        to: POURING
        trigger: "POST /v1/loads/{id}/start-pour"
        actor: Driver
        preconditions: []
        side_effects: []
      - from: ON_SITE
        to: COMPLETED
        trigger: "POST /v1/loads/{id}/complete"
        actor: Driver
        preconditions:
          - "discharged_qty_yd3 == qty_yd3 (full discharge; otherwise use return flow) (ERR_VOLUME_NOT_CONSERVED)"
        side_effects:
          - "Sets complete_time; on_site_minutes = floor((complete_time - arrival_time)/60s)"
          - "Runs load_final_charge FINAL variant: concrete_cents, short_load_fee_cents, wait_fee_cents, saturday_fee_cents, final_charge_cents (per-line round_half_up then sum)"
          - "Truck.status ON_DELIVERY -> AVAILABLE; last_available_at = now"
          - "Cascade link 1: Order.delivered_qty_yd3 += discharged_qty_yd3 (order_fulfillment)"
          - "Cascade link 2: if delivered_qty_yd3 >= Order.qty_yd3 then Order -> DELIVERED and Invoice DRAFT auto-created"
          - "Cascade link 3: Customer.credit_exposure_cents recomputed; credit_status -> HOLD iff exposure >= credit_limit_cents"
      - from: POURING
        to: COMPLETED
        trigger: "POST /v1/loads/{id}/complete"
        actor: Driver
        preconditions:
          - "discharged_qty_yd3 == qty_yd3 (ERR_VOLUME_NOT_CONSERVED)"
        side_effects:
          - "Sets complete_time; on_site_minutes = floor((complete_time - arrival_time)/60s)"
          - "Runs load_final_charge FINAL variant; sets the five charge fields"
          - "Truck.status ON_DELIVERY -> AVAILABLE; last_available_at = now"
          - "Cascade link 1: Order.delivered_qty_yd3 += discharged_qty_yd3"
          - "Cascade link 2: if delivered_qty_yd3 >= Order.qty_yd3 then Order -> DELIVERED and Invoice DRAFT auto-created"
          - "Cascade link 3: Customer.credit_exposure_cents recomputed; credit_status -> HOLD iff exposure >= credit_limit_cents"
      - from: BATCHED
        to: RETURNED
        trigger: "POST /v1/loads/{id}/return"
        actor: Driver
        preconditions:
          - "returned_qty_yd3 > 0"
          - "Volume conservation: discharged_qty_yd3 (input) + returned_qty_yd3 == qty_yd3 exactly (ERR_VOLUME_NOT_CONSERVED)"
        side_effects:
          - "Sets discharged_qty_yd3 from input"
          - "Creates ReturnRecord (returned_qty_yd3, disposition)"
          - "Truck.status ON_DELIVERY -> IN_WASHOUT"
      - from: EN_ROUTE
        to: RETURNED
        trigger: "POST /v1/loads/{id}/return"
        actor: Driver
        preconditions:
          - "returned_qty_yd3 > 0"
          - "Volume conservation: discharged_qty_yd3 (input) + returned_qty_yd3 == qty_yd3 exactly (ERR_VOLUME_NOT_CONSERVED)"
        side_effects:
          - "Sets discharged_qty_yd3 from input"
          - "Creates ReturnRecord"
          - "Truck.status ON_DELIVERY -> IN_WASHOUT"
      - from: ON_SITE
        to: RETURNED
        trigger: "POST /v1/loads/{id}/return"
        actor: Driver
        preconditions:
          - "returned_qty_yd3 > 0"
          - "Volume conservation: discharged_qty_yd3 (input) + returned_qty_yd3 == qty_yd3 exactly (ERR_VOLUME_NOT_CONSERVED)"
        side_effects:
          - "Sets discharged_qty_yd3 from input"
          - "Creates ReturnRecord"
          - "Truck.status ON_DELIVERY -> IN_WASHOUT"
      - from: POURING
        to: RETURNED
        trigger: "POST /v1/loads/{id}/return"
        actor: Driver
        preconditions:
          - "returned_qty_yd3 > 0"
          - "Volume conservation: discharged_qty_yd3 (input) + returned_qty_yd3 == qty_yd3 exactly (ERR_VOLUME_NOT_CONSERVED)"
        side_effects:
          - "Sets discharged_qty_yd3 from input"
          - "Creates ReturnRecord"
          - "Truck.status ON_DELIVERY -> IN_WASHOUT"
      - from: RETURNED
        to: WASHED_OUT
        trigger: "POST /v1/loads/{id}/washout"
        actor: BatchOperator
        preconditions: []
        side_effects:
          - "ReturnRecord.washout_water_gal = washout_water_gal input"
          - "Truck.status IN_WASHOUT -> AVAILABLE; last_available_at = now"
      - from: SCHEDULED
        to: CANCELLED
        trigger: "POST /v1/loads/{id}/cancel"
        actor: Dispatcher
        preconditions: []
        side_effects: []

  - entity: CylinderSet
    initial_state: CURING
    terminal_states: [CERTIFIED, FLAGGED]
    transitions:
      - from: CURING
        to: SEVEN_DAY_RECORDED
        trigger: "POST /v1/cylinder-sets/{id}/breaks with break_type=SEVEN_DAY"
        actor: QCTech
        preconditions:
          - "current logical-clock time >= cast_at + 7 days (ERR_BREAK_TOO_EARLY)"
          - "SoD: actor X-User-ID != cast_by_user_id (ERR_SOD_VIOLATION)"
        side_effects:
          - "seven_day_strength_psi = input strength_psi; seven_day_recorded_by = actor"
      - from: SEVEN_DAY_RECORDED
        to: FINAL_RECORDED
        trigger: "POST /v1/cylinder-sets/{id}/breaks with break_type=TWENTY_EIGHT_DAY"
        actor: QCTech
        preconditions:
          - "current logical-clock time >= cast_at + 28 days (ERR_BREAK_TOO_EARLY)"
          - "SoD: actor X-User-ID != cast_by_user_id (ERR_SOD_VIOLATION)"
        side_effects:
          - "final_strength_psi = input strength_psi; final_recorded_by = actor"
      - from: FINAL_RECORDED
        to: CERTIFIED
        trigger: "POST /v1/cylinder-sets/{id}/certify when strength_acceptance passes"
        actor: QCTech
        preconditions:
          - "Load (CylinderSet.load_id) status == COMPLETED (cross-entity gate; ERR_INVALID_STATE otherwise)"
          - "SoD: actor X-User-ID != cast_by_user_id AND != final_recorded_by (ERR_SOD_VIOLATION)"
          - "acceptance_passed == true under the set's acceptance_basis"
        side_effects:
          - "certified_by_user_id = actor"
      - from: FINAL_RECORDED
        to: FLAGGED
        trigger: "POST /v1/cylinder-sets/{id}/certify when strength_acceptance fails"
        actor: QCTech
        preconditions:
          - "Load (CylinderSet.load_id) status == COMPLETED (ERR_INVALID_STATE otherwise)"
          - "SoD: actor X-User-ID != cast_by_user_id AND != final_recorded_by (ERR_SOD_VIOLATION)"
          - "acceptance_passed == false under the set's acceptance_basis"
        side_effects:
          - "certified_by_user_id = actor"
          - "Load.strength_liability set by strength_acceptance variant: DESIGN_BASIS -> PLANT; AS_PLACED -> CUSTOMER iff any WaterAddition on the load has customer_authorized == true else PLANT"

  - entity: Invoice
    initial_state: DRAFT
    terminal_states: [PAID, VOID]
    transitions:
      - from: DRAFT
        to: ISSUED
        trigger: "POST /v1/invoices/{id}/issue"
        actor: PlantManager
        preconditions: []
        side_effects:
          - "issued_at = now"
          - "Order.billing_status PRICED -> INVOICED"
      - from: ISSUED
        to: DISPUTED
        trigger: "POST /v1/invoices/{id}/dispute"
        actor: Customer (owner)
        preconditions: []
        side_effects:
          - "Order.billing_status INVOICED -> DISPUTED"
      - from: DISPUTED
        to: ISSUED
        trigger: "POST /v1/invoices/{id}/adjust"
        actor: PlantManager
        preconditions:
          - "adjustment_lines non-empty (ERR_VALIDATION)"
        side_effects:
          - "Appends adjustment lines to line_items; total_cents recomputed — invariant: new total_cents == old total_cents + sum(adjustment_lines.amount_cents)"
          - "Order.billing_status DISPUTED -> INVOICED"
          - "Customer.credit_exposure_cents recomputed; credit_status -> HOLD iff exposure >= credit_limit_cents, else GOOD"
        note: "cycle ISSUED -> DISPUTED -> ISSUED"
      - from: ISSUED
        to: PAID
        trigger: "POST /v1/invoices/{id}/pay"
        actor: Customer (owner)
        preconditions:
          - "amount_cents == total_cents exactly (ERR_PAYMENT_AMOUNT_MISMATCH)"
        side_effects:
          - "Order.billing_status INVOICED -> PAID"
          - "Customer.credit_exposure_cents recomputed (paid invoice excluded); credit_status -> GOOD iff exposure < credit_limit_cents"
      - from: DRAFT
        to: VOID
        trigger: "system (automatic when the parent Order is cancelled while its invoice is still DRAFT)"
        actor: system
        preconditions: []
        side_effects: []

  - entity: Truck
    initial_state: AVAILABLE
    terminal_states: []
    transitions:
      - from: AVAILABLE
        to: ON_DELIVERY
        trigger: "system (automatic when a load assigned to this truck is batched)"
        actor: system
        preconditions: []
        side_effects: []
      - from: ON_DELIVERY
        to: AVAILABLE
        trigger: "system (automatic when the truck's load is COMPLETED)"
        actor: system
        preconditions: []
        side_effects: ["last_available_at = now"]
      - from: ON_DELIVERY
        to: IN_WASHOUT
        trigger: "system (automatic when the truck's load is RETURNED)"
        actor: system
        preconditions: []
        side_effects: []
      - from: IN_WASHOUT
        to: AVAILABLE
        trigger: "system (automatic when the returned load's washout completes)"
        actor: system
        preconditions: []
        side_effects: ["last_available_at = now"]
      - from: AVAILABLE
        to: OUT_OF_SERVICE
        trigger: "POST /v1/trucks/{id}/out-of-service"
        actor: Dispatcher
        preconditions: []
        side_effects: []
      - from: OUT_OF_SERVICE
        to: AVAILABLE
        trigger: "POST /v1/trucks/{id}/return-to-service"
        actor: Dispatcher
        preconditions: []
        side_effects: ["last_available_at = now"]

  - entity: MixDesign
    initial_state: DRAFT
    terminal_states: [RETIRED]
    transitions:
      - from: DRAFT
        to: ACTIVE
        trigger: "POST /v1/mix-designs/{id}/activate"
        actor: PlantManager
        preconditions: []
        side_effects: []
      - from: ACTIVE
        to: RETIRED
        trigger: "POST /v1/mix-designs/{id}/retire"
        actor: PlantManager
        preconditions: []
        side_effects: []

  - entity: PriceList
    initial_state: DRAFT
    terminal_states: [SUPERSEDED]
    transitions:
      - from: DRAFT
        to: ACTIVE
        trigger: "POST /v1/price-lists with activate=true (create-and-activate)"
        actor: PlantManager
        preconditions:
          - "OCC: expected_plant_version == Plant.version (ERR_STALE_VERSION)"
        side_effects:
          - "Any prior PriceList with status ACTIVE for the same (plant_id, mix_design_id) transitions ACTIVE -> SUPERSEDED"
          - "activated_at = now"
          - "Increments Plant.version by 1"
      - from: ACTIVE
        to: SUPERSEDED
        trigger: "system (automatic when a newer PriceList for the same (plant_id, mix_design_id) is activated)"
        actor: system
        preconditions: []
        side_effects: []
        note: "Already-pinned orders keep their price_list_id; supersede never re-prices a CONFIRMED order"

# =============================================================================
# 1.2.1 Concurrency Rules (OCC only)
# =============================================================================
concurrency_rules:
  - rule_id: price-list-activate-stale-plant
    parent_entity: Plant
    write_endpoint: "POST /v1/price-lists"
    occ_field: expected_plant_version
    description: |
      Activating a PriceList supersedes the currently ACTIVE list for the same
      (plant_id, mix_design_id) and bumps Plant.version. A create carrying an
      expected_plant_version that no longer equals the Plant's current version is
      rejected, because the writer's view of which list is ACTIVE is stale.
    error_id: ERR_STALE_VERSION
    http_status: 412
  - rule_id: load-schedule-stale-order
    parent_entity: Order
    write_endpoint: "POST /v1/orders/{id}/loads"
    occ_field: expected_order_version
    description: |
      Scheduling a load appends to an order's rotation and legitimately succeeds
      many times against the same CONFIRMED order; each schedule bumps
      Order.version. A schedule carrying an expected_order_version that no longer
      equals the Order's current version is rejected as stale.
    error_id: ERR_STALE_VERSION
    http_status: 412

# =============================================================================
# 1.3 Calculation Rules Table
# =============================================================================
calculations:
  - name: batch_weights_and_dosing
    trigger: "POST /v1/loads/{id}/batch (creates the BatchTicket)"
    algorithm: aggregation
    formula: |
      cement_lb   = round_half_up(cement_content_lb_per_yd3 * qty_yd3, 0)
      base_water_lb = round_half_up(design_wc_ratio * cement_lb, 0)
      extra_water_lb = round_half_up(8.34 * extra_batch_water_gal, 1)
      batch_water_lb = base_water_lb + extra_water_lb   (extra validated: batch_water_lb/cement_lb <= max_wc_ratio else ERR_WC_RATIO_EXCEEDED)
      per admixture line: dose_oz = round_half_up(dose_oz_per_cwt * cement_lb / 100, 1)
      total_admixture_oz = sum(dose_oz over lines)   # ROUND-PER-LINE THEN SUM — pinned order
      # Explicitly NOT round_half_up(sum(dose_oz_per_cwt) * cement_lb/100, 1): the two orders differ
      # (e.g. qty 6.0 with rates 1.55/2.65 -> per-line 142.2 vs sum-then-round 142.1)
    input_set: "The Load being batched and its Order's MixDesign"
    constants:
      WATER_LB_PER_GAL: 8.34
      DOSE_PRECISION_OZ: 0.1
    precision: "cement_lb and batch_water_lb to 1 lb; doses to 0.1 oz; round_half_up"

  - name: actual_wc_ratio
    trigger: "POST /v1/loads/{id}/batch (initial) and POST /v1/loads/{id}/water-additions (recompute)"
    algorithm: aggregation
    formula: |
      total_water_lb = BatchTicket.batch_water_lb + 8.34 * sum(gallons over WaterAddition of the load)
      actual_wc_ratio = round_half_up(total_water_lb / BatchTicket.cement_lb, 3)
      over_watered = actual_wc_ratio > max_wc_ratio      # strict > on the ROUNDED 3-decimal value; rounded equality is NOT over-watered
    input_set: "The load's BatchTicket plus ALL WaterAddition rows of the load (any added_at order)"
    constants:
      WATER_LB_PER_GAL: 8.34
    precision: "3 decimal places, round_half_up"

  - name: load_final_charge
    trigger: "POST /v1/loads/{id}/complete (FINAL variant); POST /v1/orders/{id}/confirm (PROVISIONAL variant, order-level)"
    algorithm: tiered_pricing
    formula: |
      # index selection (chronological): pour_index = index_points of the CementPriceIndex for
      # Order.plant_id with the greatest effective_month <= pour month; fallback =
      # escalation_base_index_points when none is published (ratio exactly 1.0)
      escalated_base_cents = round_half_up(base_price_per_yd3_cents * (pour_index / escalation_base_index_points), 0)
      concrete_cents = round_half_up(discharged_qty_yd3 * escalated_base_cents, 0)
      short_load_fee_cents = (discharged_qty_yd3 < min_load_yd3) ? short_load_fee_cents_const : 0   # strict <
      billable_wait_min = max(0, on_site_minutes - wait_free_minutes)
      wait_fee_cents = min(billable_wait_min * wait_rate_per_minute_cents, wait_fee_cap_cents)
      saturday_fee_cents = is_saturday(pour_date) ? round_half_up((concrete_cents + short_load_fee_cents) * saturday_surcharge_pct, 0) : 0
      final_charge_cents = concrete_cents + short_load_fee_cents + wait_fee_cents + saturday_fee_cents
      # PER-LINE ROUND_HALF_UP THEN SUM — pinned; surcharge excludes wait fee — pinned
    input_set: "The completed Load; Order's version-pinned PriceList (price_list_id); CementPriceIndex rows of Order.plant_id with effective_month <= pour month"
    constants:
      WATER_LB_PER_GAL: 8.34
    precision: "0 decimal places (integer cents), round_half_up per line"
    variants:
      - name: PROVISIONAL
        when: "At order confirm: order-level quote"
        difference: "qty = Order.qty_yd3 (ordered, not discharged); index = greatest effective_month <= month of confirm date; wait = 0; short_load = 0; Saturday surcharge still applies when pour_date is Saturday; result stored on Order.escalated_base_cents / provisional_total_cents"
      - name: FINAL
        when: "At load complete: per-load charge"
        difference: "qty = discharged_qty_yd3; index = greatest effective_month <= pour month; actual on_site_minutes; short-load applies when discharged < min_load_yd3; result stored on the Load's five charge fields and summed into the auto-created Invoice"

  - name: strength_acceptance
    trigger: "POST /v1/cylinder-sets/{id}/certify"
    algorithm: threshold
    formula: |
      required_strength_psi = MixDesign.design_strength_psi        # identical bar under both variants
      acceptance_passed = final_strength_psi >= required_strength_psi
      if acceptance_passed == false:
        DESIGN_BASIS: Load.strength_liability = PLANT
        AS_PLACED:    Load.strength_liability = CUSTOMER iff exists WaterAddition on the load
                      with customer_authorized == true else PLANT
    input_set: "The CylinderSet, its Load (actual_wc_ratio, WaterAddition rows), the Order's MixDesign"
    constants: {}
    precision: "integer psi"
    variants:
      - name: DESIGN_BASIS
        when: "Load.over_watered == false"
        difference: "Acceptance judged on the as-batched design basis; failure attributes strength_liability = PLANT"
      - name: AS_PLACED
        when: "Load.over_watered == true (acceptance_basis flipped by the water-addition cascade)"
        difference: "Same numeric bar, but failure attributes strength_liability = CUSTOMER when any on-site water addition was customer_authorized, else PLANT — identical break data yields a different liability outcome than DESIGN_BASIS"

  - name: credit_exposure
    trigger: "POST /v1/customers/{id}/credit-review; cascaded on Invoice auto-create, Invoice adjust, Invoice pay, Order cancel (PRICED)"
    algorithm: forward_looking
    formula: |
      exposure_cents =
        sum(provisional_total_cents over Orders of the customer with delivery_status IN {CONFIRMED, SCHEDULED, IN_PROGRESS})
        + sum(total_cents over Invoices of the customer with status IN {DRAFT, ISSUED, DISPUTED})
      # PAID and VOID invoices excluded; PLACED and CANCELLED orders excluded
      credit_status = HOLD iff exposure_cents >= credit_limit_cents else GOOD   # >= boundary: equality puts on HOLD
    input_set: "All Orders of the customer in the delivery states above; all Invoices of the customer in the statuses above"
    constants: {}
    precision: "integer cents"

  - name: order_fulfillment
    trigger: "POST /v1/loads/{id}/complete (cascade link 1)"
    algorithm: aggregation
    formula: |
      delivered_qty_yd3 = sum(discharged_qty_yd3 over Loads of the order with status == COMPLETED)
      order DELIVERED when delivered_qty_yd3 >= qty_yd3   # >= boundary: exact equality completes the order
    input_set: "Loads of the order with status == COMPLETED only (RETURNED/WASHED_OUT/CANCELLED contribute 0)"
    constants: {}
    precision: "1 decimal place"

  - name: truck_selector
    trigger: "POST /v1/orders/{id}/loads when truck_id is omitted"
    algorithm: constraint_propagation
    formula: |
      candidates = Trucks with plant_id == Order.plant_id AND status == AVAILABLE AND capacity_yd3 >= requested qty_yd3
      rank: last_available_at ASC (set at truck creation, so never null; longest-idle first)
      tie-break: created_at ASC
      empty candidate set -> ERR_NO_TRUCK_AVAILABLE
    input_set: "Trucks of the order's plant"
    constants:
      MIN_TRUCK_TURNAROUND_MINUTES: 90
    precision: "timestamp ordering"

# =============================================================================
# 1.4 Validation Rules Table (ordered by priority)
# =============================================================================
validations:
  - { priority: 1, category: auth, check: "X-User-Role and X-User-ID headers present and role recognized", error_id: ERR_UNAUTHENTICATED, http_status: 401, applies_to: "all" }
  - { priority: 2, category: auth, check: "Role permitted for the endpoint per §1.5; entity-backed ownership (Customer may act only on own orders/invoices)", error_id: ERR_FORBIDDEN, http_status: 403, applies_to: "all" }
  - { priority: 2, category: auth, check: "Customer X-User-ID must equal the customer_id of the target order/invoice", error_id: ERR_OWNERSHIP_MISMATCH, http_status: 403, applies_to: "GET /v1/orders/{id}, POST /v1/orders/{id}/cancel, GET /v1/invoices/{id}, POST /v1/invoices/{id}/dispute, POST /v1/invoices/{id}/pay" }
  - { priority: 3, category: existence, check: "Path and body referenced ids exist (plant, mix design, price list, customer, truck, order, load, cylinder set, invoice)", error_id: ERR_NOT_FOUND, http_status: 404, applies_to: "all" }
  - { priority: 3, category: existence, check: "Required request fields present and well-typed; enum values in range", error_id: ERR_VALIDATION, http_status: 400, applies_to: "all" }
  - { priority: 4, category: state, check: "OCC: expected_plant_version == Plant.version / expected_order_version == Order.version", error_id: ERR_STALE_VERSION, http_status: 412, applies_to: "POST /v1/price-lists, POST /v1/orders/{id}/loads" }
  - { priority: 4, category: state, check: "Target resource in a valid from-state for the requested transition", error_id: ERR_INVALID_STATE, http_status: 409, applies_to: "all action endpoints" }
  - { priority: 4, category: state, check: "Target resource not in a terminal state", error_id: ERR_ALREADY_TERMINAL, http_status: 409, applies_to: "all action endpoints" }
  - { priority: 5, category: business_safety, check: "Segregation of duties: break recorder != cast_by_user_id; certifier != cast_by_user_id and != final_recorded_by", error_id: ERR_SOD_VIOLATION, http_status: 403, applies_to: "POST /v1/cylinder-sets/{id}/breaks, POST /v1/cylinder-sets/{id}/certify" }
  - { priority: 5, category: business_safety, check: "Batch w/c safety: (design batch water + extra_batch_water_gal x 8.34) / cement_lb <= max_wc_ratio", error_id: ERR_WC_RATIO_EXCEEDED, http_status: 422, applies_to: "POST /v1/loads/{id}/batch" }
  - { priority: 6, category: business_referential, check: "MixDesign status == ACTIVE for confirm and batch", error_id: ERR_MIX_NOT_ACTIVE, http_status: 409, applies_to: "POST /v1/orders/{id}/confirm, POST /v1/loads/{id}/batch" }
  - { priority: 6, category: business_referential, check: "Exactly one ACTIVE PriceList for (plant_id, mix_design_id) at confirm", error_id: ERR_PRICE_LIST_MISSING, http_status: 409, applies_to: "POST /v1/orders/{id}/confirm" }
  - { priority: 6, category: business_referential, check: "Order slump within +/-1.0 in of mix design slump", error_id: ERR_SLUMP_OUT_OF_TOLERANCE, http_status: 422, applies_to: "POST /v1/orders" }
  - { priority: 6, category: business_referential, check: "Duplicate (plant_id, effective_month) cement index rejected", error_id: ERR_INDEX_MONTH_DUPLICATE, http_status: 409, applies_to: "POST /v1/cement-price-indices" }
  - { priority: 7, category: business_temporal, check: "pour_window_end strictly after pour_window_start", error_id: ERR_ORDER_WINDOW_INVALID, http_status: 422, applies_to: "POST /v1/orders" }
  - { priority: 7, category: business_temporal, check: "pour_date not before current logical-clock date", error_id: ERR_POUR_DATE_PAST, http_status: 422, applies_to: "POST /v1/orders, POST /v1/orders/{id}/confirm" }
  - { priority: 7, category: business_temporal, check: "7-day break at >= cast_at + 7d; 28-day break at >= cast_at + 28d", error_id: ERR_BREAK_TOO_EARLY, http_status: 422, applies_to: "POST /v1/cylinder-sets/{id}/breaks" }
  - { priority: 7, category: business_temporal, check: "Plant batch interval [batch_time, batch_time + batch_cycle_minutes) free on the plant (half-open; adjacency allowed)", error_id: ERR_PLANT_BATCH_CONFLICT, http_status: 409, applies_to: "POST /v1/loads/{id}/batch" }
  - { priority: 7, category: business_temporal, check: "Truck turnaround: batch_time >= truck's latest prior batch_time + 90 min (closed; equality allowed)", error_id: ERR_TRUCK_OVERLAP, http_status: 409, applies_to: "POST /v1/loads/{id}/batch" }
  - { priority: 8, category: business_constraint, check: "Truck status == AVAILABLE for scheduling (manual truck_id) and batching", error_id: ERR_TRUCK_NOT_AVAILABLE, http_status: 409, applies_to: "POST /v1/orders/{id}/loads, POST /v1/loads/{id}/batch" }
  - { priority: 8, category: business_constraint, check: "Selector candidate set non-empty when truck_id omitted", error_id: ERR_NO_TRUCK_AVAILABLE, http_status: 409, applies_to: "POST /v1/orders/{id}/loads" }
  - { priority: 8, category: business_constraint, check: "Load qty_yd3 <= truck capacity_yd3", error_id: ERR_TRUCK_CAPACITY_EXCEEDED, http_status: 422, applies_to: "POST /v1/orders/{id}/loads" }
  - { priority: 8, category: business_constraint, check: "Load qty_yd3 >= min_load_yd3 of the pinned PriceList unless customer.short_load_allowed", error_id: ERR_SHORT_LOAD_FORBIDDEN, http_status: 422, applies_to: "POST /v1/orders/{id}/loads" }
  - { priority: 8, category: business_constraint, check: "Volume conservation: discharged + returned == batched qty exactly (return); discharged == batched qty (complete)", error_id: ERR_VOLUME_NOT_CONSERVED, http_status: 422, applies_to: "POST /v1/loads/{id}/return, POST /v1/loads/{id}/complete" }
  - { priority: 8, category: business_constraint, check: "Order cancel blocked while any load is in {SCHEDULED, BATCHED, EN_ROUTE, ON_SITE, POURING}", error_id: ERR_ORDER_HAS_ACTIVE_LOADS, http_status: 409, applies_to: "POST /v1/orders/{id}/cancel" }
  - { priority: 9, category: business_fiscal, check: "Customer credit_status != HOLD at order confirm", error_id: ERR_CREDIT_HOLD, http_status: 402, applies_to: "POST /v1/orders/{id}/confirm" }
  - { priority: 9, category: business_fiscal, check: "Payment amount equals invoice total exactly", error_id: ERR_PAYMENT_AMOUNT_MISMATCH, http_status: 422, applies_to: "POST /v1/invoices/{id}/pay" }

# =============================================================================
# 1.5 API Endpoint Table
# =============================================================================
endpoints:
  # --- Plants ---
  - { method: POST, path: "/v1/plants", description: "Create a plant", roles: [PlantManager], code: 201, input: [name, batch_cycle_minutes, daily_capacity_yd3], output: Plant, side_effects: [] }
  - { method: GET, path: "/v1/plants/{id}", description: "Get a plant", roles: [PlantManager, Dispatcher, BatchOperator, Driver, QCTech, Customer], code: 200, input: [], output: Plant, side_effects: [] }

  # --- Mix designs ---
  - { method: POST, path: "/v1/mix-designs", description: "Create a mix design (DRAFT)", roles: [PlantManager], code: 201, input: [plant_id, code, name, design_strength_psi, slump_in, cement_content_lb_per_yd3, design_wc_ratio, max_wc_ratio, admixtures], output: MixDesign, side_effects: [] }
  - { method: GET, path: "/v1/mix-designs/{id}", description: "Get a mix design", roles: [PlantManager, Dispatcher, BatchOperator, Driver, QCTech, Customer], code: 200, input: [], output: MixDesign, side_effects: [] }
  - { method: GET, path: "/v1/mix-designs", description: "List mix designs", roles: [PlantManager, Dispatcher, BatchOperator, Driver, QCTech, Customer], code: 200, input: ["plant_id?", "status?", "limit?", "offset?"], output: "MixDesign[]", side_effects: [] }
  - { method: POST, path: "/v1/mix-designs/{id}/activate", description: "Activate a mix design", roles: [PlantManager], code: 200, input: [], output: MixDesign, side_effects: ["MixDesign DRAFT -> ACTIVE"] }
  - { method: POST, path: "/v1/mix-designs/{id}/retire", description: "Retire a mix design", roles: [PlantManager], code: 200, input: [], output: MixDesign, side_effects: ["MixDesign ACTIVE -> RETIRED"] }

  # --- Price lists (versioned; create-and-activate supersedes) ---
  - { method: POST, path: "/v1/price-lists", description: "Create a price list; activate=true activates it and supersedes the prior ACTIVE list for (plant_id, mix_design_id)", roles: [PlantManager], code: 201, input: [plant_id, mix_design_id, expected_plant_version, base_price_per_yd3_cents, escalation_base_index_points, min_load_yd3, short_load_fee_cents, wait_free_minutes, wait_rate_per_minute_cents, wait_fee_cap_cents, saturday_surcharge_pct, activate], output: PriceList, side_effects: ["increments Plant.version by 1", "prior ACTIVE PriceList for (plant_id, mix_design_id) -> SUPERSEDED when activate=true"] }
  - { method: GET, path: "/v1/price-lists/{id}", description: "Get a price list", roles: [PlantManager, Dispatcher, BatchOperator, Driver, QCTech, Customer], code: 200, input: [], output: PriceList, side_effects: [] }
  - { method: GET, path: "/v1/price-lists", description: "List price lists", roles: [PlantManager, Dispatcher, BatchOperator, Driver, QCTech, Customer], code: 200, input: ["plant_id?", "mix_design_id?", "status?", "limit?", "offset?"], output: "PriceList[]", side_effects: [] }

  # --- Cement price indices (append-only) ---
  - { method: POST, path: "/v1/cement-price-indices", description: "Publish a monthly cement price index", roles: [PlantManager], code: 201, input: [plant_id, effective_month, index_points], output: CementPriceIndex, side_effects: [] }
  - { method: GET, path: "/v1/cement-price-indices/{id}", description: "Get an index row", roles: [PlantManager, Dispatcher, BatchOperator, Driver, QCTech, Customer], code: 200, input: [], output: CementPriceIndex, side_effects: [] }
  - { method: GET, path: "/v1/cement-price-indices", description: "List index rows", roles: [PlantManager, Dispatcher, BatchOperator, Driver, QCTech, Customer], code: 200, input: ["plant_id?", "effective_month?", "limit?", "offset?"], output: "CementPriceIndex[]", side_effects: [] }

  # --- Customers ---
  - { method: POST, path: "/v1/customers", description: "Create a customer (credit GOOD, exposure 0)", roles: [PlantManager], code: 201, input: [name, credit_limit_cents, "short_load_allowed?"], output: Customer, side_effects: [] }
  - { method: GET, path: "/v1/customers/{id}", description: "Get a customer", roles: [PlantManager, Dispatcher, BatchOperator, Driver, QCTech, Customer], code: 200, input: [], output: Customer, side_effects: [] }
  - { method: POST, path: "/v1/customers/{id}/credit-review", description: "Recompute credit_exposure and credit_status", roles: [PlantManager], code: 200, input: [], output: Customer, side_effects: ["Runs credit_exposure; credit_status -> HOLD iff exposure >= credit_limit_cents else GOOD"] }

  # --- Trucks ---
  - { method: POST, path: "/v1/trucks", description: "Create a truck (AVAILABLE)", roles: [Dispatcher], code: 201, input: [plant_id, fleet_number, capacity_yd3], output: Truck, side_effects: ["last_available_at = now"] }
  - { method: GET, path: "/v1/trucks/{id}", description: "Get a truck", roles: [PlantManager, Dispatcher, BatchOperator, Driver, QCTech, Customer], code: 200, input: [], output: Truck, side_effects: [] }
  - { method: GET, path: "/v1/trucks", description: "List trucks", roles: [PlantManager, Dispatcher, BatchOperator, Driver, QCTech, Customer], code: 200, input: ["plant_id?", "status?", "limit?", "offset?"], output: "Truck[]", side_effects: [] }
  - { method: POST, path: "/v1/trucks/{id}/out-of-service", description: "Take truck out of service", roles: [Dispatcher], code: 200, input: [], output: Truck, side_effects: ["Truck AVAILABLE -> OUT_OF_SERVICE"] }
  - { method: POST, path: "/v1/trucks/{id}/return-to-service", description: "Return truck to service", roles: [Dispatcher], code: 200, input: [], output: Truck, side_effects: ["Truck OUT_OF_SERVICE -> AVAILABLE; last_available_at = now"] }

  # --- Orders ---
  - { method: POST, path: "/v1/orders", description: "Place an order; customer_id taken from X-User-ID", roles: [Customer], code: 201, input: [plant_id, mix_design_id, qty_yd3, pour_date, pour_window_start, pour_window_end, slump_in], output: Order, side_effects: [] }
  - { method: GET, path: "/v1/orders/{id}", description: "Get an order", roles: [PlantManager, Dispatcher, BatchOperator, Driver, QCTech, Customer], code: 200, input: [], output: Order, side_effects: [] }
  - { method: GET, path: "/v1/orders", description: "List orders", roles: [PlantManager, Dispatcher, BatchOperator, Driver, QCTech, Customer], code: 200, input: ["customer_id?", "plant_id?", "mix_design_id?", "price_list_id?", "delivery_status?", "billing_status?", "limit?", "offset?"], output: "Order[]", side_effects: [] }
  - { method: POST, path: "/v1/orders/{id}/confirm", description: "Confirm order: pins ACTIVE price list, computes provisional quote", roles: [Dispatcher], code: 200, input: [], output: Order, side_effects: ["Order PLACED -> CONFIRMED; billing UNPRICED -> PRICED; pins price_list_id; runs provisional_quote"] }
  - { method: POST, path: "/v1/orders/{id}/cancel", description: "Cancel an order (blocked with active loads)", roles: [Customer, Dispatcher], code: 200, input: [], output: Order, side_effects: ["Order -> CANCELLED; billing -> VOID; credit exposure recomputed"] }

  # --- Loads ---
  - { method: POST, path: "/v1/orders/{id}/loads", description: "Schedule a load on a CONFIRMED/SCHEDULED/IN_PROGRESS order; truck auto-selected when truck_id omitted", roles: [Dispatcher], code: 201, input: [qty_yd3, expected_order_version, "truck_id?"], output: Load, side_effects: ["increments Order.version by 1", "first load: Order CONFIRMED -> SCHEDULED", "truck_selector when truck_id omitted"] }
  - { method: GET, path: "/v1/loads/{id}", description: "Get a load", roles: [PlantManager, Dispatcher, BatchOperator, Driver, QCTech, Customer], code: 200, input: [], output: Load, side_effects: [] }
  - { method: GET, path: "/v1/loads", description: "List loads", roles: [PlantManager, Dispatcher, BatchOperator, Driver, QCTech, Customer], code: 200, input: ["order_id?", "truck_id?", "plant_id?", "status?", "limit?", "offset?"], output: "Load[]", side_effects: [] }
  - { method: POST, path: "/v1/loads/{id}/batch", description: "Batch the load; creates the BatchTicket", roles: [BatchOperator], code: 200, input: ["batch_time?", "extra_batch_water_gal?"], output: Load, side_effects: ["Load SCHEDULED -> BATCHED; creates BatchTicket (batch_weights_and_dosing); Truck AVAILABLE -> ON_DELIVERY; first batched load: Order SCHEDULED -> IN_PROGRESS"] }
  - { method: POST, path: "/v1/loads/{id}/depart", description: "Truck departs the plant", roles: [Driver], code: 200, input: [], output: Load, side_effects: ["Load BATCHED -> EN_ROUTE"] }
  - { method: POST, path: "/v1/loads/{id}/arrive", description: "Truck arrives on site; starts wait metering", roles: [Driver], code: 200, input: [], output: Load, side_effects: ["Load EN_ROUTE -> ON_SITE; sets arrival_time"] }
  - { method: POST, path: "/v1/loads/{id}/start-pour", description: "Begin discharge", roles: [Driver], code: 200, input: [], output: Load, side_effects: ["Load ON_SITE -> POURING"] }
  - { method: POST, path: "/v1/loads/{id}/complete", description: "Complete discharge; final charge; fulfillment cascade", roles: [Driver], code: 200, input: [discharged_qty_yd3], output: Load, side_effects: ["Load -> COMPLETED; runs load_final_charge FINAL; Truck -> AVAILABLE; order_fulfillment cascade to Order, Invoice auto-create, Customer exposure"] }
  - { method: POST, path: "/v1/loads/{id}/cancel", description: "Cancel a SCHEDULED load", roles: [Dispatcher], code: 200, input: [], output: Load, side_effects: ["Load SCHEDULED -> CANCELLED"] }
  - { method: POST, path: "/v1/loads/{id}/return", description: "Return concrete to the plant; enforces volume conservation", roles: [Driver], code: 200, input: [discharged_qty_yd3, returned_qty_yd3, disposition], output: Load, side_effects: ["Load -> RETURNED; creates ReturnRecord; Truck ON_DELIVERY -> IN_WASHOUT"] }
  - { method: POST, path: "/v1/loads/{id}/washout", description: "Record washout of a returned load", roles: [BatchOperator], code: 200, input: [washout_water_gal], output: Load, side_effects: ["Load RETURNED -> WASHED_OUT; ReturnRecord.washout_water_gal set; Truck IN_WASHOUT -> AVAILABLE"] }

  # --- Water additions ---
  - { method: POST, path: "/v1/loads/{id}/water-additions", description: "Record water added on site (load must be ON_SITE or POURING, else ERR_INVALID_STATE); recomputes actual w/c and strength liability cascade", roles: [Driver], code: 201, input: [gallons, customer_authorized], output: WaterAddition, side_effects: ["actual_wc_ratio recomputed; over_watered flip -> strength_liability set (CUSTOMER iff any addition customer_authorized else PLANT) and CylinderSet.acceptance_basis DESIGN_BASIS -> AS_PLACED cascade on non-terminal sets"] }
  - { method: GET, path: "/v1/loads/{id}/water-additions", description: "List water additions of a load", roles: [PlantManager, Dispatcher, BatchOperator, Driver, QCTech, Customer], code: 200, input: ["limit?", "offset?"], output: "WaterAddition[]", side_effects: [] }

  # --- Batch tickets ---
  - { method: GET, path: "/v1/loads/{id}/batch-ticket", description: "Get the batch ticket of a load (array of 0-1)", roles: [PlantManager, Dispatcher, BatchOperator, Driver, QCTech, Customer], code: 200, input: [], output: "BatchTicket[]", side_effects: [] }

  # --- Cylinder sets ---
  - { method: POST, path: "/v1/loads/{id}/cylinder-sets", description: "Cast a QC cylinder set from a load (load must be ON_SITE, POURING or COMPLETED)", roles: [QCTech], code: 201, input: [num_cylinders], output: CylinderSet, side_effects: ["CylinderSet created in CURING; cast_by_user_id = X-User-ID; required_strength_psi = mix design_strength_psi"] }
  - { method: GET, path: "/v1/cylinder-sets/{id}", description: "Get a cylinder set", roles: [PlantManager, Dispatcher, BatchOperator, Driver, QCTech, Customer], code: 200, input: [], output: CylinderSet, side_effects: [] }
  - { method: GET, path: "/v1/loads/{id}/cylinder-sets", description: "List cylinder sets of a load", roles: [PlantManager, Dispatcher, BatchOperator, Driver, QCTech, Customer], code: 200, input: ["limit?", "offset?"], output: "CylinderSet[]", side_effects: [] }
  - { method: POST, path: "/v1/cylinder-sets/{id}/breaks", description: "Record a 7-day or 28-day break result (SoD: not the caster)", roles: [QCTech], code: 200, input: [break_type, strength_psi], output: CylinderSet, side_effects: ["CURING -> SEVEN_DAY_RECORDED or SEVEN_DAY_RECORDED -> FINAL_RECORDED"] }
  - { method: POST, path: "/v1/cylinder-sets/{id}/certify", description: "Certify the set: runs strength_acceptance; pass -> CERTIFIED, fail -> FLAGGED (SoD: not caster, not 28d recorder)", roles: [QCTech], code: 200, input: [], output: CylinderSet, side_effects: ["FINAL_RECORDED -> CERTIFIED | FLAGGED; on fail sets Load.strength_liability per acceptance variant"] }

  # --- Return records ---
  - { method: GET, path: "/v1/loads/{id}/return-record", description: "Get the return record of a load (array of 0-1)", roles: [PlantManager, Dispatcher, BatchOperator, Driver, QCTech, Customer], code: 200, input: [], output: "ReturnRecord[]", side_effects: [] }

  # --- Invoices ---
  - { method: GET, path: "/v1/invoices/{id}", description: "Get an invoice", roles: [PlantManager, Dispatcher, BatchOperator, Driver, QCTech, Customer], code: 200, input: [], output: Invoice, side_effects: [] }
  - { method: GET, path: "/v1/invoices", description: "List invoices", roles: [PlantManager, Dispatcher, BatchOperator, Driver, QCTech, Customer], code: 200, input: ["order_id?", "customer_id?", "status?", "limit?", "offset?"], output: "Invoice[]", side_effects: [] }
  - { method: POST, path: "/v1/invoices/{id}/issue", description: "Issue a DRAFT invoice", roles: [PlantManager], code: 200, input: [], output: Invoice, side_effects: ["Invoice DRAFT -> ISSUED; Order.billing_status PRICED -> INVOICED"] }
  - { method: POST, path: "/v1/invoices/{id}/dispute", description: "Customer disputes an issued invoice", roles: [Customer], code: 200, input: ["reason?"], output: Invoice, side_effects: ["Invoice ISSUED -> DISPUTED; Order.billing_status INVOICED -> DISPUTED"] }
  - { method: POST, path: "/v1/invoices/{id}/adjust", description: "Adjust a disputed invoice with compensating lines; returns it to ISSUED", roles: [PlantManager], code: 200, input: [adjustment_lines], output: Invoice, side_effects: ["Invoice DISPUTED -> ISSUED; total_cents invariant = old total + sum(adjustments); Order.billing_status DISPUTED -> INVOICED; exposure recomputed"] }
  - { method: POST, path: "/v1/invoices/{id}/pay", description: "Pay an issued invoice; amount must equal total exactly", roles: [Customer], code: 200, input: [amount_cents], output: Invoice, side_effects: ["Invoice ISSUED -> PAID; Order.billing_status INVOICED -> PAID; exposure recomputed, HOLD may lift"] }

  # --- Test-driving clock ---
  - method: POST
    path: "/v1/_clock/set_current_utc"
    description: "Set the server's logical clock. Default before any call is exactly 2026-08-01T00:00:00Z; the clock never falls back to wall-clock time. All timestamps, deadlines, break ages, and index-month selections read this clock."
    roles: [PlantManager]
    code: 200
    input: [to_iso8601]
    output: { current_utc: string }
    side_effects: ["Sets logical clock used by all state machines and calculations"]

# =============================================================================
# 1.6 Error Code Catalog
# =============================================================================
errors:
  - { id: ERR_UNAUTHENTICATED, http: 401, condition: "Missing or unrecognized X-User-Role / X-User-ID" }
  - { id: ERR_FORBIDDEN, http: 403, condition: "Role not permitted for the endpoint" }
  - { id: ERR_OWNERSHIP_MISMATCH, http: 403, condition: "Customer X-User-ID does not own the target order/invoice" }
  - { id: ERR_VALIDATION, http: 400, condition: "Missing required field, bad type, out-of-range enum, or uniqueness violation (e.g. duplicate mix code per plant)" }
  - { id: ERR_NOT_FOUND, http: 404, condition: "Referenced resource id does not exist" }
  - { id: ERR_STALE_VERSION, http: 412, condition: "expected_*_version no longer equals the parent entity's version" }
  - { id: ERR_INVALID_STATE, http: 409, condition: "Transition not allowed from the resource's current state" }
  - { id: ERR_ALREADY_TERMINAL, http: 409, condition: "Resource is in a terminal state; no further transitions" }
  - { id: ERR_SOD_VIOLATION, http: 403, condition: "Segregation of duties: same user attempted two QC steps that must be distinct people" }
  - { id: ERR_WC_RATIO_EXCEEDED, http: 422, condition: "Batch water plus requested extra would push w/c above max_wc_ratio" }
  - { id: ERR_MIX_NOT_ACTIVE, http: 409, condition: "Mix design not ACTIVE at confirm or batch" }
  - { id: ERR_PRICE_LIST_MISSING, http: 409, condition: "No exactly-one ACTIVE price list for (plant_id, mix_design_id) at confirm" }
  - { id: ERR_SLUMP_OUT_OF_TOLERANCE, http: 422, condition: "Order slump outside +/-1.0 in of the mix design slump" }
  - { id: ERR_ORDER_WINDOW_INVALID, http: 422, condition: "pour_window_end not strictly after pour_window_start" }
  - { id: ERR_POUR_DATE_PAST, http: 422, condition: "pour_date before the current logical-clock date" }
  - { id: ERR_BREAK_TOO_EARLY, http: 422, condition: "Break recorded before cast_at + 7d / + 28d" }
  - { id: ERR_PLANT_BATCH_CONFLICT, http: 409, condition: "Batch interval overlaps another in-flight batch interval on the same plant (half-open; adjacency allowed)" }
  - { id: ERR_TRUCK_OVERLAP, http: 409, condition: "Batch time before the truck's latest prior batch_time + 90 minutes (closed interval; equality allowed)" }
  - { id: ERR_TRUCK_NOT_AVAILABLE, http: 409, condition: "Named truck not AVAILABLE, or truck not AVAILABLE at batch" }
  - { id: ERR_NO_TRUCK_AVAILABLE, http: 409, condition: "Selector found zero eligible trucks (empty candidate set)" }
  - { id: ERR_TRUCK_CAPACITY_EXCEEDED, http: 422, condition: "Load qty exceeds the truck's capacity_yd3" }
  - { id: ERR_SHORT_LOAD_FORBIDDEN, http: 422, condition: "Load below min_load_yd3 while customer.short_load_allowed is false" }
  - { id: ERR_VOLUME_NOT_CONSERVED, http: 422, condition: "discharged + returned != batched qty (return), or discharged != batched qty (complete)" }
  - { id: ERR_INDEX_MONTH_DUPLICATE, http: 409, condition: "A cement price index already exists for (plant_id, effective_month)" }
  - { id: ERR_ORDER_HAS_ACTIVE_LOADS, http: 409, condition: "Cancel blocked: order has loads in SCHEDULED..POURING" }
  - { id: ERR_CREDIT_HOLD, http: 402, condition: "Customer on credit HOLD at order confirm" }
  - { id: ERR_PAYMENT_AMOUNT_MISMATCH, http: 422, condition: "Payment amount_cents != invoice total_cents" }

# =============================================================================
# 1.7 RBAC Matrix
# =============================================================================
roles:
  - name: Customer
    description: "Ready-mix customer placing orders and paying invoices"
    identity: "entity_backed:Customer"
    exclusive_operations: ["POST /v1/orders", "POST /v1/invoices/{id}/dispute", "POST /v1/invoices/{id}/pay"]
    shared_operations: ["POST /v1/orders/{id}/cancel (own orders only)", "GET endpoints (own orders/invoices; shared catalog resources)"]
  - name: Dispatcher
    description: "Plant dispatcher confirming orders and running truck rotation"
    identity: opaque
    exclusive_operations: ["POST /v1/orders/{id}/confirm", "POST /v1/orders/{id}/loads", "POST /v1/loads/{id}/cancel", "POST /v1/trucks", "POST /v1/trucks/{id}/out-of-service", "POST /v1/trucks/{id}/return-to-service"]
    shared_operations: ["POST /v1/orders/{id}/cancel", "GET endpoints"]
  - name: BatchOperator
    description: "Batch-plant operator running the mixer and washout"
    identity: opaque
    exclusive_operations: ["POST /v1/loads/{id}/batch", "POST /v1/loads/{id}/washout"]
    shared_operations: ["GET endpoints"]
  - name: Driver
    description: "Mixer-truck driver recording delivery and on-site events"
    identity: opaque
    exclusive_operations: ["POST /v1/loads/{id}/depart", "POST /v1/loads/{id}/arrive", "POST /v1/loads/{id}/start-pour", "POST /v1/loads/{id}/complete", "POST /v1/loads/{id}/return", "POST /v1/loads/{id}/water-additions"]
    shared_operations: ["GET endpoints"]
  - name: QCTech
    description: "Quality-control technician casting cylinders and recording breaks; segregation of duties enforced on cast/break/certify"
    identity: opaque
    exclusive_operations: ["POST /v1/loads/{id}/cylinder-sets", "POST /v1/cylinder-sets/{id}/breaks", "POST /v1/cylinder-sets/{id}/certify"]
    shared_operations: ["GET endpoints"]
  - name: PlantManager
    description: "Plant manager owning catalog, pricing, indices, credit, billing, and the test clock"
    identity: opaque
    exclusive_operations: ["POST /v1/plants", "POST /v1/mix-designs", "POST /v1/mix-designs/{id}/activate", "POST /v1/mix-designs/{id}/retire", "POST /v1/price-lists", "POST /v1/cement-price-indices", "POST /v1/customers", "POST /v1/customers/{id}/credit-review", "POST /v1/invoices/{id}/issue", "POST /v1/invoices/{id}/adjust", "POST /v1/_clock/set_current_utc"]
    shared_operations: ["GET endpoints"]
