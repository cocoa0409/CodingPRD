            - call: "POST /custody/valuations/${pv23}/adjudicate"
              payload: { outcome: "ACCEPT" }
              as: CourtOfficial
              as_user_id: "co-reyes"
            - call: "POST /custody/assets/${pa23}/decide-retention"
              payload: { decision: "SELL" }
              as: AssetManager
              as_user_id: "am-priya"
            - call: "POST /custody/assets/${pa23}/authorize-sale"
              payload: {}
