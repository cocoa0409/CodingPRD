            - { call: "POST /comp/physician-agreements", payload: { physician_id: "${a2}", plan_id: "${plan}", base_salary_cents: 12000000, period_draw_cents: 500000, effective_date: "2026-01-01" }, as: CompAnalyst, as_user_id: an_1, captures: { agr_a2: $.data.id } }
