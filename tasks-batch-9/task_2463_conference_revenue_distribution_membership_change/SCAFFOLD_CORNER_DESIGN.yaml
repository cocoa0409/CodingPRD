      - name: corner_reserve_withdrawal_exceeding_balance_rejected
        claim_type: Violation → Error
        grounds:
          - validations[priority 70]
          - errors.ERR_RESERVE_INSUFFICIENT
          - calculations.reserve_posture_derivation
        distinguishing_aspect: |
          The withdrawal guard is exact rather than approximate: one cent over
          the 12000000 balance is refused 422 with the balance and version
