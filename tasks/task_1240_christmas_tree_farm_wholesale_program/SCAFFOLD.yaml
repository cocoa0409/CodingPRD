# =============================================================================
# Task 1240 — Christmas Tree Farm & Wholesale Program (Oregon grower)
# Seed tables: single source of truth for PRD, tests, and implementation.
# =============================================================================

scenario: |
  generate task hard than expert level! 1240. Christmas Tree Farm & Wholesale
  Program (Oregon Christmas tree grower): planting rotation & inventory by
  height class, pre-season order book & allocation, harvest crew scheduling &
  baling, wholesale load building & shipping window, retail lot consignment &
  unsold return, choose-and-cut retail operation & tagging, shrink/cull &
  replanting, seasonal labor & compressed revenue window

domain_name: christmas-tree-farm-wholesale
api_prefix: /api

# =============================================================================
# §0 Complexity Profile
# =============================================================================
complexity_profile:
  primary_archetype: quota_allocation        # finite per-height-class standing inventory reserved / cut / loaded / released
  secondary_archetype: posture_driven_gating # Season.posture gates every child workflow (compressed revenue window)
  complexity_layers:
    - optimistic_concurrency                 # OCC on CropLot.version (survey post) and WholesaleOrder.version (allocate)
    - cascading_side_effects                 # survey re-baseline -> over-reservation sweep -> order regression; run-ops backfill
    - dual_variant_calculation               # book-vs-survey stock; provisional-vs-final consignment settlement
    - ops_run_checkpoint                     # POST /seasons/{id}/run-ops: tag expiry, DRAFT-order expiry, waitlist backfill
  entity_topology: flat                      # peer resources under /api, FK-linked; reverse reachability via filtered lists + sub-resources
  state_machine_shape: cyclic                # Block rotation cycle, Order SUBMITTED<->ALLOCATED regression, Consignment SETTLING<->DISPUTED
  relationship_patterns:
    - one_to_many                            # CropLot -> StandBucket, Order -> Allocation
    - cross_aggregate                        # Allocation ties Order <-> StandBucket; HarvestTicket lines hit allocations across blocks
  role_model: segregation_of_duties          # ReplantPlan proposer != approver; entity-backed ownership for buyers and crews
  consistency_model: immediate               # all side effects atomic within the triggering request

# =============================================================================
# §1.1 Entity-Relationship Table
# common_fields: true  =>  id (server UUID, no prefix), created_at, updated_at,
#                          version (int, starts 1, +1 on every mutation)
# =============================================================================
entities:
  - name: Season
    parent: null
    common_fields: true
    fields:
      - { name: year, type: integer, source: input, description: "Operating year label (e.g. 2026)" }
      - { name: booking_open_at, type: datetime, source: input, description: "Order book opens at this instant (inclusive)" }
      - { name: booking_close_at, type: datetime, source: input, description: "Order book closes; DRAFT orders expire after this instant" }
      - { name: harvest_window_start, type: string, source: input, description: "First legal harvest work_date, ISO date YYYY-MM-DD (inclusive)" }
      - { name: harvest_window_end, type: string, source: input, description: "Last legal harvest work_date, ISO date YYYY-MM-DD (inclusive)" }
      - { name: shipping_window_start, type: datetime, source: input, description: "Earliest ship instant (inclusive) and lower bound for load pickup windows" }
      - { name: shipping_window_end, type: datetime, source: input, description: "Latest ship instant (INCLUSIVE boundary) and upper bound for load pickup windows" }
      - { name: posture, type: enum, source: system, default: PLANNING, description: "PLANNING | BOOKING | HARVEST | SHIPPING | SETTLEMENT | CLOSED — gates child operations", constraints: "forward-only, one step per advance-posture call" }
      - { name: ops_run_index, type: integer, source: system, default: 0, description: "Monotone checkpoint counter, +1 per run-ops" }

  - name: Block
    parent: null
    common_fields: true
    fields:
      - { name: season_id, type: string, source: input, description: "FK -> Season.id; owning season" }
      - { name: block_code, type: string, source: input, description: "Grower block label, unique within season", constraints: "unique per season_id" }
      - { name: acreage, type: number, source: input, description: "Planted acres" }
      - { name: ucut_designated, type: boolean, source: input, default: false, description: "True if block is open to choose-and-cut retail" }
      - { name: rotation_state, type: enum, source: system, default: RESTING, description: "RESTING | PLANTED | GROWING | HARVESTABLE | HARVESTED (cyclic, see state machine)" }

  - name: CropLot
    parent: null
    common_fields: true
    fields:
      - { name: block_id, type: string, source: input, description: "FK -> Block.id; block hosting this planting cohort" }
      - { name: species, type: enum, source: input, description: "NOBLE_FIR | DOUGLAS_FIR | GRAND_FIR | NORDMANN_FIR" }
      - { name: planted_year, type: integer, source: input, description: "Year cohort was planted; older cohorts allocate first" }
      - { name: status, type: enum, source: system, default: ACTIVE, description: "ACTIVE | DEPLETED (auto when every bucket fully consumed)" }

  - name: StandBucket
    parent: CropLot
    common_fields: true
    fields:
      - { name: crop_lot_id, type: string, source: system, description: "FK -> CropLot.id; owning lot" }
      - { name: height_class, type: enum, source: system, description: "H_4_5 | H_5_6 | H_6_7 | H_7_8 | H_8_9 | H_9_PLUS — one bucket per class per lot" }
      - { name: baseline_count, type: integer, source: system, description: "Epoch baseline: initial planting count, reset to surveyed count on survey post" }
      - { name: standing_count, type: integer, source: system, description: "Live trees currently in field = baseline - epoch consumption deltas" }
      - { name: reserved_count, type: integer, source: system, description: "Trees promised by RESERVED allocations (uncut portion)" }
      - { name: tagged_active_count, type: integer, source: system, description: "Trees claimed by ACTIVE u-cut tags" }
      - { name: cut_cumulative, type: integer, source: system, default: 0, description: "Epoch counter: trees cut by posted harvest tickets" }
      - { name: culled_cumulative, type: integer, source: system, default: 0, description: "Epoch counter: trees removed by cull records" }
      - { name: ucut_sold_cumulative, type: integer, source: system, default: 0, description: "Epoch counter: trees redeemed via u-cut tags" }
      - { name: consigned_cumulative, type: integer, source: system, default: 0, description: "Epoch counter: trees delivered on consignment" }
      - { name: available_count, type: integer, source: computed, description: "= standing_count - reserved_count; allocation/consignment/tag/cull draw from this" }
      - { name: last_shrink_delta, type: integer, source: system, description: "surveyed - book stock recorded at last survey post; null before first post", constraints: "nullable" }

  - name: InventorySurvey
    parent: null
    common_fields: true
    fields:
      - { name: crop_lot_id, type: string, source: input, description: "FK -> CropLot.id; lot being counted" }
      - { name: surveyed_counts, type: object, source: input, description: "Physical count per height class: object with all six H_* keys, integer >= 0 each" }
      - { name: status, type: enum, source: system, default: DRAFT, description: "DRAFT | POSTED | SUPERSEDED" }
      - { name: posted_at, type: datetime, source: system, description: "Logical-clock instant of posting; null until POSTED", constraints: "nullable" }

  - name: BuyerAccount
    parent: null
    common_fields: true
    fields:
      - { name: name, type: string, source: input, description: "Wholesale buyer business name" }
      - { name: credit_limit_cents, type: integer, source: input, description: "Maximum open-order exposure allowed", constraints: ">= 0" }
      - { name: standing, type: enum, source: system, default: GOOD_STANDING, description: "GOOD_STANDING | CREDIT_HOLD | CLOSED" }
      - { name: exposure_cents, type: integer, source: computed, default: 0, description: "Sum of invoice_total_cents over this buyer's orders in SUBMITTED or ALLOCATED" }

  - name: WholesaleOrder
    parent: null
    common_fields: true
    fields:
      - { name: season_id, type: string, source: input, description: "FK -> Season.id; order book season" }
      - { name: buyer_account_id, type: string, source: input, description: "FK -> BuyerAccount.id; ordering buyer (must equal X-User-ID for WholesaleBuyer role)" }
      - { name: species, type: enum, source: input, description: "NOBLE_FIR | DOUGLAS_FIR | GRAND_FIR | NORDMANN_FIR" }
      - { name: height_class, type: enum, source: input, description: "H_4_5 | H_5_6 | H_6_7 | H_7_8 | H_8_9 | H_9_PLUS" }
      - { name: quantity, type: integer, source: input, description: "Trees ordered", constraints: ">= 1" }
      - { name: unit_price_cents, type: integer, source: input, description: "Agreed per-tree price", constraints: ">= 0" }
      - { name: allocated_qty, type: integer, source: system, default: 0, description: "Sum of quantity over non-RELEASED allocations" }
      - { name: invoice_subtotal_cents, type: integer, source: computed, description: "round_half_up(quantity * unit_price_cents); null until submit", constraints: "nullable" }
      - { name: discount_pct_applied, type: number, source: computed, description: "Volume tier applied at submit: 0.08 | 0.05 | 0.03 | 0", constraints: "nullable" }
      - { name: invoice_discount_cents, type: integer, source: computed, description: "round_half_up(invoice_subtotal_cents * discount_pct_applied); null until submit", constraints: "nullable" }
      - { name: invoice_total_cents, type: integer, source: computed, description: "= invoice_subtotal_cents - invoice_discount_cents; null until submit", constraints: "nullable" }
      - { name: submitted_at, type: datetime, source: system, description: "Logical-clock instant of submit; backfill processes oldest first", constraints: "nullable" }
      - { name: status, type: enum, source: system, default: DRAFT, description: "DRAFT | SUBMITTED | ALLOCATED | CLOSED | CANCELLED | EXPIRED" }

  - name: Allocation
    parent: null
    common_fields: true
    fields:
      - { name: order_id, type: string, source: system, description: "FK -> WholesaleOrder.id; order this reservation serves" }
      - { name: bucket_id, type: string, source: system, description: "FK -> StandBucket.id; inventory bucket drawn against" }
      - { name: quantity, type: integer, source: system, description: "Trees reserved by this allocation" }
      - { name: cut_qty, type: integer, source: system, default: 0, description: "Portion already cut by posted tickets" }
      - { name: loaded_qty, type: integer, source: system, default: 0, description: "Portion already loaded onto loads" }
      - { name: status, type: enum, source: system, default: RESERVED, description: "RESERVED | CUT | LOADED | RELEASED" }

  - name: Crew
    parent: null
    common_fields: true
    fields:
      - { name: season_id, type: string, source: input, description: "FK -> Season.id; season this crew is hired for" }
      - { name: crew_code, type: string, source: input, description: "Crew label, unique within season", constraints: "unique per season_id" }
      - { name: size, type: integer, source: input, description: "Number of workers; drives hourly floor", constraints: ">= 1" }
      - { name: status, type: enum, source: system, default: ACTIVE, description: "ACTIVE | LAID_OFF" }

  - name: HarvestTicket
    parent: null
    common_fields: true
    fields:
      - { name: crew_id, type: string, source: input, description: "FK -> Crew.id; performing crew (must equal X-User-ID for CrewLead role)" }
      - { name: block_id, type: string, source: input, description: "FK -> Block.id; block worked; every line's allocation must belong to a lot of this block" }
      - { name: work_date, type: string, source: input, description: "ISO date YYYY-MM-DD worked; must lie inside season harvest window (inclusive)" }
      - { name: hours_worked, type: number, source: input, description: "Hours the crew worked this day", constraints: "> 0" }
      - { name: lines, type: array, source: input, description: "Array of { allocation_id, cut_count }; cut_count integer >= 1 per line, at least one line" }
      - { name: piece_total_cents, type: integer, source: computed, description: "Sum over lines of round_half_up(cut_count * PIECE_RATE_CENTS[height_class]); per-line product then sum" }
      - { name: hourly_floor_cents, type: integer, source: computed, description: "= crew.size * hours_worked * MIN_HOURLY_CENTS_PER_WORKER (1500)" }
      - { name: gross_pay_cents, type: integer, source: computed, description: "= max(piece_total_cents, hourly_floor_cents)" }
      - { name: pay_basis, type: enum, source: computed, description: "PIECE | HOURLY_FLOOR — which side of max() supplied gross; exact tie resolves to PIECE" }
      - { name: status, type: enum, source: system, default: POSTED, description: "POSTED | VOIDED" }

  - name: Load
    parent: null
    common_fields: true
    fields:
      - { name: season_id, type: string, source: input, description: "FK -> Season.id; shipping season" }
      - { name: carrier_name, type: string, source: input, description: "Carrier / driver label" }
      - { name: capacity_units, type: integer, source: input, description: "Truck capacity in tree-units", constraints: ">= 1" }
      - { name: pickup_window_start, type: datetime, source: input, description: "Dock pickup window open; must be >= season shipping_window_start" }
      - { name: pickup_window_end, type: datetime, source: input, description: "Dock pickup window close; must be <= season shipping_window_end and > start" }
      - { name: lines, type: array, source: system, default: [], description: "Array of { allocation_id, quantity, height_class, units } accumulated by line-add" }
      - { name: total_units, type: integer, source: computed, default: 0, description: "Sum over lines of quantity * LOAD_UNIT_WEIGHT[height_class]; must never exceed capacity_units" }
      - { name: status, type: enum, source: system, default: BUILDING, description: "BUILDING | SHIPPED | CANCELLED" }

  - name: Consignment
    parent: null
    common_fields: true
    fields:
      - { name: season_id, type: string, source: input, description: "FK -> Season.id; selling season" }
      - { name: bucket_id, type: string, source: input, description: "FK -> StandBucket.id; inventory source for delivered trees" }
      - { name: lot_name, type: string, source: input, description: "Retail lot partner name" }
      - { name: quantity, type: integer, source: input, description: "Planned trees to deliver", constraints: ">= 1" }
      - { name: unit_price_cents, type: integer, source: input, description: "Per-tree bill price to the lot", constraints: ">= 0" }
      - { name: max_return_pct, type: number, source: input, description: "Contractual max unsold-return fraction, 0..1 inclusive; drives provisional settlement" }
      - { name: delivered_count, type: integer, source: system, description: "Actual trees delivered (set at deliver); null until DELIVERED", constraints: "nullable" }
      - { name: returned_count, type: integer, source: system, default: 0, description: "Unsold trees reported returned (cumulative across reports)" }
      - { name: provisional_settlement_cents, type: integer, source: computed, description: "At deliver: round_half_up(delivered_count * unit_price_cents * (1 - max_return_pct))", constraints: "nullable" }
      - { name: final_settlement_cents, type: integer, source: computed, description: "At settle: round_half_up((delivered_count - returned_count) * unit_price_cents)", constraints: "nullable" }
      - { name: status, type: enum, source: system, default: DRAFT, description: "DRAFT | DELIVERED | SETTLING | SETTLED | DISPUTED" }

  - name: UcutTag
    parent: null
    common_fields: true
    fields:
      - { name: block_id, type: string, source: input, description: "FK -> Block.id; must match the bucket's lot's block and be ucut_designated" }
      - { name: bucket_id, type: string, source: input, description: "FK -> StandBucket.id; height-class bucket the tagged tree draws from" }
      - { name: customer_name, type: string, source: input, description: "Retail customer name on the tag" }
      - { name: price_cents, type: integer, source: input, description: "Gate price for this tree", constraints: ">= 0" }
      - { name: expires_at, type: datetime, source: system, description: "= created_at + TAG_TTL_HOURS (48h, logical clock); run-ops expires ACTIVE tags at or past this instant" }
      - { name: status, type: enum, source: system, default: ACTIVE, description: "ACTIVE | REDEEMED | RELEASED | EXPIRED" }

  - name: CullRecord
    parent: null
    common_fields: true
    fields:
      - { name: bucket_id, type: string, source: input, description: "FK -> StandBucket.id; bucket losing trees" }
      - { name: count, type: integer, source: input, description: "Trees culled (shrink/mortality)", constraints: ">= 1" }
      - { name: reason, type: enum, source: input, description: "DISEASE | DAMAGE | GRADING | OTHER" }

  - name: ReplantPlan
    parent: null
    common_fields: true
    fields:
      - { name: block_id, type: string, source: input, description: "FK -> Block.id; block to replant (must be HARVESTED at propose time)" }
      - { name: species, type: enum, source: input, description: "NOBLE_FIR | DOUGLAS_FIR | GRAND_FIR | NORDMANN_FIR" }
      - { name: planned_count, type: integer, source: input, description: "Seedlings to plant", constraints: ">= 1" }
      - { name: proposed_by_user_id, type: string, source: system, description: "X-User-ID of proposer (FarmManager); approver must differ (segregation of duties)" }
      - { name: approved_by_user_id, type: string, source: system, description: "X-User-ID of approver (Owner); null until approved", constraints: "nullable" }
      - { name: created_crop_lot_id, type: string, source: system, description: "id of the CropLot created at execute (server-minted output, not a queryable reference); null until EXECUTED", constraints: "nullable" }
      - { name: status, type: enum, source: system, default: PROPOSED, description: "PROPOSED | APPROVED | REJECTED | EXECUTED" }

# =============================================================================
# §1.2 State Machine Table
# =============================================================================
state_machines:
  - entity: Season
    field: posture
    initial_state: PLANNING
    terminal_states: [CLOSED]
    transitions:
      - from: PLANNING
        to: BOOKING
        trigger: "POST /api/seasons/{id}/advance-posture {target_posture: BOOKING}"
        actor: Owner
        preconditions:
          - "logical clock >= booking_open_at (else ERR_POSTURE_GUARD_FAILED)"
        side_effects: ["increments Season.version by 1"]
      - from: BOOKING
        to: HARVEST
        trigger: "POST /api/seasons/{id}/advance-posture {target_posture: HARVEST}"
        actor: Owner
        preconditions:
          - "logical clock >= harvest_window_start (parsed as 00:00:00Z) (else ERR_POSTURE_GUARD_FAILED)"
          - "no WholesaleOrder of this season in DRAFT (else ERR_POSTURE_GUARD_FAILED)"
        side_effects: ["increments Season.version by 1"]
      - from: HARVEST
        to: SHIPPING
        trigger: "POST /api/seasons/{id}/advance-posture {target_posture: SHIPPING}"
        actor: Owner
        preconditions:
          - "no Allocation on this season's orders in RESERVED or CUT (else ERR_POSTURE_GUARD_FAILED)"
        side_effects: ["increments Season.version by 1"]
      - from: SHIPPING
        to: SETTLEMENT
        trigger: "POST /api/seasons/{id}/advance-posture {target_posture: SETTLEMENT}"
        actor: Owner
        preconditions:
          - "no Load of this season in BUILDING (else ERR_POSTURE_GUARD_FAILED)"
        side_effects: ["increments Season.version by 1"]
      - from: SETTLEMENT
        to: CLOSED
        trigger: "POST /api/seasons/{id}/advance-posture {target_posture: CLOSED}"
        actor: Owner
        preconditions:
          - "no Consignment of this season in DELIVERED, SETTLING, or DISPUTED (else ERR_POSTURE_GUARD_FAILED)"
        side_effects: ["increments Season.version by 1"]

  - entity: Block
    field: rotation_state
    initial_state: RESTING
    terminal_states: []
    transitions:
      - from: RESTING
        to: PLANTED
        trigger: "system (POST /api/crop-lots on this block, or POST /api/replant-plans/{id}/execute from HARVESTED)"
        actor: system
        preconditions: ["block has no other CropLot in ACTIVE"]
        side_effects: ["increments Block.version by 1"]
      - from: PLANTED
        to: GROWING
        trigger: "POST /api/blocks/{id}/advance-rotation"
        actor: FarmManager
        preconditions: ["block has a CropLot in ACTIVE (else ERR_INVALID_STATE)"]
        side_effects: ["increments Block.version by 1"]
      - from: GROWING
        to: HARVESTABLE
        trigger: "POST /api/blocks/{id}/advance-rotation"
        actor: FarmManager
        preconditions: ["block has a CropLot in ACTIVE (else ERR_INVALID_STATE)"]
        side_effects: ["increments Block.version by 1"]
      - from: HARVESTABLE
        to: HARVESTED
        trigger: "POST /api/blocks/{id}/advance-rotation"
        actor: FarmManager
        preconditions:
          - "no Allocation in RESERVED or CUT on any bucket of this block's lots (else ERR_INVALID_STATE)"
          - "no UcutTag in ACTIVE on this block (else ERR_INVALID_STATE)"
        side_effects: ["increments Block.version by 1"]
      - from: HARVESTED
        to: RESTING
        trigger: "POST /api/blocks/{id}/advance-rotation"
        actor: FarmManager
        preconditions: ["every CropLot of this block is DEPLETED (else ERR_INVALID_STATE)"]
        side_effects: ["increments Block.version by 1"]
        note: "cyclic: a rested block may be replanted in a later rotation"
      - from: HARVESTED
        to: PLANTED
        trigger: "system (POST /api/replant-plans/{id}/execute creates the successor CropLot)"
        actor: system
        preconditions: []
        side_effects: ["new CropLot ACTIVE on this block", "increments Block.version by 1"]

  - entity: CropLot
    field: status
    initial_state: ACTIVE
    terminal_states: [DEPLETED]
    transitions:
      - from: ACTIVE
        to: DEPLETED
        trigger: "system (automatic after any consumption event when every bucket of the lot has standing_count == 0 AND reserved_count == 0 AND tagged_active_count == 0)"
        actor: system
        preconditions: []
        side_effects: ["increments CropLot.version by 1"]

  - entity: InventorySurvey
    field: status
    initial_state: DRAFT
    terminal_states: []
    transitions:
      - from: DRAFT
        to: POSTED
        trigger: "POST /api/surveys/{id}/post"
        actor: FarmManager
        preconditions:
          - "season of the lot is not CLOSED (else ERR_POSTURE_FORBIDS)"
          - "expected_crop_lot_version equals CropLot.version (else ERR_STALE_VERSION 412)"
        side_effects:
          - "per bucket: last_shrink_delta = surveyed_counts[class] - standing_count; baseline_count = surveyed_counts[class]; standing_count = baseline_count; cut/culled/ucut_sold/consigned cumulative counters reset to 0; reserved_count and tagged_active_count unchanged"
          - "over_reservation_sweep on each bucket whose reserved_count > new standing_count (see calculations)"
          - "previous POSTED survey of this lot -> SUPERSEDED"
          - "posted_at = logical clock"
          - "increments CropLot.version by 1"
      - from: POSTED
        to: SUPERSEDED
        trigger: "system (a newer survey of the same crop lot is posted)"
        actor: system
        preconditions: []
        side_effects: []

  - entity: BuyerAccount
    field: standing
    initial_state: GOOD_STANDING
    terminal_states: [CLOSED]
    transitions:
      - from: GOOD_STANDING
        to: CREDIT_HOLD
        trigger: "POST /api/buyer-accounts/{id}/set-standing {to_standing: CREDIT_HOLD}"
        actor: Owner
        preconditions: []
        side_effects: ["increments BuyerAccount.version by 1"]
      - from: CREDIT_HOLD
        to: GOOD_STANDING
        trigger: "POST /api/buyer-accounts/{id}/set-standing {to_standing: GOOD_STANDING}"
        actor: Owner
        preconditions: []
        side_effects: ["increments BuyerAccount.version by 1"]
      - from: GOOD_STANDING
        to: CLOSED
        trigger: "POST /api/buyer-accounts/{id}/set-standing {to_standing: CLOSED}"
        actor: Owner
        preconditions: ["buyer has no orders in DRAFT, SUBMITTED, or ALLOCATED (else ERR_INVALID_STATE)"]
        side_effects: ["increments BuyerAccount.version by 1"]
      - from: CREDIT_HOLD
        to: CLOSED
        trigger: "POST /api/buyer-accounts/{id}/set-standing {to_standing: CLOSED}"
        actor: Owner
        preconditions: ["buyer has no orders in DRAFT, SUBMITTED, or ALLOCATED (else ERR_INVALID_STATE)"]
        side_effects: ["increments BuyerAccount.version by 1"]

  - entity: WholesaleOrder
    field: status
    initial_state: DRAFT
    terminal_states: [CLOSED, CANCELLED, EXPIRED]
    transitions:
      - from: DRAFT
        to: SUBMITTED
        trigger: "POST /api/wholesale-orders/{id}/submit"
        actor: WholesaleBuyer
        preconditions:
          - "season posture == BOOKING (else ERR_POSTURE_FORBIDS)"
          - "buyer standing == GOOD_STANDING (else ERR_BUYER_CREDIT_HOLD)"
          - "buyer exposure_cents + computed invoice_total_cents <= buyer credit_limit_cents, inclusive equality allowed (else ERR_CREDIT_LIMIT_EXCEEDED)"
        side_effects:
          - "invoice fields computed per order_invoice calculation"
          - "submitted_at = logical clock"
          - "buyer exposure_cents += invoice_total_cents"
          - "increments WholesaleOrder.version by 1"
      - from: SUBMITTED
        to: ALLOCATED
        trigger: "system (automatic when allocated_qty == quantity after allocate, run-ops backfill, or allocation release recompute)"
        actor: system
        preconditions: []
        side_effects: ["increments WholesaleOrder.version by 1"]
      - from: ALLOCATED
        to: SUBMITTED
        trigger: "system (automatic when allocated_qty < quantity after a release or over-reservation sweep)"
        actor: system
        preconditions: []
        side_effects: ["increments WholesaleOrder.version by 1"]
        note: "cyclic regression loop SUBMITTED <-> ALLOCATED"
      - from: ALLOCATED
        to: CLOSED
        trigger: "system (automatic when allocated_qty == quantity and every non-RELEASED allocation is LOADED)"
        actor: system
        preconditions: []
        side_effects:
          - "buyer exposure_cents -= invoice_total_cents"
          - "increments WholesaleOrder.version by 1"
      - from: DRAFT
        to: CANCELLED
        trigger: "POST /api/wholesale-orders/{id}/cancel"
        actor: "WholesaleBuyer (own order) or FarmManager"
        preconditions: []
        side_effects: ["increments WholesaleOrder.version by 1"]
      - from: SUBMITTED
        to: CANCELLED
        trigger: "POST /api/wholesale-orders/{id}/cancel"
        actor: "WholesaleBuyer (own order) or FarmManager"
        preconditions: ["no allocation of this order in CUT or LOADED (else ERR_ORDER_HAS_CUT_ALLOCATIONS)"]
        side_effects:
          - "every RESERVED allocation -> RELEASED (bucket reserved_count -= allocation.quantity, per bucket)"
          - "buyer exposure_cents -= invoice_total_cents"
          - "increments WholesaleOrder.version by 1"
      - from: ALLOCATED
        to: CANCELLED
        trigger: "POST /api/wholesale-orders/{id}/cancel"
        actor: "WholesaleBuyer (own order) or FarmManager"
        preconditions: ["no allocation of this order in CUT or LOADED (else ERR_ORDER_HAS_CUT_ALLOCATIONS)"]
        side_effects:
          - "every RESERVED allocation -> RELEASED (bucket reserved_count restored)"
          - "buyer exposure_cents -= invoice_total_cents"
          - "increments WholesaleOrder.version by 1"
      - from: DRAFT
        to: EXPIRED
        trigger: "system (run-ops when logical clock > booking_close_at)"
        actor: system
        preconditions: []
        side_effects: ["increments WholesaleOrder.version by 1"]

  - entity: Allocation
    field: status
    initial_state: RESERVED
    terminal_states: [LOADED, RELEASED]
    transitions:
      - from: RESERVED
        to: CUT
        trigger: "system (automatic when cut_qty == quantity after a ticket post)"
        actor: system
        preconditions: []
        side_effects: ["increments Allocation.version by 1"]
      - from: CUT
        to: LOADED
        trigger: "system (automatic when loaded_qty == cut_qty after a load line-add)"
        actor: system
        preconditions: []
        side_effects: ["increments Allocation.version by 1"]
      - from: RESERVED
        to: RELEASED
        trigger: "POST /api/allocations/{id}/release, order cancel cascade, or over_reservation_sweep"
        actor: "FarmManager or system"
        preconditions: ["status == RESERVED (else ERR_INVALID_STATE)"]
        side_effects:
          - "bucket reserved_count -= quantity"
          - "order allocated_qty -= quantity; order may regress ALLOCATED -> SUBMITTED"
          - "increments Allocation.version by 1"

  - entity: Crew
    field: status
    initial_state: ACTIVE
    terminal_states: [LAID_OFF]
    transitions:
      - from: ACTIVE
        to: LAID_OFF
        trigger: "POST /api/crews/{id}/lay-off"
        actor: FarmManager
        preconditions: []
        side_effects: ["increments Crew.version by 1"]

  - entity: HarvestTicket
    field: status
    initial_state: POSTED
    terminal_states: [VOIDED]
    transitions:
      - from: POSTED
        to: VOIDED
        trigger: "POST /api/harvest-tickets/{id}/void"
        actor: FarmManager
        preconditions:
          - "season posture == HARVEST (else ERR_TICKET_NOT_VOIDABLE)"
          - "no line's allocation is in LOADED (else ERR_TICKET_NOT_VOIDABLE)"
        side_effects:
          - "per line: allocation cut_qty -= line.cut_count (CUT allocations revert to RESERVED when cut_qty < quantity)"
          - "per line: bucket standing_count += line.cut_count; cut_cumulative -= line.cut_count; reserved_count += line.cut_count"
          - "increments HarvestTicket.version by 1"

  - entity: Load
    field: status
    initial_state: BUILDING
    terminal_states: [SHIPPED, CANCELLED]
    transitions:
      - from: BUILDING
        to: SHIPPED
        trigger: "POST /api/loads/{id}/ship"
        actor: FarmManager
        preconditions:
          - "season posture == SHIPPING (else ERR_POSTURE_FORBIDS)"
          - "shipping_window_start <= logical clock <= shipping_window_end, inclusive both ends (else ERR_OUTSIDE_SHIPPING_WINDOW)"
        side_effects: ["increments Load.version by 1"]
      - from: BUILDING
        to: CANCELLED
        trigger: "POST /api/loads/{id}/cancel"
        actor: FarmManager
        preconditions: ["season posture != CLOSED (else ERR_POSTURE_FORBIDS)"]
        side_effects:
          - "per line: allocation loaded_qty -= line.quantity (LOADED allocations revert to CUT when loaded_qty < cut_qty)"
          - "order all-loaded recompute may keep order ALLOCATED (no auto-close from cancel)"
          - "increments Load.version by 1"

  - entity: Consignment
    field: status
    initial_state: DRAFT
    terminal_states: [SETTLED]
    transitions:
      - from: DRAFT
        to: DELIVERED
        trigger: "POST /api/consignments/{id}/deliver {delivered_count}"
        actor: FarmManager
        preconditions:
          - "season posture in {HARVEST, SHIPPING} (else ERR_POSTURE_FORBIDS)"
          - "delivered_count >= 1 and delivered_count <= bucket available_count (else ERR_INSUFFICIENT_STANDING)"
        side_effects:
          - "bucket standing_count -= delivered_count; consigned_cumulative += delivered_count"
          - "provisional_settlement_cents computed (consignment_settlement provisional variant)"
          - "increments Consignment.version by 1"
      - from: DELIVERED
        to: SETTLING
        trigger: "POST /api/consignments/{id}/report-return {returned_count}"
        actor: FarmManager
        preconditions:
          - "season posture in {SHIPPING, SETTLEMENT} (else ERR_POSTURE_FORBIDS)"
          - "returned_count >= 0 and returned_count <= delivered_count (else ERR_RETURN_EXCEEDS_DELIVERED)"
        side_effects: ["increments Consignment.version by 1"]
      - from: SETTLING
        to: SETTLED
        trigger: "POST /api/consignments/{id}/settle"
        actor: FarmManager
        preconditions: ["season posture == SETTLEMENT (else ERR_POSTURE_FORBIDS)"]
        side_effects:
          - "final_settlement_cents computed (consignment_settlement final variant)"
          - "increments Consignment.version by 1"
      - from: SETTLING
        to: DISPUTED
        trigger: "POST /api/consignments/{id}/dispute"
        actor: FarmManager
        preconditions: ["season posture == SETTLEMENT (else ERR_POSTURE_FORBIDS)"]
        side_effects: ["increments Consignment.version by 1"]
      - from: DISPUTED
        to: SETTLING
        trigger: "POST /api/consignments/{id}/report-return {returned_count} (re-report after dispute)"
        actor: FarmManager
        preconditions:
          - "season posture == SETTLEMENT (else ERR_POSTURE_FORBIDS)"
          - "returned_count >= 0 and returned_count <= delivered_count (else ERR_RETURN_EXCEEDS_DELIVERED)"
        side_effects: ["increments Consignment.version by 1"]
        note: "cyclic SETTLING <-> DISPUTED renegotiation loop"

  - entity: UcutTag
    field: status
    initial_state: ACTIVE
    terminal_states: [REDEEMED, RELEASED, EXPIRED]
    transitions:
      - from: ACTIVE
        to: REDEEMED
        trigger: "POST /api/ucut-tags/{id}/redeem"
        actor: FarmManager
        preconditions: ["season posture == HARVEST (else ERR_POSTURE_FORBIDS)"]
        side_effects:
          - "bucket tagged_active_count -= 1; ucut_sold_cumulative += 1"
          - "increments UcutTag.version by 1"
      - from: ACTIVE
        to: RELEASED
        trigger: "POST /api/ucut-tags/{id}/release"
        actor: FarmManager
        preconditions: ["season posture == HARVEST (else ERR_POSTURE_FORBIDS)"]
        side_effects:
          - "bucket tagged_active_count -= 1; standing_count += 1 (tree returned to pool)"
          - "increments UcutTag.version by 1"
      - from: ACTIVE
        to: EXPIRED
        trigger: "system (run-ops sweep: expires_at <= logical clock)"
        actor: system
        preconditions: []
        side_effects:
          - "bucket tagged_active_count -= 1; standing_count += 1"
          - "increments UcutTag.version by 1"

  - entity: ReplantPlan
    field: status
    initial_state: PROPOSED
    terminal_states: [EXECUTED, REJECTED]
    transitions:
      - from: PROPOSED
        to: APPROVED
        trigger: "POST /api/replant-plans/{id}/approve"
        actor: Owner
        preconditions: ["approver X-User-ID != proposed_by_user_id (else ERR_SOD_VIOLATION)"]
        side_effects: ["approved_by_user_id = X-User-ID", "increments ReplantPlan.version by 1"]
      - from: PROPOSED
        to: REJECTED
        trigger: "POST /api/replant-plans/{id}/reject"
        actor: Owner
        preconditions: ["rejector X-User-ID != proposed_by_user_id (else ERR_SOD_VIOLATION)"]
        side_effects: ["increments ReplantPlan.version by 1"]
      - from: APPROVED
        to: EXECUTED
        trigger: "POST /api/replant-plans/{id}/execute"
        actor: FarmManager
        preconditions: ["block still HARVESTED (else ERR_BLOCK_OCCUPIED)"]
        side_effects:
          - "creates CropLot on the block (species, planted_year = season.year, one StandBucket per height class with baseline = planned_count on H_4_5, 0 elsewhere)"
          - "block HARVESTED -> PLANTED"
          - "created_crop_lot_id set"
          - "increments ReplantPlan.version by 1"

# =============================================================================
# §1.2.1 Concurrency Rules (true races only, OCC-resolved)
# =============================================================================
concurrency_rules:
  - rule_id: survey-post-stale-lot
    parent_entity: CropLot
    write_endpoint: "POST /api/surveys/{id}/post"
    occ_field: expected_crop_lot_version
    description: |
      Posting a survey against a CropLot whose version has advanced since the
      client last observed it is rejected. Posting a survey legitimately
      supersedes the previously POSTED survey, so a second writer holding a
      stale lot version must lose with 412 rather than silently re-baselining
      buckets against counts the first writer already replaced.
    error_id: ERR_STALE_VERSION
    http_status: 412
  - rule_id: order-allocate-stale-order
    parent_entity: WholesaleOrder
    write_endpoint: "POST /api/wholesale-orders/{id}/allocate"
    occ_field: expected_order_version
    description: |
      Allocating against a WholesaleOrder whose version has advanced since the
      client last observed it is rejected. A prior allocation (or a run-ops
      backfill) legitimately advanced allocated_qty, so a second writer with a
      stale order version must lose with 412 rather than over-reserving against
      an outdated view of the order.
    error_id: ERR_STALE_VERSION
    http_status: 412

# =============================================================================
# §1.3 Calculation Rules Table
# =============================================================================
calculations:
  - name: bucket_available
    trigger: "any change to standing_count or reserved_count on a StandBucket"
    algorithm: aggregation
    formula: |
      available_count = standing_count - reserved_count
    input_set: "the single affected bucket"
    precision: "integer arithmetic, exact"

  - name: inventory_book_vs_survey
    trigger: "POST /api/surveys/{id}/post"
    algorithm: aggregation
    formula: |
      # Two valid standings for the same physical lot, computed differently:
      book_stock   = standing_count            # ledger: baseline minus recorded epoch deltas
      survey_stock = surveyed_counts[height_class]   # physical count
      shrink_delta = survey_stock - book_stock       # unrecorded loss when negative
      on post: baseline_count = survey_stock; standing_count = survey_stock;
               cut_cumulative = culled_cumulative = ucut_sold_cumulative = consigned_cumulative = 0;
               last_shrink_delta = shrink_delta
    input_set: "all six StandBuckets of the survey's crop lot"
    precision: "integer arithmetic, exact"
    variants:
      - name: book_stock
        when: "before survey post; value exposed as standing_count on every read"
        difference: "accumulates only recorded events (cuts, culls, tags, consignments); drifts from physical reality by unrecorded shrink"
      - name: survey_stock
        when: "at survey post; adopted as the new baseline"
        difference: "physical count overrides the ledger; identical bucket data yields a different standing when shrink has occurred"

  - name: order_invoice
    trigger: "POST /api/wholesale-orders/{id}/submit"
    algorithm: tiered_pricing
    formula: |
      subtotal = round_half_up(quantity * unit_price_cents)          # exact integer product
      tier: quantity >= 500 -> 0.08 | >= 200 -> 0.05 | >= 100 -> 0.03 | else 0   # >= inclusive
      discount = round_half_up(subtotal * tier)                      # PINNED ORDER: discount computed from the rounded subtotal, half-up
      invoice_total_cents = subtotal - discount
    input_set: "the submitting order only"
    constants:
      TIER_1_QTY: 100
      TIER_1_PCT: 0.03
      TIER_2_QTY: 200
      TIER_2_PCT: 0.05
      TIER_3_QTY: 500
      TIER_3_PCT: 0.08
    precision: "integer cents; discount rounded half-up from the rounded subtotal — never round(quantity*price*(1-tier))"

  - name: crew_ticket_pay
    trigger: "POST /api/harvest-tickets (computed at creation; ticket is born POSTED)"
    algorithm: tiered_pricing
    formula: |
      piece_total_cents  = sum over lines of round_half_up(line.cut_count * PIECE_RATE_CENTS[line.height_class])
                           # height_class resolved via line.allocation -> StandBucket; per-line product THEN sum (pinned order)
      hourly_floor_cents = crew.size * ticket.hours_worked * MIN_HOURLY_CENTS_PER_WORKER
      gross_pay_cents    = max(piece_total_cents, hourly_floor_cents)
      pay_basis          = PIECE if piece_total_cents >= hourly_floor_cents else HOURLY_FLOOR   # exact tie -> PIECE
    input_set: "the ticket's lines plus the performing crew's size and hours_worked"
    constants:
      PIECE_RATE_CENTS: { H_4_5: 180, H_5_6: 220, H_6_7: 260, H_7_8: 310, H_8_9: 380, H_9_PLUS: 460 }
      MIN_HOURLY_CENTS_PER_WORKER: 1500
    precision: "integer cents, round_half_up per line before summation"

  - name: load_unit_tally
    trigger: "POST /api/loads/{id}/lines"
    algorithm: aggregation
    formula: |
      line_units = line.quantity * LOAD_UNIT_WEIGHT[line.height_class]
      new_total_units = load.total_units + line_units
      reject with ERR_LOAD_OVER_CAPACITY if new_total_units > load.capacity_units   # equality allowed
    input_set: "the load plus the candidate line; height_class resolved via line.allocation -> StandBucket"
    constants:
      LOAD_UNIT_WEIGHT: { H_4_5: 1, H_5_6: 2, H_6_7: 3, H_7_8: 5, H_8_9: 7, H_9_PLUS: 9 }
    precision: "integer tree-units, exact"

  - name: consignment_settlement
    trigger: "deliver (provisional variant) and settle (final variant)"
    algorithm: threshold
    formula: |
      provisional_settlement_cents = round_half_up(delivered_count * unit_price_cents * (1 - max_return_pct))
      final_settlement_cents       = round_half_up((delivered_count - returned_count) * unit_price_cents)
    input_set: "the consignment only"
    precision: "integer cents, round_half_up"
    variants:
      - name: provisional
        when: "computed at deliver, before returns are known"
        difference: "assumes worst-case returns at max_return_pct — a conservative estimate"
      - name: final
        when: "computed at settle from actual returned_count"
        difference: "uses observed returns; identical delivery data yields a different amount whenever actual returns differ from max_return_pct * delivered_count"

  - name: allocation_waterfall
    trigger: "POST /api/wholesale-orders/{id}/allocate and run-ops backfill"
    algorithm: waterfall_allocation
    formula: |
      eligible = buckets b where b.crop_lot.species == order.species
                 AND b.height_class == order.height_class
                 AND b.crop_lot.status == ACTIVE
                 AND b.available_count > 0
      rank: b.crop_lot.planted_year ASC, then b.crop_lot.created_at ASC, then b.created_at ASC
      remaining = min(request.quantity, order.quantity - order.allocated_qty)
      for b in ranked eligible: take = min(remaining, b.available_count);
        create Allocation(quantity=take); b.reserved_count += take; remaining -= take; stop when remaining == 0
      if nothing was allocated (eligible empty or all available_count == 0): ERR_NO_ELIGIBLE_INVENTORY
      if the candidate pool is empty the request fails; there is no deferred queue
    input_set: "all StandBuckets of the season's blocks matching species+height_class"
    precision: "integer trees, exact"

  - name: over_reservation_sweep
    trigger: "inside survey post, per re-baselined bucket"
    algorithm: constraint_propagation
    formula: |
      if bucket.reserved_count > bucket.standing_count:
        release whole allocations on this bucket in created_at DESC order (youngest first)
        until bucket.reserved_count <= bucket.standing_count or no RESERVED allocations remain
        each release: allocation -> RELEASED; reserved_count -= allocation.quantity;
                      order.allocated_qty -= quantity; ALLOCATED orders regress to SUBMITTED
    input_set: "RESERVED allocations of the affected bucket only (CUT/LOADED never swept)"
    precision: "integer trees, exact"

  - name: buyer_exposure
    trigger: "order submit, order cancel, order auto-close"
    algorithm: aggregation
    formula: |
      exposure_cents = sum of invoice_total_cents over this buyer's orders in {SUBMITTED, ALLOCATED}
    input_set: "all orders of the buyer; DRAFT/CLOSED/CANCELLED/EXPIRED excluded"
    precision: "integer cents, exact"

  - name: run_ops_sweeps
    trigger: "POST /api/seasons/{id}/run-ops"
    algorithm: chronological
    formula: |
      1. expire every UcutTag in ACTIVE with expires_at <= logical clock  (boundary: expires_at == now expires)
      2. expire every WholesaleOrder in DRAFT when logical clock > booking_close_at
      3. backfill (only when posture in {BOOKING, HARVEST}): for each SUBMITTED order of the season
         with allocated_qty < quantity, oldest submitted_at first (tie-break created_at ASC),
         run allocation_waterfall for the unallocated remainder
      4. ops_run_index += 1
    input_set: "all ACTIVE tags of the season, all DRAFT/SUBMITTED orders of the season"
    precision: "integer counters, exact"

# =============================================================================
# §1.4 Validation Rules Table (ordered by priority)
# =============================================================================
validations:
  - { priority: 1, category: auth, check: "X-User-Role and X-User-ID headers present; role recognized", error_id: ERR_UNAUTHENTICATED, http_status: 401, applies_to: "all" }
  - { priority: 2, category: auth, check: "role permitted for endpoint; entity-backed ownership: WholesaleBuyer must satisfy buyer_account_id == X-User-ID on order create/read/cancel and buyer self-read; CrewLead must satisfy crew_id == X-User-ID on ticket create", error_id: ERR_FORBIDDEN, http_status: 403, applies_to: "all" }
  - { priority: 3, category: auth, check: "segregation of duties: replant approve/reject X-User-ID must differ from proposed_by_user_id", error_id: ERR_SOD_VIOLATION, http_status: 403, applies_to: "POST /api/replant-plans/{id}/approve, POST /api/replant-plans/{id}/reject" }
  - { priority: 4, category: existence, check: "path ids and body FK references exist, validated left-to-right", error_id: ERR_NOT_FOUND, http_status: 404, applies_to: "all" }
  - { priority: 5, category: existence, check: "request body well-formed: required fields present, types valid, enum values in set, quantity/count >= 1 where applicable", error_id: ERR_MALFORMED_REQUEST, http_status: 400, applies_to: "all" }
  - { priority: 6, category: state, check: "target resource in a valid from-state for the requested transition (terminal lockdown included; posture advance must name the immediate next posture)", error_id: ERR_INVALID_STATE, http_status: 409, applies_to: "all action endpoints" }
  - { priority: 7, category: business_temporal, check: "season posture permits the operation (order create/submit BOOKING; allocate BOOKING|HARVEST; ticket create/void HARVEST; load create HARVEST|SHIPPING, line-add HARVEST, ship SHIPPING; consignment create BOOKING|HARVEST, deliver HARVEST|SHIPPING, report-return SHIPPING|SETTLEMENT, settle/dispute SETTLEMENT; tag create/redeem/release HARVEST; survey create/post and cull any non-CLOSED)", error_id: ERR_POSTURE_FORBIDS, http_status: 409, applies_to: "posture-gated endpoints" }
  - { priority: 8, category: business_temporal, check: "advance-posture guard conditions met (clock and child-state gates per Season state machine)", error_id: ERR_POSTURE_GUARD_FAILED, http_status: 409, applies_to: "POST /api/seasons/{id}/advance-posture" }
  - { priority: 9, category: business_temporal, check: "harvest work_date within [harvest_window_start, harvest_window_end] inclusive", error_id: ERR_OUTSIDE_HARVEST_WINDOW, http_status: 422, applies_to: "POST /api/harvest-tickets" }
  - { priority: 10, category: business_temporal, check: "ship clock within [shipping_window_start, shipping_window_end] inclusive; load pickup window inside shipping window at create", error_id: ERR_OUTSIDE_SHIPPING_WINDOW, http_status: 422, applies_to: "POST /api/loads, POST /api/loads/{id}/ship" }
  - { priority: 11, category: business_referential, check: "ticket/tag block rotation_state == HARVESTABLE", error_id: ERR_BLOCK_NOT_HARVESTABLE, http_status: 409, applies_to: "POST /api/harvest-tickets, POST /api/ucut-tags" }
  - { priority: 12, category: business_referential, check: "crop-lot create requires block RESTING with no ACTIVE lot; replant propose requires block HARVESTED; replant execute requires block still HARVESTED", error_id: ERR_BLOCK_OCCUPIED, http_status: 409, applies_to: "POST /api/crop-lots, POST /api/replant-plans, POST /api/replant-plans/{id}/execute" }
  - { priority: 13, category: business_referential, check: "u-cut tag block must have ucut_designated == true", error_id: ERR_BLOCK_NOT_UCUT, http_status: 422, applies_to: "POST /api/ucut-tags" }
  - { priority: 14, category: business_referential, check: "ticket crew status == ACTIVE", error_id: ERR_CREW_NOT_ACTIVE, http_status: 409, applies_to: "POST /api/harvest-tickets" }
  - { priority: 15, category: business_referential, check: "order submit requires buyer standing == GOOD_STANDING", error_id: ERR_BUYER_CREDIT_HOLD, http_status: 422, applies_to: "POST /api/wholesale-orders/{id}/submit" }
  - { priority: 16, category: business_referential, check: "every ticket line's allocation belongs to a crop lot of the ticket's block", error_id: ERR_TICKET_BLOCK_MISMATCH, http_status: 422, applies_to: "POST /api/harvest-tickets" }
  - { priority: 17, category: business_referential, check: "load line-add allocation status == CUT with loaded_qty headroom", error_id: ERR_ALLOCATION_NOT_CUT, http_status: 409, applies_to: "POST /api/loads/{id}/lines" }
  - { priority: 18, category: business_referential, check: "ticket void requires posture HARVEST and no line allocation LOADED", error_id: ERR_TICKET_NOT_VOIDABLE, http_status: 409, applies_to: "POST /api/harvest-tickets/{id}/void" }
  - { priority: 19, category: business_referential, check: "order cancel requires no allocation in CUT or LOADED", error_id: ERR_ORDER_HAS_CUT_ALLOCATIONS, http_status: 409, applies_to: "POST /api/wholesale-orders/{id}/cancel" }
  - { priority: 20, category: business_constraint, check: "allocation waterfall found at least one tree of availability; zero-eligible-pool rejects", error_id: ERR_NO_ELIGIBLE_INVENTORY, http_status: 422, applies_to: "POST /api/wholesale-orders/{id}/allocate" }
  - { priority: 21, category: business_constraint, check: "consignment delivered_count <= bucket available_count", error_id: ERR_INSUFFICIENT_STANDING, http_status: 422, applies_to: "POST /api/consignments/{id}/deliver" }
  - { priority: 22, category: business_constraint, check: "cull count <= bucket available_count", error_id: ERR_CULL_EXCEEDS_STANDING, http_status: 422, applies_to: "POST /api/cull-records" }
  - { priority: 23, category: business_constraint, check: "u-cut tag requires bucket standing_count >= 1", error_id: ERR_BUCKET_EMPTY, http_status: 422, applies_to: "POST /api/ucut-tags" }
  - { priority: 24, category: business_constraint, check: "crew has at most one POSTED ticket per work_date (whole-day occupation, date-equality semantics)", error_id: ERR_CREW_DOUBLE_BOOKED, http_status: 409, applies_to: "POST /api/harvest-tickets" }
  - { priority: 25, category: business_constraint, check: "load pickup window [start, end) plus 30-minute buffer must not overlap any other non-CANCELLED load of the season: conflict iff start < other.end + 30m AND other.start < end + 30m; a gap of exactly 30 minutes is allowed", error_id: ERR_DOCK_WINDOW_CONFLICT, http_status: 409, applies_to: "POST /api/loads" }
  - { priority: 26, category: business_constraint, check: "load line-add keeps total_units <= capacity_units (equality allowed)", error_id: ERR_LOAD_OVER_CAPACITY, http_status: 422, applies_to: "POST /api/loads/{id}/lines" }
  - { priority: 27, category: business_constraint, check: "ticket line cut_count <= allocation quantity - cut_qty (uncut remainder)", error_id: ERR_CUT_EXCEEDS_ALLOCATION, http_status: 422, applies_to: "POST /api/harvest-tickets" }
  - { priority: 28, category: business_constraint, check: "consignment returned_count <= delivered_count", error_id: ERR_RETURN_EXCEEDS_DELIVERED, http_status: 422, applies_to: "POST /api/consignments/{id}/report-return" }
  - { priority: 29, category: business_fiscal, check: "order submit: buyer exposure_cents + invoice_total_cents <= credit_limit_cents (inclusive equality allowed)", error_id: ERR_CREDIT_LIMIT_EXCEEDED, http_status: 422, applies_to: "POST /api/wholesale-orders/{id}/submit" }

# =============================================================================
# §1.0 Response Envelope (FIXED — verbatim)
# =============================================================================
response_envelope:
  success: |
    { "meta": { "api_request_id": "req_xxx", "api_request_timestamp": "ISO8601" },
      "response_type": "object" | "array", "data": {} }
  error: |
    { "meta": { ... }, "response_type": "error",
      "data": { "error_id": "ERR_XXX", "message": "..." } }
  pagination_fields: ["limit", "offset", "total_count", "has_more"]
  pagination_defaults: { limit: 10, min: 1, max: 100, offset: 0 }

# =============================================================================
# §1.5 API Endpoint Table
# =============================================================================
endpoints:
  # --- logical clock (test-driving; default time 2026-05-01T00:00:00Z) ---
  - { method: POST, path: "/api/_clock/set_current_utc", description: "Set the logical clock. Startup default is exactly 2026-05-01T00:00:00Z; the server never falls back to wall-clock time.", roles: [Owner], code: 200, input: [to_iso8601], output: "{ current_utc: string }", side_effects: [] }

  # --- Season ---
  - { method: POST, path: "/api/seasons", description: "Create a season (posture PLANNING, ops_run_index 0)", roles: [Owner], code: 201, input: [year, booking_open_at, booking_close_at, harvest_window_start, harvest_window_end, shipping_window_start, shipping_window_end], output: Season, side_effects: [] }
  - { method: GET, path: "/api/seasons/{id}", description: "Read a season", roles: [Owner, FarmManager, WholesaleBuyer, CrewLead], code: 200, input: [], output: Season, side_effects: [] }
  - { method: POST, path: "/api/seasons/{id}/advance-posture", description: "Advance posture exactly one step forward; guards per Season state machine", roles: [Owner], code: 200, input: [target_posture], output: Season, side_effects: ["posture transition", "increments Season.version by 1"] }
  - { method: POST, path: "/api/seasons/{id}/run-ops", description: "Ops-run checkpoint: expire ACTIVE tags at/past expires_at, expire DRAFT orders past booking close, backfill SUBMITTED orders oldest-first, ops_run_index += 1", roles: [Owner], code: 200, input: [], output: Season, side_effects: ["run_ops_sweeps calculation", "increments Season.version by 1"] }

  # --- Block ---
  - { method: POST, path: "/api/blocks", description: "Create a block (rotation_state RESTING)", roles: [FarmManager], code: 201, input: [season_id, block_code, acreage, "ucut_designated?"], output: Block, side_effects: [] }
  - { method: GET, path: "/api/blocks/{id}", description: "Read a block", roles: [Owner, FarmManager], code: 200, input: [], output: Block, side_effects: [] }
  - { method: GET, path: "/api/blocks", description: "List blocks; filter by season_id; sorted by created_at ASC", roles: [Owner, FarmManager], code: 200, input: ["season_id?", "limit?", "offset?"], output: "Block[]", side_effects: [] }
  - { method: POST, path: "/api/blocks/{id}/advance-rotation", description: "Advance rotation one step: PLANTED->GROWING->HARVESTABLE->HARVESTED->RESTING (guards per Block state machine)", roles: [FarmManager], code: 200, input: [], output: Block, side_effects: ["rotation transition", "increments Block.version by 1"] }

  # --- CropLot / StandBucket ---
  - { method: POST, path: "/api/crop-lots", description: "Plant a crop lot on a RESTING block; auto-creates six StandBuckets (baseline=standing=initial_counts per class); block -> PLANTED", roles: [FarmManager], code: 201, input: [block_id, species, planted_year, initial_counts], output: CropLot, side_effects: ["Block RESTING -> PLANTED", "six StandBuckets created"] }
  - { method: GET, path: "/api/crop-lots/{id}", description: "Read a crop lot", roles: [Owner, FarmManager], code: 200, input: [], output: CropLot, side_effects: [] }
  - { method: GET, path: "/api/crop-lots", description: "List crop lots; filter by block_id; sorted by created_at ASC", roles: [Owner, FarmManager], code: 200, input: ["block_id?", "limit?", "offset?"], output: "CropLot[]", side_effects: [] }
  - { method: GET, path: "/api/crop-lots/{id}/stand-buckets", description: "List the lot's six buckets; sorted by height_class in declared enum order (H_4_5 first)", roles: [Owner, FarmManager], code: 200, input: ["limit?", "offset?"], output: "StandBucket[]", side_effects: [] }
  - { method: GET, path: "/api/crop-lots/{id}/surveys", description: "List surveys of the lot; sorted by created_at ASC", roles: [Owner, FarmManager], code: 200, input: ["limit?", "offset?"], output: "InventorySurvey[]", side_effects: [] }

  # --- InventorySurvey ---
  - { method: POST, path: "/api/surveys", description: "Create a survey in DRAFT (no bucket effect until posted)", roles: [FarmManager], code: 201, input: [crop_lot_id, surveyed_counts], output: InventorySurvey, side_effects: [] }
  - { method: POST, path: "/api/surveys/{id}/post", description: "Post a DRAFT survey: re-baselines buckets (inventory_book_vs_survey), runs over_reservation_sweep, supersedes prior POSTED survey; OCC on CropLot.version", roles: [FarmManager], code: 200, input: [expected_crop_lot_version], output: InventorySurvey, side_effects: ["bucket re-baseline + counter reset", "over_reservation_sweep", "prior POSTED survey -> SUPERSEDED", "increments CropLot.version by 1"] }

  # --- BuyerAccount ---
  - { method: POST, path: "/api/buyer-accounts", description: "Create a wholesale buyer (GOOD_STANDING, exposure 0)", roles: [Owner], code: 201, input: [name, credit_limit_cents], output: BuyerAccount, side_effects: [] }
  - { method: GET, path: "/api/buyer-accounts/{id}", description: "Read a buyer; WholesaleBuyer may read only its own id", roles: [Owner, WholesaleBuyer], code: 200, input: [], output: BuyerAccount, side_effects: [] }
  - { method: POST, path: "/api/buyer-accounts/{id}/set-standing", description: "Set buyer standing per BuyerAccount state machine", roles: [Owner], code: 200, input: [to_standing], output: BuyerAccount, side_effects: ["standing transition", "increments BuyerAccount.version by 1"] }

  # --- WholesaleOrder ---
  - { method: POST, path: "/api/wholesale-orders", description: "Create a DRAFT order; posture BOOKING required; buyer_account_id must equal X-User-ID", roles: [WholesaleBuyer], code: 201, input: [season_id, buyer_account_id, species, height_class, quantity, unit_price_cents], output: WholesaleOrder, side_effects: [] }
  - { method: GET, path: "/api/wholesale-orders/{id}", description: "Read an order; WholesaleBuyer may read only own orders", roles: [Owner, FarmManager, WholesaleBuyer], code: 200, input: [], output: WholesaleOrder, side_effects: [] }
  - { method: GET, path: "/api/wholesale-orders", description: "List orders; filters buyer_account_id / season_id / status; sorted by created_at ASC; WholesaleBuyer sees only own orders", roles: [Owner, FarmManager, WholesaleBuyer], code: 200, input: ["buyer_account_id?", "season_id?", "status?", "limit?", "offset?"], output: "WholesaleOrder[]", side_effects: [] }
  - { method: POST, path: "/api/wholesale-orders/{id}/submit", description: "Submit DRAFT order: computes invoice (order_invoice), checks buyer standing + credit limit, adds exposure", roles: [WholesaleBuyer], code: 200, input: [], output: WholesaleOrder, side_effects: ["invoice computed", "buyer exposure_cents += invoice_total_cents", "increments WholesaleOrder.version by 1"] }
  - { method: POST, path: "/api/wholesale-orders/{id}/cancel", description: "Cancel a non-terminal order with no CUT/LOADED allocations; releases RESERVED allocations, removes exposure", roles: [WholesaleBuyer, FarmManager], code: 200, input: [], output: WholesaleOrder, side_effects: ["RESERVED allocations -> RELEASED, bucket reserved restored", "buyer exposure_cents -= invoice_total_cents (SUBMITTED/ALLOCATED only)", "increments WholesaleOrder.version by 1"] }
  - { method: POST, path: "/api/wholesale-orders/{id}/allocate", description: "Allocate up to `quantity` trees via allocation_waterfall selector; creates 1..N Allocations; OCC on WholesaleOrder.version", roles: [FarmManager], code: 200, input: [quantity, expected_order_version], output: "{ order_id: string, allocated_now: integer, allocated_total: integer, allocation_ids: string[], order_status: string, order_version: integer }", side_effects: ["allocations created; bucket reserved_count += per bucket", "order allocated_qty recompute; SUBMITTED -> ALLOCATED when fully allocated", "increments WholesaleOrder.version by 1"] }

  # --- Allocation ---
  - { method: GET, path: "/api/allocations/{id}", description: "Read an allocation", roles: [Owner, FarmManager, WholesaleBuyer], code: 200, input: [], output: Allocation, side_effects: [] }
  - { method: GET, path: "/api/allocations", description: "List allocations; filters order_id / bucket_id / status; sorted by created_at ASC", roles: [Owner, FarmManager, WholesaleBuyer], code: 200, input: ["order_id?", "bucket_id?", "status?", "limit?", "offset?"], output: "Allocation[]", side_effects: [] }
  - { method: POST, path: "/api/allocations/{id}/release", description: "Release a RESERVED allocation back to its bucket", roles: [FarmManager], code: 200, input: [], output: Allocation, side_effects: ["bucket reserved_count -= quantity", "order allocated_qty -= quantity; ALLOCATED -> SUBMITTED regression possible", "increments Allocation.version by 1"] }

  # --- Crew ---
  - { method: POST, path: "/api/crews", description: "Hire a crew (status ACTIVE); any non-CLOSED posture", roles: [FarmManager], code: 201, input: [season_id, crew_code, size], output: Crew, side_effects: [] }
  - { method: GET, path: "/api/crews/{id}", description: "Read a crew", roles: [Owner, FarmManager, CrewLead], code: 200, input: [], output: Crew, side_effects: [] }
  - { method: GET, path: "/api/crews", description: "List crews; filter by season_id; sorted by created_at ASC", roles: [Owner, FarmManager, CrewLead], code: 200, input: ["season_id?", "limit?", "offset?"], output: "Crew[]", side_effects: [] }
  - { method: POST, path: "/api/crews/{id}/lay-off", description: "Lay off an ACTIVE crew", roles: [FarmManager], code: 200, input: [], output: Crew, side_effects: ["Crew ACTIVE -> LAID_OFF", "increments Crew.version by 1"] }

  # --- HarvestTicket ---
  - { method: POST, path: "/api/harvest-tickets", description: "Crew lead posts a day's cut-and-bale ticket (born POSTED): posture HARVEST, work_date in window, block HARVESTABLE, crew ACTIVE and not double-booked, lines cut against allocations of this block; decrements buckets, advances allocations, computes crew_ticket_pay", roles: [CrewLead], code: 201, input: [crew_id, block_id, work_date, hours_worked, lines], output: HarvestTicket, side_effects: ["per line: allocation cut_qty += cut_count (RESERVED -> CUT at parity); bucket standing_count -= cut_count, reserved_count -= cut_count, cut_cumulative += cut_count", "pay fields computed", "CropLot may auto-DEPLETE"] }
  - { method: GET, path: "/api/harvest-tickets/{id}", description: "Read a ticket", roles: [Owner, FarmManager, CrewLead], code: 200, input: [], output: HarvestTicket, side_effects: [] }
  - { method: GET, path: "/api/harvest-tickets", description: "List tickets; filters crew_id / block_id; sorted by created_at ASC; CrewLead sees only own crew's tickets", roles: [Owner, FarmManager, CrewLead], code: 200, input: ["crew_id?", "block_id?", "limit?", "offset?"], output: "HarvestTicket[]", side_effects: [] }
  - { method: POST, path: "/api/harvest-tickets/{id}/void", description: "Void a POSTED ticket: full compensating reversal of cut effects", roles: [FarmManager], code: 200, input: [], output: HarvestTicket, side_effects: ["cut effects reversed on allocations and buckets (see HarvestTicket state machine)", "increments HarvestTicket.version by 1"] }

  # --- Load ---
  - { method: POST, path: "/api/loads", description: "Create a BUILDING load; posture HARVEST or SHIPPING; pickup window inside shipping window; buffered dock-window conflict check (30 min)", roles: [FarmManager], code: 201, input: [season_id, carrier_name, capacity_units, pickup_window_start, pickup_window_end], output: Load, side_effects: [] }
  - { method: GET, path: "/api/loads/{id}", description: "Read a load", roles: [Owner, FarmManager], code: 200, input: [], output: Load, side_effects: [] }
  - { method: GET, path: "/api/loads", description: "List loads; filter by season_id; sorted by created_at ASC", roles: [Owner, FarmManager], code: 200, input: ["season_id?", "limit?", "offset?"], output: "Load[]", side_effects: [] }
  - { method: POST, path: "/api/loads/{id}/lines", description: "Add cut trees: allocation must be CUT with headroom; posture HARVEST; capacity checked via load_unit_tally", roles: [FarmManager], code: 200, input: [allocation_id, quantity], output: Load, side_effects: ["line appended; total_units recomputed", "allocation loaded_qty += quantity; CUT -> LOADED at parity", "order auto-CLOSED when fully allocated and all allocations LOADED", "increments Load.version by 1"] }
  - { method: POST, path: "/api/loads/{id}/ship", description: "Ship a BUILDING load; posture SHIPPING; clock inside shipping window (inclusive)", roles: [FarmManager], code: 200, input: [], output: Load, side_effects: ["Load BUILDING -> SHIPPED", "increments Load.version by 1"] }
  - { method: POST, path: "/api/loads/{id}/cancel", description: "Cancel a BUILDING load; lines' allocations revert toward CUT", roles: [FarmManager], code: 200, input: [], output: Load, side_effects: ["loaded quantities rolled back to allocations", "increments Load.version by 1"] }

  # --- Consignment ---
  - { method: POST, path: "/api/consignments", description: "Create a DRAFT consignment contract; posture BOOKING or HARVEST", roles: [FarmManager], code: 201, input: [season_id, bucket_id, lot_name, quantity, unit_price_cents, max_return_pct], output: Consignment, side_effects: [] }
  - { method: GET, path: "/api/consignments/{id}", description: "Read a consignment", roles: [Owner, FarmManager], code: 200, input: [], output: Consignment, side_effects: [] }
  - { method: GET, path: "/api/consignments", description: "List consignments; filters season_id / bucket_id; sorted by created_at ASC", roles: [Owner, FarmManager], code: 200, input: ["season_id?", "bucket_id?", "limit?", "offset?"], output: "Consignment[]", side_effects: [] }
  - { method: POST, path: "/api/consignments/{id}/deliver", description: "Deliver trees to the retail lot: decrements bucket, computes provisional settlement", roles: [FarmManager], code: 200, input: [delivered_count], output: Consignment, side_effects: ["bucket standing_count -= delivered_count; consigned_cumulative += delivered_count", "provisional_settlement_cents computed", "increments Consignment.version by 1"] }
  - { method: POST, path: "/api/consignments/{id}/report-return", description: "Report cumulative unsold returns; DELIVERED -> SETTLING, or DISPUTED -> SETTLING re-report", roles: [FarmManager], code: 200, input: [returned_count], output: Consignment, side_effects: ["returned_count set", "increments Consignment.version by 1"] }
  - { method: POST, path: "/api/consignments/{id}/settle", description: "Settle a SETTLING consignment (posture SETTLEMENT): computes final settlement", roles: [FarmManager], code: 200, input: [], output: Consignment, side_effects: ["final_settlement_cents computed", "increments Consignment.version by 1"] }
  - { method: POST, path: "/api/consignments/{id}/dispute", description: "Dispute a SETTLING consignment (posture SETTLEMENT)", roles: [FarmManager], code: 200, input: [], output: Consignment, side_effects: ["Consignment SETTLING -> DISPUTED", "increments Consignment.version by 1"] }

  # --- UcutTag ---
  - { method: POST, path: "/api/ucut-tags", description: "Sell a choose-and-cut tag at the farm gate: posture HARVEST, block HARVESTABLE + ucut_designated, bucket standing >= 1; tree claimed immediately; expires_at = now + 48h", roles: [FarmManager], code: 201, input: [block_id, bucket_id, customer_name, price_cents], output: UcutTag, side_effects: ["bucket standing_count -= 1; tagged_active_count += 1"] }
  - { method: GET, path: "/api/ucut-tags/{id}", description: "Read a tag", roles: [Owner, FarmManager], code: 200, input: [], output: UcutTag, side_effects: [] }
  - { method: GET, path: "/api/ucut-tags", description: "List tags; filters block_id / bucket_id / status; sorted by created_at ASC", roles: [Owner, FarmManager], code: 200, input: ["block_id?", "bucket_id?", "status?", "limit?", "offset?"], output: "UcutTag[]", side_effects: [] }
  - { method: POST, path: "/api/ucut-tags/{id}/redeem", description: "Redeem an ACTIVE tag (customer cut the tree)", roles: [FarmManager], code: 200, input: [], output: UcutTag, side_effects: ["bucket tagged_active_count -= 1; ucut_sold_cumulative += 1", "increments UcutTag.version by 1"] }
  - { method: POST, path: "/api/ucut-tags/{id}/release", description: "Release an ACTIVE tag early (tree back to pool)", roles: [FarmManager], code: 200, input: [], output: UcutTag, side_effects: ["bucket tagged_active_count -= 1; standing_count += 1", "increments UcutTag.version by 1"] }

  # --- CullRecord ---
  - { method: POST, path: "/api/cull-records", description: "Record shrink/cull on a bucket; count <= available_count; any non-CLOSED posture", roles: [FarmManager], code: 201, input: [bucket_id, count, reason], output: CullRecord, side_effects: ["bucket standing_count -= count; culled_cumulative += count", "CropLot may auto-DEPLETE"] }
  - { method: GET, path: "/api/cull-records/{id}", description: "Read a cull record", roles: [Owner, FarmManager], code: 200, input: [], output: CullRecord, side_effects: [] }
  - { method: GET, path: "/api/cull-records", description: "List cull records; filter by bucket_id; sorted by created_at ASC", roles: [Owner, FarmManager], code: 200, input: ["bucket_id?", "limit?", "offset?"], output: "CullRecord[]", side_effects: [] }

  # --- ReplantPlan ---
  - { method: POST, path: "/api/replant-plans", description: "Propose replanting a HARVESTED block; proposed_by_user_id = X-User-ID", roles: [FarmManager], code: 201, input: [block_id, species, planned_count], output: ReplantPlan, side_effects: [] }
  - { method: GET, path: "/api/replant-plans/{id}", description: "Read a replant plan", roles: [Owner, FarmManager], code: 200, input: [], output: ReplantPlan, side_effects: [] }
  - { method: GET, path: "/api/replant-plans", description: "List replant plans; filter by block_id; sorted by created_at ASC", roles: [Owner, FarmManager], code: 200, input: ["block_id?", "limit?", "offset?"], output: "ReplantPlan[]", side_effects: [] }
  - { method: POST, path: "/api/replant-plans/{id}/approve", description: "Owner approves; approver must differ from proposer (SoD)", roles: [Owner], code: 200, input: [], output: ReplantPlan, side_effects: ["approved_by_user_id set", "increments ReplantPlan.version by 1"] }
  - { method: POST, path: "/api/replant-plans/{id}/reject", description: "Owner rejects; rejector must differ from proposer (SoD)", roles: [Owner], code: 200, input: [], output: ReplantPlan, side_effects: ["increments ReplantPlan.version by 1"] }
  - { method: POST, path: "/api/replant-plans/{id}/execute", description: "Execute an APPROVED plan: creates successor CropLot (planned_count at H_4_5), block HARVESTED -> PLANTED", roles: [FarmManager], code: 200, input: [], output: ReplantPlan, side_effects: ["CropLot + six StandBuckets created", "Block HARVESTED -> PLANTED", "created_crop_lot_id set", "increments ReplantPlan.version by 1"] }

# =============================================================================
# §1.6 Error Code Catalog
# =============================================================================
errors:
  - { id: ERR_UNAUTHENTICATED, http: 401, condition: "missing or unrecognized X-User-Role / X-User-ID headers" }
  - { id: ERR_FORBIDDEN, http: 403, condition: "role not permitted, or entity-backed ownership mismatch (buyer/crew acting on another's resource)" }
  - { id: ERR_SOD_VIOLATION, http: 403, condition: "replant approver/rejector X-User-ID equals proposed_by_user_id" }
  - { id: ERR_NOT_FOUND, http: 404, condition: "path id or referenced FK does not exist" }
  - { id: ERR_MALFORMED_REQUEST, http: 400, condition: "missing required field, wrong type, invalid enum member, or quantity/count below minimum" }
  - { id: ERR_STALE_VERSION, http: 412, condition: "expected_*_version does not match the parent entity's current version (OCC)" }
  - { id: ERR_INVALID_STATE, http: 409, condition: "target resource not in a valid from-state for the transition (including terminal lockdown and non-adjacent posture targets)" }
  - { id: ERR_POSTURE_FORBIDS, http: 409, condition: "season posture does not permit this operation" }
  - { id: ERR_POSTURE_GUARD_FAILED, http: 409, condition: "advance-posture guard unmet (clock gate or child-state gate)" }
  - { id: ERR_OUTSIDE_HARVEST_WINDOW, http: 422, condition: "ticket work_date outside [harvest_window_start, harvest_window_end] inclusive" }
  - { id: ERR_OUTSIDE_SHIPPING_WINDOW, http: 422, condition: "ship clock outside shipping window (inclusive), or load pickup window not contained in it" }
  - { id: ERR_BLOCK_NOT_HARVESTABLE, http: 409, condition: "ticket/tag references a block whose rotation_state != HARVESTABLE" }
  - { id: ERR_BLOCK_OCCUPIED, http: 409, condition: "lot create on non-RESTING block, or replant propose/execute on non-HARVESTED block" }
  - { id: ERR_BLOCK_NOT_UCUT, http: 422, condition: "u-cut tag on a block with ucut_designated == false" }
  - { id: ERR_CREW_NOT_ACTIVE, http: 409, condition: "ticket posted by a LAID_OFF crew" }
  - { id: ERR_BUYER_CREDIT_HOLD, http: 422, condition: "order submit while buyer standing != GOOD_STANDING" }
  - { id: ERR_TICKET_BLOCK_MISMATCH, http: 422, condition: "ticket line allocation belongs to a crop lot of a different block" }
  - { id: ERR_ALLOCATION_NOT_CUT, http: 409, condition: "load line references an allocation not in CUT, or quantity exceeds cut-but-unloaded headroom" }
  - { id: ERR_TICKET_NOT_VOIDABLE, http: 409, condition: "ticket void outside HARVEST posture or with a line allocation already LOADED" }
  - { id: ERR_ORDER_HAS_CUT_ALLOCATIONS, http: 409, condition: "order cancel with an allocation in CUT or LOADED" }
  - { id: ERR_NO_ELIGIBLE_INVENTORY, http: 422, condition: "allocation waterfall found zero available trees in the eligible pool" }
  - { id: ERR_INSUFFICIENT_STANDING, http: 422, condition: "consignment delivered_count exceeds bucket available_count" }
  - { id: ERR_CULL_EXCEEDS_STANDING, http: 422, condition: "cull count exceeds bucket available_count" }
  - { id: ERR_BUCKET_EMPTY, http: 422, condition: "u-cut tag against a bucket with standing_count == 0" }
  - { id: ERR_CREW_DOUBLE_BOOKED, http: 409, condition: "crew already has a POSTED ticket on the same work_date" }
  - { id: ERR_DOCK_WINDOW_CONFLICT, http: 409, condition: "load pickup window plus 30-minute buffer overlaps another non-CANCELLED load of the season" }
  - { id: ERR_LOAD_OVER_CAPACITY, http: 422, condition: "line-add would push load total_units above capacity_units" }
  - { id: ERR_CUT_EXCEEDS_ALLOCATION, http: 422, condition: "ticket line cut_count exceeds the allocation's uncut remainder" }
  - { id: ERR_RETURN_EXCEEDS_DELIVERED, http: 422, condition: "consignment returned_count exceeds delivered_count" }
  - { id: ERR_CREDIT_LIMIT_EXCEEDED, http: 422, condition: "order submit would push buyer exposure above credit_limit_cents" }

# =============================================================================
# §1.7 RBAC Matrix
# =============================================================================
roles:
  - name: Owner
    description: "Farm owner; controls season lifecycle, ops runs, clock, buyer accounts, and replant approval"
    identity: opaque
    exclusive_operations:
      - "POST /api/seasons; POST /api/seasons/{id}/advance-posture; POST /api/seasons/{id}/run-ops"
      - "POST /api/_clock/set_current_utc"
      - "POST /api/buyer-accounts; POST /api/buyer-accounts/{id}/set-standing"
      - "POST /api/replant-plans/{id}/approve; POST /api/replant-plans/{id}/reject"
    shared_operations:
      - "GET reads on all resources"
  - name: FarmManager
    description: "Farm operations manager; runs blocks, lots, surveys, allocation, crews, tickets, loads, consignments, tags, culls, replant proposals"
    identity: opaque
    exclusive_operations:
      - "POST /api/blocks; POST /api/blocks/{id}/advance-rotation; POST /api/crop-lots"
      - "POST /api/surveys; POST /api/surveys/{id}/post"
      - "POST /api/wholesale-orders/{id}/allocate; POST /api/allocations/{id}/release"
      - "POST /api/crews; POST /api/crews/{id}/lay-off; POST /api/harvest-tickets/{id}/void"
      - "POST /api/loads and load line/ship/cancel actions"
      - "POST /api/consignments and deliver/report-return/settle/dispute actions"
      - "POST /api/ucut-tags and redeem/release actions; POST /api/cull-records"
      - "POST /api/replant-plans; POST /api/replant-plans/{id}/execute"
    shared_operations:
      - "GET reads on all resources; POST /api/wholesale-orders/{id}/cancel (shared with WholesaleBuyer)"
  - name: WholesaleBuyer
    description: "Wholesale customer; manages its own pre-season orders"
    identity: "entity_backed:BuyerAccount"
    exclusive_operations:
      - "POST /api/wholesale-orders; POST /api/wholesale-orders/{id}/submit"
    shared_operations:
