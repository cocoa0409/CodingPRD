  # ---------------------------------------------------------------- Rule 9 ---
  - rule_id: compensating_invariant
    instances:
      - name: voc_reservation_schedule_cancel_conserved
        grounds:
          - calculations.voc_cap_projection_check
          - state_machines.RunSlot.SCHEDULED_to_CANCELLED
          - entities.VocPermit.fields.reserved_kg
        distinguishing_aspect: |
          Conserved quantity = VOC kilograms on the permit ledger: scheduling reserves
          +0.277 kg (forward action) and cancelling releases exactly −0.277 kg
          (compensating action); after the pair, used_kg == 0, reserved_kg == 0 and the
          emission ledger holds zero entries — no drift in the conserved quantity.
        test_recipe:
          setup:
            - "Customer, spec, line, stage, permit cap 500.0 (used 0, reserved 0)"
            - "Lot qty 100 QUEUED"
          setup_api_calls:
            - call: "POST /ecoat/customers"
              payload: { name: "Acme Housings" }
              as: PlantAdmin
              captures: { c1: $.data.id }
            - call: "POST /ecoat/coating-specs"
              payload: { customer_id: "${c1}", color_code: "RAL9005", film_build_min_um: 18.0, film_build_max_um: 30.0, cure_metal_temp_c: 180.0, cure_minutes_at_temp: 20, adhesion_class_min: 2, impact_joules_min: 40.0, voc_g_per_l: 320.0, area_dm2_per_part: 12.0 }
              as: PlantAdmin
              captures: { spec1: $.data.id }
            - call: "POST /ecoat/paint-lines"
              payload: { name: "L1", current_color_code: "RAL9005", line_speed_fpm: 10.0, hanger_capacity_parts: 60, allocation_policy: "FULL_TO_NEXT_LOT" }
              as: PlantAdmin
              captures: { line1: $.data.id }
            - call: "POST /ecoat/pretreatment-stages"
              payload: { paint_line_id: "${line1}", stage_name: "alkaline_clean", sequence_no: 1, chemical_family: "CLEANER", conc_min_gpl: 20.0, conc_max_gpl: 30.0 }
              as: PlantAdmin
            - call: "POST /ecoat/voc-permits"
              payload: { period_start: "2026-05-01T00:00:00Z", period_end: "2026-06-01T00:00:00Z", cap_kg: 500.0 }
              as: PlantAdmin
              captures: { perm1: $.data.id }
            - call: "POST /ecoat/lots"
              payload: { customer_id: "${c1}", spec_id: "${spec1}", part_quantity: 100 }
              as: LineScheduler
              captures: { lot1: $.data.id }
            - call: "POST /ecoat/lots/${lot1}/accept"
              payload: {}
              as: LineScheduler
            - call: "GET /ecoat/paint-lines/${line1}"
              as: LineScheduler
              captures: { lv: $.data.version }
          trigger:
            - call: "POST /ecoat/run-slots"
              payload: { paint_line_id: "${line1}", lot_id: "${lot1}", start_utc: "2026-05-05T08:00:00Z", end_utc: "2026-05-05T10:00:00Z", parts_per_hanger: 20, expected_paint_line_version: "${lv}" }
              as: LineScheduler
              captures: { slot1: $.data.id }
            - call: "POST /ecoat/run-slots/${slot1}/cancel"
              payload: {}
              as: LineScheduler
          assert:
            - "After schedule: reserved_kg was 0.277 (forward action); after cancel: VocPermit.${perm1}.reserved_kg == 0.0"
            - "VocPermit.${perm1}.used_kg == 0.0 — no emission entry was ever posted"
            - "GET /ecoat/voc-permits/${perm1}/emission-entries returns an empty list (conserved ledger)"
            - "RunSlot.${slot1}.status == CANCELLED and Lot.${lot1}.status == QUEUED"

      - name: part_accountability_rework_cycle_conserved
        grounds:
          - calculations.lot_charge_finalization
          - state_machines.Lot.STRIPPING_to_QUEUED
          - entities.Lot.fields.outstanding_quantity
        distinguishing_aspect: |
          Conserved quantity = accounted parts (a unit-count invariant, different type
          than VOC mass): a full strip-and-repaint cycle scrapping 5 of 100 parts must
          leave part_quantity == passed + scrapped + outstanding exactly (100 == 95 + 5 + 0)
          at release, with total charges 132000 + 183915 = 315915 cents.
        test_recipe:
          setup:
            - "Customer, spec (area 12, adhesion_min 2, impact_min 40.0), line, stage, oven, permit cap 500.0"
            - "Lot qty 100: first pass reaches QC_PENDING, adhesion FAIL (1) → hold → rework approved → stripped with 5 scrapped → re-QUEUED (rework_count 1)"
          setup_api_calls:
            - call: "POST /ecoat/customers"
              payload: { name: "Acme Housings" }
              as: PlantAdmin
              captures: { c1: $.data.id }
            - call: "POST /ecoat/coating-specs"
              payload: { customer_id: "${c1}", color_code: "RAL9005", film_build_min_um: 18.0, film_build_max_um: 30.0, cure_metal_temp_c: 180.0, cure_minutes_at_temp: 20, adhesion_class_min: 2, impact_joules_min: 40.0, voc_g_per_l: 320.0, area_dm2_per_part: 12.0 }
              as: PlantAdmin
              captures: { spec1: $.data.id }
            - call: "POST /ecoat/paint-lines"
              payload: { name: "L1", current_color_code: "RAL9005", line_speed_fpm: 10.0, hanger_capacity_parts: 60, allocation_policy: "FULL_TO_NEXT_LOT" }
              as: PlantAdmin
              captures: { line1: $.data.id }
            - call: "POST /ecoat/pretreatment-stages"
              payload: { paint_line_id: "${line1}", stage_name: "alkaline_clean", sequence_no: 1, chemical_family: "CLEANER", conc_min_gpl: 20.0, conc_max_gpl: 30.0 }
              as: PlantAdmin
            - call: "POST /ecoat/cure-ovens"
              payload: { name: "OV-1", max_loads: 2 }
              as: PlantAdmin
              captures: { oven1: $.data.id }
            - call: "POST /ecoat/voc-permits"
              payload: { period_start: "2026-05-01T00:00:00Z", period_end: "2026-06-01T00:00:00Z", cap_kg: 500.0 }
              as: PlantAdmin
            - call: "POST /ecoat/lots"
              payload: { customer_id: "${c1}", spec_id: "${spec1}", part_quantity: 100 }
              as: LineScheduler
              captures: { lot1: $.data.id }
            - call: "POST /ecoat/lots/${lot1}/accept"
              payload: {}
              as: LineScheduler
            - call: "GET /ecoat/paint-lines/${line1}"
              as: LineScheduler
              captures: { lv1: $.data.version }
            - call: "POST /ecoat/run-slots"
              payload: { paint_line_id: "${line1}", lot_id: "${lot1}", start_utc: "2026-05-05T08:00:00Z", end_utc: "2026-05-05T10:00:00Z", parts_per_hanger: 20, expected_paint_line_version: "${lv1}" }
              as: LineScheduler
              captures: { slot1: $.data.id }
            - call: "POST /ecoat/run-slots/${slot1}/start"
              payload: {}
              as: LineScheduler
            - call: "POST /ecoat/run-slots/${slot1}/complete"
              payload: { paint_used_liters: 0.95 }
              as: LineScheduler
            - call: "POST /ecoat/oven-cycles"
              payload: { lot_id: "${lot1}", oven_id: "${oven1}", entered_at: "2026-05-05T10:05:00Z", exited_at: "2026-05-05T10:45:00Z", min_metal_temp_c: 182.0, minutes_at_or_above_temp: 22 }
              as: QcInspector
              as_user_id: qc-1
            - call: "POST /ecoat/quality-tests"
              payload: { lot_id: "${lot1}", test_type: "ADHESION", measured_value: 1 }
              as: QcInspector
              as_user_id: qc-1
            - call: "GET /ecoat/lots/${lot1}/rework-orders"
              as: QualityManager
              captures: { ro1: "$.data[0].id" }
            - call: "POST /ecoat/rework-orders/${ro1}/approve"
              payload: {}
              as: QualityManager
              as_user_id: qm-1
            - call: "POST /ecoat/rework-orders/${ro1}/complete-strip"
              payload: { scrapped_quantity: 5 }
              as: QualityManager
              as_user_id: qm-1
            - call: "GET /ecoat/paint-lines/${line1}"
              as: LineScheduler
              captures: { lv2: $.data.version }
            - call: "POST /ecoat/run-slots"
              payload: { paint_line_id: "${line1}", lot_id: "${lot1}", start_utc: "2026-05-08T08:00:00Z", end_utc: "2026-05-08T10:00:00Z", parts_per_hanger: 20, expected_paint_line_version: "${lv2}" }
              as: LineScheduler
              captures: { slot2: $.data.id }
            - call: "POST /ecoat/run-slots/${slot2}/start"
              payload: {}
              as: LineScheduler
            - call: "POST /ecoat/run-slots/${slot2}/complete"
              payload: { paint_used_liters: 0.95 }
              as: LineScheduler
            - call: "POST /ecoat/oven-cycles"
              payload: { lot_id: "${lot1}", oven_id: "${oven1}", entered_at: "2026-05-08T10:05:00Z", exited_at: "2026-05-08T10:45:00Z", min_metal_temp_c: 182.0, minutes_at_or_above_temp: 22 }
              as: QcInspector
              as_user_id: qc-1
            - call: "POST /ecoat/quality-tests"
              payload: { lot_id: "${lot1}", test_type: "ADHESION", measured_value: 3 }
              as: QcInspector
              as_user_id: qc-1
            - call: "POST /ecoat/quality-tests"
              payload: { lot_id: "${lot1}", test_type: "IMPACT", measured_value: 50.0 }
              as: QcInspector
              as_user_id: qc-1
          trigger:
            - call: "POST /ecoat/lots/${lot1}/release"
              payload: {}
              as: QualityManager
              as_user_id: qm-1
          assert:
            - "Lot.${lot1}.status == RELEASED after the repaint cycle"
            - "Lot.${lot1}.passed_quantity == 95 and scrapped_quantity == 5 and outstanding_quantity == 0"
            - "Invariant: 95 + 5 + 0 == 100 == part_quantity — forward strip plus compensating repaint conserved accounted parts"
            - "Lot.${lot1}.total_charge_cents == 315915 (132000 base + 0 purge + 183915 rework)"
