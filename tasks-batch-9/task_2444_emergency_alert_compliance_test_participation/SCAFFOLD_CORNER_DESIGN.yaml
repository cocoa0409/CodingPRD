              captures: { plan_ne: "$.data.id" }
            - call: "POST /state-plans/${plan_ne}/activate"
              as: ComplianceAdmin
              as_user_id: adm-1
              payload: {}
            - call: "POST /_clock/set_current_utc"
              as: ComplianceAdmin
              as_user_id: adm-1
              payload: { to_iso8601: "2026-08-20T10:00:00Z" }
            - call: "POST /state-plans"
              as: ComplianceAdmin
              as_user_id: adm-1
              payload: { state_code: "KS", plan_version_label: "2026-R2", required_source_types: ["PEP"], mandatory_relay_event_codes: [] }
              captures: { plan_v2: "$.data.id" }
          trigger:
            - call: "POST /state-plans/${plan_v2}/activate"
              as: ComplianceAdmin
              as_user_id: adm-1
              payload: {}
            - call: "GET /state-plans/${plan_v1}"
              as: ComplianceAdmin
