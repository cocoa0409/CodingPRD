# §1.9 Scaffold Corner Design (Breadth Claim Index)
# Task 2862 - Security Awareness & Phishing Simulation
# Sections and claim_type values are taken verbatim from references/claim-extraction-guide.md.
# Every grounds entry resolves into SCAFFOLD.yaml §1.1-§1.7; every excluded_because cites a
# §1.8 instance that exists by name in SCAFFOLD_DIFFICULTY_DESIGN.yaml.
# Logical clock: the server starts at 2026-08-01T00:00:00Z and only POST /awareness/_clock/set_current_utc moves it.

scaffold_corner_design:
  - section: entities
    instances:
      - name: employee_creation_returns_201_with_every_declared_field
        claim_type: creation
        grounds:
          - entities.Employee
          - endpoints[POST /awareness/employees]
        distinguishing_aspect: "A POST with all six required inputs returns 201 and the response carries every declared Employee field, including the three state axes and both risk-score variants at their initial values."
        test_recipe:
          setup:
            - "Logical clock at its default 2026-08-01T00:00:00Z; empty employee registry."
          setup_api_calls:
            - { call: "POST /awareness/_clock/set_current_utc", payload: { to_iso8601: "2026-08-01T00:00:00Z" }, as: ProgramAdmin }
          trigger:
            - { call: "POST /awareness/employees", payload: { email: "ada.new@corp.example", full_name: "Ada New", department: "ENGINEERING", role_code: "ENGINEER", hire_date: "2020-04-01" }, as: ProgramAdmin, captures: { e: "$.data.id" } }
          assert:
            - "HTTP 201 and Employee.${e}.email == ada.new@corp.example, full_name == Ada New, department == ENGINEERING, role_code == ENGINEER, hire_date == 2020-04-01"
            - "Employee.${e}.employment_status == ACTIVE, compliance_state == COMPLIANT, access_posture == NONE"
            - "Employee.${e}.repeat_clicker_tier == 0, consecutive_clean_simulations == 0, reserved_simulation_slots == 0, active_suspension_count == 0"
            - "Employee.${e}.risk_score_provisional == 0.00 and risk_score_settled == 0.00"
            - "Employee.${e}.id, created_at, updated_at are present and version == 1"

      - name: employee_retrieval_returns_the_stored_row
        claim_type: retrieval
        grounds:
          - endpoints[GET /awareness/employees/{id}]
          - entities.Employee.fields.tenure_band
        distinguishing_aspect: "GET /{id} echoes exactly what POST persisted, including the server-derived tenure_band, with no version bump from the read."
        test_recipe:
          setup:
            - "Logical clock at 2026-08-01T00:00:00Z."
            - "One employee registered with hire_date 2026-07-25 (7 days of tenure)."
          setup_api_calls:
            - { call: "POST /awareness/_clock/set_current_utc", payload: { to_iso8601: "2026-08-01T00:00:00Z" }, as: ProgramAdmin }
            - { call: "POST /awareness/employees", payload: { email: "rea.read@corp.example", full_name: "Rea Read", department: "HR", role_code: "IC", hire_date: "2026-07-25" }, as: ProgramAdmin, captures: { e: "$.data.id", v: "$.data.version" } }
          trigger:
            - { call: "GET /awareness/employees/${e}", payload: {}, as: ProgramAdmin }
          assert:
            - "HTTP 200 and the returned id == ${e}"
            - "Employee.${e}.tenure_band == NEW_HIRE"
            - "Employee.${e}.version == ${v} (a read never bumps version)"
            - "full_name == Rea Read and department == HR"

      - name: employee_listing_filters_by_manager_id
        claim_type: listing
        grounds:
          - endpoints[GET /awareness/employees]
          - entities.Employee.fields.manager_id
        distinguishing_aspect: "The list endpoint is the reverse-reachability channel for Employee.manager_id: filtering by manager_id returns only that manager's direct reports and excludes the manager and unrelated employees."
        test_recipe:
          setup:
            - "Logical clock at 2026-08-01T00:00:00Z."
            - "One MANAGER employee with two direct reports and one unrelated employee in another department with no manager."
          setup_api_calls:
            - { call: "POST /awareness/_clock/set_current_utc", payload: { to_iso8601: "2026-08-01T00:00:00Z" }, as: ProgramAdmin }
            - { call: "POST /awareness/employees", payload: { email: "lila.mgr@corp.example", full_name: "Lila Lead", department: "SALES", role_code: "MANAGER", hire_date: "2014-01-01" }, as: ProgramAdmin, captures: { mgr: "$.data.id" } }
            - { call: "POST /awareness/employees", payload: { email: "rep1@corp.example", full_name: "Rep One", department: "SALES", role_code: "IC", hire_date: "2019-01-01", manager_id: "${mgr}" }, as: ProgramAdmin, captures: { r1: "$.data.id" } }
            - { call: "POST /awareness/employees", payload: { email: "rep2@corp.example", full_name: "Rep Two", department: "SALES", role_code: "IC", hire_date: "2019-02-01", manager_id: "${mgr}" }, as: ProgramAdmin, captures: { r2: "$.data.id" } }
            - { call: "POST /awareness/employees", payload: { email: "other@corp.example", full_name: "Otto Other", department: "IT", role_code: "IT_ADMIN", hire_date: "2019-03-01" }, as: ProgramAdmin, captures: { o: "$.data.id" } }
          trigger:
            - { call: "GET /awareness/employees", payload: { manager_id: "${mgr}" }, as: ProgramAdmin, captures: { first: "$.data[0].id" } }
          assert:
            - "HTTP 200 and the returned list contains exactly 2 rows: ${r1} and ${r2}"
            - "the list does not contain ${mgr} or ${o}"
            - "every returned row has manager_id == ${mgr}"

      - name: employee_get_unknown_id_returns_404_employee_not_found
        claim_type: not_found
        grounds:
          - errors[ERR_EMPLOYEE_NOT_FOUND]
          - endpoints[GET /awareness/employees/{id}]
        distinguishing_aspect: "A syntactically valid but unregistered employee id returns 404 ERR_EMPLOYEE_NOT_FOUND rather than an empty 200 envelope."
        test_recipe:
          setup:
            - "Logical clock at 2026-08-01T00:00:00Z; one unrelated employee exists so the table is non-empty."
          setup_api_calls:
            - { call: "POST /awareness/_clock/set_current_utc", payload: { to_iso8601: "2026-08-01T00:00:00Z" }, as: ProgramAdmin }
            - { call: "POST /awareness/employees", payload: { email: "only@corp.example", full_name: "Ona Only", department: "IT", role_code: "IT_ADMIN", hire_date: "2018-01-01" }, as: ProgramAdmin, captures: { e: "$.data.id" } }
          trigger:
            - { call: "GET /awareness/employees/00000000-0000-4000-8000-000000000000", payload: {}, as: ProgramAdmin, captures: { err: "$.data.error_id" } }
          assert:
            - "HTTP 404 with error_id == ERR_EMPLOYEE_NOT_FOUND"
            - "the existing employee ${e} is unaffected and still readable"

      - name: create_employee_missing_required_department_returns_400_invalid_request
        claim_type: required_fields
        grounds:
          - errors[ERR_INVALID_REQUEST]
          - endpoints[POST /awareness/employees]
          - entities.Employee.fields.department
        distinguishing_aspect: "department has source input and no default, so omitting it must fail the request-shape check with 400 ERR_INVALID_REQUEST before any row is written."
        test_recipe:
          setup:
            - "Logical clock at 2026-08-01T00:00:00Z; empty employee registry."
          setup_api_calls:
            - { call: "POST /awareness/_clock/set_current_utc", payload: { to_iso8601: "2026-08-01T00:00:00Z" }, as: ProgramAdmin }
          trigger:
            - { call: "POST /awareness/employees", payload: { email: "nod@corp.example", full_name: "No Dept", role_code: "IC", hire_date: "2019-01-01" }, as: ProgramAdmin, captures: { err: "$.data.error_id" } }
          assert:
            - "HTTP 400 with error_id == ERR_INVALID_REQUEST"
            - "GET /awareness/employees returns 0 rows: no partial employee was persisted"

      - name: training_module_defaults_applied_when_optional_inputs_omitted
        claim_type: defaults
        grounds:
          - entities.TrainingModule.fields.passing_score_pct
          - entities.TrainingModule.fields.reminder_offsets_days
          - entities.TrainingModule.fields.escalate_after_reminders
          - entities.TrainingModule.fields.max_extension_days
          - entities.TrainingModule.fields.applies_to_role_codes
          - endpoints[POST /awareness/training-modules]
        distinguishing_aspect: "Creating a module with only the three required inputs must materialise all five declared defaults (passing_score_pct 80, reminder_offsets_days [7,3,1,-2], escalate_after_reminders 3, max_extension_days 10, applies_to_role_codes []) plus status DRAFT."
        test_recipe:
          setup:
            - "Logical clock at 2026-08-01T00:00:00Z; no modules exist."
          setup_api_calls:
            - { call: "POST /awareness/_clock/set_current_utc", payload: { to_iso8601: "2026-08-01T00:00:00Z" }, as: ProgramAdmin }
          trigger:
            - { call: "POST /awareness/training-modules", payload: { code: "DEFAULTS-1", title: "Defaults Probe", module_type: "ANNUAL" }, as: ProgramAdmin, captures: { m: "$.data.id" } }
            - { call: "GET /awareness/training-modules/${m}", payload: {}, as: ProgramAdmin }
          assert:
            - "HTTP 201 and TrainingModule.${m}.passing_score_pct == 80"
            - "TrainingModule.${m}.reminder_offsets_days == [7, 3, 1, -2]"
            - "TrainingModule.${m}.escalate_after_reminders == 3 and max_extension_days == 10"
            - "TrainingModule.${m}.applies_to_role_codes == [] and criticality == STANDARD"
            - "TrainingModule.${m}.status == DRAFT, published_at == null, retired_at == null"

      - name: employee_tenure_band_computed_from_hire_date_client_input_ignored
        claim_type: computed_fields
        grounds:
          - calculations.employee_tenure_band
          - entities.Employee.fields.tenure_band
          - endpoints[POST /awareness/employees]
        distinguishing_aspect: "tenure_band has source computed: a client-supplied tenure_band is ignored and the band is derived from hire_date against the logical clock, so hire_date 2026-05-01 (92 days) yields RAMPING even when the payload asks for VETERAN."
        test_recipe:
          setup:
            - "Logical clock at 2026-08-01T00:00:00Z."
          setup_api_calls:
            - { call: "POST /awareness/_clock/set_current_utc", payload: { to_iso8601: "2026-08-01T00:00:00Z" }, as: ProgramAdmin }
          trigger:
            - { call: "POST /awareness/employees", payload: { email: "ramp@corp.example", full_name: "Ray Ramp", department: "ENGINEERING", role_code: "ENGINEER", hire_date: "2026-05-01", tenure_band: "VETERAN" }, as: ProgramAdmin, captures: { e: "$.data.id" } }
          assert:
            - "Employee.${e}.tenure_band == RAMPING (92 days of tenure: >= 90 and < 365), not the submitted VETERAN"
            - "Employee.${e}.hire_date == 2026-05-01"
            - "a second employee created with hire_date 2026-07-25 reads NEW_HIRE and one with 2018-01-01 reads VETERAN under the same clock"

      - name: incident_record_system_fields_generated_by_server_input_ignored
        claim_type: system_fields
        grounds:
          - entities.IncidentRecord
          - entities.IncidentRecord.fields.phish_related
          - endpoints[POST /awareness/incidents]
        distinguishing_aspect: "IncidentRecord.id and created_at are server-minted and phish_related is derived from incident_type, so a payload attempting to set id or phish_related is ignored while the derived flag still reads true for CREDENTIAL_PHISH."
        test_recipe:
          setup:
            - "Logical clock at 2026-08-01T00:00:00Z."
          setup_api_calls:
            - { call: "POST /awareness/_clock/set_current_utc", payload: { to_iso8601: "2026-08-01T00:00:00Z" }, as: ProgramAdmin }
          trigger:
            - { call: "POST /awareness/incidents", payload: { incident_type: "CREDENTIAL_PHISH", severity: "HIGH", department: "FINANCE", occurred_at: "2026-07-30T12:00:00Z", summary: "Finance clerk entered credentials on a lookalike portal.", id: "11111111-1111-4111-8111-111111111111", phish_related: false }, as: SecurityAnalyst, captures: { i: "$.data.id" } }
          assert:
            - "HTTP 201 and IncidentRecord.${i}.id != 11111111-1111-4111-8111-111111111111 (server-minted)"
            - "IncidentRecord.${i}.phish_related == true (derived from CREDENTIAL_PHISH, the submitted false is ignored)"
            - "IncidentRecord.${i}.created_at is present and equals the logical clock 2026-08-01T00:00:00Z"
            - "IncidentRecord.${i}.occurred_at == 2026-07-30T12:00:00Z, severity == HIGH, department == FINANCE"

      - name: create_incident_invalid_severity_enum_rejected
        claim_type: type_constraints
        grounds:
          - entities.IncidentRecord.fields.severity
          - errors[ERR_INVALID_REQUEST]
          - endpoints[POST /awareness/incidents]
        distinguishing_aspect: "severity is constrained to {LOW, MEDIUM, HIGH, CRITICAL}; a member outside that set is a request-shape failure (400), not a silently coerced value."
        test_recipe:
          setup:
            - "Logical clock at 2026-08-01T00:00:00Z; no incidents recorded."
          setup_api_calls:
            - { call: "POST /awareness/_clock/set_current_utc", payload: { to_iso8601: "2026-08-01T00:00:00Z" }, as: ProgramAdmin }
          trigger:
            - { call: "POST /awareness/incidents", payload: { incident_type: "BEC", severity: "SEVERE", department: "SALES", occurred_at: "2026-07-30T12:00:00Z", summary: "Invalid severity probe." }, as: SecurityAnalyst, captures: { err: "$.data.error_id" } }
          assert:
            - "HTTP 400 with error_id == ERR_INVALID_REQUEST"
            - "GET /awareness/incidents returns 0 rows"
            - "the same call with severity CRITICAL returns 201"

      - name: incident_record_immutability_no_version_field
        claim_type: immutability
        grounds:
          - entities.IncidentRecord
          - endpoints[GET /awareness/incidents/{id}]
        distinguishing_aspect: "IncidentRecord declares common_fields false, so its rows carry id/created_at but no version and no updated_at, and §1.5 exposes no mutating endpoint for them - the audit trail is append-only."
        test_recipe:
          setup:
            - "Logical clock at 2026-08-01T00:00:00Z; one recorded incident."
          setup_api_calls:
            - { call: "POST /awareness/_clock/set_current_utc", payload: { to_iso8601: "2026-08-01T00:00:00Z" }, as: ProgramAdmin }
            - { call: "POST /awareness/incidents", payload: { incident_type: "MALWARE_DELIVERY", severity: "MEDIUM", department: "IT", occurred_at: "2026-07-28T08:00:00Z", summary: "Macro-enabled attachment blocked at the gateway." }, as: SecurityAnalyst, captures: { i: "$.data.id" } }
          trigger:
            - { call: "GET /awareness/incidents/${i}", payload: {}, as: SecurityAnalyst }
          assert:
            - "HTTP 200 and the response carries no version field and no updated_at field"
            - "IncidentRecord.${i}.phish_related == false (MALWARE_DELIVERY is outside {CREDENTIAL_PHISH, BEC})"
            - "§1.5 declares no PATCH, PUT or DELETE for /awareness/incidents/{id}"

      - name: interaction_event_immutability_append_only_sequence
        claim_type: immutability
        grounds:
          - entities.InteractionEvent
          - entities.InteractionEvent.fields.sequence_index
          - endpoints[GET /awareness/simulation-deliveries/{id}/interaction-events]
        distinguishing_aspect: "InteractionEvent is also common_fields false and its log is append-only: sequence_index is 1 + the count of prior events on that delivery and the ordering is by sequence_index ASC, with no endpoint able to rewrite an event."
        test_recipe:
          setup:
            - "Logical clock at 2026-08-01T00:00:00Z."
            - "One employee in IT with a DELIVERED delivery from a campaign launched 2026-08-02T09:00:00Z."
            - "Two events appended in order: OPEN at 2026-08-02T09:05:00Z then CLICK at 2026-08-02T09:10:00Z."
          setup_api_calls:
            - { call: "POST /awareness/_clock/set_current_utc", payload: { to_iso8601: "2026-08-01T00:00:00Z" }, as: ProgramAdmin }
            - { call: "POST /awareness/employees", payload: { email: "eli.event@corp.example", full_name: "Eli Event", department: "IT", role_code: "IT_ADMIN", hire_date: "2017-05-05" }, as: ProgramAdmin, captures: { e: "$.data.id" } }
            - { call: "POST /awareness/phishing-templates", payload: { name: "Gateway Probe", pretext_category: "PACKAGE_DELIVERY", difficulty_tier: "TIER_1_BASIC", theme_tags: ["CURIOSITY"], credential_capture_enabled: false }, as: CampaignAuthor, as_user_id: "author-1", captures: { tpl: "$.data.id" } }
            - { call: "POST /awareness/phishing-templates/${tpl}/approve-for-use", payload: {}, as: CampaignApprover, as_user_id: "approver-1" }
            - { call: "POST /awareness/campaigns", payload: { name: "IT Event Wave", template_id: "${tpl}", difficulty_tier: "TIER_1_BASIC", target_departments: ["IT"], communication_policy_ack: true }, as: CampaignAuthor, as_user_id: "author-1", captures: { c: "$.data.id" } }
            - { call: "POST /awareness/campaigns/${c}/submit-for-review", payload: {}, as: CampaignAuthor, as_user_id: "author-1" }
            - { call: "POST /awareness/campaigns/${c}/approve", payload: {}, as: CampaignApprover, as_user_id: "approver-1", captures: { c_v: "$.data.version" } }
            - { call: "POST /awareness/campaigns/${c}/schedule", payload: { scheduled_send_at: "2026-08-02T09:00:00Z", expected_campaign_version: "${c_v}" }, as: CampaignAuthor, as_user_id: "author-1" }
            - { call: "POST /awareness/_clock/set_current_utc", payload: { to_iso8601: "2026-08-02T09:00:00Z" }, as: ProgramAdmin }
            - { call: "POST /awareness/campaigns/${c}/launch", payload: {}, as: ProgramAdmin }
            - { call: "GET /awareness/simulation-deliveries", payload: { campaign_id: "${c}", employee_id: "${e}" }, as: ProgramAdmin, captures: { d: "$.data[0].id" } }
            - { call: "POST /awareness/_clock/set_current_utc", payload: { to_iso8601: "2026-08-02T09:10:00Z" }, as: ProgramAdmin }
            - { call: "POST /awareness/simulation-deliveries/${d}/interactions", payload: { event_type: "OPEN", occurred_at: "2026-08-02T09:05:00Z", source: "MAIL_GATEWAY" }, as: ProgramAdmin, captures: { ev1: "$.data.id", seq1: "$.data.sequence_index" } }
            - { call: "POST /awareness/simulation-deliveries/${d}/interactions", payload: { event_type: "CLICK", occurred_at: "2026-08-02T09:10:00Z", source: "LANDING_PAGE" }, as: ProgramAdmin, captures: { ev2: "$.data.id", seq2: "$.data.sequence_index" } }
          trigger:
            - { call: "GET /awareness/simulation-deliveries/${d}/interaction-events", payload: {}, as: SecurityAnalyst, captures: { first_seq: "$.data[0].sequence_index" } }
          assert:
            - "HTTP 200 with exactly 2 rows ordered by sequence_index ASC"
            - "the OPEN event has sequence_index == 1 and the CLICK event has sequence_index == 2"
            - "neither row carries a version field or an updated_at field"
            - "SimulationDelivery.${d}.state == CLICKED and first_click_at == 2026-08-02T09:10:00Z"

      - name: assignment_foreign_key_employee_must_exist_returns_404
        claim_type: foreign_key_validation
        grounds:
          - entities.CurriculumAssignment.fields.employee_id
          - errors[ERR_EMPLOYEE_NOT_FOUND]
          - endpoints[POST /awareness/curriculum-assignments]
        distinguishing_aspect: "The entity topology is flat, so every FK is checked against the referenced table at write time: an assignment naming an unregistered employee_id is a 404 on the reference, not a 400 on the shape, and the module is left untouched."
        test_recipe:
          setup:
            - "Logical clock at 2026-08-01T00:00:00Z."
            - "One PUBLISHED ANNUAL module and one registered employee whose version is known (used only to prove the OCC input is well-formed)."
          setup_api_calls:
            - { call: "POST /awareness/_clock/set_current_utc", payload: { to_iso8601: "2026-08-01T00:00:00Z" }, as: ProgramAdmin }
            - { call: "POST /awareness/employees", payload: { email: "fk.probe@corp.example", full_name: "Fay Kay", department: "HR", role_code: "IC", hire_date: "2019-01-01" }, as: ProgramAdmin, captures: { e: "$.data.id", e_v: "$.data.version" } }
            - { call: "POST /awareness/training-modules", payload: { code: "FK-ANNUAL", title: "FK Probe Module", module_type: "ANNUAL" }, as: ProgramAdmin, captures: { m: "$.data.id" } }
            - { call: "POST /awareness/training-modules/${m}/publish", payload: {}, as: ProgramAdmin }
          trigger:
            - { call: "POST /awareness/curriculum-assignments", payload: { employee_id: "00000000-0000-4000-8000-000000000001", module_id: "${m}", assignment_reason: "ANNUAL", expected_employee_version: "${e_v}" }, as: ProgramAdmin, captures: { err: "$.data.error_id" } }
          assert:
            - "HTTP 404 with error_id == ERR_EMPLOYEE_NOT_FOUND"
            - "GET /awareness/curriculum-assignments returns 0 rows"
            - "Employee.${e}.version is unchanged at ${e_v}"
            - "the same call with employee_id ${e} returns 201"

      - name: assignment_foreign_key_module_must_exist_returns_404
        claim_type: foreign_key_validation
        grounds:
          - entities.CurriculumAssignment.fields.module_id
          - errors[ERR_MODULE_NOT_FOUND]
          - endpoints[POST /awareness/curriculum-assignments]
        distinguishing_aspect: "The second FK on the same write is checked independently and reports its own error_id: an unknown module_id yields ERR_MODULE_NOT_FOUND, never the employee-flavoured 404."
        test_recipe:
          setup:
            - "Logical clock at 2026-08-01T00:00:00Z; one registered employee, no module with the referenced id."
          setup_api_calls:
            - { call: "POST /awareness/_clock/set_current_utc", payload: { to_iso8601: "2026-08-01T00:00:00Z" }, as: ProgramAdmin }
            - { call: "POST /awareness/employees", payload: { email: "mk.probe@corp.example", full_name: "Moe Kay", department: "HR", role_code: "IC", hire_date: "2019-02-02" }, as: ProgramAdmin, captures: { e: "$.data.id", e_v: "$.data.version" } }
          trigger:
            - { call: "POST /awareness/curriculum-assignments", payload: { employee_id: "${e}", module_id: "00000000-0000-4000-8000-000000000002", assignment_reason: "ANNUAL", expected_employee_version: "${e_v}" }, as: ProgramAdmin, captures: { err: "$.data.error_id" } }
          assert:
            - "HTTP 404 with error_id == ERR_MODULE_NOT_FOUND"
            - "the error_id is NOT ERR_EMPLOYEE_NOT_FOUND"
            - "Employee.${e}.version is unchanged at ${e_v} and no assignment row exists"

  - section: state_machines
    instances:
      - name: module_publish_valid_transition_draft_to_published
        claim_type: valid_transition
        grounds:
          - state_machines.TrainingModule.DRAFT_to_PUBLISHED
          - endpoints[POST /awareness/training-modules/{id}/publish]
          - entities.TrainingModule.fields.published_at
        distinguishing_aspect: "The publish trigger moves a DRAFT module to PUBLISHED, stamps published_at with the logical clock and bumps version by exactly 1."
        test_recipe:
          setup:
            - "Logical clock at 2026-08-01T00:00:00Z; one DRAFT module."
          setup_api_calls:
            - { call: "POST /awareness/_clock/set_current_utc", payload: { to_iso8601: "2026-08-01T00:00:00Z" }, as: ProgramAdmin }
            - { call: "POST /awareness/training-modules", payload: { code: "PUB-1", title: "Publish Probe", module_type: "NEW_HIRE" }, as: ProgramAdmin, captures: { m: "$.data.id", m_v: "$.data.version" } }
          trigger:
            - { call: "POST /awareness/training-modules/${m}/publish", payload: {}, as: ProgramAdmin, captures: { m_status: "$.data.status" } }
          assert:
            - "HTTP 200 and TrainingModule.${m}.status == PUBLISHED"
            - "TrainingModule.${m}.published_at == 2026-08-01T00:00:00Z and retired_at == null"
            - "TrainingModule.${m}.version == 2 (exactly one bump from ${m_v})"

      - name: module_publish_twice_returns_409_module_state_invalid
        claim_type: idempotency
        grounds:
          - errors[ERR_MODULE_STATE_INVALID]
          - state_machines.TrainingModule.DRAFT_to_PUBLISHED
        distinguishing_aspect: "publish is not idempotent by design: the second call from PUBLISHED is refused with 409 ERR_MODULE_STATE_INVALID and published_at keeps its original instant rather than being restamped at the later clock."
        test_recipe:
          setup:
            - "Logical clock at 2026-08-01T00:00:00Z; one module already PUBLISHED at that instant."
            - "The clock is then advanced to 2026-08-05T00:00:00Z so a restamp would be visible."
          setup_api_calls:
            - { call: "POST /awareness/_clock/set_current_utc", payload: { to_iso8601: "2026-08-01T00:00:00Z" }, as: ProgramAdmin }
