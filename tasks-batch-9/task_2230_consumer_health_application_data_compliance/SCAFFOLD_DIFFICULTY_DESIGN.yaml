            - "GeofenceCampaign.${camp_a_id}.state == ACTIVE"
            - "GeofenceCampaign.${camp_a_id}.standoff_meters == 1500"
            - "GeofenceZone.${zone_id}.last_campaign_activated_at == 2026-08-05T00:00:00Z"

  - rule_id: compensating_invariant
    instances:
      - name: share_consent_grant_then_withdrawal_conserves_active_share_consent_count
        grounds:
          - entities.AppProduct.fields.active_share_consent_count
          - state_machines.ConsentRecord.ACTIVE_to_ACTIVE
          - calculations.consent_posture_derivation
        distinguishing_aspect: |
          Conserved quantity: AppProduct.active_share_consent_count, a cardinality counter over
          ConsentRecord rows. Granting the SHARE axis raises it from 0 to 1 and withdrawing the
          same axis returns it to exactly 0, with no residue on the untouched axes.
        test_recipe:
          setup:
            - "logical clock at 2026-08-12T00:00:00Z"
            - "one AppProduct with active_share_consent_count 0"
            - "one ADULT Consumer with an ACTIVE ConsentRecord whose axes are all NOT_REQUESTED"
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-08-12T00:00:00Z" }
              as: PlatformAdmin
            - call: "POST /health-data/app-products"
              payload: { product_name: "SleepSense", company_legal_name: "SleepSense Inc", primary_state_code: "WA", consumer_count: 40000, annual_revenue_cents: 900000000, hipaa_covered_transaction_ratio: 0.10 }
              as: PlatformAdmin
              captures: { prod_id: $.data.id }
            - call: "POST /health-data/consumers"
              payload: { app_product_id: "${prod_id}", external_ref: "acct-3300", residency_state_code: "WA", age_band: "ADULT" }
              as: PlatformAdmin
              captures: { cons_id: $.data.id, cons_v: $.data.version }
            - call: "POST /health-data/consent-records"
              payload: { consumer_id: "${cons_id}", expected_consumer_version: "${cons_v}" }
              as: PrivacyOfficer
              captures: { cr_id: $.data.id }
            - call: "POST /health-data/consent-records/${cr_id}/grants"
              payload: { axes: ["COLLECT"] }
              as: Consumer
              as_user_id: "${cons_id}"
            - call: "POST /health-data/consent-records/${cr_id}/grants"
              payload: { axes: ["SHARE"] }
              as: Consumer
              as_user_id: "${cons_id}"
          trigger:
            - call: "POST /health-data/consent-records/${cr_id}/withdrawals"
              payload: { axis: "SHARE" }
              as: Consumer
              as_user_id: "${cons_id}"
          assert:
            - "AppProduct.${prod_id}.active_share_consent_count == 1 immediately after the SHARE grant in setup"
            - "AppProduct.${prod_id}.active_share_consent_count == 0 after the withdrawal"
            - "AppProduct.${prod_id}.active_share_consent_count equals the number of ACTIVE ConsentRecord rows whose sharing_state is GRANTED, which is 0"
            - "ConsentRecord.${cr_id}.sharing_state == WITHDRAWN"
            - "ConsentRecord.${cr_id}.collection_state == GRANTED"
            - "ConsentRecord.${cr_id}.sale_state == NOT_REQUESTED"
            - "ConsentRecord.${cr_id}.processing_halt_deadline_at == 2026-08-27T00:00:00Z"

      - name: breach_assess_then_retract_conserves_product_exposure_cents
        grounds:
          - entities.AppProduct.fields.exposure_cents
          - state_machines.BreachIncident.REPORTABLE_to_DISCOVERED
          - calculations.breach_notification_deadline
        distinguishing_aspect: |
          A different conserved quantity: AppProduct.exposure_cents, a monetary ledger rather than
          a row count. The assess side effect adds 144000 cents and the retract compensation
          subtracts exactly the recorded contribution, returning the ledger to 0 and clearing
          every derived deadline.
        test_recipe:
          setup:
            - "logical clock at 2026-08-05T00:00:00Z"
            - "one AppProduct with exposure_cents 0"
            - "one BreachIncident in REPORTABLE with breach_scope MIXED, protection_state UNPROTECTED and 120 affected consumers"
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-08-05T00:00:00Z" }
              as: PlatformAdmin
            - call: "POST /health-data/app-products"
              payload: { product_name: "SleepSense", company_legal_name: "SleepSense Inc", primary_state_code: "WA", consumer_count: 40000, annual_revenue_cents: 900000000, hipaa_covered_transaction_ratio: 0.10 }
              as: PlatformAdmin
              captures: { prod_id: $.data.id }
            - call: "POST /health-data/breach-incidents"
              payload: { app_product_id: "${prod_id}", incident_label: "Object store exposure", discovered_at: "2026-08-05T00:00:00Z", breach_scope: "MIXED", protection_state: "UNPROTECTED", affected_consumer_count: 120, affected_state_max_count: 120 }
              as: SecurityEngineer
              captures: { inc_id: $.data.id }
            - call: "POST /health-data/breach-incidents/${inc_id}/assess"
              payload: {}
              as: SecurityEngineer
          trigger:
            - call: "POST /health-data/breach-incidents/${inc_id}/retract"
              payload: {}
              as: SecurityEngineer
          assert:
            - "AppProduct.${prod_id}.exposure_cents == 144000 immediately after the assess call in setup"
            - "AppProduct.${prod_id}.exposure_cents == 0 after the retraction"
            - "BreachIncident.${inc_id}.state == DISCOVERED"
            - "BreachIncident.${inc_id}.exposure_contribution_cents == 0"
            - "BreachIncident.${inc_id}.health_rule_deadline_at == null"
            - "BreachIncident.${inc_id}.general_rule_deadline_at == null"
            - "BreachIncident.${inc_id}.governing_deadline_at == null"
            - "BreachIncident.${inc_id}.media_notice_required == false"
