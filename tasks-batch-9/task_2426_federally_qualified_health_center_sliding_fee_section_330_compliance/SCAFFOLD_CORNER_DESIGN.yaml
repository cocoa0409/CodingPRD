              captures: { nf_cap: $.data.error_id }
          assert:
            - "every one of the sixteen calls returns HTTP 404 with response_type \"error\""
            - "nf_hc == \"ERR_HEALTH_CENTER_NOT_FOUND\" and nf_pg == \"ERR_POVERTY_GUIDELINE_NOT_FOUND\""
            - "nf_bm == \"ERR_BOARD_MEMBER_NOT_FOUND\" and nf_site == \"ERR_SERVICE_SITE_NOT_FOUND\""
            - "nf_svc == \"ERR_SERVICE_DEFINITION_NOT_FOUND\" and nf_scr == \"ERR_SCOPE_CHANGE_REQUEST_NOT_FOUND\""
            - "nf_fs == \"ERR_FEE_SCHEDULE_NOT_FOUND\" and nf_dt == \"ERR_DISCOUNT_TIER_NOT_FOUND\""
            - "nf_pt == \"ERR_PATIENT_NOT_FOUND\" and nf_iv == \"ERR_INCOME_VERIFICATION_NOT_FOUND\""
            - "nf_enc == \"ERR_ENCOUNTER_NOT_FOUND\" and nf_wv == \"ERR_WAIVER_NOT_FOUND\""
            - "nf_uds == \"ERR_UDS_REPORT_NOT_FOUND\" and nf_qm == \"ERR_QUALITY_MEASURE_RESULT_NOT_FOUND\""
            - "nf_find == \"ERR_SITE_VISIT_FINDING_NOT_FOUND\" and nf_cap == \"ERR_CORRECTIVE_ACTION_PLAN_NOT_FOUND\""

  # ===========================================================================
  - section: rbac
    instances:

      - name: billing_specialist_cannot_create_a_health_center_unauthorized
        claim_type: exclusive_operation_denied
        grounds:
          - roles.PlatformAdmin.exclusive_operations
          - validations[priority 3]
          - errors[ERR_UNAUTHORIZED]
          - endpoints[POST /health-centers]
        distinguishing_aspect: >-
          POST /health-centers is exclusive to PlatformAdmin, so a BillingSpecialist with complete
          and valid headers is refused with ERR_UNAUTHORIZED / 403 — a 403, not the 401 an unknown
          role would receive — and no grantee row is created.
        test_recipe:
          setup:
            - "Empty database"
          setup_api_calls: []
          trigger:
            - call: "POST /health-centers"
              payload: { legal_name: "Unauthorized Health", grant_number: "H80CS00998", pps_base_rate_cents: 20000, medicare_upper_limit_cents: 15000 }
              as: BillingSpecialist
              as_user_id: "bs-1"
              captures: { e_rbac: $.data.error_id }
          assert:
            - "HTTP 403 and data.error_id == \"ERR_UNAUTHORIZED\""
            - "GET /health-centers as PlatformAdmin returns total_count == 0"

      - name: all_seven_roles_share_the_health_center_read_endpoint
        claim_type: shared_operation_allowed
        grounds:
          - endpoints[GET /health-centers/{id}]
          - roles
          - complexity_profile.role_model
        distinguishing_aspect: >-
          Read access to the grantee record is a shared operation across all seven declared roles,
          so the same GET succeeds identically for PlatformAdmin, ComplianceOfficer, BoardChair,
          EligibilityVerifier, PatientServicesRep, BillingSpecialist and ProjectOfficer — the
          segregation-of-duties model restricts writes only.
        test_recipe:
          setup:
            - "BOOT_CORE is executed"
          setup_api_calls:
            - *c_pg26
            - *c_hc
            - *c_site
            - *c_svc
            - *c_chair
            - *c_fs
            - *c_t1
            - *c_t2
            - *c_hcv
            - *c_adopt
          trigger:
            - call: "GET /health-centers/${chc_id}"
              payload: {}
              as: PlatformAdmin
              as_user_id: "admin-1"
              captures: { r_admin: $.data.version }
            - call: "GET /health-centers/${chc_id}"
              payload: {}
              as: ComplianceOfficer
              as_user_id: "co-1"
              captures: { r_co: $.data.version }
            - call: "GET /health-centers/${chc_id}"
              payload: {}
              as: BoardChair
              as_user_id: "${cchair_id}"
              captures: { r_chair: $.data.version }
            - call: "GET /health-centers/${chc_id}"
              payload: {}
              as: EligibilityVerifier
              as_user_id: "ev-1"
              captures: { r_ev: $.data.version }
            - call: "GET /health-centers/${chc_id}"
              payload: {}
              as: PatientServicesRep
              as_user_id: "psr-1"
              captures: { r_psr: $.data.version }
            - call: "GET /health-centers/${chc_id}"
              payload: {}
              as: BillingSpecialist
              as_user_id: "bs-1"
              captures: { r_bs: $.data.version }
            - call: "GET /health-centers/${chc_id}"
              payload: {}
              as: ProjectOfficer
              as_user_id: "po-1"
              captures: { r_po: $.data.version }
          assert:
            - "all seven calls return HTTP 200 with response_type \"object\""
            - "r_admin == 5 and r_co == 5 and r_chair == 5 and r_ev == 5 and r_psr == 5 and r_bs == 5 and r_po == 5"
            - "no call mutated the row: HealthCenter.${chc_id}.version == 5"

      - name: submitter_cannot_verify_the_income_verification_they_filed
        claim_type: segregation_of_duties
        grounds:
          - validations[priority 13]
          - errors[ERR_SEGREGATION_OF_DUTIES]
          - complexity_profile.role_model
          - entities.IncomeVerification.fields.submitted_by_user_id
        distinguishing_aspect: >-
          Segregation of duties is enforced on X-User-ID, not on role: the same human "dual-1" acting
          first as PatientServicesRep and then as EligibilityVerifier is refused with
          ERR_SEGREGATION_OF_DUTIES / 409, while a different verifier "ev-1" completes the identical
          call successfully.
        test_recipe:
          setup:
            - "BOOT_CORE is executed and patient 'Val Osei' is registered"
            - "User dual-1 submits the income verification as PatientServicesRep"
          setup_api_calls:
            - *c_pg26
            - *c_hc
            - *c_site
            - *c_svc
            - *c_chair
            - *c_fs
            - *c_t1
            - *c_t2
            - *c_hcv
            - *c_adopt
            - *c_p
            - call: "POST /patients/${cp_id}/income-verifications"
