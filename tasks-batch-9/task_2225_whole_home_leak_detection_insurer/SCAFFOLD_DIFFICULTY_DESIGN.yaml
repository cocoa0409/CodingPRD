            - "BaselineProfile of ${d1} after that reading: learning_state == COMPLETE, sample_count == 3, baseline_static_pressure_psi == 60.0, baseline_peak_flow_gpm == 9.00, drip_threshold_gpm == 0.18, baseline_version == 3, completed_at == 2026-08-01T00:40:00Z"
            - "Device.${d1}.lifecycle_state == ARMED and Device.${d1}.baseline_ready == true"
            - "TelemetryReading for 2026-08-01T01:00:00Z has classification_at_ingest == NONE and baseline_eligible == true: judged against the freshly published peak 9.00 its gates are burst 13.50 (12.0 < 13.50), running 3.60 with RUNNING_MIN_DURATION_MINUTES 20 (6 < 20) and drip 0.18 with DRIP_MIN_DURATION_MINUTES 60 (6 < 60)"
