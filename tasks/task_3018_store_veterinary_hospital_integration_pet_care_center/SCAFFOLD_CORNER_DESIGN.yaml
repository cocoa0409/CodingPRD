          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-06-01T00:00:00Z" }
              as: PlatformAdmin
            - call: "POST /stores"
              payload: { store_code: "ST-1502", city: "Ogden", state_code: "TX", service_bay_count: 2, hospital_capacity: 3 }
              as: PlatformAdmin
              captures: { s: $.data.id, s_v: $.data.version }
            - call: "POST /stores/members"
              payload: { full_name: "Ellis Kane", email: "ellis@example.com", state_code: "TX", home_store_id: "${s}" }
              as: StoreManager
              captures: { m: $.data.id }
            - call: "POST /stores/pets"
              payload: { member_id: "${m}", name: "Quill", species: "FELINE", breed: "Birman", weight_kg: 4.4 }
              as: GroomingStaff
              captures: { pet: $.data.id }
            - call: "POST /stores/${s}/veterinary-encounters"
              payload: { pet_id: "${pet}", clinician_name: "Dr. Soren", scheduled_at: "2026-06-28T09:00:00Z" }
              as: VeterinaryStaff
              captures: { enc: $.data.id, enc_v: $.data.version }
            - call: "POST /stores/${s}/prescription-authorizations"
              payload: { pet_id: "${pet}", encounter_id: "${enc}", item_type: "TREATMENT", item_name: "Dental Chews", sku: "SKU-DEN-05", unit_price_cents: 900, quantity: 3 }
              as: VeterinaryStaff
              captures: { au: $.data.id, au_v: $.data.version }
            - call: "POST /stores/${s}/veterinary-encounters/${enc}/check-in"
              payload: { expected_encounter_version: "${enc_v}" }
              as: VeterinaryStaff
              captures: { enc_v2: $.data.version }
            - call: "POST /stores/${s}/veterinary-encounters/${enc}/start-exam"
              payload: { expected_encounter_version: "${enc_v2}" }
              as: VeterinaryStaff
              captures: { enc_v3: $.data.version }
            - call: "POST /stores/${s}/veterinary-encounters/${enc}/complete-exam"
              payload: { expected_encounter_version: "${enc_v3}" }
              as: VeterinaryStaff
              captures: { au_v2: $.data.version }
            - call: "POST /stores/${s}/pharmacy-orders"
              payload: { authorization_id: "${au}", requested_quantity: 3, expected_authorization_version: "${au_v2}" }
              as: PharmacyStaff
              captures: { o1: $.data.id }
            - call: "POST /stores/${s}/restrict"
              payload: { expected_store_version: "${s_v}" }
              as: PlatformAdmin
              captures: { s_v2: $.data.version }
            - call: "POST /stores/${s}/freeze-hospital"
              payload: { expected_store_version: "${s_v2}" }
              as: PlatformAdmin
          trigger:
            - call: "POST /stores/${s}/veterinary-encounters"
              payload: { pet_id: "${pet}", clinician_name: "Dr. Soren", scheduled_at: "2026-06-29T09:00:00Z" }
              as: VeterinaryStaff
              captures: { err_code: $.data.error_id }
          assert:
            - "the response is 409 with error_id ERR_STORE_HOSPITAL_FROZEN, the priority-4 gate that precedes the pharmacy-hold rule"
            - "PharmacyOrder.${o1}.on_hold == HOLDING and Store.${s}.stores_held_total == 1"
            - "Store.${s}.pharmacy_hold_until == 2026-06-04T00:00:00Z"

