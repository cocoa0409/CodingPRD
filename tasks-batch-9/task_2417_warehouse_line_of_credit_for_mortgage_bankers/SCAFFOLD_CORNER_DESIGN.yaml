      - name: corner_sm_repeated_lifecycle_trigger_is_rejected
        claim_type: idempotency
        grounds:
          - validations[priority=9]
          - validations[priority=44]
          - validations[priority=45]
          - errors.ERR_FACILITY_INVALID_STATE
          - errors.ERR_INVESTOR_INVALID_STATE
          - errors.ERR_CUSTODIAN_INVALID_STATE
        distinguishing_aspect: |
          None of the three lifecycle stamps is idempotent: a second approve or suspend is
          a 409 rather than a no-op re-stamp, and each entity reports its OWN error code —
          ERR_FACILITY_INVALID_STATE, ERR_INVESTOR_INVALID_STATE and
          ERR_CUSTODIAN_INVALID_STATE — so approved_at / approved_by_user_id keep their
          first values.
        test_recipe:
          setup:
            - "Canonical ACTIVE facility approved once by co_2, one APPROVED investor, one APPROVED custodian already suspended once."
          setup_api_calls:
            - *c_clock_aug1
            - *c_facility
            - *c_par_conforming
            - *c_approve_facility
            - *c_custodian
            - *c_investor_a
            - *c_investor_a_approve
            - call: "POST /custodians/${cust_id}/suspend"
              payload: { reason: "Vault audit finding" }
              as: CreditOfficer
              as_user_id: "co_1"
            - call: "GET /facilities/${fac_id}"
              payload: {}
              as: CreditOfficer
              as_user_id: "co_1"
              captures: { fac_ver_after_approve: "$.data.version" }
          trigger:
            - call: "POST /facilities/${fac_id}/approve"
              payload: {}
              as: CreditOfficer
              as_user_id: "co_2"
            - call: "POST /investors/${inv_a_id}/approve"
              payload: {}
              as: CreditOfficer
              as_user_id: "co_1"
            - call: "POST /custodians/${cust_id}/suspend"
              payload: { reason: "Vault audit finding restated" }
              as: CreditOfficer
              as_user_id: "co_1"
          assert:
            - "the second facility approve returns HTTP 409 with data.error_id == ERR_FACILITY_INVALID_STATE"
            - "the second investor approve returns HTTP 409 with data.error_id == ERR_INVESTOR_INVALID_STATE"
            - "the second custodian suspend returns HTTP 409 with data.error_id == ERR_CUSTODIAN_INVALID_STATE"
            - "WarehouseFacility.${fac_id}.status == ACTIVE and version == fac_ver_after_approve — the rejected retry did not bump the OCC token"
            - "WarehouseFacility.${fac_id}.approved_by_user_id == co_2 and approved_at == 2026-08-01T00:00:00Z"
            - "TakeoutInvestor.${inv_a_id}.status == APPROVED and version == 2"
            - "DocumentCustodian.${cust_id}.status == SUSPENDED and version == 2"

      - name: corner_sm_fund_ledger_sync_reconciles_facility_rollup
