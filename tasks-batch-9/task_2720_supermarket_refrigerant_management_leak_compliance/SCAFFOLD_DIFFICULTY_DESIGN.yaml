            - call: "POST /repair-attempts"
              payload: { leak_event_id: "${event_id}", system_id: "${sys1_id}", technician_id: "${tech1_id}", recovery_equipment_id: "${eq1_id}", repair_method_code: "REPLACE_GASKET", repair_completed_at: "2026-08-07T09:00:00Z" }
              as: Technician
              as_user_id: "${tech1_id}"
              captures: { attempt2_id: $.data.id }
          trigger:
