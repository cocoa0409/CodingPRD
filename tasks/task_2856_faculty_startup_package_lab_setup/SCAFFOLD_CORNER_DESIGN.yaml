      - name: corner_cx_carryforward_eligibility_threshold_at_the_boundary
        claim_type: rate_threshold_triggers
        grounds:
          - calculations.year_end_rollover.constants.MIN_SPENDDOWN_RATIO_FOR_CARRYFORWARD
          - calculations.package_spend_rollup
        distinguishing_aspect: "The carryforward gate is a cumulative-spend threshold read from the PRE-rollover ledger and compared at 4 decimal places: a package sitting at 0.4999 loses its whole unspent balance even though the tranche's policy is FULL and a perfectly valid destination tranche exists, and a 4000-cent larger encumbrance would have carried 5000000 forward instead."
        test_recipe:
          setup:
            - "MINI-UNITS plus an ACTIVE package of 40000000 built from two EQUIPMENT tranches: FY2027 of 25000000 with carryforward_policy FULL (available 2026-07-01, expires 2027-07-01) and FY2028 of 15000000 with policy NONE (available 2027-07-01, expires 2028-07-01) as the carryforward destination. One order of 19996000 is placed against the FY2027 tranche at clock 2026-08-01, then the clock advances to 2027-07-01T00:00:00Z."
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { current_utc: "2026-08-01T00:00:00Z" }
              as: DeanOffice
            - call: "POST /funding-units"
