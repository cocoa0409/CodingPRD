            - "hop 3: ${wep_after} == 0.00 and ${idx_after} == 100.00 with graded_play_count still 3"
            - "hop 4: ${elig_after} == true and ${da_status_after} == CLEARED"
            - "hop 5: ${off_status_after} == ACTIVE and ${post_after} == true"

      - name: suspension_voids_assignments_and_reprices_game_crew
        grounds:
          - state_machines.Official.ACTIVE_to_SUSPENDED
          - state_machines.CrewAssignment.CONFIRMED_to_VOIDED
          - calculations.crew_posture_derivation
          - calculations.crew_strength_index
          - concurrency_rules[discipline-create-stale-official]
          - entities.Game.fields.confirmed_crew_count
        distinguishing_aspect: |
          Depth-4 chain from a different trigger (POST /discipline-actions with
          severity SUSPENSION rather than an appeal decision): the action suspends
          the official (1), the suspension voids his CONFIRMED assignment (2), the
          void decrements Game.confirmed_crew_count 2 -> 1 which re-derives
          crew_posture STAFFED -> UNDERSTAFFED (3), and the changed crew set
          reprices crew_strength_index 8.64 -> 6.24 (4).
        test_recipe:
          setup:
            - "SeasonProgram 2026 is OPEN with crew_size_required defaulted to 2."
            - "Rita Vance (REFEREE, TIER_2, 14 seasons) and Dan Ruiz (UMPIRE, TIER_2, 6 seasons) are both ACTIVE and preseason_cleared."
            - "Game G1 is still SCHEDULED with both assignments CONFIRMED, so confirmed_crew_count == 2, crew_posture == STAFFED and crew_strength_index == 8.64."
            - "The current Official.version of Dan has been read for the OCC field."
          setup_api_calls:
            - *c_clock_aug1
            - *c_prog_crew
            - *c_open_prog
            - *c_off_ref
            - *c_ref_exam
            - *c_ref_phys
            - *c_off_ump
            - *c_ump_exam
            - *c_ump_phys
            - *c_game_g1
            - *c_assign_ref_g1
            - *c_read_g1_version
            - *c_assign_ump_g1_v1
            - *c_confirm_ref_g1
            - *c_confirm_ump_g1
            - *c_read_ump_version
          trigger:
            - call: "POST /discipline-actions"
              payload: { official_id: "${ump_id}", reason_category: "CONDUCT", severity: "SUSPENSION", suspension_games: 2, expected_official_version: "${ump_v}" }
              as: OfficiatingDirector
              captures: { da_susp: $.data.id, da_susp_status: $.data.status }
            - call: "GET /officials/${ump_id}"
              payload: {}
              as: OfficiatingDirector
              captures: { ump_status_after: $.data.status, ump_open_after: $.data.open_assignment_count }
            - call: "GET /crew-assignments/${au1_id}"
              payload: {}
              as: CrewScheduler
              captures: { au1_status_after: $.data.status, au1_released: $.data.released_at }
            - call: "GET /games/${g1_id}"
              payload: {}
              as: CrewScheduler
              captures: { g1_ccc_after: $.data.confirmed_crew_count, g1_posture_after: $.data.crew_posture, g1_csi_after: $.data.crew_strength_index }
          assert:
            - "hop 1: ${ump_status_after} == SUSPENDED and ${da_susp_status} == OPENED"
            - "hop 2: ${au1_status_after} == VOIDED with ${au1_released} non-null, and ${ump_open_after} == 0"
            - "hop 3: ${g1_ccc_after} == 1 and ${g1_posture_after} == UNDERSTAFFED (the game is still SCHEDULED, so posture is re-derived rather than frozen)"
            - "hop 4: ${g1_csi_after} == 6.24 — 12.48 / crew_size_required 2"
            - "CrewAssignment.${ar1_id}.status == CONFIRMED — only the suspended official's assignment is touched"

  # ===========================================================================
  - rule_id: priority_pair_validation_conflict
    instances:

      - name: window_conflict_outranks_team_rotation_limit
        grounds:
          - validations[priority=10]
          - validations[priority=14]
          - calculations.assignment_occupancy_window
          - calculations.team_rotation_exposure
        distinguishing_aspect: |
          A single POST /crew-assignments violates business_safety priority 10
          (the official's occupancy window overlaps his prior game) and
          business_constraint priority 14 (a third exposure to MIA against
          max_team_exposures_per_season 2); the response is exactly
          ERR_OFFICIAL_WINDOW_CONFLICT (409), never ERR_TEAM_ROTATION_LIMIT.
        test_recipe:
          setup:
            - "SeasonProgram 2026 is OPEN with crew_size_required 1, travel_lead_hours 24, min_rest_hours_between_games 96 and max_team_exposures_per_season 2 (all defaulted except crew size)."
            - "Dan Ruiz is an ACTIVE, preseason_cleared UMPIRE."
            - "He holds a PROPOSED assignment on G1 (MIA vs BUF, kickoff 2026-09-13T17:00:00Z, window 2026-09-12T17:00:00Z..2026-09-17T21:00:00Z) and one on G2 (NYJ vs MIA, kickoff 2026-09-18T21:00:00Z, window 2026-09-17T21:00:00Z..2026-09-23T01:00:00Z), so MIA exposures already equal 2."
            - "Game G4 (DAL vs MIA, kickoff 2026-09-19T17:00:00Z) is SCHEDULED and uncrewed; its window would be 2026-09-18T17:00:00Z..2026-09-23T21:00:00Z."
          setup_api_calls:
            - *c_clock_aug1
            - *c_prog_solo
            - *c_open_prog
            - *c_off_ump
            - *c_ump_exam
            - *c_ump_phys
            - *c_game_g1
            - *c_assign_ump_g1
            - call: "POST /games"
              payload: { season_program_id: "${sp_id}", home_team_code: "NYJ", away_team_code: "MIA", venue_market_code: "NYJ", kickoff_utc: "2026-09-18T21:00:00Z" }
              as: OfficiatingDirector
              captures: { g2b_id: $.data.id, g2b_v0: $.data.version }
            - call: "POST /crew-assignments"
              payload: { game_id: "${g2b_id}", official_id: "${ump_id}", position: "UMPIRE", expected_game_version: "${g2b_v0}" }
              as: CrewScheduler
              captures: { au2b_id: $.data.id }
            - call: "POST /games"
              payload: { season_program_id: "${sp_id}", home_team_code: "DAL", away_team_code: "MIA", venue_market_code: "DAL", kickoff_utc: "2026-09-19T17:00:00Z" }
              as: OfficiatingDirector
              captures: { g4_id: $.data.id, g4_v0: $.data.version }
          trigger:
            - call: "POST /crew-assignments"
              payload: { game_id: "${g4_id}", official_id: "${ump_id}", position: "UMPIRE", expected_game_version: "${g4_v0}" }
              as: CrewScheduler
              captures: { err_pair_a: $.data.error_id }
          assert:
            - "HTTP status is 409 and ${err_pair_a} == ERR_OFFICIAL_WINDOW_CONFLICT"
            - "${err_pair_a} != ERR_TEAM_ROTATION_LIMIT even though the rotation cap is also exceeded"
            - "no CrewAssignment exists for game ${g4_id}; Official.${ump_id}.open_assignment_count == 2"

      - name: appeal_window_closed_outranks_exhausted_appeal_credits
        grounds:
          - validations[priority=26]
          - validations[priority=27]
          - calculations.appeal_window
          - calculations.appeal_credit_ledger
          - entities.Official.fields.appeal_credits_remaining
        distinguishing_aspect: |
          A single POST /grade-appeals violates business_temporal priority 26 (the
          72-hour window closed one second earlier) and business_fiscal priority 27
          (appeal_credits_remaining is 0); the response is exactly
          ERR_APPEAL_WINDOW_CLOSED (422), never ERR_APPEAL_CREDITS_EXHAUSTED — a
          different error-category pair from the safety/constraint instance.
        test_recipe:
          setup:
            - "SeasonProgram 2026 is OPEN with crew_size_required 1, appeal_window_hours 72 and appeal_credits_per_official 3."
            - "Dan Ruiz is an ACTIVE, preseason_cleared UMPIRE whose assignment on PLAYED game G1 is COMPLETED."
            - "Four grades are POSTED on Dan at clock 2026-09-13T21:30:00Z, so every appeal deadline is 2026-09-16T21:30:00Z."
            - "Dan has appealed the first three grades, leaving appeal_credits_remaining == 0."
            - "The clock has been advanced to 2026-09-16T21:30:01Z — one second past the deadline."
          setup_api_calls:
            - *c_clock_aug1
            - *c_prog_solo
            - *c_open_prog
            - *c_off_ump
            - *c_ump_exam
            - *c_ump_phys
            - *c_game_g1
            - *c_assign_ump_g1
            - *c_confirm_ump_g1
            - *c_clock_g1_kick
            - *c_kick_g1
            - *c_clock_g1_post
            - *c_played_g1
            - *c_grade_u_correct1
            - *c_post_u_correct1
            - *c_grade_u_correct2
            - *c_post_u_correct2
            - *c_grade_u_missed_low
            - *c_post_u_missed_low
            - call: "POST /play-grades"
              payload: { game_id: "${g1_id}", official_id: "${ump_id}", play_ref: "Q4-P09", call_category: "ROUGHING_PASSER", grade_code: "INCORRECT_CALL", impact: "MEDIUM" }
              as: GradingSupervisor
              as_user_id: "sup-grader-1"
              captures: { pg_late: $.data.id }
            - call: "POST /play-grades/${pg_late}/post"
              payload: {}
              as: GradingSupervisor
              as_user_id: "sup-grader-1"
              captures: { pg_late_posted_at: $.data.posted_at }
            - call: "POST /grade-appeals"
              payload: { play_grade_id: "${pg_u1}", basis_note: "first appeal" }
              as: Official
              as_user_id: "${ump_id}"
            - call: "POST /grade-appeals"
              payload: { play_grade_id: "${pg_u2}", basis_note: "second appeal" }
              as: Official
              as_user_id: "${ump_id}"
            - call: "POST /grade-appeals"
              payload: { play_grade_id: "${pg_u3}", basis_note: "third appeal" }
              as: Official
              as_user_id: "${ump_id}"
              captures: { third_appeal_id: $.data.id }
            - call: "GET /officials/${ump_id}"
              payload: {}
              as: OfficiatingDirector
              captures: { credits_before: $.data.appeal_credits_remaining }
            - call: "POST /_clock/set_current_utc"
              payload: { current_utc: "2026-09-16T21:30:01Z" }
              as: OfficiatingDirector
          trigger:
            - call: "POST /grade-appeals"
              payload: { play_grade_id: "${pg_late}", basis_note: "fourth appeal filed one second late" }
              as: Official
              as_user_id: "${ump_id}"
              captures: { err_pair_b: $.data.error_id }
          assert:
            - "${pg_late_posted_at} == 2026-09-13T21:30:00Z and ${credits_before} == 0"
            - "HTTP status is 422 and ${err_pair_b} == ERR_APPEAL_WINDOW_CLOSED"
            - "${err_pair_b} != ERR_APPEAL_CREDITS_EXHAUSTED even though appeal_credits_remaining is 0"
            - "PlayGrade.${pg_late}.appeal_state == NOT_APPEALED and Official.${ump_id}.appeal_credits_remaining == 0 (unchanged)"

      - name: non_owner_appeal_returns_forbidden_before_grade_state_is_examined
        grounds:
          - validations[priority=5]
          - validations[priority=8]
          - entities.PlayGrade.fields.official_id
          - entities.PlayGrade.fields.grade_status
        distinguishing_aspect: |
          A single POST /grade-appeals violates ownership priority 5 (the acting
          official is not the graded official) and state priority 8 (the grade is
          still DRAFT, so no appeal is possible at all); the response is exactly
          ERR_NOT_GRADE_OWNER (403), never ERR_GRADE_STATE_INVALID — a third,
          distinct error-category pair.
        test_recipe:
          setup:
            - "SeasonProgram 2026 is OPEN with crew_size_required 1."
            - "Dan Ruiz is the graded UMPIRE on PLAYED game G1; Rita Vance is a separate ACTIVE, preseason_cleared REFEREE with all three appeal credits."
            - "One grade on Dan (Q2-P08, MISSED_CALL/MEDIUM) is still DRAFT: grade_status == DRAFT and posted_at is null."
          setup_api_calls:
            - *c_clock_aug1
            - *c_prog_solo
            - *c_open_prog
            - *c_off_ump
            - *c_ump_exam
            - *c_ump_phys
            - *c_off_ref
            - *c_ref_exam
            - *c_ref_phys
            - *c_game_g1
            - *c_assign_ump_g1
            - *c_confirm_ump_g1
            - *c_clock_g1_kick
            - *c_kick_g1
            - *c_clock_g1_post
            - *c_played_g1
            - call: "POST /play-grades"
              payload: { game_id: "${g1_id}", official_id: "${ump_id}", play_ref: "Q2-P08", call_category: "HOLDING", grade_code: "MISSED_CALL", impact: "MEDIUM" }
              as: GradingSupervisor
              as_user_id: "sup-grader-1"
              captures: { pg_draft: $.data.id, pg_draft_status: $.data.grade_status }
          trigger:
            - call: "POST /grade-appeals"
              payload: { play_grade_id: "${pg_draft}", basis_note: "not my grade and not even posted" }
              as: Official
              as_user_id: "${ref_id}"
              captures: { err_pair_c: $.data.error_id }
          assert:
            - "${pg_draft_status} == DRAFT"
            - "HTTP status is 403 and ${err_pair_c} == ERR_NOT_GRADE_OWNER"
            - "${err_pair_c} != ERR_GRADE_STATE_INVALID even though a DRAFT grade can never be appealed"
            - "Official.${ref_id}.appeal_credits_remaining == 3 — a rejected appeal spends nothing"

  # ===========================================================================
  - rule_id: boundary_precision_check
    instances:

      - name: accuracy_eligibility_threshold_inclusive_at_exactly_95
        grounds:
          - calculations.accuracy_index
          - entities.SeasonProgram.fields.accuracy_eligibility_threshold
          - entities.SeasonProgram.fields.min_graded_plays_for_eligibility
          - entities.OfficialSeasonRecord.fields.accuracy_eligible
          - state_machines.PlayGrade.grade_status_DRAFT_to_POSTED
        distinguishing_aspect: |
          Metric 1 — the accuracy_index threshold, exercised through
          POST /play-grades/{id}/post: an umpire landing on exactly 95.00 with
          exactly 3 graded plays is accuracy_eligible because both comparisons are
          `>=`, while a referee whose identical MISSED_CALL/LOW costs 0.90 instead
          of 0.75 lands on 94.00 and is not.
        test_recipe:
          setup:
            - "SeasonProgram 2026 is OPEN with crew_size_required 1, accuracy_eligibility_threshold 95.00 and min_graded_plays_for_eligibility 3."
            - "Dan Ruiz (UMPIRE, POSITION_FACTOR 1.00) and Rita Vance (REFEREE, POSITION_FACTOR 1.20) both hold COMPLETED assignments on PLAYED game G1."
            - "Each has two POSTED CORRECT/LOW grades (0.00 each) plus one DRAFT MISSED_CALL/LOW grade awaiting posting."
          setup_api_calls:
            - *c_clock_aug1
            - *c_prog_solo
            - *c_open_prog
            - *c_off_ump
            - *c_ump_exam
            - *c_ump_phys
            - *c_off_ref
            - *c_ref_exam
            - *c_ref_phys
            - *c_game_g1
            - *c_assign_ump_g1
            - *c_read_g1_version
            - call: "POST /crew-assignments"
              payload: { game_id: "${g1_id}", official_id: "${ref_id}", position: "REFEREE", expected_game_version: "${g1_v1}" }
              as: CrewScheduler
              captures: { ar_b_id: $.data.id }
            - *c_confirm_ump_g1
            - call: "POST /crew-assignments/${ar_b_id}/confirm"
              payload: {}
              as: CrewScheduler
            - *c_clock_g1_kick
            - *c_kick_g1
            - *c_clock_g1_post
            - *c_played_g1
            - *c_grade_u_correct1
            - *c_post_u_correct1
            - *c_grade_u_correct2
            - *c_post_u_correct2
            - *c_grade_u_missed_low
            - call: "POST /play-grades"
              payload: { game_id: "${g1_id}", official_id: "${ref_id}", play_ref: "Q1-P05", call_category: "FALSE_START", grade_code: "CORRECT", impact: "LOW" }
              as: GradingSupervisor
              as_user_id: "sup-grader-1"
              captures: { pg_rb1: $.data.id }
            - call: "POST /play-grades/${pg_rb1}/post"
              payload: {}
              as: GradingSupervisor
              as_user_id: "sup-grader-1"
            - call: "POST /play-grades"
              payload: { game_id: "${g1_id}", official_id: "${ref_id}", play_ref: "Q2-P18", call_category: "HOLDING", grade_code: "CORRECT", impact: "LOW" }
              as: GradingSupervisor
              as_user_id: "sup-grader-1"
              captures: { pg_rb2: $.data.id }
            - call: "POST /play-grades/${pg_rb2}/post"
              payload: {}
              as: GradingSupervisor
              as_user_id: "sup-grader-1"
            - call: "POST /play-grades"
              payload: { game_id: "${g1_id}", official_id: "${ref_id}", play_ref: "Q3-P31", call_category: "HOLDING", grade_code: "MISSED_CALL", impact: "LOW" }
              as: GradingSupervisor
              as_user_id: "sup-grader-1"
              captures: { pg_rb3: $.data.id, pg_rb3_points: $.data.error_points }
          trigger:
            - call: "POST /play-grades/${pg_u3}/post"
              payload: {}
              as: GradingSupervisor
              as_user_id: "sup-grader-1"
            - call: "POST /play-grades/${pg_rb3}/post"
              payload: {}
              as: GradingSupervisor
              as_user_id: "sup-grader-1"
            - call: "GET /season-records"
              payload: { official_id: "${ump_id}" }
              as: OfficiatingDirector
              captures: { idx_ump_b: "$.data[0].accuracy_index", elig_ump_b: "$.data[0].accuracy_eligible", n_ump_b: "$.data[0].graded_play_count" }
            - call: "GET /season-records"
              payload: { official_id: "${ref_id}" }
              as: OfficiatingDirector
              captures: { idx_ref_b: "$.data[0].accuracy_index", elig_ref_b: "$.data[0].accuracy_eligible", n_ref_b: "$.data[0].graded_play_count" }
          assert:
            - "${pg_rb3_points} == 0.90 (1.50 * 0.50 * 1.20) versus 0.75 for the umpire (1.50 * 0.50 * 1.00)"
            - "${idx_ump_b} == 95.00, ${n_ump_b} == 3 and ${elig_ump_b} == true — the threshold comparison is inclusive"
            - "${idx_ref_b} == 94.00, ${n_ref_b} == 3 and ${elig_ref_b} == false — one hundredth of a grade point below the line is not eligible"

      - name: crew_strength_index_zero_on_empty_assignment_set
        grounds:
          - calculations.crew_strength_index
          - calculations.crew_posture_derivation
          - state_machines.CrewAssignment.CONFIRMED_to_WITHDRAWN
          - entities.Game.fields.crew_strength_index
          - entities.Game.fields.confirmed_crew_count
        distinguishing_aspect: |
          Metric 2 — the empty-collection edge, exercised through a different
          endpoint (POST /crew-assignments/{id}/withdraw): withdrawing the last
          remaining assignment makes the PROJECTED included set empty, so
          crew_strength_index must read exactly 0.00 rather than being left at its
          previous 2.40 or dividing by zero.
        test_recipe:
          setup:
            - "SeasonProgram 2026 is OPEN with crew_size_required 2."
            - "Game G1 is SCHEDULED with Rita's REFEREE assignment and Dan's UMPIRE assignment both CONFIRMED (crew_strength_index 8.64, crew_posture STAFFED)."
            - "Rita's assignment has already been withdrawn, leaving one CONFIRMED assignment (crew_strength_index 2.40 = 4.80 / 2, crew_posture UNDERSTAFFED)."
          setup_api_calls:
            - *c_clock_aug1
            - *c_prog_crew
            - *c_open_prog
            - *c_off_ref
            - *c_ref_exam
            - *c_ref_phys
            - *c_off_ump
            - *c_ump_exam
            - *c_ump_phys
            - *c_game_g1
            - *c_assign_ref_g1
            - *c_read_g1_version
            - *c_assign_ump_g1_v1
            - *c_confirm_ref_g1
            - *c_confirm_ump_g1
            - call: "POST /crew-assignments/${ar1_id}/withdraw"
              payload: { reason: "reassigned to a network game" }
              as: CrewScheduler
            - call: "GET /games/${g1_id}"
              payload: {}
              as: CrewScheduler
              captures: { csi_one_left: $.data.crew_strength_index, ccc_one_left: $.data.confirmed_crew_count, posture_one_left: $.data.crew_posture }
          trigger:
            - call: "POST /crew-assignments/${au1_id}/withdraw"
              payload: { reason: "crew rebuild" }
              as: CrewScheduler
            - call: "GET /games/${g1_id}"
              payload: {}
              as: CrewScheduler
              captures: { csi_empty: $.data.crew_strength_index, ccc_empty: $.data.confirmed_crew_count, posture_empty: $.data.crew_posture }
          assert:
            - "${csi_one_left} == 2.40, ${ccc_one_left} == 1 and ${posture_one_left} == UNDERSTAFFED"
            - "${csi_empty} == 0.00 exactly — the empty included set yields zero, not a carried-over 2.40 and not a division error"
            - "${ccc_empty} == 0 and ${posture_empty} == UNDERSTAFFED"
            - "Official.${ref_id}.open_assignment_count == 0 and Official.${ump_id}.open_assignment_count == 0"

      - name: replay_decision_limit_inclusive_at_exactly_120_seconds
        grounds:
          - calculations.replay_decision_elapsed
          - entities.SeasonProgram.fields.replay_decision_limit_seconds
          - entities.ReplayReview.fields.elapsed_seconds
          - state_machines.ReplayReview.INITIATED_to_DECIDED
          - state_machines.ReplayReview.INITIATED_to_EXPIRED
        distinguishing_aspect: |
          Metric 3 — the replay decision deadline in whole seconds, exercised
          through POST /replay-reviews/{id}/decide: elapsed_seconds exactly 120
          still DECIDES with the submitted decision, while 121 EXPIRES and nulls
          the decision.
        test_recipe:
          setup:
            - "SeasonProgram 2026 is OPEN with crew_size_required 1 and replay_decision_limit_seconds 120."
            - "Game G1 is IN_PROGRESS with Dan's assignment CONFIRMED."
            - "ReplayStation BOOTH-1 is ONLINE with concurrent_capacity 2."
            - "Reviews R1 (SCORING_PLAY) and R2 (TURNOVER) were both opened at clock 2026-09-13T18:00:00Z, so both windows close at 2026-09-13T18:02:00Z."
          setup_api_calls:
            - *c_clock_aug1
            - *c_prog_solo
            - *c_open_prog
            - *c_off_ump
            - *c_ump_exam
            - *c_ump_phys
            - *c_game_g1
            - *c_assign_ump_g1
            - *c_confirm_ump_g1
            - *c_clock_g1_kick
            - *c_kick_g1
            - &c_station_cap2
              call: "POST /replay-stations"
              payload: { station_code: "BOOTH-1", concurrent_capacity: 2 }
              as: OfficiatingDirector
              captures: { st2_id: $.data.id }
            - &c_clock_replay_open
              call: "POST /_clock/set_current_utc"
              payload: { current_utc: "2026-09-13T18:00:00Z" }
              as: OfficiatingDirector
            - call: "POST /replay-reviews"
              payload: { game_id: "${g1_id}", station_id: "${st2_id}", play_ref: "Q1-P12", category: "SCORING_PLAY" }
              as: ReplayOfficial
              captures: { rv1_id: $.data.id, rv1_close: $.data.window_close_utc }
            - call: "POST /replay-reviews"
              payload: { game_id: "${g1_id}", station_id: "${st2_id}", play_ref: "Q1-P13", category: "TURNOVER" }
              as: ReplayOfficial
              captures: { rv2_id: $.data.id }
          trigger:
            - call: "POST /_clock/set_current_utc"
              payload: { current_utc: "2026-09-13T18:02:00Z" }
              as: OfficiatingDirector
            - call: "POST /replay-reviews/${rv1_id}/decide"
              payload: { decision: "CONFIRMED" }
              as: ReplayOfficial
              captures: { rv1_status: $.data.status, rv1_decision: $.data.decision, rv1_elapsed: $.data.elapsed_seconds }
            - call: "POST /_clock/set_current_utc"
              payload: { current_utc: "2026-09-13T18:02:01Z" }
              as: OfficiatingDirector
            - call: "POST /replay-reviews/${rv2_id}/decide"
              payload: { decision: "REVERSED" }
              as: ReplayOfficial
              captures: { rv2_status: $.data.status, rv2_decision: $.data.decision, rv2_elapsed: $.data.elapsed_seconds }
            - call: "GET /replay-stations/${st2_id}"
              payload: {}
              as: OfficiatingDirector
              captures: { st2_active_after: $.data.active_review_count }
          assert:
            - "${rv1_close} == 2026-09-13T18:02:00Z"
            - "${rv1_elapsed} == 120, ${rv1_status} == DECIDED and ${rv1_decision} == CONFIRMED — the limit comparison is inclusive"
            - "${rv2_elapsed} == 121, ${rv2_status} == EXPIRED and ${rv2_decision} == null — one second past the limit discards the submitted REVERSED decision, still with HTTP 200"
            - "${st2_active_after} == 0 — both terminal reviews released their station capacity"

  # ===========================================================================
  - rule_id: cross_entity_state_dependency
    instances:

      - name: crew_assignment_creation_depends_on_official_preseason_clearance
        grounds:
          - validations[priority=11]
          - validations[priority=12]
          - calculations.preseason_clearance
          - state_machines.Official.CANDIDATE_to_ACTIVE
          - entities.Official.fields.preseason_cleared
        distinguishing_aspect: |
          Entity pair CrewAssignment -> Official: an official who passed the rules
          exam is ACTIVE yet still has preseason_cleared false without a passed
          physical test, so POST /crew-assignments fails with
          ERR_PRESEASON_NOT_CLEARED rather than ERR_OFFICIAL_NOT_ACTIVE — the child
          write is gated on a parent field that status alone does not imply.
        test_recipe:
          setup:
            - "SeasonProgram 2026 is OPEN with crew_size_required 1 and physical_test_min_score 70.00."
            - "Dan Ruiz has one passed RULES_EXAM (84.00) and NO physical test, so Official.status == ACTIVE and preseason_cleared == false."
            - "Game G1 is SCHEDULED and uncrewed."
          setup_api_calls:
            - *c_clock_aug1
            - *c_prog_solo
            - *c_open_prog
            - *c_off_ump
            - *c_ump_exam
            - *c_game_g1
            - call: "GET /officials/${ump_id}"
              payload: {}
              as: CrewScheduler
              captures: { ump_status_pre: $.data.status, ump_cleared_pre: $.data.preseason_cleared }
          trigger:
            - call: "POST /crew-assignments"
              payload: { game_id: "${g1_id}", official_id: "${ump_id}", position: "UMPIRE", expected_game_version: "${g1_v0}" }
              as: CrewScheduler
              captures: { err_cross_a: $.data.error_id }
          assert:
            - "${ump_status_pre} == ACTIVE and ${ump_cleared_pre} == false"
            - "HTTP status is 409 and ${err_cross_a} == ERR_PRESEASON_NOT_CLEARED"
            - "${err_cross_a} != ERR_OFFICIAL_NOT_ACTIVE — the official is on the roster, just not field-ready"
            - "Game.${g1_id}.confirmed_crew_count == 0 and Game.${g1_id}.version is unchanged from ${g1_v0}"

      - name: pool_report_publication_depends_on_cited_grade_finality
        grounds:
          - validations[priority=24]
          - state_machines.PoolReport.DRAFT_to_PUBLISHED
          - state_machines.Game.PLAYED_to_FINALIZED
          - entities.PlayGrade.fields.grade_status
          - entities.PoolReport.fields.published_at
        distinguishing_aspect: |
          Entity pair PoolReport -> PlayGrade (a different pair from
          CrewAssignment -> Official): publishing is rejected with
          ERR_CITED_GRADE_NOT_FINAL while the cited grade is only POSTED, and the
          identical call succeeds once finalizing the game moves that grade to
          FINAL.
        test_recipe:
          setup:
            - "SeasonProgram 2026 is OPEN with crew_size_required 1."
            - "Game G1 is PLAYED (not yet FINALIZED) with one POSTED grade on Dan Ruiz (Q3-P22, MISSED_CALL/LOW)."
            - "A DRAFT pool report of report_type POOL_REPORT cites that grade."
          setup_api_calls:
            - *c_clock_aug1
            - *c_prog_solo
            - *c_open_prog
            - *c_off_ump
            - *c_ump_exam
            - *c_ump_phys
            - *c_game_g1
            - *c_assign_ump_g1
            - *c_confirm_ump_g1
            - *c_clock_g1_kick
            - *c_kick_g1
            - *c_clock_g1_post
            - *c_played_g1
            - *c_grade_u_missed_low
            - *c_post_u_missed_low
            - call: "POST /pool-reports"
              payload: { game_id: "${g1_id}", play_grade_id: "${pg_u3}", report_type: "POOL_REPORT", body: "The crew confirmed the missed holding call after the game." }
              as: CommunicationsOfficer
              captures: { pr_id: $.data.id, pr_status_draft: $.data.status }
          trigger:
            - call: "POST /pool-reports/${pr_id}/publish"
              payload: {}
              as: CommunicationsOfficer
              captures: { err_cross_b: $.data.error_id }
            - call: "POST /games/${g1_id}/finalize"
              payload: {}
              as: OfficiatingDirector
            - call: "POST /pool-reports/${pr_id}/publish"
              payload: {}
              as: CommunicationsOfficer
              captures: { pr_status_pub: $.data.status, pr_published_at: $.data.published_at }
          assert:
            - "${pr_status_draft} == DRAFT"
            - "the first publish returns HTTP 409 with ${err_cross_b} == ERR_CITED_GRADE_NOT_FINAL while PlayGrade.${pg_u3}.grade_status == POSTED"
            - "after finalize, PlayGrade.${pg_u3}.grade_status == FINAL"
            - "the second publish returns HTTP 200 with ${pr_status_pub} == PUBLISHED and ${pr_published_at} == 2026-09-13T21:30:00Z"

      - name: game_kickoff_depends_on_aggregate_crew_confirmation
        grounds:
          - validations[priority=21]
          - calculations.crew_posture_derivation
          - state_machines.Game.SCHEDULED_to_IN_PROGRESS
          - state_machines.CrewAssignment.PROPOSED_to_CONFIRMED
          - entities.Game.fields.crew_posture
        distinguishing_aspect: |
          Entity pair Game -> CrewAssignment (an aggregate dependency, unlike the
          two single-row pairs above): kickoff is rejected with
          ERR_CREW_NOT_STAFFED while only one of the two required assignments is
          CONFIRMED, and succeeds the moment the second confirmation flips
          crew_posture to STAFFED.
        test_recipe:
          setup:
            - "SeasonProgram 2026 is OPEN with crew_size_required 2."
            - "Game G1 holds Rita's REFEREE assignment (CONFIRMED) and Dan's UMPIRE assignment (still PROPOSED), so confirmed_crew_count == 1 and crew_posture == UNDERSTAFFED."
            - "The clock stands at 2026-09-13T17:00:00Z."
          setup_api_calls:
            - *c_clock_aug1
            - *c_prog_crew
            - *c_open_prog
            - *c_off_ref
            - *c_ref_exam
            - *c_ref_phys
            - *c_off_ump
            - *c_ump_exam
            - *c_ump_phys
            - *c_game_g1
            - *c_assign_ref_g1
            - *c_read_g1_version
            - *c_assign_ump_g1_v1
            - *c_confirm_ref_g1
            - *c_clock_g1_kick
          trigger:
            - call: "POST /games/${g1_id}/kickoff"
              payload: {}
              as: OfficiatingDirector
              captures: { err_cross_c: $.data.error_id }
            - call: "POST /crew-assignments/${au1_id}/confirm"
              payload: {}
              as: CrewScheduler
            - call: "POST /games/${g1_id}/kickoff"
              payload: {}
              as: OfficiatingDirector
              captures: { g1_status_after: $.data.status, g1_posture_after: $.data.crew_posture, g1_csi_after: $.data.crew_strength_index }
          assert:
            - "the first kickoff returns HTTP 409 with ${err_cross_c} == ERR_CREW_NOT_STAFFED and Game.${g1_id}.status stays SCHEDULED"
            - "after the second confirmation, crew_posture is STAFFED and confirmed_crew_count == 2"
            - "the second kickoff returns HTTP 200 with ${g1_status_after} == IN_PROGRESS, ${g1_posture_after} == LOCKED and ${g1_csi_after} == 8.64"

  # ===========================================================================
  - rule_id: resource_temporal_overlap
    instances:

      - name: official_occupancy_half_open_allows_exact_adjacency
        grounds:
          - calculations.assignment_occupancy_window
          - validations[priority=10]
          - entities.CrewAssignment.fields.occupied_from_utc
          - entities.CrewAssignment.fields.occupied_until_utc
          - entities.SeasonProgram.fields.min_rest_hours_between_games
        distinguishing_aspect: |
          Resource entity 1 — the Official's own calendar, with HALF-OPEN
          [occupied_from, occupied_until) semantics: a second game whose window
          starts at exactly the first window's close instant is accepted (201),
          while a game starting one minute earlier overlaps and is rejected with
          ERR_OFFICIAL_WINDOW_CONFLICT.
        test_recipe:
          setup:
            - "SeasonProgram 2026 is OPEN with crew_size_required 1, travel_lead_hours 24 and min_rest_hours_between_games 96."
            - "Dan Ruiz is ACTIVE and preseason-cleared."
            - "Game G1 (MIA vs BUF, kickoff 2026-09-13T17:00:00Z) holds his PROPOSED UMPIRE assignment, occupying [2026-09-12T17:00:00Z, 2026-09-17T21:00:00Z)."
          setup_api_calls:
            - *c_clock_aug1
            - *c_prog_solo
            - *c_open_prog
            - *c_off_ump
            - *c_ump_exam
            - *c_ump_phys
            - *c_game_g1
            - *c_assign_ump_g1
            - call: "GET /crew-assignments/${au1_id}"
              payload: {}
              as: CrewScheduler
              captures: { occ_from_1: $.data.occupied_from_utc, occ_until_1: $.data.occupied_until_utc }
          trigger:
            - call: "POST /games"
              payload: { season_program_id: "${sp_id}", home_team_code: "KC", away_team_code: "NYJ", venue_market_code: "KC", kickoff_utc: "2026-09-18T21:00:00Z" }
              as: OfficiatingDirector
              captures: { ga_id: $.data.id, ga_v0: $.data.version }
            - call: "POST /crew-assignments"
              payload: { game_id: "${ga_id}", official_id: "${ump_id}", position: "UMPIRE", expected_game_version: "${ga_v0}" }
              as: CrewScheduler
              captures: { adj_assign_id: $.data.id, occ_from_2: $.data.occupied_from_utc }
            - call: "POST /games"
              payload: { season_program_id: "${sp_id}", home_team_code: "DAL", away_team_code: "PHI", venue_market_code: "DAL", kickoff_utc: "2026-09-18T20:59:00Z" }
              as: OfficiatingDirector
              captures: { gb_id: $.data.id, gb_v0: $.data.version }
            - call: "POST /crew-assignments"
              payload: { game_id: "${gb_id}", official_id: "${ump_id}", position: "UMPIRE", expected_game_version: "${gb_v0}" }
              as: CrewScheduler
              captures: { err_overlap_a: $.data.error_id }
          assert:
            - "${occ_from_1} == 2026-09-12T17:00:00Z and ${occ_until_1} == 2026-09-17T21:00:00Z"
            - "${occ_from_2} == 2026-09-17T21:00:00Z — exactly equal to ${occ_until_1} — and the adjacent assignment was created with HTTP 201"
            - "the DAL game's assignment returns HTTP 409 with ${err_overlap_a} == ERR_OFFICIAL_WINDOW_CONFLICT because its occupied_from 2026-09-17T20:59:00Z is strictly inside the G1 window"
            - "Official.${ump_id}.open_assignment_count == 2 (G1 plus the adjacent KC game), and Game.${gb_id}.version is unchanged from ${gb_v0}"
            - "no team appears twice, so ERR_TEAM_ROTATION_LIMIT and ERR_TEAM_CONFLICT_OF_INTEREST are not in play"

      - name: replay_station_closed_interval_and_aggregate_capacity
        grounds:
          - calculations.replay_station_concurrency
          - validations[priority=20]
          - entities.ReplayStation.fields.concurrent_capacity
          - entities.ReplayReview.fields.window_close_utc
          - entities.SeasonProgram.fields.replay_decision_limit_seconds
        distinguishing_aspect: |
          Resource entity 2 — the ReplayStation, with CLOSED [open, close]
          semantics and an AGGREGATE capacity, the opposite convention from the
          official calendar above: a review opened at exactly a predecessor's close
          instant DOES conflict on a capacity-1 station, and a capacity-2 station
          admits the second overlapping review while rejecting only the third.
        test_recipe:
          setup:
            - "SeasonProgram 2026 is OPEN with crew_size_required 1, replay_decision_limit_seconds 120 and reviewable_categories [SCORING_PLAY, TURNOVER, PLAYER_SAFETY]."
            - "Game G1 is IN_PROGRESS with Dan's assignment CONFIRMED."
            - "ReplayStation BOOTH-A is ONLINE with concurrent_capacity 1; BOOTH-B is ONLINE with concurrent_capacity 2."
            - "Review A on BOOTH-A was opened at 2026-09-13T18:00:00Z and is still INITIATED, so its closed window is [18:00:00, 18:02:00]."
          setup_api_calls:
            - *c_clock_aug1
            - *c_prog_solo
            - *c_open_prog
            - *c_off_ump
            - *c_ump_exam
            - *c_ump_phys
            - *c_game_g1
            - *c_assign_ump_g1
            - *c_confirm_ump_g1
            - *c_clock_g1_kick
            - *c_kick_g1
            - call: "POST /replay-stations"
              payload: { station_code: "BOOTH-A", concurrent_capacity: 1 }
              as: OfficiatingDirector
              captures: { sta_id: $.data.id }
            - call: "POST /replay-stations"
              payload: { station_code: "BOOTH-B", concurrent_capacity: 2 }
              as: OfficiatingDirector
              captures: { stb_id: $.data.id }
            - *c_clock_replay_open
            - call: "POST /replay-reviews"
              payload: { game_id: "${g1_id}", station_id: "${sta_id}", play_ref: "Q1-P01", category: "SCORING_PLAY" }
              as: ReplayOfficial
              captures: { rvA_id: $.data.id, rvA_close: $.data.window_close_utc }
          trigger:
            - call: "POST /_clock/set_current_utc"
              payload: { current_utc: "2026-09-13T18:02:00Z" }
              as: OfficiatingDirector
            - call: "POST /replay-reviews"
              payload: { game_id: "${g1_id}", station_id: "${sta_id}", play_ref: "Q1-P02", category: "TURNOVER" }
              as: ReplayOfficial
              captures: { err_overlap_b: $.data.error_id }
            - call: "POST /_clock/set_current_utc"
              payload: { current_utc: "2026-09-13T18:02:01Z" }
              as: OfficiatingDirector
            - call: "POST /replay-reviews"
              payload: { game_id: "${g1_id}", station_id: "${sta_id}", play_ref: "Q1-P03", category: "TURNOVER" }
              as: ReplayOfficial
              captures: { rvC_id: $.data.id, rvC_open: $.data.window_open_utc }
            - call: "POST /_clock/set_current_utc"
              payload: { current_utc: "2026-09-13T18:03:00Z" }
              as: OfficiatingDirector
            - call: "POST /replay-reviews"
              payload: { game_id: "${g1_id}", station_id: "${stb_id}", play_ref: "Q2-P01", category: "SCORING_PLAY" }
              as: ReplayOfficial
              captures: { rvD_id: $.data.id }
            - call: "POST /_clock/set_current_utc"
              payload: { current_utc: "2026-09-13T18:04:00Z" }
              as: OfficiatingDirector
            - call: "POST /replay-reviews"
              payload: { game_id: "${g1_id}", station_id: "${stb_id}", play_ref: "Q2-P02", category: "PLAYER_SAFETY" }
              as: ReplayOfficial
              captures: { rvE_id: $.data.id }
            - call: "POST /_clock/set_current_utc"
              payload: { current_utc: "2026-09-13T18:04:30Z" }
              as: OfficiatingDirector
            - call: "POST /replay-reviews"
              payload: { game_id: "${g1_id}", station_id: "${stb_id}", play_ref: "Q2-P03", category: "TURNOVER" }
              as: ReplayOfficial
              captures: { err_overlap_c: $.data.error_id }
            - call: "GET /replay-stations/${stb_id}"
              payload: {}
              as: OfficiatingDirector
              captures: { stb_active: $.data.active_review_count }
          assert:
            - "${rvA_close} == 2026-09-13T18:02:00Z"
            - "the review opened at exactly 18:02:00Z returns HTTP 409 with ${err_overlap_b} == ERR_REPLAY_STATION_AT_CAPACITY — touching endpoints conflict under closed-interval semantics, the opposite of the official-calendar rule"
            - "${rvC_open} == 2026-09-13T18:02:01Z and that review was created with HTTP 201 on the same capacity-1 station"
            - "BOOTH-B accepts review E at 18:04:00Z (overlapping count 1 < 2) with HTTP 201"
            - "review F at 18:04:30Z returns HTTP 409 with ${err_overlap_c} == ERR_REPLAY_STATION_AT_CAPACITY because both D [18:03:00, 18:05:00] and E [18:04:00, 18:06:00] still overlap, giving an aggregate count of 2"
            - "${stb_active} == 2 — capacity is aggregate per station, not pairwise exclusion, and no review on BOOTH-A ever affected BOOTH-B's count"

  # ===========================================================================
  - rule_id: compensating_invariant
    instances:

      - name: appeal_credit_ledger_restored_by_withdrawal
        grounds:
          - calculations.appeal_credit_ledger
          - state_machines.GradeAppeal.SUBMITTED_to_WITHDRAWN
          - state_machines.PlayGrade.appeal_state_APPEAL_PENDING_to_NOT_APPEALED
          - entities.Official.fields.appeal_credits_remaining
          - entities.SeasonProgram.fields.appeal_credits_per_official
        distinguishing_aspect: |
          Conserved quantity 1 — appeal_credits_remaining plus the count of
          credit-consuming appeals must always equal appeal_credits_per_official.
          Filing debits the ledger and withdrawing refunds it exactly, restoring
          both the counter and the grade's appeal_state so the same grade can be
          appealed again.
        test_recipe:
          setup:
            - "SeasonProgram 2026 is OPEN with crew_size_required 1 and appeal_credits_per_official 3."
            - "Game G1 is PLAYED with one POSTED grade on Dan Ruiz (Q3-P22, MISSED_CALL/LOW)."
            - "Dan has filed no appeals, so appeal_credits_remaining == 3."
          setup_api_calls:
            - *c_clock_aug1
            - *c_prog_solo
            - *c_open_prog
            - *c_off_ump
            - *c_ump_exam
            - *c_ump_phys
            - *c_game_g1
            - *c_assign_ump_g1
            - *c_confirm_ump_g1
            - *c_clock_g1_kick
            - *c_kick_g1
            - *c_clock_g1_post
            - *c_played_g1
            - *c_grade_u_missed_low
            - *c_post_u_missed_low
            - call: "GET /officials/${ump_id}"
              payload: {}
              as: OfficiatingDirector
              captures: { credits_start: $.data.appeal_credits_remaining }
          trigger:
            - call: "POST /grade-appeals"
              payload: { play_grade_id: "${pg_u3}", basis_note: "the runner was already down" }
              as: Official
              as_user_id: "${ump_id}"
              captures: { ap_inv: $.data.id, ap_inv_status: $.data.status }
            - call: "GET /officials/${ump_id}"
              payload: {}
              as: OfficiatingDirector
              captures: { credits_debited: $.data.appeal_credits_remaining }
            - call: "GET /play-grades/${pg_u3}"
              payload: {}
              as: OfficiatingDirector
              captures: { grade_appeal_state_pending: $.data.appeal_state }
            - call: "POST /grade-appeals/${ap_inv}/withdraw"
              payload: {}
              as: Official
              as_user_id: "${ump_id}"
              captures: { ap_inv_final: $.data.status }
            - call: "GET /officials/${ump_id}"
              payload: {}
              as: OfficiatingDirector
              captures: { credits_refunded: $.data.appeal_credits_remaining }
            - call: "GET /play-grades/${pg_u3}"
              payload: {}
              as: OfficiatingDirector
              captures: { grade_appeal_state_restored: $.data.appeal_state, grade_points_restored: $.data.error_points, grade_status_restored: $.data.grade_status }
            - call: "POST /grade-appeals"
              payload: { play_grade_id: "${pg_u3}", basis_note: "refiled with the sideline angle" }
              as: Official
              as_user_id: "${ump_id}"
              captures: { ap_inv2: $.data.id }
            - call: "GET /officials/${ump_id}"
              payload: {}
              as: OfficiatingDirector
              captures: { credits_after_refile: $.data.appeal_credits_remaining }
          assert:
            - "${credits_start} == 3 and ${ap_inv_status} == SUBMITTED"
            - "${credits_debited} == 2 and ${grade_appeal_state_pending} == APPEAL_PENDING — ledger 2 + 1 consuming appeal == 3"
            - "${ap_inv_final} == WITHDRAWN, ${credits_refunded} == 3 and ${grade_appeal_state_restored} == NOT_APPEALED — the refund is exact, with no half-spent credit left behind"
            - "${grade_points_restored} == 0.75 and ${grade_status_restored} == POSTED — the withdrawal touched only the ledger, not the grade's value"
            - "${credits_after_refile} == 2 — the refunded credit is genuinely reusable, and the invariant holds again at 2 + 1 == 3"

      - name: crew_counters_restored_after_confirm_then_withdraw
        grounds:
          - calculations.crew_strength_index
          - calculations.crew_posture_derivation
          - state_machines.CrewAssignment.CONFIRMED_to_WITHDRAWN
          - entities.Game.fields.confirmed_crew_count
          - entities.Official.fields.open_assignment_count
        distinguishing_aspect: |
          Conserved quantity 2 — the denormalised crew counters
          (Game.confirmed_crew_count and each Official.open_assignment_count) plus
          the derived crew_strength_index must
          always equal a recount of the underlying CrewAssignment rows; confirming
          then withdrawing must land back on the recount, not one step off.
        test_recipe:
          setup:
            - "SeasonProgram 2026 is OPEN with crew_size_required 2."
            - "Game G1 holds Rita's CONFIRMED REFEREE assignment and Dan's PROPOSED UMPIRE assignment (confirmed_crew_count 1, crew_strength_index 8.64 PROJECTED, and each of the two officials carries open_assignment_count 1)."
          setup_api_calls:
            - *c_clock_aug1
            - *c_prog_crew
            - *c_open_prog
            - *c_off_ref
            - *c_ref_exam
            - *c_ref_phys
            - *c_off_ump
            - *c_ump_exam
            - *c_ump_phys
            - *c_game_g1
            - *c_assign_ref_g1
            - *c_read_g1_version
            - *c_assign_ump_g1_v1
            - *c_confirm_ref_g1
            - call: "GET /games/${g1_id}"
              payload: {}
              as: CrewScheduler
              captures: { ccc_base: $.data.confirmed_crew_count, csi_base: $.data.crew_strength_index, posture_base: $.data.crew_posture }
            - call: "GET /officials/${ump_id}"
              payload: {}
              as: CrewScheduler
              captures: { ump_oac_base: $.data.open_assignment_count }
          trigger:
            - call: "POST /crew-assignments/${au1_id}/confirm"
              payload: {}
              as: CrewScheduler
              captures: { au1_confirmed: $.data.status }
            - call: "GET /games/${g1_id}"
              payload: {}
              as: CrewScheduler
              captures: { ccc_fwd: $.data.confirmed_crew_count, csi_fwd: $.data.crew_strength_index, posture_fwd: $.data.crew_posture }
            - call: "POST /crew-assignments/${au1_id}/withdraw"
              payload: { reason: "illness" }
              as: CrewScheduler
              captures: { au1_withdrawn: $.data.status, au1_released: $.data.released_at }
            - call: "GET /games/${g1_id}"
              payload: {}
              as: CrewScheduler
              captures: { ccc_back: $.data.confirmed_crew_count, csi_back: $.data.crew_strength_index, posture_back: $.data.crew_posture }
            - call: "GET /officials/${ump_id}"
              payload: {}
              as: CrewScheduler
              captures: { ump_oac_back: $.data.open_assignment_count }
            - call: "GET /officials/${ref_id}"
              payload: {}
              as: CrewScheduler
              captures: { ref_oac_back: $.data.open_assignment_count }
            - call: "GET /crew-assignments"
              payload: { game_id: "${g1_id}", status: "CONFIRMED" }
              as: CrewScheduler
              captures: { recount_first_id: "$.data[0].id", recount_first_status: "$.data[0].status" }
          assert:
            - "${ccc_base} == 1, ${ump_oac_base} == 1, ${csi_base} == 8.64 and ${posture_base} == UNDERSTAFFED"
            - "${au1_confirmed} == CONFIRMED, ${ccc_fwd} == 2, ${posture_fwd} == STAFFED and ${csi_fwd} == 8.64 (unchanged: PROJECTED already counted the PROPOSED row)"
            - "${au1_withdrawn} == WITHDRAWN and ${au1_released} == 2026-08-01T00:00:00Z"
            - "${ccc_back} == 1 and ${posture_back} == UNDERSTAFFED — the counter returned to its pre-confirmation value, not to 0 and not stuck at 2"
            - "${csi_back} == 6.24 (12.48 / 2, the withdrawn umpire's 4.80 removed)"
            - "${ump_oac_back} == 0 — back down from ${ump_oac_base} == 1 — while ${ref_oac_back} == 1, so the withdrawal decremented only the withdrawn official's counter"
            - "GET /crew-assignments?game_id=${g1_id}&status=CONFIRMED returns exactly one row: ${recount_first_id} == ${ar1_id} with ${recount_first_status} == CONFIRMED — the denormalised counter reconciles exactly with a recount of CONFIRMED rows"

      - name: error_point_ledger_reconciles_after_modified_appeal
        grounds:
          - calculations.weighted_error_points
          - calculations.play_error_points
          - calculations.accuracy_index
          - state_machines.GradeAppeal.UNDER_REVIEW_to_MODIFIED
          - entities.OfficialSeasonRecord.fields.weighted_error_points
        distinguishing_aspect: |
          Conserved quantity 3 — OfficialSeasonRecord.weighted_error_points must at
          all times equal the sum of the current PlayGrade.error_points of the
          included set. A MODIFIED appeal revalues one grade downward (2.63 ->
          1.75), and the record must land on the revalued sum exactly, with no
          residue from the original figure and no double subtraction.
        test_recipe:
          setup:
            - "SeasonProgram 2026 is OPEN with crew_size_required 1."
            - "Game G1 is PLAYED; Dan Ruiz (UMPIRE, POSITION_FACTOR 1.00) has two POSTED grades: Q1-P07 CORRECT/LOW (0.00) and Q4-P11 MISSED_CALL/HIGH (1.50 * 1.75 * 1.00 = 2.63 after round_half_up of 2.625)."
            - "His PROVISIONAL record therefore reads graded_play_count 2, weighted_error_points 2.63, accuracy_index 73.70."
            - "Dan has appealed the second grade and a different supervisor has moved it to UNDER_REVIEW."
          setup_api_calls:
            - *c_clock_aug1
            - *c_prog_solo
            - *c_open_prog
            - *c_off_ump
            - *c_ump_exam
            - *c_ump_phys
            - *c_game_g1
            - *c_assign_ump_g1
            - *c_confirm_ump_g1
            - *c_clock_g1_kick
            - *c_kick_g1
            - *c_clock_g1_post
            - *c_played_g1
            - *c_grade_u_correct1
            - *c_post_u_correct1
            - call: "POST /play-grades"
              payload: { game_id: "${g1_id}", official_id: "${ump_id}", play_ref: "Q4-P11", call_category: "PASS_INTERFERENCE", grade_code: "MISSED_CALL", impact: "HIGH" }
              as: GradingSupervisor
              as_user_id: "sup-grader-1"
              captures: { pg_led: $.data.id, pg_led_points: $.data.error_points }
            - call: "POST /play-grades/${pg_led}/post"
              payload: {}
              as: GradingSupervisor
              as_user_id: "sup-grader-1"
            - call: "GET /season-records"
              payload: { official_id: "${ump_id}" }
              as: OfficiatingDirector
              captures: { wep_led_before: "$.data[0].weighted_error_points", idx_led_before: "$.data[0].accuracy_index", n_led_before: "$.data[0].graded_play_count", variant_led_before: "$.data[0].accuracy_variant" }
            - call: "POST /grade-appeals"
              payload: { play_grade_id: "${pg_led}", basis_note: "contact was incidental, at most a lesser foul" }
              as: Official
              as_user_id: "${ump_id}"
              captures: { ap_led: $.data.id }
            - call: "POST /grade-appeals/${ap_led}/start-review"
              payload: {}
              as: GradingSupervisor
              as_user_id: "sup-review-2"
          trigger:
            - call: "POST /grade-appeals/${ap_led}/decide"
              payload: { outcome: "MODIFIED", revised_grade_code: "INCORRECT_CALL", decision_note: "downgraded to an incorrect call" }
              as: GradingSupervisor
              as_user_id: "sup-review-2"
              captures: { ap_led_status: $.data.status }
            - call: "GET /play-grades/${pg_led}"
              payload: {}
              as: OfficiatingDirector
              captures: { pg_led_code_after: $.data.grade_code, pg_led_points_after: $.data.error_points, pg_led_appeal_after: $.data.appeal_state }
            - call: "GET /play-grades/${pg_u1}"
              payload: {}
              as: OfficiatingDirector
              captures: { pg_u1_points_after: $.data.error_points }
            - call: "GET /season-records"
              payload: { official_id: "${ump_id}" }
              as: OfficiatingDirector
              captures: { wep_led_after: "$.data[0].weighted_error_points", idx_led_after: "$.data[0].accuracy_index", n_led_after: "$.data[0].graded_play_count", elig_led_after: "$.data[0].accuracy_eligible" }
          assert:
            - "${pg_led_points} == 2.63 (round_half_up of 1.50 * 1.75 * 1.00 = 2.625)"
            - "${wep_led_before} == 2.63, ${n_led_before} == 2, ${idx_led_before} == 73.70 and ${variant_led_before} == PROVISIONAL"
            - "${ap_led_status} == MODIFIED, ${pg_led_code_after} == INCORRECT_CALL, ${pg_led_appeal_after} == APPEAL_RESOLVED"
            - "${pg_led_points_after} == 1.75 (1.00 * 1.75 * 1.00) and ${pg_u1_points_after} == 0.00"
            - "${wep_led_after} == 1.75 == 0.00 + 1.75, the exact sum of the current per-play values — not 2.63, not 0.88, and not 4.38"
            - "${n_led_after} == 2 (a MODIFIED grade stays in the denominator, unlike an OVERTURNED one under the FINAL variant) and ${idx_led_after} == 82.50"
            - "${elig_led_after} == false — 82.50 is below the 95.00 threshold"
