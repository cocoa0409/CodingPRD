# =============================================================================
# Task 1584 — Crop Hail & Livestock Mortality Insurance
# §1.9 Scaffold Corner Design — Coverage Index for Non-Difficulty Tests
# Breadth coverage of every testable claim §1.1–§1.7 declares that §1.8 does
# not already cover. Each instance cites section + claim_type from
# references/claim-extraction-guide.md.
# =============================================================================
scaffold_corner_design:
  # ===========================================================================
  # Section: entities — creation, retrieval, required fields, defaults, computed
  # fields, type constraints, parent relationships
  # ===========================================================================
  - section: entities
    instances:
      - name: carrier_creation_returns_201_and_default_clock
        claim_type: creation
        grounds: [entities.Carrier, endpoints."POST /carriers"]
        distinguishing_aspect: "POST /carriers with required fields returns 201 and the carrier.current_utc defaults to 2026-08-01T00:00:00Z"
        test_recipe:
          setup: ["Empty DB"]
          setup_api_calls: []
          trigger:
            - call: "POST /carriers"
              payload: { carrier_code: "CHL-Z1", legal_name: "C1", reinsurance_treaty_attachment_cents: 1000000 }
              as: PlatformAdmin
              captures: { cid: $.data.id, utc: $.data.current_utc }
          assert:
            - "Carrier.${cid}.current_utc == 2026-08-01T00:00:00Z"
            - "Carrier.${cid}.version == 1"

      - name: grower_creation_missing_required_email_returns_invalid_request
        claim_type: required_fields
        grounds: [entities.Grower.fields.email, "errors[ERR_INVALID_REQUEST]"]
        distinguishing_aspect: "Omitting the required `email` field returns ERR_INVALID_REQUEST (400)"
        test_recipe:
          setup: ["Carrier exists"]
          setup_api_calls:
            - call: "POST /carriers"
              payload: { carrier_code: "CHL-Z2", legal_name: "C2", reinsurance_treaty_attachment_cents: 1000000 }
              as: PlatformAdmin
              captures: { cid: $.data.id }
          trigger:
            - call: "POST /carriers/${cid}/growers"
              payload: { full_name: "NoEmail", tax_id_last4: "0000", county_code: "06001", state_code: "CA" }
              as: Underwriter
              captures: { err: $.data.error_id }
          assert:
            - "error_id == ERR_INVALID_REQUEST"

      - name: grower_default_status_is_active
        claim_type: defaults
        grounds: [entities.Grower.fields.status, entities.Grower.fields.prior_claims_count]
        distinguishing_aspect: "New Grower starts with status=ACTIVE and prior_claims_count=0"
        test_recipe:
          setup: ["Carrier exists"]
          setup_api_calls:
            - call: "POST /carriers"
              payload: { carrier_code: "CHL-Z3", legal_name: "C3", reinsurance_treaty_attachment_cents: 1000000 }
              as: PlatformAdmin
              captures: { cid: $.data.id }
          trigger:
            - call: "POST /carriers/${cid}/growers"
              payload: { full_name: "NewG", tax_id_last4: "1111", email: "n@x.com", county_code: "06001", state_code: "CA" }
              as: Underwriter
              captures: { gid: $.data.id, status: $.data.status, pcc: $.data.prior_claims_count }
          assert:
            - "Grower.${gid}.status == ACTIVE"
            - "Grower.${gid}.prior_claims_count == 0"

      - name: get_carrier_with_nonexistent_id_returns_404
        claim_type: not_found
        grounds: ["errors[ERR_NOT_FOUND]"]
        distinguishing_aspect: "GET /carriers/{random-uuid} returns 404 ERR_NOT_FOUND"
        test_recipe:
          setup: []
          setup_api_calls: []
          trigger:
            - call: "GET /carriers/00000000-0000-0000-0000-000000000000"
              payload: {}
              as: PlatformAdmin
              captures: { err: $.data.error_id }
          assert:
            - "error_id == ERR_NOT_FOUND"

      - name: policy_computed_deadlines_derived_from_effective_and_expiration
        claim_type: computed_fields
        grounds: [entities.Policy.fields.acreage_report_deadline, entities.Policy.fields.harvest_report_deadline, entities.Policy.fields.head_report_deadline]
        distinguishing_aspect: "acreage_report_deadline = effective+21d; harvest_report_deadline = expiration-14d; head_report_deadline = effective+10d"
        test_recipe:
          setup: ["Carrier; grower"]
          setup_api_calls:
            - call: "POST /carriers"
              payload: { carrier_code: "CHL-Z4", legal_name: "C4", reinsurance_treaty_attachment_cents: 1000000 }
              as: PlatformAdmin
              captures: { cid: $.data.id }
            - call: "POST /carriers/${cid}/growers"
              payload: { full_name: "G", tax_id_last4: "2222", email: "g@x.com", county_code: "06001", state_code: "CA" }
              as: Underwriter
              captures: { gid: $.data.id }
          trigger:
            - call: "POST /carriers/${cid}/policies"
              payload: { grower_id: "${gid}", policy_kind: "CROP_HAIL", effective_date: "2026-08-10T00:00:00Z", expiration_date: "2026-12-31T00:00:00Z" }
              as: Underwriter
              captures: { pid: $.data.id, ard: $.data.acreage_report_deadline, hrd: $.data.harvest_report_deadline }
          assert:
            - "Policy.${pid}.acreage_report_deadline == 2026-08-31T00:00:00Z   (effective + 21 days)"
            - "Policy.${pid}.harvest_report_deadline == 2026-12-17T00:00:00Z   (expiration - 14 days)"

      - name: coverage_unit_invalid_enum_species_returns_invalid_request
        claim_type: type_constraints
        grounds: [entities.CoverageUnit.fields.species, "errors[ERR_INVALID_REQUEST]"]
        distinguishing_aspect: "Passing species='DRAGON' (not in enum) returns ERR_INVALID_REQUEST"
        test_recipe:
          setup: ["Carrier; grower; LIVESTOCK policy in APPLICATION"]
          setup_api_calls:
            - call: "POST /carriers"
              payload: { carrier_code: "CHL-Z5", legal_name: "C5", reinsurance_treaty_attachment_cents: 1000000 }
              as: PlatformAdmin
              captures: { cid: $.data.id }
            - call: "POST /carriers/${cid}/growers"
              payload: { full_name: "G", tax_id_last4: "3333", email: "g@x.com", county_code: "06001", state_code: "CA" }
              as: Underwriter
              captures: { gid: $.data.id }
            - call: "POST /carriers/${cid}/policies"
              payload: { grower_id: "${gid}", policy_kind: "LIVESTOCK_MORTALITY", effective_date: "2026-08-10T00:00:00Z", expiration_date: "2027-08-10T00:00:00Z" }
              as: Underwriter
              captures: { pid: $.data.id }
          trigger:
            - call: "POST /carriers/${cid}/policies/${pid}/coverage-units"
              payload: { species: "DRAGON", declared_head_count: 5, per_head_value_cents: 100000 }
              as: Underwriter
              captures: { err: $.data.error_id }
          assert:
            - "error_id == ERR_INVALID_REQUEST"

      - name: list_growers_pagination_default_limit
        claim_type: listing
        grounds: [response_envelope, "endpoints.GET /carriers/{carrierId}/growers"]
        distinguishing_aspect: "List endpoint without limit/offset returns at most 10 items and includes pagination fields"
        test_recipe:
          setup: ["Carrier; 12 growers"]
          setup_api_calls:
            - call: "POST /carriers"
              payload: { carrier_code: "CHL-Z6", legal_name: "C6", reinsurance_treaty_attachment_cents: 1000000 }
              as: PlatformAdmin
              captures: { cid: $.data.id }
          trigger:
            - call: "GET /carriers/${cid}/growers"
              payload: {}
              as: Underwriter
          assert:
            - "response contains pagination fields: limit, offset, total_count, has_more"
            - "default limit applied when not provided"

  # ===========================================================================
  # Section: state_machines — invalid transitions, precondition enforcement,
  # side effects, terminal lockdown
  # ===========================================================================
  - section: state_machines
    instances:
      - name: bind_already_bound_policy_returns_policy_not_in_application
        claim_type: invalid_transition
        grounds: [state_machines.Policy.APPLICATION_to_BOUND, "errors[ERR_POLICY_NOT_IN_APPLICATION]"]
        distinguishing_aspect: "Second bind on a BOUND policy is rejected; policy state unchanged"
        test_recipe:
          setup: ["Carrier; grower; PUBLISHED rate; policy already BOUND"]
          setup_api_calls:
            - call: "POST /carriers"
              payload: { carrier_code: "CHL-SM1", legal_name: "C", reinsurance_treaty_attachment_cents: 1000000 }
              as: PlatformAdmin
              captures: { cid: $.data.id }
            - call: "POST /carriers/${cid}/growers"
              payload: { full_name: "G", tax_id_last4: "1111", email: "g@x.com", county_code: "06001", state_code: "CA" }
              as: Underwriter
              captures: { gid: $.data.id }
            - call: "POST /carriers/${cid}/rate-tables"
              payload: { rating_kind: "CROP_HAIL", county_code: "06001", crop_code: "CORN", rate_per_100_cents_of_liability: 333, effective_from: "2026-01-01T00:00:00Z" }
              as: Underwriter
              captures: { rt: $.data.id }
            - call: "POST /carriers/${cid}/rate-tables/${rt}/publish"
              payload: {}
              as: Underwriter
            - call: "POST /carriers/${cid}/policies"
              payload: { grower_id: "${gid}", policy_kind: "CROP_HAIL", effective_date: "2026-08-10T00:00:00Z", expiration_date: "2026-12-31T00:00:00Z" }
              as: Underwriter
              captures: { pid: $.data.id }
            - call: "POST /carriers/${cid}/policies/${pid}/coverage-units"
              payload: { county_code: "06001", crop_code: "CORN", declared_acres: 1 }
              as: Underwriter
            - call: "POST /carriers/${cid}/policies/${pid}/bind"
              payload: {}
              as: Underwriter
          trigger:
            - call: "POST /carriers/${cid}/policies/${pid}/bind"
              payload: {}
              as: Underwriter
              captures: { err: $.data.error_id }
          assert:
            - "error_id == ERR_POLICY_NOT_IN_APPLICATION"

      - name: bind_policy_with_no_coverage_units_returns_no_coverage_units
        claim_type: precondition_enforcement
        grounds: [state_machines.Policy.APPLICATION_to_BOUND, "errors[ERR_NO_COVERAGE_UNITS]"]
        distinguishing_aspect: "Bind with zero CUs is rejected with ERR_NO_COVERAGE_UNITS"
        test_recipe:
          setup: ["Carrier; grower; policy in APPLICATION with NO coverage units"]
          setup_api_calls:
            - call: "POST /carriers"
              payload: { carrier_code: "CHL-SM2", legal_name: "C", reinsurance_treaty_attachment_cents: 1000000 }
              as: PlatformAdmin
              captures: { cid: $.data.id }
            - call: "POST /carriers/${cid}/growers"
              payload: { full_name: "G", tax_id_last4: "1111", email: "g@x.com", county_code: "06001", state_code: "CA" }
              as: Underwriter
              captures: { gid: $.data.id }
            - call: "POST /carriers/${cid}/policies"
              payload: { grower_id: "${gid}", policy_kind: "CROP_HAIL", effective_date: "2026-08-10T00:00:00Z", expiration_date: "2026-12-31T00:00:00Z" }
              as: Underwriter
              captures: { pid: $.data.id }
          trigger:
            - call: "POST /carriers/${cid}/policies/${pid}/bind"
              payload: {}
              as: Underwriter
              captures: { err: $.data.error_id }
          assert:
            - "error_id == ERR_NO_COVERAGE_UNITS"

      - name: terminal_cancelled_policy_blocks_new_claim
        claim_type: terminal_state_lockdown
        grounds: [state_machines.Policy, entities.Policy.fields.claims_posture, "errors[ERR_POLICY_RESTRICTED]"]
        distinguishing_aspect: "Once Policy is CANCELLED, POST /claims is rejected with ERR_POLICY_RESTRICTED"
        test_recipe:
          setup: ["Carrier; grower; rate; BOUND policy with CU and timely acreage report; then policy cancelled (no open claims)"]
          setup_api_calls:
            - call: "POST /carriers"
              payload: { carrier_code: "CHL-SM3", legal_name: "C", reinsurance_treaty_attachment_cents: 1000000 }
              as: PlatformAdmin
              captures: { cid: $.data.id }
            - call: "POST /carriers/${cid}/growers"
              payload: { full_name: "G", tax_id_last4: "1111", email: "g@x.com", county_code: "06001", state_code: "CA" }
              as: Underwriter
              captures: { gid: $.data.id }
            - call: "POST /carriers/${cid}/rate-tables"
              payload: { rating_kind: "CROP_HAIL", county_code: "06001", crop_code: "CORN", rate_per_100_cents_of_liability: 333, effective_from: "2026-01-01T00:00:00Z" }
              as: Underwriter
              captures: { rt: $.data.id }
            - call: "POST /carriers/${cid}/rate-tables/${rt}/publish"
              payload: {}
              as: Underwriter
            - call: "POST /carriers/${cid}/policies"
              payload: { grower_id: "${gid}", policy_kind: "CROP_HAIL", effective_date: "2026-08-02T00:00:00Z", expiration_date: "2026-12-31T00:00:00Z" }
              as: Underwriter
              captures: { pid: $.data.id }
            - call: "POST /carriers/${cid}/policies/${pid}/coverage-units"
              payload: { county_code: "06001", crop_code: "CORN", declared_acres: 1 }
              as: Underwriter
              captures: { cu: $.data.id }
            - call: "POST /carriers/${cid}/policies/${pid}/bind"
              payload: {}
              as: Underwriter
            - call: "POST /carriers/${cid}/policies/${pid}/cancel"
              payload: {}
              as: Underwriter
          trigger:
            - call: "POST /carriers/${cid}/policies/${pid}/claims"
              payload: { coverage_unit_id: "${cu}", loss_date: "2026-08-05T00:00:00Z", percent_damage_estimate_pct: 10 }
              as: Policyholder
              as_user_id: "${gid}"
              captures: { err: $.data.error_id }
          assert:
            - "Policy.${pid}.lifecycle_state == CANCELLED"
            - "Policy.${pid}.claims_posture == RESTRICTED"
            - "error_id == ERR_POLICY_RESTRICTED OR ERR_LOSS_DATE_OUT_OF_COVERAGE"

      - name: claim_under_review_cannot_be_withdrawn
        claim_type: invalid_transition
        grounds: [state_machines.Claim, "errors[ERR_CLAIM_NOT_WITHDRAWABLE]"]
        distinguishing_aspect: "Withdraw is only allowed from REPORTED or INSPECTION_SCHEDULED; from UNDER_REVIEW it returns ERR_CLAIM_NOT_WITHDRAWABLE"
        test_recipe:
          setup: ["Carrier; grower; rate; adjuster; BOUND+ACTIVE+PAID policy; claim pushed to UNDER_REVIEW"]
          setup_api_calls:
            - call: "POST /carriers"
              payload: { carrier_code: "CHL-SM4", legal_name: "C", reinsurance_treaty_attachment_cents: 1000000 }
              as: PlatformAdmin
              captures: { cid: $.data.id }
            - call: "POST /carriers/${cid}/growers"
              payload: { full_name: "G", tax_id_last4: "1111", email: "g@x.com", county_code: "06001", state_code: "CA" }
              as: Underwriter
              captures: { gid: $.data.id }
            - call: "POST /carriers/${cid}/adjusters"
              payload: { full_name: "A", license_number: "A1", county_codes: ["06001"], species_qualified: [], capacity_max_open_claims: 5 }
              as: Underwriter
              captures: { aid: $.data.id }
            - call: "POST /carriers/${cid}/rate-tables"
              payload: { rating_kind: "CROP_HAIL", county_code: "06001", crop_code: "CORN", rate_per_100_cents_of_liability: 333, effective_from: "2026-01-01T00:00:00Z" }
              as: Underwriter
              captures: { rt: $.data.id }
            - call: "POST /carriers/${cid}/rate-tables/${rt}/publish"
              payload: {}
              as: Underwriter
            - call: "POST /carriers/${cid}/policies"
              payload: { grower_id: "${gid}", policy_kind: "CROP_HAIL", effective_date: "2026-08-02T00:00:00Z", expiration_date: "2026-12-31T00:00:00Z" }
              as: Underwriter
              captures: { pid: $.data.id }
            - call: "POST /carriers/${cid}/policies/${pid}/coverage-units"
              payload: { county_code: "06001", crop_code: "CORN", declared_acres: 1 }
              as: Underwriter
              captures: { cu: $.data.id }
            - call: "POST /carriers/${cid}/policies/${pid}/bind"
              payload: {}
              as: Underwriter
            - call: "POST /carriers/${cid}/policies/${pid}/premium-payments"
              payload: { amount_cents: 1332 }
              as: Policyholder
              as_user_id: "${gid}"
            - call: "POST /carriers/${cid}/_clock/set_current_utc"
              payload: { to_iso8601: "2026-08-03T00:00:00Z" }
              as: Underwriter
            - call: "POST /carriers/${cid}/policies/${pid}/coverage-units/${cu}/acreage-reports"
              payload: { report_kind: "PLANTING", reported_acres: 1 }
              as: Policyholder
              as_user_id: "${gid}"
            - call: "POST /carriers/${cid}/policies/${pid}/claims"
              payload: { coverage_unit_id: "${cu}", loss_date: "2026-08-04T00:00:00Z", percent_damage_estimate_pct: 10 }
              as: Policyholder
              as_user_id: "${gid}"
              captures: { cl: $.data.id }
            - call: "POST /carriers/${cid}/policies/${pid}/claims/${cl}/assign-adjuster"
              payload: { adjuster_id: "${aid}" }
              as: ClaimsApprover
            - call: "POST /carriers/${cid}/policies/${pid}/claims/${cl}/field-inspections"
              payload: { adjuster_id: "${aid}", scheduled_for: "2026-08-04T12:00:00Z", observed_percent_damage_pct: 10, notes: "x" }
              as: Adjuster
              as_user_id: "${aid}"
            - call: "POST /carriers/${cid}/policies/${pid}/claims/${cl}/submit-for-review"
              payload: {}
              as: Adjuster
              as_user_id: "${aid}"
          trigger:
            - call: "POST /carriers/${cid}/policies/${pid}/claims/${cl}/withdraw"
              payload: {}
              as: Policyholder
              as_user_id: "${gid}"
              captures: { err: $.data.error_id }
          assert:
            - "error_id == ERR_CLAIM_NOT_WITHDRAWABLE"
            - "Claim.${cl}.claim_state == UNDER_REVIEW"

      - name: cancel_policy_with_open_claim_returns_open_claims_block_cancel
        claim_type: precondition_enforcement
        grounds: [state_machines.Policy.ACTIVE_to_CANCELLED, "errors[ERR_OPEN_CLAIMS_BLOCK_CANCEL]"]
        distinguishing_aspect: "Cancel is rejected when claim is in INSPECTION_SCHEDULED (open)"
        test_recipe:
          setup: ["Carrier; grower; rate; adjuster; BOUND+ACTIVE policy with claim in INSPECTION_SCHEDULED"]
          setup_api_calls:
            - call: "POST /carriers"
              payload: { carrier_code: "CHL-SM5", legal_name: "C", reinsurance_treaty_attachment_cents: 1000000 }
              as: PlatformAdmin
              captures: { cid: $.data.id }
            - call: "POST /carriers/${cid}/growers"
              payload: { full_name: "G", tax_id_last4: "1111", email: "g@x.com", county_code: "06001", state_code: "CA" }
              as: Underwriter
              captures: { gid: $.data.id }
            - call: "POST /carriers/${cid}/adjusters"
              payload: { full_name: "A", license_number: "A1", county_codes: ["06001"], species_qualified: [], capacity_max_open_claims: 5 }
              as: Underwriter
              captures: { aid: $.data.id }
            - call: "POST /carriers/${cid}/rate-tables"
              payload: { rating_kind: "CROP_HAIL", county_code: "06001", crop_code: "CORN", rate_per_100_cents_of_liability: 333, effective_from: "2026-01-01T00:00:00Z" }
              as: Underwriter
              captures: { rt: $.data.id }
            - call: "POST /carriers/${cid}/rate-tables/${rt}/publish"
              payload: {}
              as: Underwriter
            - call: "POST /carriers/${cid}/policies"
              payload: { grower_id: "${gid}", policy_kind: "CROP_HAIL", effective_date: "2026-08-02T00:00:00Z", expiration_date: "2026-12-31T00:00:00Z" }
              as: Underwriter
              captures: { pid: $.data.id }
            - call: "POST /carriers/${cid}/policies/${pid}/coverage-units"
              payload: { county_code: "06001", crop_code: "CORN", declared_acres: 1 }
              as: Underwriter
              captures: { cu: $.data.id }
            - call: "POST /carriers/${cid}/policies/${pid}/bind"
              payload: {}
              as: Underwriter
            - call: "POST /carriers/${cid}/policies/${pid}/premium-payments"
              payload: { amount_cents: 1332 }
              as: Policyholder
              as_user_id: "${gid}"
            - call: "POST /carriers/${cid}/_clock/set_current_utc"
              payload: { to_iso8601: "2026-08-03T00:00:00Z" }
              as: Underwriter
            - call: "POST /carriers/${cid}/policies/${pid}/coverage-units/${cu}/acreage-reports"
              payload: { report_kind: "PLANTING", reported_acres: 1 }
              as: Policyholder
              as_user_id: "${gid}"
            - call: "POST /carriers/${cid}/policies/${pid}/claims"
              payload: { coverage_unit_id: "${cu}", loss_date: "2026-08-04T00:00:00Z", percent_damage_estimate_pct: 10 }
              as: Policyholder
              as_user_id: "${gid}"
              captures: { cl: $.data.id }
            - call: "POST /carriers/${cid}/policies/${pid}/claims/${cl}/assign-adjuster"
              payload: { adjuster_id: "${aid}" }
              as: ClaimsApprover
          trigger:
            - call: "POST /carriers/${cid}/policies/${pid}/cancel"
              payload: {}
              as: Underwriter
              captures: { err: $.data.error_id }
          assert:
            - "error_id == ERR_OPEN_CLAIMS_BLOCK_CANCEL"
            - "Policy.${pid}.lifecycle_state == ACTIVE   (unchanged)"

  # ===========================================================================
  # Section: calculations
  # ===========================================================================
  - section: calculations
    instances:
      - name: coverage_unit_liability_uses_fixed_per_acre_exposure_constant
        claim_type: constants_applied
        grounds: [calculations.coverage_unit_premium]
        distinguishing_aspect: "Crop-hail liability = declared_acres * 40_000 cents; pin via direct read after CU creation"
        test_recipe:
          setup: ["Carrier; grower; rate; policy in APPLICATION"]
          setup_api_calls:
            - call: "POST /carriers"
              payload: { carrier_code: "CHL-CA1", legal_name: "C", reinsurance_treaty_attachment_cents: 1000000 }
              as: PlatformAdmin
              captures: { cid: $.data.id }
            - call: "POST /carriers/${cid}/growers"
              payload: { full_name: "G", tax_id_last4: "1111", email: "g@x.com", county_code: "06001", state_code: "CA" }
              as: Underwriter
              captures: { gid: $.data.id }
            - call: "POST /carriers/${cid}/rate-tables"
              payload: { rating_kind: "CROP_HAIL", county_code: "06001", crop_code: "CORN", rate_per_100_cents_of_liability: 333, effective_from: "2026-01-01T00:00:00Z" }
              as: Underwriter
              captures: { rt: $.data.id }
            - call: "POST /carriers/${cid}/rate-tables/${rt}/publish"
              payload: {}
              as: Underwriter
            - call: "POST /carriers/${cid}/policies"
              payload: { grower_id: "${gid}", policy_kind: "CROP_HAIL", effective_date: "2026-08-10T00:00:00Z", expiration_date: "2026-12-31T00:00:00Z" }
              as: Underwriter
              captures: { pid: $.data.id }
          trigger:
            - call: "POST /carriers/${cid}/policies/${pid}/coverage-units"
              payload: { county_code: "06001", crop_code: "CORN", declared_acres: 7 }
              as: Underwriter
              captures: { cuid: $.data.id, liab: $.data.liability_cents, prem: $.data.premium_cents }
          assert:
            - "CoverageUnit.${cuid}.liability_cents == 280000   (7 * 40000)"
            - "CoverageUnit.${cuid}.premium_cents == 9324        (round_half_up(280000*333/10000))"

      - name: late_notification_penalty_72h_boundary_crop_hail
        claim_type: correct_result
        grounds: [calculations.late_notification_penalty]
        distinguishing_aspect: "Crop-hail window = 72h. Loss at T, report at T+72h exactly → penalty=0; report at T+72h+1s → penalty=10"
        test_recipe:
          setup: ["Carrier; grower; rate; BOUND+ACTIVE+PAID policy; CU REPORTED (timely planting)"]
          setup_api_calls:
            - call: "POST /carriers"
              payload: { carrier_code: "CHL-CA2", legal_name: "C", reinsurance_treaty_attachment_cents: 1000000 }
              as: PlatformAdmin
              captures: { cid: $.data.id }
            - call: "POST /carriers/${cid}/growers"
              payload: { full_name: "G", tax_id_last4: "1111", email: "g@x.com", county_code: "06001", state_code: "CA" }
              as: Underwriter
              captures: { gid: $.data.id }
            - call: "POST /carriers/${cid}/rate-tables"
              payload: { rating_kind: "CROP_HAIL", county_code: "06001", crop_code: "CORN", rate_per_100_cents_of_liability: 333, effective_from: "2026-01-01T00:00:00Z" }
              as: Underwriter
              captures: { rt: $.data.id }
            - call: "POST /carriers/${cid}/rate-tables/${rt}/publish"
              payload: {}
              as: Underwriter
            - call: "POST /carriers/${cid}/policies"
              payload: { grower_id: "${gid}", policy_kind: "CROP_HAIL", effective_date: "2026-08-02T00:00:00Z", expiration_date: "2026-12-31T00:00:00Z" }
              as: Underwriter
              captures: { pid: $.data.id }
            - call: "POST /carriers/${cid}/policies/${pid}/coverage-units"
              payload: { county_code: "06001", crop_code: "CORN", declared_acres: 2 }
              as: Underwriter
              captures: { cu1: $.data.id }
            - call: "POST /carriers/${cid}/policies/${pid}/coverage-units"
              payload: { county_code: "06001", crop_code: "CORN", declared_acres: 2 }
              as: Underwriter
              captures: { cu2: $.data.id }
            - call: "POST /carriers/${cid}/policies/${pid}/bind"
              payload: {}
              as: Underwriter
            - call: "POST /carriers/${cid}/policies/${pid}/premium-payments"
              payload: { amount_cents: 2664 }
              as: Policyholder
              as_user_id: "${gid}"
            - call: "POST /carriers/${cid}/_clock/set_current_utc"
              payload: { to_iso8601: "2026-08-03T00:00:00Z" }
              as: Underwriter
            - call: "POST /carriers/${cid}/policies/${pid}/coverage-units/${cu1}/acreage-reports"
              payload: { report_kind: "PLANTING", reported_acres: 2 }
              as: Policyholder
              as_user_id: "${gid}"
            - call: "POST /carriers/${cid}/policies/${pid}/coverage-units/${cu2}/acreage-reports"
              payload: { report_kind: "PLANTING", reported_acres: 2 }
              as: Policyholder
              as_user_id: "${gid}"
          trigger:
            # Loss at 2026-08-04T00:00:00Z, report at exactly T+72h = 2026-08-07T00:00:00Z
            - call: "POST /carriers/${cid}/_clock/set_current_utc"
              payload: { to_iso8601: "2026-08-07T00:00:00Z" }
              as: Underwriter
            - call: "POST /carriers/${cid}/policies/${pid}/claims"
              payload: { coverage_unit_id: "${cu1}", loss_date: "2026-08-04T00:00:00Z", percent_damage_estimate_pct: 10 }
              as: Policyholder
              as_user_id: "${gid}"
              captures: { c_a: $.data.id, pen_a: $.data.late_notification_penalty_pct, win_a: $.data.reported_within_window }
            # Loss at 2026-08-04T00:00:00Z, report at T+72h+1s = 2026-08-07T00:00:01Z
            - call: "POST /carriers/${cid}/_clock/set_current_utc"
              payload: { to_iso8601: "2026-08-07T00:00:01Z" }
              as: Underwriter
            - call: "POST /carriers/${cid}/policies/${pid}/claims"
              payload: { coverage_unit_id: "${cu2}", loss_date: "2026-08-04T00:00:00Z", percent_damage_estimate_pct: 10 }
              as: Policyholder
              as_user_id: "${gid}"
              captures: { c_b: $.data.id, pen_b: $.data.late_notification_penalty_pct, win_b: $.data.reported_within_window }
          assert:
            - "Claim.${c_a}.late_notification_penalty_pct == 0"
            - "Claim.${c_a}.reported_within_window == true   (boundary INCLUSIVE)"
            - "Claim.${c_b}.late_notification_penalty_pct == 10"
            - "Claim.${c_b}.reported_within_window == false"

