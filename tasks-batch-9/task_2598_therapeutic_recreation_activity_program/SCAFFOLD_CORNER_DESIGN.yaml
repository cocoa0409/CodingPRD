              captures: { prog_id: $.data.id }
            - call: "POST /recreation/rooms"
              payload: { name: "Immediate Read Room", capacity: 10, buffer_minutes: 0 }
              as: ActivityDirector
              captures: { room_id: $.data.id }
            - call: "POST /recreation/sessions"
              payload: { program_id: "${prog_id}", room_id: "${room_id}", starts_at: "2026-08-05T14:00:00Z", ends_at: "2026-08-05T15:00:00Z", assigned_staff_count: 4 }
              as: ActivityDirector
              captures: { sess_id: $.data.id }
            - call: "POST /recreation/sessions/${sess_id}/enrollments"
              payload: { resident_id: "${ra_id}" }
              as: ActivityAide
              captures: { reca_id: $.data.id }
            - call: "POST /recreation/sessions/${sess_id}/enrollments"
              payload: { resident_id: "${rb_id}" }
              as: ActivityAide
              captures: { recb_id: $.data.id }
            - call: "POST /recreation/_clock/set_current_utc"
              payload: { current_utc: "2026-08-05T14:00:00Z" }
              as: ActivityDirector
            - call: "POST /recreation/sessions/${sess_id}/status"
              payload: { action: "START" }
              as: ActivityAide
            - call: "PATCH /recreation/participation/${reca_id}"
              payload: { outcome: "ATTENDED", engagement_level: "LEADING" }
              as: ActivityAide
            - call: "PATCH /recreation/participation/${recb_id}"
              payload: { outcome: "ATTENDED", engagement_level: "ACTIVE" }
              as: ActivityAide
          trigger:
            - call: "POST /recreation/sessions/${sess_id}/status"
              payload: { action: "CLOSE_DOCUMENTATION" }
              as: ActivityAide
              captures: { closed_status: $.data.status, closed_at: $.data.documented_at, closed_enrolled: $.data.enrolled_count }
            - call: "GET /recreation/sessions/${sess_id}"
              as: ActivityAide
              captures: { reread_status: $.data.status, reread_at: $.data.documented_at, reread_enrolled: $.data.enrolled_count }
            - call: "GET /recreation/residents/${ra_id}"
              as: RecreationTherapist
              captures: { ida_index: $.data.engagement_index }
            - call: "GET /recreation/residents/${rb_id}"
              as: RecreationTherapist
              captures: { ivan_index: $.data.engagement_index }
          assert:
            - "the CLOSE_DOCUMENTATION response itself carries ${closed_status} == \"DOCUMENTED\", a non-null ${closed_at} and ${closed_enrolled} == 2"
            - "${reread_status} == ${closed_status}, ${reread_at} == ${closed_at} and ${reread_enrolled} == ${closed_enrolled} — the re-read is byte-for-byte the same, nothing having lagged"
            - "${ida_index} == 1.0, a single LEADING record scoring 4 of a possible 4"
            - "${ivan_index} == 0.75, a single ACTIVE record scoring 3 of a possible 4"
            - "ParticipationRecord.${reca_id}.status == FINALIZED and ParticipationRecord.${recb_id}.status == FINALIZED, both children finalized inside the one close call"
