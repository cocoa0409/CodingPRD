        claim_type: conditional_action
        grounds:
          - endpoints[PATCH /capital/cycles/{id}]
          - validations[priority=50]
        distinguishing_aspect: >-
          The budget envelope is editable only while the cycle is DRAFT; opening intake freezes
          total_capital_cents and both contingency percentages for the rest of the cycle's life, so the
          same PATCH that worked a moment ago returns ERR_CYCLE_INVALID_STATE and leaves the version alone.
        test_recipe:
          setup:
            - "A single DRAFT cycle for plan year 2027."
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { now: "2026-08-01T00:00:00Z" }
              as: CapitalPlanner
              as_user_id: "planner-setup"
            - call: "POST /capital/cycles"
              payload: { plan_year: 2027, plan_year_start: "2027-01-01T00:00:00Z", total_capital_cents: 500000000, contingency_pct: 0.00, facility_contingency_pct: 0.00 }
              as: CapitalPlanner
              as_user_id: "planner-setup"
              captures: { c_id: $.data.id }
          trigger:
            - call: "PATCH /capital/cycles/${c_id}"
              payload: { total_capital_cents: 900000000, contingency_pct: 0.10, facility_contingency_pct: 0.05 }
              as: CapitalPlanner
              as_user_id: "planner-setup"
            - call: "POST /capital/cycles/${c_id}/open-intake"
              payload: {}
              as: CapitalPlanner
              as_user_id: "planner-setup"
            - call: "PATCH /capital/cycles/${c_id}"
              payload: { total_capital_cents: 100000000 }
              as: CapitalPlanner
              as_user_id: "planner-setup"
              captures: { e_cycle_state: $.data.error_id }
          assert:
            - "Trigger step 1: HTTP 200 with total_capital_cents 900000000, contingency_pct 0.10, facility_contingency_pct 0.05, status still DRAFT, version 2; every aggregate (distributable_cents, system_contingency_cents, allocation_count) is still 0 because those are written only by allocate"
            - "Trigger step 2: status INTAKE_OPEN at version 3"
            - "Trigger step 3: ${e_cycle_state} == ERR_CYCLE_INVALID_STATE at HTTP 409; the cycle is still INTAKE_OPEN at version 3 with total_capital_cents 900000000"

      - name: patching_a_project_excludes_its_own_row_and_clearing_the_flag_drops_both_bounds
        claim_type: standard_crud
        grounds:
          - endpoints[PATCH /capital/installation-projects/{id}]
          - validations[priority=84]
          - validations[priority=85]
          - validations[priority=83]
        distinguishing_aspect: >-
          A PATCH that shifts a window by twelve hours would collide with the row's OWN stored interval
          under both V46 and V47, so the endpoint must exclude the patched row from both comparison sets;
          and turning construction_required off is not just a flag flip — it moves construction_status to
          NOT_REQUIRED and clears both bounds, after which supplying a bound again is a V45 violation.
