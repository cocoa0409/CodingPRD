  # ---------------------------------------------------------------------------
  - rule_id: transitive_cascade
    instances:
      - name: layup_session_to_permit_exhaustion_cascade
        grounds:
          - state_machines.ResinBatch.MIXED_to_PARTIALLY_CONSUMED
          - state_machines.EmissionPermit.ACTIVE_to_EXHAUSTED
          - calculations.styrene_emission_kg
        distinguishing_aspect: |
          Depth-3 cascade from POST /layup-sessions: (1) session debits the
          batch's consumed/remaining mass; (2) the resin consumption itself
          posts styrene_emitted_kg into the selected permit's styrene_used_kg;
          (3) that posting crossing the quota flips the permit ACTIVE ->
          EXHAUSTED, which then refuses further sessions. Companion cascade
          originates from a different trigger (cure completion).
        test_recipe:
          setup:
            - "Clock T0; permit PER-TINY quota exactly 0.0176 kg; approved PN-100; PRODUCTION mold; WO-X1 in LAYUP_IN_PROGRESS; batch 1020 g"
          setup_api_calls:
            - { call: "POST /_clock/set_current_utc", payload: { to_iso8601: "2026-06-01T10:00:00Z" }, as: ShopManager }
            - { call: "POST /emission-permits", payload: { permit_code: "PER-TINY", period_start: "2026-06-01T00:00:00Z", period_end: "2026-09-01T00:00:00Z", styrene_quota_kg: 0.0176 }, as: EHSOfficer, captures: { per_id: $.data.id } }
            - { call: "POST /molds", payload: { mold_code: "MOLD-X1", maintenance_interval_cycles: 10, prototype_parts_required: 1, tooling_phase: "PRODUCTION" }, as: ToolingEngineer, captures: { mold_id: $.data.id } }
            - { call: "POST /ply-books", payload: { part_number: "PN-100", revision: "A", part_area_m2: 2.0, plies: [ { seq: 1, material_code: "CF-200", orientation_deg: 0, areal_weight_g_m2: 200 }, { seq: 2, material_code: "CF-300", orientation_deg: 90, areal_weight_g_m2: 300 } ], resin_system: "POLYESTER", target_fiber_volume_pct: 0.5 }, as: ToolingEngineer, captures: { pb_id: $.data.id } }
            - { call: "POST /ply-books/${pb_id}/approve", payload: {}, as: ToolingEngineer }
            - { call: "POST /work-orders", payload: { work_order_no: "WO-X1", part_number: "PN-100", mold_id: "${mold_id}", ply_book_id: "${pb_id}", quantity: 1, due_date: "2026-07-01T00:00:00Z" }, as: ShopManager, captures: { wo_id: $.data.id } }
            - { call: "POST /work-orders/${wo_id}/start-layup", payload: {}, as: Laminator, as_user_id: "op-lam-1" }
            - { call: "POST /resin-batches", payload: { batch_code: "BATCH-X1", resin_system: "POLYESTER", resin_mass_g: 1000, catalyst_mass_g: 20, target_ratio_pct: 2.0, ratio_tolerance_pct: 1.0, nominal_pot_life_minutes: 600 }, as: Laminator, as_user_id: "op-lam-1", captures: { batch_id: $.data.id } }
          trigger:
            - { call: "POST /layup-sessions", payload: { work_order_id: "${wo_id}", resin_batch_id: "${batch_id}", resin_used_g: 250 }, as: Laminator, as_user_id: "op-lam-1" }
            - { call: "POST /layup-sessions", payload: { work_order_id: "${wo_id}", resin_batch_id: "${batch_id}", resin_used_g: 250 }, as: Laminator, as_user_id: "op-lam-1" }
            - { call: "GET /emission-permits/${per_id}", payload: {}, as: EHSOfficer, captures: { per_status: $.data.status, per_used: $.data.styrene_used_kg } }
            - { call: "GET /resin-batches/${batch_id}", payload: {}, as: Laminator, as_user_id: "op-lam-1", captures: { batch_remaining: $.data.remaining_mass_g } }
            - { call: "POST /layup-sessions", payload: { work_order_id: "${wo_id}", resin_batch_id: "${batch_id}", resin_used_g: 100 }, as: Laminator, as_user_id: "op-lam-1", captures: { err3: $.data.error_id } }
          assert:
            - "per_used == 0.0176 (exactly the quota: the second posting was admitted at equality)"
            - "per_status == EXHAUSTED (cascade link 3 fired on the >= boundary)"
            - "batch_remaining == 520.0 (cascade link 1 applied per session: 1020 - 500)"
            - "err3 == ERR_NO_ACTIVE_PERMIT (EXHAUSTED permit no longer selected; downstream gate of the cascade)"

      - name: cure_complete_to_mold_maintenance_cascade
        grounds:
          - state_machines.CureCycle.RUNNING_to_COMPLETED
