# =============================================================================
# §1.8 Scaffold Difficulty Design (Test Targeting Index)
# Online Tutoring Marketplace — 9 Difficulty Rules x >=2 instances each.
#
# Shared chain conventions (each instance re-declares its own calls, but the
# producing pattern is identical):
#   - Clock is set first; all scheduled_start values are in the future relative
#     to the current clock; deliver requires the clock advanced past the start.
#   - A CommissionPolicy is created then activated so settlement has a tier table.
#   - A Tutor is VERIFIED by submitting a Credential, start-review, verify.
#   - A TutorSubjectTag is proposed by the Tutor then approved by the TrustOfficer.
#   - The FIRST non-cancelled booking for a (student,tutor) pair is a TRIAL; a
#     standard session therefore requires a prior trial booking to exist for the
#     same pair.
# Policy used throughout: tier_breakpoints_cents [0,100000,1000000],
#   tier_rates_bps [2500,1500,800], trial_commission_bps 5000,
#   trial_max_billed_minutes 30, refund_window_hours 168.
# =============================================================================

scaffold_difficulty_design:

  # ===========================================================================
  - rule_id: dual_variant_calc
    instances:
      # --- Instance 1: Session/Settlement domain — trial vs standard commission ---
      - name: trial_vs_standard_settlement_net_diverges
        grounds:
          - calculations.session_settlement_amount
          - state_machines.Session.REPORTED_to_CONFIRMED
          - entities.Settlement.fields.tutor_net_cents
        distinguishing_aspect: |
          Same tutor, same billed_minutes (30) and same gross (3000c), but the
          trial variant charges trial_commission_bps (5000) while the standard
          variant charges the tier rate (2500), so tutor_net is 1500 (trial)
          vs 2250 (standard) — a 750c divergence on the Session/Settlement domain.
        test_recipe:
          setup:
            - "ACTIVE CommissionPolicy with the standard tier table and trial bps 5000."
            - "VERIFIED Tutor (rate 6000c/hr) with an APPROVED tag on a non-credential subject."
            - "Parent with 100000c wallet, one student."
            - "Trial booking #1 (planned 30) delivered (actual 45 -> billed capped 30) and CONFIRMED -> trial Settlement net 1500."
            - "Standard booking #2 for the same (student,tutor) pair, planned 30, delivered (actual 30 -> billed 30), about to be CONFIRMED."
          setup_api_calls:
            - call: "POST /_clock/set"
              payload: { to_iso8601: "2026-06-01T00:00:00Z" }
              as: PlatformAdmin
            - call: "POST /commission-policies"
              payload: { name: "P1", tier_breakpoints_cents: [0, 100000, 1000000], tier_rates_bps: [2500, 1500, 800], trial_commission_bps: 5000, trial_max_billed_minutes: 30, refund_window_hours: 168 }
              as: PlatformAdmin
              captures: { policy_id: $.data.id }
            - call: "POST /commission-policies/${policy_id}/activate"
              payload: {}
              as: PlatformAdmin
            - call: "POST /subjects"
              payload: { code: "MATH_ALG2", display_name: "Algebra 2", category: "STEM", requires_credential: false }
              as: PlatformAdmin
              captures: { subj_id: $.data.id }
            - call: "POST /tutors"
              payload: { email: "t1@x.com", full_name: "T One", base_hourly_rate_cents: 6000 }
              as: PlatformAdmin
              captures: { tutor_id: $.data.id }
            - call: "POST /credentials"
              payload: { tutor_id: "${tutor_id}", subject_id: "${subj_id}", kind: "DEGREE", document_ref: "doc1" }
              as: Tutor
              as_user_id: "${tutor_id}"
              captures: { cred_id: $.data.id }
            - call: "POST /credentials/${cred_id}/start-review"
              payload: {}
              as: TrustOfficer
            - call: "POST /credentials/${cred_id}/verify"
              payload: {}
              as: TrustOfficer
            - call: "POST /subject-tags"
              payload: { tutor_id: "${tutor_id}", subject_id: "${subj_id}" }
              as: Tutor
              as_user_id: "${tutor_id}"
              captures: { tag_id: $.data.id }
            - call: "POST /subject-tags/${tag_id}/approve"
              payload: {}
              as: TrustOfficer
            - call: "POST /parent-accounts"
              payload: { email: "p1@x.com", full_name: "P One" }
              as: ParentGuardian
              captures: { parent_id: $.data.id }
            - call: "POST /parent-accounts/${parent_id}/deposit"
              payload: { amount_cents: 100000 }
              as: ParentGuardian
              as_user_id: "${parent_id}"
            - call: "POST /parent-accounts/${parent_id}/students"
              payload: { display_name: "Kid", grade_level: 9 }
              as: ParentGuardian
              as_user_id: "${parent_id}"
              captures: { student_id: $.data.id }
            - call: "POST /bookings"
              payload: { parent_account_id: "${parent_id}", student_id: "${student_id}", tutor_id: "${tutor_id}", subject_id: "${subj_id}", scheduled_start: "2026-06-02T10:00:00Z", planned_minutes: 30 }
              as: ParentGuardian
              as_user_id: "${parent_id}"
              captures: { trial_booking_id: $.data.id }
            - call: "POST /_clock/set"
              payload: { to_iso8601: "2026-06-02T11:00:00Z" }
              as: PlatformAdmin
            - call: "POST /bookings/${trial_booking_id}/deliver"
              payload: { actual_minutes: 45 }
              as: Tutor
              as_user_id: "${tutor_id}"
              captures: { trial_session_id: $.data.id }
            - call: "POST /sessions/${trial_session_id}/confirm"
              payload: {}
              as: ParentGuardian
              as_user_id: "${parent_id}"
            - call: "POST /bookings"
              payload: { parent_account_id: "${parent_id}", student_id: "${student_id}", tutor_id: "${tutor_id}", subject_id: "${subj_id}", scheduled_start: "2026-06-03T10:00:00Z", planned_minutes: 30 }
              as: ParentGuardian
              as_user_id: "${parent_id}"
              captures: { std_booking_id: $.data.id }
            - call: "POST /_clock/set"
              payload: { to_iso8601: "2026-06-03T11:00:00Z" }
              as: PlatformAdmin
            - call: "POST /bookings/${std_booking_id}/deliver"
              payload: { actual_minutes: 30 }
              as: Tutor
              as_user_id: "${tutor_id}"
              captures: { std_session_id: $.data.id }
          trigger:
            - call: "POST /sessions/${std_session_id}/confirm"
              payload: {}
              as: ParentGuardian
              as_user_id: "${parent_id}"
            - call: "GET /settlements?session_id=${trial_session_id}"
              payload: {}
              as: TrustOfficer
              captures: { trial_net: "$.data[0].tutor_net_cents" }
            - call: "GET /settlements?session_id=${std_session_id}"
              payload: {}
              as: TrustOfficer
              captures: { std_net: "$.data[0].tutor_net_cents" }
          assert:
            - "settlement for trial_session_id has gross_amount_cents == 3000, commission_bps == 5000, tutor_net_cents == 1500"
            - "settlement for std_session_id has gross_amount_cents == 3000, commission_bps == 2500, tutor_net_cents == 2250"
            - "std tutor_net_cents (2250) - trial tutor_net_cents (1500) == 750"

      # --- Instance 2: ParentAccount/RefundCase domain — negotiated vs arbitrated grant ---
      - name: negotiated_vs_arbitrated_refund_grant_diverges
        grounds:
          - calculations.refund_grant_basis
          - state_machines.RefundCase.TUTOR_COUNTERED_to_AGREED
          - state_machines.RefundCase.ARBITRATION_to_RESOLVED_REFUND
          - entities.RefundCase.fields.granted_amount_cents
        distinguishing_aspect: |
          On the RefundCase/ParentAccount domain (not Session settlement), a case
          resolved by accept-counter grants tutor_offer_cents (1000) and applies NO
          reliability penalty, whereas an arbitrated REFUND on an equivalent case
          grants the Arbiter's awarded amount (1500) AND applies the acute
          arbitrated-refund penalty to the tutor — two valid resolutions diverge in
          both granted_amount_cents and tutor reliability side-effect.
        test_recipe:
          setup:
            - "Two CONFIRMED standard sessions (gross 6000 each) by the same tutor, each with an open RefundCase claiming 2000."
            - "Case A: tutor countered 1000, parent about to accept-counter (negotiated)."
            - "Case B: parent escalated after one round; about to be arbitrated REFUND awarding 1500."
          setup_api_calls:
            - call: "POST /_clock/set"
              payload: { to_iso8601: "2026-06-01T00:00:00Z" }
              as: PlatformAdmin
            - call: "POST /commission-policies"
              payload: { name: "P1", tier_breakpoints_cents: [0, 100000, 1000000], tier_rates_bps: [2500, 1500, 800], trial_commission_bps: 5000, trial_max_billed_minutes: 30, refund_window_hours: 168 }
              as: PlatformAdmin
              captures: { policy_id: $.data.id }
            - call: "POST /commission-policies/${policy_id}/activate"
              payload: {}
              as: PlatformAdmin
            - call: "POST /subjects"
              payload: { code: "MATH_ALG2", display_name: "Algebra 2", category: "STEM", requires_credential: false }
              as: PlatformAdmin
              captures: { subj_id: $.data.id }
            - call: "POST /tutors"
              payload: { email: "t1@x.com", full_name: "T One", base_hourly_rate_cents: 6000 }
              as: PlatformAdmin
              captures: { tutor_id: $.data.id }
            - call: "POST /credentials"
              payload: { tutor_id: "${tutor_id}", subject_id: "${subj_id}", kind: "DEGREE", document_ref: "doc1" }
              as: Tutor
              as_user_id: "${tutor_id}"
              captures: { cred_id: $.data.id }
            - call: "POST /credentials/${cred_id}/start-review"
              payload: {}
              as: TrustOfficer
            - call: "POST /credentials/${cred_id}/verify"
              payload: {}
              as: TrustOfficer
            - call: "POST /subject-tags"
              payload: { tutor_id: "${tutor_id}", subject_id: "${subj_id}" }
              as: Tutor
              as_user_id: "${tutor_id}"
              captures: { tag_id: $.data.id }
            - call: "POST /subject-tags/${tag_id}/approve"
              payload: {}
              as: TrustOfficer
            - call: "POST /parent-accounts"
              payload: { email: "p1@x.com", full_name: "P One" }
              as: ParentGuardian
              captures: { parent_id: $.data.id }
            - call: "POST /parent-accounts/${parent_id}/deposit"
              payload: { amount_cents: 100000 }
              as: ParentGuardian
              as_user_id: "${parent_id}"
            - call: "POST /parent-accounts/${parent_id}/students"
              payload: { display_name: "Kid", grade_level: 9 }
              as: ParentGuardian
              as_user_id: "${parent_id}"
              captures: { student_id: $.data.id }
            # trial booking to consume the trial slot for this pair
            - call: "POST /bookings"
              payload: { parent_account_id: "${parent_id}", student_id: "${student_id}", tutor_id: "${tutor_id}", subject_id: "${subj_id}", scheduled_start: "2026-06-02T08:00:00Z", planned_minutes: 30 }
              as: ParentGuardian
              as_user_id: "${parent_id}"
              captures: { trial_booking_id: $.data.id }
            - call: "POST /_clock/set"
              payload: { to_iso8601: "2026-06-02T09:00:00Z" }
              as: PlatformAdmin
            - call: "POST /bookings/${trial_booking_id}/deliver"
              payload: { actual_minutes: 30 }
              as: Tutor
              as_user_id: "${tutor_id}"
              captures: { trial_session_id: $.data.id }
            - call: "POST /sessions/${trial_session_id}/confirm"
              payload: {}
              as: ParentGuardian
              as_user_id: "${parent_id}"
            # standard booking A
            - call: "POST /bookings"
              payload: { parent_account_id: "${parent_id}", student_id: "${student_id}", tutor_id: "${tutor_id}", subject_id: "${subj_id}", scheduled_start: "2026-06-03T10:00:00Z", planned_minutes: 60 }
              as: ParentGuardian
              as_user_id: "${parent_id}"
              captures: { book_a_id: $.data.id }
            # standard booking B
            - call: "POST /bookings"
              payload: { parent_account_id: "${parent_id}", student_id: "${student_id}", tutor_id: "${tutor_id}", subject_id: "${subj_id}", scheduled_start: "2026-06-03T12:00:00Z", planned_minutes: 60 }
              as: ParentGuardian
              as_user_id: "${parent_id}"
              captures: { book_b_id: $.data.id }
            - call: "POST /_clock/set"
              payload: { to_iso8601: "2026-06-03T14:00:00Z" }
              as: PlatformAdmin
            - call: "POST /bookings/${book_a_id}/deliver"
              payload: { actual_minutes: 60 }
              as: Tutor
              as_user_id: "${tutor_id}"
              captures: { sess_a_id: $.data.id }
            - call: "POST /sessions/${sess_a_id}/confirm"
              payload: {}
              as: ParentGuardian
              as_user_id: "${parent_id}"
            - call: "POST /bookings/${book_b_id}/deliver"
              payload: { actual_minutes: 60 }
              as: Tutor
              as_user_id: "${tutor_id}"
              captures: { sess_b_id: $.data.id }
            - call: "POST /sessions/${sess_b_id}/confirm"
              payload: {}
              as: ParentGuardian
              as_user_id: "${parent_id}"
            # Case A (negotiated): open, tutor counter 1000
            - call: "POST /refund-cases"
              payload: { session_id: "${sess_a_id}", claimed_amount_cents: 2000 }
              as: ParentGuardian
              as_user_id: "${parent_id}"
              captures: { case_a_id: $.data.id, case_a_v: $.data.version }
            - call: "POST /refund-cases/${case_a_id}/counter"
              payload: { counter_amount_cents: 1000, expected_refund_case_version: "${case_a_v}" }
              as: Tutor
              as_user_id: "${tutor_id}"
              captures: { case_a_v2: $.data.version }
            # Case B (arbitrated): open, counter once (round 1) then escalate
            - call: "POST /refund-cases"
              payload: { session_id: "${sess_b_id}", claimed_amount_cents: 2000 }
              as: ParentGuardian
              as_user_id: "${parent_id}"
              captures: { case_b_id: $.data.id, case_b_v: $.data.version }
            - call: "POST /refund-cases/${case_b_id}/counter"
              payload: { counter_amount_cents: 800, expected_refund_case_version: "${case_b_v}" }
              as: Tutor
              as_user_id: "${tutor_id}"
            - call: "POST /refund-cases/${case_b_id}/escalate"
              payload: {}
              as: ParentGuardian
              as_user_id: "${parent_id}"
          trigger:
            - call: "POST /refund-cases/${case_a_id}/accept-counter"
              payload: { expected_refund_case_version: "${case_a_v2}" }
              as: ParentGuardian
              as_user_id: "${parent_id}"
              captures: { case_a_grant: $.data.granted_amount_cents }
            - call: "POST /refund-cases/${case_b_id}/arbitrate"
              payload: { ruling: "REFUND", awarded_amount_cents: 1500 }
              as: Arbiter
              captures: { case_b_grant: $.data.granted_amount_cents }
          assert:
            - "RefundCase ${case_a_id}.granted_amount_cents == 1000 (negotiated == tutor_offer_cents)"
            - "RefundCase ${case_b_id}.granted_amount_cents == 1500 (arbitrated == awarded_amount_cents)"
            - "Tutor ${tutor_id}.reliability_score after case_b arbitrate is lower than after case_a accept-counter (acute arbitrated-refund penalty applied only on the arbitrated path)"

  # ===========================================================================
  - rule_id: combinatorial_formula
    instances:
      # --- Instance 1: mode (a) — billed_minutes nested-min with 3 inputs ---
      - name: billed_minutes_nested_min_three_inputs
        grounds:
          - calculations.billed_minutes
          - state_machines.Booking.SCHEDULED_to_DELIVERED
          - entities.Session.fields.billed_minutes
        distinguishing_aspect: |
          Mode (a): billed_minutes = min(actual_minutes, planned+15, trial_cap)
          where the trial_cap term is present only when is_trial. With actual=120,
          planned=60, the overtime cap (75) wins for a standard booking; for a trial
          booking with planned=60 the trial cap (30) wins instead — three inputs
          interacting through nested min, non-linear.
        test_recipe:
          setup:
            - "VERIFIED tutor with APPROVED non-credential tag; parent funded; one student."
            - "Standard booking (second for the pair) planned 60, delivered actual 120."
          setup_api_calls:
            - call: "POST /_clock/set"
              payload: { to_iso8601: "2026-06-01T00:00:00Z" }
              as: PlatformAdmin
            - call: "POST /commission-policies"
              payload: { name: "P1", tier_breakpoints_cents: [0, 100000, 1000000], tier_rates_bps: [2500, 1500, 800], trial_commission_bps: 5000, trial_max_billed_minutes: 30, refund_window_hours: 168 }
              as: PlatformAdmin
              captures: { policy_id: $.data.id }
            - call: "POST /commission-policies/${policy_id}/activate"
              payload: {}
              as: PlatformAdmin
            - call: "POST /subjects"
              payload: { code: "MATH_ALG2", display_name: "Algebra 2", category: "STEM", requires_credential: false }
              as: PlatformAdmin
              captures: { subj_id: $.data.id }
            - call: "POST /tutors"
              payload: { email: "t1@x.com", full_name: "T One", base_hourly_rate_cents: 6000 }
              as: PlatformAdmin
              captures: { tutor_id: $.data.id }
            - call: "POST /credentials"
              payload: { tutor_id: "${tutor_id}", subject_id: "${subj_id}", kind: "DEGREE", document_ref: "doc1" }
              as: Tutor
              as_user_id: "${tutor_id}"
              captures: { cred_id: $.data.id }
            - call: "POST /credentials/${cred_id}/start-review"
              payload: {}
              as: TrustOfficer
            - call: "POST /credentials/${cred_id}/verify"
              payload: {}
              as: TrustOfficer
            - call: "POST /subject-tags"
              payload: { tutor_id: "${tutor_id}", subject_id: "${subj_id}" }
              as: Tutor
              as_user_id: "${tutor_id}"
              captures: { tag_id: $.data.id }
            - call: "POST /subject-tags/${tag_id}/approve"
              payload: {}
              as: TrustOfficer
            - call: "POST /parent-accounts"
              payload: { email: "p1@x.com", full_name: "P One" }
              as: ParentGuardian
              captures: { parent_id: $.data.id }
            - call: "POST /parent-accounts/${parent_id}/deposit"
              payload: { amount_cents: 100000 }
              as: ParentGuardian
              as_user_id: "${parent_id}"
            - call: "POST /parent-accounts/${parent_id}/students"
              payload: { display_name: "Kid", grade_level: 9 }
              as: ParentGuardian
              as_user_id: "${parent_id}"
              captures: { student_id: $.data.id }
            - call: "POST /bookings"
              payload: { parent_account_id: "${parent_id}", student_id: "${student_id}", tutor_id: "${tutor_id}", subject_id: "${subj_id}", scheduled_start: "2026-06-02T08:00:00Z", planned_minutes: 30 }
              as: ParentGuardian
              as_user_id: "${parent_id}"
              captures: { trial_booking_id: $.data.id }
            - call: "POST /_clock/set"
              payload: { to_iso8601: "2026-06-02T09:00:00Z" }
              as: PlatformAdmin
            - call: "POST /bookings/${trial_booking_id}/deliver"
              payload: { actual_minutes: 30 }
              as: Tutor
              as_user_id: "${tutor_id}"
              captures: { trial_session_id: $.data.id }
            - call: "POST /sessions/${trial_session_id}/confirm"
              payload: {}
              as: ParentGuardian
              as_user_id: "${parent_id}"
            - call: "POST /bookings"
              payload: { parent_account_id: "${parent_id}", student_id: "${student_id}", tutor_id: "${tutor_id}", subject_id: "${subj_id}", scheduled_start: "2026-06-03T10:00:00Z", planned_minutes: 60 }
              as: ParentGuardian
              as_user_id: "${parent_id}"
              captures: { std_booking_id: $.data.id }
            - call: "POST /_clock/set"
              payload: { to_iso8601: "2026-06-03T11:00:00Z" }
              as: PlatformAdmin
          trigger:
            - call: "POST /bookings/${std_booking_id}/deliver"
              payload: { actual_minutes: 120 }
              as: Tutor
              as_user_id: "${tutor_id}"
              captures: { std_session_id: $.data.id, std_billed: $.data.billed_minutes }
          assert:
            - "Session ${std_session_id}.billed_minutes == 75 (overtime cap planned+15 wins; trial cap not applied because booking is standard)"

      # --- Instance 2: mode (c) — settlement_reversal explicit evaluation order ---
      - name: settlement_reversal_order_pinned_clawback
        grounds:
          - calculations.settlement_reversal
          - state_machines.RefundCase.AGREED_to_RESOLVED_REFUND
          - entities.Tutor.fields.clawback_owed_cents
          - entities.Settlement.fields.refunded_cents
        distinguishing_aspect: |
          Mode (c): the reversal looks circular (clawback depends on balance which
          depends on reversals) so the order is pinned: read payout_balance (4500)
          FIRST, debit min(g,balance), THEN clawback = g - debit. Full refund g=6000
          on a tutor holding only the net 4500 yields debit 4500, clawback 1500 —
          computing clawback before the debit would double-count. The trial slot for
          the pair is consumed by a NO_SHOW booking (which never settles), so the only
          settlement that funds the balance is the single standard session.
        test_recipe:
          setup:
            - "The (student,tutor) trial slot is consumed by a first booking marked NO_SHOW (no settlement, no balance)."
            - "One CONFIRMED standard session (gross 6000, net 4500); tutor payout_balance == 4500 exactly."
            - "Open RefundCase claiming 6000; tutor accepts the parent's full offer (accept-offer)."
          setup_api_calls:
            - call: "POST /_clock/set"
              payload: { to_iso8601: "2026-06-01T00:00:00Z" }
              as: PlatformAdmin
            - call: "POST /commission-policies"
              payload: { name: "P1", tier_breakpoints_cents: [0, 100000, 1000000], tier_rates_bps: [2500, 1500, 800], trial_commission_bps: 5000, trial_max_billed_minutes: 30, refund_window_hours: 168 }
              as: PlatformAdmin
              captures: { policy_id: $.data.id }
            - call: "POST /commission-policies/${policy_id}/activate"
              payload: {}
              as: PlatformAdmin
            - call: "POST /subjects"
              payload: { code: "MATH_ALG2", display_name: "Algebra 2", category: "STEM", requires_credential: false }
              as: PlatformAdmin
              captures: { subj_id: $.data.id }
            - call: "POST /tutors"
              payload: { email: "t1@x.com", full_name: "T One", base_hourly_rate_cents: 6000 }
              as: PlatformAdmin
              captures: { tutor_id: $.data.id }
            - call: "POST /credentials"
              payload: { tutor_id: "${tutor_id}", subject_id: "${subj_id}", kind: "DEGREE", document_ref: "doc1" }
              as: Tutor
              as_user_id: "${tutor_id}"
              captures: { cred_id: $.data.id }
            - call: "POST /credentials/${cred_id}/start-review"
              payload: {}
              as: TrustOfficer
            - call: "POST /credentials/${cred_id}/verify"
              payload: {}
              as: TrustOfficer
            - call: "POST /subject-tags"
              payload: { tutor_id: "${tutor_id}", subject_id: "${subj_id}" }
              as: Tutor
              as_user_id: "${tutor_id}"
              captures: { tag_id: $.data.id }
            - call: "POST /subject-tags/${tag_id}/approve"
              payload: {}
              as: TrustOfficer
            - call: "POST /parent-accounts"
              payload: { email: "p1@x.com", full_name: "P One" }
              as: ParentGuardian
              captures: { parent_id: $.data.id }
            - call: "POST /parent-accounts/${parent_id}/deposit"
              payload: { amount_cents: 100000 }
              as: ParentGuardian
              as_user_id: "${parent_id}"
            - call: "POST /parent-accounts/${parent_id}/students"
              payload: { display_name: "Kid", grade_level: 9 }
              as: ParentGuardian
              as_user_id: "${parent_id}"
              captures: { student_id: $.data.id }
            # trial slot consumed by a NO_SHOW booking (never settles -> no tutor balance)
            - call: "POST /bookings"
              payload: { parent_account_id: "${parent_id}", student_id: "${student_id}", tutor_id: "${tutor_id}", subject_id: "${subj_id}", scheduled_start: "2026-06-02T08:00:00Z", planned_minutes: 30 }
              as: ParentGuardian
              as_user_id: "${parent_id}"
              captures: { trial_booking_id: $.data.id }
            - call: "POST /_clock/set"
              payload: { to_iso8601: "2026-06-02T09:00:00Z" }
