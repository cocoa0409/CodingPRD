# =============================================================================
# §1.8 Scaffold Difficulty Design (Test Targeting Index)
# Task 0548 — Gutter Installation & Leaf-Guard
# 9 rule_ids, 19 instances. Every grounds ref resolves into SCAFFOLD.yaml
# §1.1-§1.7. Every formula-derived assert is a pre-computed literal.
# =============================================================================
scaffold_difficulty_design:

  # ===========================================================================
  - rule_id: dual_variant_calc
    instances:
      - name: quote_provisional_vs_final_total
        grounds:
          - calculations.quote_pricing
          - state_machines.Quote.DRAFT_to_PRESENTED
          - entities.Quote.fields.total_cents
          - entities.Quote.fields.estimated_linear_feet
          - entities.Quote.fields.measured_linear_feet
        distinguishing_aspect: |
          On the Quote domain, the PROVISIONAL total (feet = estimated_linear_feet, 180)
          and the FINAL total (feet = measured_linear_feet, 210) diverge (588600 vs 654750)
          for identical product/color/downspout — dual variant on cost accounting.
        test_recipe:
          setup:
            - "Product MicroMesh (LEAF_GUARD, base 3000 c/ft, COPPER premium surcharge 500 c/ft)"
            - "Lead with completed measure appointment measured_linear_feet=210"
            - "Quote created with estimated_linear_feet=180, COPPER, 2 downspouts, discount_pct=0.10 (PROVISIONAL total 588600)"
          setup_api_calls:
            - call: "POST /api/products"
              payload: { name: "MicroMesh", category: "LEAF_GUARD", base_rate_cents_per_foot: 3000, available_colors: ["WHITE","BRONZE","BLACK","COPPER"], premium_colors: ["COPPER"], color_surcharge_cents_per_foot: 500 }
              as: Admin
              captures: { pid: "$.data.id" }
            - call: "POST /api/sales-reps"
              payload: { full_name: "Rep A", region: "NE" }
              as: Admin
              captures: { rep: "$.data.id" }
            - call: "POST /api/leads"
              payload: { full_name: "Homeowner 1", address: "1 Maple St", phone: "555-0101", region: "NE", sales_rep_id: "${rep}" }
              as: Admin
              captures: { lead: "$.data.id" }
            - call: "POST /api/appointments"
              payload: { lead_id: "${lead}", sales_rep_id: "${rep}", scheduled_start: "2026-06-01T10:00:00Z", scheduled_end: "2026-06-01T11:00:00Z" }
              as: Admin
              captures: { appt: "$.data.id" }
            - call: "POST /api/appointments/${appt}/transition"
              payload: { to_status: "CONFIRMED" }
              as: Admin
            - call: "POST /api/appointments/${appt}/transition"
              payload: { to_status: "COMPLETED", measured_linear_feet: 210 }
              as: Admin
            - call: "GET /api/leads/${lead}"
              payload: {}
              as: Admin
              captures: { lv: "$.data.version" }
            - call: "POST /api/quotes"
              payload: { lead_id: "${lead}", appointment_id: "${appt}", sales_rep_id: "${rep}", product_id: "${pid}", color: "COPPER", estimated_linear_feet: 180, downspout_count: 2, discount_pct: 0.10, expected_lead_version: "${lv}" }
              as: Admin
              captures: { qid: "$.data.id", prov_total: "$.data.total_cents" }
          trigger:
            - call: "POST /api/quotes/${qid}/present"
              payload: {}
              as: Admin
              captures: { final_total: "$.data.total_cents", qstatus: "$.data.status", qmeas: "$.data.measured_linear_feet" }
          assert:
            - "prov_total == 588600 (PROVISIONAL: feet 180, tier T1 rate 3000, subtotal 654000, discount 65400)"
            - "final_total == 654750 (FINAL: feet 210, tier T2 rate 2850, subtotal 727500, discount 72750)"
            - "final_total (654750) != prov_total (588600) — dual-variant divergence on the Quote domain"
            - "qstatus == PRESENTED and qmeas == 210"

      - name: financing_deferred_vs_amortized_cost
        grounds:
          - calculations.financing_cost
          - entities.FinancingPlan.fields.total_cost_cents
          - entities.FinancingPlan.fields.plan_type
          - entities.FinancingPlan.fields.principal_cents
        distinguishing_aspect: |
          On the FinancingPlan domain, the same principal (570000) financed as
          DEFERRED_INTEREST (total_cost 570000) vs AMORTIZED @12% APR (total_cost 607728)
          yields different total cost — dual variant on a different entity than Quote pricing.
        test_recipe:
          setup:
            - "PRESENTED quote with total_cents 570000 (feet 200, WHITE, 0 downspouts, discount 0)"
            - "One DEFERRED_INTEREST financing plan already offered on that quote"
          setup_api_calls:
            - call: "POST /api/products"
              payload: { name: "MicroMesh", category: "LEAF_GUARD", base_rate_cents_per_foot: 3000, available_colors: ["WHITE","BRONZE","BLACK","COPPER"], premium_colors: ["COPPER"], color_surcharge_cents_per_foot: 500 }
              as: Admin
              captures: { pid: "$.data.id" }
            - call: "POST /api/sales-reps"
              payload: { full_name: "Rep A", region: "NE" }
              as: Admin
              captures: { rep: "$.data.id" }
            - call: "POST /api/leads"
              payload: { full_name: "Homeowner 2", address: "2 Oak St", phone: "555-0102", region: "NE", sales_rep_id: "${rep}" }
              as: Admin
              captures: { lead: "$.data.id" }
            - call: "POST /api/appointments"
              payload: { lead_id: "${lead}", sales_rep_id: "${rep}", scheduled_start: "2026-06-01T10:00:00Z", scheduled_end: "2026-06-01T11:00:00Z" }
              as: Admin
              captures: { appt: "$.data.id" }
            - call: "POST /api/appointments/${appt}/transition"
              payload: { to_status: "CONFIRMED" }
              as: Admin
            - call: "POST /api/appointments/${appt}/transition"
              payload: { to_status: "COMPLETED", measured_linear_feet: 200 }
              as: Admin
            - call: "GET /api/leads/${lead}"
              payload: {}
              as: Admin
              captures: { lv: "$.data.version" }
            - call: "POST /api/quotes"
              payload: { lead_id: "${lead}", appointment_id: "${appt}", sales_rep_id: "${rep}", product_id: "${pid}", color: "WHITE", estimated_linear_feet: 200, downspout_count: 0, discount_pct: 0, expected_lead_version: "${lv}" }
              as: Admin
              captures: { qid: "$.data.id" }
            - call: "POST /api/quotes/${qid}/present"
              payload: {}
              as: Admin
              captures: { qtotal: "$.data.total_cents" }
            - call: "POST /api/financing-plans"
              payload: { quote_id: "${qid}", plan_type: "DEFERRED_INTEREST", apr_bps: 0, term_months: 12, promo_window_days: 365 }
              as: Admin
              captures: { fpA: "$.data.id", fpA_total: "$.data.total_cost_cents", fpA_monthly: "$.data.monthly_payment_cents", fpA_principal: "$.data.principal_cents" }
          trigger:
            - call: "POST /api/financing-plans"
              payload: { quote_id: "${qid}", plan_type: "AMORTIZED", apr_bps: 1200, term_months: 12 }
              as: Admin
              captures: { fpB: "$.data.id", fpB_total: "$.data.total_cost_cents", fpB_monthly: "$.data.monthly_payment_cents" }
          assert:
            - "qtotal == 570000 and fpA_principal == 570000"
            - "fpA_total == 570000 and fpA_monthly == 47500 (DEFERRED_INTEREST: 0 interest)"
            - "fpB_total == 607728 and fpB_monthly == 50644 (AMORTIZED: 50644 * 12)"
            - "fpB_total (607728) > fpA_total (570000) — dual-variant divergence on the FinancingPlan domain"

  # ===========================================================================
  - rule_id: combinatorial_formula
    instances:
      - name: quote_tiered_rate_multifactor_mode_a
        grounds:
          - calculations.quote_pricing
          - entities.Quote.fields.subtotal_cents
          - entities.Product.fields.base_rate_cents_per_foot
          - entities.Product.fields.color_surcharge_cents_per_foot
          - entities.Quote.fields.downspout_count
        distinguishing_aspect: |
          Mode (a): >=3 inputs with non-linear interaction — feet selects a tier
          multiplier (400 ft >= 400 -> T3 mult 0.90) that scales the base rate, then
          color surcharge and downspout add-ons stack; result subtotal 1292000, total 1227400.
        test_recipe:
          setup:
            - "Product MicroMesh (base 3000, COPPER surcharge 500)"
            - "Lead with a booked (uncompleted) appointment for the FK"
          setup_api_calls:
            - call: "POST /api/products"
              payload: { name: "MicroMesh", category: "LEAF_GUARD", base_rate_cents_per_foot: 3000, available_colors: ["WHITE","BRONZE","BLACK","COPPER"], premium_colors: ["COPPER"], color_surcharge_cents_per_foot: 500 }
              as: Admin
              captures: { pid: "$.data.id" }
            - call: "POST /api/sales-reps"
              payload: { full_name: "Rep A", region: "NE" }
              as: Admin
              captures: { rep: "$.data.id" }
            - call: "POST /api/leads"
              payload: { full_name: "Homeowner 3", address: "3 Pine St", phone: "555-0103", region: "NE", sales_rep_id: "${rep}" }
              as: Admin
              captures: { lead: "$.data.id" }
            - call: "POST /api/appointments"
              payload: { lead_id: "${lead}", sales_rep_id: "${rep}", scheduled_start: "2026-06-01T10:00:00Z", scheduled_end: "2026-06-01T11:00:00Z" }
              as: Admin
              captures: { appt: "$.data.id" }
            - call: "GET /api/leads/${lead}"
              payload: {}
              as: Admin
              captures: { lv: "$.data.version" }
          trigger:
            - call: "POST /api/quotes"
              payload: { lead_id: "${lead}", appointment_id: "${appt}", sales_rep_id: "${rep}", product_id: "${pid}", color: "COPPER", estimated_linear_feet: 400, downspout_count: 1, discount_pct: 0.05, expected_lead_version: "${lv}" }
              as: Admin
              captures: { qid: "$.data.id", sub: "$.data.subtotal_cents", disc: "$.data.discount_cents", tot: "$.data.total_cents" }
          assert:
            - "sub == 1292000 (gutter 1080000 = 400*2700 T3, color 200000 = 400*500, downspout 12000)"
            - "disc == 64600 (effective_pct = min(0.05, cap 0.20) = 0.05; 1292000*0.05)"
            - "tot == 1227400 (subtotal - discount)"

      - name: financing_amortized_rounding_order_mode_b
        grounds:
          - calculations.financing_cost
          - entities.FinancingPlan.fields.monthly_payment_cents
          - entities.FinancingPlan.fields.total_cost_cents
        distinguishing_aspect: |
          Mode (b): nested rounding order is pinned — round the monthly payment to
          cents FIRST (50644) then multiply by term (12) => total 607728, NOT the
          exact-total-then-round order which yields 607726 (a 2-cent divergence).
        test_recipe:
          setup:
            - "PRESENTED quote with total_cents 570000 (principal for financing)"
          setup_api_calls:
            - call: "POST /api/products"
              payload: { name: "MicroMesh", category: "LEAF_GUARD", base_rate_cents_per_foot: 3000, available_colors: ["WHITE","BRONZE","BLACK","COPPER"], premium_colors: ["COPPER"], color_surcharge_cents_per_foot: 500 }
              as: Admin
              captures: { pid: "$.data.id" }
            - call: "POST /api/sales-reps"
              payload: { full_name: "Rep A", region: "NE" }
              as: Admin
              captures: { rep: "$.data.id" }
            - call: "POST /api/leads"
              payload: { full_name: "Homeowner 4", address: "4 Elm St", phone: "555-0104", region: "NE", sales_rep_id: "${rep}" }
              as: Admin
              captures: { lead: "$.data.id" }
            - call: "POST /api/appointments"
              payload: { lead_id: "${lead}", sales_rep_id: "${rep}", scheduled_start: "2026-06-01T10:00:00Z", scheduled_end: "2026-06-01T11:00:00Z" }
              as: Admin
              captures: { appt: "$.data.id" }
            - call: "POST /api/appointments/${appt}/transition"
              payload: { to_status: "COMPLETED", measured_linear_feet: 200 }
              as: Admin
            - call: "GET /api/leads/${lead}"
              payload: {}
              as: Admin
              captures: { lv: "$.data.version" }
            - call: "POST /api/quotes"
              payload: { lead_id: "${lead}", appointment_id: "${appt}", sales_rep_id: "${rep}", product_id: "${pid}", color: "WHITE", estimated_linear_feet: 200, downspout_count: 0, discount_pct: 0, expected_lead_version: "${lv}" }
              as: Admin
              captures: { qid: "$.data.id" }
            - call: "POST /api/quotes/${qid}/present"
              payload: {}
              as: Admin
          trigger:
            - call: "POST /api/financing-plans"
              payload: { quote_id: "${qid}", plan_type: "AMORTIZED", apr_bps: 1200, term_months: 12 }
              as: Admin
              captures: { fp: "$.data.id", monthly: "$.data.monthly_payment_cents", total: "$.data.total_cost_cents" }
          assert:
            - "monthly == 50644 (round_half_up of exact monthly 50643.81 at r=0.01, n=12)"
            - "total == 607728 == monthly (50644) * term (12) — round-per-installment then multiply"
            - "total != 607726 (the sum-then-round order is explicitly rejected)"

      - name: discount_cap_evaluation_order_mode_c
        grounds:
          - calculations.discount_resolution
          - calculations.quote_pricing
          - entities.Quote.fields.discount_cents
          - entities.Quote.fields.subtotal_cents
        distinguishing_aspect: |
          Mode (c): circular-looking dependency pinned — the discount cap tier is
          keyed on subtotal_cents (pre-discount, 1172500 >= 1e6 -> cap 0.20 -> discount
          234500, total 938000), NOT on the post-discount total (which would give cap
          0.15 -> discount 175875, total 996625).
        test_recipe:
          setup:
            - "Product MicroMesh; lead with a booked appointment for the FK"
          setup_api_calls:
            - call: "POST /api/products"
              payload: { name: "MicroMesh", category: "LEAF_GUARD", base_rate_cents_per_foot: 3000, available_colors: ["WHITE","BRONZE","BLACK","COPPER"], premium_colors: ["COPPER"], color_surcharge_cents_per_foot: 500 }
              as: Admin
              captures: { pid: "$.data.id" }
            - call: "POST /api/sales-reps"
              payload: { full_name: "Rep A", region: "NE" }
              as: Admin
              captures: { rep: "$.data.id" }
            - call: "POST /api/leads"
              payload: { full_name: "Homeowner 5", address: "5 Ash St", phone: "555-0105", region: "NE", sales_rep_id: "${rep}" }
              as: Admin
              captures: { lead: "$.data.id" }
            - call: "POST /api/appointments"
              payload: { lead_id: "${lead}", sales_rep_id: "${rep}", scheduled_start: "2026-06-01T10:00:00Z", scheduled_end: "2026-06-01T11:00:00Z" }
              as: Admin
              captures: { appt: "$.data.id" }
            - call: "GET /api/leads/${lead}"
              payload: {}
              as: Admin
              captures: { lv: "$.data.version" }
          trigger:
            - call: "POST /api/quotes"
              payload: { lead_id: "${lead}", appointment_id: "${appt}", sales_rep_id: "${rep}", product_id: "${pid}", color: "COPPER", estimated_linear_feet: 350, downspout_count: 0, discount_pct: 0.20, expected_lead_version: "${lv}" }
              as: Admin
              captures: { qid: "$.data.id", sub: "$.data.subtotal_cents", disc: "$.data.discount_cents", tot: "$.data.total_cents" }
          assert:
            - "sub == 1172500 (gutter 997500 = 350*2850 T2, color 175000 = 350*500)"
            - "disc == 234500 (cap keyed on subtotal 1172500 >= 1e6 -> 0.20; NOT 175875)"
            - "tot == 938000 (NOT 996625, which is the circular cap-on-total answer)"

  # ===========================================================================
  - rule_id: non_linear_state_machine
    instances:
      - name: quote_revision_cycle
        grounds:
          - state_machines.Quote.PRESENTED_to_REVISION_REQUESTED
          - state_machines.Quote.REVISION_REQUESTED_to_DRAFT
          - state_machines.Quote.DRAFT_to_PRESENTED
          - entities.Quote.fields.status
        distinguishing_aspect: |
          The Quote traverses a back-edge REVISION_REQUESTED -> DRAFT and re-advances
          to PRESENTED (a cycle), resetting the total to PROVISIONAL (588600) on the
          way back and recomputing FINAL (654750) on re-present — cyclic shape on Quote.
        test_recipe:
          setup:
            - "PRESENTED quote (estimated 180, measured 210, COPPER, 2 downspouts, discount 0.10) with FINAL total 654750"
          setup_api_calls:
            - call: "POST /api/products"
              payload: { name: "MicroMesh", category: "LEAF_GUARD", base_rate_cents_per_foot: 3000, available_colors: ["WHITE","BRONZE","BLACK","COPPER"], premium_colors: ["COPPER"], color_surcharge_cents_per_foot: 500 }
              as: Admin
              captures: { pid: "$.data.id" }
            - call: "POST /api/sales-reps"
              payload: { full_name: "Rep A", region: "NE" }
              as: Admin
              captures: { rep: "$.data.id" }
            - call: "POST /api/leads"
              payload: { full_name: "Homeowner 6", address: "6 Birch St", phone: "555-0106", region: "NE", sales_rep_id: "${rep}" }
              as: Admin
              captures: { lead: "$.data.id" }
            - call: "POST /api/appointments"
              payload: { lead_id: "${lead}", sales_rep_id: "${rep}", scheduled_start: "2026-06-01T10:00:00Z", scheduled_end: "2026-06-01T11:00:00Z" }
              as: Admin
              captures: { appt: "$.data.id" }
            - call: "POST /api/appointments/${appt}/transition"
              payload: { to_status: "COMPLETED", measured_linear_feet: 210 }
              as: Admin
            - call: "GET /api/leads/${lead}"
              payload: {}
              as: Admin
              captures: { lv: "$.data.version" }
            - call: "POST /api/quotes"
              payload: { lead_id: "${lead}", appointment_id: "${appt}", sales_rep_id: "${rep}", product_id: "${pid}", color: "COPPER", estimated_linear_feet: 180, downspout_count: 2, discount_pct: 0.10, expected_lead_version: "${lv}" }
              as: Admin
              captures: { qid: "$.data.id" }
            - call: "POST /api/quotes/${qid}/present"
              payload: {}
              as: Admin
              captures: { t_final1: "$.data.total_cents" }
          trigger:
            - call: "POST /api/quotes/${qid}/transition"
              payload: { to_status: "REVISION_REQUESTED" }
              as: Admin
              captures: { s1: "$.data.status" }
            - call: "POST /api/quotes/${qid}/transition"
              payload: { to_status: "DRAFT" }
              as: Admin
              captures: { s2: "$.data.status", prov2: "$.data.total_cents" }
            - call: "POST /api/quotes/${qid}/present"
              payload: {}
              as: Admin
              captures: { s3: "$.data.status", t_final2: "$.data.total_cents" }
          assert:
            - "t_final1 == 654750 and s1 == REVISION_REQUESTED"
            - "s2 == DRAFT and prov2 == 588600 (reset to PROVISIONAL on the back-edge)"
            - "s3 == PRESENTED and t_final2 == 654750 (cycle REVISION_REQUESTED->DRAFT->PRESENTED closed)"

      - name: warranty_claim_approve_deny_branch
        grounds:
          - state_machines.WarrantyClaim.UNDER_REVIEW_to_APPROVED
          - state_machines.WarrantyClaim.UNDER_REVIEW_to_DENIED
          - state_machines.WarrantyClaim.APPROVED_to_RESOLVED
          - entities.WarrantyClaim.fields.actual_remediation_cents
          - calculations.warranty_remediation
        distinguishing_aspect: |
          From UNDER_REVIEW the WarrantyClaim forks: the APPROVED branch proceeds to
          RESOLVED and records actual_remediation_cents, while the DENIED branch is
          terminal and records nothing — divergent side-effect sets, on a different
          entity than the Quote cycle.
        test_recipe:
          setup:
            - "A COMPLETED Job (feet 210); two warranty claims filed and moved to UNDER_REVIEW"
          setup_api_calls:
            - call: "POST /api/products"
              payload: { name: "MicroMesh", category: "LEAF_GUARD", base_rate_cents_per_foot: 3000, available_colors: ["WHITE","BRONZE","BLACK","COPPER"], premium_colors: ["COPPER"], color_surcharge_cents_per_foot: 500 }
              as: Admin
              captures: { pid: "$.data.id" }
            - call: "POST /api/sales-reps"
              payload: { full_name: "Rep A", region: "NE" }
              as: Admin
              captures: { rep: "$.data.id" }
            - call: "POST /api/crews"
              payload: { name: "Crew C", region: "NE", is_certified_leaf_guard: true }
              as: Admin
              captures: { crew: "$.data.id" }
            - call: "POST /api/leads"
              payload: { full_name: "Homeowner 7", address: "7 Cedar St", phone: "555-0107", region: "NE", sales_rep_id: "${rep}" }
              as: Admin
              captures: { lead: "$.data.id" }
            - call: "POST /api/appointments"
              payload: { lead_id: "${lead}", sales_rep_id: "${rep}", scheduled_start: "2026-06-01T10:00:00Z", scheduled_end: "2026-06-01T11:00:00Z" }
              as: Admin
              captures: { appt: "$.data.id" }
            - call: "POST /api/appointments/${appt}/transition"
              payload: { to_status: "COMPLETED", measured_linear_feet: 210 }
              as: Admin
            - call: "GET /api/leads/${lead}"
              payload: {}
              as: Admin
              captures: { lv: "$.data.version" }
            - call: "POST /api/quotes"
              payload: { lead_id: "${lead}", appointment_id: "${appt}", sales_rep_id: "${rep}", product_id: "${pid}", color: "WHITE", estimated_linear_feet: 210, downspout_count: 0, discount_pct: 0, expected_lead_version: "${lv}" }
              as: Admin
              captures: { qid: "$.data.id" }
            - call: "POST /api/quotes/${qid}/present"
              payload: {}
              as: Admin
            - call: "POST /api/quotes/${qid}/transition"
              payload: { to_status: "ACCEPTED" }
              as: Admin
            - call: "GET /api/jobs"
              payload: { quote_id: "${qid}" }
              as: Admin
              captures: { jid: "$.data[0].id" }
            - call: "POST /api/jobs/${jid}/schedule"
              payload: { crew_id: "${crew}", install_date: "2026-06-10" }
              as: Admin
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-06-10T08:00:00Z" }
              as: Admin
            - call: "POST /api/jobs/${jid}/transition"
              payload: { to_status: "IN_PROGRESS" }
              as: Admin
            - call: "POST /api/jobs/${jid}/transition"
              payload: { to_status: "COMPLETED" }
              as: Admin
            - call: "POST /api/warranty-claims"
              payload: { job_id: "${jid}", issue_type: "CLOG" }
              as: Admin
              captures: { c1: "$.data.id" }
            - call: "POST /api/warranty-claims/${c1}/transition"
              payload: { to_status: "UNDER_REVIEW" }
              as: Admin
              captures: { c1_est: "$.data.estimated_remediation_cents" }
            - call: "POST /api/warranty-claims"
              payload: { job_id: "${jid}", issue_type: "OVERFLOW" }
              as: Admin
              captures: { c2: "$.data.id" }
            - call: "POST /api/warranty-claims/${c2}/transition"
              payload: { to_status: "UNDER_REVIEW" }
              as: Admin
          trigger:
            - call: "POST /api/warranty-claims/${c1}/transition"
              payload: { to_status: "APPROVED" }
              as: Admin
            - call: "POST /api/warranty-claims/${c1}/transition"
              payload: { to_status: "RESOLVED", actual_remediation_cents: 42000 }
              as: Admin
              captures: { c1_status: "$.data.status", c1_actual: "$.data.actual_remediation_cents" }
            - call: "POST /api/warranty-claims/${c2}/transition"
              payload: { to_status: "DENIED" }
              as: Admin
              captures: { c2_status: "$.data.status" }
          assert:
            - "c1_est == 57000 (CLOG base 15000 + 210*200 = 42000)"
            - "c1_status == RESOLVED and c1_actual == 42000 (APPROVED branch records the actual cost)"
            - "c2_status == DENIED (DENIED branch is terminal, no remediation recorded)"

  # ===========================================================================
  - rule_id: transitive_cascade
    instances:
      - name: accept_quote_cascade_depth3
        grounds:
          - state_machines.Quote.PRESENTED_to_ACCEPTED
          - state_machines.Lead.QUOTED_to_WON
          - state_machines.Referral.PENDING_to_PAYABLE
          - entities.Lead.fields.credit_balance_cents
          - calculations.referral_payout
        distinguishing_aspect: |
          One accept action fires a 3-hop transitive chain: Job created (link 1) ->
          referee Lead QUOTED->WON (link 2, caused by the Job creation) -> the referrer's
          PENDING Referral -> PAYABLE + credit 17100 (link 3, caused by the WON); each hop
          caused by the previous (depth 3).
        test_recipe:
          setup:
            - "Referrer lead and referee lead; a PENDING Referral(referrer, referee)"
            - "Referee has a PRESENTED quote total 570000 (payout will be 3% = 17100)"
          setup_api_calls:
            - call: "POST /api/products"
              payload: { name: "MicroMesh", category: "LEAF_GUARD", base_rate_cents_per_foot: 3000, available_colors: ["WHITE","BRONZE","BLACK","COPPER"], premium_colors: ["COPPER"], color_surcharge_cents_per_foot: 500 }
              as: Admin
              captures: { pid: "$.data.id" }
            - call: "POST /api/sales-reps"
              payload: { full_name: "Rep A", region: "NE" }
              as: Admin
              captures: { rep: "$.data.id" }
            - call: "POST /api/leads"
              payload: { full_name: "Referrer R", address: "10 Referrer Rd", phone: "555-0200", region: "NE", sales_rep_id: "${rep}" }
              as: Admin
              captures: { referrer: "$.data.id" }
            - call: "POST /api/leads"
              payload: { full_name: "Referee E", address: "11 Referee Rd", phone: "555-0201", region: "NE", sales_rep_id: "${rep}" }
              as: Admin
              captures: { referee: "$.data.id" }
            - call: "POST /api/referrals"
              payload: { referrer_lead_id: "${referrer}", referee_lead_id: "${referee}" }
              as: Admin
              captures: { ref: "$.data.id" }
            - call: "POST /api/appointments"
              payload: { lead_id: "${referee}", sales_rep_id: "${rep}", scheduled_start: "2026-06-01T10:00:00Z", scheduled_end: "2026-06-01T11:00:00Z" }
              as: Admin
              captures: { appt: "$.data.id" }
            - call: "POST /api/appointments/${appt}/transition"
              payload: { to_status: "COMPLETED", measured_linear_feet: 200 }
              as: Admin
            - call: "GET /api/leads/${referee}"
              payload: {}
              as: Admin
              captures: { lv: "$.data.version" }
            - call: "POST /api/quotes"
              payload: { lead_id: "${referee}", appointment_id: "${appt}", sales_rep_id: "${rep}", product_id: "${pid}", color: "WHITE", estimated_linear_feet: 200, downspout_count: 0, discount_pct: 0, expected_lead_version: "${lv}" }
              as: Admin
              captures: { qid: "$.data.id" }
            - call: "POST /api/quotes/${qid}/present"
              payload: {}
              as: Admin
              captures: { qtotal: "$.data.total_cents" }
          trigger:
            - call: "POST /api/quotes/${qid}/transition"
              payload: { to_status: "ACCEPTED" }
              as: Admin
              captures: { qstatus: "$.data.status" }
            - call: "GET /api/jobs"
              payload: { quote_id: "${qid}" }
              as: Admin
              captures: { jid: "$.data[0].id", jstatus: "$.data[0].status" }
            - call: "GET /api/referrals/${ref}"
              payload: {}
              as: Admin
              captures: { refstat: "$.data.status", refpay: "$.data.payout_cents" }
            - call: "GET /api/leads/${referrer}"
              payload: {}
              as: Admin
              captures: { rcred: "$.data.credit_balance_cents" }
            - call: "GET /api/leads/${referee}"
              payload: {}
              as: Admin
              captures: { estat: "$.data.status" }
          assert:
            - "qstatus == ACCEPTED and jstatus == PENDING (link 1: Job created)"
            - "estat == WON (link 2: Job creation moved the referee Lead QUOTED->WON)"
            - "refstat == PAYABLE and refpay == 17100 (link 3: WON qualified the referral, payout round(570000*0.03))"
            - "rcred == 17100 (referrer credited on PAYABLE)"

      - name: no_show_cascade_depth2
        grounds:
          - state_machines.Appointment.SCHEDULED_to_NO_SHOW
          - state_machines.Lead.NEW_to_LOST
          - entities.Lead.fields.no_show_strikes
          - entities.Quote.fields.status
          - calculations.no_show_strikes
        distinguishing_aspect: |
          A second NO_SHOW (a different trigger than accept) recomputes no_show_strikes
          to 2, which itself moves the Lead -> LOST (link 1), and LOST itself DECLINEs
          the lead's DRAFT quote and CANCELs its open appointment (link 2) — a 2-hop chain.
        test_recipe:
          setup:
            - "Lead with a DRAFT quote (backed by a scheduled appointment appt_q) and one prior NO_SHOW appointment (1 strike)"
          setup_api_calls:
            - call: "POST /api/products"
              payload: { name: "MicroMesh", category: "LEAF_GUARD", base_rate_cents_per_foot: 3000, available_colors: ["WHITE","BRONZE","BLACK","COPPER"], premium_colors: ["COPPER"], color_surcharge_cents_per_foot: 500 }
              as: Admin
              captures: { pid: "$.data.id" }
            - call: "POST /api/sales-reps"
              payload: { full_name: "Rep A", region: "NE" }
              as: Admin
              captures: { rep: "$.data.id" }
            - call: "POST /api/leads"
              payload: { full_name: "Homeowner 8", address: "8 Spruce St", phone: "555-0108", region: "NE", sales_rep_id: "${rep}" }
              as: Admin
              captures: { lead: "$.data.id" }
            - call: "POST /api/appointments"
              payload: { lead_id: "${lead}", sales_rep_id: "${rep}", scheduled_start: "2026-06-02T09:00:00Z", scheduled_end: "2026-06-02T10:00:00Z" }
              as: Admin
              captures: { appt_q: "$.data.id" }
            - call: "GET /api/leads/${lead}"
              payload: {}
              as: Admin
              captures: { lv: "$.data.version" }
            - call: "POST /api/quotes"
              payload: { lead_id: "${lead}", appointment_id: "${appt_q}", sales_rep_id: "${rep}", product_id: "${pid}", color: "WHITE", estimated_linear_feet: 180, downspout_count: 0, discount_pct: 0, expected_lead_version: "${lv}" }
              as: Admin
              captures: { qid: "$.data.id" }
            - call: "POST /api/appointments"
              payload: { lead_id: "${lead}", sales_rep_id: "${rep}", scheduled_start: "2026-06-02T11:00:00Z", scheduled_end: "2026-06-02T12:00:00Z" }
              as: Admin
              captures: { appt1: "$.data.id" }
            - call: "POST /api/appointments/${appt1}/transition"
              payload: { to_status: "NO_SHOW" }
              as: Admin
            - call: "POST /api/appointments"
              payload: { lead_id: "${lead}", sales_rep_id: "${rep}", scheduled_start: "2026-06-02T13:00:00Z", scheduled_end: "2026-06-02T14:00:00Z" }
              as: Admin
              captures: { appt2: "$.data.id" }
          trigger:
            - call: "POST /api/appointments/${appt2}/transition"
              payload: { to_status: "NO_SHOW" }
              as: Admin
            - call: "GET /api/leads/${lead}"
              payload: {}
              as: Admin
              captures: { lstatus: "$.data.status", lstrikes: "$.data.no_show_strikes" }
            - call: "GET /api/quotes/${qid}"
              payload: {}
              as: Admin
              captures: { qstatus: "$.data.status" }
            - call: "GET /api/appointments/${appt_q}"
              payload: {}
              as: Admin
              captures: { aqstatus: "$.data.status" }
          assert:
            - "lstrikes == 2 and lstatus == LOST (link 1: second NO_SHOW crosses NO_SHOW_LIMIT=2)"
            - "qstatus == DECLINED (link 2: Lead LOST cascaded a decline onto the DRAFT quote)"
            - "aqstatus == CANCELED (Lead LOST cancels the lead's open appointment)"

  # ===========================================================================
  - rule_id: priority_pair_validation_conflict
    instances:
      - name: schedule_weather_beats_crew_double_booked
        grounds:
          - validations[priority=5]
          - validations[priority=7]
          - state_machines.Job.PENDING_to_SCHEDULED
          - errors[ERR_WEATHER_UNSAFE]
        distinguishing_aspect: |
          Scheduling job2 on 2026-06-11 violates BOTH business_safety (SEVERE forecast,
          priority 5) AND business_temporal (crew overlap with job1, priority 7); the
          lower-priority-number category wins, so the response is ERR_WEATHER_UNSAFE.
        test_recipe:
          setup:
            - "Certified crew C; job1 (install_days 2) SCHEDULED on 2026-06-10 occupying 06-10..06-11"
            - "job2 (install_days 1) PENDING; forecast for 2026-06-11 set to SEVERE"
          setup_api_calls:
            - call: "POST /api/products"
              payload: { name: "MicroMesh", category: "LEAF_GUARD", base_rate_cents_per_foot: 3000, available_colors: ["WHITE","BRONZE","BLACK","COPPER"], premium_colors: ["COPPER"], color_surcharge_cents_per_foot: 500 }
              as: Admin
              captures: { pid: "$.data.id" }
            - call: "POST /api/sales-reps"
              payload: { full_name: "Rep A", region: "NE" }
              as: Admin
              captures: { rep: "$.data.id" }
            - call: "POST /api/crews"
              payload: { name: "Crew C", region: "NE", is_certified_leaf_guard: true }
              as: Admin
              captures: { crew: "$.data.id" }
            - call: "POST /api/leads"
              payload: { full_name: "Homeowner 9", address: "9 Fir St", phone: "555-0109", region: "NE", sales_rep_id: "${rep}" }
              as: Admin
              captures: { lead1: "$.data.id" }
            - call: "POST /api/appointments"
              payload: { lead_id: "${lead1}", sales_rep_id: "${rep}", scheduled_start: "2026-06-01T10:00:00Z", scheduled_end: "2026-06-01T11:00:00Z" }
              as: Admin
              captures: { appt1: "$.data.id" }
            - call: "POST /api/appointments/${appt1}/transition"
              payload: { to_status: "COMPLETED", measured_linear_feet: 210 }
              as: Admin
            - call: "GET /api/leads/${lead1}"
              payload: {}
              as: Admin
              captures: { lv1: "$.data.version" }
            - call: "POST /api/quotes"
              payload: { lead_id: "${lead1}", appointment_id: "${appt1}", sales_rep_id: "${rep}", product_id: "${pid}", color: "WHITE", estimated_linear_feet: 210, downspout_count: 0, discount_pct: 0, expected_lead_version: "${lv1}" }
              as: Admin
              captures: { qid1: "$.data.id" }
            - call: "POST /api/quotes/${qid1}/present"
              payload: {}
              as: Admin
            - call: "POST /api/quotes/${qid1}/transition"
              payload: { to_status: "ACCEPTED" }
              as: Admin
            - call: "GET /api/jobs"
              payload: { quote_id: "${qid1}" }
              as: Admin
              captures: { jid1: "$.data[0].id" }
            - call: "POST /api/jobs/${jid1}/schedule"
              payload: { crew_id: "${crew}", install_date: "2026-06-10" }
              as: Admin
            - call: "POST /api/leads"
              payload: { full_name: "Homeowner 10", address: "10 Fir St", phone: "555-0110", region: "NE", sales_rep_id: "${rep}" }
              as: Admin
              captures: { lead2: "$.data.id" }
            - call: "POST /api/appointments"
              payload: { lead_id: "${lead2}", sales_rep_id: "${rep}", scheduled_start: "2026-06-03T10:00:00Z", scheduled_end: "2026-06-03T11:00:00Z" }
              as: Admin
              captures: { appt2: "$.data.id" }
            - call: "POST /api/appointments/${appt2}/transition"
              payload: { to_status: "COMPLETED", measured_linear_feet: 140 }
              as: Admin
            - call: "GET /api/leads/${lead2}"
              payload: {}
              as: Admin
              captures: { lv2: "$.data.version" }
            - call: "POST /api/quotes"
              payload: { lead_id: "${lead2}", appointment_id: "${appt2}", sales_rep_id: "${rep}", product_id: "${pid}", color: "WHITE", estimated_linear_feet: 140, downspout_count: 0, discount_pct: 0, expected_lead_version: "${lv2}" }
              as: Admin
              captures: { qid2: "$.data.id" }
            - call: "POST /api/quotes/${qid2}/present"
              payload: {}
              as: Admin
            - call: "POST /api/quotes/${qid2}/transition"
              payload: { to_status: "ACCEPTED" }
              as: Admin
            - call: "GET /api/jobs"
              payload: { quote_id: "${qid2}" }
              as: Admin
              captures: { jid2: "$.data[0].id" }
            - call: "POST /_weather/set_forecast"
              payload: { install_date: "2026-06-11", condition: "SEVERE" }
              as: Admin
          trigger:
            - call: "POST /api/jobs/${jid2}/schedule"
              payload: { crew_id: "${crew}", install_date: "2026-06-11" }
              as: Admin
          assert:
            - "Response is 422 ERR_WEATHER_UNSAFE (business_safety, priority 5) — NOT ERR_CREW_DOUBLE_BOOKED (priority 7)"
            - "Job.jid2 status remains PENDING (no crew assigned)"

      - name: complete_appt_state_beats_measurement
        grounds:
          - validations[priority=4]
          - validations[priority=8]
          - state_machines.Appointment.SCHEDULED_to_CANCELED
          - errors[ERR_INVALID_STATE]
        distinguishing_aspect: |
          Transitioning a CANCELED appointment to COMPLETED with measured_linear_feet=0
          violates BOTH state (priority 4, terminal appointment) AND business_constraint
          (priority 8, measurement <= 0); state wins, returning ERR_INVALID_STATE — a
          different category pair than the safety/temporal conflict.
        test_recipe:
          setup:
            - "Appointment that has been CANCELED"
          setup_api_calls:
            - call: "POST /api/sales-reps"
              payload: { full_name: "Rep A", region: "NE" }
              as: Admin
              captures: { rep: "$.data.id" }
            - call: "POST /api/leads"
              payload: { full_name: "Homeowner 11", address: "11 Fir St", phone: "555-0111", region: "NE", sales_rep_id: "${rep}" }
              as: Admin
              captures: { lead: "$.data.id" }
            - call: "POST /api/appointments"
              payload: { lead_id: "${lead}", sales_rep_id: "${rep}", scheduled_start: "2026-06-01T10:00:00Z", scheduled_end: "2026-06-01T11:00:00Z" }
              as: Admin
              captures: { appt: "$.data.id" }
            - call: "POST /api/appointments/${appt}/transition"
              payload: { to_status: "CANCELED" }
              as: Admin
          trigger:
            - call: "POST /api/appointments/${appt}/transition"
              payload: { to_status: "COMPLETED", measured_linear_feet: 0 }
              as: Admin
          assert:
            - "Response is 409 ERR_INVALID_STATE (state, priority 4) — NOT ERR_INVALID_MEASUREMENT (priority 8)"
            - "Appointment.appt status remains CANCELED"

  # ===========================================================================
  - rule_id: boundary_precision_check
    instances:
      - name: quote_tier_boundary_200ft
        grounds:
          - calculations.quote_pricing
          - entities.Quote.fields.subtotal_cents
          - entities.Quote.fields.estimated_linear_feet
        distinguishing_aspect: |
          The volume-discount tier boundary is exact at 200 ft (>=): 199 ft stays tier
          T1 (rate 3000, subtotal 720500, total 648450) while 200 ft selects tier T2
          (rate 2850, subtotal 694000, total 624600) — a numeric threshold via POST /api/quotes.
        test_recipe:
          setup:
            - "Product MicroMesh; lead with a booked appointment; two quotes at 199 and 200 estimated ft"
          setup_api_calls:
            - call: "POST /api/products"
              payload: { name: "MicroMesh", category: "LEAF_GUARD", base_rate_cents_per_foot: 3000, available_colors: ["WHITE","BRONZE","BLACK","COPPER"], premium_colors: ["COPPER"], color_surcharge_cents_per_foot: 500 }
              as: Admin
              captures: { pid: "$.data.id" }
            - call: "POST /api/sales-reps"
              payload: { full_name: "Rep A", region: "NE" }
              as: Admin
              captures: { rep: "$.data.id" }
            - call: "POST /api/leads"
              payload: { full_name: "Homeowner 12", address: "12 Fir St", phone: "555-0112", region: "NE", sales_rep_id: "${rep}" }
              as: Admin
              captures: { lead: "$.data.id" }
            - call: "POST /api/appointments"
              payload: { lead_id: "${lead}", sales_rep_id: "${rep}", scheduled_start: "2026-06-01T10:00:00Z", scheduled_end: "2026-06-01T11:00:00Z" }
              as: Admin
              captures: { appt: "$.data.id" }
            - call: "GET /api/leads/${lead}"
              payload: {}
              as: Admin
              captures: { lv_a: "$.data.version" }
            - call: "POST /api/quotes"
              payload: { lead_id: "${lead}", appointment_id: "${appt}", sales_rep_id: "${rep}", product_id: "${pid}", color: "COPPER", estimated_linear_feet: 199, downspout_count: 2, discount_pct: 0.10, expected_lead_version: "${lv_a}" }
              as: Admin
              captures: { q199: "$.data.id", t199: "$.data.total_cents", sub199: "$.data.subtotal_cents" }
          trigger:
            - call: "GET /api/leads/${lead}"
              payload: {}
              as: Admin
              captures: { lv_b: "$.data.version" }
            - call: "POST /api/quotes"
              payload: { lead_id: "${lead}", appointment_id: "${appt}", sales_rep_id: "${rep}", product_id: "${pid}", color: "COPPER", estimated_linear_feet: 200, downspout_count: 2, discount_pct: 0.10, expected_lead_version: "${lv_b}" }
              as: Admin
              captures: { q200: "$.data.id", t200: "$.data.total_cents", sub200: "$.data.subtotal_cents" }
          assert:
            - "sub199 == 720500 and t199 == 648450 (feet 199 < 200 -> tier T1 rate 3000)"
            - "sub200 == 694000 and t200 == 624600 (feet 200 >= 200 -> tier T2 rate 2850)"
            - "The >= boundary is exact: 199 stays T1, 200 crosses to T2"

      - name: no_show_strike_boundary_2
        grounds:
          - calculations.no_show_strikes
          - state_machines.Appointment.SCHEDULED_to_NO_SHOW
          - state_machines.Lead.NEW_to_LOST
          - entities.Lead.fields.no_show_strikes
        distinguishing_aspect: |
          The auto-LOST boundary is exact at strike count 2 (>=): after 1 NO_SHOW the
          Lead stays non-LOST, after the 2nd NO_SHOW it becomes LOST — a count/threshold
          on no_show_strikes via POST /api/appointments/{id}/transition (different metric
          and endpoint than the linear-foot tier boundary).
        test_recipe:
          setup:
            - "Lead with one prior NO_SHOW appointment (1 strike, not LOST) and a second scheduled appointment"
          setup_api_calls:
            - call: "POST /api/sales-reps"
              payload: { full_name: "Rep A", region: "NE" }
              as: Admin
              captures: { rep: "$.data.id" }
            - call: "POST /api/leads"
              payload: { full_name: "Homeowner 13", address: "13 Fir St", phone: "555-0113", region: "NE", sales_rep_id: "${rep}" }
              as: Admin
              captures: { lead: "$.data.id" }
            - call: "POST /api/appointments"
              payload: { lead_id: "${lead}", sales_rep_id: "${rep}", scheduled_start: "2026-06-02T09:00:00Z", scheduled_end: "2026-06-02T10:00:00Z" }
              as: Admin
              captures: { appt1: "$.data.id" }
            - call: "POST /api/appointments/${appt1}/transition"
              payload: { to_status: "NO_SHOW" }
              as: Admin
            - call: "GET /api/leads/${lead}"
              payload: {}
              as: Admin
              captures: { strikes1: "$.data.no_show_strikes", status1: "$.data.status" }
            - call: "POST /api/appointments"
              payload: { lead_id: "${lead}", sales_rep_id: "${rep}", scheduled_start: "2026-06-02T11:00:00Z", scheduled_end: "2026-06-02T12:00:00Z" }
              as: Admin
              captures: { appt2: "$.data.id" }
          trigger:
            - call: "POST /api/appointments/${appt2}/transition"
              payload: { to_status: "NO_SHOW" }
              as: Admin
            - call: "GET /api/leads/${lead}"
              payload: {}
              as: Admin
              captures: { strikes2: "$.data.no_show_strikes", status2: "$.data.status" }
          assert:
            - "strikes1 == 1 and status1 != LOST (below NO_SHOW_LIMIT=2)"
            - "strikes2 == 2 and status2 == LOST (>= NO_SHOW_LIMIT triggers auto-LOST)"

  # ===========================================================================
  - rule_id: cross_entity_state_dependency
    instances:
      - name: present_requires_appointment_completed
        grounds:
          - state_machines.Quote.DRAFT_to_PRESENTED
          - state_machines.Appointment.CONFIRMED_to_COMPLETED
          - errors[ERR_APPOINTMENT_NOT_COMPLETED]
          - entities.Appointment.fields.status
        distinguishing_aspect: |
          A Quote's DRAFT->PRESENTED transition is gated on a different entity's state:
          present fails with ERR_APPOINTMENT_NOT_COMPLETED while the backing Appointment
          is SCHEDULED, and succeeds once it is COMPLETED — entity pair Quote<-Appointment.
        test_recipe:
          setup:
            - "DRAFT quote whose backing appointment is still SCHEDULED"
          setup_api_calls:
            - call: "POST /api/products"
              payload: { name: "MicroMesh", category: "LEAF_GUARD", base_rate_cents_per_foot: 3000, available_colors: ["WHITE","BRONZE","BLACK","COPPER"], premium_colors: ["COPPER"], color_surcharge_cents_per_foot: 500 }
              as: Admin
              captures: { pid: "$.data.id" }
            - call: "POST /api/sales-reps"
              payload: { full_name: "Rep A", region: "NE" }
              as: Admin
              captures: { rep: "$.data.id" }
            - call: "POST /api/leads"
              payload: { full_name: "Homeowner 14", address: "14 Fir St", phone: "555-0114", region: "NE", sales_rep_id: "${rep}" }
              as: Admin
              captures: { lead: "$.data.id" }
            - call: "POST /api/appointments"
              payload: { lead_id: "${lead}", sales_rep_id: "${rep}", scheduled_start: "2026-06-01T10:00:00Z", scheduled_end: "2026-06-01T11:00:00Z" }
              as: Admin
              captures: { appt: "$.data.id" }
            - call: "GET /api/leads/${lead}"
              payload: {}
              as: Admin
              captures: { lv: "$.data.version" }
            - call: "POST /api/quotes"
              payload: { lead_id: "${lead}", appointment_id: "${appt}", sales_rep_id: "${rep}", product_id: "${pid}", color: "WHITE", estimated_linear_feet: 180, downspout_count: 0, discount_pct: 0, expected_lead_version: "${lv}" }
              as: Admin
              captures: { qid: "$.data.id" }
          trigger:
            - call: "POST /api/quotes/${qid}/present"
              payload: {}
              as: Admin
            - call: "POST /api/appointments/${appt}/transition"
              payload: { to_status: "CONFIRMED" }
              as: Admin
            - call: "POST /api/appointments/${appt}/transition"
              payload: { to_status: "COMPLETED", measured_linear_feet: 200 }
              as: Admin
            - call: "POST /api/quotes/${qid}/present"
              payload: {}
              as: Admin
              captures: { qstatus: "$.data.status", qtotal: "$.data.total_cents" }
          assert:
            - "First present (appointment SCHEDULED) returns 409 ERR_APPOINTMENT_NOT_COMPLETED"
            - "After the appointment is COMPLETED, present succeeds: qstatus == PRESENTED and qtotal == 570000"

      - name: warranty_requires_job_completed
        grounds:
          - state_machines.WarrantyClaim.SUBMITTED_to_UNDER_REVIEW
          - errors[ERR_JOB_NOT_COMPLETED]
          - entities.Job.fields.status
        distinguishing_aspect: |
