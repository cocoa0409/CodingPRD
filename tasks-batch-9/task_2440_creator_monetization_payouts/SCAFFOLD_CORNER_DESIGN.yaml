            - call: "POST /monetization/creators/${cr}/evaluate"
              payload: {}
              as: FinanceOperator
            - call: "PATCH /monetization/creators/${cr}/metrics"
              payload: { follower_count: 60000 }
              as: PlatformAdmin
            - call: "GET /monetization/creators/${cr}"
