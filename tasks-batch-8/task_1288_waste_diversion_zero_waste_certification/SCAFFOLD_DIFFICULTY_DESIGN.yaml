              as: CertificationOfficer
              captures: { period_id: $.data.id }
            - call: "POST /tickets"
              payload: { site_id: "${site_id}", vendor_id: "${vendor_id}", contract_id: "${contract_id}", material_stream: "MIXED_RECYCLABLES", disposal_route: "RECYCLING", gross_weight_lbs: 3000, tare_weight_lbs: 1000, ticket_date: "2026-08-05", external_ticket_ref: "CC-T1" }
              as: VendorUser
              as_user_id: "${vendor_id}"
              captures: { t1_id: $.data.id }
            - call: "POST /tickets/${t1_id}/validate"
              payload: {}
              as: DataSteward
            - call: "POST /tickets"
              payload: { site_id: "${site_id}", vendor_id: "${vendor_id}", contract_id: "${contract_id}", material_stream: "MIXED_RECYCLABLES", disposal_route: "LANDFILL", gross_weight_lbs: 2000, tare_weight_lbs: 1000, ticket_date: "2026-08-05", external_ticket_ref: "CC-T2" }
              as: VendorUser
              as_user_id: "${vendor_id}"
              captures: { t2_id: $.data.id }
            - call: "POST /tickets/${t2_id}/validate"
              payload: {}
              as: DataSteward
          trigger:
            - call: "POST /contamination_events"
              payload: { site_id: "${site_id}", event_date: "2026-08-06", material_stream: "MIXED_RECYCLABLES", contamination_pct: 15, ticket_id: "${t1_id}" }
              as: WasteAuditor
