            - "The clip is exactly FEE_CAP == floor(309500 * 8 / 100) == floor(24760.0) == 24760, i.e. FEE_CAP_PCT_OF_UNROUNDED 8 applied to UNROUNDED and floored to whole cents"
            - "The substitutions are cost-neutral by construction (WS-220 and CS-220 carry the originals' costs), so the entire 24760-cent move between the one-fee and two-fee quotes is the capped fee term"

      - name: assignment_per_diem_accrual_precision_floor_on_credit
