scaffold_difficulty_design:

  # ==========================================================================
  # RULE 1 — Dual-variant calculations across different entity domains
  # ==========================================================================
  - rule_id: dual_variant_calc
    instances:
      - name: ceiling_price_standard_vs_penny_on_drug_product
        grounds:
          - calculations.ceiling_price
          - entities.CeilingPriceRecord.fields.ceiling_price_per_unit_cents
          - entities.CeilingPriceRecord.fields.pricing_variant
        distinguishing_aspect: |
          Same ceiling-price algorithm yields ceiling=2500/STANDARD for one DrugProduct (amp 4000 > ura 1500)
          and ceiling=1/PENNY for a second DrugProduct (amp 3000 == ura 3000), so the dual variant lives on the
          DrugProduct/CeilingPriceRecord pricing domain.
        test_recipe:
          setup:
            - "Two drug products each with one published ceiling-price record: one STANDARD (amp 4000, ura 1500), one PENNY (amp 3000, ura 3000)."
          setup_api_calls:
            - call: "POST /340b/drug-products"
              payload: { ndc: "00001-0001-01", drug_name: "AlphaStandard", package_size_units: 30, wac_price_per_unit_cents: 5000 }
              as: ComplianceOfficer
              captures: { dp_std_id: $.data.id }
            - call: "POST /340b/drug-products"
              payload: { ndc: "00002-0002-02", drug_name: "BetaPenny", package_size_units: 30, wac_price_per_unit_cents: 5000 }
              as: ComplianceOfficer
              captures: { dp_penny_id: $.data.id }
          trigger:
            - call: "POST /340b/drug-products/${dp_std_id}/ceiling-prices"
              payload: { quarter: "2026Q2", amp_per_unit_cents: 4000, ura_per_unit_cents: 1500, is_published: true }
              as: ComplianceOfficer
              captures: { cpr_std_id: $.data.id }
            - call: "POST /340b/drug-products/${dp_penny_id}/ceiling-prices"
              payload: { quarter: "2026Q2", amp_per_unit_cents: 3000, ura_per_unit_cents: 3000, is_published: true }
              as: ComplianceOfficer
              captures: { cpr_penny_id: $.data.id }
          assert:
            - "CeilingPriceRecord.${cpr_std_id}.ceiling_price_per_unit_cents == 2500"
            - "CeilingPriceRecord.${cpr_std_id}.pricing_variant == STANDARD"
            - "CeilingPriceRecord.${cpr_penny_id}.ceiling_price_per_unit_cents == 1"
            - "CeilingPriceRecord.${cpr_penny_id}.pricing_variant == PENNY"

      - name: accumulator_virtual_unit_read_vs_actual_package_replenish
        grounds:
          - calculations.accumulator_replenishment
          - entities.Accumulator.fields.accrued_units
          - entities.Accumulator.fields.replenished_packages_total
        distinguishing_aspect: |
          The Accumulator's unit-based virtual read (accrued_units=20, replenished_packages_total=0 after two
          10-unit 340B dispenses) diverges from the package-based actual replenishment crystallised on the third
          dispense (accrued_units=0, replenished_packages_total=1); dual variant on the Accumulator domain, distinct
          from the DrugProduct ceiling-price domain.
        test_recipe:
          setup:
            - "ACTIVE CE, drug product package_size 30 with published ceiling 2500, EMPLOYED prescriber, eligible patient, accumulator for (CE, NDC)."
            - "Two 340B dispenses of 10 units each have run, leaving accrued_units=20."
          setup_api_calls:
            - call: "POST /340b/covered-entities"
              payload: { hrsa_id: "DSH010001", legal_name: "Acc Dual CE", entity_type: "FQHC", medicaid_billing_mode: "CARVE_OUT" }
              as: ComplianceOfficer
              captures: { ce_id: $.data.id }
            - call: "POST /340b/covered-entities/${ce_id}/approve"
              payload: {}
              as: HrsaAuditor
            - call: "POST /340b/drug-products"
              payload: { ndc: "00003-0003-03", drug_name: "GammaAcc", package_size_units: 30, wac_price_per_unit_cents: 6000 }
              as: ComplianceOfficer
              captures: { dp_id: $.data.id }
            - call: "POST /340b/drug-products/${dp_id}/ceiling-prices"
              payload: { quarter: "2026Q2", amp_per_unit_cents: 4000, ura_per_unit_cents: 1500, is_published: true }
              as: ComplianceOfficer
            - call: "POST /340b/covered-entities/${ce_id}/prescribers"
              payload: { npi: "1111111111", full_name: "Dr Acc", relationship_type: "EMPLOYED" }
              as: ComplianceOfficer
              captures: { presc_id: $.data.id }
            - call: "POST /340b/covered-entities/${ce_id}/patients"
              payload: { mrn: "MRN-ACC-1", has_ce_care_record: true, ce_retains_responsibility: true, medicaid_ffs_enrolled: false }
              as: ComplianceOfficer
              captures: { pat_id: $.data.id }
            - call: "POST /340b/covered-entities/${ce_id}/accumulators"
              payload: { drug_product_id: "${dp_id}" }
              as: ComplianceOfficer
              captures: { acc_id: $.data.id }
            - call: "POST /340b/dispenses"
              payload: { covered_entity_id: "${ce_id}", patient_id: "${pat_id}", prescriber_id: "${presc_id}", drug_product_id: "${dp_id}", quantity_units: 10, quarter: "2026Q2" }
              as: PharmacyOperator
            - call: "POST /340b/dispenses"
              payload: { covered_entity_id: "${ce_id}", patient_id: "${pat_id}", prescriber_id: "${presc_id}", drug_product_id: "${dp_id}", quantity_units: 10, quarter: "2026Q2" }
              as: PharmacyOperator
          trigger:
            - call: "GET /340b/accumulators/${acc_id}"
              payload: {}
              as: PharmacyOperator
              captures: { accrued_before: $.data.accrued_units, pkgs_before: $.data.replenished_packages_total }
            - call: "POST /340b/dispenses"
              payload: { covered_entity_id: "${ce_id}", patient_id: "${pat_id}", prescriber_id: "${presc_id}", drug_product_id: "${dp_id}", quantity_units: 10, quarter: "2026Q2" }
              as: PharmacyOperator
            - call: "GET /340b/accumulators/${acc_id}"
              payload: {}
              as: PharmacyOperator
              captures: { accrued_after: $.data.accrued_units, pkgs_after: $.data.replenished_packages_total }
          assert:
            - "Accumulator.${acc_id} virtual read before third dispense: accrued_units == 20 and replenished_packages_total == 0"
            - "Accumulator.${acc_id} after third 340B dispense crystallises one package: accrued_units == 0 and replenished_packages_total == 1"

  # ==========================================================================
  # RULE 2 — Combinatorial formulas across different modes
  # ==========================================================================
  - rule_id: combinatorial_formula
    instances:
      - name: eligibility_determination_multi_prong_branching_mode_a
        grounds:
          - calculations.eligibility_determination
          - entities.PrescriptionDispense.fields.classification_status
          - entities.PrescriptionDispense.fields.eligibility_reason
        distinguishing_aspect: |
          Mode (a): eligibility_determination is a >3-input conditional cascade (care-record, responsibility,
          prescriber type, child-site registration, medicaid carve-out) where the FIRST failing prong decides
          eligibility_reason — a REFERRAL_ONLY prescriber yields CLASSIFIED_WAC/INELIGIBLE_PRESCRIBER even though
          every other prong passes, while an all-pass patient yields CLASSIFIED_340B/ELIGIBLE_340B.
        test_recipe:
          setup:
            - "ACTIVE CARVE_OUT CE, drug product with published ceiling 2500, one EMPLOYED prescriber and one REFERRAL_ONLY prescriber, one fully-eligible patient (non-Medicaid)."
          setup_api_calls:
            - call: "POST /340b/covered-entities"
              payload: { hrsa_id: "DSH010002", legal_name: "Elig CE", entity_type: "FQHC", medicaid_billing_mode: "CARVE_OUT" }
              as: ComplianceOfficer
              captures: { ce_id: $.data.id }
            - call: "POST /340b/covered-entities/${ce_id}/approve"
              payload: {}
              as: HrsaAuditor
            - call: "POST /340b/drug-products"
              payload: { ndc: "00004-0004-04", drug_name: "DeltaElig", package_size_units: 50, wac_price_per_unit_cents: 6000 }
              as: ComplianceOfficer
              captures: { dp_id: $.data.id }
            - call: "POST /340b/drug-products/${dp_id}/ceiling-prices"
              payload: { quarter: "2026Q2", amp_per_unit_cents: 4000, ura_per_unit_cents: 1500, is_published: true }
              as: ComplianceOfficer
            - call: "POST /340b/covered-entities/${ce_id}/prescribers"
              payload: { npi: "2222222222", full_name: "Dr Employed", relationship_type: "EMPLOYED" }
              as: ComplianceOfficer
              captures: { presc_emp_id: $.data.id }
            - call: "POST /340b/covered-entities/${ce_id}/prescribers"
              payload: { npi: "3333333333", full_name: "Dr Referral", relationship_type: "REFERRAL_ONLY" }
              as: ComplianceOfficer
              captures: { presc_ref_id: $.data.id }
            - call: "POST /340b/covered-entities/${ce_id}/patients"
              payload: { mrn: "MRN-ELIG-1", has_ce_care_record: true, ce_retains_responsibility: true, medicaid_ffs_enrolled: false }
              as: ComplianceOfficer
              captures: { pat_id: $.data.id }
          trigger:
            - call: "POST /340b/dispenses"
              payload: { covered_entity_id: "${ce_id}", patient_id: "${pat_id}", prescriber_id: "${presc_emp_id}", drug_product_id: "${dp_id}", quantity_units: 4, quarter: "2026Q2" }
              as: PharmacyOperator
              captures: { disp_ok_id: $.data.id }
            - call: "POST /340b/dispenses"
              payload: { covered_entity_id: "${ce_id}", patient_id: "${pat_id}", prescriber_id: "${presc_ref_id}", drug_product_id: "${dp_id}", quantity_units: 4, quarter: "2026Q2" }
              as: PharmacyOperator
              captures: { disp_ref_id: $.data.id }
          assert:
            - "PrescriptionDispense.${disp_ok_id}.classification_status == CLASSIFIED_340B"
            - "PrescriptionDispense.${disp_ok_id}.eligibility_reason == ELIGIBLE_340B"
            - "PrescriptionDispense.${disp_ref_id}.classification_status == CLASSIFIED_WAC"
            - "PrescriptionDispense.${disp_ref_id}.eligibility_reason == INELIGIBLE_PRESCRIBER"

      - name: overcharge_reconciliation_per_po_floor_then_sum_mode_b
        grounds:
          - calculations.overcharge_reconciliation
          - entities.RepaymentObligation.fields.assessed_cents
          - validations[priority=16]
        distinguishing_aspect: |
          Mode (b) pinned rounding order: each PO's overcharge is floored at 0 BEFORE summation (sum-of-floored),
          so an undercharged PO contributes 0 and never nets against an overcharged PO — overcharge total is 12000
          (per-PO-floored), NOT 9000 (the floor-of-sum / net value). Distinct mode from instance-1's mode-(a) branching.
        test_recipe:
          setup:
            - "DrugProduct package_size 30, published ceiling 2500 for 2026Q2; two B340B purchase orders in 2026Q2: PO1 paid 2700/unit for 2 packages (over), PO2 paid 2400/unit for 1 package (under)."
          setup_api_calls:
            - call: "POST /340b/covered-entities"
              payload: { hrsa_id: "DSH010003", legal_name: "Recon CE", entity_type: "FQHC", medicaid_billing_mode: "CARVE_OUT" }
              as: ComplianceOfficer
              captures: { ce_id: $.data.id }
            - call: "POST /340b/covered-entities/${ce_id}/approve"
              payload: {}
              as: HrsaAuditor
            - call: "POST /340b/drug-products"
              payload: { ndc: "00005-0005-05", drug_name: "EpsilonRecon", package_size_units: 30, wac_price_per_unit_cents: 6000 }
              as: ComplianceOfficer
              captures: { dp_id: $.data.id }
            - call: "POST /340b/drug-products/${dp_id}/ceiling-prices"
              payload: { quarter: "2026Q2", amp_per_unit_cents: 4000, ura_per_unit_cents: 1500, is_published: true }
              as: ComplianceOfficer
              captures: { ver_after_ceiling: $.data.version }
            - call: "POST /340b/purchase-orders"
              payload: { covered_entity_id: "${ce_id}", drug_product_id: "${dp_id}", channel: "B340B", packages_ordered: 2, quarter: "2026Q2", unit_price_paid_cents: 2700 }
              as: PharmacyOperator
            - call: "POST /340b/purchase-orders"
              payload: { covered_entity_id: "${ce_id}", drug_product_id: "${dp_id}", channel: "B340B", packages_ordered: 1, quarter: "2026Q2", unit_price_paid_cents: 2400 }
              as: PharmacyOperator
            - call: "GET /340b/drug-products/${dp_id}"
              payload: {}
              as: HrsaAuditor
              captures: { dp_ver: $.data.version }
          trigger:
            - call: "POST /340b/drug-products/${dp_id}/reconcile"
              payload: { quarter: "2026Q2", expected_drug_product_version: "${dp_ver}" }
              as: HrsaAuditor
              captures: { obl_id: $.data.id }
          assert:
            - "RepaymentObligation.${obl_id}.assessed_cents == 12000"
            - "RepaymentObligation.${obl_id}.source_kind == CEILING_RECONCILIATION"
            - "RepaymentObligation.${obl_id}.assessed_cents != 9000 (per-PO floor pinned; not the net floor-of-sum)"

  # ==========================================================================
  # RULE 3 — Non-linear state-machine shape on different entities
  # ==========================================================================
  - rule_id: non_linear_state_machine
    instances:
      - name: dispense_parallel_dimensions_reverse_reinstate_cycle
        grounds:
          - state_machines.PrescriptionDispense.DISPENSED_to_REVERSED
          - state_machines.PrescriptionDispense.REVERSED_to_DISPENSED
          - entities.PrescriptionDispense.fields.classification_status
          - entities.PrescriptionDispense.fields.dispense_status
        distinguishing_aspect: |
          PrescriptionDispense carries two independent state dimensions: classification_status (CLASSIFIED_340B,
          fixed at creation) and dispense_status which cycles DISPENSED->REVERSED->DISPENSED via reverse/reinstate;
          the classification dimension stays CLASSIFIED_340B across the whole cycle while dispense_status loops.
        test_recipe:
          setup:
            - "A CLASSIFIED_340B dispense of 10 units exists (accumulator accrued_units=10)."
          setup_api_calls:
            - call: "POST /340b/covered-entities"
              payload: { hrsa_id: "DSH010004", legal_name: "Cycle CE", entity_type: "FQHC", medicaid_billing_mode: "CARVE_OUT" }
              as: ComplianceOfficer
              captures: { ce_id: $.data.id }
            - call: "POST /340b/covered-entities/${ce_id}/approve"
              payload: {}
              as: HrsaAuditor
            - call: "POST /340b/drug-products"
              payload: { ndc: "00006-0006-06", drug_name: "ZetaCycle", package_size_units: 30, wac_price_per_unit_cents: 6000 }
              as: ComplianceOfficer
              captures: { dp_id: $.data.id }
            - call: "POST /340b/drug-products/${dp_id}/ceiling-prices"
              payload: { quarter: "2026Q2", amp_per_unit_cents: 4000, ura_per_unit_cents: 1500, is_published: true }
              as: ComplianceOfficer
            - call: "POST /340b/covered-entities/${ce_id}/prescribers"
              payload: { npi: "4444444444", full_name: "Dr Cycle", relationship_type: "EMPLOYED" }
              as: ComplianceOfficer
              captures: { presc_id: $.data.id }
            - call: "POST /340b/covered-entities/${ce_id}/patients"
              payload: { mrn: "MRN-CYC-1", has_ce_care_record: true, ce_retains_responsibility: true, medicaid_ffs_enrolled: false }
              as: ComplianceOfficer
              captures: { pat_id: $.data.id }
            - call: "POST /340b/covered-entities/${ce_id}/accumulators"
              payload: { drug_product_id: "${dp_id}" }
              as: ComplianceOfficer
              captures: { acc_id: $.data.id }
            - call: "POST /340b/dispenses"
              payload: { covered_entity_id: "${ce_id}", patient_id: "${pat_id}", prescriber_id: "${presc_id}", drug_product_id: "${dp_id}", quantity_units: 10, quarter: "2026Q2" }
              as: PharmacyOperator
              captures: { disp_id: $.data.id }
          trigger:
            - call: "POST /340b/dispenses/${disp_id}/reverse"
              payload: {}
              as: PharmacyOperator
              captures: { status_reversed: $.data.dispense_status, class_reversed: $.data.classification_status }
            - call: "POST /340b/dispenses/${disp_id}/reinstate"
              payload: {}
              as: PharmacyOperator
              captures: { status_reinstated: $.data.dispense_status, class_reinstated: $.data.classification_status }
          assert:
            - "After reverse: PrescriptionDispense.${disp_id}.dispense_status == REVERSED and classification_status == CLASSIFIED_340B"
            - "After reinstate: PrescriptionDispense.${disp_id}.dispense_status == DISPENSED and classification_status == CLASSIFIED_340B"
            - "Accumulator.${acc_id}.accrued_units == 10 (net zero across reverse+reinstate)"

      - name: audit_finding_under_review_disputed_revision_loop
        grounds:
          - state_machines.AuditFinding.UNDER_REVIEW_to_DISPUTED
          - state_machines.AuditFinding.DISPUTED_to_UNDER_REVIEW
          - entities.AuditFinding.fields.finding_status
        distinguishing_aspect: |
          AuditFinding cycles UNDER_REVIEW->DISPUTED->UNDER_REVIEW (a revision loop on a different entity than
          PrescriptionDispense); each dispute requires a prior review and start-review returns the finding to
          UNDER_REVIEW, so the same row visits UNDER_REVIEW twice.
        test_recipe:
          setup:
            - "An HRSA_AUDIT AuditFinding in UNDER_REVIEW state against a dispense."
          setup_api_calls:
            - call: "POST /340b/covered-entities"
              payload: { hrsa_id: "DSH010005", legal_name: "Loop CE", entity_type: "FQHC", medicaid_billing_mode: "CARVE_OUT" }
              as: ComplianceOfficer
              captures: { ce_id: $.data.id }
            - call: "POST /340b/covered-entities/${ce_id}/approve"
              payload: {}
              as: HrsaAuditor
            - call: "POST /340b/drug-products"
              payload: { ndc: "00007-0007-07", drug_name: "EtaLoop", package_size_units: 30, wac_price_per_unit_cents: 6000 }
              as: ComplianceOfficer
              captures: { dp_id: $.data.id }
            - call: "POST /340b/drug-products/${dp_id}/ceiling-prices"
              payload: { quarter: "2026Q2", amp_per_unit_cents: 4000, ura_per_unit_cents: 1500, is_published: true }
              as: ComplianceOfficer
            - call: "POST /340b/covered-entities/${ce_id}/prescribers"
              payload: { npi: "5555555555", full_name: "Dr Loop", relationship_type: "EMPLOYED" }
              as: ComplianceOfficer
              captures: { presc_id: $.data.id }
            - call: "POST /340b/covered-entities/${ce_id}/patients"
              payload: { mrn: "MRN-LOOP-1", has_ce_care_record: true, ce_retains_responsibility: true, medicaid_ffs_enrolled: false }
              as: ComplianceOfficer
              captures: { pat_id: $.data.id }
            - call: "POST /340b/dispenses"
              payload: { covered_entity_id: "${ce_id}", patient_id: "${pat_id}", prescriber_id: "${presc_id}", drug_product_id: "${dp_id}", quantity_units: 6, quarter: "2026Q2" }
              as: PharmacyOperator
              captures: { disp_id: $.data.id }
            - call: "POST /340b/audit-findings"
              payload: { covered_entity_id: "${ce_id}", prescription_dispense_id: "${disp_id}", finding_type: "DIVERSION", assessed_units: 6 }
              as: HrsaAuditor
              captures: { af_id: $.data.id }
            - call: "POST /340b/audit-findings/${af_id}/start-review"
              payload: {}
              as: HrsaAuditor
          trigger:
            - call: "POST /340b/audit-findings/${af_id}/dispute"
              payload: {}
              as: ComplianceOfficer
              captures: { st_disputed: $.data.finding_status }
            - call: "POST /340b/audit-findings/${af_id}/start-review"
              payload: {}
              as: HrsaAuditor
              captures: { st_review2: $.data.finding_status }
          assert:
            - "After dispute: AuditFinding.${af_id}.finding_status == DISPUTED"
            - "After second start-review: AuditFinding.${af_id}.finding_status == UNDER_REVIEW (revision loop closed)"

  # ==========================================================================
  # RULE 4 — Transitive cascade chains from different triggers
  # ==========================================================================
  - rule_id: transitive_cascade
    instances:
      - name: dispense_to_accumulator_to_purchase_order_depth3
        grounds:
          - state_machines.PrescriptionDispense.DISPENSED_to_DISPENSED
          - calculations.accumulator_replenishment
          - entities.PurchaseOrder.fields.accumulator_id
          - entities.Accumulator.fields.replenished_packages_total
        distinguishing_aspect: |
          Depth-3 cascade from dispense creation: (1) POST /dispenses classifies 340B and mutates the Accumulator
          (accrued_units += 30); (2) that accumulator mutation crosses package_size and triggers a replenishment
          sweep (accrued_units -> 0, replenished_packages_total += 1); (3) the replenishment sweep itself creates a
          B340B PurchaseOrder. Each link is caused by the prior link, not directly by POST /dispenses.
        test_recipe:
          setup:
            - "ACTIVE CE, drug product package_size 30, published ceiling 2500, EMPLOYED prescriber, eligible patient, accumulator for (CE, NDC) at accrued_units=0."
          setup_api_calls:
            - call: "POST /340b/covered-entities"
              payload: { hrsa_id: "DSH010006", legal_name: "Casc CE", entity_type: "FQHC", medicaid_billing_mode: "CARVE_OUT" }
              as: ComplianceOfficer
              captures: { ce_id: $.data.id }
            - call: "POST /340b/covered-entities/${ce_id}/approve"
              payload: {}
              as: HrsaAuditor
            - call: "POST /340b/drug-products"
              payload: { ndc: "00008-0008-08", drug_name: "ThetaCasc", package_size_units: 30, wac_price_per_unit_cents: 6000 }
              as: ComplianceOfficer
              captures: { dp_id: $.data.id }
            - call: "POST /340b/drug-products/${dp_id}/ceiling-prices"
              payload: { quarter: "2026Q2", amp_per_unit_cents: 4000, ura_per_unit_cents: 1500, is_published: true }
              as: ComplianceOfficer
            - call: "POST /340b/covered-entities/${ce_id}/prescribers"
              payload: { npi: "6666666666", full_name: "Dr Casc", relationship_type: "EMPLOYED" }
              as: ComplianceOfficer
              captures: { presc_id: $.data.id }
            - call: "POST /340b/covered-entities/${ce_id}/patients"
              payload: { mrn: "MRN-CASC-1", has_ce_care_record: true, ce_retains_responsibility: true, medicaid_ffs_enrolled: false }
              as: ComplianceOfficer
              captures: { pat_id: $.data.id }
            - call: "POST /340b/covered-entities/${ce_id}/accumulators"
              payload: { drug_product_id: "${dp_id}" }
              as: ComplianceOfficer
              captures: { acc_id: $.data.id }
          trigger:
            - call: "POST /340b/dispenses"
              payload: { covered_entity_id: "${ce_id}", patient_id: "${pat_id}", prescriber_id: "${presc_id}", drug_product_id: "${dp_id}", quantity_units: 30, quarter: "2026Q2" }
              as: PharmacyOperator
              captures: { disp_id: $.data.id }
            - call: "GET /340b/purchase-orders"
              payload: {}
              as: PharmacyOperator
          assert:
            - "Accumulator.${acc_id}.accrued_units == 0 (30 units crystallised into one package)"
            - "Accumulator.${acc_id}.replenished_packages_total == 1"
            - "GET /340b/purchase-orders?accumulator_id=${acc_id} returns exactly one PurchaseOrder with channel == B340B and packages_ordered == 1"

      - name: remit_settles_obligation_clears_ce_posture_depth2
        grounds:
          - state_machines.RepaymentObligation.OWED_to_SETTLED
          - entities.CoveredEntity.fields.open_repayment_cents
          - entities.CoveredEntity.fields.compliance_posture
        distinguishing_aspect: |
          Depth-2 cascade from a different trigger (POST /repayment-obligations/{id}/remit): (1) the full remit
          settles the obligation (status -> SETTLED, remaining_balance_cents -> 0); (2) that settlement recomputes
          the CoveredEntity's open_repayment_cents to 0 and, with no open findings, flips compliance_posture to GOOD.
          Distinct trigger and propagation pattern from the dispense->accumulator->PO cascade.
        test_recipe:
          setup:
            - "ACTIVE CE with a single DISMISSED-free finding fully resolved path is NOT used; instead a CEILING_RECONCILIATION RepaymentObligation of assessed 12000 exists (compliance_posture FLAGGED, open_repayment_cents 12000), no open findings."
          setup_api_calls:
            - call: "POST /340b/covered-entities"
              payload: { hrsa_id: "DSH010007", legal_name: "Remit CE", entity_type: "FQHC", medicaid_billing_mode: "CARVE_OUT" }
