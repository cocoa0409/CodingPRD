  # ===========================================================================
  - rule_id: compensating_invariant
    instances:

      - name: escrow_disposition_buckets_conserve_deposit_amount
        grounds:
          - calculations.escrow_disposition
          - state_machines.EarnestMoneyDeposit
          - state_machines.DisputeCase.EVIDENCE_COMPLETE_to_ADJUDICATED
          - entities.EarnestMoneyDeposit.fields.disposition_event_count
        distinguishing_aspect: |
          The conserved quantity is invariant Q1 on a single EarnestMoneyDeposit: held_cents +
          refunded_to_wholesaler_cents + forfeited_to_seller_cents + applied_at_closing_cents
          must equal amount_cents after every request that touches the deposit. A forfeiture
          followed by a SPLIT_50_50 dispute award moves the money twice, and the odd cent in
          500001 must land with the wholesaler rather than vanish or duplicate.
        test_recipe:
          setup:
            - "Logical clock starts at 2026-08-10T00:00:00Z."
            - "One unlicensed wholesaler, one STATUTORY-screened STANDARD lead, one FINALIZED AGGRESSIVE analysis."
            - "One contract at purchase_price_cents 18000000 with an odd earnest_money_cents of 500001 and inspection_period_days 7, signed at 2026-08-10T00:00:00Z so inspection_deadline_at is 2026-08-17T00:00:00Z; the signing cascade creates the deposit HELD at 500001."
            - "Clock advanced to 2026-08-18T00:00:00Z so forfeiture is permitted, then the title agent forfeits the deposit."
            - "The seller opens a dispute on the forfeiture and both sides file evidence, so the case reaches EVIDENCE_COMPLETE."
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-08-10T00:00:00Z" }
              as: PlatformAdmin
            - call: "POST /wholesalers"
              payload: { legal_name: "Keystone Property Partners LLC", state_code: "TX", disclosure_template_version: "DISC-2026.1" }
              as: PlatformAdmin
              captures: { w_id: $.data.id }
            - call: "POST /seller-leads"
              payload: { wholesaler_id: "${w_id}", owner_name: "Dana Ruiz", property_address: "118 Cedar St, Austin TX", state_code: "TX", estimated_market_value_cents: 30000000, recorded_senior_lien_cents: 10000000 }
              as: Wholesaler
              as_user_id: "${w_id}"
              captures: { sl_id: $.data.id }
            - call: "POST /seller-leads/${sl_id}/protection-screen"
              payload: { screening_variant: "STATUTORY" }
              as: Wholesaler
              as_user_id: "${w_id}"
              captures: { sl_v2: $.data.version }
            - call: "POST /deal-analyses"
              payload:
                seller_lead_id: "${sl_id}"
