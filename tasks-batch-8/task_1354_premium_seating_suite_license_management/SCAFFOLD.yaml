        preconditions: ["scope ownership"]
        side_effects: []
      - from: REVISED
        to: DECLINED
        trigger: "POST /api/renewal-offers/{id}/set_status {target_status: DECLINED}"
        actor: AccountHolder
        preconditions: ["scope ownership"]
        side_effects: []
      - from: OFFERED
        to: SUPERSEDED
