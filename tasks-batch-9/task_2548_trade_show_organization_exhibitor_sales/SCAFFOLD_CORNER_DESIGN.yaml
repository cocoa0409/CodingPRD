              as: Exhibitor
              as_user_id: "u_not_an_exhibitor"
              captures: { e_identity_bad: $.data.error_id }
            - call: "POST /space-contracts/${sc_a}/sign"
              payload: { expected_show_version: "${sv4}", deposit_paid_cents: 389070 }
              as: Exhibitor
              captures: { e_identity_absent: $.data.error_id }
            - call: "POST /space-contracts/${sc_a}/sign"
              payload: { expected_show_version: "${sv4}", deposit_paid_cents: 389070 }
              as: Exhibitor
              as_user_id: "${ex_b}"
              captures: { e_scope: $.data.error_id }
          assert:
            - "${e_unauth_bad} == ERR_UNAUTHENTICATED with HTTP 401 — 'Auditor' is not one of the five declared roles"
            - "${e_unauth_none} == ERR_UNAUTHENTICATED with HTTP 401 — this call sends NO X-Role header at all"
            - "${e_role_show} == ERR_ROLE_NOT_PERMITTED with HTTP 403 — POST /shows is exclusive to ShowDirector and a Registrant holds no authority outside registration"
            - "No Show with edition_year 2029 exists after the three refusals"
            - "${e_role_sign} == ERR_ROLE_NOT_PERMITTED with HTTP 403 — a SalesRep may propose a sponsorship but signing is ShowDirector-exclusive, and the role gate at priority 3 fires before the SoD gate at priority 6"
            - "SponsorshipDeal.${d1}.deal_status is still PROPOSED with signed_by_user_id null"
            - "${e_identity_bad} == ERR_IDENTITY_REQUIRED with HTTP 403 — 'u_not_an_exhibitor' resolves to no Exhibitor row"
            - "${e_identity_absent} == ERR_IDENTITY_REQUIRED with HTTP 403 — this call sends X-Role Exhibitor with NO X-Role-Id"
            - "${e_scope} == ERR_EXHIBITOR_SCOPE_VIOLATION with HTTP 403 — SpaceContract.${sc_a}.exhibitor_id is ${ex_a}, not ${ex_b}, and the scope gate at priority 5 fires before the deposit rules at priorities 62-63"
            - "SpaceContract.${sc_a}.status is still OFFERED with deposit_paid_cents 0 and signed_at null; Booth.${b_a}.status is still HELD"
            - "Show.${show_id}.version is unchanged from ${sv4} across all seven refusals"

      - name: segregation_of_duties_refuses_every_self_approval_on_all_three_legs
        claim_type: segregation_of_duties
        grounds:
          - validations[priority=6]
          - validations[priority=7]
