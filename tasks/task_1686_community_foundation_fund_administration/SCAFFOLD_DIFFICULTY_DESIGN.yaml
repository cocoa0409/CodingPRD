            - call: "POST /grants"
              payload: { fund_id: "${fg_id}", grantee_id: "${gg_id}", amount: 1000.00, purpose: "Loop test", recommended_by_advisor_id: "${a1_id}", expected_fund_version: "${fg_v}" }
              as: Advisor
              as_user_id: "${a1_id}"
              captures: { gl_id: $.data.id }
            - call: "POST /grants/${gl_id}/submit"
              payload: {}
              as: Advisor
              as_user_id: "${a1_id}"
            - call: "POST /grants/${gl_id}/claim-review"
              payload: {}
              as: ComplianceOfficer
            - call: "POST /grants/${gl_id}/return"
              payload: {}
              as: ComplianceOfficer
            - call: "POST /grants/${gl_id}/submit"
              payload: {}
              as: Advisor
              as_user_id: "${a1_id}"
            - call: "POST /grants/${gl_id}/claim-review"
              payload: {}
              as: ComplianceOfficer
            - call: "POST /grants/${gl_id}/return"
              payload: {}
              as: ComplianceOfficer
            - call: "POST /grants/${gl_id}/submit"
              payload: {}
              as: Advisor
              as_user_id: "${a1_id}"
            - call: "POST /grants/${gl_id}/claim-review"
              payload: {}
              as: ComplianceOfficer
          trigger:
            - call: "POST /grants/${gl_id}/return"
              payload: {}
              as: ComplianceOfficer
          assert:
            - "GrantRecommendation(gl).revision_count == 3"
            - "GrantRecommendation(gl).status == DENIED (auto-cascade at third return, not RETURNED)"
            - "GrantRecommendation(gl).decided_at != null"

      - name: contribution_parallel_dimensions
        grounds:
          - state_machines.Contribution.PLEDGED_to_ACCEPTED
          - state_machines.Contribution.ACCEPTED_+_PENDING_LIQUIDATION_(liquidation_dimension)_to_ACCEPTED_+_LIQUIDATED
          - entities.Contribution.fields.acceptance_status
          - entities.Contribution.fields.liquidation_status
        distinguishing_aspect: |
          Parallel state dimensions on Contribution: acceptance_status
          (PLEDGED -> ACCEPTED) and liquidation_status (PENDING_LIQUIDATION ->
          LIQUIDATED) evolve independently for non-cash gifts — the contribution
          is ACCEPTED but cash is NOT credited until the liquidation dimension
          completes; a CASH gift collapses both dimensions at accept. Non-linear
          (parallel) machine on a different entity than the grant cycle.
        test_recipe:
          setup:
            - "Fund fp ACTIVE non-endowed, cash 20000.00 from seed"
            - "Non-cash contribution cp (PUBLICLY_TRADED, 1 lot) exists in PLEDGED"
          setup_api_calls:
            - call: "POST /funds"
              payload: { fund_name: "Parallel Fund", fund_type: "DESIGNATED", endowed: false }
              as: FoundationAdmin
              captures: { fp_id: $.data.id }
            - call: "POST /funds/${fp_id}/agreements"
              payload: { spending_rate_pct: 4.5, spending_formula: "AVERAGE_12Q", fee_tier_schedule: "STANDARD", min_initial_contribution: 10000.00 }
              as: FoundationAdmin
              captures: { fp_ag: $.data.id }
            - call: "POST /agreements/${fp_ag}/execute"
              payload: {}
              as: FoundationAdmin
            - call: "POST /contributions"
              payload: { fund_id: "${fp_id}", donor_name: "Seed", asset_kind: "CASH", declared_value: 20000.00 }
              as: GiftOfficer
              captures: { fp_seed: $.data.id }
            - call: "POST /contributions/${fp_seed}/accept"
              payload: {}
              as: GiftOfficer
            - call: "POST /funds/${fp_id}/activate"
              payload: {}
              as: FoundationAdmin
            - call: "POST /contributions"
              payload: { fund_id: "${fp_id}", donor_name: "Stock Donor", asset_kind: "PUBLICLY_TRADED", declared_value: 10000.00 }
              as: GiftOfficer
              captures: { cp_id: $.data.id }
            - call: "POST /contributions/${cp_id}/lots"
              payload: { description: "GAMMA shares", quantity: 50, appraised_value: 10000.00 }
              as: GiftOfficer
              captures: { cp_lot: $.data.id }
          trigger:
            - call: "POST /contributions/${cp_id}/accept"
              payload: {}
              as: GiftOfficer
              captures: { cp_as: $.data.acceptance_status, cp_ls: $.data.liquidation_status }
            - call: "GET /funds/${fp_id}"
              as: FoundationAdmin
              captures: { fp_cash_mid: $.data.cash_balance }
            - call: "POST /contributions/${cp_id}/liquidate"
              payload: { lot_proceeds: [ { lot_id: "${cp_lot}", gross_proceeds: 10000.00 } ] }
              as: GiftOfficer
              captures: { cp_net: $.data.net_proceeds }
          assert:
            - "cp_as == ACCEPTED while cp_ls == PENDING_LIQUIDATION (dimensions independent)"
            - "Fund(fp).cash_balance == 20000.00 after accept (non-cash not yet credited)"
            - "Contribution(cp).net_proceeds == 9775.00 (10000.00 - 150.00 fee - 75.00 brokerage)"
            - "Fund(fp).cash_balance == 29775.00 after liquidate"

  # ===========================================================================
  # Rule 4 — transitive_cascade (different triggers; one depth>=3, one depth>=2)
  # ===========================================================================
  - rule_id: transitive_cascade
    instances:
      - name: advisor_deceased_succession_inactive_cascade
        grounds:
          - state_machines.FundAdvisor.ACTIVE_to_DECEASED
          - state_machines.Fund.ACTIVE_to_INACTIVE
          - state_machines.FundAdvisor.INVITED_to_ACTIVE
        distinguishing_aspect: |
          Depth-3 chain from POST /advisors/{id}/record-deceased: advisor ->
          DECEASED (hop 1); because the EXECUTED agreement names successor s
          (INVITED), s auto-activates (hop 2, caused by hop 1's succession rule);
          hop 2's activation of a successor on an INACTIVE fund refreshes
          fund.last_activity_at which flips Fund INACTIVE -> ACTIVE (hop 3,
          caused by hop 2). Each hop caused by the previous link.
        test_recipe:
          setup:
            - "DAF fund fd ACTIVE, agreement names successor_advisor_id = s (INVITED); primary advisor p ACTIVE; clock advanced so fd is INACTIVE (37 months past last activity with trigger 36)"
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-01-15T00:00:00Z" }
              as: FoundationAdmin
            - call: "POST /funds"
              payload: { fund_name: "Succession Fund", fund_type: "DONOR_ADVISED", endowed: false }
              as: FoundationAdmin
              captures: { fd_id: $.data.id }
            - call: "POST /funds/${fd_id}/advisors"
              payload: { advisor_name: "Primary Pat", email: "pat@x.com", advisor_kind: "PRIMARY" }
              as: FoundationAdmin
              captures: { p_id: $.data.id }
            - call: "POST /advisors/${p_id}/accept"
              payload: {}
              as: Advisor
              as_user_id: "${p_id}"
            - call: "POST /funds/${fd_id}/advisors"
              payload: { advisor_name: "Successor Sue", email: "sue@x.com", advisor_kind: "SUCCESSOR" }
              as: FoundationAdmin
              captures: { s_id: $.data.id }
            - call: "POST /funds/${fd_id}/agreements"
              payload: { spending_rate_pct: 4.5, spending_formula: "AVERAGE_12Q", fee_tier_schedule: "STANDARD", successor_advisor_id: "${s_id}", inactivity_trigger_months: 36, dormancy_trigger_months: 24, min_initial_contribution: 10000.00 }
              as: FoundationAdmin
              captures: { fd_ag: $.data.id }
            - call: "POST /agreements/${fd_ag}/execute"
              payload: {}
              as: FoundationAdmin
            - call: "POST /contributions"
              payload: { fund_id: "${fd_id}", donor_name: "Seed", asset_kind: "CASH", declared_value: 50000.00 }
              as: GiftOfficer
              captures: { fd_c: $.data.id }
            - call: "POST /contributions/${fd_c}/accept"
              payload: {}
              as: GiftOfficer
            - call: "POST /funds/${fd_id}/activate"
              payload: {}
              as: FoundationAdmin
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2029-03-01T00:00:00Z" }
              as: FoundationAdmin
              captures: { clk: $.data.current_utc }
          trigger:
            - call: "POST /advisors/${p_id}/record-deceased"
              payload: {}
              as: FoundationAdmin
              captures: { p_status: $.data.status }
            - call: "GET /advisors/${s_id}"
              as: FoundationAdmin
              captures: { s_status: $.data.status }
            - call: "GET /funds/${fd_id}"
              as: FoundationAdmin
              captures: { fd_status: $.data.status }
          assert:
            - "FundAdvisor(p).status == DECEASED"
            - "FundAdvisor(s).status == ACTIVE (succession cascade hop 2)"
            - "Fund(fd).status was INACTIVE before the trigger and == ACTIVE after (hop 3 via last_activity_at refresh)"

      - name: program_close_applications_scoring_cascade
        grounds:
          - state_machines.ScholarshipProgram.OPEN_to_SCORING
          - state_machines.ScholarshipApplication.SUBMITTED_to_UNDER_SCORING
          - calculations.application_final_score
        distinguishing_aspect: |
          Depth-2 cascade from POST /programs/{id}/close-applications: program ->
          SCORING (hop 1); that transition cascades every SUBMITTED application
          -> UNDER_SCORING (hop 2, caused by hop 1's cascade rule). Different
          trigger and entity pair than the advisor-succession chain.
        test_recipe:
          setup:
            - "SCHOLARSHIP fund fs2 ACTIVE cash 100000; program pr with 3 seated members, window already closed by clock; 2 applications SUBMITTED"
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-02-01T00:00:00Z" }
              as: FoundationAdmin
            - call: "POST /funds"
              payload: { fund_name: "Schol Fund", fund_type: "SCHOLARSHIP", endowed: false }
              as: FoundationAdmin
              captures: { fs2_id: $.data.id }
            - call: "POST /funds/${fs2_id}/agreements"
              payload: { spending_rate_pct: 4.5, spending_formula: "AVERAGE_12Q", fee_tier_schedule: "STANDARD", min_initial_contribution: 10000.00 }
              as: FoundationAdmin
              captures: { fs2_ag: $.data.id }
            - call: "POST /agreements/${fs2_ag}/execute"
              payload: {}
              as: FoundationAdmin
            - call: "POST /contributions"
              payload: { fund_id: "${fs2_id}", donor_name: "Seed", asset_kind: "CASH", declared_value: 100000.00 }
              as: GiftOfficer
              captures: { fs2_c: $.data.id }
            - call: "POST /contributions/${fs2_c}/accept"
              payload: {}
              as: GiftOfficer
            - call: "POST /funds/${fs2_id}/activate"
              payload: {}
              as: FoundationAdmin
            - call: "POST /funds/${fs2_id}/scholarship-programs"
              payload: { program_name: "Leaders 2026", application_open: "2026-02-01T00:00:00Z", application_close: "2026-03-01T00:00:00Z", award_amount: 2500.00, max_awards: 2 }
              as: ProgramOfficer
              captures: { pr_id: $.data.id }
            - call: "POST /programs/${pr_id}/committee-members"
              payload: { member_name: "M One", email: "m1@x.com" }
              as: ProgramOfficer
            - call: "POST /programs/${pr_id}/committee-members"
              payload: { member_name: "M Two", email: "m2@x.com" }
              as: ProgramOfficer
            - call: "POST /programs/${pr_id}/committee-members"
              payload: { member_name: "M Three", email: "m3@x.com" }
              as: ProgramOfficer
            - call: "POST /programs/${pr_id}/open"
              payload: {}
              as: ProgramOfficer
            - call: "POST /programs/${pr_id}/applications"
              payload: { applicant_name: "App A", applicant_email: "a@x.com" }
              as: Applicant
              captures: { app_a: $.data.id }
            - call: "POST /programs/${pr_id}/applications"
              payload: { applicant_name: "App B", applicant_email: "b@x.com" }
              as: Applicant
              captures: { app_b: $.data.id }
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-03-02T00:00:00Z" }
              as: FoundationAdmin
          trigger:
            - call: "POST /programs/${pr_id}/close-applications"
              payload: {}
              as: ProgramOfficer
              captures: { pr_status: $.data.status }
          assert:
            - "ScholarshipProgram(pr).status == SCORING"
            - "ScholarshipApplication(app_a).status == UNDER_SCORING (cascade hop 2)"
            - "ScholarshipApplication(app_b).status == UNDER_SCORING (cascade hop 2)"

  # ===========================================================================
  # Rule 5 — priority_pair_validation_conflict (different error-category pairs)
  # ===========================================================================
  - rule_id: priority_pair_validation_conflict
    instances:
      - name: state_before_fiscal_on_grant_approve
        grounds:
          - validations[priority=5]
          - validations[priority=13]
          - errors[ERR_INVALID_STATE]
          - errors[ERR_EXCEEDS_SPENDABLE]
        distinguishing_aspect: |
          Pair (state vs business_fiscal): a grant in DRAFT (wrong state for
          approve) on an endowed fund whose amount also exceeds spendable must
          return the state-category error ERR_INVALID_STATE, not the fiscal
          ERR_EXCEEDS_SPENDABLE — priority 5 beats 13.
        test_recipe:
          setup:
            - "Fund fe2 ACTIVE endowed, allowance 4666.87 (12 quarter snapshots, 4.5%), cash 200000"
            - "Grantee CLEARED; grant amount 99999.00 exists in DRAFT (never submitted)"
