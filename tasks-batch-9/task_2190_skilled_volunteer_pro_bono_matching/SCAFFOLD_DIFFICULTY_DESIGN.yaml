          - entities.ProjectRequest.fields.failed_match_rounds
          - entities.Volunteer.fields.reliability_score
        distinguishing_aspect: |
          MatchOffer is branching with four terminals whose side effects deliberately disagree even
          though all three non-accept edges release the same hours and slot: DECLINED with
          IP_TERMS_UNACCEPTABLE increments failed_match_rounds AND excludes the volunteer from later
          rounds on that request; WITHDRAWN with withdraw_reason ADMIN releases the reservation but
          does NOT increment failed_match_rounds; EXPIRED increments failed_match_rounds yet is the only
          terminal that leaves the volunteer's reliability inputs completely untouched. Three sibling
          requests reach three different terminals in one run, so a uniform "release and penalise"
          implementation produces failed_match_rounds 1 on the withdrawn request.
