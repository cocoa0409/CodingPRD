# =============================================================================
# Independent ATM Operator & Cash Logistics — Scaffold (Expert tier)
# Sections §1.0–§1.7. §1.8 lives in SCAFFOLD_DIFFICULTY_DESIGN.yaml,
# §1.9 in SCAFFOLD_CORNER_DESIGN.yaml.
# =============================================================================

scenario: |
  508. Independent ATM Operator & Cash Logistics (Allpoint network style):
  machine/location & cash-load forecast, surcharge + interchange revenue,
  vault-cash & armored replenishment, dispense reconciliation & cassette
  balance, jam/fault service ticket, fee-disclosure compliance, network
  settlement, site-merchant commission split

domain_name: atm-cash-logistics
api_prefix: ""

# -----------------------------------------------------------------------------
# Complexity profile
# -----------------------------------------------------------------------------
complexity_profile:
  primary_archetype: ledger_reconciliation
  secondary_archetype: pricing_engine
  complexity_layers:
    - optimistic_concurrency       # OCC on Vault.version for replenishment dispatch
    - cascading_side_effects       # settlement -> commission -> statement; recon -> ticket -> atm
    - dual_variant_calculation     # cash-load forecast: forward_looking vs chronological
    - rate_threshold_triggers      # interchange tiers by cumulative monthly count
    - derived_field_reconciliation # vault balance / cassette balance derived fields

  entity_topology: flat
  # Peer entities linked by foreign keys (ATM, Location, Vault, SiteMerchant,
  # ReplenishmentOrder, Cassette, Transaction, etc.). No deep URL nesting.

  state_machine_shape: parallel
  # ATM carries two independent state dimensions: operational_status
  # (jam/fault lifecycle) × cash_status (replenishment/recon lifecycle).
  # ReplenishmentOrder is branching-with-revert; SettlementRun is linear;
  # ServiceTicket is cyclic (reopen loop).

  relationship_patterns:
    - one_to_many        # Location 1..* ATM; ATM 1..* Cassette; ATM 1..* Transaction
    - cross_aggregate    # Settlement reads Transactions across ATM; commission reads SiteMerchant contract

  role_model: peer_roles
  # FieldTech owns service tickets + cash counts; VaultController owns vault +
  # replenishment dispatch; SettlementOfficer owns settlement + commission;
  # ComplianceOfficer owns fee disclosures; PlatformAdmin provisions config.

  consistency_model: immediate

# =============================================================================
# §1.0 Response Envelope (FIXED — verbatim)
# =============================================================================
response_envelope:
  success: |
    { "meta": { "api_request_id": "req_xxx", "api_request_timestamp": "ISO8601" },
      "response_type": "object" | "array", "data": {} }
  error: |
    { "meta": { ... }, "response_type": "error",
      "data": { "error_id": "ERR_XXX", "message": "..." } }
  pagination_fields: ["limit", "offset", "total_count", "has_more"]
  pagination_defaults: { limit: 10, min: 1, max: 100, offset: 0 }

# =============================================================================
# §1.1 Entity-Relationship Table
# =============================================================================
entities:
  - name: Location
    parent: null
    common_fields: true
    fields:
      - { name: name, type: string, source: input, description: "Site name (e.g. 'Downtown Deli')" }
      - { name: jurisdiction_code, type: enum, source: input, description: "CA | NY | TX | FL — selects the regulatory surcharge cap and disclosure rule set" }
      - { name: site_merchant_id, type: string, source: input, description: "FK -> SiteMerchant.id; the merchant that owns the commission contract for this site" }
      - { name: route_id, type: string, source: input, description: "FK -> ArmoredRoute.id; the armored route servicing this site" }
      - { name: address, type: string, source: input, description: "Street address" }

  - name: SiteMerchant
    parent: null
    common_fields: true
    fields:
      - { name: legal_name, type: string, source: input, description: "Merchant legal name" }
      - { name: commission_pct_bps, type: integer, source: input, description: "Commission rate in basis points of net operator revenue (e.g. 1500 = 15.00%)", constraints: "0..10000" }
      - { name: commission_flat_per_wd_cents, type: integer, source: input, description: "Flat commission per withdrawal, in cents; the 'whichever is greater' floor" }
      - { name: commission_monthly_ceiling_cents, type: integer, source: input, description: "Maximum commission payable to this merchant per calendar month, in cents" }
      - { name: commission_basis, type: enum, source: input, default: GREATER_OF, description: "GREATER_OF (max of pct and flat) | PCT_ONLY | FLAT_ONLY — pins the split formula", constraints: "GREATER_OF | PCT_ONLY | FLAT_ONLY" }
      - { name: payout_status, type: enum, source: system, default: ACTIVE, description: "ACTIVE | SUSPENDED — SUSPENDED merchants accrue zero commission", constraints: "ACTIVE | SUSPENDED" }

  - name: ArmoredRoute
    parent: null
    common_fields: true
    fields:
      - { name: carrier_name, type: string, source: input, description: "Armored carrier company name" }
      - { name: vault_id, type: string, source: input, description: "FK -> Vault.id; the vault this route draws cash from" }
      - { name: status, type: enum, source: system, default: ACTIVE, description: "ACTIVE | PAUSED — PAUSED routes reject new replenishment dispatch", constraints: "ACTIVE | PAUSED" }

  - name: Vault
    parent: null
    common_fields: true
    fields:
      - { name: name, type: string, source: input, description: "Vault name" }
      - { name: provisioned_cents, type: integer, source: input, description: "Total cash provisioned into this vault custody chain at creation; the conserved quantity baseline" }
      - { name: balance_cents, type: integer, source: computed, description: "On-hand vault cash = provisioned_cents - in_transit_cents - in_machine_cents; debited on dispatch, credited on recall/return" }
      - { name: in_transit_cents, type: integer, source: computed, description: "Sum of order_amount_cents for ReplenishmentOrders in DISPATCHED state drawing on this vault" }
      - { name: in_machine_cents, type: integer, source: computed, description: "Sum of order_amount_cents for ReplenishmentOrders in LOADED state drawing on this vault (cash now resident in ATM cassettes, not yet reconciled out)" }

  - name: ATM
    parent: null
    common_fields: true
    fields:
      - { name: serial_no, type: string, source: input, description: "Manufacturer serial; unique across all ATMs" }
      - { name: location_id, type: string, source: input, description: "FK -> Location.id; the site hosting this machine" }
      - { name: note_denomination_cents, type: integer, source: input, default: 2000, description: "Note value dispensed (e.g. 2000 = $20 bills); forecasts round UP to this multiple" }
      - { name: surcharge_cents, type: integer, source: input, description: "Operator surcharge charged per withdrawal, in cents; must satisfy the jurisdiction cap (§1.3 fee disclosure)" }
      - { name: operational_status, type: enum, source: system, default: IN_SERVICE, description: "IN_SERVICE | FAULTED | OUT_OF_SERVICE — jam/fault dimension; independent of cash_status", constraints: "IN_SERVICE | FAULTED | OUT_OF_SERVICE" }
      - { name: cash_status, type: enum, source: system, default: EMPTY, description: "EMPTY | AWAITING_LOAD | LOADED | LOW | RECONCILING — cash dimension; independent of operational_status", constraints: "EMPTY | AWAITING_LOAD | LOADED | LOW | RECONCILING" }
      - { name: monthly_wd_count, type: integer, source: computed, default: 0, description: "Cumulative count of WITHDRAWAL transactions on this ATM in the current calendar month; resets to 0 at month rollover; drives the interchange tier" }
      - { name: loaded_cents, type: integer, source: computed, default: 0, description: "Cash currently loaded into this ATM's cassettes per the last LOADED replenishment, net of dispensed = sum(Cassette.loaded_cents)" }
      - { name: dispensed_cents_since_load, type: integer, source: computed, default: 0, description: "Sum of Transaction.amount_cents for WITHDRAWAL transactions since the last LOADED replenishment" }
      - { name: fee_disclosure_id, type: string, source: system, description: "FK -> FeeDisclosure.id; the active approved disclosure gating live transactions; null until compliance approves one", default: null }

  - name: Cassette
    parent: null
    common_fields: true
    fields:
      - { name: atm_id, type: string, source: input, description: "FK -> ATM.id; the machine this cassette lives in" }
      - { name: position, type: enum, source: input, description: "C1 | C2 | C3 | C4 — physical cassette slot", constraints: "C1 | C2 | C3 | C4" }
      - { name: loaded_cents, type: integer, source: computed, default: 0, description: "Cash loaded into this cassette by the last LOADED replenishment; reduced to expected_remaining at recon close" }
      - { name: dispensed_cents, type: integer, source: computed, default: 0, description: "Sum of Transaction.amount_cents charged to this cassette since the last load" }
      - { name: balance_status, type: enum, source: computed, default: BALANCED, description: "BALANCED | OVER | SHORT — set at cash-count reconciliation from variance vs tolerance", constraints: "BALANCED | OVER | SHORT" }

  - name: ReplenishmentOrder
    parent: null
    common_fields: true
    fields:
      - { name: atm_id, type: string, source: input, description: "FK -> ATM.id; the machine to replenish" }
      - { name: route_id, type: string, source: input, description: "FK -> ArmoredRoute.id; the armored route fulfilling this order" }
      - { name: vault_id, type: string, source: system, description: "FK -> Vault.id; resolved from route.vault_id at dispatch; the vault cash is drawn from" }
      - { name: order_amount_cents, type: integer, source: input, description: "Cash amount to load; MUST be a multiple of the target ATM's note_denomination_cents" }
      - { name: forecast_basis, type: enum, source: input, default: FORWARD, description: "FORWARD | CHRONOLOGICAL — which cash-load forecast variant produced order_amount_cents", constraints: "FORWARD | CHRONOLOGICAL" }
      - { name: service_window_start, type: datetime, source: input, description: "Scheduled service window start (ISO 8601 UTC); half-open [start,end) on the route" }
      - { name: service_window_end, type: datetime, source: input, description: "Scheduled service window end (ISO 8601 UTC)" }
      - { name: status, type: enum, source: system, default: SCHEDULED, description: "SCHEDULED -> DISPATCHED -> LOADED -> SETTLED, or SCHEDULED/DISPATCHED -> RECALLED (compensation)", constraints: "SCHEDULED | DISPATCHED | LOADED | SETTLED | RECALLED" }
      - { name: expected_vault_version, type: integer, source: input, description: "OCC token: Vault.version the client last observed; checked on dispatch", default: null }

  - name: Transaction
    parent: null
    common_fields: false   # append-only event; only id + created_at
    fields:
      - { name: atm_id, type: string, source: input, description: "FK -> ATM.id; the machine the transaction occurred on" }
      - { name: cassette_id, type: string, source: system, description: "FK -> Cassette.id; the cassette charged for a WITHDRAWAL — the cassette with the smallest position in the order C1<C2<C3<C4 among those whose (loaded_cents - dispensed_cents) >= amount_cents; if no single cassette can cover it, charge the smallest-position cassette with (loaded_cents - dispensed_cents) > 0; null when the ATM has no cassette with positive remaining or for BALANCE_INQUIRY", default: null }
      - { name: kind, type: enum, source: input, description: "WITHDRAWAL | BALANCE_INQUIRY — only WITHDRAWAL earns surcharge/interchange and dispenses cash", constraints: "WITHDRAWAL | BALANCE_INQUIRY" }
      - { name: amount_cents, type: integer, source: input, default: 0, description: "Cash dispensed; multiple of ATM note_denomination_cents for WITHDRAWAL; 0 for BALANCE_INQUIRY" }
      - { name: surcharge_cents, type: integer, source: system, description: "Snapshot of ATM.surcharge_cents at transaction time (0 for BALANCE_INQUIRY)" }
      - { name: settlement_run_id, type: string, source: system, description: "FK -> SettlementRun.id; set when a settlement run sweeps this transaction; null until swept", default: null }
      - { name: monthly_seq, type: integer, source: system, description: "1-based cumulative monthly WITHDRAWAL sequence number on the ATM at the moment this txn posted; pins the interchange tier deterministically; null for BALANCE_INQUIRY", default: null }

  - name: CashCount
    parent: null
    common_fields: true
    fields:
      - { name: atm_id, type: string, source: input, description: "FK -> ATM.id; the machine being reconciled" }
      - { name: counted_cents, type: integer, source: input, description: "Physical cash counted in the machine by the field tech" }
      - { name: expected_remaining_cents, type: integer, source: computed, description: "loaded_cents - dispensed_cents_since_load at count time" }
      - { name: variance_cents, type: integer, source: computed, description: "counted_cents - expected_remaining_cents; negative = SHORT, positive = OVER" }
      - { name: outcome, type: enum, source: computed, description: "BALANCED | OVER | SHORT — |variance| <= tolerance_cents => BALANCED", constraints: "BALANCED | OVER | SHORT" }
      - { name: tolerance_cents, type: integer, source: input, default: 500, description: "Acceptable absolute variance for BALANCED" }

  - name: ServiceTicket
    parent: null
    common_fields: true
    fields:
      - { name: atm_id, type: string, source: input, description: "FK -> ATM.id; the faulted machine" }
      - { name: fault_kind, type: enum, source: input, description: "CASH_JAM | CARD_READER | NETWORK | DISPENSER — drives whether the ATM goes FAULTED or OUT_OF_SERVICE", constraints: "CASH_JAM | CARD_READER | NETWORK | DISPENSER" }
      - { name: severity, type: enum, source: input, default: MINOR, description: "MINOR | MAJOR — MAJOR forces ATM operational_status=OUT_OF_SERVICE; MINOR forces FAULTED", constraints: "MINOR | MAJOR" }
      - { name: status, type: enum, source: system, default: OPEN, description: "OPEN -> ACKNOWLEDGED -> RESOLVED, RESOLVED -> OPEN (reopen loop), OPEN/ACKNOWLEDGED -> CANCELLED", constraints: "OPEN | ACKNOWLEDGED | RESOLVED | CANCELLED" }
      - { name: reopen_count, type: integer, source: computed, default: 0, description: "Number of times this ticket has been reopened from RESOLVED" }
      - { name: assigned_tech_id, type: string, source: input, description: "X-User-ID of the FieldTech who acknowledges; null until ACKNOWLEDGED", default: null }

  - name: SettlementRun
    parent: null
    common_fields: true
    fields:
      - { name: atm_id, type: string, source: input, description: "FK -> ATM.id; the machine being settled" }
      - { name: window_start, type: datetime, source: input, description: "Settlement window start (ISO 8601 UTC), inclusive" }
      - { name: window_end, type: datetime, source: input, description: "Settlement window end (ISO 8601 UTC), exclusive" }
      - { name: withdrawal_count, type: integer, source: computed, description: "Count of WITHDRAWAL transactions swept in window (BALANCE_INQUIRY excluded)" }
      - { name: surcharge_revenue_cents, type: integer, source: computed, description: "Sum of surcharge_cents over swept withdrawals" }
      - { name: interchange_revenue_cents, type: integer, source: computed, description: "Tiered interchange total over swept withdrawals (by monthly_seq tier)" }
      - { name: network_fee_cents, type: integer, source: computed, description: "NETWORK_FEE_PER_WD_CENTS * withdrawal_count, subtracted from operator revenue" }
      - { name: net_operator_revenue_cents, type: integer, source: computed, description: "surcharge_revenue_cents + interchange_revenue_cents - network_fee_cents" }
      - { name: status, type: enum, source: system, default: DRAFT, description: "DRAFT -> SETTLED (terminal) — SETTLED is immutable and binds the swept transactions", constraints: "DRAFT | SETTLED" }

  - name: CommissionStatement
    parent: null
    common_fields: true
    fields:
      - { name: settlement_run_id, type: string, source: input, description: "FK -> SettlementRun.id; the settled run this commission derives from" }
      - { name: site_merchant_id, type: string, source: system, description: "FK -> SiteMerchant.id; resolved from the ATM's Location at generation" }
      - { name: pct_amount_cents, type: integer, source: computed, description: "floor(net_operator_revenue_cents * commission_pct_bps / 10000)" }
      - { name: flat_amount_cents, type: integer, source: computed, description: "commission_flat_per_wd_cents * withdrawal_count" }
      - { name: commission_cents, type: integer, source: computed, description: "Per commission_basis, then capped by remaining monthly ceiling; 0 if merchant SUSPENDED" }
      - { name: operator_keeps_cents, type: integer, source: computed, description: "net_operator_revenue_cents - commission_cents" }
      - { name: status, type: enum, source: system, default: ACCRUED, description: "ACCRUED -> PAID (terminal), or ACCRUED -> VOIDED", constraints: "ACCRUED | PAID | VOIDED" }

  - name: FeeDisclosure
    parent: null
    common_fields: true
    fields:
      - { name: atm_id, type: string, source: input, description: "FK -> ATM.id; the machine this disclosure governs" }
      - { name: disclosed_surcharge_cents, type: integer, source: input, description: "Surcharge amount printed on the on-screen/on-machine notice; MUST equal ATM.surcharge_cents at approval" }
      - { name: jurisdiction_code, type: enum, source: system, description: "Snapshot of the Location.jurisdiction_code; selects regulatory cap", constraints: "CA | NY | TX | FL" }
      - { name: regulatory_cap_cents, type: integer, source: computed, description: "Max surcharge for the jurisdiction; CA=300, NY=500, TX=275, FL=300" }
      - { name: ack_text_present, type: boolean, source: input, default: false, description: "Whether the mandatory consumer acknowledgement text is present on the notice" }
      - { name: status, type: enum, source: system, default: DRAFT, description: "DRAFT -> APPROVED (terminal-active) | REJECTED; superseded by a new APPROVED disclosure", constraints: "DRAFT | APPROVED | REJECTED" }

# =============================================================================
# §1.2 State Machine Table
# =============================================================================
state_machines:

  # ---- ATM: PARALLEL dimensions — operational_status × cash_status ----
  - entity: ATM
    dimension: operational_status
    initial_state: IN_SERVICE
    terminal_states: []
    transitions:
      - from: IN_SERVICE
        to: FAULTED
        trigger: "POST /service-tickets (severity=MINOR) [system, on ticket open]"
        actor: system
        preconditions:
          - "Target ATM exists"
        side_effects:
          - "ATM.operational_status := FAULTED"
        note: "Cash_status is untouched — a FAULTED machine can still be LOADED."
      - from: IN_SERVICE
        to: OUT_OF_SERVICE
        trigger: "POST /service-tickets (severity=MAJOR) [system, on ticket open]"
        actor: system
        preconditions:
          - "Target ATM exists"
        side_effects:
          - "ATM.operational_status := OUT_OF_SERVICE"
      - from: FAULTED
        to: OUT_OF_SERVICE
        trigger: "POST /service-tickets (severity=MAJOR) on an already-FAULTED ATM"
        actor: system
        preconditions: []
        side_effects:
          - "ATM.operational_status := OUT_OF_SERVICE"
      - from: FAULTED
        to: IN_SERVICE
        trigger: "POST /service-tickets/{id}/resolve (last open ticket on ATM closes)"
        actor: system
        preconditions:
          - "No other ServiceTicket on this ATM is in {OPEN, ACKNOWLEDGED}"
        side_effects:
          - "ATM.operational_status := IN_SERVICE"
      - from: OUT_OF_SERVICE
        to: IN_SERVICE
        trigger: "POST /service-tickets/{id}/resolve (last open ticket on ATM closes)"
        actor: system
        preconditions:
          - "No other ServiceTicket on this ATM is in {OPEN, ACKNOWLEDGED}"
        side_effects:
          - "ATM.operational_status := IN_SERVICE"

  - entity: ATM
    dimension: cash_status
    initial_state: EMPTY
    terminal_states: []
    transitions:
      - from: EMPTY
        to: AWAITING_LOAD
        trigger: "POST /replenishment-orders/{id}/dispatch"
        actor: VaultController
        preconditions:
          - "A ReplenishmentOrder for this ATM moves to DISPATCHED"
        side_effects:
          - "ATM.cash_status := AWAITING_LOAD"
      - from: LOW
        to: AWAITING_LOAD
        trigger: "POST /replenishment-orders/{id}/dispatch"
        actor: VaultController
        preconditions:
          - "A ReplenishmentOrder for this ATM moves to DISPATCHED"
        side_effects:
          - "ATM.cash_status := AWAITING_LOAD"
      - from: AWAITING_LOAD
        to: LOADED
        trigger: "POST /replenishment-orders/{id}/confirm-load"
        actor: FieldTech
        preconditions:
          - "Order is DISPATCHED"
          - "ATM.operational_status != OUT_OF_SERVICE (ERR_ATM_OUT_OF_SERVICE)"
        side_effects:
          - "ATM.cash_status := LOADED"
          - "Cassettes for ATM get loaded_cents distributed; ATM.loaded_cents recomputed"
          - "ATM.dispensed_cents_since_load := 0"
      - from: LOADED
        to: LOW
        trigger: "POST /atms/{id}/transactions (WITHDRAWAL) [system, when remaining <= low watermark]"
        actor: system
        preconditions:
          - "loaded_cents - dispensed_cents_since_load <= LOW_WATERMARK_CENTS (LOW_WATERMARK_CENTS = 2000000, i.e. $20,000)"
        side_effects:
          - "ATM.cash_status := LOW"
        note: "Only fires from cash_status LOADED. A withdrawal on an EMPTY/AWAITING_LOAD ATM posts but does not change cash_status."
      - from: LOADED
        to: RECONCILING
        trigger: "POST /atms/{id}/cash-counts"
        actor: FieldTech
        preconditions:
          - "ATM.cash_status IN {LOADED, LOW}"
        side_effects:
          - "ATM.cash_status := RECONCILING"
      - from: LOW
        to: RECONCILING
        trigger: "POST /atms/{id}/cash-counts"
        actor: FieldTech
        preconditions:
          - "ATM.cash_status IN {LOADED, LOW}"
        side_effects:
          - "ATM.cash_status := RECONCILING"
      - from: RECONCILING
        to: EMPTY
        trigger: "POST /atms/{id}/cash-counts/{cc_id}/close-out"
        actor: FieldTech
        preconditions:
          - "A CashCount exists for this ATM in RECONCILING"
        side_effects:
          - "Cassette.loaded_cents := expected_remaining; Cassette.dispensed_cents := 0"
          - "ATM.cash_status := EMPTY"
          - "The LOADED ReplenishmentOrder for this ATM moves to SETTLED; Vault.in_machine_cents decremented"

  # ---- ReplenishmentOrder: BRANCHING with revert (compensation) ----
  - entity: ReplenishmentOrder
    initial_state: SCHEDULED
    terminal_states: [SETTLED, RECALLED]
    transitions:
      - from: SCHEDULED
        to: DISPATCHED
        trigger: "POST /replenishment-orders/{id}/dispatch"
        actor: VaultController
        preconditions:
          - "ArmoredRoute.status == ACTIVE (ERR_ROUTE_PAUSED)"
          - "order_amount_cents % ATM.note_denomination_cents == 0 (ERR_AMOUNT_NOT_DENOMINATED)"
          - "Vault.balance_cents >= order_amount_cents (ERR_VAULT_INSUFFICIENT)"
          - "No service-window overlap with another non-terminal order on the same route (ERR_ROUTE_WINDOW_CONFLICT)"
          - "No replenishment-window collision on the same ATM within buffer (ERR_ATM_SERVICE_LOCKOUT)"
          - "expected_vault_version matches Vault.version (ERR_STALE_VERSION)"
        side_effects:
          - "vault_id := route.vault_id"
          - "Vault.balance_cents -= order_amount_cents; Vault.in_transit_cents += order_amount_cents"
          - "Vault.version += 1"
          - "ATM.cash_status -> AWAITING_LOAD"
      - from: DISPATCHED
        to: LOADED
        trigger: "POST /replenishment-orders/{id}/confirm-load"
        actor: FieldTech
        preconditions:
          - "ATM.operational_status != OUT_OF_SERVICE (ERR_ATM_OUT_OF_SERVICE)"
        side_effects:
          - "Vault.in_transit_cents -= order_amount_cents; Vault.in_machine_cents += order_amount_cents"
          - "Cassettes loaded; ATM.loaded_cents, ATM.dispensed_cents_since_load reset; ATM.cash_status -> LOADED"
      - from: LOADED
        to: SETTLED
        trigger: "POST /atms/{id}/cash-counts/{cc_id}/close-out [system, cascade]"
        actor: system
        preconditions:
          - "Owning ATM transitions RECONCILING -> EMPTY"
        side_effects:
          - "Vault.in_machine_cents -= order_amount_cents"
        note: "Terminal. Cash is now reconciled out of vault custody (it was dispensed/returned)."
      - from: SCHEDULED
        to: RECALLED
        trigger: "POST /replenishment-orders/{id}/recall"
        actor: VaultController
        preconditions:
          - "Order is SCHEDULED (no vault debit yet)"
        side_effects:
          - "ATM.cash_status reverts to prior (EMPTY or LOW) if it was AWAITING_LOAD for this order"
      - from: DISPATCHED
        to: RECALLED
        trigger: "POST /replenishment-orders/{id}/recall"
        actor: VaultController
        preconditions:
          - "Order is DISPATCHED (cash in transit, not yet loaded)"
        side_effects:
          - "Vault.balance_cents += order_amount_cents; Vault.in_transit_cents -= order_amount_cents (compensation — vault conservation restored)"
          - "Vault.version += 1"
          - "ATM.cash_status reverts to EMPTY (or LOW) from AWAITING_LOAD"

  # ---- ServiceTicket: CYCLIC (reopen loop) ----
  - entity: ServiceTicket
    initial_state: OPEN
    terminal_states: [CANCELLED]
    transitions:
      - from: OPEN
        to: ACKNOWLEDGED
        trigger: "POST /service-tickets/{id}/acknowledge"
        actor: FieldTech
        preconditions:
          - "Ticket is OPEN"
        side_effects:
          - "assigned_tech_id := X-User-ID of acting FieldTech"
      - from: ACKNOWLEDGED
        to: RESOLVED
        trigger: "POST /service-tickets/{id}/resolve"
        actor: FieldTech
        preconditions:
          - "Ticket is ACKNOWLEDGED"
          - "Acting tech is the assigned_tech_id (ERR_NOT_TICKET_OWNER)"
        side_effects:
          - "If no other OPEN/ACKNOWLEDGED ticket on the ATM remains, ATM.operational_status -> IN_SERVICE"
      - from: RESOLVED
        to: OPEN
        trigger: "POST /service-tickets/{id}/reopen"
        actor: FieldTech
        preconditions:
          - "Ticket is RESOLVED"
        side_effects:
          - "reopen_count += 1"
          - "ATM.operational_status -> FAULTED (MINOR) or OUT_OF_SERVICE (MAJOR) again"
      - from: OPEN
        to: CANCELLED
        trigger: "POST /service-tickets/{id}/cancel"
        actor: FieldTech
        preconditions:
          - "Ticket is OPEN or ACKNOWLEDGED"
        side_effects:
          - "If no other OPEN/ACKNOWLEDGED ticket on the ATM remains, ATM.operational_status -> IN_SERVICE"
      - from: ACKNOWLEDGED
        to: CANCELLED
        trigger: "POST /service-tickets/{id}/cancel"
        actor: FieldTech
        preconditions:
          - "Ticket is OPEN or ACKNOWLEDGED"
        side_effects:
          - "If no other OPEN/ACKNOWLEDGED ticket on the ATM remains, ATM.operational_status -> IN_SERVICE"

  # ---- SettlementRun: LINEAR ----
  - entity: SettlementRun
    initial_state: DRAFT
    terminal_states: [SETTLED]
    transitions:
      - from: DRAFT
        to: SETTLED
        trigger: "POST /settlement-runs/{id}/settle"
        actor: SettlementOfficer
        preconditions:
          - "ATM has an APPROVED FeeDisclosure (ERR_NO_FEE_DISCLOSURE)"
          - "No swept WITHDRAWAL transaction already bound to another SettlementRun (ERR_TXN_ALREADY_SETTLED)"
        side_effects:
          - "Sweep WITHDRAWAL txns in [window_start, window_end); compute surcharge/interchange/network/net (§1.3)"
          - "Each swept Transaction.settlement_run_id := this run"
          - "A CommissionStatement is generated (ACCRUED) for the site merchant (§1.3 commission split)"

  # ---- CommissionStatement: BRANCHING ----
  - entity: CommissionStatement
    initial_state: ACCRUED
    terminal_states: [PAID, VOIDED]
    transitions:
      - from: ACCRUED
        to: PAID
        trigger: "POST /commission-statements/{id}/pay"
        actor: SettlementOfficer
        preconditions:
          - "SiteMerchant.payout_status == ACTIVE (ERR_MERCHANT_SUSPENDED)"
        side_effects:
          - "status := PAID"
      - from: ACCRUED
        to: VOIDED
        trigger: "POST /commission-statements/{id}/void"
        actor: SettlementOfficer
        preconditions:
          - "Statement is ACCRUED"
        side_effects:
          - "status := VOIDED; the month-to-date commission paid for the merchant is reduced by commission_cents (frees ceiling headroom)"

  # ---- FeeDisclosure: BRANCHING ----
  - entity: FeeDisclosure
    initial_state: DRAFT
    terminal_states: [REJECTED]
    transitions:
      - from: DRAFT
        to: APPROVED
        trigger: "POST /fee-disclosures/{id}/approve"
        actor: ComplianceOfficer
        preconditions:
          - "disclosed_surcharge_cents == ATM.surcharge_cents (ERR_DISCLOSURE_MISMATCH)"
          - "disclosed_surcharge_cents <= regulatory_cap_cents (ERR_SURCHARGE_CAP_EXCEEDED)"
          - "ack_text_present == true (ERR_ACK_TEXT_MISSING)"
        side_effects:
          - "status := APPROVED"
          - "Any previously APPROVED FeeDisclosure for this ATM moves to REJECTED (superseded)"
          - "ATM.fee_disclosure_id := this disclosure"
      - from: DRAFT
        to: REJECTED
        trigger: "POST /fee-disclosures/{id}/reject"
        actor: ComplianceOfficer
        preconditions:
          - "Disclosure is DRAFT"
        side_effects:
          - "status := REJECTED"

# -----------------------------------------------------------------------------
# §1.2.1 Concurrency Rules
# -----------------------------------------------------------------------------
concurrency_rules:
  - rule_id: dispatch-stale-vault
    parent_entity: Vault
    write_endpoint: "POST /replenishment-orders/{id}/dispatch"
    occ_field: "expected_vault_version"
    description: |
      Dispatching a ReplenishmentOrder against a Vault whose version has
      advanced since the client last observed it is rejected. This captures the
      case where another dispatch (or a recall compensation) has already
      debited/credited the same vault and changed its balance, so the current
      writer's view of available vault cash is stale. Both dispatches debit the
      same shared vault and would each legitimately succeed against the version
      the client read, so OCC on Vault.version serializes them deterministically.
    error_id: ERR_STALE_VERSION
    http_status: 412

# =============================================================================
# §1.3 Calculation Rules Table
# =============================================================================
calculations:

  # ---- DUAL-VARIANT calc #1 (forecast on the cash-logistics domain) ----
  - name: cash_load_forecast
    trigger: "GET /atms/{id}/forecast?basis=FORWARD|CHRONOLOGICAL (read-only projection)"
    algorithm: forward_looking
    formula: |
      raw_cents = avg_daily_dispense_cents * days_until_next_visit * SAFETY_FACTOR
      forecast_cents = ceil(raw_cents / atm.note_denomination_cents) * atm.note_denomination_cents
      # avg_daily_dispense_cents depends on the variant (see variants).
      # days_until_next_visit is supplied as a query param (integer >= 1).
    input_set: "WITHDRAWAL transactions on the ATM; window depends on variant."
    constants:
      SAFETY_FACTOR: 1.25
    precision: "integer cents; note rounding is ceil() to note_denomination_cents multiple"
    variants:
      - name: forward
        when: "basis=FORWARD"
        difference: |
          avg_daily_dispense_cents = (sum of WITHDRAWAL amount_cents with created_at in
          the half-open window [clock_now - 14*86400s, clock_now)) / 14 (fixed divisor 14).
          Includes ALL withdrawals in the 14-day window regardless of replenishment
          boundaries (forward-looking steady-state estimate).
      - name: chronological
        when: "basis=CHRONOLOGICAL"
        difference: |
          avg_daily_dispense_cents = (sum of WITHDRAWAL amount_cents since the most
          recent LOADED replenishment confirm-load timestamp) / days_elapsed, where
          days_elapsed = max(1, floor((clock_now - last_confirm_load_at) / 86400 seconds)).
          Only post-last-load actuals count, processed in chronological order from the
          load event. Diverges from forward when recent usage differs from the
          trailing-14-day average. If the ATM has never been LOADED, CHRONOLOGICAL
          falls back to the FORWARD computation.

  # ---- COMBINATORIAL calc mode (a): settlement net operator revenue (>=3 inputs,
  #      tiered-rate selection, conditional branch on txn kind) ----
  - name: settlement_net_operator_revenue
    trigger: "POST /settlement-runs/{id}/settle (transition SettlementRun DRAFT->SETTLED)"
    algorithm: tiered_pricing
    formula: |
      swept = WITHDRAWAL Transactions T with T.atm_id == run.atm_id
              AND T.created_at in [window_start, window_end)
              AND T.settlement_run_id is null   # not already settled
      withdrawal_count       = count(swept)
      surcharge_revenue_cents = sum(T.surcharge_cents for T in swept)
      interchange_revenue_cents = sum(interchange_rate(T.monthly_seq) for T in swept)
      network_fee_cents      = NETWORK_FEE_PER_WD_CENTS * withdrawal_count
      net_operator_revenue_cents = surcharge_revenue_cents
                                   + interchange_revenue_cents
                                   - network_fee_cents
      # interchange_rate is MARGINAL by the txn's own cumulative monthly seq:
      #   monthly_seq 1..500     -> TIER1_CENTS (35)
      #   monthly_seq 501..2000  -> TIER2_CENTS (42)
      #   monthly_seq 2001..      -> TIER3_CENTS (50)
    input_set: "Only WITHDRAWAL txns in the half-open window not already swept by another run. BALANCE_INQUIRY excluded."
    constants:
      TIER1_CENTS: 35
      TIER2_CENTS: 42
      TIER3_CENTS: 50
      TIER1_MAX_SEQ: 500
      TIER2_MAX_SEQ: 2000
      NETWORK_FEE_PER_WD_CENTS: 8
    precision: "integer cents; no rounding (all per-txn integers summed)"

  # ---- DUAL-VARIANT calc #2 partner / COMBINATORIAL mode (c): commission split
  #      (evaluation order pinned: net_operator_revenue MUST be computed first,
  #      then pct vs flat, then ceiling cap which depends on month-to-date) ----
  - name: commission_split
    trigger: "POST /settlement-runs/{id}/settle (cascade — generates CommissionStatement, ACCRUED)"
    algorithm: waterfall_allocation
    formula: |
      # STEP 1 (must precede STEP 2): obtain net_operator_revenue_cents from the
      # just-completed settlement_net_operator_revenue calc on the same run.
      pct_amount_cents  = floor(net_operator_revenue_cents * merchant.commission_pct_bps / 10000)
      flat_amount_cents = merchant.commission_flat_per_wd_cents * run.withdrawal_count
      # STEP 2: select base per commission_basis
      base = (commission_basis == GREATER_OF) ? max(pct_amount_cents, flat_amount_cents)
           : (commission_basis == PCT_ONLY)   ? pct_amount_cents
           :                                     flat_amount_cents
      # STEP 3: ceiling cap (month-to-date dependent — evaluation order matters)
      # "same calendar month" is keyed on the CommissionStatement.created_at month
      # (i.e. the logical-clock month at the moment the statement was generated),
      # NOT on the settlement window. Two statements generated in the same clock
      # month share one ceiling regardless of their sweep windows.
      mtd_paid = sum(commission_cents of ACCRUED+PAID CommissionStatements for this
                     merchant whose created_at is in the same calendar month as this
                     statement, excluding VOIDED, excluding this statement)
      remaining = max(0, merchant.commission_monthly_ceiling_cents - mtd_paid)
      commission_cents = (merchant.payout_status == SUSPENDED) ? 0 : min(base, remaining)
      operator_keeps_cents = net_operator_revenue_cents - commission_cents
    input_set: "Net operator revenue from the owning run; merchant contract; month-to-date commission for ceiling."
    constants:
      BPS_DENOMINATOR: 10000
    precision: "integer cents; pct uses floor() before max/cap"
    variants:
      - name: greater_of
        when: "commission_basis == GREATER_OF"
        difference: "base = max(pct_amount_cents, flat_amount_cents)."
      - name: pct_only
        when: "commission_basis == PCT_ONLY"
        difference: "base = pct_amount_cents; flat ignored even if larger."

  # ---- COMBINATORIAL helper / reconciliation: cassette balance & variance ----
  - name: cash_count_reconciliation
    trigger: "POST /atms/{id}/cash-counts (transition ATM cash_status LOADED/LOW -> RECONCILING)"
    algorithm: aggregation
    formula: |
      expected_remaining_cents = atm.loaded_cents - atm.dispensed_cents_since_load
      variance_cents = counted_cents - expected_remaining_cents
      outcome = (abs(variance_cents) <= tolerance_cents) ? BALANCED
              : (variance_cents > 0) ? OVER : SHORT
      # Side effect on close-out: each Cassette.loaded_cents := its expected
      # remaining (loaded_cents - dispensed_cents); dispensed_cents := 0.
    input_set: "ATM loaded_cents and dispensed_cents_since_load at count time; tolerance from the count."
    constants:
      DEFAULT_TOLERANCE_CENTS: 500
    precision: "integer cents; comparison is <= (inclusive) for BALANCED"

  # ---- Vault conservation (compensating invariant — conserved quantity) ----
  - name: vault_cash_position
    trigger: "Recomputed after dispatch, confirm-load, recall, and recon close-out."
    algorithm: aggregation
    formula: |
      in_transit_cents = sum(order_amount_cents for orders in DISPATCHED on this vault)
      in_machine_cents = sum(order_amount_cents for orders in LOADED on this vault)
      balance_cents    = provisioned_cents - in_transit_cents - in_machine_cents
      # INVARIANT (conserved): balance_cents + in_transit_cents + in_machine_cents
      #                        == provisioned_cents  at all times.
    input_set: "All ReplenishmentOrders drawing on the vault, filtered by status DISPATCHED / LOADED."
    constants: {}
    precision: "integer cents; exact"

# =============================================================================
# §1.4 Validation Rules Table (ordered by priority)
# =============================================================================
validations:
  - priority: 1
    category: auth
    check: "X-User-Role and X-User-ID headers present"
    error_id: ERR_UNAUTHENTICATED
    http_status: 401
    applies_to: "all except POST /_clock/set_current_utc public reads? no — all"

  - priority: 2
    category: auth
    check: "Acting role is permitted for the operation per §1.7 RBAC"
    error_id: ERR_FORBIDDEN_ROLE
    http_status: 403
    applies_to: "all mutating endpoints"

  - priority: 3
    category: existence
    check: "Every path/body referenced resource exists (validated left-to-right in path, then body FKs)"
    error_id: ERR_NOT_FOUND
    http_status: 404
    applies_to: "all endpoints with ids"

  - priority: 4
    category: business_constraint
    check: "Required body fields present and well-typed; enum members valid"
    error_id: ERR_INVALID_REQUEST
    http_status: 422
    applies_to: "all POST/PUT/PATCH"

  - priority: 5
    category: business_constraint
    check: "ATM.serial_no unique across all ATMs"
    error_id: ERR_DUPLICATE_SERIAL
    http_status: 409
    applies_to: "POST /atms"

  - priority: 6
    category: state
    check: "Target entity is in a state from which the requested transition is defined (§1.2)"
    error_id: ERR_INVALID_STATE
    http_status: 409
    applies_to: "all transition endpoints"

  - priority: 7
    category: business_referential
    check: "Acting FieldTech on resolve/reopen is the ticket's assigned_tech_id"
    error_id: ERR_NOT_TICKET_OWNER
    http_status: 403
    applies_to: "POST /service-tickets/{id}/resolve"

  - priority: 8
    category: business_safety
    check: "FeeDisclosure surcharge cap: disclosed_surcharge_cents <= regulatory_cap_cents for the jurisdiction"
    error_id: ERR_SURCHARGE_CAP_EXCEEDED
    http_status: 422
    applies_to: "POST /fee-disclosures/{id}/approve"

  - priority: 9
    category: business_safety
    check: "FeeDisclosure consumer acknowledgement text present (ack_text_present == true)"
    error_id: ERR_ACK_TEXT_MISSING
    http_status: 422
    applies_to: "POST /fee-disclosures/{id}/approve"

  - priority: 10
    category: business_safety
    check: "FeeDisclosure disclosed_surcharge_cents equals the ATM's current surcharge_cents"
    error_id: ERR_DISCLOSURE_MISMATCH
    http_status: 422
    applies_to: "POST /fee-disclosures/{id}/approve"

  - priority: 11
    category: business_safety
    check: "Live WITHDRAWAL requires the ATM to have an APPROVED FeeDisclosure (fee_disclosure_id set)"
    error_id: ERR_NO_FEE_DISCLOSURE
    http_status: 422
    applies_to: "POST /atms/{id}/transactions, POST /settlement-runs/{id}/settle"

  - priority: 12
    category: state
    check: "confirm-load requires ATM.operational_status != OUT_OF_SERVICE"
    error_id: ERR_ATM_OUT_OF_SERVICE
    http_status: 409
    applies_to: "POST /replenishment-orders/{id}/confirm-load"

  - priority: 13
    category: business_constraint
    check: "ArmoredRoute.status == ACTIVE on dispatch"
    error_id: ERR_ROUTE_PAUSED
    http_status: 409
    applies_to: "POST /replenishment-orders/{id}/dispatch"

  - priority: 14
    category: business_constraint
    check: "order_amount_cents (and WITHDRAWAL amount_cents) is a multiple of ATM.note_denomination_cents"
    error_id: ERR_AMOUNT_NOT_DENOMINATED
    http_status: 422
    applies_to: "POST /replenishment-orders/{id}/dispatch, POST /atms/{id}/transactions"

  - priority: 15
    category: business_temporal
    check: "Route service-window HALF-OPEN [start,end): this order's window must not overlap the [start,end) window of any other COMMITTED order (status in {DISPATCHED, LOADED}) on the SAME route. SCHEDULED orders do not reserve the window. Two half-open intervals overlap iff this.start < other.end AND other.start < this.end; touching endpoints (this.start == other.end) do NOT overlap and are allowed. No buffer."
    error_id: ERR_ROUTE_WINDOW_CONFLICT
    http_status: 409
    applies_to: "POST /replenishment-orders/{id}/dispatch"

  - priority: 16
    category: business_temporal
    check: "ATM replenishment lockout: target ATM has no other COMMITTED order (status in {DISPATCHED, LOADED}) whose [start,end] CLOSED interval, expanded by ATM_BUFFER_MIN=30 minutes on each side, intersects this order's closed interval. SCHEDULED orders do not lock the ATM. Adjacency (this.start == other.end) collides because the 30-min buffer overlaps; only gaps strictly greater than 30 minutes are allowed."
    error_id: ERR_ATM_SERVICE_LOCKOUT
    http_status: 409
    applies_to: "POST /replenishment-orders/{id}/dispatch"

  - priority: 17
    category: business_fiscal
    check: "Vault.balance_cents >= order_amount_cents on dispatch"
    error_id: ERR_VAULT_INSUFFICIENT
    http_status: 422
    applies_to: "POST /replenishment-orders/{id}/dispatch"

  - priority: 18
    category: business_fiscal
    check: "No swept WITHDRAWAL transaction is already bound to another SettlementRun"
    error_id: ERR_TXN_ALREADY_SETTLED
    http_status: 409
    applies_to: "POST /settlement-runs/{id}/settle"

  - priority: 19
    category: business_constraint
    check: "Commission pay requires SiteMerchant.payout_status == ACTIVE"
    error_id: ERR_MERCHANT_SUSPENDED
    http_status: 409
    applies_to: "POST /commission-statements/{id}/pay"

  - priority: 20
    category: state
    check: "OCC: expected_vault_version matches current Vault.version on dispatch"
    error_id: ERR_STALE_VERSION
    http_status: 412
    applies_to: "POST /replenishment-orders/{id}/dispatch"

# =============================================================================
# §1.5 API Endpoint Table
# =============================================================================
endpoints:

  # ---- config / provisioning ----
  - method: POST
    path: "/site-merchants"
    description: "Create a site-merchant commission contract holder"
    roles: [PlatformAdmin]
    code: 201
    input: ["legal_name", "commission_pct_bps", "commission_flat_per_wd_cents", "commission_monthly_ceiling_cents", "commission_basis?"]
    output: SiteMerchant
    side_effects: []

  - method: GET
    path: "/site-merchants/{id}"
    description: "Read a site merchant"
    roles: [PlatformAdmin, SettlementOfficer]
    code: 200
    input: []
    output: SiteMerchant
    side_effects: []

  - method: POST
    path: "/site-merchants/{id}/suspend"
    description: "Suspend a merchant's payout (sets payout_status=SUSPENDED)"
    roles: [PlatformAdmin]
    code: 200
    input: []
    output: SiteMerchant
    side_effects: ["SiteMerchant.payout_status := SUSPENDED"]

  - method: POST
    path: "/vaults"
    description: "Create a cash vault with a provisioned baseline"
    roles: [PlatformAdmin]
    code: 201
    input: [name, provisioned_cents]
    output: Vault
    side_effects: ["balance_cents := provisioned_cents; in_transit_cents := 0; in_machine_cents := 0"]

  - method: GET
    path: "/vaults/{id}"
    description: "Read a vault including derived balance/in_transit/in_machine and version"
    roles: [PlatformAdmin, VaultController]
    code: 200
    input: []
    output: Vault
    side_effects: []

  - method: POST
    path: "/routes"
    description: "Create an armored route bound to a vault"
    roles: [PlatformAdmin]
    code: 201
    input: [carrier_name, vault_id]
    output: ArmoredRoute
    side_effects: []

  - method: POST
    path: "/routes/{id}/pause"
    description: "Pause an armored route (rejects new dispatch)"
    roles: [PlatformAdmin, VaultController]
    code: 200
    input: []
    output: ArmoredRoute
    side_effects: ["ArmoredRoute.status := PAUSED"]

  - method: GET
    path: "/routes/{id}"
    description: "Read an armored route"
    roles: [PlatformAdmin, VaultController]
    code: 200
    input: []
    output: ArmoredRoute
    side_effects: []

  - method: GET
    path: "/routes"
    description: "List armored routes; filter by vault_id (reverse-reachability for ArmoredRoute.vault_id)"
    roles: [PlatformAdmin, VaultController]
    code: 200
    input: ["vault_id?", "limit?", "offset?"]
    output: ArmoredRoute[]
    side_effects: []

  - method: POST
    path: "/locations"
    description: "Create a host site, bound to a merchant and route"
    roles: [PlatformAdmin]
    code: 201
    input: [name, jurisdiction_code, site_merchant_id, route_id, address]
    output: Location
    side_effects: []

  - method: GET
    path: "/locations/{id}"
    description: "Read a location"
    roles: [PlatformAdmin, SettlementOfficer]
    code: 200
    input: []
    output: Location
    side_effects: []

  - method: GET
    path: "/locations"
    description: "List locations; filter by site_merchant_id or route_id (reverse-reachability for Location.site_merchant_id and Location.route_id)"
    roles: [PlatformAdmin, SettlementOfficer]
    code: 200
    input: ["site_merchant_id?", "route_id?", "limit?", "offset?"]
    output: Location[]
    side_effects: []

  # ---- ATM lifecycle ----
  - method: POST
    path: "/atms"
    description: "Provision an ATM at a location"
    roles: [PlatformAdmin]
    code: 201
    input: ["serial_no", "location_id", "surcharge_cents", "note_denomination_cents?"]
    output: ATM
    side_effects: ["cash_status := EMPTY; operational_status := IN_SERVICE"]

  - method: GET
    path: "/atms/{id}"
    description: "Read an ATM with all computed fields (monthly_wd_count, loaded_cents, dispensed_cents_since_load, both status dimensions)"
    roles: [PlatformAdmin, FieldTech, SettlementOfficer, VaultController, ComplianceOfficer]
    code: 200
    input: []
    output: ATM
    side_effects: []

  - method: GET
    path: "/atms"
    description: "List ATMs; filter by location_id or fee_disclosure_id (reverse-reachability for ATM.location_id and ATM.fee_disclosure_id)"
    roles: [PlatformAdmin, FieldTech, SettlementOfficer]
    code: 200
    input: ["location_id?", "fee_disclosure_id?", "limit?", "offset?"]
    output: ATM[]
    side_effects: []

  - method: GET
    path: "/atms/{id}/forecast"
    description: "Compute the cash-load forecast for the ATM under the chosen variant (read-only)"
    roles: [PlatformAdmin, VaultController, FieldTech]
    code: 200
    input: ["basis?", "days_until_next_visit"]
    output: "{ forecast_cents: integer, avg_daily_dispense_cents: integer, basis: string }"
    side_effects: []

  - method: POST
    path: "/atms/{id}/cassettes"
    description: "Add a cassette slot to an ATM"
    roles: [PlatformAdmin, FieldTech]
    code: 201
    input: [position]
    output: Cassette
    side_effects: []

  - method: GET
    path: "/atms/{id}/cassettes"
    description: "List cassettes for an ATM (reverse-reachability for Cassette.atm_id)"
    roles: [PlatformAdmin, FieldTech, SettlementOfficer]
    code: 200
    input: []
    output: Cassette[]
    side_effects: []

  - method: POST
    path: "/atms/{id}/transactions"
    description: "Post a transaction (WITHDRAWAL or BALANCE_INQUIRY) to the ATM"
    roles: [PlatformAdmin, FieldTech]
    code: 201
    input: ["kind", "amount_cents?"]
    output: Transaction
    side_effects:
      - "For WITHDRAWAL: surcharge_cents snapshot; monthly_seq assigned (ATM.monthly_wd_count+1); monthly_wd_count++; charged to lowest-position non-empty cassette; dispensed_cents_since_load += amount; cassette.dispensed_cents += amount"
      - "If remaining <= LOW_WATERMARK_CENTS, ATM.cash_status -> LOW"

  - method: GET
    path: "/atms/{id}/transactions"
    description: "List transactions for an ATM (reverse-reachability for Transaction.atm_id); filter by kind"
    roles: [PlatformAdmin, FieldTech, SettlementOfficer]
    code: 200
    input: ["kind?", "limit?", "offset?"]
    output: Transaction[]
    side_effects: []

  - method: GET
    path: "/transactions/{id}"
    description: "Read a single transaction"
    roles: [PlatformAdmin, FieldTech, SettlementOfficer]
    code: 200
    input: []
    output: Transaction
    side_effects: []

  - method: GET
    path: "/transactions"
    description: "List transactions; filter by cassette_id or settlement_run_id (reverse-reachability for Transaction.cassette_id and Transaction.settlement_run_id) or atm_id/kind"
    roles: [PlatformAdmin, FieldTech, SettlementOfficer]
    code: 200
    input: ["atm_id?", "cassette_id?", "settlement_run_id?", "kind?", "limit?", "offset?"]
    output: Transaction[]
    side_effects: []

  # ---- replenishment ----
  - method: POST
    path: "/replenishment-orders"
    description: "Schedule a replenishment order for an ATM on a route"
    roles: [VaultController, PlatformAdmin]
    code: 201
    input: ["atm_id", "route_id", "order_amount_cents", "service_window_start", "service_window_end", "forecast_basis?"]
    output: ReplenishmentOrder
    side_effects: ["status := SCHEDULED"]

  - method: GET
    path: "/replenishment-orders/{id}"
    description: "Read a replenishment order"
    roles: [PlatformAdmin, VaultController, FieldTech]
    code: 200
    input: []
    output: ReplenishmentOrder
    side_effects: []

  - method: GET
    path: "/replenishment-orders"
    description: "List replenishment orders; filter by atm_id, route_id, or vault_id"
    roles: [PlatformAdmin, VaultController, FieldTech]
    code: 200
    input: ["atm_id?", "route_id?", "vault_id?", "limit?", "offset?"]
    output: ReplenishmentOrder[]
    side_effects: []

  - method: POST
    path: "/replenishment-orders/{id}/dispatch"
    description: "Dispatch (SCHEDULED->DISPATCHED): OCC-checked vault debit, route/window/lockout/denomination/balance checks"
    roles: [VaultController]
    code: 200
    input: [expected_vault_version]
    output: ReplenishmentOrder
    side_effects:
      - "vault_id := route.vault_id; Vault.balance_cents -= order_amount_cents; Vault.in_transit_cents += order_amount_cents; Vault.version += 1"
      - "ATM.cash_status -> AWAITING_LOAD"

  - method: POST
    path: "/replenishment-orders/{id}/confirm-load"
    description: "Field tech confirms cash loaded (DISPATCHED->LOADED)"
    roles: [FieldTech]
    code: 200
    input: ["cassette_allocations?"]
    output: ReplenishmentOrder
    side_effects:
      - "Vault.in_transit_cents -= order_amount_cents; Vault.in_machine_cents += order_amount_cents"
      - "Cassettes loaded; ATM.loaded_cents recomputed; ATM.dispensed_cents_since_load := 0; ATM.cash_status -> LOADED"

  - method: POST
    path: "/replenishment-orders/{id}/recall"
    description: "Recall an order (SCHEDULED/DISPATCHED -> RECALLED); compensates vault on DISPATCHED"
    roles: [VaultController]
    code: 200
    input: []
    output: ReplenishmentOrder
    side_effects:
      - "If DISPATCHED: Vault.balance_cents += order_amount_cents; Vault.in_transit_cents -= order_amount_cents; Vault.version += 1"
      - "ATM.cash_status reverts AWAITING_LOAD -> EMPTY/LOW"

  # ---- reconciliation ----
  - method: POST
    path: "/atms/{id}/cash-counts"
    description: "Open a cash count (LOADED/LOW -> RECONCILING); computes expected/variance/outcome"
    roles: [FieldTech]
    code: 201
    input: ["counted_cents", "tolerance_cents?"]
    output: CashCount
    side_effects:
      - "ATM.cash_status -> RECONCILING; CashCount.expected_remaining_cents, variance_cents, outcome computed; Cassette.balance_status set"

  - method: GET
    path: "/atms/{id}/cash-counts"
    description: "List cash counts for an ATM (reverse-reachability for CashCount.atm_id)"
    roles: [PlatformAdmin, FieldTech, SettlementOfficer]
    code: 200
    input: ["limit?", "offset?"]
    output: CashCount[]
    side_effects: []

  - method: POST
    path: "/atms/{id}/cash-counts/{cc_id}/close-out"
    description: "Close reconciliation (RECONCILING -> EMPTY); settles the LOADED order, frees vault in_machine"
    roles: [FieldTech]
    code: 200
    input: []
    output: CashCount
    side_effects:
      - "Cassette.loaded_cents := expected_remaining; dispensed_cents := 0; ATM.cash_status -> EMPTY"
      - "Owning LOADED ReplenishmentOrder -> SETTLED; Vault.in_machine_cents -= order_amount_cents"

  # ---- service tickets ----
  - method: POST
    path: "/service-tickets"
    description: "Open a jam/fault ticket; forces ATM operational_status FAULTED (MINOR) or OUT_OF_SERVICE (MAJOR)"
    roles: [FieldTech, PlatformAdmin]
    code: 201
    input: ["atm_id", "fault_kind", "severity?"]
    output: ServiceTicket
    side_effects: ["ATM.operational_status -> FAULTED or OUT_OF_SERVICE per severity"]

  - method: GET
    path: "/service-tickets/{id}"
    description: "Read a service ticket"
    roles: [PlatformAdmin, FieldTech]
    code: 200
    input: []
    output: ServiceTicket
    side_effects: []

  - method: GET
    path: "/service-tickets"
    description: "List service tickets; filter by atm_id (reverse-reachability for ServiceTicket.atm_id)"
    roles: [PlatformAdmin, FieldTech]
    code: 200
    input: ["atm_id?", "status?", "limit?", "offset?"]
    output: ServiceTicket[]
    side_effects: []

  - method: POST
    path: "/service-tickets/{id}/acknowledge"
    description: "Acknowledge a ticket (OPEN->ACKNOWLEDGED); records assigned_tech_id"
    roles: [FieldTech]
    code: 200
    input: []
    output: ServiceTicket
    side_effects: ["assigned_tech_id := X-User-ID of acting FieldTech"]

  - method: POST
    path: "/service-tickets/{id}/resolve"
    description: "Resolve a ticket (ACKNOWLEDGED->RESOLVED); restores ATM IN_SERVICE if last open ticket"
    roles: [FieldTech]
    code: 200
    input: []
    output: ServiceTicket
    side_effects: ["If no other OPEN/ACKNOWLEDGED ticket on ATM, ATM.operational_status -> IN_SERVICE"]

  - method: POST
    path: "/service-tickets/{id}/reopen"
    description: "Reopen a resolved ticket (RESOLVED->OPEN); re-faults the ATM; increments reopen_count"
    roles: [FieldTech]
    code: 200
    input: []
    output: ServiceTicket
    side_effects: ["reopen_count += 1; ATM.operational_status -> FAULTED/OUT_OF_SERVICE per severity"]

  - method: POST
    path: "/service-tickets/{id}/cancel"
    description: "Cancel a ticket (OPEN/ACKNOWLEDGED->CANCELLED); restores ATM IN_SERVICE if last open ticket"
    roles: [FieldTech]
    code: 200
    input: []
    output: ServiceTicket
    side_effects: ["If no other OPEN/ACKNOWLEDGED ticket on ATM, ATM.operational_status -> IN_SERVICE"]

  # ---- fee disclosure / compliance ----
  - method: POST
    path: "/atms/{id}/fee-disclosures"
    description: "Draft a fee disclosure for an ATM"
    roles: [ComplianceOfficer, PlatformAdmin]
    code: 201
    input: ["disclosed_surcharge_cents", "ack_text_present?"]
    output: FeeDisclosure
    side_effects: ["jurisdiction_code snapshot from Location; regulatory_cap_cents computed; status := DRAFT"]

  - method: GET
    path: "/atms/{id}/fee-disclosures"
    description: "List fee disclosures for an ATM (reverse-reachability for FeeDisclosure.atm_id)"
    roles: [PlatformAdmin, ComplianceOfficer, SettlementOfficer]
    code: 200
    input: ["status?", "limit?", "offset?"]
    output: FeeDisclosure[]
    side_effects: []

  - method: POST
    path: "/fee-disclosures/{id}/approve"
    description: "Approve a disclosure (DRAFT->APPROVED); supersedes prior approved; sets ATM.fee_disclosure_id"
    roles: [ComplianceOfficer]
    code: 200
    input: []
    output: FeeDisclosure
    side_effects: ["Prior APPROVED disclosure -> REJECTED; ATM.fee_disclosure_id := this"]

  - method: POST
    path: "/fee-disclosures/{id}/reject"
    description: "Reject a draft disclosure (DRAFT->REJECTED)"
    roles: [ComplianceOfficer]
    code: 200
    input: []
    output: FeeDisclosure
    side_effects: ["status := REJECTED"]

  # ---- settlement / commission ----
  - method: POST
    path: "/settlement-runs"
    description: "Create a DRAFT settlement run for an ATM over a window"
    roles: [SettlementOfficer]
    code: 201
    input: [atm_id, window_start, window_end]
    output: SettlementRun
    side_effects: ["status := DRAFT"]

  - method: GET
    path: "/settlement-runs/{id}"
    description: "Read a settlement run with all computed revenue fields"
    roles: [PlatformAdmin, SettlementOfficer]
    code: 200
    input: []
    output: SettlementRun
    side_effects: []

  - method: GET
    path: "/settlement-runs"
    description: "List settlement runs; filter by atm_id (reverse-reachability for SettlementRun.atm_id)"
    roles: [PlatformAdmin, SettlementOfficer]
    code: 200
    input: ["atm_id?", "limit?", "offset?"]
    output: SettlementRun[]
    side_effects: []

  - method: POST
    path: "/settlement-runs/{id}/settle"
    description: "Settle (DRAFT->SETTLED): sweep withdrawals, compute revenue (§1.3), cascade a CommissionStatement"
    roles: [SettlementOfficer]
    code: 200
    input: []
    output: SettlementRun
    side_effects:
      - "Sweep WITHDRAWAL txns; compute surcharge/interchange/network/net; bind Transaction.settlement_run_id"
      - "Generate CommissionStatement (ACCRUED) via commission_split (§1.3)"

  - method: GET
    path: "/commission-statements/{id}"
    description: "Read a commission statement"
    roles: [PlatformAdmin, SettlementOfficer]
    code: 200
    input: []
    output: CommissionStatement
    side_effects: []

  - method: GET
    path: "/commission-statements"
    description: "List commission statements; filter by settlement_run_id or site_merchant_id (reverse-reachability)"
    roles: [PlatformAdmin, SettlementOfficer]
    code: 200
    input: ["settlement_run_id?", "site_merchant_id?", "limit?", "offset?"]
    output: CommissionStatement[]
    side_effects: []

  - method: POST
    path: "/commission-statements/{id}/pay"
    description: "Pay a commission statement (ACCRUED->PAID); requires merchant ACTIVE"
    roles: [SettlementOfficer]
    code: 200
    input: []
    output: CommissionStatement
    side_effects: ["status := PAID"]

  - method: POST
    path: "/commission-statements/{id}/void"
    description: "Void a commission statement (ACCRUED->VOIDED); frees month-to-date ceiling headroom"
    roles: [SettlementOfficer]
    code: 200
    input: []
    output: CommissionStatement
    side_effects: ["status := VOIDED; merchant month-to-date commission reduced by commission_cents"]

  # ---- test-driving clock ----
  - method: POST
    path: "/_clock/set_current_utc"
    description: "Set the server logical clock. Startup default is 2026-01-01T00:00:00Z; before any call here the clock reads exactly this default and never falls back to wall-clock. Drives all window/forecast/month-rollover rules deterministically."
    roles: [PlatformAdmin]
    code: 200
    input: [to_iso8601]
    output: "{ current_utc: string }"
    side_effects: ["Logical clock := to_iso8601; month rollover recomputes ATM.monthly_wd_count when the calendar month changes"]

  # ---- test-driving cumulative-count seeder (priority-ladder rung 3) ----
  # No business endpoint sets an ATM's historical month-to-date withdrawal count
  # directly (it normally accrues one txn at a time). This injector seeds it so
  # interchange-tier boundary scenarios (tier1 ends at monthly_seq 500) are
  # reachable without posting hundreds of withdrawals. The NEXT WITHDRAWAL's
  # monthly_seq becomes monthly_wd_count + 1.
  - method: POST
    path: "/_inject/atm_monthly_wd_count"
    description: "Set an ATM's current-month cumulative WITHDRAWAL count (monthly_wd_count). The next WITHDRAWAL posted gets monthly_seq = monthly_wd_count + 1. Test-driving only."
    roles: [PlatformAdmin]
    code: 200
    input: [atm_id, monthly_wd_count]
    output: ATM
    side_effects: ["ATM.monthly_wd_count := monthly_wd_count (no other field touched; does not create Transaction rows)"]

# =============================================================================
# §1.6 Error Code Catalog
# =============================================================================
errors:
  - { id: ERR_UNAUTHENTICATED,        http: 401, condition: "Missing/invalid X-User-Role or X-User-ID header" }
  - { id: ERR_FORBIDDEN_ROLE,         http: 403, condition: "Acting role not permitted for the operation per §1.7" }
  - { id: ERR_NOT_FOUND,              http: 404, condition: "Referenced resource (path id or body FK) does not exist" }
  - { id: ERR_INVALID_REQUEST,        http: 422, condition: "Missing required field, bad type, or invalid enum member" }
  - { id: ERR_DUPLICATE_SERIAL,       http: 409, condition: "ATM serial_no already exists" }
  - { id: ERR_INVALID_STATE,          http: 409, condition: "Entity not in a state from which the requested transition is defined" }
  - { id: ERR_NOT_TICKET_OWNER,       http: 403, condition: "Acting FieldTech is not the ticket's assigned_tech_id on resolve" }
  - { id: ERR_SURCHARGE_CAP_EXCEEDED, http: 422, condition: "Disclosed surcharge exceeds the jurisdiction regulatory cap" }
  - { id: ERR_ACK_TEXT_MISSING,       http: 422, condition: "Fee disclosure approved without the consumer acknowledgement text" }
  - { id: ERR_DISCLOSURE_MISMATCH,    http: 422, condition: "Disclosed surcharge does not equal the ATM's current surcharge_cents" }
  - { id: ERR_NO_FEE_DISCLOSURE,      http: 422, condition: "Operation requires an APPROVED FeeDisclosure on the ATM and none exists" }
  - { id: ERR_ATM_OUT_OF_SERVICE,     http: 409, condition: "confirm-load attempted while ATM operational_status == OUT_OF_SERVICE" }
  - { id: ERR_ROUTE_PAUSED,           http: 409, condition: "Dispatch attempted on a PAUSED armored route" }
  - { id: ERR_AMOUNT_NOT_DENOMINATED, http: 422, condition: "order_amount_cents or withdrawal amount_cents not a multiple of note_denomination_cents" }
  - { id: ERR_ROUTE_WINDOW_CONFLICT,  http: 409, condition: "Service window half-open-overlaps another non-terminal order on the same route" }
  - { id: ERR_ATM_SERVICE_LOCKOUT,    http: 409, condition: "Target ATM has another non-terminal order within the service buffer window" }
  - { id: ERR_VAULT_INSUFFICIENT,     http: 422, condition: "Vault balance_cents < order_amount_cents at dispatch" }
  - { id: ERR_TXN_ALREADY_SETTLED,    http: 409, condition: "A swept withdrawal is already bound to another SettlementRun" }
  - { id: ERR_MERCHANT_SUSPENDED,     http: 409, condition: "Commission pay attempted while SiteMerchant payout_status == SUSPENDED" }
  - { id: ERR_STALE_VERSION,          http: 412, condition: "expected_vault_version does not match current Vault.version on dispatch" }
  - { id: ERR_VALIDATION,             http: 422, condition: "Generic body validation failure not covered by a more specific code (e.g. days_until_next_visit < 1)" }

# =============================================================================
# §1.7 RBAC Matrix
# =============================================================================
roles:
  - name: PlatformAdmin
    description: "Provisions config (merchants, vaults, routes, locations, ATMs); read-everywhere superset for setup"
    identity: opaque
    exclusive_operations:
      - "POST /site-merchants"
      - "POST /site-merchants/{id}/suspend"
      - "POST /vaults"
      - "POST /routes"
      - "POST /locations"
      - "POST /atms"
      - "POST /_clock/set_current_utc"
    shared_operations:
      - "POST /routes/{id}/pause (with VaultController)"
      - "POST /atms/{id}/cassettes, POST /atms/{id}/transactions (with FieldTech)"
      - "POST /replenishment-orders (with VaultController)"
      - "POST /service-tickets (with FieldTech)"
      - "POST /atms/{id}/fee-disclosures (with ComplianceOfficer)"
      - "all GET reads"

  - name: VaultController
    description: "Owns the vault and armored dispatch lifecycle"
    identity: opaque
    exclusive_operations:
      - "POST /replenishment-orders/{id}/dispatch"
      - "POST /replenishment-orders/{id}/recall"
    shared_operations:
      - "POST /replenishment-orders (with PlatformAdmin)"
      - "POST /routes/{id}/pause (with PlatformAdmin)"
      - "GET /vaults/{id}, GET /replenishment-orders*"

  - name: FieldTech
    description: "Owns on-site work: confirm-load, cash counts/close-out, service tickets"
    identity: opaque
    exclusive_operations:
      - "POST /replenishment-orders/{id}/confirm-load"
      - "POST /atms/{id}/cash-counts"
      - "POST /atms/{id}/cash-counts/{cc_id}/close-out"
      - "POST /service-tickets/{id}/acknowledge"
      - "POST /service-tickets/{id}/resolve"
      - "POST /service-tickets/{id}/reopen"
      - "POST /service-tickets/{id}/cancel"
    shared_operations:
      - "POST /atms/{id}/cassettes, POST /atms/{id}/transactions (with PlatformAdmin)"
      - "POST /service-tickets (with PlatformAdmin)"
      - "GET reads on atms/tickets/orders/cash-counts"

  - name: SettlementOfficer
    description: "Owns settlement runs and commission statements"
    identity: opaque
    exclusive_operations:
      - "POST /settlement-runs"
      - "POST /settlement-runs/{id}/settle"
      - "POST /commission-statements/{id}/pay"
      - "POST /commission-statements/{id}/void"
    shared_operations:
      - "GET reads on settlement-runs, commission-statements, atms, locations"

  - name: ComplianceOfficer
    description: "Owns fee-disclosure drafting and approval/rejection"
    identity: opaque
    exclusive_operations:
      - "POST /fee-disclosures/{id}/approve"
      - "POST /fee-disclosures/{id}/reject"
    shared_operations:
      - "POST /atms/{id}/fee-disclosures (with PlatformAdmin)"
      - "GET reads on fee-disclosures, atms"
