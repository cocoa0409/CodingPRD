              payload: {}
              as: ElectionsDirector
              captures: { committed: $.data.committed_print_cents, total_rec: $.data.total_ballots_received }
            - call: "GET /elections/${el}/custody-events"
              payload: { event_type: "TRANSFER_OUT" }
              as: WarehouseCustodian
              captures: { ev0: "$.data[0].event_type" }
          assert:
            - "Call 1: HTTP 200 with ${job_status} == \"DELIVERED\", ${basis} == \"FINAL\" and ${delivered} == 12500."
            - "${sub} == 105625: per-lot round_half_up gives 42250 + 42250 + 21125, and because every line divides evenly by 1000 the round-then-sum subtotal coincides with the ESTIMATE's sum-then-round 105625 - the two variants differ here only in the credit."
            - "${credit} == 1268: round_half_up(105625 * 120 / 10000) == round_half_up(1267.5) == 1268, the exact half-cent rounded away from zero."
            - "${freight} == 45000 (billing_quantity 12500 <= FREIGHT_TIER_1_MAX) and ${total} == 105625 + 45000 - 1268 == 149357."
            - "${committed} == 149357: election.committed_print_cents moved by 149357 - 150625 == -1268, replacing the ESTIMATE contribution rather than adding to it."
            - "Three BallotLot rows exist for the job and the list returns them in lot_code ASC order regardless of the manifest order: ${c0} == \"L-001\", ${c1} == \"L-002\", ${c2} == \"L-003\", with ${q0} == 5000 and ${q2} == 2500."
            - "Every created lot carries the declared initial accounting line: ${s0} == \"IN_TRANSIT\", ${rec0} == 0, ${pr0} == null, and issued_quantity, unused_quantity, voted_quantity, spoiled_quantity, returned_unused_quantity, accounted_quantity and lot_variance are all 0."
            - "${total_rec} == 0: shipping is not receiving, so the election ledger stays at zero until each lot is counted in."
            - "${ev0} == \"TRANSFER_OUT\" and the filtered custody query returns exactly three rows, one per created lot."

