      - name: evaluation_start_and_conclude_arm_and_maturity_guards
        claim_type: Error triggerable
        grounds:
          - validations.priority_18
          - validations.priority_64
          - validations.priority_65
          - errors.ERR_CHALLENGER_NOT_SERVING
          - errors.ERR_CHAMPION_NOT_LIVE
          - errors.ERR_RAMP_ALREADY_COMPLETE
          - errors.ERR_EVALUATION_NOT_MATURE
        distinguishing_aspect: |
          The start guard is one rule with two codes evaluated in a fixed order — the challenger arm is
          checked before the champion arm, so a fixture where BOTH arms are wrong yields
          ERR_CHALLENGER_NOT_SERVING and only after fixing the challenger does the champion complaint
          surface. Walking the champion to LIVE also exhausts its ramp table, which is the only way to
          reach ERR_RAMP_ALREADY_COMPLETE, and the maturity guard is inclusive at evaluation_ends_at.
        test_recipe:
          setup:
            - "clock at its 2026-08-01T00:00:00Z startup default, later advanced to 2026-09-01T00:00:00Z"
            - "model A with APPROVED 1.0.0 on REALTIME d1 (cluster se1) and APPROVED 1.1.0 on SHADOW d2 (cluster se2); both deployments still PENDING"
