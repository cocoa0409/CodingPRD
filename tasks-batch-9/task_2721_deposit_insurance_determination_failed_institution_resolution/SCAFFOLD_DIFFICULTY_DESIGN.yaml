        grounds:
          - state_machines.InsuranceDetermination.UNDER_REVIEW_to_REVISION_REQUESTED
          - state_machines.InsuranceDetermination.REVISION_REQUESTED_to_PREPARED
          - entities.InsuranceDetermination.fields.revision_round
          - complexity_profile.state_machine_shape
        distinguishing_aspect: |
          Non-linearity on the InsuranceDetermination entity: a true cycle
          PREPARED -> UNDER_REVIEW -> REVISION_REQUESTED -> PREPARED traversed twice, so the row
          occupies PREPARED three times and UNDER_REVIEW three times. revision_round must read 2
          (one increment per completed loop, incremented on request-revision and never on prepare),
          and the certified amounts must be those of the LAST prepare, not the first.
