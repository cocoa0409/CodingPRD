  - section: cross_cutting_complexity_layers
    instances:
      - name: stale_program_version_rejects_a_second_rate_rule_filing
        claim_type: optimistic_concurrency
        grounds:
          - concurrency_rules[rate-rule-create-stale-program]
          - validations[priority=70]
          - errors[ERR_STALE_PROGRAM_VERSION]
        distinguishing_aspect: "The declared OCC guard on POST /surcharge-programs/{id}/rate-rules compares expected_program_version to the live SurchargeProgram.version: replaying the version that was current before the first rule was filed returns 412 ERR_STALE_PROGRAM_VERSION, and the same body with the refreshed version is accepted."
        test_recipe:
          setup:
            - "One AZ merchant with docA (documented_cost_pct 2.1900) and one DRAFT BRAND_LEVEL SURCHARGE program whose version was 1 at creation; a VISA/ALL rule is then filed with that version, taking the program to version 2."
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-08-01T00:00:00Z" }
              as: PlatformAdmin
              as_user_id: "admin-1"
            - call: "POST /jurisdictions"
              payload: { state_code: "AZ", surcharge_permitted: true, surcharge_cap_pct: 4.0, cash_discount_permitted: true, price_posting_required: false, disclosure_signage_required: false, receipt_line_item_required: false, ag_enforcement_posture: "PERMISSIVE" }
              as: PlatformAdmin
              as_user_id: "admin-1"
              captures: { jur_az_id: $.data.id }
            - call: "POST /merchants"
              payload: { jurisdiction_id: "${jur_az_id}", legal_name: "Sonoran Supply Co", mcc: "5734" }
              as: PlatformAdmin
              as_user_id: "admin-1"
              captures: { merch_id: $.data.id, merch_v0: $.data.version }
            - call: "POST /merchants/${merch_id}/cost-documentations"
              payload: { base_mdr_pct: 1.85, assessment_pct: 0.14, per_item_fee_cents: 10, evidence_uri: "s3://acq/az/2026-07.pdf", expected_merchant_version: "${merch_v0}" }
              as: ComplianceOfficer
              as_user_id: "officer-1"
              captures: { doc_a_id: $.data.id }
            - call: "POST /surcharge-programs"
              payload: { merchant_id: "${merch_id}", jurisdiction_id: "${jur_az_id}", cost_documentation_id: "${doc_a_id}", program_type: "SURCHARGE", consistency_scope: "BRAND_LEVEL" }
              as: ComplianceOfficer
              as_user_id: "officer-1"
              captures: { prog_id: $.data.id, prog_v1: $.data.version }
            - call: "POST /surcharge-programs/${prog_id}/rate-rules"
              payload: { brand: "VISA", product_tier: "ALL", rate_pct: 2.19, effective_from: "2026-08-01T00:00:00Z", effective_to: "2026-12-31T00:00:00Z", expected_program_version: "${prog_v1}" }
              as: ComplianceOfficer
              as_user_id: "officer-1"
            - call: "GET /surcharge-programs/${prog_id}"
              payload: {}
              as: ComplianceOfficer
              as_user_id: "officer-1"
              captures: { prog_v2: $.data.version }
          trigger:
            - call: "POST /surcharge-programs/${prog_id}/rate-rules"
              payload: { brand: "MASTERCARD", product_tier: "ALL", rate_pct: 2.19, effective_from: "2026-08-01T00:00:00Z", effective_to: "2026-12-31T00:00:00Z", expected_program_version: "${prog_v1}" }
              as: ComplianceOfficer
              as_user_id: "officer-1"
              captures: { err_id: $.data.error_id }
            - call: "POST /surcharge-programs/${prog_id}/rate-rules"
              payload: { brand: "MASTERCARD", product_tier: "ALL", rate_pct: 2.19, effective_from: "2026-08-01T00:00:00Z", effective_to: "2026-12-31T00:00:00Z", expected_program_version: "${prog_v2}" }
              as: ComplianceOfficer
              as_user_id: "officer-1"
          assert:
            - "The stale attempt returns HTTP 412 with data.error_id == ERR_STALE_PROGRAM_VERSION"
            - "GET /brand-rate-rules with program_id ${prog_id} immediately after the stale attempt returns total_count == 1"
            - "The refreshed attempt returns HTTP 201 with data.brand == MASTERCARD and data.rate_pct == 2.1900"
            - "GET /surcharge-programs/${prog_id} at the end returns data.version == 3 (create 1, VISA rule 2, MASTERCARD rule 3 - the rejected call did not consume a version)"
            - "GET /brand-rate-rules with program_id ${prog_id} at the end returns total_count == 2"

