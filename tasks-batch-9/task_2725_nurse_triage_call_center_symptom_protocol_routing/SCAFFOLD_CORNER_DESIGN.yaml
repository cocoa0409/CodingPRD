            - call: "POST /nurses/${nurse_senior_early}/shifts"
              payload: { start_utc: "2026-08-03T12:00:00Z", end_utc: "2026-08-03T20:00:00Z" }
              as: PlatformAdmin
            - call: "POST /nurses"
              payload: { full_name: "Senior Late", seniority_level: 4, max_concurrent_calls: 2, high_risk_cap: 2 }
              as: PlatformAdmin
