          assert:
            - "${monv3} == 75000  # requested becomes 90000 for both employers"
            - "${capmn} == 0.60 and ${amtmn} == 90000 and ${whmn} == 90000  # floor(150000 * 0.60) == 90000; the IWO sits exactly at its own cap and at the aggregate cap floor(150000 * 0.60) == 90000, and <= passes"
            - "HTTP 409 and ${e_agg} == ERR_AGGREGATE_WITHHOLDING_EXCEEDS_CAP  # the WI order would withhold 50000 within its own floor(100000 * 0.50) == 50000 cap, but the collection becomes 140000 against floor((150000 + 100000) * min(0.60, 0.50)) == 125000"
            - "${mn_term} == TERMINATED"
            - "${jurwi} == WI and ${capwi} == 0.50 and ${amtwi} == 50000 and ${whwi} == 50000  # the identical payload now passes: total_disposable is 100000, binding_pct 0.50, aggregate cap 50000, sum 50000, and 50000 <= 50000"
            - "${iwo_total} == 2  # the TERMINATED MN row still exists but no longer counts toward the aggregate, and the refused attempt persisted nothing"

      - name: tax_intercept_threshold_depends_on_whether_arrears_are_assigned
