      - name: derived_balance_due_reconciles_after_change_order
        claim_type: derived_field_reconciliation
        grounds: [calculations.deposit_due, entities.Project.fields.balance_due_cents, entities.Project.fields.revised_total_cents]
        distinguishing_aspect: "After deposit (2674) on an S1 project and an approved ADD_SURFACE (+47300), balance_due_cents = revised_total 56213 - amount_paid 2674 = 53539, while deposit_due stays the frozen 2674."
        test_recipe:
          setup: ["ESTIMATED S1 project, deposit 2674 paid (revised_total 8913), then ADD_SURFACE S3 approved -> revised_total 56213."]
          setup_api_calls:
            - call: "POST /painting/paint-products"
              payload: { name: "PremiumMatte White", surface_kind: "INTERIOR", finish_type: "FLAT", price_per_gallon_cents: 4000, coverage_sqft_per_gallon_per_coat: 350 }
