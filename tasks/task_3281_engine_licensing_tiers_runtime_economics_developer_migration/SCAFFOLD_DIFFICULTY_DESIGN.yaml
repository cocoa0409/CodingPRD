        distinguishing_aspect: |
          Category pair state(5) vs business_fiscal(16): a pay call on an invoice
          whose assessment_status is DISPUTED with an overpaying amount must return
          ERR_INVALID_STATE (payment requires FINALIZED) rather than
          ERR_PAYMENT_EXCEEDS_BALANCE, proving state outranks fiscal.
        test_recipe:
          setup:
            - "PRO org, revenue gate met, SHIPPED project, report submitted with billable 150,000 then DISPUTED (invoice DISPUTED/UNPAID, provisional 2,250,000)"
