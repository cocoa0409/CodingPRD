      - "Guest ${g2} ends with late_cancel_count == 1, folio_balance_cents == 18000 and booking_privilege == OPEN"
      - "Guest ${g3} ends with no_show_strikes == 1, folio_balance_cents == 18000 and booking_privilege == RESTRICTED, because NO_SHOW_RESTRICTION_THRESHOLD is 1"
      - "TreatmentRoom booked_minutes_total and Therapist assigned_minutes_total are both 0 at the end: all four appointments released their committed minutes exactly once"

