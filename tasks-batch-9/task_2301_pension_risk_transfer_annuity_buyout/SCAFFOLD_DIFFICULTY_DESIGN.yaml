  # ===========================================================================
  - rule_id: transitive_cascade
    instances:

      - name: rating_downgrade_cascades_quote_tranche_and_empties_pool
        grounds:
          - state_machines.AnnuityQuote.SHORTLISTED_to_INELIGIBLE
          - state_machines.BuyoutTranche.INSURER_SELECTED_to_QUOTING
          - calculations.insurer_safest_available_score
          - endpoints.POST_/prt/insurers/{id}/rating-changes
          - errors.ERR_NO_ELIGIBLE_QUOTE
        distinguishing_aspect: |
          A regulator's write on Insurer propagates three entities deep without
          any client action on the downstream rows: hop 1 flips the SHORTLISTED
          AnnuityQuote to INELIGIBLE because RATING_POINTS[BBB] = 40 < 78, hop 2
          drags the BuyoutTranche back INSURER_SELECTED -> QUOTING and nulls
          selected_quote_id / selected_insurer_id / selection_score_bp /
          selection_basis, hop 3 sets tranche.data_readiness_flag = BLOCKED. The
          cascade is lossy, not merely reversible: the losing quotes were already
          DECLINED at the earlier selection and DECLINED is terminal, so the
          immediate re-selection attempt finds an empty candidate pool and fails
          with ERR_NO_ELIGIBLE_QUOTE.
        test_recipe:
          setup:
            - "logical clock at 2026-08-01T00:00:00Z"
            - "one PensionPlan authorized for BUYOUT_ONLY settlement with an engaged expert holding an AFFIRMATIVE opinion"
            - "two insurers: Cardinal AAA / 5100 bp and Aurora AA_PLUS / 4200 bp, capacity 200000000 each"
            - "one BuyoutTranche in INSURER_SELECTED under SAFETY_WEIGHTED with Cardinal's 13400000 quote SHORTLISTED and Aurora's 12500000 quote DECLINED"
