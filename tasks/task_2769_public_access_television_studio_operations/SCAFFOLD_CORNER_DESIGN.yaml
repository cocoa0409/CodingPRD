              as: CenterAdmin
              as_user_id: "adm-1"
              captures: {ch_id: $.data.id}
            - call: "POST /programs"
              payload: {producer_id: "${p_id}", title: "Studio Session", runtime_seconds: 1800, is_live: false, required_crew_roles: ["AUDIO"]}
              as: Producer
              as_user_id: "${p_id}"
              captures: {prog_id: $.data.id}
            - call: "POST /programs/${prog_id}/attestations"
              payload: {attestation_kind: "INDEMNIFICATION", statement_version: "2026.1", third_party_material: false}
              as: Producer
              as_user_id: "${p_id}"
            - call: "POST /programs/${prog_id}/attestations"
              payload: {attestation_kind: "COPYRIGHT_CLEARANCE", statement_version: "2026.1", third_party_material: false}
              as: Producer
              as_user_id: "${p_id}"
            - call: "POST /programs/${prog_id}/attestations"
