            - call: "POST /accounts"
              payload: { name: "Empty Order Co", price_tier_id: "${tier_id}", net_terms_days: 30, credit_limit_cents: 1000000 }
              as: SalesRep
              captures: { acct_id: $.data.id }
          trigger:
            - call: "POST /accounts/${acct_id}/orders"
              payload: { lines: [] }
              as: SalesRep
              captures: { err: $.data.error_id }
          assert:
            - "Response error_id == ERR_INVALID_REQUEST (empty lines collection)"

