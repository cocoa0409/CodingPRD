            - { call: "POST /api/licenses", payload: { state_code: "TX", license_number: "LIC-TX-3", effective_date: "2028-01-01", expiry_date: "2028-12-31" }, as: ComplianceOfficer, captures: { lic3_status: "$.data.status" } }
          assert:
            - "captured err == ERR_LICENSE_WINDOW_OVERLAP (closed window: effective 2027-12-31 touches existing expiry 2027-12-31)"
            - "captured lic3_status == ACTIVE (effective 2028-01-01 > 2027-12-31 strictly is a legal gap)"
            - "GET /api/licenses?state_code=TX: exactly 2 rows"

  # =========================================================================
  # Rule 9 — compensating_invariant (different conserved quantities)
