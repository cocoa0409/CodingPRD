  - rule_id: resource_temporal_overlap
    instances:
      - name: room_booking_half_open_adjacency_allowed
        grounds:
          - errors[ERR_ROOM_ALREADY_BOOKED]
          - entities.LodgingReservation.fields.room_code
          - validations[priority=11]
        distinguishing_aspect: |
          Interval semantics HALF-OPEN on resource (trip, site_name, room_code):
          [check_in, check_out) — a reservation whose check_in equals the
          existing check_out (adjacent, zero gap) is LEGAL, while a one-day
          proper overlap is rejected; the same room_code at a different site is
          a different resource and does not conflict.
        test_recipe:
          setup:
            - "Trip Alpha in DRAFT; existing reservation host/R1 2027-06-15 -> 2027-06-20"
          setup_api_calls:
            - { call: "POST /youth-ministry/programs", payload: {name: "Youth 2026", ministry_year: "2026-2027", scholarship_fund_total_cents: 0, code_of_conduct_text: "CoC", discipline_policy_text: "DP"}, as: ProgramDirector, captures: {prog_id: $.data.id} }
            - { call: "POST /youth-ministry/trips", payload: {program_id: "${prog_id}", name: "Alpha", destination_name: "Lima", destination_type: "INTERNATIONAL", start_date: "2027-06-15", end_date: "2027-06-25", capacity_youth: 30, base_cost_cents: 200000, deposit_cents: 50000, chaperone_ratio: 5, registration_open_at: "2026-08-01T00:00:00Z", registration_close_at: "2026-12-01T00:00:00Z", deposit_due_at: "2027-01-15T00:00:00Z", final_payment_due_at: "2027-05-01T00:00:00Z", emergency_protocol_text: "Protocol"}, as: ProgramDirector, captures: {trip_id: $.data.id} }
            - { call: "POST /youth-ministry/trips/${trip_id}/lodging-reservations", payload: {site_name: "host", room_code: "R1", check_in_date: "2027-06-15", check_out_date: "2027-06-20", room_capacity: 4, cost_cents: 10000}, as: TripLeader, as_user_id: "leader-1", captures: {resA: $.data.id} }
          trigger:
            - { call: "POST /youth-ministry/trips/${trip_id}/lodging-reservations", payload: {site_name: "host", room_code: "R1", check_in_date: "2027-06-20", check_out_date: "2027-06-25", room_capacity: 4, cost_cents: 10000}, as: TripLeader, as_user_id: "leader-1", captures: {resB: $.data.id} }
            - { call: "POST /youth-ministry/trips/${trip_id}/lodging-reservations", payload: {site_name: "host", room_code: "R1", check_in_date: "2027-06-19", check_out_date: "2027-06-21", room_capacity: 4, cost_cents: 5000}, as: TripLeader, as_user_id: "leader-1", captures: {errC: $.data.error_id} }
            - { call: "POST /youth-ministry/trips/${trip_id}/lodging-reservations", payload: {site_name: "hotel", room_code: "R1", check_in_date: "2027-06-19", check_out_date: "2027-06-21", room_capacity: 4, cost_cents: 5000}, as: TripLeader, as_user_id: "leader-1", captures: {resD: $.data.id} }
            - { call: "GET /youth-ministry/trips/${trip_id}", as: ProgramDirector, captures: {lodging_total: $.data.lodging_cost_total_cents} }
          assert:
            - "resB created (201): check_in 2027-06-20 == resA check_out 2027-06-20 is ADJACENT, not overlapping, under half-open semantics"
            - "errC == ERR_ROOM_ALREADY_BOOKED (409): [06-19,06-21) intersects both [06-15,06-20) and [06-20,06-25)"
            - "resD created (201): same room_code at a different site_name is a distinct resource"
            - "lodging_total == 35000 (10000+10000+5000 from the three CONFIRMED reservations; the rejected one contributes nothing)"

      - name: vehicle_travel_segments_require_45min_turnaround_buffer
        grounds:
          - errors[ERR_VEHICLE_SCHEDULE_CONFLICT]
          - entities.ItineraryItem.fields.vehicle_code
          - validations[priority=11]
        distinguishing_aspect: |
          DIFFERENT interval semantics than lodging: TRAVEL items on one
          vehicle_code forbid even ADJACENT placement — a 45-minute turnaround
          buffer is required, so gap == 44 minutes fails, gap == 45 exactly
          passes, and non-TRAVEL items or other vehicles are unaffected.
        test_recipe:
          setup:
            - "Trip Alpha in DRAFT; existing TRAVEL item bus-1 2027-06-15T08:00:00Z..10:00:00Z"
          setup_api_calls:
            - { call: "POST /youth-ministry/programs", payload: {name: "Youth 2026", ministry_year: "2026-2027", scholarship_fund_total_cents: 0, code_of_conduct_text: "CoC", discipline_policy_text: "DP"}, as: ProgramDirector, captures: {prog_id: $.data.id} }
            - { call: "POST /youth-ministry/trips", payload: {program_id: "${prog_id}", name: "Alpha", destination_name: "Lima", destination_type: "INTERNATIONAL", start_date: "2027-06-15", end_date: "2027-06-25", capacity_youth: 30, base_cost_cents: 200000, deposit_cents: 50000, chaperone_ratio: 5, registration_open_at: "2026-08-01T00:00:00Z", registration_close_at: "2026-12-01T00:00:00Z", deposit_due_at: "2027-01-15T00:00:00Z", final_payment_due_at: "2027-05-01T00:00:00Z", emergency_protocol_text: "Protocol"}, as: ProgramDirector, captures: {trip_id: $.data.id} }
            - { call: "POST /youth-ministry/trips/${trip_id}/itinerary-items", payload: {segment_type: "TRAVEL", title: "Outbound leg", start_at: "2027-06-15T08:00:00Z", end_at: "2027-06-15T10:00:00Z", vehicle_code: "bus-1"}, as: TripLeader, as_user_id: "leader-1", captures: {item1: $.data.id} }
          trigger:
            - { call: "POST /youth-ministry/trips/${trip_id}/itinerary-items", payload: {segment_type: "TRAVEL", title: "Too soon", start_at: "2027-06-15T10:30:00Z", end_at: "2027-06-15T11:00:00Z", vehicle_code: "bus-1"}, as: TripLeader, as_user_id: "leader-1", captures: {err30: $.data.error_id} }
            - { call: "POST /youth-ministry/trips/${trip_id}/itinerary-items", payload: {segment_type: "TRAVEL", title: "Exactly 45", start_at: "2027-06-15T10:45:00Z", end_at: "2027-06-15T11:30:00Z", vehicle_code: "bus-1"}, as: TripLeader, as_user_id: "leader-1", captures: {item45: $.data.id} }
            - { call: "POST /youth-ministry/trips/${trip_id}/itinerary-items", payload: {segment_type: "TRAVEL", title: "Other vehicle", start_at: "2027-06-15T08:30:00Z", end_at: "2027-06-15T09:00:00Z", vehicle_code: "van-2"}, as: TripLeader, as_user_id: "leader-1", captures: {itemVan: $.data.id} }
            - { call: "POST /youth-ministry/trips/${trip_id}/itinerary-items", payload: {segment_type: "SERVICE", title: "Service block", start_at: "2027-06-15T08:30:00Z", end_at: "2027-06-15T09:30:00Z", location: "host site"}, as: TripLeader, as_user_id: "leader-1", captures: {itemSvc: $.data.id} }
          assert:
            - "err30 == ERR_VEHICLE_SCHEDULE_CONFLICT (409): 30-minute gap < 45-minute buffer"
            - "item45 created (201): gap exactly 45 minutes satisfies end+45min <= start (inclusive boundary)"
            - "itemVan created (201): overlapping times on a DIFFERENT vehicle_code do not conflict"
            - "itemSvc created (201): non-TRAVEL items carry no vehicle and never conflict"

      - name: chaperone_trip_overlap_closed_interval_shared_boundary_conflicts
        grounds:
          - errors[ERR_CHAPERONE_TRIP_OVERLAP]
          - entities.ChaperoneAssignment.fields.chaperone_id
          - validations[priority=11]
        distinguishing_aspect: |
          THIRD interval semantics — CLOSED inclusive [start_date, end_date] on
          the chaperone resource across trips: trips sharing only the boundary
          date (T1 ends 06-25, T2 starts 06-25) DO conflict, while a trip
          starting the day after (06-26) is legal — opposite adjacency behavior
          to the half-open lodging rule.
        test_recipe:
          setup:
            - "Chaperone with CLEARED check (clock default 2026-08-01 -> expires 2028-07-31, valid through all three trip end instants); T1 2027-06-15..06-25 assignment already CONFIRMED"
          setup_api_calls:
            - { call: "POST /youth-ministry/programs", payload: {name: "Youth 2026", ministry_year: "2026-2027", scholarship_fund_total_cents: 0, code_of_conduct_text: "CoC", discipline_policy_text: "DP"}, as: ProgramDirector, captures: {prog_id: $.data.id} }
            - { call: "POST /youth-ministry/trips", payload: {program_id: "${prog_id}", name: "T1", destination_name: "Dallas", destination_type: "OUT_OF_STATE", start_date: "2027-06-15", end_date: "2027-06-25", capacity_youth: 10, base_cost_cents: 80000, deposit_cents: 50000, chaperone_ratio: 5, registration_open_at: "2026-08-01T00:00:00Z", registration_close_at: "2026-12-01T00:00:00Z", deposit_due_at: "2027-01-15T00:00:00Z", final_payment_due_at: "2027-05-01T00:00:00Z", emergency_protocol_text: "Protocol"}, as: ProgramDirector, captures: {t1: $.data.id} }
            - { call: "POST /youth-ministry/trips", payload: {program_id: "${prog_id}", name: "T2", destination_name: "Denver", destination_type: "OUT_OF_STATE", start_date: "2027-06-25", end_date: "2027-06-30", capacity_youth: 10, base_cost_cents: 80000, deposit_cents: 50000, chaperone_ratio: 5, registration_open_at: "2026-08-01T00:00:00Z", registration_close_at: "2026-12-01T00:00:00Z", deposit_due_at: "2027-01-15T00:00:00Z", final_payment_due_at: "2027-05-01T00:00:00Z", emergency_protocol_text: "Protocol"}, as: ProgramDirector, captures: {t2: $.data.id} }
            - { call: "POST /youth-ministry/trips", payload: {program_id: "${prog_id}", name: "T3", destination_name: "Omaha", destination_type: "OUT_OF_STATE", start_date: "2027-06-26", end_date: "2027-06-30", capacity_youth: 10, base_cost_cents: 80000, deposit_cents: 50000, chaperone_ratio: 5, registration_open_at: "2026-08-01T00:00:00Z", registration_close_at: "2026-12-01T00:00:00Z", deposit_due_at: "2027-01-15T00:00:00Z", final_payment_due_at: "2027-05-01T00:00:00Z", emergency_protocol_text: "Protocol"}, as: ProgramDirector, captures: {t3: $.data.id} }
            - { call: "POST /youth-ministry/chaperones", payload: {program_id: "${prog_id}", first_name: "Ada", last_name: "One", email: "a1@x.org", phone: "555-1"}, as: ProgramDirector, captures: {chap: $.data.id} }
            - { call: "POST /youth-ministry/chaperones/${chap}/background-checks", payload: {}, as: ProgramDirector, captures: {bc: $.data.id} }
            - { call: "POST /youth-ministry/background-checks/${bc}/advance", payload: {to_status: "SCREENING"}, as: ProgramDirector }
            - { call: "POST /youth-ministry/background-checks/${bc}/advance", payload: {to_status: "CLEARED"}, as: ProgramDirector }
            - { call: "POST /youth-ministry/chaperone-assignments", payload: {trip_id: "${t1}", chaperone_id: "${chap}", role: "LEAD"}, as: ProgramDirector, captures: {asg1: $.data.id} }
            - { call: "POST /youth-ministry/chaperone-assignments/${asg1}/respond", payload: {decision: "ACCEPT"}, as: Chaperone, as_user_id: "${chap}" }
          trigger:
            - { call: "POST /youth-ministry/chaperone-assignments", payload: {trip_id: "${t2}", chaperone_id: "${chap}", role: "LEAD"}, as: ProgramDirector, captures: {errT2: $.data.error_id} }
            - { call: "POST /youth-ministry/chaperone-assignments", payload: {trip_id: "${t3}", chaperone_id: "${chap}", role: "LEAD"}, as: ProgramDirector, captures: {asg3: $.data.id} }
          assert:
            - "errT2 == ERR_CHAPERONE_TRIP_OVERLAP (409): closed intervals [06-15,06-25] and [06-25,06-30] share the boundary date 06-25"
            - "asg3 created (201): [06-26,06-30] starts the day AFTER T1 ends — no shared date under closed semantics"
            - "ChaperoneAssignment.${asg1}.status remains CONFIRMED (the failed T2 create mutated nothing)"

  - rule_id: compensating_invariant
    instances:
      - name: scholarship_fund_approve_rescind_conservation
        grounds:
          - calculations.scholarship_fund_rollup
          - state_machines.ScholarshipApplication.UNDER_REVIEW_to_APPROVED
          - state_machines.ScholarshipApplication.APPROVED_to_RESCINDED
        distinguishing_aspect: |
          Conserved quantity = scholarship fund cents: the forward action
          (decide-APPROVE, reserving 65000) paired with its compensating action
          (rescind) must leave reserved=0, disbursed=0, available=500000 —
          bit-identical to the pre-approve triple, satisfying
          reserved + disbursed + available == fund_total at every step.
        test_recipe:
          setup:
            - "Program fund 500000; reg1 APPROVED (participant BAND_A household_size 5 -> need 65; provisional basis 200000, no lodging); app1 requested 100000 (need_cap = round_half_up(0.65*0.5*200000) = 65000)"
          setup_api_calls:
            - { call: "POST /youth-ministry/programs", payload: {name: "Youth 2026", ministry_year: "2026-2027", scholarship_fund_total_cents: 500000, code_of_conduct_text: "CoC", discipline_policy_text: "DP"}, as: ProgramDirector, captures: {prog_id: $.data.id} }
            - { call: "POST /youth-ministry/trips", payload: {program_id: "${prog_id}", name: "Alpha", destination_name: "Lima", destination_type: "INTERNATIONAL", start_date: "2027-06-15", end_date: "2027-06-25", capacity_youth: 30, base_cost_cents: 200000, deposit_cents: 50000, chaperone_ratio: 5, registration_open_at: "2026-08-01T00:00:00Z", registration_close_at: "2026-12-01T00:00:00Z", deposit_due_at: "2027-01-15T00:00:00Z", final_payment_due_at: "2027-05-01T00:00:00Z", emergency_protocol_text: "Protocol"}, as: ProgramDirector, captures: {trip_id: $.data.id} }
            - { call: "POST /youth-ministry/trips/${trip_id}/open-registration", as: ProgramDirector }
            - { call: "POST /youth-ministry/participants", payload: {program_id: "${prog_id}", family_key: "fam-1", first_name: "P", last_name: "One", birth_date: "2011-01-01", grade: 10, annual_income_bracket: "BAND_A", household_size: 5}, as: Guardian, as_user_id: "guardian-1", captures: {p1: $.data.id} }
            - { call: "POST /youth-ministry/registrations", payload: {trip_id: "${trip_id}", participant_id: "${p1}", insurance_tier: "INTERNATIONAL", fundraising_goal_cents: 0}, as: Guardian, as_user_id: "guardian-1", captures: {reg1: $.data.id} }
            - { call: "POST /youth-ministry/registrations/${reg1}/consent-forms", payload: {form_type: "PARENTAL_CONSENT", signed_by_name: "G", signed_at: "2026-08-02T10:00:00Z"}, as: Guardian, as_user_id: "guardian-1", captures: {cfa: $.data.id} }
            - { call: "POST /youth-ministry/registrations/${reg1}/consent-forms", payload: {form_type: "MEDICAL_RELEASE", signed_by_name: "G", signed_at: "2026-08-02T10:01:00Z", medical_notes: "none"}, as: Guardian, as_user_id: "guardian-1", captures: {cfb: $.data.id} }
            - { call: "POST /youth-ministry/registrations/${reg1}/consent-forms", payload: {form_type: "CONDUCT_AGREEMENT", signed_by_name: "G", signed_at: "2026-08-02T10:02:00Z"}, as: Guardian, as_user_id: "guardian-1", captures: {cfc: $.data.id} }
            - { call: "POST /youth-ministry/consent-forms/${cfa}/review", payload: {decision: "VERIFY"}, as: ProgramDirector, as_user_id: "director-1" }
            - { call: "POST /youth-ministry/consent-forms/${cfb}/review", payload: {decision: "VERIFY"}, as: ProgramDirector, as_user_id: "director-1" }
            - { call: "POST /youth-ministry/consent-forms/${cfc}/review", payload: {decision: "VERIFY"}, as: ProgramDirector, as_user_id: "director-1" }
            - { call: "POST /youth-ministry/registrations/${reg1}/submit", as: Guardian, as_user_id: "guardian-1" }
            - { call: "POST /youth-ministry/registrations/${reg1}/review", payload: {decision: "APPROVE"}, as: ProgramDirector, as_user_id: "director-1" }
            - { call: "POST /youth-ministry/scholarship-applications", payload: {registration_id: "${reg1}", requested_cents: 100000}, as: Guardian, as_user_id: "guardian-1", captures: {app: $.data.id} }
            - { call: "GET /youth-ministry/programs/${prog_id}", as: ProgramDirector, captures: {res0: $.data.scholarship_reserved_cents, dis0: $.data.scholarship_disbursed_cents, av0: $.data.scholarship_available_cents} }
          trigger:
            - { call: "POST /youth-ministry/scholarship-applications/${app}/decide", payload: {decision: "APPROVE"}, as: ScholarshipReviewer, as_user_id: "reviewer-1", captures: {award: $.data.award_cents} }
            - { call: "GET /youth-ministry/programs/${prog_id}", as: ProgramDirector, captures: {res1: $.data.scholarship_reserved_cents, dis1: $.data.scholarship_disbursed_cents, av1: $.data.scholarship_available_cents} }
            - { call: "POST /youth-ministry/scholarship-applications/${app}/rescind", payload: {reason: "family withdrew aid request"}, as: ScholarshipReviewer, as_user_id: "reviewer-1" }
            - { call: "GET /youth-ministry/programs/${prog_id}", as: ProgramDirector, captures: {res2: $.data.scholarship_reserved_cents, dis2: $.data.scholarship_disbursed_cents, av2: $.data.scholarship_available_cents} }
          assert:
            - "res0 == 0 and dis0 == 0 and av0 == 500000"
            - "award == 65000; res1 == 65000 and dis1 == 0 and av1 == 435000 (res1 + dis1 + av1 == 500000)"
            - "res2 == 0 and dis2 == 0 and av2 == 500000 — forward+compensating pair leaves the conserved fund triple bit-identical (no drift)"

      - name: payment_post_refund_net_collected_conservation
        grounds:
          - state_machines.Payment.POSTED_to_REFUNDED
          - calculations.payment_status_rollup
          - entities.Registration.fields.covered_cents
        distinguishing_aspect: |
          Conserved quantity = registration net-collected cents (a DIFFERENT
          conserved quantity than the scholarship fund): posting a 50000 payment
          then refunding it must restore covered_cents == 0,
          amount_due_cents == 80000, payment_status == PENDING_DEPOSIT — the
          ledger and the derived status both return exactly to their pre-action
          values.
        test_recipe:
          setup:
            - "Trip Beta (base 80000, deposit 50000, no lodging -> provisional share 80000); reg1 APPROVED, no payments yet"
          setup_api_calls:
            - { call: "POST /youth-ministry/programs", payload: {name: "Youth 2026", ministry_year: "2026-2027", scholarship_fund_total_cents: 0, code_of_conduct_text: "CoC", discipline_policy_text: "DP"}, as: ProgramDirector, captures: {prog_id: $.data.id} }
            - { call: "POST /youth-ministry/trips", payload: {program_id: "${prog_id}", name: "Beta", destination_name: "Lima", destination_type: "INTERNATIONAL", start_date: "2027-06-15", end_date: "2027-06-25", capacity_youth: 30, base_cost_cents: 80000, deposit_cents: 50000, chaperone_ratio: 5, registration_open_at: "2026-08-01T00:00:00Z", registration_close_at: "2026-12-01T00:00:00Z", deposit_due_at: "2027-01-15T00:00:00Z", final_payment_due_at: "2027-05-01T00:00:00Z", emergency_protocol_text: "Protocol"}, as: ProgramDirector, captures: {trip_id: $.data.id} }
            - { call: "POST /youth-ministry/trips/${trip_id}/open-registration", as: ProgramDirector }
            - { call: "POST /youth-ministry/participants", payload: {program_id: "${prog_id}", family_key: "fam-1", first_name: "P", last_name: "One", birth_date: "2011-01-01", grade: 10, annual_income_bracket: "BAND_B", household_size: 3}, as: Guardian, as_user_id: "guardian-1", captures: {p1: $.data.id} }
            - { call: "POST /youth-ministry/registrations", payload: {trip_id: "${trip_id}", participant_id: "${p1}", insurance_tier: "INTERNATIONAL", fundraising_goal_cents: 0}, as: Guardian, as_user_id: "guardian-1", captures: {reg1: $.data.id} }
            - { call: "POST /youth-ministry/registrations/${reg1}/consent-forms", payload: {form_type: "PARENTAL_CONSENT", signed_by_name: "G", signed_at: "2026-08-02T10:00:00Z"}, as: Guardian, as_user_id: "guardian-1", captures: {cfa: $.data.id} }
            - { call: "POST /youth-ministry/registrations/${reg1}/consent-forms", payload: {form_type: "MEDICAL_RELEASE", signed_by_name: "G", signed_at: "2026-08-02T10:01:00Z", medical_notes: "none"}, as: Guardian, as_user_id: "guardian-1", captures: {cfb: $.data.id} }
            - { call: "POST /youth-ministry/registrations/${reg1}/consent-forms", payload: {form_type: "CONDUCT_AGREEMENT", signed_by_name: "G", signed_at: "2026-08-02T10:02:00Z"}, as: Guardian, as_user_id: "guardian-1", captures: {cfc: $.data.id} }
            - { call: "POST /youth-ministry/consent-forms/${cfa}/review", payload: {decision: "VERIFY"}, as: ProgramDirector, as_user_id: "director-1" }
            - { call: "POST /youth-ministry/consent-forms/${cfb}/review", payload: {decision: "VERIFY"}, as: ProgramDirector, as_user_id: "director-1" }
            - { call: "POST /youth-ministry/consent-forms/${cfc}/review", payload: {decision: "VERIFY"}, as: ProgramDirector, as_user_id: "director-1" }
            - { call: "POST /youth-ministry/registrations/${reg1}/submit", as: Guardian, as_user_id: "guardian-1" }
            - { call: "POST /youth-ministry/registrations/${reg1}/review", payload: {decision: "APPROVE"}, as: ProgramDirector, as_user_id: "director-1" }
            - { call: "GET /youth-ministry/registrations/${reg1}", as: ProgramDirector, captures: {cov0: $.data.covered_cents, due0: $.data.amount_due_cents, st0: $.data.payment_status} }
          trigger:
            - { call: "POST /youth-ministry/registrations/${reg1}/payments", payload: {amount_cents: 50000, method: "CASH"}, as: Treasurer, as_user_id: "treasurer-1", captures: {pay: $.data.id} }
            - { call: "GET /youth-ministry/registrations/${reg1}", as: ProgramDirector, captures: {cov1: $.data.covered_cents, due1: $.data.amount_due_cents, st1: $.data.payment_status} }
            - { call: "POST /youth-ministry/payments/${pay}/refund", payload: {reason: "duplicate entry"}, as: Treasurer, as_user_id: "treasurer-1", captures: {pay_status: $.data.status} }
            - { call: "GET /youth-ministry/registrations/${reg1}", as: ProgramDirector, captures: {cov2: $.data.covered_cents, due2: $.data.amount_due_cents, st2: $.data.payment_status} }
          assert:
            - "cov0 == 0 and due0 == 80000 and st0 == PENDING_DEPOSIT"
            - "cov1 == 50000 and due1 == 30000 and st1 == PARTIALLY_PAID (50000 >= deposit 50000, < 80000)"
            - "pay_status == REFUNDED"
            - "cov2 == 0 and due2 == 80000 and st2 == PENDING_DEPOSIT — net-collected (sum POSTED - sum REFUNDED == 0) and the derived status restored exactly"

      - name: donation_receive_refund_net_raised_conservation
        grounds:
          - state_machines.Donation.RECEIVED_to_REFUNDED
          - calculations.fundraising_positions
          - entities.FundraisingAccount.fields.available_credit_cents
        distinguishing_aspect: |
          Conserved quantity = account net-raised cents (third distinct
          quantity): a CARD_ONLINE donation of 10000 contributes net 9680
          (fee 320); refunding it must restore gross=0, fees=0, net=0,
          available=0 — and a subsequent unrelated CASH 5000 donation then shows
          available 5000 with zero residue from the refunded pair.
        test_recipe:
          setup:
            - "reg1 DRAFT (account OPEN; donations allowed pre-approval) with fundraising goal 0"
          setup_api_calls:
            - { call: "POST /youth-ministry/programs", payload: {name: "Youth 2026", ministry_year: "2026-2027", scholarship_fund_total_cents: 0, code_of_conduct_text: "CoC", discipline_policy_text: "DP"}, as: ProgramDirector, captures: {prog_id: $.data.id} }
            - { call: "POST /youth-ministry/trips", payload: {program_id: "${prog_id}", name: "Alpha", destination_name: "Lima", destination_type: "INTERNATIONAL", start_date: "2027-06-15", end_date: "2027-06-25", capacity_youth: 30, base_cost_cents: 200000, deposit_cents: 50000, chaperone_ratio: 5, registration_open_at: "2026-08-01T00:00:00Z", registration_close_at: "2026-12-01T00:00:00Z", deposit_due_at: "2027-01-15T00:00:00Z", final_payment_due_at: "2027-05-01T00:00:00Z", emergency_protocol_text: "Protocol"}, as: ProgramDirector, captures: {trip_id: $.data.id} }
            - { call: "POST /youth-ministry/trips/${trip_id}/open-registration", as: ProgramDirector }
            - { call: "POST /youth-ministry/participants", payload: {program_id: "${prog_id}", family_key: "fam-1", first_name: "P", last_name: "One", birth_date: "2011-01-01", grade: 10, annual_income_bracket: "BAND_B", household_size: 3}, as: Guardian, as_user_id: "guardian-1", captures: {p1: $.data.id} }
            - { call: "POST /youth-ministry/registrations", payload: {trip_id: "${trip_id}", participant_id: "${p1}", insurance_tier: "INTERNATIONAL", fundraising_goal_cents: 0}, as: Guardian, as_user_id: "guardian-1", captures: {reg1: $.data.id} }
            - { call: "GET /youth-ministry/registrations/${reg1}/fundraising-account", as: Treasurer, captures: {acct: "$.data[0].id"} }
          trigger:
            - { call: "POST /youth-ministry/fundraising-accounts/${acct}/donations", payload: {donor_name: "D1", amount_cents: 10000, channel: "CARD_ONLINE"}, as: Treasurer, as_user_id: "treasurer-1", captures: {don: $.data.id} }
            - { call: "GET /youth-ministry/fundraising-accounts/${acct}", as: Treasurer, captures: {g1: $.data.raised_gross_cents, f1: $.data.fee_total_cents, n1: $.data.raised_net_cents, a1: $.data.available_credit_cents} }
            - { call: "POST /youth-ministry/donations/${don}/refund", payload: {reason: "donor bounced"}, as: Treasurer, as_user_id: "treasurer-1" }
            - { call: "GET /youth-ministry/fundraising-accounts/${acct}", as: Treasurer, captures: {g2: $.data.raised_gross_cents, f2: $.data.fee_total_cents, n2: $.data.raised_net_cents, a2: $.data.available_credit_cents} }
            - { call: "POST /youth-ministry/fundraising-accounts/${acct}/donations", payload: {donor_name: "D2", amount_cents: 5000, channel: "CASH"}, as: Treasurer, as_user_id: "treasurer-1" }
            - { call: "GET /youth-ministry/fundraising-accounts/${acct}", as: Treasurer, captures: {g3: $.data.raised_gross_cents, a3: $.data.available_credit_cents} }
          assert:
            - "g1 == 10000 and f1 == 320 and n1 == 9680 and a1 == 9680"
            - "g2 == 0 and f2 == 0 and n2 == 0 and a2 == 0 — the receive+refund pair leaves every account sum at its pre-pair value (fee residue fully removed)"
            - "g3 == 5000 and a3 == 5000 — no drift from the earlier pair contaminates later donations"
