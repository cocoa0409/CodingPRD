              as: IsoAdmin
              is_negative_trigger: true
              captures: { e3: $.data.error_id }
            - call: "POST /merchants/${m1}/reassign-agent"
              payload: { new_agent_id: "${a2}", expected_merchant_version: "${mv1}" }
              as: IsoAdmin
          assert:
            - "before the triggers: Agent.${a1}.portfolio_merchant_count == 2 with portfolio_attrition_bps 5000 and residual_hold true; Agent.${a2}.portfolio_merchant_count == 1 with 0 bps and residual_hold false"
            - "${e1} == ERR_REFERENCED_AGENT_NOT_FOUND with HTTP 404 — the body reference is checked at priority 7, before any state rule"
            - "${e2} == ERR_AGENT_STATE_INVALID with HTTP 409 — a merchant may only be reassigned TO an ACTIVE agent"
            - "${e3} == ERR_MERCHANT_STATE_INVALID with HTTP 409 — an ATTRITED merchant cannot be reassigned at all"
            - "none of the three refusals changed Merchant.${m1}.version (still ${mv1}) or owning_agent_id, which is why the fourth call reuses the same expected_merchant_version"
            - "the fourth call returns 200: Merchant.${m1}.owning_agent_id == ${a2} and version == ${mv1} + 1"
            - "Agent.${a1}.portfolio_merchant_count == 1 with portfolio_attrition_bps 10000 and residual_hold true — the only merchant left on its book is ATTRITED ${m2}"
            - "Agent.${a2}.portfolio_merchant_count == 2 with portfolio_attrition_bps 0 and residual_hold false — both agents were recomputed by the one write"
            - "GET /merchants?owning_agent_id=${a2} returns total_count 2 (${m3} and ${m1})"

      - name: chargeback_events_create_list_filter_and_paginate
        claim_type: Standard CRUD
        grounds:
          - endpoints.POST /merchants/{id}/chargebacks
          - endpoints.GET /chargeback-events
          - endpoints.GET /chargeback-events/{id}
          - entities.ChargebackEvent
        distinguishing_aspect: "The path segment — not the body — supplies merchant_id, and the three list filters compose independently over six events spread across two merchants, three period_months and both liabilities. Pagination is verified against a filtered set: limit 2 / offset 2 returns 2 of the 5 matching rows with has_more true, and offset 4 returns the last row with has_more false while total_count stays 5."
        test_recipe:
          setup: ["Agent A1 with merchants M1 and M2; five chargebacks booked against M1 (periods 2026-05, 2026-06, 2026-07 twice and 2026-08, mixed liability) and one against M2 in 2026-07."]
          setup_api_calls:
