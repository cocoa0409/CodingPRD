          setup:
            - "logical clock at 2026-08-03T06:00:00.000Z"
            - "exactly one donor in the system with two corneas (OD and OS) from a single recovery, both classified TRANSPLANT_OPTICAL / ELIGIBLE (custody IN_HOUSE)"
