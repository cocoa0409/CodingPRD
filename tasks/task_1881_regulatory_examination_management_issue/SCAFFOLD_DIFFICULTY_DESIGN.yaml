scaffold_difficulty_design:
  # ===================================================================
  # Rule 1 — dual_variant_calc (2 instances, different entity domains)
  # ===================================================================
  - rule_id: dual_variant_calc
    instances:
      - name: repeat_finding_risk_forward_vs_historical_variants
        grounds:
          - calculations.repeat_finding_risk
          - entities.Examination.fields.repeat_finding_risk_score_bp
        distinguishing_aspect: |
          Two variants of repeat_finding_risk produce different results on identical data:
          forward_looking excludes CLOSED issues and adds overdue surcharge; historical
          includes CLOSED issues and omits surcharge. Entity domain = Examination aggregate score.
        test_recipe:
          setup:
            - "One agency with escalation_threshold_days = 30 and repeat_finding_multiplier_bp = 20000"
            - "One examination EXAM1 in status REMEDIATION"
            - "Issue A: severity HIGH, is_repeat_finding false, status CLOSED (already closed)"
            - "Issue B: severity MODERATE, is_repeat_finding false, status OVERDUE with due_date 10 days in the past"
            - "Logical clock set to 2026-08-14T00:00:00Z"
          setup_api_calls:
            - call: "POST /regulatory-exams/agencies"
              payload: { agency_code: "OCC", agency_name: "Office of the Comptroller", jurisdiction: "FEDERAL", escalation_threshold_days: 30, repeat_finding_multiplier_bp: 20000 }
              as: PlatformAdmin
              captures: { agency_id: $.data.id }
            - call: "POST /regulatory-exams/examinations"
              payload: { agency_id: "${agency_id}", exam_cycle_code: "2026-Q3-SAFETY", exam_type: "SAFETY_SOUNDNESS", scheduled_start_date: "2026-07-06T00:00:00Z", scheduled_end_date: "2026-07-31T00:00:00Z" }
              as: RegulatoryAffairsManager
              captures: { exam_id: $.data.id, exam_v0: $.data.version }
            - call: "POST /regulatory-exams/examinations/${exam_id}/first-day-items"
              payload: { request_ref: "FDL-001", description: "Org chart", due_date: "2026-07-20T00:00:00Z" }
              as: RegulatoryAffairsManager
              captures: { item_id: $.data.id }
            - call: "POST /regulatory-exams/examinations/${exam_id}/issue-first-day-letter"
              payload: {}
              as: RegulatoryAffairsManager
            - call: "POST /regulatory-exams/first-day-items/${item_id}/waive"
              payload: { waived_reason: "Not applicable to this scope" }
              as: RegulatoryAffairsManager
            - call: "POST /regulatory-exams/examinations/${exam_id}/begin-fieldwork"
              payload: {}
              as: RegulatoryAffairsManager
            - call: "POST /regulatory-exams/examiner-meetings"
              payload: { examination_id: "${exam_id}", meeting_date: "2026-07-15T10:00:00Z", attendees: ["Examiner A", "Officer B"], minutes_summary: "Kickoff" }
              as: RegulatoryAffairsManager
              captures: { meeting_id: $.data.id }
            - call: "POST /regulatory-exams/examiner-meetings/${meeting_id}/finalize"
              payload: {}
              as: RegulatoryAffairsManager
            - call: "POST /regulatory-exams/examinations/${exam_id}/deliver-findings"
              payload: {}
              as: RegulatoryAffairsManager
            - call: "GET /regulatory-exams/examinations/${exam_id}"
              as: RegulatoryAffairsManager
              captures: { exam_v1: $.data.version }
            - call: "POST /regulatory-exams/examinations/${exam_id}/issues"
              payload: { issue_ref: "MRA-2026-01", classification: "MRA", severity: "HIGH", due_date: "2026-08-01T00:00:00Z", expected_examination_version: "${exam_v1}" }
              as: RegulatoryAffairsManager
              captures: { issue_a_id: $.data.id }
            - call: "POST /regulatory-exams/examinations/${exam_id}/open-remediation"
              payload: {}
              as: RegulatoryAffairsManager
            - call: "POST /regulatory-exams/officers"
              payload: { full_name: "Officer One", email: "o1@bank.test", officer_role_title: "CRO" }
              as: PlatformAdmin
              captures: { officer1_id: $.data.id }
            - call: "POST /regulatory-exams/reviewers"
              payload: { full_name: "Rev L3", email: "rl3@bank.test", certification_level: "L3" }
              as: PlatformAdmin
              captures: { reviewer_l3: $.data.id }
            - call: "POST /regulatory-exams/issues/${issue_a_id}/remediation-plans"
              payload: { owner_user_id: "${officer1_id}", root_cause_narrative: "Cause A", corrective_action_summary: "Fix A" }
              as: RemediationOwner
              as_user_id: "${officer1_id}"
              captures: { plan_a_id: $.data.id }
            - call: "POST /regulatory-exams/remediation-plans/${plan_a_id}/submit"
              payload: {}
              as: RemediationOwner
              as_user_id: "${officer1_id}"
            - call: "POST /regulatory-exams/remediation-plans/${plan_a_id}/approve"
              payload: {}
              as: ComplianceReviewer
              as_user_id: "${reviewer_l3}"
            - call: "POST /regulatory-exams/remediation-plans/${plan_a_id}/activate"
              payload: {}
              as: RemediationOwner
              as_user_id: "${officer1_id}"
            - call: "GET /regulatory-exams/remediation-plans/${plan_a_id}"
              as: RemediationOwner
              captures: { plan_a_v: $.data.version }
            - call: "POST /regulatory-exams/remediation-plans/${plan_a_id}/milestones"
              payload: { milestone_name: "M1", due_date: "2026-07-25T00:00:00Z", expected_plan_version: "${plan_a_v}" }
              as: RemediationOwner
              as_user_id: "${officer1_id}"
              captures: { ms_a1: $.data.id }
            - call: "POST /regulatory-exams/remediation-milestones/${ms_a1}/start"
              payload: {}
              as: RemediationOwner
              as_user_id: "${officer1_id}"
            - call: "POST /regulatory-exams/remediation-milestones/${ms_a1}/complete"
              payload: {}
              as: RemediationOwner
              as_user_id: "${officer1_id}"
            - call: "POST /regulatory-exams/issues/${issue_a_id}/validation-evidence"
              payload: { evidence_type: "TEST_RESULTS", artifact_manifest: [{artifact_id: "art1", name: "results", sha256: "abc"}], submitted_by_user_id: "${officer1_id}" }
              as: RemediationOwner
              as_user_id: "${officer1_id}"
              captures: { ev_a_id: $.data.id }
            - call: "POST /regulatory-exams/validation-evidence/${ev_a_id}/mark-sufficient"
              payload: {}
              as: ComplianceReviewer
              as_user_id: "${reviewer_l3}"
            - call: "POST /regulatory-exams/issues/${issue_a_id}/submit-validation"
              payload: { validation_evidence_id: "${ev_a_id}", closure_narrative: "Done" }
              as: RemediationOwner
              as_user_id: "${officer1_id}"
              captures: { cr_a_id: $.data.id }
            - call: "GET /regulatory-exams/issues/${issue_a_id}"
              as: ComplianceReviewer
              captures: { issue_a_v: $.data.version }
            - call: "POST /regulatory-exams/closure-requests/${cr_a_id}/approve"
              payload: { expected_issue_version: "${issue_a_v}" }
              as: ComplianceReviewer
              as_user_id: "${reviewer_l3}"
            - call: "GET /regulatory-exams/examinations/${exam_id}"
              as: RegulatoryAffairsManager
              captures: { exam_v2: $.data.version }
            - call: "POST /regulatory-exams/examinations/${exam_id}/issues"
              payload: { issue_ref: "MRA-2026-02", classification: "MRA", severity: "MODERATE", due_date: "2026-08-04T00:00:00Z", expected_examination_version: "${exam_v2}" }
              as: RegulatoryAffairsManager
              captures: { issue_b_id: $.data.id }
            - call: "POST /regulatory-exams/_clock/set_current_utc"
              payload: { to_iso8601: "2026-08-14T00:00:00Z" }
              as: PlatformAdmin
          trigger:
            - call: "GET /regulatory-exams/examinations/${exam_id}"
              as: RegulatoryAffairsManager
              captures: { fwd_bp: $.data.repeat_finding_risk_score_bp }
            - call: "GET /regulatory-exams/examinations/${exam_id}/risk-history"
              as: RegulatoryAffairsManager
              captures: { hist_bp: $.data.historical_risk_bp }
          assert:
            - "Examination.${exam_id}.repeat_finding_risk_score_bp == 5250 (forward_looking: B is OVERDUE MODERATE 5000 + min(10*25,5000)=250 surcharge; A excluded because CLOSED)"
            - "risk-history.historical_risk_bp == 12500 (historical: A is CLOSED HIGH 7500 + B is OVERDUE MODERATE 5000, no surcharge)"
            - "forward_looking value (5250) != historical value (12500)"

      - name: first_day_due_date_business_day_rollover
        grounds:
          - calculations.first_day_letter_due_date
          - entities.Examination.fields.first_day_letter_due_date
        distinguishing_aspect: |
          first_day_letter_due_date calculation is a distinct entity domain (Examination scheduling
          metadata, not risk scoring). Its two interpretations — counting scheduled_start_date as
          day 1 vs. day 0 — produce different due dates; the scaffold pins start-as-day-1, and
          weekend-rollover yields a falsifiable boundary distinction vs naive +14 calendar days.
        test_recipe:
          setup:
            - "One agency created"
            - "Examination scheduled_start_date = 2026-07-03 (a Friday)"
          setup_api_calls:
            - call: "POST /regulatory-exams/agencies"
              payload: { agency_code: "FRB", agency_name: "Federal Reserve", jurisdiction: "FEDERAL", escalation_threshold_days: 30, repeat_finding_multiplier_bp: 20000 }
              as: PlatformAdmin
              captures: { agency2_id: $.data.id }
            - call: "POST /regulatory-exams/examinations"
              payload: { agency_id: "${agency2_id}", exam_cycle_code: "2026-Q3-COMP", exam_type: "COMPLIANCE", scheduled_start_date: "2026-07-03T00:00:00Z", scheduled_end_date: "2026-08-01T00:00:00Z" }
              as: RegulatoryAffairsManager
              captures: { exam2_id: $.data.id }
          trigger:
            - call: "GET /regulatory-exams/examinations/${exam2_id}"
              as: RegulatoryAffairsManager
              captures: { due: $.data.first_day_letter_due_date }
          assert:
            - "Examination.${exam2_id}.first_day_letter_due_date starts with '2026-07-16' (Fri 7/3 = day1, Mon 7/6 = day2 ... Thu 7/16 = day10)"
            - "first_day_letter_due_date != '2026-07-17' (naive +14 calendar-day interpretation) and != '2026-07-15' (day-0 interpretation)"

  # ===================================================================
  # Rule 2 — combinatorial_formula (2 instances, different modes)
  # ===================================================================
  - rule_id: combinatorial_formula
    instances:
      - name: repeat_finding_risk_multi_input_tiered_scoring
        grounds:
          - calculations.repeat_finding_risk
        distinguishing_aspect: |
          Mode (a): repeat_finding_risk has >=3 inputs (severity base, is_repeat_finding multiplier
          from agency config, overdue surcharge from day-count) with non-linear interaction
          (repeat multiplier conditional branch, surcharge min-cap, overall MAX_SCORE_BP ceiling).
        test_recipe:
          setup:
            - "Agency with repeat_finding_multiplier_bp = 30000 (3x) and escalation_threshold_days = 30"
            - "Examination with one CRITICAL repeat-finding issue and one LOW non-repeat issue; logical clock at exam due_date + 5 days for the LOW issue's overdue surcharge"
          setup_api_calls:
            - call: "POST /regulatory-exams/agencies"
              payload: { agency_code: "FDIC", agency_name: "FDIC", jurisdiction: "FEDERAL", escalation_threshold_days: 30, repeat_finding_multiplier_bp: 30000 }
              as: PlatformAdmin
              captures: { ag3: $.data.id }
            - call: "POST /regulatory-exams/examinations"
              payload: { agency_id: "${ag3}", exam_cycle_code: "X", exam_type: "IT", scheduled_start_date: "2026-07-06T00:00:00Z", scheduled_end_date: "2026-07-10T00:00:00Z" }
              as: RegulatoryAffairsManager
              captures: { ex3: $.data.id, ex3_v0: $.data.version }
            - call: "POST /regulatory-exams/examinations/${ex3}/first-day-items"
              payload: { request_ref: "FDL-X", description: "x", due_date: "2026-07-15T00:00:00Z" }
              as: RegulatoryAffairsManager
              captures: { it3: $.data.id }
            - call: "POST /regulatory-exams/examinations/${ex3}/issue-first-day-letter"
              payload: {}
              as: RegulatoryAffairsManager
            - call: "POST /regulatory-exams/first-day-items/${it3}/waive"
              payload: { waived_reason: "na" }
              as: RegulatoryAffairsManager
            - call: "POST /regulatory-exams/examinations/${ex3}/begin-fieldwork"
              payload: {}
              as: RegulatoryAffairsManager
            - call: "POST /regulatory-exams/examiner-meetings"
              payload: { examination_id: "${ex3}", meeting_date: "2026-07-08T10:00:00Z", attendees: ["E", "O"], minutes_summary: "m" }
              as: RegulatoryAffairsManager
              captures: { mt3: $.data.id }
            - call: "POST /regulatory-exams/examiner-meetings/${mt3}/finalize"
              payload: {}
              as: RegulatoryAffairsManager
            - call: "POST /regulatory-exams/examinations/${ex3}/deliver-findings"
              payload: {}
              as: RegulatoryAffairsManager
            - call: "GET /regulatory-exams/examinations/${ex3}"
              as: RegulatoryAffairsManager
              captures: { ex3_v1: $.data.version }
            # Issue C: CRITICAL, no repeat
            - call: "POST /regulatory-exams/examinations/${ex3}/issues"
              payload: { issue_ref: "MRIA-1", classification: "MRIA", severity: "CRITICAL", due_date: "2026-08-05T00:00:00Z", expected_examination_version: "${ex3_v1}" }
              as: RegulatoryAffairsManager
              captures: { issue_c: $.data.id }
            # Prior exam to establish repeat lineage for issue D
            - call: "POST /regulatory-exams/examinations"
              payload: { agency_id: "${ag3}", exam_cycle_code: "PRIOR", exam_type: "IT", scheduled_start_date: "2026-01-05T00:00:00Z", scheduled_end_date: "2026-01-10T00:00:00Z" }
              as: RegulatoryAffairsManager
              captures: { ex_prior: $.data.id, ex_prior_v0: $.data.version }
            - call: "POST /regulatory-exams/examinations/${ex_prior}/first-day-items"
              payload: { request_ref: "FDL-P", description: "p", due_date: "2026-01-12T00:00:00Z" }
              as: RegulatoryAffairsManager
              captures: { itp: $.data.id }
            - call: "POST /regulatory-exams/examinations/${ex_prior}/issue-first-day-letter"
              payload: {}
              as: RegulatoryAffairsManager
            - call: "POST /regulatory-exams/first-day-items/${itp}/waive"
              payload: { waived_reason: "na" }
              as: RegulatoryAffairsManager
            - call: "POST /regulatory-exams/examinations/${ex_prior}/begin-fieldwork"
              payload: {}
              as: RegulatoryAffairsManager
            - call: "POST /regulatory-exams/examiner-meetings"
              payload: { examination_id: "${ex_prior}", meeting_date: "2026-01-07T10:00:00Z", attendees: ["E", "O"], minutes_summary: "m" }
              as: RegulatoryAffairsManager
              captures: { mtp: $.data.id }
            - call: "POST /regulatory-exams/examiner-meetings/${mtp}/finalize"
              payload: {}
              as: RegulatoryAffairsManager
            - call: "POST /regulatory-exams/examinations/${ex_prior}/deliver-findings"
              payload: {}
              as: RegulatoryAffairsManager
            - call: "GET /regulatory-exams/examinations/${ex_prior}"
              as: RegulatoryAffairsManager
              captures: { ex_prior_v1: $.data.version }
            - call: "POST /regulatory-exams/examinations/${ex_prior}/issues"
              payload: { issue_ref: "MRA-LEGACY", classification: "MRA", severity: "MODERATE", due_date: "2026-02-01T00:00:00Z", expected_examination_version: "${ex_prior_v1}" }
              as: RegulatoryAffairsManager
              captures: { issue_prior: $.data.id }
            - call: "POST /regulatory-exams/examinations/${ex_prior}/open-remediation"
              payload: {}
              as: RegulatoryAffairsManager
            - call: "POST /regulatory-exams/officers"
              payload: { full_name: "O", email: "o@x", officer_role_title: "CRO" }
              as: PlatformAdmin
              captures: { off3: $.data.id }
            - call: "POST /regulatory-exams/reviewers"
              payload: { full_name: "R", email: "r@x", certification_level: "L3" }
              as: PlatformAdmin
              captures: { rev3: $.data.id }
            - call: "POST /regulatory-exams/issues/${issue_prior}/remediation-plans"
              payload: { owner_user_id: "${off3}", root_cause_narrative: "c", corrective_action_summary: "s" }
              as: RemediationOwner
              as_user_id: "${off3}"
              captures: { plan_p: $.data.id }
            - call: "POST /regulatory-exams/remediation-plans/${plan_p}/submit"
              payload: {}
              as: RemediationOwner
              as_user_id: "${off3}"
            - call: "POST /regulatory-exams/remediation-plans/${plan_p}/approve"
              payload: {}
              as: ComplianceReviewer
              as_user_id: "${rev3}"
            - call: "POST /regulatory-exams/remediation-plans/${plan_p}/activate"
              payload: {}
              as: RemediationOwner
              as_user_id: "${off3}"
            - call: "GET /regulatory-exams/remediation-plans/${plan_p}"
              as: RemediationOwner
              captures: { plan_p_v: $.data.version }
            - call: "POST /regulatory-exams/remediation-plans/${plan_p}/milestones"
              payload: { milestone_name: "m", due_date: "2026-01-20T00:00:00Z", expected_plan_version: "${plan_p_v}" }
              as: RemediationOwner
              as_user_id: "${off3}"
              captures: { ms_p: $.data.id }
            - call: "POST /regulatory-exams/remediation-milestones/${ms_p}/start"
              payload: {}
              as: RemediationOwner
              as_user_id: "${off3}"
            - call: "POST /regulatory-exams/remediation-milestones/${ms_p}/complete"
              payload: {}
              as: RemediationOwner
              as_user_id: "${off3}"
            - call: "POST /regulatory-exams/issues/${issue_prior}/validation-evidence"
              payload: { evidence_type: "DOCUMENT_PACKAGE", artifact_manifest: [{artifact_id: "a", name: "n", sha256: "h"}], submitted_by_user_id: "${off3}" }
              as: RemediationOwner
              as_user_id: "${off3}"
              captures: { ev_p: $.data.id }
            - call: "POST /regulatory-exams/validation-evidence/${ev_p}/mark-sufficient"
              payload: {}
              as: ComplianceReviewer
              as_user_id: "${rev3}"
            - call: "POST /regulatory-exams/issues/${issue_prior}/submit-validation"
              payload: { validation_evidence_id: "${ev_p}", closure_narrative: "done" }
              as: RemediationOwner
              as_user_id: "${off3}"
              captures: { cr_p: $.data.id }
            - call: "GET /regulatory-exams/issues/${issue_prior}"
              as: ComplianceReviewer
              captures: { issue_p_v: $.data.version }
            - call: "POST /regulatory-exams/closure-requests/${cr_p}/approve"
              payload: { expected_issue_version: "${issue_p_v}" }
              as: ComplianceReviewer
              as_user_id: "${rev3}"
            # Now file the repeat issue on ex3 with same stem
            - call: "GET /regulatory-exams/examinations/${ex3}"
              as: RegulatoryAffairsManager
              captures: { ex3_v2: $.data.version }
            - call: "POST /regulatory-exams/examinations/${ex3}/issues"
              payload: { issue_ref: "MRA-LEGACY-R1", classification: "MRA", severity: "MODERATE", due_date: "2026-08-09T00:00:00Z", expected_examination_version: "${ex3_v2}" }
              as: RegulatoryAffairsManager
              captures: { issue_d: $.data.id }
            - call: "POST /regulatory-exams/_clock/set_current_utc"
              payload: { to_iso8601: "2026-08-14T00:00:00Z" }
              as: PlatformAdmin
          trigger:
            - call: "GET /regulatory-exams/examinations/${ex3}"
              as: RegulatoryAffairsManager
              captures: { bp3: $.data.repeat_finding_risk_score_bp }
          assert:
            - "Issue.${issue_d}.is_repeat_finding == true (prior CLOSED MRA-LEGACY under same agency)"
            - "C contribution: base 10000, is_repeat false so no multiplier, overdue 2026-08-14 - 2026-08-05 = 9 days * 25 = 225 (cap 5000 not hit) => 10225"
            - "D contribution: base 5000, is_repeat true so 5000*30000/10000 = 15000, overdue 2026-08-14 - 2026-08-09 = 5 days * 25 = 125 => 15125"
            - "Examination.${ex3}.repeat_finding_risk_score_bp == 25350 (forward sum = 10225 + 15125)"

      - name: milestone_sequence_allocation_ordering
        grounds:
          - calculations.milestone_sequence_gap_allocation
        distinguishing_aspect: |
          Mode (c): circular-looking dependency resolved by pinned evaluation order — sequence_index
          when omitted depends on max(existing sequence_index) which itself is set by the same
          creation operation; scaffold pins "max+1 or 1" and tie-break by created_at then
          milestone_name lexicographic.
        test_recipe:
          setup:
            - "Agency, exam driven to REMEDIATION, one issue, plan approved and ACTIVE"
          setup_api_calls:
            - call: "POST /regulatory-exams/agencies"
              payload: { agency_code: "CFPB", agency_name: "CFPB", jurisdiction: "FEDERAL", escalation_threshold_days: 30, repeat_finding_multiplier_bp: 20000 }
              as: PlatformAdmin
              captures: { ag4: $.data.id }
            - call: "POST /regulatory-exams/examinations"
              payload: { agency_id: "${ag4}", exam_cycle_code: "Y", exam_type: "COMPLIANCE", scheduled_start_date: "2026-07-06T00:00:00Z", scheduled_end_date: "2026-07-10T00:00:00Z" }
              as: RegulatoryAffairsManager
              captures: { ex4: $.data.id, ex4_v0: $.data.version }
            - call: "POST /regulatory-exams/examinations/${ex4}/first-day-items"
              payload: { request_ref: "FDL-Y", description: "x", due_date: "2026-07-15T00:00:00Z" }
              as: RegulatoryAffairsManager
              captures: { it4: $.data.id }
            - call: "POST /regulatory-exams/examinations/${ex4}/issue-first-day-letter"
              payload: {}
              as: RegulatoryAffairsManager
            - call: "POST /regulatory-exams/first-day-items/${it4}/waive"
              payload: { waived_reason: "na" }
              as: RegulatoryAffairsManager
            - call: "POST /regulatory-exams/examinations/${ex4}/begin-fieldwork"
              payload: {}
              as: RegulatoryAffairsManager
            - call: "POST /regulatory-exams/examiner-meetings"
              payload: { examination_id: "${ex4}", meeting_date: "2026-07-08T10:00:00Z", attendees: ["E", "O"], minutes_summary: "m" }
              as: RegulatoryAffairsManager
              captures: { mt4: $.data.id }
            - call: "POST /regulatory-exams/examiner-meetings/${mt4}/finalize"
              payload: {}
              as: RegulatoryAffairsManager
            - call: "POST /regulatory-exams/examinations/${ex4}/deliver-findings"
              payload: {}
              as: RegulatoryAffairsManager
            - call: "GET /regulatory-exams/examinations/${ex4}"
              as: RegulatoryAffairsManager
              captures: { ex4_v1: $.data.version }
            - call: "POST /regulatory-exams/examinations/${ex4}/issues"
              payload: { issue_ref: "MRA-Y", classification: "MRA", severity: "HIGH", due_date: "2026-09-01T00:00:00Z", expected_examination_version: "${ex4_v1}" }
              as: RegulatoryAffairsManager
              captures: { iss4: $.data.id }
            - call: "POST /regulatory-exams/examinations/${ex4}/open-remediation"
              payload: {}
              as: RegulatoryAffairsManager
            - call: "POST /regulatory-exams/officers"
              payload: { full_name: "O4", email: "o4@x", officer_role_title: "CRO" }
              as: PlatformAdmin
              captures: { off4: $.data.id }
            - call: "POST /regulatory-exams/reviewers"
              payload: { full_name: "R4", email: "r4@x", certification_level: "L1" }
              as: PlatformAdmin
              captures: { rev4: $.data.id }
            - call: "POST /regulatory-exams/issues/${iss4}/remediation-plans"
              payload: { owner_user_id: "${off4}", root_cause_narrative: "c", corrective_action_summary: "s" }
