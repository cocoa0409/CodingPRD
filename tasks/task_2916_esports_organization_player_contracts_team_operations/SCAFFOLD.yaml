    code: 201
    input: [organization_id, league_id, tournament_name, placement, gross_prize_cents, tournament_end_at]
    output: PrizeDistribution
    side_effects: ["distribution_status DRAFT", "unallocated_cents set to gross_prize_cents"]
  - method: GET
    path: "/prize-distributions/{id}"
    description: "Read one distribution with its waterfall figures"
    roles: [LeagueAdmin, GeneralManager, FinanceOfficer]
