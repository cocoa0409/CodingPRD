  - { id: ERR_GRANT_EXHAUSTED, http: 402, condition: "Claim total_awarded_cents exceeds program_year.grant_remaining_cents at reconcile" }

# =============================================================================
# 1.7 RBAC Matrix
# =============================================================================
roles:
  - name: DistrictProgramAdmin
    description: "District farm-to-school program administrator; owns program setup, agreements, invoice adjudication, farm approvals"
    identity: opaque
    exclusive_operations:
      - "POST /f2s/program-years, /open, /close"
      - "POST /f2s/farms, /f2s/farms/{id}/approve, /reinstate"
      - "POST /f2s/products, /f2s/products/{id}/discontinue"
      - "POST /f2s/offerings/{id}/verify, /reject"
      - "POST /f2s/forecast-lines"
      - "POST /f2s/kitchens"
      - "POST /f2s/planting-agreements"
      - "POST /f2s/deliveries/{id}/resolve-dispute"
      - "POST /f2s/invoices/{id}/approve, /reject, /pay"
      - "POST /f2s/substitution-requests"
      - "POST /f2s/_clock/set_current_utc"
    shared_operations:
      - "All GET endpoints"
      - "POST /f2s/farms/{id}/suspend (with StateGrantAuditor)"
      - "POST /f2s/planting-agreements/{id}/cancel (with FarmManager)"
      - "POST /f2s/planting-agreements/{id}/amendments, amendment accept/reject (with FarmManager, counterparty rule)"
  - name: FarmManager
    description: "Manager of one grower farm; X-User-ID equals the Farm id"
    identity: "entity_backed:Farm"
    exclusive_operations:
      - "POST /f2s/compliance-documents (own farm)"
      - "POST /f2s/offerings, /submit, /withdraw (own farm)"
      - "POST /f2s/planting-agreements/{id}/sign (own farm's agreement)"
      - "POST /f2s/deliveries, /check-in? no: deliveries create/cancel/dispute (own agreements)"
      - "POST /f2s/invoices, /submit, /revise (own farm)"
    shared_operations:
      - "All GET endpoints"
      - "POST /f2s/planting-agreements/{id}/cancel, amendments, amendment accept/reject (counterparty rule)"
  - name: KitchenManager
    description: "Manager of one school kitchen; X-User-ID equals the Kitchen id"
    identity: "entity_backed:Kitchen"
    exclusive_operations:
      - "POST /f2s/receiving-windows, DELETE /f2s/receiving-windows/{id} (own kitchen)"
      - "POST /f2s/deliveries/{id}/check-in, /accept, /reject (own kitchen)"
    shared_operations: ["All GET endpoints"]
  - name: ClaimsCoordinator
    description: "District staff who assembles and submits reimbursement claims; segregated from invoice approvers"
    identity: opaque
    exclusive_operations:
      - "POST /f2s/reimbursement-claims"
      - "POST /f2s/reimbursement-claims/{id}/lines"
      - "POST /f2s/reimbursement-claims/{id}/submit"
    shared_operations: ["All GET endpoints"]
  - name: StateGrantAuditor
    description: "State grant program auditor; adjudicates claims, revokes compliance documents, approves substitutions"
    identity: opaque
    exclusive_operations:
      - "POST /f2s/compliance-documents/{id}/revoke"
      - "POST /f2s/reimbursement-claims/{id}/start-review, /reconcile, /reverse"
      - "POST /f2s/claim-lines/{id}/allow, /disallow"
      - "POST /f2s/substitution-requests/{id}/approve, /deny"
    shared_operations:
      - "All GET endpoints"
      - "POST /f2s/farms/{id}/suspend (with DistrictProgramAdmin)"
