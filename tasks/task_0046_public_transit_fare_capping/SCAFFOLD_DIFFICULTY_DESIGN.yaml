              as: Rider
              as_user_id: "${r8}"
              captures: { w1: $.data.id }
            - call: "POST /taps"
              payload: { rider_id: "${r8}", fare_week_id: "${w1}", funding_source_id: "${f8}", tapped_at: "2026-06-01T09:00:00Z" }
              as: Rider
              as_user_id: "${r8}"
