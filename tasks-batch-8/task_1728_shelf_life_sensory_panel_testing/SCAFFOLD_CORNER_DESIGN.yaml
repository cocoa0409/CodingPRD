        distinguishing_aspect: "Each role is denied another role's exclusive operation: SensoryScientist cannot approve-design (LabDirector), LabAnalyst cannot score (Panelist), QAOfficer cannot create panelists (PanelCoordinator), Panelist cannot post lab results (LabAnalyst), Client cannot create chambers (LabDirector) — all 403 ERR_FORBIDDEN_ROLE."
