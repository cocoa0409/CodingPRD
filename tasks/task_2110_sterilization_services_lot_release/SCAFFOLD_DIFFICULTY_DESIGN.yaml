              as: RegulatoryAdmin
              captures: { p1_id: $.data.id }
            - call: "POST /sterilization/products"
              payload: { customer_id: "${cust_id}", product_code: "P2", pallet_mass_kg: 90.0, pallet_volume_m3: 0.8, max_allowed_dose_kgy: 45.0, max_cumulative_dose_kgy: 60.0, eto_residual_limit_ppm: 4.0, ech_residual_limit_ppm: 9.0, requires_aeration: false }
              as: RegulatoryAdmin
              captures: { p2_id: $.data.id }
            - call: "POST /sterilization/emission-permits"
              payload: { permit_code: "AP-2026", permit_year: 2026, annual_allowance_kg: 1000.0, max_concurrent_eto_cycles: 2 }
              as: RegulatoryAdmin
