            - call: "POST /voip/number-reservations"
              payload: { block_id: "${blk_id}", account_id: "${acct_id}", purpose: "NEW_LINE", reserved_from: "2026-08-09T00:00:00Z", reserved_until: "2026-08-11T00:00:00Z", expected_number_block_version: "${blk_v3}", number_id: "${pn3_id}" }
              as: NumberingAdmin
          assert:
