          - "errors[ERR_FACTOR_SET_INCONSISTENT]"
          - "calculations.grade_determination"
        distinguishing_aspect: "The inconsistency is between two body fields that are each individually in range, so it cannot be caught by schema validation; and because equal values are legal the check must be strictly greater-than."
        test_recipe:
