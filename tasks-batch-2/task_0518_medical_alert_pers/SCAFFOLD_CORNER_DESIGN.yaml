        claim_type: violation_to_error
        grounds: ["validations[priority=15]", "errors[ERR_CONTACT_TREE_INVALID]", entities.EmergencyContact.fields.priority_rank]
        distinguishing_aspect: "Adding a second EmergencyContact with a duplicate priority_rank for the same subscriber returns ERR_CONTACT_TREE_INVALID (422)."
