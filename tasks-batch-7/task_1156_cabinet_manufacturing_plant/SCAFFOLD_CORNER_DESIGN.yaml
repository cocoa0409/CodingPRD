      - name: response_envelope_shape_for_success_and_error
        claim_type: response_envelope
        grounds: [response_envelope]
        distinguishing_aspect: "Success bodies carry meta.api_request_id, meta.api_request_timestamp, response_type object|array, and data; error bodies carry response_type error and data.error_id + data.message."
        test_recipe:
          setup: ["empty DB"]
          setup_api_calls: []
          trigger:
            - call: "POST /kcma/door-styles"
              payload: { style_code: "DS-E", name: "Env", construction: "SLAB", base_list_price_cents: 1000 }
              as: PlantAdmin
            - call: "GET /kcma/orders/8a3e1c0b-2f4d-4a91-9c8b-12e7b6a0f1d2"
              as: PlantAdmin
              captures: { err: $.data.error_id, msg: $.data.message }
          assert:
            - "success response: meta.api_request_id present, response_type == object, data present"
            - "error response: response_type == error, data.error_id == ERR_ORDER_NOT_FOUND, data.message non-empty"

