            - { call: "POST /mariners/${m_id}/drug-tests/${dt_id}/record-result", payload: { result: "NEGATIVE", collected_date: "2026-01-02T00:00:00Z" }, as: CredentialingOfficer }
            - { call: "POST /mariners/${m_id}/activate", payload: {}, as: FleetAdmin }
            - { call: "POST /training-courses", payload: { course_code: "CC6-C1", title: "Pricey", provider: "MaritimeEd", start_date: "2026-09-01T00:00:00Z", end_date: "2026-09-05T00:00:00Z", seat_capacity: 5, cost_cents: 250000 }, as: FleetAdmin, captures: { course_id: $.data.id } }
            - { call: "POST /training-courses/${course_id}/enrollments", payload: {}, as: Mariner, as_user_id: "${m_id}", captures: { e_id: $.data.id } }
            - { call: "POST /training-enrollments/${e_id}/approve", payload: {}, as: CrewingManager, as_user_id: "cm-066" }
          trigger:
            - { call: "POST /training-enrollments/${e_id}/enroll", payload: {}, as: FleetAdmin, captures: { err: $.data.error_id } }
            - { call: "GET /mariners/${m_id}/training-budgets", as: FleetAdmin, captures: { budgets: $.data } }
          assert:
            - "err == ERR_TRAINING_BUDGET_EXCEEDED (402; provisional 160000 > cap 1000)"
            - "budgets == [] (no budget row persisted on a failed enroll)"
            - "enrollment ${e_id} remains APPROVED and course seats_reserved == 0"
