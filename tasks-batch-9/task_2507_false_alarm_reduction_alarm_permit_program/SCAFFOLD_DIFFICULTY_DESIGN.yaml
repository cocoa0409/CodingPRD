  - rule_id: boundary_precision_check
    instances:
      - name: per_incident_cap_is_strict_so_a_fee_landing_exactly_on_the_cap_is_not_flagged_capped
        grounds:
          - calculations.escalating_false_alarm_fee
          - entities.FalseAlarmIncident.fields.fee_basis
          - calculations.invoice_assembly
        distinguishing_aspect: >-
          A SCHOOL incident priced at 12000 x 1.25 = 15000 cents hits the 15000-cent
          per_incident_fee_cap_cents exactly, and because the cap test is strict (raw > cap) it must
          record cap_applied = false, while the next incident priced at 12800 x 1.25 = 16000 is
          clamped to the same 15000 cents with cap_applied = true - identical money, opposite flag.
        test_recipe:
          setup:
            - "One ACTIVE FeeSchedule with free_alarm_allowance 0, tiers [1-1: 12000, 2+: 12800], per_incident_fee_cap_cents 15000, SCHOOL multiplier 1.25, probation_threshold_count 4, suspension_threshold_count 6, invoice_due_days 3650."
            - "One SCHOOL AlarmSite with two ACTIVE ECV-callable contacts and two PERMITTED systems (each dispatch request stays open on its own system)."
            - "Both requests use TWO_CALL_ECV with two distinct contacts, so no non-ECV surcharge applies, and both systems are permitted at occurrence, so no unpermitted multiplier applies."
          setup_api_calls:
            - {call: "POST /false-alarm-program/_clock/set_current_utc", payload: {current_utc: "2026-03-01T00:00:00Z"}, as: ProgramAdministrator}
            - call: "POST /false-alarm-program/fee-schedules"
              payload:
                <<: *fs_base
                schedule_code: "FS-2507-CAPEQ"
                effective_from: "2026-03-01T00:00:00Z"
                free_alarm_allowance: 0
                per_incident_fee_cap_cents: 15000
                invoice_due_days: 3650
                fee_tiers:
                  - {from_index: 1, to_index: 1, base_fee_cents: 12000}
                  - {from_index: 2, to_index: null, base_fee_cents: 12800}
              as: ProgramAdministrator
              captures: {sched_cap: $.data.id}
            - {call: "POST /false-alarm-program/fee-schedules/${sched_cap}/activate", payload: {}, as: ProgramAdministrator}
