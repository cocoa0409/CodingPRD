            - { call: "POST /fraudops/fraud-alerts/${al}/claim", as: FraudAnalyst, as_user_id: "analyst-1" }
            - { call: "POST /fraudops/verification-contacts", payload: { alert_id: "${al}", channel: "VOICE" }, as: FraudAnalyst, as_user_id: "analyst-1", captures: { vc: "$.data.id" } }
            - { call: "POST /fraudops/verification-contacts/${vc}/complete", payload: { outcome: "CONFIRMED_FRAUD" }, as: FraudAnalyst, as_user_id: "analyst-1" }
            - { call: "POST /fraudops/fraud-alerts/${al}/resolve", payload: { resolution: "FRAUD" }, as: FraudAnalyst, as_user_id: "analyst-1" }
            - { call: "POST /fraudops/loss-entries", payload: { account_id: "${acct}", transaction_ids: ["${t}"] }, as: LossAccountant, captures: { loss: "$.data.id" } }
            - { call: "POST /fraudops/loss-entries/${loss}/book", as: LossAccountant, as_user_id: "acct-1" }
            - { call: "POST /fraudops/loss-entries/${loss}/finalize", payload: { final_amount_cents: 110000 }, as: LossAccountant, as_user_id: "acct-1" }
            - { call: "GET /fraudops/accounts/${acct}", as: FraudOpsManager, captures: { tier_mid: "$.data.risk_tier" } }
            - { call: "POST /fraudops/recovery-filings", payload: { loss_entry_id: "${loss}", network_reference: "NR-TC4", claimed_cents: 110000 }, as: RecoverySpecialist, as_user_id: "rec-1", captures: { fil: "$.data.id" } }
            - { call: "POST /fraudops/recovery-filings/${fil}/mark-outcome", payload: { outcome: "ACCEPTED" }, as: RecoverySpecialist }
