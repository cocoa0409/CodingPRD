      - name: staff_credential_error_outranks_staff_schedule_conflict_on_coach_assignment
        grounds:
          - validations[priority=11]
          - validations[priority=13]
          - errors.ERR_STAFF_CREDENTIAL_LAPSED
          - errors.ERR_STAFF_SCHEDULE_CONFLICT
          - state_machines.Certification.status.EXPIRING_to_LAPSED
        distinguishing_aspect: |
          A third error-category pair — business_safety(11) vs business_temporal(13) —
          asserted on a write endpoint that carries OCC: the coach is simultaneously LAPSED
          and already booked on a closed-interval-overlapping session, and the credential
          defect must be reported before the overlap. The overlap survives the lapse cascade
          only because the earlier session's start_at is already behind the logical clock,
          which the cascade deliberately skips.
        test_recipe:
          setup:
            - "One StaffMember with liability insurance to 2027-12-31 and a single CSCS certification expiring 2026-08-15, created while the clock is 2026-08-01 (so it is EXPIRING, not LAPSED, and may be assigned)."
            - "GroupSession A, ONSITE 2026-08-25T10:00Z-11:00Z, station_count 3, max_athletes 10, GENERAL_PREP, with that staff member assigned (STAFFED)."
            - "The clock is then advanced to 2026-09-01T00:00:00Z, which is past A's start_at, and a credential review lapses the certification. The lapse cascade only unassigns staff from sessions whose start_at is still in the future, so the staff member remains on A."
            - "GroupSession B, ONSITE 2026-08-25T10:30Z-11:30Z, created after the lapse; its interval overlaps A as a closed interval."
          setup_api_calls:
            - call: "POST /staff-members"
              payload: { full_name: "Yusuf Demir", role_title: "HEAD_COACH", liability_insurance_expires_on: "2027-12-31" }
