      - name: participant_cannot_cancel_others_registration_returns_403
        claim_type: rbac_deny
        grounds:
          - roles
          - validations[priority=2]
        distinguishing_aspect: "Participant role may cancel, but only own registrations: P2 cancelling P1's registration gets ERR_FORBIDDEN (ownership mismatch on entity_backed identity)."
