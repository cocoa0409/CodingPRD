# =============================================================================
# SCAFFOLD_CORNER_DESIGN.yaml — §1.9 Coverage Index (non-difficulty claims)
# Film Festival Submission & Programming. Breadth coverage of §1.1–§1.7 beyond
# the §1.8 difficulty instances. Same replay contract: every chain runs from
# empty DB against SCAFFOLD.yaml §1.5; clock default 2026-08-01T00:00:00Z.
# =============================================================================
scaffold_corner_design:
  # ===========================================================================
  - section: entities
    instances:
      - name: submission_create_submitter_id_input_ignored
        claim_type: system_fields
        grounds: [entities.Submission.fields.submitter_id, endpoints."POST /festival/submissions"]
        distinguishing_aspect: "submitter_id is system-sourced: a body value must be ignored and X-User-ID wins."
        test_recipe:
          setup: ["Edition INTAKE_OPEN with SHORT_FILM config; submitter S registered"]
          setup_api_calls:
            - { call: "POST /festival/editions", payload: { year: 2027, host_country_code: "US", intake_open_at: "2026-08-01T00:00:00Z", early_deadline_at: "2026-08-15T00:00:00Z", regular_deadline_at: "2026-09-01T00:00:00Z", late_deadline_at: "2026-09-15T00:00:00Z", rsvp_window_days: 7, festival_start_at: "2027-01-21T00:00:00Z", festival_end_at: "2027-02-01T00:00:00Z", hotel_nights_pool: 10, travel_budget_cents: 400000, prize_pool_cents: 5000000 }, as: FESTIVAL_ADMIN, captures: { ed: $.data.id } }
            - { call: "POST /festival/category-configs", payload: { edition_id: "${ed}", category: SHORT_FILM, min_runtime_minutes: 1, max_runtime_minutes: 40, premiere_requirement: NONE, completion_cutoff: "2025-01-01", early_fee_cents: 4000, regular_fee_cents: 5500, late_fee_cents: 7000, screener_count_required: 2 }, as: FESTIVAL_ADMIN }
            - { call: "POST /festival/editions/${ed}/advance", payload: { to_status: INTAKE_OPEN }, as: FESTIVAL_ADMIN }
            - { call: "POST /festival/submitters", payload: { legal_name: "Ivy Sol", email: "ivy@example.com", country_of_residence: "US" }, as: PUBLIC, captures: { subm: $.data.id } }
          trigger:
            - { call: "POST /festival/submissions", payload: { edition_id: "${ed}", category: SHORT_FILM, title: "Ignored Field", runtime_minutes: 20, completion_date: "2025-06-01", premiere_status: NONE, production_company: "Sol Films", format: DCP_2K, submitter_id: "00000000-0000-0000-0000-000000000000" }, as: FILMMAKER, as_user_id: "${subm}", captures: { film: $.data.id, owner: $.data.submitter_id, st: $.data.status, pst: $.data.payment_status } }
          assert:
            - "Submission owner == ${subm} (header), NOT the body-supplied 00000000 uuid"
            - "defaults applied: status == DRAFT, payment_status == UNPAID, needs_info_resolved == false, award_names == []"

      - name: submission_create_missing_required_title
        claim_type: required_fields
        grounds:
          - "entities.Submission.fields.title"
          - "errors[ERR_VALIDATION]"
        distinguishing_aspect: "Omitting required input title is rejected 400 ERR_VALIDATION before any business rule runs (priority 0)."
        test_recipe:
          setup: ["Edition INTAKE_OPEN with SHORT_FILM config; submitter S"]
          setup_api_calls:
            - { call: "POST /festival/editions", payload: { year: 2027, host_country_code: "US", intake_open_at: "2026-08-01T00:00:00Z", early_deadline_at: "2026-08-15T00:00:00Z", regular_deadline_at: "2026-09-01T00:00:00Z", late_deadline_at: "2026-09-15T00:00:00Z", rsvp_window_days: 7, festival_start_at: "2027-01-21T00:00:00Z", festival_end_at: "2027-02-01T00:00:00Z", hotel_nights_pool: 10, travel_budget_cents: 400000, prize_pool_cents: 5000000 }, as: FESTIVAL_ADMIN, captures: { ed: $.data.id } }
            - { call: "POST /festival/category-configs", payload: { edition_id: "${ed}", category: SHORT_FILM, min_runtime_minutes: 1, max_runtime_minutes: 40, premiere_requirement: NONE, completion_cutoff: "2025-01-01", early_fee_cents: 4000, regular_fee_cents: 5500, late_fee_cents: 7000, screener_count_required: 2 }, as: FESTIVAL_ADMIN }
            - { call: "POST /festival/editions/${ed}/advance", payload: { to_status: INTAKE_OPEN }, as: FESTIVAL_ADMIN }
            - { call: "POST /festival/submitters", payload: { legal_name: "Ivy Sol", email: "ivy@example.com", country_of_residence: "US" }, as: PUBLIC, captures: { subm: $.data.id } }
          trigger:
            - { call: "POST /festival/submissions", payload: { edition_id: "${ed}", category: SHORT_FILM, runtime_minutes: 20, completion_date: "2025-06-01", premiere_status: NONE, production_company: "Sol Films", format: DCP_2K }, as: FILMMAKER, as_user_id: "${subm}", captures: { err: $.data.error_id } }
          assert:
            - "rejected: err == ERR_VALIDATION, http 400"

      - name: submitter_duplicate_email_rejected
        claim_type: type_constraints
        grounds:
          - "entities.Submitter.fields.email"
          - "errors[ERR_DUPLICATE_EMAIL]"
        distinguishing_aspect: "Second registration with the same email collides; different email succeeds."
        test_recipe:
          setup: ["One submitter registered with email ivy@example.com"]
          setup_api_calls:
            - { call: "POST /festival/submitters", payload: { legal_name: "Ivy Sol", email: "ivy@example.com", country_of_residence: "US" }, as: PUBLIC, captures: { subm: $.data.id } }
          trigger:
            - { call: "POST /festival/submitters", payload: { legal_name: "Ivy Clone", email: "ivy@example.com", country_of_residence: "CA" }, as: PUBLIC, captures: { err: $.data.error_id } }
            - { call: "POST /festival/submitters", payload: { legal_name: "Other", email: "other@example.com", country_of_residence: "CA" }, as: PUBLIC, captures: { ok: $.data.id } }
          assert:
            - "duplicate email rejected: err == ERR_DUPLICATE_EMAIL (409)"
            - "distinct email registers fine (ok is a uuid)"

      - name: programmer_create_defaults_applied
        claim_type: defaults
        grounds: [entities.Programmer.fields.active, entities.Programmer.fields.max_active_assignments]
        distinguishing_aspect: "Omitting optional fields yields active=true, max_active_assignments=12, coi_production_companies=[], active_assignment_count=0."
        test_recipe:
          setup: ["empty DB"]
          setup_api_calls: []
          trigger:
            - { call: "POST /festival/programmers", payload: { display_name: "Default Dan", email: "dan@example.com", seniority: STAFF, categories_covered: [SHORT_FILM] }, as: FESTIVAL_ADMIN, captures: { act: $.data.active, cap: $.data.max_active_assignments, coi: $.data.coi_production_companies, cnt: $.data.active_assignment_count } }
          assert:
            - "act == true, cap == 12, coi == [], cnt == 0"

      - name: edition_get_not_found
        claim_type: not_found
        grounds:
          - "errors[ERR_NOT_FOUND]"
          - "validations[priority=3]"
        distinguishing_aspect: "GET with a well-formed but nonexistent uuid returns 404 ERR_NOT_FOUND."
        test_recipe:
          setup: ["empty DB"]
          setup_api_calls: []
          trigger:
            - { call: "GET /festival/editions/00000000-0000-0000-0000-000000000000", payload: {}, as: FESTIVAL_ADMIN, captures: { err: $.data.error_id } }
          assert:
            - "err == ERR_NOT_FOUND, http 404"

      - name: submission_list_pagination_envelope
        claim_type: listing
        grounds: [response_envelope, endpoints."GET /festival/submissions"]
        distinguishing_aspect: "limit/offset/total_count/has_more behave per envelope defaults: page 1 of 2 with limit 2 over 3 rows, then the remainder."
        test_recipe:
          setup: ["Edition INTAKE_OPEN; one submitter with three DRAFT submissions"]
          setup_api_calls:
            - { call: "POST /festival/editions", payload: { year: 2027, host_country_code: "US", intake_open_at: "2026-08-01T00:00:00Z", early_deadline_at: "2026-08-15T00:00:00Z", regular_deadline_at: "2026-09-01T00:00:00Z", late_deadline_at: "2026-09-15T00:00:00Z", rsvp_window_days: 7, festival_start_at: "2027-01-21T00:00:00Z", festival_end_at: "2027-02-01T00:00:00Z", hotel_nights_pool: 10, travel_budget_cents: 400000, prize_pool_cents: 5000000 }, as: FESTIVAL_ADMIN, captures: { ed: $.data.id } }
            - { call: "POST /festival/category-configs", payload: { edition_id: "${ed}", category: SHORT_FILM, min_runtime_minutes: 1, max_runtime_minutes: 40, premiere_requirement: NONE, completion_cutoff: "2025-01-01", early_fee_cents: 4000, regular_fee_cents: 5500, late_fee_cents: 7000, screener_count_required: 2 }, as: FESTIVAL_ADMIN }
            - { call: "POST /festival/editions/${ed}/advance", payload: { to_status: INTAKE_OPEN }, as: FESTIVAL_ADMIN }
            - { call: "POST /festival/submitters", payload: { legal_name: "Ivy Sol", email: "ivy@example.com", country_of_residence: "US" }, as: PUBLIC, captures: { subm: $.data.id } }
            - { call: "POST /festival/submissions", payload: { edition_id: "${ed}", category: SHORT_FILM, title: "P1", runtime_minutes: 20, completion_date: "2025-06-01", premiere_status: NONE, production_company: "Sol", format: DCP_2K }, as: FILMMAKER, as_user_id: "${subm}" }
            - { call: "POST /festival/submissions", payload: { edition_id: "${ed}", category: SHORT_FILM, title: "P2", runtime_minutes: 20, completion_date: "2025-06-01", premiere_status: NONE, production_company: "Sol", format: DCP_2K }, as: FILMMAKER, as_user_id: "${subm}" }
            - { call: "POST /festival/submissions", payload: { edition_id: "${ed}", category: SHORT_FILM, title: "P3", runtime_minutes: 20, completion_date: "2025-06-01", premiere_status: NONE, production_company: "Sol", format: DCP_2K }, as: FILMMAKER, as_user_id: "${subm}" }
          trigger:
            - { call: "GET /festival/submissions", payload: { edition_id: "${ed}", limit: 2, offset: 0 }, as: FESTIVAL_ADMIN, captures: { page1: $.data } }
            - { call: "GET /festival/submissions", payload: { edition_id: "${ed}", limit: 2, offset: 2 }, as: FESTIVAL_ADMIN }
          assert:
            - "page 1: response_type array, 2 items, total_count == 3, has_more == true"
            - "page 2: 1 item, total_count == 3, has_more == false"

      - name: travel_package_auto_created_draft_on_accept
        claim_type: computed_fields
        grounds: [state_machines.SlateEntry.INVITED_to_CONFIRMED, entities.TravelPackage.fields.status]
        distinguishing_aspect: "Cascade-created child (never in any creation response) is discoverable via the filtered-list GET and starts DRAFT with zeroed computed allocation fields."
        test_recipe:
          setup: ["Full pipeline to NOTIFICATION: one short CONFIRMED via accept"]
          setup_api_calls:
            - { call: "POST /festival/editions", payload: { year: 2027, host_country_code: "US", intake_open_at: "2026-08-01T00:00:00Z", early_deadline_at: "2026-08-15T00:00:00Z", regular_deadline_at: "2026-09-01T00:00:00Z", late_deadline_at: "2026-09-15T00:00:00Z", rsvp_window_days: 7, festival_start_at: "2027-01-21T00:00:00Z", festival_end_at: "2027-02-01T00:00:00Z", hotel_nights_pool: 10, travel_budget_cents: 400000, prize_pool_cents: 5000000 }, as: FESTIVAL_ADMIN, captures: { ed: $.data.id } }
            - { call: "POST /festival/category-configs", payload: { edition_id: "${ed}", category: SHORT_FILM, min_runtime_minutes: 1, max_runtime_minutes: 40, premiere_requirement: NONE, completion_cutoff: "2025-01-01", early_fee_cents: 4000, regular_fee_cents: 5500, late_fee_cents: 7000, screener_count_required: 2 }, as: FESTIVAL_ADMIN }
            - { call: "POST /festival/editions/${ed}/advance", payload: { to_status: INTAKE_OPEN }, as: FESTIVAL_ADMIN }
            - { call: "POST /festival/submitters", payload: { legal_name: "Ann Ash", email: "ann@example.com", country_of_residence: "US" }, as: PUBLIC, captures: { subm: $.data.id } }
            - { call: "POST /festival/submissions", payload: { edition_id: "${ed}", category: SHORT_FILM, title: "Cascade", runtime_minutes: 20, completion_date: "2025-06-01", premiere_status: NONE, production_company: "A Co", format: DCP_2K }, as: FILMMAKER, as_user_id: "${subm}", captures: { film: $.data.id } }
            - { call: "POST /festival/submissions/${film}/checkout", payload: {}, as: FILMMAKER, as_user_id: "${subm}", captures: { pay: $.data.id } }
            - { call: "POST /festival/_payments/simulate", payload: { fee_payment_id: "${pay}", outcome: SUCCEEDED }, as: FESTIVAL_ADMIN }
            - { call: "POST /festival/submissions/${film}/eligibility-decision", payload: { decision: ELIGIBLE }, as: FESTIVAL_ADMIN }
            - { call: "POST /festival/editions/${ed}/advance", payload: { to_status: INTAKE_CLOSED }, as: FESTIVAL_ADMIN }
            - { call: "POST /festival/editions/${ed}/advance", payload: { to_status: SCREENING }, as: FESTIVAL_ADMIN }
            - { call: "POST /festival/programmers", payload: { display_name: "Screener One", email: "s1@example.com", seniority: STAFF, categories_covered: [SHORT_FILM] }, as: FESTIVAL_ADMIN, captures: { p1: $.data.id } }
            - { call: "POST /festival/programmers", payload: { display_name: "Screener Two", email: "s2@example.com", seniority: STAFF, categories_covered: [SHORT_FILM] }, as: FESTIVAL_ADMIN, captures: { p2: $.data.id } }
            - { call: "POST /festival/screener-assignments", payload: { submission_id: "${film}", programmer_id: "${p1}", due_at: "2026-11-01T00:00:00Z" }, as: PROGRAM_CHAIR, as_user_id: "chair-1", captures: { a1: $.data.id } }
            - { call: "POST /festival/screener-assignments", payload: { submission_id: "${film}", programmer_id: "${p2}", due_at: "2026-11-01T00:00:00Z" }, as: PROGRAM_CHAIR, as_user_id: "chair-1", captures: { a2: $.data.id } }
            - { call: "POST /festival/screener-assignments/${a1}/scores", payload: { originality: 8, craft: 8, story: 8, overall: 8, recommendation: ADVOCATE }, as: PROGRAMMER, as_user_id: "${p1}" }
            - { call: "POST /festival/screener-assignments/${a2}/scores", payload: { originality: 9, craft: 9, story: 9, overall: 9, recommendation: ADVOCATE }, as: PROGRAMMER, as_user_id: "${p2}" }
            - { call: "POST /festival/editions/${ed}/advance", payload: { to_status: DELIBERATION }, as: FESTIVAL_ADMIN }
            - { call: "POST /festival/slates", payload: { edition_id: "${ed}", section: SHORTS, capacity_slots: 1 }, as: PROGRAM_CHAIR, as_user_id: "chair-1", captures: { slate: $.data.id } }
            - { call: "POST /festival/slates/${slate}/deliberate", payload: {}, as: PROGRAM_CHAIR, as_user_id: "chair-1", captures: { slv: $.data.version } }
            - { call: "POST /festival/slates/${slate}/entries", payload: { submission_id: "${film}", expected_slate_version: "${slv}" }, as: PROGRAM_CHAIR, as_user_id: "chair-1", captures: { entry: $.data.id } }
            - { call: "POST /festival/slates/${slate}/lock", payload: {}, as: FESTIVAL_DIRECTOR, as_user_id: "dir-1" }
            - { call: "POST /festival/editions/${ed}/advance", payload: { to_status: SLATE_LOCKED }, as: FESTIVAL_ADMIN }
            - { call: "POST /festival/editions/${ed}/advance", payload: { to_status: NOTIFICATION }, as: FESTIVAL_ADMIN }
            - { call: "POST /festival/editions/${ed}/issue-invitations", payload: {}, as: FESTIVAL_DIRECTOR, as_user_id: "dir-1" }
          trigger:
            - { call: "POST /festival/slate-entries/${entry}/respond", payload: { accept: true }, as: FILMMAKER, as_user_id: "${subm}", captures: { est: $.data.status } }
            - { call: "GET /festival/travel-packages", payload: { submission_id: "${film}" }, as: TRAVEL_COORDINATOR, captures: { pkglist: $.data, pst: "$.data[0].status", alloc: "$.data[0].hotel_nights_allocated" } }
            - { call: "GET /festival/exhibition-agreements", payload: { submission_id: "${film}" }, as: FESTIVAL_DIRECTOR, captures: { agst: "$.data[0].status" } }
          assert:
            - "entry CONFIRMED after accept"
            - "exactly one TravelPackage exists for the film: DRAFT, hotel_nights_allocated == 0, stipend_cents == 0"
            - "exactly one ExhibitionAgreement exists: status DRAFT"

      - name: category_config_duplicate_rejected
        claim_type: parent_relationships
        grounds:
          - "entities.CategoryConfig.fields.category"
          - "errors[ERR_DUPLICATE_CATEGORY_CONFIG]"
        distinguishing_aspect: "(edition_id, category) uniqueness: second SHORT_FILM config on same edition fails; same category on a DIFFERENT edition succeeds."
        test_recipe:
          setup: ["Edition E with SHORT_FILM config; second edition E2 without configs"]
          setup_api_calls:
            - { call: "POST /festival/editions", payload: { year: 2027, host_country_code: "US", intake_open_at: "2026-08-01T00:00:00Z", early_deadline_at: "2026-08-15T00:00:00Z", regular_deadline_at: "2026-09-01T00:00:00Z", late_deadline_at: "2026-09-15T00:00:00Z", rsvp_window_days: 7, festival_start_at: "2027-01-21T00:00:00Z", festival_end_at: "2027-02-01T00:00:00Z", hotel_nights_pool: 10, travel_budget_cents: 400000, prize_pool_cents: 5000000 }, as: FESTIVAL_ADMIN, captures: { ed: $.data.id } }
            - { call: "POST /festival/editions", payload: { year: 2028, host_country_code: "US", intake_open_at: "2026-08-01T00:00:00Z", early_deadline_at: "2026-08-15T00:00:00Z", regular_deadline_at: "2026-09-01T00:00:00Z", late_deadline_at: "2026-09-15T00:00:00Z", rsvp_window_days: 7, festival_start_at: "2027-01-21T00:00:00Z", festival_end_at: "2027-02-01T00:00:00Z", hotel_nights_pool: 10, travel_budget_cents: 400000, prize_pool_cents: 5000000 }, as: FESTIVAL_ADMIN, captures: { ed2: $.data.id } }
            - { call: "POST /festival/category-configs", payload: { edition_id: "${ed}", category: SHORT_FILM, min_runtime_minutes: 1, max_runtime_minutes: 40, premiere_requirement: NONE, completion_cutoff: "2025-01-01", early_fee_cents: 4000, regular_fee_cents: 5500, late_fee_cents: 7000 }, as: FESTIVAL_ADMIN }
          trigger:
            - { call: "POST /festival/category-configs", payload: { edition_id: "${ed}", category: SHORT_FILM, min_runtime_minutes: 1, max_runtime_minutes: 40, premiere_requirement: NONE, completion_cutoff: "2025-01-01", early_fee_cents: 4000, regular_fee_cents: 5500, late_fee_cents: 7000 }, as: FESTIVAL_ADMIN, captures: { err: $.data.error_id } }
            - { call: "POST /festival/category-configs", payload: { edition_id: "${ed2}", category: SHORT_FILM, min_runtime_minutes: 1, max_runtime_minutes: 40, premiere_requirement: NONE, completion_cutoff: "2025-01-01", early_fee_cents: 4000, regular_fee_cents: 5500, late_fee_cents: 7000 }, as: FESTIVAL_ADMIN, captures: { ok: $.data.id } }
          assert:
            - "duplicate on same edition: err == ERR_DUPLICATE_CATEGORY_CONFIG"
            - "same category on another edition: created (ok is a uuid)"

      - name: submission_duplicate_title_rules
        claim_type: type_constraints
        grounds:
          - "entities.Submission.fields.title"
          - "errors[ERR_DUPLICATE_SUBMISSION]"
        distinguishing_aspect: "(edition, submitter, title) uniqueness: same submitter + same title collides; a DIFFERENT submitter may use the same title."
        test_recipe:
          setup: ["Edition INTAKE_OPEN; submitters S1 (has film 'Dawn') and S2"]
          setup_api_calls:
            - { call: "POST /festival/editions", payload: { year: 2027, host_country_code: "US", intake_open_at: "2026-08-01T00:00:00Z", early_deadline_at: "2026-08-15T00:00:00Z", regular_deadline_at: "2026-09-01T00:00:00Z", late_deadline_at: "2026-09-15T00:00:00Z", rsvp_window_days: 7, festival_start_at: "2027-01-21T00:00:00Z", festival_end_at: "2027-02-01T00:00:00Z", hotel_nights_pool: 10, travel_budget_cents: 400000, prize_pool_cents: 5000000 }, as: FESTIVAL_ADMIN, captures: { ed: $.data.id } }
            - { call: "POST /festival/category-configs", payload: { edition_id: "${ed}", category: SHORT_FILM, min_runtime_minutes: 1, max_runtime_minutes: 40, premiere_requirement: NONE, completion_cutoff: "2025-01-01", early_fee_cents: 4000, regular_fee_cents: 5500, late_fee_cents: 7000, screener_count_required: 2 }, as: FESTIVAL_ADMIN }
            - { call: "POST /festival/editions/${ed}/advance", payload: { to_status: INTAKE_OPEN }, as: FESTIVAL_ADMIN }
            - { call: "POST /festival/submitters", payload: { legal_name: "One", email: "one@example.com", country_of_residence: "US" }, as: PUBLIC, captures: { s1: $.data.id } }
            - { call: "POST /festival/submitters", payload: { legal_name: "Two", email: "two@example.com", country_of_residence: "US" }, as: PUBLIC, captures: { s2: $.data.id } }
            - { call: "POST /festival/submissions", payload: { edition_id: "${ed}", category: SHORT_FILM, title: "Dawn", runtime_minutes: 20, completion_date: "2025-06-01", premiere_status: NONE, production_company: "One Co", format: DCP_2K }, as: FILMMAKER, as_user_id: "${s1}" }
          trigger:
            - { call: "POST /festival/submissions", payload: { edition_id: "${ed}", category: SHORT_FILM, title: "Dawn", runtime_minutes: 15, completion_date: "2025-06-01", premiere_status: NONE, production_company: "One Co", format: DCP_2K }, as: FILMMAKER, as_user_id: "${s1}", captures: { err: $.data.error_id } }
            - { call: "POST /festival/submissions", payload: { edition_id: "${ed}", category: SHORT_FILM, title: "Dawn", runtime_minutes: 15, completion_date: "2025-06-01", premiere_status: NONE, production_company: "Two Co", format: DCP_2K }, as: FILMMAKER, as_user_id: "${s2}", captures: { ok: $.data.id } }
          assert:
            - "same submitter + same title: err == ERR_DUPLICATE_SUBMISSION"
            - "different submitter + same title: created"

      - name: screening_slot_window_and_shape_validation
        claim_type: type_constraints
        grounds:
          - "entities.ScreeningSlot.fields.start_at"
          - "errors[ERR_SLOT_OUTSIDE_FESTIVAL_WINDOW]"
          - "errors[ERR_VALIDATION]"
        distinguishing_aspect: "Slot before festival_start_at hits the temporal window rule; end_at <= start_at is a shape error — two different error ids for two slot-time defects."
        test_recipe:
          setup: ["Edition SETUP; venue created"]
          setup_api_calls:
            - { call: "POST /festival/editions", payload: { year: 2027, host_country_code: "US", intake_open_at: "2026-08-01T00:00:00Z", early_deadline_at: "2026-08-15T00:00:00Z", regular_deadline_at: "2026-09-01T00:00:00Z", late_deadline_at: "2026-09-15T00:00:00Z", rsvp_window_days: 7, festival_start_at: "2027-01-21T00:00:00Z", festival_end_at: "2027-02-01T00:00:00Z", hotel_nights_pool: 10, travel_budget_cents: 400000, prize_pool_cents: 5000000 }, as: FESTIVAL_ADMIN, captures: { ed: $.data.id } }
            - { call: "POST /festival/venues", payload: { edition_id: "${ed}", name: "Eccles", seat_capacity: 500, formats_supported: [DCP_2K], turnover_minutes: 30 }, as: FESTIVAL_ADMIN, captures: { ven: $.data.id, vv: $.data.version } }
          trigger:
