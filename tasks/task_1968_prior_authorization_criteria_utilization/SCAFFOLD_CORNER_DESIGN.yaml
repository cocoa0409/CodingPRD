      - name: immediate_consistency_on_decision_response
        claim_type: immediate_consistency
        grounds: [complexity_profile.consistency_model, "endpoints[POST /um/prior-auth-requests/{id}/reviewer-decision]"]
        distinguishing_aspect: "Immediate consistency: the reviewer-decision response itself carries status APPROVED and determined_at == 2026-08-01T00:00:00.000Z, and the determination is visible via the list endpoint in the next call."
        test_recipe:
