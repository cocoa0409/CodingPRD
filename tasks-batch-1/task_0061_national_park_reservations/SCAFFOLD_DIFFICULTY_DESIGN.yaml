              as_user_id: "${pa_id}"
              captures: { th_id: $.data.id }
            - call: "POST /v1/wilderness-zones"
              payload: { park_id: "${park_id}", name: "Z17", nightly_party_quota: 5 }
              as: park_admin
              as_user_id: "${pa_id}"
              captures: { z_id: $.data.id }
            - call: "POST /v1/backcountry-permits"
              payload: { park_id: "${park_id}", account_id: "${v_id}", trailhead_id: "${th_id}", entry_date: "2026-06-20", nights: 1, party_size: 2, zone_nights: [ { zone_id: "${z_id}", date: "2026-06-20" } ] }
              as: visitor
              as_user_id: "${v_id}"
              captures: { permit_id: $.data.id }
            - call: "POST /v1/backcountry-permits/${permit_id}/confirm"
              payload: {}
              as: visitor
              as_user_id: "${v_id}"
          trigger:
            - call: "POST /v1/backcountry-permits/${permit_id}/cancel"
              payload: {}
              as: visitor
              as_user_id: "${v_id}"
            - call: "GET /v1/wilderness-zones/${z_id}"
              payload: {}
              as: visitor
              as_user_id: "${v_id}"
              captures: { used_after: $.data.used_by_date }
          assert:
            - "WildernessZone.${z_id}.used_by_date['2026-06-20'] == 0 (net zero after confirm+cancel)"
            - "BackcountryPermit.${permit_id}.status == cancelled"

      - name: invariant_timed_entry_slot_capacity_conserved_on_hold_cancel
        grounds:
          - state_machines.TimedEntryReservation.held_to_cancelled
          - entities.TimedEntrySlot.fields.held_count
          - entities.TimedEntrySlot.fields.booked_count
        distinguishing_aspect: |
          Conserved quantity #2 = slot occupancy (held_count + booked_count):
          placing a hold then cancelling MUST leave held_count + booked_count
          exactly at its pre-hold value (net zero), a different conserved
          quantity than zone party-nights.
        test_recipe:
          setup:
            - "Released slot capacity 3, held 0 booked 0; place a hold then cancel it."
          setup_api_calls:
            - call: "POST /v1/parks"
              payload: { code: "SHEN", name: "Shenandoah", utc_offset_minutes: -300, timed_entry_required: true }
              as: system
              captures: { park_id: $.data.id }
            - call: "POST /v1/_clock/set_current_utc"
              payload: { now_utc: "2026-06-05T08:00:00Z" }
              as: park_admin
            - call: "POST /v1/accounts"
              payload: { email: "pa18@x.com", full_name: "PA18", birth_date: "1980-01-01", role: "park_admin", home_park_id: "${park_id}" }
              as: system
              captures: { pa_id: $.data.id }
            - call: "POST /v1/accounts"
              payload: { email: "v18@x.com", full_name: "V18", birth_date: "1990-01-01" }
              as: visitor
              captures: { v_id: $.data.id }
            - call: "POST /v1/timed-entry-slots"
              payload: { park_id: "${park_id}", entry_date: "2026-06-08", window_start_local: "07:00", window_end_local: "10:00", capacity: 3, release_at: "2026-06-05T07:00:00Z", entry_fee_cents: 200 }
              as: park_admin
              as_user_id: "${pa_id}"
              captures: { slot_id: $.data.id, slot_v0: $.data.version }
            - call: "POST /v1/timed-entry-reservations"
              payload: { slot_id: "${slot_id}", account_id: "${v_id}", vehicle_plate: "CONS1", expected_slot_version: "${slot_v0}" }
              as: visitor
              as_user_id: "${v_id}"
              captures: { resv_id: $.data.id }
          trigger:
            - call: "POST /v1/timed-entry-reservations/${resv_id}/cancel"
              payload: {}
              as: visitor
              as_user_id: "${v_id}"
            - call: "GET /v1/timed-entry-slots/${slot_id}"
              payload: {}
              as: visitor
              as_user_id: "${v_id}"
              captures: { held_after: $.data.held_count, booked_after: $.data.booked_count }
          assert:
            - "TimedEntrySlot.${slot_id}.held_count == 0"
            - "TimedEntrySlot.${slot_id}.booked_count == 0"
            - "TimedEntryReservation.${resv_id}.status == cancelled"
