# ---------------------------------------------------------------------------
# 1.9 Scaffold Corner Design — vascular-access-center
#
# Breadth probe over SCAFFOLD.yaml §1.1-§1.7, walking the nine sections of
# references/claim-extraction-guide.md. Depth corners already covered by
# SCAFFOLD_DIFFICULTY_DESIGN.yaml appear as `excluded_because:` stubs.
#
# Every chain starts from an empty database. The logical clock's startup default
# is 2026-08-01T00:00:00Z (§1.5 POST /_clock/set_current_utc), so instances that
# do not set the clock are evaluated at that instant.
# ---------------------------------------------------------------------------
scaffold_corner_design:

  - section: entities
    instances:
      - name: facility_creation_seeds_the_partnership_posture_and_the_success_envelope
        claim_type: creation
        grounds:
          - entities.DialysisFacility
          - endpoints.POST_dialysis-facilities
          - response_envelope.success
        distinguishing_aspect: "A brand-new DialysisFacility is seeded ACTIVE / SILVER / score 100 with every window counter at 0 and last_scored_at null — SILVER, not GOLD, which is what makes the first scoring evaluation's grace rate 0.10."
        test_recipe:
          setup:
            - "empty database with the logical clock pinned to 2026-08-01T00:00:00Z"
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-08-01T00:00:00Z" }
              as: CenterAdmin
          trigger:
            - call: "POST /dialysis-facilities"
              payload: { name: "Corner Dialysis One", facility_code: "C-01" }
              as: CenterAdmin
              captures: { fac_id: $.data.id }
          assert:
            - "HTTP 201 with response_type == object and a meta block carrying api_request_id and api_request_timestamp"
            - "data.name == Corner Dialysis One and data.facility_code == C-01 exactly as submitted"
            - "data.contract_status == ACTIVE, data.partnership_tier == SILVER, data.partnership_score == 100"
            - "data.referral_volume_window == 0, data.raw_missed_count_window == 0, data.grace_credit_window == 0, data.adjusted_missed_count_window == 0, data.same_day_honored_window == 0"
            - "data.last_scored_at == null — the seed is not a scoring evaluation"
            - "data.id is a server-minted identifier, data.created_at and data.updated_at are populated, data.version == 1"

      - name: patient_create_without_mrn_returns_invalid_request
        claim_type: required_fields
        grounds:
          - endpoints.POST_patients
          - validations.priority_4_ERR_INVALID_REQUEST
        distinguishing_aspect: "mrn is a required input with no default, so omitting it fails at priority 4 with ERR_INVALID_REQUEST (422) and persists no Patient row."
        test_recipe:
          setup:
            - "one facility to reference"
          setup_api_calls:
            - call: "POST /dialysis-facilities"
              payload: { name: "Corner Dialysis Two", facility_code: "C-02" }
              as: CenterAdmin
              captures: { fac_id: $.data.id }
          trigger:
            - call: "POST /patients"
              payload: { full_name: "No Mrn", dialysis_facility_id: "${fac_id}", dialysis_modality: "IN_CENTER_HD", payer_program: "FEE_FOR_SERVICE" }
              as: CenterAdmin
          assert:
            - "HTTP 422 with response_type == error and data.error_id == ERR_INVALID_REQUEST"
            - "GET /dialysis-facilities/${fac_id}/patients returns total_count 0 — the rejected call created nothing"

      - name: device_lot_creation_defaults_on_hand_to_received_and_reserved_to_zero
        claim_type: defaults
        grounds:
          - entities.DeviceLot.fields.quantity_on_hand
          - entities.DeviceLot.fields.quantity_reserved
          - endpoints.POST_device-lots
        distinguishing_aspect: "received_quantity is the only stock number the client supplies; quantity_on_hand is seeded equal to it, quantity_reserved to 0, status to AVAILABLE and quarantine_reason to null."
        test_recipe:
          setup:
            - "empty database"
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-08-01T00:00:00Z" }
              as: CenterAdmin
          trigger:
            - call: "POST /device-lots"
              payload: { device_type: "STENT", catalog_code: "STN-8X60", lot_number: "CL-03", expires_on: "2027-03-31", received_quantity: 6, unit_cost_cents: 145000 }
              as: CenterAdmin
              captures: { lot_id: $.data.id }
          assert:
            - "HTTP 201 with data.received_quantity == 6, data.quantity_on_hand == 6, data.quantity_reserved == 0"
            - "data.status == AVAILABLE and data.quarantine_reason == null"
            - "data.device_type == STENT, data.lot_number == CL-03, data.expires_on == 2027-03-31, data.unit_cost_cents == 145000, data.version == 1"

      - name: patient_access_count_is_computed_and_client_input_ignored
        claim_type: computed_fields
        grounds:
          - entities.Patient.fields.access_count
          - endpoints.POST_vascular-accesses
        distinguishing_aspect: "access_count is not an input at all: a client-supplied value is discarded at create, and the field only moves when accesses are created and counted over the states {PLANNED, PLACED, MATURING, IN_USE, DYSFUNCTIONAL}."
        test_recipe:
          setup:
            - "one facility"
          setup_api_calls:
            - call: "POST /dialysis-facilities"
              payload: { name: "Corner Dialysis Four", facility_code: "C-04" }
              as: CenterAdmin
              captures: { fac_id: $.data.id }
          trigger:
            - call: "POST /patients"
              payload: { mrn: "MC-04", full_name: "Ada Kern", dialysis_facility_id: "${fac_id}", dialysis_modality: "IN_CENTER_HD", payer_program: "BUNDLED_ESRD", access_count: 9 }
              as: CenterAdmin
              captures: { pat_id: $.data.id }
            - call: "POST /vascular-accesses"
              payload: { patient_id: "${pat_id}", access_type: "AVF", laterality: "LEFT", site: "FOREARM", placed_on: "2026-06-01" }
              as: AccessCoordinator
              captures: { acc_id: $.data.id }
            - call: "GET /patients/${pat_id}"
              payload: {}
              as: CenterAdmin
          assert:
            - "the create response carries data.access_count == 0, not 9 — the submitted value is ignored, not echoed and not rejected as unknown"
            - "after the access is created GET /patients/${pat_id} returns data.access_count == 1"
            - "data.payer_program == BUNDLED_ESRD, so the value the endpoint DOES accept is honoured in the same response"

      - name: procedure_room_optional_capacities_take_their_declared_defaults
        claim_type: defaults
        grounds:
          - entities.ProcedureRoom.fields.turnover_buffer_min
          - entities.ProcedureRoom.fields.daily_case_cap
          - entities.ProcedureRoom.fields.recovery_bay_count
        distinguishing_aspect: "All three capacity knobs are optional inputs with declared defaults 30 / 6 / 3, and those defaults are exactly the values the §1.3 sedation_staffing_capacity gates read when the client omits them."
        test_recipe:
          setup:
            - "empty database"
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-08-01T00:00:00Z" }
              as: CenterAdmin
          trigger:
            - call: "POST /procedure-rooms"
              payload: { room_code: "CR-05", room_type: "PROCEDURE_ROOM" }
              as: CenterAdmin
              captures: { room_id: $.data.id }
          assert:
            - "HTTP 201 with data.turnover_buffer_min == 30, data.daily_case_cap == 6, data.recovery_bay_count == 3"
            - "data.room_type == PROCEDURE_ROOM, which means the SAME_DAY surge allowance of the capacity calculation can never apply to this room"

      - name: referral_with_unknown_suspected_problem_enum_returns_invalid_request
        claim_type: type_constraints
        grounds:
          - entities.Referral.fields.suspected_problem
          - validations.priority_4_ERR_INVALID_REQUEST
        distinguishing_aspect: "suspected_problem is closed over {STENOSIS, THROMBOSIS, CATHETER_DYSFUNCTION, MATURATION_FAILURE}; a plausible-looking value outside the set is rejected at priority 4 before any FK or business check runs."
        test_recipe:
          setup:
            - "one facility, one patient, one PLANNED access"
          setup_api_calls:
            - call: "POST /dialysis-facilities"
              payload: { name: "Corner Dialysis Six", facility_code: "C-06" }
              as: CenterAdmin
              captures: { fac_id: $.data.id }
            - call: "POST /patients"
              payload: { mrn: "MC-06", full_name: "Bram Oyelaran", dialysis_facility_id: "${fac_id}", dialysis_modality: "IN_CENTER_HD", payer_program: "FEE_FOR_SERVICE" }
              as: CenterAdmin
              captures: { pat_id: $.data.id }
            - call: "POST /vascular-accesses"
              payload: { patient_id: "${pat_id}", access_type: "AVF", laterality: "LEFT", site: "FOREARM", placed_on: "2026-06-01" }
              as: AccessCoordinator
              captures: { acc_id: $.data.id }
          trigger:
            - call: "POST /referrals"
              payload: { access_id: "${acc_id}", referring_facility_id: "${fac_id}", suspected_problem: "ANEURYSM", clinical_narrative: "unsupported problem code", missed_treatment_count: 0 }
              as: FacilityCoordinator
              as_user_id: "${fac_id}"
          assert:
            - "HTTP 422 with data.error_id == ERR_INVALID_REQUEST"
            - "GET /referrals?access_id=${acc_id} returns total_count 0"
            - "DialysisFacility.${fac_id}.last_scored_at is still null — the rejected referral did not run facility_partnership_score"

      - name: recovery_observation_is_immutable_with_no_version_field
        claim_type: immutability
        grounds:
          - entities.RecoveryObservation
          - endpoints.POST_procedures_id_recovery-observations
          - endpoints.GET_procedures_id_recovery-observations
        distinguishing_aspect: "RecoveryObservation is declared common_fields: false, so its rows carry no version field and §1.5 exposes no update or delete endpoint for them — the recovery chart is append-only."
        test_recipe:
          setup:
            - "a MODERATE-sedation procedure driven to RECOVERY at 13:00-14:00 on 2026-08-01"
          setup_api_calls:
            - call: "POST /dialysis-facilities"
              payload: { name: "Corner Dialysis Seven", facility_code: "C-07" }
              as: CenterAdmin
              captures: { fac_id: $.data.id }
            - call: "POST /patients"
              payload: { mrn: "MC-07", full_name: "Cara Idowu", dialysis_facility_id: "${fac_id}", dialysis_modality: "IN_CENTER_HD", payer_program: "FEE_FOR_SERVICE" }
              as: CenterAdmin
              captures: { pat_id: $.data.id }
            - call: "POST /clinicians"
              payload: { full_name: "Dr Cor Adeniyi", clinician_role: "INTERVENTIONALIST", npi: "2000000071", credential_expires_on: "2027-01-31" }
              as: CenterAdmin
              captures: { op_id: $.data.id }
            - call: "POST /clinicians"
              payload: { full_name: "RN Tess Varga", clinician_role: "SEDATION_RN", npi: "2000000072", credential_expires_on: "2027-01-31", moderate_sedation_credentialed: true, max_concurrent_sedation_cases: 2 }
              as: CenterAdmin
              captures: { rn_id: $.data.id }
            - call: "POST /procedure-rooms"
              payload: { room_code: "CR-07", room_type: "ANGIO_SUITE", turnover_buffer_min: 30, daily_case_cap: 6, recovery_bay_count: 3 }
              as: CenterAdmin
              captures: { room_id: $.data.id }
            - call: "POST /vascular-accesses"
              payload: { patient_id: "${pat_id}", access_type: "AVG", laterality: "LEFT", site: "FOREARM", placed_on: "2026-04-01" }
              as: AccessCoordinator
              captures: { acc_id: $.data.id }
            - call: "POST /vascular-accesses/${acc_id}/status"
              payload: { to_status: "PLACED" }
              as: AccessCoordinator
            - call: "POST /vascular-accesses/${acc_id}/status"
              payload: { to_status: "MATURING" }
              as: AccessCoordinator
            - call: "POST /vascular-accesses/${acc_id}/status"
              payload: { to_status: "IN_USE" }
              as: AccessCoordinator
            - call: "POST /surveillance-readings"
              payload: { access_id: "${acc_id}", reported_by_facility_id: "${fac_id}", reading_at: "2026-07-25T08:00:00Z", access_flow_ml_min: 900, venous_pressure_mmhg: 100, recirculation_pct: 2.0, kind: "ROUTINE" }
              as: FacilityCoordinator
              as_user_id: "${fac_id}"
            - call: "POST /referrals"
              payload: { access_id: "${acc_id}", referring_facility_id: "${fac_id}", suspected_problem: "STENOSIS", clinical_narrative: "immutability corner", missed_treatment_count: 0 }
              as: FacilityCoordinator
              as_user_id: "${fac_id}"
              captures: { ref_id: $.data.id }
            - call: "POST /referrals/${ref_id}/triage"
              payload: {}
              as: AccessCoordinator
              captures: { ref_v: $.data.version }
            - call: "POST /procedures"
              payload: { referral_id: "${ref_id}", room_id: "${room_id}", primary_operator_id: "${op_id}", sedation_rn_id: "${rn_id}", procedure_type: "ANGIOPLASTY", sedation_level: "MODERATE", scheduled_start: "2026-08-01T13:00:00Z", scheduled_end: "2026-08-01T14:00:00Z", expected_referral_version: "${ref_v}" }
              as: AccessCoordinator
              captures: { proc_id: $.data.id }
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-08-01T13:00:00Z" }
              as: CenterAdmin
            - call: "POST /procedures/${proc_id}/start"
              payload: {}
              as: Interventionalist
              as_user_id: "${op_id}"
            - call: "POST /procedures/${proc_id}/recovery"
              payload: { sedation_end_at: "2026-08-01T14:00:00Z" }
              as: Interventionalist
              as_user_id: "${op_id}"
          trigger:
            - call: "POST /procedures/${proc_id}/recovery-observations"
              payload: { observed_at: "2026-08-01T14:10:00Z", aldrete_score: 8, on_room_air: false }
              as: SedationRN
              as_user_id: "${rn_id}"
              captures: { obs1_id: $.data.id }
            - call: "POST /procedures/${proc_id}/recovery-observations"
              payload: { observed_at: "2026-08-01T14:25:00Z", aldrete_score: 9, on_room_air: true }
              as: SedationRN
              as_user_id: "${rn_id}"
              captures: { obs2_id: $.data.id }
            - call: "GET /procedures/${proc_id}/recovery-observations"
              payload: { limit: 10, offset: 0 }
              as: SedationRN
              as_user_id: "${rn_id}"
          assert:
            - "each observation response carries data.id and data.created_at but NO data.version field — RecoveryObservation is declared common_fields: false"
            - "§1.5 declares no PUT, PATCH or DELETE for recovery observations, so the two charted rows can never be edited or withdrawn"
            - "the list returns total_count 2, has_more false, ordered by observed_at ASC: ${obs1_id} (aldrete 8, on_room_air false) then ${obs2_id} (aldrete 9, on_room_air true)"
            - "Procedure.${proc_id}.clinical_status is still RECOVERY — charting an observation is not itself a transition"

      - name: get_procedure_with_unknown_id_returns_not_found
        claim_type: not_found
        grounds:
          - validations.priority_3_path_404
          - errors.ERR_PROCEDURE_NOT_FOUND
        distinguishing_aspect: "A well-formed but unknown path id resolves at priority 3 to the collection's own 404 code, ERR_PROCEDURE_NOT_FOUND — not a generic not-found and not ERR_INVALID_REQUEST."
        test_recipe:
          setup:
            - "one facility so the database is non-empty but holds no Procedure"
          setup_api_calls:
            - call: "POST /dialysis-facilities"
              payload: { name: "Corner Dialysis Eight", facility_code: "C-08" }
              as: CenterAdmin
              captures: { fac_id: $.data.id }
          trigger:
            - call: "GET /procedures/00000000-0000-4000-8000-000000000008"
              payload: {}
              as: CenterAdmin
          assert:
            - "HTTP 404 with response_type == error and data.error_id == ERR_PROCEDURE_NOT_FOUND"
            - "GET /procedures returns total_count 0, confirming the lookup missed rather than matched a hidden row"

      - name: surveillance_reading_for_an_unknown_access_returns_not_found
        claim_type: parent_relationships
        grounds:
          - validations.priority_5_body_FK_404
          - errors.ERR_ACCESS_NOT_FOUND
          - endpoints.POST_surveillance-readings
        distinguishing_aspect: "A body foreign key that names no row fails at priority 5 with the referenced collection's 404 (ERR_ACCESS_NOT_FOUND), which outranks every business rule including the facility scope check on the same payload."
        test_recipe:
          setup:
            - "one facility whose id is used as the FacilityCoordinator identity"
          setup_api_calls:
            - call: "POST /dialysis-facilities"
              payload: { name: "Corner Dialysis Nine", facility_code: "C-09" }
              as: CenterAdmin
              captures: { fac_id: $.data.id }
          trigger:
            - call: "POST /surveillance-readings"
              payload: { access_id: "00000000-0000-4000-8000-000000000009", reported_by_facility_id: "${fac_id}", reading_at: "2026-07-25T08:00:00Z", access_flow_ml_min: 700, venous_pressure_mmhg: 150, recirculation_pct: 11.0, kind: "URGENT" }
              as: FacilityCoordinator
              as_user_id: "${fac_id}"
          assert:
            - "HTTP 404 with data.error_id == ERR_ACCESS_NOT_FOUND"
            - "GET /dialysis-facilities/${fac_id}/surveillance-readings returns total_count 0"

      - name: referral_listing_paginates_with_total_count_and_filters_by_access
        claim_type: listing
        grounds:
          - endpoints.GET_referrals
          - response_envelope.pagination_fields
        distinguishing_aspect: "The list envelope reports limit / offset / total_count / has_more where total_count counts the FILTERED set, not the page, and the declared order is created_at ASC; the access_id filter narrows four referrals to three."
        test_recipe:
          setup:
            - "one facility, one patient, two IN_USE accesses"
            - "three referrals created on access A and one on access B, in that order"
          setup_api_calls:
            - call: "POST /dialysis-facilities"
              payload: { name: "Corner Dialysis Ten", facility_code: "C-10" }
              as: CenterAdmin
              captures: { fac_id: $.data.id }
            - call: "POST /patients"
              payload: { mrn: "MC-10", full_name: "Dov Marchetti", dialysis_facility_id: "${fac_id}", dialysis_modality: "IN_CENTER_HD", payer_program: "FEE_FOR_SERVICE" }
              as: CenterAdmin
              captures: { pat_id: $.data.id }
            - call: "POST /vascular-accesses"
              payload: { patient_id: "${pat_id}", access_type: "AVG", laterality: "LEFT", site: "FOREARM", placed_on: "2026-04-01" }
              as: AccessCoordinator
              captures: { acca_id: $.data.id }
            - call: "POST /vascular-accesses"
              payload: { patient_id: "${pat_id}", access_type: "AVG", laterality: "RIGHT", site: "UPPER_ARM", placed_on: "2026-04-02" }
              as: AccessCoordinator
              captures: { accb_id: $.data.id }
            - call: "POST /referrals"
              payload: { access_id: "${acca_id}", referring_facility_id: "${fac_id}", suspected_problem: "STENOSIS", clinical_narrative: "page one first", missed_treatment_count: 0 }
              as: FacilityCoordinator
              as_user_id: "${fac_id}"
              captures: { ref1_id: $.data.id }
            - call: "POST /referrals"
              payload: { access_id: "${acca_id}", referring_facility_id: "${fac_id}", suspected_problem: "THROMBOSIS", clinical_narrative: "page one second", missed_treatment_count: 0 }
              as: FacilityCoordinator
              as_user_id: "${fac_id}"
              captures: { ref2_id: $.data.id }
            - call: "POST /referrals"
              payload: { access_id: "${acca_id}", referring_facility_id: "${fac_id}", suspected_problem: "STENOSIS", clinical_narrative: "page two first", missed_treatment_count: 0 }
              as: FacilityCoordinator
              as_user_id: "${fac_id}"
              captures: { ref3_id: $.data.id }
            - call: "POST /referrals"
              payload: { access_id: "${accb_id}", referring_facility_id: "${fac_id}", suspected_problem: "STENOSIS", clinical_narrative: "other access", missed_treatment_count: 0 }
              as: FacilityCoordinator
              as_user_id: "${fac_id}"
              captures: { ref4_id: $.data.id }
          trigger:
            - call: "GET /referrals"
              payload: { limit: 2, offset: 0 }
              as: CenterAdmin
            - call: "GET /referrals"
              payload: { limit: 2, offset: 2 }
              as: CenterAdmin
            - call: "GET /referrals"
              payload: { access_id: "${acca_id}", limit: 10, offset: 0 }
              as: CenterAdmin
          assert:
            - "the first page returns response_type == array with exactly 2 items [${ref1_id}, ${ref2_id}] in created_at ASC order, limit 2, offset 0, total_count 4, has_more true"
            - "the second page returns [${ref3_id}, ${ref4_id}], limit 2, offset 2, total_count 4, has_more false"
            - "the access-filtered read returns total_count 3 with items [${ref1_id}, ${ref2_id}, ${ref3_id}] and has_more false — total_count counts the filtered set, not the page and not the table"
            - "${ref4_id} appears only in the unfiltered listing"
            - "every listed referral has status SUBMITTED, triage_score null, urgency null and hold_reason null"

  - section: state_machines
    instances:
      - name: new_vascular_access_starts_in_planned_with_zero_counters
        claim_type: initial_state
        grounds:
          - state_machines.VascularAccess.initial_state
          - entities.VascularAccess.fields.intervention_burden_score
        distinguishing_aspect: "A freshly created access is PLANNED with all four intervention counters, the attributable infection counter and intervention_burden_score at 0, abandoned_at null and predecessor_access_id null unless supplied."
        test_recipe:
          setup:
            - "one facility and one patient"
          setup_api_calls:
            - call: "POST /dialysis-facilities"
              payload: { name: "Corner Dialysis Eleven", facility_code: "C-11" }
              as: CenterAdmin
              captures: { fac_id: $.data.id }
            - call: "POST /patients"
              payload: { mrn: "MC-11", full_name: "Elif Baran", dialysis_facility_id: "${fac_id}", dialysis_modality: "HOME_HD", payer_program: "FEE_FOR_SERVICE" }
              as: CenterAdmin
              captures: { pat_id: $.data.id }
          trigger:
            - call: "POST /vascular-accesses"
              payload: { patient_id: "${pat_id}", access_type: "AVF", laterality: "LEFT", site: "UPPER_ARM", placed_on: "2026-06-15" }
              as: AccessCoordinator
              captures: { acc_id: $.data.id }
          assert:
            - "HTTP 201 with data.status == PLANNED"
            - "data.angioplasty_count == 0, data.thrombectomy_count == 0, data.catheter_exchange_count == 0, data.maturation_intervention_count == 0"
            - "data.attributable_infection_count == 0, data.intervention_burden_score == 0, data.abandoned_at == null, data.predecessor_access_id == null"
            - "Patient.${pat_id}.access_count == 1 — PLANNED is inside the counted state set"

      - name: triage_of_an_already_triaged_referral_is_rejected
        claim_type: invalid_transitions
        grounds:
          - state_machines.Referral.SUBMITTED_to_TRIAGED
          - errors.ERR_REFERRAL_STATE_INVALID
          - validations.priority_8_state_409
        distinguishing_aspect: "§1.2 declares no TRIAGED -> TRIAGED edge, so a second triage is refused at priority 8 with ERR_REFERRAL_STATE_INVALID and the first triage's score, variant, urgency and triaged_at all survive untouched."
        test_recipe:
          setup:
            - "one IN_USE access with a single benign reading and one referral already triaged to ROUTINE"
          setup_api_calls:
            - call: "POST /dialysis-facilities"
              payload: { name: "Corner Dialysis Twelve", facility_code: "C-12" }
              as: CenterAdmin
              captures: { fac_id: $.data.id }
            - call: "POST /patients"
              payload: { mrn: "MC-12", full_name: "Fode Sylla", dialysis_facility_id: "${fac_id}", dialysis_modality: "IN_CENTER_HD", payer_program: "FEE_FOR_SERVICE" }
              as: CenterAdmin
              captures: { pat_id: $.data.id }
            - call: "POST /vascular-accesses"
              payload: { patient_id: "${pat_id}", access_type: "AVG", laterality: "LEFT", site: "FOREARM", placed_on: "2026-04-01" }
              as: AccessCoordinator
              captures: { acc_id: $.data.id }
            - call: "POST /vascular-accesses/${acc_id}/status"
              payload: { to_status: "PLACED" }
              as: AccessCoordinator
            - call: "POST /vascular-accesses/${acc_id}/status"
              payload: { to_status: "MATURING" }
              as: AccessCoordinator
            - call: "POST /vascular-accesses/${acc_id}/status"
