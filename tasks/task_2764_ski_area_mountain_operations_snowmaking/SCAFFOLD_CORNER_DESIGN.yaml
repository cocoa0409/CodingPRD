      - name: terrain_area_computed_fields_extra_field_input_ignored
        claim_type: computed_fields
        grounds:
          - entities.TerrainArea.fields.base_depth_in
          - entities.TerrainArea.fields.groom_ready
          - entities.TerrainArea.fields.opening_state
        distinguishing_aspect: |
          The client submits opening_state OPEN, base_depth_in 99.0 and groom_ready true alongside the
          legitimate creation fields. Every one of those three is source computed, so the request must
          not be honoured for them: the row is created at the zero baseline. Silently trusting a
          client-supplied opening_state would let a caller skip the entire readiness ladder in one
          call, which is the sharpest privilege-escalation corner in this domain.
        test_recipe:
          setup:
            - "A season with one inspected lift exists."
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { current_utc: "2026-08-01T00:00:00Z" }
              as: MountainOpsDirector
            - call: "POST /mountain-ops/seasons"
              payload: { season_label: "2026-27", base_depth_policy: "MEAN_OF_STAKES", water_right_seasonal_af: 250.000, plant_max_gpm: 6000, snowmaking_kwh_per_af: 620.0, min_patrollers_per_open_area: 2, groom_freshness_hours: 18, energy_windows: [{ code: "OFF_1", start_hour_utc: 0, end_hour_utc: 6, price_usd_per_kwh: 0.062, tier: "OFF_PEAK" }, { code: "MID_1", start_hour_utc: 6, end_hour_utc: 9, price_usd_per_kwh: 0.113, tier: "MID_PEAK" }, { code: "ON_1", start_hour_utc: 9, end_hour_utc: 21, price_usd_per_kwh: 0.187, tier: "ON_PEAK" }, { code: "MID_2", start_hour_utc: 21, end_hour_utc: 24, price_usd_per_kwh: 0.113, tier: "MID_PEAK" }] }
              as: MountainOpsDirector
              captures: { season_id: $.data.id }
            - call: "POST /mountain-ops/lifts"
              payload: { season_id: "${season_id}", lift_code: "L1", name: "Summit Express", lift_type: "DETACHABLE", wind_hold_threshold_mph: 40.0, hourly_capacity_pph: 1800, required_operator_count: 2 }
              as: LiftOpsManager
              captures: { lift_id: $.data.id }
            - call: "POST /mountain-ops/lifts/${lift_id}/inspections"
              payload: { result: "PASS", notes: "daily pre-op" }
              as: LiftOpsManager
          trigger:
            - call: "POST /mountain-ops/terrain-areas"
              payload: { season_id: "${season_id}", serving_lift_id: "${lift_id}", trail_code: "T9", name: "Ghost Bowl", terrain_class: "BLUE", acres: 18.0, min_open_base_depth_in: 30, avalanche_terrain: false, opening_state: "OPEN", base_depth_in: 99.0, groom_ready: true, park_risk_score: 0.0, assigned_patroller_count: 7 }
              as: MountainOpsDirector
              captures: { area_id: $.data.id }
          assert:
            - "HTTP 201 (unknown keys are ignored, not rejected, per the declared input schema handling)."
            - "data.opening_state == 'CLOSED', not 'OPEN'."
            - "data.base_depth_in == 0.0, not 99.0."
            - "data.groom_ready is false and data.assigned_patroller_count == 0."
            - "data.trail_code == 'T9' and data.acres == 18.0 - the legitimate input fields are honoured."

      - name: lift_system_fields_are_server_owned_and_input_ignored
        claim_type: system_fields
        grounds:
          - entities.Lift.fields.id
          - endpoints[POST /mountain-ops/lifts]
        distinguishing_aspect: |
          id, created_at, updated_at and version are source system. The request supplies all four,
          including version 99, and the response must show a server-generated id different from the
          submitted one and version 1. version is the load-bearing one here: the optimistic-concurrency
          layer reads it, so a client that could seed it could forge a stale-version bypass.
        test_recipe:
          setup:
            - "A season exists."
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { current_utc: "2026-08-01T00:00:00Z" }
              as: MountainOpsDirector
            - call: "POST /mountain-ops/seasons"
              payload: { season_label: "2026-27", base_depth_policy: "MEAN_OF_STAKES", water_right_seasonal_af: 250.000, plant_max_gpm: 6000, snowmaking_kwh_per_af: 620.0, min_patrollers_per_open_area: 2, groom_freshness_hours: 18, energy_windows: [{ code: "OFF_1", start_hour_utc: 0, end_hour_utc: 6, price_usd_per_kwh: 0.062, tier: "OFF_PEAK" }, { code: "MID_1", start_hour_utc: 6, end_hour_utc: 9, price_usd_per_kwh: 0.113, tier: "MID_PEAK" }, { code: "ON_1", start_hour_utc: 9, end_hour_utc: 21, price_usd_per_kwh: 0.187, tier: "ON_PEAK" }, { code: "MID_2", start_hour_utc: 21, end_hour_utc: 24, price_usd_per_kwh: 0.113, tier: "MID_PEAK" }] }
              as: MountainOpsDirector
              captures: { season_id: $.data.id }
          trigger:
            - call: "POST /mountain-ops/lifts"
              payload: { season_id: "${season_id}", lift_code: "L9", name: "Forged", lift_type: "FIXED_GRIP", wind_hold_threshold_mph: 35.0, hourly_capacity_pph: 1200, required_operator_count: 2, id: "00000000-0000-4000-8000-000000000000", version: 99, created_at: "2000-01-01T00:00:00Z", staffed_operator_count: 5 }
              as: LiftOpsManager
              captures: { lift_id: $.data.id }
          assert:
            - "HTTP 201."
            - "data.id != '00000000-0000-4000-8000-000000000000'."
            - "data.version == 1, not 99."
            - "data.created_at != '2000-01-01T00:00:00Z'."
            - "data.staffed_operator_count == 0, not 5."

