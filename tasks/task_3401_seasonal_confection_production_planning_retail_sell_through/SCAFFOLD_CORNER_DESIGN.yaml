# =============================================================================
# §1.9 Scaffold Corner Design (Coverage Index for Non-Difficulty Tests)
# Task: task_3401_seasonal_confection_production_planning_retail_sell_through
# Breadth probe over the SCAFFOLD.yaml §1.1–§1.7 surface. Corners already
# exercised by SCAFFOLD_DIFFICULTY_DESIGN.yaml appear as excluded_because
# stubs. Anchors are document-local (c_ prefix) and defined at first use.
# =============================================================================
scaffold_corner_design:

  # ===========================================================================
  - section: entities
    instances:
      - name: program_create_returns_every_field_and_starts_planning
        claim_type: Creation
        grounds:
          - entities.SeasonalProgram
          - endpoints.POST_/confection/seasonal-programs
          - response_envelope
        distinguishing_aspect: "A program created with the full twelve-field fixture returns 201 with status PLANNING, reopen_count 0, all four totals 0, version 1, and system id/created_at/updated_at — status and totals are never client-supplied."
        test_recipe:
          setup:
            - "Logical clock at 2027-01-05T00:00:00Z. Empty database."
          setup_api_calls:
            - &c_clock_0105
              call: "POST /confection/_clock/set_current_utc"
              payload: { to_iso8601: "2027-01-05T00:00:00Z" }
              as: PlatformAdmin
          trigger:
            - &c_prog
              call: "POST /confection/seasonal-programs"
              payload: { season_code: "HALLOWEEN", season_year: 2027, commitment_open_on: "2027-01-10T00:00:00Z", commitment_close_on: "2027-02-15T00:00:00Z", production_deadline_on: "2027-06-30T00:00:00Z", ship_window_open_on: "2027-07-15T00:00:00Z", ship_window_close_on: "2027-09-15T00:00:00Z", on_shelf_on: "2027-09-20T00:00:00Z", pull_on: "2027-11-15T00:00:00Z", destroy_by_on: "2027-12-31T00:00:00Z", retail_price_cents: 499, forecast_units: 100000 }
              as: PlatformAdmin
              captures: { prog_id: $.data.id, prog_v1: $.data.version }
          assert:
            - "the response status is 201 and response_type is object"
            - "SeasonalProgram.${prog_id}.status == PLANNING and reopen_count == 0"
            - "produced_units_total == 0 and committed_units_total == 0 and shipped_units_total == 0 and disposed_units_total == 0"
            - "version == 1 and id / created_at / updated_at are non-null"
            - "meta.api_request_id and meta.api_request_timestamp are present"

      - name: product_get_round_trips_the_stored_configuration
        claim_type: Retrieval
        grounds:
          - entities.Product
          - endpoints.GET_/confection/products/{id}
        distinguishing_aspect: "Every Product field round-trips through GET exactly as posted, including the enum kind and both boolean flags; an immediate re-read shows the same values (immediate consistency)."
        test_recipe:
          setup:
            - "Logical clock at 2027-01-05T00:00:00Z. One HALLOWEEN 2027 program in PLANNING."
          setup_api_calls:
            - *c_clock_0105
            - *c_prog
            - &c_prod_seas
              call: "POST /confection/products"
              payload: { program_id: "${prog_id}", sku_code: "HAL-PUMP-0499", kind: "SEASONAL", molded_shape: "pumpkin", brand_protected: true, requires_temp_control: true, units_per_case: 24 }
              as: PlatformAdmin
              captures: { prod_id: $.data.id }
          trigger:
            - call: "GET /confection/products/${prod_id}"
              payload: {}
              as: CategoryManager
              as_user_id: "cm-alice"
          assert:
            - "the response status is 200"
            - "Product.${prod_id}.sku_code == HAL-PUMP-0499 and kind == SEASONAL and molded_shape == pumpkin"
            - "brand_protected == true and requires_temp_control == true and units_per_case == 24"
            - "Product.${prod_id}.program_id == ${prog_id} and version == 1"

      - name: commitments_list_paginates_with_total_count_and_has_more
        claim_type: Listing
        grounds:
          - endpoints.GET_/confection/retailer-commitments
          - response_envelope.pagination_fields
          - response_envelope.pagination_defaults
        distinguishing_aspect: "With three DRAFT commitments on one retailer, limit=2&offset=0 returns 2 rows with total_count 3 and has_more true, offset=2 returns 1 row with has_more false — total_count counts the whole filtered set, and the retailer_id filter excludes the other retailer."
        test_recipe:
          setup:
            - "Program OPEN_FOR_COMMITMENTS; GOLD retailer with three DRAFT commitments of 5 units each; SILVER retailer with one."
          setup_api_calls:
            - *c_clock_0105
            - *c_prog
            - &c_prog_open
              call: "POST /confection/seasonal-programs/${prog_id}/advance"
              payload: { to_state: "OPEN_FOR_COMMITMENTS", expected_program_version: "${prog_v1}" }
              as: PlatformAdmin
            - &c_rt
              call: "POST /confection/retailer-accounts"
              payload: { name: "GoldGro", region: "NE", tier: "GOLD", max_seasonal_units: 100000, everyday_baseline_weekly_units: 1000 }
              as: PlatformAdmin
              captures: { r_gold: $.data.id }
            - call: "POST /confection/retailer-accounts"
              payload: { name: "SilverMart", region: "MW", tier: "SILVER", max_seasonal_units: 100000, everyday_baseline_weekly_units: 800 }
              as: PlatformAdmin
              captures: { r_silver: $.data.id }
            - &c_clock_0120
              call: "POST /confection/_clock/set_current_utc"
              payload: { to_iso8601: "2027-01-20T00:00:00Z" }
              as: PlatformAdmin
            - *c_prod_seas
            - call: "POST /confection/retailer-commitments"
              payload: { program_id: "${prog_id}", retailer_id: "${r_gold}", product_id: "${prod_id}", committed_units: 5, ship_window_open_on: "2027-08-01T00:00:00Z", ship_window_close_on: "2027-09-10T00:00:00Z" }
              as: Retailer
              as_user_id: "${r_gold}"
              captures: { c_g1: $.data.id }
            - call: "POST /confection/retailer-commitments"
              payload: { program_id: "${prog_id}", retailer_id: "${r_gold}", product_id: "${prod_id}", committed_units: 5, ship_window_open_on: "2027-08-01T00:00:00Z", ship_window_close_on: "2027-09-10T00:00:00Z" }
              as: Retailer
              as_user_id: "${r_gold}"
            - call: "POST /confection/retailer-commitments"
              payload: { program_id: "${prog_id}", retailer_id: "${r_gold}", product_id: "${prod_id}", committed_units: 5, ship_window_open_on: "2027-08-01T00:00:00Z", ship_window_close_on: "2027-09-10T00:00:00Z" }
              as: Retailer
              as_user_id: "${r_gold}"
            - call: "POST /confection/retailer-commitments"
              payload: { program_id: "${prog_id}", retailer_id: "${r_silver}", product_id: "${prod_id}", committed_units: 5, ship_window_open_on: "2027-08-01T00:00:00Z", ship_window_close_on: "2027-09-10T00:00:00Z" }
              as: Retailer
              as_user_id: "${r_silver}"
          trigger:
            - call: "GET /confection/retailer-commitments"
              payload: { retailer_id: "${r_gold}", limit: 2, offset: 0 }
              as: PlatformAdmin
          assert:
            - "the page returns exactly 2 rows with total_count == 3 and has_more == true"
            - "GET with retailer_id=${r_gold}&limit=2&offset=2 returns exactly 1 row with total_count == 3 and has_more == false"
            - "GET with retailer_id=${r_silver} returns exactly 1 row (the filter excludes GoldGro's three)"
            - "GET with no query parameters returns 4 rows with limit defaulting to 10 and offset to 0"

      - name: shipment_get_with_unknown_id_returns_shipment_not_found
        claim_type: Not Found
        grounds:
          - endpoints.GET_/confection/shipments/{id}
          - errors.ERR_SHIPMENT_NOT_FOUND
          - validations[priority=3]
        distinguishing_aspect: "A syntactically valid but unallocated UUID on the shipment path produces the entity-specific 404 ERR_SHIPMENT_NOT_FOUND, not a generic error and not a 400."
        test_recipe:
          setup:
            - "Logical clock at 2027-01-05T00:00:00Z. Empty database."
          setup_api_calls:
            - *c_clock_0105
          trigger:
            - call: "GET /confection/shipments/00000000-0000-4000-8000-000000000000"
              payload: {}
              as: LogisticsCoordinator
              captures: { error_id: $.data.error_id }
          assert:
            - "the response status is 404 and error_id == ERR_SHIPMENT_NOT_FOUND"
            - "response_type is error and data carries both error_id and message"

      - name: program_create_missing_pull_on_returns_invalid_request
        claim_type: Required Fields
        grounds:
          - entities.SeasonalProgram.fields.pull_on
          - errors.ERR_INVALID_REQUEST
        distinguishing_aspect: "pull_on is a required input with no default; omitting it entirely is a 400 ERR_INVALID_REQUEST, and no program row is persisted."
        test_recipe:
          setup:
            - "Logical clock at 2027-01-05T00:00:00Z. Empty database."
          setup_api_calls:
            - *c_clock_0105
          trigger:
            - call: "POST /confection/seasonal-programs"
              payload: { season_code: "EASTER", season_year: 2027, commitment_open_on: "2026-11-01T00:00:00Z", commitment_close_on: "2026-12-15T00:00:00Z", production_deadline_on: "2027-03-01T00:00:00Z", ship_window_open_on: "2027-03-10T00:00:00Z", ship_window_close_on: "2027-04-01T00:00:00Z", on_shelf_on: "2027-04-05T00:00:00Z", destroy_by_on: "2027-05-31T00:00:00Z", retail_price_cents: 399, forecast_units: 50000 }
              as: PlatformAdmin
              captures: { error_id: $.data.error_id }
          assert:
            - "the response status is 400 and error_id == ERR_INVALID_REQUEST"
            - "a follow-up GET /confection/seasonal-programs/{id} is impossible: no id was returned and the program was not persisted"

      - name: contract_create_omitting_hedge_fields_defaults_hedged_zero
        claim_type: Defaults
        grounds:
          - entities.CommodityContract.fields.hedged_quantity_units
          - calculations.landed_material_cost
        distinguishing_aspect: "hedged_quantity_units declares default 0, so omitting both hedge fields stores 0 and the provisional spend is exactly quantity x contract_price (5000 x 80 = 400000) with no hedge payoff term."
        test_recipe:
          setup:
            - "Logical clock at 2027-01-05T00:00:00Z. One HALLOWEEN 2027 program in PLANNING."
          setup_api_calls:
            - *c_clock_0105
            - *c_prog
          trigger:
            - call: "POST /confection/commodity-contracts"
              payload: { program_id: "${prog_id}", commodity: "SUGAR", quantity_units: 5000, contract_price_cents_per_unit: 80 }
              as: PlatformAdmin
              captures: { cc_id: $.data.id }
          assert:
            - "the response status is 201"
            - "CommodityContract.${cc_id}.hedged_quantity_units == 0 (default applied, not null)"
            - "CommodityContract.${cc_id}.provisional_spend_cents == 400000 (5000 x 80, zero hedge offset)"
            - "CommodityContract.${cc_id}.status == OPEN and version == 1"

      - name: supply_summary_tracks_production_allocation_and_shipping
        claim_type: Computed Fields
        grounds:
          - endpoints.GET_/confection/seasonal-programs/{id}/supply-summary
          - calculations.program_supply_pool
        distinguishing_aspect: "The computed read reflects each mutation immediately: produced 50 after complete, committed 30 after confirm, allocated 30 after the SHIPPING advance, shipped 10 after shipment create, and remaining pool exactly 50 - 30 == 20."
        test_recipe:
          setup:
            - "Program in SHIPPING; GOLD commitment 30 ALLOCATED; run produced 50; one 10-unit PLANNED shipment."
          setup_api_calls:
            - *c_clock_0105
            - *c_prog
            - *c_prog_open
            - *c_rt
            - &c_wh
              call: "POST /confection/warehouses"
              payload: { name: "W1", temp_controlled: true, capacity_units: 1000 }
              as: PlatformAdmin
              captures: { wh_id: $.data.id }
            - *c_prod_seas
            - *c_clock_0120
            - call: "POST /confection/retailer-commitments"
              payload: { program_id: "${prog_id}", retailer_id: "${r_gold}", product_id: "${prod_id}", committed_units: 30, ship_window_open_on: "2027-08-01T00:00:00Z", ship_window_close_on: "2027-09-10T00:00:00Z" }
              as: Retailer
              as_user_id: "${r_gold}"
              captures: { c_gold: $.data.id }
            - &c_submit_gold
              call: "POST /confection/retailer-commitments/${c_gold}/submit"
              payload: {}
              as: Retailer
              as_user_id: "${r_gold}"
            - &c_confirm_gold
              call: "POST /confection/retailer-commitments/${c_gold}/confirm"
              payload: {}
              as: CategoryManager
              as_user_id: "cm-alice"
            - call: "POST /confection/production-runs"
              payload: { program_id: "${prog_id}", product_id: "${prod_id}", line_code: "LINE-A", planned_units: 50, scheduled_start_on: "2027-03-01T08:00:00Z", scheduled_end_on: "2027-03-02T08:00:00Z" }
              as: ProductionPlanner
              captures: { run_id: $.data.id }
            - &c_clock_0215
              call: "POST /confection/_clock/set_current_utc"
              payload: { to_iso8601: "2027-02-15T00:00:00Z" }
              as: PlatformAdmin
            - &c_g2
              call: "GET /confection/seasonal-programs/${prog_id}"
              payload: {}
              as: PlatformAdmin
              captures: { pv2: $.data.version }
            - &c_adv_lock
              call: "POST /confection/seasonal-programs/${prog_id}/advance"
              payload: { to_state: "LOCKED", expected_program_version: "${pv2}" }
              as: PlatformAdmin
            - call: "POST /confection/production-runs/${run_id}/start"
              payload: {}
              as: ProductionPlanner
            - &c_clock_0306
              call: "POST /confection/_clock/set_current_utc"
              payload: { to_iso8601: "2027-03-06T00:00:00Z" }
              as: PlatformAdmin
            - call: "POST /confection/production-runs/${run_id}/complete"
              payload: { produced_units: 50, warehouse_id: "${wh_id}" }
              as: ProductionPlanner
            - &c_g4
              call: "GET /confection/seasonal-programs/${prog_id}"
              payload: {}
              as: PlatformAdmin
              captures: { pv4: $.data.version }
            - &c_adv_inprod
              call: "POST /confection/seasonal-programs/${prog_id}/advance"
              payload: { to_state: "IN_PRODUCTION", expected_program_version: "${pv4}" }
              as: PlatformAdmin
            - &c_clock_0715
              call: "POST /confection/_clock/set_current_utc"
              payload: { to_iso8601: "2027-07-15T00:00:00Z" }
              as: PlatformAdmin
            - &c_g5
              call: "GET /confection/seasonal-programs/${prog_id}"
              payload: {}
              as: PlatformAdmin
              captures: { pv5: $.data.version }
            - &c_adv_ship
              call: "POST /confection/seasonal-programs/${prog_id}/advance"
              payload: { to_state: "SHIPPING", expected_program_version: "${pv5}" }
              as: PlatformAdmin
            - call: "POST /confection/shipments"
              payload: { commitment_id: "${c_gold}", warehouse_id: "${wh_id}", units: 10, ship_on: "2027-08-02T00:00:00Z", temp_controlled: true }
              as: LogisticsCoordinator
              captures: { sh_id: $.data.id }
          trigger:
            - call: "GET /confection/seasonal-programs/${prog_id}/supply-summary"
              payload: {}
              as: PlatformAdmin
          assert:
            - "the response status is 200"
            - "produced_units_total == 50 and committed_units_total == 30"
            - "allocated_units_total == 30 and shipped_units_total == 10"
            - "remaining_supply_pool_units == 20 (50 produced - 30 allocated)"
            - "disposed_units_total == 0"

      - name: commitment_create_with_allocated_units_and_version_input_ignored
        claim_type: System Fields
        grounds:
          - entities.RetailerCommitment.fields.allocated_units
          - endpoints.POST_/confection/retailer-commitments
        distinguishing_aspect: "allocated_units and version are system-managed; a client sending allocated_units 999 and version 99 is ignored — the row is created with allocated_units 0, revision 1, version 1, status DRAFT."
        test_recipe:
          setup:
            - "Program OPEN_FOR_COMMITMENTS; GOLD retailer; seasonal product."
          setup_api_calls:
            - *c_clock_0105
            - *c_prog
            - *c_prog_open
            - *c_rt
            - *c_prod_seas
            - *c_clock_0120
          trigger:
            - call: "POST /confection/retailer-commitments"
              payload: { program_id: "${prog_id}", retailer_id: "${r_gold}", product_id: "${prod_id}", committed_units: 5, ship_window_open_on: "2027-08-01T00:00:00Z", ship_window_close_on: "2027-09-10T00:00:00Z", allocated_units: 999, version: 99 }
              as: Retailer
              as_user_id: "${r_gold}"
              captures: { c_id: $.data.id }
          assert:
            - "the response status is 201"
            - "RetailerCommitment.${c_id}.allocated_units == 0 and version == 1 and revision == 1"
            - "RetailerCommitment.${c_id}.status == DRAFT and reorder_used == false"

      - name: product_create_kind_out_of_enum_returns_invalid_request
        claim_type: Type Constraints
        grounds:
          - entities.Product.fields.kind
          - errors.ERR_INVALID_REQUEST
        distinguishing_aspect: "kind is a closed enum {SEASONAL, EVERYDAY}; WEEKLY is rejected at 400 ERR_INVALID_REQUEST rather than coerced or stored."
        test_recipe:
          setup:
            - "Logical clock at 2027-01-05T00:00:00Z. One program in PLANNING."
          setup_api_calls:
            - *c_clock_0105
            - *c_prog
          trigger:
            - call: "POST /confection/products"
              payload: { program_id: "${prog_id}", sku_code: "BAD-ENUM-1", kind: "WEEKLY", molded_shape: "pumpkin", brand_protected: false, requires_temp_control: false, units_per_case: 24 }
              as: PlatformAdmin
              captures: { error_id: $.data.error_id }
          assert:
            - "the response status is 400 and error_id == ERR_INVALID_REQUEST"
            - "GET /confection/products?program_id=${prog_id} returns 0 rows"

      - name: run_create_body_foreign_keys_checked_in_declared_input_order
        claim_type: Parent Relationships
        grounds:
          - validations[priority=5]
          - endpoints.POST_/confection/production-runs
          - errors.ERR_PROGRAM_NOT_FOUND
          - errors.ERR_PRODUCT_NOT_FOUND
          - complexity_profile.entity_topology
        distinguishing_aspect: "Flat topology puts both FKs in the body, and priority 5 checks them in the endpoint's declared input order — program_id before product_id: with BOTH unknown the answer is ERR_PROGRAM_NOT_FOUND; with only product unknown it is ERR_PRODUCT_NOT_FOUND."
        test_recipe:
          setup:
            - "Logical clock at 2027-01-05T00:00:00Z. One HALLOWEEN 2027 program in PLANNING; no products."
          setup_api_calls:
            - *c_clock_0105
            - *c_prog
          trigger:
            - call: "POST /confection/production-runs"
              payload: { program_id: "00000000-0000-4000-8000-000000000001", product_id: "00000000-0000-4000-8000-000000000002", line_code: "LINE-A", planned_units: 10, scheduled_start_on: "2027-03-01T08:00:00Z", scheduled_end_on: "2027-03-02T08:00:00Z" }
              as: ProductionPlanner
              captures: { err_both: $.data.error_id }
            - call: "POST /confection/production-runs"
              payload: { program_id: "${prog_id}", product_id: "00000000-0000-4000-8000-000000000002", line_code: "LINE-A", planned_units: 10, scheduled_start_on: "2027-03-01T08:00:00Z", scheduled_end_on: "2027-03-02T08:00:00Z" }
              as: ProductionPlanner
              captures: { err_prod: $.data.error_id }
          assert:
            - "the first request returns 404 and err_both == ERR_PROGRAM_NOT_FOUND"
            - "err_both != ERR_PRODUCT_NOT_FOUND (program_id precedes product_id in the input list)"
            - "the second request returns 404 and err_prod == ERR_PRODUCT_NOT_FOUND"
            - "GET /confection/production-runs?program_id=${prog_id} returns 0 rows"

  # ===========================================================================
  - section: state_machines
    instances:
      - name: commitment_confirm_from_draft_returns_invalid_state
        claim_type: invalid_transition
        grounds:
          - state_machines.RetailerCommitment
          - errors.ERR_INVALID_STATE
        distinguishing_aspect: "CONFIRM is only defined from SUBMITTED; calling it on a DRAFT commitment returns 409 ERR_INVALID_STATE and leaves the row untouched."
        test_recipe:
          setup:
            - "Program OPEN_FOR_COMMITMENTS; GOLD commitment in DRAFT."
          setup_api_calls:
            - *c_clock_0105
            - *c_prog
            - *c_prog_open
            - *c_rt
            - *c_prod_seas
            - *c_clock_0120
            - call: "POST /confection/retailer-commitments"
              payload: { program_id: "${prog_id}", retailer_id: "${r_gold}", product_id: "${prod_id}", committed_units: 5, ship_window_open_on: "2027-08-01T00:00:00Z", ship_window_close_on: "2027-09-10T00:00:00Z" }
              as: Retailer
              as_user_id: "${r_gold}"
              captures: { c_gold: $.data.id }
          trigger:
            - call: "POST /confection/retailer-commitments/${c_gold}/confirm"
              payload: {}
              as: CategoryManager
              as_user_id: "cm-alice"
              captures: { error_id: $.data.error_id }
          assert:
            - "the response status is 409 and error_id == ERR_INVALID_STATE"
            - "RetailerCommitment.${c_gold}.status is still DRAFT and version is unchanged"

      - name: program_cancelled_is_terminal_lockdown
        claim_type: terminal_lockdown
        grounds:
          - state_machines.SeasonalProgram
          - errors.ERR_INVALID_STATE
        distinguishing_aspect: "CANCELLED is terminal: after PLANNING -> CANCELLED, a further advance to OPEN_FOR_COMMITMENTS with a FRESH correct version still fails 409 ERR_INVALID_STATE — terminal lockdown, not an OCC failure."
        test_recipe:
          setup:
            - "Program cancelled from PLANNING."
          setup_api_calls:
            - *c_clock_0105
            - *c_prog
            - call: "POST /confection/seasonal-programs/${prog_id}/advance"
              payload: { to_state: "CANCELLED", expected_program_version: "${prog_v1}" }
              as: PlatformAdmin
            - call: "GET /confection/seasonal-programs/${prog_id}"
              payload: {}
              as: PlatformAdmin
              captures: { pvx: $.data.version }
          trigger:
            - call: "POST /confection/seasonal-programs/${prog_id}/advance"
              payload: { to_state: "OPEN_FOR_COMMITMENTS", expected_program_version: "${pvx}" }
              as: PlatformAdmin
              captures: { error_id: $.data.error_id }
          assert:
            - "the response status is 409 and error_id == ERR_INVALID_STATE"
            - "error_id != ERR_STALE_VERSION — the version was fresh; the terminal state itself rejects"
            - "SeasonalProgram.${prog_id}.status remains CANCELLED"

      - name: shipment_deliver_twice_returns_invalid_state
        claim_type: idempotency
        grounds:
          - state_machines.Shipment.PLANNED_to_DELIVERED
          - errors.ERR_INVALID_STATE
        distinguishing_aspect: "DELIVERED is terminal for the shipment; a second identical deliver call is rejected 409 ERR_INVALID_STATE and delivered_on does not move."
        test_recipe:
          setup:
            - "Program in SHIPPING; GOLD commitment 10 ALLOCATED; 5-unit shipment already DELIVERED at 2027-08-02T00:00:00Z."
          setup_api_calls:
            - *c_clock_0105
            - *c_prog
            - *c_prog_open
            - *c_rt
            - *c_wh
            - *c_prod_seas
            - *c_clock_0120
            - call: "POST /confection/retailer-commitments"
              payload: { program_id: "${prog_id}", retailer_id: "${r_gold}", product_id: "${prod_id}", committed_units: 10, ship_window_open_on: "2027-08-01T00:00:00Z", ship_window_close_on: "2027-09-10T00:00:00Z" }
              as: Retailer
              as_user_id: "${r_gold}"
              captures: { c_gold: $.data.id }
            - *c_submit_gold
            - *c_confirm_gold
            - call: "POST /confection/production-runs"
