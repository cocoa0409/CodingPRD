scaffold_difficulty_design:
  # =========================================================================
  - rule_id: dual_variant_calc
    instances:
      - name: credit_available_committed_vs_settled_diverge
        grounds:
          - calculations.account_credit_available
          - entities.ContractorAccount.fields.balance_cents
          - entities.ContractorAccount.fields.committed_cents
          - state_machines.SalesOrder.fulfillment_status=DRAFT_to_fulfillment_status=PLACED
        distinguishing_aspect: |
          On the ContractorAccount domain, after placing one unbilled order of total 58800 against a
          credit_limit of 100000, committed_cents == 58800 (committed view) while balance_cents == 0
          (settled view) for the SAME account data — the two variants produce different exposure numbers.
        test_recipe:
          setup:
            - "ContractorAccount A, credit_limit_cents 100000, net_terms_days 30, status ACTIVE, no invoices"
            - "One EACH Product (list_price_cents 5000) supplied by an ACTIVE vendor, on_hand 1000"
            - "SalesOrder O on account A with one line qty 12 -> subtotal 60000, tier1 2% discount 1200, total 58800, PLACED+UNBILLED"
          setup_api_calls:
            - call: "POST /vendors"
              payload: { name: "Acme", drop_ship_capable: false, coop_rebate_pct: 0 }
              as: InventoryManager
              captures: { vendor_id: $.data.id }
            - call: "POST /products"
              payload: { sku: "BOLT-1", vendor_id: "${vendor_id}", sell_mode: "EACH", aisle: "A1", bin: "B1", list_price_cents: 5000, reorder_point: 0, reorder_qty: 100 }
              as: InventoryManager
              captures: { prod_id: $.data.id }
            - call: "POST /products/${prod_id}/adjust-stock"
              payload: { delta: 1000 }
              as: InventoryManager
            - call: "POST /contractor-accounts"
              payload: { business_name: "Acct A", credit_limit_cents: 100000, net_terms_days: 30 }
              as: AccountsManager
              captures: { acct_id: $.data.id }
            - call: "POST /sales-orders"
              payload: { contractor_account_id: "${acct_id}" }
              as: SalesAssociate
              captures: { order_id: $.data.id, order_v0: $.data.version }
            - call: "POST /sales-orders/${order_id}/lines"
              payload: { product_id: "${prod_id}", qty: 12 }
              as: SalesAssociate
            - call: "POST /sales-orders/${order_id}/place"
              payload: { expected_sales_order_version: "${order_v0}" }
              as: SalesAssociate
          trigger:
            - call: "GET /contractor-accounts/${acct_id}"
              payload: {}
              as: AccountsManager
              captures: { bal: $.data.balance_cents, comm: $.data.committed_cents }
          assert:
            - "ContractorAccount.${acct_id}.balance_cents == 0"
            - "ContractorAccount.${acct_id}.committed_cents == 58800"
            - "SalesOrder.${order_id}.total_cents == 58800"

      - name: order_total_provisional_vs_final_inclusion_set
        grounds:
          - calculations.order_total_provisional
          - calculations.order_total_final
          - entities.SalesOrder.fields.pricing_mode
          - state_machines.SalesOrder.fulfillment_status=PLACED_to_fulfillment_status=FULFILLED
        distinguishing_aspect: |
          On the SalesOrder domain, the provisional variant sums lines with status==PENDING and leaves
          pricing_mode==PROVISIONAL, while the final variant sums lines with status==FULFILLED and sets
          pricing_mode==FINAL — different inclusion-set filters on a different entity than the credit calc.
        test_recipe:
          setup:
            - "ACTIVE vendor + EACH Product (list_price_cents 1000) on_hand 100"
            - "Cash SalesOrder (no account) with one line qty 10 -> subtotal 10000, no loyalty, total 10000, PLACED"
          setup_api_calls:
            - call: "POST /vendors"
              payload: { name: "V2" }
              as: InventoryManager
              captures: { v2: $.data.id }
            - call: "POST /products"
              payload: { sku: "NAIL-1", vendor_id: "${v2}", sell_mode: "EACH", aisle: "A2", bin: "B2", list_price_cents: 1000, reorder_point: 0, reorder_qty: 50 }
              as: InventoryManager
              captures: { p2: $.data.id }
            - call: "POST /products/${p2}/adjust-stock"
              payload: { delta: 100 }
              as: InventoryManager
            - call: "POST /sales-orders"
              payload: {}
              as: SalesAssociate
              captures: { o2: $.data.id, o2_v0: $.data.version }
            - call: "POST /sales-orders/${o2}/lines"
              payload: { product_id: "${p2}", qty: 10 }
              as: SalesAssociate
            - call: "POST /sales-orders/${o2}/place"
              payload: { expected_sales_order_version: "${o2_v0}" }
              as: SalesAssociate
              captures: { o2_v1: $.data.version }
          trigger:
            - call: "POST /sales-orders/${o2}/fulfill"
              payload: { expected_sales_order_version: "${o2_v1}" }
              as: SalesAssociate
              captures: { mode: $.data.pricing_mode, tot: $.data.total_cents }
          assert:
            - "SalesOrder.${o2}.pricing_mode == FINAL"
            - "SalesOrder.${o2}.total_cents == 10000"
            - "GET /sales-orders/${o2}/lines returns 1 line with status == FULFILLED"

  # =========================================================================
  - rule_id: combinatorial_formula
    instances:
      - name: lumber_line_per_line_rounding_then_sum
        grounds:
          - calculations.line_total
          - calculations.order_total_provisional
          - entities.Product.fields.sell_mode
          - entities.OrderLine.fields.line_total_cents
        distinguishing_aspect: |
          Mode (b) nested rounding: two BY_FOOT lines each raw 2497.5c round per-line to 2498 then sum
          to subtotal 4996 — NOT round(2497.5+2497.5)=4995; the per-line-then-sum order is pinned.
        test_recipe:
          setup:
            - "ACTIVE vendor + BY_FOOT Product price_per_foot_cents 333, cut_fee_cents 0, on_hand 1000 feet"
            - "Cash SalesOrder with two lines each qty 7.5 feet -> each raw 2497.5 -> each rounds to 2498"
          setup_api_calls:
            - call: "POST /vendors"
              payload: { name: "Lumber Co" }
              as: InventoryManager
              captures: { lv: $.data.id }
            - call: "POST /products"
              payload: { sku: "2X4-8", vendor_id: "${lv}", sell_mode: "BY_FOOT", aisle: "L1", bin: "R1", price_per_foot_cents: 333, cut_fee_cents: 0, reorder_point: 0, reorder_qty: 500 }
              as: InventoryManager
              captures: { lp: $.data.id }
            - call: "POST /products/${lp}/adjust-stock"
              payload: { delta: 1000 }
              as: InventoryManager
            - call: "POST /sales-orders"
              payload: {}
              as: SalesAssociate
              captures: { lo: $.data.id, lo_v0: $.data.version }
            - call: "POST /sales-orders/${lo}/lines"
              payload: { product_id: "${lp}", qty: 7.5 }
              as: SalesAssociate
              captures: { line1_total: $.data.line_total_cents }
            - call: "POST /sales-orders/${lo}/lines"
              payload: { product_id: "${lp}", qty: 7.5 }
              as: SalesAssociate
          trigger:
            - call: "POST /sales-orders/${lo}/place"
              payload: { expected_sales_order_version: "${lo_v0}" }
              as: SalesAssociate
              captures: { sub: $.data.subtotal_cents }
          assert:
            - "OrderLine.line_total_cents == 2498 for each line (round_half_up at the line)"
            - "SalesOrder.${lo}.subtotal_cents == 4996"
            - "SalesOrder.${lo}.total_cents == 4996"

      - name: loyalty_discount_keyed_on_pre_discount_subtotal_tier
        grounds:
          - calculations.loyalty_discount
          - calculations.order_total_provisional
          - entities.SalesOrder.fields.loyalty_discount_cents
          - entities.SalesOrder.fields.total_cents
        distinguishing_aspect: |
          Mode (c) circular-looking dependency: total = subtotal - loyalty_discount, but the discount tier
          is selected from the PRE-discount subtotal (60000 -> tier1 2% -> 1200), pinned so the discount
          never re-tiers off the post-discount total (58800 would still be tier1 here, but evaluation order is fixed).
        test_recipe:
          setup:
            - "ACTIVE vendor + EACH Product list_price_cents 5000, on_hand 100"
            - "ContractorAccount credit_limit 1000000 ACTIVE"
            - "Net-term SalesOrder one line qty 12 -> subtotal 60000"
          setup_api_calls:
            - call: "POST /vendors"
              payload: { name: "V3" }
              as: InventoryManager
              captures: { v3: $.data.id }
            - call: "POST /products"
              payload: { sku: "HINGE-1", vendor_id: "${v3}", sell_mode: "EACH", aisle: "A3", bin: "B3", list_price_cents: 5000, reorder_point: 0, reorder_qty: 50 }
              as: InventoryManager
              captures: { p3: $.data.id }
            - call: "POST /products/${p3}/adjust-stock"
              payload: { delta: 100 }
              as: InventoryManager
            - call: "POST /contractor-accounts"
              payload: { business_name: "Big Co", credit_limit_cents: 1000000, net_terms_days: 30 }
              as: AccountsManager
              captures: { a3: $.data.id }
            - call: "POST /sales-orders"
              payload: { contractor_account_id: "${a3}" }
              as: SalesAssociate
              captures: { o3: $.data.id, o3_v0: $.data.version }
            - call: "POST /sales-orders/${o3}/lines"
              payload: { product_id: "${p3}", qty: 12 }
              as: SalesAssociate
          trigger:
            - call: "POST /sales-orders/${o3}/place"
              payload: { expected_sales_order_version: "${o3_v0}" }
              as: SalesAssociate
              captures: { sub3: $.data.subtotal_cents, disc3: $.data.loyalty_discount_cents, tot3: $.data.total_cents }
          assert:
            - "SalesOrder.${o3}.subtotal_cents == 60000"
            - "SalesOrder.${o3}.loyalty_discount_cents == 1200"
            - "SalesOrder.${o3}.total_cents == 58800"

  # =========================================================================
  - rule_id: non_linear_state_machine
    instances:
      - name: sales_order_parallel_payment_and_fulfillment_dimensions
        grounds:
          - state_machines.SalesOrder.fulfillment_status=PLACED_to_fulfillment_status=FULFILLED
          - state_machines.SalesOrder.payment_status=UNBILLED_to_payment_status=INVOICED
          - entities.SalesOrder.fields.fulfillment_status
          - entities.SalesOrder.fields.payment_status
        distinguishing_aspect: |
          On SalesOrder, fulfillment_status (DRAFT->PLACED->FULFILLED) and payment_status
          (UNBILLED->INVOICED) advance on independent axes: after fulfill then invoice the row holds
          fulfillment_status==FULFILLED together with payment_status==INVOICED on the same record.
        test_recipe:
          setup:
            - "Net-term account ACTIVE credit_limit 1000000; EACH product on_hand 100; order one line qty 10 total 10000"
            - "Order PLACED then FULFILLED then INVOICED"
          setup_api_calls:
            - call: "POST /vendors"
              payload: { name: "V4" }
              as: InventoryManager
              captures: { v4: $.data.id }
            - call: "POST /products"
              payload: { sku: "SCREW-1", vendor_id: "${v4}", sell_mode: "EACH", aisle: "A4", bin: "B4", list_price_cents: 1000, reorder_point: 0, reorder_qty: 50 }
              as: InventoryManager
              captures: { p4: $.data.id }
            - call: "POST /products/${p4}/adjust-stock"
              payload: { delta: 100 }
              as: InventoryManager
            - call: "POST /contractor-accounts"
              payload: { business_name: "Par Co", credit_limit_cents: 1000000, net_terms_days: 30 }
              as: AccountsManager
              captures: { a4: $.data.id }
            - call: "POST /sales-orders"
              payload: { contractor_account_id: "${a4}" }
              as: SalesAssociate
              captures: { o4: $.data.id, o4_v0: $.data.version }
            - call: "POST /sales-orders/${o4}/lines"
              payload: { product_id: "${p4}", qty: 10 }
              as: SalesAssociate
            - call: "POST /sales-orders/${o4}/place"
              payload: { expected_sales_order_version: "${o4_v0}" }
              as: SalesAssociate
              captures: { o4_v1: $.data.version }
            - call: "POST /sales-orders/${o4}/fulfill"
              payload: { expected_sales_order_version: "${o4_v1}" }
              as: SalesAssociate
          trigger:
            - call: "POST /sales-orders/${o4}/invoice"
              payload: {}
              as: AccountsManager
          assert:
            - "SalesOrder.${o4}.fulfillment_status == FULFILLED"
            - "SalesOrder.${o4}.payment_status == INVOICED"

      - name: special_order_cyclic_revision_loop
        grounds:
          - state_machines.SpecialOrder.QUOTED_to_REVISION_REQUESTED
          - state_machines.SpecialOrder.REVISION_REQUESTED_to_QUOTED
          - entities.SpecialOrder.fields.revision_count
          - entities.SpecialOrder.fields.status
        distinguishing_aspect: |
          On SpecialOrder (different entity than SalesOrder), QUOTED<->REVISION_REQUESTED forms a cycle:
          after quote->request-revision->quote, status==QUOTED again and revision_count==1.
        test_recipe:
          setup:
            - "ACTIVE drop_ship_capable Vendor; ACTIVE ContractorAccount; SpecialOrder in DRAFT"
          setup_api_calls:
            - call: "POST /vendors"
              payload: { name: "DropCo", drop_ship_capable: true }
              as: InventoryManager
              captures: { dv: $.data.id }
            - call: "POST /contractor-accounts"
              payload: { business_name: "SO Co", credit_limit_cents: 1000000, net_terms_days: 30 }
              as: AccountsManager
              captures: { sa: $.data.id }
            - call: "POST /special-orders"
              payload: { vendor_id: "${dv}", contractor_account_id: "${sa}", description: "Custom door", qty: 2 }
              as: SalesAssociate
              captures: { so: $.data.id }
            - call: "POST /special-orders/${so}/quote"
              payload: { quoted_unit_cents: 30000 }
              as: SalesAssociate
            - call: "POST /special-orders/${so}/request-revision"
              payload: {}
              as: Contractor
              as_user_id: "${sa}"
          trigger:
            - call: "POST /special-orders/${so}/quote"
              payload: { quoted_unit_cents: 28000 }
              as: SalesAssociate
              captures: { st: $.data.status, rc: $.data.revision_count }
          assert:
            - "SpecialOrder.${so}.status == QUOTED"
            - "SpecialOrder.${so}.revision_count == 1"

  # =========================================================================
  - rule_id: transitive_cascade
    instances:
      - name: fulfill_cascades_line_to_onhand_to_reorder_flag_depth3
        grounds:
          - state_machines.SalesOrder.fulfillment_status=PLACED_to_fulfillment_status=FULFILLED
          - entities.OrderLine.fields.status
          - entities.Product.fields.on_hand
          - entities.Product.fields.reorder_needed
        distinguishing_aspect: |
          Depth-3 chain from the fulfill trigger: fulfill -> OrderLine.status FULFILLED -> that flip debits
          Product.on_hand (10 -> 2) -> that on_hand change flips Product.reorder_needed true because 2 <= reorder_point 2;
          each link is caused by the prior link, not directly by fulfill.
        test_recipe:
          setup:
            - "ACTIVE vendor + EACH Product list_price 1000, on_hand 10, reorder_point 2, reorder_qty 20, reorder_needed false"
            - "Cash order one line qty 8, PLACED"
          setup_api_calls:
            - call: "POST /vendors"
              payload: { name: "V5" }
              as: InventoryManager
              captures: { v5: $.data.id }
            - call: "POST /products"
              payload: { sku: "WASH-1", vendor_id: "${v5}", sell_mode: "EACH", aisle: "A5", bin: "B5", list_price_cents: 1000, reorder_point: 2, reorder_qty: 20 }
              as: InventoryManager
              captures: { p5: $.data.id }
            - call: "POST /products/${p5}/adjust-stock"
              payload: { delta: 10 }
              as: InventoryManager
            - call: "POST /sales-orders"
              payload: {}
              as: SalesAssociate
              captures: { o5: $.data.id, o5_v0: $.data.version }
            - call: "POST /sales-orders/${o5}/lines"
              payload: { product_id: "${p5}", qty: 8 }
              as: SalesAssociate
            - call: "POST /sales-orders/${o5}/place"
              payload: { expected_sales_order_version: "${o5_v0}" }
              as: SalesAssociate
              captures: { o5_v1: $.data.version }
          trigger:
            - call: "POST /sales-orders/${o5}/fulfill"
              payload: { expected_sales_order_version: "${o5_v1}" }
              as: SalesAssociate
          assert:
            - "GET /sales-orders/${o5}/lines line.status == FULFILLED"
            - "Product.${p5}.on_hand == 2"
            - "Product.${p5}.reorder_needed == true"

      - name: special_order_confirm_cascades_invoice_to_balance_depth2
        grounds:
          - state_machines.SpecialOrder.QUOTED_to_CONFIRMED
          - entities.SpecialOrder.fields.confirmed_total_cents
          - entities.Invoice.fields.status
          - entities.ContractorAccount.fields.balance_cents
        distinguishing_aspect: |
          Depth-2 chain from the confirm trigger (different origin than fulfill): confirm computes
          confirmed_total_cents and creates an Invoice ISSUED -> that Invoice flips ContractorAccount.balance_cents
          to the invoice amount (21500), not by the confirm acting on the account directly.
        test_recipe:
          setup:
            - "ACTIVE drop_ship Vendor; ACTIVE account credit_limit 1000000; SpecialOrder QUOTED at unit 4000 qty 5 (goods 20000 < 50000 -> +1500 surcharge -> 21500)"
          setup_api_calls:
            - call: "POST /vendors"
              payload: { name: "DropCo2", drop_ship_capable: true }
              as: InventoryManager
              captures: { dv2: $.data.id }
            - call: "POST /contractor-accounts"
              payload: { business_name: "SO Co2", credit_limit_cents: 1000000, net_terms_days: 30 }
              as: AccountsManager
              captures: { sa2: $.data.id }
            - call: "POST /special-orders"
              payload: { vendor_id: "${dv2}", contractor_account_id: "${sa2}", description: "Custom trim", qty: 5 }
              as: SalesAssociate
              captures: { so2: $.data.id }
            - call: "POST /special-orders/${so2}/quote"
              payload: { quoted_unit_cents: 4000 }
              as: SalesAssociate
          trigger:
            - call: "POST /special-orders/${so2}/confirm"
              payload: {}
              as: Contractor
              as_user_id: "${sa2}"
              captures: { ctot: $.data.confirmed_total_cents }
          assert:
            - "SpecialOrder.${so2}.confirmed_total_cents == 21500"
            - "ContractorAccount.${sa2}.balance_cents == 21500"

  # =========================================================================
  - rule_id: priority_pair_validation_conflict
    instances:
      - name: state_vs_fiscal_already_billed_beats_credit_check
        grounds:
          - validations[priority=7]
          - validations[priority=18]
          - state_machines.SalesOrder.fulfillment_status=FULFILLED_to_fulfillment_status=CANCELLED
        distinguishing_aspect: |
          Error-category pair state (priority 7 ERR_ORDER_ALREADY_BILLED) vs business_fiscal (priority 17
          ERR_CREDIT_LIMIT_EXCEEDED): a cancel on an INVOICED order returns ERR_ORDER_ALREADY_BILLED
          (state, lower priority number wins) rather than any fiscal error.
        test_recipe:
          setup:
            - "Net-term account credit_limit 1000000; EACH product on_hand 100; order placed+fulfilled+invoiced (payment_status INVOICED)"
          setup_api_calls:
            - call: "POST /vendors"
              payload: { name: "V6" }
              as: InventoryManager
              captures: { v6: $.data.id }
            - call: "POST /products"
              payload: { sku: "PIPE-1", vendor_id: "${v6}", sell_mode: "EACH", aisle: "A6", bin: "B6", list_price_cents: 1000, reorder_point: 0, reorder_qty: 50 }
              as: InventoryManager
              captures: { p6: $.data.id }
            - call: "POST /products/${p6}/adjust-stock"
              payload: { delta: 100 }
              as: InventoryManager
            - call: "POST /contractor-accounts"
              payload: { business_name: "PC", credit_limit_cents: 1000000, net_terms_days: 30 }
              as: AccountsManager
              captures: { a6: $.data.id }
            - call: "POST /sales-orders"
              payload: { contractor_account_id: "${a6}" }
              as: SalesAssociate
              captures: { o6: $.data.id, o6_v0: $.data.version }
            - call: "POST /sales-orders/${o6}/lines"
              payload: { product_id: "${p6}", qty: 10 }
              as: SalesAssociate
            - call: "POST /sales-orders/${o6}/place"
              payload: { expected_sales_order_version: "${o6_v0}" }
              as: SalesAssociate
              captures: { o6_v1: $.data.version }
            - call: "POST /sales-orders/${o6}/fulfill"
              payload: { expected_sales_order_version: "${o6_v1}" }
              as: SalesAssociate
            - call: "POST /sales-orders/${o6}/invoice"
              payload: {}
              as: AccountsManager
          trigger:
            - call: "POST /sales-orders/${o6}/cancel"
              payload: {}
              as: SalesAssociate
              captures: { err: $.data.error_id }
          assert:
            - "HTTP status == 409"
            - "data.error_id == ERR_ORDER_ALREADY_BILLED"

      - name: state_offline_station_beats_safety_uncertified_cylinder
        grounds:
          - validations[priority=9]
          - validations[priority=11]
          - state_machines.ServiceTicket.BOOKED_to_IN_PROGRESS
        distinguishing_aspect: |
          Error-category pair state (priority 9 ERR_STATION_OFFLINE) vs business_safety (priority 11
          ERR_CYLINDER_NOT_CERTIFIED): a BOOKED PROPANE_EXCHANGE ticket whose cylinder_certified is false
          on a station that was set OFFLINE fails BOTH checks; the lower-numbered state check wins, so the
          response is ERR_STATION_OFFLINE, not ERR_CYLINDER_NOT_CERTIFIED.
        test_recipe:
          setup:
            - "ServiceStation buffer 0; PROPANE_EXCHANGE ticket BOOKED with cylinder_certified false; station then set OFFLINE"
          setup_api_calls:
            - call: "POST /service-stations"
              payload: { name: "PROP-1", buffer_minutes: 0 }
              as: InventoryManager
              captures: { ss: $.data.id }
            - call: "POST /service-tickets"
              payload: { service_station_id: "${ss}", service_type: "PROPANE_EXCHANGE", cylinder_certified: false, scheduled_start: "2026-02-01T09:00:00Z", scheduled_end: "2026-02-01T09:30:00Z" }
              as: SalesAssociate
              captures: { tk: $.data.id }
            - call: "POST /service-stations/${ss}/set-offline"
              payload: { offline: true }
              as: InventoryManager
          trigger:
            - call: "POST /service-tickets/${tk}/start"
              payload: {}
              as: SalesAssociate
              captures: { err2: $.data.error_id }
          assert:
            - "HTTP status == 409"
            - "data.error_id == ERR_STATION_OFFLINE"
            - "ServiceTicket.${tk}.status == BOOKED (start rejected, no fee computed)"

  # =========================================================================
  - rule_id: boundary_precision_check
    instances:
      - name: reorder_flag_at_exact_reorder_point_inclusive
        grounds:
          - calculations.reorder_flag
          - entities.Product.fields.reorder_needed
          - entities.Product.fields.on_hand
        distinguishing_aspect: |
          Boundary on Product.on_hand via /products/{id}/adjust-stock: on_hand == reorder_point (5 == 5)
          sets reorder_needed true (inclusive <=), while on_hand reorder_point+1 (6) keeps it false.
        test_recipe:
          setup:
            - "EACH Product reorder_point 5, on_hand 6 after first adjust (reorder_needed false)"
          setup_api_calls:
            - call: "POST /vendors"
              payload: { name: "V7" }
              as: InventoryManager
              captures: { v7: $.data.id }
            - call: "POST /products"
              payload: { sku: "TAPE-1", vendor_id: "${v7}", sell_mode: "EACH", aisle: "A7", bin: "B7", list_price_cents: 500, reorder_point: 5, reorder_qty: 20 }
              as: InventoryManager
              captures: { p7: $.data.id }
            - call: "POST /products/${p7}/adjust-stock"
              payload: { delta: 6 }
              as: InventoryManager
              captures: { onhand6: $.data.on_hand, flag6: $.data.reorder_needed }
          trigger:
            - call: "POST /products/${p7}/adjust-stock"
              payload: { delta: -1 }
              as: InventoryManager
              captures: { onhand5: $.data.on_hand, flag5: $.data.reorder_needed }
          assert:
            - "Product.${p7}.on_hand == 5"
            - "Product.${p7}.reorder_needed == true"

      - name: empty_order_place_zero_lines_rejected
        grounds:
          - validations[priority=10]
          - state_machines.SalesOrder.fulfillment_status=DRAFT_to_fulfillment_status=PLACED
          - entities.OrderLine.fields.status
        distinguishing_aspect: |
          Empty-collection boundary on a DIFFERENT endpoint (/sales-orders/{id}/place): an order with zero
          PENDING lines is rejected with ERR_EMPTY_ORDER (count == 0 edge), distinct from the numeric on_hand boundary.
        test_recipe:
          setup:
            - "Cash SalesOrder created with no lines added"
          setup_api_calls:
            - call: "POST /sales-orders"
              payload: {}
              as: SalesAssociate
              captures: { eo: $.data.id, eo_v0: $.data.version }
          trigger:
            - call: "POST /sales-orders/${eo}/place"
              payload: { expected_sales_order_version: "${eo_v0}" }
              as: SalesAssociate
              captures: { err3: $.data.error_id }
          assert:
            - "HTTP status == 409"
            - "data.error_id == ERR_EMPTY_ORDER"

  # =========================================================================
  - rule_id: cross_entity_state_dependency
    instances:
      - name: order_fulfill_blocked_by_discontinued_product
        grounds:
          - validations[priority=13]
          - state_machines.SalesOrder.fulfillment_status=PLACED_to_fulfillment_status=FULFILLED
          - entities.Product.fields.status
        distinguishing_aspect: |
          Entity pair SalesOrder->Product: a PLACED order cannot fulfill while a line's Product.status==DISCONTINUED
          (ERR_PRODUCT_DISCONTINUED); the order's valid transition depends on the Product's state.
        test_recipe:
          setup:
            - "EACH product on_hand 100, order placed, then product discontinued"
          setup_api_calls:
            - call: "POST /vendors"
              payload: { name: "V8" }
              as: InventoryManager
              captures: { v8: $.data.id }
            - call: "POST /products"
              payload: { sku: "GLUE-1", vendor_id: "${v8}", sell_mode: "EACH", aisle: "A8", bin: "B8", list_price_cents: 1000, reorder_point: 0, reorder_qty: 50 }
              as: InventoryManager
              captures: { p8: $.data.id }
            - call: "POST /products/${p8}/adjust-stock"
              payload: { delta: 100 }
              as: InventoryManager
            - call: "POST /sales-orders"
              payload: {}
              as: SalesAssociate
              captures: { o8: $.data.id, o8_v0: $.data.version }
            - call: "POST /sales-orders/${o8}/lines"
              payload: { product_id: "${p8}", qty: 10 }
              as: SalesAssociate
            - call: "POST /sales-orders/${o8}/place"
              payload: { expected_sales_order_version: "${o8_v0}" }
              as: SalesAssociate
              captures: { o8_v1: $.data.version }
            - call: "POST /products/${p8}/discontinue"
              payload: {}
              as: InventoryManager
          trigger:
            - call: "POST /sales-orders/${o8}/fulfill"
              payload: { expected_sales_order_version: "${o8_v1}" }
              as: SalesAssociate
              captures: { err4: $.data.error_id }
          assert:
            - "HTTP status == 409"
            - "data.error_id == ERR_PRODUCT_DISCONTINUED"

      - name: rental_checkout_blocked_by_maintenance_asset
        grounds:
          - errors[ERR_ASSET_UNAVAILABLE]
          - state_machines.RentalAgreement.RESERVED_to_CHECKED_OUT
          - entities.RentalAsset.fields.status
        distinguishing_aspect: |
          Entity pair RentalAgreement->RentalAsset (different pair than Order->Product): a RESERVED agreement
          cannot check out while RentalAsset.status==MAINTENANCE (ERR_ASSET_UNAVAILABLE).
        test_recipe:
          setup:
            - "RentalAsset AVAILABLE; agreement RESERVED for [2026-02-01, 2026-02-03); clock at 2026-02-01; asset then set MAINTENANCE"
          setup_api_calls:
            - call: "POST /rental-assets"
              payload: { asset_tag: "TAG-1", category: "AUGER", daily_rate_cents: 4500, deposit_cents: 10000 }
              as: RentalClerk
              captures: { ra: $.data.id }
            - call: "POST /rental-agreements"
              payload: { rental_asset_id: "${ra}", start_at: "2026-02-01T08:00:00Z", due_at: "2026-02-03T08:00:00Z" }
              as: RentalClerk
              captures: { rg: $.data.id }
            - call: "POST /rental-assets/${ra}/set-maintenance"
              payload: { maintenance: true }
              as: RentalClerk
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-02-01T09:00:00Z" }
              as: RentalClerk
          trigger:
            - call: "POST /rental-agreements/${rg}/check-out"
              payload: {}
              as: RentalClerk
              captures: { err5: $.data.error_id }
          assert:
            - "HTTP status == 409"
            - "data.error_id == ERR_ASSET_UNAVAILABLE"

  # =========================================================================
  - rule_id: resource_temporal_overlap
    instances:
      - name: rental_half_open_overlap_backtoback_allowed
        grounds:
          - validations[priority=15]
          - entities.RentalAgreement.fields.start_at
          - entities.RentalAgreement.fields.due_at
          - entities.RentalAsset.fields.id
        distinguishing_aspect: |
          RentalAsset half-open [start, due) semantics: a second agreement starting exactly at the first's
          due_at (back-to-back, adjacency allowed) succeeds, but one overlapping the interior is rejected ERR_RENTAL_OVERLAP.
        test_recipe:
          setup:
            - "RentalAsset AVAILABLE; agreement A reserved [2026-03-01T08:00Z, 2026-03-02T08:00Z)"
          setup_api_calls:
            - call: "POST /rental-assets"
              payload: { asset_tag: "TAG-2", category: "TILLER", daily_rate_cents: 5000, deposit_cents: 0 }
              as: RentalClerk
              captures: { ra2: $.data.id }
            - call: "POST /rental-agreements"
              payload: { rental_asset_id: "${ra2}", start_at: "2026-03-01T08:00:00Z", due_at: "2026-03-02T08:00:00Z" }
              as: RentalClerk
              captures: { rgA: $.data.id }
            - call: "POST /rental-agreements"
              payload: { rental_asset_id: "${ra2}", start_at: "2026-03-02T08:00:00Z", due_at: "2026-03-03T08:00:00Z" }
              as: RentalClerk
              captures: { rgB: $.data.id }
          trigger:
            - call: "POST /rental-agreements"
              payload: { rental_asset_id: "${ra2}", start_at: "2026-03-01T12:00:00Z", due_at: "2026-03-01T18:00:00Z" }
              as: RentalClerk
              captures: { err6: $.data.error_id }
          assert:
            - "agreement B (back-to-back at 2026-03-02T08:00Z) was created 201 (adjacency allowed)"
            - "HTTP status == 409 for the interior-overlapping trigger"
            - "data.error_id == ERR_RENTAL_OVERLAP"

      - name: service_station_buffer_expanded_overlap
        grounds:
          - validations[priority=16]
          - entities.ServiceStation.fields.buffer_minutes
          - entities.ServiceTicket.fields.scheduled_start
          - entities.ServiceTicket.fields.scheduled_end
        distinguishing_aspect: |
          ServiceStation buffer-expanded semantics (different resource + different interval arithmetic than
          rental): a ticket whose window falls inside the 30-minute clean-down buffer after an existing
          ticket is rejected ERR_STATION_BOOKING_CONFLICT even though the raw windows do not overlap.
        test_recipe:
          setup:
            - "ServiceStation buffer_minutes 30; ticket A PAINT_MIX [09:00,09:30)"
          setup_api_calls:
            - call: "POST /service-stations"
              payload: { name: "PAINT-1", buffer_minutes: 30 }
              as: InventoryManager
              captures: { st2: $.data.id }
            - call: "POST /service-tickets"
              payload: { service_station_id: "${st2}", service_type: "PAINT_MIX", scheduled_start: "2026-04-01T09:00:00Z", scheduled_end: "2026-04-01T09:30:00Z" }
              as: SalesAssociate
              captures: { tkA: $.data.id }
          trigger:
            - call: "POST /service-tickets"
              payload: { service_station_id: "${st2}", service_type: "KEY_CUT", scheduled_start: "2026-04-01T09:45:00Z", scheduled_end: "2026-04-01T10:00:00Z" }
              as: SalesAssociate
              captures: { err7: $.data.error_id }
          assert:
            - "HTTP status == 409 (09:45 falls inside [09:30, 10:00) buffer window after ticket A)"
            - "data.error_id == ERR_STATION_BOOKING_CONFLICT"

  # =========================================================================
  - rule_id: compensating_invariant
    instances:
      - name: cancel_fulfilled_order_restores_onhand_units_invariant
        grounds:
          - state_machines.SalesOrder.fulfillment_status=FULFILLED_to_fulfillment_status=CANCELLED
          - entities.Product.fields.on_hand
          - entities.OrderLine.fields.status
        distinguishing_aspect: |
          Conserved quantity = physical inventory units. Fulfill debits Product.on_hand by 8 (10->2); cancelling
          the FULFILLED unbilled order restocks exactly 8 (2->10) so global on_hand returns to its pre-fulfill value
          with zero drift.
        test_recipe:
          setup:
            - "EACH product on_hand 10; cash order one line qty 8 placed then fulfilled (on_hand now 2)"
          setup_api_calls:
            - call: "POST /vendors"
              payload: { name: "V9" }
              as: InventoryManager
              captures: { v9: $.data.id }
            - call: "POST /products"
              payload: { sku: "DRILL-1", vendor_id: "${v9}", sell_mode: "EACH", aisle: "A9", bin: "B9", list_price_cents: 1000, reorder_point: 0, reorder_qty: 50 }
              as: InventoryManager
              captures: { p9: $.data.id }
            - call: "POST /products/${p9}/adjust-stock"
              payload: { delta: 10 }
              as: InventoryManager
            - call: "POST /sales-orders"
              payload: {}
              as: SalesAssociate
              captures: { o9: $.data.id, o9_v0: $.data.version }
            - call: "POST /sales-orders/${o9}/lines"
              payload: { product_id: "${p9}", qty: 8 }
              as: SalesAssociate
            - call: "POST /sales-orders/${o9}/place"
              payload: { expected_sales_order_version: "${o9_v0}" }
              as: SalesAssociate
              captures: { o9_v1: $.data.version }
            - call: "POST /sales-orders/${o9}/fulfill"
              payload: { expected_sales_order_version: "${o9_v1}" }
              as: SalesAssociate
          trigger:
            - call: "POST /sales-orders/${o9}/cancel"
              payload: {}
              as: SalesAssociate
          assert:
            - "Product.${p9}.on_hand == 10"
            - "GET /sales-orders/${o9}/lines line.status == RESTOCKED"
            - "SalesOrder.${o9}.fulfillment_status == CANCELLED"

      - name: void_invoice_restores_account_balance_money_invariant
        grounds:
          - state_machines.SalesOrder.payment_status=INVOICED_to_payment_status=VOIDED
          - entities.Invoice.fields.status
          - entities.ContractorAccount.fields.balance_cents
        distinguishing_aspect: |
          Conserved quantity = account money (balance_cents = sum of ISSUED invoices), a different quantity than
          inventory units. Invoicing pushes balance_cents to 10000; voiding the invoice restores balance_cents to
          its exact pre-invoice value 0 with no drift.
        test_recipe:
          setup:
            - "Net-term account credit_limit 1000000 balance 0; EACH product on_hand 100; order placed+fulfilled+invoiced -> balance 10000"
          setup_api_calls:
            - call: "POST /vendors"
              payload: { name: "V10" }
              as: InventoryManager
              captures: { v10: $.data.id }
            - call: "POST /products"
              payload: { sku: "SAW-1", vendor_id: "${v10}", sell_mode: "EACH", aisle: "A10", bin: "B10", list_price_cents: 1000, reorder_point: 0, reorder_qty: 50 }
              as: InventoryManager
              captures: { p10: $.data.id }
            - call: "POST /products/${p10}/adjust-stock"
              payload: { delta: 100 }
              as: InventoryManager
            - call: "POST /contractor-accounts"
              payload: { business_name: "VC", credit_limit_cents: 1000000, net_terms_days: 30 }
              as: AccountsManager
              captures: { a10: $.data.id }
            - call: "POST /sales-orders"
              payload: { contractor_account_id: "${a10}" }
              as: SalesAssociate
              captures: { o10: $.data.id, o10_v0: $.data.version }
            - call: "POST /sales-orders/${o10}/lines"
              payload: { product_id: "${p10}", qty: 10 }
              as: SalesAssociate
            - call: "POST /sales-orders/${o10}/place"
              payload: { expected_sales_order_version: "${o10_v0}" }
              as: SalesAssociate
              captures: { o10_v1: $.data.version }
            - call: "POST /sales-orders/${o10}/fulfill"
              payload: { expected_sales_order_version: "${o10_v1}" }
              as: SalesAssociate
            - call: "POST /sales-orders/${o10}/invoice"
              payload: {}
              as: AccountsManager
          trigger:
            - call: "POST /sales-orders/${o10}/void-invoice"
              payload: {}
              as: AccountsManager
          assert:
            - "ContractorAccount.${a10}.balance_cents == 0"
            - "SalesOrder.${o10}.payment_status == VOIDED"
