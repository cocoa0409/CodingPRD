      - name: collateral_release_exactly_at_requirement_allowed
        claim_type: satisfaction_pass
        grounds: ["validations[priority=12]", "errors[ERR_COLLATERAL_SHORTFALL]", state_machines.CollateralPosting.POSTED_to_RELEASED]
        distinguishing_aspect: "Fiscal boundary with equality semantics: releasing down to EXACTLY effective_requirement is allowed; one cent below is ERR_COLLATERAL_SHORTFALL."
        test_recipe:
          setup:
            - "INVESTMENT_GRADE participant with FINAL statement +400000 (capacity event); margin call 300000 OPEN (effective 400000 − 100000)"
            - "Posting X 300000 cures the call; posting Y 100000 brings posted to 400000"
          setup_api_calls:
            - { call: "POST /market/_clock/set_current_utc", payload: { to_iso8601: "2026-08-01T00:00:00Z" }, as: IsoOperator }
            - call: "POST /market/participants"
              payload: { company_name: "Rel Co", credit_rating_tier: "INVESTMENT_GRADE" }
              as: IsoOperator
              captures: { p_id: $.data.id }
            - call: "POST /market/generators"
              payload: { market_participant_id: "${p_id}", unit_name: "U1", pricing_node: "WEST_HUB", capacity_mw: 10 }
              as: IsoOperator
