      assert:
      - "the review by co-1, the licence's submitted_by_user_id, returns 409 ERR_SEGREGATION_OF_DUTIES even though ComplianceOfficer is the endpoint's only permitted role"
      - "the refused review leaves verification_status PENDING_REVIEW, reviewed_by_user_id null, review_note null and verified_at null: no field of the licence records the attempt"
      - "the review by co-2 returns 200 with verification_status VERIFIED and reviewed_by_user_id co-2"
      - "the override by co-3, the form's screened_by_user_id, returns 409 ERR_SEGREGATION_OF_DUTIES; the role check passed because the caller presented SpaDirector, so only the X-User-ID equality can explain the refusal"
      - "the refused override leaves status SCREENED_FLAGGED, overridden_by_user_id null, override_reason null and flagged_condition_codes [\"ACUTE_HYPERTENSION\"]"
      - "the override by dir-1 returns 200 with status OVERRIDDEN, overridden_by_user_id dir-1 and override_reason recorded"
      - "the counterparty swap performed by POST /therapist-licenses/{id}/resubmit is not exercised here; §1.8 non_linear_state_machine / license_reject_resubmit_verify_cycle_swaps_sod_counterparty covers it"

  - name: satisfaction_pass_with_every_gate_armed_at_its_inclusive_boundary
    claim_type: Satisfaction → Pass
    grounds:
    - validations.p12_ERR_INTAKE_NOT_CLEARED.check
    - validations.p14_ERR_CONTRAINDICATION_PRESENT.check
    - validations.p16_ERR_LICENSE_EXPIRED.check
    - validations.p19_ERR_SCOPE_OF_PRACTICE_VIOLATION.check
    - validations.p23_ERR_OUTSIDE_SHIFT_WINDOW.check
    - validations.p26_ERR_BOOKING_LEAD_TIME.check
    distinguishing_aspect: "Five independent rungs sit exactly on their inclusive boundary in one request — licence expires_on == date(clock), certification expires_on == date(clock), start_at == clock + MIN_LEAD_MINUTES exactly, and [start_at, end_at] equal to the AVAILABLE block's own bounds — so any single comparison implemented as strict rather than inclusive turns this 201 into a 409, and the paired 11:01 probe proves the shift bound is not merely lenient."
    test_recipe:
      setup: The clock sits at 2026-08-09T09:00:00.000Z. The therapist's licence and certification both expire on 2026-08-09, the AVAILABLE shift block runs exactly 2026-08-09T11:00Z to 2026-08-09T12:00Z, and the guest's authoritative intake form is OVERRIDDEN carrying RECENT_SURGERY_90D while the treatment contraindicates only ACUTE_HYPERTENSION.
      setup_api_calls:
      - call: POST /_clock/set_current_utc
        payload: { current_utc: "2026-08-09T09:00:00.000Z" }
        as: SpaDirector
      - call: POST /treatment-types
