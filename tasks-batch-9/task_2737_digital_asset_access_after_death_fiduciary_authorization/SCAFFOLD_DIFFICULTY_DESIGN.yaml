      - name: pending_order_state_outranks_out_of_term_claim_period
        grounds:
          - validations[priority=33]
          - validations[priority=59]
          - errors.ERR_INVALID_ORDER_STATE
          - errors.ERR_CLAIM_PERIOD_OUT_OF_TERM
        distinguishing_aspect: |
          One request body violates BOTH priority 33 (the order is still PENDING, not CONFIRMED) and
          priority 59 (the claimed interval starts before term_start_date and ends after
          term_end_date): the response must be ERR_INVALID_ORDER_STATE with HTTP 409, and the very
          same body sent again after the order reaches CONFIRMED must then return
          ERR_CLAIM_PERIOD_OUT_OF_TERM with HTTP 400 — proving the ordering rather than either rule
          in isolation.
