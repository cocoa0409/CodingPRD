  # ===========================================================================
  - rule_id: resource_temporal_overlap
    instances:
      - name: rate_schedule_window_half_open_overlap
        grounds:
          - entities.RateSchedule.fields.effective_from
          - entities.RateSchedule.fields.effective_to
          - errors.ERR_SCHEDULE_OVERLAP
        distinguishing_aspect: |
          Interval semantics: half-open [from, to) on RateSchedule. A new
          schedule starting exactly at the previous one's effective_to is
          ADJACENT and accepted; one starting one second earlier OVERLAPS and
          is rejected with ERR_SCHEDULE_OVERLAP.
        test_recipe:
          setup:
            - "Agency AWAY ACTIVE with an existing ACTIVE schedule for P1/CLASS_2 covering [2026-09-01T00:00:00Z, 2026-10-01T00:00:00Z)."
          setup_api_calls:
            - call: "POST /toll/agencies"
              payload: { agency_code: "AWAY", name: "Away Toll Authority", home_state: "NJ", reciprocity_fee_bps: 150 }
              as: SettlementOfficer
              captures: { away_id: "$.data.id" }
            - call: "POST /toll/agencies/${away_id}/rate-schedules"
              payload: { plaza_code: "P1", vehicle_class: "CLASS_2", base_rate_cents: 800, axle_multiplier: 1.0, peak_multiplier: 1.0, image_fee_cents: 100, effective_from: "2026-09-01T00:00:00Z", effective_to: "2026-10-01T00:00:00Z" }
              as: AgencyOperations
          trigger:
            - call: "POST /toll/agencies/${away_id}/rate-schedules"
              payload: { plaza_code: "P1", vehicle_class: "CLASS_2", base_rate_cents: 850, axle_multiplier: 1.0, peak_multiplier: 1.0, image_fee_cents: 100, effective_from: "2026-10-01T00:00:00Z", effective_to: "2026-11-01T00:00:00Z" }
              as: AgencyOperations
              captures: { adj_id: "$.data.id" }
            - call: "POST /toll/agencies/${away_id}/rate-schedules"
              payload: { plaza_code: "P1", vehicle_class: "CLASS_2", base_rate_cents: 860, axle_multiplier: 1.0, peak_multiplier: 1.0, image_fee_cents: 100, effective_from: "2026-09-30T23:59:59Z", effective_to: "2026-11-01T00:00:00Z" }
              as: AgencyOperations
              captures: { err: "$.data.error_id" }
          assert:
            - "the adjacent schedule is accepted with 201 and id ${adj_id}"
            - "the one-second-early schedule is rejected with ERR_SCHEDULE_OVERLAP (409)"

      - name: plate_agreement_shared_state_overlap
        grounds:
          - entities.PlateDataAgreement.fields.covers_states
          - errors.ERR_AGREEMENT_OVERLAP
        distinguishing_aspect: |
          Different resource + different semantics: PlateDataAgreement
          overlap is computed on the INTERSECTION of covers_states, not just
          the time window — a temporally overlapping agreement for the same
          agency pair but DISJOINT state sets is accepted, while any shared
          state with overlapping time is rejected.
        test_recipe:
          setup:
            - "Agencies AWAY and PROV ACTIVE; existing agreement AWAY<-PROV covering [NY, NJ] for [2026-09-01, 2027-09-01)."
          setup_api_calls:
            - call: "POST /toll/agencies"
              payload: { agency_code: "AWAY", name: "Away Toll Authority", home_state: "NJ", reciprocity_fee_bps: 150 }
              as: SettlementOfficer
              captures: { away_id: "$.data.id" }
            - call: "POST /toll/agencies"
              payload: { agency_code: "PROV", name: "Prov DMV Proxy", home_state: "CT", reciprocity_fee_bps: 100 }
              as: SettlementOfficer
              captures: { prov_id: "$.data.id" }
            - call: "POST /toll/plate-data-agreements"
              payload: { requesting_agency_id: "${away_id}", providing_agency_id: "${prov_id}", effective_from: "2026-09-01T00:00:00Z", effective_to: "2027-09-01T00:00:00Z", covers_states: ["NY", "NJ"] }
              as: SettlementOfficer
              captures: { a1: "$.data.id" }
          trigger:
            - call: "POST /toll/plate-data-agreements"
              payload: { requesting_agency_id: "${away_id}", providing_agency_id: "${prov_id}", effective_from: "2026-10-01T00:00:00Z", effective_to: "2027-10-01T00:00:00Z", covers_states: ["PA", "CT"] }
              as: SettlementOfficer
              captures: { a2: "$.data.id" }
            - call: "POST /toll/plate-data-agreements"
              payload: { requesting_agency_id: "${away_id}", providing_agency_id: "${prov_id}", effective_from: "2026-10-01T00:00:00Z", effective_to: "2027-10-01T00:00:00Z", covers_states: ["NY"] }
              as: SettlementOfficer
              captures: { err: "$.data.error_id" }
          assert:
            - "the disjoint-state agreement (PA, CT) is accepted with 201 and id ${a2} despite full time overlap"
            - "the shared-state agreement (NY) is rejected with ERR_AGREEMENT_OVERLAP (409)"

  # ===========================================================================
  - rule_id: compensating_invariant
    instances:
      - name: toll_void_restores_balance_exactly
        grounds:
          - state_machines.TollTransaction.POSTED_to_VOIDED
          - entities.Account.fields.balance_cents
        distinguishing_aspect: |
          Conserved quantity: Account.balance_cents. Posting a toll then
          voiding the same POSTED transaction returns the balance to its exact
          pre-post value (B_post = B0 - charged; B_void = B_post + charged =
          B0) — including the discount that was granted and the
          discount_used_today_cents ledger NOT being restored.
        test_recipe:
          setup:
            - "Agencies HOME/AWAY; AWAY P1 CLASS_2 base 800; plan 20% uncapped; account balance 5000 with TAG-I."
            - "One trip posted: charged 640, balance 4360, discount_used_today_cents 160."
          setup_api_calls:
            - call: "POST /toll/agencies"
              payload: { agency_code: "HOME", name: "Home Toll Authority", home_state: "NY", reciprocity_fee_bps: 100 }
              as: SettlementOfficer
              captures: { home_id: "$.data.id" }
            - call: "POST /toll/agencies"
              payload: { agency_code: "AWAY", name: "Away Toll Authority", home_state: "NJ", reciprocity_fee_bps: 150 }
              as: SettlementOfficer
              captures: { away_id: "$.data.id" }
            - call: "POST /toll/agencies/${away_id}/rate-schedules"
              payload: { plaza_code: "P1", vehicle_class: "CLASS_2", base_rate_cents: 800, axle_multiplier: 1.0, peak_multiplier: 1.0, image_fee_cents: 100, effective_from: "2026-09-01T00:00:00Z", effective_to: "2026-09-30T00:00:00Z" }
              as: AgencyOperations
            - call: "POST /toll/agencies/${home_id}/discount-plans"
              payload: { plan_code: "PROMO20", discount_pct: 0.20, daily_discount_cap_cents: 0, applies_to_agency_codes: ["AWAY"] }
              as: AgencyOperations
              captures: { plan_id: "$.data.id" }
            - call: "POST /toll/accounts"
              payload: { home_agency_id: "${home_id}", holder_name: "Ivy Void", holder_email: "ivy@example.com", discount_plan_id: "${plan_id}", opening_balance_cents: 5000 }
              as: AgencyOperations
              captures: { acct: "$.data.id" }
            - call: "POST /toll/accounts/${acct}/transponders"
              payload: { tag_number: "TAG-I", vehicle_class: "CLASS_2", plate_number: "VOID01", plate_state: "NY" }
              as: AgencyOperations
            - call: "POST /toll/toll-transactions"
              payload: { tag_number: "TAG-I", away_agency_id: "${away_id}", plaza_code: "P1", trip_timestamp: "2026-09-11T09:00:00Z", is_peak: false, idempotency_key: "i1" }
              as: AgencyOperations
              captures: { txn: "$.data.id" }
          trigger:
            - call: "POST /toll/toll-transactions/${txn}/void"
              payload: {}
              as: AgencyOperations
          assert:
            - "TollTransaction.${txn}.status == VOIDED"
            - "Account.${acct}.balance_cents == 5000 (invariant: post-then-void conserves balance exactly)"
            - "Account.${acct}.discount_used_today_cents == 160 (explicitly NOT restored — voids do not refund cap)"

      - name: settlement_sweep_conserves_line_total
        grounds:
          - calculations.settlement_net
          - state_machines.TollTransaction.POSTED_to_SETTLED
        distinguishing_aspect: |
          Conserved quantity: sum of charged amounts. Sweeping N POSTED
          transactions into a settlement file conserves the total money:
          file.gross_amount_cents == sum(line charged), and
          gross == fee + net exactly (no cent is created or destroyed by
          per-line rounding). A second generate for the same pair afterwards
          yields an empty file with all amounts 0 — nothing is double-swept.
        test_recipe:
          setup:
            - "Agencies HOME (100 bps) and AWAY (150 bps); three POSTED trips charged 640, 1188, 300 (via schedules: P1 base 800 CLASS_2 with 20% plan; P9 base 475 CLASS_5 axle 2.5 peak 1.0 with 20% plan -> 950; use discount 0 plan to keep math: instead three trips charged 101+202+303 as in settlement instance)."
            - "Uses discount-0 plan: charges exactly 101, 202, 303."
          setup_api_calls:
            - call: "POST /toll/agencies"
              payload: { agency_code: "HOME", name: "Home Toll Authority", home_state: "NY", reciprocity_fee_bps: 100 }
              as: SettlementOfficer
              captures: { home_id: "$.data.id" }
            - call: "POST /toll/agencies"
