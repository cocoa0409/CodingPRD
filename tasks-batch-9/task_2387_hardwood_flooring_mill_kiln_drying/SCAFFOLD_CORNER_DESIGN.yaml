        grounds: ["validations[priority 49]", "errors[ERR_DUPLICATE_CODE]"]
        distinguishing_aspect: "Uniqueness is per code column, so a second RED_OAK species and a second K1 chamber each get 409 while an unused code on the same endpoint succeeds."
        test_recipe:
          setup: ["One RED_OAK species profile and one K1 chamber already exist."]
          setup_api_calls:
            - { call: "POST /_clock/set_current_utc", payload: { current_utc: "2026-08-01T00:00:00.000Z" }, as: MillAdmin }
            - { call: "POST /mill/species-profiles", payload: { species_code: "RED_OAK", common_name: "Red Oak", density_class: "DENSE", tangential_shrinkage_coefficient: 0.145, target_moisture_pct: 7.0, max_moisture_gradient_pp: 2.0 }, as: MillAdmin }
            - { call: "POST /mill/kiln-chambers", payload: { chamber_code: "K1", capacity_board_feet: 12000 }, as: MillAdmin }
          trigger:
            - { call: "POST /mill/species-profiles", payload: { species_code: "RED_OAK", common_name: "Northern Red Oak", density_class: "MEDIUM", tangential_shrinkage_coefficient: 0.120, target_moisture_pct: 8.0, max_moisture_gradient_pp: 1.5 }, as: MillAdmin }
