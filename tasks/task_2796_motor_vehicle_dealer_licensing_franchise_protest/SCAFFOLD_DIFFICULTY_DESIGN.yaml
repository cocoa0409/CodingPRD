  - rule_id: compensating_invariant
    instances:
      - name: restitution_ledger_conserved_after_payment
        grounds:
          - calculations.restitution_ledger
          - validations.priority_84_ERR_RESTITUTION_OVERPAYMENT
          - state_machines.ConsumerComplaint.SANCTIONED_to_CLOSED_SATISFIED
          - entities.Dealer.fields.restitution_outstanding_cents
        distinguishing_aspect: |
          Conserved quantity: money. restitution_ordered_cents == restitution_paid_cents plus the
          complaint's contribution to Dealer.restitution_outstanding_cents must hold after every
          write. A partial payment moves value across the equality without changing the sum, an
          overpayment of one cent is refused outright rather than clipped (so the invariant cannot
          be broken), and the settling payment drives the contribution to exactly 0 while the
          6 disciplinary points survive — paying restitution never retires points.
        test_recipe:
          setup:
            - "Licensed dealer Lakeside Aurora with no prior discipline."
            - "2026-09-05: ODOMETER_MISREPRESENTATION complaint, alleged_loss_cents 1800000, investigated then resolved substantiated with sanction_type PROBATION."
            - "The 1500000-cent restitution cap binds before the penalty is computed, so restitution_ordered_cents is 1500000 and civil_penalty_cents is 275000, due 2026-10-05."
          setup_api_calls:
            - call: "POST /dealer-board/_clock/set_current_utc"
              payload: { to_iso8601: "2026-09-01T00:00:00Z" }
              as: BoardAdmin
            - call: "POST /dealer-board/manufacturers"
              payload: { legal_name: "Aurora Motors NA", line_make: "AURORA", home_office_state: "MI", posted_warranty_labor_rate_cents: 6000 }
              as: BoardAdmin
              captures: { mfr_r_id: $.data.id }
            - call: "POST /dealer-board/dealers"
              payload: { legal_name: "Lakeside Aurora", dealer_type: "NEW_MOTOR_VEHICLE", county_tier: "TIER_2", site_x_km: 0, site_y_km: 0, line_make: "AURORA" }
              as: BoardAdmin
              captures: { dlr_r_id: $.data.id }
            - call: "POST /dealer-board/license-applications"
              payload: { dealer_id: "${dlr_r_id}", application_type: "INITIAL", facility_sqft: 9000, display_spaces: 12, service_bays: 4, bond_amount_cents: 5000000, insurance_liability_cents: 100000000, zoning_certificate_status: "APPROVED", line_make_count: 1 }
              as: Dealer
              as_user_id: "${dlr_r_id}"
              captures: { app_r_id: $.data.id }
            - call: "POST /dealer-board/license-applications/${app_r_id}/submit"
              payload: {}
              as: Dealer
              as_user_id: "${dlr_r_id}"
            - call: "POST /dealer-board/license-applications/${app_r_id}/decision"
              payload: { outcome: "APPROVED" }
              as: BoardAdmin
            - call: "POST /dealer-board/_clock/set_current_utc"
              payload: { to_iso8601: "2026-09-05T00:00:00Z" }
              as: BoardAdmin
            - call: "POST /dealer-board/consumer-complaints"
              payload: { dealer_id: "${dlr_r_id}", complainant_name: "L. Bright", allegation_code: "ODOMETER_MISREPRESENTATION", alleged_loss_cents: 1800000 }
              as: ComplaintInvestigator
              as_user_id: "inv-1"
              captures: { cmp_r_id: $.data.id }
            - call: "POST /dealer-board/consumer-complaints/${cmp_r_id}/investigation"
              payload: { findings_code: "ODOMETER_ROLLBACK_CONFIRMED" }
              as: ComplaintInvestigator
              as_user_id: "inv-1"
            - call: "POST /dealer-board/consumer-complaints/${cmp_r_id}/resolution"
              payload: { substantiated: true, sanction_type: "PROBATION" }
              as: BoardAdmin
              as_user_id: "board-1"
          trigger:
            - call: "POST /dealer-board/consumer-complaints/${cmp_r_id}/restitution-payment"
              payload: { amount_cents: 600000 }
              as: Dealer
              as_user_id: "${dlr_r_id}"
            - call: "POST /dealer-board/consumer-complaints/${cmp_r_id}/restitution-payment"
              payload: { amount_cents: 900001 }
              as: Dealer
              as_user_id: "${dlr_r_id}"
              captures: { pay_r_err: $.data.error_id }
            - call: "POST /dealer-board/consumer-complaints/${cmp_r_id}/restitution-payment"
              payload: { amount_cents: 900000 }
              as: Dealer
              as_user_id: "${dlr_r_id}"
          assert:
            - "after resolution: ConsumerComplaint.${cmp_r_id}.restitution_ordered_cents == 1500000 AND civil_penalty_cents == 275000 AND restitution_paid_cents == 0 AND restitution_due_on == 2026-10-05 AND Dealer.${dlr_r_id}.restitution_outstanding_cents == 1500000"
            - "after the 600000 payment: ConsumerComplaint.${cmp_r_id}.restitution_paid_cents == 600000 AND status == SANCTIONED AND Dealer.${dlr_r_id}.restitution_outstanding_cents == 900000"
            - "after the 600000 payment: restitution_ordered_cents == restitution_paid_cents + Dealer.${dlr_r_id}.restitution_outstanding_cents (1500000 == 600000 + 900000)"
            - "the 900001 payment: HTTP status 422 with error_id ERR_RESTITUTION_OVERPAYMENT"
            - "after the refusal: ConsumerComplaint.${cmp_r_id}.restitution_paid_cents == 600000 AND Dealer.${dlr_r_id}.restitution_outstanding_cents == 900000 (no clipping, no drift)"
            - "after the 900000 payment: ConsumerComplaint.${cmp_r_id}.status == CLOSED_SATISFIED AND restitution_paid_cents == 1500000"
            - "Dealer.${dlr_r_id}.restitution_outstanding_cents == 0"
            - "Dealer.${dlr_r_id}.disciplinary_points == 6"
            - "Dealer.${dlr_r_id}.license_status == LICENSED"
            - "Dealer.${dlr_r_id}.suspension_reason == NONE"

      - name: hearing_room_session_slot_released_on_amendment
        grounds:
          - calculations.hearing_room_slot_ledger
          - state_machines.Protest.SCHEDULED_to_WITHDRAWN
          - state_machines.FranchiseFiling.PROTEST_PENDING_to_NOTICE_SERVED
          - entities.HearingRoom.fields.booked_hearing_count
        distinguishing_aspect: |
          A different conserved quantity: hearing-room slot occupancy. booked_hearing_count must
          equal the number of slot-holding protests at all times, so the amendment cascade that
          withdraws a scheduled protest has to give the slot back completely — 1 -> 0 — and the
          identical interval must then be bookable by a protest against the other filing, taking
          the count back to 1 with no phantom reservation and no double count.
        test_recipe:
          setup:
            - "Room HR-1 (buffer 60, max 2 hearings per day) and licensed, franchised incumbent Lakeside Aurora at (0, 0)."
            - "Two ADDITIONAL_POINT filings noticed 2026-09-10: F1 at (9, 12) and F2 at (14.4, 19.2)."
            - "The incumbent protests both on 2026-09-15; protest 1 is docketed 2026-11-02T10:00:00Z to 13:00:00Z, so booked_hearing_count is 1."
