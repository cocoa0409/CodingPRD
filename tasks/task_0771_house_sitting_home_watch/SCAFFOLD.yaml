  - method: POST
    path: "/home-watch/key-assignments/{id}/check-out"
    description: "Check out a key copy to the sitter"
    roles: [Coordinator, Sitter]
    code: 200
    input: []
    output: KeyAssignment
    side_effects: ["status → CHECKED_OUT; property.available_key_copies -= 1"]
  - method: POST
    path: "/home-watch/key-assignments/{id}/return"
    description: "Return a key copy to the office"
    roles: [Coordinator, Sitter]
    code: 200
    input: []
    output: KeyAssignment
    side_effects: ["status → RETURNED; property.available_key_copies += 1"]
  - method: POST
    path: "/home-watch/key-assignments/{id}/report-lost"
    description: "Report a checked-out key copy lost"
    roles: [Coordinator]
    code: 200
    input: []
    output: KeyAssignment
    side_effects: ["status → LOST (copy moves to lost bucket; available unchanged)"]
  - method: GET
    path: "/home-watch/key-assignments"
    description: "List key assignments (filter by property_id, sitter_id, booking_id)"
    roles: [Coordinator, Sitter]
    code: 200
    input: ["property_id?", "sitter_id?", "booking_id?"]
    output: "KeyAssignment[]"
    side_effects: []
  - method: GET
    path: "/home-watch/key-assignments/{id}"
    description: "Get a key assignment"
    roles: [Coordinator, Sitter]
    code: 200
    input: []
    output: KeyAssignment
    side_effects: []

  # ---- Incidents ----
  - method: POST
    path: "/home-watch/incidents"
    description: "File an incident during an in-progress visit (flags the visit)"
    roles: [Sitter]
    code: 201
    input: [visit_id, category, severity]
    output: Incident
    side_effects: ["status = OPEN; parent visit → FLAGGED; reported_by_sitter_id set from X-User-ID"]
  - method: POST
    path: "/home-watch/incidents/{id}/escalate"
    description: "Escalate an incident (reserve liability exposure)"
    roles: [Coordinator]
    code: 200
    input: []
    output: Incident
    side_effects: ["status → ESCALATED; estimated_exposure reserved; sitter escalation penalty"]
  - method: POST
    path: "/home-watch/incidents/{id}/resolve"
    description: "Resolve an incident with assessed damage (settle exposure)"
    roles: [Coordinator]
    code: 200
    input: [assessed_damage_cents]
    output: Incident
    side_effects: ["status → RESOLVED; settled payout; reserve released; policy may EXHAUST → sitter suspend"]
  - method: GET
    path: "/home-watch/incidents"
    description: "List incidents (filter by visit_id, booking_id, reported_by_sitter_id)"
    roles: [Coordinator, Client, Sitter]
    code: 200
    input: ["visit_id?", "booking_id?", "reported_by_sitter_id?"]
    output: "Incident[]"
    side_effects: []
  - method: GET
    path: "/home-watch/incidents/{id}"
    description: "Get an incident"
    roles: [Coordinator, Client, Sitter]
    code: 200
    input: []
    output: Incident
    side_effects: []

  # ---- Invoices ----
  - method: GET
    path: "/home-watch/invoices"
    description: "List invoices (filter by booking_id, client_id)"
    roles: [Coordinator, Client]
    code: 200
    input: ["booking_id?", "client_id?"]
    output: "Invoice[]"
    side_effects: []
  - method: GET
    path: "/home-watch/invoices/{id}"
    description: "Get an invoice"
    roles: [Coordinator, Client]
    code: 200
    input: []
    output: Invoice
    side_effects: []
  - method: POST
    path: "/home-watch/invoices/{id}/pay"
    description: "Pay an issued invoice for a completed booking"
    roles: [Coordinator, Client]
    code: 200
    input: []
    output: Invoice
    side_effects: ["status → PAID"]

# =============================================================================
# Table 6: Error Code Catalog
# =============================================================================
errors:
  # --- auth ---
  - { id: ERR_UNAUTHENTICATED, http: 401, condition: "X-User-ID / X-User-Role header missing or malformed" }
  - { id: ERR_UNAUTHORIZED, http: 403, condition: "Role not permitted for this operation" }
  - { id: ERR_FORBIDDEN_NOT_OWNER, http: 403, condition: "entity_backed actor is not the owner of the target resource" }
  # --- not found ---
  - { id: ERR_CLIENT_NOT_FOUND, http: 404, condition: "Client id does not exist" }
  - { id: ERR_PROPERTY_NOT_FOUND, http: 404, condition: "Property id does not exist" }
  - { id: ERR_SITTER_NOT_FOUND, http: 404, condition: "Sitter id does not exist" }
  - { id: ERR_BGCHECK_NOT_FOUND, http: 404, condition: "Background check id does not exist" }
  - { id: ERR_COVERAGE_NOT_FOUND, http: 404, condition: "Coverage policy id does not exist" }
  - { id: ERR_BOOKING_NOT_FOUND, http: 404, condition: "Booking id does not exist" }
  - { id: ERR_VISIT_NOT_FOUND, http: 404, condition: "Visit id does not exist" }
  - { id: ERR_VISITLOG_NOT_FOUND, http: 404, condition: "Visit log entry id does not exist" }
  - { id: ERR_KEY_NOT_FOUND, http: 404, condition: "Key assignment id does not exist" }
  - { id: ERR_INCIDENT_NOT_FOUND, http: 404, condition: "Incident id does not exist" }
  - { id: ERR_INVOICE_NOT_FOUND, http: 404, condition: "Invoice id does not exist" }
  # --- request validation ---
  - { id: ERR_INVALID_REQUEST, http: 422, condition: "Malformed body, missing required field, invalid enum, or RECURRING/frequency mismatch" }
  - { id: ERR_CHECKLIST_CONFIG_EMPTY, http: 422, condition: "Booking submit with an empty property checklist_config" }
  # --- concurrency ---
  - { id: ERR_STALE_SITTER_VERSION, http: 412, condition: "expected_sitter_version does not match Sitter.version on coverage-policy create" }
  # --- background-check state ---
  - { id: ERR_BGCHECK_NOT_PENDING, http: 409, condition: "Background check decide when not in SUBMITTED" }
  # --- booking state ---
  - { id: ERR_BOOKING_NOT_DRAFT, http: 409, condition: "Submit when booking not in DRAFT" }
  - { id: ERR_BOOKING_NOT_PENDING_ASSIGNMENT, http: 409, condition: "Assign when booking not in PENDING_ASSIGNMENT" }
  - { id: ERR_BOOKING_NOT_SCHEDULED, http: 409, condition: "Unassign/activate when booking not in SCHEDULED" }
  - { id: ERR_BOOKING_NOT_ACTIVE, http: 409, condition: "Complete/check-in when booking not in ACTIVE" }
  - { id: ERR_BOOKING_NOT_CANCELLABLE, http: 409, condition: "Cancel when booking already terminal" }
  - { id: ERR_BOOKING_NOT_COMPLETED, http: 409, condition: "Pay when owning booking not COMPLETED" }
  - { id: ERR_VISITS_NOT_RESOLVED, http: 409, condition: "Complete while some visit is still non-terminal" }
  # --- assign business rules ---
  - { id: ERR_SITTER_NOT_CLEARED, http: 409, condition: "Assigned sitter's latest background check is not CLEARED or is expired" }
  - { id: ERR_SITTER_COVERAGE_INACTIVE, http: 403, condition: "Assigned sitter has no ACTIVE in-window BOND policy" }
  - { id: ERR_SITTER_RELIABILITY_TOO_LOW, http: 403, condition: "Assigned sitter reliability_score < 60" }
  - { id: ERR_SITTER_SCHEDULE_CONFLICT, http: 409, condition: "Prospective visits collide with the sitter's existing visits under buffered overlap" }
  - { id: ERR_PROPERTY_BOOKING_OVERLAP, http: 409, condition: "VACATION booking window overlaps another active VACATION booking on the property" }
  # --- visit state / business ---
  - { id: ERR_VISIT_NOT_SCHEDULED, http: 409, condition: "Check-in/mark-missed when visit not in SCHEDULED" }
  - { id: ERR_VISIT_NOT_IN_PROGRESS, http: 409, condition: "Check-out/append-log when visit not IN_PROGRESS/FLAGGED" }
  - { id: ERR_VISIT_WINDOW_OPEN, http: 409, condition: "Mark-missed before the visit window has closed (clock < scheduled_end)" }
  - { id: ERR_OUTSIDE_GEOFENCE, http: 422, condition: "Check-in GPS outside the property geofence radius" }
  - { id: ERR_VISIT_EVIDENCE_MISSING, http: 422, condition: "Check-out with zero VisitLogEntry evidence" }
  - { id: ERR_CHECKLIST_INCOMPLETE, http: 422, condition: "Check-out completed_tasks does not equal the property checklist_config set" }
  - { id: ERR_UNRESOLVED_INCIDENT, http: 409, condition: "Check-out of a FLAGGED visit with an unresolved incident" }
  # --- key state ---
  - { id: ERR_KEY_NOT_AT_OFFICE, http: 409, condition: "Check out a key not in AT_OFFICE" }
  - { id: ERR_KEY_NOT_CHECKED_OUT, http: 409, condition: "Return/report-lost a key not CHECKED_OUT, or check-in with no CHECKED_OUT key for (booking,sitter)" }
  - { id: ERR_NO_KEY_COPIES_AVAILABLE, http: 409, condition: "Key check-out when property.available_key_copies is 0" }
  - { id: ERR_KEY_NOT_READY, http: 409, condition: "Activate booking with no CHECKED_OUT key for the booking" }
  # --- incident state ---
  - { id: ERR_INCIDENT_NOT_OPEN, http: 409, condition: "Escalate an incident not in OPEN" }
  - { id: ERR_INCIDENT_NOT_RESOLVABLE, http: 409, condition: "Resolve an incident not in {OPEN, ESCALATED}" }
  - { id: ERR_NO_LIABILITY_COVERAGE, http: 409, condition: "Escalate when the sitter has no ACTIVE LIABILITY policy" }
  # --- invoice state ---
  - { id: ERR_INVOICE_NOT_ISSUED, http: 409, condition: "Pay an invoice not in ISSUED" }

# =============================================================================
# Table 7: RBAC Matrix
# =============================================================================
roles:
  - name: Coordinator
    description: "Platform operations staff: onboarding, vetting, assignment, key custody, incident handling, billing operations."
    identity: opaque
    exclusive_operations:
      - "POST /home-watch/clients — onboard client"
      - "POST /home-watch/sitters — onboard sitter"
      - "POST /home-watch/background-checks — submit check"
      - "POST /home-watch/background-checks/{id}/decide — clear/reject check"
      - "POST /home-watch/coverage-policies — issue insurance/bond"
      - "POST /home-watch/bookings/{id}/assign — assign sitter"
      - "POST /home-watch/bookings/{id}/unassign — return to pool"
      - "POST /home-watch/bookings/{id}/activate — activate booking"
      - "POST /home-watch/bookings/{id}/complete — complete booking"
      - "POST /home-watch/visits/{id}/mark-missed — mark visit missed"
      - "POST /home-watch/key-assignments — issue key assignment"
      - "POST /home-watch/key-assignments/{id}/report-lost — report key lost"
      - "POST /home-watch/incidents/{id}/escalate — escalate incident"
      - "POST /home-watch/incidents/{id}/resolve — resolve incident"
    shared_operations:
      - "POST /home-watch/properties — with Client"
      - "POST /home-watch/bookings, /submit, /cancel — with Client"
      - "POST /home-watch/key-assignments/{id}/check-out, /return — with Sitter"
      - "POST /home-watch/invoices/{id}/pay — with Client"
      - "GET (all read/list endpoints)"
      - "POST /_clock/set_current_utc"

  - name: Client
    description: "Property owner: registers properties, books services, pays invoices, views own resources."
    identity: "entity_backed:Client"
    exclusive_operations: []
    shared_operations:
      - "POST /home-watch/properties — register own property (client_id must equal X-User-ID)"
      - "POST /home-watch/bookings — book on own property"
      - "POST /home-watch/bookings/{id}/submit — submit own booking"
      - "POST /home-watch/bookings/{id}/cancel — cancel own booking"
      - "POST /home-watch/invoices/{id}/pay — pay own invoice"
      - "GET (read/list endpoints)"

  - name: Sitter
    description: "Field sitter: performs visits, logs evidence, files incidents, handles keys."
    identity: "entity_backed:Sitter"
    exclusive_operations:
      - "POST /home-watch/visits/{id}/check-in — own visit"
      - "POST /home-watch/visits/{id}/check-out — own visit"
      - "POST /home-watch/visit-logs — evidence on own visit"
      - "POST /home-watch/incidents — file on own visit"
    shared_operations:
      - "POST /home-watch/key-assignments/{id}/check-out, /return — with Coordinator"
      - "GET (read/list endpoints)"
