        distinguishing_aspect: "banking_day_add is weekend-aware: at clock 2026-08-03 (Mon) the admission window is [08-03, 08-05]; a Saturday (2026-08-08) is not a banking day and 2026-08-06 is +3 banking days — both rejected ERR_EFFECTIVE_DATE_WINDOW, while 2026-08-05 (exactly +2) is admitted."
        test_recipe:
          setup: ["Originator ACTIVE; clock 2026-08-03T09:00Z; NEXT_DAY window defined"]
          setup_api_calls:
            - call: "POST /ach/cutoff-windows"
              payload: { window_kind: "NEXT_DAY", opens_at_utc: "00:00", closes_at_utc: "23:00", per_entry_fee_cents: 60, file_fee_cents: 200, large_entry_surcharge_cents: 100 }
              as: OdfiOperations
            - call: "POST /ach/originators"
              payload: { legal_name: "Bank Co", sec_codes_allowed: ["CCD"] }
              as: OdfiUnderwriter
              captures: { org_id: "$.data.id", org_v: "$.data.version" }
            - call: "PATCH /ach/originators/${org_id}"
              payload: { expected_originator_version: "${org_v}", decision: "APPROVE", exposure_limit_cents: 10000000, fee_discount_bps: 0 }
              as: OdfiUnderwriter
            - call: "POST /ach/_clock/set_current_utc"
              payload: { to_iso8601: "2026-08-03T09:00:00Z" }
              as: OdfiOperations
          trigger:
            - call: "POST /ach/ach-files"
              payload: { sec_code: "CCD", requested_window_kind: "NEXT_DAY", effective_date: "2026-08-08" }
              as: OriginatorOps
              as_user_id: "${org_id}"
              captures: { err1: "$.data.error_id" }
            - call: "POST /ach/ach-files"
              payload: { sec_code: "CCD", requested_window_kind: "NEXT_DAY", effective_date: "2026-08-06" }
              as: OriginatorOps
              as_user_id: "${org_id}"
              captures: { err2: "$.data.error_id" }
            - call: "POST /ach/ach-files"
              payload: { sec_code: "CCD", requested_window_kind: "NEXT_DAY", effective_date: "2026-08-05" }
              as: OriginatorOps
              as_user_id: "${org_id}"
              captures: { f_ok: "$.data.id" }
          assert:
            - "err1 == ERR_EFFECTIVE_DATE_WINDOW (Saturday)"
            - "err2 == ERR_EFFECTIVE_DATE_WINDOW (+3 banking days > +2)"
            - "AchFile.${f_ok} created: exactly +2 banking days is inside the window (inclusive boundary)"

