  - rule_id: transitive_cascade
    instances:
      - name: certify_triggers_statement_rollup_and_loss_suspension
        grounds:
          - state_machines.CustodyTransfer.PROVISIONAL_to_CERTIFIED
          - calculations.monthly_statement_aggregation
          - state_machines.LeaseAgreement.ACTIVE_to_SUSPENDED
        distinguishing_aspect: |
          Depth-3 cascade from the certify trigger: CustodyTransfer CERTIFIED
          mutates the OPEN MonthlyStatement (recomputed totals, link 1), and the
          statement's recomputed total_excess_loss_bbl crossing the
          LOSS_CONTROL_CAP_BBL (100) itself mutates the LeaseAgreement to
          SUSPENDED/LOSS_CONTROL (link 2) — each link caused by the previous one,
          not fan-out from the original request.
        test_recipe:
          setup:
            - "ACTIVE lease (DIESEL, loss_allowance_pct 0.002, excess_loss_rate 10.00) with ACTIVE allocation 50000 on a 200000-bbl tank"
            - "OPEN MonthlyStatement for 2026-05 exists before certification"
            - "RECEIPT movement declared 10000 bbl, certified at 9800 bbl: shrinkage 200, allowed 20, excess 180 > cap 100"
