      - name: well_interest_intervals_are_half_open_so_touching_endpoints_are_adjacent
        resource_entity: WellInterest
        interval_semantics: "HALF-OPEN [effective_from, effective_to) - the upper endpoint is excluded, so one interval may start on the exact day another ends; effective_to == null is unbounded"
        scope: "one (well_id, owner_id) pair; TERMINATED rows leave the competition entirely"
        grounds:
          - validations[priority=70, error_id=ERR_INTEREST_PERIOD_OVERLAP]
          - validations[priority=70, error_id=ERR_WI_SUM_EXCEEDED]
          - concurrency_rules.well-interest-create-stale-well
          - endpoints.POST_/land-admin/wells/{well_id}/interests
          - endpoints.POST_/land-admin/well-interests/{interest_id}/termination
        distinguishing_aspect: |
          The opposite interval convention on a different resource, with a different scope key. Here
          2026-06-01 belongs to the later interval only, so a row ending 2026-06-01 and a row starting
          2026-06-01 are adjacent and both legal - the exact configuration that the closed-interval
          rule on billing periods refuses. The instance also pins the two escapes from the competition:
          the scope is per (well, owner), so another owner may hold a wholly overlapping interval, and
          TERMINATED rows are excluded, so OB's retired interval no longer blocks anything.
