# =============================================================================
# §1.9 Scaffold Corner Design (Claim Extraction Index)
# task_2982_renewable_energy_land_lease_easement_origination
#
# Nine sections, one per section of references/claim-extraction-guide.md.
# Every instance either carries a full test_recipe or an `excluded_because`
# stub naming the §1.8 instance that already asserts the claim. Instance names
# are unique across the union of SCAFFOLD_DIFFICULTY_DESIGN.yaml and this file.
#
# Shared conventions (identical to §1.8):
#   * The logical clock starts at 2026-08-01T00:00:00Z. Nothing reads wall time.
#   * Operator X-User-IDs: la-user-01 (LandAgent), tc-user-01 / tc-user-02
#     (TitleCounsel, distinct for segregation of duties), pm-user-01 /
#     pm-user-02 (PortfolioManager, distinct because exercise must be performed
#     by someone other than the executor), pa-user-01 (PaymentAdministrator).
#     The Landowner role always acts with as_user_id == the captured Landowner id.
#   * Two reusable parcel shapes recur below, both with
#     interconnection_distance_km 3.50, resource_capacity_factor 0.38,
#     slope_pct 4.0, title_condition_grade B, zoning_code AG2, which give
#     interconnect_sub 72, resource_sub 95.00, buildability_sub 84, title_sub 80
#     and therefore screening_score 82.15 / screening_tier PRIORITY:
#       - the "clean" parcel: county 48451 with NO SetbackRule published, so
#         buildable_acres == gross_acres;
#       - the "encumbered" parcel: county 48451 with rules published BEFORE the
#         parcel, so the parcel's first derivation already includes them.
#   * Every negative trigger captures $.data.error_id so its polarity is
#     unambiguous, and every assert carries pre-computed literals.
# =============================================================================
scaffold_corner_design:

  # ==========================================================================
  - section: entities
    instances:

      - name: create_landowner_returns_prospect_posture_and_zero_ledger
        claim_type: creation
        grounds:
          - entities.Landowner
          - entities.Landowner.fields.status
          - entities.Landowner.fields.total_paid_cents
          - endpoints[POST /land-origination/landowners]
        distinguishing_aspect: "Bare creation of the only entity with no FK parents: the 201 response must already carry the system status PROSPECT and the computed ledger total 0 before any parcel, option or payment exists."
        test_recipe:
          setup:
            - "Empty database. Logical clock at its 2026-08-01T00:00:00Z default."
          setup_api_calls: []
          trigger:
            - call: "POST /land-origination/landowners"
              payload: { legal_name: "Sandhill Prairie LLC", entity_type: "LLC", mailing_state: "TX", contact_email: "ops@sandhill.example", w9_on_file: true, payment_hold: false }
              as: LandAgent
              as_user_id: "la-user-01"
              captures: { l_id: "$.data.id" }
          assert:
            - "HTTP 201"
            - "Landowner.${l_id}.legal_name == Sandhill Prairie LLC and entity_type == LLC and mailing_state == TX"
            - "Landowner.${l_id}.status == PROSPECT"
            - "Landowner.${l_id}.total_paid_cents == 0"
            - "Landowner.${l_id}.w9_on_file == true and payment_hold == false"
            - "Landowner.${l_id}.version == 1 and id, created_at, updated_at are all present"

      - name: get_parcel_returns_full_derived_acreage_and_screening_breakdown
        claim_type: retrieval
        grounds:
          - entities.Parcel
          - endpoints[GET /land-origination/parcels/{parcelId}]
          - calculations.buildable_acres_derivation
          - calculations.parcel_screening_score
        distinguishing_aspect: "Read-after-write on the single-resource GET: the retrieval must return all five acreage terms and both screening outputs, not just the client-supplied fields, and the acreage conservation invariant must hold on the retrieved row."
        test_recipe:
          setup:
            - "One Landowner and one clean 200.00-acre parcel in county 48451 with no setback rules published."
          setup_api_calls:
            - call: "POST /land-origination/landowners"
              payload: { legal_name: "Sandhill Prairie LLC", entity_type: "LLC", mailing_state: "TX", contact_email: "ops@sandhill.example", w9_on_file: true, payment_hold: false }
              as: LandAgent
              as_user_id: "la-user-01"
              captures: { l_id: "$.data.id" }
            - call: "POST /land-origination/parcels"
              payload: { apn: "R-9001-001", county_fips: "48451", landowner_id: "${l_id}", gross_acres: 200.00, interconnection_distance_km: 3.50, resource_capacity_factor: 0.38, slope_pct: 4.0, title_condition_grade: "B", zoning_code: "AG2" }
              as: LandAgent
              as_user_id: "la-user-01"
              captures: { p_id: "$.data.id" }
          trigger:
            - call: "GET /land-origination/parcels/${p_id}"
              payload: {}
              as: PortfolioManager
              as_user_id: "pm-user-01"
          assert:
            - "HTTP 200 and response_type == object"
            - "Parcel.${p_id}.slope_excluded_acres == 0.00 (slope_pct 4.0 is at or below the 5.0 tier break)"
            - "Parcel.${p_id}.raw_setback_acres == 0.00 and consent_released_acres == 0.00 and setback_encumbered_acres == 0.00"
            - "Parcel.${p_id}.buildable_acres == 200.00"
            - "Parcel.${p_id}.gross_acres == Parcel.${p_id}.buildable_acres + slope_excluded_acres + setback_encumbered_acres (conservation invariant, 200.00 == 200.00 + 0.00 + 0.00)"
            - "Parcel.${p_id}.screening_score == 82.15 and screening_tier == PRIORITY"
            - "Parcel.${p_id}.screen_mode == DESKTOP and status == QUALIFIED"

      - name: list_parcels_filtered_by_landowner_paginates_with_total_count_and_has_more
        claim_type: listing
        grounds:
          - endpoints[GET /land-origination/parcels]
          - response_envelope.pagination_fields
          - response_envelope.pagination_defaults
        distinguishing_aspect: "Flat topology means the child is only discoverable through a filtered peer list. With three parcels and limit 2 the envelope must report total_count 3 and has_more true while returning exactly two rows in created_at ASC order — never id order."
        test_recipe:
          setup:
            - "One Landowner owning three clean parcels created in this order: 200.00, 100.00 and 60.00 gross acres, all in county 48451 with no setback rules."
          setup_api_calls:
            - call: "POST /land-origination/landowners"
              payload: { legal_name: "Sandhill Prairie LLC", entity_type: "LLC", mailing_state: "TX", contact_email: "ops@sandhill.example", w9_on_file: true, payment_hold: false }
              as: LandAgent
              as_user_id: "la-user-01"
              captures: { l_id: "$.data.id" }
            - call: "POST /land-origination/parcels"
              payload: { apn: "R-9001-001", county_fips: "48451", landowner_id: "${l_id}", gross_acres: 200.00, interconnection_distance_km: 3.50, resource_capacity_factor: 0.38, slope_pct: 4.0, title_condition_grade: "B", zoning_code: "AG2" }
              as: LandAgent
              as_user_id: "la-user-01"
              captures: { p1_id: "$.data.id" }
            - call: "POST /land-origination/parcels"
              payload: { apn: "R-9001-002", county_fips: "48451", landowner_id: "${l_id}", gross_acres: 100.00, interconnection_distance_km: 3.50, resource_capacity_factor: 0.38, slope_pct: 4.0, title_condition_grade: "B", zoning_code: "AG2" }
              as: LandAgent
              as_user_id: "la-user-01"
              captures: { p2_id: "$.data.id" }
            - call: "POST /land-origination/parcels"
              payload: { apn: "R-9001-003", county_fips: "48451", landowner_id: "${l_id}", gross_acres: 60.00, interconnection_distance_km: 3.50, resource_capacity_factor: 0.38, slope_pct: 4.0, title_condition_grade: "B", zoning_code: "AG2" }
              as: LandAgent
              as_user_id: "la-user-01"
              captures: { p3_id: "$.data.id" }
          trigger:
            - call: "GET /land-origination/parcels"
              payload: { landowner_id: "${l_id}", limit: 2, offset: 0 }
              as: LandAgent
              as_user_id: "la-user-01"
              captures: { first_apn: "$.data[0].apn", second_apn: "$.data[1].apn" }
          assert:
            - "HTTP 200 and response_type == array"
            - "meta.total_count == 3 and meta.has_more == true and meta.limit == 2 and meta.offset == 0"
            - "data has exactly 2 elements"
            - "${first_apn} == R-9001-001 and ${second_apn} == R-9001-002 (created_at ASC)"
            - "A second call with limit 2 and offset 2 returns 1 element with apn R-9001-003 and meta.has_more == false"

      - name: get_lease_with_unknown_id_returns_lease_agreement_not_found
        claim_type: not_found
        grounds:
          - errors[ERR_LEASE_AGREEMENT_NOT_FOUND]
          - validations[priority 12]
          - endpoints[GET /land-origination/leases/{leaseId}]
        distinguishing_aspect: "Existence checking on a read of the deepest entity in the chain, with an empty database: the 404 must be reported by error_id, not by an empty 200 envelope. The same shape governs the other ten not-found codes at priorities 3-13."
        test_recipe:
          setup:
            - "Empty database."
          setup_api_calls: []
          trigger:
            - call: "GET /land-origination/leases/00000000-0000-4000-8000-000000000000"
              payload: {}
              as: PortfolioManager
              as_user_id: "pm-user-01"
              captures: { err: "$.data.error_id" }
          assert:
            - "HTTP 404"
            - "${err} == ERR_LEASE_AGREEMENT_NOT_FOUND"
            - "response_type == error and data.message is a non-empty string"

      - name: create_parcel_missing_required_gross_acres_returns_invalid_request
        claim_type: required_fields
        grounds:
          - errors[ERR_INVALID_REQUEST]
          - validations[priority 14]
          - endpoints[POST /land-origination/parcels]
        distinguishing_aspect: "gross_acres is the input every §1.3 acreage term is derived from and it has no default, so its absence must be caught by the shape gate at priority 14 before any calculation runs — not defaulted to 0 and not silently screened."
        test_recipe:
          setup:
            - "One Landowner exists so that the existence gate at priority 3 passes and the failure is unambiguously the shape gate."
          setup_api_calls:
            - call: "POST /land-origination/landowners"
              payload: { legal_name: "Sandhill Prairie LLC", entity_type: "LLC", mailing_state: "TX", contact_email: "ops@sandhill.example", w9_on_file: true, payment_hold: false }
              as: LandAgent
              as_user_id: "la-user-01"
              captures: { l_id: "$.data.id" }
          trigger:
            - call: "POST /land-origination/parcels"
              payload: { apn: "R-9001-001", county_fips: "48451", landowner_id: "${l_id}", interconnection_distance_km: 3.50, resource_capacity_factor: 0.38, slope_pct: 4.0, title_condition_grade: "B", zoning_code: "AG2" }
              as: LandAgent
              as_user_id: "la-user-01"
              captures: { err: "$.data.error_id" }
          assert:
            - "HTTP 400"
            - "${err} == ERR_INVALID_REQUEST"
            - "No Parcel row was created: GET /land-origination/parcels with landowner_id ${l_id} returns meta.total_count == 0"
            - "Landowner.${l_id}.status is still PROSPECT (no qualification cascade ran)"

      - name: create_neighbor_consent_without_expiry_days_applies_sixty_day_default
        claim_type: defaults
        grounds:
          - entities.NeighborConsent.fields.consent_expiry_days
          - entities.NeighborConsent.fields.consent_expiry_at
          - endpoints[POST /land-origination/neighbor-consents]
        distinguishing_aspect: "The omitted optional input feeds a derived datetime, so the default is only observable through consent_expiry_at: requested_at 2026-08-01T00:00:00Z plus the defaulted 60 days lands on 2026-09-30T00:00:00Z, and released_acres must still be 0.00 while the request is only REQUESTED."
        test_recipe:
          setup:
            - "One Landowner; one SetbackRule for jurisdiction 48451 with encumbrance_rate_per_acre 0.0500 and consent_waivable true, published before the parcel."
            - "One 200.00-acre parcel in county 48451, so raw_setback_acres is 10.00 and buildable_acres is 190.00."
          setup_api_calls:
            - call: "POST /land-origination/landowners"
              payload: { legal_name: "Sandhill Prairie LLC", entity_type: "LLC", mailing_state: "TX", contact_email: "ops@sandhill.example", w9_on_file: true, payment_hold: false }
              as: LandAgent
              as_user_id: "la-user-01"
              captures: { l_id: "$.data.id" }
            - call: "POST /land-origination/setback-rules"
              payload: { jurisdiction_code: "48451", rule_type: "PROPERTY_LINE", setback_feet: 150, encumbrance_rate_per_acre: 0.0500, consent_waivable: true }
              as: TitleCounsel
              as_user_id: "tc-user-01"
              captures: { r_id: "$.data.id" }
            - call: "POST /land-origination/parcels"
              payload: { apn: "R-9001-001", county_fips: "48451", landowner_id: "${l_id}", gross_acres: 200.00, interconnection_distance_km: 3.50, resource_capacity_factor: 0.38, slope_pct: 4.0, title_condition_grade: "B", zoning_code: "AG2" }
              as: LandAgent
              as_user_id: "la-user-01"
              captures: { p_id: "$.data.id" }
          trigger:
            - call: "POST /land-origination/neighbor-consents"
              payload: { parcel_id: "${p_id}", setback_rule_id: "${r_id}", neighbor_name: "H. Vaughn" }
              as: LandAgent
              as_user_id: "la-user-01"
              captures: { c_id: "$.data.id" }
          assert:
            - "HTTP 201"
            - "NeighborConsent.${c_id}.consent_expiry_days == 60"
            - "NeighborConsent.${c_id}.requested_at == 2026-08-01T00:00:00Z"
            - "NeighborConsent.${c_id}.consent_expiry_at == 2026-09-30T00:00:00Z"
            - "NeighborConsent.${c_id}.status == REQUESTED and released_acres == 0.00 and granted_at is null and revoked_at is null"
            - "Parcel.${p_id}.raw_setback_acres == 10.00 and consent_released_acres == 0.00 and buildable_acres == 190.00 (a REQUESTED consent releases nothing)"

      - name: parcel_screening_and_recount_fields_are_system_owned_at_creation
        claim_type: system_fields
        grounds:
          - entities.Parcel.fields.screen_mode
          - entities.Parcel.fields.status
          - entities.Parcel.fields.blocking_curative_open_count
          - entities.Parcel.fields.waived_blocking_count
          - entities.Parcel.fields.curative_cost_cents
        distinguishing_aspect: "Every system/computed field of Parcel is written by the creation cascade and none of them is a client input: screen_mode defaults to DESKTOP, the three curative recounts start at 0, and status is advanced past its SCREENING default to QUALIFIED by REEVALUATE_PARCEL_QUALIFICATION inside the same request."
        test_recipe:
          setup:
            - "One Landowner. No setback rules, no curative items, no consents."
          setup_api_calls:
            - call: "POST /land-origination/landowners"
              payload: { legal_name: "Sandhill Prairie LLC", entity_type: "LLC", mailing_state: "TX", contact_email: "ops@sandhill.example", w9_on_file: true, payment_hold: false }
              as: LandAgent
              as_user_id: "la-user-01"
              captures: { l_id: "$.data.id" }
          trigger:
            - call: "POST /land-origination/parcels"
              payload: { apn: "R-9001-001", county_fips: "48451", landowner_id: "${l_id}", gross_acres: 200.00, interconnection_distance_km: 3.50, resource_capacity_factor: 0.38, slope_pct: 4.0, title_condition_grade: "B", zoning_code: "AG2" }
              as: LandAgent
              as_user_id: "la-user-01"
              captures: { p_id: "$.data.id", p_v: "$.data.version" }
          assert:
            - "HTTP 201"
            - "Parcel.${p_id}.screen_mode == DESKTOP"
            - "Parcel.${p_id}.blocking_curative_open_count == 0 and waived_blocking_count == 0 and curative_cost_cents == 0"
            - "Parcel.${p_id}.status == QUALIFIED (buildable_acres 200.00 >= MIN_BUILDABLE_ACRES 80.00, tier PRIORITY, no open BLOCKING item)"
            - "${p_v} == 1 and created_at == 2026-08-01T00:00:00Z"
            - "Landowner.${l_id}.status == ENGAGED (LANDOWNER_POSTURE_SYNC ran inside the same request)"

      - name: create_parcel_with_slope_pct_above_domain_returns_invalid_request
        claim_type: type_constraints
        grounds:
          - entities.Parcel.fields.slope_pct
          - validations[priority 16]
          - errors[ERR_INVALID_REQUEST]
        distinguishing_aspect: "slope_pct is well-typed as a number but out of its declared 0..100 domain, so the failure must come from the numeric-domain gate at priority 16 rather than the JSON-type gate at priority 14, and no slope tier may be selected for it."
        test_recipe:
          setup:
            - "One Landowner exists."
          setup_api_calls:
            - call: "POST /land-origination/landowners"
              payload: { legal_name: "Sandhill Prairie LLC", entity_type: "LLC", mailing_state: "TX", contact_email: "ops@sandhill.example", w9_on_file: true, payment_hold: false }
              as: LandAgent
              as_user_id: "la-user-01"
              captures: { l_id: "$.data.id" }
          trigger:
            - call: "POST /land-origination/parcels"
              payload: { apn: "R-9001-001", county_fips: "48451", landowner_id: "${l_id}", gross_acres: 200.00, interconnection_distance_km: 3.50, resource_capacity_factor: 0.38, slope_pct: 120.0, title_condition_grade: "B", zoning_code: "AG2" }
              as: LandAgent
              as_user_id: "la-user-01"
              captures: { err: "$.data.error_id" }
          assert:
            - "HTTP 400"
            - "${err} == ERR_INVALID_REQUEST"
            - "No Parcel row exists for landowner ${l_id}"

      - name: create_parcel_with_unknown_landowner_id_returns_landowner_not_found
        claim_type: parent_relationships
        grounds:
          - entities.Parcel.fields.landowner_id
          - validations[priority 3]
          - errors[ERR_LANDOWNER_NOT_FOUND]
        distinguishing_aspect: "The flat topology carries the parent only as a body FK, so referential integrity has to be enforced by the priority-3 existence gate; and because 3 precedes 14, an unknown landowner_id must win even when the same body also omits a required field."
        test_recipe:
          setup:
            - "Empty database — no Landowner rows at all."
          setup_api_calls: []
          trigger:
            - call: "POST /land-origination/parcels"
              payload: { apn: "R-9001-001", county_fips: "48451", landowner_id: "00000000-0000-4000-8000-000000000000", gross_acres: 200.00, interconnection_distance_km: 3.50, resource_capacity_factor: 0.38, slope_pct: 4.0, title_condition_grade: "B", zoning_code: "AG2" }
              as: LandAgent
              as_user_id: "la-user-01"
              captures: { err: "$.data.error_id" }
          assert:
            - "HTTP 404"
            - "${err} == ERR_LANDOWNER_NOT_FOUND"
            - "GET /land-origination/parcels returns meta.total_count == 0"

      - name: option_payment_ledger_row_carries_no_version_and_is_never_mutated
        claim_type: immutability
        grounds:
          - entities.OptionPayment
          - entities.OptionPayment.common_fields
          - calculations.landowner_paid_ledger
        excluded_because:
          difficulty_instance: compensating_invariant / option_payment_ledger_restored_by_withdraw_refund
          rationale: "That instance mints INITIAL_OPTION_FEE and EXTENSION_FEE rows, then reverses the extensions, and asserts that the pre-existing rows keep their original sequence_no, acres_basis and amount_cents while the reversal appears as a NEW CREDIT_DEVELOPER row — which is exactly the immutability claim for an entity declared with common_fields false."

  # ==========================================================================
  - section: state_machines
    instances:

      - name: parcel_below_minimum_buildable_stays_in_initial_screening_state
        claim_type: initial_state
        grounds:
          - state_machines.Parcel.initial_state
          - calculations.buildable_acres_derivation.constants.MIN_BUILDABLE_ACRES
          - state_machines.Landowner.initial_state
        distinguishing_aspect: "The creation cascade normally walks a parcel straight out of its initial state, so the initial state is only observable when qualification fails. A 60.00-acre parcel scores PRIORITY (82.15) yet is still below MIN_BUILDABLE_ACRES 80.00, so it must remain in SCREENING and leave its landowner at PROSPECT — proving the gate is acreage, not score."
        test_recipe:
          setup:
            - "One Landowner. No setback rules, so buildable_acres equals gross_acres exactly."
          setup_api_calls:
            - call: "POST /land-origination/landowners"
              payload: { legal_name: "Sandhill Prairie LLC", entity_type: "LLC", mailing_state: "TX", contact_email: "ops@sandhill.example", w9_on_file: true, payment_hold: false }
              as: LandAgent
              as_user_id: "la-user-01"
              captures: { l_id: "$.data.id" }
          trigger:
            - call: "POST /land-origination/parcels"
              payload: { apn: "R-9001-060", county_fips: "48451", landowner_id: "${l_id}", gross_acres: 60.00, interconnection_distance_km: 3.50, resource_capacity_factor: 0.38, slope_pct: 4.0, title_condition_grade: "B", zoning_code: "AG2" }
              as: LandAgent
              as_user_id: "la-user-01"
              captures: { p_id: "$.data.id" }
          assert:
            - "HTTP 201"
            - "Parcel.${p_id}.buildable_acres == 60.00"
            - "Parcel.${p_id}.screening_score == 82.15 and screening_tier == PRIORITY"
            - "Parcel.${p_id}.status == SCREENING (the initial state, unchanged by the cascade)"
            - "Landowner.${l_id}.status == PROSPECT (no QUALIFIED parcel exists)"

      - name: revoked_consent_cannot_be_revoked_twice_returns_invalid_state
        claim_type: invalid_transitions
        grounds:
          - state_machines.NeighborConsent.REVOKED
          - validations[priority 23]
          - errors[ERR_INVALID_STATE]
        distinguishing_aspect: "The compensating revoke transition is the one transition whose repeat could plausibly be treated as harmless, but a second revoke must be refused at priority 23 and must not re-run the acreage cascade: buildable_acres has to stay at the restored 75.00, not drift."
        test_recipe:
          setup:
            - "One SetbackRule for jurisdiction 48451, rate 0.2500, consent_waivable true, published before the parcel."
            - "One 100.00-acre parcel in county 48451: raw_setback_acres 25.00, buildable_acres 75.00, status SCREENING."
            - "One NeighborConsent on that rule, GRANTED (released 20.00, buildable 95.00, parcel QUALIFIED) and then REVOKED (buildable back to 75.00, parcel back to SCREENING)."
          setup_api_calls:
            - call: "POST /land-origination/landowners"
              payload: { legal_name: "Sandhill Prairie LLC", entity_type: "LLC", mailing_state: "TX", contact_email: "ops@sandhill.example", w9_on_file: true, payment_hold: false }
              as: LandAgent
              as_user_id: "la-user-01"
              captures: { l_id: "$.data.id" }
            - call: "POST /land-origination/setback-rules"
              payload: { jurisdiction_code: "48451", rule_type: "OCCUPIED_DWELLING", setback_feet: 1200, encumbrance_rate_per_acre: 0.2500, consent_waivable: true }
              as: TitleCounsel
              as_user_id: "tc-user-01"
              captures: { r_id: "$.data.id" }
            - call: "POST /land-origination/parcels"
              payload: { apn: "R-9002-100", county_fips: "48451", landowner_id: "${l_id}", gross_acres: 100.00, interconnection_distance_km: 3.50, resource_capacity_factor: 0.38, slope_pct: 4.0, title_condition_grade: "B", zoning_code: "AG2" }
              as: LandAgent
              as_user_id: "la-user-01"
              captures: { p_id: "$.data.id" }
            - call: "POST /land-origination/neighbor-consents"
              payload: { parcel_id: "${p_id}", setback_rule_id: "${r_id}", neighbor_name: "H. Vaughn", consent_expiry_days: 90 }
              as: LandAgent
              as_user_id: "la-user-01"
              captures: { c_id: "$.data.id" }
            - call: "POST /land-origination/neighbor-consents/${c_id}/grant"
              payload: {}
              as: LandAgent
              as_user_id: "la-user-01"
            - call: "POST /land-origination/neighbor-consents/${c_id}/revoke"
              payload: {}
              as: LandAgent
              as_user_id: "la-user-01"
              captures: { rev_v: "$.data.version" }
          trigger:
            - call: "POST /land-origination/neighbor-consents/${c_id}/revoke"
              payload: {}
              as: LandAgent
              as_user_id: "la-user-01"
              captures: { err: "$.data.error_id" }
          assert:
            - "HTTP 409"
            - "${err} == ERR_INVALID_STATE"
            - "NeighborConsent.${c_id}.status == REVOKED and released_acres == 0.00 and version == ${rev_v} (unchanged by the rejected call)"
            - "Parcel.${p_id}.consent_released_acres == 0.00 and setback_encumbered_acres == 25.00 and buildable_acres == 75.00"
            - "Parcel.${p_id}.status == SCREENING and Landowner.${l_id}.status == PROSPECT"

      - name: withdrawn_option_is_terminal_and_cannot_be_sent_again
        claim_type: terminal_state_lockdown
        grounds:
          - state_machines.OptionAgreement.terminal_states
          - state_machines.OptionAgreement.SENT_to_WITHDRAWN
          - validations[priority 23]
          - errors[ERR_INVALID_STATE]
        distinguishing_aspect: "WITHDRAWN reached from the pre-execution SENT state (not from EXECUTED) mints no refund row and leaves the parcel QUALIFIED rather than releasing it, yet it must still be terminal: the negotiation loop cannot be re-entered by re-sending."
        test_recipe:
          setup:
            - "One Landowner and one clean 200.00-acre QUALIFIED parcel in county 48451."
            - "One OptionAgreement drafted and sent, then withdrawn from SENT with reason 'Landowner declined the terms'."
          setup_api_calls:
            - call: "POST /land-origination/landowners"
              payload: { legal_name: "Sandhill Prairie LLC", entity_type: "LLC", mailing_state: "TX", contact_email: "ops@sandhill.example", w9_on_file: true, payment_hold: false }
              as: LandAgent
              as_user_id: "la-user-01"
              captures: { l_id: "$.data.id" }
            - call: "POST /land-origination/parcels"
              payload: { apn: "R-9001-001", county_fips: "48451", landowner_id: "${l_id}", gross_acres: 200.00, interconnection_distance_km: 3.50, resource_capacity_factor: 0.38, slope_pct: 4.0, title_condition_grade: "B", zoning_code: "AG2" }
              as: LandAgent
              as_user_id: "la-user-01"
              captures: { p_id: "$.data.id", p_v: "$.data.version" }
            - call: "POST /land-origination/option-agreements"
              payload: { parcel_id: "${p_id}", landowner_id: "${l_id}", expected_parcel_version: "${p_v}", option_term_days: 365, option_fee_per_acre_cents: 2500, extension_count_allowed: 1, extension_fee_per_acre_cents: 3000, rent_structure_type: "PER_ACRE", base_rent_per_acre_cents: 120000, royalty_rate_bps: 0, escalator_pct_bps: 200, escalator_mode: "SIMPLE" }
              as: LandAgent
              as_user_id: "la-user-01"
              captures: { o_id: "$.data.id" }
            - call: "POST /land-origination/option-agreements/${o_id}/send"
              payload: {}
              as: LandAgent
              as_user_id: "la-user-01"
            - call: "POST /land-origination/option-agreements/${o_id}/withdraw"
              payload: { withdraw_reason: "Landowner declined the terms" }
              as: LandAgent
              as_user_id: "la-user-01"
          trigger:
            - call: "POST /land-origination/option-agreements/${o_id}/send"
              payload: {}
              as: LandAgent
              as_user_id: "la-user-01"
              captures: { err: "$.data.error_id" }
          assert:
            - "HTTP 409"
            - "${err} == ERR_INVALID_STATE"
            - "OptionAgreement.${o_id}.status == WITHDRAWN and withdraw_reason == Landowner declined the terms"
            - "OptionAgreement.${o_id}.round_index == 0 and total_option_paid_cents == 0"
            - "GET /land-origination/option-payments with option_agreement_id ${o_id} returns meta.total_count == 0 (a pre-execution withdrawal mints no ledger row)"
            - "Parcel.${p_id}.status == QUALIFIED and Landowner.${l_id}.status == ENGAGED"

      - name: send_option_terms_requires_the_parcel_to_be_qualified
        claim_type: precondition_enforcement
        grounds:
          - state_machines.OptionAgreement.DRAFT_to_SENT
          - validations[priority 32]
          - errors[ERR_PARCEL_NOT_QUALIFIED]
        distinguishing_aspect: "Drafting is deliberately unguarded while sending is guarded, so the precondition has to be evaluated at the send transition against the parcel's state at that instant: a 60.00-acre parcel stuck in SCREENING admits the draft and refuses the send, leaving the agreement in DRAFT."
        test_recipe:
          setup:
            - "One Landowner and one 60.00-acre parcel in county 48451 with no setback rules, so buildable_acres 60.00 keeps it in SCREENING."
            - "One OptionAgreement drafted against that parcel (drafting has no qualification precondition)."
          setup_api_calls:
            - call: "POST /land-origination/landowners"
              payload: { legal_name: "Sandhill Prairie LLC", entity_type: "LLC", mailing_state: "TX", contact_email: "ops@sandhill.example", w9_on_file: true, payment_hold: false }
              as: LandAgent
              as_user_id: "la-user-01"
              captures: { l_id: "$.data.id" }
            - call: "POST /land-origination/parcels"
              payload: { apn: "R-9001-060", county_fips: "48451", landowner_id: "${l_id}", gross_acres: 60.00, interconnection_distance_km: 3.50, resource_capacity_factor: 0.38, slope_pct: 4.0, title_condition_grade: "B", zoning_code: "AG2" }
              as: LandAgent
              as_user_id: "la-user-01"
              captures: { p_id: "$.data.id", p_v: "$.data.version" }
            - call: "POST /land-origination/option-agreements"
              payload: { parcel_id: "${p_id}", landowner_id: "${l_id}", expected_parcel_version: "${p_v}", option_term_days: 365, option_fee_per_acre_cents: 2500, extension_count_allowed: 1, extension_fee_per_acre_cents: 3000, rent_structure_type: "PER_ACRE", base_rent_per_acre_cents: 120000, royalty_rate_bps: 0, escalator_pct_bps: 200, escalator_mode: "SIMPLE" }
              as: LandAgent
              as_user_id: "la-user-01"
              captures: { o_id: "$.data.id" }
          trigger:
            - call: "POST /land-origination/option-agreements/${o_id}/send"
              payload: {}
              as: LandAgent
              as_user_id: "la-user-01"
              captures: { err: "$.data.error_id" }
          assert:
            - "HTTP 422"
            - "${err} == ERR_PARCEL_NOT_QUALIFIED"
            - "OptionAgreement.${o_id}.status == DRAFT (the transition did not fire)"
            - "Parcel.${p_id}.status == SCREENING and buildable_acres == 60.00"

      - name: execute_option_side_effects_mint_ledger_row_and_advance_two_parents
        claim_type: side_effect_execution
        grounds:
          - state_machines.OptionAgreement.ACCEPTED_to_EXECUTED
          - calculations.option_fee_schedule
          - calculations.landowner_paid_ledger
          - state_machines.Parcel.QUALIFIED_to_OPTIONED
          - state_machines.Landowner.ENGAGED_to_UNDER_OPTION
        distinguishing_aspect: "One transition has five observable side effects across four entities: the expiry stamp (2026-08-01 + 365 days = 2027-08-01T00:00:00Z), a minted OptionPayment priced on GROSS acreage (2500 x 200.00 = 500000, never on buildable), the two ledger totals, the parcel moving to OPTIONED, and the landowner posture jumping past ENGAGED to UNDER_OPTION. All five must be visible in the same request."
        test_recipe:
          setup:
            - "One Landowner and one clean 200.00-acre QUALIFIED parcel in county 48451."
            - "One OptionAgreement with option_term_days 365 and option_fee_per_acre_cents 2500, sent and accepted."
          setup_api_calls:
            - call: "POST /land-origination/landowners"
              payload: { legal_name: "Sandhill Prairie LLC", entity_type: "LLC", mailing_state: "TX", contact_email: "ops@sandhill.example", w9_on_file: true, payment_hold: false }
              as: LandAgent
              as_user_id: "la-user-01"
              captures: { l_id: "$.data.id" }
            - call: "POST /land-origination/parcels"
              payload: { apn: "R-9001-001", county_fips: "48451", landowner_id: "${l_id}", gross_acres: 200.00, interconnection_distance_km: 3.50, resource_capacity_factor: 0.38, slope_pct: 4.0, title_condition_grade: "B", zoning_code: "AG2" }
              as: LandAgent
              as_user_id: "la-user-01"
              captures: { p_id: "$.data.id", p_v: "$.data.version" }
            - call: "POST /land-origination/option-agreements"
              payload: { parcel_id: "${p_id}", landowner_id: "${l_id}", expected_parcel_version: "${p_v}", option_term_days: 365, option_fee_per_acre_cents: 2500, extension_count_allowed: 1, extension_fee_per_acre_cents: 3000, rent_structure_type: "PER_ACRE", base_rent_per_acre_cents: 120000, royalty_rate_bps: 0, escalator_pct_bps: 200, escalator_mode: "SIMPLE" }
              as: LandAgent
              as_user_id: "la-user-01"
              captures: { o_id: "$.data.id" }
            - call: "POST /land-origination/option-agreements/${o_id}/send"
              payload: {}
              as: LandAgent
              as_user_id: "la-user-01"
            - call: "POST /land-origination/option-agreements/${o_id}/accept"
              payload: {}
              as: Landowner
              as_user_id: "${l_id}"
          trigger:
            - call: "POST /land-origination/option-agreements/${o_id}/execute"
              payload: {}
              as: PortfolioManager
              as_user_id: "pm-user-01"
              captures: { exec_at: "$.data.executed_at", expiry: "$.data.option_expiry_at" }
          assert:
            - "HTTP 200"
            - "OptionAgreement.${o_id}.status == EXECUTED and executed_by_user_id == pm-user-01"
            - "${exec_at} == 2026-08-01T00:00:00Z and ${expiry} == 2027-08-01T00:00:00Z"
            - "GET /land-origination/option-payments with option_agreement_id ${o_id} returns meta.total_count == 1"
            - "that row has payment_kind == INITIAL_OPTION_FEE, ledger_direction == DEBIT_DEVELOPER, sequence_no == 1, acres_basis == 200.00 and amount_cents == 500000"
            - "OptionAgreement.${o_id}.total_option_paid_cents == 500000 and Landowner.${l_id}.total_paid_cents == 500000"
            - "Parcel.${p_id}.status == OPTIONED"
            - "Landowner.${l_id}.status == UNDER_OPTION"

      - name: waive_curative_item_releases_successor_without_capitalising_cost
        claim_type: side_effect_execution
        grounds:
          - state_machines.TitleCurativeItem.OPEN_to_WAIVED
          - entities.Parcel.fields.waived_blocking_count
          - entities.Parcel.fields.curative_cost_cents
          - entities.Parcel.fields.blocking_curative_open_count
        distinguishing_aspect: "The WAIVED branch shares the successor-release side effect with CLEARED but diverges on exactly two effects: it bumps waived_blocking_count to 1 and it must NOT capitalise the item's 250000 cents onto parcel.curative_cost_cents, which has to stay 0. The successor still moves BLOCKED -> OPEN, so the parcel remains blocked at count 1 rather than requalifying."
        test_recipe:
          setup:
            - "One Landowner and one clean 200.00-acre parcel in county 48451, QUALIFIED at creation."
            - "Item A raised by tc-user-01: MINERAL_SEVERANCE, severity BLOCKING, curative_cost_cents 250000 — status OPEN, so the parcel reverts QUALIFIED -> SCREENING."
            - "Item B raised by tc-user-01: MORTGAGE_SUBORDINATION, severity BLOCKING, curative_cost_cents 180000, blocks_item_id == A — status BLOCKED."
          setup_api_calls:
            - call: "POST /land-origination/landowners"
              payload: { legal_name: "Sandhill Prairie LLC", entity_type: "LLC", mailing_state: "TX", contact_email: "ops@sandhill.example", w9_on_file: true, payment_hold: false }
              as: LandAgent
              as_user_id: "la-user-01"
              captures: { l_id: "$.data.id" }
            - call: "POST /land-origination/parcels"
              payload: { apn: "R-9001-001", county_fips: "48451", landowner_id: "${l_id}", gross_acres: 200.00, interconnection_distance_km: 3.50, resource_capacity_factor: 0.38, slope_pct: 4.0, title_condition_grade: "B", zoning_code: "AG2" }
              as: LandAgent
              as_user_id: "la-user-01"
              captures: { p_id: "$.data.id" }
            - call: "POST /land-origination/title-curative-items"
              payload: { parcel_id: "${p_id}", item_type: "MINERAL_SEVERANCE", severity: "BLOCKING", curative_cost_cents: 250000 }
              as: TitleCounsel
              as_user_id: "tc-user-01"
              captures: { a_id: "$.data.id" }
            - call: "POST /land-origination/title-curative-items"
              payload: { parcel_id: "${p_id}", item_type: "MORTGAGE_SUBORDINATION", severity: "BLOCKING", curative_cost_cents: 180000, blocks_item_id: "${a_id}" }
              as: TitleCounsel
              as_user_id: "tc-user-01"
              captures: { b_id: "$.data.id" }
          trigger:
            - call: "POST /land-origination/title-curative-items/${a_id}/waive"
              payload: { waiver_note: "Mineral owner non-development letter accepted by counsel" }
              as: TitleCounsel
              as_user_id: "tc-user-02"
              captures: { waived_at: "$.data.cleared_at" }
          assert:
            - "HTTP 200"
            - "TitleCurativeItem.${a_id}.status == WAIVED and cleared_by_user_id == tc-user-02 and ${waived_at} == 2026-08-01T00:00:00Z"
            - "TitleCurativeItem.${b_id}.status == OPEN (the successor was released exactly as the CLEARED branch would)"
            - "Parcel.${p_id}.waived_blocking_count == 1"
            - "Parcel.${p_id}.curative_cost_cents == 0 (the waive branch capitalises nothing — this is the divergence from clear)"
            - "Parcel.${p_id}.blocking_curative_open_count == 1 (item B is now OPEN)"
            - "Parcel.${p_id}.status == SCREENING and screening_score == 82.15 (screen_mode is still DESKTOP, which ignores curative items)"
            - "Landowner.${l_id}.status == PROSPECT"

      - name: grant_neighbor_consent_from_requested_is_the_only_releasing_transition
        claim_type: valid_transition
        grounds:
          - state_machines.NeighborConsent.REQUESTED_to_GRANTED
          - calculations.buildable_acres_derivation
        excluded_because:
          difficulty_instance: transitive_cascade / consent_grant_cascade_to_landowner_posture
          rationale: "That instance performs exactly this transition and asserts its full four-hop cascade (released_acres 16.00, setback_encumbered_acres 19.00, buildable_acres 81.00, parcel SCREENING -> QUALIFIED, landowner PROSPECT -> ENGAGED), which subsumes the happy-path transition claim."

      - name: counter_option_returns_the_instrument_to_the_negotiation_loop
        claim_type: valid_transition
        grounds:
          - state_machines.OptionAgreement.SENT_to_COUNTERED
          - state_machines.OptionAgreement.COUNTERED_to_REVISED
          - entities.OptionAgreement.fields.round_index
        excluded_because:
          difficulty_instance: non_linear_state_machine / option_negotiation_loop_three_rounds_then_limit
          rationale: "That instance walks SENT -> COUNTERED -> REVISED three times, asserting round_index after every hop and that omitted counter terms retain their previous values, so the loop-entry transition and its term-overwrite side effect are already covered."

      - name: lease_recording_and_rent_dimensions_advance_independently
        claim_type: valid_transition
        grounds:
          - state_machines.LeaseAgreement.recording_status
          - state_machines.LeaseAgreement.rent_status
        excluded_because:
          difficulty_instance: non_linear_state_machine / lease_parallel_rent_and_recording_dimensions
          rationale: "That instance drives the recording dimension to its terminal RECORDED while rent_status is still PENDING_FIRST_RENT, then walks the rent dimension to DELINQUENT and back to CURRENT without moving the recording dimension, asserting both dimensions after every hop."

  # ==========================================================================
  # Shared setup for the three crossing_compensation instances below: one
  # Landowner, one clean 200.00-acre parcel in county 48451 (so
  # blocking_curative_open_count is 0 and the priority-26 title gate passes),
  # and one PLANNED corridor 'Sandhill Collection A' of total_length_m 5000
  # with buffer_m 50. Proposing a crossing does not require the corridor to be
  # PERMITTED — only granting does — so the price is observable on the 201.
  - section: calculations
    instances:

      - name: crossing_surcharge_applies_only_above_thirty_free_days
        claim_type: correct_result
        grounds:
          - calculations.crossing_compensation
          - entities.CrossingAgreement.fields.occupied_m
          - entities.CrossingAgreement.fields.duration_days
          - entities.CrossingAgreement.fields.long_occupancy_surcharge_bps
          - entities.CrossingAgreement.fields.compensation_cents
        distinguishing_aspect: "Every §1.8 crossing lives inside the 30-day free window, so the surcharge branch is unexercised there. A 40-day occupancy of 600 m of COLLECTION_LINE gives base 1080000, surcharge_bps 50 x (40 - 30) = 500 and compensation 1134000 — the arithmetic is wrong if the free days are not subtracted before multiplying."
        test_recipe:
          setup:
            - "One Landowner, one clean 200.00-acre parcel in county 48451, one PLANNED corridor with total_length_m 5000 and buffer_m 50."
          setup_api_calls:
            - call: "POST /land-origination/landowners"
              payload: { legal_name: "Sandhill Prairie LLC", entity_type: "LLC", mailing_state: "TX", contact_email: "ops@sandhill.example", w9_on_file: true, payment_hold: false }
              as: LandAgent
              as_user_id: "la-user-01"
              captures: { l_id: "$.data.id" }
            - call: "POST /land-origination/parcels"
              payload: { apn: "R-9001-001", county_fips: "48451", landowner_id: "${l_id}", gross_acres: 200.00, interconnection_distance_km: 3.50, resource_capacity_factor: 0.38, slope_pct: 4.0, title_condition_grade: "B", zoning_code: "AG2" }
              as: LandAgent
              as_user_id: "la-user-01"
              captures: { p_id: "$.data.id" }
            - call: "POST /land-origination/corridors"
              payload: { route_name: "Sandhill Collection A", total_length_m: 5000, voltage_class: "COLLECTION_34_5KV", buffer_m: 50 }
              as: LandAgent
              as_user_id: "la-user-01"
              captures: { k_id: "$.data.id" }
          trigger:
            - call: "POST /land-origination/crossing-agreements"
              payload: { corridor_id: "${k_id}", parcel_id: "${p_id}", crossing_kind: "COLLECTION_LINE", station_start_m: 1000, station_end_m: 1600, occupancy_window_start: "2026-08-05T00:00:00Z", occupancy_window_end: "2026-09-14T00:00:00Z" }
              as: LandAgent
              as_user_id: "la-user-01"
              captures: { x_id: "$.data.id" }
          assert:
            - "HTTP 201"
            - "CrossingAgreement.${x_id}.occupied_m == 600 and duration_days == 40"
            - "CrossingAgreement.${x_id}.long_occupancy_surcharge_bps == 500"
            - "CrossingAgreement.${x_id}.compensation_cents == 1134000 (base 600 x 1800 = 1080000 plus surcharge 54000)"
            - "CrossingAgreement.${x_id}.status == PROPOSED and Corridor.${k_id}.granted_crossing_count == 0"

      - name: crossing_surcharge_is_capped_at_twenty_five_hundred_bps
        claim_type: tiered_pricing
        grounds:
          - calculations.crossing_compensation.constants.LONG_OCCUPANCY_CAP_BPS
          - calculations.crossing_compensation.constants.LONG_OCCUPANCY_BPS_PER_DAY
        distinguishing_aspect: "The uncapped formula would give 50 x (102 - 30) = 3600 bps; the declared cap must clamp it to 2500, so compensation is 1350000 and not 1468800. Only an occupancy well past the cap distinguishes a clamped implementation from a linear one."
        test_recipe:
          setup:
            - "Identical to crossing_surcharge_applies_only_above_thirty_free_days: one Landowner, one clean 200.00-acre parcel in county 48451, one PLANNED corridor of total_length_m 5000."
          setup_api_calls:
            - call: "POST /land-origination/landowners"
              payload: { legal_name: "Sandhill Prairie LLC", entity_type: "LLC", mailing_state: "TX", contact_email: "ops@sandhill.example", w9_on_file: true, payment_hold: false }
              as: LandAgent
              as_user_id: "la-user-01"
              captures: { l_id: "$.data.id" }
            - call: "POST /land-origination/parcels"
              payload: { apn: "R-9001-001", county_fips: "48451", landowner_id: "${l_id}", gross_acres: 200.00, interconnection_distance_km: 3.50, resource_capacity_factor: 0.38, slope_pct: 4.0, title_condition_grade: "B", zoning_code: "AG2" }
              as: LandAgent
              as_user_id: "la-user-01"
              captures: { p_id: "$.data.id" }
            - call: "POST /land-origination/corridors"
              payload: { route_name: "Sandhill Collection A", total_length_m: 5000, voltage_class: "COLLECTION_34_5KV", buffer_m: 50 }
              as: LandAgent
              as_user_id: "la-user-01"
              captures: { k_id: "$.data.id" }
          trigger:
            - call: "POST /land-origination/crossing-agreements"
              payload: { corridor_id: "${k_id}", parcel_id: "${p_id}", crossing_kind: "COLLECTION_LINE", station_start_m: 1000, station_end_m: 1600, occupancy_window_start: "2026-08-05T00:00:00Z", occupancy_window_end: "2026-11-15T00:00:00Z" }
              as: LandAgent
              as_user_id: "la-user-01"
              captures: { x_id: "$.data.id" }
          assert:
            - "HTTP 201"
            - "CrossingAgreement.${x_id}.duration_days == 102"
            - "CrossingAgreement.${x_id}.long_occupancy_surcharge_bps == 2500 (clamped down from 3600)"
            - "CrossingAgreement.${x_id}.compensation_cents == 1350000 (1080000 plus 270000)"

      - name: crossing_surcharge_rounds_half_up_to_a_whole_cent
        claim_type: precision
        grounds:
          - calculations.crossing_compensation.precision
          - calculations.crossing_compensation.constants.CROSSING_RATE_CENTS_PER_M
        distinguishing_aspect: "A one-metre ACCESS_ROAD crossing held 31 days puts the surcharge term at exactly 900 x 50 / 10000 = 4.5 cents, the only tie case in this calculation. round_half_up must give 5 (total 905), so truncation (904) and banker's rounding (904) are both distinguishable."
        test_recipe:
          setup:
            - "Identical to the two instances above."
          setup_api_calls:
            - call: "POST /land-origination/landowners"
              payload: { legal_name: "Sandhill Prairie LLC", entity_type: "LLC", mailing_state: "TX", contact_email: "ops@sandhill.example", w9_on_file: true, payment_hold: false }
              as: LandAgent
              as_user_id: "la-user-01"
              captures: { l_id: "$.data.id" }
            - call: "POST /land-origination/parcels"
              payload: { apn: "R-9001-001", county_fips: "48451", landowner_id: "${l_id}", gross_acres: 200.00, interconnection_distance_km: 3.50, resource_capacity_factor: 0.38, slope_pct: 4.0, title_condition_grade: "B", zoning_code: "AG2" }
              as: LandAgent
              as_user_id: "la-user-01"
              captures: { p_id: "$.data.id" }
            - call: "POST /land-origination/corridors"
              payload: { route_name: "Sandhill Collection A", total_length_m: 5000, voltage_class: "COLLECTION_34_5KV", buffer_m: 50 }
              as: LandAgent
              as_user_id: "la-user-01"
              captures: { k_id: "$.data.id" }
          trigger:
            - call: "POST /land-origination/crossing-agreements"
              payload: { corridor_id: "${k_id}", parcel_id: "${p_id}", crossing_kind: "ACCESS_ROAD", station_start_m: 2000, station_end_m: 2001, occupancy_window_start: "2026-08-05T00:00:00Z", occupancy_window_end: "2026-09-05T00:00:00Z" }
              as: LandAgent
              as_user_id: "la-user-01"
              captures: { x_id: "$.data.id" }
          assert:
            - "HTTP 201"
            - "CrossingAgreement.${x_id}.occupied_m == 1 and duration_days == 31"
            - "CrossingAgreement.${x_id}.long_occupancy_surcharge_bps == 50"
            - "CrossingAgreement.${x_id}.compensation_cents == 905 (base 900 plus round_half_up(4.5) == 5)"

      - name: buildable_acres_ignores_setback_rules_of_other_jurisdictions
        claim_type: input_set_filtering
        grounds:
          - calculations.buildable_acres_derivation.input_set
          - entities.SetbackRule.fields.jurisdiction_code
          - entities.Parcel.fields.county_fips
        distinguishing_aspect: "APPLICABLE_RULES is keyed on jurisdiction_code == county_fips with no status filter, so a heavier 0.5000 rule published for a different county must contribute nothing: raw_setback_acres must be 20.00 (the 0.1000 rule alone) and never 120.00."
        test_recipe:
          setup:
            - "One Landowner."
            - "SetbackRule A for jurisdiction 48451, rate 0.1000, consent_waivable false."
            - "SetbackRule B for jurisdiction 48029, rate 0.5000, consent_waivable false (a different county)."
            - "Both rules published before the parcel, so the parcel's first derivation sees both."
          setup_api_calls:
            - call: "POST /land-origination/landowners"
              payload: { legal_name: "Sandhill Prairie LLC", entity_type: "LLC", mailing_state: "TX", contact_email: "ops@sandhill.example", w9_on_file: true, payment_hold: false }
              as: LandAgent
              as_user_id: "la-user-01"
              captures: { l_id: "$.data.id" }
            - call: "POST /land-origination/setback-rules"
              payload: { jurisdiction_code: "48451", rule_type: "PROPERTY_LINE", setback_feet: 150, encumbrance_rate_per_acre: 0.1000, consent_waivable: false }
              as: TitleCounsel
              as_user_id: "tc-user-01"
              captures: { ra_id: "$.data.id" }
            - call: "POST /land-origination/setback-rules"
              payload: { jurisdiction_code: "48029", rule_type: "WETLAND", setback_feet: 300, encumbrance_rate_per_acre: 0.5000, consent_waivable: false }
              as: TitleCounsel
              as_user_id: "tc-user-01"
              captures: { rb_id: "$.data.id" }
          trigger:
            - call: "POST /land-origination/parcels"
              payload: { apn: "R-9001-001", county_fips: "48451", landowner_id: "${l_id}", gross_acres: 200.00, interconnection_distance_km: 3.50, resource_capacity_factor: 0.38, slope_pct: 4.0, title_condition_grade: "B", zoning_code: "AG2" }
              as: LandAgent
              as_user_id: "la-user-01"
              captures: { p_id: "$.data.id" }
          assert:
            - "HTTP 201"
            - "Parcel.${p_id}.raw_setback_acres == 20.00 (only rule ${ra_id} applies)"
            - "Parcel.${p_id}.setback_encumbered_acres == 20.00 and consent_released_acres == 0.00"
            - "Parcel.${p_id}.buildable_acres == 180.00"
            - "Parcel.${p_id}.status == QUALIFIED and screening_tier == PRIORITY"

      - name: slope_exclusion_tier_break_is_upper_inclusive_at_five_percent
        claim_type: threshold
        grounds:
          - calculations.buildable_acres_derivation.constants.SLOPE_TIER_BREAKS
          - calculations.buildable_acres_derivation.constants.SLOPE_TIER_RATES
          - calculations.parcel_screening_score
        distinguishing_aspect: "The tier ladder is written slope_pct <= 5.0, so 5.0 exactly must still exclude nothing while 5.1 excludes a tenth of the parcel. Two otherwise byte-identical 200.00-acre parcels therefore differ by 20.00 excluded acres and by 0.08 of screening score (81.35 versus 81.27) — a strict '< 5.0' reading fails the first parcel by 20 acres."
        test_recipe:
          setup:
            - "One Landowner and no setback rules in county 48451."
            - "Parcel S1 with slope_pct exactly 5.0 and Parcel S2 with slope_pct 5.1, both 200.00 gross acres, created in that order."
          setup_api_calls:
            - call: "POST /land-origination/landowners"
              payload: { legal_name: "Sandhill Prairie LLC", entity_type: "LLC", mailing_state: "TX", contact_email: "ops@sandhill.example", w9_on_file: true, payment_hold: false }
              as: LandAgent
              as_user_id: "la-user-01"
              captures: { l_id: "$.data.id" }
            - call: "POST /land-origination/parcels"
              payload: { apn: "R-9003-050", county_fips: "48451", landowner_id: "${l_id}", gross_acres: 200.00, interconnection_distance_km: 3.50, resource_capacity_factor: 0.38, slope_pct: 5.0, title_condition_grade: "B", zoning_code: "AG2" }
              as: LandAgent
              as_user_id: "la-user-01"
              captures: { s1_id: "$.data.id" }
          trigger:
            - call: "POST /land-origination/parcels"
              payload: { apn: "R-9003-051", county_fips: "48451", landowner_id: "${l_id}", gross_acres: 200.00, interconnection_distance_km: 3.50, resource_capacity_factor: 0.38, slope_pct: 5.1, title_condition_grade: "B", zoning_code: "AG2" }
              as: LandAgent
              as_user_id: "la-user-01"
              captures: { s2_id: "$.data.id" }
          assert:
            - "Parcel.${s1_id}.slope_excluded_acres == 0.00 and buildable_acres == 200.00"
            - "Parcel.${s1_id}.screening_score == 81.35 and screening_tier == STANDARD"
            - "Parcel.${s2_id}.slope_excluded_acres == 20.00 and buildable_acres == 180.00"
            - "Parcel.${s2_id}.screening_score == 81.27 and screening_tier == STANDARD"
            - "both parcels are QUALIFIED (buildable_acres >= 80.00 and tier STANDARD is accepted)"

      - name: screening_score_reaches_one_hundred_when_every_sub_score_is_maximal
        claim_type: weighted_scoring
        grounds:
          - calculations.parcel_screening_score.constants.W_INTERCONNECT
          - calculations.parcel_screening_score.constants.W_RESOURCE
          - calculations.parcel_screening_score.constants.W_BUILDABILITY
          - calculations.parcel_screening_score.constants.W_TITLE
          - calculations.parcel_screening_score.constants.TITLE_GRADE_POINTS
        distinguishing_aspect: "The four declared weights must sum to exactly 1.00, which is only observable when all four sub-scores saturate: distance 0.00 km, capacity factor 0.4000 (0.4000 x 250 == 100.00), slope 0.0 and grade A must give exactly 100.00 — any mis-transcribed weight shows up as a score above or below 100.00."
        test_recipe:
          setup:
            - "One Landowner and no setback rules in county 48451."
          setup_api_calls:
            - call: "POST /land-origination/landowners"
              payload: { legal_name: "Sandhill Prairie LLC", entity_type: "LLC", mailing_state: "TX", contact_email: "ops@sandhill.example", w9_on_file: true, payment_hold: false }
              as: LandAgent
              as_user_id: "la-user-01"
              captures: { l_id: "$.data.id" }
          trigger:
            - call: "POST /land-origination/parcels"
              payload: { apn: "R-9100-777", county_fips: "48451", landowner_id: "${l_id}", gross_acres: 200.00, interconnection_distance_km: 0.00, resource_capacity_factor: 0.4000, slope_pct: 0.0, title_condition_grade: "A", zoning_code: "AG2" }
              as: LandAgent
              as_user_id: "la-user-01"
              captures: { p_id: "$.data.id" }
          assert:
            - "HTTP 201"
            - "Parcel.${p_id}.screening_score == 100.00 (0.30 x 100 + 0.25 x 100.00 + 0.20 x 100 + 0.25 x 100)"
            - "Parcel.${p_id}.screening_tier == PRIORITY"
            - "Parcel.${p_id}.buildable_acres == 200.00 and slope_excluded_acres == 0.00"

      - name: setback_encumbrance_is_rounded_per_rule_before_summation
        claim_type: precision
        grounds:
          - calculations.buildable_acres_derivation.formula
          - calculations.buildable_acres_derivation.precision
        excluded_because:
          difficulty_instance: combinatorial_formula / setback_rounding_order_per_rule_then_sum
          rationale: "That instance pins the rounding order with rates 0.0550 and 0.0750 on 15.00 gross acres, asserting raw_setback_acres == 1.96 (0.83 + 1.13) against the 1.95 that sum-then-round produces, which is the whole precision claim for this calculation."

      - name: rent_invoice_variant_is_selected_by_recording_status_at_creation
        claim_type: variant_selection
        grounds:
          - calculations.annual_rent_amount.variants
          - entities.RentInvoice.fields.rent_variant
        excluded_because:
          difficulty_instance: dual_variant_calc / annual_rent_variant_divergence_on_recording
          rationale: "That instance raises one invoice while recording_status is UNRECORDED and another after RECORDED with identical terms and production, asserting rent_variant, acre_basis and all three money components on both, which is exactly the selector claim."

      - name: screening_variant_steps_the_title_grade_down_per_open_blocking_item
        claim_type: variant_divergence
        grounds:
          - calculations.parcel_screening_score.variants
          - entities.Parcel.fields.screen_mode
        excluded_because:
          difficulty_instance: dual_variant_calc / parcel_screening_variant_divergence_on_field_verification
          rationale: "That instance rescreens the same parcel under FIELD_VERIFIED with one and then two open BLOCKING items, asserting 82.15 / PRIORITY under DESKTOP against 75.90 and 67.15 / STANDARD under FIELD_VERIFIED, covering both the divergence and the grade-ladder floor."

      - name: security_admin_rate_tier_is_keyed_on_gross_not_total
        claim_type: tiered_pricing
        grounds:
          - calculations.decommissioning_security_amount.formula
          - calculations.decommissioning_security_amount.constants.SECURITY_TIER_1_CENTS
        excluded_because:
          difficulty_instance: boundary_precision_check / security_gross_exactly_at_five_million_tier_edge
          rationale: "That instance sits one hundredth of an acre either side of the 5,000,000-cent tier edge (99.99 acres requiring 5299470 versus 100.00 acres requiring only 5225000), which asserts both the tier ladder and the pinned evaluation order that keys it on gross_security_cents."

      - name: royalty_and_per_acre_components_are_compared_after_rounding
        claim_type: reconciliation
        grounds:
          - calculations.annual_rent_amount.formula
          - calculations.annual_rent_amount.constants.ROYALTY_PRICE_CENTS_PER_MWH
        excluded_because:
          difficulty_instance: boundary_precision_check / royalty_versus_per_acre_greater_of_exact_tie
          rationale: "That instance walks production_mwh 79999 / 80000 / 80001 across the exact greater-of tie at 11760000 cents, which asserts the rounded-then-compared combination rule at its only indistinguishable point."

      - name: landowner_ledger_aggregates_debits_and_credits_across_agreements
        claim_type: aggregation
        grounds:
          - calculations.landowner_paid_ledger
          - entities.Landowner.fields.total_paid_cents
        excluded_because:
          difficulty_instance: compensating_invariant / option_payment_ledger_restored_by_withdraw_refund
          rationale: "That instance sums an INITIAL_OPTION_FEE plus two EXTENSION_FEE debits (1118750) and then a REFUND_REVERSAL credit (806250), asserting both OptionAgreement.total_option_paid_cents and Landowner.total_paid_cents at every step, which covers the signed aggregation."

  # ==========================================================================
  - section: validations
    instances:

      - name: waive_second_blocking_defect_rejects_at_the_waiver_limit
        claim_type: violation_to_error
        grounds:
          - validations[priority 35]
          - errors[ERR_WAIVER_LIMIT_REACHED]
          - entities.Parcel.fields.waived_blocking_count
        distinguishing_aspect: "MAX_WAIVED_BLOCKING_PER_PARCEL is 1, so the limit is only reachable after a first successful waive on the SAME parcel. The second waive must be refused at priority 35 even though the item is OPEN, its predecessor is resolved and the acting counsel is not the raiser — every earlier gate passes."
        test_recipe:
          setup:
            - "One Landowner and one clean 200.00-acre parcel in county 48451."
            - "Item A (MINERAL_SEVERANCE, BLOCKING, 250000) and item B (MORTGAGE_SUBORDINATION, BLOCKING, 180000, blocks_item_id A), both raised by tc-user-01."
            - "Item A already WAIVED by tc-user-02, so waived_blocking_count is 1 and item B has been released to OPEN."
          setup_api_calls:
            - call: "POST /land-origination/landowners"
              payload: { legal_name: "Sandhill Prairie LLC", entity_type: "LLC", mailing_state: "TX", contact_email: "ops@sandhill.example", w9_on_file: true, payment_hold: false }
              as: LandAgent
              as_user_id: "la-user-01"
              captures: { l_id: "$.data.id" }
            - call: "POST /land-origination/parcels"
              payload: { apn: "R-9001-001", county_fips: "48451", landowner_id: "${l_id}", gross_acres: 200.00, interconnection_distance_km: 3.50, resource_capacity_factor: 0.38, slope_pct: 4.0, title_condition_grade: "B", zoning_code: "AG2" }
              as: LandAgent
              as_user_id: "la-user-01"
              captures: { p_id: "$.data.id" }
            - call: "POST /land-origination/title-curative-items"
              payload: { parcel_id: "${p_id}", item_type: "MINERAL_SEVERANCE", severity: "BLOCKING", curative_cost_cents: 250000 }
              as: TitleCounsel
              as_user_id: "tc-user-01"
              captures: { a_id: "$.data.id" }
            - call: "POST /land-origination/title-curative-items"
              payload: { parcel_id: "${p_id}", item_type: "MORTGAGE_SUBORDINATION", severity: "BLOCKING", curative_cost_cents: 180000, blocks_item_id: "${a_id}" }
              as: TitleCounsel
              as_user_id: "tc-user-01"
              captures: { b_id: "$.data.id" }
            - call: "POST /land-origination/title-curative-items/${a_id}/waive"
              payload: { waiver_note: "Mineral owner non-development letter accepted by counsel" }
              as: TitleCounsel
              as_user_id: "tc-user-02"
          trigger:
            - call: "POST /land-origination/title-curative-items/${b_id}/waive"
              payload: { waiver_note: "Lender declined to subordinate; accepting the risk" }
              as: TitleCounsel
              as_user_id: "tc-user-02"
              captures: { err: "$.data.error_id" }
          assert:
            - "HTTP 422"
            - "${err} == ERR_WAIVER_LIMIT_REACHED"
            - "TitleCurativeItem.${b_id}.status == OPEN and cleared_at is null and cleared_by_user_id is null"
            - "Parcel.${p_id}.waived_blocking_count == 1 (unchanged) and blocking_curative_open_count == 1"
            - "Parcel.${p_id}.curative_cost_cents == 0 and status == SCREENING"

      - name: prohibited_zoning_code_rejects_parcel_registration
        claim_type: violation_to_error
        grounds:
          - validations[priority 31]
          - errors[ERR_PROHIBITED_ZONING]
          - entities.Parcel.fields.zoning_code
        distinguishing_aspect: "zoning_code is a free-form 1..12-character string, so a prohibited value is well-formed and passes the priority-14/16 shape gates; it must be caught by the business gate at priority 31 with 422, not by the 400 shape gate, and no screening may be computed for the rejected parcel."
        test_recipe:
          setup:
            - "One Landowner. No parcels yet."
          setup_api_calls:
            - call: "POST /land-origination/landowners"
              payload: { legal_name: "Sandhill Prairie LLC", entity_type: "LLC", mailing_state: "TX", contact_email: "ops@sandhill.example", w9_on_file: true, payment_hold: false }
              as: LandAgent
              as_user_id: "la-user-01"
              captures: { l_id: "$.data.id" }
          trigger:
            - call: "POST /land-origination/parcels"
              payload: { apn: "R-9004-001", county_fips: "48451", landowner_id: "${l_id}", gross_acres: 200.00, interconnection_distance_km: 3.50, resource_capacity_factor: 0.38, slope_pct: 4.0, title_condition_grade: "B", zoning_code: "RES1" }
              as: LandAgent
              as_user_id: "la-user-01"
              captures: { err: "$.data.error_id" }
          assert:
            - "HTTP 422"
            - "${err} == ERR_PROHIBITED_ZONING"
            - "GET /land-origination/parcels with landowner_id ${l_id} returns meta.total_count == 0"
            - "Landowner.${l_id}.status == PROSPECT"

      - name: duplicate_apn_within_the_same_county_rejects_the_second_parcel
        claim_type: violation_to_error
        grounds:
          - validations[priority 30]
          - errors[ERR_PARCEL_APN_DUPLICATE]
          - entities.Parcel.fields.apn
        distinguishing_aspect: "Uniqueness is on the (apn, county_fips) PAIR, so the duplicate must be detected only when both components match, and it must be reported as 409 rather than silently upserting over the first parcel's derived acreage."
        test_recipe:
          setup:
            - "One Landowner and one clean 200.00-acre parcel with apn R-7000-001 in county 48451."
          setup_api_calls:
            - call: "POST /land-origination/landowners"
              payload: { legal_name: "Sandhill Prairie LLC", entity_type: "LLC", mailing_state: "TX", contact_email: "ops@sandhill.example", w9_on_file: true, payment_hold: false }
              as: LandAgent
              as_user_id: "la-user-01"
              captures: { l_id: "$.data.id" }
            - call: "POST /land-origination/parcels"
              payload: { apn: "R-7000-001", county_fips: "48451", landowner_id: "${l_id}", gross_acres: 200.00, interconnection_distance_km: 3.50, resource_capacity_factor: 0.38, slope_pct: 4.0, title_condition_grade: "B", zoning_code: "AG2" }
              as: LandAgent
              as_user_id: "la-user-01"
              captures: { p1_id: "$.data.id" }
          trigger:
            - call: "POST /land-origination/parcels"
              payload: { apn: "R-7000-001", county_fips: "48451", landowner_id: "${l_id}", gross_acres: 90.00, interconnection_distance_km: 1.00, resource_capacity_factor: 0.30, slope_pct: 12.0, title_condition_grade: "D", zoning_code: "AG2" }
              as: LandAgent
              as_user_id: "la-user-01"
              captures: { err: "$.data.error_id" }
          assert:
            - "HTTP 409"
            - "${err} == ERR_PARCEL_APN_DUPLICATE"
            - "GET /land-origination/parcels with landowner_id ${l_id} returns meta.total_count == 1"
            - "Parcel.${p1_id}.gross_acres == 200.00 and buildable_acres == 200.00 and screening_score == 82.15 (the first parcel was not overwritten)"

      - name: same_apn_in_a_different_county_passes_the_uniqueness_gate
        claim_type: satisfaction_to_pass
        grounds:
          - validations[priority 30]
          - entities.Parcel.fields.county_fips
        distinguishing_aspect: "The satisfying case for the pair-uniqueness gate: an identical apn in county 48029 must be accepted with 201 and screened on its own, which distinguishes a correct composite key from an implementation that indexes apn alone."
        test_recipe:
          setup:
            - "One Landowner and one clean 200.00-acre parcel with apn R-7000-001 in county 48451. No setback rules in either county."
          setup_api_calls:
            - call: "POST /land-origination/landowners"
              payload: { legal_name: "Sandhill Prairie LLC", entity_type: "LLC", mailing_state: "TX", contact_email: "ops@sandhill.example", w9_on_file: true, payment_hold: false }
              as: LandAgent
              as_user_id: "la-user-01"
              captures: { l_id: "$.data.id" }
            - call: "POST /land-origination/parcels"
              payload: { apn: "R-7000-001", county_fips: "48451", landowner_id: "${l_id}", gross_acres: 200.00, interconnection_distance_km: 3.50, resource_capacity_factor: 0.38, slope_pct: 4.0, title_condition_grade: "B", zoning_code: "AG2" }
              as: LandAgent
              as_user_id: "la-user-01"
              captures: { p1_id: "$.data.id" }
          trigger:
            - call: "POST /land-origination/parcels"
              payload: { apn: "R-7000-001", county_fips: "48029", landowner_id: "${l_id}", gross_acres: 120.00, interconnection_distance_km: 3.50, resource_capacity_factor: 0.38, slope_pct: 4.0, title_condition_grade: "B", zoning_code: "AG2" }
              as: LandAgent
              as_user_id: "la-user-01"
              captures: { p2_id: "$.data.id" }
          assert:
            - "HTTP 201"
            - "Parcel.${p2_id}.county_fips == 48029 and buildable_acres == 120.00 and screening_score == 82.15 and status == QUALIFIED"
            - "GET /land-origination/parcels with landowner_id ${l_id} returns meta.total_count == 2"
            - "GET /land-origination/parcels with county_fips 48451 returns meta.total_count == 1"

      - name: parcel_not_found_outranks_the_invalid_enum_on_option_create
        claim_type: priority_ordering
        grounds:
          - validations[priority 4]
          - validations[priority 14]
          - errors[ERR_PARCEL_NOT_FOUND]
          - errors[ERR_INVALID_REQUEST]
        distinguishing_aspect: "One request violates two gates at once — an unknown parcel_id (priority 4) and an undeclared rent_structure_type member (priority 14). The 404 must win, which is the opposite of the usual 'validate shape first' instinct and is only observable when both defects are present in the same body."
        test_recipe:
          setup:
            - "One Landowner exists so the priority-3 landowner gate passes. No parcels exist at all, so there is no parcel version to quote; the OCC field carries the landowner's own version (1), which is a bound placeholder and is never reached because the priority-4 gate fires first."
          setup_api_calls:
            - call: "POST /land-origination/landowners"
              payload: { legal_name: "Sandhill Prairie LLC", entity_type: "LLC", mailing_state: "TX", contact_email: "ops@sandhill.example", w9_on_file: true, payment_hold: false }
              as: LandAgent
              as_user_id: "la-user-01"
              captures: { l_id: "$.data.id", l_v: "$.data.version" }
          trigger:
            - call: "POST /land-origination/option-agreements"
              payload: { parcel_id: "00000000-0000-4000-8000-000000000000", landowner_id: "${l_id}", expected_parcel_version: "${l_v}", option_term_days: 365, option_fee_per_acre_cents: 2500, extension_count_allowed: 1, extension_fee_per_acre_cents: 3000, rent_structure_type: "PROFIT_SHARE", base_rent_per_acre_cents: 120000, royalty_rate_bps: 0, escalator_pct_bps: 200, escalator_mode: "SIMPLE" }
              as: LandAgent
              as_user_id: "la-user-01"
              captures: { err: "$.data.error_id" }
          assert:
            - "HTTP 404"
            - "${err} == ERR_PARCEL_NOT_FOUND (not ERR_INVALID_REQUEST, even though rent_structure_type PROFIT_SHARE is not a declared member)"
            - "GET /land-origination/option-agreements with landowner_id ${l_id} returns meta.total_count == 0"

      - name: post_security_above_the_requirement_rejects_as_overposted
        claim_type: aggregate_validation
        grounds:
          - validations[priority 42]
          - errors[ERR_SECURITY_OVERPOSTED]
          - entities.LeaseAgreement.fields.security_posted_cents
          - calculations.decommissioning_security_amount
        distinguishing_aspect: "The gate is on the RUNNING TOTAL, not on the individual instalment: a first posting of 10000000 is accepted against a 10450000 requirement, and a second posting of 500000 must be refused because the sum would reach 10500000 — even though 500000 on its own is far below the requirement."
        test_recipe:
          setup:
            - "One Landowner and one clean 200.00-acre QUALIFIED parcel in county 48451."
            - "One OptionAgreement executed by pm-user-01 and exercised by pm-user-02, producing a LeaseAgreement with acre_basis_at_exercise 200.00, gross_security_cents 10000000, admin_rate_bps 450, admin_loading_cents 450000 and total_security_required_cents 10450000."
            - "A first instalment of 10000000 already posted."
          setup_api_calls:
            - call: "POST /land-origination/landowners"
              payload: { legal_name: "Sandhill Prairie LLC", entity_type: "LLC", mailing_state: "TX", contact_email: "ops@sandhill.example", w9_on_file: true, payment_hold: false }
              as: LandAgent
              as_user_id: "la-user-01"
              captures: { l_id: "$.data.id" }
            - call: "POST /land-origination/parcels"
              payload: { apn: "R-9001-001", county_fips: "48451", landowner_id: "${l_id}", gross_acres: 200.00, interconnection_distance_km: 3.50, resource_capacity_factor: 0.38, slope_pct: 4.0, title_condition_grade: "B", zoning_code: "AG2" }
              as: LandAgent
              as_user_id: "la-user-01"
              captures: { p_id: "$.data.id", p_v: "$.data.version" }
            - call: "POST /land-origination/option-agreements"
              payload: { parcel_id: "${p_id}", landowner_id: "${l_id}", expected_parcel_version: "${p_v}", option_term_days: 365, option_fee_per_acre_cents: 2500, extension_count_allowed: 1, extension_fee_per_acre_cents: 3000, rent_structure_type: "PER_ACRE", base_rent_per_acre_cents: 120000, royalty_rate_bps: 0, escalator_pct_bps: 200, escalator_mode: "SIMPLE" }
              as: LandAgent
              as_user_id: "la-user-01"
              captures: { o_id: "$.data.id" }
            - call: "POST /land-origination/option-agreements/${o_id}/send"
              payload: {}
              as: LandAgent
              as_user_id: "la-user-01"
            - call: "POST /land-origination/option-agreements/${o_id}/accept"
              payload: {}
              as: Landowner
              as_user_id: "${l_id}"
            - call: "POST /land-origination/option-agreements/${o_id}/execute"
              payload: {}
              as: PortfolioManager
              as_user_id: "pm-user-01"
            - call: "POST /land-origination/option-agreements/${o_id}/exercise"
              payload: { exercise_notice_reference: "NOE-2026-0001" }
              as: PortfolioManager
              as_user_id: "pm-user-02"
              captures: { lease_id: "$.data.id", req: "$.data.total_security_required_cents" }
            - call: "POST /land-origination/leases/${lease_id}/post-security"
              payload: { amount_cents: 10000000 }
              as: PaymentAdministrator
              as_user_id: "pa-user-01"
          trigger:
            - call: "POST /land-origination/leases/${lease_id}/post-security"
              payload: { amount_cents: 500000 }
              as: PaymentAdministrator
              as_user_id: "pa-user-01"
              captures: { err: "$.data.error_id" }
          assert:
            - "HTTP 422"
            - "${err} == ERR_SECURITY_OVERPOSTED"
            - "${req} == 10450000 (gross 10000000 at 450 bps plus 450000 loading)"
            - "LeaseAgreement.${lease_id}.security_posted_cents == 10000000 (unchanged by the rejected instalment)"
            - "A subsequent posting of exactly 450000 is accepted and brings security_posted_cents to 10450000"

      - name: duplicate_invoice_period_rejects_a_second_draft_for_the_same_year
        claim_type: violation_to_error
        grounds:
          - validations[priority 37]
          - errors[ERR_DUPLICATE_INVOICE_PERIOD]
          - entities.RentInvoice.fields.period_year
          - calculations.annual_rent_amount
        distinguishing_aspect: "The slot is occupied by any invoice in DRAFT, ISSUED or PAID, so a still-DRAFT invoice must already block period_year 1. The rejected call carries a FRESH expected_lease_agreement_version, so the 409 cannot be confused with the priority-20 OCC 412 that would otherwise mask it."
        test_recipe:
          setup:
            - "One Landowner (w9_on_file true) and one clean 200.00-acre QUALIFIED parcel in county 48451."
            - "One OptionAgreement (PER_ACRE, base_rent_per_acre_cents 120000, escalator 200 bps SIMPLE) executed by pm-user-01 and exercised by pm-user-02, giving a LeaseAgreement with acre_basis_at_exercise 200.00 and total_security_required_cents 10450000."
            - "Security fully posted (10450000), memorandum submitted and recorded, so recording_status is RECORDED and every later invoice is FINAL_AS_BUILT."
            - "One DRAFT RentInvoice for period_year 1 with production_mwh 0, gross_rent_cents 24000000."
          setup_api_calls:
            - call: "POST /land-origination/landowners"
              payload: { legal_name: "Sandhill Prairie LLC", entity_type: "LLC", mailing_state: "TX", contact_email: "ops@sandhill.example", w9_on_file: true, payment_hold: false }
              as: LandAgent
              as_user_id: "la-user-01"
              captures: { l_id: "$.data.id" }
            - call: "POST /land-origination/parcels"
              payload: { apn: "R-9001-001", county_fips: "48451", landowner_id: "${l_id}", gross_acres: 200.00, interconnection_distance_km: 3.50, resource_capacity_factor: 0.38, slope_pct: 4.0, title_condition_grade: "B", zoning_code: "AG2" }
              as: LandAgent
              as_user_id: "la-user-01"
              captures: { p_id: "$.data.id", p_v: "$.data.version" }
            - call: "POST /land-origination/option-agreements"
              payload: { parcel_id: "${p_id}", landowner_id: "${l_id}", expected_parcel_version: "${p_v}", option_term_days: 365, option_fee_per_acre_cents: 2500, extension_count_allowed: 1, extension_fee_per_acre_cents: 3000, rent_structure_type: "PER_ACRE", base_rent_per_acre_cents: 120000, royalty_rate_bps: 0, escalator_pct_bps: 200, escalator_mode: "SIMPLE" }
              as: LandAgent
              as_user_id: "la-user-01"
              captures: { o_id: "$.data.id" }
            - call: "POST /land-origination/option-agreements/${o_id}/send"
              payload: {}
              as: LandAgent
              as_user_id: "la-user-01"
            - call: "POST /land-origination/option-agreements/${o_id}/accept"
              payload: {}
              as: Landowner
              as_user_id: "${l_id}"
            - call: "POST /land-origination/option-agreements/${o_id}/execute"
              payload: {}
              as: PortfolioManager
              as_user_id: "pm-user-01"
            - call: "POST /land-origination/option-agreements/${o_id}/exercise"
              payload: { exercise_notice_reference: "NOE-2026-0001" }
              as: PortfolioManager
              as_user_id: "pm-user-02"
              captures: { lease_id: "$.data.id" }
            - call: "POST /land-origination/leases/${lease_id}/post-security"
              payload: { amount_cents: 10450000 }
              as: PaymentAdministrator
              as_user_id: "pa-user-01"
            - call: "POST /land-origination/leases/${lease_id}/submit-memo"
              payload: {}
              as: PortfolioManager
              as_user_id: "pm-user-02"
            - call: "POST /land-origination/leases/${lease_id}/record-memo"
              payload: { recording_instrument_no: "2026-0091001" }
              as: PortfolioManager
              as_user_id: "pm-user-02"
            - call: "GET /land-origination/leases/${lease_id}"
              payload: {}
              as: PaymentAdministrator
              as_user_id: "pa-user-01"
              captures: { lease_v1: "$.data.version" }
            - call: "POST /land-origination/leases/${lease_id}/rent-invoices"
              payload: { expected_lease_agreement_version: "${lease_v1}", period_year: 1, production_mwh: 0 }
              as: PaymentAdministrator
              as_user_id: "pa-user-01"
              captures: { inv1_id: "$.data.id" }
            - call: "GET /land-origination/leases/${lease_id}"
              payload: {}
              as: PaymentAdministrator
              as_user_id: "pa-user-01"
              captures: { lease_v2: "$.data.version" }
          trigger:
            - call: "POST /land-origination/leases/${lease_id}/rent-invoices"
              payload: { expected_lease_agreement_version: "${lease_v2}", period_year: 1, production_mwh: 0 }
              as: PaymentAdministrator
              as_user_id: "pa-user-01"
              captures: { err: "$.data.error_id" }
          assert:
            - "HTTP 409"
            - "${err} == ERR_DUPLICATE_INVOICE_PERIOD (not ERR_STALE_LEASE_VERSION — the version supplied was current)"
            - "RentInvoice.${inv1_id}.status == DRAFT, rent_variant == FINAL_AS_BUILT, acre_basis == 200.00 and gross_rent_cents == 24000000"
            - "GET /land-origination/rent-invoices with lease_agreement_id ${lease_id} returns meta.total_count == 1"
            - "Voiding ${inv1_id} frees the slot and a subsequent create for period_year 1 succeeds"

      - name: crew_capacity_is_validated_as_an_aggregate_over_overlapping_windows
        claim_type: aggregate_validation
        grounds:
          - validations[priority 39]
          - errors[ERR_CREW_CAPACITY_EXCEEDED]
        excluded_because:
          difficulty_instance: resource_temporal_overlap / parcel_crew_capacity_aggregate_half_open_windows
          rationale: "That instance builds an aggregate of 3 crews from two intersecting BOOKED windows, proves a touching-but-not-overlapping half-open window is admitted, and only then trips the limit, which covers both the aggregate arithmetic and the half-open interval semantics."

      - name: title_blocking_outranks_the_corridor_station_conflict
        claim_type: priority_conflict
        grounds:
          - validations[priority 26]
          - validations[priority 38]
          - errors[ERR_TITLE_CURATIVE_BLOCKING]
        excluded_because:
          difficulty_instance: priority_pair_validation_conflict / title_blocking_beats_corridor_station_conflict
          rationale: "That instance constructs a single crossing proposal that violates both gates at once and asserts ERR_TITLE_CURATIVE_BLOCKING wins, then removes the title defect and re-runs the same proposal to show the station conflict surfacing underneath."

      - name: option_expiry_is_validated_against_the_logical_clock
        claim_type: temporal_validation
        grounds:
          - validations[priority 22]
          - errors[ERR_OPTION_EXPIRED]
        excluded_because:
          difficulty_instance: priority_pair_validation_conflict / expired_option_beats_payment_hold_on_exercise
          rationale: "That instance advances the clock past option_expiry_at and asserts ERR_OPTION_EXPIRED on the exercise attempt in preference to the payment hold, which covers the temporal gate at its own priority."

  # ==========================================================================
  - section: endpoints
    instances:

      - name: setback_rule_create_then_read_then_list_by_jurisdiction
        claim_type: standard_crud
        grounds:
          - endpoints[POST /land-origination/setback-rules]
          - endpoints[GET /land-origination/setback-rules/{ruleId}]
          - endpoints[GET /land-origination/setback-rules]
        distinguishing_aspect: "SetbackRule is the only entity with no lifecycle and no parent, so it is the clean CRUD triple: the created row must be readable by id and discoverable through the jurisdiction_code filter, and publishing it into a county with no parcels must cascade to nothing."
        test_recipe:
          setup:
            - "Empty database — no parcels exist, so the publication cascade has an empty candidate set."
          setup_api_calls:
            - call: "POST /land-origination/setback-rules"
              payload: { jurisdiction_code: "48451", rule_type: "PROPERTY_LINE", setback_feet: 150, encumbrance_rate_per_acre: 0.0600, consent_waivable: true }
              as: TitleCounsel
              as_user_id: "tc-user-01"
              captures: { r1_id: "$.data.id" }
            - call: "POST /land-origination/setback-rules"
              payload: { jurisdiction_code: "48029", rule_type: "PUBLIC_ROAD", setback_feet: 75, encumbrance_rate_per_acre: 0.0300, consent_waivable: false }
              as: TitleCounsel
              as_user_id: "tc-user-01"
              captures: { r2_id: "$.data.id" }
          trigger:
            - call: "GET /land-origination/setback-rules"
              payload: { jurisdiction_code: "48451", limit: 10, offset: 0 }
              as: TitleCounsel
              as_user_id: "tc-user-01"
              captures: { got_id: "$.data[0].id", got_rate: "$.data[0].encumbrance_rate_per_acre" }
          assert:
            - "HTTP 200 and response_type == array"
            - "meta.total_count == 1 and meta.has_more == false"
            - "${got_id} == ${r1_id} and ${got_rate} == 0.0600"
            - "GET /land-origination/setback-rules/${r2_id} returns 200 with jurisdiction_code 48029, rule_type PUBLIC_ROAD and consent_waivable false"
            - "GET /land-origination/setback-rules with no jurisdiction_code filter returns meta.total_count == 2 in created_at ASC order"

      - name: patch_landowner_updates_only_the_payable_flags_and_bumps_version
        claim_type: standard_crud
        grounds:
          - endpoints[PATCH /land-origination/landowners/{landownerId}]
          - entities.Landowner.fields.w9_on_file
          - entities.Landowner.fields.payment_hold
        distinguishing_aspect: "The only PATCH in the API is deliberately narrow: legal_name and entity_type are fixed at registration and are not in the input list, so the partial update must move w9_on_file and payment_hold, bump version to 2, and leave the identity fields and the ledger total untouched."
        test_recipe:
          setup:
            - "One Landowner registered by the land agent with w9_on_file false and payment_hold false."
          setup_api_calls:
            - call: "POST /land-origination/landowners"
              payload: { legal_name: "Sandhill Prairie LLC", entity_type: "LLC", mailing_state: "TX", contact_email: "ops@sandhill.example", w9_on_file: false, payment_hold: false }
              as: LandAgent
              as_user_id: "la-user-01"
              captures: { l_id: "$.data.id", l_v: "$.data.version" }
          trigger:
            - call: "PATCH /land-origination/landowners/${l_id}"
              payload: { w9_on_file: true, payment_hold: true }
              as: PaymentAdministrator
              as_user_id: "pa-user-01"
              captures: { new_v: "$.data.version" }
          assert:
            - "HTTP 200"
            - "Landowner.${l_id}.w9_on_file == true and payment_hold == true"
            - "${l_v} == 1 and ${new_v} == 2"
            - "Landowner.${l_id}.legal_name == Sandhill Prairie LLC and entity_type == LLC and mailing_state == TX (unchanged)"
            - "Landowner.${l_id}.status == PROSPECT and total_paid_cents == 0 (the PATCH runs no cascade)"

      - name: permit_corridor_action_endpoint_stamps_permitted_at_from_the_logical_clock
        claim_type: action_endpoint
        grounds:
          - endpoints[POST /land-origination/corridors/{corridorId}/permit]
          - entities.Corridor.fields.permitted_at
          - endpoints[POST /_clock/set_current_utc]
        distinguishing_aspect: "A bodyless action endpoint whose only observable effects are the status flip and a timestamp that must come from the logical clock, not wall time: permitting after the clock is moved to 2026-08-10T00:00:00Z must stamp exactly that instant, and granted_crossing_count must stay 0 because permitting grants nothing."
        test_recipe:
          setup:
            - "One PLANNED corridor created at the default clock, with permitted_at null."
            - "The logical clock advanced to 2026-08-10T00:00:00Z with no options, consents, bookings or leases in play, so all four sweep counts are 0."
          setup_api_calls:
            - call: "POST /land-origination/corridors"
              payload: { route_name: "Sandhill Gen-Tie 138", total_length_m: 8000, voltage_class: "GENTIE_138KV", buffer_m: 120 }
              as: LandAgent
              as_user_id: "la-user-01"
              captures: { k_id: "$.data.id" }
            - call: "POST /_clock/set_current_utc"
              payload: { current_utc: "2026-08-10T00:00:00Z" }
              as: PortfolioManager
              as_user_id: "pm-user-01"
              captures: { swept_options: "$.data.expired_option_count", swept_bookings: "$.data.completed_booking_count" }
          trigger:
            - call: "POST /land-origination/corridors/${k_id}/permit"
              payload: {}
              as: PortfolioManager
              as_user_id: "pm-user-01"
              captures: { permitted: "$.data.permitted_at" }
          assert:
            - "HTTP 200"
            - "Corridor.${k_id}.status == PERMITTED"
            - "${permitted} == 2026-08-10T00:00:00Z"
            - "Corridor.${k_id}.granted_crossing_count == 0 and buffer_m == 120"
            - "${swept_options} == 0 and ${swept_bookings} == 0"

      - name: rent_projection_computed_read_returns_both_variants_without_persisting
        claim_type: computed_read
        grounds:
          - endpoints[GET /land-origination/leases/{leaseId}/rent-projection]
          - calculations.annual_rent_amount
          - entities.LeaseAgreement.fields.acre_basis_at_exercise
        distinguishing_aspect: "The only computed read in the API must evaluate BOTH §1.3 variants for a future period_year without creating a RentInvoice and without bumping the lease version. On a 200.00-gross / 150.00-buildable parcel at period_year 3 with escalator 200 bps SIMPLE, the projection is 24960000 provisional against 18720000 final — a delta of -6240000 that no persisted row may reflect."
        test_recipe:
          setup:
            - "One SetbackRule for jurisdiction 48453, rate 0.2500, published before the parcel."
            - "One Landowner and one 200.00-acre parcel in county 48453: raw_setback_acres 50.00, buildable_acres 150.00, screening_score 82.15, status QUALIFIED."
            - "One OptionAgreement with rent_structure_type ROYALTY_HYBRID, base_rent_per_acre_cents 120000, royalty_rate_bps 350, escalator_pct_bps 200, escalator_mode SIMPLE — executed by pm-user-01 and exercised by pm-user-02."
            - "The resulting LeaseAgreement has acre_basis_at_exercise 150.00 and total_security_required_cents 7837500 (gross 7500000 at 450 bps plus 337500), recording_status UNRECORDED and no invoices."
          setup_api_calls:
            - call: "POST /land-origination/landowners"
              payload: { legal_name: "Caprock Ranch Holdings LLC", entity_type: "LLC", mailing_state: "TX", contact_email: "land@caprock.example", w9_on_file: true, payment_hold: false }
              as: LandAgent
              as_user_id: "la-user-01"
              captures: { l_id: "$.data.id" }
            - call: "POST /land-origination/setback-rules"
              payload: { jurisdiction_code: "48453", rule_type: "OCCUPIED_DWELLING", setback_feet: 1200, encumbrance_rate_per_acre: 0.2500, consent_waivable: true }
              as: TitleCounsel
              as_user_id: "tc-user-01"
              captures: { r_id: "$.data.id" }
            - call: "POST /land-origination/parcels"
              payload: { apn: "R-8453-200", county_fips: "48453", landowner_id: "${l_id}", gross_acres: 200.00, interconnection_distance_km: 3.50, resource_capacity_factor: 0.38, slope_pct: 4.0, title_condition_grade: "B", zoning_code: "AG2" }
              as: LandAgent
              as_user_id: "la-user-01"
              captures: { p_id: "$.data.id", p_v: "$.data.version" }
            - call: "POST /land-origination/option-agreements"
              payload: { parcel_id: "${p_id}", landowner_id: "${l_id}", expected_parcel_version: "${p_v}", option_term_days: 365, option_fee_per_acre_cents: 2500, extension_count_allowed: 1, extension_fee_per_acre_cents: 3000, rent_structure_type: "ROYALTY_HYBRID", base_rent_per_acre_cents: 120000, royalty_rate_bps: 350, escalator_pct_bps: 200, escalator_mode: "SIMPLE" }
              as: LandAgent
              as_user_id: "la-user-01"
              captures: { o_id: "$.data.id" }
            - call: "POST /land-origination/option-agreements/${o_id}/send"
              payload: {}
              as: LandAgent
              as_user_id: "la-user-01"
            - call: "POST /land-origination/option-agreements/${o_id}/accept"
              payload: {}
              as: Landowner
              as_user_id: "${l_id}"
            - call: "POST /land-origination/option-agreements/${o_id}/execute"
              payload: {}
              as: PortfolioManager
              as_user_id: "pm-user-01"
            - call: "POST /land-origination/option-agreements/${o_id}/exercise"
              payload: { exercise_notice_reference: "NOE-2026-0002" }
              as: PortfolioManager
              as_user_id: "pm-user-02"
              captures: { lease_id: "$.data.id", lease_v: "$.data.version", basis: "$.data.acre_basis_at_exercise" }
          trigger:
            - call: "GET /land-origination/leases/${lease_id}/rent-projection"
              payload: { period_year: 3, production_mwh: 100000 }
              as: PortfolioManager
              as_user_id: "pm-user-01"
              captures: { prov_gross: "$.data.provisional_gross_rent_cents", final_gross: "$.data.final_gross_rent_cents", delta: "$.data.variant_delta_cents" }
          assert:
            - "HTTP 200 and response_type == object"
            - "${basis} == 150.00 and LeaseAgreement.${lease_id}.total_security_required_cents == 7837500"
            - "data.provisional_acre_basis == 200.00 and ${prov_gross} == 24960000 (120000 x 200.00 x 1.04, royalty suppressed)"
            - "data.final_acre_basis == 150.00 and data.final_per_acre_component_cents == 18720000"
            - "data.final_royalty_component_cents == 14700000 and ${final_gross} == 18720000 (the per-acre component wins the greater-of)"
            - "${delta} == -6240000"
            - "GET /land-origination/rent-invoices with lease_agreement_id ${lease_id} returns meta.total_count == 0"
            - "LeaseAgreement.${lease_id}.version == ${lease_v} and recording_status == UNRECORDED (the projection persists nothing)"

      - name: grant_crossing_is_conditional_on_a_permitted_corridor
        claim_type: conditional_action
        grounds:
          - endpoints[POST /land-origination/crossing-agreements/{crossingId}/grant]
          - validations[priority 36]
          - errors[ERR_CORRIDOR_NOT_PERMITTED]
        excluded_because:
          difficulty_instance: cross_entity_state_dependency / crossing_grant_requires_permitted_corridor
          rationale: "That instance attempts the grant while the corridor is still PLANNED (rejected with ERR_CORRIDOR_NOT_PERMITTED and granted_crossing_count unchanged), then permits the corridor and replays the identical grant successfully, which covers both arms of the conditional action."

  # ==========================================================================
  # Error-code coverage note: the eleven not-found codes at priorities 3-13 all
  # share the shape shown in entities /
  # get_lease_with_unknown_id_returns_lease_agreement_not_found and
  # create_parcel_with_unknown_landowner_id_returns_landowner_not_found; the
  # instances below cover the codes that no other section reaches.
  - section: errors
    instances:

      - name: missing_x_user_id_header_returns_unauthenticated
        claim_type: violation_to_error
        grounds:
          - errors[ERR_MISSING_USER_ID]
          - validations[priority 1]
        distinguishing_aspect: "Priority 1 outranks everything, so an absent X-User-ID must produce 401 even on a request that is otherwise perfectly formed and whose role header is valid — the identity gate cannot be skipped just because the body would have succeeded."
        test_recipe:
          setup:
            - "One Landowner exists, so the body of the rejected call would otherwise be entirely valid."
          setup_api_calls:
            - call: "POST /land-origination/landowners"
              payload: { legal_name: "Sandhill Prairie LLC", entity_type: "LLC", mailing_state: "TX", contact_email: "ops@sandhill.example", w9_on_file: true, payment_hold: false }
              as: LandAgent
              as_user_id: "la-user-01"
              captures: { l_id: "$.data.id" }
          trigger:
            - call: "POST /land-origination/parcels"
              payload: { apn: "R-9001-001", county_fips: "48451", landowner_id: "${l_id}", gross_acres: 200.00, interconnection_distance_km: 3.50, resource_capacity_factor: 0.38, slope_pct: 4.0, title_condition_grade: "B", zoning_code: "AG2" }
              as: LandAgent
              as_user_id: ""
              captures: { err: "$.data.error_id" }
          assert:
            - "HTTP 401"
            - "${err} == ERR_MISSING_USER_ID"
            - "GET /land-origination/parcels (with valid headers) returns meta.total_count == 0"

      - name: crossing_beyond_the_corridor_length_returns_invalid_station_range
        claim_type: violation_to_error
        grounds:
          - errors[ERR_INVALID_STATION_RANGE]
          - validations[priority 17]
          - entities.Corridor.fields.total_length_m
        distinguishing_aspect: "The station bound is not a constant but the parent corridor's total_length_m, so the check is cross-entity: 4800..5200 is a well-ordered interval of positive integers and only fails because it runs 200 m past the end of a 5000 m corridor."
        test_recipe:
          setup:
            - "One Landowner, one clean 200.00-acre parcel in county 48451 and one PLANNED corridor with total_length_m 5000."
          setup_api_calls:
            - call: "POST /land-origination/landowners"
              payload: { legal_name: "Sandhill Prairie LLC", entity_type: "LLC", mailing_state: "TX", contact_email: "ops@sandhill.example", w9_on_file: true, payment_hold: false }
              as: LandAgent
              as_user_id: "la-user-01"
              captures: { l_id: "$.data.id" }
            - call: "POST /land-origination/parcels"
              payload: { apn: "R-9001-001", county_fips: "48451", landowner_id: "${l_id}", gross_acres: 200.00, interconnection_distance_km: 3.50, resource_capacity_factor: 0.38, slope_pct: 4.0, title_condition_grade: "B", zoning_code: "AG2" }
              as: LandAgent
              as_user_id: "la-user-01"
              captures: { p_id: "$.data.id" }
            - call: "POST /land-origination/corridors"
              payload: { route_name: "Sandhill Collection A", total_length_m: 5000, voltage_class: "COLLECTION_34_5KV", buffer_m: 50 }
              as: LandAgent
              as_user_id: "la-user-01"
              captures: { k_id: "$.data.id" }
          trigger:
            - call: "POST /land-origination/crossing-agreements"
              payload: { corridor_id: "${k_id}", parcel_id: "${p_id}", crossing_kind: "COLLECTION_LINE", station_start_m: 4800, station_end_m: 5200, occupancy_window_start: "2026-08-05T00:00:00Z", occupancy_window_end: "2026-08-20T00:00:00Z" }
              as: LandAgent
              as_user_id: "la-user-01"
              captures: { err: "$.data.error_id" }
          assert:
            - "HTTP 422"
            - "${err} == ERR_INVALID_STATION_RANGE"
            - "GET /land-origination/crossing-agreements with corridor_id ${k_id} returns meta.total_count == 0"

      - name: booking_with_an_inverted_window_returns_invalid_window_range
        claim_type: violation_to_error
        grounds:
          - errors[ERR_INVALID_WINDOW_RANGE]
          - validations[priority 18]
        distinguishing_aspect: "Both endpoints that accept intervals share this code, and the half-open convention means an EMPTY interval (end == start) is as invalid as an inverted one; the window here is inverted but entirely in the future, so priority 40 cannot be what fires."
        test_recipe:
          setup:
            - "One Landowner and one clean 200.00-acre parcel in county 48451. Clock at its 2026-08-01T00:00:00Z default."
          setup_api_calls:
            - call: "POST /land-origination/landowners"
              payload: { legal_name: "Sandhill Prairie LLC", entity_type: "LLC", mailing_state: "TX", contact_email: "ops@sandhill.example", w9_on_file: true, payment_hold: false }
              as: LandAgent
              as_user_id: "la-user-01"
              captures: { l_id: "$.data.id" }
            - call: "POST /land-origination/parcels"
              payload: { apn: "R-9001-001", county_fips: "48451", landowner_id: "${l_id}", gross_acres: 200.00, interconnection_distance_km: 3.50, resource_capacity_factor: 0.38, slope_pct: 4.0, title_condition_grade: "B", zoning_code: "AG2" }
              as: LandAgent
              as_user_id: "la-user-01"
              captures: { p_id: "$.data.id" }
          trigger:
            - call: "POST /land-origination/site-access-bookings"
              payload: { parcel_id: "${p_id}", purpose: "TITLE_SURVEY", window_start: "2026-08-20T00:00:00Z", window_end: "2026-08-10T00:00:00Z", crew_count: 2 }
              as: LandAgent
              as_user_id: "la-user-01"
              captures: { err: "$.data.error_id" }
          assert:
            - "HTTP 422"
            - "${err} == ERR_INVALID_WINDOW_RANGE"
            - "GET /land-origination/site-access-bookings with parcel_id ${p_id} returns meta.total_count == 0"

      - name: booking_before_the_logical_clock_returns_window_in_past
        claim_type: violation_to_error
        grounds:
          - errors[ERR_WINDOW_IN_PAST]
          - validations[priority 40]
          - endpoints[POST /_clock/set_current_utc]
        distinguishing_aspect: "The comparison is against the LOGICAL clock, so the same booking body is legal at the default 2026-08-01 instant and illegal after the clock is moved to 2026-09-01 — an implementation reading wall time cannot pass both halves of this claim."
        test_recipe:
          setup:
            - "One Landowner and one clean 200.00-acre parcel in county 48451."
            - "The logical clock advanced to 2026-09-01T00:00:00Z, with nothing to sweep."
          setup_api_calls:
            - call: "POST /land-origination/landowners"
              payload: { legal_name: "Sandhill Prairie LLC", entity_type: "LLC", mailing_state: "TX", contact_email: "ops@sandhill.example", w9_on_file: true, payment_hold: false }
              as: LandAgent
              as_user_id: "la-user-01"
              captures: { l_id: "$.data.id" }
            - call: "POST /land-origination/parcels"
              payload: { apn: "R-9001-001", county_fips: "48451", landowner_id: "${l_id}", gross_acres: 200.00, interconnection_distance_km: 3.50, resource_capacity_factor: 0.38, slope_pct: 4.0, title_condition_grade: "B", zoning_code: "AG2" }
              as: LandAgent
              as_user_id: "la-user-01"
              captures: { p_id: "$.data.id" }
            - call: "POST /_clock/set_current_utc"
              payload: { current_utc: "2026-09-01T00:00:00Z" }
              as: LandAgent
              as_user_id: "la-user-01"
              captures: { swept: "$.data.completed_booking_count" }
          trigger:
            - call: "POST /land-origination/site-access-bookings"
              payload: { parcel_id: "${p_id}", purpose: "GEOTECH", window_start: "2026-08-15T00:00:00Z", window_end: "2026-08-20T00:00:00Z", crew_count: 2 }
              as: TitleCounsel
              as_user_id: "tc-user-01"
              captures: { err: "$.data.error_id" }
          assert:
            - "HTTP 422"
            - "${err} == ERR_WINDOW_IN_PAST"
            - "${swept} == 0"
            - "GET /land-origination/site-access-bookings with parcel_id ${p_id} returns meta.total_count == 0"
            - "The identical body with window_start 2026-09-05T00:00:00Z and window_end 2026-09-10T00:00:00Z is accepted with 201"

      - name: grant_after_the_consent_expiry_sweep_returns_consent_expired
        claim_type: violation_to_error
        grounds:
          - errors[ERR_CONSENT_EXPIRED]
          - validations[priority 21]
          - state_machines.NeighborConsent.REQUESTED_to_EXPIRED
        distinguishing_aspect: "Two gates could fire on this call: priority 21 (expiry) and priority 23 (a GRANTED transition is not admitted from EXPIRED). Priority 21 must win, and the S2 sweep must have released no acreage on its way through — buildable_acres has to stay 190.00."
        test_recipe:
          setup:
            - "One SetbackRule for jurisdiction 48451, rate 0.0500, consent_waivable true, published before the parcel."
            - "One Landowner and one 200.00-acre parcel in county 48451: raw_setback_acres 10.00, buildable_acres 190.00, status QUALIFIED."
            - "One NeighborConsent with consent_expiry_days 30, so consent_expiry_at is 2026-08-31T00:00:00Z."
            - "The clock advanced to exactly 2026-08-31T00:00:00Z, which the S2 sweep treats as expired (<=)."
          setup_api_calls:
            - call: "POST /land-origination/landowners"
              payload: { legal_name: "Sandhill Prairie LLC", entity_type: "LLC", mailing_state: "TX", contact_email: "ops@sandhill.example", w9_on_file: true, payment_hold: false }
              as: LandAgent
              as_user_id: "la-user-01"
              captures: { l_id: "$.data.id" }
            - call: "POST /land-origination/setback-rules"
              payload: { jurisdiction_code: "48451", rule_type: "PROPERTY_LINE", setback_feet: 150, encumbrance_rate_per_acre: 0.0500, consent_waivable: true }
              as: TitleCounsel
              as_user_id: "tc-user-01"
              captures: { r_id: "$.data.id" }
            - call: "POST /land-origination/parcels"
              payload: { apn: "R-9001-001", county_fips: "48451", landowner_id: "${l_id}", gross_acres: 200.00, interconnection_distance_km: 3.50, resource_capacity_factor: 0.38, slope_pct: 4.0, title_condition_grade: "B", zoning_code: "AG2" }
              as: LandAgent
              as_user_id: "la-user-01"
              captures: { p_id: "$.data.id" }
            - call: "POST /land-origination/neighbor-consents"
              payload: { parcel_id: "${p_id}", setback_rule_id: "${r_id}", neighbor_name: "H. Vaughn", consent_expiry_days: 30 }
              as: LandAgent
              as_user_id: "la-user-01"
              captures: { c_id: "$.data.id", expiry: "$.data.consent_expiry_at" }
            - call: "POST /_clock/set_current_utc"
              payload: { current_utc: "2026-08-31T00:00:00Z" }
              as: LandAgent
              as_user_id: "la-user-01"
              captures: { expired_consents: "$.data.expired_consent_count" }
          trigger:
            - call: "POST /land-origination/neighbor-consents/${c_id}/grant"
              payload: {}
              as: LandAgent
              as_user_id: "la-user-01"
              captures: { err: "$.data.error_id" }
          assert:
            - "${expiry} == 2026-08-31T00:00:00Z and ${expired_consents} == 1"
            - "HTTP 422"
            - "${err} == ERR_CONSENT_EXPIRED (not ERR_INVALID_STATE — priority 21 precedes 23)"
            - "NeighborConsent.${c_id}.status == EXPIRED, released_acres == 0.00 and granted_at is null"
            - "Parcel.${p_id}.consent_released_acres == 0.00, setback_encumbered_acres == 10.00 and buildable_acres == 190.00"

      - name: clear_a_still_blocked_item_returns_curative_blocked_predecessor
        claim_type: violation_to_error
        grounds:
          - errors[ERR_CURATIVE_BLOCKED_PREDECESSOR]
          - validations[priority 27]
          - state_machines.TitleCurativeItem.BLOCKED
        distinguishing_aspect: "The acting counsel is tc-user-02, so the priority-25 segregation gate passes and the only remaining objection is the unresolved predecessor: the successor must stay BLOCKED and no cost may be capitalised."
        test_recipe:
          setup:
            - "One Landowner and one clean 200.00-acre parcel in county 48451."
            - "Item A (MINERAL_SEVERANCE, BLOCKING, 250000) raised by tc-user-01 and left OPEN."
            - "Item B (MORTGAGE_SUBORDINATION, BLOCKING, 180000, blocks_item_id A) raised by tc-user-01, so it starts BLOCKED."
          setup_api_calls:
            - call: "POST /land-origination/landowners"
              payload: { legal_name: "Sandhill Prairie LLC", entity_type: "LLC", mailing_state: "TX", contact_email: "ops@sandhill.example", w9_on_file: true, payment_hold: false }
              as: LandAgent
