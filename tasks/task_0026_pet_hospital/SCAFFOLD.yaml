scenario: |
  Pet hospital management system: registration and triage with pet profile binding,
  owner contact verification, symptom description, severity triage, and
  department/veterinarian routing; treatment records with consultation notes,
  diagnosis and treatment plan, medical history accumulation, pet-owner consent
  recording, and visit-history retrieval; laboratory reports with test-item
  ordering, sample collection records, external-lab integration, report
  generation, abnormal-result flagging, and historical comparison; prescription
  issuance and review with veterinarian prescription drafting, drug interaction
  check, dosage rationality review, special-control drug approval, and dispensing
  record; hospitalization management with ward and cage assignment, daily care
  records, treatment execution, status monitoring, owner visit and notification,
  and discharge workflow; itemized billing and settlement with fee-item
  breakdown, package and discount handling, insurance reimbursement, deposit
  deduction, refund handling, and invoice issuance; vaccine reminder with
  vaccine schedule by species and age, vaccination record archiving, due-date
  reminder, batch-recall handling, and re-vaccination tracking; event-driven
  synchronization with payment, IM, and external laboratory systems; audit
  logging for prescription and treatment records.

domain_name: pet-hospital
api_prefix: /pet-hospital

complexity_profile:
  primary_archetype: compliance_audit
  secondary_archetype: workflow_orchestration
  complexity_layers:
    - cascading_side_effects
    - dual_variant_calculation
    - rate_threshold_triggers
    - idempotency
    - soft_delete_archival

  entity_topology: hybrid
  # Visit is the trunk (Pet → Visit → TreatmentRecord/LabReport/Prescription/Hospitalization),
  # while Owner, Drug, Cage, VaccineSchedule, AuditLog are flat peers referenced by FK.

  state_machine_shape: branching
  # Prescription has DRAFT↔PENDING_REVIEW↔REJECTED cycle; Bill has refund branch
  # off PAID; LabReport has ABNORMAL fork with re-test branch.

  relationship_patterns:
    - one_to_many       # Owner→Pet, Pet→Visit, Visit→{TreatmentRecord, LabReport, Prescription, Hospitalization}
    - many_to_many      # Prescription↔Drug via PrescriptionItem-style array of drug refs
    - cross_aggregate   # Hospitalization references Cage; Bill references Visit's children for itemization
    - polymorphic       # AuditLog.subject_type ∈ {Prescription, TreatmentRecord} with subject_id

  role_model: segregation_of_duties
  # Drafting vet (DraftingVet) cannot be the same as reviewing vet (ReviewingVet)
  # for special-control drugs. Cashier (Cashier) cannot draft prescriptions.

  consistency_model: immediate

response_envelope:
  success: |
    { "meta": { "api_request_id": "req_xxx", "api_request_timestamp": "ISO8601" },
      "response_type": "object" | "array", "data": {} }
  error: |
    { "meta": { ... }, "response_type": "error",
      "data": { "error_id": "ERR_XXX", "message": "..." } }
  pagination_fields: ["limit", "offset", "total_count", "has_more"]
  pagination_defaults: { limit: 10, min: 1, max: 100, offset: 0 }

# =============================================================================
# §1.1 Entity-Relationship Table
# =============================================================================
entities:
  - name: Owner
    parent: null
    common_fields: true
    fields:
      - name: full_name
        type: string
        source: input
        description: Owner's legal full name.
        constraints: 1–80 chars, non-empty after trim.
      - name: phone_e164
        type: string
        source: input
        description: Contact phone number in E.164 format.
        constraints: Must match ^\+[1-9]\d{6,14}$; unique per Owner.
      - name: email
        type: string
        source: input
        description: Contact email.
        constraints: RFC-5322 lite; lowercased; unique per Owner.
      - name: contact_verified
        type: boolean
        source: computed
        description: True once a successful POST /owners/{id}/verify-contact has been recorded.
        default: false
      - name: verification_code_hash
        type: string
        source: system
        description: Hashed verification code last issued; cleared on success.
        default: null
      - name: verification_expires_at
        type: datetime
        source: system
        description: ISO 8601 UTC; null when no pending code.
        default: null
      - name: deposit_balance_cents
        type: integer
        source: computed
        description: Running prepaid deposit across all of this owner's open visits, in cents.
        default: 0

  - name: Pet
    parent: null
    common_fields: true
    fields:
      - name: owner_id
        type: string
        source: input
        description: FK → Owner.id.
        constraints: Owner must exist; cannot be reassigned after creation.
      - name: name
        type: string
        source: input
        description: Pet's name.
        constraints: 1–60 chars.
      - name: species
        type: enum
        source: input
        description: Species enum.
        constraints: One of {DOG, CAT, RABBIT, BIRD, OTHER}.
      - name: birth_date
        type: string
        source: input
        description: ISO 8601 date (YYYY-MM-DD); used for age-based vaccine schedule.
        constraints: Must be ≤ now() in UTC.
      - name: weight_kg
        type: number
        source: input
        description: Latest recorded weight in kilograms; used for dosage review.
        constraints: 0.05 ≤ weight_kg ≤ 200; 2 decimal places.
      - name: medical_history
        type: array
        source: computed
        description: |
          Append-only list of finalized diagnosis snapshots
          [{visit_id, diagnosis_code, finalized_at}], ordered by finalized_at ASC.
          Recomputed every time a TreatmentRecord transitions DRAFT→FINALIZED.
        default: []
      - name: archived
        type: boolean
        source: computed
        description: Soft-delete flag set by DELETE /pets/{id}; archived pets cannot start new visits but remain queryable for history.
        default: false

  - name: VaccineSchedule
    parent: null
    common_fields: false
    fields:
      - name: species
        type: enum
        source: input
        description: Species this rule applies to.
        constraints: One of {DOG, CAT, RABBIT, BIRD, OTHER}.
      - name: vaccine_code
        type: string
        source: input
        description: Vaccine product code (e.g., RABIES_V1).
        constraints: ^[A-Z][A-Z0-9_]{1,31}$; unique within (species, age_min_days).
      - name: age_min_days
        type: integer
        source: input
        description: Minimum age (in days) at which the first dose is due.
        constraints: 0 ≤ age_min_days ≤ 7300.
      - name: booster_interval_days
        type: integer
        source: input
        description: Days between successive doses.
        constraints: 7 ≤ booster_interval_days ≤ 1825; null when only single-dose.
        default: null
      - name: required
        type: boolean
        source: input
        description: True for legally required vaccines (e.g., rabies).
        default: false

  - name: VaccinationRecord
    parent: Pet
    common_fields: false
    fields:
      - name: pet_id
        type: string
        source: input
        description: FK → Pet.id.
      - name: vaccine_code
        type: string
        source: input
        description: Must match a VaccineSchedule.vaccine_code applicable to the pet's species.
      - name: administered_at
        type: datetime
        source: input
        description: ISO 8601 UTC of when the dose was given.
      - name: batch_id
        type: string
        source: input
        description: Vaccine batch identifier; used for batch-recall handling.
        constraints: ^[A-Z0-9-]{4,32}$.
      - name: status
        type: enum
        source: computed
        description: Lifecycle state.
        constraints: One of {ACTIVE, RECALLED, SUPERSEDED}; default ACTIVE; flips to RECALLED when batch recall arrives; flips to SUPERSEDED when a later same-vaccine_code dose is administered.
        default: ACTIVE
      - name: next_due_at
        type: datetime
        source: computed
        description: ISO 8601 UTC computed from administered_at + VaccineSchedule.booster_interval_days; null if single-dose. Recomputed on RECALLED → set to administered_at (i.e., immediate due).

  - name: Visit
    parent: Pet
    common_fields: true
    fields:
      - name: pet_id
        type: string
        source: input
        description: FK → Pet.id; pet must not be archived.
      - name: symptom_text
        type: string
        source: input
        description: Owner-reported symptoms.
        constraints: 1–2000 chars.
      - name: severity_score
        type: integer
        source: input
        description: Triage severity (1=routine, 10=critical).
        constraints: 1 ≤ severity_score ≤ 10.
      - name: triage_priority
        type: enum
        source: computed
        description: |
          Bucket derived from severity_score + age + species (see calculations.triage_priority_score):
          severity_score >= 8 → EMERGENCY; 5 ≤ severity_score < 8 → URGENT;
          severity_score < 5 → ROUTINE.
        constraints: One of {EMERGENCY, URGENT, ROUTINE}.
      - name: department_code
        type: enum
        source: computed
        description: Routed department.
        constraints: One of {INTERNAL_MED, SURGERY, EMERGENCY, DERMATOLOGY, DENTAL}.
      - name: assigned_vet_id
        type: string
        source: computed
        description: Vet assigned by routing rules (see selectors); may be reassigned by re-triage.
      - name: status
        type: enum
        source: computed
        description: Lifecycle state.
        constraints: One of {REGISTERED, TRIAGED, IN_CONSULT, CONSULT_DONE, HOSPITALIZED, CLOSED, CANCELLED}.
        default: REGISTERED
      - name: closed_at
        type: datetime
        source: computed
        description: Set on transition to CLOSED.
        default: null

  - name: TreatmentRecord
    parent: Visit
    common_fields: true
    fields:
      - name: visit_id
        type: string
        source: input
        description: FK → Visit.id; visit must be in IN_CONSULT.
      - name: consultation_notes
        type: string
        source: input
        description: Free-text notes.
        constraints: 1–4000 chars.
      - name: diagnosis_code
        type: string
        source: input
        description: ICD-style code (vet-specific).
        constraints: ^[A-Z][A-Z0-9.]{1,15}$.
      - name: treatment_plan
        type: string
        source: input
        description: Plan of care.
        constraints: 1–2000 chars.
      - name: consent_recorded
        type: boolean
        source: input
        description: Owner has signed consent for this plan.
        default: false
      - name: consent_recorded_at
        type: datetime
        source: system
        description: Set when consent_recorded transitions false→true.
        default: null
      - name: status
        type: enum
        source: computed
        description: Lifecycle state.
        constraints: One of {DRAFT, FINALIZED, AMENDED}.
        default: DRAFT

  - name: LabReport
    parent: Visit
    common_fields: true
    fields:
      - name: visit_id
        type: string
        source: input
        description: FK → Visit.id; visit must be in IN_CONSULT or CONSULT_DONE.
      - name: test_items
        type: array
        source: input
        description: |
          Ordered list of test-item objects:
          [{code: string, name: string, ref_low: number, ref_high: number}].
          Each code unique within the report. ref_low < ref_high; ref_low ≥ 0.
        constraints: 1 ≤ length ≤ 50.
      - name: sample_collected_at
        type: datetime
        source: input
        description: ISO 8601 UTC; required to leave ORDERED.
        default: null
      - name: external_lab_ref
        type: string
        source: input
        description: External lab tracking id; required to leave SAMPLE_COLLECTED.
        constraints: ^[A-Z0-9-]{6,40}$.
        default: null
      - name: results
        type: array
        source: input
        description: |
          Per-item results [{code: string, value: number}]; codes must be a
          permutation of test_items[*].code.
        default: []
      - name: abnormal_codes
        type: array
        source: computed
        description: Subset of test_items[*].code where value < ref_low or value > ref_high (exclusive boundaries — see calculations.lab_abnormal_flag).
        default: []
      - name: status
        type: enum
        source: computed
        description: Lifecycle state.
        constraints: One of {ORDERED, SAMPLE_COLLECTED, SENT_TO_LAB, RESULT_RECEIVED, FINALIZED, CANCELLED}.
        default: ORDERED

  - name: Drug
    parent: null
    common_fields: true
    fields:
      - name: code
        type: string
        source: input
        description: Drug code.
        constraints: ^[A-Z][A-Z0-9_]{1,31}$; unique.
      - name: name
        type: string
        source: input
        description: Display name.
        constraints: 1–80 chars.
      - name: controlled
        type: boolean
        source: input
        description: True for special-control drugs requiring ReviewingVet approval.
        default: false
      - name: dosage_min_mg_per_kg
        type: number
        source: input
        description: Minimum safe dose.
        constraints: "> 0."
      - name: dosage_max_mg_per_kg
        type: number
        source: input
        description: Maximum safe dose.
        constraints: ">= dosage_min_mg_per_kg."
      - name: interactions
        type: array
        source: input
        description: |
          List of {with_drug_code: string, severity: enum {MILD, MODERATE, SEVERE}}
          documenting known pairwise interactions.
        default: []
      - name: stock_units
        type: integer
        source: computed
        description: Available pharmacy stock; decremented on dispense, restored on refund.
        default: 0

  - name: Prescription
    parent: Visit
    common_fields: true
    fields:
      - name: visit_id
        type: string
        source: input
        description: FK → Visit.id.
      - name: drafting_vet_id
        type: string
        source: input
        description: Vet who drafts the prescription.
      - name: reviewing_vet_id
        type: string
        source: computed
        description: Vet who approves; assigned on POST /prescriptions/{id}/submit and validated to differ from drafting_vet_id when any item.controlled=true.
        default: null
      - name: items
        type: array
        source: input
        description: |
          [{drug_code: string, dose_mg_per_kg: number, frequency_per_day: integer,
            duration_days: integer, units: integer}]; 1 ≤ length ≤ 20.
      - name: interaction_risk
        type: enum
        source: computed
        description: Highest pairwise severity across items (see calculations.drug_interaction_score).
        constraints: One of {NONE, MILD, MODERATE, SEVERE}.
        default: NONE
      - name: status
        type: enum
        source: computed
        description: Lifecycle state.
        constraints: One of {DRAFT, PENDING_REVIEW, REJECTED, APPROVED, DISPENSED, CANCELLED}.
        default: DRAFT
      - name: rejection_reason
        type: string
        source: input
        description: Required on transition PENDING_REVIEW → REJECTED.
        default: null
      - name: dispensed_at
        type: datetime
        source: computed
        description: Set on transition APPROVED → DISPENSED.
        default: null

  - name: Cage
    parent: null
    common_fields: true
    fields:
      - name: cage_code
        type: string
        source: input
        description: Cage identifier.
        constraints: ^[A-Z][A-Z0-9-]{1,15}$; unique.
      - name: ward_code
        type: enum
        source: input
        description: Ward.
        constraints: One of {ISOLATION, GENERAL, ICU}.
      - name: capacity
        type: integer
        source: input
        description: Maximum simultaneous occupants.
        constraints: 1 ≤ capacity ≤ 4.
      - name: occupancy_count
        type: integer
        source: computed
        description: Current count of Hospitalization rows with status IN_CARE assigned to this cage.
        default: 0

  - name: Hospitalization
    parent: Visit
    common_fields: true
    fields:
      - name: visit_id
        type: string
        source: input
        description: FK → Visit.id; visit must be CONSULT_DONE.
      - name: cage_id
        type: string
        source: input
        description: FK → Cage.id; cage's occupancy_count must be < capacity at admission time.
      - name: admitted_at
        type: datetime
        source: system
        description: Set on creation.
      - name: discharged_at
        type: datetime
        source: computed
        description: Set on transition DISCHARGE_PENDING → DISCHARGED.
        default: null
      - name: daily_care_log
        type: array
        source: input
        description: |
          Append-only [{logged_at, note, treatment_executed: boolean}]; new entries
          accepted only while status ∈ {ADMITTED, IN_CARE}.
        default: []
      - name: status
        type: enum
        source: computed
        description: Lifecycle state.
        constraints: One of {ADMITTED, IN_CARE, DISCHARGE_PENDING, DISCHARGED, CANCELLED}.
        default: ADMITTED

  - name: Bill
    parent: Visit
    common_fields: true
    fields:
      - name: visit_id
        type: string
        source: input
        description: FK → Visit.id; exactly one Bill per Visit.
      - name: line_items
        type: array
        source: computed
        description: |
          Aggregated from Visit children:
          [{kind: enum {CONSULT, LAB, DRUG, HOSPITAL_DAY}, ref_id: string,
            qty: integer, unit_price_cents: integer, line_total_cents: integer}].
          line_total_cents is per-line rounded — see calculations.bill_total_provisional.
        default: []
      - name: package_code
        type: string
        source: input
        description: Optional package discount code (e.g., DENTAL_PKG).
        constraints: When set, must match an internal package; max one package per bill.
        default: null
      - name: deposit_applied_cents
        type: integer
        source: computed
        description: Owner deposit applied at issue time, capped at min(deposit_balance, gross_after_discount).
        default: 0
      - name: insurance_estimate_cents
        type: integer
        source: input
        description: Estimated insurance reimbursement provided by client at draft time.
        default: 0
      - name: insurance_actual_cents
        type: integer
        source: input
        description: Actual reimbursement returned by external insurance after settlement.
        default: 0
      - name: provisional_total_cents
        type: integer
        source: computed
        description: Computed by calculations.bill_total_provisional at DRAFT and ISSUED.
        default: 0
      - name: final_total_cents
        type: integer
        source: computed
        description: Computed by calculations.bill_total_final at PAID.
        default: 0
      - name: paid_amount_cents
        type: integer
        source: computed
        description: Sum of accepted payment events.
        default: 0
      - name: refund_amount_cents
        type: integer
        source: computed
        description: Sum of accepted refund events.
        default: 0
      - name: invoice_no
        type: string
        source: system
        description: Set on transition PAID → INVOICED; format INV-YYYYMMDD-{seq6}.
        default: null
      - name: status
        type: enum
        source: computed
        description: Lifecycle state.
        constraints: One of {DRAFT, ISSUED, PARTIALLY_PAID, PAID, REFUND_PENDING, REFUNDED, INVOICED, CANCELLED}.
        default: DRAFT

  - name: AuditLog
    parent: null
    common_fields: false
    fields:
      - name: subject_type
        type: enum
        source: system
        description: Polymorphic subject.
        constraints: One of {PRESCRIPTION, TREATMENT_RECORD}.
      - name: subject_id
        type: string
        source: system
        description: id of the audited entity.
      - name: actor_role
        type: string
        source: system
        description: X-User-Role at time of action.
      - name: actor_id
        type: string
        source: system
        description: X-User-ID at time of action.
      - name: action
        type: enum
        source: system
        description: Audited action.
        constraints: One of {DRAFT, SUBMIT, APPROVE, REJECT, DISPENSE, FINALIZE, AMEND, CANCEL}.
      - name: from_state
        type: string
        source: system
        description: Previous status (may be null for create).
      - name: to_state
        type: string
        source: system
        description: New status.
      - name: payload_hash
        type: string
        source: system
        description: SHA-256 hex of canonical JSON of relevant fields at the time of the event.
      - name: occurred_at
        type: datetime
        source: system
        description: ISO 8601 UTC of the event.

# =============================================================================
# §1.2 State Machines
# =============================================================================
state_machines:
  - entity: Visit
    initial_state: REGISTERED
    terminal_states: [CLOSED, CANCELLED]
    transitions:
      - from: REGISTERED
        to: TRIAGED
        trigger: "POST /visits/{id}/triage"
        actor: TriageNurse
        preconditions:
          - "Owner.contact_verified == true for the pet's owner"
          - "Pet.archived == false"
        side_effects:
          - "Recompute Visit.triage_priority via calculations.triage_priority_score"
          - "Set Visit.department_code via routing rule (severity-based selector)"
          - "Set Visit.assigned_vet_id via vet selector"
      - from: TRIAGED
        to: IN_CONSULT
        trigger: "POST /visits/{id}/start-consult"
        actor: DraftingVet
        preconditions:
          - "Visit.assigned_vet_id == X-User-ID"
        side_effects: []
      - from: IN_CONSULT
        to: TRIAGED
        trigger: "POST /visits/{id}/re-triage"
        actor: TriageNurse
        preconditions:
          - "No FINALIZED TreatmentRecord exists for this visit"
        side_effects:
          - "Re-run triage routing; assigned_vet_id may change"
        note: "Branch-back loop; only allowed before any treatment record is finalized."
      - from: IN_CONSULT
        to: CONSULT_DONE
        trigger: "POST /visits/{id}/end-consult"
        actor: DraftingVet
        preconditions:
          - "At least one TreatmentRecord with status=FINALIZED exists for this visit"
        side_effects: []
      - from: CONSULT_DONE
        to: HOSPITALIZED
        trigger: "POST /hospitalizations (with visit_id)"
        actor: DraftingVet
        preconditions:
          - "Cage.occupancy_count < Cage.capacity"
          - "Owner.deposit_balance_cents >= 50000  # deposit floor for admission"
        side_effects:
          - "Increment Cage.occupancy_count by 1"
          - "Decrement Owner.deposit_balance_cents by 50000 (admission hold)"
      - from: CONSULT_DONE
        to: CLOSED
        trigger: "POST /visits/{id}/close"
        actor: Cashier
        preconditions:
          - "The Visit's Bill exists and Bill.status ∈ {INVOICED, REFUNDED}"
          - "Every Prescription on this visit has status ∈ {DISPENSED, REJECTED, CANCELLED}"
        side_effects:
          - "Set Visit.closed_at = now()"
          - "Append AuditLog if any TreatmentRecord was AMENDED (subject_type=TREATMENT_RECORD, action=FINALIZE)"
      - from: HOSPITALIZED
        to: CLOSED
        trigger: "POST /visits/{id}/close"
        actor: Cashier
        preconditions:
          - "All Hospitalization rows for this visit have status=DISCHARGED"
          - "Bill.status ∈ {INVOICED, REFUNDED}"
          - "Every Prescription has status ∈ {DISPENSED, REJECTED, CANCELLED}"
        side_effects:
          - "Set Visit.closed_at = now()"
      - from: REGISTERED
        to: CANCELLED
        trigger: "POST /visits/{id}/cancel"
        actor: TriageNurse
        preconditions: ["No TreatmentRecord, LabReport, Prescription, or Hospitalization exists"]
        side_effects: []
      - from: TRIAGED
        to: CANCELLED
        trigger: "POST /visits/{id}/cancel"
        actor: TriageNurse
        preconditions: ["No TreatmentRecord, LabReport, Prescription, or Hospitalization exists"]
        side_effects: []

  - entity: Prescription
    initial_state: DRAFT
    terminal_states: [DISPENSED, CANCELLED]
    transitions:
      - from: DRAFT
        to: PENDING_REVIEW
        trigger: "POST /prescriptions/{id}/submit"
        actor: DraftingVet
        preconditions:
          - "Visit.status == IN_CONSULT"
          - "Prescription.drafting_vet_id == X-User-ID"
          - "calculations.drug_interaction_score has been recomputed and stored on interaction_risk"
        side_effects:
          - "Append AuditLog (subject_type=PRESCRIPTION, action=SUBMIT, from_state=DRAFT, to_state=PENDING_REVIEW)"
      - from: PENDING_REVIEW
        to: APPROVED
        trigger: "POST /prescriptions/{id}/approve"
        actor: ReviewingVet
        preconditions:
          - "X-User-ID != Prescription.drafting_vet_id when ANY item references a Drug with controlled=true (segregation of duties)"
          - "Prescription.interaction_risk != SEVERE OR request body has override_acknowledged=true"
          - "All items pass dosage rationality (Drug.dosage_min ≤ item.dose_mg_per_kg ≤ Drug.dosage_max)"
        side_effects:
          - "Set reviewing_vet_id = X-User-ID"
          - "Append AuditLog (action=APPROVE)"
      - from: PENDING_REVIEW
        to: REJECTED
        trigger: "POST /prescriptions/{id}/reject"
        actor: ReviewingVet
        preconditions:
          - "rejection_reason field present in body, length 1–500"
        side_effects:
          - "Set reviewing_vet_id = X-User-ID"
          - "Append AuditLog (action=REJECT)"
      - from: REJECTED
        to: DRAFT
        trigger: "POST /prescriptions/{id}/redraft"
        actor: DraftingVet
        preconditions:
          - "X-User-ID == drafting_vet_id"
        side_effects:
          - "Clear reviewing_vet_id and rejection_reason"
        note: "Cyclic — DRAFT↔PENDING_REVIEW↔REJECTED can repeat any number of times."
      - from: APPROVED
        to: DISPENSED
        trigger: "POST /prescriptions/{id}/dispense"
        actor: Pharmacist
        preconditions:
          - "For every item: Drug.stock_units >= item.units"
          - "Visit.status ∈ {IN_CONSULT, CONSULT_DONE, HOSPITALIZED}"
        side_effects:
          - "Decrement Drug.stock_units by item.units for each item"
          - "Set dispensed_at = now()"
          - "Append a DRUG line_item to the Visit's Bill (recompute provisional_total_cents) — cascade hop 1"
          - "If Bill.status was ISSUED, transition Bill.status back to DRAFT to require re-issue — cascade hop 2"
          - "Append AuditLog (action=DISPENSE)"
      - from: DRAFT
        to: CANCELLED
        trigger: "POST /prescriptions/{id}/cancel"
        actor: DraftingVet
        preconditions: []
        side_effects: ["Append AuditLog (action=CANCEL)"]
      - from: PENDING_REVIEW
        to: CANCELLED
        trigger: "POST /prescriptions/{id}/cancel"
        actor: DraftingVet
        preconditions: []
        side_effects: ["Append AuditLog (action=CANCEL)"]

  - entity: LabReport
    initial_state: ORDERED
    terminal_states: [FINALIZED, CANCELLED]
    transitions:
      - from: ORDERED
        to: SAMPLE_COLLECTED
        trigger: "POST /lab-reports/{id}/collect-sample"
        actor: TriageNurse
        preconditions: ["sample_collected_at field provided"]
        side_effects: []
      - from: SAMPLE_COLLECTED
        to: SENT_TO_LAB
        trigger: "POST /lab-reports/{id}/send-to-lab"
        actor: TriageNurse
        preconditions: ["external_lab_ref field provided"]
        side_effects: []
      - from: SENT_TO_LAB
        to: RESULT_RECEIVED
        trigger: "POST /_events/external-lab-result (idempotent on external_lab_ref)"
        actor: system
        preconditions:
          - "external_lab_ref matches an existing LabReport with status=SENT_TO_LAB"
          - "results array length matches test_items length and codes are a permutation"
        side_effects:
          - "Set results"
          - "Recompute abnormal_codes via calculations.lab_abnormal_flag"
        note: "Idempotent — duplicate event with same external_lab_ref is a no-op (200, no double-write)."
      - from: RESULT_RECEIVED
        to: FINALIZED
        trigger: "POST /lab-reports/{id}/finalize"
        actor: DraftingVet
        preconditions: ["X-User-ID == Visit.assigned_vet_id"]
        side_effects:
          - "Append a LAB line_item to the Visit's Bill (recompute provisional_total_cents)"
      - from: ORDERED
        to: CANCELLED
        trigger: "POST /lab-reports/{id}/cancel"
        actor: DraftingVet
        preconditions: []
        side_effects: []
      - from: SAMPLE_COLLECTED
        to: CANCELLED
        trigger: "POST /lab-reports/{id}/cancel"
        actor: DraftingVet
        preconditions: []
        side_effects: []

  - entity: TreatmentRecord
    initial_state: DRAFT
    terminal_states: [FINALIZED, AMENDED]
    transitions:
      - from: DRAFT
        to: FINALIZED
        trigger: "POST /treatment-records/{id}/finalize"
        actor: DraftingVet
        preconditions:
          - "consent_recorded == true"
          - "X-User-ID == Visit.assigned_vet_id"
          - "Visit.status == IN_CONSULT"
        side_effects:
          - "Append {visit_id, diagnosis_code, finalized_at} to Pet.medical_history (cascade hop 1)"
          - "Append a CONSULT line_item to Bill (cascade hop 2 — recomputes Bill.provisional_total_cents)"
          - "Append AuditLog (subject_type=TREATMENT_RECORD, action=FINALIZE)"
      - from: FINALIZED
        to: AMENDED
        trigger: "PATCH /treatment-records/{id}"
        actor: DraftingVet
        preconditions:
          - "Visit.status ∈ {IN_CONSULT, CONSULT_DONE}"
          - "X-User-ID == Visit.assigned_vet_id"
        side_effects:
          - "Append AuditLog (subject_type=TREATMENT_RECORD, action=AMEND, payload_hash captures new fields)"
        note: "Pet.medical_history snapshot is NOT rewritten (event-style append-only)."

  - entity: Hospitalization
    initial_state: ADMITTED
    terminal_states: [DISCHARGED, CANCELLED]
    transitions:
      - from: ADMITTED
        to: IN_CARE
        trigger: "POST /hospitalizations/{id}/begin-care"
        actor: DraftingVet
        preconditions: []
        side_effects: []
      - from: IN_CARE
        to: DISCHARGE_PENDING
        trigger: "POST /hospitalizations/{id}/request-discharge"
        actor: DraftingVet
        preconditions:
          - "Every Prescription on this Visit has status ∈ {DISPENSED, REJECTED, CANCELLED}"
        side_effects: []
      - from: DISCHARGE_PENDING
        to: DISCHARGED
        trigger: "POST /hospitalizations/{id}/discharge"
        actor: Cashier
        preconditions:
          - "Bill.status ∈ {ISSUED, PARTIALLY_PAID, PAID, INVOICED}"
        side_effects:
          - "Set discharged_at = now()"
          - "Decrement Cage.occupancy_count by 1"
          - "Append HOSPITAL_DAY line items to Bill (one per calendar day spanned, recompute provisional_total_cents)"
      - from: ADMITTED
        to: CANCELLED
        trigger: "POST /hospitalizations/{id}/cancel"
        actor: DraftingVet
        preconditions: ["No daily_care_log entries with treatment_executed=true"]
        side_effects:
          - "Decrement Cage.occupancy_count by 1"
          - "Refund admission hold: increment Owner.deposit_balance_cents by 50000"

  - entity: Bill
    initial_state: DRAFT
    terminal_states: [INVOICED, REFUNDED, CANCELLED]
    transitions:
      - from: DRAFT
        to: ISSUED
        trigger: "POST /bills/{id}/issue"
        actor: Cashier
        preconditions:
          - "Visit.status ∈ {CONSULT_DONE, HOSPITALIZED}"
          - "calculations.bill_total_provisional has been recomputed"
        side_effects:
          - "Apply deposit_applied_cents = min(Owner.deposit_balance_cents, gross_after_discount)"
          - "Decrement Owner.deposit_balance_cents by deposit_applied_cents"
      - from: ISSUED
        to: PARTIALLY_PAID
        trigger: "POST /_events/payment (amount < provisional_total_cents - deposit_applied_cents)"
        actor: system
        preconditions: ["amount > 0", "Bill not already PAID"]
        side_effects: ["Increment paid_amount_cents by amount"]
      - from: ISSUED
        to: PAID
        trigger: "POST /_events/payment (amount == provisional_total_cents - deposit_applied_cents)"
        actor: system
        preconditions: ["Idempotent on payment event_id"]
        side_effects:
          - "Increment paid_amount_cents"
          - "Recompute final_total_cents via calculations.bill_total_final using insurance_actual_cents"
      - from: PARTIALLY_PAID
        to: PAID
        trigger: "POST /_events/payment (cumulative reaches provisional_total_cents - deposit_applied_cents)"
        actor: system
        preconditions: []
        side_effects:
          - "Increment paid_amount_cents"
          - "Recompute final_total_cents via calculations.bill_total_final"
      - from: PAID
        to: INVOICED
        trigger: "POST /bills/{id}/issue-invoice"
        actor: Cashier
        preconditions: []
        side_effects: ["Set invoice_no = INV-{YYYYMMDD}-{seq6}"]
      - from: PAID
        to: REFUND_PENDING
        trigger: "POST /bills/{id}/refund (amount, reason)"
        actor: Cashier
        preconditions:
          - "amount > 0"
          - "amount + refund_amount_cents <= paid_amount_cents"
        side_effects: []
      - from: INVOICED
        to: REFUND_PENDING
        trigger: "POST /bills/{id}/refund"
        actor: Cashier
        preconditions:
          - "amount + refund_amount_cents <= paid_amount_cents"
        side_effects: []
      - from: REFUND_PENDING
        to: REFUNDED
        trigger: "POST /_events/refund-confirm (idempotent on refund event_id)"
        actor: system
        preconditions: []
        side_effects:
          - "Increment refund_amount_cents by amount"
          - "Restore Owner.deposit_balance_cents and Drug.stock_units per refund_breakdown (cascade hop 2)"
      - from: ISSUED
        to: DRAFT
        trigger: "POST /prescriptions/{id}/dispense (system cascade — see Prescription side_effects)"
        actor: system
        preconditions: ["A new DRUG line_item was just appended"]
        side_effects: ["Set provisional_total_cents := newly recomputed value"]
        note: "Cascade-driven revert; only the system can move ISSUED→DRAFT."
      - from: DRAFT
        to: CANCELLED
        trigger: "POST /bills/{id}/cancel"
        actor: Cashier
        preconditions: ["Visit.status == CANCELLED"]
        side_effects:
          - "Restore Owner.deposit_balance_cents by deposit_applied_cents"

# =============================================================================
# §1.2.1 Concurrency Rules
# =============================================================================
concurrency_rules:
  - scenario: "Two ReviewingVets approve the same Prescription simultaneously"
    guarantee: "Exactly one approve succeeds; the second is rejected with stale-version semantics."
    error_id: ERR_PRESCRIPTION_ALREADY_REVIEWED
    http_status: 409
    serialization: "First-writer-wins on prescription.status; loser's version field is stale."

  - scenario: "Approve and reject arrive concurrently for one Prescription in PENDING_REVIEW"
    guarantee: "Exactly one operation succeeds; the loser sees ERR_INVALID_STATE."
    error_id: ERR_INVALID_STATE
    http_status: 409
    serialization: "First-writer-wins on prescription.status."

  - scenario: "Two Hospitalizations created simultaneously target the same Cage at its capacity boundary"
    guarantee: "At most one assignment can push occupancy_count up to capacity; the other is rejected."
    error_id: ERR_CAGE_CAPACITY_EXCEEDED
    http_status: 409
    serialization: "First-writer-wins on cage.occupancy_count increment (atomic check-and-increment)."

  - scenario: "Two Bill payment events with the same event_id arrive at once"
    guarantee: "Exactly one is applied; the duplicate is a no-op (idempotent on event_id)."
    error_id: ERR_DUPLICATE_EVENT
    http_status: 409
    serialization: "Idempotent on payment.event_id."

  - scenario: "External-lab-result event delivered twice with the same external_lab_ref"
    guarantee: "First delivery sets results; second is a no-op 200 with the same response body."
    error_id: ERR_DUPLICATE_EVENT
    http_status: 200
    serialization: "Idempotent on lab_report.external_lab_ref."

  - scenario: "Dispense racing dispense for one approved Prescription"
    guarantee: "Drug stock can only be decremented once for a given prescription; second call rejected."
    error_id: ERR_INVALID_STATE
    http_status: 409
    serialization: "First-writer-wins on prescription.status APPROVED→DISPENSED."

# =============================================================================
# §1.3 Calculation Rules Table
# =============================================================================
calculations:
  - name: triage_priority_score
    trigger: "POST /visits/{id}/triage; recomputed on POST /visits/{id}/re-triage"
    algorithm: weighted_scoring
    formula: |
      # Inputs from Visit and Pet
      species_factor = {DOG: 1.0, CAT: 1.0, RABBIT: 1.2, BIRD: 1.3, OTHER: 1.1}[Pet.species]
      age_days = floor((now_utc_date - Pet.birth_date).days)
      age_factor = 1.3 if age_days <= 90 else (1.2 if age_days >= 4380 else 1.0)
      raw = severity_score * species_factor * age_factor          # float
      score = round(raw * 10) / 10                                 # 1 decimal, half-up
      # Boundaries (note >= vs >):
      if score >= 8.0: triage_priority = "EMERGENCY"
      elif score >= 5.0: triage_priority = "URGENT"
      else: triage_priority = "ROUTINE"

      # Department routing — explicit selector:
      # eligibility filter: department_code where department.active == true
      # For derivation here, deterministic mapping from triage_priority + symptom keywords:
      if triage_priority == "EMERGENCY": department_code = "EMERGENCY"
      elif "skin" in symptom_text.lower(): department_code = "DERMATOLOGY"
      elif "tooth" in symptom_text.lower() or "dental" in symptom_text.lower(): department_code = "DENTAL"
      elif severity_score >= 6: department_code = "SURGERY"
      else: department_code = "INTERNAL_MED"

      # Vet selector — eligibility: vets active in chosen department_code;
      # ranking: ascending current_open_visit_count; tie-break: ascending vet.id (lex);
      # fallback: ERR_NO_VET_AVAILABLE if eligible set is empty.
    input_set: "Pet (birth_date, species), Visit (severity_score, symptom_text), Vet roster active=true."
    constants:
      EMERGENCY_THRESHOLD: 8.0
      URGENT_THRESHOLD: 5.0
      AGE_PEDIATRIC_DAYS: 90
      AGE_GERIATRIC_DAYS: 4380
    precision: "1 decimal place, round_half_up; bucket boundaries are inclusive on the lower end (>=)."
    variants: []

  - name: bill_total_provisional
    trigger: "Any DRUG/LAB/CONSULT/HOSPITAL_DAY line_item appended; explicit POST /bills/{id}/recompute; entry to ISSUED."
    algorithm: tiered_pricing
    formula: |
      # Phase 1: per-line cents (round half-up) — round-per-line rule pinned.
      for li in Bill.line_items:
        li.line_total_cents = round_half_up(li.qty * li.unit_price_cents)   # qty is integer; unit_price_cents is integer; product is exact, rounding only matters when discounts apply (see below).
      gross_cents = sum(li.line_total_cents for li in line_items)

      # Phase 2: package discount table — order pinned: package discount BEFORE deposit.
      # Tier-by-gross discount table (gross_cents in cents):
      pkg_tier_pct = 0
      if Bill.package_code == "DENTAL_PKG":
        if gross_cents >= 500_00: pkg_tier_pct = 15
        elif gross_cents >= 200_00: pkg_tier_pct = 10
        else: pkg_tier_pct = 5
      elif Bill.package_code == "SURGERY_PKG":
        if gross_cents >= 1500_00: pkg_tier_pct = 20
        else: pkg_tier_pct = 12
      # else no discount

      # Phase 3: NESTED ROUNDING ORDER PINNED — apply tier % to gross, round to cent
      pkg_discount_cents = round_half_up(gross_cents * pkg_tier_pct / 100)
      gross_after_discount = gross_cents - pkg_discount_cents

      # Phase 4: deposit (already deducted at ISSUED-entry side_effect)
      # Phase 5: insurance estimate (provisional only — uses estimate, not actual)
      insurance_used_cents = min(Bill.insurance_estimate_cents, gross_after_discount - Bill.deposit_applied_cents)
      provisional_total_cents = gross_after_discount - Bill.deposit_applied_cents - insurance_used_cents
      provisional_total_cents = max(0, provisional_total_cents)
    input_set: "All FINALIZED TreatmentRecord lines, FINALIZED LabReport lines, DISPENSED Prescription items, DISCHARGED Hospitalization days for the Visit; statuses pinned exactly — DRAFT/AMENDED/CANCELLED excluded."
    constants:
      DENTAL_PKG_TIERS: {500_00: 15, 200_00: 10, 0: 5}
      SURGERY_PKG_TIERS: {1500_00: 20, 0: 12}
    precision: "All money in integer cents; rounding mode round_half_up applied per phase, NEVER twice."
    variants:
      - name: provisional
        when: "Bill.status ∈ {DRAFT, ISSUED, PARTIALLY_PAID}"
        difference: "Uses Bill.insurance_estimate_cents (the client-supplied estimate). May overstate or understate the eventual final."
      - name: final
        when: "Bill enters PAID"
        difference: "Switches to Bill.insurance_actual_cents — see calculations.bill_total_final. Same line_items; only the insurance term changes."

  - name: bill_total_final
    trigger: "Bill enters PAID."
    algorithm: tiered_pricing
    formula: |
      # SAME phases as bill_total_provisional through phase 4, then:
      insurance_used_cents = min(Bill.insurance_actual_cents, gross_after_discount - Bill.deposit_applied_cents)
      final_total_cents = gross_after_discount - Bill.deposit_applied_cents - insurance_used_cents
      final_total_cents = max(0, final_total_cents)
      # Reconciliation rule: difference (provisional - final) is what gets refunded automatically
      # via POST /_events/refund-confirm pipeline if final < provisional.
    input_set: "Same as bill_total_provisional; statuses pinned identically."
    constants: {}
    precision: "Integer cents; round_half_up; identical phasing to provisional to ensure determinism."
    variants:
      - name: final_with_overpay
        when: "insurance_actual_cents > insurance_estimate_cents AND paid_amount_cents > final_total_cents"
        difference: "Triggers automatic refund flow: refund_amount_cents := paid_amount_cents - final_total_cents; Bill transitions PAID → REFUND_PENDING."

  - name: drug_interaction_score
    trigger: "POST /prescriptions/{id}/submit"
    algorithm: weighted_scoring
    formula: |
      # 3+ inputs with non-linear interaction (combinatorial mode (a) is documented but
      # the binding combinatorial instance for this scaffold is mode (c) below).
      severity_rank = {NONE: 0, MILD: 1, MODERATE: 2, SEVERE: 3}
      best_severity_rank = 0
      for i, j in unordered_pairs(items):  # all C(n,2) pairs
        d_i = lookup(Drug, items[i].drug_code)
        d_j = lookup(Drug, items[j].drug_code)
        edge = next((e for e in d_i.interactions if e.with_drug_code == d_j.code), None)
        if edge is not None:
          best_severity_rank = max(best_severity_rank, severity_rank[edge.severity])
      Prescription.interaction_risk = inverse_lookup(severity_rank, best_severity_rank)

      # Dosage rationality (combinatorial mode (a)):
      # For each item: d = lookup(Drug, item.drug_code)
      # require d.dosage_min_mg_per_kg <= item.dose_mg_per_kg <= d.dosage_max_mg_per_kg
      # AND item.units == ceil(item.dose_mg_per_kg * Pet.weight_kg * item.frequency_per_day * item.duration_days)
      # Three-way non-linear: dose × weight × duration, with ceil() at the end.
    input_set: "Prescription.items, Drug.interactions, Drug.dosage_min/max, Pet.weight_kg."
    constants: {}
    precision: "Integer for units (ceil); ranking is integer-valued."
    variants: []

  - name: bill_circular_pkg_tier
    trigger: "POST /bills/{id}/recompute (combinatorial mode (c) — pinned evaluation order)."
    algorithm: constraint_propagation
    formula: |
      # The circular-looking dependency:
      #   gross_cents      depends on line_items
      #   pkg_tier_pct     depends on gross_cents (selects from tier table)
      #   pkg_discount     depends on pkg_tier_pct AND gross_cents
      #   final_total      depends on pkg_discount
      # PINNED evaluation order (no fixed-point iteration — single pass):
      #   1) gross_cents from current line_items (CONSULT/LAB/DRUG/HOSPITAL_DAY rows already finalized)
      #   2) pkg_tier_pct selected via gross_cents (BEFORE discount applied — tier is keyed on gross_cents,
      #      NOT on the post-discount total)
      #   3) pkg_discount = round_half_up(gross_cents * pkg_tier_pct / 100)
      #   4) gross_after_discount = gross_cents - pkg_discount
      #   5) deposit, then insurance applied per bill_total_provisional/final phases
      # Re-running step 2 against gross_after_discount would change tiers and produce a
      # different total — that path is FORBIDDEN. The scaffold pins tier selection on gross_cents.
    input_set: "Bill.line_items (FINALIZED), Bill.package_code, Bill.deposit_applied_cents, Bill.insurance_estimate_cents."
    constants:
      RULE: "tier_keyed_on_gross_pre_discount"
    precision: "Integer cents; round_half_up; single-pass."
    variants: []

  - name: lab_abnormal_flag
    trigger: "POST /_events/external-lab-result; POST /lab-reports/{id}/finalize"
    algorithm: threshold
    formula: |
      abnormal_codes = []
      for r in results:
        item = next(t for t in test_items if t.code == r.code)
        # EXCLUSIVE boundary semantics — value EXACTLY at ref_low or ref_high is NORMAL:
        #   abnormal iff (r.value < item.ref_low) OR (r.value > item.ref_high)
        if r.value < item.ref_low or r.value > item.ref_high:
          abnormal_codes.append(r.code)
      LabReport.abnormal_codes = sorted(abnormal_codes)  # ascending lex order, deterministic.

      # Historical comparison: GET /lab-reports/{id}/history compares to most-recent prior
      # FINALIZED LabReport for same Visit.pet_id; selector below.
    input_set: "LabReport.test_items, LabReport.results."
    constants: {}
    precision: "Numeric comparisons exact (no rounding); boundary is exclusive on both sides."
    variants: []

  - name: vaccine_due_estimate
    trigger: "GET /pets/{id}/vaccines/due-list; recomputed when a VaccinationRecord is added or RECALLED."
    algorithm: chronological
    formula: |
      # Two valid algorithms produce different next-due dates depending on
      # recall handling — second variant differs.
      pet_age_days = floor((now_utc_date - Pet.birth_date).days)
      due_list = []
      for sched in VaccineSchedule where sched.species == Pet.species and pet_age_days >= sched.age_min_days:
        # eligible records: ACTIVE only (RECALLED and SUPERSEDED excluded)
        history = [v for v in VaccinationRecord
                   where v.pet_id == Pet.id and v.vaccine_code == sched.vaccine_code
                         and v.status == 'ACTIVE']
        history.sort(by=administered_at ASC)  # tie-break: id ASC
        if not history:
          due_at = Pet.birth_date + sched.age_min_days days
        else:
          last = history[-1]
          if sched.booster_interval_days is None:
            continue  # single-dose, already given
          due_at = last.administered_at + sched.booster_interval_days days
        due_list.append({vaccine_code: sched.vaccine_code, due_at: due_at,
                         overdue: due_at <= now_utc})
      return due_list
    input_set: "VaccineSchedule rows for Pet.species; VaccinationRecord rows for this Pet with status=ACTIVE (RECALLED/SUPERSEDED excluded)."
    constants: {}
    precision: "Date arithmetic in days; boundary 'overdue' uses <= (today is overdue if due_at == today)."
    variants:
      - name: with_recall_active
        when: "Latest matching VaccinationRecord.status == ACTIVE"
        difference: "Uses last administered_at + booster_interval_days as next_due_at."
      - name: post_recall
        when: "Latest matching VaccinationRecord.status == RECALLED (batch recall)"
        difference: |
          Recalled dose is treated as if never administered: next_due_at falls back to the
          latest still-ACTIVE prior dose, OR to Pet.birth_date + age_min_days if none.
          Same inputs (history rows), different exclusion set → different due_at.

# =============================================================================
# §1.4 Validation Rules Table (ordered by priority)
# =============================================================================
validations:
  - priority: 1
    category: auth
    check: "X-User-Role and X-User-ID headers are present and well-formed"
    error_id: ERR_AUTH_MISSING
    http_status: 401
    applies_to: all
  - priority: 2
    category: auth
    check: "Role is recognized (one of TriageNurse, DraftingVet, ReviewingVet, Pharmacist, Cashier, OwnerService, PlatformAdmin)"
    error_id: ERR_AUTH_INVALID_ROLE
    http_status: 401
    applies_to: all
  - priority: 3
    category: auth
    check: "Role is permitted for this endpoint (per RBAC)"
    error_id: ERR_FORBIDDEN
    http_status: 403
    applies_to: all
  - priority: 4
    category: existence
    check: "Path parameters reference existing rows, validated left-to-right (e.g., /pets/{pet_id}/visits/{visit_id} — pet_id checked first)"
    error_id: ERR_NOT_FOUND
    http_status: 404
    applies_to: all
  - priority: 5
    category: existence
    check: "FK fields in the request body reference existing rows (owner_id, visit_id, drug_code, cage_id, etc.)"
    error_id: ERR_REFERENCE_NOT_FOUND
    http_status: 422
    applies_to: "POST/PUT/PATCH endpoints"

  - priority: 10
    category: state
    check: "Target entity is in a state that admits the requested transition (per §1.2)"
    error_id: ERR_INVALID_STATE
    http_status: 409
    applies_to: "all transition endpoints"
  - priority: 11
    category: state
    check: "OCC version match: request body's version equals current entity.version"
    error_id: ERR_STALE_VERSION
    http_status: 409
    applies_to: "PATCH /treatment-records/{id}, PATCH /pets/{id}, mutation endpoints accepting version"

  - priority: 20
    category: business_safety
    check: "Pet.archived must be false when starting a new Visit"
    error_id: ERR_PET_ARCHIVED
    http_status: 409
    applies_to: "POST /pets/{pet_id}/visits"
  - priority: 21
    category: business_safety
    check: "Owner.contact_verified must be true to leave REGISTERED"
    error_id: ERR_OWNER_NOT_VERIFIED
    http_status: 409
    applies_to: "POST /visits/{id}/triage"
  - priority: 22
    category: business_safety
    check: "Segregation of duties: reviewing_vet_id != drafting_vet_id when ANY item references a controlled Drug"
    error_id: ERR_SEGREGATION_OF_DUTIES
    http_status: 403
    applies_to: "POST /prescriptions/{id}/approve"
  - priority: 23
    category: business_safety
    check: "Dosage rationality: each item.dose_mg_per_kg ∈ [Drug.dosage_min, Drug.dosage_max]"
    error_id: ERR_DOSAGE_OUT_OF_RANGE
    http_status: 422
    applies_to: "POST /prescriptions, PATCH /prescriptions/{id}, POST /prescriptions/{id}/submit"
  - priority: 24
    category: business_safety
    check: "Drug interaction risk = SEVERE blocks approval unless override_acknowledged=true present in body"
    error_id: ERR_SEVERE_INTERACTION
    http_status: 422
    applies_to: "POST /prescriptions/{id}/approve"
  - priority: 25
    category: business_safety
    check: "Owner.contact_verified must be true before any Prescription can transition DRAFT→PENDING_REVIEW"
    error_id: ERR_OWNER_NOT_VERIFIED
    http_status: 409
    applies_to: "POST /prescriptions/{id}/submit"

  - priority: 30
    category: business_referential
    check: "Visit must be in IN_CONSULT to create or finalize a TreatmentRecord; in IN_CONSULT or CONSULT_DONE to finalize a LabReport"
    error_id: ERR_INVALID_STATE
    http_status: 409
    applies_to: "POST /treatment-records, POST /treatment-records/{id}/finalize, POST /lab-reports/{id}/finalize"
  - priority: 31
    category: business_referential
    check: "Cannot dispatch Visit to CLOSED while any Prescription is in DRAFT/PENDING_REVIEW/APPROVED/REJECTED that has not been redrafted"
    error_id: ERR_PENDING_PRESCRIPTIONS
    http_status: 409
    applies_to: "POST /visits/{id}/close"
  - priority: 32
    category: business_referential
    check: "Hospitalization discharge requires every Prescription on the Visit to be DISPENSED/REJECTED/CANCELLED"
    error_id: ERR_PENDING_PRESCRIPTIONS
    http_status: 409
    applies_to: "POST /hospitalizations/{id}/request-discharge"
  - priority: 33
    category: business_referential
    check: "Test items array is non-empty AND all codes unique within a LabReport"
    error_id: ERR_LAB_ITEMS_INVALID
    http_status: 422
    applies_to: "POST /lab-reports"

  - priority: 40
    category: business_constraint
    check: "Cage.occupancy_count < Cage.capacity at admission"
    error_id: ERR_CAGE_CAPACITY_EXCEEDED
    http_status: 409
    applies_to: "POST /hospitalizations"
  - priority: 41
    category: business_constraint
    check: "VaccinationRecord.administered_at must be ≥ Pet.birth_date + (matching VaccineSchedule.age_min_days)"
    error_id: ERR_VACCINE_AGE_MIN
    http_status: 422
    applies_to: "POST /pets/{pet_id}/vaccinations"
  - priority: 42
    category: business_constraint
    check: "VaccinationRecord.batch_id must NOT be a recalled batch (recalled batches block new doses)"
    error_id: ERR_BATCH_RECALLED
    http_status: 422
    applies_to: "POST /pets/{pet_id}/vaccinations"
  - priority: 43
    category: business_temporal
    check: "Two cage assignments cannot overlap once the cage is at capacity (interval = [admitted_at, discharged_at OR +inf); aggregate active-occupant count must stay <= capacity)"
    error_id: ERR_CAGE_OVERLAP_CAPACITY
    http_status: 409
    applies_to: "POST /hospitalizations"
  - priority: 44
    category: business_temporal
    check: "Re-vaccination cooldown: a new ACTIVE VaccinationRecord with the same vaccine_code cannot be administered within booster_interval_days/2 of the prior ACTIVE record (half-open: prior.administered_at + cooldown is the earliest valid)"
    error_id: ERR_VACCINE_COOLDOWN
    http_status: 422
    applies_to: "POST /pets/{pet_id}/vaccinations"

  - priority: 50
    category: business_fiscal
    check: "Owner.deposit_balance_cents must be ≥ 50000 (admission hold) at hospitalization creation"
    error_id: ERR_INSUFFICIENT_DEPOSIT
    http_status: 402
    applies_to: "POST /hospitalizations"
  - priority: 51
    category: business_fiscal
    check: "Refund amount + existing refund_amount_cents must be ≤ paid_amount_cents"
    error_id: ERR_REFUND_EXCEEDS_PAID
    http_status: 422
    applies_to: "POST /bills/{id}/refund"

# =============================================================================
# §1.5 API Endpoint Table
# =============================================================================
endpoints:
  # --- Owners
  - method: POST
    path: "/owners"
    description: "Create owner (contact unverified by default)."
    roles: [OwnerService, PlatformAdmin]
    code: 201
    input: [full_name, phone_e164, email]
    output: Owner

  - method: GET
    path: "/owners/{owner_id}"
    description: "Read owner."
    roles: [OwnerService, PlatformAdmin, TriageNurse, Cashier]
    code: 200
    input: []
    output: Owner

  - method: POST
    path: "/owners/{owner_id}/issue-verification"
    description: "Issue a verification code (system-generated, hashed, valid 10 minutes)."
    roles: [OwnerService, PlatformAdmin]
    code: 200
    input: []
    output: Owner

  - method: POST
    path: "/owners/{owner_id}/verify-contact"
    description: "Submit code to flip contact_verified=true."
    roles: [OwnerService, PlatformAdmin]
    code: 200
    input: [code]
    output: Owner

  - method: POST
    path: "/owners/{owner_id}/deposits"
    description: "Top up Owner.deposit_balance_cents."
    roles: [Cashier]
    code: 200
    input: [amount_cents]
    output: Owner
    side_effects: ["Increment deposit_balance_cents"]

  # --- Pets
  - method: POST
    path: "/pets"
    description: "Create pet."
    roles: [OwnerService, PlatformAdmin, TriageNurse]
    code: 201
    input: [owner_id, name, species, birth_date, weight_kg]
    output: Pet

  - method: GET
    path: "/pets/{pet_id}"
    description: "Read pet (includes medical_history)."
    roles: [OwnerService, TriageNurse, DraftingVet, ReviewingVet, Pharmacist, Cashier, PlatformAdmin]
    code: 200
    input: []
    output: Pet

  - method: PATCH
    path: "/pets/{pet_id}"
    description: "Update pet weight_kg or name. Accepts version."
    roles: [TriageNurse, DraftingVet, OwnerService]
    code: 200
    input: ["weight_kg?", "name?", "version?"]
    output: Pet

  - method: DELETE
    path: "/pets/{pet_id}"
    description: "Soft-delete (sets archived=true)."
    roles: [PlatformAdmin]
    code: 200
    input: []
    output: Pet

  - method: GET
    path: "/pets/{pet_id}/visits"
    description: "List the pet's visit history (newest first), with limit/offset."
    roles: [OwnerService, TriageNurse, DraftingVet, PlatformAdmin]
    code: 200
    input: ["limit?", "offset?"]
    output: "Visit[]"

  - method: GET
    path: "/pets/{pet_id}/vaccines/due-list"
    description: "Compute due-vaccine list via calculations.vaccine_due_estimate."
    roles: [OwnerService, TriageNurse, DraftingVet]
    code: 200
    input: []
    output: "VaccineDueItem[]"

  - method: POST
    path: "/pets/{pet_id}/vaccinations"
    description: "Record administered vaccination."
    roles: [DraftingVet, TriageNurse]
    code: 201
    input: [vaccine_code, administered_at, batch_id]
    output: VaccinationRecord
    side_effects: ["Mark prior same-vaccine_code records SUPERSEDED", "Recompute next_due_at"]

  - method: POST
    path: "/vaccine-schedules"
    description: "Create a vaccine-schedule rule."
    roles: [PlatformAdmin]
    code: 201
    input: ["species", "vaccine_code", "age_min_days", "booster_interval_days?", "required?"]
    output: VaccineSchedule

  - method: POST
    path: "/_events/vaccine-batch-recall"
    description: "External recall event. Idempotent on (batch_id, vaccine_code)."
    roles: [PlatformAdmin]
    code: 200
    input: [batch_id, vaccine_code, event_id]
    output: null
    side_effects:
      - "Mark all matching ACTIVE VaccinationRecord rows as RECALLED"
      - "For each affected Pet, recompute vaccine_due_estimate (cascade hop 2 — next_due_at falls back per post_recall variant)"
      - "Emit IM-system reminder via POST /_events/im-emit (cascade hop 3) — see endpoint /_events/im-emit"

  # --- Visits
  - method: POST
    path: "/pets/{pet_id}/visits"
    description: "Create visit (REGISTERED)."
    roles: [TriageNurse, OwnerService]
    code: 201
    input: [symptom_text, severity_score]
    output: Visit

  - method: GET
    path: "/visits/{visit_id}"
    description: "Read visit (includes derived posture flags for status)."
    roles: [TriageNurse, DraftingVet, ReviewingVet, Pharmacist, Cashier, OwnerService, PlatformAdmin]
    code: 200
    input: []
    output: Visit

  - method: POST
    path: "/visits/{visit_id}/triage"
    description: "Triage and route."
    roles: [TriageNurse]
    code: 200
    input: []
    output: Visit
    side_effects: ["Run triage_priority_score and selectors"]

  - method: POST
    path: "/visits/{visit_id}/start-consult"
    description: "Begin consultation."
    roles: [DraftingVet]
    code: 200
    input: []
    output: Visit

  - method: POST
    path: "/visits/{visit_id}/re-triage"
    description: "Re-route (cycle back from IN_CONSULT to TRIAGED)."
    roles: [TriageNurse]
    code: 200
    input: []
    output: Visit

  - method: POST
    path: "/visits/{visit_id}/end-consult"
    description: "Move to CONSULT_DONE."
    roles: [DraftingVet]
    code: 200
    input: []
    output: Visit

  - method: POST
    path: "/visits/{visit_id}/close"
    description: "Close visit; preconditions span Bill and Prescription state."
    roles: [Cashier]
    code: 200
    input: []
    output: Visit

  - method: POST
    path: "/visits/{visit_id}/cancel"
    description: "Cancel before any clinical artifact exists."
    roles: [TriageNurse]
    code: 200
    input: []
    output: Visit

  # --- Treatment records
  - method: POST
    path: "/treatment-records"
    description: "Draft a treatment record under a visit."
    roles: [DraftingVet]
    code: 201
    input: [visit_id, consultation_notes, diagnosis_code, treatment_plan, consent_recorded]
    output: TreatmentRecord

  - method: PATCH
    path: "/treatment-records/{tr_id}"
    description: "Amend FINALIZED record (requires version)."
    roles: [DraftingVet]
    code: 200
    input: ["consultation_notes?", "treatment_plan?", "version"]
    output: TreatmentRecord
    side_effects: ["Append AuditLog AMEND"]

  - method: POST
    path: "/treatment-records/{tr_id}/finalize"
    description: "DRAFT → FINALIZED."
    roles: [DraftingVet]
    code: 200
    input: []
    output: TreatmentRecord
    side_effects: ["Append snapshot to Pet.medical_history; append CONSULT line item to Bill"]

  # --- Lab reports
  - method: POST
    path: "/lab-reports"
    description: "Order tests."
    roles: [DraftingVet]
    code: 201
    input: [visit_id, test_items]
    output: LabReport

  - method: POST
    path: "/lab-reports/{lr_id}/collect-sample"
    description: "ORDERED → SAMPLE_COLLECTED."
    roles: [TriageNurse]
    code: 200
    input: [sample_collected_at]
    output: LabReport

  - method: POST
    path: "/lab-reports/{lr_id}/send-to-lab"
    description: "SAMPLE_COLLECTED → SENT_TO_LAB."
    roles: [TriageNurse]
    code: 200
    input: [external_lab_ref]
    output: LabReport

  - method: POST
    path: "/_events/external-lab-result"
    description: "External lab integration callback. Idempotent on external_lab_ref."
    roles: [PlatformAdmin]
    code: 200
    input: [external_lab_ref, results, event_id]
    output: LabReport

  - method: POST
    path: "/lab-reports/{lr_id}/finalize"
    description: "RESULT_RECEIVED → FINALIZED; abnormal_codes finalized; LAB line_item appended."
    roles: [DraftingVet]
    code: 200
    input: []
    output: LabReport

  - method: GET
    path: "/lab-reports/{lr_id}/history"
    description: "Compare to last FINALIZED report for the same pet."
    roles: [DraftingVet, OwnerService]
    code: 200
    input: []
    output: LabHistoryComparison

  - method: POST
    path: "/lab-reports/{lr_id}/cancel"
    description: "Cancel pre-result lab report."
    roles: [DraftingVet]
    code: 200
    input: []
    output: LabReport

  # --- Drugs
  - method: POST
    path: "/drugs"
    description: "Catalog management."
    roles: [PlatformAdmin]
    code: 201
    input: ["code", "name", "controlled", "dosage_min_mg_per_kg", "dosage_max_mg_per_kg", "interactions?", "stock_units"]
    output: Drug

  - method: PATCH
    path: "/drugs/{drug_id}"
    description: "Adjust stock or interactions (with version)."
    roles: [PlatformAdmin, Pharmacist]
    code: 200
    input: ["stock_units?", "interactions?", "version?"]
    output: Drug

  # --- Prescriptions
  - method: POST
    path: "/prescriptions"
    description: "Draft a prescription."
    roles: [DraftingVet]
    code: 201
    input: [visit_id, items]
    output: Prescription

  - method: POST
    path: "/prescriptions/{rx_id}/submit"
    description: "DRAFT → PENDING_REVIEW. Recomputes interaction_risk."
    roles: [DraftingVet]
    code: 200
    input: []
    output: Prescription

  - method: POST
    path: "/prescriptions/{rx_id}/approve"
    description: "PENDING_REVIEW → APPROVED."
    roles: [ReviewingVet]
    code: 200
    input: ["override_acknowledged?"]
    output: Prescription

  - method: POST
    path: "/prescriptions/{rx_id}/reject"
    description: "PENDING_REVIEW → REJECTED."
    roles: [ReviewingVet]
    code: 200
    input: [rejection_reason]
    output: Prescription

  - method: POST
    path: "/prescriptions/{rx_id}/redraft"
    description: "REJECTED → DRAFT (cyclic)."
    roles: [DraftingVet]
    code: 200
    input: []
    output: Prescription

  - method: POST
    path: "/prescriptions/{rx_id}/dispense"
    description: "APPROVED → DISPENSED. Cascades to Bill."
    roles: [Pharmacist]
    code: 200
    input: []
    output: Prescription

  - method: POST
    path: "/prescriptions/{rx_id}/cancel"
    description: "Cancel before approval."
    roles: [DraftingVet]
    code: 200
    input: []
    output: Prescription

  # --- Cages and hospitalization
  - method: POST
    path: "/cages"
    description: "Create cage."
    roles: [PlatformAdmin]
    code: 201
    input: [cage_code, ward_code, capacity]
    output: Cage

  - method: POST
    path: "/hospitalizations"
    description: "Admit to cage; deducts admission hold."
    roles: [DraftingVet]
    code: 201
    input: [visit_id, cage_id]
    output: Hospitalization

  - method: POST
    path: "/hospitalizations/{h_id}/begin-care"
    description: "ADMITTED → IN_CARE."
    roles: [DraftingVet]
    code: 200
    input: []
    output: Hospitalization

  - method: POST
    path: "/hospitalizations/{h_id}/care-log"
    description: "Append a daily-care entry."
    roles: [DraftingVet]
    code: 200
    input: [note, treatment_executed]
    output: Hospitalization

  - method: POST
    path: "/hospitalizations/{h_id}/request-discharge"
    description: "IN_CARE → DISCHARGE_PENDING (gated on prescriptions)."
    roles: [DraftingVet]
    code: 200
    input: []
    output: Hospitalization

  - method: POST
    path: "/hospitalizations/{h_id}/discharge"
    description: "DISCHARGE_PENDING → DISCHARGED. Cascades to Cage and Bill."
    roles: [Cashier]
    code: 200
    input: []
    output: Hospitalization

  - method: POST
    path: "/hospitalizations/{h_id}/cancel"
    description: "Pre-care cancel; restores cage and admission hold."
    roles: [DraftingVet]
    code: 200
    input: []
    output: Hospitalization

  # --- Bills
  - method: POST
    path: "/bills"
    description: "Create one Bill per Visit (DRAFT)."
    roles: [Cashier]
    code: 201
    input: ["visit_id", "package_code?", "insurance_estimate_cents?"]
    output: Bill

  - method: POST
    path: "/bills/{bill_id}/recompute"
    description: "Recompute provisional_total_cents (idempotent)."
    roles: [Cashier]
    code: 200
    input: []
    output: Bill

  - method: POST
    path: "/bills/{bill_id}/issue"
    description: "DRAFT → ISSUED. Locks deposit_applied_cents."
    roles: [Cashier]
    code: 200
    input: []
    output: Bill

  - method: POST
    path: "/_events/payment"
    description: "External payment system event. Idempotent on event_id."
    roles: [PlatformAdmin]
    code: 200
    input: [bill_id, amount_cents, event_id]
    output: Bill

  - method: POST
    path: "/bills/{bill_id}/issue-invoice"
    description: "PAID → INVOICED."
    roles: [Cashier]
    code: 200
    input: []
    output: Bill

  - method: POST
    path: "/bills/{bill_id}/refund"
    description: "PAID/INVOICED → REFUND_PENDING."
    roles: [Cashier]
    code: 200
    input: [amount_cents, reason]
    output: Bill

  - method: POST
    path: "/_events/refund-confirm"
    description: "External event finalizing a refund. Idempotent on event_id."
    roles: [PlatformAdmin]
    code: 200
    input: [bill_id, amount_cents, event_id]
    output: Bill

  - method: POST
    path: "/bills/{bill_id}/cancel"
    description: "Cancel a DRAFT bill (only if Visit is CANCELLED)."
    roles: [Cashier]
    code: 200
    input: []
    output: Bill

  # --- Audit / IM bridge / clock
  - method: GET
    path: "/audit-logs"
    description: "Query audit trail; filters subject_type, subject_id, action."
    roles: [PlatformAdmin]
    code: 200
    input: ["subject_type?", "subject_id?", "action?", "limit?", "offset?"]
    output: "AuditLog[]"

  - method: POST
    path: "/_events/im-emit"
    description: "Outbound IM bridge (test stub records emission for assertion)."
    roles: [PlatformAdmin]
    code: 200
    input: [recipient_owner_id, kind, payload]
    output: null

  - method: POST
    path: "/_clock/advance"
    description: "Advance test clock by N seconds; required to drive vaccine due dates and audit timestamps deterministically."
    roles: [PlatformAdmin]
    code: 200
    input: [seconds]
    output: null

# =============================================================================
# §1.6 Error Code Catalog
# =============================================================================
errors:
  - id: ERR_AUTH_MISSING
    http: 401
    condition: "X-User-Role or X-User-ID header missing/blank."
  - id: ERR_AUTH_INVALID_ROLE
    http: 401
    condition: "X-User-Role not in the recognized role set."
  - id: ERR_FORBIDDEN
    http: 403
    condition: "Role not permitted for this endpoint."
  - id: ERR_NOT_FOUND
    http: 404
    condition: "Path-parameter id does not resolve."
  - id: ERR_REFERENCE_NOT_FOUND
    http: 422
    condition: "FK in body does not resolve."
  - id: ERR_INVALID_STATE
    http: 409
    condition: "Target entity not in a state that admits the requested transition."
  - id: ERR_STALE_VERSION
    http: 409
    condition: "Request body's version does not match current entity.version."
  - id: ERR_PET_ARCHIVED
    http: 409
    condition: "Pet.archived=true blocks new visits."
  - id: ERR_OWNER_NOT_VERIFIED
    http: 409
    condition: "Owner.contact_verified must be true."
  - id: ERR_SEGREGATION_OF_DUTIES
    http: 403
    condition: "Reviewing vet equals drafting vet on a controlled-drug prescription."
  - id: ERR_DOSAGE_OUT_OF_RANGE
    http: 422
    condition: "Item.dose_mg_per_kg outside Drug.dosage_min/max."
  - id: ERR_SEVERE_INTERACTION
    http: 422
    condition: "Drug-interaction risk SEVERE without explicit override_acknowledged."
  - id: ERR_PENDING_PRESCRIPTIONS
    http: 409
    condition: "Open prescriptions block discharge or visit close."
  - id: ERR_LAB_ITEMS_INVALID
    http: 422
    condition: "Empty test_items, duplicated codes, or ref_low ≥ ref_high."
  - id: ERR_CAGE_CAPACITY_EXCEEDED
    http: 409
    condition: "Cage.occupancy_count == capacity at admission."
  - id: ERR_CAGE_OVERLAP_CAPACITY
    http: 409
    condition: "Aggregate active occupants exceed capacity over an interval."
  - id: ERR_INSUFFICIENT_DEPOSIT
    http: 402
    condition: "Owner.deposit_balance_cents < 50000 (admission hold)."
  - id: ERR_VACCINE_AGE_MIN
    http: 422
    condition: "VaccinationRecord.administered_at earlier than schedule.age_min_days."
  - id: ERR_VACCINE_COOLDOWN
    http: 422
    condition: "Re-vaccination earlier than cooldown window."
  - id: ERR_BATCH_RECALLED
    http: 422
    condition: "Attempt to administer vaccine using a recalled batch."
  - id: ERR_REFUND_EXCEEDS_PAID
    http: 422
    condition: "Cumulative refund would exceed paid amount."
  - id: ERR_DUPLICATE_EVENT
    http: 409
    condition: "External event already processed for this event_id (or 200 idempotent no-op for lab callbacks)."
  - id: ERR_PRESCRIPTION_ALREADY_REVIEWED
    http: 409
    condition: "Concurrent approve race — prescription already moved out of PENDING_REVIEW."
  - id: ERR_NO_VET_AVAILABLE
    http: 409
    condition: "Vet selector returns empty candidate set during triage routing."
  - id: ERR_VALIDATION_FAILED
    http: 422
    condition: "Generic schema/format error (regex, length, range) for request body fields."

# =============================================================================
# §1.7 RBAC Matrix
# =============================================================================
roles:
  - name: TriageNurse
    description: "Front-desk staff who register pets, run triage, and collect samples."
    identity: "opaque"
    exclusive_operations:
      - "POST /visits/{id}/triage"
      - "POST /visits/{id}/re-triage"
      - "POST /visits/{id}/cancel"
      - "POST /lab-reports/{id}/collect-sample"
      - "POST /lab-reports/{id}/send-to-lab"
    shared_operations:
      - "POST /pets"
      - "POST /pets/{pet_id}/vaccinations (with DraftingVet)"
      - "POST /pets/{pet_id}/visits (with OwnerService)"

  - name: DraftingVet
    description: "Veterinarian who diagnoses, drafts treatment records, drafts prescriptions, manages lab orders and hospitalization."
    identity: "opaque"
    exclusive_operations:
      - "POST /visits/{id}/start-consult"
      - "POST /visits/{id}/end-consult"
      - "POST /treatment-records"
      - "POST /treatment-records/{id}/finalize"
      - "PATCH /treatment-records/{id}"
      - "POST /lab-reports"
      - "POST /lab-reports/{id}/finalize"
      - "POST /lab-reports/{id}/cancel"
      - "POST /prescriptions"
      - "POST /prescriptions/{id}/submit"
      - "POST /prescriptions/{id}/redraft"
      - "POST /prescriptions/{id}/cancel"
      - "POST /hospitalizations"
      - "POST /hospitalizations/{id}/begin-care"
      - "POST /hospitalizations/{id}/care-log"
      - "POST /hospitalizations/{id}/request-discharge"
      - "POST /hospitalizations/{id}/cancel"
    shared_operations: []

  - name: ReviewingVet
    description: "Senior vet who approves/rejects prescriptions; required to differ from drafting vet for controlled drugs."
    identity: "opaque"
    exclusive_operations:
      - "POST /prescriptions/{id}/approve"
      - "POST /prescriptions/{id}/reject"
    shared_operations: []

  - name: Pharmacist
    description: "Dispenses approved prescriptions and adjusts drug stock."
    identity: "opaque"
    exclusive_operations:
      - "POST /prescriptions/{id}/dispense"
    shared_operations:
      - "PATCH /drugs/{id} (with PlatformAdmin)"

  - name: Cashier
    description: "Handles bills, deposits, payments, refunds, invoices, visit closure, hospitalization discharge."
    identity: "opaque"
    exclusive_operations:
      - "POST /owners/{id}/deposits"
      - "POST /bills"
      - "POST /bills/{id}/recompute"
      - "POST /bills/{id}/issue"
      - "POST /bills/{id}/issue-invoice"
      - "POST /bills/{id}/refund"
      - "POST /bills/{id}/cancel"
      - "POST /visits/{id}/close"
      - "POST /hospitalizations/{id}/discharge"
    shared_operations: []

  - name: OwnerService
    description: "Customer-service operator who manages owner records, contact verification, and reads visit history on behalf of owners."
    identity: "opaque"
    exclusive_operations:
      - "POST /owners"
      - "POST /owners/{id}/issue-verification"
      - "POST /owners/{id}/verify-contact"
    shared_operations:
      - "GET /pets/{id}/visits"
      - "GET /lab-reports/{id}/history"

  - name: PlatformAdmin
    description: "System operator: drug catalog, vaccine schedules, cages, audit log queries, external event ingestion, clock."
    identity: "opaque"
    exclusive_operations:
      - "POST /drugs"
      - "POST /vaccine-schedules"
      - "POST /cages"
      - "GET /audit-logs"
      - "DELETE /pets/{id}"
      - "POST /_events/payment"
