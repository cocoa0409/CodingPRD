              as: Underwriter
              captures: { oc_id: $.data.id }
            - call: "POST /disability/policyholders"
              payload: { insurer_id: "${ins_id}", full_name: "PH PV1", pre_disability_monthly_income_cents: 1000000 }
              as: Underwriter
              captures: { ph_id: $.data.id }
            - call: "POST /disability/policies"
              payload: { insurer_id: "${ins_id}", policyholder_id: "${ph_id}", occupation_class_id: "${oc_id}", monthly_benefit_cents: 500000, benefit_period_months: 1, elimination_period_days: 90, occupation_definition: "ANY_OCC", cola_rider: false, cola_annual_rate: 0 }
              as: Underwriter
              captures: { p_id: $.data.id }
            - call: "POST /disability/policies/${p_id}/activate"
              payload: {}
              as: Underwriter
            - call: "POST /disability/claims"
              payload: { insurer_id: "${ins_id}", policy_id: "${p_id}", disability_onset_month: 0, claimed_disability_type: "TOTAL" }
              as: Policyholder
              as_user_id: "${ph_id}"
              captures: { c_id: $.data.id }
            - call: "POST /disability/claims/${c_id}/submit"
              payload: {}
              as: Policyholder
              as_user_id: "${ph_id}"
