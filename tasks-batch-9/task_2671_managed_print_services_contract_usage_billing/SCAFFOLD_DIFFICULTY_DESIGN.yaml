            - "QuarterlyReview.${qr1}.authored_by_user_id == am-1"
            - "Device.${d1}.right_sizing_action == RETAIN"
            - "Device.${d2}.right_sizing_action == DOWNGRADE"
            - "Device.${d1}.refresh_due == false"
            - "BillingStatement.${st_final}.total_cents == 31125"

  - rule_id: combinatorial_formula
    instances:
      - name: sla_credit_nested_min_max_with_parts_hold_excusal_and_critical_doubling
        grounds:
          - calculations.sla_response_credit
          - calculations.service_labor_charge
          - state_machines.ServiceTicket.PARTS_HOLD_to_ONSITE
          - state_machines.ServiceTicket.ONSITE_to_RESOLVED
          - entities.ServiceTicket.fields.parts_hold_hours
        distinguishing_aspect: |
          Mode (a): four interacting inputs (hours_late 25, parts_hold_hours 20, severity CRITICAL,
          monthly_service_fee_cents 48000) run through two nested min/max layers plus a severity branch —
          excused_hours = min(25, max(0, 20-8)) = 12, step = ceil(13/4) = 4, factor = min(0.50, 0.05*4*2)
          = 0.40 — landing sla_credit_cents on 19200 and labor_cents on 38000 (ceil(3.5)*9500).
        test_recipe:
          setup:
            - "ACTIVE contract, scope BASIC, monthly_service_fee_cents 48000, response_sla_hours_critical 4, labor_rate_cents_per_hour 9500"
            - "one ACTIVE device at a CONFIGURED site in region NE-01; technician T1 L3 in NE-01"
            - "CRITICAL ticket opened 2026-08-05T00:00:00Z with part_sku FUSER-9, respond_by 2026-08-05T04:00:00Z"
            - "ticket dispatched, then PARTS_HOLD from 01:00 because no SparePartStock row exists for FUSER-9, then stock arrives and the technician goes ONSITE at 21:00 (20 hold hours)"
            - "resolution happens at 2026-08-06T05:00:00Z with 3.5 labor hours"
          setup_api_calls:
            - call: "POST /service-contracts"
              payload: { customer_name: "Cedar Legal", term_months: 36, included_service_scope: "BASIC", minimum_mono_pages_per_period: 0, minimum_color_pages_per_period: 0, monthly_service_fee_cents: 48000, response_sla_hours_critical: 4, response_sla_hours_standard: 24, labor_rate_cents_per_hour: 9500, early_termination_fee_cents: 0 }
              as: AccountManager
              captures: { c1: $.data.id }
            - call: "POST /service-contracts/${c1}/cost-tiers"
              payload: { page_class: "MONO", tier_index: 1, from_page: 1, rate_micro_dollars_per_page: 9375 }
              as: AccountManager
            - call: "POST /technicians"
              payload: { full_name: "Tess Rowan", home_region: "NE-01", skill_level: "L3", travel_buffer_minutes: 30 }
              as: AccountManager
              captures: { t1: $.data.id }
            - call: "POST /sites"
              payload: { contract_id: "${c1}", name: "HQ Floor 3", address_region: "NE-01", toner_unit_cap: 4, network_vlan_tag: 2001 }
              as: AccountManager
              captures: { s1: $.data.id }
            - call: "POST /devices"
              payload: { contract_id: "${c1}", site_id: "${s1}", asset_tag: "MPS-0001", model_code: "XR-M4200", rated_monthly_duty_cycle: 20000, assessed_monthly_mono_pages: 9000, assessed_monthly_color_pages: 0, baseline_cost_micro_dollars_per_page: 21000, baseline_overhead_cents_per_month: 4500, color_capable: false }
              as: FleetOpsController
              captures: { d1: $.data.id }
            - call: "POST /service-contracts/${c1}/activate"
              payload: {}
              as: AccountManager
            - call: "POST /sites/${s1}/secure-release-config"
              payload: { release_method: "PIN", probe_result: "PASS", network_vlan_tag: 2001 }
              as: CustomerAdmin
              as_user_id: "${s1}"
            - call: "POST /devices/${d1}/place"
              payload: {}
              as: FieldTechnician
              as_user_id: "${t1}"
            - call: "POST /devices/${d1}/network-integration"
              payload: {}
              as: FieldTechnician
              as_user_id: "${t1}"
            - call: "POST /devices/${d1}/activate"
              payload: {}
              as: FleetOpsController
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-08-05T00:00:00Z" }
              as: FleetOpsController
            - call: "POST /service-tickets"
              payload: { device_id: "${d1}", severity: "CRITICAL", symptom_code: "FUSER-JAM", part_sku: "FUSER-9" }
              as: CustomerAdmin
              as_user_id: "${s1}"
              captures: { tk1: $.data.id }
            - call: "POST /service-tickets/${tk1}/dispatch"
              payload: { technician_id: "${t1}", window_start: "2026-08-05T01:00:00Z", window_end: "2026-08-05T03:00:00Z" }
              as: FleetOpsController
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-08-05T01:00:00Z" }
              as: FleetOpsController
            - call: "POST /service-tickets/${tk1}/parts-hold"
              payload: {}
              as: FieldTechnician
              as_user_id: "${t1}"
            - call: "POST /sites/${s1}/spare-part-stocks"
              payload: { part_sku: "FUSER-9", qty_delta: 1 }
              as: FleetOpsController
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-08-05T21:00:00Z" }
              as: FleetOpsController
            - call: "POST /service-tickets/${tk1}/arrive-onsite"
              payload: {}
              as: FieldTechnician
              as_user_id: "${t1}"
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-08-06T05:00:00Z" }
              as: FleetOpsController
          trigger:
            - call: "POST /service-tickets/${tk1}/resolve"
              payload: { labor_hours: 3.5 }
              as: FieldTechnician
              as_user_id: "${t1}"
          assert:
            - "ServiceTicket.${tk1}.status == RESOLVED"
            - "ServiceTicket.${tk1}.respond_by == 2026-08-05T04:00:00Z"
            - "ServiceTicket.${tk1}.responded_at == 2026-08-06T05:00:00Z"
            - "ServiceTicket.${tk1}.hours_late == 25"
            - "ServiceTicket.${tk1}.parts_hold_hours == 20"
            - "ServiceTicket.${tk1}.sla_credit_cents == 19200"
            - "ServiceTicket.${tk1}.labor_cents == 38000"
            - "Device.${d1}.lifecycle_state == ACTIVE"
            - "Technician.${t1}.open_dispatch_count == 0"
            - "GET /sites/${s1}/spare-part-stocks returns one row with part_sku FUSER-9 and on_hand_qty 0"

      - name: settlement_sanitization_fee_discount_keyed_on_gross_not_net
        grounds:
          - calculations.settlement_amount
          - state_machines.RemovalOrder.SANITIZED_to_SETTLED
          - state_machines.ServiceContract.TERMINATING_to_CLOSED
          - entities.RemovalOrder.fields.gross_settlement_cents
          - entities.RemovalOrder.fields.sanitization_fee_cents
        distinguishing_aspect: |
          Mode (c): the circular-looking dependency net = gross + fee where the fee's volume discount is
          keyed on gross. gross lands at 495000 — just under SANITIZATION_DISCOUNT_THRESHOLD_CENTS
