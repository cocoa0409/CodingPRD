              captures: { v_id: $.data.id }
            - call: "POST /installations"
              payload: { venue_id: "${v_id}", rig_label: "RIG-A", modality: "UWB_ANCHOR" }
              as: LeagueDataOps
              as_user_id: "ops-01"
              captures: { i_a: $.data.id }
            - call: "POST /installations"
              payload: { venue_id: "${v_id}", rig_label: "RIG-B", modality: "OPTICAL_CAMERA" }
              as: LeagueDataOps
              as_user_id: "ops-01"
              captures: { i_b: $.data.id }
            - call: "POST /installations/${i_a}/calibration-runs"
              payload: { axis_rms_x_mm: 90.0, axis_rms_y_mm: 90.0, axis_rms_z_mm: 90.0, sample_count: 6000, reference_point_count: 16 }
              as: CalibrationEngineer
              as_user_id: "eng-01"
            - call: "POST /installations/${i_a}/certify"
              as: LeagueDataOps
              as_user_id: "ops-01"
