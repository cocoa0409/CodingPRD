  # ===========================================================================
  - section: errors
    instances:
      - name: err_agreement_closed_is_triggerable_on_award_creation
        claim_type: error_triggerable
        grounds:
          - errors.ERR_AGREEMENT_CLOSED
          - validations[priority=12]
        excluded_because:
          difficulty_instance: yellow_ribbon_award_requires_active_agreement_row
          rationale: "That instance closes the agreement and then requests an award on it, asserting the 409 ERR_AGREEMENT_CLOSED and that pool_remaining_cents and participant_count are untouched; a second standalone trigger would duplicate it exactly."

      - name: err_certification_not_certified_is_triggerable_on_award_creation
        claim_type: error_triggerable
        grounds:
          - errors.ERR_CERTIFICATION_NOT_CERTIFIED
          - validations[priority=12]
        excluded_because:
          difficulty_instance: state_gate_beats_pool_exhaustion_on_award_creation
          rationale: "That instance requests an award for a SUBMITTED certification against an exhausted pool and asserts ERR_CERTIFICATION_NOT_CERTIFIED, which is exactly the trigger this corner would repeat."

      - name: err_yr_pool_exhausted_is_triggerable_on_award_creation
        claim_type: error_triggerable
        grounds:
          - errors.ERR_YR_POOL_EXHAUSTED
          - validations[priority=38]
        excluded_because:
          difficulty_instance: state_gate_beats_pool_exhaustion_on_award_creation
          rationale: "The same instance drains the pool to zero and then requests an award for a properly CERTIFIED certification, asserting ERR_YR_POOL_EXHAUSTED as the second half of its priority-pair contrast."

      - name: err_program_not_approved_is_triggerable_at_certify
        claim_type: error_triggerable
        grounds:
          - errors.ERR_PROGRAM_NOT_APPROVED
          - validations[priority=14]
        excluded_because:
          difficulty_instance: program_approval_safety_beats_certification_deadline
          rationale: "That instance certifies against a program left in DRAFT and asserts ERR_PROGRAM_NOT_APPROVED, including that the entitlement ledger is untouched."

      - name: err_certification_deadline_passed_is_triggerable_at_certify
        claim_type: error_triggerable
        grounds:
          - errors.ERR_CERTIFICATION_DEADLINE_PASSED
          - validations[priority=18]
        excluded_because:
          difficulty_instance: program_approval_safety_beats_certification_deadline
          rationale: "The same instance approves the program and re-certifies past term.certification_deadline, asserting ERR_CERTIFICATION_DEADLINE_PASSED as the losing side of the priority pair."

      - name: err_overlapping_enrollment_period_is_triggerable_at_submit
        claim_type: error_triggerable
        grounds:
          - errors.ERR_OVERLAPPING_ENROLLMENT_PERIOD
          - validations[priority=22]
        excluded_because:
          difficulty_instance: student_enrollment_periods_are_closed_intervals_touching_endpoints_collide
          rationale: "That boundary instance submits a second certification whose start equals the first period's end date and asserts the 409, plus the adjacent day-after case that legally succeeds."

      - name: err_catalog_window_overlap_is_triggerable_on_catalog_creation
        claim_type: error_triggerable
        grounds:
          - errors.ERR_CATALOG_WINDOW_OVERLAP
          - validations[priority=23]
        excluded_because:
          difficulty_instance: catalog_effective_windows_are_half_open_touching_endpoints_are_legal
          rationale: "That boundary instance contrasts a legal touching window against a one-day overlap that raises ERR_CATALOG_WINDOW_OVERLAP, covering both sides of the half-open comparison."

      - name: err_agreement_scope_mismatch_is_triggerable_on_award_creation
        claim_type: error_triggerable
        grounds:
          - errors.ERR_AGREEMENT_SCOPE_MISMATCH
          - validations[priority=25]
        excluded_because:
          difficulty_instance: agreement_scope_referential_beats_duplicate_award_constraint
          rationale: "That instance requests an award from an agreement whose degree_level and academic_year do not match the certification's program and term, asserting ERR_AGREEMENT_SCOPE_MISMATCH ahead of the duplicate-award rule."

      - name: err_award_already_exists_is_triggerable_on_award_creation
        claim_type: error_triggerable
        grounds:
          - errors.ERR_AWARD_ALREADY_EXISTS
          - validations[priority=34]
        excluded_because:
          difficulty_instance: agreement_scope_referential_beats_duplicate_award_constraint
          rationale: "The same instance then requests a second award for a certification that already holds a PROVISIONAL award and asserts ERR_AWARD_ALREADY_EXISTS."

