            - { call: "POST /avionics/test-events", payload: { work_order_id: "${wo_id}", test_kind: "FLIGHT", scheduled_start: "2026-08-06T14:00:00Z", scheduled_end: "2026-08-06T15:30:00Z" }, as: ShopManager, captures: { f_id: "$.data.id" } }
            - { call: "POST /avionics/test-events/${f_id}/record-result", payload: { result: "PASS" }, as: Inspector, as_user_id: "insp-1" }
            - { call: "POST /avionics/regulatory-packages", payload: { work_order_id: "${wo_id}", approval_path: "STC", stc_number: "STC-SA8888" }, as: ShopManager, captures: { pkg_id: "$.data.id" } }
            - { call: "POST /avionics/regulatory-packages/${pkg_id}/submit", payload: {}, as: ShopManager }
            - { call: "POST /avionics/regulatory-packages/${pkg_id}/record-decision", payload: { decision: "APPROVED" }, as: Inspector, as_user_id: "insp-1" }
