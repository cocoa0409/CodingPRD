        distinguishing_aspect: "Ownership is scoped by the entity-backed identity rather than by the role: carrier B's rep holds the same CarrierRep role yet submitting carrier A's application returns ERR_NOT_CARRIER_OWNER at 403, and it is 403 rather than 404 — the application is visible to the reader, just not writable."
