# =============================================================================
# §1.9 Scaffold Corner Design - corporate-renewable-ppa-origination
#
# Breadth probe over references/claim-extraction-guide.md, walked section by
# section against this scaffold's own §1.1-§1.7 surface. §1.8 is the depth
# probe (9 rules x 2 instances); everything here is the enumerative remainder.
#
# Conventions shared with SCAFFOLD_DIFFICULTY_DESIGN.yaml:
#   - the logical clock is left at its 2026-08-01T00:00:00Z startup default
#     unless an instance explicitly calls POST /_clock/set_current_utc
#   - segregation-of-duties actors: u_orig_1 creates, u_credit_1 decides credit,
#     u_committee_1 executes/reviews, u_analyst_1 settles, u_registry_1 handles
#     the registry, and ${buyer_id} acts as the OfftakerRep for its own deals
#   - every OCC write is preceded by a fresh GET that captures the parent version
#   - reusable chains referenced in prose:
#       CHAIN A = hub + node + QUALIFIED buyer NW + PRE_DEVELOPMENT project + DRAFT deal
#       CHAIN B = CHAIN A + round + confirmed allocation + ACCEPT + credit APPROVED
#                 (deal at TERMS_AGREED)
#       CHAIN C = CHAIN B on an OPERATIONAL project and a registry-holding buyer,
#                 executed into EFFECTIVE with an empty CP template
# =============================================================================

scaffold_corner_design:

  # ===========================================================================
  # SECTION 1 - entities (§1.1) + entity_topology graph
  # ===========================================================================
  - section: entities
    instances:

      - name: pricing_node_created_with_declared_fields_and_no_version
        claim_type: creation
        grounds:
          - entities.PricingNode
          - endpoints.POST_/ppa/pricing-nodes
          - endpoints.GET_/ppa/pricing-nodes
        distinguishing_aspect: |
          PricingNode is the only entity declared with common_fields false, so the
          create response must carry id, created_at and updated_at plus exactly the
          three declared inputs and NO version field - and there is no PATCH, PUT or
          DELETE for it anywhere in §1.5. A response that ships version: 1 out of
          habit fails this.
        test_recipe:
          setup:
            - "Empty database; no pricing node exists yet."
          setup_api_calls: []
          trigger:
            - call: "POST /ppa/pricing-nodes"
              payload: { name: "SP15 EZ GEN HUB", iso: "CAISO", settlement_point_type: "HUB" }
              as: Originator
              as_user_id: "u_orig_1"
              captures: { node_id: $.data.id }
          assert:
            - "the response status is 201 and the envelope carries meta.api_request_id, meta.api_request_timestamp and response_type object"
            - "data.name == SP15 EZ GEN HUB, data.iso == CAISO and data.settlement_point_type == HUB"
            - "data.id, data.created_at and data.updated_at are present and non-null"
            - "data has NO version key at all, because PricingNode is declared common_fields false"
            - "GET /ppa/pricing-nodes/${node_id} returns the identical three declared fields, so the row was persisted rather than echoed"
            - "§1.5 exposes no PATCH, PUT or DELETE on /ppa/pricing-nodes/{id}, so the entity is immutable once created"

      - name: offtaker_get_returns_stored_inputs_and_computed_scores
        claim_type: retrieval
        grounds:
          - entities.Offtaker
          - endpoints.POST_/ppa/offtakers
          - calculations.offtaker_credit_score
          - calculations.offtaker_sustainability_score
          - calculations.unsecured_credit_limit
        distinguishing_aspect: |
          A read-back check that separates persisted inputs from the five computed
          fields: the GET must return the same credit_score, credit_tier,
          sustainability_score and unsecured_credit_limit_usd the POST returned,
          without re-deriving them differently, and with qualification_status still
          DRAFT because a create is not a submission.
        test_recipe:
          setup:
            - "Buyer NW (A / SP / net_debt_to_ebitda 2.5 / CDP_AND_TCFD / SBT true / RE100 true / scope2_target_year 2030 / EBITDA 60000000.00) is created and never submitted."
          setup_api_calls:
            - call: "POST /ppa/offtakers"
              payload: { legal_name: "Northwind Retail Inc", credit_rating: "A", rating_agency: "SP", reported_ebitda_usd: 60000000.00, net_debt_to_ebitda: 2.5, disclosure_framework: "CDP_AND_TCFD", has_science_based_target: true, re100_member: true, scope2_target_year: 2030, registry_account_id: "WREGIS-ACC-00417" }
              as: Originator
              as_user_id: "u_orig_1"
              captures: { buyer_id: $.data.id, buyer_version: $.data.version }
          trigger:
            - call: "GET /ppa/offtakers/${buyer_id}"
              as: CreditOfficer
              as_user_id: "u_credit_1"
          assert:
            - "the response status is 200 with response_type object"
            - "data.legal_name == Northwind Retail Inc, data.credit_rating == A, data.rating_agency == SP, data.net_debt_to_ebitda == 2.5 and data.registry_account_id == WREGIS-ACC-00417"
            - "data.credit_score == 83.70 (0.55*84 + 0.30*75 + 0.15*100) and data.credit_score_variant == STANDALONE"
            - "data.credit_tier == PRIME because 83.70 >= TIER_PRIME_MIN 80.00"
            - "data.sustainability_score == 100.00 (40 SBT + 30 RE100 + 20 near-term + 10 disclosing)"
            - "data.unsecured_credit_limit_usd == 3000000.00 = min(TIER_CAP_USD PRIME 25000000.00, round(60000000.00 * 0.05, 2))"
            - "data.qualification_status == DRAFT and data.decision_by_user_id is null - creating a buyer is not submitting it"
            - "data.version == ${buyer_version}, unchanged by a read"

      - name: offtaker_create_applies_declared_defaults_for_omitted_optionals
        claim_type: defaults
        grounds:
          - entities.Offtaker
          - endpoints.POST_/ppa/offtakers
          - calculations.offtaker_sustainability_score
        distinguishing_aspect: |
          Only the six required inputs are sent. Every optional field must fall back
          to its declared default - has_science_based_target false, re100_member
          false, conditions the empty array, claimed_attributes_mwh 0,
          qualification_status DRAFT - and the sustainability score must therefore be
          exactly 0.00, which is only reachable when all four components are absent
          AND disclosure_framework is NONE. Treating a missing boolean as true, or a
          missing scope2_target_year as "no deadline therefore fine", both break.
        test_recipe:
          setup:
            - "No offtaker exists yet; the create sends only legal_name, credit_rating, rating_agency, reported_ebitda_usd, net_debt_to_ebitda and disclosure_framework."
          setup_api_calls: []
          trigger:
            - call: "POST /ppa/offtakers"
              payload: { legal_name: "Bare Minimum Industrials LLC", credit_rating: "BBB", rating_agency: "FITCH", reported_ebitda_usd: 20000000.00, net_debt_to_ebitda: 4.0, disclosure_framework: "NONE" }
              as: Originator
              as_user_id: "u_orig_1"
              captures: { bare_id: $.data.id }
          assert:
            - "the response status is 201"
            - "data.has_science_based_target == false and data.re100_member == false, from their declared defaults"
            - "data.scope2_target_year, data.registry_account_id and data.parent_guarantor_offtaker_id are all null"
            - "data.conditions == [] and data.claimed_attributes_mwh == 0"
            - "data.qualification_status == DRAFT, data.watchlist_since is null and data.decision_by_user_id is null"
            - "data.created_by_user_id == u_orig_1, taken from the X-User-ID header"
            - "data.credit_score == 62.10 = 0.55*72 (BBB) + 0.30*60 (100 - 10*4.0) + 0.15*30 (NONE)"
            - "data.credit_tier == STANDARD and data.unsecured_credit_limit_usd == 400000.00 = min(10000000.00, round(20000000.00 * 0.02, 2))"
            - "data.sustainability_score == 0.00 - no SBT, no RE100, no scope2 target year and disclosure NONE means not one of the four components scores"
            - "data.credit_score_variant == STANDALONE because parent_guarantor_offtaker_id defaulted to null"

      - name: offtaker_create_computed_scores_extra_field_input_ignored
        claim_type: computed_fields
        grounds:
          - entities.Offtaker
          - calculations.offtaker_credit_score
          - calculations.offtaker_credit_tier
          - endpoints.POST_/ppa/offtakers
        distinguishing_aspect: |
          The request smuggles credit_score 99.99, credit_tier PRIME,
          sustainability_score 100.00 and unsecured_credit_limit_usd 25000000.00 -
          all four declared source computed. They must be silently ignored (not
          rejected, not honoured) and replaced by the derived values, which here are
          deliberately far lower. An implementation that persists whatever the client
          sends would report a PRIME buyer with a 25 million dollar unsecured line.
        test_recipe:
          setup:
            - "No offtaker exists yet; the create carries four extra keys that shadow computed fields."
          setup_api_calls: []
          trigger:
            - call: "POST /ppa/offtakers"
              payload: { legal_name: "Wishful Thinking Corp", credit_rating: "BBB", rating_agency: "FITCH", reported_ebitda_usd: 20000000.00, net_debt_to_ebitda: 4.0, disclosure_framework: "NONE", credit_score: 99.99, credit_tier: "PRIME", sustainability_score: 100.00, unsecured_credit_limit_usd: 25000000.00 }
              as: Originator
              as_user_id: "u_orig_1"
              captures: { wish_id: $.data.id }
          assert:
            - "the response status is 201 - unknown and computed-field keys are ignored, not a 400"
            - "data.credit_score == 62.10, not 99.99"
            - "data.credit_tier == STANDARD, not PRIME"
            - "data.sustainability_score == 0.00, not 100.00"
            - "data.unsecured_credit_limit_usd == 400000.00, not 25000000.00"
            - "GET /ppa/offtakers/${wish_id} returns the same four derived values, so nothing client-supplied was persisted"

      - name: deal_created_by_user_id_from_header_input_ignored
        claim_type: system_fields
        grounds:
          - entities.Deal
          - endpoints.POST_/ppa/deals
          - validations.priority_10_ERR_SEGREGATION_OF_DUTIES
        distinguishing_aspect: |
          created_by_user_id is source system and is the anchor of the segregation of
          duties rule: the credit decision later compares X-User-ID against it. The
          create request supplies created_by_user_id u_ghost_1 and status EXECUTED;
          both must be ignored, the header must win, and the deal must start at DRAFT
          / NOT_SUBMITTED. If a client could stamp created_by_user_id, it could
          launder its own credit approval past priority 10.
        test_recipe:
          setup:
            - "CHAIN A up to the project: hub node, NODE node, QUALIFIED buyer NW, PRE_DEVELOPMENT project KJ1 (SOLAR, 100.000 MW)."
          setup_api_calls:
            - call: "POST /ppa/pricing-nodes"
              payload: { name: "SP15 EZ GEN HUB", iso: "CAISO", settlement_point_type: "HUB" }
              as: Originator
              as_user_id: "u_orig_1"
              captures: { hub_id: $.data.id }
            - call: "POST /ppa/pricing-nodes"
              payload: { name: "KRAMER JUNCTION 1N", iso: "CAISO", settlement_point_type: "NODE" }
              as: Originator
              as_user_id: "u_orig_1"
              captures: { node_id: $.data.id }
            - call: "POST /ppa/offtakers"
              payload: { legal_name: "Northwind Retail Inc", credit_rating: "A", rating_agency: "SP", reported_ebitda_usd: 60000000.00, net_debt_to_ebitda: 2.5, disclosure_framework: "CDP_AND_TCFD", has_science_based_target: true, re100_member: true, scope2_target_year: 2030, registry_account_id: "WREGIS-ACC-00417" }
              as: Originator
              as_user_id: "u_orig_1"
              captures: { buyer_id: $.data.id }
            - call: "POST /ppa/offtakers/${buyer_id}/submit-qualification"
              payload: {}
              as: Originator
              as_user_id: "u_orig_1"
            - call: "POST /ppa/offtakers/${buyer_id}/qualification-decision"
              payload: { decision: "QUALIFY" }
              as: CreditOfficer
              as_user_id: "u_credit_1"
            - call: "POST /ppa/projects"
              payload: { name: "Kramer Junction Solar I", technology: "SOLAR", capacity_mw: 100.000, node_id: "${node_id}", cod_target_date: "2029-06-01T00:00:00Z", p50_annual_mwh: 245280.00 }
              as: Originator
              as_user_id: "u_orig_1"
              captures: { project_id: $.data.id }
          trigger:
            - call: "POST /ppa/deals"
              payload: { project_id: "${project_id}", anchor_offtaker_id: "${buyer_id}", settlement_point_id: "${hub_id}", product_type: "VIRTUAL_CFD", contracted_mw: 25.000, term_years: 12, first_delivery_year: 2026, commercial_operation_deadline: "2029-12-31T00:00:00Z", settlement_frequency: "HOURLY", base_fixed_price_usd_per_mwh: 22.00, escalation_pct_per_year: 0.0, shape_product: "AS_GENERATED", basis_responsibility: "SHARED", created_by_user_id: "u_ghost_1", status: "EXECUTED", posted_credit_support_usd: 9999999.99 }
              as: Originator
              as_user_id: "u_orig_1"
              captures: { deal_id: $.data.id }
          assert:
            - "the response status is 201"
            - "data.created_by_user_id == u_orig_1 from the X-User-ID header, NOT u_ghost_1"
            - "data.status == DRAFT and data.credit_status == NOT_SUBMITTED - the smuggled status EXECUTED is ignored"
            - "data.posted_credit_support_usd == 0, data.released_credit_support_usd == 0 and data.drawn_credit_support_usd == 0"
            - "data.credit_approved_by_user_id, data.effective_at, data.terminated_at and data.termination_reason are all null"
            - "data.round_count == 0, data.confirmed_allocated_mw == 0 and data.cp_total_count == 0"
            - "data.version == 1 and data.id != u_ghost_1 - id is system-assigned too"

      - name: project_create_missing_capacity_mw_returns_invalid_request
        claim_type: required_fields
        grounds:
          - entities.Project
          - endpoints.POST_/ppa/projects
          - validations.priority_3_ERR_INVALID_REQUEST
        distinguishing_aspect: |
          capacity_mw has source input and no declared default, so its absence is a
          400 ERR_INVALID_REQUEST and not a project with capacity 0 (which would
          silently make available_mw 0 and block every later deal with a confusing
          ERR_PROJECT_CAPACITY_EXCEEDED instead). node_id is present and valid here,
          so the 400 cannot be confused with the referential 404 at priority 5.
        test_recipe:
          setup:
            - "One NODE pricing node exists so the reference in the request is valid."
          setup_api_calls:
            - call: "POST /ppa/pricing-nodes"
              payload: { name: "KRAMER JUNCTION 1N", iso: "CAISO", settlement_point_type: "NODE" }
              as: Originator
              as_user_id: "u_orig_1"
              captures: { node_id: $.data.id }
          trigger:
            - call: "POST /ppa/projects"
              payload: { name: "Kramer Junction Solar I", technology: "SOLAR", node_id: "${node_id}", cod_target_date: "2029-06-01T00:00:00Z", p50_annual_mwh: 245280.00 }
              as: Originator
              as_user_id: "u_orig_1"
          assert:
            - "the response status is 400 with data.error_id == ERR_INVALID_REQUEST"
            - "no Project row is created: GET /ppa/projects returns total_count 0"

      - name: deal_create_invalid_enum_product_type_rejected
        claim_type: type_constraints
        grounds:
          - entities.Deal
          - endpoints.POST_/ppa/deals
          - validations.priority_3_ERR_INVALID_REQUEST
        distinguishing_aspect: |
          product_type is constrained to PHYSICAL_DELIVERY, VIRTUAL_CFD or AGGREGATED.
          A plausible-looking industry term (SLEEVED) that is not a declared member is
          a 400, and it must be caught before any referential or business check even
          though every id in the body is valid - so the failure cannot be attributed
          to the project or the buyer.
        test_recipe:
          setup:
            - "CHAIN A up to the project: two nodes, QUALIFIED buyer NW, PRE_DEVELOPMENT project KJ1."
          setup_api_calls:
            - call: "POST /ppa/pricing-nodes"
              payload: { name: "SP15 EZ GEN HUB", iso: "CAISO", settlement_point_type: "HUB" }
              as: Originator
              as_user_id: "u_orig_1"
              captures: { hub_id: $.data.id }
            - call: "POST /ppa/pricing-nodes"
              payload: { name: "KRAMER JUNCTION 1N", iso: "CAISO", settlement_point_type: "NODE" }
              as: Originator
              as_user_id: "u_orig_1"
              captures: { node_id: $.data.id }
            - call: "POST /ppa/offtakers"
              payload: { legal_name: "Northwind Retail Inc", credit_rating: "A", rating_agency: "SP", reported_ebitda_usd: 60000000.00, net_debt_to_ebitda: 2.5, disclosure_framework: "CDP_AND_TCFD", has_science_based_target: true, re100_member: true, scope2_target_year: 2030, registry_account_id: "WREGIS-ACC-00417" }
              as: Originator
              as_user_id: "u_orig_1"
              captures: { buyer_id: $.data.id }
            - call: "POST /ppa/offtakers/${buyer_id}/submit-qualification"
              payload: {}
              as: Originator
              as_user_id: "u_orig_1"
            - call: "POST /ppa/offtakers/${buyer_id}/qualification-decision"
              payload: { decision: "QUALIFY" }
              as: CreditOfficer
              as_user_id: "u_credit_1"
            - call: "POST /ppa/projects"
              payload: { name: "Kramer Junction Solar I", technology: "SOLAR", capacity_mw: 100.000, node_id: "${node_id}", cod_target_date: "2029-06-01T00:00:00Z", p50_annual_mwh: 245280.00 }
              as: Originator
              as_user_id: "u_orig_1"
              captures: { project_id: $.data.id }
          trigger:
            - call: "POST /ppa/deals"
              payload: { project_id: "${project_id}", anchor_offtaker_id: "${buyer_id}", settlement_point_id: "${hub_id}", product_type: "SLEEVED", contracted_mw: 25.000, term_years: 12, first_delivery_year: 2026, commercial_operation_deadline: "2029-12-31T00:00:00Z", settlement_frequency: "HOURLY", base_fixed_price_usd_per_mwh: 22.00, escalation_pct_per_year: 0.0, shape_product: "AS_GENERATED", basis_responsibility: "SHARED" }
              as: Originator
              as_user_id: "u_orig_1"
            - call: "POST /ppa/deals"
              payload: { project_id: "${project_id}", anchor_offtaker_id: "${buyer_id}", settlement_point_id: "${hub_id}", product_type: "VIRTUAL_CFD", contracted_mw: 25.000, term_years: 12, first_delivery_year: 2026, commercial_operation_deadline: "2029-12-31T00:00:00Z", settlement_frequency: "QUARTERLY", base_fixed_price_usd_per_mwh: 22.00, escalation_pct_per_year: 0.0, shape_product: "AS_GENERATED", basis_responsibility: "SHARED" }
              as: Originator
              as_user_id: "u_orig_1"
          assert:
            - "the first trigger returns 400 with data.error_id == ERR_INVALID_REQUEST because SLEEVED is not one of PHYSICAL_DELIVERY, VIRTUAL_CFD, AGGREGATED"
            - "the second trigger returns 400 with data.error_id == ERR_INVALID_REQUEST because QUARTERLY is not one of HOURLY, MONTHLY - the netting granularity enum is closed too"
            - "GET /ppa/deals returns total_count 0 after both attempts"
            - "Project.${project_id}.contracted_mw is still 0 and available_mw is still 100.000, so no capacity was reserved by a rejected request"

      - name: pricing_node_listing_paginates_with_total_count_and_has_more
        claim_type: listing
        grounds:
          - endpoints.GET_/ppa/pricing-nodes
          - entities.PricingNode.fields.iso
        distinguishing_aspect: |
          Three rows against limit 2 exercise both pagination halves in one instance:
          page one must report total_count 3 (the unpaginated count, not 2) with
          has_more true, and page two must report the same total_count with has_more
          false. The iso filter is applied on top to prove filter-then-count ordering
          rather than count-then-filter.
        test_recipe:
          setup:
            - "Three pricing nodes exist: two CAISO (one HUB, one NODE) and one ERCOT HUB."
          setup_api_calls:
            - call: "POST /ppa/pricing-nodes"
              payload: { name: "SP15 EZ GEN HUB", iso: "CAISO", settlement_point_type: "HUB" }
              as: Originator
              as_user_id: "u_orig_1"
            - call: "POST /ppa/pricing-nodes"
              payload: { name: "KRAMER JUNCTION 1N", iso: "CAISO", settlement_point_type: "NODE" }
              as: Originator
              as_user_id: "u_orig_1"
            - call: "POST /ppa/pricing-nodes"
              payload: { name: "ERCOT WEST HUB", iso: "ERCOT", settlement_point_type: "HUB" }
              as: SettlementAnalyst
              as_user_id: "u_analyst_1"
          trigger:
            - call: "GET /ppa/pricing-nodes"
              payload: { limit: 2, offset: 0 }
              as: OfftakerRep
              as_user_id: "u_buyer_rep_1"
            - call: "GET /ppa/pricing-nodes"
              payload: { limit: 2, offset: 2 }
              as: OfftakerRep
              as_user_id: "u_buyer_rep_1"
            - call: "GET /ppa/pricing-nodes"
              payload: { iso: "CAISO", settlement_point_type: "HUB" }
              as: OfftakerRep
              as_user_id: "u_buyer_rep_1"
          assert:
            - "the first trigger returns 200 with response_type array, exactly 2 items, total_count 3, has_more true, limit 2 and offset 0"
            - "the second trigger returns exactly 1 item with total_count 3, has_more false, limit 2 and offset 2"
            - "the third trigger returns exactly 1 item (SP15 EZ GEN HUB) with total_count 1 and has_more false, so total_count reflects the filtered set"
            - "the third trigger omits limit and offset, so the response reports the declared defaults limit 10 and offset 0"

      - name: pricing_node_listing_limit_above_max_returns_invalid_request
        claim_type: type_constraints
        grounds:
          - endpoints.GET_/ppa/pricing-nodes
          - validations.priority_3_ERR_INVALID_REQUEST
        distinguishing_aspect: |
          The pagination envelope declares min 1 and max 100 for limit. limit 101 and
          limit 0 must both be 400 ERR_INVALID_REQUEST rather than being silently
          clamped to 100 or 1 - silent clamping is indistinguishable from a correct
          response when the collection is small, which is exactly why it must be
          pinned on an endpoint whose collection is small.
        test_recipe:
          setup:
            - "One pricing node exists, so a clamping implementation would return a plausible 200."
          setup_api_calls:
            - call: "POST /ppa/pricing-nodes"
              payload: { name: "SP15 EZ GEN HUB", iso: "CAISO", settlement_point_type: "HUB" }
              as: Originator
              as_user_id: "u_orig_1"
          trigger:
            - call: "GET /ppa/pricing-nodes"
              payload: { limit: 101 }
              as: Originator
              as_user_id: "u_orig_1"
            - call: "GET /ppa/pricing-nodes"
              payload: { limit: 0 }
              as: Originator
              as_user_id: "u_orig_1"
            - call: "GET /ppa/pricing-nodes"
              payload: { offset: -1 }
              as: Originator
              as_user_id: "u_orig_1"
            - call: "GET /ppa/pricing-nodes"
              payload: { limit: 100 }
              as: Originator
              as_user_id: "u_orig_1"
          assert:
            - "the first trigger returns 400 with data.error_id == ERR_INVALID_REQUEST because limit 101 exceeds the declared max 100"
            - "the second trigger returns 400 with data.error_id == ERR_INVALID_REQUEST because limit 0 is below the declared min 1"
            - "the third trigger returns 400 with data.error_id == ERR_INVALID_REQUEST because offset must be non-negative"
            - "the fourth trigger returns 200 with limit 100, total_count 1 and has_more false - exactly at the maximum is allowed"

      - name: allocation_requires_existing_parent_deal_and_lists_under_it
        claim_type: parent_relationships
        grounds:
          - entities.DealAllocation
          - endpoints.POST_/ppa/deals/{id}/allocations
          - endpoints.GET_/ppa/deals/{id}/allocations
          - validations.priority_4_ERR_<ENTITY>_NOT_FOUND
        distinguishing_aspect: |
          DealAllocation declares parent Deal and deal_id source system, so the parent
          comes from the URL and never from the body: the same body posted under an
          unknown deal id must be a 404 ERR_DEAL_NOT_FOUND (not a 422 about the
          version, even though the version it carries belongs to a different deal),
          and the created child must carry deal_id equal to the URL's deal.
        test_recipe:
          setup:
            - "CHAIN A: two nodes, QUALIFIED buyer NW, PRE_DEVELOPMENT project KJ1, deal D at DRAFT."
            - "A developer round is tabled so the deal reaches TERM_SHEET_ISSUED, which is a state that admits allocations."
          setup_api_calls:
            - call: "POST /ppa/pricing-nodes"
              payload: { name: "SP15 EZ GEN HUB", iso: "CAISO", settlement_point_type: "HUB" }
              as: Originator
              as_user_id: "u_orig_1"
              captures: { hub_id: $.data.id }
            - call: "POST /ppa/pricing-nodes"
