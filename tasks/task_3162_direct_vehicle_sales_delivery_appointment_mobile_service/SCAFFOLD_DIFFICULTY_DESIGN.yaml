  # ===========================================================================
  # Rule 9 — compensating_invariant (>= 2 instances, different conserved quantities)
  # ===========================================================================
  - rule_id: compensating_invariant
    instances:

      - name: order_cancellation_conserves_buyer_credit_balance
        grounds:
          - entities.Buyer.fields.order_credit_balance_cents
          - state_machines.VehicleOrder.PLACED_to_CANCELLED
          - entities.OrderFeeLedgerEntry.fields.amount_cents
          - errors[ERR_BUYER_SUSPENDED]
        distinguishing_aspect: "The conserved quantity is currency: after a 25000-cent ORDER_FEE_PAYMENT and its compensating -20000 ORDER_FEE_REFUND, Buyer.order_credit_balance_cents equals the sum of every ledger entry on the order and settles at exactly 5000 cents — the retained cancellation fee — so a compensation that refunded the fee in full leaves visible drift."
        test_recipe:
          setup:
            - "Logical clock at 2026-09-01T00:00:00Z; TX regime ENACTED; delivery center; order L1 placed with the order fee settled and no trade-in activity"
          setup_api_calls:
            - *k_clock
            - *k_jur_tx
            - *k_enact_tx
            - *k_center_tx
            - *k_cfg_y
            - &k_buyer_l1
              call: "POST /v1/buyers"
              payload: { full_name: "Lena Ledger", email: "lena.ledger@example.com", residency_state_code: "TX" }
              as: Anonymous
              captures: { buyer_l1_id: $.data.id }
            - call: "POST /v1/buyers/${buyer_l1_id}/identity-verification"
              payload: {}
              as: PlatformAdmin
            - call: "POST /v1/orders"
              payload: { buyer_id: "${buyer_l1_id}", configuration_id: "${cfg_y_id}", jurisdiction_id: "${jur_tx_id}", delivery_center_id: "${center_tx_id}", order_fee_cents: 25000 }
              as: PlatformAdmin
              captures: { order_l1_id: $.data.id, order_l1_v: $.data.version }
            - &k_place_l1
              call: "POST /v1/orders/${order_l1_id}/place"
              payload: { expected_order_version: "${order_l1_v}" }
              as: Buyer
              as_user_id: "${buyer_l1_id}"
              captures: { order_l1_v: $.data.version }
            - &k_pay_l1
              call: "POST /v1/_payments/simulate"
              payload: { order_id: "${order_l1_id}", outcome: "SUCCEEDED" }
              as: PlatformAdmin
            - call: "GET /v1/buyers/${buyer_l1_id}"
              payload: {}
              as: PlatformAdmin
              captures: { bal_before: $.data.order_credit_balance_cents, addr: $.data.id }
          trigger:
            - call: "POST /v1/orders/${order_l1_id}/cancel"
              payload: {}
              as: Buyer
              as_user_id: "${buyer_l1_id}"
              captures: { order_state: $.data.status }
            - call: "GET /v1/buyers/${buyer_l1_id}"
              payload: {}
              as: PlatformAdmin
              captures: { bal_after: $.data.order_credit_balance_cents }
          assert:
            - "\"${bal_before}\" == 25000"
            - "\"${order_state}\" == CANCELLED"
            - "\"${bal_after}\" == 5000"
            - "GET /v1/fee-ledger-entries?order_id=${order_l1_id} lists exactly one ORDER_FEE_PAYMENT of 25000 and one ORDER_FEE_REFUND of -20000, and their sum is 5000"
            - "Buyer.${buyer_l1_id}.order_credit_balance_cents equals the sum of amount_cents over every ledger entry whose buyer_id is ${buyer_l1_id}"

      - name: mobile_visit_cancellation_conserves_center_booked_slot_count
        grounds:
          - entities.DeliveryCenter.fields.booked_slot_count
          - state_machines.MobileServiceVisit.PARTS_RESERVED_to_CANCELLED
