scenario: "desgin task harder than expert level.!!!!2175. Service Organization Control (SOC) Report Readiness & Audit: system description authoring & boundary definition, trust services criteria mapping to controls, control owner assignment & evidence calendar, readiness assessment & gap remediation before observation period, auditor sampling & exception evaluation, subservice organization carve-out vs inclusive method, complementary user entity control articulation, report distribution, bridge letter & customer questionnaire deflection"
domain_name: "soc-report-readiness-audit"
api_prefix: "/soc"

complexity_profile:
  primary_archetype: "Compliance / audit"
  secondary_archetype: "Posture-driven gating"
  complexity_layers:
    - optimistic_concurrency
    - cascading_side_effects
    - dual_variant_calculation
    - ops_run_checkpoint

  entity_topology: graph
  # Many-to-many Control<->TrustCriterion via CriteriaMapping, self-referential
  # supersession chains on SystemDescription / BridgeLetter / AuditSample, and
  # cross-aggregate references (Control -> SubserviceOrganization,
  # CustomerQuestionnaire -> ReportDistribution). URL shape is flat: every
  # entity has a top-level collection and carries its foreign keys in the body;
  # nesting appears only on action sub-paths.

  state_machine_shape: parallel
  # Control carries two independent state dimensions on the same row
  # (design_status x operating_status). Layered on top: cyclic machines
  # (SystemDescription review loop, Gap reopen loop, EvidenceRequest
  # resubmit loop), branching machines with divergent side-effect sets
  # (AuditSample -> CONCLUDED_CLEAN | CONCLUDED_EXCEPTIONS,
  # CustomerQuestionnaire -> DEFLECTED | PARTIALLY_DEFLECTED | MANUAL_RESPONSE),
  # and a compound/posture-driven Engagement whose gap_posture is derived from
  # its Gap and AuditException children and gates their sibling operations.

  relationship_patterns:
    - one_to_many
    - many_to_many
    - self_referential
    - cross_aggregate

  role_model: segregation_of_duties
  consistency_model: immediate

response_envelope:
  success: |
    { "meta": { "api_request_id": "req_xxx", "api_request_timestamp": "ISO8601" },
      "response_type": "object" | "array", "data": {} }
  error: |
    { "meta": { ... }, "response_type": "error",
      "data": { "error_id": "ERR_XXX", "message": "..." } }
  pagination_fields: ["limit", "offset", "total_count", "has_more"]
  pagination_defaults: { limit: 10, min: 1, max: 100, offset: 0 }

# ---------------------------------------------------------------------------
# §1.1 Entity-Relationship Table
# ---------------------------------------------------------------------------
entities:

  - name: Engagement
    parent: null
    common_fields: true
    fields:
      - name: client_name
        type: string
        source: input
        description: "Name of the service organization being examined."
        constraints: "required; 1..200 chars"
      - name: report_type
        type: enum
        source: input
        description: "Which SOC report is being produced; drives criterion applicability and sample-size addendum."
        constraints: "required; one of SOC_1_TYPE_2, SOC_2_TYPE_2"
      - name: observation_period_start
        type: datetime
        source: input
        description: "Inclusive UTC start instant of the observation (audit) period."
        constraints: "required; ISO 8601 UTC with three fractional digits"
      - name: observation_period_end
        type: datetime
        source: input
        description: "Exclusive UTC end instant of the observation period; the period is the half-open interval [observation_period_start, observation_period_end)."
        constraints: "required; must be strictly after observation_period_start"
      - name: required_criteria_categories
        type: array
        source: input
        description: "Trust services categories in scope for this engagement; a TrustCriterion is in scope only when its category is a member of this array."
        constraints: "required; non-empty; members drawn from SECURITY, AVAILABILITY, CONFIDENTIALITY, PROCESSING_INTEGRITY, PRIVACY; duplicates rejected"
      - name: max_distribution_recipients
        type: integer
        source: input
        description: "Hard ceiling on the number of ReportDistribution rows for this engagement whose status is not in {REVOKED, DENIED}."
        default: 5
        constraints: ">= 1"
      - name: status
        type: enum
        source: system
        description: "Engagement lifecycle phase."
        default: SCOPING
        constraints: "one of SCOPING, READINESS, OBSERVATION, FIELDWORK, REPORTING, ISSUED, ABANDONED"
      - name: gap_posture
        type: enum
        source: computed
        description: "Derived posture over this engagement's Gap and AuditException children; gates child operations. Recomputed by calculations.engagement_gap_posture on every mutation that changes gap_debt_points or open_exception_count."
        default: OPEN
        constraints: "one of OPEN, RESTRICTED, FROZEN"
      - name: gap_debt_points
        type: number
        source: computed
        description: "Weighted remediation debt over non-settled Gap children; produced by calculations.gap_debt_points."
        default: 0
        constraints: "2 decimal places, round_half_up"
      - name: base_debt_points
        type: integer
        source: computed
        description: "Pre-surcharge severity-point sum over non-settled Gap children; the tier-selection input of calculations.gap_debt_points."
        default: 0
      - name: open_exception_count
        type: integer
        source: computed
        description: "Count of AuditException rows whose control_id belongs to this engagement and whose disposition is not VOIDED."
        default: 0
      - name: readiness_score
        type: number
        source: computed
        description: "Per-category-rounded-then-averaged readiness percentage; produced by calculations.readiness_score."
        default: 0
        constraints: "2 decimal places, round_half_up"
      - name: criteria_in_scope_count
        type: integer
        source: computed
        description: "Count of TrustCriterion rows whose category is in required_criteria_categories and whose applies_to_report_types contains report_type."
        default: 0
      - name: covered_criteria_count_readiness
        type: integer
        source: computed
        description: "Covered in-scope criterion count under the readiness_view variant of calculations.criteria_coverage."
        default: 0
      - name: covered_criteria_count_attestation
        type: integer
        source: computed
        description: "Covered in-scope criterion count under the attestation_view variant of calculations.criteria_coverage."
        default: 0
      - name: criteria_coverage_pct_readiness
        type: number
        source: computed
        description: "100 * covered_criteria_count_readiness / criteria_in_scope_count, round_half_up to 2dp; 0.00 when criteria_in_scope_count == 0."
        default: 0
      - name: criteria_coverage_pct_attestation
        type: number
        source: computed
        description: "100 * covered_criteria_count_attestation / criteria_in_scope_count, round_half_up to 2dp; 0.00 when criteria_in_scope_count == 0."
        default: 0
      - name: boundary_locked
        type: boolean
        source: computed
        description: "True when the SystemDescription row with status == APPROVED and system_description.engagement_id == this engagement has boundary_locked == true; false when no such row exists."
        default: false
      - name: approved_system_description_id
        type: string
        source: computed
        description: "Denormalized id of the SystemDescription whose status == APPROVED and whose engagement_id equals this engagement's id; null when no such row exists. At most one such row exists at any time."
        default: null
      - name: observation_period_days
        type: integer
        source: computed
        description: "Whole-day length of the half-open interval [observation_period_start, observation_period_end), computed as floor((observation_period_end - observation_period_start) / 86400 seconds)."
        default: 0
      - name: readiness_assessed_at
        type: datetime
        source: computed
        description: "Logical-clock instant of the most recent POST /soc/engagements/{engagement_id}/readiness-assessment; null when never run."
        default: null
      - name: calendar_epoch
        type: integer
        source: computed
        description: "Ops-run counter incremented by one on every POST /soc/engagements/{engagement_id}/calendar-run."
        default: 0

  - name: SystemDescription
    parent: Engagement
    common_fields: true
    fields:
      - name: engagement_id
        type: string
        source: input
        description: "FK -> Engagement.id; the engagement this description narrates."
        constraints: "required"
      - name: version_label
        type: string
        source: input
        description: "Author-supplied version label, e.g. 'v1'; unique per engagement_id."
        constraints: "required; 1..40 chars"
      - name: boundary_narrative
        type: string
        source: input
        description: "Narrative text defining the system boundary."
        constraints: "required; 1..5000 chars"
      - name: authored_by_user_id
        type: string
        source: system
        description: "Opaque operator id copied from the X-User-ID header of the create call; used by the segregation-of-duties check that forbids the author from approving their own description."
      - name: status
        type: enum
        source: system
        description: "Authoring lifecycle state."
        default: DRAFT
        constraints: "one of DRAFT, IN_REVIEW, APPROVED, SUPERSEDED, WITHDRAWN"
      - name: review_round
        type: integer
        source: computed
        description: "Number of completed DRAFT -> IN_REVIEW -> DRAFT revision loops; incremented on every IN_REVIEW -> DRAFT transition."
        default: 0
      - name: boundary_locked
        type: boolean
        source: computed
        description: "True once POST /soc/system-descriptions/{system_description_id}/lock-boundary has succeeded; boundary components can no longer be created or rescoped against this description."
        default: false
      - name: supersedes_system_description_id
        type: string
        source: computed
        description: "FK -> SystemDescription.id; set at APPROVE time to the id of the previously APPROVED description of the same engagement, null when this is the first approved description."
        default: null
      - name: in_scope_component_count
        type: integer
        source: computed
        description: "Count of BoundaryComponent children with scope_status == IN_SCOPE."
        default: 0
      - name: carved_out_component_count
        type: integer
        source: computed
        description: "Count of BoundaryComponent children with scope_status == CARVED_OUT."
        default: 0
      - name: approved_at
        type: datetime
        source: computed
        description: "Logical-clock instant at which status became APPROVED; null otherwise."
        default: null

  - name: BoundaryComponent
    parent: SystemDescription
    common_fields: true
    fields:
      - name: system_description_id
        type: string
        source: input
        description: "FK -> SystemDescription.id; the description whose boundary this component belongs to."
        constraints: "required"
      - name: component_type
        type: enum
        source: input
        description: "Boundary dimension this component belongs to."
        constraints: "required; one of INFRASTRUCTURE, SOFTWARE, PEOPLE, PROCEDURES, DATA"
      - name: name
        type: string
        source: input
        description: "Component label; unique per system_description_id."
        constraints: "required; 1..120 chars"
      - name: scope_status
        type: enum
        source: input
        description: "Whether the component is inside the boundary, carved out to a subservice organization, or explicitly excluded."
        default: IN_SCOPE
        constraints: "one of IN_SCOPE, CARVED_OUT, EXCLUDED"
      - name: subservice_organization_id
        type: string
        source: input
        description: "FK -> SubserviceOrganization.id; required when scope_status == CARVED_OUT, must be null for IN_SCOPE and EXCLUDED."
        default: null
      - name: exclusion_rationale
        type: string
        source: input
        description: "Free-text justification; required when scope_status == EXCLUDED, must be null otherwise."
        default: null

  - name: TrustCriterion
    parent: null
    common_fields: false
    fields:
      - name: criterion_code
        type: string
        source: input
        description: "Trust services criterion code, e.g. 'CC6.1'; globally unique."
        constraints: "required; 1..20 chars; uppercase"
      - name: category
        type: enum
        source: input
        description: "Trust services category this criterion belongs to."
        constraints: "required; one of SECURITY, AVAILABILITY, CONFIDENTIALITY, PROCESSING_INTEGRITY, PRIVACY"
      - name: title
        type: string
        source: input
        description: "Human-readable criterion title."
        constraints: "required; 1..200 chars"
      - name: min_primary_controls
        type: integer
        source: input
        description: "Number of ACTIVE PRIMARY CriteriaMapping rows to qualifying controls required before the attestation_view variant treats this criterion as covered."
        default: 1
        constraints: ">= 1"
      - name: applies_to_report_types
        type: array
        source: input
        description: "Report types for which this criterion is in scope; a criterion whose array omits an engagement's report_type is never in scope for that engagement."
        default: ["SOC_2_TYPE_2"]
        constraints: "non-empty; members drawn from SOC_1_TYPE_2, SOC_2_TYPE_2"

  - name: Control
    parent: Engagement
    common_fields: true
    fields:
      - name: engagement_id
        type: string
        source: input
        description: "FK -> Engagement.id; the engagement whose control set this control belongs to."
        constraints: "required"
      - name: control_ref
        type: string
        source: input
        description: "Control reference label, e.g. 'AC-01'; unique per engagement_id and used as the deterministic sort key for readiness-assessment gap creation order."
        constraints: "required; 1..40 chars"
      - name: title
        type: string
        source: input
        description: "Control description."
        constraints: "required; 1..200 chars"
      - name: frequency
        type: enum
        source: input
        description: "Operating frequency; selects FREQUENCY_BASE in calculations.sample_size_determination and PERIOD_DAYS in calculations.evidence_calendar_generation."
        constraints: "required; one of DAILY, WEEKLY, MONTHLY, QUARTERLY, ANNUAL, ADHOC"
      - name: automation
        type: enum
        source: input
        description: "Whether the control is performed by a person or a machine; AUTOMATED shrinks the sampling base."
        default: MANUAL
        constraints: "one of MANUAL, AUTOMATED"
      - name: risk_rating
        type: enum
        source: input
        description: "Inherent risk rating; adds RISK_BUMP to the sample size and selects PRECISION_ALLOWANCE in the upper_precision_view of calculations.exception_projection."
        default: MODERATE
        constraints: "one of LOW, MODERATE, HIGH"
      - name: population_size
        type: integer
        source: input
        description: "Size of the control's operating population over the observation period; caps sample_size and is snapshotted onto AuditSample at draw time."
        default: 0
        constraints: ">= 0"
      - name: owner_user_id
        type: string
        source: computed
        description: "Opaque ControlOwner operator id set by POST /soc/controls/{control_id}/assign-owner; the only operator id permitted to submit evidence for this control's EvidenceRequest children."
        default: null
      - name: design_status
        type: enum
        source: system
        description: "First of two independent state dimensions on this row: design effectiveness track."
        default: DESIGN_DRAFT
        constraints: "one of DESIGN_DRAFT, DESIGN_MAPPED, DESIGN_APPROVED, DESIGN_DEFICIENT, DESIGN_CARVED_OUT"
      - name: operating_status
        type: enum
        source: system
        description: "Second of two independent state dimensions on this row: operating effectiveness track; evolves independently of design_status."
        default: NOT_TESTED
        constraints: "one of NOT_TESTED, IN_OBSERVATION, TESTED_EFFECTIVE, TESTED_EXCEPTION, TESTED_INEFFECTIVE"
      - name: in_scope
        type: boolean
        source: computed
        description: "False once the control's subservice organization switches to CARVE_OUT; out-of-scope controls are excluded from every criteria-coverage variant."
        default: true
      - name: subservice_organization_id
        type: string
        source: input
        description: "FK -> SubserviceOrganization.id; non-null when this control is performed by a subservice organization, null when performed by the service organization itself."
        default: null
      - name: primary_mapping_count
        type: integer
        source: computed
        description: "Count of CriteriaMapping children with mapping_type == PRIMARY and status == ACTIVE."
        default: 0
      - name: active_mapping_count
        type: integer
        source: computed
        description: "Count of CriteriaMapping children with status == ACTIVE, both mapping types."
        default: 0
      - name: evidence_scheduled_count
        type: integer
        source: computed
        description: "Count of EvidenceRequest children with status == SCHEDULED."
        default: 0
      - name: evidence_accepted_count
        type: integer
        source: computed
        description: "Count of EvidenceRequest children with status == ACCEPTED."
        default: 0
      - name: evidence_missed_count
        type: integer
        source: computed
        description: "Count of EvidenceRequest children with status == MISSED."
        default: 0
      - name: tested_item_count
        type: integer
        source: computed
        description: "Sum of items_recorded across AuditSample children whose status is not VOIDED."
        default: 0
      - name: open_gap_count
        type: integer
        source: computed
        description: "Count of Gap children whose status is in {OPEN, PLANNED, REOPENED}."
        default: 0

  - name: CriteriaMapping
    parent: Control
    common_fields: true
    fields:
      - name: control_id
        type: string
        source: input
        description: "FK -> Control.id; the control that satisfies the criterion."
        constraints: "required"
      - name: trust_criterion_id
        type: string
        source: input
        description: "FK -> TrustCriterion.id; the criterion satisfied."
        constraints: "required"
      - name: mapping_type
        type: enum
        source: input
        description: "PRIMARY mappings count toward TrustCriterion.min_primary_controls in the attestation_view; SECONDARY mappings count only in the readiness_view."
        default: PRIMARY
        constraints: "one of PRIMARY, SECONDARY"
      - name: rationale
        type: string
        source: input
        description: "Optional mapping justification."
        default: null
      - name: status
        type: enum
        source: system
        description: "ACTIVE mappings participate in coverage; RETIRED mappings are retained for audit trail and excluded from every coverage variant."
        default: ACTIVE
        constraints: "one of ACTIVE, RETIRED"
      - name: retired_at
        type: datetime
        source: computed
        description: "Logical-clock instant at which status became RETIRED; null while ACTIVE."
        default: null

  - name: EvidenceRequest
    parent: Control
    common_fields: true
    fields:
      - name: control_id
        type: string
        source: input
        description: "FK -> Control.id; the control whose operation this evidence attests."
        constraints: "required"
      - name: period_index
        type: integer
        source: input
        description: "Zero-based ordinal of the evidence period within the observation period; unique per control_id."
        constraints: "required; >= 0"
      - name: period_start
        type: datetime
        source: input
        description: "Inclusive UTC start of the evidence period."
        constraints: "required"
      - name: period_end
        type: datetime
        source: input
        description: "Exclusive UTC end of the evidence period; the occupation interval on the control is the half-open [period_start, period_end), so a period starting exactly at another period's period_end does not collide."
        constraints: "required; strictly after period_start"
      - name: due_date
        type: datetime
        source: computed
        description: "period_end plus GRACE_DAYS days; the logical-clock instant after which a SCHEDULED or REJECTED request becomes MISSED at the next calendar-run."
      - name: status
        type: enum
        source: system
        description: "Evidence lifecycle state."
        default: SCHEDULED
        constraints: "one of SCHEDULED, SUBMITTED, ACCEPTED, REJECTED, MISSED, WAIVED"
      - name: submitted_by_user_id
        type: string
        source: system
        description: "Opaque ControlOwner operator id captured from X-User-ID on the most recent submit; null before first submit."
        default: null
      - name: submitted_at
        type: datetime
        source: computed
        description: "Logical-clock instant of the most recent submit; null before first submit."
        default: null
      - name: reviewed_by_user_id
        type: string
        source: system
        description: "Opaque EvidenceReviewer operator id captured from X-User-ID on the most recent review; null before first review."
        default: null
      - name: reviewed_at
        type: datetime
        source: computed
        description: "Logical-clock instant of the most recent review; null before first review."
        default: null
      - name: rejection_round
        type: integer
        source: computed
        description: "Number of completed SUBMITTED -> REJECTED -> SUBMITTED resubmission loops; incremented on every SUBMITTED -> REJECTED transition."
        default: 0
      - name: artifact_ref
        type: string
        source: input
        description: "Opaque pointer to the uploaded artifact, supplied on submit."
        default: null
      - name: late
        type: boolean
        source: computed
        description: "True when submitted_at is strictly after due_date at the moment of the accepted submit."
        default: false

  - name: Gap
    parent: Engagement
    common_fields: true
    fields:
      - name: engagement_id
        type: string
        source: input
        description: "FK -> Engagement.id; the engagement whose remediation debt this gap contributes to."
        constraints: "required"
      - name: control_id
        type: string
        source: input
        description: "FK -> Control.id; the control the gap sits on, or null for a criterion-anchored coverage gap."
        default: null
      - name: trust_criterion_id
        type: string
        source: input
        description: "FK -> TrustCriterion.id; set for criterion-anchored coverage gaps, null for control-anchored gaps."
        default: null
      - name: audit_exception_id
        type: string
        source: computed
        description: "FK -> AuditException.id; set when this gap was created by the exception cascade, null otherwise."
        default: null
      - name: source
        type: enum
        source: system
        description: "Which mechanism created the gap."
        default: MANUAL
        constraints: "one of READINESS_ASSESSMENT, EXCEPTION_CASCADE, EVIDENCE_MISS, COVERAGE_LOSS, MANUAL"
      - name: severity
        type: enum
        source: input
        description: "Severity band; selects SEVERITY_POINTS in calculations.gap_debt_points."
        default: MODERATE
        constraints: "one of LOW, MODERATE, HIGH, CRITICAL"
      - name: status
        type: enum
        source: system
        description: "Remediation lifecycle state; OPEN, PLANNED and REOPENED are the non-settled states that contribute debt."
        default: OPEN
        constraints: "one of OPEN, PLANNED, REMEDIATED, VERIFIED, REOPENED, WITHDRAWN"
      - name: remediation_owner_user_id
        type: string
        source: input
        description: "Opaque operator id accountable for remediation; set on the PLAN transition."
        default: null
      - name: remediation_due_date
        type: datetime
        source: input
        description: "Target remediation instant; set on the PLAN transition."
        default: null
      - name: reopen_count
        type: integer
        source: computed
        description: "Number of VERIFIED -> REOPENED transitions this gap has undergone."
        default: 0
      - name: debt_points
        type: integer
        source: computed
        description: "SEVERITY_POINTS[severity] when status is in {OPEN, PLANNED, REOPENED}, otherwise 0."
        default: 0
      - name: description
        type: string
        source: input
        description: "Gap narrative."
        default: null

  - name: AuditSample
    parent: Control
    common_fields: true
    fields:
      - name: control_id
        type: string
        source: input
        description: "FK -> Control.id; the control being tested."
        constraints: "required"
      - name: period_start
        type: datetime
        source: input
        description: "Inclusive UTC start of the tested window; must be >= engagement.observation_period_start."
        constraints: "required"
      - name: period_end
        type: datetime
        source: input
        description: "Exclusive UTC end of the tested window; must be <= engagement.observation_period_end."
        constraints: "required; strictly after period_start"
      - name: drawn_by_user_id
        type: string
        source: system
        description: "Opaque Auditor operator id captured from X-User-ID at draw time."
      - name: drawn_at
        type: datetime
        source: computed
        description: "Logical-clock instant at which the sample was drawn."
      - name: population_size_snapshot
        type: integer
        source: computed
        description: "Copy of Control.population_size taken at draw time; later changes to the control do not retro-alter this sample."
        default: 0
      - name: sample_size
        type: integer
        source: computed
        description: "Number of items to test; produced by calculations.sample_size_determination."
        default: 0
      - name: allowed_deviations
        type: integer
        source: computed
        description: "floor(sample_size * ALLOWED_DEVIATION_RATE); the sample concludes with exceptions only when items_failed is strictly greater than this value."
        default: 0
      - name: items_recorded
        type: integer
        source: computed
        description: "Count of item results recorded so far via POST /soc/audit-samples/{audit_sample_id}/items."
        default: 0
      - name: items_passed
        type: integer
        source: computed
        description: "Count of recorded items with outcome PASS."
        default: 0
      - name: items_failed
        type: integer
        source: computed
        description: "Count of recorded items with outcome FAIL or NOT_PROVIDED; NOT_PROVIDED is treated as a deviation."
        default: 0
      - name: items_not_provided
        type: integer
        source: computed
        description: "Count of recorded items with outcome NOT_PROVIDED (a subset of items_failed)."
        default: 0
      - name: deviation_rate
        type: number
        source: computed
        description: "items_failed / sample_size, round_half_up to 4 decimal places; 0.0000 when sample_size == 0."
        default: 0
      - name: projected_failures
        type: number
        source: computed
        description: "Population projection under the deviation_rate_view variant of calculations.exception_projection; stamped at conclusion."
        default: 0
      - name: status
        type: enum
        source: system
        description: "Sampling lifecycle state; the two CONCLUDED_* states are the divergent arms of the branch."
        default: DRAWN
        constraints: "one of DRAWN, TESTING, CONCLUDED_CLEAN, CONCLUDED_EXCEPTIONS, VOIDED"
      - name: zero_population
        type: boolean
        source: computed
        description: "True when population_size_snapshot == 0; such a sample is drawn directly into CONCLUDED_CLEAN with sample_size 0."
        default: false
      - name: supersedes_audit_sample_id
        type: string
        source: computed
        description: "FK -> AuditSample.id; set at draw time to the id of the prior non-VOIDED sample on the same control that this draw supersedes, null when none."
        default: null
      - name: voided_at
        type: datetime
        source: computed
        description: "Logical-clock instant at which the sample was voided; null otherwise."
        default: null

  - name: AuditException
    parent: AuditSample
    common_fields: true
    fields:
      - name: audit_sample_id
        type: string
        source: computed
        description: "FK -> AuditSample.id; the sample whose deviation budget this exception breached."
        constraints: "required"
      - name: control_id
        type: string
        source: computed
        description: "FK -> Control.id; denormalized from the sample's control at creation time."
        constraints: "required"
      - name: item_ordinal
        type: integer
        source: computed
        description: "Zero-based ordinal of the recorded item that breached the deviation budget."
        default: 0
      - name: failure_reason
        type: string
        source: computed
        description: "Copied from the breaching item result's reason field."
        default: null
      - name: disposition
        type: enum
        source: system
        description: "Auditor's evaluation outcome."
        default: UNEVALUATED
        constraints: "one of UNEVALUATED, ISOLATED, PERVASIVE, VOIDED"
      - name: severity_assigned
        type: enum
        source: computed
        description: "DISPOSITION_SEVERITY[disposition] stamped at evaluation; null while UNEVALUATED or VOIDED."
        default: null
        constraints: "one of MODERATE, CRITICAL, or null"
      - name: projected_failures_upper
        type: number
        source: computed
        description: "Population projection under the upper_precision_view variant of calculations.exception_projection; stamped at evaluation."
        default: 0
      - name: pervasive_recommended
        type: boolean
        source: computed
        description: "True when projected_failures_upper > PERVASIVE_THRESHOLD_PCT * AuditSample.population_size_snapshot; the auditor may still record ISOLATED, in which case the recommendation and the disposition disagree."
        default: false
      - name: evaluated_by_user_id
        type: string
        source: system
        description: "Opaque Auditor operator id captured from X-User-ID at evaluation."
        default: null
      - name: evaluated_at
        type: datetime
        source: computed
        description: "Logical-clock instant of evaluation; null while UNEVALUATED."
        default: null

  - name: SubserviceOrganization
    parent: Engagement
    common_fields: true
    fields:
      - name: engagement_id
        type: string
        source: input
        description: "FK -> Engagement.id; the engagement that relies on this subservice organization."
        constraints: "required"
      - name: name
        type: string
        source: input
        description: "Subservice organization name; unique per engagement_id."
        constraints: "required; 1..200 chars"
      - name: services_provided
        type: string
        source: input
        description: "Narrative of the services relied upon."
        constraints: "required; 1..1000 chars"
      - name: method
        type: enum
        source: system
        description: "Presentation method; CARVE_OUT excludes the subservice organization's controls from the description, INCLUSIVE brings them into scope."
        default: CARVE_OUT
        constraints: "one of CARVE_OUT, INCLUSIVE"
      - name: coverage_start
        type: datetime
        source: input
        description: "Inclusive UTC start of the window during which this organization's controls are relied upon."
        constraints: "required"
      - name: coverage_end
        type: datetime
        source: input
        description: "Inclusive UTC end of that window; two INCLUSIVE organizations on the same engagement must be separated by at least SUBSERVICE_BUFFER_DAYS days of clear space between coverage_end and the next coverage_start."
        constraints: "required; on or after coverage_start"
      - name: csoc_articulated
        type: boolean
        source: computed
        description: "True once csoc_narrative is non-null; a CARVE_OUT organization with csoc_articulated == false blocks engagement advance to REPORTING."
        default: false
      - name: csoc_narrative
        type: string
        source: input
        description: "Complementary subservice organization controls narrative; supplied on the set-method call."
        default: null
      - name: inclusive_control_count
        type: integer
        source: computed
        description: "Count of Control rows whose subservice_organization_id equals this row's id and whose in_scope == true."
        default: 0
      - name: carved_out_at
        type: datetime
        source: computed
        description: "Logical-clock instant of the most recent switch to CARVE_OUT; null when never carved out."
        default: null

  - name: CUEC
    parent: Engagement
    common_fields: true
    fields:
      - name: engagement_id
        type: string
        source: input
        description: "FK -> Engagement.id; the engagement whose report articulates this user-entity control."
        constraints: "required"
      - name: trust_criterion_id
        type: string
        source: input
        description: "FK -> TrustCriterion.id; the criterion the user entity must complement."
        constraints: "required"
      - name: statement
        type: string
        source: input
        description: "Complementary user entity control statement text."
        constraints: "required; 1..1000 chars"
      - name: deflection_topic
        type: string
        source: input
        description: "Topic key used by the CUEC bucket of calculations.questionnaire_deflection_waterfall."
        constraints: "required; 1..60 chars"
      - name: articulation_status
        type: enum
        source: system
        description: "Only ARTICULATED rows are counted by the CUEC deflection bucket."
        default: DRAFT
        constraints: "one of DRAFT, ARTICULATED, RETIRED"
      - name: articulated_at
        type: datetime
        source: computed
        description: "Logical-clock instant at which articulation_status became ARTICULATED; null otherwise."
        default: null

  - name: ReportDistribution
    parent: Engagement
    common_fields: true
    fields:
      - name: engagement_id
        type: string
        source: input
        description: "FK -> Engagement.id; the engagement whose report is being distributed."
        constraints: "required"
      - name: recipient_name
        type: string
        source: input
        description: "Receiving user entity name; unique per engagement_id among rows whose status is not in {REVOKED, DENIED}."
        constraints: "required; 1..200 chars"
      - name: recipient_email
        type: string
        source: input
        description: "Recipient contact address."
        constraints: "required; 1..200 chars"
      - name: nda_reference
        type: string
        source: input
        description: "Executed non-disclosure agreement reference; required to leave NDA_PENDING."
        default: null
      - name: status
        type: enum
        source: system
        description: "Distribution lifecycle state."
        default: REQUESTED
        constraints: "one of REQUESTED, NDA_PENDING, APPROVED, DELIVERED, REVOKED, DENIED"
      - name: delivered_at
        type: datetime
        source: computed
        description: "Logical-clock instant of delivery; null otherwise."
        default: null
      - name: revoked_at
        type: datetime
        source: computed
        description: "Logical-clock instant of revocation; null otherwise."
        default: null
      - name: report_period_start
        type: datetime
        source: computed
        description: "Snapshot of Engagement.observation_period_start taken at delivery; null before delivery."
        default: null
      - name: report_period_end
        type: datetime
        source: computed
        description: "Snapshot of Engagement.observation_period_end taken at delivery; the anchor for bridge-letter coverage and for the post-period bucket of questionnaire deflection."
        default: null

  - name: BridgeLetter
    parent: Engagement
    common_fields: true
    fields:
      - name: engagement_id
        type: string
        source: input
        description: "FK -> Engagement.id; the engagement whose report this letter bridges forward."
        constraints: "required"
      - name: coverage_start
        type: datetime
        source: input
        description: "Inclusive UTC start of the bridged gap period."
        constraints: "required; on or after Engagement.observation_period_end"
      - name: as_of_date
        type: datetime
        source: input
        description: "Inclusive UTC end of the bridged gap period; the coverage interval is the CLOSED interval [coverage_start, as_of_date], so two ISSUED letters that merely touch at an endpoint do collide."
        constraints: "required; on or after coverage_start; at most MAX_BRIDGE_DAYS days after coverage_start"
      - name: status
        type: enum
        source: system
        description: "Bridge letter lifecycle state."
        default: DRAFT
        constraints: "one of DRAFT, ISSUED, EXPIRED, SUPERSEDED"
      - name: supersedes_bridge_letter_id
        type: string
        source: input
        description: "FK -> BridgeLetter.id; the prior ISSUED letter this one extends, null for the first letter of an engagement."
        default: null
      - name: coverage_days
        type: integer
        source: computed
        description: "Whole-day length of the closed interval, computed as floor((as_of_date - coverage_start) / 86400 seconds) + 1."
        default: 0
      - name: issued_at
        type: datetime
        source: computed
        description: "Logical-clock instant at which status became ISSUED; null otherwise."
        default: null
      - name: issued_by_user_id
        type: string
        source: system
        description: "Opaque AccountExecutive operator id captured from X-User-ID at issue time."
        default: null

  - name: CustomerQuestionnaire
    parent: Engagement
    common_fields: true
    fields:
      - name: engagement_id
        type: string
        source: input
        description: "FK -> Engagement.id; the engagement whose report is offered as the deflection source."
        constraints: "required"
      - name: report_distribution_id
        type: string
        source: input
        description: "FK -> ReportDistribution.id; the distribution through which this customer received the report."
        constraints: "required"
      - name: customer_name
        type: string
        source: input
        description: "Questionnaire originator."
        constraints: "required; 1..200 chars"
      - name: criteria_item_count
        type: integer
        source: input
        description: "Number of questionnaire items answerable from in-report criteria coverage; the first waterfall bucket."
        constraints: "required; >= 0"
      - name: post_period_item_count
        type: integer
        source: input
        description: "Number of questionnaire items about the interval after the report period end; the second waterfall bucket."
        constraints: "required; >= 0"
      - name: cuec_item_count
        type: integer
        source: input
        description: "Number of questionnaire items about user-entity responsibilities; the third waterfall bucket."
        constraints: "required; >= 0"
      - name: item_count
        type: integer
        source: computed
        description: "criteria_item_count + post_period_item_count + cuec_item_count."
        default: 0
      - name: as_of_date
        type: datetime
        source: input
        description: "The instant the customer's questions are asked about; supplied on the deflect call and stamped onto the row."
        default: null
      - name: deflected_by_report_count
        type: integer
        source: computed
        description: "Items absorbed by the first waterfall bucket."
        default: 0
      - name: deflected_by_bridge_count
        type: integer
        source: computed
        description: "Items absorbed by the second waterfall bucket."
        default: 0
      - name: deflected_by_cuec_count
        type: integer
        source: computed
        description: "Items absorbed by the third waterfall bucket."
        default: 0
      - name: manual_response_count
        type: integer
        source: computed
        description: "Waterfall remainder that no source absorbs."
        default: 0
      - name: deflection_ratio
        type: number
        source: computed
        description: "(item_count - manual_response_count) / item_count, round_half_up to 4 decimal places; 0.0000 when item_count == 0."
        default: 0
      - name: bridge_letter_id_used
        type: string
        source: computed
        description: "FK -> BridgeLetter.id; the letter selected by the bridge bucket's selector, null when the bucket absorbed nothing."
        default: null
      - name: status
        type: enum
        source: system
        description: "Deflection outcome; the three post-deflect states are the divergent arms of the branch."
        default: RECEIVED
        constraints: "one of RECEIVED, DEFLECTED, PARTIALLY_DEFLECTED, MANUAL_RESPONSE, CLOSED"

# ---------------------------------------------------------------------------
# §1.2 State Machine Table
# ---------------------------------------------------------------------------
state_machines:

  - entity: Engagement
    initial_state: SCOPING
    terminal_states: [ISSUED, ABANDONED]
    transitions:
      - from: SCOPING
        to: READINESS
        trigger: "POST /soc/engagements/{engagement_id}/transitions with action START_READINESS"
        actor: ComplianceLead
        preconditions:
          - "Engagement.approved_system_description_id != null"
          - "Engagement.boundary_locked == true"
          - "Engagement.criteria_in_scope_count >= 1"
        side_effects:
          - "recompute Engagement.criteria_coverage_pct_readiness and Engagement.criteria_coverage_pct_attestation via calculations.criteria_coverage"
          - "recompute Engagement.readiness_score via calculations.readiness_score"
          - "increments Engagement.version by 1"
      - from: READINESS
        to: OBSERVATION
        trigger: "POST /soc/engagements/{engagement_id}/transitions with action START_OBSERVATION"
        actor: ComplianceLead
        preconditions:
          - "Engagement.readiness_assessed_at != null"
          - "Engagement.gap_posture != FROZEN"
          - "every Control with engagement_id == this engagement and in_scope == true has design_status == DESIGN_APPROVED"
          - "every Control with engagement_id == this engagement and in_scope == true has owner_user_id != null"
          - "every Control with engagement_id == this engagement and in_scope == true has evidence_scheduled_count >= 1"
        side_effects:
          - "for every Control with engagement_id == this engagement and in_scope == true, set Control.operating_status = IN_OBSERVATION (cascade down; controls already past NOT_TESTED are left untouched)"
          - "increments Engagement.version by 1"
      - from: OBSERVATION
        to: FIELDWORK
        trigger: "POST /soc/engagements/{engagement_id}/transitions with action START_FIELDWORK"
        actor: ComplianceLead
        preconditions:
          - "logical clock >= Engagement.observation_period_end"
          - "no EvidenceRequest whose control_id belongs to this engagement has status in {SCHEDULED, SUBMITTED}"
        side_effects:
          - "increments Engagement.version by 1"
      - from: FIELDWORK
        to: REPORTING
        trigger: "POST /soc/engagements/{engagement_id}/transitions with action START_REPORTING"
        actor: Auditor
        preconditions:
          - "Engagement.gap_posture == OPEN"
          - "every Control with engagement_id == this engagement and in_scope == true has operating_status in {TESTED_EFFECTIVE, TESTED_EXCEPTION}"
          - "every SubserviceOrganization with engagement_id == this engagement and method == CARVE_OUT has csoc_articulated == true"
          - "every AuditException whose control_id belongs to this engagement has disposition != UNEVALUATED"
        side_effects:
          - "recompute Engagement.criteria_coverage_pct_attestation via the attestation_view variant of calculations.criteria_coverage"
          - "increments Engagement.version by 1"
      - from: REPORTING
        to: ISSUED
        trigger: "POST /soc/engagements/{engagement_id}/transitions with action ISSUE"
        actor: Auditor
        preconditions:
          - "Engagement.gap_posture == OPEN"
          - "Engagement.criteria_coverage_pct_attestation == 100.00"
        side_effects:
          - "increments Engagement.version by 1"
      - from: SCOPING
        to: ABANDONED
        trigger: "POST /soc/engagements/{engagement_id}/transitions with action ABANDON"
        actor: ComplianceLead
        preconditions: []
        side_effects:
          - "every SystemDescription of this engagement whose status is in {DRAFT, IN_REVIEW} moves to WITHDRAWN"
          - "every Gap of this engagement whose status is in {OPEN, PLANNED, REMEDIATED, REOPENED} moves to WITHDRAWN; each such move sets that Gap.debt_points = 0, which in turn drives the recompute below"
          - "recompute Engagement.base_debt_points, Engagement.gap_debt_points and Engagement.gap_posture"
          - "increments Engagement.version by 1"
      - from: READINESS
        to: ABANDONED
        trigger: "POST /soc/engagements/{engagement_id}/transitions with action ABANDON"
        actor: ComplianceLead
        preconditions: []
        side_effects:
          - "every SystemDescription of this engagement whose status is in {DRAFT, IN_REVIEW} moves to WITHDRAWN"
          - "every Gap of this engagement whose status is in {OPEN, PLANNED, REMEDIATED, REOPENED} moves to WITHDRAWN; each such move sets that Gap.debt_points = 0, which in turn drives the recompute below"
          - "recompute Engagement.base_debt_points, Engagement.gap_debt_points and Engagement.gap_posture"
          - "increments Engagement.version by 1"
    note: "Compound / posture-driven. Engagement.gap_posture is not a member of `status`; it is a second derived dimension recomputed from Gap and AuditException children by calculations.engagement_gap_posture and it gates sibling operations across the engagement."

  - entity: SystemDescription
    initial_state: DRAFT
    terminal_states: [SUPERSEDED, WITHDRAWN]
    transitions:
      - from: DRAFT
        to: IN_REVIEW
        trigger: "POST /soc/system-descriptions/{system_description_id}/transitions with action SUBMIT_REVIEW"
        actor: ComplianceLead
        preconditions:
          - "SystemDescription.in_scope_component_count >= 1"
          - "Engagement.status == SCOPING"
        side_effects:
          - "no cross-entity effect"
      - from: IN_REVIEW
        to: DRAFT
        trigger: "POST /soc/system-descriptions/{system_description_id}/transitions with action RETURN_TO_DRAFT"
        actor: Auditor
        preconditions:
          - "SystemDescription.boundary_locked == false"
        side_effects:
          - "SystemDescription.review_round += 1"
        note: "Revision loop — this edge together with DRAFT -> IN_REVIEW forms the cycle."
      - from: IN_REVIEW
        to: APPROVED
        trigger: "POST /soc/system-descriptions/{system_description_id}/transitions with action APPROVE"
        actor: Auditor
        preconditions:
          - "X-User-ID != SystemDescription.authored_by_user_id (segregation of duties)"
          - "every BoundaryComponent with system_description_id == this row and scope_status == CARVED_OUT references a SubserviceOrganization whose method == CARVE_OUT"
          - "Engagement.status == SCOPING"
        side_effects:
          - "SystemDescription.approved_at = logical clock"
          - "the SystemDescription of the same engagement whose status == APPROVED (at most one) moves to SUPERSEDED, and this row's supersedes_system_description_id is set to that row's id"
          - "that supersession itself sets Engagement.approved_system_description_id = this row's id and Engagement.boundary_locked = this row's boundary_locked"
          - "increments Engagement.version by 1"
      - from: DRAFT
        to: WITHDRAWN
        trigger: "POST /soc/system-descriptions/{system_description_id}/transitions with action WITHDRAW, or the Engagement ABANDON cascade"
        actor: ComplianceLead
        preconditions: []
        side_effects:
          - "no cross-entity effect"
      - from: IN_REVIEW
        to: WITHDRAWN
        trigger: "POST /soc/system-descriptions/{system_description_id}/transitions with action WITHDRAW, or the Engagement ABANDON cascade"
        actor: ComplianceLead
        preconditions: []
        side_effects:
          - "no cross-entity effect"
      - from: APPROVED
        to: SUPERSEDED
        trigger: "system event: another SystemDescription of the same engagement reaches APPROVED"
        actor: system
        preconditions:
          - "a sibling SystemDescription of the same engagement is transitioning IN_REVIEW -> APPROVED"
        side_effects:
          - "Engagement.approved_system_description_id repointed to the newly APPROVED row"

  - entity: Control.design_status
    initial_state: DESIGN_DRAFT
    terminal_states: [DESIGN_CARVED_OUT]
    transitions:
      - from: DESIGN_DRAFT
        to: DESIGN_MAPPED
        trigger: "system event: POST /soc/criteria-mappings raises Control.active_mapping_count from 0 to 1"
        actor: system
        preconditions:
          - "Control.in_scope == true"
        side_effects:
          - "Control.active_mapping_count and Control.primary_mapping_count recomputed"
          - "recompute Engagement.criteria_coverage_pct_readiness and Engagement.criteria_coverage_pct_attestation"
      - from: DESIGN_MAPPED
        to: DESIGN_DRAFT
        trigger: "system event: DELETE /soc/criteria-mappings/{criteria_mapping_id} drops Control.active_mapping_count to 0"
        actor: system
        preconditions: []
        side_effects:
          - "Control.active_mapping_count and Control.primary_mapping_count recomputed"
          - "recompute Engagement.criteria_coverage_pct_readiness and Engagement.criteria_coverage_pct_attestation"
      - from: DESIGN_MAPPED
        to: DESIGN_APPROVED
        trigger: "POST /soc/controls/{control_id}/transitions with action APPROVE_DESIGN"
        actor: Auditor
        preconditions:
          - "Engagement.boundary_locked == true"
          - "Control.primary_mapping_count >= 1"
          - "Control.owner_user_id != null"
          - "Control.in_scope == true"
          - "Engagement.status in {SCOPING, READINESS, OBSERVATION}"
        side_effects:
          - "recompute Engagement.criteria_coverage_pct_attestation"
          - "recompute Engagement.readiness_score"
      - from: DESIGN_APPROVED
        to: DESIGN_DEFICIENT
        trigger: "system event: an AuditException on this control is evaluated with disposition PERVASIVE"
        actor: system
        preconditions: []
        side_effects:
          - "recompute Engagement.criteria_coverage_pct_attestation (the control stops qualifying under the attestation_view)"
      - from: DESIGN_DEFICIENT
        to: DESIGN_APPROVED
        trigger: "POST /soc/controls/{control_id}/transitions with action APPROVE_DESIGN"
        actor: Auditor
        preconditions:
          - "every Gap with control_id == this control and source == EXCEPTION_CASCADE has status == VERIFIED"
          - "Control.primary_mapping_count >= 1"
          - "Control.owner_user_id != null"
        side_effects:
          - "recompute Engagement.criteria_coverage_pct_attestation"
        note: "Remediation loop — DESIGN_APPROVED -> DESIGN_DEFICIENT -> DESIGN_APPROVED is a cycle on the design dimension."
      - from: DESIGN_DRAFT
        to: DESIGN_CARVED_OUT
        trigger: "system event: the control's SubserviceOrganization switches INCLUSIVE -> CARVE_OUT"
        actor: system
        preconditions: []
        side_effects:
          - "Control.in_scope = false"
      - from: DESIGN_MAPPED
        to: DESIGN_CARVED_OUT
        trigger: "system event: the control's SubserviceOrganization switches INCLUSIVE -> CARVE_OUT"
        actor: system
        preconditions: []
        side_effects:
          - "Control.in_scope = false"
          - "the control leaving scope itself removes its ACTIVE CriteriaMapping rows from every coverage variant, which drives the coverage recompute and any COVERAGE_LOSS gap creation described on the SubserviceOrganization INCLUSIVE -> CARVE_OUT transition"
      - from: DESIGN_APPROVED
        to: DESIGN_CARVED_OUT
        trigger: "system event: the control's SubserviceOrganization switches INCLUSIVE -> CARVE_OUT"
        actor: system
        preconditions: []
        side_effects:
          - "Control.in_scope = false"
          - "the control leaving scope itself removes its ACTIVE CriteriaMapping rows from every coverage variant, which drives the coverage recompute and any COVERAGE_LOSS gap creation described on the SubserviceOrganization INCLUSIVE -> CARVE_OUT transition"
    note: "Design dimension of the parallel pair on Control; evolves independently of operating_status."

  - entity: Control.operating_status
    initial_state: NOT_TESTED
    terminal_states: [TESTED_INEFFECTIVE]
    transitions:
      - from: NOT_TESTED
        to: IN_OBSERVATION
        trigger: "POST /soc/controls/{control_id}/transitions with action START_OBSERVATION, or the Engagement READINESS -> OBSERVATION cascade"
        actor: ComplianceLead
        preconditions:
          - "Control.design_status == DESIGN_APPROVED"
          - "Engagement.status == OBSERVATION"
          - "Control.in_scope == true"
        side_effects:
          - "no cross-entity effect"
      - from: IN_OBSERVATION
        to: TESTED_EFFECTIVE
        trigger: "system event: an AuditSample on this control reaches CONCLUDED_CLEAN"
        actor: system
        preconditions: []
        side_effects:
          - "Control.tested_item_count recomputed"
          - "recompute Engagement.criteria_coverage_pct_attestation (the control now qualifies under the attestation_view)"
      - from: IN_OBSERVATION
        to: TESTED_EXCEPTION
        trigger: "system event: AuditException rows are created by an AuditSample reaching CONCLUDED_EXCEPTIONS"
        actor: system
        preconditions: []
        side_effects:
          - "Control.tested_item_count recomputed"
          - "the control entering TESTED_EXCEPTION itself creates exactly one Gap with source EXCEPTION_CASCADE, severity HIGH, control_id == this control, audit_exception_id == the id of the created AuditException with the lowest item_ordinal"
          - "that Gap creation itself drives the recompute of Engagement.base_debt_points, Engagement.gap_debt_points and Engagement.gap_posture"
      - from: IN_OBSERVATION
        to: TESTED_INEFFECTIVE
        trigger: "system event: a calendar-run raises Control.evidence_missed_count to MISSED_INEFFECTIVE_THRESHOLD or above"
        actor: system
        preconditions: []
        side_effects:
          - "the control entering TESTED_INEFFECTIVE itself creates exactly one Gap with source EVIDENCE_MISS, severity HIGH, control_id == this control"
          - "that Gap creation itself drives the recompute of Engagement.base_debt_points, Engagement.gap_debt_points and Engagement.gap_posture"
      - from: TESTED_EFFECTIVE
        to: IN_OBSERVATION
        trigger: "POST /soc/audit-samples/{audit_sample_id}/void"
        actor: Auditor
        preconditions:
          - "the voided AuditSample is the sample that produced this control's current operating_status"
        side_effects:
          - "Control.tested_item_count recomputed"
      - from: TESTED_EXCEPTION
        to: IN_OBSERVATION
        trigger: "POST /soc/audit-samples/{audit_sample_id}/void"
        actor: Auditor
        preconditions:
          - "the voided AuditSample is the sample that produced this control's current operating_status"
        side_effects:
          - "every AuditException with audit_sample_id == the voided sample moves to disposition VOIDED"
          - "every Gap whose audit_exception_id is one of those exceptions moves to WITHDRAWN with debt_points 0"
          - "Control.tested_item_count recomputed"
          - "recompute Engagement.open_exception_count, Engagement.base_debt_points, Engagement.gap_debt_points and Engagement.gap_posture"
    note: "Operating dimension of the parallel pair on Control. design_status and operating_status advance on disjoint triggers and neither is a precondition of the other's forward edges, except that NOT_TESTED -> IN_OBSERVATION reads design_status."

  - entity: EvidenceRequest
    initial_state: SCHEDULED
    terminal_states: [ACCEPTED, MISSED, WAIVED]
    transitions:
      - from: SCHEDULED
        to: SUBMITTED
        trigger: "POST /soc/evidence-requests/{evidence_request_id}/submit"
        actor: ControlOwner
        preconditions:
          - "Engagement.status == OBSERVATION"
          - "Engagement.gap_posture != FROZEN"
          - "X-User-ID == Control.owner_user_id for the EvidenceRequest's control_id"
          - "logical clock <= EvidenceRequest.due_date"
        side_effects:
          - "EvidenceRequest.submitted_at = logical clock; EvidenceRequest.submitted_by_user_id = X-User-ID"
          - "EvidenceRequest.late = (submitted_at > due_date) which is always false on this edge"
          - "Control.evidence_scheduled_count -= 1"
      - from: REJECTED
        to: SUBMITTED
        trigger: "POST /soc/evidence-requests/{evidence_request_id}/submit"
        actor: ControlOwner
        preconditions:
          - "Engagement.status == OBSERVATION"
          - "Engagement.gap_posture != FROZEN"
          - "X-User-ID == Control.owner_user_id for the EvidenceRequest's control_id"
          - "logical clock <= EvidenceRequest.due_date"
        side_effects:
          - "EvidenceRequest.submitted_at = logical clock; EvidenceRequest.submitted_by_user_id = X-User-ID"
        note: "Resubmission loop — SUBMITTED -> REJECTED -> SUBMITTED is the cycle on this entity."
      - from: SUBMITTED
        to: ACCEPTED
        trigger: "POST /soc/evidence-requests/{evidence_request_id}/review with action ACCEPT"
        actor: EvidenceReviewer
        preconditions:
          - "X-User-ID != Control.owner_user_id (segregation of duties)"
          - "X-User-ID != EvidenceRequest.submitted_by_user_id (segregation of duties)"
        side_effects:
          - "EvidenceRequest.reviewed_at = logical clock; EvidenceRequest.reviewed_by_user_id = X-User-ID"
          - "Control.evidence_accepted_count += 1"
      - from: SUBMITTED
        to: REJECTED
        trigger: "POST /soc/evidence-requests/{evidence_request_id}/review with action REJECT"
        actor: EvidenceReviewer
        preconditions:
          - "X-User-ID != Control.owner_user_id (segregation of duties)"
          - "X-User-ID != EvidenceRequest.submitted_by_user_id (segregation of duties)"
        side_effects:
          - "EvidenceRequest.rejection_round += 1"
          - "EvidenceRequest.reviewed_at = logical clock; EvidenceRequest.reviewed_by_user_id = X-User-ID"
          - "Control.evidence_scheduled_count += 1"
      - from: SUBMITTED
        to: WAIVED
        trigger: "POST /soc/evidence-requests/{evidence_request_id}/review with action WAIVE"
        actor: ComplianceLead
        preconditions:
          - "Engagement.gap_posture != FROZEN"
        side_effects:
          - "EvidenceRequest.reviewed_at = logical clock; EvidenceRequest.reviewed_by_user_id = X-User-ID"
      - from: SCHEDULED
        to: MISSED
        trigger: "system event: POST /soc/engagements/{engagement_id}/calendar-run observes logical clock > EvidenceRequest.due_date"
        actor: system
        preconditions:
          - "logical clock > EvidenceRequest.due_date"
        side_effects:
          - "Control.evidence_scheduled_count -= 1; Control.evidence_missed_count += 1"
          - "that increment itself moves Control.operating_status IN_OBSERVATION -> TESTED_INEFFECTIVE once Control.evidence_missed_count >= MISSED_INEFFECTIVE_THRESHOLD"
          - "that operating_status move itself creates one Gap with source EVIDENCE_MISS and severity HIGH"
          - "that Gap creation itself drives the recompute of Engagement.base_debt_points, Engagement.gap_debt_points and Engagement.gap_posture"
      - from: REJECTED
        to: MISSED
        trigger: "system event: POST /soc/engagements/{engagement_id}/calendar-run observes logical clock > EvidenceRequest.due_date"
        actor: system
        preconditions:
          - "logical clock > EvidenceRequest.due_date"
        side_effects:
          - "Control.evidence_scheduled_count -= 1; Control.evidence_missed_count += 1"
          - "that increment itself moves Control.operating_status IN_OBSERVATION -> TESTED_INEFFECTIVE once Control.evidence_missed_count >= MISSED_INEFFECTIVE_THRESHOLD"
          - "that operating_status move itself creates one Gap with source EVIDENCE_MISS and severity HIGH"
          - "that Gap creation itself drives the recompute of Engagement.base_debt_points, Engagement.gap_debt_points and Engagement.gap_posture"

  - entity: Gap
    initial_state: OPEN
    terminal_states: [WITHDRAWN]
    transitions:
      - from: OPEN
        to: PLANNED
        trigger: "POST /soc/gaps/{gap_id}/transitions with action PLAN"
        actor: ComplianceLead
        preconditions:
          - "payload remediation_owner_user_id is non-null"
          - "payload remediation_due_date is non-null"
        side_effects:
          - "Gap.remediation_owner_user_id and Gap.remediation_due_date stamped from the payload"
          - "Gap.debt_points unchanged (PLANNED is a non-settled state)"
      - from: REOPENED
        to: PLANNED
        trigger: "POST /soc/gaps/{gap_id}/transitions with action PLAN"
        actor: ComplianceLead
        preconditions:
          - "payload remediation_owner_user_id is non-null"
          - "payload remediation_due_date is non-null"
        side_effects:
          - "Gap.remediation_owner_user_id and Gap.remediation_due_date stamped from the payload"
        note: "Second lap of the remediation cycle."
      - from: PLANNED
        to: REMEDIATED
        trigger: "POST /soc/gaps/{gap_id}/transitions with action REMEDIATE"
        actor: ComplianceLead
        preconditions: []
        side_effects:
          - "Gap.debt_points = 0"
          - "recompute Engagement.base_debt_points, Engagement.gap_debt_points and Engagement.gap_posture"
          - "Control.open_gap_count recomputed when Gap.control_id is non-null"
      - from: REMEDIATED
        to: VERIFIED
        trigger: "POST /soc/gaps/{gap_id}/transitions with action VERIFY"
        actor: Auditor
        preconditions:
          - "X-User-ID != Gap.remediation_owner_user_id (segregation of duties)"
        side_effects:
          - "Gap.debt_points stays 0"
      - from: VERIFIED
        to: REOPENED
        trigger: "POST /soc/gaps/{gap_id}/transitions with action REOPEN"
        actor: Auditor
        preconditions:
          - "Engagement.status != ISSUED"
        side_effects:
          - "Gap.reopen_count += 1"
          - "Gap.debt_points = SEVERITY_POINTS[Gap.severity]"
          - "recompute Engagement.base_debt_points, Engagement.gap_debt_points and Engagement.gap_posture"
          - "Control.open_gap_count recomputed when Gap.control_id is non-null"
        note: "Reopen loop — VERIFIED -> REOPENED -> PLANNED -> REMEDIATED -> VERIFIED is the cycle on this entity."
      - from: OPEN
        to: WITHDRAWN
        trigger: "POST /soc/gaps/{gap_id}/transitions with action WITHDRAW, the Engagement ABANDON cascade, or the AuditSample void cascade"
        actor: ComplianceLead
        preconditions: []
        side_effects:
          - "Gap.debt_points = 0"
          - "recompute Engagement.base_debt_points, Engagement.gap_debt_points and Engagement.gap_posture"
      - from: PLANNED
        to: WITHDRAWN
        trigger: "POST /soc/gaps/{gap_id}/transitions with action WITHDRAW, the Engagement ABANDON cascade, or the AuditSample void cascade"
        actor: ComplianceLead
        preconditions: []
        side_effects:
          - "Gap.debt_points = 0"
          - "recompute Engagement.base_debt_points, Engagement.gap_debt_points and Engagement.gap_posture"
      - from: REOPENED
        to: WITHDRAWN
        trigger: "POST /soc/gaps/{gap_id}/transitions with action WITHDRAW, the Engagement ABANDON cascade, or the AuditSample void cascade"
        actor: ComplianceLead
        preconditions: []
        side_effects:
          - "Gap.debt_points = 0"
          - "recompute Engagement.base_debt_points, Engagement.gap_debt_points and Engagement.gap_posture"
      - from: REMEDIATED
        to: WITHDRAWN
        trigger: "the Engagement ABANDON cascade or the AuditSample void cascade"
        actor: system
        preconditions: []
        side_effects:
          - "Gap.debt_points stays 0"

  - entity: AuditSample
    initial_state: DRAWN
    terminal_states: [VOIDED]
    transitions:
      - from: DRAWN
        to: TESTING
        trigger: "system event: the first POST /soc/audit-samples/{audit_sample_id}/items call records an item"
        actor: system
        preconditions:
          - "AuditSample.sample_size >= 1"
        side_effects:
          - "AuditSample.items_recorded, items_passed, items_failed and items_not_provided updated"
      - from: TESTING
        to: CONCLUDED_CLEAN
        trigger: "POST /soc/audit-samples/{audit_sample_id}/conclude"
        actor: Auditor
        preconditions:
          - "AuditSample.items_recorded == AuditSample.sample_size"
          - "AuditSample.items_failed <= AuditSample.allowed_deviations"
        side_effects:
          - "AuditSample.deviation_rate and AuditSample.projected_failures stamped from the deviation_rate_view variant of calculations.exception_projection"
          - "Control.operating_status IN_OBSERVATION -> TESTED_EFFECTIVE"
          - "recompute Engagement.criteria_coverage_pct_attestation and Engagement.readiness_score"
        note: "Clean arm of the branch: no AuditException rows are created and Engagement.open_exception_count is unchanged."
      - from: TESTING
        to: CONCLUDED_EXCEPTIONS
        trigger: "POST /soc/audit-samples/{audit_sample_id}/conclude"
        actor: Auditor
        preconditions:
          - "AuditSample.items_recorded == AuditSample.sample_size"
          - "AuditSample.items_failed > AuditSample.allowed_deviations"
        side_effects:
          - "AuditSample.deviation_rate and AuditSample.projected_failures stamped from the deviation_rate_view variant of calculations.exception_projection"
          - "one AuditException row is created for every recorded item whose outcome was FAIL or NOT_PROVIDED, in ascending item_ordinal order, each with disposition UNEVALUATED"
          - "the creation of those AuditException rows itself moves Control.operating_status IN_OBSERVATION -> TESTED_EXCEPTION and raises Engagement.open_exception_count by the number of rows created"
          - "the control entering TESTED_EXCEPTION itself creates one Gap with source EXCEPTION_CASCADE, severity HIGH and audit_exception_id equal to the created exception with the lowest item_ordinal"
          - "that Gap creation itself drives the recompute of Engagement.base_debt_points, Engagement.gap_debt_points and Engagement.gap_posture"
        note: "Exception arm of the branch: the side-effect set is strictly larger than the clean arm and is the origin of the depth-4 cascade."
      - from: DRAWN
        to: CONCLUDED_CLEAN
        trigger: "POST /soc/audit-samples (create) when Control.population_size == 0"
        actor: system
        preconditions:
          - "AuditSample.zero_population == true"
        side_effects:
          - "AuditSample.sample_size = 0, allowed_deviations = 0, deviation_rate = 0.0000, projected_failures = 0.00"
          - "Control.operating_status IN_OBSERVATION -> TESTED_EFFECTIVE"
          - "recompute Engagement.criteria_coverage_pct_attestation"
        note: "Empty-population boundary: the sample is minted directly into CONCLUDED_CLEAN inside the create call and never passes through TESTING."
      - from: CONCLUDED_CLEAN
        to: VOIDED
        trigger: "POST /soc/audit-samples/{audit_sample_id}/void"
        actor: Auditor
        preconditions:
          - "Engagement.status != ISSUED"
        side_effects:
          - "AuditSample.voided_at = logical clock"
          - "Control.operating_status TESTED_EFFECTIVE -> IN_OBSERVATION"
          - "Control.tested_item_count recomputed"
      - from: CONCLUDED_EXCEPTIONS
        to: VOIDED
        trigger: "POST /soc/audit-samples/{audit_sample_id}/void"
        actor: Auditor
        preconditions:
          - "Engagement.status != ISSUED"
        side_effects:
          - "AuditSample.voided_at = logical clock"
          - "every AuditException with audit_sample_id == this sample moves to disposition VOIDED with severity_assigned null"
          - "every Gap whose audit_exception_id is one of those exceptions moves to WITHDRAWN with debt_points 0"
          - "Control.operating_status TESTED_EXCEPTION -> IN_OBSERVATION; Control.tested_item_count recomputed"
          - "recompute Engagement.open_exception_count, Engagement.base_debt_points, Engagement.gap_debt_points and Engagement.gap_posture"
        note: "Compensating arm: the full side-effect set of the CONCLUDED_EXCEPTIONS arm is reversed, leaving Engagement.open_exception_count at its pre-conclusion value."

  - entity: AuditException
    initial_state: UNEVALUATED
    terminal_states: [VOIDED]
    transitions:
      - from: UNEVALUATED
        to: ISOLATED
        trigger: "POST /soc/audit-exceptions/{audit_exception_id}/evaluate with disposition ISOLATED"
        actor: Auditor
        preconditions:
          - "the parent AuditSample.status == CONCLUDED_EXCEPTIONS"
          - "Engagement.status in {FIELDWORK, REPORTING}"
        side_effects:
          - "AuditException.projected_failures_upper and AuditException.pervasive_recommended stamped from the upper_precision_view variant of calculations.exception_projection"
          - "AuditException.severity_assigned = MODERATE"
          - "the Gap whose audit_exception_id == this exception keeps severity HIGH (an ISOLATED disposition never de-escalates an already created gap)"
      - from: UNEVALUATED
        to: PERVASIVE
        trigger: "POST /soc/audit-exceptions/{audit_exception_id}/evaluate with disposition PERVASIVE"
        actor: Auditor
        preconditions:
          - "the parent AuditSample.status == CONCLUDED_EXCEPTIONS"
          - "Engagement.status in {FIELDWORK, REPORTING}"
        side_effects:
          - "AuditException.projected_failures_upper and AuditException.pervasive_recommended stamped from the upper_precision_view variant of calculations.exception_projection"
          - "AuditException.severity_assigned = CRITICAL"
          - "Control.design_status DESIGN_APPROVED -> DESIGN_DEFICIENT"
          - "the design_status move itself escalates the Gap whose audit_exception_id == this exception from severity HIGH to severity CRITICAL"
          - "that severity escalation itself drives the recompute of Engagement.base_debt_points, Engagement.gap_debt_points and Engagement.gap_posture"
      - from: UNEVALUATED
        to: VOIDED
        trigger: "system event: the parent AuditSample is voided"
        actor: system
        preconditions: []
        side_effects:
          - "Engagement.open_exception_count recomputed"
      - from: ISOLATED
        to: VOIDED
        trigger: "system event: the parent AuditSample is voided"
        actor: system
        preconditions: []
        side_effects:
          - "AuditException.severity_assigned = null"
          - "Engagement.open_exception_count recomputed"
      - from: PERVASIVE
        to: VOIDED
        trigger: "system event: the parent AuditSample is voided"
        actor: system
        preconditions: []
        side_effects:
          - "AuditException.severity_assigned = null"
          - "Engagement.open_exception_count recomputed"

  - entity: SubserviceOrganization
    initial_state: CARVE_OUT
    terminal_states: []
    transitions:
      - from: CARVE_OUT
        to: INCLUSIVE
        trigger: "POST /soc/subservice-organizations/{subservice_organization_id}/set-method with method INCLUSIVE"
        actor: ComplianceLead
        preconditions:
          - "Engagement.status in {SCOPING, READINESS}"
          - "for every other SubserviceOrganization S of the same engagement with method == INCLUSIVE, the closed interval [coverage_start, coverage_end] of this row and of S are separated by at least SUBSERVICE_BUFFER_DAYS whole days of clear space"
        side_effects:
          - "SubserviceOrganization.method = INCLUSIVE; SubserviceOrganization.carved_out_at unchanged"
          - "every Control with subservice_organization_id == this row and design_status == DESIGN_CARVED_OUT moves to design_status DESIGN_DRAFT with in_scope = true"
          - "SubserviceOrganization.inclusive_control_count recomputed"
          - "recompute Engagement.criteria_coverage_pct_readiness and Engagement.criteria_coverage_pct_attestation"
      - from: INCLUSIVE
        to: CARVE_OUT
        trigger: "POST /soc/subservice-organizations/{subservice_organization_id}/set-method with method CARVE_OUT"
        actor: ComplianceLead
        preconditions:
          - "Engagement.status in {SCOPING, READINESS}"
          - "payload csoc_narrative is non-null"
        side_effects:
          - "SubserviceOrganization.method = CARVE_OUT; csoc_narrative stamped; csoc_articulated = true; carved_out_at = logical clock"
          - "that method change itself moves every Control with subservice_organization_id == this row to design_status DESIGN_CARVED_OUT with in_scope = false"
          - "those controls leaving scope themselves drop their ACTIVE CriteriaMapping rows out of both coverage variants, which recomputes Engagement.covered_criteria_count_readiness, covered_criteria_count_attestation, criteria_coverage_pct_readiness, criteria_coverage_pct_attestation and readiness_score"
          - "the coverage recompute itself creates one Gap with source COVERAGE_LOSS, severity HIGH, control_id null and trust_criterion_id set, for every in-scope TrustCriterion that was covered under the readiness_view before this call and is not covered after it, in ascending TrustCriterion.criterion_code order"
          - "those Gap creations themselves drive the recompute of Engagement.base_debt_points, Engagement.gap_debt_points and Engagement.gap_posture"
        note: "Origin of the depth-4 carve-out cascade; distinct from the sampling cascade both in trigger and in the entities it walks."

  - entity: CUEC
    initial_state: DRAFT
    terminal_states: [RETIRED]
    transitions:
      - from: DRAFT
        to: ARTICULATED
        trigger: "POST /soc/cuecs/{cuec_id}/articulate with action ARTICULATE"
        actor: ComplianceLead
        preconditions:
          - "Engagement.status in {READINESS, OBSERVATION, FIELDWORK, REPORTING}"
          - "the referenced TrustCriterion.category is a member of Engagement.required_criteria_categories"
          - "the referenced TrustCriterion.applies_to_report_types contains Engagement.report_type"
        side_effects:
          - "CUEC.articulated_at = logical clock"
      - from: ARTICULATED
        to: RETIRED
        trigger: "POST /soc/cuecs/{cuec_id}/articulate with action RETIRE"
        actor: ComplianceLead
        preconditions:
          - "Engagement.status != ISSUED"
        side_effects:
          - "the CUEC stops counting toward the third bucket of calculations.questionnaire_deflection_waterfall"
      - from: DRAFT
        to: RETIRED
        trigger: "POST /soc/cuecs/{cuec_id}/articulate with action RETIRE"
        actor: ComplianceLead
        preconditions:
          - "Engagement.status != ISSUED"
        side_effects:
          - "no cross-entity effect"

  - entity: CriteriaMapping
    initial_state: ACTIVE
    terminal_states: [RETIRED]
    transitions:
      - from: ACTIVE
        to: RETIRED
        trigger: "DELETE /soc/criteria-mappings/{criteria_mapping_id}"
        actor: ComplianceLead
        preconditions:
          - "Engagement.status in {SCOPING, READINESS, OBSERVATION}"
          - "Engagement.gap_posture != FROZEN"
        side_effects:
          - "CriteriaMapping.retired_at = logical clock"
          - "Control.active_mapping_count and Control.primary_mapping_count recomputed"
          - "Control.design_status DESIGN_MAPPED -> DESIGN_DRAFT when active_mapping_count reaches 0"
          - "recompute Engagement.covered_criteria_count_readiness, covered_criteria_count_attestation, criteria_coverage_pct_readiness, criteria_coverage_pct_attestation and readiness_score"

  - entity: ReportDistribution
    initial_state: REQUESTED
    terminal_states: [REVOKED, DENIED]
    transitions:
      - from: REQUESTED
        to: NDA_PENDING
        trigger: "POST /soc/report-distributions/{report_distribution_id}/transitions with action REQUEST_NDA"
        actor: AccountExecutive
        preconditions: []
        side_effects:
          - "no cross-entity effect"
      - from: NDA_PENDING
        to: APPROVED
        trigger: "POST /soc/report-distributions/{report_distribution_id}/transitions with action APPROVE"
        actor: ComplianceLead
        preconditions:
          - "payload nda_reference is non-null"
        side_effects:
          - "ReportDistribution.nda_reference stamped from the payload"
      - from: REQUESTED
        to: DENIED
        trigger: "POST /soc/report-distributions/{report_distribution_id}/transitions with action DENY"
        actor: ComplianceLead
        preconditions: []
        side_effects:
          - "no cross-entity effect"
      - from: NDA_PENDING
        to: DENIED
        trigger: "POST /soc/report-distributions/{report_distribution_id}/transitions with action DENY"
        actor: ComplianceLead
        preconditions: []
        side_effects:
          - "no cross-entity effect"
      - from: APPROVED
        to: DELIVERED
        trigger: "POST /soc/report-distributions/{report_distribution_id}/transitions with action DELIVER"
        actor: AccountExecutive
        preconditions:
          - "Engagement.status == ISSUED"
          - "Engagement.gap_posture == OPEN"
        side_effects:
          - "ReportDistribution.delivered_at = logical clock"
          - "ReportDistribution.report_period_start and report_period_end snapshotted from Engagement.observation_period_start and observation_period_end"
      - from: DELIVERED
        to: REVOKED
        trigger: "POST /soc/report-distributions/{report_distribution_id}/transitions with action REVOKE"
        actor: ComplianceLead
        preconditions: []
        side_effects:
          - "ReportDistribution.revoked_at = logical clock"
          - "every CustomerQuestionnaire with report_distribution_id == this row and status != CLOSED moves to CLOSED with deflected_by_report_count = 0, deflected_by_bridge_count = 0, deflected_by_cuec_count = 0, manual_response_count = item_count, deflection_ratio = 0.0000 and bridge_letter_id_used = null"

  - entity: BridgeLetter
    initial_state: DRAFT
    terminal_states: [EXPIRED, SUPERSEDED]
    transitions:
      - from: DRAFT
        to: ISSUED
        trigger: "POST /soc/bridge-letters/{bridge_letter_id}/issue"
        actor: AccountExecutive
        preconditions:
          - "Engagement.status == ISSUED"
          - "Engagement.gap_posture == OPEN"
          - "at least one ReportDistribution of the same engagement has status DELIVERED"
          - "the closed interval [coverage_start, as_of_date] of this row does not intersect the closed interval of any other BridgeLetter of the same engagement whose status == ISSUED"
        side_effects:
          - "BridgeLetter.issued_at = logical clock; BridgeLetter.issued_by_user_id = X-User-ID"
          - "when supersedes_bridge_letter_id is non-null, that BridgeLetter moves from ISSUED to SUPERSEDED"
      - from: ISSUED
        to: EXPIRED
        trigger: "system event: POST /soc/engagements/{engagement_id}/calendar-run observes logical clock > BridgeLetter.as_of_date"
        actor: system
        preconditions:
          - "logical clock > BridgeLetter.as_of_date"
        side_effects:
          - "the letter stops qualifying for the bridge bucket of calculations.questionnaire_deflection_waterfall"
      - from: ISSUED
        to: SUPERSEDED
        trigger: "system event: another BridgeLetter of the same engagement is issued with supersedes_bridge_letter_id == this row"
        actor: system
        preconditions: []
        side_effects:
          - "the letter stops qualifying for the bridge bucket of calculations.questionnaire_deflection_waterfall"

  - entity: CustomerQuestionnaire
    initial_state: RECEIVED
    terminal_states: [CLOSED]
    transitions:
      - from: RECEIVED
        to: DEFLECTED
        trigger: "POST /soc/customer-questionnaires/{customer_questionnaire_id}/deflect"
        actor: AccountExecutive
        preconditions:
          - "the referenced ReportDistribution.status == DELIVERED"
          - "calculations.questionnaire_deflection_waterfall yields manual_response_count == 0 and item_count > 0"
        side_effects:
          - "the four bucket counters, deflection_ratio, as_of_date and bridge_letter_id_used are stamped"
      - from: RECEIVED
        to: PARTIALLY_DEFLECTED
        trigger: "POST /soc/customer-questionnaires/{customer_questionnaire_id}/deflect"
        actor: AccountExecutive
        preconditions:
          - "the referenced ReportDistribution.status == DELIVERED"
          - "calculations.questionnaire_deflection_waterfall yields 0 < manual_response_count < item_count"
        side_effects:
          - "the four bucket counters, deflection_ratio, as_of_date and bridge_letter_id_used are stamped"
      - from: RECEIVED
        to: MANUAL_RESPONSE
        trigger: "POST /soc/customer-questionnaires/{customer_questionnaire_id}/deflect"
        actor: AccountExecutive
        preconditions:
          - "the referenced ReportDistribution.status == DELIVERED"
          - "calculations.questionnaire_deflection_waterfall yields manual_response_count == item_count"
        side_effects:
          - "the four bucket counters, deflection_ratio, as_of_date and bridge_letter_id_used are stamped"
        note: "Includes the item_count == 0 degenerate case, where every bucket absorbs 0, manual_response_count == 0 == item_count and deflection_ratio is 0.0000."
      - from: DEFLECTED
        to: CLOSED
        trigger: "system event: the referenced ReportDistribution is revoked"
        actor: system
        preconditions: []
        side_effects:
          - "all bucket counters reset per the ReportDistribution REVOKE cascade"
      - from: PARTIALLY_DEFLECTED
        to: CLOSED
        trigger: "system event: the referenced ReportDistribution is revoked"
        actor: system
        preconditions: []
        side_effects:
          - "all bucket counters reset per the ReportDistribution REVOKE cascade"
      - from: MANUAL_RESPONSE
        to: CLOSED
        trigger: "system event: the referenced ReportDistribution is revoked"
        actor: system
        preconditions: []
        side_effects:
          - "all bucket counters reset per the ReportDistribution REVOKE cascade"
      - from: RECEIVED
        to: CLOSED
        trigger: "system event: the referenced ReportDistribution is revoked"
        actor: system
        preconditions: []
        side_effects:
          - "all bucket counters reset per the ReportDistribution REVOKE cascade"

# ---------------------------------------------------------------------------
# §1.2.1 Concurrency Rules (OCC on a parent entity's `version`)
# ---------------------------------------------------------------------------
concurrency_rules:
  - rule_id: system-description-create-stale-engagement
    parent_entity: Engagement
    write_endpoint: "POST /soc/system-descriptions"
    occ_field: "expected_engagement_version"
    description: |
      Creating a SystemDescription against an Engagement whose version has
      advanced since the client last observed it is rejected. A new description
      legitimately supersedes the engagement's prior approved narrative under
      the SystemDescription IN_REVIEW -> APPROVED transition, so a writer whose
      view of the engagement predates that supersession is working from a stale
      boundary and must re-read before authoring.
    error_id: ERR_STALE_ENGAGEMENT_VERSION
    http_status: 412

  - rule_id: audit-sample-draw-stale-control
    parent_entity: Control
    write_endpoint: "POST /soc/audit-samples"
    occ_field: "expected_control_version"
    description: |
      Drawing an AuditSample against a Control whose version has advanced since
      the client last observed it is rejected. A fresh draw legitimately
      supersedes the prior non-voided sample on the same control, and sample
      size is derived from population_size, frequency, automation and
      risk_rating, so a writer holding a stale control view would size the
      sample against numbers the control no longer carries.
    error_id: ERR_STALE_CONTROL_VERSION
    http_status: 412

# ---------------------------------------------------------------------------
# §1.3 Calculation Rules Table
# ---------------------------------------------------------------------------
calculations:

  - name: criteria_coverage
    trigger: "Recomputed on POST /soc/criteria-mappings, DELETE /soc/criteria-mappings/{criteria_mapping_id}, Control.design_status DESIGN_MAPPED -> DESIGN_APPROVED, Control.design_status DESIGN_APPROVED -> DESIGN_DEFICIENT, Control.operating_status IN_OBSERVATION -> TESTED_EFFECTIVE, the SubserviceOrganization method switches, the Engagement SCOPING -> READINESS and FIELDWORK -> REPORTING transitions, and read on demand by GET /soc/engagements/{engagement_id}/readiness-summary. Writes Engagement.covered_criteria_count_readiness, covered_criteria_count_attestation, criteria_coverage_pct_readiness and criteria_coverage_pct_attestation."
    algorithm: aggregation
    formula: |
      # ---- in-scope criterion set (identical for both variants) ----
      in_scope_criteria = [ c in TrustCriterion
                            where c.category in Engagement.required_criteria_categories
                              and Engagement.report_type in c.applies_to_report_types ]
                          ordered by c.criterion_code ASC
      criteria_in_scope_count = len(in_scope_criteria)

      # ---- variant readiness_view ----
      covered_readiness(c) =
        EXISTS CriteriaMapping m where
             m.status == ACTIVE
         and m.trust_criterion_id == c.id
         and control(m).engagement_id == Engagement.id
         and control(m).in_scope == true
         and control(m).design_status in {DESIGN_MAPPED, DESIGN_APPROVED}
        # mapping_type is NOT consulted: SECONDARY mappings count here.

      # ---- variant attestation_view ----
      covered_attestation(c) =
        COUNT( CriteriaMapping m where
                    m.status == ACTIVE
                and m.mapping_type == PRIMARY
                and m.trust_criterion_id == c.id
                and control(m).engagement_id == Engagement.id
                and control(m).in_scope == true
                and control(m).design_status == DESIGN_APPROVED
                and control(m).operating_status == TESTED_EFFECTIVE )
        >= c.min_primary_controls

      covered_criteria_count_readiness   = count of c in in_scope_criteria with covered_readiness(c)
      covered_criteria_count_attestation = count of c in in_scope_criteria with covered_attestation(c)

      criteria_coverage_pct_readiness =
        0.00 if criteria_in_scope_count == 0
        else round_half_up(100 * covered_criteria_count_readiness / criteria_in_scope_count, 2)
      criteria_coverage_pct_attestation =
        0.00 if criteria_in_scope_count == 0
        else round_half_up(100 * covered_criteria_count_attestation / criteria_in_scope_count, 2)
    input_set: "TrustCriterion rows filtered by category membership in Engagement.required_criteria_categories and by report-type applicability; CriteriaMapping rows filtered to status == ACTIVE; Control rows filtered to in_scope == true and to the design_status / operating_status sets named per variant. RETIRED mappings, out-of-scope controls and DESIGN_CARVED_OUT / DESIGN_DEFICIENT controls are excluded from the attestation_view."
    constants: {}
    precision: "counts are integers; percentages 2 decimal places, round_half_up"
    variants:
      - name: readiness_view
        when: "Drives Engagement.covered_criteria_count_readiness / criteria_coverage_pct_readiness, the readiness_score input, and the pre/post comparison that decides which COVERAGE_LOSS gaps the carve-out cascade creates."
        difference: "Accepts SECONDARY mappings, accepts a control whose design_status is only DESIGN_MAPPED, and ignores operating_status and TrustCriterion.min_primary_controls entirely."
      - name: attestation_view
        when: "Drives Engagement.covered_criteria_count_attestation / criteria_coverage_pct_attestation and gates the Engagement REPORTING -> ISSUED transition."
        difference: "Requires at least TrustCriterion.min_primary_controls ACTIVE PRIMARY mappings to controls that are both DESIGN_APPROVED and TESTED_EFFECTIVE; the same mapping set can therefore report a strictly lower covered count than the readiness_view on identical data."

  - name: readiness_score
    trigger: "Recomputed on every write that changes criteria_coverage inputs — POST /soc/criteria-mappings, DELETE /soc/criteria-mappings/{criteria_mapping_id}, Control design/operating transitions, the SubserviceOrganization method switches, POST /soc/engagements/{engagement_id}/readiness-assessment, and the Engagement SCOPING -> READINESS transition. Writes Engagement.readiness_score."
    algorithm: weighted_scoring
    formula: |
      categories = Engagement.required_criteria_categories, deduplicated, sorted ASC by
                   the literal category string
      for each category k in categories:
          total_k   = count of in_scope_criteria (per calculations.criteria_coverage) with category == k
          covered_k = count of those with covered_readiness(c) == true
          raw_k     = 0 if total_k == 0 else (100 * covered_k / total_k)
          # PINNED ROUNDING ORDER: round EACH category to 2dp FIRST, then average.
          score_k   = round_half_up(raw_k, 2)
      readiness_score = round_half_up( sum(score_k for k in categories) / len(categories), 2 )
      # The alternative order — pooling covered and total across categories and
      # rounding once — is explicitly NOT used and yields different cents.
    input_set: "The same in-scope criterion set as calculations.criteria_coverage, partitioned by TrustCriterion.category; only categories listed in Engagement.required_criteria_categories are partitions, and a category with total_k == 0 contributes score_k = 0.00 while still counting toward len(categories)."
    constants: {}
    precision: "2 decimal places, round_half_up, applied twice: once per category and once to the final mean"
    variants: []

  - name: gap_debt_points
    trigger: "Recomputed on every Gap creation, on every Gap status transition, on the AuditException UNEVALUATED -> PERVASIVE severity escalation, on the AuditSample void cascade, and on the Engagement ABANDON cascade. Writes Engagement.base_debt_points and Engagement.gap_debt_points."
    algorithm: threshold
    formula: |
      # STEP 1 — base, over non-settled gaps only
      base_debt = sum( SEVERITY_POINTS[g.severity]
                       for g in Gap
                       where g.engagement_id == Engagement.id
                         and g.status in {OPEN, PLANNED, REOPENED} )
      # REMEDIATED, VERIFIED and WITHDRAWN gaps contribute 0.

      # STEP 2 — tier selection reads base_debt, the PRE-surcharge value.
      # This pins the otherwise circular-looking dependency between the
      # surcharge and the total it is added to.
      tier_rate = 0.00  if base_debt <= 10
                  0.15  if 11 <= base_debt <= 25
                  0.30  if base_debt >= 26

      # STEP 3 — surcharge, then total. The tier is NEVER re-selected from the
      # post-surcharge total.
      surcharge       = round_half_up(base_debt * tier_rate, 2)
      gap_debt_points = round_half_up(base_debt + surcharge, 2)
    input_set: "Gap rows of the engagement whose status is in {OPEN, PLANNED, REOPENED}. Gaps with control_id null (criterion-anchored coverage gaps) are included on equal footing with control-anchored gaps."
    constants:
      SEVERITY_POINTS: { LOW: 1, MODERATE: 3, HIGH: 8, CRITICAL: 20 }
      TIER_1_MAX_BASE: 10
      TIER_2_MAX_BASE: 25
      TIER_1_RATE: 0.00
      TIER_2_RATE: 0.15
      TIER_3_RATE: 0.30
    precision: "base_debt is an integer; surcharge and gap_debt_points are 2 decimal places, round_half_up"
    variants: []

  - name: engagement_gap_posture
    trigger: "Recomputed immediately after every write to Engagement.gap_debt_points or Engagement.open_exception_count, i.e. on Gap creation and every Gap transition, on the AuditSample CONCLUDED_EXCEPTIONS and VOIDED transitions, on the AuditException PERVASIVE evaluation, on the calendar-run evidence-miss cascade, and on the Engagement ABANDON cascade. Writes Engagement.gap_posture."
    algorithm: threshold
    formula: |
      # Precedence is strict: the first matching clause wins and no later
      # clause can downgrade the result.
      has_critical_live = EXISTS Gap g where g.engagement_id == Engagement.id
                                        and g.severity == CRITICAL
                                        and g.status in {OPEN, REOPENED}
      if has_critical_live
         or Engagement.gap_debt_points >= FROZEN_DEBT_THRESHOLD
         or Engagement.open_exception_count >= FROZEN_EXCEPTION_THRESHOLD:
          gap_posture = FROZEN
      elif Engagement.gap_debt_points >= RESTRICTED_DEBT_THRESHOLD
         or Engagement.open_exception_count >= RESTRICTED_EXCEPTION_THRESHOLD:
          gap_posture = RESTRICTED
      else:
          gap_posture = OPEN
      # Note: a CRITICAL gap in status PLANNED does NOT trip has_critical_live;
      # only OPEN and REOPENED do. Its 20 severity points still feed
      # gap_debt_points, which usually trips the FROZEN debt threshold anyway.
    input_set: "Engagement.gap_debt_points and Engagement.open_exception_count as written by calculations.gap_debt_points and by the exception cascades, plus the live-CRITICAL predicate over Gap rows of the engagement with status in {OPEN, REOPENED}."
    constants:
      FROZEN_DEBT_THRESHOLD: 26.00
      RESTRICTED_DEBT_THRESHOLD: 11.00
      FROZEN_EXCEPTION_THRESHOLD: 3
      RESTRICTED_EXCEPTION_THRESHOLD: 1
    precision: "comparisons are on the 2-decimal gap_debt_points value using >= (a value of exactly 11.00 is RESTRICTED; exactly 26.00 is FROZEN)"
    variants: []

  - name: sample_size_determination
    trigger: "Runs inside POST /soc/audit-samples. Writes AuditSample.population_size_snapshot, AuditSample.sample_size, AuditSample.allowed_deviations and AuditSample.zero_population."
    algorithm: tiered_pricing
    formula: |
      population = Control.population_size            # snapshotted onto the sample
      base       = FREQUENCY_BASE[Control.frequency]
      if Control.automation == AUTOMATED:
          base = max(1, ceil(base * AUTOMATION_FACTOR))
      raw = base + RISK_BUMP[Control.risk_rating]
      if Engagement.report_type == SOC_1_TYPE_2:
          raw = raw + SOC1_ADDENDUM
      sample_size        = min(raw, population)       # nested min over a max-derived base
      allowed_deviations = floor(sample_size * ALLOWED_DEVIATION_RATE)
      zero_population    = (population == 0)
      # zero_population implies sample_size == 0 and allowed_deviations == 0.
    input_set: "A single Control row (frequency, automation, risk_rating, population_size) plus the parent Engagement's report_type. No other control's numbers participate."
    constants:
      FREQUENCY_BASE: { DAILY: 25, WEEKLY: 15, MONTHLY: 5, QUARTERLY: 2, ANNUAL: 1, ADHOC: 8 }
      AUTOMATION_FACTOR: 0.4
      RISK_BUMP: { LOW: 0, MODERATE: 2, HIGH: 5 }
      SOC1_ADDENDUM: 1
      ALLOWED_DEVIATION_RATE: 0.10
    precision: "all outputs are integers; ceil is applied to the automation reduction, floor to the allowed-deviation budget"
    variants: []

  - name: exception_projection
    trigger: "The deviation_rate_view runs inside POST /soc/audit-samples/{audit_sample_id}/conclude and writes AuditSample.deviation_rate and AuditSample.projected_failures. The upper_precision_view runs inside POST /soc/audit-exceptions/{audit_exception_id}/evaluate and writes AuditException.projected_failures_upper and AuditException.pervasive_recommended."
    algorithm: weighted_scoring
    formula: |
      deviation_rate = 0.0000 if AuditSample.sample_size == 0
                       else round_half_up(AuditSample.items_failed / AuditSample.sample_size, 4)

      # ---- variant deviation_rate_view (sample-level, at conclusion) ----
      projected_failures = round_half_up(deviation_rate * AuditSample.population_size_snapshot, 2)

      # ---- variant upper_precision_view (exception-level, at evaluation) ----
      projected_failures_upper =
          ceil(deviation_rate * AuditSample.population_size_snapshot)
          + PRECISION_ALLOWANCE[Control.risk_rating]
      pervasive_recommended =
          projected_failures_upper > PERVASIVE_THRESHOLD_PCT * AuditSample.population_size_snapshot
    input_set: "One AuditSample row (sample_size, items_failed, population_size_snapshot) plus the risk_rating of its Control. items_failed counts both FAIL and NOT_PROVIDED item outcomes; PASS outcomes never enter the numerator."
    constants:
      PRECISION_ALLOWANCE: { LOW: 0, MODERATE: 1, HIGH: 2 }
      PERVASIVE_THRESHOLD_PCT: 0.20
    precision: "deviation_rate 4 decimal places round_half_up; projected_failures 2 decimal places round_half_up; projected_failures_upper is an integer produced by ceil then integer addition"
    variants:
      - name: deviation_rate_view
        when: "Sample conclusion — the number the auditor reports as the observed population effect."
        difference: "Multiplies the rounded deviation_rate by the population and rounds to cents; no allowance is added, so the result is a plain proportional projection."
      - name: upper_precision_view
        when: "Exception evaluation — the number that drives the PERVASIVE recommendation."
        difference: "Applies ceil before adding a risk-keyed PRECISION_ALLOWANCE, so on identical sample data it returns a strictly larger (and integer) projection than the deviation_rate_view whenever the allowance is non-zero or the proportional product is fractional."

  - name: evidence_calendar_generation
    trigger: "Runs inside POST /soc/controls/{control_id}/evidence-calendar. Creates EvidenceRequest rows and writes Control.evidence_scheduled_count."
    algorithm: interval_merge
    formula: |
      span_days = Engagement.observation_period_days
      if Control.frequency == ADHOC:
          periods = [ (observation_period_start, observation_period_end) ]   # exactly one
      else:
          d = PERIOD_DAYS[Control.frequency]
          n = floor(span_days / d)          # a trailing partial period is NOT scheduled
          periods = [ ( observation_period_start + i*d days,
                        observation_period_start + (i+1)*d days )
                      for i in 0 .. n-1 ]
      for i, (s, e) in enumerate(periods):          # i is the period_index
          create EvidenceRequest(control_id, period_index=i,
                                 period_start=s, period_end=e,
                                 due_date = e + GRACE_DAYS days,
                                 status = SCHEDULED)
      # Each period is the half-open interval [period_start, period_end); the
      # i-th period's period_end equals the (i+1)-th period's period_start and
      # the two do NOT collide under the overlap rule.
    input_set: "One Control row (frequency) plus its Engagement's observation_period_start / observation_period_end. Pre-existing EvidenceRequest rows on the control are never deleted or merged; the endpoint is rejected outright when the control already has any EvidenceRequest row."
    constants:
      PERIOD_DAYS: { DAILY: 1, WEEKLY: 7, MONTHLY: 30, QUARTERLY: 91, ANNUAL: 365 }
      GRACE_DAYS: 5
      MISSED_INEFFECTIVE_THRESHOLD: 2
    precision: "all instants are ISO 8601 UTC with three fractional digits; day arithmetic is exact 86400-second addition"
    variants: []

  - name: questionnaire_deflection_waterfall
    trigger: "Runs inside POST /soc/customer-questionnaires/{customer_questionnaire_id}/deflect. Writes the four bucket counters, deflection_ratio, bridge_letter_id_used, as_of_date and status."
    algorithm: waterfall_allocation
    formula: |
      item_count = criteria_item_count + post_period_item_count + cuec_item_count

      # ---- bucket 1: the issued report ----
      deflected_by_report_count =
          min(criteria_item_count, Engagement.covered_criteria_count_attestation)

      # ---- bucket 2: the bridge letter ----
      # eligibility filter: BridgeLetter rows of the engagement with status == ISSUED
      #   whose CLOSED coverage interval contains as_of_date, i.e.
      #   coverage_start <= as_of_date <= as_of_date_of_letter
      # ranking expression: as_of_date DESC (the letter reaching furthest forward)
      # tie-break: created_at ASC
      # empty-pool fallback: bucket absorbs 0 and bridge_letter_id_used stays null
      candidates = [ b in BridgeLetter where b.engagement_id == Engagement.id
                                         and b.status == ISSUED
                                         and b.coverage_start <= as_of_date
                                         and as_of_date <= b.as_of_date ]
      chosen = first of sort(candidates, key=(b.as_of_date DESC, b.created_at ASC))
      deflected_by_bridge_count = post_period_item_count if chosen is not null else 0
      bridge_letter_id_used     = chosen.id if chosen is not null else null

      # ---- bucket 3: articulated CUECs ----
      articulated_cuecs = count of CUEC where engagement_id == Engagement.id
                                          and articulation_status == ARTICULATED
      deflected_by_cuec_count = min(cuec_item_count, articulated_cuecs)

      # ---- bucket 4: remainder ----
      manual_response_count = item_count
                              - deflected_by_report_count
                              - deflected_by_bridge_count
                              - deflected_by_cuec_count
      deflection_ratio = 0.0000 if item_count == 0
                         else round_half_up((item_count - manual_response_count) / item_count, 4)
    input_set: "The questionnaire's three input counters; Engagement.covered_criteria_count_attestation as of the deflect call; BridgeLetter rows of the engagement with status == ISSUED (DRAFT, EXPIRED and SUPERSEDED letters are excluded); CUEC rows of the engagement with articulation_status == ARTICULATED (DRAFT and RETIRED excluded)."
    constants: {}
    precision: "bucket counters are integers; deflection_ratio 4 decimal places, round_half_up"
    variants: []

  - name: bridge_letter_coverage_days
    trigger: "Runs inside POST /soc/bridge-letters. Writes BridgeLetter.coverage_days."
    algorithm: interval_merge
    formula: |
      coverage_days = floor((as_of_date - coverage_start) / 86400 seconds) + 1
      # CLOSED interval: both endpoints are inside the window, so a one-instant
      # letter (as_of_date == coverage_start) has coverage_days == 1.
      reject when coverage_days > MAX_BRIDGE_DAYS
    input_set: "The single BridgeLetter row being created."
    constants:
      MAX_BRIDGE_DAYS: 120
      SUBSERVICE_BUFFER_DAYS: 1
    precision: "integer days"
    variants: []

  - name: readiness_assessment_gap_synthesis
    trigger: "Runs inside POST /soc/engagements/{engagement_id}/readiness-assessment. Creates Gap rows with source READINESS_ASSESSMENT, writes Engagement.readiness_assessed_at, and drives calculations.gap_debt_points and calculations.engagement_gap_posture."
    algorithm: constraint_propagation
    formula: |
      # PASS 1 — control-anchored gaps, iterated over Control rows of the
      # engagement with in_scope == true, ordered by Control.control_ref ASC.
      for control in controls_in_scope ordered by control_ref ASC:
          if control.primary_mapping_count == 0:
              severity = HIGH
          elif control.design_status != DESIGN_APPROVED:
              severity = RISK_SEVERITY[control.risk_rating]
          else:
              continue                     # no gap for this control
          # idempotence guard: skip when a Gap already exists with
          # source == READINESS_ASSESSMENT, control_id == control.id and
          # status not in {VERIFIED, WITHDRAWN}
          create Gap(engagement_id, control_id=control.id, trust_criterion_id=null,
                     source=READINESS_ASSESSMENT, severity=severity, status=OPEN)

      # PASS 2 — criterion-anchored gaps, iterated over the in-scope criterion
      # set of calculations.criteria_coverage, ordered by criterion_code ASC.
      for criterion in in_scope_criteria ordered by criterion_code ASC:
          if covered_readiness(criterion):
              continue
          severity = HIGH if criterion.category == SECURITY else MODERATE
          # idempotence guard: skip when a Gap already exists with
          # source == READINESS_ASSESSMENT, trust_criterion_id == criterion.id
          # and status not in {VERIFIED, WITHDRAWN}
          create Gap(engagement_id, control_id=null,
                     trust_criterion_id=criterion.id,
                     source=READINESS_ASSESSMENT, severity=severity, status=OPEN)

      Engagement.readiness_assessed_at = logical clock
    input_set: "Control rows of the engagement with in_scope == true, and the in-scope TrustCriterion set. Controls whose design_status is DESIGN_CARVED_OUT are excluded because in_scope is false for them. The two passes run strictly in the order written, and within each pass in the stated sort order, so repeated runs produce a deterministic, non-duplicating gap set."
    constants:
      RISK_SEVERITY: { LOW: LOW, MODERATE: MODERATE, HIGH: HIGH }
    precision: "n/a (row synthesis)"
    variants: []

# ---------------------------------------------------------------------------
# §1.4 Validation Rules Table (ordered by priority; lower number wins)
# ---------------------------------------------------------------------------
validations:
  - priority: 10
    category: auth
    check: "Both X-User-Role and X-User-ID request headers are present and non-empty."
    error_id: ERR_UNAUTHENTICATED
    http_status: 401
    applies_to: "all"
  - priority: 20
    category: auth
    check: "X-User-Role is one of the seven roles declared in §1.7."
    error_id: ERR_UNKNOWN_ROLE
    http_status: 401
    applies_to: "all"
  - priority: 30
    category: auth
    check: "The role in X-User-Role appears in the endpoint's roles list in §1.5. Evaluated BEFORE any path-id lookup, so a forbidden role calling a non-existent id sees the authorization error, not the not-found error."
    error_id: ERR_ROLE_NOT_PERMITTED
    http_status: 403
    applies_to: "all"
  - priority: 40
    category: auth
    check: "When X-User-Role is SubserviceContact, X-User-ID equals the id of an existing SubserviceOrganization whose method == INCLUSIVE."
    error_id: ERR_SUBSERVICE_NOT_INCLUSIVE
    http_status: 403
    applies_to: "every endpoint whose roles list contains SubserviceContact"
  - priority: 50
    category: existence
    check: "Every path-templated resource id resolves to a stored row, validated left-to-right along the path."
    error_id: "ERR_ENGAGEMENT_NOT_FOUND | ERR_SYSTEM_DESCRIPTION_NOT_FOUND | ERR_BOUNDARY_COMPONENT_NOT_FOUND | ERR_TRUST_CRITERION_NOT_FOUND | ERR_CONTROL_NOT_FOUND | ERR_CRITERIA_MAPPING_NOT_FOUND | ERR_EVIDENCE_REQUEST_NOT_FOUND | ERR_GAP_NOT_FOUND | ERR_AUDIT_SAMPLE_NOT_FOUND | ERR_AUDIT_EXCEPTION_NOT_FOUND | ERR_SUBSERVICE_ORG_NOT_FOUND | ERR_CUEC_NOT_FOUND | ERR_REPORT_DISTRIBUTION_NOT_FOUND | ERR_BRIDGE_LETTER_NOT_FOUND | ERR_QUESTIONNAIRE_NOT_FOUND"
    http_status: 404
    applies_to: "every endpoint with a path-templated id"
  - priority: 60
    category: existence
    check: "Every foreign-key id supplied in the request body resolves to a stored row of the declared parent entity."
    error_id: "ERR_ENGAGEMENT_NOT_FOUND | ERR_SYSTEM_DESCRIPTION_NOT_FOUND | ERR_TRUST_CRITERION_NOT_FOUND | ERR_CONTROL_NOT_FOUND | ERR_SUBSERVICE_ORG_NOT_FOUND | ERR_REPORT_DISTRIBUTION_NOT_FOUND | ERR_BRIDGE_LETTER_NOT_FOUND | ERR_AUDIT_SAMPLE_NOT_FOUND"
    http_status: 404
    applies_to: "every endpoint whose input carries a foreign-key field"
  - priority: 70
    category: business_constraint
    check: "Request body shape: every required input field of the endpoint is present, every value has the declared type, every enum value is a declared member, every count field is >= 0, and period_end / as_of_date ordering constraints hold."
    error_id: ERR_VALIDATION
    http_status: 422
    applies_to: "all"
  - priority: 80
    category: business_constraint
    check: "Pagination query parameters: limit is an integer in [1, 100] and offset is an integer >= 0."
    error_id: ERR_INVALID_PAGINATION
    http_status: 422
    applies_to: "every list endpoint"
  - priority: 90
    category: state
    check: "expected_engagement_version equals the current Engagement.version."
    error_id: ERR_STALE_ENGAGEMENT_VERSION
    http_status: 412
    applies_to: "POST /soc/system-descriptions"
  - priority: 100
    category: state
    check: "expected_control_version equals the current Control.version."
    error_id: ERR_STALE_CONTROL_VERSION
    http_status: 412
    applies_to: "POST /soc/audit-samples"
  - priority: 110
    category: state
    check: "The Engagement.status of the operation's engagement is a member of the phase set the operation requires (per the §1.2 transition preconditions)."
    error_id: ERR_ENGAGEMENT_PHASE_INVALID
    http_status: 409
    applies_to: "POST /soc/criteria-mappings; DELETE /soc/criteria-mappings/{criteria_mapping_id}; POST /soc/controls/{control_id}/transitions; POST /soc/evidence-requests/{evidence_request_id}/submit; POST /soc/audit-samples; POST /soc/audit-exceptions/{audit_exception_id}/evaluate; POST /soc/subservice-organizations/{subservice_organization_id}/set-method; POST /soc/cuecs/{cuec_id}/articulate; POST /soc/report-distributions/{report_distribution_id}/transitions; POST /soc/bridge-letters/{bridge_letter_id}/issue; POST /soc/engagements/{engagement_id}/readiness-assessment"
  - priority: 120
    category: state
    check: "Engagement.gap_posture != FROZEN. A FROZEN engagement rejects every gated child mutation regardless of any later business rule the same request would also violate."
    error_id: ERR_ENGAGEMENT_FROZEN
    http_status: 409
    applies_to: "POST /soc/criteria-mappings; DELETE /soc/criteria-mappings/{criteria_mapping_id}; POST /soc/evidence-requests/{evidence_request_id}/submit; POST /soc/evidence-requests/{evidence_request_id}/review; POST /soc/report-distributions/{report_distribution_id}/transitions with action DELIVER; POST /soc/bridge-letters/{bridge_letter_id}/issue"
  - priority: 130
    category: state
    check: "Engagement.gap_posture == OPEN for report-track operations (RESTRICTED is not sufficient)."
    error_id: ERR_ENGAGEMENT_RESTRICTED
    http_status: 409
    applies_to: "POST /soc/engagements/{engagement_id}/transitions with action START_REPORTING or ISSUE; POST /soc/report-distributions/{report_distribution_id}/transitions with action DELIVER; POST /soc/bridge-letters/{bridge_letter_id}/issue"
  - priority: 140
    category: state
    check: "The target row's own current state satisfies the transition's `from:` state and every non-cross-entity precondition declared in §1.2."
    error_id: ERR_INVALID_STATE
    http_status: 409
    applies_to: "every transition, submit, review, issue, deflect, conclude, void, evaluate, articulate and set-scope endpoint"
  - priority: 150
    category: state
    check: "The supplied `action` (or `disposition` / `method`) value is defined as an outgoing edge from the row's current state in §1.2."
    error_id: ERR_TRANSITION_NOT_ALLOWED
    http_status: 409
    applies_to: "every endpoint that takes an `action`, `disposition` or `method` field"
  - priority: 145
    category: business_referential
    check: "The engagement has at least one ReportDistribution with status == DELIVERED before a bridge letter may be issued, and the questionnaire's own referenced ReportDistribution has status == DELIVERED before it may be deflected."
    error_id: ERR_REPORT_NOT_DELIVERED
    http_status: 409
    applies_to: "POST /soc/bridge-letters/{bridge_letter_id}/issue; POST /soc/customer-questionnaires/{customer_questionnaire_id}/deflect"
  - priority: 155
    category: business_safety
    check: "The acting X-User-ID equals Control.owner_user_id of the EvidenceRequest's control. Evaluated BEFORE the submission-window check, so an off-owner submit made after the due date reports the ownership breach."
    error_id: ERR_NOT_CONTROL_OWNER
    http_status: 403
    applies_to: "POST /soc/evidence-requests/{evidence_request_id}/submit"
  - priority: 160
    category: business_safety
    check: "Segregation of duties: the acting X-User-ID differs from the identity that performed the preceding step — the SystemDescription author on APPROVE, the control owner and the submitter on evidence review, and the Gap remediation owner on VERIFY."
    error_id: ERR_SEGREGATION_OF_DUTIES
    http_status: 403
    applies_to: "POST /soc/system-descriptions/{system_description_id}/transitions with action APPROVE; POST /soc/evidence-requests/{evidence_request_id}/review; POST /soc/gaps/{gap_id}/transitions with action VERIFY"
  - priority: 170
    category: business_safety
    check: "Engagement.boundary_locked == true before a control's design can be approved."
    error_id: ERR_BOUNDARY_NOT_LOCKED
    http_status: 409
    applies_to: "POST /soc/controls/{control_id}/transitions with action APPROVE_DESIGN"
  - priority: 180
    category: business_safety
    check: "Every SubserviceOrganization of the engagement with method == CARVE_OUT has csoc_articulated == true before the engagement may advance to REPORTING; and a SystemDescription may not be APPROVED while any of its CARVED_OUT BoundaryComponents points at a SubserviceOrganization whose method is INCLUSIVE."
    error_id: ERR_CSOC_NOT_ARTICULATED
    http_status: 409
    applies_to: "POST /soc/engagements/{engagement_id}/transitions with action START_REPORTING; POST /soc/system-descriptions/{system_description_id}/transitions with action APPROVE"
  - priority: 190
    category: business_referential
    check: "The Control referenced by a mapping has in_scope == true and design_status != DESIGN_CARVED_OUT."
    error_id: ERR_CONTROL_OUT_OF_SCOPE
    http_status: 409
    applies_to: "POST /soc/criteria-mappings; POST /soc/audit-samples; POST /soc/controls/{control_id}/evidence-calendar"
  - priority: 200
    category: business_referential
    check: "The referenced TrustCriterion.category is a member of Engagement.required_criteria_categories and its applies_to_report_types contains Engagement.report_type."
    error_id: ERR_CRITERION_OUT_OF_SCOPE
    http_status: 409
    applies_to: "POST /soc/criteria-mappings; POST /soc/cuecs; POST /soc/cuecs/{cuec_id}/articulate"
  - priority: 210
    category: business_referential
    check: "Boundary scope coherence: scope_status == CARVED_OUT requires a non-null subservice_organization_id and a null exclusion_rationale; scope_status == EXCLUDED requires a non-null exclusion_rationale and a null subservice_organization_id; scope_status == IN_SCOPE requires both to be null."
    error_id: ERR_BOUNDARY_SCOPE_MISMATCH
    http_status: 422
    applies_to: "POST /soc/boundary-components; POST /soc/boundary-components/{boundary_component_id}/set-scope"
  - priority: 220
    category: business_referential
    check: "The boundary of a SystemDescription whose boundary_locked == true is immutable: no component may be created against it and no component's scope may be changed."
    error_id: ERR_BOUNDARY_LOCKED
    http_status: 409
    applies_to: "POST /soc/boundary-components; POST /soc/boundary-components/{boundary_component_id}/set-scope"
  - priority: 230
    category: business_temporal
    check: "Half-open occupation on a Control: the new EvidenceRequest's [period_start, period_end) must not intersect the [period_start, period_end) of any existing EvidenceRequest on the same control whose status is not MISSED. Touching endpoints (new.period_start == existing.period_end) do NOT intersect and are accepted."
    error_id: ERR_EVIDENCE_PERIOD_OVERLAP
    http_status: 409
    applies_to: "POST /soc/evidence-requests"
  - priority: 240
    category: business_temporal
    check: "Closed occupation on an Engagement: the letter's [coverage_start, as_of_date] must not intersect the closed interval of any other BridgeLetter of the same engagement with status == ISSUED. Touching endpoints DO intersect (both endpoints are inside the window) and are rejected."
    error_id: ERR_BRIDGE_WINDOW_OVERLAP
    http_status: 409
    applies_to: "POST /soc/bridge-letters/{bridge_letter_id}/issue"
  - priority: 250
    category: business_temporal
    check: "Buffered occupation on an Engagement's INCLUSIVE subservice organizations: for every other INCLUSIVE SubserviceOrganization S of the same engagement, let earlier be whichever window ends first and later the other; clear_space_days = floor((later.coverage_start - earlier.coverage_end) / 86400 seconds) - 1. The switch is rejected unless clear_space_days >= SUBSERVICE_BUFFER_DAYS (1). Overlapping windows give a negative clear_space_days and adjacent windows (later.coverage_start exactly one day after earlier.coverage_end) give 0, so both are rejected."
    error_id: ERR_SUBSERVICE_WINDOW_BUFFER
    http_status: 409
    applies_to: "POST /soc/subservice-organizations/{subservice_organization_id}/set-method with method INCLUSIVE"
  - priority: 260
    category: business_temporal
    check: "The logical clock is at or before EvidenceRequest.due_date at submission time."
    error_id: ERR_EVIDENCE_WINDOW_CLOSED
    http_status: 409
    applies_to: "POST /soc/evidence-requests/{evidence_request_id}/submit"
  - priority: 270
    category: business_temporal
    check: "The sample window satisfies period_start >= Engagement.observation_period_start and period_end <= Engagement.observation_period_end."
    error_id: ERR_SAMPLE_WINDOW_INVALID
    http_status: 409
    applies_to: "POST /soc/audit-samples"
  - priority: 280
    category: business_constraint
    check: "Uniqueness: Control.control_ref per engagement_id; SystemDescription.version_label per engagement_id; TrustCriterion.criterion_code globally; BoundaryComponent.name per system_description_id; SubserviceOrganization.name per engagement_id; EvidenceRequest.period_index per control_id; the (control_id, trust_criterion_id) pair among ACTIVE CriteriaMapping rows; ReportDistribution.recipient_name per engagement_id among rows whose status is not in {REVOKED, DENIED}."
    error_id: ERR_DUPLICATE_RESOURCE
    http_status: 409
    applies_to: "POST /soc/controls; POST /soc/system-descriptions; POST /soc/trust-criteria; POST /soc/boundary-components; POST /soc/subservice-organizations; POST /soc/evidence-requests; POST /soc/criteria-mappings; POST /soc/report-distributions"
  - priority: 290
    category: business_constraint
    check: "Every EvidenceRequest of the control is settled — status in {ACCEPTED, MISSED, WAIVED} — before a sample may be drawn."
    error_id: ERR_EVIDENCE_NOT_SETTLED
    http_status: 409
    applies_to: "POST /soc/audit-samples"
  - priority: 300
    category: business_constraint
    check: "AuditSample.items_recorded is strictly less than AuditSample.sample_size before another item may be recorded."
    error_id: ERR_SAMPLE_FULL
    http_status: 409
    applies_to: "POST /soc/audit-samples/{audit_sample_id}/items"
  - priority: 310
    category: business_constraint
    check: "AuditSample.items_recorded equals AuditSample.sample_size before the sample may be concluded."
    error_id: ERR_SAMPLE_INCOMPLETE
    http_status: 409
    applies_to: "POST /soc/audit-samples/{audit_sample_id}/conclude"
  - priority: 320
    category: business_constraint
    check: "The control has no existing EvidenceRequest row before its evidence calendar may be generated."
    error_id: ERR_CALENDAR_ALREADY_GENERATED
    http_status: 409
    applies_to: "POST /soc/controls/{control_id}/evidence-calendar"
  - priority: 330
    category: business_fiscal
    check: "The count of ReportDistribution rows of the engagement whose status is not in {REVOKED, DENIED} is strictly less than Engagement.max_distribution_recipients before another may be requested. Evaluated AFTER the uniqueness check, so a duplicate recipient submitted at the ceiling reports the duplicate."
    error_id: ERR_DISTRIBUTION_LIMIT_EXCEEDED
    http_status: 409
    applies_to: "POST /soc/report-distributions"

# ---------------------------------------------------------------------------
# §1.5 API Endpoint Table
# ---------------------------------------------------------------------------
endpoints:

  # ----- Engagement -----
  - method: POST
    path: "/soc/engagements"
    description: "Open a new SOC examination engagement in SCOPING."
    roles: [ComplianceLead]
    code: 201
    input: ["client_name", "report_type", "observation_period_start", "observation_period_end", "required_criteria_categories", "max_distribution_recipients?"]
    output: Engagement
    side_effects:
      - "status = SCOPING; gap_posture = OPEN; version = 1"
      - "observation_period_days computed from the half-open observation window"
      - "criteria_in_scope_count, criteria_coverage_pct_readiness, criteria_coverage_pct_attestation and readiness_score computed against the current TrustCriterion catalog"
  - method: GET
    path: "/soc/engagements/{engagement_id}"
    description: "Read one engagement including every derived posture and coverage field."
    roles: [ComplianceLead, ControlOwner, EvidenceReviewer, Auditor, AccountExecutive, SubserviceContact, PlatformAdmin]
    code: 200
    input: []
    output: Engagement
    side_effects: []
  - method: GET
    path: "/soc/engagements"
    description: "List engagements with pagination."
    roles: [ComplianceLead, ControlOwner, EvidenceReviewer, Auditor, AccountExecutive, SubserviceContact, PlatformAdmin]
    code: 200
    input: ["status?", "report_type?", "limit?", "offset?"]
    output: Engagement[]
    side_effects: []
  - method: POST
    path: "/soc/engagements/{engagement_id}/transitions"
    description: "Advance the engagement phase. action is one of START_READINESS, START_OBSERVATION, START_FIELDWORK, START_REPORTING, ISSUE, ABANDON."
    roles: [ComplianceLead, Auditor]
    code: 200
    input: ["action", "reason?"]
    output: Engagement
    side_effects:
      - "applies the matching §1.2 Engagement transition and its cascades"
      - "increments Engagement.version by 1"
  - method: GET
    path: "/soc/engagements/{engagement_id}/readiness-summary"
    description: "Computed read returning both coverage variants side by side plus the debt decomposition."
    roles: [ComplianceLead, ControlOwner, EvidenceReviewer, Auditor, AccountExecutive, SubserviceContact, PlatformAdmin]
    code: 200
    input: []
    output:
      criteria_in_scope_count: integer
      covered_criteria_count_readiness: integer
      covered_criteria_count_attestation: integer
      criteria_coverage_pct_readiness: number
      criteria_coverage_pct_attestation: number
      readiness_score: number
      base_debt_points: integer
      surcharge_points: number
      gap_debt_points: number
      gap_posture: string
      open_exception_count: integer
      open_gap_count: integer
    side_effects: []
  - method: POST
    path: "/soc/engagements/{engagement_id}/readiness-assessment"
    description: "Run calculations.readiness_assessment_gap_synthesis over the engagement, creating the deterministic READINESS_ASSESSMENT gap set."
    roles: [ComplianceLead]
    code: 200
    input: []
    output: Engagement
    side_effects:
      - "creates Gap rows per calculations.readiness_assessment_gap_synthesis"
      - "sets Engagement.readiness_assessed_at"
      - "recomputes Engagement.base_debt_points, gap_debt_points and gap_posture"
      - "increments Engagement.version by 1"
  - method: POST
    path: "/soc/engagements/{engagement_id}/calendar-run"
    description: "Ops-run checkpoint. Advances the evidence-calendar epoch: sweeps overdue EvidenceRequest rows to MISSED, expires ISSUED BridgeLetter rows past their as_of_date, and applies the resulting cascades."
    roles: [ComplianceLead, PlatformAdmin]
    code: 200
    input: []
    output:
      calendar_epoch: integer
      missed_evidence_count: integer
      expired_bridge_letter_count: integer
      gaps_created_count: integer
      gap_posture: string
      gap_debt_points: number
    side_effects:
      - "EvidenceRequest SCHEDULED/REJECTED -> MISSED for every row whose due_date is strictly before the logical clock, processed in ascending (control_id's control_ref, period_index) order"
      - "the resulting Control.evidence_missed_count increments drive the IN_OBSERVATION -> TESTED_INEFFECTIVE cascade and its EVIDENCE_MISS gaps"
      - "BridgeLetter ISSUED -> EXPIRED for every row whose as_of_date is strictly before the logical clock"
      - "increments Engagement.calendar_epoch and Engagement.version by 1"

  # ----- SystemDescription -----
  - method: POST
    path: "/soc/system-descriptions"
    description: "Author a new system description version for an engagement. Optimistically concurrent on the parent Engagement."
    roles: [ComplianceLead]
    code: 201
    input: [engagement_id, version_label, boundary_narrative, expected_engagement_version]
    output: SystemDescription
    side_effects:
      - "status = DRAFT; authored_by_user_id = X-User-ID; review_round = 0; boundary_locked = false"
      - "increments Engagement.version by 1"
  - method: GET
    path: "/soc/system-descriptions/{system_description_id}"
    description: "Read one system description."
    roles: [ComplianceLead, ControlOwner, EvidenceReviewer, Auditor, AccountExecutive, SubserviceContact, PlatformAdmin]
    code: 200
    input: []
    output: SystemDescription
    side_effects: []
  - method: GET
    path: "/soc/system-descriptions"
    description: "List system descriptions, filterable by engagement, status, or the description they supersede."
    roles: [ComplianceLead, ControlOwner, EvidenceReviewer, Auditor, AccountExecutive, SubserviceContact, PlatformAdmin]
    code: 200
    input: ["engagement_id?", "status?", "supersedes_system_description_id?", "limit?", "offset?"]
    output: SystemDescription[]
    side_effects: []
  - method: POST
    path: "/soc/system-descriptions/{system_description_id}/transitions"
    description: "Drive the authoring lifecycle. action is one of SUBMIT_REVIEW, RETURN_TO_DRAFT, APPROVE, WITHDRAW."
    roles: [ComplianceLead, Auditor]
    code: 200
    input: ["action", "reason?"]
    output: SystemDescription
    side_effects:
      - "applies the matching §1.2 SystemDescription transition, including the supersession cascade on APPROVE"
      - "increments Engagement.version by 1 on APPROVE"
  - method: POST
    path: "/soc/system-descriptions/{system_description_id}/lock-boundary"
    description: "Freeze the boundary of an APPROVED system description; a precondition of control design approval and of leaving SCOPING."
    roles: [ComplianceLead]
    code: 200
    input: []
    output: SystemDescription
    side_effects:
      - "SystemDescription.boundary_locked = true"
      - "Engagement.boundary_locked = true"
      - "increments Engagement.version by 1"

  # ----- BoundaryComponent -----
  - method: POST
    path: "/soc/boundary-components"
    description: "Add a component to a system description's boundary."
    roles: [ComplianceLead]
    code: 201
    input: ["system_description_id", "component_type", "name", "scope_status?", "subservice_organization_id?", "exclusion_rationale?"]
    output: BoundaryComponent
    side_effects:
      - "SystemDescription.in_scope_component_count and carved_out_component_count recomputed"
  - method: GET
    path: "/soc/boundary-components/{boundary_component_id}"
    description: "Read one boundary component."
    roles: [ComplianceLead, ControlOwner, EvidenceReviewer, Auditor, AccountExecutive, SubserviceContact, PlatformAdmin]
    code: 200
    input: []
    output: BoundaryComponent
    side_effects: []
  - method: GET
    path: "/soc/boundary-components"
    description: "List boundary components, filterable by description, subservice organization, or scope."
    roles: [ComplianceLead, ControlOwner, EvidenceReviewer, Auditor, AccountExecutive, SubserviceContact, PlatformAdmin]
    code: 200
    input: ["system_description_id?", "subservice_organization_id?", "scope_status?", "limit?", "offset?"]
    output: BoundaryComponent[]
    side_effects: []
  - method: POST
    path: "/soc/boundary-components/{boundary_component_id}/set-scope"
    description: "Move a component between IN_SCOPE, CARVED_OUT and EXCLUDED."
    roles: [ComplianceLead]
    code: 200
    input: ["scope_status", "subservice_organization_id?", "exclusion_rationale?"]
    output: BoundaryComponent
    side_effects:
      - "SystemDescription.in_scope_component_count and carved_out_component_count recomputed"

  # ----- TrustCriterion -----
  - method: POST
    path: "/soc/trust-criteria"
    description: "Add a trust services criterion to the global catalog."
    roles: [PlatformAdmin]
    code: 201
    input: ["criterion_code", "category", "title", "min_primary_controls?", "applies_to_report_types?"]
    output: TrustCriterion
    side_effects: []
  - method: GET
    path: "/soc/trust-criteria/{trust_criterion_id}"
    description: "Read one catalog criterion."
    roles: [ComplianceLead, ControlOwner, EvidenceReviewer, Auditor, AccountExecutive, SubserviceContact, PlatformAdmin]
    code: 200
    input: []
    output: TrustCriterion
    side_effects: []
  - method: GET
    path: "/soc/trust-criteria"
    description: "List catalog criteria."
    roles: [ComplianceLead, ControlOwner, EvidenceReviewer, Auditor, AccountExecutive, SubserviceContact, PlatformAdmin]
    code: 200
    input: ["category?", "limit?", "offset?"]
    output: TrustCriterion[]
    side_effects: []

  # ----- Control -----
  - method: POST
    path: "/soc/controls"
    description: "Add a control to an engagement's control set. Permitted only while Engagement.status is in {SCOPING, READINESS}."
    roles: [ComplianceLead]
    code: 201
    input: ["engagement_id", "control_ref", "title", "frequency", "automation?", "risk_rating?", "population_size?", "subservice_organization_id?"]
    output: Control
    side_effects:
      - "design_status = DESIGN_DRAFT; operating_status = NOT_TESTED; in_scope = (subservice_organization_id is null OR that organization's method == INCLUSIVE)"
      - "SubserviceOrganization.inclusive_control_count recomputed when subservice_organization_id is non-null"
  - method: GET
    path: "/soc/controls/{control_id}"
    description: "Read one control including both state dimensions and every derived counter."
    roles: [ComplianceLead, ControlOwner, EvidenceReviewer, Auditor, AccountExecutive, SubserviceContact, PlatformAdmin]
    code: 200
    input: []
    output: Control
    side_effects: []
  - method: GET
    path: "/soc/controls"
    description: "List controls, filterable by engagement, subservice organization, or either state dimension."
    roles: [ComplianceLead, ControlOwner, EvidenceReviewer, Auditor, AccountExecutive, SubserviceContact, PlatformAdmin]
    code: 200
    input: ["engagement_id?", "subservice_organization_id?", "design_status?", "operating_status?", "limit?", "offset?"]
    output: Control[]
    side_effects: []
  - method: POST
    path: "/soc/controls/{control_id}/assign-owner"
    description: "Assign the opaque ControlOwner operator id accountable for this control's evidence."
    roles: [ComplianceLead]
    code: 200
    input: [owner_user_id]
    output: Control
    side_effects:
      - "Control.owner_user_id set; no state dimension moves"
  - method: POST
    path: "/soc/controls/{control_id}/transitions"
    description: "Drive either control state dimension. action is one of APPROVE_DESIGN (design dimension) or START_OBSERVATION (operating dimension). The DESIGN_APPROVED -> DESIGN_DEFICIENT edge is system-driven only, from a PERVASIVE exception evaluation, and has no action value here."
    roles: [ComplianceLead, Auditor]
    code: 200
    input: ["action", "reason?"]
    output: Control
    side_effects:
      - "applies the matching §1.2 Control.design_status or Control.operating_status transition"
      - "recomputes the engagement coverage fields the transition declares"
  - method: POST
    path: "/soc/controls/{control_id}/evidence-calendar"
    description: "Generate the control's evidence calendar for the whole observation period per calculations.evidence_calendar_generation. Permitted only while Engagement.status is in {SCOPING, READINESS}."
    roles: [ComplianceLead]
    code: 201
    input: []
    output: EvidenceRequest[]
    side_effects:
      - "creates one EvidenceRequest per generated period, all in status SCHEDULED"
      - "Control.evidence_scheduled_count set to the number of rows created"

  # ----- CriteriaMapping -----
  - method: POST
    path: "/soc/criteria-mappings"
    description: "Map a control to a trust services criterion. Permitted only while Engagement.status is in {SCOPING, READINESS, OBSERVATION}."
    roles: [ComplianceLead]
    code: 201
    input: ["control_id", "trust_criterion_id", "mapping_type?", "rationale?"]
    output: CriteriaMapping
    side_effects:
      - "status = ACTIVE; Control.active_mapping_count and primary_mapping_count recomputed"
      - "Control.design_status DESIGN_DRAFT -> DESIGN_MAPPED when active_mapping_count reaches 1"
      - "recomputes Engagement coverage counts, both coverage percentages and readiness_score"
  - method: GET
    path: "/soc/criteria-mappings/{criteria_mapping_id}"
    description: "Read one mapping."
    roles: [ComplianceLead, ControlOwner, EvidenceReviewer, Auditor, AccountExecutive, SubserviceContact, PlatformAdmin]
    code: 200
    input: []
    output: CriteriaMapping
    side_effects: []
  - method: GET
    path: "/soc/criteria-mappings"
    description: "List mappings, filterable by control, criterion, or status."
    roles: [ComplianceLead, ControlOwner, EvidenceReviewer, Auditor, AccountExecutive, SubserviceContact, PlatformAdmin]
    code: 200
    input: ["control_id?", "trust_criterion_id?", "status?", "mapping_type?", "limit?", "offset?"]
    output: CriteriaMapping[]
    side_effects: []
  - method: DELETE
    path: "/soc/criteria-mappings/{criteria_mapping_id}"
    description: "Retire a mapping. The row is retained with status RETIRED and remains readable; it stops participating in every coverage variant."
    roles: [ComplianceLead]
    code: 200
    input: []
    output: CriteriaMapping
    side_effects:
      - "status = RETIRED; retired_at stamped"
      - "Control.active_mapping_count and primary_mapping_count recomputed; DESIGN_MAPPED -> DESIGN_DRAFT when the count reaches 0"
      - "recomputes Engagement coverage counts, both coverage percentages and readiness_score"

  # ----- EvidenceRequest -----
  - method: POST
    path: "/soc/evidence-requests"
    description: "Schedule a single evidence period on a control, outside the bulk calendar generator."
    roles: [ComplianceLead]
    code: 201
    input: [control_id, period_index, period_start, period_end]
    output: EvidenceRequest
    side_effects:
      - "status = SCHEDULED; due_date = period_end + GRACE_DAYS days"
      - "Control.evidence_scheduled_count += 1"
  - method: GET
    path: "/soc/evidence-requests/{evidence_request_id}"
    description: "Read one evidence request."
    roles: [ComplianceLead, ControlOwner, EvidenceReviewer, Auditor, AccountExecutive, SubserviceContact, PlatformAdmin]
    code: 200
    input: []
    output: EvidenceRequest
    side_effects: []
  - method: GET
    path: "/soc/evidence-requests"
    description: "List evidence requests, filterable by control and status."
    roles: [ComplianceLead, ControlOwner, EvidenceReviewer, Auditor, AccountExecutive, SubserviceContact, PlatformAdmin]
    code: 200
    input: ["control_id?", "status?", "limit?", "offset?"]
    output: EvidenceRequest[]
    side_effects: []
  - method: POST
    path: "/soc/evidence-requests/{evidence_request_id}/submit"
    description: "The control owner (or, for an INCLUSIVE subservice control, its subservice contact) submits the period's artifact."
    roles: [ControlOwner, SubserviceContact]
    code: 200
    input: [artifact_ref]
    output: EvidenceRequest
    side_effects:
      - "status SCHEDULED|REJECTED -> SUBMITTED; submitted_at and submitted_by_user_id stamped"
      - "Control.evidence_scheduled_count -= 1"
  - method: POST
    path: "/soc/evidence-requests/{evidence_request_id}/review"
    description: "Dispose of a submitted artifact. action is one of ACCEPT, REJECT, WAIVE."
    roles: [EvidenceReviewer, ComplianceLead]
    code: 200
    input: ["action", "review_note?"]
    output: EvidenceRequest
    side_effects:
      - "applies the matching §1.2 EvidenceRequest transition and updates the control's evidence counters"

  # ----- Gap -----
  - method: POST
    path: "/soc/gaps"
    description: "Log a gap by hand, outside the readiness assessment and the cascades."
    roles: [ComplianceLead]
    code: 201
    input: ["engagement_id", "control_id?", "trust_criterion_id?", "severity?", "description?"]
    output: Gap
    side_effects:
      - "status = OPEN; source = MANUAL; debt_points = SEVERITY_POINTS[severity]"
      - "recomputes Engagement.base_debt_points, gap_debt_points and gap_posture"
      - "Control.open_gap_count recomputed when control_id is non-null"
  - method: GET
    path: "/soc/gaps/{gap_id}"
    description: "Read one gap."
    roles: [ComplianceLead, ControlOwner, EvidenceReviewer, Auditor, AccountExecutive, SubserviceContact, PlatformAdmin]
    code: 200
    input: []
    output: Gap
    side_effects: []
  - method: GET
    path: "/soc/gaps"
    description: "List gaps, filterable by engagement, control, criterion, originating exception, status or source."
    roles: [ComplianceLead, ControlOwner, EvidenceReviewer, Auditor, AccountExecutive, SubserviceContact, PlatformAdmin]
    code: 200
    input: ["engagement_id?", "control_id?", "trust_criterion_id?", "audit_exception_id?", "status?", "source?", "limit?", "offset?"]
    output: Gap[]
    side_effects: []
  - method: POST
    path: "/soc/gaps/{gap_id}/transitions"
    description: "Drive the remediation loop. action is one of PLAN, REMEDIATE, VERIFY, REOPEN, WITHDRAW."
    roles: [ComplianceLead, Auditor]
    code: 200
    input: ["action", "remediation_owner_user_id?", "remediation_due_date?", "reason?"]
    output: Gap
    side_effects:
      - "applies the matching §1.2 Gap transition"
      - "recomputes Engagement.base_debt_points, gap_debt_points and gap_posture whenever debt_points changes"

  # ----- AuditSample -----
  - method: POST
    path: "/soc/audit-samples"
    description: "Draw a sample on a control. Permitted only while Engagement.status is in {OBSERVATION, FIELDWORK}. Optimistically concurrent on the parent Control. A control whose population_size is 0 yields a zero-population sample that is minted directly into CONCLUDED_CLEAN."
    roles: [Auditor]
    code: 201
    input: [control_id, period_start, period_end, expected_control_version]
    output: AuditSample
    side_effects:
      - "population_size_snapshot, sample_size, allowed_deviations and zero_population computed per calculations.sample_size_determination"
      - "supersedes_audit_sample_id set to the prior non-VOIDED sample on the same control, which is itself voided by that supersession"
      - "increments Control.version by 1"
  - method: GET
    path: "/soc/audit-samples/{audit_sample_id}"
    description: "Read one sample including its item tallies and projections."
    roles: [ComplianceLead, ControlOwner, EvidenceReviewer, Auditor, AccountExecutive, SubserviceContact, PlatformAdmin]
    code: 200
    input: []
    output: AuditSample
    side_effects: []
  - method: GET
    path: "/soc/audit-samples"
    description: "List samples, filterable by control, status, or the sample they supersede."
    roles: [ComplianceLead, ControlOwner, EvidenceReviewer, Auditor, AccountExecutive, SubserviceContact, PlatformAdmin]
    code: 200
    input: ["control_id?", "status?", "supersedes_audit_sample_id?", "limit?", "offset?"]
    output: AuditSample[]
    side_effects: []
  - method: POST
    path: "/soc/audit-samples/{audit_sample_id}/items"
    description: "Record one item test result. outcome is one of PASS, FAIL, NOT_PROVIDED. The item's ordinal is the pre-call items_recorded value."
    roles: [Auditor]
    code: 200
    input: ["outcome", "failure_reason?"]
    output: AuditSample
    side_effects:
      - "items_recorded += 1 and the matching tally (items_passed / items_failed / items_not_provided) incremented"
      - "status DRAWN -> TESTING on the first recorded item"
  - method: POST
    path: "/soc/audit-samples/{audit_sample_id}/conclude"
    description: "Close the sample. The branch taken is decided by items_failed against allowed_deviations."
    roles: [Auditor]
    code: 200
    input: []
    output: AuditSample
    side_effects:
      - "applies either the CONCLUDED_CLEAN or the CONCLUDED_EXCEPTIONS arm of the §1.2 AuditSample branch with its full cascade"
  - method: POST
    path: "/soc/audit-samples/{audit_sample_id}/void"
    description: "Void a concluded sample, compensating every side effect the conclusion produced."
    roles: [Auditor]
    code: 200
    input: ["reason?"]
    output: AuditSample
    side_effects:
      - "applies the §1.2 AuditSample VOIDED compensation, reversing exception, gap, control and engagement effects"

  # ----- AuditException -----
  - method: GET
    path: "/soc/audit-exceptions/{audit_exception_id}"
    description: "Read one exception. Exceptions are only ever created by the CONCLUDED_EXCEPTIONS cascade, so this and the list endpoint are their sole discovery channel."
    roles: [ComplianceLead, ControlOwner, EvidenceReviewer, Auditor, AccountExecutive, SubserviceContact, PlatformAdmin]
    code: 200
    input: []
    output: AuditException
    side_effects: []
  - method: GET
    path: "/soc/audit-exceptions"
    description: "List exceptions, filterable by sample, control or disposition; ordered by item_ordinal ASC within a sample."
    roles: [ComplianceLead, ControlOwner, EvidenceReviewer, Auditor, AccountExecutive, SubserviceContact, PlatformAdmin]
    code: 200
    input: ["audit_sample_id?", "control_id?", "disposition?", "limit?", "offset?"]
    output: AuditException[]
    side_effects: []
  - method: POST
    path: "/soc/audit-exceptions/{audit_exception_id}/evaluate"
    description: "Record the auditor's disposition. disposition is one of ISOLATED, PERVASIVE."
    roles: [Auditor]
    code: 200
    input: ["disposition", "evaluation_note?"]
    output: AuditException
    side_effects:
      - "stamps projected_failures_upper and pervasive_recommended from the upper_precision_view variant"
      - "applies the §1.2 AuditException transition, including the PERVASIVE design-deficiency and gap-escalation cascade"

  # ----- SubserviceOrganization -----
  - method: POST
    path: "/soc/subservice-organizations"
    description: "Register a subservice organization the service organization relies upon. New rows start in the CARVE_OUT method."
    roles: [ComplianceLead]
    code: 201
    input: [engagement_id, name, services_provided, coverage_start, coverage_end]
    output: SubserviceOrganization
    side_effects:
      - "method = CARVE_OUT; csoc_articulated = false; inclusive_control_count = 0"
  - method: GET
    path: "/soc/subservice-organizations/{subservice_organization_id}"
    description: "Read one subservice organization."
    roles: [ComplianceLead, ControlOwner, EvidenceReviewer, Auditor, AccountExecutive, SubserviceContact, PlatformAdmin]
    code: 200
    input: []
    output: SubserviceOrganization
    side_effects: []
  - method: GET
    path: "/soc/subservice-organizations"
    description: "List subservice organizations, filterable by engagement and method."
    roles: [ComplianceLead, ControlOwner, EvidenceReviewer, Auditor, AccountExecutive, SubserviceContact, PlatformAdmin]
    code: 200
    input: ["engagement_id?", "method?", "limit?", "offset?"]
    output: SubserviceOrganization[]
    side_effects: []
  - method: POST
    path: "/soc/subservice-organizations/{subservice_organization_id}/set-method"
    description: "Switch between the carve-out and inclusive presentation methods. method is one of CARVE_OUT, INCLUSIVE."
    roles: [ComplianceLead]
    code: 200
    input: ["method", "csoc_narrative?"]
    output: SubserviceOrganization
    side_effects:
      - "applies the matching §1.2 SubserviceOrganization transition, including the depth-4 carve-out cascade"

  # ----- CUEC -----
  - method: POST
    path: "/soc/cuecs"
    description: "Draft a complementary user entity control statement against an in-scope criterion."
    roles: [ComplianceLead]
    code: 201
    input: [engagement_id, trust_criterion_id, statement, deflection_topic]
    output: CUEC
    side_effects:
      - "articulation_status = DRAFT"
  - method: GET
    path: "/soc/cuecs/{cuec_id}"
    description: "Read one complementary user entity control."
    roles: [ComplianceLead, ControlOwner, EvidenceReviewer, Auditor, AccountExecutive, SubserviceContact, PlatformAdmin]
    code: 200
    input: []
    output: CUEC
    side_effects: []
  - method: GET
    path: "/soc/cuecs"
    description: "List complementary user entity controls, filterable by engagement, criterion and articulation status."
    roles: [ComplianceLead, ControlOwner, EvidenceReviewer, Auditor, AccountExecutive, SubserviceContact, PlatformAdmin]
    code: 200
    input: ["engagement_id?", "trust_criterion_id?", "articulation_status?", "limit?", "offset?"]
    output: CUEC[]
    side_effects: []
  - method: POST
    path: "/soc/cuecs/{cuec_id}/articulate"
    description: "Publish or retire a CUEC. action is one of ARTICULATE, RETIRE."
    roles: [ComplianceLead]
    code: 200
    input: [action]
    output: CUEC
    side_effects:
      - "applies the matching §1.2 CUEC transition; ARTICULATED rows become eligible for the third deflection bucket"

  # ----- ReportDistribution -----
  - method: POST
    path: "/soc/report-distributions"
    description: "Request that the finished report be distributed to a named user entity."
    roles: [AccountExecutive]
    code: 201
    input: [engagement_id, recipient_name, recipient_email]
    output: ReportDistribution
    side_effects:
      - "status = REQUESTED"
  - method: GET
    path: "/soc/report-distributions/{report_distribution_id}"
    description: "Read one distribution record."
    roles: [ComplianceLead, ControlOwner, EvidenceReviewer, Auditor, AccountExecutive, SubserviceContact, PlatformAdmin]
    code: 200
    input: []
    output: ReportDistribution
    side_effects: []
  - method: GET
    path: "/soc/report-distributions"
    description: "List distribution records, filterable by engagement and status."
    roles: [ComplianceLead, ControlOwner, EvidenceReviewer, Auditor, AccountExecutive, SubserviceContact, PlatformAdmin]
    code: 200
    input: ["engagement_id?", "status?", "limit?", "offset?"]
    output: ReportDistribution[]
    side_effects: []
  - method: POST
    path: "/soc/report-distributions/{report_distribution_id}/transitions"
    description: "Drive the distribution lifecycle. action is one of REQUEST_NDA, APPROVE, DENY, DELIVER, REVOKE."
    roles: [AccountExecutive, ComplianceLead]
    code: 200
    input: ["action", "nda_reference?", "reason?"]
    output: ReportDistribution
    side_effects:
      - "applies the matching §1.2 ReportDistribution transition, including the questionnaire-closing cascade on REVOKE"

  # ----- BridgeLetter -----
  - method: POST
    path: "/soc/bridge-letters"
    description: "Draft a bridge letter covering the gap period after the report period end."
    roles: [AccountExecutive]
    code: 201
    input: ["engagement_id", "coverage_start", "as_of_date", "supersedes_bridge_letter_id?"]
    output: BridgeLetter
    side_effects:
      - "status = DRAFT; coverage_days computed per calculations.bridge_letter_coverage_days"
  - method: GET
    path: "/soc/bridge-letters/{bridge_letter_id}"
    description: "Read one bridge letter."
    roles: [ComplianceLead, ControlOwner, EvidenceReviewer, Auditor, AccountExecutive, SubserviceContact, PlatformAdmin]
    code: 200
    input: []
    output: BridgeLetter
    side_effects: []
  - method: GET
    path: "/soc/bridge-letters"
    description: "List bridge letters, filterable by engagement, status, or the letter they supersede."
    roles: [ComplianceLead, ControlOwner, EvidenceReviewer, Auditor, AccountExecutive, SubserviceContact, PlatformAdmin]
    code: 200
    input: ["engagement_id?", "status?", "supersedes_bridge_letter_id?", "limit?", "offset?"]
    output: BridgeLetter[]
    side_effects: []
  - method: POST
    path: "/soc/bridge-letters/{bridge_letter_id}/issue"
    description: "Issue a drafted bridge letter, subject to the closed-interval overlap rule."
    roles: [AccountExecutive]
    code: 200
    input: []
    output: BridgeLetter
    side_effects:
      - "status DRAFT -> ISSUED; issued_at and issued_by_user_id stamped"
      - "the superseded letter, when declared, moves ISSUED -> SUPERSEDED"

  # ----- CustomerQuestionnaire -----
  - method: POST
    path: "/soc/customer-questionnaires"
    description: "Record an inbound customer security questionnaire against a delivered report."
    roles: [AccountExecutive]
    code: 201
    input: [engagement_id, report_distribution_id, customer_name, criteria_item_count, post_period_item_count, cuec_item_count]
    output: CustomerQuestionnaire
    side_effects:
      - "status = RECEIVED; item_count = criteria_item_count + post_period_item_count + cuec_item_count"
  - method: GET
    path: "/soc/customer-questionnaires/{customer_questionnaire_id}"
    description: "Read one questionnaire with its deflection decomposition."
    roles: [ComplianceLead, ControlOwner, EvidenceReviewer, Auditor, AccountExecutive, SubserviceContact, PlatformAdmin]
    code: 200
    input: []
    output: CustomerQuestionnaire
    side_effects: []
  - method: GET
    path: "/soc/customer-questionnaires"
    description: "List questionnaires, filterable by engagement, distribution, the bridge letter their deflection consumed, and status."
    roles: [ComplianceLead, ControlOwner, EvidenceReviewer, Auditor, AccountExecutive, SubserviceContact, PlatformAdmin]
    code: 200
    input: ["engagement_id?", "report_distribution_id?", "bridge_letter_id_used?", "status?", "limit?", "offset?"]
    output: CustomerQuestionnaire[]
    side_effects: []
  - method: POST
    path: "/soc/customer-questionnaires/{customer_questionnaire_id}/deflect"
    description: "Run calculations.questionnaire_deflection_waterfall as of the supplied instant and branch the questionnaire."
    roles: [AccountExecutive]
    code: 200
    input: [as_of_date]
    output: CustomerQuestionnaire
    side_effects:
      - "stamps the four bucket counters, deflection_ratio, bridge_letter_id_used and as_of_date"
      - "moves the row to DEFLECTED, PARTIALLY_DEFLECTED or MANUAL_RESPONSE per the branch"

  # ----- Test-driving surface -----
  - method: POST
    path: "/_clock/set_current_utc"
    description: "Set the server's logical clock. Before the first call the logical clock reads exactly 2026-08-01T00:00:00.000Z and never falls back to real wall-clock time; every due-date, expiry and window rule in this scaffold is evaluated against this logical clock."
    roles: [PlatformAdmin]
    code: 200
    input: [to_iso8601]
    output:
      current_utc: string
    side_effects:
      - "the logical clock is set; no entity is mutated and no sweep runs (sweeps require POST /soc/engagements/{engagement_id}/calendar-run)"

# ---------------------------------------------------------------------------
# §1.6 Error Code Catalog
# ---------------------------------------------------------------------------
errors:
  - id: ERR_UNAUTHENTICATED
    http: 401
    condition: "X-User-Role or X-User-ID header missing or empty."
  - id: ERR_UNKNOWN_ROLE
    http: 401
    condition: "X-User-Role is not one of the seven roles declared in §1.7."
  - id: ERR_ROLE_NOT_PERMITTED
    http: 403
    condition: "The acting role is not listed in the endpoint's roles; raised before any path-id lookup."
  - id: ERR_SUBSERVICE_NOT_INCLUSIVE
    http: 403
    condition: "X-User-Role is SubserviceContact but X-User-ID is not the id of a SubserviceOrganization whose method == INCLUSIVE."
  - id: ERR_ENGAGEMENT_NOT_FOUND
    http: 404
    condition: "No Engagement with the supplied path or body id."
  - id: ERR_SYSTEM_DESCRIPTION_NOT_FOUND
    http: 404
    condition: "No SystemDescription with the supplied path or body id."
  - id: ERR_BOUNDARY_COMPONENT_NOT_FOUND
    http: 404
    condition: "No BoundaryComponent with the supplied path id."
  - id: ERR_TRUST_CRITERION_NOT_FOUND
    http: 404
    condition: "No TrustCriterion with the supplied path or body id."
  - id: ERR_CONTROL_NOT_FOUND
    http: 404
    condition: "No Control with the supplied path or body id."
  - id: ERR_CRITERIA_MAPPING_NOT_FOUND
    http: 404
    condition: "No CriteriaMapping with the supplied path id."
  - id: ERR_EVIDENCE_REQUEST_NOT_FOUND
    http: 404
    condition: "No EvidenceRequest with the supplied path id."
  - id: ERR_GAP_NOT_FOUND
    http: 404
    condition: "No Gap with the supplied path id."
  - id: ERR_AUDIT_SAMPLE_NOT_FOUND
    http: 404
    condition: "No AuditSample with the supplied path or body id."
  - id: ERR_AUDIT_EXCEPTION_NOT_FOUND
    http: 404
    condition: "No AuditException with the supplied path id."
  - id: ERR_SUBSERVICE_ORG_NOT_FOUND
    http: 404
    condition: "No SubserviceOrganization with the supplied path or body id."
  - id: ERR_CUEC_NOT_FOUND
    http: 404
    condition: "No CUEC with the supplied path id."
  - id: ERR_REPORT_DISTRIBUTION_NOT_FOUND
    http: 404
    condition: "No ReportDistribution with the supplied path or body id."
  - id: ERR_BRIDGE_LETTER_NOT_FOUND
    http: 404
    condition: "No BridgeLetter with the supplied path or body id."
  - id: ERR_QUESTIONNAIRE_NOT_FOUND
    http: 404
    condition: "No CustomerQuestionnaire with the supplied path id."
  - id: ERR_VALIDATION
    http: 422
    condition: "Missing required field, wrong type, undeclared enum member, negative count, or a period_end / as_of_date that does not respect its ordering constraint."
  - id: ERR_INVALID_PAGINATION
    http: 422
    condition: "limit outside [1, 100] or offset below 0 on a list endpoint."
  - id: ERR_STALE_ENGAGEMENT_VERSION
    http: 412
    condition: "expected_engagement_version does not equal the current Engagement.version on POST /soc/system-descriptions."
  - id: ERR_STALE_CONTROL_VERSION
    http: 412
    condition: "expected_control_version does not equal the current Control.version on POST /soc/audit-samples."
  - id: ERR_ENGAGEMENT_PHASE_INVALID
    http: 409
    condition: "The engagement's status is outside the phase set the requested operation requires."
  - id: ERR_ENGAGEMENT_FROZEN
    http: 409
    condition: "Engagement.gap_posture == FROZEN and the requested operation is one of the posture-gated child mutations."
  - id: ERR_ENGAGEMENT_RESTRICTED
    http: 409
    condition: "Engagement.gap_posture is RESTRICTED (or FROZEN) and the requested operation is on the report track, which demands OPEN."
  - id: ERR_INVALID_STATE
    http: 409
    condition: "The target row's current state does not satisfy the requested transition's from-state or a non-cross-entity precondition."
  - id: ERR_TRANSITION_NOT_ALLOWED
    http: 409
    condition: "The supplied action / disposition / method value is not an outgoing edge from the row's current state."
  - id: ERR_REPORT_NOT_DELIVERED
    http: 409
    condition: "A bridge letter is issued before any distribution of the engagement reached DELIVERED, or a questionnaire is deflected while its own distribution has not reached DELIVERED."
  - id: ERR_NOT_CONTROL_OWNER
    http: 403
    condition: "The acting X-User-ID is not the Control.owner_user_id of the evidence request's control."
  - id: ERR_SEGREGATION_OF_DUTIES
    http: 403
    condition: "The acting X-User-ID is the same identity that performed the preceding step — the description's author on APPROVE, the control owner or the submitter on evidence review, or the gap's remediation owner on VERIFY."
  - id: ERR_BOUNDARY_NOT_LOCKED
    http: 409
    condition: "A control's design is approved while Engagement.boundary_locked is false."
  - id: ERR_CSOC_NOT_ARTICULATED
    http: 409
    condition: "A CARVE_OUT subservice organization has csoc_articulated == false when the engagement is advanced to REPORTING, or a CARVED_OUT boundary component points at an INCLUSIVE organization when the description is approved."
  - id: ERR_CONTROL_OUT_OF_SCOPE
    http: 409
    condition: "The referenced control has in_scope == false or design_status == DESIGN_CARVED_OUT."
  - id: ERR_CRITERION_OUT_OF_SCOPE
    http: 409
    condition: "The referenced criterion's category is absent from Engagement.required_criteria_categories or its applies_to_report_types omits the engagement's report_type."
  - id: ERR_BOUNDARY_SCOPE_MISMATCH
    http: 422
    condition: "scope_status and the subservice_organization_id / exclusion_rationale pair are incoherent."
  - id: ERR_BOUNDARY_LOCKED
    http: 409
    condition: "A boundary component is created against, or rescoped inside, a SystemDescription whose boundary_locked is true."
  - id: ERR_EVIDENCE_PERIOD_OVERLAP
    http: 409
    condition: "The new half-open [period_start, period_end) intersects a non-MISSED EvidenceRequest interval on the same control."
  - id: ERR_BRIDGE_WINDOW_OVERLAP
    http: 409
    condition: "The letter's closed [coverage_start, as_of_date] intersects — including at a single shared endpoint — the closed interval of another ISSUED letter of the same engagement."
  - id: ERR_SUBSERVICE_WINDOW_BUFFER
    http: 409
    condition: "Two INCLUSIVE subservice organizations of the same engagement are separated by fewer than SUBSERVICE_BUFFER_DAYS whole days of clear space."
  - id: ERR_EVIDENCE_WINDOW_CLOSED
    http: 409
    condition: "The logical clock is strictly after EvidenceRequest.due_date at submission time."
  - id: ERR_SAMPLE_WINDOW_INVALID
    http: 409
    condition: "The sample window is not contained in the engagement's observation period."
  - id: ERR_DUPLICATE_RESOURCE
    http: 409
    condition: "A uniqueness constraint named in validation priority 280 is violated."
  - id: ERR_EVIDENCE_NOT_SETTLED
    http: 409
    condition: "A sample is drawn while some EvidenceRequest of the control is still SCHEDULED, SUBMITTED or REJECTED."
  - id: ERR_SAMPLE_FULL
    http: 409
    condition: "An item result is recorded when items_recorded already equals sample_size."
  - id: ERR_SAMPLE_INCOMPLETE
    http: 409
    condition: "A sample is concluded before items_recorded reaches sample_size."
  - id: ERR_CALENDAR_ALREADY_GENERATED
    http: 409
    condition: "An evidence calendar is generated for a control that already carries at least one EvidenceRequest."
  - id: ERR_DISTRIBUTION_LIMIT_EXCEEDED
    http: 409
    condition: "A distribution is requested when the engagement already carries max_distribution_recipients rows whose status is not in {REVOKED, DENIED}."

# ---------------------------------------------------------------------------
# §1.7 RBAC Matrix (segregation of duties)
# ---------------------------------------------------------------------------
roles:
  - name: ComplianceLead
    description: "Owns the readiness track: authors system descriptions and boundaries, maps criteria to controls, assigns control owners, builds the evidence calendar, runs readiness assessments and the calendar ops-run, plans and remediates gaps, articulates CUECs, sets subservice presentation methods, and approves or denies distribution requests."
    identity: opaque
    exclusive_operations:
      - "POST /soc/engagements"
      - "POST /soc/system-descriptions"
      - "POST /soc/system-descriptions/{system_description_id}/lock-boundary"
      - "POST /soc/boundary-components"
      - "POST /soc/boundary-components/{boundary_component_id}/set-scope"
      - "POST /soc/controls"
      - "POST /soc/controls/{control_id}/assign-owner"
      - "POST /soc/controls/{control_id}/evidence-calendar"
      - "POST /soc/criteria-mappings"
      - "DELETE /soc/criteria-mappings/{criteria_mapping_id}"
      - "POST /soc/evidence-requests"
      - "POST /soc/gaps"
      - "POST /soc/subservice-organizations"
      - "POST /soc/subservice-organizations/{subservice_organization_id}/set-method"
      - "POST /soc/cuecs"
      - "POST /soc/cuecs/{cuec_id}/articulate"
      - "POST /soc/engagements/{engagement_id}/readiness-assessment"
    shared_operations:
      - "POST /soc/engagements/{engagement_id}/transitions (START_READINESS, START_OBSERVATION, START_FIELDWORK, ABANDON; the START_REPORTING and ISSUE actions are Auditor-only)"
      - "POST /soc/engagements/{engagement_id}/calendar-run (with PlatformAdmin)"
      - "POST /soc/system-descriptions/{system_description_id}/transitions (SUBMIT_REVIEW and WITHDRAW; RETURN_TO_DRAFT and APPROVE are Auditor-only)"
      - "POST /soc/controls/{control_id}/transitions (START_OBSERVATION; APPROVE_DESIGN and MARK_DESIGN_DEFICIENT are Auditor-only)"
      - "POST /soc/evidence-requests/{evidence_request_id}/review (WAIVE only; ACCEPT and REJECT are EvidenceReviewer-only)"
      - "POST /soc/gaps/{gap_id}/transitions (PLAN, REMEDIATE, WITHDRAW; VERIFY and REOPEN are Auditor-only)"
      - "POST /soc/report-distributions/{report_distribution_id}/transitions (APPROVE, DENY, REVOKE; REQUEST_NDA and DELIVER are AccountExecutive-only)"
      - "every GET endpoint"

  - name: ControlOwner
    description: "Accountable operator for one or more controls; submits the periodic evidence artifacts for the controls whose owner_user_id equals their X-User-ID."
    identity: opaque
    exclusive_operations:
      - "POST /soc/evidence-requests/{evidence_request_id}/submit for a control whose owner_user_id equals X-User-ID"
    shared_operations:
      - "POST /soc/evidence-requests/{evidence_request_id}/submit (with SubserviceContact, which may submit only for controls belonging to its own INCLUSIVE organization)"
      - "every GET endpoint"

  - name: EvidenceReviewer
    description: "Independent reviewer of submitted evidence; may never be the control owner or the submitter of the artifact under review."
    identity: opaque
    exclusive_operations:
      - "POST /soc/evidence-requests/{evidence_request_id}/review with action ACCEPT or REJECT"
    shared_operations:
      - "POST /soc/evidence-requests/{evidence_request_id}/review (with ComplianceLead, which may only WAIVE)"
      - "every GET endpoint"

  - name: Auditor
    description: "The examining practitioner: reviews and approves the system description, approves control design, draws and tests samples, evaluates exceptions, verifies and reopens gaps, and advances the engagement onto the report track."
    identity: opaque
    exclusive_operations:
      - "POST /soc/audit-samples"
      - "POST /soc/audit-samples/{audit_sample_id}/items"
      - "POST /soc/audit-samples/{audit_sample_id}/conclude"
      - "POST /soc/audit-samples/{audit_sample_id}/void"
      - "POST /soc/audit-exceptions/{audit_exception_id}/evaluate"
    shared_operations:
      - "POST /soc/system-descriptions/{system_description_id}/transitions (RETURN_TO_DRAFT and APPROVE)"
      - "POST /soc/controls/{control_id}/transitions (APPROVE_DESIGN and MARK_DESIGN_DEFICIENT)"
      - "POST /soc/gaps/{gap_id}/transitions (VERIFY and REOPEN)"
      - "POST /soc/engagements/{engagement_id}/transitions (START_REPORTING and ISSUE)"
      - "every GET endpoint"

  - name: AccountExecutive
    description: "Commercial owner of the report's downstream life: requests and delivers distributions, drafts and issues bridge letters, and deflects inbound customer questionnaires."
    identity: opaque
    exclusive_operations:
      - "POST /soc/report-distributions"
      - "POST /soc/bridge-letters"
      - "POST /soc/bridge-letters/{bridge_letter_id}/issue"
      - "POST /soc/customer-questionnaires"
      - "POST /soc/customer-questionnaires/{customer_questionnaire_id}/deflect"
    shared_operations:
      - "POST /soc/report-distributions/{report_distribution_id}/transitions (REQUEST_NDA and DELIVER)"
      - "every GET endpoint"

  - name: SubserviceContact
    description: "A contact acting on behalf of a subservice organization presented under the INCLUSIVE method. X-User-ID is the SubserviceOrganization's own id; the contact may submit evidence only for controls whose subservice_organization_id equals that id, and loses all write access the moment the organization is switched to CARVE_OUT."
    identity: "entity_backed:SubserviceOrganization"
    exclusive_operations: []
    shared_operations:
      - "POST /soc/evidence-requests/{evidence_request_id}/submit for controls whose subservice_organization_id equals X-User-ID"
      - "every GET endpoint"

  - name: PlatformAdmin
    description: "Operational role that curates the trust services criteria catalog, drives the ops-run checkpoint, and sets the logical clock. Holds no business authority over any engagement's content."
    identity: opaque
    exclusive_operations:
      - "POST /soc/trust-criteria"
      - "POST /_clock/set_current_utc"
    shared_operations:
      - "POST /soc/engagements/{engagement_id}/calendar-run (with ComplianceLead)"
      - "every GET endpoint"
