      - name: advancing_the_clock_alone_changes_no_row
        claim_type: immediate
        grounds:
          - complexity_profile.consistency_model
          - "endpoints[POST /film-sales/_clock/set_current_utc]"
          - entities.PaymentMilestone.fields.status
        distinguishing_aspect: |
          Every transition in §1.2 is request-triggered, so moving the logical clock two years past three
          milestone due dates must leave all three SCHEDULED, leave collection_status UNPAID and leave the
          film SOLD_OUT: no due-date sweep invoices anything and no term-expiry job reverts the contract.
          Only the explicit revert call does that, and it is asserted last.
        test_recipe:
          setup:
            - "EXECUTED contract with milestones due 2026-09-01, 2027-06-15, 2027-07-15 and 2028-08-01, none received."
          setup_api_calls:
            - call: "POST /film-sales/_clock/set_current_utc"
