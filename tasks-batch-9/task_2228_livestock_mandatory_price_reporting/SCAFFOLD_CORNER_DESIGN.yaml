      - name: not_editable_versus_missing_element_ordering
        claim_type: priority_ordering
        grounds:
          - validations.priority_10_ERR_SUBMISSION_NOT_EDITABLE
          - validations.priority_39_ERR_MISSING_PURCHASE_TYPE_ELEMENT
        excluded_because:
          difficulty_instance: priority_pair_validation_conflict / not_editable_outranks_missing_purchase_element
          rationale: "That §1.8 instance posts a FORMULA record with no formula_base_reference to a SUBMITTED filing so both rules fire, and asserts the 409 editability error wins over the 422 element error."

      - name: suppression_versus_release_time_ordering
        claim_type: priority_ordering
        grounds:
          - validations.priority_20_ERR_CONFIDENTIALITY_SUPPRESSION_REQUIRED
          - validations.priority_25_ERR_PUBLICATION_BEFORE_RELEASE_TIME
        excluded_because:
          difficulty_instance: priority_pair_validation_conflict / suppression_outranks_release_time
          rationale: "That §1.8 instance publishes a WITHHELD report before its release instant so both rules fire, and asserts the confidentiality error wins."

      - name: supersede_mismatch_versus_duplicate_filing_ordering
        claim_type: priority_ordering
        grounds:
          - validations.priority_31_ERR_SUPERSEDE_TARGET_PLANT_MISMATCH
          - validations.priority_37_ERR_DUPLICATE_SUBMISSION
        excluded_because:
          difficulty_instance: priority_pair_validation_conflict / supersede_mismatch_outranks_duplicate_filing
          rationale: "That §1.8 instance supersedes another plant's filing while the filer already has a live filing in the same window, so both rules fire, and asserts the mismatch error wins."

