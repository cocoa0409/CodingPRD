            - "Account.${acct_id}.e911_compliance_posture == BLOCKED"
            - "a subsequent POST /voip/e911-registrations/${reg_id}/verify with outcome VERIFIED returns HTTP 409 ERR_REGISTRATION_NOT_VERIFIABLE"

