            - call: "POST /trade-packages/${tp_id}/publish"
              as: BuyoutLead
            - call: "POST /trade-packages/${tp_id}/bids"
              payload: { bidder_name: "Theta Elec", contact_email: "t2@x.com", base_bid_cents: 9000000, bid_received_at: "2026-05-15T12:00:00Z" }
              as: BuyoutLead
