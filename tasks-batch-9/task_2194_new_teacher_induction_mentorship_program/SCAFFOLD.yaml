    code: 201
    input: ["match_id", "cycle_index", "window_start", "window_end"]
    output: ObservationCycle
    side_effects: ["phase initialised to PRE_CONFERENCE", "feedback_review_status initialised to NONE", "return_count initialised to 0", "the mentor-wide buffered window conflict check runs before insertion"]
