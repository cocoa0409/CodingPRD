  - rule_id: compensating_invariant
    instances:

      - name: tow_tonnage_and_draft_profile_conserved_by_assignment_drop
        grounds:
          - state_machines.BargeAssignment.PLANNED_to_DROPPED
          - calculations.barge_draft_and_tow_profile
          - entities.Tow.fields.total_loaded_tons
          - entities.Tow.fields.max_draft_feet
          - endpoints.POST /barge-assignments/{barge_assignment_id}/drop
        distinguishing_aspect: |
          The conserved quantity is TONNAGE - the invariant Tow.total_loaded_tons ==
          sum of loaded_tons over BargeAssignment rows of the tow whose status is in
          {PLANNED, CONFIRMED, LOADED}, together with the derived max_draft_feet.
          Adding a 1740-ton barge and then dropping it must return total_loaded_tons
          to exactly 3350 and max_draft_feet to exactly 9.83, with zero drift.
