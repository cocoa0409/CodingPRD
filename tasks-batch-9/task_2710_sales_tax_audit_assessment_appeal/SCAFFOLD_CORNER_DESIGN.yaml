        claim_type: Exclusive operations permitted
        grounds: [roles.SelectionAnalyst.exclusive_operations, roles.AuditSupervisor.exclusive_operations, roles.CollectionsAgent.exclusive_operations, roles.Taxpayer.exclusive_operations, roles.AppealsOfficer.shared_operations]
