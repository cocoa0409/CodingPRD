          assert:
            - "captured clm_status == PAID and net == 9950000 (gross 10000000 - loan 0 - unpaid 50000 for the SCHEDULED payment due 2026-10-05)"
            - "Hop 1: GET /api/cases/${c1} status == MATURED, matured_at == 2026-10-15T00:00:00Z"
            - "Hop 1 fields: GET /api/insureds/${i_id} status == DECEASED; GET /api/policies/${p1} status == MATURED"
            - "Hop 2: GET /api/premium-schedules/${sched} status == TERMINATED"
            - "Hop 3: GET /api/portfolios/${pf} nav_stale == true"
            - "Hop 4: GET /api/valuation-snapshots/${snap} status == SUPERSEDED"

      - name: offer_acceptance_closing_chain
        grounds:
          - state_machines.Offer.PENDING_to_ACCEPTED
          - state_machines.PolicyCase.MARKETED_to_IN_CLOSING
          - state_machines.Offer.PENDING_to_REJECTED
        distinguishing_aspect: |
          Depth-2 chain from the accept trigger, distinct from the death-settle
          trigger: accept -> ClosingPackage ASSEMBLED created -> package creation
          cascades EscrowAccount OPEN with expected_funding_cents == 6090000; the
          sibling offer's rejection and the case's IN_CLOSING move are direct
          (fan-out) effects and asserted separately from the chain.
        test_recipe:
          setup:
            - "Canonical TX chain to MARKETED with disclosures delivered; two PENDING offers: 6000000 and 6500000"
          setup_api_calls:
            - { call: "POST /api/licenses", payload: { state_code: "TX", license_number: "LIC-TX-1", effective_date: "2026-01-01", expiry_date: "2027-12-31" }, as: PlatformAdmin }
            - { call: "POST /api/brokers", payload: { name: "Broker One", license_number: "BR-1", state_code: "TX" }, as: PlatformAdmin, captures: { b_id: "$.data.id" } }
