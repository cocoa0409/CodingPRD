# SCAFFOLD_CORNER_DESIGN.yaml — §1.9 for task_2322_timberland_investment_management
# Breadth probe. Sections and claim_type values are taken verbatim from
# references/claim-extraction-guide.md; no categories are invented. Corners already
# asserted by SCAFFOLD_DIFFICULTY_DESIGN.yaml appear as `excluded_because:` stubs that
# name the covering §1.8 instance. Every literal below was produced by executing the
# §1.3 formulas with Decimal/ROUND_HALF_UP. The logical clock is pinned to
# 2026-08-01T00:00:00Z at the head of every chain.
scaffold_corner_design:
  - section: entities
    instances:
      - name: fund_creation_returns_declared_and_defaulted_fields
        claim_type: creation
        grounds:
          - entities.Fund
          - "endpoints[POST /timberland/funds]"
          - calculations.fund_nav_and_cash_yield
        distinguishing_aspect: |
          A brand-new fund must echo its five inputs and seed every computed field in one
          shot: cash_balance_usd defaults to opening_cash_usd 400000.00 (not 0.00),
          net_operating_cash_usd 0.00, cash_yield_bps 0, nav_usd equal to cash because no
          property carries value yet, and version 1.
        test_recipe:
          setup:
            - "Empty database; logical clock pinned to 2026-08-01T00:00:00Z."
          setup_api_calls:
            - call: "POST /timberland/_clock/set_current_utc"
              payload: { current_utc: "2026-08-01T00:00:00Z" }
              as: FundAdmin
          trigger:
            - call: "POST /timberland/funds"
              payload: { name: "Longleaf Timber Fund I", vintage_year: 2025, committed_capital_usd: 500000.00, target_cash_yield_bps: 450, opening_cash_usd: 400000.00 }
              as: FundAdmin
              captures: { fund_id: "$.data.id", cash: "$.data.cash_balance_usd", nav: "$.data.nav_usd", bps: "$.data.cash_yield_bps", accel: "$.data.harvest_acceleration_required", ver: "$.data.version" }
          assert:
            - "HTTP 201 and response_type == object"
            - "${cash} == 400000.00 and ${nav} == 400000.00"
            - "${bps} == 0 and ${accel} == true because 0 < 450"
            - "${ver} == 1"
            - "Fund.${fund_id}.net_operating_cash_usd == 0.00"
            - "Fund.${fund_id}.replan_property_count == 0 and Fund.${fund_id}.valuation_basis_stale_count == 0"
            - "Fund.${fund_id}.name == Longleaf Timber Fund I and Fund.${fund_id}.vintage_year == 2025 and Fund.${fund_id}.target_cash_yield_bps == 450"
            - "created_at and updated_at are present ISO-8601 UTC timestamps"

      - name: property_retrieval_returns_stored_and_derived_fields
        claim_type: retrieval
        grounds:
          - entities.Property.fields.market_access_tier
          - entities.Property.fields.market_access_discount_pct
          - "endpoints[GET /timberland/properties/{id}]"
        distinguishing_aspect: |
          GET must return the tract exactly as stored plus the two fields derived at
          creation: 62 haul miles falls in the 41..80 band so market_access_tier is TIER_B
          and market_access_discount_pct is 4.5 — not TIER_A (<=40) and not the 9.0 of the
          81..140 band. Every lifecycle dimension is still at its initial state.
        test_recipe:
          setup:
            - "Logical clock at 2026-08-01T00:00:00Z; one fund."
            - "One property 'Piney Creek Tract', SOUTH, 1200.00 acres, haul_distance_miles 62, SFI."
          setup_api_calls:
            - call: "POST /timberland/_clock/set_current_utc"
              payload: { current_utc: "2026-08-01T00:00:00Z" }
              as: FundAdmin
            - call: "POST /timberland/funds"
              payload: { name: "Longleaf Timber Fund I", vintage_year: 2025, committed_capital_usd: 500000.00, target_cash_yield_bps: 0, opening_cash_usd: 400000.00 }
              as: FundAdmin
              captures: { fund_id: "$.data.id" }
            - call: "POST /timberland/properties"
              payload: { fund_id: "${fund_id}", name: "Piney Creek Tract", region_code: "SOUTH", total_acres: 1200.00, haul_distance_miles: 62, insured_value_usd: 4200000.00, hbu_acres: 40.00, hbu_price_per_acre_usd: 3000.00, annual_rec_income_usd: 18000.00, certification_scheme: "SFI" }
              as: AcquisitionAnalyst
              captures: { prop_id: "$.data.id" }
          trigger:
            - call: "GET /timberland/properties/${prop_id}"
              payload: {}
              as: InvestmentCommittee
              captures: { tier: "$.data.market_access_tier", disc: "$.data.market_access_discount_pct", status: "$.data.status", appr: "$.data.appraisal_status", post: "$.data.certification_posture", plan: "$.data.harvest_plan_status" }
          assert:
            - "HTTP 200 and ${tier} == TIER_B and ${disc} == 4.5"
            - "${status} == PROSPECT and ${appr} == NONE and ${post} == CERTIFIED and ${plan} == ALIGNED"
            - "Property.${prop_id}.total_acres == 1200.00 and Property.${prop_id}.hbu_acres == 40.00 and Property.${prop_id}.annual_rec_income_usd == 18000.00"
            - "Property.${prop_id}.appraised_value_usd == null and Property.${prop_id}.acquisition_price_usd == null and Property.${prop_id}.composite_risk_score == null"
            - "Property.${prop_id}.version == 1"

      - name: property_stands_listing_paginates_with_envelope_fields
        claim_type: listing
        grounds:
          - "endpoints[GET /timberland/properties/{id}/stands]"
          - response_envelope.pagination_defaults
        distinguishing_aspect: |
          With three stands on the tract, limit 2 / offset 0 must return exactly 2 rows
          with total_count 3 and has_more true, and limit 2 / offset 2 must return the
          remaining 1 row with has_more false while total_count stays 3 — total_count
          counts the full result set, not the page.
        test_recipe:
          setup:
            - "Logical clock at 2026-08-01T00:00:00Z; one fund and one property."
            - "Three stands PC-01, PC-02, PC-03 created in that order, all still CRUISE_OPEN."
          setup_api_calls:
            - call: "POST /timberland/_clock/set_current_utc"
              payload: { current_utc: "2026-08-01T00:00:00Z" }
              as: FundAdmin
            - call: "POST /timberland/funds"
              payload: { name: "Longleaf Timber Fund I", vintage_year: 2025, committed_capital_usd: 500000.00, target_cash_yield_bps: 0, opening_cash_usd: 400000.00 }
              as: FundAdmin
              captures: { fund_id: "$.data.id" }
            - call: "POST /timberland/properties"
              payload: { fund_id: "${fund_id}", name: "Piney Creek Tract", region_code: "SOUTH", total_acres: 1200.00, haul_distance_miles: 62, insured_value_usd: 4200000.00, hbu_acres: 0.00, hbu_price_per_acre_usd: 0.00, annual_rec_income_usd: 0.00, certification_scheme: "SFI" }
              as: AcquisitionAnalyst
              captures: { prop_id: "$.data.id" }
            - call: "POST /timberland/stands"
              payload: { property_id: "${prop_id}", stand_code: "PC-01", acres: 120.00, species_code: "LOBLOLLY_PINE", age_years: 22, site_index: 78 }
              as: ForestManager
            - call: "POST /timberland/stands"
              payload: { property_id: "${prop_id}", stand_code: "PC-02", acres: 90.00, species_code: "DOUGLAS_FIR", age_years: 30, site_index: 95 }
              as: ForestManager
            - call: "POST /timberland/stands"
              payload: { property_id: "${prop_id}", stand_code: "PC-03", acres: 60.00, species_code: "NORTHERN_HARDWOOD", age_years: 55, site_index: 62 }
              as: ForestManager
          trigger:
            - call: "GET /timberland/properties/${prop_id}/stands"
              payload: { limit: 2, offset: 0 }
              as: ForestManager
              captures: { page1_first: "$.data[0].stand_code", page1_second: "$.data[1].stand_code" }
            - call: "GET /timberland/properties/${prop_id}/stands"
              payload: { limit: 2, offset: 2 }
              as: ForestManager
              captures: { page2_first: "$.data[0].stand_code" }
          assert:
            - "first page: HTTP 200, response_type == array, exactly 2 rows, envelope total_count == 3 and has_more == true"
            - "second page: exactly 1 row, envelope total_count == 3 and has_more == false"
            - "${page1_first}, ${page1_second} and ${page2_first} cover PC-01, PC-02 and PC-03 with no duplicates"
            - "limit and offset are echoed as 2 and 0 on the first page and 2 and 2 on the second"

      - name: core_entity_path_id_absent_returns_not_found
        claim_type: not_found
        grounds:
          - "validations[priority=30]"
          - "errors[ERR_FUND_NOT_FOUND]"
          - "errors[ERR_PROPERTY_NOT_FOUND]"
          - "errors[ERR_STAND_NOT_FOUND]"
          - "errors[ERR_UNDERWRITING_CASE_NOT_FOUND]"
          - "errors[ERR_HARVEST_BLOCK_NOT_FOUND]"
        distinguishing_aspect: |
          Path existence is checked at priority 30, ahead of request-shape validation, so
          an unknown UUID on each core read must answer that entity's OWN not-found code
          with 404 — never a generic ERR_INVALID_REQUEST and never ERR_FUND_NOT_FOUND for
          a stand path.
        test_recipe:
          setup:
            - "Empty database apart from the logical clock; the UUID 11111111-1111-4111-8111-111111111111 belongs to no row."
          setup_api_calls:
            - call: "POST /timberland/_clock/set_current_utc"
              payload: { current_utc: "2026-08-01T00:00:00Z" }
              as: FundAdmin
          trigger:
            - call: "GET /timberland/funds/11111111-1111-4111-8111-111111111111"
              payload: {}
              as: FundAdmin
              captures: { e_fund: "$.data.error_id" }
            - call: "GET /timberland/properties/11111111-1111-4111-8111-111111111111"
              payload: {}
              as: FundAdmin
              captures: { e_prop: "$.data.error_id" }
            - call: "GET /timberland/stands/11111111-1111-4111-8111-111111111111"
              payload: {}
              as: ForestManager
              captures: { e_stand: "$.data.error_id" }
            - call: "GET /timberland/underwriting-cases/11111111-1111-4111-8111-111111111111"
              payload: {}
              as: AcquisitionAnalyst
              captures: { e_case: "$.data.error_id" }
            - call: "GET /timberland/harvest-blocks/11111111-1111-4111-8111-111111111111"
              payload: {}
              as: ForestManager
              captures: { e_block: "$.data.error_id" }
          assert:
            - "every response is HTTP 404 with response_type == error and a non-empty message"
            - "${e_fund} == ERR_FUND_NOT_FOUND"
            - "${e_prop} == ERR_PROPERTY_NOT_FOUND"
            - "${e_stand} == ERR_STAND_NOT_FOUND"
            - "${e_case} == ERR_UNDERWRITING_CASE_NOT_FOUND"
            - "${e_block} == ERR_HARVEST_BLOCK_NOT_FOUND"

      - name: secondary_entity_path_id_absent_returns_not_found
        claim_type: not_found
        grounds:
          - "validations[priority=30]"
          - "errors[ERR_CARBON_PROJECT_NOT_FOUND]"
          - "errors[ERR_CARBON_DEDICATION_NOT_FOUND]"
          - "errors[ERR_HBU_PARCEL_NOT_FOUND]"
          - "errors[ERR_RECREATIONAL_LEASE_NOT_FOUND]"
          - "errors[ERR_CERTIFICATION_AUDIT_NOT_FOUND]"
          - "errors[ERR_AUDIT_FINDING_NOT_FOUND]"
          - "errors[ERR_HAZARD_EVENT_NOT_FOUND]"
        distinguishing_aspect: |
          The seven satellite entities each carry their own 404 code, and the same
          priority-30 rule applies on their read endpoints; a shared generic 404 would
          fail every assertion below.
        test_recipe:
          setup:
            - "Empty database apart from the logical clock; the UUID 22222222-2222-4222-8222-222222222222 belongs to no row."
          setup_api_calls:
            - call: "POST /timberland/_clock/set_current_utc"
              payload: { current_utc: "2026-08-01T00:00:00Z" }
              as: FundAdmin
          trigger:
            - call: "GET /timberland/carbon-projects/22222222-2222-4222-8222-222222222222"
              payload: {}
              as: CarbonDeveloper
              captures: { e_proj: "$.data.error_id" }
            - call: "GET /timberland/carbon-dedications/22222222-2222-4222-8222-222222222222"
              payload: {}
              as: CarbonDeveloper
              captures: { e_ded: "$.data.error_id" }
            - call: "GET /timberland/hbu-parcels/22222222-2222-4222-8222-222222222222"
              payload: {}
              as: FundAdmin
              captures: { e_parcel: "$.data.error_id" }
            - call: "GET /timberland/recreational-leases/22222222-2222-4222-8222-222222222222"
              payload: {}
              as: FundAdmin
              captures: { e_lease: "$.data.error_id" }
            - call: "GET /timberland/certification-audits/22222222-2222-4222-8222-222222222222"
              payload: {}
              as: CertificationAuditor
              captures: { e_audit: "$.data.error_id" }
            - call: "GET /timberland/audit-findings/22222222-2222-4222-8222-222222222222"
              payload: {}
              as: CertificationAuditor
              captures: { e_find: "$.data.error_id" }
            - call: "GET /timberland/hazard-events/22222222-2222-4222-8222-222222222222"
              payload: {}
              as: ForestManager
              captures: { e_hz: "$.data.error_id" }
          assert:
            - "every response is HTTP 404 with response_type == error"
            - "${e_proj} == ERR_CARBON_PROJECT_NOT_FOUND and ${e_ded} == ERR_CARBON_DEDICATION_NOT_FOUND"
            - "${e_parcel} == ERR_HBU_PARCEL_NOT_FOUND and ${e_lease} == ERR_RECREATIONAL_LEASE_NOT_FOUND"
            - "${e_audit} == ERR_CERTIFICATION_AUDIT_NOT_FOUND and ${e_find} == ERR_AUDIT_FINDING_NOT_FOUND"
            - "${e_hz} == ERR_HAZARD_EVENT_NOT_FOUND"

      - name: stand_create_without_acres_returns_invalid_request
        claim_type: required_fields
        grounds:
          - "validations[priority=45]"
          - entities.Stand.fields.acres
          - "errors[ERR_INVALID_REQUEST]"
        distinguishing_aspect: |
          Stand.acres is `source: input` with no default, so omitting it must fail with
          ERR_INVALID_REQUEST / 400 rather than defaulting to 0.00 and silently producing
          a zero-volume cruise later.
        test_recipe:
          setup:
            - "Logical clock at 2026-08-01T00:00:00Z; one fund and one property."
          setup_api_calls:
            - call: "POST /timberland/_clock/set_current_utc"
              payload: { current_utc: "2026-08-01T00:00:00Z" }
              as: FundAdmin
            - call: "POST /timberland/funds"
              payload: { name: "Longleaf Timber Fund I", vintage_year: 2025, committed_capital_usd: 500000.00, target_cash_yield_bps: 0, opening_cash_usd: 400000.00 }
              as: FundAdmin
              captures: { fund_id: "$.data.id" }
            - call: "POST /timberland/properties"
              payload: { fund_id: "${fund_id}", name: "Piney Creek Tract", region_code: "SOUTH", total_acres: 1200.00, haul_distance_miles: 62, insured_value_usd: 4200000.00, hbu_acres: 0.00, hbu_price_per_acre_usd: 0.00, annual_rec_income_usd: 0.00, certification_scheme: "SFI" }
              as: AcquisitionAnalyst
              captures: { prop_id: "$.data.id" }
          trigger:
            - call: "POST /timberland/stands"
              payload: { property_id: "${prop_id}", stand_code: "PC-01", species_code: "LOBLOLLY_PINE", age_years: 22, site_index: 78 }
              as: ForestManager
              captures: { err: "$.data.error_id" }
          assert:
            - "HTTP 400 and ${err} == ERR_INVALID_REQUEST"
            - "GET /timberland/properties/${prop_id}/stands returns total_count == 0"
            - "Property.${prop_id}.version == 1, unchanged by the rejected call"

      - name: harvest_block_creation_defaults_status_and_null_actuals
        claim_type: defaults
        grounds:
          - entities.HarvestBlock.fields.status
          - entities.HarvestBlock.fields.actual_tons
          - entities.HarvestBlock.fields.realized_price_index_factor
          - entities.HarvestBlock.fields.voided_reason
        distinguishing_aspect: |
          A block created without any completion data must default status to RESERVED and
          leave actual_tons, realized_price_index_factor, final_net_revenue_usd and
          voided_reason at null while still computing provisional_net_revenue_usd 22889.55
          — the provisional variant is NOT deferred to commit time.
        test_recipe:
          setup:
            - "Logical clock at 2026-08-01T00:00:00Z."
            - "Fund, 'Piney Creek Tract', stand PC-01 cruise-closed at 4647.12 tons from the five canonical plots."
          setup_api_calls:
            - call: "POST /timberland/_clock/set_current_utc"
              payload: { current_utc: "2026-08-01T00:00:00Z" }
              as: FundAdmin
            - call: "POST /timberland/funds"
              payload: { name: "Longleaf Timber Fund I", vintage_year: 2025, committed_capital_usd: 500000.00, target_cash_yield_bps: 0, opening_cash_usd: 400000.00 }
              as: FundAdmin
              captures: { fund_id: "$.data.id" }
            - call: "POST /timberland/properties"
              payload: { fund_id: "${fund_id}", name: "Piney Creek Tract", region_code: "SOUTH", total_acres: 1200.00, haul_distance_miles: 62, insured_value_usd: 4200000.00, hbu_acres: 0.00, hbu_price_per_acre_usd: 0.00, annual_rec_income_usd: 0.00, certification_scheme: "SFI" }
              as: AcquisitionAnalyst
              captures: { prop_id: "$.data.id" }
            - call: "POST /timberland/stands"
              payload: { property_id: "${prop_id}", stand_code: "PC-01", acres: 120.00, species_code: "LOBLOLLY_PINE", age_years: 22, site_index: 78 }
              as: ForestManager
              captures: { stand_id: "$.data.id" }
            - call: "POST /timberland/cruise-plots"
              payload: { stand_id: "${stand_id}", plot_number: 1, tons_per_acre: 41.37, defect_pct: 6.5, measured_at: "2026-07-15T00:00:00Z" }
              as: ForestManager
            - call: "POST /timberland/cruise-plots"
              payload: { stand_id: "${stand_id}", plot_number: 2, tons_per_acre: 38.94, defect_pct: 4.25, measured_at: "2026-07-15T00:00:00Z" }
              as: ForestManager
            - call: "POST /timberland/cruise-plots"
              payload: { stand_id: "${stand_id}", plot_number: 3, tons_per_acre: 44.06, defect_pct: 9.75, measured_at: "2026-07-15T00:00:00Z" }
              as: ForestManager
            - call: "POST /timberland/cruise-plots"
              payload: { stand_id: "${stand_id}", plot_number: 4, tons_per_acre: 39.51, defect_pct: 3.5, measured_at: "2026-07-15T00:00:00Z" }
              as: ForestManager
            - call: "POST /timberland/cruise-plots"
              payload: { stand_id: "${stand_id}", plot_number: 5, tons_per_acre: 42.88, defect_pct: 7.25, measured_at: "2026-07-15T00:00:00Z" }
              as: ForestManager
            - call: "POST /timberland/stands/${stand_id}/cruise-close"
              payload: {}
              as: ForestManager
              captures: { stand_v: "$.data.version" }
          trigger:
            - call: "POST /timberland/harvest-blocks"
              payload: { stand_id: "${stand_id}", planned_start_date: "2027-06-01", planned_end_date: "2027-09-30", planned_tons: 1000.00, product_mix: "MIXED", expected_stumpage_price_usd_per_ton: 58.00, price_index_factor: 1.05, expected_haul_distance_miles: 140, growth_variant: "YIELD_TABLE", expected_stand_version: "${stand_v}" }
              as: ForestManager
              captures: { block_id: "$.data.id", status: "$.data.status", prov: "$.data.provisional_net_revenue_usd" }
          assert:
            - "HTTP 201 and ${status} == RESERVED"
            - "${prov} == 22889.55"
            - "HarvestBlock.${block_id}.actual_tons == null and HarvestBlock.${block_id}.realized_price_index_factor == null"
            - "HarvestBlock.${block_id}.final_net_revenue_usd == null and HarvestBlock.${block_id}.voided_reason == null"
            - "HarvestBlock.${block_id}.severance_tax_usd == 1248.45"
            - "HarvestBlock.${block_id}.version == 1"

      - name: stand_create_computed_volume_input_ignored
        claim_type: computed_fields
        grounds:
          - entities.Stand.fields.net_merch_tons
          - entities.Stand.fields.available_tons
          - "validations[priority=45]"
        distinguishing_aspect: |
          net_merch_tons and available_tons are `source: computed`; supplying them in the
          create body must be IGNORED rather than rejected (priority 45 says computed and
          system fields present in the body are ignored, not rejected), so the stand is
          created with 0.00 tons and only cruise-close can populate them.
        test_recipe:
          setup:
            - "Logical clock at 2026-08-01T00:00:00Z; one fund and one property."
          setup_api_calls:
            - call: "POST /timberland/_clock/set_current_utc"
              payload: { current_utc: "2026-08-01T00:00:00Z" }
              as: FundAdmin
            - call: "POST /timberland/funds"
              payload: { name: "Longleaf Timber Fund I", vintage_year: 2025, committed_capital_usd: 500000.00, target_cash_yield_bps: 0, opening_cash_usd: 400000.00 }
              as: FundAdmin
              captures: { fund_id: "$.data.id" }
            - call: "POST /timberland/properties"
              payload: { fund_id: "${fund_id}", name: "Piney Creek Tract", region_code: "SOUTH", total_acres: 1200.00, haul_distance_miles: 62, insured_value_usd: 4200000.00, hbu_acres: 0.00, hbu_price_per_acre_usd: 0.00, annual_rec_income_usd: 0.00, certification_scheme: "SFI" }
              as: AcquisitionAnalyst
              captures: { prop_id: "$.data.id" }
          trigger:
            - call: "POST /timberland/stands"
              payload: { property_id: "${prop_id}", stand_code: "PC-01", acres: 120.00, species_code: "LOBLOLLY_PINE", age_years: 22, site_index: 78, net_merch_tons: 99999.99, available_tons: 99999.99, status: "INVENTORIED" }
              as: ForestManager
              captures: { stand_id: "$.data.id", tons: "$.data.net_merch_tons", avail: "$.data.available_tons", status: "$.data.status" }
          assert:
            - "HTTP 201, not 400 — the computed fields are ignored, not rejected"
            - "${tons} == 0.00 and ${avail} == 0.00"
            - "${status} == CRUISE_OPEN, the initial state, not the supplied INVENTORIED"
            - "Stand.${stand_id}.gross_merch_tons == 0.00 and Stand.${stand_id}.cruise_confidence == null"
            - "Stand.${stand_id}.plot_count == 0"

      - name: property_create_system_field_input_ignored
        claim_type: system_fields
        grounds:
          - entities.Property
          - "validations[priority=45]"
        distinguishing_aspect: |
          id, created_at, updated_at and version are server-minted. Supplying them must be
          ignored: the returned id is a fresh server UUID different from the submitted
          value and version is 1, not the submitted 77.
        test_recipe:
          setup:
            - "Logical clock at 2026-08-01T00:00:00Z; one fund."
          setup_api_calls:
            - call: "POST /timberland/_clock/set_current_utc"
              payload: { current_utc: "2026-08-01T00:00:00Z" }
              as: FundAdmin
            - call: "POST /timberland/funds"
              payload: { name: "Longleaf Timber Fund I", vintage_year: 2025, committed_capital_usd: 500000.00, target_cash_yield_bps: 0, opening_cash_usd: 400000.00 }
              as: FundAdmin
              captures: { fund_id: "$.data.id" }
          trigger:
            - call: "POST /timberland/properties"
              payload: { fund_id: "${fund_id}", name: "Piney Creek Tract", region_code: "SOUTH", total_acres: 1200.00, haul_distance_miles: 62, insured_value_usd: 4200000.00, hbu_acres: 0.00, hbu_price_per_acre_usd: 0.00, annual_rec_income_usd: 0.00, certification_scheme: "SFI", id: "33333333-3333-4333-8333-333333333333", version: 77, created_at: "2000-01-01T00:00:00.000Z" }
              as: AcquisitionAnalyst
              captures: { prop_id: "$.data.id", ver: "$.data.version" }
