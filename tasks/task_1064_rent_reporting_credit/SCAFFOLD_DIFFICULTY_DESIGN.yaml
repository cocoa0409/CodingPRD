  # =========================================================================
  # Rule 8 — Resource temporal-overlap conflicts across different interval semantics
  # =========================================================================
  - rule_id: resource_temporal_overlap
    instances:
      - name: lease_continuous_daterange_overlap_rejected
        grounds:
          - validations[priority=12]
          - entities.Lease.fields.lease_start
          - entities.Lease.fields.lease_end
          - errors[ERR_LEASE_DATE_OVERLAP]
        distinguishing_aspect: |
          Continuous half-open [lease_start, lease_end) interval arithmetic on Lease: a second lease for the same
          (tenant, address) whose range [2026-06-01, 2026-12-01) intersects the first [2026-01-01, 2027-01-01) is
          rejected with ERR_LEASE_DATE_OVERLAP.
        test_recipe:
          setup:
            - "A tenant with one lease [2026-01-01, 2027-01-01) at '20 Overlap St'."
          setup_api_calls:
            - call: "POST /api/_clock/set_current_utc"
              payload: { to_iso8601: "2026-07-01T00:00:00Z" }
              as: PlatformAdmin
            - call: "POST /api/tenants"
              payload: { full_name: "Ola Overlap", email: "ola@x.com" }
              as: PlatformAdmin
              captures: { t_id: $.data.id }
            - call: "POST /api/landlords"
              payload: { company_name: "Acme PM", email: "pm@x.com" }
              as: PlatformAdmin
              captures: { ll_id: $.data.id }
            - call: "POST /api/leases"
              payload: { tenant_id: "${t_id}", landlord_id: "${ll_id}", property_address: "20 Overlap St", rent_amount_cents: 120000, monthly_due_day: 5, lease_start: "2026-01-01T00:00:00Z", lease_end: "2027-01-01T00:00:00Z" }
              as: Tenant
              as_user_id: "${t_id}"
              captures: { lease_id: $.data.id }
          trigger:
            - call: "POST /api/leases"
              payload: { tenant_id: "${t_id}", landlord_id: "${ll_id}", property_address: "20 Overlap St", rent_amount_cents: 130000, monthly_due_day: 5, lease_start: "2026-06-01T00:00:00Z", lease_end: "2026-12-01T00:00:00Z" }
              as: Tenant
              as_user_id: "${t_id}"
              captures: { err: $.data.error_id }
          assert:
            - "POST /api/leases .data.error_id == ERR_LEASE_DATE_OVERLAP"
            - "POST /api/leases response http status == 409"

      - name: reported_month_discrete_coverage_collision_rejected
        grounds:
          - validations[priority=14]
          - entities.ReportedItem.fields.period_month
          - errors[ERR_PERIOD_ALREADY_COVERED]
        distinguishing_aspect: |
          Discrete month-point membership on ReportedItem (different resource + interval semantics than Lease's
          continuous ranges): reporting a second payment for a (lease, month) already covered collides on exact-month
          equality (adjacency/buffers irrelevant) -> ERR_PERIOD_ALREADY_COVERED.
        test_recipe:
          setup:
            - "ACTIVE enrollment, VERIFIED lease, two RECORDED payments for the SAME month 2026-06; the first is furnished (covers the month)."
          setup_api_calls:
            - call: "POST /api/_clock/set_current_utc"
              payload: { to_iso8601: "2026-07-01T00:00:00Z" }
              as: PlatformAdmin
            - call: "POST /api/subscription-plans"
              payload: { name: "Plus", tier: "PLUS", monthly_fee_cents: 1499, back_reporting_included_months: 6 }
              as: PlatformAdmin
              captures: { plan_id: $.data.id }
            - call: "POST /api/tenants"
              payload: { full_name: "Mo Month", email: "mo@x.com" }
              as: PlatformAdmin
              captures: { t_id: $.data.id }
            - call: "POST /api/landlords"
              payload: { company_name: "Acme PM", email: "pm@x.com" }
              as: PlatformAdmin
              captures: { ll_id: $.data.id }
            - call: "POST /api/enrollments"
              payload: { tenant_id: "${t_id}", plan_id: "${plan_id}" }
              as: Tenant
              as_user_id: "${t_id}"
              captures: { en_id: $.data.id }
            - call: "GET /api/invoices"
              payload: { enrollment_id: "${en_id}", kind: "SUBSCRIPTION" }
              as: Tenant
              as_user_id: "${t_id}"
              captures: { sub_inv_id: "$.data[0].id" }
            - call: "POST /api/invoices/${sub_inv_id}/pay"
              payload: {}
              as: Tenant
              as_user_id: "${t_id}"
            - call: "POST /api/leases"
              payload: { tenant_id: "${t_id}", landlord_id: "${ll_id}", property_address: "22 Dup St", rent_amount_cents: 120000, monthly_due_day: 5, lease_start: "2026-01-01T00:00:00Z", lease_end: "2027-01-01T00:00:00Z" }
              as: Tenant
              as_user_id: "${t_id}"
              captures: { lease_id: $.data.id }
            - call: "POST /api/leases/${lease_id}/verify"
              payload: { decision: "VERIFIED" }
              as: Landlord
              as_user_id: "${ll_id}"
              captures: { lease_v2: $.data.version }
            - call: "POST /api/rent-payments"
              payload: { lease_id: "${lease_id}", period_month: "2026-06", due_date: "2026-06-05T00:00:00Z", paid_date: "2026-06-05T00:00:00Z", amount_paid_cents: 120000, expected_lease_version: "${lease_v2}" }
              as: Landlord
              as_user_id: "${ll_id}"
              captures: { pay1_id: $.data.id }
            - call: "GET /api/leases/${lease_id}"
              payload: {}
              as: Landlord
              as_user_id: "${ll_id}"
              captures: { lease_v3: $.data.version }
            - call: "POST /api/rent-payments"
              payload: { lease_id: "${lease_id}", period_month: "2026-06", due_date: "2026-06-05T00:00:00Z", paid_date: "2026-06-06T00:00:00Z", amount_paid_cents: 120000, expected_lease_version: "${lease_v3}" }
              as: Landlord
              as_user_id: "${ll_id}"
              captures: { pay2_id: $.data.id }
            - call: "POST /api/rent-payments/${pay1_id}/report"
              payload: {}
              as: ComplianceAnalyst
              as_user_id: "analyst-1"
          trigger:
            - call: "POST /api/rent-payments/${pay2_id}/report"
