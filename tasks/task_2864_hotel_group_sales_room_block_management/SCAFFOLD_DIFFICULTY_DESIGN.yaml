  - rule_id: resource_temporal_overlap
    instances:

      - name: group_ceiling_half_open_stay_range_adjacency
        grounds:
          - validations[priority=28].ERR_GROUP_CEILING_EXCEEDED
          - entities.InventoryDay.fields.group_ceiling_rooms
          - entities.InventoryDay.fields.held_group_rooms
          - state_machines.RateQuote.DRAFT_to_PROPOSED
        distinguishing_aspect: |
          The ceiling is tested per stay date over the half-open range [arrival_date, departure_date).
          With group_ceiling_rooms 5 and lead A holding 4 rooms on 2026-11-09..11, a lead whose stay
          overlaps 11-10 and 11-11 pushes those dates to 6 and must be rejected with
          ERR_GROUP_CEILING_EXCEEDED, while a lead arriving exactly on A's departure date (2026-11-12)
