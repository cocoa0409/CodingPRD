      - name: schema_validation_outranks_conference_state_and_is_rejected
        claim_type: priority_ordering
        grounds:
          - validations.p7.ERR_VALIDATION
          - validations.p9.ERR_CONFERENCE_STATE_INVALID
        distinguishing_aspect: |
          A decision call carrying an undeclared enum value (decision: MAYBE)
          against a conference still in REVIEW_OPEN violates p7 and p9 at once.
          The ladder must surface p7's 400 ERR_VALIDATION, not p9's 409
          ERR_CONFERENCE_STATE_INVALID — a pairing distinct from the
          authorization/existence and concurrency/quota pairs. Swapping to a
          legal enum on the same conference then exposes p9's error, proving
          both rules were live.
        test_recipe:
          setup:
            - "Clock 2026-01-05T00:00:00Z; Conference GOS26 at REVIEW_OPEN, category GEN allowing ORAL and POSTER."
            - "Chair Cho is ACTIVE; Ada has one SUBMITTED abstract; the conference version is read immediately before the trigger."
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { current_utc: "2026-01-05T00:00:00Z" }
              as: ConferenceAdmin
            - call: "POST /conferences"
