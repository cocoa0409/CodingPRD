scaffold_difficulty_design:

  # =========================================================================
  # Rule 1 -- dual-variant calculations across different entity domains
  # =========================================================================
  - rule_id: dual_variant_calc
    instances:

      - name: alternate_benefit_downgrade_vs_standard_predetermination
        grounds:
          - calculations.predetermination_plan_payment
          - state_machines.Predetermination.SUBMITTED_to_APPROVED
          - state_machines.Predetermination.SUBMITTED_to_ALTERNATE_BENEFIT
          - entities.Predetermination.fields.estimated_plan_payment
          - entities.Predetermination.fields.alternate_benefit_type
        distinguishing_aspect: |
          This dual variant lives on the Predetermination entity (insurance preauthorization),
          not on any appliance or money-collection entity: two identical
          IMPLANT_RETAINED_OVERDENTURE cases under the SAME coverage produce
          estimated_plan_payment 1500.00 under STANDARD_BENEFIT and 900.00 under
          ALTERNATE_BENEFIT_DOWNGRADE, because the downgrade swaps the allowed basis from
          the requested 3600.00 to the COMPLETE_DENTURE fee 1800.00.
        test_recipe:
          setup:
            - "Logical clock at 2026-05-01T00:00:00Z."
            - "One patient holding one PRIMARY coverage with annual_maximum_amount 1500.00 and coinsurance_major_rate 0.50, benefit_used_ytd 0.00 and benefit_remaining 1500.00."
            - "Two IMPLANT_RETAINED_OVERDENTURE cases, each with exactly one MAXILLARY arch and each past complete-exam, so each has fee_schedule_total 3600.00 and predetermination_required true."
            - "One SUBMITTED Predetermination on each case, each with requested_amount 3600.00."
          setup_api_calls:
            - call: "POST /prosthetics/_clock/set_current_utc"
              payload: { to_iso8601: "2026-05-01T00:00:00Z" }
              as: PlatformAdmin
              as_user_id: "admin-root"
            - call: "POST /prosthetics/patients"
              payload: { full_name: "Adaeze Fenwick", date_of_birth: "1957-03-14", phone: "555-0142" }
              as: FrontOffice
              as_user_id: "fo-lindgren"
              captures: { pat_id: $.data.id }
            - call: "POST /prosthetics/coverages"
              payload: { patient_id: "${pat_id}", carrier_name: "Meridian Dental", rank: "PRIMARY", effective_date: "2025-01-01T00:00:00Z", annual_maximum_amount: 1500.00, coinsurance_major_rate: 0.50, alternate_benefit_enabled: true }
              as: FrontOffice
              as_user_id: "fo-lindgren"
              captures: { cov_id: $.data.id }
            - call: "POST /prosthetics/cases"
              payload: { patient_id: "${pat_id}", prosthesis_type: "IMPLANT_RETAINED_OVERDENTURE" }
              as: Prosthodontist
              as_user_id: "dr-nunes"
              captures: { case_a_id: $.data.id }
            - call: "POST /prosthetics/case-arches"
              payload: { case_id: "${case_a_id}", arch_position: "MAXILLARY" }
              as: Prosthodontist
              as_user_id: "dr-nunes"
            - call: "POST /prosthetics/cases/${case_a_id}/complete-exam"
              payload: {}
              as: Prosthodontist
              as_user_id: "dr-nunes"
            - call: "POST /prosthetics/cases"
              payload: { patient_id: "${pat_id}", prosthesis_type: "IMPLANT_RETAINED_OVERDENTURE" }
              as: Prosthodontist
              as_user_id: "dr-nunes"
              captures: { case_b_id: $.data.id }
            - call: "POST /prosthetics/case-arches"
              payload: { case_id: "${case_b_id}", arch_position: "MAXILLARY" }
              as: Prosthodontist
              as_user_id: "dr-nunes"
            - call: "POST /prosthetics/cases/${case_b_id}/complete-exam"
              payload: {}
              as: Prosthodontist
              as_user_id: "dr-nunes"
            - call: "POST /prosthetics/predeterminations"
              payload: { case_id: "${case_a_id}", coverage_id: "${cov_id}" }
              as: FrontOffice
              as_user_id: "fo-lindgren"
              captures: { pd_a_id: $.data.id }
            - call: "POST /prosthetics/predeterminations"
              payload: { case_id: "${case_b_id}", coverage_id: "${cov_id}" }
              as: FrontOffice
              as_user_id: "fo-lindgren"
              captures: { pd_b_id: $.data.id }
          trigger:
            - call: "POST /prosthetics/predeterminations/${pd_a_id}/determine"
              payload: { determination: "APPROVED" }
              as: FrontOffice
              as_user_id: "fo-lindgren"
            - call: "POST /prosthetics/predeterminations/${pd_b_id}/determine"
              payload: { determination: "ALTERNATE_BENEFIT" }
              as: FrontOffice
              as_user_id: "fo-lindgren"
          assert:
            - "Predetermination.${pd_a_id}.determination_status == APPROVED"
            - "Predetermination.${pd_a_id}.allowed_amount == 3600.00"
            - "Predetermination.${pd_a_id}.estimated_plan_payment == 1500.00"
            - "Predetermination.${pd_a_id}.estimated_patient_responsibility == 2100.00"
            - "Predetermination.${pd_a_id}.alternate_benefit_type is null"
            - "Predetermination.${pd_b_id}.determination_status == ALTERNATE_BENEFIT"
            - "Predetermination.${pd_b_id}.alternate_benefit_type == COMPLETE_DENTURE"
            - "Predetermination.${pd_b_id}.allowed_amount == 1800.00"
            - "Predetermination.${pd_b_id}.estimated_plan_payment == 900.00"
            - "Predetermination.${pd_b_id}.estimated_patient_responsibility == 2700.00"
            - "Coverage.${cov_id}.benefit_used_ytd == 0.00 -- a predetermination is an estimate and consumes no benefit"

      - name: included_vs_chargeable_adjustment_by_window_boundary
        grounds:
          - calculations.post_delivery_service_charge
          - entities.Prosthesis.fields.adjustment_window_ends_at
          - entities.PostDeliveryService.fields.charge_basis
          - state_machines.PostDeliveryService.IN_CHAIR_to_COMPLETED
        distinguishing_aspect: |
          This dual variant lives on the appliance-service domain (Prosthesis and
          PostDeliveryService), a different entity domain from the insurance
          preauthorization instance: the SAME ADJUSTMENT service completes at
          charge_amount 0.00 inside the 90-day allowance window and at 85.00 one day
          after adjustment_window_ends_at, with the allowance counters moving only on
          the INCLUDED path.
        test_recipe:
          setup:
            - "Logical clock at 2026-05-01T00:00:00Z."
            - "A FLEXIBLE_PARTIAL case with one MAXILLARY arch delivered on 2026-05-01T00:00:00Z, so the prosthesis has adjustments_used 0, adjustments_remaining 4 and adjustment_window_ends_at 2026-07-30T00:00:00Z."
            - "No PaymentPlan exists, so the global write gate is down."
          setup_api_calls:
            - call: "POST /prosthetics/_clock/set_current_utc"
              payload: { to_iso8601: "2026-05-01T00:00:00Z" }
              as: PlatformAdmin
              as_user_id: "admin-root"
            - call: "POST /prosthetics/patients"
              payload: { full_name: "Bram Ostrowski", date_of_birth: "1949-11-02", phone: "555-0177" }
              as: FrontOffice
              as_user_id: "fo-lindgren"
              captures: { pat_id: $.data.id }
            - call: "POST /prosthetics/labs"
              payload: { lab_name: "Northgate Dental Lab", bench_line_count: 3, standard_turnaround_days: 10, rush_turnaround_days: 4 }
              as: PlatformAdmin
              as_user_id: "admin-root"
              captures: { lab_id: $.data.id }
            - call: "POST /prosthetics/cases"
              payload: { patient_id: "${pat_id}", prosthesis_type: "FLEXIBLE_PARTIAL" }
              as: Prosthodontist
              as_user_id: "dr-nunes"
              captures: { case_id: $.data.id }
            - call: "POST /prosthetics/case-arches"
              payload: { case_id: "${case_id}", arch_position: "MAXILLARY" }
              as: Prosthodontist
              as_user_id: "dr-nunes"
              captures: { arch_id: $.data.id }
            - call: "POST /prosthetics/cases/${case_id}/complete-exam"
              payload: {}
              as: Prosthodontist
              as_user_id: "dr-nunes"
            - call: "POST /prosthetics/case-arches/${arch_id}/start-fabrication"
              payload: {}
              as: Prosthodontist
              as_user_id: "dr-nunes"
            - call: "POST /prosthetics/impressions"
              payload: { case_arch_id: "${arch_id}", capture_method: "DIGITAL_SCAN" }
              as: Prosthodontist
              as_user_id: "dr-nunes"
              captures: { imp_id: $.data.id }
            - call: "POST /prosthetics/impressions/${imp_id}/review"
              payload: { quality_score: 92 }
              as: Prosthodontist
              as_user_id: "dr-nunes"
            - call: "POST /prosthetics/try-ins"
              payload: { case_arch_id: "${arch_id}", milestone_kind: "WAX" }
              as: Prosthodontist
              as_user_id: "dr-nunes"
              captures: { tryin_id: $.data.id }
            - call: "POST /prosthetics/try-ins/${tryin_id}/decide"
              payload: { decision: "APPROVE" }
              as: Prosthodontist
              as_user_id: "dr-nunes"
            - call: "GET /prosthetics/case-arches/${arch_id}"
              payload: {}
              as: Prosthodontist
              as_user_id: "dr-nunes"
              captures: { arch_v: $.data.version }
            - call: "POST /prosthetics/lab-cases"
              payload: { case_arch_id: "${arch_id}", dental_lab_id: "${lab_id}", bench_line: 1, turnaround_class: "STANDARD", unit_count: 1, purpose: "FABRICATION", expected_case_arch_version: "${arch_v}", lab_invoice_amount: 450.00 }
              as: Prosthodontist
              as_user_id: "dr-nunes"
              captures: { lc_id: $.data.id }
            - call: "POST /prosthetics/lab-cases/${lc_id}/dispatch"
              payload: {}
              as: FrontOffice
              as_user_id: "fo-lindgren"
            - call: "POST /prosthetics/lab-cases/${lc_id}/receive"
              payload: {}
              as: LabTechnician
              as_user_id: "${lab_id}"
            - call: "POST /prosthetics/lab-cases/${lc_id}/qc"
              payload: { qc_result: "PASS" }
              as: Prosthodontist
              as_user_id: "dr-nunes"
            - call: "POST /prosthetics/prostheses"
              payload: { case_arch_id: "${arch_id}" }
              as: Prosthodontist
              as_user_id: "dr-nunes"
              captures: { pro_id: $.data.id, pro_v1: $.data.version }
          trigger:
            - call: "POST /prosthetics/services"
              payload: { prosthesis_id: "${pro_id}", service_type: "ADJUSTMENT", expected_prosthesis_version: "${pro_v1}" }
              as: Prosthodontist
              as_user_id: "dr-nunes"
              captures: { svc_in_id: $.data.id }
            - call: "POST /prosthetics/services/${svc_in_id}/complete"
              payload: {}
              as: Prosthodontist
              as_user_id: "dr-nunes"
            - call: "POST /prosthetics/_clock/set_current_utc"
              payload: { to_iso8601: "2026-07-31T00:00:00Z" }
              as: PlatformAdmin
              as_user_id: "admin-root"
            - call: "GET /prosthetics/prostheses/${pro_id}"
              payload: {}
              as: Prosthodontist
              as_user_id: "dr-nunes"
              captures: { pro_v2: $.data.version }
            - call: "POST /prosthetics/services"
              payload: { prosthesis_id: "${pro_id}", service_type: "ADJUSTMENT", expected_prosthesis_version: "${pro_v2}" }
              as: Prosthodontist
              as_user_id: "dr-nunes"
              captures: { svc_out_id: $.data.id }
            - call: "POST /prosthetics/services/${svc_out_id}/complete"
              payload: {}
              as: Prosthodontist
              as_user_id: "dr-nunes"
          assert:
            - "Prosthesis.${pro_id}.adjustment_window_ends_at == 2026-07-30T00:00:00.000Z"
            - "PostDeliveryService.${svc_in_id}.charge_basis == INCLUDED"
            - "PostDeliveryService.${svc_in_id}.charge_amount == 0.00"
            - "PostDeliveryService.${svc_out_id}.charge_basis == CHARGEABLE"
            - "PostDeliveryService.${svc_out_id}.charge_amount == 85.00"
            - "Prosthesis.${pro_id}.adjustments_used == 1 -- only the INCLUDED completion consumed allowance"
            - "Prosthesis.${pro_id}.adjustments_remaining == 3"
            - "ProsthesisCase.${case_id}.billed_amount == 1285.00"

      - name: cob_standard_vs_non_duplication_secondary_payment
        grounds:
          - calculations.claim_secondary_cob_payment
          - state_machines.Claim.SUBMITTED_SECONDARY_to_SECONDARY_PAID
          - entities.Coverage.fields.cob_convention
          - entities.Claim.fields.secondary_paid_amount
        distinguishing_aspect: |
          This dual variant lives on the Claim entity (post-service adjudication), a
          different entity domain from the Predetermination estimate and from the
          appliance-service charge: on identical 1200.00 claims with an identical
          600.00 primary payment, a STANDARD secondary pays 600.00 and a
          NON_DUPLICATION secondary pays 120.00.
        test_recipe:
          setup:
            - "Logical clock at 2026-05-01T00:00:00Z."
            - "Patient S holds a PRIMARY coverage (annual max 1500.00, coinsurance 0.50, effective 2024-01-01) and a SECONDARY coverage with cob_convention STANDARD (annual max 1000.00, coinsurance 0.60, effective 2024-01-01)."
            - "Patient N holds the identical pair except the SECONDARY has cob_convention NON_DUPLICATION."
            - "Each patient has one FLEXIBLE_PARTIAL case with one MAXILLARY arch past complete-exam, so fee_schedule_total is 1200.00 and predetermination_required is false."
            - "Each case has one DRAFT Claim against its PRIMARY coverage."
          setup_api_calls:
            - call: "POST /prosthetics/_clock/set_current_utc"
              payload: { to_iso8601: "2026-05-01T00:00:00Z" }
              as: PlatformAdmin
              as_user_id: "admin-root"
            - call: "POST /prosthetics/patients"
              payload: { full_name: "Sena Ruiz", date_of_birth: "1951-06-09", phone: "555-0201" }
              as: FrontOffice
              as_user_id: "fo-lindgren"
              captures: { pat_s_id: $.data.id }
            - call: "POST /prosthetics/coverages"
              payload: { patient_id: "${pat_s_id}", carrier_name: "Meridian Dental", rank: "PRIMARY", effective_date: "2024-01-01T00:00:00Z", annual_maximum_amount: 1500.00, coinsurance_major_rate: 0.50 }
              as: FrontOffice
              as_user_id: "fo-lindgren"
              captures: { cov_s_pri_id: $.data.id }
            - call: "POST /prosthetics/coverages"
              payload: { patient_id: "${pat_s_id}", carrier_name: "Harborline Health", rank: "SECONDARY", effective_date: "2024-01-01T00:00:00Z", annual_maximum_amount: 1000.00, coinsurance_major_rate: 0.60, cob_convention: "STANDARD" }
              as: FrontOffice
              as_user_id: "fo-lindgren"
              captures: { cov_s_sec_id: $.data.id }
            - call: "POST /prosthetics/cases"
              payload: { patient_id: "${pat_s_id}", prosthesis_type: "FLEXIBLE_PARTIAL" }
              as: FrontOffice
              as_user_id: "fo-lindgren"
              captures: { case_s_id: $.data.id }
            - call: "POST /prosthetics/case-arches"
              payload: { case_id: "${case_s_id}", arch_position: "MAXILLARY" }
              as: Prosthodontist
              as_user_id: "dr-nunes"
            - call: "POST /prosthetics/cases/${case_s_id}/complete-exam"
              payload: {}
              as: Prosthodontist
              as_user_id: "dr-nunes"
            - call: "POST /prosthetics/claims"
              payload: { case_id: "${case_s_id}", coverage_id: "${cov_s_pri_id}" }
              as: FrontOffice
              as_user_id: "fo-lindgren"
              captures: { claim_s_id: $.data.id }
            - call: "POST /prosthetics/patients"
              payload: { full_name: "Noor Vasquez", date_of_birth: "1953-02-21", phone: "555-0202" }
              as: FrontOffice
              as_user_id: "fo-lindgren"
              captures: { pat_n_id: $.data.id }
            - call: "POST /prosthetics/coverages"
              payload: { patient_id: "${pat_n_id}", carrier_name: "Meridian Dental", rank: "PRIMARY", effective_date: "2024-01-01T00:00:00Z", annual_maximum_amount: 1500.00, coinsurance_major_rate: 0.50 }
              as: FrontOffice
              as_user_id: "fo-lindgren"
              captures: { cov_n_pri_id: $.data.id }
            - call: "POST /prosthetics/coverages"
              payload: { patient_id: "${pat_n_id}", carrier_name: "Harborline Health", rank: "SECONDARY", effective_date: "2024-01-01T00:00:00Z", annual_maximum_amount: 1000.00, coinsurance_major_rate: 0.60, cob_convention: "NON_DUPLICATION" }
              as: FrontOffice
              as_user_id: "fo-lindgren"
              captures: { cov_n_sec_id: $.data.id }
            - call: "POST /prosthetics/cases"
              payload: { patient_id: "${pat_n_id}", prosthesis_type: "FLEXIBLE_PARTIAL" }
              as: FrontOffice
              as_user_id: "fo-lindgren"
              captures: { case_n_id: $.data.id }
            - call: "POST /prosthetics/case-arches"
              payload: { case_id: "${case_n_id}", arch_position: "MAXILLARY" }
              as: Prosthodontist
              as_user_id: "dr-nunes"
            - call: "POST /prosthetics/cases/${case_n_id}/complete-exam"
              payload: {}
              as: Prosthodontist
              as_user_id: "dr-nunes"
            - call: "POST /prosthetics/claims"
              payload: { case_id: "${case_n_id}", coverage_id: "${cov_n_pri_id}" }
              as: FrontOffice
              as_user_id: "fo-lindgren"
              captures: { claim_n_id: $.data.id }
          trigger:
            - call: "POST /prosthetics/claims/${claim_s_id}/submit"
              payload: {}
              as: FrontOffice
              as_user_id: "fo-lindgren"
            - call: "POST /prosthetics/claims/${claim_s_id}/post-payment"
              payload: { adjudication_outcome: "PAID" }
              as: FrontOffice
              as_user_id: "fo-lindgren"
            - call: "POST /prosthetics/claims/${claim_s_id}/submit"
              payload: {}
              as: FrontOffice
              as_user_id: "fo-lindgren"
            - call: "POST /prosthetics/claims/${claim_s_id}/post-payment"
              payload: { adjudication_outcome: "PAID" }
              as: FrontOffice
              as_user_id: "fo-lindgren"
            - call: "POST /prosthetics/claims/${claim_n_id}/submit"
              payload: {}
              as: FrontOffice
              as_user_id: "fo-lindgren"
            - call: "POST /prosthetics/claims/${claim_n_id}/post-payment"
              payload: { adjudication_outcome: "PAID" }
              as: FrontOffice
              as_user_id: "fo-lindgren"
            - call: "POST /prosthetics/claims/${claim_n_id}/submit"
              payload: {}
              as: FrontOffice
              as_user_id: "fo-lindgren"
            - call: "POST /prosthetics/claims/${claim_n_id}/post-payment"
              payload: { adjudication_outcome: "PAID" }
              as: FrontOffice
              as_user_id: "fo-lindgren"
          assert:
            - "Claim.${claim_s_id}.primary_paid_amount == 600.00"
            - "Claim.${claim_s_id}.cob_convention_applied == STANDARD"
            - "Claim.${claim_s_id}.secondary_paid_amount == 600.00"
            - "Claim.${claim_s_id}.plan_paid_amount == 1200.00"
            - "Claim.${claim_s_id}.patient_responsibility_amount == 0.00"
            - "Claim.${claim_s_id}.adjudication_status == CLOSED"
            - "Claim.${claim_n_id}.primary_paid_amount == 600.00"
            - "Claim.${claim_n_id}.cob_convention_applied == NON_DUPLICATION"
            - "Claim.${claim_n_id}.secondary_paid_amount == 120.00"
            - "Claim.${claim_n_id}.plan_paid_amount == 720.00"
            - "Claim.${claim_n_id}.patient_responsibility_amount == 480.00"
            - "Coverage.${cov_s_sec_id}.benefit_remaining == 400.00"
            - "Coverage.${cov_n_sec_id}.benefit_remaining == 880.00"

      - name: warranty_clock_restarts_while_replacement_clock_does_not
        grounds:
          - calculations.warranty_and_replacement_clocks
          - entities.Prosthesis.fields.warranty_expires_at
          - entities.Prosthesis.fields.frequency_anchor_at
          - entities.Prosthesis.fields.replacement_eligible_date
          - state_machines.CaseArch.DELIVERED_to_REMAKE_PENDING
        distinguishing_aspect: |
          This dual variant lives on the Prosthesis entity (appliance lifecycle), a
          different entity domain from Predetermination, PostDeliveryService and Claim:
          the remake delivery on 2026-09-01 produces warranty_expires_at 2027-09-01
          (restarted) while replacement_eligible_date stays 2031-05-01 (anchored to the
          2026-05-01 original), so the two clocks disagree by exactly the remake offset.
        test_recipe:
          setup:
            - "Logical clock at 2026-05-01T00:00:00Z."
            - "A FLEXIBLE_PARTIAL case with one MAXILLARY arch delivered on 2026-05-01T00:00:00Z; the original prosthesis has warranty_expires_at 2027-05-01, frequency_anchor_at 2026-05-01 and replacement_eligible_date 2031-05-01."
            - "A PENDING_APPROVAL RemakeRequest raised by dr-nunes with reason_code FIT_FAILURE and no warranty claim."
          setup_api_calls:
            - call: "POST /prosthetics/_clock/set_current_utc"
              payload: { to_iso8601: "2026-05-01T00:00:00Z" }
              as: PlatformAdmin
              as_user_id: "admin-root"
