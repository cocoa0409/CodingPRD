      - name: trip_hold_and_cancel_are_single_shot_per_unit_and_trip_type
        claim_type: Idempotency
        grounds:
          - state_machines.InspectionTrip.SCHEDULED_to_HELD
          - state_machines.InspectionTrip.SCHEDULED_to_CANCELLED
          - validations[priority=18]
          - validations[priority=41]
          - errors.ERR_INVALID_TRIP_STATE
          - errors.ERR_TRIP_TYPE_ALREADY_HELD
        distinguishing_aspect: |
          Holding a trip is single-shot at two different levels: the same trip
          cannot be held or cancelled again (409 ERR_INVALID_TRIP_STATE because HELD
          is terminal), and a SECOND PRE_CONSTRUCTION trip on the same unit cannot
          be held at all (409 ERR_TRIP_TYPE_ALREADY_HELD) even though it is still
          SCHEDULED and cancellable.
