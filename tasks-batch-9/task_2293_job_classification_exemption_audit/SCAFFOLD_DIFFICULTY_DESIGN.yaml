              as: ComplianceAnalyst
              as_user_id: "ca-1"
            - call: "POST /interviews/${iv_mgr_id}/attest"
              payload: {}
              as: ComplianceAnalyst
              as_user_id: "ca-1"
            - call: "POST /interviews"
              payload: { position_id: "${pos_id}", respondent_type: "INCUMBENT", respondent_ref: "INC-A", interviewer_user_id: "int-3", scheduled_start_at: "2026-09-17T09:00:00Z", scheduled_end_at: "2026-09-17T10:00:00Z" }
              as: ComplianceAnalyst
