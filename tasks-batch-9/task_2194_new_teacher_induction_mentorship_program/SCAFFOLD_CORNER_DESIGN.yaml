      - name: certification_action_state_errors
        claim_type: error_triggerable
        grounds: ["errors[ERR_MENTOR_CERT_STATE_INVALID]", "validations[priority=17]", "endpoints[POST /mentors/{id}/certification]", "endpoints[POST /mentors/{id}/training-credits]"]
        distinguishing_aspect: "One code guards four different from-state predicates on two endpoints: CERTIFY on an already CERTIFIED mentor, REINSTATE on a mentor that is not SUSPENDED, RECERTIFY on a SUSPENDED mentor, and a training credit posted to a RETIRED mentor are each refused, while SUSPEND and REINSTATE from their legal states succeed."
        test_recipe:
          setup: ["Mentor Rosa Alvarez at OPEN site NG-001 is CERTIFIED with 18.00 training hours and holds one PROPOSED match with novice Dana Pike. The logical clock is at its startup default 2026-08-01T00:00:00Z."]
          setup_api_calls:
            - call: "POST /sites"
              payload: { name: "Northgate High", site_code: "NG-001", region_code: "NORTH", mentor_slot_cap: 6 }
              as: ProgramAdmin
              captures: { site_id: $.data.id }
            - call: "POST /cohorts"
              payload: { name: "Induction 2026-27", program_year: 2026, region_code: "NORTH", seminar_sessions_required: 1 }
              as: ProgramAdmin
              captures: { cohort_id: $.data.id }
            - call: "POST /mentors"
              payload: { site_id: "${site_id}", full_name: "Rosa Alvarez", subject_endorsements: ["MATH"], caseload_cap: 2 }
              as: ProgramAdmin
              captures: { mentor_id: $.data.id }
            - call: "POST /mentors/${mentor_id}/training-credits"
              payload: { module_code: "FOUNDATIONS", hours: 8.00, completed_on: "2026-07-10" }
              as: ProgramAdmin
            - call: "POST /mentors/${mentor_id}/training-credits"
              payload: { module_code: "OBSERVATION_PROTOCOL", hours: 6.00, completed_on: "2026-07-11" }
              as: ProgramAdmin
            - call: "POST /mentors/${mentor_id}/training-credits"
              payload: { module_code: "EQUITY", hours: 4.00, completed_on: "2026-07-12" }
              as: ProgramAdmin
            - call: "POST /mentors/${mentor_id}/certification"
              payload: { action: "CERTIFY" }
              as: ProgramAdmin
              captures: { mentor_v1: $.data.version }
            - call: "POST /novice-teachers"
              payload: { site_id: "${site_id}", cohort_id: "${cohort_id}", full_name: "Dana Pike", subject_area: "MATH", induction_year: 1 }
              as: ProgramAdmin
              captures: { novice_id: $.data.id }
            - call: "POST /mentor-matches"
              payload: { novice_id: "${novice_id}", mentor_id: "${mentor_id}", expected_mentor_version: "${mentor_v1}" }
              as: ProgramAdmin
              captures: { match_id: $.data.id }
          trigger:
            - call: "POST /mentors/${mentor_id}/certification"
              payload: { action: "CERTIFY" }
              as: ProgramAdmin
            - call: "POST /mentors/${mentor_id}/certification"
              payload: { action: "REINSTATE" }
              as: ProgramAdmin
            - call: "POST /mentors/${mentor_id}/certification"
              payload: { action: "SUSPEND", reason: "Site investigation opened into an unrelated incident" }
              as: ProgramAdmin
            - call: "POST /mentors/${mentor_id}/certification"
              payload: { action: "RECERTIFY" }
              as: ProgramAdmin
            - call: "POST /mentors/${mentor_id}/certification"
              payload: { action: "REINSTATE" }
              as: ProgramAdmin
            - call: "POST /mentors/${mentor_id}/certification"
              payload: { action: "RETIRE", reason: "Mentor retired from district service" }
              as: ProgramAdmin
            - call: "POST /mentors/${mentor_id}/training-credits"
              payload: { module_code: "RECERT_REFRESH", hours: 6.00, completed_on: "2026-07-20" }
              as: ProgramAdmin
          assert:
            - "call 1 returns HTTP 409 with data.error_id == \"ERR_MENTOR_CERT_STATE_INVALID\" — CERTIFY requires UNCERTIFIED or LAPSED"
            - "call 2 returns HTTP 409 with data.error_id == \"ERR_MENTOR_CERT_STATE_INVALID\" — REINSTATE requires SUSPENDED"
            - "call 3 returns HTTP 200 with data.certification_status == \"SUSPENDED\""
            - "call 4 returns HTTP 409 with data.error_id == \"ERR_MENTOR_CERT_STATE_INVALID\" — RECERTIFY requires CERTIFIED"
            - "call 5 returns HTTP 200 with data.certification_status == \"CERTIFIED\""
            - "call 6 returns HTTP 200 with data.certification_status == \"RETIRED\""
            - "call 7 returns HTTP 409 with data.error_id == \"ERR_MENTOR_CERT_STATE_INVALID\" — no training credit may be posted to a RETIRED mentor"
            - "GET /mentors/${mentor_id} reports training_hours_current_cycle == 0.00 — CERTIFY reset the cycle ledger and the refused credit was not banked"
            - "GET /mentor-matches/${match_id} reports match_status == \"PROPOSED\" throughout — a PROPOSED match is not touched by the certification cascade"

