            - "Second approve: error_id == ERR_AGREEMENT_NOT_YET_EFFECTIVE (effective_at 1s in future)"
            - "DataSharingAgreement.${a2_id}.status == PENDING"

  # ===================================================================
  # Rule 9 — compensating_invariant (2 instances, different conserved quantities)
  # ===================================================================
  - rule_id: compensating_invariant
    instances:
      - name: case_reservation_invariant_route_then_cancel
        grounds:
          - calculations.capacity_reservation_balance
          - state_machines.Referral.ROUTED_to_CANCELLED
        distinguishing_aspect: |
          Conserved quantity: ServiceOffering.capacity_consumed (integer case
          reservation count). Forward action route (+1) paired with its
          compensating action cancel (-1) returns capacity_consumed to
          exactly its pre-route value — the invariant formula
          capacity_consumed == count(status IN {ROUTED, ACCEPTED,
          IN_SERVICE}) holds at every step.
        test_recipe:
          setup:
            - "Offering O capacity_total 3, capacity_consumed 0; referral RF created DRAFT"
          setup_api_calls:
            - { call: "POST /care-network/_clock/set_current_utc", payload: { to_iso8601: "2026-09-01T00:00:00Z" }, as: NetworkCoordinator }
            - call: "POST /care-network/networks"
              payload: { name: "Net", coordinator_org_name: "Coord" }
              as: NetworkCoordinator
            - call: "POST /care-network/taxonomy"
              payload: { code: "FOOD", name: "Food" }
              as: NetworkCoordinator
            - call: "POST /care-network/organizations"
              payload: { name: "Sender S", org_type: "CLINIC", ein: "EIN-S" }
              as: NetworkCoordinator
              captures: { s_id: $.data.id }
            - call: "POST /care-network/organizations"
              payload: { name: "Receiver R", org_type: "CBO", ein: "EIN-R" }
              as: NetworkCoordinator
              captures: { r_id: $.data.id }
            - { call: "POST /care-network/organizations/${s_id}/activate", payload: {}, as: NetworkCoordinator }
            - { call: "POST /care-network/organizations/${r_id}/activate", payload: {}, as: NetworkCoordinator }
            - call: "POST /care-network/organizations/${r_id}/offerings"
              payload: { category_code: "FOOD", description: "Meals", capacity_total: 3 }
              as: OrgAdmin
              as_user_id: "${r_id}"
              captures: { o_id: $.data.id }
            - call: "POST /care-network/agreements"
              payload: { party_a_org_id: "${s_id}", party_b_org_id: "${r_id}", effective_at: "2026-09-01T00:00:00Z" }
              as: NetworkCoordinator
              captures: { agr_sr: $.data.id }
            - { call: "POST /care-network/agreements/${agr_sr}/approve", payload: {}, as: NetworkCoordinator }
            - call: "POST /care-network/clients"
              payload: { full_name: "K", date_of_birth: "1990-01-01", zip_code: "94110", gender: "FEMALE" }
              as: CaseWorker
              as_user_id: "${s_id}"
              captures: { k_id: $.data.id }
            - call: "POST /care-network/clients/${k_id}/consents"
              payload: { sender_org_id: "${s_id}", receiver_org_id: "${r_id}", scope: "FULL" }
              as: CaseWorker
              as_user_id: "${s_id}"
              captures: { c_id: $.data.id }
            - call: "POST /care-network/referrals"
              payload: { client_id: "${k_id}", sender_org_id: "${s_id}", receiver_org_id: "${r_id}", service_offering_id: "${o_id}", consent_id: "${c_id}", category_code: "FOOD" }
              as: CaseWorker
              as_user_id: "${s_id}"
              captures: { rf_id: $.data.id }
            - { call: "POST /care-network/referrals/${rf_id}/route", payload: {}, as: CaseWorker, as_user_id: "${s_id}" }
          trigger:
            - { call: "POST /care-network/referrals/${rf_id}/cancel", payload: { reason: "client moved" }, as: CaseWorker, as_user_id: "${s_id}" }
          assert:
            - "After route: capacity_consumed == 1 (observed during setup replay)"
            - "After cancel: ServiceOffering.${o_id}.capacity_consumed == 0 (invariant restored)"
            - "ServiceOffering.${o_id}.capacity_available == 3"
            - "Client.${k_id}.open_referral_count == 0"

      - name: escrow_hold_invariant_void_then_settle
        grounds:
          - calculations.escrow_clawback_settlement
          - state_machines.PaymentClaim.APPROVED_to_VOIDED
        distinguishing_aspect: |
          Conserved quantity: CareNetwork.network_escrow_cents +
          network_escrow_reserved_cents (money, a different conserved type
          than a count). Voiding an APPROVED claim whose provider balance
          cannot cover the clawback moves exactly the shortfall from
          network_escrow_cents into network_escrow_reserved_cents — the SUM
          is unchanged by the void (100000 before and after), satisfying the
          escrow_hold invariant network_escrow_reserved_cents == sum of
          clawback_reserve_cents over VOIDED claims.
        test_recipe:
          setup:
            - "Network escrow 100000; claim approved 8000 but provider balance drained to 3000 via a prior disbursement of a second claim (5000), leaving shortfall 5000 on void"
            - "Simpler pin: two claims approved (5000 + 3000 = balance 8000); disburse the first claim's 5000? — disbursement settles claims individually; instead: approve claim A 8000 (balance 8000), then void of claim A with balance 8000 has shortfall 0. To force shortfall: approve claim A 8000, run disbursement paying A (balance 0), approve claim B 3000 (balance 3000), then void B? void on APPROVED-not-PAID claim B: shortfall = max(0, 3000-3000)=0. Use claim C approved 8000 while balance 3000: approve A 5000, approve B 3000 (balance 8000), disburse A only (balance 3000), then void B (approved 3000, balance 3000, shortfall 0). Final pin: approve A 5000 + B 8000 (balance 13000); disburse A (balance 8000 - hmm)."
            - "Concrete arithmetic: claims X (5000) and Y (8000) approved => balance 13000. Disburse X => balance 8000. Void Y (approved 8000, balance 8000) => shortfall 0. To get a positive shortfall: after disbursing X, approve Z (2000) => balance 10000, disburse nothing more, void Y (8000): balance 10000 >= 8000 shortfall 0. Shortfall requires balance < approved: disburse BOTH X(5000) and Z(2000)? Then balance = 13000+2000-5000-2000 = 8000 = Y. Cleanest: X 5000, Y 8000, Z 2000 approved (balance 15000); disburse X+Z (7000) => balance 8000; then create+approve W 9000 => balance 17000; disburse W? no. Instead disburse X+Z+ part impossible (whole claims only). Use X 5000, Y 10000: balance 15000; disburse X => 10000; approve Z 3000 => 13000; disburse Z => 10000; void Y (10000) => shortfall 0 again. Positive shortfall needs provider balance reduced below an approved claim's amount — since approval always adds to balance and disbursement only removes PAID claims' exact amounts, shortfall arises when a claim is voided AFTER a same-balance pool was partially drained by paying OTHER claims: X 4000, Y 10000 approved => 14000; disburse X => 10000; approve Z 2000 => 12000; disburse Z => 10000; void Y => shortfall 0. Because balance always >= any single outstanding approved claim? No: X 9000, Y 8000 approved => 17000; disburse X => 8000; void Y (8000) => 0. X 9000, Y 8000, disburse X... always equal. True shortfall source: consent-revocation cascade voiding SUBMITTED claims (provisional, never added to balance) uses escrow directly — that's the cleaner escrow test. Pin: claim SUBMITTED (provisional 5000, balance contribution 0); consent revoke cascade voids it; escrow_reserved += 5000, escrow 95000, sum invariant 100000."
