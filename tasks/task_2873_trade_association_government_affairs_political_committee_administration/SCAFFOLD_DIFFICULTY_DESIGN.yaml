  - rule_id: resource_temporal_overlap
    instances:
      - name: prior_approval_closed_closed_windows_touching_at_one_endpoint_collide
        grounds:
          - validations[priority=18].error_id
          - validations[priority=19].error_id
          - entities.PriorApproval.fields.effective_date
          - entities.PriorApproval.fields.expires_at_date
        distinguishing_aspect: |
          PriorApproval windows are CLOSED-CLOSED, so a new window starting on the day the old one ends DOES
          collide - the opposite convention to LobbyingRegistration coverage. The same member, the same day
          (2026-06-30), is rejected here and accepted one day later, which pins the inclusive endpoint.
        test_recipe:
          setup:
            - "The logical clock is moved to 2026-06-01T00:00:00Z so the first window can legitimately be granted."
            - "One ACTIVE member with restricted_class_size 25 holding a GRANTED PriorApproval for 2026-01-01..2026-06-30."
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-06-01T00:00:00Z" }
              as: ComplianceOfficer
              as_user_id: "co-1"
            - call: "POST /advocacy/members"
              payload: { legal_name: "Alpha Steel Co", membership_tier: "PREMIER", home_jurisdiction_code: "FEDERAL", home_district_code: "CA-12", annual_dues_cents: 400000, dues_year: 2026, restricted_class_size: 25, status: "ACTIVE", advocacy_optout: false, engagement_score: 90 }
              as: AssociationAdmin
              as_user_id: "admin-1"
              captures: { m1_id: $.data.id }
            - call: "POST /advocacy/prior-approvals"
              payload: { member_id: "${m1_id}", calendar_year: 2026, solicitable_class_size: 10, effective_date: "2026-01-01", expires_at_date: "2026-06-30" }
              as: ComplianceOfficer
              as_user_id: "co-1"
              captures: { pa1_id: $.data.id }
            - call: "POST /advocacy/prior-approvals/${pa1_id}/grant"
              payload: { authorized_by_name: "R. Okafor, Treasurer" }
              as: MemberDelegate
              as_user_id: "${m1_id}"
          trigger:
            - call: "POST /advocacy/prior-approvals"
              payload: { member_id: "${m1_id}", calendar_year: 2026, solicitable_class_size: 10, effective_date: "2026-06-30", expires_at_date: "2026-12-31" }
              as: ComplianceOfficer
              as_user_id: "co-1"
              captures: { err_id: $.data.error_id, err_msg: $.data.message }
          assert:
            - "PriorApproval.${pa1_id}.status == GRANTED and Member.${m1_id}.pac_solicitable == true (2026-06-01 lies inside the first window)"
            - "The trigger returns 409 with error_id ERR_PRIOR_APPROVAL_WINDOW_CONFLICT - the single shared day 2026-06-30 is an overlap under closed-closed semantics"
            - "No second PriorApproval row is created and Member.${m1_id}.pac_solicitable is still true"
            - "Replaying the request with effective_date 2026-07-01 returns 201 with status REQUESTED, proving the collision was exactly the shared endpoint"
            - "A window with effective_date 2026-12-31 and expires_at_date 2026-07-01 is instead rejected with 422 ERR_PRIOR_APPROVAL_WINDOW_INVALID by the higher-priority shape check, never with the overlap error"
      - name: registration_coverage_half_open_windows_may_abut_but_not_overlap
        grounds:
          - validations[priority=20].error_id
          - state_machines.LobbyingRegistration.transitions[DRAFT->ACTIVE]
          - entities.LobbyingRegistration.fields.coverage_start_date
        distinguishing_aspect: |
          The mirror image of the PriorApproval instance: registration coverage is HALF-OPEN, so a window starting
          on the previous window's end date files successfully, while a window overlapping by 31 days is refused.
          The overlap test also only considers ACTIVE and AMENDMENT_PENDING rows, so the two abutting registrations
          are both live when the third is filed.
        test_recipe:
          setup:
            - "Registration R1 for (FEDERAL, National Manufacturers Association) covering 2026-01-01..2026-07-01, filed and therefore ACTIVE."
            - "Registration R2 for the same pair covering 2026-07-01..2026-12-31, still DRAFT."
            - "Registration R3 for the same pair covering 2026-12-01..2026-12-31, still DRAFT."
          setup_api_calls:
            - call: "POST /advocacy/lobbying-registrations"
              payload: { jurisdiction_code: "FEDERAL", registrant_name: "National Manufacturers Association", coverage_start_date: "2026-01-01", coverage_end_date: "2026-07-01" }
              as: ComplianceOfficer
              as_user_id: "co-1"
              captures: { r1_id: $.data.id }
            - call: "POST /advocacy/lobbying-registrations/${r1_id}/file"
              payload: {}
              as: ComplianceOfficer
              as_user_id: "co-1"
            - call: "POST /advocacy/lobbying-registrations"
              payload: { jurisdiction_code: "FEDERAL", registrant_name: "National Manufacturers Association", coverage_start_date: "2026-07-01", coverage_end_date: "2026-12-31" }
              as: ComplianceOfficer
              as_user_id: "co-1"
              captures: { r2_id: $.data.id }
            - call: "POST /advocacy/lobbying-registrations"
              payload: { jurisdiction_code: "FEDERAL", registrant_name: "National Manufacturers Association", coverage_start_date: "2026-12-01", coverage_end_date: "2026-12-31" }
              as: ComplianceOfficer
              as_user_id: "co-1"
              captures: { r3_id: $.data.id }
          trigger:
            - call: "POST /advocacy/lobbying-registrations/${r2_id}/file"
              payload: {}
              as: ComplianceOfficer
              as_user_id: "co-1"
            - call: "POST /advocacy/lobbying-registrations/${r3_id}/file"
              payload: {}
              as: ComplianceOfficer
              as_user_id: "co-1"
              captures: { err_id: $.data.error_id, err_msg: $.data.message }
          assert:
            - "Filing R2 returns 200 with status ACTIVE and filed_at == 2026-08-01T00:00:00Z: [2026-01-01, 2026-07-01) and [2026-07-01, 2026-12-31) merely abut and do not overlap"
            - "Filing R3 returns 409 with error_id ERR_REGISTRATION_COVERAGE_OVERLAP - [2026-12-01, 2026-12-31) sits inside R2's live window"
            - "LobbyingRegistration.${r3_id}.status is still DRAFT and filed_at == null"
            - "LobbyingRegistration.${r1_id}.status == ACTIVE and LobbyingRegistration.${r2_id}.status == ACTIVE are both unaffected"
            - "A fourth registration for the SAME window but registrant_name 'NMA Political Fund' files successfully, proving the overlap key is (jurisdiction_code, registrant_name)"
