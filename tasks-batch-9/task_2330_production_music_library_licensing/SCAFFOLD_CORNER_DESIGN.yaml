            - call: "POST /music-library/usage-reports"
              payload: { blanket_agreement_id: "${ba1}", period_start: "2026-08-01T00:00:00Z", period_end: "2026-08-30T00:00:00Z" }
              as: LicensingAgent
            - call: "POST /music-library/usage-reports"
              payload: { blanket_agreement_id: "${ba1}", period_start: "2027-08-01T00:00:00Z", period_end: "2027-08-31T00:00:00Z" }
              as: LicensingAgent
            - call: "POST /music-library/usage-reports"
