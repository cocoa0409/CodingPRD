[project]
name = "prd-bench-local-runner"
version = "0.1.0"
description = "Generic benchmark runner: server lifecycle management + pytest execution + structured result collection"
requires-python = ">=3.10"
dependencies = [
    "loguru>=0.7",
    "requests>=2.28",
]

[project.optional-dependencies]
dev = [
    "pytest>=7.0",
    "pytest-timeout>=2.0",
]

[project.scripts]
prd-bench-local-run = "prd_bench_local_runner.cli:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/prd_bench_local_runner"]
