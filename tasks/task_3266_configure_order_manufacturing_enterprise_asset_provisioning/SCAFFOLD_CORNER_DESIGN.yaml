              as: CustomerUser
              as_user_id: "${vv1_a}"
              captures: { vv1_cf: $.data.id }
            - { call: "POST /api/configurations/${vv1_cf}/validate", payload: {}, as: CustomerUser, as_user_id: "${vv1_a}", captures: { vv1_cv: $.data.version } }
            - { call: "POST /api/orders", payload: { account_id: "${vv1_a}", po_number: "PO-VV1" }, as: CustomerUser, as_user_id: "${vv1_a}", captures: { vv1_o: $.data.id } }
