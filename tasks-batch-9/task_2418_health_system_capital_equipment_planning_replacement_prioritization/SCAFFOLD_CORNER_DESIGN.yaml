      - name: asset_eligibility_bar_at_the_thirty_point_ruls_boundary_on_submit
        claim_type: satisfaction_to_pass
        grounds:
          - validations[priority=60]
          - errors.ERR_ASSET_NOT_REPLACEMENT_ELIGIBLE
        excluded_because:
          difficulty_instance: ruls_eligibility_at_exactly_thirty_on_submit
          rationale: >-
            The §1.8 instance already drives adjusted_ruls_score to exactly 30.00 (passes) and 30.01
            (rejected with ERR_ASSET_NOT_REPLACEMENT_ELIGIBLE) on the submit endpoint, which is precisely
            the violation/satisfaction pair a corner instance would build.

      - name: revision_limit_after_three_returns
        claim_type: violation_to_error
        grounds:
          - validations[priority=62]
          - errors.ERR_REVISION_LIMIT_EXCEEDED
        excluded_because:
          difficulty_instance: replacement_request_screen_branch_and_revision_loop
          rationale: >-
            The §1.8 cyclic-state-machine instance walks the RETURNED -> DRAFT loop until revision_count
            reaches the cap and asserts ERR_REVISION_LIMIT_EXCEEDED on the fourth revision.

      - name: negotiation_round_cap_on_revise
        claim_type: violation_to_error
        grounds:
          - validations[priority=63]
          - errors.ERR_NEGOTIATION_ROUND_LIMIT
        excluded_because:
          difficulty_instance: vendor_quote_negotiation_cycle_bounded_by_round_cap
          rationale: >-
            The §1.8 instance runs the SUBMITTED -> COUNTERED -> SUBMITTED cycle to negotiation_round 3
            and asserts that the next counter returns ERR_NEGOTIATION_ROUND_LIMIT, covering both the
            in-bound and out-of-bound sides of the cap.

      - name: buffered_downtime_conflict_between_two_projects_of_one_department
        claim_type: violation_to_error
        grounds:
          - validations[priority=84]
          - errors.ERR_DOWNTIME_WINDOW_CONFLICT
        excluded_because:
          difficulty_instance: department_downtime_buffered_half_open_boundary
          rationale: >-
            The §1.8 boundary instance places a second downtime window exactly 24h after the first one's
            end (accepted, half-open) and one second earlier (ERR_DOWNTIME_WINDOW_CONFLICT), so both
            directions of V46 are already pinned.

      - name: construction_capacity_conflict_within_one_facility
        claim_type: violation_to_error
        grounds:
          - validations[priority=85]
          - errors.ERR_CONSTRUCTION_CAPACITY_EXCEEDED
        excluded_because:
          difficulty_instance: facility_construction_closed_interval_capacity
          rationale: >-
            The §1.8 instance drives two construction windows that touch on a single instant against
            max_concurrent_construction 1 and asserts ERR_CONSTRUCTION_CAPACITY_EXCEEDED, plus the
            disjoint pair that is accepted.

      - name: decommission_before_the_installation_is_commissioned
        claim_type: violation_to_error
        grounds:
          - validations[priority=90]
          - errors.ERR_INSTALLATION_NOT_COMMISSIONED
        excluded_because:
          difficulty_instance: asset_decommission_depends_on_project_commissioning
          rationale: >-
            The §1.8 cross-entity instance attempts the decommission at every equipment_status short of
            COMMISSIONED and asserts ERR_INSTALLATION_NOT_COMMISSIONED, then succeeds once the axis
            converges.

      - name: stale_expected_request_version_on_a_vote
        claim_type: priority_ordering
        grounds:
          - validations[priority=58]
          - errors.ERR_STALE_REQUEST_VERSION
        excluded_because:
          difficulty_instance: existence_beats_stale_version_on_vote
          rationale: >-
            The §1.8 priority-ordering instance covers both halves: a stale expected_request_version alone
            returns ERR_STALE_REQUEST_VERSION at 412, and a stale version combined with an unknown request
            id returns ERR_REQUEST_NOT_FOUND because V03 (20) outranks V21 (58).

      - name: validation_ladder_order_on_screen
        claim_type: priority_ordering
        grounds:
          - validations[priority=10]
          - validations[priority=12]
          - validations[priority=40]
        excluded_because:
          difficulty_instance: auth_beats_shape_on_screen
          rationale: >-
            The §1.8 instance walks the head of the ladder on one endpoint — missing X-User-ID with an
            invalid body returns ERR_USER_CONTEXT_REQUIRED (401), a wrong role with the same invalid body
            returns ERR_UNAUTHORIZED (403), and only a correctly authorised call reaches ERR_VALIDATION.

      - name: request_state_outranks_allocation_capacity_on_fund
        claim_type: priority_ordering
        grounds:
          - validations[priority=52]
          - validations[priority=77]
        excluded_because:
          difficulty_instance: request_state_beats_allocation_capacity_on_fund
          rationale: >-
            The §1.8 instance funds a request that is both in the wrong state and over its allocation and
            asserts ERR_REQUEST_INVALID_STATE, then repairs the state to expose
            ERR_ALLOCATION_INSUFFICIENT underneath.

