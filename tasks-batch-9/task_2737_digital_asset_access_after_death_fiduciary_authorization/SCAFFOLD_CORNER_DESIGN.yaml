            - "${sub_class2} == LICENSE_TERMINATES_AT_DEATH and ${sub_reason2} == CATEGORY_SUBSCRIPTION_LICENCE (rule 2 still wins)"
            - "POST /digital-assets/{asset_id}/transferability-reviews returns HTTP 200 and is callable repeatedly, each call incrementing DigitalAsset.version by exactly 1"

      - name: the_authority_projection_stays_live_while_the_granted_scope_stays_frozen
