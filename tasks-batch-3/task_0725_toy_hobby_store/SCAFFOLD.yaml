      - { name: discount_cents, type: integer, source: computed, description: "Sum of per-line floored loyalty discounts" }
      - { name: total_cents, type: integer, source: computed, description: "subtotal_cents - discount_cents" }
      - { name: amount_paid_cents, type: integer, source: computed, description: "Cumulative payments applied", constraints: ">= 0" }
      - { name: pricing_variant, type: enum, source: system, description: "PROVISIONAL | FINAL; FINAL locked at mark-ready", default: PROVISIONAL }
      - { name: created_at, type: datetime, source: system, description: "ISO 8601 UTC" }
