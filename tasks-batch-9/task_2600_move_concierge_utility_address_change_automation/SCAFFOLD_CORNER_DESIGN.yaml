              captures: { fs_id: $.data.id }
            - call: "POST /residents"
              payload: { full_name: "Dana Ruiz", email: "dana.ruiz@example.com", phone_last4: "4417", date_of_birth: "1988-04-12", ssn_last4: "6621" }
              as: PlatformAdmin
              captures: { res1_id: $.data.id }
            - call: "POST /residents"
              payload: { full_name: "Marco Ruiz", email: "dana.ruiz@example.com", phone_last4: "9052", date_of_birth: "1979-11-02", ssn_last4: "3318" }
              as: PlatformAdmin
              captures: { res2_id: $.data.id }
            - call: "POST /service-addresses"
              payload: { line1: "18 Maple Ct", city: "Atlanta", state_code: "GA", postal_code: "30301" }
              as: PlatformAdmin
              captures: { orig_id: $.data.id }
            - call: "POST /service-addresses"
              payload: { line1: "402 Peachtree Way", unit: "7B", city: "Atlanta", state_code: "GA", postal_code: "30302" }
              as: PlatformAdmin
              captures: { d1_id: $.data.id }
            - call: "POST /service-addresses"
              payload: { line1: "915 Juniper St", city: "Atlanta", state_code: "GA", postal_code: "30302" }
              as: PlatformAdmin
              captures: { d2_id: $.data.id }
            - call: "POST /service-addresses"
              payload: { line1: "77 Oak Ridge Rd", city: "Macon", state_code: "GA", postal_code: "31201" }
              as: PlatformAdmin
              captures: { d3_id: $.data.id }
            - call: "POST /moves"
              payload: { resident_id: "${res1_id}", feed_source_id: "${fs_id}", origin_address_id: "${orig_id}", destination_address_id: "${d1_id}", move_date: "2026-08-20" }
              as: MoveOpsAgent
              captures: { mv_a_id: $.data.id }
            - call: "POST /moves"
              payload: { resident_id: "${res2_id}", feed_source_id: "${fs_id}", origin_address_id: "${orig_id}", destination_address_id: "${d2_id}", move_date: "2026-08-25" }
              as: MoveOpsAgent
              captures: { mv_c_id: $.data.id }
          trigger:
            - call: "POST /moves"
              payload: { resident_id: "${res2_id}", feed_source_id: "${fs_id}", origin_address_id: "${orig_id}", destination_address_id: "${d3_id}", move_date: "2026-08-04" }
              as: MoveOpsAgent
              captures: { mv_b_id: $.data.id }
          assert:
            - "the trigger returns HTTP 201 with data.duplicate_match_score == 0.65, not 0.64"
            - "the winning candidate is move C: name 1.00*0.35 = 0.35 (same resident, identical name), email 0.25, address 0.00 (31201 against 30302, neither hash nor postal match), recency (30-21)/30*0.15 = 0.045, raw 0.645 rounded half up to 0.65"
            - "data.duplicate_candidate_move_id == ${mv_c_id}, not ${mv_a_id}, whose score is only 0.53 (name 0.21 + email 0.25 + address 0.00 + recency (30-16)/30*0.15 = 0.07): ranking is by score DESC before created_at ASC"
            - "data.duplicate_flag == NONE (0.65 < 0.80) and data.lifecycle_status == INTAKE"

