              captures: { kl1_id: $.data.id }
            - call: "POST /kit-lines/${kl1_id}/receipts"
              payload: { units: 10 }
              as: FulfillmentOps
            - call: "POST /campaigns/${camp_id}/open-screening"
              payload: {}
              as: CampaignManager
            - call: "POST /panelists"
              payload: { email: "ed1@example.com", display_name: "ED One", address_hash: "H-ED1", account_opened_at: "2026-01-01T00:00:00Z", segment_code: "URBAN_MILLENNIAL" }
              as: Anonymous
