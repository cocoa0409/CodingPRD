  # ---------------------------------------------------------------------------
  # Rule 9 — compensating_invariant (different conserved quantities)
  # ---------------------------------------------------------------------------
  - rule_id: compensating_invariant
    instances:
      - name: chargeoff_recovery_principal_conservation
        grounds:
          - calculations.recovery_allocation
          - calculations.loss_given_default
        distinguishing_aspect: |
          Conserved quantity 1 — total principal ledger: for any charge-off
          of X followed by a CHRONOLOGICAL recovery of X (with no other
          activity), current_principal + charged_off is INVARIANT across the
          pair (charge-off moves X from current to charged_off; the recovery
          moves it back); unapplied_cash stays 0.
