            - "second policyholder created_at == 2026-06-15T08:30:00Z (after set)"

  # ===========================================================================
  # Section: consistency_model (immediate)
  # ===========================================================================
  - section: consistency_model
    instances:
      - name: immediate_visibility_in_same_response
        claim_type: correct_result
        grounds: ["complexity_profile.consistency_model"]
        distinguishing_aspect: "Immediate consistency: the POST response body reflects the mutation (status, version, computed fields) without any re-read; a follow-up GET returns identical values."
        test_recipe:
          setup: ["FL regulation; policyholder + policy; claim SUBMITTED"]
          setup_api_calls:
            - call: "POST /state-regulations"
              payload: { state_code: "FL", zero_deductible_windshield: false, glass_sales_tax_rate_bp: 0 }
              as: NetworkAdmin
            - call: "POST /policyholders"
              payload: { full_name: "Immediate", email: "im@x.com", phone: "555-8001", state_code: "FL" }
              as: NetworkAdmin
              captures: { ph_id: $.data.id }
            - call: "POST /policies"
              payload: { policyholder_id: "${ph_id}", policy_number: "PN-IM-1", state_code: "FL", coverage_type: "COMPREHENSIVE", deductible_cents: 50000, effective_start_date: "2026-01-01", effective_end_date: "2027-01-01" }
              as: NetworkAdmin
              captures: { pol_id: $.data.id }
            - call: "POST /claims"
              payload: { policy_id: "${pol_id}", incident_state_code: "FL", service_zip_code: "33601", part_category: "WINDSHIELD", loss_date: "2026-04-15", description: "im claim", requires_adas_calibration: false, estimated_repair_cost_cents: 80000 }
              as: Policyholder
              as_user_id: "${ph_id}"
              captures: { claim_id: $.data.id }
          trigger:
            - call: "POST /claims/${claim_id}/verify-coverage"
              payload: {}
              as: ClaimAdjuster
              captures: { resp_status: $.data.status, resp_ded: $.data.deductible_applied_cents }
            - call: "GET /claims/${claim_id}"
              as: ClaimAdjuster
          assert:
            - "verify response itself carries status == COVERAGE_VERIFIED and deductible_applied_cents == 50000 (no re-read needed)"
            - "GET /claims/${claim_id} returns identical status COVERAGE_VERIFIED and deductible_applied_cents 50000"
