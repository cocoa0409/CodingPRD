            - "the payer-scoped enrollment read reports exactly 2 rows in status SUSPENDED"
            - "the clinician read reports exactly 2 rows with billing_posture FROZEN, one per clinician"
            - "GET /network/payer-enrollments?clinician_id=${clinician_id} still returns 1 row, now in SUSPENDED status"
            - "restoring the payer with status ACTIVE leaves both enrollments SUSPENDED, so GET /network/payers/${payer_id}/payer-enrollments?status=SUSPENDED still returns 2 rows"

