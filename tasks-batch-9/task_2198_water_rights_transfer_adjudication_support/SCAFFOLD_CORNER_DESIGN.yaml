            - {call: "POST /claimants", payload: {legal_name: "Bell Cattle Trust", contact_email: "b@bell.example", entity_type: INDIVIDUAL}, as: WaterRightsAnalyst, captures: {cl_b: "$.data.id"}}
            - {call: "POST /water-rights", payload: {claimant_id: "${cl_a}", right_number: "WR-2198-001", priority_date: "1901-05-01T00:00:00Z", source_stream_code: "SNK-14", purpose_of_use: IRRIGATION, place_of_use_acres: 120.00, authorized_diversion_af: 400.00, authorized_rate_cfs: 5.000}, as: WaterRightsAnalyst, captures: {wr: "$.data.id"}}
            - {call: "POST /water-rights/${wr}/beneficial-use-records", payload: {use_year: 2023, reported_diversion_af: 300.000, irrigated_acres: 100.00, verification_source: METER}, as: WaterRightsAnalyst}
            - {call: "POST /water-rights/${wr}/beneficial-use-records", payload: {use_year: 2024, reported_diversion_af: 300.000, irrigated_acres: 100.00, verification_source: METER}, as: WaterRightsAnalyst}
            - {call: "POST /water-rights/${wr}/beneficial-use-records", payload: {use_year: 2025, reported_diversion_af: 300.000, irrigated_acres: 100.00, verification_source: METER}, as: WaterRightsAnalyst}
            - {call: "POST /water-rights/${wr}/activate", as: WaterRightsAnalyst}
            - {call: "POST /water-rights/${wr}/hcu-studies", payload: {method: DIVERSION_BASED, study_period_start_year: 2023, study_period_end_year: 2025}, as: WaterRightsAnalyst, captures: {st: "$.data.id"}}
            - {call: "GET /water-rights/${wr}", as: WaterRightsAnalyst, captures: {wr_v1: "$.data.version"}}
            - {call: "POST /hcu-studies/${st}/certify", payload: {expected_water_right_version: "${wr_v1}"}, as: WaterRightsAnalyst}
            - {call: "POST /transfer-applications", payload: {water_right_id: "${wr}", hcu_study_id: "${st}", application_type: CHANGE_OF_USE, requested_af: 100.00, proposed_purpose_of_use: MUNICIPAL}, as: WaterRightsAnalyst, captures: {app: "$.data.id"}}
            - {call: "POST /transfer-applications/${app}/injury-analyses", payload: {method: SEASONAL_AVERAGE, pod_move_miles: 0.00}, as: WaterRightsAnalyst}
            - {call: "GET /water-rights/${wr}", as: WaterRightsAnalyst, captures: {wr_v2: "$.data.version"}}
            - {call: "POST /transfer-applications/${app}/submit", payload: {expected_water_right_version: "${wr_v2}"}, as: WaterRightsAnalyst}
            - {call: "POST /transfer-applications/${app}/publish", as: WaterRightsAnalyst}
            - {call: "POST /protests", payload: {transfer_application_id: "${app}", protestant_claimant_id: "${cl_b}", claimed_injury_af: 10.00, basis: INJURY_TO_SENIOR_RIGHT}, as: Claimant, as_user_id: "${cl_b}", captures: {pr: "$.data.id"}}
            - {call: "POST /protests/${pr}/route", payload: {track: NEGOTIATION}, as: HearingOfficer}
          trigger:
            - {call: "POST /protests/${pr}/resolve", payload: {outcome: STIPULATE, resolution_note: "One hundredth over the claim.", stipulated_offset_af: 10.01}, as: HearingOfficer, captures: {err_hi: "$.data.error_id"}}
            - {call: "POST /protests/${pr}/resolve", payload: {outcome: STIPULATE, resolution_note: "Zero-value stipulation.", stipulated_offset_af: 0.00}, as: HearingOfficer, captures: {err_lo: "$.data.error_id"}}
            - {call: "POST /protests/${pr}/resolve", payload: {outcome: STIPULATE, resolution_note: "Full claim stipulated.", stipulated_offset_af: 10.00}, as: HearingOfficer}
          assert:
            - "10.01 AF: HTTP 422 with error_id ERR_OFFSET_EXCEEDS_CLAIM."
            - "0.00 AF: HTTP 422 with the SAME error_id ERR_OFFSET_EXCEEDS_CLAIM — the lower bound is strict (> 0), not >= 0."
            - "Both rejections leave the protest in IN_NEGOTIATION with stipulated_offset_af 0.00 and the application in UNDER_PROTEST with unresolved_protest_count 1."
            - "10.00 AF: HTTP 200, protest status RESOLVED_STIPULATED and stipulated_offset_af 10.00."
            - "The analysis then reads offset_af 10.00 and net_injury_af 68.00 (78.00 gross - 10.00 offset), and unresolved_protest_count returns to 0."

      - name: err_study_right_mismatch_when_the_cited_study_belongs_to_another_right
        claim_type: violation_to_error
        grounds:
          - errors[ERR_STUDY_RIGHT_MISMATCH]
          - validations[priority=9]
          - validations[priority=7]
        distinguishing_aspect: >-
          Both foreign keys resolve — the study exists and the right exists — so the
          priority-7 existence check passes and the request is stopped instead by the
          cross-field coherence rule at priority 9, which requires the two FKs to
          agree with each other. A pure per-field FK check would accept this body.
        test_recipe:
          setup:
            - "Clock 2026-03-01T00:00:00Z; claimant A holds WR-2198-001 with certified study S1 (195.00 AF) and also holds WR-2198-002, which has no study of its own."
          setup_api_calls:
