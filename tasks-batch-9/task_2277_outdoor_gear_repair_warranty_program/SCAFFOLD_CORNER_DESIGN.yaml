  - section: endpoints
    instances:
      - name: gear_model_crud_create_read_patch_and_filtered_list
        claim_type: standard_crud
        grounds:
          - endpoints[POST /gear-service/gear-models]
          - endpoints[GET /gear-service/gear-models/{id}]
          - endpoints[PATCH /gear-service/gear-models/{id}]
          - endpoints[GET /gear-service/gear-models]
        distinguishing_aspect: "The only mutable catalog fields are discontinued_at, successor_model_id and msrp_cents, and the PATCH that discontinues TNT-ASCENT-2 in favour of TNT-ASCENT-3 must both bump the row's version and re-point every SUCCESSOR_MSRP valuation of that model, which the list filter on successor_model_id then confirms."
        test_recipe:
          setup:
            - "clock 2026-06-15T09:00:00Z; two TENT_SHELTER models in the catalog, neither discontinued yet"
          setup_api_calls:
            - call: "POST /gear-service/_clock/set_current_utc"
              payload: { current_utc: "2026-06-15T09:00:00Z" }
              as: ProgramAdmin
            - call: "POST /gear-service/gear-models"
              payload: { model_code: "TNT-ASCENT-3", name: "Ascent 3P Tent", category: "TENT_SHELTER", msrp_cents: 99900, release_year: 2024, warranty_years: 5 }
              as: ProgramAdmin
              captures: { gm3_id: $.data.id }
            - call: "POST /gear-service/gear-models"
              payload: { model_code: "TNT-ASCENT-2", name: "Ascent 2P Tent", category: "TENT_SHELTER", msrp_cents: 79900, release_year: 2019, warranty_years: 5 }
              as: ProgramAdmin
              captures: { gm2_id: $.data.id, gm2_v1: $.data.version }
            - call: "POST /gear-service/customers"
              payload: { full_name: "Rowan Ives", email: "rowan@example.com", loyalty_tier: "PRO" }
              as: ServiceAgent
              captures: { cust_id: $.data.id }
            - call: "POST /gear-service/gear-items"
              payload: { gear_model_id: "${gm2_id}", owner_customer_id: "${cust_id}", serial_number: "AS2-00417", purchase_date: "2023-05-10T00:00:00Z", purchase_price_cents: 74900, proof_of_purchase_type: "RECEIPT", proof_of_purchase_ref: "POS-88213", condition_grade: "B" }
              as: ServiceAgent
              captures: { item_id: $.data.id }
          trigger:
            - call: "GET /gear-service/gear-models/${gm2_id}"
              payload: {}
              as: ServiceAgent
            - call: "PATCH /gear-service/gear-models/${gm2_id}"
              payload: { discontinued_at: "2026-03-01T00:00:00Z", successor_model_id: "${gm3_id}" }
              as: ProgramAdmin
            - call: "GET /gear-service/gear-models?category=TENT_SHELTER&limit=1&offset=0"
              payload: {}
              as: ServiceAgent
            - call: "GET /gear-service/gear-models?successor_model_id=${gm3_id}"
              payload: {}
              as: ServiceAgent
            - call: "GET /gear-service/gear-items/${item_id}"
              payload: {}
              as: ServiceAgent
          assert:
            - "first trigger: HTTP 200 with model_code == TNT-ASCENT-2, msrp_cents == 79900, warranty_years == 5, lifetime_warranty == false, discontinued_at == null, successor_model_id == null, parts_support_status == NO_SUPPORT, defect_claim_count == 0, repairability_flag == NONE, version == ${gm2_v1}"
            - "second trigger: HTTP 200 with discontinued_at == 2026-03-01T00:00:00Z, successor_model_id == ${gm3_id}, msrp_cents still 79900, and version advanced past ${gm2_v1}"
            - "third trigger: HTTP 200 with total_count == 2, has_more == true and exactly 1 row in data"
            - "fourth trigger: HTTP 200 with total_count == 1, has_more == false and the single row's id == ${gm2_id}"
            - "fifth trigger: GearItem.${item_id}.replacement_value_successor_cents == 89910 (0.9 * 99900 — the PATCH re-pointed the valuation away from 71910) while replacement_value_depreciated_cents stays 52430"

