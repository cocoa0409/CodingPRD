            - 'the 80 attempt returns HTTP 201 with TrainingCertification.${cert_id}.status == "VALID" and .score == 80'
            - 'GET /recruitment/agencies/${ag1_id}/training-certifications returns total_count == 1'

      - name: future_dated_incident_and_certification_rejected
        claim_type: temporal_validation
        grounds:
          - validations[priority=73]
          - errors[ERR_FUTURE_DATE_NOT_ALLOWED]
          - endpoints["POST /_clock/set_current_utc"]
        distinguishing_aspect: |
          Both write paths that accept a caller-supplied historical date are clamped to the
          logical clock: with the clock at 2026-08-01, occurred_on 2026-08-02 and issued_on
          2026-08-02 are ERR_FUTURE_DATE_NOT_ALLOWED (422), and both become acceptable once
          the clock is advanced past them.
        test_recipe:
          setup:
            - "One agency; the clock is at the default 2026-08-01T00:00:00Z."
          setup_api_calls:
            - call: "POST /recruitment/agencies"
              payload: { legal_name: "Future Date Agency", home_country_code: "IN" }
              as: RecruitmentOfficer
              as_user_id: "officer-1"
              captures: { ag1_id: "$.data.id" }
          trigger:
            - call: "POST /recruitment/integrity-incidents"
              payload: { agency_id: "${ag1_id}", category: "PROHIBITED_CLAIM", severity: "LOW", occurred_on: "2026-08-02", source: "STUDENT_COMPLAINT" }
              as: ComplianceOfficer
              as_user_id: "compliance-1"
              captures: { err_inc: "$.data.error_id" }
            - call: "POST /recruitment/agencies/${ag1_id}/training-certifications"
              payload: { module_code: "VISA_INTEGRITY", score: 90, issued_on: "2026-08-02" }
              as: RecruitmentOfficer
              as_user_id: "officer-1"
              captures: { err_cert: "$.data.error_id" }
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-08-02T00:00:00Z" }
              as: ComplianceOfficer
              as_user_id: "compliance-1"
            - call: "POST /recruitment/integrity-incidents"
              payload: { agency_id: "${ag1_id}", category: "PROHIBITED_CLAIM", severity: "LOW", occurred_on: "2026-08-02", source: "STUDENT_COMPLAINT" }
              as: ComplianceOfficer
              as_user_id: "compliance-1"
              captures: { inc_ok_id: "$.data.id" }
          assert:
            - 'both pre-advance calls return HTTP 422 with data.error_id == "ERR_FUTURE_DATE_NOT_ALLOWED"'
            - 'the clock advance returns data.current_utc == "2026-08-02T00:00:00Z"'
            - 'the repeated incident write returns HTTP 201 with IntegrityIncident.${inc_ok_id}.occurred_on == "2026-08-02" and .status == "REPORTED"'
            - 'Agency.${ag1_id}.rolling_risk_score == 0.00 (a REPORTED incident never scores)'

