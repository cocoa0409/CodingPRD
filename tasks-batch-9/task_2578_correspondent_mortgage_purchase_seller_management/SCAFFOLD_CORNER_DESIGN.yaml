      - name: duplicate_tin_product_code_and_adjustment_code_are_rejected
        claim_type: violation_to_error
        grounds:
          - validations[priority 55]
          - validations[priority 56]
          - validations[priority 57]
        distinguishing_aspect: |
          The three uniqueness rows differ in scope: Seller.tin and
          ProductEligibility.product_code are unique GLOBALLY, while
          PricingAdjustment.adjustment_code is unique only WITHIN its product —
          so re-using LLPA-F700-L85 on a second product is accepted (201)
          while re-using it on the same product is ERR_DUPLICATE_ADJUSTMENT_CODE.
