  - rule_id: boundary_precision_check
    instances:
      - name: stipend_tier_gold_boundary_at_20_points
        grounds:
          - calculations.stipend_tier
          - entities.Member.fields.points_tier
          - entities.Member.fields.points_ytd
        distinguishing_aspect: "Metric = points (via GET /members/{id}/summary): points_ytd of exactly 20 is GOLD (>= boundary), 19 is SILVER; tested at 19 and 20."
        test_recipe:
          setup:
            - "Two members: one with +19 PointAdjustment, one with +20."
          setup_api_calls:
            - { call: "POST /members", payload: { full_name: "Off Bd", email: "offbd@x.com", role_class: "OFFICER", join_date: "2026-01-01T00:00:00Z" }, as: Chief, captures: { off_id: "$.data.id" } }
            - { call: "POST /members", payload: { full_name: "M19", email: "m19@x.com", role_class: "EMT", join_date: "2026-01-01T00:00:00Z", dues_balance_cents: 0 }, as: Chief, captures: { m19: "$.data.id" } }
            - { call: "POST /members", payload: { full_name: "M20", email: "m20@x.com", role_class: "EMT", join_date: "2026-01-01T00:00:00Z", dues_balance_cents: 0 }, as: Chief, captures: { m20: "$.data.id" } }
            - { call: "POST /members/${m19}/point-adjustments", payload: { points: 19, reason: "b19" }, as: Officer, as_user_id: "${off_id}" }
            - { call: "POST /members/${m20}/point-adjustments", payload: { points: 20, reason: "b20" }, as: Officer, as_user_id: "${off_id}" }
          trigger:
            - { call: "GET /members/${m19}/summary?basis=FINAL", payload: {}, as: Officer, as_user_id: "${off_id}", captures: { t19: "$.data.points_tier" } }
            - { call: "GET /members/${m20}/summary?basis=FINAL", payload: {}, as: Officer, as_user_id: "${off_id}", captures: { t20: "$.data.points_tier" } }
          assert:
            - "M19 summary: data.points_tier == SILVER AND data.stipend_cents == 2850"
            - "M20 summary: data.points_tier == GOLD AND data.stipend_cents == 5000"

      - name: cert_expiry_instant_boundary
        grounds:
          - state_machines.Certification.EXPIRING_to_EXPIRED
          - state_machines.Certification.CURRENT_to_EXPIRING
          - entities.Certification.fields.expires_at
        distinguishing_aspect: "Metric = time (via POST /certifications/sweep then GET): at clock == expires_at (2027-03-01T00:00:00Z) the cert is EXPIRED (>= boundary); at clock == expires_at - 1s it is EXPIRING (different endpoint/metric than the points boundary)."
        test_recipe:
          setup:
            - "Two identical FIREFIGHTER_1 certs issued CURRENT at 2026-03-01 (expires 2027-03-01)."
          setup_api_calls:
            - { call: "POST /members", payload: { full_name: "Off Ce", email: "offce@x.com", role_class: "OFFICER", join_date: "2026-01-01T00:00:00Z" }, as: Chief, captures: { off_id: "$.data.id" } }
            - { call: "POST /members", payload: { full_name: "M CeA", email: "mcea@x.com", role_class: "FIREFIGHTER", join_date: "2026-01-01T00:00:00Z" }, as: Chief, captures: { ma: "$.data.id" } }
            - { call: "POST /members", payload: { full_name: "M CeB", email: "mceb@x.com", role_class: "FIREFIGHTER", join_date: "2026-01-01T00:00:00Z" }, as: Chief, captures: { mb: "$.data.id" } }
            - { call: "POST /members/${ma}/certifications", payload: { cert_type: "FIREFIGHTER_1", category: "FIRE" }, as: Officer, as_user_id: "${off_id}", captures: { ca: "$.data.id" } }
            - { call: "POST /members/${mb}/certifications", payload: { cert_type: "FIREFIGHTER_1", category: "FIRE" }, as: Officer, as_user_id: "${off_id}", captures: { cb: "$.data.id" } }
            - { call: "POST /members/${ma}/training-records", payload: { category: "FIRE", hours: 24, training_date: "2026-03-01T00:00:00Z" }, as: Officer, as_user_id: "${off_id}" }
            - { call: "POST /members/${mb}/training-records", payload: { category: "FIRE", hours: 24, training_date: "2026-03-01T00:00:00Z" }, as: Officer, as_user_id: "${off_id}" }
            - { call: "POST /certifications/${ca}/issue", payload: {}, as: Officer, as_user_id: "${off_id}" }
            - { call: "POST /certifications/${cb}/issue", payload: {}, as: Officer, as_user_id: "${off_id}" }
          trigger:
            - { call: "POST /_clock/set_current_utc", payload: { to_iso8601: "2027-02-28T23:59:59Z" }, as: Chief }
            - { call: "POST /certifications/sweep", payload: {}, as: Officer, as_user_id: "${off_id}" }
            - { call: "GET /certifications/${ca}", payload: {}, as: Officer, as_user_id: "${off_id}", captures: { sa: "$.data.status" } }
            - { call: "POST /_clock/set_current_utc", payload: { to_iso8601: "2027-03-01T00:00:00Z" }, as: Chief }
            - { call: "POST /certifications/sweep", payload: {}, as: Officer, as_user_id: "${off_id}" }
            - { call: "GET /certifications/${cb}", payload: {}, as: Officer, as_user_id: "${off_id}", captures: { sb: "$.data.status" } }
          assert:
            - "At clock 2027-02-28T23:59:59Z: Certification.${ca}.status == EXPIRING"
            - "At clock 2027-03-01T00:00:00Z: Certification.${cb}.status == EXPIRED"

  - rule_id: cross_entity_state_dependency
    instances:
      - name: publish_requires_apparatus_in_service
        grounds:
          - state_machines.DutyShift.DRAFT_to_PUBLISHED
