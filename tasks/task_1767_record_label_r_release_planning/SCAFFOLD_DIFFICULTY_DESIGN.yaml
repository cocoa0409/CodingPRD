            - "Overlapping beat rejected: error_id == ERR_BEAT_WINDOW_OVERLAP (2026-08-14 < 2026-08-15 intersects B2)"

      - name: lead_time_exact_boundary_schedule
        grounds:
          - validations[priority=26]
          - entities.Label.fields.release_lead_days
        distinguishing_aspect: |
          Metric release-lead days via POST /api/releases/{id}/schedule: a
          release_date exactly 21 days out (2026-08-22 at the 2026-08-01
