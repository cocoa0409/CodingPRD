              payload: { license_code: "LIC-US-CA-KA-01", jurisdiction_code: "US-CA", frequency_band: "KA_FORWARD", max_eirp_dbw: 62.5, expires_at: "2027-12-31T00:00:00Z", consumer_disclosure_version: "CD-2026.1", in_motion_permitted: true }
