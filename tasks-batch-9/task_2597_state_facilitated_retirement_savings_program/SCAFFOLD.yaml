scenario: |
  Generate task harder than expert level!

  2597. State-Facilitated Retirement Savings Program (state auto-IRA program): employer
  registration mandate by employee count with phased deadlines and exemption certification
  for employers with a qualified plan, employee auto-enrollment with default contribution
  rate, escalation and opt-out windows, payroll deduction remittance with employer
  non-fiduciary role boundaries, account portability across employers and rollover handling,
  contribution limit monitoring and excess correction given individual retirement account
  rules, employer noncompliance penalties and enforcement referral, investment default
  selection and participant fund changes, participant service and account closure

domain_name: state-auto-ira-program
api_prefix: "/"
# api_prefix is the service root: every collection in §1.5 is a top-level segment
# ("/employers", "/participants", "/participant-accounts", ...). The program is a peer
# network of employer-side, participant-side and enforcement-side aggregates, so no single
# collection can own the URL space.

complexity_profile:
  difficulty_level: expert_plus
  # Deliberately above the §0.4 Expert band on entity/endpoint count because the caller asked
  # for "harder than expert". 14 entities / 54 endpoints, but 15 of those endpoints exist only
  # to satisfy §1.5 FK reverse-reachability (13 FK edges), so the *decision* surface is 39
  # write/read-model endpoints. Density, not volume, carries the difficulty: 10 calculations,
  # 9 state machines over 8 entities, and every money path is a closed ledger with a named
  # conserved quantity.
  primary_archetype: compliance_audit
  secondary_archetype: ledger_reconciliation
  complexity_layers:
    - rate_threshold_triggers        # employee-count waves, contribution limits, auto-escalation, penalty notice tiers
    - cascading_side_effects         # exemption revocation -> delinquency -> penalty -> referral; posting -> excess -> posture
    - dual_variant_calculation       # NIA attribution methods; statutory vs graduated penalty
    - optimistic_concurrency         # OCC on ParticipantAccount.version and Employer.version

  entity_topology: graph
  # Participant and Employer are peers joined many-to-many by Enrollment; ParticipantAccount
  # is self-referential via rolled_over_from_account_id; PortabilityTransfer points at two
  # ParticipantAccount rows (source, destination) forming a portability graph.

  state_machine_shape: parallel
  # Employer carries two independent state dimensions (registration_status x compliance_status)
  # on one row. Enrollment is cyclic (ACTIVE -> OPTED_OUT -> ACTIVE). ExcessContributionCase
  # is branching (METHOD_ELECTED forks into three divergent side-effect sets).

  relationship_patterns:
    - many_to_many        # Employer x Participant via Enrollment
    - self_referential    # ParticipantAccount.rolled_over_from_account_id
    - cross_aggregate     # RemittanceLine (employer aggregate) mutates ParticipantAccount (participant aggregate)
    - one_to_many         # Employer -> ExemptionCertification / PayrollRemittance / PenaltyAssessment

  role_model: segregation_of_duties
  # A ComplianceOfficer may not dispose of a PenaltyAssessment they themselves assessed, and an
  # Employer is structurally barred from touching the participant-elected fields it would have
  # to touch to become a fiduciary (contribution_rate_bp, escalation_opt_out, allocations).

  consistency_model: immediate

response_envelope:
  success: |
    { "meta": { "api_request_id": "req_xxx", "api_request_timestamp": "ISO8601" },
      "response_type": "object" | "array", "data": {} }
  error: |
    { "meta": { ... }, "response_type": "error",
      "data": { "error_id": "ERR_XXX", "message": "..." } }
  pagination_fields: ["limit", "offset", "total_count", "has_more"]
  pagination_defaults: { limit: 10, min: 1, max: 100, offset: 0 }

# =============================================================================
# 1.1 Entity-Relationship Table
# =============================================================================
entities:

  - name: ProgramYear
    parent: null
    common_fields: false
    # Configuration entity: the statutory dial settings for one calendar year. Immutable once
    # created (no update endpoint, no version field) so every calculation in a test run is
    # pinned to a single set of constants.
    fields:
      - name: calendar_year
        type: integer
        source: input
        description: "Calendar year these program parameters govern"
        constraints: "unique across ProgramYear; 2000..2100"
      - name: ira_annual_limit_cents
        type: integer
        source: input
        description: "IRA annual contribution limit for participants under 50, in cents"
        constraints: ">= 1"
      - name: catch_up_limit_cents
        type: integer
        source: input
        default: 100000
        description: "Additional limit for participants whose age_at_year_end >= 50, in cents"
      - name: default_contribution_rate_bp
        type: integer
        source: input
        description: "Auto-enrollment default deferral rate in basis points of gross wages"
        constraints: "100..1500"
      - name: escalation_increment_bp
        type: integer
        source: input
        default: 100
        description: "Basis points added to contribution_rate_bp by each annual escalation run"
      - name: escalation_cap_bp
        type: integer
        source: input
        default: 800
        description: "Ceiling that auto-escalation never exceeds, in basis points"
      - name: escalation_seasoning_days
        type: integer
        source: input
        default: 180
        description: "Minimum days between first_contribution_date and the escalation effective date for an enrollment to be escalated"
      - name: opt_out_window_days
        type: integer
        source: input
        default: 30
        description: "Length in days of both the pre-activation opt-out window and the post-first-contribution permissible-withdrawal window"
      - name: remittance_due_days
        type: integer
        source: input
        default: 7
        description: "Days after pay_date by which a payroll remittance must be submitted"
      - name: notice_period_days
        type: integer
        source: input
        default: 90
        description: "Days after notice_date before the initial statutory per-employee penalty tier applies"
      - name: sustained_notice_days
        type: integer
        source: input
        default: 180
        description: "Days after notice_date before the sustained statutory per-employee penalty tier is added"
      - name: register_penalty_initial_cents_per_employee
        type: integer
        source: input
        default: 25000
        description: "Initial statutory penalty per eligible employee, in cents"
      - name: register_penalty_sustained_cents_per_employee
        type: integer
        source: input
        default: 50000
        description: "Additional sustained statutory penalty per eligible employee, in cents"
      - name: remit_penalty_monthly_rate_bp
        type: integer
        source: input
        default: 150
        description: "Basis points of unremitted deductions charged per whole 30-day block of lateness"
      - name: remit_penalty_floor_cents
        type: integer
        source: input
        default: 10000
        description: "Minimum graduated remittance penalty, in cents"
      - name: remit_penalty_cap_bp
        type: integer
        source: input
        default: 5000
        description: "Cap on the graduated remittance penalty as basis points of the unremitted amount"
      - name: nia_daily_rate_bp
        type: integer
        source: input
        default: 2
        description: "Deemed daily earnings rate in basis points used by the DAILY_PRORATA net-income-attributable variant"
      - name: correction_deadline_month_day
        type: string
        source: input
        default: "04-15"
        description: "MM-DD in calendar_year + 1 by which an excess contribution must be corrected"

  - name: InvestmentOption
    parent: null
    common_fields: false
    # Configuration entity: the program's fund menu. Immutable once created; the program adds a
    # replacement option rather than editing a live one.
    fields:
      - name: fund_code
        type: string
        source: input
        description: "Short stable code used inside InvestmentElection.allocations"
        constraints: "unique; 4..12 chars, uppercase alphanumeric"
      - name: name
        type: string
        source: input
        description: "Human-readable fund name"
      - name: category
        type: enum
        source: input
        description: "Fund family the option belongs to"
        constraints: "TARGET_DATE | CAPITAL_PRESERVATION | EQUITY_INDEX | BOND_INDEX"
      - name: target_year
        type: integer
        source: input
        description: "Glide-path landing year; required when category == TARGET_DATE, must be null otherwise"
        constraints: "2020..2085 or null"
      - name: expense_ratio_bp
        type: integer
        source: input
        description: "Annual expense ratio in basis points; used as the default-selector ranking key"
        constraints: "0..500"
      - name: default_eligible
        type: boolean
        source: input
        description: "Whether the option may be chosen by the default-investment selector"
      - name: status
        type: enum
        source: input
        default: OPEN
        description: "Availability of the option; set at creation and never mutated"
        constraints: "OPEN | CLOSED_TO_NEW | TERMINATED"

  - name: Employer
    parent: null
    common_fields: true
    # Resource with TWO independent state dimensions: registration_status (the mandate) and
    # compliance_status (the enforcement posture). They evolve independently on the same row.
    fields:
      - name: ein
        type: string
        source: input
        description: "Employer identification number"
        constraints: "unique; format NN-NNNNNNN"
      - name: legal_name
        type: string
        source: input
        description: "Registered legal name"
      - name: worksite_state
        type: string
        source: input
        description: "Two-letter state code of the primary worksite"
        constraints: "2 uppercase letters"
      - name: employee_count
        type: integer
        source: input
        description: "Most recently reported eligible-employee headcount; drives wave_tier"
        constraints: ">= 0"
      - name: wave_tier
        type: enum
        source: computed
        description: "Phased-mandate wave derived from employee_count by calculations.employer_coverage_tier"
        constraints: "WAVE_1 | WAVE_2 | WAVE_3 | NOT_COVERED"
      - name: registration_deadline
        type: string
        source: computed
        description: "ISO date (YYYY-MM-DD) by which registration must complete; null when wave_tier == NOT_COVERED"
      - name: registration_status
        type: enum
        source: system
        default: PENDING_REGISTRATION
        description: "Mandate dimension of the employer state machine"
        constraints: "PENDING_REGISTRATION | REGISTERED | EXEMPT_CERTIFIED | EXEMPT_SMALL"
      - name: compliance_status
        type: enum
        source: system
        default: COMPLIANT
        description: "Enforcement dimension of the employer state machine, independent of registration_status"
        constraints: "COMPLIANT | DELINQUENT | PENALIZED | REFERRED"
      - name: non_fiduciary_acknowledged
        type: boolean
        source: system
        default: false
        description: "True once the employer has acknowledged its ministerial, non-fiduciary role at registration"
      - name: payroll_contact_email
        type: string
        source: system
        description: "Payroll contact captured at registration; null before registration"
      - name: registered_at
        type: datetime
        source: system
        description: "Logical-clock instant registration completed; null until then"
      - name: unremitted_deduction_cents
        type: integer
        source: computed
        default: 0
        description: "Sum of total_deducted_cents over this employer's PayrollRemittance rows with status IN {DRAFT, SUBMITTED} whose pay_date + ProgramYear.remittance_due_days < current clock date"
      - name: last_recount_effective_date
        type: string
        source: computed
        description: "effective_date of the most recent employee-count recount; null if never recounted"

  - name: ExemptionCertification
    parent: Employer
    common_fields: true
    fields:
      - name: employer_id
        type: string
        source: system
        description: "FK -> Employer.id; the employer claiming the qualified-plan exemption (taken from the path, not the body)"
      - name: qualified_plan_type
        type: enum
        source: input
        description: "Type of qualified plan already sponsored by the employer"
        constraints: "401K | 403B | SIMPLE_IRA | SEP_IRA | DEFINED_BENEFIT"
      - name: plan_sponsor_ein
        type: string
        source: input
        description: "EIN of the plan sponsor; may differ from Employer.ein for controlled groups"
      - name: plan_effective_date
        type: string
        source: input
        description: "ISO date the qualified plan became effective; also coverage_period_start"
      - name: attestation_accepted
        type: boolean
        source: input
        description: "Employer attestation under penalty of perjury; must be true"
      - name: status
        type: enum
        source: system
        default: SUBMITTED
        description: "Certification lifecycle state"
        constraints: "SUBMITTED | APPROVED | REJECTED | REVOKED"
      - name: coverage_period_start
        type: string
        source: computed
        description: "ISO date equal to plan_effective_date; inclusive lower bound of the half-open coverage interval"
      - name: coverage_period_end
        type: string
        source: computed
        description: "ISO date equal to plan_effective_date + 3 years; EXCLUSIVE upper bound of the coverage interval"
      - name: decision_note
        type: string
        source: system
        description: "Reviewer note recorded by the approve/reject decision; null until decided"
      - name: revocation_reason
        type: string
        source: system
        description: "Reason recorded when the certification is revoked; null otherwise"
      - name: decided_at
        type: datetime
        source: system
        description: "Logical-clock instant of the APPROVED/REJECTED decision; null until decided"
      - name: revoked_at
        type: datetime
        source: system
        description: "Logical-clock instant of revocation; null unless status == REVOKED"

  - name: Participant
    parent: null
    common_fields: true
    fields:
      - name: full_name
        type: string
        source: input
        description: "Participant legal name"
      - name: date_of_birth
        type: string
        source: input
        description: "ISO date of birth; drives catch_up_eligible and the target-date default selector"
      - name: email
        type: string
        source: input
        description: "Contact email"
      - name: ssn_last4
        type: string
        source: input
        description: "Last four digits of the taxpayer identifier"
        constraints: "exactly 4 digits"
      - name: state_resident
        type: boolean
        source: input
        description: "Whether the participant is a resident of the sponsoring state"
      - name: mailing_address
        type: string
        source: input
        description: "Mailing address; null until a participant-service update supplies it"
      - name: phone
        type: string
        source: input
        description: "Contact phone; null until a participant-service update supplies it"
      - name: age_at_year_end
        type: integer
        source: computed
        description: "Whole years old on 31 December of the calendar year of the current logical clock"
      - name: catch_up_eligible
        type: boolean
        source: computed
        description: "True when age_at_year_end >= 50; adds ProgramYear.catch_up_limit_cents to the contribution ceiling"
      - name: indirect_rollover_count
        type: integer
        source: computed
        default: 0
        description: "Count of this participant's PortabilityTransfer rows with transfer_kind == INDIRECT_60_DAY and status == SETTLED"

  - name: Enrollment
    parent: null
    common_fields: true
    # Junction of the Employer x Participant many-to-many. Cyclic lifecycle: a participant may
    # opt out and re-enroll at the same employer any number of times.
    fields:
      - name: employer_id
        type: string
        source: system
        description: "FK -> Employer.id; the employer running the payroll deduction (taken from the path)"
      - name: participant_id
        type: string
        source: input
        description: "FK -> Participant.id; the saver being auto-enrolled"
      - name: hire_date
        type: string
        source: input
        description: "ISO date of hire at this employer"
      - name: annual_compensation_cents
        type: integer
        source: input
        description: "Annualized compensation reported by the employer, in cents; reference data only, never used to compute deductions"
      - name: contribution_rate_bp
        type: integer
        source: system
        description: "Current deferral rate in basis points; seeded from ProgramYear.default_contribution_rate_bp at creation"
        constraints: "100..1500"
      - name: rate_source
        type: enum
        source: system
        default: DEFAULT
        description: "Provenance of contribution_rate_bp"
        constraints: "DEFAULT | PARTICIPANT_ELECTED | ESCALATED"
      - name: enrollment_status
        type: enum
        source: system
        default: NOTIFIED
        description: "Auto-enrollment lifecycle state"
        constraints: "NOTIFIED | ACTIVE | OPTED_OUT | TERMINATED"
      - name: opt_out_deadline
        type: string
        source: computed
        description: "ISO date equal to date(created_at) + ProgramYear.opt_out_window_days; the auto-enrollment run activates on or after this date"
      - name: escalation_opt_out
        type: boolean
        source: system
        default: false
        description: "True when the participant has declined automatic annual escalation"
      - name: first_contribution_date
        type: string
        source: computed
        description: "pay_date of the earliest POSTED RemittanceLine for this enrollment; null until the first posting"
      - name: employment_end_date
        type: string
        source: system
        description: "ISO separation date reported by the employer; setting it drives the enrollment to TERMINATED"
      - name: opted_out_at
        type: datetime
        source: system
        description: "Logical-clock instant of the most recent opt-out; null if never opted out"
      - name: opt_out_reason_code
        type: enum
        source: system
        description: "Reason supplied with the most recent opt-out; null if never opted out"
        constraints: "NOT_INTERESTED | HAS_OTHER_PLAN | AFFORDABILITY | OTHER"
      - name: permissible_withdrawal_cents
        type: integer
        source: computed
        default: 0
        description: "Cents refunded to the participant by an in-window permissible withdrawal at opt-out"
      - name: lifetime_deducted_cents
        type: integer
        source: computed
        default: 0
        description: "Sum of deducted_cents over this enrollment's RemittanceLine rows with status == POSTED"
      - name: reenrollment_count
        type: integer
        source: computed
        default: 0
        description: "Number of times this enrollment has transitioned OPTED_OUT -> ACTIVE"

  - name: ParticipantAccount
    parent: null
    common_fields: true
    # The IRA itself. Lifecycle dimension is account_status; posture is a derived gate over
    # children (excess cases, in-flight transfers) and over account_status.
    fields:
      - name: participant_id
        type: string
        source: system
        description: "FK -> Participant.id; owner of the account"
      - name: account_type
        type: enum
        source: system
        description: "ROTH_IRA accounts are opened by the auto-enrollment run; TRADITIONAL_IRA accounts are opened by a RECHARACTERIZE_TO_TRADITIONAL correction cascade"
        constraints: "ROTH_IRA | TRADITIONAL_IRA"
      - name: rolled_over_from_account_id
        type: string
        source: system
        description: "FK -> ParticipantAccount.id; nullable; set to the source account when a PROGRAM_ACCOUNT PortabilityTransfer settles into this account or when a recharacterization cascade opens this account"
      - name: account_status
        type: enum
        source: system
        default: OPEN
        description: "Account lifecycle dimension"
        constraints: "OPEN | CLOSURE_PENDING | CLOSED"
      - name: posture
        type: enum
        source: computed
        default: UNRESTRICTED
        description: "Derived gate computed by calculations.account_posture_derivation from account_status plus child excess cases and in-flight transfers"
        constraints: "UNRESTRICTED | RESTRICTED | LOCKED"
      - name: balance_cents
        type: integer
        source: computed
        default: 0
        description: "Cents held in the account; contributions and earnings in, corrections/transfers out"
      - name: contribution_basis_cents
        type: integer
        source: computed
        default: 0
        description: "Cents of the balance attributable to contributions rather than earnings; drives the pro-rata basis split on distributions"
      - name: ytd_contribution_cents
        type: integer
        source: computed
        default: 0
        description: "Contributions allocated to this account with remittance pay_date inside the current ProgramYear.calendar_year, net of completed excess corrections"
      - name: remaining_headroom_cents
        type: integer
        source: computed
        default: 0
        description: "Output of calculations.participant_contribution_headroom for the current program year; may not go below 0"
      - name: uncorrected_excess_cents
        type: integer
        source: computed
        default: 0
        description: "Sum of detected_excess_cents over this account's ExcessContributionCase rows with status == EXPIRED"
      - name: fund_balances
        type: array
        source: computed
        description: "Objects { fund_code, balance_cents } re-split from balance_cents on every balance change by calculations.fund_allocation_split; sums exactly to balance_cents"
      - name: active_election_id
        type: string
        source: computed
        description: "Id of this account's InvestmentElection row whose status == ACTIVE (discover via GET /participant-accounts/{id}/investment-elections); null until the auto-enrollment run seeds the default"
      - name: closure_reason
        type: enum
        source: system
        description: "Reason captured on the closure request; null while account_status == OPEN"
        constraints: "PARTICIPANT_REQUEST | ROLLOVER_OUT | DECEASED | PROGRAM_ACTION"
      - name: residual_disposition
        type: enum
        source: system
        description: "How any residual balance is to be handled; captured on the closure request"
        constraints: "ROLLOVER_OUT | CASH_DISTRIBUTION"
      - name: closed_at
        type: datetime
        source: system
        description: "Logical-clock instant closure completed; null unless account_status == CLOSED"

  - name: InvestmentElection
    parent: ParticipantAccount
    common_fields: true
    fields:
      - name: account_id
        type: string
        source: system
        description: "FK -> ParticipantAccount.id; the account this allocation governs (taken from the path)"
      - name: allocations
        type: array
        source: input
        description: "Objects { fund_code, allocation_bp }; allocation_bp values must sum to exactly 10000 and each fund_code must reference an InvestmentOption with status == OPEN"
      - name: source
        type: enum
        source: system
        description: "SYSTEM_DEFAULT when seeded by the auto-enrollment run, PARTICIPANT_ELECTED when created by the participant"
        constraints: "SYSTEM_DEFAULT | PARTICIPANT_ELECTED"
      - name: status
        type: enum
        source: system
        default: ACTIVE
        description: "ACTIVE for the governing election; SUPERSEDED once a later election replaces it"
        constraints: "ACTIVE | SUPERSEDED"
      - name: effective_date
        type: string
        source: computed
        description: "ISO date of the logical clock when the election was created; inclusive lower bound of its half-open effectivity window"
      - name: superseded_at
        type: datetime
        source: system
        description: "Logical-clock instant this election was replaced; null while status == ACTIVE; EXCLUSIVE upper bound of the effectivity window"
      - name: selection_basis
        type: string
        source: system
        description: "For SYSTEM_DEFAULT elections, the recorded reason from calculations.default_investment_option_selection; null for PARTICIPANT_ELECTED"

  - name: PayrollRemittance
    parent: Employer
    common_fields: true
    fields:
      - name: employer_id
        type: string
        source: system
        description: "FK -> Employer.id; the remitting employer (taken from the path)"
      - name: pay_period_start
        type: string
        source: input
        description: "ISO first day of the pay period; INCLUSIVE lower bound of the occupied payroll interval"
      - name: pay_period_end
        type: string
        source: input
        description: "ISO last day of the pay period; INCLUSIVE upper bound of the occupied payroll interval"
        constraints: ">= pay_period_start"
      - name: pay_date
        type: string
        source: input
        description: "ISO date wages were paid and deductions withheld"
        constraints: ">= pay_period_end"
      - name: total_deducted_cents
        type: integer
        source: input
        description: "Employer-declared total withheld for this period; must equal the sum of line deducted_cents"
        constraints: ">= 1"
      - name: status
        type: enum
        source: system
        default: DRAFT
        description: "Remittance lifecycle state"
        constraints: "DRAFT | SUBMITTED | POSTED | REJECTED | REVERSED"
      - name: line_count
        type: integer
        source: computed
        description: "Number of RemittanceLine children"
      - name: total_allocated_cents
        type: integer
        source: computed
        default: 0
        description: "Sum of allocated_cents over child lines with status == POSTED"
      - name: total_excess_cents
        type: integer
        source: computed
        default: 0
        description: "Sum of excess_cents over child lines with status == POSTED"
      - name: days_late
        type: integer
        source: computed
        default: 0
        description: "max(0, submit-time clock date - (pay_date + ProgramYear.remittance_due_days)); frozen at submit"
      - name: submitted_at
        type: datetime
        source: system
        description: "Logical-clock instant of the most recent submit; null while DRAFT"
      - name: posted_at
        type: datetime
        source: system
        description: "Logical-clock instant of posting; null unless the remittance has been posted"
      - name: reversed_at
        type: datetime
        source: system
        description: "Logical-clock instant of reversal; null unless status == REVERSED"
      - name: posting_reference
        type: string
        source: system
        description: "Recordkeeper reference recorded at posting; null before posting"
      - name: rejection_reason
        type: string
        source: system
        description: "Reason recorded when the program rejects the remittance; null otherwise"
      - name: reversal_reason
        type: string
        source: system
        description: "Reason recorded on reversal; null otherwise"

  - name: RemittanceLine
    parent: PayrollRemittance
    common_fields: true
    fields:
      - name: remittance_id
        type: string
        source: system
        description: "FK -> PayrollRemittance.id; the batch this line belongs to"
      - name: enrollment_id
        type: string
        source: input
        description: "FK -> Enrollment.id; the enrollment the deduction was withheld against"
      - name: gross_wages_cents
        type: integer
        source: input
        description: "Gross wages for the pay period, in cents"
        constraints: ">= 0"
      - name: deducted_cents
        type: integer
        source: input
        description: "Cents actually withheld by the employer for this line"
        constraints: ">= 1"
      - name: expected_deduction_cents
        type: integer
        source: computed
        description: "round_half_up(gross_wages_cents * Enrollment.contribution_rate_bp / 10000) at creation time; deducted_cents must equal it exactly"
      - name: allocated_cents
        type: integer
        source: computed
        default: 0
        description: "Cents credited to the participant's account at posting; equals deducted_cents (the program credits in full and corrects excesses afterwards)"
      - name: excess_cents
        type: integer
        source: computed
        default: 0
        description: "Portion of allocated_cents that pushed ytd_contribution_cents past the annual ceiling at posting time"
      - name: status
        type: enum
        source: system
        default: PENDING
        description: "Line lifecycle state"
        constraints: "PENDING | POSTED | REVERSED | RETURNED"

  - name: ExcessContributionCase
    parent: ParticipantAccount
    common_fields: true
    fields:
      - name: account_id
        type: string
        source: system
        description: "FK -> ParticipantAccount.id; the account holding the excess"
      - name: calendar_year
        type: integer
        source: computed
        description: "ProgramYear.calendar_year the excess belongs to"
      - name: detected_excess_cents
        type: integer
        source: computed
        description: "ytd_contribution_cents minus the ceiling at the moment of detection"
      - name: detected_at_pay_date
        type: string
        source: computed
        description: "pay_date of the PayrollRemittance whose posting produced the excess"
      - name: computation_period_start
        type: string
        source: computed
        description: "ISO date of the logical clock at detection; inclusive lower bound of the NIA computation period"
      - name: opening_fmv_cents
        type: integer
        source: computed
        description: "ParticipantAccount.balance_cents immediately BEFORE the posting that produced the excess"
      - name: period_contributions_cents
        type: integer
        source: computed
        description: "Cents contributed into the account from computation_period_start through completion, including the deposit that carried the excess"
      - name: period_distributions_cents
        type: integer
        source: computed
        default: 0
        description: "Cents distributed out of the account during the computation period"
      - name: closing_fmv_cents
        type: integer
        source: computed
        description: "ParticipantAccount.balance_cents at completion, before the correction debit; null until completion"
      - name: nia_adjusted_balance_cents
        type: integer
        source: computed
        description: "Net income attributable under the ADJUSTED_BALANCE variant; computed and persisted at completion regardless of which variant is applied"
      - name: nia_daily_prorata_cents
        type: integer
        source: computed
        description: "Net income attributable under the DAILY_PRORATA variant; computed and persisted at completion regardless of which variant is applied"
      - name: nia_method_applied
        type: enum
        source: computed
        description: "Which variant the deterministic selection rule chose; null until completion"
        constraints: "ADJUSTED_BALANCE | DAILY_PRORATA"
      - name: applied_nia_cents
        type: integer
        source: computed
        description: "The NIA figure actually moved; equals whichever of the two variant fields nia_method_applied names"
      - name: correction_method
        type: enum
        source: system
        description: "Participant's elected correction path; null while status == DETECTED"
        constraints: "REFUND_TO_PARTICIPANT | RECHARACTERIZE_TO_TRADITIONAL | CARRY_FORWARD"
      - name: status
        type: enum
        source: system
        default: DETECTED
        description: "Correction case lifecycle state"
        constraints: "DETECTED | METHOD_ELECTED | COMPLETED | EXPIRED | VOIDED"
      - name: deadline_date
        type: string
        source: computed
        description: "ISO date built from ProgramYear.correction_deadline_month_day in calendar_year + 1; corrections after it are refused"
      - name: corrected_amount_cents
        type: integer
        source: computed
        description: "detected_excess_cents + applied_nia_cents; null until completion"
      - name: excise_tax_cents
        type: integer
        source: computed
        default: 0
        description: "round_half_up(detected_excess_cents * 600 / 10000) recorded when the case EXPIRES uncorrected"
      - name: settlement_reference
        type: string
        source: system
        description: "Recordkeeper reference recorded at completion; null otherwise"
      - name: completed_at
        type: datetime
        source: system
        description: "Logical-clock instant of completion; null unless status == COMPLETED"

  - name: PenaltyAssessment
    parent: Employer
    common_fields: true
    fields:
      - name: employer_id
        type: string
        source: system
        description: "FK -> Employer.id; the assessed employer"
      - name: violation_type
        type: enum
        source: input
        description: "Statutory violation being penalized"
        constraints: "FAILURE_TO_REGISTER | FAILURE_TO_REMIT | FAILURE_TO_ENROLL"
      - name: notice_date
        type: string
        source: input
        description: "ISO date the employer was noticed; for cascade- and sweep-minted assessments the system sets it to Employer.registration_deadline"
      - name: cure_days
        type: integer
        source: input
        default: 30
        description: "Days after notice_date the employer has to cure before the assessment may be affirmed"
      - name: cure_deadline
        type: string
        source: computed
        description: "ISO date equal to notice_date + cure_days"
      - name: employee_count_at_assessment
        type: integer
        source: computed
        description: "Employer.employee_count snapshotted when the assessment was created"
      - name: statutory_amount_cents
        type: integer
        source: computed
        description: "Per-employee tiered amount from the statutory variant of calculations.employer_penalty_amount"
      - name: graduated_amount_cents
        type: integer
        source: computed
        description: "Shortfall-proportional amount from the graduated variant of calculations.employer_penalty_amount"
      - name: assessed_cents
        type: integer
        source: computed
        description: "The amount actually owed; the variant-selection rule decides which of the two figures (or their max) applies"
      - name: shortfall_basis_cents
        type: integer
        source: computed
        default: 0
        description: "Employer.unremitted_deduction_cents snapshotted when the assessment was created or last accrued"
      - name: months_late
        type: integer
        source: computed
        default: 0
        description: "ceil(max days late / 30) over the overdue remittance set feeding shortfall_basis_cents"
      - name: status
        type: enum
        source: system
        default: ASSESSED
        description: "Assessment lifecycle state"
        constraints: "ASSESSED | ABATED | AFFIRMED"
      - name: assessed_by_user_id
        type: string
        source: system
        description: "X-User-ID of the assessing operator, or the literal SYSTEM for cascade- and sweep-minted assessments"
      - name: disposed_by_user_id
        type: string
        source: system
        description: "X-User-ID of the operator who abated or affirmed; must differ from assessed_by_user_id"
      - name: disposition_note
        type: string
        source: system
        description: "Note recorded with the disposition; null until disposed"
      - name: origin
        type: enum
        source: computed
        description: "How the assessment came to exist"
        constraints: "MANUAL | SYSTEM_CASCADE | SWEEP"
      - name: last_accrual_date
        type: string
        source: computed
        description: "ISO date of the most recent compliance sweep that re-accrued the amounts; null if never swept"

  - name: EnforcementReferral
    parent: PenaltyAssessment
    common_fields: true
    fields:
      - name: penalty_id
        type: string
        source: system
        description: "FK -> PenaltyAssessment.id; the affirmed assessment being referred out"
      - name: agency
        type: enum
        source: input
        description: "Agency the matter is referred to"
        constraints: "STATE_LABOR_COMMISSIONER | STATE_TAX_AUTHORITY | ATTORNEY_GENERAL"
      - name: referral_basis
        type: string
        source: input
        description: "Free-text statutory basis for the referral"
      - name: status
        type: enum
        source: system
        default: OPEN
        description: "OPEN while the referral stands; WITHDRAWN when the underlying assessment is later abated"
        constraints: "OPEN | WITHDRAWN"
      - name: referred_at
        type: datetime
        source: system
        description: "Logical-clock instant the referral was created"
      - name: referred_by_user_id
        type: string
        source: system
        description: "X-User-ID of the referring compliance officer, or SYSTEM for cascade-minted referrals"
      - name: withdrawn_reason
        type: string
        source: system
        description: "Reason recorded when the referral is withdrawn; null while status == OPEN"
      - name: employer_ein_snapshot
        type: string
        source: computed
        description: "Employer.ein denormalized at referral time via PenaltyAssessment.employer_id; never re-derived afterwards"

  - name: PortabilityTransfer
    parent: null
    common_fields: true
    fields:
      - name: participant_id
        type: string
        source: input
        description: "FK -> Participant.id; the account owner requesting portability"
      - name: source_account_id
        type: string
        source: input
        description: "FK -> ParticipantAccount.id; the account being debited"
      - name: destination_type
        type: enum
        source: input
        description: "Where the money is going"
        constraints: "EXTERNAL_IRA | PROGRAM_ACCOUNT"
      - name: destination_account_id
        type: string
        source: input
        description: "FK -> ParticipantAccount.id; nullable; required when destination_type == PROGRAM_ACCOUNT and must belong to the same participant"
      - name: external_institution_name
        type: string
        source: input
        description: "Receiving institution; required when destination_type == EXTERNAL_IRA, must be null otherwise"
      - name: transfer_kind
        type: enum
        source: input
        description: "Mechanism of the movement; only INDIRECT_60_DAY is withheld upon and frequency-limited"
        constraints: "DIRECT_ROLLOVER | TRUSTEE_TO_TRUSTEE | INDIRECT_60_DAY"
      - name: amount_cents
        type: integer
        source: input
        description: "Gross cents to move out of the source account"
        constraints: ">= 1"
      - name: fee_cents
        type: integer
        source: computed
        description: "Tiered program fee; tier key is GROSS amount_cents, pinned by calculations.portability_settlement_math"
      - name: basis_portion_cents
        type: integer
        source: computed
        description: "round_half_up(amount_cents * source.contribution_basis_cents / source.balance_cents) using pre-debit values"
      - name: taxable_cents
        type: integer
        source: computed
        description: "amount_cents - basis_portion_cents"
      - name: withholding_cents
        type: integer
        source: computed
        default: 0
        description: "10% mandatory withholding on taxable_cents for INDIRECT_60_DAY; zero for the other kinds"
      - name: net_cents
        type: integer
        source: computed
        description: "amount_cents - fee_cents - withholding_cents"
      - name: in_transit_cents
        type: integer
        source: computed
        default: 0
        description: "amount_cents while status == REQUESTED, zero in every terminal state; the in-flight leg of the PROGRAM_CASH invariant"
      - name: status
        type: enum
        source: system
        default: REQUESTED
        description: "Transfer lifecycle state"
        constraints: "REQUESTED | SETTLED | RETURNED | FAILED_TAXABLE"
      - name: requested_on
        type: string
        source: computed
        description: "ISO date of the logical clock at request"
      - name: settle_by_date
        type: string
        source: computed
        description: "requested_on + 60 days for INDIRECT_60_DAY; null for the other kinds"
      - name: settled_on
        type: string
        source: input
        description: "ISO settlement date supplied by the recordkeeper at settle; null until then"
      - name: settlement_reference
        type: string
        source: system
        description: "Recordkeeper reference recorded at settle; null otherwise"
      - name: return_reason
        type: string
        source: system
        description: "Reason recorded when the receiving institution returns the funds; null otherwise"
      - name: is_taxable_distribution
        type: boolean
        source: computed
        default: false
        description: "True for a SETTLED INDIRECT_60_DAY transfer and for any transfer that lapses into FAILED_TAXABLE"

# =============================================================================
# 1.2 State Machines
# =============================================================================
state_machines:

  - entity: Employer
    field: registration_status
    initial_state: PENDING_REGISTRATION
    terminal_states: []
    shape: cyclic
    note: |
      Mandate dimension. Independent of Employer.compliance_status: an employer can be
      REGISTERED and REFERRED at the same time, or EXEMPT_CERTIFIED and DELINQUENT.
    transitions:
      - from: PENDING_REGISTRATION
        to: EXEMPT_SMALL
        trigger: "POST /employers (creation) or POST /employers/{id}/employee-count-recounts resolving wave_tier == NOT_COVERED"
        preconditions:
          - "computed wave_tier == NOT_COVERED (employee_count <= 4)"
        side_effects:
          - "registration_deadline set to null"
      - from: PENDING_REGISTRATION
        to: REGISTERED
        trigger: "POST /employers/{id}/registration"
        preconditions:
          - "caller role == Employer and owns this employer"
          - "wave_tier != NOT_COVERED"
          - "non_fiduciary_acknowledged supplied as true"
        side_effects:
          - "non_fiduciary_acknowledged := true"
          - "payroll_contact_email := body value"
          - "registered_at := current logical clock"
      - from: PENDING_REGISTRATION
        to: EXEMPT_CERTIFIED
        trigger: "POST /exemption-certifications/{id}/decision with decision == APPROVE"
        preconditions:
          - "certification.status == SUBMITTED"
          - "certification.coverage_period_start <= clock date < certification.coverage_period_end"
        side_effects:
          - "certification.status := APPROVED, decided_at set"
          - "compliance_status := COMPLIANT when it was DELINQUENT (delinquency was premised on the missing registration)"
      - from: REGISTERED
        to: EXEMPT_CERTIFIED
        trigger: "POST /exemption-certifications/{id}/decision with decision == APPROVE"
        preconditions:
          - "employer has no Enrollment with enrollment_status == ACTIVE"
        side_effects:
          - "certification.status := APPROVED"
      - from: EXEMPT_CERTIFIED
        to: PENDING_REGISTRATION
        trigger: "POST /exemption-certifications/{id}/revoke"
        preconditions:
          - "certification.status == APPROVED"
        side_effects:
          - "certification.status := REVOKED, revoked_at and revocation_reason set"
          - "compliance_status := DELINQUENT when clock date > registration_deadline (cascade step 2)"
      - from: EXEMPT_SMALL
        to: PENDING_REGISTRATION
        trigger: "POST /employers/{id}/employee-count-recounts raising employee_count above 4"
        preconditions:
          - "expected_employer_version matches"
        side_effects:
          - "wave_tier and registration_deadline recomputed"
          - "last_recount_effective_date := effective_date"

  - entity: Employer
    field: compliance_status
    initial_state: COMPLIANT
    terminal_states: []
    shape: cyclic
    note: |
      Enforcement dimension, changing only in response to penalty and referral activity plus the
      overdue-remittance sweep. Never touches registration_status.
    transitions:
      - from: COMPLIANT
        to: DELINQUENT
        trigger: "POST /_ops/compliance-sweep, or the exemption-revocation cascade, or POST /payroll-remittances/{id}/submit with days_late > 0"
        preconditions:
          - "registration_status == PENDING_REGISTRATION with clock date > registration_deadline, OR unremitted_deduction_cents > 0"
        side_effects:
          - "unremitted_deduction_cents recomputed"
      - from: DELINQUENT
        to: PENALIZED
        trigger: "POST /employers/{id}/penalty-assessments, or the sweep/cascade minting an assessment"
        preconditions:
          - "at least one PenaltyAssessment with status == ASSESSED exists"
        side_effects:
          - "assessment created with statutory_amount_cents, graduated_amount_cents and assessed_cents populated"
      - from: PENALIZED
        to: REFERRED
        trigger: "POST /penalty-assessments/{id}/enforcement-referrals, or the cascade minting a referral when a prior AFFIRMED assessment exists"
        preconditions:
          - "the referred assessment has status == AFFIRMED"
        side_effects:
          - "EnforcementReferral created with status == OPEN and employer_ein_snapshot denormalized"
      - from: REFERRED
        to: PENALIZED
        trigger: "POST /penalty-assessments/{id}/disposition with disposition == ABATE on the referred assessment"
        preconditions:
          - "disposed_by_user_id != assessed_by_user_id"
        side_effects:
          - "assessment.status := ABATED"
          - "every EnforcementReferral of that assessment with status == OPEN becomes WITHDRAWN with withdrawn_reason set"
          - "compliance_status falls back to PENALIZED when another ASSESSED/AFFIRMED assessment remains, else COMPLIANT"
      - from: PENALIZED
        to: COMPLIANT
        trigger: "POST /penalty-assessments/{id}/disposition with disposition == ABATE"
        preconditions:
          - "no other PenaltyAssessment of this employer has status IN {ASSESSED, AFFIRMED}"
          - "unremitted_deduction_cents == 0"
        side_effects:
          - "assessment.status := ABATED, disposed_by_user_id and disposition_note set"

  - entity: ExemptionCertification
    field: status
    initial_state: SUBMITTED
    terminal_states: [REJECTED, REVOKED]
    shape: branching
    transitions:
      - from: SUBMITTED
        to: APPROVED
        trigger: "POST /exemption-certifications/{id}/decision with decision == APPROVE"
        preconditions:
          - "caller role == ProgramAdministrator"
          - "clock date < coverage_period_end"
          - "employer has no ACTIVE Enrollment"
        side_effects:
          - "employer.registration_status := EXEMPT_CERTIFIED"
          - "decided_at and decision_note set"
      - from: SUBMITTED
        to: REJECTED
        trigger: "POST /exemption-certifications/{id}/decision with decision == REJECT"
        preconditions:
          - "caller role == ProgramAdministrator"
        side_effects:
          - "employer.registration_status unchanged"
          - "decided_at and decision_note set"
      - from: APPROVED
        to: REVOKED
        trigger: "POST /exemption-certifications/{id}/revoke"
        preconditions:
          - "caller role == ComplianceOfficer"
          - "employer.registration_status == EXEMPT_CERTIFIED"
        side_effects:
          - "employer.registration_status := PENDING_REGISTRATION"
          - "cascade continues into compliance_status, penalty and referral (see §1.9 / difficulty design)"

  - entity: Enrollment
    field: enrollment_status
    initial_state: NOTIFIED
    terminal_states: [TERMINATED]
    shape: cyclic
    note: |
      A participant may opt out and be re-enrolled repeatedly; re-enrollment resets the rate to
      the program default and increments reenrollment_count.
    transitions:
      - from: NOTIFIED
        to: ACTIVE
        trigger: "POST /_ops/auto-enrollment-run"
        preconditions:
          - "clock date >= opt_out_deadline"
          - "employer.registration_status == REGISTERED"
        side_effects:
          - "ParticipantAccount of account_type ROTH_IRA opened for the participant if none exists"
          - "SYSTEM_DEFAULT InvestmentElection seeded from calculations.default_investment_option_selection"
      - from: NOTIFIED
        to: OPTED_OUT
        trigger: "POST /enrollments/{id}/opt-out"
        preconditions:
          - "clock date < opt_out_deadline"
        side_effects:
          - "opted_out_at and opt_out_reason_code set"
          - "no account is opened"
      - from: ACTIVE
        to: OPTED_OUT
        trigger: "POST /enrollments/{id}/opt-out"
        preconditions:
          - "caller is the owning Participant or a ProgramAdministrator"
        side_effects:
          - "opted_out_at and opt_out_reason_code set"
          - "when first_contribution_date is non-null and clock date <= first_contribution_date + opt_out_window_days, permissible_withdrawal_cents := lifetime_deducted_cents and that amount is debited from the account balance and basis (permissible withdrawal)"
          - "contribution_rate_bp retained for audit until re-enrollment"
      - from: OPTED_OUT
        to: ACTIVE
        trigger: "POST /enrollments/{id}/reenroll"
        preconditions:
          - "employer.registration_status == REGISTERED"
          - "employment_end_date is null"
        side_effects:
          - "contribution_rate_bp := ProgramYear.default_contribution_rate_bp and rate_source := DEFAULT"
          - "escalation_opt_out := false"
          - "reenrollment_count incremented"
          - "opted_out_at and opt_out_reason_code cleared"
      - from: ACTIVE
        to: TERMINATED
        trigger: "PATCH /enrollments/{id}/employment (employer reports employment_end_date)"
        preconditions:
          - "caller role == Employer and owns the enrollment's employer"
        side_effects:
          - "employment_end_date recorded; no further RemittanceLine may reference this enrollment"
          - "the participant's account remains OPEN and portable"
      - from: OPTED_OUT
        to: TERMINATED
        trigger: "PATCH /enrollments/{id}/employment (employer reports employment_end_date)"
        preconditions:
          - "caller role == Employer and owns the enrollment's employer"
        side_effects:
          - "employment_end_date recorded"

  - entity: PayrollRemittance
    field: status
    initial_state: DRAFT
    terminal_states: [REVERSED]
    shape: branching
    note: |
      Branching with a repair cycle: REJECTED returns to SUBMITTED after the employer fixes lines,
      while POSTED can be compensated to REVERSED.
    transitions:
      - from: DRAFT
        to: SUBMITTED
        trigger: "POST /payroll-remittances/{id}/submit"
        preconditions:
          - "line_count >= 1"
          - "sum of child deducted_cents == total_deducted_cents"
          - "no pay-period overlap with another non-REVERSED remittance of the same employer"
        side_effects:
          - "days_late frozen"
          - "submitted_at set"
          - "employer.unremitted_deduction_cents recomputed; compliance_status := DELINQUENT when it becomes positive"
      - from: SUBMITTED
        to: POSTED
        trigger: "POST /payroll-remittances/{id}/post"
        preconditions:
          - "caller role == Recordkeeper"
          - "every referenced enrollment has enrollment_status == ACTIVE"
        side_effects:
          - "every child line PENDING -> POSTED with allocated_cents := deducted_cents"
          - "each account balance_cents, contribution_basis_cents, ytd_contribution_cents increased; fund_balances re-split"
          - "excess_cents computed per line; an ExcessContributionCase is opened per account that crossed the ceiling"
          - "affected account posture re-derived"
          - "employer.unremitted_deduction_cents recomputed"
      - from: SUBMITTED
        to: REJECTED
        trigger: "POST /payroll-remittances/{id}/reject"
        preconditions:
          - "caller role == Recordkeeper or ProgramAdministrator"
        side_effects:
          - "rejection_reason set; child lines stay PENDING"
      - from: REJECTED
        to: SUBMITTED
        trigger: "POST /payroll-remittances/{id}/submit"
        preconditions:
          - "sum of child deducted_cents == total_deducted_cents"
        side_effects:
          - "rejection_reason cleared; days_late re-frozen at the new submit clock"
      - from: POSTED
        to: REVERSED
        trigger: "POST /payroll-remittances/{id}/reverse"
        preconditions:
          - "caller role == Recordkeeper"
          - "no ExcessContributionCase produced by this remittance has status == COMPLETED"
        side_effects:
          - "every POSTED child line -> REVERSED; allocated_cents and excess_cents zeroed"
          - "account balance_cents, contribution_basis_cents, ytd_contribution_cents decremented by exactly the posted amounts; fund_balances re-split"
          - "ExcessContributionCase rows opened by this remittance become VOIDED"
          - "posture re-derived; CONTRIBUTION_ROOM invariant restored with no drift"

  - entity: ParticipantAccount
    field: account_status
    initial_state: OPEN
    terminal_states: [CLOSED]
    shape: linear
    transitions:
      - from: OPEN
        to: CLOSURE_PENDING
        trigger: "POST /participant-accounts/{id}/closure-requests"
        preconditions:
          - "posture == UNRESTRICTED"
          - "no PortabilityTransfer with source_account_id == this account has status == REQUESTED"
        side_effects:
          - "closure_reason and residual_disposition recorded"
          - "posture re-derived to LOCKED"
      - from: CLOSURE_PENDING
        to: CLOSED
        trigger: "POST /participant-accounts/{id}/closure-completion"
        preconditions:
          - "caller role == Recordkeeper"
          - "balance_cents == 0"
          - "no ExcessContributionCase of this account has status IN {DETECTED, METHOD_ELECTED}"
        side_effects:
          - "closed_at set; active_election_id cleared and the ACTIVE election becomes SUPERSEDED"
          - "the account is excluded from every subsequent contribution posting"

  - entity: ExcessContributionCase
    field: status
    initial_state: DETECTED
    terminal_states: [COMPLETED, EXPIRED, VOIDED]
    shape: branching
    note: |
      Fork-join: METHOD_ELECTED forks into three divergent completion side-effect sets selected by
      correction_method, all of which land in COMPLETED.
    transitions:
      - from: DETECTED
        to: METHOD_ELECTED
        trigger: "POST /excess-contribution-cases/{id}/method-election"
        preconditions:
          - "caller is the owning Participant or a ProgramAdministrator"
          - "clock date <= deadline_date"
        side_effects:
          - "correction_method recorded"
      - from: METHOD_ELECTED
        to: COMPLETED
        trigger: "POST /excess-contribution-cases/{id}/completion"
        preconditions:
          - "caller role == Recordkeeper"
          - "clock date <= deadline_date"
          - "account.balance_cents >= detected_excess_cents + applied_nia_cents when correction_method == REFUND_TO_PARTICIPANT"
        side_effects:
          - "closing_fmv_cents captured; both NIA variants computed; nia_method_applied and applied_nia_cents pinned by the selection rule"
          - "REFUND_TO_PARTICIPANT: balance and basis debited by corrected_amount_cents; ytd_contribution_cents reduced by detected_excess_cents"
          - "RECHARACTERIZE_TO_TRADITIONAL: a TRADITIONAL_IRA ParticipantAccount is opened (rolled_over_from_account_id := this account) and credited with corrected_amount_cents; the Roth account is debited the same amount; ytd_contribution_cents reduced on the Roth side"
          - "CARRY_FORWARD: balance untouched; ytd_contribution_cents reduced by detected_excess_cents and the amount is counted against the next program year"
          - "fund_balances re-split on both sides; posture re-derived"
      - from: DETECTED
        to: EXPIRED
        trigger: "POST /_ops/compliance-sweep"
        preconditions:
          - "clock date > deadline_date"
        side_effects:
          - "excise_tax_cents := round_half_up(detected_excess_cents * 600 / 10000)"
          - "account.uncorrected_excess_cents recomputed; posture stays RESTRICTED"
      - from: METHOD_ELECTED
        to: EXPIRED
        trigger: "POST /_ops/compliance-sweep"
        preconditions:
          - "clock date > deadline_date"
        side_effects:
          - "excise_tax_cents recorded; account.uncorrected_excess_cents recomputed"
      - from: DETECTED
        to: VOIDED
        trigger: "POST /payroll-remittances/{id}/reverse (compensation)"
        preconditions:
          - "the case was opened by the reversed remittance"
        side_effects:
          - "detected_excess_cents left as audit history; the case no longer restricts posture"
      - from: METHOD_ELECTED
        to: VOIDED
        trigger: "POST /payroll-remittances/{id}/reverse (compensation)"
        preconditions:
          - "the case was opened by the reversed remittance"
        side_effects:
          - "correction_method retained as audit history; posture re-derived"

  - entity: PenaltyAssessment
    field: status
    initial_state: ASSESSED
    terminal_states: [ABATED]
    shape: cyclic
    note: |
      AFFIRMED is not terminal: an appeal can still abate an affirmed assessment, which is what
      withdraws an already-issued enforcement referral.
    transitions:
      - from: ASSESSED
        to: AFFIRMED
        trigger: "POST /penalty-assessments/{id}/disposition with disposition == AFFIRM"
        preconditions:
          - "caller role == ComplianceOfficer"
          - "X-User-ID != assessed_by_user_id (segregation of duties)"
          - "clock date > cure_deadline"
        side_effects:
          - "disposed_by_user_id and disposition_note set; assessed_cents frozen"
      - from: ASSESSED
        to: ABATED
        trigger: "POST /penalty-assessments/{id}/disposition with disposition == ABATE"
        preconditions:
          - "caller role == ComplianceOfficer"
          - "X-User-ID != assessed_by_user_id"
        side_effects:
          - "employer.compliance_status recomputed (PENALIZED or COMPLIANT)"
      - from: AFFIRMED
        to: ABATED
        trigger: "POST /penalty-assessments/{id}/disposition with disposition == ABATE"
        preconditions:
          - "caller role == ComplianceOfficer"
          - "X-User-ID != assessed_by_user_id"
        side_effects:
          - "every OPEN EnforcementReferral of this assessment -> WITHDRAWN"
          - "employer.compliance_status recomputed, dropping out of REFERRED"

  - entity: PortabilityTransfer
    field: status
    initial_state: REQUESTED
    terminal_states: [SETTLED, RETURNED, FAILED_TAXABLE]
    shape: branching
    transitions:
      - from: REQUESTED
        to: SETTLED
        trigger: "POST /portability-transfers/{id}/settle"
        preconditions:
          - "caller role == Recordkeeper"
          - "settled_on <= settle_by_date when transfer_kind == INDIRECT_60_DAY"
        side_effects:
          - "in_transit_cents := 0"
          - "for destination_type == PROGRAM_ACCOUNT: destination balance += net_cents, destination basis += basis_portion_cents, destination.rolled_over_from_account_id := source_account_id, destination fund_balances re-split"
          - "for destination_type == EXTERNAL_IRA: the funds leave the program and PROGRAM_CASH is reduced by net_cents plus fee and withholding"
          - "is_taxable_distribution := true when transfer_kind == INDIRECT_60_DAY"
      - from: REQUESTED
        to: RETURNED
        trigger: "POST /portability-transfers/{id}/return"
        preconditions:
          - "caller role == Recordkeeper"
        side_effects:
          - "in_transit_cents := 0; source balance_cents += amount_cents and contribution_basis_cents += basis_portion_cents (full compensation, fee reversed)"
          - "source fund_balances re-split; PROGRAM_CASH invariant restored exactly"
      - from: REQUESTED
        to: FAILED_TAXABLE
        trigger: "POST /_ops/compliance-sweep"
        preconditions:
          - "transfer_kind == INDIRECT_60_DAY and clock date > settle_by_date"
        side_effects:
          - "in_transit_cents := 0; is_taxable_distribution := true"
          - "no money returns to the source account; the distribution is deemed taxable"

# =============================================================================
# 1.2.1 Concurrency Rules (OCC only)
# =============================================================================
concurrency_rules:
  - rule_id: election-create-stale-account
    parent_entity: ParticipantAccount
    occ_field: expected_account_version
    write_endpoint: "POST /participant-accounts/{id}/investment-elections"
    error_id: ERR_STALE_ACCOUNT_VERSION
    status: 412
    description: |
      A participant fund change carries the account version it was composed against. If any
      write bumped ParticipantAccount.version since the client read it — a remittance posting,
      an excess correction, an earnings posting — the election is refused with 412 and the client
      must re-read the account and resubmit with the fresh version. A matching version succeeds
      and bumps version again.

  - rule_id: recount-stale-employer
    parent_entity: Employer
    occ_field: expected_employer_version
    write_endpoint: "POST /employers/{id}/employee-count-recounts"
    error_id: ERR_STALE_EMPLOYER_VERSION
    status: 412
    description: |
      A headcount recount rewrites wave_tier and registration_deadline, so it must be composed
      against a known Employer version. A stale expected_employer_version is refused with 412,
      protecting an employer that was concurrently registered or penalized from having its
      deadline silently recomputed against a superseded baseline.

# =============================================================================
# 1.3 Calculation Rules
# =============================================================================
calculations:

  - rule_id: employer_coverage_tier
    algorithm_type: threshold
    inputs: ["Employer.employee_count", "ProgramYear.calendar_year"]
    outputs: ["Employer.wave_tier", "Employer.registration_deadline"]
    formula: |
      Half-open descending bands on employee_count, evaluated at creation and again on every
      employee-count recount:
        employee_count >= 100          -> WAVE_1,      registration_deadline = wave_1_deadline
        50 <= employee_count <= 99     -> WAVE_2,      registration_deadline = wave_2_deadline
        5  <= employee_count <= 49     -> WAVE_3,      registration_deadline = wave_3_deadline
        employee_count <= 4            -> NOT_COVERED, registration_deadline = null
      A NOT_COVERED employer is created directly in registration_status EXEMPT_SMALL. Crossing the
      4/5 boundary upward on a recount moves EXEMPT_SMALL -> PENDING_REGISTRATION and materializes
      a deadline; crossing it downward moves back to EXEMPT_SMALL and nulls the deadline.
    constants:
      wave_1_deadline: "2026-06-30"
      wave_2_deadline: "2026-12-31"
      wave_3_deadline: "2027-06-30"
      small_employer_ceiling: 4
      wave_3_floor: 5
      wave_2_floor: 50
      wave_1_floor: 100
    precision: "integer headcount; deadlines are ISO dates with no time component"

  - rule_id: default_rate_and_escalation
    algorithm_type: threshold
    inputs:
      - "Enrollment.contribution_rate_bp"
      - "Enrollment.rate_source"
      - "Enrollment.escalation_opt_out"
      - "Enrollment.first_contribution_date"
      - "Enrollment.enrollment_status"
      - "ProgramYear.escalation_increment_bp"
      - "ProgramYear.escalation_cap_bp"
      - "ProgramYear.escalation_seasoning_days"
    outputs: ["Enrollment.contribution_rate_bp", "Enrollment.rate_source"]
    formula: |
      A new Enrollment is seeded contribution_rate_bp = ProgramYear.default_contribution_rate_bp
      with rate_source = DEFAULT. A participant rate election overwrites both
      (rate_source = PARTICIPANT_ELECTED).

      POST /_ops/annual-escalation-run considers ONLY enrollments where:
        enrollment_status == ACTIVE
        AND escalation_opt_out == false
        AND first_contribution_date IS NOT NULL
        AND (clock date - first_contribution_date) >= escalation_seasoning_days
      For each such enrollment:
        new_rate = min(contribution_rate_bp + escalation_increment_bp, escalation_cap_bp)
        if new_rate > contribution_rate_bp: contribution_rate_bp = new_rate,
                                           rate_source = ESCALATED
        else: the enrollment is left untouched (already at or above the cap) and is reported as
              skipped rather than escalated.
      The cap clamps rather than rejects: an enrollment at 750 bp with a 100 bp increment and an
      800 bp cap lands on exactly 800, not 850.
    constants:
      seasoning_days_default: 180
      increment_bp_default: 100
      cap_bp_default: 800
    precision: "integer basis points; no rounding required"

  - rule_id: participant_contribution_headroom
    algorithm_type: aggregation
    inputs:
      - "RemittanceLine.allocated_cents where RemittanceLine.status == POSTED"
      - "PayrollRemittance.pay_date"
      - "Participant.age_at_year_end"
      - "ProgramYear.ira_annual_limit_cents"
      - "ProgramYear.catch_up_limit_cents"
      - "ExcessContributionCase.detected_excess_cents where status == COMPLETED"
    outputs:
      - "ParticipantAccount.ytd_contribution_cents"
      - "ParticipantAccount.remaining_headroom_cents"
      - "RemittanceLine.excess_cents"
    formula: |
      ceiling = ira_annual_limit_cents + (catch_up_limit_cents if age_at_year_end >= 50 else 0)

      ytd_contribution_cents aggregates allocated_cents over EVERY POSTED RemittanceLine that
      credits this participant, ACROSS ALL EMPLOYERS, whose parent remittance pay_date falls in
      ProgramYear.calendar_year — this is what makes the limit a per-person rule rather than a
      per-employer rule. Lines in status PENDING, REVERSED or RETURNED are excluded. Completed
      excess corrections subtract their detected_excess_cents from ytd_contribution_cents.

      remaining_headroom_cents = max(0, ceiling - ytd_contribution_cents)

      At posting time, per line, in ascending (pay_date, line id) order:
        room_before   = max(0, ceiling - ytd_before)
        excess_cents  = max(0, allocated_cents - room_before)
      The full allocated_cents is still credited to the account; the excess is recorded and
      corrected afterwards through an ExcessContributionCase rather than being refused.
    constants:
      catch_up_age_floor: 50
    precision: "integer cents; headroom floored at 0, never negative"

  - rule_id: excess_nia_attribution
    algorithm_type: threshold
    variants:
      - name: ADJUSTED_BALANCE
        formula: |
          Notice 2000-39 adjusted-opening-balance method.
            AOB = opening_fmv_cents + period_contributions_cents - period_distributions_cents
            ACB = closing_fmv_cents
            nia_adjusted_balance_cents = round_half_up(detected_excess_cents * (ACB - AOB) / AOB)
          A negative (ACB - AOB) yields a negative NIA, which reduces the corrected amount.
          AOB == 0 is impossible because period_contributions_cents always includes the deposit
          that carried the excess.
      - name: DAILY_PRORATA
        formula: |
          Deemed-rate method used when the account's investment mix changed mid-period, so no
          single opening/closing pair fairly represents the excess.
            days = (completion clock date - computation_period_start) in whole days
            nia_daily_prorata_cents = round_half_up(
                detected_excess_cents * ProgramYear.nia_daily_rate_bp * days / 10000)
    selection_rule: |
      BOTH variants are always computed and BOTH are persisted on the case at completion, so the
      divergence is inspectable. The variant that is APPLIED is chosen deterministically:
        if there exists an InvestmentElection of this account whose superseded_at is non-null and
        falls inside [computation_period_start, completion clock instant)
             -> nia_method_applied = DAILY_PRORATA
        else -> nia_method_applied = ADJUSTED_BALANCE
      applied_nia_cents = the named variant's value.
      corrected_amount_cents = detected_excess_cents + applied_nia_cents.
    inputs:
      - "ExcessContributionCase.detected_excess_cents"
      - "ExcessContributionCase.opening_fmv_cents"
      - "ExcessContributionCase.period_contributions_cents"
      - "ExcessContributionCase.period_distributions_cents"
      - "ExcessContributionCase.closing_fmv_cents"
      - "ExcessContributionCase.computation_period_start"
      - "InvestmentElection.superseded_at"
      - "ProgramYear.nia_daily_rate_bp"
    outputs:
      - "ExcessContributionCase.nia_adjusted_balance_cents"
      - "ExcessContributionCase.nia_daily_prorata_cents"
      - "ExcessContributionCase.nia_method_applied"
      - "ExcessContributionCase.applied_nia_cents"
      - "ExcessContributionCase.corrected_amount_cents"
    constants:
      nia_daily_rate_bp_default: 2
      excise_tax_rate_bp: 600
    precision: "integer cents, round_half_up on the final division only; no intermediate rounding"

  - rule_id: employer_penalty_amount
    algorithm_type: tiered_pricing
    variants:
      - name: STATUTORY_PER_EMPLOYEE
        formula: |
          Per-eligible-employee flat tiers keyed on how long the violation has stood:
            days_since_notice = (assessment clock date - notice_date) in whole days
            amount = 0
            if days_since_notice >= notice_period_days:
               amount += employee_count_at_assessment * register_penalty_initial_cents_per_employee
            if days_since_notice >= sustained_notice_days:
               amount += employee_count_at_assessment * register_penalty_sustained_cents_per_employee
          The tiers are ADDITIVE, not replacing: at 200 days a 5-employee firm owes
          5*25000 + 5*50000 = 375000, not 5*50000.
      - name: GRADUATED_SHORTFALL
        formula: |
          Proportional to money actually withheld and not remitted:
            for each remittance in the overdue set:
                days_late_now = assessment clock date - (pay_date + remittance_due_days)
            months_late = ceil(max(days_late_now) / 30)
            (days_late_now is measured against the assessment clock, NOT the frozen
             PayrollRemittance.days_late, so lateness keeps accruing while money is withheld)
            raw  = round_half_up(shortfall_basis_cents * remit_penalty_monthly_rate_bp
                                 * months_late / 10000)
            cap  = round_half_up(shortfall_basis_cents * remit_penalty_cap_bp / 10000)
            amount = min(max(raw, remit_penalty_floor_cents), cap)
          The floor is applied BEFORE the cap, so a tiny shortfall whose floor exceeds its own cap
          settles at the cap.
    selection_rule: |
      Both figures are always computed and persisted (statutory_amount_cents,
      graduated_amount_cents). assessed_cents is then pinned by violation_type:
        FAILURE_TO_REGISTER -> assessed_cents = statutory_amount_cents
        FAILURE_TO_ENROLL   -> assessed_cents = statutory_amount_cents
        FAILURE_TO_REMIT    -> assessed_cents = max(statutory_amount_cents,
                                                   graduated_amount_cents)
      When shortfall_basis_cents == 0 the graduated variant evaluates to 0 (the floor does not
      apply to a zero shortfall) so a registration-only violation is never inflated.
    inputs:
      - "Employer.employee_count"
      - "Employer.unremitted_deduction_cents"
      - "PenaltyAssessment.notice_date"
      - "PenaltyAssessment.violation_type"
      - "ProgramYear.notice_period_days"
      - "ProgramYear.sustained_notice_days"
      - "ProgramYear.register_penalty_initial_cents_per_employee"
      - "ProgramYear.register_penalty_sustained_cents_per_employee"
      - "ProgramYear.remit_penalty_monthly_rate_bp"
      - "ProgramYear.remit_penalty_floor_cents"
      - "ProgramYear.remit_penalty_cap_bp"
    outputs:
      - "PenaltyAssessment.statutory_amount_cents"
      - "PenaltyAssessment.graduated_amount_cents"
      - "PenaltyAssessment.assessed_cents"
      - "PenaltyAssessment.shortfall_basis_cents"
      - "PenaltyAssessment.months_late"
    precision: "integer cents; round_half_up; months_late is a ceiling of 30-day blocks"

  - rule_id: fund_allocation_split
    algorithm_type: weighted_scoring
    inputs:
      - "ParticipantAccount.balance_cents"
      - "InvestmentElection.allocations (fund_code, allocation_bp) of the ACTIVE election"
    outputs: ["ParticipantAccount.fund_balances"]
    formula: |
      Re-split from scratch on EVERY change to balance_cents (posting, reversal, earnings posting,
      correction debit, transfer debit/credit, permissible withdrawal). Never incremental, so
      rounding error cannot accumulate across events.

      Order the allocations by allocation_bp DESCENDING, then fund_code ASCENDING.
      For every fund EXCEPT the last in that order:
        fund_balance = round_half_up(balance_cents * allocation_bp / 10000)
      The LAST fund in the order absorbs the remainder:
        fund_balance = balance_cents - sum(all previously assigned fund balances)
      Therefore sum(fund_balances[].balance_cents) == balance_cents EXACTLY, always. Rounding each
      fund independently is wrong: it can produce a total one cent above the balance.
      A balance of 0 produces every fund at 0. An account with no ACTIVE election has an empty
      fund_balances array.
    constants:
      total_bp: 10000
      rounding_mode: round_half_up
      remainder_holder: "last fund after ordering by allocation_bp DESC, fund_code ASC"
    precision: "integer cents; exact conservation against balance_cents is the invariant"

  - rule_id: portability_settlement_math
    algorithm_type: waterfall_allocation
    inputs:
      - "PortabilityTransfer.amount_cents"
      - "PortabilityTransfer.transfer_kind"
      - "ParticipantAccount.balance_cents (source, pre-debit)"
      - "ParticipantAccount.contribution_basis_cents (source, pre-debit)"
    outputs:
      - "PortabilityTransfer.fee_cents"
      - "PortabilityTransfer.basis_portion_cents"
      - "PortabilityTransfer.taxable_cents"
      - "PortabilityTransfer.withholding_cents"
      - "PortabilityTransfer.net_cents"
    formula: |
      The five figures MUST be derived in exactly this order at request time, against pre-debit
      source values. Changing the order changes the answer.

      1. fee tier is keyed on the GROSS amount_cents, never on any net figure:
           amount_cents <= 500000                    -> fee_tier_bp = 40
           500001 <= amount_cents <= 950000          -> fee_tier_bp = 50
           amount_cents >= 950001                    -> fee_tier_bp = 60
         fee_cents = round_half_up(amount_cents * fee_tier_bp / 10000)
      2. basis_portion_cents = round_half_up(amount_cents * source.contribution_basis_cents
                                            / source.balance_cents)
      3. taxable_cents = amount_cents - basis_portion_cents
      4. withholding_cents = round_half_up(taxable_cents * indirect_withholding_bp / 10000)
         when transfer_kind == INDIRECT_60_DAY, else 0
      5. net_cents = amount_cents - fee_cents - withholding_cents

      Keying the fee tier on the post-withholding figure is the classic error: a 1000000 gross
      indirect rollover has 50000 withheld, and 950000 lands in the 50 bp tier instead of the
      60 bp tier, understating the fee and overstating net by 1250 cents.
      settle_by_date = requested_on + indirect_settle_days for INDIRECT_60_DAY, else null.
    constants:
      fee_tier_1_ceiling_cents: 500000
      fee_tier_1_bp: 40
      fee_tier_2_ceiling_cents: 950000
      fee_tier_2_bp: 50
      fee_tier_3_bp: 60
      indirect_withholding_bp: 1000
      indirect_settle_days: 60
      rollover_frequency_window_days: 365
      rollover_frequency_capacity: 1
    precision: "integer cents; round_half_up at every named step; no compounding of rounded values"

  - rule_id: account_posture_derivation
    algorithm_type: constraint_propagation
    inputs:
      - "ParticipantAccount.account_status"
      - "ExcessContributionCase.status of this account's cases"
      - "PortabilityTransfer.status where source_account_id == this account"
    outputs: ["ParticipantAccount.posture", "ParticipantAccount.uncorrected_excess_cents"]
    formula: |
      Re-derived after every write that could change any input, and propagated in one pass:
        if account_status IN {CLOSURE_PENDING, CLOSED}            -> LOCKED
        else if any ExcessContributionCase of this account has
                status IN {DETECTED, METHOD_ELECTED, EXPIRED}
             or any PortabilityTransfer with this account as source
                has status == REQUESTED                          -> RESTRICTED
        else                                                     -> UNRESTRICTED
      uncorrected_excess_cents = sum of detected_excess_cents over cases with status == EXPIRED.
      Gating semantics: LOCKED refuses new portability transfers and new closure requests;
      RESTRICTED refuses new portability transfers and new closure requests but STILL PERMITS
      investment elections, because a participant must be able to move out of a losing fund while
      an excess correction is pending. Postings and corrections are never posture-gated.
    precision: "not numeric; reaches a fixed point in a single pass because posture has no inputs that depend on posture"

  - rule_id: employer_compliance_status_and_unremitted
    algorithm_type: aggregation
    inputs:
      - "PayrollRemittance.status"
      - "PayrollRemittance.pay_date"
      - "PayrollRemittance.total_deducted_cents"
      - "PenaltyAssessment.status"
      - "EnforcementReferral.status"
      - "Employer.registration_status"
      - "Employer.registration_deadline"
      - "ProgramYear.remittance_due_days"
    outputs: ["Employer.unremitted_deduction_cents", "Employer.compliance_status"]
    formula: |
      unremitted_deduction_cents = sum of total_deducted_cents over this employer's
      PayrollRemittance rows with status IN {DRAFT, SUBMITTED} whose
      pay_date + remittance_due_days < current clock date. POSTED, REJECTED and REVERSED
      remittances contribute nothing: POSTED money has arrived, REJECTED money was never accepted
      and REVERSED money was compensated.

      compliance_status is then re-derived, highest first:
        any EnforcementReferral with status == OPEN on any of this employer's assessments -> REFERRED
        else any PenaltyAssessment with status IN {ASSESSED, AFFIRMED}                    -> PENALIZED
        else unremitted_deduction_cents > 0                                              -> DELINQUENT
        else registration_status == PENDING_REGISTRATION
             and registration_deadline is non-null
             and clock date > registration_deadline                                      -> DELINQUENT
        else                                                                             -> COMPLIANT
    precision: "integer cents; the day comparison is a strict inequality on ISO dates, so a remittance submitted exactly on pay_date + remittance_due_days is on time"

  - rule_id: default_investment_option_selection
    algorithm_type: topological
    inputs:
      - "Participant.date_of_birth"
      - "InvestmentOption.category"
      - "InvestmentOption.status"
      - "InvestmentOption.default_eligible"
      - "InvestmentOption.target_year"
      - "InvestmentOption.expense_ratio_bp"
      - "InvestmentOption.created_at"
    outputs:
      - "InvestmentElection.allocations"
      - "InvestmentElection.source"
      - "InvestmentElection.selection_basis"
    formula: |
      Deterministic cascade run by the auto-enrollment run when it opens an account. It never
      consults participant preference — that is what makes the employer non-fiduciary.

      retirement_year = year(date_of_birth) + normal_retirement_age
      Candidate pool A = InvestmentOption rows with category == TARGET_DATE
                         AND status == OPEN AND default_eligible == true
                         AND target_year >= retirement_year
        pick the SMALLEST target_year; tie-break on smallest expense_ratio_bp, then earliest
        created_at. selection_basis = "TARGET_DATE_GLIDE_PATH".
      If pool A is empty, candidate pool B = rows with category == CAPITAL_PRESERVATION
                         AND status == OPEN AND default_eligible == true
        pick the smallest expense_ratio_bp, tie-break earliest created_at.
        selection_basis = "CAPITAL_PRESERVATION_FALLBACK".
      If pool B is also empty the auto-enrollment run cannot open the account and fails with
      ERR_NO_DEFAULT_FUND_AVAILABLE; the enrollment stays in NOTIFIED.
      The resulting election has a single allocation of 10000 bp and source == SYSTEM_DEFAULT.
    constants:
      normal_retirement_age: 65
      full_allocation_bp: 10000
    precision: "not numeric; total ordering guarantees one winner for any non-empty pool"

# =============================================================================
# 1.4 Validation Rules (evaluated in ascending priority; first violation wins)
# =============================================================================
validations:

  # ---- priority 1..6 : envelope-level checks, always first --------------------
  - rule_id: v_auth_present
    priority: 1
    category: auth
    applies_to: "every endpoint except POST /_clock/set_current_utc"
    condition: "X-User-ID header absent or empty"
    error_id: ERR_UNAUTHENTICATED
    status: 401
    description: "Identity must be asserted before anything else is inspected, including whether the target exists."

  - rule_id: v_role_permitted
    priority: 2
    category: role
    applies_to: "every endpoint with a non-empty allowed_roles list"
    condition: "the caller's role is not in the endpoint's allowed_roles"
    error_id: ERR_UNAUTHORIZED
    status: 403
    description: "Role is checked before existence, so a wrong-role caller cannot probe which ids exist."

  - rule_id: v_path_target_exists
    priority: 3
    category: existence
    applies_to: "every endpoint with a path id segment"
    condition: "no entity of the addressed collection has that id"
    error_id: "ERR_EMPLOYER_NOT_FOUND | ERR_PARTICIPANT_NOT_FOUND | ERR_ENROLLMENT_NOT_FOUND | ERR_ACCOUNT_NOT_FOUND | ERR_REMITTANCE_NOT_FOUND | ERR_EXEMPTION_NOT_FOUND | ERR_EXCESS_CASE_NOT_FOUND | ERR_PENALTY_NOT_FOUND | ERR_TRANSFER_NOT_FOUND"
    status: 404
    description: "One error id per addressed collection so the failing hop in a nested path is unambiguous."

  - rule_id: v_caller_owns_target
    priority: 4
    category: ownership
    applies_to: "every endpoint whose allowed_roles include Employer or Participant"
    condition: "the caller's entity_backed row is not the owner of the addressed resource (employer of the enrollment/remittance, or participant of the account/enrollment/case/transfer)"
    error_id: ERR_FORBIDDEN_SCOPE
    status: 403
    description: "An Employer principal may only touch its own employer subtree; a Participant principal only its own accounts, enrollments, cases and transfers. Checked after existence so ownership never leaks the id space of other tenants."

  - rule_id: v_request_shape
    priority: 5
    category: request_shape
    applies_to: "every endpoint with a request body or query parameters"
    condition: "a required field is missing, a type is wrong, an enum value is unknown, a numeric field is out of its declared range, a date is not ISO-8601, limit is outside 1..100, or offset is negative"
    error_id: ERR_INVALID_REQUEST
    status: 422
    description: "Includes the conditional shape rules: target_year required iff category == TARGET_DATE; destination_account_id required iff destination_type == PROGRAM_ACCOUNT and forbidden otherwise; external_institution_name required iff destination_type == EXTERNAL_IRA; pay_period_end >= pay_period_start; pay_date >= pay_period_end; attestation_accepted must be true."

  - rule_id: v_body_reference_exists
    priority: 6
    category: existence
    applies_to: "POST /employers/{id}/enrollments, POST /payroll-remittances/{id}/remittance-lines, POST /portability-transfers"
    condition: "a body field naming another entity (participant_id, enrollment_id, source_account_id, destination_account_id) does not resolve"
    error_id: "ERR_PARTICIPANT_NOT_FOUND | ERR_ENROLLMENT_NOT_FOUND | ERR_ACCOUNT_NOT_FOUND"
    status: 404
    description: "Body references are resolved after shape validation so a malformed body reports ERR_INVALID_REQUEST rather than a spurious 404."

  # ---- priority 15 : optimistic concurrency ----------------------------------
  - rule_id: v_occ_account_version
    priority: 15
    category: concurrency
    applies_to: "POST /participant-accounts/{id}/investment-elections"
    condition: "expected_account_version != ParticipantAccount.version"
    error_id: ERR_STALE_ACCOUNT_VERSION
    status: 412
    description: "Refused before any state or business check, so a client that lost the version race is told to re-read rather than being handed a business error it cannot act on."

  - rule_id: v_occ_employer_version
    priority: 15
    category: concurrency
    applies_to: "POST /employers/{id}/employee-count-recounts"
    condition: "expected_employer_version != Employer.version"
    error_id: ERR_STALE_EMPLOYER_VERSION
    status: 412
    description: "Guards wave_tier and registration_deadline recomputation against a superseded employer baseline."

  # ---- priority 20 : lifecycle state gates -----------------------------------
  - rule_id: v_employer_registration_state
    priority: 20
    category: state
    applies_to: "POST /employers/{id}/registration"
    condition: "registration_status != PENDING_REGISTRATION, or wave_tier == NOT_COVERED"
    error_id: ERR_REGISTRATION_STATE_INVALID
    status: 409
    description: "Registration is a one-shot transition out of PENDING_REGISTRATION; a NOT_COVERED employer has nothing to register for."

  - rule_id: v_exemption_decision_state
    priority: 20
    category: state
    applies_to: "POST /exemption-certifications/{id}/decision, POST /exemption-certifications/{id}/revoke"
    condition: "decision requires status == SUBMITTED; revoke requires status == APPROVED"
    error_id: ERR_EXEMPTION_STATE_INVALID
    status: 409
    description: "Also makes the decision endpoint non-idempotent: deciding an already-decided certification is refused."

  - rule_id: v_enrollment_state
    priority: 20
    category: state
    applies_to: "POST /enrollments/{id}/opt-out, POST /enrollments/{id}/reenroll, POST /enrollments/{id}/rate-election, PATCH /enrollments/{id}/employment"
    condition: "opt-out requires status IN {NOTIFIED, ACTIVE}; reenroll requires status == OPTED_OUT; rate-election requires status IN {NOTIFIED, ACTIVE}; employment update requires status != TERMINATED"
    error_id: ERR_ENROLLMENT_STATE_INVALID
    status: 409
    description: "TERMINATED is terminal: no trigger moves an enrollment out of it."

  - rule_id: v_employer_not_registered
    priority: 20
    category: state
    applies_to: "POST /employers/{id}/enrollments, POST /employers/{id}/payroll-remittances, POST /enrollments/{id}/reenroll"
    condition: "the enrollment's employer has registration_status != REGISTERED"
    error_id: ERR_EMPLOYER_NOT_REGISTERED
    status: 409
    description: "Cross-entity state dependency: the enrollment operation is legal in itself but the employer aggregate is not in a state that permits payroll deduction. An EXEMPT_CERTIFIED or PENDING_REGISTRATION employer cannot enroll anyone."

  - rule_id: v_remittance_state
    priority: 20
    category: state
    applies_to: "POST /payroll-remittances/{id}/remittance-lines, POST /payroll-remittances/{id}/submit, POST /payroll-remittances/{id}/post, POST /payroll-remittances/{id}/reject, POST /payroll-remittances/{id}/reverse"
    condition: "lines may be added only while status IN {DRAFT, REJECTED}; submit requires status IN {DRAFT, REJECTED}; post and reject require status == SUBMITTED; reverse requires status == POSTED"
    error_id: ERR_REMITTANCE_STATE_INVALID
    status: 409
    description: "Posting twice, reversing a draft, or amending a posted batch are all refused here."

  - rule_id: v_account_closed
    priority: 20
    category: state
    applies_to: "POST /portability-transfers, POST /participant-accounts/{id}/investment-elections, POST /participant-accounts/{id}/closure-requests, POST /participant-accounts/{id}/earnings-postings"
    condition: "the addressed ParticipantAccount has account_status == CLOSED"
    error_id: ERR_ACCOUNT_CLOSED
    status: 409
    description: "A CLOSED account is terminal and refuses every write, including ones that would otherwise fail a fiscal check at priority 70. This is the state-vs-fiscal precedence pair. Strictly ahead of v_account_restricted (priority 22), so a CLOSED account -- whose derived posture is also LOCKED -- always reports ERR_ACCOUNT_CLOSED and never ERR_ACCOUNT_RESTRICTED."

  - rule_id: v_account_restricted
    priority: 22
    category: state
    applies_to: "POST /portability-transfers, POST /participant-accounts/{id}/closure-requests"
    condition: "the source/addressed account has posture IN {RESTRICTED, LOCKED}"
    error_id: ERR_ACCOUNT_RESTRICTED
    status: 409
    description: "Cross-entity state dependency in the opposite direction: the account row itself is OPEN, but an in-flight PortabilityTransfer or an unresolved ExcessContributionCase makes its derived posture refuse new money movement. Investment elections are deliberately NOT gated."

  - rule_id: v_excess_case_state
    priority: 20
    category: state
    applies_to: "POST /excess-contribution-cases/{id}/method-election, POST /excess-contribution-cases/{id}/completion"
    condition: "method-election requires status == DETECTED; completion requires status == METHOD_ELECTED"
    error_id: ERR_EXCESS_CASE_STATE_INVALID
    status: 409
    description: "A VOIDED or EXPIRED case is terminal; a DETECTED case cannot be completed before a correction_method is elected."

  - rule_id: v_penalty_state
    priority: 20
    category: state
    applies_to: "POST /penalty-assessments/{id}/disposition, POST /penalty-assessments/{id}/enforcement-referrals"
    condition: "disposition requires status IN {ASSESSED, AFFIRMED}; referral creation requires status == AFFIRMED"
    error_id: ERR_PENALTY_STATE_INVALID
    status: 409
    description: "ABATED is terminal. An assessment still inside its cure period cannot be referred because it cannot yet be AFFIRMED."

  - rule_id: v_transfer_state
    priority: 20
    category: state
    applies_to: "POST /portability-transfers/{id}/settle, POST /portability-transfers/{id}/return"
    condition: "status != REQUESTED"
    error_id: ERR_TRANSFER_STATE_INVALID
    status: 409
    description: "SETTLED, RETURNED and FAILED_TAXABLE are terminal; settling twice is refused."

  - rule_id: v_closure_completion_state
    priority: 20
    category: state
    applies_to: "POST /participant-accounts/{id}/closure-completion"
    condition: "account_status != CLOSURE_PENDING"
    error_id: ERR_CLOSURE_STATE_INVALID
    status: 409
    description: "Closure must be requested before it can be completed; the two-step split is what forces the residual balance to be drained first."

  # ---- priority 25 : segregation of duties -----------------------------------
  - rule_id: v_penalty_self_disposition
    priority: 25
    category: authorization
    applies_to: "POST /penalty-assessments/{id}/disposition"
    condition: "X-User-ID == PenaltyAssessment.assessed_by_user_id"
    error_id: ERR_SELF_DISPOSITION_FORBIDDEN
    status: 403
    description: "Segregation of duties: the officer who assessed a penalty may not abate or affirm it. Checked after the state gate so an already-ABATED assessment reports its state error even to the original assessor."

  - rule_id: v_employer_fiduciary_boundary
    priority: 25
    category: authorization
    applies_to: "POST /enrollments/{id}/rate-election, POST /enrollments/{id}/opt-out"
    condition: "the caller's role is Employer"
    error_id: ERR_FIDUCIARY_BOUNDARY_VIOLATION
    status: 403
    description: "The employer's role is ministerial: it may report headcount, register, submit remittances and report separations, but it may never choose a rate, an opt-out, a fund or a correction method on a participant's behalf. Distinct from ERR_UNAUTHORIZED so the boundary is auditable, which is why the Employer role is admitted to the two enrollment-scoped routes it does own instead of being excluded from them. On POST /participant-accounts/{id}/investment-elections and POST /excess-contribution-cases/{id}/method-election the Employer role is not in allowed_roles at all, so an employer attempt there is refused earlier by v_role_permitted with ERR_UNAUTHORIZED."

  # ---- priority 45 : enforcement safety interlock ----------------------------
  - rule_id: v_enforcement_hold
    priority: 45
    category: business_safety
    applies_to: "POST /employers/{id}/exemption-certifications, POST /employers/{id}/employee-count-recounts"
    condition: "the employer has at least one EnforcementReferral with status == OPEN"
    error_id: ERR_ENFORCEMENT_HOLD
    status: 409
    description: "While a matter sits with an outside agency the employer may not re-shape the facts underneath it by claiming an exemption or restating headcount. Deliberately ranked ABOVE the temporal window checks so an employer under referral is told about the hold, not about a stale plan date."

  # ---- priority 50 : referential / cross-aggregate coherence -----------------
  - rule_id: v_fund_available
    priority: 50
    category: business_referential
    applies_to: "POST /participant-accounts/{id}/investment-elections"
    condition: "an allocations[].fund_code does not match any InvestmentOption, or matches one whose status != OPEN"
    error_id: ERR_FUND_NOT_AVAILABLE
    status: 409
    description: "CLOSED_TO_NEW and TERMINATED options may still hold legacy balances but cannot be elected into."

  - rule_id: v_line_enrollment_coherent
    priority: 50
    category: business_referential
    applies_to: "POST /payroll-remittances/{id}/remittance-lines"
    condition: "Enrollment.employer_id != the remittance's employer_id, or the enrollment has enrollment_status IN {OPTED_OUT, TERMINATED}, or the enrollment has no open ParticipantAccount"
    error_id: ERR_ENROLLMENT_NOT_DEDUCTIBLE
    status: 409
    description: "Cross-aggregate coherence: an employer cannot remit against another employer's enrollment nor against someone who opted out or separated."

  - rule_id: v_transfer_accounts_coherent
    priority: 50
    category: business_referential
    applies_to: "POST /portability-transfers"
    condition: "source_account_id does not belong to participant_id, or destination_account_id equals source_account_id, or destination_account_id belongs to a different participant, or the destination account is not OPEN"
    error_id: ERR_ACCOUNT_OWNER_MISMATCH
    status: 409
    description: "Portability moves money within one person's own retirement savings; it is never a transfer between two people."

  - rule_id: v_default_fund_available
    priority: 50
    category: business_referential
    applies_to: "POST /_ops/auto-enrollment-run"
    condition: "both candidate pools of calculations.default_investment_option_selection are empty for a participant the run is about to activate"
    error_id: ERR_NO_DEFAULT_FUND_AVAILABLE
    status: 409
    description: "The run cannot open an account it cannot invest; the enrollment stays NOTIFIED and no partial account is created."

  # ---- priority 55 : occupancy / uniqueness / frequency constraints ---------
  - rule_id: v_pay_period_overlap
    priority: 55
    category: business_constraint
    applies_to: "POST /employers/{id}/payroll-remittances"
    condition: "the requested [pay_period_start, pay_period_end] CLOSED interval intersects that of another PayrollRemittance of the same employer whose status != REVERSED"
    error_id: ERR_PAY_PERIOD_OVERLAP
    status: 409
    description: "Both endpoints are inclusive, so two periods sharing a single boundary day collide; a period starting the day after another ends is accepted. REVERSED remittances free their interval."

  - rule_id: v_duplicate_active_enrollment
    priority: 55
    category: business_constraint
    applies_to: "POST /employers/{id}/enrollments"
    condition: "an Enrollment already exists for this (employer_id, participant_id) with enrollment_status IN {NOTIFIED, ACTIVE, OPTED_OUT}"
    error_id: ERR_DUPLICATE_ENROLLMENT
    status: 409
    description: "Re-hiring after a TERMINATED enrollment is allowed and creates a new row; an existing OPTED_OUT enrollment must be re-enrolled instead of duplicated."

  - rule_id: v_exemption_period_overlap
    priority: 55
    category: business_constraint
    applies_to: "POST /employers/{id}/exemption-certifications"
    condition: "the derived [coverage_period_start, coverage_period_end) HALF-OPEN interval intersects that of another certification of the same employer whose status IN {SUBMITTED, APPROVED}"
    error_id: ERR_EXEMPTION_PERIOD_OVERLAP
    status: 409
    description: "Half-open here, unlike pay periods: a new certification whose start equals a prior certification's end is accepted, because the prior coverage has lapsed on that day. REJECTED and REVOKED certifications free their interval."

  - rule_id: v_rollover_frequency
    priority: 55
    category: business_constraint
    applies_to: "POST /portability-transfers"
    condition: "transfer_kind == INDIRECT_60_DAY and the participant already has a PortabilityTransfer with transfer_kind == INDIRECT_60_DAY and status IN {SETTLED, REQUESTED} whose settled_on (or requested_on when unsettled) falls inside the trailing 365-day window ending on the request date"
    error_id: ERR_ROLLOVER_FREQUENCY_LIMIT
    status: 409
    description: "One indirect rollover per rolling 365 days per PERSON, aggregated across all of that person's accounts. The window is exactly [request date - 364 days, request date], inclusive of both ends, i.e. 365 calendar days counting the request date itself: a prior rollover settled on 2026-05-01 blocks a request on 2027-04-30 (window opens 2026-05-01) and permits one on 2027-05-01 (window opens 2026-05-02). DIRECT_ROLLOVER and TRUSTEE_TO_TRUSTEE are unlimited."

  # ---- priority 58 : temporal windows --------------------------------------
  - rule_id: v_exemption_window_closed
    priority: 58
    category: business_temporal
    applies_to: "POST /employers/{id}/exemption-certifications"
    condition: "the derived coverage_period_end is <= the current clock date"
    error_id: ERR_EXEMPTION_WINDOW_CLOSED
    status: 409
    description: "A qualified plan whose three-year certification window has already elapsed cannot be used to claim a present exemption; the employer must re-certify with a current effective date."

  - rule_id: v_opt_out_window_closed
    priority: 58
    category: business_temporal
    applies_to: "POST /enrollments/{id}/opt-out"
    condition: "enrollment_status == NOTIFIED and the clock date is on or after opt_out_deadline"
    error_id: ERR_OPT_OUT_WINDOW_CLOSED
    status: 409
    description: "A pre-activation opt-out is only available inside the notice window; after the deadline the participant must wait for activation and then opt out of an ACTIVE enrollment."

  - rule_id: v_permissible_withdrawal_window
    priority: 58
    category: business_temporal
    applies_to: "POST /enrollments/{id}/opt-out with request_permissible_withdrawal == true"
    condition: "first_contribution_date is null, or the clock date is later than first_contribution_date + ProgramYear.opt_out_window_days"
    error_id: ERR_PERMISSIBLE_WITHDRAWAL_WINDOW_CLOSED
    status: 409
    description: "The refund of already-withheld contributions is only available inside the statutory window after the first contribution. Outside it the participant may still opt out — the request is only refused when it asks for the withdrawal."

  - rule_id: v_correction_deadline_passed
    priority: 58
    category: business_temporal
    applies_to: "POST /excess-contribution-cases/{id}/method-election, POST /excess-contribution-cases/{id}/completion"
    condition: "the clock date is later than ExcessContributionCase.deadline_date"
    error_id: ERR_CORRECTION_DEADLINE_PASSED
    status: 409
    description: "After the correction deadline the excess is frozen and awaits the sweep that expires it and books the excise tax."

  - rule_id: v_rollover_window_expired
    priority: 58
    category: business_temporal
    applies_to: "POST /portability-transfers/{id}/settle"
    condition: "transfer_kind == INDIRECT_60_DAY and settled_on is later than settle_by_date"
    error_id: ERR_ROLLOVER_WINDOW_EXPIRED
    status: 409
    description: "A late indirect rollover cannot be settled as a rollover at all; the sweep converts it to FAILED_TAXABLE instead."

  - rule_id: v_cure_period_active
    priority: 58
    category: business_temporal
    applies_to: "POST /penalty-assessments/{id}/disposition with disposition == AFFIRM"
    condition: "the clock date is on or before PenaltyAssessment.cure_deadline"
    error_id: ERR_CURE_PERIOD_ACTIVE
    status: 409
    description: "An assessment cannot be affirmed while the employer still has time to cure. ABATE remains available throughout the cure period."

  # ---- priority 65 : arithmetic coherence ----------------------------------
  - rule_id: v_allocation_total
    priority: 65
    category: business_constraint
    applies_to: "POST /participant-accounts/{id}/investment-elections"
    condition: "sum of allocations[].allocation_bp != 10000, any allocation_bp <= 0, or a fund_code appears twice"
    error_id: ERR_ALLOCATION_TOTAL_INVALID
    status: 409
    description: "Checked after fund availability so an election naming a terminated fund reports the fund problem rather than an arithmetic one."

  - rule_id: v_deduction_amount_mismatch
    priority: 65
    category: business_constraint
    applies_to: "POST /payroll-remittances/{id}/remittance-lines"
    condition: "deducted_cents != round_half_up(gross_wages_cents * Enrollment.contribution_rate_bp / 10000)"
    error_id: ERR_DEDUCTION_AMOUNT_MISMATCH
    status: 409
    description: "The employer is a pass-through: it must withhold exactly the program-computed amount, with the same round_half_up rule. This is where the non-fiduciary boundary becomes arithmetic."

  - rule_id: v_remittance_total_mismatch
    priority: 65
    category: business_constraint
    applies_to: "POST /payroll-remittances/{id}/submit"
    condition: "the sum of child RemittanceLine.deducted_cents != PayrollRemittance.total_deducted_cents, or line_count == 0"
    error_id: ERR_REMITTANCE_TOTAL_MISMATCH
    status: 409
    description: "The declared batch total must reconcile to the lines before the batch can enter the remittance pipeline."

  - rule_id: v_rate_out_of_bounds
    priority: 65
    category: business_constraint
    applies_to: "POST /enrollments/{id}/rate-election"
    condition: "contribution_rate_bp is below min_participant_rate_bp or above max_participant_rate_bp"
    error_id: ERR_RATE_OUT_OF_BOUNDS
    status: 409
    description: "Participant-elected rates are bounded at 100..1500 bp; electing 0 is expressed as an opt-out, not as a rate of zero."

  # ---- priority 70 : fiscal sufficiency, last ------------------------------
  - rule_id: v_insufficient_account_balance
    priority: 70
    category: business_fiscal
    applies_to: "POST /portability-transfers, POST /excess-contribution-cases/{id}/completion"
    condition: "amount_cents > source ParticipantAccount.balance_cents, or corrected_amount_cents > account.balance_cents for a REFUND_TO_PARTICIPANT correction"
    error_id: ERR_INSUFFICIENT_ACCOUNT_BALANCE
    status: 402
    description: "Ranked last so every structural, temporal and coherence problem is reported before the money question. A closed account with an oversized request reports ERR_ACCOUNT_CLOSED, never this."

  - rule_id: v_residual_balance_present
    priority: 70
    category: business_fiscal
    applies_to: "POST /participant-accounts/{id}/closure-completion"
    condition: "ParticipantAccount.balance_cents != 0"
    error_id: ERR_RESIDUAL_BALANCE_PRESENT
    status: 409
    description: "An account may not be closed while it still holds money; the residual must first be rolled out or distributed per residual_disposition."

# =============================================================================
# 1.5 API Endpoint Table
# =============================================================================
endpoints:

  # ---- test-driving surface (/_ namespace) ----------------------------------
  - method: POST
    path: "/_clock/set_current_utc"
    description: "Sets the server's logical clock to an arbitrary instant so deadline, window, seasoning and 365-day-frequency rules are deterministic. The server's startup default logical time is exactly 2026-08-01T00:00:00Z: before any call to this endpoint the clock reads that instant and MUST NOT fall back to real wall-clock time."
    roles: [ProgramAdministrator]
    code: 200
    input: [current_utc]
    output: "{ current_utc: string }"
    side_effects:
      - "every subsequent date-derived computation (age_at_year_end, days_late, deadlines, posture, sweeps) reads the new clock"

  - method: POST
    path: "/_ops/auto-enrollment-run"
    description: "Runs the auto-enrollment batch: activates every NOTIFIED enrollment whose opt-out window has closed, opens a ROTH_IRA ParticipantAccount when the participant has none, and seeds a SYSTEM_DEFAULT InvestmentElection from the default-fund selector."
    roles: [ProgramAdministrator]
    code: 200
    input: ["as_of_date?"]
    output: "{ activated_count: integer, accounts_opened_count: integer, skipped_count: integer }"
    side_effects:
      - "Enrollment NOTIFIED -> ACTIVE"
      - "ParticipantAccount created (account_type ROTH_IRA, balance_cents 0, posture UNRESTRICTED)"
      - "InvestmentElection created with source SYSTEM_DEFAULT and selection_basis from calculations.default_investment_option_selection"
      - "fails with ERR_NO_DEFAULT_FUND_AVAILABLE when both default-fund candidate pools are empty"

  - method: POST
    path: "/_ops/annual-escalation-run"
    description: "Runs the annual auto-escalation batch over ACTIVE, seasoned, non-opted-out enrollments per calculations.default_rate_and_escalation."
    roles: [ProgramAdministrator]
    code: 200
    input: ["effective_date?"]
    output: "{ escalated_count: integer, capped_count: integer, skipped_count: integer }"
    side_effects:
      - "Enrollment.contribution_rate_bp raised by escalation_increment_bp, clamped at escalation_cap_bp"
      - "Enrollment.rate_source := ESCALATED for every escalated enrollment"

  - method: POST
    path: "/_ops/compliance-sweep"
    description: "Runs the enforcement and expiry batch: re-derives employer delinquency and unremitted totals, mints SWEEP-origin penalty assessments for employers past their registration deadline, expires overdue excess-contribution cases with excise tax, and lapses overdue indirect rollovers into FAILED_TAXABLE."
    roles: [ComplianceOfficer, ProgramAdministrator]
    code: 200
    input: ["as_of_date?"]
    output: "{ delinquent_employer_count: integer, assessments_created_count: integer, expired_case_count: integer, failed_transfer_count: integer }"
    side_effects:
      - "Employer.unremitted_deduction_cents and compliance_status recomputed"
      - "PenaltyAssessment created with origin SWEEP and assessed_by_user_id SYSTEM"
      - "ExcessContributionCase DETECTED/METHOD_ELECTED -> EXPIRED with excise_tax_cents booked"
      - "PortabilityTransfer REQUESTED -> FAILED_TAXABLE with in_transit_cents zeroed"
      - "affected ParticipantAccount.posture re-derived"

  # ---- program configuration ------------------------------------------------
  - method: POST
    path: "/program-years"
    description: "Creates the immutable statutory parameter set for one calendar year. Every tuning dial has a default, so a minimal call pins only the year, the IRA limit and the default deferral rate."
    roles: [ProgramAdministrator]
    code: 201
    input: [calendar_year, ira_annual_limit_cents, default_contribution_rate_bp, "catch_up_limit_cents?", "escalation_increment_bp?", "escalation_cap_bp?", "escalation_seasoning_days?", "opt_out_window_days?", "remittance_due_days?", "notice_period_days?", "sustained_notice_days?", "register_penalty_initial_cents_per_employee?", "register_penalty_sustained_cents_per_employee?", "remit_penalty_monthly_rate_bp?", "remit_penalty_floor_cents?", "remit_penalty_cap_bp?", "nia_daily_rate_bp?", "correction_deadline_month_day?"]
    output: ProgramYear
    side_effects:
      - "all defaults materialized onto the stored row"
      - "ERR_DUPLICATE_PROGRAM_YEAR when calendar_year already exists"

  - method: GET
    path: "/program-years"
    description: "Lists configured program years, newest first."
    roles: [ProgramAdministrator, ComplianceOfficer, Recordkeeper, Employer, Participant]
    code: 200
    input: ["calendar_year?", "limit?", "offset?"]
    output: ProgramYear[]
    side_effects: []

  - method: POST
    path: "/investment-options"
    description: "Adds an immutable fund to the program menu. status is settable at creation so a CLOSED_TO_NEW or TERMINATED legacy option can be seeded without a mutation endpoint."
    roles: [ProgramAdministrator]
    code: 201
    input: [fund_code, name, category, expense_ratio_bp, default_eligible, "target_year?", "status?"]
    output: InvestmentOption
    side_effects:
      - "ERR_DUPLICATE_FUND_CODE when fund_code already exists"
      - "ERR_INVALID_REQUEST when target_year is supplied for a non-TARGET_DATE category or omitted for TARGET_DATE"

  - method: GET
    path: "/investment-options"
    description: "Lists the fund menu with filters, so a test can assert exactly which options the default selector had to choose from."
    roles: [ProgramAdministrator, ComplianceOfficer, Recordkeeper, Employer, Participant]
    code: 200
    input: ["category?", "status?", "default_eligible?", "limit?", "offset?"]
    output: InvestmentOption[]
    side_effects: []

  - method: GET
    path: "/investment-options/{id}"
    description: "Reads one fund option."
    roles: [ProgramAdministrator, ComplianceOfficer, Recordkeeper, Employer, Participant]
    code: 200
    input: []
    output: InvestmentOption
    side_effects: []

  # ---- employers ------------------------------------------------------------
  - method: POST
    path: "/employers"
    description: "Registers an employer record and derives its mandate wave. An employer with 4 or fewer eligible employees is created directly in registration_status EXEMPT_SMALL with a null deadline."
    roles: [ProgramAdministrator, Employer]
    code: 201
    input: [ein, legal_name, worksite_state, employee_count]
    output: Employer
    side_effects:
      - "wave_tier and registration_deadline computed by calculations.employer_coverage_tier"
      - "registration_status := EXEMPT_SMALL when wave_tier == NOT_COVERED, else PENDING_REGISTRATION"
      - "compliance_status := COMPLIANT"
      - "ERR_DUPLICATE_EIN when ein already exists"

  - method: GET
    path: "/employers/{id}"
    description: "Reads one employer with both state dimensions and the derived unremitted total."
    roles: [ProgramAdministrator, ComplianceOfficer, Recordkeeper, Employer]
    code: 200
    input: []
    output: Employer
    side_effects: []

  - method: POST
    path: "/employers/{id}/registration"
    description: "Completes the mandate registration. The employer must acknowledge its ministerial, non-fiduciary role; without that acknowledgement the request is rejected."
    roles: [Employer]
    code: 200
    input: [non_fiduciary_acknowledged, payroll_contact_email]
    output: Employer
    side_effects:
      - "registration_status PENDING_REGISTRATION -> REGISTERED"
      - "non_fiduciary_acknowledged, payroll_contact_email and registered_at set"
      - "increments Employer.version by 1"

  - method: POST
    path: "/employers/{id}/employee-count-recounts"
    description: "Restates the eligible-employee headcount and re-derives wave_tier and registration_deadline. Optimistically concurrent: the caller must supply the Employer version it composed the recount against."
    roles: [ProgramAdministrator, Employer]
    code: 200
    input: [employee_count, effective_date, expected_employer_version]
    output: Employer
    side_effects:
      - "wave_tier and registration_deadline recomputed by calculations.employer_coverage_tier"
      - "registration_status EXEMPT_SMALL <-> PENDING_REGISTRATION when the 4/5 boundary is crossed"
      - "last_recount_effective_date := effective_date"
      - "increments Employer.version by 1"
      - "ERR_STALE_EMPLOYER_VERSION (412) when expected_employer_version does not match"
      - "ERR_ENFORCEMENT_HOLD when the employer has an OPEN enforcement referral"

  - method: GET
    path: "/employers/{id}/exemption-certifications"
    description: "Lists this employer's qualified-plan exemption certifications, including cascade-revoked ones. Reverse-reachability GET for ExemptionCertification.employer_id."
    roles: [ProgramAdministrator, ComplianceOfficer, Employer]
    code: 200
    input: ["status?", "limit?", "offset?"]
    output: ExemptionCertification[]
    side_effects: []

  - method: GET
    path: "/employers/{id}/penalty-assessments"
    description: "Lists this employer's penalty assessments including SYSTEM_CASCADE and SWEEP origins that no creation response ever returned. Reverse-reachability GET for PenaltyAssessment.employer_id."
    roles: [ProgramAdministrator, ComplianceOfficer, Employer]
    code: 200
    input: ["status?", "violation_type?", "origin?", "limit?", "offset?"]
    output: PenaltyAssessment[]
    side_effects: []

  # ---- exemption certifications --------------------------------------------
  - method: POST
    path: "/employers/{id}/exemption-certifications"
    description: "Files a qualified-plan exemption certification. The three-year coverage interval is derived from plan_effective_date and may not have already elapsed."
    roles: [Employer, ProgramAdministrator]
    code: 201
    input: [qualified_plan_type, plan_sponsor_ein, plan_effective_date, attestation_accepted]
    output: ExemptionCertification
    side_effects:
      - "coverage_period_start := plan_effective_date; coverage_period_end := plan_effective_date + 3 years (exclusive)"
      - "status := SUBMITTED"
      - "ERR_ENFORCEMENT_HOLD (priority 45) when an OPEN enforcement referral exists"
      - "ERR_EXEMPTION_PERIOD_OVERLAP when the half-open interval collides with another SUBMITTED/APPROVED certification"
      - "ERR_EXEMPTION_WINDOW_CLOSED (priority 58) when coverage_period_end <= clock date"

  - method: GET
    path: "/exemption-certifications/{id}"
    description: "Reads one exemption certification with its derived coverage interval and decision trail."
    roles: [ProgramAdministrator, ComplianceOfficer, Employer]
    code: 200
    input: []
    output: ExemptionCertification
    side_effects: []

  - method: POST
    path: "/exemption-certifications/{id}/decision"
    description: "Approves or rejects a submitted certification. Approval moves the employer's registration dimension to EXEMPT_CERTIFIED."
    roles: [ProgramAdministrator]
    code: 200
    input: [decision, "decision_note?"]
    output: ExemptionCertification
    side_effects:
      - "status SUBMITTED -> APPROVED or REJECTED; decided_at and decision_note set"
      - "on APPROVE: Employer.registration_status := EXEMPT_CERTIFIED and a registration-premised DELINQUENT compliance_status clears to COMPLIANT"
      - "increments Employer.version by 1 on APPROVE"

  - method: POST
    path: "/exemption-certifications/{id}/revoke"
    description: "Revokes an approved certification. Head of the deepest cascade in the domain: the employer falls back to PENDING_REGISTRATION, becomes DELINQUENT if past deadline, is auto-assessed, and is auto-referred when a prior affirmed assessment already exists."
    roles: [ComplianceOfficer]
    code: 200
    input: [revocation_reason]
    output: ExemptionCertification
    side_effects:
      - "status APPROVED -> REVOKED; revoked_at and revocation_reason set"
      - "Employer.registration_status := PENDING_REGISTRATION"
      - "Employer.compliance_status := DELINQUENT when clock date > registration_deadline"
      - "PenaltyAssessment created with violation_type FAILURE_TO_REGISTER, origin SYSTEM_CASCADE, notice_date := Employer.registration_deadline, assessed_by_user_id SYSTEM -> compliance_status := PENALIZED"
      - "EnforcementReferral created ON THE EMPLOYER'S EXISTING AFFIRMED PenaltyAssessment (not on the newly minted one, which is still inside its cure period) with agency STATE_LABOR_COMMISSIONER and referred_by_user_id SYSTEM, when such an AFFIRMED assessment exists -> compliance_status := REFERRED"
      - "increments Employer.version by 1"

  # ---- participants ---------------------------------------------------------
  - method: POST
    path: "/participants"
    description: "Creates a participant record. date_of_birth drives both catch-up eligibility and the target-date default-fund selector."
    roles: [ProgramAdministrator]
    code: 201
    input: [full_name, date_of_birth, email, ssn_last4, state_resident, "mailing_address?", "phone?"]
    output: Participant
    side_effects:
      - "age_at_year_end and catch_up_eligible computed against the current logical clock"

  - method: GET
    path: "/participants/{id}"
    description: "Reads one participant with derived age, catch-up eligibility and indirect-rollover count."
    roles: [ProgramAdministrator, ComplianceOfficer, Recordkeeper, Participant]
    code: 200
    input: []
    output: Participant
    side_effects: []

  - method: GET
    path: "/participants"
    description: "Lists participants for program administration."
    roles: [ProgramAdministrator, ComplianceOfficer]
    code: 200
    input: ["state_resident?", "catch_up_eligible?", "limit?", "offset?"]
    output: Participant[]
    side_effects: []

  - method: PATCH
    path: "/participants/{id}"
    description: "Participant-service contact update. Only contact fields are mutable; identity and birth date are not."
    roles: [Participant, ProgramAdministrator]
    code: 200
    input: ["email?", "mailing_address?", "phone?"]
    output: Participant
    side_effects:
      - "increments Participant.version by 1"

  # ---- enrollments ----------------------------------------------------------
  - method: POST
    path: "/employers/{id}/enrollments"
    description: "Auto-enrolls an employee at the program default deferral rate. The employer supplies only facts it owns (who, hire date, compensation); it never chooses a rate."
    roles: [Employer, ProgramAdministrator]
    code: 201
    input: [participant_id, hire_date, annual_compensation_cents]
    output: Enrollment
    side_effects:
      - "contribution_rate_bp := ProgramYear.default_contribution_rate_bp with rate_source DEFAULT"
      - "enrollment_status := NOTIFIED; opt_out_deadline := created date + ProgramYear.opt_out_window_days"
      - "ERR_EMPLOYER_NOT_REGISTERED when the employer's registration_status != REGISTERED"
      - "ERR_DUPLICATE_ENROLLMENT when a NOTIFIED/ACTIVE/OPTED_OUT enrollment already exists for the pair"

  - method: GET
    path: "/enrollments/{id}"
    description: "Reads one enrollment with its current rate, provenance and lifecycle state."
    roles: [ProgramAdministrator, ComplianceOfficer, Recordkeeper, Employer, Participant]
    code: 200
    input: []
    output: Enrollment
    side_effects: []

  - method: GET
    path: "/enrollments"
    description: "Filtered enrollment list. Reverse-reachability GET for both Enrollment.employer_id and Enrollment.participant_id."
    roles: [ProgramAdministrator, ComplianceOfficer, Recordkeeper, Employer, Participant]
    code: 200
    input: ["employer_id?", "participant_id?", "enrollment_status?", "rate_source?", "limit?", "offset?"]
    output: Enrollment[]
    side_effects: []

  - method: POST
    path: "/enrollments/{id}/opt-out"
    description: "Participant opt-out. Inside the post-first-contribution window the participant may also request a permissible withdrawal of everything already withheld. The Employer role is admitted to the route only so that its attempt is refused by the auditable fiduciary-boundary rule rather than by a generic role check."
    roles: [Participant, ProgramAdministrator, Employer]
    code: 200
    input: [opt_out_reason_code, "request_permissible_withdrawal?"]
    output: Enrollment
    side_effects:
      - "enrollment_status NOTIFIED or ACTIVE -> OPTED_OUT; opted_out_at and opt_out_reason_code set"
      - "on an in-window permissible withdrawal: permissible_withdrawal_cents := lifetime_deducted_cents, and the account's balance_cents and contribution_basis_cents are debited by that amount with fund_balances re-split"
      - "increments ParticipantAccount.version by 1 when a withdrawal is paid"
      - "ERR_OPT_OUT_WINDOW_CLOSED when a NOTIFIED enrollment is past opt_out_deadline"
      - "ERR_PERMISSIBLE_WITHDRAWAL_WINDOW_CLOSED when the withdrawal is requested outside its window"
      - "ERR_FIDUCIARY_BOUNDARY_VIOLATION when attempted by an Employer principal"

  - method: POST
    path: "/enrollments/{id}/reenroll"
    description: "Re-enrolls a participant who previously opted out. The rate resets to the program default rather than resuming the old rate, and escalation opt-out is cleared."
    roles: [Participant, ProgramAdministrator]
    code: 200
    input: ["reenroll_note?"]
    output: Enrollment
    side_effects:
      - "enrollment_status OPTED_OUT -> ACTIVE"
      - "contribution_rate_bp := ProgramYear.default_contribution_rate_bp; rate_source := DEFAULT; escalation_opt_out := false"
      - "reenrollment_count incremented; opted_out_at and opt_out_reason_code cleared"
      - "ERR_EMPLOYER_NOT_REGISTERED when the employer has since left REGISTERED"

  - method: POST
    path: "/enrollments/{id}/rate-election"
    description: "Participant deferral-rate election and escalation preference. The Employer role is admitted to the route only so that its attempt is refused by the auditable fiduciary-boundary rule rather than by a generic role check."
    roles: [Participant, ProgramAdministrator, Employer]
    code: 200
    input: [contribution_rate_bp, "escalation_opt_out?"]
    output: Enrollment
    side_effects:
      - "contribution_rate_bp set; rate_source := PARTICIPANT_ELECTED"
      - "escalation_opt_out set when supplied"
      - "ERR_RATE_OUT_OF_BOUNDS outside 100..1500 bp"
      - "ERR_FIDUCIARY_BOUNDARY_VIOLATION when attempted by an Employer principal"

  - method: PATCH
    path: "/enrollments/{id}/employment"
    description: "Employer reports a separation date, terminating the enrollment. The participant's account stays open and portable."
    roles: [Employer]
    code: 200
    input: [employment_end_date]
    output: Enrollment
    side_effects:
      - "employment_end_date set; enrollment_status -> TERMINATED"
      - "the enrollment becomes ineligible as a RemittanceLine target"

  - method: GET
    path: "/enrollments/{id}/remittance-lines"
    description: "Contribution history for one enrollment across every batch. Reverse-reachability GET for RemittanceLine.enrollment_id."
    roles: [ProgramAdministrator, ComplianceOfficer, Recordkeeper, Employer, Participant]
    code: 200
    input: ["status?", "limit?", "offset?"]
    output: RemittanceLine[]
    side_effects: []

  # ---- participant accounts -------------------------------------------------
  - method: GET
    path: "/participant-accounts/{id}"
    description: "Reads one IRA with balance, basis, year-to-date contributions, headroom, derived posture and the fund-level split."
    roles: [ProgramAdministrator, ComplianceOfficer, Recordkeeper, Participant]
    code: 200
    input: []
    output: ParticipantAccount
    side_effects: []

  - method: GET
    path: "/participant-accounts"
    description: "Filtered account list. Reverse-reachability GET for ParticipantAccount.participant_id and for the self-referential ParticipantAccount.rolled_over_from_account_id."
    roles: [ProgramAdministrator, ComplianceOfficer, Recordkeeper, Participant]
    code: 200
    input: ["participant_id?", "rolled_over_from_account_id?", "account_status?", "account_type?", "posture?", "limit?", "offset?"]
    output: ParticipantAccount[]
    side_effects: []

  - method: POST
    path: "/participant-accounts/{id}/investment-elections"
    description: "Participant fund change. Optimistically concurrent against the account version, because a posting, correction or earnings credit between read and write changes the money the allocation applies to. Permitted while posture is RESTRICTED so a participant is never trapped in a fund by a pending excess case."
    roles: [Participant, ProgramAdministrator]
    code: 201
    input: [allocations, expected_account_version]
    output: InvestmentElection
    side_effects:
      - "the prior ACTIVE election becomes SUPERSEDED with superseded_at set, which is the signal calculations.excess_nia_attribution uses to pick DAILY_PRORATA"
      - "the new election becomes ACTIVE with source PARTICIPANT_ELECTED; ParticipantAccount.active_election_id updated"
      - "fund_balances re-split by calculations.fund_allocation_split"
      - "increments ParticipantAccount.version by 1"
      - "ERR_STALE_ACCOUNT_VERSION (412) when expected_account_version does not match"
      - "ERR_FUND_NOT_AVAILABLE / ERR_ALLOCATION_TOTAL_INVALID on a bad allocation set"

  - method: GET
    path: "/participant-accounts/{id}/investment-elections"
    description: "Election history for one account, including SYSTEM_DEFAULT and SUPERSEDED rows. Reverse-reachability GET for InvestmentElection.account_id."
    roles: [ProgramAdministrator, ComplianceOfficer, Recordkeeper, Participant]
    code: 200
    input: ["status?", "source?", "limit?", "offset?"]
    output: InvestmentElection[]
    side_effects: []

  - method: POST
    path: "/participant-accounts/{id}/earnings-postings"
    description: "Recordkeeper credits investment earnings (or a negative loss) to an account. This is the only way a balance grows without a contribution, which is what makes net-income-attributable arithmetic non-trivial."
    roles: [Recordkeeper]
    code: 200
    input: [earnings_cents, posting_date]
    output: ParticipantAccount
    side_effects:
      - "balance_cents adjusted by earnings_cents; contribution_basis_cents unchanged"
      - "fund_balances re-split by calculations.fund_allocation_split"
      - "increments ParticipantAccount.version by 1"
      - "ERR_ACCOUNT_CLOSED on a closed account"

  - method: POST
    path: "/participant-accounts/{id}/closure-requests"
    description: "Requests account closure with a residual-disposition instruction. Refused while posture is RESTRICTED or LOCKED, so an in-flight transfer or an unresolved excess case must be settled first."
    roles: [Participant, ProgramAdministrator]
    code: 200
    input: [closure_reason, residual_disposition]
    output: ParticipantAccount
    side_effects:
      - "account_status OPEN -> CLOSURE_PENDING; closure_reason and residual_disposition recorded"
      - "posture re-derived to LOCKED"
      - "increments ParticipantAccount.version by 1"
      - "ERR_ACCOUNT_RESTRICTED when posture is RESTRICTED; ERR_ACCOUNT_CLOSED when already CLOSED"

  - method: POST
    path: "/participant-accounts/{id}/closure-completion"
    description: "Recordkeeper finalizes closure. Only possible once the balance is exactly zero and no correction case is still live."
    roles: [Recordkeeper]
    code: 200
    input: ["completion_note?"]
    output: ParticipantAccount
    side_effects:
      - "account_status CLOSURE_PENDING -> CLOSED; closed_at set"
      - "the ACTIVE InvestmentElection becomes SUPERSEDED and active_election_id is cleared"
      - "increments ParticipantAccount.version by 1"
      - "ERR_RESIDUAL_BALANCE_PRESENT when balance_cents != 0"

  - method: GET
    path: "/participant-accounts/{id}/excess-contribution-cases"
    description: "Excess-contribution cases for one account, including cascade-created DETECTED cases that no creation response returned. Reverse-reachability GET for ExcessContributionCase.account_id."
    roles: [ProgramAdministrator, ComplianceOfficer, Recordkeeper, Participant]
    code: 200
    input: ["status?", "calendar_year?", "limit?", "offset?"]
    output: ExcessContributionCase[]
    side_effects: []

  # ---- payroll remittance ---------------------------------------------------
  - method: POST
    path: "/employers/{id}/payroll-remittances"
    description: "Opens a draft remittance batch for one pay period. Pay-period intervals are closed on both ends and may not overlap another live batch of the same employer."
    roles: [Employer]
    code: 201
    input: [pay_period_start, pay_period_end, pay_date, total_deducted_cents]
    output: PayrollRemittance
    side_effects:
      - "status := DRAFT"
      - "ERR_PAY_PERIOD_OVERLAP when the closed interval intersects another non-REVERSED batch"
      - "ERR_EMPLOYER_NOT_REGISTERED when the employer is not REGISTERED"

  - method: GET
    path: "/payroll-remittances/{id}"
    description: "Reads one remittance batch with its reconciliation totals and lateness."
    roles: [ProgramAdministrator, ComplianceOfficer, Recordkeeper, Employer]
    code: 200
    input: []
    output: PayrollRemittance
    side_effects: []

  - method: GET
    path: "/payroll-remittances"
    description: "Filtered remittance list. Reverse-reachability GET for PayrollRemittance.employer_id."
    roles: [ProgramAdministrator, ComplianceOfficer, Recordkeeper, Employer]
    code: 200
    input: ["employer_id?", "status?", "limit?", "offset?"]
    output: PayrollRemittance[]
    side_effects: []

  - method: POST
    path: "/payroll-remittances/{id}/remittance-lines"
    description: "Adds a per-employee deduction line. The employer must have withheld exactly the program-computed amount for that enrollment's current rate."
    roles: [Employer]
    code: 201
    input: [enrollment_id, gross_wages_cents, deducted_cents]
    output: RemittanceLine
    side_effects:
      - "expected_deduction_cents := round_half_up(gross_wages_cents * Enrollment.contribution_rate_bp / 10000)"
      - "status := PENDING; parent line_count incremented"
      - "ERR_DEDUCTION_AMOUNT_MISMATCH when deducted_cents != expected_deduction_cents"
      - "ERR_ENROLLMENT_NOT_DEDUCTIBLE when the enrollment belongs to another employer or is OPTED_OUT/TERMINATED"

  - method: GET
    path: "/payroll-remittances/{id}/remittance-lines"
    description: "Lines of one batch with their allocation and excess figures. Reverse-reachability GET for RemittanceLine.remittance_id."
    roles: [ProgramAdministrator, ComplianceOfficer, Recordkeeper, Employer]
    code: 200
    input: ["status?", "limit?", "offset?"]
    output: RemittanceLine[]
    side_effects: []

  - method: POST
    path: "/payroll-remittances/{id}/submit"
    description: "Submits the batch to the program. Freezes days_late and updates the employer's unremitted total and delinquency, which is what feeds the graduated penalty variant."
    roles: [Employer]
    code: 200
    input: ["submission_note?"]
    output: PayrollRemittance
    side_effects:
      - "status DRAFT or REJECTED -> SUBMITTED; submitted_at set; rejection_reason cleared"
      - "days_late := max(0, clock date - (pay_date + ProgramYear.remittance_due_days))"
      - "Employer.unremitted_deduction_cents and compliance_status recomputed"
      - "ERR_REMITTANCE_TOTAL_MISMATCH when the lines do not reconcile to total_deducted_cents"

  - method: POST
    path: "/payroll-remittances/{id}/post"
    description: "Recordkeeper posts the batch: money lands in accounts, year-to-date contributions move, excesses are detected and correction cases open. The deepest money cascade in the domain."
    roles: [Recordkeeper]
    code: 200
    input: [posting_reference]
    output: PayrollRemittance
    side_effects:
      - "status SUBMITTED -> POSTED; posted_at and posting_reference set"
      - "every PENDING line -> POSTED with allocated_cents := deducted_cents and excess_cents from calculations.participant_contribution_headroom"
      - "each affected ParticipantAccount balance_cents, contribution_basis_cents and ytd_contribution_cents increased; remaining_headroom_cents and fund_balances recomputed"
      - "Enrollment.first_contribution_date and lifetime_deducted_cents updated"
      - "an ExcessContributionCase (status DETECTED) opened per account that crossed the annual ceiling, capturing opening_fmv_cents, period_contributions_cents, computation_period_start and deadline_date"
      - "affected accounts' posture re-derived to RESTRICTED"
      - "Employer.unremitted_deduction_cents and compliance_status recomputed"
      - "increments ParticipantAccount.version by 1 per affected account"

  - method: POST
    path: "/payroll-remittances/{id}/reject"
    description: "Program rejects a submitted batch back to the employer for repair. Lines are preserved so the employer can amend and resubmit."
    roles: [Recordkeeper, ProgramAdministrator]
    code: 200
    input: [rejection_reason]
    output: PayrollRemittance
    side_effects:
      - "status SUBMITTED -> REJECTED; rejection_reason set; lines remain PENDING"

  - method: POST
    path: "/payroll-remittances/{id}/reverse"
    description: "Compensating reversal of a posted batch. Every money and counter effect of the posting is undone exactly, and any excess case the posting created is voided."
    roles: [Recordkeeper]
    code: 200
    input: [reversal_reason]
    output: PayrollRemittance
    side_effects:
      - "status POSTED -> REVERSED; reversed_at and reversal_reason set"
      - "every POSTED line -> REVERSED with allocated_cents and excess_cents zeroed; total_allocated_cents and total_excess_cents recomputed to 0"
      - "each account's balance_cents, contribution_basis_cents and ytd_contribution_cents decremented by exactly the posted amounts; remaining_headroom_cents and fund_balances recomputed"
      - "ExcessContributionCase rows opened by this batch -> VOIDED; posture re-derived"
      - "the batch's pay period is freed for a replacement batch"
      - "increments ParticipantAccount.version by 1 per affected account"

  # ---- excess contribution correction --------------------------------------
  - method: GET
    path: "/excess-contribution-cases/{id}"
    description: "Reads one excess case with both net-income-attributable variants, the applied method and the correction trail."
    roles: [ProgramAdministrator, ComplianceOfficer, Recordkeeper, Participant]
    code: 200
    input: []
    output: ExcessContributionCase
    side_effects: []

  - method: POST
    path: "/excess-contribution-cases/{id}/method-election"
    description: "Participant elects how the excess will be corrected. Structurally unavailable to the Employer role."
    roles: [Participant, ProgramAdministrator]
    code: 200
    input: [correction_method]
    output: ExcessContributionCase
    side_effects:
      - "status DETECTED -> METHOD_ELECTED; correction_method recorded"
      - "ERR_CORRECTION_DEADLINE_PASSED after deadline_date"
      - "ERR_FIDUCIARY_BOUNDARY_VIOLATION when attempted by an Employer principal"

  - method: POST
    path: "/excess-contribution-cases/{id}/completion"
    description: "Recordkeeper executes the elected correction. Both NIA variants are computed and stored; the applied one is pinned by the presence of a mid-period fund change."
    roles: [Recordkeeper]
    code: 200
    input: [settlement_reference]
    output: ExcessContributionCase
    side_effects:
      - "status METHOD_ELECTED -> COMPLETED; closing_fmv_cents, nia_adjusted_balance_cents, nia_daily_prorata_cents, nia_method_applied, applied_nia_cents and corrected_amount_cents set"
      - "REFUND_TO_PARTICIPANT: account balance_cents and contribution_basis_cents debited by corrected_amount_cents; ytd_contribution_cents reduced by detected_excess_cents"
      - "RECHARACTERIZE_TO_TRADITIONAL: a TRADITIONAL_IRA ParticipantAccount is created with rolled_over_from_account_id pointing at the Roth account and credited corrected_amount_cents; the Roth account is debited the same amount"
      - "CARRY_FORWARD: balance untouched; ytd_contribution_cents reduced by detected_excess_cents"
      - "fund_balances re-split; posture re-derived; remaining_headroom_cents recomputed"
      - "increments ParticipantAccount.version by 1"
      - "ERR_INSUFFICIENT_ACCOUNT_BALANCE (402) when a refund exceeds the balance"

  # ---- enforcement ----------------------------------------------------------
  - method: POST
    path: "/employers/{id}/penalty-assessments"
    description: "Assesses a noncompliance penalty. Both the statutory per-employee figure and the graduated shortfall figure are computed and stored; violation_type pins which one (or their max) is owed."
    roles: [ComplianceOfficer]
    code: 201
    input: [violation_type, notice_date, "cure_days?"]
    output: PenaltyAssessment
    side_effects:
      - "statutory_amount_cents, graduated_amount_cents, assessed_cents, shortfall_basis_cents, months_late, employee_count_at_assessment and cure_deadline computed by calculations.employer_penalty_amount"
      - "status := ASSESSED; origin := MANUAL; assessed_by_user_id := X-User-ID"
      - "Employer.compliance_status -> PENALIZED"
      - "increments Employer.version by 1"

  - method: GET
    path: "/penalty-assessments/{id}"
    description: "Reads one assessment with both variant amounts and the disposition trail."
    roles: [ProgramAdministrator, ComplianceOfficer, Employer]
    code: 200
    input: []
    output: PenaltyAssessment
    side_effects: []

  - method: POST
    path: "/penalty-assessments/{id}/disposition"
    description: "Abates or affirms an assessment. Segregation of duties: the assessing officer may not dispose of their own assessment. Abating an affirmed assessment withdraws any referral it produced."
    roles: [ComplianceOfficer]
    code: 200
    input: [disposition, "disposition_note?"]
    output: PenaltyAssessment
    side_effects:
      - "status ASSESSED -> AFFIRMED or ABATED, or AFFIRMED -> ABATED; disposed_by_user_id and disposition_note set"
      - "on ABATE: every OPEN EnforcementReferral of this assessment -> WITHDRAWN with withdrawn_reason set"
      - "Employer.compliance_status re-derived by calculations.employer_compliance_status_and_unremitted"
      - "increments Employer.version by 1"
      - "ERR_SELF_DISPOSITION_FORBIDDEN when X-User-ID == assessed_by_user_id"
      - "ERR_CURE_PERIOD_ACTIVE when AFFIRM is attempted on or before cure_deadline"

  - method: POST
    path: "/penalty-assessments/{id}/enforcement-referrals"
    description: "Refers an affirmed assessment to an outside agency. The referral snapshots the employer EIN and puts the employer under an enforcement hold."
    roles: [ComplianceOfficer]
    code: 201
    input: [agency, referral_basis]
    output: EnforcementReferral
    side_effects:
      - "status := OPEN; referred_at, referred_by_user_id and employer_ein_snapshot set"
      - "Employer.compliance_status -> REFERRED"
      - "the employer can no longer file exemption certifications or restate headcount (ERR_ENFORCEMENT_HOLD)"
      - "increments Employer.version by 1"
      - "ERR_PENALTY_STATE_INVALID unless the assessment is AFFIRMED"

  - method: GET
    path: "/penalty-assessments/{id}/enforcement-referrals"
    description: "Referrals raised from one assessment, including cascade-created ones. Reverse-reachability GET for EnforcementReferral.penalty_id."
    roles: [ProgramAdministrator, ComplianceOfficer, Employer]
    code: 200
    input: ["status?", "agency?", "limit?", "offset?"]
    output: EnforcementReferral[]
    side_effects: []

  # ---- portability ----------------------------------------------------------
  - method: POST
    path: "/portability-transfers"
    description: "Requests a portability movement out of one of the participant's accounts, to an external IRA or to another program account. All five money figures are pinned at request time against pre-debit source values."
    roles: [Participant, ProgramAdministrator]
    code: 201
    input: [participant_id, source_account_id, destination_type, transfer_kind, amount_cents, "destination_account_id?", "external_institution_name?"]
    output: PortabilityTransfer
    side_effects:
      - "fee_cents, basis_portion_cents, taxable_cents, withholding_cents and net_cents computed by calculations.portability_settlement_math"
      - "status := REQUESTED; in_transit_cents := amount_cents; requested_on and settle_by_date set"
      - "source account balance_cents debited by amount_cents and contribution_basis_cents by basis_portion_cents; fund_balances re-split"
      - "source account posture re-derived to RESTRICTED"
      - "increments ParticipantAccount.version by 1"
      - "ERR_ACCOUNT_CLOSED / ERR_ACCOUNT_RESTRICTED / ERR_ROLLOVER_FREQUENCY_LIMIT / ERR_INSUFFICIENT_ACCOUNT_BALANCE per §1.4 priority order"

  - method: GET
    path: "/portability-transfers/{id}"
    description: "Reads one transfer with its full settlement arithmetic."
    roles: [ProgramAdministrator, ComplianceOfficer, Recordkeeper, Participant]
    code: 200
    input: []
    output: PortabilityTransfer
    side_effects: []

  - method: GET
    path: "/portability-transfers"
    description: "Filtered transfer list. Reverse-reachability GET for PortabilityTransfer.participant_id, source_account_id and destination_account_id."
    roles: [ProgramAdministrator, ComplianceOfficer, Recordkeeper, Participant]
    code: 200
    input: ["participant_id?", "source_account_id?", "destination_account_id?", "transfer_kind?", "status?", "limit?", "offset?"]
    output: PortabilityTransfer[]
    side_effects: []

  - method: POST
    path: "/portability-transfers/{id}/settle"
    description: "Recordkeeper settles the transfer. A program-account destination is credited net_cents and stamped with rolled_over_from_account_id; an external destination takes the money out of the program."
    roles: [Recordkeeper]
    code: 200
    input: [settled_on, settlement_reference]
    output: PortabilityTransfer
    side_effects:
      - "status REQUESTED -> SETTLED; in_transit_cents := 0; settled_on and settlement_reference set"
      - "destination_type PROGRAM_ACCOUNT: destination balance_cents += net_cents, contribution_basis_cents += basis_portion_cents, rolled_over_from_account_id := source_account_id, fund_balances re-split"
      - "is_taxable_distribution := true for INDIRECT_60_DAY"
      - "source account posture re-derived"
      - "increments ParticipantAccount.version by 1 per touched account"
      - "ERR_ROLLOVER_WINDOW_EXPIRED when settled_on is later than settle_by_date"

  - method: POST
    path: "/portability-transfers/{id}/return"
    description: "Receiving institution returned the funds. Full compensation: the gross amount and its basis portion go back to the source account and the fee is reversed, so program cash is exactly restored."
    roles: [Recordkeeper]
    code: 200
    input: [return_reason]
    output: PortabilityTransfer
    side_effects:
      - "status REQUESTED -> RETURNED; in_transit_cents := 0; return_reason set"
      - "source account balance_cents += amount_cents and contribution_basis_cents += basis_portion_cents; fund_balances re-split"
      - "fee_cents reversed; the PROGRAM_CASH invariant is restored with zero drift"
      - "source account posture re-derived"
      - "increments ParticipantAccount.version by 1"

# =============================================================================
# 1.6 Error Code Catalog
# =============================================================================
errors:

  # --- authentication / authorization ---
  - id: ERR_UNAUTHENTICATED
    http: 401
    condition: "X-User-ID header absent or empty on any endpoint other than POST /_clock/set_current_utc"
  - id: ERR_UNAUTHORIZED
    http: 403
    condition: "the caller's X-User-Role is not in the endpoint's declared roles list"
  - id: ERR_FORBIDDEN_SCOPE
    http: 403
    condition: "an Employer or Participant principal addresses a resource that belongs to a different employer or participant"
  - id: ERR_SELF_DISPOSITION_FORBIDDEN
    http: 403
    condition: "the compliance officer disposing of a penalty assessment is the same X-User-ID that assessed it"
  - id: ERR_FIDUCIARY_BOUNDARY_VIOLATION
    http: 403
    condition: "an Employer principal attempts a participant-only decision on an enrollment it owns: a rate election or an opt-out"

  # --- existence ---
  - id: ERR_EMPLOYER_NOT_FOUND
    http: 404
    condition: "no Employer has the addressed id"
  - id: ERR_PARTICIPANT_NOT_FOUND
    http: 404
    condition: "no Participant has the addressed or referenced id"
  - id: ERR_ENROLLMENT_NOT_FOUND
    http: 404
    condition: "no Enrollment has the addressed or referenced id"
  - id: ERR_ACCOUNT_NOT_FOUND
    http: 404
    condition: "no ParticipantAccount has the addressed or referenced id"
  - id: ERR_REMITTANCE_NOT_FOUND
    http: 404
    condition: "no PayrollRemittance has the addressed id"
  - id: ERR_EXEMPTION_NOT_FOUND
    http: 404
    condition: "no ExemptionCertification has the addressed id"
  - id: ERR_EXCESS_CASE_NOT_FOUND
    http: 404
    condition: "no ExcessContributionCase has the addressed id"
  - id: ERR_PENALTY_NOT_FOUND
    http: 404
    condition: "no PenaltyAssessment has the addressed id"
  - id: ERR_TRANSFER_NOT_FOUND
    http: 404
    condition: "no PortabilityTransfer has the addressed id"
  - id: ERR_FUND_OPTION_NOT_FOUND
    http: 404
    condition: "no InvestmentOption has the addressed id"

  # --- request shape ---
  - id: ERR_INVALID_REQUEST
    http: 422
    condition: "a required body field is missing, a type or enum value is invalid, a numeric field is out of range, a date is not ISO-8601, a conditional field pairing is violated (target_year vs category, destination_account_id vs destination_type), pay_period_end < pay_period_start, pay_date < pay_period_end, attestation_accepted is false, or limit/offset are outside 1..100 / >= 0"

  # --- optimistic concurrency ---
  - id: ERR_STALE_ACCOUNT_VERSION
    http: 412
    condition: "expected_account_version on an investment election does not equal the current ParticipantAccount.version"
  - id: ERR_STALE_EMPLOYER_VERSION
    http: 412
    condition: "expected_employer_version on an employee-count recount does not equal the current Employer.version"

  # --- uniqueness / configuration ---
  - id: ERR_DUPLICATE_EIN
    http: 409
    condition: "an Employer with the supplied ein already exists"
  - id: ERR_DUPLICATE_FUND_CODE
    http: 409
    condition: "an InvestmentOption with the supplied fund_code already exists"
  - id: ERR_DUPLICATE_PROGRAM_YEAR
    http: 409
    condition: "a ProgramYear for the supplied calendar_year already exists"
  - id: ERR_PROGRAM_YEAR_NOT_CONFIGURED
    http: 409
    condition: "an operation needs the statutory parameters for the clock's calendar year and no ProgramYear exists for it"

  # --- lifecycle state ---
  - id: ERR_REGISTRATION_STATE_INVALID
    http: 409
    condition: "registration is attempted on an employer that is not PENDING_REGISTRATION, or whose wave_tier is NOT_COVERED"
  - id: ERR_EXEMPTION_STATE_INVALID
    http: 409
    condition: "a certification decision is attempted on a non-SUBMITTED certification, or a revocation on a non-APPROVED one"
  - id: ERR_ENROLLMENT_STATE_INVALID
    http: 409
    condition: "an enrollment trigger is not in the transition list for the enrollment's current status, including any trigger against a TERMINATED enrollment"
  - id: ERR_EMPLOYER_NOT_REGISTERED
    http: 409
    condition: "an enrollment, re-enrollment or remittance operation targets an employer whose registration_status is not REGISTERED"
  - id: ERR_REMITTANCE_STATE_INVALID
    http: 409
    condition: "a remittance trigger is not in the transition list for the batch's current status (adding lines to a POSTED batch, posting a DRAFT, reversing a non-POSTED batch, double-posting)"
  - id: ERR_ACCOUNT_CLOSED
    http: 409
    condition: "any write is attempted against a ParticipantAccount whose account_status is CLOSED"
  - id: ERR_ACCOUNT_RESTRICTED
    http: 409
    condition: "a portability transfer or closure request is attempted while the account's derived posture is RESTRICTED or LOCKED"
  - id: ERR_CLOSURE_STATE_INVALID
    http: 409
    condition: "closure completion is attempted on an account that is not CLOSURE_PENDING"
  - id: ERR_EXCESS_CASE_STATE_INVALID
    http: 409
    condition: "method election is attempted on a non-DETECTED case, or completion on a non-METHOD_ELECTED case"
  - id: ERR_PENALTY_STATE_INVALID
    http: 409
    condition: "disposition is attempted on an ABATED assessment, or an enforcement referral on an assessment that is not AFFIRMED"
  - id: ERR_TRANSFER_STATE_INVALID
    http: 409
    condition: "settle or return is attempted on a transfer that is not REQUESTED"

  # --- enforcement interlock ---
  - id: ERR_ENFORCEMENT_HOLD
    http: 409
    condition: "an employer with at least one OPEN EnforcementReferral attempts to file an exemption certification or restate its employee count"

  # --- referential / cross-aggregate coherence ---
  - id: ERR_FUND_NOT_AVAILABLE
    http: 409
    condition: "an investment election names a fund_code that does not exist or whose InvestmentOption.status is not OPEN"
  - id: ERR_ENROLLMENT_NOT_DEDUCTIBLE
    http: 409
    condition: "a remittance line references an enrollment of a different employer, an OPTED_OUT or TERMINATED enrollment, or one with no open account"
  - id: ERR_ACCOUNT_OWNER_MISMATCH
    http: 409
    condition: "a portability transfer's source or destination account does not belong to the named participant, or source and destination are the same account, or the destination is not OPEN"
  - id: ERR_NO_DEFAULT_FUND_AVAILABLE
    http: 409
    condition: "the auto-enrollment run finds no OPEN, default-eligible target-date option covering the participant's retirement year and no OPEN, default-eligible capital-preservation fallback"

  # --- occupancy / uniqueness / frequency ---
  - id: ERR_PAY_PERIOD_OVERLAP
    http: 409
    condition: "a new remittance's closed [pay_period_start, pay_period_end] interval intersects that of another non-REVERSED remittance of the same employer"
  - id: ERR_DUPLICATE_ENROLLMENT
    http: 409
    condition: "an enrollment already exists for this employer/participant pair with status NOTIFIED, ACTIVE or OPTED_OUT"
  - id: ERR_EXEMPTION_PERIOD_OVERLAP
    http: 409
    condition: "a new certification's half-open [coverage_period_start, coverage_period_end) interval intersects that of another SUBMITTED or APPROVED certification of the same employer"
  - id: ERR_ROLLOVER_FREQUENCY_LIMIT
    http: 409
    condition: "a second INDIRECT_60_DAY transfer is requested for the same participant inside the window [request date - 364 days, request date] of a prior settled or in-flight indirect rollover"

  # --- temporal windows ---
  - id: ERR_EXEMPTION_WINDOW_CLOSED
    http: 409
    condition: "a certification's derived coverage_period_end is on or before the current clock date"
  - id: ERR_OPT_OUT_WINDOW_CLOSED
    http: 409
    condition: "a NOTIFIED enrollment is opted out on or after its opt_out_deadline"
  - id: ERR_PERMISSIBLE_WITHDRAWAL_WINDOW_CLOSED
    http: 409
    condition: "a permissible withdrawal is requested with no first_contribution_date, or later than first_contribution_date + opt_out_window_days"
  - id: ERR_CORRECTION_DEADLINE_PASSED
    http: 409
    condition: "an excess-contribution method election or completion is attempted after the case's deadline_date"
  - id: ERR_ROLLOVER_WINDOW_EXPIRED
    http: 409
    condition: "an INDIRECT_60_DAY transfer is settled with settled_on later than settle_by_date"
  - id: ERR_CURE_PERIOD_ACTIVE
    http: 409
    condition: "a penalty assessment is affirmed on or before its cure_deadline"

  # --- arithmetic coherence ---
  - id: ERR_ALLOCATION_TOTAL_INVALID
    http: 409
    condition: "investment allocation basis points do not sum to exactly 10000, an allocation_bp is <= 0, or a fund_code is repeated"
  - id: ERR_DEDUCTION_AMOUNT_MISMATCH
    http: 409
    condition: "a remittance line's deducted_cents differs from round_half_up(gross_wages_cents * Enrollment.contribution_rate_bp / 10000)"
  - id: ERR_REMITTANCE_TOTAL_MISMATCH
    http: 409
    condition: "at submit, the sum of child line deducted_cents differs from total_deducted_cents, or the batch has no lines"
  - id: ERR_RATE_OUT_OF_BOUNDS
    http: 409
    condition: "a participant-elected contribution_rate_bp is below 100 or above 1500"

  # --- fiscal sufficiency ---
  - id: ERR_INSUFFICIENT_ACCOUNT_BALANCE
    http: 402
    condition: "a portability transfer amount, or a REFUND_TO_PARTICIPANT corrected amount, exceeds the account's balance_cents"
  - id: ERR_RESIDUAL_BALANCE_PRESENT
    http: 409
    condition: "closure completion is attempted while the account still holds a non-zero balance_cents"

# =============================================================================
# 1.7 RBAC Matrix
# =============================================================================
roles:

  - name: ProgramAdministrator
    description: "State program staff who configure statutory parameters and the fund menu, run the batch jobs, and act on a participant's behalf in the service centre. The only role that can decide an exemption certification."
    identity: "opaque"
    exclusive_operations:
      - "POST /program-years"
      - "POST /investment-options"
      - "POST /participants"
      - "POST /exemption-certifications/{id}/decision"
      - "POST /_clock/set_current_utc"
      - "POST /_ops/auto-enrollment-run"
      - "POST /_ops/annual-escalation-run"
      - "GET /participants"
    shared_operations:
      - "POST /employers (with Employer)"
      - "POST /employers/{id}/employee-count-recounts (with Employer)"
      - "POST /employers/{id}/exemption-certifications (with Employer)"
      - "POST /employers/{id}/enrollments (with Employer)"
      - "POST /enrollments/{id}/opt-out, /reenroll, /rate-election (with Participant, on the participant's behalf)"
      - "POST /participant-accounts/{id}/investment-elections and /closure-requests (with Participant)"
      - "POST /excess-contribution-cases/{id}/method-election (with Participant)"
      - "POST /portability-transfers (with Participant)"
      - "POST /payroll-remittances/{id}/reject (with Recordkeeper)"
      - "POST /_ops/compliance-sweep (with ComplianceOfficer)"
      - "PATCH /participants/{id} (with Participant)"
      - "all GET read endpoints"

  - name: ComplianceOfficer
    description: "Enforcement staff who revoke exemptions, assess and dispose of penalties, and refer matters to outside agencies. Bound by segregation of duties: an officer may never dispose of an assessment they raised."
    identity: "opaque"
    exclusive_operations:
      - "POST /exemption-certifications/{id}/revoke"
      - "POST /employers/{id}/penalty-assessments"
      - "POST /penalty-assessments/{id}/disposition"
      - "POST /penalty-assessments/{id}/enforcement-referrals"
    shared_operations:
      - "POST /_ops/compliance-sweep (with ProgramAdministrator)"
      - "GET /participants"
      - "all GET read endpoints"

  - name: Recordkeeper
    description: "The program's financial recordkeeper: the only role that moves money. Posts and reverses remittance batches, credits earnings, executes excess corrections, settles or returns portability transfers, and finalizes account closures."
    identity: "opaque"
    exclusive_operations:
      - "POST /payroll-remittances/{id}/post"
      - "POST /payroll-remittances/{id}/reverse"
      - "POST /participant-accounts/{id}/earnings-postings"
      - "POST /participant-accounts/{id}/closure-completion"
      - "POST /excess-contribution-cases/{id}/completion"
      - "POST /portability-transfers/{id}/settle"
      - "POST /portability-transfers/{id}/return"
    shared_operations:
      - "POST /payroll-remittances/{id}/reject (with ProgramAdministrator)"
      - "all GET read endpoints except GET /participants"

  - name: Employer
    description: "The mandated employer. Its role is strictly ministerial: register, acknowledge non-fiduciary status, restate headcount, claim a qualified-plan exemption, enroll employees at the program default, remit exactly what the program computed, and report separations. It can never choose a rate, a fund, an opt-out or a correction method."
    identity: "entity_backed:Employer"
    exclusive_operations:
      - "POST /employers/{id}/registration"
      - "POST /employers/{id}/payroll-remittances"
      - "POST /payroll-remittances/{id}/remittance-lines"
      - "POST /payroll-remittances/{id}/submit"
      - "PATCH /enrollments/{id}/employment"
    shared_operations:
      - "POST /employers (with ProgramAdministrator)"
      - "POST /employers/{id}/employee-count-recounts (with ProgramAdministrator)"
      - "POST /employers/{id}/exemption-certifications (with ProgramAdministrator)"
      - "POST /employers/{id}/enrollments (with ProgramAdministrator)"
      - "GET on its own employer subtree: /employers/{id}, /employers/{id}/exemption-certifications, /employers/{id}/penalty-assessments, /enrollments, /enrollments/{id}, /enrollments/{id}/remittance-lines, /payroll-remittances, /payroll-remittances/{id}, /payroll-remittances/{id}/remittance-lines, /penalty-assessments/{id}, /penalty-assessments/{id}/enforcement-referrals, /program-years, /investment-options"
    forbidden_operations:
      - "POST /enrollments/{id}/rate-election -> ERR_FIDUCIARY_BOUNDARY_VIOLATION"
      - "POST /enrollments/{id}/opt-out -> ERR_FIDUCIARY_BOUNDARY_VIOLATION"
      - "POST /participant-accounts/{id}/investment-elections -> ERR_UNAUTHORIZED (the Employer role is not on the route at all)"
      - "POST /excess-contribution-cases/{id}/method-election -> ERR_UNAUTHORIZED (the Employer role is not on the route at all)"
      - "any GET on ParticipantAccount, ExcessContributionCase or PortabilityTransfer -> ERR_UNAUTHORIZED (balances are none of the employer's business)"

  - name: Participant
    description: "The saver. Owns every decision about their own money: deferral rate, escalation preference, opt-out and permissible withdrawal, fund allocation, excess correction method, portability and account closure."
    identity: "entity_backed:Participant"
    exclusive_operations: []
    shared_operations:
      - "PATCH /participants/{id} (with ProgramAdministrator)"
      - "POST /enrollments/{id}/opt-out (with ProgramAdministrator)"
      - "POST /enrollments/{id}/reenroll (with ProgramAdministrator)"
      - "POST /enrollments/{id}/rate-election (with ProgramAdministrator)"
      - "POST /participant-accounts/{id}/investment-elections (with ProgramAdministrator)"
      - "POST /participant-accounts/{id}/closure-requests (with ProgramAdministrator)"
      - "POST /excess-contribution-cases/{id}/method-election (with ProgramAdministrator)"
      - "POST /portability-transfers (with ProgramAdministrator)"
      - "GET on its own subtree: /participants/{id}, /enrollments, /enrollments/{id}, /enrollments/{id}/remittance-lines, /participant-accounts, /participant-accounts/{id} and its sub-resources, /excess-contribution-cases/{id}, /portability-transfers, /portability-transfers/{id}, /program-years, /investment-options, /investment-options/{id}"
    forbidden_operations:
      - "every enforcement operation (assessment, disposition, referral, revocation) -> ERR_UNAUTHORIZED"
      - "every money-moving Recordkeeper operation (post, reverse, earnings posting, correction completion, transfer settle/return, closure completion) -> ERR_UNAUTHORIZED"
      - "any read or write on another participant's resources -> ERR_FORBIDDEN_SCOPE"
