  # ------------------------------------------- Cross-cutting complexity layers
  - section: cross_cutting_complexity_layers
    instances:
      - name: occ_run_create_stale_book_version_rejected
        claim_type: optimistic_concurrency
        grounds: ["concurrency_rules[run-create-stale-book]", "errors[ERR_STALE_VERSION]"]
        distinguishing_aspect: "Run creation with expected_book_version captured before a position PATCH (which bumped the book version) fails 412 ERR_STALE_VERSION; re-reading the book and resubmitting succeeds."
        test_recipe:
          setup: ["Book1 ACTIVE; sets approved; scenario UP200; book version captured as bv BEFORE a position patch"]
          setup_api_calls:
            - { call: "POST /books", payload: { name: "Book A", base_curve_rate_bps: 400 }, as: TreasuryAnalyst, captures: { b: $.data.id } }
            - { call: "POST /books/${b}/positions", payload: { category: LOAN, balance_cents: 100000000, rate_bps: 600, scheduled_runoff_pct: 20.0, is_prepayment_eligible: true, duration_years: 3.0 }, as: TreasuryAnalyst, captures: { l1: $.data.id } }
            - { call: "POST /books/${b}/positions", payload: { category: DEPOSIT, deposit_segment: RETAIL_NONMATURITY, balance_cents: 80000000, rate_bps: 50, scheduled_runoff_pct: 0.0, duration_years: 0.5 }, as: TreasuryAnalyst }
            - { call: "POST /books/${b}/activate", payload: {}, as: TreasuryAnalyst }
            - { call: "POST /books/${b}/assumption-sets", payload: { domain: PREPAYMENT, params: { base_cpr_pct: 10.0, prepay_sensitivity_per_100bps: 2.0 } }, as: TreasuryAnalyst, as_user_id: an-1, captures: { ps: $.data.id } }
            - { call: "POST /assumption-sets/${ps}/submit", payload: {}, as: TreasuryAnalyst, as_user_id: an-1 }
            - { call: "POST /assumption-sets/${ps}/approve", payload: {}, as: ALCOChair, as_user_id: ch-1 }
            - { call: "POST /books/${b}/assumption-sets", payload: { domain: DEPOSIT_DECAY, params: { base_annual_decay_pct: 5.0, surge_decay_per_100bps: 1.0 } }, as: TreasuryAnalyst, as_user_id: an-1, captures: { ds: $.data.id } }
            - { call: "POST /assumption-sets/${ds}/submit", payload: {}, as: TreasuryAnalyst, as_user_id: an-1 }
            - { call: "POST /assumption-sets/${ds}/approve", payload: {}, as: ALCOChair, as_user_id: ch-1 }
            - { call: "POST /books/${b}/assumption-sets", payload: { domain: DEPOSIT_BETA, params: { up_beta_pct: 40.0, down_beta_pct: 20.0, lag_months: 6 } }, as: TreasuryAnalyst, as_user_id: an-1, captures: { bs: $.data.id } }
            - { call: "POST /assumption-sets/${bs}/submit", payload: {}, as: TreasuryAnalyst, as_user_id: an-1 }
            - { call: "POST /assumption-sets/${bs}/approve", payload: {}, as: ALCOChair, as_user_id: ch-1 }
            - { call: "POST /books/${b}/scenarios", payload: { name: "UP200", kind: PARALLEL_SHOCK, shock_bps: 200 }, as: TreasuryAnalyst, captures: { sc: $.data.id } }
            - { call: "GET /books/${b}", payload: {}, as: TreasuryAnalyst, captures: { bv: $.data.version } }
            - { call: "PATCH /positions/${l1}", payload: { expected_book_version: "${bv}", rate_bps: 610 }, as: TreasuryAnalyst }
          trigger:
            - call: "POST /books/${b}/simulation-runs"
              payload: { scenario_id: "${sc}", prepayment_set_id: "${ps}", decay_set_id: "${ds}", beta_set_id: "${bs}", balance_sheet_convention: STATIC, expected_book_version: "${bv}" }
              as: TreasuryAnalyst
              captures: { err: $.data.error_id }
            - { call: "GET /books/${b}", payload: {}, as: TreasuryAnalyst, captures: { bv2: $.data.version } }
            - { call: "POST /books/${b}/simulation-runs", payload: { scenario_id: "${sc}", prepayment_set_id: "${ps}", decay_set_id: "${ds}", beta_set_id: "${bs}", balance_sheet_convention: STATIC, expected_book_version: "${bv2}" }, as: TreasuryAnalyst, captures: { run: $.data.id } }
          assert:
            - "err == ERR_STALE_VERSION"
            - "SimulationRun.${run}.status == COMPLETED"
            - "SimulationRun.${run}.book_version_pinned == ${bv2}"

      - name: occ_position_patch_stale_book_version_rejected
        claim_type: optimistic_concurrency
        grounds: ["concurrency_rules[position-patch-stale-book]", "errors[ERR_STALE_VERSION]"]
        distinguishing_aspect: "A second PATCH carrying the version observed before the first PATCH fails 412; the first PATCH incremented both the position and book versions."
        test_recipe:
          setup: ["Book1 ACTIVE with L1; book version captured as bv"]
          setup_api_calls:
            - { call: "POST /books", payload: { name: "Book A", base_curve_rate_bps: 400 }, as: TreasuryAnalyst, captures: { b: $.data.id } }
            - { call: "POST /books/${b}/positions", payload: { category: LOAN, balance_cents: 100000000, rate_bps: 600, scheduled_runoff_pct: 20.0, duration_years: 3.0 }, as: TreasuryAnalyst, captures: { l1: $.data.id } }
            - { call: "POST /books/${b}/positions", payload: { category: DEPOSIT, deposit_segment: RETAIL_NONMATURITY, balance_cents: 80000000, rate_bps: 50, scheduled_runoff_pct: 0.0, duration_years: 0.5 }, as: TreasuryAnalyst }
            - { call: "POST /books/${b}/activate", payload: {}, as: TreasuryAnalyst }
            - { call: "GET /books/${b}", payload: {}, as: TreasuryAnalyst, captures: { bv: $.data.version } }
          trigger:
            - { call: "PATCH /positions/${l1}", payload: { expected_book_version: "${bv}", rate_bps: 610 }, as: TreasuryAnalyst }
            - call: "PATCH /positions/${l1}"
              payload: { expected_book_version: "${bv}", rate_bps: 620 }
              as: TreasuryAnalyst
              captures: { err: $.data.error_id }
          assert:
            - "err == ERR_STALE_VERSION"
            - "Position.${l1}.rate_bps == 610"

      - name: effectiveness_test_uses_pinned_method
        claim_type: version_pinning_on_approval
        grounds: [entities.HedgeRelationship.fields.effectiveness_method, calculations.hedge_effectiveness_result]
        distinguishing_aspect: "The method pinned at designation governs: on a DOLLAR_OFFSET hedge, payload regression fields (slope 9.99, r_squared 0.01, sample_count 1 — all failing values) are ignored and offset ratio 1.0000 PASSes; the method snapshot on the test reads DOLLAR_OFFSET."
        test_recipe:
          setup: ["Book1 ACTIVE; H1 ACTIVE DOLLAR_OFFSET [2026-08,2027-08) on L1"]
          setup_api_calls:
            - { call: "POST /books", payload: { name: "Book A", base_curve_rate_bps: 400, min_hedged_notional_cents: 0 }, as: TreasuryAnalyst, captures: { b: $.data.id } }
            - { call: "POST /books/${b}/positions", payload: { category: LOAN, balance_cents: 100000000, rate_bps: 600, scheduled_runoff_pct: 20.0, duration_years: 3.0 }, as: TreasuryAnalyst, captures: { l1: $.data.id } }
            - { call: "POST /books/${b}/positions", payload: { category: DEPOSIT, deposit_segment: RETAIL_NONMATURITY, balance_cents: 80000000, rate_bps: 50, scheduled_runoff_pct: 0.0, duration_years: 0.5 }, as: TreasuryAnalyst }
            - { call: "POST /books/${b}/activate", payload: {}, as: TreasuryAnalyst }
            - { call: "POST /books/${b}/hedges", payload: { position_id: "${l1}", instrument: PAYER_SWAP, designation_type: FAIR_VALUE, notional_cents: 60000000, fixed_rate_bps: 350 }, as: TreasuryAnalyst, captures: { h: $.data.id } }
            - { call: "POST /hedges/${h}/designate", payload: { start_month: "2026-08", end_month: "2027-08", effectiveness_method: DOLLAR_OFFSET }, as: ALCOChair, as_user_id: ch-1 }
            - { call: "POST /hedges/${h}/activate", payload: {}, as: ALCOChair, as_user_id: ch-1 }
          trigger:
            - { call: "POST /hedges/${h}/effectiveness-tests", payload: { test_month: "2026-08", hedge_value_change_cents: 5000000, hedged_item_value_change_cents: -5000000, slope: 9.99, r_squared: 0.01, sample_count: 1 }, as: ModelRiskValidator, captures: { t: $.data.id } }
          assert:
            - "HedgeEffectivenessTest.${t}.method == DOLLAR_OFFSET"
            - "HedgeEffectivenessTest.${t}.offset_ratio == 1.0000"
            - "HedgeEffectivenessTest.${t}.result == PASS"
            - "HedgeRelationship.${h}.status == ACTIVE"

      - name: cascade_coverage_by_difficulty
        claim_type: cascading_side_effects
        grounds: [state_machines.HedgeRelationship.ACTIVE_to_DEDESIGNATED, state_machines.AlcoReport.SUBMITTED_to_DRAFT]
        excluded_because:
          difficulty_instance: effectiveness_fail_cascades_to_coverage_breach
          rationale: "Both cascade chains (depth 3 and depth 2) are asserted end-to-end by §1.8 instances effectiveness_fail_cascades_to_coverage_breach and breach_creation_reverts_submitted_report."

      - name: dual_variant_coverage_by_difficulty
        claim_type: dual_variant_calculation
        grounds: [calculations.nii_projection, calculations.hedge_effectiveness_result]
        excluded_because:
          difficulty_instance: nii_static_vs_dynamic_same_book_diverge
          rationale: "Both variants of both dual-variant calculations are asserted by §1.8 instances nii_static_vs_dynamic_same_book_diverge and hedge_effectiveness_method_divergence."

  # ---------------------------------------------------------- Consistency model
  - section: consistency_model
    instances:
      - name: run_response_computes_inline_immediate
        claim_type: immediate_consistency
        grounds: [complexity_profile.consistency_model, "endpoints[POST /books/{id}/simulation-runs]"]
        distinguishing_aspect: "The 201 response of run creation already contains every computed field (nii_base_cents 5,250,000; nii_scenario_cents 5,010,000; nii_delta_pct -4.57; eve_base_cents 30,000,000; eve_scenario_cents 22,400,000; eve_delta_pct -25.33; breach_summary) — no re-read or asynchronous reconciliation is needed."
        test_recipe:
          setup: ["Book1 ACTIVE; sets approved; EVE limit 12.0; scenario UP200"]
          setup_api_calls:
            - { call: "POST /books", payload: { name: "Book A", base_curve_rate_bps: 400, min_hedged_notional_cents: 0 }, as: TreasuryAnalyst, captures: { b: $.data.id } }
            - { call: "POST /books/${b}/positions", payload: { category: LOAN, balance_cents: 100000000, rate_bps: 600, scheduled_runoff_pct: 20.0, is_prepayment_eligible: true, duration_years: 3.0 }, as: TreasuryAnalyst }
            - { call: "POST /books/${b}/positions", payload: { category: SECURITY, balance_cents: 50000000, rate_bps: 400, scheduled_runoff_pct: 0.0, duration_years: 4.0 }, as: TreasuryAnalyst }
            - { call: "POST /books/${b}/positions", payload: { category: DEPOSIT, deposit_segment: RETAIL_NONMATURITY, balance_cents: 80000000, rate_bps: 50, scheduled_runoff_pct: 0.0, duration_years: 0.5 }, as: TreasuryAnalyst }
            - { call: "POST /books/${b}/positions", payload: { category: BORROWING, balance_cents: 40000000, rate_bps: 450, scheduled_runoff_pct: 25.0, duration_years: 2.0 }, as: TreasuryAnalyst }
            - { call: "POST /books/${b}/activate", payload: {}, as: TreasuryAnalyst }
            - { call: "POST /books/${b}/assumption-sets", payload: { domain: PREPAYMENT, params: { base_cpr_pct: 10.0, prepay_sensitivity_per_100bps: 2.0 } }, as: TreasuryAnalyst, as_user_id: an-1, captures: { ps: $.data.id } }
            - { call: "POST /assumption-sets/${ps}/submit", payload: {}, as: TreasuryAnalyst, as_user_id: an-1 }
            - { call: "POST /assumption-sets/${ps}/approve", payload: {}, as: ALCOChair, as_user_id: ch-1 }
            - { call: "POST /books/${b}/assumption-sets", payload: { domain: DEPOSIT_DECAY, params: { base_annual_decay_pct: 5.0, surge_decay_per_100bps: 1.0 } }, as: TreasuryAnalyst, as_user_id: an-1, captures: { ds: $.data.id } }
            - { call: "POST /assumption-sets/${ds}/submit", payload: {}, as: TreasuryAnalyst, as_user_id: an-1 }
            - { call: "POST /assumption-sets/${ds}/approve", payload: {}, as: ALCOChair, as_user_id: ch-1 }
            - { call: "POST /books/${b}/assumption-sets", payload: { domain: DEPOSIT_BETA, params: { up_beta_pct: 40.0, down_beta_pct: 20.0, lag_months: 6 } }, as: TreasuryAnalyst, as_user_id: an-1, captures: { bs: $.data.id } }
            - { call: "POST /assumption-sets/${bs}/submit", payload: {}, as: TreasuryAnalyst, as_user_id: an-1 }
            - { call: "POST /assumption-sets/${bs}/approve", payload: {}, as: ALCOChair, as_user_id: ch-1 }
            - { call: "POST /books/${b}/policy-limits", payload: { metric: EVE_DELTA_PCT, applies_to_kinds: ["ALL"], threshold_pct: 12.0 }, as: ALCOChair, as_user_id: ch-1 }
            - { call: "POST /books/${b}/scenarios", payload: { name: "UP200", kind: PARALLEL_SHOCK, shock_bps: 200 }, as: TreasuryAnalyst, captures: { sc: $.data.id } }
            - { call: "GET /books/${b}", payload: {}, as: TreasuryAnalyst, captures: { bv: $.data.version } }
          trigger:
            - { call: "POST /books/${b}/simulation-runs", payload: { scenario_id: "${sc}", prepayment_set_id: "${ps}", decay_set_id: "${ds}", beta_set_id: "${bs}", balance_sheet_convention: STATIC, expected_book_version: "${bv}" }, as: TreasuryAnalyst, captures: { run: $.data.id } }
          assert:
            - "response of the create call: nii_base_cents == 5250000, nii_scenario_cents == 5010000, nii_delta_pct == -4.57"
            - "response of the create call: eve_base_cents == 30000000, eve_scenario_cents == 22400000, eve_delta_pct == -25.33"
            - "SimulationRun.${run}.breach_summary == EVE"
            - "SimulationRun.${run}.assumption_stale == false"
            - "SimulationRun.${run}.period_month == 2026-08"
