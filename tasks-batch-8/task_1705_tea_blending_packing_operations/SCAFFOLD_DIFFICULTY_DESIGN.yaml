            - { call: "POST /tea-ops/batches/${b1}/finalize-allocation", payload: {}, as: BlendMaster, as_user_id: "bm-1" }
            - { call: "POST /tea-ops/batches/${b1}/blend", payload: { measured_moisture_pct: 5.0 }, as: BlendMaster, as_user_id: "bm-1" }
            - { call: "POST /tea-ops/batches/${b1}/submit-qc", payload: {}, as: BlendMaster, as_user_id: "bm-1" }
