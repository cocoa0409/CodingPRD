              as: MusicHouseProducer
              captures: { s1: $.data.id }
          trigger:
            - call: "POST /session-calls"
              payload: { project_id: "${pj}", studio_room_id: "${r1}", scheduled_start_utc: "2026-09-10T13:00:00Z", scheduled_end_utc: "2026-09-10T15:00:00Z" }
              as: MusicHouseProducer
              captures: { s_adj: $.data.id }
            - call: "POST /session-calls"
              payload: { project_id: "${pj}", studio_room_id: "${r1}", scheduled_start_utc: "2026-09-10T12:00:00Z", scheduled_end_utc: "2026-09-10T12:30:00Z" }
