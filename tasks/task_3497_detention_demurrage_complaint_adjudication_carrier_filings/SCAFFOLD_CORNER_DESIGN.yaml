  # ===========================================================================
  - section: validations
    instances:

      - name: missing_auth_headers_beat_all_other_failures
        claim_type: Priority Ordering
        grounds:
          - validations[priority=1]
          - errors.ERR_MISSING_OR_INVALID_USER_CONTEXT_HEADER
        distinguishing_aspect: "Priority 1 dominates everything: a complaint filing with no X-User-ID/X-User-Role headers AND an unknown respondent id AND an empty subject set still returns 400 ERR_MISSING_OR_INVALID_USER_CONTEXT_HEADER, never a 404 or 422."
        test_recipe:
          setup: ["Logical clock at 2026-09-01T00:00:00Z; empty database."]
          setup_api_calls:
            - *c_clock
          trigger:
            - call: "POST /fmc/complaints"
              payload: { respondent_carrier_id: "00000000-0000-4000-8000-000000000000", subject_invoice_ids: [], reparations_claimed_cents: 50000 }
              captures: { err_no_headers: $.data.error_id }
            - call: "GET /fmc/carriers/00000000-0000-4000-8000-000000000000"
              payload: {}
              captures: { err_get_no_headers: $.data.error_id }
          assert:
            - "both responses are 400 with error_id == ERR_MISSING_OR_INVALID_USER_CONTEXT_HEADER (not 404, not 422)"

      - name: complaint_unknown_invoice_reference_beats_party_and_window_failures
        claim_type: Priority Ordering
        grounds:
          - validations[priority=5]
          - errors.ERR_INVOICE_NOT_FOUND
        distinguishing_aspect: "Existence (priority 5) dominates both business_temporal (priority 7) and business_referential (priority 8): with the clock past the filing window AND a billed-party mismatch, an unknown subject-invoice id still returns 404 ERR_INVOICE_NOT_FOUND."
        test_recipe:
          setup:
            - "Standard setup with one invoice billed to a DIFFERENT shipper; clock at 2027-03-10T00:00:00Z (past the filing window)."
          setup_api_calls:
            - *c_clock
            - *c_carrier
            - *c_shipper
            - call: "POST /fmc/shippers"
              payload: { company_name: "Other Shippers", contact_email: "ops@other.example" }
              as: CommissionAdmin
