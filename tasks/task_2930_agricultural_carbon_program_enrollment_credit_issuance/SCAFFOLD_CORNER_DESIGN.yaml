          - validations[priority=2]
          - errors[ERR_UNAUTHORIZED]
          - errors[ERR_UNAUTHENTICATED]
        distinguishing_aspect: "Every cross-role denial returns 403 ERR_UNAUTHORIZED even when the addressed id does not exist (priority 2 precedes priority 3), while a missing, empty or unrecognised X-User-Role returns 401 ERR_UNAUTHENTICATED on the very same paths — so the two auth errors are ordered, not interchangeable."
