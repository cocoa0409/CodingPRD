              captures: { mem2: "$.data.id"}
            - call: "GET /invoices"
              payload: { membership_id: "${mem2}", kind: "CYCLE" }
              as: AccountHolder
              as_user_id: "${acct}"
              captures: { inv2: "$.data[0].id"}
            - call: "POST /_payments/simulate"
              payload: { invoice_id: "${inv2}", outcome: "SUCCEEDED" }
              as: PlatformAdmin
            - call: "POST /wash-events"
              payload: { location_id: "${loc}", license_plate: "CAP012", state_code: "CA" }
              as: LocationOperator
          trigger:
            - call: "POST /wash-events"
              payload: { location_id: "${loc}", license_plate: "CAP013", state_code: "CA" }
              as: LocationOperator
              captures: { we2: "$.data.id"}
          assert:
            - "WashEvent.${we2}.status == REJECTED"
            - "WashEvent.${we2}.rejection_error_id == ERR_CAPACITY_FULL"

  # ===========================================================================
  - rule_id: compensating_invariant
    instances:
      - name: wallet_conservation_refund_then_topup_debit
        grounds:
          - calculations.wallet_balance
          - state_machines.Membership.ACTIVE_to_CANCEL_SCHEDULED
          - entities.WalletTransaction.fields.balance_after_cents
        distinguishing_aspect: "Conserved quantity = wallet money: Account.wallet_balance_cents == sum(WalletTransaction.amount_cents). A CANCEL_REFUND credit of 1900 followed by a TOPUP_DEBIT of -1200 leaves balance 700, and the latest ledger row's balance_after_cents == 700 (no drift)."
        test_recipe:
          setup:
            - "Clock 2026-06-01. One INDIVIDUAL account with two memberships: an UNLIMITED(3000) membership and a SINGLE_WASH membership (per_credit_price_cents=1200, included_credits=2), both ACTIVE and PAID."
            - "Clock advanced to 2026-06-12; the UNLIMITED membership is cancelled (refund 1900 to wallet). Then a 1-credit topup on the SINGLE_WASH membership debits 1200."
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-06-01T00:00:00Z" }
              as: PlatformAdmin
            - call: "POST /plans"
              payload: { name: "UWal", tier_type: "UNLIMITED", monthly_fee_cents: 3000, included_credits: 0, wash_cooldown_hours: 0, max_addons: 3 }
              as: PlatformAdmin
              captures: { plan_u: "$.data.id"}
            - call: "POST /plans"
              payload: { name: "SWal", tier_type: "SINGLE_WASH", monthly_fee_cents: 0, included_credits: 2, per_credit_price_cents: 1200, wash_cooldown_hours: 0, max_addons: 0 }
              as: PlatformAdmin
              captures: { plan_s: "$.data.id"}
            - call: "POST /accounts"
              payload: { account_type: "INDIVIDUAL", contact_email: "p@x.com" }
              as: AccountHolder
              captures: { acct: "$.data.id"}
            - call: "POST /accounts/${acct}/vehicles"
              payload: { license_plate: "WAL014", state_code: "CA" }
              as: AccountHolder
              as_user_id: "${acct}"
              captures: { veh1: "$.data.id"}
            - call: "POST /accounts/${acct}/vehicles"
              payload: { license_plate: "WAL015", state_code: "CA" }
              as: AccountHolder
              as_user_id: "${acct}"
              captures: { veh2: "$.data.id"}
            - call: "POST /memberships"
              payload: { account_id: "${acct}", vehicle_id: "${veh1}", plan_id: "${plan_u}" }
              as: AccountHolder
              as_user_id: "${acct}"
              captures: { mem_u: "$.data.id"}
            - call: "GET /invoices"
              payload: { membership_id: "${mem_u}", kind: "CYCLE" }
              as: AccountHolder
              as_user_id: "${acct}"
              captures: { invu: "$.data[0].id"}
            - call: "POST /_payments/simulate"
              payload: { invoice_id: "${invu}", outcome: "SUCCEEDED" }
              as: PlatformAdmin
            - call: "POST /memberships"
              payload: { account_id: "${acct}", vehicle_id: "${veh2}", plan_id: "${plan_s}" }
              as: AccountHolder
              as_user_id: "${acct}"
              captures: { mem_s: "$.data.id"}
            - call: "GET /invoices"
              payload: { membership_id: "${mem_s}", kind: "CYCLE" }
              as: AccountHolder
              as_user_id: "${acct}"
              captures: { invs: "$.data[0].id"}
            - call: "POST /_payments/simulate"
              payload: { invoice_id: "${invs}", outcome: "SUCCEEDED" }
              as: PlatformAdmin
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-06-12T00:00:00Z" }
              as: PlatformAdmin
            - call: "POST /memberships/${mem_u}/cancel"
              payload: {}
              as: AccountHolder
              as_user_id: "${acct}"
            - call: "GET /memberships/${mem_s}"
              payload: {}
              as: AccountHolder
              as_user_id: "${acct}"
              captures: { mem_s_v: "$.data.version"}
          trigger:
            - call: "POST /memberships/${mem_s}/topup"
              payload: { credit_quantity: 1, expected_membership_version: "${mem_s_v}" }
              as: AccountHolder
              as_user_id: "${acct}"
          assert:
            - "Account.${acct}.wallet_balance_cents == 700"
            - "The latest WalletTransaction (created_at ASC) for ${acct} has balance_after_cents == 700, equal to wallet_balance_cents (no drift)"

      - name: entitlement_conservation_grant_minus_consumed
        grounds:
          - entities.Membership.fields.credits_granted
          - entities.Membership.fields.credits_consumed
          - state_machines.WashEvent.REQUESTED_to_ADMITTED
        distinguishing_aspect: "A different conserved quantity = single-wash credits: credits_granted == credits_consumed + credit_balance must hold across the forward action (admit consumes 1) and the compensating grant (topup of 1). Granted 4, consumed 1, balance 3 -> 4 == 1 + 3."
        test_recipe:
          setup:
            - "Clock 2026-06-01. SINGLE_WASH membership included_credits=3 (granted 3 at activation); wallet funded by a +5000 manual adjustment so a topup of 1 credit (cost 1200) succeeds, raising credits_granted to 4. One wash then consumes 1 credit."
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-06-01T00:00:00Z" }
              as: PlatformAdmin
            - call: "POST /plans"
              payload: { name: "SEnt", tier_type: "SINGLE_WASH", monthly_fee_cents: 0, included_credits: 3, per_credit_price_cents: 1200, wash_cooldown_hours: 0, max_addons: 0 }
              as: PlatformAdmin
              captures: { plan_s: "$.data.id"}
            - call: "POST /locations"
              payload: { name: "EntSite", state_code: "CA", daily_wash_capacity: 50, in_network: true }
              as: PlatformAdmin
              captures: { loc: "$.data.id"}
            - call: "POST /accounts"
              payload: { account_type: "INDIVIDUAL", contact_email: "q@x.com" }
              as: AccountHolder
              captures: { acct: "$.data.id"}
            - call: "POST /accounts/${acct}/adjustments"
              payload: { amount_cents: 5000 }
              as: BillingAdmin
            - call: "POST /accounts/${acct}/vehicles"
              payload: { license_plate: "ENT016", state_code: "CA" }
              as: AccountHolder
              as_user_id: "${acct}"
              captures: { veh: "$.data.id"}
            - call: "POST /memberships"
              payload: { account_id: "${acct}", vehicle_id: "${veh}", plan_id: "${plan_s}" }
              as: AccountHolder
              as_user_id: "${acct}"
              captures: { mem: "$.data.id"}
            - call: "GET /invoices"
              payload: { membership_id: "${mem}", kind: "CYCLE" }
              as: AccountHolder
              as_user_id: "${acct}"
              captures: { inv0: "$.data[0].id"}
            - call: "POST /_payments/simulate"
              payload: { invoice_id: "${inv0}", outcome: "SUCCEEDED" }
              as: PlatformAdmin
            - call: "GET /memberships/${mem}"
              payload: {}
              as: AccountHolder
              as_user_id: "${acct}"
              captures: { mem_v: "$.data.version"}
            - call: "POST /memberships/${mem}/topup"
              payload: { credit_quantity: 1, expected_membership_version: "${mem_v}" }
              as: AccountHolder
              as_user_id: "${acct}"
          trigger:
            - call: "POST /wash-events"
              payload: { location_id: "${loc}", license_plate: "ENT016", state_code: "CA" }
              as: LocationOperator
              captures: { we: "$.data.id"}
          assert:
            - "WashEvent.${we}.status == ADMITTED"
            - "Membership.${mem}.credits_granted == 4"
            - "Membership.${mem}.credits_consumed == 1"
            - "Membership.${mem}.credit_balance == 3"
            - "credits_granted (4) == credits_consumed (1) + credit_balance (3)"

