# ============================================================================
# §1.8 Scaffold Difficulty Design — Test Targeting Index
# Domain: wetland-mitigation-banking (task_2665)
# Every instance grounds in SCAFFOLD.yaml §1.1-§1.7 only. Every numeric literal in
# an `assert:` was computed by executing the §1.3 formula with exact Decimal
# arithmetic and ROUND_HALF_UP; none is an estimate.
#
# Shared world used by most chains (the "sellable bank" chain):
#   Sponsor bond 30000000 >= MIN_PERFORMANCE_BOND_CENTS
#   MitigationBank DEPRESSIONAL, site HUC 03130002, service area [03130002, 03130003],
#     annual_stewardship_cost_cents 4200000 -> stewardship_required_cents 113680000
#   WorkPlan strata (101.50 x 0.375), (70.50 x 0.625), (33.30 x 0.500) -> 98.77 credits
#   PerformanceStandards HYDROPERIOD_DAYS GTE 120 w0.300 y1 | INVASIVE_COVER_PCT LTE 10.0 w0.250 y1
#                        NATIVE_COVER_PCT GTE 80.0 w0.300 y3 | STEM_DENSITY_PER_ACRE GTE 400 w0.150 y3
#   Endowment funded to the interim gate 28420000 (25% of 113680000)
#   ReleaseMilestone INSTRUMENT_EXECUTION 0.150 released -> credits_released 14.82
# ============================================================================
scaffold_difficulty_design:

  - rule_id: dual_variant_calc
    instances:

      - name: milestone_release_provisional_vs_final_diverge_on_partial_attainment
        grounds:
          - calculations.milestone_credit_release
          - state_machines.ReleaseMilestone.CLAIMED_to_APPROVED
          - entities.ReleaseMilestone.fields.provisional_release_credits
          - entities.ReleaseMilestone.fields.final_release_credits
          - entities.ReleaseMilestone.fields.attainment_factor_applied
        distinguishing_aspect: |
          This instance's two variants live on the ReleaseMilestone/MitigationBank credit-ledger
          domain: PROVISIONAL is stamped at claim time with attainment_factor 1.00 and consults no
          MonitoringReport, FINAL is stamped at release-approval time with the factor 0.90 selected
          from the latest ACCEPTED report's 0.9350 PARTIAL score, so the same row simultaneously
          carries 24.69 provisional and 22.22 final credits and only 22.22 ever reaches the ledger.
        test_recipe:
          setup:
            - "Bank INSTRUMENT_EXECUTED with easement recorded, endowment at the 28420000 interim gate, total_authorized_credits 98.77."
            - "INSTRUMENT_EXECUTION (0.150) and CONSTRUCTION_COMPLETE (0.200) milestones already APPROVED; credits_released 34.57."
            - "PERF_YEAR_3 milestone (0.250) chained behind CONSTRUCTION_COMPLETE, window [2029-09-01, 2029-10-01)."
            - "Monitoring year 3 report ACCEPTED with measurements (114, 12.0, 80.0, 400) -> attainment_score 0.9350, compliance_status PARTIAL."
            - "Logical clock at 2029-09-05T00:00:00Z."
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-08-01T00:00:00Z" }
              as: ProgramAdmin
            - call: "POST /mitigation/sponsors"
              payload: { legal_name: "Cypress Bend Mitigation LLC", legal_entity_type: "PRIVATE_ENTREPRENEURIAL", performance_bond_cents: 30000000 }
              as: ProgramAdmin
              captures: { sponsor_id: $.data.id }
            - call: "POST /mitigation/irt-members"
              payload: { member_name: "R. Alvarez", agency: "USACE" }
              as: ProgramAdmin
              captures: { m_corps_id: $.data.id }
            - call: "POST /mitigation/irt-members"
              payload: { member_name: "T. Nakamura", agency: "EPA" }
              as: ProgramAdmin
              captures: { m_epa_id: $.data.id }
            - call: "POST /mitigation/irt-members"
              payload: { member_name: "L. Okonkwo", agency: "STATE_DEQ" }
              as: ProgramAdmin
              captures: { m_deq_id: $.data.id }
            - call: "POST /mitigation/banks"
              payload: { sponsor_id: "${sponsor_id}", site_name: "Cypress Bend", site_huc8_code: "03130002", service_area_huc8_codes: ["03130002", "03130003"], hgm_class: "DEPRESSIONAL", annual_stewardship_cost_cents: 4200000 }
              as: Sponsor
              as_user_id: "${sponsor_id}"
              captures: { bank_id: $.data.id }
            - call: "POST /mitigation/prospectuses"
              payload: { bank_id: "${bank_id}", objective_summary: "Restore 205 acres of depressional wetland", proposed_credits: 98.77 }
              as: Sponsor
              as_user_id: "${sponsor_id}"
              captures: { prospectus_id: $.data.id }
            - call: "POST /mitigation/work-plans"
              payload: { bank_id: "${bank_id}", hydrology_restoration_acres: 205.30, planting_acres: 104.00, invasive_control_acres: 33.30, invasive_control_protocol: "INTEGRATED", credit_strata: [{ stratum_code: "UPLAND_BUFFER", acres: 101.50, lift_factor: 0.375 }, { stratum_code: "EMERGENT_MARSH", acres: 70.50, lift_factor: 0.625 }, { stratum_code: "FORESTED_WETLAND", acres: 33.30, lift_factor: 0.500 }], performance_standards: [{ standard_code: "HYDROPERIOD_DAYS", comparator: "GTE", threshold_value: 120, weight: 0.300, effective_from_year: 1 }, { standard_code: "INVASIVE_COVER_PCT", comparator: "LTE", threshold_value: 10.0, weight: 0.250, effective_from_year: 1 }, { standard_code: "NATIVE_COVER_PCT", comparator: "GTE", threshold_value: 80.0, weight: 0.300, effective_from_year: 3 }, { standard_code: "STEM_DENSITY_PER_ACRE", comparator: "GTE", threshold_value: 400, weight: 0.150, effective_from_year: 3 }] }
              as: Sponsor
              as_user_id: "${sponsor_id}"
              captures: { work_plan_id: $.data.id }
            - call: "POST /mitigation/prospectuses/${prospectus_id}/submit"
              payload: {}
              as: Sponsor
              as_user_id: "${sponsor_id}"
            - call: "POST /mitigation/work-plans/${work_plan_id}/submit"
              payload: {}
              as: Sponsor
              as_user_id: "${sponsor_id}"
            - call: "POST /mitigation/prospectuses/${prospectus_id}/votes"
              payload: { position: "CONCUR" }
              as: IRTMember
              as_user_id: "${m_corps_id}"
            - call: "POST /mitigation/prospectuses/${prospectus_id}/votes"
              payload: { position: "CONCUR" }
              as: IRTMember
              as_user_id: "${m_epa_id}"
            - call: "POST /mitigation/prospectuses/${prospectus_id}/votes"
              payload: { position: "CONCUR" }
              as: IRTMember
              as_user_id: "${m_deq_id}"
            - call: "POST /mitigation/prospectuses/${prospectus_id}/finalize-review"
              payload: {}
              as: IRTChair
            - call: "POST /mitigation/work-plans/${work_plan_id}/decide"
              payload: { decision: "APPROVE" }
              as: IRTChair
            - call: "POST /mitigation/banks/${bank_id}/execute-instrument"
              payload: {}
              as: IRTChair
            - call: "POST /mitigation/banks/${bank_id}/conservation-easement"
              payload: { deed_reference: "BK4412-PG221" }
              as: Sponsor
              as_user_id: "${sponsor_id}"
            - call: "POST /mitigation/banks/${bank_id}/stewardship-contributions"
              payload: { amount_cents: 28420000 }
              as: Sponsor
              as_user_id: "${sponsor_id}"
            - call: "POST /mitigation/milestones"
              payload: { bank_id: "${bank_id}", milestone_code: "INSTRUMENT_EXECUTION", release_pct: 0.150, window_start: "2026-08-01T00:00:00Z", window_end: "2026-09-01T00:00:00Z" }
              as: Sponsor
              as_user_id: "${sponsor_id}"
              captures: { ms1_id: $.data.id }
            - call: "POST /mitigation/milestones"
              payload: { bank_id: "${bank_id}", milestone_code: "CONSTRUCTION_COMPLETE", release_pct: 0.200, window_start: "2027-09-01T00:00:00Z", window_end: "2027-10-01T00:00:00Z", predecessor_milestone_id: "${ms1_id}" }
              as: Sponsor
              as_user_id: "${sponsor_id}"
              captures: { ms2_id: $.data.id }
            - call: "POST /mitigation/milestones"
              payload: { bank_id: "${bank_id}", milestone_code: "PERF_YEAR_3", release_pct: 0.250, window_start: "2029-09-01T00:00:00Z", window_end: "2029-10-01T00:00:00Z", predecessor_milestone_id: "${ms2_id}" }
              as: Sponsor
              as_user_id: "${sponsor_id}"
              captures: { ms3_id: $.data.id }
            - call: "POST /mitigation/milestones/${ms1_id}/claim"
              payload: {}
              as: Sponsor
              as_user_id: "${sponsor_id}"
            - call: "GET /mitigation/banks/${bank_id}"
              payload: {}
              as: Sponsor
              as_user_id: "${sponsor_id}"
              captures: { bank_v1: $.data.version }
            - call: "POST /mitigation/milestones/${ms1_id}/approve-release"
              payload: { expected_bank_version: "${bank_v1}" }
              as: IRTMember
              as_user_id: "${m_corps_id}"
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2027-09-15T00:00:00Z" }
              as: ProgramAdmin
            - call: "POST /mitigation/milestones/${ms2_id}/claim"
              payload: {}
              as: Sponsor
              as_user_id: "${sponsor_id}"
            - call: "GET /mitigation/banks/${bank_id}"
              payload: {}
              as: Sponsor
              as_user_id: "${sponsor_id}"
              captures: { bank_v2: $.data.version }
            - call: "POST /mitigation/milestones/${ms2_id}/approve-release"
              payload: { expected_bank_version: "${bank_v2}" }
              as: IRTMember
              as_user_id: "${m_corps_id}"
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2029-09-05T00:00:00Z" }
              as: ProgramAdmin
            - call: "POST /mitigation/monitoring-reports"
              payload: { bank_id: "${bank_id}", monitoring_year: 3, window_start: "2029-06-01T00:00:00Z", window_end: "2029-09-01T00:00:00Z", measurements: [{ standard_code: "HYDROPERIOD_DAYS", measured_value: 114 }, { standard_code: "INVASIVE_COVER_PCT", measured_value: 12.0 }, { standard_code: "NATIVE_COVER_PCT", measured_value: 80.0 }, { standard_code: "STEM_DENSITY_PER_ACRE", measured_value: 400 }] }
              as: Sponsor
              as_user_id: "${sponsor_id}"
              captures: { report3_id: $.data.id }
            - call: "POST /mitigation/monitoring-reports/${report3_id}/submit"
              payload: {}
              as: Sponsor
              as_user_id: "${sponsor_id}"
            - call: "POST /mitigation/monitoring-reports/${report3_id}/review"
              payload: { decision: "ACCEPT" }
              as: IRTMember
              as_user_id: "${m_epa_id}"
              captures: { score3: $.data.attainment_score }
          trigger:
            - call: "POST /mitigation/milestones/${ms3_id}/claim"
              payload: {}
              as: Sponsor
              as_user_id: "${sponsor_id}"
              captures: { ms3_provisional: $.data.provisional_release_credits }
            - call: "GET /mitigation/banks/${bank_id}"
              payload: {}
              as: Sponsor
              as_user_id: "${sponsor_id}"
              captures: { bank_v3: $.data.version }
            - call: "POST /mitigation/milestones/${ms3_id}/approve-release"
              payload: { expected_bank_version: "${bank_v3}" }
              as: IRTMember
              as_user_id: "${m_corps_id}"
              captures: { ms3_final: $.data.final_release_credits }
          assert:
            - "MonitoringReport.${report3_id}.attainment_score == 0.9350"
            - "MonitoringReport.${report3_id}.compliance_status == PARTIAL"
            - "ReleaseMilestone.${ms3_id}.provisional_release_credits == 24.69"
            - "ReleaseMilestone.${ms3_id}.final_release_credits == 22.22"
            - "ReleaseMilestone.${ms3_id}.attainment_factor_applied == 0.90"
            - "ReleaseMilestone.${ms3_id}.provisional_release_credits - ReleaseMilestone.${ms3_id}.final_release_credits == 2.47"
            - "MitigationBank.${bank_id}.credits_released == 56.79"
            - "MitigationBank.${bank_id}.credits_available == 56.79"
            - "the CreditLedgerEntry appended by this approval has entry_type RELEASED and delta_credits == 22.22 (the FINAL value, never the provisional 24.69)"

      - name: sale_price_quoted_vs_executed_diverge_when_endowment_completed
        grounds:
          - calculations.credit_sale_price
          - state_machines.CreditSale.RESERVED_to_EXECUTED
          - entities.CreditSale.fields.quoted_price_cents
          - entities.CreditSale.fields.executed_price_cents
          - entities.Permittee.fields.escrow_balance_cents
        distinguishing_aspect: |
          This instance's two variants live on the CreditSale/Permittee money domain (not the credit
          ledger): QUOTED freezes the 8% stewardship surcharge that applied while the endowment was
          only 25% funded (32216400), EXECUTED re-reads the now fully funded endowment and re-runs the
          demand index, landing BELOW the quote at 29830000 under the nested min(recomputed,
          round(quote * 1.10) = 35438040) cap, so escrow is debited 29830000 and not 32216400.
        test_recipe:
          setup:
            - "Sellable bank: credits_released 14.82, sales_posture OPEN, endowment funded 28420000 of 113680000 (underfunded -> 8% surcharge applies at quote time)."
            - "Permittee with required_credits 12.00 and escrow 40000000, impact HUC 03130002 (PRIMARY tier)."
            - "Sale for 8.00 credits quoted then reserved; afterwards the sponsor completes the endowment with 85260000."
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-08-01T00:00:00Z" }
              as: ProgramAdmin
            - call: "POST /mitigation/sponsors"
              payload: { legal_name: "Cypress Bend Mitigation LLC", legal_entity_type: "PRIVATE_ENTREPRENEURIAL", performance_bond_cents: 30000000 }
              as: ProgramAdmin
              captures: { sponsor_id: $.data.id }
            - call: "POST /mitigation/permittees"
              payload: { organization_name: "Delta Logistics Park LLC", permit_number: "SAM-2026-00417", impact_huc8_code: "03130002", required_credits: 12.00 }
              as: ProgramAdmin
              captures: { permittee_id: $.data.id }
            - call: "POST /mitigation/permittees/${permittee_id}/deposits"
              payload: { amount_cents: 40000000 }
              as: ProgramAdmin
            - call: "POST /mitigation/irt-members"
              payload: { member_name: "R. Alvarez", agency: "USACE" }
              as: ProgramAdmin
              captures: { m_corps_id: $.data.id }
            - call: "POST /mitigation/irt-members"
              payload: { member_name: "T. Nakamura", agency: "EPA" }
              as: ProgramAdmin
              captures: { m_epa_id: $.data.id }
            - call: "POST /mitigation/irt-members"
              payload: { member_name: "L. Okonkwo", agency: "STATE_DEQ" }
              as: ProgramAdmin
              captures: { m_deq_id: $.data.id }
            - call: "POST /mitigation/banks"
              payload: { sponsor_id: "${sponsor_id}", site_name: "Cypress Bend", site_huc8_code: "03130002", service_area_huc8_codes: ["03130002", "03130003"], hgm_class: "DEPRESSIONAL", annual_stewardship_cost_cents: 4200000 }
              as: Sponsor
              as_user_id: "${sponsor_id}"
              captures: { bank_id: $.data.id }
            - call: "POST /mitigation/prospectuses"
              payload: { bank_id: "${bank_id}", objective_summary: "Restore 205 acres of depressional wetland", proposed_credits: 98.77 }
              as: Sponsor
              as_user_id: "${sponsor_id}"
              captures: { prospectus_id: $.data.id }
            - call: "POST /mitigation/work-plans"
              payload: { bank_id: "${bank_id}", hydrology_restoration_acres: 205.30, planting_acres: 104.00, invasive_control_acres: 33.30, invasive_control_protocol: "INTEGRATED", credit_strata: [{ stratum_code: "UPLAND_BUFFER", acres: 101.50, lift_factor: 0.375 }, { stratum_code: "EMERGENT_MARSH", acres: 70.50, lift_factor: 0.625 }, { stratum_code: "FORESTED_WETLAND", acres: 33.30, lift_factor: 0.500 }], performance_standards: [{ standard_code: "HYDROPERIOD_DAYS", comparator: "GTE", threshold_value: 120, weight: 0.300, effective_from_year: 1 }, { standard_code: "INVASIVE_COVER_PCT", comparator: "LTE", threshold_value: 10.0, weight: 0.250, effective_from_year: 1 }, { standard_code: "NATIVE_COVER_PCT", comparator: "GTE", threshold_value: 80.0, weight: 0.300, effective_from_year: 3 }, { standard_code: "STEM_DENSITY_PER_ACRE", comparator: "GTE", threshold_value: 400, weight: 0.150, effective_from_year: 3 }] }
              as: Sponsor
              as_user_id: "${sponsor_id}"
              captures: { work_plan_id: $.data.id }
            - call: "POST /mitigation/prospectuses/${prospectus_id}/submit"
              payload: {}
              as: Sponsor
              as_user_id: "${sponsor_id}"
            - call: "POST /mitigation/work-plans/${work_plan_id}/submit"
              payload: {}
              as: Sponsor
              as_user_id: "${sponsor_id}"
            - call: "POST /mitigation/prospectuses/${prospectus_id}/votes"
              payload: { position: "CONCUR" }
              as: IRTMember
              as_user_id: "${m_corps_id}"
            - call: "POST /mitigation/prospectuses/${prospectus_id}/votes"
              payload: { position: "CONCUR" }
              as: IRTMember
              as_user_id: "${m_epa_id}"
            - call: "POST /mitigation/prospectuses/${prospectus_id}/votes"
              payload: { position: "CONCUR" }
              as: IRTMember
              as_user_id: "${m_deq_id}"
            - call: "POST /mitigation/prospectuses/${prospectus_id}/finalize-review"
              payload: {}
              as: IRTChair
            - call: "POST /mitigation/work-plans/${work_plan_id}/decide"
              payload: { decision: "APPROVE" }
              as: IRTChair
            - call: "POST /mitigation/banks/${bank_id}/execute-instrument"
              payload: {}
              as: IRTChair
            - call: "POST /mitigation/banks/${bank_id}/conservation-easement"
              payload: { deed_reference: "BK4412-PG221" }
              as: Sponsor
              as_user_id: "${sponsor_id}"
            - call: "POST /mitigation/banks/${bank_id}/stewardship-contributions"
              payload: { amount_cents: 28420000 }
              as: Sponsor
              as_user_id: "${sponsor_id}"
            - call: "POST /mitigation/milestones"
              payload: { bank_id: "${bank_id}", milestone_code: "INSTRUMENT_EXECUTION", release_pct: 0.150, window_start: "2026-08-01T00:00:00Z", window_end: "2026-09-01T00:00:00Z" }
              as: Sponsor
              as_user_id: "${sponsor_id}"
              captures: { ms1_id: $.data.id }
            - call: "POST /mitigation/milestones/${ms1_id}/claim"
              payload: {}
              as: Sponsor
              as_user_id: "${sponsor_id}"
            - call: "GET /mitigation/banks/${bank_id}"
              payload: {}
              as: Sponsor
              as_user_id: "${sponsor_id}"
              captures: { bank_v1: $.data.version }
            - call: "POST /mitigation/milestones/${ms1_id}/approve-release"
              payload: { expected_bank_version: "${bank_v1}" }
              as: IRTMember
              as_user_id: "${m_corps_id}"
            - call: "GET /mitigation/banks/${bank_id}"
              payload: {}
              as: Permittee
              as_user_id: "${permittee_id}"
              captures: { bank_v2: $.data.version }
            - call: "POST /mitigation/credit-sales"
              payload: { bank_id: "${bank_id}", permittee_id: "${permittee_id}", credits_requested: 8.00, impact_huc8_code: "03130002", expected_bank_version: "${bank_v2}" }
              as: Permittee
              as_user_id: "${permittee_id}"
              captures: { sale_id: $.data.id, quoted_price: $.data.quoted_price_cents }
            - call: "POST /mitigation/credit-sales/${sale_id}/reserve"
              payload: {}
              as: Permittee
