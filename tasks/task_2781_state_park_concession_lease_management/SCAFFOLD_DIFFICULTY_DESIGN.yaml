            - "FeeReconciliation.${recon1_id}.annual_gross_receipts_cents == 120000000"
            - "FeeReconciliation.${recon1_id}.annual_fee_due_cents == 7750000"
            - "FeeReconciliation.${recon1_id}.additional_fee_due_cents == 1300000"
            - "the FeeReconciliation row with audit_engagement_id == ${audit_id} has status == VOIDED"
            - "invariant: Lease.${lease_id}.outstanding_fee_balance_cents == 1300000, exactly the pre-audit figure"
            - "Lease.${lease_id}.compliance_status == COMPLIANT"
            - "Lease.${lease_id}.contract_status == ACTIVE"
            - "the ComplianceAction on lease ${lease_id} with origin == SYSTEM_ISSUED has status == RESCINDED"
            - "no ComplianceAction on lease ${lease_id} has status == NOTICE_ISSUED"
