              as: PlatformAdmin
              captures: { er2: $.data.id }
            - call: "POST /v1/segments"
              payload: { creator_id: "${er2}", name: "Erasure Run", sport_type: "RUN", start_lat: 70.00, start_lng: -155.00, end_lat: 70.01, end_lng: -155.00, distance_m: 1000, city: "Erasureville" }
              as: Athlete
              as_user_id: "${er2}"
              captures: { seg_er: $.data.id }
            - call: "POST /v1/segments/${seg_er}/activate"
              payload: {}
              as: Athlete
              as_user_id: "${er2}"
            - call: "POST /v1/athletes/${er1}/activities"
              payload: { device_source: "garmin-edge", sport_type: "RUN", started_at: "2026-09-01T06:00:00Z", duration_s: 100, distance_m: 1000, track_points: [{lat: 70.00, lng: -155.00, t_offset_s: 0}, {lat: 70.01, lng: -155.00, t_offset_s: 100}], start_lat: 70.00, start_lng: -155.00, end_lat: 70.01, end_lng: -155.00, idempotency_key: "er-1", effort_hints: [{segment_id: "${seg_er}", elapsed_time_s: 100, elevation_gain_m: 0}] }
              as: Athlete
              as_user_id: "${er1}"
              captures: { act_er: $.data.id }
            - call: "GET /v1/efforts?activity_id=${act_er}"
              as: Athlete
              as_user_id: "${er1}"
              captures: { eff_er: "$.data[0].id" }
            - call: "POST /v1/clubs"
              payload: { owner_id: "${er2}", name: "Erasure Club", sport_type: "RUN", join_policy: "OPEN" }
              as: Athlete
              as_user_id: "${er2}"
              captures: { club_er: $.data.id }
            - call: "POST /v1/clubs/${club_er}/memberships"
              payload: { athlete_id: "${er1}" }
              as: Athlete
              as_user_id: "${er1}"
              captures: { mbr_er: $.data.id }
          trigger:
            - call: "DELETE /v1/athletes/${er1}"
              as: Athlete
              as_user_id: "${er1}"
              captures: { st_er: $.data.status, em_er: $.data.email, nm_er: $.data.display_name }
            - call: "GET /v1/efforts/${eff_er}"
              as: Athlete
              as_user_id: "${er2}"
              captures: { eff_er_fs: $.data.flag_status }
            - call: "GET /v1/memberships/${mbr_er}"
              as: Athlete
              as_user_id: "${er2}"
              captures: { mbr_er_st: $.data.status }
          assert:
            - "Delete response: status == DELETED, email == 'deleted-<id>@erased.invalid', display_name == 'Deleted Athlete'"
            - "Effort ${eff_er}.flag_status == EXCLUDED immediately"
            - "Membership ${mbr_er}.status == LEFT immediately"
