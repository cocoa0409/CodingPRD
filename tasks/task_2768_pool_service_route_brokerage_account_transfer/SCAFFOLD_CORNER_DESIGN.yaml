      - name: publishing_an_already_listed_listing_is_rejected_not_idempotent
        claim_type: idempotency
        grounds:
          - "validations[priority=30]"
          - "errors.ERR_INVALID_LISTING_TRANSITION"
          - "state_machines.RouteListing[DRAFT -> LISTED]"
          - "endpoints[POST /route-listings/{id}/publish]"
        distinguishing_aspect: "Publication is not idempotent: the second identical publish on a LISTED listing is a 409 rather than a silent 200, and the listing's version does not advance -- so a retried publish cannot inflate the OCC generation that valuation writes depend on."
