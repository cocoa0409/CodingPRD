            - "the 10:59-11:30 session returns HTTP 409 with data.error_id == ERR_ROOM_TIME_CONFLICT because it overlaps 10:00-11:00 by one minute"
            - "GET /sessions filtered by room_code HALL-A returns total_count == 2"

      - name: chair_intervals_are_padded_by_a_fifteen_minute_turnaround
        grounds:
          - calculations.session_chair_overlap
          - entities.Session.fields.chair_member_id
