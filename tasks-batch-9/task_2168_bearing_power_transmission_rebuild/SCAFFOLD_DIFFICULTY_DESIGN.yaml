              payload: { action: "START" }
              as: Planner
            - call: "POST /shop/rebuild-orders/${order_id}/advance"
              payload: { action: "COMPLETE" }
              as: Planner
            - call: "POST /shop/rebuild-orders/${order_id}/advance"
              payload: { action: "DELIVER" }
              as: Planner
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-08-10T00:00:00Z" }
              as: ShopAdmin
            - call: "GET /shop/assets/${asset_id}"
              as: ShopAdmin
              captures: { asset_v1: $.data.version }
            - call: "POST /shop/installations"
              payload: { core_unit_id: "${core_id}", customer_asset_id: "${asset_id}", rebuild_order_id: "${order_id}", expected_asset_version: "${asset_v1}" }
              as: ShopAdmin
              captures: { inst_1: $.data.id }
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-08-12T00:00:00Z" }
              as: ShopAdmin
            - call: "POST /shop/installations/${inst_1}/advance"
              payload: { action: "REMOVE" }
              as: ShopAdmin
          trigger:
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-08-12T23:59:59Z" }
              as: ShopAdmin
            - call: "GET /shop/assets/${asset_id}"
              as: ShopAdmin
              captures: { asset_v2: $.data.version }
            - call: "POST /shop/installations"
              payload: { core_unit_id: "${core_id}", customer_asset_id: "${asset_id}", rebuild_order_id: "${order_id}", expected_asset_version: "${asset_v2}" }
              as: ShopAdmin
              captures: { err: $.data.error_id }
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-08-13T00:00:00Z" }
              as: ShopAdmin
            - call: "GET /shop/assets/${asset_id}"
              as: ShopAdmin
              captures: { asset_v3: $.data.version }
            - call: "POST /shop/installations"
              payload: { core_unit_id: "${core_id}", customer_asset_id: "${asset_id}", rebuild_order_id: "${order_id}", expected_asset_version: "${asset_v3}" }
              as: ShopAdmin
              captures: { inst_2: $.data.id }
          assert:
            - "Installation.${inst_1}.status == REMOVED_PLANNED and removed_at == 2026-08-12T00:00:00.000Z"
            - "the installation attempted at 2026-08-12T23:59:59Z returns HTTP 409 with error_id == ERR_INSTALL_BUFFER_VIOLATION"
            - "the installation attempted at 2026-08-13T00:00:00Z is created with HTTP 201"
            - "Installation.${inst_2}.in_service_start_at == 2026-08-13T00:00:00.000Z"
            - "Installation.${inst_2}.status == INSTALLED and run_hours == 0"
            - "GET /shop/installations?customer_asset_id=${asset_id} returns total_count == 2"
            - "the rejected attempt did not increment CustomerAsset.${asset_id}.version, so ${asset_v2} == ${asset_v3}"

  # ===========================================================================
  - rule_id: compensating_invariant
    instances:

      - name: credit_note_issue_then_void_conserves_customer_ledger_total
        grounds:
          - calculations.customer_credit_balances
          - entities.Customer.fields.total_credit_balance_cents
          - entities.CreditNote.fields.status
          - concurrency_rules[credit-note-issue-stale-customer]
        distinguishing_aspect: |
          Conserved quantity 1 - the customer's money ledger, pinned as
          total_credit_balance_cents == sum(CreditNote.amount_cents where
          customer_id == C and status == POSTED). Posting a 50000-cent manual
          adjustment and then voiding it returns the total to exactly its
          pre-posting value of 10800, leaving zero drift.
        test_recipe:
          setup:
            - "A customer holding exactly one POSTED CORE_EXCHANGE note of 10800 cents from a received core, so total_credit_balance_cents is 10800."
          setup_api_calls:
            - call: "POST /shop/customers"
              payload: { name: "Ledger Works", account_code: "LED-001" }
              as: ShopAdmin
              captures: { cust_id: $.data.id }
            - call: "POST /shop/clearance-standards"
              payload: { model_code: "LEDGER-SPEC-1", base_core_value_cents: 90000, max_rebuild_count: 3, warranty_hours: 8000, warranty_months: 18, cleanroom_required: false, required_feature_codes: ["BORE"], feature_bands: [{feature_code: "BORE", min_um: 40, max_um: 90, rework_extension_um: 15, deduction_pct: 0.10, weight: 0.40}] }
              as: ShopAdmin
              captures: { std_id: $.data.id }
            - call: "POST /shop/core-units"
              payload: { customer_id: "${cust_id}", clearance_standard_id: "${std_id}", serial_no: "SN-LED-1", rebuild_count: 1, declared_condition_grade: "GRADE_D" }
              as: ShopAdmin
              captures: { core_id: $.data.id }
            - call: "GET /shop/customers/${cust_id}"
              as: ShopAdmin
              captures: { cust_v: $.data.version, total_before: $.data.total_credit_balance_cents }
          trigger:
            - call: "POST /shop/customers/${cust_id}/credit-notes"
              payload: { amount_cents: 50000, memo: "goodwill freight credit", expected_customer_version: "${cust_v}" }
              as: ShopAdmin
              captures: { note_id: $.data.id }
            - call: "GET /shop/customers/${cust_id}"
              as: ShopAdmin
            - call: "POST /shop/credit-notes/${note_id}/void"
              payload: { void_reason: "issued against the wrong account" }
              as: ShopAdmin
            - call: "GET /shop/customers/${cust_id}"
              as: ShopAdmin
          assert:
            - "before the trigger Customer.${cust_id}.total_credit_balance_cents == 10800"
            - "after the posting Customer.${cust_id}.manual_credit_balance_cents == 50000 and total_credit_balance_cents == 60800"
            - "after the void CreditNote.${note_id}.status == VOID and voided_at is not null"
            - "after the void Customer.${cust_id}.manual_credit_balance_cents == 0"
            - "after the void Customer.${cust_id}.core_credit_balance_cents == 10800"
            - "after the void Customer.${cust_id}.total_credit_balance_cents == 10800, exactly the pre-posting value"
            - "GET /shop/credit-notes?customer_id=${cust_id}&status=POSTED returns total_count == 1"

      - name: bench_reserve_then_release_conserves_committed_minutes
        grounds:
          - calculations.bench_committed_minutes
          - entities.Bench.fields.committed_minutes
          - state_machines.BenchReservation.HELD_to_RELEASED
          - entities.BenchReservation.fields.window_minutes
        distinguishing_aspect: |
          Conserved quantity 2 - bench capacity in minutes rather than money,
          pinned as Bench.committed_minutes == sum(window_minutes over
          reservations with status IN {HELD, CONFIRMED}). Reserving a 240-minute
          window, confirming it and then releasing it returns committed_minutes
          to exactly 0, and the RELEASED row keeps its window_minutes of 240
          while contributing nothing.
        test_recipe:
          setup:
            - "A two-slot bench B-8 with no reservations, so committed_minutes is 0."
            - "One DRAFT order available to hang a reservation on."
          setup_api_calls:
            - call: "POST /shop/customers"
              payload: { name: "Bench Works", account_code: "BEN-001" }
              as: ShopAdmin
              captures: { cust_id: $.data.id }
            - call: "POST /shop/customers/${cust_id}/assets"
              payload: { asset_tag: "MILL-07-GBX", criticality: "STANDARD", duty_class: "CONTINUOUS" }
              as: ShopAdmin
              captures: { asset_id: $.data.id }
            - call: "POST /shop/clearance-standards"
              payload: { model_code: "BENCH-SPEC-1", base_core_value_cents: 90000, max_rebuild_count: 3, warranty_hours: 8000, warranty_months: 18, cleanroom_required: false, required_feature_codes: ["BORE"], feature_bands: [{feature_code: "BORE", min_um: 40, max_um: 90, rework_extension_um: 15, deduction_pct: 0.10, weight: 0.40}] }
              as: ShopAdmin
              captures: { std_id: $.data.id }
            - call: "POST /shop/benches"
              payload: { bench_code: "B-8", parallel_slots: 2, cleanroom: false }
              as: ShopAdmin
              captures: { bench_id: $.data.id }
            - call: "POST /shop/core-units"
              payload: { customer_id: "${cust_id}", clearance_standard_id: "${std_id}", serial_no: "SN-BEN-1", rebuild_count: 0, declared_condition_grade: "GRADE_B" }
              as: ShopAdmin
              captures: { core_id: $.data.id }
            - call: "POST /shop/rebuild-orders"
              payload: { customer_id: "${cust_id}", core_unit_id: "${core_id}", customer_asset_id: "${asset_id}", labor_hours: 4.0 }
              as: Planner
              captures: { order_id: $.data.id }
            - call: "GET /shop/benches/${bench_id}"
              as: Planner
          trigger:
            - call: "POST /shop/bench-reservations"
              payload: { rebuild_order_id: "${order_id}", bench_id: "${bench_id}", window_start_at: "2026-09-06T08:00:00Z", window_end_at: "2026-09-06T12:00:00Z" }
              as: Planner
              captures: { res_id: $.data.id, wm: $.data.window_minutes }
            - call: "POST /shop/bench-reservations/${res_id}/advance"
              payload: { action: "CONFIRM" }
              as: Planner
            - call: "GET /shop/benches/${bench_id}"
              as: Planner
            - call: "POST /shop/bench-reservations/${res_id}/advance"
              payload: { action: "RELEASE" }
              as: Planner
            - call: "GET /shop/benches/${bench_id}"
              as: Planner
          assert:
            - "before the trigger Bench.${bench_id}.committed_minutes == 0"
            - "BenchReservation.${res_id}.window_minutes == 240"
            - "after CONFIRM Bench.${bench_id}.committed_minutes == 240 and BenchReservation.${res_id}.status == CONFIRMED"
            - "after RELEASE BenchReservation.${res_id}.status == RELEASED"
            - "after RELEASE BenchReservation.${res_id}.window_minutes == 240 (the row keeps its width)"
            - "after RELEASE Bench.${bench_id}.committed_minutes == 0, exactly the pre-reservation value"
            - "GET /shop/benches/${bench_id}/reservations returns total_count == 1"
