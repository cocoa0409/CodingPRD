  # ===========================================================================
  - section: rbac
    instances:
      - name: member_cannot_freeze_other_member
        claim_type: peer_roles
        grounds: [roles, "validations[priority=2]", "errors[ERR_FORBIDDEN]"]
        distinguishing_aspect: "A Member acting with X-User-ID of member A cannot POST /members/{B}/freeze on a different member B; returns ERR_FORBIDDEN (403)."
        test_recipe:
          setup:
            - "Two ACTIVE members A and B."
          setup_api_calls:
            - call: "POST /membership-plans"
              payload: { tier_code: "BASIC", monthly_fee_cents: 3000, weekly_uv_session_cap: 0 }
              as: SalonManager
              captures: { plan_id: $.data.id }
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-06-01T00:00:00Z" }
              as: BillingSystem
            - call: "POST /members"
              payload: { full_name: "Member A", date_of_birth: "1990-01-01T00:00:00Z", skin_type: "IV", plan_id: "${plan_id}" }
              as: FrontDeskStaff
              captures: { a_id: $.data.id }
            - call: "POST /_billing/charge-first-dues"
              payload: { member_id: "${a_id}", outcome: "SUCCEEDED" }
              as: BillingSystem
            - call: "POST /members/${a_id}/activate"
              payload: {}
              as: BillingSystem
            - call: "POST /members"
              payload: { full_name: "Member B", date_of_birth: "1990-01-01T00:00:00Z", skin_type: "IV", plan_id: "${plan_id}" }
              as: FrontDeskStaff
              captures: { b_id: $.data.id }
            - call: "POST /_billing/charge-first-dues"
              payload: { member_id: "${b_id}", outcome: "SUCCEEDED" }
              as: BillingSystem
            - call: "POST /members/${b_id}/activate"
              payload: {}
              as: BillingSystem
              captures: { b_v: $.data.version }
          trigger:
            - call: "POST /members/${b_id}/freeze"
              payload: { expected_member_version: "${b_v}" }
              as: Member
              as_user_id: "${a_id}"
              captures: { err: $.data.error_id }
          assert:
            - "response.http_status == 403"
            - "response.data.error_id == ERR_FORBIDDEN"

      - name: front_desk_cannot_create_plan
        claim_type: peer_roles
        grounds: [roles, "validations[priority=2]", "errors[ERR_FORBIDDEN]"]
        distinguishing_aspect: "FrontDeskStaff cannot POST /membership-plans (a SalonManager-exclusive operation); returns ERR_FORBIDDEN (403)."
        test_recipe:
          setup: ["Empty DB."]
          setup_api_calls: []
          trigger:
            - call: "POST /membership-plans"
              payload: { tier_code: "BASIC", monthly_fee_cents: 3000, weekly_uv_session_cap: 0 }
              as: FrontDeskStaff
              captures: { err: $.data.error_id }
          assert:
            - "response.http_status == 403"
            - "response.data.error_id == ERR_FORBIDDEN"

      - name: missing_auth_headers_rejected
        claim_type: peer_roles
        grounds: ["validations[priority=1]", "errors[ERR_MISSING_AUTH_HEADERS]"]
        distinguishing_aspect: "A request with no X-User-Role / X-User-ID headers returns ERR_MISSING_AUTH_HEADERS (401) before any role check."
        test_recipe:
