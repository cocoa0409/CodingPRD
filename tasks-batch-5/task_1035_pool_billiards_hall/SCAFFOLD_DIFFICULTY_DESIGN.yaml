  # =================================================================
  - rule_id: boundary_precision_check
    instances:
      - name: peak_boundary_offpeak_window_ends_exactly_1800
        grounds:
          - calculations.table_session_charge
          - state_machines.TableSession.OPEN_to_CLOSED
          - entities.PoolTable.fields.hourly_rate_cents
        distinguishing_aspect: "A walk-in session [17:30,18:00) has peak_min == 0 (18:00 is the first peak minute, exclusive upper bound of the off-peak window) so final_charge_cents == 600 with no peak surcharge — a time-threshold boundary reached via POST /sessions/{id}/close."
        test_recipe:
          setup:
            - "Rate-1200 table; clock 2026-07-02T17:30; a walk-in session (no member) opened at 17:30."
          setup_api_calls:
            - call: "POST /v1/tables"
              payload: { table_number: 9, table_type: "POOL_9FT", seat_capacity: 6, hourly_rate_cents: 1200 }
              as: Manager
              captures: { b1t: "$.data.id" }
            - call: "POST /v1/_clock/set_current_utc"
              payload: { to_iso8601: "2026-07-02T17:30:00Z" }
              as: Manager
            - call: "POST /v1/sessions"
              payload: { table_id: "${b1t}" }
              as: FrontDesk
              captures: { b1s: "$.data.id" }
          trigger:
            - call: "POST /v1/_clock/set_current_utc"
              payload: { to_iso8601: "2026-07-02T18:00:00Z" }
              as: Manager
            - call: "POST /v1/sessions/${b1s}/close"
              payload: {}
              as: FrontDesk
          assert:
            - "TableSession.${b1s}.final_charge_cents == 600"

      - name: seed_requires_at_least_four_entries_three_fails
        grounds:
          - validations[priority=12]
          - state_machines.Tournament.REGISTRATION_OPEN_to_SEEDED
          - errors[ERR_PRECONDITION_NOT_MET]
        distinguishing_aspect: "Seeding a REGISTRATION_OPEN tournament holding exactly 3 captured entries (one below MIN_TOURNAMENT_ENTRIES=4) fails with ERR_PRECONDITION_NOT_MET — a count boundary on a different endpoint (POST /tournaments/{id}/seed) than the peak-minute boundary."
        test_recipe:
          setup:
            - "Tournament (entry_fee 0) REGISTRATION_OPEN with exactly 3 ENTERED entries."
          setup_api_calls:
            - call: "POST /v1/plans"
              payload: { tier: "BRONZE", monthly_fee_cents: 3000, table_discount_pct: 0.0 }
              as: Manager
              captures: { b2p: "$.data.id" }
            - call: "POST /v1/members"
              payload: { email: "b2a@x.com", full_name: "B2A", plan_id: "${b2p}" }
              as: Manager
              captures: { b2m1: "$.data.id" }
            - call: "POST /v1/members"
              payload: { email: "b2b@x.com", full_name: "B2B", plan_id: "${b2p}" }
              as: Manager
              captures: { b2m2: "$.data.id" }
            - call: "POST /v1/members"
              payload: { email: "b2c@x.com", full_name: "B2C", plan_id: "${b2p}" }
              as: Manager
              captures: { b2m3: "$.data.id" }
            - call: "POST /v1/tournaments"
              payload: { name: "ThreeCup", format: "ROUND_ROBIN", entry_fee_cents: 0, max_entries: 8 }
              as: Manager
              captures: { b2t: "$.data.id" }
            - call: "POST /v1/tournaments/${b2t}/open"
              payload: {}
              as: Manager
            - call: "POST /v1/tournament-entries"
              payload: { tournament_id: "${b2t}", member_id: "${b2m1}" }
              as: Member
              as_user_id: "${b2m1}"
            - call: "POST /v1/tournament-entries"
              payload: { tournament_id: "${b2t}", member_id: "${b2m2}" }
              as: Member
              as_user_id: "${b2m2}"
            - call: "POST /v1/tournament-entries"
              payload: { tournament_id: "${b2t}", member_id: "${b2m3}" }
              as: Member
              as_user_id: "${b2m3}"
          trigger:
            - call: "POST /v1/tournaments/${b2t}/seed"
              payload: {}
              as: Manager
              captures: { errb2: "$.data.error_id" }
          assert:
            - "trigger response data.error_id == ERR_PRECONDITION_NOT_MET"
            - "Tournament.${b2t}.status == REGISTRATION_OPEN"

  # =================================================================
  - rule_id: cross_entity_state_dependency
    instances:
      - name: checkin_requires_table_active
        grounds:
          - state_machines.Reservation.CONFIRMED_to_CHECKED_IN
          - state_machines.PoolTable.ACTIVE_to_MAINTENANCE
          - errors[ERR_TABLE_NOT_ACTIVE]
        distinguishing_aspect: "Reservation CONFIRMED->CHECKED_IN is blocked when its PoolTable is MAINTENANCE — a Reservation->PoolTable cross-entity dependency yielding ERR_TABLE_NOT_ACTIVE."
        test_recipe:
          setup:
            - "Member funded; reservation 2026-07-02T10:00-11:00 CONFIRMED; clock 10:01 (past start so table maintenance does not cancel it); table then put into MAINTENANCE."
          setup_api_calls:
            - call: "POST /v1/plans"
              payload: { tier: "BRONZE", monthly_fee_cents: 3000, table_discount_pct: 0.0 }
              as: Manager
              captures: { c1p: "$.data.id" }
            - call: "POST /v1/members"
              payload: { email: "ce1@x.com", full_name: "CE One", plan_id: "${c1p}" }
              as: Manager
              captures: { c1m: "$.data.id" }
            - call: "POST /v1/members/${c1m}/wallet/adjustments"
              payload: { amount_cents: 50000 }
              as: Manager
            - call: "POST /v1/tables"
              payload: { table_number: 10, table_type: "POOL_7FT", seat_capacity: 4, hourly_rate_cents: 1000 }
              as: Manager
              captures: { c1t: "$.data.id" }
            - call: "POST /v1/reservations"
              payload: { member_id: "${c1m}", table_id: "${c1t}", start_at: "2026-07-02T10:00:00Z", end_at: "2026-07-02T11:00:00Z", party_size: 2 }
              as: FrontDesk
              captures: { c1r: "$.data.id" }
            - call: "POST /v1/reservations/${c1r}/confirm"
              payload: {}
              as: FrontDesk
            - call: "POST /v1/_clock/set_current_utc"
              payload: { to_iso8601: "2026-07-02T10:01:00Z" }
              as: Manager
            - call: "POST /v1/tables/${c1t}/maintenance"
              payload: {}
              as: Manager
          trigger:
            - call: "POST /v1/reservations/${c1r}/check-in"
              payload: {}
              as: FrontDesk
              captures: { errc1: "$.data.error_id" }
          assert:
            - "trigger response data.error_id == ERR_TABLE_NOT_ACTIVE"
            - "Reservation.${c1r}.status == CONFIRMED"

      - name: entry_checkin_requires_tournament_seeded
        grounds:
          - state_machines.TournamentEntry.ENTERED_to_CHECKED_IN
          - state_machines.Tournament
          - errors[ERR_DEPENDENT_STATE]
        distinguishing_aspect: "TournamentEntry ENTERED->CHECKED_IN requires its Tournament to be SEEDED; while REGISTRATION_OPEN it fails with ERR_DEPENDENT_STATE — a TournamentEntry->Tournament dependency, a different entity pair than Reservation->PoolTable."
        test_recipe:
          setup:
            - "Tournament (entry_fee 0) REGISTRATION_OPEN (never seeded) with one ENTERED entry."
          setup_api_calls:
            - call: "POST /v1/plans"
              payload: { tier: "BRONZE", monthly_fee_cents: 3000, table_discount_pct: 0.0 }
              as: Manager
              captures: { c2p: "$.data.id" }
            - call: "POST /v1/members"
              payload: { email: "ce2@x.com", full_name: "CE Two", plan_id: "${c2p}" }
              as: Manager
              captures: { c2m: "$.data.id" }
            - call: "POST /v1/tournaments"
              payload: { name: "OpenCup", format: "SINGLE_ELIM", entry_fee_cents: 0, max_entries: 8 }
              as: Manager
              captures: { c2t: "$.data.id" }
            - call: "POST /v1/tournaments/${c2t}/open"
              payload: {}
              as: Manager
            - call: "POST /v1/tournament-entries"
              payload: { tournament_id: "${c2t}", member_id: "${c2m}" }
              as: Member
              as_user_id: "${c2m}"
              captures: { c2e: "$.data.id" }
          trigger:
            - call: "POST /v1/tournament-entries/${c2e}/check-in"
              payload: {}
              as: FrontDesk
              captures: { errc2: "$.data.error_id" }
          assert:
            - "trigger response data.error_id == ERR_DEPENDENT_STATE"
            - "TournamentEntry.${c2e}.status == ENTERED"

  # =================================================================
  - rule_id: resource_temporal_overlap
    instances:
      - name: reservation_turnover_buffer_five_minute_gap_conflicts
        grounds:
          - validations[priority=8]
          - errors[ERR_TABLE_TIME_CONFLICT]
          - entities.Reservation.fields.start_at
        distinguishing_aspect: "A new reservation 11:05-12:00 starting only 5 minutes after an existing 10:00-11:00 reservation on the same table is rejected because the gap is under TURNOVER_BUFFER_MINUTES=10 — buffered-adjacency interval semantics on PoolTable."
        test_recipe:
          setup:
            - "Table with a CONFIRMED reservation 2026-07-07T10:00-11:00."
          setup_api_calls:
            - call: "POST /v1/plans"
              payload: { tier: "BRONZE", monthly_fee_cents: 3000, table_discount_pct: 0.0 }
              as: Manager
