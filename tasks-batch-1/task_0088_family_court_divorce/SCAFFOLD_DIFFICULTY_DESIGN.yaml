  - rule_id: boundary_precision_check
    instances:
      # ----- Instance 1: shared-custody threshold >= 0.40 (numeric crossing) -----
      - name: shared_custody_offset_at_exact_40pct_boundary
        grounds:
          - calculations.child_support_guideline
          - calculations.parenting_time_percentage
          - entities.GuidelineSchedule.fields.shared_custody_threshold_pct
        distinguishing_aspect: |
          Numeric boundary on the child-support endpoint: payor_time_pct == 0.4000
          exactly (146/365) triggers the shared-custody offset because the test is `>=`,
          not `>`. Obligation 50000 -> 50000*(1-0.40)=30000. At 145/365 (=0.3973) the
          offset does NOT apply.
        test_recipe:
          setup:
            - "Case(CA) DEFAULT_PENDING; 1 child; petitioner gross 400000, respondent gross 400000 (combined 800000 -> tier1 base 100000, one child); plan PROPOSED petitioner 146/respondent 219 so payor(=petitioner, lower overnights)_time_pct=0.40."
