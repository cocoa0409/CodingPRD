            - { call: "POST /itad/recycle-batches/${bc}/items", payload: { item_id: "${ic}" }, as: LogisticsCoordinator }
          trigger:
            - { call: "POST /itad/recycle-batches/${bb}/ship", payload: {}, as: LogisticsCoordinator, captures: { bb_status: $.data.status } }
            - { call: "POST /itad/recycle-batches/${bc}/ship", payload: {}, as: LogisticsCoordinator, captures: { err: $.data.error_id } }
          assert:
            - "batch B ship succeeds (status IN_TRANSIT): 60.0 + 40.0 == 100.0 exactly equals capacity and is allowed"
            - "batch C ship fails with ERR_RECYCLER_DAILY_CAPACITY_EXCEEDED: 100.001 > 100.0 by 0.001 kg"

      - name: reconcile_with_zero_items_is_empty_error
        grounds:
          - validations[priority=25]
        distinguishing_aspect: |
          Boundary on the count metric via POST /itad/manifests/{id}/reconcile: zero
          scanned items is the empty-collection edge and yields ERR_MANIFEST_EMPTY,
          not ERR_MANIFEST_ITEM_COUNT_MISMATCH (which requires >= 1 scanned item) —
          a different metric (count vs weight) on a different endpoint than the
          capacity boundary.
        test_recipe:
          setup:
            - "Account; clock 2026-05-01; manifest declared 1, SCHEDULED then RECEIVED, with zero items scanned"
          setup_api_calls:
            - { call: "POST /itad/accounts", payload: { company_name: "Zero Co", contact_email: "z@zero.example" }, as: PlatformAdmin, captures: { acct: $.data.id } }
            - { call: "POST /itad/_clock/set_current_utc", payload: { to_iso8601: "2026-05-01T00:00:00Z" }, as: PlatformAdmin }
            - { call: "POST /itad/manifests", payload: { account_id: "${acct}", mode: "DROPOFF", scheduled_start: "2026-06-01T09:00:00Z", scheduled_end: "2026-06-01T11:00:00Z", declared_item_count: 1 }, as: AccountManager, as_user_id: "${acct}", captures: { m: $.data.id } }
            - { call: "POST /itad/manifests/${m}/schedule", payload: {}, as: LogisticsCoordinator }
            - { call: "POST /itad/manifests/${m}/receive", payload: {}, as: IntakeOperator }
          trigger:
            - { call: "POST /itad/manifests/${m}/reconcile", payload: {}, as: IntakeOperator, captures: { err: $.data.error_id } }
          assert:
            - "error_id == ERR_MANIFEST_EMPTY (priority 25, count == 0) and not ERR_MANIFEST_ITEM_COUNT_MISMATCH"
            - "Manifest.${m}.status remains RECEIVED"

  - rule_id: cross_entity_state_dependency
    instances:
      - name: triage_blocked_until_manifest_received
        grounds:
          - validations[priority=9]
          - state_machines.Item.INTAKE_to_FOR_RESALE
        distinguishing_aspect: |
          Entity pair Item -> Manifest: an Item scanned into a DRAFT manifest cannot
          be triaged; only the owning Manifest reaching RECEIVED unlocks the Item's
          triage transitions (ERR_MANIFEST_NOT_RECEIVED).
        test_recipe:
          setup:
            - "Account; clock 2026-05-01; manifest still DRAFT (declared 1); one item already pre-declared into it (item intake is allowed in DRAFT)"
          setup_api_calls:
            - { call: "POST /itad/accounts", payload: { company_name: "Gate Co", contact_email: "g@gate.example" }, as: PlatformAdmin, captures: { acct: $.data.id } }
            - { call: "POST /itad/_clock/set_current_utc", payload: { to_iso8601: "2026-05-01T00:00:00Z" }, as: PlatformAdmin }
            - { call: "POST /itad/manifests", payload: { account_id: "${acct}", mode: "DROPOFF", scheduled_start: "2026-06-01T09:00:00Z", scheduled_end: "2026-06-01T11:00:00Z", declared_item_count: 1 }, as: AccountManager, as_user_id: "${acct}", captures: { m: $.data.id } }
            - { call: "POST /itad/manifests/${m}/items", payload: { serial_number: "SN-G1", category: "LAPTOP", weight_kg: 2.0, data_bearing: false, hazmat_flag: false, declared_grade: "A" }, as: IntakeOperator, captures: { i1: $.data.id } }
          trigger:
            - { call: "POST /itad/items/${i1}/triage", payload: { disposition: "RESALE" }, as: IntakeOperator, captures: { err: $.data.error_id } }
          assert:
            - "error_id == ERR_MANIFEST_NOT_RECEIVED (Item transition gated on Manifest state)"
            - "Item.${i1}.processing_status remains INTAKE"

      - name: codd_blocked_until_sanitization_verified
        grounds:
          - validations[priority=13]
          - state_machines.DataSanitization.LOGGED_to_VERIFIED
        distinguishing_aspect: |
          Entity pair Certificate -> DataSanitization: issuing a CODD for an item
          whose latest sanitization record is merely LOGGED (data_status SANITIZED,
          not VERIFIED) is rejected; only the DataSanitization reaching VERIFIED
          unblocks certificate issuance — a different entity pair than Item -> Manifest.
        test_recipe:
          setup:
            - "Account; clock 2026-05-01; R2 policy ACTIVE; manifest (declared 1) RECEIVED"
            - "One data-bearing LAPTOP grade B triaged REFURB; a PASS sanitization logged by tech-1 but not yet verified"
          setup_api_calls:
            - { call: "POST /itad/accounts", payload: { company_name: "Cert Co", contact_email: "c@cert.example" }, as: PlatformAdmin, captures: { acct: $.data.id } }
            - { call: "POST /itad/_clock/set_current_utc", payload: { to_iso8601: "2026-05-01T00:00:00Z" }, as: PlatformAdmin }
            - { call: "POST /itad/compliance-policies", payload: { standard: "R2", sanitization_methods_allowed: ["CRYPTO_ERASE", "NIST_CLEAR", "NIST_PURGE", "PHYSICAL_DESTROY"], export_allowed: true, resale_requires_verified_sanitization: true, is_active: true, weight_cert_freshness: 0.5, weight_volume: 0.2, weight_violations: 0.3 }, as: PlatformAdmin }
            - { call: "POST /itad/manifests", payload: { account_id: "${acct}", mode: "DROPOFF", scheduled_start: "2026-06-01T09:00:00Z", scheduled_end: "2026-06-01T11:00:00Z", declared_item_count: 1 }, as: AccountManager, as_user_id: "${acct}", captures: { m: $.data.id } }
            - { call: "POST /itad/manifests/${m}/schedule", payload: {}, as: LogisticsCoordinator }
            - { call: "POST /itad/manifests/${m}/receive", payload: {}, as: IntakeOperator }
            - { call: "POST /itad/manifests/${m}/items", payload: { serial_number: "SN-D1", category: "LAPTOP", weight_kg: 2.0, data_bearing: true, hazmat_flag: false, declared_grade: "B" }, as: IntakeOperator, captures: { i1: $.data.id } }
            - { call: "POST /itad/items/${i1}/triage", payload: { disposition: "REFURB" }, as: IntakeOperator }
            - { call: "POST /itad/items/${i1}/sanitizations", payload: { method: "NIST_CLEAR", outcome: "PASS" }, as: DestructionTechnician, as_user_id: "tech-1", captures: { s1: $.data.id } }
          trigger:
            - { call: "POST /itad/items/${i1}/certificates", payload: { cert_type: "DATA_DESTRUCTION" }, as: ComplianceOfficer, as_user_id: "co-1", captures: { err: $.data.error_id } }
            - { call: "POST /itad/sanitizations/${s1}/verify", payload: { verdict: "APPROVE" }, as: ComplianceOfficer, as_user_id: "co-1" }
            - { call: "POST /itad/items/${i1}/certificates", payload: { cert_type: "DATA_DESTRUCTION" }, as: ComplianceOfficer, as_user_id: "co-1", captures: { cert_status: $.data.status, cert_num: $.data.certificate_number, cert_item: $.data.item_id } }
          assert:
            - "first issuance attempt fails with ERR_DATA_SANITIZATION_UNVERIFIED while the record is LOGGED"
            - "after verification APPROVE, issuance succeeds: status ISSUED, certificate_number matches CERT-XXXXXXXX, item_id == ${i1}"

  - rule_id: resource_temporal_overlap
    instances:
      - name: pickup_route_windows_half_open_overlap
        grounds:
          - validations[priority=22]
        distinguishing_aspect: |
          Interval semantics: pairwise half-open [start, end) overlap on the
          pickup_route resource — 10:00-12:00 collides with an existing 09:00-11:00
          manifest (rejected), while 11:00-13:00 is merely adjacent (end == start)
          and is accepted.
        test_recipe:
          setup:
            - "Account; clock 2026-05-01; manifest M1 PICKUP route R-9 window 2026-06-01 09:00-11:00 already SCHEDULED"
            - "M2 same route 10:00-12:00 (overlapping) and M3 same route 11:00-13:00 (adjacent), both DRAFT"
          setup_api_calls:
            - { call: "POST /itad/accounts", payload: { company_name: "Route Co", contact_email: "r@route.example" }, as: PlatformAdmin, captures: { acct: $.data.id } }
            - { call: "POST /itad/_clock/set_current_utc", payload: { to_iso8601: "2026-05-01T00:00:00Z" }, as: PlatformAdmin }
            - { call: "POST /itad/manifests", payload: { account_id: "${acct}", mode: "PICKUP", pickup_route: "R-9", scheduled_start: "2026-06-01T09:00:00Z", scheduled_end: "2026-06-01T11:00:00Z", declared_item_count: 1 }, as: AccountManager, as_user_id: "${acct}", captures: { m1: $.data.id } }
            - { call: "POST /itad/manifests/${m1}/schedule", payload: {}, as: LogisticsCoordinator }
            - { call: "POST /itad/manifests", payload: { account_id: "${acct}", mode: "PICKUP", pickup_route: "R-9", scheduled_start: "2026-06-01T10:00:00Z", scheduled_end: "2026-06-01T12:00:00Z", declared_item_count: 1 }, as: AccountManager, as_user_id: "${acct}", captures: { m2: $.data.id } }
            - { call: "POST /itad/manifests", payload: { account_id: "${acct}", mode: "PICKUP", pickup_route: "R-9", scheduled_start: "2026-06-01T11:00:00Z", scheduled_end: "2026-06-01T13:00:00Z", declared_item_count: 1 }, as: AccountManager, as_user_id: "${acct}", captures: { m3: $.data.id } }
          trigger:
            - { call: "POST /itad/manifests/${m2}/schedule", payload: {}, as: LogisticsCoordinator, captures: { err: $.data.error_id } }
            - { call: "POST /itad/manifests/${m3}/schedule", payload: {}, as: LogisticsCoordinator, captures: { m3_status: $.data.status } }
          assert:
            - "M2 schedule fails with ERR_ROUTE_WINDOW_CONFLICT (10:00-12:00 overlaps 09:00-11:00)"
            - "M3 schedule succeeds (status SCHEDULED): 11:00 == M1 end is adjacency, allowed under half-open semantics"

      - name: delivery_date_outside_cert_validity_window
        grounds:
          - validations[priority=23]
        distinguishing_aspect: |
          Interval semantics: point-in-interval containment on the Recycler resource —
          the delivery instant must lie in (-infinity, certification_expires_at) with
          an EXCLUSIVE expiry bound: delivery at 2026-05-31 is inside, delivery exactly
          at the 2026-06-01T00:00:00Z expiry instant is outside. Different resource and
          different geometric treatment (containment vs pairwise overlap) than the
          route-window rule.
        test_recipe:
          setup:
            - "Clock 2026-05-01; recycler whose certification_expires_at is exactly 2026-06-01T00:00:00Z"
          setup_api_calls:
            - { call: "POST /itad/_clock/set_current_utc", payload: { to_iso8601: "2026-05-01T00:00:00Z" }, as: PlatformAdmin }
            - { call: "POST /itad/recyclers", payload: { name: "RecX", certification_standard: "E_STEWARDS", certification_expires_at: "2026-06-01T00:00:00Z", accepted_categories: ["OTHER"], daily_intake_capacity_kg: 1000, violation_count: 0 }, as: ComplianceOfficer, captures: { rec: $.data.id } }
          trigger:
            - { call: "POST /itad/recycle-batches", payload: { recycler_id: "${rec}", scheduled_delivery_date: "2026-05-31T00:00:00Z", is_export: false }, as: LogisticsCoordinator, captures: { b1: $.data.id } }
            - { call: "POST /itad/recycle-batches", payload: { recycler_id: "${rec}", scheduled_delivery_date: "2026-06-01T00:00:00Z", is_export: false }, as: LogisticsCoordinator, captures: { err: $.data.error_id } }
          assert:
            - "delivery 2026-05-31T00:00:00Z is accepted (batch ${b1} created) — inside the validity window"
            - "delivery exactly at the expiry instant 2026-06-01T00:00:00Z fails with ERR_RECYCLER_CERT_EXPIRED — expiry bound is exclusive"

  - rule_id: compensating_invariant
    instances:
      - name: settlement_finalize_then_void_restores_balance
        grounds:
          - state_machines.Settlement.QUOTE_OPEN_to_FINALIZED
          - state_machines.Settlement.FINALIZED_to_VOIDED
        distinguishing_aspect: |
          Conserved quantity: BusinessAccount.credit_balance_cents. Finalize posts
          BUYBACK_CREDIT +51000 (balance 0 -> 51000); void posts negating REVERSAL
          entries so the balance returns to exactly 0 — forward action paired with its
          compensating action leaves the account balance unchanged.
        test_recipe:
          setup:
            - "Account; clock 2026-05-01; DROPOFF manifest (declared 1) RECONCILED; one non-data-bearing LAPTOP grade A sold at 60000 (net proceeds 51000)"
            - "QUOTE settlement finalized: balance == 51000, one BUYBACK_CREDIT ledger entry"
          setup_api_calls:
            - { call: "POST /itad/accounts", payload: { company_name: "Void Co", contact_email: "v@void.example" }, as: PlatformAdmin, captures: { acct: $.data.id } }
            - { call: "POST /itad/_clock/set_current_utc", payload: { to_iso8601: "2026-05-01T00:00:00Z" }, as: PlatformAdmin }
            - { call: "POST /itad/manifests", payload: { account_id: "${acct}", mode: "DROPOFF", scheduled_start: "2026-06-01T09:00:00Z", scheduled_end: "2026-06-01T11:00:00Z", declared_item_count: 1 }, as: AccountManager, as_user_id: "${acct}", captures: { m: $.data.id } }
            - { call: "POST /itad/manifests/${m}/schedule", payload: {}, as: LogisticsCoordinator }
            - { call: "POST /itad/manifests/${m}/receive", payload: {}, as: IntakeOperator }
            - { call: "POST /itad/manifests/${m}/items", payload: { serial_number: "SN-V1", category: "LAPTOP", weight_kg: 2.0, data_bearing: false, hazmat_flag: false, declared_grade: "A" }, as: IntakeOperator, captures: { i1: $.data.id } }
            - { call: "POST /itad/items/${i1}/triage", payload: { disposition: "RESALE" }, as: IntakeOperator }
            - { call: "POST /itad/listings", payload: { item_id: "${i1}", asking_price_cents: 60000, floor_price_cents: 50000, channel: "RETAIL" }, as: IntakeOperator, captures: { l1: $.data.id } }
            - { call: "POST /itad/listings/${l1}/sell", payload: { sale_price_cents: 60000 }, as: IntakeOperator }
            - { call: "POST /itad/manifests/${m}/reconcile", payload: {}, as: IntakeOperator }
            - { call: "GET /itad/manifests/${m}", payload: {}, as: IntakeOperator, captures: { m_v: $.data.version } }
            - { call: "POST /itad/manifests/${m}/settlements", payload: { expected_manifest_version: "${m_v}" }, as: IntakeOperator, captures: { s: $.data.id } }
            - { call: "POST /itad/settlements/${s}/finalize", payload: {}, as: PlatformAdmin }
            - { call: "GET /itad/accounts/${acct}", payload: {}, as: PlatformAdmin, captures: { bal_final: $.data.credit_balance_cents } }
          trigger:
            - { call: "POST /itad/settlements/${s}/void", payload: {}, as: PlatformAdmin, captures: { s_status: $.data.status } }
            - { call: "GET /itad/accounts/${acct}", payload: {}, as: PlatformAdmin, captures: { bal_void: $.data.credit_balance_cents } }
            - { call: "GET /itad/settlements/${s}/ledger-entries", payload: {}, as: PlatformAdmin, captures: { e0_type: "$.data[0].entry_type", e0_amt: "$.data[0].amount_cents", e1_type: "$.data[1].entry_type", e1_amt: "$.data[1].amount_cents" } }
          assert:
            - "bal_final == 51000 after finalize (BUYBACK_CREDIT +51000; fees 0 and rebate 0 entries skipped)"
            - "after void: credit_balance_cents == 0 exactly — compensating invariant holds"
            - "ledger shows e0 BUYBACK_CREDIT +51000 then e1 REVERSAL -51000; Settlement.${s}.status == VOIDED"

      - name: batch_item_add_then_remove_restores_weight
        grounds:
          - state_machines.Item.FOR_RECYCLE_to_BATCHED
          - state_machines.Item.BATCHED_to_FOR_RECYCLE
        distinguishing_aspect: |
          Conserved quantity: RecycleBatch.gross_weight_kg / item_count and the item's
          routing fields. Adding a 12.5 kg item then removing it returns the batch to
          exactly gross 0.0 / count 0 and the item to FOR_RECYCLE with
          recycle_batch_id null — a different conserved quantity than money.
        test_recipe:
          setup:
            - "Account; clock 2026-05-01; recycler accepts SERVER (cert 2027-05-01, capacity 1000)"
            - "Manifest (declared 1) RECEIVED; one 12.5 kg non-data SERVER triaged RECYCLE"
            - "Empty STAGING batch exists (gross_weight_kg 0.0, item_count 0)"
          setup_api_calls:
            - { call: "POST /itad/accounts", payload: { company_name: "Weight Co", contact_email: "w@weight.example" }, as: PlatformAdmin, captures: { acct: $.data.id } }
            - { call: "POST /itad/_clock/set_current_utc", payload: { to_iso8601: "2026-05-01T00:00:00Z" }, as: PlatformAdmin }
            - { call: "POST /itad/recyclers", payload: { name: "RecW", certification_standard: "R2", certification_expires_at: "2027-05-01T00:00:00Z", accepted_categories: ["SERVER"], daily_intake_capacity_kg: 1000, violation_count: 0 }, as: ComplianceOfficer, captures: { rec: $.data.id } }
            - { call: "POST /itad/manifests", payload: { account_id: "${acct}", mode: "DROPOFF", scheduled_start: "2026-06-01T09:00:00Z", scheduled_end: "2026-06-01T11:00:00Z", declared_item_count: 1 }, as: AccountManager, as_user_id: "${acct}", captures: { m: $.data.id } }
            - { call: "POST /itad/manifests/${m}/schedule", payload: {}, as: LogisticsCoordinator }
            - { call: "POST /itad/manifests/${m}/receive", payload: {}, as: IntakeOperator }
            - { call: "POST /itad/manifests/${m}/items", payload: { serial_number: "SN-W1", category: "SERVER", weight_kg: 12.5, data_bearing: false, hazmat_flag: false, declared_grade: "C" }, as: IntakeOperator, captures: { i1: $.data.id } }
            - { call: "POST /itad/items/${i1}/triage", payload: { disposition: "RECYCLE" }, as: IntakeOperator }
            - { call: "POST /itad/recycle-batches", payload: { recycler_id: "${rec}", scheduled_delivery_date: "2026-06-10T00:00:00Z", is_export: false }, as: LogisticsCoordinator, captures: { b1: $.data.id, b_g0: $.data.gross_weight_kg, b_c0: $.data.item_count } }
            - { call: "POST /itad/recycle-batches/${b1}/items", payload: { item_id: "${i1}" }, as: LogisticsCoordinator, captures: { b_g1: $.data.gross_weight_kg, b_c1: $.data.item_count } }
          trigger:
            - { call: "DELETE /itad/recycle-batches/${b1}/items/${i1}", payload: {}, as: LogisticsCoordinator }
            - { call: "GET /itad/recycle-batches/${b1}", payload: {}, as: LogisticsCoordinator, captures: { b_g2: $.data.gross_weight_kg, b_c2: $.data.item_count } }
            - { call: "GET /itad/items/${i1}", payload: {}, as: LogisticsCoordinator, captures: { i_proc: $.data.processing_status, i_batch: $.data.recycle_batch_id } }
          assert:
            - "before add: b_g0 == 0.0 and b_c0 == 0; after add: b_g1 == 12.5 and b_c1 == 1"
            - "after remove: RecycleBatch.${b1}.gross_weight_kg == 0.0 and item_count == 0 — identical to pre-add state"
            - "Item.${i1}.processing_status == FOR_RECYCLE and recycle_batch_id is null"
