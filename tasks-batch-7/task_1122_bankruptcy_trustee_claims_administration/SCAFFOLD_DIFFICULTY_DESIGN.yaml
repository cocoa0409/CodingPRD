              captures: { out_err: $.data.error_id }
          assert:
            - "edge_avoidable == true and edge_status == ANALYZED   # exact window-edge date is avoidable (>=)"
            - "out_avoidable == false and out_err == ERR_TRANSFER_NOT_AVOIDABLE   # one day earlier is outside"

  # =====================================================================
  # Rule 7 — cross_entity_state_dependency: two dependencies across
  # DIFFERENT entity pairs
  # =====================================================================
  - rule_id: cross_entity_state_dependency
    instances:
      - name: plan_confirm_gated_by_case_posture
        grounds:
          - state_machines.DistributionPlan.PROPOSED_to_CONFIRMED
          - errors[ERR_CASE_NOT_IN_DISTRIBUTION]
        distinguishing_aspect: |
          Pair = DistributionPlan -> Case. A plan may be proposed early but
          confirm is only valid while the PARENT Case is in DISTRIBUTION;
          confirming while the case is still in LIQUIDATION is rejected even
          though the plan's own state (PROPOSED) is valid.
        test_recipe:
          setup:
            - "Case in LIQUIDATION (claims all allowed, sale consummated so cash > 0); a DistributionPlan already PROPOSED via an earlier distribution window is impossible — instead we propose is blocked in LIQUIDATION, so we drive: enter DISTRIBUTION, propose plan, then attempt confirm after case is re-gated. Simplest deterministic variant: propose is only reachable in DISTRIBUTION; to observe the gate we instead try confirm on a case that never entered DISTRIBUTION by proposing through the propose endpoint's own case-state allowance. The gate under test: confirm rejected when case.status != DISTRIBUTION."
            - "Concretely: Case driven to CLAIMS_ADMINISTRATION only; plan proposal endpoint is case-state-gated as well, so the observable dependency test uses begin_distribution denial + a direct plan proposal attempt to prove the register/ledger gate."
          setup_api_calls:
            - call: "POST /trustee/creditors"
              payload: { legal_name: "Creditor L", creditor_ref: "CR-L-1", contact_email: "l@x.com" }
              as: Clerk
              captures: { cred_l: $.data.id }
            - call: "POST /trustee/cases"
              payload: { case_number: "26-10013", debtor_name: "Debtor Thirteen", filed_on: "2026-01-15T00:00:00Z", district: "D.Del.", trustee_user_id: "trust-0001" }
              as: Clerk
              captures: { case_id: $.data.id }
