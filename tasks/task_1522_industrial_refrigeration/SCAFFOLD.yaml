    description: "Post an append-only charge ledger entry. OCC-guarded by expected_facility_version."
    roles: [Operator]
    code: 201
    input: [facility_id, "system_id?", adjustment_type, quantity_lbs, reason, expected_facility_version]
    output: ChargeAdjustment
    side_effects:
      - "rounded_lbs = round_half_up(quantity_lbs, 0.1) stamped on the entry"
      - "increments Facility.version by 1"
      - "Facility.total_charge_lbs recomputed (book variant); charge_posture recomputed"
      - "Cascade (threshold crossing): if charge_posture flips BELOW_THRESHOLD -> AT_OR_ABOVE_THRESHOLD then psm_program_status -> REQUIRED and a ComplianceAudit (origin=AUTO_THRESHOLD, status=SCHEDULED, scheduled_start_at=now, due_at=now+1095 days) is auto-created"

  - method: GET
    path: "/psm/charge-adjustments/{id}"
    description: "Get a charge adjustment"
