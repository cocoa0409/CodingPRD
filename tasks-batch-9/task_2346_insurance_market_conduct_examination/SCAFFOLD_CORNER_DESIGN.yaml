  - section: endpoints
    instances:

      - name: criticism_reads_honour_every_declared_query_filter
        claim_type: standard_crud
        grounds:
          - endpoints[GET /market-conduct/criticisms]
          - endpoints[GET /market-conduct/criticisms/{id}]
          - endpoints[GET /market-conduct/criticisms/{id}/responses]
        distinguishing_aspect: |
          The criticism collection declares three orthogonal filters and they must compose rather than
          override one another: filtering by examination, by scope area and by status over the same two
          criticisms on two different areas gives four different result sets. The nested response
          collection then filters on position, which is the only place a CompanyResponse is reachable at
          all, and its rows must come back in round order because the entity carries no version.
        test_recipe:
          setup:
            - "One examination with two tested areas and two criticisms in different states."
