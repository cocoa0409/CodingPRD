          - calculations.storage_footprint
          - endpoints.POST_/finished-units/{finished_unit_id}/store
        distinguishing_aspect: "A hull is refused 409 ERR_NO_ELIGIBLE_ZONE at a site whose SITE-WIDE aggregate would have accepted it (1.0000 needed against 1.2000 free), because no single zone can hold 1.0000; and at a second site the two stores together land on exactly the capacity, showing that rung 75's inequality can only ever be met at equality — which passes."
        test_recipe:
          setup:
            - "Logical clock at 2026-08-01T00:00:00Z. ProductModel PM-CVR (gross_cube_m3 1.0000, nest_factor 0.5000) with the 2-cavity mould MLD-CVR-1, oven OV-CVR, bay CB-CVR and resin lot LOT-CVR."
            - "Warehouse WH-CVI has footprint_capacity_cube_m3 1.2000 split into TWO zones of 0.6000 each; no hull is stored, so the site has 1.2000 free but no zone has more than 0.6000 free."
            - "Warehouse WH-CVJ has footprint_capacity_cube_m3 2.0000 split into two zones of 1.0000 each and is likewise empty. Both sites keep the default thresholds 85.00 / 95.00 and posture NORMAL."
            - "ProductionOrder PO-CVR1 targets WH-CVI and produced fu1 (SELLABLE) and fu2 (still DEMOLDED). ProductionOrder PO-CVR2 targets WH-CVJ and produced fu3 and fu4, both SELLABLE. Neither order carries a demand_bucket_id, so rungs 69 and 74 are out of scope."
