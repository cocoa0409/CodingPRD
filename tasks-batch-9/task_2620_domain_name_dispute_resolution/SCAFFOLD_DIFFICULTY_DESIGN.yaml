          The identical nomination request against the identical pair of rows returns two different
          errors depending only on where the clock sits: at 2026-08-15 the candidate window overlaps
          the panelist's live engagement and the load has also reached the ceiling, so priority 66
          answers ERR_PANELIST_WINDOW_CONFLICT; at 2026-08-24 the engagement window has closed on its
