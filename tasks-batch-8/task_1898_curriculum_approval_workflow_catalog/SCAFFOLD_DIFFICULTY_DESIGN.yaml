  - rule_id: priority_pair_validation_conflict
    instances:
      - name: priority_state_vs_temporal_submit_frozen_term
        grounds:
          - validations[priority=6]
          - validations[priority=10]
          - errors[ERR_INVALID_STATE]
          - errors[ERR_PROPOSAL_WINDOW_CLOSED]
        distinguishing_aspect: |
          Error-category pair state vs business_temporal: a resubmission that is BOTH
          out-of-state (proposal already in DEPT_REVIEW — no submit transition exists) AND
          past the term's proposal freeze must surface the priority-6 state error
          ERR_INVALID_STATE, not the priority-10 ERR_PROPOSAL_WINDOW_CLOSED.
        test_recipe:
          setup:
            - "Department CS; term T1 OPEN; NEW_COURSE proposal submitted (now in DEPT_REVIEW)"
            - "logical clock advanced past T1.proposal_freeze_at and T1 frozen (PROPOSAL_FROZEN)"
          setup_api_calls:
            - { call: "POST /curriculum/departments", payload: { dept_name: "Computer Science", subject_codes: ["CS"], college: "Engineering" }, as: Registrar, as_user_id: "reg-1", captures: { dept_cs: $.data.id } }
            - { call: "POST /curriculum/terms", payload: { term_code: "2026FA", academic_year: "2026-2027", sequence_index: 1, classes_start_date: "2026-08-24", classes_end_date: "2026-12-15", proposal_freeze_at: "2026-10-01T00:00:00Z", catalog_freeze_at: "2027-01-10T00:00:00Z" }, as: Registrar, as_user_id: "reg-1", captures: { t1: $.data.id } }
            - { call: "POST /curriculum/proposals", payload: { proposal_type: "NEW_COURSE", proposer_department_id: "${dept_cs}", requested_effective_term_id: "${t1}", proposed_subject_code: "CS", proposed_course_number: "450", proposed_title: "Compilers", proposed_credit_hours: 3, contact_hours_per_week: 3, out_of_class_hours_per_week: 6, learning_outcomes: ["build a compiler"], justification: "gap" }, as: FacultyProposer, as_user_id: "fac-001", captures: { prop: $.data.id } }
            - { call: "POST /curriculum/proposals/${prop}/submit", payload: {}, as: FacultyProposer, as_user_id: "fac-001" }
            - { call: "POST /curriculum/_clock/set_current_utc", payload: { to_iso8601: "2026-10-02T00:00:00Z" }, as: Registrar, as_user_id: "reg-1" }
            - { call: "POST /curriculum/terms/${t1}/freeze-proposals", payload: {}, as: Registrar, as_user_id: "reg-1" }
          trigger:
            - call: "POST /curriculum/proposals/${prop}/submit"
              payload: {}
              as: FacultyProposer
              as_user_id: "fac-001"
              captures: { err: $.data.error_id }
          assert:
            - "captured err == ERR_INVALID_STATE (priority 6 state beats priority 10 business_temporal even though the window is also closed)"
            - "Proposal.${prop}.status remains DEPT_REVIEW"
      - name: priority_safety_vs_referential_registrar_approve
        grounds:
          - validations[priority=9]
          - validations[priority=13]
          - errors[ERR_ACCREDITOR_NOTIFICATION_PENDING]
          - errors[ERR_TEACH_OUT_NOT_COMMITTED]
        distinguishing_aspect: |
          Error-category pair business_safety vs business_referential (different pair from
          the other instance): Registrar APPROVE of a DEACTIVATION that BOTH lacks the
          required accreditor notification (score 50, never notified) AND has no committed
          teach-out plan must surface the priority-9 ERR_ACCREDITOR_NOTIFICATION_PENDING,
          not the priority-13 ERR_TEACH_OUT_NOT_COMMITTED.
        test_recipe:
          setup:
            - "Department CS; term T1 OPEN; ACTIVE course C; DEACTIVATION proposal (declared_remaining_cohorts 2) advanced to REGISTRAR_REVIEW; FINAL score 50 so notification is required but unsent; no TeachOutPlan exists"
          setup_api_calls:
