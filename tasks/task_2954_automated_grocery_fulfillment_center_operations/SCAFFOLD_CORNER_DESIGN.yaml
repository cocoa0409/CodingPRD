      - name: zone_accuracy_scores_round_half_up_to_four_decimal_places
        claim_type: precision
        grounds:
          - calculations.zone_inventory_accuracy
          - global_constants.ACCURACY_HOLD_THRESHOLD
          - entities.GridZone.accuracy_score_unit_weighted
          - entities.GridZone.accuracy_score_sku_weighted
        distinguishing_aspect: "Both scores are rounded once, at the end, to exactly four decimals with round_half_up: 1 - 2/11 = 0.818181... becomes 0.8182 (not 0.8181 and not 0.82), while the SKU-weighted mean of 0.9 and 0.0 is the exact 0.45 written as 0.4500. Intermediate per-SKU ratios are never pre-rounded."
        test_recipe:
          setup:
            - "AMBIENT zone A1 is OPERATIONAL with both accuracy scores null. It holds SKU AMB-1 with 10 physical units and SKU AMB-2 with 1 physical unit."
          setup_api_calls:
            - call: "POST /grid-zones"
              payload: { zone_code: "A1", temperature_zone: "AMBIENT", bot_count: 4 }
