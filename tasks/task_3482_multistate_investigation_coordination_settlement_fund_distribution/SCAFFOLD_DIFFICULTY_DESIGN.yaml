            - { call: "POST /multistate/settlements/${stl}/execute", payload: {}, as: CommitteeChair, captures: { lead_cost: $.data.lead_cost_cents, distributable: $.data.distributable_cents } }
            - { call: "GET /multistate/settlements/${stl}/allocation-lines", as: CommitteeChair, captures: { ca_bonus: "$.data[0].lead_bonus_cents", tx_bonus: "$.data[1].lead_bonus_cents", ny_bonus: "$.data[2].lead_bonus_cents" } }
          assert:
            - "Settlement.${stl}.lead_cost_cents == 4500000 (min(25000000, round_half_up(90000000 * 500 / 10000)) evaluated before distributable)"
            - "Settlement.${stl}.distributable_cents == 85500000 (90000000 - 4500000, not 100000000 - 10000000 - round(x * distributable))"
            - "lead bonus pool split equally among the two SIGNED leads: CA lead_bonus_cents == 2250000, TX == 2250000, NY == 0"
      - name: per_line_floor_then_remainder_cents
        grounds:
          - calculations.line_share_cents
          - calculations.allocation_weight_normalization
        distinguishing_aspect: |
          Mode (b) nested rounding with pinned order (different mode from the circular-order
          instance): per-line floor FIRST, then remainder cents one at a time in
          (weight_bps DESC, decided_at ASC). With total 100,000,007 the floors leave a
          2-cent remainder that lands on NY then TX — a sum-then-round implementation pays
          different cents on TX and NY.
        test_recipe:
          setup:
            - "Canonical world but settlement monetary_total_cents 100,000,007 (odd cent); signed CA/TX/NY, FL DECLINED; weights 1250/3750/5000"
          setup_api_calls:
            - { call: "POST /multistate/state-offices", payload: { state_code: "CA", population: 100, harm_measure_cents: 50, appropriation_rule: "PREAPPROPRIATED" }, as: CommitteeChair, captures: { ca_off: $.data.id } }
