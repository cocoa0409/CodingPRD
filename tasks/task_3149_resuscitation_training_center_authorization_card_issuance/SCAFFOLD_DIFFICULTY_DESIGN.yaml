            - call: "POST /aha/instructors/${cand_id}/teaching-evaluations"
              payload: { score: 3, notes: "Adequate second observation." }
              as: TrainingFaculty
              as_user_id: "${faculty_id}"
            - call: "POST /aha/instructors/${cand_id}/certify"
              payload: {}
              as: TCAdmin
              captures: { cand_status: $.data.status, cand_renewal_due: $.data.renewal_due_at }
          assert:
            - "the first certify returns 409 and err_certify1 == ERR_INSUFFICIENT_TEACHING_EVALUATIONS (count boundary: 1 < 2)"
            - "the second certify returns 200 and cand_status == CERTIFIED (average exactly 4.00 >= 4.00)"
            - "cand_renewal_due == \"2028-09-01T00:00:00Z\" (clock 2026-09-01 + 24 months)"

  # ===========================================================================
  - rule_id: cross_entity_state_dependency
    instances:

      - name: session_create_requires_center_active
        grounds:
          - validations[priority=5]
          - errors.ERR_CENTER_NOT_ACTIVE
          - state_machines.TrainingCenter
        distinguishing_aspect: |
          Entity pair CourseSession -> TrainingCenter: a session create is
          rejected while the center is PROVISIONAL even though the site is
          ALIGNED, the instructor is certified and aligned, and the guidelines
          version is ACTIVE — the parent's state gates the child's creation.
        test_recipe:
          setup:
            - "Logical clock at 2026-09-01T00:00:00Z. Base chain EXCEPT the center is never activated (site alignment is legal under PROVISIONAL). Candidate certified and aligned; G2025 ACTIVE."
          setup_api_calls:
            - *clock
            - *center
            - *faculty
            - *grant_faculty
            - *faculty_alignment
            - *center_v
            - *site
            - *site_align
            - *gv
            - *gv_activate
            - *cand
            - *cand_monitor
            - *cand_eval1
            - *cand_eval2
            - *cand_certify
            - *cand_alignment
          trigger:
            - call: "POST /aha/course-sessions"
              payload: { training_center_id: "${center_id}", site_id: "${site_id}", primary_instructor_id: "${cand_id}", guidelines_version_id: "${gv_id}", course_type: "BLS_PROVIDER", delivery_format: "CLASSROOM", start_at: "2026-10-10T14:00:00Z", end_at: "2026-10-10T18:00:00Z", capacity: 6, manikin_count: 2, aed_trainer_count: 1, assisting_instructor_count: 0 }
              as: TCCoordinator
              captures: { err_sess: $.data.error_id }
          assert:
            - "the trigger returns 409 and err_sess == ERR_CENTER_NOT_ACTIVE"
            - "TrainingCenter.${center_id}.status == PROVISIONAL"
            - "GET /aha/training-centers/${center_id}/course-sessions returns 0 rows"

      - name: alignment_create_requires_instructor_certified
        grounds:
          - validations[priority=5]
          - errors.ERR_INSTRUCTOR_NOT_CERTIFIED
          - state_machines.Instructor
        distinguishing_aspect: |
          Entity pair TCAlignment -> Instructor (different pair than the
          sibling): an alignment create against a CANDIDATE instructor is
          rejected; the same call succeeds once the instructor completes the
          pathway to CERTIFIED.
        test_recipe:
          setup:
            - "Logical clock at 2026-09-01T00:00:00Z. Center exists; one instructor in CANDIDATE status."
          setup_api_calls:
            - *clock
            - *center
            - *cand
          trigger:
            - call: "POST /aha/training-centers/${center_id}/alignments"
              payload: { instructor_id: "${cand_id}", as_faculty: false }
              as: TCAdmin
              captures: { err_align: $.data.error_id }
          assert:
            - "the trigger returns 409 and err_align == ERR_INSTRUCTOR_NOT_CERTIFIED"
            - "GET /aha/training-centers/${center_id}/alignments returns 0 rows"
            - "GET /aha/instructors/${cand_id}/alignments returns 0 rows"

  # ===========================================================================
  - rule_id: resource_temporal_overlap
    instances:

      - name: instructor_double_booking_half_open
        grounds:
          - validations[priority=7]
          - errors.ERR_SESSION_OVERLAP_INSTRUCTOR
        distinguishing_aspect: |
          Interval semantics: strict half-open overlap on the Instructor
          resource — a back-to-back session (start == prior end) is legal,
          while a session overlapping by one hour is rejected, regardless of
          which sites host the sessions.
        test_recipe:
          setup:
            - "Logical clock at 2026-09-01T00:00:00Z. Base chain; second ALIGNED site exists; session A occupies instructor 2026-10-10 14:00-18:00 at site 1."
          setup_api_calls:
            - *clock
            - *center
            - *faculty
            - *grant_faculty
            - *faculty_alignment
            - *center_v
            - *site
            - *site_align
            - *center_activate
            - *gv
            - *gv_activate
            - *cand
            - *cand_monitor
            - *cand_eval1
            - *cand_eval2
            - *cand_certify
            - *cand_alignment
            - *session
            - call: "POST /aha/training-centers/${center_id}/sites"
              payload: { name: "Annex Lab", street_address: "200 Airway Blvd", city: "Austin", state_code: "TX", capacity_students: 12 }
              as: TCAdmin
              captures: { site2_id: $.data.id }
            - call: "GET /aha/training-centers/${center_id}"
              payload: {}
              as: TCAdmin
              captures: { center_v2: $.data.version }
            - call: "POST /aha/training-sites/${site2_id}/align"
              payload: { expected_training_center_version: "${center_v2}" }
              as: TCAdmin
          trigger:
            - call: "POST /aha/course-sessions"
              payload: { training_center_id: "${center_id}", site_id: "${site2_id}", primary_instructor_id: "${cand_id}", guidelines_version_id: "${gv_id}", course_type: "BLS_PROVIDER", delivery_format: "CLASSROOM", start_at: "2026-10-10T18:00:00Z", end_at: "2026-10-10T21:00:00Z", capacity: 6, manikin_count: 2, aed_trainer_count: 1, assisting_instructor_count: 0 }
              as: TCCoordinator
              captures: { session_b_id: $.data.id }
            - call: "POST /aha/course-sessions"
              payload: { training_center_id: "${center_id}", site_id: "${site2_id}", primary_instructor_id: "${cand_id}", guidelines_version_id: "${gv_id}", course_type: "BLS_PROVIDER", delivery_format: "CLASSROOM", start_at: "2026-10-10T17:00:00Z", end_at: "2026-10-10T20:00:00Z", capacity: 6, manikin_count: 2, aed_trainer_count: 1, assisting_instructor_count: 0 }
              as: TCCoordinator
              captures: { err_overlap: $.data.error_id }
          assert:
            - "the back-to-back create returns 201 (start_at 18:00 == session A end_at 18:00 is allowed under half-open semantics)"
            - "the overlapping create returns 409 and err_overlap == ERR_SESSION_OVERLAP_INSTRUCTOR"
            - "CourseSession.${session_b_id}.status == SCHEDULED"

      - name: site_booking_turnover_buffer
        grounds:
          - validations[priority=7]
          - errors.ERR_SESSION_OVERLAP_SITE
        distinguishing_aspect: |
          Different interval semantics on a different resource: the TrainingSite
          rejects any new session whose gap to an existing session is strictly
          under the 60-minute turnover buffer — a gap of exactly 60 minutes is
          legal (19:00 after 18:00), a gap of 59 minutes (18:59) is rejected,
          and this is checked per-site with a different instructor so the
          instructor rule cannot fire first.
        test_recipe:
          setup:
            - "Logical clock at 2026-09-01T00:00:00Z. Base chain; a second certified+aligned instructor exists; session A occupies site 1 on 2026-10-10 14:00-18:00 with the first instructor."
          setup_api_calls:
            - *clock
            - *center
            - *faculty
            - *grant_faculty
            - *faculty_alignment
            - *center_v
            - *site
            - *site_align
            - *center_activate
            - *gv
            - *gv_activate
            - *cand
            - *cand_monitor
            - *cand_eval1
            - *cand_eval2
            - *cand_certify
            - *cand_alignment
            - *session
            - call: "POST /aha/instructors"
              payload: { full_name: "Dana Second", email: "dana@x.example", discipline: "BLS", home_training_center_id: "${center_id}", legacy_certified: true }
              as: NationalAdmin
              captures: { cand2_id: $.data.id }
            - call: "POST /aha/training-centers/${center_id}/alignments"
              payload: { instructor_id: "${cand2_id}", as_faculty: false }
              as: TCAdmin
          trigger:
            - call: "POST /aha/course-sessions"
              payload: { training_center_id: "${center_id}", site_id: "${site_id}", primary_instructor_id: "${cand_id}", guidelines_version_id: "${gv_id}", course_type: "BLS_PROVIDER", delivery_format: "CLASSROOM", start_at: "2026-10-10T19:00:00Z", end_at: "2026-10-10T21:00:00Z", capacity: 6, manikin_count: 2, aed_trainer_count: 1, assisting_instructor_count: 0 }
              as: TCCoordinator
              captures: { session_d_id: $.data.id }
            - call: "POST /aha/course-sessions"
              payload: { training_center_id: "${center_id}", site_id: "${site_id}", primary_instructor_id: "${cand2_id}", guidelines_version_id: "${gv_id}", course_type: "BLS_PROVIDER", delivery_format: "CLASSROOM", start_at: "2026-10-10T18:59:00Z", end_at: "2026-10-10T21:00:00Z", capacity: 6, manikin_count: 2, aed_trainer_count: 1, assisting_instructor_count: 0 }
              as: TCCoordinator
              captures: { err_site: $.data.error_id }
          assert:
            - "the exactly-60-minute-gap create returns 201"
            - "the 59-minute-gap create returns 409 and err_site == ERR_SESSION_OVERLAP_SITE"
            - "CourseSession.${session_d_id}.status == SCHEDULED"

  # ===========================================================================
  - rule_id: compensating_invariant
    instances:

      - name: roster_seat_conservation
        grounds:
          - calculations.seats_available_reconciliation
          - entities.CourseSession.fields.seats_available
          - state_machines.RosterEntry.ENROLLED_to_CANCELLED
        distinguishing_aspect: |
          Conserved quantity: session seat allocation. Enroll (forward) then
          cancel (compensate) leaves seats_available + enrolled_count ==
          capacity at every step: 6 -> 5 -> 4 -> 5 with the invariant holding
          before and after each action.
        test_recipe:
          setup:
            - "Logical clock at 2026-09-01T00:00:00Z. Base chain; SCHEDULED session capacity 6, empty roster."
          setup_api_calls:
            - *clock
            - *center
            - *faculty
            - *grant_faculty
            - *faculty_alignment
            - *center_v
            - *site
            - *site_align
            - *center_activate
            - *gv
            - *gv_activate
            - *cand
            - *cand_monitor
            - *cand_eval1
            - *cand_eval2
            - *cand_certify
            - *cand_alignment
            - *session
          trigger:
            - call: "POST /aha/course-sessions/${session_id}/roster"
              payload: { student_name: "Sam Student", student_email: "sam@x.example" }
              as: TCCoordinator
              captures: { e1_id: $.data.id }
            - call: "POST /aha/course-sessions/${session_id}/roster"
              payload: { student_name: "Rita Rescuer", student_email: "rita@x.example" }
              as: TCCoordinator
              captures: { e2_id: $.data.id }
            - call: "GET /aha/course-sessions/${session_id}"
              payload: {}
              as: TCCoordinator
              captures: { seats_mid: $.data.seats_available }
            - call: "POST /aha/roster-entries/${e1_id}/cancel"
              payload: {}
              as: TCCoordinator
            - call: "GET /aha/course-sessions/${session_id}"
              payload: {}
              as: TCCoordinator
              captures: { seats_end: $.data.seats_available }
          assert:
            - "CourseSession.${session_id}.seats_available == 6 at creation (capacity - 0 enrolled)"
            - "seats_mid == 4 after two enrollments (6 - 2)"
            - "seats_end == 5 after the compensating cancel (6 - 1)"
            - "RosterEntry.${e1_id}.status == CANCELLED and RosterEntry.${e2_id}.status == ENROLLED"
            - "invariant: at each observation seats_available + count(ENROLLED) == 6"

      - name: card_stock_conservation
        grounds:
          - calculations.center_card_stock_reconciliation
          - entities.TrainingCenter.fields.cards_issued_count
          - entities.TrainingCenter.fields.active_card_count
          - state_machines.CourseCompletionCard.ACTIVE_to_REVOKED
          - state_machines.CourseCompletionCard.ACTIVE_to_EXPIRED
        distinguishing_aspect: |
          Conserved quantity: the center's card stock partition. Issue
          (forward, +2) then revoke one card and expire the other
          (compensating moves) leaves cards_issued_count == 2 untouched while
          active_card_count returns 2 -> 1 -> 0, with
          issued == active + expired + revoked at every step — a different
          conserved quantity than seat capacity.
        test_recipe:
          setup:
            - "Logical clock at 2026-09-01T00:00:00Z. Base chain; session completed with two PASSED roster entries, so two cards are issued (expires 2028-09-30T23:59:59Z)."
          setup_api_calls:
            - *clock
            - *center
            - *faculty
            - *grant_faculty
            - *faculty_alignment
            - *center_v
            - *site
            - *site_align
            - *center_activate
            - *gv
            - *gv_activate
            - *cand
            - *cand_monitor
            - *cand_eval1
            - *cand_eval2
            - *cand_certify
            - *cand_alignment
            - *session
            - *roster_a
            - *roster_b
            - *session_start
            - call: "POST /aha/roster-entries/${entry_a_id}/skills-evaluations"
              payload: { items: [{ item_code: "SCENE", critical: true, passed: true }, { item_code: "COMP", critical: false, passed: true }] }
              as: Instructor
              as_user_id: "${cand_id}"
            - call: "POST /aha/roster-entries/${entry_b_id}/skills-evaluations"
              payload: { items: [{ item_code: "SCENE", critical: true, passed: true }, { item_code: "COMP", critical: false, passed: true }] }
              as: Instructor
              as_user_id: "${cand_id}"
            - call: "POST /aha/course-sessions/${session_id}/complete"
              payload: {}
              as: Instructor
              as_user_id: "${cand_id}"
            - call: "GET /aha/roster-entries/${entry_a_id}/cards"
              payload: {}
              as: TCAdmin
              captures: { card_a_id: $.data.0.id }
            - call: "GET /aha/roster-entries/${entry_b_id}/cards"
              payload: {}
              as: TCAdmin
              captures: { card_b_id: $.data.0.id }
            - call: "GET /aha/training-centers/${center_id}"
              payload: {}
              as: QAAuditor
              captures: { issued_after_complete: $.data.cards_issued_count, active_after_complete: $.data.active_card_count }
          trigger:
            - call: "POST /aha/cards/${card_a_id}/revoke"
              payload: {}
              as: QAAuditor
            - call: "GET /aha/training-centers/${center_id}"
              payload: {}
              as: QAAuditor
              captures: { issued_after_revoke: $.data.cards_issued_count, active_after_revoke: $.data.active_card_count }
            - call: "POST /aha/_clock/set_current_utc"
              payload: { to_iso8601: "2028-10-15T00:00:00Z" }
              as: NationalAdmin
            - call: "GET /aha/training-centers/${center_id}"
              payload: {}
              as: QAAuditor
              captures: { issued_final: $.data.cards_issued_count, active_final: $.data.active_card_count }
            - call: "GET /aha/cards/${card_b_id}"
              payload: {}
              as: QAAuditor
              captures: { card_b_status: $.data.status }
          assert:
            - "issued_after_complete == 2 and active_after_complete == 2 (2 == 2 + 0 expired + 0 revoked)"
            - "issued_after_revoke == 2 and active_after_revoke == 1 (revoke never touches cards_issued_count)"
            - "card_b_status == EXPIRED after the clock sweep (2028-10-15 > expires_at 2028-09-30T23:59:59Z)"
            - "issued_final == 2 and active_final == 0 (2 == 0 + 1 expired + 1 revoked)"
