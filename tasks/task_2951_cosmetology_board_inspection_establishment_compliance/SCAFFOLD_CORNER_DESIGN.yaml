# §1.9 Scaffold Corner Design (breadth index)
# Walk of references/claim-extraction-guide.md against SCAFFOLD.yaml §1.1-§1.7.
# The nine guide sections are the section: values; the per-section rows are the claim_type: values.
# Corners already asserted by a §1.8 instance appear as excluded_because: stubs with no test_recipe.

scaffold_corner_design:
  - section: entities
    instances:
      - name: entity_establishment_create_returns_every_declared_field
        claim_type: creation
        grounds:
          - entities.Establishment
          - endpoints.POST_/cosmetology/establishments
          - response_envelope.success
        distinguishing_aspect: "POST with the four required inputs returns 201 and a data object carrying all four inputs verbatim plus every computed/system field at its declared initial value."
        test_recipe:
          setup:
            - "Empty database; the logical clock is at its startup default 2026-08-01T00:00:00Z."
          setup_api_calls: []
          trigger:
            - call: "POST /cosmetology/establishments"
              payload: { legal_name: "Corner Salon", establishment_type: "SALON", county_code: "AAA", station_capacity: 5 }
              as: BoardAdmin
              as_user_id: "admin-001"
              captures: { est_id: $.data.id }
          assert:
            - "HTTP status is 201"
            - "response body has meta.api_request_id, meta.api_request_timestamp and response_type == object"
            - "Establishment.${est_id}.legal_name == Corner Salon and establishment_type == SALON and county_code == AAA and station_capacity == 5"
            - "Establishment.${est_id}.station_count == 0"
            - "Establishment.${est_id}.license_status == PENDING_INSPECTION"
            - "Establishment.${est_id}.compliance_posture == CLEAR"
            - "Establishment.${est_id}.demerit_balance == 0.00"
            - "Establishment.${est_id}.open_critical_citation_count == 0"
            - "Establishment.${est_id}.outstanding_fine_total_cents == 0"
            - "Establishment.${est_id}.delinquent_fine_total_cents == 0"
            - "Establishment.${est_id}.foot_spa_biofilm_current == false"
            - "Establishment.${est_id}.last_finalized_inspection_at is null"
            - "Establishment.${est_id}.version == 1"

      - name: entity_establishment_get_by_id_returns_the_stored_row
        claim_type: retrieval
        grounds:
          - endpoints.GET_/cosmetology/establishments/{id}
          - entities.Establishment.fields.station_capacity
        distinguishing_aspect: "GET /establishments/{id} echoes the row created by POST byte-for-byte on every input field and reports version 1 with created_at == updated_at."
        test_recipe:
          setup:
            - "One establishment 'Corner Salon' has been created and never mutated."
          setup_api_calls:
            - call: "POST /cosmetology/establishments"
              payload: { legal_name: "Corner Salon", establishment_type: "BARBERSHOP", county_code: "AAB", station_capacity: 7 }
              as: BoardAdmin
              as_user_id: "admin-001"
              captures: { est_id: $.data.id }
          trigger:
            - call: "GET /cosmetology/establishments/${est_id}"
              payload: {}
              as: Inspector
              as_user_id: "insp-001"
          assert:
            - "HTTP status is 200"
            - "response data.id == ${est_id}"
            - "Establishment.${est_id}.legal_name == Corner Salon and establishment_type == BARBERSHOP and station_capacity == 7"
            - "Establishment.${est_id}.version == 1"
            - "Establishment.${est_id}.created_at == Establishment.${est_id}.updated_at"

      - name: entity_establishment_list_paginates_with_total_count_and_has_more
        claim_type: listing
        grounds:
          - endpoints.GET_/cosmetology/establishments
          - response_envelope.pagination_fields
          - response_envelope.pagination_defaults
        distinguishing_aspect: "With three establishments stored, limit=2&offset=0 returns exactly 2 rows with total_count 3 and has_more true, and offset=2 returns 1 row with has_more false."
        test_recipe:
          setup:
            - "Exactly three establishments exist, created in the order 'Alpha Salon', 'Bravo Salon', 'Charlie Salon'."
          setup_api_calls:
            - call: "POST /cosmetology/establishments"
              payload: { legal_name: "Alpha Salon", establishment_type: "SALON", county_code: "AAC", station_capacity: 2 }
              as: BoardAdmin
              as_user_id: "admin-001"
            - call: "POST /cosmetology/establishments"
              payload: { legal_name: "Bravo Salon", establishment_type: "SALON", county_code: "AAC", station_capacity: 2 }
              as: BoardAdmin
              as_user_id: "admin-001"
            - call: "POST /cosmetology/establishments"
              payload: { legal_name: "Charlie Salon", establishment_type: "SALON", county_code: "AAD", station_capacity: 2 }
              as: BoardAdmin
              as_user_id: "admin-001"
          trigger:
            - call: "GET /cosmetology/establishments"
              payload: { limit: 2, offset: 0 }
              as: BoardAdmin
              as_user_id: "admin-001"
            - call: "GET /cosmetology/establishments"
              payload: { limit: 2, offset: 2 }
              as: BoardAdmin
              as_user_id: "admin-001"
            - call: "GET /cosmetology/establishments"
              payload: { county_code: "AAC" }
              as: BoardAdmin
              as_user_id: "admin-001"
          assert:
            - "the first call returns response_type == array with 2 rows, total_count == 3, limit == 2, offset == 0 and has_more == true"
            - "the second call returns 1 row, total_count == 3, offset == 2 and has_more == false"
            - "the third call omits limit and returns total_count == 2 with limit == 10 and has_more == false"

      - name: entity_establishment_get_unknown_id_returns_not_found
        claim_type: not_found
        grounds:
          - errors[ERR_ESTABLISHMENT_NOT_FOUND]
          - endpoints.GET_/cosmetology/establishments/{id}
        distinguishing_aspect: "A well-formed UUID that names no row returns 404 ERR_ESTABLISHMENT_NOT_FOUND, not 200 with a null body and not 400."
        test_recipe:
          setup:
            - "Exactly one unrelated establishment exists, so the table is non-empty."
          setup_api_calls:
            - call: "POST /cosmetology/establishments"
              payload: { legal_name: "Only Salon", establishment_type: "SALON", county_code: "AAE", station_capacity: 1 }
              as: BoardAdmin
              as_user_id: "admin-001"
          trigger:
            - call: "GET /cosmetology/establishments/00000000-0000-0000-0000-000000000000"
              payload: {}
              as: BoardAdmin
              as_user_id: "admin-001"
          assert:
            - "HTTP status is 404"
            - "response_type == error and data.error_id == ERR_ESTABLISHMENT_NOT_FOUND"

      - name: entity_establishment_create_missing_capacity_returns_invalid_request
        claim_type: required_fields
        grounds:
          - errors[ERR_INVALID_REQUEST]
          - validations.priority_16.ERR_INVALID_REQUEST
          - endpoints.POST_/cosmetology/establishments
        distinguishing_aspect: "station_capacity has source input and no default, so omitting it returns 400 ERR_INVALID_REQUEST and creates no row."
        test_recipe:
          setup:
            - "Empty database."
          setup_api_calls: []
          trigger:
            - call: "POST /cosmetology/establishments"
              payload: { legal_name: "Headless Salon", establishment_type: "SALON", county_code: "AAF" }
              as: BoardAdmin
              as_user_id: "admin-001"
          assert:
            - "HTTP status is 400"
            - "data.error_id == ERR_INVALID_REQUEST"
            - "GET /cosmetology/establishments returns total_count == 0"

      - name: entity_school_create_applies_declared_defaults_for_optional_flags
        claim_type: defaults
        grounds:
          - entities.School.fields.accreditation_status
          - entities.School.fields.apprenticeship_program_approved
          - endpoints.POST_/cosmetology/schools
        distinguishing_aspect: "Omitting accreditation_status and apprenticeship_program_approved yields the declared defaults ACCREDITED and false rather than nulls."
        test_recipe:
          setup:
            - "Empty database."
          setup_api_calls: []
          trigger:
            - call: "POST /cosmetology/schools"
              payload: { name: "Default Academy", county_code: "AAG", required_clock_hours: 1500.00 }
              as: BoardAdmin
              as_user_id: "admin-001"
              captures: { school_id: $.data.id }
          assert:
            - "HTTP status is 201"
            - "School.${school_id}.accreditation_status == ACCREDITED"
            - "School.${school_id}.apprenticeship_program_approved == false"
            - "School.${school_id}.required_clock_hours == 1500.00"
            - "School.${school_id}.version == 1"

      - name: entity_establishment_computed_and_system_fields_extra_field_ignored
        claim_type: computed_fields
        grounds:
          - entities.Establishment.fields.station_count
          - entities.Establishment.fields.demerit_balance
          - entities.Establishment.fields.license_status
        distinguishing_aspect: "Client-supplied values for the computed station_count/demerit_balance and the system license_status are ignored: the row is created with 0, 0.00 and PENDING_INSPECTION regardless."
        test_recipe:
          setup:
            - "Empty database."
          setup_api_calls: []
          trigger:
            - call: "POST /cosmetology/establishments"
              payload: { legal_name: "Sneaky Salon", establishment_type: "SALON", county_code: "AAH", station_capacity: 3, station_count: 99, demerit_balance: 500.00, license_status: "ACTIVE", id: "11111111-1111-1111-1111-111111111111", version: 42 }
              as: BoardAdmin
              as_user_id: "admin-001"
              captures: { est_id: $.data.id }
          assert:
            - "Establishment.${est_id}.station_count == 0"
            - "Establishment.${est_id}.demerit_balance == 0.00"
            - "Establishment.${est_id}.license_status == PENDING_INSPECTION"
            - "Establishment.${est_id}.version == 1"
            - "${est_id} != 11111111-1111-1111-1111-111111111111"
            - "Establishment.${est_id}.created_at and updated_at are server-generated ISO-8601 instants equal to 2026-08-01T00:00:00.000Z"

      - name: entity_establishment_type_invalid_enum_rejected
        claim_type: type_constraints
        grounds:
          - entities.Establishment.fields.establishment_type
          - validations.priority_16.ERR_INVALID_REQUEST
        distinguishing_aspect: "establishment_type is a closed enum: the value TATTOO_PARLOR is rejected with 400 ERR_INVALID_REQUEST and county_code must be exactly three uppercase letters, so 'aa1' is rejected too."
        test_recipe:
          setup:
            - "Empty database."
          setup_api_calls: []
          trigger:
            - call: "POST /cosmetology/establishments"
              payload: { legal_name: "Ink Salon", establishment_type: "TATTOO_PARLOR", county_code: "AAJ", station_capacity: 3 }
              as: BoardAdmin
              as_user_id: "admin-001"
            - call: "POST /cosmetology/establishments"
              payload: { legal_name: "Lower Salon", establishment_type: "SALON", county_code: "aa1", station_capacity: 3 }
              as: BoardAdmin
              as_user_id: "admin-001"
            - call: "POST /cosmetology/establishments"
              payload: { legal_name: "Zero Salon", establishment_type: "SALON", county_code: "AAJ", station_capacity: 0 }
              as: BoardAdmin
              as_user_id: "admin-001"
          assert:
            - "all three calls return HTTP 400 with data.error_id == ERR_INVALID_REQUEST"
            - "GET /cosmetology/establishments returns total_count == 0"

      - name: entity_violation_code_is_immutable_with_no_version_or_update_surface
        claim_type: immutability
        grounds:
          - entities.ViolationCode
          - endpoints.GET_/cosmetology/violation-codes/{id}
        distinguishing_aspect: "ViolationCode declares common_fields false, so its response carries id and created_at but no version and no updated_at, and §1.5 exposes no update or delete endpoint for it; a second POST of the same code is refused for uniqueness."
        test_recipe:
          setup:
            - "Empty database."
          setup_api_calls:
            - call: "POST /cosmetology/violation-codes"
              payload: { code: "SAN-900", category: "SANITATION", severity: "MINOR", base_points: 1.00, fine_cents_base: 1000 }
              as: BoardAdmin
              as_user_id: "admin-001"
              captures: { vc_id: $.data.id }
          trigger:
            - call: "GET /cosmetology/violation-codes/${vc_id}"
              payload: {}
              as: Inspector
              as_user_id: "insp-001"
            - call: "POST /cosmetology/violation-codes"
              payload: { code: "SAN-900", category: "FACILITY", severity: "MAJOR", base_points: 2.00, fine_cents_base: 2000 }
              as: BoardAdmin
              as_user_id: "admin-001"
          assert:
            - "the GET returns 200 with data.code == SAN-900, data.base_points == 1.00 and data.severity == MINOR"
            - "the GET response data object contains no version field and no updated_at field"
            - "the duplicate POST returns HTTP 400 with data.error_id == ERR_INVALID_REQUEST"
            - "ViolationCode.${vc_id}.category == SANITATION (unchanged by the refused duplicate)"

      - name: entity_training_record_is_immutable_and_append_only
        claim_type: immutability
        grounds:
          - entities.TrainingRecord
          - endpoints.GET_/cosmetology/training-records/{id}
          - endpoints.GET_/cosmetology/training-records
        distinguishing_aspect: "TrainingRecord declares common_fields false: rows carry no version, are never edited, and hours are accumulated only by appending further rows, so two 4.00-hour filings yield credited_hours_school 8.00 across two rows rather than one amended row."
        test_recipe:
          setup:
            - "One school 'Ledger Academy' with required_clock_hours 100.00 and one STUDENT candidate 'Ivy Park' enrolled there."
          setup_api_calls:
            - call: "POST /cosmetology/schools"
              payload: { name: "Ledger Academy", county_code: "AAK", required_clock_hours: 100.00, accreditation_status: "ACCREDITED" }
              as: BoardAdmin
              as_user_id: "admin-001"
              captures: { school_id: $.data.id }
            - call: "POST /cosmetology/practitioners"
              payload: { full_name: "Ivy Park", license_type: "ESTHETICIAN", school_id: "${school_id}" }
              as: BoardAdmin
              as_user_id: "admin-001"
              captures: { prac_id: $.data.id }
          trigger:
            - call: "POST /cosmetology/training-records"
              payload: { practitioner_id: "${prac_id}", credit_type: "SCHOOL_CLOCK_HOUR", hours: 4.00, performed_on: "2026-07-10", discipline: "THEORY", school_id: "${school_id}" }
              as: SchoolRegistrar
              as_user_id: "${school_id}"
              captures: { tr1_id: $.data.id }
            - call: "POST /cosmetology/training-records"
              payload: { practitioner_id: "${prac_id}", credit_type: "SCHOOL_CLOCK_HOUR", hours: 4.00, performed_on: "2026-07-10", discipline: "PRACTICAL", school_id: "${school_id}" }
              as: SchoolRegistrar
              as_user_id: "${school_id}"
          assert:
            - "both calls return HTTP 201"
            - "the response data object of each contains no version field"
            - "TrainingRecord.${tr1_id}.hours == 4.00 and TrainingRecord.${tr1_id}.discipline == THEORY"
            - "GET /cosmetology/training-records?practitioner_id=${prac_id} returns total_count == 2"
            - "Practitioner.${prac_id}.credited_hours_school == 8.00"
            - "Practitioner.${prac_id}.credited_hours_total == 8.00"
            - "Practitioner.${prac_id}.required_clock_hours_effective == 100.00"
            - "Practitioner.${prac_id}.exam_eligible == false"

      - name: entity_workstation_create_under_unknown_establishment_not_found
        claim_type: parent_relationships
        grounds:
          - validations.priority_10.ERR_ESTABLISHMENT_NOT_FOUND
          - endpoints.POST_/cosmetology/establishments/{id}/workstations
        distinguishing_aspect: "The path id is resolved before any body validation, so a workstation create under a non-existent establishment returns 404 ERR_ESTABLISHMENT_NOT_FOUND rather than 400 or 201."
        test_recipe:
          setup:
            - "One unrelated establishment exists so the table is non-empty."
          setup_api_calls:
            - call: "POST /cosmetology/establishments"
              payload: { legal_name: "Real Salon", establishment_type: "SALON", county_code: "AAL", station_capacity: 2 }
              as: BoardAdmin
              as_user_id: "admin-001"
          trigger:
            - call: "POST /cosmetology/establishments/00000000-0000-0000-0000-0000000000ff/workstations"
              payload: { station_number: 1, station_type: "STYLING_CHAIR" }
              as: BoardAdmin
              as_user_id: "admin-001"
          assert:
            - "HTTP status is 404"
            - "data.error_id == ERR_ESTABLISHMENT_NOT_FOUND"
            - "GET /cosmetology/workstations returns total_count == 0"

      - name: entity_practitioner_without_school_uses_standalone_required_hours
        claim_type: defaults
        grounds:
          - entities.Practitioner.fields.school_id
          - entities.Practitioner.fields.required_clock_hours_effective
          - calculations.practitioner_credited_hours
        distinguishing_aspect: "Omitting the optional school_id makes required_clock_hours_effective fall back to APPRENTICE_STANDALONE_REQUIRED_HOURS 1600.00 instead of null or 0.00."
        test_recipe:
          setup:
            - "Empty database."
          setup_api_calls: []
          trigger:
            - call: "POST /cosmetology/practitioners"
              payload: { full_name: "Solo Candidate", license_type: "APPRENTICE" }
              as: BoardAdmin
              as_user_id: "admin-001"
              captures: { prac_id: $.data.id }
          assert:
            - "HTTP status is 201"
            - "Practitioner.${prac_id}.school_id is null"
            - "Practitioner.${prac_id}.required_clock_hours_effective == 1600.00"
            - "Practitioner.${prac_id}.license_status == STUDENT"
            - "Practitioner.${prac_id}.credited_hours_school == 0.00 and credited_hours_apprentice == 0.00 and credited_hours_total == 0.00"
            - "Practitioner.${prac_id}.exam_eligible == false"
            - "Practitioner.${prac_id}.sanction_points == 0.00"
            - "Practitioner.${prac_id}.license_expires_on is null"

      - name: entity_topology_graph_one_practitioner_rents_at_two_establishments
        claim_type: graph
        grounds:
          - complexity_profile.entity_topology
          - entities.BoothRental
          - endpoints.GET_/cosmetology/booth-rentals
          - endpoints.GET_/cosmetology/workstations
        distinguishing_aspect: "Practitioner and Establishment are joined many-to-many through Workstation + BoothRental: one licensee holds rentals on stations of two different establishments at once, and each junction row is independently listable by either side."
        test_recipe:
          setup:
            - "One school 'Bridge Academy' with required_clock_hours 16.0."
            - "One ACTIVE COSMETOLOGIST 'Kai Renn' credited with 16.00 school hours, licence effective 2026-08-01T00:00:00Z."
            - "Two establishments 'East Salon' and 'West Salon', each with one STYLING_CHAIR workstation numbered 1."
          setup_api_calls:
            - call: "POST /cosmetology/schools"
              payload: { name: "Bridge Academy", county_code: "AAM", required_clock_hours: 16.0, accreditation_status: "ACCREDITED" }
              as: BoardAdmin
              as_user_id: "admin-001"
              captures: { school_id: $.data.id }
            - call: "POST /cosmetology/practitioners"
              payload: { full_name: "Kai Renn", license_type: "COSMETOLOGIST", school_id: "${school_id}" }
              as: BoardAdmin
              as_user_id: "admin-001"
              captures: { prac_id: $.data.id }
            - call: "POST /cosmetology/training-records"
              payload: { practitioner_id: "${prac_id}", credit_type: "SCHOOL_CLOCK_HOUR", hours: 8.0, performed_on: "2026-07-06", discipline: "SANITATION", school_id: "${school_id}" }
              as: BoardAdmin
              as_user_id: "admin-001"
            - call: "POST /cosmetology/training-records"
              payload: { practitioner_id: "${prac_id}", credit_type: "SCHOOL_CLOCK_HOUR", hours: 8.0, performed_on: "2026-07-07", discipline: "DISINFECTION", school_id: "${school_id}" }
              as: BoardAdmin
              as_user_id: "admin-001"
            - call: "POST /cosmetology/practitioners/${prac_id}/license-actions"
              payload: { action: "GRANT_EXAM_ELIGIBILITY" }
              as: BoardAdmin
              as_user_id: "admin-001"
            - call: "POST /cosmetology/practitioners/${prac_id}/license-actions"
              payload: { action: "ISSUE_LICENSE", effective_at: "2026-08-01T00:00:00Z" }
              as: BoardAdmin
              as_user_id: "admin-001"
            - call: "POST /cosmetology/establishments"
              payload: { legal_name: "East Salon", establishment_type: "SALON", county_code: "AAN", station_capacity: 2 }
              as: BoardAdmin
              as_user_id: "admin-001"
              captures: { est_e_id: $.data.id }
            - call: "POST /cosmetology/establishments"
              payload: { legal_name: "West Salon", establishment_type: "SALON", county_code: "AAP", station_capacity: 2 }
              as: BoardAdmin
              as_user_id: "admin-001"
              captures: { est_w_id: $.data.id }
            - call: "POST /cosmetology/establishments/${est_e_id}/workstations"
              payload: { station_number: 1, station_type: "STYLING_CHAIR" }
              as: BoardAdmin
              as_user_id: "admin-001"
              captures: { ws_e_id: $.data.id, ws_e_v: $.data.version }
            - call: "POST /cosmetology/establishments/${est_w_id}/workstations"
              payload: { station_number: 1, station_type: "STYLING_CHAIR" }
              as: BoardAdmin
              as_user_id: "admin-001"
              captures: { ws_w_id: $.data.id, ws_w_v: $.data.version }
          trigger:
            - call: "POST /cosmetology/booth-rentals"
              payload: { workstation_id: "${ws_e_id}", practitioner_id: "${prac_id}", rental_type: "BOOTH_RENTER_INDEPENDENT_CONTRACTOR", term_start_at: "2026-08-01T00:00:00Z", monthly_rent_cents: 60000, expected_workstation_version: "${ws_e_v}" }
              as: BoardAdmin
              as_user_id: "admin-001"
              captures: { rental_e_id: $.data.id }
            - call: "POST /cosmetology/booth-rentals"
              payload: { workstation_id: "${ws_w_id}", practitioner_id: "${prac_id}", rental_type: "EMPLOYEE", term_start_at: "2026-08-01T00:00:00Z", monthly_rent_cents: 0, expected_workstation_version: "${ws_w_v}" }
              as: BoardAdmin
              as_user_id: "admin-001"
              captures: { rental_w_id: $.data.id }
          assert:
            - "both calls return HTTP 201"
            - "GET /cosmetology/booth-rentals?practitioner_id=${prac_id} returns total_count == 2"
            - "GET /cosmetology/booth-rentals?workstation_id=${ws_e_id} returns total_count == 1 and its single row id == ${rental_e_id}"
            - "BoothRental.${rental_w_id}.rental_type == EMPLOYEE and monthly_rent_cents == 0"
            - "Workstation.${ws_e_id}.posting_status == MISSING_POSTING and Workstation.${ws_w_id}.posting_status == MISSING_POSTING"
            - "Establishment.${est_e_id}.station_count == 1 and Establishment.${est_w_id}.station_count == 1"

      - name: entity_topology_graph_reinspection_parent_must_share_the_establishment
        claim_type: graph
        grounds:
          - validations.priority_74.ERR_REINSPECTION_PARENT_REQUIRED
          - entities.Inspection.fields.reinspection_of_id
          - complexity_profile.relationship_patterns
        distinguishing_aspect: "Inspection is self-referential through reinspection_of_id, and the cycle-adjacent constraint is that the parent must be a FINALIZED non-passing inspection of the SAME establishment: a FINALIZED parent at another establishment is refused with 422 ERR_REINSPECTION_PARENT_REQUIRED."
        test_recipe:
          setup:
            - "One MAJOR violation code IMP-900 (base_points 6.0) is published."
            - "Establishment 'Alpha Salon' has a FINALIZED ROUTINE inspection with one IMP-900 finding observed once and not corrected on site, so its final_outcome is CONDITIONAL_PASS at 15.00."
            - "Establishment 'Beta Salon' exists with no inspections at all."
          setup_api_calls:
            - call: "POST /cosmetology/violation-codes"
              payload: { code: "IMP-900", category: "IMPLEMENT_HANDLING", severity: "MAJOR", base_points: 6.0, fine_cents_base: 12000 }
              as: BoardAdmin
              as_user_id: "admin-001"
              captures: { vc_id: $.data.id }
            - call: "POST /cosmetology/establishments"
              payload: { legal_name: "Alpha Salon", establishment_type: "SALON", county_code: "AAQ", station_capacity: 2 }
              as: BoardAdmin
              as_user_id: "admin-001"
              captures: { est_a_id: $.data.id }
            - call: "POST /cosmetology/establishments"
              payload: { legal_name: "Beta Salon", establishment_type: "SALON", county_code: "AAR", station_capacity: 2 }
