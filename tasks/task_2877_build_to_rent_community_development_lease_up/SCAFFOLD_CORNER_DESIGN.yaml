            - "After the second signature: Community.${c}.leased_unit_count == 2 and occupancy_ratio == 0.5000 exactly"
            - "The second pm-transition returns HTTP 200 with management_mode == PM_MANAGED, pm_company_name == 'Northgate Residential' and pm_effective_from == 2026-08-01T00:00:00Z"
            - "Community.${c}.lifecycle_status is still LEASE_UP because 0.5000 < 0.7500"

      - name: a_duplicate_lot_number_in_the_same_phase_is_rejected
        claim_type: violation_to_error
        grounds:
          - validations.priority_60_duplicate_resource
          - errors.ERR_DUPLICATE_RESOURCE
        distinguishing_aspect: |
          (phase_id, lot_number) is the natural key surveyors and turn crews use, so a second homesite
          claiming lot G1 in the same phase must be refused with ERR_DUPLICATE_RESOURCE even though the
          product mix still has room for it.
        test_recipe:
          setup:
            - "Community 'Harrowgate' with plat APPROVED, one UNDER_CONSTRUCTION phase planned for 4 units and one homesite already on lot H1."
          setup_api_calls:
