# =============================================================================
# §1.9 Scaffold Corner Design (Coverage Index for Non-Difficulty Tests)
# Meal Kit Subscription — breadth probe walking references/claim-extraction-guide.md
# against SCAFFOLD §1.1–§1.7. Every active instance has a fully reachable
# setup_api_calls chain; corners already covered by §1.8 are excluded_because stubs.
# =============================================================================
scaffold_corner_design:

  # ===========================================================================
  - section: entities
    instances:
      - name: create_plan_returns_201_with_all_fields
        claim_type: Creation
        grounds:
          - "entities.Plan"
          - "endpoints"
        distinguishing_aspect: "POST /plans with code, servings_per_meal, meals_per_week returns 201 and a Plan with system id/created_at/version=1 and is_active default true."
        test_recipe:
          setup: ["Empty DB"]
          setup_api_calls: []
          trigger:
            - call: "POST /plans"
              payload: { code: "COUPLE_3", servings_per_meal: 2, meals_per_week: 3 }
              as: PlatformAdmin
              captures: { pid: $.data.id }
          assert:
            - "HTTP 201; data.code == COUPLE_3; data.meals_per_week == 3; data.is_active == true; data.version == 1"

      - name: create_member_mints_referral_code_and_zero_balances
        claim_type: Computed Fields
        grounds:
          - "entities.Member.fields.referral_code"
          - "entities.Member.fields.credit_balance_cents"
          - "entities.Member.fields.lifetime_box_count"
        distinguishing_aspect: "POST /members mints a unique referral_code and initializes credit_balance_cents=0, lifetime_box_count=0, status=ACTIVE; client-supplied values for these are ignored."
        test_recipe:
          setup: ["ZONE_A exists"]
          setup_api_calls:
            - call: "POST /shipping-zones"
              payload: { zone_code: "ZONE_A", cold_pack_surcharge_cents: 0, cutoff_weekday: 5 }
              as: PlatformAdmin
              captures: { z: $.data.id }
          trigger:
            - call: "POST /members"
              payload: { email: "mc@x.com", full_name: "MC", shipping_zone_id: "${z}" }
              as: Anonymous
              captures: { mid: $.data.id, rc: $.data.referral_code }
          assert:
            - "HTTP 201; data.credit_balance_cents == 0; data.lifetime_box_count == 0; data.status == ACTIVE; data.referral_code is a non-empty string"

      - name: create_member_missing_required_field_rejected
        claim_type: Required Fields
        grounds:
          - "entities.Member.fields.email"
          - "errors[ERR_VALIDATION]"
        distinguishing_aspect: "POST /members without email (a required input with no default) returns ERR_VALIDATION (400)."
        test_recipe:
          setup: ["ZONE_A exists"]
          setup_api_calls:
            - call: "POST /shipping-zones"
              payload: { zone_code: "ZONE_A", cold_pack_surcharge_cents: 0, cutoff_weekday: 5 }
              as: PlatformAdmin
              captures: { z: $.data.id }
          trigger:
            - call: "POST /members"
              payload: { full_name: "NoEmail", shipping_zone_id: "${z}" }
              as: Anonymous
              captures: { err: $.data.error_id }
          assert:
            - "HTTP 400; data.error_id == ERR_VALIDATION"

      - name: subscription_diet_preference_defaults_to_standard
        claim_type: Defaults
        grounds:
          - "entities.Subscription.fields.diet_preference"
        distinguishing_aspect: "POST /subscriptions omitting diet_preference applies default STANDARD; blocked_allergens defaults to []; monthly_addon_fee_cents defaults to 0."
        test_recipe:
          setup: ["Plan and ZONE_A and member exist"]
          setup_api_calls:
            - call: "POST /plans"
              payload: { code: "P_DEF", servings_per_meal: 2, meals_per_week: 2 }
              as: PlatformAdmin
              captures: { p: $.data.id }
            - call: "POST /shipping-zones"
              payload: { zone_code: "ZONE_A", cold_pack_surcharge_cents: 0, cutoff_weekday: 5 }
              as: PlatformAdmin
              captures: { z: $.data.id }
            - call: "POST /members"
              payload: { email: "def@x.com", full_name: "Def", shipping_zone_id: "${z}" }
              as: Anonymous
              captures: { m: $.data.id }
          trigger:
            - call: "POST /subscriptions"
              payload: { member_id: "${m}", plan_id: "${p}", billing_cycle_day: 1 }
              as: Member
              as_user_id: "${m}"
              captures: { s: $.data.id }
          assert:
            - "HTTP 201; data.diet_preference == STANDARD; data.monthly_addon_fee_cents == 0; data.status == ACTIVE"

      - name: get_member_not_found
        claim_type: Not Found
        grounds:
          - "entities.Member"
          - "errors[ERR_MEMBER_NOT_FOUND]"
        distinguishing_aspect: "GET /members/{nonexistent-uuid} returns ERR_MEMBER_NOT_FOUND (404)."
        test_recipe:
          setup: ["Empty DB"]
          setup_api_calls: []
          trigger:
            - call: "GET /members/00000000-0000-4000-8000-000000000000"
              payload: {}
              as: PlatformAdmin
              captures: { err: $.data.error_id }
          assert:
            - "HTTP 404; data.error_id == ERR_MEMBER_NOT_FOUND"

      - name: list_plans_paginated_envelope
        claim_type: Listing
        grounds:
          - "entities.Plan"
          - "response_envelope"
        distinguishing_aspect: "GET /plans returns a paginated array envelope with response_type=array, total_count, has_more, and respects limit."
        test_recipe:
          setup: ["Two plans exist"]
          setup_api_calls:
            - call: "POST /plans"
              payload: { code: "PA", servings_per_meal: 2, meals_per_week: 2 }
              as: PlatformAdmin
            - call: "POST /plans"
              payload: { code: "PB", servings_per_meal: 4, meals_per_week: 3 }
              as: PlatformAdmin
          trigger:
            - call: "GET /plans"
              payload: { limit: 1 }
              as: PlatformAdmin
          assert:
            - "HTTP 200; response_type == array; meta.total_count == 2; meta.has_more == true; data length == 1"

      - name: weekly_box_computed_cutoff_at_before_delivery
        claim_type: Computed Fields
        grounds:
          - "entities.WeeklyBox.fields.cutoff_at"
          - "calculations.cutoff_at"
        distinguishing_aspect: "POST /weekly-boxes computes cutoff_at = most recent zone cutoff_weekday (Friday=5) before delivery 2026-07-15 -> 2026-07-10T23:59:59.000Z."
        test_recipe:
          setup: ["ZONE_B cutoff Friday(5); plan; member; subscription exist; clock 2026-07-01"]
          setup_api_calls:
            - call: "POST /_clock/set"
              payload: { now_iso8601: "2026-07-01T00:00:00.000Z" }
              as: PlatformAdmin
            - call: "POST /plans"
              payload: { code: "P_CUT", servings_per_meal: 2, meals_per_week: 2 }
              as: PlatformAdmin
              captures: { p: $.data.id }
            - call: "POST /shipping-zones"
              payload: { zone_code: "ZONE_B", cold_pack_surcharge_cents: 499, cutoff_weekday: 5 }
              as: PlatformAdmin
              captures: { z: $.data.id }
            - call: "POST /members"
              payload: { email: "cut@x.com", full_name: "Cut", shipping_zone_id: "${z}" }
              as: Anonymous
              captures: { m: $.data.id }
            - call: "POST /subscriptions"
              payload: { member_id: "${m}", plan_id: "${p}", billing_cycle_day: 1 }
              as: Member
              as_user_id: "${m}"
              captures: { s: $.data.id }
          trigger:
            - call: "POST /weekly-boxes"
              payload: { subscription_id: "${s}", delivery_date: "2026-07-15T00:00:00.000Z" }
              as: Member
              as_user_id: "${m}"
              captures: { box: $.data.id, cut: $.data.cutoff_at }
          assert:
            - "HTTP 201; data.cutoff_at == 2026-07-10T23:59:59.000Z; data.selection_status == OPEN; data.fulfillment_status == PENDING"

      - name: system_fields_input_ignored_on_create
        claim_type: System Fields
        grounds:
          - "entities.Subscription.fields.status"
        distinguishing_aspect: "POST /subscriptions cannot set status or version via input; status is forced to ACTIVE and version to 1 regardless of any extra fields (server-generated, input ignored)."
        test_recipe:
          setup: ["Plan, zone, member exist"]
          setup_api_calls:
            - call: "POST /plans"
              payload: { code: "P_SYS", servings_per_meal: 2, meals_per_week: 2 }
              as: PlatformAdmin
              captures: { p: $.data.id }
            - call: "POST /shipping-zones"
              payload: { zone_code: "ZONE_A", cold_pack_surcharge_cents: 0, cutoff_weekday: 5 }
              as: PlatformAdmin
              captures: { z: $.data.id }
            - call: "POST /members"
              payload: { email: "sys@x.com", full_name: "Sys", shipping_zone_id: "${z}" }
              as: Anonymous
              captures: { m: $.data.id }
          trigger:
            - call: "POST /subscriptions"
              payload: { member_id: "${m}", plan_id: "${p}", billing_cycle_day: 5 }
              as: Member
              as_user_id: "${m}"
              captures: { s: $.data.id }
          assert:
            - "HTTP 201; data.status == ACTIVE; data.version == 1"

  # ===========================================================================
  - section: state_machines
    instances:
      - name: cancel_already_cancelled_subscription_rejected
        claim_type: Invalid Transitions
        grounds:
          - "state_machines.Subscription.ACTIVE_to_CANCELLED"
          - "errors[ERR_SUBSCRIPTION_NOT_ACTIVE]"
        distinguishing_aspect: "Cancelling a CANCELLED subscription (terminal) is rejected; CANCELLED is terminal so neither cancel/pause/resume succeeds."
        test_recipe:
          setup: ["Subscription created and CANCELLED"]
          setup_api_calls:
            - call: "POST /plans"
              payload: { code: "P_C", servings_per_meal: 2, meals_per_week: 2 }
              as: PlatformAdmin
              captures: { p: $.data.id }
            - call: "POST /shipping-zones"
              payload: { zone_code: "ZONE_A", cold_pack_surcharge_cents: 0, cutoff_weekday: 5 }
              as: PlatformAdmin
              captures: { z: $.data.id }
            - call: "POST /members"
              payload: { email: "cc@x.com", full_name: "CC", shipping_zone_id: "${z}" }
              as: Anonymous
              captures: { m: $.data.id }
            - call: "POST /subscriptions"
              payload: { member_id: "${m}", plan_id: "${p}", billing_cycle_day: 1 }
              as: Member
              as_user_id: "${m}"
              captures: { s: $.data.id }
            - call: "POST /subscriptions/${s}/cancel"
              payload: {}
              as: Member
              as_user_id: "${m}"
          trigger:
            - call: "POST /subscriptions/${s}/cancel"
              payload: {}
              as: Member
              as_user_id: "${m}"
              captures: { err: $.data.error_id }
          assert:
            - "HTTP 409; data.error_id == ERR_SUBSCRIPTION_NOT_ACTIVE"

      - name: resume_active_subscription_rejected
        claim_type: Invalid Transitions
        grounds:
          - "state_machines.Subscription.PAUSED_to_ACTIVE"
          - "errors[ERR_SUBSCRIPTION_NOT_PAUSED]"
        distinguishing_aspect: "Resuming an ACTIVE (never-paused) subscription is rejected with ERR_SUBSCRIPTION_NOT_PAUSED."
        test_recipe:
          setup: ["ACTIVE subscription exists"]
          setup_api_calls:
            - call: "POST /plans"
              payload: { code: "P_RA", servings_per_meal: 2, meals_per_week: 2 }
              as: PlatformAdmin
              captures: { p: $.data.id }
            - call: "POST /shipping-zones"
              payload: { zone_code: "ZONE_A", cold_pack_surcharge_cents: 0, cutoff_weekday: 5 }
              as: PlatformAdmin
              captures: { z: $.data.id }
            - call: "POST /members"
              payload: { email: "ra@x.com", full_name: "RA", shipping_zone_id: "${z}" }
              as: Anonymous
              captures: { m: $.data.id }
            - call: "POST /subscriptions"
              payload: { member_id: "${m}", plan_id: "${p}", billing_cycle_day: 1 }
              as: Member
              as_user_id: "${m}"
              captures: { s: $.data.id }
          trigger:
            - call: "POST /subscriptions/${s}/resume"
              payload: {}
              as: Member
              as_user_id: "${m}"
              captures: { err: $.data.error_id }
          assert:
            - "HTTP 409; data.error_id == ERR_SUBSCRIPTION_NOT_PAUSED"

      - name: ship_uncharged_box_rejected
        claim_type: Invalid Transitions
        grounds:
          - "state_machines.WeeklyBox.CHARGED_to_SHIPPED"
          - "errors[ERR_BOX_NOT_CHARGED]"
        distinguishing_aspect: "Shipping a box still in fulfillment_status PENDING (never charged) is rejected with ERR_BOX_NOT_CHARGED."
        test_recipe:
          setup: ["Box OPEN/PENDING, never charged"]
          setup_api_calls:
            - call: "POST /_clock/set"
              payload: { now_iso8601: "2026-07-01T00:00:00.000Z" }
              as: PlatformAdmin
            - call: "POST /plans"
              payload: { code: "P_SU", servings_per_meal: 2, meals_per_week: 2 }
              as: PlatformAdmin
              captures: { p: $.data.id }
            - call: "POST /shipping-zones"
              payload: { zone_code: "ZONE_A", cold_pack_surcharge_cents: 0, cutoff_weekday: 5 }
              as: PlatformAdmin
              captures: { z: $.data.id }
            - call: "POST /members"
              payload: { email: "su@x.com", full_name: "SU", shipping_zone_id: "${z}" }
              as: Anonymous
              captures: { m: $.data.id }
            - call: "POST /subscriptions"
              payload: { member_id: "${m}", plan_id: "${p}", billing_cycle_day: 1 }
              as: Member
              as_user_id: "${m}"
              captures: { s: $.data.id }
            - call: "POST /weekly-boxes"
              payload: { subscription_id: "${s}", delivery_date: "2026-07-15T00:00:00.000Z" }
              as: Member
              as_user_id: "${m}"
              captures: { box: $.data.id }
          trigger:
            - call: "POST /weekly-boxes/${box}/ship"
              payload: {}
              as: PlatformOps
              captures: { err: $.data.error_id }
          assert:
            - "HTTP 409; data.error_id == ERR_BOX_NOT_CHARGED"

      - name: charge_before_cutoff_rejected
        claim_type: Precondition Enforcement
        grounds:
          - "state_machines.WeeklyBox.PENDING_to_CHARGED"
          - "errors[ERR_CUTOFF_NOT_REACHED]"
        distinguishing_aspect: "Charging a LOCKED box while current clock < cutoff_at is rejected with ERR_CUTOFF_NOT_REACHED."
        test_recipe:
          setup: ["Box LOCKED; clock still before cutoff 2026-07-10T23:59:59Z"]
          setup_api_calls:
            - call: "POST /_clock/set"
              payload: { now_iso8601: "2026-07-01T00:00:00.000Z" }
              as: PlatformAdmin
            - call: "POST /plans"
              payload: { code: "P_CB", servings_per_meal: 2, meals_per_week: 2 }
              as: PlatformAdmin
              captures: { p: $.data.id }
            - call: "POST /shipping-zones"
              payload: { zone_code: "ZONE_B", cold_pack_surcharge_cents: 499, cutoff_weekday: 5 }
              as: PlatformAdmin
              captures: { z: $.data.id }
            - call: "POST /recipes"
              payload: { title: "CB1" }
              as: PlatformAdmin
              captures: { r1: $.data.id }
            - call: "POST /recipes"
              payload: { title: "CB2" }
              as: PlatformAdmin
              captures: { r2: $.data.id }
            - call: "POST /members"
              payload: { email: "cb@x.com", full_name: "CB", shipping_zone_id: "${z}" }
              as: Anonymous
              captures: { m: $.data.id }
            - call: "POST /subscriptions"
              payload: { member_id: "${m}", plan_id: "${p}", billing_cycle_day: 1 }
              as: Member
              as_user_id: "${m}"
              captures: { s: $.data.id }
            - call: "POST /weekly-boxes"
              payload: { subscription_id: "${s}", delivery_date: "2026-07-15T00:00:00.000Z" }
              as: Member
              as_user_id: "${m}"
              captures: { box: $.data.id }
            - call: "POST /weekly-boxes/${box}/recipes"
              payload: { recipe_id: "${r1}" }
              as: Member
              as_user_id: "${m}"
            - call: "POST /weekly-boxes/${box}/recipes"
              payload: { recipe_id: "${r2}" }
              as: Member
              as_user_id: "${m}"
            - call: "POST /weekly-boxes/${box}/lock-selection"
              payload: {}
              as: Member
              as_user_id: "${m}"
          trigger:
            - call: "POST /weekly-boxes/${box}/charge"
              payload: {}
              as: PlatformOps
              captures: { err: $.data.error_id }
          assert:
            - "HTTP 409; data.error_id == ERR_CUTOFF_NOT_REACHED"

      - name: skip_locked_box_after_charge_rejected_cross_dimension
        claim_type: guarded transitions
        grounds:
          - "state_machines.WeeklyBox.LOCKED_to_SKIPPED"
          - "errors[ERR_BOX_ALREADY_CHARGED]"
        distinguishing_aspect: "Skipping a LOCKED box whose fulfillment_status is already CHARGED is rejected with ERR_BOX_ALREADY_CHARGED (cross-dimension guard between selection and fulfillment axes)."
        test_recipe:
          setup: ["Box LOCKED and CHARGED; member attempts skip"]
          setup_api_calls:
            - call: "POST /_clock/set"
              payload: { now_iso8601: "2026-07-01T00:00:00.000Z" }
              as: PlatformAdmin
            - call: "POST /plans"
              payload: { code: "P_SC", servings_per_meal: 2, meals_per_week: 2 }
              as: PlatformAdmin
              captures: { p: $.data.id }
            - call: "POST /shipping-zones"
              payload: { zone_code: "ZONE_A", cold_pack_surcharge_cents: 0, cutoff_weekday: 5 }
              as: PlatformAdmin
              captures: { z: $.data.id }
            - call: "POST /recipes"
              payload: { title: "SC1" }
              as: PlatformAdmin
              captures: { r1: $.data.id }
            - call: "POST /recipes"
              payload: { title: "SC2" }
              as: PlatformAdmin
              captures: { r2: $.data.id }
            - call: "POST /members"
              payload: { email: "sc@x.com", full_name: "SC", shipping_zone_id: "${z}" }
              as: Anonymous
              captures: { m: $.data.id }
            - call: "POST /subscriptions"
              payload: { member_id: "${m}", plan_id: "${p}", billing_cycle_day: 1 }
              as: Member
              as_user_id: "${m}"
              captures: { s: $.data.id }
            - call: "POST /weekly-boxes"
              payload: { subscription_id: "${s}", delivery_date: "2026-07-15T00:00:00.000Z" }
              as: Member
              as_user_id: "${m}"
              captures: { box: $.data.id }
            - call: "POST /weekly-boxes/${box}/recipes"
              payload: { recipe_id: "${r1}" }
              as: Member
              as_user_id: "${m}"
            - call: "POST /weekly-boxes/${box}/recipes"
              payload: { recipe_id: "${r2}" }
              as: Member
              as_user_id: "${m}"
            - call: "POST /weekly-boxes/${box}/lock-selection"
              payload: {}
              as: Member
              as_user_id: "${m}"
            - call: "POST /_clock/set"
              payload: { now_iso8601: "2026-07-11T00:00:00.000Z" }
              as: PlatformAdmin
            - call: "POST /weekly-boxes/${box}/charge"
              payload: {}
              as: PlatformOps
          trigger:
            - call: "POST /weekly-boxes/${box}/skip"
              payload: {}
              as: Member
              as_user_id: "${m}"
              captures: { err: $.data.error_id }
          assert:
            - "HTTP 409; data.error_id == ERR_BOX_ALREADY_CHARGED"

      - name: pause_credits_proration_excluded
        claim_type: Side Effect Execution
        grounds:
          - "state_machines.Subscription.ACTIVE_to_PAUSED"
        excluded_because:
          difficulty_instance: combinatorial_formula / pause_proration_multiply_then_round_order
          rationale: "Pause proration side-effect (credit_balance_cents += 623) is asserted by the named §1.8 instance."

      - name: ship_settles_referral_excluded
        claim_type: Side Effect Execution
        grounds:
          - "state_machines.WeeklyBox.CHARGED_to_SHIPPED"
        excluded_because:
          difficulty_instance: transitive_cascade / ship_settles_referral_credits_referrer_depth3
          rationale: "First-ship cascade settling the referral and crediting the referrer is asserted by the named §1.8 instance."

  # ===========================================================================
  - section: calculations
    instances:
      - name: serving_tier_999_band_at_12_servings
        claim_type: Correct Result
        grounds:
          - "calculations.weekly_box_charge"
        distinguishing_aspect: "12 total servings (4x3) sits in the 999/serving band; base 999*12=11988, provisional_charge_cents=11988 with no zone/loyalty/credit."
        test_recipe:
          setup: ["Plan 4x3=12 servings; ZONE_A; STANDARD; loyalty0; credit0; box locked"]
          setup_api_calls:
            - call: "POST /_clock/set"
              payload: { now_iso8601: "2026-07-01T00:00:00.000Z" }
              as: PlatformAdmin
            - call: "POST /plans"
              payload: { code: "P_12", servings_per_meal: 4, meals_per_week: 3 }
              as: PlatformAdmin
              captures: { p: $.data.id }
            - call: "POST /shipping-zones"
              payload: { zone_code: "ZONE_A", cold_pack_surcharge_cents: 0, cutoff_weekday: 5 }
              as: PlatformAdmin
              captures: { z: $.data.id }
            - call: "POST /recipes"
              payload: { title: "A" }
              as: PlatformAdmin
              captures: { r1: $.data.id }
            - call: "POST /recipes"
              payload: { title: "B" }
              as: PlatformAdmin
              captures: { r2: $.data.id }
            - call: "POST /recipes"
              payload: { title: "C" }
              as: PlatformAdmin
              captures: { r3: $.data.id }
            - call: "POST /members"
              payload: { email: "t12@x.com", full_name: "T12", shipping_zone_id: "${z}" }
              as: Anonymous
              captures: { m: $.data.id }
            - call: "POST /subscriptions"
              payload: { member_id: "${m}", plan_id: "${p}", billing_cycle_day: 1 }
              as: Member
              as_user_id: "${m}"
              captures: { s: $.data.id }
            - call: "POST /weekly-boxes"
              payload: { subscription_id: "${s}", delivery_date: "2026-07-15T00:00:00.000Z" }
              as: Member
              as_user_id: "${m}"
              captures: { box: $.data.id }
            - call: "POST /weekly-boxes/${box}/recipes"
              payload: { recipe_id: "${r1}" }
              as: Member
              as_user_id: "${m}"
            - call: "POST /weekly-boxes/${box}/recipes"
              payload: { recipe_id: "${r2}" }
              as: Member
              as_user_id: "${m}"
            - call: "POST /weekly-boxes/${box}/recipes"
              payload: { recipe_id: "${r3}" }
              as: Member
              as_user_id: "${m}"
          trigger:
            - call: "POST /weekly-boxes/${box}/lock-selection"
              payload: {}
              as: Member
              as_user_id: "${m}"
              captures: { prov: $.data.provisional_charge_cents }
          assert:
            - "WeeklyBox.${box}.provisional_charge_cents == 11988"

      - name: zero_addon_fee_proration_is_zero
        claim_type: Correct Result
        grounds:
          - "calculations.pause_proration_credit"
          - "state_machines.Subscription.ACTIVE_to_PAUSED"
        distinguishing_aspect: "When monthly_addon_fee_cents == 0, the proration formula yields exactly 0 credit on pause regardless of unused_days; Member.credit_balance_cents stays 0."
        test_recipe:
          setup: ["Subscription monthly_addon_fee_cents=0; pause yields 0 proration credit"]
          setup_api_calls:
            - call: "POST /_clock/set"
              payload: { now_iso8601: "2026-07-13T00:00:00.000Z" }
              as: PlatformAdmin
            - call: "POST /plans"
              payload: { code: "P_Z0", servings_per_meal: 2, meals_per_week: 2 }
              as: PlatformAdmin
              captures: { p: $.data.id }
            - call: "POST /shipping-zones"
