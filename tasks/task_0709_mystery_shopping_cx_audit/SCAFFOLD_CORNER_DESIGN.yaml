      - name: terminal_state_archived_script_cannot_be_published_again
        claim_type: Terminal State Lockdown
        grounds: ["state_machines.ScenarioScript.terminal_states", "errors[ERR_INVALID_STATE]"]
        distinguishing_aspect: "An ARCHIVED script (terminal) cannot transition back to PUBLISHED via publish → ERR_INVALID_STATE (409)."
        test_recipe:
          setup: ["A PUBLISHED script with no assignments, then archived."]
          setup_api_calls:
            - call: "POST /clients"
              payload: { company_name: "ArchCo", billing_email: "a@x.test", fee_per_completed_shop_cents: 15000 }
              as: Anonymous
              captures: { client_id: $.data.id }
            - call: "POST /clients/${client_id}/scripts"
              payload: { title: "A", scenario_family: "RETAIL", required_photo_count: 1, receipt_required: false, reimburse_cap_cents: 5000, base_fee_cents: 2000, weights_json: { greeting: 1.0 }, passing_score: 70 }
              as: ClientManager
              as_user_id: "${client_id}"
              captures: { script_id: $.data.id }
