      - name: parallel_roster_and_medical_dimensions_move_independently
        claim_type: parallel_dimensions
        grounds:
          - state_machines.Player.roster_designation
          - state_machines.Player.medical_status
        excluded_because:
          difficulty_instance: non_linear_state_machine / player_roster_and_medical_dimensions_advance_independently
          rationale: "That §1.8 instance walks both Player dimensions across the same call sequence and pins every (roster_designation, medical_status) pair, which is exactly this claim."

      - name: failed_trade_physical_cascades_down_to_every_asset
        claim_type: cascade_down
        grounds:
          - state_machines.TradeAsset.PROPOSED_to_RETURNED
          - state_machines.Trade.MEDICAL_REVIEW_to_VOIDED
        excluded_because:
          difficulty_instance: transitive_cascade / failed_trade_physical_cascade_voids_trade_and_returns_assets
          rationale: "The §1.8 instance asserts the exam -> trade -> asset -> club-counter chain end to end, including the RETURNED asset rows."

      - name: waiver_withdraw_compensates_every_release_side_effect
        claim_type: compensation
        grounds:
          - state_machines.WaiverRequest.PENDING_to_WITHDRAWN
          - state_machines.Transaction.APPROVED_to_VOIDED
        excluded_because:
          difficulty_instance: compensating_invariant / roster_headcount_conserved_on_waiver_withdraw
          rationale: "The §1.8 instance verifies that withdraw reverses every release side effect with no drift in roster counts, cap totals or dead money."

      - name: ir_activation_is_guarded_by_the_designation_return_window
        claim_type: guarded_transition
        grounds:
          - state_machines.Transaction.FILED_to_APPROVED
          - state_machines.InjuryDesignation.ACTIVE_to_RETURN_WINDOW_OPEN
        excluded_because:
          difficulty_instance: cross_entity_state_dependency / ir_activation_approval_depends_on_designation_return_window_state
          rationale: "The guard (approval allowed only while the cited designation is RETURN_WINDOW_OPEN) is asserted there in both the blocked and unblocked direction."

