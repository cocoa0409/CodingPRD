# =============================================================================
# §1.9 Scaffold Corner Design — Coverage Index for Non-Difficulty Tests
# branch-teller-operations
# =============================================================================
scaffold_corner_design:
  # -------------------------------------------------------------------------
  - section: entities
    instances:
      - name: branch_creation_returns_declared_fields
        claim_type: creation
        grounds: [entities.Branch, "endpoints[POST /api/branches]"]
        distinguishing_aspect: "POST /api/branches returns 201 with the declared input fields echoed, status OPEN, version 1, and a server-minted UUID id."
        test_recipe:
          setup: ["Empty database"]
          setup_api_calls: []
          trigger:
            - call: "POST /api/branches"
              payload: { name: "Main St", drawer_limit_cents: 1000000, vault_cash_cents: 50000000, over_short_investigation_threshold_cents: 1000 }
              as: BranchManager
              as_user_id: "mgr-1"
              captures: { b_id: $.data.id, b_status: $.data.status, b_ver: $.data.version }
          assert:
            - "response status 201; ${b_status} == OPEN; ${b_ver} == 1; ${b_id} is a non-empty UUID string; name/vault_cash_cents echo the input"

      - name: teller_creation_defaults_active
        claim_type: defaults
        grounds: [entities.Teller.fields.status]
        distinguishing_aspect: "A created teller defaults to status ACTIVE with no client status input."
        test_recipe:
          setup: ["Branch B exists"]
          setup_api_calls:
            - call: "POST /api/branches"
              payload: { name: "B", drawer_limit_cents: 1000000, vault_cash_cents: 50000000, over_short_investigation_threshold_cents: 1000 }
              as: BranchManager
              as_user_id: "mgr-1"
              captures: { b_id: $.data.id }
          trigger:
            - call: "POST /api/branches/${b_id}/tellers"
              payload: { display_name: "T" }
              as: BranchManager
              as_user_id: "mgr-1"
              captures: { t_status: $.data.status }
          assert:
            - "${t_status} == ACTIVE"

      - name: get_nonexistent_branch_returns_not_found
        claim_type: not_found
        grounds: ["errors[ERR_NOT_FOUND]"]
        distinguishing_aspect: "GET with a well-formed but unknown UUID returns 404 ERR_NOT_FOUND."
        test_recipe:
          setup: ["Empty database"]
          setup_api_calls: []
          trigger:
            - call: "GET /api/branches/8a3e1c0b-2f4d-4a91-9c8b-12e7b6a0f1d2"
              as: BranchManager
              as_user_id: "mgr-1"
              captures: { err: $.data.error_id }
          assert:
            - "${err} == ERR_NOT_FOUND (HTTP 404)"

      - name: branch_create_client_id_input_ignored
        claim_type: system_fields
        grounds: [entities.Branch]
        distinguishing_aspect: "A client-supplied id field on creation is ignored; the server mints its own id."
        test_recipe:
          setup: ["Empty database"]
          setup_api_calls: []
          trigger:
            - call: "POST /api/branches"
              payload: { name: "B", drawer_limit_cents: 1000000, vault_cash_cents: 50000000, over_short_investigation_threshold_cents: 1000, id: "11111111-1111-1111-1111-111111111111" }
              as: BranchManager
              as_user_id: "mgr-1"
              captures: { b_id: $.data.id }
          assert:
            - "${b_id} != 11111111-1111-1111-1111-111111111111"

      - name: transaction_missing_amount_returns_invalid_request
        claim_type: required_fields
        grounds: ["validations[priority=6]", "errors[ERR_INVALID_REQUEST]"]
        distinguishing_aspect: "Omitting required amount_cents on a transaction POST yields 400 ERR_INVALID_REQUEST."
        test_recipe:
          setup: ["Branch B; teller T with OPEN drawer; account A"]
          setup_api_calls:
            - call: "POST /api/branches"
              payload: { name: "B", drawer_limit_cents: 1000000, vault_cash_cents: 50000000, over_short_investigation_threshold_cents: 1000 }
              as: BranchManager
              as_user_id: "mgr-1"
              captures: { b_id: $.data.id }
            - call: "POST /api/branches/${b_id}/tellers"
              payload: { display_name: "T" }
              as: BranchManager
              as_user_id: "mgr-1"
              captures: { t_id: $.data.id }
            - call: "POST /api/branches/${b_id}/accounts"
              payload: { owner_name: "A", balance_cents: 100000 }
              as: BranchManager
              as_user_id: "mgr-1"
              captures: { a_id: $.data.id }
            - call: "POST /api/tellers/${t_id}/drawers"
              payload: {}
              as: HeadTeller
              as_user_id: "ht-1"
              captures: { d_id: $.data.id }
          trigger:
            - call: "POST /api/drawers/${d_id}/transactions"
              payload: { account_id: "${a_id}", type: "CASH_DEPOSIT" }
              as: Teller
              as_user_id: "${t_id}"
              captures: { err: $.data.error_id }
          assert:
            - "${err} == ERR_INVALID_REQUEST (HTTP 400)"

      - name: transaction_invalid_type_enum_rejected
        claim_type: type_constraints
        grounds: [entities.TellerTransaction.fields.type, "errors[ERR_INVALID_REQUEST]"]
        distinguishing_aspect: "A type value outside the declared enum (WIRE) is rejected with ERR_INVALID_REQUEST before any state change."
        test_recipe:
          setup: ["Branch B; teller T with OPEN drawer; account A"]
          setup_api_calls:
            - call: "POST /api/branches"
              payload: { name: "B", drawer_limit_cents: 1000000, vault_cash_cents: 50000000, over_short_investigation_threshold_cents: 1000 }
              as: BranchManager
              as_user_id: "mgr-1"
              captures: { b_id: $.data.id }
            - call: "POST /api/branches/${b_id}/tellers"
              payload: { display_name: "T" }
              as: BranchManager
              as_user_id: "mgr-1"
              captures: { t_id: $.data.id }
            - call: "POST /api/branches/${b_id}/accounts"
              payload: { owner_name: "A", balance_cents: 100000 }
              as: BranchManager
              as_user_id: "mgr-1"
              captures: { a_id: $.data.id }
            - call: "POST /api/tellers/${t_id}/drawers"
              payload: {}
              as: HeadTeller
              as_user_id: "ht-1"
              captures: { d_id: $.data.id }
          trigger:
            - call: "POST /api/drawers/${d_id}/transactions"
              payload: { account_id: "${a_id}", type: "WIRE", amount_cents: 100 }
              as: Teller
              as_user_id: "${t_id}"
              captures: { err: $.data.error_id }
          assert:
            - "${err} == ERR_INVALID_REQUEST"

      - name: branch_list_pagination_envelope
        claim_type: listing
        grounds: [response_envelope, "endpoints[GET /api/branches]"]
        distinguishing_aspect: "List responses carry the fixed envelope: data array plus total_count / has_more honoring limit and offset (defaults limit=10)."
        test_recipe:
          setup: ["Three branches exist"]
          setup_api_calls:
            - call: "POST /api/branches"
              payload: { name: "B1", drawer_limit_cents: 1000000, vault_cash_cents: 50000000, over_short_investigation_threshold_cents: 1000 }
              as: BranchManager
              as_user_id: "mgr-1"
            - call: "POST /api/branches"
              payload: { name: "B2", drawer_limit_cents: 1000000, vault_cash_cents: 50000000, over_short_investigation_threshold_cents: 1000 }
              as: BranchManager
              as_user_id: "mgr-1"
            - call: "POST /api/branches"
              payload: { name: "B3", drawer_limit_cents: 1000000, vault_cash_cents: 50000000, over_short_investigation_threshold_cents: 1000 }
              as: BranchManager
              as_user_id: "mgr-1"
          trigger:
            - call: "GET /api/branches"
              payload: { limit: 2, offset: 0 }
              as: Auditor
              as_user_id: "aud-1"
              captures: { page1: $.data }
            - call: "GET /api/branches"
              payload: { limit: 2, offset: 2 }
              as: Auditor
              as_user_id: "aud-1"
              captures: { page2: $.data }
          assert:
            - "page 1 contains exactly 2 items with total_count == 3 and has_more == true"
            - "page 2 contains exactly 1 item with has_more == false"
            - "list order is created_at ASC (B1 before B2 before B3)"
  # -------------------------------------------------------------------------
  - section: state_machines
    instances:
      - name: drawer_count_from_counting_rejected
        claim_type: invalid_transition
        grounds: [state_machines.TellerDrawer.OPEN_to_COUNTING, "errors[ERR_INVALID_STATE]"]
        distinguishing_aspect: "count is only valid from OPEN; a second count while COUNTING fails with ERR_INVALID_STATE."
        test_recipe:
          setup: ["Branch B; teller T with OPEN drawer (cash 0)"]
          setup_api_calls:
            - call: "POST /api/branches"
              payload: { name: "B", drawer_limit_cents: 1000000, vault_cash_cents: 50000000, over_short_investigation_threshold_cents: 1000 }
              as: BranchManager
              as_user_id: "mgr-1"
              captures: { b_id: $.data.id }
            - call: "POST /api/branches/${b_id}/tellers"
              payload: { display_name: "T" }
              as: BranchManager
              as_user_id: "mgr-1"
              captures: { t_id: $.data.id }
            - call: "POST /api/tellers/${t_id}/drawers"
              payload: {}
              as: HeadTeller
              as_user_id: "ht-1"
              captures: { d_id: $.data.id }
            - call: "POST /api/drawers/${d_id}/count"
              payload: { counted_cash_cents: 0 }
              as: Teller
              as_user_id: "${t_id}"
          trigger:
            - call: "POST /api/drawers/${d_id}/count"
              payload: { counted_cash_cents: 0 }
              as: Teller
              as_user_id: "${t_id}"
              captures: { err: $.data.error_id }
          assert:
            - "${err} == ERR_INVALID_STATE"

      - name: attest_from_open_rejected
        claim_type: invalid_transition
        grounds: [state_machines.TellerDrawer.COUNTING_to_BALANCED, "errors[ERR_INVALID_STATE]"]
        distinguishing_aspect: "attest requires COUNTING; attesting an OPEN drawer (never counted) fails with ERR_INVALID_STATE."
        test_recipe:
          setup: ["Branch B; teller T with OPEN drawer"]
          setup_api_calls:
            - call: "POST /api/branches"
              payload: { name: "B", drawer_limit_cents: 1000000, vault_cash_cents: 50000000, over_short_investigation_threshold_cents: 1000 }
              as: BranchManager
              as_user_id: "mgr-1"
              captures: { b_id: $.data.id }
            - call: "POST /api/branches/${b_id}/tellers"
              payload: { display_name: "T" }
              as: BranchManager
              as_user_id: "mgr-1"
              captures: { t_id: $.data.id }
            - call: "POST /api/tellers/${t_id}/drawers"
              payload: {}
              as: HeadTeller
              as_user_id: "ht-1"
              captures: { d_id: $.data.id }
          trigger:
            - call: "POST /api/drawers/${d_id}/attest"
              payload: {}
              as: BranchManager
              as_user_id: "mgr-1"
              captures: { err: $.data.error_id }
          assert:
            - "${err} == ERR_INVALID_STATE"

      - name: close_closed_drawer_rejected
        claim_type: idempotency
        grounds: [state_machines.TellerDrawer.BALANCED_to_CLOSED, "errors[ERR_INVALID_STATE]", "concurrency_rules[drawer-close-stale-drawer]"]
        distinguishing_aspect: "Closing an already-CLOSED drawer is rejected with ERR_INVALID_STATE — close is not idempotent."
        test_recipe:
          setup: ["Branch B; teller T whose drawer was counted 0, attested BALANCED, and CLOSED"]
          setup_api_calls:
            - call: "POST /api/branches"
              payload: { name: "B", drawer_limit_cents: 1000000, vault_cash_cents: 50000000, over_short_investigation_threshold_cents: 1000 }
              as: BranchManager
              as_user_id: "mgr-1"
              captures: { b_id: $.data.id }
            - call: "POST /api/branches/${b_id}/tellers"
              payload: { display_name: "T" }
              as: BranchManager
              as_user_id: "mgr-1"
              captures: { t_id: $.data.id }
            - call: "POST /api/tellers/${t_id}/drawers"
              payload: {}
              as: HeadTeller
              as_user_id: "ht-1"
              captures: { d_id: $.data.id }
            - call: "POST /api/drawers/${d_id}/count"
              payload: { counted_cash_cents: 0 }
              as: Teller
              as_user_id: "${t_id}"
            - call: "POST /api/drawers/${d_id}/attest"
              payload: {}
              as: BranchManager
              as_user_id: "mgr-1"
              captures: { d_ver: $.data.version }
            - call: "POST /api/drawers/${d_id}/close"
              payload: { expected_drawer_version: "${d_ver}" }
              as: BranchManager
              as_user_id: "mgr-1"
            - call: "GET /api/drawers/${d_id}"
              as: BranchManager
              as_user_id: "mgr-1"
              captures: { d_ver2: $.data.version }
          trigger:
            - call: "POST /api/drawers/${d_id}/close"
              payload: { expected_drawer_version: "${d_ver2}" }
              as: BranchManager
              as_user_id: "mgr-1"
              captures: { err: $.data.error_id }
          assert:
            - "${err} == ERR_INVALID_STATE"

      - name: cash_order_deliver_before_date_rejected
        claim_type: precondition_enforcement
        grounds: ["validations[priority=7]", "errors[ERR_ORDER_NOT_DUE]"]
        distinguishing_aspect: "Delivering an APPROVED order while the logical clock is still on an earlier date yields ERR_ORDER_NOT_DUE."
        test_recipe:
          setup: ["Branch B; teller T; an APPROVED order for delivery 2026-08-03; clock untouched at the 2026-08-01 default"]
          setup_api_calls:
            - call: "POST /api/branches"
              payload: { name: "B", drawer_limit_cents: 1000000, vault_cash_cents: 50000000, over_short_investigation_threshold_cents: 1000 }
              as: BranchManager
              as_user_id: "mgr-1"
              captures: { b_id: $.data.id, b_ver: $.data.version }
            - call: "POST /api/branches/${b_id}/tellers"
              payload: { display_name: "T" }
              as: BranchManager
              as_user_id: "mgr-1"
              captures: { t_id: $.data.id }
            - call: "POST /api/branches/${b_id}/cash-orders"
              payload: { delivery_date: "2026-08-03", expected_branch_version: "${b_ver}", requested_amount_cents: 100000 }
              as: Teller
              as_user_id: "${t_id}"
              captures: { o_id: $.data.id }
            - call: "POST /api/cash-orders/${o_id}/approve"
              payload: {}
              as: BranchManager
              as_user_id: "mgr-1"
          trigger:
            - call: "POST /api/cash-orders/${o_id}/deliver"
              payload: {}
              as: HeadTeller
              as_user_id: "ht-1"
              captures: { err: $.data.error_id }
          assert:
            - "${err} == ERR_ORDER_NOT_DUE"
            - "CashOrder.${o_id}.status == APPROVED (no state leaked)"

      - name: cash_order_deliver_from_pending_rejected
        claim_type: invalid_transition
        grounds: [state_machines.CashOrder.APPROVED_to_DELIVERED, "errors[ERR_INVALID_STATE]"]
        distinguishing_aspect: "deliver requires APPROVED; delivering a PENDING order fails with ERR_INVALID_STATE."
        test_recipe:
          setup: ["Branch B; teller T; a PENDING order for 2026-08-03; clock advanced to 2026-08-03"]
          setup_api_calls:
            - call: "POST /api/branches"
              payload: { name: "B", drawer_limit_cents: 1000000, vault_cash_cents: 50000000, over_short_investigation_threshold_cents: 1000 }
              as: BranchManager
              as_user_id: "mgr-1"
              captures: { b_id: $.data.id, b_ver: $.data.version }
            - call: "POST /api/branches/${b_id}/tellers"
              payload: { display_name: "T" }
              as: BranchManager
              as_user_id: "mgr-1"
              captures: { t_id: $.data.id }
            - call: "POST /api/branches/${b_id}/cash-orders"
              payload: { delivery_date: "2026-08-03", expected_branch_version: "${b_ver}", requested_amount_cents: 100000 }
              as: Teller
              as_user_id: "${t_id}"
              captures: { o_id: $.data.id }
            - call: "POST /api/_clock/set_current_utc"
              payload: { to_iso8601: "2026-08-03T00:00:00Z" }
              as: BranchManager
              as_user_id: "mgr-1"
          trigger:
            - call: "POST /api/cash-orders/${o_id}/deliver"
              payload: {}
              as: HeadTeller
              as_user_id: "ht-1"
              captures: { err: $.data.error_id }
          assert:
            - "${err} == ERR_INVALID_STATE"

      - name: teller_request_expires_on_date_change
        claim_type: side_effect_execution
        grounds: [state_machines.TellerRequest.PENDING_to_EXPIRED]
        distinguishing_aspect: "A PENDING teller request is automatically EXPIRED by the first clock advance that lands on a later calendar date; approving it afterwards fails with ERR_INVALID_STATE."
        test_recipe:
          setup: ["Branch B; teller T with OPEN drawer; account A; a PENDING ISSUE_INSTRUMENT request created on 2026-08-01"]
          setup_api_calls:
            - call: "POST /api/branches"
              payload: { name: "B", drawer_limit_cents: 1000000, vault_cash_cents: 50000000, over_short_investigation_threshold_cents: 1000 }
              as: BranchManager
              as_user_id: "mgr-1"
              captures: { b_id: $.data.id }
            - call: "POST /api/branches/${b_id}/tellers"
              payload: { display_name: "T" }
              as: BranchManager
              as_user_id: "mgr-1"
              captures: { t_id: $.data.id }
            - call: "POST /api/branches/${b_id}/accounts"
              payload: { owner_name: "A", balance_cents: 100000 }
              as: BranchManager
              as_user_id: "mgr-1"
              captures: { a_id: $.data.id }
            - call: "POST /api/tellers/${t_id}/drawers"
              payload: {}
              as: HeadTeller
              as_user_id: "ht-1"
              captures: { d_id: $.data.id }
            - call: "POST /api/drawers/${d_id}/teller-requests"
              payload: { type: "ISSUE_INSTRUMENT", params: { account_id: "${a_id}", instrument_type: "MONEY_ORDER", amount_cents: 50000, fee_waived: false } }
              as: Teller
              as_user_id: "${t_id}"
              captures: { r_id: $.data.id }
            - call: "POST /api/_clock/set_current_utc"
              payload: { to_iso8601: "2026-08-02T00:00:00Z" }
              as: BranchManager
              as_user_id: "mgr-1"
          trigger:
            - call: "GET /api/teller-requests/${r_id}"
              as: BranchManager
              as_user_id: "mgr-1"
              captures: { r_status: $.data.status }
            - call: "POST /api/teller-requests/${r_id}/approve"
              payload: {}
              as: BranchManager
              as_user_id: "mgr-1"
              captures: { err: $.data.error_id }
          assert:
            - "${r_status} == EXPIRED"
            - "${err} == ERR_INVALID_STATE"
            - "no TellerTransaction was created for the expired request (GET /api/transactions?drawer_id=... is empty)"

      - name: rejected_request_creates_approval_record
        claim_type: side_effect_execution
        grounds: [state_machines.TellerRequest.PENDING_to_REJECTED, entities.Approval]
        distinguishing_aspect: "Rejecting a teller request persists an immutable Approval record with action_type TELLER_REQUEST, status REJECTED, and the rejector's user id."
        test_recipe:
          setup: ["Branch B; teller T with OPEN drawer; account A; a PENDING FEE_WAIVER-less ISSUE_INSTRUMENT request"]
          setup_api_calls:
            - call: "POST /api/branches"
              payload: { name: "B", drawer_limit_cents: 1000000, vault_cash_cents: 50000000, over_short_investigation_threshold_cents: 1000 }
              as: BranchManager
              as_user_id: "mgr-1"
              captures: { b_id: $.data.id }
            - call: "POST /api/branches/${b_id}/tellers"
              payload: { display_name: "T" }
              as: BranchManager
              as_user_id: "mgr-1"
              captures: { t_id: $.data.id }
            - call: "POST /api/branches/${b_id}/accounts"
              payload: { owner_name: "A", balance_cents: 100000 }
              as: BranchManager
              as_user_id: "mgr-1"
              captures: { a_id: $.data.id }
            - call: "POST /api/tellers/${t_id}/drawers"
              payload: {}
              as: HeadTeller
              as_user_id: "ht-1"
              captures: { d_id: $.data.id }
            - call: "POST /api/drawers/${d_id}/teller-requests"
              payload: { type: "ISSUE_INSTRUMENT", params: { account_id: "${a_id}", instrument_type: "CASHIERS_CHECK", amount_cents: 25000, fee_waived: true } }
              as: Teller
              as_user_id: "${t_id}"
              captures: { r_id: $.data.id }
          trigger:
            - call: "POST /api/teller-requests/${r_id}/reject"
              payload: {}
              as: BranchManager
              as_user_id: "mgr-1"
              captures: { r_status: $.data.status }
            - call: "GET /api/approvals"
              payload: { branch_id: "${b_id}" }
              as: BranchManager
              as_user_id: "mgr-1"
              captures: { ap_type: "$.data[0].action_type", ap_status: "$.data[0].status", ap_by: "$.data[0].approved_by_user_id", ap_subj: "$.data[0].subject_id" }
          assert:
            - "${r_status} == REJECTED"
            - "${ap_type} == TELLER_REQUEST and ${ap_status} == REJECTED"
            - "${ap_by} == mgr-1"
            - "${ap_subj} == ${r_id}"

      - name: suspended_teller_cannot_open_drawer_then_reinstated
        claim_type: precondition_enforcement
        grounds: [state_machines.Teller.ACTIVE_to_SUSPENDED, state_machines.Teller.SUSPENDED_to_ACTIVE, "errors[ERR_TELLER_SUSPENDED]"]
        distinguishing_aspect: "A SUSPENDED teller's drawer-open is rejected with ERR_TELLER_SUSPENDED; after reinstate the same call succeeds (cyclic machine)."
        test_recipe:
          setup: ["Branch B; teller T, suspended by the manager"]
          setup_api_calls:
            - call: "POST /api/branches"
              payload: { name: "B", drawer_limit_cents: 1000000, vault_cash_cents: 50000000, over_short_investigation_threshold_cents: 1000 }
              as: BranchManager
              as_user_id: "mgr-1"
              captures: { b_id: $.data.id }
            - call: "POST /api/branches/${b_id}/tellers"
              payload: { display_name: "T" }
              as: BranchManager
              as_user_id: "mgr-1"
              captures: { t_id: $.data.id }
            - call: "POST /api/tellers/${t_id}/suspend"
              payload: {}
              as: BranchManager
              as_user_id: "mgr-1"
          trigger:
            - call: "POST /api/tellers/${t_id}/drawers"
              payload: {}
              as: HeadTeller
              as_user_id: "ht-1"
              captures: { err: $.data.error_id }
            - call: "POST /api/tellers/${t_id}/reinstate"
              payload: {}
              as: BranchManager
              as_user_id: "mgr-1"
              captures: { t_status: $.data.status }
            - call: "POST /api/tellers/${t_id}/drawers"
              payload: {}
              as: HeadTeller
              as_user_id: "ht-1"
              captures: { d_status: $.data.status }
          assert:
            - "${err} == ERR_TELLER_SUSPENDED"
            - "${t_status} == ACTIVE"
            - "${d_status} == OPEN"

      - name: surprise_audit_freezes_branch_immediately
        claim_type: side_effect_execution
        grounds: [state_machines.Branch.OPEN_to_AUDIT_FROZEN, state_machines.AuditSession]
        distinguishing_aspect: "Creating a SURPRISE audit immediately sets the session IN_PROGRESS with freeze_applied true and flips the branch to AUDIT_FROZEN in the same request."
        test_recipe:
          setup: ["Branch B exists"]
          setup_api_calls:
            - call: "POST /api/branches"
