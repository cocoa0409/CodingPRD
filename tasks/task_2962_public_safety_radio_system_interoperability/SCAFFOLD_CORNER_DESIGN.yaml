              captures: { unit_ofa_id: "$.data.id" }
            - call: "POST /radio-system/units/${unit_ofa_id}/lifecycle"
              payload: { action: "ASSIGN", template_id: "${tpl_ofa_id}" }
              as: AgencyRadioManager
              as_user_id: "${agency_ofa_id}"
            - call: "POST /radio-system/site-events"
              payload: { site_id: "${site_ofa_id}", event_class: "UNPLANNED_OUTAGE", cause: "COMMERCIAL_POWER_LOSS" }
              as: RFEngineer
              as_user_id: "rf-1"
              captures: { event_ofa_id: "$.data.id" }
            - call: "POST /radio-system/site-events/${event_ofa_id}/advance"
              payload: { action: "BACKUP_ENGAGED" }
              as: RFEngineer
