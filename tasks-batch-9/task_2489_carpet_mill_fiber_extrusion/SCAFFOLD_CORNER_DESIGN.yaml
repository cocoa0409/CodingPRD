      - name: dealer_buyer_may_submit_and_cancel_only_its_own_order
        claim_type: role_allowed
        grounds:
          - roles.DealerBuyer
          - validations[priority 3]
          - endpoints[POST /mill/cut-orders]
        distinguishing_aspect: |
          The entity-backed role's shared operations work end to end when the acting X-User-ID is its
          own Account id — submit, read, cancel — while the same submit naming the neighbouring
          account is scoped out. The dealer therefore has real capability, not merely read access.
        test_recipe:
          setup:
            - "ACTIVE style ST-SD-01 at 4275 cents/yard; accounts AC-01 and AC-02 each with a 100000000-cent limit."
          setup_api_calls:
            - call: "POST /mill/styles"
              payload: { style_code: "ST-SD-01", line_type: "RUNNING_LINE", gauge_code: "G_1_10", pile_construction: "CUT", pile_height_mm: 8.0, pattern_repeat_mm: 300.0, plies: 3, target_face_weight_oz: 32.00, dye_method: "SOLUTION_DYED", solution_color_code: "SC-BEIGE-01", list_price_cents_per_yard: 4275 }
