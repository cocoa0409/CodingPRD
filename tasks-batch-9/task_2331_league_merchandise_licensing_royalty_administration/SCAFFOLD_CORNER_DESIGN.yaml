              as: FinanceController
              as_user_id: "u_fin_1"
            - call: "GET /licensing/agreements/${agr_u3}"
              as: FinanceController
          assert:
            - "the ACCEPT response is 200 with data.status == 'ACCEPTED' and data.accepted_at set"
            - "the immediately following GET shows unrecouped_advance_cents == 130000, recouped_advance_cents == 120000 and cumulative_royalty_cents == 120000 on the first read, with no retry"
            - "advance_paid_cents == 250000 == 130000 + 120000 in that same first read"
