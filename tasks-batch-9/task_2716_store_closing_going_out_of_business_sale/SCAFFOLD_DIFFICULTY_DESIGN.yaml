            - "after return-unsold: Store.${st}.augmentation_units_accounted is still 200 — the conserved quantity never moved"
            - "the lot's three counters reconcile to it: units_on_hand == 0, units_sold == 50, units_returned == 150, units_initial == 200"
            - "the lot's lot_status == RETURNED_TO_SUPPLIER and its cost_value_cents == 100000 (recomputed from units_initial - units_returned)"
            - "AugmentationConsignment.${cons}.consignment_status == RETURNED with units_returned == 150"
            - "surrounding values legitimately moved: Store.${st}.augmentation_cost_value_cents == 100000, units_initial_total == 1250, realized_sell_through_pct == 0.0400"
            - "Store.${st}.projected_gross_recovery_cents == 9950000 and projected_recovery_ratio == 1.9900 because the RETURNED_TO_SUPPLIER lot leaves the projection input set"
            - "Store.${st}.realized_gross_recovery_cents == 250000 and realized_recovery_ratio == 0.0000 (augmentation sales never enter the ORIGINAL-only ratio)"

      - name: expense_void_conserves_the_three_engagement_expense_aggregates
        grounds:
          - calculations.expense_responsibility_split
          - state_machines.ExpenseItem.APPROVED_to_VOIDED
          - entities.Engagement.fields.expense_total_cents
          - entities.Engagement.fields.expense_liquidator_share_cents
          - entities.Engagement.fields.expense_retailer_share_cents
          - endpoints[POST /expense-items/{id}/decision]
        distinguishing_aspect: |
          A different conserved quantity in a different unit — MONEY, and an identity between three
          aggregates rather than a single counter: expense_total_cents must equal
          expense_liquidator_share_cents + expense_retailer_share_cents at every step, including
          across a void that must remove exactly the approved item's contribution and nothing else.
          The odd 250,001-cent amount makes the SHARED 0.40 split inexact (100,000 / 150,001), so a
          void implemented by re-deriving the retailer side from a percentage instead of removing
          the stored shares loses or invents a cent.
        test_recipe:
          setup:
            - "One ACTIVE FEE_BASED engagement with expense_responsibility SHARED and shared_expense_liquidator_pct 0.40, one NY store"
            - "Expense E1 of 250,001 cents (OCCUPANCY) and expense E2 of 100,000 cents (SECURITY), both SUBMITTED"
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { current_utc: "2026-09-15T00:00:00Z" }
              as: SystemOperator
            - call: "POST /jurisdictions"
              payload: { code: "NY", name: "New York", gob_license_required: true, max_sale_days: 60, license_cooling_off_days: 30, max_augmentation_ratio: 0.10, augmentation_disclosure_required: true, advertising_disclosure_required: false, surrender_notice_days: 10 }
              as: ComplianceOfficer
              as_user_id: "co-1"
              captures: { j_ny: $.data.id }
            - call: "POST /engagements"
              payload: { retailer_name: "Halloran Stores", liquidator_name: "Meridian Liquidation", economics_model: "FEE_BASED", guaranty_pct: 0, hybrid_retailer_excess_pct: 0, expense_responsibility: "SHARED", shared_expense_liquidator_pct: 0.40, sale_start_date: "2026-09-15", target_end_date: "2026-11-30" }
              as: LiquidationConsultant
              as_user_id: "lc-1"
              captures: { eng: $.data.id }
            - call: "POST /engagements/${eng}/stores"
              payload: { jurisdiction_id: "${j_ny}", store_code: "S-1501", address_line: "2 Anvil Way" }
              as: LiquidationConsultant
              as_user_id: "lc-1"
              captures: { st: $.data.id }
            - call: "POST /stores/${st}/inventory-lots"
              payload: { category: "APPAREL", source: "ORIGINAL", units_initial: 1000, unit_cost_cents: 2000, unit_retail_cents: 5000 }
              as: LiquidationConsultant
              as_user_id: "lc-1"
            - call: "POST /engagements/${eng}/submit-for-approval"
              payload: {}
              as: LiquidationConsultant
              as_user_id: "lc-1"
            - call: "POST /engagements/${eng}/approval-decision"
              payload: { decision: "APPROVE" }
              as: RetailerController
              as_user_id: "rc-1"
            - call: "POST /engagements/${eng}/expense-items"
              payload: { store_id: "${st}", expense_category: "OCCUPANCY", amount_cents: 250001, incurred_date: "2026-09-16" }
              as: LiquidationConsultant
              as_user_id: "lc-1"
              captures: { exp1: $.data.id }
            - call: "POST /engagements/${eng}/expense-items"
              payload: { store_id: "${st}", expense_category: "SECURITY", amount_cents: 100000, incurred_date: "2026-09-16" }
              as: LiquidationConsultant
              as_user_id: "lc-1"
              captures: { exp2: $.data.id }
          trigger:
            - call: "POST /expense-items/${exp1}/decision"
              payload: { action: "APPROVE" }
              as: RetailerController
              as_user_id: "rc-1"
            - call: "POST /expense-items/${exp2}/decision"
              payload: { action: "APPROVE" }
              as: RetailerController
              as_user_id: "rc-1"
            - call: "POST /expense-items/${exp1}/decision"
              payload: { action: "VOID" }
              as: RetailerController
              as_user_id: "rc-1"
          assert:
            - "before any approval: Engagement.${eng}.expense_total_cents == 0, expense_liquidator_share_cents == 0, expense_retailer_share_cents == 0 (SUBMITTED rows are outside the aggregates)"
            - "after approving E1: ExpenseItem.${exp1}.liquidator_share_cents == 100000 and retailer_share_cents == 150001, the remainder cent landing on the retailer"
            - "after approving E2: ExpenseItem.${exp2}.liquidator_share_cents == 40000 and retailer_share_cents == 60000"
            - "with both APPROVED: Engagement.${eng}.expense_total_cents == 350001, expense_liquidator_share_cents == 140000, expense_retailer_share_cents == 210001"
            - "the money identity holds before the void: 140000 + 210001 == 350001"
            - "after voiding E1: ExpenseItem.${exp1}.expense_status == VOIDED with liquidator_share_cents == 0 and retailer_share_cents == 0"
            - "after voiding E1: Engagement.${eng}.expense_total_cents == 100000, expense_liquidator_share_cents == 40000, expense_retailer_share_cents == 60000 — exactly E1's contribution removed, no cent lost or invented"
            - "the money identity still holds after the void: 40000 + 60000 == 100000"
            - "ExpenseItem.${exp2} is untouched by the void: expense_status == APPROVED, liquidator_share_cents == 40000, retailer_share_cents == 60000"
            - "ExpenseItem.${exp1}.amount_cents == 250001 is preserved for audit even though it contributes nothing"
