            - "PL-A freight_cost_per_sqft == 0.025660 (2450.0 / (1085 * 88.0)) at 6 dp, recovery_penalty_per_sqft == 0.006000 ((95.0 - 90.00) * 0.0012) and net_landed_cost_per_sqft == 0.031660"
            - "PL-B at creation: recovered_thickness_pct == 93.00 — 100 - 5.00 - the 2.0 FACED_RECOVERY_PENALTY_PCT, which PL-A never pays"
