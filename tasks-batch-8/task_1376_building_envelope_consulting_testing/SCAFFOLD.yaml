# =============================================================================
# §1.6 Error Code Catalog
# =============================================================================
errors:
  - { id: ERR_MISSING_USER_CONTEXT, http: 400, condition: "X-User-ID or X-User-Role header missing or empty" }
  - { id: ERR_FORBIDDEN_ROLE, http: 403, condition: "Role not permitted for this endpoint per §1.5" }
  - { id: ERR_NOT_FOUND, http: 404, condition: "Path resource id does not exist (validated left-to-right)" }
  - { id: ERR_INVALID_REQUEST, http: 400, condition: "Missing required field, invalid enum, numeric range violation, or Anomaly XOR violated (both or neither of field_test_id/survey_id set)" }
  - { id: ERR_ENGAGEMENT_NOT_IN_SETUP, http: 409, condition: "activate requires engagement.status == SETUP" }
  - { id: ERR_ENGAGEMENT_NOT_IN_PROGRESS, http: 409, condition: "Operation requires engagement.status == IN_PROGRESS" }
  - { id: ERR_ENGAGEMENT_NOT_CLOSING_OUT, http: 409, condition: "close requires engagement.status == CLOSE_OUT" }
  - { id: ERR_ENGAGEMENT_FROZEN, http: 409, condition: "Engagement posture is FROZEN (active litigation hold, risk_score < 40, or a VERIFIED CRITICAL anomaly)" }
  - { id: ERR_POSTURE_NOT_OPEN, http: 409, condition: "Operation requires posture == OPEN (DesignReview approve, RemediationPlan issue)" }
  - { id: ERR_OPEN_ANOMALIES_REMAIN, http: 409, condition: "begin-close-out blocked: anomalies in OPEN or VERIFIED exist" }
  - { id: ERR_UNCERTIFIED_TESTS_REMAIN, http: 409, condition: "begin-close-out blocked: field tests not yet CERTIFIED exist" }
  - { id: ERR_OPEN_REVIEWS_REMAIN, http: 409, condition: "begin-close-out blocked: design reviews in non-terminal states exist" }
  - { id: ERR_UNPAID_INVOICES_REMAIN, http: 409, condition: "close blocked: invoices in DRAFT or ISSUED exist" }
  - { id: ERR_UNRESOLVED_CLAIMS_REMAIN, http: 409, condition: "close blocked: warranty claims not RESOLVED exist" }
  - { id: ERR_DUPLICATE_ASSEMBLY_TAG, http: 409, condition: "Assembly tag already used within this engagement" }
  - { id: ERR_REVIEW_NOT_ACTIONABLE, http: 409, condition: "DesignReview not in the state required by the invoked transition" }
  - { id: ERR_DUTY_SEGREGATION_VIOLATION, http: 403, condition: "Same user performed and certified a field test, or issued round comments and approves the same round" }
  - { id: ERR_MOCKUP_NOT_ACTIONABLE, http: 409, condition: "MockUp not in the state required by the invoked transition" }
  - { id: ERR_SLOT_NOT_RESERVED, http: 409, condition: "ChamberSlot not RESERVED (already CONSUMED or RELEASED) or release attempted while referenced by a live mock-up uses ERR_SLOT_IN_USE" }
  - { id: ERR_SLOT_IN_USE, http: 409, condition: "Release blocked: a mock-up in PLANNED/CONSTRUCTING/READY_FOR_TEST/REMEDIATED references this slot" }
  - { id: ERR_OUTSIDE_SLOT_WINDOW, http: 409, condition: "Logical clock date outside the slot's half-open [start_date, end_date) window" }
  - { id: ERR_FIELD_TEST_NOT_ACTIONABLE, http: 409, condition: "FieldTest execution/diagnosis dimension not in the state required by the invoked transition" }
  - { id: ERR_ASSEMBLY_NOT_APPROVED, http: 409, condition: "FieldTest begin requires the assembly's review_status == APPROVED" }
  - { id: ERR_DIAGNOSIS_INCOMPLETE, http: 409, condition: "Certification of a FAIL result requires diagnosis_status == DIAGNOSED" }
  - { id: ERR_SURVEY_NOT_ACTIONABLE, http: 409, condition: "Survey not in the state required by the invoked transition" }
  - { id: ERR_IMAGING_DELTA_T_INSUFFICIENT, http: 409, condition: "THERMAL_IMAGING/COMBINED survey completion requires ambient_delta_t_c >= 3.0" }
  - { id: ERR_ANOMALY_NOT_OPEN, http: 409, condition: "verify/dismiss requires anomaly.status == OPEN" }
  - { id: ERR_ANOMALY_NOT_VERIFIED, http: 409, condition: "Plan issue or claim create requires every referenced anomaly to be VERIFIED" }
  - { id: ERR_PLAN_NOT_ACTIONABLE, http: 409, condition: "RemediationPlan not in the state required by the invoked transition" }
  - { id: ERR_SUPERSEDES_NOT_ISSUED, http: 409, condition: "supersedes_plan_id must reference a RemediationPlan of the same engagement with plan_status == ISSUED" }
  - { id: ERR_STALE_ENGAGEMENT_VERSION, http: 412, condition: "expected_engagement_version does not match the engagement's current version (OCC)" }
  - { id: ERR_CLAIM_NOT_ACTIONABLE, http: 409, condition: "WarrantyClaim not in the state required by the invoked transition (or invalid decision payload)" }
  - { id: ERR_ESCALATION_WINDOW_NOT_ELAPSED, http: 409, condition: "escalate requires logical clock >= response_due_at (30 days after filing)" }
  - { id: ERR_HOLD_NOT_ACTIVE, http: 409, condition: "release requires hold_status == ACTIVE" }
  - { id: ERR_WINDOW_OVERLAP, http: 409, condition: "ChamberSlot half-open overlap on same chamber_code, or MaintenanceVisit buffer-expanded closed-window overlap with another SCHEDULED visit" }
  - { id: ERR_VISIT_NOT_SCHEDULED, http: 409, condition: "complete/cancel requires visit_status == SCHEDULED" }
  - { id: ERR_OUTSIDE_VISIT_WINDOW, http: 409, condition: "complete requires logical clock date within the closed window [window_start_date, window_end_date]" }
  - { id: ERR_INVOICE_NOT_DRAFT, http: 409, condition: "issue/void requires invoice_status == DRAFT" }
  - { id: ERR_INVOICE_NOT_ISSUED, http: 409, condition: "mark-paid requires invoice_status == ISSUED" }
  - { id: ERR_FEE_CAP_EXCEEDED, http: 402, condition: "Fee event or invoice issuance would push recognized fees (or invoiced + new invoice) beyond fee_cap_cents" }

# =============================================================================
# §1.7 RBAC Matrix
# =============================================================================
roles:
  - name: Principal
    description: "Principal-in-charge; owns engagement lifecycle, litigation holds, certification, payments"
    identity: "opaque"
    exclusive_operations:
      - "POST /engagements — create engagement"
      - "POST /engagements/{id}/activate"
      - "POST /engagements/{id}/begin-close-out"
      - "POST /engagements/{id}/close"
      - "POST .../field-tests/{id}/certify"
      - "POST .../anomalies/{id}/dismiss"
      - "POST .../remediation-plans/{id}/complete"
      - "POST .../litigation-holds — apply hold"
      - "POST .../litigation-holds/{id}/release"
      - "POST .../invoices/{id}/mark-paid"
      - "POST /_clock/set_current_utc"
    shared_operations:
      - "GET endpoints (all roles)"
  - name: Consultant
    description: "Building-envelope consultant; owns assemblies, reviews submissions, mock-ups, plans, claims filing, invoices"
    identity: "opaque"
    exclusive_operations:
      - "POST .../assemblies"
      - "POST .../design-reviews"
      - "POST .../design-reviews/{id}/submit-revision"
      - "POST .../chamber-slots"
      - "POST .../chamber-slots/{id}/release"
      - "POST .../mock-ups and all mock-up transitions"
      - "POST .../field-tests"
      - "POST .../field-tests/{id}/begin-diagnosis"
      - "POST .../field-tests/{id}/complete-diagnosis"
      - "POST .../surveys, /analyze, /void"
      - "POST .../anomalies, /verify"
      - "POST .../remediation-plans, /issue, /withdraw"
      - "POST .../warranty-claims, /escalate, /resolve"
      - "POST .../maintenance-visits, /cancel"
      - "POST .../invoices, /issue, /void"
    shared_operations:
      - "GET endpoints (all roles)"
  - name: Reviewer
    description: "Independent design reviewer; starts reviews, issues comments, approves/rejects"
    identity: "opaque"
    exclusive_operations:
      - "POST .../design-reviews/{id}/start-review"
      - "POST .../design-reviews/{id}/issue-comments"
      - "POST .../design-reviews/{id}/approve"
      - "POST .../design-reviews/{id}/reject"
    shared_operations:
      - "GET endpoints (all roles)"
  - name: FieldTechnician
    description: "Performs field tests and surveys, completes maintenance visits"
    identity: "opaque"
    exclusive_operations:
      - "POST .../field-tests/{id}/begin"
      - "POST .../field-tests/{id}/record-result"
      - "POST .../surveys/{id}/complete"
      - "POST .../maintenance-visits/{id}/complete"
    shared_operations:
      - "GET endpoints (all roles)"
  - name: ManufacturerRep
    description: "Manufacturer representative; acknowledges and decides warranty claims"
    identity: "opaque"
    exclusive_operations:
      - "POST .../warranty-claims/{id}/manufacturer-acknowledge"
      - "POST .../warranty-claims/{id}/manufacturer-decide"
    shared_operations:
      - "GET endpoints (all roles)"
