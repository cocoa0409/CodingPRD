  - section: validations
    instances:
      - name: missing_headers_beat_forbidden_role_unauthenticated_ladder
        claim_type: priority_ordering
        grounds:
          - validations[priority 1]
          - validations[priority 2]
          - errors[ERR_UNAUTHENTICATED]
          - errors[ERR_FORBIDDEN_ROLE]
          - rbac
        distinguishing_aspect: >
          Priority 1 outranks priority 2, so a request that is BOTH unauthenticated and role-forbidden must
          report ERR_UNAUTHENTICATED - an implementation that resolves the route's allowed roles before checking
          the headers leaks ERR_FORBIDDEN_ROLE. Three distinct header defects (absent role, unknown role, empty
          user id) must all land on the same 401, and GET /mfg/_clock is the single declared exemption.
        test_recipe:
          setup:
            - "One ProductModel exists, created by a properly authenticated ComplianceEngineer."
            - "POST /mfg/suppliers is exclusive to SupplierQualityManager, so a WarrantyAnalyst is forbidden there."
            - "GET /mfg/_clock is the only endpoint exempt from the priority 1 header check."
          setup_api_calls:
            - call: "POST /mfg/product-models"
              payload: { model_code: "GX50-T", fuel_type: "GAS", nominal_capacity_gallons: 50, channel: "TRADE", insulation_r_value: 20, is_private_label: false }
              as: ComplianceEngineer
              captures: { m1_id: $.data.id }
          trigger:
            - call: "GET /mfg/product-models/${m1_id}"
              payload: {}
              as: "(X-User-Role header absent)"
            - call: "GET /mfg/product-models/${m1_id}"
              payload: {}
              as: "PlantJanitor"
            - call: "GET /mfg/product-models/${m1_id}"
              payload: {}
              as: ComplianceEngineer
              as_user_id: ""
            - call: "POST /mfg/suppliers"
              payload: { name: "Nope Ltd", component_category: "GAS_VALVE", audit_score: 80, defect_ppm: 500, open_capa_count: 0 }
              as: WarrantyAnalyst
            - call: "POST /mfg/suppliers"
              payload: { name: "Nope Ltd", component_category: "GAS_VALVE", audit_score: 80, defect_ppm: 500, open_capa_count: 0 }
              as: "(X-User-Role header absent)"
            - call: "GET /mfg/_clock"
              payload: {}
              as: "(X-User-Role header absent)"
          assert:
            - "the call with no X-User-Role header returns 401 with error_id == 'ERR_UNAUTHENTICATED'"
            - "the call with the undeclared role PlantJanitor returns 401 with error_id == 'ERR_UNAUTHENTICATED' (not 403)"
            - "the call with an empty X-User-ID returns 401 with error_id == 'ERR_UNAUTHENTICATED'"
            - "the WarrantyAnalyst POST /mfg/suppliers returns 403 with error_id == 'ERR_FORBIDDEN_ROLE'"
            - "the same POST with no role header returns 401 with error_id == 'ERR_UNAUTHENTICATED', proving priority 1 preempts priority 2"
            - "GET /mfg/_clock returns 200 with current_utc == '2026-08-01T00:00:00Z' even with no headers"
            - "no Supplier row was created by any of the refused calls"
      - name: path_id_resolution_precedes_body_schema_and_body_fk_not_found
        claim_type: priority_ordering
        grounds:
          - validations[priority 3]
          - validations[priority 4]
          - validations[priority 5]
          - errors[ERR_TANK_LOT_NOT_FOUND]
          - errors[ERR_HEATER_UNIT_NOT_FOUND]
          - errors[ERR_INVALID_REQUEST]
          - errors[ERR_PRODUCT_MODEL_NOT_FOUND]
        distinguishing_aspect: >
          The three-rung identifier ladder must be walked in order: an unknown PATH id beats a malformed body
          (3 before 4), and a malformed body beats an unknown BODY foreign key (4 before 5). The same request that
          returns ERR_INVALID_REQUEST while its planned_quantity is out of range must return
          ERR_PRODUCT_MODEL_NOT_FOUND once only the FK is wrong - so an implementation that resolves foreign keys
          while binding the request body inverts two of the three rungs.
        test_recipe:
          setup:
            - "No TankLot and no HeaterUnit exist, so every id used below is unknown."
            - "planned_quantity is constrained to 1..1000 by the entity schema."
            - "nominal_capacity_gallons is constrained to 20..120 and fuel_type to three enum members."
          setup_api_calls:

          trigger:
            - call: "POST /mfg/tank-lots/00000000-0000-0000-0000-000000000000/weld"
              payload: {}
              as: PlantOperator
            - call: "POST /mfg/heater-units/00000000-0000-0000-0000-000000000000/ship"
              payload: { install_water_hardness_gpg: 9.0, distribution_channel: "SUPERSTORE" }
              as: PlantOperator
            - call: "POST /mfg/tank-lots"
              payload: { product_model_id: "00000000-0000-0000-0000-000000000000", lot_code: "TL-BAD", planned_quantity: 5000 }
              as: PlantOperator
            - call: "POST /mfg/tank-lots"
              payload: { product_model_id: "00000000-0000-0000-0000-000000000000", lot_code: "TL-BAD", planned_quantity: 100 }
              as: PlantOperator
            - call: "POST /mfg/product-models"
              payload: { model_code: "DX50", fuel_type: "DIESEL", nominal_capacity_gallons: 50, channel: "TRADE", insulation_r_value: 20, is_private_label: false }
              as: ComplianceEngineer
            - call: "POST /mfg/product-models"
              payload: { model_code: "GX19", fuel_type: "GAS", nominal_capacity_gallons: 19, channel: "TRADE", insulation_r_value: 20, is_private_label: false }
              as: ComplianceEngineer
          assert:
            - "the weld on an unknown tank lot id returns 404 with error_id == 'ERR_TANK_LOT_NOT_FOUND'"
            - "the ship on an unknown unit id with an invalid channel enum returns 404 with error_id == 'ERR_HEATER_UNIT_NOT_FOUND' (priority 3 before priority 4)"
            - "the tank-lot create with planned_quantity 5000 AND an unknown model id returns 400 with error_id == 'ERR_INVALID_REQUEST' (priority 4 before priority 5)"
            - "the same create with planned_quantity 100 returns 404 with error_id == 'ERR_PRODUCT_MODEL_NOT_FOUND'"
            - "the DIESEL fuel_type returns 400 with error_id == 'ERR_INVALID_REQUEST'"
            - "nominal_capacity_gallons 19 returns 400 with error_id == 'ERR_INVALID_REQUEST'"
            - "no TankLot and no ProductModel row exists after all six calls"
      - name: duplicate_codes_and_window_sanity_rejected
        claim_type: violation_to_error
        grounds:
          - validations[priority 23]
          - validations[priority 26]
          - validations[priority 38]
          - validations[priority 4]
          - errors[ERR_DUPLICATE_CODE]
          - errors[ERR_INVALID_WINDOW]
          - errors[ERR_FIRING_TEMP_EXCEEDS_FURNACE_MAX]
        distinguishing_aspect: >
          Uniqueness is per entity and, for component lots, per SUPPLIER - the same part_number under a
          different supplier must be accepted, which separates a global unique index from the declared scope.
          The two temperature checks are also separated: 650 C violates the STATIC 700..1000 range and is a
          priority 4 ERR_INVALID_REQUEST, while 950 C violates the referenced furnace's own ceiling and is a
          priority 38 ERR_FIRING_TEMP_EXCEEDS_FURNACE_MAX. FURN-B has no batches at all, so the equal-endpoint
          window cannot collide and must surface ERR_INVALID_WINDOW rather than a conflict.
        test_recipe:
          setup:
            - "Furnace FURN-A (max 900 C) already holds batch GLB-001 over 06:00-10:00 on 2026-08-02."
            - "Furnace FURN-B (max 900 C) exists and holds no batch at all."
            - "Two qualified suppliers exist, and Meridian Controls already has a GV-880 lot."
            - "Tank lot TL-001 already exists for model GX50-T."
          setup_api_calls:
