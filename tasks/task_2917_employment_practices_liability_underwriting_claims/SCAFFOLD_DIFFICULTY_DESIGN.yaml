              payload: {}
              as: PlatformAdmin
              as_user_id: "admin-001"
            - call: "POST /epli/applicants"
              payload: { legal_name: "Meridian Grid Services", total_headcount: 10000, prior_year_separations: 2250, jurisdiction_headcounts: [{ code: "NY", headcount: 10000 }], primary_jurisdiction_code: "NY" }
              as: Underwriter
              as_user_id: "uw-001"
              captures: { at_app_id: $.data.id, at_app_v: $.data.version }
            - call: "POST /epli/applicants"
              payload: { legal_name: "Meridian Grid Holdings", total_headcount: 10000, prior_year_separations: 2249, jurisdiction_headcounts: [{ code: "NY", headcount: 10000 }], primary_jurisdiction_code: "NY" }
              as: Underwriter
              as_user_id: "uw-001"
              captures: { below_app_id: $.data.id, below_app_v: $.data.version }
            - call: "POST /epli/exposure-assessments"
