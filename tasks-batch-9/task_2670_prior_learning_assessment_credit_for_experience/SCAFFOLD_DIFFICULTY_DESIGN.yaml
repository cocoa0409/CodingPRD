      - name: withdraw_cascade_waterfall_skips_oversized_then_unblocks_smaller_claim
        grounds:
          - calculations.cap_unblock_waterfall
          - calculations.withdrawal_refund_settlement
          - state_machines.PlaClaim.SUBMITTED_to_WITHDRAWN
          - state_machines.Portfolio.SUBMITTED_to_VOIDED
          - entities.PlaClaim.fields.hold_reason
          - entities.Student.fields.pla_credits_reserved
