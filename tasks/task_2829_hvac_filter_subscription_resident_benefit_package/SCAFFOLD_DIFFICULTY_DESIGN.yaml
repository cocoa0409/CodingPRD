  - rule_id: resource_temporal_overlap
    instances:

      - name: unit_occupancy_closed_interval_with_three_day_turnover_buffer
        grounds:
          - validations.priority_22
          - errors.ERR_UNIT_OCCUPANCY_CONFLICT
          - entities.Subscription.fields.lease_start_date
          - entities.Subscription.fields.lease_end_date
          - entities.Unit.fields.status
        distinguishing_aspect: |
          Resource = Unit, interval semantics = CLOSED on both edges PLUS a mandatory
          TURNOVER_BUFFER_DAYS 3 gap, so the first legal start is lease_end + 4 days. The
          existing lease ends 2027-07-31: a new lease starting 2027-08-03 (a gap of exactly
          three days) still CONFLICTS, and 2027-08-04 is the first accepted date.
        test_recipe:
          setup:
            - "Property 'Cedar Ridge' is ACTIVE, PM_BILLED, benefit_tier PLUS, damage_waiver_enabled true, aqg_enabled true, credit_limit_cents 5000000."
            - "Unit A-101 is TWO_STAGE with filter_slot_count 2 and nominal_size_code 16x25x1; the MERV 8 SKU costs 680 cents."
            - "Resident Ada holds an ACTIVE subscription on unit A-101 with lease_start_date 2026-08-01 and lease_end_date 2027-07-31, so the unit is OCCUPIED."
            - "Resident Ben is a distinct resident, so priority 21 (duplicate unit_id + resident_id pair) cannot fire."
            - "TURNOVER_BUFFER_DAYS is 3, making 2027-08-03 the last conflicting start and 2027-08-04 the first legal one."
            - "Logical clock stands at 2026-08-05T00:00:00Z."
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-08-01T00:00:00Z" }
              as: ProgramOperator
            - call: "POST /filter-skus"
