            - call: "POST /ria/accounts"
              payload: { household_id: "${h_id}", firm_id: "${f_id}", account_number: "RIA-109002", account_type: "INDIVIDUAL", householding_consent: "OP_IN" }
              as: AdvisorOperationsLead
              captures: { a2_id: $.data.id }
            - call: "POST /ria/accounts/${a2_id}/activate"
              payload: {}
              as: CustodyOperationsOfficer
            - call: "POST /ria/accounts"
              payload: { household_id: "${h_id}", firm_id: "${f_id}", account_number: "RIA-109003", account_type: "INDIVIDUAL", householding_consent: "OP_IN" }
              as: AdvisorOperationsLead
              captures: { a3_id: $.data.id }
            - call: "POST /ria/accounts/${a3_id}/activate"
              payload: {}
              as: CustodyOperationsOfficer
          trigger:
            - call: "POST /ria/block-orders"
              payload: { firm_id: "${f_id}", model_id: "${model_id}", symbol: "VTI", side: "BUY", executed_share_micros: 1000000000, execution_price_micros: 52375001 }
              as: AdvisorOperationsLead
              captures: { blk_id: $.data.id }
            - call: "POST /ria/block-orders/${blk_id}/allocations"
              payload: { account_id: "${a1_id}", requested_share_micros: 333000000, allocation_rank: 1 }
              as: AdvisorOperationsLead
            - call: "POST /ria/block-orders/${blk_id}/allocations"
              payload: { account_id: "${a2_id}", requested_share_micros: 333000000, allocation_rank: 2 }
              as: AdvisorOperationsLead
            - call: "POST /ria/block-orders/${blk_id}/allocations"
              payload: { account_id: "${a3_id}", requested_share_micros: 334000001, allocation_rank: 3 }
              as: AdvisorOperationsLead
            - call: "POST /ria/block-orders/${blk_id}/submit"
              payload: {}
              as: AdvisorOperationsLead
            - call: "POST /ria/block-orders/${blk_id}/execute"
              payload: {}
              as: AdvisorOperationsLead
            - call: "GET /ria/block-orders/${blk_id}"
              as: AdvisorOperationsLead
              captures: { blk_v: $.data.version }
            - call: "POST /ria/block-orders/${blk_id}/allocate"
              payload: { expected_block_order_version: "${blk_v}" }
              as: AdvisorOperationsLead
              captures: { alloc_status: $.data.block_status }
            - call: "GET /ria/block-orders/${blk_id}"
              as: AdvisorOperationsLead
              captures: { blk_v2: $.data.version }
            - call: "POST /ria/block-orders/${blk_id}/settle"
              payload: {}
              as: CustodyOperationsOfficer
          assert:
            - "alloc_status == ALLOCATED and BlockOrder.${blk_id}.unallocated_share_micros == 0"
            - "sum of allocated_cost_cents over the three allocations is 5237501 before C4"
            - "sum of fee_rebate_cents over the three allocations is 1 afterwards, credited to the highest-cost allocation C (allocation_rank 3)"
            - "the invariant holds exactly: sum(allocated_cost_cents) - sum(fee_rebate_cents) == 5237500 == block notional"
            - "HOLDS: the conserved quantity 5237500 is identical before and after C4, so the compensating action introduces zero drift"
            - "HOLDS: the conserved quantity 5237500 is identical before and after C4, so the compensating action introduces zero drift"
            - "BlockOrder.${blk_id}.block_status == SETTLED and every allocation_status is SETTLED"
            - "BlockAllocation.average_price_micros for the credited allocation moved from 52375000 to 52374970"

      - name: household_fee_basis_conservation_under_relink
        grounds:
          - calculations.household_invariant_reconciliation
          - calculations.household_fee_basis
          - state_machines.HouseholdAccount.OPEN_to_CLOSED
          - entities.AdvisorFirm.fields.household_fee_basis_total_cents
        distinguishing_aspect: "Conserved quantity = a portfolio-owned count/cents total rather than money on a block: after an account is relinked out of household 1 and into household 2, the sum of all households' household_fee_basis_cents and the sum of all accounts' account_fee_basis_cents both must equal the firm's household_fee_basis_total_cents, with zero drift at every layer."
        test_recipe:
          setup:
            - "Logical clock at 2026-09-01T00:00:00Z. Firm with EXECUTED agreement and GRANTED BILLING entitlement, firm_posture OPEN."
            - "Two households HH-1 and HH-2; HH-1 hosts two OPEN billable accounts carrying 200000000 and 120000000 cents; HH-2 is empty."
          setup_api_calls:
            - *c_clock
            - *c_firm
            - *c_agr
            - *c_agr_submit
            - *c_agr_exec
            - *c_ent_bil
            - *c_ent_bil_grant
            - *c_house
            - *c_acct_a
            - *c_acct_a_act
            - *c_tx_a
            - *c_lot_a
            - *c_tx_a_out
            - *c_tx_a_recv
            - *c_acct_b
            - *c_acct_b_act
            - *c_tx_b
            - *c_lot_b
            - *c_tx_b_out
            - *c_tx_b_recv
            - call: "POST /ria/households"
              payload: { firm_id: "${f_id}", household_name: "Brennan Family" }
              as: AdvisorOperationsLead
              captures: { h2_id: $.data.id }
            - call: "POST /ria/systems/config"
              payload: { database_invariant_enforcement: "ENFORCED" }
              as: PlatformAdmin
              captures: { cfg_id: $.data.id }
            - &c_inv_eval
              call: "POST /ria/invariants/evaluate"
              payload: { firm_id: "${f_id}" }
              as: CustodyOperationsOfficer
          trigger:
            - call: "GET /ria/households/${h2_id}"
              as: AdvisorOperationsLead
              captures: { h2_v: $.data.version }
            - call: "POST /ria/accounts/${acct_b_id}/relink"
              payload: { target_household_id: "${h2_id}", expected_household_version: "${h2_v}" }
              as: AdvisorOperationsLead
            - call: "POST /ria/invariants/evaluate"
              payload: { firm_id: "${f_id}" }
              as: CustodyOperationsOfficer
              captures: { inv_status: "$.data[0].invariant_status", inv_expected: "$.data[0].expected_total_cents", inv_observed: "$.data[0].observed_total_cents" }
          assert:
            - "Household.${h_id}.household_fee_basis_cents == 200000000 after the relink and Household.${h2_id}.household_fee_basis_cents == 120000000"
            - "the sum of both households' fee bases is 320000000, unchanged by the relink"
            - "AdvisorFirm.${f_id}.household_fee_basis_total_cents == 320000000"
            - "inv_status == HOLDING and inv_expected == inv_observed == 320000000, so the reconciliation drift is 0 at every layer"
            - "GET /ria/firms/${f_id}/invariants returns HOUSEHOLD_FEE_BASIS_RECONCILIATION with breach_detail_code null"
