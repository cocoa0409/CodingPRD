              as: PlatformAdmin
              as_user_id: "pa-1"
            - call: "POST /haulers"
              payload: { name: "Green Haul", channels: ["ANIMAL_FEED"], rate_cents_per_tonne: 41000, stop_fee_cents: 900, capacity_kg_per_pickup: 300 }
              as: PlatformAdmin
              as_user_id: "pa-1"
          assert:
            - "the food-type trigger returns HTTP 409 with data.error_id == \"ERR_DUPLICATE_FOOD_TYPE_NAME\""
            - "the recipe trigger returns HTTP 409 with data.error_id == \"ERR_DUPLICATE_RECIPE_CODE\""
            - "the hauler trigger returns HTTP 409 with data.error_id == \"ERR_DUPLICATE_HAULER_NAME\""
            - "GET /food-types, GET /recipes and GET /haulers each still return total_count == 1"

      - name: duplicate_ticket_number_for_the_same_hauler_is_rejected
        claim_type: violation_to_error
