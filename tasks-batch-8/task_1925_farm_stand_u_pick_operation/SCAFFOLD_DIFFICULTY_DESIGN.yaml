# =============================================================================
# Task 1925 — Farm Stand & U-Pick Operation — §1.8 Scaffold Difficulty Design
# Test Targeting Index: 9 Difficulty Rules x >=2 instances = 20 instances.
# Every chain replays against SCAFFOLD.yaml §1.5 from empty-DB.
# Shared literals: Season "2026 Harvest" 2026-08-01..2026-08-31; policy A =
# (admission 650, container 200, surge 12500bps, bundle 1000bps, cap 1500);
# policy B = (admission 800, container 200, surge 12500, bundle 1000, cap 1500).
# Clock default 2026-08-01T00:00:00Z; tests set the clock explicitly.
# =============================================================================
scaffold_difficulty_design:
  # ---------------------------------------------------------------------------
  - rule_id: dual_variant_calc
    instances:
      - name: field_remaining_forward_vs_committed
        grounds:
          - calculations.field_remaining_oz
          - entities.Field.fields.committed_picked_oz
          - entities.Field.fields.projected_remaining_oz
          - state_machines.HarvestLine.PROVISIONAL_to_FINALIZED
        distinguishing_aspect: |
          Harvest-tally domain: at one instant, on one field, the COMMITTED basis
          (FINALIZED lines only) yields projected headroom 400 oz while the
          FORWARD-LOOKING basis (PROVISIONAL + FINALIZED) yields 100 oz — two
          valid inclusion sets producing different numbers from identical data.
        test_recipe:
          setup:
            - "Weekday 2026-08-04; field estimated_harvest_oz=1000, OPEN; window 09:00-17:00 capacity 30 OPEN; crop price 480 c/lb"
            - "Session party 1 containers 4, admission 1450 paid, FIELD_ACTIVE"
            - "Online line net 600 oz FINALIZED; offline batch line net 300 oz PROVISIONAL"
          setup_api_calls:
            - { call: "POST /farm/seasons", payload: { name: "2026 Harvest", start_date: "2026-08-01", end_date: "2026-08-31", waiver_text: "WAIVER-V1" }, as: FarmManager, captures: { s_id: $.data.id, s_v: $.data.version } }
            - { call: "POST /farm/seasons/${s_id}/activate", payload: {}, as: FarmManager, captures: { s_v2: $.data.version } }
            - { call: "POST /farm/pricing-policies", payload: { season_id: "${s_id}", expected_season_version: "${s_v2}", admission_per_person_cents: 650, container_fee_cents: 200, weekend_surge_bps: 12500, bundle_discount_bps: 1000, bundle_cap_cents: 1500 }, as: FarmManager, captures: { pol_id: $.data.id } }
            - { call: "POST /farm/crops", payload: { season_id: "${s_id}", name: "Strawberry", price_per_lb_cents: 480 }, as: FarmManager, captures: { crop_id: $.data.id } }
            - { call: "POST /farm/fields", payload: { season_id: "${s_id}", name: "North", rotation_group: "RG1", rotation_order: 1, estimated_harvest_oz: 1000 }, as: FarmManager, captures: { f_id: $.data.id } }
            - { call: "POST /farm/sales-days", payload: { season_id: "${s_id}", date: "2026-08-04", day_type: "WEEKDAY", parking_capacity: 50, staff_on_duty: 3 }, as: FarmManager, captures: { day_id: $.data.id } }
            - { call: "POST /farm/_clock/set_current_utc", payload: { to_iso8601: "2026-08-04T09:30:00Z" }, as: FarmManager }
            - { call: "POST /farm/sales-days/${day_id}/open-day", payload: {}, as: FarmManager }
            - { call: "POST /farm/fields/${f_id}/open", payload: {}, as: FarmManager }
            - { call: "POST /farm/field-day-windows", payload: { field_id: "${f_id}", date: "2026-08-04", open_time: "09:00", close_time: "17:00", picking_capacity_slots: 30 }, as: FarmManager, captures: { w_id: $.data.id } }
            - { call: "POST /farm/field-day-windows/${w_id}/open", payload: {}, as: FarmManager }
            - { call: "POST /farm/waivers", payload: { season_id: "${s_id}", signer_name: "Ann", signer_email: "ann@x.com", party_member_names: ["Ann"] }, as: Anonymous, captures: { wv_id: $.data.id } }
            - { call: "POST /farm/visit-sessions", payload: { window_id: "${w_id}", waiver_id: "${wv_id}", party_size: 1, container_count: 4, parking_spaces: 0, origin: "ONLINE" }, as: GateStaff, captures: { vs_id: $.data.id } }
            - { call: "POST /farm/payments", payload: { session_id: "${vs_id}", kind: "CHARGE", method: "CASH", amount_cents: 1450, idempotency_key: "k1" }, as: GateStaff }
            - { call: "POST /farm/visit-sessions/${vs_id}/enter-field", payload: {}, as: FieldStaff }
            - { call: "POST /farm/harvest-lines", payload: { session_id: "${vs_id}", crop_id: "${crop_id}", gross_weight_oz: 616, container_count: 4 }, as: FieldStaff, captures: { ln1_id: $.data.id } }
            - { call: "POST /farm/offline-batches", payload: { device_id: "DEV1", batch_id: "B1", records: [ { record_type: "HARVEST_LINE", sequence_index: 1, offline_ref: "L1", payload: { session_ref: "${vs_id}", crop_id: "${crop_id}", gross_weight_oz: 316, container_count: 4 } } ] }, as: KioskDevice, captures: { batch_id: $.data.id } }
          trigger:
            - { call: "GET /farm/fields/${f_id}", payload: {}, as: FarmManager, captures: { f_committed: $.data.committed_picked_oz, f_projected: $.data.projected_remaining_oz } }
            - { call: "GET /farm/crops/${crop_id}", payload: {}, as: FarmManager, captures: { crop_picked: $.data.season_picked_oz } }
          assert:
            - "Field.${f_id}.committed_picked_oz == 600 (FINALIZED only)"
            - "Field.${f_id}.projected_remaining_oz == 100 (1000 - 600 FINALIZED - 300 PROVISIONAL)"
            - "Crop.${crop_id}.season_picked_oz == 600 (committed basis only; the PROVISIONAL 300 oz is excluded)"
            - "HarvestLine.${ln1_id}.line_charge_cents == 18000 (round_half_up(600*480/16))"

      - name: weather_refund_paid_basis_vs_current_policy
        grounds:
          - calculations.weather_refund
          - state_machines.PricingPolicy.ACTIVE_to_SUPERSEDED
          - entities.VisitSession.fields.pricing_policy_id
        distinguishing_aspect: |
          Fiscal/refund domain (distinct from instance field_remaining's harvest
          domain): after a mid-day policy supersede, the pinned paid basis yields
          a 2200-cent refund while repricing under the current ACTIVE policy
          would yield 4400 cents — the scaffold pins paid_basis.
        test_recipe:
          setup:
            - "Weekend 2026-08-08; policy v1 (admission 800, container 200, surge 12500 bps) ACTIVE at session creation"
            - "Session party 2 containers 1: admission_charge = round(2*800*1.25) + 200 = 2200, paid 2200 by CARD, never entered field"
            - "Policy v2 (admission 1600, container 400) then supersedes v1"
          setup_api_calls:
            - { call: "POST /farm/seasons", payload: { name: "2026 Harvest", start_date: "2026-08-01", end_date: "2026-08-31", waiver_text: "WAIVER-V1" }, as: FarmManager, captures: { s_id: $.data.id, s_v: $.data.version } }
            - { call: "POST /farm/seasons/${s_id}/activate", payload: {}, as: FarmManager, captures: { s_v2: $.data.version } }
            - { call: "POST /farm/pricing-policies", payload: { season_id: "${s_id}", expected_season_version: "${s_v2}", admission_per_person_cents: 800, container_fee_cents: 200, weekend_surge_bps: 12500, bundle_discount_bps: 1000, bundle_cap_cents: 1500 }, as: FarmManager, captures: { pol_v1: $.data.id } }
            - { call: "POST /farm/fields", payload: { season_id: "${s_id}", name: "North", rotation_group: "RG1", rotation_order: 1, estimated_harvest_oz: 1000 }, as: FarmManager, captures: { f_id: $.data.id } }
            - { call: "POST /farm/sales-days", payload: { season_id: "${s_id}", date: "2026-08-08", day_type: "WEEKEND", parking_capacity: 50, staff_on_duty: 3 }, as: FarmManager, captures: { day_id: $.data.id } }
            - { call: "POST /farm/_clock/set_current_utc", payload: { to_iso8601: "2026-08-08T09:30:00Z" }, as: FarmManager }
            - { call: "POST /farm/sales-days/${day_id}/open-day", payload: {}, as: FarmManager }
            - { call: "POST /farm/fields/${f_id}/open", payload: {}, as: FarmManager }
            - { call: "POST /farm/field-day-windows", payload: { field_id: "${f_id}", date: "2026-08-08", open_time: "09:00", close_time: "17:00", picking_capacity_slots: 30 }, as: FarmManager, captures: { w_id: $.data.id } }
            - { call: "POST /farm/field-day-windows/${w_id}/open", payload: {}, as: FarmManager }
            - { call: "POST /farm/waivers", payload: { season_id: "${s_id}", signer_name: "Ann", signer_email: "ann@x.com", party_member_names: ["Ann", "Bob"] }, as: Anonymous, captures: { wv_id: $.data.id } }
            - { call: "POST /farm/visit-sessions", payload: { window_id: "${w_id}", waiver_id: "${wv_id}", party_size: 2, container_count: 1, parking_spaces: 1, origin: "ONLINE" }, as: GateStaff, captures: { vs_id: $.data.id } }
            - { call: "POST /farm/payments", payload: { session_id: "${vs_id}", kind: "CHARGE", method: "CARD", amount_cents: 2200, idempotency_key: "k1" }, as: GateStaff, captures: { pay_id: $.data.id } }
            - { call: "GET /farm/seasons/${s_id}", payload: {}, as: FarmManager, captures: { s_v3: $.data.version } }
            - { call: "POST /farm/pricing-policies", payload: { season_id: "${s_id}", expected_season_version: "${s_v3}", admission_per_person_cents: 1600, container_fee_cents: 400, weekend_surge_bps: 12500, bundle_discount_bps: 1000, bundle_cap_cents: 1500 }, as: FarmManager, captures: { pol_v2: $.data.id } }
            - { call: "POST /farm/_clock/set_current_utc", payload: { to_iso8601: "2026-08-08T11:30:00Z" }, as: FarmManager }
          trigger:
            - { call: "POST /farm/sales-days/${day_id}/close-weather", payload: {}, as: FarmManager }
            - { call: "GET /farm/visit-sessions/${vs_id}", payload: {}, as: FarmManager, captures: { vs_refunded: $.data.total_refunded_cents, vs_mode: $.data.checkout_mode } }
            - { call: "GET /farm/payments/${pay_id}", payload: {}, as: FarmManager, captures: { pay_refunded: $.data.refunded_amount_cents, pay_status: $.data.status } }
          assert:
            - "Payment.${pay_id}.refunded_amount_cents == 2200 (paid basis: admission component 2000 at 100% + container 200)"
            - "Payment.${pay_id}.refunded_amount_cents != 4400 (the current-policy reprice basis is forbidden)"
            - "VisitSession.${vs_id}.total_refunded_cents == 2200"
            - "VisitSession.${vs_id}.checkout_mode == WEATHER_FORCED"
            - "Payment.${pay_id}.status == REFUNDED"

  # ---------------------------------------------------------------------------
  - rule_id: combinatorial_formula
    instances:
      - name: admission_surge_component_rounding
        grounds:
          - calculations.admission_charge
          - entities.PricingPolicy.fields.weekend_surge_bps
          - entities.SalesDay.fields.day_type
        distinguishing_aspect: |
          Mode (a) — >=3 inputs with non-linear interaction: the surge branch
          fires only on WEEKEND and multiplies only the admission component
          (containers excluded), with round_half_up at the component level:
          party 3 / 2 containers is 2350 weekday vs 2838 weekend, not 2350*1.25.
        test_recipe:
          setup:
            - "Policy A (650/person, 200/container, surge 12500 bps); one waiver covering 3 guests"
            - "Weekday day 2026-08-04 and weekend day 2026-08-08, each with an OPEN 09:00-17:00 window of capacity 30 on the same OPEN field"
          setup_api_calls:
            - { call: "POST /farm/seasons", payload: { name: "2026 Harvest", start_date: "2026-08-01", end_date: "2026-08-31", waiver_text: "WAIVER-V1" }, as: FarmManager, captures: { s_id: $.data.id, s_v: $.data.version } }
            - { call: "POST /farm/seasons/${s_id}/activate", payload: {}, as: FarmManager, captures: { s_v2: $.data.version } }
            - { call: "POST /farm/pricing-policies", payload: { season_id: "${s_id}", expected_season_version: "${s_v2}", admission_per_person_cents: 650, container_fee_cents: 200, weekend_surge_bps: 12500, bundle_discount_bps: 1000, bundle_cap_cents: 1500 }, as: FarmManager, captures: { pol_id: $.data.id } }
            - { call: "POST /farm/fields", payload: { season_id: "${s_id}", name: "North", rotation_group: "RG1", rotation_order: 1, estimated_harvest_oz: 1000 }, as: FarmManager, captures: { f_id: $.data.id } }
            - { call: "POST /farm/sales-days", payload: { season_id: "${s_id}", date: "2026-08-04", day_type: "WEEKDAY", parking_capacity: 50, staff_on_duty: 3 }, as: FarmManager, captures: { day_wd: $.data.id } }
            - { call: "POST /farm/sales-days", payload: { season_id: "${s_id}", date: "2026-08-08", day_type: "WEEKEND", parking_capacity: 50, staff_on_duty: 3 }, as: FarmManager, captures: { day_we: $.data.id } }
            - { call: "POST /farm/_clock/set_current_utc", payload: { to_iso8601: "2026-08-04T09:30:00Z" }, as: FarmManager }
            - { call: "POST /farm/sales-days/${day_wd}/open-day", payload: {}, as: FarmManager }
            - { call: "POST /farm/fields/${f_id}/open", payload: {}, as: FarmManager }
            - { call: "POST /farm/field-day-windows", payload: { field_id: "${f_id}", date: "2026-08-04", open_time: "09:00", close_time: "17:00", picking_capacity_slots: 30 }, as: FarmManager, captures: { w_wd: $.data.id } }
            - { call: "POST /farm/field-day-windows/${w_wd}/open", payload: {}, as: FarmManager }
            - { call: "POST /farm/field-day-windows", payload: { field_id: "${f_id}", date: "2026-08-08", open_time: "09:00", close_time: "17:00", picking_capacity_slots: 30 }, as: FarmManager, captures: { w_we: $.data.id } }
            - { call: "POST /farm/waivers", payload: { season_id: "${s_id}", signer_name: "Ann", signer_email: "ann@x.com", party_member_names: ["Ann", "Bob", "Cid"] }, as: Anonymous, captures: { wv_id: $.data.id } }
            - { call: "POST /farm/visit-sessions", payload: { window_id: "${w_wd}", waiver_id: "${wv_id}", party_size: 3, container_count: 2, parking_spaces: 1, origin: "ONLINE" }, as: GateStaff, captures: { vs_wd: $.data.id, chg_wd: $.data.admission_charge_cents } }
            - { call: "POST /farm/_clock/set_current_utc", payload: { to_iso8601: "2026-08-08T09:30:00Z" }, as: FarmManager }
            - { call: "POST /farm/sales-days/${day_we}/open-day", payload: {}, as: FarmManager }
            - { call: "POST /farm/field-day-windows/${w_we}/open", payload: {}, as: FarmManager }
          trigger:
            - { call: "POST /farm/visit-sessions", payload: { window_id: "${w_we}", waiver_id: "${wv_id}", party_size: 3, container_count: 2, parking_spaces: 1, origin: "ONLINE" }, as: GateStaff, captures: { vs_we: $.data.id, chg_we: $.data.admission_charge_cents } }
          assert:
            - "VisitSession.${vs_wd}.admission_charge_cents == 2350 (650*3 + 200*2, no surge)"
            - "VisitSession.${vs_we}.admission_charge_cents == 2838 (round_half_up(1950*1.25)=2438 admission component + 400 containers)"
            - "2838 != 2938 (a whole-charge surge multiplication 2350*1.25 is the forbidden variant)"

      - name: weighout_per_line_rounding_order
        grounds:
          - calculations.weigh_out_total
          - entities.HarvestLine.fields.line_charge_cents
        distinguishing_aspect: |
          Mode (b) — nested rounding order: the scaffold pins round-per-line THEN
          sum; two 1-oz lines at 310 c/lb total 19+19=38 cents, whereas
          sum-then-round would give round(38.75)=39. Distinct mode from
          admission_surge_component_rounding (mode a).
        test_recipe:
          setup:
            - "Weekday 2026-08-04; policy A; crop price_per_lb_cents=310; session party 1 containers 0 (admission 650), paid 650, FIELD_ACTIVE"
          setup_api_calls:
            - { call: "POST /farm/seasons", payload: { name: "2026 Harvest", start_date: "2026-08-01", end_date: "2026-08-31", waiver_text: "WAIVER-V1" }, as: FarmManager, captures: { s_id: $.data.id, s_v: $.data.version } }
            - { call: "POST /farm/seasons/${s_id}/activate", payload: {}, as: FarmManager, captures: { s_v2: $.data.version } }
            - { call: "POST /farm/pricing-policies", payload: { season_id: "${s_id}", expected_season_version: "${s_v2}", admission_per_person_cents: 650, container_fee_cents: 200, weekend_surge_bps: 12500, bundle_discount_bps: 1000, bundle_cap_cents: 1500 }, as: FarmManager, captures: { pol_id: $.data.id } }
            - { call: "POST /farm/crops", payload: { season_id: "${s_id}", name: "Raspberry", price_per_lb_cents: 310 }, as: FarmManager, captures: { crop310: $.data.id } }
            - { call: "POST /farm/fields", payload: { season_id: "${s_id}", name: "North", rotation_group: "RG1", rotation_order: 1, estimated_harvest_oz: 1000 }, as: FarmManager, captures: { f_id: $.data.id } }
            - { call: "POST /farm/sales-days", payload: { season_id: "${s_id}", date: "2026-08-04", day_type: "WEEKDAY", parking_capacity: 50, staff_on_duty: 3 }, as: FarmManager, captures: { day_id: $.data.id } }
            - { call: "POST /farm/_clock/set_current_utc", payload: { to_iso8601: "2026-08-04T09:30:00Z" }, as: FarmManager }
            - { call: "POST /farm/sales-days/${day_id}/open-day", payload: {}, as: FarmManager }
            - { call: "POST /farm/fields/${f_id}/open", payload: {}, as: FarmManager }
            - { call: "POST /farm/field-day-windows", payload: { field_id: "${f_id}", date: "2026-08-04", open_time: "09:00", close_time: "17:00", picking_capacity_slots: 30 }, as: FarmManager, captures: { w_id: $.data.id } }
            - { call: "POST /farm/field-day-windows/${w_id}/open", payload: {}, as: FarmManager }
            - { call: "POST /farm/waivers", payload: { season_id: "${s_id}", signer_name: "Ann", signer_email: "ann@x.com", party_member_names: ["Ann"] }, as: Anonymous, captures: { wv_id: $.data.id } }
            - { call: "POST /farm/visit-sessions", payload: { window_id: "${w_id}", waiver_id: "${wv_id}", party_size: 1, container_count: 0, parking_spaces: 0, origin: "ONLINE" }, as: GateStaff, captures: { vs_id: $.data.id } }
            - { call: "POST /farm/payments", payload: { session_id: "${vs_id}", kind: "CHARGE", method: "CASH", amount_cents: 650, idempotency_key: "k1" }, as: GateStaff }
            - { call: "POST /farm/visit-sessions/${vs_id}/enter-field", payload: {}, as: FieldStaff }
          trigger:
            - { call: "POST /farm/harvest-lines", payload: { session_id: "${vs_id}", crop_id: "${crop310}", gross_weight_oz: 5, container_count: 1 }, as: FieldStaff, captures: { ln1: $.data.id, ln1_charge: $.data.line_charge_cents } }
            - { call: "POST /farm/harvest-lines", payload: { session_id: "${vs_id}", crop_id: "${crop310}", gross_weight_oz: 5, container_count: 1 }, as: FieldStaff, captures: { ln2: $.data.id, ln2_charge: $.data.line_charge_cents } }
            - { call: "POST /farm/payments", payload: { session_id: "${vs_id}", kind: "CHARGE", method: "CASH", amount_cents: 38, idempotency_key: "k2" }, as: FieldStaff }
            - { call: "POST /farm/visit-sessions/${vs_id}/checkout", payload: {}, as: FieldStaff, captures: { final_total: $.data.final_total_cents } }
          assert:
            - "HarvestLine.${ln1}.net_oz == 1 and line_charge_cents == 19 (round_half_up(1*310/16)=round_half_up(19.375))"
            - "HarvestLine.${ln2}.line_charge_cents == 19"
            - "VisitSession.${vs_id}.final_total_cents == 688 (650 admission + 19 + 19 per-line)"
            - "VisitSession.${vs_id}.final_total_cents != 689 (650 + round_half_up(2*310/16)=39 is the forbidden sum-then-round order)"

      - name: bundle_discount_evaluation_order
        grounds:
          - calculations.checkout_settlement
          - entities.VisitSession.fields.bundle_discount_cents
          - entities.AddonBooking.fields.booked_value_cents
        distinguishing_aspect: |
          Mode (c) — circular-looking dependency with pinned evaluation order:
          the discount base EXCLUDES harvest and is computed before the total;
          base 3000 -> discount min(1500, 300) = 300 -> final 3300. Including
          harvest in the base (discount 360, final 3240) is the forbidden
          reading. Distinct mode from instances (a) and (b).
        test_recipe:
          setup:
            - "Weekday 2026-08-04; policy A; wagon 900 c (cap 20), cafe 600 c (cap 20); crop 480 c/lb"
            - "Session party 2 containers 1 (admission 1500), paid 1500, FIELD_ACTIVE; both addons booked qty 1 and REDEEMED; one FINALIZED line net 20 oz (600 c)"
          setup_api_calls:
            - { call: "POST /farm/seasons", payload: { name: "2026 Harvest", start_date: "2026-08-01", end_date: "2026-08-31", waiver_text: "WAIVER-V1" }, as: FarmManager, captures: { s_id: $.data.id, s_v: $.data.version } }
            - { call: "POST /farm/seasons/${s_id}/activate", payload: {}, as: FarmManager, captures: { s_v2: $.data.version } }
            - { call: "POST /farm/pricing-policies", payload: { season_id: "${s_id}", expected_season_version: "${s_v2}", admission_per_person_cents: 650, container_fee_cents: 200, weekend_surge_bps: 12500, bundle_discount_bps: 1000, bundle_cap_cents: 1500 }, as: FarmManager, captures: { pol_id: $.data.id } }
            - { call: "POST /farm/crops", payload: { season_id: "${s_id}", name: "Strawberry", price_per_lb_cents: 480 }, as: FarmManager, captures: { crop_id: $.data.id } }
            - { call: "POST /farm/addon-products", payload: { season_id: "${s_id}", kind: "WAGON_RIDE", name: "Orchard Wagon", price_cents: 900, slot_capacity: 20 }, as: FarmManager, captures: { wagon_id: $.data.id } }
            - { call: "POST /farm/addon-products", payload: { season_id: "${s_id}", kind: "CAFE_VOUCHER", name: "Cafe Voucher", price_cents: 600, slot_capacity: 20 }, as: FarmManager, captures: { cafe_id: $.data.id } }
            - { call: "POST /farm/fields", payload: { season_id: "${s_id}", name: "North", rotation_group: "RG1", rotation_order: 1, estimated_harvest_oz: 1000 }, as: FarmManager, captures: { f_id: $.data.id } }
            - { call: "POST /farm/sales-days", payload: { season_id: "${s_id}", date: "2026-08-04", day_type: "WEEKDAY", parking_capacity: 50, staff_on_duty: 3 }, as: FarmManager, captures: { day_id: $.data.id } }
            - { call: "POST /farm/_clock/set_current_utc", payload: { to_iso8601: "2026-08-04T09:30:00Z" }, as: FarmManager }
            - { call: "POST /farm/sales-days/${day_id}/open-day", payload: {}, as: FarmManager }
            - { call: "POST /farm/fields/${f_id}/open", payload: {}, as: FarmManager }
            - { call: "POST /farm/field-day-windows", payload: { field_id: "${f_id}", date: "2026-08-04", open_time: "09:00", close_time: "17:00", picking_capacity_slots: 30 }, as: FarmManager, captures: { w_id: $.data.id } }
            - { call: "POST /farm/field-day-windows/${w_id}/open", payload: {}, as: FarmManager }
            - { call: "POST /farm/waivers", payload: { season_id: "${s_id}", signer_name: "Ann", signer_email: "ann@x.com", party_member_names: ["Ann", "Bob"] }, as: Anonymous, captures: { wv_id: $.data.id } }
            - { call: "POST /farm/visit-sessions", payload: { window_id: "${w_id}", waiver_id: "${wv_id}", party_size: 2, container_count: 1, parking_spaces: 0, origin: "ONLINE" }, as: GateStaff, captures: { vs_id: $.data.id } }
            - { call: "POST /farm/payments", payload: { session_id: "${vs_id}", kind: "CHARGE", method: "CASH", amount_cents: 1500, idempotency_key: "k1" }, as: GateStaff }
            - { call: "POST /farm/visit-sessions/${vs_id}/enter-field", payload: {}, as: FieldStaff }
