      - name: host_notify_count_increments_on_prereg_and_signin
        claim_type: rate_threshold_triggers
        grounds: [entities.Host.fields.notify_count, state_machines.Visit.CLEARED_to_SIGNED_IN]
        distinguishing_aspect: "Host.notify_count == 2 after one pre-registration (+1) and that visit's sign-in (+1) — cumulative counter increments per notification event."
