              as_user_id: "${adv_id}"
              captures: { call_a: "$.data.id" }
            - call: "POST /hotline-calls/${call_a}/risk-assessments"
              payload: { weapon_access: true, strangulation_history: false, separation_recent: true, threats_to_kill: false, stalking_frequency_per_week: 2 }
              as: HotlineAdvocate
              as_user_id: "${adv_id}"
            - call: "POST /clients"
              payload: { client_code: "C-2009", legal_name: "Sela Ward", household_size: 2, minor_children_count: 0, accessibility_required: false, location_confidential: true }
              as: HotlineAdvocate
              as_user_id: "${adv_id}"
              captures: { client_b: "$.data.id" }
            - call: "POST /hotline-calls"
              payload: { client_id: "${client_b}", caller_type: "SURVIVOR", presenting_concerns: "Wants a written plan only." }
              as: HotlineAdvocate
              as_user_id: "${adv_id}"
              captures: { call_b: "$.data.id" }
