    input: [fault_code, severity_class, max_remote_resets_per_24h, requires_dispatch, contractual_exclusion]
    output: FaultCodeRule
    side_effects: []
  - method: GET
    path: "/wind-ops/fault-code-rules/{id}"
    description: "Read one fault code rule."
    roles: [SiteAdmin, ControlRoomOperator, MaintenancePlanner, ReliabilityEngineer, CrewLead, CommercialManager]
    code: 200
    input: []
    output: FaultCodeRule
    side_effects: []
  - method: GET
    path: "/wind-ops/fault-code-rules"
    description: "List fault code rules filtered by severity class."
    roles: [SiteAdmin, ControlRoomOperator, MaintenancePlanner, ReliabilityEngineer, CrewLead, CommercialManager]
    code: 200
    input: ["severity_class?", "fault_code?", "limit?", "offset?"]
    output: FaultCodeRule[]
    side_effects: []
  - method: PATCH
    path: "/wind-ops/fault-code-rules/{id}"
    description: "Amend a fault code rule's quota, dispatch requirement or contractual exclusion. Existing FaultEvent rows keep the snapshot pinned at the moment they were raised."
    roles: [SiteAdmin]
    code: 200
    input: ["max_remote_resets_per_24h?", "requires_dispatch?", "contractual_exclusion?"]
    output: FaultCodeRule
    side_effects:
      - "increments FaultCodeRule.version by 1"
      - "does NOT alter severity_class_pinned, max_remote_resets_pinned, requires_dispatch_pinned, contractual_exclusion_pinned or fault_code_rule_version_pinned on any existing FaultEvent"

  - method: POST
    path: "/wind-ops/turbines/{id}/fault-events"
    description: "Raise a SCADA fault against a turbine. The matching FaultCodeRule's severity class, reset quota, exclusion flag and version are pinned onto the event at this moment."
    roles: [ControlRoomOperator]
    code: 201
    input: [fault_code, raised_at]
    output: FaultEvent
    side_effects:
      - "sets triage_state to RAISED and reset_attempt_count to 0"
      - "pins severity_class_pinned, max_remote_resets_pinned, requires_dispatch_pinned, contractual_exclusion_pinned and fault_code_rule_version_pinned from the current FaultCodeRule row"
      - "moves Turbine.availability_state from ONLINE to FAULTED, leaving Turbine.curtailment_state untouched"
  - method: GET
    path: "/wind-ops/fault-events/{id}"
    description: "Read one fault event including its pinned rule snapshot, downtime hours and lost energy."
    roles: [SiteAdmin, ControlRoomOperator, MaintenancePlanner, ReliabilityEngineer, CrewLead, CommercialManager]
    code: 200
    input: []
    output: FaultEvent
    side_effects: []
  - method: GET
    path: "/wind-ops/fault-events"
    description: "List fault events filtered by turbine, rule or triage state. Reverse-reachability channel for FaultEvent.turbine_id and FaultEvent.fault_code_rule_id."
    roles: [SiteAdmin, ControlRoomOperator, MaintenancePlanner, ReliabilityEngineer, CrewLead, CommercialManager]
    code: 200
    input: ["turbine_id?", "fault_code_rule_id?", "triage_state?", "limit?", "offset?"]
    output: FaultEvent[]
    side_effects: []
  - method: POST
    path: "/wind-ops/fault-events/{id}/triage"
    description: "Record the control-room triage disposition: attempt a remote reset on a RAISED fault, or escalate a RAISED or RESET_PENDING fault to a technician dispatch."
    roles: [ControlRoomOperator]
    code: 200
    input: [disposition]
    output: FaultEvent
    side_effects:
      - "disposition REMOTE_RESET moves triage_state from RAISED to RESET_PENDING"
      - "disposition DISPATCH moves triage_state from RAISED or RESET_PENDING to DISPATCH_REQUIRED, consuming no reset attempt"
      - "rejected with ERR_RESET_NOT_PERMITTED when disposition is REMOTE_RESET and the event's severity_class_pinned is not RESETTABLE or its requires_dispatch_pinned is true"
      - "leaves both Turbine state dimensions untouched"
  - method: POST
    path: "/wind-ops/fault-events/{id}/remote-reset"
    description: "Attempt a remote reset from the control room and report the SCADA outcome. Gated by the remote_reset_eligibility calculation."
    roles: [ControlRoomOperator]
    code: 200
    input: [reset_outcome]
    output: FaultEvent
    side_effects:
      - "increments FaultEvent.reset_attempt_count by 1 and Turbine.remote_reset_count_24h by 1"
      - "sets Turbine.reset_window_start_utc to the logical clock and zeroes remote_reset_count_24h first when the rolling window has elapsed"
      - "reset_outcome SUCCEEDED moves triage_state to CLEARED, sets cleared_at to the logical clock, clears Turbine.active_fault_code and moves Turbine.availability_state from FAULTED back to ONLINE"
      - "reset_outcome FAILED leaves triage_state at RESET_PENDING and Turbine.availability_state at FAULTED, so the remaining quota may be spent; escalation to DISPATCH_REQUIRED is a separate triage call with disposition DISPATCH"
      - "rejected with ERR_RESET_QUOTA_EXHAUSTED when reset_attempt_count has already reached max_remote_resets_pinned inside the current rolling window"
      - "downtime_hours, lost_energy_kwh and every downstream accrual are deferred to the CLEARED -> CLOSED transition; a CLEARED event that is never closed contributes nothing to availability or lost energy"
  - method: POST
    path: "/wind-ops/fault-events/{id}/close"
    description: "Close a CLEARED fault event so its downtime is admitted into availability accounting."
    roles: [ReliabilityEngineer]
    code: 200
    input: []
    output: FaultEvent
    side_effects:
      - "moves triage_state to CLOSED"
      - "computes downtime_hours as (cleared_at - raised_at) / 3600 and lost_energy_kwh as round_half_up(downtime_hours * Turbine.expected_kwh_per_hour, 2)"
      - "adds lost_energy_kwh to Turbine.cumulative_lost_energy_kwh"
      - "adds downtime_hours to Turbine.counted_downtime_hours_period when contractual_exclusion_pinned is false, and adds nothing when it is true"
      - "recomputes projected_shortfall_pct and at_risk_flag on every ACTIVE ServiceAgreement of the farm using the LIVE_PROJECTION variant"
      - "re-scores priority_score on every WorkOrder of the farm's turbines in state SUBMITTED, REVISION_REQUESTED or SCHEDULED"

  - method: POST
    path: "/wind-ops/crews"
