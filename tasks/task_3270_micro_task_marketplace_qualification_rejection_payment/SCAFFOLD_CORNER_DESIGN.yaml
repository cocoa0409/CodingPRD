  # ===========================================================================
  - section: validations
    instances:

      - name: duplicate_qualification_exam_attempt_is_applied
        claim_type: Rule Application
        grounds:
          - calculations.qualification_gate_snapshot
          - endpoints.POST_/mkt/qualification-exams/{exam_id}/attempts
        distinguishing_aspect: "A passed attempt upserts the CASCADE-or-EXAM grant with the attempt score 90 and status ACTIVE, and a second passing attempt refreshes the same row rather than minting a duplicate."
        test_recipe:
          setup:
            - "Logical clock 2026-09-01T00:00:00Z. Qualification type Accuracy with a passing_score 80 exam."
          setup_api_calls:
            - call: "POST /mkt/_clock/set_current_utc"
              payload: { current_utc: "2026-09-01T00:00:00Z" }
              as: PlatformAdmin
            - call: "POST /mkt/qualification-types"
              payload: { name: "Accuracy", kind: "REQUESTER", auto_assign_threshold_pct: 90 }
              as: PlatformAdmin
              captures: { qt1: $.data.id }
            - call: "POST /mkt/qualification-types/${qt1}/exams"
              payload: { passing_score: 80 }
              as: PlatformAdmin
              captures: { ex1: $.data.id }
            - call: "POST /mkt/workers"
              payload: { display_name: "W1 Exam", country: "US" }
              as: Anonymous
              captures: { w1: $.data.id }
          trigger:
