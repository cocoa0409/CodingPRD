  - rule_id: cross_entity_state_dependency
    instances:

      - name: site_visit_start_blocked_by_quarantined_portable_unit
        grounds:
          - state_machines.SiteVisit.SCHEDULED_to_IN_PROGRESS
          - state_machines.PortableUnit.AVAILABLE_to_QUARANTINED
          - validations[priority=15]
          - errors[ERR_UNIT_QUARANTINED]
        distinguishing_aspect: |
          Entity pair SiteVisit -> PortableUnit: the SiteVisit's SCHEDULED_to_IN_PROGRESS transition is
          legal on its own row yet is refused because a different entity, the assigned PortableUnit, is
          in QUARANTINED. The already-quarantined branch of priority 15 performs no write, so
          PortableUnit.version is unchanged by the rejected start.
        test_recipe:
