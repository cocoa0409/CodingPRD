  # ===========================================================================
  - section: errors
    instances:

      - name: fallback_on_a_fax_channel_without_a_fax_number_is_refused
        claim_type: violation_to_error
        grounds:
          - errors[ERR_FALLBACK_CHANNEL_UNAVAILABLE]
          - entities.NetworkParticipant.fields.fax_number
          - endpoints.POST_/network/prescriptions/{id}/route-fallback
        distinguishing_aspect: "The FAX fallback guard reads the prescribing clinic's own fax_number, so a clinic provisioned with fallback_channel FAX from the start but never given a number cannot fall back even though its attempt history already contains a failed attempt."
        test_recipe:
          setup:
            - "Logical clock at 2026-09-01T00:00:00Z. The clinic is registered with fallback_channel FAX and no fax_number; the pharmacy is certified with one NEW_RX endpoint; one signed order has been routed and its attempt reported undeliverable, leaving routing_status ROUTE_FAILED."
          setup_api_calls:
            - *clock
            - call: "POST /network/participants"
              payload: { name: "Northside Family Clinic", participant_type: "PRESCRIBER_CLINIC", npi: "1111111111", volume_billing_mode: "MONTHLY", fallback_channel: "FAX" }
              as: NetworkOperator
              captures: { cl_id: $.data.id, cl_v: $.data.version }
            - *pharmacy
            - *clinic_ep
            - *ph_newrx
            - *ph_cert_start
            - *ph_test_conn
            - *ph_test_newrx
            - *ph_certify
            - *cl_cert_start
            - *cl_test_conn
            - *cl_test_newrx
            - *cl_certify
            - *patient_a
            - *draft_rx
            - call: "POST /network/signing-sessions"
              payload: { prescription_id: "${rx_id}" }
              as: Prescriber
              as_user_id: "${cl_id}"
              captures: { ss_id: $.data.id }
            - call: "POST /network/signing-sessions/${ss_id}/identity-proof"
              payload: { outcome: "PASSED" }
              as: Prescriber
              as_user_id: "${cl_id}"
            - call: "POST /network/signing-sessions/${ss_id}/request-otp"
              payload: {}
              as: Prescriber
              as_user_id: "${cl_id}"
              captures: { otp_code: $.data.otp_challenge_code }
            - call: "POST /network/signing-sessions/${ss_id}/verify-otp"
              payload: { otp_code: "${otp_code}" }
              as: Prescriber
              as_user_id: "${cl_id}"
            - call: "POST /network/prescriptions/${rx_id}/sign"
              payload: { signing_session_id: "${ss_id}" }
              as: Prescriber
              as_user_id: "${cl_id}"
              captures: { v0: $.data.version }
            - call: "POST /network/prescriptions/${rx_id}/route"
              payload: { expected_prescription_version: "${v0}" }
              as: Prescriber
              as_user_id: "${cl_id}"
            - call: "GET /network/prescriptions/${rx_id}/attempts"
              payload: {}
              as: NetworkOperator
              captures: { live_id: "$.data[0].id" }
          trigger:
            - call: "POST /network/routing-attempts/${live_id}/report-undeliverable"
              payload: { failure_code: "CF_0000" }
              as: NetworkOperator
            - call: "POST /network/prescriptions/${rx_id}/route-fallback"
              payload: {}
              as: Prescriber
              as_user_id: "${cl_id}"
              captures: { err_id: $.data.error_id }
          assert:
            - "the route-fallback returns 422 with error_id == ERR_FALLBACK_CHANNEL_UNAVAILABLE"
            - "Prescription.${rx_id}.routing_status is still ROUTE_FAILED, so the guard ran before any state move"
            - "NetworkParticipant.${cl_id}.fallback_channel == FAX and fax_number is null, which is the field the guard read"

      - name: zero_duration_consent_grant_expires_immediately
        claim_type: boundary_condition
        grounds:
          - errors[ERR_CONSENT_EXPIRED]
          - entities.PatientConsent.fields.expires_at
          - entities.Patient.fields.consent_status
        distinguishing_aspect: "A grant of duration_days 0 produces the empty half-open window [granted_at, granted_at), which is written straight to status EXPIRED and leaves the patient's consent_status EXPIRED, so the record exists but blocks every downstream medication-history call."
        test_recipe:
          setup:
            - "Logical clock at 2026-09-01T00:00:00Z. One patient on file with no consents."
          setup_api_calls:
            - *clock
            - *patient_a
          trigger:
            - call: "POST /network/patients/${pa_id}/consents"
              payload: { scope: "MEDICATION_HISTORY", duration_days: 0 }
              as: PatientService
              captures: { cns_id: $.data.id, cns_status: $.data.status, cns_expires: $.data.expires_at }
          assert:
            - "PatientConsent.${cns_id}.status == EXPIRED and its expires_at equals its granted_at, an empty half-open window"
            - "Patient.${pa_id}.consent_status == EXPIRED and consent_version == 1"
            - "a subsequent aggregate against this patient returns 422 ERR_CONSENT_REQUIRED because no ACTIVE consent with the MEDICATION_HISTORY scope exists"
            - "the expired record is still readable: GET /network/consents/${cns_id} returns it with status EXPIRED"

      - name: reverse_of_an_already_reversed_entry_returns_entry_not_reversible
        claim_type: violation_to_error
        grounds:
          - errors[ERR_ENTRY_NOT_REVERSIBLE]
          - validations[priority=9]
          - state_machines.TransactionFeeEntry.transitions.POSTED_to_REVERSED
        distinguishing_aspect: "Reversal is a single-use guard over two separate conditions — a REVERSED source and a compensating row — so both the second reversal of the source and a reversal aimed at the compensating row itself fail with ERR_ENTRY_NOT_REVERSIBLE."
        test_recipe:
          setup:
            - "Logical clock at 2026-09-01T00:00:00Z. Northside Family Clinic holds one POSTED 2026-09 NEW_RX/SENT entry of 3600 cents that has already been reversed once, leaving a compensating MANUAL_REVERSAL row behind."
          setup_api_calls:
            - *clock
            - *clinic
            - call: "POST /network/transaction-fees"
              payload: { participant_id: "${cl_id}", month_key: "2026-09", transaction_type: "NEW_RX", direction: "SENT", transaction_count: 500 }
              as: NetworkOperator
              captures: { e_src_id: $.data.id, net0: $.data.period_net_total_cents }
            - call: "POST /network/transaction-fees/${e_src_id}/reverse"
              payload: { expected_participant_version: "${cl_v}" }
              as: NetworkOperator
              captures: { comp_id: $.data.id }
          trigger:
            - call: "POST /network/transaction-fees/${e_src_id}/reverse"
              payload: { expected_participant_version: "${cl_v}" }
              as: NetworkOperator
              captures: { err_src: $.data.error_id }
            - call: "POST /network/transaction-fees/${comp_id}/reverse"
              payload: { expected_participant_version: "${cl_v}" }
              as: NetworkOperator
              captures: { err_comp: $.data.error_id }
          assert:
            - "the second reversal of the source returns 422 with error_id == ERR_ENTRY_NOT_REVERSIBLE"
            - "the reversal aimed at the compensating row also returns 422 with error_id == ERR_ENTRY_NOT_REVERSIBLE because that row carries a reversal_of_entry_id"
            - "GET /network/transaction-fees/${e_src_id}/reversal returns exactly 1 row, ${comp_id}"
            - "the participant's period_net_total_cents is still 0 — no second compensation was posted"

  # ===========================================================================
  - section: rbac
    instances:

      - name: pharmacy_cannot_complete_a_benefit_check_it_does_not_own_the_role_for_the_sign_step
