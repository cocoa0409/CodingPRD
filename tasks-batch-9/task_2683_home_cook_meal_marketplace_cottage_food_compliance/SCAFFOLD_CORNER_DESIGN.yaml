            - "${e_cutoff} == ERR_CUTOFF_AFTER_HANDOFF with HTTP 422 (cutoff 2026-08-09 is after handoff_start 2026-08-08T16:00)"
            - "${e_interval} == ERR_CUTOFF_AFTER_HANDOFF with HTTP 422: the same rule owns handoff_start_at < handoff_end_at"
            - "${e_above} == ERR_WINDOW_CAPACITY_ABOVE_COOK_LIMIT with HTTP 422 (60 > 40)"
            - "${e_zero} == ERR_WINDOW_CAPACITY_ABOVE_COOK_LIMIT with HTTP 422: the rule owns the >= 1 lower bound too"
            - "${ok_capacity} == 40 at exactly weekly_capacity_meals, and ${ok_effective} == 40 because committed_meals is 0 so the spoilage reserve is ceil(0) == 0"
            - "exactly one ProductionWindow (${ok_id}) exists for ${cook_id} after the four rejections"

      - name: order_placement_quantity_menu_state_and_zone_violations_rejected
