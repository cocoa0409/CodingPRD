          setup:
            - "One train and one plan item assigned to Anna, so a well-formed Writer call would otherwise succeed."
            - "The unknown identity is the literal UUID 3f1c9d4e-0b2a-4c6d-8e7f-1a2b3c4d5e6f, which is not a Writer or Reviewer row."
