      - name: complaint_close_no_action_blocked_for_adverse_event
        claim_type: precondition_enforcement
        grounds:
          - state_machines.ComplaintCase.TRIAGED_to_CLOSED_NO_ACTION
          - errors[ERR_ADVERSE_CLOSE_FORBIDDEN]
        distinguishing_aspect: |
          TRIAGED -> CLOSED_NO_ACTION requires adverse_event_flag == false: a
          triaged adverse-event case (score 45.0, below the escalation fork)
          fails with ERR_ADVERSE_CLOSE_FORBIDDEN (422), while a non-adverse
          case closes cleanly.
        test_recipe:
          setup:
            - "Brand + DRAFT formula; case A SERIOUS/ILLNESS with adverse flag true (TRIAGED, score 45.0); case B MINOR/PALATABILITY flag false (TRIAGED, score 7.0)"
          setup_api_calls:
            - call: "POST /petfood/brand-owners"
              payload: { legal_name: "Close Co", fein: "551500010", contact_email: "ra@close.example" }
              as: PlatformAdmin
              captures: { bo_id: $.data.id }
            - call: "POST /petfood/brand-owners/${bo_id}/formulas"
              payload: { formula_code: "CL-001", product_name: "Close Dog", species: "DOG", life_stage: "ADULT_MAINTENANCE", adequacy_basis: "FORMULATION" }
              as: FormulationScientist
              captures: { f_id: $.data.id }
            - call: "POST /petfood/complaint-cases"
              payload: { brand_owner_id: "${bo_id}", formula_id: "${f_id}", severity: "SERIOUS", category: "ILLNESS", adverse_event_flag: true }
              as: QualityAnalyst
              captures: { ca_id: $.data.id, ca_status0: $.data.status }
            - call: "POST /petfood/complaint-cases/${ca_id}/triage"
              payload: { confirm_adverse_event_flag: true }
              as: QualityAnalyst
              captures: { ca_score: $.data.triage_score }
            - call: "POST /petfood/complaint-cases"
              payload: { brand_owner_id: "${bo_id}", formula_id: "${f_id}", severity: "MINOR", category: "PALATABILITY", adverse_event_flag: false }
              as: QualityAnalyst
              captures: { cb_id: $.data.id }
            - call: "POST /petfood/complaint-cases/${cb_id}/triage"
              payload: { confirm_adverse_event_flag: false }
              as: QualityAnalyst
          trigger:
            - call: "POST /petfood/complaint-cases/${ca_id}/close-no-action"
              payload: {}
              as: QualityAnalyst
              captures: { err: $.data.error_id }
            - call: "POST /petfood/complaint-cases/${cb_id}/close-no-action"
              payload: {}
              as: QualityAnalyst
              captures: { cb_status: $.data.status }
          assert:
            - "Case A created at status == INTAKE (initial_state); after triage score == 45.0 and status == TRIAGED (below fork threshold)"
            - "Case A close-no-action: error_id == ERR_ADVERSE_CLOSE_FORBIDDEN, http 422"
            - "Case B close-no-action succeeds: status == CLOSED_NO_ACTION"

