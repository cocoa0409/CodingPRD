              as: ComplianceOfficer
            - call: "POST /reporting-persons/${p_id}/transitions"
              payload: { action: "DESIGNATE" }
              as: ComplianceOfficer
            - call: "POST /transactions"
              payload: { reporting_person_id: "${p_id}", transaction_date: "2026-08-05", transaction_code: "P", security_type: "COMMON_STOCK", shares: 50, price_per_share: 10.00 }
              as: EquityPlanAdmin
              as_user_id: "epa_1"
              captures: { t_later: $.data.id }
            - call: "POST /transactions"
              payload: { reporting_person_id: "${p_id}", transaction_date: "2026-08-04", transaction_code: "P", security_type: "COMMON_STOCK", shares: 100, price_per_share: 10.00 }
              as: EquityPlanAdmin
              as_user_id: "epa_1"
              captures: { t_earlier: $.data.id }
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-08-05T09:00:00Z" }
              as: ComplianceOfficer
            - call: "POST /transactions/${t_later}/confirm"
