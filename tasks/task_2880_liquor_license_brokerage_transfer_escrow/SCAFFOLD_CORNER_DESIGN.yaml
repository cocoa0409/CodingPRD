              payload: { buyer_id: "${b_id}", county_id: "${c_id}", address_line: "12 Vine St", zoning_code: "C1", distance_to_nearest_school_feet: 900, distance_to_nearest_church_feet: 900 }
              as: Broker
              as_user_id: "${brk_id}"
              captures: { prem_id: $.data.id }
            - call: "POST /premises/${prem_id}/zoning-verification"
              payload: { conditional_use_permit_status: "GRANTED" }
              as: RegulatorAnalyst
              as_user_id: "analyst-1"
            - call: "POST /premises/${prem_id}/landlord-consent"
              payload: { landlord_consent_status: "GRANTED" }
              as: Broker
              as_user_id: "${brk_id}"
            - call: "POST /buyer-profiles/${b_id}/qualification-review"
              payload: { review_mode: "FINAL_REVIEW", premises_id: "${prem_id}" }
              as: RegulatorAnalyst
              as_user_id: "analyst-1"
            - call: "POST /listings"
              payload: { license_id: "${lic_id}", brokerage_id: "${brk_id}", ask_price_cents: 18500000 }
              as: Broker
              as_user_id: "${brk_id}"
              captures: { lst_id: $.data.id }
            - call: "POST /listings/${lst_id}/activate"
              payload: {}
              as: Broker
              as_user_id: "${brk_id}"
              captures: { lst_v1: $.data.version }
            - call: "POST /purchase-agreements"
              payload: { listing_id: "${lst_id}", buyer_id: "${b_id}", premises_id: "${prem_id}", purchase_price_cents: 18500010, deposit_pct_bps: 1000, closing_window_start: "2026-09-01T00:00:00Z", expected_listing_version: "${lst_v1}" }
              as: Broker
              as_user_id: "${brk_id}"
              captures: { agr_id: $.data.id }
            - call: "POST /dual-agency-disclosures"
              payload: { agreement_id: "${agr_id}", represents_seller: true, represents_buyer: false }
              as: Broker
              as_user_id: "${brk_id}"
              captures: { dis_id: $.data.id }
            - call: "POST /dual-agency-disclosures/${dis_id}/acknowledge"
              payload: { party: "SELLER" }
              as: Seller
              as_user_id: "${s_id}"
            - call: "POST /purchase-agreements/${agr_id}/escrow-deposit"
              payload: { amount_cents: 2405001 }
              as: EscrowOfficer
              as_user_id: "escrow-1"
          trigger:
            - call: "POST /purchase-agreements/${agr_id}/execute"
              payload: {}
              as: Broker
              as_user_id: "${brk_id}"
              captures: { ast: $.data.agreement_status, mode: $.data.commission_mode, exec_at: $.data.executed_at }
            - call: "GET /licenses/${lic_id}"
              payload: {}
              as: Broker
              as_user_id: "${brk_id}"
              captures: { lst_lic: $.data.status }
            - call: "GET /listings/${lst_id}"
              payload: {}
              as: Broker
              as_user_id: "${brk_id}"
              captures: { lst_st: $.data.status }
            - call: "GET /counties/${c_id}"
              payload: {}
              as: Broker
              as_user_id: "${brk_id}"
              captures: { occ: $.data.escrow_committed_count }
          assert:
            - "${ast} == EXECUTED, ${mode} == SINGLE_AGENCY and ${exec_at} == 2026-08-01T00:00:00Z in the execute response itself"
            - "${lst_lic} == IN_ESCROW on the very next read - no denormalisation lag"
            - "${lst_st} == UNDER_CONTRACT and ${occ} == 1"
            - "re-reading each row a second time returns identical values, so nothing converges after the fact"

      - name: failed_transfer_compensates_every_completed_step
        claim_type: saga
        grounds:
          - state_machines.PurchaseAgreement[HELD -> REFUNDED]
          - calculations.county_quota_position
        excluded_because:
          difficulty_instance: "transitive_cascade / refund_settlement_four_hop_unwind"
          rationale: "That instance unwinds the executed transfer hop by hop on a DENIED decision and asserts that every side effect of execute is reversed, with county_escrow_occupancy_conservation_across_refund pinning the aggregate."
