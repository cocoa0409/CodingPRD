              as: MappingEngineer
          assert:
            - "ServiceTerritory.${t_id}.mapped_pct == 60"
            - "ServiceTerritory.${t_id}.posture == MAPPING"
            - "ServiceTerritory.${t_id}.version == 2"

  # ===========================================================================
  - section: calculations
    instances:
      - name: if_match_service_status_software_mismatch_unavailable
        claim_type: Correct Result
        grounds:
          - calculations.vehicle_service_status
          - entities.Vehicle.fields.software_version
        distinguishing_aspect: "All readiness predicates pass except the software equality check, so service_status resolves UNAVAILABLE — the software mismatch alone is sufficient to block availability."
        test_recipe:
          setup: ["Logical clock at 2026-06-01T00:00:00Z. One ACTIVE territory, Depot A, a vehicle with battery 90, cleanliness 90, calibration signed off, but stale software."]
          setup_api_calls:
            - *c_clock
            - *c_t
            - *c_d
            - call: "POST /fleet/territories/${t_id}/vehicles"
              payload: { vin: "VIN-0001", battery_pct: 90, cleanliness_score: 90, software_version: "sw-2026.0", target_software_version: "sw-2026.1" }
              as: FleetOperations
              captures: { v1_id: $.data.id }
            - call: "POST /fleet/vehicles/${v1_id}/stage"
              payload: { depot_id: "${d_id}" }
              as: FleetOperations
            - call: "POST /fleet/depots/${d_id}/cycles"
              payload: { vehicle_id: "${v1_id}", service_kind: "CALIBRATION" }
              as: DepotTechnician
              captures: { c1_id: $.data.id }
            - *c_bs1
            - *c_sch1
            - *c_start1
            - *c_comp1
          trigger:
            - call: "GET /fleet/vehicles/${v1_id}"
              payload: {}
              as: FleetOperations
          assert:
            - "Vehicle.${v1_id}.battery_pct == 90 and cleanliness_score == 90 and calib_valid == true"
            - "Vehicle.${v1_id}.software_version == \"sw-2026.0\" and target_software_version == \"sw-2026.1\""
            - "Vehicle.${v1_id}.service_status == UNAVAILABLE"

      - name: if_match_depot_posture_counts_reserved_slots
        claim_type: Input Set Filtering
        grounds:
          - calculations.depot_posture
          - calculations.depot_posture.variants.depot_posture_reservation_counted
          - entities.BaySlot.fields.status
        distinguishing_aspect: "Occupancy counts RESERVED slots, not only ACTIVE ones: 4 of 5 bays merely reserved already reads 80 percent and CONGESTED with no cycle started."
        test_recipe:
          setup: ["Logical clock at 2026-06-01T00:00:00Z. One ACTIVE territory, Depot A with 5 bay positions, one DRAFT vehicle, one cycle with four RESERVED slots and nothing started."]
          setup_api_calls:
            - *c_clock
            - *c_t
            - call: "POST /fleet/territories/${t_id}/depots"
              payload: { name: "Depot A", charge_positions: 2, cleaning_positions: 1, calib_positions: 1, software_positions: 1 }
              as: TerritoryPlanner
              captures: { d_id: $.data.id }
            - *c_v1
            - call: "POST /fleet/depots/${d_id}/cycles"
              payload: { vehicle_id: "${v1_id}", service_kind: "CHARGE" }
              as: DepotTechnician
              captures: { c1_id: $.data.id }
            - call: "POST /fleet/depots/${d_id}/bay-slots"
              payload: { service_type: "CHARGE", bay_index: 1, start_utc: "2026-06-01T00:00:00Z", duration_seconds: 1800, vehicle_id: "${v1_id}", cycle_id: "${c1_id}" }
              as: DepotTechnician
              captures: { s1_id: $.data.id }
            - call: "POST /fleet/depots/${d_id}/bay-slots"
              payload: { service_type: "CHARGE", bay_index: 2, start_utc: "2026-06-01T00:00:00Z", duration_seconds: 1800, vehicle_id: "${v1_id}", cycle_id: "${c1_id}" }
              as: DepotTechnician
              captures: { s2_id: $.data.id }
            - call: "POST /fleet/depots/${d_id}/bay-slots"
              payload: { service_type: "CLEAN", bay_index: 1, start_utc: "2026-06-01T00:00:00Z", duration_seconds: 1800, vehicle_id: "${v1_id}", cycle_id: "${c1_id}" }
              as: DepotTechnician
              captures: { s3_id: $.data.id }
            - call: "POST /fleet/depots/${d_id}/bay-slots"
              payload: { service_type: "CALIBRATION", bay_index: 1, start_utc: "2026-06-01T00:00:00Z", duration_seconds: 1800, vehicle_id: "${v1_id}", cycle_id: "${c1_id}" }
              as: DepotTechnician
              captures: { s4_id: $.data.id }
          trigger:
            - call: "GET /fleet/depots/${d_id}"
              payload: {}
              as: DepotTechnician
          assert:
            - "BaySlot.${s1_id}.status == RESERVED and BaySlot.${s2_id}.status == RESERVED"
            - "DepotSite.${d_id}.occupancy_pct == 80 and posture == CONGESTED"
            - "no DepotCycle for this depot is IN_PROGRESS"

      - name: if_match_incident_retention_minor_is_180_days
        claim_type: Constants Applied
        grounds:
          - calculations.incident_retention_expiry
          - calculations.incident_retention_expiry.variants.minor_report_short_retention
          - entities.IncidentReport.fields.retention_expires_at
        distinguishing_aspect: "A MINOR report keeps crash_evidence_retained false and pins retention_expires_at to exactly 180 days after created_at, the shorter of the two declared retention classes."
        test_recipe:
          setup: ["Logical clock at 2026-06-01T00:00:00Z. One ACTIVE territory with an IN_SERVICE vehicle matched to a ride whose ACKNOWLEDGED session exists."]
          setup_api_calls:
            - *c_clock
            - *c_t
            - *c_d
            - *c_v1
            - call: "POST /fleet/vehicles/${v1_id}/stage"
              payload: { depot_id: "${d_id}" }
              as: FleetOperations
            - *c_cy1
            - *c_bs1
            - *c_sch1
            - *c_start1
            - *c_comp1
            - *c_rts1
            - *c_getv1
            - *c_safe
            - *c_curb_ok
            - call: "POST /fleet/territories/${t_id}/ride-requests"
              payload: { rider_name: "Rider One", sub_service_type: "STANDARD", idempotency_key: "idem-ret-1" }
              as: FleetOperations
              captures: { r1_id: $.data.id }
            - call: "POST /fleet/territories/${t_id}/ride-requests/${r1_id}/match"
              payload: { pickup_location_id: "${pl_id}", expected_vehicle_version: "${occ_token}" }
              as: FleetOperations
            - call: "POST /fleet/territories/${t_id}/ride-requests/${r1_id}/assistance-sessions"
              payload: { reason: "OTHER" }
              as: RemoteAssistanceOperator
              captures: { s1_id: $.data.id }
            - call: "POST /fleet/assistance-sessions/${s1_id}/acknowledge"
              payload: {}
              as: RemoteAssistanceOperator
          trigger:
            - call: "POST /fleet/ride-requests/${r1_id}/film-incident"
              payload: { severity: "MINOR", description: "Curb contact, no damage" }
              as: SafetyReviewer
              captures: { i1_id: $.data.id }
          assert:
            - "IncidentReport.${i1_id}.crash_evidence_retained == false"
            - "IncidentReport.${i1_id}.retention_expires_at == 2026-11-28T00:00:00Z"

      - name: if_match_incident_retention_moderate_is_365_days
        claim_type: Constants Applied
        grounds:
          - calculations.incident_retention_expiry
          - entities.IncidentReport.fields.crash_evidence_retained
        distinguishing_aspect: "A MODERATE report sets crash_evidence_retained true and pins retention_expires_at to exactly 365 days after created_at, the crash-evidence retention class."
        test_recipe:
          setup: ["Logical clock at 2026-06-01T00:00:00Z. One ACTIVE territory with an IN_SERVICE vehicle matched to a ride whose ACKNOWLEDGED session exists."]
          setup_api_calls:
            - *c_clock
