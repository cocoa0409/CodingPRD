      - name: an_unknown_concession_answers_before_the_body_is_ever_parsed
        claim_type: priority_conflict
        grounds:
          - validations[priority=20]
          - validations[priority=30]
          - validations[priority=58]
          - errors[ERR_CONCESSION_NOT_FOUND]
        distinguishing_aspect: |
          One call violates three rules at once: the path id does not resolve (20), the body
          is missing nothing but carries period_start AFTER period_end (58), and the
          interval is also schema-invalid (30). Existence at priority 20 must answer, so the
          response is 404 ERR_CONCESSION_NOT_FOUND rather than 422 ERR_INVALID_INTERVAL or
          400 ERR_INVALID_REQUEST. This is also the cheapest instance in the suite: it needs
          no fixture at all beyond the clock.
        test_recipe:
          setup:
            - "No entities are created. The logical clock is pinned so the request is otherwise well-formed in time."
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { current_utc: "2026-09-01T00:00:00Z" }
              as: PlatformAdmin
          trigger:
            - call: "POST /ppp/concessions/csn-00000000-does-not-exist/service-periods"
              payload: { period_index: 1, period_start: "2027-04-01", period_end: "2027-03-01" }
              as: AuthorityOfficer
              as_user_id: "officer-alpha"
              captures: { err: $.data.error_id }
          assert:
            - "HTTP status is 404"
            - "${err} == \"ERR_CONCESSION_NOT_FOUND\" (NOT ERR_INVALID_INTERVAL, NOT ERR_INVALID_REQUEST)"
            - "the error envelope carries response_type == \"error\" and a message, and no ServicePeriod row exists"
            - "GET /ppp/service-periods returns total_count == 0"

