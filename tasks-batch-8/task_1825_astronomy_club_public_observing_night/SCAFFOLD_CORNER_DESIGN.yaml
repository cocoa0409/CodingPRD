      - name: member_accept_only_own_assignment
        claim_type: rbac_denial
        grounds: ["roles", "state_machines.EventOperatorAssignment.INVITED_to_CONFIRMED"]
        distinguishing_aspect: "Entity-backed identity: Member B accepting an assignment whose member_id is Member A is rejected (ownership check via X-User-ID == assignment.member_id) with ERR_FORBIDDEN."
        test_recipe:
          setup: ["members A and B; assignment invited for A"]
          setup_api_calls:
            - call: "POST /club/membership-tiers"
