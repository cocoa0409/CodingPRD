# =============================================================================
# 1.8 Scaffold Difficulty Design (Test Targeting Index)
# Biorepository & Specimen Consent Management
# =============================================================================
scaffold_difficulty_design:
  # ---------------------------------------------------------------------------
  - rule_id: dual_variant_calc
    instances:
      - name: specimen_committed_volume_book_vs_physical
        grounds:
          - calculations.specimen_committed_volume
          - entities.Specimen.fields.committed_volume_book_ml
          - entities.Specimen.fields.committed_volume_physical_ml
        distinguishing_aspect: |
          On the Specimen domain, the forward-looking book variant counts a
          RESERVED aliquot while the chronological physical variant counts only
          DISTRIBUTED/DESTROYED aliquots, so identical data yields book=40.0 vs
          physical=0.0 immediately after fulfillment reservation.
        test_recipe:
          setup:
            - "Donor D with ACTIVE consent permitting GENERAL_RESEARCH; kit RETURNED; unit FRZ-1 OPERATIONAL with slot A1"
            - "Specimen SP (BLOOD, 100.0ml) IN_STORAGE in slot A1; Aliquot AL (40.0ml) IN_STORAGE"
            - "SharingAgreement AG ACTIVE (total 1000.0ml, scope GENERAL_RESEARCH, window 2026-04-01..2027-04-01)"
            - "SampleRequest RQ (GENERAL_RESEARCH, BLOOD, 40.0ml) APPROVED with 3 APPROVE votes"
          setup_api_calls:
            - { call: "POST /biobank/donors", payload: { donor_reference_code: "D-DV1" }, as: ConsentCoordinator, captures: { d_id: "$.data.id" } }
            - { call: "POST /biobank/donors/${d_id}/consent-records", payload: { permitted_uses: ["GENERAL_RESEARCH"], effective_from: "2026-05-01T00:00:00Z" }, as: ConsentCoordinator, captures: { c_id: "$.data.id" } }
            - { call: "POST /biobank/collection-kits", payload: { kit_type: "BLOOD", expires_at: "2027-01-01T00:00:00Z" }, as: ConsentCoordinator, captures: { k_id: "$.data.id" } }
            - { call: "POST /biobank/collection-kits/${k_id}/distribute", payload: { donor_id: "${d_id}" }, as: ConsentCoordinator }
            - { call: "POST /biobank/collection-kits/${k_id}/receive-return", payload: {}, as: ConsentCoordinator }
            - { call: "POST /biobank/storage-units", payload: { unit_code: "FRZ-DV1", setpoint_c: -80.0 }, as: BiobankAdmin, captures: { u_id: "$.data.id" } }
            - { call: "POST /biobank/storage-units/${u_id}/slots", payload: { slot_code: "A1", capacity_ml: 500 }, as: BiobankAdmin, captures: { s_id: "$.data.id" } }
            - { call: "POST /biobank/specimens", payload: { donor_id: "${d_id}", kit_id: "${k_id}", consent_record_id: "${c_id}", specimen_type: "BLOOD", initial_volume_ml: 100.0, collected_at: "2026-05-02T00:00:00Z", storage_slot_id: "${s_id}" }, as: LabTechnician, captures: { sp_id: "$.data.id", sp_v: "$.data.version" } }
            - { call: "POST /biobank/specimens/${sp_id}/aliquots", payload: { initial_volume_ml: 40.0, expected_specimen_version: "${sp_v}", storage_slot_id: "${s_id}" }, as: LabTechnician, captures: { a_id: "$.data.id" } }
            - { call: "POST /biobank/sharing-agreements", payload: { recipient_institution: "Uni X", scope_uses: ["GENERAL_RESEARCH"], total_committed_volume_ml: 1000.0, effective_from: "2026-04-01T00:00:00Z", effective_to: "2027-04-01T00:00:00Z" }, as: BiobankAdmin, captures: { ag_id: "$.data.id" } }
            - { call: "POST /biobank/sharing-agreements/${ag_id}/activate", payload: {}, as: BiobankAdmin }
            - { call: "POST /biobank/sample-requests", payload: { title: "RQ-DV1", required_uses: ["GENERAL_RESEARCH"], specimen_type: "BLOOD", volume_needed_ml: 40.0, sharing_agreement_id: "${ag_id}" }, as: Researcher, as_user_id: "researcher-1", captures: { rq_id: "$.data.id" } }
            - { call: "POST /biobank/sample-requests/${rq_id}/submit", payload: {}, as: Researcher, as_user_id: "researcher-1" }
            - { call: "POST /biobank/sample-requests/${rq_id}/votes", payload: { decision: "APPROVE", rationale: "committee approval rationale one" }, as: CommitteeReviewer, as_user_id: "rev-1" }
            - { call: "POST /biobank/sample-requests/${rq_id}/votes", payload: { decision: "APPROVE", rationale: "committee approval rationale two" }, as: CommitteeReviewer, as_user_id: "rev-2" }
            - { call: "POST /biobank/sample-requests/${rq_id}/votes", payload: { decision: "APPROVE", rationale: "committee approval rationale three" }, as: CommitteeReviewer, as_user_id: "rev-3" }
          trigger:
            - { call: "POST /biobank/sample-requests/${rq_id}/fulfill", payload: {}, as: BiobankAdmin }
          assert:
            - "GET /biobank/specimens/${sp_id} -> data.committed_volume_book_ml == 40.0 (RESERVED aliquot counted by the forward-looking variant)"
            - "GET /biobank/specimens/${sp_id} -> data.committed_volume_physical_ml == 0.0 (nothing DISTRIBUTED/DESTROYED yet)"
            - "GET /biobank/aliquots/${a_id} -> data.status == RESERVED and data.reserved_for_request_id == ${rq_id}"

      - name: freezer_excursion_peak_vs_cumulative
        grounds:
          - calculations.freezer_excursion_assessment
          - entities.StorageUnit.fields.peak_excursion_c
          - entities.StorageUnit.fields.cumulative_degree_minutes
        distinguishing_aspect: |
          On the StorageUnit domain (different entity domain from the Specimen
          instance above), the peak variant reports the single worst deviation
          (5.0C) while the cumulative variant time-weights deviations
          (540.0 degree-minutes), so identical readings produce two different
          assessment numbers.
        test_recipe:
          setup:
            - "StorageUnit FRZ-EXC OPERATIONAL with warn_threshold_c -70.0 and fail_threshold_c -60.0; no readings yet"
          setup_api_calls:
            - { call: "POST /biobank/storage-units", payload: { unit_code: "FRZ-EXC", setpoint_c: -80.0, warn_threshold_c: -70.0, fail_threshold_c: -60.0 }, as: BiobankAdmin, captures: { u_id: "$.data.id" } }
          trigger:
            - { call: "POST /biobank/storage-units/${u_id}/temperature-readings", payload: { recorded_at: "2026-05-01T00:00:00Z", temp_c: -80.0 }, as: LabTechnician }
            - { call: "POST /biobank/storage-units/${u_id}/temperature-readings", payload: { recorded_at: "2026-05-01T01:00:00Z", temp_c: -65.0 }, as: LabTechnician }
            - { call: "POST /biobank/storage-units/${u_id}/temperature-readings", payload: { recorded_at: "2026-05-01T02:00:00Z", temp_c: -66.0 }, as: LabTechnician }
            - { call: "POST /biobank/storage-units/${u_id}/temperature-readings", payload: { recorded_at: "2026-05-01T03:00:00Z", temp_c: -80.0 }, as: LabTechnician }
          assert:
            - "GET /biobank/storage-units/${u_id} -> data.peak_excursion_c == 5.0 (max deviation: -65.0 - -70.0)"
            - "GET /biobank/storage-units/${u_id} -> data.cumulative_degree_minutes == 540.0 (5*60 + 4*60; final -80.0 reading accrues 0)"
            - "GET /biobank/storage-units/${u_id} -> data.posture == OPERATIONAL (final reading at/below warn threshold ends the excursion)"

  # ---------------------------------------------------------------------------
  - rule_id: combinatorial_formula
    instances:
      - name: fulfillment_quota_charge_tiered_surcharge
        grounds:
          - calculations.fulfillment_quota_charge
          - entities.SharingAgreement.fields.reserved_volume_ml
        distinguishing_aspect: |
          Mode (a) combinatorial: the charge combines >=3 inputs (selection
          volume V, pre-fulfillment utilization U_pre, tiered multiplier branch,
          remaining-quota cap) with a conditional branch pinned to fire exactly
          when U_pre >= 0.8; at U_pre == 0.80 the 1.25x surcharge applies, so
          request B's 10.0ml physical draw charges 12.5ml of quota.
        test_recipe:
          setup:
            - "Donor/consent/kit/unit/slot as standard; Specimen SP2 100.0ml IN_STORAGE with aliquots AL-A 80.0ml and AL-B 10.0ml"
            - "Agreement AG2 ACTIVE total 100.0ml scope GENERAL_RESEARCH window 2026-04-01..2027-04-01"
            - "Request RQA (80.0ml) APPROVED and FULFILLED-reserved (charge 80.0 at U_pre=0)"
            - "Request RQB (10.0ml) APPROVED, not yet fulfilled"
          setup_api_calls:
            - { call: "POST /biobank/donors", payload: { donor_reference_code: "D-CF1" }, as: ConsentCoordinator, captures: { d_id: "$.data.id" } }
            - { call: "POST /biobank/donors/${d_id}/consent-records", payload: { permitted_uses: ["GENERAL_RESEARCH"], effective_from: "2026-05-01T00:00:00Z" }, as: ConsentCoordinator, captures: { c_id: "$.data.id" } }
            - { call: "POST /biobank/collection-kits", payload: { kit_type: "BLOOD", expires_at: "2027-01-01T00:00:00Z" }, as: ConsentCoordinator, captures: { k_id: "$.data.id" } }
            - { call: "POST /biobank/collection-kits/${k_id}/distribute", payload: { donor_id: "${d_id}" }, as: ConsentCoordinator }
            - { call: "POST /biobank/collection-kits/${k_id}/receive-return", payload: {}, as: ConsentCoordinator }
            - { call: "POST /biobank/storage-units", payload: { unit_code: "FRZ-CF1", setpoint_c: -80.0 }, as: BiobankAdmin, captures: { u_id: "$.data.id" } }
            - { call: "POST /biobank/storage-units/${u_id}/slots", payload: { slot_code: "A1", capacity_ml: 500 }, as: BiobankAdmin, captures: { s_id: "$.data.id" } }
            - { call: "POST /biobank/specimens", payload: { donor_id: "${d_id}", kit_id: "${k_id}", consent_record_id: "${c_id}", specimen_type: "BLOOD", initial_volume_ml: 100.0, collected_at: "2026-05-02T00:00:00Z", storage_slot_id: "${s_id}" }, as: LabTechnician, captures: { sp_id: "$.data.id", sp_v: "$.data.version" } }
            - { call: "POST /biobank/specimens/${sp_id}/aliquots", payload: { initial_volume_ml: 80.0, expected_specimen_version: "${sp_v}", storage_slot_id: "${s_id}" }, as: LabTechnician, captures: { a_a: "$.data.id" } }
            - { call: "GET /biobank/specimens/${sp_id}", payload: {}, as: LabTechnician, captures: { sp_v2: "$.data.version" } }
            - { call: "POST /biobank/specimens/${sp_id}/aliquots", payload: { initial_volume_ml: 10.0, expected_specimen_version: "${sp_v2}", storage_slot_id: "${s_id}" }, as: LabTechnician, captures: { a_b: "$.data.id" } }
            - { call: "POST /biobank/sharing-agreements", payload: { recipient_institution: "Uni Y", scope_uses: ["GENERAL_RESEARCH"], total_committed_volume_ml: 100.0, effective_from: "2026-04-01T00:00:00Z", effective_to: "2027-04-01T00:00:00Z" }, as: BiobankAdmin, captures: { ag_id: "$.data.id" } }
            - { call: "POST /biobank/sharing-agreements/${ag_id}/activate", payload: {}, as: BiobankAdmin }
            - { call: "POST /biobank/sample-requests", payload: { title: "RQA", required_uses: ["GENERAL_RESEARCH"], specimen_type: "BLOOD", volume_needed_ml: 80.0, sharing_agreement_id: "${ag_id}" }, as: Researcher, as_user_id: "researcher-1", captures: { rq_a: "$.data.id" } }
            - { call: "POST /biobank/sample-requests/${rq_a}/submit", payload: {}, as: Researcher, as_user_id: "researcher-1" }
            - { call: "POST /biobank/sample-requests/${rq_a}/votes", payload: { decision: "APPROVE", rationale: "committee approval rationale one" }, as: CommitteeReviewer, as_user_id: "rev-1" }
            - { call: "POST /biobank/sample-requests/${rq_a}/votes", payload: { decision: "APPROVE", rationale: "committee approval rationale two" }, as: CommitteeReviewer, as_user_id: "rev-2" }
            - { call: "POST /biobank/sample-requests/${rq_a}/votes", payload: { decision: "APPROVE", rationale: "committee approval rationale three" }, as: CommitteeReviewer, as_user_id: "rev-3" }
            - { call: "POST /biobank/sample-requests/${rq_a}/fulfill", payload: {}, as: BiobankAdmin }
            - { call: "POST /biobank/aliquots/${a_a}/checkout", payload: { request_id: "${rq_a}" }, as: LabTechnician }
            - { call: "POST /biobank/sample-requests", payload: { title: "RQB", required_uses: ["GENERAL_RESEARCH"], specimen_type: "BLOOD", volume_needed_ml: 10.0, sharing_agreement_id: "${ag_id}" }, as: Researcher, as_user_id: "researcher-2", captures: { rq_b: "$.data.id" } }
            - { call: "POST /biobank/sample-requests/${rq_b}/submit", payload: {}, as: Researcher, as_user_id: "researcher-2" }
            - { call: "POST /biobank/sample-requests/${rq_b}/votes", payload: { decision: "APPROVE", rationale: "committee approval rationale one" }, as: CommitteeReviewer, as_user_id: "rev-1" }
            - { call: "POST /biobank/sample-requests/${rq_b}/votes", payload: { decision: "APPROVE", rationale: "committee approval rationale two" }, as: CommitteeReviewer, as_user_id: "rev-2" }
            - { call: "POST /biobank/sample-requests/${rq_b}/votes", payload: { decision: "APPROVE", rationale: "committee approval rationale three" }, as: CommitteeReviewer, as_user_id: "rev-3" }
          trigger:
            - { call: "POST /biobank/sample-requests/${rq_b}/fulfill", payload: {}, as: BiobankAdmin }
          assert:
            - "GET /biobank/sample-requests/${rq_b} -> data.charged_volume_ml == 12.5 (U_pre == 80/100 == 0.8 >= 0.8, so 10.0 * 1.25)"
            - "GET /biobank/sharing-agreements/${ag_id} -> data.reserved_volume_ml == 92.5 and data.remaining_volume_ml == 7.5"
            - "GET /biobank/aliquots/${a_b} -> data.status == RESERVED"

      - name: handling_fee_per_aliquot_rounding
        grounds:
          - calculations.handling_fee_cents
          - entities.SampleRequest.fields.handling_fee_cents
        distinguishing_aspect: |
          Mode (b) combinatorial (different mode from the tiered-surcharge
          instance): nested rounding where the pinned order is
          round-per-aliquot-then-sum; two 0.5ml aliquots yield 501 + 501 = 1002
          cents, while the unpinned sum-then-round order would yield 1003.
        test_recipe:
          setup:
            - "Donor/consent/kit/unit/slot as standard; Specimen SP3 10.0ml IN_STORAGE with aliquots AL-H1 0.5ml and AL-H2 0.5ml"
            - "Agreement AG3 ACTIVE total 1000.0ml scope GENERAL_RESEARCH"
            - "Request RQH (1.0ml) APPROVED"
          setup_api_calls:
            - { call: "POST /biobank/donors", payload: { donor_reference_code: "D-CF2" }, as: ConsentCoordinator, captures: { d_id: "$.data.id" } }
            - { call: "POST /biobank/donors/${d_id}/consent-records", payload: { permitted_uses: ["GENERAL_RESEARCH"], effective_from: "2026-05-01T00:00:00Z" }, as: ConsentCoordinator, captures: { c_id: "$.data.id" } }
            - { call: "POST /biobank/collection-kits", payload: { kit_type: "BLOOD", expires_at: "2027-01-01T00:00:00Z" }, as: ConsentCoordinator, captures: { k_id: "$.data.id" } }
            - { call: "POST /biobank/collection-kits/${k_id}/distribute", payload: { donor_id: "${d_id}" }, as: ConsentCoordinator }
            - { call: "POST /biobank/collection-kits/${k_id}/receive-return", payload: {}, as: ConsentCoordinator }
            - { call: "POST /biobank/storage-units", payload: { unit_code: "FRZ-CF2", setpoint_c: -80.0 }, as: BiobankAdmin, captures: { u_id: "$.data.id" } }
            - { call: "POST /biobank/storage-units/${u_id}/slots", payload: { slot_code: "A1", capacity_ml: 500 }, as: BiobankAdmin, captures: { s_id: "$.data.id" } }
            - { call: "POST /biobank/specimens", payload: { donor_id: "${d_id}", kit_id: "${k_id}", consent_record_id: "${c_id}", specimen_type: "BLOOD", initial_volume_ml: 10.0, collected_at: "2026-05-02T00:00:00Z", storage_slot_id: "${s_id}" }, as: LabTechnician, captures: { sp_id: "$.data.id", sp_v: "$.data.version" } }
            - { call: "POST /biobank/specimens/${sp_id}/aliquots", payload: { initial_volume_ml: 0.5, expected_specimen_version: "${sp_v}", storage_slot_id: "${s_id}" }, as: LabTechnician, captures: { a1: "$.data.id" } }
            - { call: "GET /biobank/specimens/${sp_id}", payload: {}, as: LabTechnician, captures: { sp_v2: "$.data.version" } }
            - { call: "POST /biobank/specimens/${sp_id}/aliquots", payload: { initial_volume_ml: 0.5, expected_specimen_version: "${sp_v2}", storage_slot_id: "${s_id}" }, as: LabTechnician, captures: { a2: "$.data.id" } }
            - { call: "POST /biobank/sharing-agreements", payload: { recipient_institution: "Uni Z", scope_uses: ["GENERAL_RESEARCH"], total_committed_volume_ml: 1000.0, effective_from: "2026-04-01T00:00:00Z", effective_to: "2027-04-01T00:00:00Z" }, as: BiobankAdmin, captures: { ag_id: "$.data.id" } }
            - { call: "POST /biobank/sharing-agreements/${ag_id}/activate", payload: {}, as: BiobankAdmin }
            - { call: "POST /biobank/sample-requests", payload: { title: "RQH", required_uses: ["GENERAL_RESEARCH"], specimen_type: "BLOOD", volume_needed_ml: 1.0, sharing_agreement_id: "${ag_id}" }, as: Researcher, as_user_id: "researcher-1", captures: { rq_id: "$.data.id" } }
            - { call: "POST /biobank/sample-requests/${rq_id}/submit", payload: {}, as: Researcher, as_user_id: "researcher-1" }
            - { call: "POST /biobank/sample-requests/${rq_id}/votes", payload: { decision: "APPROVE", rationale: "committee approval rationale one" }, as: CommitteeReviewer, as_user_id: "rev-1" }
            - { call: "POST /biobank/sample-requests/${rq_id}/votes", payload: { decision: "APPROVE", rationale: "committee approval rationale two" }, as: CommitteeReviewer, as_user_id: "rev-2" }
            - { call: "POST /biobank/sample-requests/${rq_id}/votes", payload: { decision: "APPROVE", rationale: "committee approval rationale three" }, as: CommitteeReviewer, as_user_id: "rev-3" }
          trigger:
            - { call: "POST /biobank/sample-requests/${rq_id}/fulfill", payload: {}, as: BiobankAdmin }
          assert:
            - "GET /biobank/sample-requests/${rq_id} -> data.handling_fee_cents == 1002 (round_half_up(500 + 0.5*2.5) = 501 per aliquot, then 501 + 501)"
            - "GET /biobank/aliquots/${a1} -> data.status == RESERVED; GET /biobank/aliquots/${a2} -> data.status == RESERVED (both needed to cover 1.0ml)"

  # ---------------------------------------------------------------------------
  - rule_id: non_linear_state_machine
    instances:
      - name: sample_request_revision_cycle
        grounds:
          - state_machines.SampleRequest.UNDER_REVIEW_to_REVISION_REQUESTED
          - state_machines.SampleRequest.REVISION_REQUESTED_to_UNDER_REVIEW
          - validations[priority=14]
        distinguishing_aspect: |
          SampleRequest has a bounded revision CYCLE (UNDER_REVIEW ->
          REVISION_REQUESTED -> UNDER_REVIEW) with revision_round incrementing
          per loop and a hard cap of 2; the third request-revision is rejected
          with ERR_MAX_REVISION_ROUNDS.
        test_recipe:
          setup:
            - "Agreement AG ACTIVE scope GENERAL_RESEARCH; request RQ created and submitted (UNDER_REVIEW, revision_round 0)"
          setup_api_calls:
            - { call: "POST /biobank/sharing-agreements", payload: { recipient_institution: "Uni C", scope_uses: ["GENERAL_RESEARCH"], total_committed_volume_ml: 100.0, effective_from: "2026-04-01T00:00:00Z", effective_to: "2027-04-01T00:00:00Z" }, as: BiobankAdmin, captures: { ag_id: "$.data.id" } }
            - { call: "POST /biobank/sharing-agreements/${ag_id}/activate", payload: {}, as: BiobankAdmin }
            - { call: "POST /biobank/sample-requests", payload: { title: "RQ-CYC", required_uses: ["GENERAL_RESEARCH"], specimen_type: "BLOOD", volume_needed_ml: 5.0, sharing_agreement_id: "${ag_id}" }, as: Researcher, as_user_id: "researcher-1", captures: { rq_id: "$.data.id" } }
            - { call: "POST /biobank/sample-requests/${rq_id}/submit", payload: {}, as: Researcher, as_user_id: "researcher-1" }
          trigger:
            - { call: "POST /biobank/sample-requests/${rq_id}/request-revision", payload: { rationale: "please clarify cohort selection criteria" }, as: CommitteeReviewer, as_user_id: "rev-1" }
            - { call: "POST /biobank/sample-requests/${rq_id}/submit", payload: {}, as: Researcher, as_user_id: "researcher-1" }
            - { call: "POST /biobank/sample-requests/${rq_id}/request-revision", payload: { rationale: "still missing ethics attachment text" }, as: CommitteeReviewer, as_user_id: "rev-2" }
            - { call: "POST /biobank/sample-requests/${rq_id}/submit", payload: {}, as: Researcher, as_user_id: "researcher-1" }
            - { call: "POST /biobank/sample-requests/${rq_id}/request-revision", payload: { rationale: "third revision should be refused now" }, as: CommitteeReviewer, as_user_id: "rev-3", captures: { err: "$.data.error_id" } }
          assert:
            - "After first cycle GET /biobank/sample-requests/${rq_id} -> data.revision_round == 1 and status UNDER_REVIEW"
            - "After second cycle -> data.revision_round == 2 and status UNDER_REVIEW"
            - "Final request-revision -> 409 with error_id ERR_MAX_REVISION_ROUNDS"

      - name: storage_unit_posture_cycle
        grounds:
          - state_machines.StorageUnit.OPERATIONAL_to_WARNING
          - state_machines.StorageUnit.WARNING_to_OPERATIONAL
          - state_machines.StorageUnit.WARNING_to_FAILURE
          - state_machines.StorageUnit.FAILURE_to_OPERATIONAL
          - state_machines.Aliquot.IN_STORAGE_to_QUARANTINED
          - state_machines.Aliquot.QUARANTINED_to_IN_STORAGE
        distinguishing_aspect: |
          StorageUnit has a CYCLIC posture machine (OPERATIONAL -> WARNING ->
          OPERATIONAL -> FAILURE -> OPERATIONAL) on a different entity than the
          SampleRequest cycle, and each posture hop drives the aliquot
          quarantine side effects.
        test_recipe:
          setup:
            - "Unit FRZ-CYC OPERATIONAL (warn -70, fail -60) with slot A1; donor/consent/kit; Specimen SP IN_STORAGE with Aliquot AL in slot A1"
          setup_api_calls:
            - { call: "POST /biobank/donors", payload: { donor_reference_code: "D-SM2" }, as: ConsentCoordinator, captures: { d_id: "$.data.id" } }
            - { call: "POST /biobank/donors/${d_id}/consent-records", payload: { permitted_uses: ["GENERAL_RESEARCH"], effective_from: "2026-05-01T00:00:00Z" }, as: ConsentCoordinator, captures: { c_id: "$.data.id" } }
            - { call: "POST /biobank/collection-kits", payload: { kit_type: "BLOOD", expires_at: "2027-01-01T00:00:00Z" }, as: ConsentCoordinator, captures: { k_id: "$.data.id" } }
            - { call: "POST /biobank/collection-kits/${k_id}/distribute", payload: { donor_id: "${d_id}" }, as: ConsentCoordinator }
            - { call: "POST /biobank/collection-kits/${k_id}/receive-return", payload: {}, as: ConsentCoordinator }
            - { call: "POST /biobank/storage-units", payload: { unit_code: "FRZ-CYC", setpoint_c: -80.0, warn_threshold_c: -70.0, fail_threshold_c: -60.0 }, as: BiobankAdmin, captures: { u_id: "$.data.id" } }
            - { call: "POST /biobank/storage-units/${u_id}/slots", payload: { slot_code: "A1", capacity_ml: 500 }, as: BiobankAdmin, captures: { s_id: "$.data.id" } }
