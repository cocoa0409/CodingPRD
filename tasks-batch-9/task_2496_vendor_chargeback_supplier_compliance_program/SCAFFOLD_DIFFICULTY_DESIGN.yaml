  - rule_id: resource_temporal_overlap
    instances:
      - name: routing_guide_scope_timeline_half_open_adjacency_allowed
        grounds:
          - validations[priority=14]
          - errors.ERR_GUIDE_EFFECTIVE_OVERLAP
          - state_machines.RoutingGuide.PUBLISHED_to_SUPERSEDED
          - entities.RoutingRequirement.fields.effective_until
        distinguishing_aspect: |
          RESOURCE: the RoutingGuide scope_code timeline. INTERVAL SEMANTICS: HALF-OPEN
          [effective_from, effective_until) where adjacency at a shared instant is ALLOWED and a
          scope_code of ALL collides with every other scope. A scope-ALL guide sharing the incumbent
          APPAREL guide's effective_from is rejected, yet a scope-ALL guide beginning one day later
          is accepted and supersedes it, stamping effective_until 2026-09-02 down onto the
          incumbent's requirements. An implementation treating the window as CLOSED would also
          reject the 2026-09-02 successor; one that only compares equal scope_codes would accept
          the colliding wildcard.
        test_recipe:
          setup:
            - "Clock at 2026-08-01. No guides exist."
            - "Guide G1 (guide_code RG-APP-1, scope_code APPAREL, effective_from 2026-09-01) holds one LABELING requirement and is PUBLISHED."
            - "Guide G2 (RG-ALL-SAME, scope_code ALL, effective_from 2026-09-01) and guide G3 (RG-ALL-NEXT, scope_code ALL, effective_from 2026-09-02, supersedes_guide_id G1) are DRAFT with one requirement each."
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-08-01T00:00:00Z" }
              as: ComplianceOfficer
              as_user_id: "co-1"
            - call: "POST /compliance/routing-guides"
              payload: { guide_code: "RG-APP-1", title: "Apparel Routing Guide", scope_code: "APPAREL", effective_from: "2026-09-01T00:00:00Z" }
              as: ComplianceOfficer
              as_user_id: "co-1"
              captures: { g1_id: $.data.id }
            - call: "POST /compliance/routing-guides/${g1_id}/requirements"
              payload: { requirement_code: "LBL-01", domain: "LABELING", severity_tier: "TIER_1", min_evidence_count: 2, fixed_fee_cents: 25000, per_unit_recovery_cents: 30, handling_pct: 2.00, min_fee_cents: 30000, cap_cents: 40000 }
              as: ComplianceOfficer
              as_user_id: "co-1"
              captures: { r1_id: $.data.id }
            - call: "POST /compliance/routing-guides/${g1_id}/publish"
              payload: {}
              as: ComplianceOfficer
              as_user_id: "co-1"
            - call: "POST /compliance/routing-guides"
              payload: { guide_code: "RG-ALL-SAME", title: "All-Scope Guide, Same Instant", scope_code: "ALL", effective_from: "2026-09-01T00:00:00Z" }
              as: ComplianceOfficer
              as_user_id: "co-1"
              captures: { g2_id: $.data.id }
            - call: "POST /compliance/routing-guides/${g2_id}/requirements"
              payload: { requirement_code: "PKG-02", domain: "PACKAGING", severity_tier: "TIER_2", min_evidence_count: 1, fixed_fee_cents: 20000, per_unit_recovery_cents: 25, handling_pct: 3.00, min_fee_cents: 45000, cap_cents: 400000 }
              as: ComplianceOfficer
              as_user_id: "co-1"
            - call: "POST /compliance/routing-guides"
              payload: { guide_code: "RG-ALL-NEXT", title: "All-Scope Guide, Next Instant", scope_code: "ALL", effective_from: "2026-09-02T00:00:00Z", supersedes_guide_id: "${g1_id}" }
              as: ComplianceOfficer
              as_user_id: "co-1"
              captures: { g3_id: $.data.id }
            - call: "POST /compliance/routing-guides/${g3_id}/requirements"
              payload: { requirement_code: "PKG-02", domain: "PACKAGING", severity_tier: "TIER_2", min_evidence_count: 1, fixed_fee_cents: 22000, per_unit_recovery_cents: 27, handling_pct: 3.00, min_fee_cents: 45000, cap_cents: 400000 }
              as: ComplianceOfficer
              as_user_id: "co-1"
          trigger:
            - call: "POST /compliance/routing-guides/${g2_id}/publish"
              payload: {}
              as: ComplianceOfficer
              as_user_id: "co-1"
            - call: "POST /compliance/routing-guides/${g3_id}/publish"
              payload: {}
              as: ComplianceOfficer
              as_user_id: "co-1"
          assert:
            - "First trigger call returns HTTP 409 with $.data.error_id == ERR_GUIDE_EFFECTIVE_OVERLAP"
            - "RoutingGuide.${g2_id}.status == DRAFT"
            - "RoutingGuide.${g2_id}.published_at == null"
            - "Second trigger call returns HTTP 200"
            - "RoutingGuide.${g3_id}.status == PUBLISHED"
            - "RoutingGuide.${g3_id}.effective_from == 2026-09-02T00:00:00Z"
            - "RoutingGuide.${g3_id}.effective_until == null"
            - "RoutingGuide.${g1_id}.status == SUPERSEDED"
            - "RoutingGuide.${g1_id}.effective_until == 2026-09-02T00:00:00Z"
            - "RoutingRequirement.${r1_id}.effective_until == 2026-09-02T00:00:00Z"
            - "GET /compliance/routing-guides?status=PUBLISHED returns total_count == 1"

      - name: scorecard_period_timeline_closed_interval_with_mandatory_clearance
        grounds:
          - validations[priority=15]
          - errors.ERR_SCORECARD_PERIOD_OVERLAP
          - program_constants.SCORECARD_PERIOD_GAP_DAYS
          - entities.Scorecard.fields.period_end
        distinguishing_aspect: |
          A DIFFERENT resource entity - the Vendor's scorecard-period timeline rather than the
          RoutingGuide scope timeline - with the OPPOSITE interval semantics: CLOSED
          [period_start, period_end] on both ends PLUS a mandatory 1-day clearance, so adjacency is
          REJECTED. A candidate starting 2026-07-01, the very next day after the incumbent's
          2026-06-30 end, collides; only 2026-07-02 clears. An implementation using half-open
          semantics (as the guide timeline does) would wrongly accept the 2026-07-01 candidate.
        test_recipe:
          setup:
            - "Clock at 2026-08-01."
            - "Vendor V-1402 with exactly one Scorecard for the CLOSED period 2026-06-01..2026-06-30 in status OPEN."
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-08-01T00:00:00Z" }
              as: ComplianceOfficer
              as_user_id: "co-1"
            - call: "POST /compliance/vendors"
              payload: { vendor_code: "V-1402", legal_name: "Clearance Commodities", payment_terms_days: 30 }
              as: ComplianceOfficer
              as_user_id: "co-1"
              captures: { v_id: $.data.id }
            - call: "POST /compliance/scorecards"
              payload: { vendor_id: "${v_id}", period_code: "2026-06", period_start: "2026-06-01T00:00:00Z", period_end: "2026-06-30T00:00:00Z" }
              as: ComplianceOfficer
              as_user_id: "co-1"
              captures: { sc1_id: $.data.id }
          trigger:
            - call: "POST /compliance/scorecards"
              payload: { vendor_id: "${v_id}", period_code: "2026-07-ADJACENT", period_start: "2026-07-01T00:00:00Z", period_end: "2026-07-31T00:00:00Z" }
              as: ComplianceOfficer
              as_user_id: "co-1"
            - call: "POST /compliance/scorecards"
              payload: { vendor_id: "${v_id}", period_code: "2026-07-CLEARED", period_start: "2026-07-02T00:00:00Z", period_end: "2026-07-31T00:00:00Z" }
              as: ComplianceOfficer
              as_user_id: "co-1"
              captures: { sc3_id: $.data.id }
          assert:
            - "First trigger call returns HTTP 409 with $.data.error_id == ERR_SCORECARD_PERIOD_OVERLAP"
            - "Second trigger call returns HTTP 201"
            - "Scorecard.${sc3_id}.period_start == 2026-07-02T00:00:00Z"
            - "Scorecard.${sc3_id}.period_end == 2026-07-31T00:00:00Z"
            - "Scorecard.${sc3_id}.status == OPEN"
            - "Scorecard.${sc3_id}.tolerance_early_days == 2"
            - "Scorecard.${sc3_id}.tolerance_late_days == 0"
            - "Scorecard.${sc3_id}.fill_tolerance_pct == 2.00"
            - "Scorecard.${sc1_id}.period_end == 2026-06-30T00:00:00Z"
            - "GET /compliance/scorecards?vendor_id=${v_id} returns total_count == 2"

  - rule_id: compensating_invariant
    instances:
      - name: deduction_reversal_restores_vendor_open_exposure_exactly
        grounds:
          - state_machines.Deduction.POSTED_to_REVERSED
          - calculations.chargeback_settlement_reconciliation
          - calculations.vendor_exposure_reconciliation
          - endpoints[POST /compliance/deductions/{id}/reverse]
        distinguishing_aspect: |
          CONSERVED QUANTITY: money - the vendor's open exposure, defined as
          sum(gross_assessed - reversal - recovered) over ASSESSED/PARTIALLY_RECOVERED chargebacks.
          Posting a 425000 deduction drives it 425000 -> 0 and drives recovered_lifetime_cents
          0 -> 425000; reversing must restore BOTH to exactly their pre-posting values with no
          drift, flipping settlement_status RECOVERED -> ASSESSED and deduction_posted true ->
          false, while the allocation ROW survives as REVERSED (allocation_count stays 1) and
          Deduction.amount_cents drops to 0.
        test_recipe:
          setup:
            - "Vendor V-1501 with one TIER_1 SHP-04 chargeback of 425000 assessed 2026-08-10; open_chargeback_cents 425000, recovered_lifetime_cents 0."
            - "A deduction against INV-95 with a single 425000 allocation to that chargeback, POSTED, so the chargeback is RECOVERED and the vendor's open exposure is 0."
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-08-01T00:00:00Z" }
              as: ComplianceOfficer
              as_user_id: "co-1"
            - call: "POST /compliance/vendors"
