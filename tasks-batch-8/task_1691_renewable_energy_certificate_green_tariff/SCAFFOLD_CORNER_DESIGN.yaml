              payload: {}
              as: GeneratorOperator
              as_user_id: "${g}"
            - call: "POST /greenpower/generators/${g}/verify"
              payload: {}
              as: RegistryAdmin
            - call: "POST /greenpower/meter-readings"
              payload: { generator_id: "${g}", period_start: "2026-07-01T00:00:00Z", period_end: "2026-08-01T00:00:00Z", metered_kwh: 5000 }
              as: GeneratorOperator
              as_user_id: "${g}"
              captures: { r1: $.data.id }
            - call: "POST /greenpower/meter-readings/${r1}/attest"
              payload: {}
              as: MeterAttester
              as_user_id: "att-1"
            - call: "POST /greenpower/meter-readings/${r1}/accept"
              payload: {}
              as: RegistryAdmin
            - call: "POST /greenpower/generators/${g}/mint-run"
              payload: {}
              as: RegistryAdmin
            - call: "GET /greenpower/certificates?generator_id=${g}&vintage_month=2026-07"
              as: RegistryAdmin
              captures: { c: "$.data[0].id", cv: "$.data[0].version" }
            - call: "GET /greenpower/accounts?generator_id=${g}"
              as: RegistryAdmin
              captures: { gacc: "$.data[0].id" }
            - call: "POST /greenpower/accounts"
              payload: { account_type: "BROKER", owner_name: "Broker One" }
              as: RegistryAdmin
              captures: { b1: $.data.id }
          trigger:
            - call: "POST /greenpower/certificates/${c}/transfer"
              payload: { to_account_id: "${b1}" }
              as: RegistryAdmin
          assert:
            - "before transfer: Account.${gacc}.active_holdings_mwh == 5 and Account.${b1}.active_holdings_mwh == 0"
            - "after transfer: Account.${gacc}.active_holdings_mwh == 0 and Account.${b1}.active_holdings_mwh == 5 (same-request consistency)"
            - "Certificate.${c}.version == ${cv} + 1 and account_id == ${b1}"

      - name: mint_run_idempotent_over_consumed_readings
        claim_type: conditional_action
        grounds: ["calculations.rec_minting_carryover", "endpoints"]
        distinguishing_aspect: "A second mint-run with no newly accepted readings mints nothing and returns zeros — the minted flag makes the ops-run checkpoint re-entrant."
