              payload: { bond_amount_cents: 200000, surety_name: "Cascade Surety", effective_date: "2027-01-01", expiration_date: "2029-12-31" }
              as: OutfitterRepresentative
              as_user_id: "${ob_id}"
              captures: { b2_low: "$.data.id" }
            - call: "GET /osup/permits/${p2}"
              payload: {}
              as: PermitSpecialist
