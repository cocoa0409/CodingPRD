              captures: { by_officer: "$.data[0].id" }
            - call: "GET /lane-assignments"
              payload: { time_band_id: "${band1_id}" }
              as: StaffingPlanner
              captures: { by_band: "$.data[0].id" }
            - call: "GET /lane-assignments/${asg1_id}"
