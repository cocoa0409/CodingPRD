# =============================================================================
# Task 974 — Rep-Payee & Professional-Fiduciary Service
# =============================================================================

scenario: |
  974. Rep-Payee & Professional-Fiduciary Service: client & benefit (SSA rep-payee),
  budget & disbursement, bill-pay & account, annual accounting & court/SSA report,
  restricted-account & bond, Medicaid spend-down, audit, conservator coordination

domain_name: rep-payee-professional-fiduciary
api_prefix: /

complexity_profile:
  primary_archetype: compliance_audit
  secondary_archetype: ledger_reconciliation
  complexity_layers:
    - optimistic_concurrency
    - cascading_side_effects
    - dual_variant_calculation
    - rate_threshold_triggers
    - derived_field_reconciliation
    - scheduled_actions
  entity_topology: flat
  state_machine_shape: branching
  relationship_patterns:
    - one_to_many
    - cross_aggregate
  role_model: segregation_of_duties
  consistency_model: immediate

# =============================================================================
# §1.0 Response Envelope (FIXED)
# =============================================================================
response_envelope:
  success: |
    { "meta": { "api_request_id": "req_xxx", "api_request_timestamp": "ISO8601" },
      "response_type": "object" | "array", "data": {} }
  error: |
    { "meta": { ... }, "response_type": "error",
      "data": { "error_id": "ERR_XXX", "message": "..." } }
  pagination_fields: ["limit", "offset", "total_count", "has_more"]
  pagination_defaults: { limit: 10, min: 1, max: 100, offset: 0 }

# =============================================================================
# §1.1 Entity-Relationship Table (flat topology — all references by FK)
# =============================================================================
entities:
  - name: Client
    parent: null
    common_fields: true
    fields:
      - { name: legal_name, type: string, source: input, description: "Beneficiary legal name" }
      - { name: date_of_birth, type: string, source: input, description: "ISO date YYYY-MM-DD" }
      - { name: ssn_last4, type: string, source: input, description: "Last 4 SSN digits; constraints: exactly 4 digits" }
      - { name: county_of_residence, type: string, source: input, description: "County code for court jurisdiction" }
      - { name: medicaid_enrolled, type: boolean, source: input, description: "Whether client is enrolled in Medicaid (gates spend-down)" }
      - { name: medicaid_resource_limit_cents, type: integer, source: input, default: 200000, description: "Countable-resource ceiling; constraints: > 0; default $2,000.00" }
      - { name: status, type: enum, source: system, default: INTAKE_REVIEW, description: "INTAKE_REVIEW | ACTIVE | SUSPENDED | TERMINATED" }
      - { name: total_funds_cents, type: integer, source: computed, description: "Sum of balance_cents over all TrustAccount with status IN {OPEN, FROZEN} for this client (all account types)" }
      - { name: countable_resources_cents, type: integer, source: computed, description: "Sum of balance_cents over TrustAccount with status IN {OPEN, FROZEN} AND account_type IN {OPERATING, RESTRICTED} (DEDICATED accounts are excluded per SSA countable-resource rules)" }
      - { name: medicaid_at_risk, type: boolean, source: computed, description: "true iff medicaid_enrolled AND countable_resources_cents > medicaid_resource_limit_cents (strictly greater; equality is NOT at risk)" }

  - name: BenefitEntitlement
    parent: null
    common_fields: true
    fields:
      - { name: client_id, type: string, source: input, description: "FK -> Client.id; beneficiary" }
      - { name: claim_type, type: enum, source: input, description: "SSI | SSDI" }
      - { name: monthly_benefit_cents, type: integer, source: input, description: "Awarded monthly benefit; constraints: > 0" }
      - { name: effective_start_date, type: string, source: input, description: "ISO date; start of half-open window [start, end)" }
      - { name: effective_end_date, type: string, source: input, description: "ISO date or null; end-exclusive; null = open-ended; constraints: null or > effective_start_date" }
      - { name: status, type: enum, source: system, default: PENDING_VERIFICATION, description: "PENDING_VERIFICATION | VERIFIED | TERMINATED" }
      - { name: verified_at, type: datetime, source: system, description: "Set on verify transition; null otherwise" }

  - name: TrustAccount
    parent: null
    common_fields: true
    fields:
      - { name: client_id, type: string, source: input, description: "FK -> Client.id; owning beneficiary" }
      - { name: account_type, type: enum, source: input, description: "OPERATING | RESTRICTED | DEDICATED; RESTRICTED = court-blocked (withdrawals need granted CourtOrder); DEDICATED = SSI past-due account (only MEDICAL/EDUCATION disbursements)" }
      - { name: bank_account_ref, type: string, source: input, description: "External bank reference; constraints: unique across all TrustAccount rows" }
      - { name: balance_cents, type: integer, source: computed, description: "= SUM(LedgerEntry.amount_cents) for this account (signed entries)" }
      - { name: status, type: enum, source: system, default: OPEN, description: "OPEN | FROZEN | CLOSED" }

  - name: LedgerEntry
    parent: null
    common_fields: false
    fields:
      - { name: account_id, type: string, source: system, description: "FK -> TrustAccount.id; account this entry posts to" }
      - { name: entry_type, type: enum, source: system, description: "DEPOSIT_POSTED | DEPOSIT_RETURNED | DISBURSEMENT_RELEASED | DISBURSEMENT_RETURNED" }
      - { name: amount_cents, type: integer, source: system, description: "Signed amount: positive credits, negative debits" }
      - { name: reference_id, type: string, source: system, description: "Polymorphic: id of the Deposit or Disbursement that produced this entry" }
      - { name: balance_after_cents, type: integer, source: computed, description: "Running account balance immediately after this entry, in chronological replay order (created_at ASC, tie-break none needed — same-account entries are strictly serialized by request order)" }

  - name: BudgetPlan
    parent: null
    common_fields: true
    fields:
      - { name: client_id, type: string, source: input, description: "FK -> Client.id; beneficiary" }
      - { name: period_month, type: string, source: input, description: "Budget month YYYY-MM" }
      - { name: source_benefit_cents, type: integer, source: input, description: "Allocation basis (usually the monthly benefit); constraints: > 0" }
      - { name: lines, type: array, source: input, description: "[{category, percent}] — category in {HOUSING, FOOD, CLOTHING, PERSONAL, MEDICAL, EDUCATION, SAVINGS}, percent integer 0-100; percents must sum to exactly 100; categories unique within a plan" }
      - { name: allocated_lines, type: array, source: computed, description: "[{category, amount_cents}] — per-line amount = round_half_up(source_benefit_cents * percent / 100); residual (source_benefit_cents minus sum of rounded lines, may be negative) folded into the HOUSING line if present else the first line in canonical category order HOUSING,FOOD,CLOTHING,PERSONAL,MEDICAL,EDUCATION,SAVINGS" }
      - { name: total_planned_cents, type: integer, source: computed, description: "= source_benefit_cents; invariant: SUM(allocated_lines.amount_cents) == total_planned_cents at all times" }
      - { name: status, type: enum, source: system, default: DRAFT, description: "DRAFT | PROPOSED | APPROVED | SUPERSEDED" }
      - { name: superseded_by_plan_id, type: string, source: system, description: "FK -> BudgetPlan.id; nullable; set when this plan is superseded by a newer create" }
      - { name: created_by_user_id, type: string, source: system, description: "X-User-ID of the CaseManager who created the plan" }

  - name: Disbursement
    parent: null
    common_fields: true
    fields:
      - { name: client_id, type: string, source: input, description: "FK -> Client.id; beneficiary whose funds pay" }
      - { name: account_id, type: string, source: input, description: "FK -> TrustAccount.id; source account (must belong to client_id)" }
      - { name: budget_plan_id, type: string, source: input, description: "FK -> BudgetPlan.id; plan this spend counts against (must belong to client_id)" }
      - { name: court_order_id, type: string, source: input, description: "FK -> CourtOrder.id; nullable; REQUIRED iff source account is RESTRICTED" }
      - { name: spend_down_plan_id, type: string, source: input, description: "FK -> SpendDownPlan.id; nullable; links the spend to a Medicaid spend-down plan entry" }
      - { name: payee_name, type: string, source: input, description: "Who is paid" }
      - { name: category, type: enum, source: input, description: "HOUSING | FOOD | CLOTHING | PERSONAL | MEDICAL | EDUCATION | SAVINGS" }
      - { name: amount_cents, type: integer, source: input, description: "Payment amount; constraints: > 0" }
      - { name: scheduled_release_date, type: string, source: input, description: "ISO date the payment is planned for; report ACCRUAL basis buckets by this date" }
      - { name: requested_by_user_id, type: string, source: system, description: "X-User-ID of requesting CaseManager" }
      - { name: approved_by_user_id, type: string, source: system, description: "X-User-ID of approving FinancialOfficer; null until approved" }
      - { name: co_approved_by_conservator_id, type: string, source: system, description: "FK -> Conservator.id; null unless conservator co-approval happened" }
      - { name: fee_cents, type: integer, source: computed, description: "Fiduciary fee computed at RELEASE via fiduciary_fee rule; 0 before release" }
      - { name: released_at, type: datetime, source: system, description: "Set on release; null otherwise" }
      - { name: returned_at, type: datetime, source: system, description: "Set on return; null otherwise" }
      - { name: status, type: enum, source: system, default: REQUESTED, description: "REQUESTED | PENDING_CONSERVATOR | APPROVED | RELEASED | REJECTED | RETURNED" }

  - name: Deposit
    parent: null
    common_fields: true
    fields:
      - { name: account_id, type: string, source: input, description: "FK -> TrustAccount.id; destination account" }
      - { name: entitlement_id, type: string, source: input, description: "FK -> BenefitEntitlement.id; nullable; set when source is SSA_BENEFIT" }
      - { name: source, type: enum, source: input, description: "SSA_BENEFIT | PENSION | REFUND | OTHER" }
      - { name: amount_cents, type: integer, source: input, description: "Deposit amount; constraints: > 0" }
      - { name: received_date, type: string, source: input, description: "ISO date funds arrived" }
      - { name: posted_at, type: datetime, source: system, description: "Set on post transition; null otherwise" }
      - { name: status, type: enum, source: system, default: RECEIVED, description: "RECEIVED | POSTED | RETURNED" }

  - name: CourtOrder
    parent: null
    common_fields: true
    fields:
      - { name: client_id, type: string, source: input, description: "FK -> Client.id; subject client" }
      - { name: order_type, type: enum, source: input, description: "RESTRICTED_WITHDRAWAL | REPORT_EXTENSION | BOND_RELIEF" }
      - { name: amount_limit_cents, type: integer, source: input, description: "Max withdrawable for RESTRICTED_WITHDRAWAL; null for other types; constraints: > 0 when present" }
      - { name: petitioned_date, type: string, source: input, description: "ISO date petition filed" }
      - { name: granted_date, type: string, source: system, description: "ISO date granted; set on grant" }
      - { name: expiry_date, type: string, source: input, description: "ISO date; order unusable after this date" }
      - { name: executed_disbursement_id, type: string, source: system, description: "FK -> Disbursement.id; set when a restricted release consumes the order" }
      - { name: status, type: enum, source: system, default: PETITIONED, description: "PETITIONED | GRANTED | EXECUTED | EXPIRED" }

  - name: SuretyBond
    parent: null
    common_fields: true
    fields:
      - { name: coverage_amount_cents, type: integer, source: input, description: "Bond coverage ceiling over total funds under management; constraints: > 0" }
      - { name: coverage_start_date, type: string, source: input, description: "ISO date; half-open window start" }
      - { name: coverage_end_date, type: string, source: input, description: "ISO date; end-exclusive; constraints: > coverage_start_date" }
      - { name: premium_paid_through_date, type: string, source: input, description: "ISO date through which premium is paid" }
      - { name: status, type: enum, source: system, default: PENDING, description: "PENDING | ACTIVE | LAPSED" }
      - { name: funds_under_management_cents, type: integer, source: computed, description: "SUM of balance_cents over ALL TrustAccount rows with status IN {OPEN, FROZEN} org-wide" }
      - { name: utilization_bps, type: integer, source: computed, description: "= floor(funds_under_management_cents * 10000 / coverage_amount_cents); 10000 bps = 100%" }

  - name: AccountingReport
    parent: null
    common_fields: true
    fields:
      - { name: client_id, type: string, source: input, description: "FK -> Client.id; subject client" }
      - { name: report_type, type: enum, source: input, description: "SSA_6233 | COURT_ANNUAL" }
      - { name: period_start_date, type: string, source: input, description: "ISO date; closed interval start" }
      - { name: period_end_date, type: string, source: input, description: "ISO date; closed interval end (inclusive); constraints: >= period_start_date" }
      - { name: basis, type: enum, source: input, description: "CASH | ACCRUAL — selects report_totals variant" }
      - { name: due_date, type: string, source: computed, description: "= period_end_date + 30 days (SSA-6233 statutory window)" }
      - { name: receipts_total_cents, type: integer, source: computed, description: "Computed at submit per report_totals variant; null while DRAFTING" }
      - { name: disbursements_total_cents, type: integer, source: computed, description: "Computed at submit per report_totals variant; null while DRAFTING" }
      - { name: opening_balance_cents, type: integer, source: computed, description: "Ledger replay of all client accounts for entries with created_at < period_start_date; null while DRAFTING" }
      - { name: ending_balance_cents, type: integer, source: computed, description: "= opening_balance_cents + receipts_total_cents - disbursements_total_cents; null while DRAFTING" }
      - { name: submitted_at, type: datetime, source: system, description: "Set on submit; null otherwise" }
      - { name: status, type: enum, source: system, default: DRAFTING, description: "DRAFTING | SUBMITTED | ACCEPTED | REJECTED" }

  - name: SpendDownPlan
    parent: null
    common_fields: true
    fields:
      - { name: client_id, type: string, source: input, description: "FK -> Client.id; subject client (must have medicaid_enrolled = true)" }
      - { name: target_month, type: string, source: input, description: "Spend-down target month YYYY-MM" }
      - { name: entries, type: array, source: input, description: "[{category, planned_amount_cents}] — planned allowable spends; category in {HOUSING, FOOD, CLOTHING, PERSONAL, MEDICAL, EDUCATION}; planned_amount_cents > 0" }
      - { name: provisional_excess_cents, type: integer, source: computed, description: "PROVISIONAL variant at create/activate: max(0, countable_resources_cents + expected_inflow_cents - medicaid_resource_limit_cents); expected_inflow = SUM(monthly_benefit_cents) of VERIFIED entitlements whose half-open window covers target_month" }
      - { name: final_excess_cents, type: integer, source: computed, description: "FINAL variant at finalize: max(0, countable_resources_cents_at_finalize - medicaid_resource_limit_cents); null until finalized" }
      - { name: auto_created, type: boolean, source: system, default: false, description: "true when created by the deposit-post resource cascade" }
      - { name: status, type: enum, source: system, default: DRAFT, description: "DRAFT | ACTIVE | MET | LAPSED" }

  - name: AuditCase
    parent: null
    common_fields: true
    fields:
      - { name: client_id, type: string, source: input, description: "FK -> Client.id; audited client" }
      - { name: authority, type: enum, source: input, description: "SSA | STATE_COURT | BONDING_COMPANY" }
      - { name: scope, type: enum, source: input, description: "CLIENT_ACCOUNT | ORG_WIDE" }
      - { name: period_start_date, type: string, source: input, description: "ISO date audit window start" }
      - { name: period_end_date, type: string, source: input, description: "ISO date audit window end; constraints: >= period_start_date" }
      - { name: misuse_amount_cents, type: integer, source: system, description: "Declared at issue-findings; 0 = clean findings; constraints: >= 0" }
      - { name: findings_count, type: integer, source: system, description: "Number of findings issued; set at issue-findings; constraints: >= 0" }
      - { name: status, type: enum, source: system, default: OPENED, description: "OPENED | FINDINGS_ISSUED | CLOSED_NO_ACTION | MISUSE_CONFIRMED" }

  - name: Conservator
    parent: null
    common_fields: true
    fields:
      - { name: client_id, type: string, source: input, description: "FK -> Client.id; coordinated client" }
      - { name: full_name, type: string, source: input, description: "Court-appointed conservator name" }
      - { name: court_case_number, type: string, source: input, description: "Court docket reference; constraints: unique across all Conservator rows" }
      - { name: authority_scope, type: enum, source: input, description: "EXCLUSIVE | SHARED | ADVISORY — EXCLUSIVE: co-approval required on every disbursement; SHARED: required only when amount_cents >= 50000; ADVISORY: never required" }
      - { name: appointed_date, type: string, source: input, description: "ISO date appointed" }
      - { name: status, type: enum, source: system, default: ACTIVE, description: "ACTIVE | SUSPENDED | DISCHARGED" }

# =============================================================================
# §1.2 State Machine Table
# =============================================================================
state_machines:
  - entity: Client
    initial_state: INTAKE_REVIEW
    terminal_states: [TERMINATED]
    transitions:
      - from: INTAKE_REVIEW
        to: ACTIVE
        trigger: "POST /clients/{id}/activate"
        actor: FiduciaryAdmin
        preconditions:
          - "At least one BenefitEntitlement with client_id = this client and status = VERIFIED exists (else ERR_NO_VERIFIED_ENTITLEMENT)"
        side_effects:
          - "Every TrustAccount of this client with status = FROZEN -> OPEN"
      - from: SUSPENDED
        to: ACTIVE
        trigger: "POST /clients/{id}/activate"
        actor: FiduciaryAdmin
        preconditions:
          - "At least one BenefitEntitlement with client_id = this client and status = VERIFIED exists (else ERR_NO_VERIFIED_ENTITLEMENT)"
        side_effects:
          - "Every TrustAccount of this client with status = FROZEN -> OPEN"
      - from: ACTIVE
        to: SUSPENDED
        trigger: "POST /clients/{id}/suspend OR system (AuditCase close -> MISUSE_CONFIRMED cascade)"
        actor: FiduciaryAdmin | system
        preconditions: []
        side_effects:
          - "Every TrustAccount of this client with status = OPEN -> FROZEN (which itself rejects that account's pending disbursements — see TrustAccount machine)"
      - from: ACTIVE
        to: TERMINATED
        trigger: "POST /clients/{id}/terminate"
        actor: FiduciaryAdmin
        preconditions:
          - "No Disbursement of this client in status RELEASED that is not yet reconciled is NOT required — termination is allowed regardless of released history"
        side_effects:
          - "Every TrustAccount of this client with status = OPEN -> FROZEN (cascade continues per TrustAccount machine)"
          - "Every BenefitEntitlement of this client with status IN {PENDING_VERIFICATION, VERIFIED} -> TERMINATED"
          - "Every BudgetPlan of this client with status IN {DRAFT, PROPOSED, APPROVED} -> SUPERSEDED"
          - "Every SpendDownPlan of this client with status IN {DRAFT, ACTIVE} -> LAPSED"
      - from: SUSPENDED
        to: TERMINATED
        trigger: "POST /clients/{id}/terminate"
        actor: FiduciaryAdmin
        preconditions: []
        side_effects:
          - "Same cascades as ACTIVE -> TERMINATED"

  - entity: BenefitEntitlement
    initial_state: PENDING_VERIFICATION
    terminal_states: [TERMINATED]
    transitions:
      - from: PENDING_VERIFICATION
        to: VERIFIED
        trigger: "POST /benefit-entitlements/{id}/verify"
        actor: FiduciaryAdmin
        preconditions:
          - "Client.status IN {INTAKE_REVIEW, ACTIVE, SUSPENDED} (not TERMINATED)"
        side_effects:
          - "verified_at = current logical clock"
      - from: VERIFIED
        to: TERMINATED
        trigger: "POST /benefit-entitlements/{id}/terminate OR system (client terminate cascade)"
        actor: FiduciaryAdmin | system
        preconditions: []
        side_effects: []
      - from: PENDING_VERIFICATION
        to: TERMINATED
        trigger: "system (client terminate cascade)"
        actor: system
        preconditions: []
        side_effects: []

  - entity: TrustAccount
    initial_state: OPEN
    terminal_states: [CLOSED]
    transitions:
      - from: OPEN
        to: FROZEN
        trigger: "system (client suspend / client terminate / audit misuse cascade)"
        actor: system
        preconditions: []
        side_effects:
          - "Every Disbursement with account_id = this account and status IN {REQUESTED, PENDING_CONSERVATOR, APPROVED} -> REJECTED"
      - from: FROZEN
        to: OPEN
        trigger: "system (client re-activation cascade)"
        actor: system
        preconditions: []
        side_effects: []
      - from: OPEN
        to: CLOSED
        trigger: "POST /trust-accounts/{id}/close"
        actor: FinancialOfficer
        preconditions:
          - "balance_cents == 0 (else ERR_ACCOUNT_NOT_ZERO)"
          - "No Disbursement with account_id = this account and status IN {REQUESTED, PENDING_CONSERVATOR, APPROVED} (else ERR_PENDING_DISBURSEMENTS)"
        side_effects: []

  - entity: BudgetPlan
    initial_state: DRAFT
    terminal_states: [SUPERSEDED]
    transitions:
      - from: DRAFT
        to: PROPOSED
        trigger: "POST /budget-plans/{id}/propose"
        actor: CaseManager
        preconditions: []
        side_effects: []
      - from: PROPOSED
        to: APPROVED
        trigger: "POST /budget-plans/{id}/approve"
        actor: FinancialOfficer
        preconditions:
          - "Segregation of duties: X-User-ID != created_by_user_id (else ERR_SEGREGATION_OF_DUTIES)"
        side_effects: []
      - from: APPROVED
        to: DRAFT
        trigger: "POST /budget-plans/{id}/revise"
        actor: CaseManager
        preconditions: []
        side_effects:
          - "Revision loop: plan returns to DRAFT; allocated_lines recomputed on next propose? NO — allocated_lines persist; only status reverts"
      - from: DRAFT
        to: SUPERSEDED
        trigger: "system (new BudgetPlan create for same (client_id, period_month) supersedes, or client terminate cascade)"
        actor: system
        preconditions: []
        side_effects:
          - "superseded_by_plan_id = new plan id when superseded by create; null when from client terminate"
      - from: PROPOSED
        to: SUPERSEDED
        trigger: "system (same as above)"
        actor: system
        preconditions: []
        side_effects:
          - "superseded_by_plan_id = new plan id when superseded by create; null when from client terminate"
      - from: APPROVED
        to: SUPERSEDED
        trigger: "system (new BudgetPlan create for same (client_id, period_month))"
        actor: system
        preconditions: []
        side_effects:
          - "superseded_by_plan_id = new plan id"

  - entity: Disbursement
    initial_state: REQUESTED
    terminal_states: [REJECTED, RETURNED]
    transitions:
      - from: REQUESTED
        to: APPROVED
        trigger: "POST /disbursements/{id}/approve"
        actor: FinancialOfficer
        preconditions:
          - "Segregation of duties: X-User-ID != requested_by_user_id (else ERR_SEGREGATION_OF_DUTIES)"
          - "Conservator co-approval NOT required for this disbursement (see co-approval rule); if required, this transition goes to PENDING_CONSERVATOR instead"
        side_effects:
          - "approved_by_user_id = X-User-ID"
      - from: REQUESTED
        to: PENDING_CONSERVATOR
        trigger: "POST /disbursements/{id}/approve (when an ACTIVE Conservator of this client has authority_scope = EXCLUSIVE, or authority_scope = SHARED and amount_cents >= 50000)"
        actor: FinancialOfficer
        preconditions:
          - "Segregation of duties: X-User-ID != requested_by_user_id (else ERR_SEGREGATION_OF_DUTIES)"
        side_effects:
          - "approved_by_user_id = X-User-ID"
      - from: PENDING_CONSERVATOR
        to: APPROVED
        trigger: "POST /disbursements/{id}/co-approve"
        actor: ConservatorOfficer
        preconditions:
          - "X-User-ID equals the id of a Conservator with client_id = this disbursement's client_id and status = ACTIVE (else ERR_CONSERVATOR_NOT_ACTIVE)"
        side_effects:
          - "co_approved_by_conservator_id = X-User-ID"
      - from: REQUESTED
        to: REJECTED
        trigger: "POST /disbursements/{id}/reject OR system (account freeze cascade)"
        actor: FinancialOfficer | system
        preconditions: []
        side_effects: []
      - from: PENDING_CONSERVATOR
        to: REJECTED
        trigger: "POST /disbursements/{id}/reject OR system (account freeze cascade)"
        actor: FinancialOfficer | system
        preconditions: []
        side_effects: []
      - from: APPROVED
        to: REJECTED
        trigger: "system (account freeze cascade)"
        actor: system
        preconditions: []
        side_effects: []
      - from: APPROVED
        to: RELEASED
        trigger: "POST /disbursements/{id}/release"
        actor: FinancialOfficer
        preconditions:
          - "A SuretyBond with status = ACTIVE exists (else ERR_NO_ACTIVE_BOND)"
          - "Account.status = OPEN (else ERR_ACCOUNT_NOT_OPEN)"
          - "Account.balance_cents >= amount_cents (else ERR_INSUFFICIENT_FUNDS)"
          - "BudgetPlan.status = APPROVED (else ERR_PLAN_NOT_APPROVED)"
          - "BudgetPlan.period_month == calendar month of the current logical clock date (else ERR_PLAN_PERIOD_MISMATCH)"
          - "Category remaining: amount_cents <= allocated_lines[category].amount_cents - SUM(amount_cents of RELEASED non-RETURNED disbursements with same budget_plan_id and category) (else ERR_BUDGET_CATEGORY_EXCEEDED)"
          - "If account is RESTRICTED: court_order_id present, order status = GRANTED, order.client_id = disbursement.client_id, order.order_type = RESTRICTED_WITHDRAWAL, logical clock date <= order.expiry_date (else ERR_COURT_ORDER_NOT_GRANTABLE), amount_cents <= order.amount_limit_cents (else ERR_COURT_ORDER_EXCEEDED)"
          - "If account is DEDICATED: category IN {MEDICAL, EDUCATION} (else ERR_DEDICATED_ACCOUNT_RESTRICTED)"
        side_effects:
          - "released_at = current logical clock; fee_cents computed via fiduciary_fee rule"
          - "LedgerEntry created: entry_type = DISBURSEMENT_RELEASED, amount_cents = -amount_cents, reference_id = this disbursement id"
          - "TrustAccount.balance_cents recomputed; Client.total_funds_cents and Client.countable_resources_cents recomputed"
          - "If RESTRICTED account: CourtOrder.status GRANTED -> EXECUTED, executed_disbursement_id = this disbursement id"
      - from: RELEASED
        to: RETURNED
        trigger: "POST /disbursements/{id}/return"
        actor: FinancialOfficer
        preconditions: []
        side_effects:
          - "returned_at = current logical clock"
          - "LedgerEntry created: entry_type = DISBURSEMENT_RETURNED, amount_cents = +amount_cents, reference_id = this disbursement id"
          - "TrustAccount.balance_cents, Client.total_funds_cents, Client.countable_resources_cents recomputed"

  - entity: Deposit
    initial_state: RECEIVED
    terminal_states: [RETURNED]
    transitions:
      - from: RECEIVED
        to: POSTED
        trigger: "POST /deposits/{id}/post"
        actor: FinancialOfficer
        preconditions:
          - "Account.status = OPEN (else ERR_ACCOUNT_NOT_OPEN)"
          - "Bond coverage: funds_under_management across org after this post <= coverage_amount_cents of the ACTIVE bond (else ERR_BOND_COVERAGE_EXCEEDED); if no ACTIVE bond exists, posts are unbounded"
          - "If entitlement_id present: entitlement.client_id == account.client_id (else ERR_ENTITLEMENT_ACCOUNT_MISMATCH)"
        side_effects:
          - "posted_at = current logical clock"
          - "LedgerEntry created: entry_type = DEPOSIT_POSTED, amount_cents = +amount_cents, reference_id = this deposit id"
          - "TrustAccount.balance_cents recomputed (link 1 of resource cascade)"
          - "Client.total_funds_cents and Client.countable_resources_cents recomputed; SuretyBond.funds_under_management_cents recomputed (link 2)"
          - "If client.medicaid_enrolled AND countable_resources_cents > medicaid_resource_limit_cents AND no SpendDownPlan with status IN {DRAFT, ACTIVE} exists for this client for the current clock month: auto-create SpendDownPlan (status = DRAFT, auto_created = true, entries = [], target_month = current clock month, provisional_excess_cents per spend_down_excess PROVISIONAL variant) (link 3)"
      - from: POSTED
        to: RETURNED
        trigger: "POST /deposits/{id}/return"
        actor: FinancialOfficer
        preconditions: []
        side_effects:
          - "LedgerEntry created: entry_type = DEPOSIT_RETURNED, amount_cents = -amount_cents, reference_id = this deposit id"
          - "TrustAccount.balance_cents, Client.total_funds_cents, Client.countable_resources_cents, SuretyBond.funds_under_management_cents recomputed"

  - entity: CourtOrder
    initial_state: PETITIONED
    terminal_states: [EXECUTED, EXPIRED]
    transitions:
      - from: PETITIONED
        to: GRANTED
        trigger: "POST /court-orders/{id}/grant"
        actor: FiduciaryAdmin
        preconditions: []
        side_effects:
          - "granted_date = current logical clock date"
      - from: GRANTED
        to: EXECUTED
        trigger: "system (restricted-account disbursement release consumes the order)"
        actor: system
        preconditions: []
        side_effects:
          - "executed_disbursement_id = releasing disbursement id"
      - from: GRANTED
        to: EXPIRED
        trigger: "system (logical clock date passes expiry_date while still GRANTED)"
        actor: system
        preconditions: []
        side_effects: []
      - from: PETITIONED
        to: EXPIRED
        trigger: "system (logical clock date passes expiry_date while still PETITIONED)"
        actor: system
        preconditions: []
        side_effects: []

  - entity: SuretyBond
    initial_state: PENDING
    terminal_states: [LAPSED]
    transitions:
      - from: PENDING
        to: ACTIVE
        trigger: "POST /surety-bonds/{id}/activate"
        actor: FiduciaryAdmin
        preconditions:
          - "No other SuretyBond with status = ACTIVE has a half-open window [coverage_start_date, coverage_end_date) overlapping this one (else ERR_BOND_WINDOW_CONFLICT); PENDING bonds do not block"
        side_effects: []
      - from: ACTIVE
        to: LAPSED
        trigger: "system (logical clock date reaches coverage_end_date, or premium_paid_through_date is before current clock date)"
        actor: system
        preconditions: []
        side_effects: []

  - entity: AccountingReport
    initial_state: DRAFTING
    terminal_states: [ACCEPTED, REJECTED]
    transitions:
      - from: DRAFTING
        to: SUBMITTED
        trigger: "POST /accounting-reports/{id}/submit"
        actor: FinancialOfficer
        preconditions:
          - "Client.status IN {ACTIVE, SUSPENDED} (else ERR_CLIENT_NOT_ACTIVE)"
          - "Current logical clock date <= due_date (else ERR_REPORT_OVERDUE)"
        side_effects:
          - "receipts_total_cents, disbursements_total_cents, opening_balance_cents, ending_balance_cents computed per report_totals variant selected by basis; submitted_at = clock"
      - from: SUBMITTED
        to: ACCEPTED
        trigger: "POST /accounting-reports/{id}/accept"
        actor: ComplianceAuditor
        preconditions: []
        side_effects: []
      - from: SUBMITTED
        to: REJECTED
        trigger: "POST /accounting-reports/{id}/reject"
        actor: ComplianceAuditor
        preconditions: []
        side_effects:
          - "REJECTED reports do NOT count toward period contiguity; a replacement report for the same period is created via POST /accounting-reports (supersede-by-recreate)"

  - entity: SpendDownPlan
    initial_state: DRAFT
    terminal_states: [MET, LAPSED]
    transitions:
      - from: DRAFT
        to: ACTIVE
        trigger: "POST /spend-down-plans/{id}/activate"
        actor: CaseManager
        preconditions:
          - "Client.medicaid_enrolled = true"
          - "provisional_excess_cents > 0 (strictly; 0 is NOT activatable — else ERR_SPEND_DOWN_NOT_REQUIRED)"
        side_effects: []
      - from: ACTIVE
        to: MET
        trigger: "POST /spend-down-plans/{id}/finalize (when final_excess_cents == 0)"
        actor: CaseManager
        preconditions:
          - "Current logical clock date is within target_month or later"
        side_effects:
          - "final_excess_cents computed per spend_down_excess FINAL variant"
      - from: ACTIVE
        to: LAPSED
        trigger: "POST /spend-down-plans/{id}/finalize (when final_excess_cents > 0) OR system (client terminate cascade)"
        actor: CaseManager | system
        preconditions: []
        side_effects:
          - "final_excess_cents computed per spend_down_excess FINAL variant when finalized via endpoint"
      - from: DRAFT
        to: LAPSED
        trigger: "system (client terminate cascade)"
        actor: system
        preconditions: []
        side_effects: []

  - entity: AuditCase
    initial_state: OPENED
    terminal_states: [CLOSED_NO_ACTION, MISUSE_CONFIRMED]
    transitions:
      - from: OPENED
        to: FINDINGS_ISSUED
        trigger: "POST /audit-cases/{id}/issue-findings"
        actor: ComplianceAuditor
        preconditions: []
        side_effects:
          - "misuse_amount_cents and findings_count recorded from request"
      - from: FINDINGS_ISSUED
        to: CLOSED_NO_ACTION
        trigger: "POST /audit-cases/{id}/close (when misuse_amount_cents == 0)"
        actor: ComplianceAuditor
        preconditions: []
        side_effects: []
      - from: FINDINGS_ISSUED
        to: MISUSE_CONFIRMED
        trigger: "POST /audit-cases/{id}/close (when misuse_amount_cents > 0)"
        actor: ComplianceAuditor
        preconditions: []
        side_effects:
          - "Client.status ACTIVE -> SUSPENDED (link 1 of misuse cascade)"
          - "Client suspension cascades: every OPEN TrustAccount of the client -> FROZEN (link 2)"
          - "Each frozen account rejects its pending Disbursements (status IN {REQUESTED, PENDING_CONSERVATOR, APPROVED} -> REJECTED) (link 3)"

  - entity: Conservator
    initial_state: ACTIVE
    terminal_states: [DISCHARGED]
    transitions:
      - from: ACTIVE
        to: SUSPENDED
        trigger: "POST /conservators/{id}/suspend"
        actor: FiduciaryAdmin
        preconditions: []
        side_effects:
          - "Disbursements of this client in PENDING_CONSERVATOR remain PENDING_CONSERVATOR (no auto-reject); they cannot be co-approved while conservator is SUSPENDED"
      - from: SUSPENDED
        to: DISCHARGED
        trigger: "POST /conservators/{id}/discharge"
        actor: FiduciaryAdmin
        preconditions: []
        side_effects:
          - "Disbursements of this client in PENDING_CONSERVATOR -> REJECTED (authority gone)"
      - from: ACTIVE
        to: DISCHARGED
        trigger: "POST /conservators/{id}/discharge"
        actor: FiduciaryAdmin
        preconditions: []
        side_effects:
          - "Disbursements of this client in PENDING_CONSERVATOR -> REJECTED (authority gone)"

# =============================================================================
# §1.2.1 Concurrency Rules (OCC only)
# =============================================================================
concurrency_rules:
  - rule_id: budget-plan-create-stale-client
    parent_entity: Client
    write_endpoint: "POST /budget-plans"
    occ_field: "expected_client_version"
    description: |
      Creating a BudgetPlan against a Client whose version has advanced since
      the client last observed it is rejected. Creating a plan legitimately
      supersedes any existing non-SUPERSEDED plan for the same
      (client_id, period_month), so a writer holding a stale client version
      must be refused rather than allowed to supersede blindly.
    error_id: ERR_STALE_VERSION
    http_status: 412

# =============================================================================
# §1.3 Calculation Rules Table
# =============================================================================
calculations:
  - name: fiduciary_fee
    trigger: "Disbursement transition APPROVED -> RELEASED"
    algorithm: tiered_pricing
    formula: |
      # Marginal tier fee on the disbursement amount, positioned by the
      # client's month-to-date RELEASED volume BEFORE this disbursement.
      # Evaluation order (pinned): tiered raw fee first, then monthly cap.
      # Rounding (pinned): round_half_up to whole cents ONCE, per disbursement,
      # at release. Month-to-date fee total is the SUM of per-disbursement
      # rounded fees — never fee(volume_total) rounded after aggregation.
      v = SUM(amount_cents of this client's Disbursements with status IN {RELEASED, RETURNED}
              and released_at calendar month == this release's clock month)
      # v = volume strictly before this release; at release time this
      # disbursement is not yet RELEASED, so v excludes it by construction.
      # Bracket form (pinned — interval intersection, no subtraction shortcuts):
      tier1 = (min(v + amount, TIER1_LIMIT) - min(v, TIER1_LIMIT)) * TIER1_RATE
      tier2 = (min(max(v + amount, TIER1_LIMIT), TIER2_LIMIT) - min(max(v, TIER1_LIMIT), TIER2_LIMIT)) * TIER2_RATE
      tier3 = max(0, (v + amount) - TIER2_LIMIT) * TIER3_RATE
      raw = tier1 + tier2 + tier3
      accrued = SUM(fee_cents of this client's disbursements released in the same clock month)
      fee_cents = min(round_half_up(raw), max(0, MONTHLY_CAP - accrued))
    input_set: "Client's Disbursements with status IN {RELEASED, RETURNED} and released_at in the current clock month; REJECTED and never-released disbursements excluded"
    constants:
      TIER1_LIMIT: 100000
      TIER1_RATE: 0.05
      TIER2_LIMIT: 300000
      TIER2_SPAN: 200000
      TIER2_RATE: 0.03
      TIER3_RATE: 0.015
      MONTHLY_CAP: 20000
    precision: "whole cents, round_half_up applied once per disbursement at release"
    variants: []

  - name: budget_allocation
    trigger: "BudgetPlan creation (allocated_lines computed and frozen at create)"
    algorithm: weighted_scoring
    formula: |
      # Per-line rounding with residual folding — pinned order:
      # 1) each line amount = round_half_up(source_benefit_cents * percent / 100)
      # 2) residual = source_benefit_cents - SUM(line amounts)   (may be negative)
      # 3) fold residual into the HOUSING line; if no HOUSING line, into the
      #    first line in canonical order HOUSING,FOOD,CLOTHING,PERSONAL,MEDICAL,EDUCATION,SAVINGS
      # Invariant: SUM(allocated_lines.amount_cents) == total_planned_cents == source_benefit_cents
    input_set: "The plan's input lines [{category, percent}] with percents summing to exactly 100"
    constants: {}
    precision: "whole cents, round_half_up per line BEFORE residual fold"
    variants: []

  - name: spend_down_excess
    trigger: "SpendDownPlan create/activate (PROVISIONAL) and finalize (FINAL)"
    algorithm: forward_looking
    formula: |
      # PROVISIONAL (forward-looking) variant:
      #   expected_inflow = SUM(monthly_benefit_cents) over the client's
      #     BenefitEntitlements with status = VERIFIED whose half-open window
      #     [effective_start_date, effective_end_date) covers any day of target_month
      #     (null end = open-ended, covers every month >= start)
      #   provisional_excess_cents = max(0, countable_resources_cents + expected_inflow - limit)
      # FINAL (chronological, at finalize):
      #   final_excess_cents = max(0, countable_resources_cents_at_finalize - limit)
      # The two variants legitimately disagree for identical plan rows because
      # inflows/outflows land between create and finalize.
    input_set: "Client TrustAccounts status IN {OPEN, FROZEN} (countable excludes DEDICATED type); VERIFIED entitlements"
    constants: {}
    precision: "whole cents (no rounding — integer arithmetic)"
    variants:
      - name: PROVISIONAL
        when: "plan create and activate"
        difference: "adds expected_inflow (VERIFIED monthly benefits covering target_month) to current countable resources"
      - name: FINAL
        when: "plan finalize"
        difference: "uses only actual countable_resources_cents at finalize time; expected_inflow is NOT added"

  - name: report_totals
    trigger: "AccountingReport transition DRAFTING -> SUBMITTED"
    algorithm: chronological
    formula: |
      # Opening balance (both bases): replay LedgerEntry rows of every
      # TrustAccount of the client with created_at < period_start_date,
      # chronological by created_at ASC; opening_balance_cents = SUM(amount_cents).
      # CASH basis:
      #   receipts_total = SUM(amount_cents of Deposits of client's accounts
      #     with status = POSTED and posted_at date IN [period_start, period_end] (inclusive))
      #   disbursements_total = SUM(amount_cents of Disbursements of the client
      #     with status = RELEASED and released_at date IN [period_start, period_end])
      # ACCRUAL basis:
      #   receipts_total = SUM(Deposits with status IN {RECEIVED, POSTED} and
      #     received_date IN [period_start, period_end])
      #   disbursements_total = receipts analog: SUM(Disbursements with
      #     (status = RELEASED and released_at date in period) OR
      #     (status = APPROVED and scheduled_release_date in period))
      # RETURNED deposits and RETURNED disbursements are EXCLUDED from both bases
      # (they net to zero through the ledger; the report shows gross flows).
      # ending_balance = opening_balance + receipts_total - disbursements_total
    input_set: "Client's accounts' LedgerEntries; Deposits/Disbursements filtered by status and date window per basis"
    constants:
      REPORT_DUE_DAYS: 30
    precision: "whole cents (no rounding — integer arithmetic)"
    variants:
      - name: CASH
        when: "report basis = CASH (SSA-6233 filing)"
        difference: "only POSTED deposits (posted_at in period) and RELEASED disbursements (released_at in period)"
      - name: ACCRUAL
        when: "report basis = ACCRUAL (court annual accounting)"
        difference: "also includes RECEIVED-not-posted deposits (received_date in period) and APPROVED-not-released disbursements (scheduled_release_date in period)"

  - name: bond_utilization
    trigger: "Derived read on SuretyBond (funds_under_management_cents recomputed on every balance-affecting mutation)"
    algorithm: aggregation
    formula: |
      funds_under_management_cents = SUM(balance_cents over ALL TrustAccount rows
        org-wide with status IN {OPEN, FROZEN})   # CLOSED accounts excluded
      utilization_bps = floor(funds_under_management_cents * 10000 / coverage_amount_cents)
    input_set: "All TrustAccount rows with status IN {OPEN, FROZEN}; CLOSED excluded"
    constants: {}
    precision: "utilization_bps integer floor division"
    variants: []

# =============================================================================
# §1.4 Validation Rules Table (ordered by priority)
# =============================================================================
validations:
  - { priority: 1, category: auth, check: "X-User-Role and X-User-ID headers present and role is a declared role", error_id: ERR_UNAUTHENTICATED, http_status: 401, applies_to: "all" }
  - { priority: 2, category: auth, check: "X-User-Role is in the endpoint's roles list (RBAC)", error_id: ERR_FORBIDDEN, http_status: 403, applies_to: "all" }
  - { priority: 3, category: business_constraint, check: "Request body shape: required fields present, enum values valid, integer constraints (>0, >=0) hold, ssn_last4 is 4 digits, budget percents sum to exactly 100 and categories unique, date strings ISO", error_id: ERR_INVALID_REQUEST, http_status: 400, applies_to: "all POST endpoints" }
  - { priority: 4, category: existence, check: "Every path id and body FK reference exists (validated left-to-right: path ids first, then body references in declared field order)", error_id: ERR_CLIENT_NOT_FOUND, http_status: 404, applies_to: "all endpoints with {id} or FK body fields — resource-specific ids per §1.6" }
  - { priority: 5, category: state, check: "Entity-specific existence variant for each resource (ERR_ENTITLEMENT_NOT_FOUND, ERR_ACCOUNT_NOT_FOUND, ERR_PLAN_NOT_FOUND, ERR_DISBURSEMENT_NOT_FOUND, ERR_DEPOSIT_NOT_FOUND, ERR_COURT_ORDER_NOT_FOUND, ERR_BOND_NOT_FOUND, ERR_REPORT_NOT_FOUND, ERR_SPEND_DOWN_NOT_FOUND, ERR_AUDIT_NOT_FOUND, ERR_CONSERVATOR_NOT_FOUND)", error_id: ERR_ENTITLEMENT_NOT_FOUND, http_status: 404, applies_to: "resource-scoped endpoints" }
  - { priority: 6, category: state, check: "Target entity's state machine permits the requested transition from its current state", error_id: ERR_INVALID_STATE, http_status: 409, applies_to: "all action endpoints" }
  - { priority: 7, category: state, check: "Target entity is not in a terminal state (TERMINATED client/entitlement, CLOSED account, SUPERSEDED plan, REJECTED/RETURNED disbursement, ACCEPTED/REJECTED report, MET/LAPSED plan, DISCHARGED conservator, EXECUTED/EXPIRED order, LAPSED bond, CLOSED_NO_ACTION/MISUSE_CONFIRMED audit)", error_id: ERR_ALREADY_TERMINAL, http_status: 409, applies_to: "all action endpoints" }
  - { priority: 8, category: state, check: "Operations on a client's funds require Client.status IN {ACTIVE, SUSPENDED} unless the endpoint is a client-lifecycle endpoint; deposit/disbursement creation and report submit require non-TERMINATED, report submit requires IN {ACTIVE, SUSPENDED}", error_id: ERR_CLIENT_NOT_ACTIVE, http_status: 409, applies_to: "POST /disbursements, POST /deposits, POST /accounting-reports/{id}/submit, POST /budget-plans, POST /spend-down-plans" }
  - { priority: 9, category: business_safety, check: "Disbursement on RESTRICTED account: court_order_id must be present at creation", error_id: ERR_COURT_ORDER_REQUIRED, http_status: 422, applies_to: "POST /disbursements" }
  - { priority: 10, category: business_safety, check: "Segregation of duties: disbursement approve X-User-ID != requested_by_user_id; budget approve X-User-ID != created_by_user_id", error_id: ERR_SEGREGATION_OF_DUTIES, http_status: 403, applies_to: "POST /disbursements/{id}/approve, POST /budget-plans/{id}/approve" }
  - { priority: 11, category: business_safety, check: "Co-approving conservator is ACTIVE and belongs to the disbursement's client", error_id: ERR_CONSERVATOR_NOT_ACTIVE, http_status: 422, applies_to: "POST /disbursements/{id}/co-approve" }
  - { priority: 12, category: business_safety, check: "Court order on restricted release: status = GRANTED, client matches, type RESTRICTED_WITHDRAWAL, clock date <= expiry_date", error_id: ERR_COURT_ORDER_NOT_GRANTABLE, http_status: 422, applies_to: "POST /disbursements/{id}/release" }
  - { priority: 13, category: business_safety, check: "Court order amount cap: disbursement amount_cents <= order.amount_limit_cents", error_id: ERR_COURT_ORDER_EXCEEDED, http_status: 422, applies_to: "POST /disbursements/{id}/release" }
  - { priority: 14, category: business_safety, check: "DEDICATED account disbursements limited to categories MEDICAL and EDUCATION", error_id: ERR_DEDICATED_ACCOUNT_RESTRICTED, http_status: 422, applies_to: "POST /disbursements, POST /disbursements/{id}/release" }
  - { priority: 15, category: business_temporal, check: "Entitlement half-open windows [effective_start_date, effective_end_date) for the same (client_id, claim_type) among non-TERMINATED entitlements must not overlap; adjacency (end == next start) is allowed", error_id: ERR_ENTITLEMENT_OVERLAP, http_status: 409, applies_to: "POST /benefit-entitlements" }
  - { priority: 16, category: business_temporal, check: "Report periods per (client_id, report_type) over reports with status IN {SUBMITTED, ACCEPTED}: new period must satisfy period_start_date == previous period_end_date + 1 day; overlap rejected", error_id: ERR_REPORT_PERIOD_OVERLAP, http_status: 409, applies_to: "POST /accounting-reports" }
  - { priority: 17, category: business_temporal, check: "Report contiguity: gap between previous period_end_date + 1 and new period_start_date rejected (only when a prior SUBMITTED/ACCEPTED report exists)", error_id: ERR_REPORT_PERIOD_GAP, http_status: 409, applies_to: "POST /accounting-reports" }
  - { priority: 18, category: business_temporal, check: "Bond activation window [coverage_start_date, coverage_end_date) must not overlap any other ACTIVE bond window; adjacency allowed; PENDING bonds never block", error_id: ERR_BOND_WINDOW_CONFLICT, http_status: 409, applies_to: "POST /surety-bonds/{id}/activate" }
  - { priority: 19, category: business_temporal, check: "Report submit: current logical clock date <= due_date (period_end_date + 30 days)", error_id: ERR_REPORT_OVERDUE, http_status: 422, applies_to: "POST /accounting-reports/{id}/submit" }
  - { priority: 20, category: business_temporal, check: "Disbursement release: BudgetPlan.period_month == calendar month of current logical clock", error_id: ERR_PLAN_PERIOD_MISMATCH, http_status: 422, applies_to: "POST /disbursements/{id}/release" }
  - { priority: 21, category: state, check: "Disbursement release: referenced BudgetPlan.status == APPROVED (cross-entity state gate)", error_id: ERR_PLAN_NOT_APPROVED, http_status: 409, applies_to: "POST /disbursements/{id}/release" }
  - { priority: 22, category: business_referential, check: "Disbursement FK coherence: account_id belongs to client_id; budget_plan_id belongs to client_id; court_order_id (when present) belongs to client_id; spend_down_plan_id (when present) belongs to client_id", error_id: ERR_BUDGET_PLAN_MISMATCH, http_status: 422, applies_to: "POST /disbursements" }
  - { priority: 23, category: business_referential, check: "Deposit entitlement coherence: entitlement_id (when present) belongs to the deposit account's client", error_id: ERR_ENTITLEMENT_ACCOUNT_MISMATCH, http_status: 422, applies_to: "POST /deposits, POST /deposits/{id}/post" }
  - { priority: 24, category: business_fiscal, check: "Disbursement release: account.balance_cents >= amount_cents", error_id: ERR_INSUFFICIENT_FUNDS, http_status: 422, applies_to: "POST /disbursements/{id}/release" }
  - { priority: 25, category: business_fiscal, check: "Disbursement release: budget category remaining (allocated minus released-non-returned for same plan+category) >= amount_cents", error_id: ERR_BUDGET_CATEGORY_EXCEEDED, http_status: 422, applies_to: "POST /disbursements/{id}/release" }
  - { priority: 26, category: business_fiscal, check: "Deposit post: org funds under management after post <= ACTIVE bond coverage_amount_cents (only when an ACTIVE bond exists)", error_id: ERR_BOND_COVERAGE_EXCEEDED, http_status: 422, applies_to: "POST /deposits/{id}/post" }
  - { priority: 27, category: business_fiscal, check: "Account close: balance_cents == 0", error_id: ERR_ACCOUNT_NOT_ZERO, http_status: 422, applies_to: "POST /trust-accounts/{id}/close" }
  - { priority: 28, category: business_fiscal, check: "Account close: no disbursements in {REQUESTED, PENDING_CONSERVATOR, APPROVED} on this account", error_id: ERR_PENDING_DISBURSEMENTS, http_status: 422, applies_to: "POST /trust-accounts/{id}/close" }
  - { priority: 29, category: business_constraint, check: "Spend-down activate: provisional_excess_cents > 0", error_id: ERR_SPEND_DOWN_NOT_REQUIRED, http_status: 422, applies_to: "POST /spend-down-plans/{id}/activate" }
  - { priority: 30, category: business_constraint, check: "Client activate: at least one VERIFIED entitlement exists for the client", error_id: ERR_NO_VERIFIED_ENTITLEMENT, http_status: 409, applies_to: "POST /clients/{id}/activate" }
  - { priority: 31, category: business_constraint, check: "Disbursement release: an ACTIVE SuretyBond exists", error_id: ERR_NO_ACTIVE_BOND, http_status: 409, applies_to: "POST /disbursements/{id}/release" }
  - { priority: 32, category: business_constraint, check: "Uniqueness: TrustAccount.bank_account_ref globally unique; Conservator.court_case_number globally unique", error_id: ERR_DUPLICATE_UNIQUE_FIELD, http_status: 409, applies_to: "POST /trust-accounts, POST /conservators" }

# =============================================================================
# §1.5 API Endpoint Table (flat: all collections at root)
# =============================================================================
endpoints:
  - { method: POST, path: "/clients", description: "Create client in INTAKE_REVIEW", roles: [FiduciaryAdmin], code: 201, input: [legal_name, date_of_birth, ssn_last4, county_of_residence, medicaid_enrolled, "medicaid_resource_limit_cents?"], output: Client, side_effects: [] }
  - { method: GET, path: "/clients", description: "List clients with filters", roles: [FiduciaryAdmin, CaseManager, FinancialOfficer, ConservatorOfficer, ComplianceAuditor], code: 200, input: ["status?", "medicaid_enrolled?", "limit?", "offset?"], output: "Client[]", side_effects: [] }
  - { method: GET, path: "/clients/{id}", description: "Get one client including computed total_funds_cents, countable_resources_cents, medicaid_at_risk", roles: [FiduciaryAdmin, CaseManager, FinancialOfficer, ConservatorOfficer, ComplianceAuditor], code: 200, input: [], output: Client, side_effects: [] }
  - { method: POST, path: "/clients/{id}/activate", description: "INTAKE_REVIEW or SUSPENDED -> ACTIVE; requires a VERIFIED entitlement; unfreezes accounts", roles: [FiduciaryAdmin], code: 200, input: [], output: Client, side_effects: ["frozen TrustAccounts -> OPEN", "increments Client.version by 1"] }
  - { method: POST, path: "/clients/{id}/suspend", description: "ACTIVE -> SUSPENDED; freezes accounts, which rejects pending disbursements", roles: [FiduciaryAdmin], code: 200, input: [], output: Client, side_effects: ["OPEN TrustAccounts -> FROZEN", "pending Disbursements -> REJECTED", "increments Client.version by 1"] }
  - { method: POST, path: "/clients/{id}/terminate", description: "ACTIVE/SUSPENDED -> TERMINATED; full cascade (accounts frozen, entitlements terminated, plans superseded, spend-downs lapsed)", roles: [FiduciaryAdmin], code: 200, input: [], output: Client, side_effects: ["accounts -> FROZEN then pending disbursements -> REJECTED", "entitlements -> TERMINATED", "budget plans -> SUPERSEDED", "spend-down plans -> LAPSED", "increments Client.version by 1"] }

  - { method: POST, path: "/benefit-entitlements", description: "Create entitlement in PENDING_VERIFICATION; half-open overlap check per (client_id, claim_type)", roles: [FiduciaryAdmin], code: 201, input: [client_id, claim_type, monthly_benefit_cents, effective_start_date, "effective_end_date?"], output: BenefitEntitlement, side_effects: [] }
  - { method: GET, path: "/benefit-entitlements", description: "List entitlements", roles: [FiduciaryAdmin, CaseManager, FinancialOfficer, ConservatorOfficer, ComplianceAuditor], code: 200, input: ["client_id?", "claim_type?", "status?", "limit?", "offset?"], output: "BenefitEntitlement[]", side_effects: [] }
  - { method: GET, path: "/benefit-entitlements/{id}", description: "Get one entitlement", roles: [FiduciaryAdmin, CaseManager, FinancialOfficer, ConservatorOfficer, ComplianceAuditor], code: 200, input: [], output: BenefitEntitlement, side_effects: [] }
  - { method: POST, path: "/benefit-entitlements/{id}/verify", description: "PENDING_VERIFICATION -> VERIFIED", roles: [FiduciaryAdmin], code: 200, input: [], output: BenefitEntitlement, side_effects: ["verified_at set"] }
  - { method: POST, path: "/benefit-entitlements/{id}/terminate", description: "VERIFIED -> TERMINATED", roles: [FiduciaryAdmin], code: 200, input: [], output: BenefitEntitlement, side_effects: [] }

  - { method: POST, path: "/trust-accounts", description: "Open a managed account (OPERATING | RESTRICTED | DEDICATED)", roles: [FinancialOfficer], code: 201, input: [client_id, account_type, bank_account_ref], output: TrustAccount, side_effects: [] }
  - { method: GET, path: "/trust-accounts", description: "List accounts", roles: [FiduciaryAdmin, CaseManager, FinancialOfficer, ConservatorOfficer, ComplianceAuditor], code: 200, input: ["client_id?", "account_type?", "status?", "limit?", "offset?"], output: "TrustAccount[]", side_effects: [] }
  - { method: GET, path: "/trust-accounts/{id}", description: "Get one account including computed balance_cents", roles: [FiduciaryAdmin, CaseManager, FinancialOfficer, ConservatorOfficer, ComplianceAuditor], code: 200, input: [], output: TrustAccount, side_effects: [] }
  - { method: POST, path: "/trust-accounts/{id}/close", description: "OPEN -> CLOSED; requires zero balance and no pending disbursements", roles: [FinancialOfficer], code: 200, input: [], output: TrustAccount, side_effects: [] }
  - { method: GET, path: "/trust-accounts/{id}/ledger", description: "Append-only ledger entries for the account, chronological (created_at ASC)", roles: [FiduciaryAdmin, CaseManager, FinancialOfficer, ConservatorOfficer, ComplianceAuditor], code: 200, input: ["entry_type?", "limit?", "offset?"], output: "LedgerEntry[]", side_effects: [] }

  - { method: POST, path: "/budget-plans", description: "Create plan in DRAFT for (client_id, period_month); supersedes existing non-SUPERSEDED plan for that pair; OCC-guarded on Client.version", roles: [CaseManager], code: 201, input: [client_id, period_month, source_benefit_cents, lines, expected_client_version], output: BudgetPlan, side_effects: ["prior non-SUPERSEDED BudgetPlan for (client_id, period_month) -> SUPERSEDED with superseded_by_plan_id = new id", "allocated_lines computed per budget_allocation", "increments Client.version by 1"] }
  - { method: GET, path: "/budget-plans", description: "List budget plans", roles: [FiduciaryAdmin, CaseManager, FinancialOfficer, ConservatorOfficer, ComplianceAuditor], code: 200, input: ["client_id?", "period_month?", "status?", "superseded_by_plan_id?", "limit?", "offset?"], output: "BudgetPlan[]", side_effects: [] }
  - { method: GET, path: "/budget-plans/{id}", description: "Get one plan including computed allocated_lines and total_planned_cents", roles: [FiduciaryAdmin, CaseManager, FinancialOfficer, ConservatorOfficer, ComplianceAuditor], code: 200, input: [], output: BudgetPlan, side_effects: [] }
  - { method: POST, path: "/budget-plans/{id}/propose", description: "DRAFT -> PROPOSED", roles: [CaseManager], code: 200, input: [], output: BudgetPlan, side_effects: [] }
  - { method: POST, path: "/budget-plans/{id}/approve", description: "PROPOSED -> APPROVED; SoD: approver != created_by_user_id", roles: [FinancialOfficer], code: 200, input: [], output: BudgetPlan, side_effects: [] }
  - { method: POST, path: "/budget-plans/{id}/revise", description: "APPROVED -> DRAFT (revision loop)", roles: [CaseManager], code: 200, input: [], output: BudgetPlan, side_effects: [] }
  - { method: POST, path: "/budget-plans/{id}/rebalance", description: "Move amount_cents between two allocated lines; conserves total_planned_cents; allowed in DRAFT and APPROVED", roles: [CaseManager], code: 200, input: [from_category, to_category, amount_cents], output: BudgetPlan, side_effects: ["from line -= amount, to line += amount; total_planned_cents unchanged; increments BudgetPlan.version by 1"] }

  - { method: POST, path: "/disbursements", description: "Request a payment; RESTRICTED accounts require court_order_id here; DEDICATED accounts restrict category", roles: [CaseManager], code: 201, input: [client_id, account_id, budget_plan_id, payee_name, category, amount_cents, scheduled_release_date, "court_order_id?", "spend_down_plan_id?"], output: Disbursement, side_effects: ["requested_by_user_id = X-User-ID"] }
  - { method: GET, path: "/disbursements", description: "List disbursements", roles: [FiduciaryAdmin, CaseManager, FinancialOfficer, ConservatorOfficer, ComplianceAuditor], code: 200, input: ["client_id?", "account_id?", "budget_plan_id?", "court_order_id?", "spend_down_plan_id?", "co_approved_by_conservator_id?", "status?", "category?", "limit?", "offset?"], output: "Disbursement[]", side_effects: [] }
  - { method: GET, path: "/disbursements/{id}", description: "Get one disbursement including computed fee_cents", roles: [FiduciaryAdmin, CaseManager, FinancialOfficer, ConservatorOfficer, ComplianceAuditor], code: 200, input: [], output: Disbursement, side_effects: [] }
  - { method: POST, path: "/disbursements/{id}/approve", description: "REQUESTED -> APPROVED, or -> PENDING_CONSERVATOR when conservator co-approval required; SoD enforced", roles: [FinancialOfficer], code: 200, input: [], output: Disbursement, side_effects: ["approved_by_user_id set"] }
  - { method: POST, path: "/disbursements/{id}/co-approve", description: "PENDING_CONSERVATOR -> APPROVED by the client's ACTIVE Conservator (X-User-ID = Conservator.id)", roles: [ConservatorOfficer], code: 200, input: [], output: Disbursement, side_effects: ["co_approved_by_conservator_id set"] }
  - { method: POST, path: "/disbursements/{id}/reject", description: "REQUESTED or PENDING_CONSERVATOR -> REJECTED", roles: [FinancialOfficer], code: 200, input: [], output: Disbursement, side_effects: [] }
  - { method: POST, path: "/disbursements/{id}/release", description: "APPROVED -> RELEASED; bond/funds/budget/court-order gates; writes ledger; computes fee_cents; consumes court order on restricted accounts", roles: [FinancialOfficer], code: 200, input: [], output: Disbursement, side_effects: ["LedgerEntry DISBURSEMENT_RELEASED", "account balance, client funds/resources, bond FUM recomputed", "CourtOrder -> EXECUTED when restricted", "increments Disbursement.version by 1"] }
  - { method: POST, path: "/disbursements/{id}/return", description: "RELEASED -> RETURNED; compensating ledger credit", roles: [FinancialOfficer], code: 200, input: [], output: Disbursement, side_effects: ["LedgerEntry DISBURSEMENT_RETURNED (+amount)", "balances recomputed", "increments Disbursement.version by 1"] }

  - { method: POST, path: "/deposits", description: "Record inbound funds in RECEIVED", roles: [FinancialOfficer], code: 201, input: [account_id, source, amount_cents, received_date, "entitlement_id?"], output: Deposit, side_effects: [] }
  - { method: GET, path: "/deposits", description: "List deposits", roles: [FiduciaryAdmin, CaseManager, FinancialOfficer, ConservatorOfficer, ComplianceAuditor], code: 200, input: ["account_id?", "entitlement_id?", "source?", "status?", "limit?", "offset?"], output: "Deposit[]", side_effects: [] }
  - { method: GET, path: "/deposits/{id}", description: "Get one deposit", roles: [FiduciaryAdmin, CaseManager, FinancialOfficer, ConservatorOfficer, ComplianceAuditor], code: 200, input: [], output: Deposit, side_effects: [] }
  - { method: POST, path: "/deposits/{id}/post", description: "RECEIVED -> POSTED; bond coverage gate; resource cascade (balance -> client resources -> auto spend-down draft)", roles: [FinancialOfficer], code: 200, input: [], output: Deposit, side_effects: ["LedgerEntry DEPOSIT_POSTED", "account balance, client funds/resources, bond FUM recomputed", "auto-create DRAFT SpendDownPlan when countable resources cross above limit", "increments Deposit.version by 1"] }
  - { method: POST, path: "/deposits/{id}/return", description: "POSTED -> RETURNED; compensating ledger debit", roles: [FinancialOfficer], code: 200, input: [], output: Deposit, side_effects: ["LedgerEntry DEPOSIT_RETURNED (-amount)", "balances recomputed", "increments Deposit.version by 1"] }

  - { method: POST, path: "/court-orders", description: "Petition a court order", roles: [FiduciaryAdmin], code: 201, input: [client_id, order_type, "amount_limit_cents?", petitioned_date, expiry_date], output: CourtOrder, side_effects: [] }
  - { method: GET, path: "/court-orders", description: "List court orders", roles: [FiduciaryAdmin, CaseManager, FinancialOfficer, ConservatorOfficer, ComplianceAuditor], code: 200, input: ["client_id?", "order_type?", "status?", "executed_disbursement_id?", "limit?", "offset?"], output: "CourtOrder[]", side_effects: [] }
  - { method: GET, path: "/court-orders/{id}", description: "Get one court order", roles: [FiduciaryAdmin, CaseManager, FinancialOfficer, ConservatorOfficer, ComplianceAuditor], code: 200, input: [], output: CourtOrder, side_effects: [] }
  - { method: POST, path: "/court-orders/{id}/grant", description: "PETITIONED -> GRANTED; granted_date = clock date", roles: [FiduciaryAdmin], code: 200, input: [], output: CourtOrder, side_effects: [] }

  - { method: POST, path: "/surety-bonds", description: "Register a surety bond in PENDING", roles: [FiduciaryAdmin], code: 201, input: [coverage_amount_cents, coverage_start_date, coverage_end_date, premium_paid_through_date], output: SuretyBond, side_effects: [] }
  - { method: GET, path: "/surety-bonds", description: "List bonds including computed funds_under_management_cents and utilization_bps", roles: [FiduciaryAdmin, CaseManager, FinancialOfficer, ConservatorOfficer, ComplianceAuditor], code: 200, input: ["status?", "limit?", "offset?"], output: "SuretyBond[]", side_effects: [] }
  - { method: GET, path: "/surety-bonds/{id}", description: "Get one bond with computed utilization", roles: [FiduciaryAdmin, CaseManager, FinancialOfficer, ConservatorOfficer, ComplianceAuditor], code: 200, input: [], output: SuretyBond, side_effects: [] }
  - { method: POST, path: "/surety-bonds/{id}/activate", description: "PENDING -> ACTIVE; no overlapping PENDING/ACTIVE bond window (half-open, adjacency allowed)", roles: [FiduciaryAdmin], code: 200, input: [], output: SuretyBond, side_effects: [] }

  - { method: POST, path: "/accounting-reports", description: "Create report in DRAFTING; closed-interval contiguity per (client_id, report_type) over SUBMITTED/ACCEPTED reports (adjacency required, gaps and overlaps rejected)", roles: [CaseManager], code: 201, input: [client_id, report_type, period_start_date, period_end_date, basis], output: AccountingReport, side_effects: ["due_date computed = period_end_date + 30 days"] }
  - { method: GET, path: "/accounting-reports", description: "List reports", roles: [FiduciaryAdmin, CaseManager, FinancialOfficer, ConservatorOfficer, ComplianceAuditor], code: 200, input: ["client_id?", "report_type?", "status?", "limit?", "offset?"], output: "AccountingReport[]", side_effects: [] }
  - { method: GET, path: "/accounting-reports/{id}", description: "Get one report", roles: [FiduciaryAdmin, CaseManager, FinancialOfficer, ConservatorOfficer, ComplianceAuditor], code: 200, input: [], output: AccountingReport, side_effects: [] }
  - { method: POST, path: "/accounting-reports/{id}/submit", description: "DRAFTING -> SUBMITTED; computes totals per basis variant; client must be ACTIVE or SUSPENDED; not overdue", roles: [FinancialOfficer], code: 200, input: [], output: AccountingReport, side_effects: ["receipts_total_cents, disbursements_total_cents, opening_balance_cents, ending_balance_cents computed", "submitted_at set"] }
  - { method: POST, path: "/accounting-reports/{id}/accept", description: "SUBMITTED -> ACCEPTED", roles: [ComplianceAuditor], code: 200, input: [], output: AccountingReport, side_effects: [] }
  - { method: POST, path: "/accounting-reports/{id}/reject", description: "SUBMITTED -> REJECTED; REJECTED reports stop counting for contiguity", roles: [ComplianceAuditor], code: 200, input: [], output: AccountingReport, side_effects: [] }

  - { method: POST, path: "/spend-down-plans", description: "Create Medicaid spend-down plan in DRAFT; client must be medicaid_enrolled", roles: [CaseManager], code: 201, input: [client_id, target_month, entries], output: SpendDownPlan, side_effects: ["provisional_excess_cents computed per spend_down_excess PROVISIONAL"] }
  - { method: GET, path: "/spend-down-plans", description: "List spend-down plans", roles: [FiduciaryAdmin, CaseManager, FinancialOfficer, ConservatorOfficer, ComplianceAuditor], code: 200, input: ["client_id?", "target_month?", "status?", "limit?", "offset?"], output: "SpendDownPlan[]", side_effects: [] }
  - { method: GET, path: "/spend-down-plans/{id}", description: "Get one plan", roles: [FiduciaryAdmin, CaseManager, FinancialOfficer, ConservatorOfficer, ComplianceAuditor], code: 200, input: [], output: SpendDownPlan, side_effects: [] }
  - { method: POST, path: "/spend-down-plans/{id}/activate", description: "DRAFT -> ACTIVE; requires provisional_excess_cents > 0", roles: [CaseManager], code: 200, input: [], output: SpendDownPlan, side_effects: [] }
  - { method: POST, path: "/spend-down-plans/{id}/finalize", description: "ACTIVE -> MET (final_excess == 0) or LAPSED (final_excess > 0); computes FINAL variant", roles: [CaseManager], code: 200, input: [], output: SpendDownPlan, side_effects: ["final_excess_cents computed per spend_down_excess FINAL"] }

  - { method: POST, path: "/audit-cases", description: "Open an audit", roles: [ComplianceAuditor], code: 201, input: [client_id, authority, scope, period_start_date, period_end_date], output: AuditCase, side_effects: [] }
  - { method: GET, path: "/audit-cases", description: "List audits", roles: [FiduciaryAdmin, CaseManager, FinancialOfficer, ConservatorOfficer, ComplianceAuditor], code: 200, input: ["client_id?", "authority?", "status?", "limit?", "offset?"], output: "AuditCase[]", side_effects: [] }
  - { method: GET, path: "/audit-cases/{id}", description: "Get one audit", roles: [FiduciaryAdmin, CaseManager, FinancialOfficer, ConservatorOfficer, ComplianceAuditor], code: 200, input: [], output: AuditCase, side_effects: [] }
  - { method: POST, path: "/audit-cases/{id}/issue-findings", description: "OPENED -> FINDINGS_ISSUED; records misuse_amount_cents and findings_count", roles: [ComplianceAuditor], code: 200, input: [misuse_amount_cents, findings_count], output: AuditCase, side_effects: [] }
  - { method: POST, path: "/audit-cases/{id}/close", description: "FINDINGS_ISSUED -> CLOSED_NO_ACTION (misuse == 0) or MISUSE_CONFIRMED (misuse > 0); misuse cascade suspends client, freezes accounts, rejects pending disbursements", roles: [ComplianceAuditor], code: 200, input: [], output: AuditCase, side_effects: ["misuse cascade per AuditCase machine when misuse_amount_cents > 0"] }

  - { method: POST, path: "/conservators", description: "Register a court conservator in ACTIVE", roles: [FiduciaryAdmin], code: 201, input: [client_id, full_name, court_case_number, authority_scope, appointed_date], output: Conservator, side_effects: [] }
  - { method: GET, path: "/conservators", description: "List conservators", roles: [FiduciaryAdmin, CaseManager, FinancialOfficer, ConservatorOfficer, ComplianceAuditor], code: 200, input: ["client_id?", "authority_scope?", "status?", "limit?", "offset?"], output: "Conservator[]", side_effects: [] }
  - { method: GET, path: "/conservators/{id}", description: "Get one conservator", roles: [FiduciaryAdmin, CaseManager, FinancialOfficer, ConservatorOfficer, ComplianceAuditor], code: 200, input: [], output: Conservator, side_effects: [] }
  - { method: POST, path: "/conservators/{id}/suspend", description: "ACTIVE -> SUSPENDED", roles: [FiduciaryAdmin], code: 200, input: [], output: Conservator, side_effects: [] }
  - { method: POST, path: "/conservators/{id}/discharge", description: "ACTIVE or SUSPENDED -> DISCHARGED; rejects client's PENDING_CONSERVATOR disbursements", roles: [FiduciaryAdmin], code: 200, input: [], output: Conservator, side_effects: ["client's PENDING_CONSERVATOR disbursements -> REJECTED"] }

  - { method: POST, path: "/_clock/set_current_utc", description: "Set the logical clock (test-driving endpoint). Startup default is exactly 2026-05-01T00:00:00Z when this endpoint has never been called; the logical clock MUST NOT fall back to wall-clock time. Advancing the clock evaluates CourtOrder expiry (PETITIONED/GRANTED -> EXPIRED when clock date > expiry_date) and SuretyBond lapse (ACTIVE -> LAPSED when clock date >= coverage_end_date or premium_paid_through_date < clock date).", roles: [FiduciaryAdmin], code: 200, input: [to_iso8601], output: "{ current_utc: string }", side_effects: ["CourtOrder auto-expiry", "SuretyBond auto-lapse"] }

# =============================================================================
# §1.6 Error Code Catalog
# =============================================================================
errors:
  - { id: ERR_UNAUTHENTICATED, http: 401, condition: "Missing/invalid X-User-Role or X-User-ID headers" }
  - { id: ERR_FORBIDDEN, http: 403, condition: "Role not permitted for this endpoint" }
  - { id: ERR_INVALID_REQUEST, http: 400, condition: "Missing required field, invalid enum, constraint violation (amount <= 0, percents != 100, bad date format, duplicate category in plan lines)" }
  - { id: ERR_CLIENT_NOT_FOUND, http: 404, condition: "client_id or client path id does not exist" }
  - { id: ERR_ENTITLEMENT_NOT_FOUND, http: 404, condition: "entitlement id does not exist" }
  - { id: ERR_ACCOUNT_NOT_FOUND, http: 404, condition: "account id does not exist" }
  - { id: ERR_PLAN_NOT_FOUND, http: 404, condition: "budget plan id does not exist" }
  - { id: ERR_DISBURSEMENT_NOT_FOUND, http: 404, condition: "disbursement id does not exist" }
  - { id: ERR_DEPOSIT_NOT_FOUND, http: 404, condition: "deposit id does not exist" }
  - { id: ERR_COURT_ORDER_NOT_FOUND, http: 404, condition: "court order id does not exist" }
  - { id: ERR_BOND_NOT_FOUND, http: 404, condition: "surety bond id does not exist" }
  - { id: ERR_REPORT_NOT_FOUND, http: 404, condition: "accounting report id does not exist" }
  - { id: ERR_SPEND_DOWN_NOT_FOUND, http: 404, condition: "spend-down plan id does not exist" }
  - { id: ERR_AUDIT_NOT_FOUND, http: 404, condition: "audit case id does not exist" }
  - { id: ERR_CONSERVATOR_NOT_FOUND, http: 404, condition: "conservator id does not exist" }
  - { id: ERR_INVALID_STATE, http: 409, condition: "State machine does not permit the requested transition from the entity's current state" }
  - { id: ERR_ALREADY_TERMINAL, http: 409, condition: "Entity is in a terminal state; no further transitions" }
  - { id: ERR_CLIENT_NOT_ACTIVE, http: 409, condition: "Operation requires Client.status in the allowed set for that endpoint and client is TERMINATED (or INTAKE_REVIEW where ACTIVE required)" }
  - { id: ERR_NO_VERIFIED_ENTITLEMENT, http: 409, condition: "Client activation without any VERIFIED BenefitEntitlement" }
  - { id: ERR_ACCOUNT_NOT_OPEN, http: 409, condition: "Fund movement requires TrustAccount.status = OPEN" }
  - { id: ERR_COURT_ORDER_REQUIRED, http: 422, condition: "Disbursement from RESTRICTED account created without court_order_id" }
  - { id: ERR_COURT_ORDER_NOT_GRANTABLE, http: 422, condition: "Court order on restricted release is not GRANTED, wrong client, wrong type, or expired" }
  - { id: ERR_COURT_ORDER_EXCEEDED, http: 422, condition: "Disbursement amount exceeds court order amount_limit_cents" }
  - { id: ERR_SEGREGATION_OF_DUTIES, http: 403, condition: "Approver X-User-ID equals the requester/creator X-User-ID (disbursement approve, budget approve)" }
  - { id: ERR_CONSERVATOR_NOT_ACTIVE, http: 422, condition: "Co-approving X-User-ID is not an ACTIVE Conservator of the disbursement's client" }
  - { id: ERR_DEDICATED_ACCOUNT_RESTRICTED, http: 422, condition: "DEDICATED account disbursement category not in {MEDICAL, EDUCATION}" }
  - { id: ERR_ENTITLEMENT_OVERLAP, http: 409, condition: "Half-open effective window overlaps another non-TERMINATED entitlement for same (client_id, claim_type)" }
  - { id: ERR_REPORT_PERIOD_OVERLAP, http: 409, condition: "Report period overlaps an existing SUBMITTED/ACCEPTED report for same (client_id, report_type)" }
  - { id: ERR_REPORT_PERIOD_GAP, http: 409, condition: "Report period_start_date != previous SUBMITTED/ACCEPTED report's period_end_date + 1 day" }
  - { id: ERR_REPORT_OVERDUE, http: 422, condition: "Submit after due_date (period_end_date + 30 days)" }
  - { id: ERR_BOND_WINDOW_CONFLICT, http: 409, condition: "Bond activation window overlaps another PENDING/ACTIVE bond window" }
  - { id: ERR_PLAN_PERIOD_MISMATCH, http: 422, condition: "Release when BudgetPlan.period_month != current clock month" }
  - { id: ERR_BUDGET_PLAN_MISMATCH, http: 422, condition: "Disbursement FK coherence failure: account/plan/court-order/spend-down belongs to a different client than client_id" }
  - { id: ERR_PLAN_NOT_APPROVED, http: 409, condition: "Disbursement release when the referenced BudgetPlan is not APPROVED" }
  - { id: ERR_ENTITLEMENT_ACCOUNT_MISMATCH, http: 422, condition: "Deposit entitlement_id belongs to a different client than the deposit account" }
  - { id: ERR_INSUFFICIENT_FUNDS, http: 422, condition: "Release amount exceeds account balance_cents" }
  - { id: ERR_BUDGET_CATEGORY_EXCEEDED, http: 422, condition: "Release would exceed the plan's remaining allocated amount for the category" }
  - { id: ERR_BOND_COVERAGE_EXCEEDED, http: 422, condition: "Deposit post would push org funds under management above ACTIVE bond coverage" }
  - { id: ERR_ACCOUNT_NOT_ZERO, http: 422, condition: "Account close with balance_cents != 0" }
  - { id: ERR_PENDING_DISBURSEMENTS, http: 422, condition: "Account close with disbursements in REQUESTED/PENDING_CONSERVATOR/APPROVED" }
  - { id: ERR_SPEND_DOWN_NOT_REQUIRED, http: 422, condition: "Spend-down activate with provisional_excess_cents == 0" }
  - { id: ERR_NO_ACTIVE_BOND, http: 409, condition: "Disbursement release with no ACTIVE SuretyBond" }
  - { id: ERR_DUPLICATE_UNIQUE_FIELD, http: 409, condition: "bank_account_ref or court_case_number already in use" }
  - { id: ERR_STALE_VERSION, http: 412, condition: "expected_client_version does not match the Client's current version (OCC)" }

# =============================================================================
# §1.7 RBAC Matrix
# =============================================================================
roles:
  - name: FiduciaryAdmin
    description: "Org administrator: client intake/lifecycle, entitlements, court orders, bonds, conservator registry, logical clock"
    identity: opaque
    exclusive_operations: ["POST /clients", "POST /clients/{id}/activate", "POST /clients/{id}/suspend", "POST /clients/{id}/terminate", "POST /benefit-entitlements", "POST /benefit-entitlements/{id}/verify", "POST /benefit-entitlements/{id}/terminate", "POST /court-orders", "POST /court-orders/{id}/grant", "POST /surety-bonds", "POST /surety-bonds/{id}/activate", "POST /conservators", "POST /conservators/{id}/suspend", "POST /conservators/{id}/discharge", "POST /_clock/set_current_utc"]
    shared_operations: ["all GET endpoints"]
  - name: CaseManager
    description: "Caseworker: budgets, disbursement requests, spend-down plans, report drafting"
    identity: opaque
    exclusive_operations: ["POST /budget-plans", "POST /budget-plans/{id}/propose", "POST /budget-plans/{id}/revise", "POST /budget-plans/{id}/rebalance", "POST /disbursements", "POST /accounting-reports", "POST /spend-down-plans", "POST /spend-down-plans/{id}/activate", "POST /spend-down-plans/{id}/finalize"]
    shared_operations: ["all GET endpoints"]
  - name: FinancialOfficer
    description: "Money movement: accounts, deposits, disbursement approval/release/return, budget approval, report submission"
    identity: opaque
    exclusive_operations: ["POST /trust-accounts", "POST /trust-accounts/{id}/close", "POST /deposits", "POST /deposits/{id}/post", "POST /deposits/{id}/return", "POST /disbursements/{id}/approve", "POST /disbursements/{id}/reject", "POST /disbursements/{id}/release", "POST /disbursements/{id}/return", "POST /budget-plans/{id}/approve", "POST /accounting-reports/{id}/submit"]
    shared_operations: ["all GET endpoints"]
  - name: ConservatorOfficer
    description: "Court-appointed conservator acting on coordinated clients; X-User-ID equals the Conservator entity id"
    identity: "entity_backed:Conservator"
    exclusive_operations: ["POST /disbursements/{id}/co-approve"]
    shared_operations: ["all GET endpoints"]
  - name: ComplianceAuditor
    description: "SSA/state/court audit function: audit cases and report adjudication"
    identity: opaque
    exclusive_operations: ["POST /audit-cases", "POST /audit-cases/{id}/issue-findings", "POST /audit-cases/{id}/close", "POST /accounting-reports/{id}/accept", "POST /accounting-reports/{id}/reject"]
    shared_operations: ["all GET endpoints"]
