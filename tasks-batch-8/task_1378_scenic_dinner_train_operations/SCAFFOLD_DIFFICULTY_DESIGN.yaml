            - { call: "POST /railroad/agreements/${agr}/events", payload: { event_type: "ACTIVATE" }, as: Scheduler }
            - { call: "POST /railroad/slots", payload: { agreement_id: "${agr}", service_date: "2026-10-15", start_minute: 600, end_minute: 780 }, as: Scheduler, captures: { slot_a: "$.data.id" } }
            - { call: "POST /railroad/slots", payload: { agreement_id: "${agr}", service_date: "2026-10-16", start_minute: 600, end_minute: 780 }, as: Scheduler, captures: { slot_b: "$.data.id" } }
            - { call: "POST /railroad/rolling-stock", payload: { unit_code: "LOC-1", stock_type: "LOCOMOTIVE", seat_capacity: 0, table_count: 0 }, as: Mechanic, captures: { loco: "$.data.id" } }
            - { call: "POST /railroad/rolling-stock", payload: { unit_code: "COACH-1", stock_type: "COACH_CAR", seat_capacity: 40, table_count: 0 }, as: Mechanic, captures: { coach: "$.data.id" } }
            - { call: "POST /railroad/excursions", payload: { title: "Run A", slot_id: "${slot_a}", event_type: "REGULAR", surge_multiplier_bp: 10000 }, as: Scheduler, captures: { ex_a: "$.data.id" } }
            - { call: "POST /railroad/excursions", payload: { title: "Run B", slot_id: "${slot_b}", event_type: "REGULAR", surge_multiplier_bp: 10000 }, as: Scheduler, captures: { ex_b: "$.data.id" } }
            - { call: "POST /railroad/car-assignments", payload: { excursion_id: "${ex_a}", stock_id: "${loco}", class_code: "LOCO", position: 1 }, as: Scheduler }
            - { call: "POST /railroad/car-assignments", payload: { excursion_id: "${ex_a}", stock_id: "${coach}", class_code: "COACH", position: 2 }, as: Scheduler }
            - { call: "POST /railroad/car-assignments", payload: { excursion_id: "${ex_b}", stock_id: "${loco}", class_code: "LOCO", position: 1 }, as: Scheduler }
            - { call: "POST /railroad/car-assignments", payload: { excursion_id: "${ex_b}", stock_id: "${coach}", class_code: "COACH", position: 2 }, as: Scheduler }
            - { call: "POST /railroad/crew-members", payload: { name: "Ed Eng", role: "ENGINEER", is_volunteer: false, cert_expires_on: "2027-06-01" }, as: CrewManager, captures: { cm_e: "$.data.id" } }
            - { call: "POST /railroad/crew-members", payload: { name: "Con Ida", role: "CONDUCTOR", is_volunteer: false, cert_expires_on: "2027-06-01" }, as: CrewManager, captures: { cm_c: "$.data.id" } }
            - { call: "POST /railroad/crew-members", payload: { name: "Hal Host", role: "CAR_HOST", is_volunteer: true }, as: CrewManager, captures: { cm_h: "$.data.id" } }
            - { call: "POST /railroad/crew-assignments", payload: { excursion_id: "${ex_a}", crew_member_id: "${cm_e}", position: "ENGINEER" }, as: CrewManager }
            - { call: "POST /railroad/crew-assignments", payload: { excursion_id: "${ex_a}", crew_member_id: "${cm_c}", position: "CONDUCTOR" }, as: CrewManager }
            - { call: "POST /railroad/crew-assignments", payload: { excursion_id: "${ex_a}", crew_member_id: "${cm_h}", position: "CAR_HOST" }, as: CrewManager }
            - { call: "POST /railroad/crew-assignments", payload: { excursion_id: "${ex_b}", crew_member_id: "${cm_e}", position: "ENGINEER" }, as: CrewManager }
            - { call: "POST /railroad/crew-assignments", payload: { excursion_id: "${ex_b}", crew_member_id: "${cm_c}", position: "CONDUCTOR" }, as: CrewManager }
            - { call: "POST /railroad/crew-assignments", payload: { excursion_id: "${ex_b}", crew_member_id: "${cm_h}", position: "CAR_HOST" }, as: CrewManager }
            - { call: "GET /railroad/excursions/${ex_a}", as: Scheduler, captures: { exa_v: "$.data.version" } }
            - { call: "POST /railroad/excursions/${ex_a}/events", payload: { event_type: "PUBLISH", expected_excursion_version: "${exa_v}" }, as: Scheduler }
            - { call: "POST /railroad/bookings", payload: { excursion_id: "${ex_a}", customer_email: "sam@x.com", class_code: "COACH", party_size: 2 }, as: StationAgent, captures: { b0: "$.data.id" } }
            - { call: "POST /railroad/bookings/${b0}/events", payload: { event_type: "CONFIRM" }, as: StationAgent, captures: { b0_paid: "$.data.paid_cents" } }
            - { call: "POST /railroad/excursions/${ex_a}/events", payload: { event_type: "CANCEL", cancel_reason: "WEATHER" }, as: OperationsManager }
            - { call: "GET /railroad/rain-checks?booking_id=${b0}", as: StationAgent, captures: { rc1: "$.data[0].id", rc1_value: "$.data[0].value_cents" } }
            - { call: "GET /railroad/excursions/${ex_b}", as: Scheduler, captures: { exb_v: "$.data.version" } }
            - { call: "POST /railroad/excursions/${ex_b}/events", payload: { event_type: "PUBLISH", expected_excursion_version: "${exb_v}" }, as: Scheduler }
            - { call: "POST /railroad/bookings", payload: { excursion_id: "${ex_b}", customer_email: "sam@x.com", class_code: "COACH", party_size: 1 }, as: StationAgent, captures: { b1: "$.data.id" } }
          trigger:
            - { call: "POST /railroad/bookings/${b1}/events", payload: { event_type: "CONFIRM", redeemed_rain_check_id: "${rc1}" }, as: StationAgent, captures: { b1_total: "$.data.total_price_cents", b1_paid: "$.data.paid_cents" } }
            - { call: "GET /railroad/rain-checks/${rc1}", as: StationAgent, captures: { rc1_status: "$.data.status", rc1_redeemed_by: "$.data.redeemed_booking_id" } }
          assert:
            - "issuance leg conserves cents: ${rc1_value} == 12000 == ${b0_paid}"
            - "redemption leg: ${b1_total} == 6000 and ${b1_paid} == 0 == max(0, 6000 - 12000)"
            - "rain-check fully consumed, no residual: ${rc1_status} == REDEEMED and ${rc1_redeemed_by} == ${b1}"
            - "customer net outlay conserved across the pair: 12000 paid on B0 covers B1's 6000 total in full"
