scaffold_difficulty_design:
  # =========================================================================
  # Rule 1 — Dual-variant calculations across different entity domains (>= 2)
  # =========================================================================
  - rule_id: dual_variant_calc
    instances:
      - name: billing_package_vs_a_la_carte_same_cycle
        grounds:
          - calculations.bill_line_items_and_subtotal
          - calculations.bill_line_items_and_subtotal.variants.package_mode
          - calculations.bill_line_items_and_subtotal.variants.a_la_carte_mode
          - entities.Bill.fields.billing_mode
          - entities.Bill.fields.subtotal_cents
        distinguishing_aspect: |
          Two valid billing variants on the same Bill entity (Bill domain) produce different
          subtotal_cents for identical underlying CareTaskExecution + meal counts: PACKAGE flat
          per admitted_day at care-level rate, A_LA_CARTE based on actual task durations and
          meal counts. Different entity domain than the second instance (Elder care-level scoring).
        test_recipe:
          setup:
            - "Admin creates Room {floor:1, type:STANDARD}, Bed {bed_type:SINGLE, monthly_bed_fee_cents:60000}"
            - "Admin creates Elder; Nurse drafts assessment with adl=80, cog=10, med=20 → composite=50 → L3; Supervisor approves → Elder.current_care_level=L3"
            - "Finance tops up Elder.deposit_balance_cents to 1000000 (10,000.00) so admission deposit floor is satisfied"
            - "Admin admits elder to bed; clock advanced to span full 30-day cycle (e.g. 2025-06-01..2025-06-30)"
            - "Caregiver posts exactly 60 CareTaskExecution rows of 30-min equivalent duration during cycle"
            - "Finance posts 90 meal line items (A_LA_CARTE branch reference)"
          trigger:
            - "POST /elders/{id}/bills {cycle_start_date:'2025-06-01', cycle_end_date:'2025-06-30', billing_mode:'PACKAGE'} → bill_A"
            - "POST /bills/{bill_A_id}/finalize"
            - "POST /elders/{id}/bills {same dates, billing_mode:'A_LA_CARTE'} → bill_B"
            - "POST /bills/{bill_B_id}/finalize"
          assert:
            - "bill_A.subtotal_cents == 540000   # 60000 bed + 12000*30 care + 4000*30 meal"
            - "bill_B.subtotal_cents == 390000   # 60000 bed + 6500*30 care (30 hours) + 1500*90 meal"
            - "bill_A.subtotal_cents != bill_B.subtotal_cents"

      - name: care_level_classification_weighted_score
        grounds:
          - calculations.care_level_classification
          - entities.CareAssessment.fields.composite_score
          - entities.CareAssessment.fields.classification
          - entities.Elder.fields.current_care_level
        distinguishing_aspect: |
          Same three sub-scores feed two interpretations: composite_score is computed by a
          server-pinned weighted formula (W_ADL=0.5, W_COG=1.0, W_MED=1.0 with INVERSION on
          ADL and cognitive), and classification then thresholds it. A naive sum without
          inversion or without the 0.5 weight on ADL yields a different classification.
          Different entity domain than billing (CareAssessment, not Bill).
        test_recipe:
          setup:
            - "Nurse drafts a CareAssessment with adl_score=80, cognitive_score=10, medical_condition_score=20"
          trigger:
            - "POST /care-assessments/{id}/submit"
          assert:
            - "CareAssessment.composite_score == 50.00   # (100-80)*0.5 + (30-10)*1.0 + 20*1.0 = 10+20+20"
            - "CareAssessment.classification == 'L3'   # 50 >= 40 and < 60"
            - "A naive interpretation (no inversion, equal weights) would yield 110 and classify INTENSIVE, proving the variant is well-defined."

  # =========================================================================
  # Rule 2 — Combinatorial formulas across different modes (>= 2)
  # =========================================================================
  - rule_id: combinatorial_formula
    instances:
      - name: care_level_three_input_nonlinear_thresholds
        grounds:
          - calculations.care_level_classification
          - calculations.care_level_classification.formula
          - calculations.care_level_classification.constants
        distinguishing_aspect: |
          MODE (a) — formula with 3 inputs (adl, cognitive, medical) combined non-linearly:
          two coordinates are inverted (100-x, 30-x) before weighting, and the weighted sum
          then selects one of 5 classification tiers via inclusive thresholds. Different mode
          than instance #2 below which is rounding-order pinning.
        test_recipe:
          setup:
            - "Nurse drafts assessment with adl=60, cognitive=10, medical=20"
          trigger:
            - "POST /care-assessments/{id}/submit"
          assert:
            - "CareAssessment.composite_score == 60.00   # (100-60)*0.5 + (30-10)*1.0 + 20*1.0 = 20+20+20"
            - "CareAssessment.classification == 'L4'   # 60 >= 60 (inclusive lower bound)"
            - "An off-by-one interpretation (classification thresholds exclusive) would mis-classify as L3."

      - name: billing_rounding_order_pinned
        grounds:
          - calculations.bill_line_items_and_subtotal
          - calculations.bill_line_items_and_subtotal.precision
          - calculations.government_subsidy
          - calculations.insurance_offset
          - calculations.deposit_apply_and_amount_due
        distinguishing_aspect: |
          MODE (b) — nested rounding order matters: bed_fee may be fractional cents
          (monthly_bed_fee_cents * (days_in_cycle/30)); the scaffold pins "round per line item
          first, then sum" for subtotal_cents, then applies floor() on subsidy_rate*subtotal,
          then floor() on insurance_rate*medical_total. Reordering produces different cents.
          Different mode than instance #1 (three-input weighted scoring).
        test_recipe:
          setup:
            - "Bed.monthly_bed_fee_cents = 60001 (intentionally non-divisible by 30)"
            - "Same elder/admission as billing dual-variant instance, but cycle length 28 days"
            - "Caregiver posts task execution + meal items so that PACKAGE branch is exercised"
          trigger:
            - "POST /elders/{id}/bills {cycle_start_date:'2025-02-01', cycle_end_date:'2025-02-28', billing_mode:'PACKAGE'}"
            - "POST /bills/{id}/finalize"
          assert:
            - "Bill.line_items.[BED].amount_cents == 56001   # round_half_up(60001 * (28/30)) = round_half_up(56000.9333) = 56001"
            - "Bill.subtotal_cents == 56001 + (12000*28) + (4000*28) == 56001 + 336000 + 112000 == 504001"
            - "Bill.government_subsidy_cents == floor(504001 * 0.20) == 100800   # floor before cap"

  # =========================================================================
  # Rule 3 — Non-linear state-machine shape on different entities (>= 2)
  # =========================================================================
  - rule_id: non_linear_state_machine
    instances:
      - name: care_assessment_revision_cycle
        grounds:
          - state_machines.CareAssessment.DRAFT_to_PENDING_APPROVAL
          - state_machines.CareAssessment.PENDING_APPROVAL_to_DRAFT
          - state_machines.CareAssessment.PENDING_APPROVAL_to_APPROVED
        distinguishing_aspect: |
          Cyclic non-linear shape on CareAssessment: PENDING_APPROVAL→DRAFT via
          return-for-revision creates a revision loop (DRAFT→PENDING_APPROVAL→DRAFT→…→APPROVED).
          Different entity than CarePlan's UNDER_REVIEW cycle.
        test_recipe:
          setup:
            - "Elder created; Nurse N drafts assessment A1 (adl=80,cog=10,med=20)"
          trigger:
            - "POST /care-assessments/{A1}/submit   # DRAFT → PENDING_APPROVAL"
            - "POST /care-assessments/{A1}/return-for-revision (Supervisor S, S != N)   # PENDING_APPROVAL → DRAFT"
            - "PATCH/POST /care-assessments/{A1} updates scores; POST /care-assessments/{A1}/submit again   # DRAFT → PENDING_APPROVAL"
            - "POST /care-assessments/{A1}/approve   # PENDING_APPROVAL → APPROVED"
          assert:
            - "CareAssessment.status path observed: DRAFT, PENDING_APPROVAL, DRAFT, PENDING_APPROVAL, APPROVED"
            - "Only one APPROVED terminal exists for A1; revision did not create a new assessment id."

      - name: care_plan_review_under_review_cycle
        grounds:
          - state_machines.CarePlan.ACTIVE_to_UNDER_REVIEW
          - state_machines.CarePlan.UNDER_REVIEW_to_ACTIVE
          - state_machines.CarePlan.UNDER_REVIEW_to_SUPERSEDED
        distinguishing_aspect: |
          Cyclic non-linear shape on CarePlan: ACTIVE→UNDER_REVIEW→ACTIVE via
          confirm-review (review cycle restart), with the alternate exit
          UNDER_REVIEW→SUPERSEDED. Different entity than CareAssessment's
          DRAFT/PENDING_APPROVAL cycle.
        test_recipe:
          setup:
            - "Elder with APPROVED L3 assessment; Supervisor creates+activates CarePlan P1 (ACTIVE)"
          trigger:
            - "POST /care-plans/{P1}/flag-review   # ACTIVE → UNDER_REVIEW"
            - "POST /care-plans/{P1}/confirm-review   # UNDER_REVIEW → ACTIVE (cycle restart)"
            - "POST /care-plans/{P1}/flag-review again   # ACTIVE → UNDER_REVIEW"
          assert:
            - "CarePlan.status path observed: DRAFT, ACTIVE, UNDER_REVIEW, ACTIVE, UNDER_REVIEW"
            - "CarePlan.next_review_due_at strictly increased between the two ACTIVE visits."

  # =========================================================================
  # Rule 4 — Transitive cascade chains from different triggers (>= 2)
  # =========================================================================
  - rule_id: transitive_cascade
    instances:
      - name: assessment_approval_cascades_to_plan_review_and_audit
        grounds:
          - state_machines.CareAssessment.PENDING_APPROVAL_to_APPROVED
          - state_machines.CarePlan.ACTIVE_to_UNDER_REVIEW
          - entities.Elder.fields.current_care_level
          - entities.AuditLog
        distinguishing_aspect: |
          Depth-3 cascade triggered by a single CareAssessment approval:
          (1) CareAssessment APPROVE mutates Elder.current_care_level;
          (2) Elder.current_care_level change (which DIFFERS from the active
          CarePlan.care_level_snapshot) causes the linked CarePlan ACTIVE→UNDER_REVIEW;
          (3) CarePlan ACTIVE→UNDER_REVIEW causes an AuditLog row to be appended
          (entity_type: CarePlan, action: REVIEW_FLAGGED). Each hop is causally chained
          from the prior hop, not fanned out from the initial trigger.
        test_recipe:
          setup:
            - "Elder admitted with current_care_level=L3; ACTIVE CarePlan P1 with care_level_snapshot=L3"
            - "Nurse drafts NEW assessment with adl=20,cog=5,med=40 → composite=(100-20)*0.5+(30-5)*1+40=40+25+40=105 → INTENSIVE"
            - "Submit and approve (different X-User-ID for approver)"
          trigger:
            - "POST /care-assessments/{new_id}/approve"
          assert:
            - "Elder.current_care_level == 'INTENSIVE'"
            - "CarePlan.{P1}.status == 'UNDER_REVIEW'   # cascaded because L3 != INTENSIVE"
            - "GET /audit-logs?entity_type=CarePlan&entity_id={P1} returns >= 1 entry with action == 'REVIEW_FLAGGED'"

      - name: elder_leave_cascades_to_prescription_suspend_and_blocks_administration
        grounds:
          - state_machines.Elder.ADMITTED_to_ON_LEAVE
          - state_machines.Prescription.ACTIVE_to_SUSPENDED
          - state_machines.MedicationAdministration   # implicit: blocked when prescription SUSPENDED
        distinguishing_aspect: |
          Depth-2 cascade with a different trigger: POST /elders/{id}/leave causes
          (1) Elder ADMITTED→ON_LEAVE; (2) every ACTIVE Prescription on that elder
          transitions ACTIVE→SUSPENDED as a direct consequence; the suspended state
          then causes future POST /prescriptions/{id}/administrations to fail
          ERR_INVALID_STATE. Different triggering transition than instance #1.
        test_recipe:
          setup:
            - "Elder ADMITTED; Prescription RX1 ACTIVE with scheduled slots"
          trigger:
            - "POST /elders/{id}/leave"
          assert:
            - "Elder.status == 'ON_LEAVE'"
            - "Prescription.{RX1}.status == 'SUSPENDED'   # cascaded"
            - "POST /prescriptions/{RX1}/administrations for a future slot returns 409 ERR_INVALID_STATE"

  # =========================================================================
  # Rule 5 — Validation priority conflicts across different error-category pairs (>= 2)
  # =========================================================================
  - rule_id: priority_pair_validation_conflict
    instances:
      - name: state_vs_business_safety_pair_administration
        grounds:
          - validations[priority=5]   # ERR_INVALID_STATE (state)
          - validations[priority=7]   # ERR_SEGREGATION_OF_DUTIES (business_safety)
          - state_machines.Prescription.ACTIVE_to_SUSPENDED
        distinguishing_aspect: |
          Dual-failure: simultaneously violate state (Prescription is SUSPENDED) AND
          segregation-of-duties (nurse_id == prescriber_id). state has priority 5,
          business_safety SoD has priority 7 — state wins, expected
          error_id=ERR_INVALID_STATE. Categories: state vs business_safety.
        test_recipe:
          setup:
            - "Physician U_PHY creates and activates Prescription RX1 on elder; nurse U_PHY is also the prescriber"
            - "POST /prescriptions/{RX1}/suspend   # RX1.status = SUSPENDED"
          trigger:
            - "POST /prescriptions/{RX1}/administrations with X-User-ID=U_PHY, X-User-Role=Nurse, scheduled_slot_at=valid slot, outcome=ADMINISTERED"
          assert:
            - "HTTP 409"
            - "data.error_id == 'ERR_INVALID_STATE'   # state wins over SoD"

      - name: business_safety_vs_business_fiscal_pair_admit
        grounds:
          - validations[priority=13]   # ERR_BED_TYPE_MISMATCH (business_constraint)
          - validations[priority=23]   # ERR_DEPOSIT_INSUFFICIENT (business_fiscal)
        distinguishing_aspect: |
          Dual-failure on POST /elders/{id}/admit: target bed is INTENSIVE_CARE but elder
          current_care_level == L3 (bed-type mismatch, priority 13), AND deposit_balance
          below admission floor (priority 23). Priority 13 wins, expected
          error_id=ERR_BED_TYPE_MISMATCH. Categories: business_constraint vs business_fiscal.
        test_recipe:
          setup:
            - "Elder with current_care_level=L3 and deposit_balance_cents=0"
            - "Bed B_IC with bed_type=INTENSIVE_CARE, status=AVAILABLE"
          trigger:
            - "POST /elders/{id}/admit {bed_id: B_IC}"
          assert:
            - "HTTP 409"
            - "data.error_id == 'ERR_BED_TYPE_MISMATCH'"

  # =========================================================================
  # Rule 6 — Boundary-precision checks on different metrics/endpoints (>= 2)
  # =========================================================================
  - rule_id: boundary_precision_check
    instances:
      - name: composite_score_threshold_inclusive_lower_bound
        grounds:
          - calculations.care_level_classification
          - entities.CareAssessment.fields.composite_score
          - entities.CareAssessment.fields.classification
        distinguishing_aspect: |
          Numeric-threshold boundary on the composite_score endpoint:
          composite_score == 60 is L4 (inclusive lower bound), composite_score == 59.99
          is L3. Reached through POST /care-assessments/{id}/submit. Different metric
          than the empty-collection boundary in instance #2.
        test_recipe:
          setup:
            - "Nurse drafts assessment A_low with adl=60, cog=10, med=20   → composite=60.00 (boundary)"
            - "Nurse drafts assessment A_hi  with adl=60, cog=11, med=20   → composite=59.00 (just below boundary)"
          trigger:
            - "POST /care-assessments/{A_low}/submit"
            - "POST /care-assessments/{A_hi}/submit"
          assert:
            - "CareAssessment.{A_low}.composite_score == 60.00 and classification == 'L4'   # inclusive"
            - "CareAssessment.{A_hi}.composite_score == 59.00 and classification == 'L3'"

      - name: admit_requires_at_least_one_emergency_contact_empty_array_rejected
        grounds:
          - validations   # admission preconditions
          - state_machines.Elder.PENDING_ADMISSION_to_ADMITTED
          - entities.Elder.fields.emergency_contacts
        distinguishing_aspect: |
          Empty-collection boundary on a different endpoint (POST /elders/{id}/admit):
          len(emergency_contacts) == 0 must reject; len == 1 must succeed (assuming
          other preconditions pass). Different metric (empty-array count) than
          instance #1's numeric threshold.
        test_recipe:
          setup:
            - "Elder E1 created with emergency_contacts=[] (empty), L3 care level, deposit funded; Bed B1 AVAILABLE matching bed_type"
            - "Elder E2 same as E1 but emergency_contacts=[{name:'A', relation:'CHILD', phone:'555-1'}]"
          trigger:
            - "POST /elders/{E1}/admit {bed_id: B1}"
            - "POST /elders/{E2}/admit {bed_id: B1}"
          assert:
            - "First call returns HTTP 422 with data.error_id == 'ERR_VALIDATION' (missing emergency_contact)"
            - "Second call returns HTTP 200; Elder.{E2}.status == 'ADMITTED'"

  # =========================================================================
  # Rule 7 — Cross-entity state dependencies across different entity pairs (>= 2)
  # =========================================================================
  - rule_id: cross_entity_state_dependency
    instances:
      - name: care_plan_activation_depends_on_assessment_state
        grounds:
          - state_machines.CarePlan.DRAFT_to_ACTIVE
          - validations[priority=20]   # ERR_PLAN_LEVEL_MISMATCH
          - entities.CareAssessment.fields.status
          - entities.CarePlan.fields.based_on_assessment_id
        distinguishing_aspect: |
          CarePlan.DRAFT→ACTIVE is gated by the linked CareAssessment.status==APPROVED
          AND its classification matching Elder.current_care_level. Entity pair:
          CarePlan ↔ CareAssessment.
        test_recipe:
          setup:
            - "Elder with no APPROVED assessment yet; Nurse drafts assessment A1 (status DRAFT)"
            - "Supervisor creates DRAFT CarePlan P1 based_on_assessment_id=A1"
          trigger:
            - "POST /care-plans/{P1}/activate"
          assert:
            - "HTTP 409"
            - "data.error_id in {'ERR_INVALID_STATE','ERR_PLAN_LEVEL_MISMATCH'}   # A1 not APPROVED"
            - "After: A1 submitted+approved, Elder.current_care_level == A1.classification → POST activate succeeds (200)"

      - name: discharge_depends_on_bill_states
        grounds:
          - state_machines.Elder.ADMITTED_to_DISCHARGED
          - validations[priority=24]   # ERR_OUTSTANDING_BALANCE
          - entities.Bill.fields.status
          - entities.Elder.fields.outstanding_balance_cents
        distinguishing_aspect: |
          Elder ADMITTED→DISCHARGED is gated by Bill state across all bills:
          every Bill must be in {PAID, REFUNDED, ADJUSTED} and outstanding_balance_cents==0.
          Entity pair: Elder ↔ Bill, different from instance #1 (CarePlan ↔ CareAssessment).
        test_recipe:
          setup:
            - "Elder admitted with one FINALIZED Bill having amount_due_cents > 0 (unpaid)"
          trigger:
            - "POST /elders/{id}/discharge"
          assert:
            - "HTTP 409"
            - "data.error_id == 'ERR_OUTSTANDING_BALANCE'"
            - "After POST /bills/{bill_id}/pay (PAID), POST /elders/{id}/discharge returns 200 and Elder.status=='DISCHARGED'."

  # =========================================================================
  # Rule 8 — Resource temporal-overlap conflicts across different interval semantics (>= 2)
  # =========================================================================
  - rule_id: resource_temporal_overlap
    instances:
      - name: visit_reservation_half_open_interval_per_elder
        grounds:
          - validations[priority=15]   # ERR_VISIT_SLOT_CONFLICT
          - concurrency_rules[VisitReservations]
          - entities.VisitReservation.fields.slot_start_at
          - entities.VisitReservation.fields.slot_end_at
        distinguishing_aspect: |
          Half-open interval semantics on VisitReservation: [slot_start_at, slot_end_at)
          per elder cannot intersect. An adjacent reservation (next.slot_start_at ==
          prev.slot_end_at) is ALLOWED. Different interval semantics than instance #2.
        test_recipe:
          setup:
            - "Elder E ADMITTED; existing RESERVED reservation R1 with slot=[10:00, 11:00)"
          trigger:
            - "POST /elders/{E}/visit-reservations {slot=[10:30, 11:30)}   # overlap"
            - "POST /elders/{E}/visit-reservations {slot=[11:00, 12:00)}   # adjacent, NOT overlap"
          assert:
            - "First call returns 409 ERR_VISIT_SLOT_CONFLICT"
            - "Second call returns 201 (adjacent is allowed under half-open semantics)"

      - name: medication_administration_unique_slot_aggregate_capacity
        grounds:
          - concurrency_rules[MedicationAdministration]
          - validations[priority=19]   # ERR_SLOT_NOT_SCHEDULED
          - entities.MedicationAdministration.fields.scheduled_slot_at
        distinguishing_aspect: |
          Point-capacity (capacity-1) interval semantics on MedicationAdministration:
          unique (prescription_id, scheduled_slot_at) — a slot is a 0-width point with
          capacity 1, NOT a half-open interval. Adjacent slots are independent.
          Different resource entity (Prescription/MedicationAdministration) and
          different geometry (point vs interval) than instance #1.
        test_recipe:
          setup:
            - "Elder ADMITTED; Prescription RX1 ACTIVE with scheduled slots S1 and S2"
            - "Nurse N1 (N1 != prescriber) records administration at S1 (outcome=ADMINISTERED)"
          trigger:
            - "POST /prescriptions/{RX1}/administrations {scheduled_slot_at: S1, outcome:ADMINISTERED}   # duplicate point"
            - "POST /prescriptions/{RX1}/administrations {scheduled_slot_at: S2, outcome:ADMINISTERED}   # adjacent point"
          assert:
            - "First call returns 409 ERR_SLOT_ALREADY_ADMINISTERED"
            - "Second call returns 201 (different slot, no conflict)"

  # =========================================================================
  # Rule 9 — Compensating-action invariants across different conserved quantities (>= 2)
  # =========================================================================
  - rule_id: compensating_invariant
    instances:
      - name: deposit_refund_invariant
        grounds:
          - calculations.deposit_apply_and_amount_due
          - state_machines.Bill.PAID_to_REFUNDED
          - state_machines.Bill.DRAFT_to_FINALIZED
          - entities.Elder.fields.deposit_balance_cents
          - entities.Bill.fields.deposit_applied_cents
        distinguishing_aspect: |
          Conserved quantity: Elder.deposit_balance_cents + Σ(Bill.deposit_applied_cents
          across non-REFUNDED bills) MUST remain constant relative to the original
          deposited amount, except for explicit top-ups. Forward action = finalize (debit
          deposit_balance); compensating action = refund (credit deposit_balance by
          min(refund_amount, deposit_applied)). Quantity type: monetary deposit.
        test_recipe:
          setup:
            - "Elder admitted; Finance POST /elders/{id}/deposit amount_cents=1000000   → deposit_balance=1000000"
            - "Finalize a Bill that consumes 300000 of deposit (deposit_applied_cents=300000); deposit_balance now 700000"
            - "Pay the bill (FINALIZED → PAID)"
          trigger:
            - "POST /bills/{id}/refund {refund_amount_cents: 300000, reason: 'duplicate billing'}"
          assert:
            - "Elder.deposit_balance_cents == 1000000   # back to original deposit"
            - "Bill.status == 'REFUNDED'"
            - "Σ(deposit_applied across non-REFUNDED bills) == 0   # invariant restored"

      - name: bed_occupancy_invariant
        grounds:
          - state_machines.Elder.ADMITTED_to_DISCHARGED
          - state_machines.Bed.OCCUPIED_to_AVAILABLE
          - state_machines.Bed.AVAILABLE_to_OCCUPIED
          - entities.Bed.fields.status
          - entities.Elder.fields.current_bed_id
        distinguishing_aspect: |
          Conserved quantity: COUNT(Bed where status==OCCUPIED) ==
          COUNT(Elder where status==ADMITTED OR status==ON_LEAVE). Different conserved
          quantity (integer bed-occupancy count) than instance #1 (monetary deposit).
          Forward action = admit (Bed AVAILABLE→OCCUPIED, Elder PENDING→ADMITTED);
          compensating action = discharge (Bed OCCUPIED→AVAILABLE, Elder→DISCHARGED).
          The pair MUST leave the equality unchanged across full admit-then-discharge.
        test_recipe:
          setup:
            - "Initial state: 0 OCCUPIED beds, 0 ADMITTED+ON_LEAVE elders (assert via GET /beds?status=OCCUPIED and GET /elders?status=ADMITTED)"
            - "Elder E1 + Bed B1 prepared, all preconditions met"
          trigger:
            - "POST /elders/{E1}/admit {bed_id: B1}   # admit"
            - "Pay all bills, then POST /elders/{E1}/discharge   # compensating action"
          assert:
            - "After admit: COUNT(Bed.status==OCCUPIED)==1 and COUNT(Elder.status IN {ADMITTED,ON_LEAVE})==1"
            - "After discharge: COUNT(Bed.status==OCCUPIED)==0 and COUNT(Elder.status IN {ADMITTED,ON_LEAVE})==0"
            - "Invariant `OCCUPIED == ADMITTED+ON_LEAVE` holds at every observation point."
