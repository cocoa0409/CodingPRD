              as: Buyer
              as_user_id: "${byr2_id}"
              captures: { ord_partial_v: $.data.version }
            - *c_pay
            - call: "POST /v1/orders/${ord_partial_id}/fee-ledger-entries"
              payload: { entry_type: "DELIVERY_FEE_WAIVER", amount_cents: -300, reason_code: "PARTIAL_SETTLEMENT" }
              as: PlatformAdmin
            - *c_lock
            - call: "POST /v1/orders/${ord_partial_id}/lock-configuration"
              payload: { expected_order_version: "${ord_partial_v}" }
              as: PlatformAdmin
              captures: { ord_partial_v: $.data.version }
            - *c_batch
            - call: "POST /v1/production-batches/${bch_id}/start"
              payload: {}
              as: PlatformAdmin
            - *c_unit
            - &c_unit_p
              call: "POST /v1/production-batches/${bch_id}/allocation-units"
              payload: { vin: "7SAYGDEE1PF000126" }
              as: PlatformAdmin
            - *c_alloc
            - call: "POST /v1/orders/${ord_partial_id}/allocation"
              payload: { batch_id: "${bch_id}", expected_order_version: "${ord_partial_v}" }
