  # ---------------------------------------------------------------------------
  - rule_id: resource_temporal_overlap
    instances:
      - name: provider_service_log_halfopen_overlap
        grounds:
          - validations[priority=13]
          - errors[ERR_PROVIDER_DOUBLE_BOOKED]
          - entities.ServiceLog.fields.start_time
          - entities.ServiceLog.fields.end_time
        distinguishing_aspect: |
          Half-open [start,end) semantics on ServiceLog: a second log
          09:20-09:50 overlaps an existing 09:00-09:40 (rejected), but an
          adjacent 09:40-10:10 (end==start) would be allowed.
        test_recipe:
          setup:
            - "A LOGGED service log 09:00-09:40 for a consented student, credentialed provider."
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-03-15T00:00:00Z" }
              as: MedicaidCoordinator
            - call: "POST /sbmb/students"
              payload: { medicaid_id: "MA-15", first_name: "Ada", last_name: "St", date_of_birth: "2012-02-01", district_student_id: "D-15" }
              as: MedicaidCoordinator
              captures: { stu: $.data.id }
            - call: "POST /sbmb/providers"
              payload: { npi: "NPI-15", first_name: "Ben", last_name: "Uv", discipline: "SLP" }
              as: MedicaidCoordinator
