scaffold_difficulty_design:

  # ===========================================================================
  # Rule 1 — Dual-variant calculations across DIFFERENT entity domains
  # ===========================================================================
  - rule_id: dual_variant_calc
    instances:
      - name: commission_provisional_vs_final_on_session
        grounds:
          - calculations.pricing_commission
          - entities.Session.fields.provisional_commission_cents
          - entities.Session.fields.final_commission_cents
          - state_machines.Session.IN_PROGRESS_to_COMPLETED
        distinguishing_aspect: |
          On a single Session, PROVISIONAL (booking-time) and FINAL (completion-time)
          variants produce different commission cents because the tutor's
          lifetime_completed_sessions crosses a tier boundary (19 -> 20) between the
          two evaluations; entity domain = Session (commerce ledger).
        test_recipe:
          setup:
            - "Create Tutor T with hourly_rate_cents=6000, trial_rate_cents=4000, lifetime_completed_sessions=19 (seeded by completing 19 prior sessions with another student)."
            - "Tutor T has VERIFIED status and APPROVED SubjectTag 'MATH_ALGEBRA'."
            - "Create ADULT Student S with credit_balance_cents=0."
          trigger:
            - "POST /tutoring/sessions {tutor=T, student=S, subject_code=MATH_ALGEBRA, start_at=now+2h, end_at=now+3h, is_trial=false} -> session has gross=6000, charged=6000, provisional_commission_cents=1200."
            - "POST /tutoring/sessions/{id}/confirm by T."
            - "Advance clock to end_at (now T's prior 20th session is also completed by completing one other session, bumping lifetime to 20)."
            - "POST /tutoring/sessions/{id}/complete with adjusted_minutes=60."
          assert:
            - "Session.provisional_commission_cents == 1200"
            - "Session.final_commission_cents == 900"
            - "Session.tutor_payout_cents == 5100"
            - "Session.provisional_commission_cents != Session.final_commission_cents"

      - name: verification_posture_provisional_vs_final_on_tutor
        grounds:
          - calculations.verification_posture
          - entities.Tutor.fields.verification_status
          - state_machines.Credential.APPROVED_to_EXPIRED
          - state_machines.Tutor.VERIFIED_to_SUSPENDED
        distinguishing_aspect: |
          Verification posture has two valid readings on the SAME Tutor row:
          (a) provisional posture at credential APPROVAL (snapshot of approved set ignoring expiry),
          (b) reified posture after clock-driven expiry sweep (filters out expired ones).
          Same approved credentials yield different verification_status depending on which
          algorithmic variant is applied; entity domain = Tutor (identity/compliance), different
          from the Session ledger above.
        test_recipe:
          setup:
            - "Create Tutor T (UNVERIFIED)."
            - "Submit GOVERNMENT_ID credential with expires_at=now+10d; submit BACKGROUND_CHECK with expires_at=now+10d."
            - "Verifier (different user) approves both credentials -> Tutor.verification_status=VERIFIED."
          trigger:
            - "POST /tutoring/_clock/advance to now+11d (past expiry)."
          assert:
            - "GET /tutoring/tutors/{T}.verification_status == 'SUSPENDED'"
            - "Both credentials have status == 'EXPIRED'"
            - "Before clock advance Tutor.verification_status was 'VERIFIED'; after it is 'SUSPENDED' — same approval data, different posture variant."

  # ===========================================================================
  # Rule 2 — Combinatorial formulas across DIFFERENT modes
  # ===========================================================================
  - rule_id: combinatorial_formula
    instances:
      - name: pricing_gross_multi_input_nonlinear_mode_a
        grounds:
          - calculations.pricing_gross
          - entities.Session.fields.gross_price_cents
          - entities.Tutor.fields.hourly_rate_cents
          - entities.Tutor.fields.trial_rate_cents
        distinguishing_aspect: |
          Mode (a) — formula has ≥3 inputs (is_trial, scheduled_minutes, hourly_rate vs trial_rate)
          with non-linear interaction via tiered discount selection
          (minutes >= 180 -> 0.90; minutes >= 120 -> 0.95; trial bypasses discount).
        test_recipe:
          setup:
            - "Tutor T with hourly_rate_cents=6000, trial_rate_cents=4000, VERIFIED, subject MATH_ALGEBRA approved."
            - "ADULT Student S."
          trigger:
            - "POST /tutoring/sessions {minutes=119, is_trial=false} -> A."
            - "POST /tutoring/sessions {minutes=120, is_trial=false} -> B."
            - "POST /tutoring/sessions {minutes=60, is_trial=true} -> C."
          assert:
            - "A.gross_price_cents == 11900   # 6000/60 * 119 = 11900, no discount"
            - "B.gross_price_cents == 11400   # 12000 * 0.95"
            - "C.gross_price_cents == 4000    # trial uses trial_rate, no discount"

      - name: pinned_rounding_order_gross_then_commission_mode_b
        grounds:
          - calculations.pricing_commission
          - calculations.pricing_gross
          - entities.Session.fields.final_commission_cents
        distinguishing_aspect: |
          Mode (b) — nested rounding order matters. Scaffold pins: (1) gross is rounded
          first (line-level, round_half_up), (2) commission = round_half_up(rate *
          already-rounded gross). Alternative order (rate * raw, then round) yields a
          DIFFERENT cent value here: for hourly_rate_cents=6009, minutes=30, rate=0.10
          the raw gross is 3004.50 -> rounds to 3005 -> commission = round(3005*0.10) =
          round(300.5) = 301. The alternative order would compute round(3004.5*0.10) =
          round(300.45) = 300. The scaffold pins ORDER A; FINAL commission MUST be 301.
        test_recipe:
          setup:
            - "Tutor T with hourly_rate_cents=6009, VERIFIED, subject MATH_ALGEBRA approved, lifetime_completed_sessions=100 (10% tier)."
            - "ADULT Student S, credit_balance_cents=0."
          trigger:
            - "POST /tutoring/sessions {minutes=30, is_trial=false} -> session X (raw=3004.5, rounded gross=3005)."
            - "POST /tutoring/sessions/{X}/confirm; advance clock past end_at; POST /tutoring/sessions/{X}/complete with adjusted_minutes=30."
          assert:
            - "X.gross_price_cents == 3005   # round_half_up(6009/60 * 30) = round_half_up(3004.5) = 3005"
            - "X.charged_amount_cents == 3005"
            - "X.final_commission_cents == 301   # PINNED ORDER A: round_half_up(3005 * 0.10) = 301; alternative round_half_up(3004.5 * 0.10) = 300 is REJECTED"
            - "X.tutor_payout_cents == 2704   # 3005 - 301"

  # ===========================================================================
  # Rule 3 — Non-linear state-machine shape on DIFFERENT entities
  # ===========================================================================
  - rule_id: non_linear_state_machine
    instances:
      - name: refund_dispute_cyclic_open_counter_loop
        grounds:
          - state_machines.RefundDispute.OPEN_to_TUTOR_RESPONDED
          - state_machines.RefundDispute.TUTOR_RESPONDED_to_COUNTER_PROPOSED
          - state_machines.RefundDispute.COUNTER_PROPOSED_to_OPEN
          - entities.RefundDispute.fields.round_count
        distinguishing_aspect: |
          RefundDispute has a true cycle: OPEN -> TUTOR_RESPONDED -> COUNTER_PROPOSED -> OPEN.
          The cycle is bounded by round_count (cap 3). Linear pipelines cannot model this.
        test_recipe:
          setup:
            - "Completed Session for tutor T and student S (charged=6000)."
            - "Open RefundDispute D (status=OPEN)."
          trigger:
            - "POST /disputes/{D}/respond -> TUTOR_RESPONDED."
            - "POST /disputes/{D}/counter {counter_amount_cents=1000} -> COUNTER_PROPOSED, round_count=1."
            - "POST /disputes/{D}/reopen -> OPEN."
            - "POST /disputes/{D}/respond -> TUTOR_RESPONDED."
            - "POST /disputes/{D}/counter {counter_amount_cents=2000} -> COUNTER_PROPOSED, round_count=2."
          assert:
            - "RefundDispute.status == 'COUNTER_PROPOSED'"
            - "RefundDispute.round_count == 2"
            - "Sequence visited OPEN, TUTOR_RESPONDED, COUNTER_PROPOSED, OPEN — confirming cycle."

      - name: session_branching_complete_or_cancel_or_dispute
        grounds:
          - state_machines.Session.REQUESTED_to_CANCELLED_BY_STUDENT
          - state_machines.Session.CONFIRMED_to_CANCELLED_BY_TUTOR
          - state_machines.Session.IN_PROGRESS_to_COMPLETED
          - state_machines.Session.COMPLETED_to_DISPUTED
          - state_machines.Session.DISPUTED_to_REFUNDED
          - state_machines.Session.DISPUTED_to_SETTLED
        distinguishing_aspect: |
          Session is branching/fork: from CONFIRMED the path forks into
          {CANCELLED_BY_STUDENT, CANCELLED_BY_TUTOR, IN_PROGRESS->COMPLETED}, each
          carrying a divergent side-effect set (cancellation_fee_cents vs full refund
          vs commission settlement). From COMPLETED the second fork {DISPUTED, SETTLED}
          carries different ledger effects. Entity = Session, different from RefundDispute.
        test_recipe:
          setup:
            - "Three identical CONFIRMED sessions A, B, C for tutor T and student S, each charged=6000."
          trigger:
            - "A: POST /sessions/{A}/cancel by Student 1 hour before start_at."
            - "B: POST /sessions/{B}/cancel by Tutor 1 hour before start_at."
            - "C: advance clock past end_at; POST /sessions/{C}/complete with adjusted_minutes=60."
          assert:
            - "A.status == 'CANCELLED_BY_STUDENT' and A.cancellation_fee_cents == 3000 and A.refund_to_student_cents == 3000"
            - "B.status == 'CANCELLED_BY_TUTOR' and B.cancellation_fee_cents == 0 and B.refund_to_student_cents == 6000"
            - "C.status == 'COMPLETED' and C.final_commission_cents == 1200 (tier=0, 20%)"

  # ===========================================================================
  # Rule 4 — Transitive cascade chains from DIFFERENT triggers
  # ===========================================================================
  - rule_id: transitive_cascade
    instances:
      - name: credential_expiry_cascade_depth3
        grounds:
          - state_machines.Credential.APPROVED_to_EXPIRED
          - state_machines.Tutor.VERIFIED_to_SUSPENDED
          - state_machines.Session.CONFIRMED_to_CANCELLED_BY_TUTOR
        distinguishing_aspect: |
          Depth-3 chain triggered by CLOCK ADVANCE (system event):
          (1) Credential APPROVED -> EXPIRED, which CAUSES
          (2) Tutor VERIFIED -> SUSPENDED (via verification_posture recompute), which CAUSES
          (3) every future CONFIRMED Session -> CANCELLED_BY_TUTOR with full refund.
          Each link is caused by the previous link, not by the original clock event in parallel.
        test_recipe:
          setup:
            - "Tutor T VERIFIED with GOVERNMENT_ID credential expires_at=now+5d, BACKGROUND_CHECK expires_at=now+30d."
            - "Two CONFIRMED Sessions S1 (start_at=now+10d, charged=6000) and S2 (start_at=now+12d, charged=6000) for student STU."
            - "STU.credit_balance_cents = 0 initially."
          trigger:
            - "POST /tutoring/_clock/advance to now+6d."
          assert:
            - "Credential GOVERNMENT_ID.status == 'EXPIRED'"
            - "Tutor.verification_status == 'SUSPENDED'"
            - "S1.status == 'CANCELLED_BY_TUTOR' and S1.refund_to_student_cents == 6000"
            - "S2.status == 'CANCELLED_BY_TUTOR' and S2.refund_to_student_cents == 6000"
            - "STU.credit_balance_cents == 12000 (sum of both refunds)"

      - name: parent_link_revoke_cascade_depth2
        grounds:
          - state_machines.ParentChildLink.ACTIVE_to_REVOKED
          - state_machines.Session.CONFIRMED_to_CANCELLED_BY_STUDENT
          - entities.Student.fields.credit_balance_cents
        distinguishing_aspect: |
          Depth-2 chain triggered by ACTOR ACTION (different trigger from the clock sweep
          above): (1) Parent revokes ParentChildLink ACTIVE -> REVOKED, which CAUSES
          (2) every future CONFIRMED Session of the linked MINOR child -> CANCELLED_BY_STUDENT
          with refund to the child's credit balance.
        test_recipe:
          setup:
            - "Parent P, MINOR Student M with ACTIVE ParentChildLink L."
            - "Tutor T VERIFIED."
            - "Two CONFIRMED Sessions S1 (start_at=now+5d, charged=6000) and S2 (start_at=now+6d, charged=6000) for M."
          trigger:
            - "DELETE /tutoring/parents/{P}/links/{L}."
          assert:
            - "ParentChildLink.link_status == 'REVOKED'"
            - "S1.status == 'CANCELLED_BY_STUDENT' and S1.cancellation_fee_cents == 0 (>=24h notice)"
            - "S2.status == 'CANCELLED_BY_STUDENT'"
            - "M.credit_balance_cents == 12000 (sum of refunds for both)"

  # ===========================================================================
  # Rule 5 — Validation priority conflicts across DIFFERENT error-category pairs
  # ===========================================================================
  - rule_id: priority_pair_validation_conflict
    instances:
      - name: business_referential_vs_business_fiscal_dispute_on_settled
        grounds:
          - validations[priority=15]
          - validations[priority=16]
        distinguishing_aspect: |
          Pair = business_referential (priority 15: ERR_DISPUTE_WINDOW_CLOSED) vs
          business_fiscal (priority 16: ERR_AMOUNT_OUT_OF_RANGE). When opening a dispute
          on a Session NOT in {COMPLETED, SETTLED} AND with requested_amount_cents >
          Session.charged_amount_cents, the referential window check wins because it sits
          at the lower priority number. Implementations that run fiscal range checks first
          would emit ERR_AMOUNT_OUT_OF_RANGE and fail this rule.
        test_recipe:
          setup:
            - "Session X in state CONFIRMED (not yet completed). charged_amount_cents == 6000."
          trigger:
            - "POST /tutoring/disputes {session_id=X, reason_code=QUALITY_ISSUE, requested_amount_cents=999999}."
          assert:
            - "HTTP status == 422"
            - "response.error_id == 'ERR_DISPUTE_WINDOW_CLOSED'   # priority 15 wins over priority 16"

      - name: business_safety_vs_business_temporal_booking_with_unverified_tutor
        grounds:
          - validations[priority=10]
          - validations[priority=11]
        distinguishing_aspect: |
          Pair = business_safety (priority 10: ERR_TUTOR_NOT_VERIFIED) vs business_temporal
          (priority 11: ERR_INVALID_SESSION_WINDOW). Booking an unverified tutor with
          end_at <= start_at: safety wins (priority 10 < 11). Distinct from the
          state/fiscal pair above.
        test_recipe:
          setup:
            - "Tutor T with verification_status='UNVERIFIED'."
            - "ADULT Student S."
          trigger:
            - "POST /tutoring/sessions {tutor=T, student=S, subject_code=MATH_ALGEBRA, start_at=now+2h, end_at=now+2h (== start_at)}."
          assert:
            - "HTTP status == 422"
            - "response.error_id == 'ERR_TUTOR_NOT_VERIFIED'   # priority 10 wins over priority 11"

  # ===========================================================================
  # Rule 6 — Boundary-precision checks on DIFFERENT metrics/endpoints
  # ===========================================================================
  - rule_id: boundary_precision_check
    instances:
      - name: cancellation_fee_24h_boundary_inclusive
        grounds:
          - calculations.cancellation_fee
          - entities.Session.fields.cancellation_fee_cents
        distinguishing_aspect: |
          Numeric metric = hours_to_start; threshold = 24.0 hours, inclusive on the upper side
          (>= 24 returns 0). Reachable via POST /sessions/{id}/cancel.
        test_recipe:
          setup:
            - "CONFIRMED Session at start_at=now+24h exactly, charged_amount_cents=6000."
          trigger:
            - "POST /tutoring/sessions/{id}/cancel by Student at clock.now (hours_to_start == 24.0)."
            - "Separately for sibling Session at start_at=now+23h59m, charged=6000: POST cancel at clock.now (hours_to_start = 23.983...)."
          assert:
            - "First Session.cancellation_fee_cents == 0   # boundary 24.0 inclusive"
            - "Sibling Session.cancellation_fee_cents == 1500   # 25% of 6000 (hours_to_start < 24)"

      - name: trial_eligibility_empty_history_boundary
        grounds:
          - validations[priority=13]
          - entities.Session.fields.is_trial
        distinguishing_aspect: |
          Empty-set metric (not numeric threshold): different metric from the 24h hours
          boundary above. Trial booking allowed iff prior trial Session count == 0 AND
          completed Session count for (tutor, student) == 0. Reachable via POST /sessions
          with is_trial=true.
        test_recipe:
          setup:
            - "Tutor T VERIFIED, subject MATH_ALGEBRA approved."
            - "Student S has 1 prior COMPLETED Session with Tutor T."
            - "Student S2 has 0 prior sessions with Tutor T."
          trigger:
            - "POST /tutoring/sessions {tutor=T, student=S, is_trial=true, ...}  -> attempt A."
            - "POST /tutoring/sessions {tutor=T, student=S2, is_trial=true, ...} -> attempt B."
          assert:
            - "Attempt A: HTTP 422, error_id == 'ERR_TRIAL_ALREADY_USED'   # completed-count != 0 means past empty-set boundary"
            - "Attempt B: HTTP 201, Session.is_trial == true                # empty prior set succeeds"

  # ===========================================================================
  # Rule 7 — Cross-entity state dependencies across DIFFERENT entity pairs
  # ===========================================================================
  - rule_id: cross_entity_state_dependency
    instances:
      - name: session_confirm_requires_tutor_verified
        grounds:
          - state_machines.Session.REQUESTED_to_CONFIRMED
          - state_machines.Tutor.VERIFIED_to_SUSPENDED
          - entities.Tutor.fields.verification_status
        distinguishing_aspect: |
          Pair = (Session, Tutor): Session REQUESTED -> CONFIRMED depends on
          Tutor.verification_status == 'VERIFIED'. If Tutor is SUSPENDED, confirm
          is blocked even though the Session itself is in a legal source state.
        test_recipe:
          setup:
            - "REQUESTED Session X for Tutor T."
            - "Admin suspends T -> Tutor.verification_status='SUSPENDED'."
          trigger:
            - "POST /tutoring/sessions/{X}/confirm by Tutor T."
          assert:
            - "HTTP 422, error_id == 'ERR_TUTOR_NOT_VERIFIED'"

      - name: session_book_requires_parentchildlink_active_for_minor
        grounds:
          - validations[priority=8]
          - entities.ParentChildLink.fields.link_status
          - entities.Student.fields.account_type
        distinguishing_aspect: |
          Pair = (Session, ParentChildLink) — different entity pair from (Session, Tutor) above.
          A MINOR Student booking requires an ACTIVE ParentChildLink between the acting Parent
          and the Student. PENDING_PARENT_APPROVAL blocks booking.
        test_recipe:
          setup:
            - "Parent P, MINOR Student M with ParentChildLink in PENDING_PARENT_APPROVAL."
            - "Tutor T VERIFIED, subject approved."
          trigger:
            - "POST /tutoring/sessions {tutor=T, student=M, ...} acting as Parent P."
          assert:
            - "HTTP 403, error_id == 'ERR_MINOR_REQUIRES_PARENT'"
            - "Then: POST /parents/{P}/links/{L}/approve -> ACTIVE; same booking now returns HTTP 201."

  # ===========================================================================
  # Rule 8 — Resource temporal-overlap conflicts across DIFFERENT interval semantics
  # ===========================================================================
  - rule_id: resource_temporal_overlap
    instances:
      - name: tutor_session_closed_open_interval_overlap
        grounds:
          - validations[priority=12]
          - state_machines.Session.REQUESTED_to_CONFIRMED
          - concurrency_rules[Two overlapping Sessions]
        distinguishing_aspect: |
          Resource = Tutor calendar. Interval semantics = half-open [start_at, end_at)
          with 0-min buffer. Adjacency (one session ends at exactly T, another starts at
          exactly T) is ALLOWED; strict overlap is rejected.
        test_recipe:
          setup:
            - "Tutor T VERIFIED."
            - "REQUESTED Session A: start=10:00, end=11:00; REQUESTED Session B: start=11:00, end=12:00; REQUESTED Session C: start=10:30, end=11:30."
          trigger:
            - "POST /sessions/{A}/confirm  -> CONFIRMED."
            - "POST /sessions/{B}/confirm  -> CONFIRMED (adjacent; [11:00,12:00) does not overlap [10:00,11:00))."
            - "POST /sessions/{C}/confirm  -> REJECTED."
          assert:
            - "A.status == 'CONFIRMED'"
            - "B.status == 'CONFIRMED'   # adjacency allowed under closed-open semantics"
            - "C confirm: HTTP 409, error_id == 'ERR_SESSION_OVERLAP'"

      - name: trial_uniqueness_lifetime_aggregate_overlap
        grounds:
          - validations[priority=13]
          - concurrency_rules[trial Sessions booked]
          - entities.Session.fields.is_trial
        distinguishing_aspect: |
          Resource = (tutor_id, student_id) trial slot. Interval semantics = AGGREGATE LIFETIME
          (a single trial across all time and across terminal states); strictly different
          geometry from the closed-open instant-overlap above. Even a CANCELLED trial consumes
          the lifetime quota.
        test_recipe:
          setup:
            - "Tutor T VERIFIED, subject MATH_ALGEBRA approved."
            - "Student S; one prior trial Session was CANCELLED_BY_STUDENT (still counts)."
          trigger:
            - "POST /tutoring/sessions {tutor=T, student=S, is_trial=true, start_at=now+5d}."
          assert:
            - "HTTP 422, error_id == 'ERR_TRIAL_ALREADY_USED'"

  # ===========================================================================
  # Rule 9 — Compensating-action invariants across DIFFERENT conserved quantities
  # ===========================================================================
  - rule_id: compensating_invariant
    instances:
      - name: per_session_money_conservation_on_refund_cascade
        grounds:
          - calculations.invariant_money_conservation
          - state_machines.Session.IN_PROGRESS_to_COMPLETED
          - state_machines.Session.DISPUTED_to_REFUNDED
          - state_machines.RefundDispute.ARBITRATION_to_RESOLVED_REFUND
          - entities.Session.fields.tutor_payout_cents
          - entities.Session.fields.final_commission_cents
          - entities.Session.fields.refund_to_student_cents
          - entities.Session.fields.actual_gross_cents
          - entities.Session.fields.arbitration_refund_cents
          - entities.Session.fields.gross_price_cents
        distinguishing_aspect: |
          Conserved quantity #1 = MONEY-PER-SESSION (cents). The named invariant
            gross_price_cents == tutor_payout_cents + final_commission_cents + refund_to_student_cents
          MUST hold exactly after the forward action (book + complete with short delivery)
          AND after the compensating action (arbitration REFUND). Each transition recomputes
          the right-hand side so the equality is restored, not approximated.
        test_recipe:
          setup:
            - "Tutor T (lifetime_completed_sessions=0 -> 20% tier), VERIFIED, subject MATH_ALGEBRA approved, hourly_rate_cents=6000."
            - "ADULT Student S with credit_balance_cents=2000."
            - "Book 60-min non-trial session with apply_credits=true."
          trigger:
            - "POST /tutoring/sessions {tutor=T, student=S, subject_code=MATH_ALGEBRA, start_at=now+2h, end_at=now+3h, apply_credits=true}."
            - "POST /tutoring/sessions/{X}/confirm by T."
            - "POST /tutoring/_clock/advance to end_at."
            - "POST /tutoring/sessions/{X}/complete with adjusted_minutes=45  -> actual_gross=4500, short_delivery_refund=1500."
            - "Open RefundDispute D for session X; escalate; PlatformArbiter (segregated user) arbitrates decision=REFUND refund_amount_cents=1500."
          assert:
            - "Immediately after COMPLETED: X.gross_price_cents == 6000, X.actual_gross_cents == 4500, X.short_delivery_refund (via refund_to_student_cents) == 1500, X.final_commission_cents == 900, X.tutor_payout_cents == 3600   # invariant: 6000 == 3600+900+1500"
            - "After RESOLVED_REFUND: X.arbitration_refund_cents == 1500, X.refund_to_student_cents == 3000, X.final_commission_cents == 600, X.tutor_payout_cents == 2400   # invariant: 6000 == 2400+600+3000"
            - "Student.credit_balance_cents == 3000   # 0 after booking consumed 2000, +1500 short-delivery, +1500 arbitration"

      - name: parent_child_count_invariant_on_link_revoke
        grounds:
          - state_machines.ParentChildLink.PENDING_PARENT_APPROVAL_to_ACTIVE
          - state_machines.ParentChildLink.ACTIVE_to_REVOKED
          - entities.Parent.fields.managed_child_count
        distinguishing_aspect: |
          Conserved quantity #2 = COUNT (integer ledger), DIFFERENT type from money.
          Forward action: approve PENDING -> ACTIVE increments managed_child_count by 1.
          Compensating action: revoke ACTIVE -> REVOKED decrements by 1. After paired
          actions the count MUST return to its baseline; the named global quantity is
          `Parent.managed_child_count`, pinned as
            managed_child_count == count(Student where parent_id=self.id AND account_type=MINOR AND there exists ParentChildLink with link_status=ACTIVE).
        test_recipe:
          setup:
            - "Parent P with managed_child_count=2 (two ACTIVE links already)."
            - "Create MINOR Student M3 with parent_id=P; new ParentChildLink L3 in PENDING_PARENT_APPROVAL."
          trigger:
            - "POST /parents/{P}/links/{L3}/approve   -> ACTIVE; managed_child_count := 3."
            - "DELETE /parents/{P}/links/{L3}         -> REVOKED; managed_child_count := 2."
          assert:
            - "After approve: Parent.managed_child_count == 3"
            - "After revoke:  Parent.managed_child_count == 2   # restored to baseline; named-quantity invariant preserved"
