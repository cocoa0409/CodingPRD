  # =========================================================================
  # Rule 8 — Resource temporal-overlap conflicts across different interval semantics
  # =========================================================================
  - rule_id: resource_temporal_overlap
    instances:
      - name: supplier_booking_halfopen_overlap_rejects_but_adjacency_allowed
        grounds:
          - validations[priority=9]
          - entities.SupplierBooking.fields.service_window_start
          - errors[ERR_SUPPLIER_DOUBLE_BOOKED]
