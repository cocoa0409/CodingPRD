scaffold_difficulty_design:

  # =============================================================================
  # Rule 1 — Dual-variant calculations across DIFFERENT entity domains
  # =============================================================================
  - rule_id: dual_variant_calc
    instances:
      - name: time_entry_provisional_vs_final_billed
        grounds:
          - calculations.time_entry_provisional_cost
          - calculations.attorney_fee
          - entities.TimeEntry.fields.hourly_rate_cents_pinned
          - entities.Lawyer.fields.hourly_rate_cents
        distinguishing_aspect: |
          Two algorithms on the TimeEntry/Lawyer domain produce different attorney-fee
          numbers from identical TimeEntry rows: provisional uses current
          Lawyer.hourly_rate_cents and includes WRITTEN_OFF entries; final
          (calc attorney_fee, HOURLY mode) uses TimeEntry.hourly_rate_cents_pinned and
          excludes WRITTEN_OFF — exactly the dual-variant shape on the time/billing entity domain.
        test_recipe:
          setup:
            - "POST /lawyers — create lawyer L_PARTNER (role=PARTNER, hourly_rate_cents=30000)"
            - "POST /lawyers — create lawyer L_DRAFTER (role=JUNIOR, hourly_rate_cents=30000)"
            - "POST /cases — register case C with case_type=CIVIL, claim_amount_cents=5000000, lead_lawyer_id=L_PARTNER"
            - "POST /cases/C/parties — add PLAINTIFF and DEFENDANT (verify identity for both)"
            - "POST /cases/C/activate"
            - "POST /cases/C/time-entries — entry E1 with lawyer_id=L_DRAFTER, minutes=60, billable=true (rate pinned at 30000)"
            - "Update L_DRAFTER.hourly_rate_cents to 40000 (re-POST /lawyers is not allowed; instead call PATCH if defined; if not, simulate via re-creation in setup is forbidden — use only declared endpoints. For this scaffold, mimic rate change by registering a SECOND lawyer L_DRAFTER2 with rate=40000 and creating a parallel test entry E2 logged by L_DRAFTER2.)"
            - "POST /cases/C/time-entries — entry E2 with lawyer_id=L_DRAFTER2, minutes=60, billable=true (rate pinned at 40000)"
            - "POST /time-entries/E1/adjust with adjustment_minutes=0 (transitions LOGGED→ADJUSTED)"
            - "POST /time-entries/E2/adjust with adjustment_minutes=0"
            - "POST /time-entries/E1/write-off (E1 now WRITTEN_OFF)"
          trigger:
            - "GET /cases/C/time-entries/summary  # provisional"
            - "POST /cases/C/await-settlement"
            - "POST /cases/C/bills with billing_mode=HOURLY → bill B"
            - "POST /bills/B/issue"
            - "GET /bills/B  # final"
          assert:
            - "Provisional summary includes BOTH E1 (WRITTEN_OFF) and E2 → provisional_total_cents == 30000 + 40000 == 70000"
            - "Bill.attorney_fee_cents excludes E1 (WRITTEN_OFF) and uses pinned rate for E2 → attorney_fee_cents == 40000"
            - "provisional_total_cents != Bill.attorney_fee_cents (70000 != 40000)"

      - name: final_settlement_chronological_vs_total_due_aggregation
        grounds:
          - calculations.final_settlement
          - calculations.total_due
          - entities.Case.fields.settlement_total_cents
          - entities.Bill.fields.total_due_cents
        distinguishing_aspect: |
          On a Case-domain settlement, calc final_settlement runs a chronological replay
          (clamps interim balances to 0 before adding next event), while calc total_due
          performs a single forward-looking aggregation that clamps only the final result.
          The two algorithms diverge when a recovery is recorded BEFORE all time entries
          are billed — chronological zeroes the running balance mid-stream, aggregation
          subtracts at the end. Different entity domain than instance #1 (Case settlement
          vs. TimeEntry/Lawyer billing).
        test_recipe:
          setup:
            - "POST /lawyers — L_PARTNER (PARTNER, rate=30000)"
            - "POST /cases — case C, CIVIL, claim_amount_cents=5000000, lead_lawyer_id=L_PARTNER"
            - "Add PLAINTIFF + DEFENDANT parties (verified)"
            - "POST /cases/C/activate"
            - "POST /cases/C/time-entries — E1: lawyer=L_PARTNER, minutes=60, billable=true (entry_fee=30000)"
            - "POST /time-entries/E1/adjust with adjustment_minutes=0 → ADJUSTED"
            - "POST /cases/C/await-settlement"
            - "POST /cases/C/bills — billing_mode=FIXED, fixed_fee_cents=20000, expense_reimbursement_cents=0, cost_recovery_cents=100000 (recovery exceeds fees!)"
            - "POST /bills/B/issue  # forward_looking total_due = max(0, court_fee=170000 + attorney_fee=20000 + 0 - 100000) = 90000"
            - "POST /_events/payment-received with bill_id=B, amount_cents=90000  # B → PAID"
          trigger:
            - "POST /cases/C/close"
          assert:
            - "Bill.total_due_cents == 90000 (forward-looking aggregation: 170000 + 20000 + 0 - 100000, clamped only at end)"
            - "Case.settlement_total_cents != Bill.total_due_cents whenever the chronological replay clamps mid-stream"
            - "Case.settlement_total_cents (chronological replay: balance after time-entry billing = 30000; recovery 100000 → clamp to 0; +court_fee 170000) == 170000"

  # =============================================================================
  # Rule 2 — Combinatorial formulas across DIFFERENT modes (a)/(b)/(c)
  # =============================================================================
  - rule_id: combinatorial_formula
    instances:
      - name: court_fee_tiered_with_arbitration_branch
        grounds:
          - calculations.court_fee
          - entities.Case.fields.case_type
          - entities.Case.fields.claim_amount_cents
        distinguishing_aspect: |
          Mode (a): formula has ≥3 inputs (case_type, claim_amount_cents, TIER_LADDER)
          with non-linear interaction — tier selection cascades over a 4-bracket marginal
          ladder, and the case_type branch (ARBITRATION) applies a 0.5x post-multiplier
          AFTER per-bracket rounding. Removing any of the 3 inputs flips the result.
        test_recipe:
          setup:
            - "POST /lawyers — L_PARTNER (PARTNER)"
            - "POST /cases — case C1, CIVIL, claim_amount_cents=5000000 (=$50k), lead_lawyer_id=L_PARTNER → case_number assigned"
            - "POST /cases — case C2, ARBITRATION, claim_amount_cents=5000000 (=$50k)"
            - "Add PLAINTIFF+DEFENDANT to each, verified"
            - "POST /cases/C1/activate; POST /cases/C2/activate"
            - "POST /cases/C1/await-settlement; POST /cases/C2/await-settlement"
            - "POST /cases/C1/bills — FIXED, fixed_fee_cents=0, expense=0, recovery=0 → B1"
            - "POST /cases/C2/bills — FIXED, fixed_fee_cents=0, expense=0, recovery=0 → B2"
          trigger:
            - "POST /bills/B1/issue"
            - "POST /bills/B2/issue"
          assert:
            - "B1 (CIVIL): court_fee_cents == 170000  # bracket1 round(1000000*500/10000)=50000 + bracket2 round(4000000*300/10000)=120000 = 170000"
            - "B1.total_due_cents == 170000  # 170000 + 0 + 0 - 0"
            - "B2 (ARBITRATION): court_fee_cents == 85000  # round_half_up(170000 * 0.5) = 85000"
            - "B2.total_due_cents == 85000"

      - name: attorney_fee_hourly_per_entry_rounding_order
        grounds:
          - calculations.attorney_fee
          - entities.TimeEntry.fields.minutes
          - entities.TimeEntry.fields.adjustment_minutes
          - entities.TimeEntry.fields.hourly_rate_cents_pinned
        distinguishing_aspect: |
          Mode (b): nested rounding order. The scaffold pins ROUND-PER-ENTRY then SUM
          for HOURLY attorney_fee. With minutes=[7, 13, 23] and rate=10000 cents/hr:
          per-entry rounding gives round(7*10000/60)+round(13*10000/60)+round(23*10000/60)
          = round(1166.67)+round(2166.67)+round(3833.33) = 1167+2167+3833 = 7167.
          Sum-then-round gives round((7+13+23)*10000/60) = round(7166.67) = 7167… SAME here,
          but with minutes=[1,1,1] rate=100/hr: per-entry = round(1.67)*3 = 6, sum-then-round
          = round(5.0)=5. The chosen test uses minutes that DO diverge.
        test_recipe:
          setup:
            - "POST /lawyers — L_J (JUNIOR, rate=10000  # $100/hr)"
            - "POST /lawyers — L_P (PARTNER, rate=10000)"
            - "POST /cases — case C, CIVIL, claim_amount_cents=1000000 (=$10k boundary), lead_lawyer_id=L_P"
            - "Add PLAINTIFF+DEFENDANT verified; POST /cases/C/activate"
            - "POST /cases/C/time-entries — E1: lawyer=L_J, minutes=1, billable=true → pinned rate 10000; entry_fee=round(1*10000/60)=round(166.67)=167"
            - "POST /cases/C/time-entries — E2: lawyer=L_J, minutes=1, billable=true; entry_fee=167"
            - "POST /cases/C/time-entries — E3: lawyer=L_J, minutes=1, billable=true; entry_fee=167"
            - "POST /time-entries/E1/adjust adjustment_minutes=0; same for E2 and E3 → all ADJUSTED"
            - "POST /cases/C/await-settlement"
            - "POST /cases/C/bills — billing_mode=HOURLY → B"
          trigger:
            - "POST /bills/B/issue"
          assert:
            - "Bill.attorney_fee_cents == 501  # 167+167+167 (sum-of-per-entry-rounded)"
            - "If implementation used sum-then-round it would yield 500 (round(3*10000/60)=round(500.0)=500)"
            - "501 != 500 — rounding-order distinction is observable"

      - name: total_due_evaluation_order_pinned
        grounds:
          - calculations.total_due
          - calculations.court_fee
          - calculations.attorney_fee
        distinguishing_aspect: |
          Mode (c): evaluation order is pinned because total_due depends on court_fee and
          attorney_fee both being computed first (each already rounded), then expense added,
          then cost_recovery subtracted, then a single final clamp to >= 0. Reversing the
          order — clamp before subtracting recovery, or subtract before adding expense —
          yields a different result when (court_fee + attorney_fee + expense) < cost_recovery.
        test_recipe:
          setup:
            - "POST /lawyers — L_P (PARTNER, rate=10000)"
            - "POST /cases — C, CIVIL, claim_amount_cents=1000000 (=$10k), lead_lawyer=L_P"
            - "Activate case with parties (PLAINTIFF+DEFENDANT verified)"
            - "POST /cases/C/await-settlement"
            - "POST /cases/C/bills — billing_mode=FIXED, fixed_fee_cents=0, expense_reimbursement_cents=10000, cost_recovery_cents=200000 → B"
          trigger:
            - "POST /bills/B/issue"
          assert:
            - "Bill.court_fee_cents == 50000  # CIVIL bracket1: round(1000000*500/10000)=50000"
            - "Bill.attorney_fee_cents == 0  # FIXED with fixed_fee_cents=0"
            - "Bill.total_due_cents == 0  # max(0, 50000 + 0 + 10000 - 200000) = max(0, -140000) = 0"

  # =============================================================================
  # Rule 3 — Non-linear state-machine shape on DIFFERENT entities
  # =============================================================================
  - rule_id: non_linear_state_machine
    instances:
      - name: document_draft_review_revision_cycle
        grounds:
          - state_machines.DocumentDraft.IN_REVIEW_to_REVISING
          - state_machines.DocumentDraft.REVISING_to_DRAFTING
          - state_machines.DocumentDraft.DRAFTING_to_IN_REVIEW
          - state_machines.DocumentDraft.IN_REVIEW_to_DRAFTING
          - state_machines.DocumentDraft.IN_REVIEW_to_SIGNED_OFF
        distinguishing_aspect: |
          DocumentDraft state machine is cyclic on the DocumentDraft entity:
          DRAFTING → IN_REVIEW → REVISING → DRAFTING → IN_REVIEW (revision loop).
          The IN_REVIEW state also branches: senior-pass returns to DRAFTING, while
          partner-signoff advances to SIGNED_OFF — fork-join from a single state.
          Pure linear A→B→C cannot represent these revision rounds.
        test_recipe:
          setup:
            - "POST /lawyers — L_DRAFTER (JUNIOR), L_SENIOR (SENIOR), L_PARTNER (PARTNER)"
            - "POST /cases — C, CIVIL, claim=5000000, lead=L_PARTNER; activate with parties"
            - "POST /document-templates — T (case_type=CIVIL)"
            - "POST /document-drafts — D (case=C, template=T, drafter=L_DRAFTER) → DRAFTING"
          trigger:
            - "POST /document-drafts/D/submit-for-review (as L_DRAFTER) → IN_REVIEW"
            - "POST /document-drafts/D/request-revisions (as L_SENIOR) → REVISING"
            - "POST /document-drafts/D/resume-drafting (as L_DRAFTER) → DRAFTING"
            - "POST /document-drafts/D/submit-for-review (as L_DRAFTER) → IN_REVIEW (cycle)"
          assert:
            - "DocumentDraft.status sequence observed: DRAFTING → IN_REVIEW → REVISING → DRAFTING → IN_REVIEW (cycle confirmed)"
            - "DocumentDraft.version increments at each transition"

      - name: evidence_submitted_rebutted_cycle
        grounds:
          - state_machines.Evidence.SUBMITTED_to_REBUTTED
          - state_machines.Evidence.REBUTTED_to_SUBMITTED
          - state_machines.Evidence.SUBMITTED_to_EXCLUDED
          - state_machines.EvidenceRebuttal
        distinguishing_aspect: |
          Evidence state machine cycles on the Evidence entity (different entity than
          DocumentDraft): SUBMITTED → REBUTTED → SUBMITTED when a rebuttal is filed
          then dismissed. From SUBMITTED there is also a fork: a different rebuttal
          can be UPHELD instead, sending Evidence to EXCLUDED — diamond branching with
          divergent side effects (REBUTTED keeps evidence active; EXCLUDED kills it).
        test_recipe:
          setup:
            - "POST /lawyers — L_P (PARTNER), L_S (SENIOR), L_J (JUNIOR)"
            - "POST /cases — C, CIVIL, claim=5000000, lead=L_P; activate with parties"
            - "POST /evidence — E (case=C, type=DOCUMENTARY, collected_at=t0, collected_by=L_P)"
            - "POST /evidence/E/custody-events — t1 EXAMINED by L_P"
            - "POST /evidence/E/submit (as L_P) → SUBMITTED"
          trigger:
            - "POST /evidence/E/rebuttals (filed_by=L_J, ground='hearsay') → R1; Evidence SUBMITTED→REBUTTED"
            - "POST /rebuttals/R1/dismiss (as L_S) → DISMISSED; Evidence REBUTTED→SUBMITTED (cycle)"
          assert:
            - "Evidence.status observed sequence: SUBMITTED → REBUTTED → SUBMITTED (cycle confirmed)"
            - "After dismiss, Evidence.rebuttal_count == 1 (count is monotonic) but status returned to SUBMITTED"

  # =============================================================================
  # Rule 4 — Transitive cascade chains from DIFFERENT triggers
  # =============================================================================
  - rule_id: transitive_cascade
    instances:
      - name: case_close_cascade_depth_3
        grounds:
          - state_machines.Case.AWAITING_SETTLEMENT_to_CLOSED
          - state_machines.DocumentDraft.DRAFTING_to_RETIRED
          - state_machines.DocumentDraft.IN_REVIEW_to_RETIRED
          - state_machines.DocumentDraft.REVISING_to_RETIRED
          - calculations.final_settlement
          - entities.Case.fields.settlement_total_cents
          - entities.Case.fields.closed_at
        distinguishing_aspect: |
          Depth-3 cascade triggered by POST /cases/{id}/close:
          Step 1: Case.status AWAITING_SETTLEMENT → CLOSED, sets Case.closed_at.
          Step 2 (caused by step 1): final_settlement runs and writes
          Case.settlement_total_cents (uses TimeEntry.status=BILLED rows).
          Step 3 (caused by step 1): All non-terminal DocumentDraft rows transition to
          RETIRED, AND every OPEN EvidenceRebuttal transitions to DISMISSED — and that
          dismiss (step 3) ITSELF triggers (step 4) Evidence.status REBUTTED→SUBMITTED.
          Each link is caused by the previous, not by the original close action directly.
        test_recipe:
          setup:
            - "POST /lawyers — L_P (PARTNER), L_S (SENIOR), L_J (JUNIOR)"
            - "POST /cases — C, CIVIL, claim=5000000, lead=L_P; activate with parties"
            - "POST /document-templates — T (CIVIL)"
            - "POST /document-drafts — D (case=C, template=T, drafter=L_J) → DRAFTING"
            - "POST /evidence — E (case=C, DOCUMENTARY, t0, L_P); submit via L_P → SUBMITTED"
            - "POST /evidence/E/rebuttals (L_J, ground='x') → R; Evidence → REBUTTED"
            - "POST /cases/C/time-entries — TE: lawyer=L_P, 60min, billable=true; adjust to ADJUSTED"
            - "POST /cases/C/await-settlement (forces Case state ACTIVE→AWAITING_SETTLEMENT; locks SIGNED_OFF drafts — but D is still DRAFTING, not LOCKED yet)"
            - "POST /cases/C/bills — FIXED, fixed_fee_cents=10000 → B"
            - "POST /bills/B/issue → TE becomes BILLED"
            - "POST /_events/payment-received bill_id=B, amount_cents=Bill.total_due_cents → PAID"
          trigger:
            - "POST /cases/C/close"
          assert:
            - "Step 1: Case.status == CLOSED, Case.closed_at != null"
            - "Step 2: Case.settlement_total_cents != null and equals chronological replay output (computed by calc final_settlement)"
            - "Step 3: DocumentDraft D.status == RETIRED (was DRAFTING)"
            - "Step 3: EvidenceRebuttal R.status == DISMISSED (was OPEN)"
            - "Step 4 (cascade-of-cascade): Evidence E.status == SUBMITTED (was REBUTTED, returned because R was the only open rebuttal and was dismissed)"

      - name: case_hold_cascade_depth_2_to_hearing_to_posture
        grounds:
          - state_machines.Case.ACTIVE_to_ON_HOLD
          - state_machines.Hearing.SCHEDULED_to_CANCELLED
          - calculations.case_posture
          - entities.Case.fields.posture
        distinguishing_aspect: |
          Depth-2 cascade triggered by POST /cases/{id}/hold (DIFFERENT trigger from
          instance #1's close). Step 1: Case.status ACTIVE→ON_HOLD. Step 2 (caused by
          step 1): all SCHEDULED Hearings for the case transition to CANCELLED.
          Step 3 (caused by step 2's cancellation, not by the original hold directly):
          Case.posture is recomputed via calc case_posture, and because no SCHEDULED
          hearings remain within 24h (they are now CANCELLED) AND Case.status is
          ON_HOLD, posture flips to FROZEN. Each step is caused by the previous one.
        test_recipe:
          setup:
            - "POST /lawyers — L_P (PARTNER, rate=10000)"
            - "POST /cases — C, CIVIL, claim=5000000, lead=L_P; activate with parties"
            - "POST /_clock/advance to fixed_t0 = 2026-06-01T12:00:00Z"
            - "POST /hearings — H1 (case=C, court_room=R1, start=t0+72h, end=t0+76h) → SCHEDULED"
          trigger:
            - "POST /cases/C/hold"
          assert:
            - "Step 1: Case.status == ON_HOLD"
            - "Step 2: Hearing H1.status == CANCELLED (cascade from hold)"
            - "Step 3: Case.posture == FROZEN (cascade from no-active-hearings AND case ON_HOLD; recomputed AFTER step 2)"

  # =============================================================================
  # Rule 5 — Validation priority conflicts across DIFFERENT error-category pairs
  # =============================================================================
  - rule_id: priority_pair_validation_conflict
    instances:
      - name: state_vs_business_safety_segregation_on_locked_draft
        grounds:
          - validations[priority=7]   # state: ERR_INVALID_STATE
          - validations[priority=9]   # business_safety: ERR_SEGREGATION_OF_DUTIES
          - state_machines.DocumentDraft.SIGNED_OFF_to_LOCKED
        distinguishing_aspect: |
          Error-category pair: state vs business_safety. When the drafter calls
          partner-signoff on their OWN draft that is ALREADY LOCKED, both checks
          fail simultaneously. Priority order pins state (ERR_INVALID_STATE) at
          priority 7 BEFORE segregation (priority 9). Test asserts the state error
          wins.
        test_recipe:
          setup:
            - "POST /lawyers — L_PARTNER (PARTNER)"
            - "POST /cases — C, CIVIL, claim=5000000, lead=L_PARTNER; activate with parties"
            - "POST /document-templates — T (CIVIL)"
            - "POST /document-drafts — D (case=C, template=T, drafter=L_PARTNER) → DRAFTING (drafter is also a partner — eligible for segregation conflict)"
            - "Submit-for-review via a different actor would normally apply, but since L_PARTNER drafted it, we need a co-partner. Create L_PARTNER2 (PARTNER); have L_PARTNER2 senior-pass and partner-signoff to reach SIGNED_OFF, then lock by L_PARTNER2 → LOCKED"
          trigger:
            - "POST /document-drafts/D/partner-signoff with X-User-Role=PartnerLawyer, X-User-ID=L_PARTNER (the drafter, on a LOCKED draft)"
          assert:
            - "Response status == 409"
            - "Response body data.error_id == 'ERR_INVALID_STATE'  # state precedes segregation"
            - "Response body data.error_id != 'ERR_SEGREGATION_OF_DUTIES'"

      - name: business_temporal_vs_business_constraint_on_hearing
        grounds:
          - validations[priority=12]  # business_temporal: ERR_HEARING_PAST_TIME
          - validations[priority=13]  # business_constraint: ERR_HEARING_ROOM_CONFLICT
        distinguishing_aspect: |
          Different error-category pair: business_temporal vs business_constraint.
          Submitting a Hearing in the past (scheduled_start < now()) AND in a court_room
          that already has a SCHEDULED hearing fails BOTH checks simultaneously. Priority
          order pins business_temporal at priority 12 BEFORE business_constraint at 13,
          so ERR_HEARING_PAST_TIME wins over ERR_HEARING_ROOM_CONFLICT.
        test_recipe:
          setup:
            - "POST /lawyers — L_P (PARTNER)"
            - "POST /cases — C, CIVIL, claim=5000000, lead=L_P; activate with parties"
            - "POST /_clock/advance to t0 = 2026-06-01T12:00:00Z"
            - "POST /hearings — H_existing (case=C, court_room=R1, start=t0+72h, end=t0+76h)"
            - "POST /_clock/advance to t0+100h  # now H_existing is past, but still SCHEDULED until completed"
            - "POST /hearings/H_existing/complete  # set to COMPLETED so it does NOT block; recreate a still-SCHEDULED conflict"
            - "POST /hearings — H_block (case=C, court_room=R1, start=t0+200h, end=t0+204h) → SCHEDULED"
          trigger:
            - "POST /hearings (case=C, court_room=R1, scheduled_start=t0+50h (PAST relative to t0+100h), scheduled_end=t0+54h)"
          assert:
            - "Response status == 422  # ERR_HEARING_PAST_TIME wins (priority 12)"
            - "Response body data.error_id == 'ERR_HEARING_PAST_TIME'"
            - "Response body data.error_id != 'ERR_HEARING_ROOM_CONFLICT'"

  # =============================================================================
  # Rule 6 — Boundary-precision checks on DIFFERENT metrics/endpoints
  # =============================================================================
  - rule_id: boundary_precision_check
    instances:
      - name: court_fee_tier_boundary_at_exactly_10k
        grounds:
          - calculations.court_fee
          - entities.Case.fields.claim_amount_cents
        distinguishing_aspect: |
          Boundary on a numeric metric (claim_amount_cents) at the bracket1/bracket2
          boundary of 1,000,000 cents (=$10k). At exactly 1,000,000, only bracket1
          contributes (slice = min(remaining=1000000, upper-lower=1000000) = 1000000;
          remaining→0; bracket2 is skipped because slice=0). Result: 50000. At
          1,000,001, bracket2 gets a 1-cent slice → round(1*300/10000)=0, total=50000.
          Tests both endpoints. Reachable via POST /bills/{id}/issue.
        test_recipe:
          setup:
            - "Two cases C_at and C_just_over with claim_amount_cents=1000000 and 1000001 respectively, both CIVIL"
            - "Activate both, await-settlement on both"
            - "Create FIXED bills with fixed_fee_cents=0, no expenses, no recovery"
          trigger:
            - "POST /bills/B_at/issue"
            - "POST /bills/B_just_over/issue"
          assert:
            - "B_at.court_fee_cents == 50000  # exactly bracket1 cap"
            - "B_just_over.court_fee_cents == 50000  # bracket2 contributes round(1*300/10000) = 0"

      - name: empty_evidence_set_at_close
        grounds:
          - state_machines.Case.AWAITING_SETTLEMENT_to_CLOSED
          - validations[priority=7]
          - entities.Evidence
        distinguishing_aspect: |
          Boundary on an empty-collection edge (different metric than instance #1's
          numeric tier crossing): a Case can close even with ZERO Evidence rows
          because the precondition is universally-quantified — "all Evidence rows have
          status in {SUBMITTED, EXCLUDED, REBUTTED}" trivially holds on the empty set.
          Reachable via POST /cases/{id}/close. The dual to this on the same endpoint
          would be one OPEN rebuttal blocking close (already covered by close cascade).
        test_recipe:
          setup:
            - "POST /lawyers — L_P (PARTNER)"
            - "POST /cases — C, CIVIL, claim=5000000, lead=L_P; activate with parties"
            - "POST /cases/C/time-entries — TE adjusted to ADJUSTED"
            - "POST /cases/C/await-settlement"
            - "POST /cases/C/bills — FIXED fee=10000 → B; issue B; pay via /_events/payment-received → PAID"
          trigger:
            - "POST /cases/C/close  # zero Evidence rows for case"
          assert:
            - "Response status == 200"
            - "Case.status == CLOSED"
            - "GET /cases/C → response confirms zero Evidence rows AND close still succeeded"

  # =============================================================================
  # Rule 7 — Cross-entity state dependencies across DIFFERENT entity pairs
  # =============================================================================
  - rule_id: cross_entity_state_dependency
    instances:
      - name: time_entry_creation_depends_on_case_state
        grounds:
          - state_machines.Case
          - validations[priority=7]
          - validations[priority=16]
          - entities.TimeEntry.fields.case_id
        distinguishing_aspect: |
          Entity pair: TimeEntry → Case. Creating a TimeEntry requires Case.status
          == ACTIVE (and Case.posture != FROZEN). When Case is ON_HOLD, posture is
          FROZEN, and TimeEntry creation is rejected with ERR_CASE_POSTURE_FROZEN.
          The valid transitions on TimeEntry (LOGGED creation) depend on the state
          of a different entity (Case).
        test_recipe:
          setup:
            - "POST /lawyers — L_P (PARTNER, rate=10000)"
            - "POST /cases — C, CIVIL, claim=5000000, lead=L_P; activate with parties"
            - "POST /cases/C/hold  # Case.status → ON_HOLD; posture cascades to FROZEN"
          trigger:
            - "POST /cases/C/time-entries with lawyer_id=L_P, minutes=30, billable=true"
          assert:
            - "Response status == 409"
            - "Response body data.error_id == 'ERR_CASE_POSTURE_FROZEN'"

      - name: evidence_submit_depends_on_custody_chain_state
        grounds:
          - state_machines.Evidence.COLLECTED_to_SUBMITTED
          - validations[priority=10]
          - entities.CustodyEvent
        distinguishing_aspect: |
          DIFFERENT entity pair: Evidence → CustodyEvent (parent depends on child
          chain integrity). Submitting Evidence requires that the CustodyEvent chain
          be unbroken — every CustodyEvent.occurred_at strictly increasing AND last
          action != RETURNED. If a CustodyEvent with action=RETURNED was the latest,
          submission is rejected even though Evidence.status is the right starting
          state. The valid transition on Evidence depends on the aggregate state of
          its child CustodyEvent rows.
        test_recipe:
          setup:
            - "POST /lawyers — L_P (PARTNER), L_J (JUNIOR)"
            - "POST /cases — C, CIVIL, claim=5000000, lead=L_P; activate with parties"
            - "POST /evidence — E (case=C, DOCUMENTARY, collected_at=t0, collected_by=L_P)"
            - "POST /evidence/E/custody-events — t1 TRANSFERRED to L_J"
            - "POST /evidence/E/custody-events — t2 RETURNED by L_J (chain broken from a submission perspective)"
          trigger:
            - "POST /evidence/E/submit (as L_P)"
          assert:
            - "Response status == 409"
            - "Response body data.error_id == 'ERR_CUSTODY_CHAIN_BROKEN'"
            - "Evidence.status remains COLLECTED (transition refused)"

  # =============================================================================
  # Rule 8 — Resource temporal-overlap conflicts across DIFFERENT interval semantics
  # =============================================================================
  - rule_id: resource_temporal_overlap
    instances:
      - name: court_room_half_open_overlap
        grounds:
          - validations[priority=13]
          - entities.Hearing.fields.court_room
          - entities.Hearing.fields.scheduled_start
          - entities.Hearing.fields.scheduled_end
        distinguishing_aspect: |
          Resource = court_room. Interval semantics: HALF-OPEN [start, end) — an existing
          hearing [10:00, 12:00) and a new hearing [12:00, 14:00) are TOUCHING but DO NOT
          overlap and are accepted. An overlap inside the existing window — e.g.,
          [11:00, 13:00) — IS rejected. No travel buffer applies on the room dimension.
        test_recipe:
          setup:
            - "POST /lawyers — L_P (PARTNER)"
            - "POST /cases — C, CIVIL, claim=5000000, lead=L_P; activate with parties"
            - "POST /_clock/advance to t0 = 2026-06-01T08:00:00Z"
            - "POST /hearings — H1 (case=C, court_room=R1, start=t0+2h, end=t0+4h) → SCHEDULED"
          trigger:
            - "POST /hearings — H_touch (case=C, court_room=R1, start=t0+4h, end=t0+6h)  # touching boundary, should succeed"
            - "POST /hearings — H_overlap (case=C, court_room=R1, start=t0+3h, end=t0+5h)  # overlaps inside H1"
          assert:
            - "H_touch creation: response status == 201 (touching at exact boundary is allowed under half-open semantics)"
            - "H_overlap creation: response status == 409, error_id == 'ERR_HEARING_ROOM_CONFLICT'"

      - name: lead_lawyer_30min_travel_buffer_overlap
        grounds:
          - validations[priority=14]
          - entities.Hearing.fields.lead_lawyer_id
        distinguishing_aspect: |
          DIFFERENT interval semantics from instance #1: BUFFERED — a 30-minute
          travel buffer is required between a lead lawyer's hearings (next.start
          must be >= prev.end + 30min). Touching at boundary is REJECTED here, in
          contrast to court_room which accepts touching. DIFFERENT resource entity
          (lead_lawyer_id, not court_room).
        test_recipe:
          setup:
            - "POST /lawyers — L_P (PARTNER) used as lead on TWO different cases"
            - "POST /cases — C1, C2 (CIVIL, claim=5000000, lead=L_P); activate with parties on both"
            - "POST /_clock/advance to t0 = 2026-06-01T08:00:00Z"
            - "POST /hearings — H1 (case=C1, court_room=R1, start=t0+2h, end=t0+4h) → SCHEDULED"
          trigger:
            - "POST /hearings — H_buffer_violation (case=C2, court_room=R2 (different room!), start=t0+4h, end=t0+5h)  # touching at boundary, but lawyer needs 30-min buffer"
            - "POST /hearings — H_buffer_ok (case=C2, court_room=R2, start=t0+4h+30min, end=t0+5h+30min)  # exactly at buffer edge"
          assert:
            - "H_buffer_violation creation: response status == 409, error_id == 'ERR_LAWYER_SCHEDULE_CONFLICT'  # touching is REJECTED on lawyer dimension (buffered semantics)"
            - "H_buffer_ok creation: response status == 201  # 30-min buffer respected, accepted"

  # =============================================================================
  # Rule 9 — Compensating-action invariants across DIFFERENT conserved quantities
  # =============================================================================
  - rule_id: compensating_invariant
    instances:
      - name: bill_void_time_entry_billed_minutes_invariant
        grounds:
          - state_machines.Bill.DRAFT_to_VOIDED
          - state_machines.Bill.DRAFT_to_ISSUED
          - entities.TimeEntry.fields.status
          - entities.TimeEntry.fields.minutes
          - entities.TimeEntry.fields.adjustment_minutes
        distinguishing_aspect: |
          Conserved quantity: SUM over case's TimeEntries of (minutes + adjustment_minutes)
          where billable=true (the "total billable minutes" pool). Issue → BILL transitions
          all ADJUSTED entries to BILLED but does NOT change minutes/adjustment_minutes.
          Void rolls BILLED entries back to ADJUSTED and again does NOT change minutes.
          INVARIANT: sum_minutes_billable_pool BEFORE issue == AFTER issue == AFTER void.
          Compensating action (void) leaves the pool literally untouched.
        test_recipe:
          setup:
            - "POST /lawyers — L_P (PARTNER, rate=10000)"
            - "POST /cases — C, CIVIL, claim=5000000, lead=L_P; activate with parties"
            - "POST /cases/C/time-entries — TE1 (60min, billable=true); TE2 (45min, billable=true); TE3 (30min, billable=false)"
            - "PATCH /time-entries/TE1/adjust adjustment_minutes=+5"
            - "PATCH /time-entries/TE2/adjust adjustment_minutes=-10"
            - "POST /cases/C/await-settlement"
            - "POST /cases/C/bills — billing_mode=HOURLY → B"
            - "Snapshot: pool_before = sum((minutes+adjustment_minutes) for billable TE) = (60+5)+(45-10) = 100"
          trigger:
            - "POST /bills/B/issue   # TE1, TE2 → BILLED"
            - "POST /bills/B/void    # TE1, TE2 → ADJUSTED (compensation)"
          assert:
            - "After issue: pool == (60+5)+(45-10) == 100 (unchanged)"
            - "After void: pool == (60+5)+(45-10) == 100 (still unchanged)"
            - "TimeEntry.status returns to ADJUSTED for TE1 and TE2 (was BILLED)"
            - "TE3 (non-billable) excluded throughout"

      - name: evidence_rebut_then_dismiss_status_invariant
        grounds:
          - state_machines.Evidence.SUBMITTED_to_REBUTTED
          - state_machines.Evidence.REBUTTED_to_SUBMITTED
          - state_machines.EvidenceRebuttal
          - entities.Evidence.fields.status
        distinguishing_aspect: |
          DIFFERENT conserved quantity from instance #1 (which conserved a numeric
          minutes pool): here the conserved quantity is an OBSERVABLE-PAIR over the
          case's evidence — specifically, the count of Evidence rows with status
          in {SUBMITTED} (active-submitted count). After file-rebuttal then dismiss,
          this count must return to its pre-rebuttal value. Compensating action
          (dismiss) reverses the file (rebuttal-creation) move on the conserved set.
          Different conserved quantity TYPE (set membership count) than instance #1
          (sum of integer minutes).
        test_recipe:
          setup:
            - "POST /lawyers — L_P (PARTNER), L_S (SENIOR), L_J (JUNIOR)"
            - "POST /cases — C, CIVIL, claim=5000000, lead=L_P; activate with parties"
            - "POST /evidence — E1 (case=C, DOCUMENTARY, t0, L_P); submit → SUBMITTED"
            - "POST /evidence — E2 (case=C, DOCUMENTARY, t0, L_P); submit → SUBMITTED"
            - "Snapshot: count_submitted_before = 2"
          trigger:
            - "POST /evidence/E1/rebuttals (filed_by=L_J, ground='x') → R1; E1 → REBUTTED"
            - "Snapshot mid: count_submitted_during = 1 (only E2 still SUBMITTED)"
            - "POST /rebuttals/R1/dismiss (as L_S) → DISMISSED; E1 returns SUBMITTED (cycle)"
          assert:
            - "count_submitted_before == 2"
            - "count_submitted_during == 1 (rebuttal moved E1 out of SUBMITTED set)"
            - "count_submitted_after == 2 (compensating action restored membership)"
            - "Invariant: count_submitted_after == count_submitted_before (set count conserved across rebut+dismiss pair)"
