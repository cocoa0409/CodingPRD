            - call: "POST /price-integrity/regulatory-inspections"
              payload: { store_id: "${store_a}", scanner_audit_id: "${audit_1}", inspector_ref: "INS-77", inspection_date: "2026-08-01T16:00:00Z" }
              as: ComplianceOfficer
              captures: { insp_1: $.data.id }
            - call: "POST /price-integrity/regulatory-inspections/${insp_1}/issue-findings"
              payload: { findings: [{ finding_code: "SHELF_TAG_MISMATCH", severity: "MAJOR", affected_item_count: 4 }, { finding_code: "UNIT_PRICE_FORMAT", severity: "MINOR", affected_item_count: 1 }] }
              as: ComplianceOfficer
            - call: "GET /price-integrity/regulatory-inspections/${insp_1}/findings"
              as: ComplianceOfficer
              captures: { find_1: "$.data[0].id", find_2: "$.data[1].id" }
            - call: "POST /price-integrity/inspection-findings/${find_2}/transition"
              payload: { target_status: "WAIVED", waiver_reason: "Signage reprinted before the inspector left" }
