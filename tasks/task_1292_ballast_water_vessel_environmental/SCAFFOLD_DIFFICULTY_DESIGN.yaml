          assert:
            - "${da_basis} == EXCHANGE_COMPLIANT AND ${da_exch} == 400.0 (distance 200.0 >= plan 200 — inclusive)"
            - "${db_basis} == NONCOMPLIANT_NO_METHOD AND ${db_noncomp} == 400.0 (distance 199.999 < 200)"

      - name: tank_balance_exactly_zero_then_overdraft
        grounds:
          - validations[priority=15]
          - errors[ERR_TANK_BALANCE_NEGATIVE]
        distinguishing_aspect: |
          Metric per-tank chronological balance via POST .../ballast-events: the balance may land on
          exactly zero (UPTAKE 500 then DISCHARGE 500 accepted) but one further 0.001 m3 discharge tips
          the running balance negative and is rejected — zero is the inclusive floor, anything below
          triggers ERR_TANK_BALANCE_NEGATIVE.
        test_recipe:
          setup:
            - "Clock 2026-08-01T00:00:00Z; vessel with APPROVED plan; voyage V7004 IN_PROGRESS"
            - "Tank T5: UPTAKE 500 then DISCHARGE 500 (balance exactly 0)"
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-08-01T00:00:00Z" }
              as: PlatformAdmin
            - call: "POST /vessels"
              payload: { imo_number: "9000018", vessel_name: "MV Shearwater", bwms_type: TREATMENT_USCG_TYPE_APPROVED, bwms_installation_date: "2025-01-15T00:00:00Z", gross_tonnage: 40000, keel_laid_date: "2010-10-01T00:00:00Z", ballast_capacity_m3: 30000 }
              as: ShoreComplianceOfficer
              captures: { v: $.data.id, v_ver: $.data.version }
            - call: "POST /vessels/${v}/plans"
              payload: { plan_revision: 1, approval_authority: USCG, approved_at: "2025-02-01T00:00:00Z", exchange_distance_nm: 200, sediment_management_included: true, expected_vessel_version: "${v_ver}" }
              as: ShoreComplianceOfficer
              captures: { p1: $.data.id }
            - call: "POST /vessels/${v}/plans/${p1}/submit"
              as: ShoreComplianceOfficer
            - call: "POST /vessels/${v}/plans/${p1}/approve"
              as: FlagSurveyor
            - call: "POST /vessels/${v}/voyages"
              payload: { voyage_number: "V7004", departure_port: USNYC, arrival_port: USLAX, departed_at: "2026-07-28T00:00:00Z", crosses_captain_of_port_zones: true, enters_us_eez: true }
              as: VesselMaster
              captures: { vy: $.data.id }
            - call: "POST /vessels/${v}/voyages/${vy}/depart"
              as: VesselMaster
            - call: "GET /vessels/${v}/voyages/${vy}"
              as: VesselMaster
              captures: { w1: $.data.version }
            - call: "POST /vessels/${v}/voyages/${vy}/ballast-events"
              payload: { event_kind: UPTAKE, occurred_at: "2026-07-28T06:00:00Z", tank_id: "T5", volume_m3: 500, salinity_ppt: 32.0, source_port_locode: USNYC, expected_voyage_version: "${w1}" }
              as: VesselMaster
            - call: "GET /vessels/${v}/voyages/${vy}"
              as: VesselMaster
              captures: { w2: $.data.version }
            - call: "POST /vessels/${v}/voyages/${vy}/ballast-events"
              payload: { event_kind: DISCHARGE, occurred_at: "2026-07-29T06:00:00Z", tank_id: "T5", volume_m3: 500, latitude: 35.0, longitude: -140.0, distance_from_shore_nm: 250, expected_voyage_version: "${w2}" }
              as: VesselMaster
            - call: "GET /vessels/${v}/voyages/${vy}"
              as: VesselMaster
              captures: { w3: $.data.version }
          trigger:
            - call: "POST /vessels/${v}/voyages/${vy}/ballast-events"
              payload: { event_kind: DISCHARGE, occurred_at: "2026-07-30T06:00:00Z", tank_id: "T5", volume_m3: 0.001, latitude: 35.0, longitude: -140.0, distance_from_shore_nm: 250, expected_voyage_version: "${w3}" }
              as: VesselMaster
              captures: { err: "$.data.error_id" }
          assert:
            - "DISCHARGE of exactly 500 after UPTAKE 500 was accepted (balance 0 is allowed)"
            - "${err} == ERR_TANK_BALANCE_NEGATIVE (0.001 m3 more tips the chronological balance below zero)"
            - "HTTP status == 422"
            - "GET ballast-events?tank_id=T5 returns total_count == 2 (rejected event not persisted)"

  # ============================================================
  # Rule 7 — cross_entity_state_dependency (different entity pairs)
  # ============================================================
  - rule_id: cross_entity_state_dependency
    instances:
      - name: voyage_depart_requires_approved_plan
        grounds:
          - state_machines.Voyage.PENDING_to_IN_PROGRESS
          - state_machines.BallastWaterManagementPlan
        distinguishing_aspect: |
          Pair Voyage -> BallastWaterManagementPlan: depart is rejected while the vessel's only plan is
          DRAFT (precondition "at least one APPROVED plan"); after submit+approve of the SAME plan, the
          identical depart call succeeds — the voyage's transition set is gated by a sibling entity's state.
        test_recipe:
          setup:
            - "Clock 2026-08-01T00:00:00Z; vessel MV Skua with plan rev1 in DRAFT (never submitted); voyage V8001 PENDING"
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-08-01T00:00:00Z" }
              as: PlatformAdmin
            - call: "POST /vessels"
              payload: { imo_number: "9000019", vessel_name: "MV Skua", bwms_type: TREATMENT_USCG_TYPE_APPROVED, bwms_installation_date: "2025-01-15T00:00:00Z", gross_tonnage: 40000, keel_laid_date: "2010-10-01T00:00:00Z", ballast_capacity_m3: 30000 }
              as: ShoreComplianceOfficer
              captures: { v: $.data.id, v_ver: $.data.version }
            - call: "POST /vessels/${v}/plans"
              payload: { plan_revision: 1, approval_authority: USCG, approved_at: "2025-02-01T00:00:00Z", exchange_distance_nm: 200, sediment_management_included: true, expected_vessel_version: "${v_ver}" }
              as: ShoreComplianceOfficer
              captures: { p1: $.data.id }
            - call: "POST /vessels/${v}/voyages"
              payload: { voyage_number: "V8001", departure_port: USNYC, arrival_port: USLAX, departed_at: "2026-07-28T00:00:00Z", crosses_captain_of_port_zones: true, enters_us_eez: true }
              as: VesselMaster
              captures: { vy: $.data.id }
          trigger:
            - call: "POST /vessels/${v}/voyages/${vy}/depart"
              as: VesselMaster
              captures: { err: "$.data.error_id" }
            - call: "POST /vessels/${v}/plans/${p1}/submit"
              as: ShoreComplianceOfficer
            - call: "POST /vessels/${v}/plans/${p1}/approve"
              as: FlagSurveyor
            - call: "POST /vessels/${v}/voyages/${vy}/depart"
              as: VesselMaster
              captures: { cs: $.data.compliance_status, rs: $.data.reporting_status }
          assert:
            - "${err} == ERR_INVALID_STATE (no APPROVED plan — depart precondition fails)"
            - "HTTP status of first depart == 409"
            - "After plan approval, second depart succeeds: ${cs} == IN_PROGRESS AND ${rs} == DUE"

      - name: ballast_book_seal_requires_voyage_terminal
        grounds:
          - state_machines.RecordBook.OPEN_to_SEALED
          - state_machines.Voyage.IN_PROGRESS_to_COMPLIANT
        distinguishing_aspect: |
          Pair RecordBook -> Voyage: sealing the auto-created BALLAST_WATER book is rejected while the
          voyage is IN_PROGRESS; after arrival commits the voyage to COMPLIANT, the identical seal call
          succeeds — the book's transition depends on its sibling-scope voyage's compliance axis.
        test_recipe:
          setup:
            - "Clock 2026-08-01T00:00:00Z; vessel with APPROVED plan; voyage V8002 departed; BALLAST_WATER RecordBook auto-created OPEN"
            - "Tank T1 treatment-compliant event set posted (UPTAKE/TC/DISCHARGE 500)"
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-08-01T00:00:00Z" }
              as: PlatformAdmin
            - call: "POST /vessels"
              payload: { imo_number: "9000020", vessel_name: "MV Tern", bwms_type: TREATMENT_USCG_TYPE_APPROVED, bwms_installation_date: "2025-01-15T00:00:00Z", gross_tonnage: 40000, keel_laid_date: "2010-10-01T00:00:00Z", ballast_capacity_m3: 30000 }
              as: ShoreComplianceOfficer
              captures: { v: $.data.id, v_ver: $.data.version }
            - call: "POST /vessels/${v}/plans"
              payload: { plan_revision: 1, approval_authority: USCG, approved_at: "2025-02-01T00:00:00Z", exchange_distance_nm: 200, sediment_management_included: true, expected_vessel_version: "${v_ver}" }
              as: ShoreComplianceOfficer
              captures: { p1: $.data.id }
            - call: "POST /vessels/${v}/plans/${p1}/submit"
              as: ShoreComplianceOfficer
            - call: "POST /vessels/${v}/plans/${p1}/approve"
              as: FlagSurveyor
            - call: "POST /vessels/${v}/voyages"
              payload: { voyage_number: "V8002", departure_port: USNYC, arrival_port: USLAX, departed_at: "2026-07-28T00:00:00Z", arrived_at: "2026-08-10T00:00:00Z", crosses_captain_of_port_zones: true, enters_us_eez: true }
              as: VesselMaster
              captures: { vy: $.data.id }
            - call: "POST /vessels/${v}/voyages/${vy}/depart"
              as: VesselMaster
            - call: "GET /vessels/${v}/voyages/${vy}"
              as: VesselMaster
              captures: { w1: $.data.version }
            - call: "POST /vessels/${v}/voyages/${vy}/ballast-events"
              payload: { event_kind: UPTAKE, occurred_at: "2026-07-28T06:00:00Z", tank_id: "T1", volume_m3: 500, salinity_ppt: 32.5, source_port_locode: USNYC, expected_voyage_version: "${w1}" }
              as: VesselMaster
            - call: "GET /vessels/${v}/voyages/${vy}"
              as: VesselMaster
              captures: { w2: $.data.version }
            - call: "POST /vessels/${v}/voyages/${vy}/ballast-events"
              payload: { event_kind: TREATMENT_COMPLETE, occurred_at: "2026-07-29T06:00:00Z", tank_id: "T1", volume_m3: 500, expected_voyage_version: "${w2}" }
              as: VesselMaster
            - call: "GET /vessels/${v}/voyages/${vy}"
              as: VesselMaster
              captures: { w3: $.data.version }
            - call: "POST /vessels/${v}/voyages/${vy}/ballast-events"
              payload: { event_kind: DISCHARGE, occurred_at: "2026-07-30T06:00:00Z", tank_id: "T1", volume_m3: 500, latitude: 35.0, longitude: -140.0, distance_from_shore_nm: 250, expected_voyage_version: "${w3}" }
              as: VesselMaster
            - call: "GET /vessels/${v}/record-books"
              payload: { book_kind: BALLAST_WATER, voyage_id: "${vy}" }
              as: VesselMaster
              captures: { book: "$.data[0].id", book_st: "$.data[0].status" }
          trigger:
            - call: "POST /vessels/${v}/record-books/${book}/seal"
              as: VesselMaster
              captures: { err: "$.data.error_id" }
            - call: "POST /vessels/${v}/voyages/${vy}/arrive"
              payload: { arrived_at: "2026-08-10T00:00:00Z" }
              as: VesselMaster
            - call: "POST /vessels/${v}/record-books/${book}/seal"
              as: VesselMaster
              captures: { book_st2: $.data.status }
          assert:
            - "${book_st} == OPEN (auto-created at depart)"
            - "${err} == ERR_INVALID_STATE (voyage IN_PROGRESS — seal precondition requires COMPLIANT/NONCOMPLIANT/EXEMPT)"
            - "${book_st2} == SEALED (after voyage committed COMPLIANT)"

      - name: enforcement_close_compliant_blocked_by_open_records
        grounds:
          - state_machines.EnforcementCase.UNDER_REVIEW_to_CLOSED_COMPLIANT
          - state_machines.EnforcementCase.UNDER_REVIEW_to_CLOSED_PENALTY
          - state_machines.NoncomplianceRecord.OPEN_to_ESCALATED
        distinguishing_aspect: |
          Pair EnforcementCase -> NoncomplianceRecord: closing a case as CLOSED_COMPLIANT requires every
          linked record to be CLOSED; the linked record here is ESCALATED (terminal, cannot be closed), so
          penalty_assessed=false is rejected with ERR_INVALID_STATE while the same endpoint with
          penalty_assessed=true succeeds (CLOSED_PENALTY has no such precondition) — a branch-conditioned
          cross-entity gate.
        test_recipe:
          setup:
            - "Vessel with APPROVED plan; voyage V8003 departed, arrived_at input 2026-08-10 (report due 2026-08-09); report left DRAFT"
            - "Clock to 2026-08-09T00:00:01Z (OVERDUE, MINOR record), then 2026-09-15T00:00:02Z (record ESCALATED, case ACTIVE)"
            - "Operator submitted response: case UNDER_REVIEW"
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-08-01T00:00:00Z" }
              as: PlatformAdmin
            - call: "POST /vessels"
              payload: { imo_number: "9000021", vessel_name: "MV Uria", bwms_type: TREATMENT_USCG_TYPE_APPROVED, bwms_installation_date: "2025-01-15T00:00:00Z", gross_tonnage: 40000, keel_laid_date: "2010-10-01T00:00:00Z", ballast_capacity_m3: 30000 }
              as: ShoreComplianceOfficer
              captures: { v: $.data.id, v_ver: $.data.version }
            - call: "POST /vessels/${v}/plans"
              payload: { plan_revision: 1, approval_authority: USCG, approved_at: "2025-02-01T00:00:00Z", exchange_distance_nm: 200, sediment_management_included: true, expected_vessel_version: "${v_ver}" }
              as: ShoreComplianceOfficer
              captures: { p1: $.data.id }
            - call: "POST /vessels/${v}/plans/${p1}/submit"
              as: ShoreComplianceOfficer
            - call: "POST /vessels/${v}/plans/${p1}/approve"
              as: FlagSurveyor
            - call: "POST /vessels/${v}/voyages"
              payload: { voyage_number: "V8003", departure_port: USNYC, arrival_port: USLAX, departed_at: "2026-07-28T00:00:00Z", arrived_at: "2026-08-10T00:00:00Z", crosses_captain_of_port_zones: true, enters_us_eez: true }
              as: VesselMaster
              captures: { vy: $.data.id }
            - call: "POST /vessels/${v}/voyages/${vy}/depart"
              as: VesselMaster
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-08-09T00:00:01Z" }
              as: PlatformAdmin
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-09-15T00:00:02Z" }
              as: PlatformAdmin
            - call: "GET /vessels/${v}/enforcement-cases"
              as: ShoreComplianceOfficer
              captures: { case: "$.data[0].id" }
            - call: "POST /vessels/${v}/enforcement-cases/${case}/submit-response"
              as: ShoreComplianceOfficer
          trigger:
            - call: "POST /vessels/${v}/enforcement-cases/${case}/close"
              payload: { penalty_assessed: false }
              as: FlagSurveyor
              captures: { err: "$.data.error_id" }
            - call: "POST /vessels/${v}/enforcement-cases/${case}/close"
              payload: { penalty_assessed: true }
              as: FlagSurveyor
              captures: { case_st: $.data.status }
            - call: "GET /vessels/${v}"
              as: ShoreComplianceOfficer
              captures: { v_case: $.data.active_enforcement_case_id, v_posture: $.data.compliance_posture }
          assert:
            - "${err} == ERR_INVALID_STATE (CLOSED_COMPLIANT blocked: linked record ESCALATED != CLOSED)"
            - "HTTP status of first close == 409"
            - "${case_st} == CLOSED_PENALTY (penalty branch has no records-closed precondition)"
            - "Vessel.${v}.active_enforcement_case_id is null (${v_case} empty) AND ${v_posture} == OPEN"

      - name: inspection_close_requires_records_responded
        grounds:
          - state_machines.SamplingInspection.EVALUATED_to_CLOSED
          - state_machines.NoncomplianceRecord.OPEN_to_RESPONDED
        distinguishing_aspect: |
          Pair SamplingInspection -> NoncomplianceRecord: closing an exceeded inspection is rejected while
          its linked record is OPEN; after ShoreComplianceOfficer responds (record OPEN -> RESPONDED), the
          identical close call succeeds — the inspection's transition set depends on child record state.
        test_recipe:
          setup:
            - "Clock 2026-08-01T00:00:00Z; vessel with APPROVED plan; voyage V8004 IN_PROGRESS"
            - "FLAG_STATE inspection exceeded (organism 12.0) evaluated -> MAJOR record OPEN"
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-08-01T00:00:00Z" }
              as: PlatformAdmin
            - call: "POST /vessels"
              payload: { imo_number: "9000022", vessel_name: "MV Vireo", bwms_type: TREATMENT_USCG_TYPE_APPROVED, bwms_installation_date: "2025-01-15T00:00:00Z", gross_tonnage: 40000, keel_laid_date: "2010-10-01T00:00:00Z", ballast_capacity_m3: 30000 }
              as: ShoreComplianceOfficer
              captures: { v: $.data.id, v_ver: $.data.version }
            - call: "POST /vessels/${v}/plans"
              payload: { plan_revision: 1, approval_authority: USCG, approved_at: "2025-02-01T00:00:00Z", exchange_distance_nm: 200, sediment_management_included: true, expected_vessel_version: "${v_ver}" }
              as: ShoreComplianceOfficer
              captures: { p1: $.data.id }
            - call: "POST /vessels/${v}/plans/${p1}/submit"
              as: ShoreComplianceOfficer
            - call: "POST /vessels/${v}/plans/${p1}/approve"
              as: FlagSurveyor
            - call: "POST /vessels/${v}/voyages"
              payload: { voyage_number: "V8004", departure_port: USNYC, arrival_port: USLAX, departed_at: "2026-07-28T00:00:00Z", crosses_captain_of_port_zones: true, enters_us_eez: true }
              as: VesselMaster
              captures: { vy: $.data.id }
            - call: "POST /vessels/${v}/voyages/${vy}/depart"
              as: VesselMaster
            - call: "POST /vessels/${v}/voyages/${vy}/inspections"
              payload: { inspection_kind: FLAG_STATE, sampled_at: "2026-07-29T00:00:00Z", sampled_by_role: FLAG_SURVEYOR, indicator_organism_concentration: 12.0, tss_mg_per_l: 10.0, findings: ["BWMS-05"] }
              as: FlagSurveyor
              as_user_id: "fs-rec-4"
              captures: { i1: $.data.id }
            - call: "POST /vessels/${v}/voyages/${vy}/inspections/${i1}/evaluate"
              as: FlagSurveyor
              as_user_id: "fs-eval-4"
            - call: "GET /vessels/${v}/voyages/${vy}/noncompliance"
              as: ShoreComplianceOfficer
              captures: { nc: "$.data[0].id" }
          trigger:
            - call: "POST /vessels/${v}/voyages/${vy}/inspections/${i1}/close"
              as: FlagSurveyor
              captures: { err: "$.data.error_id" }
            - call: "POST /vessels/${v}/voyages/${vy}/noncompliance/${nc}/respond"
              as: ShoreComplianceOfficer
            - call: "POST /vessels/${v}/voyages/${vy}/inspections/${i1}/close"
              as: FlagSurveyor
              captures: { i_st: $.data.status }
          assert:
            - "${err} == ERR_INVALID_STATE (close blocked while linked record OPEN)"
            - "HTTP status of first close == 409"
            - "${i_st} == CLOSED (after record reached RESPONDED)"

  # ============================================================
  # Rule 8 — resource_temporal_overlap (different interval semantics)
  # ============================================================
  - rule_id: resource_temporal_overlap
    instances:
      - name: voyage_event_window_buffered_containment
        grounds:
          - validations[priority=7]
          - errors[ERR_EVENT_OUT_OF_WINDOW]
        distinguishing_aspect: |
          Interval semantic (1): symmetric +-6h buffered closed containment — a BallastWaterEvent's
          occurred_at instant must occupy the voyage's operational window [departed_at - 6h,
          arrived_at + 6h], inclusive of both bounds. Uptake at exactly departed_at - 6h
          (2026-07-27T18:00:00Z) is accepted; one second earlier (2026-07-27T17:59:59Z) collides with
          the buffer edge and is rejected with ERR_EVENT_OUT_OF_WINDOW.
        test_recipe:
          setup:
            - "Clock 2026-08-01T00:00:00Z; vessel with APPROVED plan; voyage V9001 departed 2026-07-28T00:00:00Z (window lower bound 2026-07-27T18:00:00Z)"
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-08-01T00:00:00Z" }
              as: PlatformAdmin
            - call: "POST /vessels"
