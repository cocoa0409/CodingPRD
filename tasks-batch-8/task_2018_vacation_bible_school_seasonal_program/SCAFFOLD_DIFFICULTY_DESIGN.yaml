            - { call: "POST /vbs/children", payload: { family_id: "${fam_id}", first_name: "Kid", last_name: "Needs", birth_date: "2020-03-15", grade_completed: "KINDERGARTEN", has_special_needs: true, allergy_summary: "peanuts" }, as: Parent, as_user_id: "${fam_id}", captures: { kid1: $.data.id, kid1_v: $.data.version } }
