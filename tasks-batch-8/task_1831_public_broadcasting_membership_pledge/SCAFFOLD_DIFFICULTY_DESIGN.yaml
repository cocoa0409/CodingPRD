              payload: { email: "d13@x.com", full_name: "Donor Thirteen", postal_code: "97213" }
              as: MembershipCoordinator
              captures: { donor13_id: $.data.id }
            - call: "POST /station/memberships"
              payload: { donor_id: "${donor13_id}", level_code: "BASIC" }
              as: MembershipCoordinator
              captures: { mem13_id: $.data.id }
            - call: "POST /station/pledge-drives"
              payload: { name: "Fall 2026", starts_at: "2026-08-01T00:00:00Z", ends_at: "2026-08-15T00:00:00Z", goal_cents: 100000 }
              as: StationAdmin
              captures: { drv13_id: $.data.id, drv13_v: $.data.version }
            - call: "POST /station/pledge-drives/${drv13_id}/breaks"
              payload: { starts_at: "2026-08-02T18:00:00Z", ends_at: "2026-08-02T18:20:00Z", program_title: "Evening Pledge", pitch_level_code: "BASIC", expected_drive_version: "${drv13_v}" }
              as: StationAdmin
            - call: "POST /station/pledge-drives/${drv13_id}/schedule"
              payload: {}
              as: StationAdmin
          trigger:
            - call: "POST /station/pledges"
              payload: { donor_id: "${donor13_id}", membership_id: "${mem13_id}", drive_id: "${drv13_id}", channel: "PHONE", kind: "ONE_TIME", amount_cents: 6000 }
              as: PhoneVolunteer
              captures: { err_not_open: $.data.error_id }
          assert:
            - "Pledge capture against a SCHEDULED (not ON_AIR) drive rejected with ERR_DRIVE_NOT_OPEN"
            - "${err_not_open} == ERR_DRIVE_NOT_OPEN"

      - name: sustainer_payment_depends_on_membership_status
        grounds:
          - state_machines.Pledge.PLEDGED_to_PAID
          - state_machines.Membership
        distinguishing_aspect: |
          Different entity pair — Pledge -> Membership (not Pledge ->
          PledgeDrive): a SUSTAINER pledge's payment posting is valid only
          while its Membership is ACTIVE or GRACE; a LAPSED membership that
          has not been reinstated rejects the installment.
        test_recipe:
          setup:
            - "Level BASIC; donor D; membership M (paid ONE_TIME 6000 on 2026-08-01, period end 2027-08-01)"
            - "Clock advanced to 2027-10-15 -> M LAPSED"
            - "SUSTAINER pledge PS captured earlier is still PLEDGED against M"
          setup_api_calls:
