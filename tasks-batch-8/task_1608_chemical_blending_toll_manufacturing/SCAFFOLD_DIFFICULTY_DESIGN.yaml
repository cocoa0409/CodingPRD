  # =========================================================================
  # Rule 3 — Non-linear state-machine shape on different entities
  # =========================================================================
  - rule_id: non_linear_state_machine
    instances:
      - name: batch_job_reject_qa_and_cancel_revert_paths
        grounds:
          - state_machines.BatchJob
          - state_machines.BatchJob.HOLD_QA_to_REJECTED_QA
          - state_machines.BatchJob.INTAKE_to_CANCELLED
          - state_machines.BatchJob.RELEASED_to_CANCELLED
        distinguishing_aspect: |
          BatchJob has branching with revert/compensation: HOLD_QA forks to
          either COMPLETED or REJECTED_QA (different side-effect sets), and
          both INTAKE and RELEASED can reach CANCELLED with different
          compensations (Tank cascade only fires from RELEASED).
        test_recipe:
          setup:
            - "Customer C5, PricingAgreement PA5 (TOLLING_FEE ACTIVE), Recipe R5 APPROVED, Lot L5 received, Tank T5 CLEAN_VALIDATED"
            - "BatchJob BJ5 created and RELEASED (tank RESERVED)"
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-08-01T00:00:00Z" }
              as: QualityManager
            - call: "POST /toll-operations/customers"
              payload: { legal_name: "Epsilon Resins" }
              as: QualityManager
              captures: { c5: $.data.id }
            - call: "POST /toll-operations/customers/${c5}/raw-material-lots"
              payload: { material_code: "RES", ghS_class: "NON_HAZ", quantity_kg_received: 1000, storage_zone: "Z_GENERAL", received_at: "2026-08-02T08:00:00Z" }
              as: BatchScheduler
              captures: { l5: $.data.id }
            - call: "POST /toll-operations/recipes"
              payload: { name: "Resin Mix", revision: 1, customer_id: "${c5}", target_density_kg_per_l: 1.1, theoretical_yield_pct: 92, components: [{ material_code: "RES", mass_fraction_pct: 100.000, charge_order: 1 }] }
              as: QualityManager
              captures: { r5: $.data.id }
            - call: "POST /toll-operations/recipes/${r5}/approve"
              payload: {}
              as: QualityManager
            - call: "POST /toll-operations/customers/${c5}/pricing-agreements"
              payload: { pricing_mode: "TOLLING_FEE", tolling_base_fee_cents: 2000, tolling_per_kg_cents: 8, formulated_price_per_kg_cents: 0, effective_from: "2026-08-01T00:00:00Z", effective_to: "2026-12-31T00:00:00Z" }
              as: QualityManager
              captures: { pa5: $.data.id, pa5_v: $.data.version }
            - call: "POST /toll-operations/customers/${c5}/pricing-agreements/${pa5}/activate"
              payload: { expected_pricing_agreement_version: "${pa5_v}" }
              as: QualityManager
            - call: "POST /toll-operations/tanks"
              payload: { tank_code: "TK-501", capacity_l: 1000, working_capacity_l: 1000, current_zone: "Z_GENERAL" }
              as: QualityManager
              captures: { t5: $.data.id }
            - call: "POST /toll-operations/tanks/${t5}/cleaning-records"
              payload: { method: "DRY_PURGE", started_at: "2026-08-02T08:00:00Z", completed_at: "2026-08-02T09:00:00Z", residue_ppm: 0 }
              as: TankOperator
              captures: { cr5: $.data.id }
            - call: "POST /toll-operations/tanks/${t5}/cleaning-records/${cr5}/submit"
              payload: {}
              as: TankOperator
            - call: "POST /toll-operations/tanks/${t5}/cleaning-records/${cr5}/validate"
              payload: { decision: "PASS" }
              as: QAValidator
            - call: "POST /toll-operations/customers/${c5}/batch-jobs"
              payload: { recipe_id: "${r5}", pricing_agreement_id: "${pa5}", tank_id: "${t5}", batch_size_l: 200, scheduled_start: "2026-09-20T08:00:00Z", scheduled_end: "2026-09-20T12:00:00Z" }
              as: BatchScheduler
              captures: { bj5: $.data.id, bj5_v: $.data.version }
            - call: "POST /toll-operations/customers/${c5}/batch-jobs/${bj5}/release"
              payload: { expected_batch_job_version: "${bj5_v}" }
              as: BatchScheduler
          trigger:
            - call: "POST /toll-operations/customers/${c5}/batch-jobs/${bj5}/cancel"
              payload: {}
              as: BatchScheduler
          assert:
            - "BatchJob.${bj5}.status == CANCELLED"
            - "Tank.${t5}.operational_state == AVAILABLE (cancel from RELEASED compensates tank)"
            - "Tank.${t5}.occupied_by_batch_id == null"
            - "Tank.${t5}.last_product_ghs == null (no material was drawn; cleaning_state still CLEAN_VALIDATED)"

      - name: tank_cleaning_state_machine_cyclic_revalidation
        grounds:
          - state_machines.Tank
          - entities.Tank.fields.cleaning_state
        distinguishing_aspect: |
          Tank.cleaning_state is a cyclic machine: DIRTY -> CLEANING_IN_PROGRESS
          -> CLEAN_PENDING_VALIDATION -> CLEAN_VALIDATED (happy path), and
          CLEAN_PENDING_VALIDATION -> DIRTY (rejection loops back), and any
          batch completion forces CLEAN_VALIDATED -> DIRTY. Distinct entity
          from BatchJob — exercises a different non-linear shape on a
          different resource class.
        test_recipe:
          setup:
            - "Tank T6 created (DIRTY by default)"
            - "CleaningRecord CR6 opened, submitted, then FAILed by QA (returns to DIRTY)"
          setup_api_calls:
            - call: "POST /toll-operations/tanks"
              payload: { tank_code: "TK-601", capacity_l: 500, working_capacity_l: 500, current_zone: "Z_GENERAL" }
              as: QualityManager
              captures: { t6: $.data.id }
            - call: "POST /toll-operations/tanks/${t6}/cleaning-records"
              payload: { method: "CAUSTIC_CIP", started_at: "2026-08-05T08:00:00Z", completed_at: "2026-08-05T09:00:00Z", residue_ppm: 200 }
              as: TankOperator
              captures: { cr6: $.data.id }
            - call: "POST /toll-operations/tanks/${t6}/cleaning-records/${cr6}/submit"
              payload: {}
              as: TankOperator
            - call: "POST /toll-operations/tanks/${t6}/cleaning-records/${cr6}/validate"
              payload: { decision: "FAIL" }
              as: QAValidator
          trigger:
            - call: "GET /toll-operations/tanks/${t6}"
              as: Any
              captures: { t6_cleaning: $.data.cleaning_state, t6_last_ghs: $.data.last_product_ghs }
            - call: "POST /toll-operations/tanks/${t6}/cleaning-records"
              payload: { method: "STEAM", started_at: "2026-08-06T08:00:00Z", completed_at: "2026-08-06T09:30:00Z", residue_ppm: 30 }
              as: TankOperator
              captures: { cr6b: $.data.id }
            - call: "POST /toll-operations/tanks/${t6}/cleaning-records/${cr6b}/submit"
              payload: {}
              as: TankOperator
            - call: "POST /toll-operations/tanks/${t6}/cleaning-records/${cr6b}/validate"
              payload: { decision: "PASS" }
              as: QAValidator
          assert:
            - "After FAIL: Tank.${t6}.cleaning_state == DIRTY (cycle back)"
            - "CleaningRecord.${cr6}.validation_outcome == FAILED"
            - "After re-clean + PASS: Tank.${t6}.cleaning_state == CLEAN_VALIDATED"
            - "Tank.${t6}.last_product_ghs == null (cleared on PASS)"
            - "CleaningRecord.${cr6b}.validation_outcome == PASSED"

  # =========================================================================
  # Rule 4 — Transitive cascade chains from different triggers
  # =========================================================================
  - rule_id: transitive_cascade
    instances:
      - name: batch_complete_cascades_tank_release_and_sds_lock
        grounds:
          - state_machines.BatchJob.HOLD_QA_to_COMPLETED
          - state_machines.Tank
          - entities.Tank.fields.last_product_ghs
          - entities.Tank.fields.cleaning_state
        distinguishing_aspect: |
          Trigger = POST /complete on BatchJob. Chain (depth >= 3):
          BatchJob(HOLD_QA->COMPLETED) -> Tank(IN_USE->AVAILABLE) which sets
          Tank.last_product_ghs := BatchJob.highest_component_ghs_snapshot
          AND Tank.cleaning_state := DIRTY, which then disqualifies any
          future BatchJob.release on this tank until a fresh cleaning cycle
          (so a downstream BatchJob in INTAKE pointing at this tank now
          fails its release precondition). Third hop is the new BatchJob's
          release attempt.
