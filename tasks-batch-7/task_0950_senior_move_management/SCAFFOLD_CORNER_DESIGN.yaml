      - name: ops_run_reports_its_counters_and_advances_the_ops_run_sequence
        claim_type: Action endpoint
        grounds: ['endpoints["POST /engagements/{id}/ops-run"]', 'calculations.milestone_overdue_latch', 'entities.Engagement.fields.ops_run_seq']
        distinguishing_aspect: "With the clock at 2026-05-12 only the ASSESSMENT milestone due 2026-05-11 is past due, so the first ops-run reports milestones_flagged_overdue 1, authorities_expired 0 and vendor_assignments_blocked 0, and Engagement.ops_run_seq advances 0 to 1 and then to 2 on a second call."
        test_recipe:
          setup: ["One HOURLY STUDIO engagement whose ASSESSMENT milestone is due 2026-05-11, with the clock moved to 2026-05-12."]
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-05-02T09:00:00.000Z" }
              as: MOVE_MANAGER
            - call: "POST /clients"
              payload: { full_name: "Ada Whitfield", phone: "+1-555-0142" }
              as: MOVE_MANAGER
              captures: { cl: "$.data.id" }
            - call: "POST /engagements"
              payload: { client_id: "${cl}", billing_mode: "HOURLY", home_tier: "STUDIO", scheduled_move_start_utc: "2026-06-15T14:00:00.000Z", mileage_miles: 22, origin_stairs_flights: 2, origin_long_carry_feet: 100 }
              as: MOVE_MANAGER
              captures: { eng: "$.data.id" }
            - call: "GET /milestones"
              payload: { engagement_id: "${eng}" }
              as: MOVE_MANAGER
              captures: { ms1: "$.data[0].id", ms2: "$.data[1].id" }
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-05-12T09:00:00.000Z" }
              as: MOVE_MANAGER
          trigger:
            - call: "POST /engagements/${eng}/ops-run"
              payload: {}
              as: MOVE_MANAGER
            - call: "POST /engagements/${eng}/ops-run"
              payload: {}
              as: PLATFORM_ADMIN
          assert:
            - "the first ops-run responds 200 with milestones_flagged_overdue == 1, authorities_expired == 0 and vendor_assignments_blocked == 0"
            - "the first ops-run reports ops_run_seq == 1"
            - "the second ops-run reports ops_run_seq == 2"
            - "Milestone.${ms1}.overdue_status == OVERDUE"
            - "Milestone.${ms2}.overdue_status == ON_TIME because its due_on 2026-05-25 is still ahead of the clock"

