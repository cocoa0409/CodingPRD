        claim_type: violation_to_error
        grounds:
          - errors[ERR_INVALID_REQUEST]
          - validations[priority=16]
        distinguishing_aspect: |
          POST /weddings/{id}/meal-options missing the required `max_servings` returns
          400 ERR_INVALID_REQUEST.
        test_recipe:
