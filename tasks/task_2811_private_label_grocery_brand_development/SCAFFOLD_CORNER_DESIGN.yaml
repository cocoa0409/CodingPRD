        distinguishing_aspect: |
          The audited variant reads the FINALIZED PlantAudit with the greatest window_end and ignores
          SCHEDULED audits entirely: with a 07-21 audit at yield 91.0, a 07-26 audit at yield 88.0 and a
          SCHEDULED 08-11 audit, the audited cost is round_half_up(221 / 0.88) + 40 = 291 - not 283 from the
          older audit and not a value derived from the unfinalized one. as_quoted stays 269 on quoted yield 96.5.
