  # =================================================================
  # Rule 5 — Validation priority conflicts across different error-category pairs
  # =================================================================
  - rule_id: priority_pair_validation_conflict
    instances:
      - name: placement_mismatch_beats_visa_noncompliant
        grounds:
          - validations[priority=6]
          - validations[priority=7]
          - errors[ERR_PLACEMENT_MISMATCH]
        distinguishing_aspect: "Category pair business_referential (p6 ERR_PLACEMENT_MISMATCH) vs business_safety (p7 ERR_VISA_NONCOMPLIANT): an international PROBATION student whose placement_level also mismatches the cohort gets ERR_PLACEMENT_MISMATCH (higher priority), not the visa error."
        test_recipe:
          setup:
            - "International student placed A1 but confirming into a B1 cohort, while also in visa_status PROBATION — both p6 and p7 would fail; p6 must win."
          setup_api_calls:
            - call: "POST /students"
              payload: { full_name: "Intl Mix", email: "imix@x.com", track: "GENERAL", is_international: true }
              as: Registrar
              captures: { stu_id: $.data.id }
            - call: "POST /placement-tests"
              payload: { student_id: "${stu_id}" }
              as: Registrar
              captures: { pt_id: $.data.id }
            - call: "POST /placement-tests/${pt_id}/score"
              payload: { raw_score: 10 }
              as: Instructor
            - call: "POST /students/${stu_id}/issue-i20"
              payload: {}
              as: DSO
            - call: "POST /cohorts"
              payload: { name: "B1-X", level: "B1", track: "GENERAL", capacity: 5, weekly_hours: 18, term_start: "2026-05-04T00:00:00Z", term_end: "2026-08-01T00:00:00Z", total_sessions: 40, base_tuition_cents: 100000, schedule_block: "MORNING" }
              as: Registrar
              captures: { cohort_id: $.data.id, cohort_v: $.data.version }
            - call: "POST /enrollments"
              payload: { student_id: "${stu_id}", cohort_id: "${cohort_id}" }
              as: Registrar
              captures: { enr_id: $.data.id }
          trigger:
            - call: "POST /enrollments/${enr_id}/confirm"
              payload: { expected_cohort_version: "${cohort_v}", require_seat: true }
              as: Registrar
              captures: { eid: $.data.error_id }
          assert:
            - "error.error_id == ERR_PLACEMENT_MISMATCH   # p6 beats p7 visa check"
            - "Enrollment.${enr_id}.status == PLACEMENT_PENDING   # unchanged"

      - name: invalid_state_beats_contract_seats_exhausted
        grounds:
          - validations[priority=5]
          - validations[priority=10]
          - errors[ERR_INVALID_STATE]
        distinguishing_aspect: "Category pair state (p5 ERR_INVALID_STATE) vs business_constraint (p10 ERR_CONTRACT_SEATS_EXHAUSTED): re-confirming an already-ENROLLED enrollment sponsored by an EXHAUSTED contract returns ERR_INVALID_STATE (state precondition is checked before the seat-exhaustion business rule)."
        test_recipe:
          setup:
            - "1-seat contract fully consumed by one ENROLLED sponsored student (contract EXHAUSTED); a second confirm call is issued against that SAME already-ENROLLED enrollment."
          setup_api_calls:
