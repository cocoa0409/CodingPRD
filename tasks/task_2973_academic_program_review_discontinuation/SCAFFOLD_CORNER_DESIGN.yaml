          setup:
            - "A NONVIABLE program with the rolling window 12000000 + 11000000 + 11000000, so severance_budget_cap_cents == 5100000, carrying one appointment a1 TENURED 1.00 fte at 12000000 cents."
            - "a1's notice_pay_cents is 12000000 (365 statutory days is a full year of salary), which exceeds the cap on its own, so a1 has reduction_sequence_position null, staffing_liability_cents is 0 and deferred_fte is 1.00."
            - "The DISCONTINUATION decision is RATIFIED with both auto-minted notices ACKNOWLEDGED, and its teach-out plan (no guarantees, no students) is APPROVED — every effectuation precondition except the fiscal one is satisfied."
