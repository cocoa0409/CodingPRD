            - call: "POST /halls"
              payload: { name: "Corner Hall 16", code: "CX16", tenant_mode: "MULTI_TENANT", design_kw_capacity: 400.00, gross_area_sqm: 600.0, cooling_redundancy: "N", planned_rack_count: 8 }
              as: FacilityPlanner
              captures: { hall_id: $.data.id }
            - call: "POST /tenants"
              payload: { name: "Meridian Cloud", code: "CXT16", contracted_kw: 100.00, contract_start_date: "2026-01-01T00:00:00Z" }
