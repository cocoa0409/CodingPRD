      - name: two_late_scheduled_check_ins_cross_the_escalation_threshold
        claim_type: rate_threshold_triggers
        grounds:
          - calculations.check_in_schedule
          - endpoints.POST_/exec-protection/trips/{id}/check-ins
          - state_machines.Trip.readiness_state.READY_to_DEGRADED
        distinguishing_aspect: |
          MISSED_CHECKIN_ESCALATION is a cumulative counter with three separate ways to not
          increment: a check-in arriving exactly at the due instant is on time because the
          comparison is strict, an AD_HOC check-in is never late however late it is, and only the
          second late SCHEDULED row crosses the threshold. Crossing it also re-selects the interval
