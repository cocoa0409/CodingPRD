        distinguishing_aspect: |
          Three different refusals defend one conserved quantity from three
          different angles: a RELEASE larger than THIS student's holding, a
          RELEASE by a student who holds nothing on this guarantee even though
          the guarantee itself has seats committed, and a WAIVE of a guarantee
          students still hold seats on. Once the seats are properly released the
