# =============================================================================
# §1.9 Scaffold Corner Design (Coverage Index for Non-Difficulty Tests)
# Breadth probe: every testable claim §1.1–§1.7 surface declares that §1.8 does
# not already cover. Sections/claim_types follow references/claim-extraction-guide.md.
# All formula-derived asserts are precomputed literals; all setup chains use only
# §1.5 endpoints with placeholder closure.
# =============================================================================
scaffold_corner_design:

  # ===========================================================================
  - section: entities
    instances:
      - name: create_consignor_returns_201_with_defaults
        claim_type: Creation
        grounds: [entities.Consignor.fields.status, entities.Consignor.fields.store_credit_cents]
        distinguishing_aspect: "POST /consignors with full_name+email -> 201; status defaults ACTIVE, store_credit_cents=0, unsettled_payable_cents=0, lifetime_payout_cents=0, version=1."
        test_recipe:
          setup: ["Empty DB."]
          setup_api_calls: []
          trigger:
            - call: "POST /consignors"
              payload: { full_name: "New Nora", email: "nora@x.com" }
              as: StoreAdmin
              captures: { cons_id: $.data.id }
          assert:
            - "POST /consignors -> 201"
            - "Consignor.${cons_id}.status == ACTIVE"
            - "Consignor.${cons_id}.store_credit_cents == 0"
            - "Consignor.${cons_id}.unsettled_payable_cents == 0"
            - "Consignor.${cons_id}.version == 1"

      - name: get_consignor_not_found_returns_404
        claim_type: Not Found
        grounds: [endpoints, "errors[ERR_NOT_FOUND]"]
        distinguishing_aspect: "GET /consignors/{nonexistent-uuid} -> 404 ERR_NOT_FOUND."
        test_recipe:
          setup: ["Empty DB."]
          setup_api_calls: []
          trigger:
            - call: "GET /consignors/00000000-0000-4000-8000-000000000000"
              payload: {}
              as: StoreAdmin
              captures: { err: $.data.error_id }
          assert:
            - "GET /consignors/{nonexistent} -> 404 ERR_NOT_FOUND"

      - name: create_consignor_missing_email_returns_invalid_request
        claim_type: Required Fields
        grounds: ["validations[priority=18]", "errors[ERR_INVALID_REQUEST]"]
        distinguishing_aspect: "POST /consignors with full_name but no email -> 400 ERR_INVALID_REQUEST (email is required input with no default)."
        test_recipe:
          setup: ["Empty DB."]
          setup_api_calls: []
          trigger:
            - call: "POST /consignors"
              payload: { full_name: "No Email" }
              as: StoreAdmin
              captures: { err: $.data.error_id }
          assert:
            - "POST /consignors -> 400 ERR_INVALID_REQUEST"

      - name: create_consignor_duplicate_email_returns_409
        claim_type: Type Constraints
        grounds: ["validations[priority=19]", "errors[ERR_DUPLICATE_EMAIL]"]
        distinguishing_aspect: "Second POST /consignors reusing an existing email -> 409 ERR_DUPLICATE_EMAIL."
        test_recipe:
          setup: ["One consignor already registered with email dup@x.com."]
          setup_api_calls:
            - call: "POST /consignors"
              payload: { full_name: "First", email: "dup@x.com" }
              as: StoreAdmin
          trigger:
            - call: "POST /consignors"
              payload: { full_name: "Second", email: "dup@x.com" }
              as: StoreAdmin
              captures: { err: $.data.error_id }
          assert:
            - "POST /consignors -> 409 ERR_DUPLICATE_EMAIL"

      - name: agreement_split_pct_out_of_range_returns_invalid_request
        claim_type: Type Constraints
        grounds: ["validations[priority=18]", entities.ConsignorAgreement.fields.split_pct, "errors[ERR_INVALID_REQUEST]"]
        distinguishing_aspect: "POST /agreements with split_pct=1.0 (not in open interval (0,1)) -> 400 ERR_INVALID_REQUEST."
        test_recipe:
          setup: ["One ACTIVE consignor and one non-archived schedule."]
          setup_api_calls:
            - call: "POST /markdown-schedules"
              payload: { name: "Std", tiers: [{min_age_days: 0, discount_pct: 0.0}], base_floor_pct: 0.30 }
              as: StoreAdmin
              captures: { sched_id: $.data.id }
            - call: "POST /consignors"
              payload: { full_name: "Range Ray", email: "range@x.com" }
              as: StoreAdmin
              captures: { cons_id: $.data.id }
          trigger:
            - call: "POST /agreements"
              payload: { consignor_id: "${cons_id}", markdown_schedule_id: "${sched_id}", split_pct: 1.0 }
              as: StoreAdmin
              captures: { err: $.data.error_id }
          assert:
            - "POST /agreements -> 400 ERR_INVALID_REQUEST"

      - name: list_consignors_pagination_envelope
        claim_type: Listing
        grounds: [endpoints, response_envelope.pagination_fields]
        distinguishing_aspect: "GET /consignors?limit=1&offset=0 returns response_type=array with total_count and has_more in meta/pagination."
        test_recipe:
          setup: ["Two consignors registered."]
          setup_api_calls:
            - call: "POST /consignors"
              payload: { full_name: "A", email: "a@x.com" }
              as: StoreAdmin
            - call: "POST /consignors"
              payload: { full_name: "B", email: "b@x.com" }
              as: StoreAdmin
          trigger:
            - call: "GET /consignors"
              payload: { limit: 1, offset: 0 }
              as: StoreAdmin
          assert:
            - "GET /consignors?limit=1 -> 200 response_type=array; total_count == 2; has_more == true; data length == 1"

      - name: pagination_limit_out_of_bounds_returns_400
        claim_type: Type Constraints
        grounds: ["errors[ERR_VALIDATION_PAGINATION]"]
        distinguishing_aspect: "GET /consignors?limit=101 (above max 100) -> 400 ERR_VALIDATION_PAGINATION."
        test_recipe:
          setup: ["Empty DB."]
          setup_api_calls: []
          trigger:
            - call: "GET /consignors"
              payload: { limit: 101 }
              as: StoreAdmin
              captures: { err: $.data.error_id }
          assert:
            - "GET /consignors?limit=101 -> 400 ERR_VALIDATION_PAGINATION"

      - name: saleline_is_immutable_no_version_field
        claim_type: Immutability
        grounds: [entities.SaleLine]
        distinguishing_aspect: "SaleLine has common_fields:false — it carries id and created_at only, no version field, and no update endpoint exists for it."
        test_recipe:
          setup: ["One sale with one line (reuse a sold item)."]
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-06-01T00:00:00Z" }
              as: StoreAdmin
            - call: "POST /markdown-schedules"
              payload: { name: "Std", tiers: [{min_age_days: 0, discount_pct: 0.0}], base_floor_pct: 0.30 }
              as: StoreAdmin
              captures: { sched_id: $.data.id }
            - call: "POST /consignors"
              payload: { full_name: "Imm Ida", email: "imm@x.com" }
              as: StoreAdmin
              captures: { cons_id: $.data.id }
            - call: "POST /agreements"
              payload: { consignor_id: "${cons_id}", markdown_schedule_id: "${sched_id}", split_pct: 0.50 }
              as: StoreAdmin
              captures: { agr_id: $.data.id }
            - call: "POST /intake-batches"
              payload: { agreement_id: "${agr_id}" }
              as: IntakeGrader
              captures: { batch_id: $.data.id }
            - call: "POST /items"
              payload: { batch_id: "${batch_id}", title: "Imm coat" }
              as: IntakeGrader
              captures: { item_id: $.data.id, iv: $.data.version }
            - call: "POST /items/${item_id}/grade"
              payload: { decision: "ACCEPT", list_price_cents: 5000, expected_item_version: "${iv}" }
              as: IntakeGrader
            - call: "POST /items/${item_id}/list"
              payload: {}
              as: IntakeGrader
            - call: "POST /sales"
              payload: { lines: [{item_id: "${item_id}"}], payment_method: "CARD" }
              as: CashierClerk
              captures: { sale_id: $.data.id }
          trigger:
            - call: "GET /sales/${sale_id}/lines"
              payload: {}
              as: CashierClerk
          assert:
            - "GET /sales/${sale_id}/lines -> data[0] has id and created_at but no version field"

  # ===========================================================================
  - section: state_machines
    instances:
      - name: grade_already_graded_item_returns_invalid_state
        claim_type: Invalid Transitions
        grounds: [state_machines.Item.PENDING_GRADE_to_ACCEPTED, "errors[ERR_INVALID_STATE]"]
        distinguishing_aspect: "A second grade on an already-ACCEPTED item (grading_status != PENDING_GRADE) -> 409 ERR_INVALID_STATE."
        test_recipe:
          setup: ["One item already graded ACCEPTED."]
          setup_api_calls:
            - call: "POST /markdown-schedules"
              payload: { name: "Std", tiers: [{min_age_days: 0, discount_pct: 0.0}], base_floor_pct: 0.30 }
              as: StoreAdmin
              captures: { sched_id: $.data.id }
            - call: "POST /consignors"
              payload: { full_name: "Reg Rex", email: "rex@x.com" }
              as: StoreAdmin
              captures: { cons_id: $.data.id }
            - call: "POST /agreements"
              payload: { consignor_id: "${cons_id}", markdown_schedule_id: "${sched_id}", split_pct: 0.50 }
              as: StoreAdmin
              captures: { agr_id: $.data.id }
            - call: "POST /intake-batches"
              payload: { agreement_id: "${agr_id}" }
              as: IntakeGrader
              captures: { batch_id: $.data.id }
            - call: "POST /items"
              payload: { batch_id: "${batch_id}", title: "Coat" }
              as: IntakeGrader
              captures: { item_id: $.data.id, iv: $.data.version }
            - call: "POST /items/${item_id}/grade"
              payload: { decision: "ACCEPT", list_price_cents: 5000, expected_item_version: "${iv}" }
              as: IntakeGrader
              captures: { iv2: $.data.version }
          trigger:
            - call: "POST /items/${item_id}/grade"
              payload: { decision: "REJECT", expected_item_version: "${iv2}" }
              as: IntakeGrader
              captures: { err: $.data.error_id }
          assert:
            - "second POST /items/${item_id}/grade -> 409 ERR_INVALID_STATE"

      - name: grade_accept_without_list_price_returns_422
        claim_type: Precondition Enforcement
        grounds: [state_machines.Item.PENDING_GRADE_to_ACCEPTED, "errors[ERR_LIST_PRICE_REQUIRED]"]
        distinguishing_aspect: "Grade ACCEPT omitting list_price_cents -> 422 ERR_LIST_PRICE_REQUIRED (list price required to accept)."
        test_recipe:
          setup: ["One PENDING_GRADE item."]
          setup_api_calls:
            - call: "POST /markdown-schedules"
              payload: { name: "Std", tiers: [{min_age_days: 0, discount_pct: 0.0}], base_floor_pct: 0.30 }
              as: StoreAdmin
              captures: { sched_id: $.data.id }
            - call: "POST /consignors"
              payload: { full_name: "Lp Lou", email: "lp@x.com" }
              as: StoreAdmin
              captures: { cons_id: $.data.id }
            - call: "POST /agreements"
              payload: { consignor_id: "${cons_id}", markdown_schedule_id: "${sched_id}", split_pct: 0.50 }
              as: StoreAdmin
              captures: { agr_id: $.data.id }
            - call: "POST /intake-batches"
              payload: { agreement_id: "${agr_id}" }
              as: IntakeGrader
              captures: { batch_id: $.data.id }
            - call: "POST /items"
              payload: { batch_id: "${batch_id}", title: "Coat" }
              as: IntakeGrader
              captures: { item_id: $.data.id, iv: $.data.version }
          trigger:
            - call: "POST /items/${item_id}/grade"
              payload: { decision: "ACCEPT", expected_item_version: "${iv}" }
              as: IntakeGrader
              captures: { err: $.data.error_id }
          assert:
            - "POST /items/${item_id}/grade ACCEPT without list_price_cents -> 422 ERR_LIST_PRICE_REQUIRED"

      - name: list_item_before_accepted_returns_invalid_state
        claim_type: Invalid Transitions
        grounds: [state_machines.Item.NOT_LISTED_to_ON_FLOOR, "errors[ERR_INVALID_STATE]"]
        distinguishing_aspect: "POST /items/{id}/list on a PENDING_GRADE item (grading_status != ACCEPTED) -> 409 ERR_INVALID_STATE."
        test_recipe:
          setup: ["One PENDING_GRADE item never graded."]
          setup_api_calls:
            - call: "POST /markdown-schedules"
              payload: { name: "Std", tiers: [{min_age_days: 0, discount_pct: 0.0}], base_floor_pct: 0.30 }
              as: StoreAdmin
              captures: { sched_id: $.data.id }
            - call: "POST /consignors"
              payload: { full_name: "Ls Liz", email: "ls@x.com" }
              as: StoreAdmin
              captures: { cons_id: $.data.id }
            - call: "POST /agreements"
              payload: { consignor_id: "${cons_id}", markdown_schedule_id: "${sched_id}", split_pct: 0.50 }
              as: StoreAdmin
              captures: { agr_id: $.data.id }
            - call: "POST /intake-batches"
              payload: { agreement_id: "${agr_id}" }
              as: IntakeGrader
              captures: { batch_id: $.data.id }
            - call: "POST /items"
              payload: { batch_id: "${batch_id}", title: "Coat" }
              as: IntakeGrader
              captures: { item_id: $.data.id }
          trigger:
            - call: "POST /items/${item_id}/list"
              payload: {}
              as: IntakeGrader
              captures: { err: $.data.error_id }
          assert:
            - "POST /items/${item_id}/list on PENDING_GRADE item -> 409 ERR_INVALID_STATE"

      - name: void_open_settlement_frees_date_for_new_settlement
        claim_type: Side Effect Execution
        grounds: [state_machines.DailySettlement.OPEN_to_VOIDED, "validations[priority=14]", entities.DailySettlement.fields.business_date]
        distinguishing_aspect: "Voiding the only OPEN settlement for a date frees that business_date so a fresh POST /settlements for the same date succeeds with 201 (no ERR_SETTLEMENT_DATE_TAKEN)."
        test_recipe:
          setup: ["One OPEN settlement for 2026-09-01, then voided."]
          setup_api_calls:
            - call: "POST /settlements"
              payload: { business_date: "2026-09-01" }
              as: SettlementManager
              captures: { s1: $.data.id }
            - call: "POST /settlements/${s1}/void"
              payload: {}
              as: SettlementManager
          trigger:
            - call: "POST /settlements"
              payload: { business_date: "2026-09-01" }
              as: SettlementManager
              captures: { s2: $.data.id }
          assert:
            - "POST /settlements after voiding -> 201"
            - "DailySettlement.${s1}.status == VOIDED"
            - "DailySettlement.${s2}.status == OPEN"

      - name: terminal_settlement_void_after_finalize_returns_invalid_state
        claim_type: Terminal State Lockdown
        grounds: [state_machines.DailySettlement.OPEN_to_VOIDED, "errors[ERR_INVALID_STATE]"]
        distinguishing_aspect: "Voiding a FINALIZED settlement (terminal) -> 409 ERR_INVALID_STATE; void is only defined from OPEN."
        test_recipe:
          setup: ["One FINALIZED settlement for 2026-09-02 with no sales."]
          setup_api_calls:
            - call: "POST /settlements"
              payload: { business_date: "2026-09-02" }
              as: SettlementManager
              captures: { s1: $.data.id, s1v: $.data.version }
            - call: "POST /settlements/${s1}/finalize"
              payload: { expected_settlement_version: "${s1v}" }
              as: SettlementManager
          trigger:
            - call: "POST /settlements/${s1}/void"
              payload: {}
              as: SettlementManager
              captures: { err: $.data.error_id }
          assert:
            - "POST /settlements/${s1}/void on FINALIZED settlement -> 409 ERR_INVALID_STATE"

      - name: reopen_in_review_returns_invalid_state
        claim_type: Invalid Transitions
        grounds: [state_machines.AuthenticationReview.DISPUTED_to_IN_REVIEW, "errors[ERR_INVALID_STATE]"]
        distinguishing_aspect: "POST /authentication-reviews/{id}/reopen on an IN_REVIEW (not DISPUTED) review -> 409 ERR_INVALID_STATE."
        test_recipe:
          setup: ["One auth-required item graded by U-GRADER with a fresh IN_REVIEW review opened by U-AUTH."]
          setup_api_calls:
            - call: "POST /markdown-schedules"
              payload: { name: "Std", tiers: [{min_age_days: 0, discount_pct: 0.0}], base_floor_pct: 0.30 }
              as: StoreAdmin
              captures: { sched_id: $.data.id }
            - call: "POST /consignors"
              payload: { full_name: "Rev Roy", email: "revroy@x.com" }
              as: StoreAdmin
              captures: { cons_id: $.data.id }
            - call: "POST /agreements"
              payload: { consignor_id: "${cons_id}", markdown_schedule_id: "${sched_id}", split_pct: 0.50 }
              as: StoreAdmin
              captures: { agr_id: $.data.id }
            - call: "POST /intake-batches"
              payload: { agreement_id: "${agr_id}" }
              as: IntakeGrader
              captures: { batch_id: $.data.id }
            - call: "POST /items"
              payload: { batch_id: "${batch_id}", title: "Branded", requires_authentication: true }
              as: IntakeGrader
              captures: { item_id: $.data.id, iv: $.data.version }
            - call: "POST /items/${item_id}/grade"
              payload: { decision: "ACCEPT", list_price_cents: 6000, expected_item_version: "${iv}" }
              as: IntakeGrader
              as_user_id: "U-GRADER"
            - call: "POST /authentication-reviews"
              payload: { item_id: "${item_id}" }
              as: Authenticator
              as_user_id: "U-AUTH"
              captures: { rev_id: $.data.id }
          trigger:
            - call: "POST /authentication-reviews/${rev_id}/reopen"
              payload: {}
              as: Authenticator
              as_user_id: "U-AUTH"
              captures: { err: $.data.error_id }
          assert:
            - "POST /authentication-reviews/${rev_id}/reopen from IN_REVIEW -> 409 ERR_INVALID_STATE"

      - name: add_item_to_closed_batch_returns_batch_closed
        claim_type: Precondition Enforcement
        grounds: [entities.IntakeBatch.fields.status, "errors[ERR_BATCH_CLOSED]"]
        distinguishing_aspect: "POST /items into a CLOSED batch -> 409 ERR_BATCH_CLOSED."
        test_recipe:
          setup: ["One CLOSED intake batch."]
          setup_api_calls:
            - call: "POST /markdown-schedules"
              payload: { name: "Std", tiers: [{min_age_days: 0, discount_pct: 0.0}], base_floor_pct: 0.30 }
              as: StoreAdmin
              captures: { sched_id: $.data.id }
            - call: "POST /consignors"
              payload: { full_name: "Bc Bob", email: "bc@x.com" }
              as: StoreAdmin
              captures: { cons_id: $.data.id }
            - call: "POST /agreements"
              payload: { consignor_id: "${cons_id}", markdown_schedule_id: "${sched_id}", split_pct: 0.50 }
              as: StoreAdmin
              captures: { agr_id: $.data.id }
            - call: "POST /intake-batches"
              payload: { agreement_id: "${agr_id}" }
              as: IntakeGrader
              captures: { batch_id: $.data.id }
            - call: "POST /intake-batches/${batch_id}/close"
              payload: {}
              as: IntakeGrader
          trigger:
            - call: "POST /items"
              payload: { batch_id: "${batch_id}", title: "Late coat" }
              as: IntakeGrader
              captures: { err: $.data.error_id }
          assert:
            - "POST /items into CLOSED batch -> 409 ERR_BATCH_CLOSED"

      - name: open_batch_under_terminated_agreement_returns_agreement_terminated
        claim_type: Precondition Enforcement
        grounds: [entities.ConsignorAgreement.fields.status, "errors[ERR_AGREEMENT_TERMINATED]"]
        distinguishing_aspect: "POST /intake-batches against a TERMINATED agreement -> 409 ERR_AGREEMENT_TERMINATED."
        test_recipe:
          setup: ["One TERMINATED agreement."]
          setup_api_calls:
            - call: "POST /markdown-schedules"
              payload: { name: "Std", tiers: [{min_age_days: 0, discount_pct: 0.0}], base_floor_pct: 0.30 }
              as: StoreAdmin
              captures: { sched_id: $.data.id }
            - call: "POST /consignors"
              payload: { full_name: "Term Tom", email: "term@x.com" }
              as: StoreAdmin
              captures: { cons_id: $.data.id }
            - call: "POST /agreements"
              payload: { consignor_id: "${cons_id}", markdown_schedule_id: "${sched_id}", split_pct: 0.50 }
              as: StoreAdmin
              captures: { agr_id: $.data.id }
            - call: "POST /agreements/${agr_id}/terminate"
              payload: {}
              as: StoreAdmin
          trigger:
            - call: "POST /intake-batches"
              payload: { agreement_id: "${agr_id}" }
              as: IntakeGrader
              captures: { err: $.data.error_id }
          assert:
            - "POST /intake-batches under TERMINATED agreement -> 409 ERR_AGREEMENT_TERMINATED"

      - name: dispose_before_window_returns_return_window_not_elapsed
        claim_type: Precondition Enforcement
        grounds: [state_machines.Item.ON_FLOOR_to_DONATED, "validations[priority=11]", "errors[ERR_RETURN_WINDOW_NOT_ELAPSED]"]
        distinguishing_aspect: "POST /items/{id}/dispose on an item only 10 days on floor (return_window_days=90) -> 409 ERR_RETURN_WINDOW_NOT_ELAPSED."
        test_recipe:
          setup: ["One ON_FLOOR item listed 2026-06-01, clock at 2026-06-11 (10 days), window 90."]
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-06-01T00:00:00Z" }
              as: StoreAdmin
            - call: "POST /markdown-schedules"
              payload: { name: "Std", tiers: [{min_age_days: 0, discount_pct: 0.0}], base_floor_pct: 0.30 }
              as: StoreAdmin
              captures: { sched_id: $.data.id }
            - call: "POST /consignors"
              payload: { full_name: "Win Wil", email: "win@x.com" }
              as: StoreAdmin
              captures: { cons_id: $.data.id }
            - call: "POST /agreements"
              payload: { consignor_id: "${cons_id}", markdown_schedule_id: "${sched_id}", split_pct: 0.50, return_window_days: 90, unsold_disposition: "DONATE" }
              as: StoreAdmin
              captures: { agr_id: $.data.id }
            - call: "POST /intake-batches"
              payload: { agreement_id: "${agr_id}" }
              as: IntakeGrader
              captures: { batch_id: $.data.id }
            - call: "POST /items"
              payload: { batch_id: "${batch_id}", title: "Fresh coat" }
              as: IntakeGrader
              captures: { item_id: $.data.id, iv: $.data.version }
            - call: "POST /items/${item_id}/grade"
              payload: { decision: "ACCEPT", list_price_cents: 10000, expected_item_version: "${iv}" }
              as: IntakeGrader
            - call: "POST /items/${item_id}/list"
              payload: {}
              as: IntakeGrader
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-06-11T00:00:00Z" }
              as: StoreAdmin
          trigger:
            - call: "POST /items/${item_id}/dispose"
              payload: {}
              as: SettlementManager
              captures: { err: $.data.error_id }
          assert:
            - "POST /items/${item_id}/dispose before window -> 409 ERR_RETURN_WINDOW_NOT_ELAPSED"

  # ===========================================================================
  - section: calculations
    instances:
      - name: markdown_aged_read_selects_correct_tier
        claim_type: Correct Result
        grounds: [calculations.markdown_price, entities.Item.fields.current_price_cents]
        distinguishing_aspect: "list 10000, schedule tiers {0:0,30:0.20,60:0.40}, base_floor 0.30; at age 30 days current_price_cents==8000 and at age 60 days ==6000."
        test_recipe:
          setup: ["One ON_FLOOR item list 10000 listed 2026-06-01; read at 2026-07-01 (30 days) then 2026-07-31 (60 days)."]
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-06-01T00:00:00Z" }
              as: StoreAdmin
            - call: "POST /markdown-schedules"
