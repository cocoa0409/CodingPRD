      - name: outstanding_past_due_invoice_on_another_enrollment_rejected
        claim_type: Aggregate validation
        grounds:
          - validations[priority=45]
          - errors.ERR_OUTSTANDING_PREMIUM_BALANCE
        distinguishing_aspect: |
          The check looks across ALL of the retiree's enrollments except the one
          being reinstated, so a PAST_DUE invoice left behind on an earlier,
          manually terminated enrollment blocks the reinstatement of a later one.
          The earlier enrollment is terminated while its invoice is already
          PAST_DUE, which is exactly the status the terminate cascade does NOT
          write off, and the reinstatement target's own invoices were all written
          off by the lapse - so an implementation that only inspects the target
          enrollment would wrongly succeed.
