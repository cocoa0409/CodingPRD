# =============================================================================
# Scaffold: Medicaid Eligibility & Annual Redetermination (Expert)
# =============================================================================

scenario: |
  Medicaid Eligibility & Annual Redetermination: MAGI income calculation,
  state-specific rules, household size, asset exemptions, annual
  Redetermination, emergency continuous coverage, appeals and fair hearing

domain_name: medicaid-eligibility-redetermination
# Multiple top-level collections (/households, /members, /enrollments,
# /redeterminations, /appeals, /state-rules, /fpl-schedules); no single shared
# path prefix, so api_prefix is the root.
api_prefix: ""

complexity_profile:
  primary_archetype: compliance_audit
  secondary_archetype: ledger_reconciliation
  complexity_layers:
    - dual_variant_calculation
    - rate_threshold_triggers
    - cascading_side_effects
    - optimistic_concurrency
  entity_topology: hybrid
  # Household is a parent tree (members -> income sources, assets, applications);
  # Enrollment / Redetermination / Appeal are flat peers cross-linked by FK.
  state_machine_shape: cyclic
  # Enrollment loops ACTIVE -> IN_REDETERMINATION -> ACTIVE; Appeal can reinstate
  # a TERMINATED enrollment back to ACTIVE.
  relationship_patterns:
    - one_to_many        # Household -> HouseholdMember -> IncomeSource
    - cross_aggregate    # Appeal -> Enrollment, Redetermination -> Enrollment
  role_model: segregation_of_duties
  # A CaseWorker who runs a determination cannot adjudicate the appeal of that
  # same case; an Applicant cannot run determinations.
  consistency_model: immediate

# =============================================================================
# 1.0 Response Envelope (FIXED — EMIT VERBATIM)
# =============================================================================
response_envelope:
  success: |
    { "meta": { "api_request_id": "req_xxx", "api_request_timestamp": "ISO8601" },
      "response_type": "object" | "array", "data": {} }
  error: |
    { "meta": { ... }, "response_type": "error",
      "data": { "error_id": "ERR_XXX", "message": "..." } }
  pagination_fields: ["limit", "offset", "total_count", "has_more"]
  pagination_defaults: { limit: 10, min: 1, max: 100, offset: 0 }

# =============================================================================
# 1.1 Entity-Relationship Table
# =============================================================================
entities:
  - name: StateRule
    parent: null
    common_fields: true
    fields:
      - { name: state_code, type: string, source: input, description: "Two-letter state code, e.g. CA", constraints: "unique across StateRule; length 2; uppercase" }
      - { name: is_expansion_state, type: boolean, source: input, description: "True if state adopted ACA Medicaid expansion (adult threshold 138% FPL)" }
      - { name: magi_adult_threshold_pct, type: integer, source: input, description: "FPL percentage ceiling for MAGI adult eligibility, e.g. 138 (expansion) or 100 (non-expansion)" }
      - { name: magi_child_threshold_pct, type: integer, source: input, description: "FPL percentage ceiling for MAGI child eligibility, e.g. 200" }
      - { name: abd_asset_limit_cents, type: integer, source: input, description: "Aged/Blind/Disabled non-MAGI countable asset limit in cents, e.g. 200000 ($2000)" }
      - { name: standard_asset_limit_cents, type: integer, source: input, description: "Non-ABD non-MAGI countable asset limit in cents" }
      - { name: continuous_coverage_active, type: boolean, source: input, description: "True if an emergency public-health-emergency continuous-coverage directive is in force for this state (suspends terminations)", default: false }

  - name: FplSchedule
    parent: null
    common_fields: false
    fields:
      - { name: year, type: integer, source: input, description: "Federal poverty guideline year, e.g. 2026", constraints: "unique across FplSchedule" }
      - { name: base_annual_cents, type: integer, source: input, description: "100% FPL annual income for a household of one, in cents" }
      - { name: per_member_increment_cents, type: integer, source: input, description: "Added 100% FPL annual income per additional household member, in cents" }

  - name: Household
    parent: null
    common_fields: true
    fields:
      - { name: state_code, type: string, source: input, description: "FK -> StateRule.state_code; the state whose rules govern this household" }
      - { name: fpl_year, type: integer, source: input, description: "FK -> FplSchedule.year; poverty guideline year used for FPL math" }
      - { name: household_size, type: integer, source: computed, description: "Count of HouseholdMember rows with member_status=COUNTED for this household" }
      - { name: primary_applicant_name, type: string, source: input, description: "Name of the primary applicant filing on behalf of the household" }
      - { name: covered_member_months, type: integer, source: computed, description: "Conserved ledger: cumulative member-months of active coverage credited to this household across all enrollments; debited on termination, re-credited on appeal reinstatement", default: 0 }
      - { name: active_enrollment_count, type: integer, source: computed, description: "Conserved ledger: number of this household's Enrollment rows currently in coverage_status=ACTIVE or IN_REDETERMINATION", default: 0 }

  - name: HouseholdMember
    parent: Household
    common_fields: true
    fields:
      - { name: household_id, type: string, source: system, description: "FK -> Household.id; owning household" }
      - { name: full_name, type: string, source: input, description: "Member full name" }
      - { name: age, type: integer, source: input, description: "Member age in years", constraints: ">= 0" }
      - { name: relationship, type: enum, source: input, description: "SELF | SPOUSE | CHILD | DEPENDENT | OTHER" }
      - { name: is_disabled, type: boolean, source: input, description: "True if member qualifies for Aged/Blind/Disabled non-MAGI pathway", default: false }
      - { name: member_status, type: enum, source: system, description: "COUNTED | EXCLUDED — EXCLUDED members do not contribute to household_size or MAGI", default: "COUNTED", constraints: "values: COUNTED, EXCLUDED" }

  - name: IncomeSource
    parent: HouseholdMember
    common_fields: true
    fields:
      - { name: member_id, type: string, source: system, description: "FK -> HouseholdMember.id; member earning this income" }
      - { name: income_type, type: enum, source: input, description: "WAGES | SELF_EMPLOYMENT | SOCIAL_SECURITY | CHILD_SUPPORT | TANF | GIFT — drives MAGI countability" }
      - { name: monthly_amount_cents, type: integer, source: input, description: "Reported monthly income for this source, in cents", constraints: ">= 0" }
      - { name: is_magi_countable, type: boolean, source: computed, description: "Derived from income_type per MAGI rules: CHILD_SUPPORT, TANF and GIFT are non-countable; the rest are countable" }
      - { name: projected_annual_cents, type: integer, source: input, description: "Reasonably-predictable annual amount used by the projected_annual MAGI variant; defaults to monthly_amount_cents*12 when omitted" }

  - name: Asset
    parent: Household
    common_fields: true
    fields:
      - { name: household_id, type: string, source: system, description: "FK -> Household.id; owning household" }
      - { name: asset_type, type: enum, source: input, description: "CASH | BANK_ACCOUNT | VEHICLE | HOME | RETIREMENT | BURIAL_FUND" }
      - { name: value_cents, type: integer, source: input, description: "Fair-market value of the asset, in cents", constraints: ">= 0" }
      - { name: is_exempt, type: boolean, source: computed, description: "Derived: HOME and one VEHICLE and BURIAL_FUND up to EXEMPT_BURIAL_CAP_CENTS are exempt; remainder counts toward the asset test" }
      - { name: countable_value_cents, type: integer, source: computed, description: "value_cents if not exempt, else the non-exempt remainder (e.g. burial fund above the cap); 0 for fully-exempt assets" }

  - name: Application
    parent: Household
    common_fields: true
    fields:
      - { name: household_id, type: string, source: system, description: "FK -> Household.id; household this application covers" }
      - { name: pathway, type: enum, source: input, description: "MAGI | NON_MAGI — selects income vs asset eligibility test" }
      - { name: magi_variant, type: enum, source: input, description: "POINT_IN_TIME | PROJECTED_ANNUAL — which MAGI algorithm to apply", default: "POINT_IN_TIME" }
      - { name: review_status, type: enum, source: system, description: "Lifecycle dimension: DRAFT -> SUBMITTED -> UNDER_REVIEW -> APPROVED | DENIED", default: "DRAFT" }
      - { name: verification_status, type: enum, source: system, description: "Independent parallel dimension: UNVERIFIED -> DOCS_REQUESTED -> VERIFIED (evolves separately from review_status)", default: "UNVERIFIED" }
      - { name: assigned_caseworker_id, type: string, source: system, description: "Opaque X-User-ID of the CaseWorker who took the application UNDER_REVIEW; pinned for segregation-of-duties" }

  - name: EligibilityDetermination
    parent: Application
    common_fields: true
    fields:
      - { name: application_id, type: string, source: system, description: "FK -> Application.id; application this determination snapshots" }
      - { name: pathway, type: enum, source: system, description: "MAGI | NON_MAGI — copied from the application at determination time" }
      - { name: magi_annual_cents, type: integer, source: computed, description: "Computed annual MAGI for the household per the application's magi_variant; null for NON_MAGI" }
      - { name: fpl_percentage, type: integer, source: computed, description: "magi_annual_cents as a whole-number percentage of the FPL base for household_size; null for NON_MAGI" }
      - { name: countable_assets_cents, type: integer, source: computed, description: "Sum of Asset.countable_value_cents for the household; null for MAGI pathway" }
      - { name: applicable_threshold_pct, type: integer, source: computed, description: "FPL percentage ceiling chosen from StateRule per category (adult vs child); null for NON_MAGI" }
      - { name: decision, type: enum, source: computed, description: "ELIGIBLE | INELIGIBLE — final eligibility outcome of this determination" }
      - { name: decision_reason, type: enum, source: computed, description: "INCOME_UNDER_THRESHOLD | INCOME_OVER_THRESHOLD | ASSETS_UNDER_LIMIT | ASSETS_OVER_LIMIT — machine reason code" }

  - name: Enrollment
    parent: null
    common_fields: true
    fields:
      - { name: household_id, type: string, source: input, description: "FK -> Household.id; enrolled household" }
      - { name: application_id, type: string, source: input, description: "FK -> Application.id; the APPROVED application that produced this enrollment" }
      - { name: coverage_status, type: enum, source: system, description: "PENDING -> ACTIVE -> IN_REDETERMINATION -> ACTIVE (cycle); ACTIVE/IN_REDETERMINATION -> TERMINATED; TERMINATED -> ACTIVE on appeal reinstatement", default: "PENDING" }
      - { name: coverage_start, type: datetime, source: input, description: "Inclusive ISO-8601 UTC date the coverage period begins" }
      - { name: coverage_end, type: datetime, source: input, description: "Inclusive ISO-8601 UTC date the coverage period ends; coverage_start..coverage_end is a closed interval" }
      - { name: redetermination_due, type: datetime, source: input, description: "ISO-8601 UTC timestamp marking the open of the annual redetermination window [redetermination_due, coverage_end]" }
      - { name: member_months, type: integer, source: computed, description: "household_size at ACTIVE transition multiplied by 12; the member-month quantity credited to Household.covered_member_months", default: 0 }

  - name: Redetermination
    parent: null
    common_fields: true
    fields:
      - { name: enrollment_id, type: string, source: input, description: "FK -> Enrollment.id; enrollment under annual review" }
      - { name: redet_status, type: enum, source: system, description: "INITIATED -> INFO_REQUESTED (loopable) -> RENEWED | TERMINATED | PENDING_APPEAL", default: "INITIATED" }
      - { name: window_open, type: datetime, source: input, description: "Inclusive ISO-8601 UTC start of this redetermination window" }
      - { name: window_close, type: datetime, source: input, description: "Exclusive ISO-8601 UTC end of this redetermination window; [window_open, window_close) is half-open" }
      - { name: info_request_count, type: integer, source: computed, description: "Number of times redet_status entered INFO_REQUESTED on this redetermination", default: 0 }
      - { name: new_determination_id, type: string, source: input, description: "FK -> EligibilityDetermination.id; the fresh determination evaluated for this redetermination" }

  - name: Appeal
    parent: null
    common_fields: true
    fields:
      - { name: enrollment_id, type: string, source: input, description: "FK -> Enrollment.id; enrollment whose termination is appealed" }
      - { name: redetermination_id, type: string, source: input, description: "FK -> Redetermination.id; the redetermination whose TERMINATED outcome is appealed" }
      - { name: appeal_status, type: enum, source: system, description: "FILED -> HEARING_SCHEDULED -> HEARD -> UPHELD | OVERTURNED; FILED/HEARING_SCHEDULED -> WITHDRAWN", default: "FILED" }
      - { name: adjudicator_id, type: string, source: system, description: "Opaque X-User-ID of the HearingOfficer who heard the appeal; must differ from the determination's caseworker (segregation of duties)" }
      - { name: aid_paid_pending, type: boolean, source: input, description: "If true, coverage continues pending the hearing (aid-paid-pending election)", default: false }

# =============================================================================
# 1.2 State Machine Table
# =============================================================================
state_machines:
  - entity: Application
    initial_state: DRAFT          # review_status dimension
    terminal_states: [APPROVED, DENIED]
    note: |
      Application carries two PARALLEL state dimensions that evolve
      independently on the same row: review_status (DRAFT -> SUBMITTED ->
      UNDER_REVIEW -> APPROVED|DENIED) and verification_status (UNVERIFIED ->
      DOCS_REQUESTED -> VERIFIED). The transitions below are labelled with the
      dimension they advance.
    transitions:
      - from: DRAFT
        to: SUBMITTED
        trigger: "POST /applications/{id}/submit"
        actor: Applicant
        preconditions:
          - "review_status == DRAFT"
          - "Household has at least one HouseholdMember with member_status=COUNTED (ERR_EMPTY_HOUSEHOLD)"
        side_effects:
          - "review_status set to SUBMITTED"
        dimension: review_status

      - from: SUBMITTED
        to: UNDER_REVIEW
        trigger: "POST /applications/{id}/claim-review"
        actor: CaseWorker
        preconditions:
          - "review_status == SUBMITTED"
        side_effects:
          - "review_status set to UNDER_REVIEW"
          - "assigned_caseworker_id set to the acting CaseWorker's X-User-ID (pins segregation-of-duties identity)"
        dimension: review_status

      - from: UNDER_REVIEW
        to: APPROVED
        trigger: "POST /applications/{id}/decide"
        actor: CaseWorker
        preconditions:
          - "review_status == UNDER_REVIEW"
          - "verification_status == VERIFIED (ERR_NOT_VERIFIED)"
          - "A child EligibilityDetermination exists with decision=ELIGIBLE (ERR_NO_ELIGIBLE_DETERMINATION)"
        side_effects:
          - "review_status set to APPROVED"
        dimension: review_status

      - from: UNDER_REVIEW
        to: DENIED
        trigger: "POST /applications/{id}/decide"
        actor: CaseWorker
        preconditions:
          - "review_status == UNDER_REVIEW"
          - "verification_status == VERIFIED (ERR_NOT_VERIFIED)"
          - "The latest child EligibilityDetermination has decision=INELIGIBLE"
        side_effects:
          - "review_status set to DENIED"
        dimension: review_status

      - from: UNVERIFIED
        to: DOCS_REQUESTED
        trigger: "POST /applications/{id}/request-docs"
        actor: CaseWorker
        preconditions:
          - "verification_status == UNVERIFIED"
        side_effects:
          - "verification_status set to DOCS_REQUESTED"
        dimension: verification_status

      - from: DOCS_REQUESTED
        to: VERIFIED
        trigger: "POST /applications/{id}/verify"
        actor: CaseWorker
        preconditions:
          - "verification_status == DOCS_REQUESTED"
        side_effects:
          - "verification_status set to VERIFIED"
        dimension: verification_status

      - from: UNVERIFIED
        to: VERIFIED
        trigger: "POST /applications/{id}/verify"
        actor: CaseWorker
        preconditions:
          - "verification_status == UNVERIFIED"
        side_effects:
          - "verification_status set to VERIFIED"
        dimension: verification_status

  - entity: Enrollment
    initial_state: PENDING
    terminal_states: []           # TERMINATED is reversible via appeal reinstatement, so not truly terminal
    transitions:
      - from: PENDING
        to: ACTIVE
        trigger: "POST /enrollments/{id}/activate"
        actor: CaseWorker
        preconditions:
          - "coverage_status == PENDING"
          - "The linked Application.review_status == APPROVED (ERR_APPLICATION_NOT_APPROVED) — cross-entity dependency Enrollment->Application"
          - "No other Enrollment for the same household_id with coverage_status IN {ACTIVE, IN_REDETERMINATION} whose [coverage_start, coverage_end] closed interval intersects this one (ERR_COVERAGE_OVERLAP)"
        side_effects:
          - "coverage_status set to ACTIVE"
          - "member_months set to household_size * 12"
          - "Household.covered_member_months increased by member_months (ledger credit)"
          - "Household.active_enrollment_count increased by 1"

      - from: ACTIVE
        to: IN_REDETERMINATION
        trigger: "POST /redeterminations (creates a Redetermination for this enrollment)"
        actor: CaseWorker
        preconditions:
          - "coverage_status == ACTIVE — if coverage_status == IN_REDETERMINATION (a redetermination already open) the endpoint-specific error ERR_REDETERMINATION_IN_PROGRESS (validations priority 5.5) is returned instead of the generic ERR_INVALID_STATE; any other non-ACTIVE state yields ERR_INVALID_STATE"
          - "The new [window_open, window_close) does NOT intersect the half-open window of any prior Redetermination for this enrollment, including terminal RENEWED ones (ERR_REDETERMINATION_WINDOW_OVERLAP)"
        side_effects:
          - "coverage_status set to IN_REDETERMINATION"

      - from: IN_REDETERMINATION
        to: ACTIVE
        trigger: "system: child Redetermination reaches RENEWED"
        actor: system
        preconditions:
          - "coverage_status == IN_REDETERMINATION"
        side_effects:
          - "coverage_status set to ACTIVE (cycle close)"

      - from: IN_REDETERMINATION
        to: TERMINATED
        trigger: "system: child Redetermination reaches TERMINATED and StateRule.continuous_coverage_active == false"
        actor: system
        preconditions:
          - "coverage_status == IN_REDETERMINATION"
          - "StateRule.continuous_coverage_active == false (ERR_CONTINUOUS_COVERAGE_LOCK if true)"
        side_effects:
          - "coverage_status set to TERMINATED"
          - "Household.covered_member_months decreased by member_months (ledger debit — conserved)"
          - "Household.active_enrollment_count decreased by 1"

      - from: TERMINATED
        to: ACTIVE
        trigger: "system: appeal on this enrollment reaches OVERTURNED"
        actor: system
        preconditions:
          - "coverage_status == TERMINATED"
        side_effects:
          - "coverage_status set to ACTIVE (reinstatement)"
          - "Household.covered_member_months increased by member_months (ledger re-credit — restores the debit, net-zero drift)"
          - "Household.active_enrollment_count increased by 1"

  - entity: Redetermination
    initial_state: INITIATED
    terminal_states: [RENEWED, TERMINATED, PENDING_APPEAL]
    note: |
      Branching with a self-loop: INFO_REQUESTED can be re-entered (cyclic),
      and the terminal fork RENEWED|TERMINATED|PENDING_APPEAL carries divergent
      side-effect sets per branch.
    transitions:
      - from: INITIATED
        to: INFO_REQUESTED
        trigger: "POST /redeterminations/{id}/request-info"
        actor: CaseWorker
        preconditions:
          - "redet_status == INITIATED"
        side_effects:
          - "redet_status set to INFO_REQUESTED"
          - "info_request_count increased by 1"

      - from: INFO_REQUESTED
        to: INFO_REQUESTED
        trigger: "POST /redeterminations/{id}/request-info"
        actor: CaseWorker
        preconditions:
          - "redet_status == INFO_REQUESTED"
        side_effects:
          - "info_request_count increased by 1 (self-loop)"

      - from: INITIATED
        to: RENEWED
        trigger: "POST /redeterminations/{id}/finalize"
        actor: CaseWorker
        preconditions:
          - "redet_status == INITIATED"
          - "The linked new_determination_id EligibilityDetermination.decision == ELIGIBLE (ERR_DETERMINATION_INELIGIBLE)"
        side_effects:
          - "redet_status set to RENEWED"
          - "Cascade: parent Enrollment IN_REDETERMINATION -> ACTIVE"

      - from: INFO_REQUESTED
        to: RENEWED
        trigger: "POST /redeterminations/{id}/finalize"
        actor: CaseWorker
        preconditions:
          - "redet_status == INFO_REQUESTED"
          - "The linked new_determination_id EligibilityDetermination.decision == ELIGIBLE (ERR_DETERMINATION_INELIGIBLE)"
        side_effects:
          - "redet_status set to RENEWED"
          - "Cascade: parent Enrollment IN_REDETERMINATION -> ACTIVE"

      - from: INITIATED
        to: TERMINATED
        trigger: "POST /redeterminations/{id}/finalize"
        actor: CaseWorker
        preconditions:
          - "redet_status == INITIATED"
          - "The linked new_determination_id EligibilityDetermination.decision == INELIGIBLE"
          - "Parent Enrollment's StateRule.continuous_coverage_active == false (ERR_CONTINUOUS_COVERAGE_LOCK) — cross-entity dependency Redetermination->StateRule"
        side_effects:
          - "redet_status set to TERMINATED"
          - "Cascade: parent Enrollment IN_REDETERMINATION -> TERMINATED, which itself debits Household.covered_member_months and decrements Household.active_enrollment_count"

      - from: INFO_REQUESTED
        to: TERMINATED
        trigger: "POST /redeterminations/{id}/finalize"
        actor: CaseWorker
        preconditions:
          - "redet_status == INFO_REQUESTED"
          - "The linked new_determination_id EligibilityDetermination.decision == INELIGIBLE"
          - "Parent Enrollment's StateRule.continuous_coverage_active == false (ERR_CONTINUOUS_COVERAGE_LOCK)"
        side_effects:
          - "redet_status set to TERMINATED"
          - "Cascade: parent Enrollment IN_REDETERMINATION -> TERMINATED (debits ledger, decrements count)"

      - from: TERMINATED
        to: PENDING_APPEAL
        trigger: "system: an Appeal is filed against this redetermination"
        actor: system
        preconditions:
          - "redet_status == TERMINATED"
        side_effects:
          - "redet_status set to PENDING_APPEAL"

  - entity: Appeal
    initial_state: FILED
    terminal_states: [UPHELD, OVERTURNED, WITHDRAWN]
    transitions:
      - from: FILED
        to: HEARING_SCHEDULED
        trigger: "POST /appeals/{id}/schedule"
        actor: HearingOfficer
        preconditions:
          - "appeal_status == FILED"
        side_effects:
          - "appeal_status set to HEARING_SCHEDULED"

      - from: HEARING_SCHEDULED
        to: HEARD
        trigger: "POST /appeals/{id}/hear"
        actor: HearingOfficer
        preconditions:
          - "appeal_status == HEARING_SCHEDULED"
          - "The acting HearingOfficer X-User-ID differs from the appealed determination's Application.assigned_caseworker_id (ERR_SEGREGATION_OF_DUTIES)"
        side_effects:
          - "appeal_status set to HEARD"
          - "adjudicator_id set to the acting HearingOfficer's X-User-ID"

      - from: HEARD
        to: UPHELD
        trigger: "POST /appeals/{id}/rule"
        actor: HearingOfficer
        preconditions:
          - "appeal_status == HEARD"
        side_effects:
          - "appeal_status set to UPHELD (termination stands; no coverage change)"

      - from: HEARD
        to: OVERTURNED
        trigger: "POST /appeals/{id}/rule"
        actor: HearingOfficer
        preconditions:
          - "appeal_status == HEARD"
          - "Parent Enrollment.coverage_status == TERMINATED (ERR_NOT_TERMINATED) — cross-entity dependency Appeal->Enrollment"
        side_effects:
          - "appeal_status set to OVERTURNED"
          - "Cascade: linked Enrollment TERMINATED -> ACTIVE (re-credits Household.covered_member_months, increments Household.active_enrollment_count)"

      - from: FILED
        to: WITHDRAWN
        trigger: "POST /appeals/{id}/withdraw"
        actor: Applicant
        preconditions:
          - "appeal_status == FILED"
        side_effects:
          - "appeal_status set to WITHDRAWN"

      - from: HEARING_SCHEDULED
        to: WITHDRAWN
        trigger: "POST /appeals/{id}/withdraw"
        actor: Applicant
        preconditions:
          - "appeal_status == HEARING_SCHEDULED"
        side_effects:
          - "appeal_status set to WITHDRAWN"

# =============================================================================
# 1.2.1 Concurrency Rules
# =============================================================================
concurrency_rules:
  - rule_id: redet-create-stale-enrollment
    parent_entity: Enrollment
    write_endpoint: "POST /redeterminations"
    occ_field: "expected_enrollment_version"
    description: |
      Creating a Redetermination against an Enrollment whose version has
      advanced since the client last observed it is rejected on a stale-version
      check. A prior write may have already opened a redetermination (moving the
      enrollment ACTIVE -> IN_REDETERMINATION and bumping its version); a request
      still carrying the older version is operating on a stale view and is
      refused.
    error_id: ERR_STALE_VERSION
    http_status: 412

  - rule_id: appeal-file-stale-enrollment
    parent_entity: Enrollment
    write_endpoint: "POST /appeals"
    occ_field: "expected_enrollment_version"
    description: |
      Filing an Appeal against an Enrollment whose version has advanced since
      the client last observed it is rejected on a stale-version check. Coverage
      mutations (termination, reinstatement) bump the enrollment version; a
      request carrying the older version reflects a stale view of the coverage
      state and is refused.
    error_id: ERR_STALE_VERSION
    http_status: 412

# =============================================================================
# 1.3 Calculation Rules Table
# =============================================================================
calculations:
  - name: magi_annual_income
    trigger: "POST /applications/{id}/determinations (determination run on a MAGI-pathway application)"
    algorithm: aggregation
    formula: |
      # Per-member rounding pinned BEFORE summation (round-then-sum, not sum-then-round).
      countable_members = HouseholdMembers with member_status=COUNTED
      for each such member m:
        member_sources = IncomeSource rows for m where is_magi_countable == true
        if magi_variant == POINT_IN_TIME:
          member_annual_cents = round_half_up( sum(s.monthly_amount_cents for s in member_sources) * 12 )
        else:  # PROJECTED_ANNUAL
          member_annual_cents = round_half_up( sum(s.projected_annual_cents for s in member_sources) )
      gross_annual_cents = sum(member_annual_cents over countable members)   # sum AFTER per-member rounding
      # 5% FPL income disregard applied to the household total exactly once, at the end:
      magi_annual_cents = gross_annual_cents - round_half_up( FPL_DISREGARD_PCT * fpl_base_for_size(household_size) )
      magi_annual_cents = max(magi_annual_cents, 0)
    input_set: "IncomeSource rows whose member is COUNTED and whose is_magi_countable == true"
    constants:
      FPL_DISREGARD_PCT: 0.05
      MONTHS_PER_YEAR: 12
    precision: "integer cents; round_half_up on each per-member annualization and on the disregard, in that pinned order"
    variants:
      - name: point_in_time
        when: "Application.magi_variant == POINT_IN_TIME"
        difference: "Annualizes current monthly income (sum of monthly_amount_cents) * 12 per member"
      - name: projected_annual
        when: "Application.magi_variant == PROJECTED_ANNUAL"
        difference: "Uses each source's projected_annual_cents directly instead of monthly*12, yielding a different total for the same household"

  - name: fpl_percentage_and_eligibility
    trigger: "POST /applications/{id}/determinations (immediately after magi_annual_income, MAGI pathway)"
    algorithm: threshold
    formula: |
      fpl_base = base_annual_cents + (household_size - 1) * per_member_increment_cents   # from FplSchedule
      fpl_percentage = floor( magi_annual_cents * 100 / fpl_base )   # whole-number percent, floor
      # Category selects the threshold: any COUNTED member with relationship in {SELF, SPOUSE, OTHER, DEPENDENT} of age >= 19
      # makes this an ADULT household -> magi_adult_threshold_pct; an all-child household -> magi_child_threshold_pct.
      applicable_threshold_pct = magi_adult_threshold_pct if has_adult else magi_child_threshold_pct
      # Boundary pinned as inclusive: eligible when fpl_percentage <= applicable_threshold_pct.
      decision = ELIGIBLE if fpl_percentage <= applicable_threshold_pct else INELIGIBLE
      decision_reason = INCOME_UNDER_THRESHOLD if decision == ELIGIBLE else INCOME_OVER_THRESHOLD
    input_set: "Single household's magi_annual_cents (from magi_annual_income), household_size, StateRule thresholds, FplSchedule base"
    constants:
      ADULT_AGE_FLOOR: 19
    precision: "fpl_percentage is floor of (cents*100/base); comparison is <= (inclusive at the boundary)"

  - name: countable_assets_and_eligibility
    trigger: "POST /applications/{id}/determinations (determination run on a NON_MAGI-pathway application)"
    algorithm: aggregation
    formula: |
      for each Asset a of the household:
        if a.asset_type == HOME: a.countable_value_cents = 0                       # homestead fully exempt
        elif a.asset_type == VEHICLE and a is the highest-value VEHICLE: a.countable_value_cents = 0   # one vehicle exempt
        elif a.asset_type == BURIAL_FUND: a.countable_value_cents = max(a.value_cents - EXEMPT_BURIAL_CAP_CENTS, 0)
        else: a.countable_value_cents = a.value_cents
      countable_assets_cents = sum(a.countable_value_cents for all assets)
      # Limit selected by disability status of the household:
      asset_limit_cents = abd_asset_limit_cents if any COUNTED member is_disabled else standard_asset_limit_cents
      # Boundary pinned: eligible when countable_assets_cents <= asset_limit_cents (inclusive).
      decision = ELIGIBLE if countable_assets_cents <= asset_limit_cents else INELIGIBLE
      decision_reason = ASSETS_UNDER_LIMIT if decision == ELIGIBLE else ASSETS_OVER_LIMIT
    input_set: "All Asset rows for the household; StateRule asset limits; COUNTED member disability flags"
    constants:
      EXEMPT_BURIAL_CAP_CENTS: 150000
    precision: "integer cents; tie at exactly asset_limit_cents is ELIGIBLE (inclusive <=)"
    variants:
      - name: abd_limit
        when: "Any COUNTED HouseholdMember has is_disabled == true"
        difference: "Applies abd_asset_limit_cents (typically lower, e.g. $2000) as the ceiling"
      - name: standard_limit
        when: "No COUNTED HouseholdMember is disabled"
        difference: "Applies standard_asset_limit_cents as the ceiling, producing a different decision for identical assets"

  - name: ledger_reconciliation
    trigger: "Enrollment ACTIVE/TERMINATED/reinstatement transitions"
    algorithm: aggregation
    formula: |
      # Conserved-quantity invariants pinned as explicit formulas over entity fields.
      # Invariant A (member-months): at all times
      #   Household.covered_member_months ==
      #     sum(e.member_months for e in household Enrollments where e.coverage_status IN {ACTIVE, IN_REDETERMINATION})
      # A termination debits member_months; an appeal reinstatement re-credits the SAME member_months -> net zero drift.
      # Invariant B (active count): at all times
      #   Household.active_enrollment_count ==
      #     count(e for e in household Enrollments where e.coverage_status IN {ACTIVE, IN_REDETERMINATION})
    input_set: "All Enrollment rows for a household, filtered by coverage_status as pinned above"
    precision: "integer counts; both invariants must hold exactly after every cascade settles"

# =============================================================================
# 1.4 Validation Rules Table (ordered by priority)
# =============================================================================
validations:
  - priority: 1
    category: auth
    check: "X-User-Role and X-User-ID headers present and X-User-Role is a declared role"
    error_id: ERR_UNAUTHENTICATED
    http_status: 401
    applies_to: all

  - priority: 2
    category: auth
    check: "Acting role is permitted to call this endpoint per §1.7 RBAC"
    error_id: ERR_FORBIDDEN
    http_status: 403
    applies_to: all

  - priority: 3
    category: existence
    check: "All path and body foreign-key resources exist, validated left-to-right in the path then body"
    error_id: ERR_NOT_FOUND
    http_status: 404
    applies_to: all

  - priority: 4
    category: business_constraint
    check: "Request body is well-formed: required fields present, enum members valid, integers non-negative"
    error_id: ERR_INVALID_REQUEST
    http_status: 422
    applies_to: all

  - priority: 5
    category: state
    check: "OCC: expected_<parent>_version equals the parent entity's current version on supersede-style creates"
    error_id: ERR_STALE_VERSION
    http_status: 412
    applies_to: "POST /redeterminations, POST /appeals"

  - priority: 5.5
    category: state
    check: "Endpoint-specific state error: POST /redeterminations against an Enrollment already in coverage_status=IN_REDETERMINATION yields the specific redetermination-in-progress error instead of the generic invalid-state error. This fires before the generic state check (priority 6) so the specific error wins."
    error_id: ERR_REDETERMINATION_IN_PROGRESS
    http_status: 409
    applies_to: "POST /redeterminations"

  - priority: 6
    category: state
    check: "Target resource is in a state from which the requested transition is defined"
    error_id: ERR_INVALID_STATE
    http_status: 409
    applies_to: "all state-transition endpoints"

  - priority: 7
    category: business_safety
    check: "Continuous-coverage directive: a termination is blocked while StateRule.continuous_coverage_active == true for the household's state"
    error_id: ERR_CONTINUOUS_COVERAGE_LOCK
    http_status: 409
    applies_to: "POST /redeterminations/{id}/finalize (to TERMINATED)"

  - priority: 8
    category: business_safety
    check: "Segregation of duties: the HearingOfficer hearing an appeal must differ from the determination's assigned_caseworker_id"
    error_id: ERR_SEGREGATION_OF_DUTIES
    http_status: 409
    applies_to: "POST /appeals/{id}/hear"

  - priority: 9
    category: business_referential
    check: "Application referenced by an enrollment activation must be review_status=APPROVED"
    error_id: ERR_APPLICATION_NOT_APPROVED
    http_status: 409
    applies_to: "POST /enrollments/{id}/activate"

  - priority: 10
    category: business_temporal
    check: "Activating an enrollment must not produce a coverage interval that intersects another ACTIVE/IN_REDETERMINATION enrollment of the same household (closed-interval overlap)"
    error_id: ERR_COVERAGE_OVERLAP
    http_status: 409
    applies_to: "POST /enrollments/{id}/activate"

  - priority: 11
    category: business_temporal
    check: "Opening a redetermination window that intersects another open redetermination window for the same enrollment (half-open overlap) is rejected"
    error_id: ERR_REDETERMINATION_WINDOW_OVERLAP
    http_status: 409
    applies_to: "POST /redeterminations"

  - priority: 12
    category: business_constraint
    check: "An application cannot be submitted when its household has no COUNTED member"
    error_id: ERR_EMPTY_HOUSEHOLD
    http_status: 409
    applies_to: "POST /applications/{id}/submit"

  - priority: 13
    category: business_constraint
    check: "An application cannot be decided until verification_status == VERIFIED"
    error_id: ERR_NOT_VERIFIED
    http_status: 409
    applies_to: "POST /applications/{id}/decide"

  - priority: 14
    category: business_referential
    check: "Approval requires an existing child EligibilityDetermination with decision=ELIGIBLE"
    error_id: ERR_NO_ELIGIBLE_DETERMINATION
    http_status: 409
    applies_to: "POST /applications/{id}/decide (to APPROVED)"

  - priority: 15
    category: business_referential
    check: "Finalizing a redetermination to RENEWED requires its linked new_determination decision=ELIGIBLE; to TERMINATED requires INELIGIBLE"
    error_id: ERR_DETERMINATION_INELIGIBLE
    http_status: 409
    applies_to: "POST /redeterminations/{id}/finalize"

  # (The redetermination-in-progress error is enforced at priority 5.5 above,
  #  as the endpoint-specific state error for POST /redeterminations.)

  - priority: 16
    category: state
    check: "An appeal can be overturned only when its linked enrollment is coverage_status=TERMINATED"
    error_id: ERR_NOT_TERMINATED
    http_status: 409
    applies_to: "POST /appeals/{id}/rule (to OVERTURNED)"

# =============================================================================
# 1.5 API Endpoint Table
# =============================================================================
endpoints:
  # --- StateRule (configuration) ---
  - method: POST
    path: "/state-rules"
    description: "Create a state's Medicaid rule set"
    roles: [CaseWorker]
    code: 201
    input: [state_code, is_expansion_state, magi_adult_threshold_pct, magi_child_threshold_pct, abd_asset_limit_cents, standard_asset_limit_cents, "continuous_coverage_active?"]
    output: StateRule
    side_effects: []

  - method: GET
    path: "/state-rules/{stateCode}"
    description: "Get a state's rule set by state_code"
    roles: [CaseWorker, HearingOfficer, Applicant]
    code: 200
    input: []
    output: StateRule
    side_effects: []

  - method: PATCH
    path: "/state-rules/{stateCode}"
    description: "Update mutable state-rule fields (e.g. toggle the emergency continuous-coverage directive)"
    roles: [CaseWorker]
    code: 200
    input: ["is_expansion_state?", "magi_adult_threshold_pct?", "magi_child_threshold_pct?", "abd_asset_limit_cents?", "standard_asset_limit_cents?", "continuous_coverage_active?"]
    output: StateRule
    side_effects: ["Toggling continuous_coverage_active changes whether terminations are blocked"]

  # --- FplSchedule (configuration) ---
  - method: POST
    path: "/fpl-schedules"
    description: "Create a federal poverty guideline schedule for a year"
    roles: [CaseWorker]
    code: 201
    input: [year, base_annual_cents, per_member_increment_cents]
    output: FplSchedule
    side_effects: []

  # --- Household ---
  - method: POST
    path: "/households"
    description: "Create a household applying for Medicaid"
    roles: [Applicant, CaseWorker]
    code: 201
    input: [state_code, fpl_year, primary_applicant_name]
    output: Household
    side_effects: ["household_size=0, covered_member_months=0, active_enrollment_count=0"]

  - method: GET
    path: "/households/{id}"
    description: "Get a household, including computed ledger fields"
    roles: [Applicant, CaseWorker, HearingOfficer]
    code: 200
    input: []
    output: Household
    side_effects: []

  # --- HouseholdMember (child of Household) ---
  - method: POST
    path: "/households/{id}/members"
    description: "Add a member to a household"
    roles: [Applicant, CaseWorker]
    code: 201
    input: [full_name, age, relationship, "is_disabled?"]
    output: HouseholdMember
    side_effects: ["member_status=COUNTED", "recompute Household.household_size"]

  - method: GET
    path: "/members/{id}"
    description: "Get a household member"
    roles: [Applicant, CaseWorker, HearingOfficer]
    code: 200
    input: []
    output: HouseholdMember
    side_effects: []

  - method: GET
    path: "/households/{id}/members"
    description: "List members of a household (FK reverse-reachability for HouseholdMember.household_id)"
    roles: [Applicant, CaseWorker, HearingOfficer]
    code: 200
    input: ["limit?", "offset?"]
    output: HouseholdMember[]
    side_effects: []

  - method: POST
    path: "/members/{id}/exclude"
    description: "Mark a member EXCLUDED (drops from household_size and MAGI)"
    roles: [CaseWorker]
    code: 200
    input: []
    output: HouseholdMember
    side_effects: ["member_status=EXCLUDED", "recompute Household.household_size"]

  # --- IncomeSource (child of HouseholdMember) ---
  - method: POST
    path: "/members/{id}/income-sources"
    description: "Add an income source to a member"
    roles: [Applicant, CaseWorker]
    code: 201
    input: [income_type, monthly_amount_cents, "projected_annual_cents?"]
    output: IncomeSource
    side_effects: ["is_magi_countable derived from income_type", "projected_annual_cents defaults to monthly_amount_cents*12 when omitted"]

  - method: GET
    path: "/members/{id}/income-sources"
    description: "List income sources for a member (FK reverse-reachability for IncomeSource.member_id)"
    roles: [Applicant, CaseWorker, HearingOfficer]
    code: 200
    input: ["limit?", "offset?"]
    output: IncomeSource[]
    side_effects: []

  # --- Asset (child of Household) ---
  - method: POST
    path: "/households/{id}/assets"
    description: "Add an asset to a household"
    roles: [Applicant, CaseWorker]
    code: 201
    input: [asset_type, value_cents]
    output: Asset
    side_effects: ["is_exempt and countable_value_cents derived per asset rules"]

  - method: GET
    path: "/households/{id}/assets"
    description: "List assets of a household (FK reverse-reachability for Asset.household_id)"
    roles: [Applicant, CaseWorker, HearingOfficer]
    code: 200
    input: ["limit?", "offset?"]
    output: Asset[]
    side_effects: []

  # --- Application (child of Household) ---
  - method: POST
    path: "/households/{id}/applications"
    description: "Open an eligibility application for a household"
    roles: [Applicant, CaseWorker]
    code: 201
    input: [pathway, "magi_variant?"]
    output: Application
    side_effects: ["review_status=DRAFT, verification_status=UNVERIFIED"]

  - method: GET
    path: "/applications/{id}"
    description: "Get an application"
    roles: [Applicant, CaseWorker, HearingOfficer]
    code: 200
    input: []
    output: Application
    side_effects: []

  - method: GET
    path: "/households/{id}/applications"
    description: "List a household's applications (FK reverse-reachability for Application.household_id)"
    roles: [Applicant, CaseWorker, HearingOfficer]
    code: 200
    input: ["limit?", "offset?"]
    output: Application[]
    side_effects: []

  - method: POST
    path: "/applications/{id}/submit"
    description: "Submit a DRAFT application (review_status dimension)"
    roles: [Applicant]
    code: 200
    input: []
    output: Application
    side_effects: ["review_status DRAFT -> SUBMITTED"]

  - method: POST
    path: "/applications/{id}/claim-review"
    description: "CaseWorker claims a SUBMITTED application for review"
    roles: [CaseWorker]
    code: 200
    input: []
    output: Application
    side_effects: ["review_status SUBMITTED -> UNDER_REVIEW", "assigned_caseworker_id set to acting CaseWorker"]

  - method: POST
    path: "/applications/{id}/request-docs"
    description: "Request verification documents (verification_status dimension)"
    roles: [CaseWorker]
    code: 200
    input: []
    output: Application
    side_effects: ["verification_status UNVERIFIED -> DOCS_REQUESTED"]

  - method: POST
    path: "/applications/{id}/verify"
    description: "Mark verification complete (verification_status dimension)"
    roles: [CaseWorker]
    code: 200
    input: []
    output: Application
    side_effects: ["verification_status -> VERIFIED"]

  - method: POST
    path: "/applications/{id}/determinations"
    description: "Run an eligibility determination snapshot for the application (MAGI or asset test per pathway)"
    roles: [CaseWorker]
    code: 201
    input: []
    output: EligibilityDetermination
    side_effects: ["Runs magi_annual_income + fpl_percentage_and_eligibility (MAGI) OR countable_assets_and_eligibility (NON_MAGI); persists a child EligibilityDetermination with decision and reason"]

  - method: GET
    path: "/applications/{id}/determinations"
    description: "List determinations for an application (FK reverse-reachability for EligibilityDetermination.application_id)"
    roles: [CaseWorker, HearingOfficer, Applicant]
    code: 200
    input: ["limit?", "offset?"]
    output: EligibilityDetermination[]
    side_effects: []

  - method: POST
    path: "/applications/{id}/decide"
    description: "Approve or deny an application under review"
    roles: [CaseWorker]
    code: 200
    input: [target_status]
    output: Application
    side_effects: ["review_status UNDER_REVIEW -> APPROVED|DENIED"]

  # --- Enrollment (flat peer) ---
  - method: POST
    path: "/enrollments"
    description: "Create a PENDING enrollment from an APPROVED application"
    roles: [CaseWorker]
    code: 201
    input: [household_id, application_id, coverage_start, coverage_end, redetermination_due]
    output: Enrollment
    side_effects: ["coverage_status=PENDING"]

  - method: GET
    path: "/enrollments/{id}"
    description: "Get an enrollment"
    roles: [CaseWorker, HearingOfficer, Applicant]
    code: 200
    input: []
    output: Enrollment
    side_effects: []

  - method: GET
    path: "/enrollments"
    description: "List enrollments, filterable by household_id or application_id (FK reverse-reachability for Enrollment.household_id and Enrollment.application_id)"
    roles: [CaseWorker, HearingOfficer, Applicant]
    code: 200
    input: ["household_id?", "application_id?", "limit?", "offset?"]
    output: Enrollment[]
    side_effects: []

  - method: POST
    path: "/enrollments/{id}/activate"
    description: "Activate a PENDING enrollment"
    roles: [CaseWorker]
    code: 200
    input: []
    output: Enrollment
    side_effects: ["coverage_status PENDING -> ACTIVE", "member_months = household_size*12", "credit Household.covered_member_months", "increment Household.active_enrollment_count"]

  # --- Redetermination (flat peer, OCC parent = Enrollment) ---
  - method: POST
    path: "/redeterminations"
    description: "Open an annual redetermination for an ACTIVE enrollment (supersede-style create, OCC on Enrollment.version)"
    roles: [CaseWorker]
    code: 201
    input: [enrollment_id, window_open, window_close, new_determination_id, expected_enrollment_version]
    output: Redetermination
    side_effects: ["redet_status=INITIATED", "cascade: Enrollment ACTIVE -> IN_REDETERMINATION", "increments Enrollment.version by 1"]

  - method: GET
    path: "/redeterminations/{id}"
    description: "Get a redetermination"
    roles: [CaseWorker, HearingOfficer, Applicant]
    code: 200
    input: []
    output: Redetermination
    side_effects: []

  - method: GET
    path: "/redeterminations"
    description: "List redeterminations, filterable by enrollment_id or new_determination_id (FK reverse-reachability for Redetermination.enrollment_id and Redetermination.new_determination_id)"
    roles: [CaseWorker, HearingOfficer, Applicant]
    code: 200
    input: ["enrollment_id?", "new_determination_id?", "limit?", "offset?"]
    output: Redetermination[]
    side_effects: []

  - method: POST
    path: "/redeterminations/{id}/request-info"
    description: "Request additional info (INITIATED/INFO_REQUESTED -> INFO_REQUESTED, self-loop)"
    roles: [CaseWorker]
    code: 200
    input: []
    output: Redetermination
    side_effects: ["redet_status -> INFO_REQUESTED", "info_request_count += 1"]

  - method: POST
    path: "/redeterminations/{id}/finalize"
    description: "Finalize a redetermination to RENEWED or TERMINATED based on its linked new determination"
    roles: [CaseWorker]
    code: 200
    input: [target_status]
    output: Redetermination
    side_effects: ["RENEWED -> cascade Enrollment IN_REDETERMINATION -> ACTIVE; TERMINATED -> cascade Enrollment IN_REDETERMINATION -> TERMINATED (debits ledger)"]

  # --- Appeal (flat peer, OCC parent = Enrollment) ---
  - method: POST
    path: "/appeals"
    description: "File an appeal against a TERMINATED redetermination (supersede-style create, OCC on Enrollment.version)"
    roles: [Applicant]
    code: 201
    input: [enrollment_id, redetermination_id, "aid_paid_pending?", expected_enrollment_version]
    output: Appeal
    side_effects: ["appeal_status=FILED", "cascade: linked Redetermination TERMINATED -> PENDING_APPEAL", "increments Enrollment.version by 1"]

  - method: GET
    path: "/appeals/{id}"
    description: "Get an appeal"
    roles: [CaseWorker, HearingOfficer, Applicant]
    code: 200
    input: []
    output: Appeal
    side_effects: []

  - method: GET
    path: "/appeals"
    description: "List appeals, filterable by enrollment_id or redetermination_id (FK reverse-reachability for Appeal.enrollment_id and Appeal.redetermination_id)"
    roles: [CaseWorker, HearingOfficer, Applicant]
    code: 200
    input: ["enrollment_id?", "redetermination_id?", "limit?", "offset?"]
    output: Appeal[]
    side_effects: []

  - method: POST
    path: "/appeals/{id}/schedule"
    description: "Schedule a fair hearing (FILED -> HEARING_SCHEDULED)"
    roles: [HearingOfficer]
    code: 200
    input: []
    output: Appeal
    side_effects: ["appeal_status -> HEARING_SCHEDULED"]

  - method: POST
    path: "/appeals/{id}/hear"
    description: "Hold the fair hearing (HEARING_SCHEDULED -> HEARD); enforces segregation of duties"
    roles: [HearingOfficer]
    code: 200
    input: []
    output: Appeal
    side_effects: ["appeal_status -> HEARD", "adjudicator_id set to acting HearingOfficer"]

  - method: POST
    path: "/appeals/{id}/rule"
    description: "Rule on a heard appeal (HEARD -> UPHELD|OVERTURNED)"
    roles: [HearingOfficer]
    code: 200
    input: [target_status]
    output: Appeal
    side_effects: ["OVERTURNED -> cascade Enrollment TERMINATED -> ACTIVE (re-credits ledger)"]

  - method: POST
    path: "/appeals/{id}/withdraw"
    description: "Withdraw an appeal (FILED|HEARING_SCHEDULED -> WITHDRAWN)"
    roles: [Applicant]
    code: 200
    input: []
    output: Appeal
    side_effects: ["appeal_status -> WITHDRAWN"]

# =============================================================================
# 1.6 Error Code Catalog
# =============================================================================
errors:
  - id: ERR_UNAUTHENTICATED
    http: 401
    condition: "Missing or invalid X-User-Role / X-User-ID headers"

  - id: ERR_FORBIDDEN
    http: 403
    condition: "Acting role not permitted for this endpoint per RBAC"

  - id: ERR_NOT_FOUND
    http: 404
    condition: "A referenced path or body resource does not exist"

  - id: ERR_INVALID_REQUEST
    http: 422
    condition: "Malformed body: missing required field, invalid enum member, or negative integer where non-negative required"

  - id: ERR_STALE_VERSION
    http: 412
    condition: "expected_<parent>_version does not match the parent Enrollment's current version on a supersede-style create"

  - id: ERR_INVALID_STATE
    http: 409
    condition: "Requested transition is not defined from the resource's current state"

  - id: ERR_EMPTY_HOUSEHOLD
    http: 409
    condition: "Application submitted for a household with no COUNTED member"

  - id: ERR_NOT_VERIFIED
    http: 409
    condition: "Application decided before verification_status reached VERIFIED"

  - id: ERR_NO_ELIGIBLE_DETERMINATION
    http: 409
    condition: "Approval attempted without an existing child EligibilityDetermination whose decision=ELIGIBLE"

  - id: ERR_APPLICATION_NOT_APPROVED
    http: 409
    condition: "Enrollment activation references an application that is not review_status=APPROVED"

  - id: ERR_COVERAGE_OVERLAP
    http: 409
    condition: "Activating an enrollment whose closed coverage interval intersects another ACTIVE/IN_REDETERMINATION enrollment of the same household"

  - id: ERR_REDETERMINATION_WINDOW_OVERLAP
    http: 409
    condition: "Opening a redetermination whose half-open window intersects another open redetermination window for the same enrollment"

  - id: ERR_REDETERMINATION_IN_PROGRESS
    http: 409
    condition: "A redetermination is already in progress (INITIATED/INFO_REQUESTED/PENDING_APPEAL) for the enrollment"

  - id: ERR_DETERMINATION_INELIGIBLE
    http: 409
    condition: "Redetermination finalize target conflicts with its linked new determination decision (RENEWED needs ELIGIBLE; TERMINATED needs INELIGIBLE)"

  - id: ERR_CONTINUOUS_COVERAGE_LOCK
    http: 409
    condition: "A termination is blocked because StateRule.continuous_coverage_active is true for the household's state"

  - id: ERR_SEGREGATION_OF_DUTIES
    http: 409
    condition: "HearingOfficer hearing the appeal equals the determination's assigned_caseworker_id"

  - id: ERR_NOT_TERMINATED
    http: 409
    condition: "Appeal ruled OVERTURNED but its linked enrollment is not coverage_status=TERMINATED"

# =============================================================================
# 1.7 RBAC Matrix
# =============================================================================
roles:
  - name: Applicant
    description: "The household's primary applicant; files applications, supplies members/income/assets, submits, withdraws appeals."
    identity: "opaque"
    exclusive_operations:
      - "POST /applications/{id}/submit — submit own application"
      - "POST /appeals — file an appeal"
      - "POST /appeals/{id}/withdraw — withdraw an appeal"
    shared_operations:
      - "POST /households — create household (shared with CaseWorker)"
      - "POST /households/{id}/members — add member (shared with CaseWorker)"
      - "POST /members/{id}/income-sources — add income (shared with CaseWorker)"
      - "POST /households/{id}/assets — add asset (shared with CaseWorker)"
      - "POST /households/{id}/applications — open application (shared with CaseWorker)"
      - "GET reads on households, members, income-sources, assets, applications, determinations, enrollments, redeterminations, appeals"

  - name: CaseWorker
    description: "Eligibility worker; manages configuration, claims and reviews applications, runs determinations, decides, manages enrollments and redeterminations."
    identity: "opaque"
    exclusive_operations:
      - "POST /state-rules, PATCH /state-rules/{stateCode} — configure state rules"
      - "POST /fpl-schedules — configure FPL schedules"
      - "POST /applications/{id}/claim-review — claim a submitted application"
      - "POST /applications/{id}/request-docs, /verify — verification dimension"
      - "POST /applications/{id}/determinations — run determinations"
      - "POST /applications/{id}/decide — approve/deny"
      - "POST /members/{id}/exclude — exclude a member"
      - "POST /enrollments, POST /enrollments/{id}/activate — enrollment lifecycle"
      - "POST /redeterminations, /request-info, /finalize — redetermination lifecycle"
    shared_operations:
      - "POST /households, /members, /income-sources, /assets, /applications (shared with Applicant)"
      - "GET reads across all resources"

  - name: HearingOfficer
    description: "Independent adjudicator of fair hearings; cannot have worked the appealed determination (segregation of duties)."
    identity: "opaque"
    exclusive_operations:
      - "POST /appeals/{id}/schedule — schedule hearing"
      - "POST /appeals/{id}/hear — hold hearing"
      - "POST /appeals/{id}/rule — rule UPHELD|OVERTURNED"
    shared_operations:
      - "GET reads across all resources"
