# =============================================================================
# §1.8 Scaffold Difficulty Design — Apple Packinghouse & CA Storage
# Test Targeting Index: 2 instances per Difficulty Rule (§0.5), 18 total.
# All chains replay from empty-DB against SCAFFOLD.yaml §1.5 only.
# Logical clock default 2026-08-01T00:00:00Z unless a chain sets it.
# =============================================================================

scaffold_difficulty_design:
  # ---------------------------------------------------------------------------
  # Rule 1 — dual_variant_calc (different entity domains: Lot vs GrowerSettlement)
  # ---------------------------------------------------------------------------
  - rule_id: dual_variant_calc
    instances:
      - name: lot_packout_estimated_vs_actual
        grounds:
          - calculations.packout_percentage
          - entities.Lot.fields.est_packout_pct
          - entities.Lot.fields.actual_packout_pct
        distinguishing_aspect: |
          Lot-domain dual variant: the forward-looking est_packout_pct (computed
          once from the presize profile, 90.9) and the chronological
          actual_packout_pct (aggregated over COMPLETED non-VOIDED runs, 85.0)
          diverge for identical fruit because line-level cull/juice differs from
          the presize cull estimate.
        test_recipe:
          setup:
            - "Grower G with block B (GALA, storage_life_days 240); lot L received 12 bins / 11000 lbs / color 80, then presized with profile small=2000, medium=5000, large=3000, cull=1000 (sums exactly to 11000) -> est_packout_pct 90.9"
            - "Room R (cap 40, setpoint 1.5) holds all 12 bins; room sealed and opened; allocation released -> lot RELEASED with weight_balance_lbs 11000"
            - "ACTIVE spec (color_min_pct 66) and OPEN pool exist; a SCHEDULED run consumes the full 11000 lbs"
          setup_api_calls:
            - { call: "POST /growers", payload: { name: "Grower One", grower_code: "G1" }, as: Admin, captures: { g1: $.data.id } }
            - { call: "POST /growers/${g1}/blocks", payload: { orchard_name: "Riverview", block_code: "B1", variety: "GALA", storage_life_days: 240 }, as: ReceivingClerk, captures: { b1: $.data.id } }
            - { call: "POST /lots", payload: { grower_id: "${g1}", block_id: "${b1}", received_bin_count: 12, received_weight_lbs: 11000, avg_color_pct: 80 }, as: ReceivingClerk, captures: { l1: $.data.id } }
            - { call: "POST /lots/${l1}/presize", payload: { size_small_lbs: 2000, size_medium_lbs: 5000, size_large_lbs: 3000, presize_cull_lbs: 1000 }, as: ReceivingClerk }
            - { call: "POST /ca-rooms", payload: { room_code: "R1", bin_capacity: 40, o2_setpoint_pct: 1.5 }, as: StorageOperator, captures: { r1: $.data.id } }
            - { call: "POST /ca-rooms/${r1}/allocations", payload: { lot_id: "${l1}", bins: 12 }, as: StorageOperator, captures: { a1: $.data.id } }
            - { call: "POST /ca-rooms/${r1}/atmosphere-readings", payload: { o2_pct: 1.5 }, as: StorageOperator }
            - { call: "POST /ca-rooms/${r1}/seal", payload: { planned_open_date: "2026-11-01T00:00:00Z" }, as: StorageOperator }
            - { call: "POST /ca-rooms/${r1}/open", payload: {}, as: StorageOperator }
            - { call: "POST /allocations/${a1}/release", payload: {}, as: StorageOperator }
            - { call: "POST /specs", payload: { customer_name: "RetailCo", label_code: "RC-TRAY", grade_min: "EXTRA_FANCY", color_min_pct: 66, size_class: "MEDIUM", pack_style: "TRAY" }, as: PoolManager, captures: { sp1: $.data.id } }
            - { call: "POST /pools", payload: { variety: "GALA", grade_class: "EXTRA_FANCY", season: "2026-2027" }, as: PoolManager, captures: { p1: $.data.id } }
            - { call: "POST /packing-runs", payload: { lot_id: "${l1}", spec_id: "${sp1}", pool_id: "${p1}", line_code: "LINE_1", scheduled_start: "2026-08-02T08:00:00Z", scheduled_end: "2026-08-02T12:00:00Z", input_weight_lbs: 11000 }, as: PackingSupervisor, captures: { run1: $.data.id } }
          trigger:
            - { call: "POST /packing-runs/${run1}/complete", payload: { cartons_produced: 50, packed_weight_lbs: 9350, cull_weight_lbs: 1100, juice_weight_lbs: 550 }, as: PackingSupervisor, captures: { run_packout: $.data.packout_pct } }
            - { call: "GET /lots/${l1}", payload: {}, as: Admin }
          assert:
            - "Lot.${l1}.est_packout_pct == 90.9"
            - "Lot.${l1}.actual_packout_pct == 85.0"
            - "PackingRun.${run1}.packout_pct == 85.0"
            - "Lot.${l1}.status == PACKED (full balance consumed)"
            - "Lot.${l1}.weight_balance_lbs == 0"

      - name: settlement_advance_vs_final_payout
        grounds:
          - calculations.settlement_value
          - calculations.pool_price
          - entities.GrowerSettlement.fields.advance_amount_cents
          - entities.GrowerSettlement.fields.final_payment_cents
        distinguishing_aspect: |
          GrowerSettlement-domain dual variant: the provisional advance (60% of
          the floored estimated pool price) pays 205800 cents, while the final
          settlement at close (actual pool-average price minus advance) pays
          137200 cents — different algorithms over the same attributed cartons.
        test_recipe:
          setup:
            - "Grower G, block B (GALA, 240d), lot L (20 bins / 19000 lbs / color 80) stored, room sealed+opened, allocation released -> lot RELEASED"
            - "ACTIVE spec (color 66) and OPEN pool P; run completed for the full 19000 lbs producing 100 cartons -> settlement auto-created ACCRUING with attributed_cartons 100"
            - "Two sales recorded: 300000 cents gross (deduction 8000) and 120000 cents gross (deduction 4000); estimated_price_cents = round_half_up((420000 - (100*650 + 12000)) / 100) = 3430"
          setup_api_calls:
            - { call: "POST /growers", payload: { name: "Grower One", grower_code: "G1" }, as: Admin, captures: { g1: $.data.id } }
            - { call: "POST /growers/${g1}/blocks", payload: { orchard_name: "Riverview", block_code: "B1", variety: "GALA", storage_life_days: 240 }, as: ReceivingClerk, captures: { b1: $.data.id } }
            - { call: "POST /lots", payload: { grower_id: "${g1}", block_id: "${b1}", received_bin_count: 20, received_weight_lbs: 19000, avg_color_pct: 80 }, as: ReceivingClerk, captures: { l1: $.data.id } }
            - { call: "POST /ca-rooms", payload: { room_code: "R1", bin_capacity: 40, o2_setpoint_pct: 1.5 }, as: StorageOperator, captures: { r1: $.data.id } }
            - { call: "POST /ca-rooms/${r1}/allocations", payload: { lot_id: "${l1}", bins: 20 }, as: StorageOperator, captures: { a1: $.data.id } }
            - { call: "POST /ca-rooms/${r1}/atmosphere-readings", payload: { o2_pct: 1.5 }, as: StorageOperator }
            - { call: "POST /ca-rooms/${r1}/seal", payload: { planned_open_date: "2026-11-01T00:00:00Z" }, as: StorageOperator }
            - { call: "POST /ca-rooms/${r1}/open", payload: {}, as: StorageOperator }
            - { call: "POST /allocations/${a1}/release", payload: {}, as: StorageOperator }
            - { call: "POST /specs", payload: { customer_name: "RetailCo", label_code: "RC-TRAY", grade_min: "EXTRA_FANCY", color_min_pct: 66, size_class: "MEDIUM", pack_style: "TRAY" }, as: PoolManager, captures: { sp1: $.data.id } }
            - { call: "POST /pools", payload: { variety: "GALA", grade_class: "EXTRA_FANCY", season: "2026-2027" }, as: PoolManager, captures: { p1: $.data.id } }
            - { call: "POST /packing-runs", payload: { lot_id: "${l1}", spec_id: "${sp1}", pool_id: "${p1}", line_code: "LINE_1", scheduled_start: "2026-08-02T08:00:00Z", scheduled_end: "2026-08-02T12:00:00Z", input_weight_lbs: 19000 }, as: PackingSupervisor, captures: { run1: $.data.id } }
            - { call: "POST /packing-runs/${run1}/complete", payload: { cartons_produced: 100, packed_weight_lbs: 16150, cull_weight_lbs: 1900, juice_weight_lbs: 950 }, as: PackingSupervisor }
            - { call: "POST /pools/${p1}/sales", payload: { cartons_sold: 60, gross_revenue_cents: 300000, deduction_cents: 8000 }, as: PoolManager }
            - { call: "POST /pools/${p1}/sales", payload: { cartons_sold: 40, gross_revenue_cents: 120000, deduction_cents: 4000 }, as: PoolManager }
            - { call: "GET /settlements?pool_id=${p1}", payload: {}, as: Admin, captures: { s1: "$.data[0].id" } }
            - { call: "GET /pools/${p1}", payload: {}, as: Admin, captures: { p_v: $.data.version } }
          trigger:
            - { call: "POST /settlements/${s1}/advance", payload: {}, as: PoolManager, captures: { adv: $.data.advance_amount_cents } }
            - { call: "POST /pools/${p1}/close", payload: { expected_pool_version: "${p_v}" }, as: PoolManager }
            - { call: "GET /settlements/${s1}", payload: {}, as: Admin }
            - { call: "GET /pools/${p1}", payload: {}, as: Admin }
          assert:
            - "GrowerSettlement.${s1}.advance_amount_cents == 205800 (round_half_up(100 * 3430 * 0.60))"
            - "Pool.${p1}.pool_price_per_carton_cents == 3430"
            - "GrowerSettlement.${s1}.final_payment_cents == 137200 (100*3430 - 205800)"
            - "GrowerSettlement.${s1}.status == SETTLED"
            - "Pool.${p1}.rounding_drift_cents == 0"
            - "advance 205800 != final payment 137200 — provisional and final variants diverge"

  # ---------------------------------------------------------------------------
  # Rule 2 — combinatorial_formula (mode (a) weighted non-linear vs mode (b) rounding order)
  # ---------------------------------------------------------------------------
  - rule_id: combinatorial_formula
    instances:
      - name: release_score_weighted_nonlinear
        grounds:
          - calculations.release_priority_score
          - entities.StorageAllocation.fields.release_priority_score
          - entities.CARoom.fields.atmosphere_alarm
        distinguishing_aspect: |
          Mode (a): the score combines >= 3 inputs with non-linear interaction —
          2.0 * disorder_index, conditional +40 alarm bonus, conditional +30
          priority bonus, min(20, days_open) cap, and the per-allocation urgency
          term (30 - min(30, days_remaining)). Observed: 49.0 with alarm +
          urgency, 99.4 once the inspection adds disorder + priority branches.
        test_recipe:
          setup:
            - "Grower/block/lot (GALA, 240d, 10 bins / 9000 lbs) allocated into room R (setpoint 1.5); room sealed with planned_open_date 2026-11-01"
            - "While SEALED, an atmosphere reading of 1.9 raises the alarm (|1.9-1.5| = 0.4 > 0.3); room then opened at the same logical instant (days_open = 0); must_release_by clamps to 2026-08-22 (opened + 21d), so days_remaining = 21 and urgency = 9"
            - "Score before inspection: 2*0 + 40 + 0 + min(20,0) + 9 = 49.0"
          setup_api_calls:
            - { call: "POST /growers", payload: { name: "Grower One", grower_code: "G1" }, as: Admin, captures: { g1: $.data.id } }
            - { call: "POST /growers/${g1}/blocks", payload: { orchard_name: "Riverview", block_code: "B1", variety: "GALA", storage_life_days: 240 }, as: ReceivingClerk, captures: { b1: $.data.id } }
            - { call: "POST /lots", payload: { grower_id: "${g1}", block_id: "${b1}", received_bin_count: 10, received_weight_lbs: 9000, avg_color_pct: 80 }, as: ReceivingClerk, captures: { l1: $.data.id } }
            - { call: "POST /ca-rooms", payload: { room_code: "R1", bin_capacity: 40, o2_setpoint_pct: 1.5 }, as: StorageOperator, captures: { r1: $.data.id } }
            - { call: "POST /ca-rooms/${r1}/allocations", payload: { lot_id: "${l1}", bins: 10 }, as: StorageOperator, captures: { a1: $.data.id } }
            - { call: "POST /ca-rooms/${r1}/atmosphere-readings", payload: { o2_pct: 1.5 }, as: StorageOperator }
            - { call: "POST /ca-rooms/${r1}/seal", payload: { planned_open_date: "2026-11-01T00:00:00Z" }, as: StorageOperator }
            - { call: "POST /ca-rooms/${r1}/atmosphere-readings", payload: { o2_pct: 1.9 }, as: StorageOperator }
            - { call: "POST /ca-rooms/${r1}/open", payload: {}, as: StorageOperator }
            - { call: "GET /allocations/${a1}", payload: {}, as: Admin, captures: { score_before: $.data.release_priority_score } }
          trigger:
            - { call: "POST /ca-rooms/${r1}/inspections", payload: { scald_pct: 4.0, bitter_pit_pct: 3.0, decay_pct: 6.0 }, as: StorageOperator, captures: { i1: $.data.id } }
            - { call: "GET /allocations/${a1}", payload: {}, as: Admin }
            - { call: "GET /ca-rooms/${r1}", payload: {}, as: Admin }
          assert:
            - "score_before == 49.0 (alarm branch + urgency 9)"
            - "DisorderInspection.${i1}.disorder_index == 4.7"
            - "StorageAllocation.${a1}.release_priority_score == 99.4 (2*4.7 + 40 alarm + 30 priority + min(20,0) + urgency 20 after must_release_by pulls to 2026-08-11)"
            - "CARoom.${r1}.priority_release == true"
            - "CARoom.${r1}.planned_open_date == 2026-08-08T00:00:00Z (pulled forward to now + PRIORITY_OPEN_DAYS)"
            - "StorageAllocation.${a1}.must_release_by == 2026-08-11T00:00:00Z (min(2026-08-22, now + PRIORITY_RELEASE_DAYS))"

      - name: pool_price_rounding_order_pinned
        grounds:
          - calculations.pool_price
          - entities.Pool.fields.pool_price_per_carton_cents
          - entities.Pool.fields.rounding_drift_cents
        distinguishing_aspect: |
          Mode (b): nested rounding order is pinned — round the per-carton price
          to whole cents FIRST, then multiply per grower. With net 103051 cents
          over 3 cartons the pinned order pays 3 x 34350 = 103050 (drift -1);
          the alternative (round each grower's exact share) would pay 103051.
        test_recipe:
          setup:
            - "Grower/block/lot stored and released; spec ACTIVE; pool P OPEN; one run completed for 1000 lbs producing exactly 3 cartons"
            - "One sale recorded: gross_revenue_cents 105001, deduction_cents 0 -> net = 105001 - 3*650 = 103051"
          setup_api_calls:
            - { call: "POST /growers", payload: { name: "Grower One", grower_code: "G1" }, as: Admin, captures: { g1: $.data.id } }
            - { call: "POST /growers/${g1}/blocks", payload: { orchard_name: "Riverview", block_code: "B1", variety: "GALA", storage_life_days: 240 }, as: ReceivingClerk, captures: { b1: $.data.id } }
            - { call: "POST /lots", payload: { grower_id: "${g1}", block_id: "${b1}", received_bin_count: 2, received_weight_lbs: 1000, avg_color_pct: 80 }, as: ReceivingClerk, captures: { l1: $.data.id } }
            - { call: "POST /ca-rooms", payload: { room_code: "R1", bin_capacity: 40, o2_setpoint_pct: 1.5 }, as: StorageOperator, captures: { r1: $.data.id } }
            - { call: "POST /ca-rooms/${r1}/allocations", payload: { lot_id: "${l1}", bins: 2 }, as: StorageOperator, captures: { a1: $.data.id } }
            - { call: "POST /ca-rooms/${r1}/atmosphere-readings", payload: { o2_pct: 1.5 }, as: StorageOperator }
            - { call: "POST /ca-rooms/${r1}/seal", payload: { planned_open_date: "2026-11-01T00:00:00Z" }, as: StorageOperator }
            - { call: "POST /ca-rooms/${r1}/open", payload: {}, as: StorageOperator }
            - { call: "POST /allocations/${a1}/release", payload: {}, as: StorageOperator }
            - { call: "POST /specs", payload: { customer_name: "RetailCo", label_code: "RC-TRAY", grade_min: "EXTRA_FANCY", color_min_pct: 66, size_class: "MEDIUM", pack_style: "TRAY" }, as: PoolManager, captures: { sp1: $.data.id } }
            - { call: "POST /pools", payload: { variety: "GALA", grade_class: "EXTRA_FANCY", season: "2026-2027" }, as: PoolManager, captures: { p1: $.data.id } }
            - { call: "POST /packing-runs", payload: { lot_id: "${l1}", spec_id: "${sp1}", pool_id: "${p1}", line_code: "LINE_1", scheduled_start: "2026-08-02T08:00:00Z", scheduled_end: "2026-08-02T12:00:00Z", input_weight_lbs: 1000 }, as: PackingSupervisor, captures: { run1: $.data.id } }
            - { call: "POST /packing-runs/${run1}/complete", payload: { cartons_produced: 3, packed_weight_lbs: 1000, cull_weight_lbs: 0, juice_weight_lbs: 0 }, as: PackingSupervisor }
            - { call: "POST /pools/${p1}/sales", payload: { cartons_sold: 3, gross_revenue_cents: 105001, deduction_cents: 0 }, as: PoolManager }
            - { call: "GET /pools/${p1}", payload: {}, as: Admin, captures: { p_v: $.data.version } }
            - { call: "GET /settlements?pool_id=${p1}", payload: {}, as: Admin, captures: { s1: "$.data[0].id" } }
          trigger:
            - { call: "POST /pools/${p1}/close", payload: { expected_pool_version: "${p_v}" }, as: PoolManager }
            - { call: "GET /pools/${p1}", payload: {}, as: Admin }
            - { call: "GET /settlements/${s1}", payload: {}, as: Admin }
          assert:
            - "Pool.${p1}.pool_price_per_carton_cents == 34350 (round_half_up(103051/3) = 34350.333 -> 34350)"
            - "Pool.${p1}.rounding_drift_cents == -1 (34350*3 - 103051)"
            - "GrowerSettlement.${s1}.final_payment_cents == 103050 — pinned order pays the rounded price times cartons, NOT the 103051 exact-share rounding"

  # ---------------------------------------------------------------------------
  # Rule 3 — non_linear_state_machine (CARoom cycle vs Pool revision loop)
  # ---------------------------------------------------------------------------
  - rule_id: non_linear_state_machine
    instances:
      - name: ca_room_full_cycle_restart
        grounds:
          - state_machines.CARoom.AVAILABLE_to_FILLING
          - state_machines.CARoom.FILLING_to_SEALED
          - state_machines.CARoom.SEALED_to_OPENED
          - state_machines.CARoom.OPENED_to_AVAILABLE
        distinguishing_aspect: |
          CARoom is cyclic: AVAILABLE -> FILLING -> SEALED -> OPENED ->
          AVAILABLE, and the same room accepts a new allocation afterwards
          (FILLING again) with bins_free fully restored — a reuse cycle, not a
          one-way pipeline.
        test_recipe:
          setup:
            - "Room R (cap 40, setpoint 1.5); grower/block; lot L1 (20 bins) allocated -> FILLING"
          setup_api_calls:
            - { call: "POST /growers", payload: { name: "Grower One", grower_code: "G1" }, as: Admin, captures: { g1: $.data.id } }
            - { call: "POST /growers/${g1}/blocks", payload: { orchard_name: "Riverview", block_code: "B1", variety: "GALA", storage_life_days: 240 }, as: ReceivingClerk, captures: { b1: $.data.id } }
            - { call: "POST /lots", payload: { grower_id: "${g1}", block_id: "${b1}", received_bin_count: 20, received_weight_lbs: 19000, avg_color_pct: 80 }, as: ReceivingClerk, captures: { l1: $.data.id } }
            - { call: "POST /ca-rooms", payload: { room_code: "R1", bin_capacity: 40, o2_setpoint_pct: 1.5 }, as: StorageOperator, captures: { r1: $.data.id } }
            - { call: "POST /ca-rooms/${r1}/allocations", payload: { lot_id: "${l1}", bins: 20 }, as: StorageOperator, captures: { a1: $.data.id } }
            - { call: "POST /lots", payload: { grower_id: "${g1}", block_id: "${b1}", received_bin_count: 8, received_weight_lbs: 7000, avg_color_pct: 75 }, as: ReceivingClerk, captures: { l2: $.data.id } }
          trigger:
            - { call: "POST /ca-rooms/${r1}/atmosphere-readings", payload: { o2_pct: 1.5 }, as: StorageOperator }
            - { call: "POST /ca-rooms/${r1}/seal", payload: { planned_open_date: "2026-11-01T00:00:00Z" }, as: StorageOperator }
            - { call: "POST /ca-rooms/${r1}/open", payload: {}, as: StorageOperator }
            - { call: "POST /allocations/${a1}/release", payload: {}, as: StorageOperator }
            - { call: "GET /ca-rooms/${r1}", payload: {}, as: Admin }
            - { call: "POST /ca-rooms/${r1}/allocations", payload: { lot_id: "${l2}", bins: 8 }, as: StorageOperator }
            - { call: "GET /ca-rooms/${r1}", payload: {}, as: Admin }
          assert:
            - "CARoom.${r1}.status == AVAILABLE after the release empties the room (cycle restart)"
            - "CARoom.${r1}.bins_free == 40 after emptying"
            - "CARoom.${r1}.atmosphere_alarm == false and priority_release == false after cycle reset"
            - "Second allocation succeeds and CARoom.${r1}.status == FILLING again with bins_free == 32"

      - name: pool_reopen_revision_loop
        grounds:
          - state_machines.Pool.OPEN_to_CLOSED
          - state_machines.Pool.CLOSED_to_REOPENED
          - state_machines.Pool.REOPENED_to_CLOSED
          - state_machines.GrowerSettlement.SETTLED_to_ADVANCE_PAID
        distinguishing_aspect: |
          Pool has a revision loop (CLOSED -> REOPENED -> CLOSED): a late sale
          after the first close reprices the pool (2350 -> 2800 cents/carton)
          and the re-close pays only the delta (4500) against paid_final_cents,
          while the settlement and lot state revert and re-advance.
        test_recipe:
          setup:
            - "Grower/block/lot (10 bins / 9000 lbs) stored, released; spec ACTIVE; pool P OPEN; run completed for full balance producing 10 cartons"
            - "Sale 1: gross 30000, deduction 0. First close: net = 30000 - 6500 = 23500 -> price 2350; settlement final 23500, SETTLED; lot CLOSED"
            - "Pool reopened (settlement -> ADVANCE_PAID, lot -> PACKED); sale 2: gross 5000, deduction 500"
          setup_api_calls:
            - { call: "POST /growers", payload: { name: "Grower One", grower_code: "G1" }, as: Admin, captures: { g1: $.data.id } }
            - { call: "POST /growers/${g1}/blocks", payload: { orchard_name: "Riverview", block_code: "B1", variety: "GALA", storage_life_days: 240 }, as: ReceivingClerk, captures: { b1: $.data.id } }
            - { call: "POST /lots", payload: { grower_id: "${g1}", block_id: "${b1}", received_bin_count: 10, received_weight_lbs: 9000, avg_color_pct: 80 }, as: ReceivingClerk, captures: { l1: $.data.id } }
            - { call: "POST /ca-rooms", payload: { room_code: "R1", bin_capacity: 40, o2_setpoint_pct: 1.5 }, as: StorageOperator, captures: { r1: $.data.id } }
            - { call: "POST /ca-rooms/${r1}/allocations", payload: { lot_id: "${l1}", bins: 10 }, as: StorageOperator, captures: { a1: $.data.id } }
            - { call: "POST /ca-rooms/${r1}/atmosphere-readings", payload: { o2_pct: 1.5 }, as: StorageOperator }
            - { call: "POST /ca-rooms/${r1}/seal", payload: { planned_open_date: "2026-11-01T00:00:00Z" }, as: StorageOperator }
            - { call: "POST /ca-rooms/${r1}/open", payload: {}, as: StorageOperator }
            - { call: "POST /allocations/${a1}/release", payload: {}, as: StorageOperator }
            - { call: "POST /specs", payload: { customer_name: "RetailCo", label_code: "RC-TRAY", grade_min: "EXTRA_FANCY", color_min_pct: 66, size_class: "MEDIUM", pack_style: "TRAY" }, as: PoolManager, captures: { sp1: $.data.id } }
            - { call: "POST /pools", payload: { variety: "GALA", grade_class: "EXTRA_FANCY", season: "2026-2027" }, as: PoolManager, captures: { p1: $.data.id } }
            - { call: "POST /packing-runs", payload: { lot_id: "${l1}", spec_id: "${sp1}", pool_id: "${p1}", line_code: "LINE_1", scheduled_start: "2026-08-02T08:00:00Z", scheduled_end: "2026-08-02T12:00:00Z", input_weight_lbs: 9000 }, as: PackingSupervisor, captures: { run1: $.data.id } }
            - { call: "POST /packing-runs/${run1}/complete", payload: { cartons_produced: 10, packed_weight_lbs: 7650, cull_weight_lbs: 900, juice_weight_lbs: 450 }, as: PackingSupervisor }
            - { call: "POST /pools/${p1}/sales", payload: { cartons_sold: 10, gross_revenue_cents: 30000, deduction_cents: 0 }, as: PoolManager }
            - { call: "GET /pools/${p1}", payload: {}, as: Admin, captures: { p_v1: $.data.version } }
            - { call: "POST /pools/${p1}/close", payload: { expected_pool_version: "${p_v1}" }, as: PoolManager }
            - { call: "POST /pools/${p1}/reopen", payload: {}, as: PoolManager }
            - { call: "POST /pools/${p1}/sales", payload: { cartons_sold: 10, gross_revenue_cents: 5000, deduction_cents: 500 }, as: PoolManager }
            - { call: "GET /pools/${p1}", payload: {}, as: Admin, captures: { p_v2: $.data.version } }
            - { call: "GET /settlements?pool_id=${p1}", payload: {}, as: Admin, captures: { s1: "$.data[0].id" } }
          trigger:
            - { call: "POST /pools/${p1}/close", payload: { expected_pool_version: "${p_v2}" }, as: PoolManager }
            - { call: "GET /settlements/${s1}", payload: {}, as: Admin }
            - { call: "GET /lots/${l1}", payload: {}, as: Admin }
            - { call: "GET /pools/${p1}", payload: {}, as: Admin }
          assert:
            - "Pool.${p1}.status == CLOSED after the second close (loop REOPENED -> CLOSED)"
            - "Pool.${p1}.pool_price_per_carton_cents == 2800 (net 35000 - 500 - 6500 = 28000 over 10 cartons)"
            - "GrowerSettlement.${s1}.final_payment_cents == 4500 (28000 - 0 advance - 23500 already paid)"
            - "GrowerSettlement.${s1}.paid_final_cents == 28000 == 10 * 2800 (no drift across the loop)"
            - "Lot.${l1}.status == CLOSED again after re-settlement"

  # ---------------------------------------------------------------------------
  # Rule 4 — transitive_cascade (pool close depth-3 vs inspection depth-2)
  # ---------------------------------------------------------------------------
  - rule_id: transitive_cascade
    instances:
      - name: pool_close_cascade_to_lot_closure
        grounds:
          - state_machines.Pool.OPEN_to_CLOSED
          - state_machines.GrowerSettlement.ACCRUING_to_SETTLED
          - state_machines.Lot.PACKED_to_CLOSED
        distinguishing_aspect: |
          Depth-3 cascade from POST /pools/{id}/close: the pool price mutation
          (hop 1) settles every GrowerSettlement (hop 2), and each settlement
          becoming SETTLED closes every PACKED lot it touches (hop 3) — two
          growers' lots both end CLOSED from one trigger.
        test_recipe:
          setup:
            - "Growers G1 (lot L1, 20 bins / 19000 lbs) and G2 (lot L2, 12 bins / 12000 lbs), both GALA blocks with 240d life, both allocated into one room (cap 40), sealed, opened, both allocations released"
            - "Spec ACTIVE; pool P OPEN; run1 completes L1's full balance with 100 cartons; run2 completes L2's full balance with 60 cartons (adjacent line windows)"
            - "Sales: 300000 (ded 8000) + 120000 (ded 4000); net = 420000 - (160*650 + 12000) = 304000; price = 1900 exactly"
          setup_api_calls:
            - { call: "POST /growers", payload: { name: "Grower One", grower_code: "G1" }, as: Admin, captures: { g1: $.data.id } }
            - { call: "POST /growers", payload: { name: "Grower Two", grower_code: "G2" }, as: Admin, captures: { g2: $.data.id } }
            - { call: "POST /growers/${g1}/blocks", payload: { orchard_name: "Riverview", block_code: "B1", variety: "GALA", storage_life_days: 240 }, as: ReceivingClerk, captures: { b1: $.data.id } }
            - { call: "POST /growers/${g2}/blocks", payload: { orchard_name: "Hilltop", block_code: "B7", variety: "GALA", storage_life_days: 240 }, as: ReceivingClerk, captures: { b2: $.data.id } }
            - { call: "POST /lots", payload: { grower_id: "${g1}", block_id: "${b1}", received_bin_count: 20, received_weight_lbs: 19000, avg_color_pct: 80 }, as: ReceivingClerk, captures: { l1: $.data.id } }
            - { call: "POST /lots", payload: { grower_id: "${g2}", block_id: "${b2}", received_bin_count: 12, received_weight_lbs: 12000, avg_color_pct: 78 }, as: ReceivingClerk, captures: { l2: $.data.id } }
            - { call: "POST /ca-rooms", payload: { room_code: "R1", bin_capacity: 40, o2_setpoint_pct: 1.5 }, as: StorageOperator, captures: { r1: $.data.id } }
            - { call: "POST /ca-rooms/${r1}/allocations", payload: { lot_id: "${l1}", bins: 20 }, as: StorageOperator, captures: { a1: $.data.id } }
            - { call: "POST /ca-rooms/${r1}/allocations", payload: { lot_id: "${l2}", bins: 12 }, as: StorageOperator, captures: { a2: $.data.id } }
            - { call: "POST /ca-rooms/${r1}/atmosphere-readings", payload: { o2_pct: 1.5 }, as: StorageOperator }
            - { call: "POST /ca-rooms/${r1}/seal", payload: { planned_open_date: "2026-11-01T00:00:00Z" }, as: StorageOperator }
            - { call: "POST /ca-rooms/${r1}/open", payload: {}, as: StorageOperator }
            - { call: "POST /allocations/${a1}/release", payload: {}, as: StorageOperator }
            - { call: "POST /allocations/${a2}/release", payload: {}, as: StorageOperator }
            - { call: "POST /specs", payload: { customer_name: "RetailCo", label_code: "RC-TRAY", grade_min: "EXTRA_FANCY", color_min_pct: 66, size_class: "MEDIUM", pack_style: "TRAY" }, as: PoolManager, captures: { sp1: $.data.id } }
            - { call: "POST /pools", payload: { variety: "GALA", grade_class: "EXTRA_FANCY", season: "2026-2027" }, as: PoolManager, captures: { p1: $.data.id } }
            - { call: "POST /packing-runs", payload: { lot_id: "${l1}", spec_id: "${sp1}", pool_id: "${p1}", line_code: "LINE_1", scheduled_start: "2026-08-02T08:00:00Z", scheduled_end: "2026-08-02T12:00:00Z", input_weight_lbs: 19000 }, as: PackingSupervisor, captures: { run1: $.data.id } }
            - { call: "POST /packing-runs/${run1}/complete", payload: { cartons_produced: 100, packed_weight_lbs: 16150, cull_weight_lbs: 1900, juice_weight_lbs: 950 }, as: PackingSupervisor }
            - { call: "POST /packing-runs", payload: { lot_id: "${l2}", spec_id: "${sp1}", pool_id: "${p1}", line_code: "LINE_1", scheduled_start: "2026-08-02T12:00:00Z", scheduled_end: "2026-08-02T16:00:00Z", input_weight_lbs: 12000 }, as: PackingSupervisor, captures: { run2: $.data.id } }
            - { call: "POST /packing-runs/${run2}/complete", payload: { cartons_produced: 60, packed_weight_lbs: 10200, cull_weight_lbs: 1200, juice_weight_lbs: 600 }, as: PackingSupervisor }
            - { call: "POST /pools/${p1}/sales", payload: { cartons_sold: 100, gross_revenue_cents: 300000, deduction_cents: 8000 }, as: PoolManager }
            - { call: "POST /pools/${p1}/sales", payload: { cartons_sold: 60, gross_revenue_cents: 120000, deduction_cents: 4000 }, as: PoolManager }
            - { call: "GET /pools/${p1}", payload: {}, as: Admin, captures: { p_v: $.data.version } }
            - { call: "GET /settlements?pool_id=${p1}&grower_id=${g1}", payload: {}, as: Admin, captures: { s1: "$.data[0].id" } }
            - { call: "GET /settlements?pool_id=${p1}&grower_id=${g2}", payload: {}, as: Admin, captures: { s2: "$.data[0].id" } }
          trigger:
            - { call: "POST /pools/${p1}/close", payload: { expected_pool_version: "${p_v}" }, as: PoolManager }
            - { call: "GET /settlements/${s1}", payload: {}, as: Admin }
            - { call: "GET /settlements/${s2}", payload: {}, as: Admin }
            - { call: "GET /lots/${l1}", payload: {}, as: Admin }
            - { call: "GET /lots/${l2}", payload: {}, as: Admin }
          assert:
            - "Pool.${p1}.pool_price_per_carton_cents == 1900 (hop 1 output)"
            - "GrowerSettlement.${s1}.status == SETTLED and final_payment_cents == 190000 (hop 2)"
            - "GrowerSettlement.${s2}.status == SETTLED and final_payment_cents == 114000 (hop 2)"
            - "Lot.${l1}.status == CLOSED (hop 3 — caused by hop 2, not by the close directly)"
            - "Lot.${l2}.status == CLOSED (hop 3)"

      - name: inspection_priority_release_cascade
        grounds:
          - calculations.disorder_index
          - entities.CARoom.fields.priority_release
          - entities.CARoom.fields.planned_open_date
          - entities.StorageAllocation.fields.must_release_by
        distinguishing_aspect: |
          Depth-2 cascade from POST /ca-rooms/{id}/inspections with decay at the
          threshold: the inspection mutates the room (hop 1: priority_release,
          planned_open_date pulled forward), and the room mutation rewrites every
          ACTIVE allocation's must_release_by and score (hop 2) — a different
          trigger and propagation pattern than the pool-close cascade.
        test_recipe:
          setup:
            - "Grower/block/lot (GALA, storage_life_days 240 -> initial must_release_by 2027-03-29T00:00:00Z) allocated into room R; room SEALED with planned_open_date 2026-11-01T00:00:00Z; clock at default 2026-08-01T00:00:00Z"
          setup_api_calls:
            - { call: "POST /growers", payload: { name: "Grower One", grower_code: "G1" }, as: Admin, captures: { g1: $.data.id } }
            - { call: "POST /growers/${g1}/blocks", payload: { orchard_name: "Riverview", block_code: "B1", variety: "GALA", storage_life_days: 240 }, as: ReceivingClerk, captures: { b1: $.data.id } }
            - { call: "POST /lots", payload: { grower_id: "${g1}", block_id: "${b1}", received_bin_count: 10, received_weight_lbs: 9000, avg_color_pct: 80 }, as: ReceivingClerk, captures: { l1: $.data.id } }
            - { call: "POST /ca-rooms", payload: { room_code: "R1", bin_capacity: 40, o2_setpoint_pct: 1.5 }, as: StorageOperator, captures: { r1: $.data.id } }
            - { call: "POST /ca-rooms/${r1}/allocations", payload: { lot_id: "${l1}", bins: 10 }, as: StorageOperator, captures: { a1: $.data.id } }
            - { call: "POST /ca-rooms/${r1}/atmosphere-readings", payload: { o2_pct: 1.5 }, as: StorageOperator }
            - { call: "POST /ca-rooms/${r1}/seal", payload: { planned_open_date: "2026-11-01T00:00:00Z" }, as: StorageOperator }
          trigger:
            - { call: "POST /ca-rooms/${r1}/inspections", payload: { scald_pct: 4.0, bitter_pit_pct: 3.0, decay_pct: 6.0 }, as: StorageOperator, captures: { i1: $.data.id } }
            - { call: "GET /ca-rooms/${r1}", payload: {}, as: Admin }
            - { call: "GET /allocations/${a1}", payload: {}, as: Admin }
          assert:
            - "DisorderInspection.${i1}.disorder_index == 4.7 (hop 0 output: 0.2*4 + 0.3*3 + 0.5*6)"
            - "CARoom.${r1}.priority_release == true (hop 1)"
            - "CARoom.${r1}.planned_open_date == 2026-08-08T00:00:00Z (hop 1: min(2026-11-01, now + 7d))"
            - "CARoom.${r1}.status == SEALED (cascade does not open the room)"
            - "StorageAllocation.${a1}.must_release_by == 2026-08-11T00:00:00Z (hop 2: min(2027-03-29, now + 10d))"
            - "StorageAllocation.${a1}.release_priority_score == 59.4 (hop 2: 2*4.7 + 0 alarm + 30 priority + 0 days_open while SEALED + urgency 20 from days_remaining 10)"

  # ---------------------------------------------------------------------------
  # Rule 5 — priority_pair_validation_conflict (state-vs-fiscal vs safety-vs-temporal)
  # ---------------------------------------------------------------------------
  - rule_id: priority_pair_validation_conflict
    instances:
      - name: sale_on_closed_pool_state_beats_fiscal
        grounds:
          - "validations[priority=8]"
          - "validations[priority=12]"
          - "errors[ERR_POOL_INVALID_STATE]"
          - "errors[ERR_SALE_AMOUNT_INVALID]"
        distinguishing_aspect: |
          Error-category pair state vs business_fiscal: recording a sale with an
          invalid (negative) gross amount on a CLOSED pool violates both
          priority 8 and priority 12 — the state error must win.
        test_recipe:
          setup:
            - "Pool P with 3 attributed cartons (one completed run) and one sale; pool CLOSED"
          setup_api_calls:
            - { call: "POST /growers", payload: { name: "Grower One", grower_code: "G1" }, as: Admin, captures: { g1: $.data.id } }
            - { call: "POST /growers/${g1}/blocks", payload: { orchard_name: "Riverview", block_code: "B1", variety: "GALA", storage_life_days: 240 }, as: ReceivingClerk, captures: { b1: $.data.id } }
            - { call: "POST /lots", payload: { grower_id: "${g1}", block_id: "${b1}", received_bin_count: 2, received_weight_lbs: 1000, avg_color_pct: 80 }, as: ReceivingClerk, captures: { l1: $.data.id } }
            - { call: "POST /ca-rooms", payload: { room_code: "R1", bin_capacity: 40, o2_setpoint_pct: 1.5 }, as: StorageOperator, captures: { r1: $.data.id } }
            - { call: "POST /ca-rooms/${r1}/allocations", payload: { lot_id: "${l1}", bins: 2 }, as: StorageOperator, captures: { a1: $.data.id } }
            - { call: "POST /ca-rooms/${r1}/atmosphere-readings", payload: { o2_pct: 1.5 }, as: StorageOperator }
            - { call: "POST /ca-rooms/${r1}/seal", payload: { planned_open_date: "2026-11-01T00:00:00Z" }, as: StorageOperator }
            - { call: "POST /ca-rooms/${r1}/open", payload: {}, as: StorageOperator }
            - { call: "POST /allocations/${a1}/release", payload: {}, as: StorageOperator }
            - { call: "POST /specs", payload: { customer_name: "RetailCo", label_code: "RC-TRAY", grade_min: "EXTRA_FANCY", color_min_pct: 66, size_class: "MEDIUM", pack_style: "TRAY" }, as: PoolManager, captures: { sp1: $.data.id } }
            - { call: "POST /pools", payload: { variety: "GALA", grade_class: "EXTRA_FANCY", season: "2026-2027" }, as: PoolManager, captures: { p1: $.data.id } }
            - { call: "POST /packing-runs", payload: { lot_id: "${l1}", spec_id: "${sp1}", pool_id: "${p1}", line_code: "LINE_1", scheduled_start: "2026-08-02T08:00:00Z", scheduled_end: "2026-08-02T12:00:00Z", input_weight_lbs: 1000 }, as: PackingSupervisor, captures: { run1: $.data.id } }
            - { call: "POST /packing-runs/${run1}/complete", payload: { cartons_produced: 3, packed_weight_lbs: 1000, cull_weight_lbs: 0, juice_weight_lbs: 0 }, as: PackingSupervisor }
            - { call: "POST /pools/${p1}/sales", payload: { cartons_sold: 3, gross_revenue_cents: 10000, deduction_cents: 0 }, as: PoolManager }
            - { call: "GET /pools/${p1}", payload: {}, as: Admin, captures: { p_v: $.data.version } }
            - { call: "POST /pools/${p1}/close", payload: { expected_pool_version: "${p_v}" }, as: PoolManager }
          trigger:
            - { call: "POST /pools/${p1}/sales", payload: { cartons_sold: 5, gross_revenue_cents: -100, deduction_cents: 0 }, as: PoolManager, captures: { err: $.data.error_id } }
          assert:
            - "err == ERR_POOL_INVALID_STATE (priority 8 state beats priority 12 fiscal)"
            - "HTTP status == 409, not 422"
            - "Pool.${p1}.total_sales_cents unchanged (10000)"

      - name: seal_o2_safety_beats_open_date_temporal
        grounds:
          - "validations[priority=9]"
          - "validations[priority=10]"
          - "errors[ERR_O2_NOT_AT_SETPOINT]"
          - "errors[ERR_OPEN_DATE_NOT_FUTURE]"
        distinguishing_aspect: |
          Error-category pair business_safety vs business_temporal: sealing with
          oxygen off setpoint AND a past planned_open_date violates priorities 9
          and 10 — the safety error must win (different pair than state/fiscal).
        test_recipe:
          setup:
            - "Room R (setpoint 1.5) FILLING with one allocation; current_o2_pct still ambient 20.9 (never pulled down); clock at default 2026-08-01"
          setup_api_calls:
            - { call: "POST /growers", payload: { name: "Grower One", grower_code: "G1" }, as: Admin, captures: { g1: $.data.id } }
            - { call: "POST /growers/${g1}/blocks", payload: { orchard_name: "Riverview", block_code: "B1", variety: "GALA", storage_life_days: 240 }, as: ReceivingClerk, captures: { b1: $.data.id } }
            - { call: "POST /lots", payload: { grower_id: "${g1}", block_id: "${b1}", received_bin_count: 5, received_weight_lbs: 4000, avg_color_pct: 80 }, as: ReceivingClerk, captures: { l1: $.data.id } }
            - { call: "POST /ca-rooms", payload: { room_code: "R1", bin_capacity: 40, o2_setpoint_pct: 1.5 }, as: StorageOperator, captures: { r1: $.data.id } }
            - { call: "POST /ca-rooms/${r1}/allocations", payload: { lot_id: "${l1}", bins: 5 }, as: StorageOperator }
          trigger:
            - { call: "POST /ca-rooms/${r1}/seal", payload: { planned_open_date: "2026-07-01T00:00:00Z" }, as: StorageOperator, captures: { err: $.data.error_id } }
          assert:
            - "err == ERR_O2_NOT_AT_SETPOINT (priority 9 safety beats priority 10 temporal)"
            - "HTTP status == 409, not 422"
            - "CARoom.${r1}.status == FILLING (no partial seal)"

  # ---------------------------------------------------------------------------
  # Rule 6 — boundary_precision_check (O2 strict-> vs pool zero-count)
  # ---------------------------------------------------------------------------
  - rule_id: boundary_precision_check
    instances:
      - name: o2_excursion_exactly_at_tolerance_no_alarm
        grounds:
          - entities.CARoom.fields.atmosphere_alarm
          - entities.CARoom.fields.o2_excursion_count
          - state_machines.CARoom.FILLING_to_SEALED
        distinguishing_aspect: |
          Metric: oxygen percent on POST /ca-rooms/{id}/atmosphere-readings.
          |1.8 - 1.5| = 0.3 exactly (exact decimal arithmetic) is NOT > 0.3, so
          no alarm; 1.9 crosses it. Boundary precision on the strict inequality.
        test_recipe:
          setup:
            - "Room R (setpoint 1.5) FILLING with one allocation; O2 pulled to 1.5; room SEALED"
          setup_api_calls:
            - { call: "POST /growers", payload: { name: "Grower One", grower_code: "G1" }, as: Admin, captures: { g1: $.data.id } }
            - { call: "POST /growers/${g1}/blocks", payload: { orchard_name: "Riverview", block_code: "B1", variety: "GALA", storage_life_days: 240 }, as: ReceivingClerk, captures: { b1: $.data.id } }
            - { call: "POST /lots", payload: { grower_id: "${g1}", block_id: "${b1}", received_bin_count: 5, received_weight_lbs: 4000, avg_color_pct: 80 }, as: ReceivingClerk, captures: { l1: $.data.id } }
            - { call: "POST /ca-rooms", payload: { room_code: "R1", bin_capacity: 40, o2_setpoint_pct: 1.5 }, as: StorageOperator, captures: { r1: $.data.id } }
            - { call: "POST /ca-rooms/${r1}/allocations", payload: { lot_id: "${l1}", bins: 5 }, as: StorageOperator }
            - { call: "POST /ca-rooms/${r1}/atmosphere-readings", payload: { o2_pct: 1.5 }, as: StorageOperator }
            - { call: "POST /ca-rooms/${r1}/seal", payload: { planned_open_date: "2026-11-01T00:00:00Z" }, as: StorageOperator }
          trigger:
            - { call: "POST /ca-rooms/${r1}/atmosphere-readings", payload: { o2_pct: 1.8 }, as: StorageOperator, captures: { alarm_at_boundary: $.data.atmosphere_alarm } }
            - { call: "POST /ca-rooms/${r1}/atmosphere-readings", payload: { o2_pct: 1.9 }, as: StorageOperator, captures: { alarm_above: $.data.atmosphere_alarm, excursions: $.data.o2_excursion_count } }
          assert:
            - "alarm_at_boundary == false (exactly 0.3 is within tolerance; strict > required)"
            - "alarm_above == true"
            - "excursions == 1 (only the true excursion counted)"

      - name: empty_pool_close_rejected
        grounds:
          - state_machines.Pool.OPEN_to_CLOSED
          - "errors[ERR_POOL_EMPTY]"
        distinguishing_aspect: |
          Metric: attributed carton count on POST /pools/{id}/close — the
          zero-count edge. A pool with total_packed_cartons == 0 cannot close;
          the boundary is exactly 0 vs >= 1, on a different endpoint and metric
          than the oxygen tolerance.
        test_recipe:
          setup:
            - "Pool P OPEN with no packing runs; version read fresh"
          setup_api_calls:
            - { call: "POST /pools", payload: { variety: "GALA", grade_class: "EXTRA_FANCY", season: "2026-2027" }, as: PoolManager, captures: { p1: $.data.id } }
            - { call: "GET /pools/${p1}", payload: {}, as: Admin, captures: { p_v: $.data.version } }
          trigger:
            - { call: "POST /pools/${p1}/close", payload: { expected_pool_version: "${p_v}" }, as: PoolManager, captures: { err: $.data.error_id } }
          assert:
            - "err == ERR_POOL_EMPTY"
            - "Pool.${p1}.status == OPEN (close rejected, no state change)"
            - "Pool.${p1}.pool_price_per_carton_cents == null"

  # ---------------------------------------------------------------------------
  # Rule 7 — cross_entity_state_dependency (RunxLot vs SettlementxPool)
  # ---------------------------------------------------------------------------
  - rule_id: cross_entity_state_dependency
    instances:
      - name: run_create_requires_released_lot
        grounds:
          - state_machines.Lot.IN_STORAGE_to_RELEASED
          - "validations[priority=8]"
          - "errors[ERR_LOT_INVALID_STATE]"
        distinguishing_aspect: |
          Entity pair PackingRun x Lot: run creation is gated on the LOT's
          state (must be RELEASED); an IN_STORAGE lot rejects creation, and the
          same request succeeds after the release transition — the gate is the
          sibling entity's state, not the run's own fields.
        test_recipe:
          setup:
            - "Lot L IN_STORAGE (allocated, room sealed but not opened); spec ACTIVE; pool OPEN"
          setup_api_calls:
            - { call: "POST /growers", payload: { name: "Grower One", grower_code: "G1" }, as: Admin, captures: { g1: $.data.id } }
            - { call: "POST /growers/${g1}/blocks", payload: { orchard_name: "Riverview", block_code: "B1", variety: "GALA", storage_life_days: 240 }, as: ReceivingClerk, captures: { b1: $.data.id } }
            - { call: "POST /lots", payload: { grower_id: "${g1}", block_id: "${b1}", received_bin_count: 5, received_weight_lbs: 4000, avg_color_pct: 80 }, as: ReceivingClerk, captures: { l1: $.data.id } }
            - { call: "POST /ca-rooms", payload: { room_code: "R1", bin_capacity: 40, o2_setpoint_pct: 1.5 }, as: StorageOperator, captures: { r1: $.data.id } }
            - { call: "POST /ca-rooms/${r1}/allocations", payload: { lot_id: "${l1}", bins: 5 }, as: StorageOperator, captures: { a1: $.data.id } }
            - { call: "POST /ca-rooms/${r1}/atmosphere-readings", payload: { o2_pct: 1.5 }, as: StorageOperator }
            - { call: "POST /ca-rooms/${r1}/seal", payload: { planned_open_date: "2026-11-01T00:00:00Z" }, as: StorageOperator }
            - { call: "POST /specs", payload: { customer_name: "RetailCo", label_code: "RC-TRAY", grade_min: "EXTRA_FANCY", color_min_pct: 66, size_class: "MEDIUM", pack_style: "TRAY" }, as: PoolManager, captures: { sp1: $.data.id } }
            - { call: "POST /pools", payload: { variety: "GALA", grade_class: "EXTRA_FANCY", season: "2026-2027" }, as: PoolManager, captures: { p1: $.data.id } }
          trigger:
            - { call: "POST /packing-runs", payload: { lot_id: "${l1}", spec_id: "${sp1}", pool_id: "${p1}", line_code: "LINE_1", scheduled_start: "2026-08-02T08:00:00Z", scheduled_end: "2026-08-02T12:00:00Z", input_weight_lbs: 2000 }, as: PackingSupervisor, captures: { err: $.data.error_id } }
            - { call: "POST /ca-rooms/${r1}/open", payload: {}, as: StorageOperator }
            - { call: "POST /allocations/${a1}/release", payload: {}, as: StorageOperator }
            - { call: "POST /packing-runs", payload: { lot_id: "${l1}", spec_id: "${sp1}", pool_id: "${p1}", line_code: "LINE_1", scheduled_start: "2026-08-02T08:00:00Z", scheduled_end: "2026-08-02T12:00:00Z", input_weight_lbs: 2000 }, as: PackingSupervisor, captures: { run1: $.data.id } }
          assert:
            - "err == ERR_LOT_INVALID_STATE while lot is IN_STORAGE"
            - "After release, Lot.${l1}.status == RELEASED and the identical request returns 201"
            - "PackingRun.${run1}.status == SCHEDULED"

      - name: advance_requires_open_pool
        grounds:
          - state_machines.GrowerSettlement.ACCRUING_to_ADVANCE_PAID
          - "validations[priority=8]"
          - "errors[ERR_POOL_INVALID_STATE]"
        distinguishing_aspect: |
          Entity pair GrowerSettlement x Pool (different pair than Run x Lot):
          the advance transition on a settlement is gated on the POOL's state
          (must be OPEN); after the pool closes, advance is rejected even though
          the settlement itself is still ACCRUING.
        test_recipe:
          setup:
            - "Grower/block/lot stored and released; spec ACTIVE; pool OPEN; run completed with 3 cartons -> settlement ACCRUING, attributed_cartons 3; one sale (gross 10000); pool CLOSED (price 2683)"
          setup_api_calls:
            - { call: "POST /growers", payload: { name: "Grower One", grower_code: "G1" }, as: Admin, captures: { g1: $.data.id } }
            - { call: "POST /growers/${g1}/blocks", payload: { orchard_name: "Riverview", block_code: "B1", variety: "GALA", storage_life_days: 240 }, as: ReceivingClerk, captures: { b1: $.data.id } }
            - { call: "POST /lots", payload: { grower_id: "${g1}", block_id: "${b1}", received_bin_count: 2, received_weight_lbs: 1000, avg_color_pct: 80 }, as: ReceivingClerk, captures: { l1: $.data.id } }
            - { call: "POST /ca-rooms", payload: { room_code: "R1", bin_capacity: 40, o2_setpoint_pct: 1.5 }, as: StorageOperator, captures: { r1: $.data.id } }
            - { call: "POST /ca-rooms/${r1}/allocations", payload: { lot_id: "${l1}", bins: 2 }, as: StorageOperator, captures: { a1: $.data.id } }
            - { call: "POST /ca-rooms/${r1}/atmosphere-readings", payload: { o2_pct: 1.5 }, as: StorageOperator }
            - { call: "POST /ca-rooms/${r1}/seal", payload: { planned_open_date: "2026-11-01T00:00:00Z" }, as: StorageOperator }
            - { call: "POST /ca-rooms/${r1}/open", payload: {}, as: StorageOperator }
            - { call: "POST /allocations/${a1}/release", payload: {}, as: StorageOperator }
            - { call: "POST /specs", payload: { customer_name: "RetailCo", label_code: "RC-TRAY", grade_min: "EXTRA_FANCY", color_min_pct: 66, size_class: "MEDIUM", pack_style: "TRAY" }, as: PoolManager, captures: { sp1: $.data.id } }
            - { call: "POST /pools", payload: { variety: "GALA", grade_class: "EXTRA_FANCY", season: "2026-2027" }, as: PoolManager, captures: { p1: $.data.id } }
            - { call: "POST /packing-runs", payload: { lot_id: "${l1}", spec_id: "${sp1}", pool_id: "${p1}", line_code: "LINE_1", scheduled_start: "2026-08-02T08:00:00Z", scheduled_end: "2026-08-02T12:00:00Z", input_weight_lbs: 1000 }, as: PackingSupervisor, captures: { run1: $.data.id } }
            - { call: "POST /packing-runs/${run1}/complete", payload: { cartons_produced: 3, packed_weight_lbs: 1000, cull_weight_lbs: 0, juice_weight_lbs: 0 }, as: PackingSupervisor }
            - { call: "POST /pools/${p1}/sales", payload: { cartons_sold: 3, gross_revenue_cents: 10000, deduction_cents: 0 }, as: PoolManager }
            - { call: "GET /pools/${p1}", payload: {}, as: Admin, captures: { p_v: $.data.version } }
            - { call: "POST /pools/${p1}/close", payload: { expected_pool_version: "${p_v}" }, as: PoolManager }
            - { call: "GET /settlements?pool_id=${p1}", payload: {}, as: Admin, captures: { s1: "$.data[0].id" } }
          trigger:
            - { call: "POST /settlements/${s1}/advance", payload: {}, as: PoolManager, captures: { err: $.data.error_id } }
          assert:
            - "err == ERR_POOL_INVALID_STATE (pool CLOSED gates the settlement's advance)"
            - "GrowerSettlement.${s1}.status == SETTLED (close already settled it; advance stays rejected)"
            - "GrowerSettlement.${s1}.advance_amount_cents == 0"

  # ---------------------------------------------------------------------------
  # Rule 8 — resource_temporal_overlap (half-open line windows vs aggregate bin capacity)
  # ---------------------------------------------------------------------------
  - rule_id: resource_temporal_overlap
    instances:
      - name: line_window_overlap_half_open
        grounds:
          - "validations[priority=10]"
          - "errors[ERR_LINE_SCHEDULE_OVERLAP]"
          - entities.PackingRun.fields.line_code
        distinguishing_aspect: |
          Resource: packing line (PackingRun.line_code) with HALF-OPEN interval
          semantics — [start, end) collisions reject, adjacency at exactly the
          boundary timestamp is allowed, and a different line_code never
          conflicts.
        test_recipe:
          setup:
            - "Lot L RELEASED with balance 19000; spec ACTIVE; pool OPEN; run A SCHEDULED on LINE_1 for [2026-08-02T08:00:00Z, 2026-08-02T12:00:00Z)"
          setup_api_calls:
            - { call: "POST /growers", payload: { name: "Grower One", grower_code: "G1" }, as: Admin, captures: { g1: $.data.id } }
            - { call: "POST /growers/${g1}/blocks", payload: { orchard_name: "Riverview", block_code: "B1", variety: "GALA", storage_life_days: 240 }, as: ReceivingClerk, captures: { b1: $.data.id } }
            - { call: "POST /lots", payload: { grower_id: "${g1}", block_id: "${b1}", received_bin_count: 20, received_weight_lbs: 19000, avg_color_pct: 80 }, as: ReceivingClerk, captures: { l1: $.data.id } }
            - { call: "POST /ca-rooms", payload: { room_code: "R1", bin_capacity: 40, o2_setpoint_pct: 1.5 }, as: StorageOperator, captures: { r1: $.data.id } }
            - { call: "POST /ca-rooms/${r1}/allocations", payload: { lot_id: "${l1}", bins: 20 }, as: StorageOperator, captures: { a1: $.data.id } }
            - { call: "POST /ca-rooms/${r1}/atmosphere-readings", payload: { o2_pct: 1.5 }, as: StorageOperator }
            - { call: "POST /ca-rooms/${r1}/seal", payload: { planned_open_date: "2026-11-01T00:00:00Z" }, as: StorageOperator }
            - { call: "POST /ca-rooms/${r1}/open", payload: {}, as: StorageOperator }
            - { call: "POST /allocations/${a1}/release", payload: {}, as: StorageOperator }
            - { call: "POST /specs", payload: { customer_name: "RetailCo", label_code: "RC-TRAY", grade_min: "EXTRA_FANCY", color_min_pct: 66, size_class: "MEDIUM", pack_style: "TRAY" }, as: PoolManager, captures: { sp1: $.data.id } }
            - { call: "POST /pools", payload: { variety: "GALA", grade_class: "EXTRA_FANCY", season: "2026-2027" }, as: PoolManager, captures: { p1: $.data.id } }
            - { call: "POST /packing-runs", payload: { lot_id: "${l1}", spec_id: "${sp1}", pool_id: "${p1}", line_code: "LINE_1", scheduled_start: "2026-08-02T08:00:00Z", scheduled_end: "2026-08-02T12:00:00Z", input_weight_lbs: 5000 }, as: PackingSupervisor, captures: { run_a: $.data.id } }
          trigger:
            - { call: "POST /packing-runs", payload: { lot_id: "${l1}", spec_id: "${sp1}", pool_id: "${p1}", line_code: "LINE_1", scheduled_start: "2026-08-02T10:00:00Z", scheduled_end: "2026-08-02T13:00:00Z", input_weight_lbs: 5000 }, as: PackingSupervisor, captures: { err: $.data.error_id } }
            - { call: "POST /packing-runs", payload: { lot_id: "${l1}", spec_id: "${sp1}", pool_id: "${p1}", line_code: "LINE_1", scheduled_start: "2026-08-02T12:00:00Z", scheduled_end: "2026-08-02T14:00:00Z", input_weight_lbs: 5000 }, as: PackingSupervisor, captures: { run_b: $.data.id } }
            - { call: "POST /packing-runs", payload: { lot_id: "${l1}", spec_id: "${sp1}", pool_id: "${p1}", line_code: "LINE_2", scheduled_start: "2026-08-02T10:00:00Z", scheduled_end: "2026-08-02T13:00:00Z", input_weight_lbs: 5000 }, as: PackingSupervisor, captures: { run_c: $.data.id } }
          assert:
            - "err == ERR_LINE_SCHEDULE_OVERLAP (10:00-13:00 collides with 08:00-12:00 on LINE_1)"
            - "PackingRun.${run_b} created 201 — adjacency at exactly 12:00 allowed (half-open)"
            - "PackingRun.${run_c} created 201 — same window on LINE_2 never conflicts"

      - name: room_bin_capacity_aggregate
        grounds:
          - "validations[priority=11]"
          - "errors[ERR_ROOM_CAPACITY_EXCEEDED]"
          - entities.CARoom.fields.bins_free
        distinguishing_aspect: |
          Resource: CA room bin slots with AGGREGATE-CAPACITY semantics (sum of
          ACTIVE allocation bins <= bin_capacity) — not interval arithmetic. The
          boundary is exact: 6 bins into 5 free rejects, 5 bins succeeds and
          leaves bins_free == 0.
        test_recipe:
          setup:
            - "Room R capacity 25 with lot L1 occupying 20 bins (bins_free 5); lot L2 received (same grower/block)"
          setup_api_calls:
            - { call: "POST /growers", payload: { name: "Grower One", grower_code: "G1" }, as: Admin, captures: { g1: $.data.id } }
            - { call: "POST /growers/${g1}/blocks", payload: { orchard_name: "Riverview", block_code: "B1", variety: "GALA", storage_life_days: 240 }, as: ReceivingClerk, captures: { b1: $.data.id } }
            - { call: "POST /lots", payload: { grower_id: "${g1}", block_id: "${b1}", received_bin_count: 20, received_weight_lbs: 19000, avg_color_pct: 80 }, as: ReceivingClerk, captures: { l1: $.data.id } }
            - { call: "POST /lots", payload: { grower_id: "${g1}", block_id: "${b1}", received_bin_count: 6, received_weight_lbs: 5500, avg_color_pct: 75 }, as: ReceivingClerk, captures: { l2: $.data.id } }
            - { call: "POST /ca-rooms", payload: { room_code: "R1", bin_capacity: 25, o2_setpoint_pct: 1.5 }, as: StorageOperator, captures: { r1: $.data.id } }
            - { call: "POST /ca-rooms/${r1}/allocations", payload: { lot_id: "${l1}", bins: 20 }, as: StorageOperator, captures: { a1: $.data.id } }
          trigger:
            - { call: "POST /ca-rooms/${r1}/allocations", payload: { lot_id: "${l2}", bins: 6 }, as: StorageOperator, captures: { err: $.data.error_id } }
            - { call: "POST /ca-rooms/${r1}/allocations", payload: { lot_id: "${l2}", bins: 5 }, as: StorageOperator, captures: { a2: $.data.id } }
            - { call: "GET /ca-rooms/${r1}", payload: {}, as: Admin }
          assert:
            - "err == ERR_ROOM_CAPACITY_EXCEEDED (6 > bins_free 5)"
            - "5-bin allocation succeeds: StorageAllocation.${a2}.status == ACTIVE"
            - "CARoom.${r1}.bins_free == 0 (exact-fit boundary allowed)"

  # ---------------------------------------------------------------------------
  # Rule 9 — compensating_invariant (weight lbs vs room bins)
  # ---------------------------------------------------------------------------
  - rule_id: compensating_invariant
    instances:
      - name: run_complete_void_weight_balance_restored
        grounds:
          - calculations.weight_balance
          - state_machines.PackingRun.COMPLETED_to_VOIDED
          - entities.Lot.fields.weight_balance_lbs
        distinguishing_aspect: |
          Conserved quantity: fruit weight (lbs). complete (balance 19000 ->
          15000) paired with its compensating void restores
          weight_balance_lbs == 19000 exactly, zeroes the pool cartons, and
          nulls actual_packout_pct — no drift in the conserved quantity.
        test_recipe:
          setup:
            - "Lot L RELEASED (balance 19000); spec ACTIVE; pool OPEN; run for input_weight_lbs 4000 SCHEDULED then COMPLETED with packed 3400 / cull 400 / juice 200 (sums exactly to 4000), cartons 20"
          setup_api_calls:
            - { call: "POST /growers", payload: { name: "Grower One", grower_code: "G1" }, as: Admin, captures: { g1: $.data.id } }
            - { call: "POST /growers/${g1}/blocks", payload: { orchard_name: "Riverview", block_code: "B1", variety: "GALA", storage_life_days: 240 }, as: ReceivingClerk, captures: { b1: $.data.id } }
            - { call: "POST /lots", payload: { grower_id: "${g1}", block_id: "${b1}", received_bin_count: 20, received_weight_lbs: 19000, avg_color_pct: 80 }, as: ReceivingClerk, captures: { l1: $.data.id } }
            - { call: "POST /ca-rooms", payload: { room_code: "R1", bin_capacity: 40, o2_setpoint_pct: 1.5 }, as: StorageOperator, captures: { r1: $.data.id } }
            - { call: "POST /ca-rooms/${r1}/allocations", payload: { lot_id: "${l1}", bins: 20 }, as: StorageOperator, captures: { a1: $.data.id } }
            - { call: "POST /ca-rooms/${r1}/atmosphere-readings", payload: { o2_pct: 1.5 }, as: StorageOperator }
            - { call: "POST /ca-rooms/${r1}/seal", payload: { planned_open_date: "2026-11-01T00:00:00Z" }, as: StorageOperator }
            - { call: "POST /ca-rooms/${r1}/open", payload: {}, as: StorageOperator }
            - { call: "POST /allocations/${a1}/release", payload: {}, as: StorageOperator }
            - { call: "POST /specs", payload: { customer_name: "RetailCo", label_code: "RC-TRAY", grade_min: "EXTRA_FANCY", color_min_pct: 66, size_class: "MEDIUM", pack_style: "TRAY" }, as: PoolManager, captures: { sp1: $.data.id } }
            - { call: "POST /pools", payload: { variety: "GALA", grade_class: "EXTRA_FANCY", season: "2026-2027" }, as: PoolManager, captures: { p1: $.data.id } }
            - { call: "POST /packing-runs", payload: { lot_id: "${l1}", spec_id: "${sp1}", pool_id: "${p1}", line_code: "LINE_1", scheduled_start: "2026-08-02T08:00:00Z", scheduled_end: "2026-08-02T12:00:00Z", input_weight_lbs: 4000 }, as: PackingSupervisor, captures: { run1: $.data.id } }
            - { call: "POST /packing-runs/${run1}/complete", payload: { cartons_produced: 20, packed_weight_lbs: 3400, cull_weight_lbs: 400, juice_weight_lbs: 200 }, as: PackingSupervisor }
          trigger:
            - { call: "POST /packing-runs/${run1}/void", payload: {}, as: PackingSupervisor }
            - { call: "GET /lots/${l1}", payload: {}, as: Admin }
            - { call: "GET /pools/${p1}", payload: {}, as: Admin }
          assert:
            - "PackingRun.${run1}.status == VOIDED"
            - "Lot.${l1}.weight_balance_lbs == 19000 (complete + void conserves lbs exactly)"
            - "Lot.${l1}.actual_packout_pct == null (no COMPLETED non-VOIDED runs remain)"
            - "Lot.${l1}.status == RELEASED (still packable)"
            - "Pool.${p1}.total_packed_cartons == 0 (carton attribution compensated)"

      - name: allocate_release_bins_free_restored
        grounds:
          - calculations.room_bins
          - state_machines.StorageAllocation.ACTIVE_to_RELEASED
          - entities.CARoom.fields.bins_free
        distinguishing_aspect: |
          Conserved quantity: room bin slots. allocate (bins_free 40 -> 20)
          paired with its compensating release restores bins_free == 40 exactly
          and cycles the emptied OPENED room back to AVAILABLE — a different
          conserved quantity than fruit weight.
        test_recipe:
          setup:
            - "Room R capacity 40; lot L (20 bins) allocated -> FILLING, bins_free 20; room sealed and opened"
          setup_api_calls:
            - { call: "POST /growers", payload: { name: "Grower One", grower_code: "G1" }, as: Admin, captures: { g1: $.data.id } }
            - { call: "POST /growers/${g1}/blocks", payload: { orchard_name: "Riverview", block_code: "B1", variety: "GALA", storage_life_days: 240 }, as: ReceivingClerk, captures: { b1: $.data.id } }
            - { call: "POST /lots", payload: { grower_id: "${g1}", block_id: "${b1}", received_bin_count: 20, received_weight_lbs: 19000, avg_color_pct: 80 }, as: ReceivingClerk, captures: { l1: $.data.id } }
            - { call: "POST /ca-rooms", payload: { room_code: "R1", bin_capacity: 40, o2_setpoint_pct: 1.5 }, as: StorageOperator, captures: { r1: $.data.id } }
            - { call: "POST /ca-rooms/${r1}/allocations", payload: { lot_id: "${l1}", bins: 20 }, as: StorageOperator, captures: { a1: $.data.id } }
            - { call: "POST /ca-rooms/${r1}/atmosphere-readings", payload: { o2_pct: 1.5 }, as: StorageOperator }
            - { call: "POST /ca-rooms/${r1}/seal", payload: { planned_open_date: "2026-11-01T00:00:00Z" }, as: StorageOperator }
            - { call: "POST /ca-rooms/${r1}/open", payload: {}, as: StorageOperator }
          trigger:
            - { call: "POST /allocations/${a1}/release", payload: {}, as: StorageOperator }
            - { call: "GET /ca-rooms/${r1}", payload: {}, as: Admin }
            - { call: "GET /lots/${l1}", payload: {}, as: Admin }
          assert:
            - "StorageAllocation.${a1}.status == RELEASED and release_reason == MANUAL"
            - "CARoom.${r1}.bins_free == 40 (allocate + release conserves bin slots exactly)"
            - "CARoom.${r1}.status == AVAILABLE (emptied OPENED room cycles)"
            - "Lot.${l1}.status == RELEASED (first release transition fired)"
