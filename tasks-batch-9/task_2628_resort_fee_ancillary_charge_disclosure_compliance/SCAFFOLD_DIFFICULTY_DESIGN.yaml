      - name: inclusion_coverage_ratio_is_zero_not_one_when_no_mandatory_fee_exists
        grounds:
          - calculations.fee_program_rollup
          - entities.FeeProgram.fields.inclusion_coverage_ratio
          - entities.FeeProgram.fields.mandatory_fee_count
          - validations[priority=22]
          - endpoints.POST_/fee-programs/{id}/publish
        distinguishing_aspect: |
          METRIC: inclusion_coverage_ratio, a 4-decimal ratio, at the empty-input-set
          boundary, probed through POST /fee-programs/{id}/publish — a different
          metric and a different endpoint from the score/threshold instance. When
          mandatory_fee_count is 0 the ratio must be 0.0000 by the scaffold's
          stated empty-set convention: not 1.0000 (the vacuous-truth answer a
          naive `all(...)` gives), not null, and not a ZeroDivisionError. The
          knock-on is exact: the coverage bonus becomes 0 rather than 10, so an
          otherwise identical profile scores 80 instead of 90.
        test_recipe:
          setup:
            - "A jurisdiction with both mandates true; an ACTIVE property; a channel supporting totals and itemisation"
            - "A program whose ONLY fee is OPTIONAL (SPA_CREDIT), with no FeeInclusion rows anywhere — priority 22 is vacuous because there are no MANDATORY fees to cover"
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-08-01T00:00:00Z" }
              as: PlatformAdmin
              as_user_id: "u-admin-1"
            - call: "POST /jurisdictions"
              payload: { code: "US-NV-CLARK", name: "Clark County NV", occupancy_tax_rate_bps: 1338, first_quote_total_required: true, itemization_required_on_folio: true, mandatory_fee_ban: false, opt_out_mandate: true }
