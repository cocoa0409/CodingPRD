              as: IACommander
              as_user_id: "${cmdr_id}"
            - call: "POST /investigations/${i1_id}/interview-sessions"
              payload: { subject_officer_id: "${subj_id}", hearing_room_id: "${room1_id}", scheduled_start: "2026-08-05T09:00:00Z", scheduled_end: "2026-08-05T10:00:00Z", notice_served_at: "2026-08-01T00:00:00Z", representation_status: "REP_PRESENT" }
              as: Investigator
