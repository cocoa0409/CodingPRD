# SCAFFOLD_DIFFICULTY_DESIGN.yaml - Task 2978 Hotel Channel Management & Rate Distribution
# SKILL.md §1.8 test-targeting index. Every instance grounds in SCAFFOLD.yaml §1.1-§1.7 only.
# Every numeric literal in every `assert:` line was computed by executing the corresponding
# §1.3 formula in code before being written here.
#
# Canonical fixture world used by most instances (property HTL-SFO):
#   overbooking_pct_bp 1000, booking_horizon_days 365, mix_window_days 30,
#   rate_mismatch_tolerance_cents 200, required_image_count 5
#   KING  physical_capacity_units 10, master_description_hash "kingv1", 5 images -> ceiling 11
#   TWIN  physical_capacity_units 2, overbooking_pct_bp 5000                     -> ceiling 3
#   OTA1  OTA_PUBLIC   commission_bp 1750, sell_adjustment_bp 0, geo ["US-CA"], member rates on
#   BRAND DIRECT_BRAND commission_bp 0
#   OPQ1  OTA_OPAQUE   commission_bp 2500, allows_opaque_rate true
#   BAR   PUBLIC 25000 [18000, 40000]

scaffold_difficulty_design:

  # =====================================================================================
  - rule_id: dual_variant_calc
    instances:

      - name: channel_net_adr_stay_basis_versus_booked_basis
        grounds:
          - calculations.channel_net_adr
          - calculations.channel_revenue_ledger
          - calculations.reservation_charge_breakdown
          - entities.Channel.fields.commission_bp
        distinguishing_aspect: |
          The two variants of channel_net_adr select DIFFERENT reservations and DIFFERENT room
          nights from the identical window 2026-09-01..2026-09-11 on the identical two-reservation
          data set: stay_basis picks 2 in-window nights of the reservation booked BEFORE the window
          and yields net_adr_cents 17737, while booked_basis picks all nights of the reservation
          CREATED inside the window and yields 18562, so the same GET differs by 825 cents.
        test_recipe:
          setup:
            - "Property HTL-SFO with one room type KING (capacity 10) and one channel OTA1 (commission_bp 1750, sell_adjustment_bp 0, geo US-CA, member rates allowed) whose connection is HEALTHY."
            - "Rate plan BAR ACTIVE at 25000 with two APPROVED promotions: MEMBER10 (PERCENT 1000, 2026-09-01..2026-09-30) and GEO10USD (AMOUNT 1000, 2026-09-10..2026-09-11, US-CA)."
            - "Reservation A booked at clock 2026-08-25 for 2026-09-10 x 3 nights, member from US-CA: nightly 21500 / 21500 / 22500, gross 65500, commission 11464, net 54036."
            - "Reservation B booked at clock 2026-09-03 for 2026-09-20 x 1 night, member from US-CA: nightly 22500, gross 22500, commission 3938, net 18562."
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { current_utc: "2026-08-25T00:00:00.000Z" }
              as: PlatformAdmin
            - call: "POST /distribution/properties"
              payload: { code: "HTL-SFO", name: "Harborview SFO", currency_code: "USD", overbooking_pct_bp: 1000, booking_horizon_days: 365, mix_window_days: 30, rate_mismatch_tolerance_cents: 200, required_image_count: 5 }
              as: PlatformAdmin
              captures: { prop_id: $.data.id }
            - call: "POST /distribution/properties/${prop_id}/room-types"
              payload: { code: "KING", name: "King Room", physical_capacity_units: 10, master_description_hash: "kingv1", master_image_count: 5 }
              as: RevenueManager
              captures: { king_id: $.data.id }
            - call: "POST /distribution/properties/${prop_id}/channels"
              payload: { code: "OTA1", channel_kind: "OTA_PUBLIC", commission_bp: 1750, sell_adjustment_bp: 0, allows_member_rate: true, geo_market_codes: ["US-CA"] }
              as: PlatformAdmin
              captures: { ota1_id: $.data.id }
            - call: "POST /distribution/channels/${ota1_id}/connections"
              payload: { protocol: "JSON_PUSH", endpoint_url: "https://ota1.example.com/ari", heartbeat_interval_minutes: 15 }
              as: ChannelOpsEngineer
              captures: { ota1_conn_id: $.data.id }
            - call: "POST /distribution/channel-connections/${ota1_conn_id}/activate"
              payload: {}
              as: ChannelOpsEngineer
            - call: "POST /distribution/properties/${prop_id}/rate-plans"
              payload: { code: "BAR", rate_class: "PUBLIC", base_amount_cents: 25000, floor_amount_cents: 18000, ceiling_amount_cents: 40000 }
              as: RevenueManager
              captures: { bar_id: $.data.id }
            - call: "POST /distribution/rate-plans/${bar_id}/activate"
              payload: {}
              as: RevenueManager
            - call: "POST /distribution/rate-plans/${bar_id}/promotions"
              payload: { code: "MEMBER10", promo_kind: "MEMBER_RATE", discount_kind: "PERCENT", discount_bp: 1000, start_date: "2026-09-01", end_date: "2026-09-30" }
              as: RevenueManager
              captures: { member10_id: $.data.id }
            - call: "POST /distribution/promotions/${member10_id}/submit"
              payload: {}
              as: RevenueManager
              as_user_id: "rm-1"
            - call: "POST /distribution/promotions/${member10_id}/approve"
              payload: {}
              as: RevenueDirector
              as_user_id: "rd-1"
            - call: "POST /distribution/rate-plans/${bar_id}/promotions"
              payload: { code: "GEO10USD", promo_kind: "GEO_OFFER", discount_kind: "AMOUNT", discount_amount_cents: 1000, start_date: "2026-09-10", end_date: "2026-09-11", geo_market_codes: ["US-CA"] }
              as: RevenueManager
              captures: { geo10_id: $.data.id }
            - call: "POST /distribution/promotions/${geo10_id}/submit"
              payload: {}
              as: RevenueManager
              as_user_id: "rm-1"
            - call: "POST /distribution/promotions/${geo10_id}/approve"
              payload: {}
              as: RevenueDirector
              as_user_id: "rd-1"
            - call: "POST /distribution/room-types/${king_id}/inventory-days"
              payload: { stay_date: "2026-09-10" }
              as: RevenueManager
            - call: "POST /distribution/room-types/${king_id}/inventory-days"
              payload: { stay_date: "2026-09-11" }
              as: RevenueManager
            - call: "POST /distribution/room-types/${king_id}/inventory-days"
              payload: { stay_date: "2026-09-12" }
              as: RevenueManager
            - call: "POST /distribution/room-types/${king_id}/inventory-days"
              payload: { stay_date: "2026-09-20" }
              as: RevenueManager
            - call: "POST /distribution/reservations"
              payload: { channel_id: "${ota1_id}", rate_plan_id: "${bar_id}", room_type_id: "${king_id}", arrival_date: "2026-09-10", nights: 3, member_flag: true, geo_market_code: "US-CA" }
              as: RevenueManager
              captures: { res_a_id: $.data.id }
            - call: "POST /_clock/set_current_utc"
              payload: { current_utc: "2026-09-03T00:00:00.000Z" }
              as: PlatformAdmin
            - call: "POST /distribution/reservations"
              payload: { channel_id: "${ota1_id}", rate_plan_id: "${bar_id}", room_type_id: "${king_id}", arrival_date: "2026-09-20", nights: 1, member_flag: true, geo_market_code: "US-CA" }
              as: RevenueManager
              captures: { res_b_id: $.data.id }
          trigger:
            - call: "GET /distribution/channels/${ota1_id}/performance"
              payload: { window_start_date: "2026-09-01", window_end_date: "2026-09-11", basis: "STAY" }
              as: RevenueManager
            - call: "GET /distribution/channels/${ota1_id}/performance"
              payload: { window_start_date: "2026-09-01", window_end_date: "2026-09-11", basis: "BOOKED" }
              as: RevenueManager
          assert:
            - "STAY response: data.basis == STAY, data.room_nights == 2, data.gross_amount_cents == 43000, data.commission_amount_cents == 7526, data.net_amount_cents == 35474, data.net_adr_cents == 17737, data.commission_cost_ratio_bp == 1750"
            - "BOOKED response: data.basis == BOOKED, data.room_nights == 1, data.gross_amount_cents == 22500, data.commission_amount_cents == 3938, data.net_amount_cents == 18562, data.net_adr_cents == 18562, data.commission_cost_ratio_bp == 1750"
            - "The two variants diverge on identical data: 17737 != 18562, delta == 825 cents"
            - "STAY excludes Reservation.${res_b_id} entirely (stay 2026-09-20 is outside the window) and BOOKED excludes Reservation.${res_a_id} entirely (created_at 2026-08-25 is outside the window)"
            - "data.health_score_bp == null in both responses (no RateDistributionJob has resolved on OTA1)"

      - name: booking_pace_rolling_baseline_versus_stly_baseline
        grounds:
          - calculations.booking_pace_index
          - entities.Reservation.fields.arrival_date
          - entities.Reservation.fields.departure_date
        distinguishing_aspect: |
          On identical data the rolling_baseline variant multiplies the numerator by
          PACE_BASELINE_WINDOW_DAYS and divides by a 7-day total of 2 room nights, giving
          pace_index_bp 35000 and pace_state AHEAD, while stly_baseline divides by the single
          2025-09-11 date's 1 room night with NO multiplier, giving 10000 and ON_PACE.
        test_recipe:
          setup:
            - "Property HTL-SFO with room type KING, channel OTA1 (HEALTHY connection) and rate plan BAR ACTIVE at 25000; no promotions, so every night prices at 25000."
            - "Clock starts at 2025-09-04. One CONFIRMED reservation for 2025-09-11 x 1 night is booked at that clock - this is the STLY baseline date (2026-09-10 minus STLY_OFFSET_DAYS 364) measured at its own cutoff 2025-09-04."
            - "Clock moves to 2026-08-25. One CONFIRMED reservation for 2026-09-03 x 2 nights is booked, putting 1 room night on each of 2026-09-03 and 2026-09-04, both inside the rolling baseline window 2026-09-03..2026-09-09 and both created on or before their per-date cutoffs 2026-08-27 and 2026-08-28."
            - "Clock moves to 2026-09-03. One CONFIRMED reservation for 2026-09-10 x 1 night is booked, so target_room_nights == 1 at as_of_date 2026-09-03 and days_out == 7."
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { current_utc: "2025-09-04T00:00:00.000Z" }
              as: PlatformAdmin
            - call: "POST /distribution/properties"
              payload: { code: "HTL-SFO", name: "Harborview SFO", currency_code: "USD", overbooking_pct_bp: 1000, booking_horizon_days: 365, mix_window_days: 30, rate_mismatch_tolerance_cents: 200, required_image_count: 5 }
              as: PlatformAdmin
              captures: { prop_id: $.data.id }
            - call: "POST /distribution/properties/${prop_id}/room-types"
              payload: { code: "KING", name: "King Room", physical_capacity_units: 10, master_description_hash: "kingv1", master_image_count: 5 }
              as: RevenueManager
              captures: { king_id: $.data.id }
            - call: "POST /distribution/properties/${prop_id}/channels"
              payload: { code: "OTA1", channel_kind: "OTA_PUBLIC", commission_bp: 1750, sell_adjustment_bp: 0, allows_member_rate: true, geo_market_codes: ["US-CA"] }
              as: PlatformAdmin
              captures: { ota1_id: $.data.id }
            - call: "POST /distribution/channels/${ota1_id}/connections"
              payload: { protocol: "JSON_PUSH", endpoint_url: "https://ota1.example.com/ari", heartbeat_interval_minutes: 15 }
              as: ChannelOpsEngineer
              captures: { ota1_conn_id: $.data.id }
            - call: "POST /distribution/channel-connections/${ota1_conn_id}/activate"
              payload: {}
              as: ChannelOpsEngineer
            - call: "POST /distribution/properties/${prop_id}/rate-plans"
              payload: { code: "BAR", rate_class: "PUBLIC", base_amount_cents: 25000, floor_amount_cents: 18000, ceiling_amount_cents: 40000 }
              as: RevenueManager
              captures: { bar_id: $.data.id }
            - call: "POST /distribution/rate-plans/${bar_id}/activate"
              payload: {}
              as: RevenueManager
            - call: "POST /distribution/room-types/${king_id}/inventory-days"
              payload: { stay_date: "2025-09-11" }
              as: RevenueManager
            - call: "POST /distribution/reservations"
              payload: { channel_id: "${ota1_id}", rate_plan_id: "${bar_id}", room_type_id: "${king_id}", arrival_date: "2025-09-11", nights: 1 }
              as: RevenueManager
              captures: { res_stly_id: $.data.id }
            - call: "POST /_clock/set_current_utc"
              payload: { current_utc: "2026-08-25T00:00:00.000Z" }
              as: PlatformAdmin
            - call: "POST /distribution/room-types/${king_id}/inventory-days"
              payload: { stay_date: "2026-09-03" }
              as: RevenueManager
            - call: "POST /distribution/room-types/${king_id}/inventory-days"
              payload: { stay_date: "2026-09-04" }
              as: RevenueManager
            - call: "POST /distribution/room-types/${king_id}/inventory-days"
              payload: { stay_date: "2026-09-10" }
              as: RevenueManager
            - call: "POST /distribution/reservations"
              payload: { channel_id: "${ota1_id}", rate_plan_id: "${bar_id}", room_type_id: "${king_id}", arrival_date: "2026-09-03", nights: 2 }
              as: RevenueManager
              captures: { res_roll_id: $.data.id }
            - call: "POST /_clock/set_current_utc"
              payload: { current_utc: "2026-09-03T00:00:00.000Z" }
              as: PlatformAdmin
            - call: "POST /distribution/reservations"
              payload: { channel_id: "${ota1_id}", rate_plan_id: "${bar_id}", room_type_id: "${king_id}", arrival_date: "2026-09-10", nights: 1 }
              as: RevenueManager
              captures: { res_target_id: $.data.id }
          trigger:
            - call: "GET /distribution/room-types/${king_id}/pace"
              payload: { target_stay_date: "2026-09-10", baseline: "ROLLING" }
              as: RevenueManager
            - call: "GET /distribution/room-types/${king_id}/pace"
              payload: { target_stay_date: "2026-09-10", baseline: "STLY" }
              as: RevenueManager
          assert:
            - "ROLLING response: data.as_of_date == 2026-09-03, data.days_out == 7, data.target_room_nights == 1, data.baseline_room_nights == 2, data.pace_index_bp == 35000, data.pace_state == AHEAD"
            - "STLY response: data.as_of_date == 2026-09-03, data.days_out == 7, data.target_room_nights == 1, data.baseline_room_nights == 1, data.pace_index_bp == 10000, data.pace_state == ON_PACE"
            - "Same target_room_nights (1) in both variants; only the denominator and the PACE_BASELINE_WINDOW_DAYS multiplier differ, so 35000 != 10000 and the pace_state verdict flips from AHEAD to ON_PACE"
            - "Reservation.${res_stly_id} contributes only to the STLY baseline and Reservation.${res_roll_id} only to the ROLLING baseline"

  # =====================================================================================
  - rule_id: combinatorial_formula
    instances:

      - name: sell_rate_stacking_cap_applies_to_total_after_nested_clamp
        grounds:
          - calculations.sell_rate_resolution
          - entities.RatePlan.fields.floor_amount_cents
          - entities.RatePlan.fields.ceiling_amount_cents
          - entities.Promotion.fields.discount_kind
        distinguishing_aspect: |
          Mode (a) nested min/max with conditional branches: S3's cap is evaluated on the TOTAL
          discount (8500) against floor(base * 3000 / 10000) == 7500 and rewrites running to
          base - cap == 17500, whereas capping each promotion separately would leave 16500 and
          clamping before the cap would leave 15000 - three different observable outputs from the
          same base, promotions, channel and plan bounds.
        test_recipe:
          setup:
            - "Property HTL-SFO, room type KING, channel OTA1 (sell_adjustment_bp 0, geo US-CA, member rates allowed) with a HEALTHY connection."
            - "Rate plan BARCAP ACTIVE: PUBLIC, base 25000, floor 15000, ceiling 40000, no package inclusion."
            - "Two APPROVED promotions on BARCAP covering 2026-09-10: MEMBER30 (MEMBER_RATE, PERCENT 3000) and GEO10USD (GEO_OFFER, AMOUNT 1000, US-CA)."
            - "A VERIFIED channel mapping of BARCAP x OTA1 x KING with content hash kingv1 and 5 images."
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { current_utc: "2026-08-25T00:00:00.000Z" }
              as: PlatformAdmin
            - call: "POST /distribution/properties"
              payload: { code: "HTL-SFO", name: "Harborview SFO", currency_code: "USD", overbooking_pct_bp: 1000, booking_horizon_days: 365, mix_window_days: 30, rate_mismatch_tolerance_cents: 200, required_image_count: 5 }
              as: PlatformAdmin
              captures: { prop_id: $.data.id }
            - call: "POST /distribution/properties/${prop_id}/room-types"
              payload: { code: "KING", name: "King Room", physical_capacity_units: 10, master_description_hash: "kingv1", master_image_count: 5 }
              as: RevenueManager
              captures: { king_id: $.data.id }
            - call: "POST /distribution/properties/${prop_id}/channels"
              payload: { code: "OTA1", channel_kind: "OTA_PUBLIC", commission_bp: 1750, sell_adjustment_bp: 0, allows_member_rate: true, geo_market_codes: ["US-CA"] }
              as: PlatformAdmin
              captures: { ota1_id: $.data.id }
            - call: "POST /distribution/channels/${ota1_id}/connections"
              payload: { protocol: "JSON_PUSH", endpoint_url: "https://ota1.example.com/ari", heartbeat_interval_minutes: 15 }
              as: ChannelOpsEngineer
              captures: { ota1_conn_id: $.data.id }
            - call: "POST /distribution/channel-connections/${ota1_conn_id}/activate"
              payload: {}
              as: ChannelOpsEngineer
            - call: "POST /distribution/properties/${prop_id}/rate-plans"
              payload: { code: "BARCAP", rate_class: "PUBLIC", base_amount_cents: 25000, floor_amount_cents: 15000, ceiling_amount_cents: 40000 }
              as: RevenueManager
              captures: { barcap_id: $.data.id }
            - call: "POST /distribution/rate-plans/${barcap_id}/activate"
              payload: {}
              as: RevenueManager
            - call: "POST /distribution/rate-plans/${barcap_id}/promotions"
              payload: { code: "MEMBER30", promo_kind: "MEMBER_RATE", discount_kind: "PERCENT", discount_bp: 3000, start_date: "2026-09-01", end_date: "2026-09-30" }
              as: RevenueManager
              captures: { member30_id: $.data.id }
            - call: "POST /distribution/promotions/${member30_id}/submit"
              payload: {}
              as: RevenueManager
              as_user_id: "rm-1"
            - call: "POST /distribution/promotions/${member30_id}/approve"
              payload: {}
              as: RevenueDirector
              as_user_id: "rd-1"
            - call: "POST /distribution/rate-plans/${barcap_id}/promotions"
              payload: { code: "GEO10USD", promo_kind: "GEO_OFFER", discount_kind: "AMOUNT", discount_amount_cents: 1000, start_date: "2026-09-10", end_date: "2026-09-11", geo_market_codes: ["US-CA"] }
              as: RevenueManager
              captures: { geo10_id: $.data.id }
            - call: "POST /distribution/promotions/${geo10_id}/submit"
              payload: {}
              as: RevenueManager
              as_user_id: "rm-1"
            - call: "POST /distribution/promotions/${geo10_id}/approve"
              payload: {}
              as: RevenueDirector
              as_user_id: "rd-1"
            - call: "POST /distribution/channel-mappings"
              payload: { rate_plan_id: "${barcap_id}", channel_id: "${ota1_id}", room_type_id: "${king_id}", external_rate_code: "BARCAP-OTA1-KING", content_description_hash: "kingv1", content_image_count: 5 }
              as: ChannelOpsEngineer
              captures: { map_id: $.data.id }
            - call: "POST /distribution/channel-mappings/${map_id}/verify"
              payload: {}
              as: ChannelOpsEngineer
          trigger:
            - call: "GET /distribution/channel-mappings/${map_id}/quoted-rate"
              payload: { stay_date: "2026-09-10", member_flag: true, geo_market_code: "US-CA" }
              as: RevenueManager
          assert:
            - "data.base_amount_cents == 25000"
            - "data.promotion_discount_cents == 7500 (raw stacked discount 8500 truncated to the cap, not 8500)"
            - "data.discount_cap_cents == 7500"
            - "data.channel_adjusted_cents == 17500"
            - "data.clamped_cents == 17500 (inside [15000, 40000], so S5 is a no-op)"
            - "data.sell_amount_cents == 17500, NOT 16500 (per-promotion capping) and NOT 15000 (clamp applied before the cap)"
            - "data.applied_promotion_codes == [MEMBER30, GEO10USD] in that fixed kind order"

      - name: commission_rounded_per_night_then_summed_not_on_gross
        grounds:
          - calculations.reservation_charge_breakdown
          - calculations.package_loyalty_credit
          - entities.Reservation.fields.nightly_breakdown
        distinguishing_aspect: |
          Mode (b) rounding boundary: the three nights 21500 / 21500 / 22500 at commission_bp 1750
          round to 3763 + 3763 + 3938 == 11464, while rounding once on the 65500 gross gives 11463 -
          a 1-cent difference that also shifts net_amount_cents from 54037 to 54036.
        test_recipe:
          setup:
            - "Identical world to channel_net_adr_stay_basis_versus_booked_basis up to and including Reservation A; Reservation B is not created."
