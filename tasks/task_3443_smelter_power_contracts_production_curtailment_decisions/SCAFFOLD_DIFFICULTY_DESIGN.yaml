              as: EnergyManager
              captures: { pc: $.data.id }
            - call: "POST /smelter-ops/power-contracts/${pc}/activate"
              payload: {}
              as: EnergyManager
            - call: "POST /smelter-ops/environmental-permits"
              payload: { smelter_id: "${sm}", permit_type: "SPL_DISPOSAL", valid_from: "2026-01-01T00:00:00Z", valid_to: "2027-06-01T00:00:00Z" }
              as: EHSManager
              captures: { perm: $.data.id }
            - call: "POST /smelter-ops/potlines"
              payload: { smelter_id: "${sm}", line_code: "P1", capacity_tpd: 500, amperage_ka: 320 }
              as: SmelterManager
              captures: { pl: $.data.id }
            - call: "POST /smelter-ops/potlines/${pl}/curtail"
              payload: { depth_pct: 100 }
              as: SmelterManager
            - call: "POST /smelter-ops/restart-plans"
              payload: { potline_id: "${pl}", planned_restart_at: "2026-09-05T00:00:00Z" }
              as: SmelterManager
              captures: { rp: $.data.id }
            - call: "POST /smelter-ops/restart-plans/${rp}/start"
              payload: {}
              as: SmelterManager
            - call: "POST /smelter-ops/environmental-permits/${perm}/suspend"
              payload: {}
              as: EHSManager
          trigger:
            - call: "POST /smelter-ops/restart-plans/${rp}/start"
              payload: {}
              as: SmelterManager
              captures: { err: $.data.error_id }
          assert:
            - "error_id == ERR_RESTART_PLAN_INVALID_STATE (state, priority 9), NOT ERR_PERMIT_NOT_ACTIVE (business_safety, priority 11)"
            - "RestartPlan.${rp}.status remains IN_PROGRESS"

      - name: execute_notice_period_beats_hedge_coverage
        grounds:
          - validations[priority=12]
          - validations[priority=25]
          - errors[ERR_LABOR_NOTICE_PERIOD]
          - errors[ERR_HEDGE_COVERAGE_INSUFFICIENT]
        distinguishing_aspect: |
          Different error-category pair than the restart instance: business_temporal
          vs business_fiscal. The decision was approved 0 days ago under a 14-day
          notice agreement (temporal violation) AND the smelter has zero hedge
          coverage (fiscal violation). Priority 12 temporal beats priority 24
          fiscal, so the observed error is ERR_LABOR_NOTICE_PERIOD.
        test_recipe:
          setup:
            - "Smelter with ACTIVE contract, potline 500 tpd, labor agreement with notice_period_days 14, no hedge positions (coverage ratio 0.0), full price set, decision APPROVED at the default clock."
          setup_api_calls:
