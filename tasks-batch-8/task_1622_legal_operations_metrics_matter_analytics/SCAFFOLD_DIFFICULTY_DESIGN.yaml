              as: LegalOpsAnalyst
              captures: { m3_id: $.data.id }
            - call: "POST /legal-ops/matters/${m3_id}/assignments"
              payload: { counsel_id: "${counsel_id}", allocated_hours: 1 }
              as: LegalOpsAnalyst
              captures: { err: $.data.error_id }
          assert:
            - "At exactly 100/100 capacity the second assignment succeeded (inclusive boundary)"
            - "The 101st hour is rejected: error_id == ERR_CAPACITY_EXCEEDED (strict > comparison)"

  # ==========================================================================
  # Rule 7 — cross_entity_state_dependency (≥2 instances, different entity pairs)
  # ==========================================================================
  - rule_id: cross_entity_state_dependency
    instances:
      - name: matter_close_blocked_by_outstanding_accrual
        grounds:
          - state_machines.Matter.transitions.ACTIVE_to_CLOSED
          - state_machines.Accrual
        distinguishing_aspect: |
          Pair (Matter, Accrual): Matter.ACTIVE -> CLOSED is gated on the
          absence of OUTSTANDING Accrual rows for the matter. Cross-entity
          dependency where Matter's valid transitions depend on Accrual's state.
        test_recipe:
          setup:
            - "Department; FP OPEN; PA; MT; firm F; counsel C; Matter M ACTIVE"
            - "Accrual AC for M OUTSTANDING"
          setup_api_calls:
            - call: "POST /legal-ops/departments"
              payload: { name: "D" }
              as: LegalOpsManager
            - call: "POST /legal-ops/fiscal-periods"
              payload: { label: "FY2026", start_date: "2026-01-01", end_date: "2026-12-31" }
              as: LegalOpsManager
              captures: { fp_id: $.data.id }
            - call: "POST /legal-ops/practice-areas"
              payload: { code: "LIT", display_name: "L" }
              as: LegalOpsManager
              captures: { pa_id: $.data.id }
            - call: "POST /legal-ops/practice-areas/${pa_id}/matter-types"
              payload: { code: "LIT-C", display_name: "C" }
              as: LegalOpsManager
              captures: { mt_id: $.data.id }
            - call: "POST /legal-ops/firms"
              payload: { name: "F", tier: "TIER_1", blended_hourly_rate_cents: 25000 }
              as: LegalOpsManager
              captures: { firm_id: $.data.id }
            - call: "POST /legal-ops/in-house-counsel"
              payload: { full_name: "C", email: "c@x.com", annual_capacity_hours: 2000, loaded_hourly_cost_cents: 15000 }
              as: LegalOpsManager
              captures: { counsel_id: $.data.id }
            - call: "POST /legal-ops/matters"
              payload: { matter_number: "LGL-2026-00001", title: "M", practice_area_id: "${pa_id}", matter_type_id: "${mt_id}", fiscal_period_id: "${fp_id}", lead_counsel_id: "${counsel_id}", primary_firm_id: "${firm_id}" }
              as: LegalOpsAnalyst
              captures: { m_id: $.data.id, m_v: $.data.version }
            - call: "POST /legal-ops/matters/${m_id}/assignments"
              payload: { counsel_id: "${counsel_id}", allocated_hours: 5 }
              as: LegalOpsAnalyst
            - call: "POST /legal-ops/matters/${m_id}/activate"
              payload: {}
              as: LegalOpsAnalyst
            - call: "POST /legal-ops/accruals"
              payload: { matter_id: "${m_id}", fiscal_period_id: "${fp_id}", firm_id: "${firm_id}", amount_cents: 100000 }
              as: LegalOpsAnalyst
            - call: "GET /legal-ops/matters/${m_id}"
              as: LegalOpsAnalyst
              captures: { m_v_pre: $.data.version }
          trigger:
            - call: "POST /legal-ops/matters/${m_id}/close"
              payload: { expected_matter_version: "${m_v_pre}" }
              as: LegalOpsAnalyst
              captures: { err: $.data.error_id }
          assert:
            - "Close rejected: error_id == ERR_INVALID_STATE"
            - "Matter.status remains ACTIVE"
            - "Cross-entity dependency: an OUTSTANDING Accrual blocks Matter's ACTIVE -> CLOSED transition"

      - name: dashboard_publish_blocked_by_period_state
        grounds:
          - state_machines.Dashboard.transitions.DRAFT_to_PUBLISHED
          - state_machines.FiscalPeriod
        distinguishing_aspect: |
          Pair (Dashboard, FiscalPeriod): Dashboard.DRAFT -> PUBLISHED is gated
          on FiscalPeriod.status IN {SOFT_CLOSED, HARD_CLOSED}. A dashboard
          created during OPEN cannot publish. Distinct entity pair from the
          Matter/Accrual instance.
        test_recipe:
          setup:
            - "Department; FP still OPEN; dashboard D created for FP in DRAFT"
          setup_api_calls:
            - call: "POST /legal-ops/departments"
              payload: { name: "D" }
              as: LegalOpsManager
            - call: "POST /legal-ops/fiscal-periods"
              payload: { label: "FY2026", start_date: "2026-01-01", end_date: "2026-12-31" }
              as: LegalOpsManager
              captures: { fp_id: $.data.id }
            - call: "POST /legal-ops/dashboards"
              payload: { fiscal_period_id: "${fp_id}", snapshot_label: "snap" }
              as: LegalOpsAnalyst
              captures: { dash_id: $.data.id, dash_v: $.data.version }
          trigger:
            - call: "POST /legal-ops/dashboards/${dash_id}/publish"
              payload: { expected_dashboard_version: "${dash_v}" }
              as: LegalOpsManager
              captures: { err: $.data.error_id }
          assert:
            - "Publish rejected: error_id == ERR_INVALID_STATE"
            - "Dashboard.status remains DRAFT"
            - "Cross-entity dependency: FiscalPeriod must be SOFT_CLOSED or HARD_CLOSED"

  # ==========================================================================
  # Rule 8 — resource_temporal_overlap (≥2 instances, different interval semantics)
  # ==========================================================================
  - rule_id: resource_temporal_overlap
    instances:
      - name: fiscal_period_overlap_half_open_adjacency
        grounds:
          - validations[priority=7]
          - entities.FiscalPeriod.fields.start_date
          - entities.FiscalPeriod.fields.end_date
        distinguishing_aspect: |
          Interval semantics: INCLUSIVE both ends, with adjacency permitted ONLY
          when prior.end_date + 1 day == next.start_date (calendar-day
          half-open). Same-day overlap rejected; day-after-end adjacency
          accepted; same-start-day adjacency rejected.
        test_recipe:
          setup:
            - "Department; existing fiscal period FP1 [2026-01-01, 2026-12-31]"
          setup_api_calls:
            - call: "POST /legal-ops/departments"
              payload: { name: "D" }
              as: LegalOpsManager
            - call: "POST /legal-ops/fiscal-periods"
              payload: { label: "FY2026", start_date: "2026-01-01", end_date: "2026-12-31" }
              as: LegalOpsManager
              captures: { fp1_id: $.data.id }
          trigger:
            - call: "POST /legal-ops/fiscal-periods"
              payload: { label: "FY2027", start_date: "2027-01-01", end_date: "2027-12-31" }
              as: LegalOpsManager
              captures: { fp2_id: $.data.id }
            - call: "POST /legal-ops/fiscal-periods"
              payload: { label: "FY2026-OVERLAP", start_date: "2026-12-31", end_date: "2027-06-30" }
              as: LegalOpsManager
              captures: { err_overlap: $.data.error_id }
            - call: "POST /legal-ops/fiscal-periods"
              payload: { label: "FY2026-INSIDE", start_date: "2026-06-01", end_date: "2026-06-30" }
              as: LegalOpsManager
              captures: { err_inside: $.data.error_id }
          assert:
            - "FY2027 (starts 2027-01-01, exactly one day after FP1.end 2026-12-31) ACCEPTED — half-open adjacency allowed"
            - "FY2026-OVERLAP (starts 2026-12-31, same as FP1.end) REJECTED: err_overlap == ERR_PERIOD_OVERLAP"
            - "FY2026-INSIDE (strictly inside FP1) REJECTED: err_inside == ERR_PERIOD_OVERLAP"

      - name: matter_number_temporal_windowed_uniqueness
        grounds:
          - validations[priority=10]
          - entities.Matter.fields.matter_number
        distinguishing_aspect: |
          Different interval semantics: not a calendar interval but a BUSINESS
          KEY window — matter_number is globally unique regardless of fiscal
          period. Two matters in different fiscal periods with the same
          matter_number still collide; the resource is the matter_number key
          space, and its "interval" is unbounded (global). Distinct resource
          entity (Matter, not FiscalPeriod) and distinct semantics (global
          key uniqueness vs calendar interval).
        test_recipe:
          setup:
            - "Department; FP1 [2026]; FP2 [2027]; PA; MT; firm; counsel"
            - "Matter M1 in FP1 with matter_number 'LGL-2026-00001'"
          setup_api_calls:
            - call: "POST /legal-ops/departments"
              payload: { name: "D" }
              as: LegalOpsManager
            - call: "POST /legal-ops/fiscal-periods"
              payload: { label: "FY2026", start_date: "2026-01-01", end_date: "2026-12-31" }
              as: LegalOpsManager
              captures: { fp1_id: $.data.id }
            - call: "POST /legal-ops/fiscal-periods"
              payload: { label: "FY2027", start_date: "2027-01-01", end_date: "2027-12-31" }
              as: LegalOpsManager
              captures: { fp2_id: $.data.id }
            - call: "POST /legal-ops/practice-areas"
              payload: { code: "LIT", display_name: "L" }
              as: LegalOpsManager
              captures: { pa_id: $.data.id }
            - call: "POST /legal-ops/practice-areas/${pa_id}/matter-types"
              payload: { code: "LIT-C", display_name: "C" }
              as: LegalOpsManager
              captures: { mt_id: $.data.id }
            - call: "POST /legal-ops/firms"
              payload: { name: "F", tier: "TIER_1", blended_hourly_rate_cents: 25000 }
              as: LegalOpsManager
              captures: { firm_id: $.data.id }
            - call: "POST /legal-ops/in-house-counsel"
              payload: { full_name: "C", email: "c@x.com", annual_capacity_hours: 2000, loaded_hourly_cost_cents: 15000 }
              as: LegalOpsManager
              captures: { counsel_id: $.data.id }
            - call: "POST /legal-ops/matters"
              payload: { matter_number: "LGL-2026-00001", title: "M1", practice_area_id: "${pa_id}", matter_type_id: "${mt_id}", fiscal_period_id: "${fp1_id}", lead_counsel_id: "${counsel_id}", primary_firm_id: "${firm_id}" }
              as: LegalOpsAnalyst
              captures: { m1_id: $.data.id }
          trigger:
            - call: "POST /legal-ops/matters"
              payload: { matter_number: "LGL-2026-00001", title: "M2 same number in different period", practice_area_id: "${pa_id}", matter_type_id: "${mt_id}", fiscal_period_id: "${fp2_id}", lead_counsel_id: "${counsel_id}", primary_firm_id: "${firm_id}" }
              as: LegalOpsAnalyst
              captures: { err: $.data.error_id }
          assert:
            - "Second matter with same matter_number in DIFFERENT period REJECTED: err == ERR_DUPLICATE"
            - "Uniqueness is global, not scoped per period — different interval semantics than calendar overlap"

  # ==========================================================================
  # Rule 9 — compensating_invariant (≥2 instances, different conserved quantities)
  # ==========================================================================
  - rule_id: compensating_invariant
    instances:
      - name: accrual_release_conserves_period_total
        grounds:
          - state_machines.Accrual.transitions.OUTSTANDING_to_RELEASED
          - entities.FiscalPeriod.fields.total_accrual_cents
          - entities.Matter.fields.accrual_outstanding_cents
        distinguishing_aspect: |
          Conserved quantity: sum over all Matter.accrual_outstanding_cents
          within a fiscal period MUST equal FiscalPeriod.total_accrual_cents at
          every observable point. Forward action: create accrual (+=).
          Compensating action: release accrual (-=). After forward+compensate,
          both Matter and FiscalPeriod totals MUST return to their pre-action
          values — no drift.
        test_recipe:
          setup:
            - "Department; FP OPEN; PA; MT; firm F; counsel C; Matter M ACTIVE"
            - "Initial: M.accrual_outstanding_cents == 0; FP.total_accrual_cents == 0"
          setup_api_calls:
            - call: "POST /legal-ops/departments"
              payload: { name: "D" }
              as: LegalOpsManager
            - call: "POST /legal-ops/fiscal-periods"
              payload: { label: "FY2026", start_date: "2026-01-01", end_date: "2026-12-31" }
              as: LegalOpsManager
              captures: { fp_id: $.data.id }
            - call: "POST /legal-ops/practice-areas"
              payload: { code: "LIT", display_name: "L" }
              as: LegalOpsManager
              captures: { pa_id: $.data.id }
            - call: "POST /legal-ops/practice-areas/${pa_id}/matter-types"
              payload: { code: "LIT-C", display_name: "C" }
              as: LegalOpsManager
              captures: { mt_id: $.data.id }
            - call: "POST /legal-ops/firms"
              payload: { name: "F", tier: "TIER_1", blended_hourly_rate_cents: 25000 }
              as: LegalOpsManager
              captures: { firm_id: $.data.id }
            - call: "POST /legal-ops/in-house-counsel"
              payload: { full_name: "C", email: "c@x.com", annual_capacity_hours: 2000, loaded_hourly_cost_cents: 15000 }
              as: LegalOpsManager
              captures: { counsel_id: $.data.id }
            - call: "POST /legal-ops/matters"
              payload: { matter_number: "LGL-2026-00001", title: "M", practice_area_id: "${pa_id}", matter_type_id: "${mt_id}", fiscal_period_id: "${fp_id}", lead_counsel_id: "${counsel_id}", primary_firm_id: "${firm_id}" }
              as: LegalOpsAnalyst
              captures: { m_id: $.data.id }
            - call: "POST /legal-ops/matters/${m_id}/assignments"
              payload: { counsel_id: "${counsel_id}", allocated_hours: 5 }
              as: LegalOpsAnalyst
            - call: "POST /legal-ops/matters/${m_id}/activate"
              payload: {}
              as: LegalOpsAnalyst
            - call: "GET /legal-ops/matters/${m_id}"
              as: LegalOpsAnalyst
              captures: { m_pre: $.data.accrual_outstanding_cents }
            - call: "GET /legal-ops/fiscal-periods/${fp_id}"
              as: LegalOpsAnalyst
              captures: { fp_pre: $.data.total_accrual_cents }
            - call: "POST /legal-ops/accruals"
              payload: { matter_id: "${m_id}", fiscal_period_id: "${fp_id}", firm_id: "${firm_id}", amount_cents: 700000 }
              as: LegalOpsAnalyst
              captures: { ac_id: $.data.id }
            - call: "GET /legal-ops/matters/${m_id}"
              as: LegalOpsAnalyst
              captures: { m_mid: $.data.accrual_outstanding_cents }
            - call: "GET /legal-ops/fiscal-periods/${fp_id}"
              as: LegalOpsAnalyst
              captures: { fp_mid: $.data.total_accrual_cents }
          trigger:
            - call: "POST /legal-ops/accruals/${ac_id}/release"
              payload: {}
              as: LegalOpsAnalyst
            - call: "GET /legal-ops/matters/${m_id}"
              as: LegalOpsAnalyst
              captures: { m_post: $.data.accrual_outstanding_cents }
            - call: "GET /legal-ops/fiscal-periods/${fp_id}"
              as: LegalOpsAnalyst
              captures: { fp_post: $.data.total_accrual_cents }
          assert:
            - "pre:  m_pre == 0 AND fp_pre == 0"
            - "mid:  m_mid == 700000 AND fp_mid == 700000 (forward action observed)"
            - "post: m_post == 0 AND fp_post == 0 (compensating action restored invariant — no drift)"

      - name: invoice_pay_conserves_budget_consumed_sum_equality
        grounds:
          - state_machines.Invoice.transitions.APPROVED_to_PAID
          - entities.Budget.fields.consumed_cents
          - entities.FiscalPeriod.fields.total_actual_spend_cents
        distinguishing_aspect: |
          Different conserved quantity: sum of Budget.consumed_cents across all
          budgets in a period MUST equal FiscalPeriod.total_actual_spend_cents
          (assuming budget grain covers the period). Forward: invoice pay
          inserts SpendLine. Compensating: not directly available (no SpendLine
          reversal endpoint), but the invariant holds cumulatively — every pay
          event advances both Budget.consumed_cents AND
          FiscalPeriod.total_actual_spend_cents by the same amount. Tests that
          sequential pay events preserve the sum-equality.
        test_recipe:
          setup:
            - "Department; FP OPEN; PA; MT; firm F; counsel C"
            - "Budget B for (FP, PA, MT) allocated 10000000"
            - "Matter M ACTIVE"
            - "Two invoices INV1 2000000, INV2 3000000 both APPROVED"
          setup_api_calls:
            - call: "POST /legal-ops/departments"
              payload: { name: "D" }
              as: LegalOpsManager
            - call: "POST /legal-ops/fiscal-periods"
              payload: { label: "FY2026", start_date: "2026-01-01", end_date: "2026-12-31" }
              as: LegalOpsManager
              captures: { fp_id: $.data.id }
            - call: "POST /legal-ops/practice-areas"
              payload: { code: "LIT", display_name: "L" }
              as: LegalOpsManager
              captures: { pa_id: $.data.id }
            - call: "POST /legal-ops/practice-areas/${pa_id}/matter-types"
              payload: { code: "LIT-C", display_name: "C" }
              as: LegalOpsManager
              captures: { mt_id: $.data.id }
            - call: "POST /legal-ops/firms"
              payload: { name: "F", tier: "TIER_1", blended_hourly_rate_cents: 25000 }
              as: LegalOpsManager
              captures: { firm_id: $.data.id }
            - call: "POST /legal-ops/in-house-counsel"
              payload: { full_name: "C", email: "c@x.com", annual_capacity_hours: 2000, loaded_hourly_cost_cents: 15000 }
              as: LegalOpsManager
              captures: { counsel_id: $.data.id }
            - call: "POST /legal-ops/budgets"
              payload: { fiscal_period_id: "${fp_id}", practice_area_id: "${pa_id}", matter_type_id: "${mt_id}", allocated_cents: 10000000 }
              as: LegalOpsManager
              captures: { b_id: $.data.id }
            - call: "POST /legal-ops/matters"
              payload: { matter_number: "LGL-2026-00001", title: "M", practice_area_id: "${pa_id}", matter_type_id: "${mt_id}", fiscal_period_id: "${fp_id}", lead_counsel_id: "${counsel_id}", primary_firm_id: "${firm_id}" }
              as: LegalOpsAnalyst
              captures: { m_id: $.data.id }
            - call: "POST /legal-ops/matters/${m_id}/assignments"
              payload: { counsel_id: "${counsel_id}", allocated_hours: 5 }
              as: LegalOpsAnalyst
            - call: "POST /legal-ops/matters/${m_id}/activate"
              payload: {}
              as: LegalOpsAnalyst
            - call: "POST /legal-ops/invoices"
              payload: { matter_id: "${m_id}", firm_id: "${firm_id}", fiscal_period_id: "${fp_id}", invoice_number: "I-1", amount_cents: 2000000 }
              as: LegalOpsAnalyst
              captures: { inv1: $.data.id }
            - call: "POST /legal-ops/invoices/${inv1}/approve"
              payload: {}
              as: LegalOpsAnalyst
            - call: "POST /legal-ops/invoices"
              payload: { matter_id: "${m_id}", firm_id: "${firm_id}", fiscal_period_id: "${fp_id}", invoice_number: "I-2", amount_cents: 3000000 }
              as: LegalOpsAnalyst
              captures: { inv2: $.data.id }
            - call: "POST /legal-ops/invoices/${inv2}/approve"
              payload: {}
              as: LegalOpsAnalyst
          trigger:
            - call: "POST /legal-ops/invoices/${inv1}/pay"
              payload: {}
              as: LegalOpsManager
            - call: "GET /legal-ops/budgets/${b_id}"
              as: LegalOpsAnalyst
              captures: { b_mid: $.data.consumed_cents }
            - call: "GET /legal-ops/fiscal-periods/${fp_id}"
              as: LegalOpsAnalyst
              captures: { fp_mid: $.data.total_actual_spend_cents }
            - call: "POST /legal-ops/invoices/${inv2}/pay"
              payload: {}
              as: LegalOpsManager
            - call: "GET /legal-ops/budgets/${b_id}"
              as: LegalOpsAnalyst
              captures: { b_final: $.data.consumed_cents }
            - call: "GET /legal-ops/fiscal-periods/${fp_id}"
              as: LegalOpsAnalyst
              captures: { fp_final: $.data.total_actual_spend_cents }
          assert:
            - "After INV1 pay: Budget.consumed_cents == 2000000 AND FiscalPeriod.total_actual_spend_cents == 2000000 (sum-equality conserved)"
            - "After INV2 pay: Budget.consumed_cents == 5000000 AND FiscalPeriod.total_actual_spend_cents == 5000000 (invariant holds cumulatively)"
            - "Conserved quantity: sum(Budget.consumed_cents) == FiscalPeriod.total_actual_spend_cents at every observable point"
