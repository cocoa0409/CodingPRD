  # ===========================================================================
  # RULE 3 — Non-linear state-machine shape on different entities
  # ===========================================================================
  - rule_id: non_linear_state_machine
    instances:

      - name: application_decision_and_disclosure_dimensions_evolve_independently
        grounds:
          - state_machines.CreditApplication.NOT_SENT_to_DELIVERED
          - state_machines.CreditApplication.DELIVERED_to_EXPIRED_UNACKNOWLEDGED
          - state_machines.CreditApplication.EXPIRED_UNACKNOWLEDGED_to_DELIVERED
          - state_machines.CreditApplication.DELIVERED_to_ACKNOWLEDGED
          - state_machines.CreditApplication.APPROVED_to_ACTIVATED
          - entities.CreditApplication.fields.disclosure_status
          - entities.CreditApplication.fields.decision
        distinguishing_aspect: |
          Non-linearity on CreditApplication takes the PARALLEL-DIMENSIONS form: the decision
          axis (PENDING -> APPROVED -> ACTIVATED) and the disclosure axis (NOT_SENT ->
          DELIVERED -> EXPIRED_UNACKNOWLEDGED -> DELIVERED -> ACKNOWLEDGED) advance on the same
          row without either constraining the other's position, and the disclosure axis even
          moves backwards and forwards twice while decision stays frozen at APPROVED.
        test_recipe:
          setup:
            - "Program with PromotionPlan DI12-ROOF (disclosure_template_version DI-2026.2, promo_term_months 12)."
            - "Merchant APPROVED with an ACTIVE enrollment window 2026-08-01..2026-12-31."
            - "Consumer Dana Ruiz (FICO 742, income 9600000) exists with zero existing debt."
            - "A PENDING credit application is created at clock 2026-08-01T00:00:00Z for 3500000 cents."
