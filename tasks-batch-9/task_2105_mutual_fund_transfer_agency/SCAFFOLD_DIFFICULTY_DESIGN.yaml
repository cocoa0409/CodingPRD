            - call: "POST /nav-records/${nav2}/finalize"
              payload: {}
              as: FundAccountant
            - call: "POST /shareholder-accounts/${acc_r}/restrict"
              payload: { restriction_reason: "Pending anti-money-laundering review" }
              as: ComplianceOfficer
          trigger:
