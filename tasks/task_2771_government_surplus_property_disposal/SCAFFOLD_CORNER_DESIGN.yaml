              as_user_id: "00000000-0000-4000-8000-000000000000"
              captures: { e_unauth_first: "$.data.error_id" }
            - call: "POST /agencies"
              payload: { name: "Rogue Registry Entry", agency_code: "ROGUE-01", agency_type: "STATE_AGENCY" }
              as: DisposalOfficer
              as_user_id: "officer-01"
              captures: { e_unauthorized: "$.data.error_id" }
          assert:
            - "the call with no X-User-Role header returns 401 with data.error_id == \"ERR_UNAUTHENTICATED\""
            - "the call with an unrecognised role name returns 401 with the same code — an unknown role is not authorization but authentication"
            - "the AgencyOfficer call whose X-User-ID resolves to no Agency row returns 401 with the same code, even though AgencyOfficer is not listed on GET /turn-ins — priority 1 precedes priority 3"
            - "the Bidder call with an unresolvable id returns 401, not 403 — the identity is checked before the role is matched against the endpoint"
            - "the DisposalOfficer call on the ProgramAdmin-exclusive create returns 403 with data.error_id == \"ERR_UNAUTHORIZED\""
            - "every error response carries meta.api_request_id, meta.api_request_timestamp, response_type == \"error\" and a data object holding exactly error_id and message"
            - "GET /agencies as ProgramAdmin still returns total_count 1 — no rogue row was written"

  - section: rbac
    instances:

      - name: rbac_condition_assessment_exclusive_others_cannot_file
        claim_type: exclusive_operation
        grounds:
          - roles.SurplusAssessor.exclusive_operations
          - endpoints[POST /assets/{id}/condition-assessments]
        distinguishing_aspect: "Appraisal is the SurplusAssessor's only write, and it is refused to the four roles that plausibly want it — the administrator who owns the registry, the officer who runs disposal, the technician who touches the same asset, and the officer of the agency that owns the asset — with the identical payload succeeding for the assessor. The refusals also leave the OCC version unconsumed, so the assessor's call reuses the same expected_asset_version."
        test_recipe:
          setup:
            - "logical clock at 2026-08-01T00:00:00Z"
            - "one SUBMITTED turn-in for DOT-01 holding one FURNITURE asset at version 1"
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { current_utc: "2026-08-01T00:00:00Z" }
              as: ProgramAdmin
              as_user_id: "admin-01"
            - call: "POST /agencies"
              payload: { name: "State Department of Transportation", agency_code: "DOT-01", agency_type: "STATE_AGENCY" }
              as: ProgramAdmin
              as_user_id: "admin-01"
              captures: { ag: "$.data.id" }
            - call: "POST /turn-ins"
              payload: { turning_in_agency_id: "${ag}", custody_location: "Austin Yard 4" }
              as: AgencyOfficer
              as_user_id: "${ag}"
              captures: { ti: "$.data.id" }
            - call: "POST /assets"
              payload: { turn_in_id: "${ti}", category: "FURNITURE", description: "Modular workstation cluster", acquisition_cost_cents: 1000000, acquisition_date: "2026-01-10" }
              as: AgencyOfficer
              as_user_id: "${ag}"
              captures: { a1: "$.data.id", a1_v: "$.data.version" }
            - call: "POST /turn-ins/${ti}/submit"
              payload: {}
              as: AgencyOfficer
              as_user_id: "${ag}"
          trigger:
            - call: "POST /assets/${a1}/condition-assessments"
              payload: { condition_code: "C1", functional: true, repair_cost_estimate_cents: 0, assessed_on: "2026-07-31", expected_asset_version: "${a1_v}" }
              as: ProgramAdmin
              as_user_id: "admin-01"
              captures: { e_admin: "$.data.error_id" }
            - call: "POST /assets/${a1}/condition-assessments"
              payload: { condition_code: "C1", functional: true, repair_cost_estimate_cents: 0, assessed_on: "2026-07-31", expected_asset_version: "${a1_v}" }
              as: DisposalOfficer
              as_user_id: "officer-01"
              captures: { e_officer: "$.data.error_id" }
            - call: "POST /assets/${a1}/condition-assessments"
              payload: { condition_code: "C1", functional: true, repair_cost_estimate_cents: 0, assessed_on: "2026-07-31", expected_asset_version: "${a1_v}" }
              as: ClearanceTechnician
              as_user_id: "tech-01"
              captures: { e_tech: "$.data.error_id" }
            - call: "POST /assets/${a1}/condition-assessments"
              payload: { condition_code: "C1", functional: true, repair_cost_estimate_cents: 0, assessed_on: "2026-07-31", expected_asset_version: "${a1_v}" }
              as: AgencyOfficer
              as_user_id: "${ag}"
              captures: { e_agency: "$.data.error_id" }
            - call: "POST /assets/${a1}/condition-assessments"
              payload: { condition_code: "C1", functional: true, repair_cost_estimate_cents: 0, assessed_on: "2026-07-31", expected_asset_version: "${a1_v}" }
              as: SurplusAssessor
              as_user_id: "assessor-01"
              captures: { as1: "$.data.id" }
          assert:
            - "all four non-assessor attempts return 403 with data.error_id == \"ERR_UNAUTHORIZED\""
            - "SurplusAsset.${a1}.version is still 1 and condition_code is still null after the four refusals"
            - "the SurplusAssessor call returns 201 with ConditionAssessment.${as1}.assessor_user_id == assessor-01 and superseded == false"
            - "SurplusAsset.${a1}.condition_code == C1, fair_market_value_cents == 1000000, disposition_status == ASSESSED and version == 2"
            - "GET /assets/${a1}/condition-assessments returns total_count 1"

      - name: rbac_assessor_cannot_certify_the_asset_it_appraised
        claim_type: segregation_of_duties
        grounds:
          - roles.ClearanceTechnician.exclusive_operations
          - validations[priority=22]
          - entities.ClearanceCertificate.fields.technician_user_id
        distinguishing_aspect: "Two different mechanisms guard the same endpoint and they answer with different codes: a caller in the wrong role is 403, while a caller in the right role whose user id already appears as an assessor_user_id on that asset is 409 ERR_SEGREGATION_OF_DUTIES. The identity check is per asset, so the same technician id may certify a different asset in the same turn-in."
        test_recipe:
          setup:
            - "logical clock at 2026-08-01T00:00:00Z"
            - "one SUBMITTED turn-in for DOT-01 holding two data-bearing IT_EQUIPMENT assets, both clearance REQUIRED_PENDING"
            - "asset A was appraised by assessor-01; asset B was appraised by assessor-02"
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { current_utc: "2026-08-01T00:00:00Z" }
              as: ProgramAdmin
              as_user_id: "admin-01"
            - call: "POST /agencies"
              payload: { name: "State Department of Transportation", agency_code: "DOT-01", agency_type: "STATE_AGENCY" }
              as: ProgramAdmin
              as_user_id: "admin-01"
              captures: { ag: "$.data.id" }
            - call: "POST /turn-ins"
              payload: { turning_in_agency_id: "${ag}", custody_location: "Austin Data Center Annex" }
              as: AgencyOfficer
              as_user_id: "${ag}"
              captures: { ti: "$.data.id" }
            - call: "POST /assets"
              payload: { turn_in_id: "${ti}", category: "IT_EQUIPMENT", description: "Laptop cart A", acquisition_cost_cents: 300000, acquisition_date: "2024-05-20", is_data_bearing: true }
              as: AgencyOfficer
              as_user_id: "${ag}"
              captures: { a1: "$.data.id", a1_v: "$.data.version" }
            - call: "POST /assets"
              payload: { turn_in_id: "${ti}", category: "IT_EQUIPMENT", description: "Laptop cart B", acquisition_cost_cents: 300000, acquisition_date: "2024-05-20", is_data_bearing: true }
              as: AgencyOfficer
              as_user_id: "${ag}"
              captures: { a2: "$.data.id", a2_v: "$.data.version" }
            - call: "POST /turn-ins/${ti}/submit"
              payload: {}
              as: AgencyOfficer
              as_user_id: "${ag}"
            - call: "POST /assets/${a1}/condition-assessments"
              payload: { condition_code: "C3", functional: true, repair_cost_estimate_cents: 0, assessed_on: "2026-07-31", expected_asset_version: "${a1_v}" }
              as: SurplusAssessor
              as_user_id: "assessor-01"
            - call: "POST /assets/${a2}/condition-assessments"
              payload: { condition_code: "C3", functional: true, repair_cost_estimate_cents: 0, assessed_on: "2026-07-31", expected_asset_version: "${a2_v}" }
              as: SurplusAssessor
              as_user_id: "assessor-02"
          trigger:
            - call: "POST /assets/${a1}/clearance-certificates"
              payload: { cert_type: "DATA_SANITIZATION", method: "NIST_PURGE", serials_verified: true, certified_on: "2026-08-01" }
              as: SurplusAssessor
              as_user_id: "assessor-01"
              captures: { e_role: "$.data.error_id" }
            - call: "POST /assets/${a1}/clearance-certificates"
              payload: { cert_type: "DATA_SANITIZATION", method: "NIST_PURGE", serials_verified: true, certified_on: "2026-08-01" }
              as: DisposalOfficer
              as_user_id: "officer-01"
              captures: { e_officer: "$.data.error_id" }
            - call: "POST /assets/${a1}/clearance-certificates"
              payload: { cert_type: "DATA_SANITIZATION", method: "NIST_PURGE", serials_verified: true, certified_on: "2026-08-01" }
              as: ClearanceTechnician
              as_user_id: "assessor-01"
              captures: { e_sod: "$.data.error_id" }
            - call: "POST /assets/${a2}/clearance-certificates"
              payload: { cert_type: "DATA_SANITIZATION", method: "NIST_PURGE", serials_verified: true, certified_on: "2026-08-01" }
              as: ClearanceTechnician
              as_user_id: "assessor-01"
              captures: { c_b: "$.data.id" }
            - call: "POST /assets/${a1}/clearance-certificates"
              payload: { cert_type: "DATA_SANITIZATION", method: "NIST_PURGE", serials_verified: true, certified_on: "2026-08-01" }
              as: ClearanceTechnician
              as_user_id: "tech-01"
              captures: { c_a: "$.data.id" }
          assert:
            - "the SurplusAssessor and DisposalOfficer attempts return 403 with data.error_id == \"ERR_UNAUTHORIZED\" — neither role is listed on the endpoint"
            - "the ClearanceTechnician attempt using the id assessor-01 returns 409 with data.error_id == \"ERR_SEGREGATION_OF_DUTIES\" — that id appraised asset ${a1}"
            - "the same id certifying asset ${a2} returns 201 — the conflict is per asset, and ${a2} was appraised by assessor-02"
            - "the tech-01 certificate on ${a1} returns 201 with ClearanceCertificate.${c_a}.technician_user_id == tech-01"
            - "SurplusAsset.${a1}.clearance_status == CLEARED and SurplusAsset.${a2}.clearance_status == CLEARED"
            - "GET /assets/${a1}/clearance-certificates returns total_count 1 holding ${c_a}, and GET /assets/${a2}/clearance-certificates returns total_count 1 holding ${c_b}"

      - name: rbac_disposal_officer_actions_forbidden_to_other_roles
        claim_type: exclusive_operation
        grounds:
          - roles.DisposalOfficer.exclusive_operations
        distinguishing_aspect: "The DisposalOfficer owns eleven writes spanning review, screening, transfer, listing and release; four of them are attempted by the roles most likely to be wired in by mistake — the administrator for review and screening, the finance controller for listing, the agency officer for release — and each is 403 before any state or business check runs, so the turn-in is still SUBMITTED when the officer's own review succeeds."
        test_recipe:
          setup:
            - "logical clock at 2026-08-01T00:00:00Z"
            - "one SUBMITTED turn-in for DOT-01 whose single de-minimis FURNITURE asset has been appraised C6, giving fair_market_value_cents 12540"
            - "one ACTIVE venue AUS-01"
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { current_utc: "2026-08-01T00:00:00Z" }
              as: ProgramAdmin
              as_user_id: "admin-01"
            - call: "POST /agencies"
              payload: { name: "State Department of Transportation", agency_code: "DOT-01", agency_type: "STATE_AGENCY" }
              as: ProgramAdmin
              as_user_id: "admin-01"
              captures: { ag: "$.data.id" }
            - call: "POST /turn-ins"
              payload: { turning_in_agency_id: "${ag}", custody_location: "Austin Yard 4" }
              as: AgencyOfficer
              as_user_id: "${ag}"
              captures: { ti: "$.data.id" }
            - call: "POST /assets"
              payload: { turn_in_id: "${ti}", category: "FURNITURE", description: "Lateral file cabinets, single pallet", acquisition_cost_cents: 104500, acquisition_date: "2024-05-20" }
              as: AgencyOfficer
              as_user_id: "${ag}"
              captures: { a1: "$.data.id", a1_v: "$.data.version" }
            - call: "POST /turn-ins/${ti}/submit"
              payload: {}
              as: AgencyOfficer
              as_user_id: "${ag}"
            - call: "POST /assets/${a1}/condition-assessments"
              payload: { condition_code: "C6", functional: true, repair_cost_estimate_cents: 0, assessed_on: "2026-07-31", expected_asset_version: "${a1_v}" }
              as: SurplusAssessor
              as_user_id: "assessor-01"
            - call: "POST /venues"
              payload: { name: "Austin Auction Yard", venue_code: "AUS-01", concurrent_lot_capacity: 2, buyer_premium_pct: 0.105, sales_tax_pct: 0.0635 }
              as: ProgramAdmin
              as_user_id: "admin-01"
              captures: { v1: "$.data.id" }
          trigger:
            - call: "POST /turn-ins/${ti}/review"
              payload: { decision: "ACCEPT" }
              as: ProgramAdmin
              as_user_id: "admin-01"
              captures: { e_review: "$.data.error_id" }
            - call: "POST /screening-cycles"
              payload: { asset_id: "${a1}", opens_at: "2026-08-02T00:00:00Z", tier_window_days: 3 }
              as: ProgramAdmin
              as_user_id: "admin-01"
              captures: { e_cycle: "$.data.error_id" }
            - call: "POST /auction-lots"
              payload: { asset_id: "${a1}", venue_id: "${v1}", opens_at: "2026-08-02T00:00:00Z", closes_at: "2026-08-03T00:00:00Z" }
              as: FinanceController
              as_user_id: "finance-01"
              captures: { e_lot: "$.data.error_id" }
            - call: "POST /assets/${a1}/release"
              payload: {}
              as: AgencyOfficer
              as_user_id: "${ag}"
              captures: { e_release: "$.data.error_id" }
            - call: "POST /turn-ins/${ti}/review"
              payload: { decision: "ACCEPT" }
              as: DisposalOfficer
              as_user_id: "officer-01"
          assert:
            - "all four attempts return 403 with data.error_id == \"ERR_UNAUTHORIZED\""
            - "the ProgramAdmin cycle attempt is 403 rather than 409 — the role check precedes the de-minimis disposability check that would otherwise refuse this asset"
            - "the AgencyOfficer release attempt is 403 rather than 409 — the role check precedes the state machine, which would refuse an ASSESSED asset"
            - "TurnIn.${ti}.status is still SUBMITTED and reviewed_at is still null after the four refusals"
            - "the DisposalOfficer review returns 200 with TurnIn.${ti}.status == ACCEPTED and reviewed_at == 2026-08-01T00:00:00.000Z"
            - "GET /screening-cycles returns total_count 0 and GET /auction-lots returns total_count 0"

      - name: rbac_money_actions_forbidden_before_row_lookup
        claim_type: exclusive_operation
        grounds:
          - roles.FinanceController.exclusive_operations
          - validations[priority=3]
          - validations[priority=12]
        distinguishing_aspect: "Distribution creation, posting and reversal belong to the FinanceController alone, and the role check runs before the row is resolved: addressing a nonce distribution id from the wrong role answers 403 ERR_UNAUTHORIZED rather than 404, which is the opposite order from the same call made by the right role. The happy path for these endpoints is asserted by val_distribution_basis_availability_and_single_posted_row."
        test_recipe:
          setup:
            - "logical clock at 2026-08-01T00:00:00Z"
            - "one ACTIVE agency DOT-01, used only to capture an arbitrary version value the refused call will carry; no distributions exist"
            - "the nonce id 00000000-0000-4000-8000-000000000000 matches no ProceedsDistribution or AuctionLot row"
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { current_utc: "2026-08-01T00:00:00Z" }
              as: ProgramAdmin
              as_user_id: "admin-01"
            - call: "POST /agencies"
              payload: { name: "State Department of Transportation", agency_code: "DOT-01", agency_type: "STATE_AGENCY" }
              as: ProgramAdmin
              as_user_id: "admin-01"
              captures: { any_v: "$.data.version" }
          trigger:
            - call: "POST /proceeds-distributions"
              payload: { auction_lot_id: "00000000-0000-4000-8000-000000000000", basis: "ACCRUAL", expected_auction_lot_version: "${any_v}" }
              as: DisposalOfficer
              as_user_id: "officer-01"
              captures: { e_create: "$.data.error_id" }
            - call: "POST /proceeds-distributions/00000000-0000-4000-8000-000000000000/post"
              payload: {}
              as: ProgramAdmin
              as_user_id: "admin-01"
              captures: { e_post: "$.data.error_id" }
            - call: "POST /proceeds-distributions/00000000-0000-4000-8000-000000000000/reverse"
              payload: { reversal_reason: "Attempted by the wrong role" }
              as: DisposalOfficer
              as_user_id: "officer-01"
              captures: { e_reverse: "$.data.error_id" }
            - call: "POST /proceeds-distributions/00000000-0000-4000-8000-000000000000/post"
              payload: {}
              as: FinanceController
              as_user_id: "finance-01"
              captures: { e_finance_404: "$.data.error_id" }
          assert:
            - "the DisposalOfficer create returns 403 with data.error_id == \"ERR_UNAUTHORIZED\" — it never reaches the unknown lot or the OCC comparison"
            - "the ProgramAdmin post and the DisposalOfficer reverse both return 403 with the same code"
            - "the FinanceController post against the same nonce id returns 404 with data.error_id == \"ERR_DISTRIBUTION_NOT_FOUND\" — proving the 403s above were role refusals and not disguised lookups"
            - "GET /proceeds-distributions as FinanceController returns total_count 0"

