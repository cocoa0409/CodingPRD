            - "$.data.error_id == 'ERR_PACKAGE_EXPIRED', NOT ERR_NO_SESSION_CREDIT, because the athlete does own a package and it is rejected purely on date grounds (effective_expires_on 2026-08-31 < the 2026-09-15 session date)"
