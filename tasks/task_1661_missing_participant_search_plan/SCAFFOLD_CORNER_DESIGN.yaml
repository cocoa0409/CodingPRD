            - { call: "POST /participants", payload: { termination_case_id: "${c_mw}", full_name: "Dee Other", ssn: "121110011", mailing_address: "2 D St", account_balance_cents: 300000, vested_pct: 100 }, as: PlanAdministrator, captures: { p_mw2: "$.data.id" } }
            - { call: "POST /notices", payload: { termination_case_id: "${c_mw}", notice_type: NOIT, action_effective_date: "2026-10-15T00:00:00Z", expected_termination_case_version: "${c_mw_v}" }, as: PlanAdministrator }
