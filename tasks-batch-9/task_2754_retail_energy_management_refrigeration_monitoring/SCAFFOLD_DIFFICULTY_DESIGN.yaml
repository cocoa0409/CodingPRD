            - "the first trigger returns HTTP 403, not 409"
            - "${state_error} == ERR_BILL_STATE_INVALID"
            - "the second trigger returns HTTP 409"
            - "${sod_error_again} == ERR_SEGREGATION_OF_DUTIES"
            - "the fourth trigger still returns HTTP 403 even though rule 62 is now satisfied"
            - "${final_state} == ADJUSTED"
            - "${adjuster} == u_manager_2"
            - "UtilityBill.${bill_id}.adjusted_amount_usd == 99996.04"

  - rule_id: boundary_precision_check
    instances:
      - name: reading_exactly_at_alarm_high_breaches
        grounds:
          - calculations.excursion_exposure
          - entities.RefrigerationCase.fields.alarm_high_f
          - entities.RefrigerationCase.fields.consecutive_breach_count
          - state_machines.RefrigerationCase.transitions.case_alarm_on_breach_run
        distinguishing_aspect: |
          Temperature boundary on POST /energy-ops/refrigeration-cases/{id}/readings:
          temp_f >= alarm_high_f is INCLUSIVE, so 41.0 against alarm_high_f 41.0
          breaches while 40.9 does not, and a single non-breaching reading resets
          consecutive_breach_count to 0 so the GRACE_READINGS run must restart. The
          excursion therefore opens on the SECOND reading of the second run, with
          first_breach_iso pinned to that run's first breach, not to the earliest
          breach ever seen.
        test_recipe:
          setup:
            - "one MARINE / SUPERCENTER store with BMS ACTIVE, clock 2026-08-01T12:00:00Z"
            - "one MEDIUM_TEMP PRODUCE case with alarm_high_f 41.0 and alarm_low_f 28.0"
          setup_api_calls:
            - call: "POST /energy-ops/_clock/set_current_utc"
              payload: { current_utc: "2026-08-01T12:00:00Z" }
              as: PlatformAdmin
            - call: "POST /energy-ops/stores"
              payload: { code: "STR-BP1", climate_zone: "MARINE", store_format: "SUPERCENTER", floor_area_sqft: 105000 }
              as: PlatformAdmin
              captures: { store_id: "$.data.id", store_v1: "$.data.version" }
            - call: "POST /energy-ops/setpoint-standards"
              payload: { climate_zone: "MARINE", store_format: "SUPERCENTER", season: "SUMMER", cooling_setpoint_f: 74.0, heating_setpoint_f: 68.0, deadband_f: 2.0, lighting_lux_target: 750 }
              as: EnergyManager
              captures: { std_id: "$.data.id" }
            - call: "POST /energy-ops/setpoint-standards/${std_id}/publish"
              payload: {}
              as: EnergyManager
            - call: "POST /energy-ops/stores/${store_id}/bms-commissioning"
              payload: { standard_id: "${std_id}", expected_store_version: "${store_v1}" }
              as: EnergyManager
            - call: "POST /energy-ops/stores/${store_id}/bms-activation"
              payload: {}
              as: EnergyManager
            - call: "POST /energy-ops/stores/${store_id}/refrigeration-cases"
              payload: { case_code: "CASE-BP1-01", case_type: "MEDIUM_TEMP", product_class: "PRODUCE", alarm_high_f: 41.0, alarm_low_f: 28.0, product_value_usd: 4800.00 }
              as: EnergyManager
              captures: { case_id: "$.data.id", initial_state: "$.data.monitoring_state", initial_count: "$.data.consecutive_breach_count" }
          trigger:
            - call: "POST /energy-ops/refrigeration-cases/${case_id}/readings"
              payload: { temp_f: 40.9, reading_iso: "2026-08-01T04:00:00Z" }
              as: BmsGateway
              as_user_id: "${store_id}"
              captures: { c1: "$.data.consecutive_breach_count", s1: "$.data.monitoring_state", e1: "$.data.excursion_id" }
            - call: "POST /energy-ops/refrigeration-cases/${case_id}/readings"
              payload: { temp_f: 41.0, reading_iso: "2026-08-01T04:15:00Z" }
              as: BmsGateway
              as_user_id: "${store_id}"
              captures: { c2: "$.data.consecutive_breach_count", s2: "$.data.monitoring_state", e2: "$.data.excursion_id" }
            - call: "POST /energy-ops/refrigeration-cases/${case_id}/readings"
              payload: { temp_f: 40.9, reading_iso: "2026-08-01T04:30:00Z" }
              as: BmsGateway
              as_user_id: "${store_id}"
              captures: { c3: "$.data.consecutive_breach_count", s3: "$.data.monitoring_state" }
            - call: "POST /energy-ops/refrigeration-cases/${case_id}/readings"
              payload: { temp_f: 41.0, reading_iso: "2026-08-01T04:45:00Z" }
              as: BmsGateway
              as_user_id: "${store_id}"
              captures: { c4: "$.data.consecutive_breach_count", s4: "$.data.monitoring_state" }
            - call: "POST /energy-ops/refrigeration-cases/${case_id}/readings"
              payload: { temp_f: 41.0, reading_iso: "2026-08-01T05:00:00Z" }
              as: BmsGateway
              as_user_id: "${store_id}"
              captures: { c5: "$.data.consecutive_breach_count", s5: "$.data.monitoring_state", exc_id: "$.data.excursion_id", exposure5: "$.data.exposure_minutes", peak5: "$.data.peak_temp_f", posture5: "$.data.store_energy_posture" }
          assert:
            - "${initial_state} == ARMED"
            - "${initial_count} == 0"
            - "${c1} == 0"
            - "${s1} == ARMED"
            - "${e1} == null"
            - "${c2} == 1"
            - "${s2} == ARMED"
            - "${e2} == null"
            - "${c3} == 0"
            - "${s3} == ARMED"
            - "${c4} == 1"
            - "${s4} == ARMED"
            - "${c5} == 2"
            - "${s5} == ALARM"
            - "${exposure5} == 15"
            - "${peak5} == 41.0"
            - "${posture5} == CONSTRAINED"
            - "TempExcursion.${exc_id}.first_breach_iso == 2026-08-01T04:45:00Z"
            - "TempExcursion.${exc_id}.last_breach_iso == 2026-08-01T05:00:00Z"
            - "TempExcursion.${exc_id}.state == OPEN"
            - "TempExcursion.${exc_id}.product_value_usd == 4800.00"
            - "RefrigerationCase.${case_id}.last_reading_temp_f == 41.0"
            - "GET /energy-ops/refrigeration-cases/${case_id}/excursions returns exactly 1 row"

      - name: override_budget_exactly_at_allowance_admitted
        grounds:
          - validations[priority=120]
          - calculations.lighting_override_projection
          - entities.Store.fields.override_budget_kwh_month
          - entities.Store.fields.override_kwh_used_month
          - state_machines.LightingOverride.transitions.override_revoke_user
        distinguishing_aspect: |
          A monthly kWh allowance boundary on a different endpoint
          (POST /energy-ops/stores/{id}/lighting-overrides): the cumulative charge
          landing EXACTLY on override_budget_kwh_month (300.00 + 200.00 == 500.00)
          is admitted, the very next 80.00 kWh request is refused at 580.00, and a
          user revocation releases exactly 200.00 so the same refused request then
          succeeds - the running total must be recomputed from surviving rows, not
          kept as a monotone counter.
        test_recipe:
          setup:
            - "one HOT_DRY / NEIGHBORHOOD store with BMS ACTIVE and override_budget_kwh_month 500.0"
            - "clock 2026-08-01T00:00:00Z; every override starts inside August 2026"
            - "three distinct zones so validations[priority=101] never fires"
          setup_api_calls:
            - call: "POST /energy-ops/_clock/set_current_utc"
              payload: { current_utc: "2026-08-01T00:00:00Z" }
              as: PlatformAdmin
            - call: "POST /energy-ops/stores"
              payload: { code: "STR-BP2", climate_zone: "HOT_DRY", store_format: "NEIGHBORHOOD", floor_area_sqft: 38000, override_budget_kwh_month: 500.0 }
              as: PlatformAdmin
              captures: { store_id: "$.data.id", store_v1: "$.data.version", used_initial: "$.data.override_kwh_used_month" }
            - call: "POST /energy-ops/setpoint-standards"
              payload: { climate_zone: "HOT_DRY", store_format: "NEIGHBORHOOD", season: "SUMMER", cooling_setpoint_f: 76.0, heating_setpoint_f: 70.0, deadband_f: 2.0, lighting_lux_target: 650 }
              as: EnergyManager
              captures: { std_id: "$.data.id" }
            - call: "POST /energy-ops/setpoint-standards/${std_id}/publish"
              payload: {}
              as: EnergyManager
            - call: "POST /energy-ops/stores/${store_id}/bms-commissioning"
              payload: { standard_id: "${std_id}", expected_store_version: "${store_v1}" }
              as: EnergyManager
            - call: "POST /energy-ops/stores/${store_id}/bms-activation"
              payload: {}
              as: EnergyManager
          trigger:
            - call: "POST /energy-ops/stores/${store_id}/lighting-overrides"
              payload: { zone: "SALES_FLOOR", override_type: "SCHEDULE_EXTEND", start_iso: "2026-08-12T00:00:00Z", end_iso: "2026-08-12T08:00:00Z", zone_load_kw: 37.5, requested_reason: "remodel night work" }
              as: StoreManager
              as_user_id: "${store_id}"
              captures: { ovr_a_id: "$.data.id", kwh_a: "$.data.projected_kwh" }
            - call: "POST /energy-ops/stores/${store_id}/lighting-overrides"
              payload: { zone: "PARKING", override_type: "SCHEDULE_EXTEND", start_iso: "2026-08-12T00:00:00Z", end_iso: "2026-08-12T08:00:00Z", zone_load_kw: 25.0, requested_reason: "lot restriping" }
              as: StoreManager
              as_user_id: "${store_id}"
              captures: { ovr_b_id: "$.data.id", kwh_b: "$.data.projected_kwh" }
            - call: "POST /energy-ops/stores/${store_id}/lighting-overrides"
              payload: { zone: "BACKROOM", override_type: "OCCUPANCY_DISABLE", start_iso: "2026-08-12T00:00:00Z", end_iso: "2026-08-12T02:00:00Z", zone_load_kw: 40.0, requested_reason: "receiving surge" }
              as: StoreManager
              as_user_id: "${store_id}"
              captures: { budget_error: "$.data.error_id" }
            - call: "POST /energy-ops/lighting-overrides/${ovr_b_id}/revoke"
              payload: {}
              as: EnergyManager
              as_user_id: "u_manager_bp2"
              captures: { revoked_state: "$.data.state", revoke_src: "$.data.revoke_source" }
            - call: "POST /energy-ops/stores/${store_id}/lighting-overrides"
              payload: { zone: "BACKROOM", override_type: "OCCUPANCY_DISABLE", start_iso: "2026-08-12T00:00:00Z", end_iso: "2026-08-12T02:00:00Z", zone_load_kw: 40.0, requested_reason: "receiving surge" }
              as: StoreManager
              as_user_id: "${store_id}"
              captures: { ovr_c_id: "$.data.id", kwh_c: "$.data.projected_kwh" }
          assert:
            - "${used_initial} == 0.0"
            - "${kwh_a} == 300.00"
            - "Store.${store_id}.override_kwh_used_month == 300.00 after the first override"
            - "${kwh_b} == 200.00"
            - "Store.${store_id}.override_kwh_used_month == 500.00 after the second override (exact equality admitted)"
            - "${budget_error} == ERR_OVERRIDE_BUDGET_EXCEEDED"
            - "the third trigger returns HTTP 422 because 500.00 + 80.00 == 580.00 > 500.0"
            - "${revoked_state} == REVOKED"
            - "${revoke_src} == USER"
            - "LightingOverride.${ovr_b_id}.revoked_by_user_id == u_manager_bp2"
            - "Store.${store_id}.override_kwh_used_month == 300.00 after the revocation"
            - "${kwh_c} == 80.00"
            - "Store.${store_id}.override_kwh_used_month == 380.00 after the retry"
            - "GET /energy-ops/stores/${store_id}/lighting-overrides returns 3 rows, one of them REVOKED"

      - name: baseline_empty_candidate_set_rejects_notify
        grounds:
          - calculations.dr_baseline_kw
          - validations[priority=104]
          - errors.ERR_BASELINE_DATA_INSUFFICIENT
          - state_machines.DemandResponseEvent.transitions.dr_notify
        distinguishing_aspect: |
          The cardinality boundary of a filtered input set on yet another endpoint
          (POST /energy-ops/demand-response-events/{id}/notify): with zero eligible
          intervals - every interval is off-peak, on a DR event day, or at/after
          curtailment_start_iso - notify must fail with
          ERR_BASELINE_DATA_INSUFFICIENT and leave event_state SCHEDULED; adding
          exactly ONE eligible interval makes baseline_kw the average of a one-row
          top-N set, 1290.5, not zero and not the average of all five rows.
        test_recipe:
          setup:
            - "one MIXED / EXPRESS store with BMS ACTIVE and one TOU_DEMAND account"
            - "three deliberately ineligible intervals: an off-peak 1600.0, an on-peak DR-event-day 1500.0, and an on-peak 1400.0 that starts AFTER curtailment_start_iso"
            - "one event for 2026-08-05T14:00Z-15:00Z with target_reduction_kw 100.0, still SCHEDULED"
          setup_api_calls:
            - call: "POST /energy-ops/_clock/set_current_utc"
              payload: { current_utc: "2026-08-01T00:00:00Z" }
              as: PlatformAdmin
            - call: "POST /energy-ops/stores"
              payload: { code: "STR-BP3", climate_zone: "MIXED", store_format: "EXPRESS", floor_area_sqft: 15000 }
              as: PlatformAdmin
              captures: { store_id: "$.data.id", store_v1: "$.data.version" }
            - call: "POST /energy-ops/setpoint-standards"
              payload: { climate_zone: "MIXED", store_format: "EXPRESS", season: "SUMMER", cooling_setpoint_f: 75.0, heating_setpoint_f: 69.0, deadband_f: 2.0, lighting_lux_target: 600 }
              as: EnergyManager
              captures: { std_id: "$.data.id" }
            - call: "POST /energy-ops/setpoint-standards/${std_id}/publish"
              payload: {}
              as: EnergyManager
            - call: "POST /energy-ops/stores/${store_id}/bms-commissioning"
              payload: { standard_id: "${std_id}", expected_store_version: "${store_v1}" }
              as: EnergyManager
            - call: "POST /energy-ops/stores/${store_id}/bms-activation"
              payload: {}
              as: EnergyManager
            - call: "POST /energy-ops/stores/${store_id}/utility-accounts"
              payload: { utility_name: "Midland Power", rate_schedule_code: "TOU-GS1", rate_family: "TOU_DEMAND", demand_charge_per_kw: 12.00, rate_on_peak: 0.1400, rate_off_peak: 0.0790 }
              as: EnergyManager
              captures: { acct_id: "$.data.id" }
            - call: "POST /energy-ops/utility-accounts/${acct_id}/demand-intervals"
              payload: { intervals: [ { interval_start_iso: "2026-08-04T02:00:00Z", kw_demand: 1600.0, is_on_peak: false }, { interval_start_iso: "2026-08-03T14:00:00Z", kw_demand: 1500.0, is_on_peak: true, is_dr_event_day: true }, { interval_start_iso: "2026-08-05T16:00:00Z", kw_demand: 1400.0, is_on_peak: true } ] }
              as: EnergyAnalyst
            - call: "POST /energy-ops/utility-accounts/${acct_id}/demand-response-events"
              payload: { program_code: "CPP-2026", curtailment_start_iso: "2026-08-05T14:00:00Z", curtailment_end_iso: "2026-08-05T15:00:00Z", target_reduction_kw: 100.0 }
              as: EnergyManager
              captures: { event_id: "$.data.id", created_state: "$.data.event_state", created_baseline: "$.data.baseline_kw" }
          trigger:
            - call: "POST /energy-ops/demand-response-events/${event_id}/notify"
              payload: {}
              as: EnergyManager
              captures: { baseline_error: "$.data.error_id" }
            - call: "POST /energy-ops/utility-accounts/${acct_id}/demand-intervals"
              payload: { intervals: [ { interval_start_iso: "2026-08-04T14:00:00Z", kw_demand: 1290.5, is_on_peak: true } ] }
              as: EnergyAnalyst
            - call: "POST /energy-ops/demand-response-events/${event_id}/notify"
              payload: {}
              as: EnergyManager
              captures: { notified_state: "$.data.event_state", baseline: "$.data.baseline_kw", notified_at: "$.data.notified_at_iso" }
          assert:
            - "${created_state} == SCHEDULED"
            - "${created_baseline} == null"
            - "${baseline_error} == ERR_BASELINE_DATA_INSUFFICIENT"
            - "the first notify returns HTTP 422 and DemandResponseEvent.${event_id}.event_state stays SCHEDULED"
            - "${notified_state} == NOTIFIED"
            - "${baseline} == 1290.5"
            - "${notified_at} == 2026-08-01T00:00:00Z"
            - "the 1600.0 off-peak, 1500.0 event-day and 1400.0 post-start intervals are all excluded, so baseline_kw is not 1447.6 and not 1345.3"

  - rule_id: cross_entity_state_dependency
    instances:
      - name: dr_activation_blocked_by_store_curtailed_posture
        grounds:
          - state_machines.DemandResponseEvent.transitions.dr_activate
          - state_machines.Store.transitions.posture_raise_curtailed
          - state_machines.Store.transitions.posture_release_from_curtailed
          - validations[priority=80]
          - errors.ERR_FOOD_SAFETY_HOLD
          - calculations.store_energy_posture
        distinguishing_aspect: |
          Entity pair (DemandResponseEvent, Store): an event's activation legality is
          decided by a field of a grandparent two hops away
          (UtilityAccount.store_id -> Store.energy_posture). Two accounts of the same
          store each hold a NOTIFIED event; activating account 1's event puts the
          store in CURTAILED, which then blocks account 2's event even though
          nothing about account 2 or its event changed. The clock sweep that
          completes event 1 releases the posture and the identical request succeeds.
        test_recipe:
          setup:
            - "one MIXED / SUPERCENTER store with BMS ACTIVE and two TOU_DEMAND accounts"
            - "each account has three on-peak baseline intervals before its own curtailment window"
            - "account 1 event A: 2026-08-05T14:00Z-15:00Z; account 2 event B: 2026-08-05T14:30Z-15:30Z; both NOTIFIED"
          setup_api_calls:
            - call: "POST /energy-ops/_clock/set_current_utc"
              payload: { current_utc: "2026-08-01T00:00:00Z" }
              as: PlatformAdmin
