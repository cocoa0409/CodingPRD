# =============================================================================
# 1.8 Scaffold Difficulty Design (Test Targeting Index)
# Domain: interchange-qualification-mcc-assignment  (task 2527)
#
# Every instance grounds in SCAFFOLD.yaml sections 1.1-1.7 only. Every literal in
# every assert was computed by executing the referenced calculations[].formula
# against its constants; no assert is left as an expression.
#
# Canonical reference data used by most chains (all values are literals):
#   ProcessingPlatform  max_concurrent_windows 1, blackout_buffer_days 3
#   Acquirer            country_code "US", settlement_currency "USD"
#   MccDefinition 5411  GROCERY,   program_eligibility ["SMALL_TICKET"], no docs, not high risk
#   MccDefinition 4900  UTILITY_SERVICE, ["UTILITY"],  requires_documentation true
#   MccDefinition 7995  GAMBLING,  [],  requires_documentation true, high_risk true
#   MccDefinition 8398  CHARITABLE,["CHARITY"], requires_documentation true
#   MccDefinition 9399  GOVERNMENT,["GOVERNMENT"]
#   RateProgram CPS_RETAIL   145 bps, 10c, 4 data elements, max delay 24h
#   RateProgram SMALL_TICKET 165 bps,  4c, 2 data elements, max delay 48h
#   RateProgram UTILITY        0 bps, 75c, 2 data elements, max delay 48h
#   RateProgram CHARITY      100 bps,  0c, 1 data element,  max delay 168h
#   RateProgram STANDARD     254 bps, 10c, no data elements, max delay 720h  (fallback)
# =============================================================================
scaffold_difficulty_design:

  - rule_id: dual_variant_calc
    instances:
      - name: dual_variant_qualification_provisional_auth_based_vs_final_clearing_based
        grounds:
          - calculations.qualification_evaluation
          - calculations.downgrade_reason_resolution
          - calculations.interchange_assessment
          - entities.TransactionRecord.fields.provisional_assessed_cents
          - entities.TransactionRecord.fields.assessed_interchange_cents
          - state_machines.TransactionRecord.PENDING_to_DOWNGRADED
        distinguishing_aspect: |
          Operates on TransactionRecord MONEY: the same stored row (amount_cents 8000, all four
          clearing data elements present, clearing_delay_hours 30) is priced at 126 cents under
          PROVISIONAL_AUTH_BASED, which omits clause C6 and so admits CPS_RETAIL, and at 213 cents
          under FINAL_CLEARING_BASED, which enforces C6 and drops CPS_RETAIL because 30 > 24.
        test_recipe:
          setup:
            - "Logical clock at 2026-09-03T00:00:00Z."
            - "One platform, one US/USD acquirer, MCC 5411 defined, and the CPS_RETAIL, SMALL_TICKET and STANDARD rate programs published."
            - "One VERIFIED grocery merchant under that acquirer."
            - "One OPEN settlement batch holding a single PENDING record: amount_cents 8000, all four data elements, auth 2026-09-01T00:00:00Z, clearing 2026-09-02T06:00:00Z (30 hours late)."
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-09-03T00:00:00Z" }
              as: NetworkAdmin
            - call: "POST /processing-platforms"
              payload: { name: "PLAT-NA-1", region_code: "NA", max_concurrent_windows: 1, blackout_buffer_days: 3 }
              as: NetworkAdmin
              captures: { plat_id: $.data.id }
            - call: "POST /acquirers"
              payload: { name: "Acme Acquiring", bin_prefix: "411111", platform_id: "${plat_id}", country_code: "US", settlement_currency: "USD" }
              as: NetworkAdmin
              captures: { acq_id: $.data.id }
            - call: "POST /mcc-definitions"
              payload: { mcc_code: "5411", description: "Grocery Stores", business_type_key: "GROCERY", program_eligibility: ["SMALL_TICKET"], requires_documentation: false, high_risk: false }
              as: NetworkAdmin
            - call: "POST /rate-programs"
              payload: { program_code: "CPS_RETAIL_STD", name: "CPS Retail", category: "CPS_RETAIL", eligible_mcc_codes: ["5411"], base_rate_bps: 145, per_item_fee_cents: 10, requires_data_elements: ["AUTH_CODE", "TERMINAL_ID", "TRANSACTION_DATE", "CARDHOLDER_ZIP"], max_clearing_delay_hours: 24 }
              as: NetworkAdmin
              captures: { cps_id: $.data.id }
            - call: "POST /rate-programs"
              payload: { program_code: "SMALL_TICKET_STD", name: "Small Ticket", category: "SMALL_TICKET", eligible_mcc_codes: ["5411"], base_rate_bps: 165, per_item_fee_cents: 4, requires_data_elements: ["AUTH_CODE", "TERMINAL_ID"], max_clearing_delay_hours: 48 }
              as: NetworkAdmin
              captures: { st_id: $.data.id }
            - call: "POST /rate-programs"
              payload: { program_code: "STANDARD_FALLBACK", name: "Standard", category: "STANDARD", eligible_mcc_codes: ["5411", "4900", "7995", "8398", "9399"], base_rate_bps: 254, per_item_fee_cents: 10, requires_data_elements: [], max_clearing_delay_hours: 720 }
              as: NetworkAdmin
              captures: { std_id: $.data.id }
            - call: "POST /merchants"
              payload: { legal_name: "Corner Grocer", business_type_key: "GROCERY", acquirer_id: "${acq_id}", home_country_code: "US" }
              as: AcquirerOps
              as_user_id: "${acq_id}"
              captures: { mer_id: $.data.id }
            - call: "POST /settlement-batches"
              payload: { acquirer_id: "${acq_id}", batch_date: "2026-09-02", currency_code: "USD" }
              as: AcquirerOps
              as_user_id: "${acq_id}"
              captures: { batch_id: $.data.id, batch_v0: $.data.version }
            - call: "POST /settlement-batches/${batch_id}/transaction-records"
              payload: { merchant_id: "${mer_id}", amount_cents: 8000, transaction_currency: "USD", auth_code: "A00001", auth_timestamp: "2026-09-01T00:00:00Z", clearing_timestamp: "2026-09-02T06:00:00Z", data_elements: ["AUTH_CODE", "TERMINAL_ID", "TRANSACTION_DATE", "CARDHOLDER_ZIP"], expected_batch_version: "${batch_v0}" }
              as: AcquirerOps
              as_user_id: "${acq_id}"
              captures: { rec_id: $.data.id, prov_prog: $.data.provisional_rate_program_id, prov_cents: $.data.provisional_assessed_cents }
          trigger:
            - call: "POST /settlement-batches/${batch_id}/submit"
              payload: {}
              as: AcquirerOps
              as_user_id: "${acq_id}"
            - call: "POST /settlement-batches/${batch_id}/finalize"
              payload: {}
              as: NetworkAdmin
          assert:
            - "TransactionRecord.${rec_id}.clearing_delay_hours == 30"
            - "TransactionRecord.${rec_id}.provisional_rate_program_id == ${cps_id}"
            - "TransactionRecord.${rec_id}.provisional_assessed_cents == 126"
            - "TransactionRecord.${rec_id}.qualified_rate_program_id == ${std_id}"
            - "TransactionRecord.${rec_id}.assessed_interchange_cents == 213"
            - "TransactionRecord.${rec_id}.qualification_status == DOWNGRADED"
            - "TransactionRecord.${rec_id}.downgrade_reason == LATE_CLEARING"
            - "TransactionRecord.${rec_id}.provisional_assessed_cents != TransactionRecord.${rec_id}.assessed_interchange_cents"
            - "SettlementBatch.${batch_id}.total_assessed_cents == 213"

      - name: dual_variant_performance_score_trailing_vs_projected_on_incentive_enrollment
        grounds:
          - calculations.incentive_performance_score
          - entities.IncentiveEnrollment.fields.achieved_volume_cents
          - entities.IncentiveEnrollment.fields.performance_score_pct
          - entities.IncentiveEnrollment.fields.last_evaluated_basis
          - state_machines.IncentiveEnrollment.ENROLLED_to_PROBATION
          - state_machines.IncentiveEnrollment.PROBATION_to_ENROLLED
        distinguishing_aspect: |
          Operates on a different entity and a different value domain from the money instance:
          IncentiveEnrollment PERCENTAGE. The identical two finalized batches score 40.00 under
          TRAILING (current partial quarter discarded) and 59.57 under PROJECTED (current quarter
          annualised 92/47), which straddles the program's 50.00 threshold and therefore routes the
          same enrollment to PROBATION and then back to ENROLLED.
        test_recipe:
          setup:
            - "Platform, US/USD acquirer, MCC 5411, and the CPS_RETAIL, SMALL_TICKET and STANDARD rate programs."
            - "Incentive program with performance_threshold_pct 50.00 and eligible_mcc_codes [\"5411\"]."
            - "Clock at 2026-05-01T00:00:00Z when the merchant enrols with committed_volume_cents 10000000."
            - "Two FINALIZED batches: batch_date 2026-05-15 carrying 4000000 cents (prior quarter Q2) and batch_date 2026-07-10 carrying 1000000 cents (current quarter Q3); both records qualify to CPS_RETAIL."
            - "Clock advanced to 2026-08-16T00:00:00Z, i.e. day 47 of a 92-day Q3."
          setup_api_calls:
            - call: "POST /processing-platforms"
              payload: { name: "PLAT-NA-1", region_code: "NA", max_concurrent_windows: 1, blackout_buffer_days: 3 }
              as: NetworkAdmin
              captures: { plat_id: $.data.id }
            - call: "POST /acquirers"
              payload: { name: "Acme Acquiring", bin_prefix: "411111", platform_id: "${plat_id}", country_code: "US", settlement_currency: "USD" }
              as: NetworkAdmin
              captures: { acq_id: $.data.id }
            - call: "POST /mcc-definitions"
              payload: { mcc_code: "5411", description: "Grocery Stores", business_type_key: "GROCERY", program_eligibility: ["SMALL_TICKET"], requires_documentation: false, high_risk: false }
              as: NetworkAdmin
            - call: "POST /rate-programs"
              payload: { program_code: "CPS_RETAIL_STD", name: "CPS Retail", category: "CPS_RETAIL", eligible_mcc_codes: ["5411"], base_rate_bps: 145, per_item_fee_cents: 10, requires_data_elements: ["AUTH_CODE", "TERMINAL_ID", "TRANSACTION_DATE", "CARDHOLDER_ZIP"], max_clearing_delay_hours: 24 }
              as: NetworkAdmin
              captures: { cps_id: $.data.id }
            - call: "POST /rate-programs"
              payload: { program_code: "SMALL_TICKET_STD", name: "Small Ticket", category: "SMALL_TICKET", eligible_mcc_codes: ["5411"], base_rate_bps: 165, per_item_fee_cents: 4, requires_data_elements: ["AUTH_CODE", "TERMINAL_ID"], max_clearing_delay_hours: 48 }
              as: NetworkAdmin
            - call: "POST /rate-programs"
              payload: { program_code: "STANDARD_FALLBACK", name: "Standard", category: "STANDARD", eligible_mcc_codes: ["5411", "4900", "7995", "8398", "9399"], base_rate_bps: 254, per_item_fee_cents: 10, requires_data_elements: [], max_clearing_delay_hours: 720 }
              as: NetworkAdmin
            - call: "POST /incentive-programs"
              payload: { program_name: "Grocery Growth 2026", eligible_mcc_codes: ["5411"], total_capacity_cents: 100000000, min_commitment_cents: 5000000, reopen_threshold_cents: 5000000, performance_threshold_pct: 50.00 }
              as: NetworkAdmin
              captures: { ip_id: $.data.id, ip_v0: $.data.version }
            - call: "POST /merchants"
              payload: { legal_name: "Corner Grocer", business_type_key: "GROCERY", acquirer_id: "${acq_id}", home_country_code: "US" }
              as: AcquirerOps
              as_user_id: "${acq_id}"
              captures: { mer_id: $.data.id }
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-05-01T00:00:00Z" }
              as: NetworkAdmin
            - call: "POST /incentive-enrollments"
              payload: { incentive_program_id: "${ip_id}", merchant_id: "${mer_id}", committed_volume_cents: 10000000, waitlist_requested: false, expected_incentive_program_version: "${ip_v0}" }
              as: AcquirerOps
              as_user_id: "${acq_id}"
              captures: { enr_id: $.data.id }
            - call: "POST /settlement-batches"
              payload: { acquirer_id: "${acq_id}", batch_date: "2026-05-15", currency_code: "USD" }
              as: AcquirerOps
              as_user_id: "${acq_id}"
              captures: { b1_id: $.data.id, b1_v0: $.data.version }
            - call: "POST /settlement-batches/${b1_id}/transaction-records"
              payload: { merchant_id: "${mer_id}", amount_cents: 4000000, transaction_currency: "USD", auth_code: "A00010", auth_timestamp: "2026-05-15T00:00:00Z", clearing_timestamp: "2026-05-15T01:00:00Z", data_elements: ["AUTH_CODE", "TERMINAL_ID", "TRANSACTION_DATE", "CARDHOLDER_ZIP"], expected_batch_version: "${b1_v0}" }
              as: AcquirerOps
              as_user_id: "${acq_id}"
            - call: "POST /settlement-batches/${b1_id}/submit"
              payload: {}
              as: AcquirerOps
              as_user_id: "${acq_id}"
            - call: "POST /settlement-batches/${b1_id}/finalize"
              payload: {}
              as: NetworkAdmin
            - call: "POST /settlement-batches"
              payload: { acquirer_id: "${acq_id}", batch_date: "2026-07-10", currency_code: "USD" }
              as: AcquirerOps
              as_user_id: "${acq_id}"
              captures: { b2_id: $.data.id, b2_v0: $.data.version }
            - call: "POST /settlement-batches/${b2_id}/transaction-records"
              payload: { merchant_id: "${mer_id}", amount_cents: 1000000, transaction_currency: "USD", auth_code: "A00011", auth_timestamp: "2026-07-10T00:00:00Z", clearing_timestamp: "2026-07-10T01:00:00Z", data_elements: ["AUTH_CODE", "TERMINAL_ID", "TRANSACTION_DATE", "CARDHOLDER_ZIP"], expected_batch_version: "${b2_v0}" }
              as: AcquirerOps
              as_user_id: "${acq_id}"
            - call: "POST /settlement-batches/${b2_id}/submit"
              payload: {}
              as: AcquirerOps
              as_user_id: "${acq_id}"
            - call: "POST /settlement-batches/${b2_id}/finalize"
              payload: {}
              as: NetworkAdmin
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-08-16T00:00:00Z" }
              as: NetworkAdmin
          trigger:
            - call: "POST /incentive-enrollments/${enr_id}/evaluate-performance"
              payload: { basis: "TRAILING" }
              as: NetworkAdmin
              captures: { trailing_score: $.data.performance_score_pct, trailing_achieved: $.data.achieved_volume_cents, trailing_status: $.data.status }
            - call: "POST /incentive-enrollments/${enr_id}/evaluate-performance"
              payload: { basis: "PROJECTED" }
              as: NetworkAdmin
              captures: { projected_score: $.data.performance_score_pct, projected_achieved: $.data.achieved_volume_cents, projected_status: $.data.status }
          assert:
            - "${trailing_achieved} == 4000000"
            - "${trailing_score} == 40.00"
            - "${trailing_status} == PROBATION"
            - "IncentiveEnrollment.${enr_id}.probation_count == 1 after the first trigger call"
            - "${projected_achieved} == 5957447"
            - "${projected_score} == 59.57"
            - "${projected_status} == ENROLLED"
            - "IncentiveEnrollment.${enr_id}.last_evaluated_basis == PROJECTED after the second trigger call"
            - "${trailing_achieved} != ${projected_achieved}"

  - rule_id: combinatorial_formula
    instances:
      - name: combinatorial_mode_a_nested_cap_then_floor_clamp_with_cross_border_and_fx
        grounds:
          - calculations.interchange_assessment
          - entities.TransactionRecord.fields.cross_border
          - entities.TransactionRecord.fields.cross_border_surcharge_cents
          - entities.TransactionRecord.fields.fx_markup_cents
          - entities.FxRate.fields.markup_bps
        distinguishing_aspect: |
          Mode (a) nested min/max: result = max(min(base + cross_border + fx, cap), floor). Both
          conditional limbs are engaged (cross-border 20, FX markup 50) so the raw 207 exceeds the
          350 bps cap of 175 and the assessment clamps DOWN to 175 while the two component fields
          remain at their pre-clamp values.
        test_recipe:
          setup:
            - "Clock at 2026-09-03T00:00:00Z."
            - "US/USD acquirer; the merchant's home_country_code is CA, so cross_border is true."
            - "FxRate CAD->USD with markup_bps 100 effective from 2026-08-01T00:00:00Z."
            - "One OPEN USD batch holding a single PENDING record of 5000 CAD carrying only AUTH_CODE, so only the STANDARD program (254 bps + 10c) can qualify it."
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-09-03T00:00:00Z" }
              as: NetworkAdmin
            - call: "POST /processing-platforms"
              payload: { name: "PLAT-NA-1", region_code: "NA", max_concurrent_windows: 1, blackout_buffer_days: 3 }
              as: NetworkAdmin
              captures: { plat_id: $.data.id }
            - call: "POST /acquirers"
              payload: { name: "Acme Acquiring", bin_prefix: "411111", platform_id: "${plat_id}", country_code: "US", settlement_currency: "USD" }
              as: NetworkAdmin
              captures: { acq_id: $.data.id }
            - call: "POST /mcc-definitions"
              payload: { mcc_code: "5411", description: "Grocery Stores", business_type_key: "GROCERY", program_eligibility: ["SMALL_TICKET"], requires_documentation: false, high_risk: false }
              as: NetworkAdmin
            - call: "POST /rate-programs"
              payload: { program_code: "CPS_RETAIL_STD", name: "CPS Retail", category: "CPS_RETAIL", eligible_mcc_codes: ["5411"], base_rate_bps: 145, per_item_fee_cents: 10, requires_data_elements: ["AUTH_CODE", "TERMINAL_ID", "TRANSACTION_DATE", "CARDHOLDER_ZIP"], max_clearing_delay_hours: 24 }
              as: NetworkAdmin
            - call: "POST /rate-programs"
              payload: { program_code: "SMALL_TICKET_STD", name: "Small Ticket", category: "SMALL_TICKET", eligible_mcc_codes: ["5411"], base_rate_bps: 165, per_item_fee_cents: 4, requires_data_elements: ["AUTH_CODE", "TERMINAL_ID"], max_clearing_delay_hours: 48 }
              as: NetworkAdmin
            - call: "POST /rate-programs"
              payload: { program_code: "STANDARD_FALLBACK", name: "Standard", category: "STANDARD", eligible_mcc_codes: ["5411", "4900", "7995", "8398", "9399"], base_rate_bps: 254, per_item_fee_cents: 10, requires_data_elements: [], max_clearing_delay_hours: 720 }
              as: NetworkAdmin
              captures: { std_id: $.data.id }
            - call: "POST /fx-rates"
              payload: { base_currency: "CAD", quote_currency: "USD", rate: 0.74, markup_bps: 100, effective_from: "2026-08-01T00:00:00Z" }
              as: NetworkAdmin
            - call: "POST /merchants"
              payload: { legal_name: "Maple Grocer", business_type_key: "GROCERY", acquirer_id: "${acq_id}", home_country_code: "CA" }
              as: AcquirerOps
              as_user_id: "${acq_id}"
              captures: { mer_id: $.data.id }
            - call: "POST /settlement-batches"
              payload: { acquirer_id: "${acq_id}", batch_date: "2026-09-02", currency_code: "USD" }
              as: AcquirerOps
              as_user_id: "${acq_id}"
              captures: { batch_id: $.data.id, batch_v0: $.data.version }
            - call: "POST /settlement-batches/${batch_id}/transaction-records"
              payload: { merchant_id: "${mer_id}", amount_cents: 5000, transaction_currency: "CAD", auth_code: "A00020", auth_timestamp: "2026-09-01T00:00:00Z", clearing_timestamp: "2026-09-02T00:00:00Z", data_elements: ["AUTH_CODE"], expected_batch_version: "${batch_v0}" }
              as: AcquirerOps
              as_user_id: "${acq_id}"
              captures: { rec_id: $.data.id }
            - call: "POST /settlement-batches/${batch_id}/submit"
              payload: {}
              as: AcquirerOps
              as_user_id: "${acq_id}"
          trigger:
            - call: "POST /settlement-batches/${batch_id}/finalize"
              payload: {}
              as: NetworkAdmin
          assert:
            - "TransactionRecord.${rec_id}.cross_border == true"
            - "TransactionRecord.${rec_id}.qualified_rate_program_id == ${std_id}"
            - "TransactionRecord.${rec_id}.cross_border_surcharge_cents == 20"
            - "TransactionRecord.${rec_id}.fx_markup_cents == 50"
            - "TransactionRecord.${rec_id}.assessed_interchange_cents == 175"
            - "TransactionRecord.${rec_id}.qualification_status == DOWNGRADED"
            - "TransactionRecord.${rec_id}.downgrade_reason == MISSING_DATA_ELEMENTS"
            - "SettlementBatch.${batch_id}.total_assessed_cents == 175"

      - name: combinatorial_mode_b_round_per_record_then_sum_batch_total
        grounds:
          - calculations.batch_assessment_total
          - calculations.interchange_assessment
          - entities.SettlementBatch.fields.total_assessed_cents
          - entities.TransactionRecord.fields.assessed_interchange_cents
        distinguishing_aspect: |
          Mode (b) order-of-operations: two records of 1200 cents on the 254 bps + 10c STANDARD
          program must round per record and then sum to exactly 80, not accumulate the unrounded
          ad-valorem products (60.96 -> 61) and round once for 81.
        test_recipe:
          setup:
            - "Clock at 2026-09-03T00:00:00Z; US/USD acquirer; MCC 5411; CPS_RETAIL, SMALL_TICKET and STANDARD programs."
            - "One VERIFIED grocery merchant."
            - "One OPEN batch holding two PENDING records, each amount_cents 1200 with an empty data_elements list so only STANDARD can qualify them."
