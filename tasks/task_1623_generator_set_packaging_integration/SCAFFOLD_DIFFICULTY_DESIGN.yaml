              as: PlatformAdmin
              captures: { err9: $.data.error_id }
          assert:
            - "EmissionsCertificate.${ec9}.required_tier == TIER_4_FINAL_CARB (captured)"
            - "issue rejected with error_id == ERR_CERT_STATE_INVALID, NOT ERR_EMISSIONS_TIER_INSUFFICIENT"
            - "EmissionsCertificate.${ec9}.status == APP_DRAFT"

      - name: referential_vs_fiscal_on_authorize
        grounds:
          - validations[priority=10]
          - validations[priority=11]
          - errors[ERR_SIZING_NOT_APPROVED]
          - errors[ERR_CREDIT_LIMIT_EXCEEDED]
        distinguishing_aspect: |
          Category pair business_referential x business_fiscal: authorizing an
          order with NO approved sizing study (referential violation) AND an
          amount that would exceed the customer's credit limit (fiscal
          violation) returns ERR_SIZING_NOT_APPROVED — referential (priority
          10) is checked before fiscal (priority 11).
