            - call: "POST /usage-licenses"
              payload: { generated_performance_id: "${p2_id}", channel: "ADVERTISING", territory_codes: ["US"], distribution_start: "2026-08-01T00:00:00Z", distribution_end: "2026-12-01T00:00:00Z", actual_impressions: 500000, expected_replica_version: "${r_v1}" }
              as: LicenseeProducer
              as_user_id: "lic-001"
            - call: "GET /digital-replicas/${r_id}"
              payload: {}
              as: LicenseeProducer
              as_user_id: "lic-001"
              captures: { r_v2: $.data.version }
            - call: "POST /usage-licenses"
              payload: { generated_performance_id: "${p2_id}", channel: "ADVERTISING", territory_codes: ["US"], distribution_start: "2026-08-01T00:00:00Z", distribution_end: "2026-12-01T00:00:00Z", actual_impressions: 500000, expected_replica_version: "${r_v2}" }
              as: LicenseeProducer
              as_user_id: "lic-001"
              captures: { l2_id: $.data.id }
          assert:
            - "trigger call 1 shows t_v2 > t_v1: the grant draft, the countersign cascade and both performance reviews each advanced Talent.version, so the token captured at talent creation is long stale"
            - "trigger call 2 -> 412 with data.error_id == \"ERR_TALENT_VERSION_STALE\" — a sequential retry would have succeeded (a second non-exclusive SOCIAL grant is legitimate), so only the version guard catches the lost read; GET /consent-grants?talent_id=${t_id} still returns total_count == 1"
            - "trigger call 3 -> 201 with the SAME body and only the refreshed token changed, and it advances Talent.version once more"
            - "trigger call 4 -> 201 and bumps DigitalReplica.version, so r_v1 is now stale"
            - "trigger call 5 -> 412 with data.error_id == \"ERR_REPLICA_VERSION_STALE\": a retry would have found the replica still APPROVED_FOR_USE and inside the overlap cap of 2, so nothing but the version reveals the drift; GET /usage-licenses returns total_count == 1 and no CompensationEntry was posted for it"
