            - "StaffMember.${sm_1}.status == SUSPENDED and last_status_reason == 'Pending conduct review'; nothing about the member changed as a result of the refused assign"

      - name: accessibility_confirm_requires_available_resource
        grounds:
          - validations[priority=11]
          - state_machines.AccessibilityRequest.REQUESTED_to_CONFIRMED
          - state_machines.AccessibilityResource.AVAILABLE_to_MAINTENANCE
          - errors.ERR_RESOURCE_NOT_AVAILABLE
          - calculations.accessibility_peak_occupancy
        distinguishing_aspect: |
          A THIRD entity pair - AccessibilityRequest -> AccessibilityResource - where the parent's
          state is toggled by a plain PATCH rather than by a lifecycle action, and where the refusal
          must leave the derived aggregate untouched: peak_committed_units stays 0 while the resource
          is in MAINTENANCE, and only jumps to units_requested once the parent returns to AVAILABLE.
          An implementation that recomputes the peak before checking the parent state leaks a
          committed-looking 2 onto a resource that is out of service.
        test_recipe:
          setup:
            - "Clock at 2026-09-12T15:00:00Z; Event in PLANNED (one ACTIVE plan with one slot), which is what REQUESTED -> CONFIRMED requires."
            - "A WHEELCHAIR_ESCORT AccessibilityResource in zone Z950 with unit_count 3, created AVAILABLE with peak_committed_units 0, then PATCHed to MAINTENANCE."
            - "One REQUESTED AccessibilityRequest for 2 units over the half-open window [18:00, 20:00)."
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { current_utc: "2026-09-12T15:00:00Z" }
              as: GuestServicesSupervisor
            - call: "POST /events"
