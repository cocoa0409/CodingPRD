              payload: { name: "Vov", cadence: "WEEKLY", theme: "T", default_seat_capacity: 1, base_seat_price_cents: 10000, default_deposit_pct: 0.25 }
              as: PlatformAdmin
              captures: { series_id: $.data.id }
