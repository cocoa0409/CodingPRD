            - "PointTransfer.${xt_id}.exception_required == true"
            - "PointTransfer.${xt_id}.transfer_pct_cap == 1.00 and PointTransfer.${xt_id}.max_transferable_points == 15.00"
            - "PointTransfer.${xt_id}.exception_granted_by_user_id == null and approved_by_user_id == null and decision_note == null and reversed_at == null"
            - "PointTransfer.${xt_id}.version == 1"
            - "Donor.${xs_id}.transferred_points_out == 0.00 and Donor.${xs_id}.certified_points == 15.00"
            - "Donor.${yr_id}.transferred_points_in == 0.00 and Donor.${yr_id}.certified_points == 0.00"
            - "Donor.${xs_id}.version == 4 (create, gift create, run, transfer create)"

      - name: policy_grant_returns_an_exception_pending_transfer_to_requested
        claim_type: valid_transition
        grounds:
          - state_machines.PointTransfer.status.transitions.EXCEPTION_PENDING_to_REQUESTED
          - endpoints.POST_/athletics/point-transfers/{id}/policy-decision
        distinguishing_aspect: |
          The EXCEPTION_PENDING -> REQUESTED grant is an authorisation edge only:
          it stamps exception_granted_by_user_id and decision_note and bumps the
          transfer version, but must NOT move any points and must NOT set
          approved_by_user_id. Points move only on the later approve call, so
          both donors' transferred_* counters are still 0.00 afterwards.
