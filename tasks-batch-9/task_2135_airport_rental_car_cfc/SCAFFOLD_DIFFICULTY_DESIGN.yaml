              as: FacilityAdmin
              captures: { agr_a_id: $.data.id }
            - call: "POST /rac/concession-agreements/${agr_a_id}/execute"
              payload: {}
              as: FacilityAdmin
            - call: "POST /rac/debt-service-obligations"
              payload: { facility_id: "${fac_id}", series_label: "Series 2026A", due_date: "2026-12-01", amount_due_cents: 800000, coverage_requirement_bps: 12500 }
              as: FacilityAdmin
              captures: { ob_id: $.data.id }
            - call: "POST /rac/capital-projects"
