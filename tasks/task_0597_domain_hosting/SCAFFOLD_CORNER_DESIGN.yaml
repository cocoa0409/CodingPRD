      - name: risk_score_decays_by_half_every_ninety_days
        claim_type: correct_result
        grounds:
          - calculations.account_risk_score
          - endpoints[POST /registrar/_ops/run-expiry-sweep]
        distinguishing_aspect: "A HIGH report upheld on 2026-05-01 scores 30; 184 days later (2026-11-01) the decay exponent is floor(184/90) == 2, so the score refreshes to round_half_up(30 * 0.25) == 8."
        test_recipe:
          setup: ["Account with one upheld HIGH abuse report decided at the 2026-05-01 clock default (risk_score 30, account still ACTIVE)."]
          setup_api_calls:
            - call: "POST /registrar/accounts"
              payload: { email: "decay@corp.example", company_name: "Corp Example" }
              as: Anonymous
              captures: { acct_id: $.data.id }
            - call: "POST /registrar/accounts/${acct_id}/payment-method"
              payload: { card_token: "tok_visa_4242" }
