  # ===========================================================================
  # SECTION 2 — state_machines
  # ===========================================================================
  - section: state_machines
    instances:

      - name: initial_states_pinned_on_create_across_every_entity
        claim_type: initial_state
        grounds:
          - "§1.2 initial_state values: StatePlan DRAFT, Station PROVISIONING, EASDevice REGISTERED, MonitoringAssignment ACTIVE, EquipmentOutage OPEN, TestEvent SCHEDULED, InspectionRequest OPEN, AlertEvent accessibility_state ACCESSIBILITY_UNVERIFIED"
          - "§1.2 state_machines.AlertEvent(relay_state) note: 'RECEIVED is resolved inside the same POST /alert-events request (consistency_model: immediate), so it is never observable in a response body'"
        distinguishing_aspect: "Every entity's create response already carries its declared initial_state, with one deliberate exception the scaffold calls out: AlertEvent.relay_state never appears as RECEIVED because the suppression and selector phases resolve it inside the same request — a create with no matching rule surfaces UNMATCHED_OPTIONAL instead."
        test_recipe:
          setup:
            - "Clock 2026-08-01T00:00:00Z; no relay rules are created at all, so the selector pool is empty for the alert below."
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              as: ComplianceAdmin
              as_user_id: adm-1
              payload: { to_iso8601: "2026-08-01T00:00:00Z" }
          trigger:
            - call: "POST /state-plans"
              as: ComplianceAdmin
              as_user_id: adm-1
              payload: { state_code: "KS", plan_version_label: "2026-R1", required_source_types: ["PEP"], mandatory_relay_event_codes: [] }
              captures: { plan_id: "$.data.id" }
            - call: "POST /state-plans/${plan_id}/activate"
              as: ComplianceAdmin
              as_user_id: adm-1
              payload: {}
            - call: "POST /stations"
              as: ComplianceAdmin
              as_user_id: adm-1
              payload: { state_plan_id: "${plan_id}", call_sign: "KWEA", service_type: "TV", engineer_user_ids: ["eng-1"], certification_officer_user_id: "cert-1" }
              captures: { station_id: "$.data.id" }
            - call: "POST /eas-devices"
              as: StationEngineer
              as_user_id: eng-1
              payload: { station_id: "${station_id}", model_code: "DASDEC-3", device_role: "DECODER", firmware_version: "5.2.1" }
              captures: { dev1: "$.data.id" }
            - call: "POST /eas-devices/${dev1}/readiness-check"
              as: StationEngineer
              as_user_id: eng-1
              payload: { self_test_passed: true, firmware_current: true }
            - call: "GET /stations/${station_id}"
              as: StationEngineer
              as_user_id: eng-1
              captures: { sv1: "$.data.version" }
            - call: "POST /monitoring-assignments"
              as: StationEngineer
              as_user_id: eng-1
              payload: { station_id: "${station_id}", device_id: "${dev1}", source_type: "PEP", source_call_sign: "WXPEP", expected_station_version: "${sv1}" }
              captures: { ma1: "$.data.id" }
            - call: "POST /equipment-outages"
              as: StationEngineer
              as_user_id: eng-1
              payload: { device_id: "${dev1}", detected_at: "2026-08-01T00:00:00Z", failure_summary: "decoder power supply fault" }
              captures: { outage1: "$.data.id" }
            - call: "POST /alert-events"
              as: StationEngineer
              as_user_id: eng-1
              payload: { station_id: "${station_id}", event_code: "TOR", originator_sequence: "KSINI-0001", fips_codes: ["20173"], received_at: "2026-08-01T00:00:00Z" }
              captures: { alert1: "$.data.id" }
            - call: "POST /inspection-requests"
              as: FieldInspector
              as_user_id: insp-1
              payload: { station_id: "${station_id}", requested_document_kinds: ["STATION_LOG"] }
              captures: { insp1: "$.data.id" }
          assert:
            - "StatePlan create: status == 'DRAFT'; Station create: compliance_posture == 'PROVISIONING'; EASDevice create: status == 'REGISTERED' with readiness_check_passed == false"
            - "MonitoringAssignment create: status == 'ACTIVE' with counts_toward_required_sources == true"
            - "EquipmentOutage create: status == 'OPEN' with repair_cycle_count == 0, repair_started_at == null, restored_at == null"
            - "AlertEvent create: relay_state == 'UNMATCHED_OPTIONAL' (never 'RECEIVED' — resolved in-request against an empty rule pool) and accessibility_state == 'ACCESSIBILITY_UNVERIFIED'"
            - "InspectionRequest create: status == 'OPEN' with provided_document_kinds == [] and completeness_score == null"

      - name: plan_activate_valid_transition_writes_activated_at_from_the_clock
        claim_type: valid_transition
        grounds:
          - "§1.2 state_machines.StatePlan DRAFT -> ACTIVE, preconditions ['status == DRAFT', 'required_source_types is non-empty'], side effect 'activated_at = logical clock now'"
          - "§1.5 POST /state-plans/{id}/activate"
        distinguishing_aspect: "The transition takes activated_at from the logical clock at the moment of the activate (2026-08-09T15:45:00Z), not from the create time, and leaves superseded_at null — so the two lifecycle timestamps are written by different triggers."
        test_recipe:
          setup:
            - "Plan created at 2026-08-01T00:00:00Z, then the clock advanced to 2026-08-09T15:45:00Z before the activate."
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              as: ComplianceAdmin
              as_user_id: adm-1
              payload: { to_iso8601: "2026-08-01T00:00:00Z" }
            - call: "POST /state-plans"
              as: ComplianceAdmin
              as_user_id: adm-1
              payload: { state_code: "KS", plan_version_label: "2026-R1", required_source_types: ["PEP", "NWS"], mandatory_relay_event_codes: ["EAN"] }
              captures: { plan_id: "$.data.id" }
            - call: "POST /_clock/set_current_utc"
              as: ComplianceAdmin
              as_user_id: adm-1
              payload: { to_iso8601: "2026-08-09T15:45:00Z" }
          trigger:
            - call: "POST /state-plans/${plan_id}/activate"
              as: ComplianceAdmin
              as_user_id: adm-1
              payload: {}
            - call: "GET /state-plans"
              as: ComplianceAdmin
              as_user_id: adm-1
              payload: { state_code: "KS", status: "ACTIVE" }
          assert:
            - "HTTP 200 with status == 'ACTIVE' and activated_at == '2026-08-09T15:45:00Z'"
            - "superseded_at is still null and required_source_count is still 2"
            - "GET /state-plans filtered by state_code 'KS' + status 'ACTIVE' returns total_count == 1 with that plan"

      - name: plan_activate_twice_cannot_repeat_the_draft_transition
        claim_type: idempotency
        grounds:
          - "§1.2 state_machines.StatePlan DRAFT -> ACTIVE precondition 'status == DRAFT'"
          - "§1.6 ERR_PLAN_NOT_DRAFT (409): 'activate a StatePlan whose status is not DRAFT'"
        distinguishing_aspect: "The activate is not idempotent by design: the second call is a 409 ERR_PLAN_NOT_DRAFT and — critically — does NOT re-stamp activated_at or bump version, so replaying it cannot silently move the plan's activation instant."
        test_recipe:
          setup:
            - "Plan KS 2026-R1 activated once at 2026-08-05T09:00:00Z; clock then moved to 2026-08-06T09:00:00Z."
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              as: ComplianceAdmin
              as_user_id: adm-1
              payload: { to_iso8601: "2026-08-05T09:00:00Z" }
            - call: "POST /state-plans"
              as: ComplianceAdmin
              as_user_id: adm-1
              payload: { state_code: "KS", plan_version_label: "2026-R1", required_source_types: ["PEP"], mandatory_relay_event_codes: [] }
              captures: { plan_id: "$.data.id" }
            - call: "POST /state-plans/${plan_id}/activate"
              as: ComplianceAdmin
              as_user_id: adm-1
              payload: {}
              captures: { v_after_first: "$.data.version" }
            - call: "POST /_clock/set_current_utc"
              as: ComplianceAdmin
              as_user_id: adm-1
              payload: { to_iso8601: "2026-08-06T09:00:00Z" }
          trigger:
            - call: "POST /state-plans/${plan_id}/activate"
              as: ComplianceAdmin
              as_user_id: adm-1
              payload: {}
              captures: { err: "$.data.error_id" }
            - call: "GET /state-plans/${plan_id}"
              as: ComplianceAdmin
              as_user_id: adm-1
          assert:
            - "${err} == 'ERR_PLAN_NOT_DRAFT' with HTTP 409"
            - "activated_at is STILL '2026-08-05T09:00:00Z' — not re-stamped to the new clock value"
            - "version == ${v_after_first} == 2 — the rejected call did not mutate the row"

      - name: retire_relay_rule_twice_cannot_repeat
        claim_type: idempotency
        grounds:
          - "§1.5 POST /relay-rules/{id}/retire side effect 'status = RETIRED' ('Retires a relay rule so it leaves the selector candidate pool')"
          - "§1.1 RelayRule.status constraints 'one of {ACTIVE, RETIRED}', default ACTIVE"
          - "§1.6 ERR_RELAY_RULE_NOT_ACTIVE (409): 'retire called on a relay rule whose status is already RETIRED'"
          - "§1.3 calculations.relay_rule_selection input_set 'status == ACTIVE'"
        distinguishing_aspect: "The first retire removes the rule from the selector's candidate pool (a later alert falls back to UNMATCHED_OPTIONAL); the second retire is a 409 and leaves that pool exclusion unchanged rather than double-applying it."
        test_recipe:
          setup:
            - "Clock 2026-08-01T00:00:00Z; plan KS 2026-R1 activated with mandatory_relay_event_codes []; station KWEA; single rule rr1 for RWT, fips [], OPTIONAL, priority 40."
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
