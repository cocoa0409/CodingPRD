              payload: { requested_amount_cents: 1000000, period_covered_start: "2026-06-01T00:00:00Z", period_covered_end: "2026-06-30T00:00:00Z", expected_subaward_version: "${sub_v0}" }
              as: Subrecipient
              as_user_id: "${np_id}"
          trigger:
            - call: "POST /subawards/${sub_id}/drawdowns"
              payload: { requested_amount_cents: 1000000, period_covered_start: "2026-07-01T00:00:00Z", period_covered_end: "2026-07-31T00:00:00Z", expected_subaward_version: "${sub_v0}" }
              as: Subrecipient
              as_user_id: "${np_id}"
              captures: { err: $.data.error_id }
          assert: ["response.data.error_id == ERR_STALE_VERSION"]

