  # =========================================================================
  - rule_id: priority_pair_validation_conflict
    instances:

      - name: glass_lot_block_rejects_wrong_role_before_reporting_missing_lot
        grounds:
          - validations.priority_2
          - validations.priority_3
          - errors.ERR_ROLE_NOT_PERMITTED
          - errors.ERR_GLASS_LOT_NOT_FOUND
          - endpoints.POST_/optics/glass-lots/{id}/block
          - roles.OpticsEngineer
        distinguishing_aspect: |
          The same request violates the priority-2 RBAC rule and the priority-3 path-existence rule at
          once: blocking a non-existent lot id as OpticsEngineer must return ERR_ROLE_NOT_PERMITTED (403),
          never the 404, and repeating the identical request as ProcurementOfficer then surfaces
          ERR_GLASS_LOT_NOT_FOUND (404) — proving the 403 was the ordering decision and not a missing
          existence check.
        test_recipe:
          setup:
            - "One real RELEASED-path-irrelevant GlassLot exists so the store is non-empty; the id used by both trigger calls is the all-zero UUID, which no row holds."
            - "Logical clock untouched at 2026-08-01T00:00:00Z."
          setup_api_calls:
            - call: "POST /optics/glass-lots"
              payload: { lot_code: "GL-2540-1", glass_type: "N-BK7", melt_index_nd: 1.516800, total_blank_count: 20, declared_index_homogeneity_grade: "H2", declared_striae_grade: "A" }
              as: ProcurementOfficer
              captures: { g1: $.data.id }
          trigger:
            - call: "POST /optics/glass-lots/00000000-0000-0000-0000-000000000000/block"
              payload: { block_reason: "AUDIT_HOLD" }
              as: OpticsEngineer
              as_user_id: "oe-001"
            - call: "POST /optics/glass-lots/00000000-0000-0000-0000-000000000000/block"
              payload: { block_reason: "AUDIT_HOLD" }
              as: ProcurementOfficer
              as_user_id: "po-001"
          assert:
            - "the first trigger returns HTTP 403 with error_id ERR_ROLE_NOT_PERMITTED"
            - "the first trigger does NOT return ERR_GLASS_LOT_NOT_FOUND"
            - "the second trigger returns HTTP 404 with error_id ERR_GLASS_LOT_NOT_FOUND"
            - "GlassLot.${g1}.lot_status == QUARANTINED (untouched by both attempts)"
            - "GlassLot.${g1}.block_reason == null"

      - name: run_stage_order_outranks_instrument_window_conflict_on_process_run_create
        grounds:
          - validations.priority_14
          - validations.priority_19
          - errors.ERR_RUN_STAGE_OUT_OF_ORDER
          - errors.ERR_INSTRUMENT_WINDOW_CONFLICT
          - calculations.instrument_minutes_ledger
          - state_machines.WorkOrder.process_status
        distinguishing_aspect: |
          One create request breaks both the priority-14 stage gate (FIGURING requested from
          BLANKS_RESERVED) and the priority-19 purge-buffer rule (a 5-minute gap behind another active run
          on the same instrument); the response must be ERR_RUN_STAGE_OUT_OF_ORDER. Re-sending the
          identical window with the admissible POLISHING stage then surfaces
          ERR_INSTRUMENT_WINDOW_CONFLICT, and booked_minutes_total stays 120 through both rejections.
        test_recipe:
          setup:
            - "A RELEASED design, a certified 20-blank lot, two WorkOrders (WO-2540-1 and WO-2540-2) both in BLANKS_RESERVED, and one SCHEDULED 08:00-10:00 polishing run on WO-2540-2 that books 120 minutes on IF-2540-1."
            - "The requested window 10:05-11:05 leaves only a 5-minute gap, which is inside the 15-minute purge buffer."
            - "Logical clock untouched at 2026-08-01T00:00:00Z."
          setup_api_calls:
            - call: "POST /optics/optical-designs"
              payload: { design_code: "OD-2540-A", aperture_mm: 120.0, wavelength_min_nm: 450, wavelength_max_nm: 700, required_rms_wavefront_waves: 0.0400, tolerance_budget_waves: 0.0800, transmitted_wavefront_budget_waves: 0.1050 }
              as: OpticsEngineer
              captures: { d1: $.data.id }
            - call: "POST /optics/optical-designs/${d1}/tolerance-allocations"
              payload: { contributor_type: "SURFACE_IRREGULARITY", sensitivity_waves_per_unit: 1.5, manufacturing_tolerance_units: 0.0250 }
              as: OpticsEngineer
            - call: "POST /optics/optical-designs/${d1}/tolerance-analysis"
              payload: {}
              as: OpticsEngineer
            - call: "POST /optics/optical-designs/${d1}/release"
              payload: {}
              as: OpticsEngineer
            - call: "POST /optics/glass-lots"
              payload: { lot_code: "GL-2540-1", glass_type: "N-BK7", melt_index_nd: 1.516800, total_blank_count: 20, declared_index_homogeneity_grade: "H2", declared_striae_grade: "A" }
              as: ProcurementOfficer
              captures: { g1: $.data.id }
            - call: "POST /optics/glass-lots/${g1}/certification"
              payload: { measured_index_homogeneity_grade: "H3", measured_striae_grade: "B", certificate_reference: "CERT-2540-1" }
              as: ProcurementOfficer
              captures: { g1v: $.data.version }
            - call: "POST /optics/work-orders"
              payload: { wo_code: "WO-2540-1", design_id: "${d1}", glass_lot_id: "${g1}", element_count: 2, expected_glass_lot_version: "${g1v}" }
              as: ProcessTechnician
              captures: { w1: $.data.id }
            - call: "GET /optics/glass-lots/${g1}"
              payload: {}
              as: ProcurementOfficer
              captures: { g1v2: $.data.version }
            - call: "POST /optics/work-orders"
              payload: { wo_code: "WO-2540-2", design_id: "${d1}", glass_lot_id: "${g1}", element_count: 2, expected_glass_lot_version: "${g1v2}" }
              as: ProcessTechnician
              captures: { w2: $.data.id }
            - call: "POST /optics/metrology-instruments"
              payload: { instrument_code: "IF-2540-1", instrument_type: "PHASE_SHIFTING_INTERFEROMETER", base_uncertainty_waves: 0.0010, last_calibrated_utc: "2026-08-01T00:00:00Z", lateral_resolution_um: 5.0 }
              as: PlantAdmin
              captures: { i1: $.data.id }
            - call: "POST /optics/process-runs"
              payload: { work_order_id: "${w2}", metrology_instrument_id: "${i1}", run_stage: "POLISHING", metrology_window_start_utc: "2026-08-01T08:00:00Z", metrology_window_end_utc: "2026-08-01T10:00:00Z" }
              as: ProcessTechnician
              captures: { r1: $.data.id }
          trigger:
            - call: "POST /optics/process-runs"
              payload: { work_order_id: "${w1}", metrology_instrument_id: "${i1}", run_stage: "FIGURING", metrology_window_start_utc: "2026-08-01T10:05:00Z", metrology_window_end_utc: "2026-08-01T11:05:00Z" }
              as: ProcessTechnician
            - call: "POST /optics/process-runs"
              payload: { work_order_id: "${w1}", metrology_instrument_id: "${i1}", run_stage: "POLISHING", metrology_window_start_utc: "2026-08-01T10:05:00Z", metrology_window_end_utc: "2026-08-01T11:05:00Z" }
              as: ProcessTechnician
          assert:
            - "the first trigger returns HTTP 409 with error_id ERR_RUN_STAGE_OUT_OF_ORDER"
            - "the first trigger does NOT return ERR_INSTRUMENT_WINDOW_CONFLICT"
            - "the second trigger returns HTTP 409 with error_id ERR_INSTRUMENT_WINDOW_CONFLICT"
            - "MetrologyInstrument.${i1}.booked_minutes_total == 120 after both rejections"
            - "WorkOrder.${w1}.process_status == BLANKS_RESERVED"
            - "ProcessRun.${r1}.run_status == SCHEDULED"

      - name: segregation_of_duties_outranks_calibration_overdue_on_report_sign
        grounds:
          - validations.priority_12
          - validations.priority_16
          - errors.ERR_SEGREGATION_OF_DUTIES
          - errors.ERR_INSTRUMENT_CALIBRATION_OVERDUE
          - entities.MetrologyReport.fields.recorded_by_user_id
          - entities.MetrologyInstrument.fields.instrument_status
        distinguishing_aspect: |
          Signing a report on a 92-day-overdue instrument as the very technician who recorded it breaks
          the priority-12 segregation rule and the priority-16 calibration rule together; the response
          must be ERR_SEGREGATION_OF_DUTIES (403). Handing the signature to a second technician then
          surfaces ERR_INSTRUMENT_CALIBRATION_OVERDUE (409), and the report stays DRAFT/PENDING
          throughout.
        test_recipe:
          setup:
            - "A WorkOrder in POLISHING whose 08:00-10:00 run is AWAITING_METROLOGY with material_removed_nm 800.0, and a DRAFT MetrologyReport recorded by mt-001."
            - "IF-2540-1 has calibration_interval_days 90 and was last calibrated 2026-08-01T00:00:00Z; the clock is then moved to 2026-11-01T00:00:00Z, i.e. 92 days later, so the instrument is OVERDUE."
          setup_api_calls:
            - call: "POST /optics/optical-designs"
