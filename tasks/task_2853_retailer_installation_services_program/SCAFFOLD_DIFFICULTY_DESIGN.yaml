            - "A quality inspection recorded PASS_WITH_PUNCH with exactly one SAFETY defect, so fulfillment_status is PUNCH_OPEN, one PunchListItem sits in OPEN, a SYSTEM PUNCH_SAFETY event was appended and composite_score is 78.30 with rolling_event_count 2 — still ACTIVE."
