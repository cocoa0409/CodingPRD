          assert:
            - "rf_err == \"ERR_VALIDATION\""

      - name: patch_complaint_threshold_flips_reportability
        claim_type: conditional_validation
        grounds: [calculations.complaint_reportability, state_machines.CustomerComplaint]
        distinguishing_aspect: "Conditional recomputation in both directions: amending claimed damages across the 500000 boundary flips reportable and regulatory_status up and back down while RECEIVED."
        test_recipe:
          setup: ["Complaint OTHER at 400000 (NOT_REQUIRED)"]
          setup_api_calls:
            - call: "POST /branches"
              payload: { name: "PC Branch", region: "E" }
              as: FirmAdmin
              captures: { pc_br: $.data.id }
            - call: "POST /representatives"
              payload: { crd_number: "930005", full_name: "PC Rep", branch_id: "${pc_br}", hire_date: "2021-01-01" }
              as: FirmAdmin
              captures: { pc_rep: $.data.id }
            - call: "POST /complaints"
              payload: { rep_id: "${pc_rep}", allegation_type: "OTHER", damages_claimed_cents: "400000", received_date: "2026-08-01" }
              as: ComplianceAnalyst
              captures: { pc_c: $.data.id }
          trigger:
            - call: "PATCH /complaints/${pc_c}"
              payload: { damages_claimed_cents: "500000" }
              as: ComplianceAnalyst
              captures: { pc_up: $.data.regulatory_status }
            - call: "PATCH /complaints/${pc_c}"
              payload: { damages_claimed_cents: "499999" }
              as: ComplianceAnalyst
              captures: { pc_down: $.data.regulatory_status }
          assert:
            - "pc_up == \"REQUIRED\" (crossed to exactly the threshold: >=)"
            - "pc_down == \"NOT_REQUIRED\" (crossed back)"

      - name: pst_approve_without_comp_details_rejected
        claim_type: conditional_validation
        grounds: ["validations[priority=7]", "errors[ERR_PST_COMP_DETAILS_REQUIRED]"]
        distinguishing_aspect: "Conditional requirement: a compensated PST approval needs estimated_gross_comp_cents > 0; an uncompensated OBA approves fine without it."
        test_recipe:
          setup: ["Rep with compensated PST lacking the estimate, plus uncompensated OBA"]
          setup_api_calls:
            - call: "POST /branches"
              payload: { name: "PD Branch", region: "W" }
              as: FirmAdmin
              captures: { pd_br: $.data.id }
            - call: "POST /representatives"
              payload: { crd_number: "930006", full_name: "PD Rep", branch_id: "${pd_br}", hire_date: "2021-01-01" }
              as: FirmAdmin
              captures: { pd_rep: $.data.id }
            - call: "POST /outside-activities"
              payload: { activity_type: "PRIVATE_SECURITIES_TRANSACTION", description: "pst", compensation_expected: true, start_date: "2026-09-01" }
              as: RegisteredRep
              as_user_id: "${pd_rep}"
              captures: { pd_pst: $.data.id }
            - call: "POST /outside-activities"
              payload: { activity_type: "OUTSIDE_BUSINESS_ACTIVITY", description: "oba", compensation_expected: false, start_date: "2026-09-01" }
              as: RegisteredRep
              as_user_id: "${pd_rep}"
              captures: { pd_oba: $.data.id }
          trigger:
