  # =========================================================================
  # Rule 5 — Validation priority conflicts across different error-category pairs
  # =========================================================================
  - rule_id: priority_pair_validation_conflict
    instances:
      - name: state_beats_fiscal_lot_full_on_cancelled_showtime
        grounds:
          - validations[priority=6]
          - validations[priority=14]
        distinguishing_aspect: |
          Error-category pair state (priority 6, ERR_INVALID_STATE) vs business_fiscal (priority 14, ERR_LOT_FULL):
          reserving against a CANCELLED showtime that is also full must return ERR_INVALID_STATE, because the state
          precondition is checked before the capacity check.
        test_recipe:
          setup:
            - "A single-stall PER_CAR showtime that is full (its one stall reserved) AND then CANCELLED via weather."
          setup_api_calls:
            - call: "POST /venues"
              payload: { name: "V8", fm_channel_pool: ["93.1"] }
              as: PlatformAdmin
              captures: { venue_id: $.data.id }
            - call: "POST /lots"
              payload: { venue_id: "${venue_id}", name: "L", stall_count: 1, person_capacity: 100 }
              as: VenueOperator
              captures: { lot_id: $.data.id }
            - call: "POST /films"
              payload: { title: "F", runtime_minutes: 100, rating: "G" }
              as: VenueOperator
              captures: { f1: $.data.id }
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-06-01T00:00:00Z" }
              as: PlatformAdmin
            - call: "POST /showtimes"
              payload: { venue_id: "${venue_id}", lot_id: "${lot_id}", primary_film_id: "${f1}", is_double_feature: false, start_utc: "2026-06-24T02:00:00Z", pricing_mode: "PER_CAR", base_price_cents: 2000 }
              as: VenueOperator
              captures: { st_id: $.data.id, st_v: $.data.version }
            - call: "POST /reservations"
              payload: { showtime_id: "${st_id}", patron_id: "patron-h1", occupant_count: 2, expected_showtime_version: "${st_v}" }
              as: Patron
              as_user_id: "patron-h1"
              captures: { st_v2: $.data.version }
            - call: "POST /showtimes/${st_id}/weather-events"
              payload: { severity: "CANCELLATION", features_remaining: 1 }
              as: VenueOperator
              captures: { st_v3: $.data.version }
          trigger:
            - call: "POST /reservations"
              payload: { showtime_id: "${st_id}", patron_id: "patron-h2", occupant_count: 2, expected_showtime_version: "${st_v3}" }
              as: Patron
              as_user_id: "patron-h2"
              captures: { err: $.data.error_id }
          assert:
            - "trigger response status == 409"
            - "trigger response error_id == ERR_INVALID_STATE (state check wins over ERR_LOT_FULL)"

      - name: existence_beats_referential_pass_invalid
        grounds:
          - validations[priority=4]
          - validations[priority=11]
        distinguishing_aspect: |
          Error-category pair existence (priority 4, ERR_NOT_FOUND) vs business_referential (priority 11, ERR_PASS_INVALID):
          a reservation create naming a non-existent season_pass_id on a valid showtime must return ERR_NOT_FOUND,
          because existence is validated before the pass-validity (referential) rule.
        test_recipe:
          setup:
            - "A valid SCHEDULED showtime; no season pass with the supplied id exists."
          setup_api_calls:
            - call: "POST /venues"
              payload: { name: "V9", fm_channel_pool: ["93.3"] }
              as: PlatformAdmin
              captures: { venue_id: $.data.id }
            - call: "POST /lots"
              payload: { venue_id: "${venue_id}", name: "L", stall_count: 10, person_capacity: 100 }
              as: VenueOperator
              captures: { lot_id: $.data.id }
            - call: "POST /films"
              payload: { title: "F", runtime_minutes: 100, rating: "G" }
              as: VenueOperator
              captures: { f1: $.data.id }
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-06-01T00:00:00Z" }
              as: PlatformAdmin
            - call: "POST /showtimes"
              payload: { venue_id: "${venue_id}", lot_id: "${lot_id}", primary_film_id: "${f1}", is_double_feature: false, start_utc: "2026-06-26T02:00:00Z", pricing_mode: "PER_CAR", base_price_cents: 2000 }
              as: VenueOperator
              captures: { st_id: $.data.id, st_v: $.data.version }
          trigger:
            - call: "POST /reservations"
              payload: { showtime_id: "${st_id}", patron_id: "patron-iii", occupant_count: 2, season_pass_id: "00000000-0000-4000-8000-000000000000", expected_showtime_version: "${st_v}" }
              as: Patron
              as_user_id: "patron-iii"
              captures: { err: $.data.error_id }
          assert:
            - "trigger response status == 404"
            - "trigger response error_id == ERR_NOT_FOUND (existence check wins over ERR_PASS_INVALID)"

  # =========================================================================
  # Rule 6 — Boundary-precision checks on different metrics/endpoints
  # =========================================================================
  - rule_id: boundary_precision_check
    instances:
      - name: lot_full_exact_last_stall_boundary
        grounds:
          - validations[priority=14]
          - entities.Showtime.fields.reserved_stall_count
          - entities.Lot.fields.stall_count
        distinguishing_aspect: |
          Numeric capacity boundary on POST /reservations: with stall_count=1, the first PER_CAR reservation succeeds
          (reserved_stall_count 0->1, the last stall), and the second is rejected with ERR_LOT_FULL because
          reserved_stall_count(1) >= stall_count(1). The boundary sits at reserved_stall_count == stall_count.
        test_recipe:
          setup:
            - "A PER_CAR showtime on a 1-stall lot, no reservations yet."
          setup_api_calls:
            - call: "POST /venues"
              payload: { name: "V10", fm_channel_pool: ["94.1"] }
              as: PlatformAdmin
              captures: { venue_id: $.data.id }
            - call: "POST /lots"
              payload: { venue_id: "${venue_id}", name: "L", stall_count: 1, person_capacity: 100 }
              as: VenueOperator
              captures: { lot_id: $.data.id }
            - call: "POST /films"
              payload: { title: "F", runtime_minutes: 100, rating: "G" }
              as: VenueOperator
              captures: { f1: $.data.id }
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-06-01T00:00:00Z" }
              as: PlatformAdmin
            - call: "POST /showtimes"
              payload: { venue_id: "${venue_id}", lot_id: "${lot_id}", primary_film_id: "${f1}", is_double_feature: false, start_utc: "2026-06-28T02:00:00Z", pricing_mode: "PER_CAR", base_price_cents: 2000 }
              as: VenueOperator
              captures: { st_id: $.data.id, st_v: $.data.version }
            - call: "POST /reservations"
              payload: { showtime_id: "${st_id}", patron_id: "patron-j1", occupant_count: 2, expected_showtime_version: "${st_v}" }
              as: Patron
              as_user_id: "patron-j1"
              captures: { st_v2: $.data.version }
          trigger:
            - call: "POST /reservations"
              payload: { showtime_id: "${st_id}", patron_id: "patron-j2", occupant_count: 2, expected_showtime_version: "${st_v2}" }
              as: Patron
              as_user_id: "patron-j2"
              captures: { err: $.data.error_id }
          assert:
            - "Showtime.${st_id}.reserved_stall_count == 1 (first reservation took the last stall)"
            - "trigger response status == 409"
            - "trigger response error_id == ERR_LOT_FULL"

      - name: empty_concession_lines_rejected
        grounds:
          - validations[priority=5]
          - entities.ConcessionOrder.fields.lines
        distinguishing_aspect: |
          Empty-collection boundary on a DIFFERENT endpoint (POST /reservations/{id}/concession-orders): an order with
          an empty lines array (zero-count) is rejected with ERR_INVALID_REQUEST; this is a set-emptiness edge, distinct
          from the numeric capacity threshold above.
        test_recipe:
          setup:
            - "A reservation on a valid showtime."
          setup_api_calls:
            - call: "POST /venues"
              payload: { name: "V11", fm_channel_pool: ["94.3"] }
              as: PlatformAdmin
              captures: { venue_id: $.data.id }
            - call: "POST /lots"
              payload: { venue_id: "${venue_id}", name: "L", stall_count: 10, person_capacity: 100 }
              as: VenueOperator
              captures: { lot_id: $.data.id }
            - call: "POST /films"
              payload: { title: "F", runtime_minutes: 100, rating: "G" }
              as: VenueOperator
              captures: { f1: $.data.id }
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-06-01T00:00:00Z" }
              as: PlatformAdmin
            - call: "POST /showtimes"
              payload: { venue_id: "${venue_id}", lot_id: "${lot_id}", primary_film_id: "${f1}", is_double_feature: false, start_utc: "2026-06-29T02:00:00Z", pricing_mode: "PER_CAR", base_price_cents: 2000 }
              as: VenueOperator
              captures: { st_id: $.data.id, st_v: $.data.version }
            - call: "POST /reservations"
              payload: { showtime_id: "${st_id}", patron_id: "patron-kkk", occupant_count: 2, expected_showtime_version: "${st_v}" }
              as: Patron
              as_user_id: "patron-kkk"
              captures: { resv_id: $.data.id }
          trigger:
            - call: "POST /reservations/${resv_id}/concession-orders"
              payload: { lines: [] }
              as: Patron
              as_user_id: "patron-kkk"
              captures: { err: $.data.error_id }
          assert:
            - "trigger response status == 400"
            - "trigger response error_id == ERR_INVALID_REQUEST (empty lines array rejected)"

  # =========================================================================
  # Rule 7 — Cross-entity state dependencies across different entity pairs
  # =========================================================================
  - rule_id: cross_entity_state_dependency
    instances:
      - name: concession_fulfill_requires_reservation_scanned
        grounds:
          - state_machines.ConcessionOrder.PAID_to_FULFILLED
          - entities.Reservation.fields.occupancy_status
        distinguishing_aspect: |
          Entity pair ConcessionOrder -> Reservation: a PAID ConcessionOrder cannot transition to FULFILLED unless its
          parent Reservation.occupancy_status == SCANNED. With the reservation only CHECKED_IN (not SCANNED), fulfill
          returns ERR_INVALID_STATE.
        test_recipe:
          setup:
            - "A PAID concession order whose parent reservation is CHECKED_IN but NOT yet SCANNED; clock in the show window."
          setup_api_calls:
            - call: "POST /venues"
              payload: { name: "V12", fm_channel_pool: ["95.1"] }
              as: PlatformAdmin
              captures: { venue_id: $.data.id }
            - call: "POST /lots"
              payload: { venue_id: "${venue_id}", name: "L", stall_count: 10, person_capacity: 100 }
              as: VenueOperator
              captures: { lot_id: $.data.id }
            - call: "POST /films"
              payload: { title: "F", runtime_minutes: 100, rating: "G" }
              as: VenueOperator
              captures: { f1: $.data.id }
            - call: "POST /concession-items"
              payload: { venue_id: "${venue_id}", name: "Popcorn", unit_price_cents: 350, tax_rate: 0.0725, available: true }
              as: VenueOperator
              captures: { pop_id: $.data.id }
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-06-30T00:00:00Z" }
              as: PlatformAdmin
            - call: "POST /showtimes"
              payload: { venue_id: "${venue_id}", lot_id: "${lot_id}", primary_film_id: "${f1}", is_double_feature: false, start_utc: "2026-06-30T02:00:00Z", pricing_mode: "PER_CAR", base_price_cents: 2000 }
              as: VenueOperator
              captures: { st_id: $.data.id, st_v: $.data.version }
            - call: "POST /reservations"
              payload: { showtime_id: "${st_id}", patron_id: "patron-lll", occupant_count: 2, expected_showtime_version: "${st_v}" }
              as: Patron
              as_user_id: "patron-lll"
              captures: { resv_id: $.data.id }
            - call: "POST /reservations/${resv_id}/pay"
              payload: {}
              as: Patron
              as_user_id: "patron-lll"
            - call: "POST /reservations/${resv_id}/concession-orders"
              payload: { lines: [ { concession_item_id: "${pop_id}", qty: 1 } ] }
              as: Patron
              as_user_id: "patron-lll"
              captures: { order_id: $.data.id }
            - call: "POST /concession-orders/${order_id}/pay"
              payload: {}
              as: Patron
              as_user_id: "patron-lll"
            - call: "POST /reservations/${resv_id}/check-in"
              payload: {}
              as: GateAttendant
          trigger:
            - call: "POST /concession-orders/${order_id}/fulfill"
              payload: {}
              as: GateAttendant
              captures: { err: $.data.error_id }
          assert:
            - "Reservation.${resv_id}.occupancy_status == CHECKED_IN"
            - "trigger response status == 409"
            - "trigger response error_id == ERR_INVALID_STATE"

      - name: rental_approve_blocked_by_showtime_on_lot
        grounds:
          - state_machines.PrivateRental.REQUESTED_to_APPROVED
          - validations[priority=10]
          - entities.Showtime.fields.status
        distinguishing_aspect: |
          Entity pair PrivateRental -> Showtime (a DIFFERENT pair than ConcessionOrder->Reservation): a REQUESTED
          PrivateRental cannot move to APPROVED when a SCHEDULED Showtime on the same lot intersects the hold window;
          approve returns ERR_RENTAL_CONFLICT.
        test_recipe:
          setup:
            - "A SCHEDULED showtime occupying a lot on 2026-07-05 evening; a REQUESTED private rental of that lot overlapping the same window."
          setup_api_calls:
            - call: "POST /venues"
              payload: { name: "V13", fm_channel_pool: ["95.3"] }
              as: PlatformAdmin
              captures: { venue_id: $.data.id }
            - call: "POST /lots"
              payload: { venue_id: "${venue_id}", name: "L", stall_count: 10, person_capacity: 100 }
              as: VenueOperator
              captures: { lot_id: $.data.id }
            - call: "POST /films"
              payload: { title: "F", runtime_minutes: 120, rating: "PG" }
              as: VenueOperator
              captures: { f1: $.data.id }
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-06-01T00:00:00Z" }
              as: PlatformAdmin
            - call: "POST /showtimes"
              payload: { venue_id: "${venue_id}", lot_id: "${lot_id}", primary_film_id: "${f1}", is_double_feature: false, start_utc: "2026-07-05T02:00:00Z", pricing_mode: "PER_CAR", base_price_cents: 2000 }
              as: VenueOperator
              captures: { st_id: $.data.id }
            - call: "POST /private-rentals"
              payload: { venue_id: "${venue_id}", lot_id: "${lot_id}", organizer_id: "org-9", start_utc: "2026-07-05T02:30:00Z", end_utc: "2026-07-05T05:00:00Z", flat_venue_fee_cents: 100000, per_hour_cents: 10000 }
              as: VenueOperator
              captures: { rental_id: $.data.id, rental_v: $.data.version }
          trigger:
            - call: "POST /private-rentals/${rental_id}/approve"
              payload: { expected_private_rental_version: "${rental_v}" }
              as: VenueOperator
              captures: { err: $.data.error_id }
          assert:
            - "PrivateRental.${rental_id}.status == REQUESTED (approval rejected)"
            - "trigger response status == 409"
            - "trigger response error_id == ERR_RENTAL_CONFLICT"

  # =========================================================================
  # Rule 8 — Resource temporal-overlap conflicts across different interval semantics
  # =========================================================================
  - rule_id: resource_temporal_overlap
    instances:
      - name: showtime_overlap_half_open_plus_buffer
        grounds:
          - validations[priority=9]
          - entities.Showtime.fields.end_utc
          - entities.Venue.fields.turnaround_buffer_minutes
        distinguishing_aspect: |
          Half-open + buffer interval semantics on Lot showtime scheduling: a first showtime 02:00-04:00 (120m) plus a
          30m turnaround buffer blocks any second showtime starting before 04:30 on the same lot; a start of 04:29 is
          rejected with ERR_SHOWTIME_OVERLAP. The buffer is additive to the half-open end.
        test_recipe:
          setup:
            - "A lot with a SCHEDULED showtime 02:00-04:00 (single 120m feature), venue turnaround_buffer_minutes=30."
          setup_api_calls:
            - call: "POST /venues"
              payload: { name: "V14", fm_channel_pool: ["96.1"], turnaround_buffer_minutes: 30 }
              as: PlatformAdmin
              captures: { venue_id: $.data.id }
            - call: "POST /lots"
              payload: { venue_id: "${venue_id}", name: "L", stall_count: 10, person_capacity: 100 }
              as: VenueOperator
              captures: { lot_id: $.data.id }
            - call: "POST /films"
              payload: { title: "F", runtime_minutes: 120, rating: "PG" }
              as: VenueOperator
              captures: { f1: $.data.id }
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-06-01T00:00:00Z" }
              as: PlatformAdmin
            - call: "POST /showtimes"
              payload: { venue_id: "${venue_id}", lot_id: "${lot_id}", primary_film_id: "${f1}", is_double_feature: false, start_utc: "2026-07-10T02:00:00Z", pricing_mode: "PER_CAR", base_price_cents: 2000 }
              as: VenueOperator
              captures: { st1_id: $.data.id }
          trigger:
            - call: "POST /showtimes"
              payload: { venue_id: "${venue_id}", lot_id: "${lot_id}", primary_film_id: "${f1}", is_double_feature: false, start_utc: "2026-07-10T04:29:00Z", pricing_mode: "PER_CAR", base_price_cents: 2000 }
              as: VenueOperator
              captures: { err: $.data.error_id }
          assert:
            - "trigger response status == 409"
            - "trigger response error_id == ERR_SHOWTIME_OVERLAP (04:29 < 04:00 end + 30m buffer)"

      - name: rental_overlap_closed_whole_lot
        grounds:
          - validations[priority=10]
          - entities.PrivateRental.fields.start_utc
          - entities.PrivateRental.fields.end_utc
        distinguishing_aspect: |
          Closed, whole-lot exclusive interval semantics on PrivateRental (a DIFFERENT resource and a DIFFERENT geometry
          than showtime half-open+buffer): an APPROVED rental 02:00-06:00 closed-interval blocks approval of a second
          rental 06:00-08:00 on the same lot because the shared endpoint 06:00 collides (closed interval includes both
          endpoints; no buffer applies). approve returns ERR_RENTAL_CONFLICT.
        test_recipe:
          setup:
            - "A lot with one APPROVED private rental 02:00-06:00, and a second REQUESTED rental 06:00-08:00 on the same lot."
          setup_api_calls:
            - call: "POST /venues"
              payload: { name: "V15", fm_channel_pool: ["96.3"] }
              as: PlatformAdmin
              captures: { venue_id: $.data.id }
            - call: "POST /lots"
              payload: { venue_id: "${venue_id}", name: "L", stall_count: 10, person_capacity: 100 }
              as: VenueOperator
              captures: { lot_id: $.data.id }
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-06-01T00:00:00Z" }
              as: PlatformAdmin
            - call: "POST /private-rentals"
              payload: { venue_id: "${venue_id}", lot_id: "${lot_id}", organizer_id: "org-a", start_utc: "2026-07-12T02:00:00Z", end_utc: "2026-07-12T06:00:00Z", flat_venue_fee_cents: 100000, per_hour_cents: 10000 }
              as: VenueOperator
              captures: { r1_id: $.data.id, r1_v: $.data.version }
            - call: "POST /private-rentals/${r1_id}/approve"
              payload: { expected_private_rental_version: "${r1_v}" }
              as: VenueOperator
            - call: "POST /private-rentals"
              payload: { venue_id: "${venue_id}", lot_id: "${lot_id}", organizer_id: "org-b", start_utc: "2026-07-12T06:00:00Z", end_utc: "2026-07-12T08:00:00Z", flat_venue_fee_cents: 100000, per_hour_cents: 10000 }
              as: VenueOperator
              captures: { r2_id: $.data.id, r2_v: $.data.version }
          trigger:
            - call: "POST /private-rentals/${r2_id}/approve"
              payload: { expected_private_rental_version: "${r2_v}" }
              as: VenueOperator
              captures: { err: $.data.error_id }
          assert:
            - "PrivateRental.${r2_id}.status == REQUESTED (approval rejected)"
            - "trigger response status == 409"
            - "trigger response error_id == ERR_RENTAL_CONFLICT (closed interval shares endpoint 06:00)"

  # =========================================================================
  # Rule 9 — Compensating-action invariants across different conserved quantities
  # =========================================================================
  - rule_id: compensating_invariant
    instances:
      - name: stall_capacity_conserved_create_then_cancel
        grounds:
          - state_machines.Reservation.CONFIRMED_to_CANCELLED
          - entities.Showtime.fields.reserved_stall_count
          - entities.Lot.fields.stall_count
        distinguishing_aspect: |
          Conserved quantity = lot free stalls (lot.stall_count - showtime.reserved_stall_count). Creating a PER_CAR
          reservation debits reserved_stall_count by 1 and cancelling it credits exactly 1 back: reserved_stall_count
          returns to 0 after create+cancel, leaving free stalls unchanged at stall_count.
        test_recipe:
          setup:
            - "A PER_CAR showtime on a 5-stall lot, no reservations yet (reserved_stall_count=0)."
          setup_api_calls:
            - call: "POST /venues"
              payload: { name: "V16", fm_channel_pool: ["97.1"] }
              as: PlatformAdmin
              captures: { venue_id: $.data.id }
            - call: "POST /lots"
              payload: { venue_id: "${venue_id}", name: "L", stall_count: 5, person_capacity: 100 }
              as: VenueOperator
              captures: { lot_id: $.data.id }
            - call: "POST /films"
              payload: { title: "F", runtime_minutes: 100, rating: "G" }
              as: VenueOperator
              captures: { f1: $.data.id }
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-06-01T00:00:00Z" }
              as: PlatformAdmin
            - call: "POST /showtimes"
              payload: { venue_id: "${venue_id}", lot_id: "${lot_id}", primary_film_id: "${f1}", is_double_feature: false, start_utc: "2026-07-14T02:00:00Z", pricing_mode: "PER_CAR", base_price_cents: 2000 }
              as: VenueOperator
              captures: { st_id: $.data.id, st_v: $.data.version }
            - call: "POST /reservations"
              payload: { showtime_id: "${st_id}", patron_id: "patron-mmm", occupant_count: 2, expected_showtime_version: "${st_v}" }
              as: Patron
              as_user_id: "patron-mmm"
              captures: { resv_id: $.data.id, resv_v: $.data.version }
          trigger:
            - call: "POST /reservations/${resv_id}/cancel"
              payload: { expected_reservation_version: "${resv_v}" }
              as: Patron
              as_user_id: "patron-mmm"
          assert:
            - "Showtime.${st_id}.reserved_stall_count == 0 (debited to 1 on create, credited back to 0 on cancel)"
            - "Reservation.${resv_id}.occupancy_status == CANCELLED"

      - name: season_pass_redemptions_conserved_create_then_cancel
        grounds:
          - state_machines.Reservation.CONFIRMED_to_CANCELLED
          - entities.SeasonPass.fields.redemptions_used
          - entities.SeasonPass.fields.max_redemptions
        distinguishing_aspect: |
          Conserved quantity = season-pass remaining redemptions (max_redemptions - redemptions_used), a DIFFERENT
          quantity than lot stalls. Creating a pass reservation increments redemptions_used 0->1; cancelling it
          decrements 1->0, so redemptions_used returns to 0 and remaining is unchanged after create+cancel.
        test_recipe:
          setup:
            - "An ACTIVE GOLD season pass (max_redemptions=3, redemptions_used=0) valid over July 2026; a single-feature showtime within the window."
          setup_api_calls:
            - call: "POST /venues"
              payload: { name: "V17", fm_channel_pool: ["97.3"] }
              as: PlatformAdmin
              captures: { venue_id: $.data.id }
            - call: "POST /lots"
              payload: { venue_id: "${venue_id}", name: "L", stall_count: 10, person_capacity: 100 }
              as: VenueOperator
              captures: { lot_id: $.data.id }
            - call: "POST /films"
              payload: { title: "F", runtime_minutes: 100, rating: "G" }
              as: VenueOperator
              captures: { f1: $.data.id }
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-06-01T00:00:00Z" }
              as: PlatformAdmin
            - call: "POST /season-passes"
              payload: { patron_id: "patron-nnn", tier: "GOLD", max_redemptions: 3, valid_from_utc: "2026-07-01T00:00:00Z", valid_to_utc: "2026-07-31T23:59:59Z" }
              as: VenueOperator
              captures: { pass_id: $.data.id }
            - call: "POST /showtimes"
              payload: { venue_id: "${venue_id}", lot_id: "${lot_id}", primary_film_id: "${f1}", is_double_feature: false, start_utc: "2026-07-15T02:00:00Z", pricing_mode: "PER_CAR", base_price_cents: 2000 }
              as: VenueOperator
              captures: { st_id: $.data.id, st_v: $.data.version }
            - call: "POST /reservations"
              payload: { showtime_id: "${st_id}", patron_id: "patron-nnn", occupant_count: 2, season_pass_id: "${pass_id}", expected_showtime_version: "${st_v}" }
              as: Patron
              as_user_id: "patron-nnn"
              captures: { resv_id: $.data.id, resv_v: $.data.version }
          trigger:
            - call: "POST /reservations/${resv_id}/cancel"
              payload: { expected_reservation_version: "${resv_v}" }
              as: Patron
              as_user_id: "patron-nnn"
          assert:
            - "SeasonPass.${pass_id}.redemptions_used == 0 (incremented to 1 on create, restored to 0 on cancel)"
            - "Reservation.${resv_id}.occupancy_status == CANCELLED"
            - "Reservation.${resv_id}.amount_due_cents == 0 (single feature, pass covers admission)"
