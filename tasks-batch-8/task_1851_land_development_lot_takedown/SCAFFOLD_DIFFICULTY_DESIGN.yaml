              as: DeveloperOperator
            - call: "POST /api/phases/${ph16}/review-plat"
              payload: { decision: "APPROVE" }
              as: MunicipalClerk
            - call: "POST /api/phases/${ph16}/record-plat"
              payload: {}
              as: MunicipalClerk
            - call: "POST /api/infrastructure-bonds"
