              payload: { material_type: "PLASTIC", unit_weight_grams: 15.00, recyclability_class: "LIMITED", pcr_content_pct: 10, is_reusable: false }
              as: ProducerComplianceOfficer
              as_user_id: "${p_t_id}"
            - call: "POST /epr/skus/${sku_t_id}/activate"
              payload: {}
              as: ProducerComplianceOfficer
              as_user_id: "${p_t_id}"
            - call: "POST /epr/producers/${p_t_id}/determine-obligation"
              payload: {}
              as: ProgramRegulator
            - call: "POST /epr/registrations"
              payload: { producer_id: "${p_t_id}", state_program_id: "${sp_t_id}" }
              as: ProducerComplianceOfficer
              as_user_id: "${p_t_id}"
              captures: { reg_t_id: $.data.id }
          trigger:
            - call: "POST /epr/_clock/set_current_utc"
              payload: { current_utc: "2027-01-01T00:00:00Z" }
              as: ProgramRegulator
            - call: "POST /epr/registrations/${reg_t_id}/submit"
              payload: {}
              as: ProducerComplianceOfficer
              as_user_id: "${p_t_id}"
              captures: { e_dl: $.data.error_id }
            - call: "POST /epr/_clock/set_current_utc"
              payload: { current_utc: "2026-12-31T23:59:59Z" }
              as: ProgramRegulator
            - call: "POST /epr/registrations/${reg_t_id}/submit"
              payload: {}
              as: ProducerComplianceOfficer
              as_user_id: "${p_t_id}"
          assert:
            - "First submit: HTTP 422 with error_id == ERR_REGISTRATION_DEADLINE_PASSED and Registration.${reg_t_id}.status stays DRAFT with submitted_at == null"
            - "Second submit: HTTP 200 with Registration.${reg_t_id}.status == SUBMITTED and submitted_at == 2026-12-31T23:59:59Z"
            - "Registration.${reg_t_id}.exemption_status == OBLIGATED with assessed_group_revenue_usd == 5000000 and assessed_group_weight_kg == 1.200"
            - "Registration.${reg_t_id}.exemption_basis_applied == ENTITY_LEVEL and compliance_posture == UNDETERMINED (the registration is not yet ACTIVE)"
            - "Producer.${p_t_id}.obligated_party_role == BRAND_OWNER and determination_stale == false"

      - name: membership_create_on_an_unpublished_schedule_is_refused
        claim_type: violation_to_error
        grounds:
          - validations.priority_9.check
          - errors.ERR_FEE_SCHEDULE_NOT_PUBLISHED
        excluded_because:
          difficulty_instance: cross_entity_state_dependency / membership_create_blocked_by_draft_fee_schedule
          rationale: "That instance applies for membership against a DRAFT schedule and then against the published one on identical data."

      - name: overlapping_reporting_periods_are_refused
        claim_type: violation_to_error
        grounds:
          - validations.priority_31.check
          - errors.ERR_PERIOD_WINDOW_OVERLAP
        excluded_because:
          difficulty_instance: resource_temporal_overlap / reporting_period_half_open_windows_allow_touching
          rationale: "That instance walks touching, overlapping and disjoint period windows and asserts ERR_PERIOD_WINDOW_OVERLAP only on the true overlap."

      - name: overlapping_fee_schedule_windows_are_refused
        claim_type: violation_to_error
        grounds:
          - validations.priority_32.check
          - errors.ERR_FEE_SCHEDULE_EFFECTIVE_OVERLAP
        excluded_because:
          difficulty_instance: resource_temporal_overlap / fee_schedule_closed_windows_forbid_touching_and_open_ended_blocks_later
          rationale: "That instance covers touching windows and the open-ended window that blocks every later one."

      - name: submitting_a_report_with_no_lines_is_refused
        claim_type: violation_to_error
        grounds:
          - validations.priority_37.check
          - errors.ERR_REPORT_HAS_NO_LINES
        excluded_because:
          difficulty_instance: boundary_precision_check / zero_quantity_and_empty_line_set_boundary_on_submit
          rationale: "That instance separates the empty line set from a single zero-quantity line, which is the sharpest form of this claim."

      - name: an_exempt_registration_cannot_file_reports
        claim_type: violation_to_error
        grounds:
          - validations.priority_17.check
          - errors.ERR_EXEMPT_REGISTRATION_CANNOT_REPORT
        excluded_because:
          difficulty_instance: boundary_precision_check / group_revenue_exactly_at_small_producer_threshold
          rationale: "That instance produces an EXEMPT_SMALL_PRODUCER registration at the threshold boundary and then attempts a report against it."

      - name: voiding_a_non_issued_invoice_is_refused
        claim_type: violation_to_error
        grounds:
          - validations.priority_52.check
          - errors.ERR_INVOICE_NOT_ISSUED
        excluded_because:
          difficulty_instance: compensating_invariant / invoice_issue_void_reissue_restores_fee_balance_exactly
          rationale: "That instance voids an ISSUED invoice, retries the void on the VOID row and asserts ERR_INVOICE_NOT_ISSUED plus the restored balance."

  - section: rbac
    instances:
      - name: each_role_can_perform_its_own_exclusive_operations
        claim_type: exclusive_operations
        grounds:
          - roles.ProgramRegulator.exclusive_operations
          - roles.ProducerComplianceOfficer.exclusive_operations
          - roles.ProAdministrator.exclusive_operations
          - roles.IndependentVerifier.exclusive_operations
        distinguishing_aspect: "One call from each of the four roles' exclusive lists succeeds in sequence on the same fixture — period creation, report creation, FINAL assessment and engagement start — so the allow-lists are complete, not merely restrictive."
