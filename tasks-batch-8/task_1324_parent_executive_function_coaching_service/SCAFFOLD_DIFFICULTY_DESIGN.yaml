          - errors[ERR_PLAN_NOT_ACTIVE]
          - errors[ERR_NO_CREDITS_AVAILABLE]
        distinguishing_aspect: |
          Category pair state vs business_fiscal: the request violates both
          ERR_PLAN_NOT_ACTIVE (priority 10, plan TERMINATED) and
          ERR_NO_CREDITS_AVAILABLE (priority 23, remaining 1 - reserved 1 = 0);
          the state error MUST win because state precedes fiscal.
        test_recipe:
          setup:
            - "Family with two clients, both with ACTIVE plans (coach CERTIFIED, caseload 2 < 20, no deficit)"
            - "1-credit INDIVIDUAL package fully reserved by a session on plan 1"
