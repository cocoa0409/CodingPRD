            - { call: "POST /prescriptions/${rxB}/compound-orders", payload: { is_refill: false, expected_prescription_version: "${rxvB}" }, as: PharmacyTech, captures: { ordB: $.data.id } }
            - { call: "POST /compound-orders/${ordB}/allocate", payload: {}, as: PharmacyTech }
            - { call: "POST /prescriptions/${rxC}/compound-orders", payload: { is_refill: false, expected_prescription_version: "${rxvC}" }, as: PharmacyTech, captures: { ordC: $.data.id } }
            - { call: "POST /compound-orders/${ordC}/allocate", payload: {}, as: PharmacyTech }
          trigger:
            - { call: "POST /compound-orders/${ordA}/start-compounding", payload: { bench_id: "${bench}", start_at: "2026-05-01T09:00:00Z", end_at: "2026-05-01T10:00:00Z" }, as: Pharmacist, as_user_id: "pharm-a" }
