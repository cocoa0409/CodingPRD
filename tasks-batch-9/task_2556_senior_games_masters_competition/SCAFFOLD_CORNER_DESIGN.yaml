          rationale: "Night-by-night rather than merged-window capacity evaluation, and the running reserved_bed_nights total, are asserted there."

      - name: corner_calculation_threshold_minimum_eligible_age
        claim_type: threshold
        grounds:
          - calculations.athlete_age_group_assignment
          - calculations.athlete_age_group_assignment.constants.MIN_ELIGIBLE_AGE
          - validations[priority=92]
        excluded_because:
          difficulty_instance: minimum_eligible_age_boundary_fifty_admitted_forty_nine_rejected
          rationale: "The threshold walk at MIN_ELIGIBLE_AGE (50 admitted, 49 rejected with ERR_ATHLETE_UNDER_MINIMUM_AGE) is the whole subject of that §1.8 instance."

