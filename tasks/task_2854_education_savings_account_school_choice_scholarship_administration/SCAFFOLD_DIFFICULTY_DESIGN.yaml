            - "MisuseCase.${mc1_id}.status == SUBSTANTIATED"
            - "hop 1: Account.${acct1_id}.status == SUSPENDED and suspension_reason == MISUSE_SUBSTANTIATED"
            - "hop 2: PurchaseRequest.${pr1_id}.approval_status == VOID and settlement_status == CANCELLED"
            - "hop 2: PurchaseRequest.${pr2_id}.approval_status == VOID and settlement_status == CANCELLED"
            - "hop 3: Account.${acct1_id}.encumbered_cents == 0"
            - "hop 4: Account.${acct1_id}.balance_cents == 229088"
            - "Account.${acct1_id}.lifetime_spent_cents == 0 and lifetime_clawed_back_cents == 0 (no money left the account)"

      - name: provider_delisting_voids_that_providers_requests_only
        grounds:
