            - "after the trigger: parts_ordered_gross_cents == 20000 (append-only, unchanged), parts_committed_cents == 0, parts_return_credit_cents == 16000, parts_restocking_loss_cents == 4000"
            - "the identity holds exactly: 0 + 16000 + 4000 == 20000"
            - "PartsLine.${pl_id}.procurement_status == RETURNED, returned_qty == 2, restocking_fee_cents == 4000, extended_price_cents == 0"
