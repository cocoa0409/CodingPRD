# =============================================================================
# §1.8 Scaffold Difficulty Design (Test Targeting Index) — earned-wage-access
# Nine §0.5 Difficulty Rules, >= 2 instances each (18 instances total).
# Every grounds[] resolves into SCAFFOLD.yaml §1.1-§1.7; every setup_api_calls
# chain is executable from empty-DB using only §1.5 endpoints.
#
# Shared literals used across instances:
#   clock base        : 2026-06-01T00:00:00Z
#   employer defaults : funding_balance_cents=100000, max_advance_pct_of_available=0.50,
#                       per_period_advance_cap_count=3, cooling_off_hours=24
#   STANDARD policy   : min_tenure_days=90, per_advance_floor_cents=1000,
#                       per_advance_ceiling_cents=50000, cumulative_period_ceiling_cents=80000
#   fee schedule      : expedite_flat_fee_cents=199, expedite_pct_fee=0.02,
#                       max_total_fee_cents=1500, tip_allowed=true
#   period            : 2026-06-01T00:00:00Z .. 2026-06-08T00:00:00Z
#   worker hire_date  : 2025-06-01T00:00:00Z  => tenure 365d => STANDARD tier
# =============================================================================
scaffold_difficulty_design:

  # ===========================================================================
  - rule_id: dual_variant_calc
    instances:
      - name: available_earnings_sum_then_round_on_worker
        grounds:
          - calculations.available_earnings
          - entities.Worker.fields.net_available_earnings_cents
          - entities.TimeEntry.fields.gross_earned_cents
        distinguishing_aspect: |
          On the Worker domain gross is rounded ONCE after summing hours*rate
          (sum-then-round => net_available 3502); summing the per-entry rounded
          display field gross_earned_cents would give 3501 — a 1-cent divergence
          the pinned variant resolves to 3502.
        test_recipe:
          setup:
            - "Employer, STANDARD policy, OPEN period; worker hourly_rate_cents=2001, hired 2025-06-01 (STANDARD)."
            - "Two POSTED shifts of 0.25h and 3.25h: per-entry gross 500 and 6503 (sum 7003); sum-then-round gross = round(0.25*2001 + 3.25*2001) = round(7003.5) = 7004; accessible = floor(7004*0.5) = 3502."
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-06-01T00:00:00Z" }
              as: PlatformAdmin
            - call: "POST /employers"
              payload: { legal_name: "Acme", state_code: "CA", pay_frequency: "WEEKLY", funding_balance_cents: 100000, max_advance_pct_of_available: 0.50, per_period_advance_cap_count: 3, cooling_off_hours: 24 }
              as: PlatformAdmin
              captures: { emp_id: $.data.id }
            - call: "POST /advance-policies"
              payload: { employer_id: "${emp_id}", tier: "STANDARD", min_tenure_days: 90, per_advance_floor_cents: 1000, per_advance_ceiling_cents: 50000, cumulative_period_ceiling_cents: 80000 }
              as: PlatformAdmin
            - call: "POST /pay-periods"
              payload: { employer_id: "${emp_id}", start_at: "2026-06-01T00:00:00Z", end_at: "2026-06-08T00:00:00Z" }
              as: PayrollOfficer
              captures: { pp_id: $.data.id }
            - call: "POST /workers"
              payload: { employer_id: "${emp_id}", external_payroll_ref: "EMP-1", full_name: "Wanda", hourly_rate_cents: 2001, hire_date: "2025-06-01T00:00:00Z" }
              as: PayrollOfficer
              captures: { w_id: $.data.id }
            - call: "POST /time-entries"
              payload: { pay_period_id: "${pp_id}", worker_id: "${w_id}", shift_start_at: "2026-06-02T08:00:00Z", shift_end_at: "2026-06-02T08:15:00Z", hours_worked: 0.25 }
              as: PayrollOfficer
            - call: "POST /time-entries"
              payload: { pay_period_id: "${pp_id}", worker_id: "${w_id}", shift_start_at: "2026-06-02T10:00:00Z", shift_end_at: "2026-06-02T13:15:00Z", hours_worked: 3.25 }
              as: PayrollOfficer
          trigger:
            - call: "GET /workers/${w_id}"
              payload: {}
              as: PayrollOfficer
              captures: { net_avail: $.data.net_available_earnings_cents }
          assert:
            - "Worker.${w_id}.net_available_earnings_cents == 3502"
            - "PayPeriod.${pp_id}.gross_accrued_cents == 7004"

      - name: reconciliation_writeoff_vs_manual_recoup_on_statement
        grounds:
          - calculations.reconciliation
          - entities.ReconciliationStatement.fields.drift_cents
          - entities.ReconciliationStatement.fields.written_off_cents
          - state_machines.Advance.DEFAULTED_to_WRITTEN_OFF
        distinguishing_aspect: |
          On the ReconciliationStatement domain a write-off clears drift by
          SUBTRACTING from expected (written_off_cents=319 => drift 0), whereas a
          manual-recoup would clear the same drift by ADDING to actual_recouped —
          two different ledger columns reach outcome CLEAN, a distinct entity
          domain from the Worker available_earnings dual-variant.
        test_recipe:
          setup:
            - "Period run to payday with one INSTANT advance whose 319 fee remainder could not be recouped under the 0.50 cap, leaving it DEFAULTED with 319 outstanding and statement drift 319 (DISCREPANCY)."
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-06-01T00:00:00Z" }
              as: PlatformAdmin
            - call: "POST /employers"
              payload: { legal_name: "Acme", state_code: "CA", pay_frequency: "WEEKLY", funding_balance_cents: 100000, max_advance_pct_of_available: 0.50, per_period_advance_cap_count: 3, cooling_off_hours: 24 }
              as: PlatformAdmin
              captures: { emp_id: $.data.id }
            - call: "POST /advance-policies"
              payload: { employer_id: "${emp_id}", tier: "STANDARD", min_tenure_days: 90, per_advance_floor_cents: 1000, per_advance_ceiling_cents: 50000, cumulative_period_ceiling_cents: 80000 }
              as: PlatformAdmin
            - call: "POST /fee-schedules"
              payload: { employer_id: "${emp_id}", expedite_flat_fee_cents: 199, expedite_pct_fee: 0.02, max_total_fee_cents: 1500, tip_allowed: true }
              as: PlatformAdmin
            - call: "POST /pay-periods"
              payload: { employer_id: "${emp_id}", start_at: "2026-06-01T00:00:00Z", end_at: "2026-06-08T00:00:00Z" }
              as: PayrollOfficer
              captures: { pp_id: $.data.id }
            - call: "POST /workers"
              payload: { employer_id: "${emp_id}", external_payroll_ref: "EMP-1", full_name: "Wanda", hourly_rate_cents: 2000, hire_date: "2025-06-01T00:00:00Z" }
              as: PayrollOfficer
              captures: { w_id: $.data.id }
            - call: "POST /time-entries"
              payload: { pay_period_id: "${pp_id}", worker_id: "${w_id}", shift_start_at: "2026-06-02T08:00:00Z", shift_end_at: "2026-06-02T14:00:00Z", hours_worked: 6.0 }
              as: PayrollOfficer
            - call: "GET /workers/${w_id}"
              payload: {}
              as: PayrollOfficer
              captures: { w_v: $.data.version }
            - call: "POST /advances"
              payload: { worker_id: "${w_id}", pay_period_id: "${pp_id}", requested_principal_cents: 6000, disbursement_speed: "INSTANT", tip_cents: 0, expected_worker_version: "${w_v}" }
              as: PayrollOfficer
              captures: { adv_id: $.data.id }
            - call: "POST /advances/${adv_id}/approve"
              payload: {}
              as: PayrollOfficer
            - call: "POST /advances/${adv_id}/disburse"
              payload: {}
              as: PayrollOfficer
            - call: "POST /pay-periods/${pp_id}/lock"
              payload: {}
              as: PayrollOfficer
            - call: "POST /repayment-batches"
              payload: { pay_period_id: "${pp_id}" }
              as: PayrollOfficer
              captures: { batch_id: $.data.id }
            - call: "GET /repayment-batches/${batch_id}"
              payload: {}
              as: PayrollOfficer
              captures: { b_v: $.data.version }
            - call: "POST /repayment-batches/${batch_id}/post"
              payload: { expected_repaymentbatch_version: "${b_v}" }
              as: PayrollOfficer
              as_user_id: "officer-poster"
            - call: "POST /pay-periods/${pp_id}/run-payday"
              payload: {}
              as: PayrollOfficer
            - call: "POST /reconciliation-statements"
              payload: { pay_period_id: "${pp_id}" }
              as: ComplianceOfficer
              captures: { stmt_id: $.data.id, drift_before: $.data.drift_cents }
          trigger:
            - call: "POST /advances/${adv_id}/write-off"
              payload: {}
              as: ComplianceOfficer
              as_user_id: "compliance-signer"
            - call: "POST /reconciliation-statements"
              payload: { pay_period_id: "${pp_id}" }
              as: ComplianceOfficer
              captures: { drift_after: $.data.drift_cents, wo_after: $.data.written_off_cents, outcome_after: $.data.outcome }
          assert:
            - "ReconciliationStatement.${stmt_id}.drift_cents == 319 before write-off (drift_before captured == 319, outcome DISCREPANCY)"
            - "ReconciliationStatement.${stmt_id}.written_off_cents == 319 after write-off"
            - "ReconciliationStatement.${stmt_id}.drift_cents == 0 after write-off"
            - "ReconciliationStatement.${stmt_id}.outcome == CLEAN after write-off"

  # ===========================================================================
  - rule_id: combinatorial_formula
    instances:
      - name: principal_clamp_four_way_min_mode_a
        grounds:
          - calculations.principal_clamp
          - entities.Advance.fields.principal_cents
          - entities.AdvanceLimitPolicy.fields.cumulative_period_ceiling_cents
          - state_machines.Advance.REQUESTED_to_APPROVED
        distinguishing_aspect: |
          Mode (a): a >=3-input non-linear min() over four ceilings
          (requested 45000, per_advance_ceiling 50000, cumulative-room 80000,
          available-earnings 40000); the binding ceiling is available-earnings so
          principal_cents == 40000, not the requested 45000.
        test_recipe:
          setup:
            - "Worker rate 2000, 40h of shifts => gross 80000, accessible 40000; no prior advances => available 40000."
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-06-01T00:00:00Z" }
              as: PlatformAdmin
            - call: "POST /employers"
              payload: { legal_name: "Acme", state_code: "CA", pay_frequency: "WEEKLY", funding_balance_cents: 100000, max_advance_pct_of_available: 0.50, per_period_advance_cap_count: 3, cooling_off_hours: 24 }
              as: PlatformAdmin
              captures: { emp_id: $.data.id }
            - call: "POST /advance-policies"
              payload: { employer_id: "${emp_id}", tier: "STANDARD", min_tenure_days: 90, per_advance_floor_cents: 1000, per_advance_ceiling_cents: 50000, cumulative_period_ceiling_cents: 80000 }
              as: PlatformAdmin
            - call: "POST /fee-schedules"
              payload: { employer_id: "${emp_id}", expedite_flat_fee_cents: 199, expedite_pct_fee: 0.02, max_total_fee_cents: 1500, tip_allowed: true }
              as: PlatformAdmin
            - call: "POST /pay-periods"
              payload: { employer_id: "${emp_id}", start_at: "2026-06-01T00:00:00Z", end_at: "2026-06-08T00:00:00Z" }
              as: PayrollOfficer
              captures: { pp_id: $.data.id }
            - call: "POST /workers"
              payload: { employer_id: "${emp_id}", external_payroll_ref: "EMP-1", full_name: "Wanda", hourly_rate_cents: 2000, hire_date: "2025-06-01T00:00:00Z" }
              as: PayrollOfficer
              captures: { w_id: $.data.id }
            - call: "POST /time-entries"
              payload: { pay_period_id: "${pp_id}", worker_id: "${w_id}", shift_start_at: "2026-06-02T08:00:00Z", shift_end_at: "2026-06-03T00:00:00Z", hours_worked: 16.0 }
              as: PayrollOfficer
            - call: "POST /time-entries"
              payload: { pay_period_id: "${pp_id}", worker_id: "${w_id}", shift_start_at: "2026-06-03T08:00:00Z", shift_end_at: "2026-06-04T00:00:00Z", hours_worked: 16.0 }
              as: PayrollOfficer
            - call: "POST /time-entries"
              payload: { pay_period_id: "${pp_id}", worker_id: "${w_id}", shift_start_at: "2026-06-04T08:00:00Z", shift_end_at: "2026-06-04T16:00:00Z", hours_worked: 8.0 }
              as: PayrollOfficer
            - call: "GET /workers/${w_id}"
              payload: {}
              as: PayrollOfficer
              captures: { w_v: $.data.version }
            - call: "POST /advances"
              payload: { worker_id: "${w_id}", pay_period_id: "${pp_id}", requested_principal_cents: 45000, disbursement_speed: "STANDARD", tip_cents: 0, expected_worker_version: "${w_v}" }
              as: PayrollOfficer
              captures: { adv_id: $.data.id }
          trigger:
            - call: "POST /advances/${adv_id}/approve"
              payload: {}
              as: PayrollOfficer
              captures: { principal: $.data.principal_cents }
          assert:
            - "Advance.${adv_id}.principal_cents == 40000"
            - "Advance.${adv_id}.recoup_target_cents == 40000"

      - name: advance_fee_round_then_sum_with_cap_mode_b
        grounds:
          - calculations.advance_fee
          - entities.Advance.fields.expedite_fee_cents
          - entities.Advance.fields.total_fee_cents
          - entities.FeeSchedule.fields.max_total_fee_cents
        distinguishing_aspect: |
          Mode (b): the percent component is rounded BEFORE summing
          (expedite = 199 + round(40000*0.02) = 199 + 800 = 999), then the COMBINED
          fee (999 + tip 2000 = 2999) is capped at 1500 — round-then-sum-then-cap
          order is pinned, so total_fee_cents == 1500 (tip trimmed, expedite intact).
        test_recipe:
          setup:
            - "Same employer/policy/fees as the principal clamp; advance INSTANT principal 40000, tip 2000."
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-06-01T00:00:00Z" }
              as: PlatformAdmin
            - call: "POST /employers"
              payload: { legal_name: "Acme", state_code: "CA", pay_frequency: "WEEKLY", funding_balance_cents: 100000, max_advance_pct_of_available: 0.50, per_period_advance_cap_count: 3, cooling_off_hours: 24 }
              as: PlatformAdmin
              captures: { emp_id: $.data.id }
            - call: "POST /advance-policies"
              payload: { employer_id: "${emp_id}", tier: "STANDARD", min_tenure_days: 90, per_advance_floor_cents: 1000, per_advance_ceiling_cents: 50000, cumulative_period_ceiling_cents: 80000 }
              as: PlatformAdmin
            - call: "POST /fee-schedules"
              payload: { employer_id: "${emp_id}", expedite_flat_fee_cents: 199, expedite_pct_fee: 0.02, max_total_fee_cents: 1500, tip_allowed: true }
              as: PlatformAdmin
            - call: "POST /pay-periods"
              payload: { employer_id: "${emp_id}", start_at: "2026-06-01T00:00:00Z", end_at: "2026-06-08T00:00:00Z" }
              as: PayrollOfficer
              captures: { pp_id: $.data.id }
            - call: "POST /workers"
              payload: { employer_id: "${emp_id}", external_payroll_ref: "EMP-1", full_name: "Wanda", hourly_rate_cents: 2000, hire_date: "2025-06-01T00:00:00Z" }
              as: PayrollOfficer
              captures: { w_id: $.data.id }
            - call: "POST /time-entries"
              payload: { pay_period_id: "${pp_id}", worker_id: "${w_id}", shift_start_at: "2026-06-02T08:00:00Z", shift_end_at: "2026-06-03T00:00:00Z", hours_worked: 16.0 }
              as: PayrollOfficer
            - call: "POST /time-entries"
              payload: { pay_period_id: "${pp_id}", worker_id: "${w_id}", shift_start_at: "2026-06-03T08:00:00Z", shift_end_at: "2026-06-04T00:00:00Z", hours_worked: 16.0 }
              as: PayrollOfficer
            - call: "POST /time-entries"
              payload: { pay_period_id: "${pp_id}", worker_id: "${w_id}", shift_start_at: "2026-06-04T08:00:00Z", shift_end_at: "2026-06-04T16:00:00Z", hours_worked: 8.0 }
              as: PayrollOfficer
            - call: "GET /workers/${w_id}"
              payload: {}
              as: PayrollOfficer
              captures: { w_v: $.data.version }
            - call: "POST /advances"
              payload: { worker_id: "${w_id}", pay_period_id: "${pp_id}", requested_principal_cents: 40000, disbursement_speed: "INSTANT", tip_cents: 2000, expected_worker_version: "${w_v}" }
              as: PayrollOfficer
              captures: { adv_id: $.data.id }
          trigger:
            - call: "POST /advances/${adv_id}/approve"
              payload: {}
              as: PayrollOfficer
              captures: { expedite: $.data.expedite_fee_cents, total_fee: $.data.total_fee_cents }
          assert:
            - "Advance.${adv_id}.expedite_fee_cents == 999"
            - "Advance.${adv_id}.total_fee_cents == 1500"
            - "Advance.${adv_id}.recoup_target_cents == 41500"

  # ===========================================================================
  - rule_id: non_linear_state_machine
    instances:
      - name: advance_defaulted_to_recouping_writeback_loop
        grounds:
          - state_machines.Advance.DEFAULTED_to_RECOUPING
          - state_machines.Advance.RECOUPING_to_SETTLED
          - state_machines.Advance.DISBURSED_to_DEFAULTED
        distinguishing_aspect: |
          The Advance machine is non-linear via a revert loop: DISBURSED->DEFAULTED
          then DEFAULTED->RECOUPING (manual-recoup write-back), distinct from any
          forward-only pipeline; the same advance re-enters RECOUPING after being
          DEFAULTED and then reaches SETTLED.
        test_recipe:
          setup:
            - "Advance DEFAULTED with 319 outstanding after payday (INSTANT fee remainder)."
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-06-01T00:00:00Z" }
              as: PlatformAdmin
            - call: "POST /employers"
              payload: { legal_name: "Acme", state_code: "CA", pay_frequency: "WEEKLY", funding_balance_cents: 100000, max_advance_pct_of_available: 0.50, per_period_advance_cap_count: 3, cooling_off_hours: 24 }
              as: PlatformAdmin
              captures: { emp_id: $.data.id }
            - call: "POST /advance-policies"
              payload: { employer_id: "${emp_id}", tier: "STANDARD", min_tenure_days: 90, per_advance_floor_cents: 1000, per_advance_ceiling_cents: 50000, cumulative_period_ceiling_cents: 80000 }
              as: PlatformAdmin
            - call: "POST /fee-schedules"
              payload: { employer_id: "${emp_id}", expedite_flat_fee_cents: 199, expedite_pct_fee: 0.02, max_total_fee_cents: 1500, tip_allowed: true }
              as: PlatformAdmin
            - call: "POST /pay-periods"
              payload: { employer_id: "${emp_id}", start_at: "2026-06-01T00:00:00Z", end_at: "2026-06-08T00:00:00Z" }
              as: PayrollOfficer
              captures: { pp_id: $.data.id }
            - call: "POST /workers"
              payload: { employer_id: "${emp_id}", external_payroll_ref: "EMP-1", full_name: "Wanda", hourly_rate_cents: 2000, hire_date: "2025-06-01T00:00:00Z" }
              as: PayrollOfficer
              captures: { w_id: $.data.id }
            - call: "POST /time-entries"
              payload: { pay_period_id: "${pp_id}", worker_id: "${w_id}", shift_start_at: "2026-06-02T08:00:00Z", shift_end_at: "2026-06-02T14:00:00Z", hours_worked: 6.0 }
              as: PayrollOfficer
            - call: "GET /workers/${w_id}"
              payload: {}
              as: PayrollOfficer
              captures: { w_v: $.data.version }
            - call: "POST /advances"
              payload: { worker_id: "${w_id}", pay_period_id: "${pp_id}", requested_principal_cents: 6000, disbursement_speed: "INSTANT", tip_cents: 0, expected_worker_version: "${w_v}" }
              as: PayrollOfficer
              captures: { adv_id: $.data.id }
            - call: "POST /advances/${adv_id}/approve"
              payload: {}
              as: PayrollOfficer
            - call: "POST /advances/${adv_id}/disburse"
              payload: {}
              as: PayrollOfficer
            - call: "POST /pay-periods/${pp_id}/lock"
              payload: {}
              as: PayrollOfficer
            - call: "POST /repayment-batches"
              payload: { pay_period_id: "${pp_id}" }
              as: PayrollOfficer
              captures: { batch_id: $.data.id }
            - call: "GET /repayment-batches/${batch_id}"
              payload: {}
              as: PayrollOfficer
              captures: { b_v: $.data.version }
            - call: "POST /repayment-batches/${batch_id}/post"
              payload: { expected_repaymentbatch_version: "${b_v}" }
              as: PayrollOfficer
              as_user_id: "officer-poster"
            - call: "POST /pay-periods/${pp_id}/run-payday"
              payload: {}
              as: PayrollOfficer
          trigger:
            - call: "POST /advances/${adv_id}/manual-recoup"
              payload: { amount_cents: 319 }
              as: PayrollOfficer
              captures: { st: $.data.status, out: $.data.principal_outstanding_cents }
          assert:
            - "Advance.${adv_id}.status == SETTLED after recovering the final 319 (DEFAULTED -> RECOUPING -> SETTLED)"
            - "Advance.${adv_id}.principal_outstanding_cents == 0"

      - name: pay_period_cyclic_open_locked_reopen
        grounds:
          - state_machines.PayPeriod.OPEN_to_LOCKED
          - state_machines.PayPeriod.LOCKED_to_OPEN
        distinguishing_aspect: |
          The PayPeriod machine is cyclic on a different entity: OPEN->LOCKED->OPEN
          (reopen) returns to a prior state, a loop no linear pipeline allows;
          locked_at is set then cleared to null on reopen.
        test_recipe:
          setup:
            - "Employer with an OPEN period, no posted batch."
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-06-01T00:00:00Z" }
              as: PlatformAdmin
            - call: "POST /employers"
              payload: { legal_name: "Acme", state_code: "CA", pay_frequency: "WEEKLY", funding_balance_cents: 100000 }
              as: PlatformAdmin
              captures: { emp_id: $.data.id }
            - call: "POST /pay-periods"
              payload: { employer_id: "${emp_id}", start_at: "2026-06-01T00:00:00Z", end_at: "2026-06-08T00:00:00Z" }
              as: PayrollOfficer
              captures: { pp_id: $.data.id }
            - call: "POST /pay-periods/${pp_id}/lock"
              payload: {}
              as: PayrollOfficer
              captures: { locked_state: $.data.status }
          trigger:
            - call: "POST /pay-periods/${pp_id}/reopen"
              payload: {}
              as: PayrollOfficer
              captures: { reopened_state: $.data.status, locked_at_after: $.data.locked_at }
          assert:
            - "PayPeriod.${pp_id}.status == OPEN after reopen (was LOCKED)"
            - "PayPeriod.${pp_id}.locked_at == null after reopen"

  # ===========================================================================
  - rule_id: transitive_cascade
    instances:
      - name: run_payday_default_to_hold_to_recon_to_freeze_depth4
        grounds:
          - state_machines.PayPeriod.LOCKED_to_DISBURSED
          - state_machines.Advance.DISBURSED_to_DEFAULTED
          - entities.Worker.fields.advance_eligibility
          - entities.ReconciliationStatement.fields.outcome
          - entities.Employer.fields.posture
        distinguishing_aspect: |
          Depth-4 chain from run-payday: (1) Advance DISBURSED->DEFAULTED because
          outstanding>0, which (2) flips that advance's Worker.advance_eligibility
          to ON_HOLD, which feeds (3) the ReconciliationStatement recompute to
          outcome DISCREPANCY, which (4) flips Employer.posture to FROZEN — each
          hop caused by the previous, not by run-payday directly.
        test_recipe:
          setup:
