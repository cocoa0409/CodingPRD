# =============================================================================
# §1.8 Scaffold Difficulty Design — Harbor Pilot Association Dispatch
# Test Targeting Index: 2 instances per §0.5 rule (18 total).
# All chains replay from empty-DB; logical clock default is 2026-08-01T00:00:00Z.
# Standard tariff fixture (referenced as MAIN_TARIFF in setups):
#   effective_from 2026-01-01T00:00:00Z, tiers [[0,5000,20],[5000,20000,15],[20000,null,10]],
#   draft threshold 100 dm, surcharge 0.15, detention free 30 / rate 200, delay rate 150.
# =============================================================================
scaffold_difficulty_design:
  # ---------------------------------------------------------------------------
  - rule_id: dual_variant_calc
    instances:
      - name: tariff_provisional_average_vs_final_marginal
        grounds:
          - calculations.tariff_base_fee
          - calculations.invoice_final_composition
          - entities.VesselOrder.fields.provisional_fee_cents
          - entities.Invoice.fields.base_fee_cents
        distinguishing_aspect: |
          Billing domain: for the SAME declared gt=25000 / draft_dm=120 the provisional
          (average-rate, single tier at 10c) yields 287500 while the final (marginal,
          tier-straddling) yields 431250 — two valid algorithms, different results.
        test_recipe:
          setup:
            - "MAIN_TARIFF schedule active (effective_from <= default clock)"
            - "Pilot P1 ACTIVE, IN_ROTATION at position 1, UNLIMITED endorsement cap 100000 expiring 2027-01-01"
            - "Boat B1 AVAILABLE; order O1 gt=25000 draft_dm=120 eta=2026-08-10T00:00:00Z, BOOKED"
            - "O1 dispatched window [2026-08-10T10:00:00Z, 2026-08-10T12:00:00Z]; assignment started and boarded"
          setup_api_calls:
            - { call: "POST /pilotage/tariff-schedules", payload: { effective_from: "2026-01-01T00:00:00Z", tiers: [{min_gt_exclusive: 0, max_gt_inclusive: 5000, rate_cents_per_gt: 20}, {min_gt_exclusive: 5000, max_gt_inclusive: 20000, rate_cents_per_gt: 15}, {min_gt_exclusive: 20000, max_gt_inclusive: null, rate_cents_per_gt: 10}], draft_surcharge_threshold_dm: 100, draft_surcharge_pct: 0.15, detention_free_minutes: 30, detention_rate_cents_per_minute: 200, delay_rate_cents_per_minute: 150 }, as: AssociationAdmin }
            - { call: "POST /pilotage/pilots", payload: { full_name: "Pilot One", license_number: "LIC-1", share_units: 3 }, as: AssociationAdmin, captures: { p1_id: $.data.id, p1_v: $.data.version } }
            - { call: "POST /pilotage/pilots/${p1_id}/endorsements", payload: { endorsement_class: UNLIMITED, tonnage_cap_gt: 100000, expires_at: "2027-01-01T00:00:00Z", expected_pilot_version: "${p1_v}" }, as: AssociationAdmin }
            - { call: "POST /pilotage/pilot-boats", payload: { name: "Boat One", capacity_persons: 6 }, as: AssociationAdmin, captures: { b1_id: $.data.id } }
            - { call: "POST /pilotage/vessel-orders", payload: { vessel_name: "MV Aurora", gt: 25000, draft_dm: 120, order_type: ARRIVAL, eta: "2026-08-10T00:00:00Z" }, as: VesselAgent, as_user_id: "agent-1", captures: { o1_id: $.data.id, o1_prov: $.data.provisional_fee_cents } }
            - { call: "POST /pilotage/vessel-orders/${o1_id}/dispatch", payload: { scheduled_start: "2026-08-10T10:00:00Z", scheduled_end: "2026-08-10T12:00:00Z" }, as: Dispatcher, captures: { a1_id: $.data.id } }
            - { call: "POST /pilotage/assignments/${a1_id}/start", payload: {}, as: Pilot, as_user_id: "${p1_id}" }
            - { call: "POST /pilotage/assignments/${a1_id}/board", payload: {}, as: Pilot, as_user_id: "${p1_id}" }
          trigger:
            - { call: "POST /pilotage/assignments/${a1_id}/complete", payload: { detention_minutes: 45, delay_minutes: 20 }, as: Pilot, as_user_id: "${p1_id}" }
          assert:
            - "captured o1_prov == 287500 (provisional average-rate: 25000*10 = 250000, x1.15 surcharge)"
            - "Invoice(assignment_id == a1_id).base_fee_cents == 431250 (final marginal: 375000 x1.15)"
            - "Invoice.detention_fee_cents == 3000 and Invoice.delay_fee_cents == 3000"
            - "Invoice.total_cents == 437250 and Invoice.status == ISSUED"
            - "287500 != 431250 — identical declared inputs, different variant outputs"

      - name: apprentice_readiness_standard_vs_accelerated
        grounds:
          - calculations.apprentice_readiness
          - entities.Apprentice.fields.track
        distinguishing_aspect: |
          Apprentice domain (not billing): identical stats (trips_completed=45,
          evaluation_avg=90) yield NOT ready under STANDARD (needs 50 trips) and READY
          under ACCELERATED (needs 40 trips + avg >= 85).
        test_recipe:
          setup:
            - "Apprentice SA on STANDARD track with 45 trips and evaluation_avg 90"
            - "Apprentice SB on ACCELERATED track with 45 trips and evaluation_avg 90"
          setup_api_calls:
            - { call: "POST /pilotage/apprentices", payload: { full_name: "App Standard", track: STANDARD }, as: AssociationAdmin, captures: { sa_id: $.data.id } }
            - { call: "POST /pilotage/apprentices/${sa_id}/record-progress", payload: { trips_delta: 45, evaluation_score: 90 }, as: AssociationAdmin }
            - { call: "POST /pilotage/apprentices", payload: { full_name: "App Accelerated", track: ACCELERATED }, as: AssociationAdmin, captures: { sb_id: $.data.id } }
            - { call: "POST /pilotage/apprentices/${sb_id}/record-progress", payload: { trips_delta: 45, evaluation_score: 90 }, as: AssociationAdmin }
          trigger:
            - { call: "POST /pilotage/apprentices/${sa_id}/advance", payload: {}, as: AssociationAdmin, captures: { sa_err: $.data.error_id } }
            - { call: "POST /pilotage/apprentices/${sb_id}/advance", payload: {}, as: AssociationAdmin, captures: { sb_status: $.data.status } }
          assert:
            - "sa_err == ERR_READINESS_NOT_MET (45 < 50)"
            - "sb_status == QUALIFIED (45 >= 40 AND 90 >= 85)"
            - "Apprentice(sa_id).status remains ENROLLED"

  # ---------------------------------------------------------------------------
  - rule_id: combinatorial_formula
    instances:
      - name: tariff_marginal_tier_straddle_with_conditional_surcharge
        grounds:
          - calculations.tariff_base_fee
          - calculations.invoice_final_composition
        distinguishing_aspect: |
          Mode (a): >=3 inputs (gt, draft_dm, detention/delay minutes) with non-linear
          interaction — tier selection straddling two tiers plus a surcharge conditioned
          on draft_dm > 100 plus additive extras.
        test_recipe:
          setup:
            - "MAIN_TARIFF active; P1 eligible (position 1, cap 100000); B1 available"
            - "O1 gt=8000 draft_dm=120 eta 2026-08-10 BOOKED, dispatched [2026-08-10T10:00Z,12:00Z], started, boarded"
          setup_api_calls:
            - { call: "POST /pilotage/tariff-schedules", payload: { effective_from: "2026-01-01T00:00:00Z", tiers: [{min_gt_exclusive: 0, max_gt_inclusive: 5000, rate_cents_per_gt: 20}, {min_gt_exclusive: 5000, max_gt_inclusive: 20000, rate_cents_per_gt: 15}, {min_gt_exclusive: 20000, max_gt_inclusive: null, rate_cents_per_gt: 10}], draft_surcharge_threshold_dm: 100, draft_surcharge_pct: 0.15, detention_free_minutes: 30, detention_rate_cents_per_minute: 200, delay_rate_cents_per_minute: 150 }, as: AssociationAdmin }
            - { call: "POST /pilotage/pilots", payload: { full_name: "Pilot One", license_number: "LIC-1", share_units: 1 }, as: AssociationAdmin, captures: { p1_id: $.data.id, p1_v: $.data.version } }
            - { call: "POST /pilotage/pilots/${p1_id}/endorsements", payload: { endorsement_class: UNLIMITED, tonnage_cap_gt: 100000, expires_at: "2027-01-01T00:00:00Z", expected_pilot_version: "${p1_v}" }, as: AssociationAdmin }
            - { call: "POST /pilotage/pilot-boats", payload: { name: "Boat One", capacity_persons: 6 }, as: AssociationAdmin }
            - { call: "POST /pilotage/vessel-orders", payload: { vessel_name: "MV Bravo", gt: 8000, draft_dm: 120, order_type: DEPARTURE, eta: "2026-08-10T00:00:00Z" }, as: VesselAgent, as_user_id: "agent-1", captures: { o1_id: $.data.id } }
            - { call: "POST /pilotage/vessel-orders/${o1_id}/dispatch", payload: { scheduled_start: "2026-08-10T10:00:00Z", scheduled_end: "2026-08-10T12:00:00Z" }, as: Dispatcher, captures: { a1_id: $.data.id } }
            - { call: "POST /pilotage/assignments/${a1_id}/start", payload: {}, as: Pilot, as_user_id: "${p1_id}" }
            - { call: "POST /pilotage/assignments/${a1_id}/board", payload: {}, as: Pilot, as_user_id: "${p1_id}" }
          trigger:
            - { call: "POST /pilotage/assignments/${a1_id}/complete", payload: { detention_minutes: 10, delay_minutes: 5 }, as: Pilot, as_user_id: "${p1_id}" }
          assert:
            - "Invoice.base_fee_cents == 166750 (marginal: 5000*20 + 3000*15 = 145000; draft 120 > 100 so x1.15)"
            - "Invoice.detention_fee_cents == 0 (10 < 30 free allowance)"
            - "Invoice.delay_fee_cents == 750 (5 x 150)"
            - "Invoice.total_cents == 167500"

      - name: revenue_share_per_share_rounding_then_remainder
        grounds:
          - calculations.revenue_distribution
          - entities.DistributionRun.fields.shares
        distinguishing_aspect: |
          Mode (b) nested rounding order: shares are rounded per-share (round_half_up)
          FIRST then the remainder is reconciled cent-by-cent — sum-then-round would give
          a different split. With net=1323650 and units 3:1, raw 992737.5/330912.5 both
          round up, forcing remainder -1 removed from the LATEST-created pilot.
        test_recipe:
          setup:
            - "MAIN_TARIFF active; pilots PA (share_units 3, created first) and PB (share_units 1), both endorsed cap 100000; two boats BA, BB"
            - "PA completed job on OA (gt 82500, draft 90) -> invoice IA total 950000, FINALIZED at 2026-08-20T10:00Z"
            - "PB completed job on OB (gt 30000, draft 120) -> invoice IB total 488750, FINALIZED at 2026-08-20T10:05Z"
          setup_api_calls:
            - { call: "POST /pilotage/tariff-schedules", payload: { effective_from: "2026-01-01T00:00:00Z", tiers: [{min_gt_exclusive: 0, max_gt_inclusive: 5000, rate_cents_per_gt: 20}, {min_gt_exclusive: 5000, max_gt_inclusive: 20000, rate_cents_per_gt: 15}, {min_gt_exclusive: 20000, max_gt_inclusive: null, rate_cents_per_gt: 10}], draft_surcharge_threshold_dm: 100, draft_surcharge_pct: 0.15, detention_free_minutes: 30, detention_rate_cents_per_minute: 200, delay_rate_cents_per_minute: 150 }, as: AssociationAdmin }
            - { call: "POST /pilotage/pilots", payload: { full_name: "Pilot A", license_number: "LIC-A", share_units: 3 }, as: AssociationAdmin, captures: { pa_id: $.data.id, pa_v: $.data.version } }
            - { call: "POST /pilotage/pilots/${pa_id}/endorsements", payload: { endorsement_class: UNLIMITED, tonnage_cap_gt: 100000, expires_at: "2027-01-01T00:00:00Z", expected_pilot_version: "${pa_v}" }, as: AssociationAdmin }
            - { call: "POST /pilotage/pilots", payload: { full_name: "Pilot B", license_number: "LIC-B", share_units: 1 }, as: AssociationAdmin, captures: { pb_id: $.data.id, pb_v: $.data.version } }
            - { call: "POST /pilotage/pilots/${pb_id}/endorsements", payload: { endorsement_class: UNLIMITED, tonnage_cap_gt: 100000, expires_at: "2027-01-01T00:00:00Z", expected_pilot_version: "${pb_v}" }, as: AssociationAdmin }
            - { call: "POST /pilotage/pilot-boats", payload: { name: "Boat A", capacity_persons: 6 }, as: AssociationAdmin }
            - { call: "POST /pilotage/pilot-boats", payload: { name: "Boat B", capacity_persons: 6 }, as: AssociationAdmin }
            - { call: "POST /pilotage/vessel-orders", payload: { vessel_name: "MV Alpha", gt: 82500, draft_dm: 90, order_type: ARRIVAL, eta: "2026-08-10T00:00:00Z" }, as: VesselAgent, as_user_id: "agent-1", captures: { oa_id: $.data.id } }
            - { call: "POST /pilotage/vessel-orders/${oa_id}/dispatch", payload: { scheduled_start: "2026-08-11T10:00:00Z", scheduled_end: "2026-08-11T12:00:00Z" }, as: Dispatcher, captures: { aa_id: $.data.id } }
            - { call: "POST /pilotage/assignments/${aa_id}/start", payload: {}, as: Pilot, as_user_id: "${pa_id}" }
            - { call: "POST /pilotage/assignments/${aa_id}/board", payload: {}, as: Pilot, as_user_id: "${pa_id}" }
            - { call: "POST /pilotage/assignments/${aa_id}/complete", payload: { detention_minutes: 0, delay_minutes: 0 }, as: Pilot, as_user_id: "${pa_id}" }
            - { call: "POST /pilotage/vessel-orders", payload: { vessel_name: "MV Beta", gt: 30000, draft_dm: 120, order_type: DEPARTURE, eta: "2026-08-10T00:00:00Z" }, as: VesselAgent, as_user_id: "agent-1", captures: { ob_id: $.data.id } }
            - { call: "POST /pilotage/vessel-orders/${ob_id}/dispatch", payload: { scheduled_start: "2026-08-12T10:00:00Z", scheduled_end: "2026-08-12T12:00:00Z" }, as: Dispatcher, captures: { ab_id: $.data.id } }
            - { call: "POST /pilotage/assignments/${ab_id}/start", payload: {}, as: Pilot, as_user_id: "${pb_id}" }
            - { call: "POST /pilotage/assignments/${ab_id}/board", payload: {}, as: Pilot, as_user_id: "${pb_id}" }
            - { call: "POST /pilotage/assignments/${ab_id}/complete", payload: { detention_minutes: 0, delay_minutes: 0 }, as: Pilot, as_user_id: "${pb_id}" }
            - { call: "POST /pilotage/_clock/set_current_utc", payload: { to_iso8601: "2026-08-20T10:00:00Z" }, as: AssociationAdmin }
            - { call: "GET /pilotage/invoices", payload: { assignment_id: "${aa_id}" }, as: FinanceOfficer, captures: { ia_id: "$.data[0].id" } }
            - { call: "GET /pilotage/invoices", payload: { assignment_id: "${ab_id}" }, as: FinanceOfficer, captures: { ib_id: "$.data[0].id" } }
            - { call: "POST /pilotage/invoices/${ia_id}/finalize", payload: {}, as: FinanceOfficer }
            - { call: "POST /pilotage/invoices/${ib_id}/finalize", payload: {}, as: FinanceOfficer }
          trigger:
            - { call: "POST /pilotage/distribution-runs", payload: { period_start: "2026-08-20T00:00:00Z", period_end: "2026-08-21T00:00:00Z" }, as: FinanceOfficer, captures: { run_id: $.data.id } }
          assert:
            - "DistributionRun.gross_pool_cents == 1438750 (950000 + 488750)"
            - "DistributionRun.levy_cents == 115100 (gross < 10000000 so 8%)"
            - "DistributionRun.net_pool_cents == 1323650"
            - "shares[PA] == 992738 and shares[PB] == 330912 (both raw .5 round up; remainder -1 removed from latest-created PB)"
            - "992738 + 330912 + 115100 == 1438750 (exact cent conservation)"

  # ---------------------------------------------------------------------------
  - rule_id: non_linear_state_machine
    instances:
      - name: assignment_parallel_service_and_billing_dimensions
        grounds:
          - state_machines.Assignment
          - entities.Assignment.fields.service_status
          - entities.Assignment.fields.billing_status
        distinguishing_aspect: |
          Parallel dimensions on ONE entity: service_status and billing_status evolve
          independently — a completed-and-settled assignment is (COMPLETED, SETTLED) while
          a pre-start-cancelled one is (CANCELLED, UNBILLED); billing advances via
          distribution settle without any service transition.
        test_recipe:
          setup:
            - "MAIN_TARIFF active; P1 endorsed cap 100000; two boats BA, BB"
            - "A1: full lifecycle to COMPLETED, invoice FINALIZED (clock default 2026-08-01)"
            - "A2: dispatched then cancelled before start"
            - "distribution run over [2026-08-01T00:00Z, 2026-08-02T00:00Z) settled"
          setup_api_calls:
            - { call: "POST /pilotage/tariff-schedules", payload: { effective_from: "2026-01-01T00:00:00Z", tiers: [{min_gt_exclusive: 0, max_gt_inclusive: 5000, rate_cents_per_gt: 20}, {min_gt_exclusive: 5000, max_gt_inclusive: 20000, rate_cents_per_gt: 15}, {min_gt_exclusive: 20000, max_gt_inclusive: null, rate_cents_per_gt: 10}], draft_surcharge_threshold_dm: 100, draft_surcharge_pct: 0.15, detention_free_minutes: 30, detention_rate_cents_per_minute: 200, delay_rate_cents_per_minute: 150 }, as: AssociationAdmin }
            - { call: "POST /pilotage/pilots", payload: { full_name: "Pilot One", license_number: "LIC-1", share_units: 1 }, as: AssociationAdmin, captures: { p1_id: $.data.id, p1_v: $.data.version } }
            - { call: "POST /pilotage/pilots/${p1_id}/endorsements", payload: { endorsement_class: UNLIMITED, tonnage_cap_gt: 100000, expires_at: "2027-01-01T00:00:00Z", expected_pilot_version: "${p1_v}" }, as: AssociationAdmin }
            - { call: "POST /pilotage/pilot-boats", payload: { name: "Boat A", capacity_persons: 6 }, as: AssociationAdmin }
            - { call: "POST /pilotage/pilot-boats", payload: { name: "Boat B", capacity_persons: 6 }, as: AssociationAdmin }
            - { call: "POST /pilotage/vessel-orders", payload: { vessel_name: "MV One", gt: 8000, draft_dm: 90, order_type: ARRIVAL, eta: "2026-08-10T00:00:00Z" }, as: VesselAgent, as_user_id: "agent-1", captures: { o1_id: $.data.id } }
            - { call: "POST /pilotage/vessel-orders/${o1_id}/dispatch", payload: { scheduled_start: "2026-08-10T10:00:00Z", scheduled_end: "2026-08-10T11:00:00Z" }, as: Dispatcher, captures: { a1_id: $.data.id } }
            - { call: "POST /pilotage/assignments/${a1_id}/start", payload: {}, as: Pilot, as_user_id: "${p1_id}" }
            - { call: "POST /pilotage/assignments/${a1_id}/board", payload: {}, as: Pilot, as_user_id: "${p1_id}" }
            - { call: "POST /pilotage/assignments/${a1_id}/complete", payload: { detention_minutes: 0, delay_minutes: 0 }, as: Pilot, as_user_id: "${p1_id}" }
            - { call: "GET /pilotage/invoices", payload: { assignment_id: "${a1_id}" }, as: FinanceOfficer, captures: { i1_id: "$.data[0].id" } }
            - { call: "POST /pilotage/invoices/${i1_id}/finalize", payload: {}, as: FinanceOfficer }
            - { call: "POST /pilotage/vessel-orders", payload: { vessel_name: "MV Two", gt: 8000, draft_dm: 90, order_type: DEPARTURE, eta: "2026-08-11T00:00:00Z" }, as: VesselAgent, as_user_id: "agent-1", captures: { o2_id: $.data.id } }
            - { call: "POST /pilotage/vessel-orders/${o2_id}/dispatch", payload: { scheduled_start: "2026-08-11T10:00:00Z", scheduled_end: "2026-08-11T11:00:00Z" }, as: Dispatcher, captures: { a2_id: $.data.id } }
            - { call: "POST /pilotage/assignments/${a2_id}/cancel", payload: {}, as: Dispatcher }
          trigger:
            - { call: "POST /pilotage/distribution-runs", payload: { period_start: "2026-08-01T00:00:00Z", period_end: "2026-08-02T00:00:00Z" }, as: FinanceOfficer, captures: { run_id: $.data.id } }
            - { call: "POST /pilotage/distribution-runs/${run_id}/settle", payload: {}, as: FinanceOfficer }
          assert:
            - "Assignment(a1_id).service_status == COMPLETED and Assignment(a1_id).billing_status == SETTLED (billing advanced without any service transition)"
            - "Assignment(a2_id).service_status == CANCELLED and Assignment(a2_id).billing_status == UNBILLED (cancelled work never bills)"
            - "Invoice(i1_id).status == DISTRIBUTED"

      - name: incident_branching_fork_divergent_side_effects
        grounds:
          - state_machines.Incident
          - state_machines.Pilot.ACTIVE_to_SUSPENDED
        distinguishing_aspect: |
          Branching fork on Incident: UNDER_REVIEW -> DISMISSED leaves the pilot, board
          entry and assignments untouched, while UNDER_REVIEW -> SUBSTANTIATED fires the
          suspension cascade — divergent side-effect sets per branch.
        test_recipe:
          setup:
            - "MAIN_TARIFF active; P1 endorsed cap 100000; boats BA, BB; orders O1 (window 08-10) and O2 (window 08-11) both dispatched to P1"
            - "A1 (O1) started so it is EN_ROUTE; A2 (O2) is ASSIGNED"
            - "Incident I1 reported on A1 and opened for review, then dismissed"
          setup_api_calls:
            - { call: "POST /pilotage/tariff-schedules", payload: { effective_from: "2026-01-01T00:00:00Z", tiers: [{min_gt_exclusive: 0, max_gt_inclusive: 5000, rate_cents_per_gt: 20}, {min_gt_exclusive: 5000, max_gt_inclusive: 20000, rate_cents_per_gt: 15}, {min_gt_exclusive: 20000, max_gt_inclusive: null, rate_cents_per_gt: 10}], draft_surcharge_threshold_dm: 100, draft_surcharge_pct: 0.15, detention_free_minutes: 30, detention_rate_cents_per_minute: 200, delay_rate_cents_per_minute: 150 }, as: AssociationAdmin }
            - { call: "POST /pilotage/pilots", payload: { full_name: "Pilot One", license_number: "LIC-1", share_units: 1 }, as: AssociationAdmin, captures: { p1_id: $.data.id, p1_v: $.data.version } }
            - { call: "POST /pilotage/pilots/${p1_id}/endorsements", payload: { endorsement_class: UNLIMITED, tonnage_cap_gt: 100000, expires_at: "2027-01-01T00:00:00Z", expected_pilot_version: "${p1_v}" }, as: AssociationAdmin }
            - { call: "POST /pilotage/pilot-boats", payload: { name: "Boat A", capacity_persons: 6 }, as: AssociationAdmin }
            - { call: "POST /pilotage/pilot-boats", payload: { name: "Boat B", capacity_persons: 6 }, as: AssociationAdmin }
            - { call: "POST /pilotage/vessel-orders", payload: { vessel_name: "MV One", gt: 8000, draft_dm: 90, order_type: ARRIVAL, eta: "2026-08-10T00:00:00Z" }, as: VesselAgent, as_user_id: "agent-1", captures: { o1_id: $.data.id } }
            - { call: "POST /pilotage/vessel-orders/${o1_id}/dispatch", payload: { scheduled_start: "2026-08-10T10:00:00Z", scheduled_end: "2026-08-10T11:00:00Z" }, as: Dispatcher, captures: { a1_id: $.data.id } }
            - { call: "POST /pilotage/vessel-orders", payload: { vessel_name: "MV Two", gt: 8000, draft_dm: 90, order_type: DEPARTURE, eta: "2026-08-11T00:00:00Z" }, as: VesselAgent, as_user_id: "agent-1", captures: { o2_id: $.data.id } }
            - { call: "POST /pilotage/vessel-orders/${o2_id}/dispatch", payload: { scheduled_start: "2026-08-11T10:00:00Z", scheduled_end: "2026-08-11T11:00:00Z" }, as: Dispatcher, captures: { a2_id: $.data.id } }
            - { call: "POST /pilotage/assignments/${a1_id}/start", payload: {}, as: Pilot, as_user_id: "${p1_id}" }
            - { call: "POST /pilotage/incidents", payload: { assignment_id: "${a1_id}", incident_type: NEAR_MISS, description: "near miss at buoy 4" }, as: Dispatcher, captures: { i1_id: $.data.id } }
            - { call: "POST /pilotage/incidents/${i1_id}/open-review", payload: {}, as: Investigator }
          trigger:
            - { call: "POST /pilotage/incidents/${i1_id}/dismiss", payload: {}, as: Investigator }
          assert:
            - "Incident(i1_id).status == DISMISSED"
            - "Pilot(p1_id).status == ACTIVE (dismiss branch has NO cascade)"
            - "RotationEntry(pilot_id == p1_id).status == IN_ROTATION"
            - "Assignment(a2_id).service_status == ASSIGNED (unchanged)"

  # ---------------------------------------------------------------------------
  - rule_id: transitive_cascade
    instances:
      - name: incident_substantiation_suspension_cascade_depth3
        grounds:
          - state_machines.Incident.UNDER_REVIEW_to_SUBSTANTIATED
          - state_machines.Pilot.ACTIVE_to_SUSPENDED
          - state_machines.RotationEntry
          - state_machines.Assignment.ASSIGNED_to_RECALLED
        distinguishing_aspect: |
          Depth-3 chain from substantiate: hop1 Pilot -> SUSPENDED; hop2 (caused by the
          suspension) RotationEntry -> OFF_BOARD; hop3 (caused by board removal) the
          pilot's OTHER ASSIGNED assignment -> RECALLED with recall_count incremented.
        test_recipe:
          setup:
            - "MAIN_TARIFF active; P1 endorsed cap 100000; boats BA, BB"
            - "A1 (order O1, window 08-10) EN_ROUTE under P1; A2 (order O2, window 08-11) ASSIGNED to P1"
            - "Incident I1 on A1 opened for review"
          setup_api_calls:
            - { call: "POST /pilotage/tariff-schedules", payload: { effective_from: "2026-01-01T00:00:00Z", tiers: [{min_gt_exclusive: 0, max_gt_inclusive: 5000, rate_cents_per_gt: 20}, {min_gt_exclusive: 5000, max_gt_inclusive: 20000, rate_cents_per_gt: 15}, {min_gt_exclusive: 20000, max_gt_inclusive: null, rate_cents_per_gt: 10}], draft_surcharge_threshold_dm: 100, draft_surcharge_pct: 0.15, detention_free_minutes: 30, detention_rate_cents_per_minute: 200, delay_rate_cents_per_minute: 150 }, as: AssociationAdmin }
            - { call: "POST /pilotage/pilots", payload: { full_name: "Pilot One", license_number: "LIC-1", share_units: 1 }, as: AssociationAdmin, captures: { p1_id: $.data.id, p1_v: $.data.version } }
            - { call: "POST /pilotage/pilots/${p1_id}/endorsements", payload: { endorsement_class: UNLIMITED, tonnage_cap_gt: 100000, expires_at: "2027-01-01T00:00:00Z", expected_pilot_version: "${p1_v}" }, as: AssociationAdmin }
            - { call: "POST /pilotage/pilot-boats", payload: { name: "Boat A", capacity_persons: 6 }, as: AssociationAdmin }
            - { call: "POST /pilotage/pilot-boats", payload: { name: "Boat B", capacity_persons: 6 }, as: AssociationAdmin }
            - { call: "POST /pilotage/vessel-orders", payload: { vessel_name: "MV One", gt: 8000, draft_dm: 90, order_type: ARRIVAL, eta: "2026-08-10T00:00:00Z" }, as: VesselAgent, as_user_id: "agent-1", captures: { o1_id: $.data.id } }
            - { call: "POST /pilotage/vessel-orders/${o1_id}/dispatch", payload: { scheduled_start: "2026-08-10T10:00:00Z", scheduled_end: "2026-08-10T11:00:00Z" }, as: Dispatcher, captures: { a1_id: $.data.id } }
            - { call: "POST /pilotage/vessel-orders", payload: { vessel_name: "MV Two", gt: 8000, draft_dm: 90, order_type: DEPARTURE, eta: "2026-08-11T00:00:00Z" }, as: VesselAgent, as_user_id: "agent-1", captures: { o2_id: $.data.id } }
            - { call: "POST /pilotage/vessel-orders/${o2_id}/dispatch", payload: { scheduled_start: "2026-08-11T10:00:00Z", scheduled_end: "2026-08-11T11:00:00Z" }, as: Dispatcher, captures: { a2_id: $.data.id } }
            - { call: "POST /pilotage/assignments/${a1_id}/start", payload: {}, as: Pilot, as_user_id: "${p1_id}" }
            - { call: "POST /pilotage/incidents", payload: { assignment_id: "${a1_id}", incident_type: COLLISION, description: "contact with fender" }, as: Dispatcher, captures: { i1_id: $.data.id } }
            - { call: "POST /pilotage/incidents/${i1_id}/open-review", payload: {}, as: Investigator }
          trigger:
            - { call: "POST /pilotage/incidents/${i1_id}/substantiate", payload: {}, as: Investigator }
          assert:
            - "hop1: Pilot(p1_id).status == SUSPENDED"
            - "hop2: RotationEntry(pilot_id == p1_id).status == OFF_BOARD"
            - "hop3: Assignment(a2_id).service_status == RECALLED and recall_count == 1"
            - "Assignment(a1_id).service_status == EN_ROUTE (in-progress work not recalled)"
            - "Incident(i1_id).status == SUBSTANTIATED"

      - name: order_cancel_assignment_rotation_compensation_depth2
        grounds:
          - state_machines.VesselOrder.DISPATCHED_to_CANCELLED
          - state_machines.Assignment.ASSIGNED_to_CANCELLED
          - entities.RotationEntry.fields.previous_position
        distinguishing_aspect: |
          Depth-2 chain from order cancel (different trigger than substantiate):
          hop1 assignment -> CANCELLED; hop2 (caused by the cancellation) the pilot's
          RotationEntry.position is restored from previous_position.
        test_recipe:
          setup:
            - "MAIN_TARIFF active; P1 (position 1) and P2 (position 2) both endorsed cap 100000; boat BA"
            - "O1 dispatched: selector picked P1, whose entry moved 1 -> 3 (previous_position 1)"
          setup_api_calls:
            - { call: "POST /pilotage/tariff-schedules", payload: { effective_from: "2026-01-01T00:00:00Z", tiers: [{min_gt_exclusive: 0, max_gt_inclusive: 5000, rate_cents_per_gt: 20}, {min_gt_exclusive: 5000, max_gt_inclusive: 20000, rate_cents_per_gt: 15}, {min_gt_exclusive: 20000, max_gt_inclusive: null, rate_cents_per_gt: 10}], draft_surcharge_threshold_dm: 100, draft_surcharge_pct: 0.15, detention_free_minutes: 30, detention_rate_cents_per_minute: 200, delay_rate_cents_per_minute: 150 }, as: AssociationAdmin }
            - { call: "POST /pilotage/pilots", payload: { full_name: "Pilot One", license_number: "LIC-1", share_units: 1 }, as: AssociationAdmin, captures: { p1_id: $.data.id, p1_v: $.data.version } }
            - { call: "POST /pilotage/pilots/${p1_id}/endorsements", payload: { endorsement_class: UNLIMITED, tonnage_cap_gt: 100000, expires_at: "2027-01-01T00:00:00Z", expected_pilot_version: "${p1_v}" }, as: AssociationAdmin }
            - { call: "POST /pilotage/pilots", payload: { full_name: "Pilot Two", license_number: "LIC-2", share_units: 1 }, as: AssociationAdmin, captures: { p2_id: $.data.id, p2_v: $.data.version } }
            - { call: "POST /pilotage/pilots/${p2_id}/endorsements", payload: { endorsement_class: UNLIMITED, tonnage_cap_gt: 100000, expires_at: "2027-01-01T00:00:00Z", expected_pilot_version: "${p2_v}" }, as: AssociationAdmin }
            - { call: "POST /pilotage/pilot-boats", payload: { name: "Boat A", capacity_persons: 6 }, as: AssociationAdmin }
            - { call: "POST /pilotage/vessel-orders", payload: { vessel_name: "MV One", gt: 8000, draft_dm: 90, order_type: ARRIVAL, eta: "2026-08-10T00:00:00Z" }, as: VesselAgent, as_user_id: "agent-1", captures: { o1_id: $.data.id } }
            - { call: "POST /pilotage/vessel-orders/${o1_id}/dispatch", payload: { scheduled_start: "2026-08-10T10:00:00Z", scheduled_end: "2026-08-10T11:00:00Z" }, as: Dispatcher, captures: { a1_id: $.data.id } }
          trigger:
            - { call: "POST /pilotage/vessel-orders/${o1_id}/cancel", payload: {}, as: VesselAgent, as_user_id: "agent-1" }
          assert:
            - "VesselOrder(o1_id).status == CANCELLED"
            - "hop1: Assignment(a1_id).service_status == CANCELLED"
            - "hop2: RotationEntry(pilot_id == p1_id).position == 1 (restored) and previous_position == null"
            - "RotationEntry(pilot_id == p2_id).position == 2 (unchanged)"
  # ---------------------------------------------------------------------------
  - rule_id: priority_pair_validation_conflict
    instances:
      - name: dispatch_cancelled_order_state_beats_empty_pool_constraint
        grounds:
          - validations[priority=7]
          - validations[priority=13]
          - errors[ERR_ORDER_NOT_DISPATCHABLE]
          - errors[ERR_NO_ELIGIBLE_PILOT]
        distinguishing_aspect: |
          Category pair state-vs-business_constraint: the order is CANCELLED AND the
          pilot pool is empty (no pilots exist at all); priority 7 state error
          ERR_ORDER_NOT_DISPATCHABLE must win over priority 13 ERR_NO_ELIGIBLE_PILOT.
        test_recipe:
          setup:
            - "MAIN_TARIFF active; order O1 created then cancelled by its agent; NO pilots exist"
          setup_api_calls:
            - { call: "POST /pilotage/tariff-schedules", payload: { effective_from: "2026-01-01T00:00:00Z", tiers: [{min_gt_exclusive: 0, max_gt_inclusive: 5000, rate_cents_per_gt: 20}], draft_surcharge_threshold_dm: 100, draft_surcharge_pct: 0.15, detention_free_minutes: 30, detention_rate_cents_per_minute: 200, delay_rate_cents_per_minute: 150 }, as: AssociationAdmin }
            - { call: "POST /pilotage/vessel-orders", payload: { vessel_name: "MV Dead", gt: 8000, draft_dm: 90, order_type: ARRIVAL, eta: "2026-08-10T00:00:00Z" }, as: VesselAgent, as_user_id: "agent-1", captures: { o1_id: $.data.id } }
            - { call: "POST /pilotage/vessel-orders/${o1_id}/cancel", payload: {}, as: VesselAgent, as_user_id: "agent-1" }
          trigger:
            - { call: "POST /pilotage/vessel-orders/${o1_id}/dispatch", payload: { scheduled_start: "2026-08-10T10:00:00Z", scheduled_end: "2026-08-10T11:00:00Z" }, as: Dispatcher, captures: { err: $.data.error_id } }
          assert:
            - "err == ERR_ORDER_NOT_DISPATCHABLE (state, priority 7)"
            - "err != ERR_NO_ELIGIBLE_PILOT (business_constraint, priority 13)"

      - name: reassign_fatigue_rest_beats_pilot_time_conflict
        grounds:
          - validations[priority=10]
          - validations[priority=19]
          - errors[ERR_FATIGUE_REST_ACTIVE]
          - errors[ERR_PILOT_TIME_CONFLICT]
        distinguishing_aspect: |
          Category pair business_safety-vs-business_temporal: the explicitly named pilot
          is BOTH rest-active (rest_until > now) and closed-interval-overlapping; the
          safety error ERR_FATIGUE_REST_ACTIVE (p10) must win over
          ERR_PILOT_TIME_CONFLICT (p19).
        test_recipe:
          setup:
            - "MAIN_TARIFF active; P1 cap 100000, P2 cap 5000; boat BA"
            - "A_hist (order OH gt 4000, window 2026-08-09 08:00-09:00) ASSIGNED to P1; A1 (order O1 gt 8000, window 2026-08-10 10:00-12:00) ASSIGNED to P1"
            - "A_hist completed with zero elapsed clock time -> P1.rest_until == 2026-08-01T10:00:00Z > clock (2026-08-01T00:00:00Z): rest ACTIVE"
            - "A2 (order O2 gt 4000, window 2026-08-11 10:00-11:00) ASSIGNED to P2, then recalled to RECALLED"
          setup_api_calls:
            - { call: "POST /pilotage/tariff-schedules", payload: { effective_from: "2026-01-01T00:00:00Z", tiers: [{min_gt_exclusive: 0, max_gt_inclusive: 5000, rate_cents_per_gt: 20}, {min_gt_exclusive: 5000, max_gt_inclusive: 20000, rate_cents_per_gt: 15}, {min_gt_exclusive: 20000, max_gt_inclusive: null, rate_cents_per_gt: 10}], draft_surcharge_threshold_dm: 100, draft_surcharge_pct: 0.15, detention_free_minutes: 30, detention_rate_cents_per_minute: 200, delay_rate_cents_per_minute: 150 }, as: AssociationAdmin }
            - { call: "POST /pilotage/pilots", payload: { full_name: "Pilot One", license_number: "LIC-1", share_units: 1 }, as: AssociationAdmin, captures: { p1_id: $.data.id, p1_v: $.data.version } }
            - { call: "POST /pilotage/pilots/${p1_id}/endorsements", payload: { endorsement_class: UNLIMITED, tonnage_cap_gt: 100000, expires_at: "2027-01-01T00:00:00Z", expected_pilot_version: "${p1_v}" }, as: AssociationAdmin }
            - { call: "POST /pilotage/pilots", payload: { full_name: "Pilot Two", license_number: "LIC-2", share_units: 1 }, as: AssociationAdmin, captures: { p2_id: $.data.id, p2_v: $.data.version } }
            - { call: "POST /pilotage/pilots/${p2_id}/endorsements", payload: { endorsement_class: HARBOR, tonnage_cap_gt: 5000, expires_at: "2027-01-01T00:00:00Z", expected_pilot_version: "${p2_v}" }, as: AssociationAdmin }
            - { call: "POST /pilotage/pilot-boats", payload: { name: "Boat A", capacity_persons: 6 }, as: AssociationAdmin, captures: { ba_id: $.data.id } }
            - { call: "POST /pilotage/vessel-orders", payload: { vessel_name: "MV Hist", gt: 4000, draft_dm: 90, order_type: SHIFT, eta: "2026-08-09T00:00:00Z" }, as: VesselAgent, as_user_id: "agent-1", captures: { oh_id: $.data.id } }
            - { call: "POST /pilotage/vessel-orders/${oh_id}/dispatch", payload: { scheduled_start: "2026-08-09T08:00:00Z", scheduled_end: "2026-08-09T09:00:00Z" }, as: Dispatcher, captures: { ah_id: $.data.id } }
            - { call: "POST /pilotage/vessel-orders", payload: { vessel_name: "MV One", gt: 8000, draft_dm: 90, order_type: ARRIVAL, eta: "2026-08-10T00:00:00Z" }, as: VesselAgent, as_user_id: "agent-1", captures: { o1_id: $.data.id } }
            - { call: "POST /pilotage/vessel-orders/${o1_id}/dispatch", payload: { scheduled_start: "2026-08-10T10:00:00Z", scheduled_end: "2026-08-10T12:00:00Z" }, as: Dispatcher, captures: { a1_id: $.data.id } }
            - { call: "POST /pilotage/assignments/${ah_id}/start", payload: {}, as: Pilot, as_user_id: "${p1_id}" }
            - { call: "POST /pilotage/assignments/${ah_id}/board", payload: {}, as: Pilot, as_user_id: "${p1_id}" }
            - { call: "POST /pilotage/assignments/${ah_id}/complete", payload: { detention_minutes: 0, delay_minutes: 0 }, as: Pilot, as_user_id: "${p1_id}" }
            - { call: "POST /pilotage/vessel-orders", payload: { vessel_name: "MV Two", gt: 4000, draft_dm: 90, order_type: DEPARTURE, eta: "2026-08-11T00:00:00Z" }, as: VesselAgent, as_user_id: "agent-1", captures: { o2_id: $.data.id } }
            - { call: "POST /pilotage/vessel-orders/${o2_id}/dispatch", payload: { scheduled_start: "2026-08-11T10:00:00Z", scheduled_end: "2026-08-11T11:00:00Z" }, as: Dispatcher, captures: { a2_id: $.data.id } }
            - { call: "POST /pilotage/assignments/${a2_id}/recall", payload: {}, as: Dispatcher }
          trigger:
            - { call: "POST /pilotage/assignments/${a2_id}/reassign", payload: { pilot_id: "${p1_id}", boat_id: "${ba_id}", scheduled_start: "2026-08-10T11:00:00Z", scheduled_end: "2026-08-10T13:00:00Z" }, as: Dispatcher, captures: { err: $.data.error_id } }
          assert:
            - "err == ERR_FATIGUE_REST_ACTIVE (business_safety, priority 10)"
            - "err != ERR_PILOT_TIME_CONFLICT and err != ERR_BOAT_TIME_CONFLICT (business_temporal, priorities 19/20)"

  # ---------------------------------------------------------------------------
  - rule_id: boundary_precision_check
    instances:
      - name: fatigue_duty_limit_equality_passes_plus_one_fails
        grounds:
          - calculations.fatigue_rolling_duty
          - validations[priority=11]
        distinguishing_aspect: |
          Metric: rolling duty minutes vs MAX 4320 on POST /assignments/{id}/reassign.
          projected == 4320 PASSES (<= is inclusive); projected == 4321 fails with
          ERR_FATIGUE_DUTY_LIMIT.
        test_recipe:
          setup:
            - "MAIN_TARIFF active; P1 cap 100000, P2 cap 5000; boat BA"
            - "P1 completed a 4260-minute job (actual_start 2026-08-02T00:00Z, actual_end 2026-08-03T23:00Z) -> rest_until 2026-08-04T15:00Z, rolling duty 4260"
            - "clock at 2026-08-04T16:00:00Z (rest expired; 08-03T23:00 within the inclusive 7-day window)"
            - "A2 (order O2 gt 4000, window 2026-08-10 10:00-11:00) ASSIGNED to P2 then recalled to RECALLED"
          setup_api_calls:
            - { call: "POST /pilotage/tariff-schedules", payload: { effective_from: "2026-01-01T00:00:00Z", tiers: [{min_gt_exclusive: 0, max_gt_inclusive: 5000, rate_cents_per_gt: 20}, {min_gt_exclusive: 5000, max_gt_inclusive: 20000, rate_cents_per_gt: 15}, {min_gt_exclusive: 20000, max_gt_inclusive: null, rate_cents_per_gt: 10}], draft_surcharge_threshold_dm: 100, draft_surcharge_pct: 0.15, detention_free_minutes: 30, detention_rate_cents_per_minute: 200, delay_rate_cents_per_minute: 150 }, as: AssociationAdmin }
