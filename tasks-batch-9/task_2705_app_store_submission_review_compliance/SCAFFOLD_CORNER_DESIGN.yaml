            - "AppRecord.${app_id}.feature_compliance_index == 100.00"
            - "AppRecord.${app_id}.compliance_posture == OPEN"

      - name: assessing_a_remediated_row_again_is_refused_by_terminal_lockdown
        claim_type: Terminal State Lockdown
        grounds:
