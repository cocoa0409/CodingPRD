              payload: { name: "T3 Pre-clock", terminal_code: "T3", total_lane_positions: 2, wait_threshold_minutes_standard: 15, wait_threshold_minutes_expedited: 8, connecting_pax_discount_pct: 0, secondary_slot_capacity: 1, plan_cost_cap_cents: 10000000 }
              as: PlatformAdmin
              captures: { pre_cp_id: $.data.id, pre_created: $.data.created_at }
          trigger:
            - call: "POST /_clock/set_current_utc"
              payload: { current_utc: "2026-09-10T08:00:00Z" }
              as: PlatformAdmin
              captures: { clk_echo: $.data.current_utc }
            - call: "POST /lanes"
              payload: { checkpoint_id: "${pre_cp_id}", lane_type: "EXPEDITED", position_index: 1, required_officer_count: 1, max_concurrent_officers: 1, secondary_positions: 0 }
              as: CheckpointManager
              captures: { clk_lane_id: $.data.id, clk_lane_created: $.data.created_at }
            - call: "POST /equipment-units"
              payload: { lane_id: "${clk_lane_id}", equipment_type: "WTMD", serial_number: "WT-T3", calibration_due_utc: "2027-01-01T00:00:00Z" }
              as: CheckpointManager
            - call: "POST /equipment-units"
              payload: { lane_id: "${clk_lane_id}", equipment_type: "AT_XRAY", serial_number: "XR-T3", calibration_due_utc: "2027-01-01T00:00:00Z" }
              as: CheckpointManager
            - call: "POST /lanes/${clk_lane_id}/open"
              payload: {}
              as: CheckpointManager
              captures: { clk_opened_at: $.data.opened_at_utc }
            - call: "POST /_clock/set_current_utc"
              payload: { current_utc: "2026-08-01T00:00:00Z" }
              as: PlatformAdmin
              captures: { clk_back: $.data.current_utc }
          assert:
            - "${pre_created} == 2026-08-01T00:00:00Z — the declared pre-set default, proving no wall-clock fallback"
            - "${clk_echo} == 2026-09-10T08:00:00Z"
            - "${clk_lane_created} == 2026-09-10T08:00:00Z — created_at follows the logical clock for rows written after the set"
            - "${clk_opened_at} == 2026-09-10T08:00:00Z"
            - "${clk_back} == 2026-08-01T00:00:00Z — the clock may be moved backwards; it is a settable value, not a monotonic counter"
            - "the pre-clock checkpoint's created_at is unchanged by either set call"

  # ===========================================================================
  - section: errors
    instances:

      - name: every_not_found_code_in_the_catalog_is_triggerable_from_a_path_id
        claim_type: error_triggerable
        grounds:
          - validations[priority 4]
          - errors[ERR_CHECKPOINT_NOT_FOUND]
          - errors[ERR_LANE_NOT_FOUND]
          - errors[ERR_EQUIPMENT_UNIT_NOT_FOUND]
          - errors[ERR_OFFICER_NOT_FOUND]
          - errors[ERR_SHOW_UP_CURVE_NOT_FOUND]
          - errors[ERR_FLIGHT_SCHEDULE_ENTRY_NOT_FOUND]
          - errors[ERR_TIME_BAND_NOT_FOUND]
          - errors[ERR_STAFFING_PLAN_NOT_FOUND]
          - errors[ERR_LANE_ASSIGNMENT_NOT_FOUND]
          - errors[ERR_WAIT_TIME_OBSERVATION_NOT_FOUND]
          - errors[ERR_ESCALATION_TICKET_NOT_FOUND]
          - errors[ERR_SCREENING_REFERRAL_NOT_FOUND]
          - errors[ERR_SURGE_DETAIL_NOT_FOUND]
        distinguishing_aspect: "One well-formed UUID that names no row must produce a DIFFERENT code per entity — thirteen codes, thirteen endpoints — rather than a single generic 404. Each response also carries error_id and message, so the error envelope shape is exercised for every entity."
        test_recipe:
          setup: ["empty database apart from the logical clock; no row of any entity exists"]
          setup_api_calls:
            - *c_clock08
          trigger:
            - call: "GET /checkpoints/00000000-0000-0000-0000-0000000000ff"
              payload: {}
              as: PlatformAdmin
              expect_status: 404
              captures: { nf_checkpoint: $.data.error_id, nf_message: $.data.message }
            - call: "GET /lanes/00000000-0000-0000-0000-0000000000ff"
              payload: {}
              as: PlatformAdmin
              expect_status: 404
              captures: { nf_lane: $.data.error_id }
            - call: "GET /equipment-units/00000000-0000-0000-0000-0000000000ff"
              payload: {}
              as: PlatformAdmin
              expect_status: 404
              captures: { nf_equipment: $.data.error_id }
            - call: "GET /officers/00000000-0000-0000-0000-0000000000ff"
              payload: {}
