# =============================================================================
# S1.8 Scaffold Difficulty Design (Test Targeting Index)
# Task: task_3148_charitable_medical_debt_purchase_account_abolishment
# =============================================================================
scaffold_difficulty_design:
- rule_id: dual_variant_calc
  instances:
  - name: relief_valuation_provisional_vs_final_on_same_account
    grounds:
    - calculations.relief_valuation
    - entities.DebtAccount.fields.abolished_amount_cents
    - entities.Portfolio.fields.eligible_face_value_cents
    distinguishing_aspect: 'DebtAccount domain: the provisional variant (balance_cents only, used for eligible_face_value_cents and the price
      quote) differs from the final variant (balance_cents + accrued_adjustment_cents, stamped as abolished_amount_cents at finalize) for the
      same account whenever the adjustment is non-zero.'
    test_recipe:
      setup:
      - Logical clock at 2026-09-01T00:00:00Z.
      - HOSPITAL org in TX; ACTIVE policy (FPL x4.0, insolvency qualifies); portfolio with A1 (household H1, balance 1000000, adjustment +50000,
        reported EQUIFAX, income 5000000), A2 (H1, balance 500000, income 6260000), A3 (H2, balance 700000, income 9999999, ineligible).
      - Portfolio screened, priced, contracted, settled; GENERAL campaign funded (gross 1600000, net 1553600); batch [A1, A2] committed and finalized.
      setup_api_calls:
      - &id001
        call: POST /_clock/set_current_utc
        payload:
          to_iso8601: '2026-09-01T00:00:00Z'
        as: PlatformAdmin
      - &id002
        call: POST /api/source-organizations
        payload:
          name: Mercy General Hospital
          org_type: HOSPITAL
          state_code: TX
          contact_email: billing@org.example
        as: PlatformAdmin
        captures:
          org_id: $.data.id
      - &id003
        call: POST /api/eligibility-policies
        payload:
          name: TX Standard 400%
          state_code: TX
          fpl_multiplier: 4.0
          insolvency_qualifies: true
          effective_from: '2026-01-01'
          effective_to: '2027-01-01'
        as: EligibilityOfficer
        captures:
          pol_id: $.data.id
      - &id004
        call: POST /api/eligibility-policies/${pol_id}/activate
        payload: {}
        as: EligibilityOfficer
      - &id005
        call: POST /api/portfolios
        payload:
          source_org_id: ${org_id}
          label: Mercy Q3 bundle
          face_value_cents: 2200000
          asking_price_cents: 50000
        as: PortfolioAnalyst
        captures:
          pf_id: $.data.id
      - &id006
        call: POST /api/portfolios/${pf_id}/accounts
        payload:
          accounts:
          - external_ref: A1
            debtor_household_key: H1
            debtor_zip: '75001'
            debtor_state: TX
            household_size: 1
            annual_income_cents: 5000000
            is_insolvent: false
            balance_cents: 1000000
            accrued_adjustment_cents: 50000
            reported_to_bureau: true
            bureau_name: EQUIFAX
            mailing_address: 1 Main St
          - external_ref: A2
            debtor_household_key: H1
            debtor_zip: '75002'
            debtor_state: TX
            household_size: 1
            annual_income_cents: 6260000
            is_insolvent: false
            balance_cents: 500000
            accrued_adjustment_cents: 0
            reported_to_bureau: false
            bureau_name: null
            mailing_address: 2 Oak Ave
          - external_ref: A3
            debtor_household_key: H2
            debtor_zip: '75003'
            debtor_state: TX
            household_size: 1
            annual_income_cents: 9999999
            is_insolvent: false
            balance_cents: 700000
            accrued_adjustment_cents: 0
            reported_to_bureau: false
            bureau_name: null
            mailing_address: 3 Pine Rd
        as: PortfolioAnalyst
        captures:
          a1: $.data[0].id
          a2: $.data[1].id
          a3: $.data[2].id
      - &id007
        call: POST /api/portfolios/${pf_id}/submit
        payload: {}
        as: PortfolioAnalyst
      - &id008
        call: POST /api/portfolios/${pf_id}/screening-runs
        payload:
          policy_id: ${pol_id}
        as: EligibilityOfficer
        captures:
          run_id: $.data.id
      - &id009
        call: POST /api/screening-runs/${run_id}/execute
        payload: {}
        as: EligibilityOfficer
      - &id010
        call: POST /api/portfolios/${pf_id}/price-quote
        payload: {}
        as: PortfolioAnalyst
        captures:
          pf_v_priced: $.data.version
      - &id011
        call: POST /api/portfolios/${pf_id}/contracts
        payload:
          collection_prohibition: true
          no_resale: true
          expected_portfolio_version: ${pf_v_priced}
        as: ContractManager
        captures:
          con_id: $.data.id
      - &id012
        call: POST /api/contracts/${con_id}/execute
        payload: {}
        as: ContractManager
        as_user_id: cm-1
      - &id013
        call: POST /api/contracts/${con_id}/settle
        payload: {}
        as: FinanceOfficer
        as_user_id: fin-9
      - &id014
        call: POST /api/donor-campaigns
        payload:
          name: General Relief Fund
          earmark_type: GENERAL
          goal_cents: 1000000
        as: DonorRelationsOfficer
        captures:
          camp_id: $.data.id
      - &id015
        call: POST /api/donor-campaigns/${camp_id}/donations
        payload:
          donor_name: Dee Donor
          donor_email: dee@x.com
          gross_cents: 1600000
        as: DonorRelationsOfficer
        captures:
          don_id: $.data.id
      - &id016
        call: POST /api/donations/${don_id}/receive
        payload: {}
        as: FinanceOfficer
      - &id017
        call: GET /api/portfolios/${pf_id}
        payload: {}
        as: FinanceOfficer
        captures:
          pf_v_settled: $.data.version
      - &id018
        call: POST /api/portfolios/${pf_id}/abolishment-batches
        payload:
          account_ids:
          - ${a1}
          - ${a2}
          expected_portfolio_version: ${pf_v_settled}
        as: FinanceOfficer
        captures:
          batch_id: $.data.id
      - &id019
        call: POST /api/abolishment-batches/${batch_id}/commit
        payload: {}
        as: FinanceOfficer
      - &id020
        call: POST /api/abolishment-batches/${batch_id}/finalize
        payload: {}
        as: FinanceOfficer
      trigger:
      - call: GET /api/accounts/${a1}
        payload: {}
        as: FinanceOfficer
      - call: GET /api/portfolios/${pf_id}
        payload: {}
        as: FinanceOfficer
      assert:
      - DebtAccount.${a1}.balance_cents == 1000000 (provisional value)
      - DebtAccount.${a1}.abolished_amount_cents == 1050000 (final value = balance + accrued_adjustment 50000)
      - DebtAccount.${a1}.lifecycle_status == ABOLISHED
      - Portfolio.${pf_id}.eligible_face_value_cents == 1500000 (provisional sum over ELIGIBLE accounts, excludes adjustments)
      - Portfolio.${pf_id}.abolished_face_value_cents == 1550000 (final sum, != eligible_face_value_cents because of A1's +50000 adjustment)
      - Portfolio.${pf_id}.quoted_price_cents == 37500 (tiered quote on the provisional 1500000 at 0.025, HOSPITAL factor 1.0)
  - name: impact_household_counting_per_account_vs_deduped
    grounds:
    - calculations.impact_household_metrics
    - entities.ImpactReport.fields.households_relieved
    - entities.ImpactReport.fields.counting_variant
