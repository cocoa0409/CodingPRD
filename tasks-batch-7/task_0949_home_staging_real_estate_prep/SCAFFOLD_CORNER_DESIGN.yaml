            - "InventoryPull.${pull_id}.requested_unit_count == 4"
            - "InventoryPull.${pull_id}.filled_unit_count == 4"
            - "InventoryPull.${pull_id}.fill_rate == 1.0000"
            - "PullLine.${line_v}.state == ALLOCATED"
            - "PullLine.${line_v}.monthly_rate == 459.00"

