scaffold_difficulty_design:

  - rule_id: dual_variant_calc
    instances:
      - name: travel_cost_planning_vs_execution_diverge
        grounds:
          - calculations.travel_cost_estimate
          - state_machines.PickTask.QUEUED_to_DISPATCHED
          - state_machines.PickTask.DISPATCHED_to_DELIVERED
        distinguishing_aspect: |
          Travel-cost has two valid algorithms on the SAME inputs that produce
          different numbers because the planning variant caps the congestion
          term at CONGESTION_CAP=3 and omits DETOUR_FLAT while the execution
          variant is uncapped; pinned on the PickTask entity domain.
        test_recipe:
          setup:
            - "Two zones Z1 at (0,0) and Z2 at (10,0); Pod P1 in Z1 capacity 5; Sku SKU1 HIGH; InventorySlot on (P1,SKU1) qty 20; PickStation ST1 in Z2 max_queue 10; CustomerOrder OBG (background, line qty 1) and O1 (line qty 1), both cutoff 2026-09-02; DriveUnits DU1..DU4 in Z1."
            - "Background: PickTask PT-BG on (OBG line, P1, ST1, qty 1) sequenced and dispatched using one unit so congestion == 1 at the time PT1 is dispatched."
          setup_api_calls:
            - call: "POST /fleet/_clock/set_current_utc"
              payload: { to_iso8601: "2026-09-01T08:00:00Z" }
              as: FleetAdmin
            - call: "POST /fleet/zones"
              payload: { zone_code: "Z1", grid_x: 0, grid_y: 0, width: 10, height: 10, max_human_occupancy: 2 }
              as: FleetAdmin
              captures: { z1: $.data.id }
            - call: "POST /fleet/zones"
              payload: { zone_code: "Z2", grid_x: 10, grid_y: 0, width: 10, height: 10, max_human_occupancy: 2 }
              as: FleetAdmin
              captures: { z2: $.data.id }
            - call: "POST /fleet/drive-units"
              payload: { unit_code: "DU1", home_zone_id: "${z1}" }
              as: FleetAdmin
              captures: { du1: $.data.id }
            - call: "POST /fleet/drive-units"
              payload: { unit_code: "DU2", home_zone_id: "${z1}" }
              as: FleetAdmin
              captures: { du2: $.data.id }
            - call: "POST /fleet/pods"
              payload: { pod_code: "P1", zone_id: "${z1}", slot_capacity: 5 }
              as: FleetAdmin
              captures: { p1: $.data.id }
            - call: "POST /fleet/skus"
              payload: { sku_code: "SKU1", velocity_class: "HIGH" }
              as: FleetAdmin
              captures: { sku1: $.data.id, sku1_v: $.data.version }
            - call: "POST /fleet/pick-stations"
              payload: { station_code: "ST1", zone_id: "${z2}", max_queue: 10 }
              as: FleetAdmin
              captures: { st1: $.data.id }
            - call: "POST /fleet/stow-tasks"
              payload: { sku_id: "${sku1}", quantity: 20 }
              as: FlowController
              captures: { stow1: $.data.id }
            - call: "POST /fleet/stow-tasks/${stow1}/place"
              payload: { expected_sku_version: "${sku1_v}" }
              as: FlowController
            - call: "POST /fleet/stow-tasks/${stow1}/confirm"
              payload: {}
              as: StationOperator
            - call: "POST /fleet/customer-orders"
              payload: { order_code: "OBG", cutoff_at: "2026-09-02T00:00:00Z", priority: 1, lines: [{sku_id: "${sku1}", quantity: 1}] }
              as: FlowController
              captures: { obg: $.data.id }
            - call: "POST /fleet/customer-orders"
              payload: { order_code: "O1", cutoff_at: "2026-09-02T00:00:00Z", priority: 1, lines: [{sku_id: "${sku1}", quantity: 1}] }
              as: FlowController
              captures: { o1: $.data.id }
            - call: "GET /fleet/customer-orders/${obg}/lines"
              as: FlowController
              captures: { obg_line: "$.data[0].id" }
            - call: "POST /fleet/pick-tasks"
              payload: { order_id: "${obg}", line_id: "${obg_line}", pod_id: "${p1}", station_id: "${st1}", quantity: 1 }
              as: FlowController
              captures: { pt_bg: $.data.id }
            - call: "GET /fleet/pick-stations/${st1}"
              as: FlowController
              captures: { st1_v0: $.data.version }
            - call: "POST /fleet/pick-tasks/${pt_bg}/sequence"
              payload: { expected_station_version: "${st1_v0}" }
              as: FlowController
            - call: "POST /fleet/pick-tasks/${pt_bg}/dispatch"
              payload: {}
              as: FlowController
          trigger:
            - call: "GET /fleet/customer-orders/${o1}/lines"
              as: FlowController
              captures: { o1_line: "$.data[0].id" }
            - call: "POST /fleet/pick-tasks"
              payload: { order_id: "${o1}", line_id: "${o1_line}", pod_id: "${p1}", station_id: "${st1}", quantity: 1 }
              as: FlowController
              captures: { pt1: $.data.id }
            - call: "GET /fleet/pick-stations/${st1}"
              as: FlowController
              captures: { st1_v1: $.data.version }
            - call: "POST /fleet/pick-tasks/${pt1}/sequence"
              payload: { expected_station_version: "${st1_v1}" }
              as: FlowController
            - call: "POST /fleet/pick-tasks/${pt1}/dispatch"
              payload: {}
              as: FlowController
              captures: { pt1_est: $.data.est_cost }
            - call: "POST /fleet/pick-tasks/${pt1}/deliver"
              payload: {}
              as: FlowController
              captures: { pt1_actual: $.data.actual_cost }
          assert:
            - "PickTask.${pt1}.est_cost == 11.00"
            - "PickTask.${pt1}.actual_cost == 12.50"
            - "PickTask.${pt1}.est_cost != PickTask.${pt1}.actual_cost"

      - name: stow_density_vs_accessibility_pick_different_pods
        grounds:
          - calculations.stow_density_score
          - state_machines.StowTask.PENDING_to_PLACED
        distinguishing_aspect: |
          Stow placement has two valid scoring variants on the SAME candidate
          pods that select different winners because the density_first variant
          (LOW velocity SKUs) rewards slot-filling while accessibility_first
          (HIGH/MEDIUM) rewards low accessibility_rank; pinned on the Pod /
          InventorySlot entity domain — a different domain from PickTask travel.
        test_recipe:
          setup:
            - "Two zones Z1 at (0,0) and Z2 at (5,0). Pod PA in Z1 with slot_capacity=10 and 8 slots_used (density 0.8) holding 2 existing slots of SKU-A accessibility_rank 5 each. Pod PB in Z2 with slot_capacity=10 and 1 slot_used (density 0.1) holding 1 slot of SKU-A accessibility_rank 1. Sku LOW_SKU velocity_class=LOW; Sku HIGH_SKU velocity_class=HIGH. Both SKUs have InventorySlots on PA and PB."
          setup_api_calls:
            - call: "POST /fleet/_clock/set_current_utc"
              payload: { to_iso8601: "2026-09-01T08:00:00Z" }
              as: FleetAdmin
            - call: "POST /fleet/zones"
              payload: { zone_code: "Z1", grid_x: 0, grid_y: 0, width: 10, height: 10, max_human_occupancy: 2 }
              as: FleetAdmin
              captures: { z1: $.data.id }
            - call: "POST /fleet/zones"
              payload: { zone_code: "Z2", grid_x: 5, grid_y: 0, width: 10, height: 10, max_human_occupancy: 2 }
              as: FleetAdmin
              captures: { z2: $.data.id }
            - call: "POST /fleet/pods"
              payload: { pod_code: "PA", zone_id: "${z1}", slot_capacity: 10 }
              as: FleetAdmin
              captures: { pa: $.data.id }
            - call: "POST /fleet/pods"
              payload: { pod_code: "PB", zone_id: "${z2}", slot_capacity: 10 }
              as: FleetAdmin
              captures: { pb: $.data.id }
            - call: "POST /fleet/skus"
              payload: { sku_code: "LOW_SKU", velocity_class: "LOW" }
              as: FleetAdmin
              captures: { sku_low: $.data.id, sku_low_v: $.data.version }
            - call: "POST /fleet/skus"
              payload: { sku_code: "HIGH_SKU", velocity_class: "HIGH" }
              as: FleetAdmin
              captures: { sku_high: $.data.id, sku_high_v: $.data.version }
            - call: "POST /fleet/stow-tasks"
              payload: { sku_id: "${sku_low}", quantity: 1 }
              as: FlowController
              captures: { stow_low_1: $.data.id }
            - call: "POST /fleet/stow-tasks/${stow_low_1}/place"
              payload: { expected_sku_version: "${sku1_v}" }
              as: FlowController
              captures: { stow_low_1_pod: $.data.pod_id }
            - call: "POST /fleet/stow-tasks/${stow_low_1}/confirm"
              payload: {}
              as: StationOperator
          trigger:
            - call: "POST /fleet/stow-tasks"
              payload: { sku_id: "${sku_high}", quantity: 1 }
              as: FlowController
              captures: { stow_high_1: $.data.id }
            - call: "POST /fleet/stow-tasks/${stow_high_1}/place"
              payload: { expected_sku_version: "${sku_high_v}" }
              as: FlowController
              captures: { stow_high_1_pod: $.data.pod_id }
          assert:
            - "StowTask.${stow_low_1}.pod_id != StowTask.${stow_high_1}.pod_id"
            - "density_first selected pod PA (slot-filling) for LOW_SKU"
            - "accessibility_first selected pod PB (better accessibility) for HIGH_SKU"

  - rule_id: combinatorial_formula
    instances:
      - name: workload_smoothing_multi_input_score
        grounds:
          - calculations.workload_smoothing_sequence
        distinguishing_aspect: |
          Mode (a) — formula with >= 3 inputs and non-linear interaction:
          lateness uses max(0, ...) conditional on cutoff_at, disruption is a
          sum over absolute reorder distances, and fatigue scales with tasks
          completed; combinatorial across insertion positions.
        test_recipe:
          setup:
            - "Zone Z1 at (0,0); Pod P1 slot_capacity 50; Sku SKU1 velocity LOW; InventorySlot quantity 50; PickStation ST1 max_queue 10; three orders O-URGENT (priority 100, cutoff 2026-09-01T08:10:00Z), O-MID (priority 50, cutoff 2026-09-01T09:00:00Z), O-LOW (priority 1, cutoff 2026-09-02T00:00:00Z). Two existing PickTasks for O-MID and O-LOW already QUEUED at ST1 with sequence_index 0 and 1 respectively."
          setup_api_calls:
            - call: "POST /fleet/_clock/set_current_utc"
              payload: { to_iso8601: "2026-09-01T08:00:00Z" }
              as: FleetAdmin
            - call: "POST /fleet/zones"
              payload: { zone_code: "Z1", grid_x: 0, grid_y: 0, width: 10, height: 10, max_human_occupancy: 2 }
              as: FleetAdmin
              captures: { z1: $.data.id }
            - call: "POST /fleet/pods"
              payload: { pod_code: "P1", zone_id: "${z1}", slot_capacity: 50 }
              as: FleetAdmin
              captures: { p1: $.data.id }
            - call: "POST /fleet/skus"
              payload: { sku_code: "SKU1", velocity_class: "LOW" }
              as: FleetAdmin
              captures: { sku1: $.data.id, sku1_v: $.data.version }
            - call: "POST /fleet/pick-stations"
              payload: { station_code: "ST1", zone_id: "${z1}", max_queue: 10 }
              as: FleetAdmin
              captures: { st1: $.data.id, st1_v0: $.data.version }
            - call: "POST /fleet/stow-tasks"
              payload: { sku_id: "${sku1}", quantity: 50 }
              as: FlowController
              captures: { stow1: $.data.id }
            - call: "POST /fleet/stow-tasks/${stow1}/place"
              payload: { expected_sku_version: "${sku1_v}" }
              as: FlowController
            - call: "POST /fleet/stow-tasks/${stow1}/confirm"
              payload: {}
              as: StationOperator
            - call: "POST /fleet/customer-orders"
              payload: { order_code: "O-MID", cutoff_at: "2026-09-01T09:00:00Z", priority: 50, lines: [{sku_id: "${sku1}", quantity: 1}] }
              as: FlowController
              captures: { omid: $.data.id }
            - call: "POST /fleet/customer-orders"
              payload: { order_code: "O-LOW", cutoff_at: "2026-09-02T00:00:00Z", priority: 1, lines: [{sku_id: "${sku1}", quantity: 1}] }
              as: FlowController
              captures: { olow: $.data.id }
            - call: "POST /fleet/customer-orders"
              payload: { order_code: "O-URGENT", cutoff_at: "2026-09-01T08:10:00Z", priority: 100, lines: [{sku_id: "${sku1}", quantity: 1}] }
              as: FlowController
              captures: { ourgent: $.data.id }
            - call: "GET /fleet/customer-orders/${omid}/lines"
              as: FlowController
              captures: { omid_line: "$.data[0].id" }
            - call: "GET /fleet/customer-orders/${olow}/lines"
              as: FlowController
              captures: { olow_line: "$.data[0].id" }
            - call: "POST /fleet/pick-tasks"
              payload: { order_id: "${omid}", line_id: "${omid_line}", pod_id: "${p1}", station_id: "${st1}", quantity: 1 }
              as: FlowController
              captures: { pt_mid: $.data.id }
            - call: "GET /fleet/pick-stations/${st1}"
              as: FlowController
              captures: { st1_v1: $.data.version }
            - call: "POST /fleet/pick-tasks/${pt_mid}/sequence"
              payload: { expected_station_version: "${st1_v1}" }
              as: FlowController
              captures: { pt_mid_seq: $.data.sequence_index }
            - call: "POST /fleet/pick-tasks"
              payload: { order_id: "${olow}", line_id: "${olow_line}", pod_id: "${p1}", station_id: "${st1}", quantity: 1 }
              as: FlowController
              captures: { pt_low: $.data.id }
            - call: "GET /fleet/pick-stations/${st1}"
              as: FlowController
              captures: { st1_v2: $.data.version }
            - call: "POST /fleet/pick-tasks/${pt_low}/sequence"
              payload: { expected_station_version: "${st1_v2}" }
              as: FlowController
              captures: { pt_low_seq: $.data.sequence_index }
          trigger:
            - call: "GET /fleet/customer-orders/${ourgent}/lines"
              as: FlowController
              captures: { ourgent_line: "$.data[0].id" }
            - call: "POST /fleet/pick-tasks"
              payload: { order_id: "${ourgent}", line_id: "${ourgent_line}", pod_id: "${p1}", station_id: "${st1}", quantity: 1 }
              as: FlowController
              captures: { pt_urg: $.data.id }
            - call: "GET /fleet/pick-stations/${st1}"
              as: FlowController
              captures: { st1_v3: $.data.version }
            - call: "POST /fleet/pick-tasks/${pt_urg}/sequence"
              payload: { expected_station_version: "${st1_v3}" }
              as: FlowController
              captures: { pt_urg_seq: $.data.sequence_index }
          assert:
            - "PickTask.${pt_urg}.sequence_index == 0"
            - "urgent task inserted ahead of lower-priority queued tasks because lateness dominates"

      - name: charge_credit_per_tier_then_sum_rounding
        grounds:
          - calculations.charge_cycle_credit
          - state_machines.ChargingSession.OPEN_to_CLOSED
        distinguishing_aspect: |
          Mode (b) — nested rounding where the order matters: tier credits are
          rounded per tier THEN summed; the alternate (sum then round) would
          yield a different integer percent. Scaffold pins round-per-tier-then-sum.
        test_recipe:
          setup:
            - "Zone Z1; Charger C1 slot_count=2; DriveUnit DU1 battery 40. ChargingSession opened at 2026-09-01T08:00:00Z; clock advanced to 2026-09-01T08:47:00Z (47 minutes duration)."
            - "Tier1: round(min(47,30) * 0.5) = round(15.0) = 15; tier2: round(max(0, min(47,90)-30) * 0.3) = round(17*0.3)=round(5.1)=5; tier3: round(max(0,47-90)*0.1)=0. Total charge_credit_pct = 20."
          setup_api_calls:
            - call: "POST /fleet/_clock/set_current_utc"
              payload: { to_iso8601: "2026-09-01T08:00:00Z" }
              as: FleetAdmin
            - call: "POST /fleet/zones"
              payload: { zone_code: "Z1", grid_x: 0, grid_y: 0, width: 10, height: 10, max_human_occupancy: 2 }
              as: FleetAdmin
              captures: { z1: $.data.id }
            - call: "POST /fleet/chargers"
              payload: { zone_id: "${z1}", slot_count: 2 }
              as: FleetAdmin
              captures: { c1: $.data.id }
            - call: "POST /fleet/drive-units"
              payload: { unit_code: "DU1", home_zone_id: "${z1}" }
              as: FleetAdmin
              captures: { du1: $.data.id }
            - call: "POST /fleet/charging-sessions"
              payload: { charger_id: "${c1}", drive_unit_id: "${du1}" }
              as: FlowController
              captures: { cs1: $.data.id }
            - call: "POST /fleet/_clock/set_current_utc"
              payload: { to_iso8601: "2026-09-01T08:47:00Z" }
              as: FleetAdmin
          trigger:
            - call: "POST /fleet/charging-sessions/${cs1}/close"
              payload: {}
              as: FlowController
              captures: { cs1_credit: $.data.charge_credit_pct }
          assert:
            - "ChargingSession.${cs1}.charge_credit_pct == 20"
            - "DriveUnit.${du1}.battery_pct == 60"
            - "DriveUnit.${du1}.charge_cycle_count == 1"

  - rule_id: non_linear_state_machine
    instances:
      - name: drive_unit_cyclic_active_charging_maintenance_active
        grounds:
          - state_machines.DriveUnit
        distinguishing_aspect: |
          DriveUnit has a cycle ACTIVE -> CHARGING -> ACTIVE -> MAINTENANCE ->
          ACTIVE (not a one-way pipeline), exercised by completing a charge and
          then opening and completing a maintenance window.
        test_recipe:
          setup:
            - "Zone Z1; Charger C1 slot_count 1; DriveUnit DU1 ACTIVE battery 50. Clock 2026-09-01T08:00:00Z."
          setup_api_calls:
            - call: "POST /fleet/_clock/set_current_utc"
              payload: { to_iso8601: "2026-09-01T08:00:00Z" }
              as: FleetAdmin
            - call: "POST /fleet/zones"
              payload: { zone_code: "Z1", grid_x: 0, grid_y: 0, width: 10, height: 10, max_human_occupancy: 2 }
              as: FleetAdmin
              captures: { z1: $.data.id }
            - call: "POST /fleet/chargers"
              payload: { zone_id: "${z1}", slot_count: 1 }
              as: FleetAdmin
              captures: { c1: $.data.id }
            - call: "POST /fleet/drive-units"
              payload: { unit_code: "DU1", home_zone_id: "${z1}" }
              as: FleetAdmin
              captures: { du1: $.data.id }
            - call: "POST /fleet/charging-sessions"
              payload: { charger_id: "${c1}", drive_unit_id: "${du1}" }
              as: FlowController
              captures: { cs1: $.data.id }
            - call: "POST /fleet/_clock/set_current_utc"
              payload: { to_iso8601: "2026-09-01T09:00:00Z" }
              as: FleetAdmin
            - call: "POST /fleet/charging-sessions/${cs1}/close"
              payload: {}
              as: FlowController
            - call: "POST /fleet/maintenance-windows"
              payload: { drive_unit_id: "${du1}", starts_at: "2026-09-01T09:00:00Z", ends_at: "2026-09-01T09:30:00Z", kind: "CORRECTIVE" }
              as: MaintenanceTech
              captures: { mw1: $.data.id }
          trigger:
            - call: "POST /fleet/_clock/set_current_utc"
              payload: { to_iso8601: "2026-09-01T09:15:00Z" }
              as: FleetAdmin
            - call: "POST /fleet/maintenance-windows/${mw1}/complete"
              payload: {}
              as: MaintenanceTech
          assert:
            - "DriveUnit.${du1}.status == ACTIVE"
            - "MaintenanceWindow.${mw1}.status == COMPLETE"
            - "DriveUnit.${du1}.status cycled ACTIVE -> CHARGING -> ACTIVE -> MAINTENANCE -> ACTIVE"

      - name: floor_exception_branching_fork_join
        grounds:
          - state_machines.FloorException
          - state_machines.HumanEntryPermit
        distinguishing_aspect: |
          FloorException branches OPEN -> {TRIAGED_ROBOT, TRIAGED_HUMAN} ->
          RESOLVED with divergent side-effect sets: the HUMAN branch additionally
          requires a granted-then-released HumanEntryPermit before resolution,
          the ROBOT branch forbids it.
        test_recipe:
          setup:
            - "Zone Z1 with max_human_occupancy 1; DriveUnit DU1 ACTIVE; FloorException EX1 kind=BLOCKED_PATH in Z1; FloorException EX2 kind=DROPPED_ITEM in Z1."
          setup_api_calls:
            - call: "POST /fleet/_clock/set_current_utc"
              payload: { to_iso8601: "2026-09-01T08:00:00Z" }
              as: FleetAdmin
            - call: "POST /fleet/zones"
              payload: { zone_code: "Z1", grid_x: 0, grid_y: 0, width: 10, height: 10, max_human_occupancy: 1 }
              as: FleetAdmin
              captures: { z1: $.data.id }
            - call: "POST /fleet/drive-units"
              payload: { unit_code: "DU1", home_zone_id: "${z1}" }
              as: FleetAdmin
              captures: { du1: $.data.id }
            - call: "POST /fleet/floor-exceptions"
              payload: { kind: "BLOCKED_PATH", zone_id: "${z1}" }
              as: FloorSupervisor
              captures: { ex1: $.data.id }
            - call: "POST /fleet/floor-exceptions"
              payload: { kind: "DROPPED_ITEM", zone_id: "${z1}" }
              as: FloorSupervisor
              captures: { ex2: $.data.id }
            - call: "POST /fleet/floor-exceptions/${ex1}/triage"
              payload: { branch: "ROBOT" }
              as: FloorSupervisor
            - call: "POST /fleet/floor-exceptions/${ex2}/triage"
              payload: { branch: "HUMAN" }
              as: FloorSupervisor
            - call: "POST /fleet/human-entry-permits"
              payload: { zone_id: "${z1}", exception_id: "${ex2}", starts_at: "2026-09-01T08:30:00Z", ends_at: "2026-09-01T09:00:00Z" }
              as: FloorSupervisor
              captures: { hep1: $.data.id }
            - call: "POST /fleet/human-entry-permits/${hep1}/grant"
              payload: {}
              as: SafetyOfficer
            - call: "POST /fleet/_clock/set_current_utc"
              payload: { to_iso8601: "2026-09-01T09:00:00Z" }
              as: FleetAdmin
            - call: "POST /fleet/human-entry-permits/${hep1}/release"
              payload: {}
              as: SafetyOfficer
          trigger:
            - call: "POST /fleet/floor-exceptions/${ex1}/resolve"
              payload: { corrective_outcome: "RESTORE" }
              as: FloorSupervisor
            - call: "POST /fleet/floor-exceptions/${ex2}/resolve"
              payload: { corrective_outcome: "RESTORE" }
              as: FloorSupervisor
          assert:
            - "FloorException.${ex1}.status == RESOLVED"
            - "FloorException.${ex2}.status == RESOLVED"
            - "FloorZone.${z1}.posture == OPEN"
            - "DriveUnit.${du1}.status == ACTIVE"

  - rule_id: transitive_cascade
    instances:
      - name: human_entry_permit_cascades_zone_units_picktasks
        grounds:
          - state_machines.HumanEntryPermit.REQUESTED_to_ACTIVE
          - state_machines.FloorZone.RESTRICTED_to_FROZEN
          - state_machines.DriveUnit.ACTIVE_to_PARKED
          - state_machines.PickTask
        distinguishing_aspect: |
          Depth >= 3 cascade: permit grant -> zone FROZEN -> DriveUnits PARKED
          -> QUEUED PickTasks on zone pods resequenced. Each link is caused by
          the previous link, not by the original grant.
        test_recipe:
          setup:
            - "Zone Z1 (max_human_occupancy 1) and Z2. Pod P1 in Z1. DriveUnit DU1 home Z1 ACTIVE. Sku SKU1 with 5 units on P1. PickStation ST2 in Z2 max_queue 10. CustomerOrder O1 line for SKU1 qty 1 cutoff 2026-09-02. PickTask PT1 CREATED -> QUEUED at ST2 with pod P1."
            - "FloorException EX1 kind=BLOCKED_PATH zone Z1, triaged HUMAN. HumanEntryPermit HEP1 for Z1 referencing EX1, REQUESTED, window [2026-09-01T09:00:00Z, 2026-09-01T10:00:00Z]."
          setup_api_calls:
