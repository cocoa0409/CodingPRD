# =============================================================================
# Task 0134 — Auto Loan & Lease End API
# Scaffold seed tables (§1.0–§1.7). Difficulty design lives in
# SCAFFOLD_DIFFICULTY_DESIGN.yaml as required by the scaffold-generator spec.
# =============================================================================

scenario: |
  134. Auto Loan & Lease End: credit tier (FICO Tier), down payment/monthly payment,
  Gap insurance, mileage overage penalty, lease-end renewal/purchase/return,
  Disposition Fee, default rate

domain_name: auto-loan-lease-end
api_prefix: /customers

# -----------------------------------------------------------------------------
# Complexity Profile (§0.1–§0.4)
# -----------------------------------------------------------------------------
complexity_profile:
  primary_archetype: pricing_engine
  secondary_archetype: compliance_audit
  complexity_layers:
    - dual_variant_calculation
    - rate_threshold_triggers
    - cascading_side_effects
    - scheduled_deferred_actions
    - derived_field_reconciliation

  entity_topology: hybrid
  state_machine_shape: branching          # LeaseContract MATURED → {PURCHASED, RENEWED, RETURNED}
  relationship_patterns:
    - one_to_many                          # Customer 1—* Contract, Contract 1—* Payment
    - cross_aggregate                      # GapInsuranceRider links to either LoanContract or LeaseContract

  role_model: peer_roles                   # Customer / LoanOfficer / FinanceManager / CollectionsAgent / PlatformAdmin
  consistency_model: immediate

  difficulty_level: advanced               # Per §0.4: 6–10 entities, 12–22 endpoints, 10–18 errors

# -----------------------------------------------------------------------------
# §1.0 Response Envelope (FIXED — VERBATIM)
# -----------------------------------------------------------------------------
response_envelope:
  success: |
    { "meta": { "api_request_id": "req_xxx", "api_request_timestamp": "ISO8601" },
      "response_type": "object" | "array", "data": {} }
  error: |
    { "meta": { ... }, "response_type": "error",
      "data": { "error_id": "ERR_XXX", "message": "..." } }
  pagination_fields: ["limit", "offset", "total_count", "has_more"]
  pagination_defaults: { limit: 10, min: 1, max: 100, offset: 0 }

# =============================================================================
# §1.1 Entity-Relationship Table
# =============================================================================
entities:
  - name: Customer
    parent: null
    common_fields: true
    fields:
      - { name: id, type: string, source: system, description: "Server-minted UUID, no type prefix" }
      - { name: full_name, type: string, source: input, description: "Legal name on contracts" }
      - { name: fico_score, type: integer, source: input, description: "FICO credit score 300–850 inclusive", constraints: "300 <= fico_score <= 850" }
      - { name: fico_tier, type: enum, source: computed, description: "Derived from fico_score via §1.3 fico_tier_assignment", constraints: "TIER_1 | TIER_2 | TIER_3 | TIER_4 | TIER_5_DECLINED" }
      - { name: default_count, type: integer, source: computed, default: 0, description: "Lifetime count of Payment rows that reached status=DEFAULTED for this customer" }
      - { name: default_rate, type: number, source: computed, default: 0.0, description: "default_count / max(1, lifetime_payment_count); 6 decimal places" }
      - { name: lifetime_payment_count, type: integer, source: computed, default: 0, description: "Total Payment rows whose status ever reached PAID, LATE or DEFAULTED" }
      - { name: status, type: enum, source: system, default: ACTIVE, description: "Customer lifecycle", constraints: "ACTIVE | SUSPENDED" }
      - { name: clock_day_index, type: integer, source: system, default: 0, description: "Per-customer deterministic clock; advanced ONLY by POST /customers/{id}/clock/advance" }

  - name: Vehicle
    parent: null
    common_fields: true
    fields:
      - { name: id, type: string, source: system, description: "Server-minted UUID" }
      - { name: vin, type: string, source: input, description: "17-character VIN; unique across Vehicle entities" }
      - { name: model, type: string, source: input, description: "Vehicle model label" }
      - { name: msrp_cents, type: integer, source: input, description: "Manufacturer suggested retail price in cents; > 0" }
      - { name: residual_factor_bps, type: integer, source: input, description: "Residual value as basis points of MSRP for 36-month lease (e.g., 5500 = 55%); 1000 <= factor <= 8000" }
      - { name: status, type: enum, source: system, default: AVAILABLE, description: "AVAILABLE | RESERVED | SOLD | LEASED" }

  - name: LoanContract
    parent: Customer
    common_fields: true
    fields:
      - { name: id, type: string, source: system, description: "Server-minted UUID" }
      - { name: customer_id, type: string, source: system, description: "Owning Customer.id" }
      - { name: vehicle_id, type: string, source: input, description: "Financed Vehicle.id" }
      - { name: principal_cents, type: integer, source: computed, description: "Vehicle.msrp_cents - down_payment_cents at origination" }
      - { name: down_payment_cents, type: integer, source: input, description: "Customer down payment; must satisfy §1.3 minimum_down_payment_loan for the FICO tier" }
      - { name: term_months, type: integer, source: input, description: "Loan term in months; one of {36, 48, 60, 72}" }
      - { name: apr_bps, type: integer, source: computed, description: "Annual percentage rate in basis points; sourced from §1.3 fico_tier_apr at origination plus delinquency uplift" }
      - { name: base_apr_bps, type: integer, source: computed, description: "Origination APR before any default uplift; immutable after APPROVED" }
      - { name: monthly_payment_cents, type: integer, source: computed, description: "Result of §1.3 loan_monthly_payment using current apr_bps; recomputed on default uplift" }
      - { name: remaining_principal_cents, type: integer, source: computed, description: "Outstanding principal updated by each PAID Payment via §1.3 amortization_step" }
      - { name: total_principal_paid_cents, type: integer, source: computed, default: 0, description: "Running sum of principal portion of every PAID payment" }
      - { name: total_interest_paid_cents, type: integer, source: computed, default: 0, description: "Running sum of interest portion of every PAID payment" }
      - { name: payments_made_count, type: integer, source: computed, default: 0, description: "Count of child Payment rows with status=PAID" }
      - { name: payments_scheduled_count, type: integer, source: system, description: "Equal to term_months at APPROVED transition" }
      - { name: status, type: enum, source: system, default: PENDING_APPROVAL, description: "PENDING_APPROVAL | APPROVED | ACTIVE | PAID_OFF | DEFAULTED | CHARGED_OFF" }
      - { name: origination_day_index, type: integer, source: system, description: "Customer.clock_day_index at APPROVED" }

  - name: LeaseContract
    parent: Customer
    common_fields: true
    fields:
      - { name: id, type: string, source: system, description: "Server-minted UUID" }
      - { name: customer_id, type: string, source: system, description: "Owning Customer.id" }
      - { name: vehicle_id, type: string, source: input, description: "Leased Vehicle.id" }
      - { name: capitalized_cost_cents, type: integer, source: computed, description: "Vehicle.msrp_cents - down_payment_cents at origination" }
      - { name: down_payment_cents, type: integer, source: input, description: "Customer down payment; must satisfy §1.3 minimum_down_payment_lease for the FICO tier" }
      - { name: term_months, type: integer, source: input, description: "Lease term; one of {24, 36, 48}" }
      - { name: mileage_allowance, type: integer, source: input, description: "Total contractual miles for the lease (e.g., 36000); 10000 <= value <= 75000" }
      - { name: money_factor_micro, type: integer, source: computed, description: "Money factor expressed in micro-units (e.g., 0.00250 → 2500); sourced from §1.3 fico_tier_money_factor" }
      - { name: residual_value_cents, type: integer, source: computed, description: "floor(Vehicle.msrp_cents * Vehicle.residual_factor_bps / 10000); immutable after APPROVED" }
      - { name: monthly_payment_cents, type: integer, source: computed, description: "Result of §1.3 lease_monthly_payment" }
      - { name: payments_made_count, type: integer, source: computed, default: 0, description: "Count of child Payment rows with status=PAID" }
      - { name: payments_scheduled_count, type: integer, source: system, description: "Equal to term_months at APPROVED transition" }
      - { name: status, type: enum, source: system, default: PENDING_APPROVAL, description: "PENDING_APPROVAL | APPROVED | ACTIVE | MATURED | PURCHASED | RENEWED | RETURNED | CLOSED | DEFAULTED" }
      - { name: lease_end_election, type: enum, source: system, default: null, description: "Set when MATURED→{PURCHASED|RENEWED|RETURNED} transition fires", constraints: "null | PURCHASE | RENEW | RETURN" }
      - { name: origination_day_index, type: integer, source: system, description: "Customer.clock_day_index at APPROVED" }
      - { name: maturity_day_index, type: integer, source: computed, description: "origination_day_index + term_months * 30" }

  - name: Payment
    parent: null
    common_fields: false
    fields:
      - { name: id, type: string, source: system, description: "Server-minted UUID" }
      - { name: created_at, type: datetime, source: system, description: "Immutable creation timestamp" }
      - { name: customer_id, type: string, source: system, description: "Denormalized for default-count rollup" }
      - { name: contract_id, type: string, source: system, description: "Either LoanContract.id or LeaseContract.id" }
      - { name: contract_type, type: enum, source: system, description: "LOAN | LEASE" }
      - { name: period_index, type: integer, source: system, description: "1-based payment index in the contract's schedule" }
      - { name: due_day_index, type: integer, source: system, description: "Customer.clock_day_index at which the payment becomes due (origination + period_index*30)" }
      - { name: amount_due_cents, type: integer, source: system, description: "Snapshot of monthly_payment_cents at the time the Payment row was generated" }
      - { name: principal_portion_cents, type: integer, source: computed, description: "Filled when status→PAID via §1.3 amortization_step (LOAN only; 0 for LEASE)" }
      - { name: interest_portion_cents, type: integer, source: computed, description: "Filled when status→PAID (LOAN only; 0 for LEASE)" }
      - { name: status, type: enum, source: system, default: SCHEDULED, description: "SCHEDULED | PAID | LATE | DEFAULTED" }
      - { name: paid_day_index, type: integer, source: system, description: "Day index when status→PAID; null otherwise" }

  - name: GapInsuranceRider
    parent: null
    common_fields: true
    fields:
      - { name: id, type: string, source: system, description: "Server-minted UUID" }
      - { name: contract_id, type: string, source: input, description: "Either LoanContract.id or LeaseContract.id" }
      - { name: contract_type, type: enum, source: input, description: "LOAN | LEASE" }
      - { name: monthly_premium_cents, type: integer, source: computed, description: "Per §1.3 gap_premium" }
      - { name: status, type: enum, source: system, default: ACTIVE, description: "ACTIVE | CANCELLED | CLAIMED" }
      - { name: claim_payout_cents, type: integer, source: computed, default: 0, description: "Filled when status→CLAIMED" }
      - { name: attached_day_index, type: integer, source: system, description: "Customer.clock_day_index when rider was created" }

  - name: LeaseEndAssessment
    parent: LeaseContract
    common_fields: true
    fields:
      - { name: id, type: string, source: system, description: "Server-minted UUID" }
      - { name: lease_contract_id, type: string, source: system, description: "Parent LeaseContract.id" }
      - { name: odometer_reading, type: integer, source: input, description: "Actual mileage at return; >= 0" }
      - { name: mileage_overage, type: integer, source: computed, description: "max(0, odometer_reading - LeaseContract.mileage_allowance)" }
      - { name: mileage_penalty_cents, type: integer, source: computed, description: "Result of §1.3 mileage_overage_penalty" }
      - { name: disposition_fee_cents, type: integer, source: computed, description: "Result of §1.3 disposition_fee — zero on PURCHASE/RENEW, DISPOSITION_FEE_CENTS on RETURN" }
      - { name: purchase_option_cents, type: integer, source: computed, description: "residual_value_cents + PURCHASE_OPTION_FEE_CENTS when lease_end_election=PURCHASE, else 0" }
      - { name: total_due_cents, type: integer, source: computed, description: "mileage_penalty + disposition_fee + purchase_option (the three are mutually consistent per §1.3 lease_end_total)" }
      - { name: status, type: enum, source: system, default: DRAFT, description: "DRAFT | ISSUED | SETTLED | DISPUTED | RESOLVED" }
      - { name: settled_day_index, type: integer, source: system, description: "Day index when status→SETTLED" }

  - name: DelinquencyEvent
    parent: Customer
    common_fields: false
    fields:
      - { name: id, type: string, source: system, description: "Server-minted UUID" }
      - { name: created_at, type: datetime, source: system, description: "Immutable creation timestamp" }
      - { name: customer_id, type: string, source: system, description: "Owning Customer.id" }
      - { name: payment_id, type: string, source: system, description: "The Payment whose status flipped to DEFAULTED" }
      - { name: default_count_after, type: integer, source: system, description: "Customer.default_count after this event was applied" }
      - { name: apr_uplift_bps_applied, type: integer, source: system, description: "0 if event did not breach UPLIFT_THRESHOLD; otherwise APR_UPLIFT_BPS" }
      - { name: affected_contract_ids, type: array, source: system, description: "List of LoanContract.id whose apr_bps was uplifted by this event" }

  - name: ClockEvent
    parent: Customer
    common_fields: false
    fields:
      - { name: id, type: string, source: system, description: "Server-minted UUID" }
      - { name: created_at, type: datetime, source: system, description: "Immutable creation timestamp" }
      - { name: customer_id, type: string, source: system, description: "Owning Customer.id" }
      - { name: days_advanced, type: integer, source: input, description: "Number of days the clock was advanced by this event; 1 <= value <= 365" }
      - { name: new_clock_day_index, type: integer, source: system, description: "Customer.clock_day_index after the advance" }
      - { name: payments_due_now, type: integer, source: system, description: "Count of child Payment rows whose due_day_index entered the [previous_index, new_index] window" }
      - { name: payments_defaulted_now, type: integer, source: system, description: "Count of Payment rows whose status auto-transitioned LATE→DEFAULTED in this advance" }

# =============================================================================
# §1.2 State Machine Table
# =============================================================================
state_machines:
  - entity: Customer
    field: status
    initial_state: ACTIVE
    terminal_states: []
    transitions:
      - from: ACTIVE
        to: SUSPENDED
        trigger: "POST /customers/{customerId}/suspend"
        actor: PlatformAdmin
        preconditions: ["Customer.status == ACTIVE"]
        side_effects:
          - "All Customer-owned LoanContract / LeaseContract in PENDING_APPROVAL are auto-rejected (status stays PENDING_APPROVAL but blocked from APPROVED)"
          - "No new contracts may be originated"
      - from: SUSPENDED
        to: ACTIVE
        trigger: "POST /customers/{customerId}/reinstate"
        actor: PlatformAdmin
        preconditions: ["Customer.status == SUSPENDED"]
        side_effects: []

  - entity: LoanContract
    field: status
    initial_state: PENDING_APPROVAL
    terminal_states: [PAID_OFF, CHARGED_OFF]
    transitions:
      - from: PENDING_APPROVAL
        to: APPROVED
        trigger: "POST /customers/{customerId}/loan-contracts/{contractId}/approve"
        actor: LoanOfficer
        preconditions:
          - "Customer.status == ACTIVE"
          - "Customer.fico_tier != TIER_5_DECLINED"
          - "down_payment_cents >= §1.3 minimum_down_payment_loan for Customer.fico_tier"
          - "Vehicle.status == AVAILABLE"
        side_effects:
          - "Vehicle.status → SOLD"
          - "base_apr_bps and apr_bps set from §1.3 fico_tier_apr"
          - "monthly_payment_cents computed via §1.3 loan_monthly_payment"
          - "remaining_principal_cents = principal_cents"
          - "payments_scheduled_count = term_months"
          - "origination_day_index = Customer.clock_day_index"
      - from: APPROVED
        to: ACTIVE
        trigger: "POST /customers/{customerId}/loan-contracts/{contractId}/activate"
        actor: LoanOfficer
        preconditions: ["LoanContract.status == APPROVED"]
        side_effects:
          - "Generates term_months child Payment rows with period_index 1..N and due_day_index = origination + period_index*30"
      - from: ACTIVE
        to: PAID_OFF
        trigger: "system (final scheduled Payment.status → PAID AND remaining_principal_cents == 0)"
        actor: system
        preconditions: ["payments_made_count == payments_scheduled_count", "remaining_principal_cents == 0"]
        side_effects:
          - "Customer-facing payoff balance returns 0"
          - "Linked GapInsuranceRider if ACTIVE → auto-CANCELLED (claim window closes with contract)"
      - from: ACTIVE
        to: DEFAULTED
        trigger: "system (third Payment row on this contract reaches status=DEFAULTED)"
        actor: system
        preconditions: ["count of Payment rows on this contract with status=DEFAULTED >= 3"]
        side_effects:
          - "LoanContract.apr_bps += APR_UPLIFT_BPS (see §1.3 default_apr_uplift)"
          - "monthly_payment_cents recomputed for all still-SCHEDULED Payment rows using new apr_bps and current remaining_principal_cents (§1.3 dual variants)"
          - "DelinquencyEvent appended with apr_uplift_bps_applied = APR_UPLIFT_BPS"
      - from: DEFAULTED
        to: ACTIVE
        trigger: "POST /customers/{customerId}/loan-contracts/{contractId}/reinstate"
        actor: CollectionsAgent
        preconditions:
          - "All DEFAULTED child Payment rows have status=PAID"
        side_effects:
          - "apr_bps reset to base_apr_bps + 0 (uplift retained — see §1.3 default_apr_uplift variant note)"
      - from: DEFAULTED
        to: CHARGED_OFF
        trigger: "POST /customers/{customerId}/loan-contracts/{contractId}/charge-off"
        actor: CollectionsAgent
        preconditions: ["LoanContract.status == DEFAULTED"]
        side_effects:
          - "Linked GapInsuranceRider if ACTIVE → status → CANCELLED"
          - "All SCHEDULED Payment rows on this contract → CANCELLED-equivalent (status remains SCHEDULED but contract is terminal; no further amortization)"

  - entity: LeaseContract
    field: status
    initial_state: PENDING_APPROVAL
    terminal_states: [CLOSED]
    transitions:
      - from: PENDING_APPROVAL
        to: APPROVED
        trigger: "POST /customers/{customerId}/lease-contracts/{contractId}/approve"
        actor: LoanOfficer
        preconditions:
          - "Customer.status == ACTIVE"
          - "Customer.fico_tier in {TIER_1, TIER_2, TIER_3}  (TIER_4/TIER_5_DECLINED rejected for lease per §1.4 priority 7)"
          - "down_payment_cents >= §1.3 minimum_down_payment_lease for Customer.fico_tier"
          - "Vehicle.status == AVAILABLE"
        side_effects:
          - "Vehicle.status → LEASED"
          - "money_factor_micro set from §1.3 fico_tier_money_factor"
          - "residual_value_cents computed = floor(Vehicle.msrp_cents * Vehicle.residual_factor_bps / 10000)"
          - "monthly_payment_cents computed via §1.3 lease_monthly_payment"
          - "payments_scheduled_count = term_months"
          - "origination_day_index = Customer.clock_day_index, maturity_day_index = origination + term_months*30"
      - from: APPROVED
        to: ACTIVE
        trigger: "POST /customers/{customerId}/lease-contracts/{contractId}/activate"
        actor: LoanOfficer
        preconditions: ["LeaseContract.status == APPROVED"]
        side_effects:
          - "Generates term_months child Payment rows"
      - from: ACTIVE
        to: MATURED
        trigger: "system (Customer.clock_day_index >= maturity_day_index AND payments_made_count == payments_scheduled_count)"
        actor: system
        preconditions: ["LeaseContract.status == ACTIVE", "Customer.clock_day_index >= maturity_day_index", "payments_made_count == payments_scheduled_count"]
        side_effects:
          - "A DRAFT LeaseEndAssessment is created with status=DRAFT (so test path is reachable; odometer_reading is updated later via PATCH endpoint)"
      - from: ACTIVE
        to: DEFAULTED
        trigger: "system (third Payment row on this lease reaches status=DEFAULTED)"
        actor: system
        preconditions: ["count of Payment rows on this lease with status=DEFAULTED >= 3"]
        side_effects:
          - "Linked GapInsuranceRider if ACTIVE → status remains ACTIVE (gap may still claim on default per §1.4 priority 9)"
          - "DelinquencyEvent appended (lease entries set apr_uplift_bps_applied=0 because money factor is fixed at origination)"
      - from: MATURED
        to: PURCHASED
        trigger: "POST /customers/{customerId}/lease-contracts/{contractId}/lease-end with election=PURCHASE"
        actor: Customer
        preconditions:
          - "LeaseContract.status == MATURED"
          - "A DRAFT or ISSUED LeaseEndAssessment exists for this lease with odometer_reading set"
        side_effects:
          - "lease_end_election = PURCHASE"
          - "LeaseEndAssessment.purchase_option_cents = residual_value_cents + PURCHASE_OPTION_FEE_CENTS"
          - "LeaseEndAssessment.disposition_fee_cents = 0 (waived on purchase)"
          - "LeaseEndAssessment.total_due_cents recomputed via §1.3 lease_end_total"
          - "LeaseEndAssessment.status → ISSUED (if not already ISSUED)"
          - "Vehicle.status → SOLD"
      - from: MATURED
        to: RENEWED
        trigger: "POST /customers/{customerId}/lease-contracts/{contractId}/lease-end with election=RENEW"
        actor: Customer
        preconditions:
          - "LeaseContract.status == MATURED"
          - "A DRAFT or ISSUED LeaseEndAssessment exists for this lease with odometer_reading set"
        side_effects:
          - "lease_end_election = RENEW"
          - "LeaseEndAssessment.disposition_fee_cents = 0 (waived on renewal)"
          - "LeaseEndAssessment.purchase_option_cents = 0"
          - "LeaseEndAssessment.total_due_cents recomputed via §1.3 lease_end_total"
          - "LeaseEndAssessment.status → ISSUED (if not already ISSUED)"
          - "A new LeaseContract row is NOT auto-created; renewal is recorded as election only (Customer subsequently POSTs a new lease)"
      - from: MATURED
        to: RETURNED
        trigger: "POST /customers/{customerId}/lease-contracts/{contractId}/lease-end with election=RETURN"
        actor: Customer
        preconditions:
          - "LeaseContract.status == MATURED"
          - "A DRAFT or ISSUED LeaseEndAssessment exists for this lease with odometer_reading set"
        side_effects:
          - "lease_end_election = RETURN"
          - "LeaseEndAssessment.disposition_fee_cents = DISPOSITION_FEE_CENTS"
          - "LeaseEndAssessment.purchase_option_cents = 0"
          - "LeaseEndAssessment.total_due_cents recomputed via §1.3 lease_end_total"
          - "LeaseEndAssessment.status → ISSUED (if not already ISSUED)"
          - "Vehicle.status → AVAILABLE"
      - from: [PURCHASED, RENEWED, RETURNED]
        to: CLOSED
        trigger: "system (LeaseEndAssessment.status == SETTLED)"
        actor: system
        preconditions: ["The lease's LeaseEndAssessment.status == SETTLED"]
        side_effects:
          - "Linked GapInsuranceRider if ACTIVE → status → CANCELLED"

  - entity: Payment
    field: status
    initial_state: SCHEDULED
    terminal_states: [PAID, DEFAULTED]
    transitions:
      - from: SCHEDULED
        to: PAID
        trigger: "POST /customers/{customerId}/payments/{paymentId}/pay"
        actor: Customer
        preconditions:
          - "Payment.status == SCHEDULED"
          - "Parent contract.status in {APPROVED-after-activation→}ACTIVE or DEFAULTED"
        side_effects:
          - "paid_day_index = Customer.clock_day_index"
          - "For LOAN: §1.3 amortization_step splits amount_due_cents into principal_portion / interest_portion and decrements remaining_principal_cents; total_principal_paid / total_interest_paid updated"
          - "Parent contract.payments_made_count incremented"
          - "If this was the final scheduled payment AND remaining_principal_cents == 0: parent LoanContract → PAID_OFF (cascade)"
      - from: SCHEDULED
        to: LATE
        trigger: "system on POST /customers/{customerId}/clock/advance when due_day_index < Customer.clock_day_index AND status==SCHEDULED"
        actor: system
        preconditions: ["Payment.status == SCHEDULED", "Customer.clock_day_index > due_day_index"]
        side_effects: []
      - from: LATE
        to: PAID
        trigger: "POST /customers/{customerId}/payments/{paymentId}/pay"
        actor: Customer
        preconditions: ["Payment.status == LATE", "Customer.clock_day_index - due_day_index < DEFAULT_GRACE_DAYS"]
        side_effects:
          - "paid_day_index = Customer.clock_day_index"
          - "Amortization side effects same as SCHEDULED→PAID"
      - from: LATE
        to: DEFAULTED
        trigger: "system on POST /customers/{customerId}/clock/advance when Customer.clock_day_index - due_day_index >= DEFAULT_GRACE_DAYS"
        actor: system
        preconditions: ["Payment.status == LATE", "Customer.clock_day_index - due_day_index >= DEFAULT_GRACE_DAYS"]
        side_effects:
          - "Customer.default_count += 1"
          - "Customer.default_rate recomputed via §1.3 customer_default_rate"
          - "DelinquencyEvent appended"
          - "If Customer.default_count crosses UPLIFT_THRESHOLD (>=3 lifetime defaults) AND parent contract_type==LOAN: parent LoanContract.apr_bps += APR_UPLIFT_BPS and all SCHEDULED Payment rows on that contract are re-priced (cascade depth 4: Payment→Customer→LoanContract→Payment[])"
          - "If count of DEFAULTED Payment rows on parent contract >= 3: parent contract → DEFAULTED (cascade)"
      - from: DEFAULTED
        to: PAID
        trigger: "POST /customers/{customerId}/payments/{paymentId}/pay"
        actor: Customer
        preconditions:
          - "Payment.status == DEFAULTED"
          - "Parent contract.status == DEFAULTED (paying a defaulted payment from a charged-off contract is rejected)"
        side_effects:
          - "Customer.default_count -= 1 IS NOT applied (defaults are sticky); lifetime_payment_count incremented if previously 0"
          - "Amortization side effects same as SCHEDULED→PAID"

  - entity: GapInsuranceRider
    field: status
    initial_state: ACTIVE
    terminal_states: [CANCELLED, CLAIMED]
    transitions:
      - from: ACTIVE
        to: CANCELLED
        trigger: "POST /customers/{customerId}/gap-riders/{riderId}/cancel OR system (parent contract reaches CLOSED / PAID_OFF / CHARGED_OFF)"
        actor: "Customer or system"
        preconditions: ["GapInsuranceRider.status == ACTIVE"]
        side_effects: []
      - from: ACTIVE
        to: CLAIMED
        trigger: "POST /customers/{customerId}/gap-riders/{riderId}/claim with payout_cents"
        actor: FinanceManager
        preconditions:
          - "GapInsuranceRider.status == ACTIVE"
          - "Parent contract.status in {ACTIVE, DEFAULTED}  (cross-entity dependency)"
          - "payout_cents <= LoanContract.remaining_principal_cents  (LOAN) OR payout_cents <= LeaseContract.residual_value_cents  (LEASE)"
        side_effects:
          - "claim_payout_cents = payout_cents"
          - "For LOAN: LoanContract.remaining_principal_cents -= payout_cents; if reaches 0 → cascade LoanContract → PAID_OFF"
          - "For LEASE: LeaseContract.residual_value_cents -= payout_cents (affecting any subsequent PURCHASE election)"

  - entity: LeaseEndAssessment
    field: status
    initial_state: DRAFT
    terminal_states: [SETTLED, RESOLVED]
    transitions:
      - from: DRAFT
        to: ISSUED
        trigger: "PATCH /customers/{customerId}/lease-contracts/{contractId}/assessment with odometer_reading (or auto on lease-end election)"
        actor: FinanceManager
        preconditions:
          - "LeaseEndAssessment.status == DRAFT"
          - "odometer_reading is set and >= 0"
        side_effects:
          - "mileage_overage = max(0, odometer_reading - LeaseContract.mileage_allowance)"
          - "mileage_penalty_cents computed via §1.3 mileage_overage_penalty"
          - "total_due_cents computed via §1.3 lease_end_total"
      - from: ISSUED
        to: SETTLED
        trigger: "POST /customers/{customerId}/lease-contracts/{contractId}/assessment/settle"
        actor: Customer
        preconditions:
          - "LeaseEndAssessment.status == ISSUED"
          - "All child Payment rows on the parent LeaseContract have status==PAID (cross-entity dependency: Payment vs LeaseEndAssessment)"
        side_effects:
          - "settled_day_index = Customer.clock_day_index"
          - "Parent LeaseContract auto-transitions to CLOSED (cascade)"
      - from: ISSUED
        to: DISPUTED
        trigger: "POST /customers/{customerId}/lease-contracts/{contractId}/assessment/dispute"
        actor: Customer
        preconditions: ["LeaseEndAssessment.status == ISSUED"]
        side_effects: []
      - from: DISPUTED
        to: RESOLVED
        trigger: "POST /customers/{customerId}/lease-contracts/{contractId}/assessment/resolve with revised_odometer_reading"
        actor: FinanceManager
        preconditions: ["LeaseEndAssessment.status == DISPUTED"]
        side_effects:
          - "odometer_reading replaced; mileage_penalty_cents and total_due_cents recomputed"
          - "settled_day_index = Customer.clock_day_index"
          - "Parent LeaseContract auto-transitions to CLOSED (cascade)"

# -----------------------------------------------------------------------------
# §1.2.1 Concurrency Rules
# -----------------------------------------------------------------------------
concurrency_rules:
  - scenario: "Two simultaneous lease-end elections (e.g., PURCHASE and RETURN) on the same MATURED LeaseContract"
    guarantee: "Exactly one election succeeds; the loser is rejected because the lease is no longer in MATURED"
    error_id: ERR_LEASE_NOT_MATURED
    http_status: 409
    serialization: "First-writer-wins on LeaseContract.status; second sees status in {PURCHASED, RENEWED, RETURNED} and rejects"

  - scenario: "Two simultaneous /pay requests against the same Payment row"
    guarantee: "At most one transition SCHEDULED|LATE|DEFAULTED → PAID succeeds; the loser is rejected"
    error_id: ERR_PAYMENT_NOT_PAYABLE
    http_status: 409
    serialization: "First-writer-wins on Payment.status"

  - scenario: "GapInsuranceRider /claim while the parent contract concurrently transitions to PAID_OFF (loan) or CLOSED (lease)"
    guarantee: "Exactly one operation succeeds; if the contract transition wins, the rider is auto-CANCELLED and the claim is rejected"
    error_id: ERR_GAP_RIDER_NOT_CLAIMABLE
    http_status: 409
    serialization: "First-writer-wins on GapInsuranceRider.status"

  - scenario: "Two concurrent POST /loan-contracts/{id}/approve attempts for the same PENDING_APPROVAL loan"
    guarantee: "At most one approval succeeds; the loser sees status != PENDING_APPROVAL and is rejected"
    error_id: ERR_LOAN_NOT_PENDING_APPROVAL
    http_status: 409
    serialization: "First-writer-wins on LoanContract.status"

  - scenario: "Two concurrent POST /clock/advance requests for the same Customer"
    guarantee: "Advances are serialized — both succeed but in some order; clock_day_index increments are total and not interleaved"
    error_id: ERR_VERSION_CONFLICT
    http_status: 409
    serialization: "First-writer-wins on Customer.version (OCC); second must retry with new version"

# =============================================================================
# §1.3 Calculation Rules Table
# =============================================================================
calculations:
  - name: fico_tier_assignment
    trigger: "Customer creation (POST /customers) and any PUT that updates fico_score"
    algorithm: threshold
    formula: |
      if fico_score >= 720: TIER_1
      elif fico_score >= 660: TIER_2
      elif fico_score >= 600: TIER_3
      elif fico_score >= 540: TIER_4
      else: TIER_5_DECLINED
      # Boundary semantics: comparator is >=, so 720 → TIER_1, 719 → TIER_2, 660 → TIER_2, 659 → TIER_3, etc.
    constants:
      TIER_1_MIN: 720
      TIER_2_MIN: 660
      TIER_3_MIN: 600
      TIER_4_MIN: 540
    precision: "integer comparison"

  - name: minimum_down_payment_loan
    trigger: "POST loan-contracts/{id}/approve precondition check"
    algorithm: threshold
    formula: |
      Tiered minimum down payment as fraction of Vehicle.msrp_cents:
        TIER_1: 5%
        TIER_2: 10%
        TIER_3: 20%
        TIER_4: 35%
        TIER_5_DECLINED: contract is rejected before reaching this check
      minimum_down_payment_cents = ceil(msrp_cents * tier_fraction)
      Approval requires down_payment_cents >= minimum_down_payment_cents.
    constants:
      TIER_1_DP_BPS: 500
      TIER_2_DP_BPS: 1000
      TIER_3_DP_BPS: 2000
      TIER_4_DP_BPS: 3500
    precision: "integer cents, ceil"

  - name: minimum_down_payment_lease
    trigger: "POST lease-contracts/{id}/approve precondition check"
    algorithm: threshold
    formula: |
      Lease minimum down payment as fraction of Vehicle.msrp_cents:
        TIER_1: 8%
        TIER_2: 12%
        TIER_3: 18%
        TIER_4/TIER_5_DECLINED: lease rejected (different cap than loan; per §1.4 priority 7)
      minimum_down_payment_cents = ceil(msrp_cents * tier_fraction)
    constants:
      TIER_1_DP_BPS: 800
      TIER_2_DP_BPS: 1200
      TIER_3_DP_BPS: 1800
    precision: "integer cents, ceil"

  - name: fico_tier_apr
    trigger: "LoanContract APPROVED transition; not changed by money factor"
    algorithm: tiered_pricing
    formula: |
      Tier → annual percentage rate (basis points):
        TIER_1: 450  (4.50%)
        TIER_2: 650  (6.50%)
        TIER_3: 950  (9.50%)
        TIER_4: 1450 (14.50%)
      base_apr_bps = apr_bps = tier_apr_bps at origination.
    constants:
      TIER_1_APR_BPS: 450
      TIER_2_APR_BPS: 650
      TIER_3_APR_BPS: 950
      TIER_4_APR_BPS: 1450
    precision: "integer basis points"

  - name: fico_tier_money_factor
    trigger: "LeaseContract APPROVED transition"
    algorithm: tiered_pricing
    formula: |
      Tier → money factor (micro-units, i.e., factor * 1_000_000):
        TIER_1: 2000   (0.00200, ~4.80% APR)
        TIER_2: 2800   (0.00280)
        TIER_3: 4000   (0.00400)
      TIER_4 / TIER_5_DECLINED never reach this calculation.
    constants:
      TIER_1_MF_MICRO: 2000
      TIER_2_MF_MICRO: 2800
      TIER_3_MF_MICRO: 4000
    precision: "integer micro-units"

  - name: loan_monthly_payment
    trigger: "LoanContract APPROVED transition; recomputation on default_apr_uplift"
    algorithm: tiered_pricing
    formula: |
      Standard amortization formula:
        P     = principal_cents
        r     = (apr_bps / 10000) / 12      # monthly periodic rate
        n     = term_months
        if r == 0:
          M = ceil(P / n)
        else:
          M = ceil(P * r * (1 + r)**n / ((1 + r)**n - 1))
      monthly_payment_cents = M
      Rounding order is fixed: compute the unrounded float monthly payment
      first, then ceil to integer cents — DO NOT round r or P intermediately.
    constants:
      BPS_PER_PCT: 100
    precision: "integer cents, ceil at the end"

  - name: lease_monthly_payment
    trigger: "LeaseContract APPROVED transition"
    algorithm: tiered_pricing
    formula: |
      Depreciation, finance, and tax components — order of operations pinned:
        depreciation_cents = floor((capitalized_cost_cents - residual_value_cents) / term_months)
        finance_cents      = floor((capitalized_cost_cents + residual_value_cents) * money_factor_micro / 1_000_000)
        base_cents         = depreciation_cents + finance_cents
        tax_cents          = ceil(base_cents * LEASE_TAX_BPS / 10000)
        monthly_payment_cents = base_cents + tax_cents
      Rounding order: floor each of depreciation_cents and finance_cents
      independently, sum, THEN ceil the tax — "round per component then sum"
      (per §0.5 Rule 2 mode (b)). DO NOT compute base as a float and round once.
    constants:
      LEASE_TAX_BPS: 800   # 8% local lease tax
    precision: "integer cents, mixed floor/ceil per the pinned order"

  - name: amortization_step
    trigger: "Payment status → PAID on a LOAN-type Payment"
    algorithm: chronological
    formula: |
      For a LOAN Payment being marked PAID:
        r              = (LoanContract.apr_bps / 10000) / 12
        interest_part  = floor(LoanContract.remaining_principal_cents * r)
        principal_part = Payment.amount_due_cents - interest_part
        if principal_part > LoanContract.remaining_principal_cents:
          principal_part = LoanContract.remaining_principal_cents
          # any excess shrinks the final payment (final-payment trueing)
        LoanContract.remaining_principal_cents -= principal_part
        LoanContract.total_principal_paid_cents += principal_part
        LoanContract.total_interest_paid_cents  += interest_part
      For a LEASE Payment: principal_portion=0, interest_portion=0.
    precision: "integer cents, floor interest"

  - name: default_apr_uplift
    trigger: "Payment status → DEFAULTED that causes Customer.default_count to cross UPLIFT_THRESHOLD (>=3) for the first time"
    algorithm: forward_looking
    formula: |
      Two valid variants exist; THE SCAFFOLD PINS variant A (forward-looking):
        Variant A — FORWARD-LOOKING (pinned):
          new_apr_bps = base_apr_bps + APR_UPLIFT_BPS
          For each SCHEDULED Payment on every ACTIVE LoanContract owned by this Customer,
          recompute monthly_payment_cents using new_apr_bps and the CURRENT remaining_principal_cents
          (i.e., from this point forward).
        Variant B — CHRONOLOGICAL (NOT used; described to disambiguate prose):
          new_apr_bps = base_apr_bps + APR_UPLIFT_BPS
          Re-amortize from origination — recompute principal/interest split for every PAID Payment
          retroactively and back-fill interest_portion / principal_portion.
      The two variants produce DIFFERENT total interest paid on identical inputs:
      A leaves history untouched and only re-prices future payments, while B reshapes the
      entire amortization curve. The scaffold uses A.
    constants:
      UPLIFT_THRESHOLD: 3
      APR_UPLIFT_BPS: 300   # 3.00%
    precision: "integer basis points; same rounding rules as loan_monthly_payment"
    variants:
      - name: forward_looking_pinned
        when: "always (this scaffold)"
        difference: "Re-prices only SCHEDULED payments; PAID payments keep original amortization"
      - name: chronological_alternative
        when: "explicitly NOT used"
        difference: "Re-amortizes from origination; back-fills principal/interest for PAID rows"

  - name: customer_default_rate
    trigger: "Any Payment.status change involving DEFAULTED or PAID; LoanContract/LeaseContract APPROVED→ACTIVE generates new lifetime payments"
    algorithm: aggregation
    formula: |
      lifetime_payment_count = count of Payment rows owned by this Customer whose status
                               has ever been PAID, LATE, or DEFAULTED (state ever-touched set)
      default_count          = count of Payment rows currently in status=DEFAULTED for this Customer
      default_rate           = default_count / max(1, lifetime_payment_count)
      Sort key for stability: order Payment rows by (contract_id, period_index) ASC.
      Tie-break is not required because the aggregation is order-independent over the set.
    precision: "default_rate to 6 decimal places, round_half_up"

  - name: mileage_overage_penalty
    trigger: "LeaseEndAssessment DRAFT→ISSUED or DISPUTED→RESOLVED (whenever odometer_reading is updated)"
    algorithm: threshold
    formula: |
      mileage_overage = max(0, odometer_reading - LeaseContract.mileage_allowance)
      # Boundary precision: at exactly the allowance, overage = 0 and penalty = 0.
      mileage_penalty_cents = mileage_overage * PENALTY_PER_MILE_CENTS
    constants:
      PENALTY_PER_MILE_CENTS: 25   # $0.25 per mile
    precision: "integer cents"

  - name: lease_end_total
    trigger: "Any state change on the LeaseEndAssessment that mutates a component"
    algorithm: aggregation
    formula: |
      Aggregated total at lease-end. Source set is the three component fields on this
      LeaseEndAssessment row, included unconditionally:
        total_due_cents = mileage_penalty_cents + disposition_fee_cents + purchase_option_cents
      Invariant: total_due_cents == mileage_penalty + disposition_fee + purchase_option
      (compensating invariant; see §0.5 Rule 9).
    precision: "integer cents"

  - name: disposition_fee
    trigger: "LeaseContract MATURED→{PURCHASED|RENEWED|RETURNED} side-effect on LeaseEndAssessment"
    algorithm: threshold
    formula: |
      if lease_end_election == RETURN:    disposition_fee_cents = DISPOSITION_FEE_CENTS
      elif lease_end_election in {PURCHASE, RENEW}: disposition_fee_cents = 0
      else (election not yet set):        disposition_fee_cents = 0  (DRAFT assessment)
    constants:
      DISPOSITION_FEE_CENTS: 39500   # $395.00
    precision: "integer cents"

  - name: gap_premium
    trigger: "POST /gap-riders creation"
    algorithm: tiered_pricing
    formula: |
      Monthly premium = ceil(contract_capitalized_or_principal_cents * GAP_PREMIUM_BPS / 10000)
      where contract_capitalized_or_principal_cents = LoanContract.principal_cents for LOAN
                                                    = LeaseContract.capitalized_cost_cents for LEASE
    constants:
      GAP_PREMIUM_BPS: 50   # 0.50% of the financed amount per month
    precision: "integer cents, ceil"

  - name: loan_payoff_balance
    trigger: "GET /loan-contracts/{id}/payoff-quote"
    algorithm: forward_looking
    formula: |
      Two valid payoff variants exist on the SAME LoanContract; both are exposed via
      a `variant` query parameter on the payoff-quote endpoint:
        variant=BOOK (chronological / book payoff):
          payoff_cents = LoanContract.remaining_principal_cents
        variant=CASH (forward-looking / cash payoff with prepayment adjustment):
          accrued_interest_cents = floor(
            remaining_principal_cents * (apr_bps/10000)/12
            * (Customer.clock_day_index - last_paid_or_origination_day_index) / 30
          )
          prepayment_penalty_cents = ceil(remaining_principal_cents * PREPAYMENT_PENALTY_BPS / 10000)
          payoff_cents = remaining_principal_cents + accrued_interest_cents + prepayment_penalty_cents
      The two variants produce DIFFERENT cents on the same loan; tests assert
      payoff(BOOK) != payoff(CASH) whenever remaining_principal_cents > 0 AND the
      clock has advanced past origination.
    constants:
      PREPAYMENT_PENALTY_BPS: 200   # 2.00%
    precision: "integer cents; floor accrued interest, ceil penalty"
    variants:
      - name: book
        when: "?variant=BOOK"
        difference: "Ignores accrued interest and prepayment penalty"
      - name: cash
        when: "?variant=CASH"
        difference: "Includes accrued daily interest and prepayment penalty"

  - name: lease_end_purchase_quote
    trigger: "GET /lease-contracts/{id}/purchase-quote and PURCHASE election side-effect"
    algorithm: forward_looking
    formula: |
      Two valid purchase variants on the SAME LeaseContract, selected by `variant`:
        variant=AT_MATURITY (default at MATURED):
          purchase_option_cents = residual_value_cents + PURCHASE_OPTION_FEE_CENTS
        variant=EARLY_BUYOUT (allowed when status==ACTIVE):
          unpaid_payments = payments_scheduled_count - payments_made_count
          remaining_lease_value = unpaid_payments * monthly_payment_cents
          purchase_option_cents = residual_value_cents + PURCHASE_OPTION_FEE_CENTS + remaining_lease_value
      The two variants produce DIFFERENT cents on the same lease whenever
      payments_made_count < payments_scheduled_count.
    constants:
      PURCHASE_OPTION_FEE_CENTS: 35000   # $350.00
    precision: "integer cents"
    variants:
      - name: at_maturity
        when: "?variant=AT_MATURITY"
        difference: "Excludes remaining lease payments"
      - name: early_buyout
        when: "?variant=EARLY_BUYOUT"
        difference: "Adds remaining_lease_value to the residual + fee"

# =============================================================================
# §1.4 Validation Rules Table (ordered by priority)
# =============================================================================
validations:
  - priority: 1
    category: auth
    check: "X-User-ID and X-User-Role headers are present and well-formed"
    error_id: ERR_MISSING_OR_INVALID_USER_CONTEXT_HEADER
    http_status: 400
    applies_to: all

  - priority: 2
    category: auth
    check: "Role permitted to perform this operation per §1.7 RBAC matrix"
    error_id: ERR_FORBIDDEN_ROLE
    http_status: 403
    applies_to: all

  - priority: 3
    category: existence
    check: "Path resources exist left-to-right (Customer → LoanContract/LeaseContract → Payment/Assessment/Rider). Cross-customer leakage returns the NOT_FOUND for the inner resource."
    error_id: "ERR_CUSTOMER_NOT_FOUND | ERR_CONTRACT_NOT_FOUND | ERR_PAYMENT_NOT_FOUND | ERR_ASSESSMENT_NOT_FOUND | ERR_RIDER_NOT_FOUND | ERR_VEHICLE_NOT_FOUND"
    http_status: 404
    applies_to: all nested endpoints

  - priority: 4
    category: state
    check: "Target resource is in a state that permits the requested transition (e.g., approve requires PENDING_APPROVAL, lease-end requires MATURED, pay requires SCHEDULED|LATE|DEFAULTED)"
    error_id: "ERR_LOAN_NOT_PENDING_APPROVAL | ERR_LEASE_NOT_MATURED | ERR_PAYMENT_NOT_PAYABLE | ERR_ASSESSMENT_NOT_ISSUED | ERR_GAP_RIDER_NOT_CLAIMABLE"
    http_status: 409
    applies_to: state-transition endpoints

  - priority: 5
    category: business_safety
    check: "GapInsuranceRider /claim is rejected when parent contract is CLOSED, PAID_OFF, or CHARGED_OFF (the rider auto-cancels with the contract and cannot pay out posthumously)"
    error_id: ERR_GAP_RIDER_PARENT_TERMINAL
    http_status: 409
    applies_to: "POST /customers/{id}/gap-riders/{rid}/claim"

  - priority: 6
    category: business_referential
    check: "GapInsuranceRider.contract_id must reference a contract owned by the same Customer (cross-customer rider creation is rejected even if the contract id is otherwise valid)"
    error_id: ERR_RIDER_CONTRACT_OWNERSHIP_MISMATCH
    http_status: 422
    applies_to: "POST /customers/{id}/gap-riders"

  - priority: 7
    category: business_constraint
    check: "Lease contracts may only be approved for Customers with fico_tier in {TIER_1, TIER_2, TIER_3}; TIER_4 and TIER_5_DECLINED are rejected even if down payment exceeds the minimum (cross-entity dependency: LeaseContract approvability depends on Customer.fico_tier)"
    error_id: ERR_LEASE_TIER_INELIGIBLE
    http_status: 422
    applies_to: "POST /customers/{id}/lease-contracts/{cid}/approve"

  - priority: 8
    category: business_temporal
    check: "Payment.due_day_index uniqueness — no two SCHEDULED|LATE|DEFAULTED Payment rows on the same contract share the same due_day_index. The generator step at activation enforces (origination + 30) … (origination + 30*N) with closed-interval [start, end] semantics; manual ad-hoc payments through the test endpoint are rejected if their due_day_index collides."
    error_id: ERR_PAYMENT_DUE_DATE_COLLISION
    http_status: 409
    applies_to: "POST /customers/{id}/loan-contracts/{cid}/activate, POST /customers/{id}/lease-contracts/{cid}/activate, POST /customers/{id}/payments (manual)"

  - priority: 9
    category: business_temporal
    check: "LeaseContract term-window uniqueness — for a single Customer, no two non-terminal LeaseContract rows may have overlapping [origination_day_index, maturity_day_index] windows. Semantics: half-open intervals [start, end) so adjacency (end == next start) is allowed; overlap of even one day is rejected."
    error_id: ERR_LEASE_WINDOW_OVERLAP
    http_status: 409
    applies_to: "POST /customers/{id}/lease-contracts/{cid}/approve"

  - priority: 10
    category: business_fiscal
    check: "Down payment satisfies the FICO-tier minimum for the requested product (loan vs lease use different schedules; see §1.3 minimum_down_payment_loan / _lease)"
    error_id: ERR_DOWN_PAYMENT_BELOW_MINIMUM
    http_status: 422
    applies_to: "POST /customers/{id}/loan-contracts/{cid}/approve, POST /customers/{id}/lease-contracts/{cid}/approve"

  - priority: 11
    category: business_fiscal
    check: "GapInsuranceRider claim payout_cents may not exceed LoanContract.remaining_principal_cents (LOAN) or LeaseContract.residual_value_cents (LEASE) — the rider covers the gap, not free cash"
    error_id: ERR_GAP_CLAIM_EXCEEDS_GAP
    http_status: 422
    applies_to: "POST /customers/{id}/gap-riders/{rid}/claim"

  - priority: 12
    category: business_constraint
    check: "Optimistic concurrency: when the request body includes `version`, it must equal the persisted entity version"
    error_id: ERR_VERSION_CONFLICT
    http_status: 409
    applies_to: all mutating endpoints on entities with common_fields=true

# =============================================================================
# §1.5 API Endpoint Table
# =============================================================================
endpoints:
  # --- Customers ---
  - method: POST
    path: "/customers"
    description: "Create a customer"
    roles: [PlatformAdmin, LoanOfficer]
    code: 201
    input: [full_name, fico_score]
    output: Customer
    side_effects: ["fico_tier computed via §1.3 fico_tier_assignment", "status=ACTIVE", "clock_day_index=0"]

  - method: GET
    path: "/customers/{customerId}"
    description: "Get customer"
    roles: [PlatformAdmin, LoanOfficer, FinanceManager, CollectionsAgent, Customer]
    code: 200
    input: []
    output: Customer
    side_effects: []

  - method: PUT
    path: "/customers/{customerId}"
    description: "Update customer (fico_score change re-derives fico_tier)"
    roles: [PlatformAdmin, LoanOfficer]
    code: 200
    input: ["full_name?", "fico_score?", "version?"]
    output: Customer
    side_effects: ["fico_tier recomputed via §1.3 fico_tier_assignment if fico_score changes"]

  - method: POST
    path: "/customers/{customerId}/suspend"
    description: "Suspend customer"
    roles: [PlatformAdmin]
    code: 200
    input: []
    output: Customer
    side_effects: ["status → SUSPENDED; blocks new contract origination"]

  - method: POST
    path: "/customers/{customerId}/reinstate"
    description: "Reinstate customer"
    roles: [PlatformAdmin]
    code: 200
    input: []
    output: Customer
    side_effects: ["status → ACTIVE"]

  - method: POST
    path: "/customers/{customerId}/clock/advance"
    description: "Advance per-customer deterministic clock (test-driving endpoint required by §1.5 testability-completeness)"
    roles: [PlatformAdmin, LoanOfficer]
    code: 200
    input: [days_advanced]
    output: ClockEvent
    side_effects:
      - "Customer.clock_day_index += days_advanced (1 <= days_advanced <= 365)"
      - "Every SCHEDULED Payment on any of this Customer's contracts with due_day_index < new clock advances to LATE"
      - "Every LATE Payment whose (clock - due_day_index) >= DEFAULT_GRACE_DAYS advances to DEFAULTED, with all cascade side-effects per §1.2 (DelinquencyEvent, default_count, conditional APR uplift)"
      - "Every ACTIVE LeaseContract that has reached maturity_day_index AND has payments_made_count == payments_scheduled_count auto-transitions to MATURED (creating a DRAFT LeaseEndAssessment)"

  # --- Vehicles ---
  - method: POST
    path: "/vehicles"
    description: "Register a vehicle"
    roles: [PlatformAdmin]
    code: 201
    input: [vin, model, msrp_cents, residual_factor_bps]
    output: Vehicle
    side_effects: ["status=AVAILABLE"]

  - method: GET
    path: "/vehicles/{vehicleId}"
    description: "Get vehicle"
    roles: [PlatformAdmin, LoanOfficer, FinanceManager, Customer]
    code: 200
    input: []
    output: Vehicle
    side_effects: []

  - method: GET
    path: "/vehicles"
    description: "List vehicles with pagination + status filter"
    roles: [PlatformAdmin, LoanOfficer, FinanceManager, Customer]
    code: 200
    input: ["limit?", "offset?", "status?"]
    output: "Vehicle[]"
    side_effects: []

  # --- Loan contracts ---
  - method: POST
    path: "/customers/{customerId}/loan-contracts"
    description: "Create a PENDING_APPROVAL loan contract"
    roles: [LoanOfficer]
    code: 201
    input: [vehicle_id, down_payment_cents, term_months]
    output: LoanContract
    side_effects: ["principal_cents = msrp_cents - down_payment_cents", "status=PENDING_APPROVAL"]

  - method: POST
    path: "/customers/{customerId}/loan-contracts/{contractId}/approve"
    description: "Approve a loan contract"
    roles: [LoanOfficer]
    code: 200
    input: []
    output: LoanContract
    side_effects: ["status → APPROVED with full §1.2 side-effect set"]

  - method: POST
    path: "/customers/{customerId}/loan-contracts/{contractId}/activate"
    description: "Activate an approved loan and generate Payment schedule"
    roles: [LoanOfficer]
    code: 200
    input: []
    output: LoanContract
    side_effects: ["status → ACTIVE; generates term_months Payment rows"]

  - method: POST
    path: "/customers/{customerId}/loan-contracts/{contractId}/reinstate"
    description: "Reinstate a DEFAULTED loan (after all DEFAULTED payments paid)"
    roles: [CollectionsAgent]
    code: 200
    input: []
    output: LoanContract
    side_effects: ["status → ACTIVE"]

  - method: POST
    path: "/customers/{customerId}/loan-contracts/{contractId}/charge-off"
    description: "Charge off a DEFAULTED loan (terminal)"
    roles: [CollectionsAgent]
    code: 200
    input: []
    output: LoanContract
    side_effects: ["status → CHARGED_OFF; linked GapInsuranceRider auto-CANCELLED"]

  - method: GET
    path: "/customers/{customerId}/loan-contracts/{contractId}"
    description: "Get loan contract"
    roles: [LoanOfficer, FinanceManager, CollectionsAgent, Customer]
    code: 200
    input: []
    output: LoanContract
    side_effects: []

  - method: GET
    path: "/customers/{customerId}/loan-contracts/{contractId}/payoff-quote"
    description: "Get payoff balance (dual-variant: BOOK vs CASH)"
    roles: [LoanOfficer, FinanceManager, CollectionsAgent, Customer]
    code: 200
    input: [variant]
    output: "object {variant, payoff_cents, components}"
    side_effects: ["Read-only; §1.3 loan_payoff_balance"]

  # --- Lease contracts ---
  - method: POST
    path: "/customers/{customerId}/lease-contracts"
    description: "Create a PENDING_APPROVAL lease contract"
    roles: [LoanOfficer]
    code: 201
    input: [vehicle_id, down_payment_cents, term_months, mileage_allowance]
    output: LeaseContract
    side_effects: ["capitalized_cost_cents = msrp_cents - down_payment_cents", "status=PENDING_APPROVAL"]

  - method: POST
    path: "/customers/{customerId}/lease-contracts/{contractId}/approve"
    description: "Approve a lease contract"
    roles: [LoanOfficer]
    code: 200
    input: []
    output: LeaseContract
    side_effects: ["status → APPROVED with full §1.2 side-effect set"]

  - method: POST
    path: "/customers/{customerId}/lease-contracts/{contractId}/activate"
    description: "Activate an approved lease and generate Payment schedule"
    roles: [LoanOfficer]
    code: 200
    input: []
    output: LeaseContract
    side_effects: ["status → ACTIVE; generates term_months Payment rows"]

  - method: GET
    path: "/customers/{customerId}/lease-contracts/{contractId}"
    description: "Get lease contract"
    roles: [LoanOfficer, FinanceManager, Customer]
    code: 200
    input: []
    output: LeaseContract
    side_effects: []

  - method: GET
    path: "/customers/{customerId}/lease-contracts/{contractId}/purchase-quote"
    description: "Get purchase quote (dual-variant: AT_MATURITY vs EARLY_BUYOUT)"
    roles: [LoanOfficer, FinanceManager, Customer]
    code: 200
    input: [variant]
    output: "object {variant, purchase_option_cents, components}"
    side_effects: ["Read-only; §1.3 lease_end_purchase_quote"]

  - method: POST
    path: "/customers/{customerId}/lease-contracts/{contractId}/lease-end"
    description: "Submit lease-end election (PURCHASE | RENEW | RETURN)"
    roles: [Customer]
    code: 200
    input: [election]
    output: LeaseContract
    side_effects: ["status → PURCHASED / RENEWED / RETURNED per election", "LeaseEndAssessment updated per §1.2"]

  - method: PATCH
    path: "/customers/{customerId}/lease-contracts/{contractId}/assessment"
    description: "Set or revise odometer_reading on the DRAFT LeaseEndAssessment (DRAFT→ISSUED on first set)"
    roles: [FinanceManager]
    code: 200
    input: [odometer_reading]
    output: LeaseEndAssessment
    side_effects: ["mileage_overage, mileage_penalty_cents, total_due_cents recomputed via §1.3"]

  - method: POST
    path: "/customers/{customerId}/lease-contracts/{contractId}/assessment/settle"
    description: "Settle the ISSUED LeaseEndAssessment (requires all payments paid)"
    roles: [Customer]
    code: 200
    input: []
    output: LeaseEndAssessment
    side_effects: ["status → SETTLED; parent LeaseContract → CLOSED (cascade)"]

  - method: POST
    path: "/customers/{customerId}/lease-contracts/{contractId}/assessment/dispute"
    description: "Dispute the ISSUED assessment"
    roles: [Customer]
    code: 200
    input: []
    output: LeaseEndAssessment
    side_effects: ["status → DISPUTED"]

  - method: POST
    path: "/customers/{customerId}/lease-contracts/{contractId}/assessment/resolve"
    description: "Resolve a DISPUTED assessment with a revised odometer reading"
    roles: [FinanceManager]
    code: 200
    input: [revised_odometer_reading]
    output: LeaseEndAssessment
    side_effects: ["status → RESOLVED; mileage_penalty_cents, total_due_cents recomputed; parent LeaseContract → CLOSED (cascade)"]

  # --- Payments ---
  - method: GET
    path: "/customers/{customerId}/payments"
    description: "List Payments for this Customer with pagination + filters"
    roles: [LoanOfficer, FinanceManager, CollectionsAgent, Customer]
    code: 200
    input: ["limit?", "offset?", "contract_id?", "status?"]
    output: "Payment[]"
    side_effects: []

  - method: GET
    path: "/customers/{customerId}/payments/{paymentId}"
    description: "Get a Payment"
    roles: [LoanOfficer, FinanceManager, CollectionsAgent, Customer]
    code: 200
    input: []
    output: Payment
    side_effects: []

  - method: POST
    path: "/customers/{customerId}/payments/{paymentId}/pay"
    description: "Mark Payment paid (SCHEDULED|LATE|DEFAULTED → PAID)"
    roles: [Customer]
    code: 200
    input: []
    output: Payment
    side_effects: ["paid_day_index = Customer.clock_day_index", "§1.3 amortization_step", "cascades per §1.2"]

  # --- Gap insurance riders ---
  - method: POST
    path: "/customers/{customerId}/gap-riders"
    description: "Attach a gap insurance rider to an ACTIVE loan or lease"
    roles: [FinanceManager, Customer]
    code: 201
    input: [contract_id, contract_type]
    output: GapInsuranceRider
    side_effects: ["monthly_premium_cents computed via §1.3 gap_premium", "status=ACTIVE", "attached_day_index = Customer.clock_day_index"]

  - method: GET
    path: "/customers/{customerId}/gap-riders/{riderId}"
    description: "Get rider"
    roles: [FinanceManager, Customer]
    code: 200
    input: []
    output: GapInsuranceRider
    side_effects: []

  - method: POST
    path: "/customers/{customerId}/gap-riders/{riderId}/cancel"
    description: "Cancel the rider"
    roles: [Customer]
    code: 200
    input: []
    output: GapInsuranceRider
    side_effects: ["status → CANCELLED"]

  - method: POST
    path: "/customers/{customerId}/gap-riders/{riderId}/claim"
    description: "Claim against the rider"
    roles: [FinanceManager]
    code: 200
    input: [payout_cents]
    output: GapInsuranceRider
    side_effects: ["status → CLAIMED; LoanContract.remaining_principal_cents -= payout_cents OR LeaseContract.residual_value_cents -= payout_cents"]

  # --- Delinquency log (read-only event stream) ---
  - method: GET
    path: "/customers/{customerId}/delinquency-events"
    description: "List DelinquencyEvent rows for this Customer (paginated, append-only)"
    roles: [PlatformAdmin, CollectionsAgent, FinanceManager]
    code: 200
    input: ["limit?", "offset?"]
    output: "DelinquencyEvent[]"
    side_effects: []

# =============================================================================
# §1.6 Error Code Catalog
# =============================================================================
errors:
  # --- Auth ---
  - id: ERR_MISSING_OR_INVALID_USER_CONTEXT_HEADER
    http: 400
    condition: "X-User-ID or X-User-Role header missing or malformed"
  - id: ERR_FORBIDDEN_ROLE
    http: 403
    condition: "Role not permitted for the requested operation per §1.7"

  # --- Existence ---
  - id: ERR_CUSTOMER_NOT_FOUND
    http: 404
    condition: "Customer.id not found"
  - id: ERR_CONTRACT_NOT_FOUND
    http: 404
    condition: "Loan or lease contract not found under this customer"
  - id: ERR_VEHICLE_NOT_FOUND
    http: 404
    condition: "Vehicle.id not found"
  - id: ERR_PAYMENT_NOT_FOUND
    http: 404
    condition: "Payment not found under this customer"
  - id: ERR_ASSESSMENT_NOT_FOUND
    http: 404
    condition: "LeaseEndAssessment not found for this lease"
  - id: ERR_RIDER_NOT_FOUND
    http: 404
    condition: "GapInsuranceRider not found"

  # --- State (409) ---
  - id: ERR_CUSTOMER_NOT_ACTIVE
    http: 409
    condition: "Customer is SUSPENDED; cannot originate new contracts"
  - id: ERR_LOAN_NOT_PENDING_APPROVAL
    http: 409
    condition: "Loan approve/reject only valid from PENDING_APPROVAL"
  - id: ERR_LEASE_NOT_PENDING_APPROVAL
    http: 409
    condition: "Lease approve/reject only valid from PENDING_APPROVAL"
  - id: ERR_CONTRACT_NOT_ACTIVATABLE
    http: 409
    condition: "Activation requires APPROVED status"
  - id: ERR_LOAN_NOT_DEFAULTED
    http: 409
    condition: "Reinstate/charge-off require DEFAULTED loan"
  - id: ERR_LEASE_NOT_MATURED
    http: 409
    condition: "Lease-end election only valid from MATURED"
  - id: ERR_PAYMENT_NOT_PAYABLE
    http: 409
    condition: "Payment not in SCHEDULED|LATE|DEFAULTED, or parent contract is in a state that forbids payment"
  - id: ERR_ASSESSMENT_NOT_ISSUED
    http: 409
    condition: "Settle/dispute require ISSUED assessment"
  - id: ERR_ASSESSMENT_NOT_DISPUTED
    http: 409
    condition: "Resolve requires DISPUTED assessment"
  - id: ERR_GAP_RIDER_NOT_CLAIMABLE
    http: 409
    condition: "Rider not in ACTIVE state"
  - id: ERR_GAP_RIDER_PARENT_TERMINAL
    http: 409
    condition: "Parent contract is CLOSED, PAID_OFF, or CHARGED_OFF — claim is rejected on safety grounds (§1.4 priority 5)"
  - id: ERR_PAYMENT_DUE_DATE_COLLISION
    http: 409
    condition: "A SCHEDULED|LATE|DEFAULTED Payment already occupies this due_day_index on the contract"
  - id: ERR_LEASE_WINDOW_OVERLAP
    http: 409
    condition: "Lease term [origination, maturity) overlaps with another non-terminal lease for this customer"
  - id: ERR_VERSION_CONFLICT
    http: 409
    condition: "Provided version does not match persisted entity version (OCC)"
  - id: ERR_REINSTATE_HAS_OUTSTANDING_DEFAULTS
    http: 409
    condition: "Loan reinstatement requires all DEFAULTED child Payments to be PAID first"

  # --- Validation / business (400 / 422) ---
  - id: ERR_INVALID_REQUEST
    http: 400
    condition: "Malformed body, missing required field, or out-of-range scalar (e.g., term_months not in allowed set)"
  - id: ERR_FICO_OUT_OF_RANGE
    http: 422
    condition: "fico_score outside [300, 850]"
  - id: ERR_VEHICLE_NOT_AVAILABLE
    http: 422
    condition: "Vehicle.status is not AVAILABLE at origination"
  - id: ERR_DOWN_PAYMENT_BELOW_MINIMUM
    http: 422
    condition: "down_payment_cents below the FICO-tier minimum for the requested product"
  - id: ERR_LEASE_TIER_INELIGIBLE
    http: 422
    condition: "fico_tier in {TIER_4, TIER_5_DECLINED} — leases require TIER_1..3"
  - id: ERR_LOAN_TIER_DECLINED
    http: 422
    condition: "fico_tier == TIER_5_DECLINED — loan origination rejected"
  - id: ERR_RIDER_CONTRACT_OWNERSHIP_MISMATCH
    http: 422
    condition: "Referenced contract belongs to a different customer"
  - id: ERR_GAP_CLAIM_EXCEEDS_GAP
    http: 422
    condition: "Claim payout exceeds remaining_principal_cents (loan) or residual_value_cents (lease)"
  - id: ERR_INVALID_ODOMETER_READING
    http: 422
    condition: "odometer_reading is negative or non-integer"
  - id: ERR_INVALID_LEASE_END_ELECTION
    http: 422
    condition: "election not in {PURCHASE, RENEW, RETURN}"
  - id: ERR_CLOCK_ADVANCE_OUT_OF_RANGE
    http: 422
    condition: "days_advanced outside [1, 365]"

# =============================================================================
# §1.7 RBAC Matrix
# =============================================================================
roles:
  - name: PlatformAdmin
    description: "Platform operator; manages customers, vehicles, and clock"
    identity: opaque
    exclusive_operations:
      - "POST /customers/{id}/suspend"
      - "POST /customers/{id}/reinstate"
      - "POST /vehicles"
    shared_operations:
      - "POST /customers (with LoanOfficer)"
      - "POST /customers/{id}/clock/advance (with LoanOfficer)"
      - "GET /customers/{id}/delinquency-events (with CollectionsAgent, FinanceManager)"
      - "GET reads on /customers, /vehicles, contracts"

  - name: LoanOfficer
    description: "Originates and approves loan and lease contracts"
    identity: opaque
    exclusive_operations:
      - "POST /customers/{id}/loan-contracts and /lease-contracts (create)"
      - "POST .../approve and .../activate for both contract types"
    shared_operations:
      - "POST /customers (with PlatformAdmin)"
      - "POST /customers/{id}/clock/advance (with PlatformAdmin)"
      - "PUT /customers/{id} (with PlatformAdmin)"
      - "GET reads on customers, contracts, payments"

  - name: FinanceManager
    description: "Manages gap insurance riders and lease-end assessments"
    identity: opaque
    exclusive_operations:
      - "POST /customers/{id}/gap-riders/{rid}/claim"
      - "PATCH /customers/{id}/lease-contracts/{cid}/assessment"
      - "POST .../assessment/resolve"
    shared_operations:
      - "POST /customers/{id}/gap-riders (with Customer)"
      - "GET reads on contracts, payments, assessments, delinquency-events"

  - name: CollectionsAgent
    description: "Handles delinquent and defaulted loans"
    identity: opaque
    exclusive_operations:
      - "POST /customers/{id}/loan-contracts/{cid}/reinstate"
      - "POST /customers/{id}/loan-contracts/{cid}/charge-off"
    shared_operations:
      - "GET /customers/{id}/delinquency-events (with PlatformAdmin, FinanceManager)"
      - "GET reads on loans and payments"

  - name: Customer
    description: "End customer; pays, elects lease-end outcomes, settles assessments"
    identity: "entity_backed:Customer"
    exclusive_operations:
      - "POST /customers/{id}/payments/{pid}/pay  (and X-User-ID must equal {id})"
      - "POST /customers/{id}/lease-contracts/{cid}/lease-end"
      - "POST .../assessment/settle"
      - "POST .../assessment/dispute"
      - "POST /customers/{id}/gap-riders/{rid}/cancel"
    shared_operations:
      - "POST /customers/{id}/gap-riders (with FinanceManager)"
      - "GET reads on own customer, contracts, payments, assessments, riders"
