        distinguishing_aspect: |
          Depth-5 compensation chain from POST /invoices/{id}/refund (a different
          trigger than close-advance): invoice PAID->REFUNDED refunds its SUCCEEDED
          payments, voids its ISSUED certificate, voids the WINNER bid, reverts the
          bundle SOLD->UNSOLD, reverts items SOLD->UNSOLD, and spawns fresh
          Disposition PROPOSED rows — reversing the close cascade's effects.
