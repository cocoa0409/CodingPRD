scaffold_corner_design:
  # ============================================================ entities
  - section: entities
    instances:
      - name: listing_create_success_defaults_initial_state
        claim_type: creation
        grounds:
          - "entities.Listing"
          - "state_machines.Listing"
        distinguishing_aspect: "POST /api/listings with valid input returns 201 with status DRAFT, version 1, agent_id copied from the caller, and server-minted id/created_at."
        test_recipe:
          setup: ["Seller S1 and agent G1 exist"]
          setup_api_calls:
            - { call: "POST /api/sellers", payload: { full_name: "Seller One", email: "s1@x.com" }, as: PlatformAdmin, captures: { s_id: $.data.id } }
            - { call: "POST /api/agents", payload: { full_name: "Agent One", license_number: "LIC-001" }, as: PlatformAdmin, captures: { g_id: $.data.id } }
          trigger:
            - { call: "POST /api/listings", payload: { seller_id: "${s_id}", title: "L1", county: "Dallas", state_code: "IA", total_gross_acres: 100, packaging_strategy: "WHOLE", reserve_price_total: 770000 }, as: BrokerAgent, as_user_id: "${g_id}", captures: { l_id: $.data.id, l_st: $.data.status, l_v: $.data.version, l_agent: $.data.agent_id } }
          assert:
            - "l_st == DRAFT and l_v == 1"
            - "l_agent == ${g_id} (agent_id is system-set from X-User-ID, not from input)"

      - name: auction_create_defaults_applied
        claim_type: defaults
        grounds:
          - "entities.AuctionEvent.fields.soft_close_window_minutes"
          - "entities.AuctionEvent.fields.extension_minutes"
          - "entities.AuctionEvent.fields.effective_end"
        distinguishing_aspect: "Omitting soft_close_window_minutes/extension_minutes applies defaults 5/5; effective_end initializes to scheduled_end and extension_count to 0."
        test_recipe:
          setup: ["MARKETED WHOLE listing with one tract and DECLARED rights (reserve 770000 vs provisional 900000 floor 765000 passes)"]
          setup_api_calls:
            - { call: "POST /api/sellers", payload: { full_name: "Seller One", email: "s1@x.com" }, as: PlatformAdmin, captures: { s_id: $.data.id } }
            - { call: "POST /api/agents", payload: { full_name: "Agent One", license_number: "LIC-001" }, as: PlatformAdmin, captures: { g_id: $.data.id } }
            - { call: "POST /api/comparables", payload: { county: "Dallas", state_code: "IA", sale_date: "2026-01-15T00:00:00Z", sale_price_total: 900000, gross_acres: 100, tillable_acres: 95, soil_productivity_index: 80 }, as: PlatformAdmin }
            - { call: "POST /api/listings", payload: { seller_id: "${s_id}", title: "L1", county: "Dallas", state_code: "IA", total_gross_acres: 100, packaging_strategy: "WHOLE", reserve_price_total: 770000 }, as: BrokerAgent, as_user_id: "${g_id}", captures: { l_id: $.data.id, l_v: $.data.version } }
            - { call: "POST /api/tracts", payload: { listing_id: "${l_id}", tract_number: 1, gross_acres: 100, tillable_acres: 90, soil_productivity_index: 80, min_price: 700000, expected_listing_version: "${l_v}" }, as: BrokerAgent, as_user_id: "${g_id}", captures: { t1_id: $.data.id } }
            - { call: "POST /api/rights", payload: { tract_id: "${t1_id}", mineral_rights: "CONVEYED", wind_rights: "CONVEYED" }, as: BrokerAgent, as_user_id: "${g_id}" }
            - { call: "POST /api/listings/${l_id}/package", as: BrokerAgent, as_user_id: "${g_id}" }
            - { call: "POST /api/listings/${l_id}/market", as: BrokerAgent, as_user_id: "${g_id}" }
          trigger:
            - { call: "POST /api/auctions", payload: { listing_id: "${l_id}", method: "ONLINE", scheduled_start: "2026-08-10T17:00:00Z", scheduled_end: "2026-08-10T19:00:00Z" }, as: BrokerAgent, as_user_id: "${g_id}", captures: { a_sc: $.data.soft_close_window_minutes, a_em: $.data.extension_minutes, a_ee: $.data.effective_end, a_ec: $.data.extension_count, a_st: $.data.status } }
          assert:
            - "a_sc == 5 and a_em == 5 (defaults applied)"
            - "a_ee == 2026-08-10T19:00:00Z and a_ec == 0"
            - "a_st == SCHEDULED (initial state)"

      - name: tract_create_missing_required_field_returns_invalid_request
        claim_type: required_fields
        grounds:
          - "entities.Tract.fields.soil_productivity_index"
          - "errors[ERR_VALIDATION]"
        distinguishing_aspect: "Omitting required input soil_productivity_index from POST /api/tracts is rejected ERR_VALIDATION (400) before any state or acreage check."
        test_recipe:
          setup: ["DRAFT listing L1 exists"]
          setup_api_calls:
            - { call: "POST /api/sellers", payload: { full_name: "Seller One", email: "s1@x.com" }, as: PlatformAdmin, captures: { s_id: $.data.id } }
            - { call: "POST /api/agents", payload: { full_name: "Agent One", license_number: "LIC-001" }, as: PlatformAdmin, captures: { g_id: $.data.id } }
            - { call: "POST /api/listings", payload: { seller_id: "${s_id}", title: "L1", county: "Dallas", state_code: "IA", total_gross_acres: 100, packaging_strategy: "WHOLE", reserve_price_total: 770000 }, as: BrokerAgent, as_user_id: "${g_id}", captures: { l_id: $.data.id, l_v: $.data.version } }
          trigger:
            - { call: "POST /api/tracts", payload: { listing_id: "${l_id}", tract_number: 1, gross_acres: 100, tillable_acres: 90, min_price: 700000, expected_listing_version: "${l_v}" }, as: BrokerAgent, as_user_id: "${g_id}", captures: { err: $.data.error_id } }
          assert:
            - "err == ERR_VALIDATION and no Tract is created (listing version unchanged)"

      - name: comparable_sale_immutable_record
        claim_type: immutability
        grounds:
          - "entities.ComparableSale"
        distinguishing_aspect: "ComparableSale has common_fields: false — creation response carries id and created_at but no version/updated_at, and the API exposes no update or delete endpoint for it."
        test_recipe:
          setup: []
          setup_api_calls: []
          trigger:
            - { call: "POST /api/comparables", payload: { county: "Dallas", state_code: "IA", sale_date: "2026-01-15T00:00:00Z", sale_price_total: 900000, gross_acres: 100, tillable_acres: 95, soil_productivity_index: 80 }, as: PlatformAdmin, captures: { c_id: $.data.id, c_ts: $.data.created_at } }
          assert:
            - "c_id and c_ts are present; response has no version field (immutable record)"

      - name: get_listing_not_found_returns_not_found
        claim_type: not_found
        grounds:
          - "errors[ERR_NOT_FOUND]"
          - "validations[priority=3]"
        distinguishing_aspect: "GET with a well-formed but nonexistent listing id returns 404 ERR_NOT_FOUND."
        test_recipe:
          setup: ["Agent G1 exists"]
          setup_api_calls:
            - { call: "POST /api/agents", payload: { full_name: "Agent One", license_number: "LIC-001" }, as: PlatformAdmin, captures: { g_id: $.data.id } }
          trigger:
            - { call: "GET /api/listings/00000000-0000-0000-0000-000000000000", as: BrokerAgent, as_user_id: "${g_id}", captures: { err: $.data.error_id } }
          assert:
            - "err == ERR_NOT_FOUND (404)"

  # ============================================================ state_machines
  - section: state_machines
    instances:
      - name: withdraw_under_contract_rejected_invalid_state
        claim_type: invalid_transition
        grounds:
          - "state_machines.Listing"
          - "errors[ERR_INVALID_LISTING_STATE]"
        distinguishing_aspect: "Listing in UNDER_CONTRACT (award completed) rejects withdraw with ERR_INVALID_LISTING_STATE — the withdrawal path exists only pre-contract."
        test_recipe:
          setup:
            - "WHOLE listing awarded: auction closed with B1 bid 770000 (== reserve, boundary pass), award executed; listing UNDER_CONTRACT"
          setup_api_calls:
            - { call: "POST /api/sellers", payload: { full_name: "Seller One", email: "s1@x.com" }, as: PlatformAdmin, captures: { s_id: $.data.id } }
            - { call: "POST /api/agents", payload: { full_name: "Agent One", license_number: "LIC-001" }, as: PlatformAdmin, captures: { g_id: $.data.id } }
            - { call: "POST /api/comparables", payload: { county: "Dallas", state_code: "IA", sale_date: "2026-01-15T00:00:00Z", sale_price_total: 900000, gross_acres: 100, tillable_acres: 95, soil_productivity_index: 80 }, as: PlatformAdmin }
            - { call: "POST /api/buyers", payload: { full_name: "Buyer One", email: "b1@x.com", proof_of_funds_amount: 2000000 }, as: PlatformAdmin, captures: { b1_id: $.data.id } }
            - { call: "POST /api/buyers/${b1_id}/qualify", payload: { qualification_expires_at: "2026-09-01T00:00:00Z" }, as: PlatformAdmin }
            - { call: "POST /api/listings", payload: { seller_id: "${s_id}", title: "L1", county: "Dallas", state_code: "IA", total_gross_acres: 100, packaging_strategy: "WHOLE", reserve_price_total: 770000 }, as: BrokerAgent, as_user_id: "${g_id}", captures: { l_id: $.data.id, l_v: $.data.version } }
            - { call: "POST /api/tracts", payload: { listing_id: "${l_id}", tract_number: 1, gross_acres: 100, tillable_acres: 90, soil_productivity_index: 80, min_price: 700000, expected_listing_version: "${l_v}" }, as: BrokerAgent, as_user_id: "${g_id}", captures: { t1_id: $.data.id } }
            - { call: "POST /api/rights", payload: { tract_id: "${t1_id}", mineral_rights: "CONVEYED", wind_rights: "CONVEYED" }, as: BrokerAgent, as_user_id: "${g_id}" }
            - { call: "POST /api/listings/${l_id}/package", as: BrokerAgent, as_user_id: "${g_id}" }
            - { call: "POST /api/listings/${l_id}/market", as: BrokerAgent, as_user_id: "${g_id}" }
            - { call: "POST /api/auctions", payload: { listing_id: "${l_id}", method: "LIVE", scheduled_start: "2026-08-10T17:00:00Z", scheduled_end: "2026-08-10T19:00:00Z" }, as: BrokerAgent, as_user_id: "${g_id}", captures: { a_id: $.data.id, a_v: $.data.version } }
            - { call: "POST /api/_clock/set_current_utc", payload: { to_iso8601: "2026-08-10T17:00:00Z" }, as: PlatformAdmin }
            - { call: "POST /api/auctions/${a_id}/open", as: BrokerAgent, as_user_id: "${g_id}", captures: { a_v: $.data.version } }
            - { call: "POST /api/bids", payload: { auction_id: "${a_id}", amount: 770000, tract_ids: ["${t1_id}"], expected_auction_version: "${a_v}" }, as: Buyer, as_user_id: "${b1_id}" }
            - { call: "POST /api/_clock/set_current_utc", payload: { to_iso8601: "2026-08-10T19:00:00Z" }, as: PlatformAdmin }
            - { call: "POST /api/auctions/${a_id}/award", as: BrokerAgent, as_user_id: "${g_id}", captures: { a_st: $.data.status } }
          trigger:
            - { call: "POST /api/listings/${l_id}/withdraw", as: Seller, as_user_id: "${s_id}", captures: { err: $.data.error_id } }
          assert:
            - "a_st == AWARDED (listing is UNDER_CONTRACT)"
            - "err == ERR_INVALID_LISTING_STATE"

      - name: verify_deposit_before_payment_rejected
        claim_type: precondition_enforcement
        grounds:
          - "state_machines.EarnestMoneyDeposit.PENDING_to_RECEIVED"
          - "errors[ERR_INVALID_DEPOSIT_STATE]"
        distinguishing_aspect: "Verify on a PENDING deposit (amount_received 0 < amount_due) is rejected ERR_INVALID_DEPOSIT_STATE; only RECEIVED or LATE deposits can verify."
        test_recipe:
          setup: ["Same awarded WHOLE flow as withdraw_under_contract_rejected_invalid_state (bid 770000, EMD amount_due 23100.00, unpaid)"]
          setup_api_calls:
            - { call: "POST /api/sellers", payload: { full_name: "Seller One", email: "s1@x.com" }, as: PlatformAdmin, captures: { s_id: $.data.id } }
            - { call: "POST /api/agents", payload: { full_name: "Agent One", license_number: "LIC-001" }, as: PlatformAdmin, captures: { g_id: $.data.id } }
            - { call: "POST /api/comparables", payload: { county: "Dallas", state_code: "IA", sale_date: "2026-01-15T00:00:00Z", sale_price_total: 900000, gross_acres: 100, tillable_acres: 95, soil_productivity_index: 80 }, as: PlatformAdmin }
            - { call: "POST /api/buyers", payload: { full_name: "Buyer One", email: "b1@x.com", proof_of_funds_amount: 2000000 }, as: PlatformAdmin, captures: { b1_id: $.data.id } }
            - { call: "POST /api/buyers/${b1_id}/qualify", payload: { qualification_expires_at: "2026-09-01T00:00:00Z" }, as: PlatformAdmin }
            - { call: "POST /api/listings", payload: { seller_id: "${s_id}", title: "L1", county: "Dallas", state_code: "IA", total_gross_acres: 100, packaging_strategy: "WHOLE", reserve_price_total: 770000 }, as: BrokerAgent, as_user_id: "${g_id}", captures: { l_id: $.data.id, l_v: $.data.version } }
            - { call: "POST /api/tracts", payload: { listing_id: "${l_id}", tract_number: 1, gross_acres: 100, tillable_acres: 90, soil_productivity_index: 80, min_price: 700000, expected_listing_version: "${l_v}" }, as: BrokerAgent, as_user_id: "${g_id}", captures: { t1_id: $.data.id } }
            - { call: "POST /api/rights", payload: { tract_id: "${t1_id}", mineral_rights: "CONVEYED", wind_rights: "CONVEYED" }, as: BrokerAgent, as_user_id: "${g_id}" }
            - { call: "POST /api/listings/${l_id}/package", as: BrokerAgent, as_user_id: "${g_id}" }
            - { call: "POST /api/listings/${l_id}/market", as: BrokerAgent, as_user_id: "${g_id}" }
            - { call: "POST /api/auctions", payload: { listing_id: "${l_id}", method: "LIVE", scheduled_start: "2026-08-10T17:00:00Z", scheduled_end: "2026-08-10T19:00:00Z" }, as: BrokerAgent, as_user_id: "${g_id}", captures: { a_id: $.data.id, a_v: $.data.version } }
            - { call: "POST /api/_clock/set_current_utc", payload: { to_iso8601: "2026-08-10T17:00:00Z" }, as: PlatformAdmin }
            - { call: "POST /api/auctions/${a_id}/open", as: BrokerAgent, as_user_id: "${g_id}", captures: { a_v: $.data.version } }
            - { call: "POST /api/bids", payload: { auction_id: "${a_id}", amount: 770000, tract_ids: ["${t1_id}"], expected_auction_version: "${a_v}" }, as: Buyer, as_user_id: "${b1_id}", captures: { bid_id: $.data.id } }
            - { call: "POST /api/_clock/set_current_utc", payload: { to_iso8601: "2026-08-10T19:00:00Z" }, as: PlatformAdmin }
            - { call: "POST /api/auctions/${a_id}/award", as: BrokerAgent, as_user_id: "${g_id}" }
            - { call: "GET /api/bids/${bid_id}/deposits", as: BrokerAgent, as_user_id: "${g_id}", captures: { dep_id: "$.data[0].id", dep_due: "$.data[0].amount_due", dep_st: "$.data[0].status" } }
          trigger:
            - { call: "POST /api/deposits/${dep_id}/verify", as: PlatformAdmin, captures: { err: $.data.error_id } }
          assert:
            - "dep_st == PENDING and dep_due == 23100.00 (0.03 x 770000)"
            - "err == ERR_INVALID_DEPOSIT_STATE"

      - name: acknowledge_by_non_winning_buyer_forbidden
        claim_type: precondition_enforcement
        grounds:
          - "state_machines.LeaseDisclosure.DISCLOSED_to_ACKNOWLEDGED"
          - "errors[ERR_FORBIDDEN]"
        distinguishing_aspect: "A qualified buyer whose bid LOST cannot acknowledge the tract's disclosure — acknowledge is restricted to the CONFIRMED_WINNER buyer (ownership-style gate), rejected ERR_FORBIDDEN."
        test_recipe:
          setup: ["COMBINATION listing awarded: B1 individual [T1] 700000 loses to B3 combination [T1,T2] 1400000; disclosure D1 on T1 DISCLOSED"]
          setup_api_calls:
            - { call: "POST /api/sellers", payload: { full_name: "Seller One", email: "s1@x.com" }, as: PlatformAdmin, captures: { s_id: $.data.id } }
            - { call: "POST /api/agents", payload: { full_name: "Agent One", license_number: "LIC-001" }, as: PlatformAdmin, captures: { g_id: $.data.id } }
            - { call: "POST /api/comparables", payload: { county: "Dallas", state_code: "IA", sale_date: "2026-01-15T00:00:00Z", sale_price_total: 900000, gross_acres: 100, tillable_acres: 95, soil_productivity_index: 80 }, as: PlatformAdmin }
            - { call: "POST /api/comparables", payload: { county: "Dallas", state_code: "IA", sale_date: "2025-09-01T00:00:00Z", sale_price_total: 780000, gross_acres: 120, tillable_acres: 60, soil_productivity_index: 65 }, as: PlatformAdmin }
            - { call: "POST /api/comparables", payload: { county: "Polk", state_code: "IA", sale_date: "2024-09-01T00:00:00Z", sale_price_total: 550000, gross_acres: 100, tillable_acres: 50, soil_productivity_index: 55 }, as: PlatformAdmin }
            - { call: "POST /api/buyers", payload: { full_name: "Buyer One", email: "b1@x.com", proof_of_funds_amount: 2000000 }, as: PlatformAdmin, captures: { b1_id: $.data.id } }
            - { call: "POST /api/buyers/${b1_id}/qualify", payload: { qualification_expires_at: "2026-09-01T00:00:00Z" }, as: PlatformAdmin }
            - { call: "POST /api/buyers", payload: { full_name: "Buyer Three", email: "b3@x.com", proof_of_funds_amount: 2000000 }, as: PlatformAdmin, captures: { b3_id: $.data.id } }
            - { call: "POST /api/buyers/${b3_id}/qualify", payload: { qualification_expires_at: "2026-09-01T00:00:00Z" }, as: PlatformAdmin }
            - { call: "POST /api/listings", payload: { seller_id: "${s_id}", title: "L1", county: "Dallas", state_code: "IA", total_gross_acres: 160, packaging_strategy: "COMBINATION", reserve_price_total: 1200000 }, as: BrokerAgent, as_user_id: "${g_id}", captures: { l_id: $.data.id, l_v: $.data.version } }
            - { call: "POST /api/tracts", payload: { listing_id: "${l_id}", tract_number: 1, gross_acres: 100, tillable_acres: 90, soil_productivity_index: 80, min_price: 700000, expected_listing_version: "${l_v}" }, as: BrokerAgent, as_user_id: "${g_id}", captures: { t1_id: $.data.id } }
            - { call: "GET /api/listings/${l_id}", as: BrokerAgent, as_user_id: "${g_id}", captures: { l_v: $.data.version } }
            - { call: "POST /api/tracts", payload: { listing_id: "${l_id}", tract_number: 2, gross_acres: 60, tillable_acres: 30, soil_productivity_index: 70, min_price: 350000, expected_listing_version: "${l_v}" }, as: BrokerAgent, as_user_id: "${g_id}", captures: { t2_id: $.data.id } }
            - { call: "POST /api/rights", payload: { tract_id: "${t1_id}", mineral_rights: "CONVEYED", wind_rights: "RESERVED" }, as: BrokerAgent, as_user_id: "${g_id}" }
            - { call: "POST /api/rights", payload: { tract_id: "${t2_id}", mineral_rights: "CONVEYED", wind_rights: "CONVEYED" }, as: BrokerAgent, as_user_id: "${g_id}" }
            - { call: "POST /api/disclosures", payload: { tract_id: "${t1_id}", tenant_name: "Tenant A", lease_start_date: "2025-03-01T00:00:00Z", lease_end_date: "2026-10-15T00:00:00Z", annual_rent: 18000 }, as: BrokerAgent, as_user_id: "${g_id}", captures: { d_id: $.data.id } }
            - { call: "POST /api/listings/${l_id}/package", as: BrokerAgent, as_user_id: "${g_id}" }
            - { call: "POST /api/listings/${l_id}/market", as: BrokerAgent, as_user_id: "${g_id}" }
            - { call: "POST /api/auctions", payload: { listing_id: "${l_id}", method: "ONLINE", scheduled_start: "2026-08-10T17:00:00Z", scheduled_end: "2026-08-10T19:00:00Z" }, as: BrokerAgent, as_user_id: "${g_id}", captures: { a_id: $.data.id, a_v: $.data.version } }
            - { call: "POST /api/_clock/set_current_utc", payload: { to_iso8601: "2026-08-10T17:00:00Z" }, as: PlatformAdmin }
            - { call: "POST /api/auctions/${a_id}/open", as: BrokerAgent, as_user_id: "${g_id}", captures: { a_v: $.data.version } }
            - { call: "POST /api/bids", payload: { auction_id: "${a_id}", amount: 700000, tract_ids: ["${t1_id}"], expected_auction_version: "${a_v}" }, as: Buyer, as_user_id: "${b1_id}", captures: { bid1_id: $.data.id } }
            - { call: "GET /api/auctions/${a_id}", as: BrokerAgent, as_user_id: "${g_id}", captures: { a_v: $.data.version } }
            - { call: "POST /api/bids", payload: { auction_id: "${a_id}", amount: 1400000, tract_ids: ["${t1_id}", "${t2_id}"], expected_auction_version: "${a_v}" }, as: Buyer, as_user_id: "${b3_id}", captures: { bid3_id: $.data.id } }
            - { call: "POST /api/_clock/set_current_utc", payload: { to_iso8601: "2026-08-10T19:00:00Z" }, as: PlatformAdmin }
            - { call: "POST /api/auctions/${a_id}/award", as: BrokerAgent, as_user_id: "${g_id}" }
          trigger:
            - { call: "POST /api/disclosures/${d_id}/acknowledge", as: Buyer, as_user_id: "${b1_id}", captures: { err: $.data.error_id } }
          assert:
            - "err == ERR_FORBIDDEN (B1's bid is LOST, not CONFIRMED_WINNER)"

      - name: sealed_bids_hidden_then_revealed_at_close
        claim_type: side_effect_execution
        grounds:
          - "state_machines.Bid.SEALED_to_REVEALED"
          - "state_machines.AuctionEvent.OPEN_to_CLOSED_PENDING_AWARD"
        distinguishing_aspect: "SEALED_BID bids keep amount null on reads while SEALED; the close sweep flips them to REVEALED and exposes amounts — the reveal is a close side effect, not an endpoint."
        test_recipe:
          setup: ["WHOLE listing; SEALED_BID auction 2026-08-11 10:00-12:00Z OPEN; two qualified buyers place sealed bids 700000 and 710000"]
          setup_api_calls:
            - { call: "POST /api/sellers", payload: { full_name: "Seller One", email: "s1@x.com" }, as: PlatformAdmin, captures: { s_id: $.data.id } }
            - { call: "POST /api/agents", payload: { full_name: "Agent One", license_number: "LIC-001" }, as: PlatformAdmin, captures: { g_id: $.data.id } }
            - { call: "POST /api/comparables", payload: { county: "Dallas", state_code: "IA", sale_date: "2026-01-15T00:00:00Z", sale_price_total: 900000, gross_acres: 100, tillable_acres: 95, soil_productivity_index: 80 }, as: PlatformAdmin }
            - { call: "POST /api/buyers", payload: { full_name: "Buyer One", email: "b1@x.com", proof_of_funds_amount: 2000000 }, as: PlatformAdmin, captures: { b1_id: $.data.id } }
            - { call: "POST /api/buyers/${b1_id}/qualify", payload: { qualification_expires_at: "2026-09-01T00:00:00Z" }, as: PlatformAdmin }
            - { call: "POST /api/buyers", payload: { full_name: "Buyer Two", email: "b2@x.com", proof_of_funds_amount: 2000000 }, as: PlatformAdmin, captures: { b2_id: $.data.id } }
            - { call: "POST /api/buyers/${b2_id}/qualify", payload: { qualification_expires_at: "2026-09-01T00:00:00Z" }, as: PlatformAdmin }
