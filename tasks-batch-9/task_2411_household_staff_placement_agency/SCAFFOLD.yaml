  - method: POST
    path: /placements/{id}/confirm-start
    purpose: "Confirm the household's actual package on the start date: re-price the fee from its four components and re-allocate the milestone schedule."
    roles: [AgencyPrincipal]
    input: ["note?"]
    output: Placement
    side_effects:
      - "re-runs calculations.fee_percent_resolution against actual_first_year_compensation_cents and overwrites snapshot_fee_schedule_id, fee_percent_bps, guarantee_window_days"
      - "runs calculations.placement_fee_computation variant FINAL, overwrites fee_cents and sets fee_variant FINAL"
      - "recomputes guarantee_expires_on as start_date + guarantee_window_days"
      - "re-runs calculations.milestone_billing_schedule, freezing INVOICED / OVERDUE / PAID rows and re-amounting the PENDING ones"
      - "Placement PENDING_ACCEPTANCE -> ACTIVE, Candidate.availability_status OFFER_HELD -> PLACED, RoleRequisition OFFER_PENDING -> PLACED"
      - "recomputes Client.placement_count and sets Client.non_solicitation_expires_on to start_date + NON_SOLICITATION_TERM_DAYS"
    errors: [ERR_MISSING_AUTH_HEADER, ERR_UNAUTHORIZED, ERR_PLACEMENT_NOT_FOUND, ERR_ENTITY_TERMINAL, ERR_INVALID_STATE_TRANSITION, ERR_ACCOMMODATION_NOT_ACCEPTED, ERR_NO_FEE_SCHEDULE_MATCH]

