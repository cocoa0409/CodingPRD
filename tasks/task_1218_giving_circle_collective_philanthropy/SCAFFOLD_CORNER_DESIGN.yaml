  - section: complexity_layers
    instances:
      - name: advance_with_stale_cycle_version_rejected
        claim_type: optimistic_concurrency
        grounds:
          - concurrency_rules[cycle-advance-stale-version]
          - errors[ERR_STALE_VERSION]
        distinguishing_aspect: "OCC on GivingCycle.version: after one successful advance bumps the version, a second advance replaying the previously observed version is rejected 412 — two strictly sequential requests, no parallelism."
        test_recipe:
          setup: ["Cycle in RECRUITMENT with version advanced once beyond the captured value; one ACTIVE membership so guards would otherwise pass"]
          setup_api_calls:
            - { call: "POST /api/circles", payload: { name: "Circle CL1", admin_fee_percent: 5, quorum_percent: 50, standard_minimum_cents: 100000, leader_minimum_cents: 250000, operating_reserve_cents: 0, vetting_profile: "BALANCED" }, as: CircleAdmin, captures: { circle_id: $.data.id } }
            - { call: "POST /api/cycles", payload: { circle_id: "${circle_id}", year_label: "2026" }, as: CircleAdmin, captures: { cycle_id: $.data.id, cycle_v: $.data.version } }
            - { call: "POST /api/members", payload: { full_name: "M One", email: "m1.cl1@x.com" }, as: CircleAdmin, captures: { m1_id: $.data.id } }
            - { call: "POST /api/memberships", payload: { member_id: "${m1_id}", circle_id: "${circle_id}", tier: "STANDARD" }, as: CircleAdmin, captures: { ms1_id: $.data.id } }
            - { call: "POST /api/memberships/${ms1_id}/accept", payload: {}, as: Member, as_user_id: "${m1_id}" }
            - { call: "POST /api/cycles/${cycle_id}/advance", payload: { expected_cycle_version: "${cycle_v}" }, as: CircleAdmin, captures: { fresh_v: $.data.version } }
          trigger:
            - { call: "POST /api/cycles/${cycle_id}/advance", payload: { expected_cycle_version: "${cycle_v}" }, as: CircleAdmin, captures: { err: $.data.error_id } }
          assert:
            - "error_id == ERR_STALE_VERSION, HTTP 412 (expected ${cycle_v} but current == ${fresh_v})"
            - "GivingCycle.${cycle_id}.phase == RECRUITMENT"

      - name: recast_with_stale_ballot_version_rejected
