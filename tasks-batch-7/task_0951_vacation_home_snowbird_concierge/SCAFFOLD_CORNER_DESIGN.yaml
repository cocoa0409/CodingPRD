            - "Finding.${f2}.status == TRIAGED and escalation_score is unchanged"

  - section: consistency_model
    instances:
      - name: immediate_consistency_version_visible_in_the_mutating_response
        claim_type: immediate
        grounds: ["complexity_profile.consistency_model", "entities.Property.fields.version", "endpoints.PATCH /property-care/properties/{id}"]
        distinguishing_aspect: "The consistency model is immediate: the PATCH response itself already carries version 2 and the recomputed travel_zone Z3, and an immediately following GET returns byte-identical values with no lag."
        test_recipe:
          setup: ["One Z1 property at 8.0 miles."]
          setup_api_calls:
            - call: "POST /property-care/_clock/set_current_utc"
              payload: { to_iso8601: "2026-06-01T00:00:00Z" }
              as: PlatformAdmin
            - call: "POST /property-care/owners"
              payload: { full_name: "Imm Ver", email: "imm.ver@example.com", phone: "+15551100", primary_residence_state: "MN" }
              as: PlatformAdmin
              captures: { owner_id: $.data.id }
            - call: "POST /property-care/properties"
              payload: { owner_id: "${owner_id}", label: "Imm House", address_line: "8 Near Nook", state_code: "FL", travel_distance_miles: 8.0 }
              as: PlatformAdmin
              captures: { prop_id: $.data.id, v1: $.data.version, zone1: $.data.travel_zone }
          trigger:
            - call: "PATCH /property-care/properties/${prop_id}"
              payload: { travel_distance_miles: 45.0 }
              as: Dispatcher
              captures: { v2: $.data.version, zone2: $.data.travel_zone }
            - call: "GET /property-care/properties/${prop_id}"
              payload: {}
              as: Auditor
              captures: { v3: $.data.version, zone3: $.data.travel_zone }
          assert:
            - "the create response carried version 1 and travel_zone Z1"
            - "the PATCH response carries version 2 and travel_zone Z3"
            - "the following GET carries version 2 and travel_zone Z3, identical to the PATCH response"

      - name: immediate_consistency_cascaded_children_visible_in_the_same_request
        claim_type: immediate
        grounds: ["complexity_profile.consistency_model", "state_machines.Property.OPEN_to_CLOSING", "entities.WinterizationRecord.fields.status"]
        distinguishing_aspect: "A child row created as a cascade side effect is queryable immediately after the parent call returns: BEGIN_CLOSE returns the Property already in CLOSING and the WinterizationRecord it created is already listable in the very next request."
        test_recipe:
          setup: ["One OPEN, VACANT property with no WinterizationRecord."]
          setup_api_calls:
            - call: "POST /property-care/_clock/set_current_utc"
              payload: { to_iso8601: "2026-10-01T00:00:00Z" }
              as: PlatformAdmin
            - call: "POST /property-care/owners"
              payload: { full_name: "Imm Casc", email: "imm.casc@example.com", phone: "+15551101", primary_residence_state: "MN" }
              as: PlatformAdmin
              captures: { owner_id: $.data.id }
            - call: "POST /property-care/properties"
              payload: { owner_id: "${owner_id}", label: "ImmCasc House", address_line: "1 Now Nook", state_code: "FL", travel_distance_miles: 5.0 }
              as: PlatformAdmin
              captures: { prop_id: $.data.id }
          trigger:
            - call: "POST /property-care/properties/${prop_id}/seasonal-transitions"
              payload: { action: "BEGIN_CLOSE" }
              as: Dispatcher
              captures: { seasonal: $.data.seasonal_state }
            - call: "GET /property-care/winterization-records"
              payload: { property_id: "${prop_id}" }
              as: Dispatcher
              captures: { wr_id: "$.data[0].id" }
          assert:
            - "the transition response already carries seasonal_state == CLOSING"
            - "the immediately following list returns total_count == 1"
            - "WinterizationRecord.${wr_id}.status == NOT_STARTED and completeness_pct == 0.0"
            - "Property.${prop_id}.winterization_completeness_pct == 0.0"

      - name: immediate_consistency_rejected_write_leaves_no_partial_state
        claim_type: immediate
        grounds: ["complexity_profile.consistency_model", "validations[priority=50]", "calculations.key_copy_ledger"]
        distinguishing_aspect: "A rejected write is atomic: a key issuance refused at the copy-availability rung leaves KeyIssuance count 0, KeyAsset.copies_on_hand 2 and KeyAsset.version unchanged at 1, with no half-written issuance row."
        test_recipe:
          setup: ["A PHYSICAL KeyAsset with copies_total 2 and one ELIGIBLE locksmith."]
          setup_api_calls:
            - call: "POST /property-care/_clock/set_current_utc"
              payload: { to_iso8601: "2026-06-01T00:00:00Z" }
              as: PlatformAdmin
            - call: "POST /property-care/owners"
              payload: { full_name: "Atom Key", email: "atom.key@example.com", phone: "+15551102", primary_residence_state: "MN" }
              as: PlatformAdmin
              captures: { owner_id: $.data.id }
            - call: "POST /property-care/properties"
              payload: { owner_id: "${owner_id}", label: "AtomKey House", address_line: "1 Whole Way", state_code: "FL", travel_distance_miles: 5.0 }
              as: PlatformAdmin
              captures: { prop_id: $.data.id }
            - call: "POST /property-care/vendors"
              payload: { legal_name: "Atom Locks", trade: "LOCKSMITH", coi_expires_at: "2027-01-01T00:00:00Z", license_expires_at: "2027-01-01T00:00:00Z", hourly_rate_cents: 7000, rating: 4.0 }
              as: Dispatcher
              captures: { vendor_id: $.data.id }
            - call: "POST /property-care/vendors/${vendor_id}/reinstate"
              payload: {}
              as: Dispatcher
            - call: "POST /property-care/properties/${prop_id}/key-assets"
              payload: { key_type: "PHYSICAL", label: "Front", copies_total: 2 }
              as: Dispatcher
              captures: { ka_id: $.data.id, ka_v: $.data.version }
          trigger:
            - call: "POST /property-care/key-assets/${ka_id}/issuances"
              payload: { vendor_id: "${vendor_id}", copies_issued: 5 }
              as: Dispatcher
              captures: { err: $.data.error_id }
          assert:
            - "HTTP status == 409 and data.error_id == ERR_KEY_COPIES_UNAVAILABLE"
            - "GET /property-care/key-issuances with key_asset_id ${ka_id} returns total_count == 0"
            - "KeyAsset.${ka_id}.copies_on_hand == 2, copies_issued_outstanding == 0, copies_lost == 0"
            - "KeyAsset.${ka_id}.version == 1, unchanged by the rejected write"

      - name: immediate_consistency_compensating_void_settles_inside_one_request
        claim_type: immediate
        grounds: ["complexity_profile.consistency_model", "conservation_invariants[invoice-line-sum-conservation]", "endpoints.POST /property-care/invoice-lines/{id}/void"]
        distinguishing_aspect: "The void response itself already reflects the reconciled parent: reading the invoice immediately after voiding a 3300 MAIL_DISPOSITION line returns gross 19986, tax 1399 and total 21385 with no intermediate stale value ever observable."
        test_recipe:
          setup: ["A DRAFT invoice of 21385 with one appended 3300 MAIL_DISPOSITION line."]
          setup_api_calls:
            - call: "POST /property-care/_clock/set_current_utc"
              payload: { to_iso8601: "2026-06-01T00:00:00Z" }
              as: PlatformAdmin
            - call: "POST /property-care/owners"
              payload: { full_name: "Imm Void", email: "imm.void@example.com", phone: "+15551103", primary_residence_state: "MN" }
              as: PlatformAdmin
              captures: { owner_id: $.data.id }
            - call: "POST /property-care/properties"
              payload: { owner_id: "${owner_id}", label: "ImmVoid House", address_line: "1 Undo Ave", state_code: "FL", travel_distance_miles: 18.0 }
              as: PlatformAdmin
              captures: { prop_id: $.data.id }
            - call: "POST /property-care/service-plans"
              payload: { tier: "STANDARD", monthly_fee_cents: 19986, included_visit_units: 4, covered_visit_types: ["ROUTINE_WATCH"] }
              as: PlatformAdmin
              captures: { plan_id: $.data.id }
            - call: "POST /property-care/subscriptions"
              payload: { property_id: "${prop_id}", service_plan_id: "${plan_id}", started_on: "2026-06-01T00:00:00Z" }
              as: AccountManager
              captures: { sub_id: $.data.id }
            - call: "POST /property-care/subscriptions/${sub_id}/activate"
              payload: {}
              as: AccountManager
              captures: { cycle_id: $.data.current_cycle_id }
            - call: "POST /property-care/billing-cycles/${cycle_id}/invoices"
              payload: {}
              as: AccountManager
              captures: { inv_id: $.data.id }
            - call: "POST /property-care/invoices/${inv_id}/lines"
              payload: { line_type: "MAIL_DISPOSITION", description: "Forwarding", amount_cents: 3300 }
              as: AccountManager
              captures: { line_id: $.data.id }
          trigger:
            - call: "POST /property-care/invoice-lines/${line_id}/void"
              payload: {}
              as: AccountManager
            - call: "GET /property-care/invoices/${inv_id}"
              payload: {}
              as: AccountManager
              captures: { gross_after: $.data.gross_service_cents, tax_after: $.data.tax_cents, total_after: $.data.total_cents }
          assert:
            - "before the void Invoice.${inv_id}.gross_service_cents == 23286, tax_cents == 1630 and total_cents == 24916"
            - "InvoiceLine.${line_id}.status == VOID and tax_cents == 0"
            - "the GET immediately after the void returns gross_service_cents 19986, tax_cents 1399 and total_cents 21385"
