          target: 0.05
          cap_pct_of_gross: 0.5
          remedy_fee_cents: 800
          effective_from: '2026-09-01T00:00:00Z'
        as: OpsManager
        captures:
          occ_sl2: $.data.id
      - *id005
      - *id006
