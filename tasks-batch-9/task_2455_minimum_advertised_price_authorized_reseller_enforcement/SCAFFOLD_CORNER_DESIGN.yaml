            - "${aid} == null"
            - "PricingException.${exc}.status == APPROVED"

      # --- violation_points -------------------------------------------------
      - name: violation_points_second_deviation_tier_with_marketplace_multiplier
        claim_type: correct_result
        grounds: ["calculations.violation_points"]
        distinguishing_aspect: "A 14000 MARKETPLACE listing against a 15000 floor gives deviation 1000, pct 0.0667 (tier 2 -> base 2), channel 1.5 and repeat 1.00, so the single terminal rounding yields 3 points."
        test_recipe:
          setup: ["Policy MAP-2026-A PUBLISHED; reseller Acme AUTHORIZED with no prior violations."]
          setup_api_calls:
            - *CLK0801
            - *POLNEW
            - *POLSUB
            - *POLDEC
            - *POLPUB
            - *PRODA1
            - *RESACME
            - *AGRNEW
            - *AGRSEND
            - *AGRSIGN
            - *AGRACT
            - *CLK0820
            - *OBS14000
          trigger:
            - call: "POST /price-observations/${obs}/evaluate"
              payload: {}
              as: MonitoringAnalyst
              as_user_id: "analyst-1"
              captures: { dc: $.data.deviation_cents, dp: $.data.deviation_pct, pp: $.data.provisional_points, vid: $.data.violation_id }
          assert:
            - "HTTP 200"
            - "${dc} == 1000"
            - "${dp} == 0.0667"
            - "${pp} == 3"
            - "Violation.${vid}.provisional_points == 3"
            - "Violation.${vid}.status == DETECTED"

      - name: violation_points_physical_retail_half_multiplier_rounds_up_to_one
        claim_type: precision
        grounds: ["calculations.violation_points"]
        distinguishing_aspect: "Terminal-only rounding is visible here: base 1 x PHYSICAL_RETAIL 0.5 x repeat 1.00 = 0.5, which round_half_up turns into 1 point rather than the 0 that per-factor rounding would give."
        test_recipe:
          setup: ["Policy MAP-2026-A PUBLISHED; product floor 15000; an unmatched PHYSICAL_RETAIL listing at 14300 (pct 0.0467, tier 1)."]
          setup_api_calls:
            - *CLK0801
            - *POLNEW
            - *POLSUB
            - *POLDEC
            - *POLPUB
            - *PRODA1
            - *CLK0820
