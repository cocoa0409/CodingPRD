      - name: dispute_accept_correction_cascade
        grounds:
          - state_machines.Dispute.DATA_CORRECTION_to_RESOLVED_ACCEPTED
          - state_machines.ProductionCapture.CREDITED_to_REVERSED
          - calculations.supervision_credit_allocation
          - entities.PhysicianAgreement.fields.ytd_wrvu_credited
        distinguishing_aspect: |
          Depth-3 cascade originating from dispute resolution (a different trigger than the PCR
          cascade): resolve ACCEPTED with correction -> APP capture CREDITED->REVERSED (hop 1) ->
          its SUPERVISION_CREDIT child CREDITED->REVERSED (hop 2, caused by hop 1) -> supervisor
          agreement ytd_wrvu_credited recomputed (hop 3, caused by hop 2), while the replacement
          capture re-runs allocation and the APP's DRAFT statement recomputes.
        test_recipe:
          setup:
            - "ACTIVE plan (rate 99213=0.97, single tier T1 0@4500c); SUP1 (PHYSICIAN) and APP1 (APP) EFFECTIVE on the plan; assignment SUP1<-APP1 credit_pct 0.5, window 2026-01-01..2026-12-31"
            - "APP capture CAP 99213 x 10 validated (APP ytd 9.70; SUP1 supervision credit 4.85, SUP1 ytd 4.85)"
            - "DRAFT statement S_APP on the APP agreement for 2026-02 (period_wrvu 9.70)"
