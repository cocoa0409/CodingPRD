# =============================================================================
# 1.8 Scaffold Difficulty Design (Test Targeting Index)
# Task 2697 — Out-of-District Special Education Placement & Tuition
# 9 rule_ids · 24 instances · every literal below was executed against the
# §1.3 formulas and their constants before being written down.
# =============================================================================
scaffold_difficulty_design:

  # ===========================================================================
  - rule_id: dual_variant_calc
    instances:
      - name: invoice_enrollment_basis_versus_attendance_basis
        grounds:
          - calculations.invoice_verified_amount
          - calculations.invoice_net_payable
          - state_machines.TuitionInvoice.SUBMITTED_to_VERIFIED
          - entities.TuitionInvoice.fields.provisional_amount_cents
          - entities.TuitionInvoice.fields.final_amount_cents
          - entities.TuitionInvoice.fields.verification_basis
        distinguishing_aspect: |
          This instance lives in the FISCAL domain: the two variants disagree only on the
          billable-day count (days_enrolled = 20 versus days_attended + min(absences, 3) = 19),
          and on identical input data they produce 799411 and 767182 cents, a 32229-cent gap
          that the verify call stores side by side on the same invoice row.
        test_recipe:
          setup:
            - "Logical clock starts at its mandatory default 2026-08-01T00:00:00Z, then advances to 2026-09-01T08:00:00Z for activation and 2026-11-02T09:00:00Z for billing."
            - "DistrictFiscalAccount FY2027 with authorized_cents 100000000."
            - "ApprovedPrivateSchool APPROVED, residential_capable, with a STATE_APPROVED FY2027 rate schedule at day 32000 / residential 51500 / service-hour 11000 cents."
            - "One ACTIVE DAY Placement, 180 contracted instructional days, contract_encumbrance_cents 5760000."
            - "Two ACTIVE ServiceAddenda: SPEECH at 2.0 h/week (encumbrance 792000) and OT at 1.5 h/week (encumbrance 594000), both with hourly_rate_cents pinned to 11000."
            - "One VERIFIED AttendanceRecord for 2026-10-05..2026-11-01: 20 days enrolled, 16 attended, 4 unexcused absences, 0 residential nights, service lines 7.5 h on addendum 1 and 5.5 h on addendum 2."
            - "One SUBMITTED TuitionInvoice for that period with submitted_amount_cents 799411 and transport_days_billed 0."
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { current_utc: "2026-08-01T00:00:00Z" }
              as: SystemAdmin
              as_user_id: "u-admin-1"
            - call: "POST /ood-placements/fiscal-accounts"
              payload: { fiscal_year: 2027, account_code: "OOD-TUITION-2027", authorized_cents: 100000000 }
              as: FiscalOfficer
              as_user_id: "u-fiscal-1"
              captures: { acct_id: $.data.id }
            - call: "POST /ood-placements/students"
              payload: { state_student_id: "SS-0001", full_name: "Ada Reyes", district_of_residence: "Northvale USD", disability_category: "AUTISM", iep_effective_date: "2026-08-15", lre_current_setting: "SEPARATE_CLASS_UNDER_40", medicaid_eligible: true, medicaid_consent_on_file: true }
              as: PlacementCoordinator
              as_user_id: "u-coord-1"
              captures: { stu_id: $.data.id }
            - call: "POST /ood-placements/private-schools"
              payload: { name: "Harbor Academy", state_approval_id: "SA-7781", approval_status: "APPROVED", residential_capable: true, medicaid_provider_number: "MP-4410" }
              as: SystemAdmin
              as_user_id: "u-admin-1"
              captures: { sch_id: $.data.id, sch_v: $.data.version }
            - call: "POST /ood-placements/tuition-rate-schedules"
              payload: { school_id: "${sch_id}", fiscal_year: 2027, day_rate_cents: 32000, residential_rate_cents: 51500, service_hourly_rate_cents: 11000, effective_from: "2026-07-01", effective_to: "2027-06-30", approval_state: "STATE_APPROVED", expected_school_version: "${sch_v}" }
              as: FiscalOfficer
              as_user_id: "u-fiscal-1"
              captures: { rs_id: $.data.id }
            - call: "POST /ood-placements/placement-decisions"
              payload:
                student_id: "${stu_id}"
                lre_justification: "In-district resource room and co-taught general education were implemented for two consecutive quarters without measurable progress on communication goals."
                recommended_placement_type: "DAY"
                continuum_options_considered:
                  - { setting: "GENERAL_EDUCATION_WITH_SUPPORTS", rejected_reason: "No progress across two quarters of push-in support." }
                  - { setting: "RESOURCE_40_79", rejected_reason: "Insufficient intensity for communication goals." }
                  - { setting: "SEPARATE_CLASS_UNDER_40", rejected_reason: "No certified program available in district." }
              as: PlacementCoordinator
              as_user_id: "u-coord-1"
              captures: { dec_id: $.data.id }
            - call: "POST /ood-placements/placement-decisions/${dec_id}/submit"
              payload: {}
              as: PlacementCoordinator
              as_user_id: "u-coord-1"
            - call: "POST /ood-placements/placement-decisions/${dec_id}/approve"
              payload: { reviewer_notes: "Team concurs with out-of-district day placement." }
              as: TeamChair
              as_user_id: "u-chair-1"
            - call: "POST /ood-placements/placements"
              payload: { student_id: "${stu_id}", school_id: "${sch_id}", decision_id: "${dec_id}", rate_schedule_id: "${rs_id}", fiscal_account_id: "${acct_id}", placement_type: "DAY", start_date: "2026-09-01", end_date: "2027-06-15", contracted_instructional_days: 180, contracted_residential_nights: 0, transportation_required: false }
              as: PlacementCoordinator
              as_user_id: "u-coord-1"
              captures: { pl_id: $.data.id }
            - call: "POST /ood-placements/placements/${pl_id}/execute-contract"
              payload: {}
              as: FiscalOfficer
              as_user_id: "u-fiscal-1"
            - call: "POST /_clock/set_current_utc"
              payload: { current_utc: "2026-09-01T08:00:00Z" }
              as: SystemAdmin
              as_user_id: "u-admin-1"
            - call: "POST /ood-placements/placements/${pl_id}/activate"
              payload: {}
              as: PlacementCoordinator
              as_user_id: "u-coord-1"
            - call: "POST /ood-placements/service-addenda"
              payload: { placement_id: "${pl_id}", service_type: "SPEECH", authorized_hours_per_week: 2.0, contract_weeks: 36, medicaid_billable: true }
              as: PlacementCoordinator
              as_user_id: "u-coord-1"
              captures: { add1_id: $.data.id }
            - call: "POST /ood-placements/service-addenda/${add1_id}/authorize"
              payload: {}
              as: FiscalOfficer
              as_user_id: "u-fiscal-1"
            - call: "POST /ood-placements/service-addenda"
              payload: { placement_id: "${pl_id}", service_type: "OT", authorized_hours_per_week: 1.5, contract_weeks: 36, medicaid_billable: false }
              as: PlacementCoordinator
              as_user_id: "u-coord-1"
              captures: { add2_id: $.data.id }
            - call: "POST /ood-placements/service-addenda/${add2_id}/authorize"
              payload: {}
              as: FiscalOfficer
              as_user_id: "u-fiscal-1"
            - call: "POST /_clock/set_current_utc"
              payload: { current_utc: "2026-11-02T09:00:00Z" }
              as: SystemAdmin
              as_user_id: "u-admin-1"
            - call: "POST /ood-placements/attendance-records"
              payload:
                placement_id: "${pl_id}"
                period_start: "2026-10-05"
                period_end: "2026-11-01"
                days_enrolled: 20
                days_attended: 16
                days_absent_unexcused: 4
                residential_nights: 0
                service_delivery_lines:
                  - { service_addendum_id: "${add1_id}", hours_delivered: 7.5 }
                  - { service_addendum_id: "${add2_id}", hours_delivered: 5.5 }
              as: SchoolBillingAgent
              as_user_id: "${sch_id}"
              captures: { ar_id: $.data.id }
            - call: "POST /ood-placements/attendance-records/${ar_id}/verify"
              payload: { decision: "ACCEPT" }
              as: PlacementCoordinator
              as_user_id: "u-coord-1"
            - call: "GET /ood-placements/placements/${pl_id}"
              payload: {}
              as: FiscalOfficer
              as_user_id: "u-fiscal-1"
              captures: { pl_v: $.data.version }
            - call: "POST /ood-placements/tuition-invoices"
              payload: { placement_id: "${pl_id}", attendance_record_id: "${ar_id}", billing_period_start: "2026-10-05", billing_period_end: "2026-11-01", submitted_amount_cents: 799411, transport_days_billed: 0, expected_placement_version: "${pl_v}" }
              as: SchoolBillingAgent
              as_user_id: "${sch_id}"
              captures: { inv_id: $.data.id }
          trigger:
            - call: "POST /ood-placements/tuition-invoices/${inv_id}/verify"
              payload: { basis: "ENROLLMENT" }
              as: PlacementCoordinator
              as_user_id: "u-coord-1"
          assert:
            - "TuitionInvoice.${inv_id}.tuition_line_cents == 640000"
            - "TuitionInvoice.${inv_id}.residential_line_cents == 0"
            - "TuitionInvoice.${inv_id}.service_lines_total_cents == 153726"
            - "TuitionInvoice.${inv_id}.transport_line_cents == 0"
            - "TuitionInvoice.${inv_id}.gross_billable_cents == 793726"
            - "TuitionInvoice.${inv_id}.volume_credit_cents == 11906"
            - "TuitionInvoice.${inv_id}.admin_fee_cents == 17591"
            - "TuitionInvoice.${inv_id}.provisional_amount_cents == 799411"
            - "TuitionInvoice.${inv_id}.final_amount_cents == 767182"
            - "TuitionInvoice.${inv_id}.provisional_amount_cents - TuitionInvoice.${inv_id}.final_amount_cents == 32229"
            - "TuitionInvoice.${inv_id}.verified_amount_cents == 799411"
            - "TuitionInvoice.${inv_id}.verification_basis == ENROLLMENT"
            - "TuitionInvoice.${inv_id}.variance_pct == 0.0"
            - "TuitionInvoice.${inv_id}.verification_status == VERIFIED"
            - "TuitionInvoice.${inv_id}.payment_status == UNPAID"

      - name: return_readiness_trailing_versus_recency_weighted
        grounds:
          - calculations.return_readiness_score
          - state_machines.ReturnTransitionPlan.DRAFT_to_ACTIVE
          - state_machines.ProgressReport.SUBMITTED_to_ACCEPTED
          - entities.ProgressReport.fields.report_score
          - entities.ReturnTransitionPlan.fields.readiness_score_at_activation
        distinguishing_aspect: |
          This instance lives in the EDUCATIONAL-PROGRESS domain, not the fiscal one: the two
          variants disagree on the INPUT WINDOW rather than on a rate, with trailing_two_quarter
          discarding the oldest accepted report entirely (71.65) while cumulative_recency_weighted
          keeps it at weight 0.49 (67.12) — a 4.53-point gap driven by a decay curve, not by money.
        test_recipe:
          setup:
            - "Clock default 2026-08-01T00:00:00Z, advanced to 2026-09-01T08:00:00Z for activation and 2027-04-01T09:00:00Z for reporting."
            - "One ACTIVE DAY Placement (same base fixture as invoice_enrollment_basis_versus_attendance_basis, no addenda needed)."
            - "Three ACCEPTED ProgressReports on that placement, all with goals_total 10: Q1 (met 4, regressed 2, benchmark 55, attendance 88) -> report_score 46.10; Q2 (met 6, regressed 1, benchmark 62, attendance 92) -> 63.00; Q3 (met 8, regressed 0, benchmark 71, attendance 95) -> 80.30."
            - "One DRAFT ReturnTransitionPlan on that placement."
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { current_utc: "2026-08-01T00:00:00Z" }
              as: SystemAdmin
              as_user_id: "u-admin-1"
            - call: "POST /ood-placements/fiscal-accounts"
              payload: { fiscal_year: 2027, account_code: "OOD-TUITION-2027", authorized_cents: 100000000 }
              as: FiscalOfficer
              as_user_id: "u-fiscal-1"
              captures: { acct_id: $.data.id }
            - call: "POST /ood-placements/students"
              payload: { state_student_id: "SS-0002", full_name: "Ben Ortiz", district_of_residence: "Northvale USD", disability_category: "EMOTIONAL_DISABILITY", iep_effective_date: "2026-08-15", lre_current_setting: "SEPARATE_CLASS_UNDER_40", medicaid_eligible: false, medicaid_consent_on_file: false }
              as: PlacementCoordinator
              as_user_id: "u-coord-1"
              captures: { stu_id: $.data.id }
            - call: "POST /ood-placements/private-schools"
              payload: { name: "Harbor Academy", state_approval_id: "SA-7781", approval_status: "APPROVED", residential_capable: true, medicaid_provider_number: "MP-4410" }
              as: SystemAdmin
              as_user_id: "u-admin-1"
              captures: { sch_id: $.data.id, sch_v: $.data.version }
            - call: "POST /ood-placements/tuition-rate-schedules"
              payload: { school_id: "${sch_id}", fiscal_year: 2027, day_rate_cents: 32000, residential_rate_cents: 51500, service_hourly_rate_cents: 11000, effective_from: "2026-07-01", effective_to: "2027-06-30", approval_state: "STATE_APPROVED", expected_school_version: "${sch_v}" }
              as: FiscalOfficer
              as_user_id: "u-fiscal-1"
              captures: { rs_id: $.data.id }
            - call: "POST /ood-placements/placement-decisions"
              payload: { student_id: "${stu_id}", recommended_placement_type: "DAY", lre_justification: "Two quarters of in-district behavioral supports produced no reduction in crisis episodes or work refusal.", continuum_options_considered: [{ setting: "GENERAL_EDUCATION_WITH_SUPPORTS", rejected_reason: "Crisis frequency unchanged." }, { setting: "RESOURCE_40_79", rejected_reason: "Insufficient clinical staffing." }, { setting: "SEPARATE_CLASS_UNDER_40", rejected_reason: "No therapeutic program in district." }] }
              as: PlacementCoordinator
              as_user_id: "u-coord-1"
              captures: { dec_id: $.data.id }
            - call: "POST /ood-placements/placement-decisions/${dec_id}/submit"
              payload: {}
              as: PlacementCoordinator
              as_user_id: "u-coord-1"
            - call: "POST /ood-placements/placement-decisions/${dec_id}/approve"
              payload: { reviewer_notes: "Approved." }
              as: TeamChair
              as_user_id: "u-chair-1"
            - call: "POST /ood-placements/placements"
              payload: { student_id: "${stu_id}", school_id: "${sch_id}", decision_id: "${dec_id}", rate_schedule_id: "${rs_id}", fiscal_account_id: "${acct_id}", placement_type: "DAY", start_date: "2026-09-01", end_date: "2027-06-15", contracted_instructional_days: 180, contracted_residential_nights: 0, transportation_required: false }
              as: PlacementCoordinator
              as_user_id: "u-coord-1"
              captures: { pl_id: $.data.id }
            - call: "POST /ood-placements/placements/${pl_id}/execute-contract"
              payload: {}
              as: FiscalOfficer
              as_user_id: "u-fiscal-1"
            - call: "POST /_clock/set_current_utc"
              payload: { current_utc: "2026-09-01T08:00:00Z" }
              as: SystemAdmin
              as_user_id: "u-admin-1"
            - call: "POST /ood-placements/placements/${pl_id}/activate"
              payload: {}
              as: PlacementCoordinator
              as_user_id: "u-coord-1"
            - call: "POST /ood-placements/progress-reports"
              payload: { placement_id: "${pl_id}", fiscal_year: 2027, quarter: 1, goals_total: 10, goals_met: 4, goals_regressed: 2, benchmark_scaled_score: 55, attendance_rate_pct: 88 }
              as: SchoolBillingAgent
              as_user_id: "${sch_id}"
              captures: { pr1_id: $.data.id }
            - call: "POST /ood-placements/progress-reports/${pr1_id}/accept"
              payload: { decision: "ACCEPT" }
              as: PlacementCoordinator
              as_user_id: "u-coord-1"
            - call: "POST /ood-placements/progress-reports"
              payload: { placement_id: "${pl_id}", fiscal_year: 2027, quarter: 2, goals_total: 10, goals_met: 6, goals_regressed: 1, benchmark_scaled_score: 62, attendance_rate_pct: 92 }
              as: SchoolBillingAgent
              as_user_id: "${sch_id}"
              captures: { pr2_id: $.data.id }
            - call: "POST /ood-placements/progress-reports/${pr2_id}/accept"
              payload: { decision: "ACCEPT" }
              as: PlacementCoordinator
              as_user_id: "u-coord-1"
            - call: "POST /ood-placements/progress-reports"
              payload: { placement_id: "${pl_id}", fiscal_year: 2027, quarter: 3, goals_total: 10, goals_met: 8, goals_regressed: 0, benchmark_scaled_score: 71, attendance_rate_pct: 95 }
              as: SchoolBillingAgent
              as_user_id: "${sch_id}"
              captures: { pr3_id: $.data.id }
            - call: "POST /ood-placements/progress-reports/${pr3_id}/accept"
              payload: { decision: "ACCEPT" }
              as: PlacementCoordinator
              as_user_id: "u-coord-1"
            - call: "POST /_clock/set_current_utc"
              payload: { current_utc: "2027-04-01T09:00:00Z" }
              as: SystemAdmin
              as_user_id: "u-admin-1"
            - call: "POST /ood-placements/return-transition-plans"
              payload: { placement_id: "${pl_id}", target_return_date: "2027-08-24", receiving_program: "Northvale HS Therapeutic Support Center" }
              as: PlacementCoordinator
              as_user_id: "u-coord-1"
              captures: { plan_id: $.data.id }
          trigger:
            - call: "GET /ood-placements/return-transition-plans/${plan_id}/readiness"
              payload: { variant: "trailing_two_quarter" }
              as: TeamChair
              as_user_id: "u-chair-1"
              captures: { trailing_score: $.data.readiness_score }
            - call: "GET /ood-placements/return-transition-plans/${plan_id}/readiness"
              payload: { variant: "cumulative_recency_weighted" }
              as: TeamChair
              as_user_id: "u-chair-1"
              captures: { cumulative_score: $.data.readiness_score }
          assert:
            - "ProgressReport.${pr1_id}.report_score == 46.10"
            - "ProgressReport.${pr2_id}.report_score == 63.00"
            - "ProgressReport.${pr3_id}.report_score == 80.30"
            - "${trailing_score} == 71.65"
            - "${cumulative_score} == 67.12"
            - "${trailing_score} - ${cumulative_score} == 4.53"
            - "both readiness reads return accepted_report_count == 3"
            - "both readiness reads return readiness_met == true"
            - "ReturnTransitionPlan.${plan_id}.readiness_score_at_activation == 0 (neither computed read mutates the plan)"
            - "ReturnTransitionPlan.${plan_id}.status == DRAFT"

      - name: reimbursement_strict_statutory_versus_equitable_actual_cost
        grounds:
          - calculations.reimbursement_award
          - state_machines.ReimbursementClaim.FILED_to_AWARDED_PARTIAL
          - validations[priority=12]
          - entities.ReimbursementClaim.fields.award_basis
          - entities.ReimbursementClaim.fields.eligible_amount_cents
        distinguishing_aspect: |
          This instance lives in the ADJUDICATION domain and its variant switch flips a
          STATUTORY CEILING on and off rather than changing a counting basis: with
          claimed_instructional_days 150 the day-rate cap is 4200000, so strict_statutory
          awards 2610000 while equitable_actual_cost awards 2790000 on byte-identical claim data.
        test_recipe:
          setup:
            - "Clock at the default 2026-08-01T00:00:00Z; no placement exists, so no concurrent-placement bar applies."
            - "DistrictFiscalAccount FY2027 with authorized_cents 100000000."
            - "Two FILED ReimbursementClaims for the same student with IDENTICAL figures: claimed_tuition_cents 4500000, claimed_transport_cents 200000, claimed_instructional_days 150, notice_date 2026-08-25, unilateral_start_date 2026-09-01, prior_district_offer_date 2026-08-20, parent_cooperation true."
            - "Both therefore accrue LATE_NOTICE_REDUCTION_PCT 0.25 (7 days notice < 10) plus TIMELY_OFFER_REDUCTION_PCT 0.15 = equitable_reduction_pct 0.40."
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { current_utc: "2026-08-01T00:00:00Z" }
              as: SystemAdmin
              as_user_id: "u-admin-1"
            - call: "POST /ood-placements/fiscal-accounts"
              payload: { fiscal_year: 2027, account_code: "OOD-TUITION-2027", authorized_cents: 100000000 }
              as: FiscalOfficer
              as_user_id: "u-fiscal-1"
              captures: { acct_id: $.data.id }
            - call: "POST /ood-placements/students"
              payload: { state_student_id: "SS-0003", full_name: "Cara Lin", district_of_residence: "Northvale USD", disability_category: "SPECIFIC_LEARNING_DISABILITY", iep_effective_date: "2026-08-15", lre_current_setting: "RESOURCE_40_79", medicaid_eligible: false, medicaid_consent_on_file: false }
              as: PlacementCoordinator
              as_user_id: "u-coord-1"
              captures: { stu_id: $.data.id }
            - call: "POST /ood-placements/reimbursement-claims"
              payload: { student_id: "${stu_id}", fiscal_account_id: "${acct_id}", unilateral_school_name: "Lakeside Prep", claimed_tuition_cents: 4500000, claimed_transport_cents: 200000, claimed_instructional_days: 150, notice_date: "2026-08-25", unilateral_start_date: "2026-09-01", unilateral_end_date: "2027-06-15", prior_district_offer_date: "2026-08-20", parent_cooperation: true }
              as: ParentGuardian
              as_user_id: "${stu_id}"
              captures: { claim_a_id: $.data.id }
            - call: "POST /ood-placements/reimbursement-claims"
              payload: { student_id: "${stu_id}", fiscal_account_id: "${acct_id}", unilateral_school_name: "Lakeside Prep", claimed_tuition_cents: 4500000, claimed_transport_cents: 200000, claimed_instructional_days: 150, notice_date: "2026-08-25", unilateral_start_date: "2026-09-01", unilateral_end_date: "2027-06-15", prior_district_offer_date: "2026-08-20", parent_cooperation: true }
              as: ParentGuardian
              as_user_id: "${stu_id}"
              captures: { claim_b_id: $.data.id }
          trigger:
            - call: "POST /ood-placements/reimbursement-claims/${claim_a_id}/adjudicate"
              payload: { award_basis: "strict_statutory" }
              as: HearingAdjudicator
              as_user_id: "u-hearing-1"
            - call: "POST /ood-placements/reimbursement-claims/${claim_b_id}/adjudicate"
              payload: { award_basis: "equitable_actual_cost", equitable_findings: "District offer was not reasonably calculated to confer benefit on these communication goals." }
              as: HearingAdjudicator
              as_user_id: "u-hearing-1"
          assert:
            - "ReimbursementClaim.${claim_a_id}.equitable_reduction_pct == 0.40"
            - "ReimbursementClaim.${claim_a_id}.eligible_amount_cents == 4350000"
            - "ReimbursementClaim.${claim_a_id}.awarded_tuition_cents == 2520000"
            - "ReimbursementClaim.${claim_a_id}.awarded_transport_cents == 90000"
            - "ReimbursementClaim.${claim_a_id}.awarded_amount_cents == 2610000"
            - "ReimbursementClaim.${claim_a_id}.status == AWARDED_PARTIAL"
            - "ReimbursementClaim.${claim_b_id}.equitable_reduction_pct == 0.40"
            - "ReimbursementClaim.${claim_b_id}.eligible_amount_cents == 4650000"
            - "ReimbursementClaim.${claim_b_id}.awarded_tuition_cents == 2700000"
            - "ReimbursementClaim.${claim_b_id}.awarded_transport_cents == 90000"
            - "ReimbursementClaim.${claim_b_id}.awarded_amount_cents == 2790000"
            - "ReimbursementClaim.${claim_b_id}.awarded_amount_cents - ReimbursementClaim.${claim_a_id}.awarded_amount_cents == 180000"
            - "DistrictFiscalAccount.${acct_id}.disbursed_cents == 5400000"
            - "DistrictFiscalAccount.${acct_id}.available_cents == 94600000"
            - "DistrictFiscalAccount.${acct_id}.authorized_cents == DistrictFiscalAccount.${acct_id}.available_cents + DistrictFiscalAccount.${acct_id}.encumbered_cents + DistrictFiscalAccount.${acct_id}.disbursed_cents"

  # ===========================================================================
  - rule_id: combinatorial_formula
    instances:
      - name: high_cost_fund_nested_min_max_tier_and_per_student_cap
        grounds:
          - calculations.funding_claim_reimbursable
