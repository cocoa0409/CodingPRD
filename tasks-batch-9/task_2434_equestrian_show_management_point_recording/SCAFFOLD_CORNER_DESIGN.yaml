      - name: class_creation_requires_division_of_this_show
        claim_type: parent_relationships
        grounds:
          - entities.ShowClass.parent
          - validations.priority_5
          - validations.priority_33
          - errors.ERR_DIVISION_NOT_FOUND
          - errors.ERR_QUALIFIER_CYCLE
        distinguishing_aspect: |
          A ShowClass hangs off a CompetitionDivision, and its self-referential
          qualifier_for_class_id must stay inside the SAME show. Pointing a class of
          show 2 at a class of show 1 is a 409 ERR_QUALIFIER_CYCLE (the rule's
          same-show clause), not a 404 and not a silent cross-show link — while a
          two-hop chain inside one show is legal.
        test_recipe:
          setup:
            - "Show 1 (DRAFT) with a JUMPER division holding class 101 and class 102 (qualifier_for_class_id = 101)."
            - "Show 2 (DRAFT) with its own JUMPER division."
          setup_api_calls:
            - call: "POST /shows"
              payload: { name: "Autumn Classic", federation_show_id: "FED-2434", venue: "Ridgeline Park", competition_level: "LOCAL", start_utc: "2026-09-10T13:00:00Z", end_utc: "2026-09-13T22:00:00Z", entry_close_utc: "2026-09-01T00:00:00Z", prize_money_pool_cents: 750000, stall_capacity: 40, stall_fee_cents: 7500 }
              as: ShowSecretary
              captures: { show1_id: $.data.id }
