scaffold_difficulty_design:
  - rule_id: dual_variant_calc
    instances:
      - name: variance_basis_nameplate_vs_as_calibrated_diverges
        grounds:
          - calculations.expected_chemical_consumption
          - calculations.usage_variance_classification
          - calculations.rack_count_in_period
          - entities.UsageVarianceReview.fields.basis
          - entities.Dispenser.fields.calibrated_dose_ml_per_rack
        distinguishing_aspect: |
          Subject is chemical consumption on the Dispenser/UsageVarianceReview domain: NAMEPLATE prices
          all 3000 racks at the product's spec dose 8.00 ml (24000 ml) while AS_CALIBRATED prices the
          1000 racks before the applied mid-period calibration at 8.00 and the 2000 racks after it at
          9.20 (26400 ml), a 2400 ml divergence that flips the classification from OVERUSE to
          WITHIN_TOLERANCE over byte-identical telemetry, deliveries and inventory counts.
        test_recipe:
          setup:
            - "Logical clock starts at its 2026-08-01T00:00:00Z default and is stepped forward explicitly."
            - "One customer with a CURRENT billing status and an ACTIVE 36-month agreement covering DET-100."
            - "One DT-88 placement, INSTALLED at 2026-08-01T00:00:00Z, with one DET-100 dispenser created at dose 8.00 ml/rack."
            - "One DELIVERED delivery of 2 units (40000 ml) on 2026-08-02, opening inventory 5000 ml, ending inventory 17000 ml, so actual consumption is 28000 ml."
            - "Two DEVICE readings inside the window: cycle_count_total 1000 at 2026-08-05T12:00:00Z and 3000 at 2026-08-20T12:00:00Z, giving deltas of 1000 and 2000 racks."
            - "A verified service visit on 2026-08-10T09:00:00Z whose calibration record measured 1380 ppm against a 1200 ppm target (drift +15.00, verdict ADJUSTED) and applied an adjusted dose of 9.20 ml/rack."
          setup_api_calls:
            - call: "POST /warewashing/customers"
              payload: { name: "Harbor Kitchens", sustainability_goal_water_l: 500000 }
              as: AccountManager
              captures: { cust_id: $.data.id }
            - call: "POST /warewashing/chemical-products"
              payload: { sku: "DET-100", product_type: "DETERGENT", concentration_target_ppm: 1200, spec_dose_ml_per_rack: 8.00, unit_size_ml: 20000, unit_price_cents: 9600 }
              as: PlatformAdmin
              captures: { det_id: $.data.id }
            - call: "POST /warewashing/machine-models"
              payload: { model_code: "DT-88", machine_class: "DOOR_TYPE", racks_per_hour: 60, rated_water_l_per_rack: 0.74, rated_kwh_per_rack: 0.41, min_final_rinse_temp_f: 180, min_wash_temp_f: 150, min_rinse_pressure_psi: 15, max_rinse_pressure_psi: 25, equipment_value_cents: 480000, max_cycles_between_calibrations: 20000 }
              as: PlatformAdmin
              captures: { model_id: $.data.id }
            - call: "POST /warewashing/sites"
              payload: { customer_id: "${cust_id}", name: "Harbor Main Kitchen", region_code: "NW", operating_window_start_minute_utc: 600, operating_window_end_minute_utc: 1320, baseline_water_l_per_rack: 1.20, baseline_kwh_per_rack: 0.62, water_cost_cents_per_1000l: 480, energy_cost_cents_per_kwh: 14 }
              as: AccountManager
              captures: { site_id: $.data.id }
            - call: "POST /warewashing/service-agreements"
              payload: { customer_id: "${cust_id}", agreement_code: "AGR-2701-A", start_date: "2026-08-01", minimum_term_months: 36, monthly_minimum_spend_cents: 20000, covered_product_ids: ["${det_id}"] }
              as: AccountManager
              captures: { agr_id: $.data.id }
            - call: "POST /warewashing/service-agreements/${agr_id}/activate"
              payload: {}
              as: AccountManager
              captures: { agr_v: $.data.version }
            - call: "POST /warewashing/machine-placements"
              payload: { site_id: "${site_id}", agreement_id: "${agr_id}", machine_model_id: "${model_id}", asset_tag: "AT-001", expected_agreement_version: "${agr_v}" }
              as: AccountManager
              captures: { pl_id: $.data.id }
            - call: "POST /warewashing/technicians"
              payload: { name: "Dana Reyes", region_code: "NW", certification_level: "SANITATION_CERTIFIED" }
              as: PlatformAdmin
              captures: { tech_id: $.data.id }
            - call: "POST /warewashing/machine-placements/${pl_id}/install"
              payload: {}
              as: ServiceTechnician
              as_user_id: "${tech_id}"
            - call: "POST /warewashing/dispensers"
              payload: { placement_id: "${pl_id}", product_id: "${det_id}", calibrated_dose_ml_per_rack: 8.00 }
              as: ServiceTechnician
              as_user_id: "${tech_id}"
              captures: { disp_id: $.data.id, disp_v: $.data.version }
            - call: "POST /warewashing/_clock/set_current_utc"
              payload: { current_utc: "2026-08-02T08:00:00Z" }
              as: PlatformAdmin
            - call: "GET /warewashing/sites/${site_id}"
              payload: {}
              as: AccountManager
              captures: { site_v: $.data.version }
            - call: "POST /warewashing/chemical-deliveries"
              payload: { site_id: "${site_id}", product_id: "${det_id}", delivered_at: "2026-08-02T08:00:00Z", unit_count: 2, expected_site_version: "${site_v}" }
              as: AccountManager
            - call: "POST /warewashing/_clock/set_current_utc"
              payload: { current_utc: "2026-08-05T12:00:00Z" }
              as: PlatformAdmin
            - call: "POST /warewashing/machine-placements/${pl_id}/telemetry-readings"
              payload: { reading_at: "2026-08-05T12:00:00Z", cycle_count_total: 1000, wash_temp_f: 160, final_rinse_temp_f: 185, rinse_pressure_psi: 20 }
              as: PlatformAdmin
            - call: "POST /warewashing/service-tickets"
              payload: { placement_id: "${pl_id}", reported_symptom: "RACK_QUALITY" }
              as: CustomerContact
              as_user_id: "${cust_id}"
              captures: { ticket_id: $.data.id }
            - call: "POST /warewashing/service-tickets/${ticket_id}/dispatch"
              payload: {}
              as: PlatformAdmin
            - call: "POST /warewashing/service-visits"
              payload: { ticket_id: "${ticket_id}", technician_id: "${tech_id}", scheduled_start_at: "2026-08-10T09:00:00Z", scheduled_end_at: "2026-08-10T10:00:00Z" }
              as: ServiceTechnician
              as_user_id: "${tech_id}"
              captures: { visit_id: $.data.id }
            - call: "POST /warewashing/_clock/set_current_utc"
              payload: { current_utc: "2026-08-10T09:00:00Z" }
              as: PlatformAdmin
            - call: "POST /warewashing/service-visits/${visit_id}/arrive"
              payload: {}
              as: ServiceTechnician
              as_user_id: "${tech_id}"
            - call: "POST /warewashing/service-visits/${visit_id}/calibration-records"
              payload: { dispenser_id: "${disp_id}", measured_ppm: 1380, measured_dose_ml_per_rack: 8.00, adjusted_dose_ml_per_rack: 9.20, expected_dispenser_version: "${disp_v}" }
              as: ServiceTechnician
              as_user_id: "${tech_id}"
            - call: "POST /warewashing/service-visits/${visit_id}/submit"
              payload: { repair_confirmed: true }
              as: ServiceTechnician
              as_user_id: "${tech_id}"
            - call: "POST /warewashing/service-visits/${visit_id}/verify"
              payload: { decision: "VERIFIED" }
              as: QualityAuditor
              as_user_id: "auditor-1"
            - call: "POST /warewashing/_clock/set_current_utc"
              payload: { current_utc: "2026-08-20T12:00:00Z" }
              as: PlatformAdmin
            - call: "POST /warewashing/machine-placements/${pl_id}/telemetry-readings"
              payload: { reading_at: "2026-08-20T12:00:00Z", cycle_count_total: 3000, wash_temp_f: 160, final_rinse_temp_f: 185, rinse_pressure_psi: 20 }
              as: PlatformAdmin
            - call: "POST /warewashing/_clock/set_current_utc"
              payload: { current_utc: "2026-09-01T00:00:00Z" }
              as: PlatformAdmin
          trigger:
            - call: "POST /warewashing/usage-variance-reviews"
              payload: { site_id: "${site_id}", product_id: "${det_id}", period_start: "2026-08-01T00:00:00Z", period_end: "2026-09-01T00:00:00Z", basis: "NAMEPLATE", opening_inventory_ml: 5000, ending_inventory_ml: 17000 }
              as: QualityAuditor
              as_user_id: "auditor-1"
              captures: { rev_np_id: $.data.id }
            - call: "POST /warewashing/usage-variance-reviews"
              payload: { site_id: "${site_id}", product_id: "${det_id}", period_start: "2026-08-01T00:00:00Z", period_end: "2026-09-01T00:00:00Z", basis: "AS_CALIBRATED", opening_inventory_ml: 5000, ending_inventory_ml: 17000 }
              as: QualityAuditor
              as_user_id: "auditor-1"
              captures: { rev_ac_id: $.data.id }
          assert:
            - "UsageVarianceReview.${rev_np_id}.rack_count_in_period == 3000 and UsageVarianceReview.${rev_ac_id}.rack_count_in_period == 3000"
            - "UsageVarianceReview.${rev_np_id}.actual_consumption_ml == 28000 and UsageVarianceReview.${rev_ac_id}.actual_consumption_ml == 28000"
            - "UsageVarianceReview.${rev_np_id}.expected_consumption_ml == 24000"
            - "UsageVarianceReview.${rev_ac_id}.expected_consumption_ml == 26400"
            - "UsageVarianceReview.${rev_ac_id}.expected_consumption_ml - UsageVarianceReview.${rev_np_id}.expected_consumption_ml == 2400"
            - "UsageVarianceReview.${rev_np_id}.variance_pct == 16.67"
            - "UsageVarianceReview.${rev_ac_id}.variance_pct == 6.06"
            - "UsageVarianceReview.${rev_np_id}.classification == OVERUSE"
            - "UsageVarianceReview.${rev_ac_id}.classification == WITHIN_TOLERANCE"
            - "both reviews have status == DRAFT (two drafts over the same window are allowed; only publication claims a window)"
            - "Dispenser.${disp_id}.calibrated_dose_ml_per_rack == 9.20 and Dispenser.${disp_id}.prior_dose_ml_per_rack == 8.00 and Dispenser.${disp_id}.dose_effective_at == 2026-08-10T09:00:00Z"

      - name: sustainability_basis_rated_vs_telemetry_measured_diverges
        grounds:
          - calculations.sustainability_savings
          - calculations.rack_count_in_period
          - entities.Site.fields.baseline_water_l_per_rack
          - entities.MachineModel.fields.rated_water_l_per_rack
        distinguishing_aspect: |
          Subject is utility savings on the Site/MachineModel domain, not chemical consumption: RATED
          credits the site with the machine's nameplate 0.74 L per rack (1380.00 L saved, 662 cents,
          credit 474, net program cost 45262) while TELEMETRY_MEASURED inflates nameplate water by the
          observed rinse-pressure factor round_half_up(20/15, 4) = 1.3333 to 0.986642 L per rack
          (640.074 L saved, 307 cents, credit 456, net program cost 45280) over identical racks and
          identical tariffs.
        test_recipe:
          setup:
            - "Logical clock starts at its 2026-08-01T00:00:00Z default."
            - "Customer sustainability_goal_water_l 500000; site baseline 1.20 L and 0.62 kWh per rack, tariffs 480 cents per 1000 L and 14 cents per kWh."
            - "One DT-88 placement (rated 0.74 L, 0.41 kWh per rack, min rinse pressure 15 psi) INSTALLED at 2026-08-01T00:00:00Z."
            - "Two DEVICE readings inside the window, both at 20 psi, giving 3000 racks total."
            - "One DELIVERED delivery of 2 units of DET-100 on 2026-08-02 for 19200 cents of chemical spend."
          setup_api_calls:
            - call: "POST /warewashing/customers"
              payload: { name: "Harbor Kitchens", sustainability_goal_water_l: 500000 }
              as: AccountManager
              captures: { cust_id: $.data.id }
            - call: "POST /warewashing/chemical-products"
              payload: { sku: "DET-100", product_type: "DETERGENT", concentration_target_ppm: 1200, spec_dose_ml_per_rack: 8.00, unit_size_ml: 20000, unit_price_cents: 9600 }
              as: PlatformAdmin
              captures: { det_id: $.data.id }
            - call: "POST /warewashing/machine-models"
              payload: { model_code: "DT-88", machine_class: "DOOR_TYPE", racks_per_hour: 60, rated_water_l_per_rack: 0.74, rated_kwh_per_rack: 0.41, min_final_rinse_temp_f: 180, min_wash_temp_f: 150, min_rinse_pressure_psi: 15, max_rinse_pressure_psi: 25, equipment_value_cents: 480000, max_cycles_between_calibrations: 20000 }
              as: PlatformAdmin
              captures: { model_id: $.data.id }
            - call: "POST /warewashing/sites"
              payload: { customer_id: "${cust_id}", name: "Harbor Main Kitchen", region_code: "NW", operating_window_start_minute_utc: 600, operating_window_end_minute_utc: 1320, baseline_water_l_per_rack: 1.20, baseline_kwh_per_rack: 0.62, water_cost_cents_per_1000l: 480, energy_cost_cents_per_kwh: 14 }
              as: AccountManager
              captures: { site_id: $.data.id }
            - call: "POST /warewashing/service-agreements"
              payload: { customer_id: "${cust_id}", agreement_code: "AGR-2701-B", start_date: "2026-08-01", minimum_term_months: 36, monthly_minimum_spend_cents: 20000, covered_product_ids: ["${det_id}"] }
              as: AccountManager
              captures: { agr_id: $.data.id }
            - call: "POST /warewashing/service-agreements/${agr_id}/activate"
              payload: {}
              as: AccountManager
              captures: { agr_v: $.data.version }
            - call: "POST /warewashing/machine-placements"
              payload: { site_id: "${site_id}", agreement_id: "${agr_id}", machine_model_id: "${model_id}", asset_tag: "AT-002", expected_agreement_version: "${agr_v}" }
              as: AccountManager
              captures: { pl_id: $.data.id }
            - call: "POST /warewashing/technicians"
              payload: { name: "Dana Reyes", region_code: "NW", certification_level: "L2" }
              as: PlatformAdmin
              captures: { tech_id: $.data.id }
            - call: "POST /warewashing/machine-placements/${pl_id}/install"
              payload: {}
              as: ServiceTechnician
              as_user_id: "${tech_id}"
            - call: "POST /warewashing/_clock/set_current_utc"
              payload: { current_utc: "2026-08-02T08:00:00Z" }
              as: PlatformAdmin
            - call: "GET /warewashing/sites/${site_id}"
              payload: {}
              as: AccountManager
              captures: { site_v: $.data.version }
            - call: "POST /warewashing/chemical-deliveries"
              payload: { site_id: "${site_id}", product_id: "${det_id}", delivered_at: "2026-08-02T08:00:00Z", unit_count: 2, expected_site_version: "${site_v}" }
              as: AccountManager
              captures: { del_amount: $.data.amount_cents }
            - call: "POST /warewashing/_clock/set_current_utc"
              payload: { current_utc: "2026-08-05T12:00:00Z" }
              as: PlatformAdmin
            - call: "POST /warewashing/machine-placements/${pl_id}/telemetry-readings"
              payload: { reading_at: "2026-08-05T12:00:00Z", cycle_count_total: 1000, wash_temp_f: 160, final_rinse_temp_f: 185, rinse_pressure_psi: 20 }
              as: PlatformAdmin
            - call: "POST /warewashing/_clock/set_current_utc"
              payload: { current_utc: "2026-08-20T12:00:00Z" }
              as: PlatformAdmin
            - call: "POST /warewashing/machine-placements/${pl_id}/telemetry-readings"
              payload: { reading_at: "2026-08-20T12:00:00Z", cycle_count_total: 3000, wash_temp_f: 160, final_rinse_temp_f: 185, rinse_pressure_psi: 20 }
              as: PlatformAdmin
            - call: "POST /warewashing/_clock/set_current_utc"
              payload: { current_utc: "2026-09-01T00:00:00Z" }
              as: PlatformAdmin
          trigger:
            - call: "GET /warewashing/sites/${site_id}/sustainability-report"
              payload: { period_start: "2026-08-01T00:00:00Z", period_end: "2026-09-01T00:00:00Z", basis: "RATED" }
              as: AccountManager
              captures: { rated_water: $.data.water_saved_l, rated_net: $.data.net_program_cost_cents }
            - call: "GET /warewashing/sites/${site_id}/sustainability-report"
              payload: { period_start: "2026-08-01T00:00:00Z", period_end: "2026-09-01T00:00:00Z", basis: "TELEMETRY_MEASURED" }
              as: AccountManager
              captures: { measured_water: $.data.water_saved_l, measured_net: $.data.net_program_cost_cents }
          assert:
            - "RATED response: rack_count == 3000, water_saved_l == 1380.00, energy_saved_kwh == 630.00"
            - "RATED response: water_savings_cents == 662, energy_savings_cents == 8820, gross_savings_cents == 9482"
            - "RATED response: chemical_spend_cents == 19200, gross_program_cost_cents == 44200, service_fee_rate == 0.08, service_fee_cents == 1536"
            - "RATED response: sustainability_credit_cents == 474, net_program_cost_cents == 45262, goal_attainment_pct == 0.28"
            - "TELEMETRY_MEASURED response: water_saved_l == 640.074 (3000 racks times (1.20 - 0.74 * 1.3333)), water_savings_cents == 307"
            - "TELEMETRY_MEASURED response: energy_savings_cents == 8820 (unchanged - the pressure factor touches water only), gross_savings_cents == 9127"
            - "TELEMETRY_MEASURED response: sustainability_credit_cents == 456, net_program_cost_cents == 45280, goal_attainment_pct == 0.13"
            - "${rated_water} - ${measured_water} == 739.926 and ${measured_net} - ${rated_net} == 18"
            - "no entity is mutated by either read: Site.${site_id}.version is the same before and after both calls"

  - rule_id: combinatorial_formula
    instances:
      - name: termination_fee_per_placement_rounding_precedes_summation
        mode: b
        grounds:
          - calculations.early_termination_fee
          - entities.ServiceAgreement.fields.early_termination_fee_cents
          - entities.MachineModel.fields.equipment_value_cents
          - state_machines.ServiceAgreement.status.ACTIVE_to_TERMINATED
        distinguishing_aspect: |
          Mode b - nested rounding order pinned. Three placements each carry an unamortized value with
          an exact fractional part of 0.5 cents (480006, 360006 and 240006 cents at 33/36 of term give
          440005.5, 330005.5 and 220005.5). Rounding each placement first and then summing yields
          990018; summing the exact fractions to 990016.5 and rounding once yields 990017. The
          implementation is pinned to 990018, so a one-cent difference falsifies the wrong order. This
          instance says nothing about which of the two variants wins - only about where round_half_up
          sits relative to the summation.
        test_recipe:
          setup:
            - "Logical clock stays at its 2026-08-01T00:00:00Z default for the whole recipe."
            - "One ACTIVE agreement: start_date 2026-08-01, minimum_term_months 36, so term_end_date is 2029-08-01, monthly_minimum_spend_cents 20000."
            - "Three machine models whose equipment_value_cents are 480006, 360006 and 240006 - each divisible by 12 with a remainder that makes 11/12 of it land exactly on a half cent."
            - "Three placements, one per model, all left in PENDING_INSTALL (which the calculation's input_set includes)."
            - "Termination effective_date 2026-12-01 is 974 days before term_end_date, so remaining_months = ceil(974 / 30) = 33."
          setup_api_calls:
            - call: "POST /warewashing/customers"
              payload: { name: "Cascade Catering Group", sustainability_goal_water_l: 500000 }
              as: AccountManager
              captures: { cust_id: $.data.id }
            - call: "POST /warewashing/chemical-products"
              payload: { sku: "DET-100", product_type: "DETERGENT", concentration_target_ppm: 1200, spec_dose_ml_per_rack: 8.00, unit_size_ml: 20000, unit_price_cents: 9600 }
              as: PlatformAdmin
              captures: { det_id: $.data.id }
            - call: "POST /warewashing/machine-models"
              payload: { model_code: "DT-88A", machine_class: "DOOR_TYPE", racks_per_hour: 60, rated_water_l_per_rack: 0.74, rated_kwh_per_rack: 0.41, min_final_rinse_temp_f: 180, min_wash_temp_f: 150, min_rinse_pressure_psi: 15, max_rinse_pressure_psi: 25, equipment_value_cents: 480006, max_cycles_between_calibrations: 20000 }
              as: PlatformAdmin
              captures: { model_a: $.data.id }
            - call: "POST /warewashing/machine-models"
              payload: { model_code: "UC-40B", machine_class: "UNDERCOUNTER", racks_per_hour: 30, rated_water_l_per_rack: 0.80, rated_kwh_per_rack: 0.45, min_final_rinse_temp_f: 180, min_wash_temp_f: 150, min_rinse_pressure_psi: 15, max_rinse_pressure_psi: 25, equipment_value_cents: 360006, max_cycles_between_calibrations: 20000 }
              as: PlatformAdmin
              captures: { model_b: $.data.id }
            - call: "POST /warewashing/machine-models"
              payload: { model_code: "GW-10C", machine_class: "GLASSWASHER", racks_per_hour: 24, rated_water_l_per_rack: 0.50, rated_kwh_per_rack: 0.30, min_final_rinse_temp_f: 180, min_wash_temp_f: 150, min_rinse_pressure_psi: 15, max_rinse_pressure_psi: 25, equipment_value_cents: 240006, max_cycles_between_calibrations: 20000 }
              as: PlatformAdmin
              captures: { model_c: $.data.id }
            - call: "POST /warewashing/sites"
              payload: { customer_id: "${cust_id}", name: "Cascade Central", region_code: "NW", operating_window_start_minute_utc: 600, operating_window_end_minute_utc: 1320, baseline_water_l_per_rack: 1.20, baseline_kwh_per_rack: 0.62, water_cost_cents_per_1000l: 480, energy_cost_cents_per_kwh: 14 }
              as: AccountManager
              captures: { site_id: $.data.id }
            - call: "POST /warewashing/service-agreements"
              payload: { customer_id: "${cust_id}", agreement_code: "AGR-2701-C", start_date: "2026-08-01", minimum_term_months: 36, monthly_minimum_spend_cents: 20000, covered_product_ids: ["${det_id}"] }
              as: AccountManager
              captures: { agr_id: $.data.id }
            - call: "POST /warewashing/service-agreements/${agr_id}/activate"
              payload: {}
              as: AccountManager
              captures: { agr_v1: $.data.version }
            - call: "POST /warewashing/machine-placements"
              payload: { site_id: "${site_id}", agreement_id: "${agr_id}", machine_model_id: "${model_a}", asset_tag: "AT-101", expected_agreement_version: "${agr_v1}" }
              as: AccountManager
              captures: { pl_a: $.data.id }
            - call: "GET /warewashing/service-agreements/${agr_id}"
              payload: {}
              as: AccountManager
              captures: { agr_v2: $.data.version }
            - call: "POST /warewashing/machine-placements"
              payload: { site_id: "${site_id}", agreement_id: "${agr_id}", machine_model_id: "${model_b}", asset_tag: "AT-102", expected_agreement_version: "${agr_v2}" }
              as: AccountManager
              captures: { pl_b: $.data.id }
            - call: "GET /warewashing/service-agreements/${agr_id}"
              payload: {}
              as: AccountManager
              captures: { agr_v3: $.data.version }
            - call: "POST /warewashing/machine-placements"
              payload: { site_id: "${site_id}", agreement_id: "${agr_id}", machine_model_id: "${model_c}", asset_tag: "AT-103", expected_agreement_version: "${agr_v3}" }
              as: AccountManager
              captures: { pl_c: $.data.id }
          trigger:
            - call: "POST /warewashing/service-agreements/${agr_id}/terminate"
              payload: { effective_date: "2026-12-01" }
              as: AccountManager
              captures: { fee: $.data.early_termination_fee_cents }
          assert:
            - "ServiceAgreement.${agr_id}.term_end_date == 2029-08-01 and termination_effective_date == 2026-12-01 and status == TERMINATED"
            - "${fee} == 990018 (per-placement rounding: 440006 + 330006 + 220006)"
            - "${fee} != 990017 - the sum-then-round-once order is explicitly wrong"
            - "the REMAINING_MINIMUM variant would have produced 396000 (33 * 20000 * 0.60), so the reported fee is max(396000, 990018)"
            - "all three placements are still PENDING_INSTALL: none of them was cancelled by the termination cascade"

      - name: sustainability_fee_tier_read_from_pre_credit_program_cost
        mode: c
        grounds:
          - calculations.sustainability_savings
          - calculations.delivery_amount
          - endpoints.GET_sites_site_id_sustainability_report
        distinguishing_aspect: |
          Mode c - circular-looking dependency with a pinned evaluation order. net_program_cost_cents
          depends on service_fee_cents, which depends on service_fee_rate, which depends on
          gross_program_cost_cents, which is a cost figure - so it is tempting to net the
          sustainability credit out before choosing the tier. This fixture makes the two orders
          numerically distinguishable: pre-credit gross_program_cost 207400 selects the 0.06 band
          (fee 10944), while subtracting the capped 15000 credit first would give 192400, cross under
          the 200000 tier boundary and select 0.08 (fee 14592). The credit is also cap-bound
