# =============================================================================
# §1.9 Scaffold Corner Design — Coverage Index for Non-Difficulty Tests
# Task 1841: Surgical Loaner Tray & Vendor Instrument Management
# Breadth walk over §1.1–§1.7 per claim-extraction-guide. Standard fixture per
# instance (from empty DB): vendor ACME (grace 15, 5000/hr, cap 20000,
# surcharge 250/min), rep credentialed to 2026-08-10, room OR-1 (buffer 30),
# sterilizer ST-1 (2 slots, 60/30), case 2026-08-03 09:00-12:00 unless noted.
# =============================================================================
scaffold_corner_design:
  - section: entities
    instances:
      - name: vendor_create_applies_contract_defaults
        claim_type: defaults
        grounds: ["entities.Vendor.fields.late_grace_minutes", "entities.Vendor.fields.delay_surcharge_per_minute_cents", "entities.Vendor.fields.status"]
        distinguishing_aspect: "Omitting optional contract fields applies defaults (grace 15, surcharge 0); status and rollups initialize."
        test_recipe:
          setup: ["Empty DB"]
          setup_api_calls:
            - { call: "POST /vendor-office/vendors", payload: { vendor_name: "Acme Surgical", vendor_code: "ACME", late_rate_per_hour_cents: 5000, late_penalty_cap_cents: 20000 }, as: VendorCoordinator, captures: { v_id: $.data.id } }
          trigger:
            - { call: "GET /vendor-office/vendors/${v_id}", as: ORScheduler }
          assert:
            - "late_grace_minutes == 15 and delay_surcharge_per_minute_cents == 0 (defaults applied)"
            - "status == ACTIVE; outstanding_penalty_cents == 0; outstanding_liability_cents == 0"
            - "version == 1; id present; created_at == 2026-08-01T00:00:00Z (logical clock default)"

      - name: case_create_computed_and_system_fields
        claim_type: computed_fields
        grounds: ["entities.SurgicalCase.fields.delay_minutes_provisional", "entities.SurgicalCase.fields.vendor_delay_minutes_final", "entities.SurgicalCase.fields.status"]
        distinguishing_aspect: "New case stamps system fields and zero/null delay projections; client cannot set them."
        test_recipe:
          setup: ["Room exists"]
          setup_api_calls:
            - { call: "POST /vendor-office/or-rooms", payload: { room_name: "OR-1", turnover_buffer_minutes: 30 }, as: ORScheduler, captures: { room_id: $.data.id } }
          trigger:
            - { call: "POST /vendor-office/cases", payload: { case_number: "C-1", or_room_id: "${room_id}", procedure_type: "TOTAL_KNEE", surgeon_name: "Dr. A", scheduled_start_at: "2026-08-03T09:00:00Z", scheduled_end_at: "2026-08-03T12:00:00Z" }, as: ORScheduler, captures: { case_id: $.data.id } }
          assert:
            - "status == SCHEDULED; actual_start_at == null; actual_end_at == null"
            - "delay_minutes_provisional == 0; vendor_delay_minutes_provisional == 0; vendor_delay_minutes_final == null"
            - "version == 1; created_at == 2026-08-01T00:00:00Z"

      - name: create_case_missing_case_number_returns_400
        claim_type: required_fields
        grounds: ["validations[priority=1b]", "errors[ERR_VALIDATION]"]
        distinguishing_aspect: "Missing required input field on create -> ERR_VALIDATION 400 before any existence or state check."
        test_recipe:
          setup: ["Room exists"]
          setup_api_calls:
            - { call: "POST /vendor-office/or-rooms", payload: { room_name: "OR-1", turnover_buffer_minutes: 30 }, as: ORScheduler, captures: { room_id: $.data.id } }
          trigger:
            - { call: "POST /vendor-office/cases", payload: { or_room_id: "${room_id}", procedure_type: "TOTAL_KNEE", surgeon_name: "Dr. A", scheduled_start_at: "2026-08-03T09:00:00Z", scheduled_end_at: "2026-08-03T12:00:00Z" }, as: ORScheduler, captures: { err: $.data.error_id } }
          assert:
            - "${err} == ERR_VALIDATION; no case persisted (GET /vendor-office/cases -> total_count == 0)"

      - name: create_request_invalid_enum_rejected
        claim_type: type_constraints
        grounds: ["entities.LoanerRequest.fields.priority_class", "errors[ERR_VALIDATION]"]
        distinguishing_aspect: "priority_class outside {STANDARD, URGENT, EMERGENT} rejected at shape validation."
        test_recipe:
          setup: ["Vendor + case exist"]
          setup_api_calls:
            - { call: "POST /vendor-office/vendors", payload: { vendor_name: "Acme", vendor_code: "ACME", late_rate_per_hour_cents: 5000, late_penalty_cap_cents: 20000 }, as: VendorCoordinator, captures: { v_id: $.data.id } }
            - { call: "POST /vendor-office/or-rooms", payload: { room_name: "OR-1", turnover_buffer_minutes: 30 }, as: ORScheduler, captures: { room_id: $.data.id } }
            - { call: "POST /vendor-office/cases", payload: { case_number: "C-1", or_room_id: "${room_id}", procedure_type: "K", surgeon_name: "Dr. A", scheduled_start_at: "2026-08-10T09:00:00Z", scheduled_end_at: "2026-08-10T12:00:00Z" }, as: ORScheduler, captures: { case_id: $.data.id } }
          trigger:
            - { call: "POST /vendor-office/requests", payload: { case_id: "${case_id}", vendor_id: "${v_id}", priority_class: "STAT" }, as: ORScheduler, captures: { err: $.data.error_id } }
          assert:
            - "${err} == ERR_VALIDATION; GET /vendor-office/requests -> total_count == 0"

      - name: request_create_initial_readiness_not_ready
        claim_type: creation
        grounds: ["entities.LoanerRequest.fields.readiness", "calculations.calc_request_readiness"]
        distinguishing_aspect: "New DRAFT request with zero trays computes readiness NOT_READY (vacuous-READY explicitly excluded)."
        test_recipe:
          setup: ["Vendor + case exist"]
          setup_api_calls:
            - { call: "POST /vendor-office/vendors", payload: { vendor_name: "Acme", vendor_code: "ACME", late_rate_per_hour_cents: 5000, late_penalty_cap_cents: 20000 }, as: VendorCoordinator, captures: { v_id: $.data.id } }
            - { call: "POST /vendor-office/or-rooms", payload: { room_name: "OR-1", turnover_buffer_minutes: 30 }, as: ORScheduler, captures: { room_id: $.data.id } }
            - { call: "POST /vendor-office/cases", payload: { case_number: "C-1", or_room_id: "${room_id}", procedure_type: "K", surgeon_name: "Dr. A", scheduled_start_at: "2026-08-10T09:00:00Z", scheduled_end_at: "2026-08-10T12:00:00Z" }, as: ORScheduler, captures: { case_id: $.data.id } }
          trigger:
            - { call: "POST /vendor-office/requests", payload: { case_id: "${case_id}", vendor_id: "${v_id}", priority_class: "URGENT" }, as: ORScheduler, captures: { rq_id: $.data.id } }
          assert:
            - "status == DRAFT; readiness == NOT_READY; required_delivery_by == null; penalty_exposure_cents == 0; submitted_at == null"

      - name: get_tray_not_found_returns_404
        claim_type: not_found
        grounds: ["errors[ERR_TRAY_NOT_FOUND]", "validations[priority=3]"]
        distinguishing_aspect: "GET with a well-formed but absent UUID -> 404 ERR_TRAY_NOT_FOUND in the error envelope."
        test_recipe:
          setup: ["Empty DB apart from one room (existence check is per-resource)"]
          setup_api_calls:
            - { call: "POST /vendor-office/or-rooms", payload: { room_name: "OR-1" }, as: ORScheduler }
          trigger:
            - { call: "GET /vendor-office/trays/00000000-0000-0000-0000-000000000000", as: VendorCoordinator, captures: { err: $.data.error_id } }
          assert:
            - "${err} == ERR_TRAY_NOT_FOUND; http status 404"

      - name: list_requests_pagination_filter
        claim_type: listing
        grounds: ["response_envelope.pagination_fields", "response_envelope.pagination_defaults"]
        distinguishing_aspect: "Filter + limit/offset interact: vendor filter narrows to 2 rows; limit 1 pages with has_more true then false."
        test_recipe:
          setup: ["One vendor, one case, two requests"]
          setup_api_calls:
            - { call: "POST /vendor-office/vendors", payload: { vendor_name: "Acme", vendor_code: "ACME", late_rate_per_hour_cents: 5000, late_penalty_cap_cents: 20000 }, as: VendorCoordinator, captures: { v_id: $.data.id } }
            - { call: "POST /vendor-office/or-rooms", payload: { room_name: "OR-1" }, as: ORScheduler, captures: { room_id: $.data.id } }
            - { call: "POST /vendor-office/cases", payload: { case_number: "C-1", or_room_id: "${room_id}", procedure_type: "K", surgeon_name: "Dr. A", scheduled_start_at: "2026-08-10T09:00:00Z", scheduled_end_at: "2026-08-10T12:00:00Z" }, as: ORScheduler, captures: { case_id: $.data.id } }
            - { call: "POST /vendor-office/requests", payload: { case_id: "${case_id}", vendor_id: "${v_id}", priority_class: "STANDARD" }, as: ORScheduler }
            - { call: "POST /vendor-office/requests", payload: { case_id: "${case_id}", vendor_id: "${v_id}", priority_class: "URGENT" }, as: ORScheduler }
          trigger:
            - { call: "GET /vendor-office/requests?vendor_id=${v_id}&limit=1&offset=0", as: VendorCoordinator }
            - { call: "GET /vendor-office/requests?vendor_id=${v_id}&limit=1&offset=1", as: VendorCoordinator }
          assert:
            - "Page 1: total_count == 2, has_more == true, 1 row returned"
            - "Page 2: total_count == 2, has_more == false, 1 row returned, disjoint id from page 1"

      - name: trays_subresource_scoped_to_parent_request
        claim_type: parent_relationships
        grounds: ["entities.LoanerTray.fields.request_id", "endpoints['GET /vendor-office/requests/{id}/trays']"]
        distinguishing_aspect: "Nested tray list returns only the path request's trays, never a sibling's."
        test_recipe:
          setup: ["Two requests on one case; tray TK-A in rq1, tray TK-B in rq2"]
          setup_api_calls:
            - { call: "POST /vendor-office/vendors", payload: { vendor_name: "Acme", vendor_code: "ACME", late_rate_per_hour_cents: 5000, late_penalty_cap_cents: 20000 }, as: VendorCoordinator, captures: { v_id: $.data.id } }
            - { call: "POST /vendor-office/or-rooms", payload: { room_name: "OR-1" }, as: ORScheduler, captures: { room_id: $.data.id } }
            - { call: "POST /vendor-office/cases", payload: { case_number: "C-1", or_room_id: "${room_id}", procedure_type: "K", surgeon_name: "Dr. A", scheduled_start_at: "2026-08-10T09:00:00Z", scheduled_end_at: "2026-08-10T12:00:00Z" }, as: ORScheduler, captures: { case_id: $.data.id } }
            - { call: "POST /vendor-office/requests", payload: { case_id: "${case_id}", vendor_id: "${v_id}", priority_class: "STANDARD" }, as: ORScheduler, captures: { rq1_id: $.data.id } }
            - { call: "POST /vendor-office/requests", payload: { case_id: "${case_id}", vendor_id: "${v_id}", priority_class: "STANDARD" }, as: ORScheduler, captures: { rq2_id: $.data.id } }
            - { call: "POST /vendor-office/requests/${rq1_id}/trays", payload: { tray_code: "TK-A", declared_instrument_count: 5, replacement_value_cents: 1000 }, as: ORScheduler, captures: { ta_id: $.data.id } }
            - { call: "POST /vendor-office/requests/${rq2_id}/trays", payload: { tray_code: "TK-B", declared_instrument_count: 5, replacement_value_cents: 1000 }, as: ORScheduler, captures: { tb_id: $.data.id } }
          trigger:
            - { call: "GET /vendor-office/requests/${rq1_id}/trays", as: VendorCoordinator }
          assert:
            - "Response contains exactly 1 tray: id == ${ta_id}; tray ${tb_id} absent; total_count == 1"

      - name: checkin_event_is_immutable
        claim_type: immutability
        grounds: ["entities.CheckInEvent"]
        distinguishing_aspect: "Append-only event (common_fields false): response carries id + created_at but no version/updated_at; no update endpoint exists in §1.5."
        test_recipe:
          setup: ["APPROVED request with one tray"]
          setup_api_calls:
            - { call: "POST /vendor-office/vendors", payload: { vendor_name: "Acme", vendor_code: "ACME", late_grace_minutes: 15, late_rate_per_hour_cents: 5000, late_penalty_cap_cents: 20000, delay_surcharge_per_minute_cents: 250 }, as: VendorCoordinator, captures: { v_id: $.data.id } }
            - { call: "POST /vendor-office/vendors/${v_id}/reps", payload: { full_name: "Rita Rep", rep_email: "r@acme.com", credential_doc_ref: "DOC-1" }, as: VendorCoordinator, captures: { rep_id: $.data.id } }
            - { call: "POST /vendor-office/reps/${rep_id}/approve-credential", payload: { credential_expires_at: "2026-08-10T00:00:00Z", or_access_level: "OBSERVER" }, as: VendorCoordinator }
            - { call: "POST /vendor-office/or-rooms", payload: { room_name: "OR-1" }, as: ORScheduler, captures: { room_id: $.data.id } }
            - { call: "POST /vendor-office/cases", payload: { case_number: "C-1", or_room_id: "${room_id}", procedure_type: "K", surgeon_name: "Dr. A", scheduled_start_at: "2026-08-03T09:00:00Z", scheduled_end_at: "2026-08-03T12:00:00Z" }, as: ORScheduler, captures: { case_id: $.data.id } }
            - { call: "POST /vendor-office/requests", payload: { case_id: "${case_id}", vendor_id: "${v_id}", priority_class: "URGENT" }, as: ORScheduler, captures: { rq_id: $.data.id } }
            - { call: "POST /vendor-office/requests/${rq_id}/trays", payload: { tray_code: "TK-1", declared_instrument_count: 50, replacement_value_cents: 300000 }, as: ORScheduler, captures: { t1_id: $.data.id } }
            - { call: "POST /vendor-office/requests/${rq_id}/submit", as: ORScheduler }
            - { call: "POST /vendor-office/requests/${rq_id}/decide", payload: { decision: "APPROVE" }, as: VendorCoordinator }
            - { call: "POST /vendor-office/_clock/set_current_utc", payload: { to_iso8601: "2026-08-02T08:00:00Z" }, as: VendorCoordinator }
          trigger:
            - { call: "POST /vendor-office/requests/${rq_id}/check-ins", payload: { lines: [{ tray_id: "${t1_id}", instrument_count_delivered: 50 }], ifu_provided: true, loaner_agreement_ref: "LA-1" }, as: VendorRep, as_user_id: "${rep_id}", captures: { ci_id: $.data.id } }
          assert:
            - "Response data has id and created_at == 2026-08-02T08:00:00Z (logical clock stamp)"
            - "Response data has NO version key and NO updated_at key (common_fields: false)"
            - "delivered_at == 2026-08-02T08:00:00Z; rep_id == ${rep_id}; status == SUBMITTED; late_minutes == 0 (computed at verify, initial 0)"


      - name: get_single_not_found_family_returns_404
        claim_type: not_found
        grounds: ["validations[priority=3]", "errors[ERR_VENDOR_NOT_FOUND]", "errors[ERR_PENALTY_NOT_FOUND]", "errors[ERR_CLAIM_NOT_FOUND]"]
        distinguishing_aspect: "Every single-resource GET enforces per-resource existence with its own domain error id — one sweep covers all 15 resource types."
        test_recipe:
          setup: ["Near-empty DB (one room exists)"]
          setup_api_calls:
            - { call: "POST /vendor-office/or-rooms", payload: { room_name: "OR-1" }, as: ORScheduler }
          trigger:
            - { call: "GET /vendor-office/vendors/00000000-0000-0000-0000-000000000000", as: VendorCoordinator, captures: { e_vendor: $.data.error_id } }
            - { call: "GET /vendor-office/reps/00000000-0000-0000-0000-000000000000", as: VendorCoordinator, captures: { e_rep: $.data.error_id } }
            - { call: "GET /vendor-office/or-rooms/00000000-0000-0000-0000-000000000000", as: VendorCoordinator, captures: { e_room: $.data.error_id } }
            - { call: "GET /vendor-office/sterilizer-units/00000000-0000-0000-0000-000000000000", as: VendorCoordinator, captures: { e_st: $.data.error_id } }
            - { call: "GET /vendor-office/cases/00000000-0000-0000-0000-000000000000", as: VendorCoordinator, captures: { e_case: $.data.error_id } }
            - { call: "GET /vendor-office/requests/00000000-0000-0000-0000-000000000000", as: VendorCoordinator, captures: { e_rq: $.data.error_id } }
            - { call: "GET /vendor-office/check-ins/00000000-0000-0000-0000-000000000000", as: VendorCoordinator, captures: { e_ci: $.data.error_id } }
            - { call: "GET /vendor-office/turns/00000000-0000-0000-0000-000000000000", as: VendorCoordinator, captures: { e_turn: $.data.error_id } }
            - { call: "GET /vendor-office/escalations/00000000-0000-0000-0000-000000000000", as: VendorCoordinator, captures: { e_esc: $.data.error_id } }
            - { call: "GET /vendor-office/access-passes/00000000-0000-0000-0000-000000000000", as: VendorCoordinator, captures: { e_pass: $.data.error_id } }
            - { call: "GET /vendor-office/pickups/00000000-0000-0000-0000-000000000000", as: VendorCoordinator, captures: { e_pk: $.data.error_id } }
            - { call: "GET /vendor-office/claims/00000000-0000-0000-0000-000000000000", as: VendorCoordinator, captures: { e_cl: $.data.error_id } }
            - { call: "GET /vendor-office/penalties/00000000-0000-0000-0000-000000000000", as: VendorCoordinator, captures: { e_pen: $.data.error_id } }
            - { call: "GET /vendor-office/delay-events/00000000-0000-0000-0000-000000000000", as: VendorCoordinator, captures: { e_de: $.data.error_id } }
          assert:
            - "${e_vendor} == ERR_VENDOR_NOT_FOUND; ${e_rep} == ERR_REP_NOT_FOUND; ${e_room} == ERR_ROOM_NOT_FOUND; ${e_st} == ERR_STERILIZER_NOT_FOUND; ${e_case} == ERR_CASE_NOT_FOUND"
            - "${e_rq} == ERR_REQUEST_NOT_FOUND; ${e_ci} == ERR_CHECKIN_NOT_FOUND; ${e_turn} == ERR_TURN_NOT_FOUND; ${e_esc} == ERR_ESCALATION_NOT_FOUND; ${e_pass} == ERR_PASS_NOT_FOUND"
            - "${e_pk} == ERR_PICKUP_NOT_FOUND; ${e_cl} == ERR_CLAIM_NOT_FOUND; ${e_pen} == ERR_PENALTY_NOT_FOUND; ${e_de} == ERR_DELAY_EVENT_NOT_FOUND"

  - section: state_machines
    instances:
      - name: request_submit_and_approve_happy_path
        claim_type: valid_transition
        grounds: ["state_machines.LoanerRequest.DRAFT_to_SUBMITTED", "state_machines.LoanerRequest.SUBMITTED_to_APPROVED", "calculations.calc_delivery_deadline"]
        distinguishing_aspect: "Submit stamps submitted_at; approve derives required_delivery_by (2026-08-02T09:00:00Z) and per-tray sterile window (2026-08-03T08:00:00Z)."
        test_recipe:
          setup: ["Vendor ACTIVE, case 2026-08-03 09:00-12:00, request DRAFT with one tray"]
          setup_api_calls:
            - { call: "POST /vendor-office/vendors", payload: { vendor_name: "Acme", vendor_code: "ACME", late_rate_per_hour_cents: 5000, late_penalty_cap_cents: 20000 }, as: VendorCoordinator, captures: { v_id: $.data.id } }
            - { call: "POST /vendor-office/or-rooms", payload: { room_name: "OR-1" }, as: ORScheduler, captures: { room_id: $.data.id } }
            - { call: "POST /vendor-office/cases", payload: { case_number: "C-1", or_room_id: "${room_id}", procedure_type: "K", surgeon_name: "Dr. A", scheduled_start_at: "2026-08-03T09:00:00Z", scheduled_end_at: "2026-08-03T12:00:00Z" }, as: ORScheduler, captures: { case_id: $.data.id } }
            - { call: "POST /vendor-office/requests", payload: { case_id: "${case_id}", vendor_id: "${v_id}", priority_class: "URGENT" }, as: ORScheduler, captures: { rq_id: $.data.id } }
            - { call: "POST /vendor-office/requests/${rq_id}/trays", payload: { tray_code: "TK-1", declared_instrument_count: 50, replacement_value_cents: 300000 }, as: ORScheduler, captures: { t1_id: $.data.id } }
          trigger:
            - { call: "POST /vendor-office/requests/${rq_id}/submit", as: ORScheduler, captures: { sub_status: $.data.status } }
            - { call: "POST /vendor-office/requests/${rq_id}/decide", payload: { decision: "APPROVE" }, as: VendorCoordinator, captures: { rdb: $.data.required_delivery_by } }
            - { call: "GET /vendor-office/trays/${t1_id}", as: VendorCoordinator, captures: { ready_by: $.data.required_sterile_ready_by } }
          assert:
            - "${sub_status} == SUBMITTED and submitted_at == 2026-08-01T00:00:00Z (clock default)"
            - "After decide: status == APPROVED and ${rdb} == 2026-08-02T09:00:00Z (24h URGENT lead)"
            - "Tray required_sterile_ready_by == 2026-08-03T08:00:00Z (60-min prep buffer); readiness == NOT_READY (tray EXPECTED)"

      - name: request_submit_twice_rejected
        claim_type: invalid_transition
        grounds: ["state_machines.LoanerRequest.DRAFT_to_SUBMITTED", "errors[ERR_REQUEST_INVALID_STATE]"]
        distinguishing_aspect: "Second submit from SUBMITTED is not an idempotent no-op; it is rejected."
        test_recipe:
          setup: ["Request SUBMITTED with one tray"]
          setup_api_calls:
            - { call: "POST /vendor-office/vendors", payload: { vendor_name: "Acme", vendor_code: "ACME", late_rate_per_hour_cents: 5000, late_penalty_cap_cents: 20000 }, as: VendorCoordinator, captures: { v_id: $.data.id } }
            - { call: "POST /vendor-office/or-rooms", payload: { room_name: "OR-1" }, as: ORScheduler, captures: { room_id: $.data.id } }
            - { call: "POST /vendor-office/cases", payload: { case_number: "C-1", or_room_id: "${room_id}", procedure_type: "K", surgeon_name: "Dr. A", scheduled_start_at: "2026-08-10T09:00:00Z", scheduled_end_at: "2026-08-10T12:00:00Z" }, as: ORScheduler, captures: { case_id: $.data.id } }
            - { call: "POST /vendor-office/requests", payload: { case_id: "${case_id}", vendor_id: "${v_id}", priority_class: "STANDARD" }, as: ORScheduler, captures: { rq_id: $.data.id } }
            - { call: "POST /vendor-office/requests/${rq_id}/trays", payload: { tray_code: "TK-1", declared_instrument_count: 50, replacement_value_cents: 300000 }, as: ORScheduler }
            - { call: "POST /vendor-office/requests/${rq_id}/submit", as: ORScheduler }
          trigger:
            - { call: "POST /vendor-office/requests/${rq_id}/submit", as: ORScheduler, captures: { err: $.data.error_id } }
          assert:
            - "${err} == ERR_REQUEST_INVALID_STATE; status stays SUBMITTED"

      - name: request_submit_without_trays_rejected
        claim_type: precondition_enforcement
        grounds: ["state_machines.LoanerRequest.DRAFT_to_SUBMITTED", "errors[ERR_REQUEST_NO_TRAYS]"]
        distinguishing_aspect: "The >=1-tray precondition fires with its domain error, not a generic state error."
        test_recipe:
          setup: ["Request DRAFT with no trays"]
          setup_api_calls:
            - { call: "POST /vendor-office/vendors", payload: { vendor_name: "Acme", vendor_code: "ACME", late_rate_per_hour_cents: 5000, late_penalty_cap_cents: 20000 }, as: VendorCoordinator, captures: { v_id: $.data.id } }
            - { call: "POST /vendor-office/or-rooms", payload: { room_name: "OR-1" }, as: ORScheduler, captures: { room_id: $.data.id } }
            - { call: "POST /vendor-office/cases", payload: { case_number: "C-1", or_room_id: "${room_id}", procedure_type: "K", surgeon_name: "Dr. A", scheduled_start_at: "2026-08-10T09:00:00Z", scheduled_end_at: "2026-08-10T12:00:00Z" }, as: ORScheduler, captures: { case_id: $.data.id } }
            - { call: "POST /vendor-office/requests", payload: { case_id: "${case_id}", vendor_id: "${v_id}", priority_class: "STANDARD" }, as: ORScheduler, captures: { rq_id: $.data.id } }
          trigger:
            - { call: "POST /vendor-office/requests/${rq_id}/submit", as: ORScheduler, captures: { err: $.data.error_id } }
          assert:
            - "${err} == ERR_REQUEST_NO_TRAYS; status stays DRAFT"

      - name: request_reject_is_terminal
        claim_type: terminal_state_lockdown
        grounds: ["state_machines.LoanerRequest.SUBMITTED_to_REJECTED", "errors[ERR_REQUEST_INVALID_STATE]"]
        distinguishing_aspect: "REJECTED is terminal: neither decide nor submit nor cancel move it."
        test_recipe:
          setup: ["Request SUBMITTED with one tray, then rejected"]
