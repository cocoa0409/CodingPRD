            - call: "POST /members"
              payload: { banner_id: "${bsu_id}", alt_id: "5550000015", card_number: "4000000000000015", full_name: "Oz Suspended" }
              as: ProgramAdmin
              captures: { m15_id: $.data.id }
            - call: "POST /purchase-transactions"
              payload: { member_id: "${m15_id}", site_id: "${g15_id}", transacted_at: "2026-08-05T10:00:00Z", lines: [{ category: "GROCERY", amount_cents: 30000, quantity: 1 }] }
              as: StoreOperator
              as_user_id: "${g15_id}"
              captures: { t15a_id: $.data.id }
            - call: "POST /purchase-transactions"
              payload: { member_id: "${m15_id}", site_id: "${g15_id}", transacted_at: "2026-08-05T10:00:00Z", lines: [{ category: "GROCERY", amount_cents: 30000, quantity: 1 }] }
