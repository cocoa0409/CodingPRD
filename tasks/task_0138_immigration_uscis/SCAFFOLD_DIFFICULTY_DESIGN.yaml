scaffold_difficulty_design:

  # =============================================================================
  # Rule 1 — Dual-variant calculations across different entity domains (≥ 2)
  # =============================================================================
  - rule_id: dual_variant_calc
    instances:
      - name: priority_date_currency_dual_chart
        grounds:
          - calculations.priority_date_currency
          - entities.VisaBulletin.fields.chart_type
          - endpoints[POST /admin/visa-bulletin/chart-in-effect]
          - entities.Case.fields.priority_date_status
        distinguishing_aspect: |
          The same Case.priority_date evaluated against the SAME bulletin month produces a
          DIFFERENT priority_date_status under FINAL_ACTION vs DATES_FOR_FILING — this calculation
          lives on the Case entity domain (visa-bulletin currency) and toggles purely via the
          chart-in-effect configuration, distinct from rule 1's second instance which lives on the
          Case-summary scoring domain.
        test_recipe:
          setup:
            - "Supervisor POST /admin/case-type-config for I-485 with requires_priority_date_current=true, requires_biometrics=true, requires_interview=true, rfe_response_window_days=87, receipt_prefix=MSC"
            - "Supervisor POST /admin/case-type-config for I-130 with requires_priority_date_current=false, requires_biometrics=false, requires_interview=false, rfe_response_window_days=87, receipt_prefix=MSC"
            - "Petitioner created; Beneficiary with preference_category=F2A, country_of_chargeability=MEX"
            - "I-130 Case filed at 2026-05-18, decided APPROVED → its priority_date = 2026-05-18"
            - "Supervisor publishes TWO bulletin rows for month 2026-06: (FINAL_ACTION, F2A, MEX, cutoff_date=2026-04-01) and (DATES_FOR_FILING, F2A, MEX, cutoff_date=2026-09-01)"
            - "I-485 Case created with linked_i130_case_id and filed (priority_date inherits 2026-05-18)"
          trigger:
            - "Supervisor POST /admin/visa-bulletin/chart-in-effect {chart_type: FINAL_ACTION}"
            - "Officer POST /cases/{i485_id}/refresh-priority-date  → observe response.priority_date_status"
            - "Supervisor POST /admin/visa-bulletin/chart-in-effect {chart_type: DATES_FOR_FILING}"
            - "Officer POST /cases/{i485_id}/refresh-priority-date  → observe response.priority_date_status"
          assert:
            - "First refresh: Case.priority_date_status == 'NOT_CURRENT' (because 2026-05-18 >= 2026-04-01)"
            - "Second refresh: Case.priority_date_status == 'CURRENT' (because 2026-05-18 < 2026-09-01)"

      - name: case_completeness_score_live_vs_snapshot
        grounds:
          - calculations.case_completeness_score
          - calculations.case_completeness_score.variants
          - endpoints[GET /cases/{case_id}/summary]
          - endpoints[POST /cases/{case_id}/decide]
          - entities.CaseEvent.fields.to_value
        distinguishing_aspect: |
          The same Case data produces a DIFFERENT score under the live_summary variant (recomputed
          every GET against current child rows) vs the snapshot_at_decision variant (frozen into
          CaseEvent.to_value when the DECISION_RECORDED event was emitted). This calculation lives
          on the Case-summary entity domain — entirely separate from instance 1's Visa Bulletin
          currency domain — satisfying Rule 1's "different entity domain" requirement.
        test_recipe:
          setup:
            - "An I-130 Case driven all the way to APPROVED via DRAFT→FILED→BIOMETRICS skipped (requires_biometrics=false)→READY_FOR_DECISION→APPROVED"
            - "Capture the CaseEvent of type DECISION_RECORDED — its to_value field contains the snapshot_at_decision score"
          trigger:
            - "Issue an out-of-band Officer correction: synthesize a new CaseEvent on the case (or schedule new biometrics if applicable) that changes a child fact AFTER the decision was recorded"
            - "GET /cases/{id}/summary → returns live_summary score recomputed against current child rows"
            - "GET /cases/{id}/events → snapshot_at_decision is fixed in the prior CaseEvent.to_value"
          assert:
            - "GET /cases/{id}/summary returns case_completeness_score recomputed from current children"
            - "GET /cases/{id}/events the DECISION_RECORDED row's to_value equals the score computed at decision time and does not change when subsequent children change"
            - "When the two values diverge they are produced by the same formula but on different input snapshots, confirming the variant divergence"

  # =============================================================================
  # Rule 2 — Combinatorial formulas across different modes (≥ 2, different from {a,b,c})
  # =============================================================================
  - rule_id: combinatorial_formula
    instances:
      - name: completeness_score_pinned_rounding_order
        grounds:
          - calculations.case_completeness_score
          - calculations.case_completeness_score.formula
          - calculations.case_completeness_score.precision
          - endpoints[GET /cases/{case_id}/summary]
        distinguishing_aspect: |
          MODE (b): nested rounding where the ORDER matters. The scaffold pins
          "round per-factor first (2 dp half-up), then sum, then round to integer half-up". A
          carefully constructed input produces 48 under per-factor rounding and 47 under
          sum-then-round — the two orderings disagree by ONE point. This is mode (b), distinct
          from instance 2 which is mode (a).
        test_recipe:
          setup:
            - "Build an I-485 Case in RFE_ISSUED status with: one Biometrics.COMPLETED, one RFE.OUTSTANDING, one Interview.SCHEDULED, priority_date_status=NOT_CURRENT"
            - "Per the formula: f_status=0.30, f_biometrics=1.00, f_rfe=0.00 (RFE outstanding), f_interview=0.50, f_priority=0.50"
          trigger:
            - "GET /cases/{case_id}/summary"
          assert:
            - "response.data.case_completeness_score == 48 (per-factor: 0.12 + 0.20 + 0.00 + 0.08 + 0.08 = 0.48 → 48)"
            - "NOT 47 (which would be the sum-then-round answer: 0.12 + 0.20 + 0.00 + 0.075 + 0.075 = 0.47 → 47); a 47 here proves the implementation rounded in the wrong order"

      - name: mint_receipt_number_combinatorial
        grounds:
          - calculations.mint_receipt_number
          - calculations.mint_receipt_number.formula
          - calculations.mint_receipt_number.constants
          - entities.Case.fields.receipt_number
          - entities.CaseTypeConfig.fields.receipt_prefix
        distinguishing_aspect: |
          MODE (a): formula with ≥3 inputs and non-linear interaction. The receipt-number formula
          combines (i) CaseTypeConfig.receipt_prefix, (ii) calendar-year-mod-100, (iii) day-of-
          FISCAL-year (Oct→Sep buckets), and (iv) a per-(prefix, fiscal-year) monotonic sequence
          via conditional branching (fiscal year starts in October so a January filing in calendar
          year Y belongs to fiscal year Y-1). Evaluation order is pinned. Mode (a), distinct from
          instance 1 (mode b).
        test_recipe:
          setup:
            - "Supervisor POST /admin/case-type-config I-130 with receipt_prefix=MSC"
            - "Supervisor POST /_clock/advance {to: '2026-05-18T00:00:00.000Z'}"
            - "Petitioner + Beneficiary + Case created in DRAFT"
          trigger:
            - "Petitioner POST /cases/{case_id}/file"
          assert:
            - "response.data.receipt_number == 'MSC2623000001' exactly (prefix MSC + year-mod-100 26 + day-of-fiscal-year 230 + sequence 00001)"
            - "len(response.data.receipt_number) == 13"

  # =============================================================================
  # Rule 3 — Non-linear state-machine shape on different entities (≥ 2)
  # =============================================================================
  - rule_id: non_linear_state_machine
    instances:
      - name: case_branching_revert_rfe_loop
        grounds:
          - state_machines.Case.FILED_to_RFE_ISSUED
          - state_machines.Case.BIOMETRICS_COMPLETED_to_RFE_ISSUED
          - state_machines.Case.RFE_ISSUED_to_RFE_RESPONDED
          - state_machines.Case.RFE_ISSUED_to_DENIED
          - state_machines.Case.RFE_RESPONDED_to_INTERVIEW_SCHEDULED
        distinguishing_aspect: |
          Branching with revert: Case can fork from BIOMETRICS_COMPLETED into either
          {RFE_ISSUED → RFE_RESPONDED → INTERVIEW_SCHEDULED} or directly into INTERVIEW_SCHEDULED;
          the RFE branch can also revert to DENIED via automatic timeout. This is a fork-join with
          divergent side-effect sets (RFE branch issues an RFE row and sets Case.rfe_deadline; the
          other branch does not). Lives on Case entity.
        test_recipe:
          setup:
            - "I-485 case in BIOMETRICS_COMPLETED state"
          trigger:
            - "Officer POST /cases/{id}/rfe — observe Case transitions to RFE_ISSUED with rfe_deadline set"
            - "Beneficiary POST /rfes/{rfe_id}/respond before deadline → Case → RFE_RESPONDED"
            - "Officer POST /cases/{id}/interview → Case → INTERVIEW_SCHEDULED (branch joined back)"
          assert:
            - "Case.status traversal observed: BIOMETRICS_COMPLETED → RFE_ISSUED → RFE_RESPONDED → INTERVIEW_SCHEDULED"
            - "Case.rfe_deadline was non-null after RFE_ISSUED transition and is null after RFE_RESPONDED transition"

      - name: biometrics_cyclic_reschedule
        grounds:
          - state_machines.Biometrics
          - state_machines.Biometrics.SCHEDULED_to_RESCHEDULED
          - state_machines.Biometrics.NO_SHOW_to_SCHEDULED
          - validations[priority=14]
        distinguishing_aspect: |
          Cyclic loop on the Biometrics entity (DIFFERENT entity from instance 1's Case): a
          NO_SHOW row can return to SCHEDULED through reschedule, then NO_SHOW again, then
          SCHEDULED again — up to 3 reschedules. Each iteration spawns a new Biometrics row whose
          reschedule_count increments. This is structurally cyclic, distinct from the Case
          branching-with-revert pattern.
        test_recipe:
          setup:
            - "I-485 Case with a Biometrics row in SCHEDULED state"
            - "Supervisor POST /_clock/advance past scheduled_at + 24h"
          trigger:
            - "Officer POST /biometrics/{b1}/no-show → b1.status == NO_SHOW"
            - "Officer POST /biometrics/{b1}/reschedule new_scheduled_at=now+10d → new row b2 created with reschedule_count=1, status=SCHEDULED"
            - "Advance clock; mark b2 no-show; reschedule again → b3 with reschedule_count=2"
            - "Reschedule b3 → b4 with reschedule_count=3"
            - "Attempt to reschedule b4 → REJECTED"
          assert:
            - "b2.status == 'SCHEDULED' and b2.reschedule_count == 1"
            - "b3.reschedule_count == 2"
            - "b4.reschedule_count == 3"
            - "Attempt to reschedule b4 fails with ERR_BIOMETRICS_RESCHEDULE_LIMIT (409)"

  # =============================================================================
  # Rule 4 — Transitive cascade chains from different triggers (≥ 2, ≥1 depth ≥3)
  # =============================================================================
  - rule_id: transitive_cascade
    instances:
      - name: i130_deny_chain_depth3
        grounds:
          - state_machines.Case.READY_FOR_DECISION_to_DENIED
          - state_machines.Case.READY_FOR_DECISION_to_DENIED.side_effects
          - state_machines.Interview
          - state_machines.Biometrics
          - entities.Case.fields.linked_i130_case_id
        distinguishing_aspect: |
          Depth-3 transitive cascade triggered by an Officer DENY on an I-130 case:
          hop 1: I-130.status := DENIED CAUSES
          hop 2: dependent I-485.status := DENIED with denial_reason=INELIGIBLE (because hop 1
                 flipped the I-130) CAUSES
          hop 3: any SCHEDULED Interview on the dependent I-485 → CANCELLED, and any SCHEDULED
                 Biometrics on the dependent I-485 → CANCELLED (because hop 2 flipped the I-485).
          Each link is caused by the previous link, not by the original Officer action. Trigger:
          POST /cases/{i130_id}/decide with decision=DENY. Distinct from instance 2's clock
          trigger.
        test_recipe:
          setup:
            - "I-130 Case in READY_FOR_DECISION"
            - "Dependent I-485 Case with linked_i130_case_id pointing to the I-130, in INTERVIEW_SCHEDULED state with one Interview.SCHEDULED and one Biometrics.SCHEDULED (re-scheduled chain still alive)"
          trigger:
            - "Officer POST /cases/{i130_id}/decide with decision=DENY, denial_reason=OFFICER_DENIAL"
          assert:
            - "I-130.status == 'DENIED', I-130.denial_reason == 'OFFICER_DENIAL' (hop 1)"
            - "Dependent I-485.status == 'DENIED', dependent.denial_reason == 'INELIGIBLE' (hop 2)"
            - "Dependent I-485's Interview.status == 'CANCELLED' (hop 3)"
            - "Dependent I-485's Biometrics.status == 'CANCELLED' (hop 3)"

      - name: rfe_timeout_chain_depth3
        grounds:
          - state_machines.Case.RFE_ISSUED_to_DENIED
          - state_machines.RFE.OUTSTANDING_to_EXPIRED
          - endpoints[POST /_clock/advance]
        distinguishing_aspect: |
          Depth-3 cascade triggered by clock advance (DIFFERENT trigger from instance 1):
          hop 1: clock crosses RFE.deadline_at → RFE.status := EXPIRED CAUSES
          hop 2: parent Case.status := DENIED with denial_reason=RFE_TIMEOUT (because hop 1
                 flipped the RFE) CAUSES
          hop 3: if Case.case_type == I-130, dependent I-485s have status := DENIED with
                 denial_reason=INELIGIBLE (because hop 2 flipped the I-130).
          The original trigger is the clock advance, NOT a direct Officer action on the I-485.
        test_recipe:
          setup:
            - "I-130 Case in RFE_ISSUED, with RFE.deadline_at = 2026-08-13T00:00:00.000Z"
            - "Dependent I-485 with linked_i130_case_id, in FILED state"
          trigger:
            - "Supervisor POST /_clock/advance {to: '2026-08-13T00:00:01.000Z'} (strictly after deadline_at)"
          assert:
            - "RFE.status == 'EXPIRED' (hop 1)"
            - "I-130.status == 'DENIED' AND I-130.denial_reason == 'RFE_TIMEOUT' (hop 2)"
            - "Dependent I-485.status == 'DENIED' AND dependent.denial_reason == 'INELIGIBLE' (hop 3)"

  # =============================================================================
  # Rule 5 — Validation priority conflicts across different error-category pairs (≥ 2)
  # =============================================================================
  - rule_id: priority_pair_validation_conflict
    instances:
      - name: state_vs_business_referential_rfe_conflict
        grounds:
          - validations[priority=6]
          - validations[priority=9]
        distinguishing_aspect: |
          Dual-failure: a request that would simultaneously fail validation 6 (state — Case is in
          DRAFT, not eligible for /rfe) AND validation 9 (business_referential — case already has
          an OUTSTANDING RFE) — the scaffold's priority ordering says the STATE error wins.
          Category pair = (state, business_referential).
        test_recipe:
          setup:
            - "Create a Case in DRAFT (never filed)"
            - "Backdoor-insert an OUTSTANDING RFE row referencing this case (or, since DRAFT cannot have an RFE per state machine, set up via test fixture)"
          trigger:
            - "Officer POST /cases/{draft_case_id}/rfe with valid body"
          assert:
            - "response.status_code == 409"
            - "response.data.error_id == 'ERR_INVALID_STATE' (priority 6 wins) — NOT 'ERR_RFE_ALREADY_OUTSTANDING' (priority 9)"

      - name: business_safety_vs_business_constraint_i485_conflict
        grounds:
          - validations[priority=7]
          - validations[priority=16]
        distinguishing_aspect: |
          Dual-failure on POST /cases/{id}/interview: validation 7 fires when an I-485 lacks an
          approved I-130 link (business_safety), but validation 16 fires when the case_type is
          not I-485 at all (business_constraint). Construct a case that violates both — an I-130
          case that someone tries to schedule an interview on AND that case has been mistakenly
          tagged as needing an I-485 link. The scaffold's priority order says safety (lower
          priority number = higher precedence) wins. Category pair = (business_safety,
          business_constraint), differing from the pair in instance 1.
        test_recipe:
          setup:
            - "I-130 Case in FILED state (no linked_i130_case_id — vacuously, since it IS an I-130)"
            - "Attempt to schedule an interview on this I-130 case"
          trigger:
            - "Officer POST /cases/{i130_id}/interview with scheduled_at=now+30d, field_office_code=NYC"
          assert:
            - "response.status_code == 422"
            - "response.data.error_id == 'ERR_INTERVIEW_NOT_APPLICABLE' (priority 16). NB: priority 7 ERR_I485_MISSING_APPROVED_I130 only applies to /file on case_type==I-485, so on this endpoint priority 16 is the relevant safety/constraint check that fires. Test pins which error wins for THIS endpoint."

  # =============================================================================
  # Rule 6 — Boundary-precision checks on different metrics/endpoints (≥ 2)
  # =============================================================================
  - rule_id: boundary_precision_check
    instances:
      - name: priority_date_strict_less_than_cutoff
        grounds:
          - calculations.priority_date_currency
          - calculations.priority_date_currency.formula
          - endpoints[POST /cases/{case_id}/refresh-priority-date]
          - entities.Case.fields.priority_date_status
        distinguishing_aspect: |
          The boundary is a date comparison: Case.priority_date STRICTLY LESS THAN VisaBulletin
          cutoff_date → CURRENT; equal-to OR after → NOT_CURRENT. Tests must hit the equality
          edge. Metric = priority_date vs cutoff_date.
        test_recipe:
          setup:
            - "I-485 Case with priority_date = 2026-04-01 (inherited from a 2026-04-01 I-130)"
            - "Supervisor publishes (FINAL_ACTION, F2A, MEX, cutoff_date=2026-04-01) for bulletin_month=2026-06"
            - "Chart in effect = FINAL_ACTION"
          trigger:
            - "Officer POST /cases/{case_id}/refresh-priority-date"
          assert:
            - "Case.priority_date_status == 'NOT_CURRENT' (because 2026-04-01 is NOT strictly < 2026-04-01)"
            - "Now republish row with cutoff_date=2026-04-02 → refresh → priority_date_status == 'CURRENT' (because 2026-04-01 < 2026-04-02)"

      - name: rfe_deadline_strict_greater_than
        grounds:
          - calculations.rfe_response_deadline
          - calculations.rfe_response_deadline.precision
          - validations[priority=13]
          - endpoints[POST /rfes/{rfe_id}/respond]
          - endpoints[POST /_clock/advance]
        distinguishing_aspect: |
          DIFFERENT metric and DIFFERENT endpoint: the boundary is a UTC datetime comparison —
          now() > RFE.deadline_at (STRICT). The exact instant equal to deadline_at is still
          in-window; the next millisecond is out. Endpoint = POST /rfes/{id}/respond.
        test_recipe:
          setup:
            - "I-130 Case in RFE_ISSUED with RFE.deadline_at = 2026-08-13T00:00:00.000Z"
          trigger:
            - "Supervisor POST /_clock/advance {to: '2026-08-13T00:00:00.000Z'} (EXACTLY at deadline)"
            - "Beneficiary POST /rfes/{rfe_id}/respond  → expect 200"
            - "Reset state, redo with clock at '2026-08-13T00:00:00.001Z' (one ms past)"
            - "Beneficiary POST /rfes/{rfe_id}/respond  → expect 409"
          assert:
            - "At now() == deadline_at exactly: response succeeds, RFE.status == 'RESPONDED'"
            - "At now() == deadline_at + 1ms: response fails with ERR_RFE_DEADLINE_PASSED (409)"

  # =============================================================================
  # Rule 7 — Cross-entity state dependencies across different entity pairs (≥ 2)
  # =============================================================================
  - rule_id: cross_entity_state_dependency
    instances:
      - name: i485_file_requires_i130_approved
        grounds:
          - validations[priority=7]
          - state_machines.Case.DRAFT_to_FILED
          - entities.Case.fields.linked_i130_case_id
        distinguishing_aspect: |
          Entity pair: I-485 Case → linked I-130 Case. The I-485 cannot transition DRAFT→FILED
          unless its linked_i130_case_id's Case.status == APPROVED (for non-IR beneficiaries).
          The valid transitions of one Case depend on another Case's state through a typed FK.
        test_recipe:
          setup:
            - "Petitioner + Beneficiary (preference_category=F2A, country=MEX)"
            - "I-130 Case in FILED state (not yet decided)"
            - "I-485 Case created in DRAFT with linked_i130_case_id = the I-130"
          trigger:
            - "Petitioner POST /cases/{i485_id}/file → expect REJECT"
            - "Drive the I-130 to APPROVED"
            - "Petitioner POST /cases/{i485_id}/file → expect SUCCESS"
          assert:
            - "First /file attempt fails with ERR_I485_MISSING_APPROVED_I130 (422)"
            - "After I-130 APPROVED, second /file attempt succeeds with Case.status == 'FILED'"

      - name: case_decide_requires_priority_date_current
        grounds:
          - validations[priority=8]
          - state_machines.Case.READY_FOR_DECISION_to_APPROVED
          - entities.Case.fields.priority_date_status
          - entities.VisaBulletin
        distinguishing_aspect: |
          DIFFERENT entity pair: I-485 Case → VisaBulletin (cross-aggregate via the
          (chart, preference, country, month) composite). The Case cannot transition
          READY_FOR_DECISION→APPROVED unless its derived priority_date_status (computed against
          the latest published VisaBulletin) == 'CURRENT'. Distinct from instance 1's Case→Case
          pair.
        test_recipe:
          setup:
            - "I-485 Case in READY_FOR_DECISION whose priority_date_status is 'NOT_CURRENT' (NOT applicable also rejected? — NOT_APPLICABLE only set when requires_priority_date_current=false, so here we're forcing the I-485 path)"
          trigger:
            - "Officer POST /cases/{id}/decide with decision=APPROVE → expect REJECT"
            - "Publish a more favorable VisaBulletin so priority_date_status flips to CURRENT"
            - "Officer POST /cases/{id}/refresh-priority-date"
            - "Officer POST /cases/{id}/decide with decision=APPROVE → expect SUCCESS"
          assert:
            - "First decide fails with ERR_PRIORITY_DATE_NOT_CURRENT (409)"
            - "After refresh-priority-date returns priority_date_status == 'CURRENT', second decide succeeds with Case.status == 'APPROVED'"

  # =============================================================================
  # Rule 8 — Resource temporal-overlap conflicts across different interval semantics (≥ 2)
  # =============================================================================
  - rule_id: resource_temporal_overlap
    instances:
      - name: biometrics_buffer_window_exclusion
        grounds:
          - state_machines.Biometrics.SCHEDULED_to_RESCHEDULED
          - validations[priority=11]
          - validations[priority=15]
          - entities.Biometrics.fields.scheduled_at
        distinguishing_aspect: |
          Interval semantics: ASYMMETRIC BUFFER around an existing Biometrics appointment on a
          Case. Forward buffer: any new Biometrics for the same case must be scheduled at least
          7 days in the future (now() + 7d ≤ new.scheduled_at). Backward buffer: an in-place
          reschedule cannot be requested within 24h of the existing scheduled_at (now() ≤
          existing.scheduled_at − 24h). Resource = Biometrics row chain on a Case. This is a
          point-versus-window buffer rule (no two intervals to compare — distinct geometry from
          instance 2).
        test_recipe:
          setup:
            - "Case in BIOMETRICS_SCHEDULED with Biometrics.scheduled_at = now+5d"
          trigger:
            - "Officer POST /biometrics/{id}/reschedule with new_scheduled_at = now+3d → expect REJECT"
            - "Officer POST /biometrics/{id}/reschedule with new_scheduled_at = now+10d → expect SUCCESS"
            - "Reset: now() is 23h before existing scheduled_at"
            - "Officer POST /biometrics/{id}/reschedule with new_scheduled_at = now+8d → expect REJECT"
          assert:
            - "First reschedule fails with ERR_BIOMETRICS_TOO_SOON (422)"
            - "Second reschedule succeeds (new SCHEDULED row created, reschedule_count=1)"
            - "Third reschedule fails with ERR_BIOMETRICS_RESCHEDULE_TOO_LATE (422)"

      - name: interview_minimum_lead_overlap
        grounds:
          - validations[priority=12]
          - state_machines.Interview
          - entities.Interview.fields.scheduled_at
          - endpoints[POST /cases/{case_id}/interview]
        distinguishing_aspect: |
          DIFFERENT interval semantics and DIFFERENT resource: an Interview must be scheduled at
          least 14 days in the future from now() — a one-sided point-versus-window rule on the
          Interview entity rather than on Biometrics. The buffer width (14d) and the absence of a
          backward buffer differ from instance 1's 7d/24h asymmetric rule.
        test_recipe:
          setup:
            - "I-485 Case in RFE_RESPONDED state"
            - "now() = 2026-05-18T00:00:00.000Z"
          trigger:
            - "Officer POST /cases/{id}/interview with scheduled_at = 2026-05-31T00:00:00.000Z (13d in future) → expect REJECT"
            - "Officer POST /cases/{id}/interview with scheduled_at = 2026-06-01T00:00:00.000Z (14d in future) → expect SUCCESS"
          assert:
            - "13-day attempt fails with ERR_INTERVIEW_TOO_SOON (422)"
            - "14-day attempt succeeds and Interview is created with status=SCHEDULED"

  # =============================================================================
  # Rule 9 — Compensating-action invariants across different conserved quantities (≥ 2)
  # =============================================================================
  - rule_id: compensating_invariant
    instances:
      - name: priority_date_inheritance_invariant
        grounds:
          - state_machines.Case.READY_FOR_DECISION_to_APPROVED
          - state_machines.Case.READY_FOR_DECISION_to_APPROVED.side_effects
          - entities.Case.fields.priority_date
          - entities.Case.fields.linked_i130_case_id
        distinguishing_aspect: |
          Conserved quantity: SUM_{c in Cases where c.priority_date != null} 1 — the count of
          cases holding a priority_date. When an I-130 is APPROVED and that approval cascades a
          priority_date down to a dependent I-485 (forward action), then the I-485 is
          subsequently WITHDRAWN (compensating action — Case → WITHDRAWN clears decision_at but
          DOES NOT clear priority_date because withdrawal is a beneficiary-side terminal), the
          named global quantity (count of cases with a priority_date) MUST equal the post-cascade
          value: I-130 still holds its priority_date and the now-WITHDRAWN I-485 still records
          the priority_date it inherited (audit). The invariant: count_with_priority_date(before
          inheritance) + 1 == count_with_priority_date(after inheritance, even after withdrawal).
        test_recipe:
          setup:
            - "I-130 Case (priority_date = 2026-05-18) approved"
            - "Dependent I-485 with linked_i130_case_id (priority_date initially null at I-485 filing because IR exception not used)"
            - "Pre-state: count_with_priority_date = 1 (just the I-130)"
          trigger:
            - "Forward: I-130 → APPROVED → dependent I-485.priority_date becomes 2026-05-18 (cascade hop 1+2 from Case decision side_effects)"
            - "Post-inheritance: count_with_priority_date = 2"
            - "Compensating: I-485 Petitioner POST /cases/{i485_id}/withdraw (assuming I-485 was withdrawable, e.g. still in FILED with no completed biometrics)"
          assert:
            - "After APPROVED cascade: dependent_i485.priority_date == '2026-05-18'"
            - "After WITHDRAWN compensation: count_with_priority_date STILL == 2 (no drift in conserved quantity); withdrawal does not unset priority_date for audit purposes"

      - name: receipt_number_uniqueness_invariant
        grounds:
          - calculations.mint_receipt_number
          - concurrency_rules[receipt_number_collision]
          - validations[priority=18]
          - entities.Case.fields.receipt_number
        distinguishing_aspect: |
          DIFFERENT conserved quantity: |{ Case.receipt_number : Case where receipt_number is not null }|
          == |{ Case where receipt_number is not null }|  (i.e., receipt_numbers are perfectly
          unique — set cardinality equals row count). Forward action: filing a Case mints a
          receipt_number. Compensating action: withdrawal does NOT free the receipt_number for
          reuse — it remains permanently allocated. The invariant: after N filings followed by M
          withdrawals (M ≤ N), the distinct receipt_number count is still N, never N − M.
          Conserved quantity TYPE (uniqueness counts) differs from instance 1's "count of
          priority-date-holding cases".
        test_recipe:
          setup:
            - "Supervisor publishes I-130 CaseTypeConfig with receipt_prefix=MSC"
            - "Clock at 2026-05-18T00:00:00.000Z"
          trigger:
            - "Petitioner files 3 I-130 cases in sequence → expect receipt_numbers MSC2623000001, MSC2623000002, MSC2623000003"
            - "Withdraw case 2"
            - "Petitioner files a 4th I-130 → expect MSC2623000004 (NOT a reuse of MSC2623000002)"
          assert:
            - "Distinct receipt_number count over all 4 cases == 4"
            - "case_4.receipt_number == 'MSC2623000004' (sequence is monotonically increasing; not reused)"
            - "case_2.receipt_number == 'MSC2623000002' AND case_2.status == 'WITHDRAWN' (audit retained)"
