          - errors.ERR_FRAUD_REVIEW_REQUIRED
        distinguishing_aspect: "fraud_flag turns true at exactly the third PRIOR non-DENIED claim: the claimant's first three claims are unflagged (decidable straight from FILED), the fourth is flagged, and its decide from FILED is rejected until start-review runs."
        test_recipe:
          setup:
