          setup_api_calls:
            - *k_clock
            - *k_ev
            - *k_cty_a
            - *k_cty_b
            - *k_cst
            - *k_lnk_a
            - *k_lnk_b
            - *k_cw
            - *k_ct
            - *k_feed
            - *k_lock
            - *k_eday
            - *k_live
            - *k_cv
            - *k_rep_a
