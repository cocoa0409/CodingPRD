# =============================================================================
# §1.8 Scaffold Difficulty Design — task_1700 ship chandlery
# 24 instances across the nine Difficulty Rules (2-3 per rule; >= 18 required).
# Every setup_api_calls / trigger chain replays cleanly against SCAFFOLD.yaml
# §1.5; every ${var} is bound by an earlier captures: block in the same
# instance. All money literals are integer cents computed from §1.3 formulas.
#
# Shared time fixture (logical clock; startup default 2026-08-01T00:00:00Z):
#   ETA = 2026-08-10T08:00:00Z, ETD = 2026-08-14T12:00:00Z (exactly 100 hours)
#   Clock is set to ETA before /arrive so actual_eta == scheduled_eta, which
#   keeps delivery-window containment math exact.
# =============================================================================
scaffold_difficulty_design:
  # ===========================================================================
  # Rule 1 — dual_variant_calc (2 instances, different entity domains)
  # ===========================================================================
  - rule_id: dual_variant_calc
    instances:
      - name: provisional_vs_final_pricing_duty_flip
        grounds:
          - calculations.line_pricing
          - calculations.order_totals
          - calculations.duty_split
          - entities.Quotation.fields.provisional_total_cents
          - entities.Invoice.fields.total_cents
        distinguishing_aspect: |
          Same quoted data (100 x WHISKY @ 5000 cents, qty delivered == qty
          ordered, no cold chain) prices TWO ways on the Order/Invoice money
          domain: the provisional variant at quotation time (customs PENDING =>
          dutiable, duty 100,000) yields 576,000; the final variant at invoice
          issuance (customs CLEARED => duty-free, duty 0) yields 480,000 —
          identical inputs, different results driven solely by which variant
          and which customs snapshot apply.
        test_recipe:
          setup:
            - "Agent with USD settlement and credit_limit 5,000,000"
            - "WHISKY: BONDED, bonded_eligible=true, requires_cold_chain=false, base 5000, duty 20%; bonded stock lot 500 units"
            - "Foreign-going vessel call, ETA 2026-08-10T08:00:00Z, ETD 2026-08-14T12:00:00Z, customs PENDING at quotation time"
            - "Quotation (100 x WHISKY @ 5000) SENT while customs PENDING; vessel IN_PORT; customs CLEARED before delivery+invoice"
          setup_api_calls:
            - call: "POST /chandlery/ship-agents"
              payload: { name: "Agent Alpha", settlement_currency: USD, credit_limit_cents: 5000000, payment_terms_days: 30 }
              as: FinanceController
              captures: { agent1: $.data.id }
            - call: "POST /chandlery/catalog-items"
              payload: { sku: "WHISKY-01", name: "Scotch Whisky 1L", category: BONDED, bonded_eligible: true, requires_cold_chain: false, base_price_cents: 5000, duty_rate_pct: 20 }
              as: ChandlerOpsManager
              captures: { whisky: $.data.id }
            - call: "POST /chandlery/stock-lots"
              payload: { catalog_item_id: "${whisky}", lot_code: "BW-1", storage_tier: BONDED_WAREHOUSE, received_qty: 500, capacity_qty: 0 }
              as: WarehouseSupervisor
            - call: "POST /chandlery/vessel-calls"
              payload: { vessel_name: "MV Aurora", imo_number: "9074729", agent_id: "${agent1}", port_code: "SGSIN", scheduled_eta: "2026-08-10T08:00:00Z", scheduled_etd: "2026-08-14T12:00:00Z", foreign_going: true }
              as: ChandlerOpsManager
              captures: { vc1: $.data.id }
            - call: "POST /chandlery/vessel-calls/${vc1}/requisitions"
              payload: { title: "Bonded stores", lines: [{ catalog_item_id: "${whisky}", requested_qty: 100, allows_substitution: false }] }
              as: VesselCateringOfficer
              as_user_id: "${vc1}"
              captures: { req1: $.data.id }
            - call: "POST /chandlery/requisitions/${req1}/submit"
              payload: {}
              as: VesselCateringOfficer
              as_user_id: "${vc1}"
            - call: "POST /chandlery/requisitions/${req1}/quotations"
              payload: { lines: [{ catalog_item_id: "${whisky}", qty: 100, unit_price_cents: 5000, is_substitution: false }], valid_until: "2026-08-12T00:00:00Z" }
              as: ChandlerSalesRep
              captures: { quo1: $.data.id, quo1_prov_total: $.data.provisional_total_cents }
            - call: "POST /chandlery/quotations/${quo1}/send"
              payload: {}
              as: ChandlerSalesRep
            - call: "POST /chandlery/_clock/set_current_utc"
              payload: { to_iso8601: "2026-08-10T08:00:00Z" }
              as: ChandlerOpsManager
            - call: "POST /chandlery/vessel-calls/${vc1}/arrive"
              payload: {}
              as: ChandlerOpsManager
            - call: "POST /chandlery/vessel-calls/${vc1}/customs-clearance"
              payload: { decision: CLEARED }
              as: PortCustomsOfficer
            - call: "POST /chandlery/quotations/${quo1}/accept"
              payload: {}
              as: VesselCateringOfficer
              as_user_id: "${vc1}"
              captures: { ord1: $.data.id }
            - call: "POST /chandlery/orders/${ord1}/deliveries"
              payload: { window_start: "2026-08-10T10:00:00Z", window_end: "2026-08-10T14:00:00Z", lines: [{ catalog_item_id: "${whisky}", qty: 100 }] }
              as: WarehouseSupervisor
              captures: { del1: $.data.id }
            - call: "POST /chandlery/deliveries/${del1}/dispatch"
              payload: {}
              as: WarehouseSupervisor
            - call: "POST /chandlery/_clock/set_current_utc"
              payload: { to_iso8601: "2026-08-10T12:00:00Z" }
              as: ChandlerOpsManager
            - call: "POST /chandlery/deliveries/${del1}/confirm"
              payload: { receiver_name: "Chief Cook", signature_ref: "sig-001", confirmed_lines: [{ catalog_item_id: "${whisky}", qty: 100 }] }
              as: VesselCateringOfficer
              as_user_id: "${vc1}"
          trigger:
            - call: "POST /chandlery/orders/${ord1}/invoices"
              payload: { fx_rate_to_settlement: 1.0 }
              as: FinanceController
              captures: { inv1: $.data.id, inv1_total: $.data.total_cents, inv1_duty: $.data.total_duty_cents }
          assert:
            - "Quotation.${quo1}.provisional_total_cents == 576000 (dutiable: 500,000 base + 100,000 duty = 600,000 subtotal; 4% rebate 24,000)"
            - "Invoice.${inv1}.total_duty_cents == 0 (duty-free at issuance: CLEARED + foreign_going + bonded_eligible)"
            - "Invoice.${inv1}.subtotal_cents == 500000"
            - "Invoice.${inv1}.rebate_cents == 20000"
            - "Invoice.${inv1}.total_cents == 480000"
            - "576000 != 480000 — provisional and final variants diverge on identical quoted data"

      - name: committed_vs_settled_agent_exposure
        grounds:
          - calculations.agent_credit_exposure
          - entities.ShipAgent.fields.committed_exposure_cents
          - entities.ShipAgent.fields.settled_exposure_cents
        distinguishing_aspect: |
          On the ShipAgent credit-risk domain (different domain from Rule-1
          instance 1's Order/Invoice money), the committed variant counts the
          accepted-but-uninvoiced order (480,000 in this fixture) while the
          settled variant counts invoiced outstanding only — with the order
          accepted and no invoice yet, committed == 576,000 and settled == 0
          for the same underlying data; after invoicing, settled catches up.
        test_recipe:
          setup:
            - "Same whisky fixture as provisional_vs_final_pricing_duty_flip, but customs stays PENDING so the order total is the dutiable 576,000"
            - "Order accepted (fulfillment OPEN, payment UNINVOICED); no invoice yet"
          setup_api_calls:
            - call: "POST /chandlery/ship-agents"
              payload: { name: "Agent Beta", settlement_currency: USD, credit_limit_cents: 5000000, payment_terms_days: 30 }
              as: FinanceController
              captures: { agent2: $.data.id }
            - call: "POST /chandlery/catalog-items"
              payload: { sku: "WHISKY-02", name: "Scotch Whisky 1L", category: BONDED, bonded_eligible: true, requires_cold_chain: false, base_price_cents: 5000, duty_rate_pct: 20 }
              as: ChandlerOpsManager
              captures: { whisky2: $.data.id }
            - call: "POST /chandlery/stock-lots"
              payload: { catalog_item_id: "${whisky2}", lot_code: "BW-2", storage_tier: BONDED_WAREHOUSE, received_qty: 500, capacity_qty: 0 }
              as: WarehouseSupervisor
            - call: "POST /chandlery/vessel-calls"
              payload: { vessel_name: "MV Borealis", imo_number: "9074730", agent_id: "${agent2}", port_code: "SGSIN", scheduled_eta: "2026-08-10T08:00:00Z", scheduled_etd: "2026-08-14T12:00:00Z", foreign_going: true }
              as: ChandlerOpsManager
              captures: { vc2: $.data.id }
            - call: "POST /chandlery/vessel-calls/${vc2}/requisitions"
              payload: { title: "Bonded stores", lines: [{ catalog_item_id: "${whisky2}", requested_qty: 100, allows_substitution: false }] }
              as: VesselCateringOfficer
              as_user_id: "${vc2}"
              captures: { req2: $.data.id }
            - call: "POST /chandlery/requisitions/${req2}/submit"
              payload: {}
              as: VesselCateringOfficer
              as_user_id: "${vc2}"
            - call: "POST /chandlery/requisitions/${req2}/quotations"
              payload: { lines: [{ catalog_item_id: "${whisky2}", qty: 100, unit_price_cents: 5000, is_substitution: false }], valid_until: "2026-08-12T00:00:00Z" }
              as: ChandlerSalesRep
              captures: { quo2: $.data.id }
            - call: "POST /chandlery/quotations/${quo2}/send"
              payload: {}
              as: ChandlerSalesRep
            - call: "POST /chandlery/_clock/set_current_utc"
              payload: { to_iso8601: "2026-08-10T08:00:00Z" }
              as: ChandlerOpsManager
            - call: "POST /chandlery/vessel-calls/${vc2}/arrive"
              payload: {}
              as: ChandlerOpsManager
            - call: "POST /chandlery/quotations/${quo2}/accept"
              payload: {}
              as: VesselCateringOfficer
              as_user_id: "${vc2}"
              captures: { ord2: $.data.id }
          trigger:
            - call: "GET /chandlery/ship-agents/${agent2}"
              payload: {}
              as: FinanceController
          assert:
            - "ShipAgent.${agent2}.committed_exposure_cents == 576000 (order leg: quotation provisional was computed and frozen while customs PENDING => dutiable 576,000; accept does NOT reprice)"
            - "ShipAgent.${agent2}.settled_exposure_cents == 0 (no invoice exists)"
            - "committed != settled for identical underlying data — variant selection by context"

  # ===========================================================================
  # Rule 2 — combinatorial_formula (3 instances, modes a / b / c)
  # ===========================================================================
  - rule_id: combinatorial_formula
    instances:
      - name: layered_line_pricing_duty_cold_tiers
        grounds:
          - calculations.line_pricing
          - calculations.cold_chain_hours
        distinguishing_aspect: |
          Mode (a) — a >= 3-input non-linear formula: FISH line (qty 40 @ 2500,
          duty 5% dutiable, cold-chain with 100 planned hours straddling the
          72h tier kink => 360 + 12*28 = 696 cents/unit surcharge) composes
          base + conditional duty branch + tiered cold surcharge into
          100,000 + 5,000 + 27,840 = 132,840 — no single-factor recomputation
          reproduces it.
        test_recipe:
          setup:
            - "Agent USD, credit 5,000,000; FISH PROVISIONS cold item base 2500 duty 5% (bonded_eligible false => always dutiable); COLD_STORE lot 1000 units capacity 1000"
            - "Vessel call with 100-hour planned stay (ETA 2026-08-10T08:00:00Z, ETD 2026-08-14T12:00:00Z)"
            - "Requisition submitted; quotation for 40 x FISH @ 2500 drafted"
          setup_api_calls:
            - call: "POST /chandlery/ship-agents"
              payload: { name: "Agent Gamma", settlement_currency: USD, credit_limit_cents: 5000000, payment_terms_days: 30 }
              as: FinanceController
              captures: { agent3: $.data.id }
            - call: "POST /chandlery/catalog-items"
              payload: { sku: "FISH-01", name: "Frozen Salmon 1kg", category: PROVISIONS, bonded_eligible: false, requires_cold_chain: true, base_price_cents: 2500, duty_rate_pct: 5 }
              as: ChandlerOpsManager
              captures: { fish: $.data.id }
            - call: "POST /chandlery/stock-lots"
              payload: { catalog_item_id: "${fish}", lot_code: "CS-1", storage_tier: COLD_STORE, received_qty: 1000, capacity_qty: 1000 }
              as: WarehouseSupervisor
            - call: "POST /chandlery/vessel-calls"
              payload: { vessel_name: "MV Coralia", imo_number: "9074731", agent_id: "${agent3}", port_code: "SGSIN", scheduled_eta: "2026-08-10T08:00:00Z", scheduled_etd: "2026-08-14T12:00:00Z", foreign_going: true }
              as: ChandlerOpsManager
              captures: { vc3: $.data.id }
            - call: "POST /chandlery/vessel-calls/${vc3}/requisitions"
              payload: { title: "Cold provisions", lines: [{ catalog_item_id: "${fish}", requested_qty: 40, allows_substitution: false }] }
              as: VesselCateringOfficer
              as_user_id: "${vc3}"
              captures: { req3: $.data.id }
            - call: "POST /chandlery/requisitions/${req3}/submit"
              payload: {}
              as: VesselCateringOfficer
              as_user_id: "${vc3}"
          trigger:
            - call: "POST /chandlery/requisitions/${req3}/quotations"
              payload: { lines: [{ catalog_item_id: "${fish}", qty: 40, unit_price_cents: 2500, is_substitution: false }], valid_until: "2026-08-12T00:00:00Z" }
              as: ChandlerSalesRep
              captures: { quo3: $.data.id }
          assert:
            - "Quotation.${quo3}.provisional_total_cents == 132840"
            - "components: base 100000 + duty 5000 (5% dutiable, round_half_up exact) + cold surcharge 27840 (40 x (5*72 + 12*28)); subtotal 132840 < 500000 so rebate 0"

      - name: invoice_per_line_rounding_order
        grounds:
          - calculations.order_totals
          - entities.Invoice.fields.total_duty_cents
        distinguishing_aspect: |
          Mode (b) — nested rounding where order matters: two separate lines of
          1 unit each at 333 cents with 5% duty produce duty 17 + 17 = 34 under
          the pinned per-line-then-sum order; the forbidden sum-then-round
          order would produce round_half_up(666 * 5%) = 33. The invoice must
          show 34.
        test_recipe:
          setup:
            - "Agent USD; two PROVISIONS items RICE-A and RICE-B, each base 333 cents, duty 5%, not cold, not bonded-eligible; stock lots 100 each"
            - "Order for 1 x RICE-A + 1 x RICE-B delivered in full; customs irrelevant (bonded_eligible false => always dutiable)"
          setup_api_calls:
            - call: "POST /chandlery/ship-agents"
              payload: { name: "Agent Delta", settlement_currency: USD, credit_limit_cents: 5000000, payment_terms_days: 30 }
              as: FinanceController
              captures: { agent4: $.data.id }
            - call: "POST /chandlery/catalog-items"
              payload: { sku: "RICE-A", name: "Rice 5kg A", category: PROVISIONS, bonded_eligible: false, requires_cold_chain: false, base_price_cents: 333, duty_rate_pct: 5 }
              as: ChandlerOpsManager
              captures: { ricea: $.data.id }
            - call: "POST /chandlery/catalog-items"
              payload: { sku: "RICE-B", name: "Rice 5kg B", category: PROVISIONS, bonded_eligible: false, requires_cold_chain: false, base_price_cents: 333, duty_rate_pct: 5 }
              as: ChandlerOpsManager
              captures: { riceb: $.data.id }
            - call: "POST /chandlery/stock-lots"
              payload: { catalog_item_id: "${ricea}", lot_code: "DS-1", storage_tier: DRY_STORE, received_qty: 100, capacity_qty: 0 }
              as: WarehouseSupervisor
            - call: "POST /chandlery/stock-lots"
              payload: { catalog_item_id: "${riceb}", lot_code: "DS-2", storage_tier: DRY_STORE, received_qty: 100, capacity_qty: 0 }
              as: WarehouseSupervisor
            - call: "POST /chandlery/vessel-calls"
              payload: { vessel_name: "MV Danae", imo_number: "9074732", agent_id: "${agent4}", port_code: "SGSIN", scheduled_eta: "2026-08-10T08:00:00Z", scheduled_etd: "2026-08-14T12:00:00Z", foreign_going: true }
              as: ChandlerOpsManager
              captures: { vc4: $.data.id }
            - call: "POST /chandlery/vessel-calls/${vc4}/requisitions"
              payload: { title: "Dry stores", lines: [{ catalog_item_id: "${ricea}", requested_qty: 1, allows_substitution: false }, { catalog_item_id: "${riceb}", requested_qty: 1, allows_substitution: false }] }
              as: VesselCateringOfficer
              as_user_id: "${vc4}"
              captures: { req4: $.data.id }
            - call: "POST /chandlery/requisitions/${req4}/submit"
              payload: {}
              as: VesselCateringOfficer
              as_user_id: "${vc4}"
            - call: "POST /chandlery/requisitions/${req4}/quotations"
              payload: { lines: [{ catalog_item_id: "${ricea}", qty: 1, unit_price_cents: 333, is_substitution: false }, { catalog_item_id: "${riceb}", qty: 1, unit_price_cents: 333, is_substitution: false }], valid_until: "2026-08-12T00:00:00Z" }
              as: ChandlerSalesRep
              captures: { quo4: $.data.id }
            - call: "POST /chandlery/quotations/${quo4}/send"
              payload: {}
              as: ChandlerSalesRep
            - call: "POST /chandlery/_clock/set_current_utc"
              payload: { to_iso8601: "2026-08-10T08:00:00Z" }
              as: ChandlerOpsManager
            - call: "POST /chandlery/vessel-calls/${vc4}/arrive"
              payload: {}
              as: ChandlerOpsManager
            - call: "POST /chandlery/quotations/${quo4}/accept"
              payload: {}
              as: VesselCateringOfficer
              as_user_id: "${vc4}"
              captures: { ord4: $.data.id }
            - call: "POST /chandlery/orders/${ord4}/deliveries"
              payload: { window_start: "2026-08-10T10:00:00Z", window_end: "2026-08-10T14:00:00Z", lines: [{ catalog_item_id: "${ricea}", qty: 1 }, { catalog_item_id: "${riceb}", qty: 1 }] }
              as: WarehouseSupervisor
              captures: { del4: $.data.id }
            - call: "POST /chandlery/deliveries/${del4}/dispatch"
              payload: {}
              as: WarehouseSupervisor
            - call: "POST /chandlery/deliveries/${del4}/confirm"
              payload: { receiver_name: "Chief Cook", signature_ref: "sig-004", confirmed_lines: [{ catalog_item_id: "${ricea}", qty: 1 }, { catalog_item_id: "${riceb}", qty: 1 }] }
              as: VesselCateringOfficer
              as_user_id: "${vc4}"
          trigger:
            - call: "POST /chandlery/orders/${ord4}/invoices"
              payload: { fx_rate_to_settlement: 1.0 }
              as: FinanceController
              captures: { inv4: $.data.id }
          assert:
            - "Invoice.${inv4}.total_duty_cents == 34 (17 per line, per-line rounding; sum-then-round would give 33)"
            - "Invoice.${inv4}.subtotal_cents == 700 (333+17 + 333+17)"
            - "Invoice.${inv4}.total_cents == 700"

      - name: volume_rebate_evaluation_order_pinned
        grounds:
          - calculations.volume_rebate
          - calculations.order_totals
        distinguishing_aspect: |
          Mode (c) — circular-looking dependency pinned by evaluation order: at
          subtotal exactly 500,000 the tier is read from the PRE-rebate
          subtotal (4% => rebate 20,000 => total 480,000), even though the
          post-rebate total falls back below the 500,000 threshold. An
          implementation that re-reads the tier from the post-rebate total
          yields rebate 0 / total 500,000 — the assertions distinguish them.
        test_recipe:
          setup:
            - "Agent USD; WHISKY bonded item 5000 cents duty 20%; vessel foreign-going, customs CLEARED before quotation (so even the provisional variant is duty-free)"
            - "Quotation for exactly 100 x WHISKY @ 5000 => duty-free line 500,000, subtotal exactly at the inclusive 500,000 tier boundary"
          setup_api_calls:
            - call: "POST /chandlery/ship-agents"
              payload: { name: "Agent Epsilon", settlement_currency: USD, credit_limit_cents: 5000000, payment_terms_days: 30 }
              as: FinanceController
              captures: { agent5: $.data.id }
            - call: "POST /chandlery/catalog-items"
              payload: { sku: "WHISKY-05", name: "Scotch Whisky 1L", category: BONDED, bonded_eligible: true, requires_cold_chain: false, base_price_cents: 5000, duty_rate_pct: 20 }
              as: ChandlerOpsManager
              captures: { whisky5: $.data.id }
            - call: "POST /chandlery/stock-lots"
              payload: { catalog_item_id: "${whisky5}", lot_code: "BW-5", storage_tier: BONDED_WAREHOUSE, received_qty: 500, capacity_qty: 0 }
              as: WarehouseSupervisor
            - call: "POST /chandlery/vessel-calls"
              payload: { vessel_name: "MV Electra", imo_number: "9074733", agent_id: "${agent5}", port_code: "SGSIN", scheduled_eta: "2026-08-10T08:00:00Z", scheduled_etd: "2026-08-14T12:00:00Z", foreign_going: true }
              as: ChandlerOpsManager
              captures: { vc5: $.data.id }
            - call: "POST /chandlery/_clock/set_current_utc"
              payload: { to_iso8601: "2026-08-10T08:00:00Z" }
              as: ChandlerOpsManager
            - call: "POST /chandlery/vessel-calls/${vc5}/arrive"
              payload: {}
              as: ChandlerOpsManager
            - call: "POST /chandlery/vessel-calls/${vc5}/customs-clearance"
              payload: { decision: CLEARED }
              as: PortCustomsOfficer
            - call: "POST /chandlery/vessel-calls/${vc5}/requisitions"
              payload: { title: "Bonded stores", lines: [{ catalog_item_id: "${whisky5}", requested_qty: 100, allows_substitution: false }] }
              as: VesselCateringOfficer
              as_user_id: "${vc5}"
              captures: { req5: $.data.id }
            - call: "POST /chandlery/requisitions/${req5}/submit"
              payload: {}
              as: VesselCateringOfficer
              as_user_id: "${vc5}"
          trigger:
            - call: "POST /chandlery/requisitions/${req5}/quotations"
              payload: { lines: [{ catalog_item_id: "${whisky5}", qty: 100, unit_price_cents: 5000, is_substitution: false }], valid_until: "2026-08-12T00:00:00Z" }
              as: ChandlerSalesRep
              captures: { quo5: $.data.id, quo5_total: $.data.provisional_total_cents }
          assert:
            - "Quotation.${quo5}.provisional_total_cents == 480000"
            - "tier read from pre-rebate subtotal 500000 (>= 500000 inclusive) => rebate 20000; post-rebate total 480000 must NOT re-trigger tier re-evaluation"

  # ===========================================================================
  # Rule 3 — non_linear_state_machine (3 instances, different entities)
  # ===========================================================================
  - rule_id: non_linear_state_machine
    instances:
      - name: quotation_revision_cycle
        grounds:
          - state_machines.Quotation.SENT_to_SENT
          - concurrency_rules[quotation-revise-stale-version]
          - entities.Quotation.fields.revision_count
        distinguishing_aspect: |
          Quotation has a true cycle: SENT -> SENT via revise (revision_count
          and version advance each lap), then accept succeeds from the
          post-cycle state — a linear machine could not express re-negotiation
          without a new quotation.
        test_recipe:
          setup:
            - "Agent USD credit 5,000,000; WATER PROVISIONS base 120 duty 0 not cold; stock 10,000; vessel IN_PORT (arrived at ETA under the logical clock); quotation for 1000 x WATER @ 120 SENT"
          setup_api_calls:
            - call: "POST /chandlery/ship-agents"
              payload: { name: "Agent Zeta", settlement_currency: USD, credit_limit_cents: 5000000, payment_terms_days: 30 }
              as: FinanceController
              captures: { agent6: $.data.id }
            - call: "POST /chandlery/catalog-items"
              payload: { sku: "WATER-01", name: "Water 1L", category: PROVISIONS, bonded_eligible: false, requires_cold_chain: false, base_price_cents: 120, duty_rate_pct: 0 }
              as: ChandlerOpsManager
              captures: { water: $.data.id }
            - call: "POST /chandlery/stock-lots"
              payload: { catalog_item_id: "${water}", lot_code: "DS-W1", storage_tier: DRY_STORE, received_qty: 10000, capacity_qty: 0 }
              as: WarehouseSupervisor
            - call: "POST /chandlery/vessel-calls"
