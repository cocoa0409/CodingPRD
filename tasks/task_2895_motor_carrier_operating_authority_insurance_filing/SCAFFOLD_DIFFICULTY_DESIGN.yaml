            - "InsuranceFiling.${f16b_id}.supersedes_filing_id == ${f16a_id}"
            - "InsuranceFiling.${f16b_id}.status == CANCELLED and cancellation_effective_at == '2026-08-20T00:00:00.000Z' after the explicit cancel"
            - "InsuranceFiling.${f16c_id}.status == ACTIVE with effective_at == '2026-08-20T00:00:00.000Z' — zero-gap adjacency to a closed interval is accepted"
            - "InsuranceFiling.${f16c_id}.supersedes_filing_id is null, because no ACTIVE filing occupied the slot"
            - "OperatingAuthority.${auth16_id}.insurance_status == FILED and authority_status == PENDING"

      - name: designation_slot_uses_closed_intervals_with_a_one_day_transition_buffer
        grounds:
          - calculations.designation_interval_conflict
          - validations[priority=21]
          - errors[ERR_DESIGNATION_INTERVAL_CONFLICT]
          - entities.ProcessAgentDesignation.fields.effective_to
        distinguishing_aspect: |
          The opposite interval discipline from the filing slot: the
          (authority_id, state_code) slot uses CLOSED intervals expanded by a
          1-day transition buffer and has NO supersede path, so a successor
          designation starting on 2026-09-01 — a zero-gap adjacency the filing
          slot would have accepted — is rejected outright, while 2026-09-02 clears
          the buffer and is accepted.
        test_recipe:
          setup:
            - "one PENDING FOR_HIRE_PROPERTY authority for TX/OK/NM"
            - "designations for all three states running the closed interval 2026-08-05 through 2026-08-31"
            - "logical clock at 2026-08-05T00:00:00Z"
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-08-01T00:00:00Z" }
              as: RegistryAdmin
            - call: "POST /carriers"
