              captures: { w1: $.data.id }
            - call: "POST /network/settlement-windows/${w1}/open"
              payload: {}
              as: SettlementOperator
            - call: "POST /network/settlement-lines"
              payload: { window_id: "${w1}", from_member_id: "${m1}", to_member_id: "${m2}", amount_cents: 1000, currency: "USD", reference: "ref-1" }
              as: SettlementOperator
              captures: { l1: $.data.id }
          trigger:
            - call: "POST /network/settlement-windows/${w1}/reconcile"
              payload: {}
              as: SettlementOperator
              captures: { rec_err: $.data.error_id }
            - call: "POST /network/settlement-lines/${l1}/commit"
              payload: {}
              as: SettlementOperator
            - call: "POST /network/settlement-windows/${w1}/reconcile"
              payload: {}
              as: SettlementOperator
          assert:
            - "First reconcile -> ERR_DRAFT_LINES_REMAIN (422); window stays OPEN"
            - "After committing the only DRAFT line, reconcile succeeds: SettlementWindow.${w1}.status == RECONCILED"
            - "SettlementWindow.${w1}.total_settled_cents == 1000"

  - rule_id: cross_entity_state_dependency
    instances:
      - name: participant_approval_gated_on_sponsor_member_state
        grounds:
          - state_machines.Participant.PENDING_REVIEW_to_ACTIVE
          - errors[ERR_SPONSOR_INACTIVE]
          - entities.Participant.fields.sponsor_member_id
        distinguishing_aspect: |
          Participant -> Member dependency: approving a PENDING_REVIEW participant is rejected with
          ERR_SPONSOR_INACTIVE while its sponsor member is still in APPLICATION, and succeeds unchanged
          once the member is approved — the participant's valid transitions depend on the member's state.
        test_recipe:
          setup:
            - "Member M in APPLICATION (never approved); participant P sponsored by M in PENDING_REVIEW"
          setup_api_calls:
            - call: "POST /network/members"
              payload: { legal_name: "Sponsor Bank", member_kind: "ACQUIRER", region: "LATAM" }
              as: NetworkOperator
              captures: { m1: $.data.id }
            - call: "POST /network/participants"
              payload: { name: "P Co", sponsor_member_id: "${m1}", program_name: "PP" }
              as: SponsorshipManager
              captures: { p1: $.data.id }
          trigger:
            - call: "POST /network/participants/${p1}/approve"
              payload: {}
              as: SponsorshipManager
              captures: { err1: $.data.error_id }
            - call: "POST /network/members/${m1}/approve"
              payload: {}
              as: NetworkOperator
            - call: "POST /network/participants/${p1}/approve"
              payload: {}
              as: SponsorshipManager
          assert:
            - "First approve -> ERR_SPONSOR_INACTIVE (422); Participant.${p1}.status stays PENDING_REVIEW"
            - "After member approval, the identical call succeeds: Participant.${p1}.status == ACTIVE"

      - name: fraud_confirm_gated_on_merchant_state
        grounds:
