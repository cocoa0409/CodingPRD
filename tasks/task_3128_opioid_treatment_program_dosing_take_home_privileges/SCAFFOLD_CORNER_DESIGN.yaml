            - "GET /otp/patients/${pat_id} reports stability_score == 75.0, the base 50.0 plus the capped 25.0 treatment-days term"
            - "GET /otp/dose-dispenses?patient_id=${pat_id} returns 0 rows, so the journal window is empty"
            - "TakeHomePrivilege.${priv_id}.decision == APPROVED, so with an empty window the 2.0 + 1.5 look-back discount is not subtracted and 75.0 meets the STABILIZATION floor exactly"
            - "TakeHomePrivilege.${priv_id}.approved_carries == 1 and denial_reason_code is null"

  # ===========================================================================
  - section: validations
    instances:

      - name: auth_error_precedes_existence_on_a_nurse_reading_an_absent_patient
        claim_type: priority_ordering
        grounds:
          - validations[priority=1]
          - validations[priority=4]
          - error_catalog[ERR_MISSING_OR_INVALID_USER_CONTEXT_HEADER]
          - error_catalog[ERR_PATIENT_NOT_FOUND]
        distinguishing_aspect: "The auth-versus-existence priority pair: a header-less request against an absent patient id answers 400 ERR_MISSING_OR_INVALID_USER_CONTEXT_HEADER, so the missing header outranks the missing resource."
        test_recipe:
          setup:
            - "Logical clock at 2026-09-01T00:00:00Z. Empty database."
          setup_api_calls:
            - *c_clock
          trigger:
            - call: "GET /otp/patients/00000000-0000-4000-8000-0000000000ff"
              payload: {}
              as: ProgramAdministrator
              as_user_id: "operator-1"
              captures: { err_absent: $.data.error_id }
            - call: "GET /otp/patients/00000000-0000-4000-8000-0000000000ff"
              payload: {}
              as: RegisteredNurse
              captures: { err_absent_role: $.data.error_id }
          assert:
            - "the first read returns 404 and err_absent == ERR_PATIENT_NOT_FOUND"
            - "the second read, sent as RegisteredNurse which is not a declared role, returns 400 and err_absent_role == ERR_MISSING_OR_INVALID_USER_CONTEXT_HEADER"
            - "err_absent_role != ERR_PATIENT_NOT_FOUND, so the auth check is ordered above existence"

      - name: role_denial_precedes_the_state_gate_for_a_counselor_granting_a_carry
        claim_type: violation_to_error
        grounds:
          - errors[ERR_INSUFFICIENT_PERMISSIONS]
          - errors[ERR_PRIVILEGE_NOT_PENDING]
          - validations[priority=2]
          - endpoints.POST_/otp/take-home-privileges/{privilegeId}/evaluate
        distinguishing_aspect: "Authorization is checked before the state gate: a Counselor evaluating a privilege that is not even PENDING_REVIEW answers 403 ERR_INSUFFICIENT_PERMISSIONS, and the same call as MedicalDirector answers 409 ERR_PRIVILEGE_NOT_PENDING."
        test_recipe:
          setup:
            - "Logical clock at 2026-09-01T00:00:00Z, advanced to 2026-12-15. One CA program with a quota of 10, a Physician, a Nurse, a MedicalDirector and one admitted patient with a held privilege that has already been evaluated to DENIED."
          setup_api_calls:
            - *c_clock
            - *c_prog
            - call: "POST /otp/programs/${prog_id}/carry-quota"
              payload: { allotted_carries: 10 }
              as: ProgramAdministrator
              captures: { quota_id: $.data.id }
            - *c_phys
            - call: "POST /otp/users"
              payload: { program_id: "${prog_id}", full_name: "Nora Nurse", staff_role: "NURSE", license_number: "RN-1001" }
              as: ProgramAdministrator
              captures: { nurse_id: $.data.id }
            - call: "POST /otp/users"
              payload: { program_id: "${prog_id}", full_name: "Cleo Counselor", staff_role: "COUNSELOR", license_number: "LPC-4001" }
              as: ProgramAdministrator
