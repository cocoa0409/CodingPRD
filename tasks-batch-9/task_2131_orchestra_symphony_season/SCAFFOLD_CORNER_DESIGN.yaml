        claim_type: Not Found
        grounds: ["validations[priority=3]", "errors[ERR_SEASON_NOT_FOUND]", "errors[ERR_VENUE_NOT_FOUND]", "errors[ERR_SECTION_NOT_FOUND]", "errors[ERR_CONCERT_NOT_FOUND]", "errors[ERR_CONTRACT_NOT_FOUND]", "errors[ERR_MUSICIAN_NOT_FOUND]"]
