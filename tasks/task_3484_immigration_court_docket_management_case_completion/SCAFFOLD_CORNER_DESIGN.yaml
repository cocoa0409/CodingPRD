  # ===========================================================================
  - section: validations
    instances:

      - name: missing_auth_headers_returns_400
        claim_type: Violation → Error
        grounds:
          - validations[priority=1]
          - errors.ERR_MISSING_OR_INVALID_USER_CONTEXT_HEADER
        distinguishing_aspect: "A request with no X-User-ID/X-User-Role headers is rejected at priority 1 with a 400 — before any role, existence, or business check."
        test_recipe:
          setup: ["Logical clock at 2026-09-01T00:00:00Z. Empty database."]
          setup_api_calls:
            - *c_clock
          trigger:
            - call: "POST /eoir/courts"
              payload: { court_code: "CT-X", name: "No Auth Court", city: "Nowhere", annual_completion_goal: 10, detained_daily_hearing_capacity: 1 }
              captures: { err: $.data.error_id }
          assert:
            - "the response status is 400 and error_id == ERR_MISSING_OR_INVALID_USER_CONTEXT_HEADER"

      - name: unknown_role_and_unknown_judge_identity_returns_400
        claim_type: Violation → Error
        grounds:
          - validations[priority=1]
          - roles.ImmigrationJudge
        distinguishing_aspect: "Priority 1 has two teeth: an undeclared role string is a 400, and the entity-backed ImmigrationJudge role whose X-User-ID matches no Judge row is also a 400 (not a 403 or 404)."
        test_recipe:
          setup: ["Logical clock at 2026-09-01T00:00:00Z. One court."]
          setup_api_calls:
            - *c_clock
            - *c_court
          trigger:
            - call: "GET /eoir/courts/${court_id}"
              payload: {}
              as: SuperUser
