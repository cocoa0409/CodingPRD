          - entities.ScreeningCycle.fields.tier_opened_at
        distinguishing_aspect: "The deadline is derived from tier_opened_at rather than from the cycle's opens_at, so advancing three days into a three-day window does not shorten the next window: tier_opened_at is re-stamped to the logical clock and tier_deadline_at moves to that instant plus exactly 72 hours, keeping every tier the same length no matter when the advance happens."
        test_recipe:
          setup:
            - "logical clock at 2026-08-01T00:00:00Z"
            - "an ACCEPTED turn-in for DOT-01 whose FURNITURE asset (cost 1000000, acquired 2026-01-10, C1 -> fair_market_value_cents 1000000) is above the de-minimis threshold"
