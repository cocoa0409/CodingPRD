  - rule_id: compensating_invariant
    instances:
      - name: hold_resume_conserves_total_sla_budget_minutes
        grounds:
          - state_machines.Ticket.IN_PROGRESS_to_ON_HOLD
          - state_machines.Ticket.ON_HOLD_to_IN_PROGRESS
          - calculations.sla_resume
        distinguishing_aspect: |
          Conserved quantity #1 = the working SLA budget (resolve_due_at minus accumulated paused time). Forward
          action hold + compensating action resume MUST leave (resolve_due_at - opened_at - paused_total_minutes)
          equal to the original effective resolve window (240 min for the P3 base), i.e. paused time is fully
          credited back and nothing else shifts.
