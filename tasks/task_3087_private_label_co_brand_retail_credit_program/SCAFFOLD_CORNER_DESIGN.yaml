              payload: { principal_balance_cents: 360000, balance_bucket: "PRINCIPAL" }
              as: ProgramAdmin
            - call: "POST /servicing/transactions"
              payload: { account_id: "${acct_id}", merchant_name: "Coldgate Vests", amount_cents: 120000, transaction_channel: "IN_STORE", promo_requested: true, promo_term_months: 12 }
              as: Cardholder
              as_user_id: "${acct_id}"
            - call: "POST /servicing/transactions"
              payload: { account_id: "${acct_id}", merchant_name: "Coldgate Oars", amount_cents: 240000, transaction_channel: "DIGITAL", promo_requested: true, promo_term_months: 6 }
              as: Cardholder
              as_user_id: "${acct_id}"
            - call: "POST /servicing/settlement-batches"
              payload: { agreement_id: "${ag_id}", period_start: "2026-09-01T00:00:00Z", period_end: "2026-10-01T00:00:00Z", settlement_method: "AS_CHARGED", reconciliation_method: "PROJECTED" }
              as: ProgramAdmin
              captures: { b_id: "$.data.id" }
          trigger:
            - call: "POST /servicing/settlement-batches/${b_id}/finalize"
              payload: {}
              as: ProgramAdmin
              captures: { contrib: "$.data.retailer_liability_cents" }
          assert:
            - "GET /servicing/credit-programs/${g_id}/summary program_profitability_cents == 21196"
            - "the settled contribution before acquisition cost is 25396 and exactly one 4200 acquisition charge applies for account_count 1"

      - name: program_profitability_incremental_matches_full_recompute
        claim_type: Precision
        grounds:
          - calculations.program_profitability
          - calculations.promo_subsidy_settlement
          - entities.CreditProgram.fields.program_profitability_cents
        distinguishing_aspect: "Each batch contribution is rounded before the outer sum, so settling a second batch moves profitability by the second batch's rounded contribution exactly — the incremental and full_recompute variants agree to the cent."
        test_recipe:
          setup:
            - "Logical clock 2026-09-01T00:00:00Z. One program, one account, two promo plans and one settled September batch."
          setup_api_calls:
            - *c_clock
            - *c_partner_b
            - *c_agreement
            - *c_neg
            - *c_exec
            - *c_program
            - *c_app
            - *c_decide
