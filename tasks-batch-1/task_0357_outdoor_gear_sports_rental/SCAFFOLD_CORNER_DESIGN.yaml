            - call: "POST /rental/gear-units"
              payload: { gear_type_id: "${gt_id}", rate_card_id: "${rc_id}", asset_tag: "OCC-1" }
              as: ShopAdmin
              captures: { gu_id: $.data.id, gu_v0: $.data.version }
