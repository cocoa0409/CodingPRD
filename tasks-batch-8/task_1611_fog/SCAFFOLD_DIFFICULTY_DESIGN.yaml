            - call: "GET /establishments/${est_id}"
              as: ProgramAdmin
              captures: { est_v1: $.data.version }
            - call: "POST /variance-requests/${v1}/approve"
              payload: { expected_establishment_version: "${est_v1}" }
              as: ComplianceOfficer
            - call: "POST /variance-requests"
              payload: { establishment_id: "${est_id}", scope: "PUMPING_FREQUENCY", requested_frequency_days: 150, justification: "v2", effective_from: "2027-03-01T00:00:00Z", effective_to: "2027-09-01T00:00:00Z" }
              as: FseContact
              as_user_id: "${est_id}"
              captures: { v2: $.data.id }
            - call: "POST /variance-requests/${v2}/deny"
              payload: {}
              as: ComplianceOfficer
            - call: "GET /establishments/${est_id}"
              as: ProgramAdmin
              captures: { est_v2: $.data.version }
          trigger:
            - call: "POST /variance-requests/${v2}/approve"
              payload: { expected_establishment_version: "${est_v2}" }
              as: ComplianceOfficer
              captures: { err: $.data.error_id }
          assert:
            - "error_id == ERR_INVALID_STATE (priority 6 state beats priority 11 business_temporal)"
            - "ERR_VARIANCE_WINDOW_OVERLAP is NOT returned although [2027-03-01, 2027-09-01) still overlaps V1's APPROVED window"
            - "VarianceRequest.${v2}.status remains DENIED"

  - rule_id: boundary_precision_check
    instances:
      - name: inspection_score_exactly_seventy_passes
        grounds:
          - calculations.inspection_score
          - entities.Inspection.fields.score
          - entities.Inspection.fields.passed
        distinguishing_aspect: |
          Boundary on the score metric (>= vs >): deductions of exactly 30 yield
          score == 70 which PASSES (no violation); deductions of 31 yield 69
          which FAILS and auto-creates a violation. Reached via POST /inspections.
          Different metric from the budget-cents sibling.
        test_recipe:
          setup:
            - "two establishments E1, E2"
          setup_api_calls:
            - call: "POST /establishments"
              payload: { name: "Boundary One", street_address: "60 D Dr", seating_capacity: 10, fryer_count: 0, cuisine_profile: LOW_GREASE }
              as: ProgramAdmin
              captures: { e1: $.data.id }
            - call: "POST /establishments"
              payload: { name: "Boundary Two", street_address: "61 D Dr", seating_capacity: 10, fryer_count: 0, cuisine_profile: LOW_GREASE }
              as: ProgramAdmin
              captures: { e2: $.data.id }
          trigger:
            - call: "POST /inspections"
              payload: { establishment_id: "${e1}", items: [ { category: "GREASE_TRAP_MAINTENANCE", severity: "MAJOR" }, { category: "RECORD_KEEPING", severity: "MAJOR" }, { category: "STRUCTURAL", severity: "MAJOR" }, { category: "BMP_PRACTICES", severity: "MINOR" }, { category: "BMP_PRACTICES", severity: "MINOR" } ] }
              as: Inspector
              captures: { insp1: $.data.id }
            - call: "POST /inspections"
              payload: { establishment_id: "${e2}", items: [ { category: "GREASE_TRAP_MAINTENANCE", severity: "MAJOR" }, { category: "RECORD_KEEPING", severity: "MAJOR" }, { category: "BMP_PRACTICES", severity: "MINOR" }, { category: "BMP_PRACTICES", severity: "MINOR" }, { category: "STRUCTURAL", severity: "MINOR" }, { category: "STRUCTURAL", severity: "MINOR" }, { category: "RECORD_KEEPING", severity: "MINOR" } ] }
              as: Inspector
              captures: { insp2: $.data.id }
            - call: "GET /violations?establishment_id=${e1}"
              as: Inspector
            - call: "GET /violations?establishment_id=${e2}&status=NOTICED"
              as: Inspector
              captures: { viol2: "$.data[0].id" }
          assert:
            - "Inspection.${insp1}.score == 70 (100 - 3*8 - 2*3) and passed == true"
            - "no Violation exists for ${e1} (violations list empty, total_count == 0) — exactly 70 passes"
            - "Inspection.${insp2}.score == 69 (100 - 2*8 - 5*3) and passed == false"
            - "Violation.${viol2}.severity == MAJOR and status == NOTICED — 69 fails"

      - name: campaign_budget_exact_fit_allowed
        grounds:
          - calculations.campaign_budget
          - validations[priority=13]
          - errors[ERR_CAMPAIGN_BUDGET_EXCEEDED]
        distinguishing_aspect: |
          Boundary on the budget-cents metric: an event whose cost exactly equals
          remaining_budget_cents is ALLOWED (rejects only on strict >); the next
          event of cost 1 is rejected. Reached via POST /campaigns/{id}/events.
          Different metric and endpoint from the inspection-score sibling.
        test_recipe:
          setup:
            - "campaign with budget_cents 50000, window [2026-09-01, 2026-10-01)"
          setup_api_calls:
            - call: "POST /campaigns"
              payload: { name: "Grease Wipe Week", outreach_zone: "ZBOUND", start_date: "2026-09-01T00:00:00Z", end_date: "2026-10-01T00:00:00Z", budget_cents: 50000 }
              as: ProgramAdmin
              captures: { camp: $.data.id }
          trigger:
            - call: "POST /campaigns/${camp}/events"
              payload: { event_date: "2026-09-15T00:00:00Z", venue_name: "County Fair", attendance_count: 100, cost_cents: 50000 }
              as: ProgramAdmin
              captures: { ev: $.data.id }
            - call: "GET /campaigns/${camp}"
              as: ProgramAdmin
            - call: "POST /campaigns/${camp}/events"
              payload: { event_date: "2026-09-16T00:00:00Z", venue_name: "School Gym", attendance_count: 50, cost_cents: 1 }
              as: ProgramAdmin
              captures: { err: $.data.error_id }
          assert:
            - "first event (cost == remaining 50000) succeeds: OutreachEvent.${ev}.status == RECORDED"
            - "EducationCampaign.${camp}.remaining_budget_cents == 0 after the exact-fit event"
            - "second event (cost 1 > remaining 0) returns error_id == ERR_CAMPAIGN_BUDGET_EXCEEDED"

  - rule_id: cross_entity_state_dependency
    instances:
      - name: manifest_verify_requires_permitted_hauler
        grounds:
          - state_machines.PumpManifest.SUBMITTED_to_VERIFIED
          - state_machines.Hauler.PERMITTED_to_SUSPENDED
          - errors[ERR_HAULER_NOT_PERMITTED]
        distinguishing_aspect: |
          Entity pair PumpManifest x Hauler: the manifest's valid transition
          SUBMITTED -> VERIFIED is gated on the linked Hauler's status ==
          PERMITTED. Distinct pair from the VarianceRequest x Establishment
          sibling.
        test_recipe:
          setup:
            - "HIGH establishment with ACTIVE interceptor; hauler PERMITTED"
            - "manifest M SUBMITTED with a matching disposal record (2000/2000 gal) filed while the hauler was PERMITTED"
            - "hauler then SUSPENDED"
          setup_api_calls:
            - call: "POST /establishments"
              payload: { name: "Gate Diner", street_address: "70 E Rd", seating_capacity: 200, fryer_count: 3, has_charbroiler: false, cuisine_profile: HIGH_GREASE }
              as: ProgramAdmin
              captures: { est_id: $.data.id }
            - call: "POST /interceptors"
              payload: { establishment_id: "${est_id}", nominal_capacity_gal: 600 }
              as: ProgramAdmin
              captures: { int_id: $.data.id }
            - call: "POST /interceptors/${int_id}/approve"
              payload: {}
              as: ComplianceOfficer
            - call: "POST /interceptors/${int_id}/commission"
              payload: {}
              as: Inspector
            - call: "POST /haulers"
              payload: { name: "Gate Haul", permit_number: "PN-GATE", insurance_expires_on: "2027-06-01T00:00:00Z" }
              as: ProgramAdmin
              captures: { h: $.data.id }
            - call: "POST /haulers/${h}/permit"
              payload: {}
              as: ProgramAdmin
            - call: "POST /pump-manifests"
              payload: { establishment_id: "${est_id}", interceptor_id: "${int_id}", hauler_id: "${h}", pump_date: "2026-08-02T00:00:00Z", pumped_volume_gal: 2000 }
              as: FseContact
              as_user_id: "${est_id}"
              captures: { m: $.data.id }
            - call: "POST /disposal-records"
              payload: { hauler_id: "${h}", manifest_id: "${m}", disposed_volume_gal: 2000, disposal_site_name: "Site B", disposed_at: "2026-08-02T12:00:00Z" }
              as: HaulerAdmin
              as_user_id: "${h}"
            - call: "POST /haulers/${h}/suspend"
              payload: {}
              as: ComplianceOfficer
          trigger:
            - call: "POST /pump-manifests/${m}/verify"
              payload: {}
              as: Inspector
              captures: { err: $.data.error_id }
            - call: "POST /haulers/${h}/reinstate"
              payload: {}
              as: ComplianceOfficer
            - call: "POST /pump-manifests/${m}/verify"
              payload: {}
              as: Inspector
            - call: "GET /establishments/${est_id}"
              as: ProgramAdmin
          assert:
            - "first verify returns error_id == ERR_HAULER_NOT_PERMITTED while Hauler.status == SUSPENDED"
            - "after reinstate the SAME manifest verifies: PumpManifest.${m}.status == VERIFIED"
            - "Establishment.${est_id}.last_verified_pump_at == 2026-08-02T00:00:00Z"

      - name: variance_approve_blocked_when_establishment_suspended
        grounds:
          - state_machines.VarianceRequest.UNDER_REVIEW_to_APPROVED
          - state_machines.Establishment.transitions
          - errors[ERR_ESTABLISHMENT_SUSPENDED]
        distinguishing_aspect: |
          Entity pair VarianceRequest x Establishment: approval of a variance in
          UNDER_REVIEW is gated on the linked Establishment's compliance_status
          != SUSPENDED. Distinct pair from the PumpManifest x Hauler sibling.
        test_recipe:
          setup:
            - "HIGH establishment"
            - "failing inspection at default clock 2026-08-01T00:00:00Z with 4 CRITICAL items (score 20, severity CRITICAL, cure_deadline 2026-08-04T00:00:00Z)"
            - "clock advanced to exactly the deadline; violation escalated manually -> establishment posture SUSPENDED"
            - "variance V created AFTER the suspension (creation is not posture-gated) -> UNDER_REVIEW"
          setup_api_calls:
            - call: "POST /establishments"
              payload: { name: "Suspended Steakhouse", street_address: "80 F Blvd", seating_capacity: 200, fryer_count: 3, has_charbroiler: false, cuisine_profile: HIGH_GREASE }
              as: ProgramAdmin
              captures: { est_id: $.data.id }
            - call: "POST /inspections"
              payload: { establishment_id: "${est_id}", items: [ { category: "GREASE_TRAP_MAINTENANCE", severity: "CRITICAL" }, { category: "RECORD_KEEPING", severity: "CRITICAL" }, { category: "STRUCTURAL", severity: "CRITICAL" }, { category: "BMP_PRACTICES", severity: "CRITICAL" } ] }
              as: Inspector
            - call: "GET /violations?establishment_id=${est_id}&status=NOTICED"
              as: Inspector
              captures: { viol_id: "$.data[0].id" }
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-08-04T00:00:00Z" }
              as: ProgramAdmin
            - call: "POST /violations/${viol_id}/escalate"
              payload: {}
              as: ComplianceOfficer
            - call: "POST /variance-requests"
              payload: { establishment_id: "${est_id}", scope: "PUMPING_FREQUENCY", requested_frequency_days: 120, justification: "late request", effective_from: "2027-01-01T00:00:00Z", effective_to: "2027-07-01T00:00:00Z" }
              as: FseContact
              as_user_id: "${est_id}"
              captures: { var_id: $.data.id }
            - call: "GET /establishments/${est_id}"
              as: ProgramAdmin
              captures: { est_v: $.data.version }
          trigger:
            - call: "POST /variance-requests/${var_id}/approve"
              payload: { expected_establishment_version: "${est_v}" }
              as: ComplianceOfficer
              captures: { err: $.data.error_id }
          assert:
            - "error_id == ERR_ESTABLISHMENT_SUSPENDED (state check on the variance passes: it is UNDER_REVIEW; the cross-entity posture gate fails)"
            - "VarianceRequest.${var_id}.status remains UNDER_REVIEW"
            - "Establishment.${est_id}.compliance_status == SUSPENDED"

  - rule_id: resource_temporal_overlap
    instances:
      - name: variance_windows_half_open_adjacency
        grounds:
          - state_machines.VarianceRequest.UNDER_REVIEW_to_APPROVED
          - errors[ERR_VARIANCE_WINDOW_OVERLAP]
          - entities.VarianceRequest.fields.effective_from
        distinguishing_aspect: |
          Interval semantics: half-open [effective_from, effective_to) — a new
          window starting exactly when an APPROVED window ends is allowed, while
          a one-day overlap is rejected. Resource: VarianceRequest windows per
          establishment+scope. Different interval semantics from the campaign
          14-day-buffer sibling.
        test_recipe:
          setup:
            - "LOW establishment (COMPLIANT throughout)"
            - "V1 PUMPING_FREQUENCY [2027-01-01, 2027-07-01) APPROVED"
            - "V2 PUMPING_FREQUENCY [2027-07-01, 2028-01-01) UNDER_REVIEW (starts exactly at V1's end)"
            - "V3 PUMPING_FREQUENCY [2027-06-30, 2027-12-01) UNDER_REVIEW (overlaps V1 by one day)"
          setup_api_calls:
            - call: "POST /establishments"
              payload: { name: "Adjacency Eats", street_address: "90 G Ln", seating_capacity: 10, fryer_count: 0, cuisine_profile: LOW_GREASE }
              as: ProgramAdmin
              captures: { est_id: $.data.id }
            - call: "POST /variance-requests"
              payload: { establishment_id: "${est_id}", scope: "PUMPING_FREQUENCY", requested_frequency_days: 120, justification: "v1", effective_from: "2027-01-01T00:00:00Z", effective_to: "2027-07-01T00:00:00Z" }
              as: FseContact
              as_user_id: "${est_id}"
              captures: { v1: $.data.id }
            - call: "GET /establishments/${est_id}"
              as: ProgramAdmin
              captures: { est_v1: $.data.version }
            - call: "POST /variance-requests/${v1}/approve"
              payload: { expected_establishment_version: "${est_v1}" }
              as: ComplianceOfficer
            - call: "POST /variance-requests"
              payload: { establishment_id: "${est_id}", scope: "PUMPING_FREQUENCY", requested_frequency_days: 150, justification: "v2 adjacent", effective_from: "2027-07-01T00:00:00Z", effective_to: "2028-01-01T00:00:00Z" }
              as: FseContact
              as_user_id: "${est_id}"
              captures: { v2: $.data.id }
            - call: "GET /establishments/${est_id}"
              as: ProgramAdmin
              captures: { est_v2: $.data.version }
            - call: "POST /variance-requests/${v2}/approve"
              payload: { expected_establishment_version: "${est_v2}" }
              as: ComplianceOfficer
            - call: "POST /variance-requests"
              payload: { establishment_id: "${est_id}", scope: "PUMPING_FREQUENCY", requested_frequency_days: 200, justification: "v3 overlapping", effective_from: "2027-06-30T00:00:00Z", effective_to: "2027-12-01T00:00:00Z" }
              as: FseContact
              as_user_id: "${est_id}"
              captures: { v3: $.data.id }
            - call: "GET /establishments/${est_id}"
              as: ProgramAdmin
              captures: { est_v3: $.data.version }
          trigger:
            - call: "POST /variance-requests/${v3}/approve"
              payload: { expected_establishment_version: "${est_v3}" }
              as: ComplianceOfficer
              captures: { err: $.data.error_id }
            - call: "GET /establishments/${est_id}"
              as: ProgramAdmin
          assert:
            - "VarianceRequest.${v2}.status == APPROVED — adjacency (V2.from == V1.to) is allowed under half-open semantics"
            - "V3 approve returns error_id == ERR_VARIANCE_WINDOW_OVERLAP — [2027-06-30, 2027-12-01) overlaps V1 by one day"
            - "VarianceRequest.${v3}.status remains UNDER_REVIEW"
            - "Establishment.${est_id}.variance_override_frequency_days == 150 (V2's value; V3 wrote nothing)"

      - name: campaign_zone_fourteen_day_buffer
        grounds:
          - validations[priority=11]
          - errors[ERR_CAMPAIGN_WINDOW_CONFLICT]
          - entities.EducationCampaign.fields.outreach_zone
        distinguishing_aspect: |
          Interval semantics: campaigns in the same outreach_zone require a
          >= 14-day gap between one campaign's end and the next's start —
          adjacency (gap 0) and small gaps are rejected, gap exactly 14 is
          allowed. Resource: EducationCampaign zone windows. Different semantics
          (buffer, not half-open adjacency) and different resource from the
          variance sibling.
        test_recipe:
          setup:
            - "campaign C1 in zone NORTHSIDE [2026-09-01, 2026-09-30]"
          setup_api_calls:
            - call: "POST /campaigns"
              payload: { name: "C1 Fall Kickoff", outreach_zone: "NORTHSIDE", start_date: "2026-09-01T00:00:00Z", end_date: "2026-09-30T00:00:00Z", budget_cents: 10000 }
              as: ProgramAdmin
              captures: { c1: $.data.id }
          trigger:
            - call: "POST /campaigns"
              payload: { name: "C2 Mid October", outreach_zone: "NORTHSIDE", start_date: "2026-10-14T00:00:00Z", end_date: "2026-11-01T00:00:00Z", budget_cents: 10000 }
              as: ProgramAdmin
              captures: { c2: $.data.id }
            - call: "POST /campaigns"
              payload: { name: "C3 Too Soon", outreach_zone: "NORTHSIDE", start_date: "2026-10-10T00:00:00Z", end_date: "2026-10-20T00:00:00Z", budget_cents: 5000 }
              as: ProgramAdmin
              captures: { err: $.data.error_id }
          assert:
            - "C2 created (gap 2026-09-30 -> 2026-10-14 == 14 days meets the >= 14 buffer)"
            - "C3 returns error_id == ERR_CAMPAIGN_WINDOW_CONFLICT (gap 10 days < 14 vs C1)"
            - "EducationCampaign.${c1} and .${c2} both exist with their declared windows"

  - rule_id: compensating_invariant
    instances:
      - name: campaign_event_void_restores_budget
        grounds:
          - calculations.campaign_budget
          - state_machines.OutreachEvent.RECORDED_to_VOIDED
          - entities.EducationCampaign.fields.remaining_budget_cents
        distinguishing_aspect: |
          Conserved quantity: currency (cents). Forward action POST
          /campaigns/{id}/events debits 30000; its compensating action POST
          /outreach-events/{id}/void credits exactly the same 30000 —
          remaining_budget_cents is provably identical before the pair and after
          it. Different conserved quantity from the violation-count sibling.
        test_recipe:
          setup:
            - "campaign budget_cents 50000, window [2026-09-01, 2026-10-01)"
          setup_api_calls:
            - call: "POST /campaigns"
              payload: { name: "Invariant Drive", outreach_zone: "ZSOUTH", start_date: "2026-09-01T00:00:00Z", end_date: "2026-10-01T00:00:00Z", budget_cents: 50000 }
              as: ProgramAdmin
              captures: { camp: $.data.id }
          trigger:
            - call: "POST /campaigns/${camp}/events"
              payload: { event_date: "2026-09-10T00:00:00Z", venue_name: "Library", attendance_count: 40, cost_cents: 30000 }
              as: ProgramAdmin
              captures: { ev: $.data.id }
            - call: "GET /campaigns/${camp}"
              as: ProgramAdmin
            - call: "POST /outreach-events/${ev}/void"
              payload: {}
              as: ProgramAdmin
            - call: "GET /campaigns/${camp}"
              as: ProgramAdmin
          assert:
            - "after the event: EducationCampaign.${camp}.remaining_budget_cents == 20000"
            - "after the void: EducationCampaign.${camp}.remaining_budget_cents == 50000 == budget_cents (invariant: record + void conserves remaining_budget_cents)"
            - "OutreachEvent.${ev}.status == VOIDED"

      - name: violation_dismiss_restores_open_count
        grounds:
          - entities.Establishment.fields.open_violation_count
          - state_machines.Violation.NOTICED_to_DISMISSED
        distinguishing_aspect: |
          Conserved quantity: an integer count (open violations). The failing
          inspection creates a violation (+1); the compensating dismiss removes
          it (-1) — open_violation_count is provably identical before the pair
          and after it. Different conserved quantity (count vs currency) from
          the budget sibling.
        test_recipe:
          setup:
            - "LOW establishment, COMPLIANT, open_violation_count == 0 (created at default clock 2026-08-01T00:00:00Z; 365-day frequency means not overdue)"
            - "inspection recorded by Inspector with X-User-ID insp-7"
          setup_api_calls:
            - call: "POST /establishments"
              payload: { name: "Counting Cafe", street_address: "99 H Way", seating_capacity: 10, fryer_count: 0, cuisine_profile: LOW_GREASE }
              as: ProgramAdmin
              captures: { est_id: $.data.id }
            - call: "POST /inspections"
              payload: { establishment_id: "${est_id}", items: [ { category: "GREASE_TRAP_MAINTENANCE", severity: "MAJOR" }, { category: "RECORD_KEEPING", severity: "MAJOR" }, { category: "BMP_PRACTICES", severity: "MINOR" }, { category: "BMP_PRACTICES", severity: "MINOR" }, { category: "STRUCTURAL", severity: "MINOR" }, { category: "STRUCTURAL", severity: "MINOR" }, { category: "RECORD_KEEPING", severity: "MINOR" } ] }
              as: Inspector
              as_user_id: "insp-7"
            - call: "GET /violations?establishment_id=${est_id}&status=NOTICED"
              as: Inspector
              captures: { viol_id: "$.data[0].id" }
            - call: "GET /establishments/${est_id}"
              as: ProgramAdmin
          trigger:
            - call: "POST /violations/${viol_id}/dismiss"
              payload: {}
              as: ComplianceOfficer
              as_user_id: "officer-9"
            - call: "GET /establishments/${est_id}"
              as: ProgramAdmin
          assert:
            - "after the failing inspection: Establishment.${est_id}.open_violation_count == 1 and compliance_status == WATCH"
            - "after the dismiss (officer-9 != recorder insp-7): open_violation_count == 0 (invariant: create + dismiss conserves open_violation_count)"
            - "Establishment.${est_id}.compliance_status == COMPLIANT"
            - "Violation.${viol_id}.status == DISMISSED and dismissed_by_user_id == officer-9"
