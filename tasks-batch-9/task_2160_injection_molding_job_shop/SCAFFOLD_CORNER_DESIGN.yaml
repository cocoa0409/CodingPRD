# =============================================================================
# §1.9 Scaffold Corner Design (Coverage Index for Non-Difficulty Tests) — task_2160
# Breadth probe over every testable claim §1.1–§1.7 declares that
# SCAFFOLD_DIFFICULTY_DESIGN.yaml does not already exercise. Sections and
# claim_type values come from references/claim-extraction-guide.md.
# =============================================================================
scaffold_corner_design:

  # ==========================================================================
  - section: entities
    instances:

      - name: customer_creation_returns_201_with_system_fields_and_defaults
        claim_type: Creation
        grounds: ["entities.Customer", "entities.Customer.fields.credit_hold", "endpoints[POST /customers]"]
        distinguishing_aspect: "POST /customers with name and code alone returns 201 with a server-minted id, created_at, updated_at, version 1 and credit_hold false."
        test_recipe:
          setup: ["Empty database; logical clock pinned to 2026-09-01T00:00:00Z."]
          setup_api_calls:
            - { call: "POST /_clock/set_current_utc", payload: { to_iso8601: "2026-09-01T00:00:00Z" }, as: PlantAdmin }
          trigger:
            - { call: "POST /customers", payload: { name: "Acme Controls", code: "ACME" }, as: PlantAdmin, captures: { cust_id: $.data.id } }
          assert:
            - "the response status is 201 and response_type == object"
            - "Customer.${cust_id}.credit_hold == false"
            - "Customer.${cust_id}.version == 1"
            - "Customer.${cust_id}.id is a UUID with no type prefix"

      - name: press_retrieval_returns_stored_and_computed_fields
        claim_type: Retrieval
        grounds: ["entities.Press", "entities.Press.fields.committed_minutes_scheduled", "entities.Press.fields.status"]
        distinguishing_aspect: "GET /presses/{id} echoes every input field and reports status AVAILABLE with committed_minutes_scheduled 0 for a freshly created press."
        test_recipe:
          setup: ["One press P-150 exists, 150 tons, 400 g shot size, 7200 cents/hour."]
          setup_api_calls:
            - { call: "POST /_clock/set_current_utc", payload: { to_iso8601: "2026-09-01T00:00:00Z" }, as: PlantAdmin }
            - { call: "POST /presses", payload: { press_code: "P-150", tonnage: 150, shot_size_grams_max: 400, hourly_rate_cents: 7200 }, as: PlantAdmin, captures: { p_id: $.data.id } }
          trigger:
            - { call: "GET /presses/${p_id}", payload: {}, as: ProcessEngineer }
          assert:
            - "the response status is 200"
            - "Press.${p_id}.tonnage == 150 and Press.${p_id}.hourly_rate_cents == 7200"
            - "Press.${p_id}.status == AVAILABLE and Press.${p_id}.committed_minutes_scheduled == 0"

      - name: mold_listing_paginates_with_total_count_and_has_more
        claim_type: Listing
        grounds: ["entities.Mold", "endpoints[GET /molds]", "response_envelope.pagination_fields"]
        distinguishing_aspect: "GET /molds with limit 2 and offset 1 over three molds returns exactly one page item, total_count 3 and has_more false."
        test_recipe:
          setup: ["Customer ACME with three molds M-A, M-B and M-C created in that order."]
          setup_api_calls:
            - { call: "POST /_clock/set_current_utc", payload: { to_iso8601: "2026-09-01T00:00:00Z" }, as: PlantAdmin }
            - { call: "POST /customers", payload: { name: "Acme Controls", code: "ACME" }, as: PlantAdmin, captures: { cust_id: $.data.id } }
            - { call: "POST /molds", payload: { mold_code: "M-A", customer_id: "${cust_id}", cavity_count: 2, shot_weight_grams: 90, required_min_tonnage: 60, required_max_tonnage: 120, pm_interval_shots: 5000, tooling_cost_cents: 100000 }, as: PlantAdmin }
            - { call: "POST /molds", payload: { mold_code: "M-B", customer_id: "${cust_id}", cavity_count: 2, shot_weight_grams: 90, required_min_tonnage: 60, required_max_tonnage: 120, pm_interval_shots: 5000, tooling_cost_cents: 100000 }, as: PlantAdmin }
            - { call: "POST /molds", payload: { mold_code: "M-C", customer_id: "${cust_id}", cavity_count: 2, shot_weight_grams: 90, required_min_tonnage: 60, required_max_tonnage: 120, pm_interval_shots: 5000, tooling_cost_cents: 100000 }, as: PlantAdmin }
          trigger:
            - { call: "GET /molds", payload: { limit: 2, offset: 1 }, as: PlantAdmin }
          assert:
            - "the response status is 200 and response_type == array"
            - "total_count == 3 and has_more == false"
            - "the returned array contains exactly 2 Mold rows"

      - name: mold_get_with_unknown_id_returns_mold_not_found
        claim_type: Not Found
        grounds: ["errors[ERR_MOLD_NOT_FOUND]", "validations[priority=3]"]
        distinguishing_aspect: "GET /molds/{id} for a well-formed UUID that was never minted returns 404 ERR_MOLD_NOT_FOUND, not a 500 or an empty 200."
        test_recipe:
          setup: ["Empty database."]
          setup_api_calls:
            - { call: "POST /_clock/set_current_utc", payload: { to_iso8601: "2026-09-01T00:00:00Z" }, as: PlantAdmin }
          trigger:
            - { call: "GET /molds/00000000-0000-4000-8000-000000000000", payload: {}, as: PlantAdmin, captures: { err_id: $.data.error_id } }
          assert:
            - "the response status is 404 and ${err_id} == ERR_MOLD_NOT_FOUND"

      - name: production_job_get_with_unknown_id_returns_job_not_found
        claim_type: Not Found
        grounds: ["errors[ERR_JOB_NOT_FOUND]", "validations[priority=3]"]
        distinguishing_aspect: "Each resource family reports its own 404 code: an unknown ProductionJob id returns ERR_JOB_NOT_FOUND, never the generic mold code."
        test_recipe:
          setup: ["Empty database."]
          setup_api_calls:
            - { call: "POST /_clock/set_current_utc", payload: { to_iso8601: "2026-09-01T00:00:00Z" }, as: PlantAdmin }
          trigger:
            - { call: "GET /production-jobs/00000000-0000-4000-8000-000000000001", payload: {}, as: ProcessEngineer, captures: { err_id: $.data.error_id } }
          assert:
            - "the response status is 404 and ${err_id} == ERR_JOB_NOT_FOUND"

      - name: mold_create_without_cavity_count_returns_invalid_request
        claim_type: Required Fields
        grounds: ["entities.Mold.fields.cavity_count", "errors[ERR_INVALID_REQUEST]", "validations[priority=4]"]
        distinguishing_aspect: "cavity_count has source input and no default, so omitting it returns 400 ERR_INVALID_REQUEST and no Mold row is created."
        test_recipe:
          setup: ["Customer ACME exists."]
          setup_api_calls:
            - { call: "POST /_clock/set_current_utc", payload: { to_iso8601: "2026-09-01T00:00:00Z" }, as: PlantAdmin }
            - { call: "POST /customers", payload: { name: "Acme Controls", code: "ACME" }, as: PlantAdmin, captures: { cust_id: $.data.id } }
          trigger:
            - { call: "POST /molds", payload: { mold_code: "M-1", customer_id: "${cust_id}", shot_weight_grams: 180, required_min_tonnage: 120, required_max_tonnage: 200, pm_interval_shots: 5000, tooling_cost_cents: 2500000 }, as: PlantAdmin, captures: { err_id: $.data.error_id } }
          assert:
            - "the response status is 400 and ${err_id} == ERR_INVALID_REQUEST"
            - "GET /molds?customer_id=${cust_id} returns total_count 0"

      - name: mold_and_customer_creation_apply_declared_defaults
        claim_type: Defaults
        grounds: ["entities.Mold.fields.ownership", "entities.Mold.fields.status", "entities.Mold.fields.service_state", "entities.Customer.fields.credit_hold"]
        distinguishing_aspect: "Omitting the optional ownership field yields SHOP_OWNED, and every system-defaulted field lands on its declared value: status NEW, service_state SERVICEABLE, both shot counters 0, approved_max_regrind_bp null."
        test_recipe:
          setup: ["Customer ACME created without credit_hold."]
          setup_api_calls:
            - { call: "POST /_clock/set_current_utc", payload: { to_iso8601: "2026-09-01T00:00:00Z" }, as: PlantAdmin }
            - { call: "POST /customers", payload: { name: "Acme Controls", code: "ACME" }, as: PlantAdmin, captures: { cust_id: $.data.id } }
          trigger:
            - { call: "POST /molds", payload: { mold_code: "M-1", customer_id: "${cust_id}", cavity_count: 4, shot_weight_grams: 180, required_min_tonnage: 120, required_max_tonnage: 200, pm_interval_shots: 5000, tooling_cost_cents: 2500000 }, as: PlantAdmin, captures: { mold_id: $.data.id } }
          assert:
            - "Mold.${mold_id}.ownership == SHOP_OWNED"
            - "Mold.${mold_id}.status == NEW and Mold.${mold_id}.service_state == SERVICEABLE"
            - "Mold.${mold_id}.total_shot_count == 0 and Mold.${mold_id}.shots_since_pm == 0"
            - "Mold.${mold_id}.approved_max_regrind_bp == null and Mold.${mold_id}.interim_expiry_shots == null and Mold.${mold_id}.active_transfer_id == null"
            - "Customer.${cust_id}.credit_hold == false"

      - name: quote_price_fields_are_computed_and_null_before_pricing
        claim_type: Computed Fields
        grounds: ["entities.Quote.fields.quoted_piece_price_cents", "entities.Quote.fields.margin_bp", "entities.Quote.fields.rate_press_id", "state_machines.Quote.DRAFT_to_PRICED"]
        distinguishing_aspect: "A DRAFT Quote reports quoted_piece_price_cents, quoted_lot_price_cents, margin_bp and rate_press_id as null; only POST /quotes/{id}/price fills them."
        test_recipe:
          setup: ["Customer ACME, press P-150 and mold M-1 exist; a DRAFT quote has been created against them."]
          setup_api_calls:
            - { call: "POST /_clock/set_current_utc", payload: { to_iso8601: "2026-09-01T00:00:00Z" }, as: PlantAdmin }
            - { call: "POST /customers", payload: { name: "Acme Controls", code: "ACME" }, as: PlantAdmin, captures: { cust_id: $.data.id } }
            - { call: "POST /presses", payload: { press_code: "P-150", tonnage: 150, shot_size_grams_max: 400, hourly_rate_cents: 7200 }, as: PlantAdmin, captures: { p150_id: $.data.id } }
            - { call: "POST /molds", payload: { mold_code: "M-1", customer_id: "${cust_id}", cavity_count: 4, shot_weight_grams: 180, required_min_tonnage: 120, required_max_tonnage: 200, pm_interval_shots: 5000, tooling_cost_cents: 2500000, ownership: "SHOP_OWNED" }, as: PlantAdmin, captures: { mold_id: $.data.id } }
            - { call: "POST /quotes", payload: { customer_id: "${cust_id}", mold_id: "${mold_id}", part_weight_grams: 32, cycle_time_sec: 38, cavitation: 4, resin_grade: "PP-H", resin_price_cents_per_kg: 210, annual_volume: 120000 }, as: SalesEngineer, captures: { quote_id: $.data.id } }
          trigger:
            - { call: "GET /quotes/${quote_id}", payload: {}, as: SalesEngineer }
            - { call: "POST /quotes/${quote_id}/price", payload: { press_id: "${p150_id}" }, as: SalesEngineer }
          assert:
            - "before the price call Quote.${quote_id}.status == DRAFT, quoted_piece_price_cents == null, quoted_lot_price_cents == null, margin_bp == null and rate_press_id == null"
            - "after the price call Quote.${quote_id}.status == PRICED, quoted_piece_price_cents == 95 and rate_press_id == ${p150_id}"

      - name: customer_create_with_client_supplied_id_returns_invalid_request
        claim_type: System Fields
        grounds: ["entities.Customer", "errors[ERR_INVALID_REQUEST]", "validations[priority=4]"]
        distinguishing_aspect: "id, created_at, updated_at and version are server-minted; a body carrying an id key is not silently ignored but rejected with 400 ERR_INVALID_REQUEST because it is not a declared input field."
        test_recipe:
          setup: ["Empty database."]
          setup_api_calls:
            - { call: "POST /_clock/set_current_utc", payload: { to_iso8601: "2026-09-01T00:00:00Z" }, as: PlantAdmin }
          trigger:
            - { call: "POST /customers", payload: { name: "Acme Controls", code: "ACME", id: "11111111-1111-4111-8111-111111111111" }, as: PlantAdmin, captures: { err_id: $.data.error_id } }
          assert:
            - "the response status is 400 and ${err_id} == ERR_INVALID_REQUEST"

      - name: mold_create_with_unknown_ownership_enum_returns_invalid_request
        claim_type: Type Constraints
        grounds: ["entities.Mold.fields.ownership", "errors[ERR_INVALID_REQUEST]", "validations[priority=4]"]
        distinguishing_aspect: "ownership accepts only SHOP_OWNED or CUSTOMER_OWNED; the value LEASED is rejected with 400 ERR_INVALID_REQUEST."
        test_recipe:
          setup: ["Customer ACME exists."]
          setup_api_calls:
            - { call: "POST /_clock/set_current_utc", payload: { to_iso8601: "2026-09-01T00:00:00Z" }, as: PlantAdmin }
            - { call: "POST /customers", payload: { name: "Acme Controls", code: "ACME" }, as: PlantAdmin, captures: { cust_id: $.data.id } }
          trigger:
            - { call: "POST /molds", payload: { mold_code: "M-1", customer_id: "${cust_id}", cavity_count: 4, shot_weight_grams: 180, required_min_tonnage: 120, required_max_tonnage: 200, pm_interval_shots: 5000, tooling_cost_cents: 2500000, ownership: "LEASED" }, as: PlantAdmin, captures: { err_id: $.data.error_id } }
          assert:
            - "the response status is 400 and ${err_id} == ERR_INVALID_REQUEST"

      - name: production_job_create_with_start_after_end_is_rejected
        claim_type: Type Constraints
        grounds: ["errors[ERR_INVALID_WINDOW]", "validations[priority=5]", "entities.ProductionJob.fields.scheduled_end"]
        distinguishing_aspect: "The window-ordering rule at priority 5 fires before any FK existence check, so a job whose scheduled_start is after its scheduled_end returns 400 ERR_INVALID_WINDOW."
        test_recipe:
          setup: ["A fully approved quote exists on mold M-1 and press P-150 (see the standard approval chain)."]
          setup_api_calls:
            - { call: "POST /_clock/set_current_utc", payload: { to_iso8601: "2026-09-01T00:00:00Z" }, as: PlantAdmin }
            - { call: "POST /customers", payload: { name: "Acme Controls", code: "ACME" }, as: PlantAdmin, captures: { cust_id: $.data.id } }
            - { call: "POST /presses", payload: { press_code: "P-150", tonnage: 150, shot_size_grams_max: 400, hourly_rate_cents: 7200 }, as: PlantAdmin, captures: { p150_id: $.data.id } }
            - { call: "POST /molds", payload: { mold_code: "M-1", customer_id: "${cust_id}", cavity_count: 4, shot_weight_grams: 180, required_min_tonnage: 120, required_max_tonnage: 200, pm_interval_shots: 5000, tooling_cost_cents: 2500000, ownership: "SHOP_OWNED" }, as: PlantAdmin, captures: { mold_id: $.data.id } }
            - { call: "POST /press-qualifications", payload: { mold_id: "${mold_id}", press_id: "${p150_id}" }, as: ProcessEngineer, captures: { pq_id: $.data.id } }
            - { call: "POST /press-qualifications/${pq_id}/schedule-run-at-rate", payload: { scheduled_start: "2026-09-02T08:00:00Z", scheduled_end: "2026-09-02T12:00:00Z", target_parts_per_hour: 400 }, as: ProcessEngineer }
            - { call: "POST /press-qualifications/${pq_id}/record-run-at-rate", payload: { actual_parts_per_hour: 380 }, as: QualityEngineer }
            - { call: "POST /quotes", payload: { customer_id: "${cust_id}", mold_id: "${mold_id}", part_weight_grams: 32, cycle_time_sec: 38, cavitation: 4, resin_grade: "PP-H", resin_price_cents_per_kg: 210, annual_volume: 120000 }, as: SalesEngineer, captures: { quote_id: $.data.id } }
            - { call: "POST /quotes/${quote_id}/price", payload: { press_id: "${p150_id}" }, as: SalesEngineer }
            - { call: "POST /quotes/${quote_id}/submit", payload: {}, as: SalesEngineer }
            - { call: "GET /molds/${mold_id}", payload: {}, as: SalesEngineer, captures: { mold_v1: $.data.version } }
            - { call: "POST /quotes/${quote_id}/customer-decision", payload: { decision: "ACCEPT", expected_mold_version: "${mold_v1}" }, as: CustomerRep, as_user_id: "${cust_id}" }
            - { call: "POST /ppap-submissions", payload: { mold_id: "${mold_id}", quote_id: "${quote_id}", level: 3, max_regrind_bp: 2000 }, as: QualityEngineer, as_user_id: "qe-alice", captures: { ppap_id: $.data.id } }
            - { call: "POST /ppap-submissions/${ppap_id}/submit", payload: { fai_dimensional_pass: true, fai_sample_shots: 30 }, as: QualityEngineer, as_user_id: "qe-alice" }
            - { call: "POST /ppap-submissions/${ppap_id}/internal-review", payload: { decision: "ENDORSE" }, as: QualityEngineer, as_user_id: "qe-bob" }
            - { call: "GET /molds/${mold_id}", payload: {}, as: QualityEngineer, captures: { mold_v2: $.data.version } }
            - { call: "POST /ppap-submissions/${ppap_id}/customer-decision", payload: { decision: "APPROVE", expected_mold_version: "${mold_v2}" }, as: CustomerRep, as_user_id: "${cust_id}" }
          trigger:
            - { call: "POST /production-jobs", payload: { quote_id: "${quote_id}", planned_qty: 1000, scheduled_start: "2026-09-10T16:00:00Z", scheduled_end: "2026-09-10T08:00:00Z", press_id: "${p150_id}" }, as: ProcessEngineer, captures: { err_id: $.data.error_id } }
          assert:
            - "the response status is 400 and ${err_id} == ERR_INVALID_WINDOW"
            - "GET /production-jobs?quote_id=${quote_id} returns total_count 0"

      - name: mold_create_with_unknown_customer_returns_customer_not_found
        claim_type: Parent Relationships
        grounds: ["entities.Mold.fields.customer_id", "errors[ERR_CUSTOMER_NOT_FOUND]", "validations[priority=6]"]
        distinguishing_aspect: "The flat topology validates body foreign keys: a mold whose customer_id names no Customer returns 404 ERR_CUSTOMER_NOT_FOUND at priority 6, after body shape validation has already passed."
        test_recipe:
          setup: ["Empty database apart from the logical clock."]
          setup_api_calls:
            - { call: "POST /_clock/set_current_utc", payload: { to_iso8601: "2026-09-01T00:00:00Z" }, as: PlantAdmin }
          trigger:
            - { call: "POST /molds", payload: { mold_code: "M-1", customer_id: "00000000-0000-4000-8000-0000000000ff", cavity_count: 4, shot_weight_grams: 180, required_min_tonnage: 120, required_max_tonnage: 200, pm_interval_shots: 5000, tooling_cost_cents: 2500000 }, as: PlantAdmin, captures: { err_id: $.data.error_id } }
          assert:
            - "the response status is 404 and ${err_id} == ERR_CUSTOMER_NOT_FOUND"

  # ==========================================================================
  - section: state_machines
    instances:

      - name: newly_created_rows_start_in_their_declared_initial_states
        claim_type: Initial State
        grounds: ["state_machines.Quote.status", "state_machines.Mold.status", "state_machines.Mold.service_state", "state_machines.PressQualification.status", "state_machines.ResinLot.status"]
        distinguishing_aspect: "A fresh Quote is DRAFT, a fresh Mold is NEW plus SERVICEABLE on its two axes, a fresh PressQualification is UNQUALIFIED and a fresh ResinLot is QUARANTINE."
        test_recipe:
          setup: ["Customer ACME and press P-150 exist."]
          setup_api_calls:
            - { call: "POST /_clock/set_current_utc", payload: { to_iso8601: "2026-09-01T00:00:00Z" }, as: PlantAdmin }
            - { call: "POST /customers", payload: { name: "Acme Controls", code: "ACME" }, as: PlantAdmin, captures: { cust_id: $.data.id } }
            - { call: "POST /presses", payload: { press_code: "P-150", tonnage: 150, shot_size_grams_max: 400, hourly_rate_cents: 7200 }, as: PlantAdmin, captures: { p150_id: $.data.id } }
          trigger:
            - { call: "POST /molds", payload: { mold_code: "M-1", customer_id: "${cust_id}", cavity_count: 4, shot_weight_grams: 180, required_min_tonnage: 120, required_max_tonnage: 200, pm_interval_shots: 5000, tooling_cost_cents: 2500000 }, as: PlantAdmin, captures: { mold_id: $.data.id } }
            - { call: "POST /press-qualifications", payload: { mold_id: "${mold_id}", press_id: "${p150_id}" }, as: ProcessEngineer, captures: { pq_id: $.data.id } }
            - { call: "POST /quotes", payload: { customer_id: "${cust_id}", mold_id: "${mold_id}", part_weight_grams: 32, cycle_time_sec: 38, cavitation: 4, resin_grade: "PP-H", resin_price_cents_per_kg: 210, annual_volume: 120000 }, as: SalesEngineer, captures: { quote_id: $.data.id } }
            - { call: "POST /resin-lots", payload: { resin_grade: "PP-H", supplier_lot_code: "L-01", qty_kg_received: 25, moisture_bp: 100 }, as: PlantAdmin, captures: { lot_id: $.data.id } }
          assert:
            - "Mold.${mold_id}.status == NEW and Mold.${mold_id}.service_state == SERVICEABLE"
            - "PressQualification.${pq_id}.status == UNQUALIFIED and attempt_count == 0"
            - "Quote.${quote_id}.status == DRAFT"
            - "ResinLot.${lot_id}.status == QUARANTINE and ResinLot.${lot_id}.qty_grams_remaining == 25000"

      - name: resin_lot_release_moves_quarantine_to_released
        claim_type: Valid Transition
        grounds: ["state_machines.ResinLot.QUARANTINE_to_RELEASED", "entities.ResinLot.fields.status"]
        distinguishing_aspect: "POST /resin-lots/{id}/disposition with decision RELEASE on a QUARANTINE lot whose moisture_bp is 120 (<= 200) moves it to RELEASED and leaves qty_grams_remaining untouched."
        test_recipe:
          setup: ["ResinLot L-01 of 25 kg received at 120 bp moisture, still QUARANTINE."]
          setup_api_calls:
            - { call: "POST /_clock/set_current_utc", payload: { to_iso8601: "2026-09-01T00:00:00Z" }, as: PlantAdmin }
            - { call: "POST /resin-lots", payload: { resin_grade: "PP-H", supplier_lot_code: "L-01", qty_kg_received: 25, moisture_bp: 120 }, as: PlantAdmin, captures: { lot_id: $.data.id } }
          trigger:
            - { call: "POST /resin-lots/${lot_id}/disposition", payload: { decision: "RELEASE" }, as: QualityEngineer }
          assert:
            - "the response status is 200 and ResinLot.${lot_id}.status == RELEASED"
            - "ResinLot.${lot_id}.qty_grams_remaining == 25000"

      - name: resin_lot_release_above_moisture_limit_is_rejected
        claim_type: Precondition Enforcement
        grounds: ["state_machines.ResinLot.QUARANTINE_to_RELEASED", "errors[ERR_RESIN_MOISTURE_TOO_HIGH]", "validations[priority=12]"]
        distinguishing_aspect: "MAX_MOISTURE_BP is 200 and the gate is <=, so a lot at 201 bp is refused with 422 ERR_RESIN_MOISTURE_TOO_HIGH while a lot at exactly 200 bp releases."
        test_recipe:
          setup: ["Two QUARANTINE lots: L-WET at 201 bp and L-EDGE at exactly 200 bp."]
          setup_api_calls:
            - { call: "POST /_clock/set_current_utc", payload: { to_iso8601: "2026-09-01T00:00:00Z" }, as: PlantAdmin }
            - { call: "POST /resin-lots", payload: { resin_grade: "PP-H", supplier_lot_code: "L-WET", qty_kg_received: 25, moisture_bp: 201 }, as: PlantAdmin, captures: { wet_id: $.data.id } }
            - { call: "POST /resin-lots", payload: { resin_grade: "PP-H", supplier_lot_code: "L-EDGE", qty_kg_received: 25, moisture_bp: 200 }, as: PlantAdmin, captures: { edge_id: $.data.id } }
          trigger:
            - { call: "POST /resin-lots/${wet_id}/disposition", payload: { decision: "RELEASE" }, as: QualityEngineer, captures: { err_id: $.data.error_id } }
            - { call: "POST /resin-lots/${edge_id}/disposition", payload: { decision: "RELEASE" }, as: QualityEngineer }
          assert:
            - "the L-WET call returns status 422 and ${err_id} == ERR_RESIN_MOISTURE_TOO_HIGH"
            - "ResinLot.${wet_id}.status == QUARANTINE"
            - "the L-EDGE call returns 200 and ResinLot.${edge_id}.status == RELEASED"

      - name: quote_submit_from_draft_returns_quote_not_priced
        claim_type: Invalid Transitions
        grounds: ["state_machines.Quote.PRICED_to_SUBMITTED", "errors[ERR_QUOTE_NOT_PRICED]", "validations[priority=9]"]
        distinguishing_aspect: "Only PRICED -> SUBMITTED is declared, so submitting a DRAFT quote returns 409 ERR_QUOTE_NOT_PRICED and leaves the quote in DRAFT."
        test_recipe:
