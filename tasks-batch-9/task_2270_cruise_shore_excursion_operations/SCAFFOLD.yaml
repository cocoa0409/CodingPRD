  # ----------------------------------------------------------------- Bookings
  - method: POST
    path: /shore-excursions/bookings
    description: "Book seats on a departure for a guest. Screens age, mobility, medical and language eligibility, prices the booking once, and consumes seats from the booking's own channel bucket. Optimistically concurrent on the departure's version."
    roles: [Guest, ShoreExcursionDesk]
    success_code: 201
    input:
      - departure_id
      - guest_id
      - party_size
      - channel
      - language_choice
      - expected_departure_version
      - medical_warning_acknowledged?
    output: Booking
    side_effects:
      - "rejected with ERR_STALE_DEPARTURE_VERSION (412) when expected_departure_version does not equal the departure's current version"
      - "age_at_meeting, mobility, medical acknowledgement and language screened per calculations.guest_eligibility_screen"
      - "per_guest_price_cents, quoted_total_cents, service_fee_cents and charge_total_cents frozen per calculations.booking_price_quote and never re-quoted"
      - "party_size seats consumed from the booking's channel bucket; precruise_sold_seats or onboard_sold_seats and seats_available_total updated; increments ExcursionDeparture.version by 1"
      - "Booking created with fulfillment_status BOOKED, financial_status AUTHORIZED, alternative_offer_status NONE, return_guarantee_honored true, commission_accrued_cents 0"
  - method: GET
    path: /shore-excursions/bookings/{bookingId}
    description: "Read one booking with both state dimensions and every money figure. A Guest caller may only read their own bookings."
    roles: [Guest, ShoreExcursionDesk, ExcursionManager, RiskOfficer, FinanceController]
    success_code: 200
    input: []
    output: Booking
    side_effects: []
  - method: GET
    path: /shore-excursions/bookings
    description: "List bookings, filterable by departure, guest, offered alternative departure, both state dimensions and channel."
    roles: [Guest, ShoreExcursionDesk, ExcursionManager, RiskOfficer, FinanceController]
    success_code: 200
    input:
      - departure_id?
      - guest_id?
      - alternative_departure_id?
      - fulfillment_status?
      - financial_status?
      - channel?
      - limit?
      - offset?
    output: Booking[]
    side_effects: []
  - method: POST
    path: /shore-excursions/bookings/{bookingId}/fulfillment-actions
    description: "Drive the booking fulfillment dimension. Actions: TICKET, CHECK_IN, MARK_NO_SHOW."
    roles: [ShoreExcursionDesk]
    success_code: 200
    input:
      - action
      - note?
    output: Booking
    side_effects:
      - "TICKET moves fulfillment BOOKED -> TICKETED and financial AUTHORIZED -> CHARGED, and sets commission_accrued_cents on the PROVISIONAL variant; refused when the operator is no longer APPROVED"
      - "CHECK_IN moves TICKETED -> CHECKED_IN only inside [meeting_time_utc - 45 minutes, meeting_time_utc + 10 minutes] and only while the call is IN_PORT"
      - "MARK_NO_SHOW moves TICKETED -> NO_SHOW, financial CHARGED -> RETAINED, appends a RETENTION ledger entry for the whole charge, re-rates the line at min(commission_rate_bps, 500), and does NOT return the seats"
      - "increments Booking.version by 1"
  - method: POST
    path: /shore-excursions/bookings/{bookingId}/cancel
    description: "Guest-initiated cancellation. The refund tier is chosen from the minutes remaining to the meeting time; only the top tier returns the service fee."
    roles: [Guest, ShoreExcursionDesk]
    success_code: 200
    input:
      - reason_code?
    output: Booking
    side_effects:
      - "fulfillment BOOKED or TICKETED -> CANCELLED_BY_GUEST"
      - "financial follows calculations.guest_refund_settlement GUEST_INITIATED: AUTHORIZED -> VOIDED, or CHARGED -> REFUNDED / PARTIALLY_REFUNDED / RETAINED by tier"
      - "a REFUND, AUTH_VOID or RETENTION ledger entry is appended with basis GUEST_INITIATED"
      - "commission_accrued_cents re-accrued on the surviving net basis"
      - "party_size seats returned to the booking's own channel bucket, or to the onboard bucket when the pre-cruise release has already happened; increments ExcursionDeparture.version by 1"
      - "increments Booking.version by 1"
  - method: POST
