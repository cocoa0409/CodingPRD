              as: Appraiser
            - call: "POST /consignments/${cg}/decision"
              payload: { outcome: "ACCEPT" }
              as: AuctionStaff
            - call: "POST /lots"
              payload: { consignment_id: "${cg}", auction_id: "${au}", title: "L1", category: "ART", reserve_cents: 0, starting_bid_cents: 100001, estimate_low_cents: 100000, estimate_high_cents: 200000, lot_number: 1 }
              as: AuctionStaff
              captures: { lot1: "$.data.id" }
            - call: "POST /lots"
              payload: { consignment_id: "${cg}", auction_id: "${au}", title: "L2", category: "ART", reserve_cents: 0, starting_bid_cents: 100001, estimate_low_cents: 100000, estimate_high_cents: 200000, lot_number: 2 }
              as: AuctionStaff
              captures: { lot2: "$.data.id" }
            - call: "POST /auctions/${au}/open"
              payload: {}
              as: AuctionStaff
            - call: "POST /lots/${lot1}/open"
              payload: {}
              as: AuctionStaff
              captures: { lot1_v: "$.data.version" }
            - call: "POST /lots/${lot2}/open"
              payload: {}
              as: AuctionStaff
              captures: { lot2_v: "$.data.version" }
            - call: "POST /bidders"
              payload: { display_name: "Buyer", email: "b@x.com", paddle_number: "P1", deposit_cents: 0 }
              as: AuctionStaff
              captures: { bd: "$.data.id" }
            - call: "POST /lots/${lot1}/bids"
              payload: { bidder_id: "${bd}", bid_type: "LIVE", amount_cents: 100001, expected_lot_version: "${lot1_v}" }
              as: Bidder
              as_user_id: "${bd}"
            - call: "POST /lots/${lot2}/bids"
              payload: { bidder_id: "${bd}", bid_type: "LIVE", amount_cents: 100001, expected_lot_version: "${lot2_v}" }
