            - "Parcel.${parcel_noimp_id}.soil_quality_score == 75.00"
            - "the difference is exactly 9.00 points"
            - "both parcels have development_pressure_score == 78.00, so the two scores are independent"
            - "Parcel.${parcel_noimp_id}.status == ELIGIBLE"

      - name: admin_fee_tier_flips_at_exactly_twenty_five_million_cents_so_a_one_cent_higher_price_costs_less
        claim_type: Constants Applied
        grounds:
