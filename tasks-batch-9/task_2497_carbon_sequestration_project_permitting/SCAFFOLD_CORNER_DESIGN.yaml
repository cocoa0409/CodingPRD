              captures: { plan_id: $.data.id }
            - call: "POST /ccs/monitoring-plans/${plan_id}/methods"
              payload: { domain: "SUBSURFACE", technique: "4D seismic and downhole pressure", detection_threshold_tpy: 500, frequency_per_year: 2, spatial_coverage_pct: 100 }
              as: ProjectDeveloper
              as_user_id: "developer-1"
            - call: "POST /ccs/monitoring-plans/${plan_id}/methods"
              payload: { domain: "SURFACE", technique: "soil gas flux survey", detection_threshold_tpy: 100, frequency_per_year: 4, spatial_coverage_pct: 50 }
              as: ProjectDeveloper
              as_user_id: "developer-1"
            - call: "POST /ccs/monitoring-plans/${plan_id}/submit"
              payload: { submission_note: "MRV plan for review" }
              as: ProjectDeveloper
              as_user_id: "developer-1"
              captures: { cov: $.data.coverage_score, atm_sub: $.data.atmospheric_subscore }
            - call: "POST /ccs/monitoring-plans/${plan_id}/review"
              payload: { decision: "COMPLETE_TECHNICAL_REVIEW", review_note: "technical track done" }
              as: RegulatoryReviewer
              as_user_id: "reviewer-1"
            - call: "POST /ccs/monitoring-plans/${plan_id}/review"
              payload: { decision: "COMPLETE_PUBLIC_COMMENT", review_note: "comment period closed" }
