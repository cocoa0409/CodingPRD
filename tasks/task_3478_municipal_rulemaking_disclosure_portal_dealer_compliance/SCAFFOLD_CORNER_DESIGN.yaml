  # =====================================================================
  # Section: validations
  # =====================================================================
  - section: validations
    instances:
      - name: missing_auth_headers_returns_unauthenticated
        claim_type: violation_to_error
        grounds:
          - validations[priority=1]
          - errors[ERR_UNAUTHENTICATED]
        distinguishing_aspect: "A request without X-User-Role / X-User-ID headers is rejected 401 ERR_UNAUTHENTICATED before any role check."
        test_recipe:
          setup: ["One proposal exists so the list is non-trivial."]
          setup_api_calls:
            - call: "POST /msrb/rule-proposals"
              payload: { rule_code: "G-300", title: "Auth rule", body: "a", category: "DISCLOSURE" }
              as: RulemakingOfficer
              as_user_id: officer-1
          trigger:
            - call: "GET /msrb/rule-proposals"
              payload: {}
              as: PublicReader
              captures: { err: $.data.error_id }
          assert:
            - "${err} == ERR_UNAUTHENTICATED"
            - "HTTP status == 401 (headers X-User-Role and X-User-ID omitted by the test harness)"
      - name: comment_state_vs_temporal_priority
        claim_type: priority_ordering
        grounds:
          - validations[priority=8]
          - validations[priority=13]
        excluded_because:
          difficulty_instance: comment_state_gate_beats_window_temporal
          rationale: "The (state, business_temporal) dual-failure ordering is asserted there."
      - name: referential_vs_fiscal_priority
        claim_type: priority_ordering
        grounds:
          - validations[priority=19]
          - validations[priority=23]
        excluded_because:
          difficulty_instance: solicitation_type_gate_beats_fee_cap
          rationale: "The (business_referential, business_fiscal) dual-failure ordering is asserted there."
      - name: regulator_deciding_own_submission_returns_segregation
        claim_type: violation_to_error
        grounds:
          - validations[priority=6]
          - errors[ERR_SEGREGATION_OF_DUTIES]
        distinguishing_aspect: "Segregation of duties on decide: a Regulator whose X-User-ID equals the proposal's submitted_by_user_id is rejected 403 even though the role is correct."
        test_recipe:
          setup: ["Proposal G-301 submitted by officer-1 after a 21-day comment window."]
          setup_api_calls:
            - call: "POST /msrb/rule-proposals"
              payload: { rule_code: "G-301", title: "SoD rule", body: "s", category: "DEALER_CONDUCT" }
              as: RulemakingOfficer
              as_user_id: officer-1
              captures: { p_id: $.data.id }
            - call: "POST /msrb/rule-proposals/${p_id}/open-comment-period"
              payload: { comment_period_days: 21 }
              as: RulemakingOfficer
              as_user_id: officer-1
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-09-22T00:00:00Z" }
              as: SystemAdmin
            - call: "POST /msrb/rule-proposals/${p_id}/submit-for-approval"
              payload: {}
              as: RulemakingOfficer
              as_user_id: officer-1
          trigger:
            - call: "POST /msrb/rule-proposals/${p_id}/decide"
              payload: { decision: "APPROVE" }
              as: Regulator
              as_user_id: officer-1
              captures: { err: $.data.error_id }
          assert:
            - "${err} == ERR_SEGREGATION_OF_DUTIES"
      - name: closing_own_referral_returns_segregation
        claim_type: violation_to_error
        grounds:
          - validations[priority=6]
          - errors[ERR_SEGREGATION_OF_DUTIES]
          - state_machines.EnforcementReferral.REFERRED_to_CLOSED_NO_ACTION
        distinguishing_aspect: "Segregation of duties on referral close: the creating officer (co-1) cannot close; a second officer (co-2) can — the identical payload succeeds under a different closer."
        test_recipe:
          setup: ["An EFFECTIVE rule G-302; a dealer org; a REFERRED referral created by co-1."]
          setup_api_calls:
            - call: "POST /msrb/organizations"
              payload: { org_code: "BD-3002", name: "Dealer SoD", org_type: "BROKER_DEALER" }
              as: PortalOperator
              captures: { org_d: $.data.id }
            - call: "POST /msrb/rule-proposals"
              payload: { rule_code: "G-302", title: "Close SoD rule", body: "s", category: "DEALER_CONDUCT" }
              as: RulemakingOfficer
              as_user_id: officer-1
              captures: { p_id: $.data.id }
            - call: "POST /msrb/rule-proposals/${p_id}/open-comment-period"
              payload: { comment_period_days: 21, expedited: true }
              as: RulemakingOfficer
              as_user_id: officer-1
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-09-22T00:00:00Z" }
              as: SystemAdmin
            - call: "POST /msrb/rule-proposals/${p_id}/submit-for-approval"
              payload: {}
              as: RulemakingOfficer
              as_user_id: officer-1
            - call: "POST /msrb/rule-proposals/${p_id}/decide"
              payload: { decision: "APPROVE" }
              as: Regulator
              as_user_id: regulator-1
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-10-02T00:00:00Z" }
              as: SystemAdmin
            - call: "POST /msrb/enforcement-referrals"
              payload: { rule_code: "G-302", violation_summary: "wash trades", subject_org_id: "${org_d}" }
              as: ComplianceOfficer
              as_user_id: co-1
              captures: { ref: $.data.id }
            - call: "POST /msrb/enforcement-referrals/${ref}/advance"
              payload: { to_state: "REFERRED" }
              as: ComplianceOfficer
              as_user_id: co-1
          trigger:
            - call: "POST /msrb/enforcement-referrals/${ref}/advance"
              payload: { to_state: "CLOSED_NO_ACTION", closure_notes: "unsubstantiated" }
              as: ComplianceOfficer
              as_user_id: co-1
              captures: { err: $.data.error_id }
            - call: "POST /msrb/enforcement-referrals/${ref}/advance"
              payload: { to_state: "CLOSED_NO_ACTION", closure_notes: "unsubstantiated" }
              as: ComplianceOfficer
              as_user_id: co-2
              captures: { st: $.data.status }
          assert:
            - "${err} == ERR_SEGREGATION_OF_DUTIES"
            - "${st} == CLOSED_NO_ACTION"
      - name: trade_executed_in_future_returns_trade_time_invalid
