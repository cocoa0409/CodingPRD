              captures: { req: "$.data.id" }
            - call: POST /grain-inspection/samples
              as: SupervisingInspector
              payload: { inspection_request_id: "${req}", sampling_device_id: "${probe}", inspector_id: "${insp}", seal_number: "SEAL-IMM", portions_count: 4 }
              captures: { smp: "$.data.id" }
