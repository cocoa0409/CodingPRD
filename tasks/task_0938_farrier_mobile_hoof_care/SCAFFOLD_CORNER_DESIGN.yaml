            - call: "POST /vet-prescriptions"
              payload: { lameness_case_id: "${lc1}", issued_on: "2026-05-04", expires_on: "2026-06-30", limb_scope: ["LF"], prescribed_cycle_weeks: 4 }
              as: Veterinarian
              captures: { rx1: "$.data.id" }
            - call: "POST /vet-prescriptions"
              payload: { lameness_case_id: "${lc1}", issued_on: "2026-05-04", expires_on: "2026-06-30", limb_scope: ["RF"], prescribed_cycle_weeks: 2 }
