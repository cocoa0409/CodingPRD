  # ===========================================================================
  # Rule 7: cross_entity_state_dependency — different entity pairs.
  # ===========================================================================
  - rule_id: cross_entity_state_dependency
    instances:
      - name: pip_issue_requires_concern_accepted
        grounds:
          - state_machines.PerformanceImprovementPlan.DRAFT_to_ISSUED
          - state_machines.PerformanceConcern
        distinguishing_aspect: |
          Entity pair: PerformanceImprovementPlan -> PerformanceConcern.
          PIP.issue is blocked unless the referenced PerformanceConcern is
          in ACCEPTED status. A DRAFT or REJECTED_INSUFFICIENT concern
          yields ERR_CONCERN_NOT_ACCEPTED even when every other
          precondition (template PUBLISHED, OCC version, active-PIP
          uniqueness) is satisfied.
        test_recipe:
          setup:
            - "Concern C1 in SUBMITTED (not yet ACCEPTED)"
            - "PIP P1 created referencing C1 — note: PIP creation does NOT require ACCEPTED at create time; only issue does. (Create may still proceed because the FK resolves; the state filter fires at issue.)"
          setup_api_calls:
            - call: "POST /hr-org-units"
              payload: { name: "OU1" }
              as: HRSystemAdmin
              captures: { ou_id: $.data.id }
            - call: "POST /hr-org-units/${ou_id}/employees"
