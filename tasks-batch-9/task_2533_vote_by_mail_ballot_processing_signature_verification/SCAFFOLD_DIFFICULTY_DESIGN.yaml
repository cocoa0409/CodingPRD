        grounds:
          - state_machines.ReturnEnvelope.NONE_to_CHALLENGED
          - state_machines.ReturnEnvelope.CHALLENGED_to_OVERRULED
          - state_machines.ReturnEnvelope.SEALED_to_SEQUESTERED
          - state_machines.ReturnEnvelope.SEQUESTERED_to_SEALED
          - entities.ReturnEnvelope.fields.signature_status
          - entities.ReturnEnvelope.fields.custody_status
          - entities.ReturnEnvelope.fields.challenge_status
        distinguishing_aspect: |
          Non-linearity here is PARALLEL dimensions on one ReturnEnvelope row: signature_status,
          custody_status and challenge_status advance independently, and the challenge dimension drives
          custody SEALED -> SEQUESTERED -> SEALED without ever touching the already-ACCEPTED signature
          dimension. This is a different entity and a different non-linear shape from the CureNotice cycle.
