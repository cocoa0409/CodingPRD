scenario: |
  Usage-Based Observability Billing, Host Attribution & Log Retention (Datadog): billing
  across infrastructure hosts, custom metrics, log events, traces and synthetic tests with
  distinct meters, host attribution for containers and serverless workloads where instance
  counts fluctuate by the minute, high-water-mark and percentile billing rules that
  determine the charged host count in a month, log ingestion versus indexing separation
  with retention tiers and exclusion filters to control cost, custom metric cardinality
  explosions with detection and remediation, commitment contracts with on-demand overage
  rates, usage attribution to internal teams for chargeback with tagging governance,
  alerting and monitor limits interacting with plan tiers.

domain_name: observability-billing
api_prefix: /api

complexity_profile:
  primary_archetype: pricing_engine
  secondary_archetype: ledger_reconciliation
  complexity_layers:
    - dual_variant_calculation
    - rate_threshold_triggers
    - derived_field_reconciliation
    - optimistic_concurrency
    - cascading_side_effects
  entity_topology: hybrid
  state_machine_shape: cyclic
  relationship_patterns:
    - one_to_many
    - cross_aggregate
    - polymorphic
  role_model: peer_roles
  consistency_model: immediate

# =============================================================================
# §1.0 Response Envelope (FIXED)
# =============================================================================
response_envelope:
  success: |
    { "meta": { "api_request_id": "req_xxx", "api_request_timestamp": "ISO8601" },
      "response_type": "object" | "array", "data": {} }
  error: |
    { "meta": { ... }, "response_type": "error",
      "data": { "error_id": "ERR_XXX", "message": "..." } }
  pagination_fields: ["limit", "offset", "total_count", "has_more"]
  pagination_defaults: { limit: 10, min: 1, max: 100, offset: 0 }

# =============================================================================
# Table 1: Entity-Relationship Table
# =============================================================================
entities:
  - name: BillingAccount
    parent: null
    common_fields: true
    fields:
      - { name: name, type: string, source: input, description: "Account display name" }
      - { name: plan_tier, type: enum, source: input, description: "FREE | PRO | ENTERPRISE — gates monitor count and meter rates" }
      - { name: billing_cycle_anchor_day, type: integer, source: input, description: "Day-of-month (1..28) at which each BillingPeriod opens" }
      - { name: standing, type: enum, source: system, default: "GOOD", description: "GOOD | DELINQUENT — set when an invoice stays UNPAID past grace" }
      - { name: version, type: integer, source: system, description: "Optimistic concurrency version" }

  - name: PlanTierConfig
    parent: null
    common_fields: true
    fields:
      - { name: plan_tier, type: enum, source: input, description: "FREE | PRO | ENTERPRISE — matches BillingAccount.plan_tier; unique" }
      - { name: max_monitors, type: integer, source: input, description: "Hard cap on ACTIVE monitors; FREE=5, PRO=50, ENTERPRISE=500" }
      - { name: included_custom_metrics, type: integer, source: input, description: "Cardinality units bundled at no charge before per-unit rate applies" }
      - { name: host_overage_rate_cents, type: integer, source: input, description: "Per-host on-demand rate past commitment" }
      - { name: log_ingest_rate_cents_per_gb, type: integer, source: input, description: "Per-GB ingestion rate (charged on all ingested bytes pre-filter)" }
      - { name: log_index_rate_cents_per_million, type: integer, source: input, description: "Per-million-event indexing rate (charged on indexed events post-filter)" }
      - { name: custom_metric_rate_cents_per_unit, type: integer, source: input, description: "Per cardinality unit past included quota" }
      - { name: version, type: integer, source: system, description: "Optimistic concurrency version" }

  - name: BillingPeriod
    parent: BillingAccount
    common_fields: true
    fields:
      - { name: billing_account_id, type: string, source: system, description: "FK -> BillingAccount.id" }
      - { name: period_start_utc, type: datetime, source: input, description: "Inclusive start of the period" }
      - { name: period_end_utc, type: datetime, source: input, description: "Exclusive end of the period" }
      - { name: status, type: enum, source: system, default: "OPEN", description: "OPEN -> CLOSED -> SETTLED; terminal SETTLED" }
      - { name: version, type: integer, source: system, description: "Optimistic concurrency version" }

  - name: HostHourRecord
    parent: BillingPeriod
    common_fields: true
    fields:
      - { name: billing_period_id, type: string, source: system, description: "FK -> BillingPeriod.id" }
      - { name: hour_bucket_utc, type: datetime, source: input, description: "Hour-grain timestamp, aligned to :00:00Z" }
      - { name: infra_host_count, type: integer, source: input, description: "Distinct infrastructure hosts observed that hour" }
      - { name: container_host_count, type: integer, source: input, description: "Attributed container host equivalents that hour (fluctuates by the minute; rolled up)" }
      - { name: serverless_invocation_count, type: integer, source: input, description: "Serverless invocations that hour; priced separately from hosts" }
      - { name: version, type: integer, source: system, description: "Optimistic concurrency version" }

  - name: MeterAccumulator
    parent: BillingPeriod
    common_fields: true
    fields:
      - { name: billing_period_id, type: string, source: system, description: "FK -> BillingPeriod.id" }
      - { name: meter, type: enum, source: input, description: "INFRA_HOST | CUSTOM_METRIC | LOG_INGEST | LOG_INDEX | TRACE | SYNTHETIC" }
      - { name: quantity, type: integer, source: computed, description: "Cumulative metered quantity in this period (units depend on meter)" }
      - { name: committed_consumed_quantity, type: integer, source: computed, description: "Portion of quantity debited against an ACTIVE commitment" }
      - { name: on_demand_quantity, type: integer, source: computed, description: "= quantity - committed_consumed_quantity" }
      - { name: version, type: integer, source: system, description: "Optimistic concurrency version" }

  - name: LogEvent
    parent: BillingPeriod
    common_fields: true
    fields:
      - { name: billing_period_id, type: string, source: system, description: "FK -> BillingPeriod.id" }
      - { name: size_bytes, type: integer, source: input, description: "Size of the raw log event in bytes" }
      - { name: service_tag, type: string, source: input, description: "Service tag used by exclusion filters and chargeback attribution" }
      - { name: ingested_at_utc, type: datetime, source: input, description: "Ingest timestamp (informational; ordering uses created_at)" }
      - { name: exclusion_state, type: enum, source: system, default: "PENDING", description: "PENDING -> INDEXED | EXCLUDED; reversible only via reindex before period close" }
      - { name: retention_tier_id, type: string, source: input, description: "FK -> RetentionTier.id; nullable when event is excluded" }
      - { name: version, type: integer, source: system, description: "Optimistic concurrency version" }

  - name: RetentionTier
    parent: BillingAccount
    common_fields: true
    fields:
      - { name: billing_account_id, type: string, source: system, description: "FK -> BillingAccount.id" }
      - { name: name, type: string, source: input, description: "Tier label" }
      - { name: retention_days, type: integer, source: input, description: "Days an indexed event remains queryable" }
      - { name: effective_from_utc, type: datetime, source: input, description: "Start of effective window (inclusive)" }
      - { name: effective_to_utc, type: datetime, source: input, description: "End of effective window (exclusive) — half-open [from, to)" }
      - { name: index_rate_multiplier_bp, type: integer, source: input, description: "Basis-point multiplier on the plan's log_index_rate (10000 = 1.0x)" }
      - { name: version, type: integer, source: system, description: "Optimistic concurrency version" }

  - name: ExclusionFilter
    parent: BillingAccount
    common_fields: true
    fields:
      - { name: billing_account_id, type: string, source: system, description: "FK -> BillingAccount.id" }
      - { name: service_tag_pattern, type: string, source: input, description: "Glob on LogEvent.service_tag" }
      - { name: sample_rate_pct, type: integer, source: input, description: "0..100; percent of MATCHED events that still get indexed (0 = exclude all matched)" }
      - { name: priority, type: integer, source: input, description: "Lower wins; ties broken by created_at ASC" }
      - { name: enabled, type: boolean, source: input, default: true, description: "Disabled filters do not match" }
      - { name: version, type: integer, source: system, description: "Optimistic concurrency version" }

  - name: CustomMetricSeries
    parent: BillingAccount
    common_fields: true
    fields:
      - { name: billing_account_id, type: string, source: system, description: "FK -> BillingAccount.id" }
      - { name: metric_name, type: string, source: input, description: "Metric identifier" }
      - { name: team_id, type: string, source: input, description: "FK -> Team.id — owner for chargeback" }
      - { name: cardinality_estimate, type: integer, source: computed, description: "Current distinct tag-value tuple count, recomputed on each RollupSnapshot" }
      - { name: status, type: enum, source: system, default: "ACTIVE", description: "ACTIVE | QUARANTINED — quarantined series stop contributing to billable cardinality" }
      - { name: version, type: integer, source: system, description: "Optimistic concurrency version" }

  - name: CardinalityIncident
    parent: CustomMetricSeries
    common_fields: true
    fields:
      - { name: custom_metric_series_id, type: string, source: system, description: "FK -> CustomMetricSeries.id" }
      - { name: opened_at_cardinality, type: integer, source: system, description: "Cardinality at incident open" }
      - { name: threshold_used, type: integer, source: system, description: "Threshold that fired" }
      - { name: status, type: enum, source: system, default: "OPEN", description: "OPEN -> TRIAGED -> REMEDIATED -> VERIFIED -> CLOSED; VERIFIED -> OPEN on recurrence" }
      - { name: remediation_note, type: string, source: input, description: "Free-text remediation description (required at REMEDIATED)" }
      - { name: version, type: integer, source: system, description: "Optimistic concurrency version" }

  - name: Commitment
    parent: BillingAccount
    common_fields: true
    fields:
      - { name: billing_account_id, type: string, source: system, description: "FK -> BillingAccount.id" }
      - { name: meter, type: enum, source: input, description: "INFRA_HOST | CUSTOM_METRIC | LOG_INGEST | LOG_INDEX | TRACE | SYNTHETIC" }
      - { name: committed_quantity, type: integer, source: input, description: "Total pre-purchased quantity for the window" }
      - { name: consumed_quantity, type: integer, source: computed, default: 0, description: "Quantity debited so far" }
      - { name: expired_quantity, type: integer, source: computed, default: 0, description: "Quantity that lapsed unused at window end" }
      - { name: window_start_utc, type: datetime, source: input, description: "Inclusive start of commitment window (closed on both ends for overlap check)" }
      - { name: window_end_utc, type: datetime, source: input, description: "Inclusive end of commitment window" }
      - { name: committed_unit_rate_cents, type: integer, source: input, description: "Pre-negotiated per-unit rate" }
      - { name: overage_unit_rate_cents, type: integer, source: input, description: "On-demand per-unit rate past commitment" }
      - { name: status, type: enum, source: system, default: "DRAFT", description: "DRAFT -> ACTIVE -> EXHAUSTED -> SETTLED; ACTIVE -> EXHAUSTED -> ACTIVE on top-up (cycle)" }
      - { name: version, type: integer, source: system, description: "Optimistic concurrency version" }

  - name: Team
    parent: BillingAccount
    common_fields: true
    fields:
      - { name: billing_account_id, type: string, source: system, description: "FK -> BillingAccount.id" }
      - { name: name, type: string, source: input, description: "Team label (chargeback bucket)" }
      - { name: cost_center, type: string, source: input, description: "Finance cost-center code" }
      - { name: version, type: integer, source: system, description: "Optimistic concurrency version" }

  - name: UsageRecord
    parent: BillingPeriod
    common_fields: true
    fields:
      - { name: billing_period_id, type: string, source: system, description: "FK -> BillingPeriod.id" }
      - { name: team_id, type: string, source: input, description: "FK -> Team.id; nullable when tag governance fails" }
      - { name: meter, type: enum, source: input, description: "INFRA_HOST | CUSTOM_METRIC | LOG_INGEST | LOG_INDEX | TRACE | SYNTHETIC" }
      - { name: quantity, type: integer, source: input, description: "Amount attributed to this team for this meter" }
      - { name: tag_compliant, type: boolean, source: computed, description: "false when required chargeback tag is missing or invalid" }
      - { name: disputed, type: boolean, source: system, default: false, description: "true while an AttributionDispute is OPEN" }
      - { name: version, type: integer, source: system, description: "Optimistic concurrency version" }

  - name: AttributionDispute
    parent: UsageRecord
    common_fields: true
    fields:
      - { name: usage_record_id, type: string, source: system, description: "FK -> UsageRecord.id" }
      - { name: raised_by_team_id, type: string, source: input, description: "FK -> Team.id; team disputing the attribution" }
      - { name: reason, type: string, source: input, description: "Dispute reason" }
      - { name: status, type: enum, source: system, default: "OPEN", description: "OPEN -> ACCEPTED | REJECTED; terminal" }
      - { name: version, type: integer, source: system, description: "Optimistic concurrency version" }

  - name: TagPolicy
    parent: BillingAccount
    common_fields: true
    fields:
      - { name: billing_account_id, type: string, source: system, description: "FK -> BillingAccount.id" }
      - { name: required_tag_key, type: string, source: input, description: "Tag key that MUST be present on every UsageRecord" }
      - { name: allowed_values, type: array, source: input, description: "Whitelist of allowed values for the required tag" }
      - { name: enforcement, type: enum, source: input, description: "WARN | BLOCK — WARN flags non-compliant UsageRecords but accepts them; BLOCK rejects them" }
      - { name: version, type: integer, source: system, description: "Optimistic concurrency version" }

  - name: Monitor
    parent: BillingAccount
    common_fields: true
    fields:
      - { name: billing_account_id, type: string, source: system, description: "FK -> BillingAccount.id" }
      - { name: name, type: string, source: input, description: "Monitor name" }
      - { name: monitor_kind, type: enum, source: input, description: "METRIC | LOG | APM | SYNTHETIC" }
      - { name: status, type: enum, source: system, default: "ACTIVE", description: "ACTIVE | MUTED | DELETED — only ACTIVE counts against plan cap" }
      - { name: version, type: integer, source: system, description: "Optimistic concurrency version" }

  - name: Invoice
    parent: BillingPeriod
    common_fields: true
    fields:
      - { name: billing_period_id, type: string, source: system, description: "FK -> BillingPeriod.id" }
      - { name: total_amount_cents, type: integer, source: computed, description: "Sum of rounded line amounts" }
      - { name: status, type: enum, source: system, default: "DRAFT", description: "DRAFT -> ISSUED -> PAID | VOID" }
      - { name: version, type: integer, source: system, description: "Optimistic concurrency version" }

  - name: InvoiceLine
    parent: Invoice
    common_fields: false
    fields:
      - { name: invoice_id, type: string, source: system, description: "FK -> Invoice.id" }
      - { name: meter, type: enum, source: input, description: "Meter charged" }
      - { name: rated_quantity, type: integer, source: input, description: "Units actually charged (committed + overage for that meter)" }
      - { name: amount_cents, type: integer, source: computed, description: "Rounded per-line amount" }

# =============================================================================
# Table 2: State Machine Table
# =============================================================================
state_machines:
  - entity: BillingPeriod
    initial_state: OPEN
    terminal_states: [SETTLED]
    transitions:
      - from: OPEN
        to: CLOSED
        trigger: "POST /billing-accounts/{id}/billing-periods/{id}/close"
        actor: BillingAdmin
        preconditions:
          - "logical clock >= period_end_utc"
          - "all OPEN CardinalityIncidents under the account are CLOSED OR waived explicitly"
        side_effects:
          - "computes final host billable count via percentile (P99) algorithm"
          - "computes provisional host billable count via high-water-mark algorithm"
          - "creates Invoice in DRAFT with one InvoiceLine per meter with non-zero quantity"
          - "for each Commitment ACTIVE in window: unconsumed -> expired_quantity; status -> SETTLED"
      - from: CLOSED
        to: SETTLED
        trigger: "POST /billing-accounts/{id}/billing-periods/{id}/settle"
        actor: BillingAdmin
        preconditions:
          - "Invoice under the period is PAID or VOID"
        side_effects:
          - "locks all UsageRecords and MeterAccumulators"

  - entity: LogEvent
    initial_state: PENDING
    terminal_states: [INDEXED, EXCLUDED]
    transitions:
      - from: PENDING
        to: INDEXED
        trigger: "system (evaluated synchronously at ingest when highest-priority enabled ExclusionFilter does NOT match, or matches with sample_rate_pct that admits the event)"
        actor: system
        preconditions: []
        side_effects:
          - "LOG_INGEST MeterAccumulator.quantity += size_bytes"
          - "LOG_INDEX MeterAccumulator.quantity += 1"
      - from: PENDING
        to: EXCLUDED
        trigger: "system (evaluated synchronously at ingest when an enabled ExclusionFilter matches AND sample_rate_pct excludes the event)"
        actor: system
        preconditions: []
        side_effects:
          - "LOG_INGEST MeterAccumulator.quantity += size_bytes (ingest is charged regardless of index state)"
      - from: EXCLUDED
        to: INDEXED
        trigger: "POST /billing-accounts/{id}/log-events/{id}/reindex"
        actor: BillingAdmin
        preconditions:
          - "parent BillingPeriod.status == OPEN"
          - "no enabled ExclusionFilter currently matches the event with sample_rate_pct == 0"
        side_effects:
          - "LOG_INDEX MeterAccumulator.quantity += 1"
          - "debits ACTIVE Commitment for meter=LOG_INDEX by 1"

  - entity: CardinalityIncident
    initial_state: OPEN
    terminal_states: [CLOSED]
    transitions:
      - from: OPEN
        to: TRIAGED
        trigger: "POST /billing-accounts/{id}/cardinality-incidents/{id}/triage"
        actor: BillingAdmin
        preconditions: []
        side_effects: []
      - from: TRIAGED
        to: REMEDIATED
        trigger: "POST /billing-accounts/{id}/cardinality-incidents/{id}/remediate"
        actor: BillingAdmin
        preconditions:
          - "remediation_note is non-empty"
        side_effects:
          - "parent CustomMetricSeries.status -> QUARANTINED"
          - "CUSTOM_METRIC MeterAccumulator stops counting this series"
      - from: REMEDIATED
        to: VERIFIED
        trigger: "system (automatic on next rollup snapshot when cardinality_estimate has been below threshold for 2 consecutive snapshots)"
        actor: system
        preconditions: []
        side_effects: []
      - from: VERIFIED
        to: CLOSED
        trigger: "POST /billing-accounts/{id}/cardinality-incidents/{id}/close"
        actor: BillingAdmin
        preconditions: []
        side_effects:
          - "parent CustomMetricSeries.status -> ACTIVE"
      - from: VERIFIED
        to: OPEN
        trigger: "system (automatic on rollup snapshot when cardinality_estimate crosses threshold again — recurrence loop)"
        actor: system
        preconditions: []
        side_effects:
          - "parent CustomMetricSeries.status -> QUARANTINED again"

  - entity: Commitment
    initial_state: DRAFT
    terminal_states: [SETTLED]
    transitions:
      - from: DRAFT
        to: ACTIVE
        trigger: "POST /billing-accounts/{id}/commitments/{id}/activate"
        actor: BillingAdmin
        preconditions:
          - "BillingAccount.standing == GOOD"
          - "no other Commitment for same billing_account_id + meter has window that overlaps [window_start_utc, window_end_utc] (closed-interval overlap)"
        side_effects: []
      - from: ACTIVE
        to: EXHAUSTED
        trigger: "system (automatic when consumed_quantity == committed_quantity)"
        actor: system
        preconditions: []
        side_effects:
          - "subsequent usage on this meter routes to on-demand pricing"
      - from: EXHAUSTED
        to: ACTIVE
        trigger: "POST /billing-accounts/{id}/commitments/{id}/top-up"
        actor: BillingAdmin
        preconditions:
          - "logical clock <= window_end_utc"
        side_effects:
          - "committed_quantity += top_up_quantity"
          - "consumption resumes against commitment"
      - from: ACTIVE
        to: SETTLED
        trigger: "system (automatic at parent BillingPeriod close when window has elapsed)"
        actor: system
        preconditions: []
        side_effects:
          - "expired_quantity = committed_quantity - consumed_quantity"
      - from: EXHAUSTED
        to: SETTLED
        trigger: "system (automatic at parent BillingPeriod close)"
        actor: system
        preconditions: []
        side_effects:
          - "expired_quantity = 0"

  - entity: AttributionDispute
    initial_state: OPEN
    terminal_states: [ACCEPTED, REJECTED]
    transitions:
      - from: OPEN
        to: ACCEPTED
        trigger: "POST /billing-accounts/{id}/attribution-disputes/{id}/accept"
        actor: BillingAdmin
        preconditions:
          - "parent UsageRecord's BillingPeriod.status == OPEN"
        side_effects:
          - "UsageRecord.disputed -> false"
          - "UsageRecord.team_id is reassigned to raised_by_team_id"
          - "chargeback rollup recompute"
      - from: OPEN
        to: REJECTED
        trigger: "POST /billing-accounts/{id}/attribution-disputes/{id}/reject"
        actor: BillingAdmin
        preconditions: []
        side_effects:
          - "UsageRecord.disputed -> false"

  - entity: Invoice
    initial_state: DRAFT
    terminal_states: [PAID, VOID]
    transitions:
      - from: DRAFT
        to: ISSUED
        trigger: "POST /billing-accounts/{id}/invoices/{id}/issue"
        actor: BillingAdmin
        preconditions: []
        side_effects: []
      - from: ISSUED
        to: PAID
        trigger: "POST /billing-accounts/{id}/invoices/{id}/pay"
        actor: BillingAdmin
        preconditions: []
        side_effects:
          - "BillingAccount.standing stays GOOD"
      - from: ISSUED
        to: VOID
        trigger: "POST /billing-accounts/{id}/invoices/{id}/void"
        actor: BillingAdmin
        preconditions: []
        side_effects: []

# =============================================================================
# §1.2.1 Concurrency Rules
# =============================================================================
concurrency_rules:
  - rule_id: commitment-activate-stale-account
    parent_entity: BillingAccount
    write_endpoint: "POST /billing-accounts/{accountId}/commitments"
    occ_field: expected_billing_account_version
    description: |
      Creating a Commitment against a BillingAccount whose version has
      advanced since the client last observed it is rejected with
      ERR_STALE_VERSION. This captures the case where a top-up or
      commitment-void has bumped the account version between the read and
      this create.
    error_id: ERR_STALE_VERSION
    http_status: 412

  - rule_id: retention-tier-create-stale-account
    parent_entity: BillingAccount
    write_endpoint: "POST /billing-accounts/{accountId}/retention-tiers"
    occ_field: expected_billing_account_version
    description: |
      Creating a RetentionTier against a BillingAccount whose version has
      advanced since the client last observed it is rejected with
      ERR_STALE_VERSION, so two RetentionTier writers cannot interleave
      effective windows without re-reading the account.
    error_id: ERR_STALE_VERSION
    http_status: 412

# =============================================================================
# Table 3: Calculation Rules Table
# =============================================================================
calculations:
  - name: host_billable_count_hwm
    trigger: "BillingPeriod close"
    algorithm: threshold
    formula: |
      # High-water-mark variant
      let hours = [HostHourRecord h where h.billing_period_id == period.id]
      if hours is empty: return 0
      return max(h.infra_host_count + h.container_host_count for h in hours)
    input_set: "HostHourRecord rows whose hour_bucket_utc falls in [period_start_utc, period_end_utc)"
    constants: {}
    precision: "integer, no rounding"
    variants:
      - name: provisional_hwm
        when: "used for the DRAFT invoice display and provisional dashboards"
        difference: "computes over the hours observed so far, ignoring tail-of-month empty hours"
      - name: final_hwm
        when: "locked at BillingPeriod close"
        difference: "computes over the full hour set; identical result if the same data was ingested"

  - name: host_billable_count_p99
    trigger: "BillingPeriod close"
    algorithm: aggregation
    formula: |
      # Percentile (P99) variant — different result for the same hours
      let hours = sorted[(h.infra_host_count + h.container_host_count)
                          for h in HostHourRecord where h.billing_period_id == period.id]
      if hours is empty: return 0
      let n = len(hours)
      let rank = ceil(0.99 * n)   # P99 index, 1-based
      return hours[rank - 1]
    input_set: "HostHourRecord rows whose hour_bucket_utc falls in [period_start_utc, period_end_utc)"
    constants:
      PERCENTILE: 99
    precision: "integer, no rounding"
    variants:
      - name: provisional_p99
        when: "preview during an OPEN period"
        difference: "computed on partial hour set; rank index computed identically"
      - name: final_p99
        when: "locked at BillingPeriod close"
        difference: "computed on full hour set"

  - name: host_charged_count_for_period
    trigger: "BillingPeriod close"
    algorithm: forward_looking
    formula: |
      # The ChargedHostCount actually billed is min(HWM, P99) — cheaper for the customer
      # but documented as the billing rule.
      return min(host_billable_count_hwm.final_hwm, host_billable_count_p99.final_p99)
    input_set: "the two computed billable counts above"
    constants: {}
    precision: "integer"
    variants: []

  - name: invoice_total_with_nested_rounding
    trigger: "Invoice ISSUE transition"
    algorithm: tiered_pricing
    formula: |
      # MODE (b): nested rounding — per-line rounding then sum (PINNED ORDER).
      # For each InvoiceLine, compute:
      #   committed_amount = round_half_up(committed_quantity * committed_unit_rate_cents)
      #   overage_amount   = round_half_up(overage_quantity * overage_unit_rate_cents)
      #   line_amount      = committed_amount + overage_amount   (per-line rounding)
      # Then:
      #   invoice.total_amount_cents = sum(line_amount for each line)
      # NOT sum-then-round. Summing the unrounded per-line values and rounding at the
      # end can differ by cents; the per-line rounding order is PINNED.
    input_set: "InvoiceLine rows for the Invoice, each carrying its committed/overage split"
    constants: {}
    precision: "integer cents, round_half_up, ROUND PER-LINE THEN SUM (pinned)"
    variants: []

  - name: overage_charge_with_commitment_tier
    trigger: "meter quantity update"
    algorithm: tiered_pricing
    formula: |
      # MODE (a): combinatorial formula — 3 inputs, non-linear interaction.
      # Given:
      #   q = new meter quantity
      #   c = Commitment (committed_quantity - consumed_quantity) remaining
      #   r_commit, r_overage = rates
      # Compute:
      #   committed_portion = min(q, max(c, 0))
      #   overage_portion   = max(q - committed_portion, 0)
      #   charge            = committed_portion * r_commit + overage_portion * r_overage
      # If no ACTIVE Commitment exists, committed_portion = 0 and the entire quantity
      # bills at r_overage (which falls back to the PlanTierConfig on-demand rate).
    input_set: "MeterAccumulator for the period + Commitment in ACTIVE status + PlanTierConfig"
    constants: {}
    precision: "integer cents, round_half_up"
    variants: []

  - name: log_charged_amount
    trigger: "LogEvent ingest or reindex"
    algorithm: tiered_pricing
    formula: |
      # Ingest leg — charged on ALL events regardless of filter outcome
      ingest_gb     = size_bytes / 1_000_000_000
      ingest_charge = round_half_up(ingest_gb * plan.log_ingest_rate_cents_per_gb)
      # Index leg — charged ONLY if exclusion_state == INDEXED, multiplied by
      # the RetentionTier's basis-point multiplier
      if exclusion_state == INDEXED:
        base_index  = plan.log_index_rate_cents_per_million / 1_000_000
        multiplier  = retention_tier.index_rate_multiplier_bp / 10000.0
        index_charge = round_half_up(base_index * multiplier)
      else:
        index_charge = 0
      return (ingest_charge, index_charge)
    input_set: "LogEvent + PlanTierConfig + RetentionTier"
    constants:
      BYTES_PER_GB: 1000000000
      EVENTS_PER_MILLION: 1000000
      BP_BASE: 10000
    precision: "integer cents, round_half_up"
    variants:
      - name: provisional_log_charge
        when: "at ingest"
        difference: "ingest leg charged immediately; index leg charged only if exclusion_state == INDEXED at the moment of ingest"
      - name: final_log_charge
        when: "at reindex"
        difference: "index leg is added when an EXCLUDED event transitions to INDEXED; ingest leg is not re-charged"

  - name: cardinality_threshold_check
    trigger: "hourly rollup snapshot"
    algorithm: threshold
    formula: |
      # A CardinalityIncident is opened when
      #   cardinality_estimate > included_custom_metrics + SOFT_CAP (>= does NOT trigger; strictly >)
      let soft_cap = 10000
      if cardinality_estimate > plan.included_custom_metrics + soft_cap:
        open CardinalityIncident with opened_at_cardinality = cardinality_estimate
    input_set: "CustomMetricSeries for the account + PlanTierConfig"
    constants:
      SOFT_CAP: 10000
    precision: "integer"
    variants: []

  - name: chargeback_rollup_per_team
    trigger: "on demand via GET chargeback endpoint"
    algorithm: aggregation
    formula: |
      # Sum of rated amounts per team for the period.
      # UsageRecords with tag_compliant == false are EXCLUDED from the team's rollup
      # and aggregated into a special "UNATTRIBUTED" bucket.
      for each team in account:
        rollup[team.id] = sum(rate(u) for u in UsageRecord
                              where u.team_id == team.id
                                and u.billing_period_id == period.id
                                and u.tag_compliant == true
                                and u.disputed == false)
      rollup["UNATTRIBUTED"] = sum(rate(u) for u in UsageRecord
                                    where u.tag_compliant == false OR u.team_id is null)
    input_set: "UsageRecord rows for the period"
    constants: {}
    precision: "integer cents, round_half_up"
    variants: []

  - name: exclusion_filter_selection
    trigger: "LogEvent ingest"
    algorithm: topological
    formula: |
      # Select the winning ExclusionFilter for an event:
      #   candidates = [f in ExclusionFilter where f.billing_account_id == event.account
      #                  and f.enabled == true
      #                  and glob_match(f.service_tag_pattern, event.service_tag)]
      #   if candidates is empty: no filter applies -> event is INDEXED
      #   winner = candidates sorted by (priority ASC, created_at ASC) | first
      #   (created_at ASC tie-break; id is FORBIDDEN as tie-break)
      #   if winner.sample_rate_pct == 0: event -> EXCLUDED
      #   else: probabilistic admit; for the deterministic benchmark the rule is
      #         "admit the event when (hash(service_tag) mod 100) < winner.sample_rate_pct"
    input_set: "ExclusionFilter rows for the account, enabled only"
    constants: {}
    precision: "integer percent"
    variants: []

# =============================================================================
# Table 4: Validation Rules Table (ordered by priority)
# =============================================================================
validations:
  - priority: 1
    category: auth
    check: "X-User-Role header present and one of the declared role names; X-User-ID header present when the role's identity is entity_backed"
    error_id: ERR_UNAUTHENTICATED
    http_status: 401
    applies_to: "all"

  - priority: 2
    category: auth
    check: "Role is permitted to invoke this endpoint per §1.7 RBAC matrix"
    error_id: ERR_FORBIDDEN
    http_status: 403
    applies_to: "all"

  - priority: 3
    category: existence
    check: "Path-segment ids (account, period, invoice, etc.) resolve, left-to-right"
    error_id: ERR_NOT_FOUND
    http_status: 404
    applies_to: "all resource endpoints"

  - priority: 4
    category: existence
    check: "Body-supplied foreign keys (commitment_id, retention_tier_id, team_id) resolve to live records"
    error_id: ERR_NOT_FOUND
    http_status: 404
    applies_to: "endpoints with body FKs"

  - priority: 5
    category: state
    check: "Parent BillingPeriod.status is OPEN for any meter or log mutation; CLOSED periods reject with ERR_PERIOD_CLOSED"
    error_id: ERR_PERIOD_CLOSED
    http_status: 409
    applies_to: "POST log-events, POST host-hour-records, POST meter-accumulators/*, POST log-events/{id}/reindex"

  - priority: 6
    category: state
    check: "Entity-specific state precondition for the action (e.g., Commitment activate requires DRAFT, dispute accept requires dispute OPEN, incident transitions follow the cycle)"
    error_id: ERR_INVALID_STATE
    http_status: 409
    applies_to: "all action endpoints"

  - priority: 7
    category: business_temporal
    check: "RetentionTier effective window does not overlap an existing tier's [effective_from_utc, effective_to_utc) for the same account (half-open overlap); also rejects gaps when effective_to is set on the previous tier"
    error_id: ERR_TIER_WINDOW_OVERLAP
    http_status: 409
    applies_to: "POST/PUT retention-tiers"

  - priority: 8
    category: business_temporal
    check: "Commitment window does not overlap another Commitment's [window_start_utc, window_end_utc] (CLOSED interval) for the same account and meter"
    error_id: ERR_COMMITMENT_WINDOW_OVERLAP
    http_status: 409
    applies_to: "POST commitments, POST commitments/{id}/top-up"

  - priority: 9
    category: business_constraint
    check: "Plan tier cap: count of Monitor rows with status == ACTIVE for the account is strictly less than PlanTierConfig.max_monitors (at-cap create returns ERR_PLAN_LIMIT; the cap is reached exactly when active_count == max_monitors)"
    error_id: ERR_PLAN_LIMIT
    http_status: 409
    applies_to: "POST monitors"

  - priority: 10
    category: business_fiscal
    check: "BillingAccount.standing == GOOD for new Commitment creation and activation"
    error_id: ERR_ACCOUNT_DELINQUENT
    http_status: 409
    applies_to: "POST commitments, POST commitments/{id}/activate"

  - priority: 11
    category: business_referential
    check: "TagPolicy with enforcement == BLOCK rejects UsageRecord creation whose team_id is null or whose tag value is not in allowed_values"
    error_id: ERR_TAG_POLICY_VIOLATION
    http_status: 422
    applies_to: "POST usage-records"

  - priority: 12
    category: business_constraint
    check: "Optimistic concurrency: expected_*_version matches the current parent version"
    error_id: ERR_STALE_VERSION
    http_status: 412
    applies_to: "endpoints declared in concurrency_rules"

  - priority: 13
    category: business_constraint
    check: "Request payload schema validation (required fields present, types match, enum values valid)"
    error_id: ERR_INVALID_REQUEST
    http_status: 400
    applies_to: "all"

