      - name: check_out_stops_counting_departure_date_units
        claim_type: derived_field_reconciliation
        grounds: ["calculations.room_units_reserved", "state_machines.Reservation.transitions.RESERVED_to_CHECKED_OUT"]
        distinguishing_aspect: "The derived room-unit bucket for the departure date falls to zero once the booking is CHECKED_OUT, while the stored booking row survives."
        test_recipe:
          setup: ["One Resort with a checked-in 4-guest booking spanning 2026-09-03 to 2026-09-05"]
          setup_api_calls:
            - call: "POST /resorts"
              payload: { name: "Bloomington", park_capacity_occupancy_units: 20, day_pass_cap_units: 10, arcade_credit_rate_cents_per_unit: 250 }
              as: platform_ops
