              payload: {}
              as: RegistrarOperator
              captures: { captured_after: $.data.captured_cents }
          trigger:
            - call: "POST /registrar/payments/${payment_id}/refund"
              payload: { refund_amount_cents: 1000 }
              as: RegistrarOperator
              captures: { refunded_after: $.data.refunded_cents, status_after: $.data.status }
          assert:
            - "captured_after == 1000"
            - "refunded_after == 1000"
            - "status_after == REFUNDED"
            - "captured_cents - refunded_cents == 0 (invariant conserved)"

      - name: clearinghouse_membership_conserved_across_failed_batch
        grounds:
          - calculations.clearinghouse_sweep
          - state_machines.ClearinghouseReportBatch.TRANSMITTED_to_FAILED
          - entities.ClearinghouseReportBatch.fields.order_count
        distinguishing_aspect: |
          Conserved quantity: count of distinct DELIVERED orders reported in
          non-failed batches for a given period. Forward action = transmit
          batch (orders 'in' a non-failed batch). Compensating action = mark
          batch FAILED (membership released). Invariant: sum of order_count
          across non-failed batches covering a period == count of DELIVERED
          orders in that period (no order lost, none double-counted).
          Different conserved quantity from payment (count of entities vs
          cents).
        test_recipe:
          setup:
            - "Two DELIVERED orders o1, o2 in period [2026-08-01, 2026-09-01)"
            - "Batch b1 created (sweeps o1+o2), locked, transmitted -> order_count = 2"
            - "b1 marked FAILED"
            - "Batch b2 created for the same period"
          setup_api_calls:
            - call: "POST /registrar/_clock/set_current_utc"
              payload: { to_iso8601: "2026-08-01T00:00:00Z" }
              as: RegistrarAdmin
            - call: "POST /registrar/fee-schedules"
              payload:
                code: "FS-INV2"
                official_base_cents: 1000
                unofficial_base_cents: 500
                paper_surcharge_cents: 200
                pickup_surcharge_cents: 100
                rush_flat_cents: 1500
                rush_multiplier_bp: 15000
                volume_tiers: []
                effective_from: "2026-08-01T00:00:00Z"
                active: true
              as: RegistrarAdmin
            - call: "POST /registrar/students"
              payload:
                student_number: "SA000002"
                full_name: "Rita Su"
                date_of_birth: "2001-02-20"
                email: "rita@example.edu"
              as: RegistrarAdmin
              captures: { student_id: $.data.id }
            - call: "POST /registrar/recipients"
              payload:
                kind: "EMAIL_PDF"
                display_name: "Self"
                email_address: "rita@example.edu"
              as: RegistrarAdmin
              captures: { recip_id: $.data.id }
            # Order 1
            - call: "POST /registrar/orders"
              payload:
                student_id: "${student_id}"
                order_kind: "OFFICIAL"
                rush_requested: false
              as: Student
              as_user_id: "${student_id}"
              captures: { order1: $.data.id, order1_v0: $.data.version }
            - call: "POST /registrar/orders/${order1}/line-items"
              payload:
                recipient_id: "${recip_id}"
                delivery_kind: "EMAIL_PDF"
                quantity: 1
                expected_order_version: "${order1_v0}"
              as: Student
              as_user_id: "${student_id}"
              captures: { order1_v1: $.data.version, line1: $.data.id }
            - call: "POST /registrar/identity-verifications"
              payload:
                student_id: "${student_id}"
                order_id: "${order1}"
                method: "SSN_DOB"
              as: Student
              as_user_id: "${student_id}"
              captures: { idv1: $.data.id, idv1_token: $.data.verification_token }
            - call: "POST /registrar/identity-verifications/${idv1}/confirm"
              payload: { verification_token: "${idv1_token}" }
              as: Student
              as_user_id: "${student_id}"
            - call: "POST /registrar/orders/${order1}/submit"
              payload: { expected_order_version: "${order1_v1}" }
              as: Student
              as_user_id: "${student_id}"
            - call: "POST /registrar/payments"
              payload:
                order_id: "${order1}"
                idempotency_key: "pay-inv2-a"
              as: Student
              as_user_id: "${student_id}"
              captures: { pay1: $.data.id }
            - call: "POST /registrar/payments/${pay1}/capture"
              payload: {}
              as: RegistrarOperator
            - call: "POST /registrar/line-items/${line1}/dispatch"
              payload: {}
              as: RegistrarOperator
            - call: "POST /registrar/line-items/${line1}/mark-delivered"
              payload: {}
              as: RegistrarOperator
            # Order 2
            - call: "POST /registrar/orders"
              payload:
                student_id: "${student_id}"
                order_kind: "OFFICIAL"
                rush_requested: false
              as: Student
              as_user_id: "${student_id}"
              captures: { order2: $.data.id, order2_v0: $.data.version }
            - call: "POST /registrar/orders/${order2}/line-items"
              payload:
                recipient_id: "${recip_id}"
                delivery_kind: "EMAIL_PDF"
                quantity: 1
                expected_order_version: "${order2_v0}"
              as: Student
              as_user_id: "${student_id}"
              captures: { order2_v1: $.data.version, line2: $.data.id }
            - call: "POST /registrar/identity-verifications"
              payload:
                student_id: "${student_id}"
                order_id: "${order2}"
                method: "SSN_DOB"
              as: Student
              as_user_id: "${student_id}"
              captures: { idv2: $.data.id, idv2_token: $.data.verification_token }
            - call: "POST /registrar/identity-verifications/${idv2}/confirm"
              payload: { verification_token: "${idv2_token}" }
              as: Student
              as_user_id: "${student_id}"
            - call: "POST /registrar/orders/${order2}/submit"
              payload: { expected_order_version: "${order2_v1}" }
              as: Student
              as_user_id: "${student_id}"
            - call: "POST /registrar/payments"
              payload:
                order_id: "${order2}"
                idempotency_key: "pay-inv2-b"
              as: Student
              as_user_id: "${student_id}"
              captures: { pay2: $.data.id }
            - call: "POST /registrar/payments/${pay2}/capture"
              payload: {}
              as: RegistrarOperator
            - call: "POST /registrar/line-items/${line2}/dispatch"
              payload: {}
              as: RegistrarOperator
            - call: "POST /registrar/line-items/${line2}/mark-delivered"
              payload: {}
              as: RegistrarOperator
            - call: "POST /registrar/clearinghouse-batches"
              payload:
                report_period_start: "2026-08-01T00:00:00Z"
                report_period_end: "2026-09-01T00:00:00Z"
              as: RegistrarOperator
              captures: { batch1: $.data.id, b1_count: $.data.order_count }
            - call: "POST /registrar/clearinghouse-batches/${batch1}/lock"
              payload: {}
              as: RegistrarOperator
            - call: "POST /registrar/clearinghouse-batches/${batch1}/transmit"
              payload: {}
              as: RegistrarOperator
          trigger:
            - call: "POST /registrar/clearinghouse-batches/${batch1}/mark-failed"
              payload: {}
              as: RegistrarOperator
            - call: "POST /registrar/clearinghouse-batches"
              payload:
                report_period_start: "2026-08-01T00:00:00Z"
                report_period_end: "2026-09-01T00:00:00Z"
              as: RegistrarOperator
              captures: { batch2: $.data.id, b2_count: $.data.order_count }
          assert:
            - "b1_count == 2 (forward action: 2 orders swept)"
            - "After batch1 FAILED, membership is released (compensating action)"
            - "b2_count == 2 (same orders re-swept — membership conserved, none lost)"
            - "sum(order_count over non-failed batches for the period) == 2 == count of DELIVERED orders in period"
