              as: StudioManager
              captures: { prof_id: $.data.id }
            - call: "POST /studio/rush-tier-rules"
              payload: { tier: "STANDARD", multiplier_bp: 10000, sla_hours: 72, surcharge_breach_cents: 0, included_revision_rounds: 1, per_round_cents: 10000 }
              as: StudioManager
            - call: "POST /studio/clients"
