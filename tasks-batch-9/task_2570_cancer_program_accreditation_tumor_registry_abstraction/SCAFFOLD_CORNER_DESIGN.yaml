      - name: measure_rate_rounds_each_stratum_before_averaging
        claim_type: Precision
        grounds:
          - calculations.quality_measure_performance
          - entities.QualityMeasure.fields.performance_rate_pct
          - entities.QualityMeasure.fields.pooled_rate_pct
        distinguishing_aspect: |
          Strata (2/3) and (5/7) round to 66.7 and 71.4, whose mean is 69.05 and rounds half-up to
          69.1; averaging the UNROUNDED rates would give 69.0 and the pooled ratio gives 70.0, so
          all three candidate answers are distinguishable in one call.
        test_recipe:
          setup:
            - "One program with one DRAFT quality measure whose accountability threshold is 80.0."
          setup_api_calls:
            - call: "POST /cancer-registry/programs"
              payload: { name: "Northside Cancer Center", coc_program_id: "COC-1456N", annual_analytic_caseload: 300, reference_year: 2018, timeliness_standard_days: 180 }
              as: PlatformAdmin
              captures: { prog_id: $.data.id }
            - call: "POST /cancer-registry/quality-measures"
              payload: { program_id: "${prog_id}", measure_code: "BCSRT", measurement_year: 2026, threshold_pct: 80.0 }
              as: RegistryManager
              captures: { meas_id: $.data.id }
          trigger:
            - call: "POST /cancer-registry/quality-measures/${meas_id}/evaluate"
              payload: { strata: [{ stage_group: "STAGE_II", eligible_case_count: 3, compliant_case_count: 2 }, { stage_group: "STAGE_III", eligible_case_count: 7, compliant_case_count: 5 }] }
              as: AccreditationCoordinator
              as_user_id: "user-coord-1"
          assert:
            - "HTTP 200 with data.performance_rate_pct == 69.1 (not 69.0 and not 70.0)"
            - "data.pooled_rate_pct == 70.0 and data.included_strata_count == 2"
            - "data.performance_state == UNDER_THRESHOLD and data.measure_state == PROJECT_REQUIRED"

