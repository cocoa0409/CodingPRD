              as: MeterTechnician
            - call: "POST /meter-readings"
              payload: { meter_id: "${meter_x_id}", read_date: "2026-07-31", read_type: "ACTUAL", reading_value: 604000 }
              as: MeterTechnician
            - call: "POST /meter-readings"
              payload: { meter_id: "${meter_xsub_id}", read_date: "2026-06-30", read_type: "ACTUAL", reading_value: 0 }
              as: MeterTechnician
            - call: "POST /meter-readings"
              payload: { meter_id: "${meter_xsub_id}", read_date: "2026-07-31", read_type: "ACTUAL", reading_value: 1000 }
              as: MeterTechnician
            - call: "POST /meter-readings"
              payload: { meter_id: "${meter_y_id}", read_date: "2026-06-30", read_type: "ACTUAL", reading_value: 700000 }
              as: MeterTechnician
            - call: "POST /meter-readings"
              payload: { meter_id: "${meter_y_id}", read_date: "2026-07-31", read_type: "ACTUAL", reading_value: 704000 }
              as: MeterTechnician
          trigger:
            - call: "POST /bills"
              payload: { account_id: "${acct_y_id}", period_id: "${p4_id}", meter_id: "${meter_xsub_id}", read_type: "ACTUAL" }
              as: BillingSupervisor
            - call: "POST /bills"
              payload: { account_id: "${acct_y_id}", period_id: "${p4_id}", meter_id: "${meter_x_id}", read_type: "ACTUAL" }
              as: BillingSupervisor
          assert:
            - "Meter.${meter_xsub_id}.meter_type == IRRIGATION_SUBMETER and Meter.${meter_xsub_id}.account_id == ${acct_x_id}, which differs from the account_id sent in the body"
            - "The first trigger call returns HTTP 422 with error_id ERR_METER_NOT_BILLABLE"
            - "The first trigger call does NOT return ERR_BILL_METER_ACCOUNT_MISMATCH, even though priority 12 is also violated"
            - "The second trigger call, citing a POTABLE_MASTER meter on the wrong account, returns HTTP 422 with error_id ERR_BILL_METER_ACCOUNT_MISMATCH"
            - "GET /bills?account_id=${acct_y_id} returns total_count 0 and GET /bills?account_id=${acct_x_id} returns total_count 0"
            - "GET /bills?meter_id=${meter_xsub_id} returns total_count 0 — a submeter never carries a bill of its own"

  # ===========================================================================
  - rule_id: boundary_precision_check
    instances:

      # -------- metric: anomaly_ratio, 3 decimal places, INCLUSIVE >= --------
      - name: boundary_anomaly_ratio_inclusive_at_two_point_zero_three_decimals
        grounds:
          - calculations.anomaly_screen
          - calculations.seasonal_baseline
          - entities.Bill.fields.anomaly_ratio
          - entities.Bill.fields.anomaly_flag
          - endpoints[POST /bills]
        distinguishing_aspect: |
          METRIC anomaly_ratio on ENDPOINT POST /bills, carried to exactly 3 decimal places with
          an INCLUSIVE comparison against ANOMALY_RATIO_THRESHOLD 2.000. 7996 gallons against a
          4000-gallon baseline gives 1.999 and is NOT flagged; 8000 gallons gives exactly 2.000
          and IS flagged. The 4-gallon gap is the smallest that can move the third decimal place,
          so an implementation that truncates instead of rounding half-up, or that uses a strict
          greater-than, gets the 8000 case wrong. Precision is also visible in the money: the
          two bills differ by 4 cents of sewer and 2 cents of water.
        test_recipe:
          setup:
            - "RS-STD-2026 exists, and five non-overlapping SUMMER periods: 2025-06, 2025-07, 2025-08, 2026-07 (2026-07-01..2026-07-31) and 2026-08 (2026-08-01..2026-08-31)."
            - "The logical clock is 2026-09-01T00:00:00Z so every one of the five periods has ended and can be billed."
            - "ServiceAccount ACC-1006 owns a 1.0 inch POTABLE_MASTER meter (initial_register_value 100000) with reads 100000 / 104000 / 108000 / 112000 / 119996 / 127996, giving consumptions 4000, 4000, 4000, 7996 and 8000 gallons."
            - "Only the three 2025 bills are ISSUED. The 2026-07 bill is deliberately left in DRAFT so that it cannot enter the baseline pool for 2026-08, keeping that baseline pinned at 4000."
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { current_utc: "2026-09-01T00:00:00Z" }
              as: SystemAdmin
            - call: "POST /rate-schedules"
              payload: { code: "RS-STD-2026", base_charge_cents: 1200, tier1_limit_gallons: 3000, tier1_rate_cents_per_kgal: 350, tier2_limit_gallons: 10000, tier2_rate_cents_per_kgal: 520, tier3_rate_cents_per_kgal: 890, summer_surcharge_bp: 1500, sewer_rate_cents_per_kgal: 610, sewer_cap_gallons: 12000, submeter_sewer_credit_cap_gallons: 8000, admin_fee_cents: 1500, admin_fee_waiver_threshold_cents: 10000 }
              as: SystemAdmin
              captures: { rs_id: $.data.id }
            - call: "POST /billing-periods"
              payload: { period_code: "2025-06", start_date: "2025-06-01", end_date: "2025-06-30", season: "SUMMER", rebilling_deadline_date: "2026-12-31" }
