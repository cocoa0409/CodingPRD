              as: Recruiter
              as_user_id: "${rec_a_id}"
              captures: { move_1_id: $.data.id }
            - call: "POST /mep/qualifying-moves"
              payload: { student_id: "${stu_id}", from_state_code: "OR", to_state_code: "WA", move_date: "2026-06-20", work_type: "AGRICULTURAL", worker_relationship: "PARENT", purpose: "ACCOMPANY_WORKER", distance_miles: 260.00 }
              as: Recruiter
              as_user_id: "${rec_a_id}"
              captures: { move_2_id: $.data.id }
            - call: "POST /mep/qualifying-moves/${move_2_id}/adjudicate"
              payload: { decision: "REJECTED" }
