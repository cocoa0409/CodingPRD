  - name: tool_life_threshold_fires_at_exactly_expected_life_pieces
    claim_type: constants_applied
    grounds:
    - calculations.tool_wear_state
    - entities.ToolAssignment.fields.expected_life_pieces
    - state_machines.ToolAssignment.IN_SERVICE_to_LIFE_EXPIRED
    distinguishing_aspect: |
      pieces_since_index >= expected_life_pieces is inclusive: a station rated 100 pieces that logs exactly 100 moves to LIFE_EXPIRED, while an identical station that logs 99 stays IN_SERVICE, and the life branch is taken even though the drift accumulator is only 1 micron.
    test_recipe:
      setup:
      - Logical clock at 2026-09-01T00:00:00Z.
      - Machines SW-01 and SW-02 each carry one IN_SERVICE station rated 100 pieces with drift_limit_um 8.
      setup_api_calls:
      - call: POST /_clock/set_current_utc
