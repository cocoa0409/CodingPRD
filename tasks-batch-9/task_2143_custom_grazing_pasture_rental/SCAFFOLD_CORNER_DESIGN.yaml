              as: Grazier
              as_user_id: "${g1}"
              captures: { p1: $.data.id, p1_v0: $.data.version }
            - call: "POST /grazing/pastures/${p1}/capacity-assessments"
              payload: { expected_pasture_version: "${p1_v0}", method: "DRY_MATTER", forage_dry_matter_lbs_per_acre: 1800, utilization_pct: 25, assessment_date: "2026-07-15" }
              as: RangeConsultant
              as_user_id: "${c1}"
              captures: { a1: $.data.id }
            - call: "POST /grazing/pastures/${p1}/status"
              payload: { to_status: "AVAILABLE" }
              as: Grazier
              as_user_id: "${g1}"
            - call: "POST /grazing/cattle-owners"
              payload: { legal_name: "Two Dot Livestock", state_code: "MT", brand_registration: "MT-9000", credit_limit_cents: 5000000 }
              as: PlatformAdmin
              captures: { o2: $.data.id }
            - call: "POST /grazing/contracts"
              payload: { cattle_owner_id: "${o1}", pasture_id: "${p1}", billing_mode: "PER_POUND_OF_GAIN", rate_cents: 85, shrink_pct: 3.5, out_shrink_pct: 0, head_count_committed: 150, head_value_cents: 140000, start_date: "2026-08-10", end_date: "2026-11-10", min_days: 60, treatment_cost_split_pct: 33, water_responsibility: "SHARED", fence_responsibility: "GRAZIER", infrastructure_owner_cap_cents: 100000, death_loss_terms: "GRAZIER_SHARE_ABOVE_THRESHOLD", death_loss_threshold_pct: 2.0 }
              as: Grazier
              as_user_id: "${g1}"
              captures: { k1: $.data.id }
            - call: "POST /grazing/contracts"
              payload: { cattle_owner_id: "${o2}", pasture_id: "${p1}", billing_mode: "PER_HEAD_PER_DAY", rate_cents: 100, shrink_pct: 0, out_shrink_pct: 0, head_count_committed: 30, head_value_cents: 120000, start_date: "2027-04-01", end_date: "2027-07-01", min_days: 60, treatment_cost_split_pct: 0, water_responsibility: "GRAZIER", fence_responsibility: "GRAZIER", infrastructure_owner_cap_cents: 100000, death_loss_terms: "OWNER_BEARS_ALL", death_loss_threshold_pct: 2.0 }
              as: Grazier
              as_user_id: "${g1}"
              captures: { k2: $.data.id }
          trigger:
            - call: "GET /grazing/contracts"
              payload: { limit: 1, offset: 0 }
              as: PlatformAdmin
            - call: "GET /grazing/contracts"
              payload: { cattle_owner_id: "${o2}" }
              as: PlatformAdmin
          assert:
            - "The first response has response_type array, meta.api_request_id present, total_count == 2, has_more == true and exactly 1 element"
            - "The second response has total_count == 1 and its single element id == ${k2}"

      - name: get_settlement_with_unknown_id_returns_settlement_not_found
        claim_type: not_found
        grounds:
          - endpoints[GET /grazing/settlements/{id}]
          - errors[ERR_SETTLEMENT_NOT_FOUND]
          - validations[priority=4]
        distinguishing_aspect: "A syntactically valid but unknown settlement UUID resolves to ERR_SETTLEMENT_NOT_FOUND with HTTP 404, not to an empty 200."
        test_recipe:
          setup: ["One Grazier is registered; no settlements exist."]
          setup_api_calls:
            - call: "POST /grazing/graziers"
              payload: { business_name: "Bitterroot Custom Grazing", state_code: "MT", liability_carrier: "Farm Mutual" }
              as: PlatformAdmin
              captures: { g1: $.data.id }
          trigger:
            - call: "GET /grazing/settlements/00000000-0000-4000-8000-000000000000"
              payload: {}
              as: Grazier
              as_user_id: "${g1}"
              captures: { err: $.data.error_id }
          assert:
            - "${err} == ERR_SETTLEMENT_NOT_FOUND with HTTP 404"
            - "The response envelope has response_type == error"

      - name: create_contract_missing_required_billing_mode_returns_validation
        claim_type: required_fields
        grounds:
          - endpoints[POST /grazing/contracts]
          - validations[priority=7]
          - errors[ERR_VALIDATION]
        distinguishing_aspect: "Omitting billing_mode — an input field with no declared default — returns ERR_VALIDATION with HTTP 422 and creates no contract row."
        test_recipe:
          setup: ["An AVAILABLE pasture and a registered cattle owner exist."]
          setup_api_calls:
            - call: "POST /grazing/graziers"
