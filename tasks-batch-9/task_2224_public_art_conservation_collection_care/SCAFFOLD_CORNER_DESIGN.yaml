          - entities.Artwork.fields.priority_basis
        distinguishing_aspect: "DEFERRAL_PER_DAY 0.004 reaches DEFERRAL_CAP 1.6 at exactly 150 days of deferral: re-running the cycle at 149, 150 and 200 days after the same survey must yield 146.63, then 147.00, then 147.00 again - the third run proves the cap clamps instead of growing."
        test_recipe:
          setup:
