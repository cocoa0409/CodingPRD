  - rule_id: resource_temporal_overlap
    instances:

      - name: standing_instruction_periodic_cumulative_limit_overlap
        grounds:
          - calculations.money_movement_verification
          - entities.StandingInstruction.fields.consumed_period_cents
          - entities.StandingInstruction.fields.periodic_limit_cents
          - validations[priority=33]
        distinguishing_aspect: "Aggregate-capacity interval semantics on the StandingInstruction resource: three movements of 200000, 200000 and 100001 cents against a 500000-cent periodic limit are individually small but the third collides with the cumulative consumption of the billing period and is rejected — the resource is occupied by the SUM of the period's movements, not by one interval at a time."
        test_recipe:
          setup:
            - "Logical clock at 2026-09-01T00:00:00Z. Firm with EXECUTED agreement and GRANTED MONEY_MOVEMENT entitlement, firm_posture OPEN."
            - "One household with an OPEN INDIVIDUAL account and a VERIFIED standing instruction with periodic_limit_cents 500000 and consumed_period_cents 0."
          setup_api_calls:
            - *c_clock
            - *c_firm
            - *c_agr
            - *c_agr_submit
            - *c_agr_exec
            - *c_ent_mm2
            - call: "POST /ria/firm-entitlements/${ent_pay_id}/grant"
              payload: {}
              as: CustodyOperationsOfficer
            - *c_house
            - call: "POST /ria/accounts"
              payload: { household_id: "${h_id}", firm_id: "${f_id}", account_number: "RIA-107001", account_type: "INDIVIDUAL", householding_consent: "OP_IN" }
              as: AdvisorOperationsLead
              captures: { acct_id: $.data.id }
            - call: "POST /ria/accounts/${acct_id}/activate"
