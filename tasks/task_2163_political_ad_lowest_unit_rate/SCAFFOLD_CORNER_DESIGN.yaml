            - "FccComplaint.${cmp}.status == CLOSED"
            - "FccComplaint.${cmp}.remedy_code == CURED"
            - "FccComplaint.${cmp}.late_response == true, because the CURED response landed at 2026-09-04T09:00:00Z, after response_due_at 2026-08-15T09:00:00Z"
            - "Station.${st}.open_complaint_count == 0"
