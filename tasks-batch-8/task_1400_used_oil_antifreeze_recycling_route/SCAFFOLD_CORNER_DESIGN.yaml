            - { call: "POST /recycle-routes/routes", payload: { route_code: "RBAC", scheduled_date: "2026-08-05", driver_id: "${drv}", vehicle_capacity_gallons: 500, density_zone: "URBAN" }, as: RoutePlanner, captures: { rid: "$.data.id", rv: "$.data.version" } }
            - { call: "POST /recycle-routes/routes/${rid}/route-stops", payload: { tank_site_id: "${sid}", tank_id: "${tid}", scheduled_window_start: "08:00", scheduled_window_end: "09:00", sequence: 1, estimated_volume_gallons: 100, expected_route_version: "${rv}" }, as: RoutePlanner, captures: { sid2: "$.data.id" } }
