  - rule_id: transitive_cascade
    instances:
      - name: critical_incident_finding_cascades_worksite_partner_placement_and_cycle
        grounds:
          - state_machines.IncidentReport
          - calculations.employer_safety_score_posture
          - endpoints["POST /wbl/incident-reports/{incidentId}/finding"]
          - entities.Placement.fields.compliance_status
          - entities.EvaluationCycle.fields.cycle_status
        distinguishing_aspect: |
          Depth-4 chain where each hop exists only because the previous one fired: substantiating a
          CRITICAL incident fails the worksite (hop 1); the failed worksite plus the -50 critical
          penalty drives the employer partner to safety_score 50 and posture SUSPENDED (hop 2); the
          suspended posture blocks that worksite's PROPOSED/ACTIVE placements (hop 3); and the blocked
          placement suspends its OPEN evaluation cycle (hop 4). None of hops 2-4 are reachable by
          calling the finding endpoint on a MINOR or MODERATE incident.
