              as: AcademyDirector
              as_user_id: "dir-1"
              captures: { class_id: $.data.id }
            - call: "POST /instructors"
              payload: { badge_number: "B-100", full_name: "Ivy Nash" }
              as: AcademyDirector
              as_user_id: "dir-1"
              captures: { instr_id: $.data.id }
            - call: "POST /instructors/${instr_id}/certify"
              payload: { certification_expires_at: "2028-08-01T00:00:00Z", authorized_topic_codes: ["PATROL"], fto_certified: true }
              as: AcademyDirector
              as_user_id: "dir-1"
            - call: "POST /lesson-plans"
              payload: { instructor_id: "${instr_id}", topic_code: "PATROL", title: "Patrol Operations", contact_hours: 2.00 }
              as: AcademyInstructor
              as_user_id: "${instr_id}"
              captures: { lp_id: $.data.id }
            - call: "POST /lesson-plans/${lp_id}/approve"
              payload: {}
              as: AcademyDirector
              as_user_id: "dir-1"
            - call: "POST /course-sessions"
              payload: { academy_class_id: "${class_id}", lesson_plan_id: "${lp_id}", instructor_id: "${instr_id}", room_code: "R1", starts_at: "2026-08-10T09:00:00Z", ends_at: "2026-08-10T11:00:00Z", min_enrollment: 1 }
              as: TrainingCoordinator
              as_user_id: "tc-1"
              captures: { cs1_id: $.data.id }
            - call: "GET /lesson-plans/${lp_id}"
              payload: {}
              as: AcademyDirector
              as_user_id: "dir-1"
              captures: { lp_v2: $.data.version }
          trigger:
            - call: "POST /lesson-plans/${lp_id}/request-revision"
              payload: { reviewer_notes: "reviewer wants a rewrite" }
              as: AcademyDirector
              as_user_id: "dir-1"
              captures: { e1: $.data.error_id }
            - call: "POST /lesson-plans/${lp_id}/revisions"
              payload: { expected_lesson_plan_version: "${lp_v2}", contact_hours: 2.00, revision_notes: "author supersedes the approved revision" }
              as: AcademyInstructor
              as_user_id: "${instr_id}"
              captures: { lp_v3: $.data.version }
            - call: "POST /lesson-plans/${lp_id}/request-revision"
              payload: { reviewer_notes: "now it is reviewable" }
              as: AcademyDirector
              as_user_id: "dir-1"
            - call: "POST /lesson-plans/${lp_id}/request-revision"
              payload: { reviewer_notes: "asking twice" }
              as: AcademyDirector
              as_user_id: "dir-1"
              captures: { e2: $.data.error_id }
            - call: "GET /lesson-plans/${lp_id}"
              payload: {}
              as: AcademyDirector
              as_user_id: "dir-1"
            - call: "GET /course-sessions/${cs1_id}"
              payload: {}
              as: TrainingCoordinator
              as_user_id: "tc-1"
          assert:
            - "request-revision on the APPROVED plan: HTTP 409, data.error_id == 'ERR_INVALID_STATE' - there is no APPROVED -> REVISION_REQUESTED edge for this verb"
            - "the author's revision: HTTP 200, data.status == 'SUBMITTED', data.revision_number == 2, and data.approved_revision_number is STILL 1"
            - "request-revision from SUBMITTED: HTTP 200, data.status == 'REVISION_REQUESTED', data.reviewer_notes == 'now it is reviewable', data.approved_revision_number still 1"
            - "second request-revision: HTTP 409, data.error_id == 'ERR_INVALID_STATE' - the verb is not idempotent, and data.reviewer_notes is still the FIRST note, not the second"
            - "final plan read: data.revision_number == 2, data.approved_revision_number == 1, data.version == 4 (create 1, approve 2, revise 3, request-revision 4 - one bump per accepted write, none for the two rejects)"
            - "session read: data.pinned_lesson_plan_revision is still 1 and data.status is still 'SCHEDULED' - the pin resolves to a revision number that still exists even though the plan left APPROVED"

