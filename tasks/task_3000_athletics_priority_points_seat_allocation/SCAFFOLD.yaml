    side_effects: []
  - method: GET
    path: "/athletics/seat-assignments"
    description: "List seat assignments; the reverse-reachability channel for all three SeatAssignment FKs."
    roles: [DevelopmentOfficer, PointsCertifier, PolicyCommittee, PlatformAdmin, Donor]
