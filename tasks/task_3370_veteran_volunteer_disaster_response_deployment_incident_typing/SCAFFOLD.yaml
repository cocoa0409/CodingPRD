# =============================================================================
# SCAFFOLD.yaml — Veteran Volunteer Disaster Response Deployment & Incident Typing
# §1.0–§1.7 seed tables (difficulty design and corner design live in sibling files)
# =============================================================================

scenario: |
  Veteran Volunteer Disaster Response Deployment & Incident Typing (Team Rubicon):
  volunteer roster with skills, certifications and deployment availability tracked in a
  readiness database, incident assessment and operation typing determining team size,
  duration and capability requirements, deployment call-up with travel arrangements,
  lodging in forward operating bases and duty rotation, work order intake from homeowners
  and municipalities with prioritization for vulnerable residents, safety qualification
  requirements for chainsaw, heavy equipment and structural work with credential
  verification, partner coordination with emergency management, other nonprofits and
  long-term recovery groups, after-action review and volunteer wellness support,
  training pipeline and instructor certification

domain_name: veteran-disaster-response
api_prefix: /vdr

complexity_profile:
  primary_archetype: quota_allocation
  secondary_archetype: compliance_audit
  complexity_layers:
    - optimistic_concurrency
    - cascading_side_effects
    - ops_run_checkpoint
    - dual_variant_calculation
  entity_topology: flat
  state_machine_shape: cyclic
  relationship_patterns:
    - one_to_many
    - many_to_many
    - cross_aggregate
  role_model: segregation_of_duties
  consistency_model: immediate
  entity_count: 12
  state_machine_count: 9
  calculation_count: 7
  validation_count: 22
  endpoint_count: 40
  error_code_count: 34
  role_count: 8

# =============================================================================
# §1.0 Response Envelope (FIXED — verbatim)
# =============================================================================
response_envelope:
  success: |
    { "meta": { "api_request_id": "req_xxx", "api_request_timestamp": "ISO8601" },
      "response_type": "object" | "array", "data": {} }
  error: |
    { "meta": { ... }, "response_type": "error",
      "data": { "error_id": "ERR_XXX", "message": "..." } }
  pagination_fields: ["limit", "offset", "total_count", "has_more"]
  pagination_defaults: { limit: 10, min: 1, max: 100, offset: 0 }

# =============================================================================
# §1.1 Entity-Relationship Table
# =============================================================================
entities:
  - name: Volunteer
    parent: null
    common_fields: true
    fields:
      - { name: full_name, type: string, source: input, description: "Volunteer full legal name" }
      - { name: email, type: string, source: input, description: "Contact email; unique across volunteers" }
      - { name: home_region, type: string, source: input, description: "Home base region code, e.g. TX-GULF" }
      - { name: skills, type: array, source: input, description: "Skill tags, subset of [CHAINSAW, HEAVY_EQUIPMENT, STRUCTURAL, MEDICAL, LOGISTICS, DEBRIS]" }
      - { name: availability_windows, type: array, source: input, default: [], description: "Array of {start_iso8601, end_iso8601} deployment availability windows (closed intervals)" }
      - { name: instructor_certified, type: boolean, source: input, default: false, description: "Whether volunteer may lead training courses" }
      - { name: readiness_status, type: enum, source: system, description: "REGISTERED | VETTED | DEPLOYABLE | SUSPENDED | INACTIVE" }
      - { name: operational_readiness_score, type: integer, source: computed, description: "Readiness variant A: cert weights only (see calc volunteer_readiness_score)" }
      - { name: readiness_score, type: integer, source: computed, description: "Readiness variant B: wellness-adjusted score (operational minus fatigue penalty, floored at 0)" }
      - { name: fatigue_hours, type: integer, source: computed, description: "Accumulated completed duty-shift hours; reset to 0 by ops run after >= REST_RESET_HOURS(24) with no ON_DUTY shift" }

  - name: Certification
    parent: null
    common_fields: true
    fields:
      - { name: volunteer_id, type: string, source: input, description: "FK -> Volunteer.id; owner of this credential" }
      - { name: kind, type: enum, source: input, description: "CHAINSAW | HEAVY_EQUIPMENT | STRUCTURAL | MEDICAL" }
      - { name: status, type: enum, source: system, description: "PENDING_VERIFICATION | VERIFIED | EXPIRED | REVOKED | REJECTED" }
      - { name: issued_at, type: datetime, source: input, description: "Credential issue timestamp (ISO8601)" }
      - { name: expires_at, type: datetime, source: input, description: "Expiry instant; cert remains VERIFIED while current_utc <= expires_at, becomes EXPIRED when current_utc > expires_at (strictly greater) at ops run" }
      - { name: verified_by_user_id, type: string, source: system, description: "X-User-ID of the SafetyOfficer who verified; null until VERIFIED" }
      - { name: renewal_count, type: integer, source: system, default: 0, description: "Increments by 1 on each EXPIRED->VERIFIED renewal" }

  - name: Incident
    parent: null
    common_fields: true
    fields:
      - { name: name, type: string, source: input, description: "Incident name, e.g. Hurricane Helena" }
      - { name: region, type: string, source: input, description: "Affected region code" }
      - { name: status, type: enum, source: system, description: "REPORTED | ASSESSED | TYPED | STANDING_DOWN | CLOSED | CANCELLED" }
      - { name: severity, type: integer, source: input, description: "Assessed severity 1..5; set on ASSESS, null before" }
      - { name: affected_households, type: integer, source: input, description: "Assessed household count; set on ASSESS, null before" }
      - { name: incident_type, type: enum, source: input, description: "WIND | FLOOD | FIRE | EARTHQUAKE; set on TYPE, null before" }
      - { name: reported_at, type: datetime, source: system, description: "Server timestamp of creation" }

  - name: Operation
    parent: null
    common_fields: true
    fields:
      - { name: incident_id, type: string, source: input, description: "FK -> Incident.id; incident this operation serves" }
      - { name: title, type: string, source: input, description: "Operation title" }
      - { name: hazard_focus, type: enum, source: input, description: "TREE_REMOVAL | MUCK_OUT | TARPING | DEBRIS | STRUCTURAL" }
      - { name: team_size_required, type: integer, source: input, description: "Required roster size; >= 2 and <= MAX_TEAM_SIZE(40)" }
      - { name: duration_days, type: integer, source: input, description: "Planned deployment duration in days; >= 1 and <= MAX_OPERATION_DURATION_DAYS(30)" }
      - { name: required_capabilities, type: array, source: input, description: "Non-empty subset of [CHAINSAW, HEAVY_EQUIPMENT, STRUCTURAL, MEDICAL] the roster must cover" }
      - { name: start_date, type: string, source: input, description: "Planned first day on site, ISO date YYYY-MM-DD" }
      - { name: status, type: enum, source: system, description: "DRAFT | OPEN | MUSTERED | ACTIVE | DEMOBILIZING | COMPLETE | CANCELLED" }
      - { name: aar_status, type: enum, source: system, description: "Parallel dimension: NONE | SUBMITTED | ADOPTED; after-action review lifecycle" }
      - { name: aar_notes, type: string, source: input, description: "After-action review body; set when aar_status -> SUBMITTED, null before" }
      - { name: aar_submitted_by_role, type: string, source: system, description: "Role that submitted the AAR; adoption requires a different role (segregation of duties)" }
      - { name: rostered_count, type: integer, source: computed, description: "Count of Deployments with operation_id == this.id and status IN {ACCEPTED, ON_SITE} (SAFETY_HOLD excluded)" }
      - { name: capability_gap, type: object, source: computed, description: "Map capability -> shortfall = 1 minus covered (covered = rostered volunteers in {ACCEPTED, ON_SITE} holding a VERIFIED cert of that kind); zero entries omitted" }

  - name: Deployment
    parent: null
    common_fields: true
    fields:
      - { name: operation_id, type: string, source: input, description: "FK -> Operation.id; operation the volunteer is called up for" }
      - { name: volunteer_id, type: string, source: input, description: "FK -> Volunteer.id; the called-up volunteer" }
      - { name: status, type: enum, source: system, description: "OFFERED | ACCEPTED | ON_SITE | SAFETY_HOLD | DEMOBED | DECLINED | EXPIRED | NO_SHOW" }
      - { name: duty_status, type: enum, source: system, description: "Parallel dimension: RESTING | ON_DUTY; toggled by duty-shift scheduling and ops-run completion" }
      - { name: travel_mode, type: enum, source: input, description: "SELF | TEAM_TRANSPORT" }
      - { name: needs_lodging, type: boolean, source: input, default: true, description: "Whether a FOB bunk is required at check-in" }
      - { name: planned_start, type: datetime, source: input, description: "Planned arrival (ISO8601); deployment window start" }
      - { name: planned_end, type: datetime, source: input, description: "Planned departure (ISO8601); deployment window end; must be > planned_start" }
      - { name: fob_site_id, type: string, source: system, description: "FK -> FobSite.id; bunk assigned at check-in; null until ON_SITE" }
      - { name: checked_in_at, type: datetime, source: system, description: "Server logical-clock timestamp of check-in; null until ON_SITE" }
      - { name: demobed_at, type: datetime, source: system, description: "Server logical-clock timestamp of demobilization; null until DEMOBED" }
      - { name: stipend_provisional_cents, type: integer, source: computed, description: "Forward-looking stipend computed at ACCEPTED (calc deployment_stipend_cents, provisional variant)" }
      - { name: stipend_final_cents, type: integer, source: computed, description: "Actualized stipend computed at DEMOBED (final variant); null until DEMOBED" }

  - name: FobSite
    parent: null
    common_fields: true
    fields:
      - { name: operation_id, type: string, source: input, description: "FK -> Operation.id; operation this forward operating base lodges" }
      - { name: name, type: string, source: input, description: "FOB name" }
      - { name: bunks_total, type: integer, source: input, description: "Total bunk capacity; >= 1" }
      - { name: nightly_rate_cents, type: integer, source: input, description: "Cost per bunk per night in cents; >= 0" }
      - { name: bunks_occupied, type: integer, source: computed, description: "Count of Deployments with fob_site_id == this.id and status IN {ON_SITE, SAFETY_HOLD}" }
      - { name: lodging_cost_cents, type: integer, source: computed, description: "Accumulated lodging ledger (calc fob_lodging_cost_cents, per-night rounding order pinned)" }

  - name: DutyShift
    parent: null
    common_fields: true
    fields:
      - { name: operation_id, type: string, source: input, description: "FK -> Operation.id; operation the shift belongs to" }
      - { name: deployment_id, type: string, source: input, description: "FK -> Deployment.id; the rostered deployment working this shift" }
      - { name: kind, type: enum, source: input, description: "OPERATIONS | SAFETY_WATCH | LOGISTICS" }
      - { name: starts_at, type: datetime, source: input, description: "Shift start (ISO8601); half-open interval start" }
      - { name: ends_at, type: datetime, source: input, description: "Shift end (ISO8601); half-open interval end, exclusive; must be > starts_at and duration <= MAX_SHIFT_HOURS(12)" }
      - { name: status, type: enum, source: system, description: "SCHEDULED | COMPLETED | CANCELLED" }

  - name: WorkOrder
    parent: null
    common_fields: true
    fields:
      - { name: incident_id, type: string, source: input, description: "FK -> Incident.id; incident the request belongs to" }
      - { name: operation_id, type: string, source: system, description: "FK -> Operation.id; bound at SCHEDULED; null before" }
      - { name: source_partner_id, type: string, source: input, description: "FK -> PartnerAgency.id; referring partner when PartnerLiaison creates the order; null for direct intake" }
      - { name: requester_name, type: string, source: input, description: "Homeowner or municipality contact name" }
      - { name: hazard_kind, type: enum, source: input, description: "TREE_REMOVAL | MUCK_OUT | TARPING | DEBRIS | STRUCTURAL" }
      - { name: vulnerable_resident, type: boolean, source: input, default: false, description: "True when the household includes elderly, disabled, or medically fragile residents" }
      - { name: municipality_sourced, type: boolean, source: input, default: false, description: "True when intake came from a municipality rather than a homeowner" }
      - { name: status, type: enum, source: system, description: "INTAKE | TRIAGED | SCHEDULED | IN_PROGRESS | BLOCKED | DONE_PENDING_VERIFICATION | VERIFIED_DONE | CANCELLED" }
      - { name: priority_score, type: integer, source: computed, description: "0..100, computed at TRIAGED (calc work_order_priority_score); null before" }
      - { name: priority_tier, type: enum, source: computed, description: "P1 | P2 | P3 derived from priority_score bands; null before TRIAGED" }
      - { name: blocked_reason, type: string, source: input, description: "Required when transitioning IN_PROGRESS -> BLOCKED; null otherwise" }

  - name: PartnerAgency
    parent: null
    common_fields: true
    fields:
      - { name: name, type: string, source: input, description: "Agency name" }
      - { name: kind, type: enum, source: input, description: "EMERGENCY_MANAGEMENT | NONPROFIT | LTRG (long-term recovery group)" }
      - { name: contact_email, type: string, source: input, description: "Agency contact email" }

  - name: TrainingCourse
    parent: null
    common_fields: true
    fields:
      - { name: title, type: string, source: input, description: "Course title" }
      - { name: grants_cert_kind, type: enum, source: input, description: "CHAINSAW | HEAVY_EQUIPMENT | STRUCTURAL | MEDICAL; cert kind granted on completion" }
      - { name: capacity, type: integer, source: input, description: "Seat capacity; >= 1 and <= MAX_COURSE_CAPACITY(50)" }
      - { name: starts_at, type: datetime, source: input, description: "Course start (ISO8601)" }
      - { name: lead_instructor_volunteer_id, type: string, source: input, description: "Reference to Volunteer.id of lead instructor; validated: must exist and have instructor_certified == true" }
      - { name: seats_taken, type: integer, source: computed, description: "Count of TrainingEnrollments with course_id == this.id and status == ENROLLED" }

  - name: TrainingEnrollment
    parent: null
    common_fields: true
    fields:
      - { name: course_id, type: string, source: input, description: "FK -> TrainingCourse.id; course enrolled in" }
      - { name: volunteer_id, type: string, source: input, description: "FK -> Volunteer.id; enrolled volunteer" }
      - { name: status, type: enum, source: system, description: "ENROLLED | WAITLISTED | COMPLETED | FAILED | DROPPED" }
      - { name: waitlist_position, type: integer, source: computed, description: "1-based position among WAITLISTED enrollments ordered by created_at ASC; null when not WAITLISTED" }

  - name: WellnessCheck
    parent: null
    common_fields: true
    fields:
      - { name: deployment_id, type: string, source: system, description: "FK -> Deployment.id; deployment whose demobilization raised this check" }
      - { name: reason, type: enum, source: system, description: "FATIGUE_THRESHOLD | LONG_DEPLOYMENT; set by the demobe cascade" }
      - { name: status, type: enum, source: system, description: "OPEN | RESOLVED" }
      - { name: resolved_notes, type: string, source: input, description: "Required when resolving; null while OPEN" }

# =============================================================================
# §1.2 State Machine Table
# =============================================================================
state_machines:
  - entity: Volunteer
    field: readiness_status
    initial_state: REGISTERED
    terminal_states: [INACTIVE]
    transitions:
      - from: REGISTERED
        to: VETTED
        trigger: "PATCH /vdr/volunteers/{id} with readiness_status=VETTED"
        actor: SafetyOfficer
        preconditions:
          - "full_name, email, home_region, and at least one skill present"
        side_effects: []
      - from: VETTED
        to: DEPLOYABLE
        trigger: "PATCH /vdr/volunteers/{id} with readiness_status=DEPLOYABLE"
        actor: SafetyOfficer
        preconditions:
          - "Volunteer holds >= MIN_VERIFIED_CERTS_FOR_DEPLOYABLE(1) Certification with status == VERIFIED"
        side_effects:
          - "Recompute operational_readiness_score and readiness_score (calc volunteer_readiness_score)"
      - from: DEPLOYABLE
        to: SUSPENDED
        trigger: "PATCH /vdr/volunteers/{id} with readiness_status=SUSPENDED"
        actor: SafetyOfficer
        preconditions: []
        side_effects:
          - "Volunteer ineligible for new deployment offers while SUSPENDED"
      - from: SUSPENDED
        to: DEPLOYABLE
        trigger: "PATCH /vdr/volunteers/{id} with readiness_status=DEPLOYABLE"
        actor: SafetyOfficer
        preconditions:
          - "No WellnessCheck with deployment_id in (deployments of this volunteer) and status == OPEN (ERR_OPEN_WELLNESS_CHECKS)"
          - "Volunteer holds >= 1 Certification with status == VERIFIED"
        side_effects:
          - "Recompute operational_readiness_score and readiness_score"
      - from: DEPLOYABLE
        to: VETTED
        trigger: "system (ops run: last VERIFIED cert flipped to EXPIRED leaving zero VERIFIED certs)"
        actor: system
        preconditions:
          - "After the ops-run expiry sweep the volunteer holds zero VERIFIED certifications"
        side_effects:
          - "Recompute operational_readiness_score and readiness_score (drop to cert-free value)"
      - from: [VETTED, SUSPENDED]
        to: INACTIVE
        trigger: "PATCH /vdr/volunteers/{id} with readiness_status=INACTIVE"
        actor: SafetyOfficer
        preconditions:
          - "No Deployment of this volunteer in status IN {OFFERED, ACCEPTED, ON_SITE, SAFETY_HOLD}"
        side_effects: []

  - entity: Certification
    field: status
    initial_state: PENDING_VERIFICATION
    terminal_states: [REVOKED, REJECTED]
    transitions:
      - from: PENDING_VERIFICATION
        to: VERIFIED
        trigger: "PATCH /vdr/certifications/{id} with status=VERIFIED"
        actor: SafetyOfficer
        preconditions:
          - "current_utc <= expires_at (credential not already expired)"
        side_effects:
          - "verified_by_user_id := acting X-User-ID"
          - "Recompute owner Volunteer operational_readiness_score and readiness_score"
      - from: PENDING_VERIFICATION
        to: REJECTED
        trigger: "PATCH /vdr/certifications/{id} with status=REJECTED"
        actor: SafetyOfficer
        preconditions: []
        side_effects: []
      - from: VERIFIED
        to: EXPIRED
        trigger: "system (ops run: current_utc > expires_at, strictly greater)"
        actor: system
        preconditions:
          - "current_utc > expires_at at ops-run evaluation"
        side_effects:
          - "Recompute owner Volunteer readiness scores"
          - "If owner now holds zero VERIFIED certs and readiness_status == DEPLOYABLE: Volunteer DEPLOYABLE -> VETTED (auto downgrade)"
      - from: EXPIRED
        to: VERIFIED
        trigger: "PATCH /vdr/certifications/{id} with status=VERIFIED and new expires_at"
        actor: SafetyOfficer
        preconditions:
          - "Request carries a new expires_at strictly greater than current_utc"
        side_effects:
          - "renewal_count += 1; expires_at := new value; verified_by_user_id := acting X-User-ID"
          - "Recompute owner Volunteer readiness scores"
      - from: VERIFIED
        to: REVOKED
        trigger: "PATCH /vdr/certifications/{id} with status=REVOKED"
        actor: SafetyOfficer
        preconditions: []
        side_effects:
          - "Cascade hop 1: every Deployment with volunteer_id == owner and status == ON_SITE whose Operation.required_capabilities contains this cert's kind AND for which the owner holds no other VERIFIED cert of that kind -> SAFETY_HOLD"
          - "Cascade hop 2 (from each SAFETY_HOLD deployment): operation capability_gap recomputed; if gap for the affected kind > 0, every WorkOrder with operation_id == that operation, status == IN_PROGRESS, and hazard_kind mapped to that capability -> BLOCKED with blocked_reason=CAPABILITY_LOST"
          - "Recompute owner Volunteer readiness scores"

  - entity: Incident
    field: status
    initial_state: REPORTED
    terminal_states: [CLOSED, CANCELLED]
    transitions:
      - from: REPORTED
        to: ASSESSED
        trigger: "PATCH /vdr/incidents/{id} with status=ASSESSED plus severity and affected_households"
        actor: IncidentCommander
        preconditions:
          - "severity in 1..5 and affected_households >= 0 present in request"
        side_effects: []
      - from: ASSESSED
        to: TYPED
        trigger: "PATCH /vdr/incidents/{id} with status=TYPED plus incident_type"
        actor: IncidentCommander
        preconditions:
          - "incident_type present and valid enum"
        side_effects: []
      - from: TYPED
        to: STANDING_DOWN
        trigger: "PATCH /vdr/incidents/{id} with status=STANDING_DOWN"
        actor: IncidentCommander
        preconditions: []
        side_effects:
          - "Cascade hop 1: every Operation with incident_id == this.id and status IN {MUSTERED, ACTIVE} -> DEMOBILIZING"
          - "Cascade hop 2 (from each demobilizing operation): every Deployment with operation_id == operation.id and status IN {ON_SITE, SAFETY_HOLD} -> DEMOBED (full demobe side effects: bunk release, final stipend, fatigue reset eligibility, WellnessCheck auto-creation); every Deployment in {OFFERED, ACCEPTED} -> EXPIRED"
          - "Cascade hop 3 (from each demobed deployment with needs_lodging and fob_site_id set): FobSite.bunks_occupied decremented and lodging_cost_cents finalized"
          - "Operations in status DRAFT or OPEN -> CANCELLED; their OFFERED/ACCEPTED deployments -> EXPIRED"
      - from: STANDING_DOWN
        to: CLOSED
        trigger: "PATCH /vdr/incidents/{id} with status=CLOSED"
        actor: IncidentCommander
        preconditions:
          - "Every Operation with incident_id == this.id is in a terminal state (COMPLETE or CANCELLED)"
        side_effects: []
      - from: [REPORTED, ASSESSED]
        to: CANCELLED
        trigger: "PATCH /vdr/incidents/{id} with status=CANCELLED"
        actor: IncidentCommander
        preconditions: []
        side_effects: []

  - entity: Operation
    field: status
    initial_state: DRAFT
    terminal_states: [COMPLETE, CANCELLED]
    transitions:
      - from: DRAFT
        to: OPEN
        trigger: "PATCH /vdr/operations/{id} with status=OPEN"
        actor: OperationsLead
        preconditions:
          - "Incident of operation_id ... incident_id has status == TYPED"
        side_effects: []
      - from: OPEN
        to: MUSTERED
        trigger: "PATCH /vdr/operations/{id} with status=MUSTERED"
        actor: OperationsLead
        preconditions:
          - "rostered_count == team_size_required (exactly equal, not >=)"
          - "capability_gap is empty (every required capability covered by >= 1 rostered volunteer with VERIFIED cert; ERR_CAPABILITY_GAP otherwise)"
        side_effects: []
      - from: MUSTERED
        to: ACTIVE
        trigger: "PATCH /vdr/operations/{id} with status=ACTIVE"
        actor: OperationsLead
        preconditions:
          - ">= 1 Deployment of this operation has status == ON_SITE"
        side_effects: []
      - from: ACTIVE
        to: DEMOBILIZING
        trigger: "PATCH /vdr/operations/{id} with status=DEMOBILIZING"
        actor: OperationsLead
        preconditions:
          - "No WorkOrder with operation_id == this.id has status == IN_PROGRESS (ERR_WORK_ORDER_BLOCKING)"
        side_effects: []
      - from: DEMOBILIZING
        to: COMPLETE
        trigger: "PATCH /vdr/operations/{id} with status=COMPLETE"
        actor: OperationsLead
        preconditions:
          - "aar_status == ADOPTED (ERR_AAR_NOT_ADOPTED)"
          - "No Deployment of this operation in status IN {ON_SITE, SAFETY_HOLD}"
        side_effects: []
      - from: [DRAFT, OPEN]
        to: CANCELLED
        trigger: "PATCH /vdr/operations/{id} with status=CANCELLED or system (incident stand-down)"
        actor: "OperationsLead or system"
        preconditions: []
        side_effects:
          - "Deployments of this operation in OFFERED or ACCEPTED -> EXPIRED"

  - entity: Operation
    field: aar_status
    initial_state: NONE
    terminal_states: [ADOPTED]
    note: "Parallel state dimension on Operation; evolves independently of status but gates status=COMPLETE"
    transitions:
      - from: NONE
        to: SUBMITTED
        trigger: "PATCH /vdr/operations/{id} with aar_status=SUBMITTED plus aar_notes"
        actor: OperationsLead
        preconditions:
          - "Operation status IN {ACTIVE, DEMOBILIZING}"
          - "aar_notes non-empty"
        side_effects:
          - "aar_submitted_by_role := acting X-User-Role"
      - from: SUBMITTED
        to: ADOPTED
        trigger: "PATCH /vdr/operations/{id} with aar_status=ADOPTED"
        actor: IncidentCommander
        preconditions:
          - "aar_submitted_by_role != acting role (segregation of duties: submitter cannot adopt)"
        side_effects: []

  - entity: Deployment
    field: status
    initial_state: OFFERED
    terminal_states: [DECLINED, EXPIRED, NO_SHOW, DEMOBED]
    transitions:
      - from: OFFERED
        to: ACCEPTED
        trigger: "PATCH /vdr/deployments/{id} with status=ACCEPTED"
        actor: Volunteer
        preconditions:
          - "Acting X-User-ID == deployment.volunteer_id (ownership)"
          - "Operation.status IN {OPEN, MUSTERED} (ERR_OPERATION_NOT_OPEN)"
          - "Volunteer.readiness_status == DEPLOYABLE (ERR_VOLUNTEER_NOT_DEPLOYABLE)"
          - "Volunteer holds >= 1 VERIFIED Certification whose kind is in Operation.required_capabilities (ERR_CERT_NOT_VERIFIED)"
          - "[planned_start, planned_end] fully contained in one Volunteer.availability_windows entry (ERR_AVAILABILITY_WINDOW_MISMATCH)"
          - "No other Deployment of this volunteer with status IN {ACCEPTED, ON_SITE, SAFETY_HOLD, DEMOBED} whose window ends within REST_BUFFER_HOURS(24) before planned_start (ERR_DEPLOYMENT_WINDOW_CONFLICT)"
        side_effects:
          - "Compute stipend_provisional_cents (calc deployment_stipend_cents, provisional variant)"
          - "Recompute Operation.rostered_count and capability_gap"
      - from: OFFERED
        to: DECLINED
        trigger: "PATCH /vdr/deployments/{id} with status=DECLINED"
        actor: Volunteer
        preconditions:
          - "Acting X-User-ID == deployment.volunteer_id"
        side_effects: []
      - from: OFFERED
        to: EXPIRED
        trigger: "system (ops run: offer older than CALL_UP_RESPONSE_HOURS(48) with no response)"
        actor: system
        preconditions:
          - "current_utc > created_at + CALL_UP_RESPONSE_HOURS(48)"
        side_effects: []
      - from: ACCEPTED
        to: ON_SITE
        trigger: "PATCH /vdr/deployments/{id} with status=ON_SITE (check-in)"
        actor: OperationsLead
        preconditions:
          - "If needs_lodging: some FobSite of this operation has bunks_occupied < bunks_total (ERR_FOB_CAPACITY_EXCEEDED); selector: FOB with most free bunks, tie-break created_at ASC"
        side_effects:
          - "checked_in_at := current_utc"
          - "If needs_lodging: fob_site_id := selected FOB; FobSite.bunks_occupied += 1"
          - "Recompute Operation.rostered_count and capability_gap"
      - from: ACCEPTED
        to: NO_SHOW
        trigger: "system (ops run: not checked in by start_date + NO_SHOW_GRACE_HOURS(24))"
        actor: system
        preconditions:
          - "current_utc > Operation.start_date + NO_SHOW_GRACE_HOURS(24) and status still ACCEPTED"
        side_effects:
          - "Recompute Operation.rostered_count and capability_gap"
      - from: ON_SITE
        to: SAFETY_HOLD
        trigger: "system (cascade from Certification revocation)"
        actor: system
        preconditions:
          - "Cert revocation cascade selected this deployment"
        side_effects:
          - "Deployment excluded from new duty-shift scheduling while on hold"
      - from: SAFETY_HOLD
        to: ON_SITE
        trigger: "PATCH /vdr/deployments/{id} with status=ON_SITE (clear hold)"
        actor: SafetyOfficer
        preconditions:
          - "Volunteer holds VERIFIED certs covering all Operation.required_capabilities again"
        side_effects:
          - "Recompute Operation.capability_gap"
      - from: [ON_SITE, SAFETY_HOLD]
        to: DEMOBED
        trigger: "PATCH /vdr/deployments/{id} with status=DEMOBED or system (incident stand-down cascade)"
        actor: "OperationsLead or system"
        preconditions:
          - "No DutyShift of this deployment with status == SCHEDULED and ends_at > current_utc"
        side_effects:
          - "demobed_at := current_utc; duty_status := RESTING"
          - "If fob_site_id set: FobSite.bunks_occupied -= 1; finalize FobSite.lodging_cost_cents for this stay (calc fob_lodging_cost_cents)"
          - "Compute stipend_final_cents (calc deployment_stipend_cents, final variant)"
          - "DutyShifts of this deployment still SCHEDULED -> CANCELLED"
          - "If Volunteer.fatigue_hours >= WELLNESS_FATIGUE_THRESHOLD_HOURS(30) or actual on-site days >= WELLNESS_LONG_DEPLOYMENT_DAYS(10): create WellnessCheck OPEN with reason FATIGUE_THRESHOLD or LONG_DEPLOYMENT"
          - "Recompute Operation.rostered_count and capability_gap"

  - entity: Deployment
    field: duty_status
    initial_state: RESTING
    terminal_states: []
    note: "Parallel dimension; independent of status while status == ON_SITE"
    transitions:
      - from: RESTING
        to: ON_DUTY
        trigger: "POST /vdr/operations/{id}/duty-shifts creates a SCHEDULED shift for this deployment with starts_at <= current_utc < ends_at"
        actor: system
        preconditions: []
        side_effects: []
      - from: ON_DUTY
        to: RESTING
        trigger: "system (ops run completes the shift, or deployment demobed)"
        actor: system
        preconditions: []
        side_effects:
          - "Volunteer.fatigue_hours += completed shift hours (calc duty_fatigue_hours)"

  - entity: WorkOrder
    field: status
    initial_state: INTAKE
    terminal_states: [VERIFIED_DONE, CANCELLED]
    transitions:
      - from: INTAKE
        to: TRIAGED
        trigger: "POST /vdr/work-orders/{id}/triage (OCC-guarded)"
        actor: IntakeCoordinator
        preconditions:
          - "expected_work_order_version matches current version (ERR_STALE_VERSION)"
        side_effects:
          - "Compute priority_score and priority_tier (calc work_order_priority_score)"
      - from: TRIAGED
        to: SCHEDULED
        trigger: "PATCH /vdr/work-orders/{id} with status=SCHEDULED plus operation_id"
        actor: IntakeCoordinator
        preconditions:
          - "Incident of this work order has status == TYPED (ERR_INCIDENT_NOT_TYPED)"
          - "Target Operation.status IN {MUSTERED, ACTIVE}"
          - "Target Operation.hazard_focus == work order hazard_kind (ERR_HAZARD_MISMATCH)"
          - "Pinned hazard->capability map: TREE_REMOVAL->CHAINSAW, DEBRIS->HEAVY_EQUIPMENT, STRUCTURAL->STRUCTURAL, TARPING->STRUCTURAL, MUCK_OUT->none"
          - "If hazard maps to a capability: target Operation.capability_gap has no positive entry for it (ERR_CAPABILITY_GAP); MUCK_OUT skips this check"
        side_effects:
          - "operation_id := target operation"
      - from: SCHEDULED
        to: IN_PROGRESS
        trigger: "PATCH /vdr/work-orders/{id} with status=IN_PROGRESS"
        actor: OperationsLead
        preconditions:
          - "Operation.status == ACTIVE"
        side_effects: []
      - from: IN_PROGRESS
        to: BLOCKED
        trigger: "PATCH /vdr/work-orders/{id} with status=BLOCKED plus blocked_reason, or system (cert-revocation cascade)"
        actor: "OperationsLead or system"
        preconditions:
          - "Manual block: blocked_reason non-empty"
        side_effects: []
      - from: BLOCKED
        to: SCHEDULED
        trigger: "PATCH /vdr/work-orders/{id} with status=SCHEDULED (unblock)"
        actor: OperationsLead
        preconditions:
          - "If hazard maps to a capability per the pinned map: Operation.capability_gap has no positive entry for it (ERR_CAPABILITY_GAP)"
        side_effects:
          - "blocked_reason := null"
      - from: IN_PROGRESS
        to: DONE_PENDING_VERIFICATION
        trigger: "PATCH /vdr/work-orders/{id} with status=DONE_PENDING_VERIFICATION"
        actor: OperationsLead
        preconditions: []
        side_effects: []
      - from: DONE_PENDING_VERIFICATION
        to: VERIFIED_DONE
        trigger: "PATCH /vdr/work-orders/{id} with status=VERIFIED_DONE"
        actor: IntakeCoordinator
        preconditions: []
        side_effects: []
      - from: [INTAKE, TRIAGED, SCHEDULED]
        to: CANCELLED
        trigger: "PATCH /vdr/work-orders/{id} with status=CANCELLED"
        actor: IntakeCoordinator
        preconditions: []
        side_effects: []

  - entity: TrainingEnrollment
    field: status
    initial_state: ENROLLED
    note: "Creation lands in ENROLLED when course.seats_taken < capacity, else WAITLISTED"
    terminal_states: [COMPLETED, FAILED, DROPPED]
    transitions:
      - from: ENROLLED
        to: COMPLETED
        trigger: "PATCH /vdr/training-enrollments/{id} with status=COMPLETED"
        actor: TrainingDirector
        preconditions:
          - "current_utc >= course.starts_at (course has begun)"
        side_effects:
          - "Create Certification for the volunteer: kind := course.grants_cert_kind, status := PENDING_VERIFICATION, issued_at := current_utc, expires_at := current_utc + CERT_GRANT_VALIDITY_DAYS(730)"
          - "seats_taken unchanged by completion (seat stays consumed until drop/course end is irrelevant; seat freed only on DROPPED)"
      - from: ENROLLED
        to: FAILED
        trigger: "PATCH /vdr/training-enrollments/{id} with status=FAILED"
        actor: TrainingDirector
        preconditions:
          - "current_utc >= course.starts_at"
        side_effects: []
      - from: [ENROLLED, WAITLISTED]
        to: DROPPED
        trigger: "PATCH /vdr/training-enrollments/{id} with status=DROPPED"
        actor: "Volunteer (own enrollment) or TrainingDirector"
        preconditions:
          - "If actor is Volunteer: acting X-User-ID == enrollment.volunteer_id"
        side_effects:
          - "If was ENROLLED: course.seats_taken -= 1 (compensating invariant: enroll + drop restores seats_taken)"
      - from: WAITLISTED
        to: ENROLLED
        trigger: "system (ops run waitlist promotion when course.seats_taken < course.capacity)"
        actor: system
        preconditions:
          - "course.seats_taken < course.capacity"
          - "Selector: WAITLISTED enrollments of the course ordered by created_at ASC; promote while free seats remain"
        side_effects:
          - "course.seats_taken += 1 per promoted enrollment; waitlist_position recomputed"

  - entity: WellnessCheck
    field: status
    initial_state: OPEN
    terminal_states: [RESOLVED]
    transitions:
      - from: OPEN
        to: RESOLVED
        trigger: "PATCH /vdr/wellness-checks/{id} with status=RESOLVED plus resolved_notes"
        actor: SafetyOfficer
        preconditions:
          - "resolved_notes non-empty"
        side_effects: []

  - entity: DutyShift
    field: status
    initial_state: SCHEDULED
    terminal_states: [COMPLETED, CANCELLED]
    transitions:
      - from: SCHEDULED
        to: COMPLETED
        trigger: "system (ops run: ends_at <= current_utc)"
        actor: system
        preconditions:
          - "ends_at <= current_utc at ops-run evaluation"
        side_effects:
          - "Volunteer.fatigue_hours += shift duration hours (calc duty_fatigue_hours)"
          - "If no other SCHEDULED in-window shift for the deployment: Deployment.duty_status ON_DUTY -> RESTING"
      - from: SCHEDULED
        to: CANCELLED
        trigger: "system (deployment demobed) "
        actor: system
        preconditions: []
        side_effects: []

# =============================================================================
# §1.2.1 Concurrency Rules (OCC only)
# =============================================================================
concurrency_rules:
  - rule_id: retype-operation-stale-version
    parent_entity: Operation
    write_endpoint: "POST /vdr/operations/{id}/retype"
    occ_field: expected_operation_version
    description: |
      Retyping an Operation whose version has advanced since the client last
      observed it is rejected. Typing determines team_size_required,
      duration_days, and required_capabilities; a writer holding a stale view
      would silently overwrite another writer's just-applied typing.
    error_id: ERR_STALE_VERSION
    http_status: 412
  - rule_id: triage-work-order-stale-version
    parent_entity: WorkOrder
    write_endpoint: "POST /vdr/work-orders/{id}/triage"
    occ_field: expected_work_order_version
    description: |
      Triaging a WorkOrder whose version has advanced since the client last
      observed it is rejected. A second triage legitimately supersedes the
      prior priority verdict, so the client must present the version it
      observed; a stale version indicates a superseding triage already landed.
    error_id: ERR_STALE_VERSION
    http_status: 412

# =============================================================================
# §1.3 Calculation Rules Table
# =============================================================================
calculations:
  - name: deployment_stipend_cents
    trigger: "Deployment OFFERED->ACCEPTED (provisional variant) and ->DEMOBED (final variant)"
    algorithm: forward_looking
    description: "Per-deployment stipend. Mode (c) circular-looking dependency: travel tier band is keyed on the per-diem subtotal, and the total = per_diem + travel; evaluation order is pinned so the value is well-defined."
    formula: |
      # PINNED EVALUATION ORDER (resolves the apparent circle):
      # 1. days := variant-specific day count (see variants)
      # 2. per_diem_total := days * PER_DIEM_DAILY_CENTS
      # 3. travel_tier := LONG if per_diem_total >= TRAVEL_TIER_THRESHOLD_CENTS else SHORT
      # 4. travel_allowance := TRAVEL_TIER_LONG_CENTS or TRAVEL_TIER_SHORT_CENTS
      # 5. stipend := per_diem_total + travel_allowance   (integer cents, no rounding needed)
    input_set: "The Deployment and its Operation (duration_days for provisional; checked_in_at/demobed_at for final)"
    constants:
      PER_DIEM_DAILY_CENTS: 6500
      TRAVEL_TIER_THRESHOLD_CENTS: 200000
      TRAVEL_TIER_SHORT_CENTS: 15000
      TRAVEL_TIER_LONG_CENTS: 45000
    precision: "integer cents (no rounding)"
    variants:
      - name: provisional
        when: "Computed when Deployment -> ACCEPTED; stored in stipend_provisional_cents"
        difference: "days := Operation.duration_days (forward-looking plan)"
      - name: final
        when: "Computed when Deployment -> DEMOBED; stored in stipend_final_cents"
        difference: "days := ceil((demobed_at - checked_in_at) / 24h), minimum 1 (chronological actuals); provisional and final therefore differ whenever actual days != duration_days"

  - name: volunteer_readiness_score
    trigger: "Recomputed on: cert VERIFIED/EXPIRED/REVOKED/renewed for the volunteer, volunteer readiness transitions into DEPLOYABLE, and fatigue_hours change"
    algorithm: weighted_scoring
    description: "Dual-variant readiness on Volunteer (different entity domain than deployment_stipend_cents). Variant A ignores wellness; variant B subtracts a fatigue penalty."
    formula: |
      # Variant A (operational_readiness_score):
      #   if zero VERIFIED certs: 0
      #   else: READINESS_BASE(10) + sum over distinct VERIFIED cert kinds of CERT_WEIGHT[kind]
      # Variant B (readiness_score, wellness-adjusted):
      #   max(READINESS_FLOOR(0), operational_readiness_score - fatigue_hours * FATIGUE_PENALTY_PER_HOUR(2))
    input_set: "Certifications of the volunteer with status == VERIFIED only (PENDING_VERIFICATION, EXPIRED, REVOKED, REJECTED excluded); Volunteer.fatigue_hours"
    constants:
      READINESS_BASE: 10
      CERT_WEIGHT_CHAINSAW: 30
      CERT_WEIGHT_HEAVY_EQUIPMENT: 25
      CERT_WEIGHT_STRUCTURAL: 25
      CERT_WEIGHT_MEDICAL: 20
      FATIGUE_PENALTY_PER_HOUR: 2
      READINESS_FLOOR: 0
    precision: "integer points"
    variants:
      - name: operational
        when: "Stored in operational_readiness_score"
        difference: "Ignores fatigue entirely"
      - name: wellness_adjusted
        when: "Stored in readiness_score"
        difference: "Subtracts fatigue_hours * FATIGUE_PENALTY_PER_HOUR, floored at 0; identical inputs, different result whenever fatigue_hours > 0"

  - name: work_order_priority_score
    trigger: "WorkOrder INTAKE->TRIAGED"
    algorithm: weighted_scoring
    description: "Combinatorial mode (a): >= 3 inputs with non-linear interaction (conditional vulnerable branch + nested min-cap on age boost + outer cap at 100)."
    formula: |
      # wait_hours := hours between work order created_at and current_utc at triage
      # base := HAZARD_BASE[hazard_kind]
      # bonus := VULNERABLE_RESIDENT_BONUS(40) if vulnerable_resident else 0
      # age_boost := min(AGE_BOOST_CAP(20), floor(wait_hours / 24) * AGE_BOOST_PER_DAY(5))
      # score := min(100, base + bonus + age_boost)
      # tier := P1 if score >= P1_THRESHOLD(80) else P2 if score >= P2_THRESHOLD(50) else P3
    input_set: "The WorkOrder being triaged (hazard_kind, vulnerable_resident, created_at); current_utc"
    constants:
      HAZARD_BASE_TREE_REMOVAL: 50
      HAZARD_BASE_STRUCTURAL: 60
      HAZARD_BASE_MUCK_OUT: 30
      HAZARD_BASE_TARPING: 35
      HAZARD_BASE_DEBRIS: 20
      VULNERABLE_RESIDENT_BONUS: 40
      AGE_BOOST_PER_DAY: 5
      AGE_BOOST_CAP: 20
      P1_THRESHOLD: 80
      P2_THRESHOLD: 50
    precision: "integer points"
    variants: []

  - name: fob_lodging_cost_cents
    trigger: "Deployment DEMOBED with fob_site_id set (finalizes the stay into the FOB ledger)"
    algorithm: aggregation
    description: "Combinatorial mode (b): nested rounding where order matters. PINNED ORDER: round each night's charge to integer cents first, then sum nights. Sum-then-round yields different cents and is forbidden."
    formula: |
      # nights := number of UTC calendar dates from date(checked_in_at) inclusive to date(demobed_at) exclusive; minimum 1
      # nightly_charge := round_half_up(nightly_rate_cents * (1 + FOB_UTILITY_SURCHARGE_PCT(0.07)))   # round PER NIGHT first
      # stay_cost := nights * nightly_charge
      # FobSite.lodging_cost_cents += stay_cost
    input_set: "The demobing Deployment (checked_in_at, demobed_at) and its FobSite (nightly_rate_cents)"
    constants:
      FOB_UTILITY_SURCHARGE_PCT: 0.07
    precision: "round_half_up to integer cents PER NIGHT, then integer sum"
    variants: []

  - name: duty_fatigue_hours
    trigger: "DutyShift SCHEDULED->COMPLETED at ops run; fatigue reset evaluated at the same ops run"
    algorithm: chronological
    description: "Accumulates completed shift hours onto Volunteer.fatigue_hours in shift ends_at order; resets to 0 when the volunteer has had no ON_DUTY shift for >= REST_RESET_HOURS(24)."
    formula: |
      # On each shift completion (processed in ends_at ASC order, tie-break created_at ASC):
      #   volunteer.fatigue_hours += shift_hours (= ceil((ends_at - starts_at)/1h), minimum 1)
      # Reset rule (evaluated per volunteer at ops run, AFTER all completions):
      #   if current_utc - max(ends_at of volunteer's COMPLETED shifts) >= REST_RESET_HOURS(24)
      #   and no SCHEDULED shift with starts_at <= current_utc < ends_at exists:
      #     volunteer.fatigue_hours := 0
      # Then recompute readiness_score (wellness-adjusted variant).
    input_set: "DutyShifts with status COMPLETED for the volunteer; logical clock"
    constants:
      REST_RESET_HOURS: 24
      MAX_FATIGUE_HOURS: 40
    precision: "integer hours"
    variants: []

  - name: operation_capability_gap
    trigger: "Recomputed on every Deployment status change of the operation and on cert revocation cascade"
    algorithm: aggregation
    description: "For each capability in Operation.required_capabilities: covered := count of rostered deployments (status IN {ACCEPTED, ON_SITE, SAFETY_HOLD}) whose volunteer holds a VERIFIED cert of that kind; shortfall := 1 - covered, clamped at >= 0; entries with shortfall 0 are omitted from the map."
    formula: |
      # rostered := Deployments with operation_id == op.id and status IN {ACCEPTED, ON_SITE}
      # for cap in op.required_capabilities:
      #   covered := count(rostered d where exists Certification(volunteer_id == d.volunteer_id, kind == cap, status == VERIFIED))
      #   shortfall := max(0, 1 - covered)
      #   if shortfall > 0: capability_gap[cap] := shortfall
      # rostered_count := |rostered|
    input_set: "Deployments of the operation in {ACCEPTED, ON_SITE}; VERIFIED certifications of their volunteers"
    constants: {}
    precision: "integer counts"
    variants: []

  - name: fob_occupancy
    trigger: "Deployment check-in (consumes bunk) and demobe (releases bunk)"
    algorithm: threshold
    description: "bunks_occupied tracked per FobSite; check-in admissible iff bunks_occupied < bunks_total (strictly less). At bunks_occupied == bunks_total the FOB is full and check-in fails with ERR_FOB_CAPACITY_EXCEEDED. Boundary: occupied == capacity-1 admits exactly one more."
    formula: |
      # bunks_occupied := count(Deployments with fob_site_id == fob.id and status IN {ON_SITE, SAFETY_HOLD})
      # admission predicate: bunks_occupied < bunks_total
    input_set: "Deployments pointing at the FobSite in {ON_SITE, SAFETY_HOLD}"
    constants: {}
    precision: "integer bunks"
    variants: []

# =============================================================================
# §1.4 Validation Rules Table (ordered by priority; lower number wins when a
# request violates multiple rules)
# =============================================================================
validations:
  - priority: 1
    category: auth
    check: "Request body schema valid: required fields present, types correct, enum members valid, planned_end > planned_start, starts_at < ends_at; unknown fields rejected"
    error_id: ERR_VALIDATION
    http_status: 400
    applies_to: "all"
  - priority: 2
    category: auth
    check: "X-User-ID and X-User-Role headers present and well-formed"
    error_id: ERR_UNAUTHENTICATED
    http_status: 401
    applies_to: "all"
  - priority: 3
    category: auth
    check: "Acting role is listed in the endpoint's roles; entity-backed ownership: Volunteer acting on own record/enrollment/deployment; PartnerLiaison creating work orders sets source_partner_id == own PartnerAgency id"
    error_id: ERR_UNAUTHORIZED
    http_status: 403
    applies_to: "all"
  - priority: 4
    category: existence
    check: "Path ids resolve to existing entities, validated left-to-right (volunteer -> certification; incident -> operation -> deployment/fob-site/duty-shift; work-order; training-course -> enrollment; wellness-check)"
    error_id: ERR_VOLUNTEER_NOT_FOUND
    http_status: 404
    applies_to: "all endpoints with path ids; the error_id is the per-entity NOT_FOUND of the FIRST unresolvable path segment"
    note: "per-entity ids: ERR_VOLUNTEER_NOT_FOUND, ERR_CERTIFICATION_NOT_FOUND, ERR_INCIDENT_NOT_FOUND, ERR_OPERATION_NOT_FOUND, ERR_DEPLOYMENT_NOT_FOUND, ERR_FOB_SITE_NOT_FOUND, ERR_DUTY_SHIFT_NOT_FOUND, ERR_WORK_ORDER_NOT_FOUND, ERR_PARTNER_NOT_FOUND, ERR_TRAINING_COURSE_NOT_FOUND, ERR_ENROLLMENT_NOT_FOUND, ERR_WELLNESS_CHECK_NOT_FOUND"
  - priority: 5
    category: state
    check: "OCC: expected_<parent>_version matches the parent's current version"
    error_id: ERR_STALE_VERSION
    http_status: 412
    applies_to: ["POST /vdr/operations/{id}/retype", "POST /vdr/work-orders/{id}/triage"]
  - priority: 6
    category: state
    check: "Target entity is in a from-state for the requested transition (invalid or repeated transition rejected; terminal states reject all transitions)"
    error_id: ERR_INVALID_STATE
    http_status: 409
    applies_to: "all PATCH transition endpoints"
  - priority: 7
    category: business_safety
    check: "Safety-gated capability: for each Operation.required_capabilities entry, accepting volunteer holds a VERIFIED Certification of that kind; duty-shift of kind SAFETY_WATCH requires a VERIFIED MEDICAL or STRUCTURAL cert on the deployment's volunteer"
    error_id: ERR_CERT_NOT_VERIFIED
    http_status: 422
    applies_to: ["PATCH /vdr/deployments/{id}", "POST /vdr/operations/{id}/duty-shifts"]
  - priority: 8
    category: business_safety
    check: "Volunteer readiness gate: readiness_status == DEPLOYABLE for offer/accept flows"
    error_id: ERR_VOLUNTEER_NOT_DEPLOYABLE
    http_status: 409
    applies_to: ["POST /vdr/operations/{id}/deployments", "PATCH /vdr/deployments/{id}"]
  - priority: 9
    category: business_safety
    check: "Reinstatement gate: SUSPENDED->DEPLOYABLE requires zero OPEN WellnessChecks on the volunteer's deployments and >= 1 VERIFIED cert"
    error_id: ERR_OPEN_WELLNESS_CHECKS
    http_status: 409
    applies_to: ["PATCH /vdr/volunteers/{id}"]
  - priority: 10
    category: business_safety
    check: "Instructor gate: TrainingCourse lead_instructor_volunteer_id must reference an existing Volunteer with instructor_certified == true"
    error_id: ERR_INSTRUCTOR_NOT_CERTIFIED
    http_status: 422
    applies_to: ["POST /vdr/training-courses"]
  - priority: 11
    category: business_temporal
    check: "Availability containment: [planned_start, planned_end] must lie entirely inside one availability_windows entry of the volunteer"
    error_id: ERR_AVAILABILITY_WINDOW_MISMATCH
    http_status: 422
    applies_to: ["PATCH /vdr/deployments/{id}"]
  - priority: 12
    category: business_temporal
    check: "Rest buffer: no other deployment of the volunteer in {ACCEPTED, ON_SITE, SAFETY_HOLD, DEMOBED} with planned_end (or demobed_at) within REST_BUFFER_HOURS(24) before planned_start; gap >= 24h required, exactly 24h is admissible"
    error_id: ERR_DEPLOYMENT_WINDOW_CONFLICT
    http_status: 409
    applies_to: ["PATCH /vdr/deployments/{id}"]
  - priority: 13
    category: business_temporal
    check: "Duty-shift overlap (half-open [starts_at, ends_at)): reject when another SCHEDULED/COMPLETED shift of the same deployment satisfies new.starts < existing.ends AND new.ends > existing.starts; adjacency (new.starts == existing.ends) is admissible"
    error_id: ERR_SHIFT_OVERLAP
    http_status: 409
    applies_to: ["POST /vdr/operations/{id}/duty-shifts"]
  - priority: 14
    category: business_constraint
    check: "Fatigue cap: new shift hours + volunteer.fatigue_hours must be <= MAX_FATIGUE_HOURS(40); equality admitted"
    error_id: ERR_FATIGUE_LIMIT_EXCEEDED
    http_status: 422
    applies_to: ["POST /vdr/operations/{id}/duty-shifts"]
  - priority: 15
    category: business_constraint
    check: "Capability coverage: operation muster requires capability_gap empty; work-order schedule/unblock requires no positive gap entry for hazard capability"
    error_id: ERR_CAPABILITY_GAP
    http_status: 422
    applies_to: ["PATCH /vdr/operations/{id}", "PATCH /vdr/work-orders/{id}"]
  - priority: 16
    category: business_constraint
    check: "Hazard alignment: work-order schedule requires target Operation.hazard_focus == work order hazard_kind"
    error_id: ERR_HAZARD_MISMATCH
    http_status: 422
    applies_to: ["PATCH /vdr/work-orders/{id}"]
  - priority: 17
    category: business_constraint
    check: "Offer ceiling: active offers (OFFERED + ACCEPTED + ON_SITE + SAFETY_HOLD) must stay <= team_size_required; the offer that would exceed it is rejected"
    error_id: ERR_TEAM_SIZE_EXCEEDED
    http_status: 422
    applies_to: ["POST /vdr/operations/{id}/deployments"]
  - priority: 18
    category: business_constraint
    check: "Duplicate enrollment: same volunteer may hold at most one enrollment per course with status IN {ENROLLED, WAITLISTED}"
    error_id: ERR_DUPLICATE_ENROLLMENT
    http_status: 409
    applies_to: ["POST /vdr/training-courses/{id}/enrollments"]
  - priority: 19
    category: business_referential
    check: "Operation-state gates: deployment accept requires Operation.status IN {OPEN, MUSTERED}; work-order schedule requires target Operation.status IN {MUSTERED, ACTIVE}"
    error_id: ERR_OPERATION_NOT_OPEN
    http_status: 409
    applies_to: ["PATCH /vdr/deployments/{id}", "PATCH /vdr/work-orders/{id}"]
  - priority: 20
    category: business_referential
    check: "Incident typed gate for work-order scheduling"
    error_id: ERR_INCIDENT_NOT_TYPED
    http_status: 409
    applies_to: ["PATCH /vdr/work-orders/{id}"]
  - priority: 21
    category: business_referential
    check: "Operation wind-down gates: demobilize rejected while any of its work orders is IN_PROGRESS (ERR_WORK_ORDER_BLOCKING); COMPLETE requires aar_status == ADOPTED (ERR_AAR_NOT_ADOPTED)"
    error_id: ERR_WORK_ORDER_BLOCKING
    http_status: 409
    applies_to: ["PATCH /vdr/operations/{id}"]
    note: "COMPLETE with aar_status != ADOPTED returns ERR_AAR_NOT_ADOPTED (same priority band, distinct error_id)"
  - priority: 22
    category: business_fiscal
    check: "FOB capacity: check-in with needs_lodging requires some FobSite of the operation with bunks_occupied < bunks_total"
    error_id: ERR_FOB_CAPACITY_EXCEEDED
    http_status: 422
    applies_to: ["PATCH /vdr/deployments/{id}"]

# =============================================================================
# §1.5 API Endpoint Table
# =============================================================================
endpoints:
  # --- Volunteers ---
  - method: POST
    path: "/vdr/volunteers"
    description: "Register a volunteer (readiness_status=REGISTERED, scores=0, fatigue_hours=0)"
    roles: [SystemAdmin]
    code: 201
    input: [full_name, email, home_region, skills, "availability_windows?", "instructor_certified?"]
    output: Volunteer
    side_effects: []
  - method: GET
    path: "/vdr/volunteers/{id}"
    description: "Get volunteer by id (includes computed readiness scores and fatigue_hours)"
    roles: [SystemAdmin, SafetyOfficer, OperationsLead, IncidentCommander, TrainingDirector, Volunteer]
    code: 200
    input: []
    output: Volunteer
    side_effects: []
  - method: PATCH
    path: "/vdr/volunteers/{id}"
    description: "Volunteer transitions: SafetyOfficer sets readiness_status (VETTED/DEPLOYABLE/SUSPENDED/INACTIVE); Volunteer (self) updates availability_windows only"
    roles: [SafetyOfficer, Volunteer]
    code: 200
    input: ["readiness_status?", "availability_windows?"]
    output: Volunteer
    side_effects: ["readiness transitions per Volunteer state machine; increments version"]
  # --- Certifications ---
  - method: POST
    path: "/vdr/volunteers/{id}/certifications"
    description: "Record a certification for a volunteer (status=PENDING_VERIFICATION)"
    roles: [TrainingDirector]
    code: 201
    input: [kind, issued_at, expires_at]
    output: Certification
    side_effects: []
  - method: GET
    path: "/vdr/certifications"
    description: "List certifications, filterable by volunteer_id and status"
    roles: [SystemAdmin, SafetyOfficer, TrainingDirector, OperationsLead, IncidentCommander, Volunteer]
    code: 200
    input: ["volunteer_id?", "status?"]
    output: Certification[]
    side_effects: []
  - method: GET
    path: "/vdr/certifications/{id}"
    description: "Get certification by id"
    roles: [SystemAdmin, SafetyOfficer, TrainingDirector, OperationsLead, IncidentCommander, Volunteer]
    code: 200
    input: []
    output: Certification
    side_effects: []
  - method: PATCH
    path: "/vdr/certifications/{id}"
    description: "Certification transitions: status=VERIFIED (verify or renew with new expires_at), REJECTED, REVOKED"
    roles: [SafetyOfficer]
    code: 200
    input: [status, "expires_at?"]
    output: Certification
    side_effects: ["verify/reject/revoke/renew per Certification state machine; revocation cascades to deployments and work orders; readiness scores recomputed; increments version"]
  # --- Incidents ---
  - method: POST
    path: "/vdr/incidents"
    description: "Report an incident (status=REPORTED)"
    roles: [IncidentCommander]
    code: 201
    input: [name, region]
    output: Incident
    side_effects: []
  - method: GET
    path: "/vdr/incidents/{id}"
    description: "Get incident by id"
    roles: [SystemAdmin, IncidentCommander, OperationsLead, IntakeCoordinator, SafetyOfficer, TrainingDirector, PartnerLiaison, Volunteer]
    code: 200
    input: []
    output: Incident
    side_effects: []
  - method: PATCH
    path: "/vdr/incidents/{id}"
    description: "Incident transitions: ASSESSED (+severity, affected_households), TYPED (+incident_type), STANDING_DOWN (cascades), CLOSED, CANCELLED"
    roles: [IncidentCommander]
    code: 200
    input: [status, "severity?", "affected_households?", "incident_type?"]
    output: Incident
    side_effects: ["stand-down cascade: operations demobilize/cancel, deployments demobe/expire, bunks release, wellness checks created; increments version"]
  # --- Operations ---
  - method: POST
    path: "/vdr/incidents/{id}/operations"
    description: "Create an operation under a TYPED incident (status=DRAFT, aar_status=NONE)"
    roles: [IncidentCommander]
    code: 201
    input: [title, hazard_focus, team_size_required, duration_days, required_capabilities, start_date]
    output: Operation
    side_effects: ["requires Incident.status == TYPED (ERR_INCIDENT_NOT_TYPED)"]
  - method: GET
    path: "/vdr/operations"
    description: "List operations, filterable by incident_id and status"
    roles: [SystemAdmin, IncidentCommander, OperationsLead, IntakeCoordinator, SafetyOfficer, Volunteer]
    code: 200
    input: ["incident_id?", "status?"]
    output: Operation[]
    side_effects: []
  - method: GET
    path: "/vdr/operations/{id}"
    description: "Get operation by id (includes rostered_count, capability_gap, aar_status)"
    roles: [SystemAdmin, IncidentCommander, OperationsLead, IntakeCoordinator, SafetyOfficer, Volunteer]
    code: 200
    input: []
    output: Operation
    side_effects: []
  - method: PATCH
    path: "/vdr/operations/{id}"
    description: "Operation transitions: status OPEN/MUSTERED/ACTIVE/DEMOBILIZING/COMPLETE/CANCELLED (OperationsLead); aar_status SUBMITTED (OperationsLead, +aar_notes) / ADOPTED (IncidentCommander)"
    roles: [OperationsLead, IncidentCommander]
    code: 200
    input: ["status?", "aar_status?", "aar_notes?"]
    output: Operation
    side_effects: ["muster requires rostered_count == team_size_required and empty capability_gap; demobilize blocked by IN_PROGRESS work orders; complete requires aar_status == ADOPTED; cancel cascades to deployments; increments version"]
  - method: POST
    path: "/vdr/operations/{id}/retype"
    description: "Re-type a DRAFT or OPEN operation (OCC-guarded): replaces team_size_required, duration_days, required_capabilities"
    roles: [OperationsLead]
    code: 200
    input: [expected_operation_version, team_size_required, duration_days, required_capabilities]
    output: Operation
    side_effects: ["recomputes capability_gap; increments Operation.version by 1"]
  # --- Deployments ---
  - method: POST
    path: "/vdr/operations/{id}/deployments"
    description: "Call-up: offer a deployment to a volunteer (status=OFFERED)"
    roles: [OperationsLead]
    code: 201
    input: [volunteer_id, travel_mode, planned_start, planned_end, "needs_lodging?"]
    output: Deployment
    side_effects: ["requires Operation.status == OPEN; volunteer readiness DEPLOYABLE; offer ceiling team_size_required"]
  - method: GET
    path: "/vdr/deployments"
    description: "List deployments, filterable by volunteer_id, operation_id, fob_site_id, status"
    roles: [SystemAdmin, OperationsLead, IncidentCommander, SafetyOfficer, Volunteer]
    code: 200
    input: ["volunteer_id?", "operation_id?", "fob_site_id?", "status?"]
    output: Deployment[]
    side_effects: []
  - method: GET
    path: "/vdr/deployments/{id}"
    description: "Get deployment by id (includes stipend fields, fob_site_id, duty_status)"
    roles: [SystemAdmin, OperationsLead, IncidentCommander, SafetyOfficer, Volunteer]
    code: 200
    input: []
    output: Deployment
    side_effects: []
  - method: PATCH
    path: "/vdr/deployments/{id}"
    description: "Deployment transitions: ACCEPTED/DECLINED (Volunteer self), ON_SITE check-in (OperationsLead; bunk allocation), DEMOBED (OperationsLead), clear SAFETY_HOLD -> ON_SITE (SafetyOfficer)"
    roles: [Volunteer, OperationsLead, SafetyOfficer]
    code: 200
    input: [status]
    output: Deployment
    side_effects: ["accept computes stipend_provisional_cents and revalidates safety/temporal gates; check-in assigns bunk; demobe releases bunk, computes stipend_final_cents, cancels remaining shifts, may auto-create WellnessCheck; increments version"]
  # --- FOB sites ---
  - method: POST
    path: "/vdr/operations/{id}/fob-sites"
    description: "Establish a forward operating base for an operation (bunks_occupied=0, lodging_cost_cents=0)"
    roles: [OperationsLead]
    code: 201
    input: [name, bunks_total, nightly_rate_cents]
    output: FobSite
    side_effects: []
  - method: GET
    path: "/vdr/operations/{id}/fob-sites"
    description: "List FOB sites of an operation (includes bunks_occupied, lodging_cost_cents)"
    roles: [SystemAdmin, OperationsLead, IncidentCommander, SafetyOfficer]
    code: 200
    input: []
    output: FobSite[]
    side_effects: []
  # --- Duty shifts ---
  - method: POST
    path: "/vdr/operations/{id}/duty-shifts"
    description: "Schedule a duty shift for an ON_SITE deployment (half-open overlap rule; fatigue cap)"
    roles: [OperationsLead]
    code: 201
    input: [deployment_id, kind, starts_at, ends_at]
    output: DutyShift
    side_effects: ["deployment must be ON_SITE and not SAFETY_HOLD; overlap and fatigue validations; may set duty_status=ON_DUTY"]
  - method: GET
    path: "/vdr/duty-shifts"
    description: "List duty shifts, filterable by operation_id, deployment_id, status"
    roles: [SystemAdmin, OperationsLead, IncidentCommander, SafetyOfficer, Volunteer]
    code: 200
    input: ["operation_id?", "deployment_id?", "status?"]
    output: DutyShift[]
    side_effects: []
  - method: GET
    path: "/vdr/duty-shifts/{id}"
    description: "Get duty shift by id"
    roles: [SystemAdmin, OperationsLead, IncidentCommander, SafetyOfficer, Volunteer]
    code: 200
    input: []
    output: DutyShift
    side_effects: []
  # --- Work orders ---
  - method: POST
    path: "/vdr/incidents/{id}/work-orders"
    description: "Intake a work order (status=INTAKE); PartnerLiaison must set source_partner_id to own agency id, IntakeCoordinator creates direct intakes"
    roles: [IntakeCoordinator, PartnerLiaison]
    code: 201
    input: [requester_name, hazard_kind, "vulnerable_resident?", "municipality_sourced?", "source_partner_id?"]
    output: WorkOrder
    side_effects: ["requires Incident.status IN {ASSESSED, TYPED, STANDING_DOWN}"]
  - method: GET
    path: "/vdr/work-orders"
    description: "List work orders, filterable by incident_id, operation_id, source_partner_id, status, priority_tier"
    roles: [SystemAdmin, IncidentCommander, OperationsLead, IntakeCoordinator, PartnerLiaison]
    code: 200
    input: ["incident_id?", "operation_id?", "source_partner_id?", "status?", "priority_tier?"]
    output: WorkOrder[]
    side_effects: []
  - method: GET
    path: "/vdr/work-orders/{id}"
    description: "Get work order by id (includes priority_score, priority_tier)"
    roles: [SystemAdmin, IncidentCommander, OperationsLead, IntakeCoordinator, PartnerLiaison]
    code: 200
    input: []
    output: WorkOrder
    side_effects: []
  - method: POST
    path: "/vdr/work-orders/{id}/triage"
    description: "Triage a work order (OCC-guarded): computes priority_score and priority_tier, INTAKE->TRIAGED"
    roles: [IntakeCoordinator]
    code: 200
    input: [expected_work_order_version]
    output: WorkOrder
    side_effects: ["computes priority_score/priority_tier (calc work_order_priority_score); increments WorkOrder.version by 1"]
  - method: PATCH
    path: "/vdr/work-orders/{id}"
    description: "Work-order transitions: SCHEDULED (+operation_id, IntakeCoordinator), IN_PROGRESS/BLOCKED/unblock-SCHEDULED/DONE_PENDING_VERIFICATION (OperationsLead), VERIFIED_DONE/CANCELLED (IntakeCoordinator)"
    roles: [IntakeCoordinator, OperationsLead]
    code: 200
    input: [status, "operation_id?", "blocked_reason?"]
    output: WorkOrder
    side_effects: ["schedule binds operation after gates; block requires blocked_reason; unblock clears it; increments version"]
  # --- Partner agencies ---
  - method: POST
    path: "/vdr/partners"
    description: "Register a partner agency (emergency management, nonprofit, or LTRG)"
    roles: [SystemAdmin]
    code: 201
    input: [name, kind, contact_email]
    output: PartnerAgency
    side_effects: []
  # --- Training ---
  - method: POST
    path: "/vdr/training-courses"
    description: "Create a training course (seats_taken=0); lead instructor must be instructor_certified"
    roles: [TrainingDirector]
    code: 201
    input: [title, grants_cert_kind, capacity, starts_at, lead_instructor_volunteer_id]
    output: TrainingCourse
    side_effects: []
  - method: GET
    path: "/vdr/training-courses/{id}"
    description: "Get training course by id (includes seats_taken)"
    roles: [SystemAdmin, TrainingDirector, SafetyOfficer, OperationsLead, Volunteer]
    code: 200
    input: []
    output: TrainingCourse
    side_effects: []
  - method: POST
    path: "/vdr/training-courses/{id}/enrollments"
    description: "Enroll a volunteer; lands ENROLLED when seats_taken < capacity else WAITLISTED with waitlist_position"
    roles: [TrainingDirector]
    code: 201
    input: [volunteer_id]
    output: TrainingEnrollment
    side_effects: ["ENROLLED: seats_taken += 1; WAITLISTED: waitlist_position assigned by created_at ASC among WAITLISTED"]
  - method: GET
    path: "/vdr/training-enrollments"
    description: "List enrollments, filterable by course_id, volunteer_id, status"
    roles: [SystemAdmin, TrainingDirector, SafetyOfficer, Volunteer]
    code: 200
    input: ["course_id?", "volunteer_id?", "status?"]
    output: TrainingEnrollment[]
    side_effects: []
  - method: GET
    path: "/vdr/training-enrollments/{id}"
    description: "Get enrollment by id"
    roles: [SystemAdmin, TrainingDirector, SafetyOfficer, Volunteer]
    code: 200
    input: []
    output: TrainingEnrollment
    side_effects: []
  - method: PATCH
    path: "/vdr/training-enrollments/{id}"
    description: "Enrollment transitions: COMPLETED/FAILED (TrainingDirector; completion grants PENDING_VERIFICATION cert), DROPPED (Volunteer self or TrainingDirector; frees seat if ENROLLED)"
    roles: [TrainingDirector, Volunteer]
    code: 200
    input: [status]
    output: TrainingEnrollment
    side_effects: ["COMPLETED creates Certification PENDING_VERIFICATION with expires_at = current_utc + CERT_GRANT_VALIDITY_DAYS(730); DROPPED from ENROLLED decrements seats_taken; increments version"]
  # --- Wellness ---
  - method: GET
    path: "/vdr/deployments/{id}/wellness-checks"
    description: "List wellness checks raised by a deployment"
    roles: [SystemAdmin, SafetyOfficer, OperationsLead, IncidentCommander]
    code: 200
    input: []
    output: WellnessCheck[]
    side_effects: []
  - method: PATCH
    path: "/vdr/wellness-checks/{id}"
    description: "Resolve a wellness check (requires resolved_notes)"
    roles: [SafetyOfficer]
    code: 200
    input: [status, resolved_notes]
    output: WellnessCheck
    side_effects: ["increments version"]
  # --- Test-driving endpoints ---
  - method: POST
    path: "/vdr/_clock/set_current_utc"
    description: "Set the logical clock. Startup default (before any set call) is exactly 2026-09-01T00:00:00Z and MUST NOT fall back to wall-clock time."
    roles: [SystemAdmin]
    code: 200
    input: [to_iso8601]
    output: "{ current_utc: string }"
    side_effects: ["logical clock advances; no other mutation until ops run"]
  - method: POST
    path: "/vdr/_ops/run"
    description: "Run one housekeeping epoch: (1) expire VERIFIED certs with expires_at < current_utc... (strictly: current_utc > expires_at); (2) auto-downgrade volunteers left with zero VERIFIED certs; (3) expire OFFERED deployments older than CALL_UP_RESPONSE_HOURS(48); (4) mark NO_SHOW deployments past start_date + NO_SHOW_GRACE_HOURS(24); (5) complete due duty shifts and accrue fatigue, then reset fatigue after >= REST_RESET_HOURS(24) idle; (6) promote WAITLISTED enrollments while seats free (created_at ASC order)"
    roles: [SystemAdmin]
    code: 200
    input: []
    output: "{ certs_expired: integer, offers_expired: integer, no_shows: integer, shifts_completed: integer, fatigue_resets: integer, enrollments_promoted: integer, volunteers_downgraded: integer }"
    side_effects: ["applies the six sweeps in the listed order; each mutated entity's version increments and updated_at refreshes"]

# =============================================================================
# §1.6 Error Code Catalog
# =============================================================================
errors:
  - { id: ERR_VALIDATION, http: 400, condition: "Malformed request: missing required field, wrong type, invalid enum member, planned_end <= planned_start, ends_at <= starts_at, or unknown field" }
  - { id: ERR_UNAUTHENTICATED, http: 401, condition: "X-User-ID or X-User-Role header missing or malformed" }
  - { id: ERR_UNAUTHORIZED, http: 403, condition: "Role not permitted on this endpoint, or entity-backed ownership check failed (Volunteer not acting on own record; PartnerLiaison source_partner_id != own agency; AAR submitter role attempting adoption)" }
  - { id: ERR_VOLUNTEER_NOT_FOUND, http: 404, condition: "Volunteer id in path or body does not exist" }
  - { id: ERR_CERTIFICATION_NOT_FOUND, http: 404, condition: "Certification id in path does not exist" }
  - { id: ERR_INCIDENT_NOT_FOUND, http: 404, condition: "Incident id in path does not exist" }
  - { id: ERR_OPERATION_NOT_FOUND, http: 404, condition: "Operation id in path or body does not exist" }
  - { id: ERR_DEPLOYMENT_NOT_FOUND, http: 404, condition: "Deployment id in path or body does not exist" }
  - { id: ERR_FOB_SITE_NOT_FOUND, http: 404, condition: "FOB site id referenced does not exist" }
  - { id: ERR_DUTY_SHIFT_NOT_FOUND, http: 404, condition: "Duty shift id in path does not exist" }
  - { id: ERR_WORK_ORDER_NOT_FOUND, http: 404, condition: "Work order id in path does not exist" }
  - { id: ERR_PARTNER_NOT_FOUND, http: 404, condition: "PartnerAgency id in body does not exist" }
  - { id: ERR_TRAINING_COURSE_NOT_FOUND, http: 404, condition: "Training course id in path does not exist" }
  - { id: ERR_ENROLLMENT_NOT_FOUND, http: 404, condition: "Training enrollment id in path does not exist" }
  - { id: ERR_WELLNESS_CHECK_NOT_FOUND, http: 404, condition: "Wellness check id in path does not exist" }
  - { id: ERR_INVALID_STATE, http: 409, condition: "Target entity is not in a from-state for the requested transition; includes transitions from terminal states and repeated idempotent attempts" }
  - { id: ERR_STALE_VERSION, http: 412, condition: "expected_<parent>_version does not match the parent's current version (OCC)" }
  - { id: ERR_OPERATION_NOT_OPEN, http: 409, condition: "Deployment offer/accept requires Operation.status OPEN (offer) or IN {OPEN, MUSTERED} (accept)" }
  - { id: ERR_INCIDENT_NOT_TYPED, http: 409, condition: "Operation creation or work-order scheduling requires Incident.status == TYPED" }
  - { id: ERR_WORK_ORDER_BLOCKING, http: 409, condition: "Operation demobilize rejected while any of its work orders is IN_PROGRESS" }
  - { id: ERR_AAR_NOT_ADOPTED, http: 409, condition: "Operation COMPLETE requires aar_status == ADOPTED" }
  - { id: ERR_VOLUNTEER_NOT_DEPLOYABLE, http: 409, condition: "Volunteer readiness_status != DEPLOYABLE at offer or accept time" }
  - { id: ERR_OPEN_WELLNESS_CHECKS, http: 409, condition: "Reinstatement SUSPENDED->DEPLOYABLE blocked by OPEN WellnessChecks on the volunteer's deployments" }
  - { id: ERR_CERT_NOT_VERIFIED, http: 422, condition: "Safety-gated capability lacks a VERIFIED certification (absent, PENDING_VERIFICATION, EXPIRED, or REVOKED)" }
  - { id: ERR_INSTRUCTOR_NOT_CERTIFIED, http: 422, condition: "TrainingCourse lead_instructor_volunteer_id does not reference a Volunteer with instructor_certified == true" }
  - { id: ERR_AVAILABILITY_WINDOW_MISMATCH, http: 422, condition: "Deployment window not fully contained in any volunteer availability window" }
  - { id: ERR_DEPLOYMENT_WINDOW_CONFLICT, http: 409, condition: "New deployment window starts less than REST_BUFFER_HOURS(24) after another active deployment's end for the same volunteer" }
  - { id: ERR_SHIFT_OVERLAP, http: 409, condition: "Duty shift [starts_at, ends_at) overlaps an existing SCHEDULED/COMPLETED shift of the same deployment (half-open semantics; adjacency allowed)" }
  - { id: ERR_FATIGUE_LIMIT_EXCEEDED, http: 422, condition: "New shift would push volunteer.fatigue_hours + shift_hours above MAX_FATIGUE_HOURS(40)" }
  - { id: ERR_CAPABILITY_GAP, http: 422, condition: "Operation capability_gap non-empty for a required capability at muster, schedule, or unblock" }
  - { id: ERR_HAZARD_MISMATCH, http: 422, condition: "Work-order schedule target operation's hazard_focus differs from the work order's hazard_kind" }
  - { id: ERR_TEAM_SIZE_EXCEEDED, http: 422, condition: "Offer would push active deployment count (OFFERED+ACCEPTED+ON_SITE+SAFETY_HOLD) above team_size_required" }
  - { id: ERR_FOB_CAPACITY_EXCEEDED, http: 422, condition: "Check-in with needs_lodging but every FobSite of the operation has bunks_occupied == bunks_total" }
  - { id: ERR_DUPLICATE_ENROLLMENT, http: 409, condition: "Volunteer already holds an ENROLLED or WAITLISTED enrollment in this course" }

# =============================================================================
# §1.7 RBAC Matrix
# =============================================================================
roles:
  - name: SystemAdmin
    description: "Platform operator; registers volunteers and partner agencies; drives the logical clock and ops-run epochs"
    identity: opaque
    exclusive_operations: ["POST /vdr/volunteers", "POST /vdr/partners", "POST /vdr/_clock/set_current_utc", "POST /vdr/_ops/run"]
    shared_operations: ["all GET endpoints"]
  - name: IncidentCommander
    description: "Owns incident lifecycle: report, assess, type, stand-down, close; creates operations; adopts after-action reviews (cannot submit them)"
    identity: opaque
    exclusive_operations: ["POST /vdr/incidents", "PATCH /vdr/incidents/{id}", "POST /vdr/incidents/{id}/operations", "PATCH /vdr/operations/{id} with aar_status=ADOPTED"]
    shared_operations: ["all GET endpoints"]
  - name: OperationsLead
    description: "Runs operations: opens/musters/activates/demobilizes, retypes, offers deployments, checks in and demobes, builds FOBs and duty shifts, works work orders in the field, submits AARs (cannot adopt them)"
    identity: opaque
    exclusive_operations: ["PATCH /vdr/operations/{id} with status or aar_status=SUBMITTED", "POST /vdr/operations/{id}/retype", "POST /vdr/operations/{id}/deployments", "PATCH /vdr/deployments/{id} with ON_SITE or DEMOBED", "POST /vdr/operations/{id}/fob-sites", "POST /vdr/operations/{id}/duty-shifts", "PATCH /vdr/work-orders/{id} with IN_PROGRESS/BLOCKED/unblock/DONE_PENDING_VERIFICATION"]
    shared_operations: ["all GET endpoints"]
  - name: SafetyOfficer
    description: "Credentialing and wellness authority: vets volunteers, verifies/rejects/revokes/renews certifications, clears safety holds, resolves wellness checks"
    identity: opaque
    exclusive_operations: ["PATCH /vdr/volunteers/{id} with readiness_status", "PATCH /vdr/certifications/{id}", "PATCH /vdr/deployments/{id} clearing SAFETY_HOLD to ON_SITE", "PATCH /vdr/wellness-checks/{id}"]
    shared_operations: ["all GET endpoints"]
  - name: IntakeCoordinator
    description: "Work-order desk: direct intake, triage (OCC), scheduling to operations, final verification, cancellation"
    identity: opaque
    exclusive_operations: ["POST /vdr/work-orders/{id}/triage", "PATCH /vdr/work-orders/{id} with SCHEDULED/VERIFIED_DONE/CANCELLED"]
    shared_operations: ["POST /vdr/incidents/{id}/work-orders (with PartnerLiaison)", "GET work-order/incident/operation endpoints"]
  - name: PartnerLiaison
    description: "External partner coordinator (emergency management, nonprofit, LTRG); refers work orders on behalf of their agency"
    identity: "entity_backed:PartnerAgency"
    exclusive_operations: []
    shared_operations: ["POST /vdr/incidents/{id}/work-orders with source_partner_id == own PartnerAgency id", "GET work-order and incident endpoints"]
  - name: TrainingDirector
    description: "Training pipeline owner: creates courses, enrolls volunteers, records certifications, marks completions (completion grants a PENDING_VERIFICATION cert)"
    identity: opaque
    exclusive_operations: ["POST /vdr/training-courses", "POST /vdr/training-courses/{id}/enrollments", "PATCH /vdr/training-enrollments/{id} with COMPLETED/FAILED", "POST /vdr/volunteers/{id}/certifications"]
    shared_operations: ["all GET endpoints"]
  - name: Volunteer
    description: "Rostered disaster-response volunteer; manages own availability, accepts/declines own deployment offers, drops own enrollments"
    identity: "entity_backed:Volunteer"
    exclusive_operations: ["PATCH /vdr/deployments/{id} with ACCEPTED/DECLINED where X-User-ID == deployment.volunteer_id", "PATCH /vdr/volunteers/{id} with availability_windows where X-User-ID == volunteer id", "PATCH /vdr/training-enrollments/{id} with DROPPED where X-User-ID == enrollment.volunteer_id"]
    shared_operations: ["GET own volunteer record, certifications, deployments, duty shifts, enrollments"]
