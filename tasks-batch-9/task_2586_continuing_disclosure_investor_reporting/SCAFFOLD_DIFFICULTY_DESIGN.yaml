            - "${late_count} == 0, ${missed_count} == 1, ${risk} == 20.00, ${tier} == TIER_0, ${posture} == COMPLIANT (20.00 is below the 25.00 WATCH band)"

      - name: all_waived_cycle_scores_exactly_100_but_has_no_fileable_content
        grounds:
          - calculations.content_preparation_completeness_score
          - validations.priority_25_ERR_CONTENT_NOT_READY
          - validations.priority_26_ERR_NO_FILEABLE_CONTENT
          - state_machines.AnnualReportCycle.DRAFTING_to_READY_TO_FILE
          - state_machines.CycleContentItem.NOT_STARTED_to_WAIVED
        distinguishing_aspect: |
          The precision boundary here is the SCORE CEILING seen from the wrong side: two cycles
          reach the identical completeness_score_pct of exactly 100.00, yet one is assemblable
          and the other is not, so the score alone cannot be used as the assembly gate. It also
          separates priority 25 (any item not READY-or-WAIVED) from priority 26 (no item READY
          at all): the same cycle returns ERR_CONTENT_NOT_READY with one item waived and
          ERR_NO_FILEABLE_CONTENT with both waived, and the score at the first refusal is
          exactly 50.00.
        test_recipe:
          setup:
            - "The logical clock stands at 2026-08-01T00:00:00Z."
            - "One OUTSTANDING BondIssue, one ACTIVE Undertaking with exactly two ContentRequirements, both weight_bp 5000 and both waivable: OPERATING_DATA_TABLE and BUDGET_SUMMARY. Neither is AUDITED_FINANCIALS, so requires_audit_opinion is false on both and the opinion multiplier is always 1.0."
            - "Cycle A covers [2025-07-01, 2026-06-30) and both of its items are left NOT_STARTED."
            - "Cycle B covers [2026-07-01, 2027-06-30) — a gap, not an overlap — and is already prepared the mixed way: its OPERATING_DATA_TABLE item is PATCHed and attested by off-prep (READY) while its BUDGET_SUMMARY item is waived by rev-1."
            - "Items are always located with the two-filter list form ?cycle_id=&content_requirement_id= so no test step depends on list ordering."
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { current_utc: "2026-08-01T00:00:00Z" }
              as: FinanceDirector
              as_user_id: "fd-1"
            - call: "POST /disclosure/bond-issues"
              payload: { issuer_program_code: "SCHOOLDIST", series_designation: "2019A", security_type: "GENERAL_OBLIGATION", dated_date: "2019-06-01", final_maturity_date: "2049-06-01", original_par_amount_cents: 100000000 }
              as: FinanceDirector
              as_user_id: "fd-1"
              captures: { issue_id: "$.data.id" }
            - call: "POST /disclosure/undertakings"
              payload: { issue_id: "${issue_id}", fiscal_year_end_month_day: "06-30", filing_window_days: 210, timeliness_basis: "SUBMISSION_BASIS" }
              as: FinanceDirector
              as_user_id: "fd-1"
              captures: { und_id: "$.data.id" }
            - call: "POST /disclosure/content-requirements"
              payload: { undertaking_id: "${und_id}", kind: "OPERATING_DATA_TABLE", label: "Operating Data Tables", weight_bp: 5000, waivable: true }
              as: DisclosureOfficer
              as_user_id: "off-prep"
              captures: { req1_id: "$.data.id" }
            - call: "POST /disclosure/content-requirements"
              payload: { undertaking_id: "${und_id}", kind: "BUDGET_SUMMARY", label: "Adopted Budget Summary", weight_bp: 5000, waivable: true }
              as: DisclosureOfficer
              as_user_id: "off-prep"
              captures: { req2_id: "$.data.id" }
            - call: "POST /disclosure/annual-report-cycles"
              payload: { undertaking_id: "${und_id}", fiscal_year_label: "FY2026", period_start_date: "2025-07-01", period_end_date: "2026-06-30" }
              as: DisclosureOfficer
              as_user_id: "off-prep"
              captures: { cycA_id: "$.data.id", cycA_score0: "$.data.completeness_score_pct" }
            - call: "GET /disclosure/cycle-content-items?cycle_id=${cycA_id}&content_requirement_id=${req1_id}"
              payload: {}
              as: DisclosureOfficer
              as_user_id: "off-prep"
              captures: { a1_id: "$.data[0].id", a1_status: "$.data[0].status", a1_weight: "$.data[0].weight_bp_snapshot" }
            - call: "GET /disclosure/cycle-content-items?cycle_id=${cycA_id}&content_requirement_id=${req2_id}"
              payload: {}
              as: DisclosureOfficer
              as_user_id: "off-prep"
              captures: { a2_id: "$.data[0].id" }
            - call: "POST /disclosure/annual-report-cycles"
              payload: { undertaking_id: "${und_id}", fiscal_year_label: "FY2027", period_start_date: "2026-07-01", period_end_date: "2027-06-30" }
              as: DisclosureOfficer
              as_user_id: "off-prep"
              captures: { cycB_id: "$.data.id" }
            - call: "GET /disclosure/cycle-content-items?cycle_id=${cycB_id}&content_requirement_id=${req1_id}"
              payload: {}
              as: DisclosureOfficer
              as_user_id: "off-prep"
              captures: { b1_id: "$.data[0].id" }
            - call: "GET /disclosure/cycle-content-items?cycle_id=${cycB_id}&content_requirement_id=${req2_id}"
              payload: {}
              as: DisclosureOfficer
              as_user_id: "off-prep"
              captures: { b2_id: "$.data[0].id" }
            - call: "PATCH /disclosure/cycle-content-items/${b1_id}"
              payload: { data_as_of_date: "2027-06-30", source_document_ref: "OPDATA-FY2027.pdf" }
              as: DisclosureOfficer
              as_user_id: "off-prep"
            - call: "POST /disclosure/cycle-content-items/${b1_id}/attest"
              payload: {}
              as: DisclosureOfficer
              as_user_id: "off-prep"
              captures: { b1_status: "$.data.status" }
            - call: "POST /disclosure/cycle-content-items/${b2_id}/waive"
              payload: { waiver_reason: "District publishes no separate adopted budget summary." }
              as: ComplianceReviewer
              as_user_id: "rev-1"
              captures: { b2_status: "$.data.status" }
          trigger:
            - call: "POST /disclosure/cycle-content-items/${a1_id}/waive"
              payload: { waiver_reason: "No enterprise operations during the period." }
              as: ComplianceReviewer
              as_user_id: "rev-1"
              captures: { a1_waived_status: "$.data.status", a1_factor: "$.data.readiness_factor" }
            - call: "GET /disclosure/annual-report-cycles/${cycA_id}"
              payload: {}
              as: DisclosureOfficer
              as_user_id: "off-prep"
              captures: { cycA_score_half: "$.data.completeness_score_pct" }
            - call: "POST /disclosure/annual-report-cycles/${cycA_id}/assemble"
              payload: {}
              as: DisclosureOfficer
              as_user_id: "off-asm"
              captures: { err_not_ready: "$.data.error_id" }
            - call: "POST /disclosure/cycle-content-items/${a2_id}/waive"
              payload: { waiver_reason: "No adopted budget summary produced." }
              as: ComplianceReviewer
              as_user_id: "rev-1"
              captures: { a2_waived_status: "$.data.status" }
            - call: "GET /disclosure/annual-report-cycles/${cycA_id}"
              payload: {}
              as: DisclosureOfficer
              as_user_id: "off-prep"
              captures: { cycA_score_full: "$.data.completeness_score_pct", cycA_status_before: "$.data.status" }
            - call: "POST /disclosure/annual-report-cycles/${cycA_id}/assemble"
              payload: {}
              as: DisclosureOfficer
              as_user_id: "off-asm"
              captures: { err_no_fileable: "$.data.error_id" }
            - call: "GET /disclosure/annual-report-cycles/${cycA_id}"
              payload: {}
              as: DisclosureOfficer
              as_user_id: "off-prep"
              captures: { cycA_status_after: "$.data.status" }
            - call: "POST /disclosure/annual-report-cycles/${cycB_id}/assemble"
              payload: {}
              as: DisclosureOfficer
              as_user_id: "off-asm"
              captures: { cycB_status: "$.data.status", cycB_score: "$.data.completeness_score_pct", cycB_assembled_by: "$.data.assembled_by_user_id" }
          assert:
            - "${a1_status} == NOT_STARTED, ${a1_weight} == 5000, ${cycA_score0} == 0.00 at creation"
            - "${a1_waived_status} == WAIVED and ${a1_factor} == 1.0 — a waived item keeps its full weight instead of leaving the input set"
            - "${cycA_score_half} == 50.00 — one WAIVED 5000-bp item plus one NOT_STARTED 5000-bp item"
            - "${err_not_ready} == ERR_CONTENT_NOT_READY with HTTP 409 — priority 25 fires while an item is still NOT_STARTED"
            - "${a2_waived_status} == WAIVED and ${cycA_score_full} == 100.00 — exactly the ceiling, with contributions 0.5000 + 0.5000 = 1.0000"
            - "${cycA_status_before} == DRAFTING and ${err_no_fileable} == ERR_NO_FILEABLE_CONTENT with HTTP 409 — priority 26 refuses a 100.00-scoring cycle that carries no document"
            - "${cycA_status_after} == DRAFTING — the refused assemble left the cycle untouched, so score 100.00 and status DRAFTING coexist"
            - "${b1_status} == READY and ${b2_status} == WAIVED"
            - "${cycB_score} == 100.00 — the SAME score as cycle A, from a different item mix"
            - "${cycB_status} == READY_TO_FILE and ${cycB_assembled_by} == \"off-asm\" — one READY item is enough to clear priority 26, proving the score is not the gate"

  - rule_id: cross_entity_state_dependency
    instances:

      - name: filing_submission_gated_on_engagement_status_with_calendar_ack_as_the_cure
        grounds:
          - validations.priority_11_ERR_ENGAGEMENT_NOT_ACTIVE
          - state_machines.DisseminationEngagement.ACTIVE_to_SUSPENDED
          - state_machines.DisseminationEngagement.SUSPENDED_to_ACTIVE
          - calculations.engagement_monitoring_lapse
          - endpoints.POST_/disclosure/filings/{id}/submit
        distinguishing_aspect: |
          The Filing's OWN state never changes across the three attempts — it stays DRAFT — and
          nothing about the Filing, the cycle, the undertaking or the issue is edited. Only a
          THIRD entity's status (the DisseminationEngagement, flipped by a monitoring-lapse
          sweep and then cured by an acknowledge-calendar call) decides whether the identical
          submit request is refused or accepted, and the cure runs through the one endpoint a
          SUSPENDED engagement is still allowed to call.
        test_recipe:
          setup:
            - "The clock starts at 2026-08-01T00:00:00Z."
            - "One OUTSTANDING BondIssue with a far-future maturity, one ACTIVE Undertaking, one 10000-bp ContentRequirement."
            - "One DisseminationEngagement whose effective_date and last_calendar_ack_date are both 2026-07-01, giving a lapse of 31 days at setup time — under the 45-day limit, so it is created ACTIVE."
            - "AnnualReportCycle FY2026 for [2025-07-01, 2026-06-30) has due_date 2027-01-26, so it is nowhere near delinquency; it is prepared, attested and assembled to READY_TO_FILE, and an ANNUAL_REPORT Filing sits in DRAFT."
            - "The clock then moves to 2026-08-20 and a calendar sweep runs: the engagement's lapse is 50 > 45 so it is SUSPENDED, while the cycle and the issue are untouched."
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { current_utc: "2026-08-01T00:00:00Z" }
              as: FinanceDirector
              as_user_id: "fd-1"
            - call: "POST /disclosure/bond-issues"
              payload: { issuer_program_code: "PORTAUTH", series_designation: "2022A", security_type: "REVENUE", dated_date: "2022-02-01", final_maturity_date: "2052-02-01", original_par_amount_cents: 100000000 }
              as: FinanceDirector
              as_user_id: "fd-1"
              captures: { issue_id: "$.data.id" }
            - call: "POST /disclosure/undertakings"
              payload: { issue_id: "${issue_id}", fiscal_year_end_month_day: "06-30", filing_window_days: 210, timeliness_basis: "SUBMISSION_BASIS" }
              as: FinanceDirector
              as_user_id: "fd-1"
              captures: { und_id: "$.data.id", und_v: "$.data.version" }
            - call: "POST /disclosure/content-requirements"
              payload: { undertaking_id: "${und_id}", kind: "OPERATING_DATA_TABLE", label: "Operating Data Tables", weight_bp: 10000, waivable: false }
              as: DisclosureOfficer
              as_user_id: "off-prep"
            - call: "POST /disclosure/dissemination-engagements"
              payload: { undertaking_id: "${und_id}", agent_name: "Portside Dissemination", effective_date: "2026-07-01", expiration_date: "2027-12-31", retainer_cents: 250000, last_calendar_ack_date: "2026-07-01", expected_undertaking_version: "${und_v}" }
              as: FinanceDirector
              as_user_id: "fd-1"
              captures: { eng_id: "$.data.id", eng_status0: "$.data.status", lapse0: "$.data.monitoring_lapse_days" }
            - call: "POST /disclosure/annual-report-cycles"
              payload: { undertaking_id: "${und_id}", fiscal_year_label: "FY2026", period_start_date: "2025-07-01", period_end_date: "2026-06-30" }
              as: DisclosureOfficer
              as_user_id: "off-prep"
              captures: { cycle_id: "$.data.id", due_date: "$.data.due_date" }
            - call: "GET /disclosure/cycle-content-items?cycle_id=${cycle_id}"
              payload: {}
              as: DisclosureOfficer
              as_user_id: "off-prep"
              captures: { item_id: "$.data[0].id" }
            - call: "PATCH /disclosure/cycle-content-items/${item_id}"
              payload: { data_as_of_date: "2026-06-30", source_document_ref: "OPDATA-FY2026.pdf" }
              as: DisclosureOfficer
              as_user_id: "off-prep"
            - call: "POST /disclosure/cycle-content-items/${item_id}/attest"
              payload: {}
              as: DisclosureOfficer
              as_user_id: "off-prep"
            - call: "POST /disclosure/annual-report-cycles/${cycle_id}/assemble"
              payload: {}
              as: DisclosureOfficer
              as_user_id: "off-asm"
            - call: "GET /disclosure/bond-issues/${issue_id}"
              payload: {}
              as: DisclosureOfficer
              as_user_id: "off-prep"
              captures: { iv1: "$.data.version" }
            - call: "POST /disclosure/filings"
              payload: { issue_id: "${issue_id}", filing_type: "ANNUAL_REPORT", cycle_id: "${cycle_id}", expected_issue_version: "${iv1}" }
              as: DisclosureOfficer
              as_user_id: "off-prep"
              captures: { filing_id: "$.data.id", filing_status0: "$.data.status", attempts0: "$.data.submission_attempt_count" }
            - call: "POST /_clock/set_current_utc"
              payload: { current_utc: "2026-08-20T00:00:00Z" }
              as: FinanceDirector
              as_user_id: "fd-1"
            - call: "POST /disclosure/calendar-sweeps"
              payload: {}
              as: FinanceDirector
              as_user_id: "fd-1"
              captures: { sw_suspended: "$.data.suspended_engagement_count", sw_delinquent: "$.data.delinquent_cycle_count", sw_matured: "$.data.matured_issue_count" }
          trigger:
            - call: "GET /disclosure/dissemination-engagements/${eng_id}"
              payload: {}
              as: FinanceDirector
              as_user_id: "fd-1"
              captures: { eng_status1: "$.data.status", lapse1: "$.data.monitoring_lapse_days" }
            - call: "POST /disclosure/filings/${filing_id}/submit"
              payload: {}
              as: DisseminationAgent
              as_user_id: "${eng_id}"
              captures: { err_submit: "$.data.error_id" }
            - call: "GET /disclosure/filings/${filing_id}"
              payload: {}
              as: FinanceDirector
              as_user_id: "fd-1"
              captures: { filing_status1: "$.data.status", attempts1: "$.data.submission_attempt_count" }
            - call: "POST /disclosure/dissemination-engagements/${eng_id}/acknowledge-calendar"
              payload: { last_calendar_ack_date: "2026-08-20" }
              as: DisseminationAgent
              as_user_id: "${eng_id}"
              captures: { eng_status2: "$.data.status", lapse2: "$.data.monitoring_lapse_days", ack2: "$.data.last_calendar_ack_date" }
            - call: "POST /disclosure/filings/${filing_id}/submit"
              payload: {}
              as: DisseminationAgent
              as_user_id: "${eng_id}"
              captures: { filing_status2: "$.data.status", attempts2: "$.data.submission_attempt_count", submitted_at: "$.data.submitted_at", sub_eng: "$.data.submitting_engagement_id" }
            - call: "GET /disclosure/annual-report-cycles/${cycle_id}"
              payload: {}
              as: FinanceDirector
              as_user_id: "fd-1"
              captures: { cycle_status: "$.data.status" }
          assert:
            - "${due_date} == \"2027-01-26\", ${eng_status0} == ACTIVE, ${lapse0} == 31, ${filing_status0} == DRAFT, ${attempts0} == 0"
            - "${sw_suspended} == 1, ${sw_delinquent} == 0, ${sw_matured} == 0 — the sweep touched only the engagement"
            - "${eng_status1} == SUSPENDED and ${lapse1} == 50"
            - "${err_submit} == ERR_ENGAGEMENT_NOT_ACTIVE with HTTP 409"
            - "${filing_status1} == DRAFT and ${attempts1} == 0 — a refused submit does not burn an attempt against the MAX_SUBMISSION_ATTEMPTS ceiling of 3"
            - "${eng_status2} == ACTIVE, ${lapse2} == 0, ${ack2} == \"2026-08-20\" — acknowledge-calendar is the one action a SUSPENDED engagement may still take"
            - "${filing_status2} == SUBMITTED, ${attempts2} == 1, ${submitted_at} == \"2026-08-20T00:00:00Z\", ${sub_eng} == \"${eng_id}\""
            - "${cycle_status} == FILING_IN_PROGRESS — the submit cascade moved the cycle only on the accepted attempt"

      - name: notice_and_review_creation_gated_on_issue_outstanding_after_maturity_sweep
        grounds:
          - validations.priority_9_ERR_ISSUE_NOT_OUTSTANDING
          - state_machines.BondIssue.OUTSTANDING_to_MATURED
          - endpoints.POST_/disclosure/calendar-sweeps
          - endpoints.POST_/disclosure/material-event-notices
          - endpoints.POST_/disclosure/official-statements/{id}/compliance-review
        distinguishing_aspect: |
          A different dependency direction from the engagement instance: here the gating entity
          is the request's own ANCESTOR rather than a sibling actor, the flip is driven by a
          date comparison inside the sweep rather than by a lapse counter, and the block is
          PERMANENT because MATURED is terminal — there is no cure endpoint. A second issue in
          the same program, still OUTSTANDING, accepts the byte-identical notice body, which
          proves the refusal is about the ancestor's state and not about the payload. The same
          priority-9 rule is shown reaching two structurally unrelated endpoints.
        test_recipe:
          setup:
            - "The clock starts at 2026-07-01T00:00:00Z."
            - "Issue 1 (series 2011A) has final_maturity_date 2026-07-15 and outstanding par 100000000; it carries one ACTIVE Undertaking, one DETERMINATION_PENDING MaterialEventNotice (TRUSTEE_SUBSTITUTION, occurrence 2026-06-25), and one DRAFT OfficialStatement dated 2026-07-01."
            - "Issue 2 (series 2026R) is in the same issuer_program_code with a far-future maturity and no obligations yet."
            - "The clock then moves to 2026-08-01 and a calendar sweep runs. Issue 1's maturity date is in the past, so sweep step 1 moves it to MATURED, zeroes its par, terminates its undertaking with cause MATURITY and voids its pending notice. Issue 2 is untouched."
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { current_utc: "2026-07-01T00:00:00Z" }
              as: FinanceDirector
              as_user_id: "fd-1"
            - call: "POST /disclosure/bond-issues"
              payload: { issuer_program_code: "WATERWORKS", series_designation: "2011A", security_type: "REVENUE", dated_date: "2011-07-01", final_maturity_date: "2026-07-15", original_par_amount_cents: 100000000 }
              as: FinanceDirector
              as_user_id: "fd-1"
              captures: { issue1_id: "$.data.id" }
            - call: "POST /disclosure/bond-issues"
              payload: { issuer_program_code: "WATERWORKS", series_designation: "2026R", security_type: "REVENUE", dated_date: "2026-06-01", final_maturity_date: "2056-06-01", original_par_amount_cents: 60000000 }
              as: FinanceDirector
              as_user_id: "fd-1"
              captures: { issue2_id: "$.data.id" }
            - call: "POST /disclosure/undertakings"
              payload: { issue_id: "${issue1_id}", fiscal_year_end_month_day: "06-30", filing_window_days: 210, timeliness_basis: "SUBMISSION_BASIS" }
              as: FinanceDirector
              as_user_id: "fd-1"
              captures: { und1_id: "$.data.id" }
            - call: "POST /disclosure/material-event-notices"
              payload: { issue_id: "${issue1_id}", event_type: "TRUSTEE_SUBSTITUTION", occurrence_date: "2026-06-25" }
              as: DisclosureOfficer
              as_user_id: "off-prep"
              captures: { old_notice_id: "$.data.id", old_notice_status0: "$.data.status" }
            - call: "POST /disclosure/official-statements"
              payload: { issue_id: "${issue1_id}", dated_date: "2026-07-01", lookback_policy: "STRICT_FIVE_YEAR", disclosed_event_ids: [] }
              as: DisclosureOfficer
              as_user_id: "off-prep"
              captures: { os1_id: "$.data.id", os1_status0: "$.data.status" }
            - call: "POST /_clock/set_current_utc"
              payload: { current_utc: "2026-08-01T00:00:00Z" }
              as: FinanceDirector
              as_user_id: "fd-1"
            - call: "POST /disclosure/calendar-sweeps"
              payload: {}
              as: FinanceDirector
              as_user_id: "fd-1"
              captures: { sw_matured: "$.data.matured_issue_count", sw_missed: "$.data.missed_event_count" }
          trigger:
            - call: "GET /disclosure/bond-issues/${issue1_id}"
              payload: {}
              as: FinanceDirector
              as_user_id: "fd-1"
              captures: { i1_status: "$.data.status", i1_par: "$.data.outstanding_par_amount_cents", i1_open_events: "$.data.open_material_event_count" }
            - call: "GET /disclosure/undertakings/${und1_id}"
              payload: {}
              as: FinanceDirector
              as_user_id: "fd-1"
              captures: { u1_status: "$.data.status", u1_cause: "$.data.termination_cause" }
            - call: "GET /disclosure/material-event-notices/${old_notice_id}"
              payload: {}
              as: FinanceDirector
              as_user_id: "fd-1"
              captures: { old_notice_status1: "$.data.status" }
            - call: "POST /disclosure/material-event-notices"
              payload: { issue_id: "${issue1_id}", event_type: "UNSCHEDULED_DRAW_ON_RESERVE", occurrence_date: "2026-07-28" }
              as: DisclosureOfficer
              as_user_id: "off-prep"
              captures: { err_notice: "$.data.error_id" }
            - call: "POST /disclosure/official-statements/${os1_id}/compliance-review"
              payload: { disclosed_event_ids: [] }
              as: ComplianceReviewer
              as_user_id: "rev-1"
              captures: { err_review: "$.data.error_id" }
            - call: "POST /disclosure/undertakings"
              payload: { issue_id: "${issue1_id}", fiscal_year_end_month_day: "12-31", filing_window_days: 210, timeliness_basis: "SUBMISSION_BASIS" }
              as: FinanceDirector
              as_user_id: "fd-1"
              captures: { err_undertaking: "$.data.error_id" }
            - call: "POST /disclosure/material-event-notices"
              payload: { issue_id: "${issue2_id}", event_type: "UNSCHEDULED_DRAW_ON_RESERVE", occurrence_date: "2026-07-28" }
              as: DisclosureOfficer
              as_user_id: "off-prep"
              captures: { ok_notice_id: "$.data.id", ok_notice_status: "$.data.status", ok_deadline: "$.data.filing_deadline_date" }
            - call: "GET /disclosure/official-statements/${os1_id}"
              payload: {}
              as: FinanceDirector
              as_user_id: "fd-1"
              captures: { os1_status1: "$.data.status" }
          assert:
            - "${old_notice_status0} == DETERMINATION_PENDING and ${os1_status0} == DRAFT before the sweep"
            - "${sw_matured} == 1 and ${sw_missed} == 0 — the pending notice is voided by the maturity cascade, not counted as a missed event"
            - "${i1_status} == MATURED, ${i1_par} == 0, ${i1_open_events} == 0"
            - "${u1_status} == TERMINATED and ${u1_cause} == MATURITY"
            - "${old_notice_status1} == VOID — maturity mints no replacement notice, unlike defeasance"
            - "${err_notice} == ERR_ISSUE_NOT_OUTSTANDING with HTTP 409"
            - "${err_review} == ERR_ISSUE_NOT_OUTSTANDING with HTTP 409 — the same priority-9 rule reaches the official-statement review endpoint"
            - "${err_undertaking} == ERR_ISSUE_NOT_OUTSTANDING with HTTP 409 — and priority 9 outranks priority 14's duplicate-undertaking check, which this body would also violate"
            - "${ok_notice_status} == DETERMINATION_PENDING and ${ok_deadline} == \"2026-08-11\" — the byte-identical event body succeeds against the still-OUTSTANDING sibling issue"
            - "${os1_status1} == DRAFT — the refused compliance-review left the official statement in place, and because MATURED is terminal there is no path that will ever let it be reviewed"

  - rule_id: resource_temporal_overlap
    instances:

      - name: reporting_periods_are_half_open_so_exact_adjacency_is_legal
        grounds:
          - validations.priority_16_ERR_REPORTING_PERIOD_OVERLAP
          - entities.AnnualReportCycle.fields.period_start_date
          - entities.AnnualReportCycle.fields.period_end_date
          - state_machines.AnnualReportCycle.DRAFTING_to_WITHDRAWN
        distinguishing_aspect: |
          Fiscal reporting periods are HALF-OPEN [start, end), the exact opposite convention
          from the placement review windows in the sibling instance, so a new period starting on
          the very day the previous one ends is LEGAL while starting one day earlier is refused.
          The instance additionally shows the overlap set is LIVE rather than historical:
          withdrawing a cycle frees its period so a byte-identical creation then succeeds, yet a
          period that also crosses a surviving cycle still fails — the rule is about the
          currently occupied calendar, not about which specific row was refused before.
        test_recipe:
          setup:
            - "The clock stands at 2026-08-01T00:00:00Z."
            - "One OUTSTANDING BondIssue with a far-future maturity, one ACTIVE Undertaking with one 10000-bp ContentRequirement (a cycle cannot be opened without at least one requirement)."
            - "Exactly one cycle exists: FY2026 covering [2025-07-01, 2026-06-30) in DRAFTING, with no filings against it."
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { current_utc: "2026-08-01T00:00:00Z" }
              as: FinanceDirector
              as_user_id: "fd-1"
            - call: "POST /disclosure/bond-issues"
              payload: { issuer_program_code: "PARKSDIST", series_designation: "2017A", security_type: "GENERAL_OBLIGATION", dated_date: "2017-09-01", final_maturity_date: "2047-09-01", original_par_amount_cents: 100000000 }
              as: FinanceDirector
              as_user_id: "fd-1"
              captures: { issue_id: "$.data.id" }
            - call: "POST /disclosure/undertakings"
              payload: { issue_id: "${issue_id}", fiscal_year_end_month_day: "06-30", filing_window_days: 210, timeliness_basis: "SUBMISSION_BASIS" }
              as: FinanceDirector
              as_user_id: "fd-1"
              captures: { und_id: "$.data.id" }
            - call: "POST /disclosure/content-requirements"
              payload: { undertaking_id: "${und_id}", kind: "OPERATING_DATA_TABLE", label: "Operating Data Tables", weight_bp: 10000, waivable: false }
              as: DisclosureOfficer
              as_user_id: "off-prep"
            - call: "POST /disclosure/annual-report-cycles"
              payload: { undertaking_id: "${und_id}", fiscal_year_label: "FY2026", period_start_date: "2025-07-01", period_end_date: "2026-06-30" }
              as: DisclosureOfficer
              as_user_id: "off-prep"
              captures: { cycA_id: "$.data.id", cycA_status0: "$.data.status" }
          trigger:
            - call: "POST /disclosure/annual-report-cycles"
              payload: { undertaking_id: "${und_id}", fiscal_year_label: "FY2027-EARLY", period_start_date: "2026-06-29", period_end_date: "2027-06-29" }
              as: DisclosureOfficer
              as_user_id: "off-prep"
              captures: { err_overlap_1day: "$.data.error_id" }
            - call: "POST /disclosure/annual-report-cycles"
              payload: { undertaking_id: "${und_id}", fiscal_year_label: "FY2027", period_start_date: "2026-06-30", period_end_date: "2027-06-30" }
              as: DisclosureOfficer
              as_user_id: "off-prep"
              captures: { cycB_id: "$.data.id", cycB_status: "$.data.status", cycB_due: "$.data.due_date" }
            - call: "POST /disclosure/annual-report-cycles"
              payload: { undertaking_id: "${und_id}", fiscal_year_label: "FY2026-DUP", period_start_date: "2025-07-01", period_end_date: "2026-06-30" }
              as: DisclosureOfficer
              as_user_id: "off-prep"
              captures: { err_overlap_exact: "$.data.error_id" }
            - call: "POST /disclosure/annual-report-cycles/${cycA_id}/withdraw"
              payload: { withdrawal_reason: "Opened against the wrong fiscal year label." }
              as: DisclosureOfficer
              as_user_id: "off-prep"
              captures: { cycA_status1: "$.data.status" }
            - call: "POST /disclosure/annual-report-cycles"
              payload: { undertaking_id: "${und_id}", fiscal_year_label: "FY2026-REDO", period_start_date: "2025-07-01", period_end_date: "2026-06-30" }
              as: DisclosureOfficer
              as_user_id: "off-prep"
              captures: { cycC_id: "$.data.id", cycC_status: "$.data.status", cycC_due: "$.data.due_date" }
            - call: "POST /disclosure/annual-report-cycles"
              payload: { undertaking_id: "${und_id}", fiscal_year_label: "FY2027-EARLY-2", period_start_date: "2026-06-29", period_end_date: "2027-06-29" }
              as: DisclosureOfficer
              as_user_id: "off-prep"
              captures: { err_overlap_after: "$.data.error_id" }
            - call: "GET /disclosure/annual-report-cycles?undertaking_id=${und_id}"
              payload: {}
              as: FinanceDirector
              as_user_id: "fd-1"
              captures: { cycle_total: "$.total_count" }
          assert:
            - "${cycA_status0} == DRAFTING"
            - "${err_overlap_1day} == ERR_REPORTING_PERIOD_OVERLAP with HTTP 409 — starting one day before cycle A's end_date intrudes into the half-open interval"
            - "${cycB_status} == DRAFTING and ${cycB_due} == \"2028-01-26\" — starting exactly ON 2026-06-30 is legal because the interval is half-open at the end; cycle B's due date is 2027-06-30 + 210 calendar days = 2028-01-26, a Wednesday that needs no roll-forward"
            - "${err_overlap_exact} == ERR_REPORTING_PERIOD_OVERLAP with HTTP 409 — the identical period of a live cycle is refused"
            - "${cycA_status1} == WITHDRAWN and its content items are all VOID"
            - "${cycC_status} == DRAFTING and ${cycC_due} == \"2027-01-26\" — the SAME period that was refused three calls earlier now succeeds, because WITHDRAWN cycles leave the overlap set"
            - "${err_overlap_after} == ERR_REPORTING_PERIOD_OVERLAP with HTTP 409 — [2026-06-29, 2027-06-29) still collides, now with the surviving cycle B rather than with the withdrawn cycle A"
            - "${cycle_total} == 3 — cycle A (WITHDRAWN), cycle B and cycle C; the three refused requests created nothing"

      - name: placement_review_windows_are_closed_intervals_with_aggregate_capacity_two
        grounds:
          - validations.priority_22_ERR_PLACEMENT_REVIEW_CAPACITY_EXCEEDED
          - entities.DirectPlacement.fields.review_window_start_date
          - entities.DirectPlacement.fields.review_window_end_date
          - calculations.direct_placement_materiality_ratio
        distinguishing_aspect: |
          The opposite interval convention from the reporting-period instance — review windows
          are CLOSED [start, end], so windows that merely TOUCH on a single day do overlap — and
          the limit is an AGGREGATE capacity of two rather than a pairwise exclusion: each of the
          first two placements is individually legal and it is only the third cover of a single
          calendar date that is refused. The same setup also pins the 500-bp materiality
          boundary from both sides, 499 vs exactly 500, on the same outstanding par.
        test_recipe:
          setup:
            - "The clock stands at 2026-08-01T00:00:00Z."
            - "One OUTSTANDING BondIssue with outstanding_par_amount_cents exactly 100000000, so a principal of 4990000 cents is 499 bp and 5000000 cents is exactly 500 bp."
            - "One ACTIVE Undertaking on that issue. No placements exist yet."
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { current_utc: "2026-08-01T00:00:00Z" }
              as: FinanceDirector
              as_user_id: "fd-1"
            - call: "POST /disclosure/bond-issues"
              payload: { issuer_program_code: "UTILITYSYS", series_designation: "2023A", security_type: "REVENUE", dated_date: "2023-05-01", final_maturity_date: "2053-05-01", original_par_amount_cents: 100000000 }
              as: FinanceDirector
              as_user_id: "fd-1"
              captures: { issue_id: "$.data.id", par: "$.data.outstanding_par_amount_cents" }
            - call: "POST /disclosure/undertakings"
              payload: { issue_id: "${issue_id}", fiscal_year_end_month_day: "06-30", filing_window_days: 210, timeliness_basis: "SUBMISSION_BASIS" }
              as: FinanceDirector
              as_user_id: "fd-1"
              captures: { und_id: "$.data.id" }
          trigger:
            - call: "POST /disclosure/direct-placements"
              payload: { issue_id: "${issue_id}", lender_name: "First Meridian Bank", principal_amount_cents: 4990000, execution_date: "2026-08-05", review_window_start_date: "2026-08-10", review_window_end_date: "2026-08-20", disclosure_practice: "VOLUNTARY" }
              as: DisclosureOfficer
              as_user_id: "off-prep"
              captures: { p1_id: "$.data.id", p1_bp: "$.data.materiality_ratio_bp", p1_status: "$.data.status" }
            - call: "POST /disclosure/direct-placements"
              payload: { issue_id: "${issue_id}", lender_name: "Cascade Trust Company", principal_amount_cents: 5000000, execution_date: "2026-08-06", review_window_start_date: "2026-08-15", review_window_end_date: "2026-08-25", disclosure_practice: "VOLUNTARY" }
              as: DisclosureOfficer
              as_user_id: "off-prep"
              captures: { p2_id: "$.data.id", p2_bp: "$.data.materiality_ratio_bp", p2_status: "$.data.status" }
            - call: "POST /disclosure/direct-placements"
              payload: { issue_id: "${issue_id}", lender_name: "Northbank Capital", principal_amount_cents: 3000000, execution_date: "2026-08-07", review_window_start_date: "2026-08-20", review_window_end_date: "2026-08-30", disclosure_practice: "VOLUNTARY" }
              as: DisclosureOfficer
              as_user_id: "off-prep"
              captures: { err_capacity: "$.data.error_id" }
            - call: "POST /disclosure/direct-placements"
              payload: { issue_id: "${issue_id}", lender_name: "Northbank Capital", principal_amount_cents: 3000000, execution_date: "2026-08-07", review_window_start_date: "2026-08-21", review_window_end_date: "2026-08-31", disclosure_practice: "VOLUNTARY" }
              as: DisclosureOfficer
              as_user_id: "off-prep"
              captures: { p4_id: "$.data.id", p4_bp: "$.data.materiality_ratio_bp", p4_status: "$.data.status" }
            - call: "POST /disclosure/direct-placements/${p1_id}/classify"
              payload: { waiver_reason: "499 bp of outstanding par; below the 500 bp materiality threshold." }
              as: ComplianceReviewer
              as_user_id: "rev-1"
              captures: { p1_class: "$.data.status", p1_linked: "$.data.linked_notice_id" }
            - call: "POST /disclosure/direct-placements/${p2_id}/classify"
              payload: {}
              as: ComplianceReviewer
              as_user_id: "rev-1"
              captures: { p2_class: "$.data.status", p2_linked: "$.data.linked_notice_id" }
            - call: "GET /disclosure/material-event-notices?financial_obligation_ref=${p2_id}"
              payload: {}
              as: FinanceDirector
              as_user_id: "fd-1"
              captures: { n2_id: "$.data[0].id", n2_type: "$.data[0].event_type", n2_occ: "$.data[0].occurrence_date", n2_deadline: "$.data[0].filing_deadline_date", n2_perse: "$.data[0].per_se_material" }
            - call: "GET /disclosure/direct-placements?issue_id=${issue_id}"
              payload: {}
              as: FinanceDirector
              as_user_id: "fd-1"
              captures: { placement_total: "$.total_count" }
          assert:
            - "${par} == 100000000"
            - "${p1_bp} == 499 and ${p1_status} == RECEIVED — 4990000 * 10000 / 100000000 rounds to 499, just under the threshold"
            - "${p2_bp} == 500 and ${p2_status} == RECEIVED — 5000000 * 10000 / 100000000 is exactly 500, and >= is inclusive"
            - "both P1 [2026-08-10, 2026-08-20] and P2 [2026-08-15, 2026-08-25] are accepted: each is individually legal and 2026-08-15..2026-08-20 is covered exactly twice"
            - "${err_capacity} == ERR_PLACEMENT_REVIEW_CAPACITY_EXCEEDED with HTTP 409 — P3 starts on 2026-08-20, which is the LAST day of P1's closed window and inside P2's, so that single date would be covered three times"
            - "${p4_status} == RECEIVED and ${p4_bp} == 300 — shifting the start by one day to 2026-08-21 clears P1's closed window entirely, leaving a maximum cover of two"
            - "${p1_class} == DISCLOSURE_WAIVED and ${p1_linked} == null — 499 bp with practice VOLUNTARY takes the waived fork and mints no notice"
            - "${p2_class} == DISCLOSURE_REQUIRED and ${p2_linked} == \"${n2_id}\" — exactly 500 bp takes the disclosure fork"
            - "${n2_type} == FINANCIAL_OBLIGATION_INCURRENCE, ${n2_occ} == \"2026-08-06\" (the placement's execution_date, not the clock), ${n2_deadline} == \"2026-08-20\", ${n2_perse} == false"
            - "${placement_total} == 3 — P1, P2 and P4; the refused P3 created nothing"

  - rule_id: compensating_invariant
    instances:

      - name: cycle_withdrawal_restores_the_open_obligation_count_exactly
        grounds:
          - calculations.undertaking_open_obligation_count
          - state_machines.AnnualReportCycle.DRAFTING_to_WITHDRAWN
          - endpoints.POST_/disclosure/annual-report-cycles/{id}/withdraw
          - calculations.content_preparation_completeness_score
        distinguishing_aspect: |
          The conserved quantity is a COUNT that is deliberately fed by two different entity
          types at once — open cycles of the undertaking plus open material-event notices of its
          issue. A pre-existing MATERIAL notice holds the baseline at 1, so an implementation
          that "restores" the invariant by zeroing the counter, or that increments and decrements
          in place instead of recomputing from scratch, lands on 0 or 2 rather than 1. Voiding
          the items must also drive completeness_score_pct DOWN to 0.00 even though VOID items
          are excluded from the input set rather than scored as zero.
        test_recipe:
          setup:
            - "The clock stands at 2026-08-01T00:00:00Z."
            - "One OUTSTANDING BondIssue with a far-future maturity, one ACTIVE Undertaking, two ContentRequirements (OPERATING_DATA_TABLE 6000 and BUDGET_SUMMARY 4000, neither waivable)."
            - "One MaterialEventNotice (TRUSTEE_SUBSTITUTION, occurrence 2026-07-28) has been determined MATERIAL, so it is a permanent open obligation that the invariant must preserve."
            - "No cycle exists yet, so the baseline open_obligation_count is 1."
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { current_utc: "2026-08-01T00:00:00Z" }
              as: FinanceDirector
              as_user_id: "fd-1"
            - call: "POST /disclosure/bond-issues"
              payload: { issuer_program_code: "LIBRARYDIST", series_designation: "2024A", security_type: "GENERAL_OBLIGATION", dated_date: "2024-03-01", final_maturity_date: "2054-03-01", original_par_amount_cents: 100000000 }
              as: FinanceDirector
              as_user_id: "fd-1"
              captures: { issue_id: "$.data.id" }
            - call: "POST /disclosure/undertakings"
              payload: { issue_id: "${issue_id}", fiscal_year_end_month_day: "06-30", filing_window_days: 210, timeliness_basis: "SUBMISSION_BASIS" }
              as: FinanceDirector
              as_user_id: "fd-1"
              captures: { und_id: "$.data.id" }
            - call: "POST /disclosure/content-requirements"
              payload: { undertaking_id: "${und_id}", kind: "OPERATING_DATA_TABLE", label: "Operating Data Tables", weight_bp: 6000, waivable: false }
              as: DisclosureOfficer
              as_user_id: "off-prep"
              captures: { req1_id: "$.data.id" }
            - call: "POST /disclosure/content-requirements"
              payload: { undertaking_id: "${und_id}", kind: "BUDGET_SUMMARY", label: "Adopted Budget Summary", weight_bp: 4000, waivable: false }
              as: DisclosureOfficer
              as_user_id: "off-prep"
              captures: { req2_id: "$.data.id" }
            - call: "POST /disclosure/material-event-notices"
              payload: { issue_id: "${issue_id}", event_type: "TRUSTEE_SUBSTITUTION", occurrence_date: "2026-07-28" }
              as: DisclosureOfficer
              as_user_id: "off-prep"
              captures: { notice_id: "$.data.id" }
            - call: "POST /disclosure/material-event-notices/${notice_id}/determine"
              payload: { determination: "MATERIAL", determination_note: "Successor trustee appointed." }
              as: ComplianceReviewer
              as_user_id: "rev-1"
              captures: { notice_status0: "$.data.status" }
            - call: "GET /disclosure/undertakings/${und_id}"
              payload: {}
              as: FinanceDirector
              as_user_id: "fd-1"
              captures: { oblig_baseline: "$.data.open_obligation_count", weight_total: "$.data.content_weight_bp_total" }
          trigger:
            - call: "POST /disclosure/annual-report-cycles"
              payload: { undertaking_id: "${und_id}", fiscal_year_label: "FY2026", period_start_date: "2025-07-01", period_end_date: "2026-06-30" }
              as: DisclosureOfficer
              as_user_id: "off-prep"
              captures: { cycle_id: "$.data.id", cycle_status0: "$.data.status", score0: "$.data.completeness_score_pct" }
            - call: "GET /disclosure/undertakings/${und_id}"
              payload: {}
              as: FinanceDirector
              as_user_id: "fd-1"
              captures: { oblig_after_create: "$.data.open_obligation_count" }
            - call: "GET /disclosure/cycle-content-items?cycle_id=${cycle_id}&content_requirement_id=${req1_id}"
              payload: {}
              as: DisclosureOfficer
              as_user_id: "off-prep"
              captures: { item1_id: "$.data[0].id", item1_weight: "$.data[0].weight_bp_snapshot" }
            - call: "GET /disclosure/cycle-content-items?cycle_id=${cycle_id}&content_requirement_id=${req2_id}"
              payload: {}
              as: DisclosureOfficer
              as_user_id: "off-prep"
              captures: { item2_id: "$.data[0].id", item2_weight: "$.data[0].weight_bp_snapshot" }
            - call: "PATCH /disclosure/cycle-content-items/${item1_id}"
              payload: { data_as_of_date: "2026-06-30", source_document_ref: "OPDATA-FY2026.pdf" }
              as: DisclosureOfficer
              as_user_id: "off-prep"
              captures: { item1_status_draft: "$.data.status" }
            - call: "POST /disclosure/cycle-content-items/${item1_id}/attest"
              payload: {}
              as: DisclosureOfficer
              as_user_id: "off-prep"
            - call: "GET /disclosure/annual-report-cycles/${cycle_id}"
              payload: {}
              as: DisclosureOfficer
              as_user_id: "off-prep"
              captures: { score_mid: "$.data.completeness_score_pct" }
            - call: "POST /disclosure/annual-report-cycles/${cycle_id}/withdraw"
              payload: { withdrawal_reason: "Cycle opened against the wrong undertaking." }
              as: DisclosureOfficer
              as_user_id: "off-prep"
              captures: { cycle_status1: "$.data.status", score_after: "$.data.completeness_score_pct", wr: "$.data.withdrawal_reason" }
            - call: "GET /disclosure/undertakings/${und_id}"
              payload: {}
              as: FinanceDirector
              as_user_id: "fd-1"
              captures: { oblig_restored: "$.data.open_obligation_count", weight_total_after: "$.data.content_weight_bp_total", delinq_after: "$.data.delinquent_cycle_count", risk_after: "$.data.disclosure_risk_score", posture_after: "$.data.compliance_posture" }
            - call: "GET /disclosure/cycle-content-items?cycle_id=${cycle_id}&content_requirement_id=${req1_id}"
              payload: {}
              as: FinanceDirector
              as_user_id: "fd-1"
              captures: { item1_status_final: "$.data[0].status", item1_factor_final: "$.data[0].readiness_factor" }
            - call: "GET /disclosure/cycle-content-items?cycle_id=${cycle_id}&content_requirement_id=${req2_id}"
              payload: {}
              as: FinanceDirector
              as_user_id: "fd-1"
              captures: { item2_status_final: "$.data[0].status" }
            - call: "GET /disclosure/material-event-notices/${notice_id}"
              payload: {}
              as: FinanceDirector
              as_user_id: "fd-1"
              captures: { notice_status1: "$.data.status" }
          assert:
            - "${notice_status0} == MATERIAL, ${oblig_baseline} == 1, ${weight_total} == 10000"
            - "${cycle_status0} == DRAFTING, ${score0} == 0.00, ${item1_weight} == 6000, ${item2_weight} == 4000"
            - "${oblig_after_create} == 2 — the new DRAFTING cycle joins the still-open notice"
            - "${item1_status_draft} == DRAFT and ${score_mid} == 60.00 — one READY 6000-bp item plus one NOT_STARTED 4000-bp item"
            - "${cycle_status1} == WITHDRAWN and ${wr} == \"Cycle opened against the wrong undertaking.\""
            - "${item1_status_final} == VOID, ${item1_factor_final} == 0.0, ${item2_status_final} == VOID"
            - "${score_after} == 0.00 — every item left the input set, so the score falls back to the empty-set value rather than staying at 60.00"
            - "${oblig_restored} == 1 — EXACTLY the pre-creation baseline, not 0 and not 2"
            - "${notice_status1} == MATERIAL — withdrawing a cycle must not disturb the sibling obligation that supplies the baseline"
            - "${weight_total_after} == 10000 — the requirement weights are configuration and are untouched by withdrawal"
            - "${delinq_after} == 0, ${risk_after} == 0.00, ${posture_after} == COMPLIANT — the compensation leaves no residue in the risk chain"

      - name: confirmed_correction_conserves_billable_filing_count_and_invoice_total
        grounds:
          - calculations.dissemination_agent_invoice
          - endpoints.POST_/disclosure/filings/{id}/confirm
          - state_machines.Filing.CONFIRMED_to_SUPERSEDED
          - validations.priority_28_ERR_FILING_SUBJECT_MISMATCH
          - validations.priority_30_ERR_SUPERSEDE_TARGET_INVALID
        distinguishing_aspect: |
          A different flavour of compensation from the withdraw instance: nothing is undone, a
          SECOND confirmed filing is added, and the invariant is that the money and the count do
          not move. Because billable_filing_count is defined over filings in status exactly
          CONFIRMED, the superseded predecessor drops out at the same instant the corrector
          drops in, so a naive implementation that increments on confirm reports 2 filings and
          490000 cents instead of 1 and 445000. Correction also has to SKIP cascade hop 1
          entirely, so the notice's discharged status, days_late and timeliness must be
          byte-identical before and after, and no second failure event may appear.
        test_recipe:
          setup:
            - "The clock stands at 2026-08-01T00:00:00Z throughout, so no deadline can move underneath the test."
            - "One OUTSTANDING BondIssue with a far-future maturity, one ACTIVE Undertaking, one ACTIVE DisseminationEngagement with retainer_cents 400000 and last_calendar_ack_date 2026-08-01."
            - "One MaterialEventNotice (BOND_CALL, occurrence 2026-08-01, per se material, deadline 2026-08-14) has been determined MATERIAL, filed, and CONFIRMED as FILED_TIMELY with days_late 0."
            - "Retainer 400000 plus one tier-1 filing fee of 45000 gives 445000, comfortably above the 300000 floor and below the 1200000 cap, so both the floor and the cap are out of the way and only the count can move the number."
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { current_utc: "2026-08-01T00:00:00Z" }
              as: FinanceDirector
              as_user_id: "fd-1"
            - call: "POST /disclosure/bond-issues"
              payload: { issuer_program_code: "HOSPAUTH", series_designation: "2025A", security_type: "REVENUE", dated_date: "2025-01-01", final_maturity_date: "2055-01-01", original_par_amount_cents: 100000000 }
              as: FinanceDirector
              as_user_id: "fd-1"
