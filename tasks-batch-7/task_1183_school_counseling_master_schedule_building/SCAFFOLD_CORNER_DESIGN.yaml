        test_recipe:
          setup:
            - "term COLLECTING with 12 DRAFT requests for student s_pg (12 courses PG-1..PG-12)"
          setup_api_calls:
            - call: "POST /scheduling/counselors"
              payload: { full_name: "C Pg", max_caseload: 50 }
              as: Administrator
              captures: { c_pg: "$.data.id" }
            - call: "POST /scheduling/terms"
              payload: { code: "2059-FALL", periods_per_day: 8, max_students_per_section: 32, class_size_target: 25 }
              as: Administrator
              captures: { t_pg: "$.data.id" }
            - call: "POST /scheduling/students"
              payload: { external_ref: "PG", full_name: "Pg Stu", grade_level: 9, counselor_id: "${c_pg}" }
              as: Administrator
              captures: { s_pg: "$.data.id" }
            # NOTE for the test-generator: loop 12 course creations (PG-1..12)
