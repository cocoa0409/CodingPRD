  # ─────────────────────────────────────────────────────────────────────────
  # §1.9 ERRORS — every one of the 57 codes in §1.6 must be reachable. The
  # instances below cover the codes no other §1.8 or §1.9 instance reaches;
  # codes already exercised elsewhere in §1.9 (ERR_INVALID_REQUEST,
  # ERR_CONTRACT_NOT_ACTIVE, ERR_CONTRACT_ITEM_NOT_ACTIVE, ERR_XREF_NOT_PROPOSED,
  # ERR_INVALID_LOP_STATE, ERR_INVALID_ACTIVATION_STATE, ERR_INVALID_FILE_STATE,
  # ERR_INVALID_DISTRIBUTION_STATE, ERR_INVALID_REVIEW_STATE,
  # ERR_UNAUTHENTICATED, ERR_ROLE_NOT_PERMITTED, ERR_MEMBER_SCOPE_VIOLATION,
  # ERR_MEMBER_ITEM_NOT_IN_MASTER, ERR_DUPLICATE_XREF,
  # ERR_DUPLICATE_MEASUREMENT_PERIOD, ERR_DUPLICATE_COMMITMENT,
  # ERR_TIER_CODE_UNKNOWN, ERR_EFFECTIVE_WINDOW_INVALID,
  # ERR_PERIOD_OUTSIDE_CONTRACT_TERM, ERR_REQUESTED_PRICE_REQUIRED,
  # ERR_REQUESTED_PRICE_NOT_ALLOWED, ERR_COMMITTED_VOLUME_BELOW_TIER,
  # ERR_COLLECTION_EXCEEDS_ACCRUAL, ERR_DISTRIBUTION_BASIS_NOT_COLLECTABLE,
  # ERR_CLINICAL_REVIEW_NOT_ENDORSED) are not repeated here, and the ones §1.8
  # owns are recorded as excluded_because stubs at the end of the section.
  # ─────────────────────────────────────────────────────────────────────────
  - section: errors
    instances:

      - name: every_unknown_path_id_returns_its_own_not_found_code
        claim_type: violation_to_error
        grounds:
          - validations[priority=4]
          - errors.ERR_XREF_NOT_FOUND
          - errors.ERR_ACTIVATION_NOT_FOUND
          - errors.ERR_FILE_NOT_FOUND
          - errors.ERR_MEASUREMENT_NOT_FOUND
          - errors.ERR_DISTRIBUTION_NOT_FOUND
          - errors.ERR_PURCHASE_LINE_NOT_FOUND
        distinguishing_aspect: "All eleven path-parameterised entity types report a DISTINCT 404 code rather than collapsing into one generic not-found, and a path id is resolved before anything else: an unknown contract on the nested create POST /gpo/contracts/{contract_id}/items is ERR_CONTRACT_NOT_FOUND even with a well-formed body. The mirror case is that an unknown FK value passed as a LIST FILTER is not a not-found at all — GET /gpo/purchase-lines with an unmatched distributor_file_id is a 200 with an empty array, because filters select rows rather than resolve resources."
        test_recipe:
          setup: ["No fixtures; every id below is a syntactically valid UUID that matches nothing."]
          setup_api_calls: []
          trigger:
            - call: "GET /gpo/contracts/00000000-0000-4000-8000-000000000001"
              payload: {}
              as: ContractManager
              captures: { e1: $.data.error_id }
            - call: "GET /gpo/contract-items/00000000-0000-4000-8000-000000000002"
              payload: {}
              as: ContractManager
              captures: { e2: $.data.error_id }
            - call: "GET /gpo/members/00000000-0000-4000-8000-000000000003"
              payload: {}
              as: ContractManager
              captures: { e3: $.data.error_id }
            - call: "GET /gpo/commitments/00000000-0000-4000-8000-000000000004"
              payload: {}
              as: ComplianceAnalyst
              captures: { e4: $.data.error_id }
            - call: "GET /gpo/item-cross-references/00000000-0000-4000-8000-000000000005"
              payload: {}
              as: MemberMaterialsManager
              captures: { e5: $.data.error_id }
            - call: "GET /gpo/price-activations/00000000-0000-4000-8000-000000000006"
              payload: {}
              as: ContractManager
              captures: { e6: $.data.error_id }
            - call: "GET /gpo/distributor-files/00000000-0000-4000-8000-000000000007"
              payload: {}
              as: DistributorAgent
              captures: { e7: $.data.error_id }
            - call: "GET /gpo/compliance-measurements/00000000-0000-4000-8000-000000000008"
              payload: {}
              as: ComplianceAnalyst
              captures: { e8: $.data.error_id }
            - call: "GET /gpo/admin-fee-distributions/00000000-0000-4000-8000-000000000009"
              payload: {}
              as: FinanceAdministrator
              captures: { e9: $.data.error_id }
            - call: "GET /gpo/clinical-evidence-reviews/00000000-0000-4000-8000-00000000000a"
              payload: {}
              as: ClinicalReviewer
              captures: { e10: $.data.error_id }
            - call: "GET /gpo/purchase-lines/00000000-0000-4000-8000-00000000000b"
              payload: {}
              as: ComplianceAnalyst
              captures: { e11: $.data.error_id }
            - call: "POST /gpo/contracts/00000000-0000-4000-8000-00000000000c/items"
              payload: { vendor_item_number: "V-1", item_description: "Suture 3-0 absorbable", uom: "EA", units_per_uom: 1, base_price_cents: 10000, floor_price_cents: 8200 }
              as: ContractManager
              captures: { e12: $.data.error_id }
            - call: "GET /gpo/purchase-lines"
              payload: { distributor_file_id: "00000000-0000-4000-8000-00000000000d", limit: 10, offset: 0 }
              as: ComplianceAnalyst
          assert:
            - "${e1} == ERR_CONTRACT_NOT_FOUND, ${e2} == ERR_CONTRACT_ITEM_NOT_FOUND, ${e3} == ERR_MEMBER_NOT_FOUND, ${e4} == ERR_COMMITMENT_NOT_FOUND"
            - "${e5} == ERR_XREF_NOT_FOUND, ${e6} == ERR_ACTIVATION_NOT_FOUND, ${e7} == ERR_FILE_NOT_FOUND, ${e8} == ERR_MEASUREMENT_NOT_FOUND"
            - "${e9} == ERR_DISTRIBUTION_NOT_FOUND, ${e10} == ERR_REVIEW_NOT_FOUND, ${e11} == ERR_PURCHASE_LINE_NOT_FOUND"
            - "all eleven are HTTP 404 and no two share a code"
            - "${e12} == ERR_CONTRACT_NOT_FOUND — the path id is resolved before the body is validated at all"
