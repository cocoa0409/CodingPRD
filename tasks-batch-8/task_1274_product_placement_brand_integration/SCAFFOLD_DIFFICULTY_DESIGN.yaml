  # ===========================================================================
  # Rule 4 — transitive_cascade (verify-triggered depth-3 chain vs
  #           terminate-triggered depth-2 chain)
  # ===========================================================================
  - rule_id: transitive_cascade
    instances:
      - name: verify_shortfall_cascade_to_cross_promo
        grounds:
          - state_machines.IntegrationContract.UNDER_VERIFICATION_to_MAKEGOOD_REQUIRED
          - state_machines.CrossPromoObligation.FULFILLED_to_PARTIALLY_FULFILLED
          - calculations.makegood_compensation
        distinguishing_aspect: |
          Depth-3 chain triggered by POST /airing-reports/{id}/verify: verify
          mutates the contract (link 1: UNDER_VERIFICATION -> MAKEGOOD_REQUIRED),
          the contract transition creates a MakeGoodCredit (link 2), and the
          credit creation increments CrossPromoObligation.owed_count (link 3) —
          each hop caused by the previous mutation, not by the original request.
        test_recipe:
          setup:
            - "Full chain: brand BEVERAGE, OPEN brief 1000000, STANDARD series, episode airs 2026-06-01, opportunity [0,40) est 25s, GRANTED clearance"
            - "Contract fee 1000000, guaranteed 30s + 2 mentions, cross_promo_owed_count 2, rate 2000; ACTIVE; CrossPromoObligation owed 2 / fulfilled 0 / OWED"
            - "Disclosure ACKNOWLEDGED; episode AIRED (clock 2026-06-02); report segments [20], mentions 1"
          setup_api_calls:
            - { call: "POST /brands", payload: { name: "FizzCo", category: "BEVERAGE" }, as: AgencyAdmin, captures: { b_id: $.data.id } }
            - { call: "POST /brands/${b_id}/briefs", payload: { title: "Summer fizz", objective: "awareness", budget_cents: 1000000 }, as: BrandRep, as_user_id: "${b_id}", captures: { br_id: $.data.id } }
            - { call: "POST /briefs/${br_id}/submit", as: BrandRep, as_user_id: "${b_id}" }
            - { call: "POST /series", payload: { name: "Night Shift", network_name: "NBN", clearance_policy: "STANDARD" }, as: AgencyAdmin, captures: { s_id: $.data.id } }
            - { call: "POST /series/${s_id}/episodes", payload: { episode_number: 1, runtime_seconds: 1200, air_date: "2026-06-01T20:00:00Z" }, as: ProductionRep, as_user_id: "prod-1", captures: { ep_id: $.data.id, ep_v: $.data.version } }
            - { call: "POST /episodes/${ep_id}/opportunities", payload: { scene_description: "Kitchen", start_timecode_seconds: 0, end_timecode_seconds: 40, estimated_exposure_seconds: 25 }, as: ProductionRep, as_user_id: "prod-1", captures: { opp_id: $.data.id } }
            - { call: "POST /episodes/${ep_id}/clearances", payload: { brand_id: "${b_id}", expected_episode_version: "${ep_v}" }, as: IntegrationManager, captures: { cl_id: $.data.id } }
            - { call: "POST /clearances/${cl_id}/decide", payload: { decision: "GRANT" }, as: ClearanceOfficer, as_user_id: "co-1" }
            - { call: "POST /proposals", payload: { brief_id: "${br_id}", opportunity_id: "${opp_id}", proposed_fee_cents: 1000000, guaranteed_seconds: 30, guaranteed_verbal_mentions: 2, cross_promo_owed_count: 2, rate_cents_per_second: 2000 }, as: IntegrationManager, captures: { p_id: $.data.id } }
            - { call: "POST /proposals/${p_id}/submit", as: IntegrationManager }
            - { call: "POST /proposals/${p_id}/production-decision", payload: { decision: "APPROVE" }, as: ProductionRep, as_user_id: "prod-2" }
            - { call: "POST /proposals/${p_id}/network-decision", payload: { decision: "APPROVE" }, as: NetworkStandardsReviewer, as_user_id: "nsr-1" }
            - { call: "POST /episodes/${ep_id}/lock", as: ProductionRep, as_user_id: "prod-1" }
            - { call: "POST /proposals/${p_id}/contract", as: IntegrationManager, captures: { ct_id: $.data.id } }
            - { call: "POST /contracts/${ct_id}/activate", as: IntegrationManager }
            - { call: "POST /contracts/${ct_id}/disclosures", payload: { disclosure_text: "Paid placement by FizzCo" }, as: IntegrationManager, captures: { d_id: $.data.id } }
            - { call: "POST /disclosures/${d_id}/file", as: IntegrationManager }
            - { call: "POST /_clock/set_current_utc", payload: { to_iso8601: "2026-06-02T00:00:00Z" }, as: AgencyAdmin }
            - { call: "POST /episodes/${ep_id}/mark-aired", as: ProductionRep, as_user_id: "prod-1" }
            - { call: "POST /disclosures/${d_id}/acknowledge", as: NetworkStandardsReviewer, as_user_id: "nsr-1" }
            - { call: "POST /episodes/${ep_id}/airing-reports", payload: { contract_id: "${ct_id}", measured_segments_seconds: [20], measured_verbal_mentions: 1 }, as: VerificationAnalyst, as_user_id: "ver-1", captures: { r_id: $.data.id } }
          trigger:
            - { call: "POST /airing-reports/${r_id}/verify", as: VerificationAnalyst, as_user_id: "ver-2", captures: { r_status: $.data.status } }
            - { call: "GET /contracts/${ct_id}", as: IntegrationManager, captures: { ct_status: $.data.status, ct_outstanding: $.data.outstanding_balance_cents, ct_mg_total: $.data.makegood_total_cents } }
            - { call: "GET /contracts/${ct_id}/makegood-credits", as: IntegrationManager, captures: { mg_amt: "$.data[0].amount_cents", mg_status: "$.data[0].status", mg_reason: "$.data[0].reason" } }
            - { call: "GET /contracts/${ct_id}/cross-promos", as: IntegrationManager, captures: { cp_owed: "$.data[0].owed_count", cp_fulfilled: "$.data[0].fulfilled_count", cp_status: "$.data[0].status" } }
          assert:
            - "captured r_status == VERIFIED"
            - "captured ct_status == MAKEGOOD_REQUIRED (link 1)"
            - "captured mg_amt == 35000 and mg_status == PENDING and mg_reason == COMBINED (link 2)"
            - "captured cp_owed == 3 (link 3: 2 + MAKEGOOD_PROMO_PENALTY 1)"
            - "captured cp_fulfilled == 0 and cp_status == OWED"
            - "captured ct_outstanding == 965000 and ct_mg_total == 35000"
      - name: terminate_cascade_voids_continuity
        grounds:
          - state_machines.IntegrationContract.ACTIVE_to_TERMINATED
          - state_machines.PropShipment.STAGED_to_RETURN_REQUESTED
        distinguishing_aspect: |
          Depth-2 chain triggered by POST /contracts/{id}/terminate: terminate
          mutates the STAGED shipment to RETURN_REQUESTED (link 1), and that
          shipment transition voids its LOGGED ContinuityRecord (link 2) — a
          different trigger and propagation pattern from the verify cascade.
        test_recipe:
          setup:
            - "Full chain through ACTIVE contract (fee 1000000, guaranteed 30s, 0 mentions, 0 promos, rate 2000; GRANTED clearance; episode LOCKED, not aired)"
            - "Shipment advanced PENDING -> DISPATCHED -> DELIVERED -> STAGED; continuity record LOGGED against the shipment"
          setup_api_calls:
            - { call: "POST /brands", payload: { name: "FizzCo", category: "BEVERAGE" }, as: AgencyAdmin, captures: { b_id: $.data.id } }
            - { call: "POST /brands/${b_id}/briefs", payload: { title: "Summer fizz", objective: "awareness", budget_cents: 1000000 }, as: BrandRep, as_user_id: "${b_id}", captures: { br_id: $.data.id } }
            - { call: "POST /briefs/${br_id}/submit", as: BrandRep, as_user_id: "${b_id}" }
            - { call: "POST /series", payload: { name: "Night Shift", network_name: "NBN", clearance_policy: "STANDARD" }, as: AgencyAdmin, captures: { s_id: $.data.id } }
            - { call: "POST /series/${s_id}/episodes", payload: { episode_number: 1, runtime_seconds: 1200, air_date: "2026-06-01T20:00:00Z" }, as: ProductionRep, as_user_id: "prod-1", captures: { ep_id: $.data.id, ep_v: $.data.version } }
            - { call: "POST /episodes/${ep_id}/opportunities", payload: { scene_description: "Kitchen", start_timecode_seconds: 0, end_timecode_seconds: 40, estimated_exposure_seconds: 25 }, as: ProductionRep, as_user_id: "prod-1", captures: { opp_id: $.data.id } }
            - { call: "POST /episodes/${ep_id}/clearances", payload: { brand_id: "${b_id}", expected_episode_version: "${ep_v}" }, as: IntegrationManager, captures: { cl_id: $.data.id } }
            - { call: "POST /clearances/${cl_id}/decide", payload: { decision: "GRANT" }, as: ClearanceOfficer, as_user_id: "co-1" }
            - { call: "POST /proposals", payload: { brief_id: "${br_id}", opportunity_id: "${opp_id}", proposed_fee_cents: 1000000, guaranteed_seconds: 30, guaranteed_verbal_mentions: 0, cross_promo_owed_count: 0, rate_cents_per_second: 2000 }, as: IntegrationManager, captures: { p_id: $.data.id } }
            - { call: "POST /proposals/${p_id}/submit", as: IntegrationManager }
            - { call: "POST /proposals/${p_id}/production-decision", payload: { decision: "APPROVE" }, as: ProductionRep, as_user_id: "prod-2" }
            - { call: "POST /proposals/${p_id}/network-decision", payload: { decision: "APPROVE" }, as: NetworkStandardsReviewer, as_user_id: "nsr-1" }
            - { call: "POST /episodes/${ep_id}/lock", as: ProductionRep, as_user_id: "prod-1" }
            - { call: "POST /proposals/${p_id}/contract", as: IntegrationManager, captures: { ct_id: $.data.id } }
            - { call: "POST /contracts/${ct_id}/activate", as: IntegrationManager }
            - { call: "POST /contracts/${ct_id}/shipments", payload: { item_description: "Branded fridge", quantity: 2 }, as: IntegrationManager, captures: { sh_id: $.data.id } }
            - { call: "POST /shipments/${sh_id}/advance", payload: { to: "DISPATCHED" }, as: IntegrationManager }
            - { call: "POST /shipments/${sh_id}/advance", payload: { to: "DELIVERED" }, as: IntegrationManager }
            - { call: "POST /shipments/${sh_id}/advance", payload: { to: "STAGED" }, as: IntegrationManager }
            - { call: "POST /contracts/${ct_id}/continuity-records", payload: { shipment_id: "${sh_id}", scene_timecode_seconds: 12, note: "fridge visible left of frame" }, as: ProductionRep, as_user_id: "prod-1", captures: { cr_id: $.data.id } }
          trigger:
            - { call: "POST /contracts/${ct_id}/terminate", as: IntegrationManager, captures: { ct_status: $.data.status } }
            - { call: "GET /shipments/${sh_id}", as: IntegrationManager, captures: { sh_status: $.data.status } }
            - { call: "GET /contracts/${ct_id}/continuity-records", as: IntegrationManager, captures: { cr_status: "$.data[0].status" } }
          assert:
            - "captured ct_status == TERMINATED"
            - "captured sh_status == RETURN_REQUESTED (link 1)"
            - "captured cr_status == VOID (link 2: voided by the shipment transition, not by the terminate call directly)"
            - "ScriptOpportunity.${opp_id}.status == IDENTIFIED (released back)"

  # ===========================================================================
  # Rule 5 — priority_pair_validation_conflict (state-vs-fiscal and
  #           constraint-vs-fiscal: different error-category pairs)
  # ===========================================================================
  - rule_id: priority_pair_validation_conflict
    instances:
      - name: terminal_state_beats_budget_on_terms_amend
        grounds:
          - validations[priority=6]
          - validations[priority=11]
          - concurrency_rules[contract-terms-stale-version]
        distinguishing_aspect: |
          Pair (state, business_fiscal): PATCH terms on a SETTLED contract with
          a fee that would also blow the brief budget must return
          ERR_ALREADY_TERMINAL (state, priority 6), never ERR_BUDGET_EXCEEDED
          (fiscal, priority 11).
        test_recipe:
          setup:
            - "Full chain to SETTLED: fee 1000000 of budget 1000000, guaranteed 30s + 2 mentions, 0 promos, rate 2000; report segments [30], mentions 2 verified clean"
          setup_api_calls:
            - { call: "POST /brands", payload: { name: "FizzCo", category: "BEVERAGE" }, as: AgencyAdmin, captures: { b_id: $.data.id } }
            - { call: "POST /brands/${b_id}/briefs", payload: { title: "Summer fizz", objective: "awareness", budget_cents: 1000000 }, as: BrandRep, as_user_id: "${b_id}", captures: { br_id: $.data.id } }
            - { call: "POST /briefs/${br_id}/submit", as: BrandRep, as_user_id: "${b_id}" }
            - { call: "POST /series", payload: { name: "Night Shift", network_name: "NBN", clearance_policy: "STANDARD" }, as: AgencyAdmin, captures: { s_id: $.data.id } }
            - { call: "POST /series/${s_id}/episodes", payload: { episode_number: 1, runtime_seconds: 1200, air_date: "2026-06-01T20:00:00Z" }, as: ProductionRep, as_user_id: "prod-1", captures: { ep_id: $.data.id, ep_v: $.data.version } }
            - { call: "POST /episodes/${ep_id}/opportunities", payload: { scene_description: "Kitchen", start_timecode_seconds: 0, end_timecode_seconds: 40, estimated_exposure_seconds: 30 }, as: ProductionRep, as_user_id: "prod-1", captures: { opp_id: $.data.id } }
            - { call: "POST /episodes/${ep_id}/clearances", payload: { brand_id: "${b_id}", expected_episode_version: "${ep_v}" }, as: IntegrationManager, captures: { cl_id: $.data.id } }
            - { call: "POST /clearances/${cl_id}/decide", payload: { decision: "GRANT" }, as: ClearanceOfficer, as_user_id: "co-1" }
            - { call: "POST /proposals", payload: { brief_id: "${br_id}", opportunity_id: "${opp_id}", proposed_fee_cents: 1000000, guaranteed_seconds: 30, guaranteed_verbal_mentions: 2, cross_promo_owed_count: 0, rate_cents_per_second: 2000 }, as: IntegrationManager, captures: { p_id: $.data.id } }
            - { call: "POST /proposals/${p_id}/submit", as: IntegrationManager }
            - { call: "POST /proposals/${p_id}/production-decision", payload: { decision: "APPROVE" }, as: ProductionRep, as_user_id: "prod-2" }
            - { call: "POST /proposals/${p_id}/network-decision", payload: { decision: "APPROVE" }, as: NetworkStandardsReviewer, as_user_id: "nsr-1" }
            - { call: "POST /episodes/${ep_id}/lock", as: ProductionRep, as_user_id: "prod-1" }
            - { call: "POST /proposals/${p_id}/contract", as: IntegrationManager, captures: { ct_id: $.data.id } }
            - { call: "POST /contracts/${ct_id}/activate", as: IntegrationManager }
            - { call: "POST /contracts/${ct_id}/disclosures", payload: { disclosure_text: "Paid placement by FizzCo" }, as: IntegrationManager, captures: { d_id: $.data.id } }
            - { call: "POST /disclosures/${d_id}/file", as: IntegrationManager }
            - { call: "POST /_clock/set_current_utc", payload: { to_iso8601: "2026-06-02T00:00:00Z" }, as: AgencyAdmin }
            - { call: "POST /episodes/${ep_id}/mark-aired", as: ProductionRep, as_user_id: "prod-1" }
            - { call: "POST /disclosures/${d_id}/acknowledge", as: NetworkStandardsReviewer, as_user_id: "nsr-1" }
            - { call: "POST /episodes/${ep_id}/airing-reports", payload: { contract_id: "${ct_id}", measured_segments_seconds: [30], measured_verbal_mentions: 2 }, as: VerificationAnalyst, as_user_id: "ver-1", captures: { r_id: $.data.id } }
            - { call: "POST /airing-reports/${r_id}/verify", as: VerificationAnalyst, as_user_id: "ver-2" }
            - { call: "GET /contracts/${ct_id}", as: IntegrationManager, captures: { ct_v: $.data.version, ct_status: $.data.status } }
          trigger:
            - { call: "PATCH /contracts/${ct_id}/terms", payload: { base_fee_cents: 5000000, expected_contract_version: "${ct_v}" }, as: IntegrationManager, captures: { err: $.data.error_id } }
          assert:
            - "precondition: captured ct_status == SETTLED (terminal)"
            - "captured err == ERR_ALREADY_TERMINAL (state category wins over the budget violation the 5000000 fee would also trigger)"
            - "IntegrationContract.${ct_id}.base_fee_cents == 1000000 (unchanged)"
      - name: opportunity_conflict_beats_budget_on_proposal_create
        grounds:
          - validations[priority=8]
          - validations[priority=11]
        distinguishing_aspect: |
          Pair (business_constraint, business_fiscal): creating a proposal on a
          PITCHED opportunity with a fee that also exceeds the brief's
          remaining budget must return ERR_OPPORTUNITY_UNAVAILABLE (constraint,
          priority 8), never ERR_BUDGET_EXCEEDED (fiscal, priority 11) — a
          different category pair than state-vs-fiscal.
        test_recipe:
          setup:
            - "Brand with OPEN brief budget 100000; STANDARD series; episode with opportunity [0,40) est 25s"
            - "Proposal A on the opportunity: fee 60000, guaranteed 10s, rate 2000, submitted (remaining budget 40000; opportunity PITCHED)"
          setup_api_calls:
            - { call: "POST /brands", payload: { name: "FizzCo", category: "BEVERAGE" }, as: AgencyAdmin, captures: { b_id: $.data.id } }
            - { call: "POST /brands/${b_id}/briefs", payload: { title: "Small push", objective: "trial", budget_cents: 100000 }, as: BrandRep, as_user_id: "${b_id}", captures: { br_id: $.data.id } }
            - { call: "POST /briefs/${br_id}/submit", as: BrandRep, as_user_id: "${b_id}" }
            - { call: "POST /series", payload: { name: "Night Shift", network_name: "NBN", clearance_policy: "STANDARD" }, as: AgencyAdmin, captures: { s_id: $.data.id } }
            - { call: "POST /series/${s_id}/episodes", payload: { episode_number: 1, runtime_seconds: 1200, air_date: "2026-06-01T20:00:00Z" }, as: ProductionRep, as_user_id: "prod-1", captures: { ep_id: $.data.id } }
            - { call: "POST /episodes/${ep_id}/opportunities", payload: { scene_description: "Kitchen", start_timecode_seconds: 0, end_timecode_seconds: 40, estimated_exposure_seconds: 25 }, as: ProductionRep, as_user_id: "prod-1", captures: { opp_id: $.data.id } }
            - { call: "POST /proposals", payload: { brief_id: "${br_id}", opportunity_id: "${opp_id}", proposed_fee_cents: 60000, guaranteed_seconds: 10, guaranteed_verbal_mentions: 0, cross_promo_owed_count: 0, rate_cents_per_second: 2000 }, as: IntegrationManager, captures: { pa_id: $.data.id } }
            - { call: "POST /proposals/${pa_id}/submit", as: IntegrationManager }
          trigger:
            - { call: "POST /proposals", payload: { brief_id: "${br_id}", opportunity_id: "${opp_id}", proposed_fee_cents: 50000, guaranteed_seconds: 10, guaranteed_verbal_mentions: 0, cross_promo_owed_count: 0, rate_cents_per_second: 2000 }, as: IntegrationManager, captures: { err: $.data.error_id } }
          assert:
            - "captured err == ERR_OPPORTUNITY_UNAVAILABLE (constraint beats fiscal: fee 50000 > remaining 40000 would also fail)"
            - "BrandBrief.${br_id}.remaining_budget_cents == 40000 (unchanged by rejected create)"

  # ===========================================================================
  # Rule 6 — boundary_precision_check (seconds equality at verify vs cents
  #           equality at proposal create: different metrics, different endpoints)
  # ===========================================================================
  - rule_id: boundary_precision_check
    instances:
      - name: exact_guaranteed_seconds_settles_clean
        grounds:
          - calculations.makegood_compensation
          - state_machines.IntegrationContract.UNDER_VERIFICATION_to_SETTLED
        distinguishing_aspect: |
          Metric exposure-seconds via POST /airing-reports/{id}/verify:
          measured_seconds exactly equal to guaranteed_seconds (30 == 30) is
          NOT a shortfall (shortfall only when strictly below), so makegood is
          0 and the contract settles directly — >= boundary pinned.
        test_recipe:
          setup:
            - "Full chain to ACTIVE contract: fee 1000000, guaranteed 30s + 2 mentions, 0 promos, rate 2000; GRANTED clearance; disclosure ACKNOWLEDGED; episode AIRED"
          setup_api_calls:
