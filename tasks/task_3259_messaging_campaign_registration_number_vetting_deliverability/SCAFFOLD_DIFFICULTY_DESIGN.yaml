            - call: "POST /messaging/accounts/${acct}/consent_records"
              payload: { brand_id: "${brand}", phone_number: "+15550000070", evidence_url: "https://e/70", evidence_text: "web", captured_at: "2026-09-01T00:00:00Z", consent_method: "WEB_FORM" }
              as: BrandManager
            - call: "POST /messaging/accounts/${acct}/messages"
