  - section: cross_cutting_complexity_layers
    instances:

      - name: stale_composer_version_refuses_statement_then_fresh_version_succeeds
        claim_type: optimistic_concurrency
        grounds:
          - complexity_profile.complexity_layers[optimistic_concurrency]
          - concurrency_rules[statement_generation_guards_composer_ledger]
          - errors[ERR_COMPOSER_VERSION_CONFLICT]
        distinguishing_aspect: |
          The stale token is produced by a real intervening write (a second ledger entry) rather than by a
          hand-made number, so an implementation that only bumps Composer.version on statement creation
          still accepts the stale request; the retry then proves the sweep uses the *current* ledger
          (two lines, 50000) and not the snapshot the first attempt was built from.
        test_recipe:
          setup:
            - "One composer with tax_withholding_pct 0.30 and one ADJUSTMENT of 40000; the caller reads the version, then a second ADJUSTMENT of 10000 lands."
          setup_api_calls:
            - call: "POST /music-library/composers"
              payload: { display_name: "Nadia Okoro", pro_affiliation: "ASCAP", payee_country: "US", tax_withholding_pct: 0.30 }
