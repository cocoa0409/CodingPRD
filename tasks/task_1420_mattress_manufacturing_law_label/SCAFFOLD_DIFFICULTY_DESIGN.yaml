# =============================================================================
# §1.8 Scaffold Difficulty Design — mattress-law-label
# 9 rules × >= 2 instances = 20 instances. Every chain replays from empty DB
# using only §1.5 endpoints. Role ids: PlantManager pm-1, ComplianceOfficer
# co-1 (creator) / co-2 (approver), LineSupervisor ls-1, QcInspector qc-1,
# LogisticsCoordinator log-1. Retailer callers use the retailer entity id.
# Default logical clock (unset): 2026-08-01T00:00:00Z.
# =============================================================================
scaffold_difficulty_design:
  # ===========================================================================
  # Rule 1 — dual_variant_calc (different entity domains: WarrantyClaim vs RecyclingIntake)
  # ===========================================================================
  - rule_id: dual_variant_calc
    instances:
      - name: warranty_full_replacement_vs_prorated_divergence
        grounds:
          - calculations.warranty_credit_amount
          - entities.WarrantyClaim.fields.credit_variant
          - entities.WarrantyClaim.fields.credit_cents
        distinguishing_aspect: |
          On the WarrantyClaim entity, the FULL_REPLACEMENT variant (age_months <= 12)
          pays the full purchase price while the PRORATED variant (age_months > 12) pays
          a time-linear amount: two units with identical price 200000 and identical sag
          produce credit_cents 200000 vs 178333 purely from the variant selection.
        test_recipe:
          setup:
            - "ACTIVE model with ACTIVE CA law label; CURED foam batch; retailer with credit_limit 100000000"
            - "Order (quantity 2, unit_price_cents 200000) COMPLETE; units u1,u2 DELIVERED at clock 2026-08-02T00:00:00Z"
          setup_api_calls:
            - { call: "POST /plant/retailers", payload: { retailer_name: "SleepCo", drop_ship_enabled: true, recycling_enrolled: true, credit_limit_cents: 100000000 }, as: PlantManager, captures: { r_id: $.data.id } }
            - { call: "POST /plant/models", payload: { model_code: "SRT-DV1", quilt_pattern: "DIAMOND" }, as: PlantManager, captures: { m_id: $.data.id } }
            - { call: "POST /plant/models/${m_id}/bom-lines", payload: { component_type: "FOAM_CORE", material_code: "MAT-F1", quantity_per_unit: 2.0, unit_cost_cents: 500, filling_content_code: "PU_FOAM_62" }, as: PlantManager }
            - { call: "POST /plant/models/${m_id}/submit-for-certification", payload: {}, as: PlantManager }
            - { call: "POST /plant/models/${m_id}/certificates", payload: { cert_type: "FLAMMABILITY_16CFR1633", jurisdiction_state_code: "US", issued_on: "2026-01-01T00:00:00Z", expires_on: "2030-01-01T00:00:00Z" }, as: ComplianceOfficer, as_user_id: co-1, captures: { c_id: $.data.id } }
            - { call: "POST /plant/models/${m_id}/certificates/${c_id}/approve", payload: {}, as: ComplianceOfficer, as_user_id: co-2 }
            - { call: "POST /plant/models/${m_id}/certify", payload: {}, as: ComplianceOfficer, as_user_id: co-1 }
            - { call: "POST /plant/models/${m_id}/activate", payload: {}, as: PlantManager, captures: { m_v: $.data.version } }
            - { call: "POST /plant/law-label-specs", payload: { state_code: "CA", filling_content_codes: ["PU_FOAM_62"], required_phrases: ["UNDER PENALTY OF LAW THIS TAG NOT TO BE REMOVED"], prop65_warning_required: true }, as: ComplianceOfficer, as_user_id: co-1, captures: { sp_id: $.data.id } }
            - { call: "POST /plant/law-label-specs/${sp_id}/publish", payload: {}, as: ComplianceOfficer, as_user_id: co-1 }
            - { call: "POST /plant/models/${m_id}/law-labels", payload: { state_code: "CA", expected_model_version: "${m_v}" }, as: ComplianceOfficer, as_user_id: co-1, captures: { lb_id: $.data.id } }
            - { call: "POST /plant/models/${m_id}/law-labels/${lb_id}/approve", payload: {}, as: ComplianceOfficer, as_user_id: co-2 }
            - { call: "POST /plant/models/${m_id}/law-labels/${lb_id}/activate", payload: {}, as: ComplianceOfficer, as_user_id: co-2 }
            - { call: "POST /plant/foam-batches", payload: { foam_density_class: "STANDARD", poured_mass_kg: 1000, chamber_id: "CH-1" }, as: LineSupervisor, as_user_id: ls-1, captures: { b_id: $.data.id } }
            - { call: "POST /plant/foam-batches/${b_id}/start-cure", payload: { ambient_temp_c: 20 }, as: LineSupervisor, as_user_id: ls-1 }
            - { call: "POST /plant/_clock/set_current_utc", payload: { to_iso8601: "2026-08-02T00:00:00Z" }, as: PlantManager }
            - { call: "POST /plant/foam-batches/${b_id}/certify-cured", payload: {}, as: QcInspector, as_user_id: qc-1 }
            - { call: "POST /plant/production-orders", payload: { model_id: "${m_id}", retailer_id: "${r_id}", destination_state_code: "CA", quantity: 2, unit_price_cents: 200000, foam_mass_required_kg: 20, ship_method: "WAREHOUSE" }, as: PlantManager, captures: { o_id: $.data.id } }
            - { call: "POST /plant/production-orders/${o_id}/allocate-materials", payload: { foam_batch_id: "${b_id}" }, as: LineSupervisor, as_user_id: ls-1 }
            - { call: "POST /plant/production-orders/${o_id}/start-production", payload: {}, as: LineSupervisor, as_user_id: ls-1 }
            - { call: "POST /plant/production-orders/${o_id}/complete-production", payload: {}, as: LineSupervisor, as_user_id: ls-1 }
            - { call: "POST /plant/production-orders/${o_id}/qc-pass", payload: {}, as: QcInspector, as_user_id: qc-1 }
            - { call: "GET /plant/units", payload: {}, as: PlantManager, captures: { u1: "$.data[0].id", u2: "$.data[1].id" } }
            - { call: "POST /plant/shipments", payload: { order_id: "${o_id}", unit_ids: ["${u1}", "${u2}"] }, as: LogisticsCoordinator, as_user_id: log-1, captures: { s_id: $.data.id } }
            - { call: "POST /plant/shipments/${s_id}/dispatch", payload: {}, as: LogisticsCoordinator, as_user_id: log-1 }
            - { call: "POST /plant/shipments/${s_id}/deliver", payload: {}, as: LogisticsCoordinator, as_user_id: log-1 }
            - { call: "POST /plant/warranty-claims", payload: { unit_id: "${u1}", retailer_id: "${r_id}", claim_type: "SAG_DEFECT", measured_sag_inches: 2.0 }, as: Retailer, as_user_id: "${r_id}", captures: { cl1: $.data.id } }
            - { call: "POST /plant/warranty-claims", payload: { unit_id: "${u2}", retailer_id: "${r_id}", claim_type: "SAG_DEFECT", measured_sag_inches: 2.0 }, as: Retailer, as_user_id: "${r_id}", captures: { cl2: $.data.id } }
            - { call: "POST /plant/_clock/set_current_utc", payload: { to_iso8601: "2027-07-28T00:00:00Z" }, as: PlantManager }
          trigger:
            - { call: "POST /plant/warranty-claims/${cl1}/approve", payload: {}, as: PlantManager }
            - { call: "POST /plant/_clock/set_current_utc", payload: { to_iso8601: "2027-08-27T00:00:00Z" }, as: PlantManager }
            - { call: "POST /plant/warranty-claims/${cl2}/approve", payload: {}, as: PlantManager }
          assert:
            - "WarrantyClaim.${cl1}.age_months == 12"
            - "WarrantyClaim.${cl1}.credit_variant == FULL_REPLACEMENT"
            - "WarrantyClaim.${cl1}.credit_cents == 200000"
            - "WarrantyClaim.${cl2}.age_months == 13"
            - "WarrantyClaim.${cl2}.credit_variant == PRORATED"
            - "WarrantyClaim.${cl2}.credit_cents == 178333"

      - name: recycling_provisional_vs_final_divergence
        grounds:
          - calculations.recycling_credit
          - entities.RecyclingIntake.fields.provisional_credit_cents
          - entities.RecyclingIntake.fields.final_credit_cents
        distinguishing_aspect: |
          On the RecyclingIntake entity (different entity domain than the warranty
          instance), the PROVISIONAL variant (flat 20 c/kg on declared weight) credits
          2000 for a 100 kg manifest while the FINAL variant (per-material rates on
          weighed actuals) credits 2550 for the same intake; the +550 divergence is
          reconciled through a signed delta CreditAdjustment.
        test_recipe:
          setup:
            - "Retailer with recycling_enrolled true, credit_limit 100000000, balance 0"
          setup_api_calls:
            - { call: "POST /plant/retailers", payload: { retailer_name: "SleepCo", drop_ship_enabled: true, recycling_enrolled: true, credit_limit_cents: 100000000 }, as: PlantManager, captures: { r_id: $.data.id } }
          trigger:
            - { call: "POST /plant/recycling-intakes", payload: { retailer_id: "${r_id}", declared_weight_kg: 100 }, as: LogisticsCoordinator, as_user_id: log-1, captures: { in_id: $.data.id } }
            - { call: "POST /plant/recycling-intakes/${in_id}/finalize", payload: { actual_steel_kg: 40, actual_foam_kg: 30, actual_fiber_kg: 20, actual_wood_kg: 10 }, as: PlantManager }
            - { call: "GET /plant/retailers/${r_id}", payload: {}, as: PlantManager, captures: { r_bal: $.data.credit_balance_cents } }
            - { call: "GET /plant/retailers/${r_id}/credit-adjustments", payload: {}, as: PlantManager, captures: { adj0_amt: "$.data[0].amount_cents", adj0_src: "$.data[0].source", adj1_amt: "$.data[1].amount_cents", adj1_src: "$.data[1].source" } }
          assert:
            - "RecyclingIntake.${in_id}.provisional_credit_cents == 2000"
            - "RecyclingIntake.${in_id}.final_credit_cents == 2550"
            - "RecyclingIntake.${in_id}.status == FINALIZED"
            - "${r_bal} == 2550"
            - "${adj0_amt} == 2000 and ${adj0_src} == RECYCLING_PROVISIONAL"
            - "${adj1_amt} == 550 and ${adj1_src} == RECYCLING_FINAL_DELTA"

  # ===========================================================================
  # Rule 2 — combinatorial_formula (modes a, b, c — three different modes)
  # ===========================================================================
  - rule_id: combinatorial_formula
    instances:
      - name: warranty_prorated_nested_floor_binding
        grounds:
          - calculations.warranty_credit_amount
          - entities.WarrantyClaim.fields.age_months
        distinguishing_aspect: |
          Mode (a) — >= 3 inputs with non-linear interaction: the PRORATED formula
          max(floor, min(price, linear)) with inputs price, age_months, TERM_MONTHS and
          the SAG gate: at price 200000 and age 114 the linear term (10000) falls below
          the 10% floor (20000), so the nested max() binds and credit is 20000, not 10000.
        test_recipe:
          setup:
            - "Delivered unit u1 (purchase_price_cents 200000) delivered at 2026-08-02T00:00:00Z; claim filed; clock advanced to 2035-12-13T00:00:00Z (age 114 months)"
          setup_api_calls:
            - { call: "POST /plant/retailers", payload: { retailer_name: "SleepCo", drop_ship_enabled: true, recycling_enrolled: true, credit_limit_cents: 100000000 }, as: PlantManager, captures: { r_id: $.data.id } }
            - { call: "POST /plant/models", payload: { model_code: "SRT-CF1", quilt_pattern: "DIAMOND" }, as: PlantManager, captures: { m_id: $.data.id } }
            - { call: "POST /plant/models/${m_id}/bom-lines", payload: { component_type: "FOAM_CORE", material_code: "MAT-F1", quantity_per_unit: 2.0, unit_cost_cents: 500, filling_content_code: "PU_FOAM_62" }, as: PlantManager }
            - { call: "POST /plant/models/${m_id}/submit-for-certification", payload: {}, as: PlantManager }
            - { call: "POST /plant/models/${m_id}/certificates", payload: { cert_type: "FLAMMABILITY_16CFR1633", jurisdiction_state_code: "US", issued_on: "2026-01-01T00:00:00Z", expires_on: "2040-01-01T00:00:00Z" }, as: ComplianceOfficer, as_user_id: co-1, captures: { c_id: $.data.id } }
            - { call: "POST /plant/models/${m_id}/certificates/${c_id}/approve", payload: {}, as: ComplianceOfficer, as_user_id: co-2 }
            - { call: "POST /plant/models/${m_id}/certify", payload: {}, as: ComplianceOfficer, as_user_id: co-1 }
            - { call: "POST /plant/models/${m_id}/activate", payload: {}, as: PlantManager, captures: { m_v: $.data.version } }
            - { call: "POST /plant/law-label-specs", payload: { state_code: "CA", filling_content_codes: ["PU_FOAM_62"], required_phrases: ["UNDER PENALTY OF LAW THIS TAG NOT TO BE REMOVED"], prop65_warning_required: false }, as: ComplianceOfficer, as_user_id: co-1, captures: { sp_id: $.data.id } }
            - { call: "POST /plant/law-label-specs/${sp_id}/publish", payload: {}, as: ComplianceOfficer, as_user_id: co-1 }
            - { call: "POST /plant/models/${m_id}/law-labels", payload: { state_code: "CA", expected_model_version: "${m_v}" }, as: ComplianceOfficer, as_user_id: co-1, captures: { lb_id: $.data.id } }
            - { call: "POST /plant/models/${m_id}/law-labels/${lb_id}/approve", payload: {}, as: ComplianceOfficer, as_user_id: co-2 }
            - { call: "POST /plant/models/${m_id}/law-labels/${lb_id}/activate", payload: {}, as: ComplianceOfficer, as_user_id: co-2 }
            - { call: "POST /plant/foam-batches", payload: { foam_density_class: "STANDARD", poured_mass_kg: 1000, chamber_id: "CH-1" }, as: LineSupervisor, as_user_id: ls-1, captures: { b_id: $.data.id } }
            - { call: "POST /plant/foam-batches/${b_id}/start-cure", payload: { ambient_temp_c: 20 }, as: LineSupervisor, as_user_id: ls-1 }
            - { call: "POST /plant/_clock/set_current_utc", payload: { to_iso8601: "2026-08-02T00:00:00Z" }, as: PlantManager }
            - { call: "POST /plant/foam-batches/${b_id}/certify-cured", payload: {}, as: QcInspector, as_user_id: qc-1 }
            - { call: "POST /plant/production-orders", payload: { model_id: "${m_id}", retailer_id: "${r_id}", destination_state_code: "CA", quantity: 1, unit_price_cents: 200000, foam_mass_required_kg: 10, ship_method: "WAREHOUSE" }, as: PlantManager, captures: { o_id: $.data.id } }
            - { call: "POST /plant/production-orders/${o_id}/allocate-materials", payload: { foam_batch_id: "${b_id}" }, as: LineSupervisor, as_user_id: ls-1 }
            - { call: "POST /plant/production-orders/${o_id}/start-production", payload: {}, as: LineSupervisor, as_user_id: ls-1 }
            - { call: "POST /plant/production-orders/${o_id}/complete-production", payload: {}, as: LineSupervisor, as_user_id: ls-1 }
            - { call: "POST /plant/production-orders/${o_id}/qc-pass", payload: {}, as: QcInspector, as_user_id: qc-1 }
            - { call: "GET /plant/units", payload: {}, as: PlantManager, captures: { u1: "$.data[0].id" } }
            - { call: "POST /plant/shipments", payload: { order_id: "${o_id}", unit_ids: ["${u1}"] }, as: LogisticsCoordinator, as_user_id: log-1, captures: { s_id: $.data.id } }
            - { call: "POST /plant/shipments/${s_id}/dispatch", payload: {}, as: LogisticsCoordinator, as_user_id: log-1 }
            - { call: "POST /plant/shipments/${s_id}/deliver", payload: {}, as: LogisticsCoordinator, as_user_id: log-1 }
            - { call: "POST /plant/warranty-claims", payload: { unit_id: "${u1}", retailer_id: "${r_id}", claim_type: "SAG_DEFECT", measured_sag_inches: 2.0 }, as: Retailer, as_user_id: "${r_id}", captures: { cl1: $.data.id } }
            - { call: "POST /plant/_clock/set_current_utc", payload: { to_iso8601: "2035-12-13T00:00:00Z" }, as: PlantManager }
          trigger:
            - { call: "POST /plant/warranty-claims/${cl1}/approve", payload: {}, as: PlantManager }
          assert:
            - "WarrantyClaim.${cl1}.age_months == 114"
            - "WarrantyClaim.${cl1}.credit_variant == PRORATED"
            - "WarrantyClaim.${cl1}.credit_cents == 20000"

      - name: bom_per_line_rounding_then_sum
        grounds:
          - calculations.bom_material_cost
          - entities.BomLine.fields.line_cost_cents
          - entities.MattressModel.fields.bom_cost_cents
        distinguishing_aspect: |
          Mode (b) — nested rounding order is pinned: per-line round_half_up THEN sum.
          Lines (1.5 x 333 -> 500) and (0.5 x 199 -> 100) and (3 x 100 -> 300) yield
          bom_cost_cents 900; the alternative sum-then-round order yields 899, so the
          two orders observably differ by one cent.
        test_recipe:
          setup:
            - "Model in DRAFT with three BomLines carrying half-cent products"
          setup_api_calls:
            - { call: "POST /plant/models", payload: { model_code: "SRT-RND", quilt_pattern: "DIAMOND" }, as: PlantManager, captures: { m_id: $.data.id } }
            - { call: "POST /plant/models/${m_id}/bom-lines", payload: { component_type: "QUILT_PANEL", material_code: "MAT-Q1", quantity_per_unit: 1.5, unit_cost_cents: 333 }, as: PlantManager, captures: { ln1: $.data.id, ln1_cost: $.data.line_cost_cents } }
            - { call: "POST /plant/models/${m_id}/bom-lines", payload: { component_type: "FOUNDATION", material_code: "MAT-FD", quantity_per_unit: 0.5, unit_cost_cents: 199 }, as: PlantManager, captures: { ln2: $.data.id, ln2_cost: $.data.line_cost_cents } }
            - { call: "POST /plant/models/${m_id}/bom-lines", payload: { component_type: "THREAD", material_code: "MAT-TH", quantity_per_unit: 3, unit_cost_cents: 100 }, as: PlantManager }
          trigger:
            - { call: "GET /plant/models/${m_id}", payload: {}, as: PlantManager, captures: { m_cost: $.data.bom_cost_cents } }
          assert:
            - "${ln1_cost} == 500"
            - "${ln2_cost} == 100"
            - "${m_cost} == 900"

      - name: order_fee_tier_keyed_on_subtotal_not_total
        grounds:
          - calculations.order_compliance_fee
          - entities.ProductionOrder.fields.compliance_fee_cents
          - entities.ProductionOrder.fields.total_cents
        distinguishing_aspect: |
          Mode (c) — circular-looking dependency with pinned evaluation order: the fee
          tier is keyed on subtotal BEFORE the fee enters the total. Order A subtotal
          99990 pays fee 500 although its total 100490 crosses the 100000 tier; order B
          subtotal exactly 100000 (boundary, inclusive) pays tier-2 fee 1500.
        test_recipe:
          setup:
            - "ACTIVE model; retailer; two orders straddling the 100000 subtotal boundary"
          setup_api_calls:
            - { call: "POST /plant/retailers", payload: { retailer_name: "SleepCo", drop_ship_enabled: true, recycling_enrolled: true, credit_limit_cents: 100000000 }, as: PlantManager, captures: { r_id: $.data.id } }
            - { call: "POST /plant/models", payload: { model_code: "SRT-FEE", quilt_pattern: "DIAMOND" }, as: PlantManager, captures: { m_id: $.data.id } }
            - { call: "POST /plant/models/${m_id}/bom-lines", payload: { component_type: "THREAD", material_code: "MAT-TH", quantity_per_unit: 1, unit_cost_cents: 10 }, as: PlantManager }
            - { call: "POST /plant/models/${m_id}/submit-for-certification", payload: {}, as: PlantManager }
            - { call: "POST /plant/models/${m_id}/certificates", payload: { cert_type: "FLAMMABILITY_16CFR1633", jurisdiction_state_code: "US", issued_on: "2026-01-01T00:00:00Z", expires_on: "2030-01-01T00:00:00Z" }, as: ComplianceOfficer, as_user_id: co-1, captures: { c_id: $.data.id } }
            - { call: "POST /plant/models/${m_id}/certificates/${c_id}/approve", payload: {}, as: ComplianceOfficer, as_user_id: co-2 }
            - { call: "POST /plant/models/${m_id}/certify", payload: {}, as: ComplianceOfficer, as_user_id: co-1 }
            - { call: "POST /plant/models/${m_id}/activate", payload: {}, as: PlantManager }
          trigger:
            - { call: "POST /plant/production-orders", payload: { model_id: "${m_id}", retailer_id: "${r_id}", destination_state_code: "NV", quantity: 10, unit_price_cents: 9999, foam_mass_required_kg: 10, ship_method: "WAREHOUSE" }, as: PlantManager, captures: { oa_sub: $.data.subtotal_cents, oa_fee: $.data.compliance_fee_cents, oa_tot: $.data.total_cents } }
            - { call: "POST /plant/production-orders", payload: { model_id: "${m_id}", retailer_id: "${r_id}", destination_state_code: "NV", quantity: 10, unit_price_cents: 10000, foam_mass_required_kg: 10, ship_method: "WAREHOUSE" }, as: PlantManager, captures: { ob_sub: $.data.subtotal_cents, ob_fee: $.data.compliance_fee_cents, ob_tot: $.data.total_cents } }
          assert:
            - "${oa_sub} == 99990"
            - "${oa_fee} == 500"
            - "${oa_tot} == 100490"
            - "${ob_sub} == 100000"
            - "${ob_fee} == 1500"
            - "${ob_tot} == 101500"

  # ===========================================================================
  # Rule 3 — non_linear_state_machine (cycle on FoamBatch; parallel dims on ProductionOrder)
  # ===========================================================================
  - rule_id: non_linear_state_machine
    instances:
      - name: foam_batch_recure_cycle
        grounds:
          - state_machines.FoamBatch.CURING_to_QUARANTINED
          - state_machines.FoamBatch.QUARANTINED_to_CURING
          - calculations.cure_eligibility_time
        distinguishing_aspect: |
          Cyclic shape on FoamBatch: CURING → QUARANTINED → CURING re-cure loop.
          The re-entry extends cure_eligible_at by exactly 12 penalty hours (24h base
          at NORMAL temp becomes 36h), so certifying at +30h fails and at +36h succeeds,
          and cure_cycles records 2 entries into CURING.
        test_recipe:
          setup:
            - "STANDARD batch poured at default clock 2026-08-01T00:00:00Z, curing started at 20C (NORMAL tier, +0h)"
          setup_api_calls:
            - { call: "POST /plant/foam-batches", payload: { foam_density_class: "STANDARD", poured_mass_kg: 500, chamber_id: "CH-CYC" }, as: LineSupervisor, as_user_id: ls-1, captures: { b_id: $.data.id } }
            - { call: "POST /plant/foam-batches/${b_id}/start-cure", payload: { ambient_temp_c: 20 }, as: LineSupervisor, as_user_id: ls-1, captures: { elig0: $.data.cure_eligible_at } }
            - { call: "POST /plant/foam-batches/${b_id}/quarantine", payload: {}, as: QcInspector, as_user_id: qc-1 }
          trigger:
            - { call: "POST /plant/foam-batches/${b_id}/release-to-cure", payload: {}, as: LineSupervisor, as_user_id: ls-1, captures: { cycles: $.data.cure_cycles, elig1: $.data.cure_eligible_at, st1: $.data.status } }
            - { call: "POST /plant/_clock/set_current_utc", payload: { to_iso8601: "2026-08-02T06:00:00Z" }, as: PlantManager }
            - { call: "POST /plant/foam-batches/${b_id}/certify-cured", payload: {}, as: QcInspector, as_user_id: qc-1, captures: { err_early: $.data.error_id } }
            - { call: "POST /plant/_clock/set_current_utc", payload: { to_iso8601: "2026-08-02T12:00:00Z" }, as: PlantManager }
            - { call: "POST /plant/foam-batches/${b_id}/certify-cured", payload: {}, as: QcInspector, as_user_id: qc-1, captures: { st2: $.data.status } }
          assert:
            - "${elig0} == 2026-08-02T00:00:00Z"
            - "${st1} == CURING"
            - "${cycles} == 2"
            - "${elig1} == 2026-08-02T12:00:00Z"
            - "${err_early} == ERR_CURE_INCOMPLETE"
            - "${st2} == CURED"

      - name: production_order_parallel_fulfillment_dimension
        grounds:
          - state_machines.ProductionOrder
          - state_machines.ProductionOrderFulfillment
          - calculations.fulfillment_recompute
          - entities.ProductionOrder.fields.fulfillment_status
        distinguishing_aspect: |
          Parallel state dimensions on ProductionOrder: production_status advances
          PLANNED→…→COMPLETE while fulfillment_status independently walks
          UNFULFILLED→PARTIALLY_SHIPPED→FULLY_SHIPPED→DELIVERED as partial shipments
          dispatch/deliver; the pair (COMPLETE, PARTIALLY_SHIPPED) is reachable and
          both axes are observable on the same row.
        test_recipe:
          setup:
            - "COMPLETE order (quantity 2) with units u1,u2 MANUFACTURED; ACTIVE label for CA"
          setup_api_calls:
