              captures: { oid: $.data.id }
          trigger:
            - call: "POST /nursery/orders/${oid}/lines"
              payload: { availability_entry_id: "${eid}", quantity: 10 }
              as: Broker
              as_user_id: "${brB}"
              captures: { err: $.data.error_id }
          assert:
            - "HTTP 403; data.error_id == ERR_FORBIDDEN (B is not the owner of A's order)"

      - name: missing_auth_headers_unauthenticated
        claim_type: authentication
        grounds: ["validations[priority=1]", "errors[ERR_UNAUTHENTICATED]"]
        distinguishing_aspect: "A request with an unknown/missing X-User-Role -> 401 ERR_UNAUTHENTICATED."
        test_recipe:
          setup: ["Empty DB."]
          setup_api_calls: []
          trigger:
            - call: "GET /nursery/varieties"
              payload: {}
              as: NoSuchRole
              captures: { err: $.data.error_id }
          assert:
            - "HTTP 401; data.error_id == ERR_UNAUTHENTICATED"

  # ===========================================================================
  - section: cross_cutting_complexity_layers
    instances:
      - name: occ_transplant_stale_zone_version_excluded
        claim_type: optimistic_concurrency
        grounds: ["concurrency_rules[transplant-stale-zone]", "errors[ERR_STALE_VERSION]"]
        distinguishing_aspect: "A transplant carrying a stale expected_zone_version (zone version advanced by a prior transplant/cull) -> 412 ERR_STALE_VERSION."
        test_recipe:
          setup: ["One zone cap 1000, two PLANNED batches b1,b2. b1 transplanted advances zone.version. b2 transplant then sent with the pre-advance zone version."]
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-02-01T00:00:00Z" }
              as: GrowerManager
            - call: "POST /nursery/varieties"
              payload: { common_name: "Oc", cultivar_code: "OCR1", propagation_form: "PLUG", grow_cycle_days: 5, container_footprint_units: 1, ship_ready_grade_min_height_cm: 8, ship_ready_min_live_pct: 0.5 }
              as: GrowerManager
              captures: { vid: $.data.id }
            - call: "POST /nursery/varieties/${vid}/activate"
              payload: {}
              as: GrowerManager
            - call: "POST /nursery/zones"
              payload: { name: "Z", climate_class: "MIXED", capacity_units: 1000 }
              as: GrowerManager
              captures: { zid: $.data.id }
            - call: "POST /nursery/batches"
              payload: { variety_id: "${vid}", zone_id: "${zid}", source_supplier: "S", sourced_count: 100 }
              as: ProductionTech
              captures: { b1: $.data.id }
            - call: "POST /nursery/batches"
              payload: { variety_id: "${vid}", zone_id: "${zid}", source_supplier: "S", sourced_count: 100 }
              as: ProductionTech
              captures: { b2: $.data.id }
            - call: "GET /nursery/zones/${zid}"
              payload: {}
              as: ProductionTech
              captures: { zv_pre: $.data.version }
            - call: "POST /nursery/batches/${b1}/transplant"
              payload: { started_count: 100, expected_zone_version: "${zv_pre}" }
              as: ProductionTech
          trigger:
            - call: "POST /nursery/batches/${b2}/transplant"
              payload: { started_count: 100, expected_zone_version: "${zv_pre}" }
              as: ProductionTech
              captures: { err: $.data.error_id }
          assert:
            - "HTTP 412; data.error_id == ERR_STALE_VERSION (zone.version advanced from ${zv_pre} by b1 transplant)"

      - name: occ_confirm_correct_version_succeeds_and_increments
        claim_type: optimistic_concurrency
        grounds: ["concurrency_rules[confirm-stale-order]", entities.BrokerOrder.fields.version]
        distinguishing_aspect: "Confirm with the CURRENT order version succeeds and increments order.version; a subsequent confirm with the old version would be stale (412)."
        test_recipe:
          setup: ["DRAFT order with one line; correct order version captured."]
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-02-01T00:00:00Z" }
              as: GrowerManager
            - call: "POST /nursery/varieties"
              payload: { common_name: "Cv", cultivar_code: "CVR1", propagation_form: "LINER", grow_cycle_days: 5, container_footprint_units: 1, ship_ready_grade_min_height_cm: 8, ship_ready_min_live_pct: 0.5, requires_phyto: false }
              as: GrowerManager
              captures: { vid: $.data.id }
            - call: "POST /nursery/varieties/${vid}/activate"
              payload: {}
              as: GrowerManager
            - call: "POST /nursery/zones"
              payload: { name: "Z", climate_class: "MIXED", capacity_units: 500 }
              as: GrowerManager
              captures: { zid: $.data.id }
            - call: "POST /nursery/batches"
              payload: { variety_id: "${vid}", zone_id: "${zid}", source_supplier: "S", sourced_count: 100 }
              as: ProductionTech
              captures: { bid: $.data.id }
            - call: "GET /nursery/zones/${zid}"
              payload: {}
              as: ProductionTech
              captures: { zv: $.data.version }
            - call: "POST /nursery/batches/${bid}/transplant"
              payload: { started_count: 100, expected_zone_version: "${zv}" }
              as: ProductionTech
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-02-07T00:00:00Z" }
              as: GrowerManager
            - call: "POST /nursery/batches/${bid}/input-logs"
              payload: { event_type: "GRADE", mean_height_cm: 10 }
              as: ProductionTech
            - call: "POST /nursery/batches/${bid}/start-grading"
              payload: {}
              as: ProductionTech
            - call: "POST /nursery/batches/${bid}/finalize-grade"
              payload: {}
              as: ProductionTech
            - call: "POST /nursery/availability"
              payload: { batch_id: "${bid}", unit_price_cents: 300 }
              as: SalesCoordinator
              captures: { eid: $.data.id }
            - call: "POST /nursery/brokers"
              payload: { company_name: "OR", contact_email: "o@x.com", ship_to_state: "OR", credit_limit_cents: 5000000 }
              as: SalesCoordinator
              captures: { brid: $.data.id }
            - call: "POST /nursery/orders"
              payload: { broker_id: "${brid}", requested_ship_date: "2026-03-01T00:00:00Z" }
              as: SalesCoordinator
              captures: { oid: $.data.id }
            - call: "POST /nursery/orders/${oid}/lines"
              payload: { availability_entry_id: "${eid}", quantity: 50 }
              as: SalesCoordinator
            - call: "GET /nursery/orders/${oid}"
              payload: {}
              as: SalesCoordinator
              captures: { ov: $.data.version }
          trigger:
            - call: "POST /nursery/orders/${oid}/confirm"
              payload: { expected_order_version: "${ov}" }
              as: SalesCoordinator
              captures: { st: $.data.status, nv: $.data.version }
          assert:
            - "Confirm succeeds: BrokerOrder.${oid}.status == CONFIRMED and version == ${ov} + 1"

      - name: occ_transplant_stale_zone_difficulty_excluded
        claim_type: optimistic_concurrency
        grounds: ["concurrency_rules[transplant-stale-zone]"]
        excluded_because:
          difficulty_instance: zone_aggregate_footprint_overlap_rejects_overfill
          rationale: "Zone version advance behavior on transplant is exercised across the §1.8 transplant chains; the dedicated stale-zone OCC test above plus those chains cover the rule."
        # NO test_recipe.

  # ===========================================================================
  - section: consistency_model
    instances:
      - name: confirm_side_effects_visible_immediately
        claim_type: immediate
        grounds: [state_machines.BrokerOrder.DRAFT_to_CONFIRMED, entities.AvailabilityEntry.fields.committed_quantity]
        excluded_because:
          difficulty_instance: confirm_cancel_conserves_open_balance_and_committed_quantity
          rationale: "Immediate visibility of confirm-time committed_quantity/open_balance updates is asserted (and reverted) in the named §1.8 compensating_invariant instance."
        # NO test_recipe.
