        distinguishing_aspect: "X-User-Role sent as an empty string (present but blank, not omitted and not whitespace) returns HTTP 401 ERR_UNAUTHENTICATED — it must not be treated as a missing header default or as an unknown role 403."
        test_recipe:
          setup:
            - "One property so the target path resolves"
          setup_api_calls:
            - call: "POST /valet/properties"
              payload: { name: "Cedar Ridge", unit_count: 4, market_code: "ATL" }
              as: PlatformAdmin
              captures: { prop_id: $.data.id }
