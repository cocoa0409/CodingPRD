scaffold_difficulty_design:
  - rule_id: dual_variant_calc
    instances:
      - name: annualized_income_terminated_blended_vs_standing_rate
        grounds:
          - calculations.annualized_income
          - calculations.annualized_income.variants.variant_blended_final_period
          - entities.EmploymentRecord.fields.annualized_income_cents
        distinguishing_aspect: |
          On the EmploymentRecord domain the standing-rate reading and the blended
          final-period reading both apply to the same TERMINATED record with a
          non-zero final_pay_period_income_cents, and they produce different cent
          values; the base variant is pinned for every other employment_status.
        test_recipe:
          setup:
            - "MONTHLY employer Northwind Logistics with a VERIFIED layout and one VALIDATED batch"
            - "worker Dana Reyes holds one TERMINATED record with pay_rate_cents 520000, pay_rate_basis MONTHLY, separation_date 2026-05-15 and final_pay_period_income_cents 180000"
            - "logical clock pinned at 2026-06-01T00:00:00Z"
          setup_api_calls:
            - call: "POST /work-number/employers"
              payload: { legal_name: "Northwind Logistics", fein: "123456789", employer_type: "PRIVATE", payroll_frequency: "MONTHLY" }
              as: PlatformAdmin
              captures: { emp_id: $.data.id, emp_v: $.data.version }
            - call: "POST /work-number/covered-workers"
              payload: { full_name: "Dana Reyes", ssn_last4: "4417", date_of_birth: "1988-03-14" }
              as: PlatformAdmin
              captures: { wk_id: $.data.id }
            - call: "POST /work-number/record-layouts"
              payload: { employer_id: "${emp_id}", layout_version: 1, column_map: { W_LAST4: "worker_ssn_last4", W_DOB: "worker_date_of_birth", HIRE: "hire_date", STATUS: "employment_status", RATE: "pay_rate", BASIS: "pay_rate_basis" }, fiscal_year_start_month: 1 }
              as: Employer
              as_user_id: "${emp_id}"
              captures: { lay_id: $.data.id }
            - call: "POST /work-number/record-layouts/${lay_id}/verify"
              payload: {}
              as: Employer
              as_user_id: "${emp_id}"
            - call: "POST /work-number/payroll-feed-batches"
              payload: { employer_id: "${emp_id}", record_layout_id: "${lay_id}", batch_sequence: 1, pay_period_end_date: "2026-05-31T00:00:00Z", record_count: 900 }
              as: Employer
              as_user_id: "${emp_id}"
              captures: { bat_id: $.data.id }
            - call: "POST /work-number/employment-records"
              payload: { employer_id: "${emp_id}", covered_worker_id: "${wk_id}", payroll_feed_batch_id: "${bat_id}", employment_status: "TERMINATED", hire_date: "2023-01-15T00:00:00Z", separation_date: "2026-05-15T00:00:00Z", pay_rate_cents: 520000, pay_rate_basis: "MONTHLY", standard_hours_per_week: 40, final_pay_period_income_cents: 180000 }
              as: Employer
              as_user_id: "${emp_id}"
              captures: { rec_id: $.data.id }
            - call: "POST /work-number/payroll-feed-batches/${bat_id}/validate"
              payload: {}
              as: Employer
              as_user_id: "${emp_id}"
          trigger:
            - call: "GET /work-number/employment-records/${rec_id}"
              payload: {}
              as: PlatformAdmin
          assert:
            - "EmploymentRecord.${rec_id}.annualized_income_cents == 5900000 under the blended reading and 6240000 under the standing-rate reading; the scaffold pins the blended variant for TERMINATED records with final_pay_period_income_cents > 0, so the stored value is 5900000"
            - "EmploymentRecord.${rec_id}.record_state == VERIFIED"
      - name: contributor_rate_marginal_vs_blended_average_on_straddling_batch
        grounds:
          - calculations.contributor_rate_tier
          - calculations.contributor_rate_tier.variants.variant_blended_average_rate
          - entities.CompensationAccrual.fields.gross_accrued_cents
        distinguishing_aspect: |
          On the CompensationAccrual domain the marginal tier reading and the
          blended-average reading both apply to a batch whose record count straddles
          the CONTRIBUTOR_TIER2_MIN boundary, and they produce different cent totals;
          the marginal reading is pinned unless the settlement requests the blended basis.
        test_recipe:
          setup:
            - "MONTHLY employer with a VERIFIED layout and 1200 declared records, which straddles CONTRIBUTOR_TIER2_MIN 1000"
            - "no settlement has been posted, so Employer.compensation_earned_cents is 0"
          setup_api_calls:
            - call: "POST /work-number/employers"
              payload: { legal_name: "Northwind Logistics", fein: "123456789", employer_type: "PRIVATE", payroll_frequency: "MONTHLY" }
              as: PlatformAdmin
              captures: { emp_id: $.data.id }
            - call: "POST /work-number/record-layouts"
              payload: { employer_id: "${emp_id}", layout_version: 1, column_map: { W_LAST4: "worker_ssn_last4", W_DOB: "worker_date_of_birth", HIRE: "hire_date", STATUS: "employment_status", RATE: "pay_rate", BASIS: "pay_rate_basis" }, fiscal_year_start_month: 1 }
              as: Employer
              as_user_id: "${emp_id}"
              captures: { lay_id: $.data.id }
            - call: "POST /work-number/record-layouts/${lay_id}/verify"
              payload: {}
              as: Employer
              as_user_id: "${emp_id}"
            - call: "POST /work-number/payroll-feed-batches"
              payload: { employer_id: "${emp_id}", record_layout_id: "${lay_id}", batch_sequence: 1, pay_period_end_date: "2026-05-31T00:00:00Z", record_count: 1200 }
              as: Employer
              as_user_id: "${emp_id}"
              captures: { bat_id: $.data.id }
            - call: "POST /work-number/payroll-feed-batches/${bat_id}/validate"
              payload: {}
              as: Employer
              as_user_id: "${emp_id}"
          trigger:
            - call: "GET /work-number/contributor-compensations"
              payload: { employer_id: "${emp_id}" }
              as: PlatformAdmin
              captures: { acc0_id: "$.data[0].id" }
          assert:
            - "the accrual appended for the straddling batch carries unit_rate_cents == 10 and gross_accrued_cents == 12000 under the marginal reading, which is the pinned base variant"
            - "under variant_blended_average_rate the same 1200 records would post round_half_up(1200*10 / 1200) * 1200 == 12000, so the two readings diverge only when the count straddles CONTRIBUTOR_TIER2_MIN"
            - "Employer.${emp_id}.compensation_earned_cents == 0 because no settlement has posted"
  - rule_id: combinatorial_formula
    instances:
      - name: annualized_income_nested_rounding_per_record_before_batch_sum
        grounds:
          - calculations.annualized_income
          - entities.PayrollFeedBatch.fields.gross_amount_cents
          - validations[priority=19]
        distinguishing_aspect: |
          Mode (b) nested rounding: the scaffold pins round-per-record-then-sum, and
          a batch whose hourly records carry fractional cents yields a different
          gross_amount_cents than sum-then-round, so the two orders are separable.
        test_recipe:
          setup:
            - "WEEKLY employer with a VERIFIED layout and one VALIDATED batch of two HOURLY records with fractional intended weekly hours"
            - "record A: pay_rate_cents 2531, pay_rate_basis HOURLY, standard_hours_per_week 37.1"
            - "record B: pay_rate_cents 2749, pay_rate_basis HOURLY, standard_hours_per_week 32.3"
          setup_api_calls:
            - call: "POST /work-number/employers"
              payload: { legal_name: "Cedar Grove Staffing", fein: "223456789", employer_type: "STAFFING_AGENCY", payroll_frequency: "WEEKLY" }
              as: PlatformAdmin
              captures: { emp_id: $.data.id }
            - call: "POST /work-number/covered-workers"
              payload: { full_name: "Rosa Aguilar", ssn_last4: "9911", date_of_birth: "1979-11-02" }
              as: PlatformAdmin
              captures: { wk_a: $.data.id }
            - call: "POST /work-number/covered-workers"
              payload: { full_name: "Ivan Petrov", ssn_last4: "2288", date_of_birth: "1990-07-21" }
              as: PlatformAdmin
              captures: { wk_b: $.data.id }
            - call: "POST /work-number/record-layouts"
              payload: { employer_id: "${emp_id}", layout_version: 1, column_map: { W_LAST4: "worker_ssn_last4", W_DOB: "worker_date_of_birth", HIRE: "hire_date", STATUS: "employment_status", RATE: "pay_rate", BASIS: "pay_rate_basis" }, fiscal_year_start_month: 1 }
              as: Employer
              as_user_id: "${emp_id}"
              captures: { lay_id: $.data.id }
            - call: "POST /work-number/record-layouts/${lay_id}/verify"
              payload: {}
              as: Employer
              as_user_id: "${emp_id}"
            - call: "POST /work-number/payroll-feed-batches"
              payload: { employer_id: "${emp_id}", record_layout_id: "${lay_id}", batch_sequence: 1, pay_period_end_date: "2026-06-06T00:00:00Z", record_count: 2 }
              as: Employer
              as_user_id: "${emp_id}"
              captures: { bat_id: $.data.id }
            - call: "POST /work-number/employment-records"
              payload: { employer_id: "${emp_id}", covered_worker_id: "${wk_a}", payroll_feed_batch_id: "${bat_id}", employment_status: "ACTIVE", hire_date: "2024-02-01T00:00:00Z", separation_date: null, pay_rate_cents: 2531, pay_rate_basis: "HOURLY", standard_hours_per_week: 37.1, final_pay_period_income_cents: 0 }
              as: Employer
              as_user_id: "${emp_id}"
              captures: { rec_a: $.data.id }
            - call: "POST /work-number/employment-records"
              payload: { employer_id: "${emp_id}", covered_worker_id: "${wk_b}", payroll_feed_batch_id: "${bat_id}", employment_status: "ACTIVE", hire_date: "2024-02-01T00:00:00Z", separation_date: null, pay_rate_cents: 2749, pay_rate_basis: "HOURLY", standard_hours_per_week: 32.3, final_pay_period_income_cents: 0 }
              as: Employer
              as_user_id: "${emp_id}"
              captures: { rec_b: $.data.id }
            - call: "POST /work-number/payroll-feed-batches/${bat_id}/validate"
              payload: {}
              as: Employer
              as_user_id: "${emp_id}"
          trigger:
            - call: "GET /work-number/payroll-feed-batches/${bat_id}"
              payload: {}
              as: Employer
              as_user_id: "${emp_id}"
            - call: "GET /work-number/employment-records/${rec_a}"
              payload: {}
              as: PlatformAdmin
            - call: "GET /work-number/employment-records/${rec_b}"
              payload: {}
              as: PlatformAdmin
          assert:
            - "EmploymentRecord.${rec_a}.annualized_income_cents == 4882805 (round_half_up(2531 * 37.1 * 52) == round_half_up(4882805.2) applied per record)"
            - "EmploymentRecord.${rec_b}.annualized_income_cents == 4617220 (round_half_up(2749 * 32.3 * 52) == round_half_up(4617220.4) applied per record)"
            - "PayrollFeedBatch.${bat_id}.gross_amount_cents == 9500025, the sum of the two already-rounded per-record values 4882805 + 4617220; summing the unrounded products first would give round_half_up(9500025.6) == 9500026, which the pinned per-record rounding order rejects"
      - name: verification_fee_uses_post_transaction_volume_tier
        grounds:
          - calculations.verification_fee_charge
          - calculations.verifier_negative_score
          - entities.Verifier.fields.transaction_count
        distinguishing_aspect: |
          Mode (c) circular-looking dependency: the fee depends on a volume tier keyed
          on the transaction count that the fee-producing response itself advances, and
          the scaffold pins the post-transaction count, so the boundary transaction is
          priced at the new tier.
        test_recipe:
          setup:
            - "one bound request already holds request_state VALIDATED, so Verifier.transaction_count is 1"
            - "a second request sits in SUBMITTED against the same captured authorization, so it can be responded to directly without a further validate-currency step"
            - "projected_count is therefore 2, which is exactly VOLUME_STEP1_MIN"
          setup_api_calls:
            - call: "POST /work-number/employers"
              payload: { legal_name: "Northwind Logistics", fein: "123456789", employer_type: "PRIVATE", payroll_frequency: "MONTHLY" }
              as: PlatformAdmin
              captures: { emp_id: $.data.id }
            - call: "POST /work-number/covered-workers"
              payload: { full_name: "Dana Reyes", ssn_last4: "4417", date_of_birth: "1988-03-14" }
              as: PlatformAdmin
              captures: { wk_id: $.data.id, wk_v: $.data.version }
            - call: "POST /work-number/verification-products"
              payload: { product_code: "MORTGAGE-I12", tier: "EMPLOYMENT_INCOME", requesting_class: "MORTGAGE", base_fee_cents: 1500, history_months_included: 12, includes_employment_status: true }
              as: PlatformAdmin
              captures: { prd_id: $.data.id }
            - call: "POST /work-number/verifiers"
              payload: { legal_name: "Meridian Home Lending", verifier_class: "MORTGAGE_LENDER", permitted_purpose: "MORTGAGE_CREDIT_DECISION", escrow_balance_cents: 6000 }
              as: PlatformAdmin
              captures: { vfr_id: $.data.id }
            - call: "POST /work-number/verifiers/${vfr_id}/accredit"
              payload: {}
              as: Verifier
              as_user_id: "${vfr_id}"
            - call: "POST /work-number/verifiers/${vfr_id}/authorize"
              payload: {}
              as: Verifier
              as_user_id: "${vfr_id}"
            - call: "POST /work-number/record-layouts"
              payload: { employer_id: "${emp_id}", layout_version: 1, column_map: { W_LAST4: "worker_ssn_last4", W_DOB: "worker_date_of_birth", HIRE: "hire_date", STATUS: "employment_status", RATE: "pay_rate", BASIS: "pay_rate_basis" }, fiscal_year_start_month: 1 }
              as: Employer
              as_user_id: "${emp_id}"
              captures: { lay_id: $.data.id }
            - call: "POST /work-number/record-layouts/${lay_id}/verify"
              payload: {}
              as: Employer
              as_user_id: "${emp_id}"
            - call: "POST /work-number/payroll-feed-batches"
              payload: { employer_id: "${emp_id}", record_layout_id: "${lay_id}", batch_sequence: 1, pay_period_end_date: "2026-05-31T00:00:00Z", record_count: 1200 }
              as: Employer
              as_user_id: "${emp_id}"
              captures: { bat_id: $.data.id }
            - call: "POST /work-number/employment-records"
              payload: { employer_id: "${emp_id}", covered_worker_id: "${wk_id}", payroll_feed_batch_id: "${bat_id}", employment_status: "ACTIVE", hire_date: "2023-01-15T00:00:00Z", separation_date: null, pay_rate_cents: 520000, pay_rate_basis: "MONTHLY", standard_hours_per_week: 40, final_pay_period_income_cents: 0 }
              as: Employer
              as_user_id: "${emp_id}"
            - call: "POST /work-number/payroll-feed-batches/${bat_id}/validate"
              payload: {}
              as: Employer
              as_user_id: "${emp_id}"
            - call: "POST /work-number/consumer-authorizations"
              payload: { covered_worker_id: "${wk_id}", verifier_id: "${vfr_id}", permitted_purpose: "MORTGAGE_CREDIT_DECISION", expected_covered_worker_version: "${wk_v}" }
              as: CoveredWorker
              as_user_id: "${wk_id}"
              captures: { aut_id: $.data.id }
            - call: "POST /work-number/verification-requests"
              payload: { verifier_id: "${vfr_id}", covered_worker_id: "${wk_id}", product_id: "${prd_id}", permissible_purpose_asserted: "MORTGAGE_CREDIT_DECISION" }
              as: Verifier
              as_user_id: "${vfr_id}"
              captures: { req_1: $.data.id }
            - call: "POST /work-number/verification-requests/${req_1}/permit"
              payload: { consumer_authorization_id: "${aut_id}" }
              as: CoveredWorker
              as_user_id: "${wk_id}"
            - call: "POST /work-number/verification-requests/${req_1}/validate-currency"
              payload: {}
              as: Verifier
              as_user_id: "${vfr_id}"
            - call: "POST /work-number/verification-requests"
              payload: { verifier_id: "${vfr_id}", covered_worker_id: "${wk_id}", product_id: "${prd_id}", permissible_purpose_asserted: "MORTGAGE_CREDIT_DECISION" }
              as: Verifier
              as_user_id: "${vfr_id}"
              captures: { req_2: $.data.id }
          trigger:
            - call: "POST /work-number/verification-responses"
              payload: { verification_request_id: "${req_2}" }
              as: Verifier
              as_user_id: "${vfr_id}"
              captures: { resp_2: $.data.id, req2_id: $.data.verification_request_id }
            - call: "GET /work-number/verification-requests/${req_2}"
              payload: {}
              as: Verifier
              as_user_id: "${vfr_id}"
          assert:
            - "VerificationRequest.${req_2}.fee_charged_cents == 1665, computed as round_half_up((1500 + 350) * 0.90) because projected_count is 2 and therefore at or above VOLUME_STEP1_MIN"
            - "reading the pre-transaction count instead would price the same transaction at round_half_up(1850 * 1.00) == 1850, so the two evaluation orders are separable at exactly this boundary"
            - "Verifier.${vfr_id}.escrow_balance_cents == 6000 - 1665 == 4335, because validate-currency never charges and only the response posts a fee"
            - "Verifier.${vfr_id}.transaction_count == 2"
  - rule_id: non_linear_state_machine
    instances:
      - name: record_dispute_round_trip_reopen_and_re_resolve
        grounds:
          - state_machines.RecordDispute.RESOLVED_UPHELD_to_NOTICE_SENT
          - state_machines.RecordDispute.NOTICE_SENT_to_EMPLOYER_RESPONDED
          - entities.RecordDispute.fields.dispute_state
        distinguishing_aspect: |
          The RecordDispute machine on this scaffold is cyclic rather than a pipeline:
          a resolved dispute returns to NOTICE_SENT and walks the same response edge a
          second time, whose side effects fire again on the second traversal.
        test_recipe:
          setup:
            - "worker Dana Reyes holds a VERIFIED span at a MONTHLY employer and has filed one dispute which is in NOTICE_SENT"
            - "logical clock at 2026-06-01T00:00:00Z, so the 45-day response window is open"
          setup_api_calls:
            - call: "POST /work-number/employers"
              payload: { legal_name: "Northwind Logistics", fein: "123456789", employer_type: "PRIVATE", payroll_frequency: "MONTHLY" }
              as: PlatformAdmin
              captures: { emp_id: $.data.id }
            - call: "POST /work-number/covered-workers"
              payload: { full_name: "Dana Reyes", ssn_last4: "4417", date_of_birth: "1988-03-14" }
              as: PlatformAdmin
              captures: { wk_id: $.data.id, wk_v: $.data.version }
            - call: "POST /work-number/record-layouts"
              payload: { employer_id: "${emp_id}", layout_version: 1, column_map: { W_LAST4: "worker_ssn_last4", W_DOB: "worker_date_of_birth", HIRE: "hire_date", STATUS: "employment_status", RATE: "pay_rate", BASIS: "pay_rate_basis" }, fiscal_year_start_month: 1 }
              as: Employer
              as_user_id: "${emp_id}"
              captures: { lay_id: $.data.id }
            - call: "POST /work-number/record-layouts/${lay_id}/verify"
              payload: {}
              as: Employer
              as_user_id: "${emp_id}"
            - call: "POST /work-number/payroll-feed-batches"
              payload: { employer_id: "${emp_id}", record_layout_id: "${lay_id}", batch_sequence: 1, pay_period_end_date: "2026-05-31T00:00:00Z", record_count: 900 }
              as: Employer
              as_user_id: "${emp_id}"
              captures: { bat_id: $.data.id }
            - call: "POST /work-number/employment-records"
              payload: { employer_id: "${emp_id}", covered_worker_id: "${wk_id}", payroll_feed_batch_id: "${bat_id}", employment_status: "ACTIVE", hire_date: "2023-01-15T00:00:00Z", separation_date: null, pay_rate_cents: 520000, pay_rate_basis: "MONTHLY", standard_hours_per_week: 40, final_pay_period_income_cents: 0 }
              as: Employer
              as_user_id: "${emp_id}"
              captures: { rec_id: $.data.id, rec_v: $.data.version }
            - call: "POST /work-number/payroll-feed-batches/${bat_id}/validate"
              payload: {}
              as: Employer
              as_user_id: "${emp_id}"
            - call: "GET /work-number/employment-records/${rec_id}"
              payload: {}
              as: PlatformAdmin
              captures: { rec_v2: $.data.version }
            - call: "POST /work-number/record-disputes"
              payload: { employment_record_id: "${rec_id}", covered_worker_id: "${wk_id}", claimed_field: "EMPLOYMENT_STATUS", claimed_correct_value: "TERMINATED", expected_employment_record_version: "${rec_v2}" }
              as: CoveredWorker
              as_user_id: "${wk_id}"
              captures: { dsp_id: $.data.id }
            - call: "POST /work-number/record-disputes/${dsp_id}/notice"
              payload: {}
              as: Employer
              as_user_id: "${emp_id}"
          trigger:
            - call: "POST /work-number/record-disputes/${dsp_id}/respond"
              payload: { resolution: "UPHELD" }
              as: Employer
              as_user_id: "${emp_id}"
            - call: "POST /work-number/record-disputes/${dsp_id}/reopen"
              payload: { resolution: "REOPEN" }
              as: CoveredWorker
              as_user_id: "${wk_id}"
            - call: "POST /work-number/record-disputes/${dsp_id}/respond"
              payload: { resolution: "UPHELD" }
              as: Employer
              as_user_id: "${emp_id}"
          assert:
            - "RecordDispute.${dsp_id}.dispute_state == RESOLVED_UPHELD after the second traversal of the respond edge"
            - "CoveredWorker.${wk_id}.open_dispute_count == 0, because the reopen incremented it to 1 and the second resolution decremented it back"
            - "Employer.${emp_id}.dispute_open_count == 0"
            - "the second respond is rejected if the dispute had already been CLOSED, proving the reopen edge is the only way back"
      - name: verification_request_permitted_reconsent_then_permit_again_loop
        grounds:
          - state_machines.VerificationRequest.PERMITTED_to_SUBMITTED
          - state_machines.VerificationRequest.SUBMITTED_to_PERMITTED
          - entities.VerificationRequest.fields.resolved_product_tier
        distinguishing_aspect: |
          The VerificationRequest consent loop on this scaffold cycles between
          SUBMITTED and PERMITTED rather than moving forward, and each traversal
          re-runs tier_resolution so the snapshot is rewritten rather than accumulated.
        test_recipe:
          setup:
            - "worker with a MONTHLY employer holding a VERIFIED span of 40 months tenure"
            - "an MORTGAGE product at the EMPLOYMENT_INCOME tier with base_fee_cents 1500"
            - "a captured authorization for the worker and the requesting party"
