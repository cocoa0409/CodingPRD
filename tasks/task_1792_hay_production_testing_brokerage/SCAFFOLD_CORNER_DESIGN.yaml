        grounds: ["errors[ERR_FIELD_WINDOW_OVERLAP]"]
        excluded_because:
          difficulty_instance: window_overlap_beats_duplicate_number
          rationale: "ERR_FIELD_WINDOW_OVERLAP is the asserted outcome of the named §1.8 priority-conflict instance (and again in cutting_window_half_open_overlap)."
