# =============================================================================
# 1.9 Scaffold Corner Design (Coverage Index for Non-Difficulty Tests)
# Breadth probe over SCAFFOLD.yaml §1.1-§1.7 following the claim-extraction
# taxonomy. Instances already asserted by §1.8 appear as excluded_because stubs.
# =============================================================================
scaffold_corner_design:
  - section: entities
    instances:
      - name: lot_creation_defaults_and_computed_fields
        claim_type: creation_defaults_computed_system
        grounds:
          - entities.RawLot
          - state_machines.RawLot
        distinguishing_aspect: "A created RawLot starts RECEIVED with quantity_remaining_kg == quantity_kg, consumed/wasted 0, system id/created_at, version 1."
        test_recipe:
          setup: ["supplier S exists"]
          setup_api_calls:
            - { call: "POST /spice/suppliers", payload: { name: "Malabar Exports", origin_country: "IN" }, as: SupplyPlanner, captures: { sup: $.data.id } }
          trigger:
            - { call: "POST /spice/lots", payload: { supplier_id: "${sup}", spice_code: CUMIN, origin_region: "Aleppo", crop_year: 2025, quantity_kg: 60, flavor_intensity_units: 55.5, moisture_pct: 9.5, cost_per_kg_cents: 210, allergen_profile: CELERY, organic_certified: true }, as: SupplyPlanner, captures: { st: $.data.status, rem: $.data.quantity_remaining_kg, con: $.data.quantity_consumed_kg, was: $.data.quantity_wasted_kg, ver: $.data.version } }
          assert:
            - "${st} == RECEIVED (state machine initial_state)"
            - "${rem} == 60 (remaining initialized to quantity_kg), ${con} == 0, ${was} == 0"
            - "${ver} == 1 and response carries server-minted id and created_at (system fields)"

      - name: lot_invalid_enum_value_rejected
        claim_type: type_constraints
        grounds:
          - entities.RawLot.fields.spice_code
          - "errors[ERR_INVALID_REQUEST]"
        distinguishing_aspect: "spice_code outside constants.SPICE_CODES (TURMERIC) is rejected 400 before any persistence."
        test_recipe:
          setup: ["supplier S exists"]
          setup_api_calls:
            - { call: "POST /spice/suppliers", payload: { name: "Malabar Exports", origin_country: "IN" }, as: SupplyPlanner, captures: { sup: $.data.id } }
          trigger:
            - { call: "POST /spice/lots", payload: { supplier_id: "${sup}", spice_code: TURMERIC, origin_region: "X", crop_year: 2025, quantity_kg: 10, flavor_intensity_units: 50.0, moisture_pct: 8.0, cost_per_kg_cents: 100, allergen_profile: NONE }, as: SupplyPlanner, captures: { err: $.data.error_id } }
            - { call: "GET /spice/lots", payload: {}, as: SupplyPlanner }
          assert:
            - "${err} == ERR_INVALID_REQUEST (HTTP 400)"
            - "lot list remains empty (data length 0) — rejected shape persists nothing"

      - name: lot_crop_year_out_of_range_rejected
        claim_type: type_constraints
        grounds:
          - entities.RawLot.fields.crop_year
          - "errors[ERR_VALIDATION]"
        distinguishing_aspect: "crop_year 1999 < CROP_YEAR_MIN 2000 violates the range rule -> ERR_VALIDATION 422 (distinct from enum-shape 400)."
        test_recipe:
          setup: ["supplier S exists"]
          setup_api_calls:
            - { call: "POST /spice/suppliers", payload: { name: "Malabar Exports", origin_country: "IN" }, as: SupplyPlanner, captures: { sup: $.data.id } }
          trigger:
            - { call: "POST /spice/lots", payload: { supplier_id: "${sup}", spice_code: CUMIN, origin_region: "Aleppo", crop_year: 1999, quantity_kg: 10, flavor_intensity_units: 50.0, moisture_pct: 8.0, cost_per_kg_cents: 100, allergen_profile: NONE }, as: SupplyPlanner, captures: { err: $.data.error_id } }
          assert:
            - "${err} == ERR_VALIDATION (HTTP 422) — range semantics, not request shape"

      - name: supplier_optional_defaults_applied
        claim_type: defaults
        grounds:
          - entities.Supplier.fields.knowledge_tier
          - entities.Supplier.fields.certifications
        distinguishing_aspect: "Omitting certifications and knowledge_tier applies defaults [] and MASKED_ONLY (recipe-protection default: suppliers see masked data unless explicitly elevated)."
        test_recipe:
          setup: ["empty database"]
          setup_api_calls: []
          trigger:
            - { call: "POST /spice/suppliers", payload: { name: "Default Farms", origin_country: "ES" }, as: SupplyPlanner, captures: { tier: $.data.knowledge_tier, certs: $.data.certifications } }
          assert:
            - "${tier} == MASKED_ONLY"
            - "${certs} == [] (empty array, not null)"

      - name: safety_test_immutable_no_version_fields
        claim_type: immutability
        grounds:
          - entities.SafetyTest
          - "endpoints: POST /spice/lots/{id}/tests"
        distinguishing_aspect: "SafetyTest is common_fields:false — the response carries id and created_at but no version/updated_at; analyst_user_id is server-copied from X-User-ID; result is computed."
        test_recipe:
          setup: ["supplier S; one RECEIVED lot"]
          setup_api_calls:
            - { call: "POST /spice/suppliers", payload: { name: "Malabar Exports", origin_country: "IN" }, as: SupplyPlanner, captures: { sup: $.data.id } }
            - { call: "POST /spice/lots", payload: { supplier_id: "${sup}", spice_code: OREGANO, origin_region: "Lesvos", crop_year: 2025, quantity_kg: 40, flavor_intensity_units: 60.0, moisture_pct: 9.0, cost_per_kg_cents: 150, allergen_profile: NONE }, as: SupplyPlanner, captures: { lot: $.data.id } }
          trigger:
            - { call: "POST /spice/lots/${lot}/tests", payload: { test_type: MICRO, measured_value: 1000, lab_code: "LAB-Z" }, as: QualityAnalyst, as_user_id: "qa-7", captures: { res: $.data.result, analyst: $.data.analyst_user_id, lotref: $.data.lot_id } }
          assert:
            - "${res} == PASS (1000 <= 100000), ${analyst} == qa-7 (copied from header, not payload), ${lotref} == ${lot}"
            - "response contains id and created_at but NO version and NO updated_at keys (append-only entity)"
            - "no update/delete endpoint exists for SafetyTest in §1.5"

      - name: formula_line_masked_codes_sequential
        claim_type: computed_fields
        grounds:
          - entities.FormulaLine.fields.masked_component_code
        distinguishing_aspect: "masked_component_code is system-assigned CMP-A, CMP-B, CMP-C in creation order within the formula — supplier-visible pseudonyms that never reveal spice identity."
        test_recipe:
          setup: ["DRAFT formula F exists"]
          setup_api_calls:
            - { call: "POST /spice/formulas", payload: { product_code: "MASK-1", name: "Masked Blend", brand_type: BRANDED, target_flavor_units: 80.0 }, as: FlavorScientist, captures: { f: $.data.id } }
          trigger:
            - { call: "POST /spice/formulas/${f}/lines", payload: { spice_code: BLACK_PEPPER, target_proportion_pct: 50.0, allergen_profile: NONE, min_lot_flavor_units: 40.0 }, as: FlavorScientist, captures: { m1: $.data.masked_component_code } }
            - { call: "POST /spice/formulas/${f}/lines", payload: { spice_code: PAPRIKA, target_proportion_pct: 30.0, allergen_profile: NONE, min_lot_flavor_units: 40.0 }, as: FlavorScientist, captures: { m2: $.data.masked_component_code } }
            - { call: "POST /spice/formulas/${f}/lines", payload: { spice_code: CUMIN, target_proportion_pct: 20.0, allergen_profile: SESAME, min_lot_flavor_units: 40.0 }, as: FlavorScientist, captures: { m3: $.data.masked_component_code } }
          assert:
            - "${m1} == CMP-A, ${m2} == CMP-B, ${m3} == CMP-C (creation order, per-formula scope)"

      - name: formula_revision_supersedes_and_retires
        claim_type: parent_relationships
        grounds:
          - entities.BlendFormula.fields.supersedes_formula_id
          - state_machines.BlendFormula.formula_superseded
        distinguishing_aspect: "A revision created with supersedes_formula_id carries revision+1; activating it retires the prior ACTIVE formula; the self-FK reverse list GET /spice/formulas?supersedes_formula_id resolves."
        test_recipe:
          setup: ["ACTIVE formula F1 product CURRY-5 revision 1"]
          setup_api_calls:
            - { call: "POST /spice/formulas", payload: { product_code: "CURRY-5", name: "Curry v1", brand_type: BRANDED, target_flavor_units: 80.0 }, as: FlavorScientist, captures: { f1: $.data.id, f1_rev: $.data.revision } }
            - { call: "POST /spice/formulas/${f1}/lines", payload: { spice_code: BLACK_PEPPER, target_proportion_pct: 100.0, allergen_profile: NONE, min_lot_flavor_units: 40.0 }, as: FlavorScientist }
            - { call: "POST /spice/formulas/${f1}/activate", payload: {}, as: FlavorScientist }
          trigger:
            - { call: "POST /spice/formulas", payload: { product_code: "CURRY-5", name: "Curry v2", brand_type: BRANDED, target_flavor_units: 82.0, supersedes_formula_id: "${f1}" }, as: FlavorScientist, captures: { f2: $.data.id, f2_rev: $.data.revision, f2_st: $.data.status } }
            - { call: "POST /spice/formulas/${f2}/lines", payload: { spice_code: BLACK_PEPPER, target_proportion_pct: 100.0, allergen_profile: NONE, min_lot_flavor_units: 40.0 }, as: FlavorScientist }
            - { call: "POST /spice/formulas/${f2}/activate", payload: {}, as: FlavorScientist }
            - { call: "GET /spice/formulas/${f1}", payload: {}, as: FlavorScientist, captures: { f1_st: $.data.status } }
            - { call: "GET /spice/formulas?supersedes_formula_id=${f1}", payload: {}, as: FlavorScientist, captures: { child: "$.data[0].id" } }
          assert:
            - "${f1_rev} == 1 and ${f2_rev} == 2 (revision increments along the supersedes chain)"
            - "${f2_st} == DRAFT at creation; after F2 activation ${f1_st} == RETIRED (supersede cascade)"
            - "reverse reachability: ${child} == ${f2} and the filtered list has exactly 1 entry"

  - section: state_machines
    instances:
      - name: disposition_on_received_lot_invalid_state
        claim_type: invalid_transition
        grounds:
          - state_machines.RawLot
          - "errors[ERR_INVALID_STATE]"
        distinguishing_aspect: "Disposition is only legal from IN_TEST or QUARANTINED; a RECEIVED lot (no tests yet) rejects with ERR_INVALID_STATE and stays RECEIVED."
        test_recipe:
          setup: ["supplier S; one RECEIVED lot (no tests)"]
          setup_api_calls:
            - { call: "POST /spice/suppliers", payload: { name: "Malabar Exports", origin_country: "IN" }, as: SupplyPlanner, captures: { sup: $.data.id } }
            - { call: "POST /spice/lots", payload: { supplier_id: "${sup}", spice_code: CUMIN, origin_region: "Aleppo", crop_year: 2025, quantity_kg: 40, flavor_intensity_units: 60.0, moisture_pct: 9.0, cost_per_kg_cents: 150, allergen_profile: NONE }, as: SupplyPlanner, captures: { lot: $.data.id } }
          trigger:
            - { call: "POST /spice/lots/${lot}/disposition", payload: { action: QUARANTINE }, as: QualityManager, as_user_id: "qm-1", captures: { err: $.data.error_id } }
            - { call: "GET /spice/lots/${lot}", payload: {}, as: QualityManager, captures: { st: $.data.status } }
          assert:
            - "${err} == ERR_INVALID_STATE (HTTP 409)"
            - "${st} == RECEIVED (no transition, no side effects)"

      - name: blend_void_twice_invalid_state
        claim_type: terminal_state_lockdown
        grounds:
          - state_machines.BlendRun.blend_void_draft
          - "errors[ERR_INVALID_STATE]"
        distinguishing_aspect: "VOIDED is terminal: a second void on the same blend run fails ERR_INVALID_STATE (also the idempotency claim for the void action)."
        test_recipe:
          setup: ["ACTIVE formula F; DRAFT blend run BR"]
          setup_api_calls:
            - { call: "POST /spice/formulas", payload: { product_code: "VOID-1", name: "Void Blend", brand_type: BRANDED, target_flavor_units: 80.0 }, as: FlavorScientist, captures: { f: $.data.id } }
            - { call: "POST /spice/formulas/${f}/lines", payload: { spice_code: CUMIN, target_proportion_pct: 100.0, allergen_profile: NONE, min_lot_flavor_units: 0.0 }, as: FlavorScientist }
            - { call: "POST /spice/formulas/${f}/activate", payload: {}, as: FlavorScientist }
            - { call: "POST /spice/blend-runs", payload: { formula_id: "${f}", selection_policy: COST_MIN, target_batch_kg: 5 }, as: FlavorScientist, captures: { br: $.data.id } }
          trigger:
            - { call: "POST /spice/blend-runs/${br}/void", payload: {}, as: FlavorScientist, captures: { st1: $.data.status } }
            - { call: "POST /spice/blend-runs/${br}/void", payload: {}, as: FlavorScientist, captures: { err: $.data.error_id } }
          assert:
            - "${st1} == VOIDED (DRAFT void: no quantity side effects because nothing was consumed)"
            - "second void: ${err} == ERR_INVALID_STATE (HTTP 409) — terminal lockdown"

      - name: run_complete_twice_invalid_state
        claim_type: invalid_transition
        grounds:
          - state_machines.ProductionRun.run_complete
          - "errors[ERR_INVALID_STATE]"
        distinguishing_aspect: "COMPLETED is terminal for the run: a second complete fails ERR_INVALID_STATE and creates no second FinishedBatch."
        test_recipe:
          setup:
            - "supplier S; three ACCEPTED pepper lots (100 kg each, cost 100); ACTIVE formula CMP-2; COMMITTED 10 kg blend; COMPLETED run R on line LN -> one batch"
          setup_api_calls:
            - { call: "POST /spice/suppliers", payload: { name: "Malabar Exports", origin_country: "IN" }, as: SupplyPlanner, captures: { sup: $.data.id } }
            - { call: "POST /spice/lots", payload: { supplier_id: "${sup}", spice_code: BLACK_PEPPER, origin_region: "Malabar", crop_year: 2025, quantity_kg: 100, flavor_intensity_units: 100.0, moisture_pct: 8.0, cost_per_kg_cents: 100, allergen_profile: NONE, organic_certified: false }, as: SupplyPlanner, captures: { la: $.data.id } }
            - { call: "POST /spice/lots", payload: { supplier_id: "${sup}", spice_code: BLACK_PEPPER, origin_region: "Malabar", crop_year: 2025, quantity_kg: 100, flavor_intensity_units: 100.0, moisture_pct: 8.0, cost_per_kg_cents: 100, allergen_profile: NONE, organic_certified: false }, as: SupplyPlanner, captures: { lb: $.data.id } }
            - { call: "POST /spice/lots", payload: { supplier_id: "${sup}", spice_code: BLACK_PEPPER, origin_region: "Malabar", crop_year: 2025, quantity_kg: 100, flavor_intensity_units: 100.0, moisture_pct: 8.0, cost_per_kg_cents: 100, allergen_profile: NONE, organic_certified: false }, as: SupplyPlanner, captures: { lc: $.data.id } }
            - { call: "POST /spice/lots/${la}/tests", payload: { test_type: MICRO, measured_value: 50000, lab_code: "LAB-A" }, as: QualityAnalyst, as_user_id: "qa-1" }
            - { call: "POST /spice/lots/${la}/tests", payload: { test_type: ADULTERANT_SCREEN, measured_value: 1.0, lab_code: "LAB-A" }, as: QualityAnalyst, as_user_id: "qa-1" }
            - { call: "POST /spice/lots/${la}/tests", payload: { test_type: MOISTURE, measured_value: 8.0, lab_code: "LAB-A" }, as: QualityAnalyst, as_user_id: "qa-1" }
            - { call: "POST /spice/lots/${la}/disposition", payload: { action: ACCEPT }, as: QualityManager, as_user_id: "qm-1" }
            - { call: "POST /spice/lots/${lb}/tests", payload: { test_type: MICRO, measured_value: 50000, lab_code: "LAB-A" }, as: QualityAnalyst, as_user_id: "qa-1" }
            - { call: "POST /spice/lots/${lb}/tests", payload: { test_type: ADULTERANT_SCREEN, measured_value: 1.0, lab_code: "LAB-A" }, as: QualityAnalyst, as_user_id: "qa-1" }
            - { call: "POST /spice/lots/${lb}/tests", payload: { test_type: MOISTURE, measured_value: 8.0, lab_code: "LAB-A" }, as: QualityAnalyst, as_user_id: "qa-1" }
            - { call: "POST /spice/lots/${lb}/disposition", payload: { action: ACCEPT }, as: QualityManager, as_user_id: "qm-1" }
            - { call: "POST /spice/lots/${lc}/tests", payload: { test_type: MICRO, measured_value: 50000, lab_code: "LAB-A" }, as: QualityAnalyst, as_user_id: "qa-1" }
            - { call: "POST /spice/lots/${lc}/tests", payload: { test_type: ADULTERANT_SCREEN, measured_value: 1.0, lab_code: "LAB-A" }, as: QualityAnalyst, as_user_id: "qa-1" }
            - { call: "POST /spice/lots/${lc}/tests", payload: { test_type: MOISTURE, measured_value: 8.0, lab_code: "LAB-A" }, as: QualityAnalyst, as_user_id: "qa-1" }
            - { call: "POST /spice/lots/${lc}/disposition", payload: { action: ACCEPT }, as: QualityManager, as_user_id: "qm-1" }
            - { call: "POST /spice/formulas", payload: { product_code: "CMP-2", name: "Complete Twice", brand_type: BRANDED, target_flavor_units: 100.0 }, as: FlavorScientist, captures: { f: $.data.id } }
            - { call: "POST /spice/formulas/${f}/lines", payload: { spice_code: BLACK_PEPPER, target_proportion_pct: 100.0, allergen_profile: NONE, min_lot_flavor_units: 50.0 }, as: FlavorScientist }
            - { call: "POST /spice/formulas/${f}/activate", payload: {}, as: FlavorScientist }
            - { call: "POST /spice/blend-runs", payload: { formula_id: "${f}", selection_policy: COST_MIN, target_batch_kg: 10 }, as: FlavorScientist, captures: { br: $.data.id } }
            - { call: "POST /spice/blend-runs/${br}/commit", payload: {}, as: FlavorScientist }
            - { call: "POST /spice/lines", payload: { name: "Line-T", capacity_kg_per_shift: 1000, supported_changeover_classes: [NONE, DRY_CLEAN, WET_WASH, FULL_SANITATION] }, as: PlatformAdmin, captures: { ln: $.data.id } }
            - { call: "GET /spice/lines/${ln}", payload: {}, as: ProductionScheduler, captures: { ln_v: $.data.version } }
            - { call: "POST /spice/production-runs", payload: { line_id: "${ln}", formula_id: "${f}", blend_run_id: "${br}", quantity_kg: 10, window_start: "2026-09-14T08:00:00Z", window_end: "2026-09-14T12:00:00Z", expected_line_version: "${ln_v}" }, as: ProductionScheduler, captures: { r: $.data.id } }
            - { call: "POST /spice/production-runs/${r}/complete", payload: {}, as: ProductionScheduler, captures: { st1: $.data.status } }
          trigger:
            - { call: "POST /spice/production-runs/${r}/complete", payload: {}, as: ProductionScheduler, captures: { err: $.data.error_id } }
            - { call: "GET /spice/batches?production_run_id=${r}", payload: {}, as: QualityManager }
          assert:
            - "first complete: ${st1} == COMPLETED"
            - "second complete: ${err} == ERR_INVALID_STATE (HTTP 409)"
            - "exactly 1 FinishedBatch exists for run ${r} (no duplicate side effects)"

      - name: recall_initiate_twice_invalid_state
        claim_type: invalid_transition
        grounds:
          - state_machines.RecallCase.recall_initiate
          - "errors[ERR_INVALID_STATE]"
        distinguishing_aspect: "INITIATED is not a legal from-state for initiate; the second call fails and the frozen scope is unchanged."
        test_recipe:
          setup: ["supplier S; one lot (any status); MANUAL recall case RC (FINAL, suspect lot) already INITIATED with empty scope"]
          setup_api_calls:
            - { call: "POST /spice/suppliers", payload: { name: "Malabar Exports", origin_country: "IN" }, as: SupplyPlanner, captures: { sup: $.data.id } }
            - { call: "POST /spice/lots", payload: { supplier_id: "${sup}", spice_code: CUMIN, origin_region: "Aleppo", crop_year: 2025, quantity_kg: 40, flavor_intensity_units: 60.0, moisture_pct: 9.0, cost_per_kg_cents: 150, allergen_profile: NONE }, as: SupplyPlanner, captures: { lot: $.data.id } }
            - { call: "POST /spice/recall-cases", payload: { trigger_type: LOT_SUSPECT, suspect_lot_id: "${lot}", scope_policy: FINAL }, as: RecallCoordinator, captures: { rc: $.data.id } }
            - { call: "POST /spice/recall-cases/${rc}/initiate", payload: {}, as: RecallCoordinator, captures: { st1: $.data.status } }
          trigger:
            - { call: "POST /spice/recall-cases/${rc}/initiate", payload: {}, as: RecallCoordinator, captures: { err: $.data.error_id } }
            - { call: "GET /spice/recall-cases/${rc}", payload: {}, as: RecallCoordinator, captures: { scope: $.data.affected_batch_ids, qty: $.data.affected_quantity_kg } }
          assert:
            - "${st1} == INITIATED; second initiate: ${err} == ERR_INVALID_STATE"
            - "scope still frozen: ${scope} == [] and ${qty} == 0"

      - name: formula_activate_empty_rejected
        claim_type: precondition_enforcement
        grounds:
          - state_machines.BlendFormula.formula_activate
          - "errors[ERR_PROPORTION_SUM_INVALID]"
        distinguishing_aspect: "Activating a formula with zero lines fails the proportion gate: empty sum 0 gives |0 - 100| = 100 > 0.01."
        test_recipe:
          setup: ["DRAFT formula F with no lines"]
          setup_api_calls:
            - { call: "POST /spice/formulas", payload: { product_code: "EMPTY-1", name: "No Lines", brand_type: BRANDED, target_flavor_units: 80.0 }, as: FlavorScientist, captures: { f: $.data.id } }
          trigger:
            - { call: "POST /spice/formulas/${f}/activate", payload: {}, as: FlavorScientist, captures: { err: $.data.error_id } }
            - { call: "GET /spice/formulas/${f}", payload: {}, as: FlavorScientist, captures: { st: $.data.status } }
          assert:
            - "${err} == ERR_PROPORTION_SUM_INVALID (HTTP 422)"
            - "${st} == DRAFT (no transition)"

      - name: formula_activate_sum_correction_then_success
        claim_type: precondition_enforcement
        grounds:
          - state_machines.BlendFormula.formula_activate
          - constants.PROPORTION_SUM_EPSILON
        distinguishing_aspect: "Sum 90.0 fails activation (> 0.01 epsilon); after adding the missing 10% line the same formula activates — the gate is re-evaluated per attempt, not latched."
        test_recipe:
          setup: ["DRAFT formula F with lines 60% + 30%"]
          setup_api_calls:
            - { call: "POST /spice/formulas", payload: { product_code: "SUM-1", name: "Sum Probe", brand_type: BRANDED, target_flavor_units: 80.0 }, as: FlavorScientist, captures: { f: $.data.id } }
            - { call: "POST /spice/formulas/${f}/lines", payload: { spice_code: BLACK_PEPPER, target_proportion_pct: 60.0, allergen_profile: NONE, min_lot_flavor_units: 40.0 }, as: FlavorScientist }
            - { call: "POST /spice/formulas/${f}/lines", payload: { spice_code: PAPRIKA, target_proportion_pct: 30.0, allergen_profile: NONE, min_lot_flavor_units: 40.0 }, as: FlavorScientist }
          trigger:
            - { call: "POST /spice/formulas/${f}/activate", payload: {}, as: FlavorScientist, captures: { err: $.data.error_id } }
            - { call: "POST /spice/formulas/${f}/lines", payload: { spice_code: CUMIN, target_proportion_pct: 10.0, allergen_profile: NONE, min_lot_flavor_units: 40.0 }, as: FlavorScientist }
            - { call: "POST /spice/formulas/${f}/activate", payload: {}, as: FlavorScientist, captures: { st: $.data.status } }
          assert:
            - "first activate (sum 90.0): ${err} == ERR_PROPORTION_SUM_INVALID"
            - "after adding the 10% line (sum 100.0): ${st} == ACTIVE"

      - name: batch_ship_happy_then_reship_invalid
        claim_type: valid_transition
        grounds:
          - state_machines.FinishedBatch.batch_ship
          - "errors[ERR_INVALID_STATE]"
        distinguishing_aspect: "A CLEAR CREATED batch with full shelf life ships (commercial CREATED -> SHIPPED); a second ship is rejected ERR_INVALID_STATE (idempotency of the ship action)."
        test_recipe:
          setup:
            - "supplier S; three ACCEPTED pepper lots (cost 100); ACTIVE formula SHP-1; COMMITTED 10 kg blend; COMPLETED run -> batch B (CREATED/CLEAR, produced at clock default 2026-09-01)"
          setup_api_calls:
            - { call: "POST /spice/suppliers", payload: { name: "Malabar Exports", origin_country: "IN" }, as: SupplyPlanner, captures: { sup: $.data.id } }
