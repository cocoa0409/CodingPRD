          assert:
            - "First tariff: 201 created; ${t_ok_rev} == 695088000 (12*2000*(1462 + 2500*1100/100)); class increase rounds to 1358 bp == cap_bp 1358 and passes because the rule is strictly-greater"
            - "Second tariff: ${err} == ERR_GRADUALISM_CAP_EXCEEDED; its revenue would be 695160000 -> 1359 bp > 1358"
            - "The second tariff's window [2028-01-01, 2029-01-01) does not overlap the first's [2027-01-01, 2028-01-01), isolating the cap as the sole failure"
            - "GET /api/v1/tariff-rates?rate_case_id=${rc} returns exactly 1 row (the passing tariff)"

