scaffold_difficulty_design:
  # =====================================================================
  # Rule 1 — dual_variant_calc (different entity domains)
  # =====================================================================
  - rule_id: dual_variant_calc
    instances:
      - name: acquisition_basis_provisional_vs_final
        grounds:
          - calculations.acquisition_fair_value
          - entities.OREOProperty.fields.acquisition_basis
          - state_machines.Appraisal.SUBMITTED_to_CERTIFIED
        distinguishing_aspect: |
          Entity domain = OREOProperty acquisition accounting. For identical
          property intake data, the PROVISIONAL variant (bpo_value 400000.00 ->
          basis 368000.00) and the FINAL variant (certified appraisal 380000.00
          inside the 180-day measurement window -> basis 349600.00) produce
          different acquisition_basis values, and the FINAL switch auto-posts a
          MEASUREMENT_PERIOD_ADJUSTMENT WriteDown of exactly 18400.00.
        test_recipe:
          setup:
            - "Property created with bpo_value 400000.00 -> provisional basis 368000.00"
            - "Logical clock at 2026-06-01 so the appraisal effective_date is legal"
            - "Appraisal of 380000.00 effective 2026-06-01 (<= 2026-05-10 + 180d = 2026-11-06) submitted"
          setup_api_calls:
            - { call: "POST /api/oreo-properties", payload: { address: "1420 Maple St", state_code: "CA", county: "Alameda", property_type: "RESIDENTIAL", acquisition_date: "2026-05-10", bpo_value: 400000.00, foreclosure_debt: 410000.00 }, as: OREOAdmin, captures: { p_id: $.data.id, p_v: $.data.version } }
            - { call: "POST /api/_clock/set_current_utc", payload: { to_iso8601: "2026-06-01T00:00:00Z" }, as: OREOAdmin }
            - { call: "POST /api/appraisers", payload: { name: "Apex Valuations", license_number: "LIC-A1", coverage_states: ["CA"], fee_flat: 750.00 }, as: OREOAdmin, captures: { ap_id: $.data.id } }
            - { call: "POST /api/appraisals", payload: { property_id: "${p_id}", appraiser_id: "${ap_id}", effective_date: "2026-06-01", appraised_value: 380000.00, expected_property_version: "${p_v}" }, as: Appraiser, as_user_id: "${ap_id}", captures: { a_id: $.data.id } }
            - { call: "POST /api/appraisals/${a_id}/submit", payload: {}, as: Appraiser, as_user_id: "${ap_id}" }
          trigger:
            - { call: "POST /api/appraisals/${a_id}/certify", payload: {}, as: ChiefAppraiser, as_user_id: "chief-appraiser-1" }
            - { call: "GET /api/oreo-properties/${p_id}", payload: {}, as: OREOAdmin }
            - { call: "GET /api/write-downs", payload: { property_id: "${p_id}" }, as: OREOAdmin }
          assert:
            - "Property.${p_id}.fair_value_at_acquisition == 380000.00 (FINAL variant), not 400000.00 (PROVISIONAL)"
            - "Property.${p_id}.acquisition_basis == 349600.00, differing from the provisional 368000.00"
            - "Property.${p_id}.carrying_value == 349600.00"
            - "GET /api/write-downs?property_id=${p_id} returns exactly 1 row with status POSTED, amount 18400.00, reason MEASUREMENT_PERIOD_ADJUSTMENT, auto_generated true"
            - "GET /api/ledger-entries?property_id=${p_id} contains a WRITE_DOWN entry with amount -18400.00"

      - name: gain_recognition_cash_vs_installment
        grounds:
          - calculations.net_proceeds_and_gain_loss
          - entities.ClosingStatement.fields.recognized_gain_at_settlement
          - state_machines.ClosingStatement.DRAFT_to_SETTLED
        distinguishing_aspect: |
          Entity domain = ClosingStatement sale accounting (different from
          instance 1's property acquisition domain). Two sales with identical
          economics (price 450000.00, carrying 368000.00, gain_loss 52500.00)
          recognize different amounts at settlement: CASH recognizes 52500.00
          in full; SELLER_FINANCED recognizes only round(90000.00 *
          52500.00/450000.00, 2) = 10500.00 and defers 42000.00.
        test_recipe:
          setup:
            - "Global approval tiers configured (T1 [0,250000) OREOSpecialist, T2 [250000,750000) CreditOfficer, T3 [750000,null) OREOCommittee)"
            - "Property X marketed with a CASH offer of 450000.00 UNDER_REVIEW (net_proceeds 420500.00 -> tier 2)"
            - "Property Y marketed with a SELLER_FINANCED offer of 450000.00, down_payment 90000.00, UNDER_REVIEW"
          setup_api_calls:
            - { call: "POST /api/approval-tiers", payload: { name: "T1", min_net_proceeds: 0.00, max_net_proceeds: 250000.00, required_role: "OREOSpecialist" }, as: OREOAdmin }
            - { call: "POST /api/approval-tiers", payload: { name: "T2", min_net_proceeds: 250000.00, max_net_proceeds: 750000.00, required_role: "CreditOfficer" }, as: OREOAdmin }
            - { call: "POST /api/approval-tiers", payload: { name: "T3", min_net_proceeds: 750000.00, required_role: "OREOCommittee" }, as: OREOAdmin }
            - { call: "POST /api/oreo-properties", payload: { address: "10 Oak Ave", state_code: "CA", county: "Alameda", property_type: "RESIDENTIAL", acquisition_date: "2026-05-10", bpo_value: 400000.00, foreclosure_debt: 410000.00 }, as: OREOAdmin, captures: { px_id: $.data.id, px_v: $.data.version } }
            - { call: "POST /api/_clock/set_current_utc", payload: { to_iso8601: "2026-06-01T00:00:00Z" }, as: OREOAdmin }
            - { call: "POST /api/appraisers", payload: { name: "Apex Valuations", license_number: "LIC-A1", coverage_states: ["CA"], fee_flat: 750.00 }, as: OREOAdmin, captures: { ap_id: $.data.id } }
            - { call: "POST /api/appraisals", payload: { property_id: "${px_id}", appraiser_id: "${ap_id}", effective_date: "2026-06-01", appraised_value: 400000.00, expected_property_version: "${px_v}" }, as: Appraiser, as_user_id: "${ap_id}", captures: { ax_id: $.data.id } }
            - { call: "POST /api/appraisals/${ax_id}/submit", payload: {}, as: Appraiser, as_user_id: "${ap_id}" }
            - { call: "POST /api/appraisals/${ax_id}/certify", payload: {}, as: ChiefAppraiser, as_user_id: "chief-appraiser-1" }
            - { call: "POST /api/brokers", payload: { name: "Bay Brokers", license_number: "LIC-B1", coverage_states: ["CA"] }, as: OREOAdmin, captures: { b_id: $.data.id } }
            - { call: "POST /api/listing-agreements", payload: { property_id: "${px_id}", broker_id: "${b_id}", start_date: "2026-06-05", end_date: "2026-12-05", listing_price: 450000.00 }, as: PropertyManager, captures: { lx_id: $.data.id } }
            - { call: "POST /api/listing-agreements/${lx_id}/activate", payload: {}, as: OREOSpecialist }
            - { call: "GET /api/oreo-properties/${px_id}", payload: {}, as: OREOAdmin, captures: { px_v2: $.data.version } }
            - { call: "POST /api/offers", payload: { property_id: "${px_id}", listing_agreement_id: "${lx_id}", buyer_name: "Buyer Cash", offer_price: 450000.00, financing_type: "CASH", earnest_money: 5000.00, expected_property_version: "${px_v2}" }, as: OREOSpecialist, captures: { ox_id: $.data.id } }
            - { call: "POST /api/offers/${ox_id}/submit-review", payload: {}, as: OREOSpecialist }
            - { call: "POST /api/offers/${ox_id}/accept", payload: {}, as: CreditOfficer }
            - { call: "POST /api/oreo-properties", payload: { address: "22 Pine Rd", state_code: "CA", county: "Alameda", property_type: "RESIDENTIAL", acquisition_date: "2026-05-10", bpo_value: 400000.00, foreclosure_debt: 410000.00 }, as: OREOAdmin, captures: { py_id: $.data.id, py_v: $.data.version } }
            - { call: "POST /api/appraisals", payload: { property_id: "${py_id}", appraiser_id: "${ap_id}", effective_date: "2026-06-01", appraised_value: 400000.00, expected_property_version: "${py_v}" }, as: Appraiser, as_user_id: "${ap_id}", captures: { ay_id: $.data.id } }
            - { call: "POST /api/appraisals/${ay_id}/submit", payload: {}, as: Appraiser, as_user_id: "${ap_id}" }
            - { call: "POST /api/appraisals/${ay_id}/certify", payload: {}, as: ChiefAppraiser, as_user_id: "chief-appraiser-1" }
            - { call: "POST /api/listing-agreements", payload: { property_id: "${py_id}", broker_id: "${b_id}", start_date: "2026-06-05", end_date: "2026-12-05", listing_price: 450000.00 }, as: PropertyManager, captures: { ly_id: $.data.id } }
            - { call: "POST /api/listing-agreements/${ly_id}/activate", payload: {}, as: OREOSpecialist }
            - { call: "GET /api/oreo-properties/${py_id}", payload: {}, as: OREOAdmin, captures: { py_v2: $.data.version } }
            - { call: "POST /api/offers", payload: { property_id: "${py_id}", listing_agreement_id: "${ly_id}", buyer_name: "Buyer Terms", offer_price: 450000.00, financing_type: "SELLER_FINANCED", down_payment: 90000.00, earnest_money: 5000.00, expected_property_version: "${py_v2}" }, as: OREOSpecialist, captures: { oy_id: $.data.id } }
            - { call: "POST /api/offers/${oy_id}/submit-review", payload: {}, as: OREOSpecialist }
            - { call: "POST /api/offers/${oy_id}/accept", payload: {}, as: CreditOfficer }
          trigger:
            - { call: "POST /api/closing-statements", payload: { offer_id: "${ox_id}", closing_date: "2026-08-01" }, as: OREOSpecialist, captures: { cx_id: $.data.id } }
            - { call: "POST /api/closing-statements/${cx_id}/settle", payload: {}, as: CreditOfficer }
            - { call: "POST /api/closing-statements", payload: { offer_id: "${oy_id}", closing_date: "2026-08-01" }, as: OREOSpecialist, captures: { cy_id: $.data.id } }
            - { call: "POST /api/closing-statements/${cy_id}/settle", payload: {}, as: CreditOfficer }
            - { call: "GET /api/oreo-properties/${px_id}/summary", payload: {}, as: OREOAdmin }
            - { call: "GET /api/oreo-properties/${py_id}/summary", payload: {}, as: OREOAdmin }
          assert:
            - "ClosingStatement.${cx_id}.gain_loss == 52500.00 and ClosingStatement.${cy_id}.gain_loss == 52500.00 (identical economics)"
            - "ClosingStatement.${cx_id}.recognized_gain_at_settlement == 52500.00 and deferred_gain == 0.00 (CASH variant)"
            - "ClosingStatement.${cy_id}.recognized_gain_at_settlement == 10500.00 and deferred_gain == 42000.00 (SELLER_FINANCED installment variant)"
            - "Summary of ${px_id}.recognized_gain_loss_total == 52500.00; summary of ${py_id}.recognized_gain_loss_total == 10500.00"

  # =====================================================================
  # Rule 2 — combinatorial_formula (different modes)
  # =====================================================================
  - rule_id: combinatorial_formula
    instances:
      - name: tiered_commission_property_type_and_financing_overrides
        grounds:
          - calculations.broker_commission_tiered
          - entities.ClosingStatement.fields.commission_total
        distinguishing_aspect: |
          Mode (a): >=3 inputs (current_price, property_type, financing_type)
          with non-linear interaction (tier selection, +1pp LAND surcharge per
          tier, nested min() against the SELLER_FINANCED 6% cap). A LAND
          SELLER_FINANCED 400000.00 contract yields min(400000*0.07,
          400000*0.06) = 24000.00 — neither the naive residential tier
          (24000.00 by coincidence of the cap) nor the uncapped land tier
          (28000.00) describes the rule; the cap branch must be selected.
        test_recipe:
          setup:
            - "Approval tiers configured"
            - "LAND property (basis 276000.00 from bpo 300000.00) marketed with a 400000.00 SELLER_FINANCED offer UNDER_REVIEW"
          setup_api_calls:
            - { call: "POST /api/approval-tiers", payload: { name: "T1", min_net_proceeds: 0.00, max_net_proceeds: 250000.00, required_role: "OREOSpecialist" }, as: OREOAdmin }
            - { call: "POST /api/approval-tiers", payload: { name: "T2", min_net_proceeds: 250000.00, max_net_proceeds: 750000.00, required_role: "CreditOfficer" }, as: OREOAdmin }
            - { call: "POST /api/approval-tiers", payload: { name: "T3", min_net_proceeds: 750000.00, required_role: "OREOCommittee" }, as: OREOAdmin }
            - { call: "POST /api/oreo-properties", payload: { address: "Lot 7 Desert View", state_code: "CA", county: "Kern", property_type: "LAND", acquisition_date: "2026-05-10", bpo_value: 300000.00, foreclosure_debt: 295000.00 }, as: OREOAdmin, captures: { p_id: $.data.id, p_v: $.data.version } }
            - { call: "POST /api/_clock/set_current_utc", payload: { to_iso8601: "2026-06-01T00:00:00Z" }, as: OREOAdmin }
            - { call: "POST /api/appraisers", payload: { name: "Apex Valuations", license_number: "LIC-A1", coverage_states: ["CA"], fee_flat: 750.00 }, as: OREOAdmin, captures: { ap_id: $.data.id } }
            - { call: "POST /api/appraisals", payload: { property_id: "${p_id}", appraiser_id: "${ap_id}", effective_date: "2026-06-01", appraised_value: 300000.00, expected_property_version: "${p_v}" }, as: Appraiser, as_user_id: "${ap_id}", captures: { a_id: $.data.id } }
            - { call: "POST /api/appraisals/${a_id}/submit", payload: {}, as: Appraiser, as_user_id: "${ap_id}" }
            - { call: "POST /api/appraisals/${a_id}/certify", payload: {}, as: ChiefAppraiser, as_user_id: "chief-appraiser-1" }
            - { call: "POST /api/brokers", payload: { name: "Bay Brokers", license_number: "LIC-B1", coverage_states: ["CA"] }, as: OREOAdmin, captures: { b_id: $.data.id } }
            - { call: "POST /api/listing-agreements", payload: { property_id: "${p_id}", broker_id: "${b_id}", start_date: "2026-06-05", end_date: "2026-12-05", listing_price: 400000.00 }, as: PropertyManager, captures: { l_id: $.data.id } }
            - { call: "POST /api/listing-agreements/${l_id}/activate", payload: {}, as: OREOSpecialist }
            - { call: "GET /api/oreo-properties/${p_id}", payload: {}, as: OREOAdmin, captures: { p_v2: $.data.version } }
            - { call: "POST /api/offers", payload: { property_id: "${p_id}", listing_agreement_id: "${l_id}", buyer_name: "Land Buyer", offer_price: 400000.00, financing_type: "SELLER_FINANCED", down_payment: 100000.00, earnest_money: 5000.00, expected_property_version: "${p_v2}" }, as: OREOSpecialist, captures: { o_id: $.data.id } }
            - { call: "POST /api/offers/${o_id}/submit-review", payload: {}, as: OREOSpecialist }
            - { call: "POST /api/offers/${o_id}/accept", payload: {}, as: CreditOfficer }
          trigger:
            - { call: "POST /api/closing-statements", payload: { offer_id: "${o_id}", closing_date: "2026-08-01" }, as: OREOSpecialist, captures: { c_id: $.data.id } }
          assert:
            - "ClosingStatement.${c_id}.commission_total == 24000.00 (min(28000.00 LAND-surcharged tiered, 24000.00 SF cap))"
            - "ClosingStatement.${c_id}.net_proceeds == 373500.00"
            - "ClosingStatement.${c_id}.gain_loss == 97500.00 against carrying 276000.00"
            - "ClosingStatement.${c_id}.recognized_gain_at_settlement == 24375.00 (installment variant on top of the capped commission)"

      - name: commission_split_rounding_order_pinned
        grounds:
          - calculations.commission_split
          - entities.ClosingStatement.fields.listing_broker_share
          - entities.ClosingStatement.fields.selling_broker_share
        distinguishing_aspect: |
          Mode (b): nested rounding order is pinned (round the total, then the
          listing share half-up, then selling = remainder). At contract
          1200001.00 the total is 61000.03 and the pinned order yields
          listing 30500.02 / selling 30500.01; the forbidden split-then-round
          order would yield 30500.02 / 30500.02 and a 1-cent drift.
        test_recipe:
          setup:
            - "Approval tiers configured"
            - "RESIDENTIAL property (basis 1196000.00 from bpo 1300000.00) marketed with a 1200001.00 CASH offer UNDER_REVIEW (net_proceeds 1136500.97 -> tier 3, accepted by OREOCommittee)"
          setup_api_calls:
            - { call: "POST /api/approval-tiers", payload: { name: "T1", min_net_proceeds: 0.00, max_net_proceeds: 250000.00, required_role: "OREOSpecialist" }, as: OREOAdmin }
            - { call: "POST /api/approval-tiers", payload: { name: "T2", min_net_proceeds: 250000.00, max_net_proceeds: 750000.00, required_role: "CreditOfficer" }, as: OREOAdmin }
            - { call: "POST /api/approval-tiers", payload: { name: "T3", min_net_proceeds: 750000.00, required_role: "OREOCommittee" }, as: OREOAdmin }
            - { call: "POST /api/oreo-properties", payload: { address: "900 Hillcrest Dr", state_code: "CA", county: "Marin", property_type: "RESIDENTIAL", acquisition_date: "2026-05-10", bpo_value: 1300000.00, foreclosure_debt: 1250000.00 }, as: OREOAdmin, captures: { p_id: $.data.id, p_v: $.data.version } }
            - { call: "POST /api/_clock/set_current_utc", payload: { to_iso8601: "2026-06-01T00:00:00Z" }, as: OREOAdmin }
            - { call: "POST /api/appraisers", payload: { name: "Apex Valuations", license_number: "LIC-A1", coverage_states: ["CA"], fee_flat: 750.00 }, as: OREOAdmin, captures: { ap_id: $.data.id } }
            - { call: "POST /api/appraisals", payload: { property_id: "${p_id}", appraiser_id: "${ap_id}", effective_date: "2026-06-01", appraised_value: 1300000.00, expected_property_version: "${p_v}" }, as: Appraiser, as_user_id: "${ap_id}", captures: { a_id: $.data.id } }
            - { call: "POST /api/appraisals/${a_id}/submit", payload: {}, as: Appraiser, as_user_id: "${ap_id}" }
            - { call: "POST /api/appraisals/${a_id}/certify", payload: {}, as: ChiefAppraiser, as_user_id: "chief-appraiser-1" }
            - { call: "POST /api/brokers", payload: { name: "Bay Brokers", license_number: "LIC-B1", coverage_states: ["CA"] }, as: OREOAdmin, captures: { b_id: $.data.id } }
            - { call: "POST /api/listing-agreements", payload: { property_id: "${p_id}", broker_id: "${b_id}", start_date: "2026-06-05", end_date: "2026-12-05", listing_price: 1300000.00 }, as: PropertyManager, captures: { l_id: $.data.id } }
            - { call: "POST /api/listing-agreements/${l_id}/activate", payload: {}, as: OREOSpecialist }
            - { call: "GET /api/oreo-properties/${p_id}", payload: {}, as: OREOAdmin, captures: { p_v2: $.data.version } }
            - { call: "POST /api/offers", payload: { property_id: "${p_id}", listing_agreement_id: "${l_id}", buyer_name: "Big Buyer", offer_price: 1200001.00, financing_type: "CASH", earnest_money: 25000.00, expected_property_version: "${p_v2}" }, as: OREOSpecialist, captures: { o_id: $.data.id } }
            - { call: "POST /api/offers/${o_id}/submit-review", payload: {}, as: OREOSpecialist }
            - { call: "POST /api/offers/${o_id}/accept", payload: {}, as: OREOCommittee }
          trigger:
            - { call: "POST /api/closing-statements", payload: { offer_id: "${o_id}", closing_date: "2026-08-01" }, as: OREOSpecialist, captures: { c_id: $.data.id } }
          assert:
            - "ClosingStatement.${c_id}.commission_total == 61000.03"
            - "ClosingStatement.${c_id}.listing_broker_share == 30500.02"
            - "ClosingStatement.${c_id}.selling_broker_share == 30500.01"
            - "listing_broker_share + selling_broker_share == commission_total (61000.03) — the remainder absorbs the odd cent"

  # =====================================================================
  # Rule 3 — non_linear_state_machine (different entities)
  # =====================================================================
  - rule_id: non_linear_state_machine
    instances:
      - name: offer_counter_cycle_reopens_review
        grounds:
          - state_machines.Offer.UNDER_REVIEW_to_COUNTERED
          - state_machines.Offer.COUNTERED_to_UNDER_REVIEW
          - entities.Offer.fields.counter_round
        distinguishing_aspect: |
          Entity = Offer. The machine contains a true negotiation cycle
          (UNDER_REVIEW -> COUNTERED -> UNDER_REVIEW) that can repeat; after
          two full loops counter_round == 2, current_price tracks the latest
          counter (448000.00), and the offer is still legally acceptable.
        test_recipe:
          setup:
            - "Approval tiers configured; marketed property; offer of 440000.00 UNDER_REVIEW"
          setup_api_calls:
            - { call: "POST /api/approval-tiers", payload: { name: "T1", min_net_proceeds: 0.00, max_net_proceeds: 250000.00, required_role: "OREOSpecialist" }, as: OREOAdmin }
            - { call: "POST /api/approval-tiers", payload: { name: "T2", min_net_proceeds: 250000.00, max_net_proceeds: 750000.00, required_role: "CreditOfficer" }, as: OREOAdmin }
            - { call: "POST /api/approval-tiers", payload: { name: "T3", min_net_proceeds: 750000.00, required_role: "OREOCommittee" }, as: OREOAdmin }
            - { call: "POST /api/oreo-properties", payload: { address: "1420 Maple St", state_code: "CA", county: "Alameda", property_type: "RESIDENTIAL", acquisition_date: "2026-05-10", bpo_value: 400000.00, foreclosure_debt: 410000.00 }, as: OREOAdmin, captures: { p_id: $.data.id, p_v: $.data.version } }
            - { call: "POST /api/_clock/set_current_utc", payload: { to_iso8601: "2026-06-01T00:00:00Z" }, as: OREOAdmin }
            - { call: "POST /api/appraisers", payload: { name: "Apex Valuations", license_number: "LIC-A1", coverage_states: ["CA"], fee_flat: 750.00 }, as: OREOAdmin, captures: { ap_id: $.data.id } }
            - { call: "POST /api/appraisals", payload: { property_id: "${p_id}", appraiser_id: "${ap_id}", effective_date: "2026-06-01", appraised_value: 400000.00, expected_property_version: "${p_v}" }, as: Appraiser, as_user_id: "${ap_id}", captures: { a_id: $.data.id } }
            - { call: "POST /api/appraisals/${a_id}/submit", payload: {}, as: Appraiser, as_user_id: "${ap_id}" }
            - { call: "POST /api/appraisals/${a_id}/certify", payload: {}, as: ChiefAppraiser, as_user_id: "chief-appraiser-1" }
            - { call: "POST /api/brokers", payload: { name: "Bay Brokers", license_number: "LIC-B1", coverage_states: ["CA"] }, as: OREOAdmin, captures: { b_id: $.data.id } }
            - { call: "POST /api/listing-agreements", payload: { property_id: "${p_id}", broker_id: "${b_id}", start_date: "2026-06-05", end_date: "2026-12-05", listing_price: 450000.00 }, as: PropertyManager, captures: { l_id: $.data.id } }
            - { call: "POST /api/listing-agreements/${l_id}/activate", payload: {}, as: OREOSpecialist }
            - { call: "GET /api/oreo-properties/${p_id}", payload: {}, as: OREOAdmin, captures: { p_v2: $.data.version } }
            - { call: "POST /api/offers", payload: { property_id: "${p_id}", listing_agreement_id: "${l_id}", buyer_name: "Buyer One", offer_price: 440000.00, financing_type: "CASH", earnest_money: 5000.00, expected_property_version: "${p_v2}" }, as: OREOSpecialist, captures: { o_id: $.data.id } }
            - { call: "POST /api/offers/${o_id}/submit-review", payload: {}, as: OREOSpecialist }
          trigger:
            - { call: "POST /api/offers/${o_id}/counter", payload: { counter_price: 445000.00 }, as: OREOSpecialist }
            - { call: "POST /api/offers/${o_id}/resume", payload: {}, as: OREOSpecialist }
            - { call: "POST /api/offers/${o_id}/counter", payload: { counter_price: 448000.00 }, as: OREOSpecialist }
            - { call: "POST /api/offers/${o_id}/resume", payload: {}, as: OREOSpecialist }
            - { call: "POST /api/offers/${o_id}/accept", payload: {}, as: CreditOfficer, captures: { o_status: $.data.status } }
          assert:
            - "After two counter/resume loops Offer.${o_id}.counter_round == 2"
            - "Offer.${o_id}.current_price == 448000.00 (latest counter wins, offer_price unchanged at 440000.00)"
            - "The final resume returns status UNDER_REVIEW (cycle re-opens review)"
            - "Accept succeeds from UNDER_REVIEW after the loops: status == ACCEPTED and property ${p_id} becomes UNDER_CONTRACT"

      - name: appraisal_rejection_revision_loop
        grounds:
          - state_machines.Appraisal.SUBMITTED_to_DRAFT
          - state_machines.Appraisal.DRAFT_to_SUBMITTED
        distinguishing_aspect: |
          Entity = Appraisal (different from instance 1's Offer). The
          SUBMITTED -> DRAFT rejection loop permits re-submission of the same
          appraisal row; the loop preserves the row identity and ends in a
          successful CERTIFIED terminal state with no write-down when value
          equals carrying basis.
        test_recipe:
          setup:
            - "Property created (basis 368000.00); clock 2026-06-01; appraiser registered; appraisal of 400000.00 effective 2026-06-01 created in DRAFT"
          setup_api_calls:
            - { call: "POST /api/oreo-properties", payload: { address: "1420 Maple St", state_code: "CA", county: "Alameda", property_type: "RESIDENTIAL", acquisition_date: "2026-05-10", bpo_value: 400000.00, foreclosure_debt: 410000.00 }, as: OREOAdmin, captures: { p_id: $.data.id, p_v: $.data.version } }
            - { call: "POST /api/_clock/set_current_utc", payload: { to_iso8601: "2026-06-01T00:00:00Z" }, as: OREOAdmin }
            - { call: "POST /api/appraisers", payload: { name: "Apex Valuations", license_number: "LIC-A1", coverage_states: ["CA"], fee_flat: 750.00 }, as: OREOAdmin, captures: { ap_id: $.data.id } }
            - { call: "POST /api/appraisals", payload: { property_id: "${p_id}", appraiser_id: "${ap_id}", effective_date: "2026-06-01", appraised_value: 400000.00, expected_property_version: "${p_v}" }, as: Appraiser, as_user_id: "${ap_id}", captures: { a_id: $.data.id } }
            - { call: "POST /api/appraisals/${a_id}/submit", payload: {}, as: Appraiser, as_user_id: "${ap_id}" }
          trigger:
            - { call: "POST /api/appraisals/${a_id}/reject", payload: { rejection_reason: "insufficient comparable sales" }, as: ChiefAppraiser, as_user_id: "chief-appraiser-1" }
            - { call: "POST /api/appraisals/${a_id}/submit", payload: {}, as: Appraiser, as_user_id: "${ap_id}" }
            - { call: "POST /api/appraisals/${a_id}/certify", payload: {}, as: ChiefAppraiser, as_user_id: "chief-appraiser-1" }
            - { call: "GET /api/oreo-properties/${p_id}", payload: {}, as: OREOAdmin }
            - { call: "GET /api/write-downs", payload: { property_id: "${p_id}" }, as: OREOAdmin }
          assert:
            - "Reject moves Appraisal.${a_id} to DRAFT with rejection_reason 'insufficient comparable sales'"
            - "The same appraisal row ${a_id} can be re-submitted (SUBMITTED) after rejection — the loop re-uses the row"
            - "Certify then succeeds: status CERTIFIED, current_fair_value == 400000.00, appraisal_status CURRENT"
            - "No WriteDown rows exist (NRV 368000.00 == carrying 368000.00; final-variant delta == 0 creates no measurement adjustment)"

  # =====================================================================
  # Rule 4 — transitive_cascade (different triggers, depth >= 3 and >= 2)
  # =====================================================================
  - rule_id: transitive_cascade
    instances:
      - name: appraisal_certification_fv_writedown_cascade
        grounds:
          - state_machines.Appraisal.SUBMITTED_to_CERTIFIED
          - calculations.write_down_evaluation
          - entities.OREOProperty.fields.pending_write_down_count
        distinguishing_aspect: |
          Trigger = POST /api/appraisals/{id}/certify. Depth-3 chain where each
          link is caused by the previous one: certification mutates
          property.current_fair_value (link 1); that value mutation runs
          write_down_evaluation which auto-creates a PROPOSED WriteDown of
          46000.00 (link 2); the new WriteDown row raises
          property.pending_write_down_count to 1 (link 3). Carrying value is
          NOT yet reduced (the proposal still needs committee approval).
        test_recipe:
          setup:
            - "Marketed property with certified 400000.00 appraisal (carrying 368000.00, appraisal CURRENT)"
            - "Clock advanced to 2026-12-10 so a second appraisal can carry effective_date 2026-12-10 (outside the 180-day measurement window ending 2026-11-06)"
          setup_api_calls:
            - { call: "POST /api/oreo-properties", payload: { address: "1420 Maple St", state_code: "CA", county: "Alameda", property_type: "RESIDENTIAL", acquisition_date: "2026-05-10", bpo_value: 400000.00, foreclosure_debt: 410000.00 }, as: OREOAdmin, captures: { p_id: $.data.id, p_v: $.data.version } }
            - { call: "POST /api/_clock/set_current_utc", payload: { to_iso8601: "2026-06-01T00:00:00Z" }, as: OREOAdmin }
            - { call: "POST /api/appraisers", payload: { name: "Apex Valuations", license_number: "LIC-A1", coverage_states: ["CA"], fee_flat: 750.00 }, as: OREOAdmin, captures: { ap_id: $.data.id } }
            - { call: "POST /api/appraisals", payload: { property_id: "${p_id}", appraiser_id: "${ap_id}", effective_date: "2026-06-01", appraised_value: 400000.00, expected_property_version: "${p_v}" }, as: Appraiser, as_user_id: "${ap_id}", captures: { a1_id: $.data.id } }
            - { call: "POST /api/appraisals/${a1_id}/submit", payload: {}, as: Appraiser, as_user_id: "${ap_id}" }
            - { call: "POST /api/appraisals/${a1_id}/certify", payload: {}, as: ChiefAppraiser, as_user_id: "chief-appraiser-1" }
            - { call: "POST /api/brokers", payload: { name: "Bay Brokers", license_number: "LIC-B1", coverage_states: ["CA"] }, as: OREOAdmin, captures: { b_id: $.data.id } }
            - { call: "POST /api/listing-agreements", payload: { property_id: "${p_id}", broker_id: "${b_id}", start_date: "2026-06-05", end_date: "2027-06-05", listing_price: 450000.00 }, as: PropertyManager, captures: { l_id: $.data.id } }
            - { call: "POST /api/listing-agreements/${l_id}/activate", payload: {}, as: OREOSpecialist }
            - { call: "POST /api/_clock/set_current_utc", payload: { to_iso8601: "2026-12-10T00:00:00Z" }, as: OREOAdmin }
            - { call: "GET /api/oreo-properties/${p_id}", payload: {}, as: OREOAdmin, captures: { p_v2: $.data.version } }
            - { call: "POST /api/appraisals", payload: { property_id: "${p_id}", appraiser_id: "${ap_id}", effective_date: "2026-12-10", appraised_value: 350000.00, expected_property_version: "${p_v2}" }, as: Appraiser, as_user_id: "${ap_id}", captures: { a2_id: $.data.id } }
            - { call: "POST /api/appraisals/${a2_id}/submit", payload: {}, as: Appraiser, as_user_id: "${ap_id}" }
          trigger:
            - { call: "POST /api/appraisals/${a2_id}/certify", payload: {}, as: ChiefAppraiser, as_user_id: "chief-appraiser-1" }
            - { call: "GET /api/oreo-properties/${p_id}", payload: {}, as: OREOAdmin }
            - { call: "GET /api/write-downs", payload: { property_id: "${p_id}" }, as: OREOAdmin }
          assert:
            - "Property.${p_id}.current_fair_value == 350000.00 (link 1: certification mutated the property)"
            - "Property.${p_id}.net_realizable_value == 322000.00"
            - "GET /api/write-downs?property_id=${p_id} returns exactly 1 row: status PROPOSED, amount 46000.00, reason MARKET_DECLINE, auto_generated true (link 2)"
            - "Property.${p_id}.pending_write_down_count == 1 (link 3)"
            - "Property.${p_id}.carrying_value == 368000.00 (proposal is not yet posted)"

      - name: clock_crossing_deadline_chargeoff_cascade
        grounds:
          - state_machines.OREOProperty.MARKETED_to_CHARGED_OFF
          - calculations.holding_period_compliance
          - entities.LedgerEntry.fields.entry_type
        distinguishing_aspect: |
          Trigger = POST /api/_clock/set_current_utc (different from instance
          1's appraisal certification). Depth-3 chain: the sweep flips the
          property to CHARGED_OFF (link 1); the charge-off itself auto-posts a
          full-balance WriteDown of 368000.00 with reason REGULATORY_CHARGE_OFF
          (link 2); that WriteDown posting appends the CHARGE_OFF LedgerEntry of
          -368000.00 and zeroes carrying_value (link 3). Fan-out (not counted
          as chain links): ACTIVE listing TERMINATED/CHARGE_OFF and pending
          offer REJECTED/PROPERTY_CHARGED_OFF.
        test_recipe:
          setup:
            - "Marketed property (acquisition 2026-05-10, deadline 2031-05-09, carrying 368000.00) with an ACTIVE listing ending 2032-06-05 and an offer UNDER_REVIEW"
          setup_api_calls:
            - { call: "POST /api/approval-tiers", payload: { name: "T1", min_net_proceeds: 0.00, max_net_proceeds: 250000.00, required_role: "OREOSpecialist" }, as: OREOAdmin }
            - { call: "POST /api/approval-tiers", payload: { name: "T2", min_net_proceeds: 250000.00, max_net_proceeds: 750000.00, required_role: "CreditOfficer" }, as: OREOAdmin }
            - { call: "POST /api/approval-tiers", payload: { name: "T3", min_net_proceeds: 750000.00, required_role: "OREOCommittee" }, as: OREOAdmin }
            - { call: "POST /api/oreo-properties", payload: { address: "1420 Maple St", state_code: "CA", county: "Alameda", property_type: "RESIDENTIAL", acquisition_date: "2026-05-10", bpo_value: 400000.00, foreclosure_debt: 410000.00 }, as: OREOAdmin, captures: { p_id: $.data.id, p_v: $.data.version } }
            - { call: "POST /api/_clock/set_current_utc", payload: { to_iso8601: "2026-06-01T00:00:00Z" }, as: OREOAdmin }
            - { call: "POST /api/appraisers", payload: { name: "Apex Valuations", license_number: "LIC-A1", coverage_states: ["CA"], fee_flat: 750.00 }, as: OREOAdmin, captures: { ap_id: $.data.id } }
            - { call: "POST /api/appraisals", payload: { property_id: "${p_id}", appraiser_id: "${ap_id}", effective_date: "2026-06-01", appraised_value: 400000.00, expected_property_version: "${p_v}" }, as: Appraiser, as_user_id: "${ap_id}", captures: { a_id: $.data.id } }
            - { call: "POST /api/appraisals/${a_id}/submit", payload: {}, as: Appraiser, as_user_id: "${ap_id}" }
            - { call: "POST /api/appraisals/${a_id}/certify", payload: {}, as: ChiefAppraiser, as_user_id: "chief-appraiser-1" }
            - { call: "POST /api/brokers", payload: { name: "Bay Brokers", license_number: "LIC-B1", coverage_states: ["CA"] }, as: OREOAdmin, captures: { b_id: $.data.id } }
            - { call: "POST /api/listing-agreements", payload: { property_id: "${p_id}", broker_id: "${b_id}", start_date: "2026-06-05", end_date: "2032-06-05", listing_price: 450000.00 }, as: PropertyManager, captures: { l_id: $.data.id } }
            - { call: "POST /api/listing-agreements/${l_id}/activate", payload: {}, as: OREOSpecialist }
            - { call: "GET /api/oreo-properties/${p_id}", payload: {}, as: OREOAdmin, captures: { p_v2: $.data.version } }
            - { call: "POST /api/offers", payload: { property_id: "${p_id}", listing_agreement_id: "${l_id}", buyer_name: "Buyer One", offer_price: 450000.00, financing_type: "CASH", earnest_money: 5000.00, expected_property_version: "${p_v2}" }, as: OREOSpecialist, captures: { o_id: $.data.id } }
            - { call: "POST /api/offers/${o_id}/submit-review", payload: {}, as: OREOSpecialist }
          trigger:
            - { call: "POST /api/_clock/set_current_utc", payload: { to_iso8601: "2031-05-10T00:00:00Z" }, as: OREOAdmin }
            - { call: "GET /api/oreo-properties/${p_id}", payload: {}, as: OREOAdmin }
            - { call: "GET /api/write-downs", payload: { property_id: "${p_id}" }, as: OREOAdmin }
            - { call: "GET /api/ledger-entries", payload: { property_id: "${p_id}" }, as: OREOAdmin }
            - { call: "GET /api/listing-agreements/${l_id}", payload: {}, as: OREOAdmin }
            - { call: "GET /api/offers/${o_id}", payload: {}, as: OREOAdmin }
          assert:
            - "Property.${p_id}.lifecycle_status == CHARGED_OFF (link 1: clock 2031-05-10 > deadline 2031-05-09)"
            - "A WriteDown with status POSTED, amount 368000.00, reason REGULATORY_CHARGE_OFF, auto_generated true exists (link 2)"
            - "Ledger contains CHARGE_OFF entry with amount -368000.00 and property.carrying_value == 0.00 (link 3)"
            - "ListingAgreement.${l_id}.status == TERMINATED with termination_reason CHARGE_OFF (fan-out)"
            - "Offer.${o_id}.status == REJECTED with rejection_reason PROPERTY_CHARGED_OFF (fan-out)"

  # =====================================================================
  # Rule 5 — priority_pair_validation_conflict (different category pairs)
  # =====================================================================
  - rule_id: priority_pair_validation_conflict
    instances:
      - name: state_vs_fiscal_on_chargedoff_lowball_accept
        grounds:
          - "validations[priority=6]"
          - "validations[priority=11]"
          - "errors[ERR_OFFER_NOT_REVIEWABLE]"
          - "errors[ERR_BELOW_MIN_PROCEEDS]"
        distinguishing_aspect: |
          Category pair = state (priority 6) vs business_fiscal (priority 11).
          The accept request violates both — the offer was cascade-REJECTED by
          the charge-off (state) AND its net_proceeds is -620.00 (fiscal) —
          and the state error ERR_OFFER_NOT_REVIEWABLE must win.
        test_recipe:
          setup:
            - "Approval tiers configured; marketed property with a 2000.00 CASH offer UNDER_REVIEW (projected net_proceeds -620.00)"
            - "Clock advanced to 2031-05-10, charging the property off and cascade-rejecting the offer"
          setup_api_calls:
            - { call: "POST /api/approval-tiers", payload: { name: "T1", min_net_proceeds: 0.00, max_net_proceeds: 250000.00, required_role: "OREOSpecialist" }, as: OREOAdmin }
            - { call: "POST /api/approval-tiers", payload: { name: "T2", min_net_proceeds: 250000.00, max_net_proceeds: 750000.00, required_role: "CreditOfficer" }, as: OREOAdmin }
            - { call: "POST /api/approval-tiers", payload: { name: "T3", min_net_proceeds: 750000.00, required_role: "OREOCommittee" }, as: OREOAdmin }
            - { call: "POST /api/oreo-properties", payload: { address: "1420 Maple St", state_code: "CA", county: "Alameda", property_type: "RESIDENTIAL", acquisition_date: "2026-05-10", bpo_value: 400000.00, foreclosure_debt: 410000.00 }, as: OREOAdmin, captures: { p_id: $.data.id, p_v: $.data.version } }
            - { call: "POST /api/_clock/set_current_utc", payload: { to_iso8601: "2026-06-01T00:00:00Z" }, as: OREOAdmin }
            - { call: "POST /api/appraisers", payload: { name: "Apex Valuations", license_number: "LIC-A1", coverage_states: ["CA"], fee_flat: 750.00 }, as: OREOAdmin, captures: { ap_id: $.data.id } }
            - { call: "POST /api/appraisals", payload: { property_id: "${p_id}", appraiser_id: "${ap_id}", effective_date: "2026-06-01", appraised_value: 400000.00, expected_property_version: "${p_v}" }, as: Appraiser, as_user_id: "${ap_id}", captures: { a_id: $.data.id } }
            - { call: "POST /api/appraisals/${a_id}/submit", payload: {}, as: Appraiser, as_user_id: "${ap_id}" }
            - { call: "POST /api/appraisals/${a_id}/certify", payload: {}, as: ChiefAppraiser, as_user_id: "chief-appraiser-1" }
            - { call: "POST /api/brokers", payload: { name: "Bay Brokers", license_number: "LIC-B1", coverage_states: ["CA"] }, as: OREOAdmin, captures: { b_id: $.data.id } }
            - { call: "POST /api/listing-agreements", payload: { property_id: "${p_id}", broker_id: "${b_id}", start_date: "2026-06-05", end_date: "2032-06-05", listing_price: 450000.00 }, as: PropertyManager, captures: { l_id: $.data.id } }
            - { call: "POST /api/listing-agreements/${l_id}/activate", payload: {}, as: OREOSpecialist }
            - { call: "GET /api/oreo-properties/${p_id}", payload: {}, as: OREOAdmin, captures: { p_v2: $.data.version } }
            - { call: "POST /api/offers", payload: { property_id: "${p_id}", listing_agreement_id: "${l_id}", buyer_name: "Lowball LLC", offer_price: 2000.00, financing_type: "CASH", earnest_money: 100.00, expected_property_version: "${p_v2}" }, as: OREOSpecialist, captures: { o_id: $.data.id } }
            - { call: "POST /api/offers/${o_id}/submit-review", payload: {}, as: OREOSpecialist }
            - { call: "POST /api/_clock/set_current_utc", payload: { to_iso8601: "2031-05-10T00:00:00Z" }, as: OREOAdmin }
          trigger:
            - { call: "POST /api/offers/${o_id}/accept", payload: {}, as: CreditOfficer, captures: { err: $.data.error_id } }
          assert:
            - "err == ERR_OFFER_NOT_REVIEWABLE (HTTP 409): the priority-6 state failure wins over the priority-11 fiscal failure (net_proceeds -620.00 would also raise ERR_BELOW_MIN_PROCEEDS)"
            - "Property.${p_id}.lifecycle_status == CHARGED_OFF and Offer.${o_id}.status == REJECTED (cascade already applied)"

      - name: safety_vs_temporal_on_closing_create
        grounds:
          - "validations[priority=7]"
          - "validations[priority=8]"
          - "errors[ERR_ENVIRONMENTAL_ISSUE_OPEN]"
          - "errors[ERR_CLOSING_BEYOND_DEADLINE]"
        distinguishing_aspect: |
          Category pair = business_safety (priority 7) vs business_temporal
          (priority 8) — a different pair from instance 1. The closing request
          violates both (OPEN environmental issue AND closing_date 2031-06-01
          beyond deadline 2031-05-09) and the safety error
          ERR_ENVIRONMENTAL_ISSUE_OPEN must win.
        test_recipe:
          setup:
            - "Approval tiers configured; property UNDER_CONTRACT via an accepted 450000.00 CASH offer"
            - "An ENVIRONMENTAL IssueCase is OPEN on the property"
            - "Clock at 2031-05-01 (<= deadline 2031-05-09, so no charge-off; appraisal OVERDUE is irrelevant to closing)"
          setup_api_calls:
            - { call: "POST /api/approval-tiers", payload: { name: "T1", min_net_proceeds: 0.00, max_net_proceeds: 250000.00, required_role: "OREOSpecialist" }, as: OREOAdmin }
            - { call: "POST /api/approval-tiers", payload: { name: "T2", min_net_proceeds: 250000.00, max_net_proceeds: 750000.00, required_role: "CreditOfficer" }, as: OREOAdmin }
            - { call: "POST /api/approval-tiers", payload: { name: "T3", min_net_proceeds: 750000.00, required_role: "OREOCommittee" }, as: OREOAdmin }
            - { call: "POST /api/oreo-properties", payload: { address: "1420 Maple St", state_code: "CA", county: "Alameda", property_type: "RESIDENTIAL", acquisition_date: "2026-05-10", bpo_value: 400000.00, foreclosure_debt: 410000.00 }, as: OREOAdmin, captures: { p_id: $.data.id, p_v: $.data.version } }
            - { call: "POST /api/_clock/set_current_utc", payload: { to_iso8601: "2026-06-01T00:00:00Z" }, as: OREOAdmin }
            - { call: "POST /api/appraisers", payload: { name: "Apex Valuations", license_number: "LIC-A1", coverage_states: ["CA"], fee_flat: 750.00 }, as: OREOAdmin, captures: { ap_id: $.data.id } }
            - { call: "POST /api/appraisals", payload: { property_id: "${p_id}", appraiser_id: "${ap_id}", effective_date: "2026-06-01", appraised_value: 400000.00, expected_property_version: "${p_v}" }, as: Appraiser, as_user_id: "${ap_id}", captures: { a_id: $.data.id } }
            - { call: "POST /api/appraisals/${a_id}/submit", payload: {}, as: Appraiser, as_user_id: "${ap_id}" }
            - { call: "POST /api/appraisals/${a_id}/certify", payload: {}, as: ChiefAppraiser, as_user_id: "chief-appraiser-1" }
            - { call: "POST /api/brokers", payload: { name: "Bay Brokers", license_number: "LIC-B1", coverage_states: ["CA"] }, as: OREOAdmin, captures: { b_id: $.data.id } }
            - { call: "POST /api/listing-agreements", payload: { property_id: "${p_id}", broker_id: "${b_id}", start_date: "2026-06-05", end_date: "2032-06-05", listing_price: 450000.00 }, as: PropertyManager, captures: { l_id: $.data.id } }
            - { call: "POST /api/listing-agreements/${l_id}/activate", payload: {}, as: OREOSpecialist }
            - { call: "GET /api/oreo-properties/${p_id}", payload: {}, as: OREOAdmin, captures: { p_v2: $.data.version } }
            - { call: "POST /api/offers", payload: { property_id: "${p_id}", listing_agreement_id: "${l_id}", buyer_name: "Buyer One", offer_price: 450000.00, financing_type: "CASH", earnest_money: 5000.00, expected_property_version: "${p_v2}" }, as: OREOSpecialist, captures: { o_id: $.data.id } }
            - { call: "POST /api/offers/${o_id}/submit-review", payload: {}, as: OREOSpecialist }
            - { call: "POST /api/offers/${o_id}/accept", payload: {}, as: CreditOfficer }
            - { call: "POST /api/issues", payload: { property_id: "${p_id}", issue_type: "ENVIRONMENTAL", severity: "HIGH", description: "Underground storage tank" }, as: PropertyManager, captures: { i_id: $.data.id } }
            - { call: "POST /api/_clock/set_current_utc", payload: { to_iso8601: "2031-05-01T00:00:00Z" }, as: OREOAdmin }
          trigger:
            - { call: "POST /api/closing-statements", payload: { offer_id: "${o_id}", closing_date: "2031-06-01" }, as: OREOSpecialist, captures: { err: $.data.error_id } }
          assert:
            - "err == ERR_ENVIRONMENTAL_ISSUE_OPEN (HTTP 409): the priority-7 safety failure wins over the priority-8 temporal failure (closing_date 2031-06-01 > holding_deadline 2031-05-09 would also raise ERR_CLOSING_BEYOND_DEADLINE)"
            - "No ClosingStatement row is created for offer ${o_id}"

  # =====================================================================
  # Rule 6 — boundary_precision_check (different metrics, different endpoints)
  # =====================================================================
  - rule_id: boundary_precision_check
    instances:
      - name: holding_deadline_exact_day_compliance_boundary
        grounds:
          - calculations.holding_period_compliance
          - state_machines.OREOProperty.HELD_to_CHARGED_OFF
        distinguishing_aspect: |
          Metric = elapsed holding days against holding_deadline; endpoint =
          POST /api/_clock/set_current_utc. Violation is strictly-greater-than:
          clock == deadline (2031-05-09) leaves the property HELD, while
          deadline + 1 day (2031-05-10) charges it off.
        test_recipe:
          setup:
            - "Property acquired 2026-05-10 with no extension requests (holding_deadline 2031-05-09); lifecycle HELD"
          setup_api_calls:
            - { call: "POST /api/oreo-properties", payload: { address: "5 Cedar Ln", state_code: "CA", county: "Fresno", property_type: "RESIDENTIAL", acquisition_date: "2026-05-10", bpo_value: 400000.00, foreclosure_debt: 410000.00 }, as: OREOAdmin, captures: { p_id: $.data.id } }
          trigger:
            - { call: "POST /api/_clock/set_current_utc", payload: { to_iso8601: "2031-05-09T00:00:00Z" }, as: OREOAdmin }
            - { call: "GET /api/oreo-properties/${p_id}", payload: {}, as: OREOAdmin, captures: { st1: $.data.lifecycle_status } }
            - { call: "POST /api/_clock/set_current_utc", payload: { to_iso8601: "2031-05-10T00:00:00Z" }, as: OREOAdmin }
            - { call: "GET /api/oreo-properties/${p_id}", payload: {}, as: OREOAdmin, captures: { st2: $.data.lifecycle_status } }
          assert:
            - "st1 == HELD (clock exactly on holding_deadline is still compliant: violation requires clock > deadline)"
            - "st2 == CHARGED_OFF (one day past deadline triggers the auto charge-off)"

      - name: write_down_zero_delta_creates_nothing
        grounds:
          - calculations.write_down_evaluation
          - entities.WriteDown.fields.status
        distinguishing_aspect: |
          Metric = write-down requirement amount (zero/empty-set edge, not a
          day count); endpoint = POST /api/appraisals/{id}/certify (not the
          clock). required = carrying_value - NRV == 0.00 exactly must create
          NO WriteDown row (strict > 0 gate), leaving an empty write-down list.
        test_recipe:
          setup:
            - "Property carrying 368000.00 with a certified 400000.00 appraisal (effective 2026-06-01, delta 0 — itself no adjustment row)"
            - "Clock at 2026-12-10; second appraisal of 400000.00 effective 2026-12-10 submitted (outside measurement window)"
          setup_api_calls:
            - { call: "POST /api/oreo-properties", payload: { address: "1420 Maple St", state_code: "CA", county: "Alameda", property_type: "RESIDENTIAL", acquisition_date: "2026-05-10", bpo_value: 400000.00, foreclosure_debt: 410000.00 }, as: OREOAdmin, captures: { p_id: $.data.id, p_v: $.data.version } }
            - { call: "POST /api/_clock/set_current_utc", payload: { to_iso8601: "2026-06-01T00:00:00Z" }, as: OREOAdmin }
            - { call: "POST /api/appraisers", payload: { name: "Apex Valuations", license_number: "LIC-A1", coverage_states: ["CA"], fee_flat: 750.00 }, as: OREOAdmin, captures: { ap_id: $.data.id } }
            - { call: "POST /api/appraisals", payload: { property_id: "${p_id}", appraiser_id: "${ap_id}", effective_date: "2026-06-01", appraised_value: 400000.00, expected_property_version: "${p_v}" }, as: Appraiser, as_user_id: "${ap_id}", captures: { a1_id: $.data.id } }
            - { call: "POST /api/appraisals/${a1_id}/submit", payload: {}, as: Appraiser, as_user_id: "${ap_id}" }
            - { call: "POST /api/appraisals/${a1_id}/certify", payload: {}, as: ChiefAppraiser, as_user_id: "chief-appraiser-1" }
            - { call: "POST /api/_clock/set_current_utc", payload: { to_iso8601: "2026-12-10T00:00:00Z" }, as: OREOAdmin }
            - { call: "GET /api/oreo-properties/${p_id}", payload: {}, as: OREOAdmin, captures: { p_v2: $.data.version } }
            - { call: "POST /api/appraisals", payload: { property_id: "${p_id}", appraiser_id: "${ap_id}", effective_date: "2026-12-10", appraised_value: 400000.00, expected_property_version: "${p_v2}" }, as: Appraiser, as_user_id: "${ap_id}", captures: { a2_id: $.data.id } }
            - { call: "POST /api/appraisals/${a2_id}/submit", payload: {}, as: Appraiser, as_user_id: "${ap_id}" }
          trigger:
            - { call: "POST /api/appraisals/${a2_id}/certify", payload: {}, as: ChiefAppraiser, as_user_id: "chief-appraiser-1" }
            - { call: "GET /api/write-downs", payload: { property_id: "${p_id}" }, as: OREOAdmin }
          assert:
            - "GET /api/write-downs?property_id=${p_id} returns total_count == 0 (required = 368000.00 - 368000.00 == 0.00 creates no row)"
            - "Property.${p_id}.carrying_value == 368000.00 (unchanged)"
            - "Property.${p_id}.current_fair_value == 400000.00 and net_realizable_value == 368000.00"

  # =====================================================================
  # Rule 7 — cross_entity_state_dependency (different entity pairs)
  # =====================================================================
  - rule_id: cross_entity_state_dependency
    instances:
      - name: offer_accept_blocked_by_open_environmental_issue
        grounds:
          - state_machines.OREOProperty.MARKETED_to_UNDER_CONTRACT
          - "validations[priority=7]"
          - entities.IssueCase.fields.status
        distinguishing_aspect: |
          Entity pair = Offer -> IssueCase. The Offer's ACCEPT transition
          depends on the state of a different entity (no ENVIRONMENTAL
          IssueCase in {OPEN, IN_REMEDIATION}); resolving the issue unblocks
          the very same accept call.
        test_recipe:
          setup:
            - "Approval tiers configured; marketed property with a 450000.00 CASH offer UNDER_REVIEW"
            - "An ENVIRONMENTAL IssueCase exists on the property"
          setup_api_calls:
            - { call: "POST /api/approval-tiers", payload: { name: "T1", min_net_proceeds: 0.00, max_net_proceeds: 250000.00, required_role: "OREOSpecialist" }, as: OREOAdmin }
            - { call: "POST /api/approval-tiers", payload: { name: "T2", min_net_proceeds: 250000.00, max_net_proceeds: 750000.00, required_role: "CreditOfficer" }, as: OREOAdmin }
            - { call: "POST /api/approval-tiers", payload: { name: "T3", min_net_proceeds: 750000.00, required_role: "OREOCommittee" }, as: OREOAdmin }
            - { call: "POST /api/oreo-properties", payload: { address: "1420 Maple St", state_code: "CA", county: "Alameda", property_type: "RESIDENTIAL", acquisition_date: "2026-05-10", bpo_value: 400000.00, foreclosure_debt: 410000.00 }, as: OREOAdmin, captures: { p_id: $.data.id, p_v: $.data.version } }
            - { call: "POST /api/_clock/set_current_utc", payload: { to_iso8601: "2026-06-01T00:00:00Z" }, as: OREOAdmin }
            - { call: "POST /api/appraisers", payload: { name: "Apex Valuations", license_number: "LIC-A1", coverage_states: ["CA"], fee_flat: 750.00 }, as: OREOAdmin, captures: { ap_id: $.data.id } }
            - { call: "POST /api/appraisals", payload: { property_id: "${p_id}", appraiser_id: "${ap_id}", effective_date: "2026-06-01", appraised_value: 400000.00, expected_property_version: "${p_v}" }, as: Appraiser, as_user_id: "${ap_id}", captures: { a_id: $.data.id } }
            - { call: "POST /api/appraisals/${a_id}/submit", payload: {}, as: Appraiser, as_user_id: "${ap_id}" }
            - { call: "POST /api/appraisals/${a_id}/certify", payload: {}, as: ChiefAppraiser, as_user_id: "chief-appraiser-1" }
            - { call: "POST /api/brokers", payload: { name: "Bay Brokers", license_number: "LIC-B1", coverage_states: ["CA"] }, as: OREOAdmin, captures: { b_id: $.data.id } }
            - { call: "POST /api/listing-agreements", payload: { property_id: "${p_id}", broker_id: "${b_id}", start_date: "2026-06-05", end_date: "2026-12-05", listing_price: 450000.00 }, as: PropertyManager, captures: { l_id: $.data.id } }
            - { call: "POST /api/listing-agreements/${l_id}/activate", payload: {}, as: OREOSpecialist }
            - { call: "GET /api/oreo-properties/${p_id}", payload: {}, as: OREOAdmin, captures: { p_v2: $.data.version } }
            - { call: "POST /api/offers", payload: { property_id: "${p_id}", listing_agreement_id: "${l_id}", buyer_name: "Buyer One", offer_price: 450000.00, financing_type: "CASH", earnest_money: 5000.00, expected_property_version: "${p_v2}" }, as: OREOSpecialist, captures: { o_id: $.data.id } }
            - { call: "POST /api/offers/${o_id}/submit-review", payload: {}, as: OREOSpecialist }
            - { call: "POST /api/issues", payload: { property_id: "${p_id}", issue_type: "ENVIRONMENTAL", severity: "HIGH", description: "Asbestos in basement" }, as: PropertyManager, captures: { i_id: $.data.id } }
          trigger:
            - { call: "POST /api/offers/${o_id}/accept", payload: {}, as: CreditOfficer, captures: { err1: $.data.error_id } }
            - { call: "POST /api/issues/${i_id}/start-remediation", payload: {}, as: PropertyManager }
            - { call: "POST /api/offers/${o_id}/accept", payload: {}, as: CreditOfficer, captures: { err2: $.data.error_id } }
            - { call: "POST /api/issues/${i_id}/resolve", payload: { resolution_notes: "Abatement completed, clearance letter on file" }, as: PropertyManager }
            - { call: "POST /api/offers/${o_id}/accept", payload: {}, as: CreditOfficer, captures: { o_status: $.data.status } }
          assert:
            - "err1 == ERR_ENVIRONMENTAL_ISSUE_OPEN (issue OPEN blocks accept)"
            - "err2 == ERR_ENVIRONMENTAL_ISSUE_OPEN (IN_REMEDIATION still counts as open)"
            - "After resolve, the identical accept succeeds: o_status == ACCEPTED and property ${p_id} becomes UNDER_CONTRACT"

      - name: extension_submit_blocked_on_terminal_property
        grounds:
          - state_machines.ExtensionRequest.DRAFT_to_SUBMITTED
          - entities.OREOProperty.fields.lifecycle_status
        distinguishing_aspect: |
          Entity pair = ExtensionRequest -> OREOProperty (different pair from
          instance 1's Offer -> IssueCase). The extension's SUBMIT transition
          is gated on the property's lifecycle_status being non-terminal; a
          property charged off after the request was drafted makes the same
          submit call fail with ERR_PROPERTY_ALREADY_TERMINAL.
        test_recipe:
          setup:
            - "Property acquired 2026-05-10 (deadline 2031-05-09), HELD"
            - "ExtensionRequest drafted for 365 days while the property is HELD"
          setup_api_calls:
            - { call: "POST /api/oreo-properties", payload: { address: "5 Cedar Ln", state_code: "CA", county: "Fresno", property_type: "RESIDENTIAL", acquisition_date: "2026-05-10", bpo_value: 400000.00, foreclosure_debt: 410000.00 }, as: OREOAdmin, captures: { p_id: $.data.id } }
            - { call: "POST /api/extension-requests", payload: { property_id: "${p_id}", requested_extension_days: 365, justification: "Market conditions require extended marketing" }, as: ComplianceOfficer, captures: { e_id: $.data.id } }
            - { call: "POST /api/_clock/set_current_utc", payload: { to_iso8601: "2031-05-10T00:00:00Z" }, as: OREOAdmin }
          trigger:
            - { call: "POST /api/extension-requests/${e_id}/submit", payload: {}, as: ComplianceOfficer, captures: { err: $.data.error_id } }
          assert:
            - "err == ERR_PROPERTY_ALREADY_TERMINAL (HTTP 409): the property became CHARGED_OFF between drafting and submission"
            - "ExtensionRequest.${e_id}.status remains DRAFT"

  # =====================================================================
  # Rule 8 — resource_temporal_overlap (different interval semantics)
  # =====================================================================
  - rule_id: resource_temporal_overlap
    instances:
      - name: listing_agreement_half_open_adjacency
        grounds:
          - "validations[priority=8]"
          - "errors[ERR_LISTING_OVERLAP]"
          - entities.ListingAgreement.fields.start_date
        distinguishing_aspect: |
          Resource = the property's exclusive marketing mandate; semantics =
          half-open [start_date, end_date) intervals with adjacency permitted.
          An interior-overlapping second mandate (start 2026-08-01 <
          2026-12-05) is rejected, while a mandate starting exactly at the
          other's end_date (2026-12-05) is accepted.
        test_recipe:
          setup:
            - "Property HELD (no appraisal needed for drafting); eligible broker; listing A [2026-06-05, 2026-12-05) created in DRAFT"
          setup_api_calls:
            - { call: "POST /api/oreo-properties", payload: { address: "1420 Maple St", state_code: "CA", county: "Alameda", property_type: "RESIDENTIAL", acquisition_date: "2026-05-10", bpo_value: 400000.00, foreclosure_debt: 410000.00 }, as: OREOAdmin, captures: { p_id: $.data.id } }
            - { call: "POST /api/brokers", payload: { name: "Bay Brokers", license_number: "LIC-B1", coverage_states: ["CA"] }, as: OREOAdmin, captures: { b_id: $.data.id } }
            - { call: "POST /api/listing-agreements", payload: { property_id: "${p_id}", broker_id: "${b_id}", start_date: "2026-06-05", end_date: "2026-12-05", listing_price: 450000.00 }, as: PropertyManager, captures: { la_id: $.data.id } }
          trigger:
            - { call: "POST /api/listing-agreements", payload: { property_id: "${p_id}", broker_id: "${b_id}", start_date: "2026-08-01", end_date: "2027-02-01", listing_price: 440000.00 }, as: PropertyManager, captures: { err: $.data.error_id } }
            - { call: "POST /api/listing-agreements", payload: { property_id: "${p_id}", broker_id: "${b_id}", start_date: "2026-12-05", end_date: "2027-06-05", listing_price: 440000.00 }, as: PropertyManager, captures: { lc_id: $.data.id, lc_status: $.data.status } }
          assert:
            - "err == ERR_LISTING_OVERLAP (HTTP 409): [2026-08-01, 2027-02-01) intersects [2026-06-05, 2026-12-05)"
            - "lc_status == DRAFT: the adjacent interval starting exactly at A's end_date 2026-12-05 is accepted under half-open semantics"

      - name: extension_allowance_aggregate_capacity
        grounds:
          - state_machines.ExtensionRequest.SUBMITTED_to_APPROVED
          - calculations.holding_period_compliance
          - "errors[ERR_EXTENSION_CAP_EXCEEDED]"
        distinguishing_aspect: |
          Resource = the property's regulatory extension allowance; semantics
          = aggregate capacity (sum of APPROVED days <= 1825), not interval
          geometry. A 1000-day approval succeeds, a subsequent 900-day request
          breaches the aggregate cap (1900 > 1825) and is rejected, and the
          same request revised to 800 days then approves (1800 <= 1825).
        test_recipe:
          setup:
            - "Property acquired 2026-05-10 (deadline 2031-05-09), HELD"
            - "Extension request 1 (1000 days) submitted"
          setup_api_calls:
            - { call: "POST /api/oreo-properties", payload: { address: "5 Cedar Ln", state_code: "CA", county: "Fresno", property_type: "RESIDENTIAL", acquisition_date: "2026-05-10", bpo_value: 400000.00, foreclosure_debt: 410000.00 }, as: OREOAdmin, captures: { p_id: $.data.id } }
            - { call: "POST /api/extension-requests", payload: { property_id: "${p_id}", requested_extension_days: 1000, justification: "Complex commercial parcel" }, as: ComplianceOfficer, captures: { e1_id: $.data.id } }
            - { call: "POST /api/extension-requests/${e1_id}/submit", payload: {}, as: ComplianceOfficer }
          trigger:
            - { call: "POST /api/extension-requests/${e1_id}/approve", payload: {}, as: OREOCommittee, as_user_id: "committee-1", captures: { e1_status: $.data.status } }
            - { call: "POST /api/extension-requests", payload: { property_id: "${p_id}", requested_extension_days: 900, justification: "Further marketing time" }, as: ComplianceOfficer, captures: { e2_id: $.data.id } }
            - { call: "POST /api/extension-requests/${e2_id}/submit", payload: {}, as: ComplianceOfficer }
            - { call: "POST /api/extension-requests/${e2_id}/approve", payload: {}, as: OREOCommittee, as_user_id: "committee-1", captures: { err: $.data.error_id } }
            - { call: "POST /api/extension-requests/${e2_id}/deny", payload: {}, as: OREOCommittee, as_user_id: "committee-1" }
            - { call: "POST /api/extension-requests/${e2_id}/revise", payload: { requested_extension_days: 800 }, as: ComplianceOfficer }
            - { call: "POST /api/extension-requests/${e2_id}/submit", payload: {}, as: ComplianceOfficer }
            - { call: "POST /api/extension-requests/${e2_id}/approve", payload: {}, as: OREOCommittee, as_user_id: "committee-1", captures: { e2_status: $.data.status } }
            - { call: "GET /api/oreo-properties/${p_id}", payload: {}, as: OREOAdmin }
          assert:
            - "e1_status == APPROVED and property.holding_deadline == 2034-02-02 after the first approval (2031-05-09 + 1000 days)"
            - "err == ERR_EXTENSION_CAP_EXCEEDED (HTTP 422): 1000 + 900 = 1900 > 1825 aggregate allowance"
            - "After deny + revise to 800 + resubmit, e2_status == APPROVED (1000 + 800 = 1800 <= 1825)"
            - "Property.${p_id}.holding_deadline == 2036-04-12 and extension_days_approved == 1800"

  # =====================================================================
  # Rule 9 — compensating_invariant (different conserved quantities)
  # =====================================================================
  - rule_id: compensating_invariant
    instances:
      - name: settle_then_void_preserves_recognized_gain_total
        grounds:
          - state_machines.ClosingStatement.SETTLED_to_VOID
          - state_machines.OREOProperty.DISPOSED_to_UNDER_CONTRACT
          - entities.OREOProperty.fields.recognized_gain_loss_total
        distinguishing_aspect: |
          Conserved quantity = the property's recognized_gain_loss_total (a
          monetary ledger sum). Settle (+52500.00 GAIN_RECOGNIZED) followed by
          its compensating void (negated entries) must return the sum to
          exactly 0.00 — the cascade leaves no drift in the named quantity.
        test_recipe:
          setup:
            - "Approval tiers configured; property UNDER_CONTRACT via accepted 450000.00 CASH offer (net_proceeds 420500.00, carrying 368000.00)"
            - "ClosingStatement drafted with closing_date 2026-08-01"
          setup_api_calls:
            - { call: "POST /api/approval-tiers", payload: { name: "T1", min_net_proceeds: 0.00, max_net_proceeds: 250000.00, required_role: "OREOSpecialist" }, as: OREOAdmin }
            - { call: "POST /api/approval-tiers", payload: { name: "T2", min_net_proceeds: 250000.00, max_net_proceeds: 750000.00, required_role: "CreditOfficer" }, as: OREOAdmin }
            - { call: "POST /api/approval-tiers", payload: { name: "T3", min_net_proceeds: 750000.00, required_role: "OREOCommittee" }, as: OREOAdmin }
            - { call: "POST /api/oreo-properties", payload: { address: "1420 Maple St", state_code: "CA", county: "Alameda", property_type: "RESIDENTIAL", acquisition_date: "2026-05-10", bpo_value: 400000.00, foreclosure_debt: 410000.00 }, as: OREOAdmin, captures: { p_id: $.data.id, p_v: $.data.version } }
            - { call: "POST /api/_clock/set_current_utc", payload: { to_iso8601: "2026-06-01T00:00:00Z" }, as: OREOAdmin }
            - { call: "POST /api/appraisers", payload: { name: "Apex Valuations", license_number: "LIC-A1", coverage_states: ["CA"], fee_flat: 750.00 }, as: OREOAdmin, captures: { ap_id: $.data.id } }
            - { call: "POST /api/appraisals", payload: { property_id: "${p_id}", appraiser_id: "${ap_id}", effective_date: "2026-06-01", appraised_value: 400000.00, expected_property_version: "${p_v}" }, as: Appraiser, as_user_id: "${ap_id}", captures: { a_id: $.data.id } }
            - { call: "POST /api/appraisals/${a_id}/submit", payload: {}, as: Appraiser, as_user_id: "${ap_id}" }
            - { call: "POST /api/appraisals/${a_id}/certify", payload: {}, as: ChiefAppraiser, as_user_id: "chief-appraiser-1" }
            - { call: "POST /api/brokers", payload: { name: "Bay Brokers", license_number: "LIC-B1", coverage_states: ["CA"] }, as: OREOAdmin, captures: { b_id: $.data.id } }
            - { call: "POST /api/listing-agreements", payload: { property_id: "${p_id}", broker_id: "${b_id}", start_date: "2026-06-05", end_date: "2026-12-05", listing_price: 450000.00 }, as: PropertyManager, captures: { l_id: $.data.id } }
            - { call: "POST /api/listing-agreements/${l_id}/activate", payload: {}, as: OREOSpecialist }
            - { call: "GET /api/oreo-properties/${p_id}", payload: {}, as: OREOAdmin, captures: { p_v2: $.data.version } }
            - { call: "POST /api/offers", payload: { property_id: "${p_id}", listing_agreement_id: "${l_id}", buyer_name: "Buyer One", offer_price: 450000.00, financing_type: "CASH", earnest_money: 5000.00, expected_property_version: "${p_v2}" }, as: OREOSpecialist, captures: { o_id: $.data.id } }
            - { call: "POST /api/offers/${o_id}/submit-review", payload: {}, as: OREOSpecialist }
            - { call: "POST /api/offers/${o_id}/accept", payload: {}, as: CreditOfficer }
            - { call: "POST /api/closing-statements", payload: { offer_id: "${o_id}", closing_date: "2026-08-01" }, as: OREOSpecialist, captures: { c_id: $.data.id } }
          trigger:
            - { call: "POST /api/closing-statements/${c_id}/settle", payload: {}, as: CreditOfficer }
            - { call: "GET /api/oreo-properties/${p_id}/summary", payload: {}, as: OREOAdmin, captures: { g1: $.data.recognized_gain_loss_total } }
            - { call: "POST /api/closing-statements/${c_id}/void", payload: {}, as: OREOCommittee, as_user_id: "committee-1" }
            - { call: "GET /api/oreo-properties/${p_id}/summary", payload: {}, as: OREOAdmin, captures: { g2: $.data.recognized_gain_loss_total } }
            - { call: "GET /api/ledger-entries", payload: { property_id: "${p_id}", closing_statement_id: "${c_id}" }, as: OREOAdmin }
          assert:
            - "g1 == 52500.00 after settle (PROCEEDS +420500.00, GAIN_RECOGNIZED +52500.00)"
            - "g2 == 0.00 after void — the compensating action restores the conserved sum exactly"
            - "Ledger for closing ${c_id} contains negated counterparts: PROCEEDS -420500.00 and GAIN_RECOGNIZED -52500.00"
            - "Property.${p_id}.lifecycle_status == UNDER_CONTRACT and Offer.${o_id}.status == ACCEPTED after the void"

      - name: activate_then_terminate_preserves_marketing_invariant
        grounds:
          - state_machines.ListingAgreement.DRAFT_to_ACTIVE
          - state_machines.ListingAgreement.ACTIVE_to_TERMINATED
          - entities.OREOProperty.fields.active_listing_count
        distinguishing_aspect: |
          Conserved quantity = the property's marketing posture
          (active_listing_count == 0 and lifecycle_status == HELD), a
          count/state pair — a different conserved-quantity type from instance
          1's monetary sum. Activate followed by its compensating terminate
          returns both to their pre-action values with no drift in
          carrying_value either.
        test_recipe:
          setup:
            - "Property HELD with certified appraisal (CURRENT), carrying_value 368000.00, active_listing_count 0"
            - "Eligible broker registered; DRAFT listing created"
          setup_api_calls:
            - { call: "POST /api/oreo-properties", payload: { address: "1420 Maple St", state_code: "CA", county: "Alameda", property_type: "RESIDENTIAL", acquisition_date: "2026-05-10", bpo_value: 400000.00, foreclosure_debt: 410000.00 }, as: OREOAdmin, captures: { p_id: $.data.id, p_v: $.data.version } }
            - { call: "POST /api/_clock/set_current_utc", payload: { to_iso8601: "2026-06-01T00:00:00Z" }, as: OREOAdmin }
            - { call: "POST /api/appraisers", payload: { name: "Apex Valuations", license_number: "LIC-A1", coverage_states: ["CA"], fee_flat: 750.00 }, as: OREOAdmin, captures: { ap_id: $.data.id } }
            - { call: "POST /api/appraisals", payload: { property_id: "${p_id}", appraiser_id: "${ap_id}", effective_date: "2026-06-01", appraised_value: 400000.00, expected_property_version: "${p_v}" }, as: Appraiser, as_user_id: "${ap_id}", captures: { a_id: $.data.id } }
            - { call: "POST /api/appraisals/${a_id}/submit", payload: {}, as: Appraiser, as_user_id: "${ap_id}" }
            - { call: "POST /api/appraisals/${a_id}/certify", payload: {}, as: ChiefAppraiser, as_user_id: "chief-appraiser-1" }
            - { call: "POST /api/brokers", payload: { name: "Bay Brokers", license_number: "LIC-B1", coverage_states: ["CA"] }, as: OREOAdmin, captures: { b_id: $.data.id } }
            - { call: "POST /api/listing-agreements", payload: { property_id: "${p_id}", broker_id: "${b_id}", start_date: "2026-06-05", end_date: "2026-12-05", listing_price: 450000.00 }, as: PropertyManager, captures: { l_id: $.data.id } }
          trigger:
            - { call: "POST /api/listing-agreements/${l_id}/activate", payload: {}, as: OREOSpecialist }
            - { call: "GET /api/oreo-properties/${p_id}", payload: {}, as: OREOAdmin, captures: { st_mid: $.data.lifecycle_status, cnt_mid: $.data.active_listing_count } }
            - { call: "POST /api/listing-agreements/${l_id}/terminate", payload: {}, as: OREOSpecialist }
            - { call: "GET /api/oreo-properties/${p_id}", payload: {}, as: OREOAdmin, captures: { st_end: $.data.lifecycle_status, cnt_end: $.data.active_listing_count } }
          assert:
            - "st_mid == MARKETED and cnt_mid == 1 (forward action)"
            - "st_end == HELD and cnt_end == 0 — the compensating terminate restores the exact pre-action marketing posture"
