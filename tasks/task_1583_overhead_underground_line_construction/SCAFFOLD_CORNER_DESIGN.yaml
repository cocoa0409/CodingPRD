        grounds:
          - errors[ERR_OUTAGE_WINDOW_CONFLICT]
        excluded_because:
          difficulty_instance: outage_window_sixty_minute_buffer
          rationale: "Asserted as the failure branch of the named §1.8 instance."

      - name: quantity_cap_error_trigger
        claim_type: violation_to_error
        grounds:
          - errors[ERR_QUANTITY_CAP_EXCEEDED]
        excluded_because:
          difficulty_instance: quantity_cap_equality_boundary
          rationale: "Asserted as the boundary+1 branch of the named §1.8 instance."

      - name: open_rework_blocks_invoice_submit
        claim_type: violation_to_error
        grounds:
          - errors[ERR_OPEN_REWORK]
          - validations[priority=9k]
        excluded_because:
          difficulty_instance: inspection_fail_cascade_to_invoice_hold
          rationale: "The invoice-submit gate on open rework is asserted as hop 3 of the named §1.8 cascade instance."

      - name: open_material_issues_block_completion
        claim_type: violation_to_error
        grounds:
          - errors[ERR_OPEN_MATERIAL_ISSUES]
        excluded_because:
          difficulty_instance: completion_requires_material_reconciliation
          rationale: "Asserted as the failure branch of the named §1.8 instance."

      - name: stale_state_vs_fiscal_priority
        claim_type: priority_ordering
        grounds:
          - validations[priority=7]
          - validations[priority=11b]
        excluded_because:
          difficulty_instance: state_error_beats_fiscal_on_invoice_resubmit
          rationale: "Priority conflict state-vs-fiscal asserted in the named §1.8 instance."

      - name: safety_vs_constraint_priority
        claim_type: priority_ordering
        grounds:
          - validations[priority=8]
          - validations[priority=9g]
        excluded_because:
          difficulty_instance: outage_safety_beats_quantity_cap
          rationale: "Priority conflict safety-vs-constraint asserted in the named §1.8 instance."

