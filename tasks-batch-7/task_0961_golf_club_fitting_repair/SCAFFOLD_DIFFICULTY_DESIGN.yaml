  # ---------------------------------------------------------------------
  - rule_id: resource_temporal_overlap
    instances:
      - name: bay_buffered_half_open_overlap
        grounds:
          - calculations.session_conflict_checks
          - entities.LaunchMonitorBay.fields.cleanup_buffer_minutes
          - errors[ERR_BAY_TIME_CONFLICT]
        distinguishing_aspect: |
          Resource LaunchMonitorBay, buffered half-open semantics: a session
          starting 10 minutes after the previous one ends conflicts (gap 10 <
          15 buffer), while a gap of EXACTLY 15 minutes is allowed (boundary
          inclusive on the buffer).
        test_recipe:
          setup:
            - "Bay B (buffer 15) with session S1 10:00-11:00 BOOKED; specialist FS"
          setup_api_calls:
            - call: "POST /golf-shop/_clock/set_current_utc"
              payload: { to_iso8601: "2026-05-10T09:00:00Z" }
              as: ShopAdmin
            - call: "POST /golf-shop/customers"
              payload: { full_name: "Pam Pine", email: "pam@example.com" }
              as: ShopAdmin
              captures: { c_id: $.data.id }
            - call: "POST /golf-shop/staff"
              payload: { full_name: "Fred Fitter", staff_role: "FITTING_SPECIALIST" }
              as: ShopAdmin
              captures: { fs_id: $.data.id }
            - call: "POST /golf-shop/staff"
              payload: { full_name: "Sam Second", staff_role: "FITTING_SPECIALIST" }
              as: ShopAdmin
              captures: { fs2_id: $.data.id }
            - call: "POST /golf-shop/launch-monitor-bays"
              payload: { bay_name: "Bay 1", cleanup_buffer_minutes: 15 }
              as: ShopAdmin
              captures: { bay_id: $.data.id }
            - call: "POST /golf-shop/fitting-sessions"
              payload: { customer_id: "${c_id}", bay_id: "${bay_id}", specialist_id: "${fs_id}", starts_at: "2026-05-10T10:00:00Z", ends_at: "2026-05-10T11:00:00Z" }
              as: FittingSpecialist
              as_user_id: "${fs_id}"
              captures: { s1_id: $.data.id }
          trigger:
            - call: "POST /golf-shop/fitting-sessions"
              payload: { customer_id: "${c_id}", bay_id: "${bay_id}", specialist_id: "${fs2_id}", starts_at: "2026-05-10T11:10:00Z", ends_at: "2026-05-10T12:00:00Z" }
              as: FittingSpecialist
              as_user_id: "${fs2_id}"
              captures: { err: $.data.error_id }
            - call: "POST /golf-shop/fitting-sessions"
              payload: { customer_id: "${c_id}", bay_id: "${bay_id}", specialist_id: "${fs2_id}", starts_at: "2026-05-10T11:15:00Z", ends_at: "2026-05-10T12:15:00Z" }
              as: FittingSpecialist
              as_user_id: "${fs2_id}"
              captures: { s3_id: $.data.id }
          assert:
            - "11:10 booking rejected 409 ERR_BAY_TIME_CONFLICT (gap 10 < buffer 15)"
            - "11:15 booking succeeds 201 with status BOOKED (gap == buffer exactly is allowed)"
            - "FittingSession.${s1_id}.status still BOOKED and unchanged by the rejected attempt"

      - name: specialist_closed_interval_adjacency_conflict
        grounds:
          - calculations.session_conflict_checks
          - errors[ERR_SPECIALIST_TIME_CONFLICT]
        distinguishing_aspect: |
          Resource StaffMember (different resource entity than the bay), CLOSED
          interval semantics with no buffer: a session starting exactly when the
          specialist's previous session ends (end == start adjacency) IS a
          conflict, unlike the bay rule where adjacency-plus-buffer governs.
        test_recipe:
          setup:
            - "Specialist FS booked on Bay1 10:00-11:00; Bay2 empty (buffer 15, irrelevant)"
          setup_api_calls:
            - call: "POST /golf-shop/_clock/set_current_utc"
              payload: { to_iso8601: "2026-05-10T09:00:00Z" }
              as: ShopAdmin
            - call: "POST /golf-shop/customers"
              payload: { full_name: "Quin Quarry", email: "quin@example.com" }
              as: ShopAdmin
              captures: { c_id: $.data.id }
            - call: "POST /golf-shop/staff"
              payload: { full_name: "Fred Fitter", staff_role: "FITTING_SPECIALIST" }
              as: ShopAdmin
              captures: { fs_id: $.data.id }
            - call: "POST /golf-shop/launch-monitor-bays"
              payload: { bay_name: "Bay 1" }
              as: ShopAdmin
              captures: { bay1_id: $.data.id }
            - call: "POST /golf-shop/launch-monitor-bays"
              payload: { bay_name: "Bay 2" }
              as: ShopAdmin
              captures: { bay2_id: $.data.id }
            - call: "POST /golf-shop/fitting-sessions"
              payload: { customer_id: "${c_id}", bay_id: "${bay1_id}", specialist_id: "${fs_id}", starts_at: "2026-05-10T10:00:00Z", ends_at: "2026-05-10T11:00:00Z" }
              as: FittingSpecialist
              as_user_id: "${fs_id}"
          trigger:
            - call: "POST /golf-shop/fitting-sessions"
              payload: { customer_id: "${c_id}", bay_id: "${bay2_id}", specialist_id: "${fs_id}", starts_at: "2026-05-10T11:00:00Z", ends_at: "2026-05-10T12:00:00Z" }
              as: FittingSpecialist
              as_user_id: "${fs_id}"
              captures: { err: $.data.error_id }
            - call: "POST /golf-shop/fitting-sessions"
              payload: { customer_id: "${c_id}", bay_id: "${bay2_id}", specialist_id: "${fs_id}", starts_at: "2026-05-10T11:01:00Z", ends_at: "2026-05-10T12:00:00Z" }
              as: FittingSpecialist
              as_user_id: "${fs_id}"
              captures: { s2_id: $.data.id }
          assert:
            - "11:00 booking rejected 409 ERR_SPECIALIST_TIME_CONFLICT (closed interval: start <= prev end)"
            - "11:01 booking succeeds 201 (one-minute gap suffices for a specialist; no buffer)"
            - "FittingSession.${s2_id}.status == BOOKED"

  # ---------------------------------------------------------------------
  - rule_id: compensating_invariant
    instances:
      - name: inventory_quantity_conserved_across_reserve_release_consume
        grounds:
          - calculations.allocation_sweep
          - entities.ComponentItem.fields.stock_on_hand
          - entities.ComponentItem.fields.stock_reserved
          - entities.ComponentItem.fields.consumed_total
          - state_machines.ClubBuildSpec.IN_BUILD_to_READY
          - state_machines.ClubBuildSpec.ORDERED_to_CANCELLED
        distinguishing_aspect: |
          Conserved quantity: physical stock units. For each ComponentItem,
          stock_on_hand + stock_reserved + consumed_total == received_total at
          every hop of reserve -> release -> reserve -> consume; the
          compensating release exactly undoes the reservation.
        test_recipe:
          setup:
            - "HEAD item initial_stock 5 (received_total 5); SHAFT and GRIP items stock 5; two DRAFT specs A and B from one COMPLETED session, all EXTERNAL payment"
          setup_api_calls:
            - call: "POST /golf-shop/_clock/set_current_utc"
              payload: { to_iso8601: "2026-05-10T09:00:00Z" }
              as: ShopAdmin
            - call: "POST /golf-shop/customers"
              payload: { full_name: "Rae River", email: "rae@example.com" }
              as: ShopAdmin
              captures: { c_id: $.data.id }
