        distinguishing_aspect: "When rwa_cents == 0 (no exposures with EAD > 0), all ratio fields are null (not error, not 0, not Infinity)."
        test_recipe:
          setup: ["Bank + period; instrument exists but no exposures → prepare would fail ERR_NO_EXPOSURES. Use an exposure with EAD = 1 cent and risk_weight = 0 to force rwa_cents = 0? Or use EAD = 0."]
          setup_api_calls:
            - call: "POST /banks"
              payload: { legal_name: "ZeroBank", charter_id: "CH-ZRO-001" }
              as: SystemOperator
              captures: { b: $.data.id }
            - call: "POST /banks/${b}/reporting-periods"
              payload: { period_end_date: "2026-06-30", period_year: 2026, period_quarter: "Q2" }
              as: CapitalAnalyst
              captures: { p: $.data.id }
            - call: "POST /banks/${b}/reporting-periods/${p}/risk-exposures"
              payload: { reporting_period_id: "${p}", exposure_class: "SOVEREIGN", exposure_at_default_cents: 1000000000, risk_weight_bps: 0, obligor_grade: "INVESTMENT_GRADE", collateral_haircut_bps: 0 }
              as: CapitalAnalyst
