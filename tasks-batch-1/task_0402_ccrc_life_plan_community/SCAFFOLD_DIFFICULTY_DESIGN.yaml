              payload: { community_id: "${cid}", name: "V Plan", contract_type: "TYPE_C", entrance_fee_cents: 100000, refund_plan: "DECLINING", monthly_service_fee_cents: 1000, second_person_fee_cents: 0 }
              as: FinanceOfficer
              captures: { pid: $.data.id }
            - call: "POST /ccrc/councils"
              payload: { community_id: "${cid}", name: "Council", quorum_pct_bps: 5000 }
              as: FinanceOfficer
              captures: { coid: $.data.id }
