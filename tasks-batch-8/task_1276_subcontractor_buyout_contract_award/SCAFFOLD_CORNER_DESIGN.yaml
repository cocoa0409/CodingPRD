  # Section 4 — Validations
  # ===========================================================================
  - section: validations
    instances:
      - name: request_missing_auth_headers_unauthenticated
        claim_type: violation_to_error
        grounds:
          - "validations[priority=1]"
          - "errors[ERR_MISSING_OR_INVALID_USER_CONTEXT_HEADER]"
        distinguishing_aspect: "A request with no X-User-ID / X-User-Role headers fails 400 ERR_MISSING_OR_INVALID_USER_CONTEXT_HEADER before any other check."
        test_recipe:
          setup: ["one project exists"]
          setup_api_calls:
            - call: "POST /projects"
              payload: { name: "P-V1", project_number: "V1", estimated_budget_cents: 50000000, buyout_target_savings_pct: 0.05 }
              as: GCAdmin
              captures: { proj_id: $.data.id }
          trigger:
            - call: "GET /projects/${proj_id}"
              captures: { err: $.data.error_id }
          assert:
            - "err == ERR_MISSING_OR_INVALID_USER_CONTEXT_HEADER and HTTP status == 400 (no X-User-ID / X-User-Role headers sent)"

      - name: estimator_cannot_award_bid_forbidden
        claim_type: violation_to_error
        grounds:
          - "validations[priority=2]"
          - "errors[ERR_FORBIDDEN_FOR_ROLE]"
        distinguishing_aspect: "Estimator (record-bid role only) calling the BuyoutLead-exclusive bid award is denied 403 ERR_FORBIDDEN_FOR_ROLE."
        test_recipe:
          setup: ["package UNDER_LEVELING with one PLACED bid"]
          setup_api_calls:
            - call: "POST /projects"
              payload: { name: "P-V2", project_number: "V2", estimated_budget_cents: 50000000, buyout_target_savings_pct: 0.05 }
              as: GCAdmin
              captures: { proj_id: $.data.id }
