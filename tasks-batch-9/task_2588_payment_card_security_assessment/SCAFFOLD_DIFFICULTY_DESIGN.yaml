      - name: rejected_scan_dispute_five_link_gap_cascade
        grounds:
          - state_machines.ScanFinding.DISPUTED_to_REJECTED
          - state_machines.ScanCycle.DISPUTE_OPEN_to_FAILING
          - state_machines.RequirementAssessment.IN_PLACE_to_IN_TESTING
          - state_machines.RequirementAssessment.NONE_to_GAP_OPEN
          - entities.RemediationItem.fields.source
          - entities.RemediationItem.fields.source_scan_finding_id
          - calculations.scan_cycle_effective_findings
          - calculations.engagement_posture
        distinguishing_aspect: |
          Rejecting one false-positive dispute propagates out of the scanning subtree into the assessment
          subtree across five hops: (1) the ScanFinding row, (2) the parent ScanCycle's four derived
          counters and its DISPUTE_OPEN -> FAILING transition, (3) the engagement's quarterly_scan_compliant
          flag together with requirement 11.3.1 which is driven back from IN_PLACE to IN_TESTING, (4) a
          freshly minted RemediationItem carrying source SCAN_FINDING_REJECTED plus the engagement's
          open_gap_count, and (5) the derived posture - a cross-aggregate chain no single-entity cascade
          could produce.
