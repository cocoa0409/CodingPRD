  # Rule 4 - transitive_cascade (three different triggering transitions)
  # ===========================================================================
  - rule_id: transitive_cascade
    instances:

      - name: close_decision_cascades_into_kit_decay_refurb_and_relocalisation
        grounds:
          - state_machines.ExperienceRun.run_status.CLOSING_to_CLOSED
          - state_machines.BuildKit.DEPLOYED_to_REFURB_REQUIRED
          - state_machines.BuildKit.REFURB_REQUIRED_to_IN_TRANSIT
          - state_machines.BuildKit.IN_TRANSIT_to_READY
          - calculations.kit_condition_decay
          - calculations.kit_localization_cost
          - entities.BuildKit.fields.condition_score
          - entities.BuildKit.fields.localization_status
          - entities.BuildKit.fields.localization_cost_cents
          - errors[ERR_KIT_INVALID_STATE]
        distinguishing_aspect: |
          Depth-4 chain from a single closure decision, each hop caused by the previous one and not by
          the original call: hop 1 run_status -> CLOSED; hop 2 (because the run closed) the kit's
          condition_score decays 64.00 -> 48.00 and reuse_cycle_count -> 1; hop 3 (because the decayed
          score 48.00 is below REFURB_THRESHOLD 60.00) kit.status -> REFURB_REQUIRED rather than
          IN_TRANSIT; hop 4 (because the kit needs refurbishment) localization_status -> PENDING and
          localization_cost_cents -> 0, which makes the very next localize call illegal until a
          refurbishment happens. A fan-out implementation that sets all four from the closure call
          would still pass hop 1 and 2 but cannot produce the REFURB_REQUIRED / PENDING pair, and the
          post-refurbishment localisation cost 521200 depends on reuse_cycle_count written in hop 2.
        test_recipe:
          setup:
            - "One OPEN, CLEARED NYC run whose kit has module_count 40 and initial_condition_score 64.00 (deployable: 64.00 >= REFURB_THRESHOLD 60.00 and LOCALIZED)."
            - "One themed room, one RELEASED 40-seat slot, one CLEARED member of each craft, no orders and no shifts, so the CLOSE preconditions hold."
            - "Wear on the first closure is 4.00 + 0.30 * 40 = 16.00 with no CITY_MOVE_WEAR because last_city_code is null."
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-08-01T00:00:00Z" }
              as: VenueOpsManager
            - call: "POST /venues"
              payload: { city_code: "NYC", site_name: "Pier 9 Shed", lease_start_date: "2026-08-01", lease_end_date: "2027-01-31", base_monthly_rent_cents: 4500000, buildout_allowance_cents: 1500000, buildout_cap_cents: 3000000, requested_occupancy_load: 180, egress_width_cm: 400, sprinklered: true }
              as: VenueOpsManager
              as_user_id: "vom-1"
              captures: { venue_id: $.data.id }
            - call: "POST /venues/${venue_id}/permit-submissions"
              payload: { package_note: "assembly occupancy package" }
              as: VenueOpsManager
              as_user_id: "vom-1"
            - call: "POST /venues/${venue_id}/permit-decisions"
              payload: { decision: "ISSUED", note: "occupancy 180 granted" }
              as: SafetyOfficer
              as_user_id: "officer-1"
            - call: "POST /venues/${venue_id}/activate-lease"
              payload: {}
              as: VenueOpsManager
              as_user_id: "vom-1"
            - call: "POST /build-kits"
              payload: { kit_code: "KIT-CLS-001", module_count: 40, initial_condition_score: 64.00, localization_language: "en-US" }
              as: VenueOpsManager
              as_user_id: "vom-1"
              captures: { kit_id: $.data.id }
            - call: "POST /license-agreements"
              payload: { licensor_name: "Halcyon Studios", ip_title: "Neon Atrium", licensor_rep_user_id: "rep-1", royalty_rate_bps: 1250, merch_royalty_rate_bps: 750, minimum_guarantee_cents: 192790, approval_scopes: ["CREATIVE_EXECUTION"], territory_city_codes: ["NYC"], term_start_date: "2026-08-01", term_end_date: "2026-12-31" }
              as: LicensingManager
              as_user_id: "lm-1"
              captures: { agreement_id: $.data.id }
            - call: "POST /license-agreements/${agreement_id}/activate"
              payload: {}
              as: LicensingManager
              as_user_id: "lm-1"
            - call: "POST /experience-runs"
              payload: { venue_id: "${venue_id}", license_agreement_id: "${agreement_id}", build_kit_id: "${kit_id}", run_name: "Neon Atrium NYC", scheduled_open_date: "2026-08-10", scheduled_close_date: "2026-10-31", base_ticket_price_cents: 35833, timed_slot_minutes: 45, max_group_size: 12 }
              as: ExperienceProducer
              as_user_id: "producer-1"
              captures: { run_id: $.data.id }
            - call: "POST /themed-rooms"
              payload: { run_id: "${run_id}", room_sequence: 1, name: "Vestibule", room_occupancy_cap: 40, target_dwell_minutes: 15, min_dwell_minutes: 5, sensory_intensity_level: 2, has_quiet_bypass: true, wheelchair_accessible: true }
              as: ExperienceProducer
              as_user_id: "producer-1"
            - call: "GET /license-agreements/${agreement_id}"
              payload: {}
              as: ExperienceProducer
              as_user_id: "producer-1"
              captures: { agr_v1: $.data.version }
            - call: "POST /creative-submissions"
              payload: { license_agreement_id: "${agreement_id}", run_id: "${run_id}", scope: "CREATIVE_EXECUTION", asset_code: "RD-001", title: "Vestibule dressing", expected_agreement_version: "${agr_v1}" }
              as: ExperienceProducer
              as_user_id: "producer-1"
              captures: { sub_id: $.data.id }
            - call: "POST /creative-submissions/${sub_id}/start-review"
              payload: {}
              as: LicensorRep
              as_user_id: "rep-1"
            - call: "POST /creative-submissions/${sub_id}/decisions"
