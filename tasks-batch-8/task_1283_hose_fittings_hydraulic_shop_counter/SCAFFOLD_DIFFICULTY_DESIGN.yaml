scaffold_difficulty_design:
  # ===================================================================
  # Rule 1 — dual_variant_calc (different entity domains)
  # ===================================================================
  - rule_id: dual_variant_calc
    instances:
      - name: assembly_price_provisional_vs_final
        grounds:
          - calculations.assembly_price
          - state_machines.AssemblyOrder.TAGGED_to_COMPLETED
          - entities.AssemblyOrder.fields.quoted_total_cents
          - entities.AssemblyOrder.fields.final_total_cents
        distinguishing_aspect: |
          Entity domain = AssemblyOrder pricing. Two valid variants (provisional
          using estimated_labor_minutes vs final using actual_labor_minutes)
          produce different totals for identical material data: quoted 10900 vs
          final 12400 cents.
        test_recipe:
          setup:
            - "Customer not enrolled (no discount); reel dia 0.5in at 800c/m, wp 3000, 50000mm; coupling at 1200c, stock 10"
            - "Order: cut 5000mm, req_wp 2000, crimp spec 25.0mm, est labor 30min, actual labor 40min, 2 couplings"
          setup_api_calls:
            - call: "POST /api/customers"
              payload: { name: "Acme Hydraulics" }
              as: ShopManager
              captures: { cust_id: $.data.id }
            - call: "POST /api/reels"
              payload: { hose_sku: "PARK-387-8", hose_diameter_in: 0.5, working_pressure_psi: 3000, price_per_meter_cents: 800, initial_length_mm: 50000 }
              as: ShopManager
              captures: { reel_id: $.data.id }
            - call: "POST /api/couplings"
              payload: { coupling_sku: "1CA43-8-8", size_in: 0.5, unit_price_cents: 1200, initial_on_hand_qty: 10 }
              as: ShopManager
              captures: { coup_id: $.data.id }
            - call: "POST /api/assembly-orders"
              payload:
                customer_id: "${cust_id}"
                reel_id: "${reel_id}"
                cut_length_mm: 5000
                required_working_pressure_psi: 2000
                crimp_diameter_spec_mm: 25.0
                estimated_labor_minutes: 30
                lines: [ { coupling_id: "${coup_id}", quantity: 2 } ]
              as: CounterSales
              captures: { order_id: $.data.id, quoted_at_create: $.data.quoted_total_cents }
            - call: "POST /api/assembly-orders/${order_id}/confirm"
              payload: {}
              as: CounterSales
            - call: "POST /api/assembly-orders/${order_id}/complete-build"
              payload: { measured_crimp_diameter_mm: 25.1, actual_labor_minutes: 40 }
              as: ShopTechnician
            - call: "POST /api/assembly-orders/${order_id}/record-pressure-test"
              payload: { test_pressure_psi: 4000, result: "PASSED" }
              as: ShopTechnician
            - call: "POST /api/assembly-orders/${order_id}/tag"
              payload: { tag_serial: "TAG-DV1" }
              as: ShopTechnician
          trigger:
            - call: "POST /api/assembly-orders/${order_id}/complete"
              payload: {}
              as: CounterSales
            - call: "GET /api/assembly-orders/${order_id}"
              as: CounterSales
          assert:
            - "AssemblyOrder.${order_id}.quoted_total_cents == 10900  (4000 hose + 2400 couplings + 30min*150 = 4500 labor)"
            - "AssemblyOrder.${order_id}.final_total_cents == 12400  (40min*150 = 6000 labor)"
            - "AssemblyOrder.${order_id}.quoted_total_cents != AssemblyOrder.${order_id}.final_total_cents"
            - "AssemblyOrder.${order_id}.status == COMPLETED"

      - name: compliance_score_strict_vs_projected
        grounds:
          - calculations.compliance_score
          - entities.Customer.fields.compliance_score_strict
          - entities.Customer.fields.compliance_score_projected
        distinguishing_aspect: |
          Entity domain = Customer hose-management program health (distinct from
          AssemblyOrder pricing). Strict variant counts only COMPLIANT/DUE_SOON
          assets (50.00); projected variant additionally counts an OVERDUE asset
          holding a future SCHEDULED inspection (100.00) — same underlying data.
        test_recipe:
          setup:
            - "Clock at default 2026-08-01T00:00:00Z; enrolled customer with inspection_interval_days 30"
            - "Asset A1 installed 2026-07-15 (due 2026-08-14 -> DUE_SOON); asset A2 installed 2026-06-01 (due 2026-07-01 -> OVERDUE)"
            - "A2 holds a SCHEDULED inspection with window 2026-08-05..2026-08-06 (end >= clock)"
          setup_api_calls:
            - call: "POST /api/customers"
              payload: { name: "FleetCo", program_enrolled: true, program_discount_pct: 0.10, inspection_interval_days: 30 }
              as: ShopManager
              captures: { cust_id: $.data.id }
            - call: "POST /api/equipment-assets"
              payload: { customer_id: "${cust_id}", asset_tag: "EX-01", machine_type: "excavator", installed_at: "2026-07-15T00:00:00Z" }
              as: ShopManager
              captures: { a1_id: $.data.id }
            - call: "POST /api/equipment-assets"
              payload: { customer_id: "${cust_id}", asset_tag: "EX-02", machine_type: "excavator", installed_at: "2026-06-01T00:00:00Z" }
              as: ShopManager
              captures: { a2_id: $.data.id, a2_v: $.data.version }
            - call: "GET /api/customers/${cust_id}"
              as: ShopManager
              captures: { strict_pre: $.data.compliance_score_strict }
            - call: "POST /api/equipment-assets/${a2_id}/inspections"
              payload: { expected_equipment_asset_version: "${a2_v}", scheduled_window_start: "2026-08-05T00:00:00Z", scheduled_window_end: "2026-08-06T00:00:00Z", inspector_name: "J. Ruiz" }
              as: CounterSales
              captures: { insp_id: $.data.id }
          trigger:
            - call: "GET /api/customers/${cust_id}"
              as: ShopManager
          assert:
            - "Customer.${cust_id}.compliance_score_strict == 50.00  (A1 DUE_SOON counts, A2 OVERDUE does not)"
            - "Customer.${cust_id}.compliance_score_projected == 100.00  (A2's SCHEDULED inspection ending 2026-08-06 >= clock counts it)"
            - "Customer.${cust_id}.compliance_score_projected > Customer.${cust_id}.compliance_score_strict"

  # ===================================================================
  # Rule 2 — combinatorial_formula (different modes)
  # ===================================================================
  - rule_id: combinatorial_formula
    instances:
      - name: emergency_tiered_pricing_with_discount
        grounds:
          - calculations.assembly_price
          - entities.Customer.fields.program_status
        distinguishing_aspect: |
          Mode (a): formula with >=3 inputs and non-linear interaction — tiered
          labor rate keyed on reel.hose_diameter_in (1.25in -> 260c/min),
          EMERGENCY_LABOR_MULT branch on is_emergency, and a conditional
          program_discount_pct branch gated on customer.program_status == ACTIVE.
        test_recipe:
          setup:
            - "Enrolled customer, discount 0.10, no assets (strict score 100.00 -> program ACTIVE)"
            - "Reel dia 1.25in at 1500c/m, wp 5000, 50000mm; coupling at 3000c stock 5"
            - "Emergency order: cut 3000mm, req_wp 3000, est labor 20min, 1 coupling"
          setup_api_calls:
            - call: "POST /api/customers"
              payload: { name: "RushWorks", program_enrolled: true, program_discount_pct: 0.10, inspection_interval_days: 90 }
              as: ShopManager
              captures: { cust_id: $.data.id }
            - call: "POST /api/reels"
              payload: { hose_sku: "PARK-787-20", hose_diameter_in: 1.25, working_pressure_psi: 5000, price_per_meter_cents: 1500, initial_length_mm: 50000 }
              as: ShopManager
              captures: { reel_id: $.data.id }
            - call: "POST /api/couplings"
              payload: { coupling_sku: "1C643-20-20", size_in: 1.25, unit_price_cents: 3000, initial_on_hand_qty: 5 }
              as: ShopManager
              captures: { coup_id: $.data.id }
          trigger:
            - call: "POST /api/assembly-orders"
              payload:
                customer_id: "${cust_id}"
                reel_id: "${reel_id}"
                cut_length_mm: 3000
                required_working_pressure_psi: 3000
                crimp_diameter_spec_mm: 41.0
                estimated_labor_minutes: 20
                is_emergency: true
                lines: [ { coupling_id: "${coup_id}", quantity: 1 } ]
              as: CounterSales
              captures: { order_id: $.data.id }
          assert:
            - "AssemblyOrder.${order_id}.quoted_total_cents == 13770  (hose 3m*1500=4500 + coupling 3000 + labor round_half_up(20*260*1.5)=7800 = 15300; discount round_half_up(15300*0.10)=1530; 15300-1530=13770)"
            - "AssemblyOrder.${order_id}.status == DRAFT"

      - name: invoice_component_rounding_order_pinned
        grounds:
          - calculations.assembly_invoice_total
          - calculations.cut_waste_allocation
          - entities.AssemblyOrder.fields.waste_surcharge_cents
        distinguishing_aspect: |
          Mode (b): nested rounding where order matters — per-component
          round_half_up BEFORE summing is pinned. Hose 1001mm*750c/m = 750.75 ->
          751 and waste 333mm*750c/m = 249.75 -> 250 give total 3501; the
          forbidden sum-then-round order would give round(750.75+249.75)+2500 =
          1002+2500 = 3502 (exact decimal arithmetic), differing from 3501.
        test_recipe:
          setup:
            - "Customer not enrolled; reel 1334mm at 750c/m, dia 0.5, wp 3000 (status LOW, still usable); coupling 1000c stock 5"
            - "Order cut 1001mm leaves remnant 333mm < MIN_REMNANT_MM -> scrapped and charged; labor est=actual=10min"
          setup_api_calls:
            - call: "POST /api/customers"
              payload: { name: "RoundTrip LLC" }
              as: ShopManager
              captures: { cust_id: $.data.id }
            - call: "POST /api/reels"
              payload: { hose_sku: "PARK-387-8R", hose_diameter_in: 0.5, working_pressure_psi: 3000, price_per_meter_cents: 750, initial_length_mm: 1334 }
              as: ShopManager
              captures: { reel_id: $.data.id }
            - call: "POST /api/couplings"
              payload: { coupling_sku: "10643-8-8", size_in: 0.5, unit_price_cents: 1000, initial_on_hand_qty: 5 }
              as: ShopManager
              captures: { coup_id: $.data.id }
            - call: "POST /api/assembly-orders"
              payload:
                customer_id: "${cust_id}"
                reel_id: "${reel_id}"
                cut_length_mm: 1001
                required_working_pressure_psi: 2000
                crimp_diameter_spec_mm: 25.0
                estimated_labor_minutes: 10
                lines: [ { coupling_id: "${coup_id}", quantity: 1 } ]
              as: CounterSales
              captures: { order_id: $.data.id }
            - call: "POST /api/assembly-orders/${order_id}/confirm"
              payload: {}
              as: CounterSales
            - call: "POST /api/assembly-orders/${order_id}/complete-build"
              payload: { measured_crimp_diameter_mm: 25.0, actual_labor_minutes: 10 }
              as: ShopTechnician
            - call: "POST /api/assembly-orders/${order_id}/record-pressure-test"
              payload: { test_pressure_psi: 4000, result: "PASSED" }
              as: ShopTechnician
            - call: "POST /api/assembly-orders/${order_id}/tag"
              payload: { tag_serial: "TAG-RND1" }
              as: ShopTechnician
          trigger:
            - call: "POST /api/assembly-orders/${order_id}/complete"
              payload: {}
              as: CounterSales
            - call: "GET /api/assembly-orders/${order_id}"
              as: CounterSales
            - call: "GET /api/reels/${reel_id}"
              as: ShopManager
          assert:
            - "AssemblyOrder.${order_id}.final_total_cents == 3501  (751 hose + 1000 coupling + 1500 labor + 250 waste)"
            - "AssemblyOrder.${order_id}.material_hose_cents == 751"
            - "AssemblyOrder.${order_id}.waste_surcharge_cents == 250"
            - "Reel.${reel_id}.scrap_length_mm == 333"
            - "Reel.${reel_id}.remaining_length_mm == 0"
            - "Reel.${reel_id}.status == DEPLETED"

  # ===================================================================
  # Rule 3 — non_linear_state_machine (different entities)
  # ===================================================================
  - rule_id: non_linear_state_machine
    instances:
      - name: assembly_order_rework_cycle
        grounds:
          - state_machines.AssemblyOrder.BUILT_to_TEST_FAILED
          - state_machines.AssemblyOrder.TEST_FAILED_to_REWORK
          - state_machines.AssemblyOrder.REWORK_to_BUILT
        distinguishing_aspect: |
          AssemblyOrder is cyclic: BUILT -> TEST_FAILED -> REWORK -> BUILT loops
          without re-committing the reel cut or coupling reservations; the order
          can still proceed to COMPLETED after the loop.
        test_recipe:
          setup:
            - "Customer; reel 50000mm at 800c/m dia 0.5 wp 3000; order cut 2000mm, req_wp 2000, crimp spec 25.0, est 10min, no lines"
          setup_api_calls:
            - call: "POST /api/customers"
              payload: { name: "CycleTest" }
              as: ShopManager
              captures: { cust_id: $.data.id }
            - call: "POST /api/reels"
              payload: { hose_sku: "PARK-387-8C", hose_diameter_in: 0.5, working_pressure_psi: 3000, price_per_meter_cents: 800, initial_length_mm: 50000 }
              as: ShopManager
              captures: { reel_id: $.data.id }
            - call: "POST /api/assembly-orders"
              payload:
                customer_id: "${cust_id}"
                reel_id: "${reel_id}"
                cut_length_mm: 2000
                required_working_pressure_psi: 2000
                crimp_diameter_spec_mm: 25.0
                estimated_labor_minutes: 10
              as: CounterSales
              captures: { order_id: $.data.id }
            - call: "POST /api/assembly-orders/${order_id}/confirm"
              payload: {}
              as: CounterSales
            - call: "POST /api/assembly-orders/${order_id}/complete-build"
              payload: { measured_crimp_diameter_mm: 25.1, actual_labor_minutes: 10 }
              as: ShopTechnician
            - call: "POST /api/assembly-orders/${order_id}/record-pressure-test"
              payload: { test_pressure_psi: 4000, result: "FAILED" }
              as: ShopTechnician
          trigger:
            - call: "POST /api/assembly-orders/${order_id}/rework"
              payload: {}
              as: ShopTechnician
            - call: "POST /api/assembly-orders/${order_id}/complete-build"
              payload: { measured_crimp_diameter_mm: 25.0, actual_labor_minutes: 12 }
              as: ShopTechnician
            - call: "GET /api/assembly-orders/${order_id}"
              as: CounterSales
            - call: "GET /api/reels/${reel_id}"
              as: ShopManager
          assert:
            - "AssemblyOrder.${order_id}.status == BUILT after the rework loop"
            - "AssemblyOrder.${order_id}.measured_crimp_diameter_mm == 25.0 (overwritten by second complete-build)"
            - "AssemblyOrder.${order_id}.actual_labor_minutes == 12"
            - "Reel.${reel_id}.remaining_length_mm == 48000 (rework does NOT re-debit the cut)"

      - name: inspection_pass_fail_branching
        grounds:
          - state_machines.Inspection.IN_PROGRESS_to_PASSED
          - state_machines.Inspection.IN_PROGRESS_to_FAILED
          - calculations.compliance_score
        distinguishing_aspect: |
          Inspection forks IN_PROGRESS -> {PASSED, FAILED} with divergent side
          effects: PASSED advances asset.last_passed/next_due, FAILED drives the
          asset NON_COMPLIANT and the customer's program to PROBATION — a branch,
          not a pipeline.
        test_recipe:
          setup:
            - "Clock default 2026-08-01; enrolled customer discount 0.10, interval 30"
            - "Assets A1 and A2 both installed 2026-07-20 (next_due 2026-08-19)"
            - "One inspection per asset, both IN_PROGRESS"
          setup_api_calls:
            - call: "POST /api/customers"
              payload: { name: "BranchCo", program_enrolled: true, program_discount_pct: 0.10, inspection_interval_days: 30 }
              as: ShopManager
              captures: { cust_id: $.data.id }
            - call: "POST /api/equipment-assets"
              payload: { customer_id: "${cust_id}", asset_tag: "LD-01", machine_type: "loader", installed_at: "2026-07-20T00:00:00Z" }
              as: ShopManager
              captures: { a1_id: $.data.id, a1_v: $.data.version }
            - call: "POST /api/equipment-assets"
              payload: { customer_id: "${cust_id}", asset_tag: "LD-02", machine_type: "loader", installed_at: "2026-07-20T00:00:00Z" }
              as: ShopManager
              captures: { a2_id: $.data.id, a2_v: $.data.version }
            - call: "POST /api/equipment-assets/${a1_id}/inspections"
              payload: { expected_equipment_asset_version: "${a1_v}", scheduled_window_start: "2026-07-28T00:00:00Z", scheduled_window_end: "2026-07-29T00:00:00Z" }
              as: CounterSales
              captures: { i1_id: $.data.id }
            - call: "POST /api/equipment-assets/${a2_id}/inspections"
              payload: { expected_equipment_asset_version: "${a2_v}", scheduled_window_start: "2026-07-28T00:00:00Z", scheduled_window_end: "2026-07-29T00:00:00Z" }
              as: CounterSales
              captures: { i2_id: $.data.id }
            - call: "POST /api/inspections/${i1_id}/start"
              payload: {}
              as: FieldTechnician
            - call: "POST /api/inspections/${i2_id}/start"
              payload: {}
              as: FieldTechnician
          trigger:
            - call: "POST /api/inspections/${i1_id}/complete"
              payload: { result: "PASSED" }
              as: FieldTechnician
            - call: "POST /api/inspections/${i2_id}/complete"
              payload: { result: "FAILED" }
              as: FieldTechnician
            - call: "GET /api/equipment-assets/${a1_id}"
              as: ShopManager
            - call: "GET /api/equipment-assets/${a2_id}"
              as: ShopManager
            - call: "GET /api/customers/${cust_id}"
              as: ShopManager
          assert:
            - "EquipmentAsset.${a1_id}.last_passed_inspection_at == 2026-08-01T00:00:00Z"
            - "EquipmentAsset.${a1_id}.next_due_date == 2026-08-31T00:00:00Z (performed 2026-08-01 + 30d)"
            - "EquipmentAsset.${a2_id}.compliance_posture == NON_COMPLIANT"
            - "Customer.${cust_id}.compliance_score_strict == 50.00"
            - "Customer.${cust_id}.program_status == PROBATION (50.00 < PROBATION_THRESHOLD 70)"

  # ===================================================================
  # Rule 4 — transitive_cascade (different triggers)
  # ===================================================================
  - rule_id: transitive_cascade
    instances:
      - name: order_completion_cascade_depth3
        grounds:
          - state_machines.AssemblyOrder.TAGGED_to_COMPLETED
          - calculations.next_due_date
          - calculations.compliance_score
        distinguishing_aspect: |
          Depth-3 chain from POST /api/assembly-orders/{id}/complete: order
          COMPLETED -> (1) couplings decremented and equipment_asset
          installed_at/installed_assembly_order_id set -> (2) asset
          next_due_date/compliance_posture recomputed from the new base ->
          (3) customer compliance scores and program_status recomputed. Each
          link is caused by the previous link.
        test_recipe:
          setup:
            - "Clock default 2026-08-01; customer interval 60, not enrolled; asset with no install base"
            - "Reel 0.5in 800c/m wp 3000 50000mm; coupling 1200c stock 10; order cut 5000mm req_wp 2000 with 2 couplings, TAGGED"
          setup_api_calls:
            - call: "POST /api/customers"
              payload: { name: "CascadeCo", inspection_interval_days: 60 }
              as: ShopManager
              captures: { cust_id: $.data.id }
            - call: "POST /api/equipment-assets"
              payload: { customer_id: "${cust_id}", asset_tag: "PR-01", machine_type: "press" }
              as: ShopManager
              captures: { asset_id: $.data.id }
            - call: "POST /api/reels"
              payload: { hose_sku: "PARK-387-8K", hose_diameter_in: 0.5, working_pressure_psi: 3000, price_per_meter_cents: 800, initial_length_mm: 50000 }
              as: ShopManager
              captures: { reel_id: $.data.id }
            - call: "POST /api/couplings"
              payload: { coupling_sku: "1CA43-8-8K", size_in: 0.5, unit_price_cents: 1200, initial_on_hand_qty: 10 }
              as: ShopManager
              captures: { coup_id: $.data.id }
            - call: "POST /api/assembly-orders"
              payload:
                customer_id: "${cust_id}"
                reel_id: "${reel_id}"
                equipment_asset_id: "${asset_id}"
                cut_length_mm: 5000
                required_working_pressure_psi: 2000
                crimp_diameter_spec_mm: 25.0
                estimated_labor_minutes: 30
                lines: [ { coupling_id: "${coup_id}", quantity: 2 } ]
              as: CounterSales
              captures: { order_id: $.data.id }
            - call: "POST /api/assembly-orders/${order_id}/confirm"
              payload: {}
              as: CounterSales
            - call: "POST /api/assembly-orders/${order_id}/complete-build"
              payload: { measured_crimp_diameter_mm: 25.1, actual_labor_minutes: 40 }
              as: ShopTechnician
            - call: "POST /api/assembly-orders/${order_id}/record-pressure-test"
              payload: { test_pressure_psi: 4000, result: "PASSED" }
              as: ShopTechnician
            - call: "POST /api/assembly-orders/${order_id}/tag"
              payload: { tag_serial: "TAG-CASC1" }
              as: ShopTechnician
          trigger:
            - call: "POST /api/assembly-orders/${order_id}/complete"
              payload: {}
              as: CounterSales
            - call: "GET /api/assembly-orders/${order_id}"
              as: CounterSales
            - call: "GET /api/couplings/${coup_id}"
              as: ShopManager
            - call: "GET /api/equipment-assets/${asset_id}"
              as: ShopManager
            - call: "GET /api/customers/${cust_id}"
              as: ShopManager
          assert:
            - "AssemblyOrder.${order_id}.status == COMPLETED and final_total_cents == 12400"
            - "Coupling.${coup_id}.on_hand_qty == 8 and reserved_qty == 0 (link 1: 10 - 2 shipped)"
            - "EquipmentAsset.${asset_id}.installed_at == 2026-08-01T00:00:00Z and installed_assembly_order_id == ${order_id} (link 1)"
            - "EquipmentAsset.${asset_id}.next_due_date == 2026-09-30T00:00:00Z (link 2: install 2026-08-01 + 60d)"
            - "EquipmentAsset.${asset_id}.compliance_posture == COMPLIANT (link 2)"
            - "Customer.${cust_id}.compliance_score_strict == 100.00 (link 3)"

      - name: cancel_restores_reel_depth2
        grounds:
          - state_machines.AssemblyOrder.CONFIRMED_to_CANCELLED
          - state_machines.Reel.DEPLETED_to_AVAILABLE
          - calculations.cut_waste_allocation
        distinguishing_aspect: |
          Depth-2 chain from POST /api/assembly-orders/{id}/cancel: (1) the
          cancel restores reel.remaining_length_mm and reverses scrap ->
          (2) that restoration itself flips reel.status DEPLETED -> AVAILABLE.
          Distinct trigger from the completion cascade.
        test_recipe:
          setup:
            - "Customer; reel 50000mm at 800c/m dia 0.5 wp 3000; order cut 49500mm confirmed (remnant 500mm < MIN_REMNANT_MM scrapped, reel DEPLETED)"
          setup_api_calls:
            - call: "POST /api/customers"
              payload: { name: "RestoreCo" }
              as: ShopManager
              captures: { cust_id: $.data.id }
            - call: "POST /api/reels"
              payload: { hose_sku: "PARK-387-8X", hose_diameter_in: 0.5, working_pressure_psi: 3000, price_per_meter_cents: 800, initial_length_mm: 50000 }
              as: ShopManager
              captures: { reel_id: $.data.id }
            - call: "POST /api/assembly-orders"
              payload:
                customer_id: "${cust_id}"
                reel_id: "${reel_id}"
                cut_length_mm: 49500
                required_working_pressure_psi: 2000
                crimp_diameter_spec_mm: 25.0
                estimated_labor_minutes: 10
              as: CounterSales
              captures: { order_id: $.data.id }
            - call: "POST /api/assembly-orders/${order_id}/confirm"
              payload: {}
              as: CounterSales
            - call: "GET /api/reels/${reel_id}"
              as: ShopManager
              captures: { depleted_status: $.data.status }
          trigger:
            - call: "POST /api/assembly-orders/${order_id}/cancel"
              payload: {}
              as: CounterSales
            - call: "GET /api/reels/${reel_id}"
              as: ShopManager
          assert:
            - "Reel.${reel_id}.status was DEPLETED before cancel (remaining 0, scrap 500)"
            - "Reel.${reel_id}.remaining_length_mm == 50000 after cancel (link 1: 0 + 49500 + 500)"
            - "Reel.${reel_id}.scrap_length_mm == 0 after cancel"
            - "Reel.${reel_id}.status == AVAILABLE after cancel (link 2: 50000 >= LOW_THRESHOLD_MM 20000)"

  # ===================================================================
  # Rule 5 — priority_pair_validation_conflict (different category pairs)
  # ===================================================================
  - rule_id: priority_pair_validation_conflict
    instances:
      - name: terminal_state_beats_credit_hold
        grounds:
          - validations[priority=4]
          - validations[priority=17]
          - errors[ERR_ORDER_TERMINAL]
          - errors[ERR_CREDIT_HOLD]
        distinguishing_aspect: |
          Category pair state vs business_fiscal: confirming a COMPLETED order
          whose customer is on credit hold violates both the terminal lockdown
          (p4) and the credit-hold rule (p17); ERR_ORDER_TERMINAL must win.
          (p4 is the terminal lockdown, which outranks the generic invalid-state
          check at p5 and the fiscal check at p17.)
        test_recipe:
          setup:
            - "Customer with a fully COMPLETED order; customer then placed on credit_hold"
          setup_api_calls:
            - call: "POST /api/customers"
              payload: { name: "PrioCo" }
              as: ShopManager
              captures: { cust_id: $.data.id }
            - call: "POST /api/reels"
              payload: { hose_sku: "PARK-387-8P", hose_diameter_in: 0.5, working_pressure_psi: 3000, price_per_meter_cents: 800, initial_length_mm: 50000 }
              as: ShopManager
              captures: { reel_id: $.data.id }
            - call: "POST /api/assembly-orders"
              payload:
                customer_id: "${cust_id}"
                reel_id: "${reel_id}"
                cut_length_mm: 1000
                required_working_pressure_psi: 2000
                crimp_diameter_spec_mm: 25.0
                estimated_labor_minutes: 10
              as: CounterSales
              captures: { order_id: $.data.id }
            - call: "POST /api/assembly-orders/${order_id}/confirm"
              payload: {}
              as: CounterSales
            - call: "POST /api/assembly-orders/${order_id}/complete-build"
              payload: { measured_crimp_diameter_mm: 25.0, actual_labor_minutes: 10 }
              as: ShopTechnician
            - call: "POST /api/assembly-orders/${order_id}/record-pressure-test"
              payload: { test_pressure_psi: 4000, result: "PASSED" }
              as: ShopTechnician
            - call: "POST /api/assembly-orders/${order_id}/tag"
              payload: { tag_serial: "TAG-PRIO1" }
              as: ShopTechnician
            - call: "POST /api/assembly-orders/${order_id}/complete"
              payload: {}
              as: CounterSales
            - call: "PATCH /api/customers/${cust_id}"
              payload: { credit_hold: true }
              as: ShopManager
          trigger:
            - call: "POST /api/assembly-orders/${order_id}/confirm"
              payload: {}
              as: CounterSales
              captures: { err: $.data.error_id }
          assert:
            - "error_id == ERR_ORDER_TERMINAL (state p4 outranks business_fiscal p17; NOT ERR_CREDIT_HOLD)"
            - "HTTP status == 409"

      - name: safety_pressure_beats_retired_reel
        grounds:
          - validations[priority=7]
          - validations[priority=15]
          - errors[ERR_PRESSURE_RATING_MISMATCH]
          - errors[ERR_REEL_NOT_USABLE]
        distinguishing_aspect: |
          Category pair business_safety vs business_referential: confirming an
          order whose required pressure exceeds the reel rating (p7) on a reel
          that has since been RETIRED (p15) must return
          ERR_PRESSURE_RATING_MISMATCH.
        test_recipe:
          setup:
            - "Customer; reel wp 2000 retired after order creation; DRAFT order requires 3000 psi (both safety and referential violated)"
          setup_api_calls:
            - call: "POST /api/customers"
              payload: { name: "SafeCo" }
              as: ShopManager
              captures: { cust_id: $.data.id }
            - call: "POST /api/reels"
              payload: { hose_sku: "PARK-201-8", hose_diameter_in: 0.5, working_pressure_psi: 2000, price_per_meter_cents: 600, initial_length_mm: 50000 }
              as: ShopManager
              captures: { reel_id: $.data.id }
            - call: "POST /api/assembly-orders"
              payload:
                customer_id: "${cust_id}"
                reel_id: "${reel_id}"
                cut_length_mm: 1000
                required_working_pressure_psi: 3000
                crimp_diameter_spec_mm: 25.0
                estimated_labor_minutes: 10
              as: CounterSales
              captures: { order_id: $.data.id }
            - call: "POST /api/reels/${reel_id}/retire"
              payload: {}
              as: ShopManager
          trigger:
            - call: "POST /api/assembly-orders/${order_id}/confirm"
              payload: {}
              as: CounterSales
              captures: { err: $.data.error_id }
          assert:
            - "error_id == ERR_PRESSURE_RATING_MISMATCH (business_safety p7 outranks business_referential p15; NOT ERR_REEL_NOT_USABLE)"
            - "HTTP status == 422"

  # ===================================================================
  # Rule 6 — boundary_precision_check (different metrics/endpoints)
  # ===================================================================
  - rule_id: boundary_precision_check
    instances:
      - name: cut_length_exactly_equals_remaining
        grounds:
          - validations[priority=18]
          - calculations.cut_waste_allocation
          - entities.Reel.fields.remaining_length_mm
        distinguishing_aspect: |
          Metric = reel millimeters; endpoint = POST /api/assembly-orders/{id}/confirm.
          cut_length_mm == remaining_length_mm is allowed (<= boundary, not <):
          confirm succeeds, remaining_after == 0 takes the clean-cut branch (no
          scrap even though 0 < MIN_REMNANT_MM) and the reel goes DEPLETED.
        test_recipe:
          setup:
            - "Customer; reel exactly 5000mm (status LOW, usable); order cut 5000mm req_wp 2000"
          setup_api_calls:
            - call: "POST /api/customers"
              payload: { name: "EdgeCo" }
              as: ShopManager
              captures: { cust_id: $.data.id }
            - call: "POST /api/reels"
              payload: { hose_sku: "PARK-387-8E", hose_diameter_in: 0.5, working_pressure_psi: 3000, price_per_meter_cents: 800, initial_length_mm: 5000 }
              as: ShopManager
              captures: { reel_id: $.data.id }
            - call: "POST /api/assembly-orders"
              payload:
                customer_id: "${cust_id}"
                reel_id: "${reel_id}"
                cut_length_mm: 5000
                required_working_pressure_psi: 2000
                crimp_diameter_spec_mm: 25.0
                estimated_labor_minutes: 10
              as: CounterSales
              captures: { order_id: $.data.id }
          trigger:
            - call: "POST /api/assembly-orders/${order_id}/confirm"
              payload: {}
              as: CounterSales
            - call: "GET /api/reels/${reel_id}"
              as: ShopManager
            - call: "GET /api/assembly-orders/${order_id}"
              as: CounterSales
          assert:
            - "confirm succeeds (HTTP 200); AssemblyOrder.${order_id}.status == CONFIRMED"
            - "Reel.${reel_id}.remaining_length_mm == 0"
            - "Reel.${reel_id}.scrap_length_mm == 0 (remaining_after == 0 is the clean-cut branch, NOT scrapped)"
            - "Reel.${reel_id}.status == DEPLETED"
            - "AssemblyOrder.${order_id}.waste_surcharge_cents == 0"

      - name: inspection_on_exact_due_date_not_overdue
        grounds:
          - state_machines.Inspection.IN_PROGRESS_to_PASSED
          - entities.Inspection.fields.was_overdue
          - calculations.next_due_date
        distinguishing_aspect: |
          Metric = calendar timestamp vs next_due_date; endpoint =
          POST /api/inspections/{id}/complete. performed_at == next_due_date is
          on time (overdue requires strictly greater), so was_overdue is false.
        test_recipe:
          setup:
            - "Clock default 2026-08-01T00:00:00Z; customer interval 90; asset installed 2026-05-03 -> next_due exactly 2026-08-01T00:00:00Z"
            - "One inspection IN_PROGRESS on the asset"
          setup_api_calls:
            - call: "POST /api/customers"
              payload: { name: "DueDateCo", inspection_interval_days: 90 }
              as: ShopManager
              captures: { cust_id: $.data.id }
            - call: "POST /api/equipment-assets"
              payload: { customer_id: "${cust_id}", asset_tag: "GR-01", machine_type: "grader", installed_at: "2026-05-03T00:00:00Z" }
              as: ShopManager
              captures: { asset_id: $.data.id, asset_v: $.data.version }
            - call: "POST /api/equipment-assets/${asset_id}/inspections"
              payload: { expected_equipment_asset_version: "${asset_v}", scheduled_window_start: "2026-07-30T00:00:00Z", scheduled_window_end: "2026-08-02T00:00:00Z" }
              as: CounterSales
              captures: { insp_id: $.data.id }
            - call: "POST /api/inspections/${insp_id}/start"
              payload: {}
              as: FieldTechnician
          trigger:
            - call: "POST /api/inspections/${insp_id}/complete"
              payload: { result: "PASSED" }
              as: FieldTechnician
              captures: { was_overdue: $.data.was_overdue }
            - call: "GET /api/equipment-assets/${asset_id}"
              as: ShopManager
          assert:
            - "Inspection.${insp_id}.performed_at == 2026-08-01T00:00:00Z (logical clock)"
            - "Inspection.${insp_id}.was_overdue == false (performed_at == next_due_date; strictly-greater rule)"
            - "EquipmentAsset.${asset_id}.next_due_date == 2026-10-30T00:00:00Z (2026-08-01 + 90d)"
            - "EquipmentAsset.${asset_id}.compliance_posture == COMPLIANT"

  # ===================================================================
  # Rule 7 — cross_entity_state_dependency (different entity pairs)
  # ===================================================================
  - rule_id: cross_entity_state_dependency
    instances:
      - name: confirm_blocked_by_depleted_reel
        grounds:
          - state_machines.AssemblyOrder.DRAFT_to_CONFIRMED
          - validations[priority=15]
          - entities.Reel.fields.status
        distinguishing_aspect: |
          Pair AssemblyOrder -> Reel: the DRAFT -> CONFIRMED transition is
          gated on the linked reel's status being AVAILABLE or LOW; once a
          prior order drains the reel to DEPLETED, a second order's confirm is
          rejected with ERR_REEL_NOT_USABLE.
        test_recipe:
          setup:
            - "Customer; reel 5000mm; order O1 cut 5000mm confirmed (reel now DEPLETED); order O2 cut 1000mm in DRAFT"
          setup_api_calls:
            - call: "POST /api/customers"
              payload: { name: "GateCo" }
              as: ShopManager
              captures: { cust_id: $.data.id }
            - call: "POST /api/reels"
              payload: { hose_sku: "PARK-387-8G", hose_diameter_in: 0.5, working_pressure_psi: 3000, price_per_meter_cents: 800, initial_length_mm: 5000 }
              as: ShopManager
              captures: { reel_id: $.data.id }
            - call: "POST /api/assembly-orders"
              payload:
                customer_id: "${cust_id}"
                reel_id: "${reel_id}"
                cut_length_mm: 5000
                required_working_pressure_psi: 2000
                crimp_diameter_spec_mm: 25.0
                estimated_labor_minutes: 10
              as: CounterSales
              captures: { o1_id: $.data.id }
            - call: "POST /api/assembly-orders/${o1_id}/confirm"
              payload: {}
              as: CounterSales
            - call: "POST /api/assembly-orders"
              payload:
                customer_id: "${cust_id}"
                reel_id: "${reel_id}"
                cut_length_mm: 1000
                required_working_pressure_psi: 2000
                crimp_diameter_spec_mm: 25.0
                estimated_labor_minutes: 10
              as: CounterSales
              captures: { o2_id: $.data.id }
          trigger:
            - call: "POST /api/assembly-orders/${o2_id}/confirm"
              payload: {}
              as: CounterSales
              captures: { err: $.data.error_id }
          assert:
            - "error_id == ERR_REEL_NOT_USABLE (reel.status DEPLETED gates AssemblyOrder confirm)"
            - "AssemblyOrder.${o2_id} remains DRAFT"

      - name: inspection_start_blocked_by_decommissioned_asset
        grounds:
          - state_machines.Inspection.SCHEDULED_to_IN_PROGRESS
          - validations[priority=16]
          - entities.EquipmentAsset.fields.status
        distinguishing_aspect: |
          Pair Inspection -> EquipmentAsset: the SCHEDULED -> IN_PROGRESS
          transition is gated on the asset being ACTIVE; a decommissioned asset
          rejects the start with ERR_ASSET_NOT_ACTIVE.
        test_recipe:
          setup:
            - "Customer; asset with a SCHEDULED inspection; asset then decommissioned"
          setup_api_calls:
            - call: "POST /api/customers"
              payload: { name: "DecomCo" }
              as: ShopManager
              captures: { cust_id: $.data.id }
            - call: "POST /api/equipment-assets"
              payload: { customer_id: "${cust_id}", asset_tag: "DR-01", machine_type: "drill", installed_at: "2026-07-01T00:00:00Z" }
              as: ShopManager
              captures: { asset_id: $.data.id, asset_v: $.data.version }
            - call: "POST /api/equipment-assets/${asset_id}/inspections"
              payload: { expected_equipment_asset_version: "${asset_v}", scheduled_window_start: "2026-08-03T00:00:00Z", scheduled_window_end: "2026-08-04T00:00:00Z" }
              as: CounterSales
              captures: { insp_id: $.data.id }
            - call: "POST /api/equipment-assets/${asset_id}/decommission"
              payload: {}
              as: ShopManager
          trigger:
            - call: "POST /api/inspections/${insp_id}/start"
              payload: {}
              as: FieldTechnician
              captures: { err: $.data.error_id }
          assert:
            - "error_id == ERR_ASSET_NOT_ACTIVE"
            - "Inspection.${insp_id} remains SCHEDULED"

  # ===================================================================
  # Rule 8 — resource_temporal_overlap (different interval semantics)
  # ===================================================================
  - rule_id: resource_temporal_overlap
    instances:
      - name: van_half_open_adjacency_allowed
        grounds:
          - validations[priority=12]
          - entities.ServiceDispatch.fields.window_start
          - entities.ServiceDispatch.fields.window_end
        distinguishing_aspect: |
          Resource = service van (via ServiceDispatch), interval semantics =
          half-open [window_start, window_end): a dispatch starting exactly when
          another ends is allowed, while a strictly overlapping one is rejected.
        test_recipe:
          setup:
            - "Customer; dispatch D1 on VAN-1 occupying 2026-08-02T09:00 -> 11:00 (REQUESTED)"
          setup_api_calls:
            - call: "POST /api/customers"
              payload: { name: "VanCo" }
              as: ShopManager
              captures: { cust_id: $.data.id }
            - call: "POST /api/service-dispatches"
              payload: { customer_id: "${cust_id}", van_id: "VAN-1", window_start: "2026-08-02T09:00:00Z", window_end: "2026-08-02T11:00:00Z" }
              as: CounterSales
              captures: { d1_id: $.data.id }
          trigger:
            - call: "POST /api/service-dispatches"
              payload: { customer_id: "${cust_id}", van_id: "VAN-1", window_start: "2026-08-02T11:00:00Z", window_end: "2026-08-02T12:00:00Z" }
              as: CounterSales
              captures: { d2_id: $.data.id }
            - call: "POST /api/service-dispatches"
              payload: { customer_id: "${cust_id}", van_id: "VAN-1", window_start: "2026-08-02T10:30:00Z", window_end: "2026-08-02T11:30:00Z" }
              as: CounterSales
              captures: { err: $.data.error_id }
          assert:
            - "Adjacent dispatch (11:00 start == 11:00 end) succeeds: ServiceDispatch.${d2_id}.status == REQUESTED"
            - "Overlapping dispatch (10:30-11:30) rejected: error_id == ERR_VAN_WINDOW_CONFLICT, HTTP 409"

      - name: inspection_closed_interval_touching_conflicts
        grounds:
          - validations[priority=13]
          - entities.Inspection.fields.scheduled_window_start
          - entities.Inspection.fields.scheduled_window_end
        distinguishing_aspect: |
          Resource = equipment asset (via Inspection), interval semantics =
          CLOSED intervals against IN_PROGRESS inspections: a new window whose
          start touches the existing window's end counts as overlap (unlike the
          van's half-open adjacency) and is rejected.
        test_recipe:
          setup:
            - "Customer; ACTIVE asset holding an IN_PROGRESS inspection with window 2026-08-10T00:00 -> 2026-08-12T00:00"
          setup_api_calls:
            - call: "POST /api/customers"
              payload: { name: "TouchCo" }
              as: ShopManager
              captures: { cust_id: $.data.id }
            - call: "POST /api/equipment-assets"
              payload: { customer_id: "${cust_id}", asset_tag: "RL-01", machine_type: "roller", installed_at: "2026-06-01T00:00:00Z" }
              as: ShopManager
              captures: { asset_id: $.data.id, asset_v: $.data.version }
            - call: "POST /api/equipment-assets/${asset_id}/inspections"
              payload: { expected_equipment_asset_version: "${asset_v}", scheduled_window_start: "2026-08-10T00:00:00Z", scheduled_window_end: "2026-08-12T00:00:00Z" }
              as: CounterSales
              captures: { i1_id: $.data.id }
            - call: "POST /api/inspections/${i1_id}/start"
              payload: {}
              as: FieldTechnician
            - call: "GET /api/equipment-assets/${asset_id}"
              as: ShopManager
              captures: { asset_v2: $.data.version }
          trigger:
            - call: "POST /api/equipment-assets/${asset_id}/inspections"
              payload: { expected_equipment_asset_version: "${asset_v2}", scheduled_window_start: "2026-08-12T00:00:00Z", scheduled_window_end: "2026-08-14T00:00:00Z" }
              as: CounterSales
              captures: { err: $.data.error_id }
          assert:
            - "error_id == ERR_INSPECTION_WINDOW_CONFLICT (touching endpoints count as overlap under closed semantics)"
            - "HTTP status == 409"
            - "Asset version was current (${asset_v2}) so the rejection is the overlap rule, not OCC"

  # ===================================================================
  # Rule 9 — compensating_invariant (different conserved quantities)
  # ===================================================================
  - rule_id: compensating_invariant
    instances:
      - name: reel_length_conservation
        grounds:
          - calculations.cut_waste_allocation
          - state_machines.AssemblyOrder.CONFIRMED_to_CANCELLED
          - entities.Reel.fields.remaining_length_mm
        distinguishing_aspect: |
          Conserved quantity = reel millimeters: initial_length_mm ==
          remaining_length_mm + scrap_length_mm + sum(cut_length_mm of
          non-DRAFT, non-CANCELLED orders). Confirm debits, cancel from
          CONFIRMED restores; 50000 == 42000 + 0 + 8000 holds end-to-end.
        test_recipe:
          setup:
            - "Customer; reel 50000mm; O1 cut 12000 confirmed; O2 cut 8000 confirmed"
          setup_api_calls:
            - call: "POST /api/customers"
              payload: { name: "InvCo" }
              as: ShopManager
              captures: { cust_id: $.data.id }
            - call: "POST /api/reels"
              payload: { hose_sku: "PARK-387-8I", hose_diameter_in: 0.5, working_pressure_psi: 3000, price_per_meter_cents: 800, initial_length_mm: 50000 }
              as: ShopManager
              captures: { reel_id: $.data.id }
            - call: "POST /api/assembly-orders"
              payload:
                customer_id: "${cust_id}"
                reel_id: "${reel_id}"
                cut_length_mm: 12000
                required_working_pressure_psi: 2000
                crimp_diameter_spec_mm: 25.0
                estimated_labor_minutes: 10
              as: CounterSales
              captures: { o1_id: $.data.id }
            - call: "POST /api/assembly-orders/${o1_id}/confirm"
              payload: {}
              as: CounterSales
            - call: "POST /api/assembly-orders"
              payload:
                customer_id: "${cust_id}"
                reel_id: "${reel_id}"
                cut_length_mm: 8000
                required_working_pressure_psi: 2000
                crimp_diameter_spec_mm: 25.0
                estimated_labor_minutes: 10
              as: CounterSales
              captures: { o2_id: $.data.id }
            - call: "POST /api/assembly-orders/${o2_id}/confirm"
              payload: {}
              as: CounterSales
          trigger:
            - call: "POST /api/assembly-orders/${o1_id}/cancel"
              payload: {}
              as: CounterSales
            - call: "GET /api/reels/${reel_id}"
              as: ShopManager
          assert:
            - "Reel.${reel_id}.remaining_length_mm == 42000 (50000 - 8000 still committed to O2)"
            - "Reel.${reel_id}.scrap_length_mm == 0"
            - "Invariant: 50000 == 42000 + 0 + 8000 (initial == remaining + scrap + committed cuts)"
            - "Reel.${reel_id}.status == AVAILABLE"

      - name: coupling_unit_conservation
        grounds:
          - state_machines.AssemblyOrder.TAGGED_to_COMPLETED
          - state_machines.AssemblyOrder.CONFIRMED_to_CANCELLED
          - entities.Coupling.fields.on_hand_qty
          - entities.Coupling.fields.reserved_qty
        distinguishing_aspect: |
          Conserved quantity = fitting units: on_hand_qty + sum(quantities
          shipped on COMPLETED orders) == total received (initial + receipts).
          Reservation at confirm moves nothing physically; completion ships;
          cancel releases the reservation; 12 + 3 == 15 holds.
        test_recipe:
          setup:
            - "Customer; reel 50000mm; coupling initial 10 + receipt 5 = 15 received; O1 (qty 3) confirmed; O2 (qty 4) confirmed"
          setup_api_calls:
            - call: "POST /api/customers"
              payload: { name: "UnitCo" }
              as: ShopManager
              captures: { cust_id: $.data.id }
            - call: "POST /api/reels"
              payload: { hose_sku: "PARK-387-8U", hose_diameter_in: 0.5, working_pressure_psi: 3000, price_per_meter_cents: 800, initial_length_mm: 50000 }
              as: ShopManager
              captures: { reel_id: $.data.id }
            - call: "POST /api/couplings"
              payload: { coupling_sku: "1CA43-8-8U", size_in: 0.5, unit_price_cents: 1200, initial_on_hand_qty: 10 }
              as: ShopManager
              captures: { coup_id: $.data.id }
            - call: "POST /api/couplings/${coup_id}/receipts"
              payload: { quantity: 5 }
              as: ShopManager
            - call: "POST /api/assembly-orders"
              payload:
                customer_id: "${cust_id}"
                reel_id: "${reel_id}"
                cut_length_mm: 1000
                required_working_pressure_psi: 2000
                crimp_diameter_spec_mm: 25.0
                estimated_labor_minutes: 10
                lines: [ { coupling_id: "${coup_id}", quantity: 3 } ]
              as: CounterSales
              captures: { o1_id: $.data.id }
            - call: "POST /api/assembly-orders/${o1_id}/confirm"
              payload: {}
              as: CounterSales
            - call: "POST /api/assembly-orders"
              payload:
                customer_id: "${cust_id}"
                reel_id: "${reel_id}"
                cut_length_mm: 1000
                required_working_pressure_psi: 2000
                crimp_diameter_spec_mm: 25.0
                estimated_labor_minutes: 10
                lines: [ { coupling_id: "${coup_id}", quantity: 4 } ]
              as: CounterSales
              captures: { o2_id: $.data.id }
            - call: "POST /api/assembly-orders/${o2_id}/confirm"
              payload: {}
              as: CounterSales
            - call: "POST /api/assembly-orders/${o1_id}/complete-build"
              payload: { measured_crimp_diameter_mm: 25.0, actual_labor_minutes: 10 }
              as: ShopTechnician
            - call: "POST /api/assembly-orders/${o1_id}/record-pressure-test"
              payload: { test_pressure_psi: 4000, result: "PASSED" }
              as: ShopTechnician
            - call: "POST /api/assembly-orders/${o1_id}/tag"
              payload: { tag_serial: "TAG-UNIT1" }
              as: ShopTechnician
            - call: "POST /api/assembly-orders/${o1_id}/complete"
              payload: {}
              as: CounterSales
          trigger:
            - call: "POST /api/assembly-orders/${o2_id}/cancel"
              payload: {}
              as: CounterSales
            - call: "GET /api/couplings/${coup_id}"
              as: ShopManager
          assert:
            - "Coupling.${coup_id}.on_hand_qty == 12 (15 received - 3 shipped on completed O1)"
            - "Coupling.${coup_id}.reserved_qty == 0 (O2's reservation of 4 released by cancel)"
            - "Coupling.${coup_id}.available_qty == 12"
            - "Invariant: 12 on_hand + 3 shipped == 15 received"
