      - name: installment_release_is_a_conditional_action_on_the_release_window
        claim_type: conditional_action
        grounds:
          - endpoints[POST /festival-ops/payment-installments/{id}/release]
          - validations[priority 58]
          - errors[ERR_PAYMENT_NOT_RELEASABLE]
        distinguishing_aspect: |
          The same call on the same row flips outcome purely on the logical clock:
          RELEASE_WINDOW_DAYS is 7 and the boundary instant itself is releasable, so
          2026-08-23T23:59:59Z is a 409 and 2026-08-24T00:00:00Z is a 200 for a
          deposit due 2026-08-31. The BALANCE installment due 2026-12-04 stays
          unreleasable at that clock, which shows the window is per-row rather than
          per-booking.
        test_recipe:
          setup:
            - "Canonical base fixture with a countersigned Nova Kade booking; the DEPOSIT installment is 900000 due 2026-08-31 and the BALANCE installment is 900000 due 2026-12-04."
          setup_api_calls:
            - call: "POST /festival-ops/_clock/set_current_utc"
              payload: { current_utc: "2026-08-01T00:00:00Z" }
              as: TalentBuyer
