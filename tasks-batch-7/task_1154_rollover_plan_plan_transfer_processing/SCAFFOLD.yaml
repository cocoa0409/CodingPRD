# =============================================================================
# Task 1154 — Rollover & Plan-to-Plan Transfer Processing (retirement plan recordkeeper)
# =============================================================================

scenario: |
  1154. Rollover & Plan-to-Plan Transfer Processing (retirement plan recordkeeper): distribution eligibility & required documentation, direct vs indirect rollover election & 20% withholding, receiving plan acceptance & source verification, after-tax/Roth basis tracking through rollover, incomplete rollover follow-up & 60-day rule, in-plan Roth conversion processing, transfer of loans between plans, tax reporting (1099-R/5498) accuracy

domain_name: rollover-plan-transfer
api_prefix: /v1

complexity_profile:
  primary_archetype: compliance_audit
  secondary_archetype: ledger_reconciliation
  complexity_layers: [optimistic_concurrency, cascading_side_effects, dual_variant_calculation, scheduled_actions]
  entity_topology: flat
  state_machine_shape: branching
  relationship_patterns: [one_to_many, cross_aggregate, polymorphic, self_referential]
  role_model: segregation_of_duties
  consistency_model: immediate

# =============================================================================
# §1.1 Entity-Relationship Table
# =============================================================================
entities:
  - name: Plan
    parent: null
    common_fields: true
    fields:
      - { name: plan_name, type: string, source: input, description: "Plan name" }
      - { name: plan_type, type: enum, source: input, description: "PLAN_401K | PLAN_403B | PLAN_457B | IRA", constraints: "one of the four enum members" }
      - { name: status, type: enum, source: system, default: ACTIVE, description: "ACTIVE | FROZEN | TERMINATED; FROZEN blocks new cases and cascades SUSPENDED onto open cases; TERMINATED grants PLAN_TERMINATION qualifying event", constraints: "enum" }
      - { name: accepts_incoming_rollovers, type: boolean, source: input, default: true, description: "Whether the plan accepts inbound rollover credits (ROLLOVER_IN)" }
      - { name: accepts_incoming_transfers, type: boolean, source: input, default: true, description: "Whether the plan accepts plan-to-plan transfers in" }
      - { name: accepts_loan_transfers, type: boolean, source: input, default: true, description: "Whether the plan accepts loan notes transferred with a plan-to-plan transfer" }
      - { name: accepts_after_tax_basis, type: boolean, source: input, default: true, description: "Whether the plan accepts after-tax (non-Roth) basis on inbound money" }
      - { name: allows_in_plan_roth_conversion, type: boolean, source: input, default: true, description: "Whether in-plan Roth conversions are permitted" }
      - { name: requires_spousal_consent, type: boolean, source: input, default: true, description: "Whether married participants need spousal consent for money leaving the plan" }
      - { name: spousal_consent_threshold_cents, type: integer, source: input, default: 500000, description: "Spousal consent required only when vested_balance_cents is STRICTLY GREATER than this threshold (>$5,000 statutory default)" }

  - name: PlanFreezeWindow
    parent: null
    common_fields: true
    fields:
      - { name: plan_id, type: string, source: input, description: "FK -> Plan.id; the plan whose processing is blacked out" }
      - { name: start_date, type: string, source: input, description: "Inclusive window start, ISO date YYYY-MM-DD" }
      - { name: end_date, type: string, source: input, description: "Inclusive window end, ISO date; closed-interval semantics: end_date is inside the window; start_date must be <= end_date" }
      - { name: reason, type: string, source: input, description: "Free-text reason (e.g., plan conversion blackout)" }

  - name: Participant
    parent: null
    common_fields: true
    fields:
      - { name: full_name, type: string, source: input, description: "Participant legal name" }
      - { name: date_of_birth, type: string, source: input, description: "ISO date YYYY-MM-DD; age computed against the logical clock" }
      - { name: employment_status, type: enum, source: input, description: "ACTIVE | SEPARATED | RETIRED | DISABLED", constraints: "enum" }
      - { name: separation_date, type: string, source: input, required: false, description: "ISO date of separation; required when employment_status is SEPARATED or RETIRED" }
      - { name: marital_status, type: enum, source: input, description: "SINGLE | MARRIED | WIDOWED | DIVORCED", constraints: "enum" }
      - { name: age_months, type: integer, source: computed, description: "Complete calendar months between date_of_birth and the logical clock date: (year diff)*12 + month diff, minus 1 when the clock day-of-month is earlier than the birth day-of-month" }
      - { name: current_age_years, type: number, source: computed, description: "trunc(age_months / 12, 2 decimal places)" }

  - name: Account
    parent: null
    common_fields: true
    fields:
      - { name: participant_id, type: string, source: input, description: "FK -> Participant.id; owner of the account" }
      - { name: plan_id, type: string, source: input, description: "FK -> Plan.id; the plan holding this account" }
      - { name: status, type: enum, source: system, default: ACTIVE, description: "ACTIVE | CLOSED; auto-CLOSED when total_balance_cents reaches 0 on a case terminal transition (COMPLETED/INCOMPLETE) or on execute-transfer", constraints: "enum" }
      - { name: total_balance_cents, type: integer, source: computed, description: "Sum over MoneySourceBalance rows (status-agnostic) of balance_cents" }
      - { name: vested_balance_cents, type: integer, source: computed, description: "Sum over MoneySourceBalance rows of floor(balance_cents * vested_pct / 100) per row, per vested_balance calculation" }
      - { name: basis_cents, type: integer, source: computed, description: "Sum over MoneySourceBalance rows of basis_cents (after-tax + Roth tax-paid basis)" }

  - name: MoneySourceBalance
    parent: null
    common_fields: true
    fields:
      - { name: account_id, type: string, source: input, description: "FK -> Account.id; owning account" }
      - { name: source_type, type: enum, source: input, description: "PRE_TAX | EMPLOYER_PRETAX | ROTH | AFTER_TAX", constraints: "enum; unique per account (one row per (account_id, source_type))" }
      - { name: balance_cents, type: integer, source: input, description: "Current market value of this source; >= 0; basis_cents <= balance_cents must hold whenever basis_cents > 0" }
      - { name: basis_cents, type: integer, source: input, default: 0, description: "Tax basis in this source (after-tax contributions; Roth tax-paid amounts); >= 0 and <= balance_cents" }
      - { name: vested_pct, type: integer, source: input, default: 100, description: "Vesting percentage 0..100; non-employer sources are always 100" }

  - name: Loan
    parent: null
    common_fields: true
    fields:
      - { name: account_id, type: string, source: input, description: "FK -> Account.id; account currently holding the loan note (mutates on transfer)" }
      - { name: outstanding_balance_cents, type: integer, source: input, description: "Principal + accrued interest outstanding; > 0" }
      - { name: interest_rate_bp, type: integer, source: input, description: "Annual interest rate in basis points, 0..5000" }
      - { name: term_months, type: integer, source: input, description: "Original term in months, 1..360" }
      - { name: status, type: enum, source: system, default: ACTIVE, description: "ACTIVE | TRANSFERRED | OFFSET", constraints: "enum" }
      - { name: offset_at, type: datetime, source: system, required: false, description: "Logical-clock timestamp when the loan was offset; null until OFFSET" }
      - { name: offset_qualified, type: boolean, source: computed, required: false, description: "Qualified plan loan offset flag: true iff at offset time the participant's employment_status is SEPARATED or RETIRED, or the holding plan's status is TERMINATED" }
      - { name: offset_rollover_deadline, type: string, source: computed, required: false, description: "ISO date deadline to roll over the offset amount; variant per offset_qualified — see loan_offset_window calculation" }
      - { name: offset_repaid_cents, type: integer, source: system, default: 0, description: "Cumulative CREDITED redeposits applied to this offset loan" }

  - name: RolloverCase
    parent: null
    common_fields: true
    fields:
      - { name: case_type, type: enum, source: input, description: "DIRECT_ROLLOVER_OUT | INDIRECT_ROLLOVER_OUT | PLAN_TRANSFER | IN_PLAN_ROTH_CONVERSION | ROLLOVER_IN", constraints: "enum" }
      - { name: source_account_id, type: string, source: input, required: false, description: "FK -> Account.id; required for DIRECT_ROLLOVER_OUT, INDIRECT_ROLLOVER_OUT, PLAN_TRANSFER, IN_PLAN_ROTH_CONVERSION; null for ROLLOVER_IN (external source)" }
      - { name: receiving_account_id, type: string, source: input, required: false, description: "FK -> Account.id; required for ROLLOVER_IN, PLAN_TRANSFER, and IN_PLAN_ROTH_CONVERSION (same account as source for conversion); must be an ACTIVE account of the same participant and, for PLAN_TRANSFER, held at receiving_plan_id; null otherwise" }
      - { name: receiving_plan_id, type: string, source: input, required: false, description: "FK -> Plan.id; internal receiving plan (polymorphic with receiving_institution_name — exactly one of the two is set for outbound types)" }
      - { name: receiving_institution_name, type: string, source: input, required: false, description: "External receiving institution name when receiving_plan_id is null (polymorphic destination)" }
      - { name: requested_amount_cents, type: integer, source: input, required: false, description: "Partial amount requested; null means full vested balance (full balance incl. unvested for PLAN_TRANSFER); > 0 when present" }
      - { name: withholding_acknowledged, type: boolean, source: input, default: false, description: "Participant acknowledgement of the mandatory 20% federal withholding; must be true at submit for INDIRECT_ROLLOVER_OUT" }
      - { name: status, type: enum, source: system, default: DRAFT, description: "DRAFT | DOCS_PENDING | ELIGIBILITY_REVIEW | ELIGIBLE | DENIED | DISBURSED | AWAITING_REDEPOSIT | ACCEPTANCE_PENDING | SUSPENDED | COMPLETED | INCOMPLETE | CANCELLED", constraints: "enum" }
      - { name: prior_status, type: enum, source: system, required: false, description: "Status to restore on plan unfreeze; set when a case is SUSPENDED by a plan freeze cascade" }
      - { name: qualifying_event, type: enum, source: computed, required: false, description: "PLAN_TERMINATION | SEPARATION | DISABILITY | AGE_59_HALF | NONE; evaluated at submit per eligibility_determination" }
      - { name: gross_cents, type: integer, source: computed, required: false, description: "Gross distribution amount locked at issue-disbursement (or execute-conversion)" }
      - { name: basis_portion_cents, type: integer, source: computed, required: false, description: "Tax basis inside gross_cents per source_allocation" }
      - { name: taxable_cents, type: integer, source: computed, required: false, description: "= gross_cents - basis_portion_cents" }
      - { name: withholding_cents, type: integer, source: computed, required: false, description: "Mandatory federal withholding per indirect_withholding; 0 for DIRECT/TRANSFER; conversions never withhold" }
      - { name: net_cents, type: integer, source: computed, required: false, description: "= gross_cents - withholding_cents" }
      - { name: forfeiture_cents, type: integer, source: computed, default: 0, description: "Unvested employer money forfeited when a full outbound distribution/transfer of vested balance executes" }
      - { name: disbursement_issued_date, type: string, source: system, required: false, description: "ISO date (logical clock) when the disbursement was issued; basis of the 60-day deadline" }
      - { name: rollover_deadline_date, type: string, source: computed, required: false, description: "= disbursement_issued_date + 60 calendar days, inclusive" }
      - { name: credited_total_cents, type: integer, source: computed, default: 0, description: "Sum of CREDITED Redeposit.amount_cents linked to this case (status filter: CREDITED only)" }
      - { name: eligibility_decided_by, type: string, source: system, required: false, description: "X-User-ID of the RolloverProcessor who ran decide-eligibility; segregation-of-duties anchor" }
      - { name: denial_reason, type: string, source: system, required: false, description: "Free text when decide-eligibility denies" }

  - name: RequiredDocument
    parent: null
    common_fields: true
    fields:
      - { name: rollover_case_id, type: string, source: system, description: "FK -> RolloverCase.id; owning case" }
      - { name: doc_type, type: enum, source: system, description: "SPOUSAL_CONSENT | SEPARATION_VERIFICATION | DISABILITY_PROOF | IDENTITY_PROOF | RECEIVING_PLAN_ACCEPTANCE | SOURCE_PLAN_STATEMENT", constraints: "enum; at most one row per (rollover_case_id, doc_type)" }
      - { name: status, type: enum, source: system, default: REQUIRED, description: "REQUIRED | SUBMITTED | ACCEPTED | REJECTED", constraints: "enum" }
      - { name: submitted_by, type: string, source: system, required: false, description: "X-User-ID of the submitting Participant" }
      - { name: reviewed_by, type: string, source: system, required: false, description: "X-User-ID of the reviewing RolloverProcessor" }
      - { name: review_note, type: string, source: system, required: false, description: "Reviewer note, mandatory when decision is REJECTED" }

  - name: SourcePlanVerification
    parent: null
    common_fields: true
    fields:
      - { name: rollover_case_id, type: string, source: input, description: "FK -> RolloverCase.id; case this verification gates" }
      - { name: direction, type: enum, source: input, description: "OUTBOUND (verify the receiving plan is qualified before we send) | INBOUND (verify the source plan before we credit)", constraints: "enum" }
      - { name: method, type: enum, source: input, description: "PLAN_LETTER | IRS_FORM_LOOKUP | THIRD_PARTY_REGISTRY", constraints: "enum" }
      - { name: status, type: enum, source: system, default: PENDING, description: "PENDING | VERIFIED | FAILED", constraints: "enum" }
      - { name: verified_at, type: datetime, source: system, required: false, description: "Logical-clock timestamp when completed VERIFIED" }

  - name: Disbursement
    parent: null
    common_fields: true
    fields:
      - { name: rollover_case_id, type: string, source: system, description: "FK -> RolloverCase.id; owning case" }
      - { name: method, type: enum, source: input, description: "CHECK | ACH | WIRE | INTERNAL_BOOK_ENTRY", constraints: "enum" }
      - { name: gross_cents, type: integer, source: computed, description: "Snapshot of case gross at issuance" }
      - { name: withholding_cents, type: integer, source: computed, description: "Snapshot of case withholding at issuance" }
      - { name: net_cents, type: integer, source: computed, description: "Snapshot of case net at issuance; invariant gross_cents == withholding_cents + net_cents always holds" }
      - { name: issued_date, type: string, source: system, required: false, description: "ISO date when ISSUED" }
      - { name: status, type: enum, source: system, default: PENDING, description: "PENDING | ISSUED | RETURNED | CANCELLED", constraints: "enum" }

  - name: Redeposit
    parent: null
    common_fields: true
    fields:
      - { name: rollover_case_id, type: string, source: input, required: false, description: "FK -> RolloverCase.id; set when the deposit satisfies an INDIRECT_ROLLOVER_OUT case" }
      - { name: loan_id, type: string, source: input, required: false, description: "FK -> Loan.id; set when the deposit rolls over a loan offset" }
      - { name: receiving_account_id, type: string, source: input, description: "FK -> Account.id; account receiving the funds (must belong to the same participant as the case/loan)" }
      - { name: amount_cents, type: integer, source: input, description: "Deposit amount; > 0" }
      - { name: received_date, type: string, source: input, description: "ISO date funds were received; drives the 60-day / offset-window deadline checks" }
      - { name: status, type: enum, source: system, default: PENDING_VERIFICATION, description: "PENDING_VERIFICATION | CREDITED | REJECTED", constraints: "enum" }

  - name: FollowUpNotice
    parent: null
    common_fields: true
    fields:
      - { name: rollover_case_id, type: string, source: system, description: "FK -> RolloverCase.id; owning indirect case" }
      - { name: notice_seq, type: integer, source: system, description: "1, 2, or 3 — scheduled at issue+30, issue+45, issue+55 days respectively" }
      - { name: scheduled_date, type: string, source: system, description: "ISO date the notice becomes due (issue_date + 30/45/55 per notice_seq)" }
      - { name: status, type: enum, source: system, default: SCHEDULED, description: "SCHEDULED | SENT | SKIPPED (case reached a terminal state before scheduled_date)", constraints: "enum" }
      - { name: days_remaining, type: integer, source: computed, required: false, description: "Set when SENT: rollover_deadline_date - sent date, in days" }
      - { name: outstanding_cents, type: integer, source: computed, required: false, description: "Set when SENT: gross_cents - credited_total_cents at send time" }

  - name: TaxForm
    parent: null
    common_fields: true
    fields:
      - { name: form_type, type: enum, source: system, description: "FORM_1099_R | FORM_5498", constraints: "enum" }
      - { name: tax_year, type: integer, source: computed, description: "Tax year of the triggering event: issue year for 1099-R; credit year for 5498 (may span year-end for indirect rollovers)" }
      - { name: participant_id, type: string, source: system, description: "FK -> Participant.id; recipient" }
      - { name: rollover_case_id, type: string, source: system, required: false, description: "FK -> RolloverCase.id; originating case when applicable" }
      - { name: loan_id, type: string, source: system, required: false, description: "FK -> Loan.id; originating loan when a loan offset 1099-R" }
      - { name: gross_distribution_cents, type: integer, source: computed, required: false, description: "1099-R box 1: gross distribution" }
      - { name: taxable_amount_cents, type: integer, source: computed, required: false, description: "1099-R box 2a; provisional vs corrected variant per tax_form_amounts" }
      - { name: federal_withholding_cents, type: integer, source: computed, required: false, description: "1099-R box 4" }
      - { name: distribution_code, type: enum, source: computed, required: false, description: "CODE_1 (early, age < 59.5 at issue) | CODE_7 (age >= 59.5) | CODE_G (direct rollover, taxable 0)", constraints: "enum" }
      - { name: rollover_contribution_cents, type: integer, source: computed, required: false, description: "5498 box 2: rollover contributions received in tax_year (aggregated)" }
      - { name: fair_market_value_cents, type: integer, source: computed, required: false, description: "5498 box 5: receiving account total_balance_cents snapshot at credit time" }
      - { name: status, type: enum, source: system, default: DRAFT, description: "DRAFT | ISSUED | SUPERSEDED", constraints: "enum" }
      - { name: supersedes_id, type: string, source: system, required: false, description: "FK -> TaxForm.id; self-reference: the earlier form this correction replaces" }
      - { name: revision, type: integer, source: system, default: 0, description: "0 for the original; increments per correction" }

# =============================================================================
# §1.2 State Machine Table
# =============================================================================
state_machines:
  - entity: Plan
    initial_state: ACTIVE
    terminal_states: []
    transitions:
      - from: ACTIVE
        to: FROZEN
        trigger: "POST /v1/plans/{planId}/freeze"
        actor: PlanSponsorAdmin
        preconditions:
          - "Plan.status == ACTIVE (ERR_PLAN_FROZEN if already FROZEN; ERR_PLAN_TERMINATED if TERMINATED)"
        side_effects:
          - "CASCADE link 1: every RolloverCase whose source_account_id or receiving_account_id resolves to an Account with plan_id == this plan AND whose status is non-terminal (DRAFT, SUBMITTED, DOCS_PENDING, ELIGIBILITY_REVIEW, ELIGIBLE, DISBURSED, AWAITING_REDEPOSIT, ACCEPTANCE_PENDING) records prior_status := status and transitions to SUSPENDED"
          - "CASCADE link 2 (caused by link 1): every Disbursement with rollover_case_id pointing at a case that just became SUSPENDED AND status == PENDING transitions to CANCELLED"
          - "CASCADE link 3 (caused by link 2): each CANCELLED disbursement restores the debited source balances — every MoneySourceBalance row of the case's source account is credited back exactly the amount that source contributed at issuance (full reversal of the issue-time debit, per cancel_disbursement invariant); Account.vested_balance_cents / total_balance_cents recompute"
      - from: FROZEN
        to: ACTIVE
        trigger: "POST /v1/plans/{planId}/unfreeze"
        actor: PlanSponsorAdmin
        preconditions:
          - "Plan.status == FROZEN (ERR_PLAN_NOT_FROZEN otherwise)"
        side_effects:
          - "Every RolloverCase SUSPENDED with prior_status set AND resolving to this plan returns to its prior_status; prior_status cleared"
      - from: ACTIVE
        to: TERMINATED
        trigger: "POST /v1/plans/{planId}/terminate"
        actor: PlanSponsorAdmin
        preconditions:
          - "Plan.status == ACTIVE (ERR_PLAN_TERMINATED if already TERMINATED)"
        side_effects:
          - "No cascade on cases; existing cases continue; termination grants PLAN_TERMINATION qualifying event for future submits"

  - entity: RolloverCase
    initial_state: DRAFT
    terminal_states: [COMPLETED, INCOMPLETE, DENIED, CANCELLED]
    transitions:
      - from: DRAFT
        to: DOCS_PENDING
        trigger: "POST /v1/rollover-cases/{caseId}/submit"
        actor: Participant
        preconditions:
          - "Acting participant owns the source (or receiving, for ROLLOVER_IN) account (ERR_CASE_NOT_FOUND when not owned — no existence leak)"
          - "Source plan status == ACTIVE (ERR_PLAN_FROZEN when FROZEN; ERR_PLAN_TERMINATED does NOT block — termination is itself a qualifying event)"
          - "Source account status == ACTIVE (ERR_ACCOUNT_NOT_ACTIVE)"
          - "Eligibility snapshot: qualifying_event != NONE for outbound types (ERR_NOT_ELIGIBLE); ROLLOVER_IN and IN_PLAN_ROTH_CONVERSION are exempt from qualifying-event requirement"
          - "INDIRECT_ROLLOVER_OUT requires withholding_acknowledged == true (ERR_WITHHOLDING_ACK_REQUIRED)"
          - "Receiving plan capability gate: PLAN_TRANSFER requires receiving plan accepts_incoming_transfers; ROLLOVER_IN requires accepts_incoming_rollovers; IN_PLAN_ROTH_CONVERSION requires allows_in_plan_roth_conversion; after-tax basis present in scope requires receiving plan accepts_after_tax_basis; loan-bearing transfer requires accepts_loan_transfers (ERR_PLAN_CAPABILITY_REJECTED)"
          - "PLAN_TRANSFER requires receiving_plan_id != source account's plan_id (ERR_SAME_PLAN_TRANSFER)"
          - "No other non-terminal RolloverCase on the same source account (ERR_OPEN_CASE_EXISTS) — occupation interval is [creation, terminal state), half-open"
          - "requested_amount_cents null or <= vested_balance_cents (ERR_AMOUNT_EXCEEDS_VESTED); PLAN_TRANSFER ignores this check (moves full vested balance)"
        side_effects:
          - "Compute qualifying_event via eligibility_determination and store it"
          - "Compute required-document set per required_document_rules and insert RequiredDocument rows with status REQUIRED"
          - "Routing inside the same request: if the required-document set is empty, status becomes ELIGIBILITY_REVIEW; otherwise DOCS_PENDING"
      - from: DOCS_PENDING
        to: ELIGIBILITY_REVIEW
        trigger: "system: last outstanding RequiredDocument on the case leaves REQUIRED (bubble-up from document submit/review)"
        actor: system
        preconditions:
          - "No RequiredDocument row of the case is in REQUIRED (every row is SUBMITTED or ACCEPTED)"
        side_effects: []
      - from: ELIGIBILITY_REVIEW
        to: DOCS_PENDING
        trigger: "POST /v1/rollover-cases/{caseId}/decide-eligibility with decision REQUEST_DOCS"
        actor: RolloverProcessor
        preconditions:
          - "Case status == ELIGIBILITY_REVIEW (ERR_CASE_INVALID_STATE)"
        side_effects:
          - "New RequiredDocument rows (per request_doc_types input) inserted with status REQUIRED (cycle: review may demand more docs repeatedly)"
      - from: ELIGIBILITY_REVIEW
        to: ELIGIBLE
        trigger: "POST /v1/rollover-cases/{caseId}/decide-eligibility with decision APPROVE"
        actor: RolloverProcessor
        preconditions:
          - "Case status == ELIGIBILITY_REVIEW (ERR_CASE_INVALID_STATE)"
          - "All RequiredDocument rows ACCEPTED (ERR_DOCUMENTS_OUTSTANDING)"
        side_effects:
          - "eligibility_decided_by := X-User-ID (segregation-of-duties anchor)"
      - from: ELIGIBILITY_REVIEW
        to: DENIED
        trigger: "POST /v1/rollover-cases/{caseId}/decide-eligibility with decision DENY"
        actor: RolloverProcessor
        preconditions:
          - "Case status == ELIGIBILITY_REVIEW (ERR_CASE_INVALID_STATE)"
          - "denial_reason present (ERR_VALIDATION)"
        side_effects:
          - "denial_reason stored"
      - from: ELIGIBLE
        to: ELIGIBLE
        trigger: "POST /v1/rollover-cases/{caseId}/issue-disbursement (assembles the disbursement; money moves only when the disbursement itself is issued)"
        actor: RolloverProcessor
        preconditions:
          - "Case status == ELIGIBLE and case_type in {DIRECT_ROLLOVER_OUT, INDIRECT_ROLLOVER_OUT} (ERR_CASE_INVALID_STATE)"
          - "Segregation of duties: X-User-ID != eligibility_decided_by (ERR_SOD_VIOLATION)"
          - "No non-CANCELLED Disbursement exists for the case (ERR_DISBURSEMENT_ALREADY_EXISTS)"
          - "DIRECT_ROLLOVER_OUT: an OUTBOUND SourcePlanVerification on this case with status VERIFIED exists (ERR_VERIFICATION_NOT_VERIFIED)"
        side_effects:
          - "Run source_allocation over the source account for the elected amount; run indirect_withholding; lock gross/basis/taxable/withholding/net on the case"
          - "Create Disbursement with status PENDING"
          - "Debit each MoneySourceBalance row by its allocated amount (ledger sync); Account balances recompute"
          - "Full-vested election forfeits unvested employer remainder: forfeiture_cents set, unvested employer balance zeroed"
      - from: ELIGIBLE
        to: DISBURSED
        trigger: "POST /v1/disbursements/{disbId}/issue for case_type DIRECT_ROLLOVER_OUT"
        actor: RolloverProcessor
        preconditions:
          - "Per the Disbursement PENDING -> ISSUED transition"
        side_effects:
          - "disbursement_issued_date := logical clock date (first issuance only; never overwritten by reissue)"
          - "Create DRAFT 1099-R with distribution_code CODE_G, taxable_amount_cents 0"
      - from: ELIGIBLE
        to: AWAITING_REDEPOSIT
        trigger: "POST /v1/disbursements/{disbId}/issue for case_type INDIRECT_ROLLOVER_OUT"
        actor: RolloverProcessor
        preconditions:
          - "Per the Disbursement PENDING -> ISSUED transition"
        side_effects:
          - "disbursement_issued_date := logical clock date (first issuance only; never overwritten by reissue)"
          - "rollover_deadline_date := disbursement_issued_date + 60 days"
          - "First issuance only: create 3 FollowUpNotice rows (seq 1/2/3, scheduled issue+30/+45/+55 days, SCHEDULED) and the provisional DRAFT 1099-R (taxable_amount_cents = taxable_cents)"
      - from: AWAITING_REDEPOSIT
        to: COMPLETED
        trigger: "system: a Redeposit CREDITED brings credited_total_cents >= gross_cents"
        actor: system
        preconditions:
          - "credited_total_cents >= gross_cents after the credit"
        side_effects:
          - "CASCADE: remaining SCHEDULED FollowUpNotice rows -> SKIPPED"
          - "CASCADE: DRAFT 1099-R recomputed with corrected variant (taxable reduced per tax_form_amounts); if the 1099-R is already ISSUED, a correction revision is auto-created (status SUPERSEDED on the old row, new row ISSUED with revision+1, supersedes_id set)"
      - from: AWAITING_REDEPOSIT
        to: INCOMPLETE
        trigger: "system: POST /v1/sweeps/daily finds logical clock date > rollover_deadline_date with credited_total_cents < gross_cents"
        actor: system
        preconditions:
          - "clock date > rollover_deadline_date AND credited_total_cents < gross_cents"
        side_effects:
          - "CASCADE link 1: remaining SCHEDULED FollowUpNotice rows -> SKIPPED"
          - "CASCADE link 2 (caused by the INCOMPLETE transition): DRAFT 1099-R taxable_amount_cents recomputed as taxable_cents - min(credited_total_cents, taxable_cents); if ISSUED, auto-correction revision as above"
      - from: ELIGIBLE
        to: ACCEPTANCE_PENDING
        trigger: "POST /v1/rollover-cases/{caseId}/issue-disbursement is NOT used for PLAN_TRANSFER; instead case sits in ACCEPTANCE_PENDING via submit-branch — see note"
        actor: system
        preconditions: []
        side_effects: []
        note: "PLAN_TRANSFER and ROLLOVER_IN cases move ELIGIBLE -> ACCEPTANCE_PENDING implicitly at decide-eligibility APPROVE when case_type is PLAN_TRANSFER or ROLLOVER_IN (the APPROVE side effect routes by type); outbound money types route to ELIGIBLE"
      - from: ACCEPTANCE_PENDING
        to: COMPLETED
        trigger: "POST /v1/rollover-cases/{caseId}/execute-transfer (PLAN_TRANSFER) or POST /v1/rollover-cases/{caseId}/post-credit (ROLLOVER_IN)"
        actor: RolloverProcessor
        preconditions:
          - "Case status == ACCEPTANCE_PENDING (ERR_CASE_INVALID_STATE)"
          - "Segregation of duties: X-User-ID != eligibility_decided_by (ERR_SOD_VIOLATION)"
          - "PLAN_TRANSFER: zero Loan rows with status ACTIVE on the source account (ERR_LOANS_OUTSTANDING) — loans must be TRANSFERRED or OFFSET first"
          - "ROLLOVER_IN: an INBOUND SourcePlanVerification with status VERIFIED exists (ERR_VERIFICATION_NOT_VERIFIED); receiving plan accepts_after_tax_basis when after_tax_basis_cents > 0 in the breakdown (ERR_PLAN_CAPABILITY_REJECTED)"
        side_effects:
          - "PLAN_TRANSFER: every MoneySourceBalance row moves book-entry to the receiving account preserving balance_cents, basis_cents, vested_pct per source (basis tracking; unvested employer money moves too — a transfer is not a distribution, so no forfeiture); rows are copied in source_type enum order AFTER_TAX, EMPLOYER_PRETAX, PRE_TAX, ROTH; source account balances zeroed and status -> CLOSED; receiving account balances recompute; NO 1099-R is produced (non-taxable transfer); case -> COMPLETED"
          - "ROLLOVER_IN: receiving account MoneySourceBalance rows credited per breakdown (pre_tax_cents -> PRE_TAX, roth_cents -> ROTH with basis, after_tax_basis_cents -> AFTER_TAX with basis); DRAFT 5498 for the credit tax_year created or updated (rollover_contribution_cents += total, fair_market_value_cents = receiving account total_balance_cents snapshot); case -> COMPLETED"
      - from: ELIGIBLE
        to: COMPLETED
        trigger: "POST /v1/rollover-cases/{caseId}/execute-conversion"
        actor: RolloverProcessor
        preconditions:
          - "Case status == ELIGIBLE and case_type == IN_PLAN_ROTH_CONVERSION (ERR_CASE_INVALID_STATE)"
          - "Segregation of duties: X-User-ID != eligibility_decided_by (ERR_SOD_VIOLATION)"
        side_effects:
          - "Run source_allocation restricted to PRE_TAX + AFTER_TAX sources for the elected amount; lock gross/basis/taxable; withholding always 0"
          - "Debit elected sources; credit ROTH source: balance += gross_cents, basis += gross_cents (converted amounts are tax-paid basis)"
          - "Create DRAFT 1099-R: gross = gross_cents, taxable = gross_cents - basis_portion_cents, code CODE_7 if participant age_months at execution >= 714 else CODE_1"
          - "Conversion is IRREVOCABLE: COMPLETED is terminal; no cancel path exists"
      - from: DISBURSED
        to: COMPLETED
        trigger: "POST /v1/rollover-cases/{caseId}/confirm-receipt"
        actor: RolloverProcessor
        preconditions:
          - "Case status == DISBURSED and case_type == DIRECT_ROLLOVER_OUT (ERR_CASE_INVALID_STATE)"
          - "The case's Disbursement status == ISSUED (ERR_DISBURSEMENT_INVALID_STATE)"
        side_effects: []
      - from: DRAFT
        to: CANCELLED
        trigger: "POST /v1/rollover-cases/{caseId}/cancel"
        actor: Participant
        preconditions:
          - "Case status in {DRAFT, DOCS_PENDING, ELIGIBILITY_REVIEW} (ERR_CASE_INVALID_STATE otherwise; terminal states reject)"
        side_effects:
          - "REQUIRED/SUBMITTED RequiredDocument rows remain for audit (no cascade delete)"
      - from: DOCS_PENDING
        to: CANCELLED
        trigger: "POST /v1/rollover-cases/{caseId}/cancel"
        actor: Participant
        preconditions: ["same as DRAFT->CANCELLED"]
        side_effects: []
      - from: ELIGIBILITY_REVIEW
        to: CANCELLED
        trigger: "POST /v1/rollover-cases/{caseId}/cancel"
        actor: Participant
        preconditions: ["same as DRAFT->CANCELLED"]
        side_effects: []
      - from: SUSPENDED
        to: SUSPENDED
        trigger: "system: plan freeze cascade (idempotent re-suspend)"
        actor: system
        preconditions: []
        side_effects: []
        note: "Resume path: plan unfreeze returns case to prior_status (see Plan FROZEN->ACTIVE side effect)"

  - entity: RequiredDocument
    initial_state: REQUIRED
    terminal_states: [ACCEPTED]
    transitions:
      - from: REQUIRED
        to: SUBMITTED
        trigger: "POST /v1/documents/{docId}/submit"
        actor: Participant
        preconditions:
          - "Document status == REQUIRED or REJECTED (ERR_DOCUMENT_INVALID_STATE)"
          - "Owning case status == DOCS_PENDING (ERR_CASE_INVALID_STATE)"
        side_effects:
          - "submitted_by := X-User-ID"
      - from: REJECTED
        to: SUBMITTED
        trigger: "POST /v1/documents/{docId}/submit (resubmission cycle)"
        actor: Participant
        preconditions: ["same as REQUIRED->SUBMITTED"]
        side_effects:
          - "submitted_by := X-User-ID; reviewed_by cleared"
      - from: SUBMITTED
        to: ACCEPTED
        trigger: "POST /v1/documents/{docId}/review with decision ACCEPTED"
        actor: RolloverProcessor
        preconditions:
          - "Document status == SUBMITTED (ERR_DOCUMENT_INVALID_STATE)"
        side_effects:
          - "reviewed_by := X-User-ID"
          - "BUBBLE-UP: if no sibling document on the case remains REQUIRED, case DOCS_PENDING -> ELIGIBILITY_REVIEW"
      - from: SUBMITTED
        to: REJECTED
        trigger: "POST /v1/documents/{docId}/review with decision REJECTED"
        actor: RolloverProcessor
        preconditions:
          - "Document status == SUBMITTED (ERR_DOCUMENT_INVALID_STATE)"
          - "review_note present (ERR_VALIDATION)"
        side_effects:
          - "reviewed_by := X-User-ID; review_note stored"
          - "CASCADE: owning case ELIGIBILITY_REVIEW -> DOCS_PENDING if it was in ELIGIBILITY_REVIEW (rejection reopens the docs loop)"

  - entity: SourcePlanVerification
    initial_state: PENDING
    terminal_states: [VERIFIED, FAILED]
    transitions:
      - from: PENDING
        to: VERIFIED
        trigger: "POST /v1/verifications/{verId}/complete with outcome VERIFIED"
        actor: RolloverProcessor
        preconditions:
          - "Verification status == PENDING (ERR_VERIFICATION_INVALID_STATE)"
        side_effects:
          - "verified_at := logical clock"
      - from: PENDING
        to: FAILED
        trigger: "POST /v1/verifications/{verId}/complete with outcome FAILED"
        actor: RolloverProcessor
        preconditions:
          - "Verification status == PENDING (ERR_VERIFICATION_INVALID_STATE)"
        side_effects: []

  - entity: Disbursement
    initial_state: PENDING
    terminal_states: [CANCELLED]
    transitions:
      - from: PENDING
        to: ISSUED
        trigger: "POST /v1/disbursements/{disbId}/issue"
        actor: RolloverProcessor
        preconditions:
          - "Disbursement status == PENDING (ERR_DISBURSEMENT_INVALID_STATE)"
          - "Owning case status == ELIGIBLE (ERR_CASE_INVALID_STATE — e.g., a SUSPENDED case blocks issuance)"
          - "Issue date (logical clock date) not inside any PlanFreezeWindow of the source plan; closed interval, both endpoints inclusive (ERR_DISBURSEMENT_IN_FREEZE_WINDOW)"
        side_effects:
          - "issued_date := logical clock date"
          - "Case side effects per RolloverCase ELIGIBLE -> DISBURSED / AWAITING_REDEPOSIT (1099-R, deadline, notices)"
      - from: ISSUED
        to: RETURNED
        trigger: "POST /v1/disbursements/{disbId}/return"
        actor: RolloverProcessor
        preconditions:
          - "Disbursement status == ISSUED (ERR_DISBURSEMENT_INVALID_STATE)"
        side_effects: []
      - from: RETURNED
        to: ISSUED
        trigger: "POST /v1/disbursements/{disbId}/reissue"
        actor: RolloverProcessor
        preconditions:
          - "Disbursement status == RETURNED (ERR_DISBURSEMENT_INVALID_STATE)"
          - "Owning case status in {DISBURSED, AWAITING_REDEPOSIT} (ERR_CASE_INVALID_STATE)"
        side_effects:
          - "issued_date refreshed to logical clock date; for INDIRECT cases the 60-day deadline does NOT restart (rollover_deadline_date is anchored to first issuance)"
      - from: PENDING
        to: CANCELLED
        trigger: "POST /v1/disbursements/{disbId}/cancel"
        actor: RolloverProcessor
        preconditions:
          - "Disbursement status in {PENDING, RETURNED} (ERR_DISBURSEMENT_INVALID_STATE)"
        side_effects:
          - "COMPENSATION: credit every MoneySourceBalance row of the source account back by its issue-time allocation (cancel_disbursement invariant: source balances return exactly to pre-issue values)"
      - from: RETURNED
        to: CANCELLED
        trigger: "POST /v1/disbursements/{disbId}/cancel"
        actor: RolloverProcessor
        preconditions: ["same as PENDING->CANCELLED"]
        side_effects: ["same compensation as PENDING->CANCELLED"]

  - entity: Loan
    initial_state: ACTIVE
    terminal_states: [TRANSFERRED, OFFSET]
    transitions:
      - from: ACTIVE
        to: TRANSFERRED
        trigger: "POST /v1/loans/{loanId}/transfer"
        actor: RolloverProcessor
        preconditions:
          - "Loan status == ACTIVE (ERR_LOAN_INVALID_STATE)"
          - "Receiving account exists, status ACTIVE, same participant as current account (ERR_ACCOUNT_PARTICIPANT_MISMATCH)"
          - "Receiving account's plan accepts_loan_transfers == true and plan status == ACTIVE (ERR_LOAN_NOT_TRANSFERRABLE)"
          - "A PLAN_TRANSFER RolloverCase on the source account is in ACCEPTANCE_PENDING and names the receiving plan (ERR_CASE_INVALID_STATE)"
        side_effects:
          - "account_id := receiving_account_id (cross-aggregate move); outstanding_balance_cents, interest_rate_bp, term_months preserved"
      - from: ACTIVE
        to: OFFSET
        trigger: "POST /v1/loans/{loanId}/offset"
        actor: RolloverProcessor
        preconditions:
          - "Loan status == ACTIVE (ERR_LOAN_INVALID_STATE)"
        side_effects:
          - "offset_at := logical clock; offset_qualified computed (participant SEPARATED/RETIRED or plan TERMINATED); offset_rollover_deadline computed per loan_offset_window variant"
          - "Create DRAFT 1099-R: gross = outstanding_balance_cents, taxable = outstanding_balance_cents, withholding 0, code CODE_7 if participant age_months at offset >= 714 else CODE_1"

  - entity: Redeposit
    initial_state: PENDING_VERIFICATION
    terminal_states: [CREDITED, REJECTED]
    transitions:
      - from: PENDING_VERIFICATION
        to: CREDITED
        trigger: "POST /v1/redeposits/{redId}/credit"
        actor: RolloverProcessor
        preconditions:
          - "Redeposit status == PENDING_VERIFICATION (ERR_REDEPOSIT_INVALID_STATE)"
          - "Receiving account status == ACTIVE (ERR_ACCOUNT_NOT_ACTIVE)"
          - "Deadline gate re-checked at credit time: for case-linked deposits received_date must be <= rollover_deadline_date; for loan-linked deposits received_date must be <= loan.offset_rollover_deadline (ERR_DEPOSIT_PAST_DEADLINE)"
        side_effects:
          - "Case-linked: case.credited_total_cents += amount_cents; if credited_total_cents >= case.gross_cents, case AWAITING_REDEPOSIT -> COMPLETED (with its own notice/1099-R cascades)"
          - "Case-linked: DRAFT 5498 of the receiving participant for the credit tax_year is created or updated (rollover_contribution_cents += amount_cents; fair_market_value_cents = receiving account total_balance_cents after credit)"
          - "Receiving account MoneySourceBalance credited: default source PRE_TAX balance += amount_cents (basis unchanged) unless the case allocation says otherwise"
          - "Loan-linked: loan.offset_repaid_cents += amount_cents"
      - from: PENDING_VERIFICATION
        to: REJECTED
        trigger: "POST /v1/redeposits/{redId}/reject"
        actor: RolloverProcessor
        preconditions:
          - "Redeposit status == PENDING_VERIFICATION (ERR_REDEPOSIT_INVALID_STATE)"
        side_effects: []

  - entity: TaxForm
    initial_state: DRAFT
    terminal_states: [SUPERSEDED]
    transitions:
      - from: DRAFT
        to: ISSUED
        trigger: "POST /v1/tax-forms/{formId}/finalize"
        actor: TaxReportingOfficer
        preconditions:
          - "Form status == DRAFT (ERR_TAX_FORM_INVALID_STATE)"
        side_effects:
          - "Amounts locked; DRAFT recomputes stop applying"
      - from: ISSUED
        to: SUPERSEDED
        trigger: "POST /v1/tax-forms/{formId}/correct (or auto-correction from case completion/incompletion)"
        actor: TaxReportingOfficer
        preconditions:
          - "Form status == ISSUED (ERR_TAX_FORM_INVALID_STATE)"
          - "OCC: expected_tax_form_version matches (ERR_STALE_VERSION)"
        side_effects:
          - "New TaxForm row created: revision := old.revision + 1, supersedes_id := old.id, status ISSUED, corrected amounts per input/auto-correction"

  - entity: FollowUpNotice
    initial_state: SCHEDULED
    terminal_states: [SENT, SKIPPED]
    transitions:
      - from: SCHEDULED
        to: SENT
        trigger: "system: POST /v1/sweeps/daily finds logical clock date >= scheduled_date"
        actor: system
        preconditions:
          - "Notice status == SCHEDULED; clock date >= scheduled_date; owning case status == AWAITING_REDEPOSIT"
        side_effects:
          - "days_remaining := rollover_deadline_date - clock date; outstanding_cents := gross_cents - credited_total_cents at send time"
      - from: SCHEDULED
        to: SKIPPED
        trigger: "system: owning case reaches COMPLETED or INCOMPLETE before scheduled_date"
        actor: system
        preconditions: []
        side_effects: []

# =============================================================================
# §1.2.1 Concurrency Rules
# =============================================================================
concurrency_rules:
  - rule_id: case-amend-stale-version
    parent_entity: RolloverCase
    write_endpoint: "PATCH /v1/rollover-cases/{caseId}"
    occ_field: "expected_rollover_case_version"
    description: |
      Amending a DRAFT case's elections with an expected_rollover_case_version
      that no longer matches the case's current version is rejected. This
      captures the case where another writer has just amended the case (each
      successful amendment legitimately replaces the prior election set under
      this PRD) and the current writer's view of the case is therefore stale.
    error_id: ERR_STALE_VERSION
    http_status: 412
  - rule_id: taxform-correction-stale-version
    parent_entity: TaxForm
    write_endpoint: "POST /v1/tax-forms/{formId}/correct"
    occ_field: "expected_tax_form_version"
    description: |
      Filing a correction against a TaxForm whose version has advanced since
      the client last observed it is rejected. A correction supersedes the
      prior revision, so a writer holding a stale version must not silently
      supersede a revision it never saw.
    error_id: ERR_STALE_VERSION
    http_status: 412

# =============================================================================
# §1.3 Calculation Rules Table
# =============================================================================
calculations:
  - name: eligibility_determination
    trigger: "POST /v1/rollover-cases/{caseId}/submit (outbound case types only)"
    algorithm: threshold
    formula: |
      age_months = complete calendar months between participant.date_of_birth and clock_date
                   = (clock.year - dob.year)*12 + (clock.month - dob.month)
                     minus 1 when clock.day < dob.day
      # branch priority is pinned top-down; first match wins
      if plan.status == TERMINATED:                        qualifying_event = PLAN_TERMINATION
      elif participant.employment_status in {SEPARATED, RETIRED}: qualifying_event = SEPARATION
      elif participant.employment_status == DISABLED:      qualifying_event = DISABILITY
      elif age_months >= AGE_THRESHOLD_MONTHS:             qualifying_event = AGE_59_HALF
      else:                                                qualifying_event = NONE  (submit rejected ERR_NOT_ELIGIBLE)
    input_set: "Source plan (status), participant (employment_status, date_of_birth), logical clock date; ROLLOVER_IN and IN_PLAN_ROTH_CONVERSION skip this calculation entirely"
    constants:
      AGE_THRESHOLD_MONTHS: 714
    precision: "whole calendar months; comparison is >= (714 months == 59.5 years exactly)"
    variants:
      - name: by_qualifying_event
        when: "each branch yields a different qualifying_event enum"
        difference: "PLAN_TERMINATION overrides employment-based events; AGE_59_HALF is the fallback branch and is the only branch sensitive to the 59.50 boundary"

  - name: vested_balance
    trigger: "On Account read and at any validation/allocations needing vested_balance_cents"
    algorithm: aggregation
    formula: |
      vested_balance_cents = SUM over MoneySourceBalance rows of the account of
          floor(balance_cents * vested_pct / 100)
      # rounding order pinned: per-row floor FIRST, then sum (never sum-then-round)
    input_set: "All MoneySourceBalance rows of the account regardless of balance (zero rows contribute 0)"
    constants: {}
    precision: "integer cents; floor per row, then integer sum"
    variants: []

  - name: source_allocation
    trigger: "issue-disbursement (both outbound types) and execute-conversion"
    algorithm: waterfall_allocation
    formula: |
      # Step 1: eligible source set = rows with balance_cents > 0
      #   outbound types: all four source types; conversions: only PRE_TAX and AFTER_TAX
      # Step 2: per-source vested_cents = floor(balance_cents * vested_pct / 100)
      # Step 3: gross = requested_amount_cents or (full vested: SUM(vested_cents))
      # Step 4: raw_share(source) = gross * vested_cents(source) / SUM(vested_cents)   [exact rational]
      # Step 5: allocation(source) = floor(raw_share); remainder cents (gross - SUM(floors))
      #   are distributed one cent each to the largest fractional parts;
      #   ties broken by source_type enum order AFTER_TAX < EMPLOYER_PRETAX < PRE_TAX < ROTH
      # Step 6: basis_share(source) = round_half_up(allocation(source) * basis_cents(source) / balance_cents(source)),
      #   0 when balance_cents(source) == 0
      # Step 7: basis_portion = SUM(basis_share); taxable = gross - basis_portion
    input_set: "MoneySourceBalance rows of the source account with balance_cents > 0; type-filtered per above"
    constants: {}
    precision: "integer cents; floor allocation + largest-remainder distribution; basis share round_half_up. The pinned order (floor-then-remainder per source, then per-source basis rounding) is mandatory: round-half-up-per-source would over-allocate by 1 cent on the canonical fixture"
    variants:
      - name: full_vested
        when: "requested_amount_cents is null"
        difference: "gross = SUM(vested_cents) and every source's raw_share == its vested_cents exactly (no remainder); unvested employer remainder is forfeited (forfeiture_cents = balance - vested for EMPLOYER_PRETAX rows)"
      - name: partial
        when: "requested_amount_cents present"
        difference: "pro-rata largest-remainder allocation as above; no forfeiture"

  - name: indirect_withholding
    trigger: "issue-disbursement, immediately after source_allocation"
    algorithm: threshold
    formula: |
      # evaluation order pinned to break the apparent circle net<->withholding<->taxable:
      #   (1) gross  (2) basis_portion  (3) taxable = gross - basis_portion
      #   (4) withholding = round_half_up(taxable * WITHHOLDING_RATE) for INDIRECT_ROLLOVER_OUT
      #       withholding = 0 for DIRECT_ROLLOVER_OUT / PLAN_TRANSFER / IN_PLAN_ROTH_CONVERSION
      #   (5) net = gross - withholding
      # net never feeds back into taxable; taxable depends only on gross and basis
    input_set: "Case gross_cents and basis_portion_cents from source_allocation"
    constants:
      WITHHOLDING_RATE: 0.20
    precision: "integer cents, round_half_up"
    variants:
      - name: indirect_mandatory
        when: "case_type == INDIRECT_ROLLOVER_OUT"
        difference: "withholding = round_half_up(taxable * 0.20); cannot be waived or reduced; participant acknowledgement required at submit"
      - name: direct_exempt
        when: "case_type == DIRECT_ROLLOVER_OUT (and transfers/conversions)"
        difference: "withholding = 0; trustee-to-trustee movement is withholding-exempt"

  - name: tax_form_amounts
    trigger: "DRAFT 1099-R creation at issue/offset/conversion; recompute on redeposit credit, case completion, case incompletion (until ISSUED; afterwards via correction revision)"
    algorithm: forward_looking
    formula: |
      1099-R (per event, one form per case/loan-offset):
        gross_distribution_cents   = event gross_cents
        federal_withholding_cents  = event withholding_cents
        distribution_code          = CODE_G for DIRECT_ROLLOVER_OUT;
                                     else CODE_7 if participant age_months at event >= 714 else CODE_1
      5498 (aggregate): one DRAFT 5498 per (participant_id, tax_year);
        rollover_contribution_cents = SUM of CREDITED Redeposit.amount_cents and
          ROLLOVER_IN post-credit totals received in that tax_year;
        fair_market_value_cents = receiving account total_balance_cents at the latest credit
    input_set: "Triggering case/loan, participant age at event date, CREDITED redeposits of the tax_year"
    constants: {}
    precision: "integer cents"
    variants:
      - name: provisional
        when: "1099-R as first drafted at issue time (nothing redeposited yet)"
        difference: "INDIRECT: taxable_amount_cents = taxable_cents (assumes nothing will be redeposited); DIRECT: 0 with CODE_G"
      - name: corrected
        when: "recomputed after the 60-day outcome is known (completion or INCOMPLETE sweep)"
        difference: "INDIRECT: taxable_amount_cents = taxable_cents - min(credited_total_cents, taxable_cents); identical inputs therefore yield a different taxable amount than provisional"

  - name: sixty_day_window
    trigger: "disbursement issuance (deadline), redeposit create/credit (gate), daily sweep (expiry)"
    algorithm: threshold
    formula: |
      rollover_deadline_date = disbursement_issued_date + 60 calendar days
      deposit ON the deadline date is timely: received_date <= rollover_deadline_date  (inclusive)
      received_date == deadline + 1 day or later -> ERR_DEPOSIT_PAST_DEADLINE
      sweep marks INCOMPLETE when clock_date > rollover_deadline_date AND credited_total_cents < gross_cents
    input_set: "Case disbursement_issued_date, redeposit received_date, logical clock"
    constants:
      WINDOW_DAYS: 60
    precision: "whole calendar days; inclusive upper bound"
    variants: []

  - name: loan_offset_window
    trigger: "POST /v1/loans/{loanId}/offset"
    algorithm: forward_looking
    formula: |
      offset_qualified = (participant.employment_status in {SEPARATED, RETIRED})
                         OR (holding plan.status == TERMINATED)   -- qualified plan loan offset
      taxable event: gross = taxable = outstanding_balance_cents, withholding = 0
    input_set: "Loan, loan's current Account -> Participant and Plan"
    constants:
      STANDARD_WINDOW_DAYS: 60
    precision: "whole calendar days"
    variants:
      - name: standard_offset
        when: "offset_qualified == false"
        difference: "offset_rollover_deadline = offset_date + 60 days (inclusive), mirroring the indirect-rollover rule"
      - name: qualified_plan_loan_offset
        when: "offset_qualified == true"
        difference: "offset_rollover_deadline = October 15 of (tax_year of offset + 1) — the participant's filing deadline including extensions; the same outstanding balance therefore yields a materially later deadline than the standard variant"

  - name: required_document_rules
    trigger: "RolloverCase submit; decide-eligibility REQUEST_DOCS"
    algorithm: constraint_propagation
    formula: |
      required docs at submit (case_type scoped):
        SPOUSAL_CONSENT            if plan.requires_spousal_consent AND participant.marital_status == MARRIED
                                   AND vested_balance_cents > plan.spousal_consent_threshold_cents (STRICTLY greater)
                                   AND case_type in {DIRECT_ROLLOVER_OUT, INDIRECT_ROLLOVER_OUT, PLAN_TRANSFER}
        SEPARATION_VERIFICATION    if qualifying_event == SEPARATION
        DISABILITY_PROOF           if qualifying_event == DISABILITY
        IDENTITY_PROOF             if case_type == INDIRECT_ROLLOVER_OUT
        RECEIVING_PLAN_ACCEPTANCE  if case_type in {DIRECT_ROLLOVER_OUT, PLAN_TRANSFER}
        SOURCE_PLAN_STATEMENT      if case_type == ROLLOVER_IN
      Documents are created in exactly the order listed above (deterministic list order).
      REQUEST_DOCS adds exactly the doc_types named in the decision input (dedup by doc_type)
    input_set: "Case type, qualifying_event, participant marital_status, account vested balance, plan flags/threshold"
    constants: {}
    precision: "n/a"
    variants: []

  - name: redeposit_completion
    trigger: "Redeposit credit; daily sweep"
    algorithm: aggregation
    formula: |
      credited_total_cents = SUM of amount_cents over Redeposit rows of the case with status == CREDITED
      completion: credited_total_cents >= gross_cents  (boundary: equality completes)
      taxable_unrolled (for corrected 1099-R) = taxable_cents - min(credited_total_cents, taxable_cents)
      # i.e., credited dollars are applied to the taxable portion first, then to basis
    input_set: "Redeposit rows of the case filtered status == CREDITED (PENDING_VERIFICATION/REJECTED excluded)"
    constants: {}
    precision: "integer cents"
    variants: []

# =============================================================================
# §1.4 Validation Rules Table (ordered by priority)
# =============================================================================
validations:
  - priority: 1
    category: auth
    check: "X-User-Role and X-User-ID headers present and role is a declared role"
    error_id: ERR_UNAUTHENTICATED
    http_status: 401
    applies_to: "all"
  - priority: 2
    category: auth
    check: "Role permitted for the endpoint per §1.5 roles (RBAC); Participant-ownership scoping: Participant role may only access cases/accounts/documents whose account owner == X-User-ID (violation answered as ERR_CASE_NOT_FOUND / ERR_ACCOUNT_NOT_FOUND to avoid existence leaks)"
    error_id: ERR_UNAUTHORIZED_ROLE
    http_status: 403
    applies_to: "all"
  - priority: 3
    category: existence
    check: "Path and body references resolve left-to-right: plan, participant, account, case, document, verification, disbursement, redeposit, loan, tax form"
    error_id: ERR_PLAN_NOT_FOUND
    http_status: 404
    applies_to: "all (specific ids: ERR_PARTICIPANT_NOT_FOUND, ERR_ACCOUNT_NOT_FOUND, ERR_CASE_NOT_FOUND, ERR_DOCUMENT_NOT_FOUND, ERR_VERIFICATION_NOT_FOUND, ERR_DISBURSEMENT_NOT_FOUND, ERR_REDEPOSIT_NOT_FOUND, ERR_LOAN_NOT_FOUND, ERR_TAX_FORM_NOT_FOUND)"
  - priority: 4
    category: state
    check: "Target resource in a state that permits the operation per §1.2 (case status, plan FROZEN/TERMINATED guards, account ACTIVE, document/disbursement/redeposit/verification/tax-form/loan status preconditions)"
    error_id: ERR_CASE_INVALID_STATE
    http_status: 409
    applies_to: "all state-transition endpoints (specific ids: ERR_PLAN_FROZEN, ERR_PLAN_TERMINATED, ERR_PLAN_NOT_FROZEN, ERR_ACCOUNT_NOT_ACTIVE, ERR_DOCUMENT_INVALID_STATE, ERR_DISBURSEMENT_INVALID_STATE, ERR_REDEPOSIT_INVALID_STATE, ERR_VERIFICATION_INVALID_STATE, ERR_TAX_FORM_INVALID_STATE, ERR_LOAN_INVALID_STATE)"
  - priority: 5
    category: business_safety
    check: "Segregation of duties: issue-disbursement / execute-transfer / execute-conversion / post-credit X-User-ID must differ from the case's eligibility_decided_by"
    error_id: ERR_SOD_VIOLATION
    http_status: 403
    applies_to: "POST /v1/rollover-cases/{caseId}/issue-disbursement, execute-transfer, execute-conversion, post-credit"
  - priority: 6
    category: business_referential
    check: "Cross-references consistent: redeposit receiving account belongs to the same participant as the linked case/loan; loan transfer receiving account same participant; case receiving_account_id (when required) belongs to the same participant as source_account_id and sits at receiving_plan_id; PLAN_TRANSFER receiving_plan_id != source plan; account (participant_id, plan_id) unique"
    error_id: ERR_ACCOUNT_PARTICIPANT_MISMATCH
    http_status: 422
    applies_to: "POST /v1/redeposits, POST /v1/loans/{loanId}/transfer, POST /v1/rollover-cases, POST /v1/accounts (specific ids: ERR_SAME_PLAN_TRANSFER, ERR_ACCOUNT_ALREADY_EXISTS)"
  - priority: 7
    category: business_temporal
    check: "Temporal gates: redeposit received_date <= applicable deadline; issue date outside any freeze window of the source plan; freeze window start_date <= end_date and no overlap with existing windows of the same plan (closed-interval collision)"
    error_id: ERR_DEPOSIT_PAST_DEADLINE
    http_status: 422
    applies_to: "POST /v1/redeposits, POST /v1/redeposits/{redId}/credit, POST /v1/rollover-cases/{caseId}/issue-disbursement, POST /v1/plans/{planId}/freeze-windows (specific ids: ERR_DISBURSEMENT_IN_FREEZE_WINDOW, ERR_FREEZE_WINDOW_OVERLAP, ERR_WINDOW_RANGE_INVALID)"
  - priority: 8
    category: business_constraint
    check: "Capability and uniqueness constraints: receiving plan capability flags; verification VERIFIED gate; zero ACTIVE loans on transfer completion; one non-terminal case per source account; withholding acknowledgement; required documents all ACCEPTED before APPROVE"
    error_id: ERR_PLAN_CAPABILITY_REJECTED
    http_status: 422
    applies_to: "case submit / issue / execute / post-credit (specific ids: ERR_VERIFICATION_NOT_VERIFIED, ERR_LOANS_OUTSTANDING, ERR_OPEN_CASE_EXISTS, ERR_WITHHOLDING_ACK_REQUIRED, ERR_DOCUMENTS_OUTSTANDING, ERR_DISBURSEMENT_ALREADY_EXISTS)"
  - priority: 9
    category: business_fiscal
    check: "Amount checks last: requested_amount_cents <= vested_balance_cents; amounts positive; redeposit amount <= remaining shortfall (gross - credited_total for cases; outstanding - offset_repaid for loans)"
    error_id: ERR_AMOUNT_EXCEEDS_VESTED
    http_status: 422
    applies_to: "POST /v1/rollover-cases, POST /v1/rollover-cases/{caseId}/submit, POST /v1/redeposits (specific ids: ERR_DEPOSIT_EXCEEDS_REMAINING, ERR_VALIDATION for non-positive amounts)"

# =============================================================================
# §1.0 Response Envelope (FIXED — EMIT VERBATIM)
# =============================================================================
response_envelope:
  success: |
    { "meta": { "api_request_id": "req_xxx", "api_request_timestamp": "ISO8601" },
      "response_type": "object" | "array", "data": {} }
  error: |
    { "meta": { ... }, "response_type": "error",
      "data": { "error_id": "ERR_XXX", "message": "..." } }
  pagination_fields: ["limit", "offset", "total_count", "has_more"]
  pagination_defaults: { limit: 10, min: 1, max: 100, offset: 0 }

# =============================================================================
# §1.5 API Endpoint Table
# =============================================================================
endpoints:
  # --- Plans ---
  - { method: POST, path: "/v1/plans", description: "Create a plan with capability flags", roles: [PlanSponsorAdmin], code: 201, input: ["plan_name", "plan_type", "accepts_incoming_rollovers?", "accepts_incoming_transfers?", "accepts_loan_transfers?", "accepts_after_tax_basis?", "allows_in_plan_roth_conversion?", "requires_spousal_consent?", "spousal_consent_threshold_cents?"], output: Plan, side_effects: ["status ACTIVE"] }
  - { method: GET, path: "/v1/plans", description: "List plans; rows ordered by created_at ASC", roles: [Participant, PlanSponsorAdmin, RolloverProcessor, TaxReportingOfficer, OperationsAgent], code: 200, input: ["status?", "limit?", "offset?"], output: "Plan[]", side_effects: [] }
  - { method: GET, path: "/v1/plans/{planId}", description: "Get a plan", roles: [Participant, PlanSponsorAdmin, RolloverProcessor, TaxReportingOfficer, OperationsAgent], code: 200, input: [], output: Plan, side_effects: [] }
  - { method: POST, path: "/v1/plans/{planId}/freeze", description: "Freeze plan; cascades SUSPENDED onto open cases, CANCELLED onto their PENDING disbursements, and balance restoration onto source accounts", roles: [PlanSponsorAdmin], code: 200, input: [], output: Plan, side_effects: ["plan freeze cascade (see Plan state machine)"] }
  - { method: POST, path: "/v1/plans/{planId}/unfreeze", description: "Unfreeze plan; resumes SUSPENDED cases to prior_status", roles: [PlanSponsorAdmin], code: 200, input: [], output: Plan, side_effects: ["case resume cascade"] }
  - { method: POST, path: "/v1/plans/{planId}/terminate", description: "Terminate plan; grants PLAN_TERMINATION qualifying event", roles: [PlanSponsorAdmin], code: 200, input: [], output: Plan, side_effects: ["status TERMINATED"] }
  - { method: POST, path: "/v1/plans/{planId}/freeze-windows", description: "Create a processing freeze window (closed interval)", roles: [PlanSponsorAdmin], code: 201, input: ["start_date", "end_date", "reason"], output: PlanFreezeWindow, side_effects: [] }
  - { method: GET, path: "/v1/plans/{id}/freeze-windows", description: "List freeze windows of a plan; rows ordered by created_at ASC", roles: [Participant, PlanSponsorAdmin, RolloverProcessor, TaxReportingOfficer, OperationsAgent], code: 200, input: ["limit?", "offset?"], output: "PlanFreezeWindow[]", side_effects: [] }

  # --- Participants ---
  - { method: POST, path: "/v1/participants", description: "Register a participant", roles: [PlanSponsorAdmin], code: 201, input: ["full_name", "date_of_birth", "employment_status", "marital_status", "separation_date?"], output: Participant, side_effects: [] }
  - { method: GET, path: "/v1/participants/{participantId}", description: "Get a participant (computes current_age_years from logical clock)", roles: [Participant, PlanSponsorAdmin, RolloverProcessor, TaxReportingOfficer, OperationsAgent], code: 200, input: [], output: Participant, side_effects: [] }

  # --- Accounts & money sources ---
  - { method: POST, path: "/v1/accounts", description: "Open an account with initial money-source balances", roles: [PlanSponsorAdmin], code: 201, input: ["participant_id", "plan_id", "initial_balances?"], output: Account, side_effects: ["MoneySourceBalance rows created from initial_balances (each: source_type, balance_cents, basis_cents?, vested_pct?)", "computed totals refreshed"] }
  - { method: GET, path: "/v1/accounts", description: "List accounts (filtered); rows ordered by created_at ASC", roles: [Participant, PlanSponsorAdmin, RolloverProcessor, TaxReportingOfficer, OperationsAgent], code: 200, input: ["participant_id?", "plan_id?", "status?", "limit?", "offset?"], output: "Account[]", side_effects: [] }
  - { method: GET, path: "/v1/accounts/{accountId}", description: "Get an account with computed totals", roles: [Participant, PlanSponsorAdmin, RolloverProcessor, TaxReportingOfficer, OperationsAgent], code: 200, input: [], output: Account, side_effects: [] }
  - { method: GET, path: "/v1/accounts/{id}/source-balances", description: "List money-source balances of an account; rows ordered by created_at ASC", roles: [Participant, PlanSponsorAdmin, RolloverProcessor, TaxReportingOfficer, OperationsAgent], code: 200, input: ["limit?", "offset?"], output: "MoneySourceBalance[]", side_effects: [] }
  - { method: GET, path: "/v1/accounts/{id}/redeposits", description: "List redeposits received by an account; rows ordered by created_at ASC", roles: [Participant, PlanSponsorAdmin, RolloverProcessor, TaxReportingOfficer, OperationsAgent], code: 200, input: ["limit?", "offset?"], output: "Redeposit[]", side_effects: [] }

  # --- Loans ---
  - { method: POST, path: "/v1/accounts/{accountId}/loans", description: "Create an ACTIVE loan on an account", roles: [PlanSponsorAdmin], code: 201, input: ["outstanding_balance_cents", "interest_rate_bp", "term_months"], output: Loan, side_effects: ["status ACTIVE"] }
  - { method: GET, path: "/v1/accounts/{id}/loans", description: "List loans currently held by an account; rows ordered by created_at ASC", roles: [Participant, PlanSponsorAdmin, RolloverProcessor, TaxReportingOfficer, OperationsAgent], code: 200, input: ["status?", "limit?", "offset?"], output: "Loan[]", side_effects: [] }
  - { method: GET, path: "/v1/loans/{loanId}", description: "Get a loan", roles: [Participant, PlanSponsorAdmin, RolloverProcessor, TaxReportingOfficer, OperationsAgent], code: 200, input: [], output: Loan, side_effects: [] }
  - { method: GET, path: "/v1/loans/{id}/redeposits", description: "List redeposits applied to a loan offset; rows ordered by created_at ASC", roles: [Participant, PlanSponsorAdmin, RolloverProcessor, TaxReportingOfficer, OperationsAgent], code: 200, input: ["limit?", "offset?"], output: "Redeposit[]", side_effects: [] }
  - { method: POST, path: "/v1/loans/{loanId}/transfer", description: "Transfer a loan note to a receiving account within a plan-to-plan transfer", roles: [RolloverProcessor], code: 200, input: ["receiving_account_id"], output: Loan, side_effects: ["account_id reassigned; status TRANSFERRED"] }
  - { method: POST, path: "/v1/loans/{loanId}/offset", description: "Offset a loan (taxable event); computes qualified flag and offset_rollover_deadline variant", roles: [RolloverProcessor], code: 200, input: [], output: Loan, side_effects: ["status OFFSET", "DRAFT 1099-R created", "offset window computed"] }

  # --- Rollover cases ---
  - { method: POST, path: "/v1/rollover-cases", description: "Create a rollover/transfer/conversion case (DRAFT)", roles: [Participant], code: 201, input: ["case_type", "source_account_id?", "receiving_account_id?", "receiving_plan_id?", "receiving_institution_name?", "requested_amount_cents?", "withholding_acknowledged?"], output: RolloverCase, side_effects: ["status DRAFT", "version 1"] }
  - { method: GET, path: "/v1/rollover-cases", description: "List cases (filtered; multi-FK reverse lookup); rows ordered by created_at ASC", roles: [Participant, PlanSponsorAdmin, RolloverProcessor, TaxReportingOfficer, OperationsAgent], code: 200, input: ["source_account_id?", "receiving_account_id?", "receiving_plan_id?", "status?", "case_type?", "limit?", "offset?"], output: "RolloverCase[]", side_effects: [] }
  - { method: GET, path: "/v1/rollover-cases/{caseId}", description: "Get a case", roles: [Participant, PlanSponsorAdmin, RolloverProcessor, TaxReportingOfficer, OperationsAgent], code: 200, input: [], output: RolloverCase, side_effects: [] }
  - { method: PATCH, path: "/v1/rollover-cases/{caseId}", description: "Amend DRAFT case elections (OCC on case version)", roles: [Participant], code: 200, input: ["expected_rollover_case_version", "requested_amount_cents?", "receiving_plan_id?", "receiving_institution_name?", "withholding_acknowledged?"], output: RolloverCase, side_effects: ["increments RolloverCase.version by 1"] }
  - { method: POST, path: "/v1/rollover-cases/{caseId}/submit", description: "Submit case: eligibility snapshot + required-document computation + auto-routing", roles: [Participant], code: 200, input: [], output: RolloverCase, side_effects: ["qualifying_event computed", "RequiredDocument rows created", "status DOCS_PENDING or ELIGIBILITY_REVIEW"] }
  - { method: POST, path: "/v1/rollover-cases/{caseId}/cancel", description: "Cancel a non-terminal case (pre-disbursement states only)", roles: [Participant], code: 200, input: [], output: RolloverCase, side_effects: ["status CANCELLED"] }
  - { method: POST, path: "/v1/rollover-cases/{caseId}/decide-eligibility", description: "Processor decision: APPROVE | DENY | REQUEST_DOCS", roles: [RolloverProcessor], code: 200, input: ["decision", "denial_reason?", "request_doc_types?"], output: RolloverCase, side_effects: ["status ELIGIBLE / DENIED / DOCS_PENDING; PLAN_TRANSFER and ROLLOVER_IN route to ACCEPTANCE_PENDING on APPROVE", "eligibility_decided_by set on APPROVE"] }
  - { method: POST, path: "/v1/rollover-cases/{caseId}/issue-disbursement", description: "Assemble the outbound disbursement (direct/indirect): allocates sources, locks amounts, debits balances, creates a PENDING disbursement", roles: [RolloverProcessor], code: 200, input: ["method"], output: Disbursement, side_effects: ["source_allocation + indirect_withholding", "source balances debited", "Disbursement PENDING created"] }
  - { method: POST, path: "/v1/rollover-cases/{caseId}/confirm-receipt", description: "Confirm receiving institution receipt for a direct rollover (DISBURSED -> COMPLETED)", roles: [RolloverProcessor], code: 200, input: [], output: RolloverCase, side_effects: ["status COMPLETED"] }
  - { method: POST, path: "/v1/rollover-cases/{caseId}/execute-transfer", description: "Execute book-entry plan-to-plan transfer", roles: [RolloverProcessor], code: 200, input: [], output: RolloverCase, side_effects: ["money sources move preserving basis/vesting; source account CLOSED; no 1099-R"] }
  - { method: POST, path: "/v1/rollover-cases/{caseId}/execute-conversion", description: "Execute irrevocable in-plan Roth conversion", roles: [RolloverProcessor], code: 200, input: [], output: RolloverCase, side_effects: ["source balances moved to ROTH with basis; DRAFT 1099-R created"] }
  - { method: POST, path: "/v1/rollover-cases/{caseId}/post-credit", description: "Post inbound rollover funds with pre-tax/Roth/after-tax breakdown (basis tracking)", roles: [RolloverProcessor], code: 200, input: ["pre_tax_cents", "roth_cents", "roth_basis_cents", "after_tax_basis_cents"], output: RolloverCase, side_effects: ["receiving account sources credited; DRAFT 5498 created/updated; status COMPLETED"] }
  - { method: POST, path: "/v1/rollover-cases/{caseId}/verifications", description: "Open a source/receiving plan verification", roles: [RolloverProcessor], code: 201, input: ["direction", "method"], output: SourcePlanVerification, side_effects: ["status PENDING"] }

  # --- Case sub-resources (FK reverse-reachability) ---
  - { method: GET, path: "/v1/rollover-cases/{id}/documents", description: "List required documents of a case; rows ordered by created_at ASC", roles: [Participant, PlanSponsorAdmin, RolloverProcessor, TaxReportingOfficer, OperationsAgent], code: 200, input: ["limit?", "offset?"], output: "RequiredDocument[]", side_effects: [] }
  - { method: GET, path: "/v1/rollover-cases/{id}/disbursements", description: "List disbursements of a case; rows ordered by created_at ASC", roles: [Participant, PlanSponsorAdmin, RolloverProcessor, TaxReportingOfficer, OperationsAgent], code: 200, input: ["limit?", "offset?"], output: "Disbursement[]", side_effects: [] }
  - { method: GET, path: "/v1/rollover-cases/{id}/redeposits", description: "List redeposits of a case; rows ordered by created_at ASC", roles: [Participant, PlanSponsorAdmin, RolloverProcessor, TaxReportingOfficer, OperationsAgent], code: 200, input: ["limit?", "offset?"], output: "Redeposit[]", side_effects: [] }
  - { method: GET, path: "/v1/rollover-cases/{id}/verifications", description: "List verifications of a case; rows ordered by created_at ASC", roles: [Participant, PlanSponsorAdmin, RolloverProcessor, TaxReportingOfficer, OperationsAgent], code: 200, input: ["limit?", "offset?"], output: "SourcePlanVerification[]", side_effects: [] }
  - { method: GET, path: "/v1/rollover-cases/{id}/notices", description: "List follow-up notices of a case; rows ordered by created_at ASC", roles: [Participant, PlanSponsorAdmin, RolloverProcessor, TaxReportingOfficer, OperationsAgent], code: 200, input: ["limit?", "offset?"], output: "FollowUpNotice[]", side_effects: [] }

  # --- Documents & verifications ---
  - { method: POST, path: "/v1/documents/{docId}/submit", description: "Participant submits (or resubmits) a required document", roles: [Participant], code: 200, input: [], output: RequiredDocument, side_effects: ["status SUBMITTED"] }
  - { method: POST, path: "/v1/documents/{docId}/review", description: "Processor accepts or rejects a submitted document; bubble-up may advance the case", roles: [RolloverProcessor], code: 200, input: ["decision", "review_note?"], output: RequiredDocument, side_effects: ["status ACCEPTED/REJECTED", "case bubble-up or docs-loop cascade"] }
  - { method: POST, path: "/v1/verifications/{verId}/complete", description: "Complete a plan verification", roles: [RolloverProcessor], code: 200, input: ["outcome"], output: SourcePlanVerification, side_effects: ["status VERIFIED/FAILED; verified_at set when VERIFIED"] }

  # --- Disbursements ---
  - { method: POST, path: "/v1/disbursements/{disbId}/issue", description: "Issue a PENDING disbursement: money leaves, case advances (DISBURSED or AWAITING_REDEPOSIT), tax form + notices + deadline anchored on first issuance", roles: [RolloverProcessor], code: 200, input: [], output: Disbursement, side_effects: ["status ISSUED", "case transition per type", "first issuance: DRAFT 1099-R, deadline, 3 notices"] }
  - { method: POST, path: "/v1/disbursements/{disbId}/cancel", description: "Cancel a PENDING/RETURNED disbursement; restores source balances exactly", roles: [RolloverProcessor], code: 200, input: [], output: Disbursement, side_effects: ["compensating balance restoration"] }
  - { method: POST, path: "/v1/disbursements/{disbId}/return", description: "Mark an issued disbursement returned (e.g., check bounced)", roles: [RolloverProcessor], code: 200, input: [], output: Disbursement, side_effects: ["status RETURNED"] }
  - { method: POST, path: "/v1/disbursements/{disbId}/reissue", description: "Reissue a returned disbursement (60-day deadline does not restart)", roles: [RolloverProcessor], code: 200, input: [], output: Disbursement, side_effects: ["status ISSUED; issued_date refreshed; deadline anchored to first issuance"] }

  # --- Redeposits ---
  - { method: POST, path: "/v1/redeposits", description: "Record incoming rollover funds against a case or an offset loan", roles: [RolloverProcessor], code: 201, input: ["receiving_account_id", "amount_cents", "received_date", "rollover_case_id?", "loan_id?"], output: Redeposit, side_effects: ["status PENDING_VERIFICATION"] }
  - { method: POST, path: "/v1/redeposits/{redId}/credit", description: "Credit a redeposit; cascades completion/5498 updates", roles: [RolloverProcessor], code: 200, input: [], output: Redeposit, side_effects: ["case credited_total += amount", "possible case COMPLETED + notice/tax cascades", "DRAFT 5498 created/updated", "loan offset_repaid += amount"] }
  - { method: POST, path: "/v1/redeposits/{redId}/reject", description: "Reject a redeposit", roles: [RolloverProcessor], code: 200, input: [], output: Redeposit, side_effects: ["status REJECTED"] }

  # --- Tax forms ---
  - { method: GET, path: "/v1/tax-forms", description: "List tax forms (filtered; multi-FK reverse lookup incl. self-reference); rows ordered by created_at ASC", roles: [Participant, PlanSponsorAdmin, RolloverProcessor, TaxReportingOfficer, OperationsAgent], code: 200, input: ["participant_id?", "rollover_case_id?", "loan_id?", "supersedes_id?", "tax_year?", "form_type?", "status?", "limit?", "offset?"], output: "TaxForm[]", side_effects: [] }
  - { method: GET, path: "/v1/tax-forms/{formId}", description: "Get a tax form", roles: [Participant, PlanSponsorAdmin, RolloverProcessor, TaxReportingOfficer, OperationsAgent], code: 200, input: [], output: TaxForm, side_effects: [] }
  - { method: POST, path: "/v1/tax-forms/{formId}/finalize", description: "Finalize (issue) a DRAFT form; locks amounts", roles: [TaxReportingOfficer], code: 200, input: [], output: TaxForm, side_effects: ["status ISSUED"] }
  - { method: POST, path: "/v1/tax-forms/{formId}/correct", description: "File a correction (OCC on form version); supersedes the current ISSUED revision", roles: [TaxReportingOfficer], code: 201, input: ["expected_tax_form_version", "taxable_amount_cents?", "rollover_contribution_cents?", "distribution_code?"], output: TaxForm, side_effects: ["old row SUPERSEDED; new row ISSUED with revision+1 and supersedes_id", "increments TaxForm.version by 1 on the superseded row"] }

  # --- Operations ---
  - { method: POST, path: "/v1/sweeps/daily", description: "Daily ops sweep: sends due follow-up notices, marks overdue indirect cases INCOMPLETE with tax-form recomputation", roles: [OperationsAgent], code: 200, input: [], output: "{ notices_sent: integer, notices_skipped: integer, cases_marked_incomplete: integer }", side_effects: ["notice transitions", "case INCOMPLETE cascade"] }
  - { method: POST, path: "/_clock/set_current_utc", description: "Set the logical clock (test-driving endpoint). Server startup default is exactly 2026-05-01T00:00:00Z; before any set call the clock reads this default and never falls back to wall-clock time", roles: [OperationsAgent], code: 200, input: ["to_iso8601"], output: "{ current_utc: string }", side_effects: ["logical clock reassigned"] }

# =============================================================================
# §1.6 Error Code Catalog
# =============================================================================
errors:
  - { id: ERR_UNAUTHENTICATED, http: 401, condition: "Missing/invalid X-User-Role or X-User-ID headers" }
  - { id: ERR_UNAUTHORIZED_ROLE, http: 403, condition: "Role lacks permission for the endpoint" }
  - { id: ERR_VALIDATION, http: 400, condition: "Malformed payload: missing required field, invalid enum member, non-positive amount, bad date format" }
  - { id: ERR_PLAN_NOT_FOUND, http: 404, condition: "Referenced plan does not exist" }
  - { id: ERR_PARTICIPANT_NOT_FOUND, http: 404, condition: "Referenced participant does not exist" }
  - { id: ERR_ACCOUNT_NOT_FOUND, http: 404, condition: "Referenced account does not exist (also used for Participant ownership-scope violations)" }
  - { id: ERR_CASE_NOT_FOUND, http: 404, condition: "Referenced case does not exist (also used for Participant ownership-scope violations)" }
  - { id: ERR_DOCUMENT_NOT_FOUND, http: 404, condition: "Referenced document does not exist" }
  - { id: ERR_VERIFICATION_NOT_FOUND, http: 404, condition: "Referenced verification does not exist" }
  - { id: ERR_DISBURSEMENT_NOT_FOUND, http: 404, condition: "Referenced disbursement does not exist" }
  - { id: ERR_REDEPOSIT_NOT_FOUND, http: 404, condition: "Referenced redeposit does not exist" }
  - { id: ERR_LOAN_NOT_FOUND, http: 404, condition: "Referenced loan does not exist" }
  - { id: ERR_TAX_FORM_NOT_FOUND, http: 404, condition: "Referenced tax form does not exist" }
  - { id: ERR_CASE_INVALID_STATE, http: 409, condition: "Case status does not permit the operation (incl. terminal-state lockdown and cancel restrictions)" }
  - { id: ERR_PLAN_FROZEN, http: 409, condition: "Plan is FROZEN; new cases blocked and freeze when already FROZEN" }
  - { id: ERR_PLAN_TERMINATED, http: 409, condition: "Plan is TERMINATED where ACTIVE is required (e.g., double termination)" }
  - { id: ERR_PLAN_NOT_FROZEN, http: 409, condition: "Unfreeze attempted on a plan not FROZEN" }
  - { id: ERR_ACCOUNT_NOT_ACTIVE, http: 409, condition: "Account is CLOSED (or otherwise not ACTIVE) where ACTIVE is required" }
  - { id: ERR_DOCUMENT_INVALID_STATE, http: 409, condition: "Document not in a submittable/reviewable state" }
  - { id: ERR_DISBURSEMENT_ALREADY_EXISTS, http: 409, condition: "A non-CANCELLED disbursement already exists for the case" }
  - { id: ERR_DISBURSEMENT_INVALID_STATE, http: 409, condition: "Disbursement status does not permit return/reissue/cancel" }
  - { id: ERR_REDEPOSIT_INVALID_STATE, http: 409, condition: "Redeposit not PENDING_VERIFICATION" }
  - { id: ERR_VERIFICATION_INVALID_STATE, http: 409, condition: "Verification already completed (VERIFIED/FAILED)" }
  - { id: ERR_TAX_FORM_INVALID_STATE, http: 409, condition: "Finalize on non-DRAFT or correction on non-ISSUED form" }
  - { id: ERR_LOAN_INVALID_STATE, http: 409, condition: "Loan not ACTIVE for transfer/offset" }
  - { id: ERR_SOD_VIOLATION, http: 403, condition: "Segregation of duties: money-movement actor equals eligibility_decided_by" }
  - { id: ERR_NOT_ELIGIBLE, http: 422, condition: "No qualifying event at submit (qualifying_event == NONE)" }
  - { id: ERR_WITHHOLDING_ACK_REQUIRED, http: 422, condition: "INDIRECT_ROLLOVER_OUT submitted without withholding_acknowledged == true" }
  - { id: ERR_PLAN_CAPABILITY_REJECTED, http: 422, condition: "Receiving/holding plan capability flag rejects the operation (rollovers, transfers, loans, after-tax basis, in-plan conversion)" }
  - { id: ERR_SAME_PLAN_TRANSFER, http: 422, condition: "PLAN_TRANSFER receiving plan equals the source plan" }
  - { id: ERR_ACCOUNT_ALREADY_EXISTS, http: 409, condition: "Account already exists for (participant_id, plan_id)" }
  - { id: ERR_ACCOUNT_PARTICIPANT_MISMATCH, http: 422, condition: "Receiving account belongs to a different participant than the case/loan owner" }
  - { id: ERR_OPEN_CASE_EXISTS, http: 409, condition: "Source account already has a non-terminal rollover case (occupation interval [creation, terminal) is half-open)" }
  - { id: ERR_VERIFICATION_NOT_VERIFIED, http: 409, condition: "Required SourcePlanVerification not in VERIFIED state" }
  - { id: ERR_DOCUMENTS_OUTSTANDING, http: 409, condition: "APPROVE attempted while required documents are not all ACCEPTED" }
  - { id: ERR_LOANS_OUTSTANDING, http: 409, condition: "PLAN_TRANSFER completion blocked by ACTIVE loans on the source account" }
  - { id: ERR_LOAN_NOT_TRANSFERRABLE, http: 422, condition: "Receiving plan does not accept loan transfers or is not ACTIVE" }
  - { id: ERR_DISBURSEMENT_IN_FREEZE_WINDOW, http: 422, condition: "Issue date falls inside a PlanFreezeWindow of the source plan (closed interval)" }
  - { id: ERR_FREEZE_WINDOW_OVERLAP, http: 409, condition: "New freeze window collides with an existing window of the same plan (closed-interval overlap; adjacency is allowed)" }
  - { id: ERR_WINDOW_RANGE_INVALID, http: 422, condition: "Freeze window start_date > end_date" }
  - { id: ERR_DEPOSIT_PAST_DEADLINE, http: 422, condition: "Redeposit received_date after the applicable deadline (60-day or offset window); deadline day itself is timely" }
  - { id: ERR_DEPOSIT_EXCEEDS_REMAINING, http: 422, condition: "Redeposit amount exceeds remaining shortfall (case gross - credited, or loan outstanding - repaid)" }
  - { id: ERR_AMOUNT_EXCEEDS_VESTED, http: 422, condition: "requested_amount_cents exceeds vested_balance_cents" }
  - { id: ERR_STALE_VERSION, http: 412, condition: "OCC: expected_*_version does not match the parent entity's current version" }

# =============================================================================
# §1.7 RBAC Matrix
# =============================================================================
roles:
  - name: Participant
    description: "Plan participant; initiates and cancels own cases, submits documents, reads own resources"
    identity: "entity_backed:Participant"
    exclusive_operations: ["create/amend/submit/cancel own rollover cases", "submit own required documents"]
    shared_operations: ["read plans, own accounts, own cases, own documents/disbursements/redeposits/notices/loans/tax forms"]
  - name: PlanSponsorAdmin
    description: "Plan sponsor administrator; manages plan configuration, freeze windows, participant and account onboarding, loan creation"
    identity: "opaque"
    exclusive_operations: ["plan create/freeze/unfreeze/terminate", "freeze-window create", "participant register", "account open", "loan create"]
    shared_operations: ["read all resources"]
  - name: RolloverProcessor
    description: "Recordkeeper operations processor; reviews documents, decides eligibility, runs verifications, issues disbursements, executes transfers/conversions, posts credits; segregation of duties: cannot move money on a case they themselves approved"
    identity: "opaque"
    exclusive_operations: ["document review", "decide-eligibility", "verification create/complete", "issue-disbursement", "execute-transfer", "execute-conversion", "post-credit", "disbursement cancel/return/reissue", "redeposit record/credit/reject", "loan transfer/offset"]
    shared_operations: ["read all resources"]
  - name: TaxReportingOfficer
    description: "Tax reporting officer; finalizes and corrects 1099-R / 5498 forms"
    identity: "opaque"
    exclusive_operations: ["tax-form finalize", "tax-form correct"]
    shared_operations: ["read all resources"]
  - name: OperationsAgent
    description: "Operations runner for scheduled jobs and the logical clock"
    identity: "opaque"
    exclusive_operations: ["daily sweep", "set logical clock"]
    shared_operations: ["read all resources"]
