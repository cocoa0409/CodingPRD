              captures: { agreement_id: $.data.id, first_status: $.data.status }
          trigger:
            - call: "POST /perks/agreements"
              payload: { merchant_id: "${merchant_id}", category: "DINING", region_code: "CA" }
              as: PartnerManager
              as_user_id: "pm-001"
              captures: { e_dup_lane: $.data.error_id }
            - call: "POST /perks/agreements"
              payload: { merchant_id: "${merchant_id}", category: "DINING", region_code: "TX" }
              as: PartnerManager
              as_user_id: "pm-001"
              captures: { second_lane_status: $.data.status, second_lane_region: $.data.region_code }
            - call: "GET /perks/agreements"
              payload: { merchant_id: "${merchant_id}" }
