              captures: { cl: "$.data.id" }
            - call: "POST /ig/jurisdictions"
              payload: { program_id: "${p}", code: "US-FED", name: "Federal" }
              as: PlatformAdmin
              captures: { jur: "$.data.id" }
            - call: "POST /ig/retention-rules"
              payload: { program_id: "${p}", record_class_id: "${cl}", jurisdiction_id: "${jur}", rule_code: "R-1M", retention_months: 1, trigger_basis: "EVENT_DATE", effective_from: "2020-01-01T00:00:00Z" }
              as: RecordsManager
              captures: { rule: "$.data.id" }
            - call: "POST /ig/retention-rules/${rule}/activate"
              payload: {}
              as: RecordsManager
            - call: "POST /ig/records"
              payload: { program_id: "${p}", record_class_id: "${cl}", jurisdiction_id: "${jur}", title: "R", source_system: "ERP", event_date: "2026-06-01T00:00:00Z", size_gb: 1 }
              as: RecordsManager
              captures: { r: "$.data.id" }
          trigger:
            - call: "POST /ig/disposition-requests"
              payload: { program_id: "${p}", record_ids: ["${r}", "${r}"], method: "SECURE_ERASE", justification: "Purge eligible record batch" }
              as: RecordsManager
              as_user_id: "rm-1"
              captures: { err: "$.data.error_id" }
          assert:
            - "err == ERR_DUPLICATE_REQUEST_ITEM (no cross-program distractor present)"

      - name: hold_unacknowledged_release_gate
        claim_type: violation_to_error
        grounds: ["errors[ERR_HOLD_HAS_UNACKNOWLEDGED_CUSTODIANS]"]
        excluded_because:
          difficulty_instance: release_blocked_by_pending_custodian
          rationale: "The gate fires as the failing branch of that §1.8 instance's first release attempt."

      - name: freeze_overlap_error
        claim_type: violation_to_error
        grounds: ["errors[ERR_FREEZE_WINDOW_OVERLAP]"]
        excluded_because:
          difficulty_instance: freeze_window_closed_interval_shared_boundary
          rationale: "The shared-boundary rejection is the error trigger asserted there."

      - name: stale_snapshot_error
        claim_type: violation_to_error
        grounds: ["errors[ERR_STALE_ELIGIBILITY_SNAPSHOT]"]
        excluded_because:
          difficulty_instance: scope_expansion_cascade_record_to_request
          rationale: "The cascade instance ends with the approve attempt returning this exact error."

      - name: conflict_blocked_error
        claim_type: violation_to_error
        grounds: ["errors[ERR_DISPOSITION_CONFLICT_BLOCKED]"]
        excluded_because:
          difficulty_instance: approve_blocked_by_open_conflict
          rationale: "The approve rejection under an OPEN conflict is the asserted outcome there."

