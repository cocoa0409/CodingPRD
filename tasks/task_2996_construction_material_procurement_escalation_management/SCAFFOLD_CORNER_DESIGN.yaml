  - name: temporal_validation_a_clock_rewind_is_rejected_and_the_clock_holds
    claim_type: temporal_validation
    grounds:
    - validations[priority=75]
    - errors[ERR_CLOCK_REWIND]
    - endpoints[POST /procurement/_clock/set_current_utc]
    distinguishing_aspect: 'The logical clock is monotonic: after advancing to 2026-09-05 a request for 2026-09-04T23:59:59.999Z is ERR_CLOCK_REWIND (422) while re-setting the identical current instant is accepted, so the boundary is strictly-earlier rather than not-later.'
    test_recipe:
      setup:
      - A steel package whose float_days depends on the clock
      - The clock has been advanced once to 2026-09-05
      setup_api_calls:
      - call: POST /procurement/projects
        payload: {name: Riverside Medical Tower, contract_number: GC-2996-A, owner_name: Riverside Health System, schedule_data_date: '2026-08-01T00:00:00.000Z', escalation_contingency_budget: '500000.00'}
        as: BuyoutManager
        captures: {proj_id: $.data.id}
      - call: POST /procurement/material-packages
        payload: {project_id: '${proj_id}', scope_code: STRUCT-STEEL-01, description: Structural steel frame package, commodity_index_code: PPI_STEEL_MILL, estimated_cost: '1200000.00', required_onsite_date: '2027-03-01T00:00:00.000Z', fabrication_duration_days: 70, delivery_transit_days: 20, submittal_review_days: 21}
        as: BuyoutManager
        captures: {pkg_id: $.data.id}
      - call: POST /procurement/_clock/set_current_utc
        payload: {to_iso8601: '2026-09-05T00:00:00.000Z'}
        as: BuyoutManager
      trigger:
      - call: POST /procurement/_clock/set_current_utc
        payload: {to_iso8601: '2026-09-04T23:59:59.999Z'}
        as: BuyoutManager
        captures: {err: $.data.error_id}
      - call: POST /procurement/_clock/set_current_utc
        payload: {to_iso8601: '2026-09-05T00:00:00.000Z'}
        as: BuyoutManager
      - call: GET /procurement/material-packages/${pkg_id}
        payload: {}
        as: BuyoutManager
      assert:
      - the first trigger call fails with error_id ERR_CLOCK_REWIND and HTTP 422
      - the second trigger call returns HTTP 200 with current_utc == "2026-09-05T00:00:00.000Z"
      - the second response's expired_quote_ids, lapsed_agreement_ids, voided_commitment_ids and stalled_package_ids are all empty
      - MaterialPackage.${pkg_id}.float_days == 66 and rff_risk_band == ON_TRACK
      - MaterialPackage.${pkg_id}.release_for_fabrication_date == "2026-11-10T00:00:00.000Z"
