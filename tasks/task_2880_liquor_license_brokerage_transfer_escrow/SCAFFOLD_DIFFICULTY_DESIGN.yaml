          Metric = whole-day nonuse count on POST /safekeeping-filings: a licence whose last_active_date is
          2026-02-02 has exactly 180 elapsed days at the default clock and is accepted, while 2026-02-03
          gives 179 days and is refused with ERR_NONUSE_PERIOD_NOT_REACHED - the inclusive >= edge.
        test_recipe:
          setup:
            - "County SON with quota_licenses_total 100; logical clock left at its 2026-08-01T00:00:00Z default."
