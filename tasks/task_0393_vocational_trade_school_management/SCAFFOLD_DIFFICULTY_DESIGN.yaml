# =============================================================================
# §1.8 Scaffold Difficulty Design (Test Targeting Index)
# Vocational / Trade School Management — Expert
# 9 rule_ids x 2 instances = 18 instances
# =============================================================================
scaffold_difficulty_design:

  # ===========================================================================
  - rule_id: dual_variant_calc
    instances:
      - name: refund_pro_rata_vs_state_table_diverge
        grounds:
          - calculations.refund_amount
          - entities.RefundCase.fields.tuition_refund_cents
          - state_machines.RefundCase.COMPUTED_to_SETTLED
        distinguishing_aspect: |
          For one identical withdrawn agreement (1000h program, 250h done,
          cohort span 8, withdrawal term 6), PRO_RATA computes refund 750000c
          off actual clock hours while STATE_TABLE computes refund 250000c off
          the scheduled-term retain step — divergent results on the RefundCase
          entity domain.
        test_recipe:
          setup:
            - "Program required_clock_hours=1000, theory=600, externship=400, tuition_cents=1000000, OPEN."
            - "Cohort start_term_index=0 end_term_index=8 seat_capacity=5, RUNNING."
            - "Student hs_diploma_verified=true; agreement contract_tuition_cents=1000000, cancellation_window_term_index=0; ENROLLED then 250 theory hours POSTED; clock=2 (within window 0? no — withdrawal at 6)."
            - "Clock advanced to term 6; agreement WITHDRAWN at term 6."
          setup_api_calls:
            - call: "POST /v1/programs"
              payload: { name: "HVAC", credential_type: "DIPLOMA", required_clock_hours: 1000, required_theory_hours: 600, required_externship_hours: 400, tuition_cents: 1000000 }
              as: SystemAdmin
              captures: { prog_id: $.data.id }
            - call: "POST /v1/programs/${prog_id}/open"
              payload: {}
              as: SystemAdmin
            - call: "POST /v1/cohorts"
              payload: { program_id: "${prog_id}", code: "HVAC-A", start_term_index: 0, end_term_index: 8, seat_capacity: 5 }
              as: Registrar
              captures: { coh_id: $.data.id }
            - call: "POST /v1/cohorts/${coh_id}/start"
              payload: {}
              as: Registrar
            - call: "POST /v1/students"
              payload: { full_name: "Ana Diaz", email: "ana@x.com", hs_diploma_verified: true }
              as: Registrar
              captures: { stu_id: $.data.id }
            - call: "POST /v1/enrollment-agreements"
              payload: { student_id: "${stu_id}", cohort_id: "${coh_id}", contract_tuition_cents: 1000000, scheduled_aid_cents: 0, cancellation_window_term_index: 0 }
              as: Registrar
              captures: { agr_id: $.data.id }
            - call: "POST /v1/enrollment-agreements/${agr_id}/enroll"
              payload: {}
              as: Registrar
            - call: "POST /v1/attendance-entries"
              payload: { agreement_id: "${agr_id}", term_index: 1, kind: "THEORY", scheduled_hours: 250, attended_hours: 250 }
              as: AcademicAdvisor
            - call: "POST /v1/clock/advance"
              payload: { to_term_index: 6 }
              as: SystemAdmin
            - call: "POST /v1/enrollment-agreements/${agr_id}/withdraw"
              payload: {}
              as: Registrar
          trigger:
            - call: "POST /v1/refund-cases"
              payload: { agreement_id: "${agr_id}", method: "PRO_RATA", withdrawal_term_index: 6 }
              as: FinancialAidOfficer
              captures: { refund_pr: $.data.tuition_refund_cents }
            - call: "POST /v1/refund-cases"
              payload: { agreement_id: "${agr_id}", method: "STATE_TABLE", withdrawal_term_index: 6 }
              as: FinancialAidOfficer
              captures: { refund_st: $.data.tuition_refund_cents }
          assert:
            - "RefundCase(method=PRO_RATA).tuition_refund_cents == 750000"
            - "RefundCase(method=STATE_TABLE).tuition_refund_cents == 250000"
            - "${refund_pr} != ${refund_st}"

      - name: sap_first_offense_vs_repeat_offense_diverge
        grounds:
          - calculations.sap_standing_classification
          - entities.SapStanding.fields.standing
          - state_machines.SapStanding.NONE_to_APPEALED
        distinguishing_aspect: |
          On the SapStanding entity domain, a sub-floor pace produces PROBATION
          when prior standing is GOOD (first_offense variant) but DISMISSED when
          a prior WARNING/PROBATION exists (repeat_offense variant) — two valid
          classifications of the same pace value, distinct from the RefundCase
          dual variant.
        test_recipe:
          setup:
            - "Program required_clock_hours=1000, sap thresholds default (warning 0.667, probation 0.5)."
            - "Cohort start=0 end=8 RUNNING; agreement A ENROLLED with 200 theory hours; agreement B ENROLLED with 250 theory hours."
            - "For B: one earlier WARNING SAP review at checkpoint 4 (pace 0.5), then a checkpoint-6 review (pace 0.3333) escalates to DISMISSED."
            - "For A: first SAP review at checkpoint 6 with pace 0.2667 (prior GOOD) yields PROBATION."
          setup_api_calls:
            - call: "POST /v1/programs"
              payload: { name: "Welding", credential_type: "CERTIFICATE", required_clock_hours: 1000, required_theory_hours: 600, required_externship_hours: 400, tuition_cents: 800000 }
              as: SystemAdmin
              captures: { prog_id: $.data.id }
            - call: "POST /v1/programs/${prog_id}/open"
              payload: {}
              as: SystemAdmin
            - call: "POST /v1/cohorts"
              payload: { program_id: "${prog_id}", code: "WELD-A", start_term_index: 0, end_term_index: 8, seat_capacity: 5 }
              as: Registrar
              captures: { coh_id: $.data.id }
            - call: "POST /v1/cohorts/${coh_id}/start"
              payload: {}
              as: Registrar
            - call: "POST /v1/students"
              payload: { full_name: "Bo Lee", email: "bo@x.com", hs_diploma_verified: true }
              as: Registrar
              captures: { stu_a: $.data.id }
            - call: "POST /v1/students"
              payload: { full_name: "Cy Ng", email: "cy@x.com", hs_diploma_verified: true }
              as: Registrar
              captures: { stu_b: $.data.id }
            - call: "POST /v1/enrollment-agreements"
              payload: { student_id: "${stu_a}", cohort_id: "${coh_id}", contract_tuition_cents: 800000, cancellation_window_term_index: 0 }
              as: Registrar
              captures: { agr_a: $.data.id }
            - call: "POST /v1/enrollment-agreements/${agr_a}/enroll"
              payload: {}
              as: Registrar
            - call: "POST /v1/enrollment-agreements"
              payload: { student_id: "${stu_b}", cohort_id: "${coh_id}", contract_tuition_cents: 800000, cancellation_window_term_index: 0 }
              as: Registrar
              captures: { agr_b: $.data.id }
            - call: "POST /v1/enrollment-agreements/${agr_b}/enroll"
              payload: {}
              as: Registrar
            - call: "POST /v1/attendance-entries"
              payload: { agreement_id: "${agr_a}", term_index: 1, kind: "THEORY", scheduled_hours: 200, attended_hours: 200 }
              as: AcademicAdvisor
            - call: "POST /v1/attendance-entries"
              payload: { agreement_id: "${agr_b}", term_index: 1, kind: "THEORY", scheduled_hours: 250, attended_hours: 250 }
              as: AcademicAdvisor
            - call: "POST /v1/sap-standings"
              payload: { agreement_id: "${agr_b}", checkpoint_term_index: 4 }
              as: AcademicAdvisor
              captures: { sap_b1: $.data.standing }
          trigger:
            - call: "POST /v1/sap-standings"
              payload: { agreement_id: "${agr_a}", checkpoint_term_index: 6 }
              as: AcademicAdvisor
              captures: { sap_a: $.data.standing }
            - call: "POST /v1/sap-standings"
              payload: { agreement_id: "${agr_b}", checkpoint_term_index: 6 }
              as: AcademicAdvisor
              captures: { sap_b2: $.data.standing }
          assert:
            - "SapStanding(agr_b, checkpoint 4).standing == WARNING"
            - "SapStanding(agr_a, checkpoint 6).standing == PROBATION"
            - "SapStanding(agr_b, checkpoint 6).standing == DISMISSED"

  # ===========================================================================
  - rule_id: combinatorial_formula
    instances:
      - name: sap_pace_nested_min_max_conditional
        grounds:
          - calculations.sap_pace
          - entities.SapStanding.fields.measured_pace_pct
          - entities.Program.fields.required_clock_hours
        distinguishing_aspect: |
          Mode (a): measured_pace_pct nests min/max clamp on elapsed_fraction,
          divides by a conditional expected_hours (guarding the zero case), and
          combines three inputs (checkpoint term, cohort span, program hours) —
          a non-linear formula, distinct from mode (b) rounding.
        test_recipe:
          setup:
            - "Program required_clock_hours=1000; cohort start=0 end=8."
            - "Agreement ENROLLED with 250 theory hours; SAP review at checkpoint 4 -> elapsed_fraction 0.5, expected_hours 500, pace 0.5."
          setup_api_calls:
            - call: "POST /v1/programs"
              payload: { name: "Plumbing", credential_type: "DIPLOMA", required_clock_hours: 1000, required_theory_hours: 600, required_externship_hours: 400, tuition_cents: 900000 }
              as: SystemAdmin
              captures: { prog_id: $.data.id }
            - call: "POST /v1/programs/${prog_id}/open"
              payload: {}
              as: SystemAdmin
            - call: "POST /v1/cohorts"
              payload: { program_id: "${prog_id}", code: "PLB-A", start_term_index: 0, end_term_index: 8, seat_capacity: 5 }
              as: Registrar
              captures: { coh_id: $.data.id }
            - call: "POST /v1/cohorts/${coh_id}/start"
              payload: {}
              as: Registrar
            - call: "POST /v1/students"
              payload: { full_name: "Di Fox", email: "di@x.com", hs_diploma_verified: true }
              as: Registrar
              captures: { stu_id: $.data.id }
            - call: "POST /v1/enrollment-agreements"
              payload: { student_id: "${stu_id}", cohort_id: "${coh_id}", contract_tuition_cents: 900000, cancellation_window_term_index: 0 }
              as: Registrar
              captures: { agr_id: $.data.id }
            - call: "POST /v1/enrollment-agreements/${agr_id}/enroll"
              payload: {}
              as: Registrar
            - call: "POST /v1/attendance-entries"
              payload: { agreement_id: "${agr_id}", term_index: 1, kind: "THEORY", scheduled_hours: 250, attended_hours: 250 }
              as: AcademicAdvisor
          trigger:
            - call: "POST /v1/sap-standings"
              payload: { agreement_id: "${agr_id}", checkpoint_term_index: 4 }
              as: AcademicAdvisor
              captures: { pace: $.data.measured_pace_pct, st: $.data.standing }
          assert:
            - "SapStanding.measured_pace_pct == 0.5"
            - "SapStanding.standing == WARNING"

      - name: refund_round_once_sum_then_round
        grounds:
          - calculations.refund_amount
          - calculations.aid_return
          - entities.RefundCase.fields.tuition_earned_cents
        distinguishing_aspect: |
          Mode (b): contract_tuition_cents * earned_fraction is rounded
          round_half_up exactly ONCE on the aggregate (sum-then-round) — pinned
          so a per-term rounding order would diverge; distinct from the mode (a)
          nested-min/max sap_pace formula.
        test_recipe:
          setup:
            - "Program required_clock_hours=1000; tuition 1000333c (a value that exercises rounding)."
            - "Agreement ENROLLED with 333 theory hours -> earned_fraction 0.333; PRO_RATA earned = round_half_up(1000333*0.333)."
            - "Clock at term 5, withdrawn; cancellation_window_term_index=0."
          setup_api_calls:
            - call: "POST /v1/programs"
              payload: { name: "Esthetics", credential_type: "CERTIFICATE", required_clock_hours: 1000, required_theory_hours: 600, required_externship_hours: 400, tuition_cents: 1000333 }
              as: SystemAdmin
              captures: { prog_id: $.data.id }
            - call: "POST /v1/programs/${prog_id}/open"
              payload: {}
              as: SystemAdmin
            - call: "POST /v1/cohorts"
              payload: { program_id: "${prog_id}", code: "EST-A", start_term_index: 0, end_term_index: 10, seat_capacity: 5 }
              as: Registrar
              captures: { coh_id: $.data.id }
            - call: "POST /v1/cohorts/${coh_id}/start"
              payload: {}
              as: Registrar
            - call: "POST /v1/students"
              payload: { full_name: "Ev Ray", email: "ev@x.com", hs_diploma_verified: true }
              as: Registrar
              captures: { stu_id: $.data.id }
            - call: "POST /v1/enrollment-agreements"
              payload: { student_id: "${stu_id}", cohort_id: "${coh_id}", contract_tuition_cents: 1000333, cancellation_window_term_index: 0 }
              as: Registrar
              captures: { agr_id: $.data.id }
            - call: "POST /v1/enrollment-agreements/${agr_id}/enroll"
              payload: {}
              as: Registrar
            - call: "POST /v1/attendance-entries"
              payload: { agreement_id: "${agr_id}", term_index: 1, kind: "THEORY", scheduled_hours: 333, attended_hours: 333 }
              as: AcademicAdvisor
            - call: "POST /v1/clock/advance"
              payload: { to_term_index: 5 }
              as: SystemAdmin
            - call: "POST /v1/enrollment-agreements/${agr_id}/withdraw"
              payload: {}
              as: Registrar
          trigger:
            - call: "POST /v1/refund-cases"
              payload: { agreement_id: "${agr_id}", method: "PRO_RATA", withdrawal_term_index: 5 }
              as: FinancialAidOfficer
              captures: { earned: $.data.tuition_earned_cents }
          assert:
            - "RefundCase.tuition_earned_cents == 333111"
            - "RefundCase.tuition_refund_cents == 667222"

  # ===========================================================================
  - rule_id: non_linear_state_machine
    instances:
      - name: sap_parallel_standing_and_appeal_dimensions
        grounds:
          - state_machines.SapStanding.NONE_to_APPEALED
          - state_machines.SapStanding.APPEALED_to_APPEAL_GRANTED
          - entities.SapStanding.fields.appeal_status
        distinguishing_aspect: |
          SapStanding carries two independent state dimensions on one row:
          `standing` (computed/frozen at creation) and `appeal_status`
          (NONE->APPEALED->{GRANTED,DENIED} cycle) — parallel dimensions on the
          SapStanding entity.
        test_recipe:
          setup:
            - "Agreement ENROLLED; a DISMISSED SapStanding exists (prior WARNING then sub-floor review)."
          setup_api_calls:
            - call: "POST /v1/programs"
              payload: { name: "Barber", credential_type: "CERTIFICATE", required_clock_hours: 1000, required_theory_hours: 600, required_externship_hours: 400, tuition_cents: 700000 }
              as: SystemAdmin
              captures: { prog_id: $.data.id }
            - call: "POST /v1/programs/${prog_id}/open"
              payload: {}
              as: SystemAdmin
            - call: "POST /v1/cohorts"
              payload: { program_id: "${prog_id}", code: "BRB-A", start_term_index: 0, end_term_index: 8, seat_capacity: 5 }
              as: Registrar
              captures: { coh_id: $.data.id }
            - call: "POST /v1/cohorts/${coh_id}/start"
              payload: {}
              as: Registrar
            - call: "POST /v1/students"
              payload: { full_name: "Fi Tan", email: "fi@x.com", hs_diploma_verified: true }
              as: Registrar
              captures: { stu_id: $.data.id }
            - call: "POST /v1/enrollment-agreements"
              payload: { student_id: "${stu_id}", cohort_id: "${coh_id}", contract_tuition_cents: 700000, cancellation_window_term_index: 0 }
              as: Registrar
              captures: { agr_id: $.data.id }
            - call: "POST /v1/enrollment-agreements/${agr_id}/enroll"
              payload: {}
              as: Registrar
            - call: "POST /v1/attendance-entries"
              payload: { agreement_id: "${agr_id}", term_index: 1, kind: "THEORY", scheduled_hours: 250, attended_hours: 250 }
              as: AcademicAdvisor
            - call: "POST /v1/sap-standings"
              payload: { agreement_id: "${agr_id}", checkpoint_term_index: 4 }
              as: AcademicAdvisor
            - call: "POST /v1/sap-standings"
              payload: { agreement_id: "${agr_id}", checkpoint_term_index: 6 }
              as: AcademicAdvisor
              captures: { sap_id: $.data.id, st: $.data.standing }
          trigger:
            - call: "POST /v1/sap-standings/${sap_id}/appeal"
              payload: {}
              as: AcademicAdvisor
              captures: { ap: $.data.appeal_status }
            - call: "POST /v1/sap-standings/${sap_id}/resolve-appeal"
              payload: { decision: "GRANT" }
              as: AcademicAdvisor
              captures: { ap2: $.data.appeal_status }
          assert:
            - "SapStanding.standing == DISMISSED"
            - "SapStanding.appeal_status == APPEAL_GRANTED after GRANT (standing dimension unchanged at DISMISSED)"
            - "EnrollmentAgreement.sap_standing == PROBATION after granted appeal"

      - name: agreement_loa_cycle_enrolled_loa_enrolled
        grounds:
          - state_machines.EnrollmentAgreement.ENROLLED_to_LEAVE_OF_ABSENCE
          - state_machines.EnrollmentAgreement.LEAVE_OF_ABSENCE_to_ENROLLED
          - entities.EnrollmentAgreement.fields.status
        distinguishing_aspect: |
          EnrollmentAgreement cycles ENROLLED->LEAVE_OF_ABSENCE->ENROLLED (a
          revision loop returning to a prior state), a cyclic non-linear shape on
          a different entity than SapStanding's parallel dimensions.
        test_recipe:
          setup:
            - "Agreement ENROLLED in a RUNNING cohort."
          setup_api_calls:
            - call: "POST /v1/programs"
              payload: { name: "Massage", credential_type: "DIPLOMA", required_clock_hours: 1000, required_theory_hours: 600, required_externship_hours: 400, tuition_cents: 600000 }
              as: SystemAdmin
              captures: { prog_id: $.data.id }
            - call: "POST /v1/programs/${prog_id}/open"
              payload: {}
              as: SystemAdmin
            - call: "POST /v1/cohorts"
              payload: { program_id: "${prog_id}", code: "MSG-A", start_term_index: 0, end_term_index: 8, seat_capacity: 5 }
              as: Registrar
              captures: { coh_id: $.data.id }
            - call: "POST /v1/cohorts/${coh_id}/start"
              payload: {}
              as: Registrar
            - call: "POST /v1/students"
              payload: { full_name: "Gi Vue", email: "gi@x.com", hs_diploma_verified: true }
              as: Registrar
              captures: { stu_id: $.data.id }
            - call: "POST /v1/enrollment-agreements"
              payload: { student_id: "${stu_id}", cohort_id: "${coh_id}", contract_tuition_cents: 600000, cancellation_window_term_index: 0 }
              as: Registrar
              captures: { agr_id: $.data.id }
            - call: "POST /v1/enrollment-agreements/${agr_id}/enroll"
              payload: {}
              as: Registrar
          trigger:
            - call: "POST /v1/enrollment-agreements/${agr_id}/start-loa"
              payload: {}
              as: AcademicAdvisor
              captures: { s1: $.data.status }
            - call: "POST /v1/enrollment-agreements/${agr_id}/return-from-loa"
              payload: {}
              as: AcademicAdvisor
              captures: { s2: $.data.status }
          assert:
            - "After start-loa EnrollmentAgreement.status == LEAVE_OF_ABSENCE"
            - "After return-from-loa EnrollmentAgreement.status == ENROLLED"

  # ===========================================================================
  - rule_id: transitive_cascade
    instances:
      - name: denied_appeal_dismissal_withdraws_terminates_decrements_site
        grounds:
          - state_machines.SapStanding.APPEALED_to_APPEAL_DENIED
          - state_machines.EnrollmentAgreement.ENROLLED_to_WITHDRAWN
          - state_machines.ExternshipAssignment.PLACED_to_TERMINATED
          - entities.ExternshipSite.fields.active_assignment_count
        distinguishing_aspect: |
          Depth-3 chain: denying the appeal of a DISMISSED standing (A) ->
          parent agreement WITHDRAWN (B, caused by A) -> that agreement's active
          ExternshipAssignment TERMINATED (C, caused by B) -> ExternshipSite
          active_assignment_count decremented (D, caused by C); each link caused
          by the previous, originating from the resolve-appeal DENY transition.
        test_recipe:
          setup:
            - "Agreement ENROLLED with a DISMISSED SapStanding (prior WARNING then sub-floor)."
            - "Agreement has one PLACED ExternshipAssignment at a site with capacity 1 -> site.active_assignment_count == 1."
            - "Appeal filed on the dismissed standing (appeal_status APPEALED)."
          setup_api_calls:
            - call: "POST /v1/programs"
              payload: { name: "Nursing Asst", credential_type: "CERTIFICATE", required_clock_hours: 1000, required_theory_hours: 600, required_externship_hours: 400, tuition_cents: 500000 }
              as: SystemAdmin
              captures: { prog_id: $.data.id }
            - call: "POST /v1/programs/${prog_id}/open"
              payload: {}
              as: SystemAdmin
            - call: "POST /v1/cohorts"
              payload: { program_id: "${prog_id}", code: "CNA-A", start_term_index: 0, end_term_index: 8, seat_capacity: 5 }
              as: Registrar
              captures: { coh_id: $.data.id }
            - call: "POST /v1/cohorts/${coh_id}/start"
              payload: {}
              as: Registrar
            - call: "POST /v1/externship-sites"
              payload: { name: "Clinic One", daily_slot_capacity: 1 }
              as: AcademicAdvisor
              captures: { site_id: $.data.id }
            - call: "POST /v1/students"
              payload: { full_name: "Hu Wei", email: "hu@x.com", hs_diploma_verified: true }
              as: Registrar
              captures: { stu_id: $.data.id }
            - call: "POST /v1/enrollment-agreements"
              payload: { student_id: "${stu_id}", cohort_id: "${coh_id}", contract_tuition_cents: 500000, cancellation_window_term_index: 0 }
              as: Registrar
              captures: { agr_id: $.data.id }
            - call: "POST /v1/enrollment-agreements/${agr_id}/enroll"
              payload: {}
              as: Registrar
            - call: "POST /v1/attendance-entries"
              payload: { agreement_id: "${agr_id}", term_index: 1, kind: "THEORY", scheduled_hours: 250, attended_hours: 250 }
              as: AcademicAdvisor
            - call: "POST /v1/externship-assignments"
              payload: { agreement_id: "${agr_id}", site_id: "${site_id}", start_term_index: 1, end_term_index: 4, planned_hours: 100 }
              as: AcademicAdvisor
              captures: { asn_id: $.data.id }
            - call: "POST /v1/sap-standings"
              payload: { agreement_id: "${agr_id}", checkpoint_term_index: 4 }
              as: AcademicAdvisor
            - call: "POST /v1/sap-standings"
              payload: { agreement_id: "${agr_id}", checkpoint_term_index: 6 }
              as: AcademicAdvisor
              captures: { sap_id: $.data.id }
            - call: "POST /v1/sap-standings/${sap_id}/appeal"
              payload: {}
              as: AcademicAdvisor
          trigger:
            - call: "POST /v1/sap-standings/${sap_id}/resolve-appeal"
              payload: { decision: "DENY" }
              as: AcademicAdvisor
          assert:
            - "EnrollmentAgreement.${agr_id}.status == WITHDRAWN"
            - "ExternshipAssignment.${asn_id}.status == TERMINATED"
            - "ExternshipSite.${site_id}.active_assignment_count == 0"

      - name: refund_settle_returns_aid_recomputes_ledger
        grounds:
          - state_machines.RefundCase.COMPUTED_to_SETTLED
          - state_machines.AidDisbursement.RELEASED_to_RETURNED
          - entities.EnrollmentAgreement.fields.disbursed_aid_cents
          - calculations.aid_return
        distinguishing_aspect: |
          Depth-2 chain originating from the refund settle transition (distinct
          from the denied-appeal trigger): settling the RefundCase (A) ->
          RELEASED AidDisbursement(s) transition to RETURNED (B, caused by A) ->
          agreement.disbursed_aid_cents and ledger_balance_cents recomputed
          (C, caused by B).
        test_recipe:
          setup:
            - "Program required_clock_hours=1000, tuition 1000000, OPEN; cohort span 8 RUNNING."
            - "Agreement ENROLLED, scheduled_aid_cents=400000, 250 theory hours, two RELEASED draws (200000 + 200000) -> disbursed_aid_cents 400000."
            - "Clock at term 6, agreement WITHDRAWN; PRO_RATA refund case COMPUTED (aid_return_cents 300000)."
