            - "ReconciliationPeriod.${per_id}.open_exception_count == 0"
            - "ReconciliationPeriod.${per_id}.imported_line_count == 0"

      - name: coordination_request_reroute_self_loop_stops_at_cap
        grounds:
          - state_machines.CoordinationRequest.OPEN_to_OPEN
