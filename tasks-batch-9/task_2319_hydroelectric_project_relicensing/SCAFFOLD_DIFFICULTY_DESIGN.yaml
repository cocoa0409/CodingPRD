  # ===========================================================================
  - rule_id: priority_pair_validation_conflict
    instances:
      - name: application_filing_stage_error_precedes_burden_ratio_error
        grounds:
          - validations[priority=43]
          - validations[priority=72]
          - calculations.project_burden_ledger
        distinguishing_aspect: |
          Pair one: category `state` (priority 43, ERR_PROJECT_STAGE_INVALID) against category
          `business_fiscal` (priority 72, ERR_BURDEN_RATIO_EXCEEDED) on POST /relicensing/applications.
          The project is simultaneously in the wrong stage (PAD_FILED) and over the 15.00 burden
          ceiling (18.71), and the response must carry the stage error, never the fiscal one.
        test_recipe:
          setup:
            - "Project at stage PAD_FILED (no study plan yet) with base_annual_generation_mwh 50000 and pad_year 2026."
            - "One INCLUDED AGENCY_PRESCRIPTION measure pushing burden_ratio_pct to 18.71, so economically_infeasible is true and regulatory_posture is RESTRICTED."
            - "infeasibility_waiver_granted is false; wqc_status is NONE."
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-08-01T00:00:00Z" }
              as: Regulator
            - call: "POST /relicensing/projects"
              payload: { license_number: "P-4421", project_name: "Priority Pair Falls", installed_capacity_mw: 12.0, base_annual_generation_mwh: 50000, license_expiration_date: "2033-12-31" }
              as: Regulator
              captures: { proj: $.data.id }
            - call: "POST /relicensing/projects/${proj}/pre-application-document"
              payload: { filing_note: "PAD" }
              as: Licensee
              as_user_id: "u_lic_a"
            - call: "POST /relicensing/pme-measures"
              payload: { project_id: "${proj}", measure_name: "Full-height fish ladder", resource_category: "FISH_PASSAGE", source: "AGENCY_PRESCRIPTION", capital_cost_usd: 4000000.00, annual_om_cost_usd: 100000.00, construction_start_year: 2026, implementation_months: 24, flow_release_cfs: 300, gross_head_ft: 90, release_days: 200 }
              as: Licensee
              as_user_id: "u_lic_a"
              captures: { m_big: $.data.id }
            - call: "GET /relicensing/projects/${proj}"
              payload: {}
              as: Licensee
              as_user_id: "u_lic_a"
              captures: { pv: $.data.version, ratio: $.data.burden_ratio_pct, posture: $.data.regulatory_posture }
          trigger:
            - call: "POST /relicensing/applications"
              payload: { project_id: "${proj}", application_type: "ORIGINAL_RELICENSE", expected_project_version: "${pv}", filing_note: "premature filing" }
              as: Licensee
              as_user_id: "u_lic_a"
              captures: { err: $.data.error_id }
          assert:
            - "${ratio} == 18.71 and ${posture} == RESTRICTED (both violations are live before the trigger)"
            - "${err} == ERR_PROJECT_STAGE_INVALID with HTTP 409"
            - "${err} != ERR_BURDEN_RATIO_EXCEEDED"
            - "${err} != ERR_STUDY_PLAN_NOT_APPROVED"
            - "no LicenseApplication exists for project ${proj}"
            - "RelicensingProject.${proj}.stage == PAD_FILED and version == ${pv} (unchanged)"

      - name: study_creation_window_conflict_precedes_cultural_clearance_error
        grounds:
          - validations[priority=60]
          - validations[priority=65]
          - entities.StudySite.fields.min_rest_buffer_days
          - entities.StudySite.fields.cultural_sensitivity
        distinguishing_aspect: |
          Pair two, a different error-category pair on a different endpoint: category
          `business_temporal` (priority 60, ERR_SITE_WINDOW_CONFLICT) against category
          `business_constraint` (priority 65, ERR_CULTURAL_CLEARANCE_MISSING) on
          POST /relicensing/studies. The payload both overlaps the buffered window of an active
          study and omits the clearance reference the HIGH-sensitivity site requires; the temporal
          error must win.
        test_recipe:
          setup:
            - "Project at STUDY_PHASE with a DRAFT study plan."
            - "StudySite S9 with cultural_sensitivity HIGH and min_rest_buffer_days 14."
            - "One CULTURAL study at S9 with fieldwork window 2026-09-01 to 2026-10-01 and fieldwork_status PLANNED, created with cultural_clearance_reference THPO-2026-01."
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-08-01T00:00:00Z" }
              as: Regulator
            - call: "POST /relicensing/projects"
              payload: { license_number: "P-4422", project_name: "Sacred Reach", installed_capacity_mw: 16.0, base_annual_generation_mwh: 250000, license_expiration_date: "2033-12-31" }
              as: Regulator
              captures: { proj: $.data.id }
            - call: "POST /relicensing/sites"
              payload: { project_id: "${proj}", site_code: "S9", river_mile: 9.0, min_rest_buffer_days: 14, cultural_sensitivity: "HIGH" }
              as: Licensee
              as_user_id: "u_lic_a"
              captures: { site: $.data.id }
            - call: "POST /relicensing/projects/${proj}/pre-application-document"
              payload: { filing_note: "PAD" }
              as: Licensee
              as_user_id: "u_lic_a"
            - call: "POST /relicensing/study-plans"
              payload: { project_id: "${proj}", plan_title: "Study Plan 1" }
              as: Licensee
              as_user_id: "u_lic_a"
              captures: { plan: $.data.id }
            - call: "POST /relicensing/studies"
              payload: { study_plan_id: "${plan}", site_id: "${site}", resource_category: "CULTURAL", study_title: "Ethnographic survey", fieldwork_window_start: "2026-09-01", fieldwork_window_end: "2026-10-01", cultural_clearance_reference: "THPO-2026-01" }
              as: Licensee
              as_user_id: "u_lic_a"
              captures: { study_a: $.data.id }
          trigger:
            - call: "POST /relicensing/studies"
              payload: { study_plan_id: "${plan}", site_id: "${site}", resource_category: "RECREATION", study_title: "Overlapping recreation survey", fieldwork_window_start: "2026-10-14", fieldwork_window_end: "2026-11-14" }
              as: Licensee
              as_user_id: "u_lic_a"
              captures: { err: $.data.error_id }
          assert:
            - "${err} == ERR_SITE_WINDOW_CONFLICT with HTTP 409"
            - "${err} != ERR_CULTURAL_CLEARANCE_MISSING"
            - "StudyPlan.${plan}.attached_study_count == 1 (no second study was created)"
            - "ResourceStudy.${study_a}.fieldwork_window_end == 2026-10-01 and the site's 14-day rest buffer makes 2026-10-14 still inside the blocked span"

  # ===========================================================================
  - rule_id: boundary_precision_check
    instances:
      - name: support_pct_exactly_at_threshold_executes_the_settlement
        grounds:
          - calculations.settlement_support_tally
          - validations[priority=70]
          - state_machines.Settlement.CIRCULATED_to_EXECUTED
        distinguishing_aspect: |
          The threshold SUPPORT_THRESHOLD_PCT is 66.67 and the comparison is `>=`. With vote weights
          1/3/2 and SUPPORT from the weight-1 and weight-3 parties the per-party rounding gives
          16.67 + 50.00 == 66.67 exactly, so the settlement executes; the sibling 1/1/1 case sums to
          66.66 and is rejected. Only the exact-boundary value distinguishes the two.
        test_recipe:
          setup:
            - "Project at STUDY_PHASE with an APPROVED study plan and three parties of vote_weight 1 (agency, conditioning authority), 3 (tribe) and 2 (NGO); total_vote_weight 6."
            - "A CIRCULATED settlement in round 1 with one PROPOSED WATER_QUALITY measure (capital 600000.00, om 20000.00, construction_start_year == pad_year, flow 40, head 60, days 120)."
            - "SUPPORT signatures from the weight-1 agency and the weight-3 tribe; the weight-2 NGO has not signed."
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-08-01T00:00:00Z" }
              as: Regulator
            - call: "POST /relicensing/projects"
              payload: { license_number: "P-4423", project_name: "Threshold Reach", installed_capacity_mw: 24.0, base_annual_generation_mwh: 250000, license_expiration_date: "2033-12-31" }
              as: Regulator
              captures: { proj: $.data.id }
            - call: "POST /relicensing/sites"
              payload: { project_id: "${proj}", site_code: "S1", river_mile: 4.0, min_rest_buffer_days: 0, cultural_sensitivity: "NONE" }
              as: Licensee
              as_user_id: "u_lic_a"
              captures: { site: $.data.id }
            - call: "POST /relicensing/projects/${proj}/pre-application-document"
              payload: { filing_note: "PAD" }
              as: Licensee
              as_user_id: "u_lic_a"
            - call: "POST /relicensing/study-plans"
              payload: { project_id: "${proj}", plan_title: "Study Plan 1" }
              as: Licensee
              as_user_id: "u_lic_a"
              captures: { plan: $.data.id }
            - call: "POST /relicensing/studies"
              payload: { study_plan_id: "${plan}", site_id: "${site}", resource_category: "WATER_QUALITY", study_title: "Temperature study", fieldwork_window_start: "2026-09-01", fieldwork_window_end: "2026-10-01" }
              as: Licensee
              as_user_id: "u_lic_a"
            - call: "POST /relicensing/parties"
              payload: { project_id: "${proj}", party_name: "State Fish Agency", party_type: "AGENCY", has_conditioning_authority: true, vote_weight: 1, contact_user_id: "u_agency" }
              as: Regulator
              captures: { p_agency: $.data.id }
            - call: "POST /relicensing/parties"
              payload: { project_id: "${proj}", party_name: "River Tribe", party_type: "TRIBE", vote_weight: 3, contact_user_id: "u_tribe" }
              as: Regulator
              captures: { p_tribe: $.data.id }
            - call: "POST /relicensing/parties"
              payload: { project_id: "${proj}", party_name: "River Alliance", party_type: "NGO", vote_weight: 2, contact_user_id: "u_ngo" }
              as: Regulator
              captures: { p_ngo: $.data.id }
            - call: "POST /relicensing/study-plans/${plan}/submit"
              payload: { submission_note: "plan for review" }
              as: Licensee
              as_user_id: "u_lic_a"
            - call: "POST /relicensing/study-plans/${plan}/determination"
              payload: { determination: "APPROVE" }
              as: AgencyReviewer
              as_user_id: "u_agency"
            - call: "GET /relicensing/projects/${proj}"
              payload: {}
              as: Licensee
              as_user_id: "u_lic_a"
              captures: { pv: $.data.version }
            - call: "POST /relicensing/settlements"
              payload: { project_id: "${proj}", title: "Comprehensive settlement", expected_project_version: "${pv}" }
              as: Licensee
              as_user_id: "u_lic_a"
              captures: { stl: $.data.id }
            - call: "POST /relicensing/pme-measures"
              payload: { project_id: "${proj}", measure_name: "Minimum flow release", resource_category: "WATER_QUALITY", source: "SETTLEMENT", settlement_id: "${stl}", capital_cost_usd: 600000.00, annual_om_cost_usd: 20000.00, construction_start_year: 2026, implementation_months: 6, flow_release_cfs: 40, gross_head_ft: 60, release_days: 120 }
              as: Licensee
              as_user_id: "u_lic_a"
              captures: { m_w1: $.data.id }
            - call: "POST /relicensing/settlements/${stl}/circulate"
              payload: { circulation_note: "round 1" }
              as: Licensee
              as_user_id: "u_lic_a"
            - call: "POST /relicensing/signatures"
              payload: { settlement_id: "${stl}", party_id: "${p_agency}", position: "SUPPORT" }
              as: AgencyReviewer
              as_user_id: "u_agency"
              captures: { sig_a: $.data.id }
            - call: "POST /relicensing/signatures"
              payload: { settlement_id: "${stl}", party_id: "${p_tribe}", position: "SUPPORT" }
              as: Stakeholder
              as_user_id: "u_tribe"
              captures: { sig_t: $.data.id }
          trigger:
            - call: "POST /relicensing/settlements/${stl}/tally"
              payload: { intended_outcome: "EXECUTE" }
              as: Licensee
              as_user_id: "u_lic_a"
              captures: { pct: $.data.support_pct, st: $.data.status, weight: $.data.total_vote_weight, inc: $.data.included_measure_count }
          assert:
            - "${weight} == 6"
            - "SettlementSignature.${sig_a}.share_pct == 16.67 and SettlementSignature.${sig_t}.share_pct == 50.00"
            - "${pct} == 66.67 exactly, which satisfies >= 66.67"
            - "${st} == EXECUTED and ${inc} == 1"
            - "PmeMeasure.${m_w1}.status == INCLUDED"
            - "RelicensingProject.${proj}.total_pme_annual_cost_usd == 57500.00, administrative_annual_charge_usd == 1150.00, total_generation_loss_mwh == 230.4, total_annual_burden_usd == 68326.80, burden_ratio_pct == 0.65"
            - "RelicensingProject.${proj}.regulatory_posture == OPEN"

      - name: burden_ratio_exactly_at_limit_is_infeasible_and_one_mwh_more_is_not
        grounds:
          - calculations.project_burden_ledger
          - validations[priority=72]
          - endpoints["PATCH /relicensing/projects/{project_id}"]
        distinguishing_aspect: |
          economically_infeasible uses `burden_ratio_pct >= 15.00`. The DEFINITIVE switch lands the
          ratio on exactly 15.00 (burden 630000.00 against gross revenue 4200000.00), so the project
          becomes infeasible and RESTRICTED; raising base_annual_generation_mwh to 120000 moves the
          same burden to 12.50 and clears it. The PRELIMINARY starting point is 8.03, so the boundary
          is crossed by the variant switch alone, not by any cost change.
        test_recipe:
          setup:
            - "Project at PAD_FILED with base_annual_generation_mwh 100000, pad_year 2026, infeasibility_waiver_granted false."
            - "One INCLUDED WATER_QUALITY measure created by u_lic_a: capital 1000000.00, om 155102.94, construction_start_year 2026, flow 250, head 100, days 229, still PRELIMINARY."
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-08-01T00:00:00Z" }
              as: Regulator
            - call: "POST /relicensing/projects"
              payload: { license_number: "P-4424", project_name: "Exact Limit Dam", installed_capacity_mw: 20.0, base_annual_generation_mwh: 100000, license_expiration_date: "2033-12-31" }
              as: Regulator
              captures: { proj: $.data.id }
            - call: "POST /relicensing/projects/${proj}/pre-application-document"
              payload: { filing_note: "PAD" }
              as: Licensee
              as_user_id: "u_lic_a"
            - call: "POST /relicensing/pme-measures"
              payload: { project_id: "${proj}", measure_name: "Cold water release structure", resource_category: "WATER_QUALITY", source: "AGENCY_PRESCRIPTION", capital_cost_usd: 1000000.00, annual_om_cost_usd: 155102.94, construction_start_year: 2026, implementation_months: 12, flow_release_cfs: 250, gross_head_ft: 100, release_days: 229 }
              as: Licensee
              as_user_id: "u_lic_a"
              captures: { mb: $.data.id }
            - call: "GET /relicensing/projects/${proj}"
              payload: {}
              as: Licensee
              as_user_id: "u_lic_a"
              captures: { ratio_pre: $.data.burden_ratio_pct, infeas_pre: $.data.economically_infeasible, posture_pre: $.data.regulatory_posture }
          trigger:
            - call: "POST /relicensing/pme-measures/${mb}/cost-estimate"
              payload: { estimate_note: "definitive" }
              as: Licensee
              as_user_id: "u_lic_b"
              captures: { mb_cost: $.data.annual_cost_usd, mb_gen: $.data.annual_generation_loss_mwh }
            - call: "GET /relicensing/projects/${proj}"
              payload: {}
              as: Licensee
              as_user_id: "u_lic_a"
              captures: { ratio_at: $.data.burden_ratio_pct, infeas_at: $.data.economically_infeasible, posture_at: $.data.regulatory_posture, burden_at: $.data.total_annual_burden_usd }
            - call: "PATCH /relicensing/projects/${proj}"
              payload: { base_annual_generation_mwh: 120000 }
              as: Regulator
              captures: { ratio_over: $.data.burden_ratio_pct, infeas_over: $.data.economically_infeasible, posture_over: $.data.regulatory_posture, burden_over: $.data.total_annual_burden_usd }
          assert:
            - "before the switch: ${ratio_pre} == 8.03, ${infeas_pre} == false, ${posture_pre} == OPEN"
            - "${mb_cost} == 210102.94 and ${mb_gen} == 9897.5"
            - "at the boundary: ${burden_at} == 630000.00 and ${ratio_at} == 15.00 exactly"
            - "${infeas_at} == true (the comparison is >=, not >) and ${posture_at} == RESTRICTED"
            - "one step past the boundary: ${burden_over} == 630000.00 unchanged and ${ratio_over} == 12.50"
            - "${infeas_over} == false and ${posture_over} == OPEN"
            - "RelicensingProject.${proj}.administrative_annual_charge_usd == 4202.06 at every step"

      - name: timeline_slack_exactly_at_at_risk_boundary_is_not_delinquent
        grounds:
          - calculations.relicensing_timeline_posture
          - calculations.project_regulatory_posture
          - endpoints["POST /relicensing/projects/{project_id}/run-compliance-sweep"]
        distinguishing_aspect: |
          Two thresholds sit one day apart on the same field: slack_days > 180 is ON_TRACK,
          slack_days == 180 is AT_RISK (posture RESTRICTED) and slack_days < 0 is DELINQUENT
          (posture FROZEN). The milestone day itself (slack 0) is deliberately AT_RISK, so the
          DELINQUENT edge is strictly negative. All three are produced by the same no-payload sweep
          against three clock values.
        test_recipe:
          setup:
            - "Project with license_expiration_date 2033-12-31 and no PAD filed, so next_milestone_due is pad_due_date 2028-06-30."
            - "No measures, comments, deficiencies or orders, so timeline_posture is the only posture driver."
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-08-01T00:00:00Z" }
              as: Regulator
            - call: "POST /relicensing/projects"
              payload: { license_number: "P-4425", project_name: "Slack Day Dam", installed_capacity_mw: 8.0, base_annual_generation_mwh: 40000, license_expiration_date: "2033-12-31" }
              as: Regulator
              captures: { proj: $.data.id, tp0: $.data.timeline_posture }
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2028-01-01T00:00:00Z" }
              as: Regulator
          trigger:
            - call: "POST /relicensing/projects/${proj}/run-compliance-sweep"
              payload: {}
              as: Regulator
              captures: { tp181: $.data.timeline_posture, rp181: $.data.regulatory_posture }
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2028-01-02T00:00:00Z" }
              as: Regulator
            - call: "POST /relicensing/projects/${proj}/run-compliance-sweep"
              payload: {}
              as: Regulator
              captures: { tp180: $.data.timeline_posture, rp180: $.data.regulatory_posture }
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2028-07-01T00:00:00Z" }
              as: Regulator
            - call: "POST /relicensing/projects/${proj}/run-compliance-sweep"
              payload: {}
              as: Regulator
              captures: { tpneg: $.data.timeline_posture, rpneg: $.data.regulatory_posture }
          assert:
            - "${tp0} == ON_TRACK at creation (slack 699 days)"
            - "slack 181 days: ${tp181} == ON_TRACK and ${rp181} == OPEN"
            - "slack exactly 180 days: ${tp180} == AT_RISK and ${rp180} == RESTRICTED"
            - "slack -1 days: ${tpneg} == DELINQUENT and ${rpneg} == FROZEN"
            - "RelicensingProject.${proj}.stage == PRE_FILING throughout and last_sweep_at == 2028-07-01T00:00:00Z"

      - name: empty_report_period_scores_exactly_one_hundred_without_clearing_flags
        grounds:
          - calculations.compliance_year_assessment
          - entities.LicenseOrder.fields.compliance_score
          - state_machines.LicenseOrder.EFFECTIVE_to_COMPLIANCE_FLAGGED
        distinguishing_aspect: |
          An empty assessed set is the degenerate boundary of the score formula: assessed 0 must give
          exactly 100.00 rather than 0.00 or a division error, and a perfect score on an empty window
          must not clear an existing COMPLIANCE_FLAGGED state or thaw the project. The order carries
          three OVERDUE obligations while the report reads 100.00.
        test_recipe:
          setup:
            - "The licensed project chain: LicenseOrder ORD-4 EFFECTIVE with effective_date 2026-08-01 and three obligations due 2027-02-01, 2027-08-01 and 2027-08-01."
