# =============================================================================
# task_2326 — Fix-and-Flip Hard Money Lending & Draw Management
# Scaffold seed tables (§1.0–§1.7). Difficulty design → SCAFFOLD_DIFFICULTY_DESIGN.yaml
# Corner design → SCAFFOLD_CORNER_DESIGN.yaml
# =============================================================================

scenario: |
  2326. Fix-and-Flip Hard Money Lending & Draw Management (private construction lender): borrower experience scoring and entity-based lending with personal guarantees, loan sizing against purchase price, rehab budget and after-repair value with combined limits, rehab budget line-item review and scope validation before closing, draw request intake with inspection or photo verification and percentage-complete release, interest reserve, extension fee and default rate mechanics on short terms, lien waiver collection and contractor payment controls, exit monitoring through listing activity and refinance progress, default, foreclosure and property takeover with completion of construction

domain_name: fix-flip-hard-money-lending
api_prefix: /lending

complexity_profile:
  primary_archetype: ledger_reconciliation
  secondary_archetype: compliance_audit
  complexity_layers:
    - cascading_side_effects
    - dual_variant_calculation
    - rate_threshold_triggers
    - optimistic_concurrency
  entity_topology: graph
  # Graph, not a tree: DrawLineItem is a junction between DrawRequest and
  # RehabLineItem (many-to-many across two aggregates), LienWaiver joins Loan and
  # Contractor, DrawRequest references itself via superseded_by_draw_request_id,
  # and Contractor is referenced from the LoanApplication aggregate while being
  # payment-gated from the Loan aggregate.
  state_machine_shape: parallel
  # Loan carries three independent state axes (payment_status × construction_status
  # × exit_status) that advance on different triggers; DrawRequest is branching
  # (INSPECTION vs PHOTO verification legs with divergent side-effect sets);
  # RehabLineItem and Borrower are cyclic.
  relationship_patterns:
    - one_to_many
    - many_to_many
    - self_referential
    - cross_aggregate
  role_model: segregation_of_duties
  # LoanOfficer sizes but may not decide; CreditCommittee decides but may not
  # close; the LoanServicer user id that reviewed a draw may not be the user id
  # that funds it; DrawInspector verifies but never approves.
  consistency_model: immediate

response_envelope:
  success: |
    { "meta": { "api_request_id": "req_xxx", "api_request_timestamp": "ISO8601" },
      "response_type": "object" | "array", "data": {} }
  error: |
    { "meta": { ... }, "response_type": "error",
      "data": { "error_id": "ERR_XXX", "message": "..." } }
  pagination_fields: ["limit", "offset", "total_count", "has_more"]
  pagination_defaults: { limit: 10, min: 1, max: 100, offset: 0 }

# =============================================================================
# §1.1 Entity-Relationship Table (14 entities)
# =============================================================================
entities:
  - name: Borrower
    parent: null
    common_fields: true
    fields:
      - { name: legal_entity_name, type: string, source: input, description: "Borrowing entity's legal name" }
      - { name: entity_type, type: enum, source: input, description: "LLC | CORP | LP | SOLE_PROP — SOLE_PROP is not eligible for entity-based lending", constraints: "one of LLC, CORP, LP, SOLE_PROP" }
      - { name: guarantor_name, type: string, source: input, description: "Natural person offered as personal guarantor" }
      - { name: flips_last_24mo, type: integer, source: input, description: "Completed flips in the trailing 24 months", constraints: ">= 0 and <= flips_lifetime" }
      - { name: flips_lifetime, type: integer, source: input, description: "Completed flips over the sponsor's whole career", constraints: ">= 0" }
      - { name: credit_score, type: integer, source: input, description: "Guarantor FICO score", constraints: "300..850" }
      - { name: liquidity_cents, type: integer, source: input, description: "Verified post-closing liquidity in cents", constraints: ">= 0" }
      - { name: prior_default_count, type: integer, source: input, description: "Prior lender defaults; incremented by 1 by the loan-default cascade (§1.2 Loan CURRENT/DELINQUENT→DEFAULT)", constraints: ">= 0" }
      - { name: declared_target_loan_cents, type: integer, source: input, description: "Loan size the sponsor declares at intake; liquidity-coverage denominator for the intake score variant", constraints: "> 0" }
      - { name: intake_experience_score, type: number, source: computed, description: "borrower_experience_score variant intake_rolling, 2 decimals, 0..100" }
      - { name: recertified_experience_score, type: number, source: computed, description: "borrower_experience_score variant recert_lifetime_decay, 2 decimals; null until a RECERTIFY action runs" }
      - { name: recertified_at, type: datetime, source: system, description: "Logical-clock instant of the most recent RECERTIFY action; null when never recertified" }
      - { name: effective_experience_score, type: number, source: computed, description: "recertified_experience_score when recertified_at is not null, else intake_experience_score" }
      - { name: experience_tier, type: enum, source: computed, description: "TIER_A | TIER_B | TIER_C | TIER_D — banded from effective_experience_score", constraints: "TIER_A >= 80.00, TIER_B >= 65.00, TIER_C >= 45.00, TIER_D < 45.00" }
      - { name: guarantee_status, type: enum, source: system, description: "PENDING | EXECUTED — personal guarantee execution state", default: "PENDING" }
      - { name: guarantee_effective_date, type: string, source: system, description: "ISO date the guarantee was executed; null while PENDING" }
      - { name: status, type: enum, source: system, description: "PROSPECT | APPROVED_SPONSOR | SUSPENDED", default: "PROSPECT" }
      - { name: suspension_reason, type: string, source: system, description: "Why the sponsor was suspended; null unless status == SUSPENDED" }

  - name: Property
    parent: null
    common_fields: true
    fields:
      - { name: address_line, type: string, source: input, description: "Street address of the subject property" }
      - { name: county_code, type: string, source: input, description: "Recording county code (uppercase)" }
      - { name: purchase_price_cents, type: integer, source: input, description: "Contract purchase price in cents", constraints: "> 0" }
      - { name: as_is_value_cents, type: integer, source: input, description: "As-is appraised value in cents", constraints: "> 0" }
      - { name: arv_cents, type: integer, source: input, description: "After-repair value in cents", constraints: "> 0" }
      - { name: appraisal_date, type: string, source: input, description: "ISO date of the valuation on file" }
      - { name: status, type: enum, source: system, description: "UNDER_CONTRACT | BORROWER_OWNED | LENDER_REO | SOLD", default: "UNDER_CONTRACT" }
      - { name: valuation_revision_count, type: integer, source: system, description: "Number of accepted PATCH valuation revisions", default: 0 }

  - name: LoanApplication
    parent: null
    common_fields: true
    fields:
      - { name: borrower_id, type: string, source: input, description: "FK -> Borrower.id; sponsor entity applying" }
      - { name: property_id, type: string, source: input, description: "FK -> Property.id; subject property" }
      - { name: term_months, type: integer, source: input, description: "Note term in months", constraints: "6..18" }
      - { name: quoted_rate_bps, type: integer, source: input, description: "Quoted note rate in basis points", constraints: "800..1800" }
      - { name: interest_reserve_months, type: integer, source: input, description: "Months of interest to pre-fund into the reserve", constraints: "0..12" }
      - { name: day_count_convention, type: enum, source: input, description: "PER_DIEM_360 | PER_DIEM_365 — selects the payoff per-diem divisor variant", default: "PER_DIEM_360" }
      - { name: intake_experience_score, type: number, source: computed, description: "Snapshot of Borrower.effective_experience_score at application creation" }
      - { name: pricing_tier, type: enum, source: computed, description: "Snapshot of Borrower.experience_tier at application creation; sizing uses THIS value, never the borrower's live tier", constraints: "TIER_A | TIER_B | TIER_C | TIER_D" }
      - { name: approved_rehab_total_cents, type: integer, source: computed, description: "Sum of RehabLineItem.approved_cost_cents for lines with status IN {APPROVED, FULLY_RELEASED}", default: 0 }
      - { name: cap_purchase_advance_cents, type: integer, source: computed, description: "floor(LTP_PCT[pricing_tier] * Property.purchase_price_cents); null until sized" }
      - { name: cap_ltc_cents, type: integer, source: computed, description: "floor(LTC_PCT[pricing_tier] * (purchase_price_cents + approved_rehab_total_cents)); null until sized" }
      - { name: cap_ltarv_cents, type: integer, source: computed, description: "floor(LTARV_PCT[pricing_tier] * Property.arv_cents); null until sized" }
      - { name: max_total_loan_cents, type: integer, source: computed, description: "min(cap_purchase_advance + approved_rehab_total, cap_ltc, cap_ltarv); null until sized" }
      - { name: sized_committed_amount_cents, type: integer, source: computed, description: "Committed total produced by commitment_allocation variant sizing_pass; null until sized" }
      - { name: sized_initial_funding_cents, type: integer, source: computed, description: "Purchase-advance bucket from the sizing_pass; null until sized" }
      - { name: sized_interest_reserve_cents, type: integer, source: computed, description: "Interest-reserve bucket from the sizing_pass; null until sized" }
      - { name: sizing_arv_cents, type: integer, source: system, description: "Property.arv_cents observed at sizing time; staleness sentinel" }
      - { name: sizing_rate_bps, type: integer, source: system, description: "quoted_rate_bps observed at sizing time; staleness sentinel" }
      - { name: sizing_stale, type: boolean, source: computed, description: "true when status == SIZED and (Property.arv_cents != sizing_arv_cents OR approved_rehab_total_cents changed since sizing)", default: false }
      - { name: approved_loan_amount_cents, type: integer, source: computed, description: "Committee-approved commitment total; null until APPROVED" }
      - { name: approved_rate_bps, type: integer, source: computed, description: "Committee-set note rate; defaults to quoted_rate_bps" }
      - { name: alloc_initial_funding_cents, type: integer, source: computed, description: "Purchase-advance bucket from commitment_allocation variant decision_pass" }
      - { name: alloc_interest_reserve_cents, type: integer, source: computed, description: "Interest-reserve bucket from the decision_pass" }
      - { name: alloc_rehab_holdback_cents, type: integer, source: computed, description: "Rehab holdback bucket from the decision_pass; equals approved_rehab_total_cents" }
      - { name: status, type: enum, source: system, description: "DRAFT | SIZED | APPROVED | DECLINED | CLOSED | WITHDRAWN", default: "DRAFT" }
      - { name: decline_reason, type: string, source: system, description: "Committee decline rationale; null unless DECLINED" }

  - name: RehabLineItem
    parent: LoanApplication
    common_fields: true
    fields:
      - { name: application_id, type: string, source: system, description: "FK -> LoanApplication.id; owning application (from the path)" }
      - { name: contractor_id, type: string, source: input, description: "FK -> Contractor.id; trade contractor assigned to this scope line" }
      - { name: scope_code, type: enum, source: input, description: "ROOF | KITCHEN | BATH | ELECTRICAL | PLUMBING | HVAC | FOUNDATION | EXTERIOR | FLOORING | PERMITS | CONTINGENCY", constraints: "unique per application across lines with status IN {PROPOSED, REVISION_REQUESTED, APPROVED, FULLY_RELEASED}" }
      - { name: description, type: string, source: input, description: "Scope of work narrative" }
      - { name: cost_cents, type: integer, source: input, description: "Borrower-proposed cost in cents", constraints: "> 0" }
      - { name: approved_cost_cents, type: integer, source: computed, description: "Underwriter-approved cost; null until APPROVED" }
      - { name: released_cents, type: integer, source: computed, description: "Cumulative cash released against this line by funded draws", default: 0 }
      - { name: released_percent, type: number, source: computed, description: "released_cents / approved_cost_cents, 4 decimals; 0 when approved_cost_cents is null", default: 0 }
      - { name: status, type: enum, source: system, description: "PROPOSED | REVISION_REQUESTED | APPROVED | REJECTED | FULLY_RELEASED | VOID", default: "PROPOSED" }
      - { name: revision_round, type: integer, source: system, description: "Count of REQUEST_REVISION decisions taken on this line", default: 0 }
      - { name: reviewer_note, type: string, source: system, description: "Latest underwriter note; null until first review" }

  - name: Contractor
    parent: null
    common_fields: true
    fields:
      - { name: business_name, type: string, source: input, description: "Contractor's business name" }
      - { name: license_number, type: string, source: input, description: "Trade license number" }
      - { name: license_expires_on, type: string, source: input, description: "ISO date the trade license lapses" }
      - { name: w9_on_file, type: boolean, source: input, description: "Whether a signed W-9 is on file" }
      - { name: joint_check_required, type: boolean, source: input, description: "Whether disbursements to this contractor must be joint-payee checks" }
      - { name: license_status, type: enum, source: computed, description: "ACTIVE when logical-clock date <= license_expires_on, else EXPIRED", constraints: "ACTIVE | EXPIRED" }
      - { name: collected_waiver_coverage_cents, type: integer, source: computed, description: "Sum of LienWaiver.amount_covered_cents for this contractor with status == COLLECTED and waiver_type IN {PARTIAL_UNCONDITIONAL, FINAL_UNCONDITIONAL}", default: 0 }
      - { name: released_to_contractor_cents, type: integer, source: computed, description: "Sum of RehabLineItem.released_cents over every line whose contractor_id is this contractor", default: 0 }
      - { name: open_waiver_headroom_cents, type: integer, source: computed, description: "collected_waiver_coverage_cents - released_to_contractor_cents; may be negative after a dispute", default: 0 }
      - { name: payable, type: boolean, source: computed, description: "license_status == ACTIVE AND w9_on_file == true" }

  - name: Loan
    parent: LoanApplication
    common_fields: true
    fields:
      - { name: application_id, type: string, source: system, description: "FK -> LoanApplication.id; originating application" }
      - { name: borrower_id, type: string, source: system, description: "FK -> Borrower.id; denormalised from the application at closing" }
      - { name: closing_date, type: string, source: input, description: "ISO date the note funded" }
      - { name: maturity_date, type: string, source: computed, description: "closing_date plus term_months plus extension_months_total calendar months; clamped to the last day of a shorter target month" }
      - { name: term_months, type: integer, source: system, description: "Base note term copied from the application" }
      - { name: note_rate_bps, type: integer, source: system, description: "Current note rate; rises EXTENSION_RATE_STEP_BPS per granted extension" }
      - { name: default_rate_bps, type: integer, source: computed, description: "note_rate_bps + DEFAULT_RATE_SPREAD_BPS" }
      - { name: day_count_convention, type: enum, source: system, description: "PER_DIEM_360 | PER_DIEM_365 — copied from the application; selects the payoff per-diem divisor" }
      - { name: committed_amount_cents, type: integer, source: computed, description: "Total lender commitment; set at closing, increased only by an accepted foreclosure completion budget" }
      - { name: funded_principal_cents, type: integer, source: computed, description: "Cash advanced and outstanding: initial funding + funded draws + swept reserve interest + completion advances", default: 0 }
      - { name: repaid_principal_cents, type: integer, source: computed, description: "Cumulative principal repaid by borrower payments and payoff", default: 0 }
      - { name: reserved_release_cents, type: integer, source: computed, description: "Holdback moved out of undisbursed and earmarked by an APPROVED draw request but not yet funded", default: 0 }
      - { name: undisbursed_holdback_cents, type: integer, source: computed, description: "Rehab holdback still uncommitted to any approved draw", default: 0 }
      - { name: interest_reserve_balance_cents, type: integer, source: computed, description: "Unswept interest reserve remaining", default: 0 }
      - { name: interest_reserve_funded_cents, type: integer, source: computed, description: "Interest reserve funded at closing; never mutated afterwards", default: 0 }
      - { name: decommitted_holdback_cents, type: integer, source: computed, description: "Commitment cancelled without being advanced (takeover sweep, unspent completion budget)", default: 0 }
      - { name: accrued_interest_unpaid_cents, type: integer, source: computed, description: "Interest accrued that the reserve could not cover and the borrower has not paid", default: 0 }
      - { name: fee_balance_cents, type: integer, source: computed, description: "Unpaid extension fees; deliberately OUTSIDE the commitment conservation identity", default: 0 }
      - { name: available_rehab_pool_cents, type: integer, source: computed, description: "undisbursed_holdback_cents + reserved_release_cents" }
      - { name: commitment_balance_check_cents, type: integer, source: computed, description: "committed_amount_cents - (funded_principal + repaid_principal + reserved_release + undisbursed_holdback + interest_reserve_balance + decommitted_holdback); MUST always read 0" }
      - { name: last_accrual_through, type: string, source: system, description: "period_end of the most recent InterestAccrualPeriod; null before the first accrual" }
      - { name: delinquent_since, type: string, source: system, description: "ISO date the first uncured unpaid interest appeared; null when CURRENT" }
      - { name: default_effective_date, type: string, source: system, description: "ISO date the default was declared; first day accruing at default_rate_bps" }
      - { name: extension_count, type: integer, source: computed, description: "Number of granted extensions", default: 0 }
      - { name: extension_months_total, type: integer, source: computed, description: "Sum of granted extension months", default: 0 }
      - { name: payment_status, type: enum, source: system, description: "CURRENT | DELINQUENT | DEFAULT | PAID_OFF | CHARGED_OFF", default: "CURRENT" }
      - { name: construction_status, type: enum, source: system, description: "NOT_STARTED | IN_PROGRESS | COMPLETE | LENDER_COMPLETING | LENDER_COMPLETE", default: "NOT_STARTED" }
      - { name: exit_status, type: enum, source: computed, description: "NOT_LISTED | LISTED | UNDER_CONTRACT | REFI_IN_PROCESS | EXITED | FORECLOSED", default: "NOT_LISTED" }
      - { name: days_on_market, type: integer, source: computed, description: "Days from the governing LISTED milestone to the logical-clock date; 0 when there is no governing LISTED milestone", default: 0 }
      - { name: exit_watch_flag, type: boolean, source: computed, description: "days_on_market > EXIT_WATCH_DOM_DAYS AND no PRICE_REDUCED milestone dated on/after the governing LISTED milestone", default: false }
      - { name: payoff_quote_cents, type: integer, source: computed, description: "payoff_quote calculation as of the logical-clock date" }
      - { name: recovery_cents, type: integer, source: computed, description: "min(payoff at disposition, net REO proceeds); null before disposition" }
      - { name: charge_off_cents, type: integer, source: computed, description: "max(0, payoff at disposition - net REO proceeds); null before disposition" }
      - { name: surplus_returned_cents, type: integer, source: computed, description: "max(0, net REO proceeds - payoff at disposition); null before disposition" }

  - name: DrawRequest
    parent: Loan
    common_fields: true
    fields:
      - { name: loan_id, type: string, source: system, description: "FK -> Loan.id; owning loan (from the path)" }
      - { name: sequence_number, type: integer, source: system, description: "1-based creation ordinal within the loan, ordered by created_at ASC" }
      - { name: verification_method, type: enum, source: input, description: "INSPECTION | PHOTO — selects the verification leg and the retainage rate" }
      - { name: photo_count, type: integer, source: system, description: "Photos supplied on the PHOTO leg; null on the INSPECTION leg" }
      - { name: requested_total_cents, type: integer, source: computed, description: "Sum of DrawLineItem.requested_amount_cents for this request" }
      - { name: approved_release_cents, type: integer, source: computed, description: "Sum of per-line DrawLineItem.approved_amount_cents (each already rounded); null until reviewed APPROVE" }
      - { name: status, type: enum, source: system, description: "SUBMITTED | INSPECTION_ORDERED | INSPECTED | APPROVED | FUNDED | REVISION_REQUESTED | REJECTED | SUPERSEDED | SUSPENDED", default: "SUBMITTED" }
      - { name: reviewed_by_user_id, type: string, source: system, description: "X-User-ID of the LoanServicer that reviewed this request; null until reviewed" }
      - { name: funded_by_user_id, type: string, source: system, description: "X-User-ID of the LoanServicer that funded this request; null until funded" }
      - { name: funded_at, type: datetime, source: system, description: "Logical-clock instant of funding; null until FUNDED" }
      - { name: superseded_by_draw_request_id, type: string, source: system, description: "FK -> DrawRequest.id; self-reference to the request that superseded this one (null unless status == SUPERSEDED)" }

  - name: DrawLineItem
    parent: DrawRequest
    common_fields: true
    fields:
      - { name: draw_request_id, type: string, source: system, description: "FK -> DrawRequest.id; owning draw request" }
      - { name: rehab_line_item_id, type: string, source: input, description: "FK -> RehabLineItem.id; scope line this allocation draws against" }
      - { name: claimed_percent_complete, type: number, source: input, description: "Borrower-claimed cumulative completion of the scope line, 2 decimals", constraints: "0.01..1.00" }
      - { name: verified_percent_complete, type: number, source: system, description: "Verified cumulative completion, 2 decimals; null until the verification leg reports" }
      - { name: effective_percent_complete, type: number, source: computed, description: "min(claimed, verified), then capped at PHOTO_MAX_PCT on the PHOTO leg; null until verified" }
      - { name: requested_amount_cents, type: integer, source: computed, description: "round_half_up(RehabLineItem.approved_cost_cents * claimed_percent_complete) - RehabLineItem.released_cents at creation time" }
      - { name: approved_amount_cents, type: integer, source: computed, description: "Per-line release from the draw_release calculation; null until reviewed APPROVE" }
      - { name: released_cents, type: integer, source: computed, description: "Cash actually released for this allocation; 0 until the request is FUNDED", default: 0 }

  - name: InspectionVisit
    parent: DrawRequest
    common_fields: true
    fields:
      - { name: draw_request_id, type: string, source: system, description: "FK -> DrawRequest.id; request being verified" }
      - { name: inspector_id, type: string, source: input, description: "Opaque DrawInspector operator identifier the visit is assigned to; matched against X-User-ID at report time; NOT a foreign key to any entity" }
      - { name: window_start, type: datetime, source: input, description: "ISO 8601 UTC start of the site-visit window (inclusive)" }
      - { name: window_end, type: datetime, source: input, description: "ISO 8601 UTC end of the site-visit window (exclusive)" }
      - { name: status, type: enum, source: system, description: "SCHEDULED | COMPLETED | CANCELLED", default: "SCHEDULED" }
      - { name: reported_at, type: datetime, source: system, description: "Logical-clock instant the report was filed; null until COMPLETED" }
      - { name: site_notes, type: string, source: system, description: "Inspector narrative; null until reported" }

  - name: LienWaiver
    parent: null
    common_fields: true
    fields:
      - { name: loan_id, type: string, source: input, description: "FK -> Loan.id; loan the waiver is filed against" }
      - { name: contractor_id, type: string, source: input, description: "FK -> Contractor.id; waiving contractor" }
      - { name: waiver_type, type: enum, source: input, description: "PARTIAL_CONDITIONAL | PARTIAL_UNCONDITIONAL | FINAL_UNCONDITIONAL — only the two UNCONDITIONAL types count toward coverage" }
      - { name: amount_covered_cents, type: integer, source: input, description: "Dollar amount of work the waiver releases", constraints: "> 0" }
      - { name: through_date, type: string, source: input, description: "ISO date through which the waiver releases claims" }
      - { name: status, type: enum, source: system, description: "COLLECTED | DISPUTED", default: "COLLECTED" }
      - { name: counts_toward_coverage, type: boolean, source: computed, description: "status == COLLECTED AND waiver_type IN {PARTIAL_UNCONDITIONAL, FINAL_UNCONDITIONAL}" }

  - name: LedgerEntry
    parent: Loan
    common_fields: false
    fields:
      - { name: loan_id, type: string, source: system, description: "FK -> Loan.id; loan the entry belongs to" }
      - { name: entry_type, type: enum, source: system, description: "INITIAL_FUNDING | DRAW_DISBURSEMENT | RESERVE_SWEEP | BORROWER_PAYMENT | EXTENSION_FEE | HOLDBACK_DECOMMIT | COMPLETION_ADVANCE | REO_SALE_PROCEEDS | PAYOFF | CHARGE_OFF" }
      - { name: amount_cents, type: integer, source: system, description: "Positive magnitude of the entry in cents" }
      - { name: effective_date, type: string, source: system, description: "ISO date the entry is effective (logical clock or the caller-supplied business date)" }
      - { name: memo, type: string, source: system, description: "Human-readable description of the entry" }
      - { name: source_ref, type: string, source: system, description: "Opaque identifier of the triggering resource (draw request, accrual period, foreclosure case); NOT a foreign key" }

  - name: InterestAccrualPeriod
    parent: Loan
    common_fields: false
    fields:
      - { name: loan_id, type: string, source: system, description: "FK -> Loan.id; accruing loan" }
      - { name: period_start, type: string, source: input, description: "ISO date, inclusive first day of the period" }
      - { name: period_end, type: string, source: input, description: "ISO date, inclusive last day of the period" }
      - { name: day_count, type: integer, source: computed, description: "(period_end - period_start) in days + 1 — both endpoints inclusive" }
      - { name: note_rate_days, type: integer, source: computed, description: "Days in the period before default_effective_date" }
      - { name: default_rate_days, type: integer, source: computed, description: "Days in the period on/after default_effective_date" }
      - { name: principal_snapshot_cents, type: integer, source: computed, description: "Loan.funded_principal_cents read BEFORE this period's reserve sweep is capitalised" }
      - { name: note_rate_interest_cents, type: integer, source: computed, description: "round_half_up(principal_snapshot * note_rate_bps/10000 * note_rate_days/360)" }
      - { name: default_rate_interest_cents, type: integer, source: computed, description: "round_half_up(principal_snapshot * default_rate_bps/10000 * default_rate_days/360)" }
      - { name: interest_accrued_cents, type: integer, source: computed, description: "note_rate_interest_cents + default_rate_interest_cents (two independent roundings, then summed)" }
      - { name: swept_from_reserve_cents, type: integer, source: computed, description: "min(interest_accrued_cents, Loan.interest_reserve_balance_cents before the sweep)" }
      - { name: unpaid_added_cents, type: integer, source: computed, description: "interest_accrued_cents - swept_from_reserve_cents" }

  - name: ExitMilestone
    parent: Loan
    common_fields: false
    fields:
      - { name: loan_id, type: string, source: system, description: "FK -> Loan.id; loan being exit-monitored" }
      - { name: milestone_type, type: enum, source: input, description: "LISTED | PRICE_REDUCED | DELISTED | UNDER_CONTRACT | CONTRACT_FALLOUT | REFI_APPLICATION | REFI_APPRAISAL_COMPLETE | REFI_COMMITMENT_ISSUED" }
      - { name: effective_date, type: string, source: input, description: "ISO business date of the milestone" }
      - { name: listing_price_cents, type: integer, source: input, description: "List price; required for LISTED and PRICE_REDUCED, null otherwise" }
      - { name: lender_name, type: string, source: input, description: "Take-out lender; required for the three REFI_* types, null otherwise" }
      - { name: note, type: string, source: input, description: "Free-text detail" }
      - { name: derived_exit_status, type: enum, source: computed, description: "Exit status this milestone maps to: NOT_LISTED | LISTED | UNDER_CONTRACT | REFI_IN_PROCESS" }

  - name: ForeclosureCase
    parent: Loan
    common_fields: true
    fields:
      - { name: loan_id, type: string, source: system, description: "FK -> Loan.id; defaulted loan" }
      - { name: notice_date, type: string, source: input, description: "ISO date the notice of default was recorded" }
      - { name: county_code, type: string, source: input, description: "Recording county code" }
      - { name: redemption_expires_on, type: string, source: computed, description: "notice_date + REDEMPTION_DAYS days; takeover is barred before this date" }
      - { name: takeover_date, type: string, source: system, description: "ISO date the lender took title; null until TAKEOVER_COMPLETE" }
      - { name: completion_budget_cents, type: integer, source: computed, description: "Current lender-funded completion budget; null until COMPLETION_FUNDED" }
      - { name: completion_advanced_cents, type: integer, source: computed, description: "Completion budget actually advanced at disposition", default: 0 }
      - { name: sale_price_cents, type: integer, source: computed, description: "Gross REO sale price; null until RESOLVED" }
      - { name: selling_costs_cents, type: integer, source: computed, description: "floor(SELLING_COST_PCT * sale_price_cents); null until RESOLVED" }
      - { name: net_proceeds_cents, type: integer, source: computed, description: "sale_price_cents - selling_costs_cents; null until RESOLVED" }
      - { name: status, type: enum, source: system, description: "NOTICE_FILED | TAKEOVER_COMPLETE | COMPLETION_FUNDED | RESOLVED", default: "NOTICE_FILED" }

# =============================================================================
# §1.2 State Machines
# =============================================================================
state_machines:
  - entity: Borrower
    field: status
    initial_state: PROSPECT
    terminal_states: []
    transitions:
      - from: PROSPECT
        to: APPROVED_SPONSOR
        trigger: "POST /lending/borrowers/{id}/status action=APPROVE_SPONSOR"
        preconditions:
          - "entity_type != SOLE_PROP"
          - "guarantee_status == EXECUTED"
          - "experience_tier != TIER_D"
        side_effects: []
      - from: APPROVED_SPONSOR
        to: APPROVED_SPONSOR
        trigger: "POST /lending/borrowers/{id}/status action=RECERTIFY (recertified score stays >= 45.00)"
        preconditions:
          - "guarantee_status == EXECUTED"
        side_effects:
          - "recompute recertified_experience_score with the recert_lifetime_decay variant"
          - "set recertified_at to the logical clock instant"
          - "re-derive effective_experience_score and experience_tier"
          - "already-created LoanApplication rows keep their snapshotted pricing_tier and are NOT re-tiered"
      - from: APPROVED_SPONSOR
        to: SUSPENDED
        trigger: "POST /lending/borrowers/{id}/status action=RECERTIFY (recertified score falls below 45.00)"
        preconditions: []
        side_effects:
          - "recompute recertified_experience_score, set recertified_at, re-derive experience_tier to TIER_D"
          - "set suspension_reason = RECERT_BELOW_FLOOR"
          - "cascade: every LoanApplication of this borrower with status IN {DRAFT, SIZED} -> WITHDRAWN"
          - "cascade depth 2: every RehabLineItem of each withdrawn application with status IN {PROPOSED, REVISION_REQUESTED, APPROVED} -> VOID"
      - from: APPROVED_SPONSOR
        to: SUSPENDED
        trigger: "POST /lending/borrowers/{id}/status action=SUSPEND"
        preconditions: []
        side_effects:
          - "set suspension_reason = ADMIN_SUSPENSION"
          - "cascade: every LoanApplication of this borrower with status IN {DRAFT, SIZED} -> WITHDRAWN"
          - "cascade depth 2: every RehabLineItem of each withdrawn application with status IN {PROPOSED, REVISION_REQUESTED, APPROVED} -> VOID"
      - from: SUSPENDED
        to: APPROVED_SPONSOR
        trigger: "POST /lending/borrowers/{id}/status action=REINSTATE"
        preconditions:
          - "no Loan of this borrower has payment_status IN {DEFAULT, CHARGED_OFF}"
          - "experience_tier != TIER_D"
        side_effects:
          - "clear suspension_reason"
          - "applications withdrawn by the suspension are NOT revived"

  - entity: LoanApplication
    field: status
    initial_state: DRAFT
    terminal_states: [CLOSED, DECLINED, WITHDRAWN]
    transitions:
      - from: DRAFT
        to: SIZED
        trigger: "POST /lending/applications/{id}/size"
        preconditions:
          - "Borrower.status == APPROVED_SPONSOR"
          - "at least one RehabLineItem with status == APPROVED exists"
          - "no RehabLineItem with status IN {PROPOSED, REVISION_REQUESTED} remains"
        side_effects:
          - "compute cap_purchase_advance_cents, cap_ltc_cents, cap_ltarv_cents, max_total_loan_cents (loan_sizing_max)"
          - "compute sized_committed_amount_cents, sized_initial_funding_cents, sized_interest_reserve_cents (commitment_allocation variant sizing_pass)"
          - "snapshot sizing_arv_cents = Property.arv_cents and sizing_rate_bps = quoted_rate_bps"
          - "set sizing_stale = false"
      - from: SIZED
        to: SIZED
        trigger: "POST /lending/applications/{id}/size (re-size after a valuation or scope change)"
        preconditions:
          - "Borrower.status == APPROVED_SPONSOR"
          - "at least one RehabLineItem with status == APPROVED exists"
        side_effects:
          - "recompute every sizing field against current Property and RehabLineItem values"
          - "re-snapshot sizing_arv_cents and sizing_rate_bps; clear sizing_stale"
      - from: SIZED
        to: APPROVED
        trigger: "POST /lending/applications/{id}/decision decision=APPROVE"
        preconditions:
          - "sizing_stale == false"
          - "approved_loan_amount_cents (or sized_committed_amount_cents when omitted) <= max_total_loan_cents"
          - "Borrower.status == APPROVED_SPONSOR AND Borrower.guarantee_status == EXECUTED"
        side_effects:
          - "set approved_loan_amount_cents and approved_rate_bps"
          - "compute alloc_interest_reserve_cents, alloc_initial_funding_cents, alloc_rehab_holdback_cents (commitment_allocation variant decision_pass)"
      - from: SIZED
        to: DECLINED
        trigger: "POST /lending/applications/{id}/decision decision=DECLINE"
        preconditions: []
        side_effects:
          - "store decline_reason"
          - "cascade: every RehabLineItem of this application with status IN {PROPOSED, REVISION_REQUESTED, APPROVED} -> VOID"
      - from: APPROVED
        to: CLOSED
        trigger: "POST /lending/applications/{id}/close"
        preconditions:
          - "Borrower.status == APPROVED_SPONSOR AND Borrower.guarantee_status == EXECUTED"
          - "Property.status == UNDER_CONTRACT"
          - "every RehabLineItem of this application has status IN {APPROVED, REJECTED, VOID}"
          - "every Contractor referenced by an APPROVED RehabLineItem has payable == true"
        side_effects:
          - "create Loan with committed_amount_cents = approved_loan_amount_cents"
          - "seed Loan buckets: funded_principal_cents = alloc_initial_funding_cents, interest_reserve_balance_cents = interest_reserve_funded_cents = alloc_interest_reserve_cents, undisbursed_holdback_cents = alloc_rehab_holdback_cents"
          - "create LedgerEntry INITIAL_FUNDING for alloc_initial_funding_cents"
          - "cascade: Property -> BORROWER_OWNED"
      - from: DRAFT
        to: WITHDRAWN
        trigger: "cascade from Borrower APPROVED_SPONSOR -> SUSPENDED"
        preconditions: []
        side_effects:
          - "cascade depth 2: RehabLineItem rows with status IN {PROPOSED, REVISION_REQUESTED, APPROVED} -> VOID"
      - from: SIZED
        to: WITHDRAWN
        trigger: "cascade from Borrower APPROVED_SPONSOR -> SUSPENDED"
        preconditions: []
        side_effects:
          - "clear every sizing field back to null"
          - "cascade depth 2: RehabLineItem rows with status IN {PROPOSED, REVISION_REQUESTED, APPROVED} -> VOID"

  - entity: RehabLineItem
    field: status
    initial_state: PROPOSED
    terminal_states: [REJECTED, FULLY_RELEASED, VOID]
    transitions:
      - from: PROPOSED
        to: APPROVED
        trigger: "POST /lending/rehab-line-items/{id}/review decision=APPROVE"
        preconditions:
          - "LoanApplication.status IN {DRAFT, SIZED}"
          - "approved_cost_cents <= cost_cents"
          - "approved_cost_cents <= floor(SINGLE_LINE_CAP_PCT * (sum of cost_cents over sibling lines with status IN {PROPOSED, REVISION_REQUESTED} + sum of approved_cost_cents over sibling lines with status == APPROVED, including this line's approved_cost_cents))"
        side_effects:
          - "set approved_cost_cents (defaults to cost_cents when omitted)"
          - "recompute LoanApplication.approved_rehab_total_cents"
          - "when LoanApplication.status == SIZED, set LoanApplication.sizing_stale = true"
      - from: PROPOSED
        to: REVISION_REQUESTED
        trigger: "POST /lending/rehab-line-items/{id}/review decision=REQUEST_REVISION"
        preconditions:
          - "LoanApplication.status IN {DRAFT, SIZED}"
        side_effects:
          - "increment revision_round by 1"
          - "store reviewer_note"
      - from: REVISION_REQUESTED
        to: PROPOSED
        trigger: "PATCH /lending/rehab-line-items/{id}"
        preconditions:
          - "LoanApplication.status IN {DRAFT, SIZED}"
          - "revision_round < MAX_REVISION_ROUNDS (a PATCH attempted at revision_round == 3 is rejected by §1.4 priority 24 with ERR_REVISION_LIMIT_REACHED)"
        side_effects:
          - "apply the supplied cost_cents / description / scope_code / contractor_id changes"
          - "clear approved_cost_cents back to null"
      - from: APPROVED
        to: REVISION_REQUESTED
        trigger: "POST /lending/rehab-line-items/{id}/review decision=REQUEST_REVISION (compensating de-approval)"
        preconditions:
          - "LoanApplication.status IN {DRAFT, SIZED}"
          - "released_cents == 0"
        side_effects:
          - "clear approved_cost_cents to null"
          - "recompute LoanApplication.approved_rehab_total_cents downward by the cleared amount"
          - "increment revision_round by 1"
          - "when LoanApplication.status == SIZED, set LoanApplication.sizing_stale = true"
      - from: PROPOSED
        to: REJECTED
        trigger: "POST /lending/rehab-line-items/{id}/review decision=REJECT"
        preconditions:
          - "LoanApplication.status IN {DRAFT, SIZED}"
        side_effects:
          - "store reviewer_note"
      - from: APPROVED
        to: FULLY_RELEASED
        trigger: "POST /lending/draw-requests/{id}/fund (this line's released_cents reaches approved_cost_cents)"
        preconditions:
          - "released_cents == approved_cost_cents after the funding allocation is applied"
        side_effects:
          - "cascade depth 3: when every APPROVED line of the loan's application is now FULLY_RELEASED, Loan.construction_status IN_PROGRESS -> COMPLETE"
      - from: PROPOSED
        to: VOID
        trigger: "cascade from LoanApplication -> WITHDRAWN or DECLINED"
        preconditions: []
        side_effects: []
      - from: REVISION_REQUESTED
        to: VOID
        trigger: "cascade from LoanApplication -> WITHDRAWN or DECLINED"
        preconditions: []
        side_effects: []
      - from: APPROVED
        to: VOID
        trigger: "cascade from LoanApplication -> WITHDRAWN or DECLINED"
        preconditions: []
        side_effects:
          - "recompute LoanApplication.approved_rehab_total_cents to 0"

  - entity: DrawRequest
    field: status
    initial_state: SUBMITTED
    terminal_states: [FUNDED, REJECTED, SUPERSEDED, SUSPENDED]
    transitions:
      - from: SUBMITTED
        to: INSPECTION_ORDERED
        trigger: "POST /lending/draw-requests/{id}/inspection-visits"
        preconditions:
          - "verification_method == INSPECTION"
          - "no InspectionVisit of this request has status == SCHEDULED"
          - "the inspector has no other SCHEDULED visit whose window, widened by TRAVEL_BUFFER_MINUTES on both sides, overlaps the requested window"
        side_effects:
          - "create InspectionVisit in SCHEDULED"
      - from: INSPECTION_ORDERED
        to: INSPECTED
        trigger: "POST /lending/inspection-visits/{id}/report"
        preconditions:
          - "X-User-ID == InspectionVisit.inspector_id"
          - "line_verifications covers every DrawLineItem of the request exactly once"
        side_effects:
          - "InspectionVisit -> COMPLETED, set reported_at and site_notes"
          - "set DrawLineItem.verified_percent_complete for every allocation"
          - "compute DrawLineItem.effective_percent_complete = min(claimed, verified)"
      - from: SUBMITTED
        to: INSPECTED
        trigger: "POST /lending/draw-requests/{id}/photo-verification"
        preconditions:
          - "verification_method == PHOTO"
          - "requested_total_cents <= PHOTO_MAX_REQUEST_CENTS"
          - "photo_count >= PHOTO_MIN_PHOTOS_PER_LINE * number of DrawLineItem rows"
          - "line_verifications covers every DrawLineItem of the request exactly once"
        side_effects:
          - "store photo_count"
          - "set DrawLineItem.verified_percent_complete for every allocation"
          - "compute DrawLineItem.effective_percent_complete = min(claimed, verified, PHOTO_MAX_PCT)"
      - from: INSPECTED
        to: APPROVED
        trigger: "POST /lending/draw-requests/{id}/review decision=APPROVE"
        preconditions:
          - "Loan.payment_status IN {CURRENT, DELINQUENT}"
          - "every allocation's contractor has payable == true"
          - "no LienWaiver with status == DISPUTED exists for a contractor on this request"
          - "each contractor's open_waiver_headroom_cents covers that contractor's share of the computed release"
          - "structurally guaranteed, not a separate check: each per-line release is bounded by that line's remaining approved cost, and the sum of remaining approved costs equals undisbursed_holdback_cents + reserved_release_cents of the loan's other open draws, so an APPROVE can never over-commit the holdback"
          - "no allocation yields a negative per-line release"
        side_effects:
          - "compute per-line DrawLineItem.approved_amount_cents and the request's approved_release_cents (draw_release calculation)"
          - "move approved_release_cents from Loan.undisbursed_holdback_cents to Loan.reserved_release_cents"
          - "record reviewed_by_user_id = X-User-ID"
      - from: INSPECTED
        to: REVISION_REQUESTED
        trigger: "POST /lending/draw-requests/{id}/review decision=REQUEST_REVISION"
        preconditions: []
        side_effects:
          - "record reviewed_by_user_id = X-User-ID"
      - from: INSPECTED
        to: REJECTED
        trigger: "POST /lending/draw-requests/{id}/review decision=REJECT"
        preconditions: []
        side_effects:
          - "record reviewed_by_user_id = X-User-ID"
      - from: APPROVED
        to: FUNDED
        trigger: "POST /lending/draw-requests/{id}/fund"
        preconditions:
          - "X-User-ID != reviewed_by_user_id (segregation of duties)"
          - "Loan.payment_status IN {CURRENT, DELINQUENT}"
          - "joint_check_ack == true when any allocation's contractor has joint_check_required == true"
          - "a FINAL_UNCONDITIONAL LienWaiver exists for every contractor whose line reaches 100% with this funding"
        side_effects:
          - "set DrawLineItem.released_cents = approved_amount_cents for every allocation"
          - "move approved_release_cents out of Loan.reserved_release_cents into Loan.funded_principal_cents"
          - "cascade depth 2: add each allocation's released_cents to its RehabLineItem.released_cents and re-derive released_percent"
          - "cascade depth 3: RehabLineItem -> FULLY_RELEASED when released_cents == approved_cost_cents; when all APPROVED lines are FULLY_RELEASED, Loan.construction_status -> COMPLETE"
          - "Loan.construction_status NOT_STARTED -> IN_PROGRESS on the first funded draw"
          - "create LedgerEntry DRAW_DISBURSEMENT for approved_release_cents"
          - "set funded_by_user_id and funded_at"
      - from: SUBMITTED
        to: SUPERSEDED
        trigger: "POST /lending/loans/{id}/draw-requests (a newer request is created for the same loan)"
        preconditions: []
        side_effects:
          - "set superseded_by_draw_request_id to the newly created request's id"
      - from: INSPECTION_ORDERED
        to: SUPERSEDED
        trigger: "POST /lending/loans/{id}/draw-requests (a newer request is created for the same loan)"
        preconditions: []
        side_effects:
          - "set superseded_by_draw_request_id to the newly created request's id"
          - "cascade: every SCHEDULED InspectionVisit of this request -> CANCELLED"
      - from: INSPECTED
        to: SUPERSEDED
        trigger: "POST /lending/loans/{id}/draw-requests (a newer request is created for the same loan)"
        preconditions: []
        side_effects:
          - "set superseded_by_draw_request_id to the newly created request's id"
      - from: REVISION_REQUESTED
        to: SUPERSEDED
        trigger: "POST /lending/loans/{id}/draw-requests (a newer request is created for the same loan)"
        preconditions: []
        side_effects:
          - "set superseded_by_draw_request_id to the newly created request's id"
      - from: APPROVED
        to: SUPERSEDED
        trigger: "POST /lending/loans/{id}/draw-requests (a newer request is created for the same loan)"
        preconditions: []
        side_effects:
          - "set superseded_by_draw_request_id to the newly created request's id"
          - "compensating: return approved_release_cents from Loan.reserved_release_cents to Loan.undisbursed_holdback_cents so commitment_balance_check_cents stays 0"
          - "clear approved_release_cents and every DrawLineItem.approved_amount_cents back to null"
      - from: SUBMITTED
        to: SUSPENDED
        trigger: "POST /lending/loans/{id}/default-declaration"
        preconditions: []
        side_effects: []
      - from: INSPECTION_ORDERED
        to: SUSPENDED
        trigger: "POST /lending/loans/{id}/default-declaration"
        preconditions: []
        side_effects:
          - "cascade: every SCHEDULED InspectionVisit of this request -> CANCELLED"
      - from: INSPECTED
        to: SUSPENDED
        trigger: "POST /lending/loans/{id}/default-declaration"
        preconditions: []
        side_effects: []
      - from: APPROVED
        to: SUSPENDED
        trigger: "POST /lending/loans/{id}/default-declaration"
        preconditions: []
        side_effects:
          - "compensating: return approved_release_cents from Loan.reserved_release_cents to Loan.undisbursed_holdback_cents"
          - "clear approved_release_cents and every DrawLineItem.approved_amount_cents back to null"

  - entity: InspectionVisit
    field: status
    initial_state: SCHEDULED
    terminal_states: [COMPLETED, CANCELLED]
    transitions:
      - from: SCHEDULED
        to: COMPLETED
        trigger: "POST /lending/inspection-visits/{id}/report"
        preconditions:
          - "X-User-ID == inspector_id"
          - "DrawRequest.status == INSPECTION_ORDERED"
        side_effects:
          - "set reported_at to the logical clock instant and store site_notes"
          - "DrawRequest INSPECTION_ORDERED -> INSPECTED"
      - from: SCHEDULED
        to: CANCELLED
        trigger: "cascade from DrawRequest -> SUPERSEDED or SUSPENDED"
        preconditions: []
        side_effects:
          - "the inspector's calendar slot is freed for ERR_INSPECTOR_WINDOW_CONFLICT purposes"

  - entity: LienWaiver
    field: status
    initial_state: COLLECTED
    terminal_states: []
    transitions:
      - from: COLLECTED
        to: DISPUTED
        trigger: "POST /lending/lien-waivers/{id}/dispute action=DISPUTE"
        preconditions: []
        side_effects:
          - "set counts_toward_coverage = false"
          - "recompute Contractor.collected_waiver_coverage_cents and open_waiver_headroom_cents (may go negative)"
      - from: DISPUTED
        to: COLLECTED
        trigger: "POST /lending/lien-waivers/{id}/dispute action=RESOLVE"
        preconditions: []
        side_effects:
          - "re-derive counts_toward_coverage from waiver_type"
          - "recompute Contractor.collected_waiver_coverage_cents and open_waiver_headroom_cents"

  - entity: Property
    field: status
    initial_state: UNDER_CONTRACT
    terminal_states: [SOLD]
    transitions:
      - from: UNDER_CONTRACT
        to: BORROWER_OWNED
        trigger: "POST /lending/applications/{id}/close"
        preconditions: []
        side_effects: []
      - from: BORROWER_OWNED
        to: SOLD
        trigger: "POST /lending/loans/{id}/payments intent=PAYOFF"
        preconditions: []
        side_effects: []
      - from: BORROWER_OWNED
        to: LENDER_REO
        trigger: "POST /lending/foreclosure-cases/{id}/takeover"
        preconditions: []
        side_effects: []
      - from: LENDER_REO
        to: SOLD
        trigger: "POST /lending/foreclosure-cases/{id}/disposition"
        preconditions: []
        side_effects: []

  - entity: ForeclosureCase
    field: status
    initial_state: NOTICE_FILED
    terminal_states: [RESOLVED]
    transitions:
      - from: NOTICE_FILED
        to: TAKEOVER_COMPLETE
        trigger: "POST /lending/foreclosure-cases/{id}/takeover"
        preconditions:
          - "logical clock date >= redemption_expires_on"
          - "Loan.payment_status == DEFAULT"
        side_effects:
          - "set takeover_date"
          - "Property BORROWER_OWNED -> LENDER_REO"
          - "Loan.exit_status -> FORECLOSED"
          - "Loan.construction_status NOT_STARTED or IN_PROGRESS -> LENDER_COMPLETING"
          - "compensating sweep: move all remaining Loan.undisbursed_holdback_cents into decommitted_holdback_cents and create LedgerEntry HOLDBACK_DECOMMIT"
      - from: TAKEOVER_COMPLETE
        to: COMPLETION_FUNDED
        trigger: "POST /lending/foreclosure-cases/{id}/completion-budget"
        preconditions:
          - "budget_cents <= floor(COMPLETION_BUDGET_CAP_PCT * Property.arv_cents)"
        side_effects:
          - "set completion_budget_cents"
          - "increase Loan.committed_amount_cents and Loan.undisbursed_holdback_cents by budget_cents"
          - "increment ForeclosureCase.version by 1"
      - from: COMPLETION_FUNDED
        to: COMPLETION_FUNDED
        trigger: "POST /lending/foreclosure-cases/{id}/completion-budget (budget revision)"
        preconditions:
          - "budget_cents <= floor(COMPLETION_BUDGET_CAP_PCT * Property.arv_cents)"
        side_effects:
          - "adjust Loan.committed_amount_cents and Loan.undisbursed_holdback_cents by (new budget_cents - old completion_budget_cents)"
          - "increment ForeclosureCase.version by 1"
      - from: TAKEOVER_COMPLETE
        to: RESOLVED
        trigger: "POST /lending/foreclosure-cases/{id}/disposition (no completion budget was funded)"
        preconditions:
          - "completion_spend_cents == 0"
        side_effects:
          - "record sale_price_cents, selling_costs_cents, net_proceeds_cents"
          - "Property LENDER_REO -> SOLD; Loan.construction_status -> LENDER_COMPLETE"
          - "settle the loan: recovery_cents, charge_off_cents, surplus_returned_cents; payment_status DEFAULT -> CHARGED_OFF when charge_off_cents > 0, else DEFAULT -> PAID_OFF"
      - from: COMPLETION_FUNDED
        to: RESOLVED
        trigger: "POST /lending/foreclosure-cases/{id}/disposition"
        preconditions:
          - "completion_spend_cents <= completion_budget_cents"
        side_effects:
          - "set completion_advanced_cents = completion_spend_cents and add it to Loan.funded_principal_cents (LedgerEntry COMPLETION_ADVANCE)"
          - "move the unspent remainder (completion_budget_cents - completion_spend_cents) plus any residual undisbursed_holdback_cents into Loan.decommitted_holdback_cents so undisbursed_holdback_cents ends at 0 and commitment_balance_check_cents stays 0"
          - "record sale_price_cents, selling_costs_cents, net_proceeds_cents"
          - "Property LENDER_REO -> SOLD; Loan.construction_status LENDER_COMPLETING -> LENDER_COMPLETE"
          - "settle the loan: recovery_cents, charge_off_cents, surplus_returned_cents; payment_status DEFAULT -> CHARGED_OFF when charge_off_cents > 0, else DEFAULT -> PAID_OFF"

  - entity: Loan
    field: payment_status
    initial_state: CURRENT
    terminal_states: [PAID_OFF, CHARGED_OFF]
    transitions:
      - from: CURRENT
        to: DELINQUENT
        trigger: "POST /lending/loans/{id}/interest-accruals (unpaid_added_cents > 0)"
        preconditions: []
        side_effects:
          - "set delinquent_since = the period's period_end"
      - from: DELINQUENT
        to: CURRENT
        trigger: "POST /lending/loans/{id}/payments intent=REGULAR (fee_balance_cents and accrued_interest_unpaid_cents both reach 0)"
        preconditions: []
        side_effects:
          - "clear delinquent_since to null"
      - from: DELINQUENT
        to: DEFAULT
        trigger: "POST /lending/loans/{id}/default-declaration"
        preconditions:
          - "logical clock date - delinquent_since >= DELINQUENCY_TO_DEFAULT_DAYS"
        side_effects:
          - "set default_effective_date = the logical clock date; subsequent accrual days on/after it use default_rate_bps"
          - "cascade depth 1: increment Borrower.prior_default_count by 1 and Borrower APPROVED_SPONSOR -> SUSPENDED with suspension_reason = LOAN_DEFAULT"
          - "cascade depth 2: every other LoanApplication of that borrower with status IN {DRAFT, SIZED} -> WITHDRAWN"
          - "cascade depth 3: every RehabLineItem of those applications with status IN {PROPOSED, REVISION_REQUESTED, APPROVED} -> VOID"
          - "cascade: every DrawRequest of this loan with status IN {SUBMITTED, INSPECTION_ORDERED, INSPECTED, APPROVED} -> SUSPENDED (reserved_release_cents returned to undisbursed_holdback_cents)"
      - from: CURRENT
        to: DEFAULT
        trigger: "POST /lending/loans/{id}/default-declaration (maturity breach)"
        preconditions:
          - "logical clock date > maturity_date"
        side_effects:
          - "identical cascade set as the DELINQUENT -> DEFAULT transition"
      - from: CURRENT
        to: PAID_OFF
        trigger: "POST /lending/loans/{id}/payments intent=PAYOFF"
        preconditions:
          - "amount_cents >= payoff_quote_cents as of payment_date"
        side_effects:
          - "zero funded_principal_cents into repaid_principal_cents, zero accrued_interest_unpaid_cents and fee_balance_cents"
          - "move remaining interest_reserve_balance_cents and undisbursed_holdback_cents into decommitted_holdback_cents"
          - "Loan.exit_status -> EXITED; Property BORROWER_OWNED -> SOLD"
          - "create LedgerEntry PAYOFF"
      - from: DELINQUENT
        to: PAID_OFF
        trigger: "POST /lending/loans/{id}/payments intent=PAYOFF"
        preconditions:
          - "amount_cents >= payoff_quote_cents as of payment_date"
        side_effects:
          - "same settlement side effects as CURRENT -> PAID_OFF, and delinquent_since is cleared"
      - from: DEFAULT
        to: PAID_OFF
        trigger: "POST /lending/loans/{id}/payments intent=PAYOFF (reinstatement payoff before disposition)"
        preconditions:
          - "amount_cents >= payoff_quote_cents as of payment_date (per-diem at default_rate_bps)"
          - "no ForeclosureCase of this loan has status == RESOLVED"
        side_effects:
          - "same settlement side effects as CURRENT -> PAID_OFF"
      - from: DEFAULT
        to: CHARGED_OFF
        trigger: "POST /lending/foreclosure-cases/{id}/disposition (net proceeds fall short of the payoff)"
        preconditions:
          - "charge_off_cents > 0"
        side_effects:
          - "create LedgerEntry REO_SALE_PROCEEDS then CHARGE_OFF"
          - "zero funded_principal_cents into repaid_principal_cents, zero accrued_interest_unpaid_cents and fee_balance_cents"

  - entity: Loan
    field: construction_status
    initial_state: NOT_STARTED
    terminal_states: [LENDER_COMPLETE]
    transitions:
      - from: NOT_STARTED
        to: IN_PROGRESS
        trigger: "POST /lending/draw-requests/{id}/fund (first funded draw on the loan)"
        preconditions: []
        side_effects: []
      - from: IN_PROGRESS
        to: COMPLETE
        trigger: "POST /lending/draw-requests/{id}/fund (every APPROVED RehabLineItem becomes FULLY_RELEASED)"
        preconditions:
          - "no RehabLineItem of the loan's application has status == APPROVED remaining"
        side_effects:
          - "residual undisbursed_holdback_cents is NOT swept; it remains available for a scope re-approval"
      - from: NOT_STARTED
        to: LENDER_COMPLETING
        trigger: "POST /lending/foreclosure-cases/{id}/takeover"
        preconditions: []
        side_effects: []
      - from: IN_PROGRESS
        to: LENDER_COMPLETING
        trigger: "POST /lending/foreclosure-cases/{id}/takeover"
        preconditions: []
        side_effects: []
      - from: COMPLETE
        to: LENDER_COMPLETING
        trigger: "POST /lending/foreclosure-cases/{id}/takeover"
        preconditions: []
        side_effects: []
      - from: LENDER_COMPLETING
        to: LENDER_COMPLETE
        trigger: "POST /lending/foreclosure-cases/{id}/disposition"
        preconditions: []
        side_effects: []

  - entity: Loan
    field: exit_status
    initial_state: NOT_LISTED
    terminal_states: [EXITED, FORECLOSED]
    transitions:
      - from: NOT_LISTED
        to: LISTED
        trigger: "POST /lending/loans/{id}/exit-milestones milestone_type=LISTED"
        preconditions:
          - "effective_date >= closing_date"
        side_effects:
          - "re-derive days_on_market and exit_watch_flag"
      - from: LISTED
        to: UNDER_CONTRACT
        trigger: "POST /lending/loans/{id}/exit-milestones milestone_type=UNDER_CONTRACT"
        preconditions: []
        side_effects: []
      - from: UNDER_CONTRACT
        to: LISTED
        trigger: "POST /lending/loans/{id}/exit-milestones milestone_type=CONTRACT_FALLOUT"
        preconditions: []
        side_effects:
          - "days_on_market keeps counting from the governing LISTED milestone; it does not reset"
      - from: LISTED
        to: NOT_LISTED
        trigger: "POST /lending/loans/{id}/exit-milestones milestone_type=DELISTED"
        preconditions: []
        side_effects:
          - "days_on_market resets to 0 and exit_watch_flag resets to false"
      - from: NOT_LISTED
        to: REFI_IN_PROCESS
        trigger: "POST /lending/loans/{id}/exit-milestones milestone_type=REFI_APPLICATION"
        preconditions: []
        side_effects: []
      - from: LISTED
        to: REFI_IN_PROCESS
        trigger: "POST /lending/loans/{id}/exit-milestones milestone_type=REFI_APPLICATION"
        preconditions: []
        side_effects:
          - "days_on_market stops being derived from the listing once exit_status leaves LISTED, but the governing LISTED milestone is retained for exit_watch_flag"
      - from: REFI_IN_PROCESS
        to: EXITED
        trigger: "POST /lending/loans/{id}/payments intent=PAYOFF"
        preconditions: []
        side_effects: []
      - from: UNDER_CONTRACT
        to: EXITED
        trigger: "POST /lending/loans/{id}/payments intent=PAYOFF"
        preconditions: []
        side_effects: []
      - from: LISTED
        to: EXITED
        trigger: "POST /lending/loans/{id}/payments intent=PAYOFF"
        preconditions: []
        side_effects:
          - "an off-market payoff from a live listing is permitted; days_on_market freezes at its value on the payoff date"
      - from: NOT_LISTED
        to: EXITED
        trigger: "POST /lending/loans/{id}/payments intent=PAYOFF"
        preconditions: []
        side_effects:
          - "a payoff that never went to market (cash-out or private sale) exits directly from NOT_LISTED"
      - from: NOT_LISTED
        to: FORECLOSED
        trigger: "POST /lending/foreclosure-cases/{id}/takeover"
        preconditions: []
        side_effects: []
      - from: LISTED
        to: FORECLOSED
        trigger: "POST /lending/foreclosure-cases/{id}/takeover"
        preconditions: []
        side_effects: []
      - from: REFI_IN_PROCESS
        to: FORECLOSED
        trigger: "POST /lending/foreclosure-cases/{id}/takeover"
        preconditions: []
        side_effects: []

# =============================================================================
# §1.2.1 Concurrency Rules (OCC only; every rule is a CREATE-with-supersede race)
# =============================================================================
concurrency_rules:
  - name: draw-request-create-supersede-stale-loan
    parent_entity: Loan
    child_entity: DrawRequest
    write_endpoint: "POST /lending/loans/{id}/draw-requests"
    occ_field: expected_loan_version
    error_id: ERR_STALE_LOAN_VERSION
    status: 412
    rationale: |
      Creating a draw request is a supersede-create: the new request drives every
      still-open request on the same loan to SUPERSEDED, and when the superseded
      request was already APPROVED the create also moves money back from
      reserved_release_cents into undisbursed_holdback_cents. A caller that read the
      loan before someone else funded, extended, or reviewed a draw would therefore
      cancel work it never saw and size its allocations against a holdback figure that
      no longer exists. The caller must echo the Loan.version it based the request on;
      any other value is rejected with ERR_STALE_LOAN_VERSION and no request is created.
    version_bump: "a successful create increments Loan.version by 1"

  - name: completion-budget-revision-stale-case
    parent_entity: ForeclosureCase
    child_entity: ForeclosureCase
    write_endpoint: "POST /lending/foreclosure-cases/{id}/completion-budget"
    occ_field: expected_foreclosure_case_version
    error_id: ERR_STALE_FORECLOSURE_CASE_VERSION
    status: 412
    rationale: |
      A completion budget supersedes the previous budget and re-bases the loan
      commitment by the delta between the new and old figures. Two asset managers
      working from different reads of the case would each compute their delta against
      a commitment total the other has already moved, so the caller must echo the
      ForeclosureCase.version its delta was computed from; any other value is rejected
      with ERR_STALE_FORECLOSURE_CASE_VERSION and neither the case nor the loan changes.
    version_bump: "a successful budget write increments ForeclosureCase.version by 1"

# =============================================================================
# §1.3 Calculation Rules
# All money is integer cents. Every division/multiplication uses Decimal with
# ROUND_HALF_UP unless a rule explicitly says floor(). Percentages are Decimal
# with 2 fractional digits.
# =============================================================================
calculations:
  - name: borrower_experience_score
    algorithm_type: weighted_scoring
    trigger: "POST /lending/borrowers (variant intake_rolling); POST /lending/borrowers/{id}/status action=RECERTIFY (variant recert_lifetime_decay)"
    formula: |
      raw = 40 * min(1, EXP_UNITS / 5)
          + 25 * clamp((credit_score - 600) / 200, 0, 1)
          + 20 * min(1, liquidity_cents / (LIQUIDITY_COVERAGE_PCT * BASIS_CENTS))
          + 15 * min(1, flips_lifetime / 10)
          - EXPERIENCE_DEFAULT_PENALTY * prior_default_count
      score = round_half_up(clamp(raw, 0, 100), 2)
      tier  = TIER_A if score >= 80.00 else TIER_B if score >= 65.00 else TIER_C if score >= 45.00 else TIER_D
    variants:
      - name: intake_rolling
        applies_when: "POST /lending/borrowers"
        differences: |
          EXP_UNITS = flips_last_24mo (recent activity only; lifetime flips are worth
          nothing in this term). BASIS_CENTS = declared_target_loan_cents.
          Result is stored in intake_experience_score.
      - name: recert_lifetime_decay
        applies_when: "POST /lending/borrowers/{id}/status action=RECERTIFY"
        differences: |
          EXP_UNITS = flips_last_24mo + 0.5 * (flips_lifetime - flips_last_24mo) —
          older flips are credited at a 0.5 decay weight, so the same sponsor scores
          differently on recertification than at intake.
          BASIS_CENTS = max(Loan.committed_amount_cents) over the borrower's loans whose
          payment_status IN {CURRENT, DELINQUENT, DEFAULT}; when that set is empty
          BASIS_CENTS falls back to declared_target_loan_cents.
          Result is stored in recertified_experience_score.
    input_set: "the Borrower row itself, plus (recert variant only) the borrower's loans with payment_status IN {CURRENT, DELINQUENT, DEFAULT}"
    constants:
      LIQUIDITY_COVERAGE_PCT: 0.10
      EXPERIENCE_DEFAULT_PENALTY: 15
      RECENT_FLIP_TARGET: 5
      LIFETIME_FLIP_TARGET: 10
      DECAY_WEIGHT_OLDER_FLIPS: 0.5
      TIER_A_MIN: 80.00
      TIER_B_MIN: 65.00
      TIER_C_MIN: 45.00
    precision: "score rounded to 2 decimals, ROUND_HALF_UP; each of the four terms is kept unrounded and only the clamped total is rounded"
    worked_example: |
      flips_last_24mo=6, flips_lifetime=8, credit_score=760, liquidity=30000000,
      declared_target=30000000, prior_default_count=0
        intake_rolling: 40*1 + 25*0.8 + 20*min(1, 30000000/3000000)=20 + 15*0.8=12 -> 92.00 -> TIER_A
      flips_last_24mo=3, flips_lifetime=6, credit_score=696, liquidity=3000000,
      declared_target=30000000, prior_default_count=0
        intake_rolling: 40*0.6=24 + 25*0.48=12 + 20*1=20 + 15*0.6=9 -> 65.00 -> TIER_B (exact boundary)
        credit_score=695 instead: 25*0.475=11.875 -> 64.88 -> TIER_C
        recert_lifetime_decay with one active loan committed 45000000:
          EXP_UNITS = 3 + 0.5*3 = 4.5 -> 40*0.9=36; liquidity term 20*min(1, 3000000/4500000)=13.333...
          -> 36 + 12 + 13.33 + 9 = 70.33 -> TIER_B
        recert_lifetime_decay with no loans (fallback basis 30000000): 36+12+20+9 -> 77.00 -> TIER_B
      flips_last_24mo=1, flips_lifetime=1, credit_score=640, liquidity=500000,
      declared_target=30000000, prior_default_count=1
        intake_rolling: 8 + 5 + 3.333... + 1.5 - 15 = 2.83 -> TIER_D

  - name: loan_sizing_max
    algorithm_type: tiered_pricing
    trigger: "POST /lending/applications/{id}/size"
    formula: |
      LTP   = LTP_PCT[LoanApplication.pricing_tier]
      LTC   = LTC_PCT[LoanApplication.pricing_tier]
      LTARV = LTARV_PCT[LoanApplication.pricing_tier]
      rehab = approved_rehab_total_cents
      cap_purchase_advance_cents = floor(LTP   * Property.purchase_price_cents)
      cap_ltc_cents              = floor(LTC   * (Property.purchase_price_cents + rehab))
      cap_ltarv_cents            = floor(LTARV * Property.arv_cents)
      max_total_loan_cents = min(cap_purchase_advance_cents + rehab, cap_ltc_cents, cap_ltarv_cents)
      # NOTE: each cap is floored to a whole cent BEFORE the min is taken; flooring the
      # min of the unfloored caps is a different number and is wrong.
    input_set: "Property (purchase_price_cents, arv_cents) and RehabLineItem rows with status IN {APPROVED, FULLY_RELEASED}"
    constants:
      LTP_PCT:   { TIER_A: 0.90, TIER_B: 0.85, TIER_C: 0.80, TIER_D: 0.70 }
      LTC_PCT:   { TIER_A: 0.90, TIER_B: 0.85, TIER_C: 0.80, TIER_D: 0.70 }
      LTARV_PCT: { TIER_A: 0.75, TIER_B: 0.70, TIER_C: 0.65, TIER_D: 0.60 }
    precision: "floor() to whole cents on each cap; no rounding on the min"
    worked_example: |
      TIER_A, purchase 20000000, arv 32000000, approved rehab 10000000:
        cap_purchase_advance = 18000000; cap_ltc = floor(0.90*30000000) = 27000000;
        cap_ltarv = floor(0.75*32000000) = 24000000
        max_total = min(18000000+10000000, 27000000, 24000000) = 24000000  (LTARV binds)
      TIER_B on the same property: cap_purchase_advance = 17000000;
        cap_ltc = 25500000; cap_ltarv = 22400000; max_total = 22400000

  - name: commitment_allocation
    algorithm_type: constraint_propagation
    trigger: "POST /lending/applications/{id}/size (variant sizing_pass); POST /lending/applications/{id}/decision decision=APPROVE (variant decision_pass)"
    formula: |
      The three buckets are circularly coupled: the interest reserve is priced off the
      funded principal, and the funded principal is what is left of the commitment after
      the reserve. This system is resolved by a SINGLE bounded pass, never iterated to a
      fixed point.
        reserve_of(P) = round_half_up(P * quoted_rate_bps / 10000 * interest_reserve_months / 12)
      variant sizing_pass:
        provisional_initial = min(cap_purchase_advance_cents, max_total_loan_cents - rehab)
        reserve_1   = reserve_of(provisional_initial)
        committed_1 = provisional_initial + reserve_1 + rehab
        if committed_1 <= max_total_loan_cents:
            sized_initial_funding_cents = provisional_initial
            sized_interest_reserve_cents = reserve_1
        else:
            excess = committed_1 - max_total_loan_cents
            sized_initial_funding_cents  = provisional_initial - excess
            sized_interest_reserve_cents = reserve_of(sized_initial_funding_cents)   # recomputed EXACTLY ONCE
        sized_committed_amount_cents = sized_initial_funding_cents + sized_interest_reserve_cents + rehab
        # The second reserve pass is cheaper than the first, so sized_committed_amount_cents
        # normally lands strictly BELOW max_total_loan_cents. That residual slack is
        # deliberately NOT reallocated — a second correction round is forbidden.
      variant decision_pass:
        X = approved_loan_amount_cents (defaults to sized_committed_amount_cents)
        provisional = X - rehab
        alloc_interest_reserve_cents = reserve_of(provisional)
        alloc_initial_funding_cents  = provisional - alloc_interest_reserve_cents
        alloc_rehab_holdback_cents   = rehab
        # the committed total equals X exactly; the reserve is carved OUT of the non-rehab
        # remainder instead of being added ON TOP of a capped purchase advance, so the
        # two variants split the same commitment differently.
    variants:
      - name: sizing_pass
        applies_when: "POST /lending/applications/{id}/size"
        differences: "Reserve is priced on a capped purchase advance and then ADDED to the commitment, with one downward correction and unreallocated slack."
      - name: decision_pass
        applies_when: "POST /lending/applications/{id}/decision decision=APPROVE"
        differences: "Reserve is CARVED OUT of (approved amount - rehab); the commitment total is exogenous and exact."
    input_set: "the application's caps from loan_sizing_max plus approved_rehab_total_cents"
    constants:
      MONTHS_PER_YEAR: 12
    precision: "reserve rounded ROUND_HALF_UP to whole cents at each computation; buckets are exact integers"
    worked_example: |
      TIER_A, max_total 24000000, cap_purchase_advance 18000000, rehab 10000000,
      quoted_rate_bps 1150, interest_reserve_months 6:
        sizing_pass: provisional_initial = min(18000000, 14000000) = 14000000
          reserve_1 = round_half_up(14000000*0.1150*0.5) = 805000
          committed_1 = 24805000 > 24000000 -> excess 805000
          initial = 13195000; reserve = round_half_up(13195000*0.0575) = 758713
          sized_committed = 13195000 + 758713 + 10000000 = 23953713  (slack 46287 left unused)
        decision_pass at X = 23953713:
          provisional = 13953713; reserve = round_half_up(13953713*0.0575) = 802338
          initial = 13151375; holdback = 10000000; committed = 23953713 exactly
        The same application therefore reports sized_initial_funding_cents 13195000 but
        alloc_initial_funding_cents 13151375 — a 43625 divergence between the variants.
      TIER_B on the same property (max_total 22400000, cap 17000000, rehab 10000000):
        sizing_pass: provisional 12400000 -> reserve 713000 -> committed 23113000 > 22400000
          excess 713000 -> initial 11687000 -> reserve 672003 -> sized_committed 22359003

  - name: draw_release_amount
    algorithm_type: aggregation
    trigger: "POST /lending/draw-requests/{id}/review decision=APPROVE"
    formula: |
      For each DrawLineItem of the request, in RehabLineItem.scope_code ASC order:
        eff = min(claimed_percent_complete, verified_percent_complete)
        if DrawRequest.verification_method == PHOTO: eff = min(eff, PHOTO_MAX_PCT)
        retainage = 0 if eff == 1.00 else RETAINAGE_PCT[verification_method]
        earned_cents      = round_half_up(RehabLineItem.approved_cost_cents * eff)
        releasable_cents  = round_half_up(earned_cents * (1 - retainage))
        approved_amount_cents = releasable_cents - RehabLineItem.released_cents
        # approved_amount_cents < 0 is a percent-complete regression and is rejected
      approved_release_cents = sum of the per-line approved_amount_cents
      # PINNED: every line is rounded to whole cents FIRST and the rounded line amounts
      # are then summed. Summing unrounded line values and rounding the total once is a
      # different number and is wrong.
    variants:
      - name: inspection_release
        applies_when: "DrawRequest.verification_method == INSPECTION"
        differences: "eff is uncapped (up to 1.00) and retainage is 10%."
      - name: photo_release
        applies_when: "DrawRequest.verification_method == PHOTO"
        differences: "eff is capped at PHOTO_MAX_PCT (0.50) and retainage is 20%; a PHOTO draw can therefore never release more than 40% of a scope line's approved cost."
    input_set: "DrawLineItem rows of the request joined to their RehabLineItem rows with status IN {APPROVED}"
    constants:
      RETAINAGE_PCT: { INSPECTION: 0.10, PHOTO: 0.20 }
      PHOTO_MAX_PCT: 0.50
      PHOTO_MAX_REQUEST_CENTS: 3000000
      PHOTO_MIN_PHOTOS_PER_LINE: 3
    precision: "ROUND_HALF_UP to whole cents at earned_cents and again at releasable_cents (two roundings per line)"
    worked_example: |
      Lines L1 4000000 (ROOF), L2 3500000 (KITCHEN), L3 2500000 (ELECTRICAL), all
      released_cents 0. claimed/verified = (0.60/0.50), (0.45/0.45), (0.33/0.30).
        INSPECTION: eff 0.50/0.45/0.30
          L1 earned 2000000 -> releasable 1800000
          L2 earned 1575000 -> releasable 1417500
          L3 earned  750000 -> releasable  675000
          approved_release = 3892500
        PHOTO (same numbers, retainage 20%): 1600000 + 1260000 + 600000 = 3460000
          -> a 432500 divergence driven purely by verification_method
      Rounding-order proof: three lines of approved cost 333333 / 333333 / 333335 at
      eff 0.50 with 10% retainage:
        per line: earned 166667/166667/166668 -> releasable 150000/150000/150001 -> 450001
        sum-then-round: 500002 * 0.90 = 450001.8 -> 450002 (WRONG under this scaffold)
      Retainage release at completion: L1 with released_cents 1800000, verified 1.00 ->
        retainage 0 -> releasable 4000000 -> approved 2200000. At verified 0.99 instead:
        earned 3960000 -> releasable 3564000 -> approved 1764000 (a 436000 cliff at 1.00).

  - name: interest_accrual_and_reserve_sweep
    algorithm_type: chronological
    trigger: "POST /lending/loans/{id}/interest-accruals"
    formula: |
      day_count        = (period_end - period_start).days + 1        # BOTH endpoints inclusive
      note_rate_days   = number of days d in [period_start, period_end] with
                         (default_effective_date is null OR d < default_effective_date)
      default_rate_days = day_count - note_rate_days
      principal_snapshot_cents = Loan.funded_principal_cents read BEFORE this period's sweep
      note_rate_interest_cents    = round_half_up(principal_snapshot_cents * note_rate_bps    / 10000 * note_rate_days    / DAY_BASIS)
      default_rate_interest_cents = round_half_up(principal_snapshot_cents * default_rate_bps / 10000 * default_rate_days / DAY_BASIS)
      interest_accrued_cents = note_rate_interest_cents + default_rate_interest_cents
      # two independent roundings then a sum — NOT one rounding of a blended rate
      swept_from_reserve_cents = min(interest_accrued_cents, Loan.interest_reserve_balance_cents)
      unpaid_added_cents       = interest_accrued_cents - swept_from_reserve_cents
      then, in this order:
        interest_reserve_balance_cents -= swept_from_reserve_cents
        funded_principal_cents        += swept_from_reserve_cents   # swept interest capitalises
        accrued_interest_unpaid_cents += unpaid_added_cents
        last_accrual_through           = period_end
      # The capitalisation lands AFTER principal_snapshot_cents is taken, so it only
      # affects the NEXT period. Capitalising before the snapshot over-accrues.
    input_set: "the Loan row and its existing InterestAccrualPeriod rows (contiguity check)"
    constants:
      DAY_BASIS: 360
      DEFAULT_RATE_SPREAD_BPS: 600
    precision: "ROUND_HALF_UP to whole cents on each of the two rate components separately"
    worked_example: |
      Loan: funded_principal 13151375, interest_reserve_balance 802338, note_rate_bps 1150,
      default_rate_bps 1750, closing_date 2026-08-10.
        Period 2026-08-10..2027-02-15: day_count 190, all note-rate days
          interest = round_half_up(13151375*0.1150*190/360) = 798215
          swept 798215 -> reserve 4123; funded_principal 13949590; unpaid 0; still CURRENT
        Period 2027-02-16..2027-02-16: day_count 1, principal_snapshot 13949590
          interest = round_half_up(13949590*0.1150*1/360) = 4456
          (on the pre-capitalisation principal it would have been 4201 — proof the sweep
          capitalised into the next period)
          swept min(4456, 4123) = 4123 -> reserve exactly 0; funded_principal 13953713
          unpaid_added 333 -> CURRENT -> DELINQUENT, delinquent_since 2027-02-16
        Period 2027-02-17..2027-03-31 with default_effective_date 2027-02-26:
          day_count 43, note_rate_days 9, default_rate_days 34, principal 13953713
          note component    = round_half_up(13953713*0.1150*9/360)  = 40117
          default component = round_half_up(13953713*0.1750*34/360) = 230624
          interest_accrued = 270741 (a single blended-rate computation gives 191670 — wrong)

  - name: payment_waterfall
    algorithm_type: waterfall_allocation
    trigger: "POST /lending/loans/{id}/payments intent=REGULAR"
    formula: |
      remaining = amount_cents
      pay_fees      = min(remaining, fee_balance_cents);              remaining -= pay_fees
      pay_interest  = min(remaining, accrued_interest_unpaid_cents);  remaining -= pay_interest
      pay_principal = min(remaining, funded_principal_cents);         remaining -= pay_principal
      if remaining > 0 -> ERR_PAYMENT_EXCEEDS_BALANCE (nothing is applied)
      fee_balance_cents             -= pay_fees
      accrued_interest_unpaid_cents -= pay_interest
      funded_principal_cents        -= pay_principal
      repaid_principal_cents        += pay_principal
      # The commitment identity is preserved because principal only moves between the
      # funded_principal and repaid_principal buckets.
      if payment_status == DELINQUENT and fee_balance_cents == 0 and accrued_interest_unpaid_cents == 0:
          payment_status -> CURRENT; delinquent_since -> null
    input_set: "the Loan row"
    constants: {}
    precision: "integer cents throughout; no rounding"
    worked_example: |
      fee_balance 0, accrued_interest_unpaid 333, funded_principal 13953713.
        amount 333 -> interest 333, unpaid 0 -> DELINQUENT cures to CURRENT
        amount 332 -> interest 332, unpaid 1 -> stays DELINQUENT (a 1-cent shortfall does not cure)
        amount 1000 -> interest 333 then principal 667 -> funded 13953046, repaid 667

  - name: payoff_quote
    algorithm_type: threshold
    trigger: "GET /lending/loans/{id} (payoff_quote_cents); POST /lending/loans/{id}/payments intent=PAYOFF"
    formula: |
      anchor_date   = last_accrual_through if not null else (closing_date - 1 day)
      per_diem_days = (quote_date - anchor_date).days      # quote_date exclusive of the anchor
      rate_bps      = default_rate_bps if payment_status == DEFAULT else note_rate_bps
      divisor       = 360 if day_count_convention == PER_DIEM_360 else 365
      per_diem_interest_cents = round_half_up(funded_principal_cents * rate_bps / 10000 * per_diem_days / divisor)
      payoff_quote_cents = funded_principal_cents + accrued_interest_unpaid_cents
                         + fee_balance_cents + per_diem_interest_cents
      # quote_date is the logical clock date on a read and payment_date on a payoff.
    variants:
      - name: per_diem_360
        applies_when: "Loan.day_count_convention == PER_DIEM_360"
        differences: "per-diem interest divides by 360, producing the larger quote."
      - name: per_diem_365
        applies_when: "Loan.day_count_convention == PER_DIEM_365"
        differences: "per-diem interest divides by 365, producing the smaller quote; a payoff sized off the wrong convention is short."
    input_set: "the Loan row and its most recent InterestAccrualPeriod"
    constants: {}
    precision: "ROUND_HALF_UP to whole cents on the per-diem component only"
    worked_example: |
      funded_principal 13953713, accrued_interest_unpaid 333, fee_balance 0,
      note_rate_bps 1150, last_accrual_through 2027-02-16, quote date 2027-03-01
      (per_diem_days 13, payment_status DELINQUENT so the note rate applies):
        PER_DIEM_360: round_half_up(13953713*0.1150*13/360) = 57947 -> payoff 14011993
        PER_DIEM_365: round_half_up(13953713*0.1150*13/365) = 57153 -> payoff 14011199
        delta 794 — a 365-convention payment against a 360-convention loan is short.

  - name: extension_repricing
    algorithm_type: threshold
    trigger: "POST /lending/loans/{id}/extensions"
    formula: |
      fee_cents = round_half_up(funded_principal_cents * EXTENSION_FEE_BPS / 10000 * months)
      fee_balance_cents += fee_cents            # a fee, never part of the commitment
      note_rate_bps     += EXTENSION_RATE_STEP_BPS      # per grant, not per month
      default_rate_bps   = note_rate_bps + DEFAULT_RATE_SPREAD_BPS   # re-derived
      extension_count       += 1
      extension_months_total += months
      maturity_date = closing_date + (term_months + extension_months_total) calendar months
      create LedgerEntry EXTENSION_FEE
    input_set: "the Loan row"
    constants:
      EXTENSION_FEE_BPS: 100
      EXTENSION_RATE_STEP_BPS: 50
      MAX_EXTENSIONS: 2
      DEFAULT_RATE_SPREAD_BPS: 600
    precision: "ROUND_HALF_UP to whole cents on the fee"
    worked_example: |
      funded_principal 13151375, note_rate_bps 1150, closing 2026-08-10, term 9 (maturity 2027-05-10):
        1-month extension: fee = round_half_up(13151375*0.01*1) = 131514; note rate 1200;
          default rate 1800; maturity 2027-06-10
        3-month extension instead: fee = round_half_up(13151375*0.01*3) = 394541; maturity 2027-08-10
      funded_principal 13953713: 1-month fee 139537; 3-month fee 418611

  - name: exit_monitoring
    algorithm_type: projection
    trigger: "POST /lending/loans/{id}/exit-milestones; GET /lending/loans/{id}"
    formula: |
      governing = the ExitMilestone of the loan with milestone_type == LISTED having the
                  greatest effective_date, tie-broken by the greatest created_at, and
                  effective_date later than the most recent DELISTED milestone's
                  effective_date (if any). null when no such milestone exists.
      exit_status is driven by the latest milestone overall, ordered by effective_date DESC
                  then created_at DESC (never by id), mapped:
                  LISTED | CONTRACT_FALLOUT | PRICE_REDUCED -> LISTED
                  UNDER_CONTRACT -> UNDER_CONTRACT
                  REFI_APPLICATION | REFI_APPRAISAL_COMPLETE | REFI_COMMITMENT_ISSUED -> REFI_IN_PROCESS
                  DELISTED -> NOT_LISTED
      days_on_market  = 0 when governing is null, else (logical clock date - governing.effective_date).days
      exit_watch_flag = days_on_market > EXIT_WATCH_DOM_DAYS
                        AND no PRICE_REDUCED milestone exists with effective_date >= governing.effective_date
      # A stale listing that has never been repriced is the exit-watch signal; one price
      # reduction on or after the governing listing date clears the flag permanently.
    input_set: "ExitMilestone rows of the loan"
    constants:
      EXIT_WATCH_DOM_DAYS: 90
    precision: "whole days; no partial-day arithmetic"
    worked_example: |
      LISTED effective 2026-09-01 with no PRICE_REDUCED:
        clock 2026-11-30 -> days_on_market 90 -> exit_watch_flag false (strict >)
        clock 2026-12-01 -> days_on_market 91 -> exit_watch_flag true
        add PRICE_REDUCED effective 2026-10-15 -> exit_watch_flag false at the same clock
        a PRICE_REDUCED effective 2026-08-20 (before the governing listing) does NOT clear it

  - name: contractor_payment_control
    algorithm_type: aggregation
    trigger: "POST /lending/draw-requests/{id}/review decision=APPROVE; POST /lending/lien-waivers; POST /lending/lien-waivers/{id}/dispute"
    formula: |
      collected_waiver_coverage_cents = sum(LienWaiver.amount_covered_cents) over waivers of
        this contractor with status == COLLECTED and waiver_type IN {PARTIAL_UNCONDITIONAL,
        FINAL_UNCONDITIONAL}                       # PARTIAL_CONDITIONAL never counts
      released_to_contractor_cents = sum(RehabLineItem.released_cents) over every line whose
        contractor_id is this contractor
      open_waiver_headroom_cents = collected_waiver_coverage_cents - released_to_contractor_cents
      license_status = ACTIVE when logical clock date <= license_expires_on else EXPIRED
      payable        = (license_status == ACTIVE) AND w9_on_file
      # Draw approval requires, per contractor c on the request:
      #   sum of that contractor's per-line approved_amount_cents <= open_waiver_headroom_cents(c)
      # Disputing an already-consumed waiver drives headroom negative, which blocks the
      # next draw until the dispute is resolved or fresh coverage is filed.
    input_set: "LienWaiver rows of the contractor and RehabLineItem rows of the contractor"
    constants: {}
    precision: "integer cents"
    worked_example: |
      Contractor c1 owns lines L1 (4000000) and L2 (3500000); c2 owns L3 (2500000).
      A funded draw releases 1800000 + 1417500 to c1 and 675000 to c2:
        released_to_contractor(c1) = 3217500; released_to_contractor(c2) = 675000
      c1 has PARTIAL_UNCONDITIONAL waivers of 3000000 and 400000 -> coverage 3400000
        -> headroom 182500. Adding a PARTIAL_CONDITIONAL waiver of 5000000 leaves
        coverage at 3400000 (conditional waivers are ignored).
        Disputing the 400000 waiver -> coverage 3000000 -> headroom -217500.

  - name: reo_disposition_settlement
    algorithm_type: waterfall_allocation
    trigger: "POST /lending/foreclosure-cases/{id}/disposition"
    formula: |
      completion_advanced_cents = completion_spend_cents
      funded_principal_cents   += completion_advanced_cents      # advanced BEFORE the payoff math
      unspent = (completion_budget_cents or 0) - completion_advanced_cents
      decommitted_holdback_cents += unspent + undisbursed_holdback_cents
      undisbursed_holdback_cents  = 0
      selling_costs_cents = floor(SELLING_COST_PCT * sale_price_cents)
      net_proceeds_cents  = sale_price_cents - selling_costs_cents
      payoff_at_disposition = payoff_quote as of sale_date (per-diem at default_rate_bps,
                              anchored on last_accrual_through, on the post-advance principal)
      recovery_cents         = min(payoff_at_disposition, net_proceeds_cents)
      charge_off_cents       = max(0, payoff_at_disposition - net_proceeds_cents)
      surplus_returned_cents = max(0, net_proceeds_cents - payoff_at_disposition)
    input_set: "the ForeclosureCase, its Loan, and the Property arv/sale figures"
    constants:
      SELLING_COST_PCT: 0.06
      COMPLETION_BUDGET_CAP_PCT: 0.20
    precision: "floor() on selling costs; ROUND_HALF_UP on the per-diem component of the payoff"
    worked_example: |
      Loan after takeover: funded_principal 13953713, accrued_interest_unpaid 271074,
      fee_balance 0, default_rate_bps 1750, last_accrual_through 2027-03-31,
      committed 23953713 with undisbursed_holdback 10000000 swept to decommitted at takeover.
      Completion budget 5000000 (cap floor(0.20*32000000) = 6400000 -> accepted;
      6400001 would be rejected) -> committed 28953713, undisbursed_holdback 5000000.
      Disposition on 2027-07-28 with sale_price 18000000 and completion_spend 4500000:
        funded_principal 13953713 + 4500000 = 18453713
        unspent 500000 -> decommitted 10000000 + 500000 = 10500000; undisbursed 0
        per_diem_days = 2027-07-28 - 2027-03-31 = 119
        per_diem = round_half_up(18453713*0.1750*119/360) = 1067496
        payoff_at_disposition = 18453713 + 271074 + 0 + 1067496 = 19792283
        selling_costs = floor(0.06*18000000) = 1080000; net_proceeds = 16920000
        recovery 16920000; charge_off 2872283; surplus 0 -> payment_status DEFAULT -> CHARGED_OFF
      Conservation after settlement: repaid 18453713 + decommitted 10500000 = 28953713 = committed

  - name: commitment_conservation_invariant
    algorithm_type: aggregation
    trigger: "every write that touches a Loan money bucket"
    formula: |
      commitment_balance_check_cents =
        committed_amount_cents
        - ( funded_principal_cents + repaid_principal_cents + reserved_release_cents
          + undisbursed_holdback_cents + interest_reserve_balance_cents
          + decommitted_holdback_cents )
      # MUST be 0 after every single write. fee_balance_cents and
      # accrued_interest_unpaid_cents are deliberately OUTSIDE the identity: they are
      # revenue, not commitment, and adding them would break the invariant.
      # Interest swept from the reserve moves between two terms of the identity
      # (interest_reserve_balance -> funded_principal) so the total is untouched.
    input_set: "the Loan row"
    constants: {}
    precision: "integer cents; exact equality to 0"
    worked_example: |
      At closing: committed 23953713 = funded 13151375 + reserve 802338 + holdback 10000000.
      After a 3892500 draw approval: holdback 6107500, reserved_release 3892500 -> still 0.
      After that draw is superseded by a new request: holdback 10000000, reserved 0 -> still 0.
      After funding it: funded 17043875, reserved 0, holdback 6107500 -> still 0.
      After a reserve sweep of 798215 (bucket movement only; the sweep amount itself comes from the accrual calculation): funded 17842090, reserve 4123 -> still 0.

# =============================================================================
# §1.4 Validation Rules — evaluated in strict ascending priority order.
# The FIRST rule whose condition holds wins; later rules are never reported.
# =============================================================================
validations:
  - priority: 1
    category: auth
    rule: "X-Role header is absent, empty, or not one of the seven declared roles"
    error_id: ERR_UNAUTHENTICATED
    status: 401
    applies_to: ["every endpoint except POST /_clock/set_current_utc"]

  - priority: 2
    category: authorization
    rule: "the caller's role is not listed in the endpoint's allowed roles"
    error_id: ERR_FORBIDDEN_ROLE
    status: 403
    applies_to: ["every endpoint"]

  - priority: 3
    category: schema
    rule: "a required body field is missing; a field has the wrong JSON type; an enum value is outside its declared set; a numeric field violates its declared range; a date/datetime is not ISO 8601; limit is outside 1..100 or offset is negative; line_allocations or line_verifications is empty; window_end <= window_start; period_end < period_start; an ExitMilestone omits listing_price_cents for LISTED/PRICE_REDUCED or lender_name for a REFI_* type; flips_last_24mo > flips_lifetime"
    error_id: ERR_INVALID_REQUEST
    status: 400
    applies_to: ["every endpoint with a body or query parameters"]

  - priority: 4
    category: existence
    rule: "a path id or body id does not resolve to a stored row; each entity reports its own code (borrower, property, application, rehab line item, contractor, loan, draw request, inspection visit, lien waiver, foreclosure case)"
    error_id: ERR_BORROWER_NOT_FOUND | ERR_PROPERTY_NOT_FOUND | ERR_APPLICATION_NOT_FOUND | ERR_REHAB_LINE_ITEM_NOT_FOUND | ERR_CONTRACTOR_NOT_FOUND | ERR_LOAN_NOT_FOUND | ERR_DRAW_REQUEST_NOT_FOUND | ERR_INSPECTION_VISIT_NOT_FOUND | ERR_LIEN_WAIVER_NOT_FOUND | ERR_FORECLOSURE_CASE_NOT_FOUND
    status: 404
    applies_to: ["every endpoint with a path id or a body reference"]

  - priority: 5
    category: ownership
    rule: "role Borrower acts on a Borrower / LoanApplication / Loan / DrawRequest / ExitMilestone whose borrower_id is not the caller's X-User-ID, or role Contractor acts on a Contractor / LienWaiver whose contractor_id is not the caller's X-User-ID"
    error_id: ERR_NOT_OWNER
    status: 403
    applies_to: ["every endpoint reachable by role Borrower or role Contractor"]

  - priority: 6
    category: ownership
    rule: "the reporting caller's X-User-ID is not the InspectionVisit.inspector_id the visit was assigned to"
    error_id: ERR_NOT_ASSIGNED_INSPECTOR
    status: 403
    applies_to: ["POST /lending/inspection-visits/{id}/report"]

  - priority: 7
    category: business_referential
    rule: "a rehab_line_item_id in line_allocations does not belong to the loan's originating application; or line_verifications does not cover every DrawLineItem of the request exactly once"
    error_id: ERR_LINE_ITEM_MISMATCH | ERR_LINE_VERIFICATION_INCOMPLETE
    status: 409
    applies_to: ["POST /lending/loans/{id}/draw-requests", "POST /lending/inspection-visits/{id}/report", "POST /lending/draw-requests/{id}/photo-verification"]

  - priority: 8
    category: concurrency
    rule: "expected_loan_version does not equal Loan.version; expected_foreclosure_case_version does not equal ForeclosureCase.version"
    error_id: ERR_STALE_LOAN_VERSION | ERR_STALE_FORECLOSURE_CASE_VERSION
    status: 412
    applies_to: ["POST /lending/loans/{id}/draw-requests", "POST /lending/foreclosure-cases/{id}/completion-budget"]

  - priority: 9
    category: state
    rule: "the target entity's own current state does not permit the requested transition (see §1.2); includes re-reviewing a FUNDED draw, PATCHing a line that is not REVISION_REQUESTED, closing an application that is not APPROVED, reinstating a borrower that is not SUSPENDED, taking over a case that is not NOTICE_FILED, reporting a visit that is not SCHEDULED, closing onto a Property that is not UNDER_CONTRACT, and any write to a Loan whose payment_status is PAID_OFF or CHARGED_OFF"
    error_id: ERR_BORROWER_STATE_INVALID | ERR_APPLICATION_STATE_INVALID | ERR_REHAB_LINE_STATE_INVALID | ERR_DRAW_REQUEST_STATE_INVALID | ERR_INSPECTION_VISIT_STATE_INVALID | ERR_PROPERTY_STATE_INVALID | ERR_FORECLOSURE_CASE_STATE_INVALID | ERR_LOAN_STATE_INVALID
    status: 409
    applies_to: ["every action endpoint"]

  - priority: 10
    category: cross_entity_state
    rule: "the governing Loan is not serviceable for this operation: payment_status == DEFAULT blocks new draw requests, draw review, draw funding, extensions and new exit milestones (foreclosure and payoff remain available)"
    error_id: ERR_LOAN_NOT_SERVICEABLE
    status: 409
    applies_to: ["POST /lending/loans/{id}/draw-requests", "POST /lending/draw-requests/{id}/review", "POST /lending/draw-requests/{id}/fund", "POST /lending/loans/{id}/extensions", "POST /lending/loans/{id}/exit-milestones"]

  - priority: 11
    category: authorization
    rule: "the X-User-ID funding a draw equals DrawRequest.reviewed_by_user_id; or the X-User-ID deciding an application equals the X-User-ID that sized it"
    error_id: ERR_SEGREGATION_OF_DUTIES
    status: 403
    applies_to: ["POST /lending/draw-requests/{id}/fund", "POST /lending/applications/{id}/decision"]

  - priority: 12
    category: business_safety
    rule: "the sponsor cannot carry the operation: Borrower.status != APPROVED_SPONSOR, or experience_tier == TIER_D at approval or at REINSTATE, or a Loan of this sponsor has payment_status IN {DEFAULT, CHARGED_OFF} at REINSTATE, or guarantee_status != EXECUTED, or entity_type == SOLE_PROP at application creation"
    error_id: ERR_BORROWER_NOT_ELIGIBLE | ERR_GUARANTEE_NOT_EXECUTED | ERR_ENTITY_TYPE_NOT_ELIGIBLE
    status: 409
    applies_to: ["POST /lending/applications", "POST /lending/applications/{id}/size", "POST /lending/applications/{id}/decision", "POST /lending/applications/{id}/close", "POST /lending/borrowers/{id}/status"]

  - priority: 13
    category: business_safety
    rule: "scope validation is incomplete: sizing or closing while any RehabLineItem is still PROPOSED or REVISION_REQUESTED (ERR_SCOPE_NOT_VALIDATED); or a draw allocation targets a RehabLineItem whose status is not APPROVED (ERR_SCOPE_LINE_NOT_APPROVED)"
    error_id: ERR_SCOPE_NOT_VALIDATED | ERR_SCOPE_LINE_NOT_APPROVED
    status: 409
    applies_to: ["POST /lending/applications/{id}/size", "POST /lending/applications/{id}/close", "POST /lending/loans/{id}/draw-requests"]

  - priority: 14
    category: business_safety
    rule: "a contractor on the operation has payable == false (expired license or no W-9 on file)"
    error_id: ERR_CONTRACTOR_NOT_PAYABLE
    status: 409
    applies_to: ["POST /lending/applications/{id}/close", "POST /lending/draw-requests/{id}/review"]

  - priority: 15
    category: business_safety
    rule: "a contractor on the draw has at least one LienWaiver with status == DISPUTED"
    error_id: ERR_LIEN_WAIVER_DISPUTED
    status: 409
    applies_to: ["POST /lending/draw-requests/{id}/review"]

  - priority: 16
    category: business_safety
    rule: "a contractor's share of the computed release exceeds that contractor's open_waiver_headroom_cents (ERR_WAIVER_HEADROOM_EXCEEDED, checked on both review and fund); or funding would take a scope line to 100% without a FINAL_UNCONDITIONAL waiver from its contractor (ERR_FINAL_WAIVER_REQUIRED, checked on fund only, since a review does not yet disburse)"
    error_id: ERR_WAIVER_HEADROOM_EXCEEDED | ERR_FINAL_WAIVER_REQUIRED
    status: 409
    applies_to: ["POST /lending/draw-requests/{id}/review", "POST /lending/draw-requests/{id}/fund"]

  - priority: 17
    category: business_safety
    rule: "an allocation's contractor has joint_check_required == true and joint_check_ack is not true"
    error_id: ERR_JOINT_CHECK_ACK_REQUIRED
    status: 409
    applies_to: ["POST /lending/draw-requests/{id}/fund"]

  - priority: 18
    category: business_temporal
    rule: "the inspector already has a SCHEDULED visit whose window, widened by TRAVEL_BUFFER_MINUTES (90) at both ends, overlaps the requested [window_start, window_end) half-open interval"
    error_id: ERR_INSPECTOR_WINDOW_CONFLICT
    status: 409
    applies_to: ["POST /lending/draw-requests/{id}/inspection-visits"]

  - priority: 19
    category: business_temporal
    rule: "the requested accrual period overlaps an existing InterestAccrualPeriod of the loan on the inclusive-closed interval [period_start, period_end]"
    error_id: ERR_ACCRUAL_PERIOD_OVERLAP
    status: 409
    applies_to: ["POST /lending/loans/{id}/interest-accruals"]

  - priority: 20
    category: business_temporal
    rule: "period_start is not exactly last_accrual_through + 1 day (or closing_date for the first period), leaving an un-accrued gap"
    error_id: ERR_ACCRUAL_PERIOD_GAP
    status: 409
    applies_to: ["POST /lending/loans/{id}/interest-accruals"]

  - priority: 21
    category: business_temporal
    rule: "period_end is after the logical clock date (ERR_ACCRUAL_BEYOND_CLOCK); an ExitMilestone effective_date precedes closing_date or the latest existing milestone's effective_date (ERR_MILESTONE_BACKDATED); takeover attempted before redemption_expires_on (ERR_REDEMPTION_PERIOD_ACTIVE)"
    error_id: ERR_ACCRUAL_BEYOND_CLOCK | ERR_MILESTONE_BACKDATED | ERR_REDEMPTION_PERIOD_ACTIVE
    status: 409
    applies_to: ["POST /lending/loans/{id}/interest-accruals", "POST /lending/loans/{id}/exit-milestones", "POST /lending/foreclosure-cases/{id}/takeover"]

  - priority: 22
    category: business_constraint
    rule: "the request already has a SCHEDULED InspectionVisit (ERR_VISIT_ALREADY_SCHEDULED); the verification leg does not match verification_method (ERR_VERIFICATION_METHOD_MISMATCH); photo_count < PHOTO_MIN_PHOTOS_PER_LINE * allocation count (ERR_INSUFFICIENT_PHOTO_EVIDENCE); requested_total_cents > PHOTO_MAX_REQUEST_CENTS on a PHOTO draw (ERR_PHOTO_REQUEST_TOO_LARGE)"
    error_id: ERR_VISIT_ALREADY_SCHEDULED | ERR_VERIFICATION_METHOD_MISMATCH | ERR_INSUFFICIENT_PHOTO_EVIDENCE | ERR_PHOTO_REQUEST_TOO_LARGE
    status: 409
    applies_to: ["POST /lending/draw-requests/{id}/inspection-visits", "POST /lending/draw-requests/{id}/photo-verification"]

  - priority: 23
    category: business_constraint
    rule: "scope_code duplicates a live sibling line's scope_code on the same application (ERR_DUPLICATE_SCOPE_CODE); the same rehab_line_item_id appears twice inside one line_allocations array (ERR_LINE_ALLOCATION_DUPLICATE)"
    error_id: ERR_DUPLICATE_SCOPE_CODE | ERR_LINE_ALLOCATION_DUPLICATE
    status: 409
    applies_to: ["POST /lending/applications/{id}/rehab-line-items", "PATCH /lending/rehab-line-items/{id}", "POST /lending/loans/{id}/draw-requests"]

  - priority: 24
    category: business_constraint
    rule: "extension_count is already MAX_EXTENSIONS (ERR_EXTENSION_LIMIT_REACHED); revision_round is already MAX_REVISION_ROUNDS (ERR_REVISION_LIMIT_REACHED)"
    error_id: ERR_EXTENSION_LIMIT_REACHED | ERR_REVISION_LIMIT_REACHED
    status: 409
    applies_to: ["POST /lending/loans/{id}/extensions", "PATCH /lending/rehab-line-items/{id}"]

  - priority: 25
    category: business_constraint
    rule: "the loan's exit_watch_flag is true, so no further extension may be granted until the listing is repriced"
    error_id: ERR_EXTENSION_BLOCKED_BY_EXIT_WATCH
    status: 409
    applies_to: ["POST /lending/loans/{id}/extensions"]

  - priority: 26
    category: business_fiscal
    rule: "a computed per-line release is negative because the verified percent-complete is below what has already been released against that scope line"
    error_id: ERR_PERCENT_COMPLETE_REGRESSION
    status: 409
    applies_to: ["POST /lending/draw-requests/{id}/review"]

  - priority: 27
    category: business_fiscal
    rule: "approved_cost_cents exceeds cost_cents, or exceeds floor(SINGLE_LINE_CAP_PCT * the application's proposed-plus-approved scope total measured at review time)"
    error_id: ERR_SCOPE_LINE_CAP_EXCEEDED
    status: 409
    applies_to: ["POST /lending/rehab-line-items/{id}/review"]

  - priority: 28
    category: business_fiscal
    rule: "the application has never been sized (ERR_SIZING_REQUIRED); sizing_stale is true (ERR_SIZING_STALE); approved_loan_amount_cents exceeds max_total_loan_cents (ERR_LOAN_AMOUNT_EXCEEDS_LIMIT)"
    error_id: ERR_SIZING_REQUIRED | ERR_SIZING_STALE | ERR_LOAN_AMOUNT_EXCEEDS_LIMIT
    status: 409
    applies_to: ["POST /lending/applications/{id}/decision"]

  - priority: 30
    category: business_fiscal
    rule: "a REGULAR payment exceeds fee_balance + accrued_interest_unpaid + funded_principal (ERR_PAYMENT_EXCEEDS_BALANCE); a PAYOFF payment is below payoff_quote_cents as of payment_date (ERR_PAYOFF_SHORT); budget_cents exceeds floor(COMPLETION_BUDGET_CAP_PCT * Property.arv_cents) (ERR_COMPLETION_BUDGET_EXCEEDS_CAP); completion_spend_cents exceeds completion_budget_cents (ERR_COMPLETION_SPEND_EXCEEDS_BUDGET); a default declaration meets neither the DELINQUENCY_TO_DEFAULT_DAYS aging test nor the maturity-breach test (ERR_DEFAULT_PRECONDITION_NOT_MET)"
    error_id: ERR_PAYMENT_EXCEEDS_BALANCE | ERR_PAYOFF_SHORT | ERR_COMPLETION_BUDGET_EXCEEDS_CAP | ERR_COMPLETION_SPEND_EXCEEDS_BUDGET | ERR_DEFAULT_PRECONDITION_NOT_MET
    status: 409
    applies_to: ["POST /lending/loans/{id}/payments", "POST /lending/foreclosure-cases/{id}/completion-budget", "POST /lending/foreclosure-cases/{id}/disposition", "POST /lending/loans/{id}/default-declaration"]

validation_constants:
  SINGLE_LINE_CAP_PCT: 0.50
  MAX_REVISION_ROUNDS: 3
  MAX_EXTENSIONS: 2
  DELINQUENCY_TO_DEFAULT_DAYS: 10
  REDEMPTION_DAYS: 90
  TRAVEL_BUFFER_MINUTES: 90
  EXIT_WATCH_DOM_DAYS: 90
  PHOTO_MAX_REQUEST_CENTS: 3000000
  PHOTO_MIN_PHOTOS_PER_LINE: 3
  COMPLETION_BUDGET_CAP_PCT: 0.20

# =============================================================================
# §1.5 Endpoint Table (53 endpoints)
# Every path parameter is literally named {id}. Query parameters appear in
# `input:` with a trailing `?` when optional.
# =============================================================================
endpoints:
  - method: POST
    path: /lending/borrowers
    purpose: "Register a sponsor entity and score it with the intake_rolling variant"
    roles: [LoanOfficer, PlatformAdmin]
    input: [legal_entity_name, entity_type, guarantor_name, flips_last_24mo, flips_lifetime, credit_score, liquidity_cents, prior_default_count, declared_target_loan_cents]
    output: Borrower
    status: 201
    side_effects:
      - "compute intake_experience_score (variant intake_rolling) and experience_tier"
      - "status = PROSPECT, guarantee_status = PENDING"

  - method: GET
    path: /lending/borrowers/{id}
    purpose: "Read a sponsor with its live score and tier"
    roles: [LoanOfficer, CreditCommittee, LoanServicer, Borrower, PlatformAdmin]
    input: []
    output: Borrower
    status: 200
    side_effects: []

  - method: POST
    path: /lending/borrowers/{id}/status
    purpose: "Sponsor lifecycle action: APPROVE_SPONSOR | RECERTIFY | SUSPEND | REINSTATE"
    roles: [CreditCommittee, PlatformAdmin]
    input: ["action", "note?"]
    output: Borrower
    status: 200
    side_effects:
      - "see §1.2 Borrower transitions, including the RECERTIFY re-score and the two-level WITHDRAWN/VOID cascade on suspension"

  - method: POST
    path: /lending/borrowers/{id}/guarantee
    purpose: "Record execution of the personal guarantee"
    roles: [LoanOfficer, Borrower, PlatformAdmin]
    input: [guarantor_name, signature_ref, effective_date]
    output: Borrower
    status: 200
    side_effects:
      - "guarantee_status = EXECUTED, guarantee_effective_date = effective_date"

  - method: POST
    path: /lending/properties
    purpose: "Register the subject property with purchase price, as-is value and ARV"
    roles: [LoanOfficer, PlatformAdmin]
    input: [address_line, county_code, purchase_price_cents, as_is_value_cents, arv_cents, appraisal_date]
    output: Property
    status: 201
    side_effects: []

  - method: GET
    path: /lending/properties/{id}
    purpose: "Read a property"
    roles: [LoanOfficer, CreditCommittee, LoanServicer, DrawInspector, PlatformAdmin]
    input: []
    output: Property
    status: 200
    side_effects: []

  - method: PATCH
    path: /lending/properties/{id}/valuation
    purpose: "Post a revised appraisal; invalidates dependent sizings"
    roles: [LoanOfficer, PlatformAdmin]
    input: ["appraisal_date", "arv_cents?", "as_is_value_cents?"]
    output: Property
    status: 200
    side_effects:
      - "increment valuation_revision_count"
      - "cascade: every LoanApplication on this property with status == SIZED gets sizing_stale = true"

  - method: POST
    path: /lending/applications
    purpose: "Open a loan application, snapshotting the sponsor's score and tier"
    roles: [LoanOfficer, PlatformAdmin]
    input: ["borrower_id", "property_id", "term_months", "quoted_rate_bps", "interest_reserve_months", "day_count_convention?"]
    output: LoanApplication
    status: 201
    side_effects:
      - "snapshot intake_experience_score and pricing_tier from the Borrower"
      - "status = DRAFT"

  - method: GET
    path: /lending/applications/{id}
    purpose: "Read an application with its sizing and allocation fields"
    roles: [LoanOfficer, CreditCommittee, LoanServicer, Borrower, PlatformAdmin]
    input: []
    output: LoanApplication
    status: 200
    side_effects: []

  - method: GET
    path: /lending/applications
    purpose: "List applications, filterable by sponsor, property and status"
    roles: [LoanOfficer, CreditCommittee, LoanServicer, Borrower, PlatformAdmin]
    input: ["borrower_id?", "property_id?", "status?", "limit?", "offset?"]
    output: LoanApplication[]
    status: 200
    side_effects: []

  - method: POST
    path: /lending/applications/{id}/rehab-line-items
    purpose: "Add a rehab budget scope line"
    roles: [LoanOfficer, Borrower, PlatformAdmin]
    input: [scope_code, description, cost_cents, contractor_id]
    output: RehabLineItem
    status: 201
    side_effects:
      - "status = PROPOSED, revision_round = 0"
      - "when the owning application is SIZED, set sizing_stale = true"

  - method: GET
    path: /lending/applications/{id}/rehab-line-items
    purpose: "List an application's scope lines"
    roles: [LoanOfficer, CreditCommittee, LoanServicer, Borrower, Contractor, PlatformAdmin]
    input: ["status?", "limit?", "offset?"]
    output: RehabLineItem[]
    status: 200
    side_effects: []

  - method: GET
    path: /lending/rehab-line-items/{id}
    purpose: "Read one scope line with its release progress"
    roles: [LoanOfficer, CreditCommittee, LoanServicer, Borrower, Contractor, PlatformAdmin]
    input: []
    output: RehabLineItem
    status: 200
    side_effects: []

  - method: POST
    path: /lending/rehab-line-items/{id}/review
    purpose: "Scope validation decision: APPROVE | REQUEST_REVISION | REJECT"
    roles: [LoanOfficer, PlatformAdmin]
    input: ["decision", "approved_cost_cents?", "reviewer_note?"]
    output: RehabLineItem
    status: 200
    side_effects:
      - "see §1.2 RehabLineItem transitions, including the compensating APPROVED -> REVISION_REQUESTED de-approval"
      - "recompute LoanApplication.approved_rehab_total_cents and sizing_stale"

  - method: PATCH
    path: /lending/rehab-line-items/{id}
    purpose: "Borrower re-submits a revised scope line"
    roles: [Borrower, LoanOfficer, PlatformAdmin]
    input: ["cost_cents?", "description?", "scope_code?", "contractor_id?"]
    output: RehabLineItem
    status: 200
    side_effects:
      - "REVISION_REQUESTED -> PROPOSED, approved_cost_cents cleared"

  - method: POST
    path: /lending/applications/{id}/size
    purpose: "Run loan_sizing_max and the sizing_pass commitment allocation"
    roles: [LoanOfficer, PlatformAdmin]
    input: []
    output: LoanApplication
    status: 200
    side_effects:
      - "populate every cap and sized_* field; snapshot sizing_arv_cents and sizing_rate_bps; clear sizing_stale"

  - method: POST
    path: /lending/applications/{id}/decision
    purpose: "Credit committee decision: APPROVE | DECLINE"
    roles: [CreditCommittee, PlatformAdmin]
    input: ["decision", "approved_loan_amount_cents?", "rate_bps?", "decline_reason?"]
    output: LoanApplication
    status: 200
    side_effects:
      - "on APPROVE run the decision_pass commitment allocation"
      - "on DECLINE void every live scope line"

  - method: POST
    path: /lending/applications/{id}/close
    purpose: "Close the loan and create the Loan with its money buckets"
    roles: [LoanServicer, PlatformAdmin]
    input: [closing_date]
    output: Loan
    status: 201
    side_effects:
      - "create Loan seeded from the decision_pass buckets; create LedgerEntry INITIAL_FUNDING"
      - "LoanApplication -> CLOSED; Property UNDER_CONTRACT -> BORROWER_OWNED"

  - method: POST
    path: /lending/contractors
    purpose: "Register a trade contractor with licence and W-9 status"
    roles: [LoanOfficer, PlatformAdmin]
    input: [business_name, license_number, license_expires_on, w9_on_file, joint_check_required]
    output: Contractor
    status: 201
    side_effects:
      - "derive license_status from the logical clock and payable from licence + W-9"

  - method: GET
    path: /lending/contractors/{id}
    purpose: "Read a contractor with waiver coverage and headroom"
    roles: [LoanOfficer, LoanServicer, Contractor, PlatformAdmin]
    input: []
    output: Contractor
    status: 200
    side_effects: []

  - method: GET
    path: /lending/contractors/{id}/rehab-line-items
    purpose: "List every scope line assigned to a contractor"
    roles: [LoanOfficer, LoanServicer, Contractor, PlatformAdmin]
    input: ["status?", "limit?", "offset?"]
    output: RehabLineItem[]
    status: 200
    side_effects: []

  - method: GET
    path: /lending/contractors/{id}/lien-waivers
    purpose: "List a contractor's lien waivers"
    roles: [LoanOfficer, LoanServicer, Contractor, PlatformAdmin]
    input: ["status?", "limit?", "offset?"]
    output: LienWaiver[]
    status: 200
    side_effects: []

  - method: GET
    path: /lending/loans/{id}
    purpose: "Read a loan with all three state axes, every money bucket, the conservation check and the live payoff quote"
    roles: [LoanOfficer, CreditCommittee, LoanServicer, Borrower, PlatformAdmin]
    input: []
    output: Loan
    status: 200
    side_effects: []

  - method: GET
    path: /lending/loans
    purpose: "List loans, filterable by application, sponsor and status axes"
    roles: [LoanOfficer, CreditCommittee, LoanServicer, Borrower, PlatformAdmin]
    input: ["application_id?", "borrower_id?", "payment_status?", "construction_status?", "exit_status?", "limit?", "offset?"]
    output: Loan[]
    status: 200
    side_effects: []

  - method: POST
    path: /lending/loans/{id}/draw-requests
    purpose: "Submit a draw request; supersedes every still-open request on the loan"
    roles: [Borrower, PlatformAdmin]
    input: [line_allocations, verification_method, expected_loan_version]
    output: DrawRequest
    status: 201
    side_effects:
      - "create one DrawLineItem per line_allocations entry with requested_amount_cents"
      - "drive every other non-terminal DrawRequest of the loan to SUPERSEDED, returning any reserved_release_cents to undisbursed_holdback_cents and cancelling SCHEDULED visits"
      - "increment Loan.version by 1"

  - method: GET
    path: /lending/draw-requests
    purpose: "List draw requests, filterable by loan, status and supersede chain"
    roles: [LoanOfficer, LoanServicer, Borrower, DrawInspector, PlatformAdmin]
    input: ["loan_id?", "status?", "superseded_by_draw_request_id?", "limit?", "offset?"]
    output: DrawRequest[]
    status: 200
    side_effects: []

  - method: GET
    path: /lending/draw-requests/{id}
    purpose: "Read one draw request"
    roles: [LoanOfficer, LoanServicer, Borrower, DrawInspector, PlatformAdmin]
    input: []
    output: DrawRequest
    status: 200
    side_effects: []

  - method: POST
    path: /lending/draw-requests/{id}/inspection-visits
    purpose: "Order a site inspection into an inspector's calendar window"
    roles: [LoanServicer, PlatformAdmin]
    input: [inspector_id, window_start, window_end]
    output: InspectionVisit
    status: 201
    side_effects:
      - "DrawRequest SUBMITTED -> INSPECTION_ORDERED"
      - "reject windows that collide with the inspector's other SCHEDULED visits once widened by TRAVEL_BUFFER_MINUTES"

  - method: GET
    path: /lending/draw-requests/{id}/inspection-visits
    purpose: "List the visits ordered for a draw request"
    roles: [LoanServicer, DrawInspector, Borrower, PlatformAdmin]
    input: ["status?", "limit?", "offset?"]
    output: InspectionVisit[]
    status: 200
    side_effects: []

  - method: POST
    path: /lending/inspection-visits/{id}/report
    purpose: "File the inspector's verified percent-complete per scope line"
    roles: [DrawInspector, PlatformAdmin]
    input: ["line_verifications", "site_notes?"]
    output: InspectionVisit
    status: 200
    side_effects:
      - "visit -> COMPLETED; DrawRequest INSPECTION_ORDERED -> INSPECTED"
      - "set verified_percent_complete and effective_percent_complete on every DrawLineItem"

  - method: POST
    path: /lending/draw-requests/{id}/photo-verification
    purpose: "Verify a small draw from photo evidence instead of a site visit"
    roles: [LoanServicer, PlatformAdmin]
    input: [line_verifications, photo_count]
    output: DrawRequest
    status: 200
    side_effects:
      - "DrawRequest SUBMITTED -> INSPECTED with photo_count stored"
      - "set verified_percent_complete, then cap effective_percent_complete at PHOTO_MAX_PCT"

  - method: POST
    path: /lending/draw-requests/{id}/review
    purpose: "Underwrite the verified draw: APPROVE | REQUEST_REVISION | REJECT"
    roles: [LoanServicer, PlatformAdmin]
    input: ["decision", "reviewer_note?"]
    output: DrawRequest
    status: 200
    side_effects:
      - "on APPROVE compute per-line and total releases (draw_release_amount) and move holdback into reserved_release_cents"
      - "record reviewed_by_user_id for the segregation-of-duties check at funding"

  - method: POST
    path: /lending/draw-requests/{id}/fund
    purpose: "Disburse an approved draw"
    roles: [LoanServicer, PlatformAdmin]
    input: ["funding_date", "joint_check_ack?"]
    output: DrawRequest
    status: 200
    side_effects:
      - "release cash per allocation; roll released_cents up to each RehabLineItem"
      - "cascade RehabLineItem -> FULLY_RELEASED and Loan.construction_status -> IN_PROGRESS / COMPLETE"
      - "create LedgerEntry DRAW_DISBURSEMENT; set funded_by_user_id and funded_at"

  - method: GET
    path: /lending/draw-line-items
    purpose: "List draw allocations, filterable by request or scope line"
    roles: [LoanOfficer, LoanServicer, Borrower, DrawInspector, PlatformAdmin]
    input: ["draw_request_id?", "rehab_line_item_id?", "limit?", "offset?"]
    output: DrawLineItem[]
    status: 200
    side_effects: []

  - method: GET
    path: /lending/draw-line-items/{id}
    purpose: "Read one draw allocation"
    roles: [LoanOfficer, LoanServicer, Borrower, DrawInspector, PlatformAdmin]
    input: []
    output: DrawLineItem
    status: 200
    side_effects: []

  - method: POST
    path: /lending/lien-waivers
    purpose: "File a lien waiver against a loan for a contractor"
    roles: [Contractor, LoanServicer, PlatformAdmin]
    input: [loan_id, contractor_id, waiver_type, amount_covered_cents, through_date]
    output: LienWaiver
    status: 201
    side_effects:
      - "status = COLLECTED; recompute the contractor's coverage and headroom"

  - method: GET
    path: /lending/loans/{id}/lien-waivers
    purpose: "List the waivers filed against a loan"
    roles: [LoanOfficer, LoanServicer, Borrower, PlatformAdmin]
    input: ["status?", "limit?", "offset?"]
    output: LienWaiver[]
    status: 200
    side_effects: []

  - method: POST
    path: /lending/lien-waivers/{id}/dispute
    purpose: "Flag or clear a waiver dispute: DISPUTE | RESOLVE"
    roles: [LoanServicer, PlatformAdmin]
    input: ["action", "note?"]
    output: LienWaiver
    status: 200
    side_effects:
      - "toggle counts_toward_coverage and recompute the contractor's headroom, which may go negative"

  - method: POST
    path: /lending/loans/{id}/interest-accruals
    purpose: "Accrue one interest period and sweep the reserve"
    roles: [LoanServicer, PlatformAdmin]
    input: [period_start, period_end]
    output: InterestAccrualPeriod
    status: 201
    side_effects:
      - "split the period across note and default rates, sweep the reserve, capitalise the sweep into funded_principal_cents"
      - "create LedgerEntry RESERVE_SWEEP; drive CURRENT -> DELINQUENT when interest goes unpaid"

  - method: GET
    path: /lending/loans/{id}/interest-periods
    purpose: "List a loan's accrual periods"
    roles: [LoanOfficer, LoanServicer, Borrower, PlatformAdmin]
    input: ["limit?", "offset?"]
    output: InterestAccrualPeriod[]
    status: 200
    side_effects: []

  - method: GET
    path: /lending/loans/{id}/ledger-entries
    purpose: "List a loan's cash ledger"
    roles: [LoanOfficer, LoanServicer, Borrower, PlatformAdmin]
    input: ["entry_type?", "limit?", "offset?"]
    output: LedgerEntry[]
    status: 200
    side_effects: []

  - method: POST
    path: /lending/loans/{id}/payments
    purpose: "Apply a borrower payment: REGULAR waterfall or full PAYOFF"
    roles: [LoanServicer, Borrower, PlatformAdmin]
    input: [amount_cents, payment_date, intent]
    output: Loan
    status: 200
    side_effects:
      - "REGULAR: fees then unpaid interest then principal; cures DELINQUENT -> CURRENT on a full cure"
      - "PAYOFF: settle to PAID_OFF, decommit the residual holdback and reserve, EXITED + Property SOLD"
      - "create LedgerEntry BORROWER_PAYMENT or PAYOFF"

  - method: POST
    path: /lending/loans/{id}/extensions
    purpose: "Grant a short-term extension, charging a fee and stepping the rate"
    roles: [LoanServicer, PlatformAdmin]
    input: [months]
    output: Loan
    status: 200
    side_effects:
      - "add the extension fee to fee_balance_cents, step note_rate_bps and default_rate_bps, push maturity_date"
      - "create LedgerEntry EXTENSION_FEE"

  - method: POST
    path: /lending/loans/{id}/exit-milestones
    purpose: "Record listing / repricing / contract / refinance progress"
    roles: [Borrower, LoanServicer, PlatformAdmin]
    input: ["milestone_type", "effective_date", "listing_price_cents?", "lender_name?", "note?"]
    output: ExitMilestone
    status: 201
    side_effects:
      - "re-derive Loan.exit_status, days_on_market and exit_watch_flag"

  - method: GET
    path: /lending/loans/{id}/exit-milestones
    purpose: "List a loan's exit milestones"
    roles: [LoanOfficer, LoanServicer, Borrower, PlatformAdmin]
    input: ["milestone_type?", "limit?", "offset?"]
    output: ExitMilestone[]
    status: 200
    side_effects: []

  - method: POST
    path: /lending/loans/{id}/default-declaration
    purpose: "Declare the loan in default and start default-rate accrual"
    roles: [LoanServicer, PlatformAdmin]
    input: [reason]
    output: Loan
    status: 200
    side_effects:
      - "set default_effective_date; suspend every open draw request and return reserved cash to holdback"
      - "three-level sponsor cascade: Borrower SUSPENDED -> other applications WITHDRAWN -> their scope lines VOID"

  - method: POST
    path: /lending/loans/{id}/foreclosure-cases
    purpose: "File a notice of default and open a foreclosure case"
    roles: [LoanServicer, PlatformAdmin]
    input: [notice_date, county_code]
    output: ForeclosureCase
    status: 201
    side_effects:
      - "compute redemption_expires_on = notice_date + REDEMPTION_DAYS"

  - method: GET
    path: /lending/loans/{id}/foreclosure-cases
    purpose: "List the foreclosure cases filed against a loan"
    roles: [LoanOfficer, LoanServicer, PlatformAdmin]
    input: ["status?", "limit?", "offset?"]
    output: ForeclosureCase[]
    status: 200
    side_effects: []

  - method: GET
    path: /lending/foreclosure-cases/{id}
    purpose: "Read one foreclosure case"
    roles: [LoanOfficer, LoanServicer, PlatformAdmin]
    input: []
    output: ForeclosureCase
    status: 200
    side_effects: []

  - method: POST
    path: /lending/foreclosure-cases/{id}/takeover
    purpose: "Complete the property takeover after redemption expires"
    roles: [LoanServicer, PlatformAdmin]
    input: [takeover_date]
    output: ForeclosureCase
    status: 200
    side_effects:
      - "Property -> LENDER_REO; Loan.exit_status -> FORECLOSED; construction_status -> LENDER_COMPLETING"
      - "sweep the whole remaining undisbursed_holdback_cents into decommitted_holdback_cents (LedgerEntry HOLDBACK_DECOMMIT)"

  - method: POST
    path: /lending/foreclosure-cases/{id}/completion-budget
    purpose: "Set or revise the lender's completion-of-construction budget"
    roles: [LoanServicer, PlatformAdmin]
    input: [budget_cents, expected_foreclosure_case_version]
    output: ForeclosureCase
    status: 200
    side_effects:
      - "re-base Loan.committed_amount_cents and undisbursed_holdback_cents by the budget delta"
      - "increment ForeclosureCase.version by 1"

  - method: POST
    path: /lending/foreclosure-cases/{id}/disposition
    purpose: "Sell the REO asset and settle the loan"
    roles: [LoanServicer, PlatformAdmin]
    input: [sale_price_cents, sale_date, completion_spend_cents]
    output: ForeclosureCase
    status: 200
    side_effects:
      - "advance the completion spend, decommit the unspent remainder, compute recovery / charge-off / surplus"
      - "Property -> SOLD; construction_status -> LENDER_COMPLETE; payment_status -> CHARGED_OFF or PAID_OFF"
      - "create LedgerEntry COMPLETION_ADVANCE, REO_SALE_PROCEEDS and CHARGE_OFF as applicable"

  - method: POST
    path: /_clock/set_current_utc
    purpose: "Test-driving endpoint: set the logical clock that every date-dependent rule reads"
    roles: [PlatformAdmin]
    input: [to_iso8601]
    output: { current_utc: string }
    status: 200
    side_effects:
      - "re-derives every clock-dependent value: Contractor.license_status/payable, Loan.days_on_market, exit_watch_flag, payoff_quote_cents, and the accrual/redemption/aging windows"

logical_clock:
  default_current_utc: "2026-08-01T00:00:00Z"
  note: |
    Every date/time-dependent rule in this scaffold reads the logical clock, never
    the wall clock. Absent any POST /_clock/set_current_utc call the clock reads
    2026-08-01T00:00:00Z.

# =============================================================================
# §1.6 Error Catalog (65 codes)
# =============================================================================
errors:
  - { error_id: ERR_UNAUTHENTICATED, status: 401, when: "X-Role header missing or not a declared role" }
  - { error_id: ERR_FORBIDDEN_ROLE, status: 403, when: "the caller's role is not allowed on the endpoint" }
  - { error_id: ERR_INVALID_REQUEST, status: 400, when: "schema, type, enum, range, ordering or pagination violation" }
  - { error_id: ERR_BORROWER_NOT_FOUND, status: 404, when: "borrower id does not resolve" }
  - { error_id: ERR_PROPERTY_NOT_FOUND, status: 404, when: "property id does not resolve" }
  - { error_id: ERR_APPLICATION_NOT_FOUND, status: 404, when: "application id does not resolve" }
  - { error_id: ERR_REHAB_LINE_ITEM_NOT_FOUND, status: 404, when: "rehab line item id does not resolve" }
  - { error_id: ERR_CONTRACTOR_NOT_FOUND, status: 404, when: "contractor id does not resolve" }
  - { error_id: ERR_LOAN_NOT_FOUND, status: 404, when: "loan id does not resolve" }
  - { error_id: ERR_DRAW_REQUEST_NOT_FOUND, status: 404, when: "draw request id does not resolve" }
  - { error_id: ERR_INSPECTION_VISIT_NOT_FOUND, status: 404, when: "inspection visit id does not resolve" }
  - { error_id: ERR_LIEN_WAIVER_NOT_FOUND, status: 404, when: "lien waiver id does not resolve" }
  - { error_id: ERR_FORECLOSURE_CASE_NOT_FOUND, status: 404, when: "foreclosure case id does not resolve" }
  - { error_id: ERR_NOT_OWNER, status: 403, when: "an entity_backed caller touches another party's sponsor, application, loan, draw or waiver" }
  - { error_id: ERR_NOT_ASSIGNED_INSPECTOR, status: 403, when: "a DrawInspector reports on a visit assigned to a different inspector_id" }
  - { error_id: ERR_LINE_ITEM_MISMATCH, status: 409, when: "an allocation targets a scope line outside the loan's originating application" }
  - { error_id: ERR_LINE_VERIFICATION_INCOMPLETE, status: 409, when: "line_verifications does not cover every allocation of the request exactly once" }
  - { error_id: ERR_STALE_LOAN_VERSION, status: 412, when: "expected_loan_version does not match Loan.version" }
  - { error_id: ERR_STALE_FORECLOSURE_CASE_VERSION, status: 412, when: "expected_foreclosure_case_version does not match ForeclosureCase.version" }
  - { error_id: ERR_BORROWER_STATE_INVALID, status: 409, when: "the sponsor's status forbids the requested action" }
  - { error_id: ERR_APPLICATION_STATE_INVALID, status: 409, when: "the application's status forbids the requested action" }
  - { error_id: ERR_REHAB_LINE_STATE_INVALID, status: 409, when: "the scope line's status forbids the requested action" }
  - { error_id: ERR_DRAW_REQUEST_STATE_INVALID, status: 409, when: "the draw request's status forbids the requested action" }
  - { error_id: ERR_INSPECTION_VISIT_STATE_INVALID, status: 409, when: "the visit is not SCHEDULED" }
  - { error_id: ERR_PROPERTY_STATE_INVALID, status: 409, when: "the property is not in the state the action requires" }
  - { error_id: ERR_FORECLOSURE_CASE_STATE_INVALID, status: 409, when: "the foreclosure case's status forbids the requested action" }
  - { error_id: ERR_LOAN_STATE_INVALID, status: 409, when: "the loan is PAID_OFF or CHARGED_OFF and accepts no further writes" }
  - { error_id: ERR_LOAN_NOT_SERVICEABLE, status: 409, when: "the loan is in DEFAULT and the operation is a servicing operation" }
  - { error_id: ERR_SEGREGATION_OF_DUTIES, status: 403, when: "the same X-User-ID performs both halves of a split-duty pair" }
  - { error_id: ERR_BORROWER_NOT_ELIGIBLE, status: 409, when: "sponsor is not APPROVED_SPONSOR, or is TIER_D at approval or reinstatement, or still carries a DEFAULT / CHARGED_OFF loan at reinstatement" }
  - { error_id: ERR_GUARANTEE_NOT_EXECUTED, status: 409, when: "the personal guarantee is still PENDING" }
  - { error_id: ERR_ENTITY_TYPE_NOT_ELIGIBLE, status: 409, when: "entity_type == SOLE_PROP cannot borrow on an entity-based loan" }
  - { error_id: ERR_SCOPE_NOT_VALIDATED, status: 409, when: "a scope line is still PROPOSED or REVISION_REQUESTED at sizing or closing" }
  - { error_id: ERR_SCOPE_LINE_NOT_APPROVED, status: 409, when: "a draw allocation targets a scope line that is not APPROVED" }
  - { error_id: ERR_CONTRACTOR_NOT_PAYABLE, status: 409, when: "a contractor's licence has lapsed or its W-9 is missing" }
  - { error_id: ERR_LIEN_WAIVER_DISPUTED, status: 409, when: "a contractor on the draw has a DISPUTED waiver" }
  - { error_id: ERR_WAIVER_HEADROOM_EXCEEDED, status: 409, when: "a contractor's release share exceeds its unconditional waiver headroom" }
  - { error_id: ERR_FINAL_WAIVER_REQUIRED, status: 409, when: "funding would complete a scope line with no FINAL_UNCONDITIONAL waiver on file" }
  - { error_id: ERR_JOINT_CHECK_ACK_REQUIRED, status: 409, when: "a joint-check contractor is being paid without joint_check_ack" }
  - { error_id: ERR_INSPECTOR_WINDOW_CONFLICT, status: 409, when: "the inspector's buffered calendar already covers the requested window" }
  - { error_id: ERR_ACCRUAL_PERIOD_OVERLAP, status: 409, when: "the requested period overlaps an existing accrual period" }
  - { error_id: ERR_ACCRUAL_PERIOD_GAP, status: 409, when: "the requested period does not start the day after the last accrual" }
  - { error_id: ERR_ACCRUAL_BEYOND_CLOCK, status: 409, when: "period_end is in the logical future" }
  - { error_id: ERR_MILESTONE_BACKDATED, status: 409, when: "a milestone predates closing or the latest existing milestone" }
  - { error_id: ERR_REDEMPTION_PERIOD_ACTIVE, status: 409, when: "takeover attempted before redemption_expires_on" }
  - { error_id: ERR_VISIT_ALREADY_SCHEDULED, status: 409, when: "the draw request already has a SCHEDULED visit" }
  - { error_id: ERR_VERIFICATION_METHOD_MISMATCH, status: 409, when: "the verification leg does not match the request's verification_method" }
  - { error_id: ERR_INSUFFICIENT_PHOTO_EVIDENCE, status: 409, when: "photo_count is below 3 per allocated scope line" }
  - { error_id: ERR_PHOTO_REQUEST_TOO_LARGE, status: 409, when: "a PHOTO draw's requested total exceeds PHOTO_MAX_REQUEST_CENTS" }
  - { error_id: ERR_DUPLICATE_SCOPE_CODE, status: 409, when: "a live sibling scope line already uses that scope_code" }
  - { error_id: ERR_LINE_ALLOCATION_DUPLICATE, status: 409, when: "the same rehab_line_item_id appears twice in one line_allocations array" }
  - { error_id: ERR_EXTENSION_LIMIT_REACHED, status: 409, when: "the loan already has MAX_EXTENSIONS extensions" }
  - { error_id: ERR_REVISION_LIMIT_REACHED, status: 409, when: "the scope line already has MAX_REVISION_ROUNDS revision rounds" }
  - { error_id: ERR_EXTENSION_BLOCKED_BY_EXIT_WATCH, status: 409, when: "the loan is on exit watch (stale unrepriced listing)" }
  - { error_id: ERR_PERCENT_COMPLETE_REGRESSION, status: 409, when: "a verified percent-complete implies a negative release against a scope line" }
  - { error_id: ERR_SCOPE_LINE_CAP_EXCEEDED, status: 409, when: "an approved cost exceeds the proposed cost or the 50% single-line concentration cap" }
  - { error_id: ERR_SIZING_REQUIRED, status: 409, when: "a decision is attempted on an application that was never sized" }
  - { error_id: ERR_SIZING_STALE, status: 409, when: "a decision is attempted while sizing_stale is true" }
  - { error_id: ERR_LOAN_AMOUNT_EXCEEDS_LIMIT, status: 409, when: "the approved amount exceeds max_total_loan_cents" }
  - { error_id: ERR_PAYMENT_EXCEEDS_BALANCE, status: 409, when: "a REGULAR payment exceeds fees + unpaid interest + principal" }
  - { error_id: ERR_PAYOFF_SHORT, status: 409, when: "a PAYOFF payment is below the payoff quote for that date" }
  - { error_id: ERR_COMPLETION_BUDGET_EXCEEDS_CAP, status: 409, when: "the completion budget exceeds 20% of ARV" }
  - { error_id: ERR_COMPLETION_SPEND_EXCEEDS_BUDGET, status: 409, when: "the disposition reports a completion spend above the funded budget" }
  - { error_id: ERR_DEFAULT_PRECONDITION_NOT_MET, status: 409, when: "neither the 10-day delinquency aging test nor the maturity-breach test is satisfied" }

# =============================================================================
# §1.7 RBAC (7 roles; role_model: segregation_of_duties)
# `identity:` states how a request's X-User-ID is resolved.
# =============================================================================
rbac:
  - role: Borrower
    identity: entity_backed:Borrower
    ownership_rule: "X-User-ID must equal the Borrower.id being read, or the borrower_id of the application / loan / draw request / scope line / exit milestone being touched; otherwise ERR_NOT_OWNER"
    exclusive_operations:
      - "POST /lending/loans/{id}/draw-requests"
    shared_operations:
      - "POST /lending/borrowers/{id}/guarantee"
      - "POST /lending/applications/{id}/rehab-line-items"
      - "PATCH /lending/rehab-line-items/{id}"
      - "POST /lending/loans/{id}/payments"
      - "POST /lending/loans/{id}/exit-milestones"
      - "every GET on its own borrower, applications, scope lines, loans, draws, allocations, waivers, ledger, accruals and milestones"
    forbidden_operations:
      - "any scope-line review, sizing, decision, closing, draw review, draw funding, extension, default declaration or foreclosure action"
      - "POST /lending/draw-requests/{id}/photo-verification (the servicer, not the borrower, records verified percentages)"

  - role: Contractor
    identity: entity_backed:Contractor
    ownership_rule: "X-User-ID must equal the Contractor.id being read or the contractor_id on the LienWaiver being filed; otherwise ERR_NOT_OWNER"
    exclusive_operations: []
    shared_operations:
      - "POST /lending/lien-waivers"
      - "GET /lending/contractors/{id}"
      - "GET /lending/contractors/{id}/rehab-line-items"
      - "GET /lending/contractors/{id}/lien-waivers"
      - "GET /lending/applications/{id}/rehab-line-items"
      - "GET /lending/rehab-line-items/{id}"
    forbidden_operations:
      - "POST /lending/lien-waivers/{id}/dispute (only the servicer may flag or clear a dispute)"
      - "every draw, loan-servicing and underwriting operation"

  - role: LoanOfficer
    identity: opaque
    ownership_rule: "no ownership scoping; X-User-ID is recorded for the segregation-of-duties pair with the credit decision"
    exclusive_operations:
      - "POST /lending/borrowers"
      - "POST /lending/properties"
      - "PATCH /lending/properties/{id}/valuation"
      - "POST /lending/applications"
      - "POST /lending/contractors"
      - "POST /lending/rehab-line-items/{id}/review"
      - "POST /lending/applications/{id}/size"
    shared_operations:
      - "POST /lending/applications/{id}/rehab-line-items"
      - "PATCH /lending/rehab-line-items/{id}"
      - "read access across borrowers, properties, applications, scope lines, contractors, loans, draws, waivers, ledger and milestones"
    forbidden_operations:
      - "POST /lending/applications/{id}/decision"
      - "POST /lending/applications/{id}/close"
      - "every draw verification, review, funding and servicing operation"

  - role: CreditCommittee
    identity: opaque
    ownership_rule: "no ownership scoping; X-User-ID is recorded and must differ from the user id that sized the application"
    exclusive_operations:
      - "POST /lending/borrowers/{id}/status"
      - "POST /lending/applications/{id}/decision"
    shared_operations:
      - "GET /lending/borrowers/{id}"
      - "GET /lending/applications/{id}"
      - "GET /lending/applications"
      - "GET /lending/applications/{id}/rehab-line-items"
      - "GET /lending/loans/{id}"
      - "GET /lending/loans"
      - "GET /lending/rehab-line-items/{id}"
    forbidden_operations:
      - "POST /lending/applications/{id}/size"
      - "POST /lending/applications/{id}/close"
      - "every draw and servicing operation"

  - role: LoanServicer
    identity: opaque
    ownership_rule: "no ownership scoping; X-User-ID is recorded on draw review and funding and the two must differ"
    exclusive_operations:
      - "POST /lending/applications/{id}/close"
      - "POST /lending/draw-requests/{id}/inspection-visits"
      - "POST /lending/draw-requests/{id}/photo-verification"
      - "POST /lending/draw-requests/{id}/review"
      - "POST /lending/draw-requests/{id}/fund"
      - "POST /lending/lien-waivers/{id}/dispute"
      - "POST /lending/loans/{id}/interest-accruals"
      - "POST /lending/loans/{id}/extensions"
      - "POST /lending/loans/{id}/default-declaration"
      - "POST /lending/loans/{id}/foreclosure-cases"
      - "POST /lending/foreclosure-cases/{id}/takeover"
      - "POST /lending/foreclosure-cases/{id}/completion-budget"
      - "POST /lending/foreclosure-cases/{id}/disposition"
    shared_operations:
      - "POST /lending/lien-waivers"
      - "POST /lending/loans/{id}/payments"
      - "POST /lending/loans/{id}/exit-milestones"
      - "read access across every servicing entity"
    forbidden_operations:
      - "POST /lending/borrowers, POST /lending/properties, POST /lending/applications, POST /lending/contractors"
      - "POST /lending/rehab-line-items/{id}/review, POST /lending/applications/{id}/size, POST /lending/applications/{id}/decision"
      - "POST /lending/loans/{id}/draw-requests (only the borrower submits a draw)"

  - role: DrawInspector
    identity: opaque
    ownership_rule: "X-User-ID must equal the InspectionVisit.inspector_id the visit was assigned to; otherwise ERR_NOT_ASSIGNED_INSPECTOR"
    exclusive_operations:
      - "POST /lending/inspection-visits/{id}/report"
    shared_operations:
      - "GET /lending/draw-requests"
      - "GET /lending/draw-requests/{id}"
      - "GET /lending/draw-requests/{id}/inspection-visits"
      - "GET /lending/draw-line-items"
      - "GET /lending/draw-line-items/{id}"
      - "GET /lending/properties/{id}"
    forbidden_operations:
      - "POST /lending/draw-requests/{id}/review and /fund — an inspector verifies but never approves or disburses"
      - "every underwriting and servicing operation"

  - role: PlatformAdmin
    identity: opaque
    ownership_rule: "no ownership scoping; ownership checks are bypassed but every segregation-of-duties, state and fiscal rule still applies"
    exclusive_operations:
      - "POST /_clock/set_current_utc"
    shared_operations:
      - "every business endpoint in §1.5"
    forbidden_operations:
      - "nothing endpoint-wise; PlatformAdmin cannot, however, evade ERR_SEGREGATION_OF_DUTIES, any §1.2 state rule, or any §1.4 fiscal rule"
