  # =========================================================================
  - section: complexity_layers
    instances:
      - name: order_create_rejects_a_stale_consumer_version_and_accepts_the_refreshed_one
        claim_type: optimistic_concurrency
        grounds:
          - concurrency_rules.order-create-stale-consumer
          - errors[ERR_STALE_VERSION]
          - endpoints.POST_/dtc/orders
          - entities.Consumer.fields.version
          - complexity_profile.complexity_layers.optimistic_concurrency
        distinguishing_aspect: |
          §1.2.1's first rule guards POST /dtc/orders on expected_consumer_version. What makes it a real OCC
          test rather than a disguised precondition is that the refused body is perfectly lawful: replaying the
          identical payload after one GET succeeds. Two different writes advance the guarded version here — the
          order create itself and the clearance cascade of a later screen — so the same captured value goes stale
          twice, for two unrelated reasons, and the version sequence 2 -> 3 -> 4 -> 5 -> 6 is asserted step by
          step so no write is allowed to bump by 2 or by 0.
        test_recipe:
          setup:
            - "Estate 1 holds an ACTIVE TX permit and an APPROVED GSO enrollment. Clock 2026-08-01."
            - "Consumer Ada was created (version 1) and ID-verified (version 2); ${c_v1} holds 2."
