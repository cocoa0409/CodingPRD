  - section: rbac
    instances:
      - name: coordinator_cross_school_denial_and_positive_scope
        claim_type: role_scope
        grounds:
          - roles[SchoolCoordinator]
          - errors[ERR_RESOURCE_OWNERSHIP_VIOLATION]
        distinguishing_aspect: "A coordinator's school scope is enforced by their staff record: coordinator of S1 can register staff into S1 but cannot report an absence for a teacher of S2 (ERR_RESOURCE_OWNERSHIP_VIOLATION), while the same call by S2's own coordinator succeeds."
        test_recipe:
          setup: ["Schools S1 and S2; coordinators C1 (S1) and C2 (S2); teacher T2 at S2"]
          setup_api_calls:
            - { call: "POST /districts", payload: { name: "D1" }, as: DistrictAdmin, captures: { dist: $.data.id } }
            - { call: "POST /schools", payload: { district_id: "${dist}", name: "S1", coverage_budget_total_cents: 1000000 }, as: DistrictAdmin, captures: { sch1: $.data.id } }
            - { call: "POST /schools", payload: { district_id: "${dist}", name: "S2", coverage_budget_total_cents: 1000000 }, as: DistrictAdmin, captures: { sch2: $.data.id } }
            - { call: "POST /staff-members", payload: { school_id: "${sch1}", full_name: "Coord One", subject: "ADMIN", grade_band: "HIGH", is_coordinator: true }, as: DistrictAdmin, captures: { c1: $.data.id } }
            - { call: "POST /staff-members", payload: { school_id: "${sch2}", full_name: "Coord Two", subject: "ADMIN", grade_band: "HIGH", is_coordinator: true }, as: DistrictAdmin, captures: { c2: $.data.id } }
            - { call: "POST /staff-members", payload: { school_id: "${sch2}", full_name: "Teach Two", subject: "MATH", grade_band: "HIGH" }, as: DistrictAdmin, captures: { t2: $.data.id } }
            - { call: "POST /_clock/set_current_utc", payload: { to_iso8601: "2026-07-29T00:00:00Z" }, as: DistrictAdmin }
          trigger:
            - { call: "POST /absences", payload: { staff_member_id: "${t2}", start_date: "2026-08-03", end_date: "2026-08-03", absence_type: "SICK", required_subject: "MATH", required_grade_band: "HIGH" }, as: SchoolCoordinator, as_user_id: "${c1}", captures: { err: $.data.error_id } }
            - { call: "POST /absences", payload: { staff_member_id: "${t2}", start_date: "2026-08-03", end_date: "2026-08-03", absence_type: "SICK", required_subject: "MATH", required_grade_band: "HIGH" }, as: SchoolCoordinator, as_user_id: "${c2}", captures: { abs2: $.data.id } }
          assert:
            - "C1 (wrong school) reporting T2's absence: error_id == ERR_RESOURCE_OWNERSHIP_VIOLATION (403)"
            - "C2 (own school) succeeds: absence ${abs2} created REPORTED"

  - section: cross_cutting_layers
    instances:
      - name: occ_claim_stale_version_rejected
        claim_type: occ_stale_version
        grounds:
          - concurrency_rules[absence-claim-stale-version]
          - errors[ERR_STALE_VERSION]
        distinguishing_aspect: "Self-claim with the version observed before another claim succeeded is rejected 412 ERR_STALE_VERSION: claim 1 fills the absence and bumps its version; claim 2 replays the stale expected_absence_version."
        test_recipe:
          setup: ["1-day MATH absence Mon 2026-08-03; subs A and B both ACTIVE qualified; batch dispatched the absence (DISPATCHING, offer to A outstanding); B reads the absence version"]
          setup_api_calls:
            - { call: "POST /districts", payload: { name: "D1" }, as: DistrictAdmin, captures: { dist: $.data.id } }
            - { call: "POST /schools", payload: { district_id: "${dist}", name: "S1", coverage_budget_total_cents: 1000000 }, as: DistrictAdmin, captures: { sch: $.data.id } }
            - { call: "POST /staff-members", payload: { school_id: "${sch}", full_name: "Teach One", subject: "MATH", grade_band: "HIGH" }, as: DistrictAdmin, captures: { t1: $.data.id } }
            - { call: "POST /substitutes", payload: { full_name: "Sub A", base_daily_rate_cents: 20000 }, as: DistrictAdmin, captures: { subA: $.data.id } }
            - { call: "POST /qualifications", payload: { substitute_id: "${subA}", subject: "MATH", grade_band: "HIGH" }, as: DistrictAdmin }
            - { call: "POST /clearances", payload: { substitute_id: "${subA}", clearance_type: "BACKGROUND_CHECK", expires_on: "2027-12-31" }, as: DistrictAdmin, captures: { clrA1: $.data.id } }
            - { call: "POST /clearances/${clrA1}/verify", payload: {}, as: DistrictAdmin }
            - { call: "POST /clearances", payload: { substitute_id: "${subA}", clearance_type: "TEACHING_CREDENTIAL", expires_on: "2027-12-31" }, as: DistrictAdmin, captures: { clrA2: $.data.id } }
            - { call: "POST /clearances/${clrA2}/verify", payload: {}, as: DistrictAdmin }
            - { call: "POST /substitutes/${subA}/activate", payload: {}, as: DistrictAdmin }
            - { call: "POST /substitutes", payload: { full_name: "Sub B", base_daily_rate_cents: 18000 }, as: DistrictAdmin, captures: { subB: $.data.id } }
            - { call: "POST /qualifications", payload: { substitute_id: "${subB}", subject: "MATH", grade_band: "HIGH" }, as: DistrictAdmin }
            - { call: "POST /clearances", payload: { substitute_id: "${subB}", clearance_type: "BACKGROUND_CHECK", expires_on: "2027-12-31" }, as: DistrictAdmin, captures: { clrB1: $.data.id } }
            - { call: "POST /clearances/${clrB1}/verify", payload: {}, as: DistrictAdmin }
            - { call: "POST /clearances", payload: { substitute_id: "${subB}", clearance_type: "TEACHING_CREDENTIAL", expires_on: "2027-12-31" }, as: DistrictAdmin, captures: { clrB2: $.data.id } }
            - { call: "POST /clearances/${clrB2}/verify", payload: {}, as: DistrictAdmin }
            - { call: "POST /substitutes/${subB}/activate", payload: {}, as: DistrictAdmin }
            - { call: "POST /_clock/set_current_utc", payload: { to_iso8601: "2026-07-29T00:00:00Z" }, as: DistrictAdmin }
            - { call: "POST /absences", payload: { staff_member_id: "${t1}", start_date: "2026-08-03", end_date: "2026-08-03", absence_type: "SICK", required_subject: "MATH", required_grade_band: "HIGH" }, as: Teacher, as_user_id: "${t1}", captures: { abs1: $.data.id } }
            - { call: "POST /dispatch-batches", payload: { district_id: "${dist}", run_for_date: "2026-07-29" }, as: DistrictAdmin }
            - { call: "GET /absences/${abs1}", payload: {}, as: DistrictAdmin, captures: { av: $.data.version } }
          trigger:
            - { call: "POST /absences/${abs1}/claim", payload: { expected_absence_version: "${av}" }, as: Substitute, as_user_id: "${subB}", captures: { asg_claim: $.data.id, claim_status: $.data.status } }
            - { call: "POST /absences/${abs1}/claim", payload: { expected_absence_version: "${av}" }, as: Substitute, as_user_id: "${subA}", captures: { err: $.data.error_id } }
          assert:
            - "First claim (B) succeeds: Assignment created with status == ACCEPTED and offer_source == SELF_CLAIM; absence version advanced beyond ${av}"
            - "Second claim (A) with the same stale expected_absence_version: http 412 error_id == ERR_STALE_VERSION (checked at priority 7, before the state layer)"
            - "Absence.${abs1}.fill_status == ASSIGNED exactly once — only one claim took effect"

      - name: occ_absence_edit_stale_version_rejected
        claim_type: occ_stale_version
        grounds:
          - concurrency_rules[absence-edit-stale-version]
          - errors[ERR_STALE_VERSION]
        distinguishing_aspect: "Two sequential well-formed edits to the same REPORTED absence: the first succeeds and bumps version; the second, replaying the pre-edit version, fails 412 ERR_STALE_VERSION even though its payload is valid."
        test_recipe:
          setup: ["Teacher T1; 1-day absence REPORTED; coordinator holds version 1"]
          setup_api_calls:
            - { call: "POST /districts", payload: { name: "D1" }, as: DistrictAdmin, captures: { dist: $.data.id } }
            - { call: "POST /schools", payload: { district_id: "${dist}", name: "S1", coverage_budget_total_cents: 1000000 }, as: DistrictAdmin, captures: { sch: $.data.id } }
            - { call: "POST /staff-members", payload: { school_id: "${sch}", full_name: "Teach One", subject: "MATH", grade_band: "HIGH" }, as: DistrictAdmin, captures: { t1: $.data.id } }
            - { call: "POST /staff-members", payload: { school_id: "${sch}", full_name: "Coord One", subject: "ADMIN", grade_band: "HIGH", is_coordinator: true }, as: DistrictAdmin, captures: { coord: $.data.id } }
            - { call: "POST /_clock/set_current_utc", payload: { to_iso8601: "2026-07-29T00:00:00Z" }, as: DistrictAdmin }
            - { call: "POST /absences", payload: { staff_member_id: "${t1}", start_date: "2026-08-03", end_date: "2026-08-03", absence_type: "SICK", required_subject: "MATH", required_grade_band: "HIGH" }, as: Teacher, as_user_id: "${t1}", captures: { abs1: $.data.id, av: $.data.version } }
          trigger:
            - { call: "PUT /absences/${abs1}", payload: { expected_absence_version: "${av}", end_date: "2026-08-04" }, as: SchoolCoordinator, as_user_id: "${coord}", captures: { td: $.data.total_days, v2: $.data.version } }
            - { call: "PUT /absences/${abs1}", payload: { expected_absence_version: "${av}", end_date: "2026-08-05" }, as: SchoolCoordinator, as_user_id: "${coord}", captures: { err: $.data.error_id } }
          assert:
            - "First edit: total_days == 2 and version == ${av} + 1"
            - "Second edit with stale version: http 412 error_id == ERR_STALE_VERSION; total_days remains 2"

      - name: occ_district_config_stale_version_rejected
        claim_type: occ_stale_version
        grounds:
          - concurrency_rules[district-config-stale-version]
          - errors[ERR_STALE_VERSION]
        distinguishing_aspect: "District config updates are OCC-guarded: after one admin changes short_notice_premium_pct (version 1 -> 2), a second update replaying expected_district_version 1 fails 412."
        test_recipe:
          setup: ["District created at version 1"]
          setup_api_calls:
            - { call: "POST /districts", payload: { name: "D1" }, as: DistrictAdmin, captures: { dist: $.data.id, dv: $.data.version } }
          trigger:
            - { call: "PUT /districts/${dist}", payload: { expected_district_version: "${dv}", short_notice_premium_pct: 0.30 }, as: DistrictAdmin, captures: { pct: $.data.short_notice_premium_pct, v2: $.data.version } }
            - { call: "PUT /districts/${dist}", payload: { expected_district_version: "${dv}", moderate_notice_premium_pct: 0.15 }, as: DistrictAdmin, captures: { err: $.data.error_id } }
          assert:
            - "First update: short_notice_premium_pct == 0.3 and version advanced by 1"
            - "Second update with stale version: http 412 error_id == ERR_STALE_VERSION; moderate_notice_premium_pct remains 0.1"

  - section: consistency_model
    instances:
      - name: immediate_read_after_write_consistency
        claim_type: immediate_visibility
        grounds:
          - complexity_profile.consistency_model
        distinguishing_aspect: "Immediate consistency: every field written or computed by POST /absences is observable in the very next GET, including computed total_days and the derived approval_status."
        test_recipe:
          setup: ["Teacher T1; clock 2026-07-29"]
          setup_api_calls:
            - { call: "POST /districts", payload: { name: "D1" }, as: DistrictAdmin, captures: { dist: $.data.id } }
            - { call: "POST /schools", payload: { district_id: "${dist}", name: "S1", coverage_budget_total_cents: 1000000 }, as: DistrictAdmin, captures: { sch: $.data.id } }
            - { call: "POST /staff-members", payload: { school_id: "${sch}", full_name: "Teach One", subject: "MATH", grade_band: "HIGH" }, as: DistrictAdmin, captures: { t1: $.data.id } }
            - { call: "POST /_clock/set_current_utc", payload: { to_iso8601: "2026-07-29T00:00:00Z" }, as: DistrictAdmin }
            - { call: "POST /absences", payload: { staff_member_id: "${t1}", start_date: "2026-08-03", end_date: "2026-08-07", absence_type: "JURY_DUTY", required_subject: "MATH", required_grade_band: "HIGH" }, as: Teacher, as_user_id: "${t1}", captures: { abs1: $.data.id } }
          trigger:
            - { call: "GET /absences/${abs1}", payload: {}, as: DistrictAdmin, captures: { fs: $.data.fill_status, td: $.data.total_days, ap: $.data.approval_status, du: $.data.days_uncovered, sid: $.data.school_id } }
          assert:
            - "GET returns fill_status == REPORTED, total_days == 5, approval_status == NOT_REQUIRED, days_uncovered == 5, school_id == ${sch} — all in the same request cycle as creation"

  - section: difficulty_covered_stubs
    instances:
      - name: premium_and_final_pay_correctness_covered
        claim_type: correct_result
        grounds: [calculations.premium_multiplier, calculations.final_payout]
        excluded_because:
          difficulty_instance: final_payout_per_day_rounding_order
          rationale: "Exact payout arithmetic (124524), rounding order, and conversion day rates are asserted there; premium cap arithmetic is asserted in premium_multiplier_nested_cap_and_tiers."
      - name: fill_rate_variant_values_covered
        claim_type: variant_divergence
        grounds: [calculations.fill_rate_analytics]
        excluded_because:
          difficulty_instance: fill_rate_sub_only_vs_any_coverage
          rationale: "Both variants' row values (1.0 / 0.0 / null) asserted there and in fill_rate_zero_denominator_returns_null."
      - name: overlap_and_capacity_error_paths_covered
        claim_type: violation_to_error
        grounds: ["errors[ERR_ASSIGNMENT_DATE_OVERLAP]", "errors[ERR_COVERAGE_CAPACITY_EXCEEDED]"]
        excluded_because:
          difficulty_instance: internal_coverage_aggregate_capacity_semantics
          rationale: "Both temporal-overlap error ids are asserted as triggers in the two §1.8 resource_temporal_overlap instances."
      - name: payroll_waterfall_success_path_covered
        claim_type: side_effect_execution
        grounds: [calculations.payroll_waterfall]
        excluded_because:
          difficulty_instance: payroll_waterfall_cap_evaluation_order
          rationale: "Export success path with PAID/EXPORTED/CLOSED transitions and exact totals asserted there; failure path in payroll_export_gated_by_timesheet_states and payroll_export_empty_period_and_double_export_lockout."
