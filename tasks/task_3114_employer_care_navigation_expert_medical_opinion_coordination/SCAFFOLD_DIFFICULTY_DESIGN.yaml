              payload: { full_name: "Jonas Weber", date_of_birth: "1970-02-14", relationship: "SELF", external_member_ref: "E-700", deductible_limit_cents: 100000, oop_max_cents: 500000 }
              as: PlatformAdmin
              captures: { m_id: $.data.id }
            - call: "POST /care/members/${m_id}/consents"
              payload: { scope: "RECORD_RETRIEVAL", expires_at: "2027-09-01T00:00:00Z" }
              as: Member
              as_user_id: "${m_id}"
              captures: { cons_id: $.data.id }
            - call: "POST /care/members/${m_id}/consents"
              payload: { scope: "EMO_REVIEW", expires_at: "2027-09-01T00:00:00Z" }
              as: Member
              as_user_id: "${m_id}"
            - call: "POST /care/members/${m_id}/navigation-cases"
              payload: { question_type: "CLINICAL", acuity: "MEDIUM" }
              as: Member
              as_user_id: "${m_id}"
              captures: { nc_id: $.data.id }
            - call: "POST /care/navigation-cases/${nc_id}/start"
              payload: {}
              as: NurseNavigator
              as_user_id: "nn-1"
            - call: "POST /care/providers"
              payload: { name: "Spine Center A", specialty: "NEUROSURGERY", network_status: "IN_NETWORK" }
              as: PlatformAdmin
              captures: { p1: $.data.id }
            - call: "POST /care/providers"
              payload: { name: "Spine Center B", specialty: "NEUROSURGERY", network_status: "IN_NETWORK" }
              as: PlatformAdmin
              captures: { p2: $.data.id }
            - call: "POST /care/members/${m_id}/record-requests"
              payload: { provider_id: "${p1}" }
              as: RecordsSpecialist
              as_user_id: "rs-1"
              captures: { rr1: $.data.id }
            - call: "POST /care/members/${m_id}/record-requests"
              payload: { provider_id: "${p2}" }
              as: RecordsSpecialist
              as_user_id: "rs-1"
              captures: { rr2: $.data.id }
            - call: "POST /care/record-requests/${rr1}/receive"
              payload: { record_pages: 30 }
              as: RecordsSpecialist
              as_user_id: "rs-1"
            - call: "POST /care/members/${m_id}/expert-opinions"
              payload: { condition_summary: "Disc herniation review", navigation_case_id: "${nc_id}" }
              as: Member
              as_user_id: "${m_id}"
              captures: { emo_id: $.data.id }
            - call: "POST /care/expert-opinions/${emo_id}/attach-records"
              payload: { record_request_id: "${rr1}" }
              as: RecordsSpecialist
              as_user_id: "rs-1"
          trigger:
            - call: "POST /care/consents/${cons_id}/revoke"
              payload: {}
              as: Member
              as_user_id: "${m_id}"
          assert:
            - "ConsentGrant.${cons_id}.status == REVOKED and revoked_at == 2026-09-01T00:00:00Z"
            - "RecordRequest.${rr2}.status == CANCELLED (link 1: revocation cancels pending requests)"
            - "RecordRequest.${rr1}.status == RECEIVED unchanged (terminal requests are not cancelled)"
            - "ExpertOpinionCase.${emo_id}.status == RECORDS_BLOCKED (link 2: attached_received_count 1 < 3 and zero REQUESTED remain)"
            - "NavigationCase.${nc_id}.status == ESCALATED (link 3: blocked opinion escalates the origin case)"
            - "NavigationCase.${nc_id}.escalation_count == 1 and assigned_user_id is null"

