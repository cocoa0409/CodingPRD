# =============================================================================
# SCAFFOLD — Seized Asset Custody, Valuation & Disposition (USMS-style)
# §1.0–§1.7 seed tables. Difficulty index lives in SCAFFOLD_DIFFICULTY_DESIGN.yaml;
# corner coverage index lives in SCAFFOLD_CORNER_DESIGN.yaml.
# =============================================================================

scenario: |
  Seized Asset Custody, Valuation & Disposition (United States Marshals Service):
  asset seizure intake with custody transfer, valuation and determination of
  whether an asset should be retained or immediately sold, maintenance of complex
  assets including real property, businesses and vehicles during forfeiture
  proceedings with cost management, interlocutory sale requests when holding
  costs exceed value with court approval, lien and third-party interest research
  including innocent owner claims and mortgage positions, disposition through
  auction and contracted sellers with proceeds accounting to a forfeiture fund,
  equitable sharing distributions to participating state and local agencies with
  usage restrictions, return of property when forfeiture fails with condition and
  depreciation disputes

domain_name: seized-asset-custody-disposition
api_prefix: /custody

complexity_profile:
  primary_archetype: compliance_audit
  secondary_archetype: ledger_reconciliation
  complexity_layers:
    - optimistic_concurrency
    - cascading_side_effects
    - dual_variant_calculation
    - rate_threshold_triggers
  entity_topology: flat          # all collections top-level under /custody; FK links in bodies; reverse reads via sub-resource GETs
  state_machine_shape: parallel  # Asset carries two independent state dimensions (custody_state x legal_state); TPI adds a cyclic appeal loop
  relationship_patterns:
    - one_to_many                # SeizureCase -> Asset -> children
    - cross_aggregate            # SaleEvent settlement debits/credits the SeizureCase proceeds pool; Distribution debits it again
  role_model: segregation_of_duties
  consistency_model: immediate

# =============================================================================
# §1.0 Response Envelope (FIXED — verbatim)
# =============================================================================
response_envelope:
  success: |
    { "meta": { "api_request_id": "req_xxx", "api_request_timestamp": "ISO8601" },
      "response_type": "object" | "array", "data": {} }
  error: |
    { "meta": { ... }, "response_type": "error",
      "data": { "error_id": "ERR_XXX", "message": "..." } }
  pagination_fields: ["limit", "offset", "total_count", "has_more"]
  pagination_defaults: { limit: 10, min: 1, max: 100, offset: 0 }

# =============================================================================
# §1.1 Entity-Relationship Table
# =============================================================================
entities:
  - name: SeizureCase
    parent: null
    common_fields: true
    fields:
      - { name: case_number, type: string, source: input, description: "Government case number; unique across all cases", constraints: "unique; non-empty" }
      - { name: judicial_district, type: string, source: input, description: "Federal judicial district code, e.g. 'S.D.N.Y.'" }
      - { name: forfeiture_type, type: enum, source: input, description: "CIVIL | CRIMINAL | ADMINISTRATIVE" }
      - { name: lead_agency_code, type: string, source: input, description: "Seizing agency identifier" }
      - { name: status, type: enum, source: system, description: "OPEN | FORFEITURE_PENDING | FORFEITED | DISMISSED" }
      - { name: forfeited_at, type: datetime, source: system, default: null, description: "Logical-clock timestamp when the forfeiture order was recorded; null until FORFEITED" }
      - { name: gross_proceeds_cents, type: integer, source: computed, default: 0, description: "Sum of winning_bid_cents over this case's SETTLED sale events" }
      - { name: auction_fees_cents, type: integer, source: computed, default: 0, description: "Sum of auction_fee_cents over this case's SETTLED sale events" }
      - { name: lien_payments_cents, type: integer, source: computed, default: 0, description: "Sum of LIEN_PAYMENT distribution amounts created by settlement waterfalls" }
      - { name: cost_reimbursements_cents, type: integer, source: computed, default: 0, description: "Sum of COST_REIMBURSEMENT distribution amounts created by settlement waterfalls" }
      - { name: sharing_pool_gross_basis_cents, type: integer, source: computed, default: 0, description: "Sum over SETTLED sale events of (gross_proceeds_cents - auction_fee_cents); ignores lien and cost carve-outs (estimate variant)" }
      - { name: sharing_pool_net_basis_cents, type: integer, source: computed, default: 0, description: "Sum over SETTLED sale events of waterfall remainder after VERIFIED lien payments and cost reimbursement (canonical sharing basis)" }
      - { name: equitable_shares_paid_cents, type: integer, source: computed, default: 0, description: "Sum of amount_cents over this case's EQUITABLE_SHARE distributions in status PAID" }
      - { name: available_proceeds_cents, type: integer, source: computed, default: 0, description: "= sharing_pool_net_basis_cents - equitable_shares_paid_cents; PENDING distributions do not debit" }

  - name: Asset
    parent: null
    common_fields: true
    fields:
      - { name: seizure_case_id, type: string, source: input, description: "FK -> SeizureCase.id; owning forfeiture case" }
      - { name: asset_type, type: enum, source: input, description: "REAL_PROPERTY | BUSINESS | VEHICLE | VESSEL | AIRCRAFT | PERSONAL_PROPERTY | FINANCIAL_INSTRUMENT" }
      - { name: description, type: string, source: input, description: "Free-text asset description" }
      - { name: seized_on, type: datetime, source: input, description: "Logical timestamp of physical seizure; baseline for depreciation months-held" }
      - { name: seizure_condition_grade, type: enum, source: input, description: "EXCELLENT | GOOD | FAIR | POOR | SALVAGE; grade recorded at intake" }
      - { name: current_condition_grade, type: enum, source: system, description: "Latest observed grade; initialized to seizure_condition_grade, overwritten by each completed custody transfer's condition_on_arrival" }
      - { name: appraised_value_cents, type: integer, source: computed, default: null, description: "adjusted_value_cents of the latest ACCEPTED valuation; null until the first acceptance" }
      - { name: appraised_at, type: datetime, source: system, default: null, description: "Logical-clock timestamp of the latest ACCEPTED valuation" }
      - { name: accumulated_net_holding_cost_cents, type: integer, source: computed, default: 0, description: "sum(POSTED COST entries) - sum(REVENUE_OFFSET entries) - sum(REVERSAL entries) for this asset" }
      - { name: custody_state, type: enum, source: system, description: "INTAKE | SECURED | IN_STORAGE | IN_MAINTENANCE | RELEASED_FOR_SALE | RELEASED_FOR_RETURN | TRANSFERRED_OUT — physical-custody dimension, independent of legal_state" }
      - { name: legal_state, type: enum, source: system, description: "SEIZED | VALUATION_PENDING | VALUED | DISPOSITION_REVIEW | RETAINED | SALE_AUTHORIZED | SOLD | RETURN_PENDING | RETURNED | DISPUTED | RESOLVED — forfeiture-track dimension, independent of custody_state" }
      - { name: retention_decision, type: enum, source: system, default: PENDING, description: "PENDING | RETAIN | SELL; reset to PENDING when a revaluation is ACCEPTED while legal_state == DISPOSITION_REVIEW" }
      - { name: provisional_net_retention_value_cents, type: integer, source: computed, default: null, description: "PROVISIONAL variant of retention_value_estimate; null until at least one valuation exists" }
      - { name: final_net_retention_value_cents, type: integer, source: computed, default: null, description: "FINAL variant of retention_value_estimate; null until the first ACCEPTED valuation" }
      - { name: returned_at, type: datetime, source: system, default: null, description: "Logical-clock timestamp of complete-return; baseline of the 30-day dispute window" }
      - { name: computed_depreciation_cents, type: integer, source: system, default: null, description: "System-computed depreciation recorded at complete-return" }
      - { name: dispute_claimed_depreciation_cents, type: integer, source: system, default: null, description: "Claimant-asserted depreciation recorded at dispute-return" }
      - { name: final_depreciation_cents, type: integer, source: system, default: null, description: "Adjudicated depreciation recorded at resolve-return-dispute" }

  - name: CustodyTransfer
    parent: null
    common_fields: true
    fields:
      - { name: asset_id, type: string, source: input, description: "FK -> Asset.id; asset being moved" }
      - { name: from_location_ref, type: string, source: input, description: "Origin facility/premises reference" }
      - { name: to_location_ref, type: string, source: input, description: "Destination facility/premises reference" }
      - { name: to_location_kind, type: enum, source: input, description: "STORAGE | MAINTENANCE_SHOP | CLAIMANT_PREMISES | OTHER; drives custody_state on completion" }
      - { name: window_start, type: datetime, source: input, description: "Custody window open (inclusive); must chain contiguously per custody_window_contiguity" }
      - { name: window_end, type: datetime, source: input, description: "Custody window close (exclusive); half-open [window_start, window_end)" }
      - { name: status, type: enum, source: system, description: "SCHEDULED | COMPLETED | CANCELLED" }
      - { name: condition_on_arrival, type: enum, source: system, default: null, description: "EXCELLENT | GOOD | FAIR | POOR | SALVAGE recorded at completion; becomes the asset's current_condition_grade" }

  - name: Valuation
    parent: null
    common_fields: true
    fields:
      - { name: asset_id, type: string, source: input, description: "FK -> Asset.id; asset being valued" }
      - { name: method, type: enum, source: input, description: "CERTIFIED_APPRAISAL | MARKET_COMPARABLE | BLUE_BOOK | INCOME_APPROACH" }
      - { name: raw_value_cents, type: integer, source: input, default: null, description: "Appraiser raw figure; required unless method == INCOME_APPROACH" }
      - { name: assessed_condition_grade, type: enum, source: input, default: null, description: "EXCELLENT | GOOD | FAIR | POOR | SALVAGE; required unless method == INCOME_APPROACH" }
      - { name: annual_net_revenues_cents, type: array, source: input, default: null, description: "Exactly 3 integers (oldest fiscal year first); required iff method == INCOME_APPROACH" }
      - { name: adjusted_value_cents, type: integer, source: computed, description: "Per condition_adjusted_valuation: raw x condition factor for non-INCOME_APPROACH; per-year rounded revenue capitalization for INCOME_APPROACH" }
      - { name: status, type: enum, source: system, description: "SUBMITTED | ACCEPTED | REJECTED" }
      - { name: submitted_by_user_id, type: string, source: system, description: "X-User-ID of the creating Appraiser" }

  - name: ExpenseEntry
    parent: null
    common_fields: true
    fields:
      - { name: asset_id, type: string, source: input, description: "FK -> Asset.id; asset the cost/offset accrues to" }
      - { name: entry_kind, type: enum, source: input, description: "COST | REVENUE_OFFSET | REVERSAL; REVERSAL subtracts amount from accumulated cost (compensating entry)" }
      - { name: expense_type, type: enum, source: input, description: "STORAGE | MAINTENANCE | MANAGEMENT_FEE | INSURANCE | SECURITY | UTILITIES; STORAGE_ACCRUAL is reserved for run-holding-review system postings" }
      - { name: amount_cents, type: integer, source: input, description: "Positive integer amount" }
      - { name: incurred_on, type: datetime, source: input, default: "logical clock now", description: "When the cost was incurred; defaults to the current logical clock time when omitted" }
      - { name: source, type: enum, source: system, default: MANUAL, description: "MANUAL | SYSTEM_ACCRUAL" }
      - { name: posted_by_user_id, type: string, source: system, description: "X-User-ID of the posting AssetCustodian; 'system' for SYSTEM_ACCRUAL entries" }

  - name: InterlocutorySaleRequest
    parent: null
    common_fields: true
    fields:
      - { name: asset_id, type: string, source: input, description: "FK -> Asset.id; asset proposed for pre-forfeiture sale" }
      - { name: justification, type: string, source: input, description: "Free-text justification citing holding-cost burden" }
      - { name: requested_by_user_id, type: string, source: system, description: "X-User-ID of the requesting AssetManager; segregation-of-duties anchor" }
      - { name: status, type: enum, source: system, description: "PENDING | APPROVED | DENIED" }
      - { name: adjudicated_by_user_id, type: string, source: system, default: null, description: "X-User-ID of the adjudicating CourtOfficial; must differ from requested_by_user_id" }
      - { name: accumulated_costs_snapshot_cents, type: integer, source: computed, description: "Asset.accumulated_net_holding_cost_cents at request time" }
      - { name: projected_burden_cents, type: integer, source: computed, description: "= accumulated_costs_snapshot_cents + ISR_PROJECTION_MONTHS x MONTHLY_CARRYING_COST_CENTS[asset_type] at request time" }
      - { name: appraised_value_snapshot_cents, type: integer, source: computed, description: "Asset.appraised_value_cents at request time" }

  - name: ThirdPartyInterest
    parent: null
    common_fields: true
    fields:
      - { name: asset_id, type: string, source: input, description: "FK -> Asset.id; asset the lien or claim attaches to" }
      - { name: kind, type: enum, source: input, description: "LIEN_MORTGAGE | LIEN_TAX | LIEN_JUDGMENT | LIEN_MECHANIC | INNOCENT_OWNER" }
      - { name: petitioner_ref, type: string, source: input, description: "Claimant identity reference; must equal the Claimant caller's X-User-ID" }
      - { name: lienholder_name, type: string, source: input, default: null, description: "Required for LIEN_* kinds; must be null for INNOCENT_OWNER" }
      - { name: amount_cents, type: integer, source: input, default: null, description: "Claimed secured amount; required for LIEN_* kinds; must be null for INNOCENT_OWNER" }
      - { name: priority_position, type: integer, source: input, default: null, description: "Payment priority (1 = first paid); required for LIEN_* kinds; must be null for INNOCENT_OWNER" }
      - { name: status, type: enum, source: system, description: "FILED | VERIFIED | GRANTED | DENIED | APPEALED | SATISFIED" }
      - { name: appeal_count, type: integer, source: system, default: 0, description: "Number of appeals filed; capped at APPEAL_LIMIT" }
      - { name: satisfied_amount_cents, type: integer, source: system, default: null, description: "Amount actually paid by the settlement waterfall; set when status becomes SATISFIED" }
      - { name: adjudicated_by_user_id, type: string, source: system, default: null, description: "X-User-ID of the adjudicating CourtOfficial" }

  - name: SaleEvent
    parent: null
    common_fields: true
    fields:
      - { name: asset_id, type: string, source: input, description: "FK -> Asset.id; asset offered for sale" }
      - { name: sale_method, type: enum, source: input, description: "PUBLIC_AUCTION | CONTRACTED_SELLER" }
      - { name: auctioneer_ref, type: string, source: input, description: "Auction house or contracted-seller reference; auction slots are per auctioneer" }
      - { name: slot_start, type: datetime, source: input, description: "Auction window open (inclusive); half-open [slot_start, slot_end)" }
      - { name: slot_end, type: datetime, source: input, description: "Auction window close (exclusive)" }
      - { name: reserve_price_cents, type: integer, source: input, description: "Minimum acceptable winning bid; must be <= Asset.appraised_value_cents at creation" }
      - { name: winning_bid_cents, type: integer, source: system, default: null, description: "Recorded at close" }
      - { name: gross_proceeds_cents, type: integer, source: computed, default: null, description: "= winning_bid_cents when a sale closes at or above reserve; 0 on NO_SALE" }
      - { name: auction_fee_cents, type: integer, source: computed, default: null, description: "Tiered marginal auction fee per auction_fee_schedule; computed at settle" }
      - { name: net_proceeds_cents, type: integer, source: computed, default: null, description: "= gross_proceeds_cents - auction_fee_cents; computed at settle" }
      - { name: status, type: enum, source: system, description: "OPEN_FOR_BIDS | CLOSED_PENDING_SETTLEMENT | SETTLED | NO_SALE | CANCELLED" }

  - name: Distribution
    parent: null
    common_fields: true
    fields:
      - { name: seizure_case_id, type: string, source: input, description: "FK -> SeizureCase.id; case whose proceeds pool funds this distribution" }
      - { name: distribution_kind, type: enum, source: system, description: "EQUITABLE_SHARE (manual) | LIEN_PAYMENT | COST_REIMBURSEMENT (both system-created by the settlement waterfall, directly in PAID status)" }
      - { name: payee_ref, type: string, source: input, description: "Agency code for EQUITABLE_SHARE; lienholder name for LIEN_PAYMENT; 'CASE_COST_REIMBURSEMENT' for cost reimbursements" }
      - { name: amount_cents, type: integer, source: input, description: "Distribution amount; EQUITABLE_SHARE must be >= EQUITABLE_SHARE_MIN_CENTS and <= SeizureCase.available_proceeds_cents" }
      - { name: usage_restriction, type: enum, source: input, default: null, description: "OVERTIME | TRAINING | EQUIPMENT | COMMUNITY_PROGRAM; required for EQUITABLE_SHARE, null otherwise" }
      - { name: status, type: enum, source: system, description: "PENDING | PAID | VOIDED" }
      - { name: created_by_user_id, type: string, source: system, description: "X-User-ID of the creating FundAdministrator; segregation-of-duties anchor" }
      - { name: approved_by_user_id, type: string, source: system, default: null, description: "X-User-ID of the approving FundAdministrator; must differ from created_by_user_id" }

# =============================================================================
# §1.2 State Machine Table
# =============================================================================
state_machines:
  - entity: SeizureCase
    initial_state: OPEN
    terminal_states: [FORFEITED, DISMISSED]
    transitions:
      - from: OPEN
        to: FORFEITURE_PENDING
        trigger: "POST /custody/cases/{id}/file-forfeiture"
        actor: CaseAgent
        preconditions: []
        side_effects: ["SeizureCase.version += 1"]
      - from: FORFEITURE_PENDING
        to: FORFEITED
        trigger: "POST /custody/cases/{id}/forfeit"
        actor: CourtOfficial
        preconditions: []
        side_effects:
          - "forfeited_at = logical clock now"
          - "SeizureCase.version += 1"
      - from: OPEN
        to: DISMISSED
        trigger: "POST /custody/cases/{id}/dismiss"
        actor: CourtOfficial
        preconditions:
          - "No Asset of this case has legal_state == SOLD (ERR_INVALID_STATE)"
        side_effects:
          - "CASCADE link 1: every Asset of this case with legal_state in {SEIZED, VALUATION_PENDING, VALUED, DISPOSITION_REVIEW, SALE_AUTHORIZED} -> RETURN_PENDING; RETAINED assets are unaffected"
          - "CASCADE link 2 (caused by link 1): every SaleEvent on a transitioned Asset with status in {OPEN_FOR_BIDS, CLOSED_PENDING_SETTLEMENT} -> CANCELLED"
          - "SeizureCase.version += 1"
      - from: FORFEITURE_PENDING
        to: DISMISSED
        trigger: "POST /custody/cases/{id}/dismiss"
        actor: CourtOfficial
        preconditions:
          - "No Asset of this case has legal_state == SOLD (ERR_INVALID_STATE)"
        side_effects:
          - "CASCADE link 1: every Asset of this case with legal_state in {SEIZED, VALUATION_PENDING, VALUED, DISPOSITION_REVIEW, SALE_AUTHORIZED} -> RETURN_PENDING; RETAINED assets are unaffected"
          - "CASCADE link 2 (caused by link 1): every SaleEvent on a transitioned Asset with status in {OPEN_FOR_BIDS, CLOSED_PENDING_SETTLEMENT} -> CANCELLED"
          - "SeizureCase.version += 1"

  - entity: Asset
    initial_state: "custody_state: INTAKE ; legal_state: SEIZED   (two independent dimensions evolving in lockstep-free fashion)"
    terminal_states: ["custody_state: TRANSFERRED_OUT ; legal_state: RETAINED | SOLD | RESOLVED"]
    transitions:
      # ---- legal dimension ----
      - from: "legal SEIZED"
        to: "legal VALUATION_PENDING"
        trigger: "system (automatic when the first Valuation for this asset is created)"
        actor: system
        preconditions: []
        side_effects: ["Asset.version += 1"]
      - from: "legal VALUATION_PENDING"
        to: "legal VALUED"
        trigger: "system (automatic when a Valuation is adjudicated ACCEPT and legal_state == VALUATION_PENDING)"
        actor: system
        preconditions: []
        side_effects:
          - "appraised_value_cents = accepted Valuation.adjusted_value_cents; appraised_at = logical clock now"
          - "recompute provisional_net_retention_value_cents and final_net_retention_value_cents per retention_value_estimate"
          - "Asset.version += 1"
      - from: "legal VALUED"
        to: "legal VALUED"
        trigger: "system (revaluation: Valuation adjudicated ACCEPT while legal_state == VALUED)"
        actor: system
        preconditions: []
        side_effects:
          - "appraised_value_cents = accepted Valuation.adjusted_value_cents; appraised_at = logical clock now"
          - "recompute both retention_value_estimate variants"
          - "Asset.version += 1"
      - from: "legal DISPOSITION_REVIEW"
        to: "legal VALUED"
        trigger: "system (revaluation invalidates the pending decision: Valuation adjudicated ACCEPT while legal_state == DISPOSITION_REVIEW)"
        actor: system
        preconditions: []
        side_effects:
          - "retention_decision -> PENDING"
          - "appraised_value_cents = accepted Valuation.adjusted_value_cents; appraised_at = logical clock now; recompute both variants"
          - "Asset.version += 1"
      - from: "legal VALUED"
        to: "legal RETAINED"
        trigger: "POST /custody/assets/{id}/decide-retention with decision=RETAIN"
        actor: AssetManager
        preconditions:
          - "final_net_retention_value_cents >= RETENTION_VALUE_FLOOR_CENTS (ERR_RETENTION_VALUE_TOO_LOW)"
          - "interlocutory eligibility test FALSE, pinned integer form: (accumulated_net_holding_cost_cents + ISR_PROJECTION_MONTHS x MONTHLY_CARRYING_COST_CENTS[asset_type]) * 100 < INTERLOCUTORY_RATIO_THRESHOLD_PCT * appraised_value_cents (ERR_RETENTION_BLOCKED_HOLDING_COST)"
        side_effects:
          - "retention_decision -> RETAIN"
          - "Asset.version += 1"
      - from: "legal VALUED"
        to: "legal DISPOSITION_REVIEW"
        trigger: "POST /custody/assets/{id}/decide-retention with decision=SELL"
        actor: AssetManager
        preconditions: []
        side_effects:
          - "retention_decision -> SELL"
          - "Asset.version += 1"
      - from: "legal DISPOSITION_REVIEW"
        to: "legal SALE_AUTHORIZED"
        trigger: "POST /custody/assets/{id}/authorize-sale"
        actor: AssetManager
        preconditions:
          - "SeizureCase.status == FORFEITED (ERR_CASE_NOT_FORFEITED)"
          - "retention_decision == SELL (ERR_INVALID_STATE)"
        side_effects:
          - "custody_state -> RELEASED_FOR_SALE"
          - "CASCADE: every CustodyTransfer of this asset with status == SCHEDULED -> CANCELLED"
          - "Asset.version += 1"
      - from: "legal VALUED"
        to: "legal SALE_AUTHORIZED"
        trigger: "system (interlocutory path: an InterlocutorySaleRequest for this asset is adjudicated APPROVE)"
        actor: system
        preconditions: []
        side_effects:
          - "CASCADE link 1 of isr_approval_cascade: legal_state -> SALE_AUTHORIZED; custody_state -> RELEASED_FOR_SALE; retention_decision -> SELL"
          - "CASCADE link 2 (caused by custody_state change): every CustodyTransfer of this asset with status == SCHEDULED -> CANCELLED"
          - "CASCADE link 3 (caused by legal_state change): asset excluded from the run-holding-review accrual sweep, whose input set requires legal_state in {SEIZED, VALUATION_PENDING, VALUED, DISPOSITION_REVIEW}"
          - "Asset.version += 1"
      - from: "legal DISPOSITION_REVIEW"
        to: "legal SALE_AUTHORIZED"
        trigger: "system (interlocutory path: an InterlocutorySaleRequest for this asset is adjudicated APPROVE)"
        actor: system
        preconditions: []
        side_effects:
          - "CASCADE link 1 of isr_approval_cascade: legal_state -> SALE_AUTHORIZED; custody_state -> RELEASED_FOR_SALE; retention_decision -> SELL"
          - "CASCADE link 2: every SCHEDULED CustodyTransfer of this asset -> CANCELLED"
          - "CASCADE link 3: asset excluded from the run-holding-review accrual sweep"
          - "Asset.version += 1"
      - from: "legal SALE_AUTHORIZED"
        to: "legal SOLD"
        trigger: "system (automatic when a SaleEvent for this asset is settled)"
        actor: system
        preconditions: []
        side_effects:
          - "custody_state -> TRANSFERRED_OUT"
          - "Asset.version += 1"
      # ---- return / dispute track (legal dimension) ----
      - from: "legal SEIZED | VALUATION_PENDING | VALUED | DISPOSITION_REVIEW | SALE_AUTHORIZED"
        to: "legal RETURN_PENDING"
        trigger: "system (cascade from SeizureCase dismiss, or from a ThirdPartyInterest INNOCENT_OWNER adjudicated GRANT)"
        actor: system
        preconditions: []
        side_effects:
          - "CASCADE (innocent_owner_grant_cascade link 1): legal_state -> RETURN_PENDING"
          - "CASCADE link 2 (caused by link 1): every SaleEvent of this asset with status in {OPEN_FOR_BIDS, CLOSED_PENDING_SETTLEMENT} -> CANCELLED"
          - "Asset.version += 1"
      - from: "custody any except TRANSFERRED_OUT"
        to: "custody RELEASED_FOR_RETURN"
        trigger: "POST /custody/assets/{id}/initiate-return"
        actor: AssetManager
        preconditions:
          - "legal_state == RETURN_PENDING (ERR_INVALID_STATE)"
        side_effects: ["Asset.version += 1"]
      - from: "custody RELEASED_FOR_RETURN"
        to: "custody TRANSFERRED_OUT"
        trigger: "system (automatic when a CustodyTransfer with to_location_kind == CLAIMANT_PREMISES completes)"
        actor: system
        preconditions: []
        side_effects: ["Asset.version += 1"]
      - from: "legal RETURN_PENDING"
        to: "legal RETURNED"
        trigger: "POST /custody/assets/{id}/complete-return"
        actor: AssetManager
        preconditions:
          - "custody_state == TRANSFERRED_OUT (ERR_INVALID_STATE) — physical handover via a completed CLAIMANT_PREMISES transfer must precede legal completion"
        side_effects:
          - "returned_at = logical clock now"
          - "computed_depreciation_cents per depreciation_on_return (0 when appraised_value_cents is null)"
          - "Asset.version += 1"
      - from: "legal RETURNED"
        to: "legal DISPUTED"
        trigger: "POST /custody/assets/{id}/dispute-return"
        actor: Claimant
        preconditions:
          - "logical clock now <= returned_at + DISPUTE_WINDOW_DAYS (ERR_DISPUTE_WINDOW_EXPIRED)"
        side_effects:
          - "dispute_claimed_depreciation_cents = request claimed_depreciation_cents"
          - "Asset.version += 1"
      - from: "legal DISPUTED"
        to: "legal RESOLVED"
        trigger: "POST /custody/assets/{id}/resolve-return-dispute"
        actor: CourtOfficial
        preconditions:
          - "final_depreciation_cents <= appraised_value_cents (ERR_DEPRECIATION_EXCEEDS_VALUE); when appraised_value_cents is null the check is final_depreciation_cents <= 0... pinned: null value means only final_depreciation_cents == 0 passes"
        side_effects:
          - "final_depreciation_cents recorded"
          - "Asset.version += 1"
      # ---- custody dimension ----
      - from: "custody INTAKE | SECURED | IN_STORAGE | IN_MAINTENANCE | RELEASED_FOR_SALE"
        to: "custody IN_STORAGE"
        trigger: "system (automatic when a CustodyTransfer with to_location_kind == STORAGE completes)"
        actor: system
        preconditions: []
        side_effects:
          - "current_condition_grade = transfer.condition_on_arrival"
          - "Asset.version += 1"
      - from: "custody INTAKE | SECURED | IN_STORAGE | IN_MAINTENANCE | RELEASED_FOR_SALE"
        to: "custody IN_MAINTENANCE"
        trigger: "system (automatic when a CustodyTransfer with to_location_kind == MAINTENANCE_SHOP completes)"
        actor: system
        preconditions: []
        side_effects:
          - "current_condition_grade = transfer.condition_on_arrival"
          - "Asset.version += 1"
        note: "IN_STORAGE -> IN_MAINTENANCE -> IN_STORAGE maintenance rounds form the custody cycle"
      - from: "custody INTAKE | SECURED | IN_STORAGE | IN_MAINTENANCE | RELEASED_FOR_SALE"
        to: "custody SECURED"
        trigger: "system (automatic when a CustodyTransfer with to_location_kind == OTHER completes)"
        actor: system
        preconditions: []
        side_effects:
          - "current_condition_grade = transfer.condition_on_arrival"
          - "Asset.version += 1"

  - entity: CustodyTransfer
    initial_state: SCHEDULED
    terminal_states: [COMPLETED, CANCELLED]
    transitions:
      - from: SCHEDULED
        to: COMPLETED
        trigger: "POST /custody/custody-transfers/{id}/complete"
        actor: AssetCustodian
        preconditions: []
        side_effects:
          - "condition_on_arrival recorded; Asset.current_condition_grade updated"
          - "Asset.custody_state mapped from to_location_kind: STORAGE->IN_STORAGE, MAINTENANCE_SHOP->IN_MAINTENANCE, OTHER->SECURED, CLAIMANT_PREMISES->TRANSFERRED_OUT"
          - "CustodyTransfer.version += 1"
      - from: SCHEDULED
        to: CANCELLED
        trigger: "system (cascade: asset custody_state -> RELEASED_FOR_SALE, via either sale authorization path)"
        actor: system
        preconditions: []
        side_effects: ["CustodyTransfer.version += 1"]

  - entity: Valuation
    initial_state: SUBMITTED
    terminal_states: [ACCEPTED, REJECTED]
    transitions:
      - from: SUBMITTED
        to: ACCEPTED
        trigger: "POST /custody/valuations/{id}/adjudicate with outcome=ACCEPT"
        actor: CourtOfficial
        preconditions: []
        side_effects:
          - "Asset.appraised_value_cents = adjusted_value_cents; Asset.appraised_at = logical clock now"
          - "Asset legal_state: VALUATION_PENDING -> VALUED; DISPOSITION_REVIEW -> VALUED with retention_decision -> PENDING; SEIZED unchanged (cannot happen: creation already advanced it)"
          - "recompute Asset provisional/final net retention values"
          - "Valuation.version += 1; Asset.version += 1"
      - from: SUBMITTED
        to: REJECTED
        trigger: "POST /custody/valuations/{id}/adjudicate with outcome=REJECT"
        actor: CourtOfficial
        preconditions: []
        side_effects: ["Valuation.version += 1"]

  - entity: ExpenseEntry
    initial_state: POSTED
    terminal_states: [POSTED]
    transitions: []
    note: "Append-only ledger. Compensation is a new REVERSAL ExpenseEntry, never an update; there is no update or delete endpoint."

  - entity: InterlocutorySaleRequest
    initial_state: PENDING
    terminal_states: [APPROVED, DENIED]
    transitions:
      - from: PENDING
        to: APPROVED
        trigger: "POST /custody/interlocutory-sale-requests/{id}/adjudicate with outcome=APPROVE"
        actor: CourtOfficial
        preconditions:
          - "adjudicating X-User-ID != requested_by_user_id (ERR_SOD_VIOLATION)"
        side_effects:
          - "adjudicated_by_user_id recorded"
          - "CASCADE isr_approval_cascade link 1: Asset legal_state -> SALE_AUTHORIZED (from VALUED or DISPOSITION_REVIEW), custody_state -> RELEASED_FOR_SALE, retention_decision -> SELL"
          - "InterlocutorySaleRequest.version += 1; Asset.version += 1"
      - from: PENDING
        to: DENIED
        trigger: "POST /custody/interlocutory-sale-requests/{id}/adjudicate with outcome=DENY"
        actor: CourtOfficial
        preconditions:
          - "adjudicating X-User-ID != requested_by_user_id (ERR_SOD_VIOLATION)"
        side_effects:
          - "adjudicated_by_user_id recorded"
          - "InterlocutorySaleRequest.version += 1"
        note: "DENIED is terminal for this ISR, but a fresh POST /custody/interlocutory-sale-requests resubmits — an aggregate-level retry loop"

  - entity: ThirdPartyInterest
    initial_state: FILED
    terminal_states: [SATISFIED, GRANTED, DENIED]
    transitions:
      - from: FILED
        to: VERIFIED
        trigger: "POST /custody/third-party-interests/{id}/adjudicate with outcome=VERIFY"
        actor: CourtOfficial
        preconditions:
          - "kind must be one of LIEN_MORTGAGE | LIEN_TAX | LIEN_JUDGMENT | LIEN_MECHANIC (ERR_OUTCOME_KIND_MISMATCH)"
        side_effects: ["adjudicated_by_user_id recorded", "ThirdPartyInterest.version += 1"]
      - from: FILED
        to: GRANTED
        trigger: "POST /custody/third-party-interests/{id}/adjudicate with outcome=GRANT"
        actor: CourtOfficial
        preconditions:
          - "kind == INNOCENT_OWNER (ERR_OUTCOME_KIND_MISMATCH)"
        side_effects:
          - "adjudicated_by_user_id recorded"
          - "CASCADE innocent_owner_grant_cascade link 1: Asset legal_state (if in {SEIZED, VALUATION_PENDING, VALUED, DISPOSITION_REVIEW, SALE_AUTHORIZED}) -> RETURN_PENDING"
          - "CASCADE link 2: that Asset's SaleEvents in {OPEN_FOR_BIDS, CLOSED_PENDING_SETTLEMENT} -> CANCELLED"
          - "ThirdPartyInterest.version += 1; Asset.version += 1"
      - from: FILED
        to: DENIED
        trigger: "POST /custody/third-party-interests/{id}/adjudicate with outcome=DENY"
        actor: CourtOfficial
        preconditions: []
        side_effects: ["adjudicated_by_user_id recorded", "ThirdPartyInterest.version += 1"]
      - from: DENIED
        to: APPEALED
        trigger: "POST /custody/third-party-interests/{id}/appeal"
        actor: Claimant
        preconditions:
          - "appeal_count < APPEAL_LIMIT (ERR_APPEAL_EXHAUSTED)"
          - "calling X-User-ID == petitioner_ref (ERR_FORBIDDEN)"
        side_effects:
          - "appeal_count += 1"
          - "ThirdPartyInterest.version += 1"
      - from: APPEALED
        to: VERIFIED
        trigger: "POST /custody/third-party-interests/{id}/adjudicate with outcome=VERIFY"
        actor: CourtOfficial
        preconditions:
          - "kind must be a LIEN_* kind (ERR_OUTCOME_KIND_MISMATCH)"
        side_effects: ["adjudicated_by_user_id recorded", "ThirdPartyInterest.version += 1"]
      - from: APPEALED
        to: GRANTED
        trigger: "POST /custody/third-party-interests/{id}/adjudicate with outcome=GRANT"
        actor: CourtOfficial
        preconditions:
          - "kind == INNOCENT_OWNER (ERR_OUTCOME_KIND_MISMATCH)"
        side_effects:
          - "adjudicated_by_user_id recorded"
          - "CASCADE innocent_owner_grant_cascade link 1 + link 2 as on the FILED -> GRANTED edge"
          - "ThirdPartyInterest.version += 1; Asset.version += 1"
      - from: APPEALED
        to: DENIED
        trigger: "POST /custody/third-party-interests/{id}/adjudicate with outcome=DENY"
        actor: CourtOfficial
        preconditions: []
        side_effects: ["adjudicated_by_user_id recorded", "ThirdPartyInterest.version += 1"]
        note: "DENIED -> APPEALED -> DENIED is the appeal cycle; APPEAL_LIMIT caps iterations"
      - from: VERIFIED
        to: SATISFIED
        trigger: "system (automatic during SaleEvent settlement waterfall when the lien is paid in full or in part)"
        actor: system
        preconditions: []
        side_effects:
          - "satisfied_amount_cents = amount actually paid"
          - "ThirdPartyInterest.version += 1"

  - entity: SaleEvent
    initial_state: OPEN_FOR_BIDS
    terminal_states: [SETTLED, NO_SALE, CANCELLED]
    transitions:
      - from: OPEN_FOR_BIDS
        to: CLOSED_PENDING_SETTLEMENT
        trigger: "POST /custody/sale-events/{id}/close with winning_bid_cents >= reserve_price_cents"
        actor: AuctionCoordinator
        preconditions: []
        side_effects:
          - "winning_bid_cents recorded; gross_proceeds_cents = winning_bid_cents"
          - "SaleEvent.version += 1"
      - from: OPEN_FOR_BIDS
        to: NO_SALE
        trigger: "POST /custody/sale-events/{id}/close with winning_bid_cents < reserve_price_cents"
        actor: AuctionCoordinator
        preconditions: []
        side_effects:
          - "winning_bid_cents recorded; gross_proceeds_cents = 0"
          - "Asset remains legal_state == SALE_AUTHORIZED and may be re-listed by a new SaleEvent"
          - "SaleEvent.version += 1"
      - from: CLOSED_PENDING_SETTLEMENT
        to: SETTLED
        trigger: "POST /custody/sale-events/{id}/settle"
        actor: FundAdministrator
        preconditions: []
        side_effects:
          - "auction_fee_cents per auction_fee_schedule; net_proceeds_cents = gross - fee"
          - "proceeds_waterfall executes: VERIFIED liens paid in priority order -> LIEN_PAYMENT Distributions (PAID) + lien -> SATISFIED; then COST_REIMBURSEMENT Distribution (PAID); remainder credited to SeizureCase.sharing_pool_net_basis_cents"
          - "SeizureCase gross_proceeds_cents / auction_fees_cents / lien_payments_cents / cost_reimbursements_cents / sharing_pool_gross_basis_cents / sharing_pool_net_basis_cents recomputed; SeizureCase.version += 1"
          - "Asset legal_state -> SOLD; custody_state -> TRANSFERRED_OUT; Asset.version += 1"
          - "SaleEvent.version += 1"
      - from: OPEN_FOR_BIDS
        to: CANCELLED
        trigger: "system (cascade from SeizureCase dismiss or INNOCENT_OWNER grant)"
        actor: system
        preconditions: []
        side_effects: ["SaleEvent.version += 1"]
      - from: CLOSED_PENDING_SETTLEMENT
        to: CANCELLED
        trigger: "system (cascade from SeizureCase dismiss or INNOCENT_OWNER grant)"
        actor: system
        preconditions: []
        side_effects: ["SaleEvent.version += 1"]

  - entity: Distribution
    initial_state: PENDING
    terminal_states: [PAID, VOIDED]
    transitions:
      - from: PENDING
        to: PAID
        trigger: "POST /custody/distributions/{id}/approve"
        actor: FundAdministrator
        preconditions:
          - "approving X-User-ID != created_by_user_id (ERR_SOD_VIOLATION)"
          - "amount_cents <= SeizureCase.available_proceeds_cents re-checked at approval time (ERR_INSUFFICIENT_PROCEEDS)"
        side_effects:
          - "approved_by_user_id recorded"
          - "SeizureCase.equitable_shares_paid_cents += amount_cents; available_proceeds_cents recomputed; SeizureCase.version += 1"
          - "Distribution.version += 1"
      - from: PENDING
        to: VOIDED
        trigger: "POST /custody/distributions/{id}/rescind"
        actor: FundAdministrator
        preconditions: []
        side_effects: ["Distribution.version += 1"]
      - from: PAID
        to: VOIDED
        trigger: "POST /custody/distributions/{id}/rescind"
        actor: FundAdministrator
        preconditions: []
        side_effects:
          - "COMPENSATION: SeizureCase.equitable_shares_paid_cents -= amount_cents; available_proceeds_cents recomputed (pool credited back); SeizureCase.version += 1"
          - "Distribution.version += 1"
        note: "approve + rescind is the compensating pair conserving SeizureCase.available_proceeds_cents"

# =============================================================================
# §1.2.1 Concurrency Rules (OCC only; state-precondition conflicts live in §1.2/§1.4)
# =============================================================================
concurrency_rules:
  - rule_id: valuation-create-stale-asset
    parent_entity: Asset
    write_endpoint: "POST /custody/valuations"
    occ_field: expected_asset_version
    description: |
      Creating a Valuation against an Asset whose version has advanced since the
      client last observed it is rejected with ERR_STALE_VERSION. A newly
      accepted valuation legitimately supersedes the asset's current appraised
      value, so a writer holding a stale view of the asset (its value, cost
      accumulators, or legal state have since changed) must re-read before
      submitting.
    error_id: ERR_STALE_VERSION
    http_status: 412
  - rule_id: isr-create-stale-asset
    parent_entity: Asset
    write_endpoint: "POST /custody/interlocutory-sale-requests"
    occ_field: expected_asset_version
    description: |
      Creating an InterlocutorySaleRequest against an Asset whose version has
      advanced since the client last observed it is rejected with
      ERR_STALE_VERSION. The eligibility ratio is computed from the asset's
      current accumulators, so a stale-view request must be re-based on a fresh
      read rather than evaluated against figures the client can no longer see.
    error_id: ERR_STALE_VERSION
    http_status: 412

# =============================================================================
# §1.3 Calculation Rules Table
# All rounding is round-half-up on non-negative integers:
#   RHU(n, d) = floor((n + floor(d/2)) / d)
# =============================================================================
calculations:
  - name: condition_adjusted_valuation
    trigger: "Valuation creation (POST /custody/valuations)"
    algorithm: weighted_scoring
    formula: |
      if method == INCOME_APPROACH:
        # per-year rounded capitalization, THEN sum — pinned rounding order
        adjusted_value_cents = sum over the 3 annual_net_revenues_cents[i] of
                               RHU(annual_net_revenues_cents[i] * CAPITALIZATION_BPS, 10000)
      else:
        adjusted_value_cents = RHU(raw_value_cents * CONDITION_FACTOR_BPS[assessed_condition_grade], 10000)
    input_set: "The single Valuation being created; no other entities"
    constants:
      CAPITALIZATION_BPS: 3300
      CONDITION_FACTOR_BPS: { EXCELLENT: 10000, GOOD: 9000, FAIR: 7500, POOR: 5000, SALVAGE: 2500 }
    precision: "integer cents, round-half-up via RHU"
    note: "INCOME_APPROACH divergence: revenues [10001,10001,10001] yield 3x3300 = 9900 per-year-rounded; sum-then-round would give 9901 — the pinned order wins"

  - name: retention_value_estimate
    trigger: "recomputed on every mutation of Asset costs, on every Valuation creation or adjudication, and surfaced on every Asset read"
    algorithm: forward_looking
    formula: |
      FINAL variant:
        if no ACCEPTED valuation exists: null
        base = latest ACCEPTED Valuation.adjusted_value_cents
        burden = accumulated_net_holding_cost_cents
        final_net_retention_value_cents = base - burden
      PROVISIONAL variant:
        if no Valuation exists in any status: null
        base = latest SUBMITTED Valuation.adjusted_value_cents if any exists, else latest ACCEPTED Valuation.adjusted_value_cents
        burden = accumulated_net_holding_cost_cents + PROVISIONAL_PROJECTION_MONTHS * MONTHLY_CARRYING_COST_CENTS[asset_type]
        provisional_net_retention_value_cents = base - burden
      "latest" = greatest created_at; tie-break impossible (server-stamped, single writer per row)
    input_set: "Valuations of this Asset in status ACCEPTED (FINAL) or any status (PROVISIONAL, SUBMITTED preferred); ExpenseEntries of this Asset"
    constants:
      PROVISIONAL_PROJECTION_MONTHS: 6
      MONTHLY_CARRYING_COST_CENTS: { REAL_PROPERTY: 150000, BUSINESS: 400000, VEHICLE: 25000, VESSEL: 60000, AIRCRAFT: 120000, PERSONAL_PROPERTY: 8000, FINANCIAL_INSTRUMENT: 2000 }
      RETENTION_VALUE_FLOOR_CENTS: 500000
    precision: "integer cents"
    variants:
      - name: PROVISIONAL
        when: "forward-looking planning; the value an AssetManager sees before adjudication settles"
        difference: "uses the latest SUBMITTED (not yet adjudicated) valuation when present, and adds a 6-month projected carrying-cost burden"
      - name: FINAL
        when: "the only variant decide-retention may consult"
        difference: "uses ACCEPTED valuations only and actual posted net costs only (no projection)"

  - name: interlocutory_eligibility
    trigger: "POST /custody/interlocutory-sale-requests (gate), POST /custody/assets/{id}/decide-retention with decision=RETAIN (must be false), and POST /custody/run-holding-review (reporting)"
    algorithm: threshold
    formula: |
      projected_burden = accumulated_net_holding_cost_cents + ISR_PROJECTION_MONTHS * MONTHLY_CARRYING_COST_CENTS[asset_type]
      # pinned integer comparison, no floats:
      eligible == ( projected_burden * 100 >= INTERLOCUTORY_RATIO_THRESHOLD_PCT * appraised_value_cents )
      # exactly at the ratio (0.30) IS eligible
    input_set: "The single Asset; requires appraised_value_cents non-null (callers enforce legal_state first, so a null value is unreachable here)"
    constants:
      INTERLOCUTORY_RATIO_THRESHOLD_PCT: 30
      ISR_PROJECTION_MONTHS: 3
      MONTHLY_CARRYING_COST_CENTS: { REAL_PROPERTY: 150000, BUSINESS: 400000, VEHICLE: 25000, VESSEL: 60000, AIRCRAFT: 120000, PERSONAL_PROPERTY: 8000, FINANCIAL_INSTRUMENT: 2000 }
    precision: "integer-cents comparison; boundary is inclusive (>="

  - name: auction_fee_schedule
    trigger: "POST /custody/sale-events/{id}/settle"
    algorithm: tiered_pricing
    formula: |
      # tiered MARGINAL fee on gross_proceeds_cents; per-bracket fee rounded, then summed (pinned order)
      b1 = min(gross, 1000000);                 f1 = RHU(b1 * 1000, 10000)   # 10% on the first $10,000
      rem1 = gross - b1
      b2 = min(rem1, 4000000);                  f2 = RHU(b2 * 700, 10000)    # 7% on the next $40,000
      b3 = rem1 - b2;                           f3 = RHU(b3 * 400, 10000)    # 4% on the remainder
      auction_fee_cents = f1 + f2 + f3
      net_proceeds_cents = gross_proceeds_cents - auction_fee_cents
    input_set: "The SaleEvent being settled"
    constants:
      TIER1_CAP_CENTS: 1000000
      TIER1_BPS: 1000
      TIER2_CAP_CENTS: 4000000
      TIER2_BPS: 700
      TIER3_BPS: 400
    precision: "integer cents, round-half-up per bracket then summed"

  - name: proceeds_waterfall
    trigger: "POST /custody/sale-events/{id}/settle, after auction_fee_schedule"
    algorithm: waterfall_allocation
    formula: |
      remaining = net_proceeds_cents
      # bucket 1: VERIFIED liens of this asset, ordered by (priority_position ASC, created_at ASC)
      for each ThirdPartyInterest with asset_id == this asset, kind in LIEN_*, status == VERIFIED, in that order:
        pay = min(amount_cents, remaining)
        if pay > 0:
          create Distribution { kind: LIEN_PAYMENT, payee_ref: lienholder_name, amount_cents: pay, status: PAID }
          lien.status -> SATISFIED with satisfied_amount_cents = pay
          remaining -= pay
      # bucket 2: holding-cost reimbursement for THIS asset
      cost_reimb = min(Asset.accumulated_net_holding_cost_cents, remaining)
      if cost_reimb > 0:
        create Distribution { kind: COST_REIMBURSEMENT, payee_ref: "CASE_COST_REIMBURSEMENT", amount_cents: cost_reimb, status: PAID }
        remaining -= cost_reimb
      # bucket 3: remainder to the case sharing pool (may be 0)
      SeizureCase.gross_proceeds_cents += gross_proceeds_cents
      SeizureCase.auction_fees_cents += auction_fee_cents
      SeizureCase.lien_payments_cents += (sum of LIEN_PAYMENT amounts just created)
      SeizureCase.cost_reimbursements_cents += cost_reimb
      SeizureCase.sharing_pool_gross_basis_cents += (gross_proceeds_cents - auction_fee_cents)
      SeizureCase.sharing_pool_net_basis_cents += remaining
      SeizureCase.available_proceeds_cents = sharing_pool_net_basis_cents - equitable_shares_paid_cents
    input_set: "VERIFIED liens of the settled asset (DENIED/SATISFIED excluded); the asset's ExpenseEntry accumulator; the owning SeizureCase"
    precision: "integer cents; all amounts are already integers so no rounding occurs inside the waterfall — the rounding trap lives upstream in auction_fee_schedule"
    variants:
      - name: NET_BASIS
        when: "canonical — funds actually distributable"
        difference: "sharing pool is the post-lien, post-cost remainder"
      - name: GROSS_BASIS
        when: "estimate surfaced for review before carve-outs are known"
        difference: "sharing pool is (gross - auction fee) only; equals NET_BASIS plus lien payments plus cost reimbursements"

  - name: depreciation_on_return
    trigger: "POST /custody/assets/{id}/complete-return"
    algorithm: decay_function
    formula: |
      if appraised_value_cents is null: computed_depreciation_cents = 0
      else:
        rank: EXCELLENT=5, GOOD=4, FAIR=3, POOR=2, SALVAGE=1
        grade_steps_down = max(0, rank(seizure_condition_grade) - rank(return_condition_grade))
        full_months_held = number of whole calendar months from seized_on to logical clock now
          (a month counts when the day-of-month of now >= day-of-month of seized_on for that month boundary;
           computed as (now.year - seized.year)*12 + (now.month - seized.month) minus 1 if now.day < seized.day)
        fraction_bps = min(DEPRECIATION_CAP_BPS, DEPRECIATION_PER_GRADE_STEP_BPS * grade_steps_down + DEPRECIATION_PER_MONTH_BPS * full_months_held)
        computed_depreciation_cents = RHU(appraised_value_cents * fraction_bps, 10000)
    input_set: "The single Asset"
    constants:
      DEPRECIATION_PER_GRADE_STEP_BPS: 800
      DEPRECIATION_PER_MONTH_BPS: 50
      DEPRECIATION_CAP_BPS: 6000
      DISPUTE_WINDOW_DAYS: 30
      APPEAL_LIMIT: 1
      EQUITABLE_SHARE_MIN_CENTS: 10000
    precision: "integer cents, round-half-up via RHU"

  - name: monthly_holding_accrual
    trigger: "POST /custody/run-holding-review"
    algorithm: aggregation
    formula: |
      for each Asset where legal_state in {SEIZED, VALUATION_PENDING, VALUED, DISPOSITION_REVIEW}
        and custody_state in {SECURED, IN_STORAGE, IN_MAINTENANCE}:
        if no ExpenseEntry exists for this asset with source == SYSTEM_ACCRUAL
           and incurred_on inside the logical clock's current calendar month:
          create ExpenseEntry { entry_kind: COST, expense_type: STORAGE_ACCRUAL, source: SYSTEM_ACCRUAL,
                                amount_cents: MONTHLY_CARRYING_COST_CENTS[asset_type],
                                incurred_on: logical clock now, posted_by_user_id: "system" }
          recompute Asset.accumulated_net_holding_cost_cents; Asset.version += 1
      response: { assets_reviewed: <count of assets matching the state filters>, accruals_posted: <count created> }
    input_set: "All Assets in the state windows above; assets in legal SALE_AUTHORIZED or any terminal/return state are excluded (this exclusion is cascade link 3 of isr_approval_cascade)"
    constants:
      MONTHLY_CARRYING_COST_CENTS: { REAL_PROPERTY: 150000, BUSINESS: 400000, VEHICLE: 25000, VESSEL: 60000, AIRCRAFT: 120000, PERSONAL_PROPERTY: 8000, FINANCIAL_INSTRUMENT: 2000 }
    precision: "integer cents; idempotent per (asset, calendar month) — a second run in the same month posts nothing"

# =============================================================================
# §1.4 Validation Rules Table (ordered by priority; first failure wins)
# =============================================================================
validations:
  - priority: 1
    category: auth
    check: "X-User-Role and X-User-ID headers present; X-User-Role names a declared role"
    error_id: ERR_UNAUTHENTICATED
    http_status: 401
    applies_to: "all"
  - priority: 2
    category: auth
    check: "Caller role is in the endpoint's roles list; where a rule pins an identity (Claimant petitioner_ref, SoD pairs), the X-User-ID identity check fires here as ERR_FORBIDDEN — except the two segregation-of-duties pairs, which are business_safety (priority 7)"
    error_id: ERR_FORBIDDEN
    http_status: 403
    applies_to: "all"
  - priority: 3
    category: existence
    check: "Request shape: required fields present, enums in-domain, integers positive where required, array lengths exact, window_end > window_start, slot_end > slot_start, method-specific valuation inputs consistent (INCOME_APPROACH requires annual_net_revenues_cents and forbids raw_value_cents; other methods require raw_value_cents + assessed_condition_grade and forbid annual_net_revenues_cents); manual ExpenseEntry expense_type != STORAGE_ACCRUAL; INNOCENT_OWNER filings carry null lienholder_name/amount_cents/priority_position and LIEN_* filings carry all three non-null; EQUITABLE_SHARE distributions carry a non-null usage_restriction"
    error_id: ERR_INVALID_REQUEST
    http_status: 400
    applies_to: "all POST endpoints with a body"
  - priority: 4
    category: existence
    check: "Path ids and body FK ids resolve to existing resources, validated left-to-right"
    error_id: ERR_NOT_FOUND
    http_status: 404
    applies_to: "all endpoints with path ids or FK body fields"
  - priority: 5
    category: state
    check: "OCC: expected_asset_version (required on POST /custody/valuations and POST /custody/interlocutory-sale-requests) equals the Asset's current version"
    error_id: ERR_STALE_VERSION
    http_status: 412
    applies_to: "POST /custody/valuations, POST /custody/interlocutory-sale-requests"
  - priority: 6
    category: state
    check: "State preconditions of §1.2: entity in a valid from-state for the requested transition; includes ERR_VALUATION-gated flows expressed as state (decide-retention needs legal VALUED), ERR_CASE_NOT_FORFEITED for authorize-sale and Distribution creation, ERR_INVALID_STATE for every other invalid from-state, ERR_APPEAL_EXHAUSTED when appeal_count == APPEAL_LIMIT"
    error_id: ERR_INVALID_STATE | ERR_CASE_NOT_FORFEITED | ERR_APPEAL_EXHAUSTED
    http_status: 409
    applies_to: "all action endpoints"
  - priority: 7
    category: business_safety
    check: "Segregation of duties: ISR adjudicator X-User-ID != requested_by_user_id; Distribution approver X-User-ID != created_by_user_id"
    error_id: ERR_SOD_VIOLATION
    http_status: 403
    applies_to: "POST /custody/interlocutory-sale-requests/{id}/adjudicate, POST /custody/distributions/{id}/approve"
  - priority: 8
    category: business_constraint
    check: "Uniqueness and interval constraints: case_number unique; at most one LIEN_* ThirdPartyInterest per (asset_id, priority_position) among statuses {FILED, VERIFIED, APPEALED}; custody-window contiguity per custody_window_contiguity; auction-slot non-overlap per auction_slot_overlap; at most one SaleEvent per asset in {OPEN_FOR_BIDS, CLOSED_PENDING_SETTLEMENT}; outcome compatible with ThirdPartyInterest.kind"
    error_id: ERR_DUPLICATE_CASE_NUMBER | ERR_PRIORITY_POSITION_CONFLICT | ERR_CUSTODY_WINDOW_BREAK | ERR_AUCTION_SLOT_CONFLICT | ERR_SALE_ALREADY_ACTIVE | ERR_OUTCOME_KIND_MISMATCH
    http_status: 409
    applies_to: "creation endpoints + adjudicate endpoints"
  - priority: 9
    category: business_fiscal
    check: "Fiscal rules: interlocutory_eligibility must hold for ISR creation; reserve_price_cents <= appraised_value_cents at SaleEvent creation; EQUITABLE_SHARE amount >= EQUITABLE_SHARE_MIN_CENTS and <= available_proceeds_cents (re-checked at approve); REVERSAL/REVENUE_OFFSET must not drive accumulated_net_holding_cost_cents negative; RETAIN decision blocked by floor (ERR_RETENTION_VALUE_TOO_LOW) and by ratio (ERR_RETENTION_BLOCKED_HOLDING_COST); resolve-return-dispute final_depreciation_cents <= appraised_value_cents"
    error_id: ERR_RATIO_BELOW_THRESHOLD | ERR_RESERVE_ABOVE_VALUE | ERR_SHARE_BELOW_MINIMUM | ERR_INSUFFICIENT_PROCEEDS | ERR_NEGATIVE_HOLDING_COST | ERR_RETENTION_VALUE_TOO_LOW | ERR_RETENTION_BLOCKED_HOLDING_COST | ERR_DEPRECIATION_EXCEEDS_VALUE
    http_status: 422
    applies_to: "ISR creation, SaleEvent creation, Distribution creation/approval, ExpenseEntry creation, decide-retention, resolve-return-dispute"
    note: "within this tier the order is: retention floor checked before retention ratio; all other fiscal checks stand alone per endpoint"
  - priority: 10
    category: business_temporal
    check: "Clock-relative rules: SaleEvent slot_start >= logical clock now; dispute-return within DISPUTE_WINDOW_DAYS of returned_at"
    error_id: ERR_SLOT_IN_PAST | ERR_DISPUTE_WINDOW_EXPIRED
    http_status: 409
    applies_to: "POST /custody/sale-events, POST /custody/assets/{id}/dispute-return"

# =============================================================================
# §1.5 API Endpoint Table
# Flat topology: all collections top-level; child discovery via sub-resource GETs.
# GET roles list every business role; mutations are role-gated per §1.7.
# =============================================================================
endpoints:
  # --- SeizureCase ---
  - { method: POST, path: "/custody/cases", description: "Open a seizure case", roles: [CaseAgent], code: 201, input: [case_number, judicial_district, forfeiture_type, lead_agency_code], output: SeizureCase, side_effects: ["status=OPEN; all proceeds accumulators 0; version=1"] }
  - { method: GET, path: "/custody/cases/{id}", description: "Read one case including computed proceeds fields", roles: [CaseAgent, AssetCustodian, Appraiser, AssetManager, CourtOfficial, AuctionCoordinator, FundAdministrator, Claimant], code: 200, input: [], output: SeizureCase, side_effects: [] }
  - { method: GET, path: "/custody/cases/{id}/assets", description: "List assets of a case (FK reverse reachability for Asset.seizure_case_id)", roles: [CaseAgent, AssetCustodian, Appraiser, AssetManager, CourtOfficial, AuctionCoordinator, FundAdministrator, Claimant], code: 200, input: ["limit?", "offset?"], output: "Asset[]", side_effects: [] }
  - { method: GET, path: "/custody/cases/{id}/distributions", description: "List distributions of a case (FK reverse reachability for Distribution.seizure_case_id)", roles: [CaseAgent, AssetCustodian, Appraiser, AssetManager, CourtOfficial, AuctionCoordinator, FundAdministrator, Claimant], code: 200, input: ["limit?", "offset?"], output: "Distribution[]", side_effects: [] }
  - { method: POST, path: "/custody/cases/{id}/file-forfeiture", description: "OPEN -> FORFEITURE_PENDING", roles: [CaseAgent], code: 200, input: [], output: SeizureCase, side_effects: ["increments SeizureCase.version by 1"] }
  - { method: POST, path: "/custody/cases/{id}/forfeit", description: "FORFEITURE_PENDING -> FORFEITED; stamps forfeited_at", roles: [CourtOfficial], code: 200, input: [], output: SeizureCase, side_effects: ["increments SeizureCase.version by 1"] }
  - { method: POST, path: "/custody/cases/{id}/dismiss", description: "OPEN|FORFEITURE_PENDING -> DISMISSED; cascades assets to RETURN_PENDING and cancels their open sale events", roles: [CourtOfficial], code: 200, input: [], output: SeizureCase, side_effects: ["increments SeizureCase.version by 1", "cascade per SeizureCase dismiss transition"] }

  # --- Asset ---
  - { method: POST, path: "/custody/assets", description: "Intake an asset into a case", roles: [AssetCustodian], code: 201, input: [seizure_case_id, asset_type, description, seized_on, seizure_condition_grade], output: Asset, side_effects: ["custody_state=INTAKE; legal_state=SEIZED; current_condition_grade=seizure_condition_grade; owning case must be in {OPEN, FORFEITURE_PENDING, FORFEITED} — substitute assets may be seized into an already-forfeited case; DISMISSED blocks intake (ERR_INVALID_STATE)"] }
  - { method: GET, path: "/custody/assets/{id}", description: "Read one asset including computed valuation/cost/retention fields", roles: [CaseAgent, AssetCustodian, Appraiser, AssetManager, CourtOfficial, AuctionCoordinator, FundAdministrator, Claimant], code: 200, input: [], output: Asset, side_effects: [] }
  - { method: GET, path: "/custody/assets/{id}/custody-transfers", description: "List custody transfers of an asset (FK reverse reachability)", roles: [CaseAgent, AssetCustodian, Appraiser, AssetManager, CourtOfficial, AuctionCoordinator, FundAdministrator, Claimant], code: 200, input: ["limit?", "offset?"], output: "CustodyTransfer[]", side_effects: [] }
  - { method: GET, path: "/custody/assets/{id}/valuations", description: "List valuations of an asset (FK reverse reachability)", roles: [CaseAgent, AssetCustodian, Appraiser, AssetManager, CourtOfficial, AuctionCoordinator, FundAdministrator, Claimant], code: 200, input: ["limit?", "offset?"], output: "Valuation[]", side_effects: [] }
  - { method: GET, path: "/custody/assets/{id}/expense-entries", description: "List expense entries of an asset (FK reverse reachability)", roles: [CaseAgent, AssetCustodian, Appraiser, AssetManager, CourtOfficial, AuctionCoordinator, FundAdministrator, Claimant], code: 200, input: ["limit?", "offset?"], output: "ExpenseEntry[]", side_effects: [] }
  - { method: GET, path: "/custody/assets/{id}/interlocutory-sale-requests", description: "List ISRs of an asset (FK reverse reachability)", roles: [CaseAgent, AssetCustodian, Appraiser, AssetManager, CourtOfficial, AuctionCoordinator, FundAdministrator, Claimant], code: 200, input: ["limit?", "offset?"], output: "InterlocutorySaleRequest[]", side_effects: [] }
  - { method: GET, path: "/custody/assets/{id}/third-party-interests", description: "List liens and claims on an asset (FK reverse reachability)", roles: [CaseAgent, AssetCustodian, Appraiser, AssetManager, CourtOfficial, AuctionCoordinator, FundAdministrator, Claimant], code: 200, input: ["limit?", "offset?"], output: "ThirdPartyInterest[]", side_effects: [] }
  - { method: GET, path: "/custody/assets/{id}/sale-events", description: "List sale events of an asset (FK reverse reachability)", roles: [CaseAgent, AssetCustodian, Appraiser, AssetManager, CourtOfficial, AuctionCoordinator, FundAdministrator, Claimant], code: 200, input: ["limit?", "offset?"], output: "SaleEvent[]", side_effects: [] }
  - { method: POST, path: "/custody/assets/{id}/decide-retention", description: "legal VALUED -> RETAINED (decision=RETAIN) or -> DISPOSITION_REVIEW (decision=SELL)", roles: [AssetManager], code: 200, input: [decision], output: Asset, side_effects: ["increments Asset.version by 1"] }
  - { method: POST, path: "/custody/assets/{id}/authorize-sale", description: "legal DISPOSITION_REVIEW -> SALE_AUTHORIZED on a FORFEITED case; custody -> RELEASED_FOR_SALE; cancels SCHEDULED transfers", roles: [AssetManager], code: 200, input: [], output: Asset, side_effects: ["increments Asset.version by 1"] }
  - { method: POST, path: "/custody/assets/{id}/initiate-return", description: "custody -> RELEASED_FOR_RETURN when legal == RETURN_PENDING", roles: [AssetManager], code: 200, input: [], output: Asset, side_effects: ["increments Asset.version by 1"] }
  - { method: POST, path: "/custody/assets/{id}/complete-return", description: "legal RETURN_PENDING -> RETURNED; requires custody TRANSFERRED_OUT; computes depreciation_on_return", roles: [AssetManager], code: 200, input: [return_condition_grade], output: Asset, side_effects: ["increments Asset.version by 1", "stamps returned_at and computed_depreciation_cents"] }
  - { method: POST, path: "/custody/assets/{id}/dispute-return", description: "legal RETURNED -> DISPUTED within the 30-day window", roles: [Claimant], code: 200, input: [claimed_depreciation_cents], output: Asset, side_effects: ["increments Asset.version by 1"] }
  - { method: POST, path: "/custody/assets/{id}/resolve-return-dispute", description: "legal DISPUTED -> RESOLVED with adjudicated depreciation", roles: [CourtOfficial], code: 200, input: [final_depreciation_cents], output: Asset, side_effects: ["increments Asset.version by 1"] }

  # --- CustodyTransfer ---
  - { method: POST, path: "/custody/custody-transfers", description: "Schedule a custody transfer; enforces per-asset contiguous window chaining", roles: [AssetCustodian], code: 201, input: [asset_id, from_location_ref, to_location_ref, to_location_kind, window_start, window_end], output: CustodyTransfer, side_effects: ["status=SCHEDULED; CLAIMANT_PREMISES kind requires custody RELEASED_FOR_RETURN, other kinds require custody not in {TRANSFERRED_OUT, RELEASED_FOR_RETURN} (ERR_INVALID_STATE)"] }
  - { method: POST, path: "/custody/custody-transfers/{id}/complete", description: "SCHEDULED -> COMPLETED; maps to_location_kind onto Asset.custody_state and records condition_on_arrival", roles: [AssetCustodian], code: 200, input: [condition_on_arrival], output: CustodyTransfer, side_effects: ["increments CustodyTransfer.version by 1", "Asset.custody_state/current_condition_grade updated; increments Asset.version by 1"] }

  # --- Valuation ---
  - { method: POST, path: "/custody/valuations", description: "Submit a valuation (OCC-guarded); first submission advances legal SEIZED -> VALUATION_PENDING", roles: [Appraiser], code: 201, input: [asset_id, method, expected_asset_version, "raw_value_cents?", "assessed_condition_grade?", "annual_net_revenues_cents?"], output: Valuation, side_effects: ["adjusted_value_cents computed per condition_adjusted_valuation", "Asset legal SEIZED -> VALUATION_PENDING; increments Asset.version by 1", "Asset legal_state must be in {SEIZED, VALUATION_PENDING, VALUED, DISPOSITION_REVIEW} (ERR_INVALID_STATE)"] }
  - { method: POST, path: "/custody/valuations/{id}/adjudicate", description: "SUBMITTED -> ACCEPTED | REJECTED (outcome ACCEPT|REJECT)", roles: [CourtOfficial], code: 200, input: [outcome], output: Valuation, side_effects: ["on ACCEPT: Asset.appraised_value_cents updated, legal advance/revert per state machine, both retention variants recomputed", "increments Valuation.version by 1"] }

  # --- ExpenseEntry (append-only ledger) ---
  - { method: POST, path: "/custody/expense-entries", description: "Post a holding cost, revenue offset, or reversal against an asset", roles: [AssetCustodian], code: 201, input: [asset_id, entry_kind, expense_type, amount_cents, "incurred_on?"], output: ExpenseEntry, side_effects: ["Asset.accumulated_net_holding_cost_cents recomputed; increments Asset.version by 1", "Asset legal_state must be in {SEIZED, VALUATION_PENDING, VALUED, DISPOSITION_REVIEW, SALE_AUTHORIZED} (ERR_INVALID_STATE)", "resulting accumulator must stay >= 0 (ERR_NEGATIVE_HOLDING_COST)"] }

  # --- InterlocutorySaleRequest ---
  - { method: POST, path: "/custody/interlocutory-sale-requests", description: "Request court approval for pre-forfeiture sale (OCC-guarded; eligibility ratio gate)", roles: [AssetManager], code: 201, input: [asset_id, justification, expected_asset_version], output: InterlocutorySaleRequest, side_effects: ["snapshots accumulated/projected burden and appraised value", "Asset legal_state must be in {VALUED, DISPOSITION_REVIEW} (ERR_INVALID_STATE)", "eligibility per interlocutory_eligibility (ERR_RATIO_BELOW_THRESHOLD)", "increments Asset.version by 1"] }
  - { method: POST, path: "/custody/interlocutory-sale-requests/{id}/adjudicate", description: "PENDING -> APPROVED | DENIED (outcome APPROVE|DENY); SoD-guarded; APPROVE fires isr_approval_cascade", roles: [CourtOfficial], code: 200, input: [outcome], output: InterlocutorySaleRequest, side_effects: ["increments InterlocutorySaleRequest.version by 1", "on APPROVE: cascade per state machine"] }

  # --- ThirdPartyInterest ---
  - { method: POST, path: "/custody/third-party-interests", description: "File a lien or innocent-owner claim", roles: [Claimant], code: 201, input: [asset_id, kind, petitioner_ref, "lienholder_name?", "amount_cents?", "priority_position?"], output: ThirdPartyInterest, side_effects: ["status=FILED; petitioner_ref must equal X-User-ID (ERR_FORBIDDEN)", "lien priority uniqueness (ERR_PRIORITY_POSITION_CONFLICT)", "Asset legal_state must not be in {SOLD, RETURN_PENDING, RETURNED, DISPUTED, RESOLVED} (ERR_INVALID_STATE); RETAINED assets still accept filings — a GRANT there records the claim without cascading, per the state machine"] }
  - { method: POST, path: "/custody/third-party-interests/{id}/adjudicate", description: "FILED|APPEALED -> VERIFIED | GRANTED | DENIED (outcome VERIFY|GRANT|DENY); kind/outcome compatibility enforced", roles: [CourtOfficial], code: 200, input: [outcome], output: ThirdPartyInterest, side_effects: ["increments ThirdPartyInterest.version by 1", "on GRANT: innocent_owner_grant_cascade"] }
  - { method: POST, path: "/custody/third-party-interests/{id}/appeal", description: "DENIED -> APPEALED, once per interest, petitioner only", roles: [Claimant], code: 200, input: [], output: ThirdPartyInterest, side_effects: ["appeal_count += 1", "increments ThirdPartyInterest.version by 1"] }

  # --- SaleEvent ---
  - { method: POST, path: "/custody/sale-events", description: "Schedule an auction or contracted-seller event; half-open slot non-overlap per auctioneer", roles: [AuctionCoordinator], code: 201, input: [asset_id, sale_method, auctioneer_ref, slot_start, slot_end, reserve_price_cents], output: SaleEvent, side_effects: ["status=OPEN_FOR_BIDS", "Asset legal_state must be SALE_AUTHORIZED (ERR_INVALID_STATE)", "reserve <= appraised value (ERR_RESERVE_ABOVE_VALUE)", "slot conflict (ERR_AUCTION_SLOT_CONFLICT)", "slot in past (ERR_SLOT_IN_PAST)", "one active sale per asset (ERR_SALE_ALREADY_ACTIVE)"] }
  - { method: POST, path: "/custody/sale-events/{id}/close", description: "OPEN_FOR_BIDS -> CLOSED_PENDING_SETTLEMENT (bid >= reserve) or NO_SALE (bid < reserve)", roles: [AuctionCoordinator], code: 200, input: [winning_bid_cents], output: SaleEvent, side_effects: ["increments SaleEvent.version by 1"] }
  - { method: POST, path: "/custody/sale-events/{id}/settle", description: "CLOSED_PENDING_SETTLEMENT -> SETTLED; computes fee and runs proceeds_waterfall", roles: [FundAdministrator], code: 200, input: [], output: SaleEvent, side_effects: ["increments SaleEvent.version by 1", "waterfall per proceeds_waterfall: liens SATISFIED, Distributions created PAID, case pool updated, Asset -> SOLD/TRANSFERRED_OUT"] }

  # --- Distribution ---
  - { method: POST, path: "/custody/distributions", description: "Create an EQUITABLE_SHARE distribution against a forfeited case's pool", roles: [FundAdministrator], code: 201, input: [seizure_case_id, payee_ref, amount_cents, usage_restriction], output: Distribution, side_effects: ["status=PENDING; distribution_kind=EQUITABLE_SHARE", "case must be FORFEITED (ERR_CASE_NOT_FORFEITED)", "amount >= EQUITABLE_SHARE_MIN_CENTS (ERR_SHARE_BELOW_MINIMUM) and <= available_proceeds_cents (ERR_INSUFFICIENT_PROCEEDS)"] }
  - { method: POST, path: "/custody/distributions/{id}/approve", description: "PENDING -> PAID; SoD-guarded; debits the case pool", roles: [FundAdministrator], code: 200, input: [], output: Distribution, side_effects: ["SeizureCase.equitable_shares_paid_cents += amount; available recomputed; increments SeizureCase.version by 1", "increments Distribution.version by 1"] }
  - { method: POST, path: "/custody/distributions/{id}/rescind", description: "PENDING|PAID -> VOIDED; rescinding a PAID distribution credits the pool back (compensating pair)", roles: [FundAdministrator], code: 200, input: [], output: Distribution, side_effects: ["if was PAID: SeizureCase.equitable_shares_paid_cents -= amount; increments SeizureCase.version by 1", "increments Distribution.version by 1"] }

  # --- Ops checkpoint + logical clock ---
  - { method: POST, path: "/custody/run-holding-review", description: "Ops-run checkpoint: posts the monthly STORAGE_ACCRUAL ExpenseEntry for every in-scope asset (idempotent per asset per calendar month) per monthly_holding_accrual", roles: [FundAdministrator], code: 200, input: [], output: "{ assets_reviewed: integer, accruals_posted: integer }", side_effects: ["creates ExpenseEntry rows with source=SYSTEM_ACCRUAL; increments each touched Asset.version by 1"] }
  - { method: POST, path: "/_clock/set_current_utc", description: "Test-driving endpoint: set the logical clock. Server startup default is exactly 2026-09-01T00:00:00Z; before any set call the clock reads that default and never falls back to wall-clock time.", roles: [SystemOperator], code: 200, input: [to_iso8601], output: null, side_effects: ["logical clock advances; no entity mutation"] }

# =============================================================================
# §1.6 Error Code Catalog
# =============================================================================
errors:
  - { id: ERR_UNAUTHENTICATED, http: 401, condition: "Missing X-User-Role/X-User-ID or unrecognized role" }
  - { id: ERR_FORBIDDEN, http: 403, condition: "Role not permitted on endpoint, or identity check failed (Claimant petitioner_ref mismatch)" }
  - { id: ERR_INVALID_REQUEST, http: 400, condition: "Malformed body: missing required field, bad enum, non-positive amount, bad window ordering, method-specific valuation input violation, reserved expense_type, kind/field-consistency violation" }
  - { id: ERR_NOT_FOUND, http: 404, condition: "Path id or body FK id does not resolve" }
  - { id: ERR_STALE_VERSION, http: 412, condition: "expected_asset_version does not match the Asset's current version (OCC)" }
  - { id: ERR_INVALID_STATE, http: 409, condition: "Entity not in a valid from-state for the requested transition" }
  - { id: ERR_CASE_NOT_FORFEITED, http: 409, condition: "Operation requires SeizureCase.status == FORFEITED (authorize-sale from DISPOSITION_REVIEW; Distribution creation)" }
  - { id: ERR_APPEAL_EXHAUSTED, http: 409, condition: "appeal on a ThirdPartyInterest whose appeal_count == APPEAL_LIMIT" }
  - { id: ERR_SOD_VIOLATION, http: 403, condition: "Segregation of duties: ISR adjudicator == requester, or Distribution approver == creator" }
  - { id: ERR_DUPLICATE_CASE_NUMBER, http: 409, condition: "case_number already exists" }
  - { id: ERR_PRIORITY_POSITION_CONFLICT, http: 409, condition: "Another non-terminal LIEN_* ThirdPartyInterest on the same asset already holds this priority_position" }
  - { id: ERR_CUSTODY_WINDOW_BREAK, http: 409, condition: "New transfer window_start != max window_end of the asset's non-CANCELLED transfers (gap or overlap); first transfer exempt" }
  - { id: ERR_AUCTION_SLOT_CONFLICT, http: 409, condition: "Half-open [slot_start, slot_end) overlaps another non-CANCELLED SaleEvent slot for the same auctioneer_ref; adjacency (end == start) is not a conflict" }
  - { id: ERR_SALE_ALREADY_ACTIVE, http: 409, condition: "Asset already has a SaleEvent in OPEN_FOR_BIDS or CLOSED_PENDING_SETTLEMENT" }
  - { id: ERR_OUTCOME_KIND_MISMATCH, http: 422, condition: "adjudicate outcome incompatible with interest kind (VERIFY only for LIEN_*; GRANT only for INNOCENT_OWNER)" }
  - { id: ERR_RATIO_BELOW_THRESHOLD, http: 422, condition: "interlocutory_eligibility false at ISR creation: (accumulated + 3-month projection) * 100 < 30 * appraised_value_cents" }
  - { id: ERR_RESERVE_ABOVE_VALUE, http: 422, condition: "reserve_price_cents > Asset.appraised_value_cents at SaleEvent creation" }
  - { id: ERR_SHARE_BELOW_MINIMUM, http: 422, condition: "EQUITABLE_SHARE amount_cents < EQUITABLE_SHARE_MIN_CENTS (10000)" }
  - { id: ERR_INSUFFICIENT_PROCEEDS, http: 422, condition: "EQUITABLE_SHARE amount_cents > SeizureCase.available_proceeds_cents at creation or at approval" }
  - { id: ERR_NEGATIVE_HOLDING_COST, http: 422, condition: "REVERSAL or REVENUE_OFFSET would drive Asset.accumulated_net_holding_cost_cents below 0" }
  - { id: ERR_RETENTION_VALUE_TOO_LOW, http: 422, condition: "decide-retention RETAIN with final_net_retention_value_cents < RETENTION_VALUE_FLOOR_CENTS (500000)" }
  - { id: ERR_RETENTION_BLOCKED_HOLDING_COST, http: 422, condition: "decide-retention RETAIN while interlocutory_eligibility is true (holding costs too far gone to retain)" }
  - { id: ERR_DEPRECIATION_EXCEEDS_VALUE, http: 422, condition: "resolve-return-dispute final_depreciation_cents > appraised_value_cents (null appraised value admits only 0)" }
  - { id: ERR_SLOT_IN_PAST, http: 409, condition: "SaleEvent slot_start < logical clock now" }
  - { id: ERR_DISPUTE_WINDOW_EXPIRED, http: 409, condition: "dispute-return after returned_at + 30 days" }

# =============================================================================
# §1.7 RBAC Matrix (segregation_of_duties)
# =============================================================================
roles:
  - name: CaseAgent
    description: "Case-intake officer; opens cases and files forfeiture actions"
    identity: opaque
    exclusive_operations: ["POST /custody/cases", "POST /custody/cases/{id}/file-forfeiture"]
    shared_operations: ["all GET endpoints"]
  - name: CourtOfficial
    description: "Court authority; forfeits/dismisses cases, adjudicates valuations, ISRs, third-party interests, and return disputes"
    identity: opaque
    exclusive_operations: ["POST /custody/cases/{id}/forfeit", "POST /custody/cases/{id}/dismiss", "POST /custody/valuations/{id}/adjudicate", "POST /custody/interlocutory-sale-requests/{id}/adjudicate", "POST /custody/third-party-interests/{id}/adjudicate", "POST /custody/assets/{id}/resolve-return-dispute"]
    shared_operations: ["all GET endpoints"]
  - name: AssetCustodian
    description: "Custody and maintenance operator; intakes assets, schedules/completes transfers, posts ledger entries"
    identity: opaque
    exclusive_operations: ["POST /custody/assets", "POST /custody/custody-transfers", "POST /custody/custody-transfers/{id}/complete", "POST /custody/expense-entries"]
    shared_operations: ["all GET endpoints"]
  - name: Appraiser
    description: "Valuation professional; submits valuations only — never adjudicates them"
    identity: opaque
    exclusive_operations: ["POST /custody/valuations"]
    shared_operations: ["all GET endpoints"]
  - name: AssetManager
    description: "Disposition decision-maker; retention decisions, sale authorization, return execution, interlocutory sale requests"
    identity: opaque
    exclusive_operations: ["POST /custody/assets/{id}/decide-retention", "POST /custody/assets/{id}/authorize-sale", "POST /custody/assets/{id}/initiate-return", "POST /custody/assets/{id}/complete-return", "POST /custody/interlocutory-sale-requests"]
    shared_operations: ["all GET endpoints"]
  - name: AuctionCoordinator
    description: "Disposition channel operator; creates and closes sale events"
    identity: opaque
    exclusive_operations: ["POST /custody/sale-events", "POST /custody/sale-events/{id}/close"]
    shared_operations: ["all GET endpoints"]
  - name: FundAdministrator
    description: "Forfeiture-fund accountant; settles sales, creates/approves/rescinds distributions (creator and approver MUST be different user ids), runs the holding-review checkpoint"
    identity: opaque
    exclusive_operations: ["POST /custody/sale-events/{id}/settle", "POST /custody/distributions", "POST /custody/distributions/{id}/approve", "POST /custody/distributions/{id}/rescind", "POST /custody/run-holding-review"]
    shared_operations: ["all GET endpoints"]
  - name: Claimant
    description: "Third-party petitioner (lienholder or innocent owner); X-User-ID must equal the ThirdPartyInterest.petitioner_ref it acts on"
    identity: opaque
    exclusive_operations: ["POST /custody/third-party-interests", "POST /custody/third-party-interests/{id}/appeal", "POST /custody/assets/{id}/dispute-return"]
    shared_operations: ["all GET endpoints"]
  - name: SystemOperator
    description: "Test harness operator; drives the logical clock only"
    identity: opaque
    exclusive_operations: ["POST /_clock/set_current_utc"]
    shared_operations: []
