  - rule_id: priority_pair_validation_conflict
    instances:

      - name: issue_void_empty_invoice_returns_terminal_state_not_invoice_empty
        grounds:
          - validations[priority=405]
          - validations[priority=700]
          - state_machines.EmployerInvoice.DRAFT_to_VOID
          - errors[ERR_EMPLOYERINVOICE_TERMINAL]
          - errors[ERR_INVOICE_EMPTY]
        distinguishing_aspect: |
          Error-category pair {state (priority 405), business_fiscal (priority 700)}: a VOID invoice
          with total_cents 0 violates both rules on POST /employer-invoices/{id}/issue, and the
          response must be ERR_EMPLOYERINVOICE_TERMINAL, never ERR_INVOICE_EMPTY — a different
          category pair from the {business_referential, business_constraint} pair in
          confirm_block_mismatch_beats_capacity_exhausted.
        test_recipe:
          setup:
            - "Logical clock at 2026-08-01T00:00:00Z."
            - "Employer Emptyco with no employees and no reservations."
            - "One EmployerInvoice for 2026-08-01..2026-08-31 created in DRAFT with line_count 0, subtotal_cents 0 and total_cents 0, then voided so invoice_status == VOID."
          setup_api_calls:
            - call: "POST /backup-care/_clock/set_current_utc"
              payload: { current_utc: "2026-08-01T00:00:00Z" }
              as: network_admin
              as_user_id: "u_na_1"
            - call: "POST /backup-care/employers"
              payload: { name: "Emptyco Holdings", industry_code: "HOLDING", contract_status: "ACTIVE", admin_fee_pct: 0.085, overage_billing_enabled: true, adult_elder_extension_enabled: true }
              as: network_admin
              as_user_id: "u_na_1"
              captures: { emp_id: $.data.id }
            - call: "POST /backup-care/employers/${emp_id}/invoices"
              payload: { period_start: "2026-08-01", period_end: "2026-08-31" }
              as: benefits_admin
              as_user_id: "u_ba_1"
