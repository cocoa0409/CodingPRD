  - rule_id: resource_temporal_overlap
    instances:
      - name: advocate_docket_thirty_minute_buffer_boundary
        grounds:
          - validations[priority=34]
          - errors[ERR_ADVOCATE_DOCKET_CONFLICT]
          - entities.Clinician.fields.booked_docket_minutes
          - entities.CourtHearing.fields.scheduled_end_at
        distinguishing_aspect: |
          The shared resource is a single RIGHTS_ADVOCATE's docket, and the overlap test is not
          plain interval intersection: each SCHEDULED hearing is padded by a 30-minute travel
          buffer, so a 29-minute gap collides while a gap of exactly 30 minutes does not. Both
          candidate hearings are otherwise fully legal (judicial day, inside 09:00-16:00, before the
          hold's release deadline), so only the buffer decides.
        test_recipe:
          setup:
            - "Two patients, each with an evaluation signed at 2026-09-03T08:00:00Z scoring 7 and an EMERGENCY_72H hold certified by a second psychiatrist, so both holds are ACTIVE with release_deadline_at 2026-09-06T08:00:00.000Z."
