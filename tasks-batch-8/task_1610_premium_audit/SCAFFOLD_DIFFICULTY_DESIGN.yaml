# =============================================================================
# 1.8 Scaffold Difficulty Design (Test Targeting Index)
# Premium Audit — 9 rules x >=2 instances
# =============================================================================
scaffold_difficulty_design:
  # ---------------------------------------------------------------------------
  - rule_id: dual_variant_calc
    instances:
      - name: audit_result_provisional_vs_final_payroll_inclusion
        grounds:
          - calculations.manual_premium
          - calculations.earned_premium
          - entities.AuditResult.fields.manual_premium_cents
        distinguishing_aspect: |
          On the AuditResult domain, the provisional variant (submit-draft) counts DRAFT allocations while the
          final variant (issue-result) counts VERIFIED allocations only: identical underlying payroll data yields
          manual_premium_cents 961500 provisional vs 854750 final after a DRAFT allocation is rejected and replaced.
        test_recipe:
          setup:
            - "WC policy WC-100 (CA): term 2026-01-01..2026-07-31, estimated premium 2000000 cents, minimum premium 100000 cents, payroll estimate 100000 dollars, mod 1.20, class codes 8810 (rate 40c/$100) and 5645 (rate 1525c/$100, high hazard)"
            - "PHYSICAL work order selected, auditor assigned, records received, appointment completed"
            - "Allocation AL-1: 8810, gross 40000 (auditable 40000); AL-2: 5645, gross 60000 with documented overtime excess 3000 (auditable 57000)"
            - "Subcontractor SubCo 10000 excluded by verified full-period certificate; RiskyCo 5000 included (no certificate)"
          setup_api_calls:
            - { call: "POST /classification-codes", payload: { code: "8810", description: "Clerical", state_code: "CA", coverage_line: "WC", rate_per_100_cents: 40, high_hazard: false, effective_from: "2026-01-01T00:00:00Z", effective_to: "2026-12-31T23:59:59Z" }, as: Underwriter, captures: { cc_a: "$.data.id" } }
            - { call: "POST /classification-codes", payload: { code: "5645", description: "Carpentry", state_code: "CA", coverage_line: "WC", rate_per_100_cents: 1525, high_hazard: true, effective_from: "2026-01-01T00:00:00Z", effective_to: "2026-12-31T23:59:59Z" }, as: Underwriter, captures: { cc_b: "$.data.id" } }
            - { call: "POST /policies", payload: { policy_number: "WC-100", insured_name: "Acme", coverage_line: "WC", state_code: "CA", effective_date: "2026-01-01T00:00:00Z", expiration_date: "2026-07-31T00:00:00Z", estimated_annual_premium_cents: 2000000, minimum_premium_cents: 100000, payroll_estimate_dollars: 100000, experience_mod_factor: 1.20, class_code_ids: ["${cc_a}", "${cc_b}"] }, as: Underwriter, captures: { pol: "$.data.id" } }
            - { call: "POST /auditors", payload: { full_name: "Ada Auditor", territory_states: ["CA"], level: "SENIOR" }, as: AuditManager, captures: { aud: "$.data.id" } }
            - { call: "POST /audit-selection-runs", payload: {}, as: AuditManager }
            - { call: "GET /audit-work-orders", payload: { policy_id: "${pol}" }, as: AuditManager, captures: { wo: "$.data[0].id" } }
            - { call: "POST /audit-work-orders/${wo}/assign", payload: { auditor_id: "${aud}" }, as: AuditManager }
            - { call: "POST /audit-work-orders/${wo}/records-requests", payload: { request_type: "PAYROLL_SUMMARY" }, as: AuditManager, captures: { req1: "$.data.id" } }
            - { call: "POST /audit-work-orders/${wo}/records-requests", payload: { request_type: "SUBCONTRACTOR_LIST" }, as: AuditManager, captures: { req2: "$.data.id" } }
            - { call: "POST /records-requests/${req1}/receive", payload: {}, as: Auditor, as_user_id: "${aud}" }
            - { call: "POST /records-requests/${req2}/receive", payload: {}, as: Auditor, as_user_id: "${aud}" }
            - { call: "GET /audit-work-orders/${wo}", payload: {}, as: AuditManager, captures: { wo_v: "$.data.version" } }
            - { call: "POST /audit-work-orders/${wo}/appointments", payload: { scheduled_start: "2026-08-10T09:00:00Z", scheduled_end: "2026-08-10T11:00:00Z", location_type: "INSURED_PREMISES", expected_work_order_version: "${wo_v}" }, as: Auditor, as_user_id: "${aud}", captures: { appt: "$.data.id" } }
            - { call: "POST /appointments/${appt}/confirm", payload: {}, as: Insured, as_user_id: "${pol}" }
            - { call: "POST /appointments/${appt}/complete", payload: {}, as: Auditor, as_user_id: "${aud}" }
            - { call: "GET /audit-work-orders/${wo}", payload: {}, as: AuditManager, captures: { wo_v2: "$.data.version" } }
            - { call: "POST /audit-work-orders/${wo}/payroll-allocations", payload: { class_code_id: "${cc_a}", period_start: "2026-01-01T00:00:00Z", period_end: "2026-06-30T00:00:00Z", gross_payroll_dollars: 40000, expected_work_order_version: "${wo_v2}" }, as: Auditor, as_user_id: "${aud}", captures: { al1: "$.data.id" } }
            - { call: "GET /audit-work-orders/${wo}", payload: {}, as: AuditManager, captures: { wo_v3: "$.data.version" } }
            - { call: "POST /audit-work-orders/${wo}/payroll-allocations", payload: { class_code_id: "${cc_b}", period_start: "2026-01-01T00:00:00Z", period_end: "2026-06-30T00:00:00Z", gross_payroll_dollars: 60000, overtime_excess_dollars: 3000, overtime_documented: true, expected_work_order_version: "${wo_v3}" }, as: Auditor, as_user_id: "${aud}", captures: { al2: "$.data.id" } }
            - { call: "POST /audit-work-orders/${wo}/subcontractor-exposures", payload: { subcontractor_name: "SubCo", payments_dollars: 10000, governing_class_code_id: "${cc_b}" }, as: Auditor, as_user_id: "${aud}", captures: { sub1: "$.data.id" } }
            - { call: "POST /subcontractor-exposures/${sub1}/certificates", payload: { insurer_name: "Zenith", wc_coverage_present: true, gl_coverage_present: false, coverage_effective_date: "2026-01-01T00:00:00Z", coverage_expiration_date: "2026-07-31T00:00:00Z" }, as: Auditor, as_user_id: "${aud}", captures: { cert1: "$.data.id" } }
            - { call: "POST /certificates/${cert1}/verify", payload: {}, as: Auditor, as_user_id: "${aud}" }
            - { call: "POST /audit-work-orders/${wo}/subcontractor-exposures", payload: { subcontractor_name: "RiskyCo", payments_dollars: 5000, governing_class_code_id: "${cc_b}" }, as: Auditor, as_user_id: "${aud}" }
            - { call: "POST /payroll-allocations/${al1}/verify", payload: {}, as: Auditor, as_user_id: "${aud}" }
            - { call: "POST /audit-work-orders/${wo}/submit-draft", payload: {}, as: Auditor, as_user_id: "${aud}", captures: { res: "$.data.id", prov_manual: "$.data.manual_premium_cents", prov_earned: "$.data.earned_premium_cents" } }
            - { call: "POST /payroll-allocations/${al2}/reject", payload: {}, as: Auditor, as_user_id: "${aud}" }
            - { call: "GET /audit-work-orders/${wo}", payload: {}, as: AuditManager, captures: { wo_v4: "$.data.version" } }
            - { call: "POST /audit-work-orders/${wo}/payroll-allocations", payload: { class_code_id: "${cc_b}", period_start: "2026-01-01T00:00:00Z", period_end: "2026-06-30T00:00:00Z", gross_payroll_dollars: 50000, expected_work_order_version: "${wo_v4}" }, as: Auditor, as_user_id: "${aud}", captures: { al3: "$.data.id" } }
            - { call: "POST /payroll-allocations/${al3}/verify", payload: {}, as: Auditor, as_user_id: "${aud}" }
            - { call: "POST /_clock/set_current_utc", payload: { to_iso8601: "2026-08-15T00:00:00Z" }, as: AuditManager }
          trigger:
            - { call: "POST /audit-work-orders/${wo}/issue-result", payload: {}, as: AuditManager, as_user_id: "mgr-1", captures: { fin_manual: "$.data.manual_premium_cents", fin_earned: "$.data.earned_premium_cents", fin_adj: "$.data.adjustment_cents" } }
          assert:
            - "provisional manual_premium_cents == 961500 (8810: round(40000*40/100)=16000; 5645: round((57000+5000)*1525/100)=945500) while AL-2 was DRAFT"
            - "final AuditResult.${res}.manual_premium_cents == 854750 (8810: 16000; 5645: round((50000+5000)*1525/100)=838750)"
            - "final AuditResult.${res}.earned_premium_cents == 1025700 (round_half_up(854750*1.20)=1025700 >= minimum 100000)"
            - "final AuditResult.${res}.adjustment_cents == -974300 (1025700 - 2000000)"
            - "provisional earned 1153800 != final earned 1025700: same payroll facts, variant-dependent input sets"
            - "BillingTransaction of result ${res}: type RETURN_PREMIUM_CREDIT, amount_cents == 974300, status ISSUED"

      - name: subcontractor_cert_provisional_exclusion_vs_final_inclusion
        grounds:
          - calculations.subcontractor_inclusion
          - calculations.manual_premium
          - entities.SubcontractorExposure.fields.included_dollars
        distinguishing_aspect: |
          On the SubcontractorExposure domain, the provisional variant treats a SUBMITTED certificate as a
          full-coverage exclusion while the final variant counts only VERIFIED certificates: the same 10000-dollar
          subcontractor contributes 0 provisionally but 10000 finally, moving manual premium from 16000 to 168500.
        test_recipe:
          setup:
            - "WC policy WC-200 (CA): term 2026-01-01..2026-07-31, estimated premium 600000 cents, minimum premium 100000 cents, payroll estimate 100000 dollars, mod 1.20, class codes 8810 and 5645 -> VOLUNTARY_REPORT work order"
            - "Allocation 8810 gross 40000 VERIFIED; subcontractor SubCo 10000 (governing 5645) with a certificate left in SUBMITTED status covering the full audit period"
          setup_api_calls:
            - { call: "POST /classification-codes", payload: { code: "8810", description: "Clerical", state_code: "CA", coverage_line: "WC", rate_per_100_cents: 40, high_hazard: false, effective_from: "2026-01-01T00:00:00Z", effective_to: "2026-12-31T23:59:59Z" }, as: Underwriter, captures: { cc_a: "$.data.id" } }
            - { call: "POST /classification-codes", payload: { code: "5645", description: "Carpentry", state_code: "CA", coverage_line: "WC", rate_per_100_cents: 1525, high_hazard: false, effective_from: "2026-01-01T00:00:00Z", effective_to: "2026-12-31T23:59:59Z" }, as: Underwriter, captures: { cc_b: "$.data.id" } }
            - { call: "POST /policies", payload: { policy_number: "WC-200", insured_name: "Beta", coverage_line: "WC", state_code: "CA", effective_date: "2026-01-01T00:00:00Z", expiration_date: "2026-07-31T00:00:00Z", estimated_annual_premium_cents: 600000, minimum_premium_cents: 100000, payroll_estimate_dollars: 100000, experience_mod_factor: 1.20, class_code_ids: ["${cc_a}", "${cc_b}"] }, as: Underwriter, captures: { pol: "$.data.id" } }
            - { call: "POST /auditors", payload: { full_name: "Ada Auditor", territory_states: ["CA"], level: "SENIOR" }, as: AuditManager, captures: { aud: "$.data.id" } }
            - { call: "POST /audit-selection-runs", payload: {}, as: AuditManager }
            - { call: "GET /audit-work-orders", payload: { policy_id: "${pol}" }, as: AuditManager, captures: { wo: "$.data[0].id" } }
            - { call: "POST /audit-work-orders/${wo}/assign", payload: { auditor_id: "${aud}" }, as: AuditManager }
            - { call: "POST /audit-work-orders/${wo}/records-requests", payload: { request_type: "PAYROLL_SUMMARY" }, as: AuditManager, captures: { req1: "$.data.id" } }
            - { call: "POST /records-requests/${req1}/receive", payload: {}, as: Auditor, as_user_id: "${aud}" }
            - { call: "GET /audit-work-orders/${wo}", payload: {}, as: AuditManager, captures: { wo_v: "$.data.version" } }
            - { call: "POST /audit-work-orders/${wo}/payroll-allocations", payload: { class_code_id: "${cc_a}", period_start: "2026-01-01T00:00:00Z", period_end: "2026-06-30T00:00:00Z", gross_payroll_dollars: 40000, expected_work_order_version: "${wo_v}" }, as: Auditor, as_user_id: "${aud}", captures: { al1: "$.data.id" } }
            - { call: "POST /payroll-allocations/${al1}/verify", payload: {}, as: Auditor, as_user_id: "${aud}" }
            - { call: "POST /audit-work-orders/${wo}/subcontractor-exposures", payload: { subcontractor_name: "SubCo", payments_dollars: 10000, governing_class_code_id: "${cc_b}" }, as: Auditor, as_user_id: "${aud}", captures: { sub1: "$.data.id" } }
            - { call: "POST /subcontractor-exposures/${sub1}/certificates", payload: { insurer_name: "Zenith", wc_coverage_present: true, gl_coverage_present: false, coverage_effective_date: "2026-01-01T00:00:00Z", coverage_expiration_date: "2026-07-31T00:00:00Z" }, as: Auditor, as_user_id: "${aud}" }
            - { call: "POST /audit-work-orders/${wo}/submit-draft", payload: {}, as: Auditor, as_user_id: "${aud}", captures: { res: "$.data.id", prov_manual: "$.data.manual_premium_cents", prov_earned: "$.data.earned_premium_cents" } }
            - { call: "POST /_clock/set_current_utc", payload: { to_iso8601: "2026-08-15T00:00:00Z" }, as: AuditManager }
          trigger:
            - { call: "POST /audit-work-orders/${wo}/issue-result", payload: {}, as: AuditManager, as_user_id: "mgr-1", captures: { fin_manual: "$.data.manual_premium_cents", fin_earned: "$.data.earned_premium_cents", fin_adj: "$.data.adjustment_cents" } }
          assert:
            - "provisional manual_premium_cents == 16000 (SUBMITTED cert treated as full-coverage exclusion: 5645 base 0)"
            - "provisional earned_premium_cents == 100000 (round_half_up(16000*1.20)=19200 floored at minimum premium 100000)"
            - "final manual_premium_cents == 168500 (5645 base now includes 10000: round(10000*1525/100)=152500; 8810: 16000)"
            - "final earned_premium_cents == 202200 (round_half_up(168500*1.20)=202200)"
            - "final adjustment_cents == -397800 (202200 - 600000)"
            - "SubcontractorExposure.${sub1}.status remains INCLUDED at issue because its certificate was never VERIFIED"

  # ---------------------------------------------------------------------------
  - rule_id: combinatorial_formula
    instances:
      - name: manual_premium_per_code_rounding_order
        grounds:
          - calculations.manual_premium
          - entities.AuditResult.fields.manual_premium_cents
        distinguishing_aspect: |
          Mode (b) nested rounding: the scaffold pins round-per-class-code-then-sum; two class codes at rate 25c/$100
          with 150-dollar bases each yield 38+38=76 cents, while the forbidden sum-then-round order yields 75.
        test_recipe:
          setup:
            - "WC policy WC-300 (CA): estimated premium 600000 cents, minimum 100000, payroll estimate 50000, mod 1.00, class codes 9150 and 9151 both at rate 25 cents per 100 dollars -> VOLUNTARY_REPORT"
            - "Allocation A: 9150, 150 dollars, period 2026-01-01..2026-03-31; Allocation B: 9151, 150 dollars, period 2026-04-01..2026-06-30; both VERIFIED"
          setup_api_calls:
            - { call: "POST /classification-codes", payload: { code: "9150", description: "Theatrical A", state_code: "CA", coverage_line: "WC", rate_per_100_cents: 25, high_hazard: false, effective_from: "2026-01-01T00:00:00Z", effective_to: "2026-12-31T23:59:59Z" }, as: Underwriter, captures: { cc_c: "$.data.id" } }
            - { call: "POST /classification-codes", payload: { code: "9151", description: "Theatrical B", state_code: "CA", coverage_line: "WC", rate_per_100_cents: 25, high_hazard: false, effective_from: "2026-01-01T00:00:00Z", effective_to: "2026-12-31T23:59:59Z" }, as: Underwriter, captures: { cc_e: "$.data.id" } }
            - { call: "POST /policies", payload: { policy_number: "WC-300", insured_name: "Gamma", coverage_line: "WC", state_code: "CA", effective_date: "2026-01-01T00:00:00Z", expiration_date: "2026-07-31T00:00:00Z", estimated_annual_premium_cents: 600000, minimum_premium_cents: 100000, payroll_estimate_dollars: 50000, experience_mod_factor: 1.00, class_code_ids: ["${cc_c}", "${cc_e}"] }, as: Underwriter, captures: { pol: "$.data.id" } }
            - { call: "POST /auditors", payload: { full_name: "Ada Auditor", territory_states: ["CA"], level: "SENIOR" }, as: AuditManager, captures: { aud: "$.data.id" } }
            - { call: "POST /audit-selection-runs", payload: {}, as: AuditManager }
            - { call: "GET /audit-work-orders", payload: { policy_id: "${pol}" }, as: AuditManager, captures: { wo: "$.data[0].id" } }
            - { call: "POST /audit-work-orders/${wo}/assign", payload: { auditor_id: "${aud}" }, as: AuditManager }
            - { call: "POST /audit-work-orders/${wo}/records-requests", payload: { request_type: "PAYROLL_SUMMARY" }, as: AuditManager, captures: { req1: "$.data.id" } }
            - { call: "POST /records-requests/${req1}/receive", payload: {}, as: Auditor, as_user_id: "${aud}" }
            - { call: "GET /audit-work-orders/${wo}", payload: {}, as: AuditManager, captures: { wo_v: "$.data.version" } }
            - { call: "POST /audit-work-orders/${wo}/payroll-allocations", payload: { class_code_id: "${cc_c}", period_start: "2026-01-01T00:00:00Z", period_end: "2026-03-31T00:00:00Z", gross_payroll_dollars: 150, expected_work_order_version: "${wo_v}" }, as: Auditor, as_user_id: "${aud}", captures: { al1: "$.data.id" } }
            - { call: "GET /audit-work-orders/${wo}", payload: {}, as: AuditManager, captures: { wo_v2: "$.data.version" } }
            - { call: "POST /audit-work-orders/${wo}/payroll-allocations", payload: { class_code_id: "${cc_e}", period_start: "2026-04-01T00:00:00Z", period_end: "2026-06-30T00:00:00Z", gross_payroll_dollars: 150, expected_work_order_version: "${wo_v2}" }, as: Auditor, as_user_id: "${aud}", captures: { al2: "$.data.id" } }
            - { call: "POST /payroll-allocations/${al1}/verify", payload: {}, as: Auditor, as_user_id: "${aud}" }
            - { call: "POST /payroll-allocations/${al2}/verify", payload: {}, as: Auditor, as_user_id: "${aud}" }
          trigger:
            - { call: "POST /audit-work-orders/${wo}/submit-draft", payload: {}, as: Auditor, as_user_id: "${aud}", captures: { res: "$.data.id", manual: "$.data.manual_premium_cents" } }
          assert:
            - "AuditResult.${res}.manual_premium_cents == 76 (round_half_up(150*25/100)=38 per class code, summed: 38+38)"
            - "manual_premium_cents != 75 (the forbidden sum-first-then-round order would yield round_half_up(300*25/100)=75)"

      - name: earned_premium_mod_floor_variant_branches
        grounds:
          - calculations.earned_premium
          - entities.AuditResult.fields.earned_premium_cents
        distinguishing_aspect: |
          Mode (a) multi-input non-linear formula: earned = max(round_half_up(manual * mod), minimum_premium) with a
          variant branch; here manual 40000 * 1.20 = 48000 falls below the 300000-cent minimum, so the floor branch
          dominates and earned is exactly 300000 — a plain mod-multiplied reading (48000) is wrong.
        test_recipe:
          setup:
            - "WC policy WC-400 (CA): estimated premium 600000 cents, minimum premium 300000 cents, payroll estimate 100000, mod 1.20, class code 8810 (rate 40c/$100) -> VOLUNTARY_REPORT"
            - "Allocation 8810 gross 100000 VERIFIED -> manual premium 40000 cents"
          setup_api_calls:
            - { call: "POST /classification-codes", payload: { code: "8810", description: "Clerical", state_code: "CA", coverage_line: "WC", rate_per_100_cents: 40, high_hazard: false, effective_from: "2026-01-01T00:00:00Z", effective_to: "2026-12-31T23:59:59Z" }, as: Underwriter, captures: { cc_a: "$.data.id" } }
            - { call: "POST /policies", payload: { policy_number: "WC-400", insured_name: "Delta", coverage_line: "WC", state_code: "CA", effective_date: "2026-01-01T00:00:00Z", expiration_date: "2026-07-31T00:00:00Z", estimated_annual_premium_cents: 600000, minimum_premium_cents: 300000, payroll_estimate_dollars: 100000, experience_mod_factor: 1.20, class_code_ids: ["${cc_a}"] }, as: Underwriter, captures: { pol: "$.data.id" } }
            - { call: "POST /auditors", payload: { full_name: "Ada Auditor", territory_states: ["CA"], level: "SENIOR" }, as: AuditManager, captures: { aud: "$.data.id" } }
            - { call: "POST /audit-selection-runs", payload: {}, as: AuditManager }
            - { call: "GET /audit-work-orders", payload: { policy_id: "${pol}" }, as: AuditManager, captures: { wo: "$.data[0].id" } }
            - { call: "POST /audit-work-orders/${wo}/assign", payload: { auditor_id: "${aud}" }, as: AuditManager }
            - { call: "POST /audit-work-orders/${wo}/records-requests", payload: { request_type: "PAYROLL_SUMMARY" }, as: AuditManager, captures: { req1: "$.data.id" } }
            - { call: "POST /records-requests/${req1}/receive", payload: {}, as: Auditor, as_user_id: "${aud}" }
            - { call: "GET /audit-work-orders/${wo}", payload: {}, as: AuditManager, captures: { wo_v: "$.data.version" } }
            - { call: "POST /audit-work-orders/${wo}/payroll-allocations", payload: { class_code_id: "${cc_a}", period_start: "2026-01-01T00:00:00Z", period_end: "2026-06-30T00:00:00Z", gross_payroll_dollars: 100000, expected_work_order_version: "${wo_v}" }, as: Auditor, as_user_id: "${aud}", captures: { al1: "$.data.id" } }
            - { call: "POST /payroll-allocations/${al1}/verify", payload: {}, as: Auditor, as_user_id: "${aud}" }
            - { call: "POST /audit-work-orders/${wo}/submit-draft", payload: {}, as: Auditor, as_user_id: "${aud}", captures: { res: "$.data.id" } }
            - { call: "POST /_clock/set_current_utc", payload: { to_iso8601: "2026-08-15T00:00:00Z" }, as: AuditManager }
          trigger:
            - { call: "POST /audit-work-orders/${wo}/issue-result", payload: {}, as: AuditManager, as_user_id: "mgr-1", captures: { earned: "$.data.earned_premium_cents", adj: "$.data.adjustment_cents" } }
          assert:
            - "AuditResult.${res}.manual_premium_cents == 40000 (round_half_up(100000*40/100))"
            - "AuditResult.${res}.earned_premium_cents == 300000 (max(round_half_up(40000*1.20)=48000, minimum 300000) -> floor branch)"
            - "AuditResult.${res}.adjustment_cents == -300000 (300000 - 600000)"
            - "no ModRevision is created: |audited 100000 - estimate 100000| / 100000 = 0 < 0.05 (GET /policies/${pol}/mod-revisions returns empty array)"

      - name: mod_revision_evaluation_order_after_issue
        grounds:
          - calculations.mod_revision
          - calculations.earned_premium
          - entities.AuditResult.fields.mod_factor_applied
        distinguishing_aspect: |
          Mode (c) circular-looking dependency with pinned evaluation order: earned premium must use the PRE-revision
          mod (1.20 captured in mod_factor_applied) while the ModRevision derived from the same finalized payroll
          (95000 vs estimate 100000, ratio -0.05, trunc(-1.0) = -1 step) yields 1.19 and does not touch the issued result.
        test_recipe:
          setup:
            - "WC policy WC-500 (CA): estimated premium 600000, minimum 10000, payroll estimate 100000, mod 1.20, class code 8810 -> VOLUNTARY_REPORT"
            - "Allocation 8810 gross 95000 VERIFIED -> manual 38000 cents; issued at mod 1.20 -> earned 45600"
          setup_api_calls:
            - { call: "POST /classification-codes", payload: { code: "8810", description: "Clerical", state_code: "CA", coverage_line: "WC", rate_per_100_cents: 40, high_hazard: false, effective_from: "2026-01-01T00:00:00Z", effective_to: "2026-12-31T23:59:59Z" }, as: Underwriter, captures: { cc_a: "$.data.id" } }
