        distinguishing_aspect: |
          claim_amount_cents exactly 7_500_000 lands in TIER_3 (floor is inclusive, >=), giving
          filing_fee 400000; a numeric threshold-crossing metric reached via POST /cases.
        test_recipe:
          setup:
