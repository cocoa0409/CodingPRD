      - name: seat_vacancy_cascades_four_hops_and_raises_coverage_by_shrinking_the_denominator
        grounds:
          - state_machines.CommitteeMember.ACTIVE_to_VACATED
          - state_machines.SubCertificationRequest.PENDING_to_VOID
          - calculations.cycle_total_assigned_scope_weight
          - calculations.certification_coverage_pct
          - entities.DisclosureCommitteeCharter.fields.active_voting_member_count
          - entities.DisclosureCommitteeCharter.fields.covered_functions
          - endpoints["POST /disclosure/committee-members/{id}/transitions"].side_effects
        distinguishing_aspect: |
          Vacating one seat propagates up into the charter and sideways into a different aggregate root:
          HOP 1 the member becomes VACATED, HOP 2 the charter's active_voting_member_count drops 3 -> 2
          and OPERATIONS leaves covered_functions, HOP 3 only that member's PENDING sub-certification is
          VOIDed while their already-SUBMITTED row survives, HOP 4 the cycle's
          total_assigned_scope_weight falls 75.00 -> 55.00 and — counter-intuitively —
          certification_coverage_pct RISES from 73.33 to 100.00, because the VOID leaves the numerator
          untouched and removes 20.00 from the denominator. An implementation that voids every row of
          the departing member, or that decrements the aggregate incrementally instead of recomputing
          from the surviving rows, lands on a different pair of numbers.
        test_recipe:
          setup:
            - "An ADOPTED charter (min_quorum_count 2, required_functions [FINANCE, LEGAL]) with three ACTIVE voting non-officer members: FINANCE, LEGAL and OPERATIONS; active_voting_member_count is 3."
            - "A ReportingCycle in CLOSE_OPEN with three sub-certifications: the OPERATIONS member holds a PENDING OPERATIONS row weighted 20.00 and a SUBMITTED LEGAL_CONTINGENCY row weighted 25.00, and the FINANCE member holds a SUBMITTED REVENUE row weighted 30.00."
            - "Before the trigger: total_assigned_scope_weight 75.00, certification_coverage_pct 73.33."
          setup_api_calls:
            - call: "POST /disclosure/charters"
              payload: { name: "Vacancy Charter", version_label: "2026.1", min_quorum_count: 2, required_functions: ["FINANCE", "LEGAL"] }
              as: ComplianceAdmin
              captures: { charter_id: $.data.id }
            - call: "POST /disclosure/charters/${charter_id}/members"
