              payload: { decision: "DISMISS" }
              as: ComplianceOfficer
              as_user_id: "co-001"
          assert:
            - "the setup's last GET confirms Talent.${tb_id}.rights_posture == \"RESTRICTED\" (a SUSPENDED grant restricts without freezing) while Talent.${ta_id} is \"CLEAR\""
            - "case A: severity_score == 0.7850 = 0.60*0.900 + 0.25*0.80 + 0.15*0.30"
            - "case B: severity_score == 0.8300 = 0.60*0.900 + 0.25*0.80 + 0.15*0.60 — exactly 0.0450 above case A, the whole difference attributable to the posture term"
            - "case C: severity_score == 0.8350 = 0.60*0.900 + 0.25*min(1, 2.0) + 0.15*0.30 — the reach term saturates at 0.25 rather than reaching 0.50"
            - "all three scores are reported to exactly four decimal places, and every case starts in \"DETECTED\" with triaged_by_user_id null"
            - "trigger call 4 -> 409 with data.error_id == \"ERR_TAKEDOWN_MANDATORY\", since 0.7850 >= MANDATORY_TAKEDOWN_THRESHOLD 0.7500 forbids a DISMISS, and case A stays \"DETECTED\""

      - name: composed_multiplier_product_is_rounded_exactly_once
        claim_type: precision
        excluded_because:
          difficulty_instance: initial_creation_single_rounding_of_composed_product
          rationale: >-
            The rounding-mode and single-application claim is the §1.8 combinatorial_formula instance,
            which uses the 123457 base whose per-factor rounding (239585) differs from the mandated
            single round_half_up of the composed product (239584).

      - name: severity_at_the_mandatory_takedown_threshold
        claim_type: threshold
        excluded_because:
          difficulty_instance: severity_score_exactly_at_mandatory_takedown_threshold
          rationale: >-
            §1.8 probes MANDATORY_TAKEDOWN_THRESHOLD at exactly 0.7500 and one thousandth below
            (0.7470), asserting the different case status on each side, which is precisely this row's
            threshold-1 / threshold / threshold+1 requirement.

      - name: grant_ledger_running_total_after_add_and_reversal
        claim_type: aggregation
        excluded_because:
          difficulty_instance: ledger_sum_restored_after_provisional_accrual_is_reversed
          rationale: >-
            The append-only ledger's running total is asserted after each accrual and after the
            reversal in §1.8, including the invariant that the sum of entries equals both ancestor
            aggregates at every step.

      - name: royalty_split_fills_participants_then_places_the_remainder
        claim_type: waterfall_allocation
        excluded_because:
          difficulty_instance: royalty_split_per_participant_rounding_with_signed_remainder
          rationale: >-
            Per-participant rounding with the signed remainder assigned to the talent is the allocation
            claim; §1.8 asserts both the positive-entry split (352687 / 94050 / 23513) and the negated
            reversal split for the same amount.

      - name: overlapping_terms_and_windows_are_measured_with_declared_bound_semantics
        claim_type: interval_merge
        excluded_because:
          difficulty_instance: exclusive_consent_term_half_open_adjacency_permitted
          rationale: >-
            Both interval semantics in the scaffold — the grant term's half-open adjacency and the
            distribution window's closed-inclusive touch — are covered by the two §1.8
            resource_temporal_overlap instances, which contrast the adjacent and the one-second
            overlapping case on each.

      - name: provisional_royalty_is_computed_from_projections
        claim_type: forward_looking
        excluded_because:
          difficulty_instance: per_use_royalty_provisional_versus_final_divergence
          rationale: >-
            The provisional variant prices projected_impressions before the use happens and is
            superseded by the final variant priced on actual_impressions; §1.8 asserts both amounts and
            the ledger state between them.

      - name: same_facts_two_state_law_variants_diverge
        claim_type: variant_divergence
        excluded_because:
          difficulty_instance: postmortem_expiry_domicile_versus_use_state_divergence
          rationale: >-
            The second dual-variant calculation — post-mortem expiry under the domicile variant versus
            the use-state variant — is asserted in §1.8 including the TX null (unenforceable) arm that
            no other corner reaches.

      - name: final_variant_is_selected_at_license_issuance
        claim_type: variant_selection
        excluded_because:
          difficulty_instance: per_use_royalty_provisional_versus_final_divergence
          rationale: >-
            Variant selection by context (provisional at performance submission, final at license
            issuance) is asserted in the same §1.8 instance, which checks the entry TYPE on each row in
            addition to the amounts.

      - name: switching_from_provisional_to_final_reconciles_the_ledger
        claim_type: reconciliation
        excluded_because:
          difficulty_instance: ledger_sum_restored_after_provisional_accrual_is_reversed
          rationale: >-
            The delta applied when the variant switches, and the exact restoration of the pre-accrual
            total after the reversal, are the compensating_invariant instance's central assertions.

      - name: posture_recomputation_propagates_to_a_fixed_point
        claim_type: constraint_propagation
        excluded_because:
          difficulty_instance: death_record_three_hop_cascade_to_restricted_posture
          rationale: >-
            rights_posture is derived by propagating case, grant and removal-obligation states up to
            the talent; §1.8 drives the propagation through three hops and asserts the settled value
            after each, so no separate fixed-point corner is needed.

