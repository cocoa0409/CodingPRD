              as: SalesConsultant
              captures: { d3_ev: $.data.id }
            - call: "POST /api/site-evaluations/${d3_ev}/record-findings"
              payload: { foundation_type: "PIERS", utilities_verified: true, permit_number: "P-100", findings_result: "PASS", install_estimate_cents: 350000 }
              as: SiteEvaluator
              as_user_id: "eval-1"
            - call: "POST /api/site-evaluations/${d3_ev}/approve"
              as: InstallationManager
            - call: "GET /api/sales-orders/${d3_ord}"
              as: SalesConsultant
              captures: { d3_ord_v2: $.data.version }
            - call: "POST /api/sales-orders/${d3_ord}/financing-applications"
              payload: { financing_type: "CHATTEL", lender_name: "Cascade Finance", term_months: 240, down_payment_cents: 473600, expected_sales_order_version: "${d3_ord_v2}" }
              as: SalesConsultant
              captures: { d3_app: $.data.id }
            - call: "POST /api/financing-applications/${d3_app}/submit"
              as: SalesConsultant
            - call: "POST /api/financing-applications/${d3_app}/decide"
              payload: { decision: "APPROVE", apr_bps: 725 }
              as: LenderAgent
            - call: "POST /api/home-units/${d3_unit}/title-records"
              payload: { title_type: "MANUFACTURED_CERTIFICATE", state_code: "AL" }
              as: DealershipAdmin
              captures: { d3_tr: $.data.id }
            - call: "POST /api/title-records/${d3_tr}/issue"
              as: DealershipAdmin
            - call: "POST /api/financing-applications/${d3_app}/fund"
              payload: { funded_amount_cents: 8998397 }
              as: LenderAgent
            - call: "POST /api/transport-crews"
              payload: { name: "Crew Alpha", crew_size: 4, can_set_multiwide: true, max_sections_per_window: 2 }
              as: DealershipAdmin
              captures: { d3_crew: $.data.id }
            - call: "POST /api/sales-orders/${d3_ord}/transport-jobs"
              payload: { home_unit_id: "${d3_unit}", crew_id: "${d3_crew}", origin: "DEALER_LOT", distance_miles: 180, scheduled_start_date: "2026-09-01T08:00:00Z", escort_vehicle_count: 2 }
              as: TransportCoordinator
              captures: { d3_job: $.data.id }
            - call: "POST /api/_clock/set_current_utc"
              payload: { to_iso8601: "2026-09-01T10:00:00Z" }
              as: DealershipAdmin
            - call: "POST /api/transport-jobs/${d3_job}/dispatch"
              as: TransportCoordinator
            - call: "POST /api/transport-jobs/${d3_job}/deliver"
              as: TransportCoordinator
            - call: "POST /api/_clock/set_current_utc"
              payload: { to_iso8601: "2026-09-05T10:00:00Z" }
              as: DealershipAdmin
            - call: "POST /api/transport-jobs/${d3_job}/complete-set"
              as: InstallationManager
            - call: "POST /api/_clock/set_current_utc"
              payload: { to_iso8601: "2026-12-05T00:00:00Z" }
              as: DealershipAdmin
          trigger:
            - call: "POST /api/warranty-claims"
              payload: { home_unit_id: "${d3_unit}", sales_order_id: "${d3_ord}", claim_type: "INSTALLATION_DAMAGE", description: "Skirting misaligned", estimated_cost_cents: 120000 }
              as: Customer
              as_user_id: "${d3_cust}"
              captures: { d3_err: $.data.error_id }
            - call: "POST /api/warranty-claims"
              payload: { home_unit_id: "${d3_unit}", sales_order_id: "${d3_ord}", claim_type: "FACTORY_DEFECT", description: "Roof seam leak", estimated_cost_cents: 240000 }
              as: Customer
              as_user_id: "${d3_cust}"
              captures: { d3_claim: $.data.id, d3_window: $.data.coverage_window_end }
          assert:
            - "INSTALLATION_DAMAGE claim rejected with ERR_WARRANTY_EXPIRED (install anchor 2026-09-05 + 90d = 2026-12-04T10:00:00Z inclusive, clock 2026-12-05)"
            - "FACTORY_DEFECT claim succeeds with coverage_window_end == 2027-09-01T10:00:00Z (delivery anchor 2026-09-01 + 365d)"
            - "identical clock and unit, different verdict per anchor variant"

  - rule_id: combinatorial_formula
    instances:
      - name: per_line_discount_rounding_order
        grounds: ["calculations.order_line_pricing", "entities.SalesOrder.fields.discount_cents", "entities.SalesOrder.fields.total_price_cents"]
        distinguishing_aspect: |
          Mode (b): nested rounding order. Discount must be rounded half-up per
          line then summed: 138,000 + 3,752 + 1,350 = 143,102. The forbidden
          whole-subtotal rounding yields 143,101; the one-cent divergence is the
          pinned observable.
        test_recipe:
          setup:
            - "Community-placed DRAFT order: home line 9,200,000; option A 125,050 x2 (line 250,100); option B 89,999 x1 (line 89,999); subtotal 9,540,099 -> tier 1.5%"
          setup_api_calls:
            - call: "POST /api/home-models"
              payload: { model_code: "DW-2860", name: "Pride 2860", floor_plan_type: "DOUBLE_WIDE", section_count: 2, width_ft: 28, length_ft: 60, base_price_cents: 9500000, factory_lead_time_days: 30 }
              as: DealershipAdmin
              captures: { d4_mdl: $.data.id }
            - call: "POST /api/communities"
              payload: { name: "Pinewood MHC", address: "12 Pine Rd", lot_rent_cents: 45000 }
              as: DealershipAdmin
              captures: { d4_com: $.data.id }
            - call: "POST /api/communities/${d4_com}/lots"
              payload: { lot_number: "A-01", max_sections: 2, max_length_ft: 70, utilities_ready: true }
              as: DealershipAdmin
              captures: { d4_lot: $.data.id }
            - call: "POST /api/lots/${d4_lot}/reserve"
              as: SalesConsultant
            - call: "POST /api/customers"
              payload: { full_name: "Alicia Buyer", email: "alicia@x.com", phone: "555-0100", credit_tier: "TIER_A" }
              as: SalesConsultant
              captures: { d4_cust: $.data.id }
            - call: "POST /api/home-units"
              payload: { model_id: "${d4_mdl}", serial_number: "SN-D4-1", unit_kind: "STOCK", condition_grade: "NEW" }
              as: DealershipAdmin
              captures: { d4_unit: $.data.id }
          trigger:
            - call: "POST /api/sales-orders"
              payload: { customer_id: "${d4_cust}", home_unit_id: "${d4_unit}", placement_type: "COMMUNITY_LOT", lot_id: "${d4_lot}", financing_type: "CHATTEL", agreed_home_price_cents: 9200000 }
              as: SalesConsultant
              captures: { d4_ord: $.data.id }
            - call: "POST /api/sales-orders/${d4_ord}/options"
              payload: { option_code: "OPT-APP", description: "Appliance package", unit_price_cents: 125050, quantity: 2 }
              as: SalesConsultant
            - call: "POST /api/sales-orders/${d4_ord}/options"
              payload: { option_code: "OPT-EXT", description: "Exterior package", unit_price_cents: 89999, quantity: 1 }
              as: SalesConsultant
            - call: "GET /api/sales-orders/${d4_ord}"
              as: SalesConsultant
              captures: { d4_disc: $.data.discount_cents, d4_fee: $.data.doc_fee_cents, d4_total: $.data.total_price_cents, d4_opts: $.data.options_total_cents }
          assert:
            - "SalesOrder.${d4_ord}.options_total_cents == 340099"
            - "SalesOrder.${d4_ord}.discount_cents == 143102 (per-line half-up; NOT 143101 whole-subtotal)"
            - "SalesOrder.${d4_ord}.doc_fee_cents == 75000 (1% of 9,396,997 = 93,970 clamped to cap)"
            - "SalesOrder.${d4_ord}.total_price_cents == 9471997"

      - name: transport_quote_conditional_multi_input
        grounds: ["calculations.transport_quote", "entities.TransportJob.fields.quoted_cost_cents"]
        distinguishing_aspect: |
          Mode (a): >=3 inputs with non-linear interaction — per-section mileage,
          conditional escort surcharge, multiwide flat, max() mileage-overage tier,
          weekend branch. Job A (2 sections, 180 mi, 2 escorts, Thursday start)
          quotes 301,200; job B (1 section, 60 mi, 0 escorts, Saturday start)
          quotes 65,000 — no overage below 100 free miles, weekend flat applies.
        test_recipe:
          setup:
            - "Order A: community placement, double-wide unit (2 sections, width 28), canonical pricing, FINANCING_APPROVED"
            - "Order B: private-land placement, narrow single-wide unit (1 section, width 13.9), price 4,200,000 (total 4,242,000, deposit 212,100, financed 4,029,900), FINANCING_APPROVED"
            - "Two crews with capacity 2"
          setup_api_calls:
            - call: "POST /api/home-models"
              payload: { model_code: "DW-2860", name: "Pride 2860", floor_plan_type: "DOUBLE_WIDE", section_count: 2, width_ft: 28, length_ft: 60, base_price_cents: 9500000, factory_lead_time_days: 30 }
              as: DealershipAdmin
              captures: { d5_mdl_a: $.data.id }
            - call: "POST /api/home-models"
              payload: { model_code: "SW-139", name: "Slim 139", floor_plan_type: "SINGLE_WIDE", section_count: 1, width_ft: 13.9, length_ft: 66, base_price_cents: 4200000, factory_lead_time_days: 14 }
              as: DealershipAdmin
              captures: { d5_mdl_b: $.data.id }
            - call: "POST /api/communities"
              payload: { name: "Pinewood MHC", address: "12 Pine Rd", lot_rent_cents: 45000 }
              as: DealershipAdmin
              captures: { d5_com: $.data.id }
            - call: "POST /api/communities/${d5_com}/lots"
              payload: { lot_number: "A-01", max_sections: 2, max_length_ft: 70, utilities_ready: true }
              as: DealershipAdmin
              captures: { d5_lot: $.data.id }
            - call: "POST /api/lots/${d5_lot}/reserve"
              as: SalesConsultant
            - call: "POST /api/customers"
