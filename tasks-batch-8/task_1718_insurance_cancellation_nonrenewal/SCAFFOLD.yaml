      - "status -> UPHELD | OVERTURNED; decided_on_date = current clock date"
      - "On OVERTURNED with EFFECTIVE case: rescind case, restore Policy to ACTIVE, post compensating ledger entry, rescinded_count += 1"
      - "increments Policy.version by 1 on OVERTURNED"

  # --- Regulatory reports ---
  - method: GET
    path: "/carrier/regulatory-reports"
    description: "List RegulatoryReports (auto-created OPEN by cascades)"
    roles: [ComplianceOfficer, Underwriter]
    code: 200
    input: ["state_profile_id?", "report_period?", "status?"]
    output: "RegulatoryReport[]"
    side_effects: []
  - method: GET
    path: "/carrier/regulatory-reports/{reportId}"
    description: "Get a RegulatoryReport"
    roles: [ComplianceOfficer, Underwriter]
    code: 200
    input: []
    output: RegulatoryReport
    side_effects: []
  - method: POST
    path: "/carrier/regulatory-reports/{reportId}/finalize"
    description: "Finalize an OPEN report after its period closes"
    roles: [ComplianceOfficer]
    code: 200
    input: []
    output: RegulatoryReport
    side_effects: ["status -> FINALIZED"]

# =============================================================================
# §1.6 Error Code Catalog
# =============================================================================
errors:
  - { id: ERR_MISSING_AUTH_CONTEXT, http: 400, condition: "X-User-ID or X-User-Role header missing or malformed" }
  - { id: ERR_FORBIDDEN_FOR_ROLE, http: 403, condition: "Caller role not permitted for this endpoint, or actor role does not match the case's requesting role on withdraw" }
  - { id: ERR_NOT_FOUND, http: 404, condition: "Path id does not resolve to an existing resource" }
  - { id: ERR_INVALID_REQUEST, http: 400, condition: "Malformed body: missing required field, invalid enum member, non-positive premium, term_end_date <= term_start_date, or notice recipient_kind/insured_interest_id combination invalid" }
  - { id: ERR_INVALID_STATE, http: 409, condition: "Target resource not in a state admitting the requested transition" }
  - { id: ERR_SEGREGATION_OF_DUTIES, http: 403, condition: "Approver/decider X-User-ID equals the X-User-ID that performed the preceding workflow step" }
  - { id: ERR_GROUND_ROLE_MISMATCH, http: 422, condition: "INSURED_REQUEST submitted by non-Policyholder, or insurer ground submitted by Policyholder" }
  - { id: ERR_GROUND_NOT_PERMITTED_IN_STATE, http: 422, condition: "ground_code absent from the ACTIVE profile's permissible_grounds (and not INSURED_REQUEST)" }
  - { id: ERR_POLICY_NOT_ACTIVE, http: 409, condition: "Policy not ACTIVE when opening a cancellation or nonrenewal case" }
  - { id: ERR_POLICY_NOT_CANCELLED, http: 409, condition: "Reinstatement or appeal action requires Policy.status = CANCELLED" }
  - { id: ERR_CANCELLATION_ALREADY_OPEN, http: 409, condition: "An open CancellationCase already exists for this policy" }
  - { id: ERR_NONRENEWAL_ALREADY_OPEN, http: 409, condition: "An open NonrenewalCase already exists for this policy" }
  - { id: ERR_EFFECTIVE_DATE_TOO_EARLY, http: 422, condition: "scheduled_effective_date earlier than earliest_effective_date" }
  - { id: ERR_NOTICE_SET_INCOMPLETE, http: 422, condition: "Dispatch payload missing the policyholder notice or any per-interest notice" }
  - { id: ERR_NOTICE_PERIOD_SHORTFALL, http: 422, condition: "mailed_on_date + recipient statutory days exceeds scheduled_effective_date" }
  - { id: ERR_MAILING_DATE_IN_FUTURE, http: 422, condition: "mailed_on_date later than current clock date" }
  - { id: ERR_NOTICE_NOT_MAILED, http: 409, condition: "Clock sweep blocked: a notice for the case is QUEUED or RETURNED_UNDELIVERABLE, so cancellation cannot take effect" }
  - { id: ERR_NONRENEWAL_DEADLINE_PASSED, http: 422, condition: "Nonrenewal created after notice_deadline_date" }
  - { id: ERR_NONRENEWAL_CONTENT_INCOMPLETE, http: 422, condition: "content_codes_present does not cover the profile's required nonrenewal_content_codes" }
  - { id: ERR_NONRENEWAL_NOTICE_LATE, http: 422, condition: "Nonrenewal notice mailed_on_date after notice_deadline_date" }
  - { id: ERR_REINSTATEMENT_WINDOW_CLOSED, http: 422, condition: "submitted_on_date beyond cancellation_effective_date + reinstatement_window_days" }
  - { id: ERR_REINSTATEMENT_LIMIT_REACHED, http: 409, condition: "policy.reinstatements_used >= profile.max_reinstatements" }
  - { id: ERR_ALREADY_EFFECTIVE, http: 409, condition: "Rescission attempted on/after scheduled_effective_date" }
  - { id: ERR_STATE_PROFILE_CONFLICT, http: 409, condition: "Another ACTIVE profile with the same state_code exists" }
  - { id: ERR_STATE_PROFILE_IN_USE, http: 409, condition: "Retire blocked: live policies reference the profile" }
  - { id: ERR_DUPLICATE_POLICY_NUMBER, http: 409, condition: "policy_number already in use" }
  - { id: ERR_INTEREST_POLICY_MISMATCH, http: 422, condition: "insured_interest_id belongs to a different policy than the case" }
  - { id: ERR_REPORT_PERIOD_STILL_OPEN, http: 409, condition: "Finalize attempted while current clock month is within report_period" }
  - { id: ERR_STALE_VERSION, http: 412, condition: "expected_policy_version does not match Policy.version at write time" }

# =============================================================================
# §1.7 RBAC Matrix
# =============================================================================
roles:
  - name: ComplianceOfficer
    description: "Carrier compliance officer: activates filing profiles, approves cancellations/nonrenewals/reinstatements, decides appeals, finalizes regulatory reports, drives the test clock. Segregated from case creation."
    identity: "opaque"
    exclusive_operations:
      - "POST /carrier/_clock/set_current_utc"
      - "POST /carrier/state-profiles"
      - "POST /carrier/state-profiles/{profileId}/activate"
      - "POST /carrier/state-profiles/{profileId}/retire"
      - "POST /carrier/cancellation-cases/{caseId}/approve"
      - "POST /carrier/cancellation-cases/{caseId}/rescind"
      - "POST /carrier/nonrenewal-cases/{caseId}/approve"
      - "POST /carrier/nonrenewal-cases/{caseId}/rescind"
      - "POST /carrier/reinstatement-requests/{requestId}/approve"
      - "POST /carrier/reinstatement-requests/{requestId}/deny"
      - "POST /carrier/appeals/{appealId}/accept-for-review"
      - "POST /carrier/appeals/{appealId}/decide"
      - "POST /carrier/regulatory-reports/{reportId}/finalize"
    shared_operations:
      - "All GET endpoints"
  - name: Underwriter
    description: "Carrier underwriter: issues policies, opens cancellation/nonrenewal cases, dispatches notices, files appeals on behalf of mortgagees."
    identity: "opaque"
    exclusive_operations:
      - "POST /carrier/policyholders"
      - "POST /carrier/policies"
      - "POST /carrier/policies/{policyId}/interests"
      - "POST /carrier/nonrenewal-cases"
      - "POST /carrier/cancellation-cases/{caseId}/dispatch-notices"
      - "POST /carrier/nonrenewal-cases/{caseId}/dispatch-notices"
      - "POST /carrier/notices/{noticeId}/confirm-delivery"
      - "POST /carrier/notices/{noticeId}/mark-undeliverable"
    shared_operations:
      - "POST /carrier/cancellation-cases (insurer grounds only)"
      - "POST /carrier/cancellation-cases/{caseId}/withdraw (only when case was underwriter-requested)"
      - "POST /carrier/reinstatement-requests"
      - "POST /carrier/appeals (filed_by = MORTGAGEE)"
      - "All GET endpoints"
  - name: Policyholder
    description: "The named insured: requests insured-initiated cancellation, submits reinstatement requests, files appeals. Must act on own policy (X-User-ID = Policyholder.id)."
    identity: "entity_backed:Policyholder"
    exclusive_operations: []
    shared_operations:
      - "POST /carrier/cancellation-cases (ground_code = INSURED_REQUEST only)"
      - "POST /carrier/cancellation-cases/{caseId}/withdraw (only when case was policyholder-requested)"
      - "POST /carrier/reinstatement-requests"
      - "POST /carrier/appeals (filed_by = POLICYHOLDER)"
      - "All GET endpoints"
