            - "RevenuePool.${rp_id}.gross_revenue_cents is still 500000000, so the refused settle moved no revenue"

      - name: corner_run_post_ledger_sync_reconciles_conference_totals
        claim_type: Ledger sync
        grounds:
          - state_machines.DistributionRun.COMPUTED_to_POSTED
          - entities.Conference.fields.reserve_balance_cents
          - entities.Member.fields.last_full_annual_distribution_cents
        excluded_because:
          difficulty_instance: cross_entity_state_dependency / posting_final_run_depends_on_issued_audit_report
          rationale: "That instance posts the FY2026 FINAL_AUDITED run and asserts the full ancestor-ledger sync - reserve_balance_cents 18000000, funded_ratio_bps 10000, posture OPEN and last_full_annual_distribution_cents 147500000 on all four members - as its success path."

      - name: corner_host_at_risk_is_derived_from_the_hosts_compliance_score
        claim_type: guarded transitions
        grounds:
          - state_machines.ChampionshipEvent.SCHEDULED_to_HOST_AT_RISK
          - calculations.schedule_compliance_score
        excluded_because:
          difficulty_instance: transitive_cascade / withdraw_execution_cascades_to_host_at_risk_depth_five
          rationale: "That instance drives the host's recomputed score below HOST_ELIGIBILITY_SCORE_MIN through a WITHDRAW cascade and asserts the automatic SCHEDULED to HOST_AT_RISK flip as the tail of its chain."

      - name: corner_superseding_run_cascades_prior_lines_to_voided
        claim_type: Cascade down
        grounds:
          - state_machines.DistributionRun.COMPUTED_to_SUPERSEDED
          - state_machines.DistributionLine.ACTIVE_to_VOIDED
          - entities.DistributionRun.fields.superseded_by_run_id
        distinguishing_aspect: |
          Computing a second run on the same pool supersedes the first and voids
          exactly its own lines, while the replacement run's lines stay ACTIVE at
          the identical cent values - and because neither run was ever posted, no
          conference-level counter moves, proving the cascade is confined to the
          run aggregate.
        test_recipe:
          setup:
            - "The conference is OPERATING with an approved FY2027 budget and a reserve of 12000000 cents."
            - "The FY2026 EQUAL_SHARE pool is BOOKS_CLOSED at 4000000 audited cents and carries one COMPUTED FINAL_AUDITED run with four lines."
          setup_api_calls:
            - *c_clock
            - *c_conf
            - *c_v1
            - *c_v2
            - *c_mn
            - *c_ms
            - *c_me
            - *c_mw
            - *c_bp
            - *c_bp_open
            - *c_bal_n
            - *c_bal_s
            - *c_bal_e
            - *c_bal_w
            - *c_bp_close
            - *c_conf_read
            - *c_res12
            - *c_p26
            - *c_p26_open
            - *c_p26_cb
            - *c_p26_read
            - *c_r26
            - call: "GET /revenue-pools/${p26_id}"
              payload: {}
              as: FinanceOfficer
              as_user_id: "u_fin_1"
              captures: { p26_v2: $.data.version }
          trigger:
            - call: "POST /revenue-pools/${p26_id}/distribution-runs"
              payload: { variant: "FINAL_AUDITED", expected_pool_version: "${p26_v2}", memo: "recompute" }
              as: FinanceOfficer
              as_user_id: "u_fin_1"
              captures: { r26b_id: $.data.id }
          assert:
            - "DistributionRun.${r26_id}.status == \"SUPERSEDED\" and .superseded_by_run_id == ${r26b_id}"
            - "GET /distribution-runs/${r26_id}/lines returns 4 rows and every row has status == \"VOIDED\""
            - "DistributionRun.${r26b_id}.status == \"COMPUTED\" with net_pool_cents 596000000, reserve_draw_cents 6000000, distributable_cents 590000000 and total_weight_bps 40000"
            - "GET /distribution-runs/${r26b_id}/lines returns 4 ACTIVE rows, each with gross_share_cents == 147500000, governance_fee_cents == 1250000, withheld_cents == 0 and net_payable_cents == 146250000"
            - "Conference.reserve_balance_cents is still 12000000, .escrow_balance_cents is still 0 and .governance_fee_revenue_cents is still 0, because neither run has been posted"
            - "every member still has last_full_annual_distribution_cents == 0"

      - name: corner_run_reverse_compensates_every_conference_counter
        claim_type: Compensation
        grounds:
          - state_machines.DistributionRun.POSTED_to_REVERSED
          - entities.Conference.fields.governance_fee_revenue_cents
          - entities.Conference.fields.reserve_balance_cents
          - calculations.pool_reconciliation_identity
        distinguishing_aspect: |
          Reversing a POSTED run must undo each cent side effect exactly: the
          reserve falls from 18000000 back to 12000000 (posture OPEN both times but
          funded_ratio_bps 10000 then 6666) and governance fee revenue falls from
          5000000 back to 0, while last_full_annual_distribution_cents is
          deliberately NOT rolled back because it is absent from the REVERSED
          transition's side-effect list.
        test_recipe:
          setup:
            - "The conference is OPERATING with an approved FY2027 budget and a reserve of 12000000 cents against an 18000000 cent target."
            - "The FY2026 EQUAL_SHARE run computed by u_fin_1 has an ISSUED audit report and has been posted by u_trs_1."
