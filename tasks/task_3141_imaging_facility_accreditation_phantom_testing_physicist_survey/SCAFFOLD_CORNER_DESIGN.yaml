  - name: phantom_test_scored_twice_returns_already_terminal
    claim_type: Terminal State Lockdown
    grounds:
    - state_machines.PhantomTest.ACQUIRED_to_SCORED
    - errors.ERR_ALREADY_TERMINAL
    excluded_because:
      difficulty_instance: priority_pair_validation_conflict / state_versus_business_referential_on_phantom_scoring
      rationale: The named §1.8 instance re-scores an already-scored phantom test and asserts ERR_ALREADY_TERMINAL, which is exactly this corner's claim.
  - name: clinical_submission_cancelled_after_acceptance_is_refused
    claim_type: Idempotency
    grounds:
    - state_machines.ClinicalImageSubmission.PENDING_REVIEW_to_ACCEPTED
    - errors.ERR_INVALID_STATE
    excluded_because:
      difficulty_instance: cross_entity_state_dependency / clinical_review_accept_gated_by_technologist_roster_state
      rationale: The named §1.8 instance covers the review-side state gate on the same terminal-state lock; a second copy would assert the same invalid-from rejection.
