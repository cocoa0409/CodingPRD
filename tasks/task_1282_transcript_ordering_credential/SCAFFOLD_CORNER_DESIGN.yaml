  # =========================================================================
  # Section 4: Validations
  # =========================================================================
  - section: validations
    instances:
      - name: unauthenticated_request_returns_401
        claim_type: violation_to_error
        grounds: ["validations[priority=1]", "errors[ERR_UNAUTHENTICATED]"]
        distinguishing_aspect: "Missing X-User-Role/X-User-ID headers -> ERR_UNAUTHENTICATED (401)."
        test_recipe:
          setup: ["Empty DB"]
          setup_api_calls: []
          trigger:
            - call: "GET /registrar/students"
              payload: {}
              as: __NO_AUTH__   # placeholder consumed by test generator as "omit auth headers"
              captures: { err: $.data.error_id }
          assert:
            - "err == ERR_UNAUTHENTICATED"
            - "HTTP status == 401"

      - name: unauthorized_role_returns_403
        claim_type: violation_to_error
        grounds: ["validations[priority=2]", "errors[ERR_UNAUTHORIZED]"]
        distinguishing_aspect: "A Student role attempting to create a FeeSchedule (RegistrarAdmin exclusive) -> ERR_UNAUTHORIZED."
        test_recipe:
          setup: ["Empty DB"]
          setup_api_calls:
            - call: "POST /registrar/_clock/set_current_utc"
              payload: { to_iso8601: "2026-08-01T00:00:00Z" }
              as: RegistrarAdmin
          trigger:
            - call: "POST /registrar/fee-schedules"
              payload:
                code: "FS-DENY"
                official_base_cents: 1000
                unofficial_base_cents: 500
                paper_surcharge_cents: 200
                pickup_surcharge_cents: 100
                rush_flat_cents: 1500
                rush_multiplier_bp: 15000
                volume_tiers: []
                effective_from: "2026-08-01T00:00:00Z"
              as: Student
              as_user_id: "00000000-0000-0000-0000-000000000001"
              captures: { err: $.data.error_id }
          assert:
            - "err == ERR_UNAUTHORIZED"
            - "HTTP status == 403"

      - name: hold_release_wrong_office_returns_office_mismatch
        claim_type: violation_to_error
        grounds: ["validations[priority=9]", "errors[ERR_HOLD_OFFICE_MISMATCH]"]
        distinguishing_aspect: "A FINANCIAL hold release attempted by LibraryOffice -> ERR_HOLD_OFFICE_MISMATCH."
        test_recipe:
          setup: ["Student with FINANCIAL hold"]
          setup_api_calls:
            - call: "POST /registrar/_clock/set_current_utc"
              payload: { to_iso8601: "2026-08-01T00:00:00Z" }
              as: RegistrarAdmin
            - call: "POST /registrar/students"
              payload: { student_number: "SC002001", full_name: "HO T", date_of_birth: "2000-01-01", email: "ho@x.edu" }
              as: RegistrarAdmin
              captures: { sid: $.data.id }
            - call: "POST /registrar/holds"
              payload: { student_id: "${sid}", hold_type: "FINANCIAL", blocking_scope: "OFFICIAL", amount_cents: 5000 }
              as: BursarOffice
              captures: { hid: $.data.id }
          trigger:
            - call: "POST /registrar/holds/${hid}/release"
              payload: {}
              as: LibraryOffice
              captures: { err: $.data.error_id }
          assert:
            - "err == ERR_HOLD_OFFICE_MISMATCH"
            - "HTTP status == 403"

      - name: schedule_window_inverted_returns_invalid
        claim_type: violation_to_error
        grounds: ["validations[priority=15]", "errors[ERR_SCHEDULE_WINDOW_INVALID]"]
        distinguishing_aspect: "FeeSchedule with effective_from >= effective_to is rejected."
        test_recipe:
          setup: ["Empty DB"]
          setup_api_calls:
            - call: "POST /registrar/_clock/set_current_utc"
              payload: { to_iso8601: "2026-08-01T00:00:00Z" }
              as: RegistrarAdmin
          trigger:
            - call: "POST /registrar/fee-schedules"
              payload:
                code: "FS-BAD"
                official_base_cents: 1000
                unofficial_base_cents: 500
                paper_surcharge_cents: 200
                pickup_surcharge_cents: 100
                rush_flat_cents: 1500
                rush_multiplier_bp: 15000
                volume_tiers: []
                effective_from: "2026-09-01T00:00:00Z"
                effective_to: "2026-08-01T00:00:00Z"
              as: RegistrarAdmin
              captures: { err: $.data.error_id }
          assert:
            - "err == ERR_SCHEDULE_WINDOW_INVALID"

      - name: consent_grant_past_expiry_rejected
        claim_type: violation_to_error
        grounds: ["validations[priority=13]", "errors[ERR_CONSENT_EXPIRED]"]
        distinguishing_aspect: "ConsentGrant with expires_at <= clock.now() is rejected at creation."
        test_recipe:
          setup: ["Student exists; clock at 2026-08-01"]
          setup_api_calls:
            - call: "POST /registrar/_clock/set_current_utc"
              payload: { to_iso8601: "2026-08-01T00:00:00Z" }
              as: RegistrarAdmin
            - call: "POST /registrar/students"
              payload: { student_number: "SC002101", full_name: "CG T", date_of_birth: "2000-01-01", email: "cg@x.edu" }
              as: RegistrarAdmin
              captures: { sid: $.data.id }
          trigger:
            - call: "POST /registrar/consent-grants"
              payload:
                student_id: "${sid}"
                grantee_name: "X"
                scope: "DEGREE_ONLY"
                expires_at: "2026-07-01T00:00:00Z"
              as: Student
              as_user_id: "${sid}"
              captures: { err: $.data.error_id }
          assert:
            - "err == ERR_CONSENT_EXPIRED"

      - name: idempotency_key_reuse_with_different_payload_returns_conflict
        claim_type: violation_to_error
        grounds: ["validations[priority=19]", "errors[ERR_IDEMPOTENCY_CONFLICT]"]
        distinguishing_aspect: "Re-using the same idempotency_key against a different order returns ERR_IDEMPOTENCY_CONFLICT."
        test_recipe:
          setup: ["Two DRAFT orders o1, o2 for same student; both submitted; payment authorized on o1 with key K"]
          setup_api_calls:
            - call: "POST /registrar/_clock/set_current_utc"
