            - { call: "POST /api/spec-items/${s_id}/brand-review", payload: { decision: "APPROVE" }, as: BrandApprover }
            - { call: "POST /api/bids", payload: { spec_item_id: "${s_id}", vendor_name: "VENDA", unit_price_cents: 10000, freight_estimate_cents: 0, lead_time_days: 7 }, as: Vendor, captures: { b_id: $.data.id } }
            - { call: "POST /api/bids/${b_id}/sample-decision", payload: { outcome: "APPROVED" }, as: PurchasingAgent }
            - { call: "POST /api/bids/${b_id}/award", as: PurchasingAgent }
            - { call: "POST /api/purchase-orders", payload: { project_id: "${p_id}", vendor_name: "VENDA" }, as: PurchasingAgent, captures: { po_id: $.data.id } }
            - { call: "POST /api/purchase-orders/${po_id}/lines", payload: { spec_item_id: "${s_id}", quantity_ordered: 10, declared_cube_m3: 5 }, as: PurchasingAgent, captures: { l_id: $.data.id } }
            - { call: "POST /api/purchase-orders/${po_id}/transitions", payload: { axis: "FULFILLMENT", to_status: "ACKNOWLEDGED" }, as: Vendor }
            - { call: "POST /api/purchase-orders/${po_id}/transitions", payload: { axis: "FULFILLMENT", to_status: "READY_TO_SHIP" }, as: Vendor }
            - { call: "POST /api/shipments", payload: { project_id: "${p_id}", carrier_name: "CARR" }, as: PurchasingAgent, captures: { sh_id: $.data.id } }
            - { call: "POST /api/shipments/${sh_id}/transitions", payload: { to_status: "CONSOLIDATING" }, as: PurchasingAgent }
            - { call: "POST /api/shipments/${sh_id}/purchase-orders", payload: { purchase_order_id: "${po_id}" }, as: PurchasingAgent }
            - { call: "POST /api/shipments/${sh_id}/transitions", payload: { to_status: "SEALED" }, as: PurchasingAgent }
            - { call: "POST /api/shipments/${sh_id}/transitions", payload: { to_status: "IN_TRANSIT" }, as: PurchasingAgent }
            - { call: "POST /api/receiving-events", payload: { shipment_id: "${sh_id}", lines: [ { po_line_id: "${l_id}", qty_received: 10, qty_damaged: 0 } ] }, as: WarehouseReceiver, captures: { ev_id: $.data.id } }
            - { call: "POST /api/receiving-events/${ev_id}/transitions", payload: { to_status: "POSTED" }, as: WarehouseReceiver }
            - { call: "POST /api/rooms", payload: { project_id: "${p_id}", floor_number: 8, room_number: "R-802", room_type: "GUEST_KING" }, as: InstallationManager, captures: { r_id: $.data.id } }
            - { call: "POST /api/installation-windows", payload: { project_id: "${p_id}", floor_number: 8, start_date: "2026-08-10", end_date: "2026-08-12", crew_count: 1 }, as: InstallationManager, captures: { w_id: $.data.id } }
            - { call: "POST /api/installation-tasks", payload: { window_id: "${w_id}", room_id: "${r_id}", po_line_id: "${l_id}", quantity: 3 }, as: InstallationManager, captures: { t_id: $.data.id } }
            - { call: "POST /api/installation-windows/${w_id}/transitions", payload: { to_status: "RELEASED" }, as: InstallationManager }
          trigger:
            - { call: "POST /api/installation-windows/${w_id}/transitions", payload: { to_status: "CANCELLED" }, as: InstallationManager, captures: { w_status: $.data.status } }
            - { call: "GET /api/installation-tasks/${t_id}", as: InstallationManager, captures: { t_status: $.data.status } }
            - { call: "GET /api/po-lines/${l_id}", as: PurchasingAgent }
          assert:
            - "Window status == CANCELLED; task cascades SCHEDULED -> CANCELLED"
            - "POLine.${l_id}.qty_installable remains 10 and qty_installed == 0 (cancel consumes no stock)"

      - name: lifecycle_cancel_happy_path_and_terminal_lockdown
        claim_type: terminal_state_lockdown
        grounds: ["state_machines.FFEProject", "errors[ERR_INVALID_LIFECYCLE_TRANSITION]"]
        distinguishing_aspect: "A PLANNING project with no active POs cancels cleanly, and once CANCELLED every further lifecycle call is rejected."
        test_recipe:
          setup: ["Project exists (PLANNING, no POs)"]
          setup_api_calls:
            - { call: "POST /api/projects", payload: { name: "P-S17", hotel_name: "H", brand_program: "MARQUEE_LUXE", total_budget_cents: 5000000 }, as: PurchasingAgent, captures: { p_id: $.data.id } }
          trigger:
            - { call: "POST /api/projects/${p_id}/lifecycle-transitions", payload: { to_status: "CANCELLED" }, as: PurchasingAgent, captures: { st: $.data.status } }
            - { call: "POST /api/projects/${p_id}/lifecycle-transitions", payload: { to_status: "PROCUREMENT" }, as: PurchasingAgent, captures: { err: $.data.error_id } }
          assert:
            - "Cancel succeeds: status == CANCELLED"
            - "Any further transition from CANCELLED: 409 ERR_INVALID_LIFECYCLE_TRANSITION (terminal state)"

      - name: project_completion_locks_specs
        claim_type: side_effect_execution
        grounds: ["state_machines.FFEProject.INSTALLATION_to_COMPLETED", "state_machines.SpecItem.BRAND_APPROVED_to_LOCKED"]
        distinguishing_aspect: "Completing a project with no outstanding windows or claims cascades a terminal lock onto every BRAND_APPROVED spec."
        test_recipe:
          setup: ["Project with budget line and one BRAND_APPROVED spec; advanced PROCUREMENT -> INSTALLATION; no windows, no claims, no POs"]
          setup_api_calls:
            - { call: "POST /api/projects", payload: { name: "P-S18", hotel_name: "H", brand_program: "MARQUEE_LUXE", total_budget_cents: 5000000 }, as: PurchasingAgent, captures: { p_id: $.data.id } }
            - { call: "POST /api/budget-lines", payload: { project_id: "${p_id}", category: "DECOR", budgeted_cents: 500000 }, as: PurchasingAgent }
            - { call: "POST /api/spec-items", payload: { project_id: "${p_id}", category: "DECOR", description: "Lobby art", brand_standard_ref: "ML-A", quantity_per_room: 1, room_count: 2, unit_budget_cents: 40000 }, as: PurchasingAgent, captures: { s_id: $.data.id } }
            - { call: "POST /api/spec-items/${s_id}/submit", as: PurchasingAgent }
            - { call: "POST /api/spec-items/${s_id}/brand-review", payload: { decision: "APPROVE" }, as: BrandApprover }
            - { call: "POST /api/projects/${p_id}/lifecycle-transitions", payload: { to_status: "PROCUREMENT" }, as: PurchasingAgent }
            - { call: "POST /api/projects/${p_id}/lifecycle-transitions", payload: { to_status: "INSTALLATION" }, as: PurchasingAgent }
          trigger:
            - { call: "POST /api/projects/${p_id}/lifecycle-transitions", payload: { to_status: "COMPLETED" }, as: PurchasingAgent, captures: { st: $.data.status } }
            - { call: "GET /api/spec-items/${s_id}", as: PurchasingAgent, captures: { s_status: $.data.status } }
          assert:
            - "Project reaches COMPLETED (terminal)"
            - "SpecItem.${s_id}.status == LOCKED (cascade on completion)"

      - name: seal_empty_shipment_rejected
        claim_type: precondition_enforcement
        grounds: ["state_machines.Shipment.CONSOLIDATING_to_SEALED", "errors[ERR_SHIPMENT_EMPTY]"]
        distinguishing_aspect: "A CONSOLIDATING shipment with no attached POs cannot be sealed."
        test_recipe:
          setup: ["Project in PROCUREMENT with a budget line; shipment opened to CONSOLIDATING, nothing attached"]
          setup_api_calls:
            - { call: "POST /api/projects", payload: { name: "P-S19", hotel_name: "H", brand_program: "MARQUEE_SELECT", total_budget_cents: 5000000 }, as: PurchasingAgent, captures: { p_id: $.data.id } }
            - { call: "POST /api/budget-lines", payload: { project_id: "${p_id}", category: "FREIGHT", budgeted_cents: 1000000 }, as: PurchasingAgent }
            - { call: "POST /api/projects/${p_id}/lifecycle-transitions", payload: { to_status: "PROCUREMENT" }, as: PurchasingAgent }
            - { call: "POST /api/shipments", payload: { project_id: "${p_id}", carrier_name: "CARR" }, as: PurchasingAgent, captures: { sh_id: $.data.id } }
            - { call: "POST /api/shipments/${sh_id}/transitions", payload: { to_status: "CONSOLIDATING" }, as: PurchasingAgent }
          trigger:
            - { call: "POST /api/shipments/${sh_id}/transitions", payload: { to_status: "SEALED" }, as: PurchasingAgent, captures: { err: $.data.error_id } }
          assert:
            - "HTTP 409 with error_id == ERR_SHIPMENT_EMPTY; freight_mode and freight_total_cents remain null; status remains CONSOLIDATING"
