              as: Artist
              as_user_id: "u-artist-01"
            - call: "POST /studio/assets/${a_id}/library-submit"
              payload: {}
              as: Artist
              as_user_id: "u-artist-01"
              captures: { a_lib_candidate: "$.data.library_status" }
            - call: "POST /studio/assets"
              payload: { production_id: "${prod_id}", asset_code: "AD01_CHAR_RIVAL", asset_type: "CHARACTER_MODEL", base_complexity_points: 200.00, derived_from_asset_id: "${a_id}" }
              as: Artist
              as_user_id: "u-artist-01"
              captures: { b_id: "$.data.id", b_depth_before: "$.data.reuse_depth", b_disc_before: "$.data.reuse_discount_pct", b_points_before: "$.data.effective_complexity_points" }
          trigger:
            - call: "POST /studio/assets/${a_id}/library-decision"
              payload: { decision: "APPROVED" }
              as: Supervisor
              as_user_id: "u-sup-01"
              captures: { a_lib_after: "$.data.library_status", a_decider: "$.data.library_decided_by_user_id", a_points_after: "$.data.effective_complexity_points" }
            - call: "GET /studio/assets/${b_id}"
              as: Artist
              captures: { b_disc_after: "$.data.reuse_discount_pct", b_points_after: "$.data.effective_complexity_points", b_stale_after: "$.data.reuse_source_stale", b_version: "$.data.version" }
            - call: "GET /studio/assets?production_id=${prod_id}&derived_from_asset_id=${a_id}"
              as: Artist
              captures: { list_points: "$.data[0].effective_complexity_points" }
          assert:
            - "${a_lib_candidate} == LIBRARY_CANDIDATE and ${b_depth_before} == 1 with ${b_disc_before} == 0.00 and ${b_points_before} == 200.00 — depth alone earns nothing"
            - "${a_lib_after} == LIBRARY_APPROVED with ${a_decider} == u-sup-01 and ${a_points_after} == 300.00 (the root keeps its own points)"
            - "${b_disc_after} == 0.40 and ${b_points_after} == 120.00 on the first read after the decision, with ${b_stale_after} == false"
            - "${list_points} == 120.00 — the list projection agrees with the single read, so no cached copy lags behind"
            - "${b_version} == 1: the descendant's derived fields changed without any write to the descendant row"
