              as: StationAdmin
            - call: "POST /station/pledge-drives/${drv14_id}/schedule"
              payload: {}
              as: StationAdmin
            - call: "POST /station/pledge-drives/${drv14_id}/go-live"
              payload: {}
              as: StationAdmin
            - call: "POST /station/pledges"
              payload: { donor_id: "${donor14_id}", membership_id: "${mem14_id}", drive_id: "${drv14_id}", channel: "WEB", kind: "SUSTAINER", amount_cents: 500 }
              as: PhoneVolunteer
              captures: { plg14_id: $.data.id, plg14_v: $.data.version }
            - call: "POST /station/_clock/set_current_utc"
              payload: { to_iso8601: "2027-10-15T00:00:00Z" }
              as: StationAdmin
          trigger:
            - call: "POST /station/pledges/${plg14_id}/payments"
              payload: { amount_cents: 500, expected_pledge_version: "${plg14_v}" }
              as: PhoneVolunteer
              captures: { err_lapsed_pay: $.data.error_id }
          assert:
            - "Membership.${mem14_id}.status == LAPSED at trigger time (never paid -> period end == creation, grace elapsed)"
            - "SUSTAINER payment against LAPSED membership rejected (cross-entity state dependency Pledge -> Membership)"
            - "${err_lapsed_pay} == ERR_INVALID_STATE"

  # ===========================================================================
  # Rule 8 — resource_temporal_overlap (different interval semantics)
  # ===========================================================================
  - rule_id: resource_temporal_overlap
    instances:
      - name: break_overlap_with_buffer_semantics
        grounds:
          - validations[priority=6]
          - entities.OnAirBreak.fields.starts_at
        distinguishing_aspect: |
          OnAirBreak intervals use half-open [start, end) PLUS a mandatory
          5-minute buffer: a break starting at exactly another's end + 5 min
          is allowed, one starting at end + 4 min is rejected — buffered
          interval semantics on the OnAirBreak resource.
        test_recipe:
          setup:
            - "Level BASIC; drive DRV (DRAFT) with break B1 [18:00, 18:20)"
          setup_api_calls:
            - call: "POST /station/membership-levels"
              payload: { code: "BASIC", min_annual_cents: 6000, min_monthly_sustainer_cents: 500 }
              as: StationAdmin
            - call: "POST /station/pledge-drives"
              payload: { name: "Fall 2026", starts_at: "2026-08-01T00:00:00Z", ends_at: "2026-08-15T00:00:00Z", goal_cents: 100000 }
              as: StationAdmin
              captures: { drv15_id: $.data.id, drv15_v: $.data.version }
            - call: "POST /station/pledge-drives/${drv15_id}/breaks"
              payload: { starts_at: "2026-08-02T18:00:00Z", ends_at: "2026-08-02T18:20:00Z", program_title: "Evening Pledge", pitch_level_code: "BASIC", expected_drive_version: "${drv15_v}" }
              as: StationAdmin
            - call: "GET /station/pledge-drives/${drv15_id}"
              payload: {}
              as: StationAdmin
              captures: { drv15_v2: $.data.version }
          trigger:
            - call: "POST /station/pledge-drives/${drv15_id}/breaks"
              payload: { starts_at: "2026-08-02T18:24:00Z", ends_at: "2026-08-02T18:40:00Z", program_title: "Late Pledge A", pitch_level_code: "BASIC", expected_drive_version: "${drv15_v2}" }
              as: StationAdmin
              captures: { err_buf: $.data.error_id }
            - call: "GET /station/pledge-drives/${drv15_id}"
              payload: {}
              as: StationAdmin
              captures: { drv15_v3: $.data.version }
            - call: "POST /station/pledge-drives/${drv15_id}/breaks"
              payload: { starts_at: "2026-08-02T18:25:00Z", ends_at: "2026-08-02T18:40:00Z", program_title: "Late Pledge B", pitch_level_code: "BASIC", expected_drive_version: "${drv15_v3}" }
              as: StationAdmin
              captures: { brk_ok_id: $.data.id }
          assert:
            - "break at 18:24 (end + 4 min) rejected with ERR_BREAK_OVERLAP (${err_buf} == ERR_BREAK_OVERLAP)"
            - "break at 18:25 (end + exactly 5 min buffer) accepted (${brk_ok_id} is a non-empty UUID)"

      - name: drive_overlap_half_open_no_buffer
        grounds:
          - validations[priority=11]
          - entities.PledgeDrive.fields.starts_at
        distinguishing_aspect: |
          Different interval semantics on a different resource: PledgeDrive
          overlap uses pure half-open [starts_at, ends_at) with NO buffer —
          a drive starting exactly when another SCHEDULED drive ends is
          allowed, while a 1-minute overlap is rejected. Buffer-vs-no-buffer
          distinguishes this from the OnAirBreak rule.
        test_recipe:
          setup:
            - "Level BASIC; drive DRV1 SCHEDULED covering [2026-08-01, 2026-08-15)"
            - "Drive DRV2 (DRAFT) covering [2026-08-14T00:00:00Z, 2026-08-30) — overlaps DRV1 by 1 day"
            - "Drive DRV3 (DRAFT) covering [2026-08-15T00:00:00Z, 2026-08-30) — touches DRV1's end exactly"
          setup_api_calls:
            - call: "POST /station/membership-levels"
              payload: { code: "BASIC", min_annual_cents: 6000, min_monthly_sustainer_cents: 500 }
              as: StationAdmin
            - call: "POST /station/pledge-drives"
              payload: { name: "Fall 2026 A", starts_at: "2026-08-01T00:00:00Z", ends_at: "2026-08-15T00:00:00Z", goal_cents: 100000 }
              as: StationAdmin
              captures: { drvA_id: $.data.id, drvA_v: $.data.version }
            - call: "POST /station/pledge-drives/${drvA_id}/breaks"
              payload: { starts_at: "2026-08-02T18:00:00Z", ends_at: "2026-08-02T18:20:00Z", program_title: "Evening Pledge", pitch_level_code: "BASIC", expected_drive_version: "${drvA_v}" }
              as: StationAdmin
            - call: "POST /station/pledge-drives/${drvA_id}/schedule"
              payload: {}
              as: StationAdmin
            - call: "POST /station/pledge-drives"
              payload: { name: "Fall 2026 B", starts_at: "2026-08-14T00:00:00Z", ends_at: "2026-08-30T00:00:00Z", goal_cents: 50000 }
              as: StationAdmin
              captures: { drvB_id: $.data.id, drvB_v: $.data.version }
            - call: "POST /station/pledge-drives"
              payload: { name: "Fall 2026 C", starts_at: "2026-08-15T00:00:00Z", ends_at: "2026-08-30T00:00:00Z", goal_cents: 50000 }
              as: StationAdmin
              captures: { drvC_id: $.data.id, drvC_v: $.data.version }
            - call: "POST /station/pledge-drives/${drvB_id}/breaks"
              payload: { starts_at: "2026-08-16T18:00:00Z", ends_at: "2026-08-16T18:20:00Z", program_title: "Evening Pledge B", pitch_level_code: "BASIC", expected_drive_version: "${drvB_v}" }
              as: StationAdmin
            - call: "POST /station/pledge-drives/${drvC_id}/breaks"
              payload: { starts_at: "2026-08-16T18:00:00Z", ends_at: "2026-08-16T18:20:00Z", program_title: "Evening Pledge C", pitch_level_code: "BASIC", expected_drive_version: "${drvC_v}" }
              as: StationAdmin
          trigger:
            - call: "POST /station/pledge-drives/${drvB_id}/schedule"
              payload: {}
              as: StationAdmin
              captures: { err_drv_overlap: $.data.error_id }
            - call: "POST /station/pledge-drives/${drvC_id}/schedule"
              payload: {}
              as: StationAdmin
              captures: { drvC_status: $.data.status }
          assert:
            - "DRV2 overlapping DRV1 by 1 day rejected with ERR_DRIVE_OVERLAP (${err_drv_overlap} == ERR_DRIVE_OVERLAP)"
            - "DRV3 starting exactly at DRV1's ends_at is allowed (half-open, no buffer) and schedules successfully (${drvC_status} == SCHEDULED)"

  # ===========================================================================
  # Rule 9 — compensating_invariant (different conserved quantities)
  # ===========================================================================
  - rule_id: compensating_invariant
    instances:
      - name: decline_restores_drive_collected_total
        grounds:
          - calculations.drive_totals_rollup
          - state_machines.Pledge.PLEDGED_or_PARTIAL_to_DECLINED
        distinguishing_aspect: |
          Conserved quantity: PledgeDrive.collected_cents. A payment adds
          net_collected and the paired decline subtracts exactly the same
          net_collected, so after pay-then-decline the drive's
          collected_cents returns to its pre-payment value (zero drift).
        test_recipe:
          setup:
            - "Level BASIC; donor D; membership M; drive DRV ON_AIR with collected_cents == 0"
            - "Pledge P 12000 no premium"
          setup_api_calls:
            - call: "POST /station/membership-levels"
              payload: { code: "BASIC", min_annual_cents: 6000, min_monthly_sustainer_cents: 500 }
              as: StationAdmin
            - call: "POST /station/donors"
              payload: { email: "d15@x.com", full_name: "Donor Fifteen", postal_code: "97215" }
              as: MembershipCoordinator
              captures: { donor15_id: $.data.id }
            - call: "POST /station/memberships"
              payload: { donor_id: "${donor15_id}", level_code: "BASIC" }
              as: MembershipCoordinator
              captures: { mem15_id: $.data.id }
            - call: "POST /station/pledge-drives"
              payload: { name: "Fall 2026", starts_at: "2026-08-01T00:00:00Z", ends_at: "2026-08-15T00:00:00Z", goal_cents: 100000 }
              as: StationAdmin
              captures: { drv15b_id: $.data.id, drv15b_v: $.data.version }
            - call: "POST /station/pledge-drives/${drv15b_id}/breaks"
              payload: { starts_at: "2026-08-02T18:00:00Z", ends_at: "2026-08-02T18:20:00Z", program_title: "Evening Pledge", pitch_level_code: "BASIC", expected_drive_version: "${drv15b_v}" }
              as: StationAdmin
            - call: "POST /station/pledge-drives/${drv15b_id}/schedule"
              payload: {}
              as: StationAdmin
            - call: "POST /station/pledge-drives/${drv15b_id}/go-live"
              payload: {}
              as: StationAdmin
            - call: "POST /station/pledges"
              payload: { donor_id: "${donor15_id}", membership_id: "${mem15_id}", drive_id: "${drv15b_id}", channel: "PHONE", kind: "ONE_TIME", amount_cents: 12000 }
              as: PhoneVolunteer
              captures: { plg15_id: $.data.id, plg15_v: $.data.version }
            - call: "POST /station/pledges/${plg15_id}/payments"
              payload: { amount_cents: 12000, expected_pledge_version: "${plg15_v}" }
              as: PhoneVolunteer
            - call: "GET /station/pledge-drives/${drv15b_id}"
              payload: {}
              as: StationAdmin
              captures: { drv_collected_after_pay: $.data.collected_cents }
          trigger:
            - call: "POST /station/pledges/${plg15_id}/decline"
              payload: { reason: "donor disputed charge" }
              as: PhoneVolunteer
            - call: "GET /station/pledge-drives/${drv15b_id}"
              payload: {}
              as: StationAdmin
              captures: { drv_collected_final: $.data.collected_cents, drv_pledged_final: $.data.pledged_cents }
          assert:
            - "after payment, PledgeDrive.collected_cents == 12000 (${drv_collected_after_pay} == 12000)"
            - "after decline, PledgeDrive.collected_cents == 0 — invariant restored, no drift (${drv_collected_final} == 0)"
            - "after decline, PledgeDrive.pledged_cents == 0 (${drv_pledged_final} == 0)"

      - name: reservation_release_conserves_lot_quantity_identity
        grounds:
          - state_machines.PremiumReservation.HELD_to_RELEASED
          - entities.PremiumInventoryLot.fields.available_qty
        distinguishing_aspect: |
          Different conserved quantity — lot unit conservation:
          available_qty + reserved_qty + committed_qty + written_off_qty ==
          total_qty at every step. Reserve then release returns
          available_qty to total_qty with reserved_qty == 0 — compensating
          action leaves the named identity unchanged.
        test_recipe:
          setup:
            - "Level BASIC; premium MUG lot of 5 (total 5, available 5)"
            - "Donor D; membership M; drive DRV ON_AIR; pledge P with MUG -> reservation HELD"
          setup_api_calls:
            - call: "POST /station/membership-levels"
              payload: { code: "BASIC", min_annual_cents: 6000, min_monthly_sustainer_cents: 500 }
              as: StationAdmin
            - call: "POST /station/premiums"
              payload: { sku: "MUG", title: "Station Mug", fair_market_value_cents: 2500, membership_level_code: "BASIC" }
              as: StationAdmin
              captures: { prem_mug5_id: $.data.id }
            - call: "POST /station/premiums/${prem_mug5_id}/lots"
              payload: { received_at: "2026-07-15T00:00:00Z", unit_cost_cents: 800, total_qty: 5 }
              as: MembershipCoordinator
              captures: { lot5_id: $.data.id }
            - call: "POST /station/donors"
              payload: { email: "d16@x.com", full_name: "Donor Sixteen", postal_code: "97216" }
              as: MembershipCoordinator
              captures: { donor16_id: $.data.id }
            - call: "POST /station/memberships"
              payload: { donor_id: "${donor16_id}", level_code: "BASIC" }
              as: MembershipCoordinator
              captures: { mem16_id: $.data.id }
            - call: "POST /station/pledge-drives"
              payload: { name: "Fall 2026", starts_at: "2026-08-01T00:00:00Z", ends_at: "2026-08-15T00:00:00Z", goal_cents: 100000 }
              as: StationAdmin
              captures: { drv16_id: $.data.id, drv16_v: $.data.version }
            - call: "POST /station/pledge-drives/${drv16_id}/breaks"
              payload: { starts_at: "2026-08-02T18:00:00Z", ends_at: "2026-08-02T18:20:00Z", program_title: "Evening Pledge", pitch_level_code: "BASIC", expected_drive_version: "${drv16_v}" }
              as: StationAdmin
            - call: "POST /station/pledge-drives/${drv16_id}/schedule"
              payload: {}
              as: StationAdmin
            - call: "POST /station/pledge-drives/${drv16_id}/go-live"
              payload: {}
              as: StationAdmin
            - call: "POST /station/pledges"
              payload: { donor_id: "${donor16_id}", membership_id: "${mem16_id}", drive_id: "${drv16_id}", channel: "PHONE", kind: "ONE_TIME", amount_cents: 12000, premium_id: "${prem_mug5_id}" }
              as: PhoneVolunteer
              captures: { plg16_id: $.data.id }
            - call: "GET /station/pledges/${plg16_id}/premium-reservations"
              payload: {}
              as: MembershipCoordinator
              captures: { rsv16_id: "$.data[0].id" }
          trigger:
            - call: "POST /station/premium-reservations/${rsv16_id}/release"
              payload: {}
              as: MembershipCoordinator
            - call: "GET /station/premiums/${prem_mug5_id}/lots"
              payload: {}
              as: MembershipCoordinator
              captures: { lot5_avail: "$.data[0].available_qty", lot5_reserved: "$.data[0].reserved_qty", lot5_committed: "$.data[0].committed_qty", lot5_wo: "$.data[0].written_off_qty" }
          assert:
            - "after release, available_qty == 5, reserved_qty == 0, committed_qty == 0, written_off_qty == 0"
            - "invariant: ${lot5_avail} + ${lot5_reserved} + ${lot5_committed} + ${lot5_wo} == 5 == total_qty"
            - "Pledge.${plg16_id}.fulfillment_status returns to AWAITING_RESERVATION"
