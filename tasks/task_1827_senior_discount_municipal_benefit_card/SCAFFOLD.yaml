# =============================================================================
# Task 1827 — Senior Discount & Municipal Benefit Card Program
# Scaffold seed tables (§1.0–§1.7). Difficulty design (§1.8) and corner design
# (§1.9) live in sibling files.
# =============================================================================

scenario: "1827. Senior Discount & Municipal Benefit Card Program (city senior services office): eligibility (age/income/residency) & verification documents, card issuance/renewal & replacement, participating merchant/program enrollment & discount terms, benefit usage tracking & fraud prevention, program funding & merchant reimbursement where applicable, outreach to eligible non-participants, integration with transit & facility fee waivers, annual recertification"

domain_name: senior-benefit-card
api_prefix: /senior-benefits

# =============================================================================
# Step 0: Complexity Profile
# =============================================================================
complexity_profile:
  primary_archetype: compliance_audit
  # Eligibility verification, document review with segregation of duties,
  # fraud flagging, annual recertification — all constrained, audited actions.
  secondary_archetype: quota_allocation
  # ProgramFund is a finite annual pool committed to merchant reimbursement;
  # per-merchant monthly caps and per-cardholder monthly discount caps are
  # finite pools competed for across transactions.
  complexity_layers:
    - optimistic_concurrency      # OCC on Cardholder.version for card issuance (create-with-supersede)
    - scheduled_deferred_actions  # logical clock drives recert windows, lapse, card expiry, offer retirement
    - derived_field_reconciliation # cardholder ytd totals, merchant month reimbursed, fund paid/available
    - rate_threshold_triggers     # velocity flag/reject thresholds, fraud-flag auto-suspension threshold
  entity_topology: flat           # peer entities joined by FK references; no nested ownership trees
  state_machine_shape: cyclic     # Cardholder recertification cycle + BenefitApplication info-request cycle
  relationship_patterns:
    - one_to_many                 # Cardholder→Card/Document/Transaction/Grant; Merchant→Offer/Transaction/Claim
    - cross_aggregate             # UsageTransaction fans FKs to Card, Cardholder, Merchant, Offer
  role_model: segregation_of_duties
  # (1) an EligibilitySpecialist who reviewed an application or verified any of its
  #     documents cannot approve that application;
  # (2) a FraudAnalyst who manually flagged a transaction cannot clear that flag.
  consistency_model: immediate

# =============================================================================
# §1.0 Response Envelope (FIXED — verbatim)
# =============================================================================
response_envelope:
  success: |
    { "meta": { "api_request_id": "req_xxx", "api_request_timestamp": "ISO8601" },
      "response_type": "object" | "array", "data": {} }
  error: |
    { "meta": { ... }, "response_type": "error",
      "data": { "error_id": "ERR_XXX", "message": "..." } }
  pagination_fields: ["limit", "offset", "total_count", "has_more"]
  pagination_defaults: { limit: 10, min: 1, max: 100, offset: 0 }

# =============================================================================
# §1.1 Entity-Relationship Table
# =============================================================================
entities:
  - name: BenefitApplication
    parent: null
    common_fields: true
    fields:
      - { name: kind, type: enum, source: input, description: "INITIAL | RECERTIFICATION" }
      - { name: applicant_full_name, type: string, source: input, description: "Legal full name of the senior applicant" }
      - { name: date_of_birth, type: string, source: input, description: "ISO date YYYY-MM-DD; drives age_years eligibility" }
      - { name: annual_income_cents, type: integer, source: input, description: "Annual household income in cents; must be >= 0" }
      - { name: residency_address, type: string, source: input, description: "Street address inside the municipality" }
      - { name: cardholder_id, type: string, source: system, description: "FK -> Cardholder.id; set at creation for kind=RECERTIFICATION (required input then), set at approval for kind=INITIAL when the Cardholder is created; null otherwise", default: null }
      - { name: status, type: enum, source: system, description: "SUBMITTED | UNDER_REVIEW | INFO_REQUESTED | APPROVED | DENIED" }
      - { name: reviewed_by_user_id, type: string, source: system, description: "X-User-ID of the EligibilitySpecialist who performed intake review (start-review); null until then", default: null }
      - { name: info_request_reason, type: string, source: system, description: "Reason recorded on the latest request-info transition; null otherwise", default: null }
      - { name: denial_reason, type: string, source: system, description: "Reason recorded at denial; null otherwise", default: null }
      - { name: decided_by_user_id, type: string, source: system, description: "X-User-ID of the ProgramAdministrator who approved or denied; null until decision", default: null }

  - name: VerificationDocument
    parent: null
    common_fields: true
    fields:
      - { name: application_id, type: string, source: input, description: "FK -> BenefitApplication.id" }
      - { name: document_type, type: enum, source: input, description: "PROOF_OF_AGE | PROOF_OF_INCOME | PROOF_OF_RESIDENCY" }
      - { name: document_reference, type: string, source: input, description: "Free-form reference (e.g., license number, notice number)" }
      - { name: status, type: enum, source: system, description: "SUBMITTED | VERIFIED | REJECTED" }
      - { name: reviewed_by_user_id, type: string, source: system, description: "X-User-ID of the EligibilitySpecialist who reviewed the document; null while SUBMITTED", default: null }
      - { name: rejection_reason, type: string, source: system, description: "Required when a review rejects; null otherwise", default: null }

  - name: Cardholder
    parent: null
    common_fields: true
    fields:
      - { name: full_name, type: string, source: system, description: "Copied from the approved application" }
      - { name: date_of_birth, type: string, source: system, description: "Copied from the approved application (ISO date)" }
      - { name: annual_income_cents, type: integer, source: system, description: "Income as of latest approved (re)certification" }
      - { name: residency_address, type: string, source: system, description: "Copied from the approved application" }
      - { name: status, type: enum, source: system, description: "ACTIVE | RECERTIFICATION_DUE | SUSPENDED | LAPSED | REVOKED" }
      - { name: pre_suspension_status, type: enum, source: system, description: "ACTIVE | RECERTIFICATION_DUE captured when the system suspends; null when not SUSPENDED; used to restore status when the flag count drops below threshold", default: null }
      - { name: recertification_due_date, type: string, source: system, description: "ISO date = latest approval date + 365 days; window opens 60 days before; lapse when clock reaches due_date + 1 day" }
      - { name: fraud_flag_count, type: integer, source: computed, description: "Count of this cardholder's UsageTransactions currently in FLAGGED status; maintained on flag/clear/void transitions; system suspension threshold FRAUD_SUSPEND_THRESHOLD = 3 (suspend at >= 3, restore at < 3)" }
      - { name: ytd_discount_cents, type: integer, source: computed, description: "Sum of discount_cents over this cardholder's UsageTransactions with status IN {POSTED, FLAGGED} and created_at in the logical clock's current calendar year" }
      - { name: ytd_transaction_count, type: integer, source: computed, description: "Count of the same inclusion set as ytd_discount_cents" }
      - { name: age_years, type: integer, source: computed, description: "Whole years between date_of_birth and the logical clock date (birthday reached => incremented)" }

  - name: BenefitCard
    parent: null
    common_fields: true
    fields:
      - { name: cardholder_id, type: string, source: input, description: "FK -> Cardholder.id" }
      - { name: card_number, type: string, source: system, description: "Server-minted unique display number (16 digits)" }
      - { name: issue_reason, type: enum, source: system, description: "INITIAL (on application approval) | REPLACEMENT | RENEWAL" }
      - { name: status, type: enum, source: system, description: "ACTIVE | SUSPENDED | REPLACED | EXPIRED | REVOKED" }
      - { name: issued_at, type: datetime, source: system, description: "Logical clock timestamp at issuance" }
      - { name: expires_at, type: datetime, source: system, description: "issued_at + 2 calendar years; card EXPIRED when clock >= expires_at" }
      - { name: replaces_card_id, type: string, source: system, description: "Identifier of the prior card this card supersedes (audit linkage only; same cardholder; discoverable via GET /cardholders/{id}/cards)", default: null }

  - name: Merchant
    parent: null
    common_fields: true
    fields:
      - { name: name, type: string, source: input, description: "Merchant business name" }
      - { name: reimbursement_rate_pct, type: number, source: input, description: "Percent of granted discount the city reimburses; 0 < value <= 100" }
      - { name: monthly_reimbursement_cap_cents, type: integer, source: input, description: "Max sum of final_amount_cents of APPROVED claims per merchant per period_month; >= 0" }
      - { name: status, type: enum, source: system, description: "ACTIVE (created ACTIVE — enrollment is self-serve + admin roster) | TERMINATED" }
      - { name: current_month_reimbursed_cents, type: integer, source: computed, description: "Sum of final_amount_cents over this merchant's APPROVED claims whose approval (claim.updated_at) falls in the logical clock's current calendar month" }

  - name: DiscountOffer
    parent: null
    common_fields: true
    fields:
      - { name: merchant_id, type: string, source: input, description: "FK -> Merchant.id" }
      - { name: category, type: enum, source: input, description: "GROCERY | PHARMACY | DINING | RETAIL | SERVICES" }
      - { name: discount_pct, type: number, source: input, description: "Percent off purchase; 0 < value <= 100" }
      - { name: max_discount_cents, type: integer, source: input, description: "Per-transaction discount ceiling; > 0" }
      - { name: valid_from, type: string, source: input, description: "ISO date, inclusive lower bound" }
      - { name: valid_until, type: string, source: input, description: "ISO date, EXCLUSIVE upper bound; must be > valid_from; half-open [valid_from, valid_until)" }
      - { name: status, type: enum, source: system, description: "ACTIVE (created ACTIVE) | RETIRED (system at clock >= valid_until, or merchant termination cascade)" }

  - name: FeeWaiverGrant
    parent: null
    common_fields: true
    fields:
      - { name: cardholder_id, type: string, source: input, description: "FK -> Cardholder.id" }
      - { name: waiver_type, type: enum, source: input, description: "TRANSIT_FARE | FACILITY_FEE" }
      - { name: start_date, type: string, source: input, description: "ISO date, INCLUSIVE lower bound (closed interval)" }
      - { name: end_date, type: string, source: input, description: "ISO date, INCLUSIVE upper bound (closed interval); must be >= start_date" }

  - name: UsageTransaction
    parent: null
    common_fields: true
    fields:
      - { name: card_id, type: string, source: input, description: "FK -> BenefitCard.id presented at the point of sale" }
      - { name: merchant_id, type: string, source: input, description: "FK -> Merchant.id where the purchase occurred; must equal the acting MerchantOperator's merchant" }
      - { name: cardholder_id, type: string, source: system, description: "FK -> Cardholder.id resolved from card_id" }
      - { name: offer_id, type: string, source: system, description: "FK -> DiscountOffer.id resolved by the offer selector (merchant + category + window + status)" }
      - { name: category, type: enum, source: input, description: "GROCERY | PHARMACY | DINING | RETAIL | SERVICES — selects the offer" }
      - { name: purchase_amount_cents, type: integer, source: input, description: "Gross purchase amount; > 0" }
      - { name: discount_cents, type: integer, source: computed, description: "Result of the discount_amount calculation at creation; immutable thereafter" }
      - { name: status, type: enum, source: system, description: "POSTED | FLAGGED | VOIDED" }
      - { name: flagged_by_user_id, type: string, source: system, description: "X-User-ID of the FraudAnalyst who manually flagged, or the literal SYSTEM when auto-flagged by the velocity rule; null while POSTED", default: null }
      - { name: flag_reason, type: string, source: system, description: "VELOCITY_AUTO for system flags; free-form reason for manual flags; null while POSTED", default: null }
      - { name: voided_by_user_id, type: string, source: system, description: "X-User-ID of the MerchantOperator who voided; null unless VOIDED", default: null }

  - name: ReimbursementClaim
    parent: null
    common_fields: true
    fields:
      - { name: merchant_id, type: string, source: input, description: "FK -> Merchant.id filing the claim (path merchant)" }
      - { name: period_month, type: string, source: input, description: "Claimed calendar month, format YYYY-MM; must be strictly before the logical clock's current month" }
      - { name: program_fund_id, type: string, source: system, description: "Identifier of the ProgramFund debited at approval (fiscal_year == year of period_month); null until APPROVED", default: null }
      - { name: provisional_amount_cents, type: integer, source: computed, description: "merchant_claim_amount under the provisional_submission_basis variant, frozen at submission" }
      - { name: final_amount_cents, type: integer, source: computed, description: "merchant_claim_amount under the final_approval_basis variant, computed at approval; null while SUBMITTED/DENIED", default: null }
      - { name: status, type: enum, source: system, description: "SUBMITTED | APPROVED | DENIED" }
      - { name: denial_reason, type: string, source: system, description: "Reason at denial (manual or MERCHANT_TERMINATED cascade); null otherwise", default: null }

  - name: ProgramFund
    parent: null
    common_fields: true
    fields:
      - { name: fiscal_year, type: integer, source: input, description: "Calendar fiscal year, e.g. 2026; unique across funds" }
      - { name: allocated_cents, type: integer, source: input, description: "Annual appropriation; > 0" }
      - { name: paid_cents, type: integer, source: computed, description: "Sum of final_amount_cents over APPROVED claims bound to this fund" }
      - { name: available_cents, type: integer, source: computed, description: "= allocated_cents - paid_cents (invariant: allocated_cents == available_cents + paid_cents)" }

# =============================================================================
# §1.2 State Machine Table
# =============================================================================
state_machines:
  - entity: BenefitApplication
    initial_state: SUBMITTED
    terminal_states: [APPROVED, DENIED]
    transitions:
      - from: SUBMITTED
        to: UNDER_REVIEW
        trigger: "POST /senior-benefits/applications/{id}/start-review"
        actor: EligibilitySpecialist
        preconditions:
          - "application.status == SUBMITTED (else ERR_APPLICATION_INVALID_STATE)"
        side_effects:
          - "reviewed_by_user_id := X-User-ID of the caller"
      - from: INFO_REQUESTED
        to: UNDER_REVIEW
        trigger: "POST /senior-benefits/applications/{id}/start-review (resume after info request)"
        actor: EligibilitySpecialist
        preconditions:
          - "application.status == INFO_REQUESTED (else ERR_APPLICATION_INVALID_STATE)"
        side_effects:
          - "reviewed_by_user_id := X-User-ID of the caller"
      - from: UNDER_REVIEW
        to: INFO_REQUESTED
        trigger: "POST /senior-benefits/applications/{id}/request-info"
        actor: EligibilitySpecialist
        preconditions:
          - "application.status == UNDER_REVIEW (else ERR_APPLICATION_INVALID_STATE)"
          - "reason payload field present (else ERR_INVALID_REQUEST)"
        side_effects:
          - "info_request_reason := payload reason"
      - from: UNDER_REVIEW
        to: APPROVED
        trigger: "POST /senior-benefits/applications/{id}/approve"
        actor: ProgramAdministrator
        preconditions:
          - "application.status == UNDER_REVIEW (else ERR_APPLICATION_INVALID_STATE)"
          - "For each document_type in {PROOF_OF_AGE, PROOF_OF_INCOME, PROOF_OF_RESIDENCY}, at least one VerificationDocument of the application has that type AND status == VERIFIED (else ERR_MISSING_REQUIRED_DOCUMENTS)"
          - "Segregation of duties: caller's X-User-ID != reviewed_by_user_id AND != reviewed_by_user_id of every VERIFIED VerificationDocument of this application (else ERR_SEGREGATION_OF_DUTIES)"
          - "kind == RECERTIFICATION => linked Cardholder.status IN {RECERTIFICATION_DUE, LAPSED} (else ERR_RECERTIFICATION_NOT_DUE)"
        side_effects:
          - "decided_by_user_id := caller"
          - "kind == INITIAL: create Cardholder (status ACTIVE, fields copied from application, recertification_due_date := clock date + 365 days); set application.cardholder_id to the new Cardholder"
          - "kind == INITIAL: create BenefitCard (issue_reason INITIAL, status ACTIVE, expires_at := clock + 2 calendar years) linked to the new Cardholder"
          - "kind == RECERTIFICATION (link 1 of cascade): Cardholder RECERTIFICATION_DUE|LAPSED -> ACTIVE; recertification_due_date := clock date + 365 days; annual_income_cents and residency_address refreshed from this application"
          - "kind == RECERTIFICATION (link 2 of cascade, caused by the Cardholder mutation): if the Cardholder was LAPSED, their ACTIVE cards were already EXPIRED by the lapse cascade; no card is reactivated — the cardholder must request a RENEWAL card via POST /cardholders/{id}/cards"
      - from: UNDER_REVIEW
        to: DENIED
        trigger: "POST /senior-benefits/applications/{id}/deny"
        actor: ProgramAdministrator
        preconditions:
          - "application.status == UNDER_REVIEW (else ERR_APPLICATION_INVALID_STATE)"
          - "reason payload field present (else ERR_INVALID_REQUEST)"
        side_effects:
          - "decided_by_user_id := caller; denial_reason := payload reason"

  - entity: VerificationDocument
    initial_state: SUBMITTED
    terminal_states: [VERIFIED, REJECTED]
    transitions:
      - from: SUBMITTED
        to: VERIFIED
        trigger: "POST /senior-benefits/applications/{id}/documents/{docId}/review with decision=VERIFIED"
        actor: EligibilitySpecialist
        preconditions:
          - "parent application.status IN {UNDER_REVIEW, INFO_REQUESTED} (else ERR_APPLICATION_INVALID_STATE)"
          - "document.status == SUBMITTED (else ERR_DOCUMENT_ALREADY_REVIEWED)"
        side_effects:
          - "reviewed_by_user_id := caller"
      - from: SUBMITTED
        to: REJECTED
        trigger: "POST /senior-benefits/applications/{id}/documents/{docId}/review with decision=REJECTED"
        actor: EligibilitySpecialist
        preconditions:
          - "parent application.status IN {UNDER_REVIEW, INFO_REQUESTED} (else ERR_APPLICATION_INVALID_STATE)"
          - "document.status == SUBMITTED (else ERR_DOCUMENT_ALREADY_REVIEWED)"
          - "rejection_reason payload field present when decision == REJECTED (else ERR_INVALID_REQUEST)"
        side_effects:
          - "reviewed_by_user_id := caller; rejection_reason := payload"

  - entity: Cardholder
    initial_state: ACTIVE
    terminal_states: [REVOKED]
    transitions:
      - from: ACTIVE
        to: RECERTIFICATION_DUE
        trigger: "system (POST /senior-benefits/_clock/set_current_utc advances the logical clock to >= recertification_due_date - 60 days)"
        actor: system
        preconditions: []
        side_effects: []
      - from: RECERTIFICATION_DUE
        to: ACTIVE
        trigger: "system (approval of a RECERTIFICATION BenefitApplication — see BenefitApplication UNDER_REVIEW -> APPROVED)"
        actor: system
        preconditions: []
        side_effects:
          - "recertification_due_date := approval clock date + 365 days"
      - from: LAPSED
        to: ACTIVE
        trigger: "system (approval of a RECERTIFICATION BenefitApplication)"
        actor: system
        preconditions: []
        side_effects:
          - "recertification_due_date := approval clock date + 365 days"
      - from: RECERTIFICATION_DUE
        to: LAPSED
        trigger: "system (clock advances to >= recertification_due_date + 1 day)"
        actor: system
        preconditions: []
        side_effects:
          - "cascade: the cardholder's ACTIVE| SUSPENDED BenefitCards -> EXPIRED (each card mutation bumps its version and updated_at)"
      - from: ACTIVE
        to: SUSPENDED
        trigger: "system (fraud_flag_count rises to >= FRAUD_SUSPEND_THRESHOLD as a result of a UsageTransaction -> FLAGGED transition)"
        actor: system
        preconditions: []
        side_effects:
          - "pre_suspension_status := ACTIVE"
          - "cascade: cardholder's ACTIVE BenefitCards -> SUSPENDED"
      - from: RECERTIFICATION_DUE
        to: SUSPENDED
        trigger: "system (fraud_flag_count rises to >= FRAUD_SUSPEND_THRESHOLD)"
        actor: system
        preconditions: []
        side_effects:
          - "pre_suspension_status := RECERTIFICATION_DUE"
          - "cascade: cardholder's ACTIVE BenefitCards -> SUSPENDED"
      - from: SUSPENDED
        to: ACTIVE
        trigger: "system (fraud_flag_count drops below FRAUD_SUSPEND_THRESHOLD via clear-flag or void, AND pre_suspension_status == ACTIVE)"
        actor: system
        preconditions: []
        side_effects:
          - "pre_suspension_status := null"
          - "cascade: cardholder's SUSPENDED BenefitCards -> ACTIVE"
      - from: SUSPENDED
        to: RECERTIFICATION_DUE
        trigger: "system (fraud_flag_count drops below FRAUD_SUSPEND_THRESHOLD AND pre_suspension_status == RECERTIFICATION_DUE)"
        actor: system
        preconditions: []
        side_effects:
          - "pre_suspension_status := null"
          - "cascade: cardholder's SUSPENDED BenefitCards -> ACTIVE"
      - from: ACTIVE
        to: REVOKED
        trigger: "POST /senior-benefits/cardholders/{id}/revoke"
        actor: FraudAnalyst
        preconditions:
          - "cardholder.status IN {ACTIVE, RECERTIFICATION_DUE, SUSPENDED} (else ERR_CARDHOLDER_ALREADY_TERMINAL)"
        side_effects:
          - "cascade: cardholder's ACTIVE|SUSPENDED BenefitCards -> REVOKED"
      - from: RECERTIFICATION_DUE
        to: REVOKED
        trigger: "POST /senior-benefits/cardholders/{id}/revoke"
        actor: FraudAnalyst
        preconditions: []
        side_effects:
          - "cascade: cardholder's ACTIVE|SUSPENDED BenefitCards -> REVOKED"
      - from: SUSPENDED
        to: REVOKED
        trigger: "POST /senior-benefits/cardholders/{id}/revoke"
        actor: FraudAnalyst
        preconditions: []
        side_effects:
          - "cascade: cardholder's SUSPENDED BenefitCards -> REVOKED"
      - from: LAPSED
        to: REVOKED
        trigger: "POST /senior-benefits/cardholders/{id}/revoke"
        actor: FraudAnalyst
        preconditions: []
        side_effects: []

  - entity: BenefitCard
    initial_state: ACTIVE
    terminal_states: [REPLACED, EXPIRED, REVOKED]
    transitions:
      - from: ACTIVE
        to: REPLACED
        trigger: "system (POST /senior-benefits/cardholders/{id}/cards with reason=REPLACEMENT supersedes this card)"
        actor: system
        preconditions: []
        side_effects:
          - "new card.replaces_card_id := this card's id"
      - from: SUSPENDED
        to: REPLACED
        trigger: "system (replacement issuance supersedes this card)"
        actor: system
        preconditions: []
        side_effects:
          - "new card.replaces_card_id := this card's id"
      - from: ACTIVE
        to: SUSPENDED
        trigger: "system (cardholder suspension cascade)"
        actor: system
        preconditions: []
        side_effects: []
      - from: SUSPENDED
        to: ACTIVE
        trigger: "system (cardholder unsuspension cascade)"
        actor: system
        preconditions: []
        side_effects: []
      - from: ACTIVE
        to: EXPIRED
        trigger: "system (clock advances to >= expires_at, or cardholder lapse cascade)"
        actor: system
        preconditions: []
        side_effects: []
      - from: SUSPENDED
        to: EXPIRED
        trigger: "system (clock advances to >= expires_at, or cardholder lapse cascade)"
        actor: system
        preconditions: []
        side_effects: []
      - from: ACTIVE
        to: REVOKED
        trigger: "system (cardholder revoke cascade)"
        actor: system
        preconditions: []
        side_effects: []
      - from: SUSPENDED
        to: REVOKED
        trigger: "system (cardholder revoke cascade)"
        actor: system
        preconditions: []
        side_effects: []

  - entity: DiscountOffer
    initial_state: ACTIVE
    terminal_states: [RETIRED]
    transitions:
      - from: ACTIVE
        to: RETIRED
        trigger: "system (clock advances to >= valid_until, or merchant termination cascade)"
        actor: system
        preconditions: []
        side_effects: []

  - entity: UsageTransaction
    initial_state: POSTED
    terminal_states: [VOIDED]
    transitions:
      - from: POSTED
        to: FLAGGED
        trigger: "POST /senior-benefits/usage-transactions/{id}/flag (manual), OR system immediately after creation when the calendar-day velocity threshold is reached"
        actor: FraudAnalyst | system
        preconditions:
          - "manual: transaction.status == POSTED (else ERR_TRANSACTION_NOT_FLAGGABLE)"
          - "manual: reason payload field present (else ERR_INVALID_REQUEST)"
        side_effects:
          - "flagged_by_user_id := caller X-User-ID (manual) or SYSTEM (auto); flag_reason := payload reason or VELOCITY_AUTO"
          - "cascade link 1: cardholder.fraud_flag_count += 1"
          - "cascade link 2: if fraud_flag_count reaches >= FRAUD_SUSPEND_THRESHOLD and cardholder.status IN {ACTIVE, RECERTIFICATION_DUE}: cardholder -> SUSPENDED (pre_suspension_status preserved)"
          - "cascade link 3: cardholder suspension cascades their ACTIVE BenefitCards -> SUSPENDED"
      - from: FLAGGED
        to: POSTED
        trigger: "POST /senior-benefits/usage-transactions/{id}/clear-flag"
        actor: FraudAnalyst
        preconditions:
          - "transaction.status == FLAGGED (else ERR_TRANSACTION_NOT_FLAGGABLE)"
          - "segregation of duties: if flagged_by_user_id != SYSTEM then caller X-User-ID != flagged_by_user_id (else ERR_SEGREGATION_OF_DUTIES)"
        side_effects:
          - "cascade link 1: cardholder.fraud_flag_count -= 1"
          - "cascade link 2: if fraud_flag_count drops below FRAUD_SUSPEND_THRESHOLD and cardholder.status == SUSPENDED: cardholder -> pre_suspension_status"
          - "cascade link 3: cardholder unsuspension cascades their SUSPENDED BenefitCards -> ACTIVE"
          - "flagged_by_user_id := null; flag_reason := null"
      - from: POSTED
        to: VOIDED
        trigger: "POST /senior-benefits/usage-transactions/{id}/void"
        actor: MerchantOperator
        preconditions:
          - "transaction.status == POSTED (else ERR_TRANSACTION_NOT_VOIDABLE — FLAGGED transactions must be cleared by a FraudAnalyst first)"
          - "caller is a MerchantOperator whose X-User-ID == transaction.merchant_id (else ERR_MERCHANT_OWNERSHIP_MISMATCH)"
        side_effects:
          - "voided_by_user_id := caller"
          - "cardholder.ytd_discount_cents -= discount_cents; ytd_transaction_count -= 1 (recomputed from inclusion set)"

  - entity: ReimbursementClaim
    initial_state: SUBMITTED
    terminal_states: [APPROVED, DENIED]
    transitions:
      - from: SUBMITTED
        to: APPROVED
        trigger: "POST /senior-benefits/reimbursement-claims/{id}/approve"
        actor: ProgramAdministrator
        preconditions:
          - "claim.status == SUBMITTED (else ERR_CLAIM_NOT_SUBMITTED)"
          - "a ProgramFund exists with fiscal_year == year of period_month (else ERR_NO_FUND_FOR_PERIOD)"
          - "final_amount_cents (recomputed under final_approval_basis) <= fund.available_cents (else ERR_FUND_INSUFFICIENT)"
          - "sum of final_amount_cents over the merchant's other APPROVED claims with the same period_month + final_amount_cents <= merchant.monthly_reimbursement_cap_cents (else ERR_MERCHANT_MONTHLY_CAP_EXCEEDED)"
        side_effects:
          - "final_amount_cents computed and stored; program_fund_id := the resolved fund"
          - "fund.paid_cents += final_amount_cents (ledger sync; fund.version increments)"
          - "merchant.current_month_reimbursed_cents recomputed"
      - from: SUBMITTED
        to: DENIED
        trigger: "POST /senior-benefits/reimbursement-claims/{id}/deny, OR system (merchant termination cascade)"
        actor: ProgramAdministrator | system
        preconditions:
          - "manual: claim.status == SUBMITTED (else ERR_CLAIM_NOT_SUBMITTED); reason payload required (else ERR_INVALID_REQUEST)"
        side_effects:
          - "denial_reason := payload reason (manual) or MERCHANT_TERMINATED (cascade)"

  - entity: Merchant
    initial_state: ACTIVE
    terminal_states: [TERMINATED]
    transitions:
      - from: ACTIVE
        to: TERMINATED
        trigger: "POST /senior-benefits/merchants/{id}/terminate"
        actor: ProgramAdministrator
        preconditions:
          - "merchant.status == ACTIVE (else ERR_MERCHANT_NOT_ACTIVE)"
        side_effects:
          - "cascade: merchant's ACTIVE DiscountOffers -> RETIRED"
          - "cascade: merchant's SUBMITTED ReimbursementClaims -> DENIED with denial_reason MERCHANT_TERMINATED"

# =============================================================================
# §1.2.1 Concurrency Rules (OCC only)
# =============================================================================
concurrency_rules:
  - rule_id: card-issue-stale-cardholder
    parent_entity: Cardholder
    write_endpoint: "POST /senior-benefits/cardholders/{id}/cards"
    occ_field: expected_cardholder_version
    description: |
      Issuing a replacement or renewal card against a Cardholder whose version has
      advanced since the client last observed it is rejected. Issuance supersedes the
      currently ACTIVE card (create-with-supersede): a client holding a stale view of
      the cardholder may be superseding a card that is no longer the live one, so the
      write is refused with ERR_STALE_VERSION until the client re-reads.
    error_id: ERR_STALE_VERSION
    http_status: 412

# =============================================================================
# §1.3 Calculation Rules Table
# =============================================================================
calculations:
  - name: age_years_at_clock
    trigger: "POST /applications (eligibility gate at submission); also recomputed for Cardholder.age_years on read"
    algorithm: threshold
    formula: |
      age = number of whole years between date_of_birth and the logical clock date,
            incrementing on the birthday (a person born 1961-08-01 is exactly 65 on
            2026-08-01).
      eligible iff age >= MIN_AGE_YEARS
    input_set: "the application's date_of_birth; logical clock date"
    constants:
      MIN_AGE_YEARS: 65
    precision: "integer years; boundary inclusive (age == 65 passes)"

  - name: income_eligibility
    trigger: "POST /applications (eligibility gate at submission, both INITIAL and RECERTIFICATION)"
    algorithm: threshold
    formula: |
      eligible iff annual_income_cents <= INCOME_LIMIT_CENTS
    input_set: "the application's annual_income_cents"
    constants:
      INCOME_LIMIT_CENTS: 2400000
    precision: "integer cents; boundary inclusive (== 2400000 passes, 2400001 fails)"

  - name: discount_amount
    trigger: "POST /usage-transactions (at creation; result frozen on the transaction)"
    algorithm: tiered_pricing
    formula: |
      1. raw        = purchase_amount_cents * offer.discount_pct / 100      (exact rational, no rounding yet)
      2. capped     = min(raw, offer.max_discount_cents)
      3. month_used = sum of discount_cents over the cardholder's transactions
                      with status IN {POSTED, FLAGGED} and created_at inside the
                      logical clock's current calendar month
      4. remaining  = max(CARDHOLDER_MONTHLY_DISCOUNT_CAP_CENTS - month_used, 0)
      5. granted    = min(capped, remaining)
      6. discount_cents = round_half_up(granted)   # single rounding AFTER the min chain
    input_set: "the resolved DiscountOffer; the cardholder's same-month transactions with status IN {POSTED, FLAGGED}"
    constants:
      CARDHOLDER_MONTHLY_DISCOUNT_CAP_CENTS: 5000
    precision: "integer cents; round_half_up applied once at step 6"
    variants: []

  - name: merchant_claim_amount
    trigger: "POST /merchants/{id}/reimbursement-claims (provisional, frozen at submission); POST /reimbursement-claims/{id}/approve (final, recomputed)"
    algorithm: aggregation
    formula: |
      line(txn) = round_half_up(txn.discount_cents * merchant.reimbursement_rate_pct / 100)
      amount    = sum of line(txn) over the input set
      ROUNDING ORDER IS PINNED: round per transaction line FIRST, then sum the
      rounded lines. (Sum-then-round is a valid alternative reading of the prose
      and yields different cents; it is NOT the implemented rule.)
    input_set: "the merchant's UsageTransactions whose created_at falls inside period_month (calendar month), filtered by status per variant"
    constants: {}
    precision: "integer cents; round_half_up per line"
    variants:
      - name: provisional_submission_basis
        when: "claim submission"
        difference: "input set includes transactions with status IN {POSTED, FLAGGED} as they stand at the submission clock"
      - name: final_approval_basis
        when: "claim approval"
        difference: "input set includes ONLY transactions with status == POSTED as they stand at the approval clock; FLAGGED (unresolved) and VOIDED transactions are excluded"

  - name: velocity_transaction_count
    trigger: "POST /usage-transactions, before the transaction is persisted"
    algorithm: aggregation
    formula: |
      Two windowed counts of the cardholder's transactions, each including the
      candidate new transaction and excluding VOIDED transactions:
        trailing_24h_count = count of transactions with created_at in (clock - 24h, clock], + 1
        calendar_day_count   = count of transactions whose created_at calendar date == clock date, + 1
      Enforcement order at creation:
        1. if trailing_24h_count >= TRAILING_24H_REJECT_THRESHOLD: reject ERR_VELOCITY_HARD_LIMIT
        2. elif calendar_day_count >= CALENDAR_DAY_FLAG_THRESHOLD: persist then auto-transition POSTED -> FLAGGED (flagged_by SYSTEM, reason VELOCITY_AUTO)
        3. else: persist POSTED
    input_set: "the cardholder's UsageTransactions with status != VOIDED"
    constants:
      CALENDAR_DAY_FLAG_THRESHOLD: 5
      TRAILING_24H_REJECT_THRESHOLD: 10
    precision: "integer counts; thresholds inclusive (>=)"
    variants:
      - name: calendar_day_window
        when: "the auto-flag decision at creation"
        difference: "counts only same-calendar-date transactions; a burst yesterday evening does not affect this morning's count"
      - name: trailing_24h_window
        when: "the hard-reject decision at creation"
        difference: "counts the rolling 24-hour window regardless of date boundaries; yesterday evening's burst DOES count this morning"

  - name: cardholder_ytd_totals
    trigger: "transaction creation, void, flag, clear-flag (derived fields reconciled on every UsageTransaction mutation)"
    algorithm: aggregation
    formula: |
      ytd_discount_cents    = sum of discount_cents over the cardholder's transactions
                              with status IN {POSTED, FLAGGED} and created_at in the
                              logical clock's current calendar year
      ytd_transaction_count = count of the same set
    input_set: "cardholder's transactions with status IN {POSTED, FLAGGED}, current calendar year of the logical clock"
    constants: {}
    precision: "integer cents / integer count"

  - name: fund_available
    trigger: "claim approval (debit); read of ProgramFund (recompute)"
    algorithm: aggregation
    formula: |
      paid_cents      = sum of final_amount_cents over APPROVED claims with program_fund_id == fund.id
      available_cents = allocated_cents - paid_cents
      INVARIANT: allocated_cents == available_cents + paid_cents at all times
    input_set: "APPROVED ReimbursementClaims bound to the fund"
    constants: {}
    precision: "integer cents"

  - name: offer_selector
    trigger: "POST /usage-transactions (resolving offer_id)"
    algorithm: threshold
    formula: |
      candidate set = DiscountOffers where merchant_id == request merchant_id
                      AND category == request category
                      AND status == ACTIVE
                      AND valid_from <= clock date < valid_until
      (the create-time overlap rule guarantees at most one candidate per merchant+category+date)
      if the set is empty: reject ERR_NO_ACTIVE_OFFER
      if more than one candidate exists (defensive; unreachable under the overlap rule):
        rank by valid_from ASC, tie-break created_at ASC, take the first
    input_set: "the merchant's DiscountOffers"
    constants: {}
    precision: "date comparison at day granularity against the logical clock date"

# =============================================================================
# §1.4 Validation Rules Table (ordered by priority)
# =============================================================================
validations:
  - priority: 1
    category: auth
    check: "X-User-Role and X-User-ID headers present; X-User-Role must be one of the declared roles; for entity_backed roles X-User-ID must reference an existing entity of the backing type"
    error_id: ERR_UNAUTHENTICATED
    http_status: 401
    applies_to: all
  - priority: 2
    category: auth
    check: "the caller's role is listed in the endpoint's roles"
    error_id: ERR_FORBIDDEN
    http_status: 403
    applies_to: all
  - priority: 3
    category: existence
    check: "path resource ids exist, validated left-to-right (application before document, merchant before offer, etc.)"
    error_id: ERR_NOT_FOUND_FAMILY
    http_status: 404
    applies_to: "all endpoints with path ids (ERR_APPLICATION_NOT_FOUND, ERR_DOCUMENT_NOT_FOUND, ERR_CARDHOLDER_NOT_FOUND, ERR_CARD_NOT_FOUND, ERR_MERCHANT_NOT_FOUND, ERR_OFFER_NOT_FOUND, ERR_TRANSACTION_NOT_FOUND, ERR_CLAIM_NOT_FOUND, ERR_FUND_NOT_FOUND)"
  - priority: 4
    category: state
    check: "target resource is in the required state for the operation (application reviewable, document unreviewed, card ACTIVE, claim SUBMITTED, merchant ACTIVE, etc.)"
    error_id: "state family (ERR_APPLICATION_INVALID_STATE, ERR_DOCUMENT_ALREADY_REVIEWED, ERR_CARD_NOT_ACTIVE, ERR_CARDHOLDER_NOT_ACTIVE, ERR_CARDHOLDER_ALREADY_TERMINAL, ERR_MERCHANT_NOT_ACTIVE, ERR_TRANSACTION_NOT_FLAGGABLE, ERR_TRANSACTION_NOT_VOIDABLE, ERR_CLAIM_NOT_SUBMITTED)"
    http_status: 409
    applies_to: "all state-transition and state-gated endpoints"
  - priority: 5
    category: business_referential
    check: "referential/ownership consistency: MerchantOperator may act only for their own merchant (X-User-ID == path/body merchant id); Cardholder role may read or request cards only for their own cardholder id (X-User-ID == path id)"
    error_id: "ERR_MERCHANT_OWNERSHIP_MISMATCH | ERR_CARDHOLDER_OWNERSHIP_MISMATCH"
    http_status: 403
    applies_to: "POST /usage-transactions, POST /usage-transactions/{id}/void, POST /merchants/{id}/offers, POST /merchants/{id}/reimbursement-claims, Cardholder-role reads and POST /cardholders/{id}/cards"
  - priority: 6
    category: business_safety
    check: "fraud & segregation safeguards: velocity hard limit; segregation of duties on application approval and flag clearing"
    error_id: "ERR_VELOCITY_HARD_LIMIT | ERR_SEGREGATION_OF_DUTIES"
    http_status: 422
    applies_to: "POST /usage-transactions (velocity, 422), POST /applications/{id}/approve and POST /usage-transactions/{id}/clear-flag (segregation, 403)"
  - priority: 7
    category: business_temporal
    check: "window integrity: offer valid_from < valid_until; waiver start_date <= end_date; offer half-open overlap per merchant+category among status==ACTIVE offers; waiver closed-interval overlap per cardholder+waiver_type; claim period_month strictly before clock's current month"
    error_id: "ERR_OFFER_WINDOW_INVALID | ERR_WAIVER_WINDOW_INVALID | ERR_OFFER_WINDOW_OVERLAP | ERR_WAIVER_WINDOW_OVERLAP | ERR_CLAIM_PERIOD_NOT_CLOSED"
    http_status: 409
    applies_to: "POST /merchants/{id}/offers, POST /cardholders/{id}/fee-waivers, POST /merchants/{id}/reimbursement-claims (window-invalid errors are 400; overlap errors 409; period error 422)"
  - priority: 8
    category: business_constraint
    check: "uniqueness & completeness: one ProgramFund per fiscal_year; at most one non-terminal RECERTIFICATION application per cardholder; at most one non-DENIED reimbursement claim per merchant+period_month; recertification only when due/lapsed; replacement/renewal preconditions on existing cards; eligibility gates (age, income) at application submission"
    error_id: "ERR_DUPLICATE_FISCAL_YEAR | ERR_DUPLICATE_PENDING_APPLICATION | ERR_DUPLICATE_PENDING_CLAIM | ERR_RECERTIFICATION_NOT_DUE | ERR_REPLACEMENT_NOT_ALLOWED | ERR_ELIGIBILITY_AGE_NOT_MET | ERR_ELIGIBILITY_INCOME_EXCEEDED | ERR_MISSING_REQUIRED_DOCUMENTS"
    http_status: 409
    applies_to: "POST /program-funds (409), POST /applications (409/422 eligibility), POST /cardholders/{id}/cards (409), POST /merchants/{id}/reimbursement-claims (409), POST /applications/{id}/approve (422 ERR_MISSING_REQUIRED_DOCUMENTS)"
  - priority: 9
    category: business_fiscal
    check: "fiscal gates: offer resolution exists for usage; claim final amount within fund available and merchant monthly cap"
    error_id: "ERR_NO_ACTIVE_OFFER | ERR_FUND_INSUFFICIENT | ERR_MERCHANT_MONTHLY_CAP_EXCEEDED | ERR_NO_FUND_FOR_PERIOD"
    http_status: 402
    applies_to: "POST /usage-transactions (422 ERR_NO_ACTIVE_OFFER), POST /reimbursement-claims/{id}/approve (402 ERR_FUND_INSUFFICIENT, 422 ERR_MERCHANT_MONTHLY_CAP_EXCEEDED, 422 ERR_NO_FUND_FOR_PERIOD)"

# =============================================================================
# §1.5 API Endpoint Table
# =============================================================================
endpoints:
  # --- logical clock (test-driving) ---
  - method: POST
    path: "/senior-benefits/_clock/set_current_utc"
    description: "Set the server's logical clock (ISO8601 UTC). Server startup default is exactly 2026-08-01T00:00:00Z and the logical clock NEVER falls back to wall-clock time. Setting the clock applies every due time-based transition in dependency order: recertification window opening (ACTIVE -> RECERTIFICATION_DUE at due_date - 60 days), lapse (RECERTIFICATION_DUE -> LAPSED at due_date + 1 day, cascading cards to EXPIRED), card expiry (clock >= expires_at), offer retirement (clock date >= valid_until)."
    roles: [ProgramAdministrator]
    code: 200
    input: [to_iso8601]
    output: { current_utc: string }
    side_effects: ["applies all due system transitions listed in the description"]

  # --- applications & documents ---
  - method: POST
    path: "/senior-benefits/applications"
    description: "Submit a benefit card application (INITIAL or RECERTIFICATION). Eligibility gates (age >= 65, income <= limit) evaluated at submission against the logical clock."
    roles: [Applicant, Cardholder]
    code: 201
    input: [kind, applicant_full_name, date_of_birth, annual_income_cents, residency_address, "cardholder_id?"]
    output: BenefitApplication
    side_effects: ["status := SUBMITTED; for kind=RECERTIFICATION cardholder_id is required input and stored"]
  - method: GET
    path: "/senior-benefits/applications/{id}"
    description: "Read one application"
    roles: [Applicant, EligibilitySpecialist, ProgramAdministrator, FraudAnalyst]
    code: 200
    input: []
    output: BenefitApplication
    side_effects: []
  - method: POST
    path: "/senior-benefits/applications/{id}/start-review"
    description: "Begin (or resume, from INFO_REQUESTED) eligibility review; records reviewed_by_user_id"
    roles: [EligibilitySpecialist]
    code: 200
    input: []
    output: BenefitApplication
    side_effects: ["status SUBMITTED|INFO_REQUESTED -> UNDER_REVIEW; reviewed_by_user_id := caller"]
  - method: POST
    path: "/senior-benefits/applications/{id}/request-info"
    description: "Send the application back for more information (UNDER_REVIEW -> INFO_REQUESTED)"
    roles: [EligibilitySpecialist]
    code: 200
    input: [reason]
    output: BenefitApplication
    side_effects: ["status -> INFO_REQUESTED; info_request_reason := reason"]
  - method: POST
    path: "/senior-benefits/applications/{id}/approve"
    description: "Approve an application under review; creates Cardholder + initial card (INITIAL) or recertifies (RECERTIFICATION)"
    roles: [ProgramAdministrator]
    code: 200
    input: []
    output: BenefitApplication
    side_effects: ["see BenefitApplication UNDER_REVIEW -> APPROVED transition"]
  - method: POST
    path: "/senior-benefits/applications/{id}/deny"
    description: "Deny an application under review"
    roles: [ProgramAdministrator]
    code: 200
    input: [reason]
    output: BenefitApplication
    side_effects: ["status -> DENIED; denial_reason := reason; decided_by_user_id := caller"]
  - method: POST
    path: "/senior-benefits/applications/{id}/documents"
    description: "Attach a verification document to an application"
    roles: [Applicant, Cardholder]
    code: 201
    input: [document_type, document_reference]
    output: VerificationDocument
    side_effects: ["document status := SUBMITTED"]
  - method: GET
    path: "/senior-benefits/applications/{id}/documents"
    description: "List an application's verification documents"
    roles: [Applicant, EligibilitySpecialist, ProgramAdministrator, FraudAnalyst]
    code: 200
    input: ["limit?", "offset?"]
    output: "VerificationDocument[]"
    side_effects: []
  - method: POST
    path: "/senior-benefits/applications/{id}/documents/{docId}/review"
    description: "Verify or reject a submitted document"
    roles: [EligibilitySpecialist]
    code: 200
    input: [decision, "rejection_reason?"]
    output: VerificationDocument
    side_effects: ["document SUBMITTED -> VERIFIED|REJECTED; reviewed_by_user_id := caller"]

  # --- cardholders, cards, waivers ---
  - method: GET
    path: "/senior-benefits/cardholders/{id}"
    description: "Read one cardholder (computed fields age_years, fraud_flag_count, ytd_* included)"
    roles: [Cardholder, EligibilitySpecialist, ProgramAdministrator, FraudAnalyst]
    code: 200
    input: []
    output: Cardholder
    side_effects: []
  - method: GET
    path: "/senior-benefits/cardholders/{id}/applications"
    description: "List applications linked to a cardholder (recertification history)"
    roles: [Cardholder, EligibilitySpecialist, ProgramAdministrator]
    code: 200
    input: ["limit?", "offset?"]
    output: "BenefitApplication[]"
    side_effects: []
  - method: POST
    path: "/senior-benefits/cardholders/{id}/cards"
    description: "Issue a REPLACEMENT card (supersedes the current ACTIVE/SUSPENDED card) or a RENEWAL card (when no ACTIVE/SUSPENDED card exists but an EXPIRED one does). OCC-guarded on the cardholder version."
    roles: [Cardholder, ProgramAdministrator]
    code: 201
    input: [reason, expected_cardholder_version]
    output: BenefitCard
    side_effects:
      - "increments Cardholder.version by 1"
      - "REPLACEMENT: prior ACTIVE|SUSPENDED card -> REPLACED (new card.replaces_card_id set); new card ACTIVE, expires_at := clock + 2 calendar years"
      - "RENEWAL: new card ACTIVE, expires_at := clock + 2 calendar years, replaces_card_id := the most recently created EXPIRED card of this cardholder (audit lineage); prior EXPIRED cards' statuses unchanged"
      - "requires cardholder.status IN {ACTIVE, RECERTIFICATION_DUE} (else ERR_CARDHOLDER_NOT_ACTIVE)"
  - method: GET
    path: "/senior-benefits/cardholders/{id}/cards"
    description: "List a cardholder's cards (all statuses; replacement lineage visible)"
    roles: [Cardholder, ProgramAdministrator, FraudAnalyst, EligibilitySpecialist]
    code: 200
    input: ["limit?", "offset?"]
    output: "BenefitCard[]"
    side_effects: []
  - method: POST
    path: "/senior-benefits/cardholders/{id}/revoke"
    description: "Permanently revoke program membership (fraud or confirmed ineligibility)"
    roles: [FraudAnalyst]
    code: 200
    input: [reason]
    output: Cardholder
    side_effects: ["cardholder -> REVOKED; cascade ACTIVE|SUSPENDED cards -> REVOKED"]
  - method: POST
    path: "/senior-benefits/cardholders/{id}/fee-waivers"
    description: "Grant a transit or facility fee waiver over a closed date interval"
    roles: [ProgramAdministrator]
    code: 201
    input: [waiver_type, start_date, end_date]
    output: FeeWaiverGrant
    side_effects: []
  - method: GET
    path: "/senior-benefits/cardholders/{id}/fee-waivers"
    description: "List a cardholder's fee waiver grants"
    roles: [Cardholder, ProgramAdministrator, EligibilitySpecialist]
    code: 200
    input: ["waiver_type?", "limit?", "offset?"]
    output: "FeeWaiverGrant[]"
    side_effects: []

  # --- merchants & offers ---
  - method: POST
    path: "/senior-benefits/merchants"
    description: "Enroll a participating merchant (created ACTIVE) with reimbursement terms"
    roles: [ProgramAdministrator]
    code: 201
    input: [name, reimbursement_rate_pct, monthly_reimbursement_cap_cents]
    output: Merchant
    side_effects: []
  - method: GET
    path: "/senior-benefits/merchants/{id}"
    description: "Read one merchant (includes current_month_reimbursed_cents)"
    roles: [MerchantOperator, ProgramAdministrator, FraudAnalyst]
    code: 200
    input: []
    output: Merchant
    side_effects: []
  - method: POST
    path: "/senior-benefits/merchants/{id}/terminate"
    description: "Terminate merchant participation; retires ACTIVE offers and denies SUBMITTED claims"
    roles: [ProgramAdministrator]
    code: 200
    input: []
    output: Merchant
    side_effects: ["merchant -> TERMINATED; ACTIVE offers -> RETIRED; SUBMITTED claims -> DENIED (MERCHANT_TERMINATED)"]
  - method: POST
    path: "/senior-benefits/merchants/{id}/offers"
    description: "Create a discount offer (created ACTIVE); half-open window overlap with existing ACTIVE offers of the same merchant+category is rejected"
    roles: [MerchantOperator]
    code: 201
    input: [category, discount_pct, max_discount_cents, valid_from, valid_until]
    output: DiscountOffer
    side_effects: []
  - method: GET
    path: "/senior-benefits/merchants/{id}/offers"
    description: "List a merchant's offers"
    roles: [MerchantOperator, ProgramAdministrator, Cardholder, FraudAnalyst]
    code: 200
    input: ["status?", "category?", "limit?", "offset?"]
    output: "DiscountOffer[]"
    side_effects: []

  # --- usage transactions ---
  - method: POST
    path: "/senior-benefits/usage-transactions"
    description: "Record a card-present purchase at a merchant; resolves the governing offer, computes discount_cents, applies velocity rules (hard reject then auto-flag). State checks run in this pinned order: card status first (ERR_CARD_NOT_ACTIVE), then cardholder standing (ERR_CARDHOLDER_NOT_ACTIVE), then merchant status (ERR_MERCHANT_NOT_ACTIVE)."
    roles: [MerchantOperator]
    code: 201
    input: [card_id, merchant_id, category, purchase_amount_cents]
    output: UsageTransaction
    side_effects:
      - "resolves cardholder_id (from card) and offer_id (offer_selector)"
      - "computes discount_cents via discount_amount; cardholder ytd totals increase"
      - "velocity: trailing_24h_count >= 10 -> reject; calendar_day_count >= 5 -> persist then auto FLAGGED (SYSTEM)"
      - "on auto-flag, the fraud cascade (count -> suspension -> cards) fires"
  - method: GET
    path: "/senior-benefits/usage-transactions"
    description: "Filtered, paginated list of usage transactions"
    roles: [MerchantOperator, ProgramAdministrator, FraudAnalyst, Cardholder]
    code: 200
    input: ["card_id?", "cardholder_id?", "merchant_id?", "offer_id?", "status?", "limit?", "offset?"]
    output: "UsageTransaction[]"
    side_effects: []
  - method: GET
    path: "/senior-benefits/usage-transactions/{id}"
    description: "Read one usage transaction"
    roles: [MerchantOperator, ProgramAdministrator, FraudAnalyst, Cardholder]
    code: 200
    input: []
    output: UsageTransaction
    side_effects: []
  - method: POST
    path: "/senior-benefits/usage-transactions/{id}/void"
    description: "Void a POSTED transaction (same-merchant operator only); reverses ytd totals"
    roles: [MerchantOperator]
    code: 200
    input: []
    output: UsageTransaction
    side_effects: ["POSTED -> VOIDED; ytd_discount_cents -= discount_cents; ytd_transaction_count -= 1"]
  - method: POST
    path: "/senior-benefits/usage-transactions/{id}/flag"
    description: "Manually flag a POSTED transaction for fraud review; may trigger the auto-suspension cascade"
    roles: [FraudAnalyst]
    code: 200
    input: [reason]
    output: UsageTransaction
    side_effects: ["POSTED -> FLAGGED; fraud_flag_count += 1; threshold cascade may suspend cardholder and cards"]
  - method: POST
    path: "/senior-benefits/usage-transactions/{id}/clear-flag"
    description: "Clear a flag (segregation: the flagging analyst cannot clear their own manual flag); may trigger the unsuspension cascade"
    roles: [FraudAnalyst]
    code: 200
    input: []
    output: UsageTransaction
    side_effects: ["FLAGGED -> POSTED; fraud_flag_count -= 1; threshold cascade may restore cardholder and cards"]

  # --- reimbursement & funding ---
  - method: POST
    path: "/senior-benefits/program-funds"
    description: "Create the annual program fund (one per fiscal_year)"
    roles: [ProgramAdministrator]
    code: 201
    input: [fiscal_year, allocated_cents]
    output: ProgramFund
    side_effects: []
  - method: GET
    path: "/senior-benefits/program-funds/{id}"
    description: "Read a fund (paid_cents, available_cents)"
    roles: [ProgramAdministrator, FraudAnalyst]
    code: 200
    input: []
    output: ProgramFund
    side_effects: []
  - method: POST
    path: "/senior-benefits/merchants/{id}/reimbursement-claims"
    description: "File a monthly reimbursement claim; provisional_amount_cents frozen at submission (POSTED+FLAGGED basis)"
    roles: [MerchantOperator]
    code: 201
    input: [period_month]
    output: ReimbursementClaim
    side_effects: ["provisional_amount_cents computed via merchant_claim_amount provisional_submission_basis; status := SUBMITTED"]
  - method: GET
    path: "/senior-benefits/merchants/{id}/reimbursement-claims"
    description: "List a merchant's reimbursement claims"
    roles: [MerchantOperator, ProgramAdministrator, FraudAnalyst]
    code: 200
    input: ["status?", "limit?", "offset?"]
    output: "ReimbursementClaim[]"
    side_effects: []
  - method: POST
    path: "/senior-benefits/reimbursement-claims/{id}/approve"
    description: "Approve a claim: recompute final amount (POSTED-only basis), bind the fund for the period's fiscal year, debit the fund, enforce the merchant monthly cap"
    roles: [ProgramAdministrator]
    code: 200
    input: []
    output: ReimbursementClaim
    side_effects: ["final_amount_cents computed; program_fund_id set; fund.paid_cents += final_amount_cents; merchant.current_month_reimbursed_cents recomputed"]
  - method: POST
    path: "/senior-benefits/reimbursement-claims/{id}/deny"
    description: "Deny a SUBMITTED claim"
    roles: [ProgramAdministrator]
    code: 200
    input: [reason]
    output: ReimbursementClaim
    side_effects: ["status -> DENIED; denial_reason := reason"]

# =============================================================================
# §1.6 Error Code Catalog
# =============================================================================
errors:
  # auth
  - { id: ERR_UNAUTHENTICATED, http: 401, condition: "missing/malformed X-User-Role or X-User-ID, unknown role, or entity_backed role whose X-User-ID references no existing entity" }
  - { id: ERR_FORBIDDEN, http: 403, condition: "authenticated role is not in the endpoint's roles list" }
  # request shape
  - { id: ERR_INVALID_REQUEST, http: 400, condition: "missing required field, wrong type, invalid enum member, malformed date/datetime, non-positive amount where positivity required" }
  # existence (404 family)
  - { id: ERR_APPLICATION_NOT_FOUND, http: 404, condition: "no BenefitApplication with the path id" }
  - { id: ERR_DOCUMENT_NOT_FOUND, http: 404, condition: "no VerificationDocument with the path docId under the path application" }
  - { id: ERR_CARDHOLDER_NOT_FOUND, http: 404, condition: "no Cardholder with the path id" }
  - { id: ERR_CARD_NOT_FOUND, http: 404, condition: "no BenefitCard with the given card_id" }
  - { id: ERR_MERCHANT_NOT_FOUND, http: 404, condition: "no Merchant with the path/body id" }
  - { id: ERR_TRANSACTION_NOT_FOUND, http: 404, condition: "no UsageTransaction with the path id" }
  - { id: ERR_CLAIM_NOT_FOUND, http: 404, condition: "no ReimbursementClaim with the path id" }
  - { id: ERR_FUND_NOT_FOUND, http: 404, condition: "no ProgramFund with the path id" }
  # state (409 family)
  - { id: ERR_APPLICATION_INVALID_STATE, http: 409, condition: "application not in the state required for the operation (start-review requires SUBMITTED|INFO_REQUESTED; request-info/approve/deny require UNDER_REVIEW)" }
  - { id: ERR_DOCUMENT_ALREADY_REVIEWED, http: 409, condition: "document already VERIFIED or REJECTED" }
  - { id: ERR_CARD_NOT_ACTIVE, http: 409, condition: "card presented for usage is not ACTIVE (SUSPENDED/REPLACED/EXPIRED/REVOKED)" }
  - { id: ERR_CARDHOLDER_NOT_ACTIVE, http: 409, condition: "cardholder not in a standing that permits the operation (usage/card issuance/fee waiver require ACTIVE or RECERTIFICATION_DUE)" }
  - { id: ERR_CARDHOLDER_ALREADY_TERMINAL, http: 409, condition: "revoke requested on a REVOKED cardholder" }
  - { id: ERR_MERCHANT_NOT_ACTIVE, http: 409, condition: "merchant is TERMINATED; usage, offer creation, and claim submission are blocked" }
  - { id: ERR_TRANSACTION_NOT_FLAGGABLE, http: 409, condition: "flag requires POSTED; clear-flag requires FLAGGED" }
  - { id: ERR_TRANSACTION_NOT_VOIDABLE, http: 409, condition: "void requires POSTED (FLAGGED must be cleared first; VOIDED is terminal)" }
  - { id: ERR_CLAIM_NOT_SUBMITTED, http: 409, condition: "approve/deny require claim status SUBMITTED" }
  # referential / ownership
  - { id: ERR_MERCHANT_OWNERSHIP_MISMATCH, http: 403, condition: "MerchantOperator acting for a merchant other than their own (X-User-ID != merchant id)" }
  - { id: ERR_CARDHOLDER_OWNERSHIP_MISMATCH, http: 403, condition: "Cardholder role accessing or acting on a cardholder id other than their own" }
  # safety / segregation
  - { id: ERR_VELOCITY_HARD_LIMIT, http: 422, condition: "trailing-24h transaction count including the candidate >= 10" }
  - { id: ERR_SEGREGATION_OF_DUTIES, http: 403, condition: "approver reviewed the application or verified one of its documents; or analyst clears a flag they raised" }
  # temporal
  - { id: ERR_OFFER_WINDOW_INVALID, http: 400, condition: "valid_from >= valid_until" }
  - { id: ERR_WAIVER_WINDOW_INVALID, http: 400, condition: "start_date > end_date" }
  - { id: ERR_OFFER_WINDOW_OVERLAP, http: 409, condition: "half-open window overlap with an existing ACTIVE offer of the same merchant+category (adjacency allowed)" }
  - { id: ERR_WAIVER_WINDOW_OVERLAP, http: 409, condition: "closed-interval overlap with an existing grant of the same cardholder+waiver_type (touching dates conflict)" }
  - { id: ERR_CLAIM_PERIOD_NOT_CLOSED, http: 422, condition: "period_month is not strictly before the logical clock's current month" }
  # constraint / eligibility
  - { id: ERR_DUPLICATE_FISCAL_YEAR, http: 409, condition: "a ProgramFund with this fiscal_year already exists" }
  - { id: ERR_DUPLICATE_PENDING_APPLICATION, http: 409, condition: "cardholder already has a non-terminal RECERTIFICATION application" }
  - { id: ERR_DUPLICATE_PENDING_CLAIM, http: 409, condition: "a SUBMITTED or APPROVED claim already exists for the same merchant+period_month (refiling allowed only after all prior claims for the period are DENIED)" }
  - { id: ERR_RECERTIFICATION_NOT_DUE, http: 409, condition: "RECERTIFICATION application submitted while cardholder is ACTIVE (window not open) — allowed only when RECERTIFICATION_DUE or LAPSED" }
  - { id: ERR_REPLACEMENT_NOT_ALLOWED, http: 409, condition: "REPLACEMENT requires an ACTIVE|SUSPENDED card; RENEWAL requires none ACTIVE|SUSPENDED and at least one EXPIRED" }
  - { id: ERR_ELIGIBILITY_AGE_NOT_MET, http: 422, condition: "age at the submission clock < 65" }
  - { id: ERR_ELIGIBILITY_INCOME_EXCEEDED, http: 422, condition: "annual_income_cents > 2400000" }
  - { id: ERR_MISSING_REQUIRED_DOCUMENTS, http: 422, condition: "approval without at least one VERIFIED document of each type PROOF_OF_AGE/PROOF_OF_INCOME/PROOF_OF_RESIDENCY" }
  # fiscal
  - { id: ERR_NO_ACTIVE_OFFER, http: 422, condition: "no ACTIVE DiscountOffer covers the merchant+category at the clock date" }
  - { id: ERR_NO_FUND_FOR_PERIOD, http: 422, condition: "no ProgramFund whose fiscal_year matches the claim period's year" }
  - { id: ERR_FUND_INSUFFICIENT, http: 402, condition: "claim final amount exceeds the fund's available_cents" }
  - { id: ERR_MERCHANT_MONTHLY_CAP_EXCEEDED, http: 422, condition: "approving would push the merchant's approved total for period_month beyond monthly_reimbursement_cap_cents" }
  # concurrency
  - { id: ERR_STALE_VERSION, http: 412, condition: "expected_cardholder_version does not match the Cardholder's current version" }

# =============================================================================
# §1.7 RBAC Matrix
# =============================================================================
roles:
  - name: Applicant
    description: "A senior (or helper) submitting a new INITIAL application and its documents; not yet a cardholder"
    identity: opaque
    exclusive_operations:
      - "POST /senior-benefits/applications (INITIAL) — shared with Cardholder for RECERTIFICATION"
      - "POST /senior-benefits/applications/{id}/documents — shared with Cardholder"
    shared_operations:
      - "GET /senior-benefits/applications/{id}"
      - "GET /senior-benefits/applications/{id}/documents"
  - name: Cardholder
    description: "An approved senior program member acting on their own record (X-User-ID == Cardholder.id)"
    identity: "entity_backed:Cardholder"
    exclusive_operations:
      - "POST /senior-benefits/cardholders/{id}/cards — shared with ProgramAdministrator; Cardholder restricted to own id"
    shared_operations:
      - "GET /senior-benefits/cardholders/{id} (own only)"
      - "GET /senior-benefits/cardholders/{id}/applications (own only)"
      - "GET /senior-benefits/cardholders/{id}/cards (own only)"
      - "GET /senior-benefits/cardholders/{id}/fee-waivers (own only)"
      - "GET /senior-benefits/usage-transactions (own cardholder_id filter only)"
      - "POST /senior-benefits/applications (kind=RECERTIFICATION for self)"
  - name: EligibilitySpecialist
    description: "Intake and document verification worker; barred by segregation of duties from approving anything they reviewed"
    identity: opaque
    exclusive_operations:
      - "POST /senior-benefits/applications/{id}/start-review"
      - "POST /senior-benefits/applications/{id}/request-info"
      - "POST /senior-benefits/applications/{id}/documents/{docId}/review"
    shared_operations:
      - "GET /senior-benefits/applications/{id}"
      - "GET /senior-benefits/applications/{id}/documents"
      - "GET /senior-benefits/cardholders/{id}"
      - "GET /senior-benefits/cardholders/{id}/applications"
      - "GET /senior-benefits/cardholders/{id}/fee-waivers"
      - "GET /senior-benefits/cardholders/{id}/cards"
  - name: ProgramAdministrator
    description: "Senior services office administrator: approves/denies applications, manages merchants/funds/waivers, approves claims, sets the logical clock"
    identity: opaque
    exclusive_operations:
      - "POST /senior-benefits/applications/{id}/approve"
      - "POST /senior-benefits/applications/{id}/deny"
      - "POST /senior-benefits/merchants"
      - "POST /senior-benefits/merchants/{id}/terminate"
      - "POST /senior-benefits/cardholders/{id}/fee-waivers"
      - "POST /senior-benefits/program-funds"
      - "POST /senior-benefits/reimbursement-claims/{id}/approve"
      - "POST /senior-benefits/reimbursement-claims/{id}/deny"
      - "POST /senior-benefits/_clock/set_current_utc"
    shared_operations:
      - "GET reads across cardholders, merchants, offers, transactions, claims, funds"
      - "POST /senior-benefits/cardholders/{id}/cards (on behalf of a cardholder)"
  - name: MerchantOperator
    description: "Point-of-sale operator for an enrolled merchant (X-User-ID == Merchant.id)"
    identity: "entity_backed:Merchant"
    exclusive_operations:
      - "POST /senior-benefits/usage-transactions"
      - "POST /senior-benefits/usage-transactions/{id}/void"
      - "POST /senior-benefits/merchants/{id}/offers"
      - "POST /senior-benefits/merchants/{id}/reimbursement-claims"
    shared_operations:
      - "GET /senior-benefits/merchants/{id} (own only)"
      - "GET /senior-benefits/merchants/{id}/offers (own only)"
      - "GET /senior-benefits/merchants/{id}/reimbursement-claims (own only)"
      - "GET /senior-benefits/usage-transactions (own merchant_id filter only)"
  - name: FraudAnalyst
    description: "Fraud prevention analyst: flags and clears transactions, revokes memberships; cannot clear flags they raised"
    identity: opaque
    exclusive_operations:
      - "POST /senior-benefits/usage-transactions/{id}/flag"
      - "POST /senior-benefits/usage-transactions/{id}/clear-flag"
      - "POST /senior-benefits/cardholders/{id}/revoke"
    shared_operations:
      - "GET reads across cardholders, cards, merchants, transactions, claims, funds, applications"
