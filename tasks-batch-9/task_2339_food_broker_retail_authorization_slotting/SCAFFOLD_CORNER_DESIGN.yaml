              captures: { dstate: $.data.state, acc: $.data.accepted_fee_cents, unam: $.data.unamortized_balance_cents, cpu: $.data.cost_per_forecast_unit_cents }
            - call: "GET /authorizations"
              payload: { slotting_deal_id: "${deal}" }
              as: PrincipalPortalUser
              as_user_id: "${prin}"
              captures: { a1: "$.data[0].id", a1state: "$.data[0].authorization_state", a1settle: "$.data[0].settlement_state", a1share: "$.data[0].slotting_share_cents", a2share: "$.data[1].slotting_share_cents" }
            - call: "GET /principals/${prin}"
              payload: {}
              as: BrokerAdmin
              captures: { comm: $.data.slotting_committed_cents, liab: $.data.open_slotting_liability_cents, ratio: $.data.liability_ratio_bps, posture: $.data.credit_posture, pv2: $.data.version }
            - call: "GET /authorizations/${a1}"
              payload: {}
              as: BrokerAccountManager
              captures: { spend: $.data.trade_spend_total_cents }
          assert:
            - "Quote check in setup: ${gross} == 10000000 == 12500*400*2, ${credit} == 300000 == min(100000*3, floor(10000000*4000/10000)), ${net} == 9700000, ${admin} == 145500 == round_half_up(9700000*150/10000) at the 150 bps tier because the net exceeds 5000000, and ${quoted} == 9845500"
            - "Call 1's OWN response body already shows the post-cascade truth: ${dstate} == AMORTIZING (not ACCEPTED — the auto-advance happens inside the same request), ${acc} == 9845500, ${unam} == 9845500 and ${cpu} == 98.46 == round_half_up(9845500/100000, 2)"
            - "Call 2 immediately shows both authorizations already moved: ${a1state} == AUTHORIZED, ${a1settle} == SLOTTING_AMORTIZING, and the shares ${a1share} == 4922750 and ${a2share} == 4922750 sum exactly to ${acc} — no read-after-write delay and no retry"
            - "Call 3 immediately shows the principal's hop-3 aggregates: ${comm} == 9845500, ${liab} == 9845500, ${ratio} == 4922 == floor(9845500*10000/20000000), ${posture} == NORMAL and ${pv2} == ${pv} + 1"
            - "Call 4 shows ${spend} == 4922750 — trade_spend_total_cents was recomputed on each authorization inside the same accept, not by a later job"
            - "No follow-up read ever changes any of these values: re-reading the deal, both authorizations and the principal returns byte-identical bodies, which is what `immediate` means here"
