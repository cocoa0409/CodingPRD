            - call: "POST /vaccine-distribution/jurisdiction-programs/${prog_id}/standing/assess"
              payload: { as_of: "2026-09-04T00:00:00Z", propagation_mode: "IMMEDIATE" }
              as: ColdChainReviewer
              captures: { lapsed_rate: "$.data.lapsed_carton_rate", tier: "$.data.risk_tier" }
          assert:
            - "lapsed_rate == 1.0 because released_cartons_to_date is 10 and lapsed_carton_count is 10"
            - "JurisdictionProgram.${prog_id}.lapsed_carton_count == 10 and lapsed_period_count is 0"
            - "tier == 2 from the 1.0 rate, so JurisdictionProgram.${prog_id}.standing_status == FROZEN"
            - "GET /vaccine-distribution/shipping-window-lapses returns 1 row with lapsed_cartons 10"
            - "closed_status == CLOSED and AllocationEntitlement.${ent_id}.computed_cartons == 10"

