# =============================================================================
# §1.8 Scaffold Difficulty Design — Test Targeting Index
# Laboratory Supply & Reagent Distribution with Cold Chain
# Every instance is independently executable from empty-DB. Logical clock
# defaults to 2026-05-01T00:00:00Z and is left untouched unless noted.
# =============================================================================
scaffold_difficulty_design:

  - rule_id: dual_variant_calc
    instances:
      - name: freight_provisional_vs_final_divergence
        grounds:
          - calculations.freight_cost
          - entities.Shipment.fields.provisional_freight_cents
          - entities.Shipment.fields.final_freight_cents
          - state_machines.Shipment.PACKED_to_IN_TRANSIT
        distinguishing_aspect: |
          Dual-variant on the Shipment/freight domain: identical order data
          yields 2300 cents provisionally (declared_weight_grams = 3000) and
          2660 cents finally (actual_weight_grams = 7500 crossing one started
          kilogram bracket); the invoice posts the FINAL variant only.
        test_recipe:
          setup:
            - "Warehouse WH (hazmat_certified), REFRIGERATED_2_8 FEFO zone, cold-chain NON_HAZARDOUS product at 20000 cents, FULL cold-chain-certified customer with credit_limit 10000000"
            - "Lot of 100 units (expiry 2026-05-31); order qty 2, requested_ship_date 2026-05-10, EXPRESS; submit -> ALLOCATED"
            - "Shipment created with DRY_ICE x2, declared_weight_grams 3000 -> CREATED, provisional_freight_cents 2300"
            - "Shipment packed -> PACKED"
          setup_api_calls:
            - { call: "POST /lab/warehouses", payload: { name: "WH-NE", region_code: "US-NE", hazmat_certified: true }, as: OpsAdmin, captures: { wh_id: "$.data.id" } }
            - { call: "POST /lab/storage-zones", payload: { warehouse_id: "${wh_id}", zone_class: "REFRIGERATED_2_8", capacity_units: 1000, rotation_policy: "FEFO" }, as: OpsAdmin, captures: { zone_id: "$.data.id" } }
            - { call: "POST /lab/products", payload: { sku: "RG-100", name: "Enzyme Mix", storage_requirement: "REFRIGERATED_2_8", hazard_class: "NON_HAZARDOUS", max_qty_per_shipment: 500, unit_price_cents: 20000, requires_cold_chain: true, shelf_life_days: 60, min_remaining_shelf_life_days: 7 }, as: CatalogManager, captures: { prod_id: "$.data.id" } }
            - { call: "POST /lab/customers", payload: { name: "Lab Alpha", credit_limit_cents: 10000000, hazmat_endorsement: "FULL", cold_chain_certified: true }, as: AccountManager, captures: { cust_id: "$.data.id" } }
            - { call: "POST /lab/lots", payload: { product_id: "${prod_id}", warehouse_id: "${wh_id}", storage_zone_id: "${zone_id}", quantity_received: 100, manufacture_date: "2026-04-01" }, as: InventoryClerk, captures: { lot_id: "$.data.id" } }
            - { call: "POST /lab/orders", payload: { customer_id: "${cust_id}", warehouse_id: "${wh_id}", shipping_service: "EXPRESS", requested_ship_date: "2026-05-10", lines: [ { product_id: "${prod_id}", quantity: 2, fulfillment_mode: "ANY" } ] }, as: Customer, as_user_id: "${cust_id}", captures: { order_id: "$.data.id" } }
            - { call: "POST /lab/orders/${order_id}/submit", payload: {}, as: Customer, as_user_id: "${cust_id}" }
            - { call: "POST /lab/shipments", payload: { order_id: "${order_id}", coolant_type: "DRY_ICE", coolant_units: 2, declared_weight_grams: 3000 }, as: InventoryClerk, captures: { ship_id: "$.data.id", prov_freight: "$.data.provisional_freight_cents" } }
            - { call: "POST /lab/shipments/${ship_id}/pack", payload: {}, as: InventoryClerk }
          trigger:
            - { call: "POST /lab/shipments/${ship_id}/dispatch", payload: { actual_weight_grams: 7500 }, as: InventoryClerk, captures: { final_freight: "$.data.final_freight_cents" } }
          assert:
            - "captured prov_freight == 2300 (1500 base + 0 weight + 2*400 dry ice; no hazmat surcharge; floor 500 not binding)"
            - "captured final_freight == 2660 (1500 base + 3 started kg * 120 = 360 + 800 dry ice)"
            - "Shipment.${ship_id}.status == IN_TRANSIT and Order.${order_id}.status == SHIPPED"
            - "CustomerAccount.${cust_id}.outstanding_balance_cents == 42660 (40000 product_total + 2660 final freight; provisional freight never invoiced)"

      - name: excursion_credit_provisional_vs_final_destroyed
        grounds:
          - calculations.excursion_credit
          - entities.TemperatureExcursion.fields.provisional_credit_cents
          - entities.TemperatureExcursion.fields.final_credit_cents
          - state_machines.TemperatureExcursion.OPEN_to_DESTROYED
        distinguishing_aspect: |
          Dual-variant on the TemperatureExcursion/customer-credit domain (a
          different entity domain than freight): the same cold-chain order value
          40000 yields a 20000-cent provisional estimate at OPEN and a 40000-cent
          final credit at DESTROYED disposition; ACCEPTED would yield 0.
        test_recipe:
          setup:
            - "Same base chain as freight_provisional_vs_final_divergence but dispatched with actual_weight_grams 3000 (invoice 42300)"
            - "Out-of-band reading 12.5C for 90 minutes against band [2,8] -> deviation 4.5, severity MAJOR, excursion OPEN with provisional credit 20000, shipment EXCURSION_HOLD"
          setup_api_calls:
            - { call: "POST /lab/warehouses", payload: { name: "WH-NE", region_code: "US-NE", hazmat_certified: true }, as: OpsAdmin, captures: { wh_id: "$.data.id" } }
            - { call: "POST /lab/storage-zones", payload: { warehouse_id: "${wh_id}", zone_class: "REFRIGERATED_2_8", capacity_units: 1000, rotation_policy: "FEFO" }, as: OpsAdmin, captures: { zone_id: "$.data.id" } }
            - { call: "POST /lab/products", payload: { sku: "RG-100", name: "Enzyme Mix", storage_requirement: "REFRIGERATED_2_8", hazard_class: "NON_HAZARDOUS", max_qty_per_shipment: 500, unit_price_cents: 20000, requires_cold_chain: true, shelf_life_days: 60, min_remaining_shelf_life_days: 7 }, as: CatalogManager, captures: { prod_id: "$.data.id" } }
            - { call: "POST /lab/customers", payload: { name: "Lab Alpha", credit_limit_cents: 10000000, hazmat_endorsement: "FULL", cold_chain_certified: true }, as: AccountManager, captures: { cust_id: "$.data.id" } }
            - { call: "POST /lab/lots", payload: { product_id: "${prod_id}", warehouse_id: "${wh_id}", storage_zone_id: "${zone_id}", quantity_received: 100, manufacture_date: "2026-04-01" }, as: InventoryClerk }
            - { call: "POST /lab/orders", payload: { customer_id: "${cust_id}", warehouse_id: "${wh_id}", shipping_service: "EXPRESS", requested_ship_date: "2026-05-10", lines: [ { product_id: "${prod_id}", quantity: 2, fulfillment_mode: "ANY" } ] }, as: Customer, as_user_id: "${cust_id}", captures: { order_id: "$.data.id" } }
            - { call: "POST /lab/orders/${order_id}/submit", payload: {}, as: Customer, as_user_id: "${cust_id}" }
            - { call: "POST /lab/shipments", payload: { order_id: "${order_id}", coolant_type: "DRY_ICE", coolant_units: 2, declared_weight_grams: 3000 }, as: InventoryClerk, captures: { ship_id: "$.data.id" } }
            - { call: "POST /lab/shipments/${ship_id}/pack", payload: {}, as: InventoryClerk }
            - { call: "POST /lab/shipments/${ship_id}/dispatch", payload: { actual_weight_grams: 3000 }, as: InventoryClerk }
            - { call: "POST /lab/shipments/${ship_id}/record-temperature", payload: { temp_celsius: 12.5, duration_minutes: 90 }, as: InventoryClerk, captures: { exc_id: "$.data.excursion_id" } }
          trigger:
            - { call: "POST /lab/excursions/${exc_id}/disposition", payload: { decision: "DESTROYED" }, as: QualityManager }
          assert:
            - "TemperatureExcursion.${exc_id}.provisional_credit_cents == 20000 (round_half_up(40000 * 0.5); only the cold-chain line counts)"
            - "TemperatureExcursion.${exc_id}.final_credit_cents == 40000 (DESTROYED -> 100% of affected value) and severity == MAJOR and status == DESTROYED"
            - "The two variants disagree: 20000 != 40000 for identical order data"

  - rule_id: combinatorial_formula
    instances:
      - name: freight_multi_input_nonlinear_formula
        grounds:
          - calculations.freight_cost
          - calculations.hazmat_load_check
        distinguishing_aspect: |
          Mode (a): freight combines 4 interacting inputs (service tier, started-
          kilogram weight bracket, per-unit coolant, conditional 25% hazmat
          surcharge with round_half_up) under a floor: STANDARD + 12500 g +
          GEL_PACK x3 + hazmat line = 800 + 8*120 + 450 = 2210 subtotal,
          surcharge round_half_up(552.5) = 553, total 2763.
        test_recipe:
          setup:
            - "Hazmat-certified warehouse, AMBIENT FEFO zone, FLAMMABLE product (unit_haz_factor 2, max_qty_per_shipment 100, price 10000), FULL-endorsed non-cold-chain customer"
            - "Lot of 50; order qty 4 (hazmat load 8 <= 30), STANDARD service; submit -> ALLOCATED"
          setup_api_calls:
            - { call: "POST /lab/warehouses", payload: { name: "WH-HZ", region_code: "US-SW", hazmat_certified: true }, as: OpsAdmin, captures: { wh_id: "$.data.id" } }
            - { call: "POST /lab/storage-zones", payload: { warehouse_id: "${wh_id}", zone_class: "AMBIENT", capacity_units: 500, rotation_policy: "FEFO" }, as: OpsAdmin, captures: { zone_id: "$.data.id" } }
            - { call: "POST /lab/products", payload: { sku: "HZ-200", name: "Solvent X", storage_requirement: "AMBIENT", hazard_class: "FLAMMABLE", unit_haz_factor: 2, max_qty_per_shipment: 100, unit_price_cents: 10000, requires_cold_chain: false, shelf_life_days: 365, min_remaining_shelf_life_days: 7 }, as: CatalogManager, captures: { prod_id: "$.data.id" } }
            - { call: "POST /lab/customers", payload: { name: "Lab Beta", credit_limit_cents: 10000000, hazmat_endorsement: "FULL", cold_chain_certified: false }, as: AccountManager, captures: { cust_id: "$.data.id" } }
            - { call: "POST /lab/lots", payload: { product_id: "${prod_id}", warehouse_id: "${wh_id}", storage_zone_id: "${zone_id}", quantity_received: 50, manufacture_date: "2026-01-15" }, as: InventoryClerk }
            - { call: "POST /lab/orders", payload: { customer_id: "${cust_id}", warehouse_id: "${wh_id}", shipping_service: "STANDARD", requested_ship_date: "2026-05-10", lines: [ { product_id: "${prod_id}", quantity: 4, fulfillment_mode: "ANY" } ] }, as: Customer, as_user_id: "${cust_id}", captures: { order_id: "$.data.id" } }
            - { call: "POST /lab/orders/${order_id}/submit", payload: {}, as: Customer, as_user_id: "${cust_id}" }
          trigger:
            - { call: "POST /lab/shipments", payload: { order_id: "${order_id}", coolant_type: "GEL_PACK", coolant_units: 3, declared_weight_grams: 12500 }, as: InventoryClerk, captures: { prov_freight: "$.data.provisional_freight_cents" } }
          assert:
            - "captured prov_freight == 2763 (subtotal 2210 + round_half_up(552.5) = 553; floor 500 not binding; product_total 40000 < 250000 so free freight does not apply)"

      - name: order_pricing_round_per_line_then_sum
        grounds:
          - calculations.order_pricing
          - entities.OrderLine.fields.line_total_cents
        distinguishing_aspect: |
          Mode (b): rounding order is pinned per-line-then-sum; two qty-1 lines
          at 105 cents with a 10% discount give 95 + 95 = 190, while the
          forbidden sum-then-round order would give round_half_up(189.0) = 189.
        test_recipe:
          setup:
            - "Warehouse, AMBIENT zone, product at 105 cents, customer with volume_discount_pct 0.10 and ample credit"
            - "Lot of 10; order with TWO lines of the same product, quantity 1 each"
          setup_api_calls:
            - { call: "POST /lab/warehouses", payload: { name: "WH-NE", region_code: "US-NE", hazmat_certified: true }, as: OpsAdmin, captures: { wh_id: "$.data.id" } }
            - { call: "POST /lab/storage-zones", payload: { warehouse_id: "${wh_id}", zone_class: "AMBIENT", capacity_units: 500 }, as: OpsAdmin, captures: { zone_id: "$.data.id" } }
            - { call: "POST /lab/products", payload: { sku: "CH-105", name: "Buffer Salt", storage_requirement: "AMBIENT", hazard_class: "NON_HAZARDOUS", max_qty_per_shipment: 500, unit_price_cents: 105, requires_cold_chain: false, shelf_life_days: 365, min_remaining_shelf_life_days: 7 }, as: CatalogManager, captures: { prod_id: "$.data.id" } }
            - { call: "POST /lab/customers", payload: { name: "Lab Gamma", credit_limit_cents: 10000000, volume_discount_pct: 0.10, hazmat_endorsement: "NONE", cold_chain_certified: false }, as: AccountManager, captures: { cust_id: "$.data.id" } }
            - { call: "POST /lab/lots", payload: { product_id: "${prod_id}", warehouse_id: "${wh_id}", storage_zone_id: "${zone_id}", quantity_received: 10, manufacture_date: "2026-01-15" }, as: InventoryClerk }
            - { call: "POST /lab/orders", payload: { customer_id: "${cust_id}", warehouse_id: "${wh_id}", shipping_service: "STANDARD", requested_ship_date: "2026-05-10", lines: [ { product_id: "${prod_id}", quantity: 1, fulfillment_mode: "ANY" }, { product_id: "${prod_id}", quantity: 1, fulfillment_mode: "ANY" } ] }, as: Customer, as_user_id: "${cust_id}", captures: { order_id: "$.data.id" } }
          trigger:
            - { call: "POST /lab/orders/${order_id}/submit", payload: {}, as: Customer, as_user_id: "${cust_id}", captures: { total: "$.data.product_total_cents" } }
            - { call: "GET /lab/order-lines", payload: { order_id: "${order_id}" }, as: OpsAdmin, captures: { line1_total: "$.data[0].line_total_cents" } }
          assert:
            - "captured total == 190 (95 + 95 per-line round_half_up), NOT 189"
            - "captured line1_total == 95 and Order.${order_id}.status == ALLOCATED"

      - name: kit_rollup_fee_tier_keyed_on_component_sum
        grounds:
          - calculations.kit_price_rollup
          - entities.KitDefinition.fields.kit_price_cents
          - state_machines.KitDefinition.DRAFT_to_ACTIVE
        distinguishing_aspect: |
          Mode (c): the assembly-fee tier is keyed on component_cost BEFORE the
          fee is added (pinned evaluation order), so component sum 35000 takes
          the 1500 tier and kit_price_cents = 36500; a tier keyed on the
          fee-inclusive total would misbehave at boundaries.
        test_recipe:
          setup:
            - "Two AMBIENT NON_HAZARDOUS LISTED products A (10000 cents) and B (5000 cents); customer exists for kit ownership"
            - "DRAFT kit with components [{A, 2}, {B, 3}]"
          setup_api_calls:
            - { call: "POST /lab/customers", payload: { name: "Lab Delta", credit_limit_cents: 10000000 }, as: AccountManager, captures: { cust_id: "$.data.id" } }
            - { call: "POST /lab/products", payload: { sku: "KA-01", name: "Kit Part A", storage_requirement: "AMBIENT", hazard_class: "NON_HAZARDOUS", max_qty_per_shipment: 500, unit_price_cents: 10000, requires_cold_chain: false, shelf_life_days: 365, min_remaining_shelf_life_days: 7 }, as: CatalogManager, captures: { prod_a: "$.data.id" } }
            - { call: "POST /lab/products", payload: { sku: "KB-01", name: "Kit Part B", storage_requirement: "AMBIENT", hazard_class: "NON_HAZARDOUS", max_qty_per_shipment: 500, unit_price_cents: 5000, requires_cold_chain: false, shelf_life_days: 365, min_remaining_shelf_life_days: 7 }, as: CatalogManager, captures: { prod_b: "$.data.id" } }
            - { call: "POST /lab/kits", payload: { customer_id: "${cust_id}", name: "Assay Starter Kit", components: [ { product_id: "${prod_a}", quantity_per_kit: 2 }, { product_id: "${prod_b}", quantity_per_kit: 3 } ] }, as: CatalogManager, captures: { kit_id: "$.data.id" } }
          trigger:
            - { call: "POST /lab/kits/${kit_id}/activate", payload: {}, as: CatalogManager, captures: { price: "$.data.kit_price_cents" } }
          assert:
            - "captured price == 36500 (component_cost 35000 keyed tier 1 fee 1500; 35000 + 1500)"
            - "KitDefinition.${kit_id}.status == ACTIVE"

  - rule_id: non_linear_state_machine
    instances:
      - name: order_backorder_cycle_on_stock_arrival
        grounds:
          - state_machines.Order.DRAFT_to_BACKORDERED
          - state_machines.Order.BACKORDERED_to_ALLOCATED
          - state_machines.OrderLine.PENDING_to_PARTIALLY_ALLOCATED
          - state_machines.ReagentLot.AVAILABLE_to_DEPLETED
        distinguishing_aspect: |
          Order exhibits the cycle DRAFT -> BACKORDERED -> ALLOCATED: submit with
          only 5 of 10 units available backorders with a partial HELD reservation;
          a later lot receipt top-up retry (submission_seq-ordered waitlist)
          completes the line and flips the order to ALLOCATED.
        test_recipe:
          setup:
            - "Warehouse + REFRIGERATED_2_8 FEFO zone + cold-chain product (20000 cents) + FULL customer; lot L1 of 5 units only"
            - "Order qty 10 requested_ship_date 2026-05-10 EXPRESS; submit -> BACKORDERED with 5 units held"
          setup_api_calls:
            - { call: "POST /lab/warehouses", payload: { name: "WH-NE", region_code: "US-NE", hazmat_certified: true }, as: OpsAdmin, captures: { wh_id: "$.data.id" } }
            - { call: "POST /lab/storage-zones", payload: { warehouse_id: "${wh_id}", zone_class: "REFRIGERATED_2_8", capacity_units: 1000, rotation_policy: "FEFO" }, as: OpsAdmin, captures: { zone_id: "$.data.id" } }
            - { call: "POST /lab/products", payload: { sku: "RG-100", name: "Enzyme Mix", storage_requirement: "REFRIGERATED_2_8", hazard_class: "NON_HAZARDOUS", max_qty_per_shipment: 500, unit_price_cents: 20000, requires_cold_chain: true, shelf_life_days: 60, min_remaining_shelf_life_days: 7 }, as: CatalogManager, captures: { prod_id: "$.data.id" } }
            - { call: "POST /lab/customers", payload: { name: "Lab Alpha", credit_limit_cents: 10000000, hazmat_endorsement: "FULL", cold_chain_certified: true }, as: AccountManager, captures: { cust_id: "$.data.id" } }
            - { call: "POST /lab/lots", payload: { product_id: "${prod_id}", warehouse_id: "${wh_id}", storage_zone_id: "${zone_id}", quantity_received: 5, manufacture_date: "2026-04-01" }, as: InventoryClerk, captures: { lot1_id: "$.data.id" } }
            - { call: "POST /lab/orders", payload: { customer_id: "${cust_id}", warehouse_id: "${wh_id}", shipping_service: "EXPRESS", requested_ship_date: "2026-05-10", lines: [ { product_id: "${prod_id}", quantity: 10, fulfillment_mode: "ANY" } ] }, as: Customer, as_user_id: "${cust_id}", captures: { order_id: "$.data.id" } }
            - { call: "POST /lab/orders/${order_id}/submit", payload: {}, as: Customer, as_user_id: "${cust_id}", captures: { st1: "$.data.status" } }
          trigger:
            - { call: "POST /lab/lots", payload: { product_id: "${prod_id}", warehouse_id: "${wh_id}", storage_zone_id: "${zone_id}", quantity_received: 10, manufacture_date: "2026-04-15" }, as: InventoryClerk, captures: { lot2_id: "$.data.id" } }
            - { call: "GET /lab/orders/${order_id}", payload: {}, as: OpsAdmin, captures: { st2: "$.data.status" } }
            - { call: "GET /lab/order-lines", payload: { order_id: "${order_id}" }, as: OpsAdmin, captures: { alloc_qty: "$.data[0].allocated_quantity", line_st: "$.data[0].status" } }
          assert:
            - "captured st1 == BACKORDERED (partial allocation persisted, not rejected)"
            - "captured st2 == ALLOCATED after the receipt's waitlist top-up (cycle BACKORDERED -> ALLOCATED)"
            - "captured alloc_qty == 10 and line_st == ALLOCATED"
            - "ReagentLot.${lot1_id}.status == DEPLETED (on_hand driven to exactly 0) and ReagentLot.${lot2_id}.quantity_on_hand == 5 with quantity_reserved == 5"

      - name: lot_quarantine_release_cycle
        grounds:
          - state_machines.ReagentLot.AVAILABLE_to_QUARANTINED
          - state_machines.ReagentLot.QUARANTINED_to_AVAILABLE
        distinguishing_aspect: |
          ReagentLot exhibits the cycle AVAILABLE -> QUARANTINED -> AVAILABLE on a
          different entity than Order: a manual quarantine with no ISSUED recall
          covering the lot can be released back to AVAILABLE.
        test_recipe:
          setup:
            - "Warehouse + zone + product + lot of 20 units; no recalls exist"
          setup_api_calls:
            - { call: "POST /lab/warehouses", payload: { name: "WH-NE", region_code: "US-NE", hazmat_certified: true }, as: OpsAdmin, captures: { wh_id: "$.data.id" } }
            - { call: "POST /lab/storage-zones", payload: { warehouse_id: "${wh_id}", zone_class: "AMBIENT", capacity_units: 500 }, as: OpsAdmin, captures: { zone_id: "$.data.id" } }
            - { call: "POST /lab/products", payload: { sku: "CH-105", name: "Buffer Salt", storage_requirement: "AMBIENT", hazard_class: "NON_HAZARDOUS", max_qty_per_shipment: 500, unit_price_cents: 105, requires_cold_chain: false, shelf_life_days: 365, min_remaining_shelf_life_days: 7 }, as: CatalogManager, captures: { prod_id: "$.data.id" } }
            - { call: "POST /lab/lots", payload: { product_id: "${prod_id}", warehouse_id: "${wh_id}", storage_zone_id: "${zone_id}", quantity_received: 20, manufacture_date: "2026-01-15" }, as: InventoryClerk, captures: { lot_id: "$.data.id", v1: "$.data.version" } }
          trigger:
            - { call: "POST /lab/lots/${lot_id}/quarantine", payload: {}, as: QualityManager, captures: { st_q: "$.data.status", v2: "$.data.version" } }
            - { call: "POST /lab/lots/${lot_id}/release-quarantine", payload: {}, as: QualityManager, captures: { st_a: "$.data.status", v3: "$.data.version" } }
          assert:
            - "captured st_q == QUARANTINED and st_a == AVAILABLE (full cycle traversed)"
            - "captured v1 == 1, v2 == 2, v3 == 3 (each mutation increments version)"
            - "ReagentLot.${lot_id}.quantity_on_hand == 20 throughout (quarantine moves no units)"

  - rule_id: transitive_cascade
    instances:
      - name: recall_issue_cascade_depth4
        grounds:
          - state_machines.RecallNotice.DRAFT_to_ISSUED
          - state_machines.ReagentLot.AVAILABLE_to_QUARANTINED
          - state_machines.LotReservation.HELD_to_RELEASED
          - state_machines.OrderLine.ALLOCATED_to_PENDING
          - state_machines.Order.ALLOCATED_to_BACKORDERED
        distinguishing_aspect: |
          Depth-4 chain from POST /lab/recalls/{id}/issue: recall -> lot
          QUARANTINED -> its HELD reservation RELEASED (each hop caused by the
          previous one) -> order line demoted ALLOCATED -> PENDING -> order
          demoted ALLOCATED -> BACKORDERED.
        test_recipe:
          setup:
            - "Warehouse + zone + product (20000 cents) + customer; lot L1 qty 10 is the ONLY lot"
            - "Order qty 10 ANY submit -> ALLOCATED; single HELD reservation of 10 on L1"
            - "DRAFT recall on the product with scope LOT_RANGE seq 1..1"
          setup_api_calls:
            - { call: "POST /lab/warehouses", payload: { name: "WH-NE", region_code: "US-NE", hazmat_certified: true }, as: OpsAdmin, captures: { wh_id: "$.data.id" } }
            - { call: "POST /lab/storage-zones", payload: { warehouse_id: "${wh_id}", zone_class: "REFRIGERATED_2_8", capacity_units: 1000, rotation_policy: "FEFO" }, as: OpsAdmin, captures: { zone_id: "$.data.id" } }
            - { call: "POST /lab/products", payload: { sku: "RG-100", name: "Enzyme Mix", storage_requirement: "REFRIGERATED_2_8", hazard_class: "NON_HAZARDOUS", max_qty_per_shipment: 500, unit_price_cents: 20000, requires_cold_chain: true, shelf_life_days: 60, min_remaining_shelf_life_days: 7 }, as: CatalogManager, captures: { prod_id: "$.data.id" } }
            - { call: "POST /lab/customers", payload: { name: "Lab Alpha", credit_limit_cents: 10000000, hazmat_endorsement: "FULL", cold_chain_certified: true }, as: AccountManager, captures: { cust_id: "$.data.id" } }
            - { call: "POST /lab/lots", payload: { product_id: "${prod_id}", warehouse_id: "${wh_id}", storage_zone_id: "${zone_id}", quantity_received: 10, manufacture_date: "2026-04-01" }, as: InventoryClerk, captures: { lot_id: "$.data.id" } }
            - { call: "POST /lab/orders", payload: { customer_id: "${cust_id}", warehouse_id: "${wh_id}", shipping_service: "EXPRESS", requested_ship_date: "2026-05-10", lines: [ { product_id: "${prod_id}", quantity: 10, fulfillment_mode: "ANY" } ] }, as: Customer, as_user_id: "${cust_id}", captures: { order_id: "$.data.id" } }
            - { call: "POST /lab/orders/${order_id}/submit", payload: {}, as: Customer, as_user_id: "${cust_id}" }
            - { call: "GET /lab/order-lines", payload: { order_id: "${order_id}" }, as: OpsAdmin, captures: { line_id: "$.data[0].id" } }
            - { call: "GET /lab/reservations", payload: { order_line_id: "${line_id}" }, as: OpsAdmin, captures: { res_id: "$.data[0].id" } }
            - { call: "POST /lab/recalls", payload: { product_id: "${prod_id}", scope_type: "LOT_RANGE", scope_lot_seq_min: 1, scope_lot_seq_max: 1, severity_class: "CLASS_II", reason: "Impurity detected" }, as: QualityManager, captures: { recall_id: "$.data.id" } }
          trigger:
            - { call: "POST /lab/recalls/${recall_id}/issue", payload: {}, as: QualityManager }
          assert:
            - "ReagentLot.${lot_id}.status == QUARANTINED and recall_id == ${recall_id} (hop 1)"
            - "LotReservation.${res_id}.status == RELEASED and lot quantity_on_hand restored to 10 with quantity_reserved == 0 (hop 2)"
            - "OrderLine.${line_id}.status == PENDING and allocated_quantity == 0 (hop 3)"
            - "Order.${order_id}.status == BACKORDERED (hop 4)"
            - "Product.${prod_id}.status == LISTED (LOT_RANGE scope does not flip the product)"

      - name: excursion_destroy_cascade_depth3
        grounds:
          - state_machines.TemperatureExcursion.OPEN_to_DESTROYED
          - state_machines.Shipment.EXCURSION_HOLD_to_RETURNED
          - state_machines.Order.SHIPPED_to_REFUNDED
          - calculations.excursion_credit
        distinguishing_aspect: |
          Depth-3 chain from a different trigger (excursion disposition, not
          recall issue): disposition DESTROYED -> shipment EXCURSION_HOLD ->
          RETURNED -> order SHIPPED -> REFUNDED -> customer invoice reversed.
        test_recipe:
          setup:
            - "Cold-chain order (2 x 20000 = 40000) dispatched at actual 3000 g; invoice 42300 posted; excursion OPEN from a 12.5C/90min reading"
          setup_api_calls:
            - { call: "POST /lab/warehouses", payload: { name: "WH-NE", region_code: "US-NE", hazmat_certified: true }, as: OpsAdmin, captures: { wh_id: "$.data.id" } }
            - { call: "POST /lab/storage-zones", payload: { warehouse_id: "${wh_id}", zone_class: "REFRIGERATED_2_8", capacity_units: 1000, rotation_policy: "FEFO" }, as: OpsAdmin, captures: { zone_id: "$.data.id" } }
            - { call: "POST /lab/products", payload: { sku: "RG-100", name: "Enzyme Mix", storage_requirement: "REFRIGERATED_2_8", hazard_class: "NON_HAZARDOUS", max_qty_per_shipment: 500, unit_price_cents: 20000, requires_cold_chain: true, shelf_life_days: 60, min_remaining_shelf_life_days: 7 }, as: CatalogManager, captures: { prod_id: "$.data.id" } }
            - { call: "POST /lab/customers", payload: { name: "Lab Alpha", credit_limit_cents: 10000000, hazmat_endorsement: "FULL", cold_chain_certified: true }, as: AccountManager, captures: { cust_id: "$.data.id" } }
            - { call: "POST /lab/lots", payload: { product_id: "${prod_id}", warehouse_id: "${wh_id}", storage_zone_id: "${zone_id}", quantity_received: 100, manufacture_date: "2026-04-01" }, as: InventoryClerk }
            - { call: "POST /lab/orders", payload: { customer_id: "${cust_id}", warehouse_id: "${wh_id}", shipping_service: "EXPRESS", requested_ship_date: "2026-05-10", lines: [ { product_id: "${prod_id}", quantity: 2, fulfillment_mode: "ANY" } ] }, as: Customer, as_user_id: "${cust_id}", captures: { order_id: "$.data.id" } }
            - { call: "POST /lab/orders/${order_id}/submit", payload: {}, as: Customer, as_user_id: "${cust_id}" }
            - { call: "POST /lab/shipments", payload: { order_id: "${order_id}", coolant_type: "DRY_ICE", coolant_units: 2, declared_weight_grams: 3000 }, as: InventoryClerk, captures: { ship_id: "$.data.id" } }
            - { call: "POST /lab/shipments/${ship_id}/pack", payload: {}, as: InventoryClerk }
            - { call: "POST /lab/shipments/${ship_id}/dispatch", payload: { actual_weight_grams: 3000 }, as: InventoryClerk }
            - { call: "POST /lab/shipments/${ship_id}/record-temperature", payload: { temp_celsius: 12.5, duration_minutes: 90 }, as: InventoryClerk, captures: { exc_id: "$.data.excursion_id" } }
          trigger:
            - { call: "POST /lab/excursions/${exc_id}/disposition", payload: { decision: "DESTROYED" }, as: QualityManager }
          assert:
            - "TemperatureExcursion.${exc_id}.status == DESTROYED and final_credit_cents == 40000"
            - "Shipment.${ship_id}.status == RETURNED (hop 1)"
            - "Order.${order_id}.status == REFUNDED (hop 2)"
            - "CustomerAccount.${cust_id}.outstanding_balance_cents == 0 (hop 3: invoice 42300 fully reversed)"

  - rule_id: priority_pair_validation_conflict
    instances:
      - name: state_beats_fiscal_on_cancelled_order_submit
        grounds:
          - validations[priority=7]
          - validations[priority=24]
          - errors[ERR_ORDER_NOT_SUBMITTABLE]
          - errors[ERR_CREDIT_LIMIT_EXCEEDED]
        distinguishing_aspect: |
          Error-category pair state vs business_fiscal: the order is CANCELLED
          (priority 7) AND the projected total 1800 exceeds credit_limit 100
          (priority 24); the response must be ERR_ORDER_NOT_SUBMITTABLE, never
          ERR_CREDIT_LIMIT_EXCEEDED.
        test_recipe:
          setup:
            - "Warehouse + AMBIENT zone + product at 1000 cents; customer with credit_limit_cents 100 (no stock needed — the request must fail before allocation)"
            - "Order qty 1 created in DRAFT then cancelled -> CANCELLED"
          setup_api_calls:
            - { call: "POST /lab/warehouses", payload: { name: "WH-NE", region_code: "US-NE", hazmat_certified: true }, as: OpsAdmin, captures: { wh_id: "$.data.id" } }
            - { call: "POST /lab/storage-zones", payload: { warehouse_id: "${wh_id}", zone_class: "AMBIENT", capacity_units: 500 }, as: OpsAdmin, captures: { zone_id: "$.data.id" } }
            - { call: "POST /lab/products", payload: { sku: "CH-1000", name: "Assay Vial", storage_requirement: "AMBIENT", hazard_class: "NON_HAZARDOUS", max_qty_per_shipment: 500, unit_price_cents: 1000, requires_cold_chain: false, shelf_life_days: 365, min_remaining_shelf_life_days: 7 }, as: CatalogManager, captures: { prod_id: "$.data.id" } }
            - { call: "POST /lab/customers", payload: { name: "Lab Tiny", credit_limit_cents: 100 }, as: AccountManager, captures: { cust_id: "$.data.id" } }
            - { call: "POST /lab/orders", payload: { customer_id: "${cust_id}", warehouse_id: "${wh_id}", shipping_service: "STANDARD", requested_ship_date: "2026-05-10", lines: [ { product_id: "${prod_id}", quantity: 1, fulfillment_mode: "ANY" } ] }, as: Customer, as_user_id: "${cust_id}", captures: { order_id: "$.data.id" } }
            - { call: "POST /lab/orders/${order_id}/cancel", payload: {}, as: Customer, as_user_id: "${cust_id}" }
          trigger:
            - { call: "POST /lab/orders/${order_id}/submit", payload: {}, as: Customer, as_user_id: "${cust_id}", captures: { err: "$.data.error_id" } }
          assert:
            - "captured err == ERR_ORDER_NOT_SUBMITTABLE (state, priority 7, wins over fiscal priority 24)"
            - "HTTP status == 409, not 402"
            - "Order.${order_id}.status remains CANCELLED"

      - name: safety_beats_fiscal_on_recalled_consumption
        grounds:
          - validations[priority=12]
          - validations[priority=22]
          - errors[ERR_PRODUCT_UNDER_RECALL]
          - errors[ERR_CONSIGNMENT_CEILING_EXCEEDED]
        distinguishing_aspect: |
          Error-category pair business_safety vs business_fiscal (a different
          pair than state-vs-fiscal): the consumption references a product under
          an ISSUED recall (priority 12) AND would push consumed_quantity 11 over
          ceiling 10 (priority 22); the response must be ERR_PRODUCT_UNDER_RECALL.
        test_recipe:
          setup:
            - "Warehouse + zone + AMBIENT product; consignment agreement (ceiling 10, initial_stocked 10, reorder_point 0, price 500, window [2026-05-01, 2027-05-01))"
            - "Consumption of 6 already recorded (consumed_quantity == 6)"
            - "PRODUCT_ALL recall ISSUED for the product (no lots exist, so no lot cascade fires)"
          setup_api_calls:
            - { call: "POST /lab/warehouses", payload: { name: "WH-NE", region_code: "US-NE", hazmat_certified: true }, as: OpsAdmin, captures: { wh_id: "$.data.id" } }
            - { call: "POST /lab/products", payload: { sku: "CS-500", name: "Consigned Stain", storage_requirement: "AMBIENT", hazard_class: "NON_HAZARDOUS", max_qty_per_shipment: 500, unit_price_cents: 500, requires_cold_chain: false, shelf_life_days: 365, min_remaining_shelf_life_days: 7 }, as: CatalogManager, captures: { prod_id: "$.data.id" } }
            - { call: "POST /lab/customers", payload: { name: "Lab Kappa", credit_limit_cents: 10000000 }, as: AccountManager, captures: { cust_id: "$.data.id" } }
            - { call: "POST /lab/consignment-agreements", payload: { customer_id: "${cust_id}", product_id: "${prod_id}", ceiling_quantity: 10, reorder_point: 0, contract_unit_price_cents: 500, replenishment_warehouse_id: "${wh_id}", initial_stocked_quantity: 10, effective_from: "2026-05-01", effective_until: "2027-05-01" }, as: AccountManager, captures: { agr_id: "$.data.id" } }
            - { call: "POST /lab/consignment-agreements/${agr_id}/consumption", payload: { quantity: 6 }, as: AccountManager }
            - { call: "POST /lab/recalls", payload: { product_id: "${prod_id}", scope_type: "PRODUCT_ALL", severity_class: "CLASS_I", reason: "Contamination" }, as: QualityManager, captures: { recall_id: "$.data.id" } }
            - { call: "POST /lab/recalls/${recall_id}/issue", payload: {}, as: QualityManager }
          trigger:
            - { call: "POST /lab/consignment-agreements/${agr_id}/consumption", payload: { quantity: 5 }, as: AccountManager, captures: { err: "$.data.error_id" } }
          assert:
            - "captured err == ERR_PRODUCT_UNDER_RECALL (safety, priority 12, wins over fiscal ceiling, priority 22)"
            - "ConsignmentAgreement.${agr_id}.consumed_quantity remains 6 (no partial posting)"

  - rule_id: boundary_precision_check
    instances:
      - name: hazmat_class_cap_exactly_at_limit
        grounds:
          - calculations.hazmat_load_check
          - errors[ERR_HAZMAT_CLASS_LIMIT_EXCEEDED]
        distinguishing_aspect: |
          Metric: hazmat load units. TOXIC cap is 10: a shipment whose TOXIC
          class load equals exactly 10 is created (201); a load of 11 is
          rejected ERR_HAZMAT_CLASS_LIMIT_EXCEEDED. Endpoint: POST /lab/shipments.
        test_recipe:
          setup:
            - "Hazmat-certified warehouse, AMBIENT zone, TOXIC product (unit_haz_factor 1, max_qty_per_shipment 100, price 1000), FULL customer, lot of 30"
            - "Order A qty 10 submit -> ALLOCATED; Order B qty 11 submit -> ALLOCATED"
          setup_api_calls:
            - { call: "POST /lab/warehouses", payload: { name: "WH-HZ", region_code: "US-SW", hazmat_certified: true }, as: OpsAdmin, captures: { wh_id: "$.data.id" } }
            - { call: "POST /lab/storage-zones", payload: { warehouse_id: "${wh_id}", zone_class: "AMBIENT", capacity_units: 500 }, as: OpsAdmin, captures: { zone_id: "$.data.id" } }
            - { call: "POST /lab/products", payload: { sku: "TX-10", name: "Toxin Reagent", storage_requirement: "AMBIENT", hazard_class: "TOXIC", unit_haz_factor: 1, max_qty_per_shipment: 100, unit_price_cents: 1000, requires_cold_chain: false, shelf_life_days: 365, min_remaining_shelf_life_days: 7 }, as: CatalogManager, captures: { prod_id: "$.data.id" } }
            - { call: "POST /lab/customers", payload: { name: "Lab Haz", credit_limit_cents: 10000000, hazmat_endorsement: "FULL" }, as: AccountManager, captures: { cust_id: "$.data.id" } }
            - { call: "POST /lab/lots", payload: { product_id: "${prod_id}", warehouse_id: "${wh_id}", storage_zone_id: "${zone_id}", quantity_received: 30, manufacture_date: "2026-01-15" }, as: InventoryClerk }
            - { call: "POST /lab/orders", payload: { customer_id: "${cust_id}", warehouse_id: "${wh_id}", shipping_service: "STANDARD", requested_ship_date: "2026-05-10", lines: [ { product_id: "${prod_id}", quantity: 10, fulfillment_mode: "ANY" } ] }, as: Customer, as_user_id: "${cust_id}", captures: { order_a: "$.data.id" } }
            - { call: "POST /lab/orders/${order_a}/submit", payload: {}, as: Customer, as_user_id: "${cust_id}" }
            - { call: "POST /lab/orders", payload: { customer_id: "${cust_id}", warehouse_id: "${wh_id}", shipping_service: "STANDARD", requested_ship_date: "2026-05-10", lines: [ { product_id: "${prod_id}", quantity: 11, fulfillment_mode: "ANY" } ] }, as: Customer, as_user_id: "${cust_id}", captures: { order_b: "$.data.id" } }
            - { call: "POST /lab/orders/${order_b}/submit", payload: {}, as: Customer, as_user_id: "${cust_id}" }
          trigger:
            - { call: "POST /lab/shipments", payload: { order_id: "${order_a}", coolant_type: "NONE", coolant_units: 0, declared_weight_grams: 3000 }, as: InventoryClerk, captures: { ship_a: "$.data.id" } }
            - { call: "POST /lab/shipments", payload: { order_id: "${order_b}", coolant_type: "NONE", coolant_units: 0, declared_weight_grams: 3000 }, as: InventoryClerk, captures: { err: "$.data.error_id" } }
          assert:
            - "Shipment A created with captured ship_id present (class load 10 == cap 10 passes: <=, not <)"
            - "captured err == ERR_HAZMAT_CLASS_LIMIT_EXCEEDED (class load 11 > cap 10)"
            - "Order.${order_b} remains ALLOCATED (the rejection frees nothing)"

      - name: free_freight_threshold_boundary
        grounds:
          - calculations.freight_cost
          - entities.Order.fields.product_total_cents
        distinguishing_aspect: |
          Metric: money cents. product_total_cents == 250000 exactly yields
          provisional freight 0; 249999 yields 800 (STANDARD base, 3000 g, no
          coolant). Endpoint: POST /lab/shipments (a different endpoint than the
          hazmat boundary's twin assertion path, exercised via shipment create).
        test_recipe:
          setup:
            - "Warehouse + AMBIENT zone; product X at 125000 cents, product Y at 249999 cents; customer with ample credit; lot of 5 for each"
            - "Order A: qty 2 of X (total exactly 250000) ALLOCATED; Order B: qty 1 of Y (total 249999) ALLOCATED"
          setup_api_calls:
            - { call: "POST /lab/warehouses", payload: { name: "WH-NE", region_code: "US-NE", hazmat_certified: true }, as: OpsAdmin, captures: { wh_id: "$.data.id" } }
            - { call: "POST /lab/storage-zones", payload: { warehouse_id: "${wh_id}", zone_class: "AMBIENT", capacity_units: 500 }, as: OpsAdmin, captures: { zone_id: "$.data.id" } }
            - { call: "POST /lab/products", payload: { sku: "PX-125", name: "Analyzer Column", storage_requirement: "AMBIENT", hazard_class: "NON_HAZARDOUS", max_qty_per_shipment: 500, unit_price_cents: 125000, requires_cold_chain: false, shelf_life_days: 365, min_remaining_shelf_life_days: 7 }, as: CatalogManager, captures: { prod_x: "$.data.id" } }
            - { call: "POST /lab/products", payload: { sku: "PY-249", name: "Centrifuge Rotor", storage_requirement: "AMBIENT", hazard_class: "NON_HAZARDOUS", max_qty_per_shipment: 500, unit_price_cents: 249999, requires_cold_chain: false, shelf_life_days: 365, min_remaining_shelf_life_days: 7 }, as: CatalogManager, captures: { prod_y: "$.data.id" } }
            - { call: "POST /lab/customers", payload: { name: "Lab Big", credit_limit_cents: 100000000 }, as: AccountManager, captures: { cust_id: "$.data.id" } }
            - { call: "POST /lab/lots", payload: { product_id: "${prod_x}", warehouse_id: "${wh_id}", storage_zone_id: "${zone_id}", quantity_received: 5, manufacture_date: "2026-01-15" }, as: InventoryClerk }
            - { call: "POST /lab/lots", payload: { product_id: "${prod_y}", warehouse_id: "${wh_id}", storage_zone_id: "${zone_id}", quantity_received: 5, manufacture_date: "2026-01-15" }, as: InventoryClerk }
            - { call: "POST /lab/orders", payload: { customer_id: "${cust_id}", warehouse_id: "${wh_id}", shipping_service: "STANDARD", requested_ship_date: "2026-05-10", lines: [ { product_id: "${prod_x}", quantity: 2, fulfillment_mode: "ANY" } ] }, as: Customer, as_user_id: "${cust_id}", captures: { order_a: "$.data.id" } }
            - { call: "POST /lab/orders/${order_a}/submit", payload: {}, as: Customer, as_user_id: "${cust_id}", captures: { total_a: "$.data.product_total_cents" } }
            - { call: "POST /lab/orders", payload: { customer_id: "${cust_id}", warehouse_id: "${wh_id}", shipping_service: "STANDARD", requested_ship_date: "2026-05-10", lines: [ { product_id: "${prod_y}", quantity: 1, fulfillment_mode: "ANY" } ] }, as: Customer, as_user_id: "${cust_id}", captures: { order_b: "$.data.id" } }
            - { call: "POST /lab/orders/${order_b}/submit", payload: {}, as: Customer, as_user_id: "${cust_id}", captures: { total_b: "$.data.product_total_cents" } }
          trigger:
            - { call: "POST /lab/shipments", payload: { order_id: "${order_a}", coolant_type: "NONE", coolant_units: 0, declared_weight_grams: 3000 }, as: InventoryClerk, captures: { fr_a: "$.data.provisional_freight_cents" } }
            - { call: "POST /lab/shipments", payload: { order_id: "${order_b}", coolant_type: "NONE", coolant_units: 0, declared_weight_grams: 3000 }, as: InventoryClerk, captures: { fr_b: "$.data.provisional_freight_cents" } }
          assert:
            - "captured total_a == 250000 and captured fr_a == 0 (>= threshold, inclusive)"
            - "captured total_b == 249999 and captured fr_b == 800 (one cent below the threshold pays full base freight)"

      - name: kit_activation_empty_components_rejected
        grounds:
          - validations[priority=19]
          - errors[ERR_KIT_COMPONENTS_EMPTY]
          - state_machines.KitDefinition.DRAFT_to_ACTIVE
        distinguishing_aspect: |
          Metric: collection cardinality. A kit whose components array has
          cardinality 0 fails activation with ERR_KIT_COMPONENTS_EMPTY (422) on
          POST /lab/kits/{kitId}/activate; cardinality 1 activates fine — the
          empty-set edge is distinct from both numeric thresholds above.
        test_recipe:
          setup:
            - "Customer exists; DRAFT kit created with components: []"
          setup_api_calls:
            - { call: "POST /lab/customers", payload: { name: "Lab Delta", credit_limit_cents: 10000000 }, as: AccountManager, captures: { cust_id: "$.data.id" } }
            - { call: "POST /lab/kits", payload: { customer_id: "${cust_id}", name: "Empty Kit", components: [] }, as: CatalogManager, captures: { kit_id: "$.data.id" } }
          trigger:
            - { call: "POST /lab/kits/${kit_id}/activate", payload: {}, as: CatalogManager, captures: { err: "$.data.error_id" } }
          assert:
            - "captured err == ERR_KIT_COMPONENTS_EMPTY and HTTP status == 422"
            - "KitDefinition.${kit_id}.status remains DRAFT and kit_price_cents remains null"

  - rule_id: cross_entity_state_dependency
    instances:
      - name: order_submit_requires_customer_active
        grounds:
          - state_machines.Order.DRAFT_to_ALLOCATED
          - entities.CustomerAccount.fields.status
          - errors[ERR_CUSTOMER_NOT_ACTIVE]
        distinguishing_aspect: |
          Entity pair Order -> CustomerAccount: submit is gated on the CUSTOMER's
          status field; a SUSPENDED account makes an otherwise-valid DRAFT order
          unsubmittable with ERR_CUSTOMER_NOT_ACTIVE.
        test_recipe:
          setup:
            - "Warehouse + zone + product + lot of 10; customer created ACTIVE"
            - "Order qty 1 in DRAFT; account then suspended by AccountManager"
          setup_api_calls:
            - { call: "POST /lab/warehouses", payload: { name: "WH-NE", region_code: "US-NE", hazmat_certified: true }, as: OpsAdmin, captures: { wh_id: "$.data.id" } }
            - { call: "POST /lab/storage-zones", payload: { warehouse_id: "${wh_id}", zone_class: "AMBIENT", capacity_units: 500 }, as: OpsAdmin, captures: { zone_id: "$.data.id" } }
            - { call: "POST /lab/products", payload: { sku: "CH-1000", name: "Assay Vial", storage_requirement: "AMBIENT", hazard_class: "NON_HAZARDOUS", max_qty_per_shipment: 500, unit_price_cents: 1000, requires_cold_chain: false, shelf_life_days: 365, min_remaining_shelf_life_days: 7 }, as: CatalogManager, captures: { prod_id: "$.data.id" } }
            - { call: "POST /lab/customers", payload: { name: "Lab Mu", credit_limit_cents: 10000000 }, as: AccountManager, captures: { cust_id: "$.data.id" } }
            - { call: "POST /lab/lots", payload: { product_id: "${prod_id}", warehouse_id: "${wh_id}", storage_zone_id: "${zone_id}", quantity_received: 10, manufacture_date: "2026-01-15" }, as: InventoryClerk }
            - { call: "POST /lab/orders", payload: { customer_id: "${cust_id}", warehouse_id: "${wh_id}", shipping_service: "STANDARD", requested_ship_date: "2026-05-10", lines: [ { product_id: "${prod_id}", quantity: 1, fulfillment_mode: "ANY" } ] }, as: Customer, as_user_id: "${cust_id}", captures: { order_id: "$.data.id" } }
            - { call: "POST /lab/customers/${cust_id}/suspend", payload: {}, as: AccountManager }
          trigger:
            - { call: "POST /lab/orders/${order_id}/submit", payload: {}, as: Customer, as_user_id: "${cust_id}", captures: { err: "$.data.error_id" } }
          assert:
            - "captured err == ERR_CUSTOMER_NOT_ACTIVE"
            - "Order.${order_id}.status remains DRAFT; no LotReservation rows exist for the order"

      - name: shipment_dispatch_requires_warehouse_operational
        grounds:
          - state_machines.Shipment.PACKED_to_IN_TRANSIT
          - entities.Warehouse.fields.status
          - errors[ERR_WAREHOUSE_NOT_OPERATIONAL]
        distinguishing_aspect: |
          Entity pair Shipment -> Warehouse (different pair than Order ->
          CustomerAccount): dispatch is gated on the WAREHOUSE's status; a
          SUSPENDED warehouse blocks dispatch of a PACKED shipment with
          ERR_WAREHOUSE_NOT_OPERATIONAL.
        test_recipe:
          setup:
            - "Full chain to PACKED shipment (cold-chain product 2 x 20000, DRY_ICE x2)"
            - "Warehouse suspended after pack"
          setup_api_calls:
            - { call: "POST /lab/warehouses", payload: { name: "WH-NE", region_code: "US-NE", hazmat_certified: true }, as: OpsAdmin, captures: { wh_id: "$.data.id" } }
            - { call: "POST /lab/storage-zones", payload: { warehouse_id: "${wh_id}", zone_class: "REFRIGERATED_2_8", capacity_units: 1000, rotation_policy: "FEFO" }, as: OpsAdmin, captures: { zone_id: "$.data.id" } }
            - { call: "POST /lab/products", payload: { sku: "RG-100", name: "Enzyme Mix", storage_requirement: "REFRIGERATED_2_8", hazard_class: "NON_HAZARDOUS", max_qty_per_shipment: 500, unit_price_cents: 20000, requires_cold_chain: true, shelf_life_days: 60, min_remaining_shelf_life_days: 7 }, as: CatalogManager, captures: { prod_id: "$.data.id" } }
            - { call: "POST /lab/customers", payload: { name: "Lab Alpha", credit_limit_cents: 10000000, hazmat_endorsement: "FULL", cold_chain_certified: true }, as: AccountManager, captures: { cust_id: "$.data.id" } }
            - { call: "POST /lab/lots", payload: { product_id: "${prod_id}", warehouse_id: "${wh_id}", storage_zone_id: "${zone_id}", quantity_received: 100, manufacture_date: "2026-04-01" }, as: InventoryClerk }
            - { call: "POST /lab/orders", payload: { customer_id: "${cust_id}", warehouse_id: "${wh_id}", shipping_service: "EXPRESS", requested_ship_date: "2026-05-10", lines: [ { product_id: "${prod_id}", quantity: 2, fulfillment_mode: "ANY" } ] }, as: Customer, as_user_id: "${cust_id}", captures: { order_id: "$.data.id" } }
            - { call: "POST /lab/orders/${order_id}/submit", payload: {}, as: Customer, as_user_id: "${cust_id}" }
            - { call: "POST /lab/shipments", payload: { order_id: "${order_id}", coolant_type: "DRY_ICE", coolant_units: 2, declared_weight_grams: 3000 }, as: InventoryClerk, captures: { ship_id: "$.data.id" } }
            - { call: "POST /lab/shipments/${ship_id}/pack", payload: {}, as: InventoryClerk }
            - { call: "POST /lab/warehouses/${wh_id}/suspend", payload: {}, as: OpsAdmin }
          trigger:
            - { call: "POST /lab/shipments/${ship_id}/dispatch", payload: { actual_weight_grams: 3000 }, as: InventoryClerk, captures: { err: "$.data.error_id" } }
          assert:
            - "captured err == ERR_WAREHOUSE_NOT_OPERATIONAL"
            - "Shipment.${ship_id}.status remains PACKED and final_freight_cents remains null"
            - "CustomerAccount.${cust_id}.outstanding_balance_cents == 0 (no invoice posted)"

      - name: lot_release_blocked_by_issued_recall
        grounds:
          - state_machines.ReagentLot.QUARANTINED_to_AVAILABLE
          - entities.RecallNotice.fields.status
          - errors[ERR_RECALL_ACTIVE_FOR_LOT]
        distinguishing_aspect: |
          Entity pair ReagentLot -> RecallNotice (a third distinct pair): a
          QUARANTINED lot cannot be released while a covering RecallNotice has
          status ISSUED; only after the recall CLOSES (or never covered it) is
          release legal.
        test_recipe:
          setup:
            - "Warehouse + zone + product + lot L1 qty 10 (sequence 1)"
            - "DRAFT recall LOT_RANGE 1..1 issued -> L1 QUARANTINED with recall_id set"
          setup_api_calls:
            - { call: "POST /lab/warehouses", payload: { name: "WH-NE", region_code: "US-NE", hazmat_certified: true }, as: OpsAdmin, captures: { wh_id: "$.data.id" } }
            - { call: "POST /lab/storage-zones", payload: { warehouse_id: "${wh_id}", zone_class: "AMBIENT", capacity_units: 500 }, as: OpsAdmin, captures: { zone_id: "$.data.id" } }
            - { call: "POST /lab/products", payload: { sku: "CH-105", name: "Buffer Salt", storage_requirement: "AMBIENT", hazard_class: "NON_HAZARDOUS", max_qty_per_shipment: 500, unit_price_cents: 105, requires_cold_chain: false, shelf_life_days: 365, min_remaining_shelf_life_days: 7 }, as: CatalogManager, captures: { prod_id: "$.data.id" } }
            - { call: "POST /lab/lots", payload: { product_id: "${prod_id}", warehouse_id: "${wh_id}", storage_zone_id: "${zone_id}", quantity_received: 10, manufacture_date: "2026-01-15" }, as: InventoryClerk, captures: { lot_id: "$.data.id" } }
            - { call: "POST /lab/recalls", payload: { product_id: "${prod_id}", scope_type: "LOT_RANGE", scope_lot_seq_min: 1, scope_lot_seq_max: 1, severity_class: "CLASS_III", reason: "Label defect" }, as: QualityManager, captures: { recall_id: "$.data.id" } }
            - { call: "POST /lab/recalls/${recall_id}/issue", payload: {}, as: QualityManager }
          trigger:
            - { call: "POST /lab/lots/${lot_id}/release-quarantine", payload: {}, as: QualityManager, captures: { err: "$.data.error_id" } }
          assert:
            - "captured err == ERR_RECALL_ACTIVE_FOR_LOT"
            - "ReagentLot.${lot_id}.status remains QUARANTINED"

  - rule_id: resource_temporal_overlap
    instances:
      - name: consignment_window_half_open_overlap
        grounds:
          - calculations.consignment_window_overlap
          - errors[ERR_CONSIGNMENT_WINDOW_OVERLAP]
        distinguishing_aspect: |
          Interval semantics: HALF-OPEN [from, until) with adjacency allowed.
          [2026-05-01, 2026-06-01) vs [2026-05-15, 2026-07-01) overlaps ->
          ERR_CONSIGNMENT_WINDOW_OVERLAP; [2026-06-01, 2026-07-01) touches the
          end exactly and is ACCEPTED (201).
        test_recipe:
          setup:
            - "Warehouse + product + customer; agreement A on (customer, product) with window [2026-05-01, 2026-06-01)"
          setup_api_calls:
            - { call: "POST /lab/warehouses", payload: { name: "WH-NE", region_code: "US-NE", hazmat_certified: true }, as: OpsAdmin, captures: { wh_id: "$.data.id" } }
            - { call: "POST /lab/products", payload: { sku: "CS-500", name: "Consigned Stain", storage_requirement: "AMBIENT", hazard_class: "NON_HAZARDOUS", max_qty_per_shipment: 500, unit_price_cents: 500, requires_cold_chain: false, shelf_life_days: 365, min_remaining_shelf_life_days: 7 }, as: CatalogManager, captures: { prod_id: "$.data.id" } }
            - { call: "POST /lab/customers", payload: { name: "Lab Kappa", credit_limit_cents: 10000000 }, as: AccountManager, captures: { cust_id: "$.data.id" } }
            - { call: "POST /lab/consignment-agreements", payload: { customer_id: "${cust_id}", product_id: "${prod_id}", ceiling_quantity: 100, reorder_point: 0, contract_unit_price_cents: 500, replenishment_warehouse_id: "${wh_id}", effective_from: "2026-05-01", effective_until: "2026-06-01" }, as: AccountManager, captures: { agr_a: "$.data.id" } }
          trigger:
            - { call: "POST /lab/consignment-agreements", payload: { customer_id: "${cust_id}", product_id: "${prod_id}", ceiling_quantity: 50, reorder_point: 0, contract_unit_price_cents: 500, replenishment_warehouse_id: "${wh_id}", effective_from: "2026-05-15", effective_until: "2026-07-01" }, as: AccountManager, captures: { err: "$.data.error_id" } }
            - { call: "POST /lab/consignment-agreements", payload: { customer_id: "${cust_id}", product_id: "${prod_id}", ceiling_quantity: 50, reorder_point: 0, contract_unit_price_cents: 500, replenishment_warehouse_id: "${wh_id}", effective_from: "2026-06-01", effective_until: "2026-07-01" }, as: AccountManager, captures: { agr_b: "$.data.id" } }
          assert:
            - "captured err == ERR_CONSIGNMENT_WINDOW_OVERLAP (interior overlap rejected)"
            - "captured agr_b is present (adjacent window with from == existing until is NOT an overlap under half-open semantics)"

      - name: standing_order_window_buffer_gap
        grounds:
          - calculations.standing_order_window_buffer
          - errors[ERR_STANDING_ORDER_WINDOW_CONFLICT]
        distinguishing_aspect: |
          Interval semantics differ from the consignment rule: INCLUSIVE end
          dates PLUS a 7-day buffer — adjacency is NOT allowed. Existing window
          ends 2026-06-01; a new window starting 2026-06-05 (gap 4 < 7) is
          rejected, while 2026-06-08 (gap exactly 7) passes. Resource entity:
          StandingOrder, not ConsignmentAgreement.
        test_recipe:
          setup:
            - "Warehouse + product + customer; standing order S1 on (customer, product) with window [2026-05-01, 2026-06-01]"
          setup_api_calls:
            - { call: "POST /lab/warehouses", payload: { name: "WH-NE", region_code: "US-NE", hazmat_certified: true }, as: OpsAdmin, captures: { wh_id: "$.data.id" } }
            - { call: "POST /lab/products", payload: { sku: "CS-500", name: "Consigned Stain", storage_requirement: "AMBIENT", hazard_class: "NON_HAZARDOUS", max_qty_per_shipment: 500, unit_price_cents: 500, requires_cold_chain: false, shelf_life_days: 365, min_remaining_shelf_life_days: 7 }, as: CatalogManager, captures: { prod_id: "$.data.id" } }
            - { call: "POST /lab/customers", payload: { name: "Lab Kappa", credit_limit_cents: 10000000 }, as: AccountManager, captures: { cust_id: "$.data.id" } }
            - { call: "POST /lab/standing-orders", payload: { customer_id: "${cust_id}", product_id: "${prod_id}", warehouse_id: "${wh_id}", quantity_per_run: 2, interval_days: 7, effective_from: "2026-05-01", effective_until: "2026-06-01" }, as: Customer, as_user_id: "${cust_id}", captures: { so1: "$.data.id" } }
          trigger:
            - { call: "POST /lab/standing-orders", payload: { customer_id: "${cust_id}", product_id: "${prod_id}", warehouse_id: "${wh_id}", quantity_per_run: 2, interval_days: 7, effective_from: "2026-06-05", effective_until: "2026-08-01" }, as: Customer, as_user_id: "${cust_id}", captures: { err: "$.data.error_id" } }
            - { call: "POST /lab/standing-orders", payload: { customer_id: "${cust_id}", product_id: "${prod_id}", warehouse_id: "${wh_id}", quantity_per_run: 2, interval_days: 7, effective_from: "2026-06-08", effective_until: "2026-08-01" }, as: Customer, as_user_id: "${cust_id}", captures: { so2: "$.data.id" } }
          assert:
            - "captured err == ERR_STANDING_ORDER_WINDOW_CONFLICT (4-day gap < 7-day buffer)"
            - "captured so2 is present (7-day gap satisfies the buffer exactly: >=, not >)"

  - rule_id: compensating_invariant
    instances:
      - name: reservation_release_restores_lot_quantities
        grounds:
          - state_machines.LotReservation.HELD_to_RELEASED
          - entities.ReagentLot.fields.quantity_on_hand
          - entities.ReagentLot.fields.quantity_reserved
        distinguishing_aspect: |
          Conserved quantity: PHYSICAL UNITS. Invariant: quantity_on_hand +
          quantity_reserved + quantity_consumed == quantity_received +
          adjustment_total. Reserve(8) then release(8) leaves on_hand 20,
          reserved 0, consumed 0 — bit-identical to the pre-reservation state.
        test_recipe:
          setup:
            - "Warehouse + zone + product (1000 cents) + customer; lot qty 20 (received 20, adjustments 0)"
            - "Order qty 8 ANY submit -> ALLOCATED; one HELD reservation of 8 (on_hand 12, reserved 8)"
          setup_api_calls:
            - { call: "POST /lab/warehouses", payload: { name: "WH-NE", region_code: "US-NE", hazmat_certified: true }, as: OpsAdmin, captures: { wh_id: "$.data.id" } }
            - { call: "POST /lab/storage-zones", payload: { warehouse_id: "${wh_id}", zone_class: "AMBIENT", capacity_units: 500 }, as: OpsAdmin, captures: { zone_id: "$.data.id" } }
            - { call: "POST /lab/products", payload: { sku: "CH-1000", name: "Assay Vial", storage_requirement: "AMBIENT", hazard_class: "NON_HAZARDOUS", max_qty_per_shipment: 500, unit_price_cents: 1000, requires_cold_chain: false, shelf_life_days: 365, min_remaining_shelf_life_days: 7 }, as: CatalogManager, captures: { prod_id: "$.data.id" } }
            - { call: "POST /lab/customers", payload: { name: "Lab Mu", credit_limit_cents: 10000000 }, as: AccountManager, captures: { cust_id: "$.data.id" } }
            - { call: "POST /lab/lots", payload: { product_id: "${prod_id}", warehouse_id: "${wh_id}", storage_zone_id: "${zone_id}", quantity_received: 20, manufacture_date: "2026-01-15" }, as: InventoryClerk, captures: { lot_id: "$.data.id" } }
            - { call: "POST /lab/orders", payload: { customer_id: "${cust_id}", warehouse_id: "${wh_id}", shipping_service: "STANDARD", requested_ship_date: "2026-05-10", lines: [ { product_id: "${prod_id}", quantity: 8, fulfillment_mode: "ANY" } ] }, as: Customer, as_user_id: "${cust_id}", captures: { order_id: "$.data.id" } }
            - { call: "POST /lab/orders/${order_id}/submit", payload: {}, as: Customer, as_user_id: "${cust_id}" }
            - { call: "GET /lab/order-lines", payload: { order_id: "${order_id}" }, as: OpsAdmin, captures: { line_id: "$.data[0].id" } }
            - { call: "GET /lab/reservations", payload: { order_line_id: "${line_id}" }, as: OpsAdmin, captures: { res_id: "$.data[0].id" } }
          trigger:
            - { call: "POST /lab/reservations/${res_id}/release", payload: {}, as: Customer, as_user_id: "${cust_id}" }
          assert:
            - "ReagentLot.${lot_id}: quantity_on_hand == 20 AND quantity_reserved == 0 AND quantity_consumed == 0 (20 + 0 + 0 == 20 + 0)"
            - "LotReservation.${res_id}.status == RELEASED"
            - "OrderLine.${line_id}.status == PENDING and Order.${order_id}.status == BACKORDERED (demotion side effect of the release)"

      - name: dispatch_then_destroy_restores_customer_balance
        grounds:
          - calculations.customer_outstanding_and_credit
          - state_machines.Order.SHIPPED_to_REFUNDED
          - state_machines.Shipment.EXCURSION_HOLD_to_RETURNED
        distinguishing_aspect: |
          Conserved quantity: MONEY CENTS (a different quantity than physical
          units). Invoice(42300) at dispatch followed by the DESTROYED
          disposition's full reversal returns outstanding_balance_cents to
          exactly its pre-dispatch value 0 — no drift from freight or credits.
        test_recipe:
          setup:
            - "Cold-chain chain to IN_TRANSIT with invoice 42300 posted (product_total 40000 + final freight 2300)"
            - "Excursion OPEN on the shipment"
          setup_api_calls:
            - { call: "POST /lab/warehouses", payload: { name: "WH-NE", region_code: "US-NE", hazmat_certified: true }, as: OpsAdmin, captures: { wh_id: "$.data.id" } }
            - { call: "POST /lab/storage-zones", payload: { warehouse_id: "${wh_id}", zone_class: "REFRIGERATED_2_8", capacity_units: 1000, rotation_policy: "FEFO" }, as: OpsAdmin, captures: { zone_id: "$.data.id" } }
            - { call: "POST /lab/products", payload: { sku: "RG-100", name: "Enzyme Mix", storage_requirement: "REFRIGERATED_2_8", hazard_class: "NON_HAZARDOUS", max_qty_per_shipment: 500, unit_price_cents: 20000, requires_cold_chain: true, shelf_life_days: 60, min_remaining_shelf_life_days: 7 }, as: CatalogManager, captures: { prod_id: "$.data.id" } }
            - { call: "POST /lab/customers", payload: { name: "Lab Alpha", credit_limit_cents: 10000000, hazmat_endorsement: "FULL", cold_chain_certified: true }, as: AccountManager, captures: { cust_id: "$.data.id" } }
            - { call: "POST /lab/lots", payload: { product_id: "${prod_id}", warehouse_id: "${wh_id}", storage_zone_id: "${zone_id}", quantity_received: 100, manufacture_date: "2026-04-01" }, as: InventoryClerk }
            - { call: "POST /lab/orders", payload: { customer_id: "${cust_id}", warehouse_id: "${wh_id}", shipping_service: "EXPRESS", requested_ship_date: "2026-05-10", lines: [ { product_id: "${prod_id}", quantity: 2, fulfillment_mode: "ANY" } ] }, as: Customer, as_user_id: "${cust_id}", captures: { order_id: "$.data.id" } }
            - { call: "POST /lab/orders/${order_id}/submit", payload: {}, as: Customer, as_user_id: "${cust_id}" }
            - { call: "POST /lab/shipments", payload: { order_id: "${order_id}", coolant_type: "DRY_ICE", coolant_units: 2, declared_weight_grams: 3000 }, as: InventoryClerk, captures: { ship_id: "$.data.id" } }
            - { call: "POST /lab/shipments/${ship_id}/pack", payload: {}, as: InventoryClerk }
            - { call: "POST /lab/shipments/${ship_id}/dispatch", payload: { actual_weight_grams: 3000 }, as: InventoryClerk }
            - { call: "POST /lab/shipments/${ship_id}/record-temperature", payload: { temp_celsius: 12.5, duration_minutes: 90 }, as: InventoryClerk, captures: { exc_id: "$.data.excursion_id" } }
          trigger:
            - { call: "POST /lab/excursions/${exc_id}/disposition", payload: { decision: "DESTROYED" }, as: QualityManager }
          assert:
            - "CustomerAccount.${cust_id}.outstanding_balance_cents == 0 (42300 invoiced then 42300 reversed; freight waived on destroyed shipments)"
            - "Order.${order_id}.status == REFUNDED and Shipment.${ship_id}.status == RETURNED"
