        claim_type: segregation_of_duties
        grounds: ["validations[priority=35]", "errors[ERR_SEGREGATION_OF_DUTIES]", "roles[ScholarshipReviewer]"]
        distinguishing_aspect: "Segregation of duties: the reviewer whose X-User-ID is recorded as reviewed_by cannot approve; a different reviewer approves successfully."
        test_recipe:
          setup: ["Season PUBLISHED (budget 100000); household HX application UNDER_REVIEW with reviewed_by == rev-1"]
          setup_api_calls:
            - { call: "POST /seasons", payload: { name: "Fall 2026", start_date: "2026-09-01T00:00:00Z", end_date: "2026-12-15T00:00:00Z", resident_opens_at: "2026-08-10T00:00:00Z", general_opens_at: "2026-08-17T00:00:00Z", registration_closes_at: "2026-09-15T00:00:00Z", scholarship_budget_cents: 100000 }, as: ProgramCoordinator, captures: { sn: $.data.id } }
