  # =====================================================================
  # RULE 2 — combinatorial_formula
  # =====================================================================
  - rule_id: combinatorial_formula
    instances:
      - name: venue_reimbursement_rounds_per_line_not_on_the_category_total
        grounds:
          - "calculations.venue_expense_reimbursement"
          - "calculations.settlement_split"
          - "entities.Settlement.fields.venue_expense_reimbursement_cents"
          - "entities.Settlement.fields.promoter_borne_expense_cents"
          - "entities.Show.fields.venue_expense_pct_production"
        distinguishing_aspect: |
          MODE (b) — rounding placement inside an aggregation: ROUND_HALF_UP is applied ONCE PER
          BudgetLine and the rounded per-line amounts are then summed, so three PRODUCTION lines
          of 250005 cents at 33.50% reimburse 251256, whereas rounding the 750015 category total
          once (the plausible wrong mode) yields 251255. The observable is a 1-cent difference in
          Settlement.venue_expense_reimbursement_cents that no re-ordering of the same inputs can
          produce; it is a rounding-placement question, not a formula-selection question.
        test_recipe:
          setup:
            - "FIXTURE C: a CO_PROMOTE show at a zero-fee, zero-tax venue (Civic Theater, gross_capacity 900, facility_fee_cents_per_ticket 0, ticket_tax_pct 0) so adjusted gross is gross minus the 2.5% card fee only."
            - "Deal: FLAT_GUARANTEE guarantee 1000000, deposit 0, expense_cap 1000000. Venue shares: venue_expense_pct_production 33.50, all other categories 0, copromote_venue_share_pct 10.00."
            - "Exactly three PRODUCTION budget lines, each budgeted_cents 250005 and is_artist_deductible false, each backed by one APPROVED invoice of exactly 250005 so every line's variance_pct is 0.00 and settlement_expense_cents == 250005."
            - "Tier GA 800 @ 1000 with 400 sold; show_status PERFORMED; a DRAFT Settlement exists."
