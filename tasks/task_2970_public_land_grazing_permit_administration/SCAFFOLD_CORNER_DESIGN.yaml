            - "the fourth, fifth, sixth and seventh calls do NOT return ERR_ALLOTMENT_NOT_FOUND, ERR_PERMITTEE_NOT_FOUND or ERR_BASE_PROPERTY_NOT_FOUND even though every id in their bodies is unknown — priority 1 outranks priorities 5 and 6"
            - "no row is created by any of the eight calls: GET /allotments with admin_unit_code filters for NV-166, NV-167 and NV-168 all return total_count 0"
            - "GET /permittees/00000000-0000-4000-8000-000000000099 still returns HTTP 404 ERR_PERMITTEE_NOT_FOUND"

      - name: corner_invalid_date_range_covers_every_dated_entity
        claim_type: error_triggerable
        grounds:
          - errors.ERR_INVALID_DATE_RANGE
          - validations.priority_2
        distinguishing_aspect: "Priority 2 is checked before any lookup, and it distinguishes the two interval kinds: closed ranges (permit term, AOI season, closure order) only fail when the end PRECEDES the start, while the half-open grazing windows of a use record also fail when entry EQUALS exit. An AOI whose season_start_date equals its season_end_date is therefore accepted by priority 2 and falls through to the unknown-permit 404."
        test_recipe:
          setup:
            - "No setup: priority 2 precedes the path-id and body-FK lookups"
          setup_api_calls: []
          trigger:
            - call: "POST /grazing-permits"
              payload: { allotment_id: "00000000-0000-4000-8000-000000000099", permittee_id: "00000000-0000-4000-8000-000000000099", base_property_id: "00000000-0000-4000-8000-000000000099", requested_aums: 100, term_start_date: "2030-01-01", term_end_date: "2026-12-31", livestock_kind: "CATTLE" }
              as: AuthorizedOfficer
              as_user_id: "u_officer_1"
            - call: "POST /annual-operating-instructions"
              payload: { permit_id: "00000000-0000-4000-8000-000000000099", grazing_year: 2026, authorized_aums: 100, season_start_date: "2026-09-30", season_end_date: "2026-05-01" }
              as: RangeSpecialist
              as_user_id: "u_spec_1"
            - call: "POST /annual-operating-instructions/00000000-0000-4000-8000-000000000099/use-records"
              payload: { pasture_id: "00000000-0000-4000-8000-000000000099", planned_entry_date: "2026-06-01", planned_exit_date: "2026-06-01", planned_head_count: 30, livestock_kind: "CATTLE" }
              as: RangeSpecialist
              as_user_id: "u_spec_1"
            - call: "POST /pasture-use-records/00000000-0000-4000-8000-000000000099/report-actual-use"
              payload: { actual_entry_date: "2026-06-10", actual_exit_date: "2026-06-10", actual_head_count: 30 }
              as: Permittee
              as_user_id: "00000000-0000-4000-8000-000000000099"
            - call: "POST /closure-orders"
              payload: { allotment_id: "00000000-0000-4000-8000-000000000099", order_type: "DROUGHT_REDUCTION", effective_start_date: "2026-10-31", effective_end_date: "2026-08-05", justification: "Severe drought conditions across the allotment.", reduction_pct: 0.30 }
              as: AuthorizedOfficer
              as_user_id: "u_officer_1"
            - call: "POST /annual-operating-instructions"
              payload: { permit_id: "00000000-0000-4000-8000-000000000099", grazing_year: 2026, authorized_aums: 100, season_start_date: "2026-05-01", season_end_date: "2026-05-01" }
              as: RangeSpecialist
              as_user_id: "u_spec_1"
          assert:
            - "the first five calls all return HTTP 400 with data.error_id == \"ERR_INVALID_DATE_RANGE\""
            - "the third and fourth calls prove the half-open rule: entry == exit is rejected for both the planned and the reported interval"
            - "the fourth call returns ERR_INVALID_DATE_RANGE and NOT ERR_UNAUTHORIZED, because priority 2 outranks priority 3 even though the acting X-User-ID is an unknown permittee"
            - "sixth call: HTTP 404 with data.error_id == \"ERR_PERMIT_NOT_FOUND\" — season_start_date == season_end_date satisfies the closed-range rule, so priority 2 does not fire and the priority-5 lookup decides"

  # ---------------------------------------------------------------------------
  # §1.9 rbac — every role's exclusive operations are refused to every other
  # role (ERR_UNAUTHORIZED, priority 3), every shared operation is accepted from
  # each of its listed roles, the entity_backed Permittee identity is scoped to
  # its own rows, a missing/blank/unknown X-User-ID is refused, and the
  # segregation_of_duties role model is enforced on X-User-ID alone (priority 4).
  # ---------------------------------------------------------------------------
  - section: rbac
    instances:

      - name: corner_only_the_affected_permittee_may_appeal_and_other_roles_are_rejected
        claim_type: role_exclusive_operation
        grounds:
          - rbac.Permittee.exclusive_operations
          - endpoints.POST /permit-decisions/{decisionId}/appeals
          - validations.priority_3
          - errors.ERR_UNAUTHORIZED
          - state_machines.PermitDecision.FINAL_to_STAYED
        distinguishing_aspect: "Filing an appeal is the single write a Permittee owns outright, and it is guarded three ways at once: the acting role must be Permittee (a RangeSpecialist or AuthorizedOfficer is refused even though they built the decision), the acting X-User-ID must be the permittee the appealed decision reaches (a bystander permittee is refused), and the body's appellant_permittee_id must equal that same acting id (a Permittee cannot file on a peer's behalf). All three refusals are the same 403 ERR_UNAUTHORIZED, and only the fourth attempt — right role, right person, matching body — is accepted."
        test_recipe:
          setup:
            - "Logical clock at the 2026-08-01T00:00:00Z default"
            - "Two permittees: ${c_m47_id} holds an ISSUED permit on the allotment the decision suspends; ${c_m48_id} holds nothing and is the bystander"
            - "A SUSPENSION decision authored by u_spec_1 and signed by u_officer_1, so decision_status is FINAL and appealable"
          setup_api_calls:
            - call: "POST /permittees"
              payload: { name: "Affected Cattle Co", contact_email: "affected@example.com" }
              as: AuthorizedOfficer
              as_user_id: "u_officer_1"
              captures: { c_m47_id: "$.data.id" }
            - call: "POST /permittees"
              payload: { name: "Bystander Sheep Co", contact_email: "bystander@example.com" }
              as: AuthorizedOfficer
              as_user_id: "u_officer_1"
              captures: { c_m48_id: "$.data.id" }
            - call: "POST /permittees/${c_m47_id}/base-properties"
              payload: { base_property_type: "LAND", legal_description: "T33N R60E Sec 14 NE", carrying_capacity_aums: 400, controlled_since_date: "2010-03-01" }
              as: AuthorizedOfficer
              as_user_id: "u_officer_1"
              captures: { c_bp44_id: "$.data.id" }
            - call: "POST /allotments"
              payload: { name: "Coyote Springs Allotment", admin_unit_code: "NV-169", acres: 9000, total_permitted_aums: 500, season_start: "01-01", season_end: "12-31", required_pasture_rotation_count: 1 }
              as: AuthorizedOfficer
              as_user_id: "u_officer_1"
              captures: { c_a63_id: "$.data.id" }
            - call: "POST /allotments/${c_a63_id}/pastures"
              payload: { name: "Coyote North", pasture_aum_capacity: 500, sequence_order: 1 }
              as: AuthorizedOfficer
              as_user_id: "u_officer_1"
              captures: { c_p32_id: "$.data.id" }
            - call: "POST /grazing-permits"
              payload: { allotment_id: "${c_a63_id}", permittee_id: "${c_m47_id}", base_property_id: "${c_bp44_id}", requested_aums: 100, term_start_date: "2026-01-01", term_end_date: "2030-12-31", livestock_kind: "CATTLE" }
              as: AuthorizedOfficer
              as_user_id: "u_officer_1"
              captures: { c_g39_id: "$.data.id" }
            - call: "POST /grazing-permits/${c_g39_id}/issue"
              payload: {}
              as: AuthorizedOfficer
              as_user_id: "u_officer_1"
            - call: "GET /allotments/${c_a63_id}"
              payload: {}
              as: RangeSpecialist
              as_user_id: "u_spec_1"
              captures: { c_a63_ver: "$.data.version" }
            - call: "POST /permit-decisions"
              payload: { decision_type: "SUSPENSION", allotment_id: "${c_a63_id}", expected_allotment_version: "${c_a63_ver}", nepa_level: "CX", permit_id: "${c_g39_id}", rationale: "Repeated unauthorized use warrants suspension of the permit." }
              as: RangeSpecialist
              as_user_id: "u_spec_1"
              captures: { c_d6_id: "$.data.id" }
            - call: "POST /permit-decisions/${c_d6_id}/complete-environmental-review"
              payload: { nepa_findings_summary: "Categorical exclusion applies; no extraordinary circumstances were identified." }
              as: RangeSpecialist
              as_user_id: "u_spec_1"
            - call: "POST /permit-decisions/${c_d6_id}/finalize"
              payload: { rationale: "Suspension is warranted on the administrative record." }
              as: AuthorizedOfficer
              as_user_id: "u_officer_1"
          trigger:
            - call: "POST /permit-decisions/${c_d6_id}/appeals"
              payload: { appellant_permittee_id: "${c_m48_id}", stay_requested: true, statement_of_reasons: "The bystander operator objects to a suspension aimed at a different ranch." }
              as: Permittee
              as_user_id: "${c_m48_id}"
            - call: "POST /permit-decisions/${c_d6_id}/appeals"
              payload: { appellant_permittee_id: "${c_m48_id}", stay_requested: true, statement_of_reasons: "Filing on behalf of a neighbouring operator who did not sign this statement." }
              as: Permittee
              as_user_id: "${c_m47_id}"
            - call: "POST /permit-decisions/${c_d6_id}/appeals"
              payload: { appellant_permittee_id: "${c_m47_id}", stay_requested: true, statement_of_reasons: "The authoring specialist attempts to appeal the document it wrote itself." }
              as: RangeSpecialist
              as_user_id: "u_spec_1"
            - call: "POST /permit-decisions/${c_d6_id}/appeals"
              payload: { appellant_permittee_id: "${c_m47_id}", stay_requested: true, statement_of_reasons: "The deciding officer attempts to appeal its own signature." }
              as: AuthorizedOfficer
              as_user_id: "u_officer_1"
            - call: "POST /permit-decisions/${c_d6_id}/appeals"
              payload: { appellant_permittee_id: "${c_m47_id}", stay_requested: true, statement_of_reasons: "The suspension rests on unauthorized use that was billed to a neighbouring operator, not to this ranch." }
              as: Permittee
              as_user_id: "${c_m47_id}"
              captures: { c_ap3_id: "$.data.id" }
            - call: "GET /permittees/${c_m48_id}"
              payload: {}
              as: Permittee
              as_user_id: "${c_m47_id}"
            - call: "GET /permittees/${c_m47_id}"
              payload: {}
              as: Permittee
              as_user_id: "${c_m47_id}"
            - call: "GET /appeal-cases"
              payload: { appellant_permittee_id: "${c_m48_id}" }
              as: Permittee
              as_user_id: "${c_m48_id}"
          assert:
            - "first call: HTTP 403 with data.error_id == \"ERR_UNAUTHORIZED\" — the bystander permittee is reaching a decision that belongs to another permittee's permit"
            - "second call: HTTP 403 ERR_UNAUTHORIZED — appellant_permittee_id ${c_m48_id} does not equal the acting X-User-ID ${c_m47_id}"
            - "third and fourth calls: HTTP 403 ERR_UNAUTHORIZED — filing an appeal is a Permittee exclusive, so neither the authoring RangeSpecialist nor the deciding AuthorizedOfficer may file, and neither refusal is ERR_SEGREGATION_OF_DUTIES (priority 3 settles it before priority 4 is reached)"
            - "fifth call: HTTP 201 with data.id == ${c_ap3_id}, appeal_status \"FILED\", stay_granted true, remand_count 0, adjudicator_id null and appellant_permittee_id == ${c_m47_id}"
            - "after the fifth call GET /permit-decisions/${c_d6_id} returns decision_status \"STAYED\" — the stay was granted because the decision was FINAL and not yet EFFECTIVE"
            - "sixth call: HTTP 403 ERR_UNAUTHORIZED — the Permittee read scope covers its own rows only, so ${c_m47_id} cannot read the bystander's Permittee row"
            - "seventh call: HTTP 200 with data.id == ${c_m47_id} — the same endpoint on its own row succeeds"
            - "eighth call: HTTP 200 with total_count 0 — list reads are scoped, so the bystander sees none of ${c_m47_id}'s appeals rather than a 403"
            - "GET /appeal-cases?decision_id=${c_d6_id} as u_judge_1 returns total_count 1, proving exactly one appeal survived the four refusals"

      - name: corner_range_specialist_exclusives_rejected_for_every_other_role
        claim_type: role_denied_operation
        grounds:
          - rbac.RangeSpecialist.exclusive_operations
          - validations.priority_3
          - validations.priority_5
          - errors.ERR_UNAUTHORIZED
        distinguishing_aspect: "The six RangeSpecialist exclusives — assessment create and submit, decision create and environmental review, trespass detection, project proposal — are refused to the AuthorizedOfficer, the Permittee, the AppealsAdjudicator and the SystemAdmin alike, and because priority 3 outranks priority 5 the refusal is 403 ERR_UNAUTHORIZED even when the path id was never minted. None of the refused calls leaves a row behind, and the refused POST /permit-decisions does NOT bump Allotment.version."
        test_recipe:
          setup:
            - "One allotment ${c_a64_id} with its observed version captured, and one permittee ${c_m49_id} to supply a real entity_backed Permittee identity"
            - "All payloads are shape-valid so that priority 1 and priority 2 cannot fire ahead of the role gate"
          setup_api_calls:
            - call: "POST /allotments"
              payload: { name: "Tule Flat Allotment", admin_unit_code: "NV-170", acres: 7000, total_permitted_aums: 300, season_start: "01-01", season_end: "12-31", required_pasture_rotation_count: 1 }
              as: AuthorizedOfficer
              as_user_id: "u_officer_1"
              captures: { c_a64_id: "$.data.id" }
            - call: "GET /allotments/${c_a64_id}"
              payload: {}
              as: RangeSpecialist
              as_user_id: "u_spec_1"
              captures: { c_a64_ver: "$.data.version" }
            - call: "POST /permittees"
              payload: { name: "Tule Flat Grazing LLC", contact_email: "tule@example.com" }
              as: AuthorizedOfficer
