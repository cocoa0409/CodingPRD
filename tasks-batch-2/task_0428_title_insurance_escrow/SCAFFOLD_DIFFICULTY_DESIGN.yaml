            - call: "POST /title/orders/${o_id}/disbursements"
              payload: { payee: "Seller", amount_cents: 500000, purpose: "SELLER_PROCEEDS", wire_window_start: "2026-01-20T09:00:00Z", wire_window_end: "2026-01-20T10:00:00Z", expected_order_version: "${o_v_pre_disb}" }
              as: Underwriter
              captures: { disb_id: $.data.id }
