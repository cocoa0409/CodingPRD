        grounds:
          - state_machines.Complaint.LOGGED_to_UNDER_REVIEW
          - state_machines.Complaint.LOGGED_to_DISMISSED
          - state_machines.Complaint.UNDER_REVIEW_to_DISMISSED
          - state_machines.Complaint.DISMISSED_to_CLOSED
          - entities.Complaint.fields.resolution_note
        distinguishing_aspect: |
          The dismiss path works from both LOGGED and UNDER_REVIEW, and CLOSE
          from DISMISSED persists resolution_note; nothing in this path touches
          the route quota counter (no SUBSTANTIATE happened).
        test_recipe:
          setup: ["Base; two complaints filed (auto-match pool empty -> UNMATCHED)"]
          setup_api_calls:
            - { call: "POST /_clock/set_current_utc", payload: { to_iso8601: "2026-08-03T00:00:00Z" }, as: OpsAdmin }
