              as_user_id: "${tc_car_id}"
            - call: "POST /connections/${tc_conn_id}/begin-testing"
              payload: { testing_window_start: "2026-09-01T00:00:00Z", testing_window_end: "2026-09-10T00:00:00Z" }
              as: NetworkOps
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-09-01T10:00:00Z" }
              as: PlatformAdmin
            - call: "POST /connections/${tc_conn_id}/heartbeats"
              payload: { reported_at: "2026-09-01T10:00:00Z", payload_completeness_pct: 100 }
              as: CarrierRep
              as_user_id: "${tc_car_id}"
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-09-01T12:00:00Z" }
              as: PlatformAdmin
            - call: "POST /_ops/run-checkpoint"
              payload: {}
              as: PlatformAdmin
            - call: "POST /connections/${tc_conn_id}/activate"
              payload: {}
              as: NetworkOps
            - call: "POST /shippers"
