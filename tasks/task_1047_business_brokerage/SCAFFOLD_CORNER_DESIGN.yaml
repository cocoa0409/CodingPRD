# =============================================================================
# task_1047 — Business Brokerage & Main-Street M&A — §1.9 Corner Design
# Breadth coverage of testable claims not already probed by §1.8.
# =============================================================================
scaffold_corner_design:

  # ---------------------------------------------------------------------------
  - section: entities
    instances:
      - name: buyer_creation_sets_available_capital
        claim_type: Creation
        grounds: [entities.Buyer.fields.available_capital_cents]
        distinguishing_aspect: "POST /brokerage/buyers with proof_of_funds_cents=50000000 returns 201 with committed_capital_cents=0, escrowed_cents=0, available_capital_cents=50000000."
        test_recipe:
          setup: ["Empty DB."]
          setup_api_calls: []
          trigger:
            - call: "POST /brokerage/buyers"
              payload: { full_name: "Bea Buyer", email: "b@x.com", proof_of_funds_cents: 50000000, net_worth_cents: 150000000 }
              as: PlatformAdmin
              captures: { buyer_id: $.data.id }
          assert:
            - "response.status == 201"
            - "Buyer.${buyer_id}.available_capital_cents == 50000000"
            - "Buyer.${buyer_id}.committed_capital_cents == 0"

      - name: listing_create_missing_required_field_returns_validation
        claim_type: Required Fields
        grounds: [entities.Listing.fields.asking_price_cents]
        distinguishing_aspect: "POST /brokerage/listings omitting asking_price_cents returns ERR_VALIDATION (400); no listing persisted."
        test_recipe:
          setup: ["A broker and seller exist."]
          setup_api_calls:
            - call: "POST /brokerage/brokers"
              payload: { firm_name: "Main St M&A", license_number: "BRK-1" }
              as: PlatformAdmin
              captures: { broker_id: $.data.id }
            - call: "POST /brokerage/sellers"
              payload: { full_name: "Sam Seller", email: "s@x.com" }
              as: PlatformAdmin
              captures: { seller_id: $.data.id }
          trigger:
            - call: "POST /brokerage/listings"
              payload: { seller_id: "${seller_id}", business_name: "No Price Co", industry_code: "722511", annual_sde_cents: 40000000, annual_revenue_cents: 150000000, ffe_value_cents: 20000000, inventory_value_cents: 10000000, industry_multiple: 3.0, exclusive_start_date: "2026-01-01", exclusive_end_date: "2026-12-31" }
              as: Broker
              as_user_id: "${broker_id}"
              captures: { err: $.data.error_id }
          assert:
            - "response.status == 400"
            - "response.data.error_id == ERR_VALIDATION"

      - name: get_buyer_not_found_returns_404
        claim_type: Not Found
        grounds: ["errors[ERR_BUYER_NOT_FOUND]"]
        distinguishing_aspect: "GET /brokerage/buyers/{unknown-uuid} returns ERR_BUYER_NOT_FOUND (404)."
        test_recipe:
          setup: ["Empty DB."]
          setup_api_calls: []
          trigger:
            - call: "GET /brokerage/buyers/00000000-0000-4000-8000-000000000000"
              payload: {}
              as: PlatformAdmin
              captures: { err: $.data.error_id }
          assert:
            - "response.status == 404"
            - "response.data.error_id == ERR_BUYER_NOT_FOUND"

  # ---------------------------------------------------------------------------
  - section: state_machines
    instances:
      - name: cim_publish_twice_returns_invalid_state
        claim_type: Idempotency
        grounds: [state_machines.CIM.DRAFT_to_PUBLISHED, "errors[ERR_CIM_INVALID_STATE]"]
        distinguishing_aspect: "Publishing an already-PUBLISHED CIM returns ERR_CIM_INVALID_STATE (409); no re-computation."
        test_recipe:
          setup: ["A listing with one PUBLISHED CIM."]
          setup_api_calls:
            - call: "POST /brokerage/brokers"
              payload: { firm_name: "Main St M&A", license_number: "BRK-1" }
              as: PlatformAdmin
              captures: { broker_id: $.data.id }
            - call: "POST /brokerage/sellers"
              payload: { full_name: "Sam Seller", email: "s@x.com" }
              as: PlatformAdmin
              captures: { seller_id: $.data.id }
            - call: "POST /brokerage/listings"
              payload: { seller_id: "${seller_id}", business_name: "Corner Diner", industry_code: "722511", annual_sde_cents: 40000000, annual_revenue_cents: 150000000, ffe_value_cents: 20000000, inventory_value_cents: 10000000, industry_multiple: 3.0, asking_price_cents: 120000000, exclusive_start_date: "2026-01-01", exclusive_end_date: "2026-12-31" }
              as: Broker
              as_user_id: "${broker_id}"
              captures: { listing_id: $.data.id }
            - call: "POST /brokerage/listings/${listing_id}/cims"
              payload: { valuation_method: "SDE_MULTIPLE" }
              as: Broker
              as_user_id: "${broker_id}"
              captures: { cim_id: $.data.id }
            - call: "POST /brokerage/cims/${cim_id}/publish"
              payload: {}
              as: Broker
              as_user_id: "${broker_id}"
          trigger:
            - call: "POST /brokerage/cims/${cim_id}/publish"
              payload: {}
              as: Broker
              as_user_id: "${broker_id}"
              captures: { err: $.data.error_id }
          assert:
            - "response.status == 409"
            - "response.data.error_id == ERR_CIM_INVALID_STATE"

