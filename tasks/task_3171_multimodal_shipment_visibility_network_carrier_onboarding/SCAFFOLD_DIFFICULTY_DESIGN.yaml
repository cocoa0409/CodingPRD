  # ===========================================================================
  - rule_id: transitive_cascade
    instances:

      - name: checkpoint_stale_connection_suspension_alert_chain
        grounds:
          - state_machines.CarrierConnection.ACTIVE_to_SUSPENDED
          - calculations.delay_risk_assessment
          - calculations.eta_confidence_halfwidth
        distinguishing_aspect: |
          Depth-4 chain triggered by POST /_ops/run-checkpoint (not by any
          shipment-level action): staleness check suspends the connection;
          the suspension STALES each in-transit shipment's data_freshness;
          staleness recomputes ETA with the x1.5 CI multiplier; the recompute
          runs delay_risk_assessment which creates an ExceptionAlert. Each hop
          is caused by the previous hop, not by the checkpoint directly.
        test_recipe:
          setup:
            - "TMS connection (cadence 240): one on-time completeness-100 heartbeat at 2026-09-01T10:00:00Z; checkpoint at 12:00 scores 83; connection ACTIVE."
            - "TRUCKLOAD shipment planned 2026-09-01T00:00 -> 2026-09-03T00:00; DEPARTED 2026-09-01T12:30 (event_time 12:00), DELAY_REPORTED event_time 2026-09-01T18:00 delay 180 -> blended eta 2026-09-03T03:00Z."
            - "Clock advanced to 2026-09-05T04:00:00Z: now - last_heartbeat_at = 3 days 18 hours > 2 * 240 = 480 minutes -> stale suspension."
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-09-01T00:00:00Z" }
              as: PlatformAdmin
            - call: "POST /carriers"
              payload: { carrier_name: "StaleCo", scac_code: "STLC" }
              as: NetworkOps
              captures: { tc_car_id: $.data.id }
            - call: "POST /carriers/${tc_car_id}/connections"
