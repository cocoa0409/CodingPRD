      - name: migration_guide_is_required_only_for_breaking_versions
        claim_type: Conditional validation
        grounds:
          - validations.priority_42_migration_guide_missing
          - entities.ApiVersion.fields.breaking_change
          - endpoints.POST /api-versions/{id}/migration-guide
          - errors.ERR_MIGRATION_GUIDE_MISSING
        distinguishing_aspect: >-
          Two GA versions of the same product are deprecated with sufficient notice; only the
          breaking one demands a published guide first. The non-breaking version announces with
          no guide at all, which pins the rule to the breaking_change flag rather than to
          deprecation in general, and the retry after publication proves the guide is the only
          thing that was missing.
        test_recipe:
          setup:
            - "product P1 is PUBLIC with no PARTNER assignment, so required notice is 30 days for the plain version and 60 for the breaking one"
            - "versions 1.0.0 (non-breaking) and 2.0.0 (breaking) are both promoted to GENERAL_AVAILABILITY"
