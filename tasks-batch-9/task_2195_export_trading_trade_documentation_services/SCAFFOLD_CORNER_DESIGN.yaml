            - call: "POST /document-presentations"
              as: ExportOpsCoordinator
              as_user_id: "u_ops_alice"
              payload: { letter_of_credit_id: "${lc_id}", export_order_id: "${order_id}", trade_document_ids: ["3f7c1c52-0000-4000-8000-00000000dead"], expected_export_order_version: "${order_v_after_accept}" }
              captures: { err_doc_missing: "$.data.error_id" }
            - call: "POST /document-presentations"
              as: ExportOpsCoordinator
              as_user_id: "u_ops_alice"
