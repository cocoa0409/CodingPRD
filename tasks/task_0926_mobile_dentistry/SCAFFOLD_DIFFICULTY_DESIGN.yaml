          - state_machines.Referral.OPEN_to_ABANDONED
          - calculations.spore_taint_set
        distinguishing_aspect: |
          Depth-5 chain from a single trigger, each link caused by the previous one:
          load FAILED -> its procedures TAINTED -> their encounter reverts PRICED to UNBILLED and is
