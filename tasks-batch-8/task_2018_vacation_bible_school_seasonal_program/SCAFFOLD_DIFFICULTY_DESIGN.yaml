          assert:
            - "${packs} == 4  (ceil(4*3/10) per classroom = 2 each, summed = 4)"
            - "${per_cls} == [2, 2]  (per-classroom rounding happens BEFORE the sum; sum-first would give 3)"
      - name: waitlist_promotion_evaluation_order_loop
        grounds:
          - calculations.waitlist_promotion_loop
          - calculations.open_seats
          - state_machines.Registration.WAITLISTED_to_OFFERED
        distinguishing_aspect: |
          Mode (c): circular-looking dependency — open_seats depends on
          offered_count, and every promotion creates an OFFERED registration that
          mutates offered_count. The scaffold pins evaluation order: promote exactly
          one head, recompute open_seats, repeat; stop when open_seats < 1. Capacity
