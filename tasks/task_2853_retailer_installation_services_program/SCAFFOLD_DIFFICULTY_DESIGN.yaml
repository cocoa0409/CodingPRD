      - name: cancellation_waiver_ladder_cooling_off_preempts_goodwill
        grounds:
          - calculations.cancellation_settlement
          - calculations.project_total_due
          - entities.Customer.fields.project_count
          - entities.Project.fields.deposit_forfeited_cents
          - entities.Project.fields.deposit_refunded_cents
          - state_machines.Project.financial_status.DEPOSIT_HELD_to_REFUNDED
          - state_machines.MaterialDelivery.IN_TRANSIT_to_RETURNED
          - endpoints[GET /projects/{id}/settlement-preview]
        distinguishing_aspect: |
          MODE (c): a circular-looking ladder whose evaluation order is pinned —
          the fixture satisfies BOTH T2 COOLING_OFF (cancelled exactly 48 h after
          creation, inside the 72 h bound) and T4 GOODWILL (Customer.project_count
          4 >= 3), and first-match-wins top-to-bottom must retain 0 and refund
          59002 (REFUNDED), whereas consulting T4 first would retain 10450 and
          refund 48552 (PARTIALLY_REFUNDED).
        test_recipe:
          setup:
            - "Logical clock at its startup default 2026-08-01T00:00:00.000Z while every row below is created, so all four projects carry created_at 2026-08-01T00:00:00.000Z."
