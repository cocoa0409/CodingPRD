# =============================================================================
# Yacht / Marina Slip Rental — Seed Tables (SCAFFOLD.yaml)
# =============================================================================

scenario: |
  Yacht/Marina Slip Rental: slip size matching, liveaboard utilities, Pump-out,
  seasonal pricing, Liveaboard policy, insurance and tow assistance, Slip
  Transfer waitlist.

domain_name: marina-slip-rental
api_prefix: /marinas

complexity_profile:
  primary_archetype: quota_allocation
  secondary_archetype: pricing_engine
  complexity_layers:
    - tiered_pricing
    - derived_field_reconciliation
    - ops_run_checkpoint
    - temporal_windowing
    - selector_policy
    - idempotency
  entity_topology: hybrid
  state_machine_shape: branching      # Reservation has branching with reverts;
                                      # SlipTransferRequest has cyclic re-queue
  relationship_patterns:
    - one_to_many                     # Marina → Slip, Boater → Vessel, …
    - many_to_many                    # Vessel ↔ Slip via Reservation
    - cross_aggregate                 # InsurancePolicy and TowAssistContract span boaters and reservations
  role_model: peer_roles              # Boater, DockMaster, BillingClerk
  consistency_model: immediate

# =============================================================================
# §1.0 Response Envelope (FIXED — emitted verbatim)
# =============================================================================
response_envelope:
  success: |
    { "meta": { "api_request_id": "req_xxx", "api_request_timestamp": "ISO8601" },
      "response_type": "object" | "array", "data": {} }
  error: |
    { "meta": { ... }, "response_type": "error",
      "data": { "error_id": "ERR_XXX", "message": "..." } }
  pagination_fields: ["limit", "offset", "total_count", "has_more"]
  pagination_defaults: { limit: 10, min: 1, max: 100, offset: 0 }

# =============================================================================
# §1.1 Entity-Relationship Table
# =============================================================================
entities:
  - name: Marina
    parent: null
    common_fields: true
    fields:
      - name: name
        type: string
        source: input
        description: "Display name of the marina"
      - name: timezone
        type: string
        source: input
        description: "IANA timezone; used to bucket nights for chronological billing"
        default: "America/New_York"
      - name: current_date
        type: datetime
        source: system
        description: "Marina clock (advanced via POST /_clock/advance). ISO 8601 UTC, three fractional digits"
      - name: ops_run_index
        type: integer
        source: system
        description: "Batch tick counter. Starts at 0; +1 each POST /_ops/run"
        default: 0
      - name: base_daily_rate_cents
        type: integer
        source: input
        description: "Per-foot-of-LOA daily base rate in cents; multiplied by season multiplier and added to slip flat charge"
      - name: liveaboard_quota
        type: integer
        source: input
        description: "Maximum simultaneously approved liveaboard reservations"
      - name: liveaboard_active_count
        type: integer
        source: computed
        description: "Number of Reservations where liveaboard=true and status IN {APPROVED, CHECKED_IN}"

  - name: Boater
    parent: Marina
    common_fields: true
    fields:
      - name: marina_id
        type: string
        source: system
        description: "Owning Marina id"
      - name: name
        type: string
        source: input
        description: "Boater legal name"
      - name: deposit_balance_cents
        type: integer
        source: system
        description: "Refundable deposit balance held by marina, in cents. Starts at 0"
        default: 0
      - name: status
        type: enum
        source: system
        description: "ACTIVE — only state produced in v1; reserved for future suspension"
        constraints: "{ACTIVE}"
        default: "ACTIVE"

  - name: Vessel
    parent: Boater
    common_fields: true
    fields:
      - name: marina_id
        type: string
        source: system
        description: "Owning Marina id"
      - name: boater_id
        type: string
        source: input
        description: "Owning Boater id"
      - name: name
        type: string
        source: input
        description: "Vessel name"
      - name: loa_feet
        type: number
        source: input
        description: "Length Overall in feet, one decimal place"
        constraints: "loa_feet > 0"
      - name: beam_feet
        type: number
        source: input
        description: "Maximum beam (width) in feet, one decimal place"
        constraints: "beam_feet > 0"
      - name: draft_feet
        type: number
        source: input
        description: "Vessel draft (depth) in feet, one decimal place"
        constraints: "draft_feet > 0"
      - name: holding_tank_gallons
        type: integer
        source: input
        description: "Marine sanitation tank capacity, in gallons. Required when liveaboard=true on any reservation"

  - name: Slip
    parent: Marina
    common_fields: true
    fields:
      - name: marina_id
        type: string
        source: system
        description: "Owning Marina id"
      - name: code
        type: string
        source: input
        description: "Human label, e.g., A-12"
        constraints: "Unique within a marina"
      - name: length_feet
        type: number
        source: input
        description: "Maximum LOA the slip can berth, one decimal place"
      - name: beam_feet
        type: number
        source: input
        description: "Slip beam (width) in feet, one decimal place"
      - name: depth_feet
        type: number
        source: input
        description: "Mean low-water depth in feet, one decimal place"
      - name: flat_daily_charge_cents
        type: integer
        source: input
        description: "Flat per-day rent for occupying this specific slip, in cents (added to LOA-priced base)"
      - name: liveaboard_allowed
        type: boolean
        source: input
        description: "Whether this slip permits liveaboard reservations"
        default: false
      - name: status
        type: enum
        source: system
        description: "AVAILABLE | MAINTENANCE | RETIRED"
        constraints: "{AVAILABLE, MAINTENANCE, RETIRED}"
        default: "AVAILABLE"

  - name: Reservation
    parent: Marina
    common_fields: true
    fields:
      - name: marina_id
        type: string
        source: system
        description: "Owning Marina id"
      - name: boater_id
        type: string
        source: input
        description: "Booking boater"
      - name: vessel_id
        type: string
        source: input
        description: "Vessel to berth"
      - name: slip_id
        type: string
        source: input
        description: "Target slip id"
      - name: check_in_date
        type: datetime
        source: input
        description: "Inclusive start date (UTC midnight)"
      - name: check_out_date
        type: datetime
        source: input
        description: "Exclusive end date (UTC midnight); half-open interval [check_in, check_out)"
      - name: liveaboard
        type: boolean
        source: input
        description: "If true the boater intends to live aboard for the term"
        default: false
      - name: insurance_policy_id
        type: string
        source: input
        description: "Required InsurancePolicy id; must be ACTIVE and cover the term"
      - name: status
        type: enum
        source: system
        description: "DRAFT | APPROVED | CHECKED_IN | CHECKED_OUT | CANCELLED | EXPIRED"
        constraints: "{DRAFT, APPROVED, CHECKED_IN, CHECKED_OUT, CANCELLED, EXPIRED}"
        default: "DRAFT"
      - name: estimated_total_cents
        type: integer
        source: computed
        description: "Forward-looking total computed at APPROVE using the season at check_in_date"
      - name: final_total_cents
        type: integer
        source: computed
        description: "Chronological per-night total computed at CHECK_OUT (may differ if term crosses a season boundary)"
      - name: nights
        type: integer
        source: computed
        description: "(check_out_date - check_in_date) in whole days; check_out_date must be strictly after check_in_date"

  - name: WaitlistEntry
    parent: Marina
    common_fields: false  # immutable append-only ordering token; updated only by selector promotion
    fields:
      - name: marina_id
        type: string
        source: system
        description: "Owning Marina id"
      - name: boater_id
        type: string
        source: input
        description: "Boater waiting"
      - name: vessel_id
        type: string
        source: input
        description: "Vessel that needs a slip"
      - name: requested_check_in
        type: datetime
        source: input
        description: "Desired check-in date"
      - name: requested_check_out
        type: datetime
        source: input
        description: "Desired check-out date"
      - name: liveaboard
        type: boolean
        source: input
        description: "Whether the request is for a liveaboard slip"
      - name: sequence_no
        type: integer
        source: system
        description: "Monotonic queue position assigned at create; unique within marina"
      - name: status
        type: enum
        source: system
        description: "QUEUED | PROMOTED | CANCELLED | EXPIRED"
        constraints: "{QUEUED, PROMOTED, CANCELLED, EXPIRED}"
        default: "QUEUED"
      - name: promoted_reservation_id
        type: string
        source: system
        description: "Set when PROMOTED; references the Reservation auto-created"

  - name: SlipTransferRequest
    parent: Marina
    common_fields: true
    fields:
      - name: marina_id
        type: string
        source: system
        description: "Owning Marina id"
      - name: reservation_id
        type: string
        source: input
        description: "Active reservation the boater wants to move from"
      - name: desired_slip_id
        type: string
        source: input
        description: "Slip the boater requests to move into"
      - name: status
        type: enum
        source: system
        description: "REQUESTED | OFFERED | DECLINED | ACCEPTED | EXPIRED"
        constraints: "{REQUESTED, OFFERED, DECLINED, ACCEPTED, EXPIRED}"
        default: "REQUESTED"
      - name: offer_expires_at
        type: datetime
        source: system
        description: "Set when DockMaster transitions to OFFERED; +24h from offer"

  - name: PumpOutJob
    parent: Marina
    common_fields: true
    fields:
      - name: marina_id
        type: string
        source: system
        description: "Owning Marina id"
      - name: reservation_id
        type: string
        source: input
        description: "Reservation requesting pump-out service (must be CHECKED_IN)"
      - name: scheduled_start
        type: datetime
        source: input
        description: "Scheduled start time UTC"
      - name: scheduled_end
        type: datetime
        source: input
        description: "Scheduled end time UTC; (start, end] half-open interval"
      - name: status
        type: enum
        source: system
        description: "SCHEDULED | COMPLETED | CANCELLED"
        constraints: "{SCHEDULED, COMPLETED, CANCELLED}"
        default: "SCHEDULED"
      - name: tank_gallons_drained
        type: integer
        source: input
        description: "Gallons drained at COMPLETE; required for chronological utility billing"

  - name: UtilityReading
    parent: Reservation
    common_fields: false  # append-only chronological ledger
    fields:
      - name: reservation_id
        type: string
        source: system
        description: "Reservation this reading belongs to"
      - name: read_at
        type: datetime
        source: input
        description: "Time of the meter read (UTC)"
      - name: kwh_delta
        type: integer
        source: input
        description: "Whole kWh consumed since previous reading"
        constraints: "kwh_delta >= 0"
      - name: water_gallons_delta
        type: integer
        source: input
        description: "Whole gallons of water consumed since previous reading"
        constraints: "water_gallons_delta >= 0"
      - name: applied_in_settlement
        type: boolean
        source: system
        description: "Set to true once included in a UtilitySettlement"
        default: false

  - name: UtilitySettlement
    parent: Reservation
    common_fields: true
    fields:
      - name: reservation_id
        type: string
        source: system
        description: "Reservation being settled"
      - name: window_start
        type: datetime
        source: system
        description: "Start of billing window (UTC, inclusive)"
      - name: window_end
        type: datetime
        source: system
        description: "End of billing window (UTC, exclusive)"
      - name: kwh_total
        type: integer
        source: computed
        description: "Sum of kwh_delta across readings in window"
      - name: water_gallons_total
        type: integer
        source: computed
        description: "Sum of water_gallons_delta across readings in window"
      - name: sewage_charge_cents
        type: integer
        source: computed
        description: "Flat sewage fee, levied only when liveaboard=true"
      - name: total_cents
        type: integer
        source: computed
        description: "Final invoice cents per liveaboard_utility_settlement formula"

  - name: InsurancePolicy
    parent: Boater
    common_fields: true
    fields:
      - name: boater_id
        type: string
        source: input
        description: "Insured boater"
      - name: carrier
        type: string
        source: input
        description: "Insurance carrier name"
      - name: liability_limit_cents
        type: integer
        source: input
        description: "Per-occurrence liability limit, cents"
      - name: effective_date
        type: datetime
        source: input
        description: "Coverage effective date (inclusive)"
      - name: expiration_date
        type: datetime
        source: input
        description: "Coverage expiration date (exclusive)"
      - name: status
        type: enum
        source: system
        description: "ACTIVE | EXPIRED | CANCELLED"
        constraints: "{ACTIVE, EXPIRED, CANCELLED}"
        default: "ACTIVE"

  - name: TowAssistContract
    parent: Boater
    common_fields: true
    fields:
      - name: boater_id
        type: string
        source: input
        description: "Subscriber"
      - name: tier
        type: enum
        source: input
        description: "BASIC | PREMIUM (PREMIUM unlocks unlimited tows)"
        constraints: "{BASIC, PREMIUM}"
      - name: tows_remaining
        type: integer
        source: computed
        description: "Tows left this period; BASIC starts at 2, PREMIUM at -1 meaning unlimited"
      - name: status
        type: enum
        source: system
        description: "ACTIVE — only state produced in v1; contract lifecycle is single-state"
        constraints: "{ACTIVE}"
        default: "ACTIVE"

  - name: TowEvent
    parent: TowAssistContract
    common_fields: false
    fields:
      - name: contract_id
        type: string
        source: system
        description: "Tow contract"
      - name: occurred_at
        type: datetime
        source: input
        description: "When the tow took place"
      - name: from_position
        type: string
        source: input
        description: "Free-text origin"
      - name: to_slip_id
        type: string
        source: input
        description: "Slip the vessel was towed to (must be AVAILABLE)"
      - name: charge_cents
        type: integer
        source: computed
        description: "0 for BASIC within remaining count, full per-tow_flat_fee otherwise"

# =============================================================================
# §1.2 State Machine Table
# =============================================================================
state_machines:
  - entity: Reservation
    initial_state: DRAFT
    terminal_states: [CHECKED_OUT, CANCELLED, EXPIRED]
    transitions:
      - from: DRAFT
        to: APPROVED
        trigger: "POST /marinas/:marina_id/reservations/:id/approve"
        actor: DockMaster
        preconditions:
          - "Slip.status == AVAILABLE"
          - "Slip.length_feet >= Vessel.loa_feet (size-match LOA)"
          - "Slip.beam_feet - 2.0 >= Vessel.beam_feet (size-match beam buffer)"
          - "Slip.depth_feet >= Vessel.draft_feet (size-match draft)"
          - "If liveaboard=true: Slip.liveaboard_allowed=true AND Marina.liveaboard_active_count < Marina.liveaboard_quota AND Vessel.holding_tank_gallons IS NOT NULL"
          - "InsurancePolicy.status == ACTIVE AND effective_date <= check_in_date AND expiration_date >= check_out_date"
          - "No other Reservation on this Slip with status IN {APPROVED, CHECKED_IN} overlapping [check_in_date, check_out_date) (half-open)"
        side_effects:
          - "estimated_total_cents computed via forward_looking_reservation_total"
          - "If liveaboard=true: Marina.liveaboard_active_count += 1 (derived recomputation)"
      - from: DRAFT
        to: CANCELLED
        trigger: "POST /marinas/:marina_id/reservations/:id/cancel"
        actor: Boater
        preconditions: []
        side_effects: []
      - from: APPROVED
        to: CHECKED_IN
        trigger: "POST /marinas/:marina_id/reservations/:id/check-in"
        actor: DockMaster
        preconditions:
          - "Marina.current_date >= check_in_date"
          - "Reservation status == APPROVED"
        side_effects: []
      - from: APPROVED
        to: CANCELLED
        trigger: "POST /marinas/:marina_id/reservations/:id/cancel"
        actor: Boater
        preconditions:
          - "No PumpOutJob with status=SCHEDULED references this Reservation (ERR_HAS_DEPENDENCIES)"
        side_effects:
          - "If liveaboard=true: Marina.liveaboard_active_count -= 1 (derived recomputation)"
      - from: CHECKED_IN
        to: CHECKED_OUT
        trigger: "POST /marinas/:marina_id/reservations/:id/check-out"
        actor: DockMaster
        preconditions:
          - "Marina.current_date >= check_in_date"
          - "All PumpOutJobs for this reservation are in {COMPLETED, CANCELLED} (ERR_HAS_DEPENDENCIES)"
        side_effects:
          - "final_total_cents computed via chronological_reservation_total"
          - "UtilitySettlement created over [check_in_date, Marina.current_date) — only when liveaboard=true"
          - "If liveaboard=true: Marina.liveaboard_active_count -= 1 (derived recomputation)"
          - "Cascade: any QUEUED WaitlistEntry whose [requested_check_in, requested_check_out) overlap is now satisfied by this slip's freed window MAY be promoted at the next POST /_ops/run"
      - from: APPROVED
        to: EXPIRED
        trigger: "system: POST /_ops/run sees Marina.current_date >= check_in_date + 1 day AND reservation never checked in"
        actor: system
        preconditions: []
        side_effects:
          - "If liveaboard=true: Marina.liveaboard_active_count -= 1 (derived recomputation)"

  - entity: SlipTransferRequest
    initial_state: REQUESTED
    terminal_states: [ACCEPTED, EXPIRED]
    transitions:
      - from: REQUESTED
        to: OFFERED
        trigger: "POST /marinas/:marina_id/transfer-requests/:id/offer"
        actor: DockMaster
        preconditions:
          - "Desired Slip.status == AVAILABLE"
          - "Desired Slip size-matches the source Reservation's Vessel (same checks as Reservation APPROVE)"
          - "No overlapping APPROVED/CHECKED_IN reservation on desired_slip_id for the remaining term"
        side_effects:
          - "offer_expires_at = Marina.current_date + 24h"
      - from: OFFERED
        to: DECLINED
        trigger: "POST /marinas/:marina_id/transfer-requests/:id/decline"
        actor: Boater
        preconditions: []
        side_effects: []
      - from: DECLINED
        to: REQUESTED
        trigger: "POST /marinas/:marina_id/transfer-requests/:id/requeue"
        actor: Boater
        preconditions:
          - "Reservation.status IN {APPROVED, CHECKED_IN} (still active)"
        side_effects: []
      - from: OFFERED
        to: ACCEPTED
        trigger: "POST /marinas/:marina_id/transfer-requests/:id/accept"
        actor: Boater
        preconditions:
          - "Marina.current_date < offer_expires_at"
          - "Desired Slip.status == AVAILABLE"
        side_effects:
          - "Source Reservation.slip_id := desired_slip_id"
          - "Source Reservation.estimated_total_cents recomputed via forward_looking_reservation_total using the new slip's flat_daily_charge_cents (derived field reconciliation)"
      - from: OFFERED
        to: EXPIRED
        trigger: "system: POST /_ops/run sees Marina.current_date >= offer_expires_at"
        actor: system
        preconditions: []
        side_effects: []

  - entity: WaitlistEntry
    initial_state: QUEUED
    terminal_states: [PROMOTED, CANCELLED, EXPIRED]
    transitions:
      - from: QUEUED
        to: PROMOTED
        trigger: "system: POST /_ops/run promotes via slip_match_selector"
        actor: system
        preconditions:
          - "An AVAILABLE Slip exists that size-matches the entry's Vessel AND has no overlapping APPROVED/CHECKED_IN reservation for [requested_check_in, requested_check_out)"
          - "If liveaboard=true: candidate Slip.liveaboard_allowed=true AND Marina.liveaboard_active_count < Marina.liveaboard_quota"
        side_effects:
          - "A new Reservation is created in APPROVED state on the chosen slip with the requested dates"
          - "promoted_reservation_id is set"
          - "estimated_total_cents on the new Reservation computed via forward_looking_reservation_total"
      - from: QUEUED
        to: CANCELLED
        trigger: "POST /marinas/:marina_id/waitlist/:id/cancel"
        actor: Boater
        preconditions: []
        side_effects: []
      - from: QUEUED
        to: EXPIRED
        trigger: "system: POST /_ops/run sees Marina.current_date >= requested_check_out"
        actor: system
        preconditions: []
        side_effects: []

  - entity: PumpOutJob
    initial_state: SCHEDULED
    terminal_states: [COMPLETED, CANCELLED]
    transitions:
      - from: SCHEDULED
        to: COMPLETED
        trigger: "POST /marinas/:marina_id/pump-out-jobs/:id/complete"
        actor: DockMaster
        preconditions:
          - "tank_gallons_drained > 0"
          - "Marina.current_date >= scheduled_start"
        side_effects:
          - "If parent Reservation.liveaboard=true: append a UtilityReading at read_at = scheduled_end with water_gallons_delta = tank_gallons_drained, kwh_delta = 0 (chronological ledger sync)"
      - from: SCHEDULED
        to: CANCELLED
        trigger: "POST /marinas/:marina_id/pump-out-jobs/:id/cancel"
        actor: Boater
        preconditions: []
        side_effects: []

  - entity: InsurancePolicy
    initial_state: ACTIVE
    terminal_states: [EXPIRED, CANCELLED]
    transitions:
      - from: ACTIVE
        to: EXPIRED
        trigger: "system: POST /_ops/run sees Marina.current_date >= expiration_date"
        actor: system
        preconditions: []
        side_effects:
          - "Cascade: any Reservation referencing this policy in status DRAFT remains DRAFT but APPROVE now fails with ERR_INSURANCE_LAPSED"
      - from: ACTIVE
        to: CANCELLED
        trigger: "POST /marinas/:marina_id/policies/:id/cancel"
        actor: Boater
        preconditions:
          - "No Reservation referencing this policy is in {APPROVED, CHECKED_IN} (ERR_HAS_DEPENDENCIES)"
        side_effects: []

# §1.2.1 Concurrency Rules
concurrency_rules:
  - scenario: "Two DockMasters approve different reservations on the same slip with overlapping date ranges at the same instant"
    guarantee: "At most one APPROVED reservation per (slip_id, overlapping date range); loser rejected"
    error_id: ERR_SLIP_OCCUPIED
    http_status: 409
    serialization: "First-writer-wins on Reservation status transition DRAFT→APPROVED for a given slip and overlap window"
  - scenario: "Boater accepts a slip transfer offer while DockMaster marks the desired slip MAINTENANCE simultaneously"
    guarantee: "Exactly one operation succeeds; loser is rejected"
    error_id: ERR_INVALID_STATE
    http_status: 409
    serialization: "First-writer-wins on Slip.status"
  - scenario: "Two boaters create a WaitlistEntry at the same instant"
    guarantee: "Both succeed but each receives a distinct sequence_no assigned monotonically by the server"
    error_id: ERR_VERSION_CONFLICT
    http_status: 409
    serialization: "Atomic increment of Marina-scoped sequence counter; the loser of an If-Match version race gets ERR_VERSION_CONFLICT"
  - scenario: "Approving a liveaboard reservation while another liveaboard reservation is approved at the same time and quota would be exceeded"
    guarantee: "At most Marina.liveaboard_quota concurrent liveaboard reservations; second approval rejected"
    error_id: ERR_LIVEABOARD_QUOTA_EXCEEDED
    http_status: 409
    serialization: "First-writer-wins on Marina.liveaboard_active_count increment"

# =============================================================================
# §1.3 Calculation Rules Table
# =============================================================================
calculations:
  - name: forward_looking_reservation_total
    trigger: "Reservation transitions DRAFT→APPROVED, or slip changes on ACCEPTED SlipTransferRequest"
    algorithm: forward_looking
    formula: |
      nights = (check_out_date - check_in_date) in whole days  # half-open [check_in, check_out)
      season_multiplier = season_for(check_in_date) lookup  # frozen at APPROVE time
      per_night_cents_raw =
          (Marina.base_daily_rate_cents * Vessel.loa_feet * season_multiplier)
          + Slip.flat_daily_charge_cents
          + (Reservation.liveaboard ? LIVEABOARD_SURCHARGE_CENTS : 0)
      per_night_cents = round_half_up(per_night_cents_raw, 0)   # round per-night FIRST
      estimated_total_cents = per_night_cents * nights          # then sum
    input_set: "All nights in [check_in_date, check_out_date); the season frozen at check_in_date is applied to ALL nights regardless of crossings"
    constants:
      LIVEABOARD_SURCHARGE_CENTS: 1500     # $15.00/day
      SEASON_PEAK_MULTIPLIER: 1.50         # 150%
      SEASON_SHOULDER_MULTIPLIER: 1.20     # 120%
      SEASON_OFF_MULTIPLIER: 1.00          # 100%
      SEASON_PEAK_MONTHS: [6, 7, 8]        # Jun-Aug
      SEASON_SHOULDER_MONTHS: [4, 5, 9, 10] # Apr-May, Sep-Oct
      # All other months → OFF
    precision: "Integer cents; round_half_up at the per-night step; multiplication by nights is exact"
    variants:
      - name: forward_looking_variant
        when: "Computed at APPROVE; freezes the season multiplier of check_in_date for all nights"
        difference: "Does NOT recompute when the term crosses a season boundary"

  - name: chronological_reservation_total
    trigger: "Reservation transitions CHECKED_IN→CHECKED_OUT"
    algorithm: chronological
    formula: |
      total_cents = 0
      for each night_date in [check_in_date, check_out_date) iterated chronologically:
          season_multiplier = season_for(night_date) lookup     # may change mid-term
          per_night_cents_raw =
              (Marina.base_daily_rate_cents * Vessel.loa_feet * season_multiplier)
              + Slip.flat_daily_charge_cents
              + (Reservation.liveaboard ? LIVEABOARD_SURCHARGE_CENTS : 0)
          per_night_cents = round_half_up(per_night_cents_raw, 0)   # round per-night, sort key = night_date ascending
          total_cents += per_night_cents
      final_total_cents = total_cents
    input_set: "Every night_date in [check_in_date, check_out_date); processed strictly in chronological order"
    constants:
      LIVEABOARD_SURCHARGE_CENTS: 1500
      SEASON_PEAK_MULTIPLIER: 1.50
      SEASON_SHOULDER_MULTIPLIER: 1.20
      SEASON_OFF_MULTIPLIER: 1.00
      SEASON_PEAK_MONTHS: [6, 7, 8]
      SEASON_SHOULDER_MONTHS: [4, 5, 9, 10]
    precision: "Integer cents; round_half_up per night, then sum"
    variants:
      - name: chronological_variant
        when: "Computed at CHECK_OUT; re-evaluates season per night"
        difference: "Term crossing a season boundary yields a different number than forward_looking_reservation_total"

  - name: liveaboard_utility_settlement
    trigger: "Reservation transitions CHECKED_IN→CHECKED_OUT (only when Reservation.liveaboard=true)"
    algorithm: aggregation
    formula: |
      readings = UtilityReading WHERE reservation_id = R.id AND applied_in_settlement=false
                                AND read_at IN [check_in_date, Marina.current_date)
                                ORDER BY read_at ASC, id ASC  # tie-break by id ascending
      kwh_total = sum(r.kwh_delta for r in readings)
      water_gallons_total = sum(r.water_gallons_delta for r in readings)
      kwh_charge_cents = kwh_total * KWH_RATE_CENTS
      water_charge_cents = water_gallons_total * WATER_RATE_CENTS_PER_GAL
      if Reservation.liveaboard == true and water_gallons_total > 0:
          sewage_charge_cents = SEWAGE_FLAT_CENTS
      else:
          sewage_charge_cents = 0
      total_cents = kwh_charge_cents + water_charge_cents + sewage_charge_cents
      mark every reading in `readings` applied_in_settlement = true
    input_set: "Readings for the reservation with read_at in [check_in_date, Marina.current_date) AND applied_in_settlement=false; sorted ascending by read_at then id"
    constants:
      KWH_RATE_CENTS: 18                # $0.18/kWh
      WATER_RATE_CENTS_PER_GAL: 4        # $0.04/gal
      SEWAGE_FLAT_CENTS: 2500            # $25.00 flat per settlement, only if liveaboard
    precision: "Integer cents; no rounding required (all rates are whole cents)"
    variants: []

  - name: tow_event_charge
    trigger: "POST /marinas/:marina_id/tow-events (create TowEvent)"
    algorithm: threshold
    formula: |
      if Contract.tier == PREMIUM:
          charge_cents = 0
          tows_remaining := tows_remaining  # unchanged (-1 sentinel)
      elif Contract.tier == BASIC and Contract.tows_remaining > 0:
          charge_cents = 0
          tows_remaining := tows_remaining - 1
      else:  # BASIC with tows_remaining == 0
          charge_cents = TOW_FLAT_FEE_CENTS
    input_set: "The TowEvent under construction and its parent TowAssistContract.tows_remaining"
    constants:
      TOW_FLAT_FEE_CENTS: 25000          # $250.00 flat fee per tow when out of coverage
    precision: "Integer cents"
    variants: []

  - name: slip_match_selector
    trigger: "POST /_ops/run iterates QUEUED WaitlistEntry"
    algorithm: constraint_propagation
    formula: |
      Iterate QUEUED WaitlistEntry in this Marina ordered by sequence_no ASC (tie-break: id ASC).
      For each entry, compute the candidate Slip set:
        eligibility filter (all must hold):
          - Slip.marina_id == entry.marina_id
          - Slip.status == AVAILABLE
          - Slip.length_feet >= entry.Vessel.loa_feet
          - Slip.beam_feet - 2.0 >= entry.Vessel.beam_feet
          - Slip.depth_feet >= entry.Vessel.draft_feet
          - if entry.liveaboard: Slip.liveaboard_allowed == true
                                  AND Marina.liveaboard_active_count < Marina.liveaboard_quota
          - No Reservation with status IN {APPROVED, CHECKED_IN}
                  on this slip overlapping [entry.requested_check_in, entry.requested_check_out)
        ranking expression (lowest first):
          (Slip.length_feet - entry.Vessel.loa_feet,        # tightest LOA fit first
           Slip.beam_feet  - entry.Vessel.beam_feet,        # then tightest beam fit
           Slip.depth_feet - entry.Vessel.draft_feet,       # then shallowest extra depth
           Slip.code)                                        # then lexicographic code for determinism
        if candidate set is empty: skip (entry stays QUEUED)
        else: pick the lowest-ranked candidate, create Reservation in APPROVED state, mark entry PROMOTED
    input_set: "QUEUED WaitlistEntry for this marina, processed in sequence_no order"
    constants:
      BEAM_BUFFER_FEET: 2.0
    precision: "Numeric comparisons in feet at one decimal place; lexicographic on code as final tie-break"
    variants: []

# =============================================================================
# §1.4 Validation Rules Table (ordered by priority)
# =============================================================================
validations:
  - priority: 1
    category: auth
    check: "X-User-Role and X-User-ID headers present"
    error_id: ERR_UNAUTHENTICATED
    http_status: 401
    applies_to: all

  - priority: 2
    category: auth
    check: "Role permitted for this endpoint per RBAC matrix"
    error_id: ERR_FORBIDDEN
    http_status: 403
    applies_to: all

  - priority: 3
    category: existence
    check: "All path ids resolve to existing resources, left-to-right"
    error_id: ERR_NOT_FOUND
    http_status: 404
    applies_to: all

  - priority: 4
    category: state
    check: "Resource is in a state from which the requested transition is defined"
    error_id: ERR_INVALID_STATE
    http_status: 409
    applies_to: "all state-transition endpoints"

  - priority: 5
    category: business_safety
    check: "Vessel LOA fits the slip: Slip.length_feet >= Vessel.loa_feet"
    error_id: ERR_LOA_EXCEEDS_SLIP
    http_status: 422
    applies_to: "POST /marinas/:m/reservations/:id/approve, POST /marinas/:m/transfer-requests/:id/offer"

  - priority: 6
    category: business_safety
    check: "Vessel beam respects slip buffer: Slip.beam_feet - 2.0 >= Vessel.beam_feet"
    error_id: ERR_BEAM_BUFFER_VIOLATION
    http_status: 422
    applies_to: "POST /marinas/:m/reservations/:id/approve, POST /marinas/:m/transfer-requests/:id/offer"

  - priority: 7
    category: business_safety
    check: "Vessel draft does not exceed slip depth: Slip.depth_feet >= Vessel.draft_feet"
    error_id: ERR_DRAFT_EXCEEDS_DEPTH
    http_status: 422
    applies_to: "POST /marinas/:m/reservations/:id/approve, POST /marinas/:m/transfer-requests/:id/offer"

  - priority: 8
    category: business_referential
    check: "InsurancePolicy.status == ACTIVE AND coverage spans [check_in_date, check_out_date)"
    error_id: ERR_INSURANCE_LAPSED
    http_status: 422
    applies_to: "POST /marinas/:m/reservations/:id/approve"

  - priority: 9
    category: business_constraint
    check: "Liveaboard reservation: Slip.liveaboard_allowed == true AND Vessel.holding_tank_gallons IS NOT NULL"
    error_id: ERR_LIVEABOARD_POLICY_VIOLATION
    http_status: 422
    applies_to: "POST /marinas/:m/reservations/:id/approve"

  - priority: 10
    category: business_fiscal
    check: "Liveaboard quota: Marina.liveaboard_active_count < Marina.liveaboard_quota"
    error_id: ERR_LIVEABOARD_QUOTA_EXCEEDED
    http_status: 409
    applies_to: "POST /marinas/:m/reservations/:id/approve"

  - priority: 11
    category: business_temporal
    check: "No overlapping APPROVED/CHECKED_IN Reservation on the same slip for [check_in_date, check_out_date) (half-open)"
    error_id: ERR_SLIP_OCCUPIED
    http_status: 409
    applies_to: "POST /marinas/:m/reservations/:id/approve, POST /marinas/:m/transfer-requests/:id/offer"

  - priority: 12
    category: business_temporal
    check: "PumpOutJob window does not overlap another SCHEDULED PumpOutJob at the same Slip (open-overlap arithmetic: (a.start, a.end] vs (b.start, b.end])"
    error_id: ERR_PUMP_OUT_CONFLICT
    http_status: 409
    applies_to: "POST /marinas/:m/pump-out-jobs"

  - priority: 13
    category: business_referential
    check: "check_out_date > check_in_date (positive duration)"
    error_id: ERR_INVALID_DATE_RANGE
    http_status: 422
    applies_to: "POST /marinas/:m/reservations, POST /marinas/:m/waitlist"

  - priority: 14
    category: business_referential
    check: "Reservation cannot be cancelled while a SCHEDULED PumpOutJob references it; a policy cannot be cancelled while a referencing reservation is in {APPROVED, CHECKED_IN}"
    error_id: ERR_HAS_DEPENDENCIES
    http_status: 409
    applies_to: "POST /marinas/:m/reservations/:id/cancel, POST /marinas/:m/policies/:id/cancel, POST /marinas/:m/reservations/:id/check-out"

  - priority: 15
    category: business_constraint
    check: "Tow event requires destination Slip.status == AVAILABLE"
    error_id: ERR_TOW_DEST_UNAVAILABLE
    http_status: 422
    applies_to: "POST /marinas/:m/tow-events"

  - priority: 16
    category: concurrency
    check: "PATCH/PUT requires If-Match header equal to current version"
    error_id: ERR_VERSION_CONFLICT
    http_status: 409
    applies_to: "all PATCH/PUT endpoints"

# =============================================================================
# §1.5 API Endpoint Table
# =============================================================================
endpoints:
  # --- Marina ---
  - method: POST
    path: "/marinas"
    description: "Create a Marina"
    roles: [DockMaster, BillingClerk]
    code: 201
    input: [name, timezone, base_daily_rate_cents, liveaboard_quota]
    output: Marina
    side_effects: ["current_date initialized to 1970-01-01T00:00:00.000Z", "ops_run_index=0", "liveaboard_active_count=0"]

  - method: GET
    path: "/marinas/:marina_id"
    description: "Get a Marina"
    roles: [DockMaster, BillingClerk, Boater]
    code: 200
    input: []
    output: Marina
    side_effects: []

  - method: POST
    path: "/marinas/:marina_id/_clock/advance"
    description: "Test-driving endpoint that advances Marina.current_date; required for time-gated transitions"
    roles: [DockMaster]
    code: 200
    input: [to]
    output: Marina
    side_effects: ["Marina.current_date := to; subsequent _ops/run consults the new clock"]

  - method: POST
    path: "/marinas/:marina_id/_ops/run"
    description: "Batch operations tick: expire policies and offers, expire stale APPROVED reservations, promote waitlist entries, expire past waitlist entries"
    roles: [DockMaster]
    code: 200
    input: []
    output: Marina
    side_effects:
      - "ops_run_index += 1"
      - "InsurancePolicy ACTIVE → EXPIRED if Marina.current_date >= expiration_date"
      - "Reservation APPROVED → EXPIRED if Marina.current_date >= check_in_date + 1 day and not checked-in (Marina.liveaboard_active_count decremented if liveaboard)"
      - "SlipTransferRequest OFFERED → EXPIRED if Marina.current_date >= offer_expires_at"
      - "WaitlistEntry QUEUED → PROMOTED via slip_match_selector"
      - "WaitlistEntry QUEUED → EXPIRED if Marina.current_date >= requested_check_out"

  # --- Boater ---
  - method: POST
    path: "/marinas/:marina_id/boaters"
    description: "Create a Boater"
    roles: [DockMaster]
    code: 201
    input: [name]
    output: Boater
    side_effects: ["deposit_balance_cents=0, status=ACTIVE"]

  - method: GET
    path: "/marinas/:marina_id/boaters/:boater_id"
    description: "Get a Boater"
    roles: [DockMaster, BillingClerk, Boater]
    code: 200
    input: []
    output: Boater
    side_effects: []

  # --- Vessel ---
  - method: POST
    path: "/marinas/:marina_id/boaters/:boater_id/vessels"
    description: "Create a Vessel for a Boater"
    roles: [Boater, DockMaster]
    code: 201
    input: [name, loa_feet, beam_feet, draft_feet, "holding_tank_gallons?"]
    output: Vessel
    side_effects: []

  - method: GET
    path: "/marinas/:marina_id/vessels/:vessel_id"
    description: "Get a Vessel"
    roles: [Boater, DockMaster, BillingClerk]
    code: 200
    input: []
    output: Vessel
    side_effects: []

  # --- Slip ---
  - method: POST
    path: "/marinas/:marina_id/slips"
    description: "Create a Slip"
    roles: [DockMaster]
    code: 201
    input: [code, length_feet, beam_feet, depth_feet, flat_daily_charge_cents, "liveaboard_allowed?"]
    output: Slip
    side_effects: ["status=AVAILABLE"]

  - method: GET
    path: "/marinas/:marina_id/slips/:slip_id"
    description: "Get a Slip"
    roles: [DockMaster, BillingClerk, Boater]
    code: 200
    input: []
    output: Slip
    side_effects: []

  - method: PATCH
    path: "/marinas/:marina_id/slips/:slip_id/status"
    description: "Change Slip.status (e.g., MAINTENANCE or RETIRED)"
    roles: [DockMaster]
    code: 200
    input: [status]
    output: Slip
    side_effects: ["Requires If-Match"]

  # --- Reservation ---
  - method: POST
    path: "/marinas/:marina_id/reservations"
    description: "Create a Reservation in DRAFT"
    roles: [Boater, DockMaster]
    code: 201
    input: [boater_id, vessel_id, slip_id, check_in_date, check_out_date, "liveaboard?", insurance_policy_id]
    output: Reservation
    side_effects: ["status=DRAFT", "nights=(check_out_date-check_in_date) in whole days"]

  - method: GET
    path: "/marinas/:marina_id/reservations/:reservation_id"
    description: "Get a Reservation"
    roles: [DockMaster, BillingClerk, Boater]
    code: 200
    input: []
    output: Reservation
    side_effects: []

  - method: GET
    path: "/marinas/:marina_id/reservations"
    description: "List Reservations with optional filters (status, slip_id, boater_id)"
    roles: [DockMaster, BillingClerk]
    code: 200
    input: ["status?, slip_id?, boater_id?, limit?, offset?"]
    output: "Reservation[]"
    side_effects: []

  - method: POST
    path: "/marinas/:marina_id/reservations/:reservation_id/approve"
    description: "DRAFT → APPROVED"
    roles: [DockMaster]
    code: 200
    input: []
    output: Reservation
    side_effects: ["forward_looking_reservation_total computed", "Marina.liveaboard_active_count maintained"]

  - method: POST
    path: "/marinas/:marina_id/reservations/:reservation_id/check-in"
    description: "APPROVED → CHECKED_IN"
    roles: [DockMaster]
    code: 200
    input: []
    output: Reservation
    side_effects: []

  - method: POST
    path: "/marinas/:marina_id/reservations/:reservation_id/check-out"
    description: "CHECKED_IN → CHECKED_OUT"
    roles: [DockMaster]
    code: 200
    input: []
    output: Reservation
    side_effects: ["chronological_reservation_total computed", "If liveaboard: liveaboard_utility_settlement runs"]

  - method: POST
    path: "/marinas/:marina_id/reservations/:reservation_id/cancel"
    description: "DRAFT or APPROVED → CANCELLED"
    roles: [Boater, DockMaster]
    code: 200
    input: []
    output: Reservation
    side_effects: ["If liveaboard and was APPROVED: Marina.liveaboard_active_count decremented"]

  # --- Waitlist ---
  - method: POST
    path: "/marinas/:marina_id/waitlist"
    description: "Create a WaitlistEntry in QUEUED with monotonic sequence_no"
    roles: [Boater]
    code: 201
    input: [boater_id, vessel_id, requested_check_in, requested_check_out, "liveaboard?"]
    output: WaitlistEntry
    side_effects: ["sequence_no assigned atomically"]

  - method: GET
    path: "/marinas/:marina_id/waitlist/:waitlist_id"
    description: "Get a WaitlistEntry"
    roles: [Boater, DockMaster]
    code: 200
    input: []
    output: WaitlistEntry
    side_effects: []

  - method: POST
    path: "/marinas/:marina_id/waitlist/:waitlist_id/cancel"
    description: "QUEUED → CANCELLED"
    roles: [Boater]
    code: 200
    input: []
    output: WaitlistEntry
    side_effects: []

  # --- Slip Transfer ---
  - method: POST
    path: "/marinas/:marina_id/transfer-requests"
    description: "Create a SlipTransferRequest in REQUESTED"
    roles: [Boater]
    code: 201
    input: [reservation_id, desired_slip_id]
    output: SlipTransferRequest
    side_effects: ["status=REQUESTED"]

  - method: POST
    path: "/marinas/:marina_id/transfer-requests/:request_id/offer"
    description: "REQUESTED → OFFERED (or DECLINED → REQUESTED is via /requeue)"
    roles: [DockMaster]
    code: 200
    input: []
    output: SlipTransferRequest
    side_effects: ["offer_expires_at = Marina.current_date + 24h"]

  - method: POST
    path: "/marinas/:marina_id/transfer-requests/:request_id/accept"
    description: "OFFERED → ACCEPTED"
    roles: [Boater]
    code: 200
    input: []
    output: SlipTransferRequest
    side_effects: ["Reservation.slip_id updated; estimated_total_cents recomputed"]

  - method: POST
    path: "/marinas/:marina_id/transfer-requests/:request_id/decline"
    description: "OFFERED → DECLINED"
    roles: [Boater]
    code: 200
    input: []
    output: SlipTransferRequest
    side_effects: []

  - method: POST
    path: "/marinas/:marina_id/transfer-requests/:request_id/requeue"
    description: "DECLINED → REQUESTED (cyclic: lets the boater retry without re-creating)"
    roles: [Boater]
    code: 200
    input: []
    output: SlipTransferRequest
    side_effects: []

  # --- Pump-out ---
  - method: POST
    path: "/marinas/:marina_id/pump-out-jobs"
    description: "Schedule a PumpOutJob against a CHECKED_IN Reservation"
    roles: [Boater, DockMaster]
    code: 201
    input: [reservation_id, scheduled_start, scheduled_end]
    output: PumpOutJob
    side_effects: ["status=SCHEDULED"]

  - method: POST
    path: "/marinas/:marina_id/pump-out-jobs/:job_id/complete"
    description: "SCHEDULED → COMPLETED, supplying tank_gallons_drained"
    roles: [DockMaster]
    code: 200
    input: [tank_gallons_drained]
    output: PumpOutJob
    side_effects: ["If liveaboard: append UtilityReading with water_gallons_delta=tank_gallons_drained"]

  - method: POST
    path: "/marinas/:marina_id/pump-out-jobs/:job_id/cancel"
    description: "SCHEDULED → CANCELLED"
    roles: [Boater, DockMaster]
    code: 200
    input: []
    output: PumpOutJob
    side_effects: []

  # --- Utility readings ---
  - method: POST
    path: "/marinas/:marina_id/reservations/:reservation_id/utility-readings"
    description: "Append a UtilityReading (kwh and water meter)"
    roles: [DockMaster]
    code: 201
    input: [read_at, kwh_delta, water_gallons_delta]
    output: UtilityReading
    side_effects: ["applied_in_settlement=false"]

  - method: GET
    path: "/marinas/:marina_id/reservations/:reservation_id/utility-settlement"
    description: "Get the latest UtilitySettlement for a reservation"
    roles: [DockMaster, BillingClerk, Boater]
    code: 200
    input: []
    output: UtilitySettlement
    side_effects: []

  # --- Insurance ---
  - method: POST
    path: "/marinas/:marina_id/boaters/:boater_id/policies"
    description: "Create an InsurancePolicy"
    roles: [Boater, DockMaster]
    code: 201
    input: [carrier, liability_limit_cents, effective_date, expiration_date]
    output: InsurancePolicy
    side_effects: ["status=ACTIVE"]

  - method: GET
    path: "/marinas/:marina_id/policies/:policy_id"
    description: "Get an InsurancePolicy"
    roles: [Boater, DockMaster, BillingClerk]
    code: 200
    input: []
    output: InsurancePolicy
    side_effects: []

  - method: POST
    path: "/marinas/:marina_id/policies/:policy_id/cancel"
    description: "ACTIVE → CANCELLED"
    roles: [Boater, DockMaster]
    code: 200
    input: []
    output: InsurancePolicy
    side_effects: []

  # --- Tow Assist ---
  - method: POST
    path: "/marinas/:marina_id/boaters/:boater_id/tow-contracts"
    description: "Create a TowAssistContract"
    roles: [Boater, DockMaster]
    code: 201
    input: [tier]
    output: TowAssistContract
    side_effects: ["status=ACTIVE; tows_remaining = 2 if BASIC else -1 (unlimited sentinel)"]

  - method: GET
    path: "/marinas/:marina_id/tow-contracts/:contract_id"
    description: "Get a TowAssistContract"
    roles: [Boater, DockMaster, BillingClerk]
    code: 200
    input: []
    output: TowAssistContract
    side_effects: []

  - method: POST
    path: "/marinas/:marina_id/tow-contracts/:contract_id/tow-events"
    description: "Record a TowEvent, charging per tow_event_charge"
    roles: [DockMaster]
    code: 201
    input: [occurred_at, from_position, to_slip_id]
    output: TowEvent
    side_effects: ["charge_cents computed; tows_remaining decremented for BASIC if not zero"]

# =============================================================================
# §1.6 Error Code Catalog
# =============================================================================
errors:
  - id: ERR_UNAUTHENTICATED
    http: 401
    condition: "Missing or invalid auth headers"
  - id: ERR_FORBIDDEN
    http: 403
    condition: "Caller role not permitted for this endpoint, or ownership check failed"
  - id: ERR_NOT_FOUND
    http: 404
    condition: "Referenced resource does not exist within this marina"
  - id: ERR_INVALID_STATE
    http: 409
    condition: "Resource is not in a state from which the requested transition is defined"
  - id: ERR_VERSION_CONFLICT
    http: 409
    condition: "If-Match header missing or stale on a mutation"
  - id: ERR_LOA_EXCEEDS_SLIP
    http: 422
    condition: "Vessel.loa_feet > Slip.length_feet"
  - id: ERR_BEAM_BUFFER_VIOLATION
    http: 422
    condition: "Vessel.beam_feet > Slip.beam_feet - 2.0"
  - id: ERR_DRAFT_EXCEEDS_DEPTH
    http: 422
    condition: "Vessel.draft_feet > Slip.depth_feet"
  - id: ERR_INSURANCE_LAPSED
    http: 422
    condition: "InsurancePolicy not ACTIVE or does not cover [check_in_date, check_out_date)"
  - id: ERR_LIVEABOARD_POLICY_VIOLATION
    http: 422
    condition: "Slip.liveaboard_allowed=false on a liveaboard reservation, or Vessel.holding_tank_gallons missing"
  - id: ERR_LIVEABOARD_QUOTA_EXCEEDED
    http: 409
    condition: "Marina.liveaboard_active_count >= Marina.liveaboard_quota at the time of approval"
  - id: ERR_SLIP_OCCUPIED
    http: 409
    condition: "Another APPROVED/CHECKED_IN Reservation overlaps [check_in_date, check_out_date) on this slip"
  - id: ERR_PUMP_OUT_CONFLICT
    http: 409
    condition: "Pump-out window overlaps another SCHEDULED PumpOutJob on the same slip"
  - id: ERR_INVALID_DATE_RANGE
    http: 422
    condition: "check_out_date <= check_in_date"
  - id: ERR_HAS_DEPENDENCIES
    http: 409
    condition: "Mutation blocked because dependents exist (e.g., SCHEDULED pump-out, active referencing reservation)"
  - id: ERR_TOW_DEST_UNAVAILABLE
    http: 422
    condition: "Tow destination Slip is not AVAILABLE"
  - id: ERR_BAD_REQUEST
    http: 400
    condition: "Malformed or invalid request body (missing required field, bad type, etc.)"

# =============================================================================
# §1.7 RBAC Matrix
# =============================================================================
roles:
  - name: DockMaster
    description: "Operations role responsible for slip inventory, reservation approval, check-in/out, transfers, pump-out execution, and ops sweeps"
    identity: opaque
    exclusive_operations:
      - "POST /marinas — Create Marina"
      - "POST /marinas/:m/slips — Create Slip"
      - "PATCH /marinas/:m/slips/:id/status — Change slip status"
      - "POST /marinas/:m/reservations/:id/approve — Approve reservation"
      - "POST /marinas/:m/reservations/:id/check-in — Check in"
      - "POST /marinas/:m/reservations/:id/check-out — Check out"
      - "POST /marinas/:m/transfer-requests/:id/offer — Offer slip transfer"
      - "POST /marinas/:m/pump-out-jobs/:id/complete — Complete pump-out"
      - "POST /marinas/:m/reservations/:id/utility-readings — Record meter reading"
      - "POST /marinas/:m/tow-contracts/:id/tow-events — Record tow event"
      - "POST /marinas/:m/_clock/advance — Advance Marina clock (test)"
      - "POST /marinas/:m/_ops/run — Run ops batch"
    shared_operations:
      - "Create boater/vessel/policy/tow-contract on behalf of boater"

  - name: Boater
    description: "Self-service role for boaters managing their own vessels, reservations, transfers, and waitlist entries"
    identity: "entity_backed:Boater"
    exclusive_operations:
      - "POST /marinas/:m/waitlist — Create waitlist entry"
      - "POST /marinas/:m/transfer-requests — Request slip transfer"
      - "POST /marinas/:m/transfer-requests/:id/accept — Accept transfer offer"
      - "POST /marinas/:m/transfer-requests/:id/decline — Decline transfer offer"
      - "POST /marinas/:m/transfer-requests/:id/requeue — Re-queue declined transfer"
      - "POST /marinas/:m/waitlist/:id/cancel — Cancel waitlist entry"
    shared_operations:
      - "POST /marinas/:m/boaters/:b/vessels — Create own vessel (shared with DockMaster)"
      - "POST /marinas/:m/reservations — Create reservation"
      - "POST /marinas/:m/reservations/:id/cancel — Cancel own reservation"
      - "POST /marinas/:m/pump-out-jobs — Schedule pump-out for own reservation"
      - "POST /marinas/:m/pump-out-jobs/:id/cancel — Cancel own pump-out"
      - "POST /marinas/:m/boaters/:b/policies — Buy insurance policy"
      - "POST /marinas/:m/policies/:id/cancel — Cancel own policy"
      - "POST /marinas/:m/boaters/:b/tow-contracts — Buy tow contract"
      - "GET endpoints for own boater/vessel/reservation/policy/contract"

  - name: BillingClerk
    description: "Read-only billing role for invoices, settlements, and reservation totals"
    identity: opaque
    exclusive_operations: []
    shared_operations:
      - "POST /marinas — Create Marina (shared with DockMaster)"
      - "GET /marinas/:m — Marina info"
      - "GET /marinas/:m/reservations — List reservations with totals"
      - "GET /marinas/:m/reservations/:id/utility-settlement — Read utility settlement"
      - "GET /marinas/:m/policies/:id — Read policy"
      - "GET /marinas/:m/tow-contracts/:id — Read tow contract"
