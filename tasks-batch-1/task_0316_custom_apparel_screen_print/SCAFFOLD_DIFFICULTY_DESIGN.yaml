          assert:
            - "Response error_id == ERR_STATION_OVERSUBSCRIBED (true [11:00,12:00) overlap exceeds head_count 1)"

  # ===========================================================================
  - rule_id: compensating_invariant
    instances:
      - name: blank_stock_conserved_on_reserve_then_release
        grounds:
          - calculations.blank_conservation_invariant
          - state_machines.Order.CONFIRMED_to_CANCELLED
          - entities.BlankSku.fields.total_stock_qty
          - entities.BlankSku.fields.on_hand_qty
          - entities.BlankSku.fields.reserved_qty
        distinguishing_aspect: "Conserved quantity = blank units: confirm reserves 53 (on_hand 200->147, reserved 0->53) and cancel releases them (on_hand->200, reserved->0); the invariant on_hand_qty + reserved_qty == total_stock_qty (200) holds before, during, and after — net zero drift in blank units."
        test_recipe:
          setup:
            - "Order with line {L:50} approved+CONFIRMED; BlankSku total_stock 200, on_hand 147, reserved 53."
          setup_api_calls:
            - call: "POST /shops"
              payload: { name: "Ink Co" }
              as: ShopManager
              captures: { shop_id: $.data.id }
            - call: "POST /customers"
              payload: { shop_id: "${shop_id}", name: "Acme", email: "a@x.com" }
              as: ShopManager
              captures: { cust_id: $.data.id }
            - call: "POST /decoration-methods"
              payload: { shop_id: "${shop_id}", method_type: "SCREEN_PRINT", name: "Plastisol" }
