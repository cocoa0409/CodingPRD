              payload: { plant_id: "${plant_id}", interval_start: "2026-08-10T02:00:00Z", interval_end: "2026-08-10T05:00:00Z", hourly_volumes_mscf: [115.0, 115.0, 115.0], methane_pct: 97.4, oxygen_pct: 0.1, co2_pct: 1.4 }
              as: PlantOperator
              captures: { b1_id: $.data.id }
            - call: "POST /injection-batches/${b1_id}/status"
              payload: { to_status: "PENDING_ANALYSIS" }
              as: PlantOperator
            - call: "POST /injection-batches/${b1_id}/status"
              payload: { to_status: "NOMINATED", nomination_id: "${nom_id}" }
