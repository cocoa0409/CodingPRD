        distinguishing_aspect: |
          Claiming, releasing, deciding and adjudicating are the reviewer's exclusive verbs.
          PolicyAdmin may create the work (screening) and recycle it (requeue) but may never
          decide it, and the advertiser under review may not decide their own task — each
          attempt is 403 with the queue left untouched.
