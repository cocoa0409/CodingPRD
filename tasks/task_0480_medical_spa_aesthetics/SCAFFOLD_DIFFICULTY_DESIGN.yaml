              as: Provider
              as_user_id: "${ci_inj}"
              captures: { ci_cons: $.data.id }
            - call: "POST /aesthetics/consultations/${ci_cons}/complete-exam"
              payload: {}
              as: Provider
              as_user_id: "${ci_inj}"
            - call: "POST /aesthetics/standing-orders"
