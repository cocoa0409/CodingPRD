              captures: { cl: $.data.id }
            - call: "POST /claims/${cl}/triage"
              payload: {}
              as: ClaimsExaminer
              as_user_id: "ce-001"
            - call: "POST /advance-payments"
              payload: { claim_id: "${cl}", requested_amount: 600, basis: "STRUCTURE_PARTIAL" }
