          assert:
            - "Incident A work-orders list length == 1; RepairWorkOrder.${wo_a}.origin == AUTO_DETERMINATION, status == OPEN at creation, provisional_estimate_cents == 90000 (OUTSIDE_COMPANY x P2)"
            - "Incident B work-orders list length == 0 (INSIDE_CUSTOMER creates no company work order)"
            - "GasIncident.${inc_b}.customer_referral_required == true; GasIncident.${inc_b}.responsibility == INSIDE_CUSTOMER"
