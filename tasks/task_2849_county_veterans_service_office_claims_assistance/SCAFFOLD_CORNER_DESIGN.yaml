          - errors[ERR_UNAUTHORIZED]
          - errors[ERR_ACTOR_NOT_OWNER]
        distinguishing_aspect: "Acceptance is VeteranClient-exclusive and owner-scoped: the CountyOfficer is refused with ERR_UNAUTHORIZED (403) by the role check at priority 3, a second veteran acting on the first veteran's designation is refused with ERR_ACTOR_NOT_OWNER (403) by the ownership check at priority 5, and only the named veteran's own call moves the designation to ACTIVE."
        test_recipe:
          setup:
            - "Clock 2026-08-01T00:00:00Z."
            - "rep_a ACTIVE COUNTY_CVSO."
            - "Veteran vet_a with a VERIFIED DD214 and an OFFERED designation poa_a; veteran vet_b unrelated."
          setup_api_calls:
            - call: "POST /cvso/_clock/set_current_utc"
              payload: { current_utc: "2026-08-01T00:00:00Z" }
              as: SystemAdmin
            - call: "POST /cvso/representatives"
              payload: { full_name: "Dana Reyes", accreditation_number: "ACC-2849-811", accreditation_type: "COUNTY_CVSO", accreditation_expires_on: "2029-12-31" }
              as: SystemAdmin
              captures: { rep_a: $.data.id }
            - call: "POST /cvso/representatives/${rep_a}/accreditation"
              payload: { action: "ACTIVATE" }
              as: SystemAdmin
            - call: "POST /cvso/veterans"
              payload: { full_name: "Alex Rivera", date_of_birth: "1979-03-04", service_start_date: "2001-09-11", service_end_date: "2005-09-10", household_income_cents: 1500000, net_worth_cents: 2000000, dependent_count: 2, homeless_status: "NOT_HOMELESS", referral_source: "WALK_IN" }
              as: IntakeClerk
              captures: { vet_a: $.data.id }
            - call: "POST /cvso/veterans"
              payload: { full_name: "Priya Nolan", date_of_birth: "1981-06-06", service_start_date: "2002-01-01", service_end_date: "2006-01-01", household_income_cents: 1200000, net_worth_cents: 1000000, dependent_count: 1, homeless_status: "NOT_HOMELESS", referral_source: "STATE_HOTLINE" }
              as: IntakeClerk
              captures: { vet_b: $.data.id }
            - call: "POST /cvso/veterans/${vet_a}/discharge-documents"
              payload: { document_type: "DD214", source: "VETERAN_PROVIDED", claimed_service_start: "2001-09-11", claimed_service_end: "2005-09-10", claimed_character_of_service: "HONORABLE" }
              as: IntakeClerk
              captures: { doc_a: $.data.id }
            - call: "POST /cvso/discharge-documents/${doc_a}/review"
              payload: { action: "VERIFY" }
              as: CountyOfficer
              as_user_id: "${rep_a}"
            - call: "POST /cvso/powers-of-attorney"
              payload: { veteran_id: "${vet_a}", representative_id: "${rep_a}", form_type: "VA_21_22", scope: "ALL_BENEFITS", executed_on: "2026-08-01" }
              as: IntakeClerk
              captures: { poa_a: $.data.id }
            - call: "GET /cvso/veterans/${vet_a}"
              payload: {}
              as: IntakeClerk
              captures: { vet_a_v: $.data.version }
          trigger:
            - call: "POST /cvso/powers-of-attorney/${poa_a}/accept"
              payload: { expected_veteran_version: "${vet_a_v}" }
              as: CountyOfficer
              as_user_id: "${rep_a}"
              captures: { e_role: $.data.error_id }
            - call: "POST /cvso/powers-of-attorney/${poa_a}/accept"
              payload: { expected_veteran_version: "${vet_a_v}" }
              as: VeteranClient
              as_user_id: "${vet_b}"
              captures: { e_owner: $.data.error_id }
            - call: "POST /cvso/powers-of-attorney/${poa_a}/accept"
              payload: { expected_veteran_version: "${vet_a_v}" }
              as: VeteranClient
              as_user_id: "${vet_a}"
              captures: { pstatus: $.data.status }
          assert:
            - "${e_role} == ERR_UNAUTHORIZED"
            - "${e_owner} == ERR_ACTOR_NOT_OWNER"
            - "HTTP status of both refusals == 403"
            - "PowerOfAttorney.${poa_a}.status == OFFERED immediately after each refusal"
            - "${pstatus} == ACTIVE"
            - "Representative.${rep_a}.active_poa_count == 1"

      - name: corner_same_representative_cannot_prepare_and_peer_review_one_claim
        claim_type: role_model
        grounds:
          - complexity_profile.role_model
          - roles.CountyOfficer
          - validations[priority=50]
        distinguishing_aspect: "The segregation-of-duties role model must block one representative id from occupying both the preparer and the peer-reviewer slot of the same claim."
        excluded_because:
          difficulty_instance: submit_for_review_naming_preparer_who_is_also_designee_returns_segregation_of_duties
          rationale: "That instance is exactly the segregation probe for the entity_backed CountyOfficer identity - the same representative id is both prepared_by_representative_id and the nominated reviewer - and it additionally pins which of the two competing codes is returned, so a separate role-model test would be a strict subset."

  # ===================================================================
  # Cross-cutting complexity layers declared in complexity_profile:
  # cascading_side_effects, dual_variant_calculation,
  # optimistic_concurrency, rate_threshold_triggers, selector_policy.
  # The selector_policy layer has no row in the claim-extraction guide;
  # its claims live in the calculations section above and in
  # corner_automatic_assignment_with_an_empty_candidate_set_is_refused.
  # ===================================================================
  - section: cross-cutting complexity layers
    instances:
      - name: corner_both_optimistic_concurrency_rules_reject_a_superseded_read
        claim_type: optimistic_concurrency
        grounds:
          - concurrency_rules[poa-accept-stale-veteran]
          - concurrency_rules[benefit-application-stale-program]
          - errors[ERR_STALE_VETERAN_VERSION]
          - errors[ERR_STALE_PROGRAM_VERSION]
          - complexity_profile.complexity_layers
        distinguishing_aspect: "Each declared §1.2.1 rule guards its own write with its own code at HTTP 412: a designation acceptance carrying a veteran version that a later PATCH has superseded returns ERR_STALE_VETERAN_VERSION, an application create carrying a program version that a later PATCH has superseded returns ERR_STALE_PROGRAM_VERSION, and both succeed when the caller re-reads the parent first - proving version advances by exactly one on every write."
        test_recipe:
          setup:
            - "Clock 2026-08-01T00:00:00Z."
            - "rep_a ACTIVE COUNTY_CVSO."
            - "StateProgram prog PTX-2026-G, fiscal_year 2026, min_rating_pct 0, requires_wartime false, annual_pool_cents 100000000, max_award_cents 10000000, read once as prog_v0."
            - "Veteran vet with a VERIFIED HONORABLE DD214, one screen and an OFFERED designation poa; the veteran row is read once as vet_v0 before the interfering PATCH."
          setup_api_calls:
            - call: "POST /cvso/_clock/set_current_utc"
              payload: { current_utc: "2026-08-01T00:00:00Z" }
              as: SystemAdmin
            - call: "POST /cvso/representatives"
              payload: { full_name: "Dana Reyes", accreditation_number: "ACC-2849-821", accreditation_type: "COUNTY_CVSO", accreditation_expires_on: "2029-12-31" }
              as: SystemAdmin
              captures: { rep_a: $.data.id }
            - call: "POST /cvso/representatives/${rep_a}/accreditation"
              payload: { action: "ACTIVATE" }
              as: SystemAdmin
            - call: "POST /cvso/state-programs"
              payload: { program_code: "PTX-2026-G", program_name: "County Property Tax Exemption", program_type: "PROPERTY_TAX_EXEMPTION", fiscal_year: 2026, annual_pool_cents: 100000000, min_rating_pct: 0, requires_wartime: false, max_award_cents: 10000000 }
              as: SystemAdmin
              captures: { prog: $.data.id, prog_created_version: $.data.version }
            - call: "GET /cvso/state-programs/${prog}"
              payload: {}
              as: SystemAdmin
              captures: { prog_v0: $.data.version }
            - call: "POST /cvso/veterans"
              payload: { full_name: "Alex Rivera", date_of_birth: "1979-03-04", service_start_date: "2001-09-11", service_end_date: "2005-09-10", household_income_cents: 1500000, net_worth_cents: 2000000, dependent_count: 2, homeless_status: "NOT_HOMELESS", referral_source: "WALK_IN" }
              as: IntakeClerk
              captures: { vet: $.data.id }
            - call: "POST /cvso/veterans/${vet}/discharge-documents"
              payload: { document_type: "DD214", source: "VETERAN_PROVIDED", claimed_service_start: "2001-09-11", claimed_service_end: "2005-09-10", claimed_character_of_service: "HONORABLE" }
              as: IntakeClerk
              captures: { doc: $.data.id }
            - call: "POST /cvso/discharge-documents/${doc}/review"
              payload: { action: "VERIFY" }
              as: CountyOfficer
              as_user_id: "${rep_a}"
            - call: "POST /cvso/veterans/${vet}/screen"
              payload: {}
              as: CountyOfficer
              as_user_id: "${rep_a}"
            - call: "POST /cvso/powers-of-attorney"
              payload: { veteran_id: "${vet}", representative_id: "${rep_a}", form_type: "VA_21_22", scope: "ALL_BENEFITS", executed_on: "2026-08-01" }
              as: IntakeClerk
              captures: { poa: $.data.id }
            - call: "GET /cvso/veterans/${vet}"
              payload: {}
              as: IntakeClerk
              captures: { vet_v0: $.data.version }
            - call: "PATCH /cvso/veterans/${vet}"
              payload: { referral_source: "SHELTER_REFERRAL" }
              as: IntakeClerk
              captures: { vet_v1: $.data.version }
            - call: "PATCH /cvso/state-programs/${prog}"
              payload: { program_name: "County Property Tax Exemption (renamed)" }
              as: SystemAdmin
              captures: { prog_v1: $.data.version }
          trigger:
            - call: "POST /cvso/powers-of-attorney/${poa}/accept"
              payload: { expected_veteran_version: "${vet_v0}" }
              as: VeteranClient
              as_user_id: "${vet}"
              captures: { e_vet: $.data.error_id }
            - call: "POST /cvso/powers-of-attorney/${poa}/accept"
              payload: { expected_veteran_version: "${vet_v1}" }
              as: VeteranClient
              as_user_id: "${vet}"
              captures: { pstatus: $.data.status }
            - call: "POST /cvso/state-benefit-applications"
              payload: { veteran_id: "${vet}", program_id: "${prog}", fiscal_year: 2026, expected_program_version: "${prog_v0}", assessed_property_value_cents: 8500000 }
              as: IntakeClerk
              captures: { e_prog: $.data.error_id }
            - call: "POST /cvso/state-benefit-applications"
              payload: { veteran_id: "${vet}", program_id: "${prog}", fiscal_year: 2026, expected_program_version: "${prog_v1}", assessed_property_value_cents: 8500000 }
              as: IntakeClerk
              captures: { app: $.data.id, dstatus: $.data.determination_status }
          assert:
            - "${vet_v1} == ${vet_v0} + 1"
            - "${prog_v1} == ${prog_v0} + 1"
            - "${prog_created_version} == ${prog_v0}"
            - "${e_vet} == ERR_STALE_VETERAN_VERSION"
            - "HTTP status of the stale accept == 412"
            - "PowerOfAttorney.${poa}.status == OFFERED immediately after the stale accept and Veteran.${vet}.version is still ${vet_v1}"
            - "${pstatus} == ACTIVE"
            - "${e_prog} == ERR_STALE_PROGRAM_VERSION"
            - "HTTP status of the stale create == 412"
            - "zero StateBenefitApplication rows exist immediately after the stale create and StateProgram.${prog}.version is still ${prog_v1}"
            - "${dstatus} == SUBMITTED"
            - "exactly one StateBenefitApplication row exists at the end and its id is ${app}"

      - name: corner_cascading_side_effects_run_the_full_declared_chain
        claim_type: cascading_side_effects
        grounds:
          - complexity_profile.complexity_layers
          - state_machines.Representative
        distinguishing_aspect: "A multi-level side-effect chain must be verified end to end rather than one hop at a time, with every intermediate entity and every derived counter reconciled after the single triggering call."
        excluded_because:
          difficulty_instance: accreditation_revocation_cascades_through_poa_claim_appointment_to_site_ledger
          rationale: "That instance drives one REVOKE and then asserts the state of every entity on the declared four-hop chain - PowerOfAttorney, Claim, ExamAppointment and the ExamSite slot ledger - plus the untouched control rows that the conditional hops must skip, which is the full end-to-end verification this layer asks for."

      - name: corner_dual_variant_calculation_produces_two_different_results
        claim_type: dual_variant_calculation
        grounds:
          - complexity_profile.complexity_layers
          - calculations.claim_retro_award_cents
        distinguishing_aspect: "The two declared variants of a dual-variant calculation must produce different results on identical data, with the delta pinned to a code-computed literal."
        excluded_because:
          difficulty_instance: retro_award_itf_anchored_versus_filed_anchored_divergence
          rationale: "That instance runs both the intent-to-file-anchored and the filing-anchored variant over one identical claim and asserts each result and their exact delta in cents, which is precisely this layer's both-variants-plus-delta claim."

      - name: corner_cumulative_threshold_is_tested_at_its_boundary
        claim_type: rate_threshold_triggers
        grounds:
          - complexity_profile.complexity_layers
          - calculations.program_pool_ledger
          - validations[priority=76]
        distinguishing_aspect: "A cumulative ceiling must admit the write that lands exactly on the limit and refuse the next one, and the counter must return to a reusable value after a reversal."
        excluded_because:
          difficulty_instance: approval_filling_program_pool_to_the_cent_succeeds_while_one_cent_short_is_rejected
          rationale: "That instance approves the award that fills annual_pool_cents to the exact cent and refuses the following one-cent overflow, covering the inclusive cumulative boundary; the reset half of the layer is covered by clawback_returns_program_allocation_to_zero_so_the_next_approval_allocates_exactly_its_own_award, which drives allocated_cents back to zero and re-allocates against the freed pool."

  # ===================================================================
  # Consistency model: complexity_profile.consistency_model is immediate.
  # ===================================================================
  - section: consistency model
    instances:
      - name: corner_every_derived_field_is_current_in_the_writing_response
        claim_type: immediate
        grounds:
          - complexity_profile.consistency_model
          - response_envelope
          - endpoints[POST /cvso/discharge-documents/{id}/review]
          - endpoints[POST /cvso/powers-of-attorney/{id}/accept]
          - endpoints[GET /cvso/representatives/{id}/caseload]
        distinguishing_aspect: "Under the immediate consistency model no derived value lags a write: the VERIFY response already carries verified_at and verified_by_representative_id, the veteran read taken straight afterwards already shows discharge_doc_status VERIFIED with the recomputed wartime_service_days 1461, and the caseload read taken straight after the acceptance already reports active_poa_count 1 and caseload_weight 1.0 with no second write in between."
        test_recipe:
          setup:
            - "Clock 2026-08-01T00:00:00Z."
            - "rep_a ACTIVE COUNTY_CVSO with an empty caseload."
            - "Veteran vet served 2001-09-11 to 2005-09-10 with a PENDING_VERIFICATION DD214 and an OFFERED designation poa."
          setup_api_calls:
            - call: "POST /cvso/_clock/set_current_utc"
              payload: { current_utc: "2026-08-01T00:00:00Z" }
              as: SystemAdmin
            - call: "POST /cvso/representatives"
              payload: { full_name: "Dana Reyes", accreditation_number: "ACC-2849-831", accreditation_type: "COUNTY_CVSO", accreditation_expires_on: "2029-12-31" }
              as: SystemAdmin
              captures: { rep_a: $.data.id }
            - call: "POST /cvso/representatives/${rep_a}/accreditation"
              payload: { action: "ACTIVATE" }
              as: SystemAdmin
            - call: "GET /cvso/representatives/${rep_a}/caseload"
              payload: {}
              as: SystemAdmin
              captures: { weight_before: $.data.caseload_weight, poa_before: $.data.active_poa_count }
            - call: "POST /cvso/veterans"
              payload: { full_name: "Alex Rivera", date_of_birth: "1979-03-04", service_start_date: "2001-09-11", service_end_date: "2005-09-10", household_income_cents: 1500000, net_worth_cents: 2000000, dependent_count: 2, homeless_status: "NOT_HOMELESS", referral_source: "WALK_IN" }
              as: IntakeClerk
              captures: { vet: $.data.id, wartime_before: $.data.wartime_service_days }
            - call: "POST /cvso/veterans/${vet}/discharge-documents"
              payload: { document_type: "DD214", source: "VETERAN_PROVIDED", claimed_service_start: "2001-09-11", claimed_service_end: "2005-09-10", claimed_character_of_service: "HONORABLE" }
              as: IntakeClerk
              captures: { doc: $.data.id }
            - call: "POST /cvso/powers-of-attorney"
              payload: { veteran_id: "${vet}", representative_id: "${rep_a}", form_type: "VA_21_22", scope: "ALL_BENEFITS", executed_on: "2026-08-01" }
              as: IntakeClerk
              captures: { poa: $.data.id }
          trigger:
            - call: "POST /cvso/discharge-documents/${doc}/review"
              payload: { action: "VERIFY" }
              as: CountyOfficer
              as_user_id: "${rep_a}"
              captures: { vstatus: $.data.verification_status, verified_at: $.data.verified_at, verifier: $.data.verified_by_representative_id }
            - call: "GET /cvso/veterans/${vet}"
              payload: {}
              as: IntakeClerk
              captures: { doc_status: $.data.discharge_doc_status, wartime_after: $.data.wartime_service_days, character: $.data.character_of_service, vet_v: $.data.version }
            - call: "POST /cvso/powers-of-attorney/${poa}/accept"
              payload: { expected_veteran_version: "${vet_v}" }
              as: VeteranClient
              as_user_id: "${vet}"
              captures: { pstatus: $.data.status, accepted_at: $.data.accepted_at }
            - call: "GET /cvso/representatives/${rep_a}/caseload"
              payload: {}
              as: SystemAdmin
              captures: { poa_after: $.data.active_poa_count, weight_after: $.data.caseload_weight, eligible: $.data.assignment_eligible }
          assert:
            - "${wartime_before} == 0"
            - "${poa_before} == 0"
            - "${weight_before} == 0.0"
            - "${vstatus} == VERIFIED"
            - "${verified_at} == 2026-08-01T00:00:00.000Z"
            - "${verifier} == ${rep_a}"
            - "${doc_status} == VERIFIED"
            - "${character} == HONORABLE"
            - "${wartime_after} == 1461"
            - "${pstatus} == ACTIVE"
            - "${accepted_at} == 2026-08-01T00:00:00.000Z"
            - "${poa_after} == 1"
            - "${weight_after} == 1.0"
            - "${eligible} == true"
