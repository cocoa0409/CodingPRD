            - call: "POST /price-integrity/associates/${sm1}/training-completions"
              payload: { module_code: "LABEL_101", score_pct: 95 }
              as: PricingAdmin
            - call: "POST /price-integrity/stores/${store_a}/associates"
              payload: { employee_number: "E-LA1", full_name: "Lee Label", role_code: "LABEL_ASSOCIATE" }
              as: PricingAdmin
              captures: { la1: $.data.id }
            - call: "POST /price-integrity/associates/${la1}/training-completions"
              payload: { module_code: "LABEL_101", score_pct: 95 }
              as: PricingAdmin
              captures: { st_cert: $.data.training_status, score_clean: $.data.accountability_score }
          trigger:
            - call: "POST /price-integrity/associates/${la1}/accountability-actions"
              payload: { trigger_code: "VERIFICATION_REJECTED", action_type: "COACHING" }
              as: StoreManager
              as_user_id: "${sm1}"
              captures: { act_1: $.data.id, w1: $.data.score_weight, iss_by: $.data.issued_by_ref }
            - call: "GET /price-integrity/associates/${la1}"
              as: StoreManager
              as_user_id: "${sm1}"
              captures: { score_occ: $.data.accountability_score, st_occ: $.data.training_status }
            - call: "PATCH /price-integrity/jurisdictions/${jur_a}"
              payload: { accountability_variant: "TASK_WEIGHTED" }
              as: PricingAdmin
            - call: "GET /price-integrity/associates/${la1}"
              as: StoreManager
              as_user_id: "${sm1}"
              captures: { score_after_patch: $.data.accountability_score, st_after_patch: $.data.training_status }
            - call: "POST /price-integrity/associates/${la1}/accountability-actions"
              payload: { trigger_code: "OVERDUE_LABEL_TASK", action_type: "RETRAINING_ASSIGNED" }
              as: StoreManager
              as_user_id: "${sm1}"
              captures: { act_2: $.data.id, w2: $.data.score_weight }
            - call: "GET /price-integrity/associates/${la1}"
              as: StoreManager
              as_user_id: "${sm1}"
              captures: { score_task: $.data.accountability_score, st_task: $.data.training_status, iac: $.data.issued_action_count, vpc: $.data.verified_placement_count }
            - call: "POST /price-integrity/associates/${la1}/accountability-actions"
              payload: { trigger_code: "AUDIT_FAIL", action_type: "COACHING" }
              as: StoreManager
              as_user_id: "${sm1}"
              captures: { err_susp: $.data.error_id }
          assert:
            - "${st_cert} == CERTIFIED, ${score_clean} == 100 and ${iss_by} == ${sm1} (the issuing manager's X-User-ID, not 'system')"
            - "${w1} == 5 (ACTION_WEIGHTS.COACHING) and ${score_occ} == 95 == max(0, 100 - 5) under OCCURRENCE_WEIGHTED, ${st_occ} == CERTIFIED"
            - "${score_after_patch} == 95 and ${st_after_patch} == CERTIFIED — the PATCH re-derived signage and posture only, so the score is stale by design until a scoring trigger fires"
            - "${w2} == 10 (ACTION_WEIGHTS.RETRAINING_ASSIGNED); the second action is a scoring trigger, so the score is now re-derived under TASK_WEIGHTED"
            - "${score_task} == 0.00 == max(0, ROUND_HALF_UP(100 - 15 * 40 / (0 + 4), 2)) — the raw value is -50, and the floor clamps it to 0.00 rather than storing a negative"
            - "${st_task} == SUSPENDED because 0.00 < SUSPENSION_SCORE_FLOOR 80, ${iac} == 2 and ${vpc} == 0"
            - "Issuing a third action against the now-SUSPENDED associate: HTTP 409 with ${err_susp} == ERR_ASSOCIATE_INVALID_STATE, and GET /price-integrity/associates/${la1}/accountability-actions still returns total_count 2"

      - name: corner_audit_failure_action_waterfall_picks_the_first_matching_branch
        claim_type: waterfall_allocation
        grounds:
          - calculations.audit_failure_action_type
          - calculations.associate_accountability_score.constants.SUSPENSION_SCORE_FLOOR
          - state_machines.Associate.CERTIFIED_to_SUSPENDED
        distinguishing_aspect: "The action-type waterfall is order-sensitive and single-candidate: with threshold 20.0 a 25.00 failure yields COACHING, a 50.00 failure yields WRITTEN_WARNING (25.00 < 40.0 <= 50.00), any later failure escalates straight to SUSPENSION because an ISSUED WRITTEN_WARNING exists, and a failure on an unassigned aisle creates no action at all while still closing FAIL."
