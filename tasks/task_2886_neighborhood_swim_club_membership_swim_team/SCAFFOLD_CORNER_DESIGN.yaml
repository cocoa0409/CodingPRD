            - "${err_slots} == ERR_VOLUNTEER_SLOTS_FULL with HTTP 409, because 2 + JOB_CREDIT_VALUES[TIMER] 1 == 3 > 2 - a headcount check (1 of 2 bodies) would have accepted it"
