    distinguishing_aspect: 'Pair: CDIQuery -> CDIReview (different pair from review->case).

      Query DRAFT -> SENT is guarded by parent review being ACTIVE;

      if the review is ON_HOLD, send fails with ERR_REVIEW_NOT_ACTIVE.

      '
    test_recipe:
