            - "Iris reviewing her own assessment returns HTTP 422 with data.error_id == \"ERR_SEGREGATION_OF_DUTIES\" — a different status and code from the role-borrowing refusal"
            - "Iris reviewing Dana's assessment returns HTTP 200 with data.status == \"ACCEPTED\" and a non-null comprehensive_acuity"
