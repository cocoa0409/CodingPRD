  # ===========================================================================
  - rule_id: compensating_invariant
    instances:
      - name: late_fee_waive_conserves_late_fee_balance
        grounds:
          - state_machines.Installment.SCHEDULED_to_OVERDUE
          - state_machines.LateFee
          - entities.Enrollment.fields.late_fee_balance_cents
          - calculations.late_fee_assessment
        distinguishing_aspect: |
          Conserved quantity = Enrollment.late_fee_balance_cents. Assessing a late
          fee (3200) then waiving it returns late_fee_balance_cents exactly to its
          pre-assessment value (0); the forward action (ASSESS) and its
          compensator (WAIVE) leave the named fee-balance quantity unchanged,
          pinned as late_fee_balance_cents == sum(LateFee.amount_cents WHERE
          status==ASSESSED).
        test_recipe:
          setup:
            - "Institution INST_Q clock 2026-09-15; Term FALL2026; Student S17; Template 4PAY; Enrollment ACTIVE charges 500000 aid 100000; down 80000 SETTLED; clock 2026-10-07 -> installment 1 OVERDUE, LateFee 3200 ASSESSED."
          setup_api_calls:
            - call: "POST /institutions"
              payload: { name: "Inst Q", currency: "USD", refund_policy: "DATE_BASED" }
              as: Registrar
              captures: { inst_q: $.data.id }
            - call: "POST /institutions/${inst_q}/_clock/set_current_utc"
              payload: { to_iso8601: "2026-09-15T00:00:00.000Z" }
