              as: PlatformAdmin
            - call: "POST /programs"
              payload: { org_id: "${org_b}", name: "Harbor Transitional Housing", service_category: "HOUSING", county_code: "CO-303", annual_expense_cents: 12000000, clients_served: 60 }
              as: PlatformAdmin
