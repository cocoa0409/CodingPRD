            - { call: "POST /sub-publishing-agreements", payload: { sub_publisher_id: "${sp}", territory_codes: ["DE"], income_types: ["PERFORMANCE"], retention_bp: 2000, effective_from: "2026-01-01T00:00:00Z", effective_to: "2027-01-01T00:00:00Z" }, as: PublisherAdmin, captures: { aga: $.data.id } }
            - { call: "POST /sub-publishing-agreements/${aga}/activate", payload: {}, as: PublisherAdmin }
            - { call: "POST /sub-publishing-agreements", payload: { sub_publisher_id: "${sp}", territory_codes: ["DE"], income_types: ["PERFORMANCE"], retention_bp: 2000, effective_from: "2026-06-01T00:00:00Z", effective_to: "2027-06-01T00:00:00Z" }, as: PublisherAdmin, captures: { agb: $.data.id } }
            - { call: "POST /sub-publishers/${sp}/suspend", payload: {}, as: PublisherAdmin }
          trigger:
            - { call: "POST /sub-publishing-agreements/${agb}/activate", payload: {}, as: PublisherAdmin, captures: { err: $.data.error_id } }
          assert:
            - "${err} == ERR_SUB_PUBLISHER_NOT_ACTIVE (referential P7 beats temporal P8 although coverage overlaps agreement A)"

