          setup:
            - "Clock 08:00; spot open 08:00-18:00; meetup MT1 confirmed at 14:00-15:00."
            - "A second confirmed meetup MT2 at same spot 14:30-15:30 would collide, but the trigger re-confirms MT1 (already CONFIRMED)."
