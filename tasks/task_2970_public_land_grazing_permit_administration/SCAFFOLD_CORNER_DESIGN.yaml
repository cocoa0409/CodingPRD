            - call: "GET /pastures"
              payload: { limit: 1, offset: 2 }
              as: RangeSpecialist
              as_user_id: "u_spec_1"
            - call: "GET /permittees/${c_m58_id}/base-properties"
              payload: {}
              as: AuthorizedOfficer
