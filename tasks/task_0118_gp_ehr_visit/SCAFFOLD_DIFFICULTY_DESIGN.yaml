scaffold_difficulty_design:

  # ---------------------------------------------------------------------------
  # Rule 1 — Dual-variant calculations across different entity domains
  # ---------------------------------------------------------------------------
  - rule_id: dual_variant_calc
    instances:
      - name: cpt_billing_charge_vs_allowed_on_encounter
        grounds:
          - calculations.cpt_billing_charge
          - calculations.cpt_billing_allowed
          - entities.CptLineItem.fields.list_charge_cents
          - entities.CptLineItem.fields.allowed_amount_cents
          - state_machines.Encounter.CHECKED_IN_to_COMPLETED
        distinguishing_aspect: |
          Both calculations operate on the Encounter billing domain (CptLineItem) but produce
          structurally different totals from identical inputs: cpt_billing_charge multiplies
          list_price_cents * units with NO modifier and NO tier scaling, while cpt_billing_allowed
          multiplies allowed_price_cents * units * modifier, sums per-line rounded values, applies
          a volume-tier factor, and apportions residual cents — so list_charge_cents and
          allowed_amount_cents are guaranteed to differ when any modifier or tier kicks in.
        test_recipe:
          setup:
            - "Create Patient P1, Provider PR1 (role PCP_ONLY), bind P1 to PR1"
            - "Create CPT 99213 (list=12000, allowed=8000) and CPT 90471 (list=3000, allowed=2000)"
            - "Schedule and check-in Encounter E1 (CONSULTATION) on P1 with PR1"
          trigger:
            - "POST /encounters/E1/cpt-line-items { cpt_code: '99213', units: 1, modifier: '25' }"
            - "POST /encounters/E1/cpt-line-items { cpt_code: '90471', units: 2 }"
            - "POST /encounters/E1/complete"
          assert:
            - "CptLineItem(99213).list_charge_cents == 12000 (cpt_billing_charge: 12000*1)"
            - "CptLineItem(90471).list_charge_cents == 6000 (cpt_billing_charge: 3000*2)"
            - "CptLineItem(99213).allowed_amount_cents == 10000 (8000*1*1.25 = 10000, tier1 factor 1.00)"
            - "CptLineItem(90471).allowed_amount_cents == 4000 (2000*2*1.00 = 4000)"
            - "Sum of list_charge_cents (18000) != sum of allowed_amount_cents (14000) — two valid variants from identical inputs"

      - name: hedis_provisional_ytd_vs_final_year_end_on_patient
        grounds:
          - calculations.hedis_measure_eval
          - calculations.hedis_measure_eval.variants
          - entities.HedisMeasurement.fields.in_numerator
          - entities.Patient.fields.smoking_status
          - entities.Patient.fields.status
          - endpoints.GET_/hedis/measurements/{patient_id}/{year}
          - endpoints.POST_/hedis/recompute
        distinguishing_aspect: |
          On the Patient entity domain (HEDIS quality measurement), provisional_year_to_date reads
          smoking_status and Patient.status as of now() while final_year_end pins both to Dec 31;
          the two variants therefore produce different TSC in_numerator booleans for the same
          patient when smoking_status flips after the YTD call but before the final freeze.
        test_recipe:
          setup:
            - "POST /_clock/advance to 2026-11-15T12:00:00Z"
            - "Patient P (age 40, smoking_status=CURRENT, ACTIVE), Provider PR (PCP), binding done"
            - "One COMPLETED CONSULTATION encounter in 2026 with cpt 99213 (no 99406/99407)"
          trigger:
            - "GET /hedis/measurements/P/2026?as_of=YTD -> capture in_numerator_provisional for TSC"
            - "PATCH /patients/P { smoking_status: 'FORMER' }"
            - "POST /_clock/advance to 2027-01-02T00:00:00Z"
            - "POST /hedis/recompute { year: 2026, patient_ids: [P] }"
            - "GET /hedis/measurements/P/2026 -> capture in_numerator_final for TSC"
          assert:
            - "in_numerator_provisional == false (CURRENT smoker AND no 99406/99407 cpt -> TSC fails numerator)"
            - "in_numerator_final == true (smoking_status pinned to Dec 31 reads FORMER -> TSC passes numerator)"
            - "Same patient, same year, different boolean outcomes from the two variants"

  # ---------------------------------------------------------------------------
  # Rule 2 — Combinatorial formulas across different modes
  # ---------------------------------------------------------------------------
  - rule_id: combinatorial_formula
    instances:
      - name: cpt_billing_allowed_round_per_line_then_apportion
        grounds:
          - calculations.cpt_billing_allowed
          - calculations.cpt_billing_allowed.formula
          - entities.CptLineItem.fields.allowed_amount_cents
        distinguishing_aspect: |
          Mode (b) — nested rounding where order matters. Formula MUST round per-line modifier
          products BEFORE summing, then round the tier-adjusted apportionment AFTER summing;
          residual cents from the apportionment are assigned to the line with the greatest
          per_line_cents (lex-smallest id tie-break). Doing 'sum then round' instead would
          produce different per-line cents for the same inputs.
        test_recipe:
          setup:
            - "Patient P, Provider PR (PCP), encounter E1 CHECKED_IN"
            - "CPT A (allowed=33334, list>=allowed), CPT B (allowed=33333), CPT C (allowed=33335)"
          trigger:
            - "POST /encounters/E1/cpt-line-items { cpt_code: A, units: 1 }"
            - "POST /encounters/E1/cpt-line-items { cpt_code: B, units: 1 }"
            - "POST /encounters/E1/cpt-line-items { cpt_code: C, units: 1 }"
            - "POST /encounters/E1/complete"
          assert:
            - "Line A.allowed_amount_cents == 31667 (round_half_up(33334*0.95))"
            - "Line B.allowed_amount_cents == 31666 (round_half_up(33333*0.95))"
            - "Line C.allowed_amount_cents == 31669 (round_half_up(33335*0.95)=31668, +1 residual since C has greatest per_line_cents)"
            - "Sum of allowed_amount_cents == 95002 == round_half_up(99999*0.95)+1 == adjusted_total"

      - name: prescription_expiry_tiered_branching_three_inputs
        grounds:
          - calculations.prescription_expiry
          - entities.Prescription.fields.is_controlled
          - entities.Prescription.fields.dea_schedule
          - entities.Prescription.fields.refills_authorized
          - state_machines.Prescription.DRAFT_to_SIGNED
        distinguishing_aspect: |
          Mode (a) — formula with three inputs (is_controlled, dea_schedule, signed_at) and
          non-linear conditional branching that selects between {365, 180, 30} day windows.
          Distinct from billing mode (b) because evaluation is tier-selection over enums, not
          a rounding-order question. Pin: signed_at + 30d for II, +180d for III–V, +365d
          otherwise; refills_authorized MUST be 0 on schedule II at SIGN time.
        test_recipe:
          setup:
            - "POST /_clock/advance to 2026-05-16T10:00:00Z"
            - "Provider PR (epcs_enrolled=true, dea_number set), Patient P, Encounter E1 CHECKED_IN"
            - "Three prescriptions on P/E1: RX_NC (is_controlled=false, refills=2), RX_4 (is_controlled=true, dea_schedule=IV, refills=2), RX_2 (is_controlled=true, dea_schedule=II, refills=0)"
          trigger:
            - "POST /prescriptions/RX_NC/sign { epcs_two_factor_token: null }"
            - "POST /prescriptions/RX_4/sign { epcs_two_factor_token: '123456' }"
            - "POST /prescriptions/RX_2/sign { epcs_two_factor_token: '654321' }"
          assert:
            - "RX_NC.expires_at == '2027-05-16T10:00:00Z' (signed_at + 365d)"
            - "RX_4.expires_at == '2026-11-12T10:00:00Z' (signed_at + 180d)"
            - "RX_2.expires_at == '2026-06-15T10:00:00Z' (signed_at + 30d)"
            - "Attempting RX_2 with refills_authorized=1 returns ERR_SCHEDULE_II_NO_REFILLS (422)"

  # ---------------------------------------------------------------------------
  # Rule 3 — Non-linear state-machine shape on different entities
  # ---------------------------------------------------------------------------
  - rule_id: non_linear_state_machine
    instances:
      - name: referral_cyclic_accepted_to_pending
        grounds:
          - state_machines.Referral
          - state_machines.Referral.ACCEPTED_to_PENDING
          - state_machines.Referral.PENDING_to_ACCEPTED
          - endpoints.POST_/referrals/{id}/return-to-pcp
        distinguishing_aspect: |
          The Referral state machine contains a true cycle PENDING -> ACCEPTED -> PENDING via
          return-to-pcp; expires_at does NOT extend on the return, so the same referral can
          loop until expiry. This is structurally different from any linear pipeline.
        test_recipe:
          setup:
            - "POST /_clock/advance to 2026-05-16T10:00:00Z"
            - "Patient P bound to PCP PR1, Specialist PR2 (BOTH)"
            - "Encounter E1 COMPLETED on PR1; create Referral R (priority=ROUTINE) on E1 to PR2"
          trigger:
            - "POST /referrals/R/accept (as PR2)"
            - "POST /referrals/R/return-to-pcp (as PR2)"
            - "POST /referrals/R/accept (as PR2)"
          assert:
            - "After step 1: Referral.status == ACCEPTED"
            - "After step 2: Referral.status == PENDING; expires_at unchanged from initial creation"
            - "After step 3: Referral.status == ACCEPTED; same id, version incremented"

      - name: portal_message_parallel_status_and_triage_dimensions
        grounds:
          - state_machines.PortalMessage
          - entities.PortalMessage.fields.status
          - entities.PortalMessage.fields.triage_status
          - endpoints.POST_/portal-messages/{id}/mark-read
          - endpoints.POST_/portal-messages/{id}/triage
        distinguishing_aspect: |
          PortalMessage has two parallel state dimensions on the same row — status
          (UNREAD/READ/ARCHIVED) and triage_status (NEW/TRIAGED/ESCALATED) — that evolve
          independently via different endpoints. mark-read does not touch triage_status,
          triage does not touch status. Different entity from Referral.
        test_recipe:
          setup:
            - "Patient P (portal_enabled=true), bound PCP PR1, Nurse N"
            - "PatientPortalUser P sends a PortalMessage M (sender_role=PATIENT) to PR1"
          trigger:
            - "POST /portal-messages/M/triage (as N) — triage_status dimension only"
            - "POST /portal-messages/M/mark-read (as PR1) — status dimension only"
          assert:
            - "After triage: status == UNREAD AND triage_status == TRIAGED"
            - "After mark-read: status == READ AND triage_status == TRIAGED (dimensions independent)"

  # ---------------------------------------------------------------------------
  # Rule 4 — Transitive cascade chains from different triggers
  # ---------------------------------------------------------------------------
  - rule_id: transitive_cascade
    instances:
      - name: encounter_complete_to_cpt_allowed_to_hedis_snapshot
        grounds:
          - state_machines.Encounter.CHECKED_IN_to_COMPLETED
          - calculations.cpt_billing_allowed
          - calculations.hedis_measure_eval
          - entities.CptLineItem.fields.allowed_amount_cents
          - entities.CptLineItem.fields.is_preventive
          - entities.HedisMeasurement.fields.in_numerator
        distinguishing_aspect: |
          Three-hop cascade depth=3 originating from POST /encounters/{id}/complete:
          (1) the COMPLETE transition mutates Encounter; (2) THAT mutation triggers
          cpt_billing_allowed which writes allowed_amount_cents AND is_preventive on each
          CptLineItem (mutation of B caused by A); (3) the is_preventive snapshot on
          CptLineItem in turn drives the AWV numerator on HedisMeasurement (mutation of C
          caused by B, not by A directly). Each link is caused by the previous link.
        test_recipe:
          setup:
            - "POST /_clock/advance to 2026-06-15T10:00:00Z"
            - "Patient P (age 30, ACTIVE, no chronic), PCP PR1 (bound)"
            - "CPT 99395 (preventive=true), CPT 99213 (preventive=false), both with valid prices"
            - "Encounter E1 (PHYSICAL) CHECKED_IN on P/PR1; vital_signs object populated"
            - "Add line items 99395 and 99213 to E1"
          trigger:
            - "POST /encounters/E1/complete"
          assert:
            - "Hop 1: Encounter.status == COMPLETED, actual_end set"
            - "Hop 2: CptLineItem(99395).allowed_amount_cents populated AND is_preventive==true"
            - "Hop 3: HedisMeasurement(P, AWV, 2026).in_numerator == true (denominator already true because patient age 30 ACTIVE)"
            - "Without the preventive line item on hop 2, the AWV numerator on hop 3 would be false — proving hop 3 was caused by hop 2, not by hop 1"

      - name: encounter_cancel_to_draft_prescription_cancel
        grounds:
          - state_machines.Encounter.CHECKED_IN_to_CANCELLED
          - state_machines.Prescription.DRAFT_to_CANCELLED
          - entities.Prescription.fields.status
        distinguishing_aspect: |
          Two-hop cascade depth=2 from a DIFFERENT triggering transition than the previous
          instance: POST /encounters/{id}/cancel mutates Encounter to CANCELLED, and that
          Encounter mutation in turn triggers cascade of every DRAFT Prescription linked to
          that encounter to CANCELLED (mutation of Prescription caused by the Encounter
          mutation, not by a direct cancel call on each Prescription).
        test_recipe:
          setup:
            - "Patient P, PCP PR1 bound, Encounter E1 CHECKED_IN with NO line items"
            - "Create two DRAFT prescriptions RX1 and RX2 on E1; leave one TRANSMITTED RX3 from a different encounter"
          trigger:
            - "POST /encounters/E1/cancel"
          assert:
            - "Hop 1: Encounter.status == CANCELLED"
            - "Hop 2: RX1.status == CANCELLED AND RX2.status == CANCELLED (cascade hit DRAFTs only)"
            - "RX3.status unchanged (different encounter, proves cascade is scoped via encounter_id link)"

  # ---------------------------------------------------------------------------
  # Rule 5 — Validation priority conflicts across different error-category pairs
  # ---------------------------------------------------------------------------
  - rule_id: priority_pair_validation_conflict
    instances:
      - name: state_vs_business_safety_on_prescription_sign
        grounds:
          - validations[priority=5]
          - validations[priority=6]
          - errors.ERR_INVALID_PRESCRIPTION_STATE
          - errors.ERR_EPCS_NOT_ENROLLED
        distinguishing_aspect: |
          Two simultaneous failures on POST /prescriptions/{id}/sign: state precondition
          (Prescription already SIGNED, not DRAFT) vs business_safety (signing provider
          not EPCS-enrolled). Priority 5 (state) MUST win over priority 6 (business_safety).
          Category pair: state vs business_safety.
        test_recipe:
          setup:
            - "Provider PR (epcs_enrolled=false, dea_number=null), Patient P, Encounter E1 CHECKED_IN"
            - "Create Prescription RX (is_controlled=true, dea_schedule=II, refills=0)"
            - "Force RX into SIGNED state through a separate SIGN call by a different provider (impossible — alternative: create RX, sign with another properly enrolled provider, then attempt re-sign with PR)"
            - "Simpler: create RX in DRAFT, sign it normally to SIGNED, then attempt to sign again as PR (who is not EPCS enrolled)"
          trigger:
            - "POST /prescriptions/RX/sign { epcs_two_factor_token: '111111' } as PR"
          assert:
            - "Response status == 409 (state check at priority 5 fires first)"
            - "Response body error_id == 'ERR_INVALID_PRESCRIPTION_STATE'"
            - "Response body error_id != 'ERR_EPCS_NOT_ENROLLED' even though that would also fail"

      - name: business_referential_vs_business_temporal_on_referral_create
        grounds:
          - validations[priority=10]
          - validations[priority=13]
          - errors.ERR_REFERRER_NOT_PCP
          - errors.ERR_PROVIDER_TIME_CONFLICT
        distinguishing_aspect: |
          A different error-category pair from the first instance — business_referential
          (priority 10, ERR_REFERRER_NOT_PCP because referring_provider_id != Patient.pcp_provider_id)
          fires before any temporal check (priority 13, ERR_PROVIDER_TIME_CONFLICT) when both
          would fail. Note this dual-failure exists on different endpoints semantically; we
          construct an analogous business_constraint vs business_temporal conflict on the
          /encounters create path: invalid time range (priority 12 ERR_INVALID_TIME_RANGE)
          MUST win over priority 13 ERR_PROVIDER_TIME_CONFLICT.
        test_recipe:
          setup:
            - "POST /_clock/advance to 2026-06-01T08:00:00Z"
            - "Patient P, Provider PR1 (PCP, bound to P)"
            - "Existing Encounter E0 for PR1 SCHEDULED 2026-06-01T10:00:00Z-10:30:00Z (non-terminal)"
          trigger:
            - "POST /patients/P/encounters { provider_id: PR1, encounter_type: CONSULTATION, scheduled_start: '2026-06-01T10:00:00Z', scheduled_end: '2026-06-01T10:00:00Z' }"
          assert:
            - "Response status == 422 (priority 12 ERR_INVALID_TIME_RANGE wins because scheduled_end == scheduled_start)"
            - "Response error_id == 'ERR_INVALID_TIME_RANGE'"
            - "Response error_id != 'ERR_PROVIDER_TIME_CONFLICT' even though provider also has overlap"

  # ---------------------------------------------------------------------------
  # Rule 6 — Boundary-precision checks on different metrics/endpoints
  # ---------------------------------------------------------------------------
  - rule_id: boundary_precision_check
    instances:
      - name: hedis_cbp_systolic_140_exclusive_boundary
        grounds:
          - calculations.hedis_measure_eval
          - calculations.hedis_measure_eval.constants
          - endpoints.POST_/hedis/recompute
        distinguishing_aspect: |
          Numeric threshold boundary on the CBP HEDIS measure metric: ceiling is
          'bp_systolic < 140' (strict less-than), so a reading of exactly 140 fails the
          numerator while 139 passes. Reachable through POST /hedis/recompute. Different
          metric and endpoint from the empty-set boundary below.
        test_recipe:
          setup:
            - "POST /_clock/advance to 2026-12-31T12:00:00Z"
            - "Patient P_A (age 50, sex MALE, chronic_conditions=['I10'], ACTIVE), Patient P_B (same except bp differs)"
            - "Bind both to PCP PR1"
            - "Encounter EA COMPLETED in 2026 for P_A with vital_signs {bp_systolic:139, bp_diastolic:89, ...}"
            - "Encounter EB COMPLETED in 2026 for P_B with vital_signs {bp_systolic:140, bp_diastolic:89, ...}"
          trigger:
            - "POST /hedis/recompute { year: 2026, patient_ids: [P_A, P_B] }"
          assert:
            - "HedisMeasurement(P_A, CBP, 2026).in_numerator == true (139 < 140)"
            - "HedisMeasurement(P_B, CBP, 2026).in_numerator == false (140 is NOT < 140)"

      - name: encounter_complete_zero_cpt_lines_empty_set
        grounds:
          - validations[priority=16]
          - errors.ERR_NO_BILLABLE_LINES
          - endpoints.POST_/encounters/{id}/complete
        distinguishing_aspect: |
          Empty-collection boundary: completing an encounter requires AT LEAST ONE
          CptLineItem; zero is rejected with ERR_NO_BILLABLE_LINES (422). Different metric
          (collection cardinality vs numeric threshold) and different endpoint
          (POST /encounters/{id}/complete) from the CBP systolic boundary.
        test_recipe:
          setup:
            - "Patient P, PCP PR1 bound, Encounter E1 CHECKED_IN (CONSULTATION, chief_complaint set)"
            - "Do not add any CptLineItem to E1"
          trigger:
            - "POST /encounters/E1/complete (as PR1)"
          assert:
            - "Response status == 422"
            - "Response error_id == 'ERR_NO_BILLABLE_LINES'"
            - "Encounter.status == CHECKED_IN (unchanged)"

  # ---------------------------------------------------------------------------
  # Rule 7 — Cross-entity state dependencies across different entity pairs
  # ---------------------------------------------------------------------------
  - rule_id: cross_entity_state_dependency
    instances:
      - name: encounter_checkin_requires_patient_and_provider_active
        grounds:
          - state_machines.Encounter.SCHEDULED_to_CHECKED_IN
          - entities.Patient.fields.status
          - entities.Provider.fields.status
        distinguishing_aspect: |
          Entity pair = Encounter -> {Patient, Provider}. Encounter cannot transition
          SCHEDULED -> CHECKED_IN unless Patient.status == ACTIVE AND Provider.status ==
          ACTIVE. The valid transition set on Encounter depends on sibling Patient and
          Provider state.
        test_recipe:
          setup:
            - "Patient P, Provider PR1 bound; Encounter E1 SCHEDULED for now+10min"
            - "Mark Patient P INACTIVE via direct state change (PATCH /patients/P with admin action, or test fixture)"
            - "POST /_clock/advance to scheduled_start - 5min"
          trigger:
            - "POST /encounters/E1/check-in"
          assert:
            - "Response status == 409"
            - "Response error_id == 'ERR_INVALID_ENCOUNTER_STATE' (precondition Patient.status==ACTIVE failed)"
            - "Encounter.status == SCHEDULED"

      - name: prescription_sign_requires_encounter_active
        grounds:
          - state_machines.Prescription.DRAFT_to_SIGNED
          - entities.Encounter.fields.status
          - entities.Prescription.fields.encounter_id
        distinguishing_aspect: |
          DIFFERENT entity pair from instance 1: Prescription -> Encounter (not
          Encounter -> Patient/Provider). DRAFT -> SIGNED requires the linked Encounter to
          be in CHECKED_IN or COMPLETED; if the encounter was CANCELLED or NO_SHOW, sign
          fails. Forces reasoning across the Prescription-Encounter relationship.
        test_recipe:
          setup:
            - "Patient P, PCP PR1, Encounter E1 SCHEDULED, then CHECKED_IN"
            - "Provider creates Prescription RX (DRAFT) referencing E1"
            - "Cancel E1 (no CptLineItem yet) -> Encounter CANCELLED, RX cascades to CANCELLED too"
            - "Variant: create new Encounter E2, then immediately cancel E2 while still SCHEDULED; create RX2 referencing E2 (should also be rejected at create time, but RX2 DRAFT case: create RX referencing E_FAR_FUTURE that is SCHEDULED, NOT yet CHECKED_IN)"
            - "Cleaner setup: Encounter E_S SCHEDULED (not yet CHECKED_IN); create RX_S DRAFT referencing E_S"
          trigger:
            - "POST /prescriptions/RX_S/sign"
          assert:
            - "Response status == 409"
            - "Response error_id == 'ERR_INVALID_PRESCRIPTION_STATE' (precondition Encounter.status IN {CHECKED_IN, COMPLETED} failed)"
            - "Prescription.status == DRAFT (unchanged)"

  # ---------------------------------------------------------------------------
  # Rule 8 — Resource temporal-overlap conflicts across different interval semantics
  # ---------------------------------------------------------------------------
  - rule_id: resource_temporal_overlap
    instances:
      - name: provider_closed_open_overlap
        grounds:
          - validations[priority=13]
          - errors.ERR_PROVIDER_TIME_CONFLICT
          - entities.Encounter.fields.scheduled_start
          - entities.Encounter.fields.scheduled_end
        distinguishing_aspect: |
          Resource = Provider. Interval semantics = closed-open ([start, end)): two
          encounters that touch at the boundary (A ends at 10:30, B starts at 10:30) do
          NOT conflict; any genuine overlap does. Back-to-back permitted on Provider.
        test_recipe:
          setup:
            - "Patient P_X, Patient P_Y, Provider PR1 (PCP, bound to both)"
            - "Encounter EA SCHEDULED for PR1 from 2026-07-01T10:00:00Z to 10:30:00Z (CONSULTATION)"
          trigger:
            - "Case 1: POST /patients/P_Y/encounters { provider_id: PR1, scheduled_start: '2026-07-01T10:30:00Z', scheduled_end: '2026-07-01T11:00:00Z' } (boundary-touch)"
            - "Case 2: POST /patients/P_Y/encounters { provider_id: PR1, scheduled_start: '2026-07-01T10:29:00Z', scheduled_end: '2026-07-01T10:59:00Z' } (1-minute overlap)"
          assert:
            - "Case 1 status == 201 (closed-open allows boundary touch on Provider resource)"
            - "Case 2 status == 409 error_id == 'ERR_PROVIDER_TIME_CONFLICT'"

      - name: patient_closed_closed_15min_buffer_overlap
        grounds:
          - validations[priority=14]
          - errors.ERR_PATIENT_TIME_CONFLICT
          - entities.Encounter.fields.scheduled_start
        distinguishing_aspect: |
          DIFFERENT resource (Patient, not Provider) AND different interval semantics
          (closed-closed with a 15-minute buffer on each side, not closed-open). A second
          encounter for the SAME patient starting exactly 15 minutes after the first ends
          is rejected; only beyond 15 minutes succeeds.
        test_recipe:
          setup:
            - "Patient P, Provider PR1 (PCP, bound), Provider PR2 (PCP_ONLY or BOTH, also able to see P)"
            - "Encounter EA SCHEDULED for PR1 on P from 2026-07-01T10:00:00Z to 10:30:00Z"
          trigger:
            - "Case 1: POST /patients/P/encounters { provider_id: PR2, scheduled_start: '2026-07-01T10:45:00Z', scheduled_end: '2026-07-01T11:00:00Z' } (exactly 15 min buffer, boundary inclusive)"
            - "Case 2: POST /patients/P/encounters { provider_id: PR2, scheduled_start: '2026-07-01T10:46:00Z', scheduled_end: '2026-07-01T11:01:00Z' } (16 min after, outside buffer)"
          assert:
            - "Case 1 status == 409 error_id == 'ERR_PATIENT_TIME_CONFLICT' (15-min buffer is inclusive)"
            - "Case 2 status == 201 (16 min apart on Patient resource passes)"

  # ---------------------------------------------------------------------------
  # Rule 9 — Compensating-action invariants across different conserved quantities
  # ---------------------------------------------------------------------------
  - rule_id: compensating_invariant
    instances:
      - name: pcp_bind_unbind_panel_size_invariant
        grounds:
          - calculations.provider_panel_count
          - endpoints.POST_/patients/{id}/bind-pcp
          - endpoints.POST_/patients/{id}/unbind-pcp
          - entities.Provider.fields.panel_size
        distinguishing_aspect: |
          Conserved quantity = Provider.panel_size (integer count of active bound patients).
          Forward action POST /bind-pcp + compensating action POST /unbind-pcp MUST leave
          Provider.panel_size == (count of Patients where pcp_provider_id == PR.id AND
          status == ACTIVE) — an explicit aggregation formula over Patient fields. The
          named quantity 'panel_size' must equal that aggregation before and after the
          paired operations.
        test_recipe:
          setup:
            - "Provider PR (PCP_ONLY, panel_cap=2000), pre-existing panel of 3 active patients (P1, P2, P3 already bound)"
            - "Read PR.panel_size_before -> expected 3 (matches count formula)"
            - "Create Patient P_NEW (ACTIVE, unbound)"
          trigger:
            - "POST /patients/P_NEW/bind-pcp { provider_id: PR } -> read PR.panel_size_mid"
            - "POST /patients/P_NEW/unbind-pcp -> read PR.panel_size_after"
          assert:
            - "PR.panel_size_before == 3"
            - "PR.panel_size_mid == 4 (consistent with count formula immediately after bind)"
            - "PR.panel_size_after == 3 (compensating action restores the invariant)"
            - "panel_size_after == count(Patient where pcp_provider_id==PR.id AND status==ACTIVE) — invariant holds at every step"

      - name: prescription_refills_remaining_dispense_cancel_invariant
        grounds:
          - state_machines.Prescription
          - entities.Prescription.fields.refills_remaining
          - entities.Prescription.fields.refills_authorized
          - endpoints.POST_/prescriptions/{id}/dispense
          - endpoints.POST_/prescriptions/{id}/cancel
        distinguishing_aspect: |
          DIFFERENT conserved quantity from panel_size: total_authorized_doses_for_patient
          defined as SUM over patient's non-CANCELLED Prescriptions of (refills_authorized
          + 1) - refills_remaining. This quantity counts doses already dispensed; a forward
          dispense action increments it by 1, the compensating action (canceling that
          prescription with one refill remaining) keeps the count unchanged because cancel
          does not unwind already-dispensed doses. Pinned formula:
          dispensed_count == SUM((refills_authorized + 1) - refills_remaining) over
          Prescription where patient_id == P AND status != CANCELLED AND status != DRAFT.
        test_recipe:
          setup:
            - "Patient P, Provider PR (epcs_enrolled, dea ok), Encounter E1 CHECKED_IN"
            - "Create RX (is_controlled=false, refills_authorized=2)"
            - "Sign RX -> TRANSMITTED via /transmit; refills_remaining = 2"
            - "Compute dispensed_count_before == 0"
          trigger:
            - "POST /prescriptions/RX/dispense (as Pharmacist different from signer) -> refills_remaining = 1"
            - "Compute dispensed_count_mid"
            - "POST /prescriptions/RX/cancel"
            - "Compute dispensed_count_after"
          assert:
            - "dispensed_count_before == 0"
            - "dispensed_count_mid == 1 (one dose dispensed)"
            - "After cancel, RX is excluded from the sum (status==CANCELLED), so dispensed_count_after == 0 from THIS prescription"
            - "Invariant pinned: globally tracked dispensed counter (across patient history including audit) is conserved — the cancel does NOT reverse the already-recorded dispense in AuditLog; AuditLog entry for prescription.dispense remains intact, ensuring no drift in the historical record."
