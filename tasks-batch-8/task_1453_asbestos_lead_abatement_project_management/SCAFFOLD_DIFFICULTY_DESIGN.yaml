scaffold_difficulty_design:
  # ---------------------------------------------------------------------------
  - rule_id: dual_variant_calc
    instances:
      - name: survey_provisional_assumes_pending_vs_final_positive_only
        grounds:
          - calculations.survey_acm_quantities
          - entities.Survey.fields.acm_sq_ft_provisional
          - entities.Survey.fields.acm_sq_ft_final
        distinguishing_aspect: |
          Dual-variant calculation on the environmental/survey domain: with one
          POSITIVE 100 sqft sample and one still-PENDING 50 sqft sample, the
          provisional variant (counts lab_result IN {PENDING, POSITIVE}) yields
          150 while the final variant (POSITIVE only) yields 100 for identical
          stored data.
        test_recipe:
          setup:
            - "Project P (DRAFT); Survey S on P with Sample A (100 sqft, friable) and Sample B (50 sqft, non-friable); S submitted (IN_LAB); Sample A reported POSITIVE 40%; Sample B still PENDING"
          setup_api_calls:
            - { call: "POST /abatement/projects", payload: { name: "P-DV1", site_address: "1 Elm St", work_type: "RENOVATION", hazard_class: "ASBESTOS", planned_start: "2026-08-11T00:00:00Z", base_abatement_cost_cents: 5000000 }, as: ContractorAdmin, captures: { p_id: "$.data.id" } }
            - { call: "POST /abatement/surveys", payload: { project_id: "${p_id}", surveyor_name: "Insp A", survey_date: "2026-07-20T00:00:00Z" }, as: ContractorAdmin, captures: { s_id: "$.data.id" } }
            - { call: "POST /abatement/samples", payload: { survey_id: "${s_id}", material: "pipe insulation", location_desc: "basement", quantity_sq_ft: 100, friable: true }, as: ContractorAdmin, captures: { samp_a: "$.data.id" } }
            - { call: "POST /abatement/samples", payload: { survey_id: "${s_id}", material: "floor tile", location_desc: "kitchen", quantity_sq_ft: 50, friable: false }, as: ContractorAdmin }
            - { call: "POST /abatement/surveys/${s_id}/submit", payload: {}, as: ContractorAdmin }
          trigger:
            - { call: "POST /abatement/samples/${samp_a}/result", payload: { lab_result: "POSITIVE", asbestos_pct: 40 }, as: IndustrialHygienist, as_user_id: "ih_1" }
            - { call: "GET /abatement/surveys/${s_id}", payload: {}, as: ContractorAdmin, captures: { prov: "$.data.acm_sq_ft_provisional", fin: "$.data.acm_sq_ft_final", fri: "$.data.friable_acm_sq_ft_final" } }
          assert:
            - "Survey.${s_id}.acm_sq_ft_provisional == 150"
            - "Survey.${s_id}.acm_sq_ft_final == 100"
            - "Survey.${s_id}.friable_acm_sq_ft_final == 100"
            - "acm_sq_ft_provisional != acm_sq_ft_final while Sample B is PENDING"

      - name: disposal_cost_estimated_survey_vs_final_manifested
        grounds:
          - calculations.disposal_cost
          - calculations.manifest_disposal_fee
          - calculations.project_cost_rollup
          - entities.Project.fields.estimated_disposal_cost_cents
          - entities.Project.fields.final_disposal_cost_cents
        distinguishing_aspect: |
          Dual-variant calculation on the fiscal/project domain (distinct from
          the survey-quantity domain of the sibling instance): the estimated
          variant derives 0.075 t from the density assumption (100 sqft x 1.5
          lbs/sqft / 2000) costing 1125 cents, while the final variant sums the
          frozen per-manifest fee (1.0005 t x 15000 = 15007.5 -> 15008 cents);
          1125 != 15008 for the same project.
        test_recipe:
          setup:
            - "Project P IN_PROGRESS: survey finalized with a single POSITIVE 100 sqft friable sample (total_acm_sq_ft 100, estimated_disposal_cost_cents 1125); containment verified; notification INITIAL filed at default clock 2026-08-01T00:00:00Z and acknowledged; supervisor assignment [2026-08-01, 2026-09-01); clock 2026-08-11T00:00:00Z"
            - "Facility F accepts [ASBESTOS], capacity 50 t"
            - "Manifest M: bags_count 1, gross 2003 lbs -> net 2001 lbs = 1.0005 t; sealed (fee frozen 15008), shipped, delivered, confirmed"
          setup_api_calls:
            - { call: "POST /abatement/projects", payload: { name: "P-DV2", site_address: "2 Oak St", work_type: "RENOVATION", hazard_class: "ASBESTOS", planned_start: "2026-08-11T00:00:00Z", base_abatement_cost_cents: 5000000 }, as: ContractorAdmin, captures: { p_id: "$.data.id" } }
            - { call: "POST /abatement/surveys", payload: { project_id: "${p_id}", surveyor_name: "Insp A", survey_date: "2026-07-20T00:00:00Z" }, as: ContractorAdmin, captures: { s_id: "$.data.id" } }
            - { call: "POST /abatement/samples", payload: { survey_id: "${s_id}", material: "pipe insulation", location_desc: "basement", quantity_sq_ft: 100, friable: true }, as: ContractorAdmin, captures: { samp_a: "$.data.id" } }
            - { call: "POST /abatement/surveys/${s_id}/submit", payload: {}, as: ContractorAdmin }
            - { call: "POST /abatement/samples/${samp_a}/result", payload: { lab_result: "POSITIVE", asbestos_pct: 40 }, as: IndustrialHygienist, as_user_id: "ih_1" }
            - { call: "POST /abatement/surveys/${s_id}/finalize", payload: {}, as: ContractorAdmin }
            - { call: "POST /abatement/workers", payload: { full_name: "Sup One", certification_level: "SUPERVISOR", cert_expires_at: "2027-01-01T00:00:00Z", medical_clearance_expires_at: "2027-01-01T00:00:00Z", respirator_fit_expires_at: "2027-01-01T00:00:00Z" }, as: ContractorAdmin, captures: { w_sup: "$.data.id" } }
            - { call: "POST /abatement/containments", payload: { project_id: "${p_id}", work_area_volume_cuft: 240000, containment_class: "FULL" }, as: Supervisor, as_user_id: "${w_sup}", captures: { c_id: "$.data.id" } }
            - { call: "POST /abatement/containments/${c_id}/install", payload: {}, as: Supervisor, as_user_id: "${w_sup}" }
            - { call: "POST /abatement/containments/${c_id}/verify", payload: { pressure_reading_inwg: -0.03 }, as: Supervisor, as_user_id: "${w_sup}" }
            - { call: "GET /abatement/projects/${p_id}", payload: {}, as: ContractorAdmin, captures: { p_v: "$.data.version" } }
            - { call: "POST /abatement/notifications", payload: { project_id: "${p_id}", notification_type: "INITIAL", declared_acm_sq_ft: 100, expected_project_version: "${p_v}" }, as: ContractorAdmin, captures: { n_id: "$.data.id" } }
            - { call: "POST /abatement/notifications/${n_id}/acknowledge", payload: {}, as: RegulatorClerk, as_user_id: "reg_1" }
            - { call: "POST /abatement/assignments", payload: { project_id: "${p_id}", worker_id: "${w_sup}", role_on_site: "SUPERVISOR", start_at: "2026-08-01T00:00:00Z", end_at: "2026-09-01T00:00:00Z" }, as: Supervisor, as_user_id: "${w_sup}" }
            - { call: "POST /_clock/set_current_utc", payload: { to_iso8601: "2026-08-11T00:00:00Z" }, as: ContractorAdmin }
            - { call: "POST /abatement/projects/${p_id}/start-abatement", payload: {}, as: ContractorAdmin }
            - { call: "POST /abatement/facilities", payload: { name: "Fac A", epa_id: "EPA-1", accepted_hazards: ["ASBESTOS"], monthly_capacity_tons: 50 }, as: ContractorAdmin, captures: { f_id: "$.data.id" } }
            - { call: "POST /abatement/manifests", payload: { project_id: "${p_id}", facility_id: "${f_id}", bags_count: 1, gross_weight_lbs: 2003 }, as: Supervisor, as_user_id: "${w_sup}", captures: { m_id: "$.data.id" } }
            - { call: "POST /abatement/manifests/${m_id}/seal", payload: {}, as: Supervisor, as_user_id: "${w_sup}" }
            - { call: "POST /abatement/manifests/${m_id}/ship", payload: {}, as: Supervisor, as_user_id: "${w_sup}" }
            - { call: "POST /abatement/manifests/${m_id}/deliver", payload: {}, as: FacilityOperator, as_user_id: "${f_id}" }
            - { call: "POST /abatement/manifests/${m_id}/confirm", payload: {}, as: FacilityOperator, as_user_id: "${f_id}" }
          trigger:
            - { call: "GET /abatement/projects/${p_id}", payload: {}, as: ContractorAdmin, captures: { est: "$.data.estimated_disposal_cost_cents", fin: "$.data.final_disposal_cost_cents", sur: "$.data.insurance_surcharge_cents", tot: "$.data.total_project_cost_cents" } }
          assert:
            - "Project.${p_id}.estimated_disposal_cost_cents == 1125"
            - "Project.${p_id}.final_disposal_cost_cents == 15008"
            - "estimated variant != final variant (1125 != 15008) for identical project data"
            - "Project.${p_id}.insurance_surcharge_cents == 401201"
            - "Project.${p_id}.total_project_cost_cents == 5416209"

  # ---------------------------------------------------------------------------
  - rule_id: combinatorial_formula
    instances:
      - name: negative_air_machines_class_volume_branching
        grounds:
          - calculations.negative_air_machine_count
          - entities.Containment.fields.machines_required
        distinguishing_aspect: |
          Mode (a) combinatorial formula: >= 3 inputs with non-linear
          interaction — conditional ACH branch on containment_class, ceil on
          volume*ACH/(CFM*60), and a max(1, ...) floor; GLOVE_BAG short-circuits
          to 0. Revisions show 8 -> 4 -> 0 machines for the same containment.
        test_recipe:
          setup:
            - "Project P ASSESSED (survey with one POSITIVE 100 sqft sample, finalized); Containment C created FULL with volume 240000 cuft -> machines_required 8, version captured"
          setup_api_calls:
            - { call: "POST /abatement/projects", payload: { name: "P-CF1", site_address: "3 Pine St", work_type: "RENOVATION", hazard_class: "ASBESTOS", planned_start: "2026-08-11T00:00:00Z", base_abatement_cost_cents: 5000000 }, as: ContractorAdmin, captures: { p_id: "$.data.id" } }
            - { call: "POST /abatement/surveys", payload: { project_id: "${p_id}", surveyor_name: "Insp A", survey_date: "2026-07-20T00:00:00Z" }, as: ContractorAdmin, captures: { s_id: "$.data.id" } }
            - { call: "POST /abatement/samples", payload: { survey_id: "${s_id}", material: "pipe insulation", location_desc: "basement", quantity_sq_ft: 100, friable: true }, as: ContractorAdmin, captures: { samp_a: "$.data.id" } }
            - { call: "POST /abatement/surveys/${s_id}/submit", payload: {}, as: ContractorAdmin }
            - { call: "POST /abatement/samples/${samp_a}/result", payload: { lab_result: "POSITIVE", asbestos_pct: 40 }, as: IndustrialHygienist, as_user_id: "ih_1" }
            - { call: "POST /abatement/surveys/${s_id}/finalize", payload: {}, as: ContractorAdmin }
            - { call: "POST /abatement/workers", payload: { full_name: "Sup One", certification_level: "SUPERVISOR", cert_expires_at: "2027-01-01T00:00:00Z", medical_clearance_expires_at: "2027-01-01T00:00:00Z", respirator_fit_expires_at: "2027-01-01T00:00:00Z" }, as: ContractorAdmin, captures: { w_sup: "$.data.id" } }
            - { call: "POST /abatement/containments", payload: { project_id: "${p_id}", work_area_volume_cuft: 240000, containment_class: "FULL" }, as: Supervisor, as_user_id: "${w_sup}", captures: { c_id: "$.data.id", c_v0: "$.data.version", m0: "$.data.machines_required" } }
          trigger:
            - { call: "POST /abatement/containments/${c_id}/revise", payload: { work_area_volume_cuft: 120000, expected_containment_version: "${c_v0}" }, as: Supervisor, as_user_id: "${w_sup}", captures: { m1: "$.data.machines_required", c_v1: "$.data.version" } }
            - { call: "POST /abatement/containments/${c_id}/revise", payload: { containment_class: "GLOVE_BAG", expected_containment_version: "${c_v1}" }, as: Supervisor, as_user_id: "${w_sup}", captures: { m2: "$.data.machines_required", ach2: "$.data.air_changes_per_hour" } }
          assert:
            - "create response machines_required == 8 (ceil(240000*4/(2000*60)))"
            - "revise1 response machines_required == 4 (ceil(120000*4/120000))"
            - "revise2 response machines_required == 0 (GLOVE_BAG branch)"
            - "revise2 response air_changes_per_hour == 0"

      - name: manifest_fee_per_manifest_rounding_then_sum
        grounds:
          - calculations.manifest_disposal_fee
          - calculations.disposal_cost
          - entities.WasteManifest.fields.fee_cents
        distinguishing_aspect: |
          Mode (b) nested-rounding formula: the scaffold pins round-per-manifest-
          at-seal THEN sum; two manifests of 1.0005 t each cost
          round_half_up(15007.5) = 15008 apiece, project total 30016 — the
          forbidden sum-then-round order would give round_half_up(30015.0) =
          30015, one cent less.
        test_recipe:
          setup:
            - "Project P IN_PROGRESS (same chain as disposal_cost_estimated_survey_vs_final_manifested); Facility F capacity 50 t"
          setup_api_calls:
            - { call: "POST /abatement/projects", payload: { name: "P-CF2", site_address: "4 Birch St", work_type: "RENOVATION", hazard_class: "ASBESTOS", planned_start: "2026-08-11T00:00:00Z", base_abatement_cost_cents: 5000000 }, as: ContractorAdmin, captures: { p_id: "$.data.id" } }
