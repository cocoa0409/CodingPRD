          A freshly taken application starts in status TAKEN on the origination dimension and
          NOT_APPLICABLE on the compensation dimension, with authority_flag VERIFIED and
          note_rate_bps, locked_amount_cents, funded_amount_cents, closed_unit_index and
          compensation_plan_id all null.
        test_recipe:
          setup:
            - "Originator 2200001 holds an ACTIVE CA licence sponsored by INST-0001 from
               2026-07-01, so CA is in authorized_state_codes at the clock instant 2026-08-01."
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
