  # ===========================================================================
  # Rule 8 — resource_temporal_overlap (2 instances, different interval semantics)
  # ===========================================================================
  - rule_id: resource_temporal_overlap
    instances:
      - name: housing_half_open_overlap_rules
        grounds:
          - validations[priority=9]
          - errors[ERR_HOUSING_OVERLAP]
          - entities.ServiceBooking.fields.start_date
        distinguishing_aspect: |
          Resource: RelocationCase's temp-housing calendar. Semantics: half-open
          intervals [start_date, end_date) — a booking starting exactly at the
          other's end_date (Sep 10 vs [Sep 1, Sep 10)) is ADJACENT and allowed,
          while [Sep 9, Sep 11) intersects and is rejected.
        test_recipe:
          setup:
            - "MANAGER/DOMESTIC/RENTER policy (cap 300000, max_nights 30); case IN_PROGRESS; booking B1 [Sep 1, Sep 10) at 15000/night CONFIRMED"
          setup_api_calls:
