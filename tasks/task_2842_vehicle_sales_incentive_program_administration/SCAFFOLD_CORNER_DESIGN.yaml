              as: IncentiveController
              as_user_id: "u-controller-1"
              captures: { err_rerun: $.data.error_id }
            - call: "POST /incentives/programs/${prog_id}/accruals"
              payload: { period_month: "2026-09" }
              as: IncentiveController
              as_user_id: "u-controller-1"
              captures: { acc2_id: $.data.id, acc2_month: $.data.period_month, acc2_cents: $.data.accrued_cents }
            - call: "POST /incentives/programs/${prog_id}/accruals"
              payload: { period_month: "2026-8" }
              as: IncentiveController
              as_user_id: "u-controller-1"
              captures: { err_month_shape: $.data.error_id }
            - call: "POST /incentives/objectives/${obj_id}/finalize"
              payload: {}
              as: FieldSalesManager
              as_user_id: "u-fsm-1"
              captures: { fin_status: $.data.status, fin_version: $.data.version }
            - call: "POST /incentives/objectives/${obj_id}/finalize"
              payload: {}
              as: FieldSalesManager
              as_user_id: "u-fsm-1"
              captures: { err_refinalize: $.data.error_id }
            - call: "GET /incentives/objectives/${obj_id}"
              payload: {}
              as: FieldSalesManager
              as_user_id: "u-fsm-1"
              captures: { obj_status_after: $.data.status, obj_version_after: $.data.version }
            - call: "GET /incentives/programs/${prog_id}/accruals"
              payload: { entry_type: "ACCRUAL" }
