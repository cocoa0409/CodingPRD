              captures: { err: $.data.error_id }
          assert:
            - "due_at exactly 2026-06-30T00:00:00Z (== field_window_end) succeeded (inclusive boundary): ok_asg created"
            - "due_at 2026-07-01T00:00:00Z returns error_id == ERR_DUE_OUTSIDE_WINDOW (422)"

  # ---------------------------------------------------------------------------
  - rule_id: compensating_invariant
    instances:
      - name: wave_validated_count_invariant_under_validate_then_reject_overturn
        grounds:
          - calculations.client_billable
          - state_machines.Assignment.SUBMITTED_to_VALIDATED
          - state_machines.Reimbursement.ACCRUED_to_REVERSED
          - entities.ShopWave.fields.client_billable_cents
        distinguishing_aspect: |
          Conserved quantity: ShopWave.client_billable_cents ==
          (count of VALIDATED assignments in wave) * fee. After a validate (count→1,
          billable→15000) is compensated by a Reimbursement reversal that decrements
          the VALIDATED count back to 0, billable returns to exactly 0 — no drift.
        test_recipe:
          setup:
            - "Two CERTIFIED shoppers each with a VALIDATED Assignment in the same wave (validated_shop_count=2, client_billable=30000), each with an ACCRUED Reimbursement."
