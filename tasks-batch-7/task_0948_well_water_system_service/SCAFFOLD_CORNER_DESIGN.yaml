            - "HTTP status is 400 on the malformed analyzed_at"
            - "${err_range} == ERR_INVALID_DATE_RANGE"
            - "HTTP status is 400 on the analyzed-before-sampled call"
            - "WaterTest.${wt_id}.result_status == ANALYZED_NEGATIVE"
            - "WaterTest.${wt_id}.hold_time_valid == true"
