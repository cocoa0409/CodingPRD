  # =====================================================================
  # Rule 8 — Resource temporal-overlap conflicts across different interval semantics
  # =====================================================================
  - rule_id: resource_temporal_overlap
    instances:
      - name: trip_window_half_open_overlap_same_office_rejected
        grounds:
          - validations[priority=10]
          - entities.RunnerTrip.fields.window_start_at
          - entities.RunnerTrip.fields.window_end_at
          - errors[ERR_TRIP_WINDOW_OVERLAP]
        distinguishing_aspect: "Half-open interval semantics on RunnerTrip windows: a second trip to the SAME dmv_office_code whose [09:30,11:00) overlaps an existing [09:00,12:00) is rejected, but an exactly-adjacent [12:00,14:00) is NOT rejected (start==end does not collide)."
        test_recipe:
          setup:
            - "One PLANNED RunnerTrip to CA-DMV-01 over [2026-04-01T09:00:00Z, 2026-04-01T12:00:00Z)."
          setup_api_calls:
            - call: "POST /dmv/_clock/set_current_utc"
              payload: { to_iso8601: "2026-04-01T00:00:00Z" }
              as: PlatformAdmin
            - call: "POST /dmv/runner-trips"
              payload: { dmv_office_code: "CA-DMV-01", capacity: 5, window_start_at: "2026-04-01T09:00:00Z", window_end_at: "2026-04-01T12:00:00Z" }
              as: RunnerDispatcher
              captures: { ov_trip1: $.data.id }
            - call: "POST /dmv/runner-trips"
              payload: { dmv_office_code: "CA-DMV-01", capacity: 5, window_start_at: "2026-04-01T12:00:00Z", window_end_at: "2026-04-01T14:00:00Z" }
              as: RunnerDispatcher
              captures: { ov_trip_adjacent: $.data.id }
          trigger:
            - call: "POST /dmv/runner-trips"
              payload: { dmv_office_code: "CA-DMV-01", capacity: 5, window_start_at: "2026-04-01T09:30:00Z", window_end_at: "2026-04-01T11:00:00Z" }
              as: RunnerDispatcher
              captures: { ov_err: $.data.error_id }
          assert:
            - "the adjacent trip ${ov_trip_adjacent} was created (201) — start 12:00 == existing end 12:00 does NOT overlap"
            - "the overlapping trigger returns 409 ERR_TRIP_WINDOW_OVERLAP"

      - name: expedite_sla_window_open_upper_bound_at_deadline_rejected
        grounds:
          - validations[priority=11]
          - entities.Submission.fields.sla_deadline_at
          - entities.Submission.fields.priority_class
          - errors[ERR_SLA_EXPIRED]
        distinguishing_aspect: "Different interval semantics (point-vs-open-upper-bound deadline) on a DIFFERENT resource (Submission, not RunnerTrip): an EXPEDITE submission queued at 2026-04-01T00:00:00Z gets sla_deadline_at = 2026-04-03T00:00:00Z; attaching exactly AT the deadline (clock 2026-04-03T00:00:00Z) is rejected because the upper bound is open."
        test_recipe:
          setup:
            - "CA FeeSchedule; RETAIL account; an EXPEDITE REGISTRATION Transaction submitted at clock 2026-04-01T00:00:00Z so its Submission.sla_deadline_at == 2026-04-03T00:00:00Z; a PLANNED trip exists."
            - "Clock advanced to exactly 2026-04-03T00:00:00Z before the attach."
          setup_api_calls:
            - call: "POST /dmv/_clock/set_current_utc"
              payload: { to_iso8601: "2026-04-01T00:00:00Z" }
              as: PlatformAdmin
            - call: "POST /dmv/fee-schedules"
              payload: { state_code: "CA", title_fee_cents: 2000, registration_fee_cents: 8500, transfer_fee_cents: 1500, lien_recording_fee_cents: 1000, use_tax_rate_bps: 625, trade_in_credit_allowed: true }
              as: PlatformAdmin
            - call: "POST /dmv/accounts"
              payload: { account_type: "RETAIL", legal_name: "Sla Cust", state_code: "CA" }
              as: PlatformAdmin
              captures: { sl_acct: $.data.id }
            - call: "POST /dmv/transactions"
              payload: { account_id: "${sl_acct}", transaction_type: "REGISTRATION", vin: "1HGCM82633A004352", declared_price_cents: 0, expedite: true }
              as: IntakeClerk
              captures: { sl_txn: $.data.id }
            - call: "POST /dmv/documents"
              payload: { transaction_id: "${sl_txn}", checklist_code: "ID_PROOF", file_ref: "f1" }
              as: IntakeClerk
              captures: { sl_d1: $.data.id }
            - call: "POST /dmv/documents"
              payload: { transaction_id: "${sl_txn}", checklist_code: "INSURANCE", file_ref: "f2" }
              as: IntakeClerk
              captures: { sl_d2: $.data.id }
            - call: "POST /dmv/documents/${sl_d1}/verify"
              payload: { decision: "VERIFIED" }
              as: IntakeClerk
            - call: "POST /dmv/documents/${sl_d2}/verify"
              payload: { decision: "VERIFIED" }
              as: IntakeClerk
            - call: "POST /dmv/transactions/${sl_txn}/verify-documents"
              payload: {}
              as: IntakeClerk
              captures: { sl_v1: $.data.version }
            - call: "POST /dmv/transactions/${sl_txn}/quote"
              payload: { expected_transaction_version: "${sl_v1}" }
              as: FeeAnalyst
            - call: "POST /dmv/transactions/${sl_txn}/submit"
              payload: {}
              as: IntakeClerk
              captures: { sl_sub: $.data.id }
            - call: "POST /dmv/runner-trips"
              payload: { dmv_office_code: "CA-DMV-02", capacity: 5, window_start_at: "2026-04-03T09:00:00Z", window_end_at: "2026-04-03T12:00:00Z" }
              as: RunnerDispatcher
              captures: { sl_trip: $.data.id, sl_trip_v0: $.data.version }
            - call: "POST /dmv/_clock/set_current_utc"
              payload: { to_iso8601: "2026-04-03T00:00:00Z" }
              as: PlatformAdmin
          trigger:
            - call: "POST /dmv/runner-trips/${sl_trip}/legs"
              payload: { submission_id: "${sl_sub}", expected_runnertrip_version: "${sl_trip_v0}" }
              as: RunnerDispatcher
              captures: { sl_err: $.data.error_id }
          assert:
            - "Submission.${sl_sub}.sla_deadline_at == 2026-04-03T00:00:00Z (queue 04-01 + 48h)"
            - "response status == 409 and error_id == ERR_SLA_EXPIRED (clock == deadline, open upper bound)"

  # =====================================================================
  # Rule 9 — Compensating-action invariants across different conserved quantities
  # =====================================================================
  - rule_id: compensating_invariant
    instances:
      - name: cancel_after_completion_refund_restores_balance_invariant
        grounds:
          - state_machines.Transaction.COMPLETED_to_CANCELLED
          - calculations.account_balance
          - entities.Account.fields.outstanding_balance_cents
          - entities.Payment.fields.kind
        distinguishing_aspect: "Conserved quantity #1 = Account.outstanding_balance_cents (money). After COMPLETE (CHARGE 69000 -> balance 0 for RETAIL prepaid) then post-completion CANCEL (REFUND 69000), the account's net balance returns to its pre-transaction value 0: outstanding_balance_cents == 0 with both a CHARGE and a REFUND on the books."
        test_recipe:
          setup:
            - "CA FeeSchedule use_tax 625, title_fee 2000; RETAIL account; a TITLE Transaction declared 1000000, no trade, no expedite -> total 69000, driven to COMPLETED with a CHARGE Payment of 69000 (balance nets to 0)."
          setup_api_calls:
            - call: "POST /dmv/_clock/set_current_utc"
              payload: { to_iso8601: "2026-04-01T00:00:00Z" }
              as: PlatformAdmin
