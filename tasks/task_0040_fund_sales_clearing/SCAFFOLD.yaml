scenario: |
  Fund sales and clearing system: fund product management with fund-type classification
  (equity/bond/hybrid/money-market/QDII), product on-shelf review, risk-rating tagging,
  sales-region restriction, investor-suitability matching rules, and fund-information
  disclosure; subscription/redemption/conversion transactions with order acceptance
  window, single-order amount/share limits, transaction confirmation rules, T+N
  confirmation cycle by fund type, and large-redemption handling; net asset value
  calculation (T+1) with portfolio-position valuation, accrued income calculation,
  fee deduction (management/custodian/sales-service), share calculation, and NAV
  publication; fee tier calculation with subscription/redemption fee tiers (by
  amount/holding period), back-end load handling, conversion fee rules, fee-discount
  activities, and inter-fund fee variation; dividend processing with dividend plan
  announcement, ex-dividend date and record date setting, cash dividend or
  reinvestment options, dividend distribution execution, and tax withholding;
  clearing and settlement reconciliation with TA-side and custodian-side data
  reconciliation, fund-flow reconciliation, sales-channel reconciliation, exception
  identification and adjustment, and settlement-instruction generation; event-driven
  synchronization with banking, custodian, fund manager (TA), and regulatory
  reporting systems; audit logging for transaction status and NAV adjustments.

domain_name: fund-sales-clearing
api_prefix: /funds

complexity_profile:
  primary_archetype: compliance_audit
  secondary_archetype: ledger_reconciliation
  complexity_layers:
    - dual_variant_calculation
    - cascading_side_effects
    - rate_threshold_triggers
    - scheduled_deferred_actions
    - derived_field_reconciliation

  entity_topology: hybrid
  state_machine_shape: branching
  relationship_patterns:
    - one_to_many
    - cross_aggregate
    - polymorphic
  role_model: segregation_of_duties
  consistency_model: saga

# =============================================================================
# 1.0 Response Envelope (FIXED — verbatim)
# =============================================================================
response_envelope:
  success: |
    { "meta": { "api_request_id": "req_xxx", "api_request_timestamp": "ISO8601" },
      "response_type": "object" | "array", "data": {} }
  error: |
    { "meta": { ... }, "response_type": "error",
      "data": { "error_id": "ERR_XXX", "message": "..." } }
  pagination_fields: ["limit", "offset", "total_count", "has_more"]
  pagination_defaults: { limit: 10, min: 1, max: 100, offset: 0 }

# =============================================================================
# 1.1 Entities
# =============================================================================
entities:
  - name: Investor
    parent: null
    common_fields: true
    fields:
      - name: legal_name
        type: string
        source: input
        description: Investor legal name.
      - name: investor_type
        type: enum
        source: input
        description: Investor classification.
        constraints: "INDIVIDUAL | INSTITUTIONAL"
      - name: country_code
        type: string
        source: input
        description: ISO-3166 alpha-2 country of residence; used for sales-region restriction.
      - name: risk_tolerance
        type: enum
        source: input
        description: Suitability profile derived from KYC questionnaire.
        constraints: "C1 | C2 | C3 | C4 | C5 (C1 lowest, C5 highest)"
      - name: tax_resident_status
        type: enum
        source: input
        description: Tax-withholding regime.
        constraints: "DOMESTIC | FOREIGN | EXEMPT"
      - name: kyc_status
        type: enum
        source: system
        description: KYC review status.
        default: PENDING
        constraints: "PENDING | APPROVED | REJECTED"
      - name: bank_account_number
        type: string
        source: input
        description: Settlement bank account; used by Bank event sync.
      - name: cash_balance_cents
        type: integer
        source: computed
        description: Available cash balance in minor units (CNY fen). Mutates on subscription/redemption settlement and dividend payout.
        default: 0

  - name: Fund
    parent: null
    common_fields: true
    fields:
      - name: fund_code
        type: string
        source: input
        description: Public fund code (6 chars). Unique across all funds.
        constraints: "matches ^[0-9]{6}$"
      - name: fund_name
        type: string
        source: input
        description: Fund product name.
      - name: fund_type
        type: enum
        source: input
        description: Fund classification driving T+N confirmation cycle and fee schedule.
        constraints: "EQUITY | BOND | HYBRID | MONEY_MARKET | QDII"
      - name: risk_rating
        type: enum
        source: input
        description: Product risk level for suitability matching.
        constraints: "R1 | R2 | R3 | R4 | R5 (R1 lowest, R5 highest)"
      - name: allowed_country_codes
        type: array
        source: input
        description: ISO-3166 alpha-2 codes where this fund may be sold; empty array means "no restriction".
      - name: status
        type: enum
        source: system
        description: Product lifecycle state.
        default: DRAFT
        constraints: "DRAFT | UNDER_REVIEW | ON_SHELF | SUSPENDED | OFF_SHELF"
      - name: shelf_review_actor_id
        type: string
        source: system
        description: X-User-ID of the reviewer who approved on-shelf; SoD requires it differs from creator.
        default: null
      - name: shelf_creator_actor_id
        type: string
        source: system
        description: X-User-ID of the operator who submitted product for review.
        default: null
      - name: management_fee_bps_annual
        type: integer
        source: input
        description: Management fee, annualized basis points (1 bp = 0.01%). Applied daily as bps/365.
      - name: custodian_fee_bps_annual
        type: integer
        source: input
        description: Custodian fee, annualized basis points.
      - name: sales_service_fee_bps_annual
        type: integer
        source: input
        description: Sales-service fee, annualized basis points.
      - name: subscription_fee_tiers
        type: array
        source: input
        description: |
          Ordered ascending by min_amount_cents. Each entry = {min_amount_cents, max_amount_cents (null = open),
          rate_bps}. Applied to single-order subscription gross amount.
      - name: redemption_fee_tiers
        type: array
        source: input
        description: |
          Ordered ascending by min_holding_days. Each entry = {min_holding_days, max_holding_days (null = open),
          rate_bps}. Applied to redemption gross amount based on FIFO holding-day buckets.
      - name: back_end_load_enabled
        type: boolean
        source: input
        description: If true, subscription fee is deferred to redemption (back-end load model); subscription_fee_tiers used at redemption.
        default: false
      - name: conversion_fee_bps
        type: integer
        source: input
        description: Flat fee in bps charged on conversion source-side amount.
      - name: large_redemption_threshold_pct_bps
        type: integer
        source: input
        description: Single-day redemption shares as bps of fund total_outstanding_shares above which large-redemption rules apply.
        default: 1000
      - name: min_subscription_amount_cents
        type: integer
        source: input
        description: Minimum gross amount for a single subscription order.
      - name: max_subscription_amount_cents
        type: integer
        source: input
        description: Maximum gross amount for a single subscription order. Null = unlimited.
        default: null
      - name: min_redemption_shares
        type: integer
        source: input
        description: Minimum shares for a single redemption order. Stored in 1e-4 share units (i.e., shares * 10000).
      - name: confirmation_cycle_days
        type: integer
        source: computed
        description: T+N confirmation cycle. EQUITY/HYBRID=2, BOND=1, MONEY_MARKET=0, QDII=3.
      - name: total_outstanding_shares
        type: integer
        source: computed
        description: Sum of all Holding.shares across investors in 1e-4 share units. Mutates on subscription confirm, redemption confirm, dividend reinvest.
        default: 0
      - name: portfolio_market_value_cents
        type: integer
        source: input
        description: T-day end-of-day portfolio market value reported by custodian.
        default: 0
      - name: portfolio_accrued_income_cents
        type: integer
        source: input
        description: T-day accrued bond coupons / dividend receivables reported by custodian.
        default: 0

  - name: NavSnapshot
    parent: Fund
    common_fields: false
    fields:
      - name: fund_id
        type: string
        source: input
        description: FK to Fund.
      - name: nav_date
        type: datetime
        source: input
        description: T-date the NAV applies to (UTC date, fractional digits zero).
      - name: published_at
        type: datetime
        source: system
        description: Timestamp NAV was published (T+1).
      - name: gross_assets_cents
        type: integer
        source: computed
        description: portfolio_market_value + accrued_income at T-day.
      - name: management_fee_accrued_cents
        type: integer
        source: computed
        description: Daily management fee deducted at T+1.
      - name: custodian_fee_accrued_cents
        type: integer
        source: computed
        description: Daily custodian fee deducted at T+1.
      - name: sales_service_fee_accrued_cents
        type: integer
        source: computed
        description: Daily sales-service fee deducted at T+1.
      - name: net_assets_cents
        type: integer
        source: computed
        description: gross_assets - sum_of_fees.
      - name: shares_outstanding_at_nav
        type: integer
        source: computed
        description: Snapshot of total_outstanding_shares at NAV cutoff (T-day end).
      - name: nav_per_share_micros
        type: integer
        source: computed
        description: net_assets_cents * 1e6 / shares_outstanding_at_nav, in micros (1e-6 CNY) per share, rounded HALF_UP at 6 decimals before storing as integer micros.
      - name: status
        type: enum
        source: system
        description: NAV publication state.
        default: PROVISIONAL
        constraints: "PROVISIONAL | PUBLISHED | ADJUSTED"
      - name: adjustment_reason
        type: string
        source: input
        description: Free-text rationale provided when ADJUSTED.
        default: null

  - name: Order
    parent: Fund
    common_fields: true
    fields:
      - name: fund_id
        type: string
        source: input
        description: FK to Fund.
      - name: investor_id
        type: string
        source: input
        description: FK to Investor.
      - name: order_type
        type: enum
        source: input
        description: Operation kind.
        constraints: "SUBSCRIBE | REDEEM | CONVERT"
      - name: target_fund_id
        type: string
        source: input
        description: FK to destination Fund (CONVERT only); must differ from fund_id.
        default: null
      - name: gross_amount_cents
        type: integer
        source: input
        description: Investor-supplied gross cash for SUBSCRIBE; null for REDEEM/CONVERT (driven by shares).
        default: null
      - name: requested_shares
        type: integer
        source: input
        description: Investor-supplied shares (1e-4 unit) for REDEEM/CONVERT; null for SUBSCRIBE.
        default: null
      - name: submitted_at
        type: datetime
        source: system
        description: Server time at order creation.
      - name: trade_date
        type: datetime
        source: computed
        description: T-date assigned by acceptance-window rule (see calc.assign_trade_date).
      - name: confirm_date
        type: datetime
        source: computed
        description: trade_date + Fund.confirmation_cycle_days (calendar days).
      - name: status
        type: enum
        source: system
        description: Order lifecycle.
        default: SUBMITTED
        constraints: "SUBMITTED | ACCEPTED | CONFIRMED | REJECTED | CANCELLED | LARGE_REDEMPTION_DEFERRED"
      - name: confirmed_nav_per_share_micros
        type: integer
        source: computed
        description: NAV used at confirmation. SUBSCRIBE/REDEEM use trade_date NAV.
        default: null
      - name: confirmed_shares
        type: integer
        source: computed
        description: Shares minted (SUBSCRIBE) or burned (REDEEM/CONVERT source). 1e-4 unit.
        default: null
      - name: confirmed_amount_cents
        type: integer
        source: computed
        description: Net cash settled to/from investor.
        default: null
      - name: subscription_fee_cents
        type: integer
        source: computed
        description: Front-end subscription fee charged. 0 if back_end_load_enabled.
        default: null
      - name: redemption_fee_cents
        type: integer
        source: computed
        description: Front-end redemption fee charged.
        default: null
      - name: back_end_load_fee_cents
        type: integer
        source: computed
        description: Deferred subscription fee collected at redemption (back-end model).
        default: null
      - name: conversion_fee_cents
        type: integer
        source: computed
        description: Conversion fee charged at source-side (CONVERT only).
        default: null
      - name: large_redemption_pct_bps
        type: integer
        source: computed
        description: Order shares as bps of fund total_outstanding_shares at trade_date end.
        default: null
      - name: rejection_error_id
        type: string
        source: system
        description: Error id captured when status=REJECTED.
        default: null
      - name: idempotency_key
        type: string
        source: input
        description: Client-supplied unique key per (investor_id, idempotency_key); replays return original Order.

  - name: Holding
    parent: Investor
    common_fields: true
    fields:
      - name: investor_id
        type: string
        source: input
        description: FK to Investor.
      - name: fund_id
        type: string
        source: input
        description: FK to Fund.
      - name: shares
        type: integer
        source: computed
        description: Total shares held in this fund (1e-4 unit). Aggregate over LotEntry.
        default: 0
      - name: cost_basis_cents
        type: integer
        source: computed
        description: Sum of LotEntry.cost_cents for active lots; used for back-end load + tax calculation.
        default: 0

  - name: LotEntry
    parent: Holding
    common_fields: false
    fields:
      - name: holding_id
        type: string
        source: input
        description: FK to Holding.
      - name: order_id
        type: string
        source: input
        description: FK to the Order (SUBSCRIBE or DIVIDEND_REINVEST or CONVERT-target) that created this lot.
      - name: acquired_at
        type: datetime
        source: system
        description: Confirmation date of the originating subscribe/convert/reinvest. Used for holding-period bucketing.
      - name: shares
        type: integer
        source: input
        description: Lot shares (1e-4 unit). Decreases on FIFO redemption.
      - name: cost_cents
        type: integer
        source: input
        description: Original net cost for the lot (post front-end fees). Decreases proportionally on FIFO redemption.
      - name: status
        type: enum
        source: system
        description: Lot lifecycle.
        default: OPEN
        constraints: "OPEN | DEPLETED"

  - name: DividendPlan
    parent: Fund
    common_fields: true
    fields:
      - name: fund_id
        type: string
        source: input
        description: FK to Fund.
      - name: announcement_date
        type: datetime
        source: input
        description: Date plan publicly announced.
      - name: record_date
        type: datetime
        source: input
        description: Holders on this date are eligible. MUST be >= announcement_date.
      - name: ex_dividend_date
        type: datetime
        source: input
        description: Date NAV is reduced by dividend per share. MUST be record_date + 1 calendar day.
      - name: payment_date
        type: datetime
        source: input
        description: Date cash/reinvest shares hit investors. MUST be >= ex_dividend_date.
      - name: dividend_per_share_micros
        type: integer
        source: input
        description: Gross dividend per share, in micros.
      - name: status
        type: enum
        source: system
        description: Plan lifecycle.
        default: ANNOUNCED
        constraints: "ANNOUNCED | EX_DIVIDEND | PAID | CANCELLED"
      - name: tax_rate_bps_domestic
        type: integer
        source: input
        description: Withholding tax rate in bps for DOMESTIC investors.
      - name: tax_rate_bps_foreign
        type: integer
        source: input
        description: Withholding tax rate in bps for FOREIGN investors.

  - name: DividendDistribution
    parent: DividendPlan
    common_fields: false
    fields:
      - name: dividend_plan_id
        type: string
        source: input
        description: FK to DividendPlan.
      - name: investor_id
        type: string
        source: input
        description: FK to Investor.
      - name: eligible_shares
        type: integer
        source: computed
        description: Holding.shares snapshot at record_date end.
      - name: gross_dividend_cents
        type: integer
        source: computed
        description: eligible_shares * dividend_per_share_micros / 1e10 (rounded HALF_UP at cents).
      - name: tax_withheld_cents
        type: integer
        source: computed
        description: Tax based on investor.tax_resident_status. EXEMPT = 0.
      - name: net_dividend_cents
        type: integer
        source: computed
        description: gross_dividend_cents - tax_withheld_cents.
      - name: option
        type: enum
        source: input
        description: Investor's distribution choice. Defaults to CASH.
        default: CASH
        constraints: "CASH | REINVEST"
      - name: reinvested_shares
        type: integer
        source: computed
        description: For REINVEST, net_dividend_cents * 1e6 / ex_div NAV (1e-4 share unit, rounded HALF_DOWN). 0 for CASH.
        default: 0

  - name: ReconciliationRun
    parent: null
    common_fields: true
    fields:
      - name: as_of_date
        type: datetime
        source: input
        description: T-date being reconciled.
      - name: scope
        type: enum
        source: input
        description: Which reconciliation pair this run covers.
        constraints: "TA_VS_CUSTODIAN | TA_VS_CHANNEL | TA_VS_BANK"
      - name: external_records
        type: array
        source: input
        description: |
          Array of {ref_id, side, amount_cents, shares} attested by the counterparty for as_of_date.
          ref_id matches Order.id or DividendDistribution.id.
      - name: status
        type: enum
        source: system
        description: Run lifecycle.
        default: OPEN
        constraints: "OPEN | EXCEPTIONS_FOUND | RESOLVED | CLOSED"
      - name: total_internal_amount_cents
        type: integer
        source: computed
        description: Sum of internal SETTLED ledger entries for as_of_date in scope.
        default: 0
      - name: total_external_amount_cents
        type: integer
        source: computed
        description: Sum of external_records amounts.
        default: 0
      - name: net_break_cents
        type: integer
        source: computed
        description: total_internal - total_external (signed).
        default: 0

  - name: ReconciliationException
    parent: ReconciliationRun
    common_fields: false
    fields:
      - name: reconciliation_run_id
        type: string
        source: input
        description: FK to ReconciliationRun.
      - name: ref_id
        type: string
        source: input
        description: Identifier of the disputed order/distribution.
      - name: kind
        type: enum
        source: system
        description: Exception class.
        constraints: "MISSING_INTERNAL | MISSING_EXTERNAL | AMOUNT_MISMATCH | SHARE_MISMATCH"
      - name: internal_amount_cents
        type: integer
        source: system
        description: Internal value (null if MISSING_INTERNAL).
        default: null
      - name: external_amount_cents
        type: integer
        source: system
        description: External value (null if MISSING_EXTERNAL).
        default: null
      - name: resolution_status
        type: enum
        source: system
        description: Exception lifecycle.
        default: OPEN
        constraints: "OPEN | ADJUSTED | WAIVED"
      - name: adjustment_amount_cents
        type: integer
        source: input
        description: Operator-provided correction amount for ADJUSTED resolution.
        default: null

  - name: SettlementInstruction
    parent: ReconciliationRun
    common_fields: false
    fields:
      - name: reconciliation_run_id
        type: string
        source: input
        description: FK to ReconciliationRun (the run that generated it).
      - name: target_system
        type: enum
        source: input
        description: Downstream system this instruction is dispatched to.
        constraints: "BANK | CUSTODIAN | TA | REGULATOR"
      - name: instruction_type
        type: enum
        source: input
        description: Operation requested.
        constraints: "DEBIT | CREDIT | TRANSFER | REPORT"
      - name: amount_cents
        type: integer
        source: input
        description: Settlement amount.
      - name: dispatched_at
        type: datetime
        source: system
        description: Time instruction was emitted.

  - name: AuditLog
    parent: null
    common_fields: false
    fields:
      - name: actor_user_id
        type: string
        source: system
        description: X-User-ID from request header.
      - name: actor_role
        type: string
        source: system
        description: X-User-Role from request header.
      - name: action
        type: enum
        source: system
        description: Audited action class.
        constraints: "ORDER_STATUS_CHANGE | NAV_PUBLISHED | NAV_ADJUSTED | DIVIDEND_EXECUTED | RECONCILIATION_RESOLVED | FUND_SHELF_CHANGE"
      - name: subject_entity
        type: string
        source: system
        description: Entity name impacted.
      - name: subject_id
        type: string
        source: system
        description: ID of the impacted entity.
      - name: from_state
        type: string
        source: system
        description: Prior state value (or prior numeric for adjustments).
        default: null
      - name: to_state
        type: string
        source: system
        description: New state value (or new numeric).
        default: null
      - name: payload_json
        type: object
        source: system
        description: Free-form structured context (deltas, reasons).

  - name: Clock
    parent: null
    common_fields: false
    fields:
      - name: now
        type: datetime
        source: system
        description: Singleton (id="clock"). Server's authoritative wall clock; monotonically advances via POST /_clock/advance.

# =============================================================================
# 1.2 State Machines
# =============================================================================
state_machines:

  # ---- Fund (branching with revert) ----
  - entity: Fund
    initial_state: DRAFT
    terminal_states: [OFF_SHELF]
    transitions:
      - from: DRAFT
        to: UNDER_REVIEW
        trigger: "POST /funds/{id}/submit-for-review"
        actor: ProductOperator
        preconditions:
          - "All required fields populated (fund_code, fund_type, risk_rating, fee bps, tier arrays)"
        side_effects:
          - "Fund.shelf_creator_actor_id := X-User-ID (locked for SoD check)"
      - from: UNDER_REVIEW
        to: ON_SHELF
        trigger: "POST /funds/{id}/approve-shelf"
        actor: ComplianceReviewer
        preconditions:
          - "X-User-ID != Fund.shelf_creator_actor_id (segregation of duties)"
          - "subscription_fee_tiers and redemption_fee_tiers non-empty and non-overlapping"
        side_effects:
          - "Fund.shelf_review_actor_id := X-User-ID"
          - "Fund.confirmation_cycle_days computed from fund_type (calc.confirmation_cycle_days_for_type)"
          - "AuditLog FUND_SHELF_CHANGE: UNDER_REVIEW -> ON_SHELF"
      - from: UNDER_REVIEW
        to: DRAFT
        trigger: "POST /funds/{id}/reject-shelf"
        actor: ComplianceReviewer
        preconditions:
          - "X-User-ID != Fund.shelf_creator_actor_id"
        side_effects:
          - "Fund.shelf_creator_actor_id := null (allow new creator on re-submit)"
          - "AuditLog FUND_SHELF_CHANGE: UNDER_REVIEW -> DRAFT"
      - from: ON_SHELF
        to: SUSPENDED
        trigger: "POST /funds/{id}/suspend"
        actor: ComplianceReviewer
        preconditions: []
        side_effects:
          - "All Order rows for this fund with status=SUBMITTED transition to REJECTED with rejection_error_id=ERR_FUND_SUSPENDED (cascade hop 1)"
          - "Cascading: each REJECTED SUBSCRIBE Order frees its reserved cash on the Investor — not held in this scaffold; documented for completeness"
          - "AuditLog FUND_SHELF_CHANGE: ON_SHELF -> SUSPENDED"
      - from: SUSPENDED
        to: ON_SHELF
        trigger: "POST /funds/{id}/resume"
        actor: ComplianceReviewer
        preconditions: []
        side_effects:
          - "AuditLog FUND_SHELF_CHANGE: SUSPENDED -> ON_SHELF"
      - from: ON_SHELF
        to: OFF_SHELF
        trigger: "POST /funds/{id}/off-shelf"
        actor: ComplianceReviewer
        preconditions:
          - "Fund.total_outstanding_shares == 0"
        side_effects:
          - "AuditLog FUND_SHELF_CHANGE: ON_SHELF -> OFF_SHELF"
      - from: SUSPENDED
        to: OFF_SHELF
        trigger: "POST /funds/{id}/off-shelf"
        actor: ComplianceReviewer
        preconditions:
          - "Fund.total_outstanding_shares == 0"
        side_effects:
          - "AuditLog FUND_SHELF_CHANGE: SUSPENDED -> OFF_SHELF"

  # ---- Order (branching with deferred large-redemption loop) ----
  - entity: Order
    initial_state: SUBMITTED
    terminal_states: [CONFIRMED, REJECTED, CANCELLED]
    transitions:
      - from: SUBMITTED
        to: ACCEPTED
        trigger: "system: trade-date assignment immediately on POST /orders (calc.assign_trade_date)"
        actor: system
        preconditions:
          - "Fund.status == ON_SHELF"
          - "Investor.kyc_status == APPROVED"
          - "Suitability: Investor.risk_tolerance index >= Fund.risk_rating index (e.g., R3 fund needs C3 or higher)"
          - "Fund.allowed_country_codes empty OR contains Investor.country_code"
          - "Order amount/share within Fund single-order limits"
          - "For SUBSCRIBE: Investor.cash_balance_cents >= gross_amount_cents (reservation)"
          - "For REDEEM/CONVERT: Holding.shares >= requested_shares"
        side_effects:
          - "Order.trade_date := calc.assign_trade_date(submitted_at)"
          - "Order.confirm_date := trade_date + Fund.confirmation_cycle_days"
          - "Order.status := ACCEPTED (atomically with SUBMITTED->ACCEPTED in same request)"
          - "AuditLog ORDER_STATUS_CHANGE: SUBMITTED -> ACCEPTED"
      - from: SUBMITTED
        to: REJECTED
        trigger: "system: synchronous validation failure on POST /orders"
        actor: system
        preconditions:
          - "Any precondition above fails"
        side_effects:
          - "Order.rejection_error_id captured"
          - "AuditLog ORDER_STATUS_CHANGE: SUBMITTED -> REJECTED"
      - from: ACCEPTED
        to: CANCELLED
        trigger: "POST /orders/{id}/cancel"
        actor: Investor
        preconditions:
          - "Clock.now < trade_date_cutoff (15:00 of trade_date)"
          - "X-User-ID == Order.investor_id"
        side_effects:
          - "AuditLog ORDER_STATUS_CHANGE: ACCEPTED -> CANCELLED"
      - from: ACCEPTED
        to: LARGE_REDEMPTION_DEFERRED
        trigger: "system: at NAV publication, REDEEM order whose pct_bps >= Fund.large_redemption_threshold_pct_bps"
        actor: system
        preconditions:
          - "order_type == REDEEM"
          - "calc.large_redemption_pct (large_redemption_pct_bps) >= Fund.large_redemption_threshold_pct_bps"
        side_effects:
          - "Order.large_redemption_pct_bps captured"
          - "Order.confirm_date := original_confirm_date + 1 calendar day (one-day deferral)"
          - "AuditLog ORDER_STATUS_CHANGE: ACCEPTED -> LARGE_REDEMPTION_DEFERRED"
      - from: LARGE_REDEMPTION_DEFERRED
        to: CONFIRMED
        trigger: "system: deferred re-evaluation on next NAV publication"
        actor: system
        preconditions:
          - "Clock.now >= Order.confirm_date"
          - "NavSnapshot for new trade_date has status=PUBLISHED"
        side_effects:
          - "Order.confirmed_nav_per_share_micros := NavSnapshot.nav_per_share_micros (deferred trade_date)"
          - "Order.confirmed_shares, redemption_fee_cents, back_end_load_fee_cents, confirmed_amount_cents computed"
          - "Holding.shares -= confirmed_shares (FIFO LotEntry burn) — cascade hop 1"
          - "LotEntry.shares decreased FIFO; depleted lots flip OPEN -> DEPLETED — cascade hop 2"
          - "Fund.total_outstanding_shares -= confirmed_shares — cascade hop 3"
          - "Investor.cash_balance_cents += confirmed_amount_cents"
          - "AuditLog ORDER_STATUS_CHANGE: LARGE_REDEMPTION_DEFERRED -> CONFIRMED"
      - from: ACCEPTED
        to: CONFIRMED
        trigger: "system: NAV publication for trade_date triggers confirmation if confirm_date reached"
        actor: system
        preconditions:
          - "Clock.now >= Order.confirm_date"
          - "NavSnapshot for trade_date has status=PUBLISHED"
          - "If REDEEM: large_redemption_pct_bps < Fund.large_redemption_threshold_pct_bps"
        side_effects:
          - "Order.confirmed_nav_per_share_micros := NavSnapshot.nav_per_share_micros"
          - "Order fees and amounts computed (calc.subscription_fee, calc.redemption_fee_with_holding_period, calc.back_end_load_fee, calc.conversion_fee)"
          - "For SUBSCRIBE: new LotEntry created (cascade hop 1); Holding.shares += confirmed_shares (cascade hop 2); Fund.total_outstanding_shares += confirmed_shares (cascade hop 3); Investor.cash_balance_cents -= gross_amount_cents"
          - "For REDEEM: FIFO burn LotEntry; Holding.shares -= confirmed_shares; Fund.total_outstanding_shares -= confirmed_shares; Investor.cash_balance_cents += confirmed_amount_cents"
          - "For CONVERT: source-side burn (target Fund creates new LotEntry — cross-aggregate hop)"
          - "AuditLog ORDER_STATUS_CHANGE: ACCEPTED -> CONFIRMED"

  # ---- NavSnapshot (linear with adjust loop, captures non-linear via adjust) ----
  - entity: NavSnapshot
    initial_state: PROVISIONAL
    terminal_states: []
    transitions:
      - from: PROVISIONAL
        to: PUBLISHED
        trigger: "POST /funds/{id}/nav/publish"
        actor: NavOperator
        preconditions:
          - "X-User-ID != Fund.shelf_review_actor_id (SoD: NAV operator and shelf reviewer must differ)"
          - "Clock.now >= nav_date + 1 calendar day (T+1 rule)"
          - "All input fields (gross_assets, fees) computed"
        side_effects:
          - "NavSnapshot.published_at := Clock.now"
          - "Triggers NAV-confirmation pass on all ACCEPTED Orders with trade_date == nav_date (cascade hop 1: Order ACCEPTED -> CONFIRMED or LARGE_REDEMPTION_DEFERRED, hop 2: Holding.shares mutate, hop 3: Fund.total_outstanding_shares mutate)"
          - "AuditLog NAV_PUBLISHED: PROVISIONAL -> PUBLISHED"
      - from: PUBLISHED
        to: ADJUSTED
        trigger: "POST /funds/{id}/nav/{nav_date}/adjust"
        actor: ComplianceReviewer
        preconditions:
          - "adjustment_reason non-empty"
          - "No DividendPlan with ex_dividend_date == nav_date in EX_DIVIDEND or PAID state"
        side_effects:
          - "NavSnapshot fields recomputed with corrected inputs; audit trail captures before/after"
          - "AuditLog NAV_ADJUSTED: PUBLISHED -> ADJUSTED"

  # ---- DividendPlan ----
  - entity: DividendPlan
    initial_state: ANNOUNCED
    terminal_states: [PAID, CANCELLED]
    transitions:
      - from: ANNOUNCED
        to: EX_DIVIDEND
        trigger: "system: Clock.now date >= ex_dividend_date and POST /dividend-plans/{id}/mark-ex-dividend"
        actor: system
        preconditions:
          - "Clock.now >= ex_dividend_date (date portion)"
          - "Fund.status == ON_SHELF"
        side_effects:
          - "Snapshot eligible Holding.shares for each investor at record_date end into DividendDistribution rows"
          - "Compute gross_dividend, tax_withheld, net_dividend per investor"
          - "AuditLog DIVIDEND_EXECUTED: ANNOUNCED -> EX_DIVIDEND"
      - from: EX_DIVIDEND
        to: PAID
        trigger: "POST /dividend-plans/{id}/execute-payment"
        actor: NavOperator
        preconditions:
          - "Clock.now >= payment_date"
          - "NavSnapshot for ex_dividend_date is PUBLISHED"
        side_effects:
          - "For each DividendDistribution: if option=CASH, Investor.cash_balance_cents += net_dividend_cents (cascade hop 1)"
          - "For each REINVEST: compute reinvested_shares from net/ex-div NAV, create LotEntry (cascade hop 1), Holding.shares += reinvested_shares (cascade hop 2), Fund.total_outstanding_shares += reinvested_shares (cascade hop 3)"
          - "AuditLog DIVIDEND_EXECUTED: EX_DIVIDEND -> PAID"
      - from: ANNOUNCED
        to: CANCELLED
        trigger: "POST /dividend-plans/{id}/cancel"
        actor: ComplianceReviewer
        preconditions:
          - "Clock.now < ex_dividend_date"
        side_effects:
          - "No-op on holdings"
          - "AuditLog DIVIDEND_EXECUTED: ANNOUNCED -> CANCELLED"

  # ---- ReconciliationRun ----
  - entity: ReconciliationRun
    initial_state: OPEN
    terminal_states: [CLOSED]
    transitions:
      - from: OPEN
        to: EXCEPTIONS_FOUND
        trigger: "POST /reconciliations/{id}/run-match"
        actor: ClearingOperator
        preconditions:
          - "ReconciliationRun.external_records non-empty"
        side_effects:
          - "Compare internal SETTLED ledger vs external_records; create ReconciliationException rows"
          - "Update total_internal_amount_cents, total_external_amount_cents, net_break_cents"
      - from: OPEN
        to: RESOLVED
        trigger: "POST /reconciliations/{id}/run-match (when zero exceptions)"
        actor: ClearingOperator
        preconditions:
          - "All internal SETTLED records matched 1:1 with external_records (amount equal AND share equal where applicable)"
        side_effects:
          - "net_break_cents := 0"
      - from: EXCEPTIONS_FOUND
        to: RESOLVED
        trigger: "POST /reconciliations/{id}/finalize"
        actor: ClearingOperator
        preconditions:
          - "All ReconciliationException rows have resolution_status IN {ADJUSTED, WAIVED}"
        side_effects:
          - "Compensating-action invariant: sum of ADJUSTED exception adjustments must restore net_break_cents to 0 (calc.reconciliation_invariant)"
      - from: RESOLVED
        to: CLOSED
        trigger: "POST /reconciliations/{id}/close-and-instruct"
        actor: ClearingOperator
        preconditions:
          - "X-User-ID != ReconciliationRun.created_by (SoD: closer must differ from opener)"
        side_effects:
          - "Generate SettlementInstruction rows for each target_system based on net positions"
          - "Emit RemoteEvent rows for BANK/CUSTODIAN/TA/REGULATOR sync"
          - "AuditLog RECONCILIATION_RESOLVED: RESOLVED -> CLOSED"

  # ---- ReconciliationException ----
  - entity: ReconciliationException
    initial_state: OPEN
    terminal_states: [ADJUSTED, WAIVED]
    transitions:
      - from: OPEN
        to: ADJUSTED
        trigger: "POST /reconciliations/{id}/exceptions/{eid}/adjust"
        actor: ClearingOperator
        preconditions:
          - "adjustment_amount_cents provided"
          - "Parent ReconciliationRun.status == EXCEPTIONS_FOUND"
        side_effects:
          - "ReconciliationRun.net_break_cents updated by adjustment delta (cascade hop 1)"
      - from: OPEN
        to: WAIVED
        trigger: "POST /reconciliations/{id}/exceptions/{eid}/waive"
        actor: ClearingOperator
        preconditions:
          - "Parent ReconciliationRun.status == EXCEPTIONS_FOUND"
          - "exception.kind != AMOUNT_MISMATCH (cannot waive numeric breaks)"
        side_effects:
          - "Logged but does not affect net_break_cents (forces ADJUSTED for invariant restoration)"

# =============================================================================
# 1.2.1 Concurrency Rules
# =============================================================================
concurrency_rules:
  - scenario: "Two operators simultaneously approve and reject the same Fund's shelf review"
    guarantee: "Exactly one transition wins; loser observes Fund already moved out of UNDER_REVIEW"
    error_id: ERR_INVALID_STATE
    http_status: 409
    serialization: "First-writer-wins on Fund.status; loser reads new state"

  - scenario: "Two simultaneous POST /orders with identical (investor_id, idempotency_key)"
    guarantee: "Server creates exactly one Order; both responses return that single Order body"
    error_id: ERR_IDEMPOTENCY_REPLAY
    http_status: 409
    serialization: "First-writer-wins on (investor_id, idempotency_key) tuple; replay with same key returns 200 + original Order"

  - scenario: "Cancel order race against system NAV-publication confirmation pass"
    guarantee: "Exactly one of cancel-or-confirm wins; loser sees terminal state"
    error_id: ERR_INVALID_STATE
    http_status: 409
    serialization: "First-writer-wins on Order.status; cancel valid only while ACCEPTED"

  - scenario: "Two NavOperators simultaneously POST publish for same (fund_id, nav_date)"
    guarantee: "At most one NavSnapshot transitions to PUBLISHED; second is rejected"
    error_id: ERR_NAV_ALREADY_PUBLISHED
    http_status: 409
    serialization: "First-writer-wins on NavSnapshot.status (PROVISIONAL -> PUBLISHED is one-shot)"

  - scenario: "Two ClearingOperators simultaneously close the same ReconciliationRun"
    guarantee: "At most one closes; loser sees CLOSED state"
    error_id: ERR_INVALID_STATE
    http_status: 409
    serialization: "First-writer-wins on ReconciliationRun.status"

  - scenario: "Investor cancels order while another concurrent cancel for same order arrives"
    guarantee: "Exactly one cancel succeeds; second sees CANCELLED state"
    error_id: ERR_INVALID_STATE
    http_status: 409
    serialization: "First-writer-wins on Order.status"

# =============================================================================
# 1.3 Calculation Rules
# =============================================================================
calculations:

  - name: assign_trade_date
    trigger: "Order.SUBMITTED -> ACCEPTED (system, on POST /orders)"
    algorithm: threshold
    formula: |
      cutoff = combine(submitted_at.date(), 15:00 UTC)
      if submitted_at < cutoff:
          trade_date = submitted_at.date()
      else:  # submitted_at >= cutoff
          trade_date = submitted_at.date() + 1 calendar day
      # No business-day calendar in scaffold; calendar days throughout.
    input_set: "submitted_at (single Order)"
    constants:
      ACCEPTANCE_CUTOFF: "15:00 UTC"
    precision: "date precision; boundary at exactly 15:00 inclusive shifts to next day"

  - name: confirmation_cycle_days_for_type
    trigger: "Fund.UNDER_REVIEW -> ON_SHELF (system, sets Fund.confirmation_cycle_days)"
    algorithm: threshold
    formula: |
      table = {EQUITY: 2, HYBRID: 2, BOND: 1, MONEY_MARKET: 0, QDII: 3}
      Fund.confirmation_cycle_days = table[Fund.fund_type]
    input_set: "Fund.fund_type"
    constants:
      MONEY_MARKET_T: 0
      BOND_T: 1
      EQUITY_T: 2
      HYBRID_T: 2
      QDII_T: 3
    precision: "integer days"

  - name: nav_per_share
    trigger: "POST /funds/{id}/nav/publish (NavSnapshot.PROVISIONAL -> PUBLISHED)"
    algorithm: aggregation
    formula: |
      gross_assets = portfolio_market_value_cents + portfolio_accrued_income_cents
      mgmt_fee  = round_half_up(gross_assets * mgmt_bps  / 10000 / 365)
      cust_fee  = round_half_up(gross_assets * cust_bps  / 10000 / 365)
      sales_fee = round_half_up(gross_assets * sales_bps / 10000 / 365)
      net_assets = gross_assets - mgmt_fee - cust_fee - sales_fee
      shares_outstanding = Fund.total_outstanding_shares  // snapshot at T-day end
      if shares_outstanding == 0:
          nav_per_share_micros = 1_000_000  // initial NAV = 1.000000 CNY
      else:
          # Dimensional: nav_micros = net_assets_cents * 1e8 / shares_outstanding_1e4
          # Derivation: nav_cny = net_assets_cents/100 / (shares_outstanding/1e4)
          #                     = net_assets_cents * 1e4 / (100 * shares_outstanding)
          #                     = net_assets_cents * 100 / shares_outstanding (CNY)
          # nav_micros = nav_cny * 1e6 = net_assets_cents * 1e8 / shares_outstanding
          # Pinned rounding order: compute net_assets first (cents, HALF_UP per fee), THEN divide and round HALF_UP at micros.
          nav_per_share_micros = round_half_up(net_assets * 100_000_000 / shares_outstanding)
    input_set: "Fund.portfolio_market_value_cents, portfolio_accrued_income_cents, fee bps, total_outstanding_shares"
    constants:
      INITIAL_NAV_MICROS: 1000000
      DAYS_PER_YEAR: 365
      BPS_DENOM: 10000
    precision: "cents intermediate (HALF_UP), micros final (HALF_UP)"

  - name: subscription_fee
    trigger: "Order.ACCEPTED -> CONFIRMED (SUBSCRIBE, front-end model)"
    algorithm: tiered_pricing
    formula: |
      # Dimensional analysis: cash_cents = shares_1e4 / 1e4 * nav_micros / 1e6 * 100 (cents/CNY)
      #                                = shares_1e4 * nav_micros / 1e8
      # Therefore: shares_1e4 = cash_cents * 1e8 / nav_micros
      if Fund.back_end_load_enabled:
          subscription_fee_cents = 0
          confirmed_shares = round_half_up(gross_amount_cents * 100_000_000 / nav_micros)  // 1e-4 share unit
      else:
          # Locate tier by gross_amount_cents:
          for tier in subscription_fee_tiers (ascending):
              if tier.min_amount_cents <= gross_amount_cents AND
                 (tier.max_amount_cents is null OR gross_amount_cents < tier.max_amount_cents):
                  rate = tier.rate_bps
                  break
          subscription_fee_cents = round_half_up(gross_amount_cents * rate / 10_000)
          net_amount = gross_amount_cents - subscription_fee_cents
          confirmed_shares = round_half_up(net_amount * 100_000_000 / nav_micros)
      confirmed_amount_cents = gross_amount_cents  // investor cash debited
    input_set: "Order.gross_amount_cents, Fund.subscription_fee_tiers, Fund.back_end_load_enabled, NavSnapshot.nav_per_share_micros"
    constants:
      BPS_DENOM: 10000
    precision: "fee in cents (HALF_UP); shares in 1e-4 unit (HALF_UP); pinned rounding order: fee first, then net, then shares"
    variants:
      - name: front_end
        when: "Fund.back_end_load_enabled == false"
        difference: "Fee deducted up-front; shares minted from net amount"
      - name: back_end
        when: "Fund.back_end_load_enabled == true"
        difference: "Fee deferred to redemption; shares minted from gross amount; same gross_amount produces MORE shares than front-end"

  - name: redemption_fee_with_holding_period
    trigger: "Order.ACCEPTED -> CONFIRMED (REDEEM)"
    algorithm: tiered_pricing
    formula: |
      # FIFO over OPEN LotEntry rows for (investor_id, fund_id), oldest acquired_at first.
      # Dimensional: redeem_cents = take_1e4 * nav_micros / 1e8 (HALF_UP at cents).
      remaining_shares = requested_shares
      gross_redeem_amount_cents = round_half_up(requested_shares * nav_micros / 100_000_000)
      total_fee = 0
      total_back_end_load = 0
      lots_consumed = []
      for lot in lots_sorted_by_acquired_at_asc:
          if remaining_shares == 0: break
          take = min(lot.shares, remaining_shares)
          holding_days = floor((Order.trade_date - lot.acquired_at).days)
          # Locate redemption tier by holding_days:
          for tier in redemption_fee_tiers (ascending min_holding_days):
              if tier.min_holding_days <= holding_days AND
                 (tier.max_holding_days is null OR holding_days < tier.max_holding_days):
                  rate = tier.rate_bps
                  break
          lot_amount = round_half_up(take * nav_micros / 100_000_000)
          lot_fee = round_half_up(lot_amount * rate / 10_000)
          total_fee += lot_fee
          # Back-end load if applicable on this lot's original purchase
          if Fund.back_end_load_enabled:
              # Use cost_cents proportional share of the lot:
              lot_cost = round_half_up(lot.cost_cents * take / lot.shares)
              # Subscription tier rate based on original lot_cost:
              for stier in subscription_fee_tiers:
                  if stier.min_amount_cents <= lot_cost AND
                     (stier.max_amount_cents is null OR lot_cost < stier.max_amount_cents):
                      srate = stier.rate_bps
                      break
              total_back_end_load += round_half_up(lot_cost * srate / 10_000)
          remaining_shares -= take
          lots_consumed.append((lot, take))
      redemption_fee_cents = total_fee
      back_end_load_fee_cents = total_back_end_load if Fund.back_end_load_enabled else 0
      confirmed_amount_cents = gross_redeem_amount_cents - redemption_fee_cents - back_end_load_fee_cents
      confirmed_shares = requested_shares
      # Pinned rounding order: per-lot fee rounded, then summed (NOT sum-then-round).
    input_set: "Order.requested_shares, NavSnapshot.nav_per_share_micros, Fund.redemption_fee_tiers, OPEN LotEntry rows for (investor, fund) sorted by acquired_at ASC"
    constants:
      BPS_DENOM: 10000
    precision: "Per-lot fee rounded HALF_UP first, then summed. Back-end load uses original lot cost, not current value."

  - name: large_redemption_pct
    trigger: "system: at NAV publication, evaluating REDEEM Order.ACCEPTED"
    algorithm: threshold
    formula: |
      pct_bps = round_half_up(Order.requested_shares * 10000 / Fund.total_outstanding_shares_at_trade_date_end)
      if pct_bps >= Fund.large_redemption_threshold_pct_bps:
          defer to LARGE_REDEMPTION_DEFERRED (next trade_date)
      # Boundary: pct_bps == threshold triggers deferral (>=).
    input_set: "Order.requested_shares, Fund.total_outstanding_shares at trade_date end"
    constants:
      BPS_DENOM: 10000
    precision: "integer bps; HALF_UP"

  - name: dividend_distribution
    trigger: "DividendPlan.ANNOUNCED -> EX_DIVIDEND"
    algorithm: aggregation
    formula: |
      # For each Investor with Holding.shares > 0 at record_date end:
      eligible_shares = Holding.shares  // snapshot, in 1e-4 share unit
      # Dimensional: cents = (shares_1e4 / 1e4) * (dividend_micros / 1e6) * 100 = shares_1e4 * dividend_micros / 1e8
      gross_dividend_cents = round_half_up(eligible_shares * dividend_per_share_micros / 100_000_000)
      if Investor.tax_resident_status == EXEMPT:
          tax_withheld_cents = 0
      elif Investor.tax_resident_status == DOMESTIC:
          tax_withheld_cents = round_half_up(gross_dividend_cents * tax_rate_bps_domestic / 10_000)
      else:  # FOREIGN
          tax_withheld_cents = round_half_up(gross_dividend_cents * tax_rate_bps_foreign / 10_000)
      net_dividend_cents = gross_dividend_cents - tax_withheld_cents
      if option == REINVEST:
          # shares_1e4 = cash_cents * 1e8 / nav_micros_at_ex_div, but HALF_DOWN for reinvest.
          reinvested_shares = round_half_down(net_dividend_cents * 100_000_000 / nav_micros_at_ex_div)
          // Note: REINVEST uses HALF_DOWN to ensure no over-issuance of shares.
      else:
          reinvested_shares = 0
    input_set: "Holding.shares at record_date, DividendPlan, Investor.tax_resident_status, NavSnapshot at ex_dividend_date"
    constants:
      BPS_DENOM: 10000
      MICROS_PER_CENT: 10000
      SHARE_UNIT_DENOM: 10000
    precision: "Cash HALF_UP at cents; reinvest shares HALF_DOWN at 1e-4 unit. Pinned: tax computed from gross (NOT from net)."

  - name: reconciliation_invariant
    trigger: "ReconciliationRun.EXCEPTIONS_FOUND -> RESOLVED (POST /finalize)"
    algorithm: aggregation
    formula: |
      # Conserved quantity: net_break_cents must equal 0 after adjustments.
      sum_adjustments = sum(exception.adjustment_amount_cents for exception in exceptions where resolution_status=ADJUSTED)
      # Sign convention: ADJUSTED amount represents the correction added to internal side.
      restored_net_break = original_net_break_cents - sum_adjustments
      if restored_net_break != 0:
          reject finalize with ERR_RECONCILIATION_INVARIANT_BROKEN
      # WAIVED exceptions do NOT contribute to the sum (forces ADJUSTED for AMOUNT_MISMATCH).
    input_set: "Original net_break_cents, all ReconciliationException rows under run"
    constants: {}
    precision: "exact cents; no rounding"

  - name: holding_cost_basis_recompute
    trigger: "FIFO LotEntry burn during Order.CONFIRMED (REDEEM/CONVERT) and on LotEntry creation (SUBSCRIBE/REINVEST)"
    algorithm: aggregation
    formula: |
      Holding.shares = sum(lot.shares for lot in OPEN LotEntry rows for (investor, fund))
      Holding.cost_basis_cents = sum(lot.cost_cents for lot in OPEN LotEntry rows for (investor, fund))
      # Recomputed atomically with each lot mutation.
    input_set: "OPEN LotEntry rows for (investor_id, fund_id)"
    constants: {}
    precision: "exact integer; no rounding"

# =============================================================================
# 1.4 Validation Rules (ordered)
# =============================================================================
validations:
  - priority: 1
    category: auth
    check: "X-User-ID and X-User-Role headers present"
    error_id: ERR_AUTH_HEADERS_MISSING
    http_status: 401
    applies_to: all

  - priority: 2
    category: auth
    check: "X-User-Role permitted for endpoint per RBAC matrix"
    error_id: ERR_FORBIDDEN
    http_status: 403
    applies_to: all

  - priority: 3
    category: existence
    check: "Path resources exist (fund_id, order_id, investor_id, dividend_plan_id, reconciliation_run_id, exception_id) — left-to-right"
    error_id: ERR_NOT_FOUND
    http_status: 404
    applies_to: all

  - priority: 4
    category: state
    check: "Idempotency replay on POST /orders: same (investor_id, idempotency_key) returns existing order with 200"
    error_id: ERR_IDEMPOTENCY_REPLAY
    http_status: 409
    applies_to: "POST /orders"

  - priority: 5
    category: state
    check: "Target resource in valid state for operation (e.g., Fund.status == ON_SHELF for orders; Order.status == ACCEPTED for cancel)"
    error_id: ERR_INVALID_STATE
    http_status: 409
    applies_to: all

  - priority: 6
    category: business_safety
    check: "Segregation of duties: Fund shelf approver != shelf creator"
    error_id: ERR_SOD_VIOLATION_SHELF
    http_status: 403
    applies_to: "POST /funds/{id}/approve-shelf, POST /funds/{id}/reject-shelf"

  - priority: 7
    category: business_safety
    check: "Segregation of duties: NAV publisher != Fund shelf reviewer"
    error_id: ERR_SOD_VIOLATION_NAV
    http_status: 403
    applies_to: "POST /funds/{id}/nav/publish"

  - priority: 8
    category: business_safety
    check: "Segregation of duties: Reconciliation closer != run creator"
    error_id: ERR_SOD_VIOLATION_RECON
    http_status: 403
    applies_to: "POST /reconciliations/{id}/close-and-instruct"

  - priority: 9
    category: business_safety
    check: "Investor KYC approved before any order"
    error_id: ERR_KYC_NOT_APPROVED
    http_status: 422
    applies_to: "POST /orders"

  - priority: 10
    category: business_safety
    check: "Investor risk_tolerance index >= Fund.risk_rating index (suitability match). C1<C2<C3<C4<C5; R1<R2<R3<R4<R5; allowed iff Cn >= Rn."
    error_id: ERR_SUITABILITY_MISMATCH
    http_status: 422
    applies_to: "POST /orders"

  - priority: 11
    category: business_safety
    check: "Investor.country_code in Fund.allowed_country_codes (or empty array = unrestricted)"
    error_id: ERR_REGION_RESTRICTED
    http_status: 422
    applies_to: "POST /orders"

  - priority: 12
    category: business_referential
    check: "Conversion target_fund_id != source fund_id; both ON_SHELF; investor suitable for target"
    error_id: ERR_CONVERSION_INVALID_TARGET
    http_status: 422
    applies_to: "POST /orders (CONVERT)"

  - priority: 13
    category: business_temporal
    check: "Cancel only before trade_date 15:00 UTC cutoff"
    error_id: ERR_CANCEL_WINDOW_CLOSED
    http_status: 409
    applies_to: "POST /orders/{id}/cancel"

  - priority: 14
    category: business_temporal
    check: "NAV publish only when Clock.now >= nav_date + 1 day (T+1)"
    error_id: ERR_NAV_T_PLUS_1_NOT_ELAPSED
    http_status: 409
    applies_to: "POST /funds/{id}/nav/publish"

  - priority: 15
    category: business_temporal
    check: "DividendPlan.record_date >= announcement_date AND ex_dividend_date == record_date+1 AND payment_date >= ex_dividend_date"
    error_id: ERR_DIVIDEND_DATE_INVALID
    http_status: 422
    applies_to: "POST /dividend-plans"

  - priority: 16
    category: business_constraint
    check: "Order amount within [Fund.min_subscription_amount_cents, Fund.max_subscription_amount_cents] (SUBSCRIBE) or shares >= Fund.min_redemption_shares (REDEEM)"
    error_id: ERR_ORDER_LIMIT_VIOLATED
    http_status: 422
    applies_to: "POST /orders"

  - priority: 17
    category: business_constraint
    check: "Subscription/Redemption fee tiers non-overlapping and ordered ascending"
    error_id: ERR_FEE_TIERS_INVALID
    http_status: 422
    applies_to: "POST /funds, POST /funds/{id}/approve-shelf"

  - priority: 18
    category: business_fiscal
    check: "Investor.cash_balance_cents >= gross_amount_cents (SUBSCRIBE)"
    error_id: ERR_INSUFFICIENT_CASH
    http_status: 422
    applies_to: "POST /orders (SUBSCRIBE)"

  - priority: 19
    category: business_fiscal
    check: "Holding.shares >= requested_shares (REDEEM/CONVERT)"
    error_id: ERR_INSUFFICIENT_SHARES
    http_status: 422
    applies_to: "POST /orders (REDEEM, CONVERT)"

  - priority: 20
    category: business_constraint
    check: "Reconciliation finalize: all exceptions resolved AND sum of ADJUSTED equals original net_break_cents"
    error_id: ERR_RECONCILIATION_INVARIANT_BROKEN
    http_status: 409
    applies_to: "POST /reconciliations/{id}/finalize"

  - priority: 21
    category: business_constraint
    check: "Fund off-shelf only if total_outstanding_shares == 0"
    error_id: ERR_FUND_HAS_HOLDERS
    http_status: 409
    applies_to: "POST /funds/{id}/off-shelf"

  - priority: 22
    category: business_constraint
    check: "Cannot WAIVE an AMOUNT_MISMATCH exception (forces ADJUSTED)"
    error_id: ERR_WAIVE_NOT_ALLOWED
    http_status: 422
    applies_to: "POST /reconciliations/{id}/exceptions/{eid}/waive"

# =============================================================================
# 1.5 API Endpoints
# =============================================================================
endpoints:
  # --- Investor ---
  - method: POST
    path: "/investors"
    description: "Create investor."
    roles: [PlatformAdmin]
    code: 201
    input: [legal_name, investor_type, country_code, risk_tolerance, tax_resident_status, bank_account_number]
    output: Investor

  - method: POST
    path: "/investors/{id}/approve-kyc"
    description: "KYC approve investor."
    roles: [ComplianceReviewer]
    code: 200
    input: []
    output: Investor

  - method: POST
    path: "/investors/{id}/credit-cash"
    description: "Test/admin: credit cash to investor account (simulates bank deposit)."
    roles: [PlatformAdmin]
    code: 200
    input: [amount_cents]
    output: Investor

  - method: GET
    path: "/investors/{id}"
    description: "Read investor."
    roles: [PlatformAdmin, ComplianceReviewer, Investor]
    code: 200
    input: []
    output: Investor

  # --- Fund ---
  - method: POST
    path: "/funds"
    description: "Draft a new fund product."
    roles: [ProductOperator]
    code: 201
    input: [fund_code, fund_name, fund_type, risk_rating, allowed_country_codes, management_fee_bps_annual, custodian_fee_bps_annual, sales_service_fee_bps_annual, subscription_fee_tiers, redemption_fee_tiers, back_end_load_enabled, conversion_fee_bps, large_redemption_threshold_pct_bps, min_subscription_amount_cents, max_subscription_amount_cents, min_redemption_shares]
    output: Fund

  - method: POST
    path: "/funds/{id}/submit-for-review"
    description: "Submit fund for compliance review."
    roles: [ProductOperator]
    code: 200
    input: []
    output: Fund

  - method: POST
    path: "/funds/{id}/approve-shelf"
    description: "Approve fund for on-shelf sales."
    roles: [ComplianceReviewer]
    code: 200
    input: []
    output: Fund

  - method: POST
    path: "/funds/{id}/reject-shelf"
    description: "Reject fund back to DRAFT."
    roles: [ComplianceReviewer]
    code: 200
    input: []
    output: Fund

  - method: POST
    path: "/funds/{id}/suspend"
    description: "Suspend fund sales (cascades to open orders)."
    roles: [ComplianceReviewer]
    code: 200
    input: []
    output: Fund

  - method: POST
    path: "/funds/{id}/resume"
    description: "Resume fund sales."
    roles: [ComplianceReviewer]
    code: 200
    input: []
    output: Fund

  - method: POST
    path: "/funds/{id}/off-shelf"
    description: "Permanently de-list fund (must have zero holders)."
    roles: [ComplianceReviewer]
    code: 200
    input: []
    output: Fund

  - method: GET
    path: "/funds"
    description: "List funds (filterable by status, fund_type)."
    roles: [PlatformAdmin, ComplianceReviewer, ProductOperator, NavOperator, ClearingOperator, Investor]
    code: 200
    input: ["status?", "fund_type?", "limit?", "offset?"]
    output: "Fund[]"

  - method: GET
    path: "/funds/{id}"
    description: "Read fund (includes computed confirmation_cycle_days, total_outstanding_shares)."
    roles: [PlatformAdmin, ComplianceReviewer, ProductOperator, NavOperator, ClearingOperator, Investor]
    code: 200
    input: []
    output: Fund

  # --- NAV ---
  - method: POST
    path: "/funds/{id}/nav/publish"
    description: "Publish T+1 NAV for given nav_date."
    roles: [NavOperator]
    code: 201
    input: [nav_date, portfolio_market_value_cents, portfolio_accrued_income_cents]
    output: NavSnapshot
    side_effects: [calc.nav_per_share, cascade.confirm_orders, cascade.evaluate_large_redemption]

  - method: POST
    path: "/funds/{id}/nav/{nav_date}/adjust"
    description: "Adjust an already-published NAV."
    roles: [ComplianceReviewer]
    code: 200
    input: [portfolio_market_value_cents, portfolio_accrued_income_cents, adjustment_reason]
    output: NavSnapshot

  - method: GET
    path: "/funds/{id}/nav/{nav_date}"
    description: "Read NAV snapshot."
    roles: [PlatformAdmin, ComplianceReviewer, NavOperator, Investor]
    code: 200
    input: []
    output: NavSnapshot

  # --- Order ---
  - method: POST
    path: "/orders"
    description: "Submit subscription/redemption/conversion order."
    roles: [Investor]
    code: 201
    input: [fund_id, order_type, "target_fund_id?", "gross_amount_cents?", "requested_shares?", idempotency_key]
    output: Order
    side_effects: [calc.assign_trade_date, validation.suitability, validation.region]

  - method: POST
    path: "/orders/{id}/cancel"
    description: "Cancel an ACCEPTED order before cutoff."
    roles: [Investor]
    code: 200
    input: []
    output: Order

  - method: GET
    path: "/orders/{id}"
    description: "Read order."
    roles: [Investor, ClearingOperator, ComplianceReviewer, PlatformAdmin]
    code: 200
    input: []
    output: Order

  - method: GET
    path: "/orders"
    description: "List orders (filterable by investor_id, fund_id, status, trade_date)."
    roles: [ClearingOperator, ComplianceReviewer, PlatformAdmin, Investor]
    code: 200
    input: ["investor_id?", "fund_id?", "status?", "trade_date?", "limit?", "offset?"]
    output: "Order[]"

  # --- Holdings ---
  - method: GET
    path: "/investors/{id}/holdings"
    description: "List investor's holdings (with cost basis)."
    roles: [Investor, ComplianceReviewer, PlatformAdmin]
    code: 200
    input: []
    output: "Holding[]"

  # --- Dividend ---
  - method: POST
    path: "/funds/{id}/dividend-plans"
    description: "Announce dividend plan."
    roles: [ProductOperator]
    code: 201
    input: [announcement_date, record_date, ex_dividend_date, payment_date, dividend_per_share_micros, tax_rate_bps_domestic, tax_rate_bps_foreign]
    output: DividendPlan

  - method: POST
    path: "/dividend-plans/{id}/mark-ex-dividend"
    description: "Snapshot eligible holdings and compute distributions."
    roles: [NavOperator]
    code: 200
    input: []
    output: DividendPlan

  - method: POST
    path: "/dividend-plans/{id}/distributions/{investor_id}/set-option"
    description: "Investor sets CASH or REINVEST option (after ex-dividend, before payment)."
    roles: [Investor]
    code: 200
    input: [option]
    output: DividendDistribution

  - method: POST
    path: "/dividend-plans/{id}/execute-payment"
    description: "Pay dividend (cash or reinvest) on or after payment_date."
    roles: [NavOperator]
    code: 200
    input: []
    output: DividendPlan

  - method: POST
    path: "/dividend-plans/{id}/cancel"
    description: "Cancel an announced dividend before ex_dividend_date."
    roles: [ComplianceReviewer]
    code: 200
    input: []
    output: DividendPlan

  - method: GET
    path: "/dividend-plans/{id}"
    description: "Read dividend plan + distributions."
    roles: [PlatformAdmin, ComplianceReviewer, NavOperator, Investor]
    code: 200
    input: []
    output: DividendPlan

  # --- Reconciliation ---
  - method: POST
    path: "/reconciliations"
    description: "Open a reconciliation run with external counterparty data."
    roles: [ClearingOperator]
    code: 201
    input: [as_of_date, scope, external_records]
    output: ReconciliationRun

  - method: POST
    path: "/reconciliations/{id}/run-match"
    description: "Match internal vs external; create exceptions or move to RESOLVED."
    roles: [ClearingOperator]
    code: 200
    input: []
    output: ReconciliationRun

  - method: POST
    path: "/reconciliations/{id}/exceptions/{eid}/adjust"
    description: "Adjust an exception with corrective amount."
    roles: [ClearingOperator]
    code: 200
    input: [adjustment_amount_cents]
    output: ReconciliationException

  - method: POST
    path: "/reconciliations/{id}/exceptions/{eid}/waive"
    description: "Waive an exception (only non-AMOUNT_MISMATCH)."
    roles: [ClearingOperator]
    code: 200
    input: []
    output: ReconciliationException

  - method: POST
    path: "/reconciliations/{id}/finalize"
    description: "Finalize: enforce invariant; move to RESOLVED."
    roles: [ClearingOperator]
    code: 200
    input: []
    output: ReconciliationRun

  - method: POST
    path: "/reconciliations/{id}/close-and-instruct"
    description: "Close run; emit settlement instructions to BANK/CUSTODIAN/TA/REGULATOR."
    roles: [ClearingOperator]
    code: 200
    input: []
    output: ReconciliationRun

  - method: GET
    path: "/reconciliations/{id}"
    description: "Read reconciliation run + exceptions + instructions."
    roles: [ClearingOperator, ComplianceReviewer, PlatformAdmin]
    code: 200
    input: []
    output: ReconciliationRun

  # --- Audit log ---
  - method: GET
    path: "/audit-logs"
    description: "Query audit log entries (filter by action, subject_entity, subject_id)."
    roles: [ComplianceReviewer, PlatformAdmin]
    code: 200
    input: ["action?", "subject_entity?", "subject_id?", "limit?", "offset?"]
    output: "AuditLog[]"

  # --- Test-driving endpoints (clock + sweeps) ---
  - method: POST
    path: "/_clock/advance"
    description: "Advance authoritative server clock to given ISO8601 timestamp (monotonic)."
    roles: [PlatformAdmin]
    code: 200
    input: [now]
    output: Clock

  - method: GET
    path: "/_clock"
    description: "Read current server clock."
    roles: [PlatformAdmin, ComplianceReviewer, NavOperator, ClearingOperator, ProductOperator, Investor]
    code: 200
    input: []
    output: Clock

# =============================================================================
# 1.6 Errors
# =============================================================================
errors:
  - id: ERR_AUTH_HEADERS_MISSING
    http: 401
    condition: "X-User-ID or X-User-Role header missing or empty."

  - id: ERR_FORBIDDEN
    http: 403
    condition: "Role not permitted for endpoint."

  - id: ERR_NOT_FOUND
    http: 404
    condition: "Path resource does not exist."

  - id: ERR_INVALID_STATE
    http: 409
    condition: "Target resource not in valid state for operation."

  - id: ERR_IDEMPOTENCY_REPLAY
    http: 409
    condition: "Same (investor_id, idempotency_key) submitted concurrently or serially with conflicting body — server returns existing order with 200 (replay) or 409 if body differs."

  - id: ERR_SOD_VIOLATION_SHELF
    http: 403
    condition: "Same actor created and approved/rejected fund shelf review."

  - id: ERR_SOD_VIOLATION_NAV
    http: 403
    condition: "NAV operator equals fund's shelf reviewer."

  - id: ERR_SOD_VIOLATION_RECON
    http: 403
    condition: "Reconciliation closer equals run creator."

  - id: ERR_KYC_NOT_APPROVED
    http: 422
    condition: "Investor.kyc_status != APPROVED at order time."

  - id: ERR_SUITABILITY_MISMATCH
    http: 422
    condition: "Investor risk tolerance below fund risk rating."

  - id: ERR_REGION_RESTRICTED
    http: 422
    condition: "Investor country not in fund's allowed_country_codes."

  - id: ERR_CONVERSION_INVALID_TARGET
    http: 422
    condition: "Target fund missing, equal to source, off-shelf, or unsuitable for investor."

  - id: ERR_CANCEL_WINDOW_CLOSED
    http: 409
    condition: "Clock past trade_date 15:00 UTC cutoff."

  - id: ERR_NAV_T_PLUS_1_NOT_ELAPSED
    http: 409
    condition: "POST /funds/{id}/nav/publish before T+1 day boundary."

  - id: ERR_NAV_ALREADY_PUBLISHED
    http: 409
    condition: "NavSnapshot for (fund, nav_date) already PUBLISHED."

  - id: ERR_DIVIDEND_DATE_INVALID
    http: 422
    condition: "Date ordering wrong: record_date < announcement_date OR ex_dividend_date != record_date+1 OR payment_date < ex_dividend_date."

  - id: ERR_ORDER_LIMIT_VIOLATED
    http: 422
    condition: "Order amount or shares outside fund min/max bounds."

  - id: ERR_FEE_TIERS_INVALID
    http: 422
    condition: "Fee tiers overlap or are not ascending."

  - id: ERR_INSUFFICIENT_CASH
    http: 422
    condition: "Investor.cash_balance_cents < gross_amount_cents on subscribe."

  - id: ERR_INSUFFICIENT_SHARES
    http: 422
    condition: "Holding.shares < requested_shares on redeem/convert."

  - id: ERR_RECONCILIATION_INVARIANT_BROKEN
    http: 409
    condition: "Sum of ADJUSTED exceptions does not restore net_break_cents to 0 at finalize."

  - id: ERR_FUND_HAS_HOLDERS
    http: 409
    condition: "Off-shelf attempted on fund with total_outstanding_shares > 0."

  - id: ERR_WAIVE_NOT_ALLOWED
    http: 422
    condition: "Attempt to waive an AMOUNT_MISMATCH exception."

  - id: ERR_FUND_SUSPENDED
    http: 409
    condition: "Operation rejected because fund moved to SUSPENDED (used for cascaded order rejection)."

  - id: ERR_VERSION_CONFLICT
    http: 409
    condition: "Optimistic-concurrency version mismatch on PATCH/PUT/state-change endpoints."

  - id: ERR_CLOCK_NOT_MONOTONIC
    http: 422
    condition: "POST /_clock/advance with now <= current Clock.now."

# =============================================================================
# 1.7 RBAC
# =============================================================================
roles:
  - name: PlatformAdmin
    description: "System operator handling provisioning (investor onboarding, cash credits, clock control)."
    identity: opaque
    exclusive_operations:
      - "POST /investors"
      - "POST /investors/{id}/credit-cash"
      - "POST /_clock/advance"
    shared_operations:
      - "GET (most read endpoints)"

  - name: ProductOperator
    description: "Designs fund products and dividend plans; submits funds for review."
    identity: opaque
    exclusive_operations:
      - "POST /funds"
      - "POST /funds/{id}/submit-for-review"
      - "POST /funds/{id}/dividend-plans"
    shared_operations:
      - "GET /funds, GET /funds/{id}"

  - name: ComplianceReviewer
    description: "Approves/rejects fund shelf, suspends/resumes funds, KYC approvals, NAV adjustments, dividend cancellation."
    identity: opaque
    exclusive_operations:
      - "POST /funds/{id}/approve-shelf"
      - "POST /funds/{id}/reject-shelf"
      - "POST /funds/{id}/suspend"
      - "POST /funds/{id}/resume"
      - "POST /funds/{id}/off-shelf"
      - "POST /funds/{id}/nav/{nav_date}/adjust"
      - "POST /investors/{id}/approve-kyc"
      - "POST /dividend-plans/{id}/cancel"
      - "GET /audit-logs"
    shared_operations:
      - "GET (broad read access)"

  - name: NavOperator
    description: "Publishes NAV; executes ex-dividend and dividend payments."
    identity: opaque
    exclusive_operations:
      - "POST /funds/{id}/nav/publish"
      - "POST /dividend-plans/{id}/mark-ex-dividend"
      - "POST /dividend-plans/{id}/execute-payment"
    shared_operations:
      - "GET (NAV/dividend reads)"

  - name: ClearingOperator
    description: "Runs reconciliation; resolves exceptions; closes runs and emits settlement instructions."
    identity: opaque
    exclusive_operations:
      - "POST /reconciliations"
      - "POST /reconciliations/{id}/run-match"
      - "POST /reconciliations/{id}/exceptions/{eid}/adjust"
      - "POST /reconciliations/{id}/exceptions/{eid}/waive"
      - "POST /reconciliations/{id}/finalize"
      - "POST /reconciliations/{id}/close-and-instruct"
    shared_operations:
      - "GET /reconciliations/{id}, GET /orders"

  - name: Investor
    description: "End-user submitting orders, picking dividend options, viewing own holdings."
    identity: "entity_backed:Investor"
    exclusive_operations:
      - "POST /orders"
      - "POST /orders/{id}/cancel"
      - "POST /dividend-plans/{id}/distributions/{investor_id}/set-option"
    shared_operations:
      - "GET /investors/{self_id}, GET /investors/{self_id}/holdings, GET /orders (own), GET /funds, GET /dividend-plans"
