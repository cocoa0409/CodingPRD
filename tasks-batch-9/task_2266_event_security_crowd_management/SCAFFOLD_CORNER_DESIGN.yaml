        1, required_screening_lanes 2, minimum_staffing_cost_floor_cents 36000); logical clock 2026-09-01T00:00:00Z
      - a second RiskAssessment on the same event, still in DRAFT, with threat ELEVATED, protest POSSIBLE, crowd_profile GENERAL_ADMISSION, layout_complexity_score 3 and history_incident_rate 0
      setup_api_calls:
