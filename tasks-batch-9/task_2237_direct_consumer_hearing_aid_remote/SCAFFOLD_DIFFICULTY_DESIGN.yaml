    - name: repair_order_fork_join_repaired_versus_unrepairable
      grounds:
        - "state_machines.RepairOrder.IN_REPAIR_to_REPAIRED"
        - "state_machines.RepairOrder.IN_REPAIR_to_UNREPAIRABLE"
        - "state_machines.RepairOrder.UNREPAIRABLE_to_ESCALATED_TO_WARRANTY"
        - "calculations.repair_sla_credit"
        - "calculations.trial_days_used"
      distinguishing_aspect: >-
        FORK-JOIN on one entity: IN_REPAIR forks to REPAIRED or UNREPAIRABLE and the
        two branches close with DIFFERENT side effects that both credit the plan and
        both resume the trial. Branch A (RETURNED_TO_PATIENT, turnaround_days 9,
        sla_credit_cents 4000) creates no WarrantyClaim and leaves the Device
        WITH_PATIENT; branch B (ESCALATED_TO_WARRANTY, turnaround_days 7,
        sla_credit_cents 2000) mints exactly one WarrantyClaim in FILED with
        claim_kind DEFECT and leaves the Device REPLACED. A linear machine cannot
        produce two different terminal shapes from the same predecessor state.
      test_recipe:
        setup:
          - "Empty DB; clock at the 2026-08-01T00:00:00Z startup default."
          - "StatePolicy CA with trial_period_days 30, one InventoryPool NEO/M/OPEN with 5 units, one IN_STOCK NEO device."
          - "Patient age 71 screens clean; order list_price_cents 100000 with no discount/accessory/shipping; a PREMIUM CarePlanSubscription with base_fee_cents 9900 is enrolled before delivery so both repairs get sla_days 5 and PREMIUM_CREDIT_MULT 2.0."
