  - section: endpoints
    instances:
      - name: list_pagination_defaults_and_status_filter
        claim_type: listing
        grounds: [endpoints]
        distinguishing_aspect: "GET /recovery-cases honors limit/offset with total_count and has_more in the envelope; the status filter narrows the set server-side."
        test_recipe:
          setup: ["two OPENED cases on two loans"]
          setup_api_calls:
            - { call: "POST /borrowers", payload: { full_name: "PG1", state_code: "CA", email: "pg1@x.com" }, as: RecoveryManager, captures: { b1: $.data.id } }
            - { call: "POST /loan-accounts", payload: { borrower_id: "${b1}", vin: "VIN00000000000065", governing_state_code: "CA", principal_balance_cents: 500000, apr_bps: 900, monthly_payment_cents: 20000, missed_installments: 2, accrued_interest_cents: 8000, late_fees_cents: 3000 }, as: RecoveryManager, captures: { l1: $.data.id } }
            - { call: "POST /recovery-cases", payload: { loan_account_id: "${l1}", default_reason: "one" }, as: RecoveryManager, as_user_id: "rm_1", captures: { c1: $.data.id, c1_v: $.data.version } }
            - { call: "POST /recovery-cases/${c1}/cure-notices", payload: { expected_recovery_case_version: "${c1_v}" }, as: RecoveryManager }
            - { call: "POST /borrowers", payload: { full_name: "PG2", state_code: "CA", email: "pg2@x.com" }, as: RecoveryManager, captures: { b2: $.data.id } }
            - { call: "POST /loan-accounts", payload: { borrower_id: "${b2}", vin: "VIN00000000000066", governing_state_code: "CA", principal_balance_cents: 500000, apr_bps: 900, monthly_payment_cents: 20000, missed_installments: 2, accrued_interest_cents: 8000, late_fees_cents: 3000 }, as: RecoveryManager, captures: { l2: $.data.id } }
            - { call: "POST /recovery-cases", payload: { loan_account_id: "${l2}", default_reason: "two" }, as: RecoveryManager, as_user_id: "rm_1", captures: { c2: $.data.id } }
          trigger:
            - { call: "GET /recovery-cases", payload: { limit: 1 }, as: RecoveryManager }
            - { call: "GET /recovery-cases", payload: { status: "OPENED" }, as: RecoveryManager }
          assert:
            - "limit=1 page: exactly 1 data row, total_count == 2, has_more == true"
            - "status=OPENED filter: exactly 1 row (case ${c2}); case ${c1} is CURE_PENDING and excluded"
            - "default page (no params): limit 10 applied, has_more == false"
      - name: fk_reverse_lists_are_reachable
        claim_type: cross_reference_link
        grounds: [entities.LoanAccount.fields.borrower_id, entities.RecoveryCase.fields.loan_account_id]
        distinguishing_aspect: "Every FK chain walks back: GET /borrowers/{id}/loan-accounts finds the loan, GET /loan-accounts/{id}/recovery-cases finds the case — both return arrays."
        test_recipe:
          setup: ["borrower -> loan -> case chain"]
          setup_api_calls:
            - { call: "POST /borrowers", payload: { full_name: "FK", state_code: "CA", email: "fk@x.com" }, as: RecoveryManager, captures: { b_id: $.data.id } }
            - { call: "POST /loan-accounts", payload: { borrower_id: "${b_id}", vin: "VIN00000000000067", governing_state_code: "CA", principal_balance_cents: 500000, apr_bps: 900, monthly_payment_cents: 20000, missed_installments: 2, accrued_interest_cents: 8000, late_fees_cents: 3000 }, as: RecoveryManager, captures: { l_id: $.data.id } }
            - { call: "POST /recovery-cases", payload: { loan_account_id: "${l_id}", default_reason: "fk" }, as: RecoveryManager, as_user_id: "rm_1", captures: { c_id: $.data.id } }
          trigger:
            - { call: "GET /borrowers/${b_id}/loan-accounts", payload: {}, as: RecoveryManager }
            - { call: "GET /loan-accounts/${l_id}/recovery-cases", payload: {}, as: RecoveryManager }
          assert:
            - "borrower reverse list contains exactly loan ${l_id}"
            - "loan reverse list contains exactly case ${c_id}"

  - section: errors
    instances:
      - name: missing_auth_headers_unauthenticated
        claim_type: error_triggerable
        grounds: ["errors[ERR_UNAUTHENTICATED]"]
        distinguishing_aspect: "A request with neither X-User-Role nor X-User-ID is 401 ERR_UNAUTHENTICATED before any role or business check (priority 1)."
        test_recipe:
          setup: ["empty database"]
          setup_api_calls: []
          trigger:
            - { call: "GET /recovery-cases", payload: {}, as: RecoveryManager, captures: { err: $.data.error_id } }
          assert:
            - "with headers the endpoint answers 200; with headers stripped the same request is 401 ERR_UNAUTHENTICATED (test drops the headers on the second call)"
      - name: error_bid_below_reserve_covered
        claim_type: error_triggerable
        grounds: ["errors[ERR_BID_BELOW_RESERVE]"]
        excluded_because:
          difficulty_instance: bid_exactly_at_reserve
          rationale: "Asserted as the failing outcome (gross 1,055,749c) of the named §1.8 boundary instance."
      - name: error_invalid_case_state_covered
        claim_type: error_triggerable
        grounds: ["errors[ERR_INVALID_CASE_STATE]"]
        excluded_because:
          difficulty_instance: state_beats_fiscal_on_cure_payment
          rationale: "Asserted as the winning error of the named §1.8 priority-conflict instance; also the failure half of cure_payment_exactly_at_deadline."
      - name: error_agent_license_mismatch_covered
        claim_type: error_triggerable
        grounds: ["errors[ERR_AGENT_LICENSE_MISMATCH]"]
        excluded_because:
          difficulty_instance: license_beats_capacity_on_assignment
          rationale: "Asserted as the winning error of the named §1.8 priority-conflict instance."
      - name: error_agent_suspended_covered
        claim_type: error_triggerable
        grounds: ["errors[ERR_AGENT_SUSPENDED]"]
        excluded_because:
          difficulty_instance: assignment_accept_requires_agent_active
          rationale: "Asserted as the failure of the named §1.8 cross-entity dependency instance."
      - name: error_field_window_overlap_covered
        claim_type: error_triggerable
        grounds: ["errors[ERR_FIELD_WINDOW_OVERLAP]"]
        excluded_because:
          difficulty_instance: agent_field_window_half_open_adjacency
          rationale: "Asserted as the rejection of the overlapping half-open window in the named §1.8 instance."
      - name: error_auction_window_overlap_covered
        claim_type: error_triggerable
        grounds: ["errors[ERR_AUCTION_WINDOW_OVERLAP]"]
        excluded_because:
          difficulty_instance: auction_listing_closed_interval_gap_required
          rationale: "Asserted as the rejection of the touching closed-interval listing in the named §1.8 instance."

