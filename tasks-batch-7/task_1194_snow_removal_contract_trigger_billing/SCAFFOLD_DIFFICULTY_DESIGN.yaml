# =============================================================================
# §1.8 Scaffold Difficulty Design — Test Targeting Index (task 1194)
# 9 rules x 2 instances. Every recipe starts from empty DB and uses only
# endpoints declared in SCAFFOLD.yaml §1.5.
# =============================================================================
scaffold_difficulty_design:
  # ---------------------------------------------------------------------------
  - rule_id: dual_variant_calc
    instances:
      - name: provisional_preview_vs_final_invoice_push_billing
        grounds:
          - calculations.event_billing_projection
          - calculations.visit_billing_evaluation
          - entities.Contract.fields.unbilled_billable_cents
          - state_machines.ServiceVisit.PENDING_to_BILLABLE_CONFIRMED
        distinguishing_aspect: |
          Dual-variant logic on the INVOICE/BILLING domain: identical visit data yields
          provisional_billable_cents=90000 (REPORTED events counted at reported
          accumulation) while final_billable_cents=0 before verification and 45000 after,
          because the FINAL variant counts only VERIFIED events.
        test_recipe:
          setup:
            - "PER_PUSH contract k1 (trigger 2.0, rate 45000, no photo gate) ACTIVE with site s1"
            - "Two REPORTED storm events e1 (reported 2.6) and e2 (reported 3.0), each with one COMPLETED visit"
            - "e1 will verify at 2.6 (billable); e2 will verify at 1.4 (below trigger)"
          setup_api_calls:
            - { call: "POST /clients", payload: { name: "Acme Properties", credit_limit_cents: 10000000 }, as: OpsDispatcher, captures: { cl1: $.data.id } }
            - { call: "POST /sites", payload: { client_id: "${cl1}", name: "Lot A", address: "1 Main St", region_code: "NE", pavement_area_sqft: 50000, requires_loader: false }, as: OpsDispatcher, captures: { s1: $.data.id } }
            - { call: "POST /contracts", payload: { client_id: "${cl1}", contract_type: "PER_PUSH", season_start: "2026-11-01T00:00:00Z", season_end: "2027-03-31T23:59:59Z", trigger_depth_inches: 2.0, per_push_rate_cents: 45000, require_photo_verification: false }, as: OpsDispatcher, captures: { k1: $.data.id } }
            - { call: "POST /contract-sites", payload: { contract_id: "${k1}", site_id: "${s1}", priority_sequence: 1, completion_target_minutes: 360, salt_included_lbs: 0 }, as: OpsDispatcher, captures: { cs1: $.data.id } }
            - { call: "POST /contracts/${k1}/activate", as: OpsDispatcher }
            - { call: "POST /_clock/set_current_utc", payload: { to_iso8601: "2026-12-10T07:00:00Z" }, as: PlatformAdmin }
            - { call: "POST /storm-events", payload: { region_code: "NE", window_start: "2026-12-10T00:00:00Z", window_end: "2026-12-10T08:00:00Z", reported_accumulation_inches: 2.6, reported_source_name: "NOAA" }, as: OpsDispatcher, captures: { e1: $.data.id } }
            - { call: "POST /storm-events", payload: { region_code: "NE", window_start: "2026-12-12T00:00:00Z", window_end: "2026-12-12T06:00:00Z", reported_accumulation_inches: 3.0, reported_source_name: "NOAA" }, as: OpsDispatcher, captures: { e2: $.data.id } }
            - { call: "POST /visits", payload: { storm_event_id: "${e1}", contract_site_id: "${cs1}", scheduled_start: "2026-12-10T09:00:00Z", scheduled_end: "2026-12-10T10:00:00Z" }, as: OpsDispatcher, captures: { v1: $.data.id } }
            - { call: "POST /visits", payload: { storm_event_id: "${e2}", contract_site_id: "${cs1}", scheduled_start: "2026-12-12T09:00:00Z", scheduled_end: "2026-12-12T10:00:00Z" }, as: OpsDispatcher, captures: { v2: $.data.id } }
            - { call: "POST /_clock/set_current_utc", payload: { to_iso8601: "2026-12-10T09:05:00Z" }, as: PlatformAdmin }
            - { call: "POST /visits/${v1}/start", as: CrewLead }
            - { call: "POST /_clock/set_current_utc", payload: { to_iso8601: "2026-12-10T10:00:00Z" }, as: PlatformAdmin }
            - { call: "POST /visits/${v1}/complete", as: CrewLead }
            - { call: "POST /_clock/set_current_utc", payload: { to_iso8601: "2026-12-12T09:05:00Z" }, as: PlatformAdmin }
            - { call: "POST /visits/${v2}/start", as: CrewLead }
            - { call: "POST /_clock/set_current_utc", payload: { to_iso8601: "2026-12-12T10:00:00Z" }, as: PlatformAdmin }
            - { call: "POST /visits/${v2}/complete", as: CrewLead }
            - { call: "GET /contracts/${k1}/billing-preview", as: OpsDispatcher, captures: { pv_push: $.data.provisional_billable_push_count, pv_cents: $.data.provisional_billable_cents, fv_push: $.data.final_billable_push_count, fv_cents: $.data.final_billable_cents } }
            - { call: "POST /observations", payload: { storm_event_id: "${e1}", source_name: "NOAA", observed_at: "2026-12-10T07:30:00Z", accumulation_inches: 2.5 }, as: PlatformAdmin }
            - { call: "POST /observations", payload: { storm_event_id: "${e1}", source_name: "DTN", observed_at: "2026-12-10T08:00:00Z", accumulation_inches: 2.6 }, as: PlatformAdmin }
            - { call: "POST /storm-events/${e1}/verify", as: OpsDispatcher }
            - { call: "POST /observations", payload: { storm_event_id: "${e2}", source_name: "NOAA", observed_at: "2026-12-12T05:00:00Z", accumulation_inches: 1.5 }, as: PlatformAdmin }
            - { call: "POST /observations", payload: { storm_event_id: "${e2}", source_name: "DTN", observed_at: "2026-12-12T05:30:00Z", accumulation_inches: 1.4 }, as: PlatformAdmin }
            - { call: "POST /storm-events/${e2}/verify", as: OpsDispatcher }
          trigger:
            - { call: "GET /contracts/${k1}/billing-preview", as: OpsDispatcher, captures: { pv2_cents: $.data.provisional_billable_cents, fv2_cents: $.data.final_billable_cents } }
            - { call: "GET /visits/${v1}", as: OpsDispatcher, captures: { v1_billing: $.data.billing_status } }
            - { call: "GET /visits/${v2}", as: OpsDispatcher, captures: { v2_billing: $.data.billing_status } }
          assert:
            - "Pre-verification preview: provisional_billable_push_count == 2 AND provisional_billable_cents == 90000 (both REPORTED events counted at reported accumulation) while final_billable_push_count == 0 AND final_billable_cents == 0 (no VERIFIED events) — identical visit data, two variants, different totals"
            - "After verification: visit ${v1}.billing_status == BILLABLE_CONFIRMED and visit ${v2}.billing_status == NON_BILLABLE (verified 1.4 < trigger 2.0)"
            - "Post-verification preview converges: provisional_billable_cents == 45000 AND final_billable_cents == 45000"

      - name: seasonal_material_actual_vs_normative_min_flip
        grounds:
          - calculations.material_reimbursement_seasonal
          - calculations.material_line_cost
          - entities.SeasonalTrueUp.fields.material_settlement_cents
        distinguishing_aspect: |
          Dual-variant logic on the MATERIAL-COST domain (distinct from billing):
          ACTUAL logged cost (7500) vs AREA_NORMATIVE cap (8200) — settlement bills
          min()=7500; after one more large application the ordering flips and the
          NORMATIVE variant binds (10500 < 17500).
        test_recipe:
          setup:
            - "SEASONAL contract k2 (fee 2000000, cap 5, salt 25c/lb, blend 60c/lb) ACTIVE; site area 40000 sqft; contract-site salt_included_lbs 100"
            - "One COMPLETED visit v3 with three RECORDED applications: salt 100.0 lbs, salt 80.0 lbs, blend 50.0 lbs"
          setup_api_calls:
            - { call: "POST /clients", payload: { name: "Harbor Mgmt", credit_limit_cents: 10000000 }, as: OpsDispatcher, captures: { cl2: $.data.id } }
            - { call: "POST /sites", payload: { client_id: "${cl2}", name: "Pier 9", address: "9 Dock Rd", region_code: "NE", pavement_area_sqft: 40000, requires_loader: false }, as: OpsDispatcher, captures: { s2: $.data.id } }
            - { call: "POST /contracts", payload: { client_id: "${cl2}", contract_type: "SEASONAL", season_start: "2026-11-01T00:00:00Z", season_end: "2026-12-31T23:59:59Z", trigger_depth_inches: 1.0, seasonal_fee_cents: 2000000, seasonal_push_cap: 5, seasonal_overage_rate_cents: 40000, require_photo_verification: false, salt_rate_per_lb_cents: 25, blend_rate_per_lb_cents: 60, brine_rate_per_lb_cents: 35 }, as: OpsDispatcher, captures: { k2: $.data.id } }
            - { call: "POST /contract-sites", payload: { contract_id: "${k2}", site_id: "${s2}", priority_sequence: 1, completion_target_minutes: 480, salt_included_lbs: 100 }, as: OpsDispatcher, captures: { cs2: $.data.id } }
            - { call: "POST /contracts/${k2}/activate", as: OpsDispatcher }
            - { call: "POST /_clock/set_current_utc", payload: { to_iso8601: "2026-12-10T07:00:00Z" }, as: PlatformAdmin }
            - { call: "POST /storm-events", payload: { region_code: "NE", window_start: "2026-12-10T00:00:00Z", window_end: "2026-12-10T08:00:00Z", reported_accumulation_inches: 3.0, reported_source_name: "NOAA" }, as: OpsDispatcher, captures: { e3: $.data.id } }
            - { call: "POST /visits", payload: { storm_event_id: "${e3}", contract_site_id: "${cs2}", scheduled_start: "2026-12-10T09:00:00Z", scheduled_end: "2026-12-10T10:00:00Z" }, as: OpsDispatcher, captures: { v3: $.data.id } }
            - { call: "POST /_clock/set_current_utc", payload: { to_iso8601: "2026-12-10T09:05:00Z" }, as: PlatformAdmin }
            - { call: "POST /visits/${v3}/start", as: CrewLead }
            - { call: "POST /_clock/set_current_utc", payload: { to_iso8601: "2026-12-10T10:00:00Z" }, as: PlatformAdmin }
            - { call: "POST /visits/${v3}/complete", as: CrewLead }
            - { call: "POST /materials", payload: { visit_id: "${v3}", material_type: "ROCK_SALT", quantity_lbs: 100.0 }, as: CrewLead, captures: { m1: $.data.id } }
            - { call: "POST /materials", payload: { visit_id: "${v3}", material_type: "ROCK_SALT", quantity_lbs: 80.0 }, as: CrewLead }
            - { call: "POST /materials", payload: { visit_id: "${v3}", material_type: "ICE_MELT_BLEND", quantity_lbs: 50.0 }, as: CrewLead }
            - { call: "GET /contracts/${k2}/true-up-preview", as: OpsDispatcher, captures: { ma1: $.data.projected_material_actual_cents, mn1: $.data.projected_material_normative_cents, ms1: $.data.projected_material_settlement_cents, al1: $.data.projected_material_allowance_cents } }
          trigger:
            - { call: "POST /materials", payload: { visit_id: "${v3}", material_type: "ROCK_SALT", quantity_lbs: 400.0 }, as: CrewLead }
            - { call: "GET /contracts/${k2}/true-up-preview", as: OpsDispatcher, captures: { ma2: $.data.projected_material_actual_cents, mn2: $.data.projected_material_normative_cents, ms2: $.data.projected_material_settlement_cents } }
          assert:
            - "First preview: projected_material_actual_cents == 7500 (2500+2000+3000 per-line rounded) AND projected_material_normative_cents == 8200 (round(40000*0.0023)*25 = 2300 twice + round(40000*0.0015)*60 = 3600)"
            - "First preview: projected_material_allowance_cents == 2500 (round(100 lbs * 25c)) AND projected_material_settlement_cents == 5000 (min(7500, 8200) - 2500): ACTUAL variant binds"
            - "After the 400-lb application: projected_material_actual_cents == 17500 AND projected_material_normative_cents == 10500 AND projected_material_settlement_cents == 8000 (min(17500, 10500) - 2500): NORMATIVE variant binds — the min() selection flips"

  # ---------------------------------------------------------------------------
  - rule_id: combinatorial_formula
    instances:
      - name: hourly_tiered_charge_with_night_premium
        grounds:
          - calculations.hourly_visit_charge
          - entities.ServiceVisit.fields.billable_minutes
          - entities.ServiceVisit.fields.night_premium_applied
        distinguishing_aspect: |
          Mode (a) combinatorial formula: >= 3 inputs (billable minutes, cumulative
          season tier position, night-window flag) with non-linear interaction
          (ceil-to-6 rounding, marginal tier split at the 120-minute threshold,
          conditional 25% premium applied last) — 22500 vs 9000 cents for two visits
          under one contract, and tier allocation is chronological by actual_start_at
          even though vh2 was created before vh1.
        test_recipe:
          setup:
            - "HOURLY contract k3: rate 12000c/h, tier2 6000c/h, tier threshold 120 min, night premium 0.25, trigger 1.0, no photo gate; ACTIVE with cs3"
            - "Visit vh2 (08:30-09:30) is created BEFORE visit vh1 (05:30-07:00) to prove chronological (not creation-order) tier allocation"
            - "vh1 starts 05:30 (night window) and runs 90 min; vh2 starts 08:30 (day) and runs 60 min; event verifies at 1.6 >= 1.0"
          setup_api_calls:
            - { call: "POST /clients", payload: { name: "Nordic Retail Group", credit_limit_cents: 10000000 }, as: OpsDispatcher, captures: { cl3: $.data.id } }
            - { call: "POST /sites", payload: { client_id: "${cl3}", name: "Mall North", address: "5 Retail Pkwy", region_code: "NE", pavement_area_sqft: 30000, requires_loader: false }, as: OpsDispatcher, captures: { s3: $.data.id } }
            - { call: "POST /contracts", payload: { client_id: "${cl3}", contract_type: "HOURLY", season_start: "2026-11-01T00:00:00Z", season_end: "2027-03-31T23:59:59Z", trigger_depth_inches: 1.0, hourly_rate_cents: 12000, hourly_tier2_rate_cents: 6000, hourly_tier_threshold_minutes: 120, night_premium_pct: 0.25, require_photo_verification: false }, as: OpsDispatcher, captures: { k3: $.data.id } }
            - { call: "POST /contract-sites", payload: { contract_id: "${k3}", site_id: "${s3}", priority_sequence: 1, completion_target_minutes: 720, salt_included_lbs: 0 }, as: OpsDispatcher, captures: { cs3: $.data.id } }
            - { call: "POST /contracts/${k3}/activate", as: OpsDispatcher }
            - { call: "POST /_clock/set_current_utc", payload: { to_iso8601: "2026-12-11T04:30:00Z" }, as: PlatformAdmin }
            - { call: "POST /storm-events", payload: { region_code: "NE", window_start: "2026-12-11T04:00:00Z", window_end: "2026-12-11T06:00:00Z", reported_accumulation_inches: 1.5, reported_source_name: "NOAA" }, as: OpsDispatcher, captures: { e4: $.data.id } }
            - { call: "POST /visits", payload: { storm_event_id: "${e4}", contract_site_id: "${cs3}", scheduled_start: "2026-12-11T08:30:00Z", scheduled_end: "2026-12-11T09:30:00Z" }, as: OpsDispatcher, captures: { vh2: $.data.id } }
            - { call: "POST /visits", payload: { storm_event_id: "${e4}", contract_site_id: "${cs3}", scheduled_start: "2026-12-11T05:30:00Z", scheduled_end: "2026-12-11T07:00:00Z" }, as: OpsDispatcher, captures: { vh1: $.data.id } }
            - { call: "POST /_clock/set_current_utc", payload: { to_iso8601: "2026-12-11T05:30:00Z" }, as: PlatformAdmin }
            - { call: "POST /visits/${vh1}/start", as: CrewLead }
            - { call: "POST /_clock/set_current_utc", payload: { to_iso8601: "2026-12-11T07:00:00Z" }, as: PlatformAdmin }
            - { call: "POST /visits/${vh1}/complete", as: CrewLead }
            - { call: "POST /_clock/set_current_utc", payload: { to_iso8601: "2026-12-11T08:30:00Z" }, as: PlatformAdmin }
            - { call: "POST /visits/${vh2}/start", as: CrewLead }
            - { call: "POST /_clock/set_current_utc", payload: { to_iso8601: "2026-12-11T09:30:00Z" }, as: PlatformAdmin }
            - { call: "POST /visits/${vh2}/complete", as: CrewLead }
            - { call: "POST /observations", payload: { storm_event_id: "${e4}", source_name: "NOAA", observed_at: "2026-12-11T05:00:00Z", accumulation_inches: 1.5 }, as: PlatformAdmin }
            - { call: "POST /observations", payload: { storm_event_id: "${e4}", source_name: "DTN", observed_at: "2026-12-11T05:30:00Z", accumulation_inches: 1.6 }, as: PlatformAdmin }
            - { call: "POST /storm-events/${e4}/verify", as: OpsDispatcher }
          trigger:
            - { call: "GET /visits/${vh1}", as: OpsDispatcher, captures: { vh1_min: $.data.billable_minutes, vh1_night: $.data.night_premium_applied, vh1_amt: $.data.billable_amount_cents, vh1_billing: $.data.billing_status } }
            - { call: "GET /visits/${vh2}", as: OpsDispatcher, captures: { vh2_min: $.data.billable_minutes, vh2_night: $.data.night_premium_applied, vh2_amt: $.data.billable_amount_cents, vh2_billing: $.data.billing_status } }
            - { call: "GET /contracts/${k3}", as: OpsDispatcher, captures: { k3_minutes: $.data.season_billable_minutes } }
          assert:
            - "Visit ${vh1}: billable_minutes == 90, night_premium_applied == true, billing_status == BILLABLE_CONFIRMED, billable_amount_cents == 22500 (90 min all in tier-1: round_half_up(90*12000/60)=18000, premium last: round_half_up(18000*1.25)=22500)"
            - "Visit ${vh2}: billable_minutes == 60, night_premium_applied == false, billable_amount_cents == 9000 (prior cumulative 90 -> tier1 min(120-90,60)=30 min @200c/min=6000 + tier2 30 @100c/min=3000)"
            - "Contract ${k3}.season_billable_minutes == 150"
            - "Tier allocation is chronological by actual_start_at: vh1 (05:30) consumes tier-1 first even though vh2 was created first — vh2, not vh1, bears the tier-2 minutes"

      - name: material_line_rounding_order_pinned
        grounds:
          - calculations.material_line_cost
          - entities.MaterialApplication.fields.line_cost_cents
          - entities.ServiceVisit.fields.material_cost_cents
        distinguishing_aspect: |
          Mode (b) combinatorial formula (distinct mode from the tiered formula):
          nested rounding where order matters — the scaffold pins round-per-line-then-sum,
          so 3 x 1.05 lbs @ 35c/lb yields 3*round_half_up(36.75)=111 cents, while the
          alternative sum-then-round yields round_half_up(110.25)=110 cents.
        test_recipe:
          setup:
            - "PER_PUSH contract k4 (brine rate 35c/lb, trigger 1.0, no photo gate) ACTIVE; one COMPLETED visit v5"
          setup_api_calls:
            - { call: "POST /clients", payload: { name: "Summit Offices", credit_limit_cents: 10000000 }, as: OpsDispatcher, captures: { cl4: $.data.id } }
            - { call: "POST /sites", payload: { client_id: "${cl4}", name: "Tower Deck", address: "77 Hill Ave", region_code: "NE", pavement_area_sqft: 12000, requires_loader: false }, as: OpsDispatcher, captures: { s4: $.data.id } }
            - { call: "POST /contracts", payload: { client_id: "${cl4}", contract_type: "PER_PUSH", season_start: "2026-11-01T00:00:00Z", season_end: "2027-03-31T23:59:59Z", trigger_depth_inches: 1.0, per_push_rate_cents: 45000, require_photo_verification: false, brine_rate_per_lb_cents: 35 }, as: OpsDispatcher, captures: { k4: $.data.id } }
            - { call: "POST /contract-sites", payload: { contract_id: "${k4}", site_id: "${s4}", priority_sequence: 1, completion_target_minutes: 360, salt_included_lbs: 0 }, as: OpsDispatcher, captures: { cs4: $.data.id } }
            - { call: "POST /contracts/${k4}/activate", as: OpsDispatcher }
            - { call: "POST /_clock/set_current_utc", payload: { to_iso8601: "2026-12-10T07:00:00Z" }, as: PlatformAdmin }
            - { call: "POST /storm-events", payload: { region_code: "NE", window_start: "2026-12-10T00:00:00Z", window_end: "2026-12-10T08:00:00Z", reported_accumulation_inches: 1.5, reported_source_name: "NOAA" }, as: OpsDispatcher, captures: { e5: $.data.id } }
            - { call: "POST /visits", payload: { storm_event_id: "${e5}", contract_site_id: "${cs4}", scheduled_start: "2026-12-10T09:00:00Z", scheduled_end: "2026-12-10T10:00:00Z" }, as: OpsDispatcher, captures: { v5: $.data.id } }
            - { call: "POST /_clock/set_current_utc", payload: { to_iso8601: "2026-12-10T09:05:00Z" }, as: PlatformAdmin }
            - { call: "POST /visits/${v5}/start", as: CrewLead }
            - { call: "POST /_clock/set_current_utc", payload: { to_iso8601: "2026-12-10T10:00:00Z" }, as: PlatformAdmin }
            - { call: "POST /visits/${v5}/complete", as: CrewLead }
          trigger:
            - { call: "POST /materials", payload: { visit_id: "${v5}", material_type: "LIQUID_BRINE", quantity_lbs: 1.05 }, as: CrewLead, captures: { ml1: $.data.id, ml1_cost: $.data.line_cost_cents } }
            - { call: "POST /materials", payload: { visit_id: "${v5}", material_type: "LIQUID_BRINE", quantity_lbs: 1.05 }, as: CrewLead, captures: { ml2_cost: $.data.line_cost_cents } }
            - { call: "POST /materials", payload: { visit_id: "${v5}", material_type: "LIQUID_BRINE", quantity_lbs: 1.05 }, as: CrewLead, captures: { ml3_cost: $.data.line_cost_cents } }
            - { call: "GET /visits/${v5}", as: OpsDispatcher, captures: { v5_mat: $.data.material_cost_cents } }
          assert:
            - "Each application line_cost_cents == 37 (round_half_up(1.05 * 35) = round_half_up(36.75) = 37)"
            - "Visit ${v5}.material_cost_cents == 111 — the pinned round-per-line-then-sum order; the sum-then-round alternative would produce 110 and is incorrect"

  # ---------------------------------------------------------------------------
  - rule_id: non_linear_state_machine
    instances:
      - name: storm_event_challenge_reverify_cycle
        grounds:
          - state_machines.StormEvent.VERIFIED_to_CHALLENGED
          - state_machines.StormEvent.CHALLENGED_to_VERIFIED
          - state_machines.ServiceVisit.BILLABLE_CONFIRMED_to_PENDING
          - calculations.verified_accumulation_inches
        distinguishing_aspect: |
          Cyclic machine on StormEvent (REPORTED -> VERIFIED -> CHALLENGED -> VERIFIED):
          re-verification from CHALLENGED is gated on a fresh observation created after
          challenged_at (ERR_NO_NEW_EVIDENCE otherwise), and the cycle flips the visit
          BILLABLE_CONFIRMED -> PENDING -> NON_BILLABLE as the verified value drops below
          trigger.
        test_recipe:
          setup:
            - "PER_PUSH contract (trigger 2.0, rate 45000, no photo gate) ACTIVE; one COMPLETED visit v6 on event e6"
            - "e6 verifies at 2.55 (latest observed_at reading), is challenged by the client within 48h, then re-verifies at 1.50 from a late-arriving ON_SITE_SENSOR observation"
          setup_api_calls:
            - { call: "POST /clients", payload: { name: "Lakeside Campus", credit_limit_cents: 10000000 }, as: OpsDispatcher, captures: { cl6: $.data.id } }
            - { call: "POST /sites", payload: { client_id: "${cl6}", name: "Campus Ring", address: "3 College Dr", region_code: "NE", pavement_area_sqft: 60000, requires_loader: false }, as: OpsDispatcher, captures: { s6: $.data.id } }
            - { call: "POST /contracts", payload: { client_id: "${cl6}", contract_type: "PER_PUSH", season_start: "2026-11-01T00:00:00Z", season_end: "2027-03-31T23:59:59Z", trigger_depth_inches: 2.0, per_push_rate_cents: 45000, require_photo_verification: false }, as: OpsDispatcher, captures: { k6: $.data.id } }
            - { call: "POST /contract-sites", payload: { contract_id: "${k6}", site_id: "${s6}", priority_sequence: 1, completion_target_minutes: 360, salt_included_lbs: 0 }, as: OpsDispatcher, captures: { cs6: $.data.id } }
            - { call: "POST /contracts/${k6}/activate", as: OpsDispatcher }
            - { call: "POST /_clock/set_current_utc", payload: { to_iso8601: "2026-12-10T07:00:00Z" }, as: PlatformAdmin }
            - { call: "POST /storm-events", payload: { region_code: "NE", window_start: "2026-12-10T00:00:00Z", window_end: "2026-12-10T08:00:00Z", reported_accumulation_inches: 2.6, reported_source_name: "NOAA" }, as: OpsDispatcher, captures: { e6: $.data.id } }
            - { call: "POST /visits", payload: { storm_event_id: "${e6}", contract_site_id: "${cs6}", scheduled_start: "2026-12-10T09:00:00Z", scheduled_end: "2026-12-10T10:00:00Z" }, as: OpsDispatcher, captures: { v6: $.data.id } }
            - { call: "POST /_clock/set_current_utc", payload: { to_iso8601: "2026-12-10T09:05:00Z" }, as: PlatformAdmin }
            - { call: "POST /visits/${v6}/start", as: CrewLead }
            - { call: "POST /_clock/set_current_utc", payload: { to_iso8601: "2026-12-10T10:00:00Z" }, as: PlatformAdmin }
            - { call: "POST /visits/${v6}/complete", as: CrewLead }
            - { call: "POST /observations", payload: { storm_event_id: "${e6}", source_name: "NOAA", observed_at: "2026-12-10T07:30:00Z", accumulation_inches: 2.6 }, as: PlatformAdmin }
            - { call: "POST /observations", payload: { storm_event_id: "${e6}", source_name: "DTN", observed_at: "2026-12-10T08:00:00Z", accumulation_inches: 2.55 }, as: PlatformAdmin }
            - { call: "POST /_clock/set_current_utc", payload: { to_iso8601: "2026-12-10T12:00:00Z" }, as: PlatformAdmin }
            - { call: "POST /storm-events/${e6}/verify", as: OpsDispatcher, captures: { e6_verified_1: $.data.verified_accumulation_inches } }
            - { call: "GET /visits/${v6}", as: OpsDispatcher, captures: { v6_billing_1: $.data.billing_status } }
            - { call: "POST /_clock/set_current_utc", payload: { to_iso8601: "2026-12-11T09:00:00Z" }, as: PlatformAdmin }
            - { call: "POST /storm-events/${e6}/challenge", payload: { reason: "On-site sensor shows materially less accumulation" }, as: ClientContact, as_user_id: "${cl6}", captures: { e6_status_ch: $.data.status } }
            - { call: "GET /visits/${v6}", as: OpsDispatcher, captures: { v6_billing_2: $.data.billing_status } }
          trigger:
            - { call: "POST /storm-events/${e6}/verify", as: OpsDispatcher, captures: { reverify_err: $.data.error_id } }
            - { call: "POST /_clock/set_current_utc", payload: { to_iso8601: "2026-12-11T10:00:00Z" }, as: PlatformAdmin }
            - { call: "POST /observations", payload: { storm_event_id: "${e6}", source_name: "ON_SITE_SENSOR", observed_at: "2026-12-10T08:30:00Z", accumulation_inches: 1.5 }, as: PlatformAdmin }
            - { call: "POST /storm-events/${e6}/verify", as: OpsDispatcher, captures: { e6_verified_2: $.data.verified_accumulation_inches, e6_status_2: $.data.status } }
            - { call: "GET /visits/${v6}", as: OpsDispatcher, captures: { v6_billing_3: $.data.billing_status } }
          assert:
            - "First verification: verified_accumulation_inches == 2.55 (latest observed_at wins) and visit ${v6}.billing_status == BILLABLE_CONFIRMED"
            - "Challenge moves event to CHALLENGED and reverts visit billing_status to PENDING (cycle side effect)"
            - "Immediate re-verification without fresh evidence fails: error_id == ERR_NO_NEW_EVIDENCE"
            - "After the late ON_SITE_SENSOR observation: status == VERIFIED again (cycle closed) with verified_accumulation_inches == 1.5"
            - "Visit ${v6}.billing_status == NON_BILLABLE (1.5 < trigger 2.0) and contract season_billable_push_count returns to 0"

      - name: visit_dual_state_dimensions_independent_then_coupled
        grounds:
          - state_machines.ServiceVisit.SCHEDULED_to_IN_PROGRESS
          - state_machines.ServiceVisit.IN_PROGRESS_to_COMPLETED
          - state_machines.ServiceVisit.PENDING_to_BILLABLE_CONFIRMED
          - state_machines.ServiceVisit.COMPLETED_to_VOIDED
        distinguishing_aspect: |
          Two independent state dimensions on ONE entity (execution_status x
          billing_status on ServiceVisit, distinct entity from the StormEvent cycle):
          execution reaches COMPLETED while billing stays PENDING until verification;
          then the execution-side VOIDED transition forcibly couples billing to
          NON_BILLABLE with accumulator compensation.
        test_recipe:
          setup:
            - "PER_PUSH contract (trigger 1.0, rate 45000, no photo gate) ACTIVE; one visit v7 on a REPORTED event e7"
          setup_api_calls:
            - { call: "POST /clients", payload: { name: "Greenfield Malls", credit_limit_cents: 10000000 }, as: OpsDispatcher, captures: { cl7: $.data.id } }
            - { call: "POST /sites", payload: { client_id: "${cl7}", name: "Mall West", address: "11 Commerce Blvd", region_code: "NE", pavement_area_sqft: 45000, requires_loader: false }, as: OpsDispatcher, captures: { s7: $.data.id } }
            - { call: "POST /contracts", payload: { client_id: "${cl7}", contract_type: "PER_PUSH", season_start: "2026-11-01T00:00:00Z", season_end: "2027-03-31T23:59:59Z", trigger_depth_inches: 1.0, per_push_rate_cents: 45000, require_photo_verification: false }, as: OpsDispatcher, captures: { k7: $.data.id } }
            - { call: "POST /contract-sites", payload: { contract_id: "${k7}", site_id: "${s7}", priority_sequence: 1, completion_target_minutes: 360, salt_included_lbs: 0 }, as: OpsDispatcher, captures: { cs7: $.data.id } }
            - { call: "POST /contracts/${k7}/activate", as: OpsDispatcher }
            - { call: "POST /_clock/set_current_utc", payload: { to_iso8601: "2026-12-10T07:00:00Z" }, as: PlatformAdmin }
            - { call: "POST /storm-events", payload: { region_code: "NE", window_start: "2026-12-10T00:00:00Z", window_end: "2026-12-10T08:00:00Z", reported_accumulation_inches: 2.0, reported_source_name: "NOAA" }, as: OpsDispatcher, captures: { e7: $.data.id } }
            - { call: "POST /visits", payload: { storm_event_id: "${e7}", contract_site_id: "${cs7}", scheduled_start: "2026-12-10T09:00:00Z", scheduled_end: "2026-12-10T10:00:00Z" }, as: OpsDispatcher, captures: { v7: $.data.id, v7_exec_0: $.data.execution_status, v7_bill_0: $.data.billing_status } }
            - { call: "POST /_clock/set_current_utc", payload: { to_iso8601: "2026-12-10T09:05:00Z" }, as: PlatformAdmin }
            - { call: "POST /visits/${v7}/start", as: CrewLead, captures: { v7_exec_1: $.data.execution_status, v7_bill_1: $.data.billing_status } }
            - { call: "POST /_clock/set_current_utc", payload: { to_iso8601: "2026-12-10T10:00:00Z" }, as: PlatformAdmin }
            - { call: "POST /visits/${v7}/complete", as: CrewLead, captures: { v7_exec_2: $.data.execution_status, v7_bill_2: $.data.billing_status } }
            - { call: "POST /observations", payload: { storm_event_id: "${e7}", source_name: "NOAA", observed_at: "2026-12-10T07:30:00Z", accumulation_inches: 2.0 }, as: PlatformAdmin }
            - { call: "POST /observations", payload: { storm_event_id: "${e7}", source_name: "DTN", observed_at: "2026-12-10T08:00:00Z", accumulation_inches: 2.1 }, as: PlatformAdmin }
          trigger:
            - { call: "POST /storm-events/${e7}/verify", as: OpsDispatcher }
            - { call: "GET /visits/${v7}", as: OpsDispatcher, captures: { v7_exec_3: $.data.execution_status, v7_bill_3: $.data.billing_status, v7_amt: $.data.billable_amount_cents } }
            - { call: "POST /visits/${v7}/void", as: OpsDispatcher, captures: { v7_exec_4: $.data.execution_status, v7_bill_4: $.data.billing_status } }
            - { call: "GET /contracts/${k7}", as: OpsDispatcher, captures: { k7_count: $.data.season_billable_push_count } }
          assert:
            - "At creation: execution_status == SCHEDULED and billing_status == PENDING (both dimensions initialized independently)"
            - "After start: execution_status == IN_PROGRESS while billing_status stays PENDING"
            - "After complete (event still REPORTED): execution_status == COMPLETED while billing_status stays PENDING — the execution dimension does not force billing"
            - "After verify: execution_status unchanged COMPLETED while billing_status moves to BILLABLE_CONFIRMED with billable_amount_cents == 45000"
            - "After void (coupling rule): execution_status == VOIDED forces billing_status == NON_BILLABLE and contract season_billable_push_count == 0"

  # ---------------------------------------------------------------------------
  - rule_id: transitive_cascade
    instances:
      - name: verify_cascade_visit_accumulator_overage_flag
        grounds:
          - state_machines.StormEvent.REPORTED_to_VERIFIED
          - state_machines.ServiceVisit.PENDING_to_BILLABLE_CONFIRMED
          - calculations.visit_billing_evaluation
          - entities.Contract.fields.overage_active
        distinguishing_aspect: |
          Depth-3 cascade from the VERIFY trigger (distinct trigger from the
          equipment-failure cascade): verify -> each visit's billing flip (L1) ->
          Contract.season_billable_push_count recompute caused by the visit flips (L2)
          -> overage_active flag flip caused by the accumulator crossing the cap (L3).
          Each link is caused by the previous link, not by verify directly.
        test_recipe:
          setup:
            - "SEASONAL contract k8s (fee 2000000, push cap 1, overage rate 40000, trigger 1.0, no photo gate) ACTIVE"
            - "Two COMPLETED on-time visits v8a (09:00-10:00) and v8b (11:30-12:30, exactly the 90-minute buffer after v8a) on one REPORTED event"
          setup_api_calls:
            - { call: "POST /clients", payload: { name: "Airport Parking Auth", credit_limit_cents: 10000000 }, as: OpsDispatcher, captures: { cl8: $.data.id } }
            - { call: "POST /sites", payload: { client_id: "${cl8}", name: "Economy Lot", address: "1 Airport Way", region_code: "NE", pavement_area_sqft: 80000, requires_loader: false }, as: OpsDispatcher, captures: { s8: $.data.id } }
            - { call: "POST /contracts", payload: { client_id: "${cl8}", contract_type: "SEASONAL", season_start: "2026-11-01T00:00:00Z", season_end: "2026-12-31T23:59:59Z", trigger_depth_inches: 1.0, seasonal_fee_cents: 2000000, seasonal_push_cap: 1, seasonal_overage_rate_cents: 40000, require_photo_verification: false }, as: OpsDispatcher, captures: { k8: $.data.id } }
            - { call: "POST /contract-sites", payload: { contract_id: "${k8}", site_id: "${s8}", priority_sequence: 1, completion_target_minutes: 480, salt_included_lbs: 0 }, as: OpsDispatcher, captures: { cs8: $.data.id } }
            - { call: "POST /contracts/${k8}/activate", as: OpsDispatcher }
            - { call: "POST /_clock/set_current_utc", payload: { to_iso8601: "2026-12-10T07:00:00Z" }, as: PlatformAdmin }
            - { call: "POST /storm-events", payload: { region_code: "NE", window_start: "2026-12-10T00:00:00Z", window_end: "2026-12-10T08:00:00Z", reported_accumulation_inches: 3.0, reported_source_name: "NOAA" }, as: OpsDispatcher, captures: { e8: $.data.id } }
            - { call: "POST /visits", payload: { storm_event_id: "${e8}", contract_site_id: "${cs8}", scheduled_start: "2026-12-10T09:00:00Z", scheduled_end: "2026-12-10T10:00:00Z" }, as: OpsDispatcher, captures: { v8a: $.data.id } }
            - { call: "POST /visits", payload: { storm_event_id: "${e8}", contract_site_id: "${cs8}", scheduled_start: "2026-12-10T11:30:00Z", scheduled_end: "2026-12-10T12:30:00Z" }, as: OpsDispatcher, captures: { v8b: $.data.id } }
            - { call: "POST /_clock/set_current_utc", payload: { to_iso8601: "2026-12-10T09:05:00Z" }, as: PlatformAdmin }
            - { call: "POST /visits/${v8a}/start", as: CrewLead }
            - { call: "POST /_clock/set_current_utc", payload: { to_iso8601: "2026-12-10T10:00:00Z" }, as: PlatformAdmin }
            - { call: "POST /visits/${v8a}/complete", as: CrewLead }
            - { call: "POST /_clock/set_current_utc", payload: { to_iso8601: "2026-12-10T11:30:00Z" }, as: PlatformAdmin }
            - { call: "POST /visits/${v8b}/start", as: CrewLead }
            - { call: "POST /_clock/set_current_utc", payload: { to_iso8601: "2026-12-10T12:30:00Z" }, as: PlatformAdmin }
            - { call: "POST /visits/${v8b}/complete", as: CrewLead }
            - { call: "POST /observations", payload: { storm_event_id: "${e8}", source_name: "NOAA", observed_at: "2026-12-10T07:00:00Z", accumulation_inches: 3.0 }, as: PlatformAdmin }
            - { call: "POST /observations", payload: { storm_event_id: "${e8}", source_name: "DTN", observed_at: "2026-12-10T07:30:00Z", accumulation_inches: 2.9 }, as: PlatformAdmin }
          trigger:
            - { call: "POST /storm-events/${e8}/verify", as: OpsDispatcher }
            - { call: "GET /visits/${v8a}", as: OpsDispatcher, captures: { v8a_b: $.data.billing_status } }
            - { call: "GET /visits/${v8b}", as: OpsDispatcher, captures: { v8b_b: $.data.billing_status } }
            - { call: "GET /contracts/${k8}", as: OpsDispatcher, captures: { k8_count: $.data.season_billable_push_count, k8_overage: $.data.overage_active } }
            - { call: "GET /contracts/${k8}/true-up-preview", as: OpsDispatcher, captures: { k8_over_pushes: $.data.projected_overage_pushes, k8_over_cents: $.data.projected_overage_cents } }
          assert:
            - "L1: both visits flipped — visit ${v8a}.billing_status == BILLABLE_CONFIRMED and ${v8b}.billing_status == BILLABLE_CONFIRMED"
            - "L2 (caused by L1): Contract.${k8}.season_billable_push_count == 2"
            - "L3 (caused by L2 crossing cap=1): Contract.${k8}.overage_active == true and true-up preview shows projected_overage_pushes == 1 with projected_overage_cents == 40000"

      - name: equipment_failure_cascade_to_auto_suspension
        grounds:
          - state_machines.CoverageAssignment.ACTIVE_to_FAILED
          - state_machines.ServiceVisit.SCHEDULED_to_AWAITING_BACKUP
          - state_machines.Subcontractor.APPROVED_to_SUSPENDED
          - calculations.reliability_score
        distinguishing_aspect: |
          Depth-3 cascade from the FAIL trigger (distinct from verify): coverage fail
          -> SCHEDULED visits of that sub+event drop to AWAITING_BACKUP (L1) -> the
          fail itself recomputes reliability_score=floor(100*2/3)=66 (L2) -> score
          below floor 70 with 3 total assignments auto-suspends the subcontractor (L3).
        test_recipe:
          setup:
            - "Subcontractor sub1 APPROVED with 2 prior RELEASED coverage assignments (events p1, p2 closed via sweep)"
            - "PER_PUSH contract ACTIVE; event e9 with ACTIVE coverage ca9 by sub1 and one SCHEDULED visit v9 assigned to sub1"
          setup_api_calls:
            - { call: "POST /clients", payload: { name: "MedCenter Props", credit_limit_cents: 10000000 }, as: OpsDispatcher, captures: { cl9: $.data.id } }
            - { call: "POST /sites", payload: { client_id: "${cl9}", name: "Clinic Lot", address: "20 Health Dr", region_code: "NE", pavement_area_sqft: 25000, requires_loader: false }, as: OpsDispatcher, captures: { s9: $.data.id } }
            - { call: "POST /contracts", payload: { client_id: "${cl9}", contract_type: "PER_PUSH", season_start: "2026-11-01T00:00:00Z", season_end: "2027-03-31T23:59:59Z", trigger_depth_inches: 1.0, per_push_rate_cents: 45000, require_photo_verification: false }, as: OpsDispatcher, captures: { k9: $.data.id } }
            - { call: "POST /contract-sites", payload: { contract_id: "${k9}", site_id: "${s9}", priority_sequence: 1, completion_target_minutes: 360, salt_included_lbs: 0 }, as: OpsDispatcher, captures: { cs9: $.data.id } }
            - { call: "POST /contracts/${k9}/activate", as: OpsDispatcher }
            - { call: "POST /subcontractors", payload: { legal_name: "PlowRight LLC", contact_email: "dispatch@plowright.example", has_loader: true, has_brine_truck: true }, as: OpsDispatcher, captures: { sub1: $.data.id } }
            - { call: "POST /subcontractors/${sub1}/approve", as: PlatformAdmin }
            # --- prior released assignment #1 on event p1 ---
            - { call: "POST /_clock/set_current_utc", payload: { to_iso8601: "2026-12-01T00:30:00Z" }, as: PlatformAdmin }
            - { call: "POST /storm-events", payload: { region_code: "NE", window_start: "2026-12-01T00:00:00Z", window_end: "2026-12-01T06:00:00Z", reported_accumulation_inches: 2.0, reported_source_name: "NOAA" }, as: OpsDispatcher, captures: { p1: $.data.id } }
            - { call: "POST /coverage-assignments", payload: { storm_event_id: "${p1}", contract_id: "${k9}", subcontractor_id: "${sub1}", coverage_start: "2026-12-01T00:00:00Z", coverage_end: "2026-12-01T12:00:00Z" }, as: OpsDispatcher, captures: { cp1: $.data.id } }
            - { call: "POST /coverage-assignments/${cp1}/activate", as: Subcontractor, as_user_id: "${sub1}" }
            - { call: "POST /observations", payload: { storm_event_id: "${p1}", source_name: "NOAA", observed_at: "2026-12-01T05:00:00Z", accumulation_inches: 2.0 }, as: PlatformAdmin }
            - { call: "POST /observations", payload: { storm_event_id: "${p1}", source_name: "DTN", observed_at: "2026-12-01T05:30:00Z", accumulation_inches: 2.1 }, as: PlatformAdmin }
            - { call: "POST /storm-events/${p1}/verify", as: OpsDispatcher }
            - { call: "POST /_clock/set_current_utc", payload: { to_iso8601: "2026-12-01T13:00:00Z" }, as: PlatformAdmin }
            - { call: "POST /storm-events/${p1}/close-sweep", as: OpsDispatcher }
            - { call: "POST /coverage-assignments/${cp1}/release", as: OpsDispatcher }
            # --- prior released assignment #2 on event p2 ---
            - { call: "POST /_clock/set_current_utc", payload: { to_iso8601: "2026-12-02T00:30:00Z" }, as: PlatformAdmin }
            - { call: "POST /storm-events", payload: { region_code: "NE", window_start: "2026-12-02T00:00:00Z", window_end: "2026-12-02T06:00:00Z", reported_accumulation_inches: 2.2, reported_source_name: "NOAA" }, as: OpsDispatcher, captures: { p2: $.data.id } }
            - { call: "POST /coverage-assignments", payload: { storm_event_id: "${p2}", contract_id: "${k9}", subcontractor_id: "${sub1}", coverage_start: "2026-12-02T00:00:00Z", coverage_end: "2026-12-02T12:00:00Z" }, as: OpsDispatcher, captures: { cp2: $.data.id } }
            - { call: "POST /coverage-assignments/${cp2}/activate", as: Subcontractor, as_user_id: "${sub1}" }
            - { call: "POST /observations", payload: { storm_event_id: "${p2}", source_name: "NOAA", observed_at: "2026-12-02T05:00:00Z", accumulation_inches: 2.2 }, as: PlatformAdmin }
            - { call: "POST /observations", payload: { storm_event_id: "${p2}", source_name: "DTN", observed_at: "2026-12-02T05:30:00Z", accumulation_inches: 2.3 }, as: PlatformAdmin }
            - { call: "POST /storm-events/${p2}/verify", as: OpsDispatcher }
            - { call: "POST /_clock/set_current_utc", payload: { to_iso8601: "2026-12-02T13:00:00Z" }, as: PlatformAdmin }
            - { call: "POST /storm-events/${p2}/close-sweep", as: OpsDispatcher }
            - { call: "POST /coverage-assignments/${cp2}/release", as: OpsDispatcher }
            # --- the assignment that fails ---
            - { call: "POST /_clock/set_current_utc", payload: { to_iso8601: "2026-12-10T00:30:00Z" }, as: PlatformAdmin }
            - { call: "POST /storm-events", payload: { region_code: "NE", window_start: "2026-12-10T00:00:00Z", window_end: "2026-12-10T08:00:00Z", reported_accumulation_inches: 2.5, reported_source_name: "NOAA" }, as: OpsDispatcher, captures: { e9: $.data.id } }
            - { call: "POST /coverage-assignments", payload: { storm_event_id: "${e9}", contract_id: "${k9}", subcontractor_id: "${sub1}", coverage_start: "2026-12-10T00:00:00Z", coverage_end: "2026-12-10T12:00:00Z" }, as: OpsDispatcher, captures: { ca9: $.data.id } }
            - { call: "POST /coverage-assignments/${ca9}/activate", as: Subcontractor, as_user_id: "${sub1}" }
            - { call: "POST /visits", payload: { storm_event_id: "${e9}", contract_site_id: "${cs9}", scheduled_start: "2026-12-10T09:00:00Z", scheduled_end: "2026-12-10T10:00:00Z", assigned_subcontractor_id: "${sub1}" }, as: OpsDispatcher, captures: { v9: $.data.id } }
          trigger:
            - { call: "POST /coverage-assignments/${ca9}/fail", payload: { failure_reason: "Plow hydraulics failure" }, as: Subcontractor, as_user_id: "${sub1}", captures: { ca9_status: $.data.status } }
            - { call: "GET /visits/${v9}", as: OpsDispatcher, captures: { v9_exec: $.data.execution_status, v9_sub: $.data.assigned_subcontractor_id } }
            - { call: "GET /subcontractors/${sub1}", as: OpsDispatcher, captures: { sub1_score: $.data.reliability_score, sub1_status: $.data.status, sub1_failed: $.data.assignments_failed_count } }
          assert:
            - "L1: CoverageAssignment.${ca9}.status == FAILED and visit ${v9}.execution_status == AWAITING_BACKUP with assigned_subcontractor_id == null"
            - "L2 (caused by the L1 fail bookkeeping): Subcontractor.${sub1}.assignments_failed_count == 1 and reliability_score == 66 (floor(100*2/3))"
            - "L3 (caused by the L2 score dropping below the floor with 3 total assignments): Subcontractor.${sub1}.status == SUSPENDED"

