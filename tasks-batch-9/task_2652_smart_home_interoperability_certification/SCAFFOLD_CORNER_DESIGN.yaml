            - "After the ip-commitment: onboarding_state == \"IP_EXECUTED\", ip_executed_at == \"2026-09-01T00:00:00Z\", ip_commitment_type == \"RAND_REASONABLE_ROYALTY\", essential_patent_count == 7, ip_scope_specification_id == ${spec_id}, good_standing == false"
