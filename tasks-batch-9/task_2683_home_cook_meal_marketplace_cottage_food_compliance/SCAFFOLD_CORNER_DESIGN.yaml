            - "PickupHub.${hub_narrow}.assigned_order_count == 0"
            - "${routed_hub} == ${hub_ok} and ${routed_status} == ROUTED: the covering hub's staffed interval contains the handoff interval at both endpoints exactly (16:00 <= 16:00 and 18:00 >= 18:00, both comparisons inclusive)"
            - "PickupHub.${hub_ok}.assigned_order_count == 1 and its status is still OPEN (1 < 5)"

      - name: inputs_sitting_exactly_on_their_limits_are_admitted
        claim_type: satisfaction_to_pass
        grounds:
          - validations[priority=32].ERR_CERT_VALIDITY_TOO_LONG
          - validations[priority=29].ERR_SHELF_LIFE_EXCEEDS_POLICY
          - validations[priority=25].ERR_ALLERGEN_DISCLOSURE_MISSING
          - validations[priority=30].ERR_LABEL_FIELDS_INCOMPLETE
        distinguishing_aspect: >
          Every limit in the onboarding-and-approval path is landed on exactly and must PASS, because
          all four comparisons are inclusive: a certificate spanning exactly cert_validity_max_days
          (1825) days, a shelf life of exactly max_shelf_life_days_non_refrigerated (14) days, an empty
          allergen list rescued by allergen_free_attested == true, and a label_fields list that equals
          the required set with nothing to spare.
        test_recipe:
          setup:
            - "StatePolicy CA with cert_validity_max_days 1825, max_shelf_life_days_non_refrigerated 14 and the five label_required_fields; clock 2026-08-01T00:00:00Z."
            - "Cook Dara onboarded to ACTIVE with a certificate issued 2026-01-15 and expiring 2031-01-14 - exactly 1825 days - and a PASSED HOME_COTTAGE inspection reviewed by rev-2."
          setup_api_calls:
            - call: POST /state-policies
              payload: { state_code: "CA", cottage_food_annual_cap_cents: 5000000, allowed_kitchen_types: ["HOME_COTTAGE", "HOME_INSPECTED", "COMMERCIAL_SHARED"], tcs_requires_commercial_kitchen: true, max_shelf_life_days_non_refrigerated: 14, label_required_fields: ["cook_name", "ingredients", "allergens", "net_weight", "cottage_food_disclaimer"], cert_validity_max_days: 1825 }
              as: PlatformAdmin
              captures: { sp_id: "$.data.id" }
            - call: POST /_clock/set_current_utc
              payload: { to_iso8601: "2026-08-01T00:00:00Z" }
              as: PlatformAdmin
            - call: POST /cooks
              payload: { legal_name: "Dara Osei", email: "dara@example.com", state_code: "CA", claimed_kitchen_type: "HOME_COTTAGE" }
              as: Anonymous
              captures: { cook_id: "$.data.id", cook_v0: "$.data.version" }
            - call: POST /onboarding-documents
              payload: { cook_id: "${cook_id}", doc_type: "FOOD_HANDLER_CERT", expected_cook_version: "${cook_v0}", certificate_number: "FH-1825", issuing_authority: "CA DPH", issued_on: "2026-01-15", expires_on: "2031-01-14" }
              as: Cook
              as_user_id: "${cook_id}"
              captures: { cert_id: "$.data.id", cert_status: "$.data.review_status" }
            - call: GET /cooks/${cook_id}
              payload: {}
              as: ComplianceReviewer
              as_user_id: rev-1
              captures: { cook_v1: "$.data.version" }
            - call: POST /onboarding-documents
              payload: { cook_id: "${cook_id}", doc_type: "KITCHEN_INSPECTION", expected_cook_version: "${cook_v1}", kitchen_type_claimed: "HOME_COTTAGE", inspection_date: "2026-06-01" }
              as: Cook
              as_user_id: "${cook_id}"
              captures: { insp_id: "$.data.id" }
            - call: POST /onboarding-documents/${cert_id}/review
              payload: { decision: "VERIFY" }
              as: ComplianceReviewer
              as_user_id: rev-1
            - call: POST /onboarding-documents/${insp_id}/review
              payload: { decision: "PASS" }
              as: ComplianceReviewer
              as_user_id: rev-2
            - call: POST /cooks/${cook_id}/onboarding-decision
              payload: { decision: "ACTIVATE" }
              as: ComplianceReviewer
              as_user_id: rev-1
              captures: { onboarding: "$.data.onboarding_status", verified_kitchen: "$.data.verified_kitchen_type" }
          trigger:
            - call: POST /menu-items
              payload: { cook_id: "${cook_id}", name: "Attested Shortbread", food_category: "BAKED_NON_TCS", allergens: [], allergen_free_attested: true, shelf_life_days: 14, requires_refrigeration: false, handoff_mode: "BATCH_COOK_AND_CHILL", unit_price_cents: 400, label_fields: ["cook_name", "ingredients", "allergens", "net_weight", "cottage_food_disclaimer"] }
              as: Cook
              as_user_id: "${cook_id}"
              captures: { mi_id: "$.data.id", mi_label: "$.data.label_compliance_status" }
            - call: POST /menu-items/${mi_id}/submit
              payload: {}
              as: Cook
              as_user_id: "${cook_id}"
              captures: { mi_submitted: "$.data.review_status" }
            - call: POST /menu-items/${mi_id}/review
              payload: { decision: "APPROVE", allergen_review_notes: "allergen-free attestation accepted" }
              as: ComplianceReviewer
              as_user_id: rev-1
              captures: { mi_final: "$.data.review_status", mi_approver: "$.data.approved_by_user_id" }
          assert:
            - "${cert_status} == SUBMITTED: a span of exactly 1825 days satisfies cert_validity_max_days (the comparison is 'must not exceed')"
            - "${onboarding} == ACTIVE and ${verified_kitchen} == HOME_COTTAGE"
            - "${mi_label} == COMPLIANT with label_fields exactly equal to label_required_fields (no extra keys needed)"
            - "${mi_submitted} == UNDER_REVIEW and ${mi_final} == APPROVED with ${mi_approver} == rev-1"
            - "shelf_life_days == 14 == max_shelf_life_days_non_refrigerated passes priority 29 because the comparison is <="
            - "the empty allergen list passes priority 25 solely because allergen_free_attested is true"
            - "rev-1 may approve because the KITCHEN_INSPECTION was reviewed by rev-2 (no segregation-of-duties collision)"

      - name: cutoff_rule_outranks_the_capacity_rule
        claim_type: priority_ordering
        grounds:
          - validations[priority=14].ERR_WINDOW_CUTOFF_PASSED
          - validations[priority=46].ERR_WINDOW_CAPACITY_EXCEEDED
        excluded_because:
          difficulty_instance: "priority_pair_validation_conflict / cutoff_priority_14_beats_capacity_priority_46"
          rationale: >
            That instance places an order that violates both rules at once and asserts the priority-14
            code, then repairs each violation in turn to show both codes are reachable on their own.

      - name: certificate_expiry_rule_outranks_the_shelf_life_rule
        claim_type: priority_ordering
        grounds:
          - validations[priority=22].ERR_CERT_EXPIRED
          - validations[priority=29].ERR_SHELF_LIFE_EXCEEDS_POLICY
        excluded_because:
          difficulty_instance: "priority_pair_validation_conflict / cert_expiry_priority_22_beats_shelf_life_priority_29"
          rationale: >
            The same approval call violating both the expired-certificate rule and the shelf-life rule
            is asserted there to return the priority-22 code, with each violation then isolated.

      - name: suspended_cook_operations_rejected
        claim_type: violation_to_error
        grounds:
          - validations[priority=21].ERR_COOK_SUSPENDED
        excluded_because:
          difficulty_instance: "non_linear_state_machine / cook_onboarding_and_standing_dimensions_move_independently"
          rationale: >
            ERR_COOK_SUSPENDED is triggered there on an ACTIVE-but-SUSPENDED cook, which is the only
            combination in which the standing dimension can veto an operation the onboarding dimension
            permits.

      - name: orders_after_the_cutoff_rejected
        claim_type: violation_to_error
        grounds:
          - validations[priority=14].ERR_WINDOW_CUTOFF_PASSED
        excluded_because:
          difficulty_instance: "priority_pair_validation_conflict / cutoff_priority_14_beats_capacity_priority_46"
          rationale: >
            The isolated priority-14 violation (window still OPEN but clock past order_cutoff_at) is
            one of the repair steps of that instance.

      - name: aggregate_capacity_exceeded_rejected
        claim_type: violation_to_error
        grounds:
          - validations[priority=46].ERR_WINDOW_CAPACITY_EXCEEDED
          - calculations.effective_production_capacity
        excluded_because:
          difficulty_instance: "combinatorial_formula / spoilage_reserve_evaluated_before_admission"
          rationale: >
            The aggregate-validation shape (each order individually fine, the collective exceeding the
            spoilage-reduced effective capacity) is exactly what that instance constructs.

      - name: cottage_revenue_cap_exceeded_rejected
        claim_type: violation_to_error
        grounds:
          - validations.ERR_COTTAGE_CAP_EXCEEDED
          - calculations.cottage_cap_projection
        excluded_because:
          difficulty_instance: "boundary_precision_check / cottage_cap_admission_at_exactly_the_cap"
          rationale: >
            Rejection at projected == cap + 1, including the in-flight term contributed by an
            AUTHORIZED order, is asserted there next to the admitted boundary case.

      - name: tcs_kitchen_type_gates_rejected
        claim_type: violation_to_error
        grounds:
          - validations.ERR_TCS_REQUIRES_COMMERCIAL_KITCHEN
          - validations[priority=23].ERR_KITCHEN_TYPE_NOT_ALLOWED
        excluded_because:
          difficulty_instance: "cross_entity_state_dependency / tcs_approval_gated_by_verified_kitchen_type_and_state_policy"
          rationale: >
            Both codes are triggered there against the same StatePolicy by varying the cook's
            verified_kitchen_type and the policy's allowed_kitchen_types, which is the conditional
            validation pattern in its cross-entity form.

      - name: cold_chain_infeasible_routing_rejected
        claim_type: violation_to_error
        grounds:
          - validations.ERR_COLD_CHAIN_INFEASIBLE
          - calculations.handoff_routing_decision
        excluded_because:
          difficulty_instance: "boundary_precision_check / hot_handoff_span_120_admits_121_falls_back"
          rationale: >
            Both infeasibility branches (a refrigerated item routed SAME_DAY_HOT, and a batch route
            whose handoff span exceeds the zone's max_cold_chain_minutes) are triggered there.

      - name: open_incident_blocks_finalization_rejected
        claim_type: violation_to_error
        grounds:
          - validations.ERR_OPEN_INCIDENT_BLOCKS_PAYOUT
        excluded_because:
          difficulty_instance: "cross_entity_state_dependency / payout_finalization_gated_by_open_safety_incident"
          rationale: >
            The window-scoped open-incident guard, including the fact that an incident on a DIFFERENT
            window's order does not block, is asserted there.

      - name: expired_certificate_blocks_activation_rejected
        claim_type: violation_to_error
        grounds:
          - validations[priority=22].ERR_CERT_EXPIRED
        excluded_because:
          difficulty_instance: "priority_pair_validation_conflict / cert_expiry_priority_22_beats_shelf_life_priority_29"
          rationale: >
            The isolated expired-certificate rejection, after the clock is advanced past expires_on, is
            one of the repair steps of that instance.

  - section: endpoints
    instances:
      - name: pickup_hub_create_read_and_list_round_trip
        claim_type: standard_crud
        grounds:
          - endpoints.POST /pickup-hubs
          - endpoints.GET /pickup-hubs/{id}
          - endpoints.GET /pickup-hubs
          - entities.PickupHub
        distinguishing_aspect: >
          PickupHub is the only entity created by PlatformAdmin alone yet readable by Anonymous, so the
          create-read-list round trip must prove that the two computed fields the creator never sends
          (status OPEN, assigned_order_count 0) are materialised on the create response, echoed by the
          single read, and filterable on the collection read by both delivery_zone_id and status.
        test_recipe:
          setup:
            - "StatePolicy CA exists."
            - "DeliveryZone OAK-HUB with service_mode HUB_PICKUP exists; a second DOOR_DELIVERY zone SF-01 exists so the zone filter has something to exclude."
          setup_api_calls:
            - call: POST /state-policies
              payload: { state_code: "CA", cottage_food_annual_cap_cents: 5000000, allowed_kitchen_types: ["HOME_COTTAGE", "HOME_INSPECTED", "COMMERCIAL_SHARED"], tcs_requires_commercial_kitchen: true, max_shelf_life_days_non_refrigerated: 14, label_required_fields: ["cook_name", "ingredients", "allergens", "net_weight", "cottage_food_disclaimer"], cert_validity_max_days: 1825 }
              as: PlatformAdmin
