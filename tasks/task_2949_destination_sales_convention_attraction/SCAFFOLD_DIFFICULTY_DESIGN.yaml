            - call: "GET /hotels/${hotel_a_id}"
              payload: {}
              as: SalesManager
              captures: { harbor_peak_after: $.data.committed_peak_rooms, harbor_nights_after: $.data.committed_room_nights }
            - call: "GET /opportunities/${opp_id}"
              payload: {}
              as: SalesManager
              captures: { coverage_after: $.data.block_coverage_pct, opp_peak_after: $.data.committed_peak_rooms, opp_v_d: $.data.version }
            - call: "POST /room-block-commitments"
              payload: { opportunity_id: "${opp_id}", hotel_id: "${hotel_a_id}", rooms_peak_invited: 100, expected_opportunity_version: "${opp_v_d}" }
              as: SalesManager
              captures: { c_gamma_id: $.data.id }
            - call: "POST /room-block-commitments/${c_gamma_id}/offer"
              payload: { rooms_peak_offered: 100, rate_offered_amount: 214.33, cutoff_days_before_arrival: 30 }
              as: HotelPartner
