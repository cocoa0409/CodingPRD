  - rule_id: priority_pair_validation_conflict
    instances:

      - name: assign_sme_expert_unavailable_outranks_weekly_capacity_exceeded
        grounds:
          - validations[priority=28]
          - validations[priority=40]
          - errors[ERR_EXPERT_UNAVAILABLE]
          - errors[ERR_EXPERT_CAPACITY_EXCEEDED]
          - calculations.expert_week_committed_hours
          - state_machines.ContentBrief.DRAFT_to_SME_ASSIGNED
        distinguishing_aspect: |
          A single assign-sme request violates the business_referential rule at priority 28 (the expert
          is ON_LEAVE) and the business_fiscal rule at priority 40 (11 reserved hours against a 4-hour
          weekly capacity) at once, and the response must be ERR_EXPERT_UNAVAILABLE with HTTP 409 —
          the referential rule, never the fiscal one.
        test_recipe:
          setup:
            - "Logical clock parked at 2026-08-03T08:00:00.000Z."
            - "Campaign CMP-PRI1 is ACTIVE, governance_posture OPEN."
            - "Expert Kai Ito has expertise_tags [security] and weekly_capacity_hours 4, and has been put ON_LEAVE, so committed_hours_total is 0."
            - "One DRAFT brief with required_expertise_tag security (so the priority-29 expertise rule is satisfied), search_intent COMMERCIAL, target_word_count 1500, funnel_stage DECISION, requires_regulated_review true, giving effort_points 21 and sme_reserved_hours 11."
            - "The expert holds no other brief, so the priority-30 window-overlap rule cannot fire."
          setup_api_calls:
            - call: "POST /editorial/_clock/set_current_utc"
              payload: { current_utc: "2026-08-03T08:00:00.000Z" }
              as: ManagingEditor
            - call: "POST /editorial/campaigns"
              payload: { code: "CMP-PRI1", persona: "IT_BUYER", primary_funnel_stage: "DECISION", quarter_code: "2026Q3" }
              as: ManagingEditor
              captures: { cmp_id: $.data.id }
            - call: "POST /editorial/campaigns/${cmp_id}/activate"
              payload: {}
              as: ManagingEditor
            - call: "POST /editorial/experts"
              payload: { full_name: "Kai Ito", expertise_tags: ["security"], weekly_capacity_hours: 4 }
              as: ManagingEditor
              captures: { exp_id: $.data.id }
            - call: "POST /editorial/experts/${exp_id}/availability"
              payload: { status: "ON_LEAVE" }
              as: ManagingEditor
            - call: "POST /editorial/briefs"
              payload: { campaign_id: "${cmp_id}", funnel_stage: "DECISION", search_intent: "COMMERCIAL", primary_keyword: "regulated zero trust pricing", target_word_count: 1500, required_expertise_tag: "security", review_window_start: "2026-08-03T09:00:00.000Z", review_window_end: "2026-08-04T09:00:00.000Z", requires_regulated_review: true }
              as: ManagingEditor
              captures: { brief_id: $.data.id }
            - call: "GET /editorial/experts/${exp_id}"
              payload: {}
              as: ManagingEditor
              captures: { exp_v: $.data.version, exp_hours: $.data.weekly_capacity_hours }
          trigger:
            - call: "POST /editorial/briefs/${brief_id}/assign-sme"
              payload: { sme_expert_id: "${exp_id}", expected_expert_version: "${exp_v}" }
              as: ManagingEditor
              captures: { err: $.data.error_id }
          assert:
            - "the trigger call returns HTTP 409"
            - "${err} == ERR_EXPERT_UNAVAILABLE"
            - "${err} != ERR_EXPERT_CAPACITY_EXCEEDED"
            - "ContentBrief.${brief_id}.state == DRAFT"
            - "ContentBrief.${brief_id}.sme_expert_id == null"
            - "ContentBrief.${brief_id}.effort_points == 21"
            - "ContentBrief.${brief_id}.sme_reserved_hours == 11"
            - "SubjectMatterExpert.${exp_id}.weekly_capacity_hours == 4, so 0 + 11 > 4 and the priority-40 rule is independently violated by the same request"
            - "SubjectMatterExpert.${exp_id}.committed_hours_total == 0"
            - "SubjectMatterExpert.${exp_id}.status == ON_LEAVE"
            - "SubjectMatterExpert.${exp_id}.version == ${exp_v}"

