              as: FacilityCoordinator
              as_user_id: "${fac_id}"
              captures: { reading_id: $.data.id }
            - call: "POST /referrals"
              payload: { access_id: "${acc_id}", referring_facility_id: "${fac_id}", suspected_problem: "STENOSIS", clinical_narrative: "state 409 corner", missed_treatment_count: 0 }
