              as: ShopAdmin
            - call: "POST /session-bookings"
              payload: { session_id: "${sess_id}", enrollment_id: "${e1}", expected_session_version: "${sv0}" }
              as: ShopAdmin
              captures: { sb1: $.data.id, sv1: $.data.version }
            - call: "POST /divers"
