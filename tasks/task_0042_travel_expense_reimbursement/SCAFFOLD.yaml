# =============================================================================
# Scaffold: Travel & Expense Reimbursement (T&E) — seed tables (v1)
# =============================================================================

scenario: "Travel & Expense Reimbursement (T&E): GSA Per Diem, flight policy, rental car CDW, meal itemization, receipt OCR, virtual card issuance, Out-of-Policy approval chain, Mileage Reimbursement"

domain_name: travel-expense-reimbursement
api_prefix: /

complexity_profile:
  primary_archetype: compliance_audit          # regulatory caps (GSA per diem, flight class, CDW) with an out-of-policy approval chain + audit trail
  secondary_archetype: ledger_reconciliation    # provisional (authorization-hold / per-diem cap) vs final (captured / itemized) reconciliation
  complexity_layers:
    - dual_variant_calculation                  # per-diem method vs itemized; auth-hold vs final-capture
    - cascading_side_effects                    # report approve -> lines -> card capture -> trip ledger
    - optimistic_concurrency                     # OCC on TripRequest.version for card issuance (CREATE-with-supersede)
    - rate_threshold_triggers                    # receipt-required threshold, per-diem proration breakpoints

  entity_topology: flat
  # Peer entities linked by foreign keys (TripRequest, ExpenseReport, ExpenseLine,
  # Receipt, VirtualCard, ApprovalStep) — no deep URL nesting; FK fields in bodies.

  state_machine_shape: branching
  # TripRequest: PENDING -> {PENDING_OOP_APPROVAL, AUTO_APPROVED} -> APPROVED (fork-join, divergent side effects)
  # ExpenseReport: DRAFT -> SUBMITTED -> RETURNED -> DRAFT (revision cycle) plus APPROVED/REJECTED branches

  relationship_patterns:
    - one_to_many        # ExpenseReport has many ExpenseLine; ExpenseReport has many ApprovalStep
    - flat_with_references  # ExpenseLine -> Receipt (1:1), ExpenseLine -> VirtualCard, ExpenseReport -> TripRequest
    - cross_aggregate    # ExpenseReport approval reconciles VirtualCard and TripRequest ledgers

  role_model: approval_chain
  # Traveler (requester) -> Approver (manager / OOP approver) -> FinanceAdmin (configures policy, settles cards)

  consistency_model: immediate
  # All cascades (line approval, card capture, trip ledger) settle atomically within the triggering request.

# =============================================================================
# Table 1: Entity-Relationship Table
# =============================================================================
entities:
  - name: Traveler
    parent: null
    common_fields: true
    fields:
      - { name: email, type: string, source: input, description: "Traveler login email (unique)" }
      - { name: full_name, type: string, source: input, description: "Traveler full name" }
      - { name: home_office_state, type: string, source: input, description: "Two-letter US state code of home office, e.g. CA" }
      - { name: manager_id, type: string, source: input, description: "FK -> Approver.id; the approver who reviews this traveler's reports" }
      - { name: status, type: enum, source: system, description: "ACTIVE — travelers are created ACTIVE; no deactivation lifecycle in scope", default: ACTIVE, constraints: "ACTIVE only" }

  - name: Approver
    parent: null
    common_fields: true
    fields:
      - { name: email, type: string, source: input, description: "Approver login email (unique)" }
      - { name: full_name, type: string, source: input, description: "Approver full name" }
      - { name: approval_limit_cents, type: integer, source: input, description: "Maximum total reimbursable an approver may approve without escalation, in cents" }
      - { name: status, type: enum, source: system, description: "ACTIVE — approvers are created ACTIVE; no deactivation lifecycle in scope", default: ACTIVE, constraints: "ACTIVE only" }

  - name: TravelPolicy
    parent: null
    common_fields: true
    fields:
      - { name: name, type: string, source: input, description: "Policy name" }
      - { name: max_economy_fare_cents, type: integer, source: input, description: "Cap on ECONOMY airfare reimbursed per flight line, in cents" }
      - { name: business_class_min_hours, type: integer, source: input, description: "Minimum scheduled flight duration (hours) that makes BUSINESS cabin in-policy" }
      - { name: advance_purchase_days, type: integer, source: input, description: "Minimum days between booking date and departure for advance-purchase fare to be in-policy" }
      - { name: cdw_daily_cap_cents, type: integer, source: input, description: "Per-day cap on rental-car Collision Damage Waiver reimbursed, in cents" }
      - { name: mileage_rate_milli_cents, type: integer, source: input, description: "Personal-vehicle mileage rate in milli-cents per mile (e.g. 67000 = $0.67/mi)" }
      - { name: receipt_required_threshold_cents, type: integer, source: input, description: "Line amounts at or above this value require a verified Receipt, in cents" }
      - { name: status, type: enum, source: system, description: "DRAFT | ACTIVE | RETIRED", default: DRAFT, constraints: "DRAFT on create; activated/retired via state endpoint; exactly one ACTIVE policy gates new TripRequests" }

  - name: PerDiemRate
    parent: null
    common_fields: false   # immutable GSA reference data: id + created_at only
    fields:
      - { name: state_code, type: string, source: input, description: "Two-letter US state code this rate applies to" }
      - { name: lodging_cap_cents, type: integer, source: input, description: "GSA maximum nightly lodging reimbursed, in cents" }
      - { name: mie_cents, type: integer, source: input, description: "GSA full-day Meals & Incidental Expenses per diem, in cents" }

  - name: TripRequest
    parent: null
    common_fields: true
    fields:
      - { name: traveler_id, type: string, source: input, description: "FK -> Traveler.id; the traveler taking the trip" }
      - { name: policy_id, type: string, source: system, description: "FK -> TravelPolicy.id; the ACTIVE policy pinned at creation time" }
      - { name: destination_state, type: string, source: input, description: "Two-letter US state code of trip destination (selects PerDiemRate)" }
      - { name: start_date, type: string, source: input, description: "Trip start date, ISO 8601 date (YYYY-MM-DD), inclusive" }
      - { name: end_date, type: string, source: input, description: "Trip end date, ISO 8601 date (YYYY-MM-DD), inclusive" }
      - { name: budget_total_cents, type: integer, source: input, description: "Authorized trip budget ceiling, in cents" }
      - { name: committed_amount_cents, type: integer, source: computed, description: "Sum of approved ExpenseReport.total_reimbursable_cents charged against this trip" }
      - { name: remaining_budget_cents, type: integer, source: computed, description: "= budget_total_cents - committed_amount_cents" }
      - { name: requires_oop, type: boolean, source: computed, description: "True when any requested figure is out-of-policy at submission (drives PENDING_OOP_APPROVAL fork)" }
      - { name: status, type: enum, source: system, description: "PENDING | PENDING_OOP_APPROVAL | AUTO_APPROVED | APPROVED | DENIED | CANCELLED", default: PENDING, constraints: "PENDING on create; see TripRequest state machine" }

  - name: VirtualCard
    parent: null
    common_fields: true
    fields:
      - { name: trip_request_id, type: string, source: input, description: "FK -> TripRequest.id; the trip this card funds" }
      - { name: load_limit_cents, type: integer, source: input, description: "Total funds loaded onto the card, in cents (must be <= trip remaining_budget_cents at issuance)" }
      - { name: authorized_holds_cents, type: integer, source: computed, description: "Sum of authorization holds for PENDING-settlement lines charged to this card" }
      - { name: captured_total_cents, type: integer, source: computed, description: "Sum of finalized captures for SETTLED lines charged to this card" }
      - { name: available_balance_cents, type: integer, source: computed, description: "= load_limit_cents - authorized_holds_cents - captured_total_cents" }
      - { name: status, type: enum, source: system, description: "ACTIVE | FROZEN | CLOSED", default: ACTIVE, constraints: "ACTIVE on issuance; see VirtualCard state machine" }

  - name: ExpenseReport
    parent: null
    common_fields: true
    fields:
      - { name: trip_request_id, type: string, source: input, description: "FK -> TripRequest.id; the trip this report reconciles" }
      - { name: title, type: string, source: input, description: "Report title" }
      - { name: per_diem_method, type: enum, source: input, description: "PER_DIEM | ITEMIZED — meal reimbursement variant selector", default: PER_DIEM, constraints: "PER_DIEM | ITEMIZED" }
      - { name: meal_reimbursable_cents, type: integer, source: computed, description: "Meal portion of reimbursement under the chosen per_diem_method (see meal_reimbursement calc)" }
      - { name: total_reimbursable_cents, type: integer, source: computed, description: "Final total reimbursed across all non-rejected lines (see report_total calc)" }
      - { name: return_reason, type: string, source: system, description: "Reason text recorded when an approver returns the report for revision" }
      - { name: status, type: enum, source: system, description: "DRAFT | SUBMITTED | RETURNED | APPROVED | REJECTED", default: DRAFT, constraints: "DRAFT on create; see ExpenseReport state machine" }

  - name: ExpenseLine
    parent: null
    common_fields: true
    fields:
      - { name: report_id, type: string, source: input, description: "FK -> ExpenseReport.id; the report this line belongs to" }
      - { name: virtual_card_id, type: string, source: input, description: "FK -> VirtualCard.id; the card this line is charged to (omit for out-of-pocket lines such as MILEAGE)" }
      - { name: line_type, type: enum, source: input, description: "FLIGHT | LODGING | MEAL | RENTAL_CDW | MILEAGE", constraints: "FLIGHT | LODGING | MEAL | RENTAL_CDW | MILEAGE" }
      - { name: claimed_amount_cents, type: integer, source: input, description: "Amount the traveler claims for this line, in cents (0 for MILEAGE — computed from miles)" }
      - { name: cabin_class, type: enum, source: input, description: "ECONOMY | BUSINESS — FLIGHT lines only", constraints: "ECONOMY | BUSINESS; required for FLIGHT, ignored otherwise" }
      - { name: scheduled_hours, type: integer, source: input, description: "Scheduled flight duration in hours — FLIGHT lines only" }
      - { name: advance_days, type: integer, source: input, description: "Days between booking and departure — FLIGHT lines only" }
      - { name: check_in_date, type: string, source: input, description: "Lodging check-in date YYYY-MM-DD — LODGING lines only (interval start, inclusive)" }
      - { name: check_out_date, type: string, source: input, description: "Lodging check-out date YYYY-MM-DD — LODGING lines only (interval end, exclusive)" }
      - { name: rental_days, type: integer, source: input, description: "Number of rental-car days — RENTAL_CDW lines only" }
      - { name: miles, type: integer, source: input, description: "Miles driven — MILEAGE lines only" }
      - { name: reimbursable_amount_cents, type: integer, source: computed, description: "Policy-capped reimbursable amount for this line (see per-type line calcs)" }
      - { name: in_policy, type: boolean, source: computed, description: "True when claimed_amount within policy caps for its line_type" }
      - { name: settlement_status, type: enum, source: system, description: "NONE | PENDING | SETTLED | VOID — card settlement state; NONE for out-of-pocket lines", default: NONE, constraints: "NONE | PENDING | SETTLED | VOID" }
      - { name: status, type: enum, source: system, description: "PENDING_REVIEW | APPROVED | REJECTED", default: PENDING_REVIEW, constraints: "PENDING_REVIEW on create; APPROVED/REJECTED cascade from report decision" }

  - name: Receipt
    parent: null
    common_fields: true
    fields:
      - { name: expense_line_id, type: string, source: input, description: "FK -> ExpenseLine.id; the line this receipt substantiates (1:1)" }
      - { name: image_ref, type: string, source: input, description: "Opaque storage reference for the uploaded receipt image" }
      - { name: ocr_amount_cents, type: integer, source: system, description: "Amount extracted by OCR, in cents (set by the OCR endpoint)" }
      - { name: ocr_merchant, type: string, source: system, description: "Merchant name extracted by OCR" }
      - { name: status, type: enum, source: system, description: "UPLOADED | OCR_PROCESSED | VERIFIED | DISPUTED", default: UPLOADED, constraints: "UPLOADED on upload; see Receipt state machine" }

  - name: ApprovalStep
    parent: null
    common_fields: true
    fields:
      - { name: report_id, type: string, source: input, description: "FK -> ExpenseReport.id; the report whose out-of-policy lines this step adjudicates" }
      - { name: approver_id, type: string, source: input, description: "FK -> Approver.id; the approver assigned this escalation step" }
      - { name: step_order, type: integer, source: input, description: "1-based position in the out-of-policy approval chain; steps adjudicate in ascending step_order" }
      - { name: decision, type: enum, source: system, description: "PENDING | APPROVED | REJECTED", default: PENDING, constraints: "PENDING on create; set by the assigned approver's decision" }
      - { name: comment, type: string, source: system, description: "Approver's comment recorded with the decision" }

# =============================================================================
# Table 2: State Machine Table
# =============================================================================
state_machines:
  - entity: TravelPolicy
    initial_state: DRAFT
    terminal_states: [RETIRED]
    transitions:
      - from: DRAFT
        to: ACTIVE
        trigger: "POST /travel-policies/{policyId}/activate"
        actor: FinanceAdmin
        preconditions:
          - "No other TravelPolicy is in status ACTIVE (ERR_POLICY_ALREADY_ACTIVE) — at most one ACTIVE policy"
        side_effects:
          - "This policy becomes the one pinned onto new TripRequests"
      - from: ACTIVE
        to: RETIRED
        trigger: "POST /travel-policies/{policyId}/retire"
        actor: FinanceAdmin
        preconditions:
          - "No TripRequest in status PENDING or PENDING_OOP_APPROVAL references this policy (ERR_POLICY_IN_USE)"
        side_effects: []

  - entity: TripRequest
    initial_state: PENDING
    terminal_states: [APPROVED, DENIED, CANCELLED]
    transitions:
      - from: PENDING
        to: AUTO_APPROVED
        trigger: "POST /trip-requests/{tripId}/submit"
        actor: Traveler
        preconditions:
          - "Acting Traveler owns this TripRequest (ERR_NOT_OWNER)"
          - "requires_oop is false (budget within policy; no out-of-policy figures) — fork: in-policy branch"
        side_effects:
          - "Sets requires_oop=false"
      - from: PENDING
        to: PENDING_OOP_APPROVAL
        trigger: "POST /trip-requests/{tripId}/submit"
        actor: Traveler
        preconditions:
          - "Acting Traveler owns this TripRequest (ERR_NOT_OWNER)"
          - "requires_oop is true — fork: out-of-policy branch"
        side_effects:
          - "Sets requires_oop=true"
      - from: AUTO_APPROVED
        to: APPROVED
        trigger: "system: join immediately after AUTO_APPROVED"
        actor: system
        preconditions: []
        side_effects:
          - "remaining_budget_cents initialized to budget_total_cents; committed_amount_cents=0"
        note: "Auto-approved branch joins to APPROVED with no manual review."
      - from: PENDING_OOP_APPROVAL
        to: APPROVED
        trigger: "POST /trip-requests/{tripId}/decision"
        actor: Approver
        preconditions:
          - "Acting Approver is the traveler's manager_id (ERR_NOT_OWNER)"
          - "decision == APPROVE"
        side_effects:
          - "remaining_budget_cents initialized to budget_total_cents; committed_amount_cents=0"
        note: "Out-of-policy branch joins to APPROVED only after manual approval."
      - from: PENDING_OOP_APPROVAL
        to: DENIED
        trigger: "POST /trip-requests/{tripId}/decision"
        actor: Approver
        preconditions:
          - "Acting Approver is the traveler's manager_id (ERR_NOT_OWNER)"
          - "decision == DENY"
        side_effects: []
      - from: PENDING
        to: CANCELLED
        trigger: "POST /trip-requests/{tripId}/cancel"
        actor: Traveler
        preconditions:
          - "Acting Traveler owns this TripRequest (ERR_NOT_OWNER)"
        side_effects: []

  - entity: VirtualCard
    initial_state: ACTIVE
    terminal_states: [CLOSED]
    transitions:
      - from: ACTIVE
        to: FROZEN
        trigger: "POST /virtual-cards/{cardId}/freeze"
        actor: FinanceAdmin
        preconditions: []
        side_effects:
          - "New ExpenseLine charges to this card are rejected while FROZEN (ERR_CARD_NOT_ACTIVE)"
      - from: FROZEN
        to: ACTIVE
        trigger: "POST /virtual-cards/{cardId}/unfreeze"
        actor: FinanceAdmin
        preconditions: []
        side_effects: []
      - from: ACTIVE
        to: CLOSED
        trigger: "POST /virtual-cards/{cardId}/close"
        actor: FinanceAdmin
        preconditions:
          - "authorized_holds_cents == 0 (no PENDING-settlement lines outstanding) (ERR_CARD_HAS_OPEN_HOLDS)"
        side_effects: []
      - from: FROZEN
        to: CLOSED
        trigger: "POST /virtual-cards/{cardId}/close"
        actor: FinanceAdmin
        preconditions:
          - "authorized_holds_cents == 0 (ERR_CARD_HAS_OPEN_HOLDS)"
        side_effects: []

  - entity: ExpenseReport
    initial_state: DRAFT
    terminal_states: [APPROVED, REJECTED]
    transitions:
      - from: DRAFT
        to: SUBMITTED
        trigger: "POST /expense-reports/{reportId}/submit"
        actor: Traveler
        preconditions:
          - "Acting Traveler owns this report's TripRequest.traveler_id (ERR_NOT_OWNER)"
          - "TripRequest.status == APPROVED (ERR_TRIP_NOT_APPROVED) — cross-entity dependency"
          - "Report has at least one ExpenseLine (ERR_REPORT_EMPTY)"
          - "Every line with reimbursable_amount_cents >= policy.receipt_required_threshold_cents has a VERIFIED Receipt (ERR_RECEIPT_REQUIRED)"
        side_effects:
          - "Recompute meal_reimbursable_cents and total_reimbursable_cents"
      - from: SUBMITTED
        to: APPROVED
        trigger: "POST /expense-reports/{reportId}/decision"
        actor: Approver
        preconditions:
          - "Acting Approver is the report traveler's manager_id (ERR_NOT_OWNER)"
          - "decision == APPROVE"
          - "All ApprovalStep rows for this report have decision==APPROVED if any out-of-policy line exists (ERR_OOP_CHAIN_INCOMPLETE)"
          - "TripRequest.remaining_budget_cents >= total_reimbursable_cents (ERR_BUDGET_EXCEEDED)"
        side_effects:
          - "CASCADE-1 hop1: all ExpenseLine in PENDING_REVIEW -> APPROVED"
          - "CASCADE-1 hop2: each APPROVED line with settlement_status PENDING -> SETTLED, moving its hold to capture on its VirtualCard"
          - "CASCADE-1 hop3: each affected VirtualCard recomputes authorized_holds_cents/captured_total_cents/available_balance_cents"
          - "CASCADE-1 hop4: TripRequest.committed_amount_cents += total_reimbursable_cents; remaining_budget_cents recomputed"
      - from: SUBMITTED
        to: REJECTED
        trigger: "POST /expense-reports/{reportId}/decision"
        actor: Approver
        preconditions:
          - "Acting Approver is the report traveler's manager_id (ERR_NOT_OWNER)"
          - "decision == REJECT"
        side_effects:
          - "CASCADE-2 hop1: all ExpenseLine in PENDING_REVIEW -> REJECTED"
          - "CASCADE-2 hop2: each REJECTED line with settlement_status PENDING -> VOID, releasing its hold on its VirtualCard (authorized_holds_cents/available_balance_cents recomputed)"
      - from: SUBMITTED
        to: RETURNED
        trigger: "POST /expense-reports/{reportId}/decision"
        actor: Approver
        preconditions:
          - "Acting Approver is the report traveler's manager_id (ERR_NOT_OWNER)"
          - "decision == RETURN"
          - "return_reason provided in payload (ERR_RETURN_REASON_REQUIRED)"
        side_effects:
          - "return_reason stored on the report"
      - from: RETURNED
        to: DRAFT
        trigger: "POST /expense-reports/{reportId}/reopen"
        actor: Traveler
        preconditions:
          - "Acting Traveler owns this report's TripRequest.traveler_id (ERR_NOT_OWNER)"
        side_effects:
          - "return_reason cleared; lines remain editable again — revision cycle DRAFT->SUBMITTED->RETURNED->DRAFT"

  - entity: Receipt
    initial_state: UPLOADED
    terminal_states: []
    transitions:
      - from: UPLOADED
        to: OCR_PROCESSED
        trigger: "POST /receipts/{receiptId}/ocr"
        actor: FinanceAdmin
        preconditions: []
        side_effects:
          - "ocr_amount_cents and ocr_merchant populated from the OCR payload"
      - from: OCR_PROCESSED
        to: VERIFIED
        trigger: "POST /receipts/{receiptId}/verify"
        actor: FinanceAdmin
        preconditions:
          - "ocr_amount_cents equals the linked ExpenseLine.claimed_amount_cents (ERR_RECEIPT_AMOUNT_MISMATCH)"
        side_effects: []
      - from: OCR_PROCESSED
        to: DISPUTED
        trigger: "POST /receipts/{receiptId}/dispute"
        actor: FinanceAdmin
        preconditions: []
        side_effects: []
      - from: DISPUTED
        to: VERIFIED
        trigger: "POST /receipts/{receiptId}/verify"
        actor: FinanceAdmin
        preconditions:
          - "ocr_amount_cents equals the linked ExpenseLine.claimed_amount_cents (ERR_RECEIPT_AMOUNT_MISMATCH)"
        side_effects: []

  - entity: ApprovalStep
    initial_state: PENDING
    terminal_states: [APPROVED, REJECTED]
    transitions:
      - from: PENDING
        to: APPROVED
        trigger: "POST /approval-steps/{stepId}/decision"
        actor: Approver
        preconditions:
          - "Acting Approver is this step's approver_id (ERR_NOT_OWNER)"
          - "All ApprovalStep rows for the same report with a smaller step_order already have decision==APPROVED (ERR_OOP_STEP_OUT_OF_ORDER) — chain adjudicates in ascending step_order"
          - "decision == APPROVE"
        side_effects: []
      - from: PENDING
        to: REJECTED
        trigger: "POST /approval-steps/{stepId}/decision"
        actor: Approver
        preconditions:
          - "Acting Approver is this step's approver_id (ERR_NOT_OWNER)"
          - "All ApprovalStep rows for the same report with a smaller step_order already have decision==APPROVED (ERR_OOP_STEP_OUT_OF_ORDER)"
          - "decision == REJECT"
        side_effects: []

# =============================================================================
# Table 2.1: Concurrency Rules
# =============================================================================
concurrency_rules:
  - rule_id: card-issue-stale-trip
    parent_entity: TripRequest
    write_endpoint: "POST /trip-requests/{tripId}/virtual-cards"
    occ_field: "expected_trip_request_version"
    description: |
      Issuing a VirtualCard against a TripRequest whose version has advanced
      since the client last observed it is rejected. A prior card issuance
      legitimately draws down the trip's remaining_budget_cents (and bumps the
      trip version); a second issuance still carrying the pre-issuance version
      is operating on a stale view of available budget and is rejected.
    error_id: ERR_STALE_VERSION
    http_status: 412

# =============================================================================
# Table 3: Calculation Rules Table
# =============================================================================
calculations:
  - name: flight_line_reimbursable
    trigger: "ExpenseLine create/update where line_type == FLIGHT; recomputed on ExpenseReport submit"
    algorithm: threshold
    formula: |
      # ≥3 inputs (claimed_amount_cents, cabin_class, scheduled_hours, advance_days) with
      # nested branch + tiered cap selection (combinatorial mode (a)).
      in_policy = true
      if cabin_class == BUSINESS:
        if scheduled_hours < policy.business_class_min_hours:
          in_policy = false            # business cabin on a short flight is out-of-policy
        cap = claimed_amount_cents     # business fares are not capped when in-policy
      else:  # ECONOMY
        cap = policy.max_economy_fare_cents
        if advance_days < policy.advance_purchase_days:
          cap = floor(cap * 0.80)      # late-booked economy reimbursed at 80% of the economy cap
      reimbursable_amount_cents = min(claimed_amount_cents, cap)
      if claimed_amount_cents > cap: in_policy = false
    input_set: "single FLIGHT line"
    constants: {}
    precision: "integer cents; floor() truncates toward zero"

  - name: cdw_line_reimbursable
    trigger: "ExpenseLine create/update where line_type == RENTAL_CDW"
    algorithm: threshold
    formula: |
      cap = policy.cdw_daily_cap_cents * rental_days
      reimbursable_amount_cents = min(claimed_amount_cents, cap)
      in_policy = (claimed_amount_cents <= cap)
    input_set: "single RENTAL_CDW line"
    constants: {}
    precision: "integer cents"

  - name: mileage_line_reimbursable
    trigger: "ExpenseLine create/update where line_type == MILEAGE"
    algorithm: aggregation
    formula: |
      # milli-cents per mile -> cents; round half up at the final step only.
      reimbursable_amount_cents = round_half_up( (miles * policy.mileage_rate_milli_cents) / 1000 )
      in_policy = true   # mileage is always in-policy (out-of-pocket, rate-based)
    input_set: "single MILEAGE line"
    constants: {}
    precision: "integer cents; round_half_up on the single division"

  - name: lodging_line_reimbursable
    trigger: "ExpenseLine create/update where line_type == LODGING"
    algorithm: threshold
    formula: |
      nights = date_diff_days(check_out_date, check_in_date)   # half-open interval length
      cap = perdiem(trip.destination_state).lodging_cap_cents * nights
      reimbursable_amount_cents = min(claimed_amount_cents, cap)
      in_policy = (claimed_amount_cents <= cap)
    input_set: "single LODGING line; perdiem looked up by trip.destination_state"
    constants: {}
    precision: "integer cents"

  - name: meal_reimbursement
    trigger: "ExpenseReport submit and approve; recompute meal_reimbursable_cents"
    algorithm: forward_looking
    formula: |
      # DUAL-VARIANT on ExpenseReport (different entity domain from card_settlement).
      # M&IE per diem with first/last-day proration at 75% (GSA rule).
      rate = perdiem(trip.destination_state).mie_cents
      trip_days = date_diff_days(trip.end_date, trip.start_date) + 1   # inclusive both ends
      # per-day full-day rate is `rate`; first and last day each get 75%.
      see variants
    input_set: "all MEAL lines on the report; trip dates from linked TripRequest"
    constants:
      FIRST_LAST_DAY_FACTOR: 0.75
    precision: "integer cents; round_half_up PER DAY then sum (see per_diem_total)"
    variants:
      - name: per_diem_method
        when: "report.per_diem_method == PER_DIEM"
        difference: |
          Ignore MEAL line claimed amounts entirely. meal_reimbursable_cents =
          per_diem_total(rate, trip_days) — the GSA flat M&IE per diem with
          first/last-day proration.
      - name: itemized_method
        when: "report.per_diem_method == ITEMIZED"
        difference: |
          meal_reimbursable_cents = min( sum(MEAL line claimed_amount_cents),
          per_diem_total(rate, trip_days) ) — actuals reimbursed but capped at
          the same per-diem ceiling. Identical inputs, different result from
          per_diem_method whenever actual meal spend != the flat per diem.

  - name: per_diem_total
    trigger: "called by meal_reimbursement"
    algorithm: aggregation
    formula: |
      # Combinatorial mode (b): nested rounding where ORDER matters.
      # Pinned order: round EACH day's M&IE to whole cents, THEN sum.
      # day 1 (first):        round_half_up(rate * 0.75)
      # day trip_days (last): round_half_up(rate * 0.75)
      # middle days:          rate (already whole cents)
      if trip_days == 1:
        return round_half_up(rate * 0.75)
      total = round_half_up(rate * 0.75)            # first day
      total += round_half_up(rate * 0.75)           # last day
      total += rate * (trip_days - 2)               # full middle days
      return total
    input_set: "rate (mie_cents), trip_days"
    constants:
      FIRST_LAST_DAY_FACTOR: 0.75
    precision: "integer cents; round_half_up PER DAY then sum (NOT sum-then-round)"

  - name: report_total
    trigger: "ExpenseReport submit and approve; recompute total_reimbursable_cents"
    algorithm: aggregation
    formula: |
      # Combinatorial mode (c): circular-looking dependency pinned by evaluation order.
      # meal_reimbursable_cents must be computed FIRST (it does not depend on per-line
      # MEAL reimbursable_amount_cents); then total sums non-MEAL line reimbursables
      # plus the report-level meal_reimbursable_cents. MEAL lines' own
      # reimbursable_amount_cents are 0 and excluded from the sum to avoid double counting.
      # Evaluation order (pinned):
      #   1. meal_reimbursable_cents = meal_reimbursement(report)
      #   2. total_reimbursable_cents = meal_reimbursable_cents
      #        + sum(line.reimbursable_amount_cents for line in lines
      #              where line.status != REJECTED and line.line_type != MEAL)
      total_reimbursable_cents = result of step 2
    input_set: "all non-REJECTED, non-MEAL lines + report.meal_reimbursable_cents"
    constants: {}
    precision: "integer cents"

  - name: card_settlement
    trigger: "ExpenseLine charged to a card (PENDING hold); ExpenseReport approve (capture) / reject (void)"
    algorithm: aggregation
    formula: |
      # DUAL-VARIANT on VirtualCard (different entity domain from meal_reimbursement).
      authorized_holds_cents = sum(line.reimbursable_amount_cents
                                   for line charged to card where settlement_status == PENDING)
      captured_total_cents   = sum(line.reimbursable_amount_cents
                                   for line charged to card where settlement_status == SETTLED)
      available_balance_cents = load_limit_cents - authorized_holds_cents - captured_total_cents
    input_set: "all ExpenseLine rows whose virtual_card_id == card.id"
    constants: {}
    precision: "integer cents"
    variants:
      - name: authorization_hold
        when: "line created/charged to card, before report approval (settlement_status PENDING)"
        difference: "Amount sits in authorized_holds_cents (provisional reservation); available_balance reduced but captured_total unchanged."
      - name: final_capture
        when: "report APPROVED (settlement_status PENDING -> SETTLED)"
        difference: "Same amount moves out of authorized_holds_cents into captured_total_cents; available_balance unchanged by the move itself. Provisional vs final on the SAME amount, opposite ledger buckets."

  - name: trip_budget_ledger
    trigger: "ExpenseReport approve (commit) / TripRequest decision (init)"
    algorithm: aggregation
    formula: |
      committed_amount_cents = sum(report.total_reimbursable_cents
                                   for report charged to trip where report.status == APPROVED)
      remaining_budget_cents = budget_total_cents - committed_amount_cents
    input_set: "all APPROVED ExpenseReport rows whose trip_request_id == trip.id"
    constants: {}
    precision: "integer cents"

  - name: trip_requires_oop
    trigger: "TripRequest submit"
    algorithm: threshold
    formula: |
      requires_oop = (budget_total_cents > 2 * (perdiem(destination_state).lodging_cap_cents
                       + perdiem(destination_state).mie_cents) * trip_nights)
      # i.e. requested budget more than double the GSA lodging+M&IE baseline for the trip is out-of-policy.
      trip_nights = date_diff_days(end_date, start_date)
    input_set: "TripRequest fields + PerDiemRate for destination_state"
    constants:
      OOP_BUDGET_MULTIPLE: 2
    precision: "integer cents"

# =============================================================================
# Table 4: Validation Rules Table (ordered by priority)
# =============================================================================
validations:
  - priority: 1
    category: auth
    check: "X-User-Role and X-User-ID headers present and X-User-Role is a known role"
    error_id: ERR_UNAUTHENTICATED
    http_status: 401
    applies_to: all

  - priority: 2
    category: auth
    check: "Acting role is permitted to call this endpoint per the RBAC matrix"
    error_id: ERR_UNAUTHORIZED
    http_status: 403
    applies_to: all

  - priority: 3
    category: existence
    check: "All path-referenced resources and required FK bodies resolve to existing entities, left-to-right"
    error_id: ERR_NOT_FOUND
    http_status: 404
    applies_to: all

  - priority: 4
    category: auth
    check: "Ownership: acting entity_backed user must own/manage the target (Traveler owns trip/report; Approver is the traveler's manager_id; ApprovalStep approver_id matches)"
    error_id: ERR_NOT_OWNER
    http_status: 403
    applies_to: "ownership-gated transitions and decision endpoints"

  - priority: 5
    category: business_constraint
    check: "Request body well-formed: required fields present, enum values valid, integers non-negative"
    error_id: ERR_INVALID_REQUEST
    http_status: 422
    applies_to: all

  - priority: 6
    category: state
    check: "Target resource is in a state from which the requested transition is defined"
    error_id: ERR_INVALID_STATE
    http_status: 409
    applies_to: "all state-transition endpoints"

  - priority: 7
    category: business_referential
    check: "OCC: expected_<parent>_version matches the parent's current version on CREATE-with-supersede"
    error_id: ERR_STALE_VERSION
    http_status: 412
    applies_to: "POST /trip-requests/{tripId}/virtual-cards"

  - priority: 8
    category: business_referential
    check: "Report submit: every line whose reimbursable_amount_cents >= receipt_required_threshold_cents has a VERIFIED Receipt"
    error_id: ERR_RECEIPT_REQUIRED
    http_status: 409
    applies_to: "POST /expense-reports/{reportId}/submit"

  - priority: 9
    category: business_constraint
    check: "Report submit: report has at least one ExpenseLine (empty-set boundary)"
    error_id: ERR_REPORT_EMPTY
    http_status: 409
    applies_to: "POST /expense-reports/{reportId}/submit"

  - priority: 9.5
    category: business_constraint
    check: "TripRequest create: exactly one TravelPolicy is ACTIVE to pin onto the trip"
    error_id: ERR_NO_ACTIVE_POLICY
    http_status: 409
    applies_to: "POST /trip-requests"

  - priority: 10
    category: business_temporal
    check: "TripRequest dates per traveler must not overlap an existing trip in status PENDING, PENDING_OOP_APPROVAL, AUTO_APPROVED, or APPROVED (closed interval [start_date, end_date]; touching endpoints collide)"
    error_id: ERR_TRIP_DATE_OVERLAP
    http_status: 409
    applies_to: "POST /trip-requests"

  - priority: 11
    category: business_temporal
    check: "LODGING lines within a report must not overlap on [check_in, check_out) (half-open; adjacent stays where check_out == next check_in are allowed)"
    error_id: ERR_LODGING_OVERLAP
    http_status: 409
    applies_to: "POST /expense-lines"

  - priority: 12
    category: business_constraint
    check: "ExpenseLine charged to a card requires the VirtualCard in status ACTIVE"
    error_id: ERR_CARD_NOT_ACTIVE
    http_status: 409
    applies_to: "POST /expense-lines"

  - priority: 13
    category: business_fiscal
    check: "ExpenseLine charged to a card requires reimbursable_amount_cents <= card.available_balance_cents"
    error_id: ERR_CARD_LIMIT_EXCEEDED
    http_status: 409
    applies_to: "POST /expense-lines"

  - priority: 14
    category: business_constraint
    check: "Out-of-policy approval chain complete: if report has any out-of-policy line, all ApprovalStep rows decision==APPROVED before report APPROVE"
    error_id: ERR_OOP_CHAIN_INCOMPLETE
    http_status: 409
    applies_to: "POST /expense-reports/{reportId}/decision (APPROVE)"

  - priority: 15
    category: business_fiscal
    check: "Report approve: TripRequest.remaining_budget_cents >= report.total_reimbursable_cents"
    error_id: ERR_BUDGET_EXCEEDED
    http_status: 409
    applies_to: "POST /expense-reports/{reportId}/decision (APPROVE)"

# =============================================================================
# Response Envelope (FIXED)
# =============================================================================
response_envelope:
  success: |
    { "meta": { "api_request_id": "req_xxx", "api_request_timestamp": "ISO8601" },
      "response_type": "object" | "array", "data": {} }
  error: |
    { "meta": { ... }, "response_type": "error",
      "data": { "error_id": "ERR_XXX", "message": "..." } }
  pagination_fields: ["limit", "offset", "total_count", "has_more"]
  pagination_defaults: { limit: 10, min: 1, max: 100, offset: 0 }

# =============================================================================
# Table 5: API Endpoint Table
# =============================================================================
endpoints:
  # ---- Traveler ----
  - method: POST
    path: "/travelers"
    description: "Create a Traveler"
    roles: [FinanceAdmin]
    code: 201
    input: [email, full_name, home_office_state, manager_id]
    output: Traveler
    side_effects: ["status=ACTIVE"]
  - method: GET
    path: "/travelers/{travelerId}"
    description: "Get a Traveler"
    roles: [FinanceAdmin, Traveler, Approver]
    code: 200
    input: []
    output: Traveler
    side_effects: []
  - method: GET
    path: "/travelers"
    description: "List Travelers (filter by manager_id)"
    roles: [FinanceAdmin, Approver]
    code: 200
    input: ["manager_id?", "limit?", "offset?"]
    output: Traveler[]
    side_effects: []

  # ---- Approver ----
  - method: POST
    path: "/approvers"
    description: "Create an Approver"
    roles: [FinanceAdmin]
    code: 201
    input: [email, full_name, approval_limit_cents]
    output: Approver
    side_effects: ["status=ACTIVE"]
  - method: GET
    path: "/approvers/{approverId}"
    description: "Get an Approver"
    roles: [FinanceAdmin, Approver]
    code: 200
    input: []
    output: Approver
    side_effects: []

  # ---- TravelPolicy ----
  - method: POST
    path: "/travel-policies"
    description: "Create a TravelPolicy (DRAFT)"
    roles: [FinanceAdmin]
    code: 201
    input: [name, max_economy_fare_cents, business_class_min_hours, advance_purchase_days, cdw_daily_cap_cents, mileage_rate_milli_cents, receipt_required_threshold_cents]
    output: TravelPolicy
    side_effects: ["status=DRAFT"]
  - method: GET
    path: "/travel-policies/{policyId}"
    description: "Get a TravelPolicy"
    roles: [FinanceAdmin, Traveler, Approver]
    code: 200
    input: []
    output: TravelPolicy
    side_effects: []
  - method: POST
    path: "/travel-policies/{policyId}/activate"
    description: "Activate a DRAFT policy"
    roles: [FinanceAdmin]
    code: 200
    input: []
    output: TravelPolicy
    side_effects: ["status DRAFT->ACTIVE; enforces single-ACTIVE invariant"]
  - method: POST
    path: "/travel-policies/{policyId}/retire"
    description: "Retire an ACTIVE policy"
    roles: [FinanceAdmin]
    code: 200
    input: []
    output: TravelPolicy
    side_effects: ["status ACTIVE->RETIRED"]

  # ---- PerDiemRate ----
  - method: POST
    path: "/per-diem-rates"
    description: "Create a PerDiemRate (GSA reference data)"
    roles: [FinanceAdmin]
    code: 201
    input: [state_code, lodging_cap_cents, mie_cents]
    output: PerDiemRate
    side_effects: []
  - method: GET
    path: "/per-diem-rates/{rateId}"
    description: "Get a PerDiemRate"
    roles: [FinanceAdmin, Traveler, Approver]
    code: 200
    input: []
    output: PerDiemRate
    side_effects: []
  - method: GET
    path: "/per-diem-rates"
    description: "List PerDiemRates (filter by state_code)"
    roles: [FinanceAdmin, Traveler, Approver]
    code: 200
    input: ["state_code?", "limit?", "offset?"]
    output: PerDiemRate[]
    side_effects: []

  # ---- TripRequest ----
  - method: POST
    path: "/trip-requests"
    description: "Create a TripRequest (pins the ACTIVE policy)"
    roles: [Traveler]
    code: 201
    input: [traveler_id, destination_state, start_date, end_date, budget_total_cents]
    output: TripRequest
    side_effects: ["status=PENDING; policy_id pinned to ACTIVE policy; overlap check vs traveler's other trips"]
  - method: GET
    path: "/trip-requests/{tripId}"
    description: "Get a TripRequest"
    roles: [FinanceAdmin, Traveler, Approver]
    code: 200
    input: []
    output: TripRequest
    side_effects: []
  - method: GET
    path: "/trip-requests"
    description: "List TripRequests (filter by traveler_id or policy_id)"
    roles: [FinanceAdmin, Traveler, Approver]
    code: 200
    input: ["traveler_id?", "policy_id?", "limit?", "offset?"]
    output: TripRequest[]
    side_effects: []
  - method: POST
    path: "/trip-requests/{tripId}/submit"
    description: "Submit a TripRequest for authorization (forks AUTO_APPROVED vs PENDING_OOP_APPROVAL)"
    roles: [Traveler]
    code: 200
    input: []
    output: TripRequest
    side_effects: ["computes requires_oop; PENDING->AUTO_APPROVED->APPROVED or PENDING->PENDING_OOP_APPROVAL"]
  - method: POST
    path: "/trip-requests/{tripId}/decision"
    description: "Approver decides an out-of-policy TripRequest"
    roles: [Approver]
    code: 200
    input: [decision]
    output: TripRequest
    side_effects: ["PENDING_OOP_APPROVAL->APPROVED (init ledger) or ->DENIED"]
  - method: POST
    path: "/trip-requests/{tripId}/cancel"
    description: "Cancel a PENDING TripRequest"
    roles: [Traveler]
    code: 200
    input: []
    output: TripRequest
    side_effects: ["PENDING->CANCELLED"]

  # ---- VirtualCard (issued under a trip) ----
  - method: POST
    path: "/trip-requests/{tripId}/virtual-cards"
    description: "Issue a VirtualCard against an APPROVED trip (OCC on trip version)"
    roles: [FinanceAdmin]
    code: 201
    input: [load_limit_cents, expected_trip_request_version]
    output: VirtualCard
    side_effects: ["status=ACTIVE; bumps TripRequest.version by 1; trip_request_id set from path"]
  - method: GET
    path: "/virtual-cards/{cardId}"
    description: "Get a VirtualCard"
    roles: [FinanceAdmin, Traveler]
    code: 200
    input: []
    output: VirtualCard
    side_effects: []
  - method: GET
    path: "/virtual-cards"
    description: "List VirtualCards (filter by trip_request_id)"
    roles: [FinanceAdmin, Traveler]
    code: 200
    input: ["trip_request_id?", "limit?", "offset?"]
    output: VirtualCard[]
    side_effects: []
  - method: POST
    path: "/virtual-cards/{cardId}/freeze"
    description: "Freeze a card"
    roles: [FinanceAdmin]
    code: 200
    input: []
    output: VirtualCard
    side_effects: ["ACTIVE->FROZEN"]
  - method: POST
    path: "/virtual-cards/{cardId}/unfreeze"
    description: "Unfreeze a card"
    roles: [FinanceAdmin]
    code: 200
    input: []
    output: VirtualCard
    side_effects: ["FROZEN->ACTIVE"]
  - method: POST
    path: "/virtual-cards/{cardId}/close"
    description: "Close a card (no open holds)"
    roles: [FinanceAdmin]
    code: 200
    input: []
    output: VirtualCard
    side_effects: ["ACTIVE/FROZEN->CLOSED"]

  # ---- ExpenseReport ----
  - method: POST
    path: "/expense-reports"
    description: "Create an ExpenseReport (DRAFT)"
    roles: [Traveler]
    code: 201
    input: [trip_request_id, title, "per_diem_method?"]
    output: ExpenseReport
    side_effects: ["status=DRAFT; per_diem_method defaults PER_DIEM"]
  - method: GET
    path: "/expense-reports/{reportId}"
    description: "Get an ExpenseReport"
    roles: [FinanceAdmin, Traveler, Approver]
    code: 200
    input: []
    output: ExpenseReport
    side_effects: []
  - method: GET
    path: "/expense-reports"
    description: "List ExpenseReports (filter by trip_request_id)"
    roles: [FinanceAdmin, Traveler, Approver]
    code: 200
    input: ["trip_request_id?", "limit?", "offset?"]
    output: ExpenseReport[]
    side_effects: []
  - method: POST
    path: "/expense-reports/{reportId}/submit"
    description: "Submit a DRAFT report for review"
    roles: [Traveler]
    code: 200
    input: []
    output: ExpenseReport
    side_effects: ["DRAFT->SUBMITTED; recompute meal_reimbursable_cents and total_reimbursable_cents"]
  - method: POST
    path: "/expense-reports/{reportId}/decision"
    description: "Approver decides a SUBMITTED report (APPROVE/REJECT/RETURN)"
    roles: [Approver]
    code: 200
    input: [decision, "return_reason?"]
    output: ExpenseReport
    side_effects: ["APPROVE (CASCADE-1), REJECT (CASCADE-2), or RETURN"]
  - method: POST
    path: "/expense-reports/{reportId}/reopen"
    description: "Reopen a RETURNED report to DRAFT"
    roles: [Traveler]
    code: 200
    input: []
    output: ExpenseReport
    side_effects: ["RETURNED->DRAFT; clears return_reason"]

  # ---- ExpenseLine ----
  - method: POST
    path: "/expense-lines"
    description: "Add an ExpenseLine to a DRAFT report"
    roles: [Traveler]
    code: 201
    input: [report_id, line_type, claimed_amount_cents, "virtual_card_id?", "cabin_class?", "scheduled_hours?", "advance_days?", "check_in_date?", "check_out_date?", "rental_days?", "miles?"]
    output: ExpenseLine
    side_effects: ["status=PENDING_REVIEW; computes reimbursable_amount_cents + in_policy; if card given, creates PENDING hold (settlement_status=PENDING)"]
  - method: GET
    path: "/expense-lines/{lineId}"
    description: "Get an ExpenseLine"
    roles: [FinanceAdmin, Traveler, Approver]
    code: 200
    input: []
    output: ExpenseLine
    side_effects: []
  - method: GET
    path: "/expense-lines"
    description: "List ExpenseLines (filter by report_id or virtual_card_id)"
    roles: [FinanceAdmin, Traveler, Approver]
    code: 200
    input: ["report_id?", "virtual_card_id?", "limit?", "offset?"]
    output: ExpenseLine[]
    side_effects: []
  - method: DELETE
    path: "/expense-lines/{lineId}"
    description: "Remove a line from a DRAFT report"
    roles: [Traveler]
    code: 204
    input: []
    output: null
    side_effects: ["releases any PENDING hold on the card"]

  # ---- Receipt ----
  - method: POST
    path: "/receipts"
    description: "Upload a Receipt for an ExpenseLine (1:1)"
    roles: [Traveler]
    code: 201
    input: [expense_line_id, image_ref]
    output: Receipt
    side_effects: ["status=UPLOADED"]
  - method: GET
    path: "/receipts/{receiptId}"
    description: "Get a Receipt"
    roles: [FinanceAdmin, Traveler, Approver]
    code: 200
    input: []
    output: Receipt
    side_effects: []
  - method: GET
    path: "/receipts"
    description: "List Receipts (filter by expense_line_id)"
    roles: [FinanceAdmin, Traveler, Approver]
    code: 200
    input: ["expense_line_id?", "limit?", "offset?"]
    output: Receipt[]
    side_effects: []
  - method: POST
    path: "/receipts/{receiptId}/ocr"
    description: "Run OCR on a receipt (sets ocr_amount_cents/ocr_merchant)"
    roles: [FinanceAdmin]
    code: 200
    input: [ocr_amount_cents, ocr_merchant]
    output: Receipt
    side_effects: ["UPLOADED->OCR_PROCESSED"]
  - method: POST
    path: "/receipts/{receiptId}/verify"
    description: "Verify an OCR'd or disputed receipt against the claimed amount"
    roles: [FinanceAdmin]
    code: 200
    input: []
    output: Receipt
    side_effects: ["OCR_PROCESSED/DISPUTED->VERIFIED (requires ocr_amount==claimed)"]
  - method: POST
    path: "/receipts/{receiptId}/dispute"
    description: "Mark an OCR'd receipt disputed"
    roles: [FinanceAdmin]
    code: 200
    input: []
    output: Receipt
    side_effects: ["OCR_PROCESSED->DISPUTED"]

  # ---- ApprovalStep (out-of-policy chain) ----
  - method: POST
    path: "/approval-steps"
    description: "Add an out-of-policy approval step to a report"
    roles: [FinanceAdmin]
    code: 201
    input: [report_id, approver_id, step_order]
    output: ApprovalStep
    side_effects: ["decision=PENDING"]
  - method: GET
    path: "/approval-steps/{stepId}"
    description: "Get an ApprovalStep"
    roles: [FinanceAdmin, Traveler, Approver]
    code: 200
    input: []
    output: ApprovalStep
    side_effects: []
  - method: GET
    path: "/approval-steps"
    description: "List ApprovalSteps (filter by report_id or approver_id)"
    roles: [FinanceAdmin, Traveler, Approver]
    code: 200
    input: ["report_id?", "approver_id?", "limit?", "offset?"]
    output: ApprovalStep[]
    side_effects: []
  - method: POST
    path: "/approval-steps/{stepId}/decision"
    description: "Assigned approver decides an out-of-policy step (in ascending step_order)"
    roles: [Approver]
    code: 200
    input: [decision, "comment?"]
    output: ApprovalStep
    side_effects: ["PENDING->APPROVED/REJECTED; enforces ascending step_order"]

# =============================================================================
# Table 6: Error Code Catalog
# =============================================================================
errors:
  - { id: ERR_UNAUTHENTICATED, http: 401, condition: "Missing/invalid X-User-Role or X-User-ID headers" }
  - { id: ERR_UNAUTHORIZED, http: 403, condition: "Role not permitted to call this endpoint" }
  - { id: ERR_NOT_OWNER, http: 403, condition: "Acting user does not own/manage the target resource" }
  - { id: ERR_NOT_FOUND, http: 404, condition: "Path or FK-referenced resource does not exist" }
  - { id: ERR_INVALID_REQUEST, http: 422, condition: "Malformed body: missing required field, bad enum, negative integer" }
  - { id: ERR_INVALID_STATE, http: 409, condition: "Resource not in a state from which the requested transition is defined" }
  - { id: ERR_STALE_VERSION, http: 412, condition: "expected_trip_request_version does not match TripRequest.version on card issuance" }
  - { id: ERR_POLICY_ALREADY_ACTIVE, http: 409, condition: "Activating a policy when another policy is already ACTIVE" }
  - { id: ERR_POLICY_IN_USE, http: 409, condition: "Retiring a policy still referenced by a PENDING/PENDING_OOP_APPROVAL trip" }
  - { id: ERR_NO_ACTIVE_POLICY, http: 409, condition: "Creating a TripRequest when no policy is ACTIVE" }
  - { id: ERR_TRIP_DATE_OVERLAP, http: 409, condition: "Traveler's new trip dates collide with an existing trip (closed interval)" }
  - { id: ERR_TRIP_NOT_APPROVED, http: 409, condition: "Submitting a report whose TripRequest is not APPROVED" }
  - { id: ERR_REPORT_EMPTY, http: 409, condition: "Submitting a report with zero ExpenseLines" }
  - { id: ERR_RECEIPT_REQUIRED, http: 409, condition: "Submitting a report with a >= threshold line lacking a VERIFIED receipt" }
  - { id: ERR_RECEIPT_AMOUNT_MISMATCH, http: 409, condition: "Verifying a receipt whose ocr_amount_cents != linked line claimed_amount_cents" }
  - { id: ERR_LODGING_OVERLAP, http: 409, condition: "LODGING line interval overlaps another LODGING line in the same report (half-open)" }
  - { id: ERR_CARD_NOT_ACTIVE, http: 409, condition: "Charging a line to a card that is not ACTIVE" }
  - { id: ERR_CARD_LIMIT_EXCEEDED, http: 409, condition: "Line reimbursable exceeds card available_balance_cents" }
  - { id: ERR_CARD_HAS_OPEN_HOLDS, http: 409, condition: "Closing a card with authorized_holds_cents > 0" }
  - { id: ERR_OOP_CHAIN_INCOMPLETE, http: 409, condition: "Approving a report whose out-of-policy approval chain is not fully APPROVED" }
  - { id: ERR_OOP_STEP_OUT_OF_ORDER, http: 409, condition: "Deciding an approval step before lower step_order steps are APPROVED" }
  - { id: ERR_BUDGET_EXCEEDED, http: 409, condition: "Report total exceeds trip remaining_budget_cents at approval" }
  - { id: ERR_RETURN_REASON_REQUIRED, http: 422, condition: "RETURN decision without return_reason" }
  - { id: ERR_VALIDATION, http: 422, condition: "Pagination/query param out of range (limit/offset)" }

# =============================================================================
# Table 7: RBAC Matrix
# =============================================================================
roles:
  - name: Traveler
    description: "Employee who requests trips, builds and submits expense reports, uploads receipts."
    identity: "entity_backed:Traveler"
    exclusive_operations:
      - "POST /trip-requests — create own trip"
      - "POST /trip-requests/{tripId}/submit — submit own trip"
      - "POST /trip-requests/{tripId}/cancel — cancel own trip"
      - "POST /expense-reports — create report against own trip"
      - "POST /expense-reports/{reportId}/submit — submit own report"
      - "POST /expense-reports/{reportId}/reopen — reopen own returned report"
      - "POST /expense-lines — add line to own DRAFT report"
      - "DELETE /expense-lines/{lineId} — remove own line"
      - "POST /receipts — upload receipt for own line"
    shared_operations:
      - "GET endpoints (own/visible resources)"

  - name: Approver
    description: "Manager who authorizes out-of-policy trips, decides expense reports, and adjudicates out-of-policy approval-chain steps."
    identity: "entity_backed:Approver"
    exclusive_operations:
      - "POST /trip-requests/{tripId}/decision — authorize/deny an out-of-policy trip for managed travelers"
      - "POST /expense-reports/{reportId}/decision — approve/reject/return a managed traveler's report"
      - "POST /approval-steps/{stepId}/decision — decide an assigned out-of-policy step"
    shared_operations:
      - "GET endpoints (managed travelers' resources)"

  - name: FinanceAdmin
    description: "Operator who configures policy and GSA per-diem reference data, manages travelers/approvers, runs receipt OCR, and issues/freezes/closes virtual cards. Not tied to any persisted entity."
    identity: "opaque"
    exclusive_operations:
      - "POST /travelers, POST /approvers — provision users"
      - "POST /travel-policies + activate/retire — manage policy"
      - "POST /per-diem-rates — load GSA rates"
      - "POST /trip-requests/{tripId}/virtual-cards — issue virtual card"
      - "POST /virtual-cards/{cardId}/{freeze,unfreeze,close} — manage cards"
      - "POST /receipts/{receiptId}/{ocr,verify,dispute} — process receipts"
      - "POST /approval-steps — build the out-of-policy approval chain"
    shared_operations:
      - "GET endpoints (all resources)"
