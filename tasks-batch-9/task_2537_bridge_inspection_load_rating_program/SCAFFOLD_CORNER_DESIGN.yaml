          assert:
            - "HTTP 409 with data.error_id == ERR_RATING_STATE_INVALID"
            - "PlanOfAction.${poa_id}.status is still REQUIRED with submitted_at == null and revision_count == 0"
            - "Bridge.${br_id}.scour_status == SCOUR_CRITICAL, poa_compliant == false and inspection_interval_months == 12 - the blocked submit changed none of it"
            - "After PUT /plans-of-action/${poa_id} with monitoring_frequency_months 3, closure_trigger_stage_m 4.5 and countermeasure_type RIPRAP the status is DRAFT, and the identical submit then returns 200 with status SUBMITTED"

      - name: federal_submission_accepted_is_terminal_and_locks_cycle
        claim_type: terminal_state_lockdown
        grounds:
          - state_machines.FederalSubmission.SUBMITTED_to_ACCEPTED
          - state_machines.ProgramCycle.SUBMITTED_to_CLOSED
          - errors.ERR_PROGRAM_STATE_INVALID
        distinguishing_aspect: "ACCEPTED is terminal for FederalSubmission and CLOSED is terminal for its ProgramCycle: a second review, a resubmit and a cycle reopen all return 409 ERR_PROGRAM_STATE_INVALID, and the compliance snapshot taken at submit stays frozen."
        test_recipe:
          setup:
            - "Logical clock 2026-09-01T00:00:00Z; exactly one bridge, never inspected, whose next_inspection_due_date is 2028-09-01 - strictly after the clock date, so it is not overdue and inspection_compliance_pct is 100.00."
            - "One cycle locked before the submission is sent; the ProgramAdmin submitter (admin-user-1) and the FhwaReviewer (fhwa-user-1) are distinct opaque identities."
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-09-01T00:00:00Z" }
              as: ProgramAdmin
              as_user_id: "admin-user-1"
            - call: "POST /bridges"
              payload: { nbi_structure_number: "STR-000001", name: "Cedar Creek Bridge", owner_agency: "STATE_DOT", structure_type: "STEEL_GIRDER", deck_area_sqm: 1000, year_built: 1972, adt: 12000, detour_length_km: 8.5, spans_water: true }
              as: ProgramAdmin
              as_user_id: "admin-user-1"
              captures: { br_id: $.data.id }
            - call: "POST /program-cycles"
              payload: { fiscal_year: 2027, authorized_budget_cents: 10000000000, ranking_policy: "CONDITION_BASED" }
