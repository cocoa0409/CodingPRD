            - *C_W2
            - *C_SE
            - *C_AW1
            - *C_AW2
            - *C_RM
            - *C_OPEN
            - *C_S1
            - *C_ACC1
            - *C_GRV
            - *C_S2
            - *C_ACC2
            - *C_ACTIVATE
            - *C_EP1
            - *C_A1
            - *C_MLIST
            - *C_D1
            - *C_D2
            - *C_D3
            - &C_APP1
              call: "POST /script-assignments/${a1}/approve"
              payload: {}
              as: Showrunner
              as_user_id: "${sr}"
            - *C_GEP
            - *C_A2
            - &C_MLIST2
              call: "GET /milestones?assignment_id=${a2}"
              payload: {}
              as: Showrunner
              as_user_id: "${sr}"
              captures: { n1: "$.data[0].id" }
            - &C_D2A
              call: "POST /milestones/${n1}/deliver"
              payload: {}
              as: Writer
              as_user_id: "${w2}"
            - &C_APP2
              call: "POST /script-assignments/${a2}/approve"
              payload: {}
              as: Showrunner
              as_user_id: "${sr}"
          trigger:
            - &C_SUB1
              call: "POST /episodes/${ep1}/credit-submissions"
              payload: { writer_id: "${w1}", claim_basis: "WRITTEN_BY", claimed_contribution_pct: 60 }
              as: Writer
              as_user_id: "${w1}"
              captures: { sb1: "$.data.id" }
            - &C_SUB2
