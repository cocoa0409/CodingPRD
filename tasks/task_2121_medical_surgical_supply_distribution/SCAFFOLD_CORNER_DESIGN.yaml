            - "all four responses are HTTP 409"
            - "GET /items returns total_count == 1 and GET /contract-lines?contract_id=${ctr_id} returns total_count == 1"

      - name: substitution_respond_on_a_pending_request_is_rejected
        claim_type: error_triggerable
        grounds:
