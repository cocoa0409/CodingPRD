      in SUBMITTED / BOARD_REVIEW / AGENCY_REVIEW): VERIFY_CLOSE fails with ERR_DEVIATION_PENDING_ON_ITEM while the request
      sits in AGENCY_REVIEW and succeeds after the denial, which also resets risk_disposition to NONE — a child-to-parent
      gate, the reverse direction of the package/engagement gate.'
    test_recipe:
      setup:
      - Clock 2026-02-01T00:00:00Z; offering PATH_SELECTED (AGENCY_SPONSORED, sponsor DOT) with an engagement whose assessor_user_id
        is 3pao-1.
      - PoamItem severity MODERATE, detected_at 2026-02-01T00:00:00Z -> deadline_at 2026-05-02T00:00:00Z, driven START ->
        SUBMIT_EVIDENCE so remediation_status == AWAITING_VERIFICATION.
      - A DeviationRequest of kind RISK_ADJUSTMENT is routed to the AGENCY queue and sits in AGENCY_REVIEW; the item's risk_disposition
        == DEVIATION_REQUESTED.
