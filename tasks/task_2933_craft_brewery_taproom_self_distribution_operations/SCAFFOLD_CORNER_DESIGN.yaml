              payload: { action: "ACTIVATE" }
              as: StateRegulator
            - call: "POST /keg-assets"
              payload: { keg_serial: "KEG-0001", size_bbl: 0.5 }
              as: CellarOperator
              captures: { keg_id: $.data.id }
          trigger:
            - call: "POST /keg-assets/${keg_id}/clean"
              payload: { sanitizer_ppm: 200, contact_time_seconds: 59 }
              as: CellarOperator
              captures: { err: $.data.error_id }
            - call: "POST /keg-assets/${keg_id}/clean"
              payload: { sanitizer_ppm: 200, contact_time_seconds: 60 }
              as: CellarOperator
          assert:
            - "First call: HTTP status == 422 and error_id == ERR_SANITATION_BELOW_STANDARD"
            - "After the first call KegAsset.${keg_id}.state == EMPTY_DIRTY, cip_cycle_count == 0, last_cip_utc is null"
            - "Second call: HTTP status == 200"
            - "KegAsset.${keg_id}.state == CLEANED"
            - "KegAsset.${keg_id}.cip_cycle_count == 1"
            - "KegAsset.${keg_id}.last_cip_utc == 2026-08-01T00:00:00Z"

