      - name: plan_revision_loop_returns_an_approved_plan_to_draft
        claim_type: cyclic
        grounds:
          - state_machines.NutrientManagementPlan.REVISION_REQUIRED_to_DRAFT
          - complexity_profile.state_machine_shape
        excluded_because:
          difficulty_instance: plan_revision_cycle_returns_to_draft_and_recertifies
          rationale: "That §1.8 instance walks SUBMITTED -> REVISION_REQUIRED -> DRAFT -> CERTIFIED -> SUBMITTED -> APPROVED and pins revision_count, which is exactly the cyclic-shape claim."
      - name: void_reverses_every_forward_side_effect_of_an_application
        claim_type: compensation
        grounds:
          - state_machines.LandApplicationEvent.RECORDED_to_VOIDED
        excluded_because:
          difficulty_instance: void_application_restores_budget_and_storage_ledgers
          rationale: "The three-ancestor compensation (budget ledger, storage ledger, Field.last_application_on) is asserted literal-by-literal there."
      - name: freeboard_alert_cascade_only_touches_approved_plans
        claim_type: conditional_cascade
        grounds:
          - state_machines.ManureStorage.IN_SERVICE_to_FREEBOARD_ALERT
          - state_machines.NutrientManagementPlan.APPROVED_to_REVISION_REQUIRED
        excluded_because:
          difficulty_instance: freeboard_alert_cascades_to_plan_revision_and_budget_lock
          rationale: "That §1.8 instance drives the four-hop conditional cascade and asserts the budget ledger is frozen rather than rewritten."

  # =====================================================================
  # Calculations (§1.3)
  # =====================================================================
  - section: calculations
    instances:
      - name: field_setback_thresholds_pick_tile_inlet_water_and_slope_terms
        claim_type: threshold
        grounds:
          - calculations.field_setback_and_net_acres
          - entities.Field.fields.required_setback_ft
          - entities.Field.fields.net_applicable_acres
        distinguishing_aspect: |
          Four fields probe every branch and both boundaries at once: a tile inlet wins over
          proximity (300 ft), distance_to_water_ft exactly 200 still counts as near water,
          slope exactly 6 adds nothing while 6.1 adds 100 ft, and zero frontage excludes no acres.
        test_recipe:
          setup:
            - "One Willow Creek Dairy operation"
          setup_api_calls:
            - call: "POST /cafo/operations"
              payload: { name: "Willow Creek Dairy", county: "Linn", animal_type: "DAIRY_COW", head_count: 300, manure_handling: "LIQUID", open_lot_area_sqft: 40000, discharge_potential: "CONTINUOUS", has_conservation_plan: true }
              as: ComplianceAdmin
              as_user_id: "admin-1"
              captures: { op_id: $.data.id }
          trigger:
            - call: "POST /cafo/fields"
              payload: { operation_id: "${op_id}", field_name: "Tile A", total_acres: 30.0, distance_to_water_ft: 900, has_tile_inlet: true, slope_pct: 3.0, water_frontage_ft: 1000 }
              as: CertifiedPlanner
              as_user_id: "planner-1"
              captures: { fld_a_id: $.data.id }
            - call: "POST /cafo/fields"
              payload: { operation_id: "${op_id}", field_name: "Edge B", total_acres: 40.0, distance_to_water_ft: 200, has_tile_inlet: false, slope_pct: 6.0, water_frontage_ft: 500 }
              as: CertifiedPlanner
              as_user_id: "planner-1"
              captures: { fld_b_id: $.data.id }
            - call: "POST /cafo/fields"
              payload: { operation_id: "${op_id}", field_name: "Steep C", total_acres: 25.0, distance_to_water_ft: 201, has_tile_inlet: false, slope_pct: 6.1, water_frontage_ft: 300 }
              as: CertifiedPlanner
              as_user_id: "planner-1"
              captures: { fld_c_id: $.data.id }
            - call: "POST /cafo/fields"
              payload: { operation_id: "${op_id}", field_name: "Inland D", total_acres: 12.0, distance_to_water_ft: 500, has_tile_inlet: false, slope_pct: 2.0, water_frontage_ft: 0 }
              as: CertifiedPlanner
              as_user_id: "planner-1"
              captures: { fld_d_id: $.data.id }
          assert:
            - "Field.${fld_a_id}.required_setback_ft == 300, excluded_acres == 6.89 and net_applicable_acres == 23.11"
            - "Field.${fld_b_id}.required_setback_ft == 200, excluded_acres == 2.30 and net_applicable_acres == 37.70, because 200 ft is inside the inclusive near-water band and slope 6.0 adds nothing"
            - "Field.${fld_c_id}.required_setback_ft == 200, excluded_acres == 1.38 and net_applicable_acres == 23.62, composed as base 100 plus the strict-greater slope adder 100"
            - "Field.${fld_d_id}.required_setback_ft == 100, excluded_acres == 0.00 and net_applicable_acres == 12.00"
            - "Field.${fld_a_id}.last_application_on == null on all four rows"
      - name: p_index_rounds_to_two_decimals_before_the_category_compare
        claim_type: precision
        grounds:
          - calculations.soil_test_p_index
          - entities.SoilTest.fields.p_index
          - entities.SoilTest.fields.p_index_category
        distinguishing_aspect: |
          The category is decided AFTER round_half_up to 2 decimals, so 96.15 ppm on a 4 %
          slope yields 99.996 -> 100.00 and lands in VERY_HIGH while 96.10 ppm stays HIGH at
          99.94; the same rounding-first rule puts exactly 50.00 in HIGH.
        test_recipe:
          setup:
            - "One Willow Creek Dairy operation with field North 40 at slope_pct 4.0, giving the multiplier 1.04"
          setup_api_calls:
            - call: "POST /cafo/operations"
              payload: { name: "Willow Creek Dairy", county: "Linn", animal_type: "DAIRY_COW", head_count: 300, manure_handling: "LIQUID", open_lot_area_sqft: 40000, discharge_potential: "CONTINUOUS", has_conservation_plan: true }
              as: ComplianceAdmin
              as_user_id: "admin-1"
              captures: { op_id: $.data.id }
            - call: "POST /cafo/fields"
              payload: { operation_id: "${op_id}", field_name: "North 40", total_acres: 42.5, distance_to_water_ft: 150, has_tile_inlet: false, slope_pct: 4.0, water_frontage_ft: 900 }
              as: CertifiedPlanner
              as_user_id: "planner-1"
              captures: { fld_id: $.data.id }
          trigger:
            - call: "POST /cafo/soil-tests"
              payload: { field_id: "${fld_id}", sampled_on: "2026-03-15T00:00:00Z", lab_name: "AgriLab", soil_test_p_ppm: 96.15, soil_test_k_ppm: 160, organic_matter_pct: 3.4 }
              as: CertifiedPlanner
              as_user_id: "planner-1"
              captures: { s_vhigh_id: $.data.id }
            - call: "POST /cafo/soil-tests"
              payload: { field_id: "${fld_id}", sampled_on: "2026-03-15T00:00:00Z", lab_name: "AgriLab", soil_test_p_ppm: 96.10, soil_test_k_ppm: 160, organic_matter_pct: 3.4 }
              as: CertifiedPlanner
              as_user_id: "planner-1"
              captures: { s_high_edge_id: $.data.id }
            - call: "POST /cafo/soil-tests"
              payload: { field_id: "${fld_id}", sampled_on: "2026-03-15T00:00:00Z", lab_name: "AgriLab", soil_test_p_ppm: 48.08, soil_test_k_ppm: 160, organic_matter_pct: 3.4 }
              as: CertifiedPlanner
              as_user_id: "planner-1"
              captures: { s_high_id: $.data.id }
            - call: "POST /cafo/soil-tests"
              payload: { field_id: "${fld_id}", sampled_on: "2026-03-15T00:00:00Z", lab_name: "AgriLab", soil_test_p_ppm: 48.07, soil_test_k_ppm: 160, organic_matter_pct: 3.4 }
              as: CertifiedPlanner
              as_user_id: "planner-1"
              captures: { s_medium_id: $.data.id }
            - call: "POST /cafo/soil-tests"
              payload: { field_id: "${fld_id}", sampled_on: "2026-03-15T00:00:00Z", lab_name: "AgriLab", soil_test_p_ppm: 19.20, soil_test_k_ppm: 160, organic_matter_pct: 3.4 }
              as: CertifiedPlanner
              as_user_id: "planner-1"
              captures: { s_low_id: $.data.id }
          assert:
            - "SoilTest.${s_vhigh_id}.p_index == 100.00 and p_index_category == VERY_HIGH"
            - "SoilTest.${s_high_edge_id}.p_index == 99.94 and p_index_category == HIGH"
            - "SoilTest.${s_high_id}.p_index == 50.00 and p_index_category == HIGH, the inclusive lower bound"
            - "SoilTest.${s_medium_id}.p_index == 49.99 and p_index_category == MEDIUM"
            - "SoilTest.${s_low_id}.p_index == 19.97 and p_index_category == LOW"
            - "all five rows have is_valid == true, since the clock 2026-08-01 is inside four years of 2026-03-15"
      - name: budget_rates_floor_to_hundred_gallons_and_binding_basis_follows_method
        claim_type: tiered_pricing
        grounds:
          - calculations.budget_allowable_rate
          - entities.FieldNutrientBudget.fields.binding_basis
          - entities.FieldNutrientBudget.fields.allowable_total_gallons
        distinguishing_aspect: |
          Two budgets differ only in planned_application_method, and that alone flips the binding
          basis: INJECTION (availability 0.65) floors the nitrogen limit to 13300 and binds on
          NITROGEN, while SURFACE_BROADCAST (0.40) raises it to 21700 so the 14000 phosphorus
          limit binds instead — with both totals floored to a whole gallon.
        test_recipe:
          setup:
            - "One Willow Creek Dairy operation with a COVERED permit and a DRAFT 2026 plan"
            - "Field North 40 with net_applicable_acres 38.37 and a MEDIUM soil test sampled 2026-03-15"
            - "previous_crop NONE on both budgets, so no legume credit applies and adjusted_n_need_lbs is 209.00"
          setup_api_calls:
