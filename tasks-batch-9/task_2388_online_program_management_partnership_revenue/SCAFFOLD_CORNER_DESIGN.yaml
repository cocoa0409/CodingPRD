        distinguishing_aspect: "Peer partner tenancy is enforced by identity, not role: the Lakeshore account lead carries a legitimate PartnerAccountLead role and a well-formed payload, but its X-User-ID does not resolve to Riverbend's partnership through Program.partnership_id, so the course creation is refused with 403."
