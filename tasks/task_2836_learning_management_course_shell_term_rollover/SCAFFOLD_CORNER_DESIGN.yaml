              payload: { target_state: "FINALS" }
              as: Registrar
              captures: { term_state: $.data.lifecycle_state }
          trigger:
            - call: "DELETE /content-items/${i1}"
              payload: {}
              as: Instructor
              as_user_id: "${prof_id}"
              captures: { err_subs: $.data.error_id }
            - call: "DELETE /content-items/${i2}"
              payload: {}
              as: Instructor
              as_user_id: "${prof_id}"
            - call: "POST /grade-passbacks"
              payload: { shell_id: "${shell_id}" }
              as: Instructor
              as_user_id: "${prof_id}"
              captures: { pb: $.data.id, pb_state: $.data.passback_state, staged: $.data.staged_enrollment_count, variant: $.data.variant_applied }
            - call: "POST /grade-passbacks"
              payload: { shell_id: "${shell_id}" }
              as: Instructor
              as_user_id: "${prof_id}"
              captures: { err_dup: $.data.error_id }
            - call: "POST /grade-passbacks/${pb}/transitions"
              payload: { action: "SUBMIT" }
              as: Instructor
              as_user_id: "${prof_id}"
              captures: { err_nograde: $.data.error_id }
            - call: "POST /_grade-records"
              payload: { enrollment_id: "${enr_id}", content_item_id: "${i1}", earned_points: 80.00 }
              as: Instructor
              as_user_id: "${prof_id}"
              captures: { earned: $.data.earned_points_total, gpp: $.data.graded_points_possible, prov: $.data.provisional_grade_pct }
            - call: "POST /grade-passbacks/${pb}/transitions"
              payload: { action: "SUBMIT" }
              as: Instructor
              as_user_id: "${prof_id}"
              captures: { pb_state2: $.data.passback_state, submitted: $.data.submitted_points_total, variant2: $.data.variant_applied }
            - call: "GET /enrollments/${enr_id}"
              payload: {}
              as: Instructor
              as_user_id: "${prof_id}"
              captures: { final_pct: $.data.final_grade_pct }
          assert:
            - "${shell_state} == PUBLISHED, ${term_state} == FINALS, ${i1_has_subs} == true and ${i1_sub_count} == 1 — the preconditions of all three refusals are in place"
            - "${err_subs} == ERR_ITEM_HAS_SUBMISSIONS at HTTP 409 — the item survives the refused DELETE"
            - "the DELETE of ${i2} returns HTTP 204 — an item without submissions is still deletable, so the refusal above was about the submission, not about the term being in FINALS"
            - "${pb_state} == STAGED with ${staged} == 1 and ${variant} == PROVISIONAL"
            - "${err_dup} == ERR_DUPLICATE_PASSBACK at HTTP 409 — at most one GradePassback per shell_id, and GET /grade-passbacks filtered to the shell still reports total_count 1"
            - "${err_nograde} == ERR_NO_GRADES_STAGED at HTTP 422 — the single staged enrollment has graded_points_possible 0.00, so there is nothing to pass back"
            - "${earned} == 80.00, ${gpp} == 100.00 and ${prov} == 80.00"
            - "${pb_state2} == SUBMITTED with ${submitted} == 80.00, ${variant2} == FINAL and ${final_pct} == 80.00 — the identical SUBMIT succeeds once one grade record exists"

      - name: student_reads_and_owner_provisioning_respect_the_access_and_ferpa_gates
        claim_type: violation_to_error
        grounds:
          - errors[ERR_FERPA_BLOCK_ACTIVE]
          - errors[ERR_STUDENT_ACCESS_EXPIRED]
          - validations[13]
          - validations[14]
          - state_machines.CourseShell.provisioning_state.REQUESTED_to_PROVISIONED
        distinguishing_aspect: "Two 403s with different subjects: provisioning a shell whose OWNER has access_revoked_at set is ERR_FERPA_BLOCK_ACTIVE, while a STUDENT reading past the term's student_access_end_at is ERR_STUDENT_ACCESS_EXPIRED — and the staff read of the very same shell at the very same clock must still return 200, proving the second gate is role-scoped rather than a global lockout."
        test_recipe:
          setup:
            - "Term 2026FA has access_grace_days 0, so student_access_end_at is 2026-12-11T23:59:59Z."
            - "prof owns the PROVISIONED shell PY230-01 and student S1 holds an ACTIVE row in it; a second faculty person was registered with access_revoked_at 2026-07-01T00:00:00Z and owns a still-REQUESTED shell."
          setup_api_calls:
            - call: "POST /academic-terms"
              payload: { term_code: "2026FA", term_start_at: "2026-08-24T00:00:00Z", term_end_at: "2026-12-11T00:00:00Z", access_grace_days: 0 }
              as: Registrar
              captures: { term_id: $.data.id, access_end: $.data.student_access_end_at }
            - call: "POST /academic-terms/${term_id}/lifecycle-transitions"
              payload: { target_state: "REGISTRATION_OPEN" }
              as: Registrar
            - call: "POST /people"
              payload: { sis_person_id: "F-6220", full_name: "Rosalind Franklin", primary_affiliation: "FACULTY" }
              as: Registrar
              captures: { prof_id: $.data.id }
            - call: "POST /people"
              payload: { sis_person_id: "F-6221", full_name: "Departed Lecturer", primary_affiliation: "FACULTY", access_revoked_at: "2026-07-01T00:00:00Z" }
              as: Registrar
              captures: { revoked_id: $.data.id, revoked_at: $.data.access_revoked_at }
            - call: "POST /people"
              payload: { sis_person_id: "S-6222", full_name: "Learner G", primary_affiliation: "STUDENT" }
              as: Registrar
              captures: { s1: $.data.id }
            - call: "POST /course-shells"
              payload: { term_id: "${term_id}", owner_person_id: "${prof_id}", sis_section_code: "PY230-01", shell_type: "OFFICIAL", base_seat_cap: 18 }
              as: LmsAdmin
              captures: { shell_id: $.data.id }
            - call: "POST /course-shells/${shell_id}/provisioning-decisions"
              payload: { decision: "APPROVE" }
              as: LmsAdmin
            - call: "POST /enrollments"
              payload: { shell_id: "${shell_id}", person_id: "${s1}", role: "STUDENT" }
              as: Registrar
              captures: { enr_id: $.data.id }
            - call: "POST /course-shells"
              payload: { term_id: "${term_id}", owner_person_id: "${revoked_id}", sis_section_code: "PY230-02", shell_type: "OFFICIAL", base_seat_cap: 18 }
              as: LmsAdmin
              captures: { revoked_shell: $.data.id, revoked_shell_state: $.data.provisioning_state }
          trigger:
            - call: "POST /course-shells/${revoked_shell}/provisioning-decisions"
              payload: { decision: "APPROVE" }
              as: LmsAdmin
              captures: { err_ferpa: $.data.error_id }
            - call: "GET /course-shells/${shell_id}"
              payload: {}
              as: Student
              as_user_id: "${s1}"
              captures: { student_read_state: $.data.provisioning_state }
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-12-12T00:00:00Z" }
              as: LmsAdmin
            - call: "GET /course-shells/${shell_id}"
              payload: {}
              as: Student
              as_user_id: "${s1}"
              captures: { err_expired: $.data.error_id }
            - call: "GET /enrollments"
              payload: { person_id: "${s1}" }
              as: Student
              as_user_id: "${s1}"
              captures: { err_expired_list: $.data.error_id }
            - call: "GET /course-shells/${shell_id}"
              payload: {}
              as: LmsAdmin
              captures: { admin_read_state: $.data.provisioning_state }
            - call: "GET /enrollments/${enr_id}"
              payload: {}
              as: Registrar
              captures: { enr_state: $.data.enrollment_state }
          assert:
            - "${access_end} == \"2026-12-11T23:59:59Z\" and ${revoked_at} == \"2026-07-01T00:00:00Z\""
            - "${err_ferpa} == ERR_FERPA_BLOCK_ACTIVE at HTTP 403 and the shell stays ${revoked_shell_state} (REQUESTED) — a revoked owner cannot be provisioned into service"
            - "${student_read_state} == PROVISIONED — before the horizon the student read is a plain 200"
            - "${err_expired} == ERR_STUDENT_ACCESS_EXPIRED at HTTP 403 one day after student_access_end_at"
            - "${err_expired_list} == ERR_STUDENT_ACCESS_EXPIRED at HTTP 403 — the same gate covers GET /enrollments"
            - "${admin_read_state} == PROVISIONED and ${enr_state} == ACTIVE at the same clock — staff reads are never gated by student_access_end_at"

      - name: rollover_jobs_refuse_ineligible_sources_and_non_empty_targets
        claim_type: violation_to_error
        grounds:
          - errors[ERR_ROLLOVER_SOURCE_INELIGIBLE]
          - errors[ERR_ROLLOVER_TARGET_NOT_EMPTY]
          - validations[33]
          - validations[34]
          - state_machines.RolloverJob.job_state.DRAFT_to_VALIDATED
        distinguishing_aspect: "Both rules are enforced at CREATE time (not only at VALIDATE): a source shell still PROVISIONED gives 422 ERR_ROLLOVER_SOURCE_INELIGIBLE, and a target that already holds one content item gives 422 ERR_ROLLOVER_TARGET_NOT_EMPTY. Concluding the source and switching to the empty target must then let the identical create through and count both source items as eligible."
        test_recipe:
          setup:
            - "Term 2026FA (REGISTRATION_OPEN) holds source shell SRC with two content items; term 2027SP (REGISTRATION_OPEN) holds two PROVISIONED target shells — TGT_A empty and TGT_B carrying one item."
          setup_api_calls:
            - call: "POST /academic-terms"
              payload: { term_code: "2026FA", term_start_at: "2026-08-24T00:00:00Z", term_end_at: "2026-12-11T00:00:00Z" }
              as: Registrar
              captures: { t1: $.data.id }
            - call: "POST /academic-terms/${t1}/lifecycle-transitions"
              payload: { target_state: "REGISTRATION_OPEN" }
              as: Registrar
            - call: "POST /academic-terms"
              payload: { term_code: "2027SP", term_start_at: "2027-01-11T00:00:00Z", term_end_at: "2027-05-07T00:00:00Z" }
              as: Registrar
              captures: { t2: $.data.id }
            - call: "POST /academic-terms/${t2}/lifecycle-transitions"
              payload: { target_state: "REGISTRATION_OPEN" }
              as: Registrar
            - call: "POST /people"
              payload: { sis_person_id: "F-6230", full_name: "Chien-Shiung Wu", primary_affiliation: "FACULTY" }
              as: Registrar
              captures: { prof_id: $.data.id }
            - call: "POST /course-shells"
              payload: { term_id: "${t1}", owner_person_id: "${prof_id}", sis_section_code: "PS410-01", shell_type: "OFFICIAL", base_seat_cap: 30 }
              as: LmsAdmin
              captures: { src: $.data.id }
            - call: "POST /course-shells/${src}/provisioning-decisions"
              payload: { decision: "APPROVE" }
              as: LmsAdmin
              captures: { src_state: $.data.provisioning_state }
            - call: "POST /content-items"
              payload: { shell_id: "${src}", item_type: "ASSIGNMENT", title: "Lab 1", due_at: "2026-09-10T23:59:00Z", points_possible: 40.00, storage_mb: 3.00 }
              as: Instructor
              as_user_id: "${prof_id}"
              captures: { src_i1: $.data.id }
            - call: "POST /content-items"
              payload: { shell_id: "${src}", item_type: "PAGE", title: "Course policy", storage_mb: 1.00 }
              as: Instructor
              as_user_id: "${prof_id}"
              captures: { src_i2: $.data.id }
            - call: "POST /course-shells"
              payload: { term_id: "${t2}", owner_person_id: "${prof_id}", sis_section_code: "PS410-01", shell_type: "OFFICIAL", base_seat_cap: 30 }
              as: LmsAdmin
              captures: { tgt_a: $.data.id }
            - call: "POST /course-shells/${tgt_a}/provisioning-decisions"
              payload: { decision: "APPROVE" }
              as: LmsAdmin
              captures: { tgt_a_v: $.data.version }
            - call: "POST /course-shells"
              payload: { term_id: "${t2}", owner_person_id: "${prof_id}", sis_section_code: "PS410-02", shell_type: "OFFICIAL", base_seat_cap: 30 }
              as: LmsAdmin
              captures: { tgt_b: $.data.id }
            - call: "POST /course-shells/${tgt_b}/provisioning-decisions"
