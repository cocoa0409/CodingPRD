            - "${pi_minor_st} == CLOSED, then ${e_tax} == ERR_TAX_CREDIT_NOT_QUALIFIED (422) — the last rung, with tax_credit_status still UNDETERMINED"
            - "${pct} == 100.00 and ${tcs} == QUALIFIED after the compliance run"
            - "${ms5} == FA_CLAIMED and ${ms6} == FINAL_ACCEPTED with ${fpay} == 500000 (retainage 500000 + holdback 0)"
            - "the money identity holds: 9050000 + 500000 == 10000000 - 450000 == 9550000"

  - section: rbac
    instances:
      - name: every_role_can_perform_its_own_exclusive_write
        claim_type: exclusive_operations
        grounds:
          - roles
          - endpoints[POST /solar/projects]
          - endpoints[POST /solar/projects/{project_id}/grading-areas]
          - endpoints[POST /solar/grading-areas/{grading_area_id}/acceptance]
          - endpoints[POST /solar/projects/{project_id}/yard-zones]
          - endpoints[POST /solar/blocks/{block_id}/piles]
          - endpoints[POST /solar/projects/{project_id}/substations]
          - endpoints[POST /solar/commissioning-tests]
          - endpoints[POST /solar/projects/{project_id}/payroll-weeks]
        distinguishing_aspect: "All eight declared roles are exercised on the write that only they may perform, in one chain: the eight roles are genuine peers under segregation_of_duties, so no role is a superset of another and every one of the eight calls must succeed under its own header and no other."
        test_recipe:
          setup:
            - "Empty domain; each call below is issued by the single role that §1.5 grants it"
          setup_api_calls: []
          trigger:
            - call: "POST /solar/projects"
              payload: { name: "Peer Ridge", utility_name: "Basin Power", ac_capacity_kw: 100, dc_capacity_kw: 130, contract_value_cents: 10000000, retainage_pct: 0.05, ld_per_day_cents: 50000, ld_cap_pct: 0.05, sc_deadline_date: "2026-08-01", guaranteed_capacity_kw_ac: 100, guaranteed_performance_ratio: 0.69 }
              as: EpcProjectManager
              captures: { proj: $.data.id, ms: $.data.milestone_state }
            - call: "POST /solar/projects/${proj}/grading-areas"
