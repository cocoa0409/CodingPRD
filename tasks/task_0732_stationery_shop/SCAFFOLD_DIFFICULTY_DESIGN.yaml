              payload: { paper_stock_id: "${p17_id}", finish_option_id: "${f17_id}", quantity: 150, expected_order_version: "${o17_v0}" }
              as: Customer
            - call: "POST /orders/${o17_id}/confirm"
              payload: {}
              as: Customer
              as_user_id: "${c17_id}"
          trigger:
            - call: "POST /_payments/simulate"
              payload: { order_id: "${o17_id}", amount_cents: 41250, outcome: "SUCCEEDED" }
              as: ShopAdmin
            - call: "POST /orders/${o17_id}/cancel"
              payload: {}
              as: Customer
              as_user_id: "${c17_id}"
            - call: "GET /customers/${c17_id}"
              payload: {}
              as: ShopAdmin
              captures: { c17_credit: "$.data.credit_balance_cents", c17_cum: "$.data.cumulative_deposits_paid_cents" }
            - call: "GET /orders/${o17_id}"
              payload: {}
              as: ShopAdmin
              captures: { o17_dp: "$.data.deposit_paid_cents" }
          assert:
            - "Customer.${c17_id}.credit_balance_cents == 41250"
            - "Customer.${c17_id}.cumulative_deposits_paid_cents == 41250"
            - "Order.${o17_id}.deposit_paid_cents == 0"
            - "cust_ledger = 41250 + 0 (cancelled orders excluded) == cumulative_deposits_paid_cents (41250) — invariant HOLDS"

      - name: paper_reserved_units_conservation_confirm_then_deliver
        grounds:
          - calculations.paper_reserved_conservation_invariant
          - entities.PaperStock.fields.reserved_units
          - state_machines.Order
          - state_machines.Shipment.DISPATCHED_to_DELIVERED
        distinguishing_aspect: |
          Conserved quantity #2 = PHYSICAL INVENTORY (integer units) — DIFFERENT type from #1's cents.
          Forward action = Order.confirm (reserves 150 units on PaperStock P18). Compensating
          action = the full pipeline through Shipment.DISPATCHED → DELIVERED (releases those 150
          units). Named invariant:
            PaperStock.reserved_units == Σ LineItem.quantity for lines where paper_stock_id = P18
                                          AND Order.status ∈ {DEPOSIT_PENDING, IN_PRODUCTION, READY_TO_SHIP}
          MUST equal 0 after delivery (since DELIVERED is excluded from the reserving set).
        test_recipe:
          setup:
            - "Empty-DB. Customer C18, catalog with P18 (base=500, lead=7), pkg wedding. Order O18 will be run end-to-end."
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-04-01T00:00:00Z" }
              as: ShopAdmin
            - call: "POST /customers"
              payload: { email: "c18@x.com", full_name: "C Eighteen", phone: "555" }
              as: ShopAdmin
              captures: { c18_id: "$.data.id" }
            - call: "POST /paper-stocks"
              payload: { name: "P18", base_price_cents: 500, lead_days: 7 }
              as: ShopAdmin
              captures: { p18_id: "$.data.id" }
            - call: "POST /finish-options"
              payload: { name: "F18", surcharge_cents: 100, additional_lead_days: 5 }
              as: ShopAdmin
              captures: { f18_id: "$.data.id" }
            - call: "POST /event-packages"
              payload: { name: "Wedding Std", package_type: "WEDDING", deposit_pct: 0.5, min_qty: 50, proof_expiry_days: 14 }
              as: ShopAdmin
              captures: { pkg18_id: "$.data.id" }
            - call: "POST /designers"
              payload: { full_name: "D18", active: true }
              as: ShopAdmin
              captures: { des18_id: "$.data.id" }
            - call: "POST /designs"
              payload: { customer_id: "${c18_id}", event_package_id: "${pkg18_id}", paper_stock_id: "${p18_id}", finish_option_id: "${f18_id}" }
              as: Customer
              captures: { d18_id: "$.data.id" }
            - call: "POST /orders"
              payload: { customer_id: "${c18_id}", design_id: "${d18_id}" }
              as: Customer
              captures: { o18_id: "$.data.id", o18_v0: "$.data.version" }
            - call: "POST /orders/${o18_id}/line-items"
              payload: { paper_stock_id: "${p18_id}", finish_option_id: "${f18_id}", quantity: 150, expected_order_version: "${o18_v0}" }
              as: Customer
          trigger:
            - call: "POST /orders/${o18_id}/confirm"
              payload: {}
              as: Customer
              as_user_id: "${c18_id}"
            - call: "GET /paper-stocks/${p18_id}"
              payload: {}
              as: ShopAdmin
              captures: { rsv_after_confirm: "$.data.reserved_units" }
            - call: "POST /_payments/simulate"
              payload: { order_id: "${o18_id}", amount_cents: 41250, outcome: "SUCCEEDED" }
              as: ShopAdmin
            - call: "POST /designs/${d18_id}/proofs"
              payload: { designer_id: "${des18_id}" }
              as: Designer
              captures: { pr18_id: "$.data.id" }
            - call: "POST /proofs/${pr18_id}/submit"
              payload: {}
              as: Designer
            - call: "POST /proofs/${pr18_id}/approve"
              payload: {}
              as: Customer
              as_user_id: "${c18_id}"
            - call: "GET /orders/${o18_id}/work-orders"
              payload: {}
              as: ShopAdmin
              captures: { wo18_id: "$.data[0].id" }
            - call: "POST /work-orders/${wo18_id}/production"
              payload: { new_status: "PRINTING", press_id: "PRESS_F", press_slot_start: "2026-04-05T09:00:00Z", press_slot_end: "2026-04-05T13:00:00Z" }
              as: ShopAdmin
            - call: "POST /work-orders/${wo18_id}/production"
              payload: { new_status: "FINISHING" }
              as: ShopAdmin
            - call: "POST /work-orders/${wo18_id}/production"
              payload: { new_status: "COMPLETED" }
              as: ShopAdmin
            - call: "GET /orders/${o18_id}/shipments"
              payload: {}
              as: ShopAdmin
              captures: { sh18_id: "$.data[0].id" }
            - call: "POST /shipments/${sh18_id}/dispatch"
              payload: {}
              as: ShopAdmin
            - call: "POST /shipments/${sh18_id}/mark-delivered"
              payload: {}
              as: ShopAdmin
            - call: "GET /paper-stocks/${p18_id}"
              payload: {}
              as: ShopAdmin
              captures: { rsv_after_deliver: "$.data.reserved_units" }
          assert:
            - "PaperStock.${p18_id}.reserved_units after confirm == 150"
            - "PaperStock.${p18_id}.reserved_units after delivery == 0"
            - "Invariant holds: sum of LineItem.quantity in eligible statuses matches reserved_units at every observation"
