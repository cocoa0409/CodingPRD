            - "after the void, GET /dental/subscribers/${sub_id}/accumulators shows annual_max_used_cents == 0 (the paid line's 4000 was reversed)"

  # ===========================================================================
  - rule_id: transitive_cascade
    instances:

      - name: fee_schedule_activation_truncation_recompute_version_bump
        grounds:
          - state_machines.FeeSchedule.PENDING_to_ACTIVE
          - entities.Predetermination.fields.estimated_allowed_cents
          - entities.FeeSchedule.fields.effective_to
        distinguishing_aspect: |
          Depth-3 chain originating at FeeSchedule activation: (1) activating
          v2 truncates v1.effective_to (mutation on v1); (2) that truncation
          triggers recompute of UNDER_REVIEW predeterminations on the same tier
          (mutation on Predetermination.estimated_*); (3) the recompute bumps
          Predetermination.version (mutation derived from link 2). Each link
          is caused by the previous link, not by the original POST.
        test_recipe:
          setup:
            - "Logical clock at 2026-01-01T00:00:00Z."
            - "Plan (deductible 0, major 50, max 150000, no waiting, ABP off); PPO provider; schedule v1 PPO effective 2026-01-01 with D2740 100000 ACTIVE; subscriber effective 2026-01-01."
            - "Predetermination D2740 submitted 110000 planned 2026-06-01 assigned to rev-1 (UNDER_REVIEW; estimate 100000/50000 vs v1)."
          setup_api_calls:
            - call: "POST /dental/_clock/set_current_utc"
              payload: { to_iso8601: "2026-01-01T00:00:00Z" }
              as: PlanAdmin
            - call: "POST /dental/plans"
              payload: { plan_code: "DD-TC1", plan_year_start_month: 1, annual_maximum_cents: 150000, deductible_cents: 0, deductible_applies_preventive: false, preventive_coinsurance_pct: 100, basic_coinsurance_pct: 80, major_coinsurance_pct: 50, basic_waiting_months: 0, major_waiting_months: 0, missing_tooth_clause_active: false, abp_enabled: false }
              as: PlanAdmin
              captures: { plan_id: $.data.id }
            - call: "POST /dental/plans/${plan_id}/activate"
              payload: {}
              as: PlanAdmin
            - call: "POST /dental/providers"
              payload: { npi: "1234567896", legal_name: "Smile Dental 7", tier: "PPO", license_state: "CA", contracted_on: "2025-01-01T00:00:00Z" }
              as: NetworkManager
              captures: { provider_id: $.data.id }
            - call: "POST /dental/fee-schedules"
              payload: { tier: "PPO", effective_from: "2026-01-01T00:00:00Z", entries: [{ cdt_code: "D2740", allowed_cents: 100000, category: "MAJOR", requires_attachment: false, abp_alternative_cdt: "" }] }
              as: NetworkManager
              captures: { fees_v1: $.data.id }
            - call: "POST /dental/fee-schedules/${fees_v1}/activate"
              payload: {}
              as: NetworkManager
            - call: "POST /dental/subscribers"
              payload: { plan_id: "${plan_id}", member_id: "M-TC1", full_name: "Gail Prime", date_of_birth: "1982-02-02T00:00:00Z", effective_date: "2026-01-01T00:00:00Z", cob_priority: "PRIMARY" }
              as: PlanAdmin
              captures: { sub_id: $.data.id }
            - call: "POST /dental/predeterminations"
              payload: { subscriber_id: "${sub_id}", provider_id: "${provider_id}", cdt_code: "D2740", submitted_amount_cents: 110000, planned_service_date: "2026-06-01T00:00:00Z" }
              as: Provider
              as_user_id: "${provider_id}"
              captures: { predet_id: $.data.id }
            - call: "POST /dental/predeterminations/${predet_id}/assign"
              payload: { clinical_reviewer_id: "rev-1" }
              as: ClinicalReviewer
              as_user_id: "rev-1"
              captures: { predet_v_pre: $.data.version, est_allowed_pre: $.data.estimated_allowed_cents }
            - call: "POST /dental/fee-schedules"
              payload: { tier: "PPO", effective_from: "2026-05-01T00:00:00Z", entries: [{ cdt_code: "D2740", allowed_cents: 80000, category: "MAJOR", requires_attachment: false, abp_alternative_cdt: "" }] }
              as: NetworkManager
              captures: { fees_v2: $.data.id }
          trigger:
            - call: "POST /dental/fee-schedules/${fees_v2}/activate"
              payload: {}
              as: NetworkManager
            - call: "GET /dental/fee-schedules/${fees_v1}"
              payload: {}
              as: NetworkManager
              captures: { v1_to: $.data.effective_to }
            - call: "GET /dental/predeterminations/${predet_id}"
              payload: {}
              as: ClinicalReviewer
              as_user_id: "rev-1"
              captures: { est_allowed_post: $.data.estimated_allowed_cents, est_plan_post: $.data.estimated_plan_pay_cents, predet_v_post: $.data.version }
          assert:
            - "link 1: FeeSchedule v1.effective_to == \"2026-05-01T00:00:00Z\" (window truncated) and v1.status remains ACTIVE"
            - "link 2: Predetermination.estimated_allowed_cents recomputes 100000 -> 80000 and estimated_plan_pay_cents 50000 -> 40000 (planned date 2026-06-01 now governed by v2)"
            - "link 3: Predetermination.version == ${predet_v_pre} + 1 (recompute bumped the version without any direct predetermination call)"
            - "FeeSchedule v2.status == ACTIVE"

      - name: claim_void_reverses_accumulator_and_bumps_its_version
        grounds:
