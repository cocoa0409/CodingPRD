        claim_type: correct_result
        grounds:
          - calculations.tomatometer_score
          - validations[priority=19]
        distinguishing_aspect: "A release with zero counted reviews reports tomatometer_pct null (never 0), and a manual score-recalculation is rejected 409 ERR_SCORE_NOT_COMPUTABLE rather than persisting a zero snapshot."
        test_recipe:
          setup:
            - "Clock 2026-09-01T00:00:00Z; Title OPEN; R1 OPEN with no reviews."
          setup_api_calls:
            - *c_clock
            - *c_title
            - call: "PATCH /titles/${t1}"
              payload: { posture: "OPEN" }
              as: PlatformAdmin
            - *c_rel
            - call: "POST /releases/${r1}/transition"
              payload: { action: "OPEN" }
              as: PlatformAdmin
            - &c_rv
              call: "GET /releases/${r1}"
              as: PlatformAdmin
              captures: { r_v: $.data.version }
          trigger:
            - call: "POST /releases/${r1}/score-recalculation"
              payload: { expected_release_version: "${r_v}" }
              as: PlatformAdmin
              captures: { err: $.data.error_id }
            - call: "GET /releases/${r1}"
              as: PlatformAdmin
          assert:
            - "the recalculation response status is 409 with error_id == ERR_SCORE_NOT_COMPUTABLE"
            - "Release.${r1}.tomatometer_pct is null, not 0"

