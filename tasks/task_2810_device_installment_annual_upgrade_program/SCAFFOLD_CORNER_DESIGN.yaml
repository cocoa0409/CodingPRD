            - "the installments read returns total_count == 24 with limit == 100, offset == 0, has_more == false"
            - "the 24 amount_due_cents values sum to 113876 and the 24 principal_component_cents values sum to 89900 and the 24 premium_component_cents values sum to 23976"
            - "installment 1 has amount_due_cents == 4745 and installment 24 has amount_due_cents == 4741"
            - "GET /loans?customer_id=${cust}&status=ACTIVE returns total_count == 1 with id == ${loan}"
            - "GET /loans?customer_id=${cust}&delinquency_state=DELINQUENT returns total_count == 0"

