# =============================================================================
# §1.8 Scaffold Difficulty Design (Test Targeting Index)
# Task: task_3366_donated_goods_processing_production_standards_mission_funding
# 9 rules x 2 instances = 18 instances. All fixture numbers pre-computed.
# Standard fixture unless overridden: target 60 iph, hourly_cost 1800,
# grade_price_map {A:1000,B:700,C:400}, floor 100, ceiling 5000.
# =============================================================================
scaffold_difficulty_design:

  # ===========================================================================
  - rule_id: dual_variant_calc
    instances:

      - name: production_rate_gross_vs_net_diverge
        grounds:
          - calculations.production_rate_dual
          - state_machines.ProcessingRun.OPEN_to_CLOSED
          - entities.ProcessingRun.fields.gross_rate_iph
          - entities.ProcessingRun.fields.net_rate_iph
        distinguishing_aspect: |
          ProcessingRun domain: GROSS counts every processed item while NET excludes
          unsalable_count, so one closing payload yields gross_rate_iph 65.0 and
          net_rate_iph 60.0 — and only NET drives variance_bps and performance_flag.
        test_recipe:
          setup:
            - "Clock at default 2026-09-01T00:00:00Z. Org with STANDARD costing; TEXTILES standard (target 60, hourly 1800, map A1000/B700/C400, floor 100, ceiling 5000). One site. Two runs opened against the standard."
          setup_api_calls:
            - call: "POST /donated-goods/member-orgs"
              payload: { name: "Org Dual Rate", costing_method: "STANDARD", reserve_floor_cents: 0, diversion_floor_bps: 7500 }
              as: PlatformAdmin
              captures: { org_id: $.data.id, org_v: $.data.version }
            - call: "POST /donated-goods/donation-sites"
              payload: { member_org_id: "${org_id}", name: "Site R", site_type: "ADC" }
              as: MemberAdmin
              as_user_id: "${org_id}"
              captures: { site_id: $.data.id }
            - call: "POST /donated-goods/production-standards"
              payload: { member_org_id: "${org_id}", category: "TEXTILES", target_items_per_hour: 60, hourly_cost_cents: 1800, grade_price_map: { A: 1000, B: 700, C: 400 }, price_floor_cents: 100, price_ceiling_cents: 5000, expected_member_org_version: "${org_v}" }
              as: MemberAdmin
              as_user_id: "${org_id}"
              captures: { std_id: $.data.id }
            - call: "POST /donated-goods/processing-runs"
              payload: { site_id: "${site_id}", production_standard_id: "${std_id}" }
              as: ProductionLead
              captures: { run1_id: $.data.id }
            - call: "POST /donated-goods/processing-runs"
              payload: { site_id: "${site_id}", production_standard_id: "${std_id}" }
              as: ProductionLead
              captures: { run2_id: $.data.id }
          trigger:
            - call: "POST /donated-goods/processing-runs/${run1_id}/close"
              payload: { item_count_processed: 130, unsalable_count: 10, labor_minutes: 120, labor_cost_cents: 3600 }
              as: ProductionLead
            - call: "POST /donated-goods/processing-runs/${run2_id}/close"
              payload: { item_count_processed: 118, unsalable_count: 8, labor_minutes: 120, labor_cost_cents: 3600 }
              as: ProductionLead
          assert:
            - "ProcessingRun.${run1_id}.gross_rate_iph == 65.0 and net_rate_iph == 60.0 (same payload, two valid rates)"
            - "ProcessingRun.${run1_id}.variance_bps == 0 and performance_flag == MET (net exactly at target is MET, inclusive)"
            - "ProcessingRun.${run2_id}.gross_rate_iph == 59.0 and net_rate_iph == 55.0"
            - "ProcessingRun.${run2_id}.variance_bps == -833 and performance_flag == MISSED"

      - name: unit_cost_standard_vs_actual_diverge
        grounds:
          - calculations.unit_costing
          - calculations.margin_accrual
          - entities.DonatedItem.fields.unit_cost_cents
          - entities.MemberOrg.fields.retail_margin_pool_cents
        distinguishing_aspect: |
          MemberOrg margin domain (distinct from instance 1's ProcessingRun domain):
          identical standards and items, but costing_method STANDARD locks
          unit_cost_cents 30 while ACTUAL derives 31 from closed-run economics, so the
          same 1000-cent sale accrues 970 vs 969 margin to two different pools.
        test_recipe:
          setup:
            - "Clock default. Org S (STANDARD) and Org A (ACTUAL), each with a site and an identical TEXTILES standard (target 60, hourly 1800). Org A additionally has two CLOSED TEXTILES runs: (200 items, 600 min, 6500c) and (100 items, 300 min, 2700c) -> ACTUAL avg = round_half_up(9200/300) = 31. Each org has one SORTED grade-A item priced and sold."
          setup_api_calls:
            - call: "POST /donated-goods/member-orgs"
              payload: { name: "Org S", costing_method: "STANDARD", reserve_floor_cents: 0, diversion_floor_bps: 7500 }
              as: PlatformAdmin
              captures: { orgs_id: $.data.id, orgs_v: $.data.version }
            - call: "POST /donated-goods/member-orgs"
              payload: { name: "Org A", costing_method: "ACTUAL", reserve_floor_cents: 0, diversion_floor_bps: 7500 }
              as: PlatformAdmin
              captures: { orga_id: $.data.id, orga_v: $.data.version }
            - call: "POST /donated-goods/donation-sites"
              payload: { member_org_id: "${orgs_id}", name: "Site S", site_type: "ADC" }
              as: MemberAdmin
              as_user_id: "${orgs_id}"
              captures: { sites_id: $.data.id }
            - call: "POST /donated-goods/donation-sites"
              payload: { member_org_id: "${orga_id}", name: "Site A", site_type: "ADC" }
              as: MemberAdmin
              as_user_id: "${orga_id}"
              captures: { sitea_id: $.data.id }
            - call: "POST /donated-goods/production-standards"
              payload: { member_org_id: "${orgs_id}", category: "TEXTILES", target_items_per_hour: 60, hourly_cost_cents: 1800, grade_price_map: { A: 1000, B: 700, C: 400 }, price_floor_cents: 100, price_ceiling_cents: 5000, expected_member_org_version: "${orgs_v}" }
              as: MemberAdmin
              as_user_id: "${orgs_id}"
              captures: { stds_id: $.data.id }
            - call: "POST /donated-goods/production-standards"
              payload: { member_org_id: "${orga_id}", category: "TEXTILES", target_items_per_hour: 60, hourly_cost_cents: 1800, grade_price_map: { A: 1000, B: 700, C: 400 }, price_floor_cents: 100, price_ceiling_cents: 5000, expected_member_org_version: "${orga_v}" }
              as: MemberAdmin
              as_user_id: "${orga_id}"
              captures: { stda_id: $.data.id }
            - call: "POST /donated-goods/processing-runs"
              payload: { site_id: "${sitea_id}", production_standard_id: "${stda_id}" }
              as: ProductionLead
              captures: { runa1_id: $.data.id }
            - call: "POST /donated-goods/processing-runs/${runa1_id}/close"
              payload: { item_count_processed: 200, unsalable_count: 0, labor_minutes: 600, labor_cost_cents: 6500 }
              as: ProductionLead
            - call: "POST /donated-goods/processing-runs"
              payload: { site_id: "${sitea_id}", production_standard_id: "${stda_id}" }
              as: ProductionLead
              captures: { runa2_id: $.data.id }
            - call: "POST /donated-goods/processing-runs/${runa2_id}/close"
              payload: { item_count_processed: 100, unsalable_count: 0, labor_minutes: 300, labor_cost_cents: 2700 }
              as: ProductionLead
            - call: "POST /donated-goods/donations"
              payload: { site_id: "${sites_id}", donor_name: "Donor S", item_count_declared: 1 }
              as: DonationAttendant
              as_user_id: "${sites_id}"
              captures: { dons_id: $.data.id }
            - call: "POST /donated-goods/donations/${dons_id}/sort"
              payload: { items: [{ category: "TEXTILES", condition_grade: "A", estimated_value_cents: 100, weight_lbs: 10 }] }
              as: DonationAttendant
              as_user_id: "${sites_id}"
            - call: "GET /donated-goods/donated-items"
              payload: { donation_id: "${dons_id}" }
              as: StoreAssociate
              captures: { items_id: $.data.0.id }
            - call: "POST /donated-goods/donated-items/${items_id}/price"
              payload: {}
              as: StoreAssociate
            - call: "POST /donated-goods/donations"
              payload: { site_id: "${sitea_id}", donor_name: "Donor A", item_count_declared: 1 }
              as: DonationAttendant
              as_user_id: "${sitea_id}"
              captures: { dona_id: $.data.id }
            - call: "POST /donated-goods/donations/${dona_id}/sort"
              payload: { items: [{ category: "TEXTILES", condition_grade: "A", estimated_value_cents: 100, weight_lbs: 10 }] }
              as: DonationAttendant
              as_user_id: "${sitea_id}"
            - call: "GET /donated-goods/donated-items"
              payload: { donation_id: "${dona_id}" }
              as: StoreAssociate
              captures: { itema_id: $.data.0.id }
            - call: "POST /donated-goods/donated-items/${itema_id}/price"
              payload: {}
              as: StoreAssociate
          trigger:
            - call: "POST /donated-goods/donated-items/${items_id}/sell"
              payload: {}
              as: StoreAssociate
            - call: "POST /donated-goods/donated-items/${itema_id}/sell"
              payload: {}
              as: StoreAssociate
          assert:
            - "DonatedItem.${items_id}.price_cents == 1000 and unit_cost_cents == 30 (STANDARD: 1800/60)"
            - "DonatedItem.${itema_id}.price_cents == 1000 and unit_cost_cents == 31 (ACTUAL: round_half_up(9200/300))"
            - "GET /donated-goods/member-orgs/${orgs_id} shows retail_margin_pool_cents == 970"
            - "GET /donated-goods/member-orgs/${orga_id} shows retail_margin_pool_cents == 969"

  # ===========================================================================
  - rule_id: combinatorial_formula
    instances:

      - name: outlet_sale_tiered_minmax_pricing
        grounds:
          - calculations.salvage_pricing
          - state_machines.SalvageLot.OPEN_to_SOLD
        distinguishing_aspect: |
          Mode (a) combinatorial: OUTLET_BIN revenue uses nested min/max over three
          inputs (total_weight_lbs, OUTLET_T1_LBS, two rates) — 150 lbs prices as
          100*45 + 50*30 = 6000 cents, not a flat 150*45 = 6750.
        test_recipe:
          setup:
            - "Clock default. Org, ADC site, donation declared 2; both items TEXTILES grade UNSALABLE weighing 75.0 lbs each (born SALVAGED). OUTLET_BIN lot containing both items."
          setup_api_calls:
            - call: "POST /donated-goods/member-orgs"
              payload: { name: "Org Outlet", costing_method: "STANDARD", reserve_floor_cents: 0, diversion_floor_bps: 7500 }
              as: PlatformAdmin
              captures: { org_id: $.data.id }
            - call: "POST /donated-goods/donation-sites"
              payload: { member_org_id: "${org_id}", name: "Site O", site_type: "ADC" }
              as: MemberAdmin
              as_user_id: "${org_id}"
              captures: { site_id: $.data.id }
            - call: "POST /donated-goods/donations"
              payload: { site_id: "${site_id}", donor_name: "Donor O", item_count_declared: 2 }
              as: DonationAttendant
              as_user_id: "${site_id}"
              captures: { don_id: $.data.id }
            - call: "POST /donated-goods/donations/${don_id}/sort"
              payload: { items: [{ category: "TEXTILES", condition_grade: "UNSALABLE", estimated_value_cents: 0, weight_lbs: 75.0 }, { category: "TEXTILES", condition_grade: "UNSALABLE", estimated_value_cents: 0, weight_lbs: 75.0 }] }
              as: DonationAttendant
              as_user_id: "${site_id}"
            - call: "GET /donated-goods/donated-items"
              payload: { donation_id: "${don_id}", status: "SALVAGED" }
              as: MemberAdmin
              as_user_id: "${org_id}"
              captures: { it1: $.data.0.id, it2: $.data.1.id }
            - call: "POST /donated-goods/salvage-lots"
              payload: { member_org_id: "${org_id}", channel: "OUTLET_BIN", item_ids: ["${it1}", "${it2}"] }
              as: MemberAdmin
              as_user_id: "${org_id}"
              captures: { lot_id: $.data.id }
          trigger:
            - call: "POST /donated-goods/salvage-lots/${lot_id}/sell"
              payload: {}
              as: MemberAdmin
              as_user_id: "${org_id}"
          assert:
            - "SalvageLot.${lot_id}.total_weight_lbs == 150.0 and status == SOLD"
            - "SalvageLot.${lot_id}.sale_revenue_cents == 6000 (tiered: 100*45 + 50*30)"
            - "GET /donated-goods/member-orgs/${org_id} shows total_diverted_lbs == 150.0 and retail_margin_pool_cents == 6000"

      - name: receipt_fmv_per_item_rounding_order
        grounds:
          - calculations.receipt_fmv_total
          - state_machines.Donation.RECEIVED_to_SORTED
        distinguishing_aspect: |
          Mode (b) nested rounding (distinct from instance 1's mode (a)): the receipt
          total rounds EACH item's value BEFORE summing — items [A@100, B@101, C@99,
          UNSALABLE@500] total 226 cents; the forbidden sum-then-round order yields 225.
        test_recipe:
          setup:
            - "Clock default. Org, ADC site, donation declared 4 with grades A/B/C/UNSALABLE."
          setup_api_calls:
            - call: "POST /donated-goods/member-orgs"
              payload: { name: "Org FMV", costing_method: "STANDARD", reserve_floor_cents: 0, diversion_floor_bps: 7500 }
              as: PlatformAdmin
              captures: { org_id: $.data.id }
            - call: "POST /donated-goods/donation-sites"
              payload: { member_org_id: "${org_id}", name: "Site F", site_type: "ADC" }
              as: MemberAdmin
              as_user_id: "${org_id}"
              captures: { site_id: $.data.id }
            - call: "POST /donated-goods/donations"
              payload: { site_id: "${site_id}", donor_name: "Donor F", item_count_declared: 4 }
              as: DonationAttendant
              as_user_id: "${site_id}"
              captures: { don_id: $.data.id }
          trigger:
            - call: "POST /donated-goods/donations/${don_id}/sort"
              payload: { items: [{ category: "TEXTILES", condition_grade: "A", estimated_value_cents: 100, weight_lbs: 1 }, { category: "HOUSEWARES", condition_grade: "B", estimated_value_cents: 101, weight_lbs: 1 }, { category: "MEDIA", condition_grade: "C", estimated_value_cents: 99, weight_lbs: 1 }, { category: "FURNITURE", condition_grade: "UNSALABLE", estimated_value_cents: 500, weight_lbs: 1 }] }
              as: DonationAttendant
              as_user_id: "${site_id}"
          assert:
            - "Donation.${don_id}.receipt_fmv_total_cents == 226 (100 + round_half_up(75.75)=76 + round_half_up(49.50)=50 + 0)"
            - "Donation.${don_id}.status == SORTED"
            - "Donation.${don_id}.receipt_issued == true and receipt_token is non-null (ADC auto-issues)"

  # ===========================================================================
  - rule_id: non_linear_state_machine
    instances:

      - name: member_org_suspend_reinstate_cycle
        grounds:
          - state_machines.MemberOrg.ACTIVE_to_SUSPENDED
          - state_machines.MemberOrg.SUSPENDED_to_ACTIVE
          - state_machines.FundingAllocation.PENDING_to_CANCELLED
        distinguishing_aspect: |
          MemberOrg's machine is a revert cycle (ACTIVE->SUSPENDED->ACTIVE) on the
          ORGANIZATION — distinct from instance 2's item-level self-loop — and the
          suspend hop cascades: PENDING funding allocations are force-CANCELLED.
        test_recipe:
          setup:
            - "Clock default. Org (reserve_floor 0) with a site, a program (window 2026-01-01..2026-12-31) and one PENDING allocation of 5000."
          setup_api_calls:
            - call: "POST /donated-goods/member-orgs"
              payload: { name: "Org Cycle", costing_method: "STANDARD", reserve_floor_cents: 0, diversion_floor_bps: 7500 }
              as: PlatformAdmin
              captures: { org_id: $.data.id, org_v: $.data.version }
            - call: "POST /donated-goods/donation-sites"
              payload: { member_org_id: "${org_id}", name: "Site C", site_type: "STORE_DROP" }
              as: MemberAdmin
              as_user_id: "${org_id}"
              captures: { site_id: $.data.id }
            - call: "POST /donated-goods/mission-programs"
              payload: { member_org_id: "${org_id}", name: "Jobs", program_type: "JOB_TRAINING", start_date: "2026-01-01T00:00:00Z", end_date: "2026-12-31T00:00:00Z", funding_goal_cents: 100000 }
              as: ProgramDirector
              as_user_id: "pd-1"
              captures: { prog_id: $.data.id }
            - call: "POST /donated-goods/funding-allocations"
              payload: { mission_program_id: "${prog_id}", amount_cents: 5000, expected_member_org_version: "${org_v}" }
              as: ProgramDirector
              as_user_id: "pd-1"
              captures: { alloc_id: $.data.id }
          trigger:
            - call: "POST /donated-goods/member-orgs/${org_id}/suspend"
              payload: {}
              as: BrandRegulator
            - call: "POST /donated-goods/donations"
              payload: { site_id: "${site_id}", donor_name: "Donor X", item_count_declared: 1 }
              as: DonationAttendant
              as_user_id: "${site_id}"
              captures: { suspended_err: $.data.error_id }
            - call: "POST /donated-goods/member-orgs/${org_id}/reinstate"
              payload: {}
              as: BrandRegulator
            - call: "POST /donated-goods/donations"
              payload: { site_id: "${site_id}", donor_name: "Donor Y", item_count_declared: 1 }
              as: DonationAttendant
              as_user_id: "${site_id}"
          assert:
            - "suspend leaves MemberOrg.${org_id}.brand_license_status == SUSPENDED"
            - "the donation attempt during suspension fails with ERR_ORG_SUSPENDED (${suspended_err})"
            - "FundingAllocation.${alloc_id}.status == CANCELLED (suspend cascade; read via GET /donated-goods/funding-allocations?mission_program_id=${prog_id})"
            - "reinstate returns brand_license_status == ACTIVE and the follow-up donation succeeds with 201"

      - name: donated_item_markdown_self_loop_and_rotation
        grounds:
          - state_machines.DonatedItem.ON_FLOOR_to_ON_FLOOR
          - state_machines.DonatedItem.ON_FLOOR_to_SALVAGED
          - calculations.markdown_pricing
        distinguishing_aspect: |
          DonatedItem's machine contains a self-loop (ON_FLOOR->ON_FLOOR via weekly
          markdown, price decaying 1000->750->500->250) before the rotation edge fires
          — a cyclic shape on the ITEM entity, distinct from instance 1's org cycle.
        test_recipe:
          setup:
            - "Clock moved to 2026-01-05T00:00:00Z (week 0). Org with standard; one grade-A item priced at week 0 (price 1000, color BLUE, floor_week 0)."
          setup_api_calls:
            - call: "POST /donated-goods/_clock/set_current_utc"
              payload: { to_iso8601: "2026-01-05T00:00:00Z" }
              as: PlatformAdmin
            - call: "POST /donated-goods/member-orgs"
              payload: { name: "Org MD", costing_method: "STANDARD", reserve_floor_cents: 0, diversion_floor_bps: 7500 }
              as: PlatformAdmin
              captures: { org_id: $.data.id, org_v: $.data.version }
            - call: "POST /donated-goods/donation-sites"
              payload: { member_org_id: "${org_id}", name: "Site M", site_type: "ADC" }
              as: MemberAdmin
              as_user_id: "${org_id}"
              captures: { site_id: $.data.id }
            - call: "POST /donated-goods/production-standards"
              payload: { member_org_id: "${org_id}", category: "TEXTILES", target_items_per_hour: 60, hourly_cost_cents: 1800, grade_price_map: { A: 1000, B: 700, C: 400 }, price_floor_cents: 100, price_ceiling_cents: 5000, expected_member_org_version: "${org_v}" }
              as: MemberAdmin
              as_user_id: "${org_id}"
            - call: "POST /donated-goods/donations"
              payload: { site_id: "${site_id}", donor_name: "Donor M", item_count_declared: 1 }
              as: DonationAttendant
              as_user_id: "${site_id}"
              captures: { don_id: $.data.id }
            - call: "POST /donated-goods/donations/${don_id}/sort"
              payload: { items: [{ category: "TEXTILES", condition_grade: "A", estimated_value_cents: 100, weight_lbs: 5 }] }
              as: DonationAttendant
              as_user_id: "${site_id}"
            - call: "GET /donated-goods/donated-items"
              payload: { donation_id: "${don_id}" }
              as: StoreAssociate
              captures: { it: $.data.0.id }
            - call: "POST /donated-goods/donated-items/${it}/price"
              payload: {}
              as: StoreAssociate
          trigger:
            - call: "POST /donated-goods/_clock/set_current_utc"
              payload: { to_iso8601: "2026-01-12T00:00:00Z" }
              as: PlatformAdmin
            - call: "POST /donated-goods/member-orgs/${org_id}/markdown-events"
              payload: {}
              as: MemberAdmin
              as_user_id: "${org_id}"
            - call: "POST /donated-goods/_clock/set_current_utc"
              payload: { to_iso8601: "2026-01-19T00:00:00Z" }
              as: PlatformAdmin
            - call: "POST /donated-goods/member-orgs/${org_id}/markdown-events"
              payload: {}
              as: MemberAdmin
              as_user_id: "${org_id}"
            - call: "POST /donated-goods/_clock/set_current_utc"
              payload: { to_iso8601: "2026-01-26T00:00:00Z" }
              as: PlatformAdmin
            - call: "POST /donated-goods/member-orgs/${org_id}/markdown-events"
              payload: {}
              as: MemberAdmin
              as_user_id: "${org_id}"
            - call: "POST /donated-goods/_clock/set_current_utc"
              payload: { to_iso8601: "2026-02-02T00:00:00Z" }
              as: PlatformAdmin
            - call: "POST /donated-goods/member-orgs/${org_id}/markdown-events"
              payload: {}
              as: MemberAdmin
              as_user_id: "${org_id}"
              captures: { w4: $.data.pulled_count }
          assert:
            - "after week-1 event: DonatedItem.${it} stays ON_FLOOR, markdown_step == 1, current_selling_price_cents == 750"
            - "after week-2 event: markdown_step == 2, current_selling_price_cents == 500"
            - "after week-3 event: markdown_step == 3, current_selling_price_cents == 250"
            - "week-4 event reports pulled_count == 1 and DonatedItem.${it}.status == SALVAGED with price frozen at 250"

  # ===========================================================================
  - rule_id: transitive_cascade
    instances:

      - name: disposal_ticket_diversion_breach_gate
        grounds:
          - calculations.disposal_cost
          - calculations.diversion_rate
          - entities.MemberOrg.fields.diversion_compliant
          - endpoints.POST_/donated-goods/disposal-tickets
          - errors.ERR_DIVERSION_BREACH
        distinguishing_aspect: |
          Depth-3 cascade triggered by a disposal ticket: ticket creation mutates
          total_disposed_lbs (link 1), that mutation forces diversion_rate_bps
          recomputation (link 2), and the rate dropping below the floor flips
          diversion_compliant to false (link 3), which gates the NEXT salvage-lot
          creation — each link caused by the previous one, not by the original call.
        test_recipe:
          setup:
            - "Clock default. Org (diversion_floor_bps 7500) with a SOLD TEXTILE_BALE lot of 300 lbs (diverted = 300) and one disposal ticket of 100 lbs already recorded: rate floor(3000000/400) = 7500, still compliant."
          setup_api_calls:
            - call: "POST /donated-goods/member-orgs"
              payload: { name: "Org Div", costing_method: "STANDARD", reserve_floor_cents: 0, diversion_floor_bps: 7500 }
              as: PlatformAdmin
              captures: { org_id: $.data.id }
            - call: "POST /donated-goods/donation-sites"
              payload: { member_org_id: "${org_id}", name: "Site D", site_type: "ADC" }
              as: MemberAdmin
              as_user_id: "${org_id}"
              captures: { site_id: $.data.id }
            - call: "POST /donated-goods/donations"
              payload: { site_id: "${site_id}", donor_name: "Donor D", item_count_declared: 1 }
              as: DonationAttendant
              as_user_id: "${site_id}"
              captures: { don_id: $.data.id }
