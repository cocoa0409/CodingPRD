# =============================================================================
# Table 6: Error Code Catalog
# =============================================================================
errors:
  - { id: ERR_UNAUTHENTICATED, http: 401, condition: "Missing or malformed X-User-Role / X-User-ID headers" }
  - { id: ERR_FORBIDDEN, http: 403, condition: "Role not permitted for this endpoint per RBAC" }
  - { id: ERR_NOT_FOUND, http: 404, condition: "Referenced entity does not exist" }
  - { id: ERR_INVALID_STATE, http: 409, condition: "Target entity not in valid state for requested transition" }
  - { id: ERR_STALE_VERSION, http: 412, condition: "OCC expected_<parent>_version does not match current version" }
  - { id: ERR_KYC_REJECTED, http: 422, condition: "Investor.kyc_status == REJECTED blocks new subscription submission" }
  - { id: ERR_SANCTIONS_HIT, http: 422, condition: "KycCase.sanctions_hit == true blocks approval" }
  - { id: ERR_INCOMPLETE_DOCUMENTS, http: 422, condition: "Submitted documents do not satisfy required_documents" }
  - { id: ERR_STALE_ATTESTATION, http: 422, condition: "AccreditationAttestation.attested_at_utc older than 90 days at verify time" }
  - { id: ERR_CLASS_CLOSED, http: 422, condition: "ShareClass.is_open_for_subscription == false blocks new subscription" }
  - { id: ERR_BELOW_MIN_INVESTMENT, http: 422, condition: "commitment_amount_cents < ShareClass.min_initial_investment_cents" }
  - { id: ERR_FUNDING_DEADLINE_PASSED, http: 422, condition: "Funding received after funding_deadline_utc" }
  - { id: ERR_INVALID_AMOUNT, http: 422, condition: "Funding amount <= 0 or redemption amount invalid" }
  - { id: ERR_NO_OPEN_NAV_PERIOD, http: 422, condition: "Subscription accept requires Fund.current_nav_period_id non-null" }
  - { id: ERR_SERIES_MISMATCH, http: 422, condition: "effective_series_id references a Series not OPEN under the subscription's ShareClass" }
  - { id: ERR_LOCKUP_NOT_EXPIRED, http: 422, condition: "CapitalAccount.locked_until_utc > current_utc on redemption approve" }
  - { id: ERR_INSUFFICIENT_NOTICE, http: 422, condition: "actual_notice_days < required_notice_days on redemption approve" }
  - { id: ERR_REDEMPTIONS_SUSPENDED, http: 422, condition: "Fund.suspension_status == SUSPENDED blocks redemption approve" }
  - { id: ERR_INSUFFICIENT_BALANCE, http: 422, condition: "Redemption amount exceeds CapitalAccount.current_balance_cents" }
  - { id: ERR_INVALID_SUPERSESSION, http: 422, condition: "supersedes_side_letter_id does not reference an EXECUTED SideLetter owned by the same investor" }
  - { id: ERR_CLAUSE_RETIRED, http: 422, condition: "MfnClause.status == RETIRED blocks new election" }
  - { id: ERR_BELOW_CAPACITY_THRESHOLD, http: 422, condition: "Subscription.commitment_amount_cents < MfnClause.capacity_threshold_cents blocks MFN election" }
  - { id: ERR_INVALID_REQUEST, http: 400, condition: "Missing required field, malformed value, or invalid enum" }

# =============================================================================
# Table 7: RBAC Matrix
# =============================================================================
roles:
  - name: FundAdmin
    description: "Fund administrator operations staff; configures funds, classes, accepts subscriptions, manages gates"
    identity: opaque
    exclusive_operations:
      - "POST /funds"
      - "POST /funds/{fundId}/share-classes"
      - "POST /funds/{fundId}/nav-periods"
      - "POST /funds/{fundId}/nav-periods/{periodId}/finalize"
      - "POST /funds/{fundId}/nav-periods/{periodId}/close"
      - "POST /funds/{fundId}/subscriptions/{subId}/accept"
      - "POST /funds/{fundId}/subscriptions/{subId}/cancel"
      - "POST /funds/{fundId}/redemptions/{redId}/approve"
      - "POST /funds/{fundId}/redemptions/{redId}/reject"
      - "POST /funds/{fundId}/suspend-redemptions"
      - "POST /funds/{fundId}/resume-redemptions"
      - "POST /funds/{fundId}/mfn-clauses"
      - "POST /funds/{fundId}/mfn-clauses/{clauseId}/retire"
      - "POST /funds/{fundId}/side-letters"
      - "POST /funds/{fundId}/side-letters/{letterId}/execute"
      - "POST /funds/{fundId}/side-letters/{letterId}/terminate"
      - "POST /_clock/set_current_utc"
    shared_operations:
      - "GET reads across all resources"
      - "POST /investors (shared with TransferAgent)"
      - "POST /investors/{investorId}/capital-accounts/{accountId}/statements/{stmtId}/deliver (shared with TransferAgent)"

  - name: ComplianceOfficer
    description: "AML/KYC and accreditation verification officer"
    identity: opaque
    exclusive_operations:
      - "POST /investors/{investorId}/kyc-cases/{caseId}/approve"
      - "POST /investors/{investorId}/kyc-cases/{caseId}/reject"
      - "POST /investors/{investorId}/accreditations/{attId}/verify"
      - "POST /investors/{investorId}/accreditations/{attId}/reject"
      - "POST /funds/{fundId}/subscriptions/{subId}/compliance-approve"
      - "POST /funds/{fundId}/subscriptions/{subId}/compliance-reject"
    shared_operations:
      - "GET reads across all resources"
      - "POST /investors/{investorId}/kyc-cases (shared with FundAdmin)"

  - name: TransferAgent
    description: "Back-office transfer agent; records fundings, assists investors with document submission"
    identity: opaque
    exclusive_operations:
      - "POST /funds/{fundId}/subscriptions/{subId}/fundings"
    shared_operations:
      - "GET reads"
      - "POST /investors (shared with FundAdmin)"
      - "POST /investors/{investorId}/kyc-cases/{caseId}/documents (shared with Investor)"
      - "POST /investors/{investorId}/accreditations (shared with Investor)"
      - "POST /funds/{fundId}/subscriptions (shared with Investor and FundAdmin)"
      - "POST /funds/{fundId}/subscriptions/{subId}/submit (shared with Investor)"
      - "POST /funds/{fundId}/redemptions (shared with Investor)"
      - "POST /investors/{investorId}/capital-accounts/{accountId}/statements/{stmtId}/deliver (shared with FundAdmin)"

  - name: PortfolioManager
    description: "Read-only PM role; views fund state and reports"
    identity: opaque
    exclusive_operations: []
    shared_operations:
      - "GET reads across all resources"

  - name: Investor
    description: "The fund investor; acts on own resources only (X-User-ID equals Investor.id)"
    identity: entity_backed:Investor
    exclusive_operations:
      - "POST /funds/{fundId}/side-letters/{letterId}/elect-mfn"
      - "POST /funds/{fundId}/redemptions/{redId}/cancel"
    shared_operations:
      - "GET own investor record, own capital accounts, own subscriptions, own redemptions, own statements, own side letters"
      - "POST /investors/{investorId}/kyc-cases/{caseId}/documents (shared with TransferAgent)"
      - "POST /investors/{investorId}/accreditations (shared with TransferAgent)"
      - "POST /funds/{fundId}/subscriptions (shared with TransferAgent and FundAdmin)"
      - "POST /funds/{fundId}/subscriptions/{subId}/submit (shared with TransferAgent)"
      - "POST /funds/{fundId}/redemptions (shared with TransferAgent)"
