          test_interval_months: 12
          install_date: '2026-01-01T00:00:00Z'
        as: UtilityAdmin
        captures:
          dev1: $.data.id
      - call: POST /devices
        payload:
          service_connection_id: ${conn_id}
          serial_number: SN-0015B
          device_type: DC
          hazard_rating: LOW
          test_interval_months: 12
          install_date: '2026-01-01T00:00:00Z'
        as: UtilityAdmin
        captures:
          dev2: $.data.id
      - call: POST /testers
        payload:
          name: Jane Tester
          certification_number: CN-0015
          cert_effective_date: '2025-01-01T00:00:00Z'
          cert_expiry_date: '2027-01-01T00:00:00Z'
        as: UtilityAdmin
        captures:
          tester_id: $.data.id
      - call: POST /test-appointments
        payload:
          device_id: ${dev1}
          tester_id: ${tester_id}
          scheduled_start: '2026-04-11T09:00:00Z'
          scheduled_end: '2026-04-11T10:00:00Z'
        as: Tester
        as_user_id: ${tester_id}
        captures:
          appt1_id: $.data.id
      trigger:
      - call: POST /test-appointments
        payload:
          device_id: ${dev2}
          tester_id: ${tester_id}
          scheduled_start: '2026-04-11T10:30:00Z'
          scheduled_end: '2026-04-11T11:00:00Z'
        as: Tester
        as_user_id: ${tester_id}
        captures:
          err: $.data.error_id
      assert:
      - response error_id == ERR_PREMISES_BUFFER_CONFLICT (30-minute gap < 60-minute buffer, same connection)
      - HTTP status == 409
- rule_id: compensating_invariant
  instances:
  - name: protected_device_count_conserved_on_replacement
    grounds:
    - state_machines.BackflowDevice.NEEDS_REPAIR_to_REPLACED
    - state_machines.RepairOrder.OPEN_to_COMPLETED
    - entities.ServiceConnection.fields.protected_device_count
    distinguishing_aspect: 'Completing a REPLACEMENT retires the old device (REPLACED, leaves the count) and installs a new ACTIVE device (enters the count), so ServiceConnection.protected_device_count stays == 1 — conserved quantity: protected device count.'
    test_recipe:
      setup:
      - Connection with one device (protected_device_count == 1).
      - Device driven to NEEDS_REPAIR via a FAIL accept; a REPLACEMENT order is opened.
      setup_api_calls:
      - call: POST /service-connections
        payload:
          account_number: AC-0016
          address: 1 Main St
          owner_user_id: owner-1
          hazard_class: HIGH_HAZARD
        as: UtilityAdmin
        captures:
          conn_id: $.data.id
          conn_ver: $.data.version
      - call: POST /devices
        payload:
          service_connection_id: ${conn_id}
          serial_number: SN-0016
          device_type: RP
          hazard_rating: HIGH
          test_interval_months: 12
          install_date: '2026-01-01T00:00:00Z'
        as: UtilityAdmin
        captures:
          dev_id: $.data.id
      - call: POST /testers
        payload:
          name: Jane Tester
          certification_number: CN-0016
          cert_effective_date: '2025-01-01T00:00:00Z'
          cert_expiry_date: '2027-01-01T00:00:00Z'
        as: UtilityAdmin
        captures:
          tester_id: $.data.id
      - call: POST /test-reports
        payload:
          device_id: ${dev_id}
          tester_id: ${tester_id}
          test_date: '2026-02-20T00:00:00Z'
          relief_valve_differential_psid: 1.5
          check_valve_1_psid: 1.5
        as: Tester
        as_user_id: ${tester_id}
        captures:
          report_id: $.data.id
      - call: POST /test-reports/${report_id}/accept
        payload: {}
        as: UtilityAdmin
      - call: POST /repair-orders
        payload:
          device_id: ${dev_id}
          order_type: REPLACEMENT
          description: replace assembly
          replacement_serial_number: SN-0016B
        as: UtilityAdmin
        captures:
          order_id: $.data.id
      trigger:
      - call: POST /repair-orders/${order_id}/complete
        payload:
          replacement_serial_number: SN-0016B
        as: UtilityAdmin
      assert:
      - BackflowDevice.${dev_id}.status == REPLACED
      - ServiceConnection.${conn_id}.protected_device_count == 1 (old -1 out, new +1 in — conserved)
  - name: open_notice_count_conserved_on_issue_then_rescind
    grounds:
    - state_machines.ShutoffNotice.ISSUED_to_RESCINDED
    - validations[priority=7]
    - entities.ServiceConnection.fields.open_notice_count
    distinguishing_aspect: 'Issuing a notice raises open_notice_count 0->1 and rescinding it lowers 1->0, so the count returns to 0 after the issue+rescind pair — conserved quantity: open ISSUED-notice count, distinct from the device-count invariant.'
    test_recipe:
      setup:
      - Connection with no devices (overdue_device_count 0, no NEEDS_REPAIR), so a notice can be rescinded.
      - A notice is manually issued.
      setup_api_calls:
      - call: POST /service-connections
        payload:
          account_number: AC-0017
          address: 1 Main St
          owner_user_id: owner-1
          hazard_class: HIGH_HAZARD
        as: UtilityAdmin
        captures:
          conn_id: $.data.id
          conn_ver: $.data.version
      - call: POST /shutoff-notices
        payload:
          service_connection_id: ${conn_id}
          reason: OVERDUE_TEST
        as: UtilityAdmin
        captures:
          notice_id: $.data.id
      trigger:
      - call: POST /shutoff-notices/${notice_id}/rescind
        payload: {}
        as: UtilityAdmin
      assert:
      - ShutoffNotice.${notice_id}.status == RESCINDED
      - ServiceConnection.${conn_id}.open_notice_count == 0 (issue 0->1 then rescind 1->0 conserves the count)
