          rationale: >
            The §1.8 cross_entity_state_dependency instance already proves that mark-ready reads the
            sibling CumulativeFile's assembly_status (ERR_FILE_NOT_COMPLETE at 3-of-4 certified, then
            success at 4-of-4), which is exactly the cross-entity validation this corner would probe.

      - name: destruction_requires_no_open_obligations_aggregate
        claim_type: aggregate_validation
