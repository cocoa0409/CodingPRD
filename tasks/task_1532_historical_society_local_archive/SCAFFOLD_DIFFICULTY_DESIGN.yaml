            - { call: "POST /research-requests", payload: { item_ids: ["${i1}"], topic: "t1", purpose: "PERSONAL" }, as: Researcher, as_user_id: "${r}", captures: { rq1: $.data.id } }
            - { call: "POST /research-requests", payload: { item_ids: ["${i2}"], topic: "t2", purpose: "PERSONAL" }, as: Researcher, as_user_id: "${r}", captures: { rq2: $.data.id } }
            - { call: "POST /research-requests", payload: { item_ids: ["${i3}"], topic: "t3", purpose: "PERSONAL" }, as: Researcher, as_user_id: "${r}", captures: { rq3: $.data.id } }
            - { call: "POST /research-requests", payload: { item_ids: ["${i4}"], topic: "t4", purpose: "PERSONAL" }, as: Researcher, as_user_id: "${r}", captures: { rq4: $.data.id } }
            - { call: "POST /research-requests/${rq1}/begin-review", as: ReadingRoomStaff }
            - { call: "POST /research-requests/${rq1}/approve", as: ReadingRoomStaff }
            - { call: "POST /research-requests/${rq2}/begin-review", as: ReadingRoomStaff }
            - { call: "POST /research-requests/${rq2}/approve", as: ReadingRoomStaff }
            - { call: "POST /research-requests/${rq3}/begin-review", as: ReadingRoomStaff }
            - { call: "POST /research-requests/${rq3}/approve", as: ReadingRoomStaff }
            - { call: "POST /research-requests/${rq4}/begin-review", as: ReadingRoomStaff }
            - { call: "POST /research-requests/${rq4}/approve", as: ReadingRoomStaff }
            - { call: "POST /reading-room-appointments", payload: { research_request_id: "${rq1}", room_code: "MAIN", scheduled_date: "2026-08-10", start_time: "10:00", end_time: "12:00", seats: 2 }, as: Researcher, as_user_id: "${r}", captures: { ap1: $.data.id } }
          trigger:
            - { call: "POST /reading-room-appointments", payload: { research_request_id: "${rq2}", room_code: "MAIN", scheduled_date: "2026-08-10", start_time: "12:00", end_time: "13:00", seats: 2 }, as: Researcher, as_user_id: "${r}", captures: { ap2: $.data.id, st2: $.data.status } }
            - { call: "POST /reading-room-appointments", payload: { research_request_id: "${rq3}", room_code: "MAIN", scheduled_date: "2026-08-10", start_time: "11:59", end_time: "12:01", seats: 1 }, as: Researcher, as_user_id: "${r}", captures: { err: $.data.error_id } }
            - { call: "POST /reading-room-appointments", payload: { research_request_id: "${rq1}", room_code: "MAIN", scheduled_date: "2026-08-10", start_time: "14:00", end_time: "15:00", seats: 1 }, as: Researcher, as_user_id: "${r}", captures: { err2: $.data.error_id } }
          assert:
            - "adjacent [12:00,13:00) after [10:00,12:00): CONFIRMED (${st2}) — touching bounds do not overlap"
            - "one-minute overlap [11:59,12:01): error_id == ERR_APPOINTMENT_CAPACITY_EXCEEDED (${err}) — seats still fit (2+2+1 <= 8) BUT the interval overlaps; rejection here is the overlap rule inside capacity arithmetic"
            - "same-item same-date on [14:00,15:00) (no time overlap with the morning): error_id == ERR_ITEM_DOUBLE_BOOKED (${err2}) — whole-day item granularity"

      - name: studio_turnaround_buffer_gap_semantics
        grounds:
          - calculations.recording_studio_conflict
          - errors[ERR_RECORDING_ROOM_CONFLICT]
        distinguishing_aspect: |
          Interval semantics B — CLOSED session intervals on a single-resource
          studio with a mandatory 30-minute turnaround gap: back-to-back sessions
          (gap 0) and gap 29 are conflicts while gap exactly 30 is admitted; the
          parallel studio is unaffected. Different semantics and different
          resource entity from the reading-room instance.
        test_recipe:
          setup:
            - "Collection C exists; no recordings yet; clock default"
          setup_api_calls:
            - { call: "POST /storage-zones", payload: { zone_code: "Z1", name: "Vault A" }, as: Registrar, captures: { z: $.data.id } }
            - { call: "POST /collections", payload: { title: "Papers", collection_code: "C1", storage_zone_id: "${z}" }, as: Registrar, captures: { c: $.data.id } }
            - { call: "POST /oral-histories", payload: { collection_id: "${c}", narrator_name: "N. One", interviewer_name: "I. One", recording_room_id: "STUDIO_A", session_start: "2026-09-01T10:00:00Z", session_end: "2026-09-01T12:00:00Z" }, as: Archivist, captures: { s1: $.data.id } }
          trigger:
            - { call: "POST /oral-histories", payload: { collection_id: "${c}", narrator_name: "N. Two", interviewer_name: "I. One", recording_room_id: "STUDIO_A", session_start: "2026-09-01T12:00:00Z", session_end: "2026-09-01T13:00:00Z" }, as: Archivist, captures: { e1: $.data.error_id } }
            - { call: "POST /oral-histories", payload: { collection_id: "${c}", narrator_name: "N. Two", interviewer_name: "I. One", recording_room_id: "STUDIO_A", session_start: "2026-09-01T12:29:00Z", session_end: "2026-09-01T13:00:00Z" }, as: Archivist, captures: { e2: $.data.error_id } }
            - { call: "POST /oral-histories", payload: { collection_id: "${c}", narrator_name: "N. Two", interviewer_name: "I. One", recording_room_id: "STUDIO_A", session_start: "2026-09-01T12:30:00Z", session_end: "2026-09-01T13:30:00Z" }, as: Archivist, captures: { s4: $.data.id, st4: $.data.status } }
            - { call: "POST /oral-histories", payload: { collection_id: "${c}", narrator_name: "N. Three", interviewer_name: "I. One", recording_room_id: "STUDIO_B", session_start: "2026-09-01T11:00:00Z", session_end: "2026-09-01T12:00:00Z" }, as: Archivist, captures: { s5: $.data.id } }
          assert:
            - "gap 0 after S1: error_id == ERR_RECORDING_ROOM_CONFLICT (${e1})"
            - "gap 29 minutes: error_id == ERR_RECORDING_ROOM_CONFLICT (${e2})"
            - "gap exactly 30 minutes: created (${s4}) with status SCHEDULED (${st4}) — the buffer check uses <= so exact turnaround is admitted"
            - "STUDIO_B overlapping session created (${s5}) — conflict scope is per recording_room_id"

  # ---------------------------------------------------------------------------
  - rule_id: compensating_invariant
    instances:
      - name: pay_then_refund_restores_charge_ledger
        grounds:
          - state_machines.ReproductionOrder
          - entities.Researcher.fields.total_charged_cents
          - errors[ERR_PAYMENT_AMOUNT_MISMATCH]
        distinguishing_aspect: |
          Conserved quantity: the researcher's money ledger. The forward action
          (pay, exact amount) and its compensating action (refund) MUST leave
          Researcher.total_charged_cents equal to its pre-pay value, pinned as
          total_charged = sum(invoiced_fee_cents over PAID/DELIVERED orders);
          REFUNDED orders contribute 0.
        test_recipe:
          setup:
            - "Order O APPROVED with quote 2000, invoiced at actual_pages 66 -> 2150; researcher R total_charged_cents == 0 before pay"
          setup_api_calls:
            - { call: "POST /storage-zones", payload: { zone_code: "Z1", name: "Vault A" }, as: Registrar, captures: { z: $.data.id } }
            - { call: "POST /collections", payload: { title: "Papers", collection_code: "C1", storage_zone_id: "${z}" }, as: Registrar, captures: { c: $.data.id } }
            - { call: "POST /accessions", payload: { donor_name: "E. Stone", donor_contact: "s@example.org", accession_date: "2026-07-15", lot_appraised_value_cents: 9000 }, as: Registrar, captures: { a: $.data.id } }
            - { call: "POST /accessions/${a}/submit", as: Registrar }
            - { call: "POST /accessions/${a}/deeds", payload: {}, as: Registrar, captures: { d: $.data.id } }
            - { call: "GET /accessions/${a}", as: Registrar, captures: { av: $.data.version } }
            - { call: "POST /deeds/${d}/execute", payload: { expected_accession_version: "${av}" }, as: Registrar }
            - { call: "POST /finding-aids", payload: { collection_id: "${c}", title: "FA", summary: "S" }, as: Archivist, captures: { fa: $.data.id } }
            - { call: "POST /finding-aids/${fa}/submit-review", as: Archivist }
            - { call: "POST /finding-aids/${fa}/publish", as: Archivist }
            - { call: "POST /items", payload: { accession_id: "${a}", collection_id: "${c}", title: "Ledger" }, as: Archivist, captures: { i: $.data.id } }
            - { call: "POST /items/${i}/catalog", payload: { description: "Ledger", condition_grade: "GOOD", appraised_value_cents: 15000, format: "BOUND_VOLUME" }, as: Archivist }
            - { call: "POST /items/${i}/make-available", as: Archivist }
            - { call: "POST /researchers", payload: { full_name: "R. Reader", email: "r1@example.org" }, as: ReadingRoomStaff, captures: { r: $.data.id } }
            - { call: "POST /research-requests", payload: { item_ids: ["${i}"], topic: "Mills", purpose: "PERSONAL" }, as: Researcher, as_user_id: "${r}", captures: { rq: $.data.id } }
            - { call: "POST /research-requests/${rq}/begin-review", as: ReadingRoomStaff }
            - { call: "POST /research-requests/${rq}/approve", as: ReadingRoomStaff }
            - { call: "POST /reproduction-orders", payload: { research_request_id: "${rq}", item_ids: ["${i}"], format: "SCAN_STANDARD", page_estimate: 60, license_class: "PERSONAL", rush: false }, as: Researcher, as_user_id: "${r}", captures: { o: $.data.id } }
            - { call: "POST /reproduction-orders/${o}/approve-quote", as: Researcher, as_user_id: "${r}" }
            - { call: "POST /reproduction-orders/${o}/invoice", payload: { actual_pages: 66 }, as: ReadingRoomStaff }
            - { call: "POST /reproduction-orders/${o}/pay", payload: { amount_cents: 2150 }, as: Researcher, as_user_id: "${r}", captures: { pst: $.data.status } }
            - { call: "GET /researchers/${r}", as: ReadingRoomStaff, captures: { charged_after_pay: $.data.total_charged_cents } }
          trigger:
            - { call: "POST /reproduction-orders/${o}/refund", as: ReadingRoomStaff, captures: { rst: $.data.status } }
            - { call: "GET /researchers/${r}", as: ReadingRoomStaff, captures: { charged_after_refund: $.data.total_charged_cents } }
          assert:
            - "pay with exact amount succeeded: order status PAID (${pst}); Researcher.total_charged_cents == 2150 (${charged_after_pay})"
            - "refund: order status REFUNDED (${rst}); Researcher.total_charged_cents == 0 (${charged_after_refund}) — forward + compensating pair conserves the ledger"

      - name: claim_then_release_restores_ticket_pool
        grounds:
          - state_machines.DigitizationTicket
          - entities.VolunteerProject.fields.active_ticket_count
          - errors[ERR_NO_CLAIMABLE_TICKETS]
        distinguishing_aspect: |
          Conserved quantity: the project's active-ticket count / queue depth (a
          capacity quantity, different from the money ledger instance). A claim
          followed by its compensating release MUST return active_ticket_count
          and the ticket's claim fields to their pre-claim values.
        test_recipe:
          setup:
            - "VolunteerProject P ACTIVE with exactly one ticket T QUEUED (item AVAILABLE); active_ticket_count == 0"
          setup_api_calls:
            - { call: "POST /storage-zones", payload: { zone_code: "Z1", name: "Vault A" }, as: Registrar, captures: { z: $.data.id } }
            - { call: "POST /collections", payload: { title: "Papers", collection_code: "C1", storage_zone_id: "${z}" }, as: Registrar, captures: { c: $.data.id } }
            - { call: "POST /accessions", payload: { donor_name: "E. Stone", donor_contact: "s@example.org", accession_date: "2026-07-15", lot_appraised_value_cents: 9000 }, as: Registrar, captures: { a: $.data.id } }
            - { call: "POST /accessions/${a}/submit", as: Registrar }
            - { call: "POST /accessions/${a}/deeds", payload: {}, as: Registrar, captures: { d: $.data.id } }
            - { call: "GET /accessions/${a}", as: Registrar, captures: { av: $.data.version } }
            - { call: "POST /deeds/${d}/execute", payload: { expected_accession_version: "${av}" }, as: Registrar }
            - { call: "POST /finding-aids", payload: { collection_id: "${c}", title: "FA", summary: "S" }, as: Archivist, captures: { fa: $.data.id } }
            - { call: "POST /finding-aids/${fa}/submit-review", as: Archivist }
            - { call: "POST /finding-aids/${fa}/publish", as: Archivist }
            - { call: "POST /items", payload: { accession_id: "${a}", collection_id: "${c}", title: "Photos" }, as: Archivist, captures: { i: $.data.id } }
            - { call: "POST /items/${i}/catalog", payload: { description: "Prints", condition_grade: "GOOD", appraised_value_cents: 15000, format: "PHOTOGRAPH" }, as: Archivist }
            - { call: "POST /items/${i}/make-available", as: Archivist }
            - { call: "POST /volunteer-projects", payload: { name: "Photo digitization" }, as: VolunteerCoordinator, captures: { p: $.data.id } }
            - { call: "POST /volunteer-projects/${p}/activate", as: VolunteerCoordinator }
            - { call: "POST /volunteer-projects/${p}/tickets", payload: { item_id: "${i}" }, as: VolunteerCoordinator, captures: { t: $.data.id } }
            - { call: "GET /volunteer-projects/${p}", as: VolunteerCoordinator, captures: { n0: $.data.active_ticket_count } }
          trigger:
            - { call: "POST /volunteer-projects/${p}/tickets/claim-next", as: Volunteer, as_user_id: "vol_1", captures: { ct: $.data.id, cst: $.data.status } }
            - { call: "GET /volunteer-projects/${p}", as: VolunteerCoordinator, captures: { n1: $.data.active_ticket_count } }
            - { call: "POST /digitization-tickets/${t}/release", as: Volunteer, as_user_id: "vol_1", captures: { rst: $.data.status, rby: $.data.claimed_by_user_id } }
            - { call: "GET /volunteer-projects/${p}", as: VolunteerCoordinator, captures: { n2: $.data.active_ticket_count } }
          assert:
            - "pre-claim active_ticket_count == 0 (${n0})"
            - "claim: ticket ${ct} == ${t}, status CLAIMED (${cst}); active_ticket_count == 1 (${n1})"
            - "release: status QUEUED (${rst}), claimed_by_user_id == null (${rby})"
            - "post-release active_ticket_count == 0 (${n2}) — claim + release conserves the pool; ticket is claimable again"
