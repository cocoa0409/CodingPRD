              payload: { move_id: "${mv_id}", utility_type: "ELECTRIC", limit: 10, offset: 0 }
              as: MoveOpsAgent
              captures: { uo_e_id: "$.data[0].id" }
            - call: "POST /utility-orders/${uo_e_id}/activation"
              payload: { confirmation_code: "ACT-1001" }
              as: MoveOpsAgent
              captures: { e_act: $.data.error_id }
          assert:
            - "trigger call 1 returns HTTP 403 with ${e_map} == ERR_FORBIDDEN_ROLE: provider mapping is MoveOpsAgent/PlatformAdmin only, and a ComplianceOfficer with every other permission on the move cannot run it"
            - "trigger call 2 returns HTTP 403 with ${e_prov} == ERR_FORBIDDEN_ROLE, and a follow-up read shows provider_status still ACTIVE: the PlatformAdmin-exclusive reference-data write left nothing behind"
            - "trigger call 3 returns HTTP 200 for the same body the ComplianceOfficer was refused, so the refusal was about the role and not the request"
            - "trigger call 5 returns HTTP 403 with ${e_act} == ERR_FORBIDDEN_ROLE even though the order is in DRAFT: the priority-2 role gate is decided before the priority-8 order-status gate, which would have said ERR_ORDER_NOT_SCHEDULABLE"
            - "after trigger call 1 and before trigger call 3 the move's version is still ${mv_v_before} and lifecycle_status is still VERIFIED"

      - name: rbac_manual_override_is_reserved_to_compliance_on_a_path_shared_with_move_ops
        claim_type: exclusive_operation_denial
        grounds:
          - roles.ComplianceOfficer.exclusive_operations
          - roles.MoveOpsAgent.shared_operations
          - "endpoints[POST /moves/{id}/identity-verifications]"
          - "validations[priority=2]"
        distinguishing_aspect: |
          The only permission in the model that splits one endpoint by a body field: MoveOpsAgent may
          post a KBA verification on exactly this path but not a MANUAL_OVERRIDE, so the role check
          has to read `method` rather than the route. The refused attempt must leave
          identity_attempt_count at 0, and the missing-override_reason case shows the role decision
          precedes the schema decision.
        test_recipe:
          setup:
            - "A fresh INTAKE move with no identity attempts yet."
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-08-01T00:00:00Z" }
              as: PlatformAdmin
            - call: "POST /feed-sources"
              payload: { name: "Metro PM Feed", source_type: "PROPERTY_MANAGER", referral_revenue_share_pct: 0.1750, dedupe_window_days: 30, trust_tier: "TIER_B" }
              as: PlatformAdmin
              captures: { fs_id: $.data.id }
            - call: "POST /residents"
              payload: { full_name: "Dana Ruiz", email: "dana.ruiz@example.com", phone_last4: "4417", date_of_birth: "1988-04-12", ssn_last4: "6621" }
              as: PlatformAdmin
              captures: { res_id: $.data.id }
            - call: "POST /service-addresses"
              payload: { line1: "18 Maple Ct", city: "Atlanta", state_code: "GA", postal_code: "30301" }
              as: PlatformAdmin
              captures: { orig_id: $.data.id }
            - call: "POST /service-addresses"
              payload: { line1: "402 Peachtree Way", unit: "7B", city: "Atlanta", state_code: "GA", postal_code: "30302" }
              as: PlatformAdmin
              captures: { dest_id: $.data.id }
            - call: "POST /moves"
              payload: { resident_id: "${res_id}", feed_source_id: "${fs_id}", origin_address_id: "${orig_id}", destination_address_id: "${dest_id}", move_date: "2026-08-20" }
              as: MoveOpsAgent
              captures: { mv_id: $.data.id }
          trigger:
            - call: "POST /moves/${mv_id}/identity-verifications"
              payload: { method: "MANUAL_OVERRIDE", override_reason: "Notarized lease on file" }
              as: MoveOpsAgent
              captures: { e_role: $.data.error_id }
            - call: "GET /moves/${mv_id}"
              payload: {}
              as: MoveOpsAgent
            - call: "POST /moves/${mv_id}/identity-verifications"
              payload: { method: "MANUAL_OVERRIDE" }
              as: ComplianceOfficer
              as_user_id: "compliance-user-c1"
              captures: { e_body: $.data.error_id }
            - call: "POST /moves/${mv_id}/identity-verifications"
              payload: { method: "MANUAL_OVERRIDE", override_reason: "Notarized lease on file" }
              as: ComplianceOfficer
              as_user_id: "compliance-user-c1"
              captures: { idv_ovr_id: $.data.id }
            - call: "GET /moves/${mv_id}"
              payload: {}
              as: MoveOpsAgent
          assert:
            - "trigger call 1 returns HTTP 403 with ${e_role} == ERR_FORBIDDEN_ROLE although MoveOpsAgent is listed on this endpoint: the override method is a ComplianceOfficer/PlatformAdmin reservation"
            - "trigger call 2 shows identity_attempt_count == 0 and lifecycle_status == INTAKE: the refused override consumed no attempt"
            - "trigger call 3 returns HTTP 422 with ${e_body} == ERR_INVALID_REQUEST for a permitted role with a missing override_reason, so the role check at priority 2 is reached before the body check at priority 6"
            - "trigger call 4 returns HTTP 201 with data.status == PASSED, data.method == MANUAL_OVERRIDE and data.reviewer_user_id == compliance-user-c1"
            - "trigger call 5 shows lifecycle_status == VERIFIED, identity_attempt_count == 1 and readiness_score == 30, so only the one accepted attempt was counted"

