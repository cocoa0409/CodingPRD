            - call: "POST /platform/partners"
              payload: { legal_name: "Pool Trust", partner_type: "SECURITIZATION_TRUST", home_state: "DE" }
              as: PartnerAdmin
              as_user_id: "pa-one"
              captures: { t_id: $.data.id }
