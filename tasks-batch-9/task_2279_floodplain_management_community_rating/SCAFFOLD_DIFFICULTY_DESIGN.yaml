            - call: "POST /floodplain/improvement-records"
              payload: { structure_id: "${struct_id}", record_type: "REVERSAL", event_date: "2026-03-01T00:00:00Z", reverses_record_id: "${rec_2026_id}" }
              as: FloodplainAdministrator
              as_user_id: "fpa-01"
              captures: { rev_id: $.data.id }
          assert:
            - "ImprovementRecord.${rev_id}.record_type == REVERSAL"
            - "ImprovementRecord.${rev_id}.source == REVERSAL_ADJUSTMENT"
            - "ImprovementRecord.${rev_id}.cost_usd == 45000.00"
            - "ImprovementRecord.${rev_id}.counted_in_cumulative == false"
            - "ImprovementRecord.${rec_2026_id}.reversed == true"
            - "ImprovementRecord.${rec_2026_id}.cost_usd == 45000.00"
            - "Structure.${struct_id}.anchor_record_id == ${rec_2019_id}"
            - "Structure.${struct_id}.cumulative_counted_cost_usd == 60000.00"
            - "Structure.${struct_id}.cumulative_improvement_pct == 30.00"
            - "Structure.${struct_id}.single_event_improvement_pct == 30.00"
            - "Structure.${struct_id}.substantial_status == NONE"
            - "DeterminationCase.${auto_case_id}.status == WITHDRAWN"
            - "GET /floodplain/improvement-records?structure_id=${struct_id} returns total_count == 3"

      - name: violation_remediation_restores_community_sanction_points_to_zero
        grounds:
          - state_machines.Violation.ESCALATED_to_REMEDIATED
          - calculations.sanction_risk_and_posture
          - entities.Violation.fields.sanction_points_contributed
          - entities.Community.fields.compliance_posture
        distinguishing_aspect: |
          Conserved quantity: Community.sanction_risk_points. Remediating an ESCALATED CRITICAL
          violation drops the score from 17 (12 severity + 5 default penalty) back to exactly
          the 0 it held before the violation existed and restores GOOD_STANDING, while the
          DEFAULTED order stays DEFAULTED as the permanent record of the default.
        test_recipe:
          setup:
            - "Community with one CRITICAL violation (12 points) under a RemediationOrder whose deadline 2026-08-10 has passed at clock 2026-08-11."
            - "The order resolved DEFAULTED, so the violation is ESCALATED and sanction_risk_points is 17 with posture ON_PROBATION."
          setup_api_calls:
            - call: "POST /floodplain/communities"
              payload: { name: "Bayou City", state_code: "TX", cid_number: "480001", freeboard_ft: 1.5, cumulative_period_years: 10 }
              as: StateNfipCoordinator
              as_user_id: "snc-01"
              captures: { comm_id: $.data.id }
            - call: "POST /floodplain/firm-panels"
              payload: { community_id: "${comm_id}", panel_number: "48001C0100", suffix: "H", flood_zone: "AE", effective_date: "2020-01-01T00:00:00Z", base_flood_elevation_ft: 12.0 }
              as: StateNfipCoordinator
              as_user_id: "snc-01"
              captures: { panel_id: $.data.id }
            - call: "POST /floodplain/firm-panels/${panel_id}/activate"
              as: StateNfipCoordinator
              as_user_id: "snc-01"
            - call: "POST /floodplain/properties"
              payload: { community_id: "${comm_id}", firm_panel_id: "${panel_id}", parcel_id: "P-0201", mapped_area_code: "RLA-1", owner_name: "X Owner", owner_email: "x@example.com" }
              as: FloodplainAdministrator
              as_user_id: "fpa-01"
              captures: { prop_id: $.data.id }
            - call: "POST /floodplain/violations"
              payload: { property_id: "${prop_id}", violation_type: "UNPERMITTED_FILL", severity: "CRITICAL" }
              as: FloodplainAdministrator
              as_user_id: "fpa-01"
              captures: { v_id: $.data.id }
            - call: "POST /floodplain/remediation-orders"
              payload: { violation_id: "${v_id}", required_action: "Remove unpermitted fill from the floodway fringe", deadline_at: "2026-08-10T00:00:00Z" }
              as: FloodplainAdministrator
              as_user_id: "fpa-01"
              captures: { order_id: $.data.id }
            - call: "POST /floodplain/_clock/set_current_utc"
              payload: { to_iso8601: "2026-08-11T00:00:00Z" }
              as: FloodplainAdministrator
              as_user_id: "fpa-01"
            - call: "POST /floodplain/remediation-orders/${order_id}/resolve"
              payload: { resolution: "DEFAULTED" }
              as: FloodplainAdministrator
              as_user_id: "fpa-01"
          trigger:
            - call: "POST /floodplain/violations/${v_id}/resolve"
              payload: { resolution: "REMEDIATED", resolution_note: "Fill removed under municipal contract" }
              as: FloodplainAdministrator
              as_user_id: "fpa-01"
          assert:
            - "Violation.${v_id}.status == REMEDIATED"
            - "Violation.${v_id}.sanction_points_contributed == 0"
            - "Violation.${v_id}.resolved_at == 2026-08-11T00:00:00Z"
            - "RemediationOrder.${order_id}.status == DEFAULTED"
            - "Community.${comm_id}.sanction_risk_points == 0"
            - "Community.${comm_id}.compliance_posture == GOOD_STANDING"
            - "GET /floodplain/communities/${comm_id}/compliance-summary returns counted_violation_count 0, defaulted_order_count 0 and a510_credit_applied 0"

      - name: lowering_adopted_freeboard_expires_verified_credit_and_reverses_class
        grounds:
          - state_machines.HigherStandard.VERIFIED_to_EXPIRED
          - calculations.higher_standard_credit
          - calculations.crs_class_determination
          - endpoints["PATCH /floodplain/communities/{communityId}"]
        distinguishing_aspect: |
          Conserved quantity: Community.crs_credit_points_verified. Lowering freeboard_ft from
          5.0 to 1.0 cuts the A430_FREEBOARD ceiling to 100, expires the 500-point verified
          claim, and returns crs_credit_points_verified to 0 with crs_class back at 10 — while
          the already CERTIFIED cycle keeps resulting_class 9 as the historical record.
        test_recipe:
          setup:
            - "Community with freeboard_ft 5.0 and a VERIFIED A430_FREEBOARD standard worth 500 points."
            - "CrsCycle 2026 CERTIFIED with resulting_class 9, so Community.crs_class is 9."
          setup_api_calls:
            - call: "POST /floodplain/communities"
              payload: { name: "Bayou City", state_code: "TX", cid_number: "480001", freeboard_ft: 5.0, cumulative_period_years: 10 }
              as: StateNfipCoordinator
              as_user_id: "snc-01"
              captures: { comm_id: $.data.id }
            - call: "GET /floodplain/communities/${comm_id}"
              as: FloodplainAdministrator
              as_user_id: "fpa-01"
              captures: { comm_version: $.data.version }
            - call: "POST /floodplain/higher-standards"
              payload: { community_id: "${comm_id}", activity_code: "A430_FREEBOARD", documentation_cycle_year: 2026, claimed_points: 500, expected_community_version: "${comm_version}" }
              as: FloodplainAdministrator
              as_user_id: "fpa-01"
              captures: { std_id: $.data.id }
            - call: "POST /floodplain/higher-standards/${std_id}/submit"
              as: FloodplainAdministrator
              as_user_id: "fpa-01"
            - call: "POST /floodplain/crs-cycles"
              payload: { community_id: "${comm_id}", cycle_year: 2026, cycle_start_date: "2026-01-01T00:00:00Z", cycle_end_date: "2026-12-31T00:00:00Z", due_at: "2026-09-30T00:00:00Z" }
              as: StateNfipCoordinator
              as_user_id: "snc-01"
              captures: { cycle_id: $.data.id }
            - call: "POST /floodplain/crs-cycles/${cycle_id}/submit"
              as: FloodplainAdministrator
              as_user_id: "fpa-01"
            - call: "POST /floodplain/higher-standards/${std_id}/verify"
              payload: { decision: "VERIFY" }
              as: StateNfipCoordinator
              as_user_id: "snc-01"
            - call: "POST /floodplain/crs-cycles/${cycle_id}/verify-visit"
              as: StateNfipCoordinator
              as_user_id: "snc-01"
            - call: "POST /floodplain/crs-cycles/${cycle_id}/certify"
              as: StateNfipCoordinator
              as_user_id: "snc-01"
          trigger:
            - call: "PATCH /floodplain/communities/${comm_id}"
              payload: { freeboard_ft: 1.0 }
              as: FloodplainAdministrator
              as_user_id: "fpa-01"
          assert:
            - "Community.${comm_id}.freeboard_ft == 1.0"
            - "Community.${comm_id}.crs_credit_points_verified == 0"
            - "Community.${comm_id}.crs_class == 10"
            - "HigherStandard.${std_id}.documentation_status == EXPIRED"
            - "HigherStandard.${std_id}.verified_points == 0"
            - "HigherStandard.${std_id}.max_points_allowed == 100"
            - "CrsCycle.${cycle_id}.status == CERTIFIED"
            - "CrsCycle.${cycle_id}.resulting_class == 9"
            - "CrsCycle.${cycle_id}.total_verified_points == 500"
