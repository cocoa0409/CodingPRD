            - "link 3: InfusionAppointment.${appt_id}.status == \"CANCELLED\" and cancellation_reason == \"THERAPY_HELD\""
            - "link 4a: Authorization.${auth_id}.units_reserved == 0, units_consumed == 0, units_remaining == 6"
            - "link 4b: AssistanceEnrollment.${enr_id}.benefit_reserved_cents == 0, benefit_used_cents == 0, benefit_remaining_cents == 111007"
            - "link 4c: AssistanceEnrollment.${enr_id}.status == \"ACTIVE\" (recovered from EXHAUSTED by the release, proving link 4 is caused by link 3 and not by the lab)"
