            - "the still-OPEN trade's notional of 99900000 contributes nothing, which the value 1000000 confirms"

      - name: financial_standard_minimum_class_base_and_flat_floor
        claim_type: Constants Applied
        grounds:
          - calculations.financial_standard_minimum.constants.TIER_BASE
          - calculations.financial_standard_minimum.constants.GREATER_OF_TIER_CENTS
          - entities.Participant.fields.required_min_net_capital_cents
        distinguishing_aspect: "The greater-of rule lifts a BROKER_DEALER above its own 250000000 class base to the 500000000 flat floor, so the same class yields FAIL at 400000000 capital and PASS at 600000000."
        test_recipe:
          setup:
            - "Logical clock at 2026-09-05T00:00:00Z. Empty database."
          setup_api_calls:
            - call: "POST /clearing/_clock/set_current_utc"
              payload: { to_iso8601: "2026-09-05T00:00:00Z" }
              as: PlatformAdmin
          trigger:
            - call: "POST /clearing/participants"
              payload: { legal_name: "Thin Capital Co", lei: "LEI-THIN1", participant_class: "BROKER_DEALER", net_capital_cents: 400000000 }
              as: PlatformAdmin
              captures: { p_thin: $.data.id }
          assert:
            - "the response status is 201"
            - "Participant.${p_thin}.required_min_net_capital_cents == 500000000, the flat floor rather than the 250000000 class base"
            - "Participant.${p_thin}.financial_standard_status == FAIL"
            - "POST /clearing/participants/${p_thin}/activate is refused with ERR_FINANCIAL_STANDARD_NOT_MET"
            - "a second participant of the same class created with net_capital_cents 600000000 reports financial_standard_status == PASS"

      - name: netting_alleged_rows_excluded_from_inclusion_set
        claim_type: Input Set Filtering
        grounds:
          - calculations.multilateral_netting.input_set
          - entities.TradeSubmission.fields.match_status
        excluded_because:
          difficulty_instance: zero_net_position_set_boundary_on_empty_window
          rationale: "The ALLEGED exclusion from the netting inclusion set is asserted as the empty-set boundary in that named §1.8 instance."
  # ===========================================================================
  - section: validations
    instances:

      - name: missing_role_header_returns_unauthenticated
        claim_type: Violation → Error
        grounds:
          - validations[priority=1]
          - errors[ERR_UNAUTHENTICATED]
        distinguishing_aspect: "A request carrying no X-User-Role header is refused at the highest priority with 401 ERR_UNAUTHENTICATED before any existence or state check runs."
        test_recipe:
          setup:
            - "Logical clock at 2026-09-05T00:00:00Z. Empty database."
          setup_api_calls:
            - call: "POST /clearing/_clock/set_current_utc"
              payload: { to_iso8601: "2026-09-05T00:00:00Z" }
              as: PlatformAdmin
          trigger:
            - call: "GET /clearing/participants/00000000-0000-4000-8000-000000000000"
              payload: {}
              as: Anonymous
              captures: { err_anon: $.data.error_id }
          assert:
            - "the response status is 401 and data.error_id == ERR_UNAUTHENTICATED"
            - "the path id does not exist either, yet the 401 pre-empts the 404 ERR_RESOURCE_NOT_FOUND because authentication is checked first"

      - name: unfunded_settlement_obligation_blocks_settlement
        claim_type: Violation → Error
        grounds:
          - validations[priority=16]
          - errors[ERR_OBLIGATION_UNDERFUNDED]
        distinguishing_aspect: "A NETTED window whose net position is funded below its settlement_obligation_cents is refused at settle time with ERR_OBLIGATION_UNDERFUNDED rather than settling partially."
        test_recipe:
          setup:
            - "Logical clock at 2026-09-05T00:00:00Z. Participants FU2 and FV2 are ACTIVE; Security FUN1 has an OPEN window settling 2026-09-10; FU2 holds a locked-in matched 100-unit BUY at 4000 cents; the window is NETTED so FU2 owes 400000 cents; FU2 funds only 300000."
          setup_api_calls:
            - call: "POST /clearing/_clock/set_current_utc"
              payload: { to_iso8601: "2026-09-05T00:00:00Z" }
              as: PlatformAdmin
            - call: "POST /clearing/participants"
              payload: { legal_name: "Fund Under Co", lei: "LEI-FU2", participant_class: "BANK", net_capital_cents: 2000000000 }
              as: PlatformAdmin
              captures: { p_fu2: $.data.id }
            - call: "POST /clearing/participants"
              payload: { legal_name: "Fund Cover Co", lei: "LEI-FV2", participant_class: "BANK", net_capital_cents: 2000000000 }
              as: PlatformAdmin
              captures: { p_fv2: $.data.id }
            - call: "POST /clearing/participants/${p_fu2}/activate"
              payload: {}
              as: PlatformAdmin
            - call: "POST /clearing/participants/${p_fv2}/activate"
              payload: {}
              as: PlatformAdmin
            - call: "POST /clearing/securities"
              payload: { ticker: "FUN1", cusip: "912828XT2", prev_settlement_price_cents: 5000 }
              as: PlatformAdmin
              captures: { sec_fun: $.data.id }
            - call: "POST /clearing/settlement-windows"
              payload: { security_id: "${sec_fun}", settlement_date: "2026-09-10", trade_entry_deadline: "2026-09-09T20:00:00Z", affirmation_deadline: "2026-09-09T22:00:00Z" }
              as: PlatformAdmin
              captures: { win_fun: $.data.id }
            - call: "POST /clearing/trade-submissions"
              payload: { counterparty_participant_id: "${p_fv2}", security_id: "${sec_fun}", side: "BUY", quantity: 100, trade_price_cents: 4000, trade_date: "2026-09-08T14:00:00Z" }
              as: ClearingMember
              as_user_id: "${p_fu2}"
              captures: { t_fun: $.data.id }
            - call: "POST /clearing/trade-submissions/${t_fun}/lock-in"
              payload: {}
              as: ClearingMember
              as_user_id: "${p_fu2}"
            - call: "POST /clearing/settlement-windows/${win_fun}/net"
              payload: {}
              as: PlatformAdmin
            - call: "GET /clearing/net-positions?window_id=${win_fun}"
              payload: {}
              as: ClearingMember
              captures: { np_fun: "$.data[0].id" }
            - call: "POST /clearing/net-positions/${np_fun}/fund"
              payload: { amount_cents: 300000 }
              as: ClearingMember
              as_user_id: "${p_fu2}"
          trigger:
            - call: "POST /clearing/settlement-windows/${win_fun}/settle"
              payload: {}
              as: PlatformAdmin
              captures: { err_fun: $.data.error_id }
          assert:
            - "the response status is 409 and data.error_id == ERR_OBLIGATION_UNDERFUNDED"
            - "GET /clearing/net-positions/${np_fun} reports funded_amount_cents == 300000 and settlement_obligation_cents == 400000"
            - "GET /clearing/settlement-windows/${win_fun} still reports status == NETTED"

      - name: auth_precedence_over_state_conflict
        claim_type: Priority Ordering
        grounds:
          - validations[priority=2]
          - validations[priority=12]
          - errors[ERR_UNAUTHORIZED]
          - errors[ERR_ACTION_NOT_EFFECTIVE]
        distinguishing_aspect: "A request that violates both the role gate at priority 2 and the corporate-action effective-date rule at priority 12 returns the priority-2 ERR_UNAUTHORIZED, so authorization always precedes business-temporal evaluation."
        test_recipe:
          setup:
            - "Logical clock at 2026-09-05T00:00:00Z. Participant PR2 is ACTIVE; Security PRC1 exists; a SPLIT action with effective_date 2026-09-20 is announced, which is after every window's settlement date."
          setup_api_calls:
            - call: "POST /clearing/_clock/set_current_utc"
              payload: { to_iso8601: "2026-09-05T00:00:00Z" }
              as: PlatformAdmin
            - call: "POST /clearing/participants"
              payload: { legal_name: "Precedence Alpha", lei: "LEI-PR2", participant_class: "BANK", net_capital_cents: 2000000000 }
              as: PlatformAdmin
              captures: { p_pr2: $.data.id }
            - call: "POST /clearing/participants/${p_pr2}/activate"
              payload: {}
              as: PlatformAdmin
            - call: "POST /clearing/securities"
              payload: { ticker: "PRC1", cusip: "912828XT3", prev_settlement_price_cents: 5000 }
              as: PlatformAdmin
              captures: { sec_prc: $.data.id }
            - call: "POST /clearing/corporate-actions"
              payload: { security_id: "${sec_prc}", action_type: "SPLIT", ratio_numerator: 3, ratio_denominator: 2, effective_date: "2026-09-20" }
              as: PlatformAdmin
              captures: { ca_prc: $.data.id }
          trigger:
            - call: "POST /clearing/corporate-actions/${ca_prc}/apply"
              payload: {}
              as: ClearingMember
              as_user_id: "${p_pr2}"
              captures: { err_prec: $.data.error_id }
          assert:
            - "the response status is 403 and data.error_id == ERR_UNAUTHORIZED, not ERR_ACTION_NOT_EFFECTIVE"
            - "GET /clearing/corporate-actions/${ca_prc} still reports status == ANNOUNCED"

      - name: segregated_custody_required_before_activation
        claim_type: Conditional validation
        grounds:
          - validations[priority=7]
          - errors[ERR_SEGREGATED_CUSTODY_REQUIRED]
        distinguishing_aspect: "The segregation requirement applies only when the participant's own requires_segregated_custody flag is true, so two otherwise identical participants diverge at activation purely on that flag."
        test_recipe:
          setup:
            - "Logical clock at 2026-09-05T00:00:00Z. Participant SG1 is created with requires_segregated_custody true and a passing capital level, and holds no custody account."
          setup_api_calls:
            - call: "POST /clearing/_clock/set_current_utc"
              payload: { to_iso8601: "2026-09-05T00:00:00Z" }
              as: PlatformAdmin
            - call: "POST /clearing/participants"
              payload: { legal_name: "Segregated Co", lei: "LEI-SG1", participant_class: "CUSTODIAN_BANK", net_capital_cents: 2000000000, requires_segregated_custody: true }
              as: PlatformAdmin
              captures: { p_sg1: $.data.id }
          trigger:
            - call: "POST /clearing/participants/${p_sg1}/activate"
              payload: {}
              as: PlatformAdmin
              captures: { err_seg: $.data.error_id }
          assert:
            - "the response status is 409 and data.error_id == ERR_SEGREGATED_CUSTODY_REQUIRED"
            - "GET /clearing/participants/${p_sg1} still reports membership_status == PENDING"
            - "POST /clearing/participants/${p_sg1}/custody-accounts with account_type SEGREGATED, then a repeated activate, succeeds"
            - "a participant of the same class created with requires_segregated_custody false activates on the first attempt"

      - name: funding_exactly_at_obligation_is_accepted
        claim_type: Satisfaction → Pass
        grounds:
          - validations[priority=18]
          - errors[ERR_FUNDING_EXCEEDS_OBLIGATION]
        distinguishing_aspect: "The funding ceiling is inclusive: funding to exactly settlement_obligation_cents succeeds, and only the next cent is refused with ERR_FUNDING_EXCEEDS_OBLIGATION, so funded_amount_cents saturates rather than overshoots."
        test_recipe:
          setup:
            - "Logical clock at 2026-09-05T00:00:00Z. Participants FU3 and FV3 are ACTIVE; Security SAT1 has a NETTED window for 2026-09-10 with FU3 owing exactly 400000 cents on its net position."
          setup_api_calls:
            - call: "POST /clearing/_clock/set_current_utc"
              payload: { to_iso8601: "2026-09-05T00:00:00Z" }
              as: PlatformAdmin
            - call: "POST /clearing/participants"
              payload: { legal_name: "Sat Alpha", lei: "LEI-FU3", participant_class: "BANK", net_capital_cents: 2000000000 }
              as: PlatformAdmin
              captures: { p_fu3: $.data.id }
            - call: "POST /clearing/participants"
              payload: { legal_name: "Sat Beta", lei: "LEI-FV3", participant_class: "BANK", net_capital_cents: 2000000000 }
              as: PlatformAdmin
              captures: { p_fv3: $.data.id }
            - call: "POST /clearing/participants/${p_fu3}/activate"
              payload: {}
              as: PlatformAdmin
            - call: "POST /clearing/participants/${p_fv3}/activate"
              payload: {}
              as: PlatformAdmin
            - call: "POST /clearing/securities"
              payload: { ticker: "SAT1", cusip: "912828XT4", prev_settlement_price_cents: 5000 }
              as: PlatformAdmin
              captures: { sec_sat: $.data.id }
            - call: "POST /clearing/settlement-windows"
              payload: { security_id: "${sec_sat}", settlement_date: "2026-09-10", trade_entry_deadline: "2026-09-09T20:00:00Z", affirmation_deadline: "2026-09-09T22:00:00Z" }
              as: PlatformAdmin
              captures: { win_sat: $.data.id }
            - call: "POST /clearing/trade-submissions"
              payload: { counterparty_participant_id: "${p_fv3}", security_id: "${sec_sat}", side: "BUY", quantity: 100, trade_price_cents: 4000, trade_date: "2026-09-08T14:00:00Z" }
              as: ClearingMember
              as_user_id: "${p_fu3}"
              captures: { t_sat: $.data.id }
            - call: "POST /clearing/trade-submissions/${t_sat}/lock-in"
              payload: {}
              as: ClearingMember
              as_user_id: "${p_fu3}"
            - call: "POST /clearing/settlement-windows/${win_sat}/net"
              payload: {}
              as: PlatformAdmin
            - call: "GET /clearing/net-positions?window_id=${win_sat}"
              payload: {}
              as: ClearingMember
              captures: { np_sat: "$.data[0].id" }
          trigger:
            - call: "POST /clearing/net-positions/${np_sat}/fund"
              payload: { amount_cents: 400000 }
