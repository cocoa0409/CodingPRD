# =============================================================================
# §1.8 Scaffold Difficulty Design (Test Targeting Index)
#
# Task 2544 — Mammography Accreditation & Breast Density Notification
#
# Every instance grounds exclusively in elements declared in SCAFFOLD.yaml
# §1.1–§1.7. Deleting this file would not change one byte of declared behavior;
# it only makes the downstream unit-test-generator's coverage harder to audit.
#
# Fixture conventions used throughout:
#   · The logical clock starts at 2026-08-01T00:00:00Z (§1.5 mandatory default)
#     and is re-pinned explicitly as the first setup call of every instance.
#   · The CT StatePolicy fixture: STATE_ENHANCED_ALL, reading grade ceiling 10,
#     lay-summary deadline 21 days, COVERAGE_NO_COST_SHARING, waiver 5000.
#   · The MA StatePolicy fixture: STATE_DENSE_ONLY, reading grade ceiling 6,
#     lay-summary deadline 14 days, COVERAGE_WITH_COST_SHARING, waiver 5000.
#   · Opaque roles use stable literal operator ids ("coord-1", "qa-1",
#     "reviewer-1", "inspector-1") so segregation-of-duties comparisons against
#     Personnel ids are always well defined.
#   · YAML anchors (&c_*) are declared on the first instance's base-fixture
#     calls and aliased (*c_*) by every later instance; the aliased call objects
#     are byte-identical, so every ${var} they bind keeps the same meaning.
# =============================================================================
scaffold_difficulty_design:

  # ===========================================================================
  - rule_id: dual_variant_calc
    instances:

      - name: ppv1_versus_ppv3_variant_divergence_on_radiologist_audit_cycle
        grounds:
          - calculations.radiologist_audit_metrics
          - entities.RadiologistAuditCycle.fields.variant_at_close
          - entities.RadiologistAuditCycle.fields.ppv_pct
          - entities.RadiologistAuditCycle.fields.biopsy_count
          - entities.Exam.fields.recall_flag
          - entities.Exam.fields.pathology_result
        distinguishing_aspect: |
          This dual-variant calculation lives in the RADIOLOGIST-PERFORMANCE
          domain (RadiologistAuditCycle over Exam interpretations): over one
          identical exam set PPV1_SCREENING yields ppv_pct 100.00 from a
          denominator of 1 while PPV3_BIOPSY_ALL yields 50.00 from a denominator
          of 2, because PPV1 admits only recalled-and-biopsied exams whereas
          PPV3 admits every biopsied exam regardless of recall_flag.
        test_recipe:
          setup:
            - "Logical clock at 2026-08-01T00:00:00Z; CT state policy registered."
            - "Harbor Breast Center with one DBT_3D unit and a qualified physicist, technologist and interpreting physician."
            - "Three SCREENING exams by the same radiologist inside [2026-01-01, 2026-07-15): BI-RADS 0 + biopsy MALIGNANT, BI-RADS 1 + no biopsy, BI-RADS 4 + biopsy BENIGN."
            - "One OPEN RadiologistAuditCycle over that period with followup_window_days 365."
          setup_api_calls:
            - &c_clock
              call: "POST /_clock/set_current_utc"
              payload: { current_utc: "2026-08-01T00:00:00Z" }
              as: AccreditationCoordinator
              as_user_id: "coord-1"
            - &c_pol_ct
              call: "POST /state-policies"
              payload: { state_code: "CT", density_notice_rule: "STATE_ENHANCED_ALL", lay_summary_max_reading_grade: 10, lay_summary_deadline_days: 21, supplemental_coverage_mandate: "COVERAGE_NO_COST_SHARING", required_notice_codes: ["CT-DENS-1", "CT-SUPP-2"], supplemental_cost_share_waiver_threshold_cents: 5000, followup_grace_days: 60, report_turnaround_days: 30, urgent_report_turnaround_days: 7, ce_grace_days: 90 }
              as: AccreditationBodyReviewer
              as_user_id: "reviewer-1"
              captures: { pol_ct_id: $.data.id }
            - &c_fac
              call: "POST /facilities"
              payload: { name: "Harbor Breast Center", state_policy_id: "${pol_ct_id}", accreditation_body: "ACR", supplemental_concurrent_capacity: 2 }
              as: AccreditationCoordinator
              as_user_id: "coord-1"
              captures: { fac_id: $.data.id }
            - &c_unit
              call: "POST /facilities/${fac_id}/units"
              payload: { manufacturer: "Hologic", model_serial: "SEL-9001", modality: "DBT_3D", accreditation_expires_on: "2027-06-30T00:00:00Z" }
              as: AccreditationCoordinator
              as_user_id: "coord-1"
              captures: { unit_id: $.data.id }
            - &c_phys
              call: "POST /facilities/${fac_id}/personnel"
              payload: { full_name: "Pia Physicist", role_type: "MEDICAL_PHYSICIST", initial_qualification_on: "2024-01-15T00:00:00Z", initial_training_hours: 25, initial_read_volume: 3, modality_certifications: ["DM_2D", "DBT_3D"] }
              as: AccreditationCoordinator
              as_user_id: "coord-1"
              captures: { phys_id: $.data.id }
            - &c_tech
              call: "POST /facilities/${fac_id}/personnel"
              payload: { full_name: "Tomas Tech", role_type: "TECHNOLOGIST", initial_qualification_on: "2024-02-01T00:00:00Z", initial_training_hours: 45, initial_read_volume: 30, modality_certifications: ["DM_2D", "DBT_3D"] }
              as: AccreditationCoordinator
              as_user_id: "coord-1"
              captures: { tech_id: $.data.id }
            - &c_rad
              call: "POST /facilities/${fac_id}/personnel"
              payload: { full_name: "Rosa Radiologist", role_type: "INTERPRETING_PHYSICIAN", initial_qualification_on: "2024-03-01T00:00:00Z", initial_training_hours: 65, initial_read_volume: 260, modality_certifications: ["DM_2D", "DBT_3D"] }
              as: AccreditationCoordinator
              as_user_id: "coord-1"
              captures: { rad_id: $.data.id }
            - call: "POST /exams"
              payload: { unit_id: "${unit_id}", technologist_id: "${tech_id}", patient_ref: "PT-1001", patient_state_code: "CT", exam_type: "SCREENING", performed_at: "2026-02-10T00:00:00Z", original_image_count: 4 }
              as: Technologist
              as_user_id: "${tech_id}"
              captures: { ea_id: $.data.id }
            - call: "POST /exams/${ea_id}/interpret"
              payload: { birads_assessment: 0, density_category: "C" }
              as: InterpretingPhysician
              as_user_id: "${rad_id}"
            - call: "POST /exams/${ea_id}/outcome"
              payload: { biopsy_performed: true, pathology_result: "MALIGNANT" }
              as: QualityAssuranceOfficer
              as_user_id: "qa-1"
            - call: "POST /exams"
              payload: { unit_id: "${unit_id}", technologist_id: "${tech_id}", patient_ref: "PT-1002", patient_state_code: "CT", exam_type: "SCREENING", performed_at: "2026-03-01T00:00:00Z", original_image_count: 4 }
              as: Technologist
              as_user_id: "${tech_id}"
              captures: { eb_id: $.data.id }
            - call: "POST /exams/${eb_id}/interpret"
              payload: { birads_assessment: 1, density_category: "B" }
              as: InterpretingPhysician
              as_user_id: "${rad_id}"
            - call: "POST /exams"
              payload: { unit_id: "${unit_id}", technologist_id: "${tech_id}", patient_ref: "PT-1003", patient_state_code: "CT", exam_type: "SCREENING", performed_at: "2026-04-01T00:00:00Z", original_image_count: 4 }
              as: Technologist
              as_user_id: "${tech_id}"
              captures: { ec_id: $.data.id }
            - call: "POST /exams/${ec_id}/interpret"
              payload: { birads_assessment: 4, density_category: "C" }
              as: InterpretingPhysician
              as_user_id: "${rad_id}"
            - call: "POST /exams/${ec_id}/outcome"
              payload: { biopsy_performed: true, pathology_result: "BENIGN" }
              as: QualityAssuranceOfficer
              as_user_id: "qa-1"
            - call: "POST /personnel/${rad_id}/audit-cycles"
              payload: { period_start: "2026-01-01T00:00:00Z", period_end: "2026-07-15T00:00:00Z", followup_window_days: 365 }
              as: QualityAssuranceOfficer
              as_user_id: "qa-1"
              captures: { cyc_id: $.data.id }
          trigger:
            - call: "GET /audit-cycles/${cyc_id}/metrics"
              payload: { variant: "PPV1_SCREENING" }
              as: QualityAssuranceOfficer
              as_user_id: "qa-1"
            - call: "GET /audit-cycles/${cyc_id}/metrics"
              payload: { variant: "PPV3_BIOPSY_ALL" }
              as: QualityAssuranceOfficer
              as_user_id: "qa-1"
          assert:
            - "PPV1_SCREENING response: screening_exam_count == 3, recall_count == 1, biopsy_count == 1, cancer_count == 1, excluded_exam_count == 0, ppv_pct == 100.00"
            - "PPV3_BIOPSY_ALL response: screening_exam_count == 3, recall_count == 1, biopsy_count == 2, cancer_count == 1, excluded_exam_count == 0, ppv_pct == 50.00"
            - "recall_rate_pct == 33.33 under BOTH variants (the recall denominator is variant-independent)"
            - "abnormal_interpretation_flag == true under BOTH variants (33.33 falls outside the closed band 5.00..12.00)"
            - "The two variants differ: PPV1 ppv_pct 100.00 != PPV3 ppv_pct 50.00 over the identical exam set"

      - name: image_based_versus_patient_based_repeat_rate_divergence_on_unit
        grounds:
          - calculations.unit_repeat_rate
          - entities.MammographyUnit.fields.image_based_repeat_rate_pct
          - entities.MammographyUnit.fields.patient_based_repeat_rate_pct
          - entities.MammographyUnit.fields.repeat_rate_flag
          - entities.RepeatImagingRecord.fields.repeat_image_count
        distinguishing_aspect: |
          This dual-variant calculation lives in the EQUIPMENT-QUALITY domain
          (MammographyUnit over RepeatImagingRecord), a different entity domain
          from the radiologist-performance PPV pair: over three 4-image exams
          with a single 2-image repeat the IMAGE_BASED variant returns 14.29
          (2/14) while the PATIENT_BASED variant returns 33.33 (1/3), and only
          the IMAGE_BASED value drives repeat_rate_flag.
        test_recipe:
          setup:
            - "Logical clock at 2026-08-01T00:00:00Z; CT policy, facility, one DBT_3D unit, qualified staff."
            - "Three SCREENING exams on the unit, each with original_image_count 4 (12 original images total)."
            - "One non-retracted RepeatImagingRecord of 2 images on the first exam."
          setup_api_calls:
            - *c_clock
            - *c_pol_ct
            - *c_fac
            - *c_unit
            - *c_phys
            - *c_tech
            - *c_rad
            - call: "POST /exams"
              payload: { unit_id: "${unit_id}", technologist_id: "${tech_id}", patient_ref: "PT-2001", patient_state_code: "CT", exam_type: "SCREENING", performed_at: "2026-07-01T00:00:00Z", original_image_count: 4 }
              as: Technologist
              as_user_id: "${tech_id}"
              captures: { rr_exam1_id: $.data.id }
            - call: "POST /exams"
              payload: { unit_id: "${unit_id}", technologist_id: "${tech_id}", patient_ref: "PT-2002", patient_state_code: "CT", exam_type: "SCREENING", performed_at: "2026-07-02T00:00:00Z", original_image_count: 4 }
              as: Technologist
              as_user_id: "${tech_id}"
            - call: "POST /exams"
              payload: { unit_id: "${unit_id}", technologist_id: "${tech_id}", patient_ref: "PT-2003", patient_state_code: "CT", exam_type: "SCREENING", performed_at: "2026-07-03T00:00:00Z", original_image_count: 4 }
              as: Technologist
              as_user_id: "${tech_id}"
            - call: "POST /exams/${rr_exam1_id}/repeat-records"
              payload: { reason_code: "POSITIONING", repeat_image_count: 2 }
              as: Technologist
              as_user_id: "${tech_id}"
          trigger:
            - call: "GET /units/${unit_id}"
              payload: {}
              as: AccreditationCoordinator
              as_user_id: "coord-1"
          assert:
            - "MammographyUnit.${unit_id}.total_images_acquired == 14"
            - "MammographyUnit.${unit_id}.repeat_images_acquired == 2"
            - "MammographyUnit.${unit_id}.image_based_repeat_rate_pct == 14.29"
            - "MammographyUnit.${unit_id}.patient_based_repeat_rate_pct == 33.33"
            - "MammographyUnit.${unit_id}.repeat_rate_flag == true (14.29 is strictly greater than 5.00)"
            - "The two variants differ: 14.29 != 33.33 over the identical exam/repeat set"

      - name: coverage_mandate_variant_divergence_on_supplemental_order
        grounds:
          - calculations.supplemental_coverage_determination
          - entities.SupplementalScreeningOrder.fields.coverage_outcome
          - entities.SupplementalScreeningOrder.fields.covered_amount_cents
          - entities.SupplementalScreeningOrder.fields.patient_responsibility_cents
          - entities.StatePolicy.fields.supplemental_coverage_mandate
        distinguishing_aspect: |
          This dual-variant calculation lives in the PAYER-COVERAGE domain
          (SupplementalScreeningOrder over StatePolicy), a third entity domain:
          two ULTRASOUND orders with identical density_category C and identical
          allowed_amount_cents 31500 diverge purely on the governing state's
          mandate — the CT patient gets COVERED_NO_COST_SHARE with
          covered 31500 / responsibility 0, the MA patient gets
          COVERED_WITH_COST_SHARE with covered 19373 / responsibility 12127.
        test_recipe:
          setup:
            - "Logical clock at 2026-08-01T00:00:00Z; CT policy (COVERAGE_NO_COST_SHARING) and MA policy (COVERAGE_WITH_COST_SHARING, waiver 5000) both registered."
            - "One facility whose home-state policy is CT, with one DBT_3D unit and qualified staff."
            - "Two SCREENING exams, one for a CT-resident patient and one for an MA-resident patient, both interpreted with density_category C."
            - "One ULTRASOUND SupplementalScreeningOrder in RECOMMENDED on each exam."
          setup_api_calls:
            - *c_clock
            - *c_pol_ct
            - &c_pol_ma
              call: "POST /state-policies"
              payload: { state_code: "MA", density_notice_rule: "STATE_DENSE_ONLY", lay_summary_max_reading_grade: 6, lay_summary_deadline_days: 14, supplemental_coverage_mandate: "COVERAGE_WITH_COST_SHARING", required_notice_codes: ["MA-DENSE-NOTICE"], supplemental_cost_share_waiver_threshold_cents: 5000, followup_grace_days: 60, report_turnaround_days: 30, urgent_report_turnaround_days: 7, ce_grace_days: 90 }
              as: AccreditationBodyReviewer
              as_user_id: "reviewer-1"
              captures: { pol_ma_id: $.data.id }
            - *c_fac
            - *c_unit
            - *c_phys
            - *c_tech
            - *c_rad
            - call: "POST /exams"
              payload: { unit_id: "${unit_id}", technologist_id: "${tech_id}", patient_ref: "PT-3001", patient_state_code: "CT", exam_type: "SCREENING", performed_at: "2026-07-20T00:00:00Z", original_image_count: 4 }
              as: Technologist
              as_user_id: "${tech_id}"
              captures: { cov_ct_exam_id: $.data.id }
            - call: "POST /exams/${cov_ct_exam_id}/interpret"
              payload: { birads_assessment: 1, density_category: "C" }
              as: InterpretingPhysician
              as_user_id: "${rad_id}"
            - call: "POST /exams/${cov_ct_exam_id}/supplemental-orders"
              payload: { modality: "ULTRASOUND", recommendation_note: "Dense breasts, supplemental US" }
              as: InterpretingPhysician
              as_user_id: "${rad_id}"
              captures: { cov_ct_order_id: $.data.id }
            - call: "POST /exams"
              payload: { unit_id: "${unit_id}", technologist_id: "${tech_id}", patient_ref: "PT-3002", patient_state_code: "MA", exam_type: "SCREENING", performed_at: "2026-07-21T00:00:00Z", original_image_count: 4 }
              as: Technologist
              as_user_id: "${tech_id}"
              captures: { cov_ma_exam_id: $.data.id }
            - call: "POST /exams/${cov_ma_exam_id}/interpret"
              payload: { birads_assessment: 1, density_category: "C" }
              as: InterpretingPhysician
              as_user_id: "${rad_id}"
            - call: "POST /exams/${cov_ma_exam_id}/supplemental-orders"
              payload: { modality: "ULTRASOUND", recommendation_note: "Dense breasts, supplemental US" }
              as: InterpretingPhysician
              as_user_id: "${rad_id}"
              captures: { cov_ma_order_id: $.data.id }
          trigger:
            - call: "POST /supplemental-orders/${cov_ct_order_id}/coverage-determination"
              payload: {}
              as: AccreditationCoordinator
              as_user_id: "coord-1"
            - call: "POST /supplemental-orders/${cov_ma_order_id}/coverage-determination"
              payload: {}
              as: AccreditationCoordinator
              as_user_id: "coord-1"
          assert:
            - "SupplementalScreeningOrder.${cov_ct_order_id}.governing_state_code == \"CT\""
            - "SupplementalScreeningOrder.${cov_ct_order_id}.allowed_amount_cents == 31500 and coverage_tier == TIER_1"
            - "SupplementalScreeningOrder.${cov_ct_order_id}.covered_amount_cents == 31500 and patient_responsibility_cents == 0"
            - "SupplementalScreeningOrder.${cov_ct_order_id}.coverage_outcome == COVERED_NO_COST_SHARE"
            - "SupplementalScreeningOrder.${cov_ma_order_id}.governing_state_code == \"MA\""
            - "SupplementalScreeningOrder.${cov_ma_order_id}.allowed_amount_cents == 31500 and coverage_tier == TIER_1"
            - "SupplementalScreeningOrder.${cov_ma_order_id}.covered_amount_cents == 19373 and patient_responsibility_cents == 12127"
            - "SupplementalScreeningOrder.${cov_ma_order_id}.coverage_outcome == COVERED_WITH_COST_SHARE"
            - "Both orders carry coverage_tier TIER_1 even though only the MA order actually bills the tier rate"
  # ===========================================================================
  - rule_id: combinatorial_formula
    instances:

      - name: notification_nested_min_of_state_federal_and_urgent_ceilings
        grounds:
          - calculations.notification_requirement_selection
          - calculations.governing_policy_resolution
          - entities.NotificationLetter.fields.reading_grade_level
          - entities.NotificationLetter.fields.deadline_at
          - entities.NotificationLetter.fields.required_notice_codes
          - entities.StatePolicy.fields.lay_summary_max_reading_grade
        distinguishing_aspect: |
          MODE (a) — nested min/max with conditional branches over five inputs:
          reading_grade_level = min(policy 10, FEDERAL 8) = 8 and
          deadline_days = min(min(policy 21, FEDERAL 30), URGENT 7) = 7, so the
          state's looser grade ceiling is discarded while the state's tighter
          21-day deadline is itself overridden by the urgent 7-day floor; a
          single-level min or a state-wins rule produces grade 10 or a 21-day
          deadline instead.
        test_recipe:
          setup:
            - "Logical clock at 2026-08-01T00:00:00Z; CT policy with lay_summary_max_reading_grade 10, lay_summary_deadline_days 21, density_notice_rule STATE_ENHANCED_ALL, required_notice_codes [CT-DENS-1, CT-SUPP-2]."
            - "Facility with home policy CT, one DBT_3D unit, qualified staff."
            - "One SCREENING exam for a CT-resident patient, interpreted BI-RADS 0 with density_category C, so the finding is both dense and urgent; notification_status is PENDING and no letter exists yet."
          setup_api_calls:
            - *c_clock
            - *c_pol_ct
            - *c_fac
            - *c_unit
            - *c_phys
            - *c_tech
            - *c_rad
            - call: "POST /exams"
              payload: { unit_id: "${unit_id}", technologist_id: "${tech_id}", patient_ref: "PT-4001", patient_state_code: "CT", exam_type: "SCREENING", performed_at: "2026-07-25T00:00:00Z", original_image_count: 4 }
              as: Technologist
              as_user_id: "${tech_id}"
              captures: { nl_exam_id: $.data.id }
            - call: "POST /exams/${nl_exam_id}/interpret"
              payload: { birads_assessment: 0, density_category: "C" }
              as: InterpretingPhysician
              as_user_id: "${rad_id}"
              captures: { nl_exam_v: $.data.version }
          trigger:
            - call: "POST /exams/${nl_exam_id}/notification-letters"
              payload: { expected_exam_version: "${nl_exam_v}", dispatch_channel: "MAIL" }
              as: AccreditationCoordinator
              as_user_id: "coord-1"
              captures: { nl_letter_id: $.data.id }
          assert:
            - "NotificationLetter.${nl_letter_id}.reading_grade_level == 8"
            - "NotificationLetter.${nl_letter_id}.deadline_at == \"2026-08-08T00:00:00Z\""
            - "NotificationLetter.${nl_letter_id}.letter_type == COMBINED"
            - "NotificationLetter.${nl_letter_id}.density_statement_code == FDA_DENSE"
            - "NotificationLetter.${nl_letter_id}.required_notice_codes == [\"FDA-LAY-SUMMARY\", \"FDA-DENSE\", \"FDA-URGENT-FINDING\", \"CT-DENS-1\", \"CT-SUPP-2\"]"
            - "NotificationLetter.${nl_letter_id}.governing_state_code == \"CT\""
            - "NotificationLetter.${nl_letter_id}.status == QUEUED and supersedes_letter_id == null"
            - "Exam.${nl_exam_id}.notification_deadline_at == \"2026-08-08T00:00:00Z\""
            - "Exam.${nl_exam_id}.notification_status == GENERATED"

      - name: recall_rate_pooled_across_units_then_rounded_once
        grounds:
          - calculations.radiologist_audit_metrics
          - entities.RadiologistAuditCycle.fields.recall_rate_pct
          - entities.RadiologistAuditCycle.fields.abnormal_interpretation_flag
          - state_machines.RadiologistAuditCycle.status.OPEN_to_LOCKED
        distinguishing_aspect: |
          MODE (b) — nested rounding whose order is observable: the radiologist's
          three in-scope screening exams are split 1 recall / 1 exam on the
          DBT_3D unit and 0 recalls / 2 exams on the DM_2D unit, so pooling the
          numerators and denominators first and rounding once yields 33.33,
          whereas rounding each unit's rate first (100.00 and 0.00) and then
          averaging yields 50.00.
        test_recipe:
          setup:
            - "Logical clock at 2026-08-01T00:00:00Z; CT policy, facility, qualified staff."
            - "Two units at the same facility: a DBT_3D unit and a DM_2D unit."
            - "Three SCREENING exams read by the same radiologist inside [2026-01-01, 2026-07-15): one BI-RADS 0 on the DBT_3D unit, and BI-RADS 1 plus BI-RADS 2 on the DM_2D unit. No biopsies anywhere."
            - "One OPEN RadiologistAuditCycle over that period; the clock is already past period_end."
          setup_api_calls:
            - *c_clock
            - *c_pol_ct
            - *c_fac
            - *c_unit
            - &c_unit2
              call: "POST /facilities/${fac_id}/units"
              payload: { manufacturer: "GE", model_serial: "PRI-2200", modality: "DM_2D", accreditation_expires_on: "2027-09-30T00:00:00Z" }
              as: AccreditationCoordinator
              as_user_id: "coord-1"
              captures: { unit2_id: $.data.id }
            - *c_phys
            - *c_tech
            - *c_rad
            - call: "POST /exams"
              payload: { unit_id: "${unit_id}", technologist_id: "${tech_id}", patient_ref: "PT-5001", patient_state_code: "CT", exam_type: "SCREENING", performed_at: "2026-02-01T00:00:00Z", original_image_count: 4 }
              as: Technologist
              as_user_id: "${tech_id}"
              captures: { pool_e1_id: $.data.id }
            - call: "POST /exams/${pool_e1_id}/interpret"
              payload: { birads_assessment: 0, density_category: "C" }
              as: InterpretingPhysician
              as_user_id: "${rad_id}"
            - call: "POST /exams"
              payload: { unit_id: "${unit2_id}", technologist_id: "${tech_id}", patient_ref: "PT-5002", patient_state_code: "CT", exam_type: "SCREENING", performed_at: "2026-03-01T00:00:00Z", original_image_count: 4 }
              as: Technologist
              as_user_id: "${tech_id}"
              captures: { pool_e2_id: $.data.id }
            - call: "POST /exams/${pool_e2_id}/interpret"
              payload: { birads_assessment: 1, density_category: "B" }
              as: InterpretingPhysician
              as_user_id: "${rad_id}"
            - call: "POST /exams"
              payload: { unit_id: "${unit2_id}", technologist_id: "${tech_id}", patient_ref: "PT-5003", patient_state_code: "CT", exam_type: "SCREENING", performed_at: "2026-04-01T00:00:00Z", original_image_count: 4 }
              as: Technologist
              as_user_id: "${tech_id}"
              captures: { pool_e3_id: $.data.id }
            - call: "POST /exams/${pool_e3_id}/interpret"
