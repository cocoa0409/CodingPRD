- rule_id: non_linear_state_machine
  instances:
  - name: credit_program_renewal_cycle_with_failed_round_arm
    grounds:
    - state_machines.CreditProgram.transitions.RENEWAL_NEGOTIATION_to_WINDING_DOWN
    - state_machines.CreditProgram.transitions.RENEWAL_NEGOTIATION_to_ACTIVE
    - concurrency_rules[renewal-round-stale-program]
    distinguishing_aspect: CreditProgram is not a forward pipeline — RENEWAL_NEGOTIATION forks to ACTIVE (renewal rescued) or to WINDING_DOWN (renewal failed), and WINDING_DOWN can only complete once a WindDownTransfer has COMPLETED, so the program's terminal state depends on a sibling entity's state.
    test_recipe:
      setup:
      - Logical clock at 2026-09-01T00:00:00Z. One ACTIVE program.
      setup_api_calls:
      - call: POST /servicing/partners
        payload:
          retailer_name: Kestrel Outfitters
          loyalty_program_code: KESTREL
        as: ProgramAdmin
        captures:
          p_id: $.data.id
      - call: POST /servicing/agreements
        payload:
          partner_id: ${p_id}
          revenue_share_rate: 0.15
          promo_subsidy_rate: 0.2
          promo_term_months: 18
        as: ProgramAdmin
        captures:
          ag_id: $.data.id
          ag_v0: $.data.version
      - call: POST /servicing/agreements/${ag_id}/open-negotiation
        payload: {}
        as: ProgramAdmin
        captures:
          ag_v_neg: $.data.version
      - call: POST /servicing/agreements/${ag_id}/execute
        payload:
          expected_agreement_version: ${ag_v_neg}
        as: ProgramAdmin
      - call: POST /servicing/credit-programs
        payload:
          partner_id: ${p_id}
          agreement_id: ${ag_id}
          cycle_day: 1
        as: ProgramAdmin
        captures:
          g_id: $.data.id
          g_v0: $.data.version
      - call: POST /servicing/_clock/set_current_utc
        payload:
          to_iso8601: '2026-09-01T00:00:00Z'
        as: ProgramAdmin
      trigger:
      - call: POST /servicing/credit-programs/${g_id}/open-renewal
        payload:
          expected_program_version: ${g_v0}
          to_status: RENEWAL_NEGOTIATION
        as: ProgramAdmin
        captures:
          g_v1: $.data.version
      - call: POST /servicing/credit-programs/${g_id}/open-renewal
        payload:
          expected_program_version: ${g_v1}
          to_status: WINDING_DOWN
        as: ProgramAdmin
        captures:
          g_status: $.data.program_status
          g_v2: $.data.version
      assert:
      - CreditProgram.${g_id}.program_status == WINDING_DOWN
      - CreditProgram.${g_id}.version == 3
      - the same trigger POST /credit-programs/{id}/open-renewal produced RENEWAL_NEGOTIATION then WINDING_DOWN — RENEWAL_NEGOTIATION is not a one-way gate
      - POST /servicing/credit-programs/${g_id}/close with expected_program_version ${g_v2} returns ERR_INVALID_STATE (no COMPLETED transfer yet)
  - name: transaction_posted_disputed_cyclic_reversal
    grounds:
    - state_machines.Transaction.transitions.POSTED_to_DISPUTED
    - state_machines.Transaction.transitions.DISPUTED_to_POSTED
    - state_machines.DisputeCase.transitions.UNDER_REVIEW_to_RESOLVED_FAVOR_MERCHANT
    distinguishing_aspect: 'Transaction is cyclic and non-terminal: POSTED -> DISPUTED -> POSTED is legal, and the second leg recomputes PromoPlan.subsidy_at_risk_cents back up from 0, so the cycle is observable in both the transaction status and the exposure rollup.'
    test_recipe:
      setup:
      - Logical clock at 2026-09-01T00:00:00Z. One program, one account, one promo purchase (120000/12mo) with a PromoPlan whose subsidy_at_risk_cents is 5756.
      setup_api_calls:
      - call: POST /servicing/partners
        payload:
          retailer_name: Orlin Furnishings
          loyalty_program_code: ORLIN
        as: ProgramAdmin
        captures:
          p_id: $.data.id
      - call: POST /servicing/agreements
        payload:
          partner_id: ${p_id}
          revenue_share_rate: 0.12
          promo_subsidy_rate: 0.3
          promo_term_months: 12
        as: ProgramAdmin
        captures:
          ag_id: $.data.id
          ag_v0: $.data.version
      - call: POST /servicing/agreements/${ag_id}/open-negotiation
        payload: {}
        as: ProgramAdmin
        captures:
          ag_v_neg: $.data.version
      - call: POST /servicing/agreements/${ag_id}/execute
        payload:
          expected_agreement_version: ${ag_v_neg}
        as: ProgramAdmin
      - call: POST /servicing/credit-programs
        payload:
          partner_id: ${p_id}
          agreement_id: ${ag_id}
          cycle_day: 12
        as: ProgramAdmin
        captures:
          g_id: $.data.id
      - call: POST /servicing/_clock/set_current_utc
        payload:
          to_iso8601: '2026-09-01T00:00:00Z'
        as: ProgramAdmin
      - call: POST /servicing/applications
        payload:
          program_id: ${g_id}
          source_channel: IN_STORE
          requested_credit_limit_cents: 300000
        as: ProgramAdmin
        captures:
          app_id: $.data.id
      - call: POST /servicing/applications/${app_id}/decide
        payload: {}
        as: Underwriter
      - call: GET /servicing/accounts?program_id=${g_id}
        payload: {}
        as: ProgramAdmin
        captures:
          acct_id: $.data[0].id
      - call: POST /servicing/transactions
        payload:
          account_id: ${acct_id}
          merchant_name: Orlin Sofas
          amount_cents: 120000
          transaction_channel: IN_STORE
          promo_requested: true
          promo_term_months: 12
        as: Cardholder
        as_user_id: ${acct_id}
        captures:
          tx_id: $.data.id
      - call: GET /servicing/promo-plans?transaction_id=${tx_id}
        payload: {}
        as: ProgramAdmin
        captures:
          pp_id: $.data[0].id
      trigger:
      - call: POST /servicing/disputes
        payload:
          transaction_id: ${tx_id}
          account_id: ${acct_id}
          dispute_reason: GOODS_NOT_RECEIVED
        as: CardholderService
        captures:
          d_id: $.data.id
      - call: POST /servicing/disputes/${d_id}/review
        payload: {}
        as: CardholderService
      - call: POST /servicing/disputes/${d_id}/resolve
        payload:
          resolution_outcome: MERCHANT
        as: CardholderService
        captures:
          tx_status: $.data.case_status
      assert:
      - Transaction.${tx_id}.transaction_status == POSTED
      - GET /servicing/promo-plans?transaction_id=${tx_id} returns plan_status ACTIVE with subsidy_at_risk_cents == 5756
      - GET /servicing/credit-programs/${g_id}/summary free_look_exposure_cents == 5756
      - the exposed Transaction reached POSTED by three distinct triggers (creation, MERCHANT resolution, and would be CARDHOLDER resolution)
- rule_id: transitive_cascade
  instances:
  - name: cardholder_dispute_three_hop_exposure_cascade
    grounds:
    - state_machines.DisputeCase.transitions.UNDER_REVIEW_to_RESOLVED_FAVOR_CARDHOLDER
    - state_machines.Transaction.transitions.POSTED_to_DISPUTED
    - state_machines.BenefitPosting.transitions.POSTED_to_REVERSED
    - entities.CreditProgram.fields.free_look_exposure_cents
    distinguishing_aspect: A single dispute resolution walks three causal hops — dispute -> BenefitPosting clawback -> Account.linked_loyalty_balance reversal — each link caused by the previous one, not by a fan-out from the resolution.
    test_recipe:
      setup:
      - Logical clock at 2026-09-01T00:00:00Z. One program, one account with a 120000 promo purchase and a PURCHASE_EARN benefit posting of 1200 points, so Account.linked_loyalty_balance is 1200.
      setup_api_calls:
      - call: POST /servicing/partners
        payload:
          retailer_name: Pallane Beauty
          loyalty_program_code: PALLANE_PLUS
          loyalty_link_enabled: true
        as: ProgramAdmin
        captures:
          p_id: $.data.id
      - call: POST /servicing/agreements
        payload:
