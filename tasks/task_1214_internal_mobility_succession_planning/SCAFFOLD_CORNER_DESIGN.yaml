  - section: calculations
    instances:
      - name: readiness_score_without_plan_is_rating_half_only
        claim_type: correct_result
        grounds: [calculations.readiness_score]
        distinguishing_aspect: "With no development plan, plan_pct is 0: a STRONG successor's readiness_score is 0.5*80 + 0 = 40.00, proving the absent-plan branch of the blend."
        test_recipe:
          setup: ["ACTIVE role with one DRAFT entry for a STRONG employee; no plan created"]
          setup_api_calls:
            - { call: "POST /talent/employees", payload: { employee_code: "HRPB80", full_name: "Hana Rbp", department: "HR", job_level: 7, hire_date: "2020-01-15", performance_rating: "STRONG" }, as: HRAdmin, captures: { hrbp: $.data.id } }
