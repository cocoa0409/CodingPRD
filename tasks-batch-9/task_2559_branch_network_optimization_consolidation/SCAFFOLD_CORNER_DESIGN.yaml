          - validations.priority_24_ERR_TRANSITION_CAMPAIGN_NOT_LAUNCHED
        distinguishing_aspect: "The customer-communication gate is the only execute-closure precondition satisfied by a row that does not exist yet in the happy path: with the notice period elapsed and a property disposition on file, the closure is still refused until a campaign reaches LAUNCHED, and the very next execute call succeeds once one does."
