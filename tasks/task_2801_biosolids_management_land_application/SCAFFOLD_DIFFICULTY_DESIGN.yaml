          Closing one application sets off four dependent hops: the ledger write (0.1793 kg/ha)
          causes the site re-sum, the re-sum causes the site restriction because 0.1793 >=
          0.90 * 0.19 = 0.1710, and the restriction causes the sibling SCHEDULED event to defer.
