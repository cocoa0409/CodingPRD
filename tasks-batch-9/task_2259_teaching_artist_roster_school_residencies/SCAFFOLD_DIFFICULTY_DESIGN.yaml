  # ===========================================================================
  - rule_id: non_linear_state_machine
    instances:

      - name: artist_vetting_and_roster_axes_evolve_independently
        grounds:
          - state_machines.TeachingArtist.vetting_status.SCREENING_PENDING_to_CLEARED
          - state_machines.TeachingArtist.roster_status.ACTIVE_to_SUSPENDED
          - state_machines.TeachingArtist.roster_status.SUSPENDED_to_ACTIVE
          - entities.TeachingArtist.fields.vetting_status
          - entities.TeachingArtist.fields.roster_status
        distinguishing_aspect: |
          One TeachingArtist row carries two independent axes: roster_status walks
          ACTIVE → SUSPENDED → ACTIVE while vetting_status stays pinned at CLEARED
          across both moves, and clearance_status stays CLEARED throughout — the
          roster axis never rewrites the recruitment axis.
        test_recipe:
          setup:
