      - name: compliance_run_sweeps_pending_cycle_to_missed
        claim_type: side_effect_execution
        grounds:
          - state_machines.RefreshCycle.PENDING_to_MISSED
          - endpoints[POST /compliance/plan-years/{id}/compliance-runs]
          - calculations.penalty_accrual_posting
          - calculations.plan_year_compliance_posture
        distinguishing_aspect: "The ops checkpoint is what turns a PENDING cycle past its deadline into MISSED (CASCADE-C): one run at 2027-07-08T09:00:00Z reports cycles_missed_count 1 and accruals_posted_count 1, posts an MRF_REFRESH accrual of 10000 x 3 days x 2.0 = 60000 with onset_date 2027-07-06 (deadline date + 1), and lifts the plan year to 3 points / AT_RISK. Nothing happens without the run — the sweep is not lazy-evaluated on read."
        test_recipe:
          setup:
            - "ACTIVE PlanYear PY2027, covered_lives 6000 (multiplier 2.0), with one PENDING RefreshCycle for 2027-06 (deadline_at 2027-07-05T23:59:59.999Z) and no published files."
            - "Clock advanced to 2027-07-08T09:00:00Z; ledger empty; deficiency_points 0; posture COMPLIANT."
          setup_api_calls:
            - call: "POST /compliance/_clock/set_current_utc"
              payload: { current_utc: "2027-06-01T09:00:00Z" }
              as: PlatformOperator
            - call: "POST /compliance/plan-years"
              payload: { sponsor_name: "Meridian Manufacturing Benefit Plan", plan_year_label: "PY2027", start_date: "2027-01-01", end_date: "2027-12-31", covered_lives: 6000, attestation_deadline_date: "2028-01-31", rxdc_deadline_date: "2028-06-01" }
              as: PlanSponsorAdmin
              captures: { py: "$.data.id" }
            - call: "POST /compliance/vendors"
              payload: { legal_name: "Cascade Health Administrators", vendor_type: "TPA", contact_email: "ops@cascade.example" }
              as: PlanSponsorAdmin
              captures: { v_tpa: "$.data.id" }
            - call: "POST /compliance/contracts"
              payload: { plan_year_id: "${py}", vendor_id: "${v_tpa}", contract_type: "TPA", term_start: "2027-01-01", term_end: "2028-01-01", annual_fee_cents: 48000000 }
              as: PlanSponsorAdmin
            - call: "POST /compliance/plan-years/${py}/activate"
              payload: {}
              as: PlanSponsorAdmin
            - call: "POST /compliance/refresh-cycles"
              payload: { plan_year_id: "${py}", period_month: "2027-06", period_start: "2027-06-01", period_end: "2027-06-30" }
              as: ComplianceOfficer
              as_user_id: "officer-1"
              captures: { rc: "$.data.id" }
            - call: "POST /compliance/_clock/set_current_utc"
              payload: { current_utc: "2027-07-08T09:00:00Z" }
              as: PlatformOperator
          trigger:
            - call: "POST /compliance/plan-years/${py}/compliance-runs"
              payload: {}
              as: PlatformOperator
          assert:
            - "response HTTP status == 200 with data.cycles_missed_count == 1, data.accruals_posted_count == 1, data.amendments_lapsed_count == 0, data.posture_before == \"COMPLIANT\", data.posture_after == \"AT_RISK\", data.deficiency_points == 3, data.penalty_exposure_cents == 60000"
            - "GET /compliance/refresh-cycles/${rc} -> data.status == \"MISSED\", data.on_time == null, data.certified_at == null"
            - "GET /compliance/penalty-ledger-entries?plan_year_id=${py} -> exactly 1 entry with deficiency_type \"MRF_REFRESH\", onset_date \"2027-07-06\", days_open 3, daily_rate_cents 10000, size_multiplier 2.0, signed_amount_cents 60000, posted_by_user_id null"
            - "GET /compliance/plan-years/${py} -> data.deficiency_points == 3, data.compliance_posture == \"AT_RISK\", data.penalty_exposure_cents == 60000, data.last_compliance_run_at == \"2027-07-08T09:00:00Z\""

      - name: attestation_branch_side_effects_diverge
        claim_type: side_effect_execution
        grounds:
          - state_machines.Attestation.SUBMITTED_to_REJECTED
          - state_machines.Attestation.SUBMITTED_to_ACCEPTED
        excluded_because:
          difficulty_instance: non_linear_state_machine / attestation_reject_and_accept_branch_side_effect_divergence
          rationale: "That §1.8 instance walks SUBMITTED -> REJECTED (ATTESTATION_LATE accrual, +5 points) -> DRAFT -> SUBMITTED -> ACCEPTED and asserts the divergent side-effect sets plus the surviving single ledger entry."

