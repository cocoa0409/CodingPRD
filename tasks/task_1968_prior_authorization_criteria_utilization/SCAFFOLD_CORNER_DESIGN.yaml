          trigger:
            - { call: "POST /um/appeals/${ap}/begin-review", payload: {}, as: AppealsReviewer, as_user_id: "u-ar-1", captures: { st: $.data.status, rev: $.data.reviewer_id } }
          assert:
            - "st == IN_REVIEW and rev == u-ar-1"
            - "ap_due == 2026-08-31T00:00:00.000Z (received 2026-08-01 + 720h appeal SLA)"

      - name: md_send_back_cycle_corner
        claim_type: valid_transition
        grounds: [state_machines.PriorAuthRequest.ESCALATED_MD_to_PENDED_REVIEW]
        excluded_because:
          difficulty_instance: request_escalation_send_back_cycle
          rationale: "The ESCALATED_MD -> PENDED_REVIEW cycle, including escalated_by_user_id clearing, is asserted end-to-end by the named §1.8 instance."

      - name: guideline_retire_from_draft_succeeds
        claim_type: valid_transition
        grounds: [state_machines.GuidelineVersion.DRAFT_to_RETIRED]
        distinguishing_aspect: "DRAFT -> RETIRED is a valid direct transition (never-published versions can be retired without the in-flight check, which only guards PUBLISHED versions)."
        test_recipe:
          setup: ["Criteria set with one DRAFT guideline version"]
          setup_api_calls:
            - { call: "POST /um/criteria-sets", payload: { name: "Draft Retire Set", line_of_business: "MEDICARE", service_category: "DME" }, as: ClinicalPolicyEditor, captures: { cs_id: $.data.id, cs_v: $.data.version } }
            - { call: "POST /um/criteria-sets/${cs_id}/guideline-versions", payload: { version_label: "0.1", content: "draft", auto_approve_eligible: false, effective_from: "2026-01-01T00:00:00Z" }, as: ClinicalPolicyEditor, captures: { gv: $.data.id } }
          trigger:
            - { call: "POST /um/guideline-versions/${gv}/transition", payload: { to_status: "RETIRED", expected_criteria_set_version: "${cs_v}" }, as: ClinicalPolicyEditor, captures: { st: $.data.status } }
          assert:
            - "st == RETIRED (retire from DRAFT requires no in-flight check)"

