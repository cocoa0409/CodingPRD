        grounds:
          - calculations.advertising_disclosure_findings
          - validations[priority=22]
          - errors[ERR_AD_DISCLOSURE_INCOMPLETE]
        distinguishing_aspect: |
          RADIO_SCRIPT_MAX_CHARS 300 is a strict `>` comparison: a 300-character RADIO script
          produces disclosure_findings [] and can be APPROVED, while the same script with one
          extra character (301) produces exactly ["RADIO_SCRIPT_TOO_LONG"] and the APPROVE
          decision is rejected 422 ERR_AD_DISCLOSURE_INCOMPLETE. Both scripts disclose NMLS
          2200001 and licence CA-DFPI-70001, so no other finding can fire.
        test_recipe:
          setup:
            - "Originator 2200001 with an ACTIVE CA licence CA-DFPI-70001 (so no NO_LICENSE_CA
               finding is possible)."
            - "Advertisement A: medium RADIO, target_state_codes [\"CA\"], content_text is the
               300-character script (the sentence below WITHOUT its trailing period)."
            - "Advertisement B: medium RADIO, same disclosures, content_text is the identical
               script WITH the trailing period, i.e. 301 characters."
