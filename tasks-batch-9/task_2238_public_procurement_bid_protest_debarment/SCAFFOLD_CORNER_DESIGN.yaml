              as: SystemAdmin
              as_user_id: "U-ADMIN-1"
          trigger:
            - call: "POST /procurement/debarment-proceedings/${c_d65_id}/hearing"
              payload: { hearing_summary: "attempting the default branch on the deadline instant" }
              as: DebarmentAuthority
              as_user_id: "U-DEBAR-1"
          assert:
            - "HTTP 409 with $.data.error_id == ERR_DEBARMENT_HEARING_RIGHTS_NOT_EXHAUSTED"
