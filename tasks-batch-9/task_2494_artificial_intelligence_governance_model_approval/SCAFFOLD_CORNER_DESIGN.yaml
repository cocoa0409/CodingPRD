# SCAFFOLD_CORNER_DESIGN.yaml
# Task 2494 - Artificial Intelligence Governance & Model Approval
#
# Breadth probe over the nine sections of references/claim-extraction-guide.md.
# Every numeric literal in an `assert:` line was computed from the SCAFFOLD.yaml
# formulas by code before being written down.
#
# Standard actors (identity is opaque; headers are self-asserted):
#   usr_req_1   Requester            usr_legal_1 LegalReviewer
#   usr_priv_1  PrivacyReviewer      usr_sec_1   SecurityReviewer
#   usr_biz_1   BusinessReviewer     usr_gov_1   GovernanceOfficer
#   usr_gov_2   GovernanceOfficer (second officer)   usr_req_2 Requester (second)
# The logical clock is pinned at the head of every recipe.
#
# Two reusable chains are referenced by name in `setup:` prose and always spelled
# out in full in `setup_api_calls`:
#   MIN chain  - a MINIMAL-tier use case (LOW / ADVISORY / PUBLIC / reach 500,
#                no jurisdictions) scoring 10; REQUIRED_GATES[MINIMAL] = [BUSINESS];
#                REQUIRED_EVALS[MINIMAL] = [].
#   LITE chain - a LIMITED-tier use case (MATERIAL / HUMAN_IN_LOOP / CONFIDENTIAL /
#                reach 5000, jurisdictions []) scoring 49 bound to a FIRST-PARTY
#                asset; REQUIRED_GATES[LIMITED] = [PRIVACY, BUSINESS];
#                REQUIRED_EVALS[LIMITED] = [BIAS]. Empty jurisdictions make the
#                PRIVACY disclosure precondition vacuous and first-party hosting
#                makes the vendor-assessment precondition vacuous, which is what
#                keeps the approval chain short enough to reuse.
#
# Error-code coverage map (all 39 codes in SCAFFOLD.yaml 1.6 are triggerable):
#   ERR_UNAUTHENTICATED                  -> validations / unauthenticated_precedes_not_found
#   ERR_UNAUTHORIZED                     -> rbac / requester_cannot_classify_forbidden,
#                                           rbac / business_reviewer_cannot_approve_forbidden
#   ERR_USE_CASE_NOT_FOUND               -> entities / use_case_unknown_id_not_found
#   ERR_MODEL_ASSET_NOT_FOUND            -> errors / model_asset_unknown_id_not_found
#   ERR_REVIEW_GATE_NOT_FOUND            -> errors / review_gate_unknown_id_not_found
#   ERR_GOVERNANCE_RECORD_NOT_FOUND      -> errors / test_evaluation_unknown_id_not_found
#   ERR_INVALID_REQUEST                  -> entities / use_case_create_missing_jurisdictions_rejected,
#                                           entities / use_case_create_invalid_enum_autonomy_rejected
#   ERR_STALE_USE_CASE_VERSION           -> cross_cutting_layers (both concurrency_rules entries)
#   ERR_USE_CASE_TERMINAL                -> state_machines / rejected_use_case_is_terminal_and_locked
#   ERR_USE_CASE_NOT_IN_DRAFT            -> state_machines / classify_twice_invalid_not_in_draft
#   ERR_GATE_NOT_IN_REVIEWABLE_STATE     -> state_machines / start_review_on_cleared_gate_invalid,
#                                           errors / issue_conditions_on_pending_gate_invalid
#   ERR_USE_CASE_NOT_READY_FOR_APPROVAL  -> errors stub (1.8 state_precedes_business_referential_on_approve)
#   ERR_REASSESSMENT_NOT_DUE             -> errors / complete_reassessment_while_approved_not_due
#   ERR_ASSESSMENT_ALREADY_DECIDED       -> errors / oversight_design_decided_twice_already_decided
#   ERR_EVALUATION_NOT_PLANNED           -> errors / evaluation_completed_twice_not_planned
#   ERR_INCIDENT_NOT_ACTIONABLE          -> errors / resolve_open_incident_not_actionable
#   ERR_SHADOW_NOT_ACTIONABLE            -> errors / grant_grace_twice_shadow_not_actionable
#   ERR_NOTICE_ALREADY_WITHDRAWN         -> state_machines / withdraw_notice_twice_already_withdrawn
#   ERR_MODEL_ASSET_NOT_APPROVED_FOR_USE -> errors / approve_for_use_twice_asset_not_approvable
#                                           + errors stub (1.8 binding_creation_depends_on_model_asset_status)
#   ERR_PROHIBITED_USE_CASE              -> errors / prohibited_band_use_case_cannot_take_binding
#   ERR_BIAS_EVALUATION_FAILED           -> errors stub (1.8 business_safety_precedes_business_fiscal_on_approve)
#   ERR_REQUIRED_EVALUATION_MISSING      -> errors stub (1.8 security_gate_clear_depends_on_evaluation_row_status)
#   ERR_OVERSIGHT_DESIGN_NOT_APPROVED    -> errors / approve_without_oversight_design_rejected
#   ERR_OVERSIGHT_DESIGN_INADEQUATE      -> validations / oversight_design_two_points_short_violation
#   ERR_SEGREGATION_OF_DUTIES            -> rbac / requester_cannot_clear_own_gate_sod,
#                                           rbac / clearing_reviewer_cannot_sign_the_approval_sod
#   ERR_GATE_ROLE_MISMATCH               -> rbac / privacy_reviewer_cannot_open_business_gate_mismatch
#   ERR_MODEL_BINDING_MISSING            -> errors / approve_without_pinned_binding_rejected
#   ERR_MODEL_BINDING_STALE              -> errors stub (1.8 state_precedes_business_referential_on_approve)
#   ERR_VENDOR_ASSESSMENT_NOT_ACCEPTED   -> errors / grade_d_assessment_cannot_approve_asset_for_use
#   ERR_RETENTION_TERMS_UNDOCUMENTED     -> errors / documented_terms_without_retention_days_rejected
#   ERR_SHADOW_LINK_MISMATCH             -> errors / shadow_link_to_use_case_without_matching_binding
#   ERR_DISCLOSURE_NOT_PUBLISHED         -> validations / privacy_gate_clear_without_eu_notice_violation
#   ERR_DISCLOSURE_WINDOW_CONFLICT       -> errors stub (1.8 disclosure_notice_windows_closed_with_quiet_buffer_per_jurisdiction)
#   ERR_EVALUATION_WINDOW_CONFLICT       -> errors stub (1.8 evaluation_windows_half_open_on_shared_model_asset)
#   ERR_REGULATOR_REPORT_REQUIRED        -> errors / sev1_resolve_without_regulator_report_rejected
#   ERR_GRACE_PERIOD_ELAPSED             -> errors / grant_grace_after_deadline_elapsed
#   ERR_GRACE_EXTENSION_EXCEEDED         -> errors / grant_grace_thirty_one_days_exceeded
#   ERR_APPROVAL_EXPIRED                 -> errors / complete_reassessment_after_expiry_rejected
#   ERR_PORTFOLIO_REACH_CAP_EXCEEDED     -> errors stub (1.8 business_safety_precedes_business_fiscal_on_approve)

scaffold_corner_design:

  # ===========================================================================
  # 1. ENTITIES
  # ===========================================================================
  - section: entities
    instances:

      - name: use_case_intake_creation_persists_declared_fields
        claim_type: creation
        grounds: [entities.UseCase, "endpoints[POST /use-cases]", entities.UseCase.fields.status]
        distinguishing_aspect: "POST /use-cases returns 201 with every declared intake field echoed verbatim, status DRAFT and version 1; nothing about risk is computed at intake time."
        test_recipe:
          setup: ["Empty database with the logical clock pinned to 2026-08-01T00:00:00Z."]
          setup_api_calls:
            - {call: "POST /_clock/set_current_utc", payload: {current_utc: "2026-08-01T00:00:00Z"}, as: GovernanceOfficer, as_user_id: "usr_gov_1"}
          trigger:
            - {call: "POST /use-cases", payload: {title: "Support ticket triage assistant", business_unit: "Support", description: "ranks inbound tickets and drafts a first reply for agent sign-off", affects_individuals: true, decision_autonomy: "HUMAN_IN_LOOP", data_sensitivity: "CONFIDENTIAL", individual_impact: "MATERIAL", jurisdictions: [], deployed_headcount_reach: 5000}, as: Requester, as_user_id: "usr_req_1", captures: {uc: "$.data.id", uc_v1: "$.data.version"}}
          assert:
            - "HTTP 201; response_type == object and meta.api_request_id is present"
            - "UseCase.id is non-empty, UseCase.version == 1, created_at == 2026-08-01T00:00:00Z"
            - "title == 'Support ticket triage assistant', business_unit == 'Support', affects_individuals == true, decision_autonomy == HUMAN_IN_LOOP, data_sensitivity == CONFIDENTIAL, individual_impact == MATERIAL, jurisdictions == [], deployed_headcount_reach == 5000"
            - "status == DRAFT and predecessor_use_case_id == null"

      - name: use_case_computed_risk_fields_default_before_classify
        claim_type: defaults
        grounds: [entities.UseCase.fields.risk_score, entities.UseCase.fields.monitoring_posture, entities.UseCase.fields.reassessment_status]
        distinguishing_aspect: "Every computed and system field of a freshly created UseCase holds exactly its declared default: risk_score/risk_tier/final_risk_score/final_risk_tier/control_credit/vendor_penalty null, required_gate_types [], counters 0, monitoring_posture HEALTHY, safety_flag false, reassessment_status NOT_SCHEDULED."
        test_recipe:
          setup: ["Create the LITE use case and read it back without classifying it."]
          setup_api_calls:
            - {call: "POST /_clock/set_current_utc", payload: {current_utc: "2026-08-01T00:00:00Z"}, as: GovernanceOfficer, as_user_id: "usr_gov_1"}
            - {call: "POST /use-cases", payload: {title: "Support ticket triage assistant", business_unit: "Support", description: "ranks inbound tickets and drafts a first reply for agent sign-off", affects_individuals: true, decision_autonomy: "HUMAN_IN_LOOP", data_sensitivity: "CONFIDENTIAL", individual_impact: "MATERIAL", jurisdictions: [], deployed_headcount_reach: 5000}, as: Requester, as_user_id: "usr_req_1", captures: {uc: "$.data.id"}}
          trigger:
            - {call: "GET /use-cases/{id}", payload: {}, as: GovernanceOfficer, as_user_id: "usr_gov_1"}
          assert:
            - "classification_stale == false and classification_cycle_index == 0"
            - "risk_score == null, risk_tier == null, required_gate_types == []"
            - "final_risk_score == null, final_risk_tier == null, control_credit == null, vendor_penalty == null"
            - "open_conditions_count == 0 and cleared_gate_count == 0"
            - "monitoring_posture == HEALTHY and safety_flag == false"
            - "approved_at == null, approved_by_user_id == null, approval_expires_at == null, reassessment_interval_days == null, reassessment_due_at == null"
            - "reassessment_cycle_index == 0 and reassessment_status == NOT_SCHEDULED"
            - "rejection_reason == null, revoked_at == null, revocation_reason == null"

      - name: use_case_requester_user_id_is_system_assigned_extra_field_ignored
        claim_type: system_fields
        grounds: [entities.UseCase.fields.requester_user_id, entities.UseCase.fields.status]
        distinguishing_aspect: "requester_user_id is taken from the X-User-ID header, never from the body: a body that also carries requester_user_id and status is accepted with those two keys ignored."
        test_recipe:
          setup: ["Empty database; clock pinned. The intake body deliberately carries two fields that are not in the endpoint's input list."]
          setup_api_calls:
            - {call: "POST /_clock/set_current_utc", payload: {current_utc: "2026-08-01T00:00:00Z"}, as: GovernanceOfficer, as_user_id: "usr_gov_1"}
          trigger:
            - {call: "POST /use-cases", payload: {title: "Payroll anomaly flagger", business_unit: "Finance", description: "flags payroll runs that deviate from the trailing mean", affects_individuals: true, decision_autonomy: "ADVISORY", data_sensitivity: "CONFIDENTIAL", individual_impact: "LOW", jurisdictions: [], deployed_headcount_reach: 800, requester_user_id: "usr_impostor_9", status: "APPROVED"}, as: Requester, as_user_id: "usr_req_1"}
          assert:
            - "HTTP 201"
            - "requester_user_id == 'usr_req_1' (the header value), NOT 'usr_impostor_9'"
            - "status == DRAFT, NOT APPROVED - the unlisted body key is ignored rather than honoured"
            - "approved_at == null and approved_by_user_id == null"

      - name: use_case_business_unit_not_editable_input_ignored
        claim_type: immutability
        grounds: ["endpoints[PATCH /use-cases/{id}]", entities.UseCase.fields.business_unit]
        distinguishing_aspect: "PATCH /use-cases/{id} declares no business_unit input, so a body carrying both title and business_unit updates title only and leaves business_unit at its intake value."
        test_recipe:
          setup: ["Create the LITE use case as usr_req_1 and leave it in DRAFT."]
          setup_api_calls:
            - {call: "POST /_clock/set_current_utc", payload: {current_utc: "2026-08-01T00:00:00Z"}, as: GovernanceOfficer, as_user_id: "usr_gov_1"}
            - {call: "POST /use-cases", payload: {title: "Support ticket triage assistant", business_unit: "Support", description: "ranks inbound tickets and drafts a first reply for agent sign-off", affects_individuals: true, decision_autonomy: "HUMAN_IN_LOOP", data_sensitivity: "CONFIDENTIAL", individual_impact: "MATERIAL", jurisdictions: [], deployed_headcount_reach: 5000}, as: Requester, as_user_id: "usr_req_1", captures: {uc: "$.data.id"}}
          trigger:
            - {call: "PATCH /use-cases/{id}", payload: {title: "Support ticket triage copilot", business_unit: "Platform"}, as: Requester, as_user_id: "usr_req_1"}
          assert:
            - "HTTP 200"
            - "title == 'Support ticket triage copilot'"
            - "business_unit == 'Support', NOT 'Platform'"
            - "classification_stale == true (the edit invalidates any classification) and version == 2"

      - name: model_asset_listing_pagination_and_created_at_ordering
        claim_type: listing
        grounds: ["endpoints[GET /model-assets]", response_envelope.pagination_defaults]
        distinguishing_aspect: "Three assets registered in a known order page as 2 + 1 under limit=2, with total_count 3, has_more true then false, and rows ordered created_at ASC."
        test_recipe:
          setup: ["Register three ModelAssets in a fixed order at three distinct clock instants so created_at ASC is unambiguous."]
          setup_api_calls:
            - {call: "POST /_clock/set_current_utc", payload: {current_utc: "2026-08-01T00:00:00Z"}, as: GovernanceOfficer, as_user_id: "usr_gov_1"}
            - {call: "POST /model-assets", payload: {provider: "Internal ML Platform", model_name: "helios-mini", model_version: "1.0.0", hosting: "INTERNAL", modality: "TEXT", is_third_party: false}, as: GovernanceOfficer, as_user_id: "usr_gov_1", captures: {a1: "$.data.id"}}
            - {call: "POST /_clock/set_current_utc", payload: {current_utc: "2026-08-01T01:00:00Z"}, as: GovernanceOfficer, as_user_id: "usr_gov_1"}
            - {call: "POST /model-assets", payload: {provider: "Northwind AI", model_name: "nw-adjudicate", model_version: "3.2.0", hosting: "VENDOR_API", modality: "TEXT", is_third_party: true}, as: GovernanceOfficer, as_user_id: "usr_gov_1", captures: {a2: "$.data.id"}}
            - {call: "POST /_clock/set_current_utc", payload: {current_utc: "2026-08-01T02:00:00Z"}, as: GovernanceOfficer, as_user_id: "usr_gov_1"}
            - {call: "POST /model-assets", payload: {provider: "Cartwright Labs", model_name: "cl-summarize", model_version: "1.4.1", hosting: "ON_PREM", modality: "MULTIMODAL", is_third_party: true}, as: GovernanceOfficer, as_user_id: "usr_gov_1", captures: {a3: "$.data.id"}}
          trigger:
            - {call: "GET /model-assets", payload: {limit: 2, offset: 0}, as: GovernanceOfficer, as_user_id: "usr_gov_1", captures: {first_id: "$.data[0].id"}}
            - {call: "GET /model-assets", payload: {limit: 2, offset: 2}, as: GovernanceOfficer, as_user_id: "usr_gov_1"}
            - {call: "GET /model-assets", payload: {is_third_party: true}, as: GovernanceOfficer, as_user_id: "usr_gov_1"}
          assert:
            - "first page: response_type == array, 2 rows, total_count == 3, limit == 2, offset == 0, has_more == true"
            - "first page row 0 is the helios-mini asset and row 1 is the nw-adjudicate asset (created_at ASC)"
            - "second page: 1 row (cl-summarize), total_count == 3, offset == 2, has_more == false"
            - "the is_third_party=true filter returns exactly 2 rows (nw-adjudicate, cl-summarize) with total_count == 2"
            - "every returned asset carries status == REGISTERED, vendor_terms_grade == null, active_binding_count == 0, enforced_shadow_count == 0"

      - name: use_case_unknown_id_not_found
        claim_type: not_found
        grounds: ["errors[ERR_USE_CASE_NOT_FOUND]", "validations[p3]"]
        distinguishing_aspect: "GET /use-cases/uc_missing_404 returns 404 ERR_USE_CASE_NOT_FOUND with the error envelope, not an empty object."
        test_recipe:
          setup: ["Empty database; clock pinned. No UseCase row exists with the id used in the trigger."]
          setup_api_calls:
            - {call: "POST /_clock/set_current_utc", payload: {current_utc: "2026-08-01T00:00:00Z"}, as: GovernanceOfficer, as_user_id: "usr_gov_1"}
          trigger:
            - {call: "GET /use-cases/{id}", payload: {}, as: GovernanceOfficer, as_user_id: "usr_gov_1", captures: {err: "$.data.error_id"}}
          assert:
            - "the {id} segment is the literal 'uc_missing_404', which resolves to no row"
            - "HTTP 404, response_type == error, data.error_id == ERR_USE_CASE_NOT_FOUND"
            - "data.message is a non-empty string and meta.api_request_id is present"

      - name: use_case_create_missing_jurisdictions_rejected
        claim_type: required_fields
        grounds: ["errors[ERR_INVALID_REQUEST]", "validations[p8]", entities.UseCase.fields.jurisdictions]
        distinguishing_aspect: "jurisdictions is a required input even though the empty array is a legal value, so omitting the key entirely is a 400 ERR_INVALID_REQUEST rather than a defaulted []."
        test_recipe:
          setup: ["Empty database; clock pinned."]
          setup_api_calls:
            - {call: "POST /_clock/set_current_utc", payload: {current_utc: "2026-08-01T00:00:00Z"}, as: GovernanceOfficer, as_user_id: "usr_gov_1"}
          trigger:
            - {call: "POST /use-cases", payload: {title: "Support ticket triage assistant", business_unit: "Support", description: "ranks inbound tickets", affects_individuals: true, decision_autonomy: "HUMAN_IN_LOOP", data_sensitivity: "CONFIDENTIAL", individual_impact: "MATERIAL", deployed_headcount_reach: 5000}, as: Requester, as_user_id: "usr_req_1", captures: {err: "$.data.error_id"}}
          assert:
            - "HTTP 400 with data.error_id == ERR_INVALID_REQUEST"
            - "no UseCase row is created: a following GET /use-cases returns total_count == 0"

      - name: use_case_create_invalid_enum_autonomy_rejected
        claim_type: type_constraints
        grounds: ["errors[ERR_INVALID_REQUEST]", entities.UseCase.fields.decision_autonomy]
        distinguishing_aspect: "decision_autonomy == 'SEMI_AUTOMATED' is outside the declared set {ADVISORY, HUMAN_IN_LOOP, HUMAN_ON_LOOP, FULLY_AUTOMATED} and is rejected 400 before any scoring runs."
        test_recipe:
          setup: ["Empty database; clock pinned."]
          setup_api_calls:
            - {call: "POST /_clock/set_current_utc", payload: {current_utc: "2026-08-01T00:00:00Z"}, as: GovernanceOfficer, as_user_id: "usr_gov_1"}
          trigger:
            - {call: "POST /use-cases", payload: {title: "Support ticket triage assistant", business_unit: "Support", description: "ranks inbound tickets", affects_individuals: true, decision_autonomy: "SEMI_AUTOMATED", data_sensitivity: "CONFIDENTIAL", individual_impact: "MATERIAL", jurisdictions: [], deployed_headcount_reach: 5000}, as: Requester, as_user_id: "usr_req_1", captures: {err: "$.data.error_id"}}
          assert:
            - "HTTP 400 with data.error_id == ERR_INVALID_REQUEST"
            - "no UseCase row and no ClassificationSnapshot row is created"

      - name: classification_snapshot_records_every_point_contribution
        claim_type: computed_fields
        grounds: [entities.ClassificationSnapshot, calculations.risk_classification_score, "endpoints[GET /use-cases/{id}/classification-snapshots]"]
        distinguishing_aspect: "The MIN use case's INTAKE_PROVISIONAL snapshot decomposes its score field by field: impact 10, autonomy 0, sensitivity 0, reach 0, jurisdiction 0, base 10, risk_score 10, tier MINIMAL, forced_prohibited false, cycle_index 1."
        test_recipe:
          setup: ["MIN chain: create the MINIMAL-tier use case (LOW impact, ADVISORY autonomy, PUBLIC sensitivity, reach 500, no jurisdictions) and classify it once."]
          setup_api_calls:
            - {call: "POST /_clock/set_current_utc", payload: {current_utc: "2026-08-01T00:00:00Z"}, as: GovernanceOfficer, as_user_id: "usr_gov_1"}
            - {call: "POST /use-cases", payload: {title: "Internal wiki search reranker", business_unit: "IT", description: "reranks internal wiki hits for staff searches", affects_individuals: false, decision_autonomy: "ADVISORY", data_sensitivity: "PUBLIC", individual_impact: "LOW", jurisdictions: [], deployed_headcount_reach: 500}, as: Requester, as_user_id: "usr_req_1", captures: {uc_m: "$.data.id", ucm_v1: "$.data.version"}}
            - {call: "POST /use-cases/{id}/classify", payload: {expected_use_case_version: "${ucm_v1}"}, as: GovernanceOfficer, as_user_id: "usr_gov_1", captures: {ucm_v2: "$.data.version"}}
          trigger:
            - {call: "GET /use-cases/{id}/classification-snapshots", payload: {}, as: GovernanceOfficer, as_user_id: "usr_gov_1"}
          assert:
            - "exactly 1 row; variant == INTAKE_PROVISIONAL and cycle_index == 1"
            - "impact_points == 10, autonomy_points == 0, sensitivity_points == 0, reach_points == 0 (500 is below the 1000 band), jurisdiction_points == 0"
            - "base_score == 10, vendor_penalty == 0, control_credit == 0, cleared_gate_count == 0, passed_eval_count == 0"
            - "risk_score == 10, risk_tier == MINIMAL, forced_prohibited == false"
            - "computed_at == 2026-08-01T00:00:00Z and use_case_id is the MIN use case id"

      - name: review_gates_listing_is_scoped_to_its_parent_use_case
        claim_type: parent_relationships
        grounds: [entities.ReviewGate.fields.use_case_id, "endpoints[GET /use-cases/{id}/review-gates]"]
        distinguishing_aspect: "With one MINIMAL use case (1 BUSINESS gate) and one LIMITED use case (PRIVACY + BUSINESS gates) both classified, GET /use-cases/{minimal}/review-gates returns exactly 1 row and never leaks the other use case's 2 gates."
        test_recipe:
          setup: ["Classify the MIN use case (1 gate) and then the LITE use case (2 gates), so three ReviewGate rows exist across two parents."]
          setup_api_calls:
            - {call: "POST /_clock/set_current_utc", payload: {current_utc: "2026-08-01T00:00:00Z"}, as: GovernanceOfficer, as_user_id: "usr_gov_1"}
            - {call: "POST /use-cases", payload: {title: "Internal wiki search reranker", business_unit: "IT", description: "reranks internal wiki hits for staff searches", affects_individuals: false, decision_autonomy: "ADVISORY", data_sensitivity: "PUBLIC", individual_impact: "LOW", jurisdictions: [], deployed_headcount_reach: 500}, as: Requester, as_user_id: "usr_req_1", captures: {uc_m: "$.data.id", ucm_v1: "$.data.version"}}
            - {call: "POST /use-cases/{id}/classify", payload: {expected_use_case_version: "${ucm_v1}"}, as: GovernanceOfficer, as_user_id: "usr_gov_1", captures: {ucm_v2: "$.data.version"}}
            - {call: "POST /use-cases", payload: {title: "Support ticket triage assistant", business_unit: "Support", description: "ranks inbound tickets and drafts a first reply for agent sign-off", affects_individuals: true, decision_autonomy: "HUMAN_IN_LOOP", data_sensitivity: "CONFIDENTIAL", individual_impact: "MATERIAL", jurisdictions: [], deployed_headcount_reach: 5000}, as: Requester, as_user_id: "usr_req_1", captures: {uc_l: "$.data.id", ucl_v1: "$.data.version"}}
            - {call: "POST /use-cases/{id}/classify", payload: {expected_use_case_version: "${ucl_v1}"}, as: GovernanceOfficer, as_user_id: "usr_gov_1", captures: {ucl_v2: "$.data.version"}}
          trigger:
            - {call: "GET /use-cases/{id}/review-gates", payload: {}, as: GovernanceOfficer, as_user_id: "usr_gov_1", captures: {gm: "$.data[0].id"}}
          assert:
            - "the {id} segment is the MIN use case: exactly 1 row, total_count == 1"
            - "that row has gate_type == BUSINESS, status == PENDING, pinned_risk_tier == MINIMAL, pinned_classification_index == 1, use_case_id == the MIN use case id"
            - "control_debt_index == 0.00, open_condition_count == 0, conditions == [], assigned_reviewer_user_id == null, cleared_by_user_id == null"
            - "GET /use-cases/{uc_l}/review-gates returns 2 rows in canonical order PRIVACY then BUSINESS, both with pinned_risk_tier == LIMITED"

  # ===========================================================================
  # 2. STATE MACHINES
  # ===========================================================================
  - section: state_machines
    instances:

      - name: use_case_initial_state_is_draft_with_no_children
        claim_type: initial_state
        grounds: [state_machines.UseCase.initial_state, entities.ReviewGate, entities.ClassificationSnapshot]
        distinguishing_aspect: "A newly created UseCase sits in the declared initial state DRAFT and owns zero ReviewGate and zero ClassificationSnapshot rows - gates and snapshots are created by classify, never by intake."
        test_recipe:
          setup: ["Create the LITE use case; do not classify."]
          setup_api_calls:
            - {call: "POST /_clock/set_current_utc", payload: {current_utc: "2026-08-01T00:00:00Z"}, as: GovernanceOfficer, as_user_id: "usr_gov_1"}
            - {call: "POST /use-cases", payload: {title: "Support ticket triage assistant", business_unit: "Support", description: "ranks inbound tickets and drafts a first reply for agent sign-off", affects_individuals: true, decision_autonomy: "HUMAN_IN_LOOP", data_sensitivity: "CONFIDENTIAL", individual_impact: "MATERIAL", jurisdictions: [], deployed_headcount_reach: 5000}, as: Requester, as_user_id: "usr_req_1", captures: {uc: "$.data.id"}}
          trigger:
            - {call: "GET /use-cases/{id}/review-gates", payload: {}, as: GovernanceOfficer, as_user_id: "usr_gov_1"}
            - {call: "GET /use-cases/{id}/classification-snapshots", payload: {}, as: GovernanceOfficer, as_user_id: "usr_gov_1"}
          assert:
            - "GET /use-cases/{uc} reports status == DRAFT"
            - "the review-gates listing returns 0 rows with total_count == 0"
            - "the classification-snapshots listing returns 0 rows with total_count == 0"

      - name: classify_moves_draft_to_under_review_and_opens_tier_gates
        claim_type: valid_transition
        grounds: [state_machines.UseCase.transitions.DRAFT_to_UNDER_REVIEW, calculations.risk_classification_score, "endpoints[POST /use-cases/{id}/classify]"]
        distinguishing_aspect: "classify on the LITE use case scores 49, bands it LIMITED, moves DRAFT -> UNDER_REVIEW, sets required_gate_types to exactly [PRIVACY, BUSINESS] and creates those two gates PENDING in that canonical order."
        test_recipe:
          setup: ["Create the LITE use case (MATERIAL 25 + HUMAN_IN_LOOP 8 + CONFIDENTIAL 14 + reach 5000 -> 2 + no jurisdictions 0 = 49)."]
          setup_api_calls:
            - {call: "POST /_clock/set_current_utc", payload: {current_utc: "2026-08-01T00:00:00Z"}, as: GovernanceOfficer, as_user_id: "usr_gov_1"}
            - {call: "POST /use-cases", payload: {title: "Support ticket triage assistant", business_unit: "Support", description: "ranks inbound tickets and drafts a first reply for agent sign-off", affects_individuals: true, decision_autonomy: "HUMAN_IN_LOOP", data_sensitivity: "CONFIDENTIAL", individual_impact: "MATERIAL", jurisdictions: [], deployed_headcount_reach: 5000}, as: Requester, as_user_id: "usr_req_1", captures: {uc: "$.data.id", uc_v1: "$.data.version"}}
          trigger:
            - {call: "POST /use-cases/{id}/classify", payload: {expected_use_case_version: "${uc_v1}"}, as: GovernanceOfficer, as_user_id: "usr_gov_1", captures: {uc_v2: "$.data.version"}}
          assert:
            - "HTTP 200; status == UNDER_REVIEW"
            - "risk_score == 49 and risk_tier == LIMITED"
            - "required_gate_types == [PRIVACY, BUSINESS]"
            - "classification_cycle_index == 1, classification_stale == false, version == 2"
            - "final_risk_score is still null and final_risk_tier is still null - classify writes only the provisional pair"
            - "GET /use-cases/{uc}/review-gates returns 2 rows: row 0 gate_type PRIVACY status PENDING, row 1 gate_type BUSINESS status PENDING, both pinned_risk_tier LIMITED and pinned_classification_index 1"
            - "rejection_reason == null and no GovernanceLedgerEntry row exists for this use case"

      - name: reclassification_voids_the_previous_cycle_gates_and_opens_a_new_set
        claim_type: side_effect_execution
        grounds: [state_machines.ReviewGate.transitions.PENDING_to_VOIDED, state_machines.UseCase.transitions.DRAFT_to_DRAFT, entities.ReviewGate.fields.pinned_classification_index]
        distinguishing_aspect: "Editing the LITE intake to reach 12000 and re-classifying leaves the cycle-1 gates VOIDED with control_debt_index 0.00 and creates two brand-new PENDING gates stamped pinned_classification_index 2, while classification_cycle_index becomes 2 and a second snapshot is appended."
        test_recipe:
          setup: ["Create and classify the LITE use case (cycle 1, score 49), then PATCH deployed_headcount_reach to 12000 (which returns it to DRAFT and stales the classification), then classify again (cycle 2, reach band 4, score 51)."]
          setup_api_calls:
            - {call: "POST /_clock/set_current_utc", payload: {current_utc: "2026-08-01T00:00:00Z"}, as: GovernanceOfficer, as_user_id: "usr_gov_1"}
            - {call: "POST /use-cases", payload: {title: "Support ticket triage assistant", business_unit: "Support", description: "ranks inbound tickets and drafts a first reply for agent sign-off", affects_individuals: true, decision_autonomy: "HUMAN_IN_LOOP", data_sensitivity: "CONFIDENTIAL", individual_impact: "MATERIAL", jurisdictions: [], deployed_headcount_reach: 5000}, as: Requester, as_user_id: "usr_req_1", captures: {uc: "$.data.id", uc_v1: "$.data.version"}}
            - {call: "POST /use-cases/{id}/classify", payload: {expected_use_case_version: "${uc_v1}"}, as: GovernanceOfficer, as_user_id: "usr_gov_1", captures: {uc_v2: "$.data.version"}}
            - {call: "GET /use-cases/{id}/review-gates", payload: {}, as: GovernanceOfficer, as_user_id: "usr_gov_1", captures: {g1_priv: "$.data[0].id", g1_biz: "$.data[1].id"}}
            - {call: "PATCH /use-cases/{id}", payload: {deployed_headcount_reach: 12000}, as: Requester, as_user_id: "usr_req_1", captures: {uc_v3: "$.data.version"}}
          trigger:
            - {call: "POST /use-cases/{id}/classify", payload: {expected_use_case_version: "${uc_v3}"}, as: GovernanceOfficer, as_user_id: "usr_gov_1", captures: {uc_v4: "$.data.version"}}
          assert:
            - "after the PATCH the use case is back in DRAFT with classification_stale == true and both cycle-1 gates are VOIDED"
            - "after the trigger: status == UNDER_REVIEW, classification_cycle_index == 2, classification_stale == false, risk_score == 51, risk_tier == LIMITED"
            - "GET /use-cases/{uc}/review-gates returns 4 rows: the two cycle-1 gates with status VOIDED, control_debt_index 0.00 and pinned_classification_index 1, plus two new PENDING gates with pinned_classification_index 2"
            - "the cycle-1 gate ids g1_priv and g1_biz are unchanged rows - they are voided in place, not deleted"
            - "GET /use-cases/{uc}/classification-snapshots returns 2 rows, both variant INTAKE_PROVISIONAL, cycle_index 1 with risk_score 49 and cycle_index 2 with risk_score 51 (reach_points 2 then 4)"
            - "cleared_gate_count == 0 and open_conditions_count == 0"

      - name: classify_twice_invalid_not_in_draft
        claim_type: invalid_transitions
        grounds: ["errors[ERR_USE_CASE_NOT_IN_DRAFT]", "validations[p11]", state_machines.UseCase.transitions.DRAFT_to_UNDER_REVIEW]
        distinguishing_aspect: "A second classify on an UNDER_REVIEW use case is refused 409 ERR_USE_CASE_NOT_IN_DRAFT, and classification_cycle_index stays 1 - re-classification is only reachable through a PATCH back to DRAFT."
        test_recipe:
          setup: ["Create and classify the LITE use case so it is UNDER_REVIEW at version 2."]
          setup_api_calls:
            - {call: "POST /_clock/set_current_utc", payload: {current_utc: "2026-08-01T00:00:00Z"}, as: GovernanceOfficer, as_user_id: "usr_gov_1"}
            - {call: "POST /use-cases", payload: {title: "Support ticket triage assistant", business_unit: "Support", description: "ranks inbound tickets and drafts a first reply for agent sign-off", affects_individuals: true, decision_autonomy: "HUMAN_IN_LOOP", data_sensitivity: "CONFIDENTIAL", individual_impact: "MATERIAL", jurisdictions: [], deployed_headcount_reach: 5000}, as: Requester, as_user_id: "usr_req_1", captures: {uc: "$.data.id", uc_v1: "$.data.version"}}
            - {call: "POST /use-cases/{id}/classify", payload: {expected_use_case_version: "${uc_v1}"}, as: GovernanceOfficer, as_user_id: "usr_gov_1", captures: {uc_v2: "$.data.version"}}
          trigger:
            - {call: "POST /use-cases/{id}/classify", payload: {expected_use_case_version: "${uc_v2}"}, as: GovernanceOfficer, as_user_id: "usr_gov_1", captures: {err: "$.data.error_id"}}
          assert:
            - "HTTP 409 with data.error_id == ERR_USE_CASE_NOT_IN_DRAFT"
            - "the expected version supplied is current, so this is a state rejection and NOT ERR_STALE_USE_CASE_VERSION"
            - "classification_cycle_index is still 1, version is still 2 and the review-gates listing still returns exactly 2 rows"

      - name: rejected_use_case_is_terminal_and_locked
        claim_type: terminal_state_lockdown
        grounds: ["errors[ERR_USE_CASE_TERMINAL]", "validations[p10]", state_machines.UseCase.terminal_states]
        distinguishing_aspect: "A use case classified into the forced-PROHIBITED branch lands in the terminal state REJECTED, and a later PATCH by its own requester is refused 409 ERR_USE_CASE_TERMINAL rather than being treated as an ordinary DRAFT edit."
        test_recipe:
          setup: ["Create a use case that satisfies PROHIBITED_COMBINATION in full (affects_individuals true, CONSEQUENTIAL, FULLY_AUTOMATED, SPECIAL_CATEGORY; base score 94) and classify it, which forces the DRAFT -> REJECTED branch."]
          setup_api_calls:
            - {call: "POST /_clock/set_current_utc", payload: {current_utc: "2026-08-01T00:00:00Z"}, as: GovernanceOfficer, as_user_id: "usr_gov_1"}
            - {call: "POST /use-cases", payload: {title: "Automated dismissal decision engine", business_unit: "HR", description: "issues final dismissal decisions from performance and health records with no human in the path", affects_individuals: true, decision_autonomy: "FULLY_AUTOMATED", data_sensitivity: "SPECIAL_CATEGORY", individual_impact: "CONSEQUENTIAL", jurisdictions: [], deployed_headcount_reach: 500}, as: Requester, as_user_id: "usr_req_1", captures: {uc_p: "$.data.id", ucp_v1: "$.data.version"}}
            - {call: "POST /use-cases/{id}/classify", payload: {expected_use_case_version: "${ucp_v1}"}, as: GovernanceOfficer, as_user_id: "usr_gov_1", captures: {ucp_v2: "$.data.version"}}
          trigger:
            - {call: "PATCH /use-cases/{id}", payload: {decision_autonomy: "HUMAN_IN_LOOP"}, as: Requester, as_user_id: "usr_req_1", captures: {err: "$.data.error_id"}}
          assert:
            - "after classify: status == REJECTED, risk_tier == PROHIBITED, risk_score == 94, rejection_reason == PROHIBITED_COMBINATION, required_gate_types == []"
            - "the snapshot carries forced_prohibited == true and no ReviewGate row was created"
            - "exactly one GovernanceLedgerEntry exists with entry_type == CLASSIFICATION_REJECTED, reach_delta == 0 and debt_delta == 0.00"
            - "the trigger returns HTTP 409 with data.error_id == ERR_USE_CASE_TERMINAL"
            - "decision_autonomy is still FULLY_AUTOMATED and version is unchanged after the refused PATCH"

      - name: start_review_on_cleared_gate_invalid
        claim_type: precondition_enforcement
        grounds: ["errors[ERR_GATE_NOT_IN_REVIEWABLE_STATE]", "validations[p12]", state_machines.ReviewGate.transitions.PENDING_to_IN_REVIEW]
        distinguishing_aspect: "start-review has transitions only out of PENDING and CONDITIONS_ISSUED, so calling it on a CLEARED gate is refused 409 ERR_GATE_NOT_IN_REVIEWABLE_STATE - re-opening a cleared gate is the GovernanceOfficer's reopen action, not the reviewer's start-review."
        test_recipe:
          setup: ["MIN chain to READY_FOR_APPROVAL: create and classify the MINIMAL use case (one BUSINESS gate), then have usr_biz_1 start and clear that gate."]
          setup_api_calls:
            - {call: "POST /_clock/set_current_utc", payload: {current_utc: "2026-08-01T00:00:00Z"}, as: GovernanceOfficer, as_user_id: "usr_gov_1"}
            - {call: "POST /use-cases", payload: {title: "Internal wiki search reranker", business_unit: "IT", description: "reranks internal wiki hits for staff searches", affects_individuals: false, decision_autonomy: "ADVISORY", data_sensitivity: "PUBLIC", individual_impact: "LOW", jurisdictions: [], deployed_headcount_reach: 500}, as: Requester, as_user_id: "usr_req_1", captures: {uc_m: "$.data.id", ucm_v1: "$.data.version"}}
            - {call: "POST /use-cases/{id}/classify", payload: {expected_use_case_version: "${ucm_v1}"}, as: GovernanceOfficer, as_user_id: "usr_gov_1", captures: {ucm_v2: "$.data.version"}}
            - {call: "GET /use-cases/{id}/review-gates", payload: {}, as: GovernanceOfficer, as_user_id: "usr_gov_1", captures: {g_biz: "$.data[0].id"}}
            - {call: "POST /review-gates/{id}/start-review", payload: {}, as: BusinessReviewer, as_user_id: "usr_biz_1"}
            - {call: "POST /review-gates/{id}/clear", payload: {decision_note: "value case accepted"}, as: BusinessReviewer, as_user_id: "usr_biz_1"}
          trigger:
            - {call: "POST /review-gates/{id}/start-review", payload: {}, as: BusinessReviewer, as_user_id: "usr_biz_1", captures: {err: "$.data.error_id"}}
          assert:
            - "after the setup clear: gate status == CLEARED, cleared_by_user_id == usr_biz_1, cleared_at == 2026-08-01T00:00:00Z, debt_before_clear == 0.00, and the use case bubbled to READY_FOR_APPROVAL with cleared_gate_count == 1"
            - "the trigger returns HTTP 409 with data.error_id == ERR_GATE_NOT_IN_REVIEWABLE_STATE"
            - "gate status is still CLEARED, assigned_reviewer_user_id is unchanged and the use case is still READY_FOR_APPROVAL"

      - name: withdraw_notice_twice_already_withdrawn
        claim_type: idempotency
        grounds: ["errors[ERR_NOTICE_ALREADY_WITHDRAWN]", "validations[p19]", state_machines.DisclosureNotice.transitions.PUBLISHED_to_WITHDRAWN]
        distinguishing_aspect: "withdraw is not idempotent: the first call moves PUBLISHED -> WITHDRAWN and stamps withdrawn_at, the second is refused 409 ERR_NOTICE_ALREADY_WITHDRAWN and leaves withdrawn_at at its original instant."
        test_recipe:
          setup: ["Create a use case deployed in the EU and publish one AUTOMATED_DECISION_NOTICE for that jurisdiction, then withdraw it once at a later clock instant."]
          setup_api_calls:
            - {call: "POST /_clock/set_current_utc", payload: {current_utc: "2026-08-01T00:00:00Z"}, as: GovernanceOfficer, as_user_id: "usr_gov_1"}
            - {call: "POST /use-cases", payload: {title: "Applicant screening ranker", business_unit: "HR", description: "ranks external applicants for recruiter shortlisting", affects_individuals: true, decision_autonomy: "HUMAN_IN_LOOP", data_sensitivity: "CONFIDENTIAL", individual_impact: "MATERIAL", jurisdictions: ["EU"], deployed_headcount_reach: 5000}, as: Requester, as_user_id: "usr_req_1", captures: {uc_eu: "$.data.id"}}
            - {call: "POST /use-cases/{id}/disclosure-notices", payload: {notice_type: "AUTOMATED_DECISION_NOTICE", jurisdiction: "EU", effective_from: "2026-07-01T00:00:00Z", effective_to: "2027-07-01T00:00:00Z", locale_count: 3}, as: Requester, as_user_id: "usr_req_1", captures: {dn: "$.data.id"}}
            - {call: "POST /_clock/set_current_utc", payload: {current_utc: "2026-08-02T00:00:00Z"}, as: GovernanceOfficer, as_user_id: "usr_gov_1"}
            - {call: "POST /disclosure-notices/{id}/withdraw", payload: {}, as: Requester, as_user_id: "usr_req_1"}
          trigger:
            - {call: "POST /disclosure-notices/{id}/withdraw", payload: {}, as: GovernanceOfficer, as_user_id: "usr_gov_1", captures: {err: "$.data.error_id"}}
          assert:
            - "the notice was created with status == PUBLISHED and withdrawn_at == null"
            - "after the first withdraw: status == WITHDRAWN and withdrawn_at == 2026-08-02T00:00:00Z"
            - "the trigger returns HTTP 409 with data.error_id == ERR_NOTICE_ALREADY_WITHDRAWN"
            - "withdrawn_at is still 2026-08-02T00:00:00Z and the notice version did not advance on the refused call"

      - name: classify_fork_to_review_or_terminal_rejection
        claim_type: valid_transition
        grounds: [state_machines.UseCase.transitions.DRAFT_to_REJECTED, calculations.risk_classification_score]
        excluded_because:
          difficulty_instance: non_linear_state_machine / classify_forks_to_review_or_prohibited_terminal
          rationale: "The one-trigger two-destination fork out of DRAFT, including the ledger entry and the empty gate set on the terminal branch, is the whole subject of the named 1.8 instance."

      - name: gate_conditions_cycle_returns_to_in_review
        claim_type: valid_transition
        grounds: [state_machines.ReviewGate.transitions.CONDITIONS_ISSUED_to_IN_REVIEW, state_machines.UseCase.transitions.CHANGES_REQUESTED_to_UNDER_REVIEW]
        excluded_because:
          difficulty_instance: non_linear_state_machine / review_gate_condition_loop_traversed_twice_then_reopened
          rationale: "The IN_REVIEW -> CONDITIONS_ISSUED -> IN_REVIEW loop, its second traversal with different condition counts and the CLEARED -> IN_REVIEW reopen are all asserted by the named 1.8 instance."

  # ===========================================================================
  # 3. CALCULATIONS
  # ===========================================================================
  - section: calculations
    instances:

      - name: risk_score_counts_only_high_scrutiny_jurisdictions
        claim_type: input_set_filtering
        grounds: [calculations.risk_classification_score, entities.ClassificationSnapshot.fields.jurisdiction_points]
        distinguishing_aspect: "A use case listing four jurisdictions [EU, US_CA, US_FED, UK] scores jurisdiction_points 6, not 12: only EU, UK and US_CO are in HIGH_SCRUTINY_JURISDICTIONS, so US_CA and US_FED contribute nothing despite being legal enum members."
        test_recipe:
          setup: ["Create a use case with MATERIAL impact, ADVISORY autonomy, INTERNAL sensitivity, reach 1000 (band 2) and jurisdictions [EU, US_CA, US_FED, UK], then classify it. Expected: 25 + 0 + 6 + 2 + 6 = 39 -> LIMITED."]
          setup_api_calls:
            - {call: "POST /_clock/set_current_utc", payload: {current_utc: "2026-08-01T00:00:00Z"}, as: GovernanceOfficer, as_user_id: "usr_gov_1"}
            - {call: "POST /use-cases", payload: {title: "Multi-region marketing copy assistant", business_unit: "Marketing", description: "drafts localised campaign copy for regional review", affects_individuals: true, decision_autonomy: "ADVISORY", data_sensitivity: "INTERNAL", individual_impact: "MATERIAL", jurisdictions: ["EU", "US_CA", "US_FED", "UK"], deployed_headcount_reach: 1000}, as: Requester, as_user_id: "usr_req_1", captures: {uc_j: "$.data.id", ucj_v1: "$.data.version"}}
          trigger:
            - {call: "POST /use-cases/{id}/classify", payload: {expected_use_case_version: "${ucj_v1}"}, as: GovernanceOfficer, as_user_id: "usr_gov_1", captures: {ucj_v2: "$.data.version"}}
          assert:
            - "the snapshot has jurisdiction_points == 6 (2 matches x 3 points), NOT 12"
            - "impact_points == 25, autonomy_points == 0, sensitivity_points == 6, reach_points == 2 (1000 is exactly on the >= 1000 band edge)"
            - "base_score == 39, risk_score == 39, risk_tier == LIMITED"
            - "required_gate_types == [PRIVACY, BUSINESS]"

      - name: vendor_terms_grade_d_applies_every_declared_constant
        claim_type: constants_applied
        grounds: [calculations.vendor_terms_grade, entities.VendorModelAssessment.fields.terms_risk_points, entities.VendorModelAssessment.fields.terms_grade]
        distinguishing_aspect: "The worst-case assessment (UNDISCLOSED provenance, VENDOR_RETAINS rights, 400-day retention, no opt-out, undisclosed subprocessors) scores exactly 75 under CONSERVATIVE_LEGAL - 20 provenance + 10 undisclosed surcharge + 16 rights + 18 retention band + 6 no-opt-out + 5 subprocessors - and bands to D."
        test_recipe:
          setup: ["Register a third-party ModelAsset and submit one vendor assessment carrying the worst value of every declared input. Submission always grades under CONSERVATIVE_LEGAL, which replaces the declared 400 days with ASSUMED_WORST_RETENTION_DAYS 3650 because retention_opt_out is false."]
          setup_api_calls:
            - {call: "POST /_clock/set_current_utc", payload: {current_utc: "2026-08-01T00:00:00Z"}, as: GovernanceOfficer, as_user_id: "usr_gov_1"}
            - {call: "POST /model-assets", payload: {provider: "Grayline Models", model_name: "gl-omni", model_version: "0.9.0", hosting: "VENDOR_API", modality: "MULTIMODAL", is_third_party: true}, as: GovernanceOfficer, as_user_id: "usr_gov_1", captures: {asset_d: "$.data.id"}}
          trigger:
            - {call: "POST /model-assets/{id}/vendor-assessments", payload: {vendor_name: "Grayline Models Ltd", training_data_provenance: "UNDISCLOSED", output_rights: "VENDOR_RETAINS", retention_days: 400, retention_opt_out: false, subprocessors_disclosed: false}, as: LegalReviewer, as_user_id: "usr_legal_1", captures: {va_d: "$.data.id"}}
          assert:
            - "HTTP 201; status == SUBMITTED and terms_variant == CONSERVATIVE_LEGAL"
            - "effective_retention_days == 3650 (the declared 400 is overridden because retention_opt_out is false)"
            - "terms_risk_points == 75 and terms_grade == D"
            - "the declared inputs are stored unchanged: retention_days == 400, retention_opt_out == false, subprocessors_disclosed == false"
            - "ModelAsset.vendor_terms_grade is still null - the grade only lands on the asset when an assessment is ACCEPTED"

      - name: containment_deadline_crosses_a_month_boundary_on_minimal_tier
        claim_type: correct_result
        grounds: [calculations.incident_containment_deadline, entities.MonitoringIncident.fields.containment_deadline_at]
        distinguishing_aspect: "A SEV3 incident on a MINIMAL-tier use case gets containment_hours 108 (72 x 1.5) and a deadline of 2026-09-04T06:00:00Z from detected_at 2026-08-30T18:00:00Z - the arithmetic must roll over the end of August, and the tier used is the provisional risk_tier because final_risk_tier is still null."
        test_recipe:
          setup: ["Set the clock to 2026-08-30T20:00:00Z, create and classify the MIN use case (tier MINIMAL, final_risk_tier null), then report a SEV3 incident detected two hours earlier."]
          setup_api_calls:
            - {call: "POST /_clock/set_current_utc", payload: {current_utc: "2026-08-30T20:00:00Z"}, as: GovernanceOfficer, as_user_id: "usr_gov_1"}
            - {call: "POST /use-cases", payload: {title: "Internal wiki search reranker", business_unit: "IT", description: "reranks internal wiki hits for staff searches", affects_individuals: false, decision_autonomy: "ADVISORY", data_sensitivity: "PUBLIC", individual_impact: "LOW", jurisdictions: [], deployed_headcount_reach: 500}, as: Requester, as_user_id: "usr_req_1", captures: {uc_m: "$.data.id", ucm_v1: "$.data.version"}}
            - {call: "POST /use-cases/{id}/classify", payload: {expected_use_case_version: "${ucm_v1}"}, as: GovernanceOfficer, as_user_id: "usr_gov_1", captures: {ucm_v2: "$.data.version"}}
          trigger:
            - {call: "POST /monitoring-incidents", payload: {use_case_id: "${uc_m}", severity: "SEV3", category: "DRIFT", detected_at: "2026-08-30T18:00:00Z", summary: "relevance drift observed on long-tail queries"}, as: SecurityReviewer, as_user_id: "usr_sec_1", captures: {inc: "$.data.id"}}
          assert:
            - "HTTP 201; status == OPEN, contained_at == null, resolved_at == null, reported_to_regulator == false"
            - "containment_hours == 108 (CONTAINMENT_BASE_HOURS[SEV3] 72 x TIER_SPEED_FACTOR[MINIMAL] 1.5)"
            - "containment_deadline_at == 2026-09-04T06:00:00Z"
            - "the use case's monitoring_posture becomes WATCH and its status is still UNDER_REVIEW (the suspend cascade only fires from APPROVED or UNDER_REASSESSMENT)"

      - name: shadow_grace_deadline_overwrites_rather_than_accumulates
        claim_type: correct_result
        grounds: [calculations.shadow_grace_deadline, entities.ShadowDeployment.fields.grace_deadline_at, "endpoints[POST /shadow-deployments/{id}/grant-grace]"]
        distinguishing_aspect: "A SANDBOX shadow discovered 2026-08-01T00:00:00Z gets grace_deadline_at 2026-08-31T00:00:00Z from BASE_GRACE_DAYS 30 alone; granting 10 extra days recomputes it to discovered_at + 40 days = 2026-09-10T00:00:00Z, proving the base days are re-added rather than the previous deadline being extended."
        test_recipe:
          setup: ["Register a first-party ModelAsset and record a SANDBOX shadow deployment discovered by a network scan at 2026-08-01T00:00:00Z with no claimed use case."]
          setup_api_calls:
            - {call: "POST /_clock/set_current_utc", payload: {current_utc: "2026-08-01T00:00:00Z"}, as: GovernanceOfficer, as_user_id: "usr_gov_1"}
            - {call: "POST /model-assets", payload: {provider: "Internal ML Platform", model_name: "helios-mini", model_version: "1.0.0", hosting: "INTERNAL", modality: "TEXT", is_third_party: false}, as: GovernanceOfficer, as_user_id: "usr_gov_1", captures: {asset_s: "$.data.id"}}
            - {call: "POST /shadow-deployments", payload: {model_asset_id: "${asset_s}", environment: "SANDBOX", discovered_source: "NETWORK_SCAN", discovered_at: "2026-08-01T00:00:00Z"}, as: SecurityReviewer, as_user_id: "usr_sec_1", captures: {sd: "$.data.id"}}
          trigger:
            - {call: "POST /shadow-deployments/{id}/grant-grace", payload: {grace_days: 10}, as: GovernanceOfficer, as_user_id: "usr_gov_1"}
          assert:
            - "at creation: status == DISCOVERED, claimed_use_case_id == null, grace_days_granted == 0, grace_deadline_at == 2026-08-31T00:00:00Z"
            - "after the trigger: status == GRACE_GRANTED, grace_days_granted == 10, grace_deadline_at == 2026-09-10T00:00:00Z"
            - "the deadline is NOT 2026-09-30T00:00:00Z - the grant does not add 30 base days a second time - and NOT 2026-08-11T00:00:00Z - the base days are not discarded"
            - "ModelAsset.enforced_shadow_count is still 0 and the asset status is still REGISTERED"

      - name: monitoring_posture_counts_only_unresolved_incidents
        claim_type: input_set_filtering
        grounds: [calculations.monitoring_posture_derivation, entities.UseCase.fields.monitoring_posture]
        distinguishing_aspect: "Posture is derived from incidents in status OPEN or ESCALATED only: with one OPEN SEV3 plus one SEV1 the posture is IMPAIRED, and containing the SEV1 drops it back to WATCH even though the SEV1 row still exists and is not yet RESOLVED."
        test_recipe:
          setup: ["Create and classify the MIN use case (affects_individuals false, so no regulator report is ever required), then report a SEV3 incident and a SEV1 incident, both detected at the pinned clock instant."]
          setup_api_calls:
            - {call: "POST /_clock/set_current_utc", payload: {current_utc: "2026-08-01T00:00:00Z"}, as: GovernanceOfficer, as_user_id: "usr_gov_1"}
            - {call: "POST /use-cases", payload: {title: "Internal wiki search reranker", business_unit: "IT", description: "reranks internal wiki hits for staff searches", affects_individuals: false, decision_autonomy: "ADVISORY", data_sensitivity: "PUBLIC", individual_impact: "LOW", jurisdictions: [], deployed_headcount_reach: 500}, as: Requester, as_user_id: "usr_req_1", captures: {uc_m: "$.data.id", ucm_v1: "$.data.version"}}
            - {call: "POST /use-cases/{id}/classify", payload: {expected_use_case_version: "${ucm_v1}"}, as: GovernanceOfficer, as_user_id: "usr_gov_1", captures: {ucm_v2: "$.data.version"}}
            - {call: "POST /monitoring-incidents", payload: {use_case_id: "${uc_m}", severity: "SEV3", category: "DRIFT", detected_at: "2026-08-01T00:00:00Z", summary: "relevance drift on long-tail queries"}, as: SecurityReviewer, as_user_id: "usr_sec_1", captures: {inc3: "$.data.id"}}
            - {call: "POST /monitoring-incidents", payload: {use_case_id: "${uc_m}", severity: "SEV1", category: "HARMFUL_OUTPUT", detected_at: "2026-08-01T00:00:00Z", summary: "reranker surfaced a restricted internal document"}, as: SecurityReviewer, as_user_id: "usr_sec_1", captures: {inc1: "$.data.id"}}
          trigger:
            - {call: "POST /monitoring-incidents/{id}/contain", payload: {}, as: SecurityReviewer, as_user_id: "usr_sec_1"}
            - {call: "POST /monitoring-incidents/{id}/resolve", payload: {}, as: GovernanceOfficer, as_user_id: "usr_gov_1"}
          assert:
            - "after the SEV3 alone the use case's monitoring_posture == WATCH; after the SEV1 it is IMPAIRED"
            - "the SEV1 incident has containment_hours == 6 (4 x 1.5) and containment_deadline_at == 2026-08-01T06:00:00Z"
            - "the contain call (on inc1, now 2026-08-01T00:00:00Z <= the deadline) returns 200 with status == CONTAINED and contained_at == 2026-08-01T00:00:00Z"
            - "posture is back to WATCH immediately after contain, because CONTAINED is outside the {OPEN, ESCALATED} input set while the still-OPEN SEV3 keeps it out of HEALTHY"
            - "after resolve: the SEV1 row is RESOLVED with resolved_at == 2026-08-01T00:00:00Z and posture is still WATCH"
            - "no regulator report was required at either step because use_case.affects_individuals == false"
            - "GET /monitoring-incidents?use_case_id={uc_m}&status=OPEN returns exactly 1 row (the SEV3)"

      - name: inventory_summary_excludes_use_cases_that_were_never_approved
        claim_type: input_set_filtering
        grounds: [calculations.inventory_conserved_quantities, "endpoints[GET /inventory-summary]"]
        distinguishing_aspect: "A use case sitting in READY_FOR_APPROVAL with reach 500 contributes 0 to portfolio_approved_reach and 0 to inventory_count, because INVENTORY_STATUSES is exactly {APPROVED, UNDER_REASSESSMENT, SUSPENDED}."
        test_recipe:
          setup: ["MIN chain to READY_FOR_APPROVAL: create and classify the MINIMAL use case, then start and clear its single BUSINESS gate as usr_biz_1. No approve call is made."]
          setup_api_calls:
            - {call: "POST /_clock/set_current_utc", payload: {current_utc: "2026-08-01T00:00:00Z"}, as: GovernanceOfficer, as_user_id: "usr_gov_1"}
            - {call: "POST /use-cases", payload: {title: "Internal wiki search reranker", business_unit: "IT", description: "reranks internal wiki hits for staff searches", affects_individuals: false, decision_autonomy: "ADVISORY", data_sensitivity: "PUBLIC", individual_impact: "LOW", jurisdictions: [], deployed_headcount_reach: 500}, as: Requester, as_user_id: "usr_req_1", captures: {uc_m: "$.data.id", ucm_v1: "$.data.version"}}
            - {call: "POST /use-cases/{id}/classify", payload: {expected_use_case_version: "${ucm_v1}"}, as: GovernanceOfficer, as_user_id: "usr_gov_1", captures: {ucm_v2: "$.data.version"}}
            - {call: "GET /use-cases/{id}/review-gates", payload: {}, as: GovernanceOfficer, as_user_id: "usr_gov_1", captures: {g_biz: "$.data[0].id"}}
            - {call: "POST /review-gates/{id}/start-review", payload: {}, as: BusinessReviewer, as_user_id: "usr_biz_1"}
            - {call: "POST /review-gates/{id}/clear", payload: {decision_note: "value case accepted"}, as: BusinessReviewer, as_user_id: "usr_biz_1"}
          trigger:
            - {call: "GET /inventory-summary", payload: {}, as: GovernanceOfficer, as_user_id: "usr_gov_1"}
          assert:
            - "the use case is READY_FOR_APPROVAL with deployed_headcount_reach 500 and cleared_gate_count 1"
            - "inventory_count == 0 and portfolio_approved_reach == 0"
            - "portfolio_approved_reach_high_tier == 0"
            - "control_debt_index_total == 0.00 (the cleared gate's control_debt_index was zeroed on clear and it never carried conditions)"
            - "ledger_reach_balance == 0 and ledger_debt_balance == 0.00 - the only ledger row is the GATE_CLEARED entry with reach_delta 0 and debt_delta 0.00"
            - "open_incident_count == 0 and unapproved_shadow_count == 0"

      - name: risk_score_variant_divergence_between_intake_and_deployment
        claim_type: variant_divergence
        grounds: [calculations.risk_classification_score, calculations.approval_finalization]
        excluded_because:
          difficulty_instance: dual_variant_calc / use_case_risk_provisional_versus_deployment_final
          rationale: "The INTAKE_PROVISIONAL vs DEPLOYMENT_FINAL divergence, the six-step pinned order of approval_finalization and the resulting tier and interval swing are the entire subject of the named 1.8 instance."

      - name: vendor_terms_variant_selection_by_deciding_officer
        claim_type: variant_selection
        grounds: [calculations.vendor_terms_grade, "endpoints[POST /vendor-assessments/{id}/decide]"]
        excluded_because:
          difficulty_instance: dual_variant_calc / vendor_terms_conservative_versus_documented_variant
          rationale: "Selection of CONSERVATIVE_LEGAL vs DOCUMENTED_TERMS on the same stored row, and the C -> A regrade it produces, are asserted by the named 1.8 instance."

      - name: oversight_adequacy_nested_clamps
        claim_type: correct_result
        grounds: [calculations.oversight_adequacy_score]
        excluded_because:
          difficulty_instance: combinatorial_formula / oversight_adequacy_nested_cap_and_zero_clamp_mode_a
          rationale: "Both inner clamps binding at once, and the score landing exactly on required_adequacy_score, are asserted by the named 1.8 instance."

      - name: control_debt_rounding_order_precision
        claim_type: precision
        grounds: [calculations.control_debt_index]
        excluded_because:
          difficulty_instance: combinatorial_formula / control_debt_round_per_gate_then_sum_mode_b
          rationale: "Round-per-gate-then-sum versus sum-then-round, and the resulting one-cent difference read back through GET /inventory-summary, are asserted by the named 1.8 instance."

      - name: evaluation_threshold_exact_equality_boundary
        claim_type: precision
        grounds: [calculations.eval_threshold_profile]
        excluded_because:
          difficulty_instance: boundary_precision_check / bias_metric_and_sample_size_exactly_on_their_thresholds
          rationale: "Metric and sample-size comparisons at exact equality, one tick below and one row below are asserted by the named 1.8 instance."

      - name: containment_deadline_exact_second_boundary
        claim_type: correct_result
        grounds: [calculations.incident_containment_deadline]
        excluded_because:
          difficulty_instance: boundary_precision_check / incident_containment_deadline_at_the_exact_second
          rationale: "Containment at exactly the deadline versus one second later is asserted by the named 1.8 instance."

      - name: window_conflict_interval_semantics
        claim_type: correct_result
        grounds: [calculations.window_conflict_detection]
        excluded_because:
          difficulty_instance: resource_temporal_overlap / evaluation_windows_half_open_on_shared_model_asset
          rationale: "Half-open evaluation windows and closed disclosure windows with the quiet buffer are asserted by the two named 1.8 resource_temporal_overlap instances."

      - name: conserved_reach_and_debt_balances
        claim_type: correct_result
        grounds: [calculations.inventory_conserved_quantities]
        excluded_because:
          difficulty_instance: compensating_invariant / approve_and_revoke_conserve_portfolio_headcount_reach
          rationale: "Both conserved quantities and their ledger balances across approve/suspend/reinstate/revoke and clear/reopen are asserted by the two named 1.8 compensating_invariant instances."

  # ===========================================================================
  # 4. VALIDATIONS
  # ===========================================================================
  - section: validations
    instances:

      - name: oversight_design_two_points_short_violation
        claim_type: violation_to_error
        grounds: ["validations[p25]", "errors[ERR_OVERSIGHT_DESIGN_INADEQUATE]", calculations.oversight_adequacy_score]
        distinguishing_aspect: "A SAMPLED design with sample_pct 40, escalation_sla_hours 24 and no override scores 58 against a required 60 for LIMITED/HUMAN_IN_LOOP, so APPROVE is refused 422 ERR_OVERSIGHT_DESIGN_INADEQUATE and the row stays DRAFT."
        test_recipe:
          setup: ["Create and classify the LITE use case (49 -> LIMITED, HUMAN_IN_LOOP autonomy so REQUIRED_ADEQUACY is 60), then file a deliberately thin oversight design: mode_base 30 + sample min(30, floor(40*0.3)) = 12 + sla max(0, 20 - floor(24/6)) = 16 + override 0 = 58."]
          setup_api_calls:
            - {call: "POST /_clock/set_current_utc", payload: {current_utc: "2026-08-01T00:00:00Z"}, as: GovernanceOfficer, as_user_id: "usr_gov_1"}
            - {call: "POST /use-cases", payload: {title: "Support ticket triage assistant", business_unit: "Support", description: "ranks inbound tickets and drafts a first reply for agent sign-off", affects_individuals: true, decision_autonomy: "HUMAN_IN_LOOP", data_sensitivity: "CONFIDENTIAL", individual_impact: "MATERIAL", jurisdictions: [], deployed_headcount_reach: 5000}, as: Requester, as_user_id: "usr_req_1", captures: {uc: "$.data.id", uc_v1: "$.data.version"}}
            - {call: "POST /use-cases/{id}/classify", payload: {expected_use_case_version: "${uc_v1}"}, as: GovernanceOfficer, as_user_id: "usr_gov_1", captures: {uc_v2: "$.data.version"}}
            - {call: "POST /use-cases/{id}/oversight-designs", payload: {review_mode: "SAMPLED", sample_pct: 40, escalation_sla_hours: 24, reviewer_role: "BusinessReviewer", override_capability: false, expected_use_case_version: "${uc_v2}"}, as: Requester, as_user_id: "usr_req_1", captures: {od: "$.data.id", od_score: "$.data.adequacy_score"}}
          trigger:
            - {call: "POST /oversight-designs/{id}/decide", payload: {decision: "APPROVE"}, as: GovernanceOfficer, as_user_id: "usr_gov_1", captures: {err: "$.data.error_id"}}
          assert:
            - "the filed design has adequacy_score == 58 and required_adequacy_score == 60"
            - "the trigger returns HTTP 422 with data.error_id == ERR_OVERSIGHT_DESIGN_INADEQUATE"
            - "the design row is still status == DRAFT with decided_by_user_id == null and decided_at == null"
            - "deciding REJECT on the same row would succeed - the adequacy gate applies only to the APPROVE branch"

      - name: privacy_gate_clear_with_published_eu_notice_passes
        claim_type: satisfaction_to_pass
        grounds: ["validations[p34]", state_machines.ReviewGate.transitions.IN_REVIEW_to_CLEARED, entities.DisclosureNotice.fields.status]
        distinguishing_aspect: "With one PUBLISHED EU notice in force at the current clock instant, the PRIVACY gate of an EU-deployed use case clears 200 and appends a GATE_CLEARED ledger entry - the same call that fails 422 without the notice."
        test_recipe:
          setup: ["Create a use case deployed in the EU (MATERIAL 25 + HUMAN_IN_LOOP 8 + CONFIDENTIAL 14 + reach 5000 -> 2 + EU 3 = 52 -> LIMITED), classify it, publish an in-force EU notice, then open the PRIVACY gate as usr_priv_1."]
          setup_api_calls:
            - {call: "POST /_clock/set_current_utc", payload: {current_utc: "2026-08-01T00:00:00Z"}, as: GovernanceOfficer, as_user_id: "usr_gov_1"}
            - {call: "POST /use-cases", payload: {title: "Applicant screening ranker", business_unit: "HR", description: "ranks external applicants for recruiter shortlisting", affects_individuals: true, decision_autonomy: "HUMAN_IN_LOOP", data_sensitivity: "CONFIDENTIAL", individual_impact: "MATERIAL", jurisdictions: ["EU"], deployed_headcount_reach: 5000}, as: Requester, as_user_id: "usr_req_1", captures: {uc_eu: "$.data.id", uceu_v1: "$.data.version"}}
            - {call: "POST /use-cases/{id}/classify", payload: {expected_use_case_version: "${uceu_v1}"}, as: GovernanceOfficer, as_user_id: "usr_gov_1", captures: {uceu_v2: "$.data.version"}}
            - {call: "POST /use-cases/{id}/disclosure-notices", payload: {notice_type: "EMPLOYMENT_SCREENING_NOTICE", jurisdiction: "EU", effective_from: "2026-07-01T00:00:00Z", effective_to: "2027-07-01T00:00:00Z", locale_count: 3}, as: Requester, as_user_id: "usr_req_1", captures: {dn: "$.data.id"}}
            - {call: "GET /use-cases/{id}/review-gates", payload: {}, as: GovernanceOfficer, as_user_id: "usr_gov_1", captures: {g_priv: "$.data[0].id", g_biz: "$.data[1].id"}}
            - {call: "POST /review-gates/{id}/start-review", payload: {}, as: PrivacyReviewer, as_user_id: "usr_priv_1"}
          trigger:
            - {call: "POST /review-gates/{id}/clear", payload: {decision_note: "notice published and DPIA filed"}, as: PrivacyReviewer, as_user_id: "usr_priv_1"}
          assert:
            - "risk_score == 52 and required_gate_types == [PRIVACY, BUSINESS]"
            - "HTTP 200; the PRIVACY gate is CLEARED with cleared_by_user_id == usr_priv_1, cleared_at == 2026-08-01T00:00:00Z and control_debt_index == 0.00"
            - "the use case is still UNDER_REVIEW with cleared_gate_count == 1 - it does not bubble to READY_FOR_APPROVAL until BUSINESS clears too"
            - "exactly one GovernanceLedgerEntry exists with entry_type == GATE_CLEARED, reach_delta == 0 and debt_delta == 0.00"

      - name: privacy_gate_clear_without_eu_notice_violation
        claim_type: violation_to_error
        grounds: ["validations[p34]", "errors[ERR_DISCLOSURE_NOT_PUBLISHED]", entities.UseCase.fields.jurisdictions]
        distinguishing_aspect: "The same PRIVACY gate clear on the same EU-deployed use case with no PUBLISHED notice is refused 422 ERR_DISCLOSURE_NOT_PUBLISHED; clearing PRIVACY needs no evaluation evidence, so the failure is unambiguously the disclosure rule."
        test_recipe:
          setup: ["Same EU use case as the satisfaction case, classified and with the PRIVACY gate opened by usr_priv_1, but no DisclosureNotice is ever published."]
          setup_api_calls:
            - {call: "POST /_clock/set_current_utc", payload: {current_utc: "2026-08-01T00:00:00Z"}, as: GovernanceOfficer, as_user_id: "usr_gov_1"}
            - {call: "POST /use-cases", payload: {title: "Applicant screening ranker", business_unit: "HR", description: "ranks external applicants for recruiter shortlisting", affects_individuals: true, decision_autonomy: "HUMAN_IN_LOOP", data_sensitivity: "CONFIDENTIAL", individual_impact: "MATERIAL", jurisdictions: ["EU"], deployed_headcount_reach: 5000}, as: Requester, as_user_id: "usr_req_1", captures: {uc_eu: "$.data.id", uceu_v1: "$.data.version"}}
            - {call: "POST /use-cases/{id}/classify", payload: {expected_use_case_version: "${uceu_v1}"}, as: GovernanceOfficer, as_user_id: "usr_gov_1", captures: {uceu_v2: "$.data.version"}}
            - {call: "GET /use-cases/{id}/review-gates", payload: {}, as: GovernanceOfficer, as_user_id: "usr_gov_1", captures: {g_priv: "$.data[0].id"}}
            - {call: "POST /review-gates/{id}/start-review", payload: {}, as: PrivacyReviewer, as_user_id: "usr_priv_1"}
          trigger:
            - {call: "POST /review-gates/{id}/clear", payload: {decision_note: "attempting to clear before the notice exists"}, as: PrivacyReviewer, as_user_id: "usr_priv_1", captures: {err: "$.data.error_id"}}
          assert:
            - "HTTP 422 with data.error_id == ERR_DISCLOSURE_NOT_PUBLISHED"
            - "the gate is still IN_REVIEW with cleared_by_user_id == null and the use case is still UNDER_REVIEW with cleared_gate_count == 0"
            - "no GovernanceLedgerEntry row was appended"
            - "a notice whose window had already lapsed (effective_to before the clock) would fail identically - the rule tests in-force at now, not mere existence"

      - name: terminal_precedes_not_in_draft_on_classify
        claim_type: priority_ordering
        grounds: ["validations[p10]", "validations[p11]", "errors[ERR_USE_CASE_TERMINAL]"]
        distinguishing_aspect: "A REJECTED use case violates both p10 (terminal) and p11 (not in DRAFT) on a classify retry; the response is ERR_USE_CASE_TERMINAL 409, never ERR_USE_CASE_NOT_IN_DRAFT, because 10 < 11."
        test_recipe:
          setup: ["Create the forced-PROHIBITED use case and classify it once so it lands in the terminal REJECTED state, capturing its post-classify version so the stale-version rule at p9 cannot fire first."]
          setup_api_calls:
            - {call: "POST /_clock/set_current_utc", payload: {current_utc: "2026-08-01T00:00:00Z"}, as: GovernanceOfficer, as_user_id: "usr_gov_1"}
            - {call: "POST /use-cases", payload: {title: "Automated dismissal decision engine", business_unit: "HR", description: "issues final dismissal decisions from performance and health records with no human in the path", affects_individuals: true, decision_autonomy: "FULLY_AUTOMATED", data_sensitivity: "SPECIAL_CATEGORY", individual_impact: "CONSEQUENTIAL", jurisdictions: [], deployed_headcount_reach: 500}, as: Requester, as_user_id: "usr_req_1", captures: {uc_p: "$.data.id", ucp_v1: "$.data.version"}}
            - {call: "POST /use-cases/{id}/classify", payload: {expected_use_case_version: "${ucp_v1}"}, as: GovernanceOfficer, as_user_id: "usr_gov_1", captures: {ucp_v2: "$.data.version"}}
          trigger:
            - {call: "POST /use-cases/{id}/classify", payload: {expected_use_case_version: "${ucp_v2}"}, as: GovernanceOfficer, as_user_id: "usr_gov_1", captures: {err: "$.data.error_id"}}
          assert:
            - "HTTP 409 with data.error_id == ERR_USE_CASE_TERMINAL"
            - "the response is NOT ERR_USE_CASE_NOT_IN_DRAFT even though status != DRAFT is equally true"
            - "the response is NOT ERR_STALE_USE_CASE_VERSION - the supplied expected_use_case_version is the current one"
            - "classification_cycle_index is still 1 and no second ClassificationSnapshot was appended"

      - name: unauthenticated_precedes_not_found
        claim_type: priority_ordering
        grounds: ["validations[p1]", "validations[p3]", "errors[ERR_UNAUTHENTICATED]"]
        distinguishing_aspect: "A request with a blank X-User-ID against a non-existent use case id returns 401 ERR_UNAUTHENTICATED, not 404 ERR_USE_CASE_NOT_FOUND, because p1 precedes p3 - existence is never probed by an unauthenticated caller."
        test_recipe:
          setup: ["Empty database; clock pinned. The trigger addresses the literal id 'uc_missing_404' with a blank X-User-ID header."]
          setup_api_calls:
            - {call: "POST /_clock/set_current_utc", payload: {current_utc: "2026-08-01T00:00:00Z"}, as: GovernanceOfficer, as_user_id: "usr_gov_1"}
          trigger:
            - {call: "GET /use-cases/{id}", payload: {}, as: GovernanceOfficer, as_user_id: "", captures: {err: "$.data.error_id"}}
          assert:
            - "the request carries X-User-Role: GovernanceOfficer and a blank X-User-ID, addressing the literal id 'uc_missing_404'"
            - "HTTP 401 with data.error_id == ERR_UNAUTHENTICATED"
            - "the response is NOT ERR_USE_CASE_NOT_FOUND - authentication is resolved before existence"

  # ===========================================================================
  # 5. ENDPOINTS
  # ===========================================================================
  - section: endpoints
    instances:

      - name: model_asset_crud_surface_round_trip
        claim_type: standard_crud
        grounds: ["endpoints[POST /model-assets]", "endpoints[GET /model-assets/{id}]", "endpoints[PATCH /model-assets/{id}]", state_machines.ModelAsset.transitions.APPROVED_FOR_USE_to_APPROVED_FOR_USE]
        distinguishing_aspect: "Register -> read -> approve-for-use -> revise-in-place walks the asset from version 1 to version 3 with status APPROVED_FOR_USE throughout the last two steps, and the PATCH only overwrites the attributes actually supplied."
        test_recipe:
          setup: ["Register one first-party ModelAsset and approve it for use, which is the only status from which PATCH is declared."]
          setup_api_calls:
            - {call: "POST /_clock/set_current_utc", payload: {current_utc: "2026-08-01T00:00:00Z"}, as: GovernanceOfficer, as_user_id: "usr_gov_1"}
            - {call: "POST /model-assets", payload: {provider: "Internal ML Platform", model_name: "helios-mini", model_version: "1.0.0", hosting: "INTERNAL", modality: "TEXT", is_third_party: false}, as: GovernanceOfficer, as_user_id: "usr_gov_1", captures: {asset: "$.data.id"}}
            - {call: "POST /model-assets/{id}/approve-for-use", payload: {}, as: GovernanceOfficer, as_user_id: "usr_gov_1"}
          trigger:
            - {call: "GET /model-assets/{id}", payload: {}, as: SecurityReviewer, as_user_id: "usr_sec_1"}
            - {call: "PATCH /model-assets/{id}", payload: {model_version: "1.0.1"}, as: GovernanceOfficer, as_user_id: "usr_gov_1"}
          assert:
            - "at registration: status == REGISTERED and version == 1"
            - "after approve-for-use: status == APPROVED_FOR_USE and version == 2"
            - "the GET returns the same row to a SecurityReviewer (reads are shared across all six roles) with active_binding_count == 0 and enforced_shadow_count == 0"
            - "after the PATCH: model_version == '1.0.1', version == 3, status still APPROVED_FOR_USE"
            - "hosting is still INTERNAL and modality is still TEXT - unsupplied revisable attributes are untouched"
            - "no ModelBinding exists, so the PINNED -> STALE cascade has nothing to do and no TestEvaluation is voided"

      - name: revoke_action_on_never_approved_use_case_moves_no_reach
        claim_type: action_endpoint
        grounds: ["endpoints[POST /use-cases/{id}/revoke]", state_machines.UseCase.transitions.READY_FOR_APPROVAL_to_REVOKED, entities.GovernanceLedgerEntry.fields.reach_delta]
        distinguishing_aspect: "Revoking from READY_FOR_APPROVAL records reach_delta 0, not -500, because the use case never entered INVENTORY_STATUSES; the same action from APPROVED would record the negative reach."
        test_recipe:
          setup: ["MIN chain to READY_FOR_APPROVAL: create and classify the MINIMAL use case, then start and clear its single BUSINESS gate as usr_biz_1."]
          setup_api_calls:
            - {call: "POST /_clock/set_current_utc", payload: {current_utc: "2026-08-01T00:00:00Z"}, as: GovernanceOfficer, as_user_id: "usr_gov_1"}
            - {call: "POST /use-cases", payload: {title: "Internal wiki search reranker", business_unit: "IT", description: "reranks internal wiki hits for staff searches", affects_individuals: false, decision_autonomy: "ADVISORY", data_sensitivity: "PUBLIC", individual_impact: "LOW", jurisdictions: [], deployed_headcount_reach: 500}, as: Requester, as_user_id: "usr_req_1", captures: {uc_m: "$.data.id", ucm_v1: "$.data.version"}}
            - {call: "POST /use-cases/{id}/classify", payload: {expected_use_case_version: "${ucm_v1}"}, as: GovernanceOfficer, as_user_id: "usr_gov_1", captures: {ucm_v2: "$.data.version"}}
            - {call: "GET /use-cases/{id}/review-gates", payload: {}, as: GovernanceOfficer, as_user_id: "usr_gov_1", captures: {g_biz: "$.data[0].id"}}
            - {call: "POST /review-gates/{id}/start-review", payload: {}, as: BusinessReviewer, as_user_id: "usr_biz_1"}
            - {call: "POST /review-gates/{id}/clear", payload: {decision_note: "value case accepted"}, as: BusinessReviewer, as_user_id: "usr_biz_1"}
            - {call: "POST /_clock/set_current_utc", payload: {current_utc: "2026-08-02T00:00:00Z"}, as: GovernanceOfficer, as_user_id: "usr_gov_1"}
          trigger:
            - {call: "POST /use-cases/{id}/revoke", payload: {revocation_reason: "business unit withdrew the request"}, as: GovernanceOfficer, as_user_id: "usr_gov_1"}
          assert:
            - "HTTP 200; status == REVOKED, revoked_at == 2026-08-02T00:00:00Z, revocation_reason == 'business unit withdrew the request'"
            - "GET /use-cases/{uc_m}/ledger-entries returns 2 rows: the earlier GATE_CLEARED entry and one APPROVAL_REVOKED entry with reach_delta == 0 and debt_delta == 0.00"
            - "GET /inventory-summary reports portfolio_approved_reach == 0 and ledger_reach_balance == 0"
            - "no BINDING_RETIRED or DISCLOSURE_WITHDRAWN entry was appended - the use case owned neither"
            - "a further PATCH by the requester is refused 409 ERR_USE_CASE_TERMINAL"

      - name: governance_sweep_bulk_enforces_expired_shadow_grace
        claim_type: bulk_action
        grounds: ["endpoints[POST /_ops/governance-sweep]", state_machines.ShadowDeployment.transitions.DISCOVERED_to_ENFORCED_BLOCK, calculations.shadow_grace_deadline]
        distinguishing_aspect: "One sweep call past a PRODUCTION shadow's 7-day grace deadline reports shadows_enforced 1 and assets_restricted 1 while leaving reassessments_opened, approvals_suspended and assessments_expired at 0, and a second sweep is a no-op that reports all five counters as 0."
        test_recipe:
          setup: ["Register and approve a first-party asset, record a PRODUCTION shadow discovered 2026-08-01T00:00:00Z (BASE_GRACE_DAYS 7 -> deadline 2026-08-08T00:00:00Z), then move the clock to 2026-08-09T00:00:00Z."]
          setup_api_calls:
            - {call: "POST /_clock/set_current_utc", payload: {current_utc: "2026-08-01T00:00:00Z"}, as: GovernanceOfficer, as_user_id: "usr_gov_1"}
            - {call: "POST /model-assets", payload: {provider: "Internal ML Platform", model_name: "helios-mini", model_version: "1.0.0", hosting: "INTERNAL", modality: "TEXT", is_third_party: false}, as: GovernanceOfficer, as_user_id: "usr_gov_1", captures: {asset: "$.data.id"}}
            - {call: "POST /model-assets/{id}/approve-for-use", payload: {}, as: GovernanceOfficer, as_user_id: "usr_gov_1"}
            - {call: "POST /shadow-deployments", payload: {model_asset_id: "${asset}", environment: "PRODUCTION", discovered_source: "EXPENSE_REPORT", discovered_at: "2026-08-01T00:00:00Z"}, as: SecurityReviewer, as_user_id: "usr_sec_1", captures: {sd: "$.data.id"}}
            - {call: "POST /_clock/set_current_utc", payload: {current_utc: "2026-08-09T00:00:00Z"}, as: GovernanceOfficer, as_user_id: "usr_gov_1"}
          trigger:
            - {call: "POST /_ops/governance-sweep", payload: {}, as: GovernanceOfficer, as_user_id: "usr_gov_1"}
            - {call: "POST /_ops/governance-sweep", payload: {}, as: GovernanceOfficer, as_user_id: "usr_gov_1"}
          assert:
            - "the shadow was created with grace_deadline_at == 2026-08-08T00:00:00Z and status DISCOVERED"
            - "first sweep: reassessments_opened == 0, approvals_suspended == 0, shadows_enforced == 1, assets_restricted == 1, assessments_expired == 0"
            - "the shadow is now ENFORCED_BLOCK and the asset is RESTRICTED with enforced_shadow_count == 1 and version == 3"
            - "no GovernanceLedgerEntry was appended, because claimed_use_case_id is null"
            - "second sweep: all five counters are 0 and neither row changes version - the sweep is skip-not-fail on rows already enforced"
            - "the RESTRICTED asset now refuses approve-for-use with 409 ERR_MODEL_ASSET_NOT_APPROVED_FOR_USE because enforced_shadow_count != 0"

      - name: shadow_link_associates_with_matching_approved_use_case
        claim_type: cross_reference_link
