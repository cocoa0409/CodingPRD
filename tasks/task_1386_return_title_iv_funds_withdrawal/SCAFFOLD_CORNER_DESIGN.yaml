# =============================================================================
# §1.9 Scaffold Corner Design — Return of Title IV Funds & Withdrawal Processing
# Breadth coverage of every testable claim in SCAFFOLD.yaml §1.1–§1.7 not already
# covered by SCAFFOLD_DIFFICULTY_DESIGN.yaml. Section/claim_type values follow
# references/claim-extraction-guide.md.
# Fixture shorthand reused below: "T1" = term 2026-08-24..2026-12-11 with break
# 2026-11-25..29 (total_days 105; day 63 = 2026-10-25 -> 0.600; day 10 = 2026-09-02).
# "PELL-only case A" = T1 + charges 600000 + PELL 200000 disbursed + OFFICIAL
# withdraw 2026-10-25 -> earned 120000, school obligation 80000 due 2026-12-09.
# =============================================================================

scaffold_corner_design:
  # ===========================================================================
  # Section: entities
  # ===========================================================================
  - section: entities
    instances:
      - name: term_creation_computes_day_counts
        claim_type: computed_fields
        grounds:
          - "entities.AcademicTerm.fields.total_days"
          - "calculations.term_day_counts"
        distinguishing_aspect: "Computed day-count fields are derived, never echoed from input: T1 yields calendar_days 110, deductible_break_days 5, total_days 105."
        test_recipe:
          setup: ["Empty DB"]
          setup_api_calls:
            - call: "POST /r2t4/terms"
              payload: { name: "Fall 2026", start_date: "2026-08-24", end_date: "2026-12-11" }
              as: RegistrarClerk
              captures: { t1: $.data.id, t1_cal: $.data.calendar_days }
          trigger:
            - call: "POST /r2t4/terms/${t1}/breaks"
              payload: { start_date: "2026-11-25", end_date: "2026-11-29" }
              as: RegistrarClerk
            - call: "GET /r2t4/terms/${t1}"
              payload: {}
              as: RegistrarClerk
              captures: { t1_total: $.data.total_days, t1_ded: $.data.deductible_break_days }
          assert:
            - "calendar_days == 110 at creation"
            - "After the 5-day break: deductible_break_days == 5 and total_days == 105"

      - name: term_end_before_start_rejected
        claim_type: type_constraints
        grounds:
          - "validations[priority=3]"
          - "errors[ERR_INVALID_FIELD]"
        distinguishing_aspect: "end_date strictly after start_date is a request-shape rule: an inverted range is a 422, not a 409."
        test_recipe:
          setup: ["Empty DB"]
          setup_api_calls: []
          trigger:
            - call: "POST /r2t4/terms"
              payload: { name: "Bad", start_date: "2026-08-24", end_date: "2026-08-01" }
              as: RegistrarClerk
              captures: { err: $.data.error_id }
          assert:
            - "error_id == ERR_INVALID_FIELD (http 422); no term is created"

      - name: student_missing_required_email_rejected
        claim_type: required_fields
        grounds:
          - "entities.Student.fields.email"
          - "validations[priority=3]"
          - "errors[ERR_INVALID_REQUEST]"
        distinguishing_aspect: "email has source input and no default: omitting it fails request-shape validation with ERR_INVALID_REQUEST (400)."
        test_recipe:
          setup: ["Empty DB"]
          setup_api_calls: []
          trigger:
            - call: "POST /r2t4/students"
              payload: { external_ref: "SX", full_name: "No Email" }
              as: RegistrarClerk
              captures: { err: $.data.error_id }
          assert:
            - "error_id == ERR_INVALID_REQUEST (http 400)"

      - name: enrollment_creation_defaults_and_charge_entry
        claim_type: defaults
        grounds:
          - "entities.Enrollment.fields.status"
          - "entities.Enrollment.fields.balance_cents"
        distinguishing_aspect: "A new enrollment starts ENROLLED with balance_cents equal to institutional_charges_cents and exactly one CHARGE ledger entry."
        test_recipe:
          setup: ["Term T1 exists; student exists"]
          setup_api_calls:
            - call: "POST /r2t4/terms"
              payload: { name: "Fall 2026", start_date: "2026-08-24", end_date: "2026-12-11" }
              as: RegistrarClerk
              captures: { t1: $.data.id }
            - call: "POST /r2t4/students"
              payload: { external_ref: "SQ", full_name: "Stu Q", email: "sq@x.edu" }
              as: RegistrarClerk
              captures: { sq: $.data.id }
          trigger:
            - call: "POST /r2t4/students/${sq}/enrollments"
              payload: { term_id: "${t1}", institutional_charges_cents: 600000 }
              as: RegistrarClerk
              captures: { eq: $.data.id, eq_status: $.data.status, eq_bal: $.data.balance_cents, eq_notif: $.data.balance_notification_sent }
            - call: "GET /r2t4/enrollments/${eq}/account-entries"
              payload: {}
              as: RegistrarClerk
              captures: { chg_amt: "$.data[0].amount_cents", chg_type: "$.data[0].entry_type" }
          assert:
            - "Enrollment.${eq}.status == ENROLLED and .balance_cents == 600000 and .balance_notification_sent == false and .version == 1"
            - "Exactly 1 account entry: entry_type == CHARGE, amount_cents == 600000"

      - name: account_entry_immutable_shape
        claim_type: immutability
        grounds:
          - "entities.StudentAccountEntry"
        distinguishing_aspect: "StudentAccountEntry is common_fields: false — append-only: reads expose id and created_at but no version and no updated_at, and no update/delete endpoint exists."
        test_recipe:
          setup: ["Term T1, student, enrollment with charges 600000"]
          setup_api_calls:
            - call: "POST /r2t4/terms"
              payload: { name: "Fall 2026", start_date: "2026-08-24", end_date: "2026-12-11" }
              as: RegistrarClerk
              captures: { t1: $.data.id }
            - call: "POST /r2t4/students"
              payload: { external_ref: "SU", full_name: "Stu U", email: "su@x.edu" }
              as: RegistrarClerk
              captures: { su: $.data.id }
            - call: "POST /r2t4/students/${su}/enrollments"
              payload: { term_id: "${t1}", institutional_charges_cents: 600000 }
              as: RegistrarClerk
              captures: { eu: $.data.id }
          trigger:
            - call: "GET /r2t4/enrollments/${eu}/account-entries"
              payload: {}
              as: BursarClerk
              captures: { entry_id: "$.data[0].id" }
            - call: "GET /r2t4/account-entries/${entry_id}"
              payload: {}
              as: BursarClerk
          assert:
            - "Entry response contains id and created_at"
            - "Entry response contains no `version` key and no `updated_at` key"

      - name: enrollment_computed_balance_input_ignored
        claim_type: computed_fields
        grounds:
          - "entities.Enrollment.fields.balance_cents"
        distinguishing_aspect: "balance_cents is source computed: a client-supplied value in the create body is ignored, not stored."
        test_recipe:
          setup: ["Term T1; student"]
          setup_api_calls:
            - call: "POST /r2t4/terms"
              payload: { name: "Fall 2026", start_date: "2026-08-24", end_date: "2026-12-11" }
              as: RegistrarClerk
              captures: { t1: $.data.id }
            - call: "POST /r2t4/students"
              payload: { external_ref: "SV", full_name: "Stu V", email: "sv@x.edu" }
              as: RegistrarClerk
              captures: { sv: $.data.id }
          trigger:
            - call: "POST /r2t4/students/${sv}/enrollments"
              payload: { term_id: "${t1}", institutional_charges_cents: 600000, balance_cents: 999 }
              as: RegistrarClerk
              captures: { ev_bal: $.data.balance_cents }
          assert:
            - "Enrollment.balance_cents == 600000 (the injected 999 is ignored)"

      - name: enrollment_not_found_returns_404
        claim_type: not_found
        grounds:
          - "validations[priority=4]"
          - "errors[ERR_NOT_FOUND]"
        distinguishing_aspect: "Existence check: a well-formed UUID that matches nothing yields ERR_NOT_FOUND (404), not a 400."
        test_recipe:
          setup: ["Empty DB"]
          setup_api_calls: []
          trigger:
            - call: "GET /r2t4/enrollments/00000000-0000-0000-0000-000000000000"
              payload: {}
              as: RegistrarClerk
              captures: { err: $.data.error_id }
          assert:
            - "error_id == ERR_NOT_FOUND (http 404)"

  # ===========================================================================
  # Section: state_machines
  # ===========================================================================
  - section: state_machines
    instances:
      - name: calculate_on_calculated_case_rejected
        claim_type: invalid_transition
        grounds:
          - "state_machines.WithdrawalCase.OPEN_to_CALCULATED"
          - "errors[ERR_INVALID_STATE]"
        distinguishing_aspect: "calculate is declared only from OPEN; from CALCULATED the only loop is recalculate — a second calculate is an invalid transition (no side effects fire)."
        test_recipe:
          setup: ["PELL-only case A calculated (case CALCULATED)"]
          setup_api_calls:
            - call: "POST /r2t4/terms"
              payload: { name: "Fall 2026", start_date: "2026-08-24", end_date: "2026-12-11" }
              as: RegistrarClerk
              captures: { t1: $.data.id }
            - call: "POST /r2t4/terms/${t1}/breaks"
              payload: { start_date: "2026-11-25", end_date: "2026-11-29" }
              as: RegistrarClerk
            - call: "POST /r2t4/students"
              payload: { external_ref: "S1", full_name: "Stu 1", email: "s1@x.edu" }
              as: RegistrarClerk
              captures: { s1: $.data.id }
            - call: "POST /r2t4/students/${s1}/enrollments"
              payload: { term_id: "${t1}", institutional_charges_cents: 600000 }
              as: RegistrarClerk
              captures: { e1: $.data.id }
            - call: "POST /r2t4/enrollments/${e1}/awards"
              payload: { program: "PELL_GRANT", amount_cents: 200000 }
              as: FinancialAidOfficer
              captures: { p1: $.data.id }
            - call: "POST /r2t4/awards/${p1}/disbursements"
              payload: { amount_cents: 200000 }
              as: FinancialAidOfficer
              captures: { d1: $.data.id }
            - call: "POST /r2t4/disbursements/${d1}/disburse"
              payload: {}
              as: FinancialAidOfficer
            - call: "POST /r2t4/enrollments/${e1}/withdraw"
              payload: { withdrawal_type: "OFFICIAL", notification_date: "2026-10-25" }
              as: RegistrarClerk
              captures: { c1: $.data.id }
            - call: "POST /r2t4/withdrawal-cases/${c1}/calculate"
              payload: {}
              as: FinancialAidOfficer
              as_user_id: "officer-1"
          trigger:
            - call: "POST /r2t4/withdrawal-cases/${c1}/calculate"
              payload: {}
              as: FinancialAidOfficer
              as_user_id: "officer-1"
              captures: { err: $.data.error_id }
          assert:
            - "error_id == ERR_INVALID_STATE (http 409)"
            - "WithdrawalCase.${c1} still has exactly 1 obligation (no duplicate side effects fired)"

      - name: rescind_after_case_closed_rejected
        claim_type: terminal_state_lockdown
        grounds:
          - "state_machines.WithdrawalCase"
          - "state_machines.Enrollment.WITHDRAWN_to_ENROLLED"
          - "errors[ERR_INVALID_STATE]"
        distinguishing_aspect: "CLOSED is terminal: once a case auto-closed (100% earned, no artifacts), rescission is rejected and the enrollment stays WITHDRAWN."
        test_recipe:
          setup: ["PELL-only enrollment; withdraw OFFICIAL 2026-10-26 (day 64 -> earned 100%); calculate -> case CLOSED immediately"]
          setup_api_calls:
            - call: "POST /r2t4/terms"
              payload: { name: "Fall 2026", start_date: "2026-08-24", end_date: "2026-12-11" }
              as: RegistrarClerk
              captures: { t1: $.data.id }
            - call: "POST /r2t4/terms/${t1}/breaks"
              payload: { start_date: "2026-11-25", end_date: "2026-11-29" }
              as: RegistrarClerk
            - call: "POST /r2t4/students"
              payload: { external_ref: "S2", full_name: "Stu 2", email: "s2@x.edu" }
              as: RegistrarClerk
              captures: { s2: $.data.id }
            - call: "POST /r2t4/students/${s2}/enrollments"
              payload: { term_id: "${t1}", institutional_charges_cents: 600000 }
              as: RegistrarClerk
              captures: { e2: $.data.id }
            - call: "POST /r2t4/enrollments/${e2}/awards"
              payload: { program: "PELL_GRANT", amount_cents: 200000 }
              as: FinancialAidOfficer
              captures: { p2: $.data.id }
            - call: "POST /r2t4/awards/${p2}/disbursements"
              payload: { amount_cents: 200000 }
              as: FinancialAidOfficer
              captures: { d2: $.data.id }
            - call: "POST /r2t4/disbursements/${d2}/disburse"
              payload: {}
              as: FinancialAidOfficer
            - call: "POST /r2t4/enrollments/${e2}/withdraw"
              payload: { withdrawal_type: "OFFICIAL", notification_date: "2026-10-26" }
              as: RegistrarClerk
              captures: { c2: $.data.id }
            - call: "POST /r2t4/withdrawal-cases/${c2}/calculate"
              payload: {}
              as: FinancialAidOfficer
              as_user_id: "officer-1"
              captures: { c2_status: $.data.status }
          trigger:
            - call: "POST /r2t4/enrollments/${e2}/rescind-withdrawal"
              payload: {}
              as: RegistrarClerk
              captures: { err: $.data.error_id }
          assert:
            - "WithdrawalCase.${c2}.status == CLOSED after calculate (earned 100% -> no obligations, no offers)"
            - "rescind -> error_id == ERR_INVALID_STATE (http 409)"
            - "Enrollment.${e2}.status remains WITHDRAWN"

      - name: record_return_on_voided_obligation_rejected
        claim_type: invalid_transition
        grounds:
          - "state_machines.ReturnObligation.PENDING_to_VOIDED"
          - "errors[ERR_INVALID_STATE]"
        distinguishing_aspect: "VOIDED is terminal and distinct from RETURNED: record-return on a voided obligation is ERR_INVALID_STATE, not ERR_OBLIGATION_ALREADY_RETURNED."
        test_recipe:
          setup: ["PELL-only case A calculated (obligation 80000 PENDING); recalculate to 2026-10-26 (100% earned) voids the obligation"]
          setup_api_calls:
            - call: "POST /r2t4/terms"
              payload: { name: "Fall 2026", start_date: "2026-08-24", end_date: "2026-12-11" }
              as: RegistrarClerk
              captures: { t1: $.data.id }
            - call: "POST /r2t4/terms/${t1}/breaks"
              payload: { start_date: "2026-11-25", end_date: "2026-11-29" }
              as: RegistrarClerk
            - call: "POST /r2t4/students"
              payload: { external_ref: "S3", full_name: "Stu 3", email: "s3@x.edu" }
              as: RegistrarClerk
              captures: { s3: $.data.id }
            - call: "POST /r2t4/students/${s3}/enrollments"
              payload: { term_id: "${t1}", institutional_charges_cents: 600000 }
              as: RegistrarClerk
              captures: { e3: $.data.id }
            - call: "POST /r2t4/enrollments/${e3}/awards"
              payload: { program: "PELL_GRANT", amount_cents: 200000 }
              as: FinancialAidOfficer
              captures: { p3: $.data.id }
            - call: "POST /r2t4/awards/${p3}/disbursements"
              payload: { amount_cents: 200000 }
              as: FinancialAidOfficer
              captures: { d3: $.data.id }
            - call: "POST /r2t4/disbursements/${d3}/disburse"
              payload: {}
              as: FinancialAidOfficer
            - call: "POST /r2t4/enrollments/${e3}/withdraw"
              payload: { withdrawal_type: "OFFICIAL", notification_date: "2026-10-25" }
              as: RegistrarClerk
              captures: { c3: $.data.id }
            - call: "POST /r2t4/withdrawal-cases/${c3}/calculate"
              payload: {}
              as: FinancialAidOfficer
              as_user_id: "officer-1"
              captures: { c3_v: $.data.version }
            - call: "GET /r2t4/withdrawal-cases/${c3}/obligations"
              payload: {}
              as: FinancialAidOfficer
              captures: { ob3: "$.data[0].id" }
            - call: "POST /r2t4/withdrawal-cases/${c3}/recalculate"
              payload: { expected_withdrawal_case_version: "${c3_v}", notification_date: "2026-10-26" }
              as: FinancialAidOfficer
              as_user_id: "officer-1"
          trigger:
            - call: "POST /r2t4/return-obligations/${ob3}/record-return"
              payload: { amount_cents: 80000 }
              as: BursarClerk
              captures: { err: $.data.error_id }
          assert:
            - "ReturnObligation.${ob3}.status == VOIDED after the recalculation"
            - "error_id == ERR_INVALID_STATE (http 409)"

      - name: decline_on_expired_offer_rejected
        claim_type: invalid_transition
        grounds:
          - "state_machines.PostWithdrawalOffer.SENT_to_EXPIRED"
          - "state_machines.PostWithdrawalOffer.SENT_to_DECLINED"
          - "errors[ERR_OFFER_NOT_RESPONDABLE]"
          - "calculations.offer_deadlines"
        distinguishing_aspect: "The clock sweep flips SENT -> EXPIRED when current date passes response_deadline; a subsequent decline is rejected because EXPIRED is terminal."
        test_recipe:
          setup:
            - "PWD fixture: charges 500000; PELL 200000 (100000 DISBURSED + 100000 SCHEDULED); SUB 300000 accepted (100000 DISBURSED + 200000 SCHEDULED)"
            - "Withdraw OFFICIAL 2026-10-25; clock 2026-10-26T09:00:00Z; calculate -> loan offer 80000 SENT, response_deadline 2026-11-09"
          setup_api_calls:
            - call: "POST /r2t4/terms"
              payload: { name: "Fall 2026", start_date: "2026-08-24", end_date: "2026-12-11" }
              as: RegistrarClerk
              captures: { t1: $.data.id }
            - call: "POST /r2t4/terms/${t1}/breaks"
              payload: { start_date: "2026-11-25", end_date: "2026-11-29" }
              as: RegistrarClerk
            - call: "POST /r2t4/students"
              payload: { external_ref: "S4", full_name: "Stu 4", email: "s4@x.edu" }
              as: RegistrarClerk
              captures: { s4: $.data.id }
            - call: "POST /r2t4/students/${s4}/enrollments"
              payload: { term_id: "${t1}", institutional_charges_cents: 500000 }
              as: RegistrarClerk
              captures: { e4: $.data.id }
            - call: "POST /r2t4/enrollments/${e4}/awards"
              payload: { program: "PELL_GRANT", amount_cents: 200000 }
              as: FinancialAidOfficer
              captures: { p4: $.data.id }
            - call: "POST /r2t4/awards/${p4}/disbursements"
              payload: { amount_cents: 100000 }
              as: FinancialAidOfficer
              captures: { d4a: $.data.id }
            - call: "POST /r2t4/disbursements/${d4a}/disburse"
              payload: {}
              as: FinancialAidOfficer
            - call: "POST /r2t4/awards/${p4}/disbursements"
              payload: { amount_cents: 100000 }
              as: FinancialAidOfficer
            - call: "POST /r2t4/enrollments/${e4}/awards"
              payload: { program: "SUBSIDIZED_LOAN", amount_cents: 300000 }
              as: FinancialAidOfficer
              captures: { l4: $.data.id }
            - call: "POST /r2t4/awards/${l4}/accept"
              payload: {}
              as: Student
              as_user_id: "${s4}"
            - call: "POST /r2t4/awards/${l4}/disbursements"
              payload: { amount_cents: 100000 }
              as: FinancialAidOfficer
              captures: { d4b: $.data.id }
            - call: "POST /r2t4/disbursements/${d4b}/disburse"
              payload: {}
              as: FinancialAidOfficer
            - call: "POST /r2t4/awards/${l4}/disbursements"
              payload: { amount_cents: 200000 }
              as: FinancialAidOfficer
            - call: "POST /r2t4/enrollments/${e4}/withdraw"
              payload: { withdrawal_type: "OFFICIAL", notification_date: "2026-10-25" }
              as: RegistrarClerk
              captures: { c4: $.data.id }
            - call: "POST /r2t4/_clock/set_current_utc"
              payload: { to_iso8601: "2026-10-26T09:00:00Z" }
              as: SystemAdmin
            - call: "POST /r2t4/withdrawal-cases/${c4}/calculate"
              payload: {}
              as: FinancialAidOfficer
              as_user_id: "officer-1"
            - call: "GET /r2t4/withdrawal-cases/${c4}/offers"
              payload: {}
              as: FinancialAidOfficer
              captures: { of4: "$.data[0].id" }
          trigger:
            - call: "POST /r2t4/_clock/set_current_utc"
              payload: { to_iso8601: "2026-11-10T00:00:00Z" }
              as: SystemAdmin
            - call: "POST /r2t4/post-withdrawal-offers/${of4}/decline"
              payload: {}
              as: Student
              as_user_id: "${s4}"
              captures: { err: $.data.error_id }
          assert:
            - "PostWithdrawalOffer.${of4}.status == EXPIRED after the clock passed 2026-11-09"
            - "decline -> error_id == ERR_OFFER_NOT_RESPONDABLE (http 409)"

      - name: late_return_from_overdue_succeeds
        claim_type: valid_transition
        grounds:
          - "state_machines.ReturnObligation.OVERDUE_to_RETURNED"
          - "state_machines.WithdrawalCase.CALCULATED_to_CLOSED"
        distinguishing_aspect: "OVERDUE is not terminal: a late return is still recordable, flips the obligation to RETURNED, and lets the case auto-close."
        test_recipe:
          setup: ["PELL-only case A calculated (obligation 80000 due 2026-12-09); clock advanced to 2026-12-10 so obligation is OVERDUE"]
          setup_api_calls:
            - call: "POST /r2t4/terms"
              payload: { name: "Fall 2026", start_date: "2026-08-24", end_date: "2026-12-11" }
              as: RegistrarClerk
              captures: { t1: $.data.id }
            - call: "POST /r2t4/terms/${t1}/breaks"
              payload: { start_date: "2026-11-25", end_date: "2026-11-29" }
              as: RegistrarClerk
            - call: "POST /r2t4/students"
              payload: { external_ref: "S5", full_name: "Stu 5", email: "s5@x.edu" }
              as: RegistrarClerk
              captures: { s5: $.data.id }
            - call: "POST /r2t4/students/${s5}/enrollments"
              payload: { term_id: "${t1}", institutional_charges_cents: 600000 }
              as: RegistrarClerk
              captures: { e5: $.data.id }
            - call: "POST /r2t4/enrollments/${e5}/awards"
              payload: { program: "PELL_GRANT", amount_cents: 200000 }
              as: FinancialAidOfficer
              captures: { p5: $.data.id }
            - call: "POST /r2t4/awards/${p5}/disbursements"
              payload: { amount_cents: 200000 }
              as: FinancialAidOfficer
              captures: { d5: $.data.id }
            - call: "POST /r2t4/disbursements/${d5}/disburse"
              payload: {}
              as: FinancialAidOfficer
            - call: "POST /r2t4/enrollments/${e5}/withdraw"
              payload: { withdrawal_type: "OFFICIAL", notification_date: "2026-10-25" }
              as: RegistrarClerk
              captures: { c5: $.data.id }
            - call: "POST /r2t4/withdrawal-cases/${c5}/calculate"
              payload: {}
              as: FinancialAidOfficer
              as_user_id: "officer-1"
            - call: "GET /r2t4/withdrawal-cases/${c5}/obligations"
              payload: {}
              as: FinancialAidOfficer
              captures: { ob5: "$.data[0].id" }
            - call: "POST /r2t4/_clock/set_current_utc"
              payload: { to_iso8601: "2026-12-10T08:00:00Z" }
              as: SystemAdmin
          trigger:
            - call: "POST /r2t4/return-obligations/${ob5}/record-return"
