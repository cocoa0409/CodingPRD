              captures: { g_available: $.data.available_quantity_units, g_consumed: $.data.consumed_quantity_units }
          assert:
            - "the RECEIVED lot MLR returns HTTP 409 ERR_MATERIAL_NOT_QUALIFIED, although it is also expired and over-drawn — priority 75 runs first"
            - "the QUALIFIED but expired lot MLE returns 409 ERR_MATERIAL_EXPIRED, although it is also over-drawn — priority 76 runs before 78; expiry is strict, so an expiry_date at or before the clock is expired"
            - "the QUALIFIED, unexpired lot MLG with quantity_used 500.0 against 100.0 available returns 409 ERR_INSUFFICIENT_MATERIAL"
            - "the ENZYME lot MLX returns HTTP 422 ERR_COMPONENT_ROLE_NOT_IN_BOM because EZ-CA-14 is not in required_material_codes, even though the declared role matches its material_type"
            - "MLG dispensed under component_role ENZYME returns 422 as well, because the role must equal the dispensed material's material_type ANTIBODY — the two halves of the rule are independent"
            - "the final legal add of exactly 100.0 units succeeds with status CONSUMED and leaves MLG at available_quantity_units 0.0 and consumed_quantity_units 100.0, so the priority 78 bound is inclusive"
            - "all five rejected calls left ReagentLot.version untouched, which is why the single captured ${rl_v} is still current for the successful add"

