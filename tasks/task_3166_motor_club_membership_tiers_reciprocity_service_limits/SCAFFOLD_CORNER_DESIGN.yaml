        claim_type: action_endpoint
        grounds:
          - "endpoints.POST /motor-club/part-stock/{stockId}/restock"
          - "entities.TruckPartStock.fields.quantity_on_hand"
        distinguishing_aspect: "Restock adds (not sets) quantity: 3 + 5 = 8 on the stock line."
