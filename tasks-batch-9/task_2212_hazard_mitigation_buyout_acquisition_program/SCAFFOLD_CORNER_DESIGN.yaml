            - "BenefitCostAnalysis.${bca}.status == VALIDATED"
            - "trigger call 4 returns 409 with data.error_id == ERR_INVALID_APPRAISAL_STATE"
            - "Appraisal.${ap1}.status == SUBMITTED after trigger call 4"
