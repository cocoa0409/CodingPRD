              as: FreightAgent
              as_user_id: "${agent_id}"
              captures: { load_id: $.data.id, load_v0: $.data.version }
          trigger:
            - call: "POST /network/load-offers"
              payload: { load_id: "${load_id}", capacity_owner_id: "${bco_id}", offered_pay_cents: 126000, offered_at: "2026-09-01T01:00:00Z", expected_network_load_version: "${load_v0}" }
              as: FreightAgent
              as_user_id: "${agent_id}"
              captures: { offer_early: $.data.id }
            - call: "GET /network/loads/${load_id}"
              payload: {  }
              as: FreightAgent
              as_user_id: "${agent_id}"
              captures: { load_v_tie: $.data.version }
            - call: "POST /network/load-offers"
              payload: { load_id: "${load_id}", capacity_owner_id: "${bco_id}", offered_pay_cents: 126000, offered_at: "2026-09-01T02:00:00Z", expected_network_load_version: "${load_v_tie}" }
