            - "GET /clearing/net-positions/${np_sat} still reports funded_amount_cents == 400000 and settlement_obligation_cents == 400000"

  # ===========================================================================
  - section: endpoints
    instances:

      - name: trade_cancel_from_locked_in_reverted_by_admin
        claim_type: Action endpoint
        grounds:
          - state_machines.TradeSubmission.LOCKED_IN_to_CANCELLED
          - endpoints.POST_/clearing/trade-submissions/{id}/cancel
          - validations[priority=5]
        distinguishing_aspect: "Cancellation is a two-actor action: a ClearingMember may cancel only its own OPEN trade, while cancelling a LOCKED_IN trade requires the PlatformAdmin role, and the contras are released back to OPEN with match_status UNMATCHED."
        test_recipe:
          setup:
            - "Logical clock at 2026-09-05T00:00:00Z. Participants CA3 and CB3 are ACTIVE; Security CAN1 has an OPEN window; CA3 holds a locked-in matched BUY against CB3."
          setup_api_calls:
            - call: "POST /clearing/_clock/set_current_utc"
              payload: { to_iso8601: "2026-09-05T00:00:00Z" }
              as: PlatformAdmin
            - call: "POST /clearing/participants"
              payload: { legal_name: "Cancel Alpha", lei: "LEI-CA3", participant_class: "BANK", net_capital_cents: 2000000000 }
              as: PlatformAdmin
              captures: { p_ca3: $.data.id }
            - call: "POST /clearing/participants"
              payload: { legal_name: "Cancel Beta", lei: "LEI-CB3", participant_class: "BANK", net_capital_cents: 2000000000 }
              as: PlatformAdmin
              captures: { p_cb3: $.data.id }
