# =============================================================================
# SCAFFOLD.yaml — Crowdsourced Delivery Block Offering & Driver Rating
# (Amazon Flex-style)
#
# §1.0–§1.7 only. §1.8 lives in SCAFFOLD_DIFFICULTY_DESIGN.yaml;
# §1.9 lives in SCAFFOLD_CORNER_DESIGN.yaml.
# =============================================================================

scenario: |
  Crowdsourced Delivery Block Offering & Driver Rating (Amazon Flex): delivery
  block publication by station, time window and estimated pay with acceptance
  on a first-come or offer basis, driver onboarding with background screening,
  vehicle requirements and insurance attestation, block check-in, package
  scan-out and route assignment at the station, delivery quality standards on
  time window adherence, delivery photo compliance and package handling,
  rating tiers that unlock earlier block visibility and reserved offers,
  block forfeiture and cancellation rules with reliability consequences,
  surge pay adjustment when blocks go unfilled, deactivation appeals and
  evidence review

domain_name: crowdsourced-delivery-blocks
api_prefix: "/"

complexity_profile:
  primary_archetype: temporal_windowing
  secondary_archetype: pricing_engine
  complexity_layers:
    - optimistic_concurrency
    - cascading_side_effects
    - dual_variant_calculation
    - ops_run_checkpoint
  entity_topology: hybrid
  state_machine_shape: cyclic
  relationship_patterns:
    - one_to_many
    - cross_aggregate
  role_model: peer_roles
  consistency_model: immediate

# =============================================================================
# §1.0 Response Envelope (FIXED — verbatim)
# =============================================================================
response_envelope:
  success: |
    { "meta": { "api_request_id": "req_xxx", "api_request_timestamp": "ISO8601" },
      "response_type": "object" | "array", "data": {} }
  error: |
    { "meta": { ... }, "response_type": "error",
      "data": { "error_id": "ERR_XXX", "message": "..." } }
  pagination_fields: ["limit", "offset", "total_count", "has_more"]
  pagination_defaults: { limit: 10, min: 1, max: 100, offset: 0 }

# =============================================================================
# §1.1 Entity-Relationship Table
# =============================================================================
entities:
  - name: Station
    parent: null
    common_fields: true
    fields:
      - { name: name, type: string, source: input, description: "Station name" }
      - { name: zone_code, type: string, source: input, description: "Geographic zone code, e.g. SEA1" }
      - { name: surge_enabled, type: boolean, source: input, default: true, description: "Whether surge escalation runs for this station's blocks" }
      - { name: pay_liabilities_cents, type: integer, source: computed, description: "Sum of final_pay_cents over PayStatements in SETTLED status for assignments of this station's blocks; VOIDED and OPEN excluded" }

  - name: Driver
    parent: null
    common_fields: true
    fields:
      - { name: legal_name, type: string, source: input, description: "Driver legal name" }
      - { name: email, type: string, source: input, description: "Driver email; unique across all drivers", constraints: "unique" }
      - { name: status, type: enum, source: system, description: "APPLIED | ACTIVE | DEACTIVATED", default: APPLIED }
      - { name: rating_tier, type: enum, source: computed, description: "STANDARD | PLUS | PREMIER; derived by tier_qualification from rating_score_x100 and reliability_score_bp", default: STANDARD }
      - { name: rating_score_x100, type: integer, source: computed, description: "Rolling 90-day rating times 100 (e.g. 450 = 4.50); 0 when no RatingEvent in window" }
      - { name: lifetime_rating_x100, type: integer, source: computed, description: "Recency-weighted lifetime rating times 100; 0 when no RatingEvent exists" }
      - { name: reliability_score_bp, type: integer, source: computed, description: "Reliability in basis points, starts 10000, floor 0; see reliability_score calculation" }

  - name: BackgroundScreening
    parent: null
    common_fields: true
    fields:
      - { name: driver_id, type: string, source: system, description: "FK -> Driver.id; screening subject" }
      - { name: status, type: enum, source: system, description: "INITIATED | IN_REVIEW | CLEARED | FAILED", default: INITIATED }
      - { name: failure_reason, type: string, source: system, description: "Recorded when decision=FAILED; null otherwise", constraints: "nullable" }
      - { name: decided_at, type: datetime, source: system, description: "Logical-clock timestamp of the last decide call; null until first decision", constraints: "nullable" }

  - name: Vehicle
    parent: null
    common_fields: true
    fields:
      - { name: driver_id, type: string, source: system, description: "FK -> Driver.id; owning driver" }
      - { name: vin, type: string, source: input, description: "Vehicle identification number; unique among Vehicles with status ACTIVE", constraints: "unique among ACTIVE vehicles" }
      - { name: vehicle_class, type: enum, source: input, description: "SEDAN | SUV | VAN; rank SEDAN=1 < SUV=2 < VAN=3" }
      - { name: insurance_expires_on, type: string, source: system, description: "ISO date (YYYY-MM-DD) of insurance coverage end; set by attest-insurance; null until first attestation", constraints: "nullable" }
      - { name: insurance_status, type: enum, source: computed, description: "NONE (never attested) | ATTESTED (insurance_expires_on >= current logical date) | EXPIRED (insurance_expires_on < current logical date)" }
      - { name: status, type: enum, source: system, description: "ACTIVE | RETIRED", default: ACTIVE }

  - name: DeliveryBlock
    parent: null
    common_fields: true
    fields:
      - { name: station_id, type: string, source: system, description: "FK -> Station.id; publishing station" }
      - { name: starts_at, type: datetime, source: input, description: "Block window start (ISO8601 UTC)" }
      - { name: ends_at, type: datetime, source: input, description: "Block window end (ISO8601 UTC); must be strictly after starts_at" }
      - { name: required_vehicle_class, type: enum, source: input, description: "SEDAN | SUV | VAN; driver's vehicle rank must be >= this rank" }
      - { name: base_pay_cents, type: integer, source: input, description: "Base pay for the block before surge, bonus, surcharges and penalties; must be > 0" }
      - { name: surge_multiplier_bp, type: integer, source: system, description: "Surge multiplier in basis points (10000 = 1.0x); adjusted by run-surge-cycle; never below 10000", default: 10000 }
      - { name: estimated_pay_cents, type: integer, source: computed, description: "Provisional pay estimate = round_half_up(base_pay_cents * surge_multiplier_bp / 10000); recomputed on publish, revise and surge cycle" }
      - { name: status, type: enum, source: system, description: "DRAFT | PUBLISHED | ASSIGNED | IN_PROGRESS | COMPLETED | CANCELLED | EXPIRED", default: DRAFT }
      - { name: assigned_driver_id, type: string, source: system, description: "FK -> Driver.id; driver holding the non-terminal assignment; null when unassigned", constraints: "nullable" }

  - name: BlockOffer
    parent: null
    common_fields: true
    fields:
      - { name: block_id, type: string, source: system, description: "FK -> DeliveryBlock.id; offered block" }
      - { name: driver_id, type: string, source: system, description: "FK -> Driver.id; target driver" }
      - { name: tier_floor, type: enum, source: input, description: "STANDARD | PLUS | PREMIER; minimum tier the offer targets; offer is auto-REVOKED when the driver's tier falls below this floor" }
      - { name: expires_at, type: datetime, source: input, description: "ISO8601 UTC; offer auto-expires at this instant" }
      - { name: status, type: enum, source: system, description: "OFFERED | ACCEPTED | DECLINED | EXPIRED | REVOKED", default: OFFERED }

  - name: BlockAssignment
    parent: null
    common_fields: true
    fields:
      - { name: block_id, type: string, source: system, description: "FK -> DeliveryBlock.id; assigned block" }
      - { name: driver_id, type: string, source: system, description: "FK -> Driver.id; assigned driver" }
      - { name: offer_id, type: string, source: system, description: "FK -> BlockOffer.id; set when accepted via reserved offer; null for first-come acceptance", constraints: "nullable" }
      - { name: vehicle_id, type: string, source: system, description: "FK -> Vehicle.id; vehicle chosen at acceptance" }
      - { name: status, type: enum, source: system, description: "ASSIGNED | CHECKED_IN | ROUTE_ASSIGNED | IN_DELIVERY | COMPLETED | FORFEITED | NO_SHOW", default: ASSIGNED }
      - { name: surge_multiplier_snapshot_bp, type: integer, source: system, description: "Block's surge_multiplier_bp frozen at acceptance time; used by final settlement gross" }
      - { name: tier_at_accept, type: enum, source: system, description: "Driver's rating_tier frozen at acceptance; used for the settlement tier bonus" }
      - { name: provisional_pay_cents, type: integer, source: computed, description: "Provisional variant of pay: round_half_up(block.base_pay_cents * surge_multiplier_snapshot_bp / 10000); no tier bonus, surcharges, or penalties" }
      - { name: check_in_at, type: datetime, source: system, description: "Logical-clock timestamp of check-in; null until checked in", constraints: "nullable" }
      - { name: forfeited_at, type: datetime, source: system, description: "Logical-clock timestamp of forfeiture; null unless FORFEITED", constraints: "nullable" }
      - { name: no_show_at, type: datetime, source: system, description: "Logical-clock timestamp of no-show sweep; null unless NO_SHOW", constraints: "nullable" }
      - { name: forfeit_cause, type: enum, source: system, description: "DRIVER_INITIATED | SYSTEM_DEACTIVATION; null unless FORFEITED", constraints: "nullable" }
      - { name: strike_reversed, type: boolean, source: system, description: "true after a deactivation appeal is OVERTURNED; reversed strikes stop counting in reliability_score", default: false }

  - name: Package
    parent: null
    common_fields: true
    fields:
      - { name: assignment_id, type: string, source: system, description: "FK -> BlockAssignment.id; owning assignment (scan-out at the station)" }
      - { name: tracking_code, type: string, source: input, description: "Unique tracking code within the assignment" }
      - { name: billable_weight_kg, type: number, source: input, description: "Billable weight in kg; must be > 0; feeds per-package handling surcharge" }
      - { name: promised_by, type: datetime, source: input, description: "ISO8601 UTC promised delivery instant; on-time boundary is inclusive" }
      - { name: status, type: enum, source: system, description: "LOADED | OUT_FOR_DELIVERY | DELIVERED | DELIVERY_FAILED | RETURNED_TO_STATION", default: LOADED }
      - { name: delivered_at, type: datetime, source: system, description: "Logical-clock timestamp of delivery; null unless DELIVERED", constraints: "nullable" }
      - { name: photo_url, type: string, source: input, description: "Delivery photo URL submitted at deliver; empty string allowed (counts as non-compliant)", constraints: "may be empty string" }
      - { name: photo_gps_tagged, type: boolean, source: input, description: "Whether the submitted photo carries a GPS tag" }
      - { name: photo_compliant, type: boolean, source: computed, description: "true iff photo_url is non-empty AND photo_gps_tagged is true; null until DELIVERED", constraints: "nullable" }
      - { name: on_time_delivery, type: boolean, source: computed, description: "true iff delivered_at <= promised_by (inclusive boundary); null until DELIVERED", constraints: "nullable" }
      - { name: failure_reason, type: string, source: system, description: "Recorded on report-failed; null otherwise", constraints: "nullable" }

  - name: RatingEvent
    parent: null
    common_fields: true
    fields:
      - { name: driver_id, type: string, source: system, description: "FK -> Driver.id; rated driver" }
      - { name: assignment_id, type: string, source: system, description: "FK -> BlockAssignment.id; completion that produced this event" }
      - { name: event_type, type: enum, source: system, description: "COMPLETION_SCORE (only type in v1); one event per assignment completion" }
      - { name: points, type: integer, source: system, description: "Rating contribution times 100 (e.g. 500 = 5.00); computed by completion_rating_points" }
      - { name: event_at, type: datetime, source: system, description: "Logical-clock timestamp at assignment completion; drives rolling-window and lifetime-weight inclusion" }

  - name: PayStatement
    parent: null
    common_fields: true
    fields:
      - { name: assignment_id, type: string, source: system, description: "FK -> BlockAssignment.id; exactly one PayStatement per completed assignment (1:1)" }
      - { name: status, type: enum, source: system, description: "OPEN | SETTLED | VOIDED", default: OPEN }
      - { name: gross_cents, type: integer, source: computed, description: "round_half_up(block.base_pay_cents * assignment.surge_multiplier_snapshot_bp / 10000)" }
      - { name: tier_bonus_cents, type: integer, source: computed, description: "round_half_up(gross_cents * TIER_BONUS_BP(assignment.tier_at_accept) / 10000)" }
      - { name: surcharges_cents, type: integer, source: computed, description: "Sum over DELIVERED packages of round_half_up(billable_weight_kg * 155); per-package rounding pinned" }
      - { name: penalties_cents, type: integer, source: computed, description: "min(raw_penalties, penalty_cap); see final_settlement_pay" }
      - { name: final_pay_cents, type: integer, source: computed, description: "gross_cents + tier_bonus_cents + surcharges_cents - penalties_cents" }
      - { name: tier_applied, type: enum, source: system, description: "Tier snapshot actually used for the bonus (== assignment.tier_at_accept)" }
      - { name: settled_at, type: datetime, source: system, description: "Logical-clock timestamp of settlement; null unless SETTLED", constraints: "nullable" }
      - { name: voided_at, type: datetime, source: system, description: "Logical-clock timestamp of void; null unless VOIDED", constraints: "nullable" }

  - name: Appeal
    parent: null
    common_fields: true
    fields:
      - { name: driver_id, type: string, source: system, description: "FK -> Driver.id; deactivated driver appealing" }
      - { name: reason, type: string, source: input, description: "Driver's appeal reason" }
      - { name: status, type: enum, source: system, description: "SUBMITTED | UNDER_REVIEW | EVIDENCE_REQUESTED | UPHELD | OVERTURNED", default: SUBMITTED }
      - { name: evidence_count, type: integer, source: system, description: "Number of evidence submissions; decide requires evidence_count >= 1", default: 0 }
      - { name: decision_reason, type: string, source: system, description: "Reviewer's decision rationale; null until decided", constraints: "nullable" }

# =============================================================================
# §1.2 State Machine Table
# =============================================================================
state_machines:
  - entity: Driver
    initial_state: APPLIED
    terminal_states: []
    transitions:
      - from: APPLIED
        to: ACTIVE
        trigger: "POST /drivers/{driver_id}/activate"
        actor: PlatformAdmin
        preconditions:
          - "driver.status == APPLIED"
          - "the latest BackgroundScreening for this driver (by created_at, latest first) has status CLEARED (else ERR_SCREENING_NOT_CLEARED)"
          - "driver owns >= 1 Vehicle with status ACTIVE and insurance_status ATTESTED (else ERR_NO_ELIGIBLE_VEHICLE)"
        side_effects:
          - "driver.status := ACTIVE"
          - "driver.version += 1"
      - from: ACTIVE
        to: DEACTIVATED
        trigger: "POST /drivers/{driver_id}/deactivate"
        actor: PlatformAdmin
        preconditions:
          - "driver.status == ACTIVE"
        side_effects:
          - "hop 1 (direct): every BlockAssignment of this driver with status in {ASSIGNED, CHECKED_IN, ROUTE_ASSIGNED, IN_DELIVERY} -> FORFEITED, forfeit_cause=SYSTEM_DEACTIVATION, forfeited_at=now, strike_reversed=false"
          - "hop 2 (caused by each hop-1 forfeiture): that assignment's DeliveryBlock -> PUBLISHED, assigned_driver_id := null (relisted)"
          - "hop 3 (caused by hop-1 strikes): driver.reliability_score_bp recomputed per reliability_score (-500 per non-reversed forfeit in last 30 days)"
          - "hop 4 (caused by hop-3 recompute): driver.rating_tier recomputed per tier_qualification (rating unchanged, reliability lower => possible demotion)"
          - "hop 5 (caused by hop-4 demotion): every BlockOffer to this driver with status OFFERED whose tier_floor ranks above the new tier -> REVOKED"
          - "driver.version += 1"
      - from: DEACTIVATED
        to: ACTIVE
        trigger: "system (Appeal decided OVERTURNED)"
        actor: system
        preconditions:
          - "appeal.status transitioned to OVERTURNED for this driver"
        side_effects:
          - "every BlockAssignment of this driver with forfeit_cause=SYSTEM_DEACTIVATION and strike_reversed=false -> strike_reversed := true"
          - "driver.reliability_score_bp recomputed per reliability_score (reversed strikes no longer subtract)"
          - "driver.rating_tier recomputed per tier_qualification"
          - "driver.version += 1"
        note: "REVOKED offers are NOT restored; expired/forfeited history is preserved"

  - entity: BackgroundScreening
    initial_state: INITIATED
    terminal_states: [CLEARED]
    transitions:
      - from: INITIATED
        to: IN_REVIEW
        trigger: "POST /screenings/{screening_id}/begin-review"
        actor: PlatformAdmin
        preconditions: ["screening.status == INITIATED"]
        side_effects: ["screening.version += 1"]
      - from: IN_REVIEW
        to: CLEARED
        trigger: "POST /screenings/{screening_id}/decide (decision=CLEARED)"
        actor: PlatformAdmin
        preconditions: ["screening.status == IN_REVIEW"]
        side_effects: ["decided_at := now", "failure_reason := null", "screening.version += 1"]
      - from: IN_REVIEW
        to: FAILED
        trigger: "POST /screenings/{screening_id}/decide (decision=FAILED)"
        actor: PlatformAdmin
        preconditions: ["screening.status == IN_REVIEW", "failure_reason input present"]
        side_effects: ["decided_at := now", "failure_reason := input", "screening.version += 1"]
      - from: FAILED
        to: IN_REVIEW
        trigger: "POST /screenings/{screening_id}/reopen"
        actor: Driver
        preconditions: ["screening.status == FAILED", "X-User-ID == screening.driver_id"]
        side_effects: ["failure_reason := null", "screening.version += 1"]
        note: "cyclic: FAILED -> IN_REVIEW -> FAILED -> IN_REVIEW loops are permitted without bound"

  - entity: Vehicle
    initial_state: ACTIVE
    terminal_states: [RETIRED]
    transitions:
      - from: ACTIVE
        to: RETIRED
        trigger: "POST /vehicles/{vehicle_id}/retire"
        actor: Driver
        preconditions: ["vehicle.status == ACTIVE", "X-User-ID == vehicle.driver_id"]
        side_effects: ["vehicle.version += 1"]
        note: "insurance_status is a computed view over insurance_expires_on vs the logical clock, not a stored transition"

  - entity: DeliveryBlock
    initial_state: DRAFT
    terminal_states: [COMPLETED, CANCELLED, EXPIRED]
    transitions:
      - from: DRAFT
        to: PUBLISHED
        trigger: "POST /blocks/{block_id}/publish"
        actor: StationOps
        preconditions:
          - "block.status == DRAFT"
          - "block.starts_at > now (logical clock)"
        side_effects:
          - "estimated_pay_cents recomputed per estimated_block_pay"
          - "block.version += 1"
      - from: PUBLISHED
        to: ASSIGNED
        trigger: "POST /blocks/{block_id}/accept OR POST /offers/{offer_id}/accept"
        actor: Driver
        preconditions:
          - "block.status == PUBLISHED (else ERR_BLOCK_NOT_PUBLISHED)"
          - "driver.status == ACTIVE (else ERR_DRIVER_NOT_ACTIVE)"
          - "first-come accept only: now >= block.starts_at - TIER_LEAD_MIN(driver.rating_tier) (else ERR_BLOCK_NOT_VISIBLE_YET); offer accept bypasses visibility"
          - "no other non-terminal BlockAssignment exists for this block"
          - "vehicle: exists, belongs to driver, status ACTIVE, insurance_status == ATTESTED (else ERR_INSURANCE_NOT_ATTESTED), vehicle_class rank >= block.required_vehicle_class rank (else ERR_VEHICLE_CLASS_MISMATCH)"
          - "no overlap: no other BlockAssignment of this driver with status in {ASSIGNED, CHECKED_IN, ROUTE_ASSIGNED, IN_DELIVERY} whose block window [starts_at, ends_at) overlaps this block's window; half-open intervals, so adjacency (end == start) is allowed (else ERR_BLOCK_WINDOW_OVERLAP)"
        side_effects:
          - "BlockAssignment created: status ASSIGNED, surge_multiplier_snapshot_bp := block.surge_multiplier_bp, tier_at_accept := driver.rating_tier, provisional_pay_cents per provisional_assignment_pay"
          - "block.status := ASSIGNED, assigned_driver_id := driver.id"
          - "offer accept: BlockOffer.status := ACCEPTED"
          - "block.version += 1"
      - from: ASSIGNED
        to: IN_PROGRESS
        trigger: "system (assignment check-in succeeds)"
        actor: system
        preconditions: ["linked BlockAssignment transitioned ASSIGNED -> CHECKED_IN"]
        side_effects: ["block.version += 1"]
      - from: IN_PROGRESS
        to: COMPLETED
        trigger: "system (assignment completes)"
        actor: system
        preconditions: ["linked BlockAssignment transitioned -> COMPLETED"]
        side_effects: ["block.version += 1"]
      - from: ASSIGNED
        to: PUBLISHED
        trigger: "system (assignment FORFEITED or NO_SHOW: relist cycle)"
        actor: system
        preconditions: ["linked BlockAssignment transitioned to FORFEITED or NO_SHOW"]
        side_effects:
          - "assigned_driver_id := null"
          - "surge_multiplier_bp and estimated_pay_cents retained (not reset)"
          - "block.version += 1"
        note: "cyclic: PUBLISHED -> ASSIGNED -> PUBLISHED relist loop; a block may be relisted repeatedly"
      - from: IN_PROGRESS
        to: PUBLISHED
        trigger: "system (assignment FORFEITED after check-in: relist)"
        actor: system
        preconditions: ["linked BlockAssignment CHECKED_IN/ROUTE_ASSIGNED/IN_DELIVERY transitioned to FORFEITED (only via driver deactivation; driver-initiated forfeit is allowed from ASSIGNED only)"]
        side_effects: ["assigned_driver_id := null", "block.version += 1"]
      - from: DRAFT
        to: CANCELLED
        trigger: "POST /blocks/{block_id}/cancel"
        actor: StationOps
        preconditions: ["block.status in {DRAFT, PUBLISHED}"]
        side_effects: ["block.version += 1"]
      - from: PUBLISHED
        to: CANCELLED
        trigger: "POST /blocks/{block_id}/cancel"
        actor: StationOps
        preconditions: ["block.status in {DRAFT, PUBLISHED}"]
        side_effects: ["block.version += 1"]
      - from: PUBLISHED
        to: EXPIRED
        trigger: "system (run-surge-cycle: starts_at <= now and still unfilled)"
        actor: system
        preconditions: ["block.status == PUBLISHED", "block.starts_at <= now"]
        side_effects:
          - "every BlockOffer for this block with status OFFERED -> EXPIRED"
          - "block.version += 1"

  - entity: BlockOffer
    initial_state: OFFERED
    terminal_states: [ACCEPTED, DECLINED, EXPIRED, REVOKED]
    transitions:
      - from: OFFERED
        to: ACCEPTED
        trigger: "POST /offers/{offer_id}/accept"
        actor: Driver
        preconditions:
          - "offer.status == OFFERED"
          - "X-User-ID == offer.driver_id (else ERR_OFFER_WRONG_DRIVER)"
          - "now < offer.expires_at (else ERR_OFFER_EXPIRED)"
          - "all DeliveryBlock accept preconditions for offer.block_id except the visibility rule (offers bypass tier visibility)"
        side_effects:
          - "creates BlockAssignment (offer_id set) and transitions the block PUBLISHED -> ASSIGNED per DeliveryBlock machine"
          - "offer.version += 1"
      - from: OFFERED
        to: DECLINED
        trigger: "POST /offers/{offer_id}/decline"
        actor: Driver
        preconditions: ["offer.status == OFFERED", "X-User-ID == offer.driver_id (else ERR_OFFER_WRONG_DRIVER)"]
        side_effects: ["offer.version += 1"]
      - from: OFFERED
        to: EXPIRED
        trigger: "system (run-surge-cycle: expires_at <= now)"
        actor: system
        preconditions: ["offer.status == OFFERED", "offer.expires_at <= now"]
        side_effects: ["offer.version += 1"]
      - from: OFFERED
        to: REVOKED
        trigger: "system (driver tier demoted below offer.tier_floor via tier_qualification recompute)"
        actor: system
        preconditions: ["offer.status == OFFERED", "TIER_RANK(driver.rating_tier) < TIER_RANK(offer.tier_floor)"]
        side_effects: ["offer.version += 1"]

  - entity: BlockAssignment
    initial_state: ASSIGNED
    terminal_states: [COMPLETED, FORFEITED, NO_SHOW]
    transitions:
      - from: ASSIGNED
        to: CHECKED_IN
        trigger: "POST /assignments/{assignment_id}/check-in"
        actor: Driver
        preconditions:
          - "assignment.status == ASSIGNED"
          - "X-User-ID == assignment.driver_id"
          - "driver.status == ACTIVE (else ERR_DRIVER_NOT_ACTIVE)"
          - "safety: assignment.vehicle insurance covers the whole block window under closed-interval containment: vehicle.insurance_expires_on >= date(block.ends_at) (else ERR_INSURANCE_WINDOW_LAPSE)"
          - "temporal: now >= block.starts_at - 30 minutes (else ERR_CHECKIN_TOO_EARLY) AND now <= block.starts_at + 15 minutes (else ERR_CHECKIN_WINDOW_CLOSED); both bounds inclusive"
        side_effects:
          - "check_in_at := now"
          - "DeliveryBlock ASSIGNED -> IN_PROGRESS"
          - "assignment.version += 1"
      - from: CHECKED_IN
        to: ROUTE_ASSIGNED
        trigger: "POST /assignments/{assignment_id}/load-packages"
        actor: StationOps
        preconditions:
          - "assignment.status == CHECKED_IN"
          - "packages array non-empty; tracking_code unique within the assignment"
        side_effects:
          - "one Package created per array element, status LOADED (scan-out + route assignment)"
          - "assignment.version += 1"
      - from: ROUTE_ASSIGNED
        to: IN_DELIVERY
        trigger: "POST /assignments/{assignment_id}/depart"
        actor: Driver
        preconditions: ["assignment.status == ROUTE_ASSIGNED", "X-User-ID == assignment.driver_id"]
        side_effects:
          - "every Package of this assignment with status LOADED -> OUT_FOR_DELIVERY"
          - "assignment.version += 1"
      - from: IN_DELIVERY
        to: COMPLETED
        trigger: "POST /assignments/{assignment_id}/complete"
        actor: StationOps
        preconditions:
          - "assignment.status == IN_DELIVERY"
          - "every Package of this assignment has status in {DELIVERED, DELIVERY_FAILED} (else ERR_PACKAGE_NOT_DELIVERABLE)"
        side_effects:
          - "hop 1 (direct): every Package with status DELIVERY_FAILED -> RETURNED_TO_STATION"
          - "hop 1 (direct): RatingEvent created per completion_rating_points (event_at := now)"
          - "hop 1 (direct): PayStatement created (status OPEN) per final_settlement_pay"
          - "hop 2 (caused by the new RatingEvent): driver.rating_score_x100 and lifetime_rating_x100 recomputed"
          - "hop 3 (caused by hop-2 recompute): driver.rating_tier recomputed per tier_qualification"
          - "hop 4 (caused by hop-3 demotion, if any): OFFERED BlockOffers to this driver with tier_floor above new tier -> REVOKED"
          - "DeliveryBlock IN_PROGRESS -> COMPLETED"
          - "assignment.version += 1"
      - from: ASSIGNED
        to: FORFEITED
        trigger: "POST /assignments/{assignment_id}/forfeit"
        actor: Driver
        preconditions: ["assignment.status == ASSIGNED", "X-User-ID == assignment.driver_id"]
        side_effects:
          - "forfeit_cause := DRIVER_INITIATED, forfeited_at := now, strike_reversed := false"
          - "hop 1 (direct): DeliveryBlock ASSIGNED -> PUBLISHED (relist; assigned_driver_id cleared)"
          - "hop 2 (caused by the new strike): driver.reliability_score_bp recomputed (-500)"
          - "hop 3 (caused by hop-2 recompute): driver.rating_tier recomputed per tier_qualification"
          - "hop 4 (caused by hop-3 demotion, if any): OFFERED BlockOffers with tier_floor above new tier -> REVOKED"
          - "assignment.version += 1"
      - from: ASSIGNED
        to: NO_SHOW
        trigger: "system (run-surge-cycle: now >= block.starts_at + 15 minutes and still ASSIGNED)"
        actor: system
        preconditions: ["assignment.status == ASSIGNED", "now >= block.starts_at + 15 minutes"]
        side_effects:
          - "no_show_at := now"
          - "hop 1 (direct): DeliveryBlock ASSIGNED -> PUBLISHED (relist)"
          - "hop 2 (caused by the strike): driver.reliability_score_bp recomputed (-1000)"
          - "hop 3 (caused by hop-2): driver.rating_tier recomputed; hop 4: tier-floor offer revocation as above"
          - "assignment.version += 1"
      - from: "CHECKED_IN/ROUTE_ASSIGNED/IN_DELIVERY"
        to: FORFEITED
        trigger: "system (driver deactivation only; see Driver ACTIVE -> DEACTIVATED)"
        actor: system
        preconditions: ["driver deactivated while assignment non-terminal"]
        side_effects: ["forfeit_cause := SYSTEM_DEACTIVATION, forfeited_at := now; block relisted per DeliveryBlock machine"]
        note: "driver-initiated forfeit from these states is NOT allowed; only deactivation cascades here"

  - entity: Package
    initial_state: LOADED
    terminal_states: [DELIVERED, RETURNED_TO_STATION]
    transitions:
      - from: LOADED
        to: OUT_FOR_DELIVERY
        trigger: "system (assignment depart)"
        actor: system
        preconditions: ["assignment transitioned ROUTE_ASSIGNED -> IN_DELIVERY"]
        side_effects: ["package.version += 1"]
      - from: OUT_FOR_DELIVERY
        to: DELIVERED
        trigger: "POST /packages/{package_id}/deliver"
        actor: Driver
        preconditions:
          - "package.status == OUT_FOR_DELIVERY (else ERR_PACKAGE_NOT_DELIVERABLE)"
          - "cross-entity: package.assignment_id's BlockAssignment.status == IN_DELIVERY (else ERR_INVALID_STATE)"
          - "X-User-ID == assignment.driver_id"
        side_effects:
          - "delivered_at := now (logical clock)"
          - "photo_compliant := (photo_url non-empty AND photo_gps_tagged == true)"
          - "on_time_delivery := (delivered_at <= promised_by) — inclusive boundary"
          - "package.version += 1"
      - from: OUT_FOR_DELIVERY
        to: DELIVERY_FAILED
        trigger: "POST /packages/{package_id}/report-failed"
        actor: Driver
        preconditions:
          - "package.status == OUT_FOR_DELIVERY (else ERR_PACKAGE_NOT_DELIVERABLE)"
          - "X-User-ID == assignment.driver_id"
        side_effects: ["failure_reason := input.reason", "package.version += 1"]
      - from: DELIVERY_FAILED
        to: RETURNED_TO_STATION
        trigger: "system (assignment completion)"
        actor: system
        preconditions: ["assignment completes"]
        side_effects: ["package.version += 1"]

  - entity: PayStatement
    initial_state: OPEN
    terminal_states: [VOIDED]
    transitions:
      - from: OPEN
        to: SETTLED
        trigger: "POST /pay-statements/{pay_statement_id}/settle"
        actor: PlatformAdmin
        preconditions: ["pay_statement.status == OPEN"]
        side_effects:
          - "settled_at := now"
          - "station.pay_liabilities_cents recomputed (adds this final_pay_cents)"
          - "pay_statement.version += 1"
      - from: SETTLED
        to: VOIDED
        trigger: "POST /pay-statements/{pay_statement_id}/void"
        actor: PlatformAdmin
        preconditions: ["pay_statement.status == SETTLED"]
        side_effects:
          - "voided_at := now"
          - "station.pay_liabilities_cents recomputed (removes this final_pay_cents)"
          - "pay_statement.version += 1"
        note: "compensating pair: settle + void leaves station.pay_liabilities_cents unchanged"

  - entity: Appeal
    initial_state: SUBMITTED
    terminal_states: [UPHELD, OVERTURNED]
    transitions:
      - from: SUBMITTED
        to: UNDER_REVIEW
        trigger: "POST /appeals/{appeal_id}/submit-evidence"
        actor: Driver
        preconditions: ["appeal.status == SUBMITTED", "X-User-ID == appeal.driver_id"]
        side_effects: ["evidence_count += 1", "appeal.version += 1"]
      - from: EVIDENCE_REQUESTED
        to: UNDER_REVIEW
        trigger: "POST /appeals/{appeal_id}/submit-evidence"
        actor: Driver
        preconditions: ["appeal.status == EVIDENCE_REQUESTED", "X-User-ID == appeal.driver_id"]
        side_effects: ["evidence_count += 1", "appeal.version += 1"]
      - from: UNDER_REVIEW
        to: EVIDENCE_REQUESTED
        trigger: "POST /appeals/{appeal_id}/request-evidence"
        actor: AppealsReviewer
        preconditions: ["appeal.status == UNDER_REVIEW"]
        side_effects: ["appeal.version += 1"]
        note: "cyclic: UNDER_REVIEW -> EVIDENCE_REQUESTED -> UNDER_REVIEW may loop without bound"
      - from: UNDER_REVIEW
        to: UPHELD
        trigger: "POST /appeals/{appeal_id}/decide (decision=UPHELD)"
        actor: AppealsReviewer
        preconditions: ["appeal.status == UNDER_REVIEW", "appeal.evidence_count >= 1"]
        side_effects: ["decision_reason := input", "appeal.version += 1; driver remains DEACTIVATED"]
      - from: UNDER_REVIEW
        to: OVERTURNED
        trigger: "POST /appeals/{appeal_id}/decide (decision=OVERTURNED)"
        actor: AppealsReviewer
        preconditions: ["appeal.status == UNDER_REVIEW", "appeal.evidence_count >= 1"]
        side_effects:
          - "decision_reason := input"
          - "Driver DEACTIVATED -> ACTIVE with strike reversal, reliability and tier recompute per Driver machine"
          - "appeal.version += 1"

# =============================================================================
# §1.2.1 Concurrency Rules (true races only; OCC on parent version)
# =============================================================================
concurrency_rules:
  - rule_id: block-revise-stale-version
    parent_entity: DeliveryBlock
    write_endpoint: "POST /blocks/{block_id}/revise"
    occ_field: "expected_block_version"
    description: |
      Revising a DeliveryBlock whose version has advanced since the client last
      observed it is rejected. Each revision legitimately supersedes the prior
      block configuration (pay, window, vehicle class), so a second revision
      based on a stale version would silently discard the intervening edit.
    error_id: ERR_STALE_VERSION
    http_status: 412
  - rule_id: station-surge-cycle-stale-version
    parent_entity: Station
    write_endpoint: "POST /stations/{station_id}/run-surge-cycle"
    occ_field: "expected_station_version"
    description: |
      Running a surge cycle against a Station whose version has advanced since
      the client last observed it is rejected. Each surge cycle advances the
      station epoch (escalations, expirations, no-show sweeps), so a cycle run
      from a stale epoch would double-apply time-based effects.
    error_id: ERR_STALE_VERSION
    http_status: 412

# =============================================================================
# §1.3 Calculation Rules Table
# =============================================================================
calculations:
  - name: estimated_block_pay
    trigger: "block publish, block revise, run-surge-cycle (after surge escalation)"
    algorithm: threshold
    formula: |
      estimated_pay_cents = round_half_up(base_pay_cents * surge_multiplier_bp / 10000)
      Recomputed whenever surge_multiplier_bp changes or base_pay_cents changes.
    input_set: "the DeliveryBlock itself"
    precision: "integer cents, round_half_up"

  - name: surge_escalation
    trigger: "run-surge-cycle, for each PUBLISHED block with starts_at > now at a station with surge_enabled=true"
    algorithm: threshold
    formula: |
      minutes_to_start = (block.starts_at - now) in whole minutes, floor toward zero
      evaluate smallest bracket first:
        if minutes_to_start <= 30  -> surge_multiplier_bp := 17500
        elif minutes_to_start <= 60  -> surge_multiplier_bp := 15000
        elif minutes_to_start <= 120 -> surge_multiplier_bp := 12500
        else                           surge_multiplier_bp := 10000
      Boundary is INCLUSIVE: exactly 120 -> 12500; exactly 121 -> 10000.
      After assignment, surge_multiplier_bp never decreases below its current
      value within a single cycle: new_value = max(current, bracket_value).
      Then estimated_block_pay is recomputed for the block.
      Stations with surge_enabled=false skip escalation entirely.
    input_set: "DeliveryBlocks with status PUBLISHED and starts_at > now, per station"
    constants:
      SURGE_STEP_30_BP: 17500
      SURGE_STEP_60_BP: 15000
      SURGE_STEP_120_BP: 12500
      SURGE_BASE_BP: 10000
    precision: "integer basis points"

  - name: provisional_assignment_pay
    trigger: "block acceptance (first-come or offer)"
    algorithm: forward_looking
    formula: |
      provisional_pay_cents = round_half_up(block.base_pay_cents * assignment.surge_multiplier_snapshot_bp / 10000)
      No tier bonus, no surcharges, no penalties. This is the PROVISIONAL variant
      of driver pay; it diverges from the FINAL variant computed at completion.
    input_set: "the accepted block and the new assignment snapshot"
    precision: "integer cents, round_half_up"
    variants:
      - name: provisional
        when: "at acceptance; shown to the driver before work begins"
        difference: "uses surge snapshot only; excludes tier bonus, handling surcharges, and penalties"
      - name: final
        when: "at assignment completion; recorded on the PayStatement"
        difference: "adds tier bonus (tier_at_accept snapshot), per-package handling surcharges, and capped penalties; see final_settlement_pay"

  - name: final_settlement_pay
    trigger: "POST /assignments/{assignment_id}/complete"
    algorithm: tiered_pricing
    formula: |
      Evaluation order is pinned (see tier_qualification for the cross-rule order):
      1. gross_cents     = round_half_up(block.base_pay_cents * assignment.surge_multiplier_snapshot_bp / 10000)
      2. tier_bonus_cents = round_half_up(gross_cents * TIER_BONUS_BP(assignment.tier_at_accept) / 10000)
         where TIER_BONUS_BP: STANDARD=0, PLUS=500, PREMIER=1000.
         The bonus uses the tier SNAPSHOT taken at acceptance, NOT the live tier.
      3. surcharges_cents = SUM over packages with status DELIVERED of
                            round_half_up(billable_weight_kg * 155)
         Rounding order is pinned: round PER PACKAGE first, then sum.
         (Round-half-up of the aggregate weight would give a different total.)
      4. raw_penalties   = 200 * count(DELIVERED packages with on_time_delivery == false)
                         + 150 * count(DELIVERED packages with photo_compliant == false)
                         + 500 * count(packages with status RETURNED_TO_STATION at completion)
      5. penalty_cap     = round_half_up(0.5 * (gross_cents + tier_bonus_cents))
      6. penalties_cents = min(raw_penalties, penalty_cap)
      7. final_pay_cents = gross_cents + tier_bonus_cents + surcharges_cents - penalties_cents
    input_set: "the assignment, its block, and all of its packages"
    constants:
      TIER_BONUS_BP_STANDARD: 0
      TIER_BONUS_BP_PLUS: 500
      TIER_BONUS_BP_PREMIER: 1000
      SURCHARGE_PER_KG_CENTS: 155
      LATE_PENALTY_CENTS: 200
      PHOTO_PENALTY_CENTS: 150
      FAILED_PENALTY_CENTS: 500
    precision: "integer cents, round_half_up; per-package rounding before summation"
    variants:
      - name: provisional
        when: "acceptance-time estimate on the assignment"
        difference: "gross only (see provisional_assignment_pay); always <= final when bonuses+surcharges exceed penalties"
      - name: final
        when: "completion; persisted on PayStatement"
        difference: "full composition above; the two variants produce different cents for identical block data whenever a tier bonus, surcharge, or penalty is nonzero"

  - name: completion_rating_points
    trigger: "POST /assignments/{assignment_id}/complete (creates one RatingEvent)"
    algorithm: aggregation
    formula: |
      points = max(100, 500
                   - 100 * count(DELIVERED packages with on_time_delivery == false)
                   -  50 * count(DELIVERED packages with photo_compliant == false)
                   - 200 * count(packages RETURNED_TO_STATION at completion))
      event_at := now (logical clock); event_type := COMPLETION_SCORE
    input_set: "packages of the completing assignment"
    precision: "integer points x100"

  - name: rolling_rating
    trigger: "any RatingEvent creation (assignment completion)"
    algorithm: aggregation
    formula: |
      Window: events with event_at >= now - 90 days (INCLUSIVE boundary).
      rating_score_x100 = round_half_up( avg(points) over the window )
      If the window is empty: rating_score_x100 := 0.
    input_set: "RatingEvents of the driver with event_at in [now - 90d, now]"
    precision: "integer x100, round_half_up"
    variants:
      - name: rolling_90d
        when: "drives tier_qualification"
        difference: "events older than 90 days are excluded entirely"
      - name: lifetime_weighted
        when: "exposed as lifetime_rating_x100 on the driver profile"
        difference: "all events included with recency weights; see lifetime_weighted_rating; produces a different value whenever old events exist"

  - name: lifetime_weighted_rating
    trigger: "any RatingEvent creation (assignment completion)"
    algorithm: weighted_scoring
    formula: |
      age_days = floor((now - event_at) / 86400 seconds)
      weight: age_days <= 30 -> 100; 31..90 -> 50; > 90 -> 25
      lifetime_rating_x100 = round_half_up( SUM(points * weight) / SUM(weight) )
      If no events exist: lifetime_rating_x100 := 0.
    input_set: "ALL RatingEvents of the driver, any age"
    precision: "integer x100, round_half_up"
    variants:
      - name: lifetime_weighted
        when: "driver profile"
        difference: "includes stale events at 0.25 weight"
      - name: rolling_90d
        when: "tier qualification"
        difference: "excludes stale events; same data, different result"

  - name: reliability_score
    trigger: "assignment FORFEITED, assignment NO_SHOW, appeal OVERTURNED (strike reversal)"
    algorithm: aggregation
    formula: |
      Window: last 30 days, inclusive: forfeited_at >= now - 30d (resp. no_show_at).
      strikes =  500 * count(FORFEITED assignments with strike_reversed=false and forfeited_at in window)
              + 1000 * count(NO_SHOW assignments with strike_reversed=false and no_show_at in window)
      reliability_score_bp = max(0, 10000 - strikes)
    input_set: "BlockAssignments of the driver in terminal FORFEITED/NO_SHOW status"
    precision: "integer basis points"

  - name: tier_qualification
    trigger: "after any rolling_rating or reliability_score recompute"
    algorithm: threshold
    formula: |
      Pinned evaluation order (breaks the apparent circle: tier depends on rating
      and reliability; pay bonus depends on tier; but the pay bonus uses the
      tier SNAPSHOT at acceptance, so no true cycle exists):
        step 1: reliability_score_bp recomputed from assignment outcomes
        step 2: rating_score_x100 recomputed from RatingEvents
        step 3: tier derived from the two FRESH values:
                PREMIER  if rating_score_x100 >= 470 AND reliability_score_bp >= 9500
                PLUS     elif rating_score_x100 >= 430 AND reliability_score_bp >= 8500
                STANDARD otherwise
                (thresholds INCLUSIVE: exactly 8500 stays PLUS)
        step 4: if the new tier ranks below an OFFERED BlockOffer's tier_floor,
                that offer -> REVOKED (TIER_RANK: STANDARD=1 < PLUS=2 < PREMIER=3)
      Tier affects only FUTURE interactions (visibility lead, offer eligibility);
      in-flight assignments keep tier_at_accept.
    input_set: "driver aggregates + OFFERED BlockOffers to the driver"
    constants:
      PREMIER_RATING_X100: 470
      PREMIER_RELIABILITY_BP: 9500
      PLUS_RATING_X100: 430
      PLUS_RELIABILITY_BP: 8500
    precision: "integer comparisons, inclusive lower bounds"

  - name: on_time_evaluation
    trigger: "POST /packages/{package_id}/deliver"
    algorithm: threshold
    formula: |
      on_time_delivery = (delivered_at <= promised_by)
      Boundary INCLUSIVE: delivered_at == promised_by exactly -> on time.
    input_set: "the delivered package"
    precision: "second-precision timestamps compared directly"

  - name: pay_liabilities_aggregation
    trigger: "pay statement settle or void"
    algorithm: aggregation
    formula: |
      station.pay_liabilities_cents = SUM of final_pay_cents over PayStatements
      with status == SETTLED whose assignment's block.station_id == station.id
      OPEN and VOIDED statements are excluded.
    input_set: "PayStatements linked via assignment -> block -> station"
    precision: "integer cents"

  - name: surge_cycle_sweeps
    trigger: "run-surge-cycle (after offer expiry, before surge escalation)"
    algorithm: chronological
    formula: |
      Processing order within one cycle is pinned:
        1. OFFERED BlockOffers of this station's blocks with expires_at <= now -> EXPIRED
        2. No-show sweep: BlockAssignments ASSIGNED whose block.starts_at + 15 min <= now
           -> NO_SHOW (block relisted, reliability -1000, tier recompute, offer revocation)
        3. Block expiry: PUBLISHED blocks with starts_at <= now -> EXPIRED
           (their remaining OFFERED offers -> EXPIRED)
        4. Surge escalation per surge_escalation (only if station.surge_enabled)
      Within each step, process affected rows in starts_at ASC order; ties broken
      by created_at ASC. The station's version increments exactly once per cycle.
    input_set: "offers, assignments, and blocks of the station"
    precision: "whole-minute comparisons on the logical clock"

# =============================================================================
# §1.4 Validation Rules Table (ordered by priority)
# =============================================================================
validations:
  - priority: 1
    category: auth
    check: "X-User-Role header present and a declared role; X-User-ID present for every role except Anonymous"
    error_id: ERR_UNAUTHENTICATED
    http_status: 401
    applies_to: "all endpoints"

  - priority: 2
    category: auth
    check: "Role permitted for the endpoint per §1.5 roles; for entity_backed Driver, ownership: X-User-ID must equal the driver_id of the acted-on resource (driver, vehicle, screening reopen, assignment, package, offer, appeal)"
    error_id: ERR_FORBIDDEN
    http_status: 403
    applies_to: "all endpoints"
    note: "offer accept/decline by the wrong driver uses the domain error ERR_OFFER_WRONG_DRIVER (403) instead of ERR_FORBIDDEN"

  - priority: 3
    category: existence
    check: "Every id in the path exists, validated left-to-right; FK references in the body exist (vehicle_id, driver_id, block_id)"
    error_id: ERR_NOT_FOUND
    http_status: 404
    applies_to: "all endpoints"

  - priority: 4
    category: state
    check: "Target resource in a legal state for the operation: state-machine from-state holds; block.status == PUBLISHED for accept; driver.status == ACTIVE for driver-actor delivery ops (ERR_DRIVER_NOT_ACTIVE); pay statement status for settle/void; appeal status for evidence/decide"
    error_id: ERR_INVALID_STATE
    http_status: 409
    applies_to: "all state-transition endpoints"
    note: "ERR_DRIVER_NOT_ACTIVE and ERR_BLOCK_NOT_PUBLISHED are the domain-specific state errors; both sit at priority 4 and beat every business_* check"

  - priority: 5
    category: business_safety
    check: "Screening/vehicle/insurance safety gates: latest screening CLEARED for activation; vehicle ACTIVE + insurance ATTESTED at accept; insurance closed-interval containment (insurance_expires_on >= date(block.ends_at)) at check-in"
    error_id: ERR_INSURANCE_WINDOW_LAPSE
    http_status: 409
    applies_to: "POST /drivers/{driver_id}/activate (ERR_SCREENING_NOT_CLEARED, ERR_NO_ELIGIBLE_VEHICLE), POST /blocks/{block_id}/accept and POST /offers/{offer_id}/accept (ERR_INSURANCE_NOT_ATTESTED, ERR_NO_ELIGIBLE_VEHICLE, ERR_VEHICLE_CLASS_MISMATCH), POST /assignments/{assignment_id}/check-in (ERR_INSURANCE_WINDOW_LAPSE)"
    note: "safety beats temporal: a check-in that violates both insurance containment and the check-in window returns ERR_INSURANCE_WINDOW_LAPSE"

  - priority: 6
    category: business_temporal
    check: "Time-window gates: tier visibility lead at first-come accept (ERR_BLOCK_NOT_VISIBLE_YET); half-open assignment-window overlap (ERR_BLOCK_WINDOW_OVERLAP); 30-minute buffered gap for reserved offers (ERR_OFFER_BUFFER_CONFLICT); offer expiry (ERR_OFFER_EXPIRED); check-in window bounds (ERR_CHECKIN_TOO_EARLY / ERR_CHECKIN_WINDOW_CLOSED)"
    error_id: ERR_BLOCK_WINDOW_OVERLAP
    http_status: 409
    applies_to: "POST /blocks/{block_id}/accept, POST /offers/{offer_id}/accept, POST /blocks/{block_id}/offers, POST /assignments/{assignment_id}/check-in"

  - priority: 7
    category: business_constraint
    check: "Aggregate/uniqueness constraints: email unique at registration (ERR_DUPLICATE_EMAIL); VIN unique among ACTIVE vehicles (ERR_DUPLICATE_VIN); single open appeal per driver and driver must be DEACTIVATED (ERR_APPEAL_NOT_OPEN); no second non-terminal assignment per block; tracking_code unique within assignment"
    error_id: ERR_DUPLICATE_EMAIL
    http_status: 409
    applies_to: "POST /drivers/register, POST /drivers/{driver_id}/vehicles, POST /drivers/{driver_id}/appeals, POST /blocks/{block_id}/accept, POST /assignments/{assignment_id}/load-packages"

  - priority: 8
    category: business_fiscal
    check: "Money-side preconditions: base_pay_cents > 0 on create/revise; billable_weight_kg > 0 per package; OCC expected_*_version matches current parent version (ERR_STALE_VERSION)"
    error_id: ERR_VALIDATION
    http_status: 400
    applies_to: "POST /stations/{station_id}/blocks, POST /blocks/{block_id}/revise, POST /assignments/{assignment_id}/load-packages"
    note: "ERR_STALE_VERSION (412) is evaluated here, after existence and state, per §1.2.1"

  - priority: 9
    category: existence
    check: "Request body shape: valid JSON, required fields present, enum members valid, datetime fields parse"
    error_id: ERR_VALIDATION
    http_status: 400
    applies_to: "all endpoints"
    note: "malformed bodies are only reached after auth/existence; field-shape errors on an otherwise-routable request land here"

# =============================================================================
# §1.5 API Endpoint Table
# =============================================================================
endpoints:
  # --- test-driving clock ---
  - method: POST
    path: "/_clock/set_current_utc"
    description: "Set the logical clock to any instant (test-driving). Before any call, the clock reads exactly 2026-09-01T00:00:00Z and never falls back to wall-clock time."
    roles: [PlatformAdmin]
    code: 200
    input: [to_iso8601]
    output: "{ current_utc: string }"
    side_effects: ["logical clock set; all time-based rules (windows, expiry, surge, rating windows, insurance) read this clock"]

  # --- Station ---
  - method: POST
    path: "/stations"
    description: "Create a station"
    roles: [PlatformAdmin]
    code: 201
    input: [name, zone_code, "surge_enabled?"]
    output: Station
    side_effects: ["pay_liabilities_cents initialized to 0"]

  - method: GET
    path: "/stations/{station_id}"
    description: "Get a station (includes pay_liabilities_cents)"
    roles: [PlatformAdmin, StationOps]
    code: 200
    input: []
    output: Station
    side_effects: []

  - method: GET
    path: "/stations/{id}/blocks"
    description: "List blocks of a station, sorted by starts_at ASC then created_at ASC (FK reverse for DeliveryBlock.station_id)"
    roles: [PlatformAdmin, StationOps]
    code: 200
    input: ["status?", "limit?", "offset?"]
    output: "DeliveryBlock[]"
    side_effects: []

  - method: POST
    path: "/stations/{station_id}/blocks"
    description: "Create a block in DRAFT"
    roles: [StationOps]
    code: 201
    input: [starts_at, ends_at, required_vehicle_class, base_pay_cents]
    output: DeliveryBlock
    side_effects: ["status DRAFT, surge_multiplier_bp 10000, estimated_pay_cents computed"]

  - method: POST
    path: "/stations/{station_id}/run-surge-cycle"
    description: "Advance the station epoch: offer expiry, no-show sweep, block expiry, surge escalation. OCC on station version."
    roles: [StationOps]
    code: 200
    input: [expected_station_version]
    output: Station
    side_effects: ["per surge_cycle_sweeps; increments Station.version by 1"]

  # --- Driver onboarding ---
  - method: POST
    path: "/drivers/register"
    description: "Register a driver; auto-creates a BackgroundScreening in INITIATED"
    roles: [Anonymous]
    code: 201
    input: [legal_name, email]
    output: Driver
    side_effects: ["driver status APPLIED; BackgroundScreening created (INITIATED); reliability_score_bp 10000; rating_tier STANDARD; rating scores 0"]

  - method: GET
    path: "/drivers/{driver_id}"
    description: "Get a driver (includes computed rating/reliability/tier fields)"
    roles: [Driver, PlatformAdmin, StationOps, AppealsReviewer]
    code: 200
    input: []
    output: Driver
    side_effects: []

  - method: GET
    path: "/drivers/{id}/screenings"
    description: "List screenings of a driver (FK reverse)"
    roles: [Driver, PlatformAdmin]
    code: 200
    input: ["limit?", "offset?"]
    output: "BackgroundScreening[]"
    side_effects: []

  - method: POST
    path: "/screenings/{screening_id}/begin-review"
    description: "Screening INITIATED -> IN_REVIEW"
    roles: [PlatformAdmin]
    code: 200
    input: []
    output: BackgroundScreening
    side_effects: ["increments BackgroundScreening.version by 1"]

  - method: POST
    path: "/screenings/{screening_id}/decide"
    description: "Screening IN_REVIEW -> CLEARED | FAILED"
    roles: [PlatformAdmin]
    code: 200
    input: [decision, "failure_reason?"]
    output: BackgroundScreening
    side_effects: ["decided_at := now; increments BackgroundScreening.version by 1"]

  - method: POST
    path: "/screenings/{screening_id}/reopen"
    description: "Screening FAILED -> IN_REVIEW (driver self-service)"
    roles: [Driver]
    code: 200
    input: []
    output: BackgroundScreening
    side_effects: ["increments BackgroundScreening.version by 1"]

  - method: POST
    path: "/drivers/{driver_id}/vehicles"
    description: "Register a vehicle for the driver"
    roles: [Driver]
    code: 201
    input: [vin, vehicle_class]
    output: Vehicle
    side_effects: ["status ACTIVE; insurance_status NONE until attested"]

  - method: GET
    path: "/drivers/{id}/vehicles"
    description: "List vehicles of a driver (FK reverse)"
    roles: [Driver, PlatformAdmin]
    code: 200
    input: ["limit?", "offset?"]
    output: "Vehicle[]"
    side_effects: []

  - method: GET
    path: "/drivers/{id}/assigned-blocks"
    description: "List blocks currently or formerly assigned to a driver via DeliveryBlock.assigned_driver_id (FK reverse)"
    roles: [Driver, StationOps, PlatformAdmin]
    code: 200
    input: ["limit?", "offset?"]
    output: "DeliveryBlock[]"
    side_effects: []

  - method: GET
    path: "/drivers/{id}/rating-events"
    description: "List rating events of a driver, sorted by event_at ASC (FK reverse)"
    roles: [Driver, PlatformAdmin]
    code: 200
    input: ["limit?", "offset?"]
    output: "RatingEvent[]"
    side_effects: []

  - method: GET
    path: "/vehicles/{vehicle_id}"
    description: "Get a single vehicle"
    roles: [Driver, PlatformAdmin, StationOps]
    code: 200
    input: []
    output: Vehicle
    side_effects: []

  - method: POST
    path: "/vehicles/{vehicle_id}/attest-insurance"
    description: "Driver attests insurance coverage end date"
    roles: [Driver]
    code: 200
    input: [insurance_expires_on]
    output: Vehicle
    side_effects: ["insurance_expires_on := input; insurance_status recomputed; increments Vehicle.version by 1"]

  - method: POST
    path: "/vehicles/{vehicle_id}/retire"
    description: "Vehicle ACTIVE -> RETIRED"
    roles: [Driver]
    code: 200
    input: []
    output: Vehicle
    side_effects: ["increments Vehicle.version by 1"]

  - method: GET
    path: "/vehicles/{id}/assignments"
    description: "List assignments that used this vehicle (FK reverse)"
    roles: [Driver, StationOps, PlatformAdmin]
    code: 200
    input: ["limit?", "offset?"]
    output: "BlockAssignment[]"
    side_effects: []

  - method: POST
    path: "/drivers/{driver_id}/activate"
    description: "Driver APPLIED -> ACTIVE after screening cleared + eligible vehicle"
    roles: [PlatformAdmin]
    code: 200
    input: []
    output: Driver
    side_effects: ["per Driver state machine"]

  - method: POST
    path: "/drivers/{driver_id}/deactivate"
    description: "Driver ACTIVE -> DEACTIVATED with the full forfeit/relist/reliability/tier/offer cascade"
    roles: [PlatformAdmin]
    code: 200
    input: [reason]
    output: Driver
    side_effects: ["per Driver state machine deactivation cascade"]

  # --- Blocks ---
  - method: GET
    path: "/blocks/{block_id}"
    description: "Get a block"
    roles: [StationOps, PlatformAdmin, Driver]
    code: 200
    input: []
    output: DeliveryBlock
    side_effects: []

  - method: POST
    path: "/blocks/{block_id}/publish"
    description: "Block DRAFT -> PUBLISHED"
    roles: [StationOps]
    code: 200
    input: []
    output: DeliveryBlock
    side_effects: ["estimated_pay_cents recomputed; increments DeliveryBlock.version by 1"]

  - method: POST
    path: "/blocks/{block_id}/revise"
    description: "Revise a DRAFT or PUBLISHED block; supersedes prior configuration. OCC on block version."
    roles: [StationOps]
    code: 200
    input: [expected_block_version, "starts_at?", "ends_at?", "required_vehicle_class?", "base_pay_cents?"]
    output: DeliveryBlock
    side_effects: ["estimated_pay_cents recomputed; increments DeliveryBlock.version by 1"]

  - method: POST
    path: "/blocks/{block_id}/cancel"
    description: "Block DRAFT|PUBLISHED -> CANCELLED"
    roles: [StationOps]
    code: 200
    input: []
    output: DeliveryBlock
    side_effects: ["increments DeliveryBlock.version by 1"]

  - method: POST
    path: "/blocks/{block_id}/accept"
    description: "First-come acceptance by an eligible driver; creates the assignment"
    roles: [Driver]
    code: 201
    input: [vehicle_id]
    output: BlockAssignment
    side_effects: ["per DeliveryBlock PUBLISHED -> ASSIGNED transition"]

  - method: GET
    path: "/blocks/{id}/offers"
    description: "List offers for a block (FK reverse)"
    roles: [StationOps, PlatformAdmin]
    code: 200
    input: ["status?", "limit?", "offset?"]
    output: "BlockOffer[]"
    side_effects: []

  - method: GET
    path: "/blocks/{id}/assignments"
    description: "List assignments of a block (FK reverse)"
    roles: [StationOps, PlatformAdmin, Driver]
    code: 200
    input: ["status?", "limit?", "offset?"]
    output: "BlockAssignment[]"
    side_effects: []

  - method: POST
    path: "/blocks/{block_id}/offers"
    description: "Create a reserved offer for a driver; enforces the 30-minute buffered gap against the driver's existing assignment windows"
    roles: [StationOps]
    code: 201
    input: [driver_id, tier_floor, expires_at]
    output: BlockOffer
    side_effects: ["offer status OFFERED; requires block.status == PUBLISHED and TIER_RANK(driver.rating_tier) >= TIER_RANK(tier_floor)"]

  # --- Offers ---
  - method: GET
    path: "/offers/{offer_id}"
    description: "Get a single offer"
    roles: [Driver, StationOps, PlatformAdmin]
    code: 200
    input: []
    output: BlockOffer
    side_effects: []

  - method: POST
    path: "/offers/{offer_id}/accept"
    description: "Driver accepts a reserved offer (bypasses tier visibility lead)"
    roles: [Driver]
    code: 201
    input: [vehicle_id]
    output: BlockAssignment
    side_effects: ["offer OFFERED -> ACCEPTED; block PUBLISHED -> ASSIGNED; assignment created"]

  - method: POST
    path: "/offers/{offer_id}/decline"
    description: "Driver declines a reserved offer"
    roles: [Driver]
    code: 200
    input: []
    output: BlockOffer
    side_effects: ["offer OFFERED -> DECLINED; increments BlockOffer.version by 1"]

  - method: GET
    path: "/offers/{id}/assignments"
    description: "List assignments created from this offer, 0 or 1 (FK reverse)"
    roles: [Driver, StationOps, PlatformAdmin]
    code: 200
    input: []
    output: "BlockAssignment[]"
    side_effects: []

  # --- Assignments ---
  - method: GET
    path: "/assignments/{assignment_id}"
    description: "Get an assignment"
    roles: [Driver, StationOps, PlatformAdmin]
    code: 200
    input: []
    output: BlockAssignment
    side_effects: []

  - method: GET
    path: "/drivers/{id}/assignments"
    description: "List assignments of a driver, sorted by created_at ASC (FK reverse)"
    roles: [Driver, StationOps, PlatformAdmin]
    code: 200
    input: ["status?", "limit?", "offset?"]
    output: "BlockAssignment[]"
    side_effects: []

  - method: GET
    path: "/drivers/{id}/offers"
    description: "List offers addressed to a driver, sorted by created_at ASC (FK reverse)"
    roles: [Driver, StationOps, PlatformAdmin]
    code: 200
    input: ["status?", "limit?", "offset?"]
    output: "BlockOffer[]"
    side_effects: []

  - method: POST
    path: "/assignments/{assignment_id}/check-in"
    description: "Assignment ASSIGNED -> CHECKED_IN within the check-in window; insurance containment enforced"
    roles: [Driver]
    code: 200
    input: []
    output: BlockAssignment
    side_effects: ["block ASSIGNED -> IN_PROGRESS; increments BlockAssignment.version by 1"]

  - method: POST
    path: "/assignments/{assignment_id}/load-packages"
    description: "Station scan-out: bulk-create packages and assign the route; CHECKED_IN -> ROUTE_ASSIGNED"
    roles: [StationOps]
    code: 200
    input: [packages]
    output: BlockAssignment
    side_effects: ["Package rows created (LOADED); increments BlockAssignment.version by 1"]

  - method: GET
    path: "/assignments/{id}/packages"
    description: "List packages of an assignment, sorted by created_at ASC (FK reverse)"
    roles: [Driver, StationOps]
    code: 200
    input: ["limit?", "offset?"]
    output: "Package[]"
    side_effects: []

  - method: GET
    path: "/assignments/{id}/rating-events"
    description: "List rating events produced by an assignment (FK reverse)"
    roles: [Driver, StationOps, PlatformAdmin]
    code: 200
    input: []
    output: "RatingEvent[]"
    side_effects: []

  - method: POST
    path: "/assignments/{assignment_id}/depart"
    description: "Assignment ROUTE_ASSIGNED -> IN_DELIVERY; packages LOADED -> OUT_FOR_DELIVERY"
    roles: [Driver]
    code: 200
    input: []
    output: BlockAssignment
    side_effects: ["per BlockAssignment machine; increments BlockAssignment.version by 1"]

  - method: POST
    path: "/assignments/{assignment_id}/forfeit"
    description: "Driver-initiated forfeit from ASSIGNED; reliability strike and block relist"
    roles: [Driver]
    code: 200
    input: ["reason?"]
    output: BlockAssignment
    side_effects: ["per BlockAssignment ASSIGNED -> FORFEITED cascade"]

  - method: POST
    path: "/assignments/{assignment_id}/complete"
    description: "Station completes the assignment: rating event, pay statement, tier recompute, block completion"
    roles: [StationOps]
    code: 201
    input: []
    output: PayStatement
    side_effects: ["per BlockAssignment IN_DELIVERY -> COMPLETED cascade"]

  - method: GET
    path: "/assignments/{id}/pay-statement"
    description: "Get the pay statement of an assignment, 0 or 1 (FK reverse)"
    roles: [Driver, StationOps, PlatformAdmin]
    code: 200
    input: []
    output: "PayStatement[]"
    side_effects: []

  # --- Packages ---
  - method: POST
    path: "/packages/{package_id}/deliver"
    description: "Mark package delivered with photo evidence; computes photo_compliant and on_time_delivery"
    roles: [Driver]
    code: 200
    input: [photo_url, photo_gps_tagged]
    output: Package
    side_effects: ["per Package OUT_FOR_DELIVERY -> DELIVERED"]

  - method: POST
    path: "/packages/{package_id}/report-failed"
    description: "Mark package delivery failed"
    roles: [Driver]
    code: 200
    input: [reason]
    output: Package
    side_effects: ["per Package OUT_FOR_DELIVERY -> DELIVERY_FAILED"]

  # --- Pay statements ---
  - method: POST
    path: "/pay-statements/{pay_statement_id}/settle"
    description: "PayStatement OPEN -> SETTLED; adds to station pay liabilities"
    roles: [PlatformAdmin]
    code: 200
    input: []
    output: PayStatement
    side_effects: ["station.pay_liabilities_cents recomputed; increments PayStatement.version by 1"]

  - method: POST
    path: "/pay-statements/{pay_statement_id}/void"
    description: "PayStatement SETTLED -> VOIDED; removes from station pay liabilities (compensating action)"
    roles: [PlatformAdmin]
    code: 200
    input: []
    output: PayStatement
    side_effects: ["station.pay_liabilities_cents recomputed; increments PayStatement.version by 1"]

  # --- Appeals ---
  - method: POST
    path: "/drivers/{driver_id}/appeals"
    description: "Submit a deactivation appeal; driver must be DEACTIVATED with no other open appeal"
    roles: [Driver]
    code: 201
    input: [reason]
    output: Appeal
    side_effects: ["appeal status SUBMITTED, evidence_count 0"]

  - method: GET
    path: "/drivers/{id}/appeals"
    description: "List appeals of a driver (FK reverse)"
    roles: [Driver, AppealsReviewer, PlatformAdmin]
    code: 200
    input: ["status?", "limit?", "offset?"]
    output: "Appeal[]"
    side_effects: []

  - method: POST
    path: "/appeals/{appeal_id}/submit-evidence"
    description: "Driver submits evidence; SUBMITTED|EVIDENCE_REQUESTED -> UNDER_REVIEW"
    roles: [Driver]
    code: 200
    input: [evidence_note]
    output: Appeal
    side_effects: ["evidence_count += 1; increments Appeal.version by 1"]

  - method: POST
    path: "/appeals/{appeal_id}/request-evidence"
    description: "Reviewer requests more evidence; UNDER_REVIEW -> EVIDENCE_REQUESTED"
    roles: [AppealsReviewer]
    code: 200
    input: ["request_note?"]
    output: Appeal
    side_effects: ["increments Appeal.version by 1"]

  - method: POST
    path: "/appeals/{appeal_id}/decide"
    description: "Reviewer decides; UNDER_REVIEW -> UPHELD | OVERTURNED; requires evidence_count >= 1"
    roles: [AppealsReviewer]
    code: 200
    input: [decision, "decision_reason?"]
    output: Appeal
    side_effects: ["OVERTURNED reinstates the driver and reverses deactivation forfeit strikes"]

  # --- Driver feed ---
  - method: GET
    path: "/driver-feed/blocks"
    description: "Driver's visible block feed: PUBLISHED blocks with now >= starts_at - TIER_LEAD_MIN(driver tier), sorted by starts_at ASC, ties by created_at ASC"
    roles: [Driver]
    code: 200
    input: ["station_id?", "limit?", "offset?"]
    output: "DeliveryBlock[]"
    side_effects: []

# =============================================================================
# §1.6 Error Code Catalog
# =============================================================================
errors:
  - { id: ERR_VALIDATION, http: 400, condition: "Malformed JSON, missing required field, invalid enum member, unparseable datetime, non-positive money/weight, or clock set backward" }
  - { id: ERR_UNAUTHENTICATED, http: 401, condition: "Missing or unknown X-User-Role, or missing X-User-ID for a non-Anonymous role" }
  - { id: ERR_FORBIDDEN, http: 403, condition: "Role not permitted for the endpoint, or entity_backed ownership check failed" }
  - { id: ERR_NOT_FOUND, http: 404, condition: "Path or body FK reference does not exist" }
  - { id: ERR_STALE_VERSION, http: 412, condition: "expected_block_version / expected_station_version does not match the current parent version (OCC)" }
  - { id: ERR_INVALID_STATE, http: 409, condition: "Generic state-machine violation: transition not allowed from the current state (e.g. deliver before depart, decide a SUBMITTED appeal, settle a SETTLED statement)" }
  - { id: ERR_DRIVER_NOT_ACTIVE, http: 409, condition: "Driver status is not ACTIVE for an operation requiring an active driver (accept, check-in, deliver, forfeit)" }
  - { id: ERR_SCREENING_NOT_CLEARED, http: 409, condition: "Activation attempted while the latest BackgroundScreening is not CLEARED" }
  - { id: ERR_NO_ELIGIBLE_VEHICLE, http: 409, condition: "No ACTIVE vehicle with ATTESTED insurance (activation), or referenced vehicle missing/RETIRED/not the driver's (accept)" }
  - { id: ERR_INSURANCE_NOT_ATTESTED, http: 409, condition: "Vehicle insurance_status is NONE or EXPIRED at block acceptance" }
  - { id: ERR_INSURANCE_WINDOW_LAPSE, http: 409, condition: "At check-in: insurance_expires_on < date(block.ends_at); closed-interval containment violated" }
  - { id: ERR_VEHICLE_CLASS_MISMATCH, http: 409, condition: "Vehicle class rank below the block's required_vehicle_class rank" }
  - { id: ERR_BLOCK_NOT_PUBLISHED, http: 409, condition: "Accept or offer-create attempted on a block not in PUBLISHED status" }
  - { id: ERR_BLOCK_NOT_VISIBLE_YET, http: 409, condition: "First-come accept before the driver's tier visibility lead has opened" }
  - { id: ERR_BLOCK_WINDOW_OVERLAP, http: 409, condition: "Accept would give the driver two non-terminal assignments whose block windows overlap; half-open semantics: adjacency allowed" }
  - { id: ERR_OFFER_BUFFER_CONFLICT, http: 409, condition: "Reserved offer whose block window sits < 30 minutes (gap, either direction) from an existing non-terminal assignment window of the driver; exactly 30 minutes is allowed" }
  - { id: ERR_OFFER_EXPIRED, http: 409, condition: "Accept/decline attempted when now >= offer.expires_at" }
  - { id: ERR_OFFER_WRONG_DRIVER, http: 403, condition: "Offer acted on by a driver other than offer.driver_id" }
  - { id: ERR_CHECKIN_TOO_EARLY, http: 409, condition: "Check-in before block.starts_at - 30 minutes" }
  - { id: ERR_CHECKIN_WINDOW_CLOSED, http: 409, condition: "Check-in after block.starts_at + 15 minutes" }
  - { id: ERR_APPEAL_NOT_OPEN, http: 409, condition: "Appeal submitted while driver is not DEACTIVATED, or another open appeal (SUBMITTED|UNDER_REVIEW|EVIDENCE_REQUESTED) exists" }
  - { id: ERR_PACKAGE_NOT_DELIVERABLE, http: 409, condition: "Deliver/report-failed on a package not OUT_FOR_DELIVERY, or completion attempted with packages still LOADED/OUT_FOR_DELIVERY" }
  - { id: ERR_DUPLICATE_EMAIL, http: 409, condition: "Driver registration with an email already registered" }
  - { id: ERR_DUPLICATE_VIN, http: 409, condition: "Vehicle registration with a VIN already held by an ACTIVE vehicle" }

# =============================================================================
# §1.7 RBAC Matrix
# =============================================================================
roles:
  - name: Anonymous
    description: "Unauthenticated caller; may only register as a driver"
    identity: opaque
    exclusive_operations:
      - "POST /drivers/register"
    shared_operations: []

  - name: Driver
    description: "Onboarded crowdsourced driver acting on their own onboarding, vehicles, offers, assignments, packages and appeals"
    identity: "entity_backed:Driver"
    exclusive_operations:
      - "POST /drivers/{driver_id}/vehicles, POST /vehicles/{vehicle_id}/attest-insurance, POST /vehicles/{vehicle_id}/retire"
      - "POST /screenings/{screening_id}/reopen"
      - "POST /blocks/{block_id}/accept, POST /offers/{offer_id}/accept, POST /offers/{offer_id}/decline"
      - "POST /assignments/{assignment_id}/check-in, /depart, /forfeit"
      - "POST /packages/{package_id}/deliver, /report-failed"
      - "POST /drivers/{driver_id}/appeals, POST /appeals/{appeal_id}/submit-evidence"
      - "GET /driver-feed/blocks"
    shared_operations:
      - "GET /drivers/{driver_id}, GET /drivers/{id}/screenings, /vehicles, /assignments, /offers, /appeals, /rating-events"
      - "GET /blocks/{block_id}, GET /assignments/{assignment_id}, GET /assignments/{id}/packages, /pay-statement, /rating-events"
      - "GET /blocks/{id}/assignments, GET /offers/{id}/assignments, GET /vehicles/{id}/assignments"

  - name: StationOps
    description: "Station operator publishing blocks, running surge cycles, scanning out packages, completing assignments"
    identity: opaque
    exclusive_operations:
      - "POST /stations/{station_id}/blocks, POST /blocks/{block_id}/publish, /revise, /cancel"
      - "POST /blocks/{block_id}/offers"
      - "POST /stations/{station_id}/run-surge-cycle"
      - "POST /assignments/{assignment_id}/load-packages, /complete"
    shared_operations:
      - "GET /stations/{station_id}, GET /stations/{id}/blocks"
      - "GET /blocks/{block_id}, GET /blocks/{id}/offers, /assignments"
      - "GET /drivers/{driver_id}, GET /drivers/{id}/assignments, /offers"
      - "GET /assignments/{assignment_id}, GET /assignments/{id}/packages, /pay-statement, /rating-events"
      - "GET /offers/{id}/assignments, GET /vehicles/{id}/assignments"

  - name: PlatformAdmin
    description: "Platform administrator: stations, screening review, driver activation/deactivation, settlement, clock"
    identity: opaque
    exclusive_operations:
      - "POST /stations, POST /_clock/set_current_utc"
      - "POST /screenings/{screening_id}/begin-review, /decide"
      - "POST /drivers/{driver_id}/activate, /deactivate"
      - "POST /pay-statements/{pay_statement_id}/settle, /void"
    shared_operations:
      - "GET /stations/{station_id}, GET /stations/{id}/blocks"
      - "GET /drivers/{driver_id} and all driver sub-lists, GET /blocks/{block_id} and block sub-lists"
      - "GET /assignments/{assignment_id} and assignment sub-lists, GET /offers/{id}/assignments, GET /vehicles/{id}/assignments"

  - name: AppealsReviewer
    description: "Independent reviewer for deactivation appeals; segregated from PlatformAdmin (the deactivating role cannot decide appeals)"
    identity: opaque
    exclusive_operations:
      - "POST /appeals/{appeal_id}/request-evidence, /decide"
    shared_operations:
      - "GET /drivers/{driver_id}, GET /drivers/{id}/appeals"
