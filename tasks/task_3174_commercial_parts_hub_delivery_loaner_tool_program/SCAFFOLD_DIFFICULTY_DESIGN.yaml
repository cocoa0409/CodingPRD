        as: ToolCribAttendant
        captures:
          err_route: $.data.error_id
      assert:
      - 'the route cancel succeeds: ServiceRoute.${r2}.status == "CANCELLED" and every stop on it is REJECTED'
      - 'the dependent close is now rejected: ${err_route} == "ERR_RETURN_DESK_STOP_MISSING" with http 409'
      - ToolLoan.${ln2}.status == "INSPECTED" and ToolLoan.${ln2}.deposit_state == "HELD" — the deposit is still with the store
      - CommercialAccount.${acct}.petty_cash_cents == 4500, so no refund escaped on the rejected close
      - with the route still DISPATCHED the identical close would have refunded 4500 and set deposit_state to REFUNDED — only ServiceRoute.${r2}.status changed
