            - "CourtTestimony.${t2_id}.scheduled_start == 2026-07-01T13:01:00Z"
            - "Case.${case_id}.court_hold == true"

  # =========================================================================
  # Rule 9 — Compensating-action invariants across different conserved quantities
  # =========================================================================
  - rule_id: compensating_invariant
    instances:

      - name: retainer_cents_conservation_on_expense_reverse
        grounds:
          - state_machines.ExpenseEntry.SUBMITTED_to_APPROVED
          - state_machines.ExpenseEntry.APPROVED_to_REVERSED
          - calculations.retainer_balance
          - entities.Case.fields.retainer_balance_cents
          - entities.RetainerLedgerEntry.fields.balance_after_cents
        distinguishing_aspect: |
          Conserved quantity #1 = MONEY (cents): after the forward action (expense approval, DRAW 80000)
          and its compensating action (expense reversal, REFUND 80000), the invariant
          Case.retainer_balance_cents == sum(DEPOSIT) - sum(DRAW) + sum(REFUND) == 100000 holds exactly,
          the case returns to ACTIVE, and the ledger carries all three entries with no drift.
        test_recipe:
          setup:
            - "Case with a single 100000-cent deposit; LEAD-assigned CA-licensed investigator."
            - "One 80000-cent expense APPROVED, which drew the balance to 20000 and suspended the case."
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-06-01T00:00:00Z" }
              as: PlatformAdmin
            - call: "POST /clients"
              payload: { legal_name: "Ada Law LLP", contact_email: "ada@law.test" }
              as: CaseManager
              captures: { cl_id: $.data.id }
            - call: "POST /investigators"
              payload: { full_name: "Ivy Nguyen", seniority: "JUNIOR", hourly_rate_cents: 8333 }
              as: PlatformAdmin
              captures: { inv1_id: $.data.id }
            - call: "POST /investigators/${inv1_id}/licenses"
              payload: { state_code: "CA", license_number: "CA-1001", valid_from: "2026-01-01T00:00:00Z", valid_until: "2027-01-01T00:00:00Z" }
              as: ComplianceOfficer
            - call: "POST /cases"
              payload: { client_id: "${cl_id}", case_type: "SKIP_TRACE", jurisdiction_state: "CA", subject_name: "Sam Subject" }
              as: CaseManager
              captures: { case_id: $.data.id }
            - call: "POST /cases/${case_id}/conflict-check"
              payload: { decision: "CLEAR" }
              as: ComplianceOfficer
            - call: "POST /cases/${case_id}/retainer"
              payload: { amount_cents: 100000 }
              as: CaseManager
            - call: "POST /assignments"
              payload: { case_id: "${case_id}", investigator_id: "${inv1_id}", role_on_case: "LEAD" }
              as: CaseManager
            - call: "POST /expense-entries"
              payload: { case_id: "${case_id}", category: "EQUIPMENT", amount_cents: 80000, incurred_at: "2026-06-02T09:00:00Z" }
              as: Investigator
              as_user_id: "${inv1_id}"
              captures: { e1_id: $.data.id }
            - call: "POST /expense-entries/${e1_id}/decision"
              payload: { decision: "APPROVE" }
              as: CaseManager
          trigger:
            - call: "POST /expense-entries/${e1_id}/reverse"
              payload: { reason: "Duplicate claim" }
              as: CaseManager
              captures: { exp_status: $.data.status }
          assert:
            - "ExpenseEntry.${e1_id}.status == REVERSED"
            - "Case.${case_id}.retainer_balance_cents == 100000"
            - "Case.${case_id}.total_deposit_cents == 100000"
            - "Case.${case_id}.status == ACTIVE"
            - "GET /cases/${case_id}/ledger returns 3 rows in seq ASC: (1 DEPOSIT 100000 balance_after_cents 100000), (2 DRAW 80000 balance_after_cents 20000), (3 REFUND 80000 balance_after_cents 100000)"

      - name: billable_minutes_conservation_on_session_void
        grounds:
          - state_machines.SurveillanceSession.IN_PROGRESS_to_COMPLETED
          - state_machines.SurveillanceSession.COMPLETED_to_VOIDED
          - calculations.case_billable_minutes
          - entities.Case.fields.billable_minutes_total
        distinguishing_aspect: |
          Conserved quantity #2 = TIME (billable minutes), a different type from the money invariant:
          the forward action (session complete, +90 minutes) and its compensating action (session void)
          must leave Case.billable_minutes_total == sum(billable_minutes of COMPLETED sessions) == 0,
          with the voided session's own billable_minutes and session_charge_cents reset to 0.
        test_recipe:
          setup:
            - "ACTIVE CA case with a 500000-cent retainer, LEAD-assigned CA-licensed investigator at 8333 cents/hour."
            - "One COMPLETED 90-minute daytime session (billable_minutes 90, session_charge_cents 12500); no invoice has been issued."
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-06-01T00:00:00Z" }
              as: PlatformAdmin
            - call: "POST /clients"
              payload: { legal_name: "Ada Law LLP", contact_email: "ada@law.test" }
              as: CaseManager
              captures: { cl_id: $.data.id }
            - call: "POST /investigators"
              payload: { full_name: "Ivy Nguyen", seniority: "JUNIOR", hourly_rate_cents: 8333 }
              as: PlatformAdmin
              captures: { inv1_id: $.data.id }
            - call: "POST /investigators/${inv1_id}/licenses"
              payload: { state_code: "CA", license_number: "CA-1001", valid_from: "2026-01-01T00:00:00Z", valid_until: "2027-01-01T00:00:00Z" }
              as: ComplianceOfficer
            - call: "POST /cases"
              payload: { client_id: "${cl_id}", case_type: "SURVEILLANCE", jurisdiction_state: "CA", subject_name: "Sam Subject" }
              as: CaseManager
              captures: { case_id: $.data.id }
            - call: "POST /cases/${case_id}/conflict-check"
              payload: { decision: "CLEAR" }
              as: ComplianceOfficer
            - call: "POST /cases/${case_id}/retainer"
              payload: { amount_cents: 500000 }
              as: CaseManager
            - call: "POST /assignments"
              payload: { case_id: "${case_id}", investigator_id: "${inv1_id}", role_on_case: "LEAD" }
              as: CaseManager
            - call: "POST /surveillance-sessions"
              payload: { case_id: "${case_id}", investigator_id: "${inv1_id}", start_at: "2026-06-02T09:00:00Z", end_at: "2026-06-02T10:30:00Z", location: "Post A" }
              as: Investigator
              as_user_id: "${inv1_id}"
              captures: { s1_id: $.data.id }
            - call: "POST /surveillance-sessions/${s1_id}/start"
              payload: {}
              as: Investigator
              as_user_id: "${inv1_id}"
            - call: "POST /surveillance-sessions/${s1_id}/complete"
              payload: { mileage_miles: 10 }
              as: Investigator
              as_user_id: "${inv1_id}"
              captures: { minutes_after_complete: $.data.billable_minutes, charge_after_complete: $.data.session_charge_cents }
          trigger:
            - call: "POST /surveillance-sessions/${s1_id}/void"
              payload: { reason: "Subject misidentified" }
              as: CaseManager
              captures: { s1_status: $.data.status }
          assert:
            - "${minutes_after_complete} == 90"
            - "${charge_after_complete} == 13170"
            - "SurveillanceSession.${s1_id}.status == VOIDED"
            - "SurveillanceSession.${s1_id}.billable_minutes == 0"
            - "SurveillanceSession.${s1_id}.session_charge_cents == 0"
            - "Case.${case_id}.billable_minutes_total == 0"
