        distinguishing_aspect: |
          Conserved quantity: the 6 physical seats of one TicketClass. Every
          write moves seats between the sold, held, released and available pools
          and the four must always re-sum to seats_allocated: 0+2+0+4 after the
          hold, 2+0+0+4 after the confirm, 2+0+2+2 after the release run, and
          0+0+2+4 after the cancellation. The released pool is a persisted pool
          rather than a rollup, so the cancellation returns its seats to
          available and deliberately does NOT unwind the release.
