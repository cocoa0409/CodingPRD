            - "trigger 4: HTTP 409 ERR_BORROWER_NOT_ELIGIBLE - ba is still PROSPECT, the same code from a different clause of the same row"
            - "trigger 5-6: HTTP 200 each - ba.guarantee_status == EXECUTED then status == APPROVED_SPONSOR"
            - "trigger 7: HTTP 201 - the byte-identical body from trigger 4 now creates a DRAFT LoanApplication, so the earlier refusal was the sponsor gate and not the payload"
