            - call: "POST /wellness/bookings/${bk_out_id}/check-in"
              payload: {}
              as: Client
              as_user_id: "${maya_out_id}"
            - call: "POST /wellness/bookings/${bk_in_id}/check-in"
              payload: {}
              as: Client
              as_user_id: "${maya_in_id}"
          trigger:
            - call: "POST /wellness/class-sessions/${sess_out_id}/complete"
              payload: {}
              as: PlatformAdmin
            - call: "POST /wellness/class-sessions/${sess_in_id}/complete"
              payload: {}
              as: PlatformAdmin
          assert:
            - "the BONUS_OUTSIDE_CAP studio's entry has commission_cents == 1383: 988 for the first attended seat at the GROWTH teaching rate on a 3953-cent marketplace base, then the 395-cent channel bonus added after the 1200-cent ceiling"
            - "the BONUS_INSIDE_CAP studio's entry has commission_cents == 1200: the 988 teaching commission and the 395 bonus are folded together first, then clipped to the 1200 ceiling"
            - "both studios posted the same base_amount_cents and accrued their commission in CommissionEntry rows with status ACCRUED"
            - "the difference 1383 - 1200 == 183 is exactly the part of the channel bonus that the BONUS_OUTSIDE_CAP order let escape the ceiling"

  # ===========================================================================
  - rule_id: non_linear_state_machine
    instances:

      - name: booking_no_show_reverses_back_to_reserved_by_compensating_action
        grounds:
          - state_machines.Booking.NO_SHOW_to_RESERVED
          - state_machines.Booking.RESERVED_to_NO_SHOW
          - state_machines.ClassSession.IN_PROGRESS_to_COMPLETED
          - validations.priority_4_state
          - errors.ERR_RESTORE_WINDOW_CLOSED
        distinguishing_aspect: "Booking is a cycle rather than a pipeline: NO_SHOW → RESERVED is reachable through a compensating action, so the machine must hold a booking in a non-terminal state whose producing session is already COMPLETED — a combination no linear A→B→C→D machine can express."
        test_recipe:
          setup:
            - "Logical clock at 2026-06-01T00:00:00Z. GROWTH studio with a payroll period, one template, one instructor, one client and one capacity-2 session on 2026-06-20T17:00:00Z."
          setup_api_calls:
            - *b4_a0_tier_growth
            - *b4_a0_clock_jun
            - *b4_a0_studio_growth
            - *b4_a0_sub_v_read
            - *b4_a0_pp_june
            - *b4_a0_tpl_flow
            - *b4_a0_staff_ivy
            - *b7_a2_sess_cap1
            - *b4_a0_client_maya
            - call: "POST /wellness/bookings"
              payload: { client_id: "${maya_id}", class_session_id: "${sess1_id}", channel: "STUDIO", payment_source: "DROP_IN" }
              as: Client
              as_user_id: "${maya_id}"
              captures: { bk_cycle_id: $.data.id }
          trigger:
            - call: "POST /wellness/class-sessions/${sess1_id}/complete"
              payload: {}
              as: PlatformAdmin
            - call: "POST /wellness/bookings/${bk_cycle_id}/restore-no-show"
              payload: { reason: "client was present, front desk missed the check-in" }
              as: StudioOwner
              as_user_id: "${studio_id}"
          assert:
            - "before the trigger, the completed session drove Booking.${bk_cycle_id} to status NO_SHOW"
            - "after the compensating action Booking.${bk_cycle_id}.status == RESERVED, so the machine has moved backwards into a live state"
            - "the combination Booking.status == RESERVED with ClassSession.${sess1_id}.status == COMPLETED is reachable only through the cycle"
            - "Booking.${bk_cycle_id}.fee_status == WAIVED and Client.${maya_id}.no_show_strike_count == 0"
            - "GET /wellness/bookings?status=NO_SHOW returns 0 rows and GET /wellness/bookings?status=RESERVED returns 1 row"

      - name: portability_export_lapse_returns_the_grant_for_a_second_issue
        grounds:
          - state_machines.ClientPortabilityRequest.EXPORT_ISSUED_to_RESOLVED_RELEASE
          - state_machines.ClientPortabilityRequest.RESOLVED_RELEASE_to_EXPORT_ISSUED
          - state_machines.ClientPortabilityRequest.RESOLVED_RELEASE_to_EXPIRED
          - errors.ERR_EXPORT_NOT_GRANTED
          - endpoints.POST_/wellness/portability-requests/{id}/issue-export
        distinguishing_aspect: "ClientPortabilityRequest loops EXPORT_ISSUED → RESOLVED_RELEASE → EXPORT_ISSUED, and the loop is guarded by the export-window and download-count conditions, so the same row must be able to hold a cleared manifest, re-mint a grant id, and then be refused entirely once the download cap is reached."
        test_recipe:
          setup:
            - "Logical clock at 2026-06-01T00:00:00Z. ENTERPRISE studio (its tier carries crm_client_export_enabled), one client with a zero outstanding balance, and a portability request filed against the studio."
          setup_api_calls:
            - &b11_a5_tier_ent
              call: "POST /wellness/subscription-tiers"
              payload: { tier: "ENTERPRISE", monthly_fee_cents: 24900, tier_rank: 3, included_staff_seats: 12, seat_overage_fee_cents: 1900, marketplace_listing_enabled: true, staff_payroll_enabled: true, instructor_substitution_enabled: true, waitlist_auto_promotion_enabled: true, crm_client_export_enabled: true, marketplace_commission_bps: 1200 }
              as: PlatformAdmin
            - *b4_a0_clock_jun
            - &b11_a5_studio_ent
              call: "POST /wellness/studios"
              payload: { legal_name: "Prana Collective", home_state_code: "CA", owner_full_name: "Nadia Okafor", tier: "ENTERPRISE", billing_period: "MONTHLY", payroll_cap_mode: "BONUS_OUTSIDE_CAP" }
              as: Anonymous
              captures: { studio_id: $.data.id, studio_v: $.data.version, sub_id: $.data.subscription_id, sub_v: $.data.version }
            - *b4_a0_client_maya
            - call: "POST /wellness/portability-requests"
              payload: { studio_id: "${studio_id}", requesting_client_id: "${maya_id}", dispute_reason: "moving to a competing studio" }
              as: Client
              as_user_id: "${maya_id}"
              captures: { pr_id: $.data.id, pr_v0: $.data.version }
            - call: "POST /wellness/portability-requests/${pr_id}/resolve-release"
              payload: { include_booking_history: true, include_financial_history: false }
              as: StudioOwner
              as_user_id: "${studio_id}"
              captures: { pr_v1: $.data.version }
            - call: "POST /wellness/portability-requests/${pr_id}/issue-export"
              payload: { expected_portability_request_version: "${pr_v1}" }
              as: PlatformAdmin
              captures: { pr_v2: $.data.version }
          trigger:
            - call: "POST /_clock/set_current_utc"
              payload: { current_utc: "2026-06-05T00:00:00Z" }
              as: OperatorOnly
            - call: "GET /wellness/portability-requests/${pr_id}"
              payload: {}
              as: PlatformAdmin
              captures: { pr_v3: $.data.version }
            - call: "POST /wellness/portability-requests/${pr_id}/issue-export"
              payload: { expected_portability_request_version: "${pr_v3}" }
              as: PlatformAdmin
          assert:
            - "the export window is 72 hours from decided_at == 2026-06-01T00:00:00Z, so the 2026-06-05 clock position lapses an export that was never downloaded"
            - "before the lapse the row was EXPORT_ISSUED; after the clock advance it is RESOLVED_RELEASE again with export_grant_id and export_manifest cleared"
            - "the second issue-export succeeds rather than raising ERR_EXPORT_NOT_GRANTED, and the row is EXPORT_ISSUED once more with a freshly minted export_grant_id"
            - "the re-issued grant id differs from the original one"
            - "a third issue-export is refused with ERR_EXPORT_DOWNLOAD_CAP only after export_download_count reaches EXPORT_MAX_DOWNLOADS == 3"

  # ===========================================================================
  - rule_id: transitive_cascade
    instances:

      - name: subscription_lapse_closes_sessions_and_purges_their_waitlists
        grounds:
          - state_machines.BusinessSubscription.GRACE_to_SUSPENDED
          - state_machines.Studio.ACTIVE_to_SUSPENDED
          - state_machines.ClassSession.SCHEDULED_to_CANCELLED_BY_STUDIO
          - state_machines.WaitlistEntry.OFFERED_to_EXPIRED
          - entities.ClassSession.fields.fullness_posture
        distinguishing_aspect: "A three-hop chain driven by one transition: the grace window lapsing on BusinessSubscription mutates Studio, and that mutation — not the clock — is what closes each SCHEDULED ClassSession, and that closure in turn expires the session's OFFERED waitlist holds."
        test_recipe:
          setup:
            - "Logical clock at 2026-06-01T00:00:00Z. GROWTH studio whose failed renewal leaves it in GRACE with grace_until 2026-07-09T00:00:00Z, a payroll period covering July, a capacity-1 session on 2026-07-15T17:00:00Z, a booking for a pack-holding client A, and an ACTIVE hold for client B."
          setup_api_calls:
            - *b4_a0_tier_growth
            - *b4_a0_clock_jun
            - *b4_a0_studio_growth
            - *b4_a0_sub_v_read
            - call: "POST /wellness/subscriptions/${sub_id}/advance-renewal"
              payload: { advance_clock: false, outcome: "FAILED", expected_subscription_version: "${sub_v}" }
              as: StudioOwner
              as_user_id: "${studio_id}"
              captures: { sub_v_pd: $.data.version }
            - call: "POST /_clock/set_current_utc"
              payload: { current_utc: "2026-07-02T00:00:00Z" }
              as: OperatorOnly
            - call: "POST /wellness/payroll-periods"
              payload: { studio_id: "${studio_id}", period_index: 1, start_date: "2026-07-01T00:00:00Z", end_date: "2026-07-31T23:59:59Z" }
              as: StudioOwner
              as_user_id: "${studio_id}"
              captures: { pp_jul_id: $.data.id }
            - call: "POST /wellness/class-templates"
              payload: { studio_id: "${studio_id}", name: "Reformer Flow 50", duration_minutes: 50, base_price_cents: 4000, default_capacity: 1, credit_cost: 1, is_off_peak: true, buffer_minutes: 15 }
              as: StudioOwner
              as_user_id: "${studio_id}"
              captures: { tpl_id: $.data.id }
            - call: "POST /wellness/staff-members"
              payload: { studio_id: "${studio_id}", full_name: "Ivy Chen", staff_role: "INSTRUCTOR", primary_class_template_id: "${tpl_id}", substitute_class_template_ids: ["${tpl_id}"], commission_rate_bps: 5000 }
              as: StudioOwner
              as_user_id: "${studio_id}"
              captures: { ivy_id: $.data.id }
            - call: "POST /wellness/class-sessions"
              payload: { studio_id: "${studio_id}", class_template_id: "${tpl_id}", instructor_staff_id: "${ivy_id}", room_code: "ROOM-A", start_at: "2026-07-15T17:00:00Z", capacity: 1, expected_subscription_version: "${sub_v_pd}" }
              as: StudioOwner
              as_user_id: "${studio_id}"
              captures: { sess_id: $.data.id }
            - *b4_a0_client_maya
            - call: "POST /wellness/clients"
              payload: { home_studio_id: "${studio_id}", display_name: "Bea Tan", email: "bea@example.com", home_state_code: "CA" }
              as: Client
              captures: { bea_id: $.data.id }
            - call: "POST /wellness/bookings"
              payload: { client_id: "${maya_id}", class_session_id: "${sess_id}", channel: "STUDIO", payment_source: "DROP_IN" }
              as: Client
              as_user_id: "${maya_id}"
              captures: { bk_a_id: $.data.id }
            - call: "POST /wellness/waitlist-entries"
              payload: { class_session_id: "${sess_id}", client_id: "${bea_id}", position_mode: "QUEUED" }
              as: Client
              as_user_id: "${bea_id}"
              captures: { wl_b_id: $.data.id }
            - call: "POST /wellness/bookings/${bk_a_id}/cancel"
              payload: { reason: "schedule conflict" }
              as: Client
              as_user_id: "${maya_id}"
          trigger:
            - call: "POST /_clock/set_current_utc"
              payload: { current_utc: "2026-07-10T00:00:00Z" }
              as: OperatorOnly
          assert:
            - "hop 1: BusinessSubscription.status == SUSPENDED because the clock passed grace_until 2026-07-09T00:00:00Z"
            - "hop 2: Studio.status == SUSPENDED with suspension_reason populated, and BusinessSubscription.payroll_hold == true"
            - "hop 3: ClassSession.${sess_id}.status == CANCELLED_BY_STUDIO and its fullness_posture == CANCELLED"
            - "hop 4: WaitlistEntry.${wl_b_id}.status == EXPIRED — it was OFFERED before the lapse, because the cancel freed the session's only seat"
            - "GET /wellness/bookings?class_session_id=${sess_id} reports the booking as CANCELLED with fee_status NONE, and no waitlist hold for the session is left in ACTIVE, STANDBY or OFFERED"

      - name: cancelling_a_seat_offers_the_hold_and_the_lapse_of_that_offer_reopens_the_session
        grounds:
          - state_machines.Booking.RESERVED_to_CANCELLED
          - state_machines.WaitlistEntry.ACTIVE_to_OFFERED
          - state_machines.WaitlistEntry.OFFERED_to_EXPIRED
          - calculations.seat_availability_posture
          - entities.WaitlistEntry.fields.effective_sequence
        distinguishing_aspect: "A two-hop chain whose second hop is caused by the first hop's own object, not by the original cancel: the cancel frees a seat and offers it to the highest-ranked hold, and that hold's expiry — a separate transition — is what finally releases the seat and moves the session's posture out of FULL."
        test_recipe:
          setup:
            - "Logical clock at 2026-06-01T00:00:00Z. GROWTH studio, payroll period, template, instructor, a capacity-1 session on 2026-06-20T17:00:00Z, client A booked on it, and client B holding the session's only waitlist position."
          setup_api_calls:
            - *b4_a0_tier_growth
            - *b4_a0_clock_jun
            - *b4_a0_studio_growth
            - *b4_a0_sub_v_read
            - *b4_a0_pp_june
            - *b4_a0_tpl_flow
            - *b4_a0_staff_ivy
            - *b7_a2_sess_cap1
            - *b4_a0_client_maya
            - call: "POST /wellness/clients"
              payload: { home_studio_id: "${studio_id}", display_name: "Bea Tan", email: "bea@example.com", home_state_code: "CA" }
              as: Client
              captures: { bea_id: $.data.id }
            - call: "POST /wellness/bookings"
              payload: { client_id: "${maya_id}", class_session_id: "${sess1_id}", channel: "STUDIO", payment_source: "DROP_IN" }
              as: Client
              as_user_id: "${maya_id}"
              captures: { bk_a_id: $.data.id }
            - call: "POST /wellness/waitlist-entries"
              payload: { class_session_id: "${sess1_id}", client_id: "${bea_id}", position_mode: "QUEUED" }
              as: Client
              as_user_id: "${bea_id}"
              captures: { wl_b_id: $.data.id }
          trigger:
            - call: "POST /wellness/bookings/${bk_a_id}/cancel"
              payload: { reason: "schedule conflict" }
              as: Client
              as_user_id: "${maya_id}"
          assert:
            - "hop 1: the cancel frees the only seat, so WaitlistEntry.${wl_b_id}.status == OFFERED with offer_expires_at == now_utc + 120 minutes"
            - "hop 1 side effect: ClassSession.${sess1_id}.seats_taken == 0 and seats_held == 1, so fullness_posture is still FULL — the seat is held, not free"
            - "hop 2: after POST /_clock/set_current_utc to 2026-06-20T17:00:00Z, WaitlistEntry.${wl_b_id}.status == EXPIRED and ClassSession.${sess1_id}.seats_held == 0"
            - "hop 2 side effect: fullness_posture leaves FULL because no entry remains in the session's candidate pool under waitlist_offer_order"
            - "the freed seat is held for OFFER_HOLD_HOLD_MINUTES rather than being offered again, since the candidate pool is empty"

