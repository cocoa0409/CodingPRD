  # ===========================================================================
  # Section: rbac (incl. segregation-of-duties rows from the guide)
  # ===========================================================================
  - section: rbac
    instances:
      - name: rbac_technologist_cannot_create_supplier
        claim_type: rbac_denial
        grounds:
          - "roles[BloodBankTechnologist]"
          - "errors[ERR_UNAUTHORIZED_ROLE]"
        distinguishing_aspect: "Supplier management is Supervisor-exclusive."
        test_recipe:
          setup: ["empty DB"]
          setup_api_calls: []
          trigger:
            - call: "POST /blood-bank/suppliers"
              payload: { name: "BadActor Blood", license_number: "LIC-999" }
              as: BloodBankTechnologist
              captures: { err: $.data.error_id }
          assert:
            - "response is 403 ERR_UNAUTHORIZED_ROLE"
      - name: rbac_physician_cannot_verify_order
        claim_type: rbac_denial
        grounds:
          - "roles[OrderingPhysician]"
          - "errors[ERR_UNAUTHORIZED_ROLE]"
        distinguishing_aspect: "Order verification is Technologist-exclusive; RBAC (P2) fires before any state or segregation logic."
        test_recipe:
          setup: ["patient + order created by doc-1"]
          setup_api_calls:
            - call: "POST /blood-bank/patients"
              payload: { mrn: "M-5001", full_name: "Uma Doe", date_of_birth: "1983-03-03" }
              as: BloodBankTechnologist
              captures: { pat: $.data.id }
            - call: "POST /blood-bank/transfusion-orders"
              payload: { patient_id: "${pat}", product_type: "FFP", units_requested: 1, urgency: "ROUTINE", indication_code: "COAG" }
              as: OrderingPhysician
              as_user_id: "doc-1"
              captures: { ord: $.data.id }
          trigger:
            - call: "POST /blood-bank/transfusion-orders/${ord}/verify"
              as: OrderingPhysician
              as_user_id: "doc-2"
              captures: { err: $.data.error_id }
          assert:
            - "response is 403 ERR_UNAUTHORIZED_ROLE"
            - "TransfusionOrder.${ord}.status stays PENDING_VERIFICATION"
      - name: rbac_coordinator_cannot_create_recall
        claim_type: rbac_denial
        grounds:
          - "roles[SupplierCoordinator]"
          - "errors[ERR_UNAUTHORIZED_ROLE]"
        distinguishing_aspect: "Recall management is QualityOfficer-exclusive."
        test_recipe:
          setup: ["empty DB"]
          setup_api_calls: []
          trigger:
            - call: "POST /blood-bank/recall-cases"
              payload: { scope_type: "DONOR", donor_id: "D-1", reason: "coordinator attempt", disposition: "DESTRUCTION" }
              as: SupplierCoordinator
              captures: { err: $.data.error_id }
          assert:
            - "response is 403 ERR_UNAUTHORIZED_ROLE"
