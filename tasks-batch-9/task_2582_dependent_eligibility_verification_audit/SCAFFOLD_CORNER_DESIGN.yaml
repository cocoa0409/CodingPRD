        distinguishing_aspect: "Replaying the same expected_program_version that already succeeded returns 412 ERR_STALE_PROGRAM_VERSION and creates no case, while re-reading the program and re-scoping with the fresh version succeeds and supersedes the first case set - so the program ends with one VOIDED and one SELECTED case, not three."
