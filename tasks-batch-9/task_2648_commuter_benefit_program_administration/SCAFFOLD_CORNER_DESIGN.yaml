              as: OrderDesk
              as_user_id: "desk-b"
            - call: "POST /benefits/media-orders/${mo_id}/ship"
              payload: { tracking_ref: "TRK-LL-1" }
              as: OrderDesk
              as_user_id: "desk-a"
            - call: "POST /benefits/media-orders/${mo_id}/confirm-delivery"
