# =============================================================================
# SCAFFOLD.yaml — Moving & Relocation Booking
# Difficulty: Expert (12 entities, 31 endpoints, 27 errors, 5 state machines)
# =============================================================================

scenario: "Moving & Relocation Booking: inventory survey/cubic-feet estimate, binding vs non-binding estimate, packing/crating add-on, valuation coverage (released vs full-value), long-haul vs local hourly, crew/truck dispatch, storage-in-transit, damage claim"

domain_name: "moving-relocation"
api_prefix: ""

complexity_profile:
  primary_archetype: pricing_engine
  secondary_archetype: temporal_windowing
  complexity_layers:
    - optimistic_concurrency
    - dual_variant_calculation
    - cascading_side_effects
    - rate_threshold_triggers

  entity_topology: flat
  # Peer entities linked by foreign keys; MoveJob is the hub but children are
  # addressed at top-level collections (/estimates, /dispatches, /storage-lots,
  # /damage-claims) with a move_job_id FK in the body, not nested in the URL.

  state_machine_shape: parallel
  # MoveJob carries two independent dimensions (job_status x payment_status).
  # Estimate is cyclic (DRAFT<->REVISED revision loop). Dispatch is branching
  # (SCHEDULED -> {EN_ROUTE -> COMPLETED} | CANCELLED). DamageClaim is
  # branching with revert (UNDER_REVIEW -> {APPROVED|DENIED}; APPROVED can
  # reopen to UNDER_REVIEW). StorageLot is linear with accrual side-effects.

  relationship_patterns:
    - one_to_many        # MoveJob -> Estimate, Survey, Dispatch, StorageLot, DamageClaim
    - cross_aggregate    # Dispatch references Truck and Crew (resource pool)

  role_model: segregation_of_duties
  # The Estimator who authored an Estimate may not ACCEPT it (the booking
  # customer accepts). The ClaimsAdjuster who is the same opaque user that
  # filed (intook) a DamageClaim may not adjudicate it. Dispatcher owns the
  # truck/crew pool. Peer ownership across resource types is layered on top.

  consistency_model: immediate

# =============================================================================
# 1.0 Response Envelope (FIXED — EMITTED VERBATIM)
# =============================================================================
response_envelope:
  success: |
    { "meta": { "api_request_id": "req_xxx", "api_request_timestamp": "ISO8601" },
      "response_type": "object" | "array", "data": {} }
  error: |
    { "meta": { ... }, "response_type": "error",
      "data": { "error_id": "ERR_XXX", "message": "..." } }
  pagination_fields: ["limit", "offset", "total_count", "has_more"]
  pagination_defaults: { limit: 10, min: 1, max: 100, offset: 0 }

# =============================================================================
# 1.1 Entity-Relationship Table
# =============================================================================
entities:
  - name: Customer
    parent: null
    common_fields: true
    fields:
      - name: email
        type: string
        source: input
        description: "Login/contact email; unique across all Customers."
        constraints: "unique; non-empty"
      - name: full_name
        type: string
        source: input
        description: "Customer legal name on the bill of lading."
      - name: origin_state_code
        type: string
        source: input
        description: "Two-letter state code of the origin residence."
        constraints: "2 uppercase letters"
      - name: phone
        type: string
        source: input
        description: "Contact phone number."

  - name: MoveJob
    parent: null
    common_fields: true
    fields:
      - name: customer_id
        type: string
        source: input
        description: "FK -> Customer.id; the booking customer who owns this job."
      - name: service_type
        type: enum
        source: input
        description: "Pricing model selector: LOCAL bills hourly, LONG_HAUL bills by weight tariff."
        constraints: "one of {LOCAL, LONG_HAUL}"
      - name: origin_zip
        type: string
        source: input
        description: "Origin postal code."
      - name: destination_zip
        type: string
        source: input
        description: "Destination postal code."
      - name: distance_miles
        type: integer
        source: input
        description: "Door-to-door mileage; drives the LONG_HAUL cwt tier and is ignored for LOCAL pricing."
        constraints: ">= 0"
      - name: requested_move_date
        type: datetime
        source: input
        description: "Requested load date (ISO 8601 UTC)."
      - name: stair_flights
        type: integer
        source: input
        description: "Number of stair flights at origin+destination; drives accessorial charge."
        default: 0
        constraints: ">= 0"
      - name: long_carry_units
        type: integer
        source: input
        description: "Count of 75-ft long-carry segments; drives accessorial charge."
        default: 0
        constraints: ">= 0"
      - name: job_status
        type: enum
        source: system
        description: "Lifecycle dimension #1, independent of payment_status."
        default: "QUOTING"
        constraints: "one of {QUOTING, BOOKED, IN_TRANSIT, DELIVERED, CLOSED, CANCELLED}"
      - name: payment_status
        type: enum
        source: system
        description: "Lifecycle dimension #2, evolves independently of job_status."
        default: "UNPAID"
        constraints: "one of {UNPAID, DEPOSIT_PAID, PAID_IN_FULL, REFUNDED}"
      - name: accepted_estimate_id
        type: string
        source: system
        description: "Pointer to the id of the ACCEPTED Estimate that booked this job (null until BOOKED). Not a child FK; the Estimate->MoveJob link is Estimate.move_job_id, and the accepted estimate is discoverable via GET /estimates?move_job_id={id} filtered to status=ACCEPTED."
      - name: final_charge_cents
        type: integer
        source: computed
        description: "Final billable amount in cents, set at DELIVERED by the binding/non-binding reconciliation (calc final_charge_reconciliation)."
        default: 0
      - name: gross_charges_cents
        type: integer
        source: computed
        description: "Running gross of all charges in cents before any waiver/refund credits (conserved-quantity baseline for sit_money_conservation)."
        default: 0
      - name: balance_due_cents
        type: integer
        source: computed
        description: "Outstanding balance in cents = gross_charges_cents minus paid_cents minus waived_cents minus refunded_cents."
        default: 0
      - name: paid_cents
        type: integer
        source: computed
        description: "Sum of payments applied to this job, in cents."
        default: 0
      - name: waived_cents
        type: integer
        source: computed
        description: "Sum of SIT charges waived on this job, in cents (compensating credits)."
        default: 0
      - name: refunded_cents
        type: integer
        source: computed
        description: "Sum refunded to the customer on cancellation, in cents."
        default: 0

  - name: InventorySurvey
    parent: null
    common_fields: true
    fields:
      - name: move_job_id
        type: string
        source: input
        description: "FK -> MoveJob.id; the job this survey estimates."
      - name: survey_method
        type: enum
        source: input
        description: "How the inventory was captured."
        constraints: "one of {IN_HOME, VIRTUAL, SELF_REPORTED}"
      - name: total_cubic_feet
        type: number
        source: computed
        description: "Sum over SurveyItem of (quantity * cubic_feet_each); recomputed on every item add (calc cubic_feet_rollup)."
        default: 0
      - name: estimated_weight_lbs
        type: integer
        source: computed
        description: "round_half_up(total_cubic_feet * DENSITY_LBS_PER_CF); recomputed on every item add (calc cubic_feet_rollup)."
        default: 0
      - name: locked
        type: boolean
        source: system
        description: "True once an Estimate has been generated from this survey; locked surveys reject new items."
        default: false

  - name: SurveyItem
    parent: null
    common_fields: false
    fields:
      - name: survey_id
        type: string
        source: input
        description: "FK -> InventorySurvey.id; the survey this line item belongs to."
      - name: label
        type: string
        source: input
        description: "Item description (e.g., 'queen bed')."
      - name: quantity
        type: integer
        source: input
        description: "Count of this item."
        constraints: ">= 1"
      - name: cubic_feet_each
        type: number
        source: input
        description: "Cubic feet per single unit of this item."
        constraints: "> 0"

  - name: Estimate
    parent: null
    common_fields: true
    fields:
      - name: move_job_id
        type: string
        source: input
        description: "FK -> MoveJob.id; the job this estimate prices."
      - name: survey_id
        type: string
        source: input
        description: "FK -> InventorySurvey.id; the survey snapshot this estimate prices."
      - name: estimator_user_id
        type: string
        source: system
        description: "Opaque X-User-ID of the Estimator who authored this estimate (audit trail)."
      - name: binding_type
        type: enum
        source: input
        description: "BINDING locks the price; NON_BINDING re-rates to actual weight at delivery."
        constraints: "one of {BINDING, NON_BINDING}"
      - name: valuation_coverage
        type: enum
        source: input
        description: "RELEASED is $0.60/lb statutory liability; FULL_VALUE charges a premium and pays repair/replacement."
        constraints: "one of {RELEASED, FULL_VALUE}"
      - name: declared_value_cents
        type: integer
        source: input
        description: "Customer-declared shipment value in cents; required and validated only for FULL_VALUE."
        default: 0
      - name: deductible_cents
        type: integer
        source: input
        description: "FULL_VALUE deductible option in cents; selects the premium credit tier."
        default: 0
        constraints: "one of {0, 25000, 50000, 100000}"
      - name: linehaul_cents
        type: integer
        source: computed
        description: "LONG_HAUL weight tariff in cents (calc estimate_total); 0 for LOCAL."
        default: 0
      - name: labor_cents
        type: integer
        source: computed
        description: "LOCAL hourly labor in cents (calc estimate_total); 0 for LONG_HAUL."
        default: 0
      - name: fuel_surcharge_cents
        type: integer
        source: computed
        description: "Fuel surcharge in cents on the linehaul (calc estimate_total)."
        default: 0
      - name: packing_cents
        type: integer
        source: computed
        description: "Packing/crating charge in cents copied from the linked PackingOrder at generation (calc estimate_total)."
        default: 0
      - name: valuation_premium_cents
        type: integer
        source: computed
        description: "Valuation premium in cents (calc valuation_premium); 0 for RELEASED."
        default: 0
      - name: accessorial_cents
        type: integer
        source: computed
        description: "Stair + long-carry accessorial charge in cents (calc estimate_total)."
        default: 0
      - name: estimate_total_cents
        type: integer
        source: computed
        description: "Round-per-component sum of all charge components in cents (calc estimate_total)."
        default: 0
      - name: status
        type: enum
        source: system
        description: "Estimate lifecycle; supports a DRAFT<->REVISED revision cycle before ACCEPTED."
        default: "DRAFT"
        constraints: "one of {DRAFT, REVISED, ACCEPTED, SUPERSEDED, EXPIRED}"

  - name: PackingOrder
    parent: null
    common_fields: true
    fields:
      - name: move_job_id
        type: string
        source: input
        description: "FK -> MoveJob.id; the job this packing add-on attaches to."
      - name: crate_count
        type: integer
        source: input
        description: "Number of custom crates (flat fee each)."
        default: 0
        constraints: ">= 0"
      - name: packing_lines
        type: array
        source: input
        description: "List of {material_code, quantity, unit_price_cents} packing-material lines."
      - name: packing_total_cents
        type: integer
        source: computed
        description: "round_half_up(sum(line qty*unit_price) + crate_count*CRATE_FEE_CENTS) (calc packing_total)."
        default: 0

  - name: Truck
    parent: null
    common_fields: true
    fields:
      - name: plate
        type: string
        source: input
        description: "License plate; unique fleet identifier."
        constraints: "unique; non-empty"
      - name: capacity_cubic_feet
        type: integer
        source: input
        description: "Maximum cargo volume; a Dispatch is rejected if survey cubic feet exceeds this."
        constraints: "> 0"
      - name: home_state_code
        type: string
        source: input
        description: "State the truck is domiciled in."

  - name: Crew
    parent: null
    common_fields: true
    fields:
      - name: name
        type: string
        source: input
        description: "Crew team name."
      - name: head_count
        type: integer
        source: input
        description: "Number of movers on this crew; must satisfy a Dispatch's required crew size."
        constraints: ">= 2"
      - name: home_state_code
        type: string
        source: input
        description: "State the crew is based in."

  - name: Dispatch
    parent: null
    common_fields: true
    fields:
      - name: move_job_id
        type: string
        source: input
        description: "FK -> MoveJob.id; the job being moved."
      - name: truck_id
        type: string
        source: input
        description: "FK -> Truck.id; the assigned truck."
      - name: crew_id
        type: string
        source: input
        description: "FK -> Crew.id; the assigned crew."
      - name: window_start
        type: datetime
        source: input
        description: "Half-open occupation window start [start, end) on both truck and crew (ISO 8601 UTC)."
      - name: window_end
        type: datetime
        source: input
        description: "Occupation window end; exclusive boundary."
      - name: required_crew_size
        type: integer
        source: input
        description: "Minimum movers needed; rejected if Crew.head_count is below this."
        constraints: ">= 2"
      - name: status
        type: enum
        source: system
        description: "Dispatch lifecycle; branches to COMPLETED or CANCELLED."
        default: "SCHEDULED"
        constraints: "one of {SCHEDULED, EN_ROUTE, COMPLETED, CANCELLED}"

  - name: StorageLot
    parent: null
    common_fields: true
    fields:
      - name: move_job_id
        type: string
        source: input
        description: "FK -> MoveJob.id; the job whose goods are in storage-in-transit."
      - name: intake_date
        type: datetime
        source: input
        description: "Date goods entered the warehouse (ISO 8601 UTC)."
      - name: release_date
        type: datetime
        source: system
        description: "Date goods left storage; set at release (null while in storage)."
      - name: billable_days
        type: integer
        source: computed
        description: "Storage days billed at release (calc sit_accrual): max(0, ceil(release-intake days) - FREE_SIT_DAYS)."
        default: 0
      - name: sit_charge_cents
        type: integer
        source: computed
        description: "Total SIT charge in cents at release (calc sit_accrual): storage days + 2x warehouse handling."
        default: 0
      - name: status
        type: enum
        source: system
        description: "Storage lot lifecycle."
        default: "IN_STORAGE"
        constraints: "one of {IN_STORAGE, RELEASED, WAIVED}"

  - name: DamageClaim
    parent: null
    common_fields: true
    fields:
      - name: move_job_id
        type: string
        source: input
        description: "FK -> MoveJob.id; the delivered job the damage occurred on."
      - name: filed_by_user_id
        type: string
        source: system
        description: "Opaque X-User-ID of the ClaimsAdjuster who intook this claim (segregation-of-duties anchor)."
      - name: adjudicated_by_user_id
        type: string
        source: system
        description: "Opaque X-User-ID of the ClaimsAdjuster who approved/denied; must differ from filed_by_user_id."
      - name: coverage_snapshot
        type: enum
        source: system
        description: "Copied from the accepted Estimate.valuation_coverage at filing; pins which settlement variant applies."
        constraints: "one of {RELEASED, FULL_VALUE}"
      - name: deductible_cents
        type: integer
        source: system
        description: "Copied from accepted Estimate.deductible_cents at filing; applied once per claim under FULL_VALUE."
        default: 0
      - name: settlement_cents
        type: integer
        source: computed
        description: "Total claim payout in cents at approval (calc claim_settlement); 0 while UNDER_REVIEW or DENIED."
        default: 0
      - name: status
        type: enum
        source: system
        description: "Claim lifecycle; APPROVED may reopen to UNDER_REVIEW."
        default: "UNDER_REVIEW"
        constraints: "one of {UNDER_REVIEW, APPROVED, DENIED}"

  - name: ClaimItem
    parent: null
    common_fields: false
    fields:
      - name: claim_id
        type: string
        source: input
        description: "FK -> DamageClaim.id; the claim this damaged-item line belongs to."
      - name: label
        type: string
        source: input
        description: "Damaged item description."
      - name: item_weight_lbs
        type: integer
        source: input
        description: "Article weight in pounds; drives RELEASED payout at $0.60/lb."
        constraints: ">= 1"
      - name: repair_cost_cents
        type: integer
        source: input
        description: "Estimated repair cost in cents (FULL_VALUE input)."
        constraints: ">= 0"
      - name: replacement_value_cents
        type: integer
        source: input
        description: "Replacement value in cents (FULL_VALUE input)."
        constraints: ">= 0"

# =============================================================================
# 1.2 State Machine Table
# =============================================================================
state_machines:
  # ---- MoveJob: PARALLEL dimensions (job_status x payment_status) ----
  - entity: MoveJob
    initial_state: "QUOTING / UNPAID"
    terminal_states: [CLOSED, CANCELLED]
    transitions:
      - from: "job_status=QUOTING"
        to: "job_status=BOOKED"
        trigger: "POST /estimates/{id}/accept"
        actor: Customer
        preconditions:
          - "Estimate.status IN {DRAFT, REVISED}"
          - "Estimate.move_job_id == this MoveJob.id"
          - "MoveJob.job_status == QUOTING"
          - "acting Customer.id == MoveJob.customer_id"
        side_effects:
          - "set MoveJob.accepted_estimate_id = Estimate.id"
          - "set MoveJob.job_status = BOOKED"
          - "set Estimate.status = ACCEPTED"
          - "set every other Estimate of this MoveJob whose status IN {DRAFT, REVISED} to SUPERSEDED"
          - "add Estimate.estimate_total_cents to MoveJob.gross_charges_cents"
          - "set MoveJob.balance_due_cents = gross_charges_cents - paid_cents - waived_cents - refunded_cents"
      - from: "payment_status=UNPAID"
        to: "payment_status=DEPOSIT_PAID"
        trigger: "POST /move-jobs/{id}/payments (kind=DEPOSIT)"
        actor: Customer
        preconditions:
          - "MoveJob.job_status == BOOKED"
          - "MoveJob.payment_status == UNPAID"
        side_effects:
          - "increase MoveJob.paid_cents by amount_cents"
          - "set MoveJob.payment_status = DEPOSIT_PAID"
          - "recompute MoveJob.balance_due_cents"
      - from: "job_status=BOOKED"
        to: "job_status=IN_TRANSIT"
        trigger: "POST /dispatches/{id}/depart"
        actor: Dispatcher
        preconditions:
          - "MoveJob.job_status == BOOKED"
          - "MoveJob.payment_status IN {DEPOSIT_PAID, PAID_IN_FULL}"
          - "Dispatch.status == SCHEDULED"
        side_effects:
          - "set Dispatch.status = EN_ROUTE"
          - "set MoveJob.job_status = IN_TRANSIT (cross-entity bubble-up)"
      - from: "job_status=IN_TRANSIT"
        to: "job_status=DELIVERED"
        trigger: "POST /dispatches/{id}/complete (actual_weight_lbs)"
        actor: Dispatcher
        preconditions:
          - "Dispatch.status == EN_ROUTE"
          - "MoveJob.job_status == IN_TRANSIT"
        side_effects:
          - "set Dispatch.status = COMPLETED"
          - "set MoveJob.job_status = DELIVERED"
          - "run calc final_charge_reconciliation -> set MoveJob.final_charge_cents"
          - "set MoveJob.gross_charges_cents = final_charge_cents + sum of released SIT/packing already gross-booked (recompute baseline)"
          - "recompute MoveJob.balance_due_cents"
      - from: "payment_status=DEPOSIT_PAID"
        to: "payment_status=PAID_IN_FULL"
        trigger: "POST /move-jobs/{id}/payments (kind=BALANCE)"
        actor: Customer
        preconditions:
          - "MoveJob.job_status == DELIVERED"
          - "amount_cents == MoveJob.balance_due_cents"
        side_effects:
          - "increase MoveJob.paid_cents by amount_cents"
          - "set MoveJob.payment_status = PAID_IN_FULL"
          - "recompute MoveJob.balance_due_cents (-> 0)"
      - from: "job_status=DELIVERED"
        to: "job_status=CLOSED"
        trigger: "POST /move-jobs/{id}/close"
        actor: PlatformAdmin
        preconditions:
          - "MoveJob.payment_status == PAID_IN_FULL"
          - "no DamageClaim of this MoveJob with status == UNDER_REVIEW"
          - "no StorageLot of this MoveJob with status == IN_STORAGE"
        side_effects:
          - "set MoveJob.job_status = CLOSED"
      - from: "job_status IN {QUOTING, BOOKED}"
        to: "job_status=CANCELLED"
        trigger: "POST /move-jobs/{id}/cancel"
        actor: Customer
        preconditions:
          - "MoveJob.job_status IN {QUOTING, BOOKED}"
          - "no Dispatch of this MoveJob with status IN {EN_ROUTE} (else ERR_CANCEL_IN_TRANSIT)"
        side_effects:
          - "set MoveJob.job_status = CANCELLED"
          - "cascade: every SCHEDULED Dispatch of this MoveJob -> CANCELLED (frees truck+crew windows)"
          - "if MoveJob.paid_cents > 0: set MoveJob.refunded_cents = paid_cents, set payment_status = REFUNDED, recompute balance_due_cents"
        note: "Cancellation cascade depth >= 2: cancel job -> cancel dispatch -> dispatch release frees Truck/Crew occupation windows."

  # ---- Estimate: CYCLIC revision loop (DRAFT <-> REVISED) ----
  - entity: Estimate
    initial_state: DRAFT
    terminal_states: [ACCEPTED, SUPERSEDED, EXPIRED]
    transitions:
      - from: DRAFT
        to: REVISED
        trigger: "POST /estimates/{id}/revise"
        actor: Estimator
        preconditions:
          - "Estimate.status == DRAFT"
          - "MoveJob.job_status == QUOTING"
        side_effects:
          - "re-run calc estimate_total -> recompute all *_cents fields and estimate_total_cents"
          - "increment Estimate.version by 1"
        note: "Revision loop: REVISED can be revised again, returning to REVISED (cyclic A->B->B)."
      - from: REVISED
        to: REVISED
        trigger: "POST /estimates/{id}/revise"
        actor: Estimator
        preconditions:
          - "Estimate.status == REVISED"
          - "MoveJob.job_status == QUOTING"
        side_effects:
          - "re-run calc estimate_total -> recompute estimate_total_cents"
          - "increment Estimate.version by 1"
      - from: DRAFT
        to: ACCEPTED
        trigger: "POST /estimates/{id}/accept"
        actor: Customer
        preconditions:
          - "Estimate.status == DRAFT"
          - "acting Customer.id == MoveJob.customer_id"
        side_effects:
          - "drives MoveJob QUOTING->BOOKED (see MoveJob machine)"
      - from: REVISED
        to: ACCEPTED
        trigger: "POST /estimates/{id}/accept"
        actor: Customer
        preconditions:
          - "Estimate.status == REVISED"
          - "acting Customer.id == MoveJob.customer_id"
        side_effects:
          - "drives MoveJob QUOTING->BOOKED (see MoveJob machine)"
      - from: "DRAFT or REVISED"
        to: SUPERSEDED
        trigger: "system: a sibling Estimate of the same MoveJob is accepted"
        actor: system
        preconditions:
          - "another Estimate of the same MoveJob just transitioned to ACCEPTED"
        side_effects:
          - "set Estimate.status = SUPERSEDED"

  # ---- Dispatch: BRANCHING with cancel ----
  - entity: Dispatch
    initial_state: SCHEDULED
    terminal_states: [COMPLETED, CANCELLED]
    transitions:
      - from: SCHEDULED
        to: EN_ROUTE
        trigger: "POST /dispatches/{id}/depart"
        actor: Dispatcher
        preconditions:
          - "Dispatch.status == SCHEDULED"
          - "MoveJob.job_status == BOOKED"
          - "MoveJob.payment_status IN {DEPOSIT_PAID, PAID_IN_FULL}"
        side_effects:
          - "set Dispatch.status = EN_ROUTE"
          - "cross-entity: MoveJob.job_status BOOKED -> IN_TRANSIT"
      - from: EN_ROUTE
        to: COMPLETED
        trigger: "POST /dispatches/{id}/complete (actual_weight_lbs)"
        actor: Dispatcher
        preconditions:
          - "Dispatch.status == EN_ROUTE"
        side_effects:
          - "set Dispatch.status = COMPLETED"
          - "cross-entity: MoveJob.job_status IN_TRANSIT -> DELIVERED + calc final_charge_reconciliation"
      - from: SCHEDULED
        to: CANCELLED
        trigger: "POST /dispatches/{id}/cancel"
        actor: Dispatcher
        preconditions:
          - "Dispatch.status == SCHEDULED"
        side_effects:
          - "set Dispatch.status = CANCELLED"
          - "free Truck and Crew occupation window [window_start, window_end)"

  # ---- StorageLot: LINEAR with accrual side-effects ----
  - entity: StorageLot
    initial_state: IN_STORAGE
    terminal_states: [RELEASED, WAIVED]
    transitions:
      - from: IN_STORAGE
        to: RELEASED
        trigger: "POST /storage-lots/{id}/release (release_date)"
        actor: Dispatcher
        preconditions:
          - "StorageLot.status == IN_STORAGE"
          - "release_date >= StorageLot.intake_date"
          - "MoveJob.job_status IN {DELIVERED, IN_TRANSIT}"
        side_effects:
          - "set StorageLot.release_date"
          - "run calc sit_accrual -> set billable_days, sit_charge_cents"
          - "add sit_charge_cents to MoveJob.gross_charges_cents (ledger sync)"
          - "recompute MoveJob.balance_due_cents"
      - from: RELEASED
        to: WAIVED
        trigger: "POST /storage-lots/{id}/waive"
        actor: PlatformAdmin
        preconditions:
          - "StorageLot.status == RELEASED"
          - "expected_move_job_version present and matches MoveJob.version"
        side_effects:
          - "set StorageLot.status = WAIVED"
          - "add StorageLot.sit_charge_cents to MoveJob.waived_cents (compensating credit)"
          - "recompute MoveJob.balance_due_cents = gross_charges - paid - waived - refunded"
          - "increment MoveJob.version by 1"
        note: "Compensation invariant: gross_charges_cents unchanged; balance_due drops by exactly sit_charge_cents."

  # ---- DamageClaim: BRANCHING with revert (APPROVED can reopen) ----
  - entity: DamageClaim
    initial_state: UNDER_REVIEW
    terminal_states: [DENIED]
    transitions:
      - from: UNDER_REVIEW
        to: APPROVED
        trigger: "POST /damage-claims/{id}/approve"
        actor: ClaimsAdjuster
        preconditions:
          - "DamageClaim.status == UNDER_REVIEW"
          - "X-User-ID != DamageClaim.filed_by_user_id (segregation of duties; else ERR_SEGREGATION_OF_DUTIES)"
          - "MoveJob.job_status == DELIVERED (else ERR_NOT_DELIVERED)"
          - "DamageClaim has >= 1 ClaimItem (else ERR_CLAIM_NO_ITEMS)"
        side_effects:
          - "run calc claim_settlement -> set DamageClaim.settlement_cents"
          - "set DamageClaim.adjudicated_by_user_id = X-User-ID"
          - "set DamageClaim.status = APPROVED"
          - "add settlement_cents to MoveJob.refunded_cents (payout credit) and recompute balance_due_cents"
      - from: UNDER_REVIEW
        to: DENIED
        trigger: "POST /damage-claims/{id}/deny"
        actor: ClaimsAdjuster
        preconditions:
          - "DamageClaim.status == UNDER_REVIEW"
          - "X-User-ID != DamageClaim.filed_by_user_id"
        side_effects:
          - "set DamageClaim.adjudicated_by_user_id = X-User-ID"
          - "set DamageClaim.status = DENIED"
      - from: APPROVED
        to: UNDER_REVIEW
        trigger: "POST /damage-claims/{id}/reopen"
        actor: ClaimsAdjuster
        preconditions:
          - "DamageClaim.status == APPROVED"
          - "MoveJob.job_status != CLOSED"
        side_effects:
          - "subtract prior settlement_cents from MoveJob.refunded_cents (compensation), set settlement_cents = 0"
          - "clear DamageClaim.adjudicated_by_user_id"
          - "recompute MoveJob.balance_due_cents"
          - "set DamageClaim.status = UNDER_REVIEW"
        note: "Branch-with-revert cycle: UNDER_REVIEW -> APPROVED -> UNDER_REVIEW; compensation must zero the prior payout credit."

# =============================================================================
# 1.2.1 Concurrency Rules (OCC on parent version — true CREATE-with-supersede race)
# =============================================================================
concurrency_rules:
  - rule_id: estimate-create-stale-job
    parent_entity: MoveJob
    write_endpoint: "POST /estimates"
    occ_field: "expected_move_job_version"
    description: |
      Creating a new Estimate against a MoveJob whose version has advanced
      since the client last observed it is rejected. A second author whose
      view of the job is stale (the job version moved because another
      Estimate was already generated and the survey lock flipped) is rejected
      on a stale-version check rather than silently appending a divergent
      price sheet.
    error_id: ERR_STALE_VERSION
    http_status: 412
  - rule_id: sit-waive-stale-job
    parent_entity: MoveJob
    write_endpoint: "POST /storage-lots/{id}/waive"
    occ_field: "expected_move_job_version"
    description: |
      Waiving a StorageLot's SIT charge credits the parent MoveJob's ledger.
      If the MoveJob.version has advanced since the operator read it (e.g., a
      balance payment or another waiver already mutated the ledger), the waive
      is rejected on a stale-version check so the compensating credit is never
      applied against an outdated ledger snapshot.
    error_id: ERR_STALE_VERSION
    http_status: 412

# =============================================================================
# 1.3 Calculation Rules Table
# =============================================================================
calculations:
  - name: cubic_feet_rollup
    trigger: "On POST /surveys/{id}/items (SurveyItem add)"
    algorithm: aggregation
    formula: |
      total_cubic_feet = sum over SurveyItem s of (s.quantity * s.cubic_feet_each)
      estimated_weight_lbs = round_half_up(total_cubic_feet * DENSITY_LBS_PER_CF)
    input_set: "All SurveyItem rows whose survey_id == this InventorySurvey.id (no status filter; items are append-only and never excluded)."
    constants:
      DENSITY_LBS_PER_CF: 7
    precision: "total_cubic_feet kept exact; estimated_weight_lbs rounded to integer, round_half_up."

  - name: packing_total
    trigger: "On POST /packing-orders and on PATCH /packing-orders/{id}"
    algorithm: aggregation
    formula: |
      lines_subtotal_cents = sum over packing_lines line of (line.quantity * line.unit_price_cents)
      packing_total_cents = round_half_up(lines_subtotal_cents + crate_count * CRATE_FEE_CENTS)
    input_set: "All packing_lines on this PackingOrder plus crate_count."
    constants:
      CRATE_FEE_CENTS: 9500
    precision: "integer cents (values already in cents); round_half_up is a no-op safeguard."

  - name: valuation_premium
    trigger: "Component of calc estimate_total when valuation_coverage == FULL_VALUE."
    algorithm: tiered_pricing
    formula: |
      if valuation_coverage == RELEASED:
          valuation_premium_cents = 0
      else:  # FULL_VALUE
          base_cents = max(MIN_PREMIUM_CENTS,
                           round_half_up(declared_value_cents / 10000 * RATE_PER_100_CENTS))
          credit_pct = DEDUCTIBLE_CREDIT[deductible_cents]   # keyed table
          valuation_premium_cents = round_half_up(base_cents * (1 - credit_pct))
    input_set: "Single Estimate; declared_value_cents, deductible_cents, valuation_coverage, and the linked survey's estimated_weight_lbs (for the min-declared validation, not the premium itself)."
    constants:
      RATE_PER_100_CENTS: 110          # $1.10 per $100 of declared value
      MIN_PREMIUM_CENTS: 7500          # $75 floor
      DEDUCTIBLE_CREDIT: { 0: 0.00, 25000: 0.10, 50000: 0.18, 100000: 0.30 }
    precision: "2 decimal places internally then integer cents; round_half_up applied to base_cents and to the final premium independently (round-then-multiply-then-round)."
    variants:
      - name: released
        when: "valuation_coverage == RELEASED"
        difference: "Premium is exactly 0; liability falls back to $0.60/lb at claim time (see claim_settlement.released)."
      - name: full_value
        when: "valuation_coverage == FULL_VALUE"
        difference: "Premium = round_half_up(max($75, declared/100*$1.10) * (1 - deductible_credit))."

  - name: estimate_total
    trigger: "On POST /estimates (generation) and on every /estimates/{id}/revise."
    algorithm: tiered_pricing
    formula: |
      W = linked InventorySurvey.estimated_weight_lbs
      packing_cents = linked PackingOrder.packing_total_cents (0 if no PackingOrder)
      accessorial_cents = round_half_up(MoveJob.stair_flights * STAIR_FEE_CENTS
                                        + MoveJob.long_carry_units * LONG_CARRY_FEE_CENTS)
      valuation_premium_cents = calc valuation_premium
      if MoveJob.service_type == LONG_HAUL:
          cwt = W / 100                                    # hundredweight, exact
          rate_cents = CWT_RATE_CENTS[ tier(MoveJob.distance_miles) ]   # whole-shipment band
          linehaul_cents = round_half_up(cwt * rate_cents)
          labor_cents = 0
          fuel_surcharge_cents = round_half_up(linehaul_cents * FUEL_PCT)
      else:  # LOCAL
          raw_hours = W_cf_basis: total_cubic_feet / CF_PER_CREW_HOUR / crew_size
                      where crew_size = tier_crew_size(total_cubic_feet)
          billable_hours = max(MIN_HOURS, ceil_to_quarter(raw_hours))
          hourly_rate_cents = HOURLY_RATE_CENTS[crew_size]
          labor_cents = round_half_up(hourly_rate_cents * billable_hours)
          travel_cents = round_half_up(hourly_rate_cents * TRAVEL_HOURS)
          linehaul_cents = 0
          fuel_surcharge_cents = travel_cents   # LOCAL stores its travel fee in the fuel field slot
      # ROUNDING ORDER PINNED: each component is rounded to integer cents FIRST,
      # THEN summed. (round-per-component-then-sum, NOT sum-then-round.)
      estimate_total_cents = linehaul_cents + labor_cents + fuel_surcharge_cents
                             + packing_cents + valuation_premium_cents + accessorial_cents
    input_set: "Single Estimate plus its linked survey, MoveJob, and optional PackingOrder. tier() selects the cwt band by total mileage; crew_size selected by cubic feet."
    constants:
      CWT_RATE_CENTS: { "0_250": 9000, "251_750": 14000, "751_1500": 21000, "1501_plus": 29000 }
      FUEL_PCT: 0.085
      STAIR_FEE_CENTS: 7500
      LONG_CARRY_FEE_CENTS: 9000
      CF_PER_CREW_HOUR: 45
      MIN_HOURS: 3.0
      TRAVEL_HOURS: 0.5
      HOURLY_RATE_CENTS: { 2: 14000, 3: 19000, 4: 24000, 5: 28500 }
      CREW_SIZE_BY_CF: "cf<=300 -> 2; 301<=cf<=600 -> 3; 601<=cf<=1000 -> 4; cf>1000 -> 5"
    precision: "round_half_up per component to integer cents, then integer sum. Mileage bands inclusive on both ends per the keyed ranges."
    variants:
      - name: long_haul
        when: "MoveJob.service_type == LONG_HAUL"
        difference: "Weight tariff (cwt * banded rate) + fuel surcharge; labor=0."
      - name: local_hourly
        when: "MoveJob.service_type == LOCAL"
        difference: "Hourly labor (crew-size tiered rate * billable hours) + flat travel; linehaul=0, distance_miles ignored."

  - name: final_charge_reconciliation
    trigger: "On POST /dispatches/{id}/complete (MoveJob IN_TRANSIT -> DELIVERED)."
    algorithm: chronological
    formula: |
      E = MoveJob.accepted_estimate_id estimate
      if E.binding_type == BINDING:
          # Binding price holds regardless of actual weight, UNLESS surveyed
          # cubic feet was exceeded beyond tolerance AND an addendum exists.
          if addendum_present AND actual_cubic_feet > survey.total_cubic_feet * (1 + BINDING_TOLERANCE_PCT):
              final_charge_cents = re-rate estimate_total at actual_weight_lbs (re-run estimate_total with W=actual)
          else:
              final_charge_cents = E.estimate_total_cents      # locked
      else:  # NON_BINDING
          # Re-rate the weight-driven components at the measured actual weight,
          # keep packing + valuation + accessorial unchanged.
          final_charge_cents = re-rate (linehaul/labor + fuel) at actual_weight_lbs
                               + E.packing_cents + E.valuation_premium_cents + E.accessorial_cents
    input_set: "The single accepted Estimate, the completing Dispatch's actual_weight_lbs, and (for binding) the addendum flag + survey total_cubic_feet."
    constants:
      BINDING_TOLERANCE_PCT: 0.10
    precision: "round_half_up per component then sum (same pinned order as estimate_total)."
    variants:
      - name: binding_locked
        when: "binding_type == BINDING and (no addendum OR actual within tolerance)"
        difference: "final_charge_cents == accepted Estimate.estimate_total_cents exactly; actual weight ignored."
      - name: non_binding_actual
        when: "binding_type == NON_BINDING"
        difference: "Weight-driven components recomputed at actual weight; non-weight components carried over from estimate."

  - name: sit_accrual
    trigger: "On POST /storage-lots/{id}/release."
    algorithm: threshold
    formula: |
      raw_days = ceil((release_date - intake_date) / 1 day)     # calendar days, ceil
      billable_days = max(0, raw_days - FREE_SIT_DAYS)
      sit_charge_cents = round_half_up(billable_days * DAILY_RATE_CENTS
                                       + 2 * WAREHOUSE_HANDLING_CENTS)
    input_set: "Single StorageLot; intake_date and release_date."
    constants:
      DAILY_RATE_CENTS: 4200
      FREE_SIT_DAYS: 3
      WAREHOUSE_HANDLING_CENTS: 11000
    precision: "raw_days computed by ceil of the day difference; charge in integer cents, round_half_up."

  - name: claim_settlement
    trigger: "On POST /damage-claims/{id}/approve."
    algorithm: aggregation
    formula: |
      if DamageClaim.coverage_snapshot == RELEASED:
          settlement_cents = round_half_up( sum over ClaimItem c of (c.item_weight_lbs * RELEASED_RATE_CENTS_PER_LB) )
      else:  # FULL_VALUE
          gross_cents = sum over ClaimItem c of min(c.repair_cost_cents, c.replacement_value_cents)
          settlement_cents = max(0, gross_cents - DamageClaim.deductible_cents)   # deductible once per claim
    input_set: "All ClaimItem rows whose claim_id == this DamageClaim.id (no status filter)."
    constants:
      RELEASED_RATE_CENTS_PER_LB: 60        # $0.60 per pound per article
    precision: "round_half_up to integer cents on the released sum; full-value already integer cents."
    variants:
      - name: released
        when: "coverage_snapshot == RELEASED"
        difference: "Strictly weight-based at $0.60/lb; repair/replacement values and declared value are ignored, no deductible."
      - name: full_value
        when: "coverage_snapshot == FULL_VALUE"
        difference: "sum of min(repair, replacement) per item, minus the per-claim deductible, floored at 0; item weight ignored."

# =============================================================================
# 1.4 Validation Rules Table (ordered by priority)
# =============================================================================
validations:
  - priority: 1
    category: auth
    check: "X-User-Role and X-User-ID headers present and X-User-Role is a known role."
    error_id: ERR_UNAUTHENTICATED
    http_status: 401
    applies_to: "all"
  - priority: 2
    category: auth
    check: "Acting role is permitted to perform this operation per the RBAC matrix."
    error_id: ERR_FORBIDDEN_ROLE
    http_status: 403
    applies_to: "all"
  - priority: 3
    category: existence
    check: "All path/body referenced resources exist, validated left-to-right in the path then body FKs."
    error_id: ERR_NOT_FOUND
    http_status: 404
    applies_to: "all endpoints with path ids or FK body fields"
  - priority: 4
    category: business_referential
    check: "Acting Customer (X-User-ID) must equal MoveJob.customer_id for customer-owned operations (accept/cancel/pay)."
    error_id: ERR_NOT_RESOURCE_OWNER
    http_status: 403
    applies_to: "POST /estimates/{id}/accept, POST /move-jobs/{id}/cancel, POST /move-jobs/{id}/payments"
  - priority: 5
    category: business_safety
    check: "Segregation of duties: on /damage-claims/{id}/(approve|deny|reopen) the acting X-User-ID must not equal DamageClaim.filed_by_user_id (the ClaimsAdjuster who intook the claim cannot adjudicate it)."
    error_id: ERR_SEGREGATION_OF_DUTIES
    http_status: 403
    applies_to: "POST /damage-claims/{id}/approve, POST /damage-claims/{id}/deny, POST /damage-claims/{id}/reopen"
  - priority: 6
    category: state
    check: "Target resource is in a state from which the requested transition is defined (Estimate, MoveJob, Dispatch, StorageLot, DamageClaim)."
    error_id: ERR_INVALID_STATE
    http_status: 409
    applies_to: "all transition endpoints"
  - priority: 7
    category: state
    check: "Cross-entity guard: depart requires MoveJob.payment_status IN {DEPOSIT_PAID, PAID_IN_FULL}; close requires no UNDER_REVIEW claim and no IN_STORAGE lot."
    error_id: ERR_DEPENDENT_STATE_BLOCK
    http_status: 409
    applies_to: "POST /dispatches/{id}/depart, POST /move-jobs/{id}/close"
  - priority: 8
    category: state
    check: "InventorySurvey is not locked when adding a SurveyItem (a generated Estimate locks its survey)."
    error_id: ERR_SURVEY_LOCKED
    http_status: 409
    applies_to: "POST /surveys/{id}/items"
  - priority: 9
    category: business_constraint
    check: "Enum and field-range validity: service_type/binding_type/valuation_coverage/deductible_cents members; quantity>=1; cubic_feet_each>0; declared/repair/replacement >= 0."
    error_id: ERR_INVALID_FIELD
    http_status: 422
    applies_to: "all create/patch endpoints"
  - priority: 10
    category: business_constraint
    check: "FULL_VALUE estimate requires declared_value_cents >= estimated_weight_lbs * MIN_VALUATION_PER_LB_CENTS (600 = $6.00/lb) and deductible_cents in the allowed set."
    error_id: ERR_DECLARED_VALUE_TOO_LOW
    http_status: 422
    applies_to: "POST /estimates, POST /estimates/{id}/revise"
  - priority: 11
    category: business_temporal
    check: "Dispatch window_end must be strictly after window_start (window_end > window_start)."
    error_id: ERR_INVALID_WINDOW
    http_status: 422
    applies_to: "POST /dispatches"
  - priority: 12
    category: business_constraint
    check: "Truck capacity: linked survey total_cubic_feet must be <= Truck.capacity_cubic_feet."
    error_id: ERR_TRUCK_CAPACITY_EXCEEDED
    http_status: 409
    applies_to: "POST /dispatches"
  - priority: 13
    category: business_constraint
    check: "Crew sizing: Crew.head_count must be >= Dispatch.required_crew_size."
    error_id: ERR_CREW_TOO_SMALL
    http_status: 409
    applies_to: "POST /dispatches"
  - priority: 14
    category: business_temporal
    check: "Truck temporal overlap: requested [window_start, window_end) must not overlap any non-terminal Dispatch on the same truck. Half-open semantics: touching at a boundary (prev.window_end == new.window_start) is allowed."
    error_id: ERR_TRUCK_DOUBLE_BOOKED
    http_status: 409
    applies_to: "POST /dispatches"
  - priority: 15
    category: business_temporal
    check: "Crew temporal overlap with TURNAROUND buffer: requested window expanded by CREW_TURNAROUND_MINUTES (90) on each side must not overlap any non-terminal Dispatch on the same crew. Buffered half-open semantics: two crew windows separated by less than 90 minutes are rejected; windows exactly 90 minutes apart (the later start >= the earlier end + 90 min) are allowed."
    error_id: ERR_CREW_DOUBLE_BOOKED
    http_status: 409
    applies_to: "POST /dispatches"
  - priority: 16
    category: business_fiscal
    check: "Balance payment amount_cents must equal MoveJob.balance_due_cents exactly (no partial/over payment on BALANCE)."
    error_id: ERR_PAYMENT_AMOUNT_MISMATCH
    http_status: 422
    applies_to: "POST /move-jobs/{id}/payments"
  - priority: 17
    category: business_fiscal
    check: "OCC: expected_move_job_version (when required) must equal current MoveJob.version."
    error_id: ERR_STALE_VERSION
    http_status: 412
    applies_to: "POST /estimates, POST /storage-lots/{id}/waive"
  - priority: 18
    category: business_constraint
    check: "Damage claim filing requires MoveJob.job_status == DELIVERED and an accepted Estimate (coverage snapshot source)."
    error_id: ERR_CLAIM_NOT_ELIGIBLE
    http_status: 409
    applies_to: "POST /damage-claims"
  - priority: 19
    category: state
    check: "Job cancellation is blocked while any Dispatch of the job is EN_ROUTE (goods already in motion)."
    error_id: ERR_CANCEL_IN_TRANSIT
    http_status: 409
    applies_to: "POST /move-jobs/{id}/cancel"
  - priority: 20
    category: state
    check: "Claim adjudication (approve/deny/reopen) requires the linked MoveJob to still be in DELIVERED state; a CLOSED/CANCELLED job rejects adjudication."
    error_id: ERR_NOT_DELIVERED
    http_status: 409
    applies_to: "POST /damage-claims/{id}/approve, POST /damage-claims/{id}/deny"
  - priority: 21
    category: business_constraint
    check: "Approving a damage claim requires at least one ClaimItem row."
    error_id: ERR_CLAIM_NO_ITEMS
    http_status: 409
    applies_to: "POST /damage-claims/{id}/approve"
  - priority: 22
    category: state
    check: "DEPOSIT payment requires MoveJob.job_status == BOOKED (an estimate has been accepted)."
    error_id: ERR_DEPOSIT_BEFORE_BOOKED
    http_status: 409
    applies_to: "POST /move-jobs/{id}/payments"
  - priority: 23
    category: business_temporal
    check: "StorageLot release_date must be >= intake_date."
    error_id: ERR_RELEASE_BEFORE_INTAKE
    http_status: 422
    applies_to: "POST /storage-lots/{id}/release"
  - priority: 24
    category: business_constraint
    check: "Customer.email and Truck.plate are unique; a duplicate returns the corresponding conflict error."
    error_id: ERR_DUPLICATE_EMAIL
    http_status: 409
    applies_to: "POST /customers (ERR_DUPLICATE_EMAIL), POST /trucks (ERR_DUPLICATE_PLATE)"
  - priority: 25
    category: business_constraint
    check: "Pagination limit must be 1..100 and offset >= 0 on all list endpoints."
    error_id: ERR_PAGINATION_INVALID
    http_status: 422
    applies_to: "all GET list endpoints"
  - priority: 26
    category: business_constraint
    check: "Required request-body fields present and well-formed JSON; otherwise ERR_VALIDATION."
    error_id: ERR_VALIDATION
    http_status: 400
    applies_to: "all create/action endpoints"

# =============================================================================
# 1.5 API Endpoint Table
# =============================================================================
endpoints:
  # ---- Customer ----
  - method: POST
    path: "/customers"
    description: "Register a customer."
    roles: [PlatformAdmin, Customer]
    code: 201
    input: [email, full_name, origin_state_code, phone]
    output: Customer
    side_effects: []
  - method: GET
    path: "/customers/{id}"
    description: "Fetch a customer."
    roles: [PlatformAdmin, Customer, Estimator, Dispatcher, ClaimsAdjuster]
    code: 200
    input: []
    output: Customer
    side_effects: []

  # ---- MoveJob ----
  - method: POST
    path: "/move-jobs"
    description: "Create a move job in QUOTING/UNPAID."
    roles: [PlatformAdmin, Customer]
    code: 201
    input: [customer_id, service_type, origin_zip, destination_zip, distance_miles, requested_move_date, "stair_flights?", "long_carry_units?"]
    output: MoveJob
    side_effects: ["job_status=QUOTING", "payment_status=UNPAID"]
  - method: GET
    path: "/move-jobs/{id}"
    description: "Fetch a move job with computed ledger fields."
    roles: [PlatformAdmin, Customer, Estimator, Dispatcher, ClaimsAdjuster]
    code: 200
    input: []
    output: MoveJob
    side_effects: []
  - method: GET
    path: "/move-jobs"
    description: "List move jobs, filterable by customer_id."
    roles: [PlatformAdmin, Estimator, Dispatcher, ClaimsAdjuster]
    code: 200
    input: ["customer_id?", "job_status?", "limit?", "offset?"]
    output: MoveJob[]
    side_effects: []
  - method: POST
    path: "/move-jobs/{id}/payments"
    description: "Apply a DEPOSIT or BALANCE payment; advances payment_status."
    roles: [Customer]
    code: 201
    input: [kind, amount_cents]
    output: MoveJob
    side_effects: ["paid_cents += amount_cents", "payment_status transition", "recompute balance_due_cents"]
  - method: POST
    path: "/move-jobs/{id}/close"
    description: "Close a fully-paid delivered job with no open claims or storage."
    roles: [PlatformAdmin]
    code: 200
    input: []
    output: MoveJob
    side_effects: ["job_status=CLOSED"]
  - method: POST
    path: "/move-jobs/{id}/cancel"
    description: "Cancel a QUOTING/BOOKED job; cascades dispatch cancellation and refund."
    roles: [Customer]
    code: 200
    input: []
    output: MoveJob
    side_effects: ["job_status=CANCELLED", "cascade SCHEDULED dispatches -> CANCELLED", "refund paid_cents"]

  # ---- InventorySurvey + SurveyItem ----
  - method: POST
    path: "/surveys"
    description: "Create an inventory survey for a job."
    roles: [Estimator, PlatformAdmin]
    code: 201
    input: [move_job_id, survey_method]
    output: InventorySurvey
    side_effects: ["total_cubic_feet=0", "estimated_weight_lbs=0", "locked=false"]
  - method: GET
    path: "/surveys/{id}"
    description: "Fetch a survey with rolled-up cubic feet / weight."
    roles: [Estimator, PlatformAdmin, Customer, Dispatcher]
    code: 200
    input: []
    output: InventorySurvey
    side_effects: []
  - method: GET
    path: "/surveys"
    description: "List surveys, filterable by move_job_id (FK reverse-reachability for InventorySurvey)."
    roles: [Estimator, PlatformAdmin, Customer, Dispatcher]
    code: 200
    input: ["move_job_id?", "limit?", "offset?"]
    output: InventorySurvey[]
    side_effects: []
  - method: POST
    path: "/surveys/{id}/items"
    description: "Append a survey item; recomputes cubic feet and weight."
    roles: [Estimator, PlatformAdmin]
    code: 201
    input: [label, quantity, cubic_feet_each]
    output: SurveyItem
    side_effects: ["calc cubic_feet_rollup -> survey.total_cubic_feet, survey.estimated_weight_lbs"]
  - method: GET
    path: "/surveys/{id}/items"
    description: "List items of a survey (FK reverse-reachability for SurveyItem)."
    roles: [Estimator, PlatformAdmin, Customer, Dispatcher]
    code: 200
    input: ["limit?", "offset?"]
    output: SurveyItem[]
    side_effects: []

  # ---- PackingOrder ----
  - method: POST
    path: "/packing-orders"
    description: "Create a packing/crating add-on for a job."
    roles: [Estimator, PlatformAdmin]
    code: 201
    input: [move_job_id, "crate_count?", packing_lines]
    output: PackingOrder
    side_effects: ["calc packing_total -> packing_total_cents"]
  - method: GET
    path: "/packing-orders/{id}"
    description: "Fetch a packing order."
    roles: [Estimator, PlatformAdmin, Customer]
    code: 200
    input: []
    output: PackingOrder
    side_effects: []
  - method: GET
    path: "/packing-orders"
    description: "List packing orders, filterable by move_job_id (FK reverse-reachability for PackingOrder)."
    roles: [Estimator, PlatformAdmin, Customer]
    code: 200
    input: ["move_job_id?", "limit?", "offset?"]
    output: PackingOrder[]
    side_effects: []
  - method: PATCH
    path: "/packing-orders/{id}"
    description: "Update crate count / packing lines; recomputes packing total."
    roles: [Estimator, PlatformAdmin]
    code: 200
    input: ["crate_count?", "packing_lines?"]
    output: PackingOrder
    side_effects: ["calc packing_total -> packing_total_cents"]

  # ---- Estimate ----
  - method: POST
    path: "/estimates"
    description: "Generate an estimate from a survey; locks the survey; OCC on MoveJob.version."
    roles: [Estimator]
    code: 201
    input: [move_job_id, survey_id, binding_type, valuation_coverage, "declared_value_cents?", "deductible_cents?", expected_move_job_version]
    output: Estimate
    side_effects: ["calc valuation_premium", "calc estimate_total -> estimate_total_cents", "survey.locked=true", "increments MoveJob.version by 1"]
  - method: GET
    path: "/estimates/{id}"
    description: "Fetch an estimate with all computed cents fields."
    roles: [Estimator, PlatformAdmin, Customer]
    code: 200
    input: []
    output: Estimate
    side_effects: []
  - method: GET
    path: "/estimates"
    description: "List estimates, filterable by move_job_id and survey_id (FK reverse-reachability for Estimate)."
    roles: [Estimator, PlatformAdmin, Customer]
    code: 200
    input: ["move_job_id?", "survey_id?", "status?", "limit?", "offset?"]
    output: Estimate[]
    side_effects: []
  - method: POST
    path: "/estimates/{id}/revise"
    description: "Revise a DRAFT/REVISED estimate; recomputes total (cyclic loop)."
    roles: [Estimator]
    code: 200
    input: ["binding_type?", "valuation_coverage?", "declared_value_cents?", "deductible_cents?"]
    output: Estimate
    side_effects: ["calc estimate_total -> estimate_total_cents", "status -> REVISED", "increments Estimate.version"]
  - method: POST
    path: "/estimates/{id}/accept"
    description: "Customer accepts an estimate; books the job and supersedes siblings."
    roles: [Customer]
    code: 200
    input: []
    output: Estimate
    side_effects: ["status=ACCEPTED", "MoveJob QUOTING->BOOKED", "sibling estimates -> SUPERSEDED", "gross_charges_cents += estimate_total_cents"]

  # ---- Truck / Crew (resource pool) ----
  - method: POST
    path: "/trucks"
    description: "Register a truck in the fleet."
    roles: [Dispatcher, PlatformAdmin]
    code: 201
    input: [plate, capacity_cubic_feet, home_state_code]
    output: Truck
    side_effects: []
  - method: GET
    path: "/trucks/{id}"
    description: "Fetch a truck."
    roles: [Dispatcher, PlatformAdmin]
    code: 200
    input: []
    output: Truck
    side_effects: []
  - method: POST
    path: "/crews"
    description: "Register a crew."
    roles: [Dispatcher, PlatformAdmin]
    code: 201
    input: [name, head_count, home_state_code]
    output: Crew
    side_effects: []
  - method: GET
    path: "/crews/{id}"
    description: "Fetch a crew."
    roles: [Dispatcher, PlatformAdmin]
    code: 200
    input: []
    output: Crew
    side_effects: []

  # ---- Dispatch ----
  - method: POST
    path: "/dispatches"
    description: "Schedule a truck+crew for a job within a time window (overlap + capacity checks)."
    roles: [Dispatcher]
    code: 201
    input: [move_job_id, truck_id, crew_id, window_start, window_end, required_crew_size]
    output: Dispatch
    side_effects: ["status=SCHEDULED", "occupies truck and crew windows"]
  - method: GET
    path: "/dispatches/{id}"
    description: "Fetch a dispatch."
    roles: [Dispatcher, PlatformAdmin, Customer]
    code: 200
    input: []
    output: Dispatch
    side_effects: []
  - method: GET
    path: "/dispatches"
    description: "List dispatches, filterable by move_job_id, truck_id, crew_id (FK reverse-reachability for Dispatch)."
    roles: [Dispatcher, PlatformAdmin, Customer]
    code: 200
    input: ["move_job_id?", "truck_id?", "crew_id?", "status?", "limit?", "offset?"]
    output: Dispatch[]
    side_effects: []
  - method: POST
    path: "/dispatches/{id}/depart"
    description: "Mark a dispatch EN_ROUTE; moves the job IN_TRANSIT."
    roles: [Dispatcher]
    code: 200
    input: []
    output: Dispatch
    side_effects: ["Dispatch SCHEDULED->EN_ROUTE", "MoveJob BOOKED->IN_TRANSIT"]
  - method: POST
    path: "/dispatches/{id}/complete"
    description: "Complete a dispatch with actual weight; delivers the job and reconciles the final charge."
    roles: [Dispatcher]
    code: 200
    input: [actual_weight_lbs, "actual_cubic_feet?", "addendum_present?"]
    output: Dispatch
    side_effects: ["Dispatch EN_ROUTE->COMPLETED", "MoveJob IN_TRANSIT->DELIVERED", "calc final_charge_reconciliation"]
  - method: POST
    path: "/dispatches/{id}/cancel"
    description: "Cancel a SCHEDULED dispatch; frees truck and crew windows."
    roles: [Dispatcher]
    code: 200
    input: []
    output: Dispatch
    side_effects: ["Dispatch SCHEDULED->CANCELLED", "free truck+crew windows"]

  # ---- StorageLot (SIT) ----
  - method: POST
    path: "/storage-lots"
    description: "Open a storage-in-transit lot for a job."
    roles: [Dispatcher, PlatformAdmin]
    code: 201
    input: [move_job_id, intake_date]
    output: StorageLot
    side_effects: ["status=IN_STORAGE"]
  - method: GET
    path: "/storage-lots/{id}"
    description: "Fetch a storage lot."
    roles: [Dispatcher, PlatformAdmin, Customer]
    code: 200
    input: []
    output: StorageLot
    side_effects: []
  - method: GET
    path: "/storage-lots"
    description: "List storage lots, filterable by move_job_id (FK reverse-reachability for StorageLot)."
    roles: [Dispatcher, PlatformAdmin, Customer]
    code: 200
    input: ["move_job_id?", "status?", "limit?", "offset?"]
    output: StorageLot[]
    side_effects: []
  - method: POST
    path: "/storage-lots/{id}/release"
    description: "Release a lot at a date; accrues SIT charge to the job ledger."
    roles: [Dispatcher]
    code: 200
    input: [release_date]
    output: StorageLot
    side_effects: ["calc sit_accrual", "status=RELEASED", "gross_charges_cents += sit_charge_cents"]
  - method: POST
    path: "/storage-lots/{id}/waive"
    description: "Waive a released lot's SIT charge; credits the job ledger; OCC on MoveJob.version."
    roles: [PlatformAdmin]
    code: 200
    input: [expected_move_job_version]
    output: StorageLot
    side_effects: ["status=WAIVED", "waived_cents += sit_charge_cents", "recompute balance_due_cents", "increments MoveJob.version by 1"]

  # ---- DamageClaim + ClaimItem ----
  - method: POST
    path: "/damage-claims"
    description: "File a damage claim on a delivered job; snapshots coverage and deductible."
    roles: [ClaimsAdjuster, Customer]
    code: 201
    input: [move_job_id]
    output: DamageClaim
    side_effects: ["status=UNDER_REVIEW", "coverage_snapshot/deductible copied from accepted estimate", "filed_by_user_id = X-User-ID"]
  - method: GET
    path: "/damage-claims/{id}"
    description: "Fetch a damage claim."
    roles: [ClaimsAdjuster, PlatformAdmin, Customer]
    code: 200
    input: []
    output: DamageClaim
    side_effects: []
  - method: GET
    path: "/damage-claims"
    description: "List damage claims, filterable by move_job_id (FK reverse-reachability for DamageClaim)."
    roles: [ClaimsAdjuster, PlatformAdmin, Customer]
    code: 200
    input: ["move_job_id?", "status?", "limit?", "offset?"]
    output: DamageClaim[]
    side_effects: []
  - method: POST
    path: "/damage-claims/{id}/items"
    description: "Add a damaged-item line to a claim under review."
    roles: [ClaimsAdjuster, Customer]
    code: 201
    input: [label, item_weight_lbs, repair_cost_cents, replacement_value_cents]
    output: ClaimItem
    side_effects: []
  - method: GET
    path: "/damage-claims/{id}/items"
    description: "List items of a claim (FK reverse-reachability for ClaimItem)."
    roles: [ClaimsAdjuster, PlatformAdmin, Customer]
    code: 200
    input: ["limit?", "offset?"]
    output: ClaimItem[]
    side_effects: []
  - method: POST
    path: "/damage-claims/{id}/approve"
    description: "Approve a claim (SoD enforced); computes settlement payout."
    roles: [ClaimsAdjuster]
    code: 200
    input: []
    output: DamageClaim
    side_effects: ["calc claim_settlement", "status=APPROVED", "refunded_cents += settlement_cents"]
  - method: POST
    path: "/damage-claims/{id}/deny"
    description: "Deny a claim (SoD enforced)."
    roles: [ClaimsAdjuster]
    code: 200
    input: []
    output: DamageClaim
    side_effects: ["status=DENIED"]
  - method: POST
    path: "/damage-claims/{id}/reopen"
    description: "Reopen an approved claim; reverses the prior payout credit."
    roles: [ClaimsAdjuster]
    code: 200
    input: []
    output: DamageClaim
    side_effects: ["status=UNDER_REVIEW", "settlement_cents=0", "refunded_cents -= prior settlement", "recompute balance_due_cents"]

# =============================================================================
# 1.6 Error Code Catalog
# =============================================================================
errors:
  - id: ERR_UNAUTHENTICATED
    http: 401
    condition: "Missing/unknown X-User-Role or missing X-User-ID."
  - id: ERR_FORBIDDEN_ROLE
    http: 403
    condition: "Acting role not permitted for this endpoint per RBAC."
  - id: ERR_NOT_FOUND
    http: 404
    condition: "Referenced resource (path id or body FK) does not exist."
  - id: ERR_NOT_RESOURCE_OWNER
    http: 403
    condition: "Acting Customer is not the owner (customer_id) of the targeted MoveJob."
  - id: ERR_SEGREGATION_OF_DUTIES
    http: 403
    condition: "Acting user authored the estimate they are accepting, or filed the claim they are adjudicating."
  - id: ERR_INVALID_STATE
    http: 409
    condition: "Requested transition not defined from the resource's current state."
  - id: ERR_DEPENDENT_STATE_BLOCK
    http: 409
    condition: "A cross-entity precondition blocks the transition (unpaid deposit on depart; open claim/storage on close)."
  - id: ERR_SURVEY_LOCKED
    http: 409
    condition: "Adding a SurveyItem to a survey that has already been used to generate an estimate."
  - id: ERR_INVALID_FIELD
    http: 422
    condition: "Enum value not allowed, or numeric field out of declared range."
  - id: ERR_DECLARED_VALUE_TOO_LOW
    http: 422
    condition: "FULL_VALUE estimate with declared_value_cents below estimated_weight_lbs * 600 ($6/lb), or deductible not in the allowed set."
  - id: ERR_INVALID_WINDOW
    http: 422
    condition: "Dispatch window_end is not strictly after window_start."
  - id: ERR_TRUCK_CAPACITY_EXCEEDED
    http: 409
    condition: "Survey total_cubic_feet exceeds the assigned Truck.capacity_cubic_feet."
  - id: ERR_CREW_TOO_SMALL
    http: 409
    condition: "Crew.head_count is below the dispatch's required_crew_size."
  - id: ERR_TRUCK_DOUBLE_BOOKED
    http: 409
    condition: "Requested window overlaps a non-terminal dispatch on the same truck (half-open intervals; boundary touch allowed)."
  - id: ERR_CREW_DOUBLE_BOOKED
    http: 409
    condition: "Requested window (expanded by the crew turnaround buffer) overlaps a non-terminal dispatch on the same crew."
  - id: ERR_PAYMENT_AMOUNT_MISMATCH
    http: 422
    condition: "BALANCE payment amount does not equal MoveJob.balance_due_cents, or DEPOSIT outside the allowed bound."
  - id: ERR_STALE_VERSION
    http: 412
    condition: "expected_move_job_version does not match the current MoveJob.version (OCC)."
  - id: ERR_CLAIM_NOT_ELIGIBLE
    http: 409
    condition: "Filing a damage claim on a job not in DELIVERED state or without an accepted estimate."
  - id: ERR_CLAIM_NO_ITEMS
    http: 409
    condition: "Approving a damage claim that has no ClaimItem rows."
  - id: ERR_VALIDATION
    http: 400
    condition: "Required field missing or request body malformed."
  - id: ERR_NOT_DELIVERED
    http: 409
    condition: "Adjudicating a claim whose MoveJob is no longer in DELIVERED state."
  - id: ERR_RELEASE_BEFORE_INTAKE
    http: 422
    condition: "StorageLot release_date is earlier than intake_date."
  - id: ERR_DEPOSIT_BEFORE_BOOKED
    http: 409
    condition: "Deposit payment attempted before the job is BOOKED."
  - id: ERR_PAGINATION_INVALID
    http: 422
    condition: "limit/offset outside allowed bounds (limit 1..100, offset >= 0)."
  - id: ERR_DUPLICATE_EMAIL
    http: 409
    condition: "Customer email already registered."
  - id: ERR_DUPLICATE_PLATE
    http: 409
    condition: "Truck plate already registered."
  - id: ERR_CANCEL_IN_TRANSIT
    http: 409
    condition: "Cancelling a job that has an EN_ROUTE dispatch."

# =============================================================================
# 1.7 RBAC Matrix
# =============================================================================
roles:
  - name: Customer
    description: "The booking customer; owns a MoveJob, accepts estimates, pays, cancels, may file claims."
    identity: "entity_backed:Customer"
    exclusive_operations:
      - "POST /estimates/{id}/accept"
      - "POST /move-jobs/{id}/payments"
      - "POST /move-jobs/{id}/cancel"
    shared_operations:
      - "POST /customers"
      - "POST /move-jobs"
      - "POST /damage-claims"
      - "POST /damage-claims/{id}/items"
      - "GET reads on owned resources"
  - name: Estimator
    description: "Authors surveys and estimates; cannot accept the estimate they authored (SoD)."
    identity: "opaque"
    exclusive_operations:
      - "POST /surveys"
      - "POST /surveys/{id}/items"
      - "POST /estimates"
      - "POST /estimates/{id}/revise"
    shared_operations:
      - "POST /packing-orders"
      - "PATCH /packing-orders/{id}"
      - "GET reads"
  - name: Dispatcher
    description: "Owns the truck/crew pool; schedules, departs, completes, cancels dispatches; manages storage lots."
    identity: "opaque"
    exclusive_operations:
      - "POST /dispatches"
      - "POST /dispatches/{id}/depart"
      - "POST /dispatches/{id}/complete"
      - "POST /dispatches/{id}/cancel"
      - "POST /storage-lots/{id}/release"
    shared_operations:
      - "POST /trucks"
      - "POST /crews"
      - "POST /storage-lots"
      - "GET reads"
  - name: ClaimsAdjuster
    description: "Adjudicates damage claims; cannot adjudicate a claim they filed (SoD)."
    identity: "opaque"
    exclusive_operations:
      - "POST /damage-claims/{id}/approve"
      - "POST /damage-claims/{id}/deny"
      - "POST /damage-claims/{id}/reopen"
    shared_operations:
      - "POST /damage-claims"
      - "POST /damage-claims/{id}/items"
      - "GET reads"
  - name: PlatformAdmin
    description: "Operator superuser for fleet setup, job close, and SIT waivers."
    identity: "opaque"
    exclusive_operations:
      - "POST /move-jobs/{id}/close"
      - "POST /storage-lots/{id}/waive"
    shared_operations:
      - "POST /customers"
      - "POST /surveys"
      - "POST /packing-orders"
      - "POST /trucks"
      - "POST /crews"
      - "POST /storage-lots"
      - "GET reads"
