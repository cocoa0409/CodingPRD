        grounds: ["errors[ERR_COACHING_NOT_OVERDUE]"]
        distinguishing_aspect: "escalate requires OVERDUE: escalating an ASSIGNED assignment (not yet swept) -> ERR_COACHING_NOT_OVERDUE."
        test_recipe:
          setup: ["carrier; driver; coaching ASSIGNED with future due_date"]
          setup_api_calls:
            - { call: "POST /safety/carriers", payload: { dot_number: "DOT-2325", legal_name: "Escalate Carrier", fleet_size: 2 }, as: SafetyAdmin, captures: { c_id: $.data.id } }
            - { call: "POST /safety/drivers", payload: { carrier_id: "${c_id}", cdl_number: "CDL-2325", full_name: "Joy Ile", hire_date: "2025-01-01T00:00:00Z" }, as: SafetyManager, captures: { d_id: $.data.id, d_ver: $.data.version } }
            - { call: "POST /safety/coaching-assignments", payload: { driver_id: "${d_id}", coaching_type: "PROBATION", due_date: "2026-12-01T00:00:00Z", expected_driver_version: "${d_ver}" }, as: SafetyManager, captures: { co: $.data.id } }
          trigger:
