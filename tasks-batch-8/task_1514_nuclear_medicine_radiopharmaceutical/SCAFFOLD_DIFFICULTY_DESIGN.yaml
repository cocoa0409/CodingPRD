            - { call: "POST /nuclear-medicine/isotope-deliveries", payload: { isotope_product_id: "${iso}", scheduled_arrival_at: "2026-08-01T08:00:00Z", reference_activity_mbq: 5000, reference_time_at: "2026-08-01T08:00:00Z" }, as: Radiopharmacist, captures: { del: $.data.id } }
