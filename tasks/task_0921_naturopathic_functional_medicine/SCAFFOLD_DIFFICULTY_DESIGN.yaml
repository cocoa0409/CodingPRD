  # ==========================================================================
  - rule_id: transitive_cascade
    instances:

      - name: critical_analyte_freezes_the_chart_through_five_chained_hops
        grounds:
          - state_machines.LabOrder.COLLECTED_to_CRITICAL_ESCALATED
          - calculations.analyte_band_classification
          - entities.Referral.fields.referral_type
          - entities.Patient.fields.clinical_write_gate
          - entities.Protocol.fields.advancement_blocked
          - entities.ProtocolItem.fields.titration_locked
          - validations[priority=6]
        distinguishing_aspect: |
          Depth-5 cascade triggered by posting an analyte result: the critical flag moves
          the LabOrder (1), the escalated order raises a RED_FLAG_AUTO Referral (2), the
          unacknowledged referral flips the Patient gate (3), the closed gate blocks the
          ACTIVE Protocol (4), and the blocked protocol locks its ProtocolItem (5). Each
          hop is caused by the previous hop, not by the original request.
        test_recipe:
          setup:
            - "An ND, an OR patient with four attested intake sections (protocol score 90)"
            - "An ACTIVE protocol with one item, and a collected SERUM_METABOLIC cash lab order"
            - "The logical clock stands at its default 2026-05-01T00:00:00Z"
