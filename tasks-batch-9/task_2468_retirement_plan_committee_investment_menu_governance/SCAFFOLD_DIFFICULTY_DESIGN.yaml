  # ===========================================================================
  # RULE 4 — transitive_cascade
  # Instance 1 is depth 4 off QuarterlyReview PENDING_MINUTES -> FINALIZED.
  # Instance 2 is depth 3 off a DIFFERENT triggering transition
  # (AssetClassSlot ACTIVE -> RETIRED via /retire), with each link caused by
  # the previous one.
  # ===========================================================================
  - rule_id: transitive_cascade
    instances:
      - name: finalize_score_to_watch_to_slot_to_posture_to_blocked_proposals_depth4
        grounds:
          - state_machines.QuarterlyReview.PENDING_MINUTES_to_FINALIZED
          - state_machines.Fund.CLEAR_to_WATCH
          - state_machines.AssetClassSlot.ACTIVE_to_AT_RISK
          - state_machines.FundReplacementProposal.UNDER_REVIEW_to_BLOCKED
          - state_machines.FundReplacementProposal.DRAFT_to_BLOCKED
          - calculations.fund_composite_score
          - calculations.watch_recommendation
          - calculations.menu_posture
          - entities.Fund.fields.latest_composite_score
          - entities.AssetClassSlot.fields.status_before_last_review
          - entities.Plan.fields.at_risk_slot_ratio
          - entities.FundReplacementProposal.fields.pre_block_status
        distinguishing_aspect: |
          A single /finalize call propagates four causally chained hops: the hop-0 score write
          (latest_composite_score 39.00) is the only reason hop 1 moves Fund HRLGX CLEAR -> WATCH,
          which is the only reason hop 2 moves its slot ACTIVE -> AT_RISK, which is the only reason
          hop 3 lifts at_risk_slot_ratio to 0.5000 and menu_posture OPEN -> FROZEN, which is the only
          reason hop 4 blocks BOTH replacement proposals — each recording a different pre_block_status
          (UNDER_REVIEW for the slot_index 1 proposal, DRAFT for the slot_index 2 proposal).
        test_recipe:
          setup:
            - "Logical clock at 2026-08-01T00:00:00Z; Plan.fiscal_quarter_index 0."
            - "One Plan with charter_status ADOPTED, menu_slot_capacity 8, menu_posture OPEN, at_risk_slot_ratio 0.0000."
            - "Two ACTIVE members on FILLED voting seats (one CHAIR seat_class), training CURRENT; one ADOPTED IPS with watch_trigger_score_max 40.00, remediation_trigger_score_max 25.00, cure_margin_points 10.00, watch_grace_quarters 2 and weights 0.40/0.20/0.20/0.10/0.10."
            - "AssetClassSlot slot_index 1 (US_LARGE_CAP, CORE) status ACTIVE seating Fund HRLGX; AssetClassSlot slot_index 2 (CORE_BOND, CORE) status ACTIVE seating Fund HRCBX; both funds watch_status CLEAR with consecutive_breach_quarters 0."
            - "Two CANDIDATE successor funds HRLGY (US_LARGE_CAP) and HRCBY (CORE_BOND), both IPS-eligible."
            - "FundReplacementProposal P1 on the slot_index 1 slot in status UNDER_REVIEW; FundReplacementProposal P2 on the slot_index 2 slot in status DRAFT."
            - "QuarterlyReview for quarter_index 0 in status PENDING_MINUTES with two SUBMITTED scorecards, attached to a MINUTES_APPROVED meeting."
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { current_utc: "2026-08-01T00:00:00Z" }
              as: PlanSponsorAdmin
            - call: "POST /governance/plans"
              payload: { plan_name: "Harrowgate 401(k) Plan", plan_sponsor_name: "Harrowgate Foods Inc", erisa_covered: true, participant_account_count: 300, menu_slot_capacity: 8, quorum_min_voting_members: 2, voting_threshold_pct: 0.6667, max_voting_seats: 2, notice_lead_days_required: 30, blackout_buffer_days: 3, fiscal_quarter_index: 0 }
              as: PlanSponsorAdmin
              captures: { plan_id: $.data.id }
            - call: "POST /governance/committee-seats"
              payload: { plan_id: "${plan_id}", seat_code: "CHAIR", seat_class: "CHAIR", voting: true, seat_index: 1 }
              as: PlanSponsorAdmin
              captures: { seat_chair_id: $.data.id }
            - call: "POST /governance/committee-seats"
              payload: { plan_id: "${plan_id}", seat_code: "FIN-1", seat_class: "FINANCE", voting: true, seat_index: 2 }
              as: PlanSponsorAdmin
              captures: { seat_fin_id: $.data.id }
            - call: "POST /governance/plans/${plan_id}/charter/adopt"
              payload: { quorum_min_voting_members: 2, voting_threshold_pct: 0.6667, max_voting_seats: 2, charter_doc_ref: "CHARTER-HG-V1" }
