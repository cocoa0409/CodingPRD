              as: RatingProviderAdmin
              captures: { b18_after_issue: $.data.certified_incentive_cents }
          trigger:
            - call: "POST /ratings/${rt18}/void"
              payload: { reason: "Duplicate rating discovered in registry pre-check" }
              as: RatingProviderAdmin
          assert:
            - "the captured ledger value after issuance was 100000"
            - "DocumentPackage.${dp18}.status == REVOKED"
            - "DocumentPackage.${dp18}.revocation_reason == RATING_VOID"
            - "DocumentPackage.${dp18}.certified_amount_cents == 100000"
            - "Builder.${b18}.certified_incentive_cents == 0"
            - "Builder.${b18}.revoked_package_count == 1"
            - "Builder.${b18}.status == SAMPLING_SUSPENDED"
            - "Rating.${rt18}.stage == VOID"
            - "Rating.${rt18}.file_locked == true"

      - name: add_then_withdraw_home_leaves_subdivision_coverage_ledger_unchanged
        grounds:
          - calculations.home_coverage_ledger
          - concurrency_rules.sample-membership-add-stale-set
          - concurrency_rules.sample-membership-withdraw-stale-set
          - entities.Subdivision.fields.sampled_home_count
          - entities.Subdivision.fields.unsampled_home_count
        distinguishing_aspect: |
          A different conserved quantity: HOME COVERAGE — the partition invariant
          sampled_home_count + unsampled_home_count == homes_count. Adding a home shifts one unit from
          unsampled to sampled and withdrawing it shifts the unit back, so all three counters return to
          3/0/3 even though SampleSet.version has advanced to 3 (the OCC counter is not conserved).
        test_recipe:
          setup:
            - "Builder Waverly Homes (PRODUCTION), subdivision Sable Creek (IECC_2021, CZ4, sampling_enabled true) with three homes L-1301, L-1302, L-1303 (homes_count 3, sampled 0, unsampled 3)"
            - "One FORMING sample set covering 2026-08-01..2026-08-31 at version 1"
          setup_api_calls:
            - call: "POST /builders"
              payload: { name: "Waverly Homes", builder_type: "PRODUCTION", utility_program_budget_cents: 500000 }
              as: RatingProviderAdmin
              captures: { b19: $.data.id }
            - call: "POST /subdivisions"
              payload: { builder_id: "${b19}", name: "Sable Creek", code_edition: "IECC_2021", climate_zone: "CZ4", sampling_enabled: true, compliance_path_preference: "ERI_PATH" }
              as: RatingProviderAdmin
              captures: { sd19: $.data.id }
            - call: "POST /raters"
              payload: { full_name: "Rae Tarrant", cert_level: "RATER", cert_expires_at: "2027-06-30T00:00:00Z" }
              as: RatingProviderAdmin
              captures: { r19: $.data.id }
            - call: "POST /plan-models"
              payload: { subdivision_id: "${sd19}", plan_code: "STD-2400", conditioned_floor_area_sqft: 2400, conditioned_volume_cuft: 21600, bedrooms: 4, envelope_ua_btu_per_hr_f: 320, design_ach50: 3.00, design_duct_leakage_cfm25_per_100sqft: 3.00, hvac_efficiency_index: 9, pv_capacity_kw_dc: 0 }
              as: CertifiedRater
              as_user_id: "${r19}"
              captures: { pm19: $.data.id }
            - call: "POST /homes"
              payload: { subdivision_id: "${sd19}", plan_model_id: "${pm19}", lot_number: "L-1301", permit_date: "2026-08-04" }
              as: BuilderRep
              as_user_id: "${b19}"
              captures: { h19a: $.data.id }
            - call: "POST /homes"
              payload: { subdivision_id: "${sd19}", plan_model_id: "${pm19}", lot_number: "L-1302", permit_date: "2026-08-05" }
              as: BuilderRep
              as_user_id: "${b19}"
              captures: { h19b: $.data.id }
            - call: "POST /homes"
              payload: { subdivision_id: "${sd19}", plan_model_id: "${pm19}", lot_number: "L-1303", permit_date: "2026-08-06" }
              as: BuilderRep
              as_user_id: "${b19}"
              captures: { h19c: $.data.id }
            - call: "POST /sample-sets"
              payload: { subdivision_id: "${sd19}", window_start_date: "2026-08-01", window_end_date: "2026-08-31" }
              as: CertifiedRater
              as_user_id: "${r19}"
              captures: { ss19: $.data.id, ss19_v1: $.data.version }
          trigger:
            - call: "POST /sample-sets/${ss19}/homes"
              payload: { home_id: "${h19a}", expected_sample_set_version: "${ss19_v1}" }
              as: CertifiedRater
              as_user_id: "${r19}"
            - call: "GET /sample-sets/${ss19}"
              payload: {}
              as: CertifiedRater
              as_user_id: "${r19}"
              captures: { ss19_v2: $.data.version }
            - call: "POST /sample-sets/${ss19}/homes/${h19a}/withdraw"
              payload: { expected_sample_set_version: "${ss19_v2}" }
              as: CertifiedRater
              as_user_id: "${r19}"
          assert:
            - "Subdivision.${sd19}.homes_count == 3"
            - "Subdivision.${sd19}.sampled_home_count == 0"
            - "Subdivision.${sd19}.unsampled_home_count == 3"
            - "SampleSet.${ss19}.member_count == 0"
            - "SampleSet.${ss19}.status == FORMING"
            - "SampleSet.${ss19}.version == 3"
            - "Home.${h19a}.sample_set_id == null"
            - "Home.${h19a}.sampling_role == UNASSIGNED"
            - "Home.${h19a}.individual_testing_required == false"
