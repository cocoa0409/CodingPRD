  - { method: GET, path: "/husbandry-cases", description: "List husbandry cases", roles: [AgencyAdmin, AgencyOps, AgencyFinance, PortAuthority, PrincipalRep, VendorRep, CrewingAgent, HusbandryOfficer], code: 200, input: ["port_call_id?", "crew_change_id?", "status?", "severity?", "limit?", "offset?"], output: "HusbandryCase[]", side_effects: [] }
  - { method: GET, path: "/husbandry-cases/{id}", description: "Get husbandry case", roles: [AgencyAdmin, AgencyOps, AgencyFinance, PortAuthority, PrincipalRep, VendorRep, CrewingAgent, HusbandryOfficer], code: 200, input: [], output: HusbandryCase, side_effects: [] }
  - { method: POST, path: "/husbandry-cases/{id}/begin-treatment", description: "Begin treatment", roles: [HusbandryOfficer], code: 200, input: [], output: HusbandryCase, side_effects: ["OPEN -> IN_TREATMENT"] }
  - { method: POST, path: "/husbandry-cases/{id}/clear", description: "Clear case", roles: [HusbandryOfficer], code: 200, input: [], output: HusbandryCase, side_effects: ["-> CLEARED"] }
  - { method: POST, path: "/husbandry-cases/{id}/repatriate", description: "Repatriate; cascades to linked crew change", roles: [HusbandryOfficer], code: 200, input: [], output: HusbandryCase, side_effects: ["-> REPATRIATED", "linked CrewChange -> REPATRIATED"] }
  - { method: POST, path: "/husbandry-cases/{id}/waive-departure-hold", description: "Grant one-case departure waiver", roles: [AgencyAdmin], code: 200, input: [], output: HusbandryCase, side_effects: ["departure_waiver_granted = true"] }

  # --- Logical clock (test-driving) ---
  - { method: POST, path: "/_clock/set_current_utc", description: "Set the logical clock. Startup default (before any set) is exactly 2026-05-01T00:00:00Z; the server never falls back to wall-clock time.", roles: [AgencyAdmin], code: 200, input: [to_iso8601], output: "{ current_utc: string }", side_effects: ["lazy PASS_EXPIRED evaluation runs against the new time on next read"] }

# =============================================================================
# 1.6 Error Code Catalog
# =============================================================================
errors:
  - { id: ERR_UNAUTHENTICATED, http: 401, condition: "missing/invalid X-User-Role or X-User-ID" }
  - { id: ERR_FORBIDDEN_ROLE, http: 403, condition: "role not permitted on this endpoint" }
  - { id: ERR_NOT_RESOURCE_OWNER, http: 403, condition: "entity-backed role acting on a resource it does not own" }
  - { id: ERR_CONFIRM_ROLE_MISMATCH, http: 403, condition: "ServiceOrder confirm actor does not match kind (PILOT requires PortAuthority; others require owning VendorRep)" }
  - { id: ERR_NOT_FOUND, http: 404, condition: "path id or payload reference does not resolve" }
  - { id: ERR_INVALID_STATE, http: 409, condition: "state machine does not permit the requested transition from current state" }
  - { id: ERR_STALE_VERSION, http: 412, condition: "expected_port_call_version != current PortCall.version (OCC)" }
  - { id: ERR_BERTH_WINDOW_OVERLAP, http: 409, condition: "half-open overlap with a CONFIRMED/OCCUPIED window on the same berth_code" }
  - { id: ERR_RESOURCE_UNIT_OVERLAP, http: 409, condition: "buffer-inflated closed overlap with a CONFIRMED/IN_PROGRESS order on the same resource_unit" }
  - { id: ERR_DUPLICATE_NOTIFICATION_TYPE, http: 409, condition: "an AuthorityNotification of this authority_type already exists for the call in any non-WITHDRAWN status" }
  - { id: ERR_DUPLICATE_BL_NUMBER, http: 409, condition: "bl_number already registered on this port call in a non-terminal document" }
  - { id: ERR_INVALID_REQUEST, http: 400, condition: "missing required field / invalid enum / out-of-range numeric (checked after all state and business rules)" }
  - { id: ERR_PRE_ARRIVAL_DEADLINE_MISSED, http: 422, condition: "file-pre-arrival attempted after eta - 24h" }
  - { id: ERR_WINDOW_INVALID, http: 422, condition: "window start not strictly before end" }
  - { id: ERR_WINDOW_NOT_STARTED, http: 422, condition: "occupy/start before the window opens (berth: start_at; service: window_start - 60m)" }
  - { id: ERR_PASSPORT_EXPIRY_INVALID, http: 422, condition: "passport_expiry not strictly after the port call etd" }
  - { id: ERR_SHORE_PASS_EXPIRED, http: 422, condition: "shore_pass_expires_at not in the future at issue time" }
  - { id: ERR_NOTIFICATIONS_OUTSTANDING, http: 422, condition: "required authority notifications missing, not submitted, or not acknowledged" }
  - { id: ERR_HM_ACK_OUTSTANDING, http: 422, condition: "HARBOR_MASTER notification not ACKNOWLEDGED for this call at occupy" }
  - { id: ERR_BERTH_WINDOW_MISMATCH, http: 422, condition: "berth_window_id belongs to a different port call" }
  - { id: ERR_BERTH_NOT_OCCUPIED, http: 422, condition: "referenced berth window is not OCCUPIED" }
  - { id: ERR_OPEN_CREW_CHANGES, http: 422, condition: "crew change in a blocking status at sailing" }
  - { id: ERR_CARGO_DOCS_ON_HOLD, http: 422, condition: "cargo document ON_HOLD at sailing" }
  - { id: ERR_BL_RELEASE_TOO_EARLY, http: 422, condition: "document release before ops_status == ALONGSIDE" }
  - { id: ERR_FREIGHT_NOT_PAID, http: 422, condition: "B/L release with freight_paid == false" }
  - { id: ERR_VISA_NOT_REQUIRED, http: 422, condition: "request-visa on a crew change with requires_visa == false" }
  - { id: ERR_VISA_REQUIRED, http: 422, condition: "issue-shore-pass from DOCS_VERIFIED while requires_visa == true" }
  - { id: ERR_PORT_CALL_NOT_EDITABLE, http: 422, condition: "child mutation while port call is CANCELLED or CLOSED (or past the documented ops phase)" }
  - { id: ERR_PORT_CALL_NOT_SAILED, http: 422, condition: "finalize before ops_status == SAILED" }
  - { id: ERR_SEGREGATION_OF_DUTIES, http: 422, condition: "finalize/refinalize actor equals DA created_by_user_id" }
  - { id: ERR_DISPUTES_OPEN, http: 422, condition: "refinalize while any dispute is RAISED/UNDER_REVIEW/ESCALATED" }
  - { id: ERR_DA_NOT_SETTLED, http: 422, condition: "port-call close before DA SETTLED" }
  - { id: ERR_DA_NOT_SENT, http: 422, condition: "record-sailing while the DA is still PRO_FORMA (or absent/SUPERSEDED)" }
  - { id: ERR_NO_LINKED_CREW_CHANGE, http: 422, condition: "repatriate without crew_change_id" }
  - { id: ERR_PRINCIPAL_SUSPENDED, http: 422, condition: "port-call creation for a SUSPENDED principal" }
  - { id: ERR_VENDOR_SUSPENDED, http: 422, condition: "PO create/send/acknowledge or SO confirm with a SUSPENDED vendor" }
  - { id: ERR_VENDOR_CATEGORY_MISMATCH, http: 422, condition: "po.category not in vendor.categories" }
  - { id: ERR_VENDOR_KIND_MISMATCH, http: 422, condition: "vendor_id missing for TUG/LINEBOAT/LAUNCH or present for PILOT" }
  - { id: ERR_FUNDING_SHORTFALL, http: 422, condition: "record-sailing with (advances_received - advances_refunded) < advance_required" }
  - { id: ERR_CREDIT_LIMIT_EXCEEDED, http: 422, condition: "port-call creation when forward exposure already >= credit_limit (limit != 0)" }
  - { id: ERR_UNREFUNDED_ADVANCES, http: 422, condition: "settle while any advance has unapplied, unrefunded remainder" }
  - { id: ERR_BALANCE_NOT_ZERO, http: 422, condition: "settle while balance_due_cents != 0" }
  - { id: ERR_APPLY_EXCEEDS_REMAINING, http: 422, condition: "apply amount_cents exceeds the advance's remaining unapplied balance" }
  - { id: ERR_OPEN_CRITICAL_HUSBANDRY, http: 422, condition: "record-sailing with an unwaiversed open CRITICAL husbandry case" }

# =============================================================================
# 1.7 RBAC Matrix
# =============================================================================
roles:
  - name: AgencyAdmin
    description: "Agency superuser; hierarchical override for administrative and escalated actions"
    identity: opaque
    exclusive_operations: ["principal create/suspend/reinstate", "vendor create/suspend/reinstate", "tariff — none (PortAuthority exclusive)", "cost-dispute resolve", "husbandry waive-departure-hold", "logical clock set"]
    shared_operations: ["port-call cancel", "all reads"]
  - name: AgencyOps
    description: "Port call boarding/operations agent"
    identity: opaque
    exclusive_operations: ["port-call create/patch/ops transitions", "notification create/submit/resubmit", "berth window request/occupy/release/cancel", "service-order create/start/complete/cancel", "purchase-order create/send/cancel", "cargo-document lifecycle", "DA create/send/manual lines"]
    shared_operations: ["all reads"]
  - name: AgencyFinance
    description: "Agency finance controller; owns DA money lifecycle and PO matching"
    identity: opaque
    exclusive_operations: ["DA finalize/refinalize/settle", "funding advance apply/refund", "purchase-order match", "cost-dispute start-review/uphold/reject", "port-call close"]
    shared_operations: ["DA advances create", "DA manual lines", "all reads"]
  - name: PortAuthority
    description: "Port/harbor authority officer"
    identity: opaque
    exclusive_operations: ["notification acknowledge/reject", "grant-clearance", "berth window confirm", "visa grant", "tariff publish", "PILOT service-order confirm"]
    shared_operations: ["all reads"]
  - name: PrincipalRep
    description: "Shipowner/operator representative; acts only on its own principal's accounts"
    identity: "entity_backed:Principal"
    exclusive_operations: ["cost-dispute create/escalate"]
    shared_operations: ["DA advances create", "all reads"]
  - name: VendorRep
    description: "Vendor representative; acts only on its own vendor's orders"
    identity: "entity_backed:Vendor"
    exclusive_operations: ["purchase-order acknowledge/deliver/invoice/reinvoice", "non-PILOT service-order confirm"]
    shared_operations: ["all reads"]
  - name: CrewingAgent
    description: "Crewing agent handling crew movement documentation"
    identity: opaque
    exclusive_operations: ["crew-change create/verify-docs/request-visa/issue-shore-pass/complete/cancel"]
    shared_operations: ["all reads"]
  - name: HusbandryOfficer
    description: "Welfare/medical case officer"
    identity: opaque
    exclusive_operations: ["husbandry-case create/begin-treatment/clear/repatriate"]
    shared_operations: ["all reads"]
