        grounds: ["calculations.contract_window_overlap", "errors[ERR_CONTRACT_WINDOW_OVERLAP]"]
        distinguishing_aspect: "Closed-date semantics: windows touching at a single date (05-31 in both) CONFLICT; only a strictly later start (06-01) is accepted."
        test_recipe:
          setup: ["corn ingredient; contract C1 [2026-04-01, 2026-05-31] OPEN"]
          setup_api_calls:
            - { call: "POST /api/ingredients", payload: { code: "CORN", name: "Yellow corn", hazard_class: "STANDARD", crude_protein_pct: 9.0, crude_fiber_pct: 2.2, metabolizable_energy_kcal_kg: 3300 }, as: MillManager, captures: { corn_id: $.data.id } }
