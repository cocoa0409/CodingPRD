              as: CreditOfficer
            - call: "POST /fhlb/collateral-verification-reviews"
              payload: { member_bank_id: "${member_id}", window_start: "2026-08-01T00:00:00Z", window_end: "2026-08-10T00:00:00Z", sample_size: 20 }
              as: CollateralReviewAuditor
