        distinguishing_aspect: "Both referential errors sit at priority 94 on different endpoints: posting revision 1 with item_count 0 returns ERR_EMPTY_AGENDA_PACKET, and once the meeting is in session an ORDINANCE_ADOPTION motion filed without instrument_id returns ERR_MOTION_TARGET_INVALID."
        test_recipe:
          setup: ["A SCHEDULED meeting with one empty DRAFT packet."]
          setup_api_calls:
            - call: "POST /clerk/venues"
              payload: { name: "Council Chamber", address: "1 Civic Plaza", capacity: 120, teardown_buffer_minutes: 30 }
