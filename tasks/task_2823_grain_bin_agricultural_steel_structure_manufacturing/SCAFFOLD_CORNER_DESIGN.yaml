              payload: { eave_height_m: 10.4 }
              as: DesignEngineer
              as_user_id: "${eng_a_id}"
              captures: { e_revise_from_review: $.data.error_id }
            - call: "POST /bin-designs/${d1_id}/request-revision"
              payload: { revision_note: "add a roof ring detail" }
