scenario: |
  2182. Workforce Reduction & WARN Act Compliance (corporate restructuring HR team):
  reduction planning & selection criteria documentation, adverse impact analysis of
  selections, WARN threshold determination (site/employment loss counting) & 60-day
  notice, state mini-WARN variations & content requirements, notification logistics &
  manager scripting, severance offer & OWBPA disclosure for age releases, benefit
  continuation & outplacement, rehire restrictions & backfill controls.

domain_name: workforce-reduction-warn-act
api_prefix: ""
# Deliberately empty: the topology is flat, so every entity is addressed at its own
# root collection (/reduction-plans, /sites, /employees, /selections, /warn-rules,
# /adverse-impact-analyses, /owbpa-disclosures, /warn-notices, /severance-offers,
# /position-restrictions) with no shared parent segment. Parentage travels in request
# bodies as foreign keys, never in the URL.

complexity_profile:
  primary_archetype: compliance_audit
  secondary_archetype: temporal_windowing
  complexity_layers:
    - dual_variant_calculation
    - cascading_side_effects
    - rate_threshold_triggers
    - optimistic_concurrency

  entity_topology: flat
  # Every entity is a peer addressed at its own top-level collection; parentage is
  # expressed only through FK fields in request bodies, never through nested URLs.
  # The two bulk endpoints (roster-import, selection-batch) are the sole exceptions
  # and are scoped actions, not ownership nesting.

  state_machine_shape: parallel
  # ReductionPlan carries two independent axes that advance on different triggers:
  # `approval_status` (DRAFT -> IN_LEGAL_REVIEW -> APPROVED -> EXECUTED, with an
  # IN_LEGAL_REVIEW -> DRAFT return arc) and `warn_status` (NOT_ASSESSED ->
  # THRESHOLD_PENDING -> NOTICES_ISSUED -> NOTICE_PERIOD_SATISFIED, advanced only by
  # cascades from Site recomputation and WarnNotice issuance). SeveranceOffer adds a
  # cycle (ISSUED -> SIGNED -> REVOKED -> ISSUED) and Selection adds a fork
  # (PROPOSED -> {SELECTED, EXEMPTED}) with divergent side-effect sets.

  relationship_patterns:
    - one_to_many
    - cross_aggregate

  role_model: segregation_of_duties
  # The RestructuringLead user id that submits a plan for legal review may not be the
  # X-User-ID that renders the legal decision on it, even when that human also holds
  # the EmploymentCounsel role.

  consistency_model: immediate

response_envelope:
  success: |
    { "meta": { "api_request_id": "req_xxx", "api_request_timestamp": "ISO8601" },
      "response_type": "object" | "array", "data": {} }
  error: |
    { "meta": { ... }, "response_type": "error",
      "data": { "error_id": "ERR_XXX", "message": "..." } }
  pagination_fields: ["limit", "offset", "total_count", "has_more"]
  pagination_defaults: { limit: 10, min: 1, max: 100, offset: 0 }

# ---------------------------------------------------------------------------
# 1.1 Entity-Relationship Table
# ---------------------------------------------------------------------------
entities:

  - name: ReductionPlan
    parent: null
    common_fields: true
    fields:
      - name: name
        type: string
        source: input
        description: "Human label for the reduction-in-force programme."
      - name: decisional_unit_name
        type: string
        source: input
        description: "OWBPA decisional unit label reproduced verbatim on every disclosure generated for this plan."
      - name: selection_criteria
        type: array
        source: input
        description: "Documented ranking criteria; array of objects {criterion_code, weight_pct, description}."
        constraints: "1-6 entries; criterion_code unique within the array; weight_pct integers that sum to exactly 100."
      - name: criteria_status
        type: enum
        source: system
        description: "DRAFT until POST /reduction-plans/{id}/lock-criteria, LOCKED afterwards. Selections may only be created while LOCKED."
        default: DRAFT
        constraints: "DRAFT | LOCKED"
      - name: approval_status
        type: enum
        source: system
        description: "Governance axis of the plan; advances independently of warn_status."
        default: DRAFT
        constraints: "DRAFT | IN_LEGAL_REVIEW | APPROVED | EXECUTED"
      - name: warn_status
        type: enum
        source: system
        description: "Compliance axis of the plan; advanced only by cascades from Site WARN recomputation, WarnNotice issuance, and plan execution."
        default: NOT_ASSESSED
        constraints: "NOT_ASSESSED | THRESHOLD_PENDING | NOTICES_ISSUED | NOTICE_PERIOD_SATISFIED"
      - name: severance_budget_cents
        type: integer
        source: input
        description: "Hard ceiling for severance_reserve_cents; an issue that would exceed it is rejected."
        constraints: ">= 0"
      - name: severance_reserve_cents
        type: integer
        source: computed
        description: "Sum of SeveranceOffer.total_separation_cost_cents over offers of this plan whose status is in {ISSUED, SIGNED, EFFECTIVE}; see calculations.plan_ledger_rollup."
        default: 0
      - name: benefit_liability_cents
        type: integer
        source: computed
        description: "Sum of Employee.benefit_subsidy_cents over employees whose benefit_continuation_status is ACTIVE and who hold a Selection of this plan; see calculations.plan_ledger_rollup."
        default: 0
      - name: selected_count
        type: integer
        source: computed
        description: "Count of Selection rows of this plan whose status is in {SELECTED, SEPARATED}."
        default: 0
      - name: pool_count
        type: integer
        source: computed
        description: "Count of Selection rows of this plan whose status is in {PROPOSED, SELECTED, EXEMPTED, SEPARATED} (RESCINDED excluded)."
        default: 0
      - name: earliest_separation_date
        type: string
        source: computed
        description: "Minimum Selection.proposed_separation_date over this plan's Selections whose status is in {SELECTED, SEPARATED}; null when that set is empty. Date-only, YYYY-MM-DD."
        default: null
      - name: owbpa_required
        type: boolean
        source: computed
        description: "True when at least one Selection of this plan in status {SELECTED, SEPARATED} belongs to an Employee whose age at Selection.proposed_separation_date is >= 40."
        default: false
      - name: owbpa_consideration_days
        type: integer
        source: computed
        description: "45 when selected_count >= 2, else 21. Applied to offers for employees aged >= 40; see calculations.owbpa_consideration_window."
        default: 21
      - name: required_notice_days
        type: integer
        source: computed
        description: "Maximum Site.required_notice_days over the distinct Sites of this plan's Selections in {SELECTED, SEPARATED}; 0 when no site is triggered."
        default: 0
      - name: notice_deadline_utc
        type: datetime
        source: computed
        description: "earliest_separation_date at 00:00:00.000Z minus required_notice_days days; null when required_notice_days == 0 or earliest_separation_date is null."
        default: null
      - name: submitted_by_user_id
        type: string
        source: system
        description: "X-User-ID that performed POST /reduction-plans/{id}/submit-legal-review most recently."
        default: null
      - name: approved_by_user_id
        type: string
        source: system
        description: "X-User-ID that recorded the APPROVE legal decision."
        default: null
      - name: legal_return_count
        type: integer
        source: computed
        description: "Number of times the plan has traversed IN_LEGAL_REVIEW -> DRAFT via a RETURN legal decision."
        default: 0

  - name: Site
    parent: null
    common_fields: true
    fields:
      - name: name
        type: string
        source: input
        description: "Single site of employment label."
      - name: state_code
        type: string
        source: input
        description: "Two-letter jurisdiction code used to select the STATE WarnRule."
        constraints: "exactly 2 uppercase letters"
      - name: is_single_site
        type: boolean
        source: input
        description: "True when the location is a single site of employment for plant-closing analysis."
        default: true
      - name: roster_count
        type: integer
        source: computed
        description: "Count of Employee rows with this site_id, in any employment_status."
        default: 0
      - name: active_headcount
        type: integer
        source: computed
        description: "Count of Employee rows with this site_id and employment_status == ACTIVE."
        default: 0
      - name: pending_separation_count
        type: integer
        source: computed
        description: "Count of Employee rows with this site_id and employment_status == PENDING_SEPARATION."
        default: 0
      - name: separated_count
        type: integer
        source: computed
        description: "Count of Employee rows with this site_id and employment_status == SEPARATED."
        default: 0
      - name: federal_loss_count
        type: integer
        source: computed
        description: "Employment-loss count under the FEDERAL WarnRule; see calculations.warn_employment_loss_count variant FEDERAL. 0 when no FEDERAL WarnRule is configured."
        default: 0
      - name: state_loss_count
        type: integer
        source: computed
        description: "Employment-loss count under the STATE WarnRule matching state_code; see calculations.warn_employment_loss_count variant STATE. 0 when no matching STATE WarnRule is configured."
        default: 0
      - name: warn_trigger_status
        type: enum
        source: computed
        description: "PLANT_CLOSING when a triggered jurisdiction's loss_count equals its workforce_count; otherwise MASS_LAYOFF when either jurisdiction's threshold_met is true; otherwise NONE."
        default: NONE
        constraints: "NONE | MASS_LAYOFF | PLANT_CLOSING"
      - name: required_notice_days
        type: integer
        source: computed
        description: "Maximum WarnRule.notice_days over the jurisdictions whose threshold_met is true for this site; 0 when warn_trigger_status == NONE."
        default: 0
      - name: window_start_date
        type: string
        source: computed
        description: "Minimum Employee.separation_date over this site's employees whose employment_status is in {PENDING_SEPARATION, SEPARATED}; null when that set is empty. Date-only, YYYY-MM-DD."
        default: null

  - name: Employee
    parent: null
    common_fields: true
    fields:
      - name: site_id
        type: string
        source: input
        description: "FK -> Site.id; the single site of employment this person is counted at."
      - name: full_name
        type: string
        source: input
        description: "Employee display name."
      - name: job_title
        type: string
        source: input
        description: "Position title; the backfill restriction key together with site_id."
      - name: birth_date
        type: string
        source: input
        description: "Date of birth, YYYY-MM-DD; drives OWBPA age banding."
      - name: hire_date
        type: string
        source: input
        description: "Date of hire, YYYY-MM-DD; drives years_of_service and the min_service_days WARN filter."
      - name: annual_base_cents
        type: integer
        source: input
        description: "Annual base salary in cents; severance divisor input."
        constraints: "> 0"
      - name: weekly_hours
        type: number
        source: input
        description: "Scheduled hours per week; < 20 marks the person part-time."
        constraints: ">= 0"
      - name: demographic_code
        type: enum
        source: input
        description: "Analysis class used by the adverse-impact calculation."
        constraints: "CLASS_A | CLASS_B | CLASS_C"
      - name: monthly_premium_cents
        type: integer
        source: input
        description: "Employer group-health monthly premium in cents; benefit-continuation subsidy input."
        default: 90000
      - name: employment_status
        type: enum
        source: system
        description: "Lifecycle of the person on the roster."
        default: ACTIVE
        constraints: "ACTIVE | PENDING_SEPARATION | SEPARATED"
      - name: is_part_time
        type: boolean
        source: computed
        description: "weekly_hours < 20."
        default: false
      - name: separation_date
        type: string
        source: system
        description: "Copied from Selection.proposed_separation_date when the Selection enters SELECTED; cleared to null on rescission. Date-only, YYYY-MM-DD."
        default: null
      - name: age_at_separation
        type: integer
        source: computed
        description: "Completed years between birth_date and separation_date; null while separation_date is null."
        default: null
      - name: years_of_service
        type: integer
        source: computed
        description: "floor((separation_date - hire_date) in days / 365); null while separation_date is null."
        default: null
      - name: release_signed
        type: boolean
        source: system
        description: "True while a SeveranceOffer of this person is in status SIGNED or EFFECTIVE."
        default: false
      - name: benefit_continuation_status
        type: enum
        source: system
        description: "NONE until a release is signed, ACTIVE once signed, TERMINATED after revocation."
        default: NONE
        constraints: "NONE | ACTIVE | TERMINATED"
      - name: benefit_subsidy_months
        type: integer
        source: computed
        description: "Subsidy months from the tier keyed on the signed offer's pre-benefit subtotal; see calculations.separation_cost_rollup."
        default: 0
      - name: benefit_subsidy_cents
        type: integer
        source: computed
        description: "Employer-paid group-health subsidy in cents carried by the signed offer."
        default: 0
      - name: outplacement_tier
        type: enum
        source: computed
        description: "PREMIUM when benefit_subsidy_months >= 6, STANDARD when 1..5, NONE when 0."
        default: NONE
        constraints: "NONE | STANDARD | PREMIUM"

  - name: Selection
    parent: null
    common_fields: true
    fields:
      - name: plan_id
        type: string
        source: input
        description: "FK -> ReductionPlan.id"
      - name: employee_id
        type: string
        source: input
        description: "FK -> Employee.id"
      - name: proposed_separation_date
        type: string
        source: input
        description: "Intended last day of employment, YYYY-MM-DD."
      - name: criterion_scores
        type: array
        source: input
        description: "Array of {criterion_code, score}; the set of criterion_code values must equal the plan's locked selection_criteria codes exactly."
        constraints: "each score is an integer 0..100"
      - name: composite_score
        type: number
        source: computed
        description: "Weighted criteria score; see calculations.selection_composite_score. Two decimal places."
        default: 0
      - name: status
        type: enum
        source: system
        description: "Selection lifecycle."
        default: PROPOSED
        constraints: "PROPOSED | SELECTED | EXEMPTED | RESCINDED | SEPARATED"
      - name: exemption_reason
        type: string
        source: system
        description: "Recorded when the fork resolves to EXEMPTED."
        default: null
      - name: rescind_reason
        type: string
        source: system
        description: "Recorded when a SELECTED selection is rescinded."
        default: null
      - name: notice_status
        type: enum
        source: system
        description: "Individual notification state for this selection."
        default: NOT_DELIVERED
        constraints: "NOT_DELIVERED | DELIVERED"
      - name: notice_script_code
        type: string
        source: system
        description: "Manager script used at delivery."
        default: null
      - name: notice_delivered_utc
        type: datetime
        source: system
        description: "Logical-clock instant at which the individual notice was delivered."
        default: null
      - name: notice_days_before_separation
        type: integer
        source: computed
        description: "Whole calendar days from the date part of notice_delivered_utc to proposed_separation_date; null while notice_status is NOT_DELIVERED."
        default: null
      - name: short_notice_acknowledged
        type: boolean
        source: system
        description: "True when delivery was accepted despite notice_days_before_separation < the site's required_notice_days."
        default: false

  - name: WarnRule
    parent: null
    common_fields: false
    fields:
      - name: jurisdiction
        type: enum
        source: input
        description: "FEDERAL for the national statute row, STATE for a mini-WARN row."
        constraints: "FEDERAL | STATE"
      - name: state_code
        type: string
        source: input
        description: "US for the FEDERAL row; the two-letter code for a STATE row."
      - name: rule_code
        type: string
        source: input
        description: "Citation label stamped onto every WarnNotice that applies this rule."
      - name: min_loss_count
        type: integer
        source: input
        description: "Employment losses at or above this count satisfy the count test."
      - name: min_percent
        type: number
        source: input
        description: "Percent-of-workforce test, two decimal places; 0 disables the percent test."
      - name: absolute_count
        type: integer
        source: input
        description: "Loss count that triggers regardless of percent; 0 disables the absolute test."
      - name: notice_days
        type: integer
        source: input
        description: "Advance-notice days demanded by this jurisdiction."
      - name: window_days
        type: integer
        source: input
        description: "Aggregation window length in days measured from Site.window_start_date."
      - name: counts_part_time
        type: boolean
        source: input
        description: "When false, employees with is_part_time == true are excluded from both the loss count and the workforce denominator."
      - name: min_service_days
        type: integer
        source: input
        description: "Employees whose service on their separation_date is below this many days are excluded from the loss count only, never from the denominator."
      - name: required_content_codes
        type: array
        source: input
        description: "Content codes a WarnNotice of this jurisdiction must carry before it may be issued."

  - name: AdverseImpactAnalysis
    parent: null
    common_fields: true
    fields:
      - name: plan_id
        type: string
        source: input
        description: "FK -> ReductionPlan.id"
      - name: method
        type: enum
        source: input
        description: "Statistical approach applied to the identical selection pool."
        constraints: "IMPACT_RATIO | STANDARD_DEVIATION"
      - name: status
        type: enum
        source: system
        description: "COMPUTED when within tolerance, FLAGGED when the method's threshold is breached, CLEARED after documented clearance, SUPERSEDED when a newer analysis is created, STALE when the plan's selection set changed after clearance."
        default: COMPUTED
        constraints: "COMPUTED | FLAGGED | CLEARED | SUPERSEDED | STALE"
      - name: pool_count
        type: integer
        source: computed
        description: "N: count of Selections of the plan in status {PROPOSED, SELECTED, EXEMPTED, SEPARATED}."
        default: 0
      - name: selected_count
        type: integer
        source: computed
        description: "S: count of those Selections in status {SELECTED, SEPARATED}."
        default: 0
      - name: focal_class_code
        type: enum
        source: computed
        description: "Demographic class with the lowest selection rate; ties broken by class code ascending."
        default: null
        constraints: "CLASS_A | CLASS_B | CLASS_C"
      - name: focal_pool_count
        type: integer
        source: computed
        description: "n_f: pooled employees in the focal class."
        default: 0
      - name: focal_selected_count
        type: integer
        source: computed
        description: "s_f: selected employees in the focal class."
        default: 0
      - name: focal_rate
        type: number
        source: computed
        description: "s_f / n_f, four decimal places."
        default: 0
      - name: reference_rate
        type: number
        source: computed
        description: "(S - s_f) / (N - n_f), four decimal places."
        default: 0
      - name: impact_ratio
        type: number
        source: computed
        description: "focal_rate / reference_rate, four decimal places; null for method STANDARD_DEVIATION."
        default: null
      - name: standard_deviations
        type: number
        source: computed
        description: "Hypergeometric shortfall in standard deviations, four decimal places; null for method IMPACT_RATIO."
        default: null
      - name: shortfall_count
        type: integer
        source: computed
        description: "ceil(reference_rate * n_f) - s_f, floored at 0."
        default: 0
      - name: small_sample_suppressed
        type: boolean
        source: computed
        description: "True when focal_pool_count < 3, which suppresses FLAGGED regardless of the statistic."
        default: false
      - name: justification
        type: string
        source: system
        description: "Business-necessity narrative recorded at clearance."
        default: null
      - name: cleared_by_user_id
        type: string
        source: system
        description: "X-User-ID that cleared the analysis."
        default: null

  - name: OwbpaDisclosure
    parent: null
    common_fields: true
    fields:
      - name: plan_id
        type: string
        source: input
        description: "FK -> ReductionPlan.id"
      - name: decisional_unit_name
        type: string
        source: computed
        description: "Copied from ReductionPlan.decisional_unit_name at generation time."
      - name: eligible_count
        type: integer
        source: computed
        description: "Decisional-unit employees whose age at the plan's earliest_separation_date is >= 40."
        default: 0
      - name: selected_count
        type: integer
        source: computed
        description: "Decisional-unit employees holding a Selection of this plan in {SELECTED, SEPARATED}."
        default: 0
      - name: non_selected_count
        type: integer
        source: computed
        description: "Decisional-unit employees not counted in selected_count."
        default: 0
      - name: min_age
        type: integer
        source: computed
        description: "Lowest decisional-unit age at the plan's earliest_separation_date."
        default: null
      - name: max_age
        type: integer
        source: computed
        description: "Highest decisional-unit age at the plan's earliest_separation_date."
        default: null
      - name: age_bands
        type: array
        source: computed
        description: "Array of {age, selected_count, non_selected_count} sorted by age ascending; one entry per distinct decisional-unit age."
      - name: consideration_days
        type: integer
        source: computed
        description: "Snapshot of ReductionPlan.owbpa_consideration_days at generation time."
        default: 21
      - name: snapshot_selected_count
        type: integer
        source: computed
        description: "ReductionPlan.selected_count at generation time; staleness is detected against it."
        default: 0
      - name: snapshot_pool_count
        type: integer
        source: computed
        description: "ReductionPlan.pool_count at generation time; staleness is detected against it."
        default: 0
      - name: status
        type: enum
        source: system
        description: "ATTACHED when current, SUPERSEDED when a newer disclosure was generated for the plan, STALE once the plan's selection set diverged from the snapshot."
        default: ATTACHED
        constraints: "ATTACHED | SUPERSEDED | STALE"
      - name: generated_utc
        type: datetime
        source: system
        description: "Logical-clock instant of generation."

  - name: WarnNotice
    parent: null
    common_fields: true
    fields:
      - name: plan_id
        type: string
        source: input
        description: "FK -> ReductionPlan.id"
      - name: site_id
        type: string
        source: input
        description: "FK -> Site.id"
      - name: jurisdiction
        type: enum
        source: input
        description: "Which WarnRule row the determination applies."
        constraints: "FEDERAL | STATE"
      - name: content_codes
        type: array
        source: input
        description: "Content elements carried by the notice document."
      - name: applied_rule_code
        type: string
        source: computed
        description: "WarnRule.rule_code of the row applied at creation."
      - name: employment_loss_count
        type: integer
        source: computed
        description: "Loss count under the applied rule; see calculations.warn_employment_loss_count."
        default: 0
      - name: workforce_count
        type: integer
        source: computed
        description: "Denominator under the applied rule."
        default: 0
      - name: loss_percent
        type: number
        source: computed
        description: "100 * employment_loss_count / workforce_count, two decimal places, round_half_up."
        default: 0
      - name: threshold_met
        type: boolean
        source: computed
        description: "Result of the applied rule's count / percent / absolute tests."
        default: false
      - name: trigger_type
        type: enum
        source: computed
        description: "PLANT_CLOSING when threshold_met and employment_loss_count == workforce_count; MASS_LAYOFF when threshold_met otherwise; NONE when not met."
        default: NONE
        constraints: "NONE | MASS_LAYOFF | PLANT_CLOSING"
      - name: required_notice_days
        type: integer
        source: computed
        description: "WarnRule.notice_days of the applied row."
        default: 0
      - name: window_start_date
        type: string
        source: computed
        description: "Site.window_start_date at creation time, YYYY-MM-DD."
        default: null
      - name: window_end_date
        type: string
        source: computed
        description: "window_start_date plus WarnRule.window_days days, YYYY-MM-DD. The interval is half-open [start, end) for FEDERAL and closed [start, end] for STATE."
        default: null
      - name: notice_deadline_utc
        type: datetime
        source: computed
        description: "window_start_date at 00:00:00.000Z minus required_notice_days days; null when threshold_met is false."
        default: null
      - name: status
        type: enum
        source: system
        description: "Notice lifecycle."
        default: DRAFT
        constraints: "DRAFT | ISSUED | VOID"
      - name: issued_utc
        type: datetime
        source: system
        description: "Logical-clock instant of issuance."
        default: null

  - name: SeveranceOffer
    parent: null
    common_fields: true
    fields:
      - name: selection_id
        type: string
        source: input
        description: "FK -> Selection.id"
      - name: plan_id
        type: string
        source: computed
        description: "FK -> ReductionPlan.id; copied from the selection at creation."
      - name: owbpa_disclosure_id
        type: string
        source: computed
        description: "FK -> OwbpaDisclosure.id; the ATTACHED disclosure pinned at creation for an age-40-plus release, null otherwise."
        default: null
      - name: variant
        type: enum
        source: input
        description: "Severance schedule applied."
        constraints: "STANDARD | ENHANCED_RELEASE"
      - name: weekly_rate_cents
        type: integer
        source: computed
        description: "round_half_up(Employee.annual_base_cents / 52) — rounded to whole cents BEFORE any multiplication."
        default: 0
      - name: weeks_awarded
        type: number
        source: computed
        description: "Weeks granted under the variant; half-week precision is retained only by ENHANCED_RELEASE."
        default: 0
      - name: base_severance_cents
        type: integer
        source: computed
        description: "round_half_up(weekly_rate_cents * weeks_awarded)."
        default: 0
      - name: notice_shortfall_days
        type: integer
        source: computed
        description: "max(0, Site.required_notice_days - Selection.notice_days_before_separation)."
        default: 0
      - name: notice_pay_offset_cents
        type: integer
        source: computed
        description: "round_half_up(round_half_up(weekly_rate_cents / 7) * notice_shortfall_days)."
        default: 0
      - name: benefit_subsidy_months
        type: integer
        source: computed
        description: "Tier keyed on base_severance_cents + notice_pay_offset_cents."
        default: 0
      - name: benefit_subsidy_cents
        type: integer
        source: computed
        description: "benefit_subsidy_months * round_half_up(Employee.monthly_premium_cents * 0.65)."
        default: 0
      - name: outplacement_fee_cents
        type: integer
        source: computed
        description: "350000 when benefit_subsidy_months >= 6, else 120000."
        default: 0
      - name: total_separation_cost_cents
        type: integer
        source: computed
        description: "base_severance_cents + notice_pay_offset_cents + benefit_subsidy_cents + outplacement_fee_cents."
        default: 0
      - name: consideration_days_applied
        type: integer
        source: computed
        description: "45 / 21 / 14 per calculations.owbpa_consideration_window; frozen at issuance."
        default: 0
      - name: status
        type: enum
        source: system
        description: "Offer lifecycle; ISSUED -> SIGNED -> REVOKED -> ISSUED is a permitted cycle."
        default: DRAFT
        constraints: "DRAFT | ISSUED | SIGNED | REVOKED | EFFECTIVE | EXPIRED"
      - name: issue_count
        type: integer
        source: computed
        description: "Number of times this offer has entered ISSUED; the cycle terminates at 3."
        default: 0
      - name: issued_utc
        type: datetime
        source: system
        description: "Logical-clock instant of the most recent issuance."
        default: null
      - name: signed_utc
        type: datetime
        source: system
        description: "Logical-clock instant of signature."
        default: null
      - name: revoked_utc
        type: datetime
        source: system
        description: "Logical-clock instant of revocation."
        default: null
      - name: consideration_deadline_utc
        type: datetime
        source: computed
        description: "issued_utc plus consideration_days_applied days."
        default: null
      - name: revocation_deadline_utc
        type: datetime
        source: computed
        description: "signed_utc plus 7 days when the employee's age_at_separation >= 40, else signed_utc itself."
        default: null
      - name: blocking_window_end_utc
        type: datetime
        source: computed
        description: "consideration_deadline_utc while ISSUED, revocation_deadline_utc while SIGNED, revoked_utc once REVOKED, consideration_deadline_utc once EXPIRED, null while DRAFT or EFFECTIVE."
        default: null

  - name: PositionRestriction
    parent: null
    common_fields: true
    fields:
      - name: employee_id
        type: string
        source: system
        description: "FK -> Employee.id; the separated incumbent whose seat is frozen."
      - name: site_id
        type: string
        source: system
        description: "FK -> Site.id; copied from the employee at creation."
      - name: job_title
        type: string
        source: system
        description: "Copied from the employee at creation; the backfill key together with site_id."
      - name: restriction_status
        type: enum
        source: system
        description: "RESTRICTED on creation; WAIVED after an explicit counsel waiver; RELEASED once the logical clock passes restricted_until_utc."
        default: RESTRICTED
        constraints: "RESTRICTED | WAIVED | RELEASED"
      - name: restricted_until_utc
        type: datetime
        source: system
        description: "Creation instant plus 90 days."
      - name: waiver_reason
        type: string
        source: system
        description: "Recorded when the restriction is waived."
        default: null
      - name: waived_by_user_id
        type: string
        source: system
        description: "X-User-ID that waived the restriction."
        default: null

# ---------------------------------------------------------------------------
# 1.2 State Machine Table
# ---------------------------------------------------------------------------
state_machines:

  # --- ReductionPlan, axis 1 of 2: governance -------------------------------
  - entity: ReductionPlan
    axis: approval_status
    initial_state: DRAFT
    terminal_states: [EXECUTED]
    transitions:
      - from: DRAFT
        to: IN_LEGAL_REVIEW
        trigger: "POST /reduction-plans/{id}/submit-legal-review"
        actor: RestructuringLead
        preconditions:
          - "criteria_status == LOCKED"
          - "selected_count >= 1"
        side_effects:
          - "sets submitted_by_user_id to the calling X-User-ID"
          - "increments ReductionPlan.version by 1"
        note: "Re-submission after a RETURN is the same transition and overwrites submitted_by_user_id."
      - from: IN_LEGAL_REVIEW
        to: APPROVED
        trigger: "POST /reduction-plans/{id}/legal-decision with decision == APPROVE"
        actor: EmploymentCounsel
        preconditions:
          - "X-User-ID != submitted_by_user_id (segregation of duties)"
          - "the plan's latest AdverseImpactAnalysis by created_at DESC has status == CLEARED"
        side_effects:
          - "sets approved_by_user_id to the calling X-User-ID"
          - "increments ReductionPlan.version by 1"
      - from: IN_LEGAL_REVIEW
        to: DRAFT
        trigger: "POST /reduction-plans/{id}/legal-decision with decision == RETURN"
        actor: EmploymentCounsel
        preconditions:
          - "X-User-ID != submitted_by_user_id (segregation of duties)"
        side_effects:
          - "increments legal_return_count by 1"
          - "clears submitted_by_user_id to null"
          - "increments ReductionPlan.version by 1"
        note: "Return arc; the plan may re-enter IN_LEGAL_REVIEW any number of times."
      - from: APPROVED
        to: EXECUTED
        trigger: "POST /reduction-plans/{id}/execute"
        actor: RestructuringLead
        preconditions:
          - "every Selection of the plan in status SELECTED has notice_status == DELIVERED"
          - "for every distinct Site of those Selections with warn_trigger_status != NONE, a WarnNotice for (plan_id, site_id) exists in status ISSUED"
        side_effects:
          - "CASCADE hop 1: every Selection of the plan in status SELECTED transitions to SEPARATED"
          - "CASCADE hop 2: because a Selection entered SEPARATED, its Employee transitions PENDING_SEPARATION -> SEPARATED"
          - "CASCADE hop 3: because an Employee entered SEPARATED, a PositionRestriction row is created in status RESTRICTED with restricted_until_utc = current logical clock + 90 days, and that Employee's Site recomputes pending_separation_count (-1) and separated_count (+1)"
          - "every SeveranceOffer of the plan in status SIGNED whose revocation_deadline_utc <= current logical clock transitions to EFFECTIVE"
          - "sets warn_status to NOTICE_PERIOD_SATISFIED"
          - "increments ReductionPlan.version by 1"

  # --- ReductionPlan, axis 2 of 2: WARN compliance --------------------------
  - entity: ReductionPlan
    axis: warn_status
    initial_state: NOT_ASSESSED
    terminal_states: [NOTICE_PERIOD_SATISFIED]
    transitions:
      - from: NOT_ASSESSED
        to: THRESHOLD_PENDING
        trigger: "system cascade — a Site of one of this plan's SELECTED Selections recomputes warn_trigger_status from NONE to MASS_LAYOFF or PLANT_CLOSING"
        actor: system
        preconditions:
          - "the plan has >= 1 Selection in status SELECTED at that Site"
        side_effects:
          - "recomputes required_notice_days and notice_deadline_utc"
          - "increments ReductionPlan.version by 1"
        note: "This axis advances independently of approval_status; a plan may be APPROVED while still NOT_ASSESSED, and may be THRESHOLD_PENDING while still DRAFT."
      - from: THRESHOLD_PENDING
        to: NOT_ASSESSED
        trigger: "system cascade — every Site of this plan recomputes warn_trigger_status back to NONE after a rescission"
        actor: system
        preconditions:
          - "no Site of the plan's SELECTED Selections has warn_trigger_status != NONE"
        side_effects:
          - "resets required_notice_days to 0 and notice_deadline_utc to null"
          - "increments ReductionPlan.version by 1"
      - from: THRESHOLD_PENDING
        to: NOTICES_ISSUED
        trigger: "system cascade — POST /warn-notices/{id}/issue"
        actor: system
        preconditions:
          - "every Site of the plan's SELECTED Selections whose warn_trigger_status != NONE now has an ISSUED WarnNotice for (plan_id, site_id)"
        side_effects:
          - "increments ReductionPlan.version by 1"
      - from: NOTICES_ISSUED
        to: NOTICE_PERIOD_SATISFIED
        trigger: "system cascade — POST /reduction-plans/{id}/execute"
        actor: system
        preconditions:
          - "approval_status transitioned to EXECUTED in the same request"
        side_effects:
          - "increments ReductionPlan.version by 1"
      - from: NOT_ASSESSED
        to: NOTICE_PERIOD_SATISFIED
        trigger: "system cascade — POST /reduction-plans/{id}/execute on a plan no site of which is triggered"
        actor: system
        preconditions:
          - "approval_status transitioned to EXECUTED in the same request"
          - "no Site of the plan's Selections has warn_trigger_status != NONE"
        side_effects:
          - "increments ReductionPlan.version by 1"

  # --- Selection: fork with divergent side effects, plus a compensating arc --
  - entity: Selection
    axis: status
    initial_state: PROPOSED
    terminal_states: [EXEMPTED, RESCINDED, SEPARATED]
    transitions:
      - from: PROPOSED
        to: SELECTED
        trigger: "POST /selections/{id}/decide with decision == SELECT, or POST /reduction-plans/{id}/decide-batch with decision == SELECT"
        actor: RestructuringLead
        preconditions:
          - "ReductionPlan.approval_status IN {DRAFT, IN_LEGAL_REVIEW}"
          - "ReductionPlan.criteria_status == LOCKED"
        side_effects:
          - "CASCADE hop 1: Employee.employment_status ACTIVE -> PENDING_SEPARATION and Employee.separation_date := Selection.proposed_separation_date"
          - "CASCADE hop 2: because that Employee entered PENDING_SEPARATION, its Site recomputes active_headcount (-1), pending_separation_count (+1), window_start_date, federal_loss_count, state_loss_count, required_notice_days and warn_trigger_status"
          - "CASCADE hop 3: because that Site's warn_trigger_status left NONE, every ReductionPlan holding a SELECTED Selection at that Site advances warn_status NOT_ASSESSED -> THRESHOLD_PENDING and recomputes required_notice_days and notice_deadline_utc"
          - "CASCADE hop 4: because the plan's warn_status and selection set changed, every OwbpaDisclosure of the plan in status ATTACHED whose snapshot_selected_count or snapshot_pool_count no longer matches the plan transitions to STALE, and every AdverseImpactAnalysis of the plan in status CLEARED transitions to STALE"
          - "recomputes ReductionPlan.selected_count, pool_count, earliest_separation_date, owbpa_required, owbpa_consideration_days"
          - "increments Selection.version by 1"
      - from: PROPOSED
        to: EXEMPTED
        trigger: "POST /selections/{id}/decide with decision == EXEMPT, or POST /reduction-plans/{id}/decide-batch with decision == EXEMPT"
        actor: RestructuringLead
        preconditions:
          - "ReductionPlan.approval_status IN {DRAFT, IN_LEGAL_REVIEW}"
          - "exemption_reason is supplied"
        side_effects:
          - "records exemption_reason"
          - "the Employee is NOT touched: employment_status stays ACTIVE, separation_date stays null, and no Site counter other than none changes"
          - "recomputes ReductionPlan.pool_count only (selected_count is unaffected)"
          - "increments Selection.version by 1"
        note: "Divergent branch of the fork: SELECTED mutates four downstream entities, EXEMPTED mutates none."
      - from: SELECTED
        to: RESCINDED
        trigger: "POST /selections/{id}/rescind"
        actor: RestructuringLead
        preconditions:
          - "ReductionPlan.approval_status != EXECUTED"
          - "no SeveranceOffer of this selection is in status {ISSUED, SIGNED, EFFECTIVE}"
        side_effects:
          - "COMPENSATION hop 1: Employee.employment_status PENDING_SEPARATION -> ACTIVE and Employee.separation_date := null"
          - "COMPENSATION hop 2: because that Employee returned to ACTIVE, its Site recomputes active_headcount (+1), pending_separation_count (-1), window_start_date, federal_loss_count, state_loss_count, required_notice_days and warn_trigger_status"
          - "COMPENSATION hop 3: because that Site may have returned to warn_trigger_status NONE, the plan's warn_status returns THRESHOLD_PENDING -> NOT_ASSESSED when no site of the plan is triggered any more"
          - "every AdverseImpactAnalysis of the plan in status CLEARED transitions to STALE and every ATTACHED OwbpaDisclosure whose snapshot no longer matches transitions to STALE"
          - "records rescind_reason and recomputes ReductionPlan.selected_count, pool_count, earliest_separation_date, owbpa_required, owbpa_consideration_days"
          - "increments Selection.version by 1"
        note: "Compensating action for PROPOSED -> SELECTED; the site headcount identity in calculations.site_headcount_identity must hold before and after the pair."
      - from: SELECTED
        to: SEPARATED
        trigger: "system cascade — POST /reduction-plans/{id}/execute"
        actor: system
        preconditions:
          - "notice_status == DELIVERED"
        side_effects:
          - "Employee.employment_status PENDING_SEPARATION -> SEPARATED"
          - "a PositionRestriction is created for that Employee"
          - "increments Selection.version by 1"

  # --- AdverseImpactAnalysis ------------------------------------------------
  - entity: AdverseImpactAnalysis
    axis: status
    initial_state: COMPUTED
    terminal_states: [SUPERSEDED, STALE]
    transitions:
      - from: COMPUTED
        to: FLAGGED
        trigger: "POST /adverse-impact-analyses — evaluated in the same request that creates the row"
        actor: system
        preconditions:
          - "method == IMPACT_RATIO and impact_ratio < 0.80, or method == STANDARD_DEVIATION and standard_deviations >= 2.0"
          - "small_sample_suppressed == false"
        side_effects:
          - "the row is persisted directly in status FLAGGED"
      - from: COMPUTED
        to: CLEARED
        trigger: "POST /adverse-impact-analyses/{id}/clear"
        actor: EmploymentCounsel
        preconditions:
          - "justification is supplied and non-empty"
        side_effects:
          - "sets cleared_by_user_id"
          - "increments AdverseImpactAnalysis.version by 1"
      - from: FLAGGED
        to: CLEARED
        trigger: "POST /adverse-impact-analyses/{id}/clear"
        actor: EmploymentCounsel
        preconditions:
          - "justification is supplied and non-empty"
        side_effects:
          - "sets cleared_by_user_id"
          - "increments AdverseImpactAnalysis.version by 1"
      - from: CLEARED
        to: STALE
        trigger: "system cascade — any Selection of the plan enters SELECTED, EXEMPTED or RESCINDED after clearance"
        actor: system
        preconditions: []
        side_effects:
          - "increments AdverseImpactAnalysis.version by 1"
      - from: COMPUTED
        to: SUPERSEDED
        trigger: "system cascade — POST /adverse-impact-analyses creates a newer analysis for the same plan"
        actor: system
        preconditions: []
        side_effects:
          - "increments AdverseImpactAnalysis.version by 1"
      - from: FLAGGED
        to: SUPERSEDED
        trigger: "system cascade — POST /adverse-impact-analyses creates a newer analysis for the same plan"
        actor: system
        preconditions: []
        side_effects:
          - "increments AdverseImpactAnalysis.version by 1"
      - from: CLEARED
        to: SUPERSEDED
        trigger: "system cascade — POST /adverse-impact-analyses creates a newer analysis for the same plan"
        actor: system
        preconditions: []
        side_effects:
          - "increments AdverseImpactAnalysis.version by 1"

  # --- OwbpaDisclosure ------------------------------------------------------
  - entity: OwbpaDisclosure
    axis: status
    initial_state: ATTACHED
    terminal_states: [SUPERSEDED, STALE]
    transitions:
      - from: ATTACHED
        to: STALE
        trigger: "system cascade — the plan's selected_count or pool_count diverges from the snapshot after a decide or rescind"
        actor: system
        preconditions: []
        side_effects:
          - "increments OwbpaDisclosure.version by 1"
      - from: ATTACHED
        to: SUPERSEDED
        trigger: "system cascade — POST /owbpa-disclosures generates a newer disclosure for the same plan"
        actor: system
        preconditions: []
        side_effects:
          - "increments OwbpaDisclosure.version by 1"
      - from: STALE
        to: SUPERSEDED
        trigger: "system cascade — POST /owbpa-disclosures generates a newer disclosure for the same plan"
        actor: system
        preconditions: []
        side_effects:
          - "increments OwbpaDisclosure.version by 1"

  # --- WarnNotice -----------------------------------------------------------
  - entity: WarnNotice
    axis: status
    initial_state: DRAFT
    terminal_states: [VOID]
    transitions:
      - from: DRAFT
        to: ISSUED
        trigger: "POST /warn-notices/{id}/issue"
        actor: EmploymentCounsel
        preconditions:
          - "threshold_met == true"
          - "content_codes is a superset of the applied WarnRule.required_content_codes"
        side_effects:
          - "stamps issued_utc from the logical clock"
          - "advances ReductionPlan.warn_status THRESHOLD_PENDING -> NOTICES_ISSUED when every triggered site of the plan now has an ISSUED notice"
          - "freezes the site's aggregation window: a later Selection whose proposed_separation_date falls inside [window_start_date, window_end_date) for FEDERAL or [window_start_date, window_end_date] for STATE is rejected"
          - "increments WarnNotice.version by 1"
      - from: ISSUED
        to: VOID
        trigger: "system cascade — the notice's Site recomputes warn_trigger_status to NONE after a rescission"
        actor: system
        preconditions: []
        side_effects:
          - "releases the frozen aggregation window"
          - "increments WarnNotice.version by 1"

  # --- SeveranceOffer: cyclic ISSUED -> SIGNED -> REVOKED -> ISSUED ---------
  - entity: SeveranceOffer
    axis: status
    initial_state: DRAFT
    terminal_states: [EFFECTIVE, EXPIRED]
    transitions:
      - from: DRAFT
        to: ISSUED
        trigger: "POST /severance-offers/{id}/issue"
        actor: BenefitsAdministrator
        preconditions:
          - "Selection.status == SELECTED"
          - "ReductionPlan.severance_reserve_cents + total_separation_cost_cents <= ReductionPlan.severance_budget_cents"
          - "issue_count < 3"
        side_effects:
          - "stamps issued_utc, sets consideration_days_applied and consideration_deadline_utc"
          - "increments issue_count by 1"
          - "LEDGER SYNC: ReductionPlan.severance_reserve_cents += total_separation_cost_cents"
          - "increments SeveranceOffer.version by 1"
      - from: REVOKED
        to: ISSUED
        trigger: "POST /severance-offers/{id}/issue"
        actor: BenefitsAdministrator
        preconditions:
          - "Selection.status == SELECTED"
          - "current logical clock > blocking_window_end_utc + 1 day"
          - "ReductionPlan.severance_reserve_cents + total_separation_cost_cents <= ReductionPlan.severance_budget_cents"
          - "issue_count < 3"
        side_effects:
          - "re-stamps issued_utc and recomputes consideration_deadline_utc from the new issuance"
          - "increments issue_count by 1"
          - "LEDGER SYNC: ReductionPlan.severance_reserve_cents += total_separation_cost_cents"
          - "increments SeveranceOffer.version by 1"
        note: "Closes the cycle ISSUED -> SIGNED -> REVOKED -> ISSUED; issue_count caps the loop at 3 issuances."
      - from: ISSUED
        to: SIGNED
        trigger: "POST /severance-offers/{id}/sign"
        actor: SeparatingEmployee
        preconditions:
          - "X-User-ID == Selection.employee_id of this offer"
          - "current logical clock <= consideration_deadline_utc"
        side_effects:
          - "stamps signed_utc and computes revocation_deadline_utc"
          - "CASCADE hop 1: Employee.release_signed := true, Employee.benefit_continuation_status NONE -> ACTIVE, Employee.benefit_subsidy_months / benefit_subsidy_cents / outplacement_tier copied from this offer"
          - "CASCADE hop 2: because that Employee's benefit_continuation_status became ACTIVE, ReductionPlan.benefit_liability_cents += Employee.benefit_subsidy_cents"
          - "increments SeveranceOffer.version by 1"
      - from: ISSUED
        to: EXPIRED
        trigger: "system — POST /severance-offers/{id}/sign attempted after consideration_deadline_utc"
        actor: system
        preconditions:
          - "current logical clock > consideration_deadline_utc"
        side_effects:
          - "the sign request fails with ERR_CONSIDERATION_PERIOD_EXPIRED and the offer is left in EXPIRED"
          - "LEDGER SYNC: ReductionPlan.severance_reserve_cents -= total_separation_cost_cents"
          - "increments SeveranceOffer.version by 1"
      - from: SIGNED
        to: REVOKED
        trigger: "POST /severance-offers/{id}/revoke"
        actor: SeparatingEmployee
        preconditions:
          - "X-User-ID == Selection.employee_id of this offer"
          - "current logical clock <= revocation_deadline_utc"
        side_effects:
          - "stamps revoked_utc"
          - "COMPENSATION hop 1: Employee.release_signed := false and Employee.benefit_continuation_status ACTIVE -> TERMINATED, benefit_subsidy_months / benefit_subsidy_cents reset to 0 and outplacement_tier to NONE"
          - "COMPENSATION hop 2: because that Employee's benefit_continuation_status left ACTIVE, ReductionPlan.benefit_liability_cents -= the subsidy that hop 2 of the sign cascade added"
          - "LEDGER SYNC: ReductionPlan.severance_reserve_cents -= total_separation_cost_cents"
          - "increments SeveranceOffer.version by 1"
        note: "Compensating action for DRAFT -> ISSUED -> SIGNED; calculations.plan_ledger_rollup must reconcile to the pre-issue value."
      - from: SIGNED
        to: EFFECTIVE
        trigger: "system cascade — POST /reduction-plans/{id}/execute"
        actor: system
        preconditions:
          - "current logical clock > revocation_deadline_utc"
        side_effects:
          - "the offer is frozen; no further transition is possible"
          - "increments SeveranceOffer.version by 1"

  # --- PositionRestriction --------------------------------------------------
  - entity: PositionRestriction
    axis: restriction_status
    initial_state: RESTRICTED
    terminal_states: [WAIVED, RELEASED]
    transitions:
      - from: RESTRICTED
        to: WAIVED
        trigger: "POST /position-restrictions/{id}/waive"
        actor: EmploymentCounsel
        preconditions:
          - "waiver_reason is supplied and non-empty"
        side_effects:
          - "records waiver_reason and waived_by_user_id"
          - "unblocks POST /employees for the (site_id, job_title) pair"
          - "increments PositionRestriction.version by 1"
      - from: RESTRICTED
        to: RELEASED
        trigger: "system — evaluated on every POST /employees and on every read of the restriction: the logical clock has passed restricted_until_utc"
        actor: system
        preconditions:
          - "current logical clock > restricted_until_utc"
        side_effects:
          - "unblocks POST /employees for the (site_id, job_title) pair"
          - "increments PositionRestriction.version by 1"

# ---------------------------------------------------------------------------
# 1.2.1 Concurrency Rules (OCC on the parent's version — the only sanctioned
#       write-write resolution in this scaffold)
# ---------------------------------------------------------------------------
concurrency_rules:
  - rule_id: analysis-create-stale-plan
    parent_entity: ReductionPlan
    write_endpoint: "POST /adverse-impact-analyses"
    occ_field: "expected_plan_version"
    description: |
      Creating an AdverseImpactAnalysis against a ReductionPlan whose version has
      advanced since the client last observed it is rejected. A new analysis
      legitimately supersedes the plan's prior analysis, so the product semantics
      would otherwise let a writer working from a stale view of the plan replace an
      analysis that was computed over a different selection set.
    error_id: ERR_STALE_PLAN_VERSION
    http_status: 412

  - rule_id: offer-create-stale-selection
    parent_entity: Selection
    write_endpoint: "POST /severance-offers"
    occ_field: "expected_selection_version"
    description: |
      Creating a SeveranceOffer against a Selection whose version has advanced since
      the client last observed it is rejected. A fresh offer legitimately supersedes
      a prior REVOKED or EXPIRED offer for the same selection, so a writer holding a
      stale view of the selection would otherwise price a release against criterion
      scores, a separation date or a notice record that has since moved.
    error_id: ERR_STALE_SELECTION_VERSION
    http_status: 412

# ---------------------------------------------------------------------------
# 1.3 Calculation Rules Table
# ---------------------------------------------------------------------------
calculations:

  - name: warn_employment_loss_count
    trigger: "Recomputed on the Site whenever an Employee of that site enters or leaves PENDING_SEPARATION or SEPARATED (Selection PROPOSED->SELECTED cascade hop 2, SELECTED->RESCINDED compensation hop 2, SELECTED->SEPARATED cascade), and evaluated again at POST /warn-notices for the requested jurisdiction."
    algorithm: aggregation
    formula: |
      # ---- window anchor (identical for both variants) ----
      window_start = min(Employee.separation_date) over employees of the site whose
                     employment_status IN {PENDING_SEPARATION, SEPARATED}
      if window_start is null: loss_count = 0; workforce_count = 0; threshold_met = false; return

      rule = the WarnRule row for the requested jurisdiction:
               FEDERAL -> the row with jurisdiction == FEDERAL (state_code "US")
               STATE   -> the row with jurisdiction == STATE and state_code == Site.state_code
      if no such row exists:
               at POST /warn-notices      -> ERR_WARN_RULE_NOT_FOUND
               during a cascade recompute -> that jurisdiction contributes loss_count 0 and threshold_met false

      window_end = window_start + rule.window_days days

      # ---- INTERVAL SEMANTICS DIFFER BY JURISDICTION (pinned, do not unify) ----
      in_window(d) = (window_start <= d <  window_end)   when rule.jurisdiction == FEDERAL   # half-open
      in_window(d) = (window_start <= d <= window_end)   when rule.jurisdiction == STATE     # closed

      # ---- numerator ----
      loss_set = employees of the site where
                   employment_status IN {PENDING_SEPARATION, SEPARATED}
                   AND in_window(separation_date)
                   AND (rule.counts_part_time == true OR is_part_time == false)
                   AND (separation_date - hire_date) in days >= rule.min_service_days
      loss_count = count(loss_set)

      # ---- denominator (min_service_days is NOT applied here) ----
      workforce_set = employees of the site where
                   employment_status IN {ACTIVE, PENDING_SEPARATION, SEPARATED}
                   AND hire_date <= window_start
                   AND (rule.counts_part_time == true OR is_part_time == false)
      workforce_count = count(workforce_set)

      if workforce_count == 0:
               at POST /warn-notices      -> ERR_WARN_WORKFORCE_EMPTY
               during a cascade recompute -> loss_percent = 0 and the percent test evaluates false
      else:
               loss_percent = round_half_up(100 * loss_count / workforce_count, 2)

      # ---- thresholds ----
      count_test    = loss_count >= rule.min_loss_count
      percent_test  = (rule.min_percent == 0) OR (loss_percent >= rule.min_percent)
      absolute_test = (rule.absolute_count > 0) AND (loss_count >= rule.absolute_count)
      threshold_met = (count_test AND percent_test) OR absolute_test

      trigger_type  = PLANT_CLOSING if (threshold_met AND loss_count == workforce_count)
                      else MASS_LAYOFF if threshold_met
                      else NONE
    input_set: "Employees of one Site only. The numerator admits only PENDING_SEPARATION and SEPARATED rows inside the jurisdiction's window; the denominator admits ACTIVE, PENDING_SEPARATION and SEPARATED rows hired on or before window_start. RESCINDED selections leave no trace because the Employee has returned to ACTIVE with separation_date null."
    constants:
      MIN_PART_TIME_HOURS: 20
    precision: "loss_percent to 2 decimal places, round_half_up; comparisons against min_percent use >= on the rounded value."
    variants:
      - name: FEDERAL
        when: "jurisdiction == FEDERAL, at POST /warn-notices with jurisdiction FEDERAL and for Site.federal_loss_count"
        difference: "Half-open window [window_start, window_start + window_days). Typically configured with counts_part_time false and min_service_days 180, so part-time and short-service employees drop out of the numerator while part-time employees also drop out of the denominator."
      - name: STATE
        when: "jurisdiction == STATE, at POST /warn-notices with jurisdiction STATE and for Site.state_loss_count"
        difference: "Closed window [window_start, window_start + window_days]. Typically configured with counts_part_time true and min_service_days 0, so the same roster yields a strictly larger numerator and denominator than FEDERAL for identical data."

  - name: selection_composite_score
    trigger: "POST /selections and POST /reduction-plans/{id}/selection-batch, at row creation."
    algorithm: weighted_scoring
    formula: |
      composite_score = round_half_up(
          sum over the plan's locked selection_criteria of
              (criterion_scores[criterion_code].score * criterion.weight_pct / 100),
          2)
    input_set: "Exactly the criterion codes present in ReductionPlan.selection_criteria while criteria_status == LOCKED; a score set that is not an exact match of that code set is rejected with ERR_CRITERION_SCORE_MISMATCH."
    constants:
      WEIGHT_TOTAL: 100
    precision: "2 decimal places, round_half_up."

  - name: adverse_impact_statistic
    trigger: "POST /adverse-impact-analyses, at row creation; the row is persisted directly in COMPUTED or FLAGGED per the AdverseImpactAnalysis COMPUTED->FLAGGED transition."
    algorithm: weighted_scoring
    formula: |
      pool     = Selections of the plan with status IN {PROPOSED, SELECTED, EXEMPTED, SEPARATED}
      N        = count(pool)
      S        = count(pool where status IN {SELECTED, SEPARATED})
      if N == 0 or S == 0 -> ERR_IMPACT_ANALYSIS_INSUFFICIENT_DATA

      for each demographic_code c present in the pool:
          n_c    = count of pool rows whose Employee.demographic_code == c
          s_c    = count of those rows whose status IN {SELECTED, SEPARATED}
          rate_c = s_c / n_c                         # unrounded rational used only for ordering

      focal_class_code = the c with the smallest rate_c;
                         ties broken by demographic_code ascending (CLASS_A < CLASS_B < CLASS_C)
      n_f = n_focal ; s_f = s_focal
      if N - n_f == 0 -> ERR_IMPACT_ANALYSIS_INSUFFICIENT_DATA        # empty reference group

      focal_rate     = round_half_up(s_f / n_f, 4)
      reference_rate = round_half_up((S - s_f) / (N - n_f), 4)
      if reference_rate == 0 -> ERR_IMPACT_ANALYSIS_INSUFFICIENT_DATA

      shortfall_count        = max(0, ceil(reference_rate * n_f) - s_f)
      small_sample_suppressed = (n_f < MIN_FOCAL_CLASS_SIZE)

      # ---- variant-specific statistic ----
      IMPACT_RATIO:
          impact_ratio        = round_half_up(focal_rate / reference_rate, 4)
          standard_deviations = null
          flagged             = (impact_ratio < FOUR_FIFTHS_THRESHOLD) AND NOT small_sample_suppressed
      STANDARD_DEVIATION:
          expected            = n_f * S / N
          variance            = (S * (N - S) * n_f * (N - n_f)) / (N * N * (N - 1))
          sd                  = sqrt(variance)
          standard_deviations = 0 if sd == 0 else round_half_up((expected - s_f) / sd, 4)
          impact_ratio        = null
          flagged             = (standard_deviations >= SD_THRESHOLD) AND NOT small_sample_suppressed

      status = FLAGGED if flagged else COMPUTED
    input_set: "Selections of one plan only, RESCINDED excluded. Employees without a Selection never enter the pool even when they sit in the same decisional unit."
    constants:
      FOUR_FIFTHS_THRESHOLD: 0.80
      SD_THRESHOLD: 2.0
      MIN_FOCAL_CLASS_SIZE: 3
    precision: "focal_rate, reference_rate, impact_ratio and standard_deviations to 4 decimal places, round_half_up. The four-fifths comparison is strict (<), so an impact_ratio of exactly 0.8000 is NOT flagged; the standard-deviation comparison is inclusive (>=), so exactly 2.0000 IS flagged."
    variants:
      - name: IMPACT_RATIO
        when: "method == IMPACT_RATIO"
        difference: "Flags on the four-fifths rule. On a pool of N=8 / S=4 with focal n_f=3, s_f=1 it yields 0.5556 and FLAGGED."
      - name: STANDARD_DEVIATION
        when: "method == STANDARD_DEVIATION"
        difference: "Flags on the hypergeometric shortfall. On the identical pool it yields 0.6831 and COMPUTED — the same data, the same focal class, opposite conclusions."

  - name: severance_award_cents
    trigger: "POST /severance-offers, at row creation; frozen on the row thereafter."
    algorithm: tiered_pricing
    formula: |
      # ---- ROUNDING ORDER IS PINNED: rate to whole cents FIRST, product SECOND ----
      # Step 1
      weekly_rate_cents = round_half_up(Employee.annual_base_cents / 52)
      # Step 2 — tier on completed years of service
      y = Employee.years_of_service          # floor((separation_date - hire_date).days / 365)
      if y <  2:  base_weeks = 2
      elif y <  5: base_weeks = 4    + 1   * (y - 2)
      elif y < 10: base_weeks = 7    + 1.5 * (y - 5)
      else:        base_weeks = 14.5 + 2   * (y - 10)
      base_weeks = min(base_weeks, WEEKS_CAP)
      # Step 3 — variant
      STANDARD:         weeks_awarded = floor(base_weeks)                 # half weeks dropped
      ENHANCED_RELEASE: weeks_awarded = base_weeks + RELEASE_BONUS_WEEKS  # half weeks retained
      # Step 4
      base_severance_cents = round_half_up(weekly_rate_cents * weeks_awarded)
      #
      # Computing round_half_up(annual_base_cents / 52 * weeks_awarded) in one
      # expression is WRONG: for annual_base_cents 8700000 and weeks_awarded 18.5 it
      # yields 3095192 instead of the correct 3095198.
    input_set: "One Employee, resolved through Selection.employee_id; years_of_service is measured to the Selection's proposed_separation_date, which the SELECT cascade copied onto Employee.separation_date."
    constants:
      WEEKS_CAP: 52
      RELEASE_BONUS_WEEKS: 2
      WEEKS_PER_YEAR_DIVISOR: 52
    precision: "weekly_rate_cents is a whole number of cents rounded half-up; base_severance_cents is the product rounded half-up once. No intermediate float is carried into step 4."
    variants:
      - name: STANDARD
        when: "variant == STANDARD"
        difference: "weeks_awarded = floor(base_weeks); no release bonus. For an 11-year employee at 8700000 cents: 16 weeks, 2676928 cents."
      - name: ENHANCED_RELEASE
        when: "variant == ENHANCED_RELEASE"
        difference: "weeks_awarded = base_weeks + 2 with half-week precision retained. For the same employee: 18.5 weeks, 3095198 cents — a different number from identical inputs."

  - name: separation_cost_rollup
    trigger: "POST /severance-offers, immediately after severance_award_cents, in the pinned order below."
    algorithm: constraint_propagation
    formula: |
      # The total appears to depend on itself: the benefit subsidy is keyed on a
      # tier of the severance subtotal, and the subtotal is one of the total's own
      # components. EVALUATION ORDER IS PINNED, so the value is well-defined.
      # (1)
      weekly_rate_cents  = severance_award_cents.step_1
      # (2)
      base_severance_cents = severance_award_cents.step_4
      # (3) — notice shortfall, using the site's requirement, not the federal floor
      required = Site.required_notice_days          # 0 when the site is not triggered
      actual   = Selection.notice_days_before_separation   # null while NOT_DELIVERED -> treat as 0
      notice_shortfall_days   = max(0, required - actual)
      daily_rate_cents        = round_half_up(weekly_rate_cents / 7)     # round BEFORE multiplying
      notice_pay_offset_cents = round_half_up(daily_rate_cents * notice_shortfall_days)
      # (4) — the tier key, NOT the final total
      pre_benefit_subtotal    = base_severance_cents + notice_pay_offset_cents
      # (5)
      if   pre_benefit_subtotal <  SUBSIDY_TIER_1_CEILING: benefit_subsidy_months = 3
      elif pre_benefit_subtotal <  SUBSIDY_TIER_2_CEILING: benefit_subsidy_months = 6
      else:                                                benefit_subsidy_months = 9
      # (6)
      monthly_subsidy_cents  = round_half_up(Employee.monthly_premium_cents * SUBSIDY_RATE)
      benefit_subsidy_cents  = benefit_subsidy_months * monthly_subsidy_cents
      # (7)
      outplacement_tier      = PREMIUM if benefit_subsidy_months >= 6 else STANDARD
      outplacement_fee_cents = OUTPLACEMENT_PREMIUM_FEE_CENTS if outplacement_tier == PREMIUM
                               else OUTPLACEMENT_STANDARD_FEE_CENTS
      # (8)
      total_separation_cost_cents = base_severance_cents + notice_pay_offset_cents
                                  + benefit_subsidy_cents + outplacement_fee_cents
    input_set: "One SeveranceOffer, its Selection, that Selection's Employee, and the Employee's Site. Site.required_notice_days is read at offer creation and frozen onto the offer."
    constants:
      SUBSIDY_TIER_1_CEILING: 1000000
      SUBSIDY_TIER_2_CEILING: 2500000
      SUBSIDY_RATE: 0.65
      OUTPLACEMENT_STANDARD_FEE_CENTS: 120000
      OUTPLACEMENT_PREMIUM_FEE_CENTS: 350000
      NOTICE_DAILY_DIVISOR: 7
    precision: "Every monetary step is a whole number of cents; each round_half_up is applied exactly where the numbered step says and nowhere else."

  - name: owbpa_consideration_window
    trigger: "POST /severance-offers/{id}/issue, when consideration_days_applied and consideration_deadline_utc are stamped."
    algorithm: threshold
    formula: |
      age = Employee.age_at_separation                 # completed years at separation_date
      if age >= OWBPA_PROTECTED_AGE:
          consideration_days_applied = GROUP_CONSIDERATION_DAYS if ReductionPlan.selected_count >= 2
                                       else INDIVIDUAL_CONSIDERATION_DAYS
      else:
          consideration_days_applied = UNPROTECTED_CONSIDERATION_DAYS
      consideration_deadline_utc = issued_utc + consideration_days_applied days
      revocation_window_days     = REVOCATION_DAYS if age >= OWBPA_PROTECTED_AGE else 0
      revocation_deadline_utc    = signed_utc + revocation_window_days days
    input_set: "One Employee's age at separation and the owning plan's selected_count at issuance time."
    constants:
      OWBPA_PROTECTED_AGE: 40
      GROUP_CONSIDERATION_DAYS: 45
      INDIVIDUAL_CONSIDERATION_DAYS: 21
      UNPROTECTED_CONSIDERATION_DAYS: 14
      REVOCATION_DAYS: 7
    precision: "Whole days added to the logical clock instant; the age comparison is inclusive (>=), so an employee who is exactly 40 on the separation date is protected."

  - name: owbpa_disclosure_bands
    trigger: "POST /owbpa-disclosures, at row creation."
    algorithm: aggregation
    formula: |
      decisional_unit = every Employee whose site_id is in the set of site_ids of this
                        plan's Selections with status IN {PROPOSED, SELECTED, EXEMPTED, SEPARATED}
                        AND whose employment_status IN {ACTIVE, PENDING_SEPARATION, SEPARATED}
      anchor          = ReductionPlan.earliest_separation_date
      if anchor is null -> ERR_INVALID_PLAN_STATE
      age(e)          = completed years between e.birth_date and anchor
      eligible_count      = count(decisional_unit where age(e) >= 40)
      selected_count      = count(decisional_unit holding a Selection of this plan in {SELECTED, SEPARATED})
      non_selected_count  = count(decisional_unit) - selected_count
      min_age             = min(age(e)) ; max_age = max(age(e))
      age_bands           = one {age, selected_count, non_selected_count} entry per distinct
                            age(e), sorted by age ascending
      consideration_days      = ReductionPlan.owbpa_consideration_days
      snapshot_selected_count = ReductionPlan.selected_count
      snapshot_pool_count     = ReductionPlan.pool_count
    input_set: "All employees of every site touched by the plan's non-RESCINDED selections, selected and non-selected alike — the disclosure is about the decisional unit, not about the selected group."
    constants:
      OWBPA_PROTECTED_AGE: 40
    precision: "Ages are whole completed years; the band list is sorted by age ascending with no gaps invented for ages nobody holds."

  - name: plan_ledger_rollup
    trigger: "SeveranceOffer DRAFT->ISSUED, REVOKED->ISSUED, ISSUED->EXPIRED, SIGNED->REVOKED (severance_reserve_cents) and SeveranceOffer ISSUED->SIGNED, SIGNED->REVOKED (benefit_liability_cents)."
    algorithm: aggregation
    formula: |
      ReductionPlan.severance_reserve_cents =
          sum of SeveranceOffer.total_separation_cost_cents over offers of this plan
          whose status IN {ISSUED, SIGNED, EFFECTIVE}
      ReductionPlan.benefit_liability_cents =
          sum of Employee.benefit_subsidy_cents over employees holding a Selection of
          this plan whose benefit_continuation_status == ACTIVE
      # INVARIANT (money): for any offer O, the sequence issue(O) -> sign(O) -> revoke(O)
      # must leave severance_reserve_cents at exactly its pre-issue value and
      # benefit_liability_cents at exactly its pre-sign value. No drift of any size.
    input_set: "Offers of one plan; DRAFT, REVOKED and EXPIRED offers contribute nothing to the reserve. Employees whose benefit_continuation_status is NONE or TERMINATED contribute nothing to the liability."
    constants: {}
    precision: "Whole cents; the sum is recomputed from the contributing rows on every contributing transition rather than incremented blindly."

  - name: site_headcount_identity
    trigger: "Recomputed on every Site counter change: Selection PROPOSED->SELECTED cascade hop 2, SELECTED->RESCINDED compensation hop 2, SELECTED->SEPARATED cascade, and POST /employees."
    algorithm: aggregation
    formula: |
      Site.roster_count = Site.active_headcount + Site.pending_separation_count + Site.separated_count
      # INVARIANT (headcount): the identity holds after every single mutation, and the
      # pair decide(SELECT) -> rescind must return active_headcount and
      # pending_separation_count to their exact pre-decide values while roster_count
      # never moves.
    input_set: "Employees of one Site, partitioned by employment_status with no row counted twice and none omitted."
    constants: {}
    precision: "Exact integer counts."

# ---------------------------------------------------------------------------
# 1.4 Validation Rules Table (evaluated strictly in ascending priority order;
#     the first failing row decides the response)
# ---------------------------------------------------------------------------
validations:
  - priority: 1
    category: auth
    check: "X-User-Role and X-User-ID headers are present and non-empty."
    error_id: ERR_UNAUTHENTICATED
    http_status: 401
    applies_to: "all"

  - priority: 2
    category: auth
    check: "X-User-Role is one of the five roles in the RBAC matrix and that role appears in the endpoint's roles list."
    error_id: ERR_UNAUTHORIZED
    http_status: 403
    applies_to: "all"

  - priority: 3
    category: business_constraint
    check: "Request body and query schema: every required input field present, enum members valid, integers/booleans well-typed, limit in [1,100], offset >= 0, selection_criteria weight_pct integers, criterion_scores scores in 0..100, dates in YYYY-MM-DD, state_code exactly two uppercase letters."
    error_id: ERR_INVALID_REQUEST
    http_status: 400
    applies_to: "all"

  - priority: 4
    category: existence
    check: "Path resources are resolved left to right and must exist."
    error_id: "ERR_PLAN_NOT_FOUND | ERR_SITE_NOT_FOUND | ERR_EMPLOYEE_NOT_FOUND | ERR_SELECTION_NOT_FOUND | ERR_ANALYSIS_NOT_FOUND | ERR_DISCLOSURE_NOT_FOUND | ERR_NOTICE_NOT_FOUND | ERR_OFFER_NOT_FOUND | ERR_RESTRICTION_NOT_FOUND | ERR_WARN_RULE_NOT_FOUND"
    http_status: 404
    applies_to: "all path-parameterised endpoints"

  - priority: 5
    category: existence
    check: "Foreign keys carried in the request body exist: plan_id, site_id, employee_id, employee_ids[], selection_id, selection_ids[]."
    error_id: "ERR_PLAN_NOT_FOUND | ERR_SITE_NOT_FOUND | ERR_EMPLOYEE_NOT_FOUND | ERR_SELECTION_NOT_FOUND"
    http_status: 404
    applies_to: "POST /selections, POST /reduction-plans/{id}/selection-batch, POST /reduction-plans/{id}/decide-batch, POST /employees, POST /adverse-impact-analyses, POST /owbpa-disclosures, POST /warn-notices, POST /severance-offers"

  - priority: 6
    category: existence
    check: "The WarnRule row for the requested jurisdiction exists — FEDERAL uses the row with jurisdiction FEDERAL, STATE uses the row with jurisdiction STATE and state_code == Site.state_code."
    error_id: ERR_WARN_RULE_NOT_FOUND
    http_status: 404
    applies_to: "POST /warn-notices"

  - priority: 7
    category: auth
    check: "Ownership for entity-backed roles: the acting SeparatingEmployee's X-User-ID equals Selection.employee_id of the offer being signed or revoked."
    error_id: ERR_NOT_OFFER_RECIPIENT
    http_status: 403
    applies_to: "POST /severance-offers/{id}/sign, POST /severance-offers/{id}/revoke"

  - priority: 8
    category: auth
    check: "Segregation of duties: the X-User-ID rendering the legal decision differs from ReductionPlan.submitted_by_user_id."
    error_id: ERR_SEGREGATION_OF_DUTIES
    http_status: 403
    applies_to: "POST /reduction-plans/{id}/legal-decision"

  - priority: 9
    category: state
    check: "The target resource is in a state from which the requested transition is declared in the state machine table."
    error_id: "ERR_INVALID_PLAN_STATE | ERR_INVALID_SELECTION_STATE | ERR_INVALID_ANALYSIS_STATE | ERR_INVALID_NOTICE_STATE | ERR_INVALID_OFFER_STATE | ERR_INVALID_RESTRICTION_STATE"
    http_status: 409
    applies_to: "every state-changing endpoint"

  - priority: 10
    category: state
    check: "Cross-entity state guard: the Selection referenced by a severance-offer operation is in status SELECTED, and the ReductionPlan of a decide/rescind is not EXECUTED."
    error_id: ERR_INVALID_SELECTION_STATE
    http_status: 409
    applies_to: "POST /severance-offers, POST /severance-offers/{id}/issue, POST /selections/{id}/decide, POST /selections/{id}/rescind"

  - priority: 11
    category: state
    check: "Optimistic concurrency: expected_plan_version equals ReductionPlan.version, expected_selection_version equals Selection.version."
    error_id: "ERR_STALE_PLAN_VERSION | ERR_STALE_SELECTION_VERSION"
    http_status: 412
    applies_to: "POST /adverse-impact-analyses, POST /severance-offers"

  - priority: 12
    category: business_safety
    check: "ReductionPlan.criteria_status == LOCKED before any Selection may be created."
    error_id: ERR_CRITERIA_NOT_LOCKED
    http_status: 422
    applies_to: "POST /selections, POST /reduction-plans/{id}/selection-batch"

  - priority: 13
    category: business_safety
    check: "The plan's latest AdverseImpactAnalysis ordered by created_at DESC (tie-break version DESC) exists and has status CLEARED."
    error_id: ERR_IMPACT_ANALYSIS_NOT_CLEARED
    http_status: 422
    applies_to: "POST /reduction-plans/{id}/legal-decision with decision APPROVE, POST /selections/{id}/deliver-notice, POST /severance-offers"

  - priority: 14
    category: business_safety
    check: "For an employee whose age_at_separation >= 40, an OwbpaDisclosure of the plan exists in status ATTACHED or STALE — that is, the plan has a disclosure that has not been SUPERSEDED and is not simply absent."
    error_id: ERR_OWBPA_DISCLOSURE_MISSING
    http_status: 422
    applies_to: "POST /severance-offers"

  - priority: 15
    category: business_safety
    check: "That disclosure is in status ATTACHED — its snapshot_selected_count and snapshot_pool_count still match the plan's current selected_count and pool_count; a STALE disclosure fails here rather than at priority 14."
    error_id: ERR_OWBPA_DISCLOSURE_STALE
    http_status: 422
    applies_to: "POST /severance-offers"

  - priority: 16
    category: business_safety
    check: "Selection.notice_status == DELIVERED before a severance offer may be priced for it."
    error_id: ERR_NOTICE_NOT_DELIVERED
    http_status: 422
    applies_to: "POST /severance-offers"

  - priority: 17
    category: business_safety
    check: "Every Site carrying a SELECTED Selection of the plan whose warn_trigger_status != NONE has a WarnNotice for (plan_id, site_id) in status ISSUED."
    error_id: ERR_WARN_NOTICE_REQUIRED
    http_status: 422
    applies_to: "POST /reduction-plans/{id}/execute"

  - priority: 18
    category: business_temporal
    check: "Selection.notice_days_before_separation >= Site.required_notice_days, unless acknowledge_short_notice is true."
    error_id: ERR_NOTICE_PERIOD_INSUFFICIENT
    http_status: 422
    applies_to: "POST /selections/{id}/deliver-notice"

  - priority: 19
    category: business_temporal
    check: "The logical clock is at or before consideration_deadline_utc when signing."
    error_id: ERR_CONSIDERATION_PERIOD_EXPIRED
    http_status: 422
    applies_to: "POST /severance-offers/{id}/sign"

  - priority: 20
    category: business_temporal
    check: "The logical clock is at or before revocation_deadline_utc when revoking."
    error_id: ERR_REVOCATION_WINDOW_CLOSED
    http_status: 422
    applies_to: "POST /severance-offers/{id}/revoke"

  - priority: 21
    category: business_constraint
    check: "Offer window occupation on one Employee: no other SeveranceOffer of the same Employee occupies the closed interval [issued_utc, blocking_window_end_utc] extended by a one-day cooldown — the request is rejected while current_utc <= blocking_window_end_utc + 1 day."
    error_id: ERR_OFFER_WINDOW_CONFLICT
    http_status: 409
    applies_to: "POST /severance-offers, POST /severance-offers/{id}/issue"

  - priority: 22
    category: business_constraint
    check: "WARN aggregation window occupation on one Site: proposed_separation_date must fall outside every ISSUED WarnNotice's frozen window for that site — [window_start_date, window_end_date) for a FEDERAL notice, [window_start_date, window_end_date] for a STATE notice."
    error_id: ERR_WARN_WINDOW_COLLISION
    http_status: 409
    applies_to: "POST /selections, POST /reduction-plans/{id}/selection-batch"

  - priority: 23
    category: business_constraint
    check: "At most one Selection per (plan_id, employee_id) in status other than RESCINDED."
    error_id: ERR_DUPLICATE_SELECTION
    http_status: 409
    applies_to: "POST /selections, POST /reduction-plans/{id}/selection-batch"

  - priority: 24
    category: business_constraint
    check: "selection_criteria weight_pct values sum to exactly 100 and criterion_code values are unique."
    error_id: ERR_CRITERIA_WEIGHT_INVALID
    http_status: 422
    applies_to: "POST /reduction-plans"

  - priority: 25
    category: business_constraint
    check: "The set of criterion_code values in criterion_scores equals the plan's locked selection_criteria code set exactly — no missing code, no extra code."
    error_id: ERR_CRITERION_SCORE_MISMATCH
    http_status: 422
    applies_to: "POST /selections, POST /reduction-plans/{id}/selection-batch"

  - priority: 26
    category: business_constraint
    check: "content_codes is a superset of the applied WarnRule.required_content_codes."
    error_id: ERR_WARN_CONTENT_INCOMPLETE
    http_status: 422
    applies_to: "POST /warn-notices/{id}/issue"

  - priority: 27
    category: business_constraint
    check: "At most one WarnRule per (jurisdiction, state_code)."
    error_id: ERR_WARN_RULE_ALREADY_EXISTS
    http_status: 409
    applies_to: "POST /warn-rules"

  - priority: 28
    category: business_constraint
    check: "SeveranceOffer.issue_count < 3 before a further issuance."
    error_id: ERR_OFFER_REISSUE_LIMIT
    http_status: 422
    applies_to: "POST /severance-offers/{id}/issue"

  - priority: 29
    category: business_constraint
    check: "The adverse-impact pool supports the statistic: pool_count > 0, selected_count > 0, the reference group (N - n_f) is non-empty and reference_rate != 0."
    error_id: ERR_IMPACT_ANALYSIS_INSUFFICIENT_DATA
    http_status: 422
    applies_to: "POST /adverse-impact-analyses"

  - priority: 30
    category: business_referential
    check: "ReductionPlan.approval_status == APPROVED before individual notice delivery."
    error_id: ERR_PLAN_NOT_APPROVED
    http_status: 422
    applies_to: "POST /selections/{id}/deliver-notice"

  - priority: 31
    category: business_referential
    check: "script_code is MANAGER_SCRIPT_UNION whenever the applied STATE WarnRule's required_content_codes contains UNION_NOTICE; otherwise MANAGER_SCRIPT_STANDARD and MANAGER_SCRIPT_REMOTE are also accepted."
    error_id: ERR_SCRIPT_JURISDICTION_MISMATCH
    http_status: 422
    applies_to: "POST /selections/{id}/deliver-notice"

  - priority: 32
    category: business_referential
    check: "The workforce denominator under the applied rule is non-empty."
    error_id: ERR_WARN_WORKFORCE_EMPTY
    http_status: 422
    applies_to: "POST /warn-notices"

  - priority: 33
    category: business_referential
    check: "No PositionRestriction in status RESTRICTED matches (site_id, job_title) of the incoming hire."
    error_id: ERR_BACKFILL_RESTRICTED
    http_status: 409
    applies_to: "POST /employees, POST /sites/{id}/roster-import"

  - priority: 34
    category: business_fiscal
    check: "ReductionPlan.severance_reserve_cents + SeveranceOffer.total_separation_cost_cents <= ReductionPlan.severance_budget_cents."
    error_id: ERR_SEVERANCE_BUDGET_EXCEEDED
    http_status: 422
    applies_to: "POST /severance-offers/{id}/issue"

# ---------------------------------------------------------------------------
# 1.5 API Endpoint Table  (flat topology: every collection sits at the root)
# ---------------------------------------------------------------------------
endpoints:

  # ---- ReductionPlan ------------------------------------------------------
  - method: POST
    path: "/reduction-plans"
    description: "Open a reduction-in-force plan with its documented selection criteria."
    roles: [RestructuringLead]
    code: 201
    input: [name, decisional_unit_name, selection_criteria, severance_budget_cents]
    output: ReductionPlan
    side_effects:
      - "criteria_status starts DRAFT, approval_status DRAFT, warn_status NOT_ASSESSED, version 1"

  - method: GET
    path: "/reduction-plans/{id}"
    description: "Read a plan including both status axes and both ledger rollups."
    roles: [RestructuringLead, EmploymentCounsel, BenefitsAdministrator, SystemAdmin]
    code: 200
    input: []
    output: ReductionPlan
    side_effects: []

  - method: POST
    path: "/reduction-plans/{id}/lock-criteria"
    description: "Freeze the documented selection criteria so selections may be scored against them."
    roles: [RestructuringLead]
    code: 200
    input: []
    output: ReductionPlan
    side_effects:
      - "criteria_status DRAFT -> LOCKED"
      - "increments ReductionPlan.version by 1"

  - method: POST
    path: "/reduction-plans/{id}/submit-legal-review"
    description: "Hand the plan to employment counsel; records the submitting X-User-ID for the segregation-of-duties check."
    roles: [RestructuringLead]
    code: 200
    input: []
    output: ReductionPlan
    side_effects:
      - "approval_status DRAFT -> IN_LEGAL_REVIEW"
      - "sets submitted_by_user_id"
      - "increments ReductionPlan.version by 1"

  - method: POST
    path: "/reduction-plans/{id}/legal-decision"
    description: "Counsel approves the plan or returns it to drafting; APPROVE requires a CLEARED adverse-impact analysis."
    roles: [EmploymentCounsel]
    code: 200
    input: [decision, "comment?"]
    output: ReductionPlan
    side_effects:
      - "approval_status IN_LEGAL_REVIEW -> APPROVED (decision APPROVE) or -> DRAFT with legal_return_count += 1 (decision RETURN)"
      - "increments ReductionPlan.version by 1"

  - method: POST
    path: "/reduction-plans/{id}/execute"
    description: "Carry out the reduction: separate every noticed selection and freeze the vacated seats."
    roles: [RestructuringLead]
    code: 200
    input: []
    output: ReductionPlan
    side_effects:
      - "approval_status APPROVED -> EXECUTED and warn_status -> NOTICE_PERIOD_SATISFIED"
      - "cascades Selection SELECTED -> SEPARATED -> Employee SEPARATED -> PositionRestriction created + Site counters recomputed"
      - "promotes SIGNED offers past their revocation deadline to EFFECTIVE"
      - "increments ReductionPlan.version by 1"

  - method: POST
    path: "/reduction-plans/{id}/selection-batch"
    description: "Create one PROPOSED Selection per listed employee with a shared separation date and criterion score sheet."
    roles: [RestructuringLead]
    code: 201
    input: [employee_ids, proposed_separation_date, criterion_scores]
    output:
      created_count: integer
      selection_ids: string[]
    side_effects:
      - "one Selection per employee_id in status PROPOSED with composite_score computed"
      - "selection_ids are returned in the order the employee_ids array was supplied"

  - method: POST
    path: "/reduction-plans/{id}/decide-batch"
    description: "Resolve the PROPOSED/{SELECTED,EXEMPTED} fork for a list of selections in one request; the full per-selection cascade runs for each SELECT."
    roles: [RestructuringLead]
    code: 200
    input: [selection_ids, decision, "exemption_reason?"]
    output:
      decided_count: integer
      selected_count: integer
      exempted_count: integer
    side_effects:
      - "each listed Selection PROPOSED -> SELECTED or PROPOSED -> EXEMPTED with that branch's declared cascade"
      - "selections are processed in the order supplied in selection_ids"

  # ---- Site ---------------------------------------------------------------
  - method: POST
    path: "/sites"
    description: "Register a single site of employment for WARN counting."
    roles: [RestructuringLead]
    code: 201
    input: [name, state_code, "is_single_site?"]
    output: Site
    side_effects:
      - "all counters start at 0 and warn_trigger_status starts NONE"

  - method: GET
    path: "/sites/{id}"
    description: "Read a site including both jurisdictions' loss counts and the derived WARN trigger status."
    roles: [RestructuringLead, EmploymentCounsel, BenefitsAdministrator, SystemAdmin]
    code: 200
    input: []
    output: Site
    side_effects: []

  - method: POST
    path: "/sites/{id}/roster-import"
    description: "HRIS roster load: create many Employee rows at this site in one request."
    roles: [RestructuringLead]
    code: 201
    input: [entries]
    output:
      created_count: integer
      employee_ids: string[]
    side_effects:
      - "one Employee per entry in status ACTIVE"
      - "employee_ids are returned in the order the entries array was supplied"
      - "recomputes Site.roster_count and Site.active_headcount"

  # ---- Employee -----------------------------------------------------------
  - method: POST
    path: "/employees"
    description: "Hire one person onto a site roster. This is also the backfill control point: a RESTRICTED PositionRestriction on the same (site_id, job_title) rejects the hire."
    roles: [RestructuringLead]
    code: 201
    input: [site_id, full_name, job_title, birth_date, hire_date, annual_base_cents, weekly_hours, demographic_code, "monthly_premium_cents?"]
    output: Employee
    side_effects:
      - "recomputes Site.roster_count and Site.active_headcount"
      - "releases any PositionRestriction whose restricted_until_utc has passed before the backfill check runs"

  - method: GET
    path: "/employees/{id}"
    description: "Read one employee including derived separation, benefit and outplacement fields."
    roles: [RestructuringLead, EmploymentCounsel, BenefitsAdministrator, SystemAdmin]
    code: 200
    input: []
    output: Employee
    side_effects: []

  - method: GET
    path: "/employees"
    description: "List employees, filterable by site, employment status and job title."
    roles: [RestructuringLead, EmploymentCounsel, BenefitsAdministrator, SystemAdmin]
    code: 200
    input: ["site_id?", "employment_status?", "job_title?", "limit?", "offset?"]
    output: Employee[]
    side_effects: []

  # ---- Selection ----------------------------------------------------------
  - method: POST
    path: "/selections"
    description: "Propose one employee for the reduction, scored against the plan's locked criteria."
    roles: [RestructuringLead]
    code: 201
    input: [plan_id, employee_id, proposed_separation_date, criterion_scores]
    output: Selection
    side_effects:
      - "status starts PROPOSED and composite_score is computed"
      - "recomputes ReductionPlan.pool_count"

  - method: GET
    path: "/selections/{id}"
    description: "Read one selection including notice fields and the current version for OCC."
    roles: [RestructuringLead, EmploymentCounsel, BenefitsAdministrator, SystemAdmin]
    code: 200
    input: []
    output: Selection
    side_effects: []

  - method: GET
    path: "/selections"
    description: "List selections, filterable by plan, employee and status."
    roles: [RestructuringLead, EmploymentCounsel, BenefitsAdministrator, SystemAdmin]
    code: 200
    input: ["plan_id?", "employee_id?", "status?", "limit?", "offset?"]
    output: Selection[]
    side_effects: []

  - method: POST
    path: "/selections/{id}/decide"
    description: "Resolve the fork for one selection: SELECT runs the four-hop cascade, EXEMPT touches nothing downstream."
    roles: [RestructuringLead]
    code: 200
    input: [decision, "exemption_reason?"]
    output: Selection
    side_effects:
      - "PROPOSED -> SELECTED with the Employee / Site / plan warn_status / disclosure-staleness cascade, or PROPOSED -> EXEMPTED with no downstream mutation"
      - "increments Selection.version by 1"

  - method: POST
    path: "/selections/{id}/rescind"
    description: "Compensating action for a SELECT decision; restores the employee, the site counters and the plan's WARN posture."
    roles: [RestructuringLead]
    code: 200
    input: [rescind_reason]
    output: Selection
    side_effects:
      - "SELECTED -> RESCINDED with the three-hop compensation chain"
      - "voids ISSUED WarnNotices whose site returns to warn_trigger_status NONE"
      - "increments Selection.version by 1"

  - method: POST
    path: "/selections/{id}/deliver-notice"
    description: "Notification logistics: record the manager-script delivery of the individual notice at the current logical clock."
    roles: [RestructuringLead]
    code: 200
    input: [script_code, "acknowledge_short_notice?"]
    output: Selection
    side_effects:
      - "notice_status -> DELIVERED, stamps notice_delivered_utc and notice_script_code, computes notice_days_before_separation"
      - "increments Selection.version by 1"

  # ---- WarnRule -----------------------------------------------------------
  - method: POST
    path: "/warn-rules"
    description: "Configure the federal statute row or a state mini-WARN row, including its content requirements and window length."
    roles: [SystemAdmin]
    code: 201
    input: [jurisdiction, state_code, rule_code, min_loss_count, min_percent, absolute_count, notice_days, window_days, counts_part_time, min_service_days, required_content_codes]
    output: WarnRule
    side_effects: []

  - method: GET
    path: "/warn-rules/{id}"
    description: "Read one configured WARN rule."
    roles: [RestructuringLead, EmploymentCounsel, BenefitsAdministrator, SystemAdmin]
    code: 200
    input: []
    output: WarnRule
    side_effects: []

  # ---- AdverseImpactAnalysis ---------------------------------------------
  - method: POST
    path: "/adverse-impact-analyses"
    description: "Run the adverse-impact statistic over the plan's current selection pool. Requires expected_plan_version because a new analysis supersedes the plan's prior one."
    roles: [EmploymentCounsel]
    code: 201
    input: [plan_id, method, expected_plan_version]
    output: AdverseImpactAnalysis
    side_effects:
      - "supersedes every earlier analysis of the plan"
      - "increments ReductionPlan.version by 1"

  - method: GET
    path: "/adverse-impact-analyses/{id}"
    description: "Read one analysis including both statistics' fields and the small-sample suppression flag."
    roles: [RestructuringLead, EmploymentCounsel, BenefitsAdministrator, SystemAdmin]
    code: 200
    input: []
    output: AdverseImpactAnalysis
    side_effects: []

  - method: GET
    path: "/adverse-impact-analyses"
    description: "List analyses, filterable by plan and status."
    roles: [RestructuringLead, EmploymentCounsel, BenefitsAdministrator, SystemAdmin]
    code: 200
    input: ["plan_id?", "status?", "limit?", "offset?"]
    output: AdverseImpactAnalysis[]
    side_effects: []

  - method: POST
    path: "/adverse-impact-analyses/{id}/clear"
    description: "Record the business-necessity justification that clears a computed or flagged analysis."
    roles: [EmploymentCounsel]
    code: 200
    input: [justification]
    output: AdverseImpactAnalysis
    side_effects:
      - "status -> CLEARED and cleared_by_user_id set"
      - "increments AdverseImpactAnalysis.version by 1"

  # ---- OwbpaDisclosure ----------------------------------------------------
  - method: POST
    path: "/owbpa-disclosures"
    description: "Generate the OWBPA decisional-unit disclosure (job-title and age bands of selected and non-selected) and snapshot the plan counts it was computed from."
    roles: [EmploymentCounsel]
    code: 201
    input: [plan_id]
    output: OwbpaDisclosure
    side_effects:
      - "supersedes every earlier disclosure of the plan"
      - "increments ReductionPlan.version by 1"

  - method: GET
    path: "/owbpa-disclosures/{id}"
    description: "Read one disclosure including its age bands and staleness snapshot."
    roles: [RestructuringLead, EmploymentCounsel, BenefitsAdministrator, SystemAdmin]
    code: 200
    input: []
    output: OwbpaDisclosure
    side_effects: []

  - method: GET
    path: "/owbpa-disclosures"
    description: "List disclosures, filterable by plan and status."
    roles: [RestructuringLead, EmploymentCounsel, BenefitsAdministrator, SystemAdmin]
    code: 200
    input: ["plan_id?", "status?", "limit?", "offset?"]
    output: OwbpaDisclosure[]
    side_effects: []

  # ---- WarnNotice ---------------------------------------------------------
  - method: POST
    path: "/warn-notices"
    description: "Determine the WARN threshold for one site under one jurisdiction and draft the notice with its content codes."
    roles: [EmploymentCounsel]
    code: 201
    input: [plan_id, site_id, jurisdiction, content_codes]
    output: WarnNotice
    side_effects:
      - "runs warn_employment_loss_count for the requested jurisdiction and freezes the counts, percent, threshold_met, trigger_type, window bounds and notice_deadline_utc onto the row"

  - method: GET
    path: "/warn-notices/{id}"
    description: "Read one notice including its frozen determination."
    roles: [RestructuringLead, EmploymentCounsel, BenefitsAdministrator, SystemAdmin]
    code: 200
    input: []
    output: WarnNotice
    side_effects: []

  - method: GET
    path: "/warn-notices"
    description: "List notices, filterable by plan, site, jurisdiction and status."
    roles: [RestructuringLead, EmploymentCounsel, BenefitsAdministrator, SystemAdmin]
    code: 200
    input: ["plan_id?", "site_id?", "jurisdiction?", "status?", "limit?", "offset?"]
    output: WarnNotice[]
    side_effects: []

  - method: POST
    path: "/warn-notices/{id}/issue"
    description: "Issue the notice; freezes the site's aggregation window against later selections."
    roles: [EmploymentCounsel]
    code: 200
    input: []
    output: WarnNotice
    side_effects:
      - "DRAFT -> ISSUED, stamps issued_utc"
      - "advances ReductionPlan.warn_status THRESHOLD_PENDING -> NOTICES_ISSUED when every triggered site is covered"
      - "increments WarnNotice.version by 1"

  # ---- SeveranceOffer -----------------------------------------------------
  - method: POST
    path: "/severance-offers"
    description: "Price a severance offer for a selected employee. Requires expected_selection_version because a fresh offer supersedes a revoked or expired one."
    roles: [BenefitsAdministrator]
    code: 201
    input: [selection_id, variant, expected_selection_version]
    output: SeveranceOffer
    side_effects:
      - "runs severance_award_cents then separation_cost_rollup and freezes every monetary field"
      - "pins owbpa_disclosure_id to the plan's ATTACHED disclosure for an age-40-plus release"
      - "increments Selection.version by 1"

  - method: GET
    path: "/severance-offers/{id}"
    description: "Read one offer including every computed monetary field and both deadline stamps."
    roles: [RestructuringLead, EmploymentCounsel, BenefitsAdministrator, SystemAdmin, SeparatingEmployee]
    code: 200
    input: []
    output: SeveranceOffer
    side_effects: []

  - method: GET
    path: "/severance-offers"
    description: "List offers, filterable by selection, plan, pinned disclosure and status."
    roles: [RestructuringLead, EmploymentCounsel, BenefitsAdministrator, SystemAdmin]
    code: 200
    input: ["selection_id?", "plan_id?", "owbpa_disclosure_id?", "status?", "limit?", "offset?"]
    output: SeveranceOffer[]
    side_effects: []

  - method: POST
    path: "/severance-offers/{id}/issue"
    description: "Deliver the offer to the employee and reserve its cost against the plan budget."
    roles: [BenefitsAdministrator]
    code: 200
    input: []
    output: SeveranceOffer
    side_effects:
      - "DRAFT -> ISSUED or REVOKED -> ISSUED, stamps issued_utc, sets consideration_days_applied and consideration_deadline_utc, increments issue_count"
      - "ReductionPlan.severance_reserve_cents += total_separation_cost_cents"
      - "increments SeveranceOffer.version by 1"

  - method: POST
    path: "/severance-offers/{id}/sign"
    description: "The separating employee signs the release; starts benefit continuation and the revocation window."
    roles: [SeparatingEmployee]
    code: 200
    input: []
    output: SeveranceOffer
    side_effects:
      - "ISSUED -> SIGNED, stamps signed_utc and revocation_deadline_utc"
      - "cascades Employee benefit continuation ACTIVE and ReductionPlan.benefit_liability_cents += subsidy"
      - "increments SeveranceOffer.version by 1"

  - method: POST
    path: "/severance-offers/{id}/revoke"
    description: "The separating employee exercises the seven-day OWBPA revocation right; unwinds both ledgers."
    roles: [SeparatingEmployee]
    code: 200
    input: [revocation_reason]
    output: SeveranceOffer
    side_effects:
      - "SIGNED -> REVOKED, stamps revoked_utc"
      - "ReductionPlan.severance_reserve_cents -= total_separation_cost_cents and benefit_liability_cents -= subsidy"
      - "increments SeveranceOffer.version by 1"

  # ---- PositionRestriction -----------------------------------------------
  - method: GET
    path: "/position-restrictions/{id}"
    description: "Read one rehire restriction. Restrictions are created only by the plan-execution cascade, never posted directly."
    roles: [RestructuringLead, EmploymentCounsel, BenefitsAdministrator, SystemAdmin]
    code: 200
    input: []
    output: PositionRestriction
    side_effects: []

  - method: GET
    path: "/position-restrictions"
    description: "List rehire restrictions, filterable by employee, site, job title and status — the only discovery channel for cascade-created restrictions."
    roles: [RestructuringLead, EmploymentCounsel, BenefitsAdministrator, SystemAdmin]
    code: 200
    input: ["employee_id?", "site_id?", "job_title?", "restriction_status?", "limit?", "offset?"]
    output: PositionRestriction[]
    side_effects: []

  - method: POST
    path: "/position-restrictions/{id}/waive"
    description: "Counsel waives a rehire restriction so the seat may be backfilled before the 90 days elapse."
    roles: [EmploymentCounsel]
    code: 200
    input: [waiver_reason]
    output: PositionRestriction
    side_effects:
      - "RESTRICTED -> WAIVED, records waiver_reason and waived_by_user_id"
      - "increments PositionRestriction.version by 1"

  # ---- test-driving logical clock ----------------------------------------
  - method: POST
    path: "/_clock/set_current_utc"
    description: "Set the server's logical clock. The clock starts at exactly 2026-08-01T00:00:00.000Z on server startup and never falls back to real wall-clock time; every deadline, window and age computation reads this clock."
    roles: [SystemAdmin]
    code: 200
    input: [to_iso8601]
    output:
      current_utc: datetime
    side_effects:
      - "moving the clock past a PositionRestriction.restricted_until_utc makes that restriction RELEASED at its next evaluation"

# ---------------------------------------------------------------------------
# 1.6 Error Code Catalog
# ---------------------------------------------------------------------------
errors:
  - id: ERR_UNAUTHENTICATED
    http: 401
    condition: "X-User-Role or X-User-ID header missing or empty."
  - id: ERR_UNAUTHORIZED
    http: 403
    condition: "The acting role is not listed in the endpoint's roles."
  - id: ERR_INVALID_REQUEST
    http: 400
    condition: "Missing required field, unknown enum member, malformed date, limit outside [1,100], offset negative, or score outside 0..100."
  - id: ERR_PLAN_NOT_FOUND
    http: 404
    condition: "No ReductionPlan with the referenced id."
  - id: ERR_SITE_NOT_FOUND
    http: 404
    condition: "No Site with the referenced id."
  - id: ERR_EMPLOYEE_NOT_FOUND
    http: 404
    condition: "No Employee with the referenced id, including any element of employee_ids."
  - id: ERR_SELECTION_NOT_FOUND
    http: 404
    condition: "No Selection with the referenced id, including any element of selection_ids."
  - id: ERR_ANALYSIS_NOT_FOUND
    http: 404
    condition: "No AdverseImpactAnalysis with the referenced id."
  - id: ERR_DISCLOSURE_NOT_FOUND
    http: 404
    condition: "No OwbpaDisclosure with the referenced id."
  - id: ERR_NOTICE_NOT_FOUND
    http: 404
    condition: "No WarnNotice with the referenced id."
  - id: ERR_OFFER_NOT_FOUND
    http: 404
    condition: "No SeveranceOffer with the referenced id."
  - id: ERR_RESTRICTION_NOT_FOUND
    http: 404
    condition: "No PositionRestriction with the referenced id."
  - id: ERR_WARN_RULE_NOT_FOUND
    http: 404
    condition: "No WarnRule configured for the requested jurisdiction, or the path id names no rule."
  - id: ERR_NOT_OFFER_RECIPIENT
    http: 403
    condition: "A SeparatingEmployee acts on an offer whose Selection.employee_id differs from the acting X-User-ID."
  - id: ERR_SEGREGATION_OF_DUTIES
    http: 403
    condition: "The X-User-ID rendering a legal decision equals ReductionPlan.submitted_by_user_id."
  - id: ERR_INVALID_PLAN_STATE
    http: 409
    condition: "The plan's approval_status or criteria_status forbids the requested transition, or a disclosure is requested for a plan with no earliest_separation_date."
  - id: ERR_INVALID_SELECTION_STATE
    http: 409
    condition: "The selection's status forbids the requested transition, or an offer operation targets a selection that is not SELECTED."
  - id: ERR_INVALID_ANALYSIS_STATE
    http: 409
    condition: "Clearing an analysis that is already CLEARED, SUPERSEDED or STALE."
  - id: ERR_INVALID_NOTICE_STATE
    http: 409
    condition: "Issuing a notice that is not DRAFT."
  - id: ERR_INVALID_OFFER_STATE
    http: 409
    condition: "The offer's status forbids the requested transition — issuing a non-DRAFT non-REVOKED offer, signing a non-ISSUED offer, revoking a non-SIGNED offer."
  - id: ERR_INVALID_RESTRICTION_STATE
    http: 409
    condition: "Waiving a restriction that is not RESTRICTED."
  - id: ERR_STALE_PLAN_VERSION
    http: 412
    condition: "expected_plan_version does not equal ReductionPlan.version."
  - id: ERR_STALE_SELECTION_VERSION
    http: 412
    condition: "expected_selection_version does not equal Selection.version."
  - id: ERR_CRITERIA_NOT_LOCKED
    http: 422
    condition: "A selection is created while ReductionPlan.criteria_status is DRAFT."
  - id: ERR_CRITERIA_WEIGHT_INVALID
    http: 422
    condition: "selection_criteria weight_pct values do not sum to 100, or a criterion_code repeats."
  - id: ERR_CRITERION_SCORE_MISMATCH
    http: 422
    condition: "criterion_scores codes are not exactly the plan's locked criterion codes."
  - id: ERR_IMPACT_ANALYSIS_NOT_CLEARED
    http: 422
    condition: "The plan's latest AdverseImpactAnalysis is absent, COMPUTED, FLAGGED, SUPERSEDED or STALE where CLEARED is demanded."
  - id: ERR_IMPACT_ANALYSIS_INSUFFICIENT_DATA
    http: 422
    condition: "The pool is empty, nobody is selected, the reference group is empty, or reference_rate is zero."
  - id: ERR_OWBPA_DISCLOSURE_MISSING
    http: 422
    condition: "An age-40-plus release is priced while the plan carries no OwbpaDisclosure in status ATTACHED or STALE."
  - id: ERR_OWBPA_DISCLOSURE_STALE
    http: 422
    condition: "The plan's current disclosure is STALE because its snapshot no longer matches the plan's selected_count or pool_count."
  - id: ERR_NOTICE_NOT_DELIVERED
    http: 422
    condition: "A severance offer is priced for a selection whose notice_status is NOT_DELIVERED."
  - id: ERR_WARN_NOTICE_REQUIRED
    http: 422
    condition: "Plan execution is attempted while a triggered site has no ISSUED WarnNotice for this plan."
  - id: ERR_NOTICE_PERIOD_INSUFFICIENT
    http: 422
    condition: "Individual notice would land fewer than Site.required_notice_days before the separation date and acknowledge_short_notice is not true."
  - id: ERR_CONSIDERATION_PERIOD_EXPIRED
    http: 422
    condition: "Signing after consideration_deadline_utc; the offer is left EXPIRED."
  - id: ERR_REVOCATION_WINDOW_CLOSED
    http: 422
    condition: "Revoking after revocation_deadline_utc."
  - id: ERR_OFFER_WINDOW_CONFLICT
    http: 409
    condition: "Another offer for the same employee still occupies its blocking window plus the one-day cooldown."
  - id: ERR_WARN_WINDOW_COLLISION
    http: 409
    condition: "A proposed separation date falls inside the frozen aggregation window of an ISSUED WarnNotice for that site."
  - id: ERR_DUPLICATE_SELECTION
    http: 409
    condition: "The employee already holds a non-RESCINDED Selection in this plan."
  - id: ERR_WARN_CONTENT_INCOMPLETE
    http: 422
    condition: "content_codes omits a code the applied WarnRule requires."
  - id: ERR_WARN_RULE_ALREADY_EXISTS
    http: 409
    condition: "A WarnRule already exists for the (jurisdiction, state_code) pair."
  - id: ERR_WARN_WORKFORCE_EMPTY
    http: 422
    condition: "The workforce denominator under the applied rule is zero."
  - id: ERR_OFFER_REISSUE_LIMIT
    http: 422
    condition: "A fourth issuance of the same offer is attempted."
  - id: ERR_PLAN_NOT_APPROVED
    http: 422
    condition: "Individual notice delivery is attempted while approval_status is not APPROVED."
  - id: ERR_SCRIPT_JURISDICTION_MISMATCH
    http: 422
    condition: "The manager script does not satisfy the site's state content requirements."
  - id: ERR_BACKFILL_RESTRICTED
    http: 409
    condition: "A hire targets a (site_id, job_title) pair covered by a RESTRICTED PositionRestriction."
  - id: ERR_SEVERANCE_BUDGET_EXCEEDED
    http: 422
    condition: "Issuing the offer would push severance_reserve_cents above severance_budget_cents."

