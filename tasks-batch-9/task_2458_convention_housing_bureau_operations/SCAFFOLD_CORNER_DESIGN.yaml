scaffold_corner_design:

  # ===================================================================================
  # SECTION 1 — ENTITIES
  # ===================================================================================
  - section: entities
    instances:
      - name: event_creation_returns_computed_night_count_and_planning_posture
        claim_type: creation
        grounds:
          - entities.Event.fields.night_count
          - entities.Event.fields.housing_posture
          - endpoints[POST /housing/events]
        distinguishing_aspect: "POST /housing/events with all eight required fields returns 201 with night_count == 4 (2026-09-14..2026-09-18), housing_posture PLANNING, total_confirmed_room_nights 0 and commission_collected_cents 0."
        test_recipe:
          setup: ["Empty database; no events exist."]
          setup_api_calls: []
          trigger:
            - call: "POST /housing/events"
              payload: { name: "Annual Summit", code: "SUM26", event_start_date: "2026-09-14", event_end_date: "2026-09-18", cutoff_date: "2026-08-21", attrition_deadline_date: "2026-08-15", standard_commission_pct: 0.10, standard_rebate_per_room_night_cents: 500 }
              as: BureauCoordinator
              captures: { event_id: $.data.id }
          assert:
            - "response HTTP status == 201"
            - "Event.${event_id}.night_count == 4"
            - "Event.${event_id}.housing_posture == PLANNING"
            - "Event.${event_id}.total_confirmed_room_nights == 0"
            - "Event.${event_id}.commission_collected_cents == 0"
            - "response body has keys data, error and meta (response envelope)"

      - name: hotel_retrieval_returns_stored_fields
        claim_type: retrieval
        grounds:
          - entities.Hotel.fields.room_tax_pct
          - endpoints[GET /housing/hotels/{id}]
        distinguishing_aspect: "GET /housing/hotels/{id} returns exactly the stored hotel: name Grand Plaza, distance_to_venue_miles 0.3, room_tax_pct 0.1475, total_rooms 400."
        test_recipe:
          setup: ["One hotel created with tax 0.1475 and 400 rooms."]
          setup_api_calls:
            - call: "POST /housing/hotels"
              payload: { name: "Grand Plaza", distance_to_venue_miles: 0.3, room_tax_pct: 0.1475, total_rooms: 400 }
              as: BureauCoordinator
              captures: { hotel_id: $.data.id }
          trigger:
            - call: "GET /housing/hotels/${hotel_id}"
              payload: {}
              as: BureauCoordinator
          assert:
            - "response HTTP status == 200"
            - "response.data.id == ${hotel_id}"
            - "response.data.name == Grand Plaza"
            - "response.data.room_tax_pct == 0.1475"
            - "response.data.total_rooms == 400"

      - name: hotel_block_listing_filters_by_event_and_status
        claim_type: listing
        grounds:
          - endpoints[GET /housing/hotel-blocks]
          - entities.HotelBlock.fields.status
        distinguishing_aspect: "With two DRAFT blocks on the same event and one on another event, GET /housing/hotel-blocks filtered by event_id and status=DRAFT returns total_count 2 and has_more false."
        test_recipe:
          setup:
            - "Two events; hotel A and hotel B."
            - "Two DRAFT blocks on event 1 (one per hotel) and one DRAFT block on event 2."
          setup_api_calls:
            - call: "POST /housing/events"
              payload: { name: "Annual Summit", code: "SUM26", event_start_date: "2026-09-14", event_end_date: "2026-09-18", cutoff_date: "2026-08-21", attrition_deadline_date: "2026-08-15", standard_commission_pct: 0.10, standard_rebate_per_room_night_cents: 500 }
              as: BureauCoordinator
              captures: { event1_id: $.data.id }
            - call: "POST /housing/events"
              payload: { name: "Winter Expo", code: "WEX26", event_start_date: "2026-11-10", event_end_date: "2026-11-13", cutoff_date: "2026-10-15", attrition_deadline_date: "2026-10-01", standard_commission_pct: 0.10, standard_rebate_per_room_night_cents: 500 }
              as: BureauCoordinator
              captures: { event2_id: $.data.id }
            - call: "POST /housing/hotels"
              payload: { name: "Grand Plaza", distance_to_venue_miles: 0.3, room_tax_pct: 0.1475, total_rooms: 400 }
              as: BureauCoordinator
              captures: { hotelA_id: $.data.id }
            - call: "POST /housing/hotels"
              payload: { name: "Riverside Inn", distance_to_venue_miles: 1.2, room_tax_pct: 0.12, total_rooms: 150 }
              as: BureauCoordinator
              captures: { hotelB_id: $.data.id }
            - call: "POST /housing/hotel-blocks"
              payload: { event_id: "${event1_id}", hotel_id: "${hotelA_id}", contracted_rooms_per_night: 10, negotiated_nightly_rate_cents: 21900, commission_pct: 0.12, rebate_per_room_night_cents: 700, cutoff_date: "2026-08-21", reduction_rights_pct: 0.20 }
              as: BureauCoordinator
              captures: { block1_id: $.data.id }
            - call: "POST /housing/hotel-blocks"
              payload: { event_id: "${event1_id}", hotel_id: "${hotelB_id}", contracted_rooms_per_night: 5, negotiated_nightly_rate_cents: 15900, commission_pct: 0.11, rebate_per_room_night_cents: 600, cutoff_date: "2026-08-21", reduction_rights_pct: 0.20 }
              as: BureauCoordinator
              captures: { block2_id: $.data.id }
            - call: "POST /housing/hotel-blocks"
              payload: { event_id: "${event2_id}", hotel_id: "${hotelA_id}", contracted_rooms_per_night: 8, negotiated_nightly_rate_cents: 18900, commission_pct: 0.12, rebate_per_room_night_cents: 500, cutoff_date: "2026-10-15", reduction_rights_pct: 0.20 }
              as: BureauCoordinator
              captures: { block3_id: $.data.id }
          trigger:
            - call: "GET /housing/hotel-blocks"
              payload: { event_id: "${event1_id}", status: "DRAFT", limit: 10, offset: 0 }
              as: BureauCoordinator
          assert:
            - "response HTTP status == 200"
            - "response.meta.total_count == 2"
            - "response.meta.has_more == false"
            - "the returned ids are exactly ${block1_id} and ${block2_id}; ${block3_id} is absent"

      - name: reservation_get_with_unknown_id_not_found
        claim_type: not_found
        grounds:
          - errors[ERR_RESERVATION_NOT_FOUND]
          - endpoints[GET /housing/reservations/{id}]
        distinguishing_aspect: "GET /housing/reservations/{id} with a syntactically valid but unknown UUID returns 404 ERR_RESERVATION_NOT_FOUND, not an empty 200 body."
        test_recipe:
          setup: ["Empty database; no reservations exist."]
          setup_api_calls: []
          trigger:
            - call: "GET /housing/reservations/00000000-0000-0000-0000-000000000999"
              payload: {}
              as: BureauCoordinator
          assert:
            - "response HTTP status == 404"
            - "response.data.error_id == ERR_RESERVATION_NOT_FOUND"
            - "response.data is null in the envelope's data slot; the error object carries error_id and message"

      - name: hotel_block_missing_required_commission_pct_rejected
        claim_type: required_fields
        grounds:
          - endpoints[POST /housing/hotel-blocks]
          - validations[priority=25]
          - errors[ERR_INVALID_REQUEST]
        distinguishing_aspect: "POST /housing/hotel-blocks without commission_pct returns 422 ERR_INVALID_REQUEST and creates no HotelBlock row."
        test_recipe:
          setup: ["One event and one hotel exist; no blocks yet."]
          setup_api_calls:
            - call: "POST /housing/events"
              payload: { name: "Annual Summit", code: "SUM26", event_start_date: "2026-09-14", event_end_date: "2026-09-18", cutoff_date: "2026-08-21", attrition_deadline_date: "2026-08-15", standard_commission_pct: 0.10, standard_rebate_per_room_night_cents: 500 }
              as: BureauCoordinator
              captures: { event_id: $.data.id }
            - call: "POST /housing/hotels"
              payload: { name: "Grand Plaza", distance_to_venue_miles: 0.3, room_tax_pct: 0.1475, total_rooms: 400 }
              as: BureauCoordinator
              captures: { hotel_id: $.data.id }
          trigger:
            - call: "POST /housing/hotel-blocks"
              payload: { event_id: "${event_id}", hotel_id: "${hotel_id}", contracted_rooms_per_night: 10, negotiated_nightly_rate_cents: 21900, rebate_per_room_night_cents: 700, cutoff_date: "2026-08-21", reduction_rights_pct: 0.20 }
              as: BureauCoordinator
          assert:
            - "response HTTP status == 422"
            - "response.data.error_id == ERR_INVALID_REQUEST"
            - "GET /housing/hotel-blocks with event_id=${event_id} returns total_count == 0"

      - name: hotel_standing_defaults_to_active_when_omitted
        claim_type: defaults
        grounds:
          - entities.Hotel.fields.standing
          - endpoints[POST /housing/hotels]
        distinguishing_aspect: "POST /housing/hotels omitting the optional standing field stores standing == ACTIVE, which is what lets the block contract without ERR_HOTEL_SUSPENDED."
        test_recipe:
          setup: ["Empty database."]
          setup_api_calls: []
          trigger:
            - call: "POST /housing/hotels"
              payload: { name: "Grand Plaza", distance_to_venue_miles: 0.3, room_tax_pct: 0.1475, total_rooms: 400 }
              as: BureauCoordinator
              captures: { hotel_id: $.data.id }
          assert:
            - "response HTTP status == 201"
            - "Hotel.${hotel_id}.standing == ACTIVE"

      - name: reservation_computed_charge_fields_input_ignored
        claim_type: computed_fields
        grounds:
          - entities.Reservation.fields.total_room_charge_cents
          - entities.Reservation.fields.quoted_nightly_rate_cents
          - calculations.reservation_total_charge
        distinguishing_aspect: "A reservation request that also carries total_room_charge_cents 1 and quoted_nightly_rate_cents 100 is stored with the server-computed 100520 and 21900 — client values for computed fields are ignored, not honoured and not rejected as unknown input."
        test_recipe:
          setup: ["OPEN block (10 rooms, rate 21900, hotel tax 0.1475) with an APPROVED GENERAL sub-block of 6 rooms and one attendee."]
          setup_api_calls:
            - call: "POST /housing/events"
              payload: { name: "Annual Summit", code: "SUM26", event_start_date: "2026-09-14", event_end_date: "2026-09-18", cutoff_date: "2026-08-21", attrition_deadline_date: "2026-08-15", standard_commission_pct: 0.10, standard_rebate_per_room_night_cents: 500 }
              as: BureauCoordinator
              captures: { event_id: $.data.id }
            - call: "POST /housing/hotels"
              payload: { name: "Grand Plaza", distance_to_venue_miles: 0.3, room_tax_pct: 0.1475, total_rooms: 400 }
              as: BureauCoordinator
              captures: { hotel_id: $.data.id }
            - call: "POST /housing/hotel-blocks"
              payload: { event_id: "${event_id}", hotel_id: "${hotel_id}", contracted_rooms_per_night: 10, negotiated_nightly_rate_cents: 21900, commission_pct: 0.12, rebate_per_room_night_cents: 700, cutoff_date: "2026-08-21", reduction_rights_pct: 0.20 }
              as: BureauCoordinator
              captures: { block_id: $.data.id, block_v1: $.data.version }
            - call: "POST /housing/hotel-blocks/${block_id}/terms"
              payload: { negotiated_nightly_rate_cents: 21900, commission_pct: 0.12, rebate_per_room_night_cents: 700, cutoff_date: "2026-08-21", reduction_rights_pct: 0.20, expected_hotel_block_version: "${block_v1}" }
              as: BureauCoordinator
              captures: { block_v2: $.data.version }
            - call: "POST /housing/hotel-blocks/${block_id}/contract"
              payload: { confirmation_number: "CN-SUM26-001" }
              as: HotelManager
              as_user_id: "${hotel_id}"
              captures: { block_v3: $.data.version }
            - call: "POST /housing/hotel-blocks/${block_id}/sub-blocks"
              payload: { segment: "GENERAL", allotted_rooms: 6, expected_hotel_block_version: "${block_v3}" }
              as: BureauCoordinator
              as_user_id: "coord-1"
              captures: { gen_sb_id: $.data.id }
            - call: "POST /housing/hotel-blocks/${block_id}/open"
              payload: {}
              as: BureauCoordinator
            - call: "POST /housing/attendees"
              payload: { event_id: "${event_id}", email: "a1@example.com", full_name: "Attendee One", registration_id: "REG-1", attendee_type: "GENERAL" }
              as: BureauCoordinator
              captures: { att1_id: $.data.id }
          trigger:
            - call: "POST /housing/reservations"
              payload: { sub_block_id: "${gen_sb_id}", attendee_id: "${att1_id}", check_in_date: "2026-09-14", check_out_date: "2026-09-18", occupants: 1, total_room_charge_cents: 1, quoted_nightly_rate_cents: 100 }
              as: Attendee
              as_user_id: "${att1_id}"
              captures: { res1_id: $.data.id }
          assert:
            - "Reservation.${res1_id}.quoted_nightly_rate_cents == 21900"
            - "Reservation.${res1_id}.room_tax_pct_snapshot == 0.1475"
            - "Reservation.${res1_id}.total_room_charge_cents == 100520"
            - "Reservation.${res1_id}.room_nights == 4"

      - name: attendee_system_fields_generated_input_ignored
        claim_type: system_fields
        grounds:
          - entities.Attendee.fields.warning_count
          - entities.Attendee.fields.housing_risk_flag
          - endpoints[POST /housing/attendees]
        distinguishing_aspect: "A create request supplying id, warning_count 9 and housing_risk_flag true is stored with a server-minted id, warning_count 0 and housing_risk_flag false, and carries created_at, updated_at and version 1."
        test_recipe:
          setup: ["One event exists."]
          setup_api_calls:
            - call: "POST /housing/events"
              payload: { name: "Annual Summit", code: "SUM26", event_start_date: "2026-09-14", event_end_date: "2026-09-18", cutoff_date: "2026-08-21", attrition_deadline_date: "2026-08-15", standard_commission_pct: 0.10, standard_rebate_per_room_night_cents: 500 }
              as: BureauCoordinator
              captures: { event_id: $.data.id }
          trigger:
            - call: "POST /housing/attendees"
              payload: { event_id: "${event_id}", email: "a1@example.com", full_name: "Attendee One", registration_id: "REG-1", attendee_type: "GENERAL", id: "00000000-0000-0000-0000-000000000042", warning_count: 9, housing_risk_flag: true }
              as: BureauCoordinator
              captures: { att1_id: $.data.id }
          assert:
            - "Attendee.${att1_id}.id != 00000000-0000-0000-0000-000000000042"
            - "Attendee.${att1_id}.warning_count == 0"
            - "Attendee.${att1_id}.housing_risk_flag == false"
            - "Attendee.${att1_id}.no_show_strikes == 0"
            - "Attendee.${att1_id}.version == 1"
            - "Attendee.${att1_id}.created_at and Attendee.${att1_id}.updated_at are non-null"

      - name: sub_block_invalid_segment_enum_rejects_invalid_request
        claim_type: type_constraints
        grounds:
          - entities.SubBlock.fields.segment
          - validations[priority=25]
          - errors[ERR_INVALID_REQUEST]
        distinguishing_aspect: "A carve with segment PRESS — outside the declared enum {GENERAL, VIP, STAFF, EXHIBITOR} — returns 422 ERR_INVALID_REQUEST and leaves HotelBlock.unassigned_rooms_per_night at 10."
        test_recipe:
          setup: ["One CONTRACTED block of 10 rooms per night with no carves yet."]
          setup_api_calls:
            - call: "POST /housing/events"
              payload: { name: "Annual Summit", code: "SUM26", event_start_date: "2026-09-14", event_end_date: "2026-09-18", cutoff_date: "2026-08-21", attrition_deadline_date: "2026-08-15", standard_commission_pct: 0.10, standard_rebate_per_room_night_cents: 500 }
              as: BureauCoordinator
              captures: { event_id: $.data.id }
            - call: "POST /housing/hotels"
              payload: { name: "Grand Plaza", distance_to_venue_miles: 0.3, room_tax_pct: 0.1475, total_rooms: 400 }
              as: BureauCoordinator
              captures: { hotel_id: $.data.id }
            - call: "POST /housing/hotel-blocks"
              payload: { event_id: "${event_id}", hotel_id: "${hotel_id}", contracted_rooms_per_night: 10, negotiated_nightly_rate_cents: 21900, commission_pct: 0.12, rebate_per_room_night_cents: 700, cutoff_date: "2026-08-21", reduction_rights_pct: 0.20 }
              as: BureauCoordinator
              captures: { block_id: $.data.id, block_v1: $.data.version }
            - call: "POST /housing/hotel-blocks/${block_id}/terms"
              payload: { negotiated_nightly_rate_cents: 21900, commission_pct: 0.12, rebate_per_room_night_cents: 700, cutoff_date: "2026-08-21", reduction_rights_pct: 0.20, expected_hotel_block_version: "${block_v1}" }
              as: BureauCoordinator
              captures: { block_v2: $.data.version }
            - call: "POST /housing/hotel-blocks/${block_id}/contract"
              payload: { confirmation_number: "CN-SUM26-001" }
              as: HotelManager
              as_user_id: "${hotel_id}"
              captures: { block_v3: $.data.version }
          trigger:
            - call: "POST /housing/hotel-blocks/${block_id}/sub-blocks"
              payload: { segment: "PRESS", allotted_rooms: 2, expected_hotel_block_version: "${block_v3}" }
              as: BureauCoordinator
              as_user_id: "coord-1"
          assert:
            - "response HTTP status == 422"
            - "response.data.error_id == ERR_INVALID_REQUEST"
            - "HotelBlock.${block_id}.unassigned_rooms_per_night == 10"
            - "HotelBlock.${block_id}.version == ${block_v3}"

      - name: event_end_date_before_start_date_rejects_invalid_request
        claim_type: type_constraints
        grounds:
          - validations[priority=25]
          - entities.Event.fields.event_end_date
          - errors[ERR_INVALID_REQUEST]
        distinguishing_aspect: "An event whose event_end_date 2026-09-10 precedes event_start_date 2026-09-14 returns 422 ERR_INVALID_REQUEST rather than persisting a negative night_count."
        test_recipe:
          setup: ["Empty database."]
          setup_api_calls: []
          trigger:
            - call: "POST /housing/events"
              payload: { name: "Broken Summit", code: "BRK26", event_start_date: "2026-09-14", event_end_date: "2026-09-10", cutoff_date: "2026-08-21", attrition_deadline_date: "2026-08-15", standard_commission_pct: 0.10, standard_rebate_per_room_night_cents: 500 }
              as: BureauCoordinator
          assert:
            - "response HTTP status == 422"
            - "response.data.error_id == ERR_INVALID_REQUEST"
            - "no Event row is persisted: a follow-up POST /housing/events with the same code BRK26 and a valid date range succeeds with 201 instead of ERR_EVENT_CODE_DUPLICATE"

      - name: pickup_report_is_immutable_and_versionless
        claim_type: immutability
        grounds:
          - entities.PickupReport.common_fields
          - endpoints[POST /housing/hotel-blocks/{id}/pickup-reports]
          - endpoints[GET /housing/hotel-blocks/{id}/pickup-reports]
        distinguishing_aspect: "PickupReport is declared common_fields: false, so its create response and its list rows expose no version field and §1.5 declares no PATCH or DELETE for it — the pickup ledger is append-only."
        test_recipe:
          setup: ["One CONTRACTED block; one pickup report filed by the hotel."]
          setup_api_calls:
            - call: "POST /housing/events"
              payload: { name: "Annual Summit", code: "SUM26", event_start_date: "2026-09-14", event_end_date: "2026-09-18", cutoff_date: "2026-08-21", attrition_deadline_date: "2026-08-15", standard_commission_pct: 0.10, standard_rebate_per_room_night_cents: 500 }
              as: BureauCoordinator
              captures: { event_id: $.data.id }
            - call: "POST /housing/hotels"
              payload: { name: "Grand Plaza", distance_to_venue_miles: 0.3, room_tax_pct: 0.1475, total_rooms: 400 }
              as: BureauCoordinator
              captures: { hotel_id: $.data.id }
            - call: "POST /housing/hotel-blocks"
              payload: { event_id: "${event_id}", hotel_id: "${hotel_id}", contracted_rooms_per_night: 10, negotiated_nightly_rate_cents: 21900, commission_pct: 0.12, rebate_per_room_night_cents: 700, cutoff_date: "2026-08-21", reduction_rights_pct: 0.20 }
              as: BureauCoordinator
              captures: { block_id: $.data.id, block_v1: $.data.version }
            - call: "POST /housing/hotel-blocks/${block_id}/terms"
              payload: { negotiated_nightly_rate_cents: 21900, commission_pct: 0.12, rebate_per_room_night_cents: 700, cutoff_date: "2026-08-21", reduction_rights_pct: 0.20, expected_hotel_block_version: "${block_v1}" }
              as: BureauCoordinator
              captures: { block_v2: $.data.version }
            - call: "POST /housing/hotel-blocks/${block_id}/contract"
              payload: { confirmation_number: "CN-SUM26-001" }
              as: HotelManager
              as_user_id: "${hotel_id}"
          trigger:
            - call: "POST /housing/hotel-blocks/${block_id}/pickup-reports"
              payload: { as_of_date: "2026-08-05", reported_rooms_picked_up: 3, reported_room_nights: 6, reported_gross_revenue_cents: 131400, source: "HOTEL_PORTAL" }
              as: HotelManager
              as_user_id: "${hotel_id}"
              captures: { rep1_id: $.data.id }
            - call: "GET /housing/hotel-blocks/${block_id}/pickup-reports"
              payload: {}
              as: BureauCoordinator
          assert:
            - "the create response body contains no version key"
            - "the create response body contains id and created_at"
            - "the list response contains exactly one row whose id == ${rep1_id} and reported_room_nights == 6"
            - "§1.5 declares no PATCH or DELETE route for /housing/hotel-blocks/{id}/pickup-reports or any pickup-report id"

      - name: reservation_with_unknown_sub_block_parent_not_found
        claim_type: parent_relationships
        grounds:
          - entities.Reservation.fields.sub_block_id
          - errors[ERR_SUB_BLOCK_NOT_FOUND]
          - validations[priority=30]
        distinguishing_aspect: "A reservation naming an unknown sub_block_id fails the existence rung (priority 30) with 404 ERR_SUB_BLOCK_NOT_FOUND before any eligibility or capacity rule can run."
        test_recipe:
          setup: ["One event and one attendee exist; no sub-block with the requested id exists."]
          setup_api_calls:
            - call: "POST /housing/events"
              payload: { name: "Annual Summit", code: "SUM26", event_start_date: "2026-09-14", event_end_date: "2026-09-18", cutoff_date: "2026-08-21", attrition_deadline_date: "2026-08-15", standard_commission_pct: 0.10, standard_rebate_per_room_night_cents: 500 }
              as: BureauCoordinator
              captures: { event_id: $.data.id }
            - call: "POST /housing/attendees"
              payload: { event_id: "${event_id}", email: "a1@example.com", full_name: "Attendee One", registration_id: "REG-1", attendee_type: "GENERAL" }
              as: BureauCoordinator
              captures: { att1_id: $.data.id }
          trigger:
            - call: "POST /housing/reservations"
              payload: { sub_block_id: "00000000-0000-0000-0000-000000000777", attendee_id: "${att1_id}", check_in_date: "2026-09-14", check_out_date: "2026-09-18", occupants: 1 }
              as: Attendee
              as_user_id: "${att1_id}"
          assert:
            - "response HTTP status == 404"
            - "response.data.error_id == ERR_SUB_BLOCK_NOT_FOUND"
            - "GET /housing/reservations with attendee_id=${att1_id} returns total_count == 0"

      - name: nested_carve_graph_is_navigable_from_parent_sub_block
        claim_type: graph
        grounds:
          - entities.SubBlock.fields.parent_sub_block_id
          - endpoints[GET /housing/sub-blocks]
          - validations[priority=82]
        distinguishing_aspect: "entity_topology graph: an EXHIBITOR sub-block carved with parent_sub_block_id pointing at the GENERAL carve takes its 2 rooms out of the parent's allotment (6 -> 4), leaves HotelBlock.unassigned_rooms_per_night untouched at 4, and is reachable by GET /housing/sub-blocks filtered on parent_sub_block_id."
        test_recipe:
          setup: ["One CONTRACTED block of 10 rooms with an APPROVED GENERAL carve of 6 rooms; unassigned_rooms_per_night == 4."]
          setup_api_calls:
            - call: "POST /housing/events"
