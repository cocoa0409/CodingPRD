          trigger:
            - { call: "POST /comp/exception-requests", payload: { employee_id: "${emp}", pay_band_id: "${band2}", type: "OFF_CYCLE_INCREASE", requested_salary_cents: 15697500, justification: "retention" }, as: DepartmentManager, as_user_id: "${dept}", captures: { xr: $.data.id, xr_finreq: $.data.finance_required } }
            - { call: "POST /comp/exception-requests", payload: { employee_id: "${emp}", pay_band_id: "${band2}", type: "OFF_CYCLE_INCREASE", requested_salary_cents: 15697501, justification: "over cap" }, as: DepartmentManager, as_user_id: "${dept}", captures: { err_over: $.data.error_id } }
          assert:
