              as: RecordsManager
              captures: { inc: "$.data.id" }
            - call: "POST /ig/retention-rules/${inc}/activate"
              payload: {}
              as: RecordsManager
            - call: "POST /ig/retention-rules"
              payload: { program_id: "${p}", record_class_id: "${cl}", jurisdiction_id: "${jur}", rule_code: "R-CH", retention_months: 120, trigger_basis: "EVENT_DATE", effective_from: "2020-01-01T00:00:00Z" }
              as: RecordsManager
              captures: { ch: "$.data.id" }
          trigger:
            - call: "POST /ig/retention-rules/${ch}/activate"
              payload: {}
              as: RecordsManager
              captures: { st1: "$.data.status" }
            - call: "GET /ig/retention-conflicts?challenger_rule_id=${ch}&status=OPEN"
              payload: {}
              as: RecordsManager
              captures: { c1: "$.data[0].id" }
            - call: "POST /ig/retention-rules/${ch}/withdraw"
              payload: {}
              as: RecordsManager
              captures: { st2: "$.data.status" }
            - call: "GET /ig/retention-conflicts/${c1}"
              payload: {}
              as: RecordsManager
              captures: { c1_status: "$.data.status" }
            - call: "POST /ig/retention-rules/${ch}/activate"
              payload: {}
              as: RecordsManager
              captures: { st3: "$.data.status" }
            - call: "GET /ig/retention-conflicts?challenger_rule_id=${ch}&status=OPEN"
              payload: {}
              as: RecordsManager
              captures: { c2: "$.data[0].id" }
            - call: "POST /ig/retention-conflicts/${c2}/resolve"
              payload: { strategy: "APPLY_LONGEST" }
              as: RecordsManager
              captures: { winner: "$.data.governing_rule_id", c2_status: "$.data.status" }
            - call: "GET /ig/retention-rules/${inc}"
              payload: {}
              as: RecordsManager
              captures: { inc_status: "$.data.status" }
          assert:
            - "st1 == PENDING_CONFLICT; conflict ${c1} created OPEN"
            - "st2 == DRAFT after withdraw; conflict ${c1} status == WITHDRAWN"
            - "st3 == PENDING_CONFLICT again (cycle re-entry); a NEW conflict ${c2} != ${c1} is OPEN"
            - "Resolution APPLY_LONGEST: winner == ${ch} (120 > 84); ${c2} status == RESOLVED"
            - "RetentionRule.${inc}.status == SUPERSEDED"

  - rule_id: transitive_cascade
    instances:
      - name: scope_expansion_cascade_record_to_request
        grounds:
          - state_machines.HoldScopeItem.PENDING_ISSUANCE_to_ACTIVE
          - state_machines.DispositionRequest.SUBMITTED_to_APPROVED
          - calculations.hold_coverage_reconciliation
          - errors[ERR_STALE_ELIGIBILITY_SNAPSHOT]
        distinguishing_aspect: |
          Depth-3 cascade triggered by scope expansion on an ISSUED hold:
          HoldScopeItem created ACTIVE (hop 1) -> Record.active_hold_count 0->1 with
          auto_delete_suspended flip and posture ELIGIBLE->HELD (hop 2, caused by the
          item) -> stale_item_count += 1 on the SUBMITTED DispositionRequest
          containing the record (hop 3, caused by the record mutation), which then
          blocks approval with ERR_STALE_ELIGIBILITY_SNAPSHOT.
        test_recipe:
          setup:
            - "Program; class; jurisdiction; rule EVENT_DATE 1 month ACTIVE since 2020-01-01"
            - "Records R and R2, both event 2026-06-01 -> due 2026-07-01 -> ELIGIBLE at default clock"
            - "Disposition request on [R] by rm-1, SUBMITTED with stale_item_count == 0"
            - "Legal hold H with custodian C and initial scope [R2], ISSUED (R2 now HELD; request untouched)"
          setup_api_calls:
