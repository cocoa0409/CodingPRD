            - "a second vote-certification after the first returns ERR_VOTE_ALREADY_CERTIFIED with HTTP 409"

      - name: cda_draft_revision_cycle_reenters_review_with_incremented_round
        grounds:
          - state_machines.CdaDraft
          - entities.CdaDraft.fields.revision_round
          - entities.CdaDraft.fields.status
          - entities.CdaDraft.fields.authored_by_user_id
          - entities.CdaDraft.fields.cleared_by_user_id
          - validations[priority=44]
          - errors[ERR_CDA_TABLES_INCOMPLETE]
        distinguishing_aspect: |
          CdaDraft is CYCLIC rather than parallel: DRAFTING -> IN_REVIEW -> DRAFTING is traversable repeatedly,
          each request-revision increments revision_round (0 -> 1 -> 2) while the status returns to the SAME
          earlier state, and the first review pass is blocked by ERR_CDA_TABLES_INCOMPLETE until the loop has run
          often enough to attach the required tables — proving the loop is not a one-way ladder.
        test_recipe:
          setup:
            - "MINI fixture with an APPROVED one-peer group and PayProgram P1 COMMITTEE_APPROVED (no metrics needed for the disclosure loop)."
            - "An ISS ProxyAdvisorScreen in SCREENED so that legal clearance is not blocked by the cross-entity guard."
            - "A SUMMARY_COMP_TABLE draft authored by counsel-001 with word_count 900 and required_tables_included false."
