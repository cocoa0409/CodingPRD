scaffold_corner_design:
  # =========================================================================
  # Section: entities — creation, defaults, required-fields, computed fields
  # =========================================================================
  - section: entities
    instances:
      - name: frc_event_create_minimal_returns_201
        claim_type: creation
        grounds:
          - entities.FrcEvent
        distinguishing_aspect: "Creating an FrcEvent with all required fields returns 201 and status=SETUP, posture=OPEN, counts=0."
        test_recipe:
          setup: []
          setup_api_calls:
            - { call: "POST /frc-events", payload: { event_code: "E1", event_name: "E1", season_year: 2026, start_date: "2026-04-01T08:00:00Z", end_date: "2026-04-04T18:00:00Z", team_capacity: 40, match_cycle_minutes: 7, field_count: 1, championship_slots: 2 }, as: EventDirector, captures: { ev: $.data.id } }
          trigger: []
          assert:
            - "FrcEvent.${ev}.status == SETUP"
            - "FrcEvent.${ev}.posture == OPEN"
            - "FrcEvent.${ev}.registered_team_count == 0"
            - "FrcEvent.${ev}.version == 1"

      - name: frc_event_create_missing_required_field_returns_invalid_request
        claim_type: required_field
        grounds:
          - entities.FrcEvent
        distinguishing_aspect: "Missing team_capacity triggers ERR_INVALID_REQUEST (400)."
        test_recipe:
          setup: []
          setup_api_calls: []
          trigger:
            - { call: "POST /frc-events", payload: { event_code: "E2", event_name: "E2", season_year: 2026, start_date: "2026-04-01T08:00:00Z", end_date: "2026-04-04T18:00:00Z", match_cycle_minutes: 7, field_count: 1, championship_slots: 2 }, as: EventDirector, captures: { err: $.data.error_id } }
          assert:
            - "err == ERR_INVALID_REQUEST"

      - name: team_create_duplicate_team_number_rejected
        claim_type: type_constraint
        grounds:
          - entities.Team
        distinguishing_aspect: "Same team_number within the same event triggers ERR_DUPLICATE_TEAM_NUMBER (409)."
        test_recipe:
          setup:
            - "Event in REGISTRATION_OPEN; Team with team_number=1001 already exists"
          setup_api_calls:
            - { call: "POST /frc-events", payload: { event_code: "E3", event_name: "E3", season_year: 2026, start_date: "2026-04-01T08:00:00Z", end_date: "2026-04-04T18:00:00Z", team_capacity: 40, match_cycle_minutes: 7, field_count: 1, championship_slots: 2 }, as: EventDirector, captures: { ev: $.data.id } }
            - { call: "POST /frc-events/${ev}/milestones", payload: { kind: "KICKOFF", scheduled_at: "2026-01-10T17:00:00Z", window_minutes: 0 }, as: EventDirector }
            - { call: "POST /frc-events/${ev}/open-registration", payload: {}, as: EventDirector }
            - { call: "POST /frc-events/${ev}/teams", payload: { team_number: 1001, nickname: "T1" }, as: RegistrationOfficer }
          trigger:
            - { call: "POST /frc-events/${ev}/teams", payload: { team_number: 1001, nickname: "T1-dupe" }, as: RegistrationOfficer, captures: { err: $.data.error_id } }
          assert:
            - "err == ERR_DUPLICATE_TEAM_NUMBER"

      - name: person_computed_screening_expires_at_mentor
        claim_type: computed_field
        grounds:
          - entities.Person
        distinguishing_aspect: "CLEARED MENTOR gets expires_at = approved_at + 180 days; VOLUNTEER gets +90 days."
        test_recipe:
          setup:
            - "current_utc = 2026-01-15T00:00:00Z"
          setup_api_calls:
            - { call: "POST /frc-events", payload: { event_code: "E4", event_name: "E4", season_year: 2026, start_date: "2026-04-01T08:00:00Z", end_date: "2026-04-04T18:00:00Z", team_capacity: 40, match_cycle_minutes: 7, field_count: 1, championship_slots: 2 }, as: EventDirector, captures: { ev: $.data.id } }
            - { call: "POST /_clock/set_current_utc", payload: { to_iso8601: "2026-01-15T00:00:00Z" }, as: EventDirector }
            - { call: "POST /frc-events/${ev}/persons", payload: { team_id: null, full_name: "Mentor", email: "m@x.com", role_kind: "MENTOR" }, as: RegistrationOfficer, captures: { p1: $.data.id } }
            - { call: "POST /frc-events/${ev}/persons/${p1}/screening-records", payload: { submission_channel: "FIRST_YPP", vendor_reference: "V1", submitted_at: "2026-01-15T00:00:00Z" }, as: ScreeningOfficer, captures: { r1: $.data.id } }
            - { call: "GET /frc-events/${ev}/persons/${p1}", as: ScreeningOfficer, captures: { p1_v: $.data.version } }
          trigger:
            - { call: "POST /frc-events/${ev}/persons/${p1}/screening-records/${r1}/approve", payload: { expected_person_version: "${p1_v}" }, as: ScreeningOfficer, captures: { exp: $.data.screening_expires_at } }
          assert:
            - "exp == '2026-07-14T00:00:00Z'"

      - name: get_event_by_id_returns_404_for_missing
        claim_type: not_found
        grounds:
          - entities.FrcEvent
        distinguishing_aspect: "GET on a non-existent event id returns 404 ERR_EVENT_NOT_FOUND."
        test_recipe:
          setup: []
          setup_api_calls: []
          trigger:
            - { call: "GET /frc-events/00000000-0000-0000-0000-000000000000", as: EventDirector, captures: { err: $.data.error_id } }
          assert:
            - "err == ERR_EVENT_NOT_FOUND"

  # =========================================================================
  # Section: state_machines
  # =========================================================================
  - section: state_machines
    instances:
      - name: closed_event_cannot_transition
        claim_type: invalid_transition
        grounds:
          - state_machines.FrcEvent
        distinguishing_aspect: "From CLOSED, every further transition endpoint must fail with ERR_ALREADY_TERMINAL."
        test_recipe:
          setup:
            - "Event fully closed"
          setup_api_calls:
            - { call: "POST /frc-events", payload: { event_code: "SM1", event_name: "SM1", season_year: 2026, start_date: "2026-04-01T08:00:00Z", end_date: "2026-04-04T18:00:00Z", team_capacity: 40, match_cycle_minutes: 7, field_count: 1, championship_slots: 2 }, as: EventDirector, captures: { ev: $.data.id } }
          trigger:
            - { call: "POST /frc-events/${ev}/open-registration", payload: {}, as: EventDirector, captures: { err: $.data.error_id } }
          assert:
            - "err == ERR_INVALID_STATE"

      - name: pending_person_cannot_be_approved_via_missing_record
        claim_type: invalid_transition
        grounds:
          - state_machines.Person
        distinguishing_aspect: "Person in PENDING with no ScreeningRecord: approve call hits 404 on the record."
        test_recipe:
          setup:
            - "Person p1 in PENDING"
          setup_api_calls:
            - { call: "POST /frc-events", payload: { event_code: "SM2", event_name: "SM2", season_year: 2026, start_date: "2026-04-01T08:00:00Z", end_date: "2026-04-04T18:00:00Z", team_capacity: 40, match_cycle_minutes: 7, field_count: 1, championship_slots: 2 }, as: EventDirector, captures: { ev: $.data.id } }
            - { call: "POST /frc-events/${ev}/persons", payload: { team_id: null, full_name: "P", email: "p@x.com", role_kind: "MENTOR" }, as: RegistrationOfficer, captures: { p1: $.data.id } }
          trigger:
            - { call: "GET /frc-events/${ev}/persons/${p1}", as: ScreeningOfficer, captures: { p1_v_now: $.data.version } }
            - { call: "POST /frc-events/${ev}/persons/${p1}/screening-records/00000000-0000-0000-0000-000000000000/approve", payload: { expected_person_version: "${p1_v_now}" }, as: ScreeningOfficer, captures: { err: $.data.error_id } }
          assert:
            - "err == ERR_RECORD_NOT_FOUND"

      - name: inspection_fail_creates_violation_cascade
        claim_type: side_effect_execution
        grounds:
          - state_machines.RobotInspection
        distinguishing_aspect: "Failing an inspection must create a ComplianceViolation and recompute outstanding_violation_count."
        test_recipe:
          setup:
            - "Event in INSPECTION; Team t1 CONFIRMED; RobotInspection i1 in SUBMITTED"
          setup_api_calls:
            - { call: "POST /frc-events", payload: { event_code: "SM3", event_name: "SM3", season_year: 2026, start_date: "2026-04-01T08:00:00Z", end_date: "2026-04-04T18:00:00Z", team_capacity: 40, match_cycle_minutes: 7, field_count: 1, championship_slots: 2 }, as: EventDirector, captures: { ev: $.data.id } }
          trigger:
            - { call: "POST /frc-events/${ev}/teams/${t1}/robot-inspections/${i1}/fail", payload: {}, as: LeadInspector, as_user_id: "${ia}" }
            - { call: "GET /frc-events/${ev}", as: EventDirector, captures: { ovc: $.data.outstanding_violation_count } }
          assert:
            - "RobotInspection.${i1}.status == FAILED"

      - name: match_queue_with_incomplete_slots_returns_error
        claim_type: precondition_enforcement
        grounds:
          - state_machines.Match
        distinguishing_aspect: "Queue with fewer than 6 QueueSlot rows returns ERR_INCOMPLETE_QUEUE."
        test_recipe:
          setup:
            - "Match M1 in SCHEDULED with only 4 QueueSlot rows"
          setup_api_calls:
            - { call: "POST /frc-events", payload: { event_code: "SM4", event_name: "SM4", season_year: 2026, start_date: "2026-04-01T08:00:00Z", end_date: "2026-04-04T18:00:00Z", team_capacity: 40, match_cycle_minutes: 7, field_count: 1, championship_slots: 2 }, as: EventDirector, captures: { ev: $.data.id } }
          trigger:
            - { call: "POST /frc-events/${ev}/matches/${m1}/queue", payload: {}, as: QueueManager, captures: { err: $.data.error_id } }
          assert:
            - "err == ERR_INCOMPLETE_QUEUE"

      - name: team_withdraw_terminal_lockdown
        claim_type: terminal_state_lockdown
        grounds:
          - state_machines.Team
        distinguishing_aspect: "From WITHDRAWN, no further transitions are possible."
        test_recipe:
          setup:
            - "Team t1 WITHDRAWN"
          setup_api_calls:
            - { call: "POST /frc-events", payload: { event_code: "SM5", event_name: "SM5", season_year: 2026, start_date: "2026-04-01T08:00:00Z", end_date: "2026-04-04T18:00:00Z", team_capacity: 40, match_cycle_minutes: 7, field_count: 1, championship_slots: 2 }, as: EventDirector, captures: { ev: $.data.id } }
          trigger:
            - { call: "POST /frc-events/${ev}/teams/${t1}/confirm", payload: {}, as: RegistrationOfficer, captures: { err: $.data.error_id } }
          assert:
            - "err == ERR_INVALID_STATE"

  # =========================================================================
  # Section: calculations
  # =========================================================================
  - section: calculations
    instances:
      - name: event_posture_open_when_no_violations
        claim_type: correct_result
        grounds:
          - calculations.event_posture
        distinguishing_aspect: "With zero open CRITICAL violations and all CONFIRMED teams having a CLEARED mentor, posture stays OPEN."
        test_recipe:
          setup:
            - "Event with zero open violations; one CONFIRMED team with cleared mentor"
          setup_api_calls:
            - { call: "POST /frc-events", payload: { event_code: "C1", event_name: "C1", season_year: 2026, start_date: "2026-04-01T08:00:00Z", end_date: "2026-04-04T18:00:00Z", team_capacity: 40, match_cycle_minutes: 7, field_count: 1, championship_slots: 2 }, as: EventDirector, captures: { ev: $.data.id } }
          trigger:
            - { call: "GET /frc-events/${ev}", as: EventDirector, captures: { post: $.data.posture } }
          assert:
            - "post == OPEN"

      - name: score_match_floor_at_zero
        claim_type: correct_result
        grounds:
          - calculations.score_match
        distinguishing_aspect: "gross < 0 is floored to 0."
        test_recipe:
          setup:
            - "Match M1 ON_FIELD; breakdown RED auto=0, teleop=0, endgame=0, fouls=0, tech_foul_count=20, card=RED"
            - "Breakdown BLUE all zeros"
          setup_api_calls:
            - { call: "POST /frc-events", payload: { event_code: "C2", event_name: "C2", season_year: 2026, start_date: "2026-04-01T08:00:00Z", end_date: "2026-04-04T18:00:00Z", team_capacity: 40, match_cycle_minutes: 7, field_count: 1, championship_slots: 2 }, as: EventDirector, captures: { ev: $.data.id } }
          trigger:
            - { call: "POST /frc-events/${ev}/matches/${m1}/score", payload: {}, as: Scorekeeper, captures: { rs: $.data.red_score } }
            - { call: "POST /frc-events/${ev}/matches/${m1}/finalize", payload: {}, as: HeadReferee, as_user_id: "${ia}", captures: { fs: $.data.red_score } }
          assert:
            - "rs == 0"
            - "fs == 0"

      - name: alliance_captain_seeding_uses_ranking
        claim_type: correct_result
        grounds:
          - calculations.seed_alliance_captains
        distinguishing_aspect: "Top ALLIANCE_COUNT teams by ranking_score become captains in seed order."
        test_recipe:
          setup:
            - "Event in MATCHES_RUNNING; all QUALIFICATION matches FINALIZED; 8 eligible captains"
          setup_api_calls:
            - { call: "POST /frc-events", payload: { event_code: "C3", event_name: "C3", season_year: 2026, start_date: "2026-04-01T08:00:00Z", end_date: "2026-04-04T18:00:00Z", team_capacity: 40, match_cycle_minutes: 7, field_count: 1, championship_slots: 2 }, as: EventDirector, captures: { ev: $.data.id } }
          trigger:
            - { call: "POST /frc-events/${ev}/open-alliance-selection", payload: {}, as: EventDirector }
            - { call: "GET /frc-events/${ev}/alliances", as: EventDirector }
          assert:
            - "len(Alliances) == 8"

      - name: ranking_score_excludes_replayed_matches
        claim_type: input_set_filtering
        grounds:
          - calculations.team_ranking_score
        distinguishing_aspect: "REPLAYED matches are excluded from the FINALIZED-only input set."
        test_recipe:
          setup:
            - "Team t1 with 2 FINALIZED matches and 1 REPLAYED match"
          setup_api_calls:
            - { call: "POST /frc-events", payload: { event_code: "C4", event_name: "C4", season_year: 2026, start_date: "2026-04-01T08:00:00Z", end_date: "2026-04-04T18:00:00Z", team_capacity: 40, match_cycle_minutes: 7, field_count: 1, championship_slots: 2 }, as: EventDirector, captures: { ev: $.data.id } }
          trigger:
            - { call: "GET /frc-events/${ev}/teams/${t1}", as: Scorekeeper, captures: { mp: $.data.matches_played } }
          assert:
            - "mp == 2"

  # =========================================================================
  # Section: validations
  # =========================================================================
  - section: validations
    instances:
      - name: unauthorized_role_returns_403
        claim_type: violation_to_error
        grounds:
          - validations
        distinguishing_aspect: "TeamLead attempting POST /frc-events (EventDirector-only) returns 403 ERR_UNAUTHORIZED_ROLE."
        test_recipe:
          setup: []
          setup_api_calls: []
          trigger:
            - { call: "POST /frc-events", payload: { event_code: "V2", event_name: "V2", season_year: 2026, start_date: "2026-04-01T08:00:00Z", end_date: "2026-04-04T18:00:00Z", team_capacity: 40, match_cycle_minutes: 7, field_count: 1, championship_slots: 2 }, as: TeamLead, as_user_id: "00000000-0000-0000-0000-000000000001", captures: { err: $.data.error_id } }
          assert:
            - "err == ERR_UNAUTHORIZED_ROLE"

      - name: part_order_submit_after_stop_build_returns_error
        claim_type: violation_to_error
        grounds:
          - validations
        distinguishing_aspect: "Submitting a PartOrder with current_utc > STOP_BUILD.scheduled_at returns ERR_STOP_BUILD_PASSED."
        test_recipe:
          setup:
            - "Event in BUILD_SEASON; STOP_BUILD milestone scheduled_at=2026-02-25; current_utc=2026-02-26"
            - "PartOrder o1 in DRAFT"
          setup_api_calls:
            - { call: "POST /frc-events", payload: { event_code: "V3", event_name: "V3", season_year: 2026, start_date: "2026-04-01T08:00:00Z", end_date: "2026-04-04T18:00:00Z", team_capacity: 40, match_cycle_minutes: 7, field_count: 1, championship_slots: 2 }, as: EventDirector, captures: { ev: $.data.id } }
            - { call: "POST /_clock/set_current_utc", payload: { to_iso8601: "2026-02-26T00:00:00Z" }, as: EventDirector }
          trigger:
            - { call: "POST /frc-events/${ev}/teams/${t1}/part-orders/${o1}/submit", payload: {}, as: TeamLead, as_user_id: "${p1}", captures: { err: $.data.error_id } }
          assert:
            - "err == ERR_STOP_BUILD_PASSED"

      - name: occ_stale_version_returns_412
        claim_type: violation_to_error
        grounds:
          - validations
          - concurrency_rules
        distinguishing_aspect: "Approving with a stale expected_person_version returns 412 ERR_STALE_VERSION."
        test_recipe:
          setup:
            - "Person p1 IN_REVIEW; one officer approves first, bumping version"
          setup_api_calls:
            - { call: "POST /frc-events", payload: { event_code: "V4", event_name: "V4", season_year: 2026, start_date: "2026-04-01T08:00:00Z", end_date: "2026-04-04T18:00:00Z", team_capacity: 40, match_cycle_minutes: 7, field_count: 1, championship_slots: 2 }, as: EventDirector, captures: { ev: $.data.id } }
            - { call: "POST /frc-events/${ev}/persons", payload: { team_id: null, full_name: "P", email: "p@x.com", role_kind: "MENTOR" }, as: RegistrationOfficer, captures: { p1: $.data.id } }
            - { call: "POST /frc-events/${ev}/persons/${p1}/screening-records", payload: { submission_channel: "FIRST_YPP", vendor_reference: "V1", submitted_at: "2026-01-15T00:00:00Z" }, as: ScreeningOfficer, captures: { r1: $.data.id } }
            - { call: "GET /frc-events/${ev}/persons/${p1}", as: ScreeningOfficer, captures: { p1_v: $.data.version } }
            - { call: "POST /frc-events/${ev}/persons/${p1}/screening-records/${r1}/approve", payload: { expected_person_version: "${p1_v}" }, as: ScreeningOfficer }
          trigger:
            - { call: "POST /frc-events/${ev}/persons/${p1}/screening-records/${r1}/approve", payload: { expected_person_version: "${p1_v}" }, as: ScreeningOfficer, captures: { err: $.data.error_id } }
          assert:
            - "err == ERR_STALE_VERSION"

      - name: segregation_violation_score_finalize_same_user
        claim_type: violation_to_error
        grounds:
          - validations
        distinguishing_aspect: "Same user cannot both score and finalize a match."
        test_recipe:
          setup:
            - "Match M1 SCORED by Scorekeeper with X-User-ID = sk"
          setup_api_calls:
            - { call: "POST /frc-events", payload: { event_code: "V5", event_name: "V5", season_year: 2026, start_date: "2026-04-01T08:00:00Z", end_date: "2026-04-04T18:00:00Z", team_capacity: 40, match_cycle_minutes: 7, field_count: 1, championship_slots: 2 }, as: EventDirector, captures: { ev: $.data.id } }
          trigger:
            - { call: "POST /frc-events/${ev}/matches/${m1}/finalize", payload: {}, as: HeadReferee, as_user_id: "${sk}", captures: { err: $.data.error_id } }
          assert:
            - "err == ERR_SEGREGATION_VIOLATION"

  # =========================================================================
  # Section: endpoints
  # =========================================================================
  - section: endpoints
    instances:
      - name: list_events_default_pagination
        claim_type: listing
        grounds:
          - endpoints
        distinguishing_aspect: "Default pagination limit=10; response includes data array."
        test_recipe:
          setup:
            - "Multiple events exist"
          setup_api_calls:
            - { call: "POST /frc-events", payload: { event_code: "L1", event_name: "L1", season_year: 2026, start_date: "2026-04-01T08:00:00Z", end_date: "2026-04-04T18:00:00Z", team_capacity: 40, match_cycle_minutes: 7, field_count: 1, championship_slots: 2 }, as: EventDirector }
          trigger:
            - { call: "GET /frc-events", as: EventDirector }
          assert:
            - "response is array"

      - name: computed_read_projected_ranking_shape
        claim_type: computed_read
        grounds:
          - endpoints
        distinguishing_aspect: "Projected ranking endpoint returns an inline dict, not a Team entity."
        test_recipe:
          setup:
            - "Event in MATCHES_RUNNING; Team t1 with matches"
          setup_api_calls:
            - { call: "POST /frc-events", payload: { event_code: "L2", event_name: "L2", season_year: 2026, start_date: "2026-04-01T08:00:00Z", end_date: "2026-04-04T18:00:00Z", team_capacity: 40, match_cycle_minutes: 7, field_count: 1, championship_slots: 2 }, as: EventDirector, captures: { ev: $.data.id } }
          trigger:
            - { call: "GET /frc-events/${ev}/teams/${t1}/projected-ranking", as: Scorekeeper, captures: { pm: $.data.projected_matches_played } }
          assert:
            - "pm is integer"

      - name: clock_default_is_2026_05_01
        claim_type: computed_read
        grounds:
          - endpoints
        distinguishing_aspect: "Server default clock (before any set_current_utc call) is 2026-05-01T00:00:00Z."
        test_recipe:
          setup: []
          setup_api_calls: []
          trigger:
            - { call: "POST /frc-events", payload: { event_code: "L3", event_name: "L3", season_year: 2026, start_date: "2026-04-01T08:00:00Z", end_date: "2026-04-04T18:00:00Z", team_capacity: 40, match_cycle_minutes: 7, field_count: 1, championship_slots: 2 }, as: EventDirector, captures: { ca: $.data.created_at } }
          assert:
            - "ca == '2026-05-01T00:00:00.000Z'"

  # =========================================================================
  # Section: errors
  # =========================================================================
  - section: errors
    instances:
      - name: err_robot_overweight_triggerable
        claim_type: violation_to_error
        grounds:
          - errors
        distinguishing_aspect: "Submitting inspection pass with weight_kg > 56.7 returns ERR_ROBOT_OVERWEIGHT."
        test_recipe:
          setup:
            - "Event in INSPECTION; Team t1 CONFIRMED; RobotInspection ins with weight_kg=60"
          setup_api_calls:
            - { call: "POST /frc-events", payload: { event_code: "ER1", event_name: "ER1", season_year: 2026, start_date: "2026-04-01T08:00:00Z", end_date: "2026-04-04T18:00:00Z", team_capacity: 40, match_cycle_minutes: 7, field_count: 1, championship_slots: 2 }, as: EventDirector, captures: { ev: $.data.id } }
          trigger:
            - { call: "POST /frc-events/${ev}/teams/${t1}/robot-inspections/${ins}/pass", payload: {}, as: LeadInspector, as_user_id: "${ia}", captures: { err: $.data.error_id } }
          assert:
            - "err == ERR_ROBOT_OVERWEIGHT"

      - name: err_pick_ineligible_triggerable
        claim_type: violation_to_error
        grounds:
          - errors
        distinguishing_aspect: "Picking a team that is already a captain returns ERR_PICK_INELIGIBLE."
        test_recipe:
          setup:
            - "Event in ALLIANCE_SELECTION; Team t1 already a captain"
          setup_api_calls:
            - { call: "POST /frc-events", payload: { event_code: "ER2", event_name: "ER2", season_year: 2026, start_date: "2026-04-01T08:00:00Z", end_date: "2026-04-04T18:00:00Z", team_capacity: 40, match_cycle_minutes: 7, field_count: 1, championship_slots: 2 }, as: EventDirector, captures: { ev: $.data.id } }
          trigger:
            - { call: "POST /frc-events/${ev}/alliance-selection-rounds/${rid}/pick", payload: { team_id: "${t1}", expected_round_version: "${rv}" }, as: TeamLead, as_user_id: "${p2}", captures: { err: $.data.error_id } }
          assert:
            - "err == ERR_PICK_INELIGIBLE"

      - name: err_no_grounds_disqualify
        claim_type: violation_to_error
        grounds:
          - errors
        distinguishing_aspect: "Disqualifying a team without an open CRITICAL violation returns ERR_NO_GROUNDS."
        test_recipe:
          setup:
            - "Team t1 CONFIRMED with no violations"
          setup_api_calls:
            - { call: "POST /frc-events", payload: { event_code: "ER3", event_name: "ER3", season_year: 2026, start_date: "2026-04-01T08:00:00Z", end_date: "2026-04-04T18:00:00Z", team_capacity: 40, match_cycle_minutes: 7, field_count: 1, championship_slots: 2 }, as: EventDirector, captures: { ev: $.data.id } }
          trigger:
            - { call: "POST /frc-events/${ev}/teams/${t1}/disqualify", payload: {}, as: EventDirector, captures: { err: $.data.error_id } }
          assert:
            - "err == ERR_NO_GROUNDS"

  # =========================================================================
  # Section: rbac
  # =========================================================================
  - section: rbac
    instances:
      - name: teamlead_cannot_approve_own_part_order
        claim_type: role_exclusive
        grounds:
          - roles.TeamLead
          - roles.ProcurementOfficer
        distinguishing_aspect: "TeamLead calling part-order/approve returns ERR_UNAUTHORIZED_ROLE."
        test_recipe:
          setup:
            - "Event in BUILD_SEASON; PartOrder o1 in SUBMITTED"
          setup_api_calls:
            - { call: "POST /frc-events", payload: { event_code: "RB1", event_name: "RB1", season_year: 2026, start_date: "2026-04-01T08:00:00Z", end_date: "2026-04-04T18:00:00Z", team_capacity: 40, match_cycle_minutes: 7, field_count: 1, championship_slots: 2 }, as: EventDirector, captures: { ev: $.data.id } }
          trigger:
