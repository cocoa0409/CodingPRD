              payload: { external_ref: "GD", full_name: "Grid Stu", grade_level: 10, counselor_id: "${c15}" }
              as: Administrator
              captures: { s_gd: "$.data.id" }
            - call: "POST /scheduling/course-requests"
              payload: { student_id: "${s_gd}", course_id: "${kA}", term_id: "${term12}", priority_rank: 1 }
              as: Student
              as_user_id: "${s_gd}"
              captures: { rqA: "$.data.id" }
            - call: "POST /scheduling/course-requests/${rqA}/submit"
