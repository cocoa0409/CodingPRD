  - rule_id: non_linear_state_machine
    instances:
      - name: engagement_classification_rework_cycle
        grounds:
          - state_machines.Engagement.DRAFT_to_IN_REVIEW
          - state_machines.Engagement.IN_REVIEW_to_DRAFT
          - state_machines.Engagement.IN_REVIEW_to_OPEN
        distinguishing_aspect: |
          Engagement's machine is cyclic: DRAFT -> IN_REVIEW -> DRAFT ->
          IN_REVIEW -> OPEN (two full rework loops before approval). Entity:
          Engagement — distinct from milestone_parallel_acceptance_payment_
          dimensions (Milestone).
        test_recipe:
          setup:
            - "Empty DB; logical clock default 2026-05-01"
          setup_api_calls:
            - call: "POST /v1/engagements"
              payload: { title: "Cyclic engagement", engagement_type: "REQUISITION", role_code: "SWE", skill_code: "JAVA", geo_code: "US-CA", payment_basis: "HOURLY", supervision_level: "DAILY", duration_months: 6, budget_cents: 1000000 }
              as: HiringManager
              captures: { e_id: "$.data.id" }
            - { call: "POST /v1/engagements/${e_id}/submit-review", payload: {}, as: HiringManager }
            - { call: "POST /v1/engagements/${e_id}/classification-decision", payload: { decision: "REWORK", note: "scope unclear" }, as: ProgramAdmin }
            - { call: "POST /v1/engagements/${e_id}/submit-review", payload: {}, as: HiringManager }
            - { call: "POST /v1/engagements/${e_id}/classification-decision", payload: { decision: "REWORK", note: "budget split needed" }, as: ProgramAdmin }
            - { call: "POST /v1/engagements/${e_id}/submit-review", payload: {}, as: HiringManager }
          trigger:
            - call: "POST /v1/engagements/${e_id}/classification-decision"
              payload: { decision: "APPROVE" }
              as: ProgramAdmin
              captures: { e_status: "$.data.status", e_risk: "$.data.misclassification_risk" }
          assert:
            - "Engagement.${e_id} traversed DRAFT -> IN_REVIEW -> DRAFT -> IN_REVIEW -> DRAFT -> IN_REVIEW -> OPEN without error — the rework loop is legal and repeatable"
            - "final status == OPEN and misclassification_risk == LOW (REQUISITION + HOURLY)"
            - "classification_note from the last REWORK ('budget split needed') was stored on the engagement during the loop"

      - name: milestone_parallel_acceptance_payment_dimensions
        grounds:
          - state_machines.Milestone
          - state_machines.Invoice.OPEN_to_FINALIZED
          - state_machines.Invoice.FINALIZED_to_PAID
        distinguishing_aspect: |
          Milestone carries two INDEPENDENT state dimensions on one entity:
          acceptance (PENDING -> DELIVERED -> REJECTED -> DELIVERED ->
          ACCEPTED, cyclic redelivery) x payment (UNINVOICED -> INVOICED ->
          PAID, driven by Invoice events, never by acceptance). Entity:
          Milestone — distinct from engagement_classification_rework_cycle
          (Engagement).
        test_recipe:
          setup:
            - "SOW engagement ACTIVE awarded to S1, budget 10000000; milestone M 1000000 created"
          setup_api_calls:
            - { call: "POST /v1/_clock/set_current_utc", payload: { to_iso8601: "2026-05-01T00:00:00Z" }, as: ProgramAdmin }
            - call: "POST /v1/suppliers"
              payload: { name: "Delta Delivery", supplier_code: "SUP-D1", tier: "APPROVED" }
              as: ProgramAdmin
              captures: { s1_id: "$.data.id" }
            - call: "POST /v1/engagements"
              payload: { title: "SOW app", engagement_type: "SOW", role_code: "SWE", skill_code: "JAVA", geo_code: "US-CA", payment_basis: "FIXED", supervision_level: "MILESTONE", duration_months: 9, budget_cents: 10000000 }
              as: HiringManager
              captures: { e1_id: "$.data.id" }
            - { call: "POST /v1/engagements/${e1_id}/submit-review", payload: {}, as: HiringManager }
            - { call: "POST /v1/engagements/${e1_id}/classification-decision", payload: { decision: "APPROVE" }, as: ProgramAdmin }
            - call: "POST /v1/engagements/${e1_id}/distribute"
              payload: {}
              as: ProgramAdmin
              captures: { o1_id: "$.data[0].id" }
            - { call: "POST /v1/distribution-offers/${o1_id}/respond", payload: { action: "ACCEPT" }, as: SupplierCoordinator, as_user_id: "${s1_id}" }
            - call: "POST /v1/engagements/${e1_id}/milestones"
              payload: { name: "M", amount_cents: 1000000, due_date: "2026-06-30" }
              as: HiringManager
              captures: { m_id: "$.data.id" }
            - { call: "POST /v1/milestones/${m_id}/deliver", payload: {}, as: SupplierCoordinator, as_user_id: "${s1_id}" }
            - { call: "POST /v1/milestones/${m_id}/reject", payload: { reason: "incomplete docs" }, as: HiringManager }
            - { call: "POST /v1/milestones/${m_id}/deliver", payload: { delivery_note: "v2 redelivery" }, as: SupplierCoordinator, as_user_id: "${s1_id}" }
          trigger:
            - call: "POST /v1/milestones/${m_id}/accept"
              payload: {}
              as: HiringManager
              captures: { acc1: "$.data.acceptance_status", pay1: "$.data.payment_status" }
            - call: "GET /v1/invoices"
              payload: { supplier_id: "${s1_id}" }
              as: FinanceAnalyst
              captures: { inv_id: "$.data[0].id" }
            - call: "POST /v1/invoices/${inv_id}/finalize"
              payload: {}
              as: FinanceAnalyst
              as_user_id: "fin_1"
            - call: "GET /v1/milestones/${m_id}"
              payload: {}
              as: HiringManager
              captures: { acc2: "$.data.acceptance_status", pay2: "$.data.payment_status" }
            - { call: "POST /v1/invoices/${inv_id}/mark-paid", payload: {}, as: FinanceAnalyst, as_user_id: "fin_2" }
            - call: "GET /v1/milestones/${m_id}"
              payload: {}
              as: HiringManager
              captures: { acc3: "$.data.acceptance_status", pay3: "$.data.payment_status" }
          assert:
            - "after accept: acceptance_status == ACCEPTED while payment_status == UNINVOICED — acceptance does not advance payment"
            - "after invoice finalize: payment_status == INVOICED while acceptance_status stays ACCEPTED — invoice event does not touch acceptance"
            - "after mark-paid: payment_status == PAID and acceptance_status still ACCEPTED"
            - "redelivery loop exercised: PENDING -> DELIVERED -> REJECTED -> DELIVERED before acceptance"

  - rule_id: transitive_cascade
    instances:
      - name: milestone_accept_budget_audit_supplier_counter
        grounds:
          - state_machines.Milestone.DELIVERED_to_ACCEPTED
          - calculations.committed_spend
          - entities.ComplianceAudit
          - entities.Supplier.fields.open_violation_count
        distinguishing_aspect: |
          Depth-3 linear chain from milestone accept: accept (A) recomputes
          Engagement.committed_spend_cents (B); B crossing to >= 95% of budget
          auto-creates a BUDGET_UTILIZATION ComplianceAudit (C); C's creation
          increments Supplier.open_violation_count (D). Each link is caused by
          the previous link, not by the original trigger. Different trigger
          from engagement_close_assignment_worker_chain.
        test_recipe:
          setup:
            - "SOW engagement ACTIVE awarded to S1, budget 10000000; milestone M 9500000 DELIVERED (acceptance will push utilization to exactly 95.0%)"
          setup_api_calls:
            - { call: "POST /v1/_clock/set_current_utc", payload: { to_iso8601: "2026-05-01T00:00:00Z" }, as: ProgramAdmin }
            - call: "POST /v1/suppliers"
              payload: { name: "Epsilon Works", supplier_code: "SUP-E1", tier: "APPROVED" }
              as: ProgramAdmin
              captures: { s1_id: "$.data.id" }
            - call: "POST /v1/engagements"
              payload: { title: "SOW audit chain", engagement_type: "SOW", role_code: "SWE", skill_code: "JAVA", geo_code: "US-CA", payment_basis: "FIXED", supervision_level: "MILESTONE", duration_months: 9, budget_cents: 10000000 }
              as: HiringManager
              captures: { e1_id: "$.data.id" }
            - { call: "POST /v1/engagements/${e1_id}/submit-review", payload: {}, as: HiringManager }
            - { call: "POST /v1/engagements/${e1_id}/classification-decision", payload: { decision: "APPROVE" }, as: ProgramAdmin }
            - call: "POST /v1/engagements/${e1_id}/distribute"
              payload: {}
              as: ProgramAdmin
              captures: { o1_id: "$.data[0].id" }
            - { call: "POST /v1/distribution-offers/${o1_id}/respond", payload: { action: "ACCEPT" }, as: SupplierCoordinator, as_user_id: "${s1_id}" }
            - call: "POST /v1/engagements/${e1_id}/milestones"
              payload: { name: "M95", amount_cents: 9500000, due_date: "2026-06-30" }
              as: HiringManager
              captures: { m_id: "$.data.id" }
            - { call: "POST /v1/milestones/${m_id}/deliver", payload: {}, as: SupplierCoordinator, as_user_id: "${s1_id}" }
          trigger:
            - { call: "POST /v1/milestones/${m_id}/accept", payload: {}, as: HiringManager }
            - call: "GET /v1/engagements/${e1_id}"
              payload: {}
              as: HiringManager
              captures: { e_committed: "$.data.committed_spend_cents", e_flag: "$.data.budget_audit_raised" }
            - call: "GET /v1/compliance-audits"
              payload: { engagement_id: "${e1_id}" }
              as: ProgramAdmin
              captures: { au_finding: "$.data[0].finding", au_status: "$.data[0].status", au_sev: "$.data[0].severity" }
            - call: "GET /v1/suppliers/${s1_id}"
              payload: {}
              as: ProgramAdmin
              captures: { s_viol: "$.data.open_violation_count" }
          assert:
            - "Engagement.${e1_id}.committed_spend_cents == 9500000 (link 1: accept mutated the engagement aggregate)"
            - "Engagement.${e1_id}.budget_audit_raised == true and a ComplianceAudit with finding BUDGET_UTILIZATION, severity HIGH, status OPEN exists for the engagement (link 2: the committed-spend mutation itself created the audit on crossing to exactly 95.0% — >= boundary)"
            - "Supplier.${s1_id}.open_violation_count == 1 (link 3: the audit's creation incremented the supplier counter)"
            - "audit supplier_id == ${s1_id} (derived via engagement.awarded_supplier_id)"

      - name: engagement_close_assignment_worker_chain
        grounds:
          - state_machines.Engagement.ACTIVE_to_CLOSED
          - state_machines.Assignment
          - state_machines.Worker
        distinguishing_aspect: |
          Depth-2 chain from engagement close: close (A) terminates each
          PENDING/ACTIVE Assignment (B); each termination re-evaluates its
          Worker, offboarding only workers with zero remaining open assignments
          (C) — conditional cascade per child state. Different trigger from
          milestone_accept_budget_audit_supplier_chain (close vs accept).
