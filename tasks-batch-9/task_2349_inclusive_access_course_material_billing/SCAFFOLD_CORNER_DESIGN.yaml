  - section: errors
    instances:
      - name: errors_missing_x_user_role_header_returns_unauthenticated
        claim_type: triggerability
        grounds:
          - validations[priority=10]
          - errors[ERR_UNAUTHENTICATED]
        distinguishing_aspect: |
          Identity is checked before anything else, so an absent X-User-Role, an absent X-User-ID or
          a role string that is not one of the six declared roles all return 401 ERR_UNAUTHENTICATED -
          never 403 ERR_ROLE_NOT_PERMITTED and never a body-shape error, even when the body is also
          malformed and the target id does not exist.
        test_recipe:
          setup:
            - "FA26 in PLANNING; nothing else is needed because no request in this recipe gets past the identity gate."
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { current_utc: "2026-07-05T00:00:00Z" }
              as: ProgramAdmin
            - call: "POST /terms"
              payload: { code: "FA26", name: "Fall 2026", term_start_date: "2026-08-24", term_end_date: "2026-12-11", instructional_days: 75, census_date: "2026-09-08", add_drop_deadline: "2026-09-04", late_registration_cutoff_date: "2026-09-18", adoption_deadline_date: "2026-07-15", disclosure_deadline_date: "2027-01-15", opt_out_window_days: 14 }
              as: ProgramAdmin
              captures: { term_id: $.data.id }
          trigger:
            - call: "GET /terms/${term_id}"
              as: "(request sent with no X-User-Role header)"
            - call: "GET /terms/${term_id}"
              as: ProgramAdmin
              as_user_id: "(request sent with no X-User-ID header)"
            - call: "GET /terms/${term_id}"
              as: "Bursar"
              as_user_id: "bo-1"
            - call: "POST /terms/${term_id}/open"
              as: "(request sent with no X-User-Role header)"
            - call: "POST /sections"
              payload: { term_id: "${term_id}", subject_code: "ECON", catalog_number: "101", section_number: "001", instructor_user_id: "fac-1", unknown_field: "x" }
              as: "SuperUser"
              as_user_id: "root"
          assert:
            - "Trigger call 1 -> HTTP 401 ERR_UNAUTHENTICATED (no X-User-Role)"
            - "Trigger call 2 -> HTTP 401 ERR_UNAUTHENTICATED (X-User-Role present but no X-User-ID)"
            - "Trigger call 3 -> HTTP 401 ERR_UNAUTHENTICATED, not 403: \"Bursar\" is not a declared role, so identity cannot be established at all"
            - "Trigger call 4 -> HTTP 401 ERR_UNAUTHENTICATED and AcademicTerm.${term_id}.status is still PLANNING - a rejected request mutates nothing"
            - "Trigger call 5 -> HTTP 401 ERR_UNAUTHENTICATED even though the body also carries an unknown field and a missing max_concurrent_titles default is irrelevant: priority 10 outranks priority 25, and no CourseSection row is created"
            - "GET /terms/${term_id}/sections as ProgramAdmin returns total_count == 0"

      - name: errors_unknown_body_field_returns_invalid_request
        claim_type: triggerability
        grounds:
          - validations[priority=25]
          - errors[ERR_INVALID_REQUEST]
        distinguishing_aspect: |
          Body-shape validation is strict and runs at priority 25, ahead of every foreign-key
          existence check at 32: a payload carrying an unknown field is refused with 400
          ERR_INVALID_REQUEST even when it also names a nonexistent title, and enum members and
          numeric ranges are policed by the same rule.
        test_recipe:
          setup:
