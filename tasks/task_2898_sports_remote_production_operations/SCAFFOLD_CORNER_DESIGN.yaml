      - name: meal_break_outside_the_worked_interval_rejected
        claim_type: violation_to_error
        grounds:
          - validations[priority=18]
          - errors[ERR_INVALID_TIME_WINDOW]
          - calculations.crew_call_labor_cost.variants.settled_actual
        distinguishing_aspect: |
          The release payload is checked for two things before any money is computed:
          actual_release_utc > call_time_utc, and meal_break_start_utc inside
          [call_time_utc, actual_release_utc]. A break stamped an hour before the call and a release
          stamped before the call must both raise ERR_INVALID_TIME_WINDOW and leave the call ACCEPTED;
          the legal release then settles at 63000 with zero penalty units, because a break taken 240
          minutes in is inside the 360-minute meal window.
        test_recipe:
          setup:
            - "One TIER_3 production with an ACCEPTED 10-hour call for a 9000 cents/hour STAFF member (provisional 104000)."
          setup_api_calls:
            - call: "POST /broadcast-ops/productions"
              payload: { event_tier: "TIER_3", league_code: "NBL", venue_name: "Riverside Arena", venue_power_capacity_amps: 400, venue_roof_type: "OPEN", venue_curfew_utc: "2026-08-16T06:00:00Z", scheduled_start_utc: "2026-08-15T18:00:00Z", scheduled_end_utc: "2026-08-15T22:00:00Z", labor_budget_total_cents: 2000000 }
              as: ProductionManager
              as_user_id: "pm-001"
              captures: { prod_id: $.data.id, pv1: $.data.version }
            - call: "POST /broadcast-ops/crew-members"
              payload: { full_name: "Dana Reyes", position: "TD", employment_type: "STAFF", union_local: "L600", certified_tiers: ["TIER_3"], hourly_rate_cents: 9000, home_base_code: "SEA" }
              as: ProductionManager
              as_user_id: "pm-001"
              captures: { cm1_id: $.data.id }
            - call: "POST /broadcast-ops/crew-calls"
              payload: { production_id: "${prod_id}", crew_member_id: "${cm1_id}", call_time_utc: "2026-08-15T14:00:00Z", scheduled_release_utc: "2026-08-16T00:00:00Z", expected_production_version: "${pv1}" }
              as: ProductionManager
              as_user_id: "pm-001"
              captures: { call_id: $.data.id }
            - call: "POST /broadcast-ops/crew-calls/${call_id}/respond"
              payload: { decision: "ACCEPT" }
              as: CrewMember
              as_user_id: "${cm1_id}"
              captures: { cstat: $.data.status }
          trigger:
            - call: "POST /broadcast-ops/crew-calls/${call_id}/release"
              payload: { actual_release_utc: "2026-08-15T21:00:00Z", meal_break_start_utc: "2026-08-15T13:00:00Z" }
              as: ProductionManager
              as_user_id: "pm-001"
              captures: { err1: $.data.error_id }
            - call: "POST /broadcast-ops/crew-calls/${call_id}/release"
              payload: { actual_release_utc: "2026-08-15T13:00:00Z" }
              as: ProductionManager
              as_user_id: "pm-001"
              captures: { err2: $.data.error_id }
            - call: "POST /broadcast-ops/crew-calls/${call_id}/release"
              payload: { actual_release_utc: "2026-08-15T21:00:00Z", meal_break_start_utc: "2026-08-15T18:00:00Z" }
              as: ProductionManager
              as_user_id: "pm-001"
              captures: { final_status: $.data.status, settled: $.data.settled_total_cents }
          assert:
            - "Meal break before the call time: HTTP 422 with error_id == ERR_INVALID_TIME_WINDOW"
            - "Release before the call time: HTTP 422 with error_id == ERR_INVALID_TIME_WINDOW"
            - "After both refusals CrewCall.${call_id}.status is still ACCEPTED, settled_total_cents == 0 and Production.${prod_id}.labor_committed_cents == 104000"
            - "Legal release: HTTP 200, CrewCall.${call_id}.status == RELEASED, worked 420 minutes, meal_penalty_units == 0, settled_total_cents == 63000"
            - "Production.${prod_id}.labor_committed_cents == 63000 and labor_available_cents == 1937000 (the settled figure replaces the provisional reserve)"
            - "CrewMember.${cm1_id}.lifetime_meal_penalty_units == 0"

      - name: rehearsal_window_check_precedes_the_production_stage_check
        claim_type: priority_ordering
        grounds:
          - validations[priority=18]
          - validations[priority=19]
          - errors[ERR_INVALID_TIME_WINDOW]
          - errors[ERR_PRODUCTION_STATE_INVALID]
        distinguishing_aspect: |
          On a PLANNED production, two different rehearsal payloads pick two different rungs: a start
          instant that is not strictly before the production's scheduled_start_utc trips the intra-
          request window rule at priority 18, while a legal start time falls through to the stage rule
          at priority 19 (rehearsals require PROVISIONED or REHEARSED). Evaluating the stage first
          would return ERR_PRODUCTION_STATE_INVALID for both payloads.
        test_recipe:
          setup:
            - "One PLANNED TIER_3 production starting 2026-08-15T18:00:00Z, with no survey, truck, booking or prep."
          setup_api_calls:
            - call: "POST /broadcast-ops/productions"
