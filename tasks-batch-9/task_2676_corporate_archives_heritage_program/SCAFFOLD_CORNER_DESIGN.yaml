        distinguishing_aspect: "Two distinct header defects on the same read both yield ERR_UNAUTHENTICATED (401) rather than 403: an X-User-Role value that is not one of the seven declared roles, and a request that omits X-User-ID entirely. The priority-1 authentication gate therefore precedes the priority-2 role gate."
        setup_notes: "Trigger 1 sends the literal header X-User-Role: HeritageIntern, which is deliberately not a §1.7 role. Trigger 2 sends X-User-Role: ArchivesDirector with the X-User-ID header omitted; as_user_id is therefore absent from that call on purpose."
