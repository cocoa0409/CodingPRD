            - "after the rejected attempt UpfitOrder.${uo}.chassis_id == null and UpfitOrder.${uo}.build_status == DRAFT"
            - "after the rejected attempt Chassis.${ch}.status == QUARANTINED and Chassis.${ch}.allocated_upfit_order_id == null"
            - "the re-inspection returned HTTP 200 and Chassis.${ch}.status == INSPECTED"
