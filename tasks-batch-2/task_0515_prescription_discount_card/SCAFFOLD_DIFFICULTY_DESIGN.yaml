  # =========================================================================
  # Rule 5 — Validation priority conflicts across DIFFERENT error-category pairs
  # =========================================================================
  - rule_id: priority_pair_validation_conflict
    instances:
      - name: owner_auth_beats_state_on_card_void
        grounds:
          - validations[priority=3]
          - validations[priority=5]
          - errors[ERR_NOT_RESOURCE_OWNER]
          - errors[ERR_INVALID_STATE]
        distinguishing_aspect: |
          Pair (auth/business: ERR_NOT_RESOURCE_OWNER, priority 3) vs (state:
          ERR_INVALID_STATE, priority 5): voiding an already-VOID card owned by
          another member fails both; the higher-priority owner check wins ->
          ERR_NOT_RESOURCE_OWNER (403), not ERR_INVALID_STATE.
        test_recipe:
          setup:
            - "Member A owns an ISSUED card; Member B is a different member."
            - "Card is voided once by A (now VOID). Member B then tries to void it."
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-05-15T00:00:00Z" }
              as: PlatformAdmin
            - call: "POST /drugs"
              payload: { name: "Atorvastatin", ndc: "00071015523", dosage_mg: 20, form: "TABLET", awp_cents: 10000 }
              as: PlatformAdmin
              captures: { drug_id: $.data.id }
            - call: "POST /pharmacies"
              payload: { name: "PH One", chain_code: "CVS", state_code: "CA", dispense_fee_cents: 200 }
              as: PlatformAdmin
              captures: { ph_id: $.data.id }
            - call: "POST /price-quotes"
