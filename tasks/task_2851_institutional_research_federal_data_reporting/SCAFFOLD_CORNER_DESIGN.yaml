      - name: corner_sm_screen_refuses_the_request_when_the_aggregate_is_below_minimum
        claim_type: Valid Transition
        grounds:
          - state_machines.DataRequest.RECEIVED_to_REFUSED
          - state_machines.DisclosureCell.suppression_state
          - errors[ERR_INVALID_DATA_REQUEST_STATE]
          - validations[priority=11]
        distinguishing_aspect: |
          Two cells summing to 3 against min_cell_size 5 take the REFUSED branch of screen:
          refusal_reason AGGREGATE_BELOW_MINIMUM, both cells still PENDING with null
          released_count, and REFUSED is terminal, so release and further cell writes are refused.
        test_recipe:
          setup:
            - "ReportingCycle IPEDS-2027 is FROZEN with a CERTIFIED ENROLLMENT component; clock at 2026-11-01T00:00:00Z."
            - "DataRequest R: MEDIA requester, default SMALL_CELL_SUPPRESSION, min_cell_size 5, two RACE_ETHNICITY cells of 1 and 2."
          setup_api_calls:
            - call: "POST /ir/reporting-cycles"
              payload: { cycle_code: "IPEDS-2027", collection_year: 2027, census_date: "2026-10-15", collection_deadline: "2027-02-15T23:59:59Z" }
