        test_recipe:
          setup:
            - "Center SC1 (automation 70, flex_pool_total 20) with chute C1 and an APPROVED plan for 2026-08-03 06:00-14:00 (forecast_volume 4000, core 4, budget 100000): required_headcount 4, flex_draw_count 0, planned_labor_cents 68800"
