            - call: "POST /fleet/trips/${trip_r1_id}/stops"
              payload: { sequence: 1, stop_type: "DELIVERY", store_id: "${store_s3_id}", replenishment_order_id: "${ord_3a_id}", scheduled_arrival_at: "2026-08-04T08:00:00Z", scheduled_departure_at: "2026-08-04T10:00:00Z", drive_minutes_from_prev: 105, miles_from_prev: 100, segment_loaded: true, cases: 900 }
