  # ===========================================================================
  - section: validations
    instances:

      - name: list_factories_missing_header_returns_missing_user_context
        claim_type: Violation -> Error
        grounds:
          - validations[priority=1]
          - errors.ERR_MISSING_USER_CONTEXT
        distinguishing_aspect: "Authentication precedes everything: a request without X-User-Role (or X-User-ID) returns 400 ERR_MISSING_USER_CONTEXT even when the path and body are otherwise valid."
        test_recipe:
          setup:
            - "Empty database."
          setup_api_calls: []
          trigger:
            - call: "GET /footwear/factories"
              payload: {}
              captures: { err: $.data.error_id }
            # NOTE: the unit test sends this request with X-User-ID / X-User-Role
            # headers REMOVED; the `as` field is intentionally absent and the
            # captured error envelope marks this as a negative trigger.
          assert:
            - "the response status is 400 and err == ERR_MISSING_USER_CONTEXT"
            - "the response envelope has response_type == error"

      - name: unknown_run_id_on_complete_returns_not_found
        claim_type: Priority Ordering
        grounds:
          - validations[priority=4]
          - validations[priority=5]
          - errors.ERR_RUN_NOT_FOUND
        distinguishing_aspect: "Existence (priority 4) precedes body-schema validation (priority 5): completing an unallocated run id WITHOUT the required minute fields returns 404 ERR_RUN_NOT_FOUND, not 400 ERR_INVALID_REQUEST."
        test_recipe:
          setup:
            - "Empty database (logical clock default)."
          setup_api_calls: []
          trigger:
            - call: "POST /footwear/production-runs/00000000-0000-0000-0000-000000000000/complete"
              payload: {}
              as: ProductionPlanner
              captures: { err: $.data.error_id }
          assert:
            - "the response status is 404 and err == ERR_RUN_NOT_FOUND — existence wins over the missing-payload-fields schema error"

      - name: complete_without_minutes_returns_invalid_request
        claim_type: Priority Ordering
        grounds:
          - validations[priority=5]
          - validations[priority=6]
          - errors.ERR_INVALID_REQUEST
        distinguishing_aspect: "Schema validation (priority 5) precedes state preconditions (priority 6): completing a PLANNED run with a body missing the three actual_*_minutes fields returns 400 ERR_INVALID_REQUEST, not 409 ERR_INVALID_STATE."
        test_recipe:
          setup:
            - "Logical clock 2026-09-01T00:00:00Z; standard kit; one PLANNED STOCK run."
          setup_api_calls:
            - *k_clk
            - *k_fac
            - *k_comp_t
            - *k_lot_t
            - *k_model_std
            - *k_alloc
            - *k_run_std
          trigger:
            - call: "POST /footwear/production-runs/${r_id}/complete"
              payload: {}
              as: ProductionPlanner
              captures: { err: $.data.error_id }
          assert:
            - "the response status is 400 and err == ERR_INVALID_REQUEST (missing required body fields beat the wrong-state error)"

      - name: substantiate_without_any_evidence_returns_required_evidence_missing
        claim_type: Violation -> Error
        grounds:
          - validations[priority=10]
          - errors.ERR_REQUIRED_EVIDENCE_MISSING
        distinguishing_aspect: "The referential evidence rule fires alone: report CERTIFIED at 95.00 (threshold passes) but ZERO claim-attached documents -> 422 ERR_REQUIRED_EVIDENCE_MISSING. Attaching only one of the two required doc types fails identically; both must be VERIFIED and unexpired."
        test_recipe:
          setup:
            - "The M95 95.00-fixture up to the CERTIFIED report; claim MADE_IN_USA in DRAFT; no evidence documents."
          setup_api_calls:
            - *k_clk
            - *k_fac
