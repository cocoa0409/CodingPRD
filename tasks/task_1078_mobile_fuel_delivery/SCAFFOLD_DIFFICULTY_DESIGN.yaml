  - rule_id: resource_temporal_overlap
    instances:
      - name: truck_route_halfopen_window_overlap_rejected
        grounds:
          - validations[priority=7]
          - entities.DeliveryRoute.fields.window_start
          - entities.DeliveryRoute.fields.window_end
          - errors[ERR_TRUCK_ROUTE_OVERLAP]
        distinguishing_aspect: |
          Resource FuelTruck, half-open [start,end) interval semantics with NO buffer: a second
          route [11:00,14:00) overlaps the first [08:00,12:00) on the same truck and is rejected
          (touching endpoints, e.g. start == prior end, would NOT overlap).
        test_recipe:
          setup:
            - "One truck with an existing PLANNING route [2026-05-02T08:00,12:00) in ZONE_A."
          setup_api_calls:
            - call: "POST /trucks"
              payload: { plate: "TRK-8", home_zone: "ZONE_A" }
              as: PlatformAdmin
              captures: { truck_id: $.data.id }
            - call: "POST /routes"
              payload: { truck_id: "${truck_id}", assigned_driver_id: "driver-8", zone: "ZONE_A", window_start: "2026-05-02T08:00:00Z", window_end: "2026-05-02T12:00:00Z" }
              as: Dispatcher
              captures: { route1_id: $.data.id }
          trigger:
            - call: "POST /routes"
              payload: { truck_id: "${truck_id}", assigned_driver_id: "driver-8", zone: "ZONE_A", window_start: "2026-05-02T11:00:00Z", window_end: "2026-05-02T14:00:00Z" }
              as: Dispatcher
              captures: { err: $.data.error_id }
          assert:
            - "response.data.error_id == ERR_TRUCK_ROUTE_OVERLAP"

      - name: vehicle_order_window_buffer_conflict_rejected
        grounds:
          - validations[priority=7]
          - entities.DeliveryOrder.fields.delivery_window_start
          - entities.DeliveryOrder.fields.delivery_window_end
          - errors[ERR_VEHICLE_WINDOW_CONFLICT]
        distinguishing_aspect: |
          Resource Vehicle, closed-interval + 60-minute buffer semantics (different resource AND
          different geometry from the truck half-open rule): a second order window starting only
          30 minutes after the first order's window end is inside the buffer and is rejected.
        test_recipe:
          setup:
            - "REGULAR/ZONE_A price 419 effective 2026-04-01; clock default."
            - "Individual customer, REGULAR vehicle tank 40 level 0; one SCHEDULED order window 09:00-10:00."
