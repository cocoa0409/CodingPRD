              captures: { epR: $.data.id }
            - call: "POST /media-assets"
              payload: { episode_id: "${epR}", source_filename: "r.wav", source_duration_ms: 600000 }
              as: Publisher
              as_user_id: "${pubR}"
              captures: { maR: $.data.id }
            - call: "POST /media-assets/${maR}/transcode-start"
