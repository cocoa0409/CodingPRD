      - name: dispense_lot_item_type_must_match_device_type
        claim_type: cross_reference_link
        grounds:
          - endpoints[POST /device-dispenses]
          - validations[priority 12]
          - errors.ERR_LOT_ITEM_TYPE_MISMATCH
          - errors.ERR_DEVICE_TYPE_NOT_RECOMMENDED
          - calculations.study_recommendation.constants.DEVICE_TYPE_FOR_RECOMMENDATION
        distinguishing_aspect: "A dispense links a DiagnosticStudy and a SupplyLot, and the two coherence limbs of priority 12 are separable: an ORAL_APPLIANCE device drawn from a HEARING_AID lot is ERR_LOT_ITEM_TYPE_MISMATCH, a HEARING_AID device against a study recommending ORAL_APPLIANCE is ERR_DEVICE_TYPE_NOT_RECOMMENDED, and only the matched triple creates the association."
        test_recipe:
          setup:
            - "PayerPolicy with appliance_covered true, so the priority-13 coverage rule cannot mask the priority-12 rules."
            - "One adult Patient; one SLEEP_HSAT study with ahi 20.0 performed by u_aud_1 and interpreted by u_aud_2, so recommendation is ORAL_APPLIANCE (5 <= 20 <= 30)."
            - "Two lots: HEARING_AID LOT-1018 and ORAL_APPLIANCE LOT-1019, each with 4 units."
          setup_api_calls:
            - call: "POST /payer-policies"
              payload: { payer_name: "Link Health", plan_code: "ENDD-2999", appliance_covered: true }
