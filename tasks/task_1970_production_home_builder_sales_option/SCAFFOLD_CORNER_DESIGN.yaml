  # ---------------------------------------------------------------------------
  - section: complexity_layers
    instances:
      - name: occ_stale_lot_version_on_agreement_create
        claim_type: occ_stale_version
        grounds: ["concurrency_rules[agreement-create-stale-lot]", "errors[ERR_STALE_LOT_VERSION]", "validations[priority=6]"]
        distinguishing_aspect: "The agreement create carries expected_lot_version captured at release time; the intervening reserve bumped the lot's version, so the stale create is rejected 412 while a re-read version succeeds — two strictly sequential requests, no parallelism."
        test_recipe:
          setup: ["Community SELLING; plan Maple; lot RELEASED (version captured); then reserved by Bea (version advanced)"]
          setup_api_calls:
            - { call: "POST /homebuilder/communities", payload: { name: "Cedar Ridge", incentive_budget_total_cents: 1000000 }, as: SalesDirector, captures: { c_id: $.data.id } }
            - { call: "POST /homebuilder/communities/${c_id}/open-sales", payload: {}, as: SalesDirector }
            - { call: "POST /homebuilder/plans", payload: { community_id: "${c_id}", plan_name: "Maple", base_price_cents: 35000000, elevations: [ { name: "A", price_cents: 0 }, { name: "B", price_cents: 250000 } ] }, as: SalesDirector, captures: { pl_id: $.data.id } }
            - { call: "POST /homebuilder/lots", payload: { community_id: "${c_id}", lot_number: "L-101", base_price_cents: 8000000, lot_type: "CORNER", view_adjustment_cents: 0 }, as: SalesDirector, captures: { lot_id: $.data.id } }
            - { call: "POST /homebuilder/lots/${lot_id}/release", payload: {}, as: SalesDirector, captures: { lot_v_release: $.data.version } }
            - { call: "POST /homebuilder/buyers", payload: { full_name: "Bea Buyer", email: "bea@example.com" }, as: Anonymous, captures: { b_id: $.data.id } }
            - { call: "POST /homebuilder/lots/${lot_id}/reserve", payload: { buyer_id: "${b_id}" }, as: Buyer, as_user_id: "${b_id}", captures: { lot_v_reserved: $.data.version } }
          trigger:
            - { call: "POST /homebuilder/agreements", payload: { buyer_id: "${b_id}", lot_id: "${lot_id}", plan_id: "${pl_id}", elevation_name: "B", earnest_money_deposited_cents: 500000, contingency_deadline: "2026-08-21T00:00:00Z", outside_close_date: "2027-03-01T00:00:00Z", has_sale_of_home_contingency: false, expected_lot_version: "${lot_v_release}" }, as: SalesAgent, captures: { err: $.data.error_id } }
            - { call: "POST /homebuilder/agreements", payload: { buyer_id: "${b_id}", lot_id: "${lot_id}", plan_id: "${pl_id}", elevation_name: "B", earnest_money_deposited_cents: 500000, contingency_deadline: "2026-08-21T00:00:00Z", outside_close_date: "2027-03-01T00:00:00Z", has_sale_of_home_contingency: false, expected_lot_version: "${lot_v_reserved}" }, as: SalesAgent, captures: { agr_id: $.data.id } }
          assert:
            - "Stale create (pre-reserve version): HTTP 412, error_id == ERR_STALE_LOT_VERSION, no agreement persisted"
            - "Fresh create (post-reserve version): 201, agreement DRAFT, and Lot.${lot_id}.version incremented once more by the linkage side effect"

      - name: occ_stale_agreement_version_on_clearance
        claim_type: occ_stale_version
        grounds: ["concurrency_rules[clearance-stale-agreement]", "errors[ERR_STALE_AGREEMENT_VERSION]", "validations[priority=6]"]
        distinguishing_aspect: "Contingency clearance carries expected_agreement_version from the create response; signing advanced the agreement version, so the stale clearance is rejected 412 while a clearance with the post-sign version succeeds."
        test_recipe:
          setup: ["Agreement created (version captured at create) and then signed (version advanced)"]
          setup_api_calls:
            - { call: "POST /homebuilder/communities", payload: { name: "Cedar Ridge", incentive_budget_total_cents: 1000000 }, as: SalesDirector, captures: { c_id: $.data.id } }
            - { call: "POST /homebuilder/communities/${c_id}/open-sales", payload: {}, as: SalesDirector }
            - { call: "POST /homebuilder/plans", payload: { community_id: "${c_id}", plan_name: "Maple", base_price_cents: 35000000, elevations: [ { name: "A", price_cents: 0 }, { name: "B", price_cents: 250000 } ] }, as: SalesDirector, captures: { pl_id: $.data.id } }
            - { call: "POST /homebuilder/lots", payload: { community_id: "${c_id}", lot_number: "L-101", base_price_cents: 8000000, lot_type: "CORNER", view_adjustment_cents: 0 }, as: SalesDirector, captures: { lot_id: $.data.id } }
            - { call: "POST /homebuilder/lots/${lot_id}/release", payload: {}, as: SalesDirector }
            - { call: "POST /homebuilder/buyers", payload: { full_name: "Bea Buyer", email: "bea@example.com" }, as: Anonymous, captures: { b_id: $.data.id } }
            - { call: "POST /homebuilder/lots/${lot_id}/reserve", payload: { buyer_id: "${b_id}" }, as: Buyer, as_user_id: "${b_id}", captures: { lot_v: $.data.version } }
            - { call: "POST /homebuilder/agreements", payload: { buyer_id: "${b_id}", lot_id: "${lot_id}", plan_id: "${pl_id}", elevation_name: "B", earnest_money_deposited_cents: 500000, contingency_deadline: "2026-08-21T00:00:00Z", outside_close_date: "2027-03-01T00:00:00Z", has_sale_of_home_contingency: false, expected_lot_version: "${lot_v}" }, as: SalesAgent, captures: { agr_id: $.data.id, agr_v_create: $.data.version } }
            - { call: "POST /homebuilder/agreements/${agr_id}/sign", payload: {}, as: Buyer, as_user_id: "${b_id}", captures: { agr_v_sign: $.data.version } }
          trigger:
            - { call: "POST /homebuilder/agreements/${agr_id}/contingency-clearance", payload: { contingency_type: "financing", action: "CLEARED", expected_agreement_version: "${agr_v_create}" }, as: SalesAgent, captures: { err: $.data.error_id } }
            - { call: "POST /homebuilder/agreements/${agr_id}/contingency-clearance", payload: { contingency_type: "financing", action: "CLEARED", expected_agreement_version: "${agr_v_sign}" }, as: SalesAgent, captures: { fin_st: $.data.financing_contingency_status } }
          assert:
            - "Stale clearance (create-time version): HTTP 412, error_id == ERR_STALE_AGREEMENT_VERSION; financing_contingency_status still PENDING"
            - "Fresh clearance (post-sign version): 200, financing_contingency_status == CLEARED"

      - name: hold_expiry_sweep_releases_lot_without_reprice
        claim_type: scheduled_action
        grounds: ["state_machines.Lot.RESERVED_to_RELEASED", "entities.Lot.fields.hold_expires_at"]
        distinguishing_aspect: "The clock sweep releases an expired reservation hold (RESERVED -> RELEASED) and, unlike the cancellation cascade, performs NO repricing: release_price_cents and release_count are untouched."
        test_recipe:
          setup: ["Lot L-101 RELEASED at 9991000 and reserved by Bea; clock then moved past the 72h hold"]
          setup_api_calls:
            - { call: "POST /homebuilder/communities", payload: { name: "Cedar Ridge", incentive_budget_total_cents: 1000000 }, as: SalesDirector, captures: { c_id: $.data.id } }
            - { call: "POST /homebuilder/communities/${c_id}/open-sales", payload: {}, as: SalesDirector }
            - { call: "POST /homebuilder/price-phases", payload: { community_id: "${c_id}", phase_name: "P1", uplift_pct: 0.03, effective_from: "2026-08-01T00:00:00Z", effective_to: "2026-09-01T00:00:00Z" }, as: SalesDirector }
            - { call: "POST /homebuilder/lots", payload: { community_id: "${c_id}", lot_number: "L-101", base_price_cents: 8000000, lot_type: "CORNER", view_adjustment_cents: 200000 }, as: SalesDirector, captures: { lot_id: $.data.id } }
            - { call: "POST /homebuilder/lots/${lot_id}/release", payload: {}, as: SalesDirector }
            - { call: "POST /homebuilder/buyers", payload: { full_name: "Bea Buyer", email: "bea@example.com" }, as: Anonymous, captures: { b_id: $.data.id } }
            - { call: "POST /homebuilder/lots/${lot_id}/reserve", payload: { buyer_id: "${b_id}" }, as: Buyer, as_user_id: "${b_id}" }
          trigger:
            - { call: "POST /_clock/set_current_utc", payload: { to_iso8601: "2026-08-04T00:00:01Z" }, as: PlatformAdmin }
          assert:
            - "Lot.${lot_id}.status == RELEASED (sweep released the expired hold)"
            - "Lot.${lot_id}.release_price_cents == 9991000 and release_count == 0 (no repricing on hold churn)"
            - "Lot.${lot_id}.reserved_buyer_id == null and hold_expires_at == null"

      - name: phase_status_sweep_on_clock
        claim_type: scheduled_action
        grounds: ["entities.PricePhase.fields.status", "endpoints POST /_clock/set_current_utc"]
        distinguishing_aspect: "PricePhase status is clock-derived at creation and re-derived by the sweep: a future window starts SCHEDULED, becomes ACTIVE when the clock enters [from, to), and EXPIRED once it passes."
        test_recipe:
          setup: ["Community with phase P2 window [2026-09-01, 2026-10-01) created at the default clock (SCHEDULED)"]
          setup_api_calls:
            - { call: "POST /homebuilder/communities", payload: { name: "Cedar Ridge", incentive_budget_total_cents: 1000000 }, as: SalesDirector, captures: { c_id: $.data.id } }
            - { call: "POST /homebuilder/price-phases", payload: { community_id: "${c_id}", phase_name: "P2", uplift_pct: 0.05, effective_from: "2026-09-01T00:00:00Z", effective_to: "2026-10-01T00:00:00Z" }, as: SalesDirector, captures: { p2_id: $.data.id, p2_s0: $.data.status } }
          trigger:
            - { call: "POST /_clock/set_current_utc", payload: { to_iso8601: "2026-09-15T00:00:00Z" }, as: PlatformAdmin }
            - { call: "GET /homebuilder/communities/${c_id}/price-phases", payload: {}, as: SalesAgent, captures: { p2_s1: "$.data[0].status" } }
            - { call: "POST /_clock/set_current_utc", payload: { to_iso8601: "2026-10-02T00:00:00Z" }, as: PlatformAdmin }
            - { call: "GET /homebuilder/communities/${c_id}/price-phases", payload: {}, as: SalesAgent, captures: { p2_s2: "$.data[0].status" } }
          assert:
            - "At creation (now 2026-08-01 < from): status == SCHEDULED"
            - "At 2026-09-15 (inside window): status == ACTIVE"
            - "At 2026-10-02 (>= effective_to): status == EXPIRED"

  # ---------------------------------------------------------------------------
  - section: consistency_model
    instances:
      - name: close_response_immediately_reflects_final_state
        claim_type: immediate_visibility
        grounds: ["complexity_profile.consistency_model"]
        excluded_because:
          difficulty_instance: "cross_entity_state_dependency / close_blocked_until_all_milestones_complete"
          rationale: "That instance's successful close asserts status/final_total_cents/warranty fields directly on the close response — the immediate-consistency claim."

  # ---------------------------------------------------------------------------
  - section: state_machines
    instances:
      - name: warranty_acknowledge_flow_and_replay_rejected
        claim_type: valid_transition
        grounds: ["state_machines.PurchaseAgreement.CLOSED_to_CLOSED", "entities.PurchaseAgreement.fields.warranty_status"]
        distinguishing_aspect: "After close the warranty is ENROLLED; the buyer's acknowledge flips it to ACKNOWLEDGED while status stays CLOSED, and a second acknowledge fails with ERR_AGREEMENT_INVALID_STATE (no longer ENROLLED)."
        test_recipe:
          setup: ["Fully closed agreement owned by Bea (contingencies cleared, milestones complete, close done; warranty_status ENROLLED)"]
          setup_api_calls:
            - { call: "POST /homebuilder/communities", payload: { name: "Cedar Ridge", incentive_budget_total_cents: 1000000 }, as: SalesDirector, captures: { c_id: $.data.id } }
            - { call: "POST /homebuilder/communities/${c_id}/open-sales", payload: {}, as: SalesDirector }
            - { call: "POST /homebuilder/plans", payload: { community_id: "${c_id}", plan_name: "Maple", base_price_cents: 35000000, elevations: [ { name: "A", price_cents: 0 }, { name: "B", price_cents: 250000 } ] }, as: SalesDirector, captures: { pl_id: $.data.id } }
            - { call: "POST /homebuilder/lots", payload: { community_id: "${c_id}", lot_number: "L-101", base_price_cents: 8000000, lot_type: "CORNER", view_adjustment_cents: 0 }, as: SalesDirector, captures: { lot_id: $.data.id } }
            - { call: "POST /homebuilder/lots/${lot_id}/release", payload: {}, as: SalesDirector }
            - { call: "POST /homebuilder/buyers", payload: { full_name: "Bea Buyer", email: "bea@example.com" }, as: Anonymous, captures: { b_id: $.data.id } }
            - { call: "POST /homebuilder/lots/${lot_id}/reserve", payload: { buyer_id: "${b_id}" }, as: Buyer, as_user_id: "${b_id}", captures: { lot_v: $.data.version } }
            - { call: "POST /homebuilder/agreements", payload: { buyer_id: "${b_id}", lot_id: "${lot_id}", plan_id: "${pl_id}", elevation_name: "B", earnest_money_deposited_cents: 500000, contingency_deadline: "2026-08-21T00:00:00Z", outside_close_date: "2027-03-01T00:00:00Z", has_sale_of_home_contingency: false, expected_lot_version: "${lot_v}" }, as: SalesAgent, captures: { agr_id: $.data.id } }
            - { call: "POST /homebuilder/agreements/${agr_id}/sign", payload: {}, as: Buyer, as_user_id: "${b_id}", captures: { agr_v_s: $.data.version } }
            - { call: "POST /homebuilder/agreements/${agr_id}/contingency-clearance", payload: { contingency_type: "financing", action: "CLEARED", expected_agreement_version: "${agr_v_s}" }, as: SalesAgent, captures: { agr_v_c1: $.data.version } }
            - { call: "POST /homebuilder/agreements/${agr_id}/contingency-clearance", payload: { contingency_type: "appraisal", action: "CLEARED", expected_agreement_version: "${agr_v_c1}" }, as: SalesAgent }
            - { call: "GET /homebuilder/milestones?agreement_id=${agr_id}", payload: {}, as: SalesAgent, captures: { m1: "$.data[0].id", m2: "$.data[1].id", m3: "$.data[2].id", m4: "$.data[3].id", m5: "$.data[4].id" } }
            - { call: "POST /homebuilder/milestones/${m1}/complete", payload: {}, as: ConstructionManager }
            - { call: "POST /homebuilder/milestones/${m2}/complete", payload: {}, as: ConstructionManager }
            - { call: "POST /homebuilder/milestones/${m3}/complete", payload: {}, as: ConstructionManager }
            - { call: "POST /homebuilder/milestones/${m4}/complete", payload: {}, as: ConstructionManager }
            - { call: "POST /homebuilder/milestones/${m5}/complete", payload: {}, as: ConstructionManager }
            - { call: "POST /homebuilder/agreements/${agr_id}/close", payload: {}, as: SalesAgent }
          trigger:
            - { call: "POST /homebuilder/agreements/${agr_id}/acknowledge-warranty", payload: {}, as: Buyer, as_user_id: "${b_id}", captures: { w_st: $.data.warranty_status } }
            - { call: "POST /homebuilder/agreements/${agr_id}/acknowledge-warranty", payload: {}, as: Buyer, as_user_id: "${b_id}", captures: { err: $.data.error_id } }
          assert:
            - "First acknowledge: warranty_status == ACKNOWLEDGED, agreement status stays CLOSED"
            - "Second acknowledge: error_id == ERR_AGREEMENT_INVALID_STATE (warranty no longer ENROLLED)"
