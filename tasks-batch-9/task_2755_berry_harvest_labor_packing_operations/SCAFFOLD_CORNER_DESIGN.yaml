      - name: allocation_refusals_separate_variety_lot_volume_and_commitment_capacity
        claim_type: cross_entity_validation
        grounds:
          - validations[priority=53]
          - validations[priority=62]
          - validations[priority=63]
          - errors[ERR_VARIETY_MISMATCH]
          - errors[ERR_LOT_VOLUME_EXCEEDED]
          - errors[ERR_COMMITMENT_OVERBOOKED]
        distinguishing_aspect: |
          Three allocation attempts from one 100.00 lb STRAWBERRY lot separate
          three cross-entity checks that a naive implementation collapses into a
          single "cannot allocate" error: a BLUEBERRY commitment is
          ERR_VARIETY_MISMATCH (422, priority 53, before any pounds arithmetic),
          150.00 lb against a 300.00 lb commitment is ERR_LOT_VOLUME_EXCEEDED
          (the LOT is the binding side, priority 62), and 80.00 lb against a
          60.00 lb commitment is ERR_COMMITMENT_OVERBOOKED (the COMMITMENT is the
          binding side, priority 63). No allocation row is created and neither
          the lot's nor any commitment's version moves.
        test_recipe:
          setup:
            - "Logical clock left at the 2026-08-01T00:00:00Z default."
            - "One CLEARED STRAWBERRY block with a single 40 MPN sample; one RECRUITING crew (no pickers needed); one PLANNED window over 2026-08-03."
            - "One PACKED STRAWBERRY lot of 100 grade-A clamshells at 1.00 lb, so available_lbs is 100.00."
            - "Three OPEN commitments: A STRAWBERRY 60.00 lb, B BLUEBERRY 200.00 lb, C STRAWBERRY 300.00 lb, each at version 1."
          setup_api_calls:
            - call: "POST /berry-ops/blocks"
              payload: { name: "BLK-V11", variety: "STRAWBERRY", acres: 8.00, planting_year: 2021, irrigation_source_code: "WELL-V11" }
              as: HarvestManager
              as_user_id: "hm-1"
              captures: { blk: $.data.id }
            - call: "POST /berry-ops/water-tests"
              payload: { block_id: "${blk}", sample_date: "2026-07-20", generic_ecoli_mpn: 40 }
              as: FoodSafetyOfficer
              as_user_id: "fso-1"
            - call: "POST /berry-ops/crews"
              payload: { name: "CREW-V11", labor_program: "DOMESTIC", supervisor_user_id: "sup-1", planned_head_count: 1, contract_start_date: "2026-07-01", contract_end_date: "2026-09-30" }
              as: HarvestManager
              as_user_id: "hm-1"
              captures: { crew: $.data.id }
            - call: "POST /berry-ops/harvest-windows"
              payload: { block_id: "${blk}", crew_id: "${crew}", start_at: "2026-08-03T06:00:00Z", end_at: "2026-08-03T14:00:00Z", forecast_brix: 8.5, planned_volume_lbs: 150.00, piece_rate_cents_per_clamshell: 45, clamshell_net_weight_lbs: 1.00 }
              as: HarvestManager
              as_user_id: "hm-1"
              captures: { win: $.data.id }
            - call: "POST /berry-ops/fruit-lots"
              payload: { harvest_window_id: "${win}", block_id: "${blk}", pick_date: "2026-08-03", variety: "STRAWBERRY", grade: "A", clamshell_count: 100, clamshell_net_weight_lbs: 1.00, pack_completed_at: "2026-08-03T12:00:00Z", field_pulp_temp_f: 62.0 }
              as: PackhouseOperator
              as_user_id: "pack-1"
              captures: { lot: $.data.id }
            - call: "POST /berry-ops/buyer-commitments"
              payload: { buyer_name: "Buyer A", buyer_user_id: "buyer-1", variety: "STRAWBERRY", volume_commitment_lbs: 60.00, price_cents_per_lb: 400, shelf_life_guarantee_days: 5, window_start_date: "2026-08-01", window_end_date: "2026-08-10" }
              as: SalesManager
              as_user_id: "sales-1"
              captures: { com_a: $.data.id, ver_a: $.data.version }
            - call: "POST /berry-ops/buyer-commitments"
              payload: { buyer_name: "Buyer B", buyer_user_id: "buyer-2", variety: "BLUEBERRY", volume_commitment_lbs: 200.00, price_cents_per_lb: 500, shelf_life_guarantee_days: 10, window_start_date: "2026-08-01", window_end_date: "2026-08-10" }
              as: SalesManager
