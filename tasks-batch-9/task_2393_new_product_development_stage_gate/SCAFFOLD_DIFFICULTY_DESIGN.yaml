          assert:
            - "GateReview.${gr_a_id}.status == KILLED and GateReview.${gr_a_id}.decision == KILLED"
            - "GateReview.${gr_b_id}.status == RECYCLED and GateReview.${gr_b_id}.decision == RECYCLED"
            - "GateReview.${gr_a_id}.vote_count == 2 == GateReview.${gr_b_id}.vote_count"
            - "InnovationProject.${pa_id}.dev_status == KILLED and InnovationProject.${pa_id}.recycle_count == 0"
            - "InnovationProject.${pb_id}.dev_status == SCREENED and InnovationProject.${pb_id}.recycle_count == 1"
            - "InnovationProject.${pb_id}.next_gate_number == 2, so the RECYCLED branch self-loops instead of advancing"
            - "the only difference between the two reviews is which function cast the REJECT vote"

  # ---------------------------------------------------------------- Rule 4 ---
  - rule_id: transitive_cascade
    instances:
      - name: formulation_supersede_four_level_lock_slip_cascade
        grounds:
          - state_machines.Formulation.SHELF_LIFE_CLEARED_to_SUPERSEDED
          - state_machines.LabelApproval.APPROVED_to_INVALIDATED
          - state_machines.Deliverable.APPROVED_to_PENDING
          - state_machines.InnovationProject.commercial_status.LAUNCH_LOCKED_to_LOCK_SLIPPED
          - concurrency_rules[formulation-create-stale-project]
        distinguishing_aspect: |
          Depth-4 chain fired by creating a new formulation revision: link 1 supersedes the cleared
          Formulation, link 2 invalidates the LabelApproval that described exactly that formulation,
          link 3 returns the REGULATORY_CLEARANCE Deliverable that link 2's approval had auto-approved
          to PENDING, and link 4 slips the launch lock because link 3 removed the regulatory evidence
          the lock rested on. Each link is caused only by the one before it.
        test_recipe:
          setup:
            - "Clock walked 2026-08-03 -> 2026-08-06T08:00 -> 2026-09-10T15:00."
            - "HOUSEHOLD gate 2 (required [PRELIM_BUSINESS_CASE], quorum 1) and gate 3 (required [MANUFACTURING_READINESS, SALES_SELL_IN_PLAN], quorum 1), both with zero hurdles and readiness floor 0.00."
            - "A HOUSEHOLD project carried to dev_status LAUNCH_READY and commercial_status LAUNCH_LOCKED."
            - "Its revision-1 Formulation is SHELF_LIFE_CLEARED, its LabelApproval is APPROVED, and a manually created REGULATORY_CLEARANCE Deliverable was auto-approved by that label decision."
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-08-03T00:00:00Z" }
              as: PortfolioAdmin
            - call: "POST /stage-gates"
              payload: { gate_number: 2, category: "HOUSEHOLD", stage_from: "SCREENED", stage_to: "PILOT_QUALIFIED", required_deliverable_types: ["PRELIM_BUSINESS_CASE"], quorum_size: 1, veto_functions: [], npv_hurdle_usd: 0.00, payback_months_max: 999, gross_margin_floor_pct: 0.00, readiness_floor_index: 0.00 }
              as: PortfolioAdmin
