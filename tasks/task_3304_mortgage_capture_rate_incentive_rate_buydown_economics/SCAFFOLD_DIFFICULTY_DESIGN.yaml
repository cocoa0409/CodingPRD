          - calculations.incentive_allocation_waterfall
          - state_machines.IncentiveAllocation.PENDING_to_RESERVED
        distinguishing_aspect: |
          The state pair {business_safety, business_fiscal}: when one request both lacks the
          acknowledged disclosure at priority 6 and overruns the whole incentive budget at
          priority 19, the safety error ERR_ABA_DISCLOSURE_MISSING (403) wins over the fiscal
