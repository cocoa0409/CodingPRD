            - "${prem_patched} == 87281250 with ${layer_state1} == OPEN — the update of the source rate to 7.0000 re-derives the premium end to end (loaded 7.3500 -> provisional 91875000 -> tier-2 5% discount), it does not scale the old figure"
            - "${e_frozen} == ERR_LAYER_STATE_INVALID and ${prem_frozen} == 87281250 — once the layer is IN_MARKET the derivation is frozen and the identical PATCH is refused rather than silently ignored"
            - "${alpha_committed1} == 600000000 and ${alpha_available1} == 4400000000 — the first line reconciles the market's capacity from the layer limit and the written percentage"
            - "${written1} == 60.0000 with ${layer_state2} == PARTIALLY_PLACED"
            - "${written2} == 100.0000, ${layer_state3} == FULLY_PLACED, ${bravo_committed1} == 400000000, ${bravo_available1} == 4600000000, ${prog_state1} == FIRM_ORDER and ${gwp1} == 0 — gross_written_premium_minor sums BOUND layers only, so it is still zero at firm order"
            - "${sl_bravo_state} == RELEASED with ${sl_bravo_reason} == WITHDRAWN_BY_BROKER"
            - "${written3} == 60.0000, ${layer_state4} == PARTIALLY_PLACED, ${prog_state2} == IN_MARKET and ${gwp2} == 0 — releasing one line recomputes the layer total and reverts both status dimensions in one cascade"
            - "${bravo_committed2} == 0 and ${bravo_available2} == 5000000000 — the released market's capacity is handed back in full, not decremented by an approximation"
            - "${alpha_committed2} == 600000000 and ${alpha_available2} == 4400000000 — the untouched market's derived fields do not move by a single minor unit during another market's release"
            - "${prem_after_release} == 87281250 — the frozen premium is not re-derived by the revert either"
            - "${q_bravo_state} == LAPSED, the PROVISIONAL-filtered layer lines return 1 row (total_count 1) with ${provisional_first} == ${sl_alpha}, and Bravo's RELEASED-filtered lines return 1 row with ${bravo_released_first} == ${sl_bravo} — the released line is retained as a RELEASED row rather than deleted, so the ledger still reconciles"
            - "${e_reopen} == ERR_LAYER_STATE_INVALID — a PARTIALLY_PLACED layer accepts no new market submission, so the revert is a reconciliation and not an undo"
            - "${e_relapse} == ERR_QUOTE_STATE_INVALID — and the lapsed quote cannot be firm-ordered a second time even with a freshly read layer version"

      - name: quote_listing_composes_filters_ordering_and_offset_windows_across_a_mutation
        claim_type: pagination_with_filtering
        grounds:
          - endpoints GET /quotes (market_submission_id?, layer_id?, reinsurer_id?, status?, is_lead?, limit?, offset?)
          - response_envelope.pagination_fields
          - response_envelope.pagination_defaults
          - response_envelope.collection_ordering
          - validations[priority=7] ERR_VALIDATION
        distinguishing_aspect: |
          The quote list is the busiest read in the placement: five filters, an offset window and a
          declared created_at ordering all have to compose. The corner pins the three ways that
          composition is usually broken. total_count must count the *filtered* population before
          limit/offset are applied — not the page size and not the unfiltered table. Filters must be
          conjunctive and independent of one another, so an is_lead read still returns a declined
          quote and a status read still respects the layer scope. And offset windows are positional,
          not stable: declining a quote in the middle of the QUOTED population shifts every later
          row one place towards the front, so the same offset returns different rows before and
          after the mutation — the declared behaviour, which a test must assert rather than avoid.
          The clock is advanced between quotes so the created_at ordering is total and observable.
        test_recipe:
          setup:
            - "One cedent, five reinsurers (Alpha lead-authorised), one IN_MARKET program, one CATASTROPHE layer."
            - "Five market submissions and five quotes created at five distinct logical instants, so the created_at ordering is Alpha, Bravo, Charlie, Delta, Echo."
          setup_api_calls:
