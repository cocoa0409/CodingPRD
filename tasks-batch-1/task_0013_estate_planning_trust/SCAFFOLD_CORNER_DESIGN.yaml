scaffold_corner_design:

  # ==========================================================================
  # Entities — creation, retrieval, listing, not-found, defaults, immutability
  # ==========================================================================
  - section: entities
    instances:
      - name: create_decedent_returns_201_with_system_fields
        claim_type: Creation
        grounds:
          - entities.Decedent
          - endpoints[POST /decedents]
        distinguishing_aspect: |
          POST /decedents with all required fields returns 201 and the response includes server-minted id, created_at, updated_at, version=1.
        test_recipe:
          setup:
            - "Empty DB."
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-01-01T00:00:00Z" }
              as: PlatformAdmin
          trigger:
            - call: "POST /decedents"
              payload: { full_legal_name: "Alpha One", date_of_birth: "1950-01-01T00:00:00Z", domicile_state_code: "CA", ssn_last4: "0001" }
              as: EstatePlanner
              captures: { dec_id: $.data.id, dec_version: $.data.version, dec_created_at: $.data.created_at }
          assert:
            - "dec_id is a UUID string"
            - "dec_version == 1"
            - "dec_created_at == '2026-01-01T00:00:00.000Z' or matches ISO8601 with milliseconds"

      - name: get_nonexistent_estate_returns_not_found
        claim_type: Not Found
        grounds:
          - entities.Estate
          - endpoints[GET /estates/{id}]
          - errors[ERR_NOT_FOUND]
        distinguishing_aspect: |
          GET /estates/{nonexistent-uuid} returns 404 ERR_NOT_FOUND.
        test_recipe:
          setup:
            - "Empty DB."
          setup_api_calls: []
          trigger:
            - call: "GET /estates/00000000-0000-0000-0000-000000000000"
              payload: {}
              as: EstatePlanner
              captures: { err_id: $.data.error_id }
          assert:
            - "err_id == 'ERR_NOT_FOUND'"

      - name: estate_initial_status_is_draft_default
        claim_type: Defaults
        grounds:
          - entities.Estate.fields.status
        distinguishing_aspect: |
          New Estate begins with status=DRAFT, gross_estate_value_cents=0, net_taxable_estate_cents=0 (system defaults from §1.1).
        test_recipe:
          setup:
            - "Decedent exists."
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-01-01T00:00:00Z" }
              as: PlatformAdmin
            - call: "POST /decedents"
              payload: { full_legal_name: "Beta Two", date_of_birth: "1950-01-01T00:00:00Z", domicile_state_code: "CA", ssn_last4: "0002" }
              as: EstatePlanner
              captures: { dec_id: $.data.id }
          trigger:
            - call: "POST /estates"
              payload: { decedent_id: "${dec_id}" }
              as: EstatePlanner
              captures: { est_status: $.data.status, gross: $.data.gross_estate_value_cents, net: $.data.net_taxable_estate_cents }
          assert:
            - "est_status == 'DRAFT'"
            - "gross == 0"
            - "net == 0"

      - name: list_estates_paginated_envelope
        claim_type: Listing
        grounds:
          - endpoints[GET /estates]
          - response_envelope.pagination_fields
        distinguishing_aspect: |
          GET /estates returns paginated envelope with limit, offset, total_count, has_more populated.
        test_recipe:
          setup:
            - "Three decedents and three estates exist."
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-01-01T00:00:00Z" }
              as: PlatformAdmin
            - call: "POST /decedents"
              payload: { full_legal_name: "D1", date_of_birth: "1950-01-01T00:00:00Z", domicile_state_code: "CA", ssn_last4: "0003" }
              as: EstatePlanner
              captures: { d1_id: $.data.id }
            - call: "POST /estates"
              payload: { decedent_id: "${d1_id}" }
              as: EstatePlanner
            - call: "POST /decedents"
              payload: { full_legal_name: "D2", date_of_birth: "1951-01-01T00:00:00Z", domicile_state_code: "NY", ssn_last4: "0004" }
              as: EstatePlanner
              captures: { d2_id: $.data.id }
            - call: "POST /estates"
              payload: { decedent_id: "${d2_id}" }
              as: EstatePlanner
            - call: "POST /decedents"
              payload: { full_legal_name: "D3", date_of_birth: "1952-01-01T00:00:00Z", domicile_state_code: "TX", ssn_last4: "0005" }
              as: EstatePlanner
              captures: { d3_id: $.data.id }
            - call: "POST /estates"
              payload: { decedent_id: "${d3_id}" }
              as: EstatePlanner
          trigger:
            - call: "GET /estates"
              payload: { limit: 2, offset: 0 }
              as: EstatePlanner
          assert:
            - "Response meta has api_request_id"
            - "data is an array of length 2"
            - "Pagination fields limit=2, offset=0, total_count>=3, has_more=true present"

      - name: fk_estate_decedent_id_invalid_returns_not_found
        claim_type: Parent Relationships
        grounds:
          - entities.Estate.fields.decedent_id
          - errors[ERR_NOT_FOUND]
        distinguishing_aspect: |
          POST /estates with decedent_id pointing to a non-existent decedent returns ERR_NOT_FOUND (404).
        test_recipe:
          setup:
            - "No decedents exist."
          setup_api_calls: []
          trigger:
            - call: "POST /estates"
              payload: { decedent_id: "00000000-0000-0000-0000-000000000000" }
              as: EstatePlanner
              captures: { err_id: $.data.error_id }
          assert:
            - "err_id == 'ERR_NOT_FOUND'"

  # ==========================================================================
  # State Machines — invalid transitions, terminal lockdown, initial state
  # ==========================================================================
  - section: state_machines
    instances:
      - name: terminal_estate_closed_rejects_further_transitions
        claim_type: Terminal State Lockdown
        grounds:
          - state_machines.Estate.terminal_states
          - errors[ERR_INVALID_STATE]
        distinguishing_aspect: |
          A CLOSED Estate cannot transition to CONTESTED (or any other state); the contest endpoint rejects with ERR_INVALID_STATE.
        test_recipe:
          setup:
            - "Estate fully closed (CLOSE_ESTATE order ENTERED following FINAL_DISTRIBUTION)."
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-01-01T00:00:00Z" }
              as: PlatformAdmin
            - call: "POST /decedents"
              payload: { full_legal_name: "Closed C", date_of_birth: "1950-01-01T00:00:00Z", domicile_state_code: "CA", ssn_last4: "0006" }
              as: EstatePlanner
              captures: { dec_id: $.data.id }
            - call: "POST /estates"
              payload: { decedent_id: "${dec_id}" }
              as: EstatePlanner
              captures: { est_id: $.data.id }
            - call: "POST /assets"
              payload: { estate_id: "${est_id}", category: "BANK_ACCOUNT", description: "Acct", appraised_value_cents: 100000 }
              as: EstatePlanner
            - call: "POST /beneficiary-designations"
              payload: { estate_id: "${est_id}", beneficiary_full_name: "Heir Closed", relationship: "CHILD", share_basis_points: 10000 }
              as: EstatePlanner
              captures: { ben_id: $.data.id }
            - call: "POST /executors"
              payload: { estate_id: "${est_id}", full_legal_name: "Exec Closed", role_type: "EXECUTOR", is_also_beneficiary: false }
              as: EstatePlanner
              captures: { exec_id: $.data.id }
            - call: "POST /executors/${exec_id}/accept"
              payload: {}
              as: Executor
              as_user_id: "${exec_id}"
            - call: "POST /estates/${est_id}/finalize-plan"
              payload: {}
              as: EstatePlanner
            - call: "POST /decedents/${dec_id}/register-death"
              payload: { date_of_death: "2026-01-15T00:00:00Z" }
              as: Registrar
            - call: "POST /estates/${est_id}/file-for-probate"
              payload: {}
              as: Executor
              as_user_id: "${exec_id}"
            - call: "POST /probate-orders"
              payload: { estate_id: "${est_id}", order_type: "OPEN_PROBATE", judge_user_id: "judge-1" }
              as: Judge
              captures: { open_order_id: $.data.id }
            - call: "POST /probate-orders/${open_order_id}/enter"
              payload: {}
              as: Judge
            - call: "POST /probate-orders"
              payload: { estate_id: "${est_id}", order_type: "APPROVE_INVENTORY", judge_user_id: "judge-1" }
              as: Judge
              captures: { approve_order_id: $.data.id }
            - call: "POST /probate-orders/${approve_order_id}/enter"
              payload: {}
              as: Judge
            - call: "POST /probate-orders"
              payload: { estate_id: "${est_id}", order_type: "FINAL_DISTRIBUTION", judge_user_id: "judge-1" }
              as: Judge
              captures: { final_order_id: $.data.id }
            - call: "POST /probate-orders/${final_order_id}/enter"
              payload: {}
              as: Judge
            - call: "POST /probate-orders"
              payload: { estate_id: "${est_id}", order_type: "CLOSE_ESTATE", judge_user_id: "judge-1" }
              as: Judge
              captures: { close_order_id: $.data.id }
            - call: "POST /probate-orders/${close_order_id}/enter"
              payload: {}
              as: Judge
            - call: "GET /estates/${est_id}"
              payload: {}
              as: Executor
              as_user_id: "${exec_id}"
              captures: { est_v: $.data.version, est_status: $.data.status }
          trigger:
            - call: "POST /estates/${est_id}/contest"
              payload: { expected_estate_version: "${est_v}", reason: "post-close" }
              as: Beneficiary
              as_user_id: "${ben_id}"
              captures: { err_id: $.data.error_id }
          assert:
            - "est_status == 'CLOSED'"
            - "err_id == 'ERR_INVALID_STATE'"

      - name: executor_decline_from_accepted_invalid_state
        claim_type: Invalid Transitions
        grounds:
          - state_machines.Executor
          - errors[ERR_INVALID_STATE]
        distinguishing_aspect: |
          An Executor already in ACCEPTED state cannot decline; POST /executors/{id}/decline returns ERR_INVALID_STATE.
        test_recipe:
          setup:
            - "Executor accepted on an estate in DRAFT."
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-01-01T00:00:00Z" }
              as: PlatformAdmin
            - call: "POST /decedents"
              payload: { full_legal_name: "Dora D", date_of_birth: "1950-01-01T00:00:00Z", domicile_state_code: "NY", ssn_last4: "0007" }
              as: EstatePlanner
              captures: { dec_id: $.data.id }
            - call: "POST /estates"
              payload: { decedent_id: "${dec_id}" }
              as: EstatePlanner
              captures: { est_id: $.data.id }
            - call: "POST /executors"
              payload: { estate_id: "${est_id}", full_legal_name: "Exec D", role_type: "EXECUTOR", is_also_beneficiary: false }
              as: EstatePlanner
              captures: { exec_id: $.data.id }
            - call: "POST /executors/${exec_id}/accept"
              payload: {}
              as: Executor
              as_user_id: "${exec_id}"
          trigger:
            - call: "POST /executors/${exec_id}/decline"
              payload: {}
              as: Executor
              as_user_id: "${exec_id}"
              captures: { err_id: $.data.error_id }
          assert:
            - "err_id == 'ERR_INVALID_STATE'"

      - name: contest_estate_stale_version_excluded
        claim_type: invalid_transition
        grounds:
          - concurrency_rules[contest-estate-stale-version]
        excluded_because:
          difficulty_instance: non_linear_state_machine / estate_contested_cycle_back_to_probate_open
          rationale: "OCC stale-version path on /estates/{id}/contest is covered indirectly via the cycle instance; an explicit stale-version test is also added below under cross_cutting_layers."

  # ==========================================================================
  # Calculations — input set filtering, constants, precision
  # ==========================================================================
  - section: calculations
    instances:
      - name: gross_excludes_draft_assets_before_finalize
        claim_type: Input Set Filtering
        grounds:
          - calculations.gross_estate_value
          - entities.Asset.fields.status
        distinguishing_aspect: |
          Pre-finalize, all assets are DRAFT; gross_estate_value_cents == 0 even with assets attached.
        test_recipe:
          setup:
            - "Estate in DRAFT with two DRAFT assets at 200000 and 300000 cents."
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-01-01T00:00:00Z" }
              as: PlatformAdmin
            - call: "POST /decedents"
              payload: { full_legal_name: "Eli E", date_of_birth: "1950-01-01T00:00:00Z", domicile_state_code: "CA", ssn_last4: "0008" }
              as: EstatePlanner
              captures: { dec_id: $.data.id }
            - call: "POST /estates"
              payload: { decedent_id: "${dec_id}" }
              as: EstatePlanner
              captures: { est_id: $.data.id }
            - call: "POST /assets"
              payload: { estate_id: "${est_id}", category: "BANK_ACCOUNT", description: "A1", appraised_value_cents: 200000 }
              as: EstatePlanner
            - call: "POST /assets"
              payload: { estate_id: "${est_id}", category: "BANK_ACCOUNT", description: "A2", appraised_value_cents: 300000 }
              as: EstatePlanner
          trigger:
            - call: "GET /estates/${est_id}"
              payload: {}
              as: EstatePlanner
              captures: { gross: $.data.gross_estate_value_cents }
          assert:
            - "gross == 0"

      - name: net_taxable_floors_at_zero
        claim_type: Precision
        grounds:
          - calculations.net_taxable_estate
        distinguishing_aspect: |
          When allowed_claims_total > gross, net_taxable_estate_cents = max(0, ...) returns 0, never negative.
        test_recipe:
          setup:
            - "Estate ADMINISTRATION with gross=100000 cents and one ALLOWED claim of 500000 cents."
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-01-01T00:00:00Z" }
              as: PlatformAdmin
            - call: "POST /decedents"
              payload: { full_legal_name: "Fox F", date_of_birth: "1950-01-01T00:00:00Z", domicile_state_code: "NY", ssn_last4: "0009" }
              as: EstatePlanner
              captures: { dec_id: $.data.id }
            - call: "POST /estates"
              payload: { decedent_id: "${dec_id}" }
              as: EstatePlanner
              captures: { est_id: $.data.id }
            - call: "POST /assets"
              payload: { estate_id: "${est_id}", category: "BANK_ACCOUNT", description: "Acct", appraised_value_cents: 100000 }
              as: EstatePlanner
            - call: "POST /beneficiary-designations"
              payload: { estate_id: "${est_id}", beneficiary_full_name: "Heir F", relationship: "CHILD", share_basis_points: 10000 }
              as: EstatePlanner
            - call: "POST /executors"
              payload: { estate_id: "${est_id}", full_legal_name: "Exec F", role_type: "EXECUTOR", is_also_beneficiary: false }
              as: EstatePlanner
              captures: { exec_id: $.data.id }
            - call: "POST /executors/${exec_id}/accept"
              payload: {}
              as: Executor
              as_user_id: "${exec_id}"
            - call: "POST /estates/${est_id}/finalize-plan"
              payload: {}
              as: EstatePlanner
            - call: "POST /decedents/${dec_id}/register-death"
              payload: { date_of_death: "2026-01-15T00:00:00Z" }
              as: Registrar
            - call: "POST /estates/${est_id}/file-for-probate"
              payload: {}
              as: Executor
              as_user_id: "${exec_id}"
            - call: "POST /probate-orders"
              payload: { estate_id: "${est_id}", order_type: "OPEN_PROBATE", judge_user_id: "judge-1" }
              as: Judge
              captures: { open_order_id: $.data.id }
            - call: "POST /probate-orders/${open_order_id}/enter"
              payload: {}
              as: Judge
            - call: "POST /probate-orders"
              payload: { estate_id: "${est_id}", order_type: "APPROVE_INVENTORY", judge_user_id: "judge-1" }
              as: Judge
              captures: { approve_order_id: $.data.id }
            - call: "POST /probate-orders/${approve_order_id}/enter"
              payload: {}
              as: Judge
            - call: "POST /creditor-claims"
              payload: { estate_id: "${est_id}", creditor_name: "BigDebt", amount_cents: 500000, claim_class: "UNSECURED", filed_at: "2026-02-01T00:00:00Z" }
              as: Creditor
              captures: { claim_id: $.data.id }
            - call: "POST /creditor-claims/${claim_id}/allow"
              payload: {}
              as: Executor
              as_user_id: "${exec_id}"
          trigger:
            - call: "GET /estates/${est_id}/net-taxable-summary"
              payload: {}
              as: Executor
              as_user_id: "${exec_id}"
              captures: { net: $.data.net_taxable_estate_cents }
          assert:
            - "net == 0"

      - name: intestacy_excluded_by_difficulty
        claim_type: Correct Result
        grounds:
          - calculations.intestacy_share_allocation
        excluded_because:
          difficulty_instance: combinatorial_formula / intestacy_remainder_rounding_pinned_order
          rationale: "Intestacy calculation's pinned-order remainder distribution is fully exercised in the named §1.8 instance."

  # ==========================================================================
  # Validations — violation→error, satisfaction→pass
  # ==========================================================================
  - section: validations
    instances:
      - name: missing_required_field_returns_invalid_request
        claim_type: Violation → Error
        grounds:
          - errors[ERR_INVALID_REQUEST]
          - endpoints[POST /decedents]
        distinguishing_aspect: |
          POST /decedents with date_of_birth missing returns ERR_INVALID_REQUEST (400).
        test_recipe:
          setup:
            - "Empty DB."
          setup_api_calls: []
          trigger:
            - call: "POST /decedents"
              payload: { full_legal_name: "Missing DOB", domicile_state_code: "CA", ssn_last4: "0010" }
              as: EstatePlanner
              captures: { err_id: $.data.error_id }
          assert:
            - "err_id == 'ERR_INVALID_REQUEST'"

      - name: share_overallocation_on_activate
        claim_type: Violation → Error
        grounds:
          - validations[priority=9]
          - errors[ERR_SHARE_OVERALLOCATION]
        distinguishing_aspect: |
          Activating a designation whose share would push total ACTIVE bp above 10000 returns ERR_SHARE_OVERALLOCATION.
        test_recipe:
          setup:
            - "Estate DRAFT with one ACTIVE designation share=7000 and a DRAFT designation share=4000."
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-01-01T00:00:00Z" }
              as: PlatformAdmin
            - call: "POST /decedents"
              payload: { full_legal_name: "Grace G", date_of_birth: "1950-01-01T00:00:00Z", domicile_state_code: "CA", ssn_last4: "0011" }
              as: EstatePlanner
              captures: { dec_id: $.data.id }
            - call: "POST /estates"
              payload: { decedent_id: "${dec_id}" }
              as: EstatePlanner
              captures: { est_id: $.data.id }
            - call: "POST /beneficiary-designations"
              payload: { estate_id: "${est_id}", beneficiary_full_name: "B1", relationship: "CHILD", share_basis_points: 7000 }
              as: EstatePlanner
              captures: { b1_id: $.data.id }
            - call: "POST /beneficiary-designations/${b1_id}/activate"
              payload: {}
              as: EstatePlanner
            - call: "POST /beneficiary-designations"
              payload: { estate_id: "${est_id}", beneficiary_full_name: "B2", relationship: "CHILD", share_basis_points: 4000 }
              as: EstatePlanner
              captures: { b2_id: $.data.id }
          trigger:
            - call: "POST /beneficiary-designations/${b2_id}/activate"
              payload: {}
              as: EstatePlanner
              captures: { err_id: $.data.error_id }
          assert:
            - "err_id == 'ERR_SHARE_OVERALLOCATION'"

      - name: hipaa_recipients_required
        claim_type: Violation → Error
        grounds:
          - validations[priority=15]
          - errors[ERR_HIPAA_RECIPIENTS_REQUIRED]
        distinguishing_aspect: |
          Activating a HIPAA_AUTHORIZATION directive with empty hipaa_authorized_recipients returns ERR_HIPAA_RECIPIENTS_REQUIRED.
        test_recipe:
          setup:
            - "HIPAA_AUTHORIZATION directive in WITNESSED state with hipaa_authorized_recipients=[]."
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-01-01T00:00:00Z" }
              as: PlatformAdmin
            - call: "POST /decedents"
              payload: { full_legal_name: "Hank H", date_of_birth: "1950-01-01T00:00:00Z", domicile_state_code: "NY", ssn_last4: "0012" }
              as: EstatePlanner
              captures: { dec_id: $.data.id }
            - call: "POST /directives"
              payload: { decedent_id: "${dec_id}", directive_type: "HIPAA_AUTHORIZATION", hipaa_authorized_recipients: [] }
              as: EstatePlanner
              captures: { dir_id: $.data.id }
            - call: "POST /directives/${dir_id}/witness"
              payload: {}
              as: EstatePlanner
          trigger:
            - call: "POST /directives/${dir_id}/activate"
              payload: {}
              as: EstatePlanner
              captures: { err_id: $.data.error_id }
          assert:
            - "err_id == 'ERR_HIPAA_RECIPIENTS_REQUIRED'"

      - name: duplicate_executor_active_blocked
        claim_type: Violation → Error
        grounds:
          - validations[priority=13]
          - errors[ERR_DUPLICATE_EXECUTOR_ACTIVE]
        distinguishing_aspect: |
          A second Executor (role_type=EXECUTOR) cannot accept while another is already ACCEPTED on the same estate.
        test_recipe:
          setup:
            - "One Executor accepted; a second Executor (NOMINATED) exists on the same estate."
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-01-01T00:00:00Z" }
              as: PlatformAdmin
            - call: "POST /decedents"
              payload: { full_legal_name: "Iris I", date_of_birth: "1950-01-01T00:00:00Z", domicile_state_code: "FL", ssn_last4: "0013" }
              as: EstatePlanner
              captures: { dec_id: $.data.id }
            - call: "POST /estates"
              payload: { decedent_id: "${dec_id}" }
              as: EstatePlanner
              captures: { est_id: $.data.id }
            - call: "POST /executors"
              payload: { estate_id: "${est_id}", full_legal_name: "Exec I1", role_type: "EXECUTOR", is_also_beneficiary: false }
              as: EstatePlanner
              captures: { e1_id: $.data.id }
            - call: "POST /executors/${e1_id}/accept"
              payload: {}
              as: Executor
              as_user_id: "${e1_id}"
            - call: "POST /executors"
              payload: { estate_id: "${est_id}", full_legal_name: "Exec I2", role_type: "EXECUTOR", is_also_beneficiary: false }
              as: EstatePlanner
              captures: { e2_id: $.data.id }
          trigger:
            - call: "POST /executors/${e2_id}/accept"
              payload: {}
              as: Executor
              as_user_id: "${e2_id}"
              captures: { err_id: $.data.error_id }
          assert:
            - "err_id == 'ERR_DUPLICATE_EXECUTOR_ACTIVE'"

      - name: contingent_parent_invalid_cross_estate
        claim_type: Violation → Error
        grounds:
          - validations[priority=7]
          - errors[ERR_CONTINGENT_PARENT_INVALID]
        distinguishing_aspect: |
          A BeneficiaryDesignation create with contingent_of_designation_id pointing to a designation on a DIFFERENT estate returns ERR_CONTINGENT_PARENT_INVALID.
        test_recipe:
          setup:
            - "Two estates; one has a BeneficiaryDesignation B-other in ACTIVE."
