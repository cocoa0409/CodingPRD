      - name: void_window_closes_after_fifteen_minutes
        claim_type: violation_to_error
        grounds:
          - errors.ERR_VOID_WINDOW_CLOSED
          - state_machines.ImmunotherapyDose.ADMINISTERED_to_VOIDED
          - calculations.immunotherapy_vial_volume_ledger
          - entities.Patient.fields.last_dose_administered_at
        distinguishing_aspect: "The void window is inclusive at 15 minutes and closed at 16: the same void call on structurally identical doses succeeds at exactly VOID_WINDOW_MINUTES and is rejected one minute later, and the successful void restores both the vial volume and the patient's null last_dose_administered_at."
        test_recipe:
          setup:
            - "PayerPolicy with defaults; one low-risk adult Patient; one ALLERGEN_CONCENTRATE lot; one BLUE_1_100 vial with the default 5.00 mL, label-verified by a second nurse."
            - "Dose 1 is administered at 2026-08-01T00:00:00Z and voided at exactly 00:15, which leaves the escalation step at 1 and the gap clock reset, so dose 2 is also a 0.05 mL step-1 dose."
          setup_api_calls:
            - call: "POST /payer-policies"
              payload: { payer_name: "Void Health", plan_code: "ERRD-2999" }
              as: PracticeAdmin
              captures: { pol_id: $.data.id }
            - call: "POST /patients"
              payload: { payer_policy_id: "${pol_id}", mrn: "MRN-10238", full_name: "Tomas Kirchner", date_of_birth: "1966-06-06", epinephrine_on_file: true }
              as: PracticeAdmin
              captures: { pat_id: $.data.id, pat_v: $.data.version }
            - call: "POST /supply-lots"
              payload: { item_type: "ALLERGEN_CONCENTRATE", lot_number: "LOT-1023", quantity_received: 4, expires_at: "2027-06-01T00:00:00Z" }
              as: PracticeAdmin
              captures: { lot_id: $.data.id }
            - call: "POST /immunotherapy-vials"
              payload: { patient_id: "${pat_id}", supply_lot_id: "${lot_id}", dilution_code: "BLUE_1_100", label_text: "MRN-10238|BLUE_1_100|2026-12-01", expires_at: "2026-12-01T00:00:00Z", expected_patient_version: "${pat_v}" }
              as: AllergyNurse
              as_user_id: "u_nurse_1"
              captures: { vial_id: $.data.id }
            - call: "POST /immunotherapy-vials/${vial_id}/label-verification"
              payload: { label_text_confirmation: "MRN-10238|BLUE_1_100|2026-12-01" }
              as: AllergyNurse
              as_user_id: "u_nurse_2"
            - call: "POST /immunotherapy-doses"
              payload: { immunotherapy_vial_id: "${vial_id}" }
              as: AllergyNurse
              as_user_id: "u_nurse_1"
              captures: { d1: $.data.id }
          trigger:
            - call: "POST /_clock/set_current_utc"
              payload: { current_utc: "2026-08-01T00:15:00Z" }
              as: PracticeAdmin
            - call: "POST /immunotherapy-doses/${d1}/void"
              payload: { void_reason: "WRONG_VIAL" }
              as: AllergyNurse
              as_user_id: "u_nurse_1"
            - call: "POST /immunotherapy-doses"
              payload: { immunotherapy_vial_id: "${vial_id}" }
              as: AllergyNurse
              as_user_id: "u_nurse_1"
              captures: { d2: $.data.id, v2: $.data.volume_ml, gap2: $.data.gap_days_at_dose }
            - call: "POST /_clock/set_current_utc"
              payload: { current_utc: "2026-08-01T00:31:00Z" }
              as: PracticeAdmin
            - call: "POST /immunotherapy-doses/${d2}/void"
              payload: { void_reason: "WRONG_VIAL" }
              as: AllergyNurse
              as_user_id: "u_nurse_1"
          assert:
            - "The void at exactly 00:15 returns HTTP 200 with status == \"VOIDED\" — the boundary is inclusive because the rule fires only above 15 minutes"
            - "After that void ImmunotherapyVial.${vial_id}.volume_ml_remaining == 5.00, volume_ml_dispensed_total == 0.00 and status == \"LABEL_VERIFIED\" or \"IN_USE\" per the declared ledger — the identity 5.00 == 5.00 + 0.00 + 0.00 holds"
            - "Patient.${pat_id}.last_dose_administered_at == null and immunotherapy_escalation_step == 1 — a void neither advances nor rolls back the schedule"
            - "${v2} == 0.05 and ${gap2} == 0 — dose 2 is another step-1 dose because the voided dose left no trace on the gap clock"
            - "The void at 00:31 returns HTTP 409 with error.id == \"ERR_VOID_WINDOW_CLOSED\" — 16 minutes have elapsed since dose 2's administered_at of 00:15"
            - "ImmunotherapyDose.${d2}.status is still \"ADMINISTERED\" and ImmunotherapyVial.${vial_id}.volume_ml_remaining == 4.95 — the rejected void moved nothing back"

      - name: adjustment_limit_reached_on_the_fourth_adjustment
        claim_type: violation_to_error
        grounds:
          - errors.ERR_ADJUSTMENT_LIMIT_REACHED
          - endpoints[POST /device-dispenses/{dispenseId}/adjustments]
          - entities.DeviceDispense.fields.adjustment_count
        distinguishing_aspect: "The ceiling is a count, not a state: three adjustments are accepted and increment adjustment_count 1, 2, 3 without leaving fit_status FITTED, and only the fourth is rejected — so the error is ERR_ADJUSTMENT_LIMIT_REACHED and not ERR_DISPENSE_STATE_INVALID."
        test_recipe:
          setup:
            - "PayerPolicy with defaults; one adult Patient; one INTERPRETED AUDIOMETRY study with pta_db_hl 65.0, so recommendation is HEARING_AID; one HEARING_AID lot; one dispense of HA400006."
