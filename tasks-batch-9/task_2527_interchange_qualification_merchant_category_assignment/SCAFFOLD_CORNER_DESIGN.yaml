              captures: { acq_id: $.data.id }
            - call: "POST /mcc-definitions"
              payload: { mcc_code: "5411", description: "Grocery Stores", business_type_key: "GROCERY", program_eligibility: ["SMALL_TICKET"], requires_documentation: false, high_risk: false }
              as: NetworkAdmin
            - call: "POST /rate-programs"
              payload: { program_code: "STANDARD_FALLBACK", name: "Standard", category: "STANDARD", eligible_mcc_codes: ["5411"], base_rate_bps: 254, per_item_fee_cents: 10, requires_data_elements: [], max_clearing_delay_hours: 720 }
              as: NetworkAdmin
              captures: { rp_id: $.data.id }
            - call: "POST /rate-programs/${rp_id}/versions"
              payload: { publication_quarter: "2026Q4", effective_from: "2026-10-01T00:00:00Z", effective_to: "2027-01-01T00:00:00Z", base_rate_bps: 260, per_item_fee_cents: 10, implementation_deadline: "2026-09-30T00:00:00Z" }
              as: NetworkAdmin
              captures: { ver_id: $.data.id }
            - call: "POST /rate-program-versions/${ver_id}/publish"
              payload: {}
              as: NetworkAdmin
              captures: { ver_status: $.data.status }
            - call: "POST /implementation-windows"
