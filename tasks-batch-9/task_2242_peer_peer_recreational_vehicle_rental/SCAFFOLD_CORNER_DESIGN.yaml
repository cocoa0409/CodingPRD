      - name: four_valid_inspection_photos_still_fail_the_collective_gate
        claim_type: aggregate_validation
        grounds:
          - validations[priority 28]
          - errors[ERR_INSPECTION_PHOTOS_INCOMPLETE]
          - entities.Listing.fields.inspection_photo_zone_count
        distinguishing_aspect: >-
          Every individual document is valid — three VERIFIED statutory documents
          and four accepted INSPECTION_PHOTO uploads — yet the aggregate is one
          zone short of MIN_INSPECTION_PHOTO_ZONES (5), so submit-for-review
          returns 422 ERR_INSPECTION_PHOTOS_INCOMPLETE and the listing stays
          DRAFT with inspection_photo_zone_count 4 (not the 4-of-5 that
          MIN_TRIP_PHOTO_ZONES would accept during a trip).
        test_recipe:
          setup: >-
            Owner with a second listing carrying VERIFIED TITLE, REGISTRATION and
            INSURANCE_POLICY documents and INSPECTION_PHOTO uploads for
            EXTERIOR_FRONT, EXTERIOR_REAR, INTERIOR and ROOF only — UNDERCARRIAGE
            is missing.
