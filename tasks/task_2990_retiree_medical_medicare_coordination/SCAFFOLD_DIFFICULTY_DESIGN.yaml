      - name: plan_change_notice_lead_time_buffer_separation
        grounds:
          - calculations.plan_change_notice_lead_time
          - errors.ERR_NOTICE_LEAD_TIME_INSUFFICIENT
          - validations[priority=38]
          - entities.PlanOption.fields.change_notice_issued_at
        distinguishing_aspect: |
          The third temporal shape is BUFFER separation rather than interval
          overlap: the constraint is a minimum whole-day distance between the
          logical clock and a future effective_date, with no second interval
          involved at all. notice_lead_days is 60 and the clock is
          2026-10-20T00:00:00Z, so 2026-12-18 is 59 days out and rejected while
          2026-12-19 is exactly 60 days out and admitted - the separation
          spans two month boundaries, so day-count arithmetic cannot be faked
          by month subtraction.
