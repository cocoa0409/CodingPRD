          - "entities.Distance.fields.confirmed_count"
        distinguishing_aspect: "On transfer accept, the original registration is TRANSFERRED and a new CONFIRMED registration exists for the recipient in the same response cycle; confirmed_count stays 1 (slot moved, not freed)."
        test_recipe:
          setup: ["P1 CONFIRMED on capacity-5 distance; P1 proposes transfer to P2; clock 2026-06-09."]
