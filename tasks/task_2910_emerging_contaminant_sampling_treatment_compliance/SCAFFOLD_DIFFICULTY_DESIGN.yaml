  # ===========================================================================
  # §0.5 rule 4 — transitive_cascade
  # Instance (a) is a depth-4 escalation chain fired by a LabResult review;
  # instance (b) is a depth-3 de-escalation chain fired by a Sample
  # invalidation. Different triggering transitions, opposite directions.
  # ===========================================================================
  - rule_id: transitive_cascade
    instances:

      - name: accepting_a_high_result_cascades_through_sample_entry_point_and_mandated_evaluation
        grounds:
          - state_machines.LabResult.SUBMITTED_to_ACCEPTED
          - state_machines.Sample.RECEIVED_to_ANALYZED
          - state_machines.EntryPoint.REDUCTION_PENDING_to_QUARTERLY
          - calculations.locational_running_annual_average
          - calculations.compliance_posture_derivation
          - calculations.monitoring_frequency_reduction
          - entities.TreatmentEvaluation.fields.mandated
          - entities.EntryPoint.fields.consecutive_qualifying_quarters
        distinguishing_aspect: |
          A depth-4 chain fired by ONE write, POST /lab-results/{id}/review with action ACCEPT, where
          every link is caused by the previous one and none of them is reachable from the trigger
          directly: (1) the LabResult becomes ACCEPTED, which (2) completes the panel so the Sample
          becomes ANALYZED, which (3) puts the 18.00 quarter inside the LRAA window so
          max_compliance_ratio jumps 0.3750 -> 1.4075 and the posture becomes VIOLATION_PENDING, which
          (4) both auto-creates a mandated TreatmentEvaluation and auto-denies the pending reduction
          request. Removing link 2 (leaving the sample RECEIVED) suppresses links 3 and 4 entirely.
          Instance (b) starts from a different transition and shortens rather than lengthens the chain.
        setup_note: "Depth 4: LabResult -> Sample -> EntryPoint derived fields/posture -> {TreatmentEvaluation created, monitoring reduction auto-denied}."
        test_recipe:
          setup:
            - "Contaminant PFOA: mcl 4.00, trigger 2.00, required_mrl 2.00."
            - "Laboratory certified for METHOD_533, lowest achievable detection limit 1.00, capacity 5."
            - "EntryPoint EPTDS-01, population 45000."
            - "Four ACCEPTED quarterly results of 1.50 at detection limit 1.00 (2025Q3..2026Q2): compliance LRAA 1.50, ratio 0.3750, posture COMPLIANT, consecutive_qualifying_quarters 4 (1.50 is below the 2.00 trigger level in every quarter), monitoring_status QUARTERLY."
            - "The ComplianceOfficer has requested an ANNUAL reduction, so monitoring_status is REDUCTION_PENDING with requested_monitoring_status ANNUAL."
            - "A fifth 2026Q3 sample (collected 2026-07-15T08:00:00.000Z) is shipped, received clean, and a result of 18.00 at detection limit 1.00 analysed 2026-07-20T08:00:00.000Z is SUBMITTED but not yet reviewed. No TreatmentEvaluation exists yet."
          setup_api_calls:
            - call: "POST /contaminants"
              payload: { code: "PFOA", mcl_ng_per_l: 4.00, trigger_level_ng_per_l: 2.00, required_mrl_ng_per_l: 2.00, hazard_index_member: false }
              as: UtilityAdmin
              captures: { pfoa_id: "$.data.id" }
            - call: "POST /laboratories"
              payload: { name: "Northgate Analytical", certification_id: "CERT-001", certified_methods: ["METHOD_533"], lowest_achievable_dl_ng_per_l: 1.00, certification_expires_on: "2027-12-31T00:00:00.000Z", daily_analysis_capacity: 5 }
              as: UtilityAdmin
              captures: { lab_id: "$.data.id" }
            - call: "POST /entry-points"
              payload: { label: "EPTDS-01", source_type: "GROUNDWATER", population_served: 45000 }
              as: UtilityAdmin
              captures: { ep_id: "$.data.id" }
            - call: "POST /samples"
              payload: { entry_point_id: "${ep_id}", panel_contaminant_ids: ["${pfoa_id}"], monitoring_period: "2025Q3", collected_at: "2025-08-15T08:00:00.000Z", protocol: "LOW_FLOW_GRAB", ptfe_free_kit: true, field_blank_included: true, preservative_lot: "LOT-Q3" }
              as: SamplingTechnician
              captures: { s_q3_id: "$.data.id" }
            - call: "POST /samples/${s_q3_id}/ship"
              payload: { laboratory_id: "${lab_id}" }
              as: SamplingTechnician
            - call: "POST /samples/${s_q3_id}/receive"
              payload: { chain_of_custody_intact: true, field_blank_result_ng_per_l: 0.50 }
              as: LaboratoryManager
              as_user_id: "${lab_id}"
            - call: "POST /lab-results"
              payload: { sample_id: "${s_q3_id}", contaminant_id: "${pfoa_id}", method: "METHOD_533", reported_ng_per_l: 1.50, detection_limit_ng_per_l: 1.00, analyzed_at: "2025-08-20T08:00:00.000Z" }
              as: LaboratoryManager
              as_user_id: "${lab_id}"
              captures: { r_q3_id: "$.data.id" }
            - call: "POST /lab-results/${r_q3_id}/review"
              payload: { action: "ACCEPT" }
              as: ComplianceOfficer
              as_user_id: "officer-1"
            - call: "POST /samples"
              payload: { entry_point_id: "${ep_id}", panel_contaminant_ids: ["${pfoa_id}"], monitoring_period: "2025Q4", collected_at: "2025-11-14T08:00:00.000Z", protocol: "LOW_FLOW_GRAB", ptfe_free_kit: true, field_blank_included: true, preservative_lot: "LOT-Q4" }
