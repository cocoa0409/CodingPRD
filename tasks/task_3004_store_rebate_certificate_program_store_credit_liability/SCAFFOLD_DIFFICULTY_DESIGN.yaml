        distinguishing_aspect: |
          Non-linear shape on RebateSubmission (a DIFFERENT entity than the
          certificate cycle): the loop UNDER_REVIEW → REJECTED → SUBMITTED →
          UNDER_REVIEW repeats exactly MAX_RESUBMITS (3) times, after which the
          fourth resubmit is rejected with ERR_RESUBMIT_LIMIT_REACHED — cycle
