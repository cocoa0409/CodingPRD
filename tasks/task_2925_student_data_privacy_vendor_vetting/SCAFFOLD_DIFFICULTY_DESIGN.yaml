  - rule_id: boundary_precision_check
    instances:

      - name: incident_severity_at_exactly_1000_affected_students
        grounds:
          - calculations.incident_severity
          - calculations.incident_notification_due_at
          - calculations.vendor_privacy_posture
          - entities.VendorIncident.fields.severity
          - entities.VendorIncident.fields.notification_due_at
        distinguishing_aspect: |
          incident_severity has TWO independent CRITICAL doors and the count door is
          a >= boundary: 1000 affected students is CRITICAL, 999 is only HIGH, and
          999 becomes CRITICAL again the moment max_data_tier is 4. Because severity
          selects STATUTORY_MAX_HOURS, the boundary is observable twice over -- once
          in the enum and once in notification_due_at, which lands on 2026-08-02
          for the two CRITICAL rows and a full day later for the HIGH row.
        test_recipe:
          setup:
            - "Clock at 2026-08-01T00:00:00Z."
            - "Three separate vendors, each with breach_notification_hours 48, so the statutory ceiling always binds for CRITICAL (24h) and the vendor term binds for HIGH (48h)."
            - "Three vendors are used rather than one because the priority-32 incident buffer would reject a second incident on the same vendor."
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { current_utc: "2026-08-01T00:00:00Z" }
              as: PrivacyOfficeAdmin
            - call: "POST /vendors"
              payload: { legal_name: "Boundary Vendor One", hq_country_code: "US", breach_notification_hours: 48, data_deletion_days: 30, signed_state_addendum: true, subprocessor_disclosure_complete: true }
              as: PrivacyOfficeAdmin
              captures: { v1_id: $.data.id }
            - call: "POST /vendors"
