  - rule_id: transitive_cascade
    instances:

      - name: cascade_depth3_decision_to_cluster_severance
        grounds:
          - state_machines.SafetyIncident.transitions.PENDING_DECISION_to_DECIDED
          - state_machines.EnforcementAction.transitions.DRAFT_to_MANDATORY_REPORTED
          - state_machines.DeviceCluster.transitions.OPEN_to_WATCHLIST
          - state_machines.AccountDeviceLink.transitions.LINKED_to_SEVERED
        distinguishing_aspect: |
          A three-hop chain in which the decision on the incident mutates the enforcement
          action, that mutation on the enforcement action itself triggers the cluster
          escalation, and the cluster escalation in turn mutates the device links — each
          link caused by the previous one rather than by the original decision.
