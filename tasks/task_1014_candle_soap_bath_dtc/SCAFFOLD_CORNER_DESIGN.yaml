            - { call: "POST /skus/${s1}/batches", payload: { quantity_produced: 20, line_code: "OWL", cure_starts_at: "2026-06-01T00:00:00Z", cure_ends_at: "2026-06-05T00:00:00Z" }, as: MerchOps, captures: { b1: "$.data.id" } }
            - { call: "POST /batches/${b1}/release", payload: {}, as: MerchOps }
            - { call: "POST /customers", payload: { email: "c1@x.com", full_name: "C1" }, as: PlatformAdmin, captures: { c1: "$.data.id" } }
            - { call: "POST /customers", payload: { email: "c2@x.com", full_name: "C2" }, as: PlatformAdmin, captures: { c2: "$.data.id" } }
            - { call: "POST /customers/${c1}/orders", payload: { order_type: "RETAIL" }, as: Customer, as_user_id: "${c1}", captures: { o1: "$.data.id" } }
            - { call: "POST /orders/${o1}/lines", payload: { sku_id: "${s1}", batch_id: "${b1}", quantity: 1 }, as: Customer, as_user_id: "${c1}" }
            - { call: "GET /orders/${o1}", payload: {}, as: Customer, as_user_id: "${c1}", captures: { ov: "$.data.version" } }
          trigger:
            - { call: "POST /orders/${o1}/checkout", payload: { expected_order_version: "${ov}" }, as: Customer, as_user_id: "${c2}", captures: { err: "$.data.error_id" } }
          assert:
            - "response HTTP status == 403"
            - "error_id == ERR_NOT_RESOURCE_OWNER"

      - name: platform_admin_can_fulfill_order
        claim_type: hierarchical_override
        grounds: [roles]
        distinguishing_aspect: "PlatformAdmin (superset) can perform a MerchOps operation (POST /orders/{id}/fulfill) successfully."
        test_recipe:
          setup: ["A checked-out (ALLOCATED) order."]
          setup_api_calls:
            - { call: "POST /products", payload: { product_type: "SOAP", collection_name: "Ha", scent_family: "CITRUS", title: "Ha" }, as: MerchOps, captures: { p1: "$.data.id" } }
            - { call: "POST /products/${p1}/skus", payload: { size: "SMALL", scent: "Ha", list_price_cents: 1000 }, as: MerchOps, captures: { s1: "$.data.id" } }
            - { call: "POST /skus/${s1}/batches", payload: { quantity_produced: 20, line_code: "HAL", cure_starts_at: "2026-06-01T00:00:00Z", cure_ends_at: "2026-06-05T00:00:00Z" }, as: MerchOps, captures: { b1: "$.data.id" } }
            - { call: "POST /batches/${b1}/release", payload: {}, as: MerchOps }
            - { call: "POST /customers", payload: { email: "ha@x.com", full_name: "Ha" }, as: PlatformAdmin, captures: { c1: "$.data.id" } }
            - { call: "POST /customers/${c1}/orders", payload: { order_type: "RETAIL" }, as: Customer, as_user_id: "${c1}", captures: { o1: "$.data.id" } }
            - { call: "POST /orders/${o1}/lines", payload: { sku_id: "${s1}", batch_id: "${b1}", quantity: 1 }, as: Customer, as_user_id: "${c1}" }
            - { call: "GET /orders/${o1}", payload: {}, as: Customer, as_user_id: "${c1}", captures: { ov: "$.data.version" } }
            - { call: "POST /orders/${o1}/checkout", payload: { expected_order_version: "${ov}" }, as: Customer, as_user_id: "${c1}" }
          trigger:
            - { call: "POST /orders/${o1}/fulfill", payload: {}, as: PlatformAdmin }
          assert:
            - "response HTTP status == 200"
            - "Order.${o1}.fulfillment_status == DELIVERED"

  # ---------------------------------------------------------------------------
  - section: cross_cutting
    instances:
      - name: checkout_stale_version_returns_412
        claim_type: optimistic_concurrency
        grounds: ["concurrency_rules[order-checkout-stale-version]", "errors[ERR_STALE_VERSION]"]
        distinguishing_aspect: "After the client reads version v then a further line is added (bumping version), a checkout carrying expected_order_version = v is rejected with ERR_STALE_VERSION (412)."
        test_recipe:
          setup: ["Customer order with one line (version captured), then a second line added so the captured version is stale."]
          setup_api_calls:
            - { call: "POST /products", payload: { product_type: "SOAP", collection_name: "Oc", scent_family: "CITRUS", title: "Oc" }, as: MerchOps, captures: { p1: "$.data.id" } }
