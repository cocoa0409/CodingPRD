# =============================================================================
# 1.8 Scaffold Difficulty Design (Test Targeting Index) — task_3293
# 9 rules x 2 instances each = 18 instances.
# All setup/trigger chains use only endpoints declared in SCAFFOLD.yaml §1.5.
# Logical clock default before any set call: 2026-09-01T00:00:00Z.
# =============================================================================
scaffold_difficulty_design:

  - rule_id: dual_variant_calc
    instances:
      - name: trust_provisional_vs_finalized_diverge_on_young_rejection
        grounds:
          - calculations.contributor_trust_score
          - entities.Contributor.fields.provisional_trust_score
          - entities.Contributor.fields.finalized_trust_score
        distinguishing_aspect: |
          Entity domain = Contributor trust. The provisional variant counts a
          MapEdit rejected 1 day ago (provisional 50-6=44) while the finalized
          variant ignores edits younger than 7 days (finalized stays 50) —
          same data, two valid algorithms, different outputs.
        test_recipe:
          setup:
            - "Clock at 2026-09-01; region R1 exists; contributor C1 exists (trust 50 baseline)"
            - "Listing L1 created in R1"
            - "C1 submits an edit on L1 routed to QUEUED (attribute edit, no evidence: score 40+20+0-5=55)"
            - "Moderator M1 creates a ticket and resolves REJECT -> edit REJECTED at 2026-09-01"
            - "Clock advanced to 2026-09-02 (rejection is 1 day old)"
          setup_api_calls:
            - call: "POST /v1/regions"
              payload: { name: "R1", country_code: "US", timezone: "America/Chicago", geo_min_lat: 40.0, geo_max_lat: 41.0, geo_min_lng: -88.0, geo_max_lng: -87.0 }
              as: PlatformAdmin
              captures: { r1_id: $.data.id }
            - call: "POST /v1/contributors"
              payload: { display_name: "C1", email: "c1@x.com", home_region_id: "${r1_id}" }
              as: Anonymous
              captures: { c1_id: $.data.id }
            - call: "POST /v1/business-listings"
              payload: { region_id: "${r1_id}", name: "Cafe One", category: "RESTAURANT", address_text: "1 Main St", geo_lat: 40.5, geo_lng: -87.5 }
              as: PlatformAdmin
              captures: { l1_id: $.data.id, l1_v: $.data.version }
            - call: "POST /v1/map-edits"
              payload: { listing_id: "${l1_id}", contributor_id: "${c1_id}", edit_type: "ATTRIBUTE", payload: { attribute: "wifi", value: true }, expected_listing_version: "${l1_v}" }
              as: Contributor
              as_user_id: "${c1_id}"
              captures: { e1_id: $.data.id }
            - call: "POST /v1/review-tickets"
              payload: { queue: "EDIT_REVIEW", map_edit_id: "${e1_id}" }
              as: Moderator
              as_user_id: "mod-1"
              captures: { t1_id: $.data.id }
            - call: "POST /v1/review-tickets/${t1_id}/resolve"
              payload: { resolution: "REJECT" }
              as: Moderator
              as_user_id: "mod-1"
            - call: "POST /v1/_clock/set_current_utc"
              payload: { to_iso8601: "2026-09-02T00:00:00Z" }
              as: PlatformAdmin
          trigger:
            - call: "GET /v1/contributors/${c1_id}"
              payload: {}
              as: PlatformAdmin
              captures: { c1_prov: $.data.provisional_trust_score, c1_fin: $.data.finalized_trust_score }
          assert:
            - "Contributor.${c1_id}.provisional_trust_score == 44"
            - "Contributor.${c1_id}.finalized_trust_score == 50"
            - "provisional != finalized for identical underlying data"

      - name: health_public_vs_moderation_diverge_on_under_moderation_review
        grounds:
          - calculations.listing_health_score
          - entities.BusinessListing.fields.health_score
          - entities.BusinessListing.fields.moderation_health_score
        distinguishing_aspect: |
          Entity domain = BusinessListing health (different domain from
          Contributor trust). A 1-star review pulled into UNDER_MODERATION is
          excluded from the public variant (health 50) but counted at 0.5
          weight in the moderation variant (health 37.33).
        test_recipe:
          setup:
            - "Clock 2026-09-01; region R2; listing L2 (no edits, no reviews)"
            - "Reviewer C2 posts a 1-star review RV2 on L2 -> PUBLISHED"
            - "Flagger C3 flags RV2 -> FLAGGED"
            - "Moderator pulls flag into moderation -> review UNDER_MODERATION"
          setup_api_calls:
            - call: "POST /v1/regions"
              payload: { name: "R2", country_code: "US", timezone: "America/Chicago", geo_min_lat: 40.0, geo_max_lat: 41.0, geo_min_lng: -88.0, geo_max_lng: -87.0 }
              as: PlatformAdmin
              captures: { r2_id: $.data.id }
            - call: "POST /v1/business-listings"
              payload: { region_id: "${r2_id}", name: "Diner Two", category: "RESTAURANT", address_text: "2 Main St", geo_lat: 40.5, geo_lng: -87.5 }
              as: PlatformAdmin
              captures: { l2_id: $.data.id }
            - call: "POST /v1/contributors"
              payload: { display_name: "C2", email: "c2@x.com", home_region_id: "${r2_id}" }
              as: Anonymous
              captures: { c2_id: $.data.id }
            - call: "POST /v1/contributors"
              payload: { display_name: "C3", email: "c3@x.com", home_region_id: "${r2_id}" }
              as: Anonymous
              captures: { c3_id: $.data.id }
            - call: "POST /v1/reviews"
              payload: { listing_id: "${l2_id}", contributor_id: "${c2_id}", rating: 1, text: "Terrible service, waited an hour for cold food." }
              as: Contributor
              as_user_id: "${c2_id}"
              captures: { rv2_id: $.data.id }
            - call: "POST /v1/reviews/${rv2_id}/flag"
              payload: { reason: "OFF_TOPIC" }
              as: Contributor
              as_user_id: "${c3_id}"
              captures: { fl2_id: $.data.id }
            - call: "POST /v1/review-tickets"
              payload: { queue: "REVIEW_MODERATION", review_flag_id: "${fl2_id}" }
              as: Moderator
              as_user_id: "mod-1"
          trigger:
            - call: "GET /v1/business-listings/${l2_id}"
              payload: {}
              as: PlatformAdmin
              captures: { l2_pub: $.data.health_score, l2_mod: $.data.moderation_health_score }
          assert:
            - "BusinessListing.${l2_id}.health_score == 50"
            - "BusinessListing.${l2_id}.moderation_health_score == 37.33"
            - "BusinessListing.${l2_id}.review_count == 0 (UNDER_MODERATION excluded from public aggregates)"

  - rule_id: combinatorial_formula
    instances:
      - name: hours_winner_mode_a_promoted_contributor_beats_feed
        grounds:
          - calculations.hours_conflict_winner
        distinguishing_aspect: |
          Mode (a): >= 3 inputs with non-linear interaction — conditional
          contributor-level promotion (EXPERT/MASTER bumps source_priority
          1->3), tiered recency floor, and capped corroboration bonus. A
          same-day EXPERT-contributor observation (300+30+0=330) beats a
          40-day-old uncorroborated THIRD_PARTY_FEED observation (400+0+0=400)
          only when corroborated >= 8 times — pinned case: corroboration
          capped at 5 (bonus 50) makes 350 < 400, so the feed wins; dropping
          the feed's recency to 0 AND giving the contributor observation 5
          corroborators flips the winner only via the conditional promotion.
        test_recipe:
          setup:
            - "Clock 2026-10-11; region R3; listing L3"
            - "Contributor C4 raised to EXPERT via manual grants (1000 points)"
            - "Observation H_feed: THIRD_PARTY_FEED recorded 2026-09-01 (40 days old, recency 0), hours 09:00-17:00, day_mask 1111100"
            - "Observation H_exp: CONTRIBUTOR recorded 2026-10-11 (age 0, recency 30), hours 08:00-18:00, day_mask 1111100, plus 5 identical corroborating observations (bonus capped 50)"
          setup_api_calls:
            - call: "POST /v1/regions"
              payload: { name: "R3", country_code: "US", timezone: "America/Chicago", geo_min_lat: 40.0, geo_max_lat: 41.0, geo_min_lng: -88.0, geo_max_lng: -87.0 }
              as: PlatformAdmin
              captures: { r3_id: $.data.id }
            - call: "POST /v1/business-listings"
              payload: { region_id: "${r3_id}", name: "Shop Three", category: "RETAIL", address_text: "3 Main St", geo_lat: 40.5, geo_lng: -87.5 }
              as: PlatformAdmin
              captures: { l3_id: $.data.id }
            - call: "POST /v1/contributors"
              payload: { display_name: "C4", email: "c4@x.com", home_region_id: "${r3_id}" }
              as: Anonymous
              captures: { c4_id: $.data.id }
            - call: "POST /v1/contributor-grants"
              payload: { contributor_id: "${c4_id}", source_type: "ADJUSTMENT", source_id: "seed-expert", base_points: 1000, note: "seed to EXPERT" }
              as: PlatformAdmin
            - call: "POST /v1/_clock/set_current_utc"
              payload: { to_iso8601: "2026-09-01T00:00:00Z" }
              as: PlatformAdmin
            - call: "POST /v1/hours-observations"
              payload: { listing_id: "${l3_id}", source: "THIRD_PARTY_FEED", day_mask: "1111100", open_time: "09:00", close_time: "17:00" }
              as: PlatformAdmin
              captures: { h_feed_id: $.data.id }
            - call: "POST /v1/_clock/set_current_utc"
              payload: { to_iso8601: "2026-10-11T00:00:00Z" }
              as: PlatformAdmin
            - call: "POST /v1/hours-observations"
              payload: { listing_id: "${l3_id}", source: "CONTRIBUTOR", day_mask: "1111100", open_time: "08:00", close_time: "18:00" }
              as: Contributor
              as_user_id: "${c4_id}"
              captures: { h_exp_id: $.data.id }
            - call: "POST /v1/hours-observations"
              payload: { listing_id: "${l3_id}", source: "CONTRIBUTOR", day_mask: "1111100", open_time: "08:00", close_time: "18:00" }
              as: Contributor
              as_user_id: "${c4_id}"
            - call: "POST /v1/hours-observations"
              payload: { listing_id: "${l3_id}", source: "CONTRIBUTOR", day_mask: "1111100", open_time: "08:00", close_time: "18:00" }
              as: Contributor
              as_user_id: "${c4_id}"
            - call: "POST /v1/hours-observations"
              payload: { listing_id: "${l3_id}", source: "CONTRIBUTOR", day_mask: "1111100", open_time: "08:00", close_time: "18:00" }
              as: Contributor
              as_user_id: "${c4_id}"
            - call: "POST /v1/hours-observations"
              payload: { listing_id: "${l3_id}", source: "CONTRIBUTOR", day_mask: "1111100", open_time: "08:00", close_time: "18:00" }
              as: Contributor
              as_user_id: "${c4_id}"
            - call: "POST /v1/hours-observations"
              payload: { listing_id: "${l3_id}", source: "CONTRIBUTOR", day_mask: "1111100", open_time: "08:00", close_time: "18:00" }
              as: Contributor
              as_user_id: "${c4_id}"
          trigger:
            - call: "POST /v1/business-listings/${l3_id}/hours/resolve"
              payload: { day_mask: "1111100" }
              as: Moderator
              captures: { winner_id: $.data.accepted_observation_id }
          assert:
            - "accepted_observation_id == ${h_feed_id} (feed 4*100+0+0=400 beats promoted contributor 3*100+30+50=380 — the conditional promotion plus capped corroboration still loses to raw source priority on a stale feed)"
            - "Resolve response accepted_count == 1"
            - "HoursObservation ${h_feed_id}.accepted == true and HoursObservation ${h_exp_id}.accepted == false"

      - name: points_award_mode_b_per_contribution_rounding
        grounds:
          - calculations.contributor_points_award
        distinguishing_aspect: |
          Mode (b): nested rounding order pinned — round each grant then sum.
          Two grants of base_points 1 with quality_multiplier 0.5 yield
          total_points 2 under the pinned order (0.5 -> 1 per grant) versus 1
          under the forbidden sum-then-round order (0.5+0.5=1.0 -> 1).
        test_recipe:
          setup:
            - "Region R4; contributor C5 with zero points"
          setup_api_calls:
            - call: "POST /v1/regions"
              payload: { name: "R4", country_code: "US", timezone: "America/Chicago", geo_min_lat: 40.0, geo_max_lat: 41.0, geo_min_lng: -88.0, geo_max_lng: -87.0 }
              as: PlatformAdmin
              captures: { r4_id: $.data.id }
            - call: "POST /v1/contributors"
              payload: { display_name: "C5", email: "c5@x.com", home_region_id: "${r4_id}" }
              as: Anonymous
              captures: { c5_id: $.data.id }
            - call: "POST /v1/contributor-grants"
              payload: { contributor_id: "${c5_id}", source_type: "ADJUSTMENT", source_id: "g-half-1", base_points: 1, quality_multiplier: 0.5, note: "half grant 1" }
              as: PlatformAdmin
            - call: "POST /v1/contributor-grants"
              payload: { contributor_id: "${c5_id}", source_type: "ADJUSTMENT", source_id: "g-half-2", base_points: 1, quality_multiplier: 0.5, note: "half grant 2" }
              as: PlatformAdmin
          trigger:
            - call: "GET /v1/contributors/${c5_id}"
              payload: {}
              as: PlatformAdmin
          assert:
            - "Contributor.${c5_id}.total_points == 2 (per-contribution rounding: round(0.5)=1 twice)"
            - "Contributor.${c5_id}.lifetime_points == 2"
            - "Contributor.${c5_id}.level == NEWCOMER (2 < 50)"

  - rule_id: non_linear_state_machine
    instances:
      - name: mapedit_needs_info_cycle_reopens_review
        grounds:
          - state_machines.MapEdit.IN_REVIEW_to_NEEDS_MORE_INFO
          - state_machines.MapEdit.NEEDS_MORE_INFO_to_IN_REVIEW
        distinguishing_aspect: |
          MapEdit machine is cyclic: IN_REVIEW -> NEEDS_MORE_INFO -> IN_REVIEW
          via supply-info, and the second pass can publish — proving the loop
          is traversable more than once and terminates forward.
        test_recipe:
          setup:
            - "Region R5; contributor C6; listing L5"
            - "Edit E6 by C6 routed QUEUED (attribute edit, no evidence: score 55)"
            - "Moderator claims via ticket and resolves NEEDS_INFO -> edit NEEDS_MORE_INFO"
          setup_api_calls:
            - call: "POST /v1/regions"
              payload: { name: "R5", country_code: "US", timezone: "America/Chicago", geo_min_lat: 40.0, geo_max_lat: 41.0, geo_min_lng: -88.0, geo_max_lng: -87.0 }
              as: PlatformAdmin
              captures: { r5_id: $.data.id }
            - call: "POST /v1/contributors"
              payload: { display_name: "C6", email: "c6@x.com", home_region_id: "${r5_id}" }
              as: Anonymous
              captures: { c6_id: $.data.id }
            - call: "POST /v1/business-listings"
              payload: { region_id: "${r5_id}", name: "Market Five", category: "RETAIL", address_text: "5 Main St", geo_lat: 40.5, geo_lng: -87.5 }
              as: PlatformAdmin
              captures: { l5_id: $.data.id, l5_v: $.data.version }
            - call: "POST /v1/map-edits"
              payload: { listing_id: "${l5_id}", contributor_id: "${c6_id}", edit_type: "ATTRIBUTE", payload: { attribute: "parking", value: true }, expected_listing_version: "${l5_v}" }
              as: Contributor
              as_user_id: "${c6_id}"
              captures: { e6_id: $.data.id }
            - call: "POST /v1/review-tickets"
              payload: { queue: "EDIT_REVIEW", map_edit_id: "${e6_id}" }
              as: Moderator
              as_user_id: "mod-1"
              captures: { t6_id: $.data.id }
            - call: "POST /v1/review-tickets/${t6_id}/resolve"
              payload: { resolution: "NEEDS_INFO" }
              as: Moderator
              as_user_id: "mod-1"
          trigger:
            - call: "POST /v1/map-edits/${e6_id}/supply-info"
              payload: { evidence: "photo of parking lot signage" }
              as: Contributor
              as_user_id: "${c6_id}"
              captures: { e6_state: $.data.status }
          assert:
            - "MapEdit.${e6_id}.status == IN_REVIEW (cycle re-entered)"
            - "A new OPEN ReviewTicket with queue=EDIT_REVIEW and priority=HIGH exists referencing ${e6_id}"

      - name: listing_reverify_cycle_suspension_reinstatement
        grounds:
          - state_machines.BusinessListing.VERIFIED_to_REVERIFY_REQUIRED
          - state_machines.BusinessListing.REVERIFY_REQUIRED_to_VERIFIED
          - state_machines.BusinessListing.SUSPENDED_to_VERIFIED
        distinguishing_aspect: |
          BusinessListing machine is cyclic across two loops on a DIFFERENT
          entity than MapEdit: VERIFIED -> REVERIFY_REQUIRED -> VERIFIED (time
          sweep) and VERIFIED -> SUSPENDED -> VERIFIED (appeal overturn).
        test_recipe:
          setup:
            - "Clock 2026-09-01; region R6; listing L6 claimed and verified by owner C7 (POSTCARD)"
            - "Clock advanced to 2027-09-02 (> 365d after verification); sweep-reverify -> REVERIFY_REQUIRED"
            - "C7 verifies again via PHONE -> VERIFIED (first cycle closes)"
            - "PolicyAnalyst PA1 suspends L6 (FAKE_ADDRESS) -> SUSPENDED; owner appeals; DIFFERENT analyst PA2 starts review and decides OVERTURNED -> VERIFIED (second cycle closes)"
          setup_api_calls:
            - call: "POST /v1/regions"
              payload: { name: "R6", country_code: "US", timezone: "America/Chicago", geo_min_lat: 40.0, geo_max_lat: 41.0, geo_min_lng: -88.0, geo_max_lng: -87.0 }
              as: PlatformAdmin
              captures: { r6_id: $.data.id }
            - call: "POST /v1/contributors"
              payload: { display_name: "C7", email: "c7@x.com", home_region_id: "${r6_id}" }
              as: Anonymous
              captures: { c7_id: $.data.id }
            - call: "POST /v1/business-listings"
              payload: { region_id: "${r6_id}", name: "Lodge Six", category: "LODGING", address_text: "6 Main St", geo_lat: 40.5, geo_lng: -87.5 }
              as: PlatformAdmin
              captures: { l6_id: $.data.id, l6_v0: $.data.version }
            - call: "POST /v1/business-listings/${l6_id}/claim"
              payload: { expected_listing_version: "${l6_v0}" }
              as: BusinessOwner
              as_user_id: "${c7_id}"
            - call: "POST /v1/verification-attempts"
              payload: { listing_id: "${l6_id}", method: "POSTCARD" }
              as: BusinessOwner
              as_user_id: "${c7_id}"
              captures: { va6_id: $.data.id, va6_code: $.data.code }
            - call: "POST /v1/verification-attempts/${va6_id}/submit-code"
              payload: { code: "${va6_code}" }
              as: BusinessOwner
              as_user_id: "${c7_id}"
            - call: "POST /v1/_clock/set_current_utc"
              payload: { to_iso8601: "2027-09-02T00:00:00Z" }
              as: PlatformAdmin
            - call: "POST /v1/business-listings/sweep-reverify"
              payload: {}
              as: PlatformAdmin
            - call: "POST /v1/verification-attempts"
              payload: { listing_id: "${l6_id}", method: "PHONE" }
              as: BusinessOwner
              as_user_id: "${c7_id}"
              captures: { va6b_id: $.data.id, va6b_code: $.data.code }
            - call: "POST /v1/verification-attempts/${va6b_id}/submit-code"
              payload: { code: "${va6b_code}" }
              as: BusinessOwner
              as_user_id: "${c7_id}"
            - call: "POST /v1/business-listings/${l6_id}/suspend"
              payload: { violation_type: "FAKE_ADDRESS", evidence_notes: "geocoded centroid lands in open water" }
              as: PolicyAnalyst
              as_user_id: "pa-1"
              captures: { sc6_id: $.data.id }
            - call: "POST /v1/suspension-cases/${sc6_id}/appeal"
              payload: { appeal_text: "The address is correct; the geocoder pinned the wrong parcel. Attached deed and utility bill prove occupancy at 6 Main St." }
              as: BusinessOwner
              as_user_id: "${c7_id}"
            - call: "POST /v1/suspension-cases/${sc6_id}/start-appeal-review"
              payload: {}
              as: PolicyAnalyst
              as_user_id: "pa-2"
          trigger:
            - call: "POST /v1/suspension-cases/${sc6_id}/decide"
              payload: { decision: "OVERTURNED" }
              as: PolicyAnalyst
              as_user_id: "pa-2"
            - call: "GET /v1/business-listings/${l6_id}"
              payload: {}
              as: PlatformAdmin
              captures: { l6_status: $.data.status }
          assert:
            - "BusinessListing.${l6_id}.status == VERIFIED (reinstated; reverify_due_at 2027-09-02 + 365d is in the future relative to decision time)"
            - "SuspensionCase.${sc6_id}.status == OVERTURNED"

  - rule_id: transitive_cascade
    instances:
      - name: suspension_edit_rejection_trust_demotion_cascade
        grounds:
          - state_machines.BusinessListing.VERIFIED_to_SUSPENDED
          - calculations.contributor_trust_score
        distinguishing_aspect: |
          Depth-3 cascade triggered by POST /v1/business-listings/{id}/suspend:
          (1) suspend -> C8's QUEUED edit on L7a force-REJECTED; (2) the
          rejection triggers contributor_trust_score recompute: C8 already has
          six earlier moderator rejections, so provisional trust falls
          50 - 6*6 - 6 = 8 (six pre-seeded + one cascade) below 20;
          (3) crossing the threshold auto-transitions Contributor C8 to
          RESTRICTED. The demotion is never called directly — it is the third
          consequence of the suspend.
        test_recipe:
          setup:
            - "Region R7; contributors C8 (the edit author) and C9 (the listing owner)"
            - "Listing L7a VERIFIED by C9"
            - "C8 has six REJECTED edits on L7a (each: submit ATTRIBUTE edit no evidence -> score 55 QUEUED -> moderator ticket -> REJECT)"
            - "C8 has one further QUEUED edit E7q on L7a awaiting review"
          setup_api_calls:
            - call: "POST /v1/regions"
              payload: { name: "R7", country_code: "US", timezone: "America/Chicago", geo_min_lat: 40.0, geo_max_lat: 41.0, geo_min_lng: -88.0, geo_max_lng: -87.0 }
              as: PlatformAdmin
              captures: { r7_id: $.data.id }
            - call: "POST /v1/contributors"
              payload: { display_name: "C8", email: "c8@x.com", home_region_id: "${r7_id}" }
              as: Anonymous
              captures: { c8_id: $.data.id }
            - call: "POST /v1/contributors"
              payload: { display_name: "C9", email: "c9@x.com", home_region_id: "${r7_id}" }
              as: Anonymous
              captures: { c9_id: $.data.id }
            - call: "POST /v1/business-listings"
              payload: { region_id: "${r7_id}", name: "Hotel Seven", category: "LODGING", address_text: "7 Main St", geo_lat: 40.5, geo_lng: -87.5 }
              as: PlatformAdmin
              captures: { l7_id: $.data.id, l7_v0: $.data.version }
            - call: "POST /v1/business-listings/${l7_id}/claim"
              payload: { expected_listing_version: "${l7_v0}" }
              as: BusinessOwner
              as_user_id: "${c9_id}"
            - call: "POST /v1/verification-attempts"
              payload: { listing_id: "${l7_id}", method: "PHONE" }
              as: BusinessOwner
              as_user_id: "${c9_id}"
              captures: { va7_id: $.data.id, va7_code: $.data.code }
            - call: "POST /v1/verification-attempts/${va7_id}/submit-code"
              payload: { code: "${va7_code}" }
              as: BusinessOwner
              as_user_id: "${c9_id}"
            - call: "GET /v1/business-listings/${l7_id}"
              payload: {}
              as: PlatformAdmin
              captures: { l7_v1: $.data.version }
            - call: "POST /v1/map-edits"
