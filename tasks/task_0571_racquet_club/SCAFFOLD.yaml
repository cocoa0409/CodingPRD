# =============================================================================
# §1.2 State Machine Table
# =============================================================================
state_machines:
  - entity: Court
    field: status
    initial_state: AVAILABLE
    terminal_states: [RETIRED]
    note: "Cyclic AVAILABLE<->MAINTENANCE with a terminal RETIRED."
    transitions:
      - from: AVAILABLE
        to: MAINTENANCE
        trigger: "POST /racquet/courts/{court_id}/maintenance"
        actor: FrontDesk
        preconditions: ["Court.status == AVAILABLE"]
        side_effects:
          - "CASCADE hop 1: every Reservation on this court with status BOOKED and start_time >= current clock time transitions BOOKED -> CANCELLED (court_maintenance cascade)."
          - "CASCADE hop 2: each such Reservation's cancellation restores Subscription.court_credits_remaining by its credits_used and reverses provisional_fee_cents from Member.account_balance_cents (see compensating invariants)."
      - from: MAINTENANCE
        to: AVAILABLE
        trigger: "POST /racquet/courts/{court_id}/reopen"
        actor: FrontDesk
        preconditions: ["Court.status == MAINTENANCE"]
        side_effects: []
      - from: [AVAILABLE, MAINTENANCE]
        to: RETIRED
        trigger: "POST /racquet/courts/{court_id}/retire"
        actor: FrontDesk
        preconditions: ["No Reservation on this court in status BOOKED or CHECKED_IN with start_time >= current clock time"]
        side_effects: ["Court becomes permanently unbookable"]

  - entity: Member
    field: status
    initial_state: ACTIVE
    terminal_states: []
    note: "Cyclic ACTIVE<->SUSPENDED; suspension is reachable by auto-trigger (no-show threshold) or by FrontDesk."
    transitions:
      - from: ACTIVE
        to: SUSPENDED
        trigger: "POST /racquet/members/{member_id}/suspend OR system (no_show_strikes reaches NO_SHOW_SUSPEND_THRESHOLD)"
        actor: "FrontDesk or system"
        preconditions: ["Member.status == ACTIVE"]
        side_effects:
          - "CASCADE hop 3 (no-show chain): the member's non-CANCELLED Subscription, if status == ACTIVE, transitions ACTIVE -> FROZEN and frozen_at is stamped to current clock time."
      - from: SUSPENDED
        to: ACTIVE
        trigger: "POST /racquet/members/{member_id}/reinstate"
        actor: FrontDesk
        preconditions: ["Member.status == SUSPENDED"]
        side_effects: ["Member.no_show_strikes reset to 0"]

  - entity: Subscription
    field: status
    initial_state: ACTIVE
    terminal_states: [CANCELLED]
    note: "Cyclic ACTIVE<->FROZEN (freeze/unfreeze) plus an ACTIVE->ACTIVE renewal self-loop; CANCELLED terminal."
    transitions:
      - from: ACTIVE
        to: FROZEN
        trigger: "POST /racquet/subscriptions/{subscription_id}/freeze OR system (owning Member suspended)"
        actor: "Member or FrontDesk or system"
        preconditions:
          - "Subscription.status == ACTIVE"
          - "Subscription.freeze_count < plan.freeze_limit (manual freeze only)"
        side_effects:
          - "freeze_count incremented by 1 (manual freeze); frozen_at stamped to current clock time; credit accrual paused (days while FROZEN do not count as active_days)"
      - from: FROZEN
        to: ACTIVE
        trigger: "POST /racquet/subscriptions/{subscription_id}/unfreeze"
        actor: "Member or FrontDesk"
        preconditions: ["Subscription.status == FROZEN"]
        side_effects: ["frozen_at cleared to null"]
      - from: ACTIVE
        to: ACTIVE
        trigger: "POST /racquet/subscriptions/{subscription_id}/change-plan"
        actor: "Member or FrontDesk"
        preconditions:
          - "Subscription.status == ACTIVE"
          - "expected_subscription_version matches Subscription.version (OCC)"
        side_effects:
          - "plan_id set to the new plan; estimated_period_fee_cents recomputed to new plan.monthly_fee_cents; court_credits_remaining topped to min(court_credits_remaining, new plan.monthly_court_credits) is NOT applied — credits are left unchanged; increments Subscription.version by 1"
      - from: [ACTIVE, FROZEN]
        to: ACTIVE
        trigger: "POST /racquet/subscriptions/{subscription_id}/renew"
        actor: "FrontDesk or system"
        preconditions:
          - "current clock time >= current_period_end"
        side_effects:
          - "Chronological actual period fee computed (subscription_period_cost, chronological variant) and posted to Member.account_balance_cents"
          - "court_credits_remaining reset to plan.monthly_court_credits; estimated_period_fee_cents reset to plan.monthly_fee_cents; period advanced by 30 days; frozen_at cleared; status set ACTIVE"
      - from: [ACTIVE, FROZEN]
        to: CANCELLED
        trigger: "POST /racquet/subscriptions/{subscription_id}/cancel"
        actor: "Member or FrontDesk"
        preconditions: ["Subscription.status != CANCELLED"]
        side_effects: ["court_credits_remaining set to 0"]

  - entity: Reservation
    field: status
    initial_state: BOOKED
    terminal_states: [COMPLETED, CANCELLED, NO_SHOW]
    note: "Branching fork from BOOKED into CHECKED_IN->COMPLETED, CANCELLED, or NO_SHOW with divergent side-effect sets."
    transitions:
      - from: BOOKED
        to: CHECKED_IN
        trigger: "POST /racquet/reservations/{reservation_id}/check-in"
        actor: "Member or FrontDesk"
        preconditions:
          - "Reservation.status == BOOKED"
          - "current clock time within [start_time - CHECKIN_EARLY_MINUTES, end_time)"
        side_effects: ["actual_guest_count recorded (defaults to guest_count when omitted)"]
      - from: CHECKED_IN
        to: COMPLETED
        trigger: "POST /racquet/reservations/{reservation_id}/complete"
        actor: FrontDesk
        preconditions: ["Reservation.status == CHECKED_IN"]
        side_effects:
          - "final_fee_cents computed (reservation_charge, final variant using actual_guest_count); delta (final_fee_cents - provisional_fee_cents) posted to Member.account_balance_cents"
      - from: BOOKED
        to: CANCELLED
        trigger: "POST /racquet/reservations/{reservation_id}/cancel OR system (court set to MAINTENANCE)"
        actor: "Member or FrontDesk or system"
        preconditions: ["Reservation.status == BOOKED"]
        side_effects:
          - "credits_used restored to Subscription.court_credits_remaining; provisional_fee_cents reversed from Member.account_balance_cents"
      - from: BOOKED
        to: NO_SHOW
        trigger: "POST /racquet/reservations/{reservation_id}/mark-no-show"
        actor: FrontDesk
        preconditions:
          - "Reservation.status == BOOKED"
          - "current clock time >= start_time + NO_SHOW_GRACE_MINUTES"
        side_effects:
          - "provisional_fee_cents retained as a penalty (no refund); credits_used NOT restored"
          - "CASCADE hop 1 (no-show chain): Member.no_show_strikes incremented by 1"
          - "CASCADE hop 2 (no-show chain): if no_show_strikes >= NO_SHOW_SUSPEND_THRESHOLD, Member transitions ACTIVE -> SUSPENDED (which itself triggers hop 3, freezing the subscription)"

  - entity: Lesson
    field: status
    initial_state: SCHEDULED
    terminal_states: [COMPLETED, CANCELLED]
    note: "Branching from SCHEDULED into CONFIRMED->COMPLETED or CANCELLED."
    transitions:
      - from: SCHEDULED
        to: CONFIRMED
        trigger: "POST /racquet/lessons/{lesson_id}/confirm"
        actor: "Pro or FrontDesk"
        preconditions: ["Lesson.status == SCHEDULED", "enrolled_count >= 1"]
        side_effects: []
      - from: CONFIRMED
        to: COMPLETED
        trigger: "POST /racquet/lessons/{lesson_id}/complete"
        actor: "Pro or FrontDesk"
        preconditions: ["Lesson.status == CONFIRMED"]
        side_effects: ["price_cents posted to Member.account_balance_cents for every Enrollment in status ENROLLED"]
      - from: [SCHEDULED, CONFIRMED]
        to: CANCELLED
        trigger: "POST /racquet/lessons/{lesson_id}/cancel"
        actor: "Pro or FrontDesk"
        preconditions: ["Lesson.status in {SCHEDULED, CONFIRMED}"]
        side_effects: ["every Enrollment in status ENROLLED or WAITLISTED transitions to CANCELLED (no charge)"]

  - entity: Enrollment
    field: status
    initial_state: "ENROLLED or WAITLISTED (assigned at create by clinic_enrollment)"
    terminal_states: [CANCELLED]
    note: "WAITLISTED->ENROLLED promotion is a cycle-like re-entry driven by a sibling cancellation."
    transitions:
      - from: WAITLISTED
        to: ENROLLED
        trigger: "system (an ENROLLED enrollment on the same lesson is cancelled and this is the earliest WAITLISTED by created_at ASC)"
        actor: system
        preconditions: ["A seat freed and enrolled_count < capacity"]
        side_effects: ["lesson.enrolled_count recomputed"]
      - from: [ENROLLED, WAITLISTED]
        to: CANCELLED
        trigger: "POST /racquet/enrollments/{enrollment_id}/cancel OR system (lesson cancelled)"
        actor: "Member or FrontDesk or system"
        preconditions: ["Enrollment.status in {ENROLLED, WAITLISTED}"]
        side_effects: ["if an ENROLLED seat was freed, promote earliest WAITLISTED (created_at ASC) to ENROLLED"]

  - entity: StringingJob
    field: status
    initial_state: RECEIVED
    terminal_states: [PICKED_UP, CANCELLED]
    note: "Linear advance RECEIVED->IN_PROGRESS->READY->PICKED_UP with a branch to CANCELLED before pickup."
    transitions:
      - from: RECEIVED
        to: IN_PROGRESS
        trigger: "POST /racquet/stringing-jobs/{job_id}/advance"
        actor: FrontDesk
        preconditions: ["StringingJob.status == RECEIVED"]
        side_effects: []
      - from: IN_PROGRESS
        to: READY
        trigger: "POST /racquet/stringing-jobs/{job_id}/advance"
        actor: FrontDesk
        preconditions: ["StringingJob.status == IN_PROGRESS"]
        side_effects: []
      - from: READY
        to: PICKED_UP
        trigger: "POST /racquet/stringing-jobs/{job_id}/advance"
        actor: FrontDesk
        preconditions: ["StringingJob.status == READY"]
        side_effects: []
      - from: [RECEIVED, IN_PROGRESS, READY]
        to: CANCELLED
        trigger: "POST /racquet/stringing-jobs/{job_id}/cancel"
        actor: FrontDesk
        preconditions: ["StringingJob.status in {RECEIVED, IN_PROGRESS, READY}"]
        side_effects: ["price_cents reversed from Member.account_balance_cents"]

  - entity: Competition
    field: status
    initial_state: REGISTRATION
    terminal_states: [COMPLETED]
    note: "Linear REGISTRATION->IN_PROGRESS->COMPLETED; start seeds a TOURNAMENT bracket."
    transitions:
      - from: REGISTRATION
        to: IN_PROGRESS
        trigger: "POST /racquet/competitions/{competition_id}/start"
        actor: FrontDesk
        preconditions:
          - "Competition.status == REGISTRATION"
          - "TOURNAMENT: draw_size is a power of two and equals the ACTIVE participant count (else ERR_INVALID_DRAW_SIZE)"
        side_effects:
          - "TOURNAMENT: competition_seeding assigns bracket_slot; LADDER: ladder_rank assigned by created_at ASC"
      - from: IN_PROGRESS
        to: COMPLETED
        trigger: "POST /racquet/competitions/{competition_id}/close"
        actor: FrontDesk
        preconditions: ["Competition.status == IN_PROGRESS"]
        side_effects: []

# =============================================================================
# §1.2.1 Concurrency Rules (OCC on parent version)
# =============================================================================
concurrency_rules:
  - rule_id: subscription-change-plan-stale
    parent_entity: Subscription
    write_endpoint: "POST /racquet/subscriptions/{subscription_id}/change-plan"
    occ_field: "expected_subscription_version"
    description: |
      Changing a Subscription's plan when its version has advanced since the client
      last observed it is rejected. Plan changes are legitimately repeatable (a member
      may move BASIC -> PREMIER -> ELITE), so a second change carrying a stale version
      is not blocked by any state precondition — only by the OCC version check. A prior
      change-plan or a renewal reconciliation silently advances the version, so a stale
      value is rejected deterministically.
    error_id: ERR_STALE_VERSION
    http_status: 412
  - rule_id: reservation-reschedule-stale
    parent_entity: Reservation
    write_endpoint: "POST /racquet/reservations/{reservation_id}/reschedule"
    occ_field: "expected_reservation_version"
    description: |
      Rescheduling a Reservation whose version has advanced since the client last read it
      is rejected. Rescheduling a BOOKED reservation is repeatable (the member may move the
      slot more than once), so a second reschedule carrying a stale version is rejected only
      by the OCC check, not by a state precondition.
    error_id: ERR_STALE_VERSION
    http_status: 412

# =============================================================================
# §1.3 Calculation Rules Table
# =============================================================================
calculations:
  - name: reservation_charge
    trigger: "reservation create (provisional variant); reservation complete (final variant)"
    algorithm: tiered_pricing
    input_set: "The single Reservation, its Court, the booking Member, and the member's non-CANCELLED Subscription and that subscription's MembershipPlan."
    formula: |
      duration_hours = ceil((end_time - start_time) in minutes / CREDIT_MINUTES)   # whole hours, round up
      is_peak = (start_time hour (UTC) in [PEAK_START_HOUR, PEAK_END_HOUR))
      base_court_cents = court.hourly_rate_cents * duration_hours
      if is_peak:
          base_court_cents = base_court_cents + ceil(base_court_cents * PEAK_SURCHARGE_PCT)   # surcharge computed on pre-surcharge base, then added
      # credit-vs-cash selection (nested conditional):
      credit_eligible = (subscription != null
                         AND subscription.status == ACTIVE
                         AND subscription.court_credits_remaining >= duration_hours
                         AND (peak_ok := (not is_peak) OR plan.peak_access))
      if credit_eligible:
          credits_used = duration_hours
          court_charge_cents = 0
      else:
          credits_used = 0
          court_charge_cents = base_court_cents
      effective_guests = guest_count (provisional) OR actual_guest_count (final)
      guest_charge_cents = effective_guests * plan.guest_fee_cents
      ball_machine_cents = court.ball_machine_fee_cents if (uses_ball_machine AND court.has_ball_machine) else 0
      fee_cents = court_charge_cents + guest_charge_cents + ball_machine_cents
    constants:
      CREDIT_MINUTES: 60
      PEAK_START_HOUR: 17
      PEAK_END_HOUR: 21
      PEAK_SURCHARGE_PCT: 0.25
    precision: "integer cents; ceil applied to the surcharge term"
    variants:
      - name: provisional
        when: "at reservation create; uses guest_count and credits available at booking"
        difference: "posted immediately to Member.account_balance_cents as provisional_fee_cents; credits_used deducted from subscription"
      - name: final
        when: "at reservation complete; uses actual_guest_count recorded at check-in"
        difference: "final_fee_cents recomputed; only the delta (final_fee_cents - provisional_fee_cents) is posted to the ledger. Divergence occurs when actual_guest_count != guest_count."

  - name: subscription_proration
    trigger: "subscription renew (period close)"
    algorithm: aggregation
    input_set: "Active days within [current_period_start, current_period_end); a day counts as active when Subscription.status == ACTIVE at 00:00:00Z of that day (a day on/after frozen_at when still FROZEN is inactive)."
    formula: |
      days_in_period = 30
      daily_rate = plan.monthly_fee_cents / days_in_period       # fractional cents, NOT yet rounded
      active_days = count of calendar days d in [current_period_start, current_period_end)
                    where Subscription.status == ACTIVE at 00:00:00Z of d
      # PINNED ORDER: round each active day to the nearest cent, THEN sum.
      prorated_cents = sum over each active day of round_half_up(daily_rate)
      # (This differs from sum-then-round: round_half_up(daily_rate * active_days).)
    constants:
      DAYS_PER_PERIOD: 30
    precision: "round_half_up per active day, then integer-sum"

  - name: subscription_period_cost
    trigger: "subscription create (forward estimate); subscription renew (chronological actual)"
    algorithm: chronological
    input_set: "The Subscription, its MembershipPlan, and the freeze episode (frozen_at) within the current period."
    formula: |
      forward_looking  = plan.monthly_fee_cents                  # projected at period open, assumes no freeze
      chronological    = subscription_proration(this subscription) # replays freeze days, per-day rounded
      # At renewal, the member is charged the chronological actual; the forward estimate is only a projection.
      reconciliation_delta = forward_looking - chronological       # savings surfaced by the freeze
    precision: "integer cents"
    variants:
      - name: forward_looking
        when: "surfaced as Subscription.estimated_period_fee_cents at period open"
        difference: "ignores in-period freezes; equals plan.monthly_fee_cents"
      - name: chronological
        when: "posted to Member.account_balance_cents at renew"
        difference: "prorates by active_days; strictly <= forward_looking, diverging when a freeze occurred mid-period"

  - name: member_account_balance
    trigger: "reservation create/complete/cancel; lesson complete; stringing intake/cancel; competition register/withdraw; subscription renew"
    algorithm: aggregation
    input_set: "All ledger-affecting events for the member."
    formula: |
      account_balance_cents = (sum of all posted charges) - (sum of all posted refunds/payments)
      # Charges: reservation provisional_fee_cents (at book), completion delta (at complete),
      #          lesson price_cents per ENROLLED enrollment (at lesson complete),
      #          stringing price_cents (at intake), competition entry_fee_cents (at register),
      #          subscription chronological period fee (at renew).
      # Refunds: reservation provisional_fee_cents reversed (at cancel from BOOKED),
      #          stringing price_cents reversed (at stringing cancel).
    precision: "integer cents"

  - name: subscription_court_credits
    trigger: "reservation create/cancel; subscription renew/cancel; court maintenance cascade"
    algorithm: aggregation
    input_set: "The member's non-CANCELLED subscription and its reservations in the current period."
    formula: |
      court_credits_remaining = plan.monthly_court_credits
                                - sum(credits_used for reservations in status BOOKED, CHECKED_IN, COMPLETED, NO_SHOW)
      # Cancelling a BOOKED reservation restores its credits_used; NO_SHOW retains the deduction.
    precision: "integer credits; never below 0"

  - name: clinic_enrollment
    trigger: "enrollment create; enrollment cancel; lesson cancel"
    algorithm: aggregation
    input_set: "Enrollment rows for the lesson."
    formula: |
      enrolled_count = count(Enrollment where lesson_id == lesson AND status == ENROLLED)
      on create:
        if enrolled_count < lesson.capacity: new enrollment status = ENROLLED
        else:                                new enrollment status = WAITLISTED
      on cancel of an ENROLLED seat:
        promote the WAITLISTED enrollment with the earliest created_at (ASC) to ENROLLED, if any
    constants: {}
    precision: "integer seat counts; boundary is enrolled_count == capacity"

  - name: no_show_strikes
    trigger: "reservation mark-no-show; member reinstate (reset)"
    algorithm: threshold
    input_set: "The booking member."
    formula: |
      on mark-no-show: no_show_strikes = no_show_strikes + 1
      if no_show_strikes >= NO_SHOW_SUSPEND_THRESHOLD:  Member.status -> SUSPENDED (auto)
      on reinstate: no_show_strikes = 0
    constants:
      NO_SHOW_SUSPEND_THRESHOLD: 3
      NO_SHOW_GRACE_MINUTES: 15
    precision: "integer; boundary is '>= 3' (2 does not suspend, 3 does)"

  - name: competition_seeding
    trigger: "competition start (TOURNAMENT format)"
    algorithm: weighted_scoring
    input_set: "Participants of the competition in status ACTIVE."
    formula: |
      require competition.draw_size is a power of two AND equals count(ACTIVE participants), else ERR_INVALID_DRAW_SIZE
      order participants by (seed ASC treating null as +infinity, then created_at ASC)  # created_at tie-break, never id
      assign bracket_slot 1..draw_size in that order
      round-1 pairing: bracket_slot i faces bracket_slot (draw_size + 1 - i)
    precision: "deterministic ordering; ties broken by created_at ASC"

  - name: competition_standings
    trigger: "competition report"
    algorithm: aggregation
    input_set: "The two named participants and, for LADDER, the participants between them."
    formula: |
      winner.wins += 1; loser.losses += 1
      if format == ROUND_ROBIN: winner.points += POINTS_WIN
      if format == TOURNAMENT:  loser.status = ELIMINATED
      if format == LADDER and winner.ladder_rank > loser.ladder_rank:   # lower rank number = higher position
          # PINNED shift rule: winner moves to loser's rank; every participant with rank in
          # [loser.ladder_rank, winner.ladder_rank) shifts down by exactly 1.
          shift the block down by one and set winner.ladder_rank = old loser.ladder_rank
    constants:
      POINTS_WIN: 3
      POINTS_LOSS: 0
    precision: "integer counts"

# =============================================================================
# §1.4 Validation Rules Table (ordered by priority; lower priority = evaluated first = wins)
# =============================================================================
validations:
  - priority: 1
    category: auth
    check: "X-User-Role and X-User-ID headers present and X-User-Role is a known role"
    error_id: ERR_UNAUTHENTICATED
    http_status: 401
    applies_to: all
  - priority: 2
    category: auth
    check: "Acting role is permitted for the operation per §1.7; entity_backed roles acting on their own resource must match X-User-ID"
    error_id: ERR_UNAUTHORIZED
    http_status: 403
    applies_to: all
  - priority: 3
    category: existence
    check: "Every resource id in the path exists (validated left-to-right); FK ids in the body exist"
    error_id: ERR_NOT_FOUND
    http_status: 404
    applies_to: all
  - priority: 4
    category: business_constraint
    check: "Body is well-formed: required fields present, types/enums valid, end_time > start_time, draw_size a power of two"
    error_id: ERR_VALIDATION
    http_status: 400
    applies_to: "all writes"
  - priority: 5
    category: state
    check: "OCC — expected_<parent>_version equals the parent entity's current version"
    error_id: ERR_STALE_VERSION
    http_status: 412
    applies_to: "POST .../change-plan, POST .../reschedule"
  - priority: 6
    category: state
    check: "Target resource is in a valid state for the requested transition (its own state precondition)"
    error_id: ERR_INVALID_STATE
    http_status: 409
    applies_to: "all state-transition endpoints"
  - priority: 7
    category: business_referential
    check: "Cross-entity state dependencies hold: Court.status == AVAILABLE for booking; owning Member.status == ACTIVE for booking/enrolling; member's Subscription.status == ACTIVE for enrolling and for credit spend"
    error_id: varies   # ERR_COURT_NOT_AVAILABLE | ERR_MEMBER_SUSPENDED | ERR_SUBSCRIPTION_NOT_ACTIVE
    http_status: 409
    applies_to: "POST /racquet/reservations, POST /racquet/enrollments"
  - priority: 8
    category: business_temporal
    check: "Interval rules: start_time in the future; within MAX_ADVANCE_DAYS; no court half-open overlap; pro buffer gap >= PRO_BUFFER_MINUTES; check-in/no-show clock windows"
    error_id: varies   # ERR_BOOKING_IN_PAST | ERR_BOOKING_WINDOW_EXCEEDED | ERR_COURT_TIME_CONFLICT | ERR_PRO_TIME_CONFLICT | ERR_CHECKIN_WINDOW | ERR_NO_SHOW_TOO_EARLY
    http_status: 409
    applies_to: "POST /racquet/reservations, POST .../reschedule, POST /racquet/lessons, POST .../check-in, POST .../mark-no-show"
  - priority: 9
    category: business_constraint
    check: "Uniqueness/config constraints: no duplicate reservation (same member+court+start_time non-terminal); no duplicate enrollment/participant; freeze_count < freeze_limit; member has no other non-CANCELLED subscription"
    error_id: varies   # ERR_DUPLICATE_RESERVATION | ERR_DUPLICATE_ENROLLMENT | ERR_DUPLICATE_PARTICIPANT | ERR_FREEZE_LIMIT_REACHED | ERR_SUBSCRIPTION_EXISTS
    http_status: 409
    applies_to: "POST /racquet/reservations, POST /racquet/enrollments, POST /racquet/participants, POST .../freeze, POST /racquet/subscriptions"
  - priority: 10
    category: business_fiscal
    check: "Fiscal ceilings: Member.account_balance_cents must be <= MAX_OUTSTANDING_BALANCE_CENTS to book"
    error_id: ERR_BALANCE_LIMIT_EXCEEDED
    http_status: 402
    applies_to: "POST /racquet/reservations"

