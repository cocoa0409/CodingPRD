            - { call: "POST /claims/${cl}/documents/11111111-2222-3333-4444-555555555555/review", payload: { review_result: "VERIFIED" }, as: ClaimsExaminer, as_user_id: "examiner-2", captures: { e_doc: $.data.error_id } }
            - { call: "POST /beneficiary-designations/11111111-2222-3333-4444-555555555555/revoke", payload: {}, as: PolicyAdministrator, captures: { e_des: $.data.error_id } }
            - { call: "POST /beneficiary-claims/11111111-2222-3333-4444-555555555555/validate", payload: {}, as: ClaimsExaminer, as_user_id: "examiner-1", captures: { e_bc: $.data.error_id } }
            - { call: "POST /payout-elections/11111111-2222-3333-4444-555555555555/confirm", payload: {}, as: ClaimsExaminer, as_user_id: "examiner-1", captures: { e_el: $.data.error_id } }
            - { call: "POST /retained-asset-accounts/11111111-2222-3333-4444-555555555555/withdrawals", payload: { amount_cents: 1 }, as: ClaimsApprover, as_user_id: "approver-1", captures: { e_acct: $.data.error_id } }
            - { call: "POST /death-master-matches/11111111-2222-3333-4444-555555555555/review", payload: { review_outcome: "CONFIRMED" }, as: ComplianceOfficer, captures: { e_match: $.data.error_id } }
