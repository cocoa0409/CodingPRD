  - rule_id: priority_pair_validation_conflict
    instances:
      - name: commit_state_beats_capacity
        grounds:
          - validations[priority=5]
          - validations[priority=11]
          - errors[ERR_INVALID_STATE]
          - errors[ERR_PROGRAM_FULL]
        distinguishing_aspect: |
          Pair state-vs-business_fiscal: committing an application in
          RETURNED_FOR_REVISION against a program whose seat is already taken
          must return ERR_INVALID_STATE (priority 5), not ERR_PROGRAM_FULL
          (priority 11) — both rules are violated by the same request and the
          state-category error wins.
        test_recipe:
          setup:
            - "FR program capacity 1, OPEN; student1's application COMMITTED (seat filled); student2's application RETURNED_FOR_REVISION"
          setup_api_calls:
            - call: "POST /api/v1/partner-agreements"
              payload: { host_institution: "Universite Lyon", country_code: "FR", effective_from: "2026-01-01T00:00:00Z", effective_to: "2028-12-31T23:59:59Z", credit_conversion_factor: 0.75, insurance_required: true }
              as: ProgramCoordinator
              captures: { agr_id: $.data.id }
            - call: "POST /api/v1/partner-agreements/${agr_id}/activate"
              as: ProgramCoordinator
            - call: "POST /api/v1/programs"
              payload: { partner_agreement_id: "${agr_id}", name: "Lyon Spring 2027", country_code: "FR", host_institution: "Universite Lyon", term: "SPRING", start_date: "2027-01-10T00:00:00Z", end_date: "2027-05-10T00:00:00Z", application_deadline: "2026-11-01T00:00:00Z", capacity: 1, billing_model: "PROGRAM_FEE", program_fee_cents: 1800000, min_gpa: 2.75 }
              as: ProgramCoordinator
              captures: { prog_id: $.data.id }
            - call: "POST /api/v1/programs/${prog_id}/publish"
              as: ProgramCoordinator
            - call: "POST /api/v1/students"
              payload: { full_name: "Seat Holder", email: "s1@uni.edu", gpa: 3.00, conduct_standing: "GOOD_STANDING", aid_award_cents: 0 }
              as: ProgramCoordinator
              captures: { stu1: $.data.id }
            - call: "POST /api/v1/applications"
              payload: { student_id: "${stu1}", program_id: "${prog_id}" }
              as: Student
              as_user_id: "${stu1}"
              captures: { app1: $.data.id }
            - call: "POST /api/v1/applications/${app1}/clearance"
              payload: { decision: "CLEARED" }
              as: ProgramCoordinator
              as_user_id: "coord-a"
            - call: "POST /api/v1/applications/${app1}/approve"
              as: ProgramCoordinator
              as_user_id: "coord-b"
            - call: "POST /api/v1/applications/${app1}/commit"
              as: Student
              as_user_id: "${stu1}"
            - call: "POST /api/v1/students"
              payload: { full_name: "Second Student", email: "s2@uni.edu", gpa: 3.00, conduct_standing: "GOOD_STANDING", aid_award_cents: 0 }
              as: ProgramCoordinator
              captures: { stu2: $.data.id }
            - call: "POST /api/v1/applications"
              payload: { student_id: "${stu2}", program_id: "${prog_id}" }
              as: Student
              as_user_id: "${stu2}"
              captures: { app2: $.data.id }
            - call: "POST /api/v1/applications/${app2}/clearance"
              payload: { decision: "RETURNED_FOR_REVISION", notes: "missing transcript" }
              as: ProgramCoordinator
              as_user_id: "coord-a"
          trigger:
            - call: "POST /api/v1/applications/${app2}/commit"
              as: Student
              as_user_id: "${stu2}"
              captures: { err: $.data.error_id }
          assert:
            - "error_id == ERR_INVALID_STATE (state check at priority 5 fires before the capacity check at priority 11, even though the program is also full)"
            - "Application.${app2}.status remains RETURNED_FOR_REVISION"
      - name: safety_beats_temporal_on_enrollment
        grounds:
          - validations[priority=7]
          - validations[priority=8]
          - errors[ERR_TRAVEL_ADVISORY_BLOCK]
          - errors[ERR_COVERAGE_WINDOW_INSUFFICIENT]
        distinguishing_aspect: |
          Pair business_safety-vs-business_temporal (disjoint from the other
          instance's pair): an insurance enrollment whose coverage window is
          too short AND whose program is overlapped by an in-effect
          DO_NOT_TRAVEL advisory must return ERR_TRAVEL_ADVISORY_BLOCK
          (priority 7), not ERR_COVERAGE_WINDOW_INSUFFICIENT (priority 8).
          The advisory window only PARTIALLY overlaps the program
          (2027-05-01..2027-06-01 vs program 2027-01-10..2027-05-10), so the
          full-containment suspension cascade does NOT fire and the
          application stays COMMITTED.
        test_recipe:
          setup:
            - "FR program OPEN; application COMMITTED; logical clock advanced to 2027-05-05T00:00:00Z (inside the partial-overlap advisory window, after the program start)"
          setup_api_calls:
            - call: "POST /api/v1/partner-agreements"
              payload: { host_institution: "Universite Lyon", country_code: "FR", effective_from: "2026-01-01T00:00:00Z", effective_to: "2028-12-31T23:59:59Z", credit_conversion_factor: 0.75, insurance_required: true }
              as: ProgramCoordinator
              captures: { agr_id: $.data.id }
            - call: "POST /api/v1/partner-agreements/${agr_id}/activate"
              as: ProgramCoordinator
            - call: "POST /api/v1/programs"
              payload: { partner_agreement_id: "${agr_id}", name: "Lyon Spring 2027", country_code: "FR", host_institution: "Universite Lyon", term: "SPRING", start_date: "2027-01-10T00:00:00Z", end_date: "2027-05-10T00:00:00Z", application_deadline: "2026-11-01T00:00:00Z", capacity: 30, billing_model: "PROGRAM_FEE", program_fee_cents: 1800000, min_gpa: 2.75 }
              as: ProgramCoordinator
              captures: { prog_id: $.data.id }
            - call: "POST /api/v1/programs/${prog_id}/publish"
              as: ProgramCoordinator
            - call: "POST /api/v1/students"
              payload: { full_name: "Safety Student", email: "safety@uni.edu", gpa: 3.00, conduct_standing: "GOOD_STANDING", aid_award_cents: 0 }
              as: ProgramCoordinator
              captures: { stu_id: $.data.id }
            - call: "POST /api/v1/applications"
              payload: { student_id: "${stu_id}", program_id: "${prog_id}" }
              as: Student
              as_user_id: "${stu_id}"
              captures: { app_id: $.data.id }
            - call: "POST /api/v1/applications/${app_id}/clearance"
              payload: { decision: "CLEARED" }
              as: ProgramCoordinator
              as_user_id: "coord-a"
            - call: "POST /api/v1/applications/${app_id}/approve"
              as: ProgramCoordinator
              as_user_id: "coord-b"
            - call: "POST /api/v1/applications/${app_id}/commit"
              as: Student
              as_user_id: "${stu_id}"
            - call: "POST /api/v1/_clock/set_current_utc"
              payload: { to_iso8601: "2027-05-05T00:00:00Z" }
              as: ProgramCoordinator
            - call: "POST /api/v1/travel-advisories"
              payload: { country_code: "FR", level: "DO_NOT_TRAVEL", effective_from: "2027-05-01T00:00:00Z", effective_to: "2027-06-01T00:00:00Z" }
              as: SafetyOfficer
          trigger:
            - call: "POST /api/v1/insurance-enrollments"
              payload: { application_id: "${app_id}", provider: "GlobalCare", coverage_start_date: "2027-01-01T00:00:00Z", coverage_end_date: "2027-05-01T00:00:00Z" }
              as: Student
              as_user_id: "${stu_id}"
              captures: { err: $.data.error_id }
          assert:
            - "error_id == ERR_TRAVEL_ADVISORY_BLOCK (safety, priority 7) even though coverage_end_date 2027-05-01 < program end 2027-05-10 also violates the temporal containment rule (priority 8)"
            - "Application.${app_id}.status remains COMMITTED (partial overlap did not trigger the suspension cascade)"

  - rule_id: boundary_precision_check
    instances:
      - name: gpa_exactly_at_minimum
        grounds:
          - validations[priority=10]
          - entities.Program.fields.min_gpa
          - errors[ERR_GPA_BELOW_MINIMUM]
        distinguishing_aspect: |
          GPA metric boundary on POST /api/v1/applications: eligibility is
          gpa >= min_gpa, so exactly 2.75 (the pinned minimum) is admitted
          while 2.74 is rejected with ERR_GPA_BELOW_MINIMUM.
        test_recipe:
          setup:
            - "FR program OPEN with min_gpa 2.75; two students with gpa 2.75 and 2.74 respectively"
          setup_api_calls:
            - call: "POST /api/v1/partner-agreements"
              payload: { host_institution: "Universite Lyon", country_code: "FR", effective_from: "2026-01-01T00:00:00Z", effective_to: "2028-12-31T23:59:59Z", credit_conversion_factor: 0.75, insurance_required: true }
              as: ProgramCoordinator
              captures: { agr_id: $.data.id }
            - call: "POST /api/v1/partner-agreements/${agr_id}/activate"
              as: ProgramCoordinator
            - call: "POST /api/v1/programs"
              payload: { partner_agreement_id: "${agr_id}", name: "Lyon Spring 2027", country_code: "FR", host_institution: "Universite Lyon", term: "SPRING", start_date: "2027-01-10T00:00:00Z", end_date: "2027-05-10T00:00:00Z", application_deadline: "2026-11-01T00:00:00Z", capacity: 30, billing_model: "PROGRAM_FEE", program_fee_cents: 1800000, min_gpa: 2.75 }
              as: ProgramCoordinator
              captures: { prog_id: $.data.id }
            - call: "POST /api/v1/programs/${prog_id}/publish"
              as: ProgramCoordinator
            - call: "POST /api/v1/students"
              payload: { full_name: "Edge In", email: "edgein@uni.edu", gpa: 2.75, conduct_standing: "GOOD_STANDING", aid_award_cents: 0 }
              as: ProgramCoordinator
              captures: { stu_in: $.data.id }
            - call: "POST /api/v1/students"
              payload: { full_name: "Edge Out", email: "edgeout@uni.edu", gpa: 2.74, conduct_standing: "GOOD_STANDING", aid_award_cents: 0 }
              as: ProgramCoordinator
              captures: { stu_out: $.data.id }
