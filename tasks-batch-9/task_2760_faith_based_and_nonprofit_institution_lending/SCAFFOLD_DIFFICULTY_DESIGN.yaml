  - rule_id: boundary_precision_check
    instances:
      - name: dscr_ratio_exactly_at_threshold_passes
        grounds:
          - calculations.dscr_covenant_ratio
          - entities.Covenant.fields.last_test_ratio
          - entities.Covenant.fields.threshold_ratio
          - endpoints["POST /covenants/{covenant_id}/tests"]
        distinguishing_aspect: |
          annual_debt_service_cents 36000200 gives denominator 360002 and a RAW quotient
          of 432001/360002 = 1.19999333..., which round_half_up to 4 places turns into
          exactly 1.2000. The threshold-1.2000 covenant must therefore PASS on the
          inclusive boundary: an implementation that compares the unrounded quotient
          (1.19999333 < 1.2000) reports FAIL and breaches a compliant loan. The
          threshold-1.2001 covenant on the same loan and the same as_of_date must FAIL,
          and the threshold-1.1999 covenant must PASS, so the test pins rounding AND the
          >= direction with one ten-thousandth of resolution.
        test_recipe:
          setup:
            - "The reference borrower funded with annual_debt_service_cents 36000200, so the DSCR denominator is 360002 dollars against a 432001-dollar numerator."
            - "Three DSCR_UNRESTRICTED_GIVING covenants on that loan with threshold_ratio 1.2000, 1.1999 and 1.2001."
