      - name: closing_a_worked_call_again_and_returning_a_returned_issue_again_are_rejected
        claim_type: triggerable
        grounds:
          - errors.ERR_INVALID_LABOR_CALL_STATE
          - errors.ERR_INVALID_ISSUE_STATE
          - state_machines.LaborCall
          - state_machines.EquipmentIssue
          - calculations.labor_call_cost_cents
        distinguishing_aspect: "The two remaining lifecycle guards are reached from their terminal states: closing a WORKED LaborCall a second time gives 409 ERR_INVALID_LABOR_CALL_STATE and returning a RETURNED EquipmentIssue a second time gives 409 ERR_INVALID_ISSUE_STATE, with neither ledger double-counted."
        test_recipe:
          setup:
            - "The standard turnaround fixture plus a 6-unit STAGE_DECK pool, one overnight STAGEHAND call of 10 heads already closed at 8 actual hours, and one 2-unit equipment issue already returned undamaged."
