  - rule_id: resource_temporal_overlap
    instances:
      - name: refresh_cycle_single_open_interval_per_facility
        grounds:
          - validations[priority=11]
          - state_machines.RefreshCycle
        distinguishing_aspect: |
          Interval semantics: a RefreshCycle is a half-open occupancy of the facility's 'current
          epoch' — at most one OPEN cycle may exist per facility at any time; opening a second while
          one is OPEN is rejected even though their epochs would differ (occupancy semantics, not
          arithmetic overlap).
        test_recipe:
          setup:
            - "Facility F with RefreshCycle C1 OPEN (epoch 1)"
          setup_api_calls:
            - call: "POST /fca/clients"
              payload: { name: "Omicron Inc", contact_email: "o@omicron.example" }
              as: Consultant
              captures: { client_id: "$.data.id" }
            - call: "POST /fca/facilities"
              payload: { client_id: "${client_id}", name: "Pool", address: "1 Aqua Dr", gross_square_feet: 9000 }
              as: Consultant
              captures: { fac_id: "$.data.id" }
            - call: "POST /fca/facilities/${fac_id}/refresh-cycles"
              payload: {}
              as: Consultant
              captures: { cyc1: "$.data.id", cyc1_epoch: "$.data.epoch" }
          trigger:
            - call: "POST /fca/facilities/${fac_id}/refresh-cycles"
              payload: {}
              as: Consultant
              captures: { err_dup: "$.data.error_id" }
          assert:
            - "second open attempt fails with ERR_DUPLICATE (single OPEN interval occupancy per facility)"
            - "RefreshCycle.${cyc1}.epoch == 1 and remains OPEN"
      - name: waterfall_year_bucket_capacity_overlap
        grounds:
          - calculations.waterfall_allocation
        distinguishing_aspect: |
          Different interval semantics on a different resource: each plan year is an aggregate
          capacity bucket (annual_budget_cents) and two items recommended for the SAME year contend
          for that shared capacity — aggregate-capacity contention, not single-occupancy exclusion;
          the loser is not an error but an UNFUNDED item.
        test_recipe:
          setup:
            - "Facility F, one ACTIVE system; D1 cost 70000000 sev 5 urg 5 rec 2027 (score 5.00, created first); D2 cost 70000000 sev 4 urg 4 rec 2027 (score 4.00)"
            - "Plan P 2027 horizon 2; Scenario S budget 100000000 esc 0.0"
          setup_api_calls:
            - call: "POST /fca/clients"
              payload: { name: "Pi AG", contact_email: "p@pi.example" }
              as: Consultant
              captures: { client_id: "$.data.id" }
            - call: "POST /fca/facilities"
              payload: { client_id: "${client_id}", name: "Hangar", address: "2 Runway Rd", gross_square_feet: 45000 }
              as: Consultant
              captures: { fac_id: "$.data.id", fac_v: "$.data.version" }
            - call: "POST /fca/asset-systems"
              payload: { facility_id: "${fac_id}", system_category: "STRUCTURE", name: "Frame", install_year: 1998, design_life_years: 50, replacement_cost_cents: 900000000, condition_rating: 3 }
              as: Consultant
              captures: { sys_id: "$.data.id" }
            - call: "POST /fca/deficiencies"
              payload: { asset_system_id: "${sys_id}", description: "D1 beam corrosion", cost_estimate_cents: 70000000, severity: 5, urgency: 5, recommended_year: 2027 }
              as: Consultant
              captures: { d1_id: "$.data.id" }
            - call: "POST /fca/deficiencies"
              payload: { asset_system_id: "${sys_id}", description: "D2 joint seals", cost_estimate_cents: 70000000, severity: 4, urgency: 4, recommended_year: 2027 }
              as: Consultant
              captures: { d2_id: "$.data.id" }
            - call: "POST /fca/capital-plans"
              payload: { facility_id: "${fac_id}", title: "P", start_year: 2027, horizon_years: 2, expected_facility_version: "${fac_v}" }
              as: CapitalPlanner
              captures: { plan_id: "$.data.id", plan_v: "$.data.version" }
            - call: "POST /fca/funding-scenarios"
