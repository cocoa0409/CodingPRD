              as_user_id: "${b_id}"
              captures: { enr_b: $.data.id }
            - call: "GET /cohorts/${cohort_id}"
              payload: {}
              as: Registrar
              captures: { cohort_vnow: $.data.version }
          trigger:
            - call: "POST /enrollments/${enr_a}/cancel"
              payload: { expected_cohort_version: "${cohort_vnow}" }
              as: Student
              as_user_id: "${a_id}"
          assert:
            - "Cohort.${cohort_id}.seats_committed == 0"
            - "Enrollment.${enr_a}.status == CANCELLED"
            - "Enrollment.${enr_b}.status == PENDING_PAYMENT"
            - "seats_committed (0) <= seat_capacity (1) holds; the freed seat is held by the promoted enrollment B"
