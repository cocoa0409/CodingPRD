    description: "List the licences bound to a distribution territory"
    roles: [LicensingOfficer, EditorialStaff]
    code: 200
    input: ["limit?", "offset?"]
    output: LicensingAgreement[]
    side_effects: []
  - method: POST
    path: "/cpt/licensing-agreements/{id}/activations"
    description: "Activate a licence once its territory and fee gate are satisfied"
    roles: [LicensingOfficer]
    code: 200
    input: []
    output: LicensingAgreement
    side_effects: ["royalty_fee_cents recomputed by license_royalty_schedule", "distribution_scope recomputed by license_territory_scope_derivation", "fee_threshold_gate_status recomputed", "activated_at stamped", "increments LicensingAgreement.version by 1"]
  - method: POST
    path: "/cpt/licensing-agreements/{id}/suspensions"
    description: "Suspend an active licence"
    roles: [LicensingOfficer]
    code: 200
    input: [reason]
    output: LicensingAgreement
    side_effects: ["distribution_scope recomputed and frozen at its last value", "increments LicensingAgreement.version by 1"]
  - method: POST
    path: "/cpt/licensing-agreements/{id}/reactivations"
    description: "Reactivate a suspended licence"
    roles: [LicensingOfficer]
    code: 200
    input: []
    output: LicensingAgreement
    side_effects: ["royalty_fee_cents recomputed by license_royalty_schedule", "increments LicensingAgreement.version by 1"]
  - method: POST
    path: "/cpt/licensing-agreements/{id}/terminations"
    description: "Terminate a licence and cascade its scope and delivery consequences"
    roles: [LicensingOfficer]
    code: 200
    input: [reason]
    output: LicensingAgreement
    side_effects: ["every released ContentDeliveryOrder carrying this licence set to WITHDRAWN", "distribution_scope recomputed to INTERNAL_ONLY", "the bound DistributionTerritory set to WITHDRAWN", "increments LicensingAgreement.version by 1"]
  - method: POST
    path: "/cpt/content-delivery-orders"
    description: "Reserve a content delivery slot under a licence"
    roles: [Licensee, LicensingOfficer]
    code: 201
    input: [license_id, distribution_channel, format_params, "payer_identifier?", expected_license_version]
    output: ContentDeliveryOrder
    side_effects: ["delivery_status set to RESERVED", "activation_mode recomputed from channel and format parameters", "the LicensingAgreement named by license_id has version incremented by 1", "reserved_at stamped"]
  - method: GET
    path: "/cpt/content-delivery-orders"
    description: "List content delivery orders with filters"
    roles: [Licensee, LicensingOfficer, EditorialStaff]
    code: 200
    input: ["license_id?", "delivery_status?", "distribution_channel?", "limit?", "offset?"]
    output: ContentDeliveryOrder[]
    side_effects: []
  - method: GET
    path: "/cpt/content-delivery-orders/{id}"
    description: "Read one content delivery order"
    roles: [Licensee, LicensingOfficer, EditorialStaff]
    code: 200
    input: []
    output: ContentDeliveryOrder
    side_effects: []
  - method: POST
    path: "/cpt/content-delivery-orders/{id}/readiness"
    description: "Mark a reserved delivery ready for release"
    roles: [EditorialStaff]
    code: 200
    input: [media]
    output: ContentDeliveryOrder
    side_effects: ["delivery_status set to READY", "ready_at stamped", "increments ContentDeliveryOrder.version by 1"]
  - method: POST
    path: "/cpt/content-delivery-orders/{id}/releases"
    description: "Release a ready delivery"
    roles: [EditorialStaff]
    code: 200
    input: []
    output: ContentDeliveryOrder
    side_effects: ["delivery_status set to RELEASED", "the LicensingAgreement named by license_id has version incremented by 1", "released_at stamped", "increments ContentDeliveryOrder.version by 1"]
  - method: POST
    path: "/cpt/content-delivery-orders/{id}/withdrawals"
    description: "Withdraw a reserved delivery"
    roles: [Licensee]
    code: 200
    input: [reason]
    output: ContentDeliveryOrder
    side_effects: ["delivery_status set to WITHDRAWN", "increments ContentDeliveryOrder.version by 1"]
  - method: GET
    path: "/cpt/licensing-agreements/{id}/content-delivery-orders"
    description: "List the delivery orders filed under a licence"
    roles: [Licensee, LicensingOfficer, EditorialStaff]
    code: 200
    input: ["limit?", "offset?"]
    output: ContentDeliveryOrder[]
    side_effects: []
  - method: POST
    path: "/cpt/education-activities"
    description: "Register a coding education activity delivered under a licence"
    roles: [LicensingOfficer]
    code: 201
    input: [licensee_id, activity_code, clock_hours, "assistant_targeted?"]
    output: CodingEducationActivity
    side_effects: ["cea_credits_awarded and cea_credits_rounded recomputed by education_credit_conversion"]
  - method: GET
    path: "/cpt/education-activities"
    description: "List coding education activities with filters"
    roles: [LicensingOfficer, EditorialStaff, Licensee]
    code: 200
    input: ["licensee_id?", "activity_status?", "assistant_targeted?", "limit?", "offset?"]
    output: CodingEducationActivity[]
    side_effects: []
  - method: GET
    path: "/cpt/education-activities/{id}"
    description: "Read one coding education activity"
    roles: [LicensingOfficer, EditorialStaff, Licensee]
    code: 200
    input: []
    output: CodingEducationActivity
    side_effects: []
  - method: GET
    path: "/cpt/licensing-agreements/{id}/education-activities"
    description: "List the education activities delivered under a licence"
    roles: [LicensingOfficer, EditorialStaff, Licensee]
    code: 200
    input: ["limit?", "offset?"]
    output: CodingEducationActivity[]
    side_effects: []
  - method: POST
    path: "/cpt/education-activities/{id}/completions"
    description: "Complete an education activity and award its CEA credits"
    roles: [LicensingOfficer]
    code: 200
    input: []
    output: CodingEducationActivity
    side_effects: ["cea_credits_awarded recomputed by education_credit_conversion", "activity_status set to COMPLETED", "completed_at stamped", "increments CodingEducationActivity.version by 1"]
  - method: POST
    path: "/cpt/interpretation-requests"
    description: "File a request for a written code interpretation"
    roles: [LicensingOfficer]
    code: 201
    input: [requesting_licensee_id, code, question]
    output: InterpretationRequest
    side_effects: ["entitlement_status recomputed by assistant_interpretation_entitlement"]
  - method: GET
    path: "/cpt/interpretation-requests"
    description: "List interpretation requests with filters"
    roles: [EditorialStaff, LicensingOfficer, Licensee]
    code: 200
    input: ["response_status?", "requesting_licensee_id?", "limit?", "offset?"]
    output: InterpretationRequest[]
    side_effects: []
  - method: GET
    path: "/cpt/interpretation-requests/{id}"
    description: "Read one interpretation request"
    roles: [EditorialStaff, LicensingOfficer, Licensee]
    code: 200
    input: []
    output: InterpretationRequest
    side_effects: []
  - method: GET
    path: "/cpt/licensing-agreements/{id}/interpretation-requests"
    description: "List the interpretation requests filed by a licensee"
    roles: [EditorialStaff, LicensingOfficer, Licensee]
    code: 200
    input: ["limit?", "offset?"]
    output: InterpretationRequest[]
    side_effects: []
  - method: POST
    path: "/cpt/interpretation-requests/{id}/answers"
    description: "Answer an entitled interpretation request"
    roles: [EditorialStaff]
    code: 200
    input: [answer_text]
    output: InterpretationRequest
    side_effects: ["response_status set to ANSWERED", "answered_at stamped", "increments InterpretationRequest.version by 1"]
  - method: POST
    path: "/cpt/_clock/set_current_utc"
    description: "Test-driving endpoint: set the server's logical clock. The clock reads 2026-09-01T00:00:00Z before any call and never falls back to wall-clock time"
    roles: [EditorialStaff]
    code: 200
    input: [to_iso8601]
    output: null
    side_effects: ["the logical clock used by every deadline, expiry and window rule is set to the supplied instant", "applies every time-triggered transition whose precondition the new instant satisfies, including the comment-window closure that moves a POSTED_FOR_COMMENT change to ADMIN_REVIEW"]

errors:
  - id: ERR_UNAUTHENTICATED
    http: 401
    condition: "X-User-Role or X-User-ID header absent, malformed, or naming an undeclared role"
  - id: ERR_UNAUTHORIZED
    http: 403
    condition: "acting role is not permitted for the endpoint, or segregation of duties forbids the acting X-User-ID"
  - id: ERR_NOT_FOUND
    http: 404
    condition: "a path-identified resource or a referenced body foreign key does not resolve"
  - id: ERR_CODE_ALREADY_EXISTS
    http: 409
    condition: "a CodeChange is filed with a descriptor number already present"
  - id: ERR_CODE_FORMAT_INVALID
    http: 422
    condition: "a descriptor is not exactly 5 characters, or ends in a letter outside A through J"
  - id: ERR_EVIDENCE_INSUFFICIENT
    http: 422
    condition: "TIER_IV evidence is supplied for an ADDITION whose procedure_volume_threshold is below 100"
  - id: ERR_ADVISORY_REVIEW_NOT_READY
    http: 409
    condition: "an advisory committee review is opened against a change whose evidence tier is TIER_IV or whose administrative review has already completed"
  - id: ERR_MEETING_NOT_OPEN
    http: 409
    condition: "a change is docketed at a meeting whose meeting_status is neither SCHEDULED nor PUBLIC_COMMENT_OPEN"
  - id: ERR_NO_QUORUM
    http: 409
    condition: "fewer than three distinct changes are docketed at the meeting, so quorum_present is false"
  - id: ERR_ALREADY_REFERRED_TO_JUNE_MINUTES
    http: 409
    condition: "a determination is attempted on a change already held for full-panel action"
  - id: ERR_APPROVAL_PERCENT_TOO_LOW
    http: 409
    condition: "the citation-mode weighted approval floor of two-thirds is not met, or more than one percent of the weighted yes vote is cast from outside the seated societies"
  - id: ERR_CYCLE_LIMIT_EXCEEDED
    http: 422
    condition: "a change with cycles_in_process already at 3 is carried into a fourth cycle"
  - id: ERR_COMMENT_PERIOD_TOO_SHORT
    http: 422
    condition: "a public comment window shorter than 30 whole days is posted, including one falling a single day short"
  - id: ERR_FREQUENT_FAMILY_EXEMPLAR_REQUIRED
    http: 422
    condition: "a TIER_IV change is docketed for a February, April, August, October or December meeting, which admits only frequent-family exemplars"
  - id: ERR_CHANGE_NOT_READY_FOR_PANEL
    http: 409
    condition: "a change is advanced to panel review while a public comment on it names an interested party that counts toward that meeting's quorum"
  - id: ERR_INVALID_STATE
    http: 409
    condition: "the target resource is not in a state that admits the requested operation"
  - id: ERR_ALREADY_TERMINAL
    http: 409
    condition: "a change whose determination is already APPROVED is reverted to draft"
  - id: ERR_DELEGATION_REQUIRED
    http: 422
    condition: "a REVISION is filed without a proposed descriptor, or a DELEGATION-category change is filed without parenthetical instructions"
  - id: ERR_EDITORIAL_BUDGET_EXHAUSTED
    http: 422
    condition: "a release cycle is closed while discretionary_codes is below 40"
  - id: ERR_LICENSE_FEE_BELOW_MINIMUM
    http: 422
    condition: "a licence is activated while fee_threshold_gate_status is BELOW_MINIMUM because sales_unit_count is under 4"
  - id: ERR_ELECTRONIC_MEDIA_REQUIRED
    http: 422
    condition: "an EDI delivery omits payer_identifier or a version qualifier, or a non-site delivery omits required media"
  - id: ERR_VERSION_QUALIFIER_REQUIRED
    http: 422
    condition: "an electronic delivery omits the version qualifier required for the 2026.1 or later metadata schema"
  - id: ERR_LICENSE_TERRITORY_RESERVED
    http: 409
    condition: "a licence on the DISTRIBUTION or REPRINT method is activated while its territory_status is RESERVED"
  - id: ERR_ERRATA_WINDOW_CLOSED
    http: 409
    condition: "an errata notice is published with an effective date after the release's errata_deadline"
  - id: ERR_NOT_ENTITLED
    http: 403
    condition: "an interpretation request is answered while its entitlement_status is NOT_ENTITLED"
  - id: ERR_ADVISORY_REVIEW_INCOMPLETE
    http: 409
    condition: "an advisory committee review is closed without quorum or without a positive ballot total"
  - id: ERR_VALUATION_NOT_FORWARDABLE
    http: 409
    condition: "a value recommendation is forwarded at or after its effective date, or while its payability_status is already PAYABLE_LOCKED"
  - id: ERR_EDUCATION_NOT_COMPLETED
    http: 409
    condition: "an education activity is completed from a state other than REGISTERED"
  - id: ERR_STALE_VERSION
    http: 412
    condition: "an expected_*_version field does not match the parent's current version"
  - id: ERR_MISSING_DESCRIPTOR
    http: 422
    condition: "a descriptor hole falls inside the range a release would publish"
  - id: ERR_NO_HOLD_KIND
    http: 422
    condition: "the reference committee requests a hold without naming the hold basis"
  - id: ERR_APPROVAL_SCOPE_EXCEEDED
    http: 409
    condition: "more than one percent of the weighted yes vote was cast from outside the seated societies"
  - id: ERR_CORRECTION_INVALID
    http: 422
    condition: "a corrected proration ratio is supplied outside the open interval between zero and one"
  - id: ERR_DUPLICATE_VOTE
    http: 409
    condition: "a society attempts to add a second ballot on the same change at the same meeting without superseding its earlier ballot"
  - id: ERR_UNSUPPORTED_RELEASE
    http: 422
    condition: "a value recommendation release names a kind outside the four permitted release kinds"
  - id: ERR_SPONSOR_REQUIRED
    http: 422
    condition: "a change is submitted into a release cycle without a sponsoring society on record"
  - id: ERR_DUPLICATE_DELIVERY_RESERVATION
    http: 409
    condition: "a licence already holds a delivery order in RESERVED or READY, so its reserved delivery slot is occupied"
  - id: ERR_TERRITORY_OCCUPIED
    http: 409
    condition: "a distribution territory is already bound by a non-terminated licence"
  - id: ERR_MEETING_SLOT_OCCUPIED
    http: 409
    condition: "a change already carries a meeting docket slot and cannot be re-docketed while that slot is open"
  - id: ERR_SUPPORT_DATA_REQUIRED
    http: 422
    condition: "a category III addition is advanced without supporting data in its evidence packet"

roles:
  - name: EditorialStaff
    description: "Editorial office staff who screen applications, post changes, schedule meetings and release the code set"
    identity: opaque
    exclusive_operations:
      - "POST /cpt/release-cycles/{id}/releases"
      - "POST /cpt/errata-notices/{id}/publications"
      - "POST /cpt/code-changes/{id}/postings"
    shared_operations:
      - "POST /cpt/code-changes"
      - "POST /cpt/licensing-agreements/{id}/terminations"
  - name: EditorialPanelChair
    description: "Chair of the editorial panel who opens meetings, records determinations and forwards valuations"
    identity: opaque
    exclusive_operations:
      - "POST /cpt/code-changes/{id}/determinations"
      - "POST /cpt/meetings/{id}/closures"
      - "POST /cpt/errata-reviews/{id}/outcomes"
    shared_operations:
      - "POST /cpt/code-changes/{id}/referrals"
  - name: CommitteeReviewer
    description: "Advisory committee and recommending committee member recorded as a persisted reviewer"
    identity: entity_backed:AdvisoryCommitteeReview
    exclusive_operations:
      - "POST /cpt/committee-reviews/{id}/decisions"
      - "POST /cpt/ruc-value-recommendations/{id}/recommendations"
    shared_operations:
      - "POST /cpt/ruc-value-recommendations/{id}/votes"
  - name: LicensingOfficer
    description: "Licensing officer who issues code set licences, territories and distribution waivers"
    identity: opaque
    exclusive_operations:
      - "POST /cpt/licensing-agreements"
      - "POST /cpt/distribution-territories/{id}/reservations"
      - "POST /cpt/content-delivery-orders/{id}/readiness"
    shared_operations:
      - "POST /cpt/content-delivery-orders"
  - name: Licensee
    description: "A payer, vendor, provider or educator holding a licence, backed by its LicensingAgreement row"
    identity: entity_backed:LicensingAgreement
    exclusive_operations:
      - "POST /cpt/public-comments"
    shared_operations:
      - "GET /cpt/licensing-agreements/{id}"
      - "POST /cpt/content-delivery-orders"
  - name: ChangeApplicant
    description: "A stakeholder applicant filing change applications and public comments, backed by its ChangeApplicant row"
    identity: entity_backed:ChangeApplicant
    exclusive_operations:
      - "DELETE /cpt/code-changes/{id}"
      - "POST /cpt/public-comments/{id}/withdrawals"
    shared_operations:
      - "GET /cpt/code-changes/{id}"
      - "POST /cpt/code-changes"
