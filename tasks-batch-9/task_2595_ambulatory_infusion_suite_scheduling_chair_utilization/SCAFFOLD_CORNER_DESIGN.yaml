            - call: "POST /appointments"
              payload: { center_id: "${ctr}", patient_id: "${pt_r}", treatment_plan_id: "${pl_r}", template_id: "${tp1}", service_date: "2026-08-01", requested_start_minute: 870, cycle_number: 1, booking_class: "SAME_DAY_ADDON" }
