              as: StoreManager
            - call: "POST /dough-batches/${db_id}/advance"
              payload: {}
              as: CrewMember
            - call: "POST /cheese-batches/${cb_id}/advance"
              payload: {}
              as: CrewMember
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-11-03T10:35:00Z" }
