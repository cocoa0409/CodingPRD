        distinguishing_aspect: |
          Conserved quantity: sum(Charge.amount_cents where reference_type ==
          MESSAGE). Forward action (send + drain) adds 115 cents for a 1-segment
          VZW message; the compensating action (cancel after FAILED outcome)
          adds 0 — invariant: total message-linked charges are identical before
          and after the cancel.
