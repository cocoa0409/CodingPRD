  - rule_id: boundary_precision_check
    instances:
      - name: election_deadline_exact_second_accepted
        grounds:
          - validations[priority=10]
          - entities.CorporateActionEvent.fields.election_deadline
        distinguishing_aspect: |
          Timestamp boundary with inclusive <= semantics: a submission at exactly
          2026-05-20T16:00:00Z succeeds (201), while one second later
          (16:00:01Z) fails with ERR_ELECTION_DEADLINE_PASSED.
