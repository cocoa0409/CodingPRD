              as: SystemAdmin
              captures: { rev1_id: $.data.id, cap: $.data.review_workload_capacity_minutes, assigned_0: $.data.review_workload_assigned_minutes, remaining_0: $.data.review_workload_remaining_minutes, open_0: $.data.open_assignment_count }
            - call: "POST /cds/vendor-releases"
              payload: { vendor_name: "FDB", release_label: "2026.08", content_domain: "DOSING_RULE" }
              as: PharmacyInformaticist
              as_user_id: "${pharm_id}"
              captures: { vr_id: $.data.id }
            - call: "POST /cds/content-requests"
              payload:
                title: "Insulin infusion order set and hard stop"
                request_type: "BOTH"
                clinical_domain: "ENDOCRINOLOGY"
                urgency: "ROUTINE"
                evidence_grade: "A"
                clinical_sponsor_id: "${sponsor_id}"
                patient_safety_flag: false
                evidence_citations:
                  - { citation: "ADA 2026 standards", peer_reviewed: true }
                  - { citation: "ISMP high-alert list 2025", peer_reviewed: true }
              as: ClinicalSponsor
              as_user_id: "${sponsor_id}"
              captures: { cr_id: $.data.id }
            - call: "POST /cds/content-requests/${cr_id}/triage"
              payload: { decision: "ACCEPT" }
              as: CommitteeChair
