# =============================================================================
# §1.8 Scaffold Difficulty Design (Test Targeting Index)
# task_0369_trophy_awards_engraving
# 9 rule_ids x >=2 instances = 20 instances
# All formula-derived asserts are precomputed literals.
# =============================================================================
scaffold_difficulty_design:

  # ===========================================================================
  - rule_id: dual_variant_calc
    instances:
      # ---- 1: ESTIMATE vs INVOICE pricing on the Order domain ----
      - name: order_pricing_estimate_vs_invoice_diverge_on_promo
        grounds:
          - calculations.order_pricing
          - entities.Order.fields.estimate_total_cents
          - entities.Order.fields.invoice_total_cents
          - state_machines.Order.DRAFT_to_PRICED
          - state_machines.Order.PRICED_to_CONFIRMED
        distinguishing_aspect: |
          On the Order domain, ESTIMATE omits the promo entirely while INVOICE redeems it:
          estimate_total_cents == 203781 but invoice_total_cents == 187479 for identical lines.
        test_recipe:
          setup:
            - "Active EXPEDITED-capable RushPolicy (expedited 0.25, rush 0.50, rush_min_business_days 1)."
            - "PERCENT promo 'SAVE10' 0.10 off, min_subtotal 100000, active."
            - "CatalogProduct base 5000c, per_char 50c, logo_fee 2000c, standard_lead_days 5, one BOM component in plenty."
            - "Clock = Mon 2026-06-15; due 2026-06-18 -> business_days=3 -> EXPEDITED."
            - "Order with one line qty=30 text 'CHAMPION 2026' (13 chars) include_logo=true, promo 'SAVE10'; one APPROVED proof; priced then confirmed."
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-06-15T00:00:00Z" }
              as: Anonymous
            - call: "POST /rush-policies"
              payload: { name: "std", expedited_surcharge_pct: 0.25, rush_surcharge_pct: 0.50, rush_min_business_days: 1, active: true }
              as: ShopManager
            - call: "POST /promo-codes"
              payload: { code: "SAVE10", kind: "PERCENT", percent_off: 0.10, min_subtotal_cents: 100000, active: true }
              as: ShopManager
              captures: { promo_id: $.data.id }
            - call: "POST /components"
              payload: { code: "BASE-1", name: "Base", on_hand_qty: 100, reorder_point: 0 }
              as: ShopManager
              captures: { comp_id: $.data.id }
            - call: "POST /catalog-products"
              payload: { sku: "ASA-1", name: "Acrylic Star Award", product_type: "ACRYLIC", base_price_cents: 5000, engraving_price_per_char_cents: 50, logo_setup_fee_cents: 2000, standard_lead_days: 5, bom: [{ component_id: "${comp_id}", qty_per_unit: 1 }] }
              as: ShopManager
              captures: { prod_id: $.data.id }
            - call: "POST /customers"
              payload: { email: "c1@x.com", full_name: "C One" }
              as: Anonymous
              captures: { cust_id: $.data.id }
            - call: "POST /orders"
              payload: { customer_id: "${cust_id}", service_level: "EXPEDITED", due_date: "2026-06-18T00:00:00Z", promo_code_id: "${promo_id}" }
              as: Customer
              as_user_id: "${cust_id}"
              captures: { order_id: $.data.id }
            - call: "POST /orders/${order_id}/lines"
              payload: { catalog_product_id: "${prod_id}", quantity: 30, engraving_text: "CHAMPION 2026", include_logo: true }
              as: Customer
              as_user_id: "${cust_id}"
              captures: { line_id: $.data.id }
            - call: "POST /order-lines/${line_id}/proofs"
              payload: { proof_kind: "TEXT", content_ref: "CHAMPION 2026" }
              as: ShopStaff
              captures: { proof_id: $.data.id }
            - call: "POST /order-lines/${line_id}/proofs/${proof_id}/send"
              payload: {}
              as: ShopStaff
            - call: "POST /order-lines/${line_id}/proofs/${proof_id}/approve"
              payload: {}
              as: Customer
              as_user_id: "${cust_id}"
            - call: "POST /orders/${order_id}/price"
              payload: {}
              as: ShopStaff
              captures: { est_total: $.data.estimate_total_cents, ord_v: $.data.version }
          trigger:
            - call: "POST /orders/${order_id}/confirm"
              payload: { expected_order_version: "${ord_v}" }
              as: Customer
              as_user_id: "${cust_id}"
              captures: { inv_total: $.data.invoice_total_cents }
          assert:
            - "Order.${order_id}.estimate_total_cents == 203781"
            - "Order.${order_id}.invoice_total_cents == 187479"
            - "Order.${order_id}.estimate_subtotal_cents == 163025"
            - "Order.${order_id}.invoice_subtotal_cents == 163025"
            - "Order.${order_id}.estimate_total_cents - Order.${order_id}.invoice_total_cents == 16302"

      # ---- 2: Component stock has two valid gates on a different domain ----
      - name: component_available_vs_physical_two_gates_diverge
        grounds:
          - calculations.component_available
          - entities.Component.fields.available_qty
          - entities.Component.fields.on_hand_qty
          - validations[priority=12]
          - state_machines.OrderLine.ENGRAVING_to_ASSEMBLED
        distinguishing_aspect: |
          On the Component domain, confirm gates on available_qty (on_hand - reserved) while assemble
          gates on physical on_hand_qty; a component with on_hand 5, none reserved, lets confirm reserve
          qty=5 (available passes) yet a *second* order's confirm needing 1 more fails ERR_COMPONENT_SHORTAGE
          even though on_hand is still physically 5 — proving the two interpretations diverge.
        test_recipe:
          setup:
            - "Component on_hand_qty=5, reorder_point=0."
            - "Product BOM consumes 1 unit/unit; STANDARD policy, due far out."
            - "Order A: line qty=5 confirmed -> reserves all 5 (available_qty -> 0)."
            - "Order B: line qty=1 priced; confirm must fail ERR_COMPONENT_SHORTAGE because available_qty==0, despite on_hand still 5."
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-06-15T00:00:00Z" }
              as: Anonymous
            - call: "POST /rush-policies"
              payload: { name: "std", expedited_surcharge_pct: 0.25, rush_surcharge_pct: 0.50, rush_min_business_days: 1, active: true }
              as: ShopManager
            - call: "POST /components"
              payload: { code: "BASE-2", name: "Base", on_hand_qty: 5, reorder_point: 0 }
              as: ShopManager
              captures: { comp_id: $.data.id }
            - call: "POST /catalog-products"
              payload: { sku: "ASA-2", name: "Plaque", product_type: "PLAQUE", base_price_cents: 1000, engraving_price_per_char_cents: 0, logo_setup_fee_cents: 0, standard_lead_days: 3, bom: [{ component_id: "${comp_id}", qty_per_unit: 1 }] }
              as: ShopManager
              captures: { prod_id: $.data.id }
            - call: "POST /customers"
              payload: { email: "c2@x.com", full_name: "C Two" }
              as: Anonymous
              captures: { cust_id: $.data.id }
            - call: "POST /orders"
              payload: { customer_id: "${cust_id}", service_level: "STANDARD", due_date: "2026-07-15T00:00:00Z" }
              as: Customer
              as_user_id: "${cust_id}"
              captures: { order_a: $.data.id }
            - call: "POST /orders/${order_a}/lines"
              payload: { catalog_product_id: "${prod_id}", quantity: 5 }
              as: Customer
              as_user_id: "${cust_id}"
              captures: { line_a: $.data.id }
            - call: "POST /order-lines/${line_a}/proofs"
              payload: { proof_kind: "TEXT", content_ref: "X" }
              as: ShopStaff
              captures: { proof_a: $.data.id }
            - call: "POST /order-lines/${line_a}/proofs/${proof_a}/send"
              payload: {}
              as: ShopStaff
            - call: "POST /order-lines/${line_a}/proofs/${proof_a}/approve"
              payload: {}
              as: Customer
              as_user_id: "${cust_id}"
            - call: "POST /orders/${order_a}/price"
              payload: {}
              as: ShopStaff
              captures: { va: $.data.version }
            - call: "POST /orders/${order_a}/confirm"
              payload: { expected_order_version: "${va}" }
              as: Customer
              as_user_id: "${cust_id}"
            - call: "POST /orders"
              payload: { customer_id: "${cust_id}", service_level: "STANDARD", due_date: "2026-07-15T00:00:00Z" }
              as: Customer
              as_user_id: "${cust_id}"
              captures: { order_b: $.data.id }
            - call: "POST /orders/${order_b}/lines"
              payload: { catalog_product_id: "${prod_id}", quantity: 1 }
              as: Customer
              as_user_id: "${cust_id}"
              captures: { line_b: $.data.id }
            - call: "POST /order-lines/${line_b}/proofs"
              payload: { proof_kind: "TEXT", content_ref: "Y" }
              as: ShopStaff
              captures: { proof_b: $.data.id }
            - call: "POST /order-lines/${line_b}/proofs/${proof_b}/send"
              payload: {}
              as: ShopStaff
            - call: "POST /order-lines/${line_b}/proofs/${proof_b}/approve"
              payload: {}
              as: Customer
              as_user_id: "${cust_id}"
            - call: "POST /orders/${order_b}/price"
              payload: {}
              as: ShopStaff
              captures: { vb: $.data.version }
          trigger:
            - call: "POST /orders/${order_b}/confirm"
              payload: { expected_order_version: "${vb}" }
              as: Customer
              as_user_id: "${cust_id}"
              captures: { err: $.data.error_id }
          assert:
            - "trigger response error_id == ERR_COMPONENT_SHORTAGE (409)"
            - "Component.${comp_id}.on_hand_qty == 5"
            - "Component.${comp_id}.available_qty == 0"
            - "Order.${order_b}.production_status == PRICED"

  # ===========================================================================
  - rule_id: combinatorial_formula
    instances:
      # ---- mode (a): >=3-input non-linear order_pricing (subtotal x rush_tier x promo) ----
      - name: order_pricing_three_input_nonlinear_subtotal_rush_promo
        grounds:
          - calculations.order_pricing
          - calculations.rush_tier
          - calculations.volume_discount
          - state_machines.Order.PRICED_to_CONFIRMED
        distinguishing_aspect: |
          MODE (a): invoice_total_cents is a non-linear function of >=3 inputs — per-line volume_discount,
          rush_tier surcharge, and promo — with conditional branches; for qty=30/EXPEDITED/PERCENT-promo the
          composed result is exactly 187479, not any single linear combination.
        test_recipe:
          setup:
            - "Same fixtures as order_pricing_estimate_vs_invoice_diverge_on_promo."
            - "EXPEDITED order, qty=30 logo line, promo SAVE10 PERCENT 0.10 min 100000."
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-06-15T00:00:00Z" }
              as: Anonymous
            - call: "POST /rush-policies"
              payload: { name: "std", expedited_surcharge_pct: 0.25, rush_surcharge_pct: 0.50, rush_min_business_days: 1, active: true }
              as: ShopManager
            - call: "POST /promo-codes"
              payload: { code: "SAVE10B", kind: "PERCENT", percent_off: 0.10, min_subtotal_cents: 100000, active: true }
              as: ShopManager
              captures: { promo_id: $.data.id }
            - call: "POST /components"
              payload: { code: "BASE-3", name: "Base", on_hand_qty: 100, reorder_point: 0 }
              as: ShopManager
              captures: { comp_id: $.data.id }
            - call: "POST /catalog-products"
              payload: { sku: "ASA-3", name: "Acrylic Star", product_type: "ACRYLIC", base_price_cents: 5000, engraving_price_per_char_cents: 50, logo_setup_fee_cents: 2000, standard_lead_days: 5, bom: [{ component_id: "${comp_id}", qty_per_unit: 1 }] }
              as: ShopManager
              captures: { prod_id: $.data.id }
            - call: "POST /customers"
              payload: { email: "c3@x.com", full_name: "C Three" }
              as: Anonymous
              captures: { cust_id: $.data.id }
            - call: "POST /orders"
              payload: { customer_id: "${cust_id}", service_level: "EXPEDITED", due_date: "2026-06-18T00:00:00Z", promo_code_id: "${promo_id}" }
              as: Customer
              as_user_id: "${cust_id}"
              captures: { order_id: $.data.id }
            - call: "POST /orders/${order_id}/lines"
              payload: { catalog_product_id: "${prod_id}", quantity: 30, engraving_text: "CHAMPION 2026", include_logo: true }
              as: Customer
              as_user_id: "${cust_id}"
              captures: { line_id: $.data.id }
            - call: "POST /order-lines/${line_id}/proofs"
              payload: { proof_kind: "TEXT", content_ref: "CHAMPION 2026" }
              as: ShopStaff
              captures: { proof_id: $.data.id }
            - call: "POST /order-lines/${line_id}/proofs/${proof_id}/send"
              payload: {}
              as: ShopStaff
            - call: "POST /order-lines/${line_id}/proofs/${proof_id}/approve"
              payload: {}
              as: Customer
              as_user_id: "${cust_id}"
            - call: "POST /orders/${order_id}/price"
              payload: {}
              as: ShopStaff
              captures: { ord_v: $.data.version }
          trigger:
            - call: "POST /orders/${order_id}/confirm"
              payload: { expected_order_version: "${ord_v}" }
              as: Customer
              as_user_id: "${cust_id}"
          assert:
            - "OrderLine.${line_id}.line_subtotal_cents == 171500"
            - "OrderLine.${line_id}.volume_discount_cents == 8475"
            - "Order.${order_id}.invoice_subtotal_cents == 163025"
            - "Order.${order_id}.invoice_total_cents == 187479"

      # ---- mode (b): nested rounding order pinned (subtotal summed THEN rush floored) ----
      - name: order_pricing_rounding_order_sum_then_floor
        grounds:
          - calculations.order_pricing
          - calculations.volume_discount
          - entities.Order.fields.invoice_subtotal_cents
        distinguishing_aspect: |
          MODE (b): the scaffold pins 'sum the per-line (subtotal - volume_discount) exactly, THEN floor the rush
          surcharge once' — with two lines whose per-line discounts floor differently, summing-then-flooring rush
          yields invoice_subtotal_cents 196033 and invoice_total_cents 245041, distinct from a floor-per-line order.
        test_recipe:
          setup:
            - "Active RUSH-capable policy rush_surcharge 0.50; STANDARD order so surcharge_pct=0 actually — use EXPEDITED 0.25."
            - "Two lines on a per_char product so volume_discount floors fractionally: line1 qty=33 text 'AB' goods, line2 qty=27 text 'AB'."
            - "Product base 3001c, per_char 1c; qty 33->TIER1 5%, qty 27->TIER1 5%."
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-06-15T00:00:00Z" }
              as: Anonymous
            - call: "POST /rush-policies"
              payload: { name: "std", expedited_surcharge_pct: 0.25, rush_surcharge_pct: 0.50, rush_min_business_days: 1, active: true }
              as: ShopManager
            - call: "POST /components"
              payload: { code: "BASE-4", name: "Base", on_hand_qty: 200, reorder_point: 0 }
              as: ShopManager
              captures: { comp_id: $.data.id }
            - call: "POST /catalog-products"
              payload: { sku: "ASA-4", name: "Crystal", product_type: "CRYSTAL", base_price_cents: 3001, engraving_price_per_char_cents: 1, logo_setup_fee_cents: 0, standard_lead_days: 5, bom: [{ component_id: "${comp_id}", qty_per_unit: 1 }] }
              as: ShopManager
              captures: { prod_id: $.data.id }
            - call: "POST /customers"
              payload: { email: "c4@x.com", full_name: "C Four" }
              as: Anonymous
              captures: { cust_id: $.data.id }
            - call: "POST /orders"
              payload: { customer_id: "${cust_id}", service_level: "EXPEDITED", due_date: "2026-06-18T00:00:00Z" }
              as: Customer
              as_user_id: "${cust_id}"
              captures: { order_id: $.data.id }
            - call: "POST /orders/${order_id}/lines"
              payload: { catalog_product_id: "${prod_id}", quantity: 33, engraving_text: "AB" }
              as: Customer
              as_user_id: "${cust_id}"
              captures: { line1: $.data.id }
            - call: "POST /orders/${order_id}/lines"
              payload: { catalog_product_id: "${prod_id}", quantity: 27, engraving_text: "AB" }
              as: Customer
              as_user_id: "${cust_id}"
              captures: { line2: $.data.id }
            - call: "POST /order-lines/${line1}/proofs"
              payload: { proof_kind: "TEXT", content_ref: "AB" }
              as: ShopStaff
              captures: { proof1: $.data.id }
            - call: "POST /order-lines/${line1}/proofs/${proof1}/send"
              payload: {}
              as: ShopStaff
            - call: "POST /order-lines/${line1}/proofs/${proof1}/approve"
              payload: {}
              as: Customer
              as_user_id: "${cust_id}"
            - call: "POST /order-lines/${line2}/proofs"
              payload: { proof_kind: "TEXT", content_ref: "AB" }
              as: ShopStaff
              captures: { proof2: $.data.id }
            - call: "POST /order-lines/${line2}/proofs/${proof2}/send"
              payload: {}
              as: ShopStaff
            - call: "POST /order-lines/${line2}/proofs/${proof2}/approve"
              payload: {}
              as: Customer
              as_user_id: "${cust_id}"
            - call: "POST /orders/${order_id}/price"
              payload: {}
              as: ShopStaff
              captures: { ord_v: $.data.version }
          trigger:
            - call: "POST /orders/${order_id}/confirm"
              payload: { expected_order_version: "${ord_v}" }
              as: Customer
              as_user_id: "${cust_id}"
          assert:
            - "OrderLine.${line1}.line_subtotal_cents == 99099"
            - "OrderLine.${line1}.volume_discount_cents == 4954"
            - "OrderLine.${line2}.line_subtotal_cents == 81081"
            - "OrderLine.${line2}.volume_discount_cents == 4054"
            - "Order.${order_id}.invoice_subtotal_cents == 171172"
            - "Order.${order_id}.invoice_total_cents == 213965"

  # ===========================================================================
  - rule_id: non_linear_state_machine
    instances:
      # ---- Proof cyclic revision loop ----
      - name: proof_cyclic_revision_loop_increments_round
        grounds:
          - state_machines.Proof.SENT_to_CHANGES_REQUESTED
          - state_machines.Proof.CHANGES_REQUESTED_to_DRAFT
          - state_machines.Proof.DRAFT_to_SENT
          - entities.Proof.fields.revision_round
        distinguishing_aspect: |
          The Proof machine is CYCLIC on the Proof entity: SENT->CHANGES_REQUESTED->DRAFT->SENT, and
          revision_round increments to 2 after one full loop — a linear pipeline could never return to DRAFT.
        test_recipe:
          setup:
            - "An order line with a TEXT proof in SENT."
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-06-15T00:00:00Z" }
              as: Anonymous
            - call: "POST /components"
              payload: { code: "BASE-5", name: "Base", on_hand_qty: 10 }
              as: ShopManager
              captures: { comp_id: $.data.id }
            - call: "POST /catalog-products"
              payload: { sku: "ASA-5", name: "Medal", product_type: "MEDAL", base_price_cents: 800, engraving_price_per_char_cents: 0, logo_setup_fee_cents: 0, standard_lead_days: 2, bom: [{ component_id: "${comp_id}", qty_per_unit: 1 }] }
              as: ShopManager
              captures: { prod_id: $.data.id }
            - call: "POST /customers"
              payload: { email: "c5@x.com", full_name: "C Five" }
              as: Anonymous
              captures: { cust_id: $.data.id }
            - call: "POST /orders"
              payload: { customer_id: "${cust_id}", service_level: "STANDARD", due_date: "2026-07-15T00:00:00Z" }
              as: Customer
              as_user_id: "${cust_id}"
              captures: { order_id: $.data.id }
            - call: "POST /orders/${order_id}/lines"
              payload: { catalog_product_id: "${prod_id}", quantity: 1, engraving_text: "FIRST" }
              as: Customer
              as_user_id: "${cust_id}"
              captures: { line_id: $.data.id }
            - call: "POST /order-lines/${line_id}/proofs"
              payload: { proof_kind: "TEXT", content_ref: "FIRST" }
              as: ShopStaff
              captures: { proof_id: $.data.id }
            - call: "POST /order-lines/${line_id}/proofs/${proof_id}/send"
              payload: {}
              as: ShopStaff
          trigger:
            - call: "POST /order-lines/${line_id}/proofs/${proof_id}/request-changes"
              payload: {}
              as: Customer
              as_user_id: "${cust_id}"
            - call: "POST /order-lines/${line_id}/proofs/${proof_id}/revise"
              payload: { content_ref: "SECOND" }
              as: ShopStaff
              captures: { round_after: $.data.revision_round }
            - call: "POST /order-lines/${line_id}/proofs/${proof_id}/send"
              payload: {}
              as: ShopStaff
          trigger_note: "After revise, proof returns to DRAFT with revision_round 2; second send returns to SENT."
          assert:
            - "Proof.${proof_id}.revision_round == 2"
            - "Proof.${proof_id}.proof_status == SENT"

      # ---- Order parallel dimensions (production_status x payment_status) ----
      - name: order_parallel_dimensions_payment_independent_of_production
        grounds:
          - state_machines.Order.production_status
          - state_machines.Order.payment_status
          - entities.Order.fields.production_status
          - entities.Order.fields.payment_status
        distinguishing_aspect: |
          On the Order entity two independent dimensions evolve: paying the deposit moves payment_status
          UNPAID->DEPOSIT_PAID while production_status stays CONFIRMED (unchanged), proving parallel axes.
        test_recipe:
          setup:
            - "A CONFIRMED order (STANDARD, deposit_due locked) with an APPROVED proof and stocked component."
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-06-15T00:00:00Z" }
              as: Anonymous
            - call: "POST /rush-policies"
              payload: { name: "std", expedited_surcharge_pct: 0.25, rush_surcharge_pct: 0.50, rush_min_business_days: 1, active: true }
              as: ShopManager
            - call: "POST /components"
              payload: { code: "BASE-6", name: "Base", on_hand_qty: 10 }
              as: ShopManager
              captures: { comp_id: $.data.id }
            - call: "POST /catalog-products"
              payload: { sku: "ASA-6", name: "Plaque", product_type: "PLAQUE", base_price_cents: 10000, engraving_price_per_char_cents: 0, logo_setup_fee_cents: 0, standard_lead_days: 3, bom: [{ component_id: "${comp_id}", qty_per_unit: 1 }] }
              as: ShopManager
              captures: { prod_id: $.data.id }
            - call: "POST /customers"
              payload: { email: "c6@x.com", full_name: "C Six" }
              as: Anonymous
              captures: { cust_id: $.data.id }
            - call: "POST /orders"
              payload: { customer_id: "${cust_id}", service_level: "STANDARD", due_date: "2026-07-15T00:00:00Z" }
              as: Customer
              as_user_id: "${cust_id}"
              captures: { order_id: $.data.id }
            - call: "POST /orders/${order_id}/lines"
              payload: { catalog_product_id: "${prod_id}", quantity: 1 }
              as: Customer
              as_user_id: "${cust_id}"
              captures: { line_id: $.data.id }
            - call: "POST /order-lines/${line_id}/proofs"
              payload: { proof_kind: "TEXT", content_ref: "X" }
              as: ShopStaff
              captures: { proof_id: $.data.id }
            - call: "POST /order-lines/${line_id}/proofs/${proof_id}/send"
              payload: {}
