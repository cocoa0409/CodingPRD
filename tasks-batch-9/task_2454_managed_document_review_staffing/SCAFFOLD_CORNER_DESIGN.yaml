              as: Reviewer
              as_user_id: "${ra_id}"
          trigger:
            - call: "POST /assignments/${a3_id}/submit"
              payload: {}
              as: Reviewer
              as_user_id: "${ra_id}"
            - call: "GET /reviewers/${ra_id}/scorecard-events"
              payload: {}
              as: StaffingCoordinator
          assert:
            - "the event list has exactly 4 rows in created_at ASC order with strike_delta +1 (PACE_SHORTFALL), -1 (CLEARED_STRIKE), -1 (CLEARED_STRIKE), +1 (PACE_SHORTFALL)"
            - "Reviewer.${ra_id}.scorecard_strikes == 1 — step-wise floor gives 1, 0, 0, 1; the naive sum 0 is WRONG"
            - "Assignment paces are 48.00, 60.00 and 50.00 dph, so only batch 2 cleared the 55 dph floor"
            - "Reviewer.${ra_id}.accuracy_score == 1.0000 over 55 sampled documents (40 + 15), so no ACCURACY_MISS event exists"
            - "Reviewer.${ra_id}.engagement_status == \"ENGAGED\" — 1 strike is below the removal threshold of 3, and accuracy 1.0000 >= 0.9 despite 55 >= 50 sampled documents"
            - "Reviewer.${ra_id}.pace_dph == 50.70 (600 documents over 710 minutes)"

      - name: qc_min_sample_floor_dominates_a_small_batch
        claim_type: constants_applied
        grounds:
          - calculations.qc_sample_evaluation
          - entities.Batch.fields.qc_sample_target_size
        distinguishing_aspect: "QC_MIN_SAMPLE_DOCS is a floor, not an alternative: a 50-document batch samples 10 documents (the floor, not ceil(5)), while a 400-document batch samples 40 (the percentage), so both branches of max() are exercised on the same protocol."
        test_recipe:
          setup:
            - "the core matter with an APPROVED protocol whose qc_sample_pct is 0.10"
          setup_api_calls:
            - *c_clock
            - *c_client
            - *c_matter
            - *c_proto
            - *c_proto_submit
            - *c_proto_approve
          trigger:
            - call: "POST /matters/${m_id}/batches"
              payload: { document_count: 50, priority_rank: 5 }
              as: EngagementManager
              captures: { bsmall_id: $.data.id }
            - call: "POST /matters/${m_id}/batches"
              payload: { document_count: 400, priority_rank: 5 }
              as: EngagementManager
              captures: { bbig_id: $.data.id }
          assert:
            - "Batch.${bsmall_id}.qc_sample_target_size == 10 — max(10, ceil(50 * 0.10) == 5) selects the floor"
            - "Batch.${bbig_id}.qc_sample_target_size == 40 — max(10, ceil(400 * 0.10) == 40) selects the percentage"
            - "Matter.${m_id}.unbatched_document_count == 150 (600 - 50 - 400)"

      - name: projection_basis_defaults_by_status_and_explicit_param_wins
        claim_type: variant_selection
        grounds:
          - calculations.matter_spend_projection
          - endpoints[GET /matters/{id}/spend-projection]
        distinguishing_aspect: "The selection rule has two layers: a STAFFING matter defaults to REMAINING_WORK_BASIS, and passing basis=LEDGER_REPLAY_BASIS overrides that default — changing only basis_applied and budget_headroom_cents, while both basis figures and variance_cents stay identical across the two reads."
        test_recipe:
          setup:
            - "the core matter with an APPROVED protocol, in STAFFING with no reviewer onboarded"
            - "Batch 1 (400 documents) is CREATED and 200 documents remain unbatched; the ledger is empty"
          setup_api_calls:
            - *c_clock
            - *c_client
            - *c_matter
            - *c_proto
            - *c_proto_submit
            - *c_proto_approve
            - *c_batch1
          trigger:
            - call: "GET /matters/${m_id}/spend-projection"
              payload: {}
              as: EngagementManager
              captures: { default_basis: $.data.basis_applied }
            - call: "GET /matters/${m_id}/spend-projection"
              payload: { basis: "LEDGER_REPLAY_BASIS" }
              as: ClientCounsel
              as_user_id: "${cl_id}"
              captures: { forced_basis: $.data.basis_applied }
          assert:
            - "first call: basis_applied == \"REMAINING_WORK_BASIS\" with budget_headroom_cents == 478200 (600000 - 121800)"
            - "second call: basis_applied == \"LEDGER_REPLAY_BASIS\" with budget_headroom_cents == 600000 (600000 - 0)"
            - "both calls report remaining_work_basis_cents == 121800 (contract rate 203 * (0 + 400 + 200)) and ledger_replay_basis_cents == 0"
            - "both calls report variance_cents == 121800 — the variance never depends on which basis was applied"

      - name: discrepancy_rate_exactly_at_the_ceiling
        claim_type: threshold
        grounds:
          - calculations.qc_sample_evaluation
        excluded_because:
          difficulty_instance: boundary_precision_check / qc_discrepancy_rate_at_threshold_fails
          rationale: "The inclusive comparison at max_discrepancy_pct (2/40 fails, 1/40 passes) is asserted there with both neighbours."

      - name: per_document_rate_rounded_before_multiplication
        claim_type: tiered_pricing
        grounds:
          - calculations.assignment_billable_amount
        excluded_because:
          difficulty_instance: combinatorial_formula / per_document_rate_rounded_before_multiplication_mode_b
          rationale: "The pinned rounding order (213 * 400 == 85200, not round(212.625 * 400) == 85050) is the whole content of that instance."

      - name: invoice_bands_fill_in_order
        claim_type: waterfall_allocation
        grounds:
          - calculations.matter_invoice_total
        excluded_because:
          difficulty_instance: combinatorial_formula / invoice_waterfall_band_selected_after_surcharge_mode_c
          rationale: "Band selection after the QC surcharge is folded in, and the resulting discount, are asserted step by step there."

      - name: overlapping_seat_intervals_counted_once
        claim_type: interval_merge
        grounds:
          - calculations.onsite_seat_occupancy
        excluded_because:
          difficulty_instance: resource_temporal_overlap / onsite_seat_overlap_is_half_open
          rationale: "Half-open seat occupancy including the touching-endpoint case is asserted there."

      - name: both_projection_bases_diverge_on_the_same_data
        claim_type: projection
        grounds:
          - calculations.matter_spend_projection
        excluded_because:
          difficulty_instance: dual_variant_calc / spend_projection_remaining_work_vs_ledger_replay
          rationale: "The structural divergence (71050 vs 85200, variance -14150) is asserted there with both bases pinned."

  # =========================================================================
  # SECTION: validations
  # =========================================================================
  - section: validations
    instances:
      - name: submit_with_incomplete_coding_rejected
        claim_type: violation_to_error
        grounds:
          - validations[priority=25]
          - errors[ERR_ASSIGNMENT_INCOMPLETE]
          - endpoints[POST /assignments/{id}/submit]
        distinguishing_aspect: "The submit gate is exact equality, not a ratio: 399 of 400 documents coded is refused with ERR_ASSIGNMENT_INCOMPLETE, and because billing is frozen at submit the assignment is left with billable_amount_cents 0 and a ledger holding only its COMMITMENT."
        test_recipe:
          setup:
            - "the core matter with an APPROVED protocol and Reviewer A onboarded with an ACTIVE onsite session"
            - "Batch 1 (400 documents) is IN_PROGRESS with 399 documents coded and no privilege entries"
          setup_api_calls:
            - *c_clock
            - *c_client
            - *c_matter
            - *c_proto
            - *c_proto_submit
            - *c_proto_approve
            - *c_rev_a
            - *c_rev_a_verify
            - *c_screen_a
            - *c_screen_a_clear
            - *c_ca_a
            - *c_ca_a_exec
            - *c_sess_a
            - *c_sess_a_active
            - *c_batch1
            - *c_assign_a1
            - *c_start_a1
            - call: "POST /assignments/${a1_id}/progress"
              payload: { documents_coded: 399, minutes_logged: 420, privilege_hits_logged: 0 }
              as: Reviewer
              as_user_id: "${ra_id}"
          trigger:
            - call: "POST /assignments/${a1_id}/submit"
              payload: {}
              as: Reviewer
              as_user_id: "${ra_id}"
              captures: { err: $.data.error_id }
          assert:
            - "HTTP 409 with error_id \"ERR_ASSIGNMENT_INCOMPLETE\""
            - "Assignment.${a1_id}.status == \"IN_PROGRESS\", documents_coded == 399, billable_amount_cents == 0, billable_minutes == 0"
            - "GET /assignments/${a1_id}/budget-ledger returns exactly 1 row: the COMMITMENT of +85200"
            - "Batch.${b1_id}.status == \"IN_PROGRESS\" — no QC_SAMPLING cascade"
            - "GET /reviewers/${ra_id}/scorecard-events returns an empty list — the pace gate runs only on a successful submit"

      - name: deadline_gate_is_strictly_before_the_deadline
        claim_type: temporal_validation
        grounds:
          - validations[priority=28]
          - errors[ERR_MATTER_DEADLINE_PASSED]
          - endpoints[POST /batches/{id}/assignments]
        distinguishing_aspect: "The deadline comparison is strict: the logical clock standing exactly ON deadline_utc is refused with ERR_MATTER_DEADLINE_PASSED, while one second earlier the identical assignment succeeds — and the gate reads the logical clock, never wall-clock time."
        test_recipe:
          setup:
            - "the core matter (deadline 2026-09-30T00:00:00Z) with an APPROVED protocol and Reviewer A onboarded"
            - "Batch 1 (400 documents) is CREATED; Reviewer A's agreement covers 2026-08-01 through 2026-10-31"
          setup_api_calls:
            - *c_clock
            - *c_client
            - *c_matter
            - *c_proto
            - *c_proto_submit
            - *c_proto_approve
            - *c_rev_a
            - *c_rev_a_verify
            - *c_screen_a
            - *c_screen_a_clear
            - *c_ca_a
            - *c_ca_a_exec
            - *c_batch1
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-09-30T00:00:00Z" }
              as: EngagementManager
          trigger:
            - call: "POST /batches/${b1_id}/assignments"
              payload: { expected_batch_version: "${b1_v}", reviewer_id: "${ra_id}", pass_type: "FIRST_PASS" }
              as: StaffingCoordinator
              captures: { err: $.data.error_id }
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-09-29T23:59:59Z" }
              as: EngagementManager
            - call: "POST /batches/${b1_id}/assignments"
              payload: { expected_batch_version: "${b1_v}", reviewer_id: "${ra_id}", pass_type: "FIRST_PASS" }
              as: StaffingCoordinator
              captures: { a_ok_id: $.data.id }
          assert:
            - "first call: HTTP 409 with error_id \"ERR_MATTER_DEADLINE_PASSED\" — equality is a violation"
            - "after the first call Batch.${b1_id}.status == \"CREATED\" and version == 1, so ${b1_v} is still current for the retry"
            - "third call: HTTP 201 with committed_amount_cents == 85200 and created_at == \"2026-09-29T23:59:59Z\""
            - "Batch.${b1_id}.status == \"ASSIGNED\" and version == 2 after the successful call"

      - name: remote_session_requires_both_authorisation_flags
        claim_type: conditional_validation
        grounds:
          - validations[priority=22]
          - errors[ERR_REMOTE_WORK_NOT_AUTHORIZED]
          - entities.Reviewer.fields.remote_work_authorized
        distinguishing_aspect: "The rule is a conjunction gated on the workstation class: with matter.remote_work_permitted true, Ada (reviewer flag false) is refused a REMOTE_VDI session yet allowed an ONSITE_SECURE one, while Ben (flag true) gets his REMOTE_VDI session."
        test_recipe:
          setup:
            - "the core matter (remote_work_permitted true, onsite_seat_count 2) with an APPROVED protocol"
            - "Reviewer A (remote_work_authorized false) and Reviewer B (remote_work_authorized true) are both VERIFIED, CLEARED and EXECUTED; neither holds a session"
          setup_api_calls:
            - *c_clock
            - *c_client
            - *c_matter
            - *c_proto
            - *c_proto_submit
            - *c_proto_approve
            - *c_rev_a
            - *c_rev_a_verify
            - *c_screen_a
            - *c_screen_a_clear
            - *c_ca_a
            - *c_ca_a_exec
            - *c_rev_b
            - *c_rev_b_verify
            - *c_screen_b
            - *c_screen_b_clear
            - *c_ca_b
            - *c_ca_b_exec
          trigger:
            - call: "POST /sessions"
              payload:
                reviewer_id: "${ra_id}"
                matter_id: "${m_id}"
                workstation_class: "REMOTE_VDI"
                starts_at_utc: "2026-08-01T00:00:00Z"
                ends_at_utc: "2026-08-31T00:00:00Z"
              as: Reviewer
              as_user_id: "${ra_id}"
              captures: { err: $.data.error_id }
            - call: "POST /sessions"
              payload:
                reviewer_id: "${rb_id}"
                matter_id: "${m_id}"
                workstation_class: "REMOTE_VDI"
                starts_at_utc: "2026-08-01T00:00:00Z"
                ends_at_utc: "2026-08-31T00:00:00Z"
              as: Reviewer
              as_user_id: "${rb_id}"
              captures: { sesb2_id: $.data.id }
            - *c_sess_a
          assert:
            - "first call: HTTP 403 with error_id \"ERR_REMOTE_WORK_NOT_AUTHORIZED\" — the matter permits remote work but the reviewer is not authorised"
            - "second call: HTTP 201 with status \"SCHEDULED\" and workstation_class \"REMOTE_VDI\""
            - "third call: HTTP 201 — the same reviewer, the same window, ONSITE_SECURE instead, so the gate is class-conditional"
            - "GET /sessions?matter_id=${m_id} returns exactly 2 rows, and only 1 of them consumes an onsite seat"

      - name: progress_accepts_an_unchanged_count_and_rejects_a_decrease
        claim_type: satisfaction_to_pass
        grounds:
          - validations[priority=39]
          - errors[ERR_DOCUMENT_COUNT_EXCEEDED]
          - endpoints[POST /assignments/{id}/progress]
        distinguishing_aspect: "Monotonicity is non-strict on the passing side and strict on the failing side: re-posting the same 100/120 pair succeeds as a no-op, whereas 99 documents (a decrease) and 401 documents (above the batch) are both refused with ERR_DOCUMENT_COUNT_EXCEEDED."
        test_recipe:
          setup:
            - "the core matter with an APPROVED protocol and Reviewer A onboarded with an ACTIVE onsite session"
            - "Batch 1 (400 documents) is assigned to Reviewer A and started"
          setup_api_calls:
            - *c_clock
            - *c_client
            - *c_matter
            - *c_proto
            - *c_proto_submit
            - *c_proto_approve
            - *c_rev_a
            - *c_rev_a_verify
            - *c_screen_a
            - *c_screen_a_clear
            - *c_ca_a
            - *c_ca_a_exec
            - *c_sess_a
            - *c_sess_a_active
            - *c_batch1
            - *c_assign_a1
            - *c_start_a1
          trigger:
            - call: "POST /assignments/${a1_id}/progress"
              payload: { documents_coded: 100, minutes_logged: 120, privilege_hits_logged: 0 }
              as: Reviewer
              as_user_id: "${ra_id}"
            - call: "POST /assignments/${a1_id}/progress"
              payload: { documents_coded: 100, minutes_logged: 120, privilege_hits_logged: 0 }
              as: Reviewer
              as_user_id: "${ra_id}"
            - call: "POST /assignments/${a1_id}/progress"
              payload: { documents_coded: 99, minutes_logged: 130, privilege_hits_logged: 0 }
              as: Reviewer
              as_user_id: "${ra_id}"
              captures: { err_down: $.data.error_id }
            - call: "POST /assignments/${a1_id}/progress"
              payload: { documents_coded: 401, minutes_logged: 500, privilege_hits_logged: 0 }
              as: Reviewer
              as_user_id: "${ra_id}"
              captures: { err_over: $.data.error_id }
          assert:
            - "first call: HTTP 200 with documents_coded 100, minutes_logged 120 and pace_dph 50.00"
            - "second call: HTTP 200 — an unchanged pair is accepted, and documents_coded is still 100 (not 200)"
            - "third call: HTTP 422 with error_id \"ERR_DOCUMENT_COUNT_EXCEEDED\"; documents_coded stays 100 and minutes_logged stays 120"
            - "fourth call: HTTP 422 with error_id \"ERR_DOCUMENT_COUNT_EXCEEDED\" — 401 > batch.document_count 400"
            - "Assignment.${a1_id}.status == \"IN_PROGRESS\" throughout and billable_amount_cents == 0"

      - name: higher_priority_gate_masks_the_lower_one
        claim_type: priority_ordering
        grounds:
          - validations[priority=15]
        excluded_because:
          difficulty_instance: priority_pair_validation_conflict / protocol_gate_precedes_budget_gate
          rationale: "Two rules are violated by one request there (15 and 43) and the lower-numbered error is asserted, which is exactly the priority-ordering claim."

      - name: validity_depends_on_another_entity_state
        claim_type: cross_entity_validation
        grounds:
          - validations[priority=18]
        excluded_because:
          difficulty_instance: cross_entity_state_dependency / assignment_start_blocked_by_lazily_expired_agreement
          rationale: "The agreement's lazily recomputed EXPIRED status gating a start on a different entity is asserted there in both directions."

      - name: individually_valid_but_collectively_over_the_limit
        claim_type: aggregate_validation
        grounds:
          - validations[priority=38]
        excluded_because:
          difficulty_instance: compensating_invariant / document_conservation_across_batching_and_dissolve
          rationale: "Document conservation across carve and dissolve, ending in ERR_INSUFFICIENT_UNBATCHED_DOCUMENTS on the aggregate, is asserted there."

      - name: cascaded_check_runs_before_the_check_that_depends_on_it
        claim_type: cascading_validation
        grounds:
          - validations[priority=17]
        excluded_because:
          difficulty_instance: transitive_cascade / blocked_rescreening_to_agreement_to_session_to_void
          rationale: "The screening BLOCK -> agreement revocation -> session revocation -> void chain, and the ordering it forces, are asserted link by link there."

  # =========================================================================
  # SECTION: endpoints
  # =========================================================================
  - section: endpoints
    instances:
      - name: progress_requires_a_live_session_window
        claim_type: action_endpoint
        grounds:
          - validations[priority=23]
          - errors[ERR_NO_ACTIVE_SESSION]
          - endpoints[POST /sessions/{id}/lifecycle]
        distinguishing_aspect: "The session precondition is evaluated per call, not once at start: closing the session mid-assignment makes the next progress post fail with ERR_NO_ACTIVE_SESSION, and opening a fresh ACTIVE session restores the same assignment's ability to record progress."
        test_recipe:
          setup:
            - "the core matter with an APPROVED protocol and Reviewer A onboarded"
            - "Reviewer A holds an ACTIVE onsite session and has started her assignment on Batch 1 (400 documents)"
          setup_api_calls:
            - *c_clock
            - *c_client
            - *c_matter
            - *c_proto
            - *c_proto_submit
            - *c_proto_approve
            - *c_rev_a
            - *c_rev_a_verify
            - *c_screen_a
            - *c_screen_a_clear
            - *c_ca_a
            - *c_ca_a_exec
            - *c_sess_a
            - *c_sess_a_active
            - *c_batch1
            - *c_assign_a1
            - *c_start_a1
            - call: "POST /sessions/${sesa_id}/lifecycle"
              payload: { to_status: "CLOSED" }
              as: Reviewer
              as_user_id: "${ra_id}"
          trigger:
            - call: "POST /assignments/${a1_id}/progress"
              payload: { documents_coded: 200, minutes_logged: 210, privilege_hits_logged: 0 }
              as: Reviewer
              as_user_id: "${ra_id}"
              captures: { err: $.data.error_id }
            - call: "POST /sessions"
              payload:
                reviewer_id: "${ra_id}"
                matter_id: "${m_id}"
                workstation_class: "ONSITE_SECURE"
                starts_at_utc: "2026-08-01T00:00:00Z"
                ends_at_utc: "2026-08-31T00:00:00Z"
              as: Reviewer
              as_user_id: "${ra_id}"
              captures: { sesa2_id: $.data.id }
            - call: "POST /sessions/${sesa2_id}/lifecycle"
              payload: { to_status: "ACTIVE" }
              as: Reviewer
              as_user_id: "${ra_id}"
            - call: "POST /assignments/${a1_id}/progress"
              payload: { documents_coded: 200, minutes_logged: 210, privilege_hits_logged: 0 }
              as: Reviewer
              as_user_id: "${ra_id}"
          assert:
            - "first call: HTTP 409 with error_id \"ERR_NO_ACTIVE_SESSION\"; Assignment.${a1_id}.documents_coded is still 0"
            - "second call: HTTP 201 — the CLOSED session is not in {SCHEDULED, ACTIVE}, so it neither overlaps nor consumes a seat"
            - "fourth call: HTTP 200 with documents_coded 200, minutes_logged 210 and pace_dph 57.14"
            - "Assignment.${a1_id}.status == \"IN_PROGRESS\" the whole time — the refusal did not push it back to ASSIGNED"
            - "SecureEnvironmentSession.${sesa_id}.status == \"CLOSED\" and ${sesa2_id}.status == \"ACTIVE\""

      - name: dissolve_allowed_only_while_created_and_unassigned
        claim_type: conditional_action
        grounds:
          - validations[priority=41]
          - errors[ERR_BATCH_NOT_DISSOLVABLE]
          - endpoints[POST /batches/{id}/dissolve]
        distinguishing_aspect: "The dissolve condition is a conjunction of status AND assignment history: the ASSIGNED batch is refused with ERR_BATCH_NOT_DISSOLVABLE while its untouched CREATED sibling dissolves and returns its documents to the unbatched pool, leaving the ledger untouched."
        test_recipe:
          setup:
            - "the core matter with an APPROVED protocol and Reviewer A onboarded"
            - "Batch 1 (400 documents) is ASSIGNED to Reviewer A; Batch 2 (150 documents) is CREATED with no assignment"
          setup_api_calls:
            - *c_clock
            - *c_client
            - *c_matter
            - *c_proto
            - *c_proto_submit
            - *c_proto_approve
            - *c_rev_a
            - *c_rev_a_verify
            - *c_screen_a
            - *c_screen_a_clear
            - *c_ca_a
            - *c_ca_a_exec
            - *c_batch1
            - *c_assign_a1
            - *c_batch2
          trigger:
            - call: "POST /batches/${b1_id}/dissolve"
              payload: {}
              as: EngagementManager
              captures: { err: $.data.error_id }
            - call: "POST /batches/${b2_id}/dissolve"
              payload: {}
              as: EngagementManager
              captures: { b2_status: $.data.status }
          assert:
            - "first call: HTTP 409 with error_id \"ERR_BATCH_NOT_DISSOLVABLE\"; Batch.${b1_id}.status is still \"ASSIGNED\""
            - "second call: HTTP 200 with status \"DISSOLVED\""
            - "Matter.${m_id}.unbatched_document_count == 200 (50 left over plus the 150 returned)"
            - "Matter.${m_id}.committed_spend_cents == 85200 — dissolving an unassigned batch touches no ledger row"
            - "GET /assignments?batch_id=${b2_id} returns an empty list"

      - name: screening_link_needs_both_parties_and_stays_singleton
        claim_type: cross_reference_link
        grounds:
          - validations[priority=5]
          - validations[priority=26]
          - errors[ERR_SCREENING_ALREADY_OPEN]
        distinguishing_aspect: "The junction endpoint enforces both ends and then uniqueness: a bogus reviewer_id yields ERR_REVIEWER_NOT_FOUND, the first valid link is created PENDING, and a second link for the same pair is refused with ERR_SCREENING_ALREADY_OPEN."
        test_recipe:
          setup:
            - "the core Client and Matter exist and Reviewer A exists; no screening exists yet"
          setup_api_calls:
            - *c_clock
            - *c_client
            - *c_matter
            - *c_rev_a
          trigger:
            - call: "POST /conflicts-screenings"
              payload: { reviewer_id: "77777777-7777-4777-8777-777777777777", matter_id: "${m_id}", declared_adverse_parties: [] }
              as: StaffingCoordinator
              captures: { err_rev: $.data.error_id }
            - *c_screen_a
            - call: "POST /conflicts-screenings"
              payload: { reviewer_id: "${ra_id}", matter_id: "${m_id}", declared_adverse_parties: ["Calder Holdings LLC"] }
              as: StaffingCoordinator
              captures: { err_dup: $.data.error_id }
          assert:
            - "first call: HTTP 404 with error_id \"ERR_REVIEWER_NOT_FOUND\""
            - "second call: HTTP 201 with status \"PENDING\", reviewer_id ${ra_id} and matter_id ${m_id}"
            - "third call: HTTP 409 with error_id \"ERR_SCREENING_ALREADY_OPEN\" — PENDING is a non-terminal status"
            - "GET /conflicts-screenings?reviewer_id=${ra_id} returns exactly 1 row, with declared_adverse_parties == []"

      - name: computed_read_matches_the_calculation
        claim_type: computed_read
        grounds:
          - endpoints[GET /reviewers/{id}/scorecard]
        excluded_because:
          difficulty_instance: dual_variant_calc / reviewer_accuracy_sample_weighted_vs_assignment_mean
          rationale: "The scorecard read is asserted there under both weightings (0.9833 vs 0.9875) against the same sample set."

  # =========================================================================
  # SECTION: errors
  # =========================================================================
