  # ==========================================================================
  - rule_id: transitive_cascade
    instances:
      - name: verify_placement_cascades_task_to_line_to_file_to_store_posture
        grounds:
          - state_machines.LabelTask.placement_status=PLACED_to_placement_status=VERIFIED
          - state_machines.PriceChangeLine.LABELED_to_VERIFIED
          - state_machines.PriceChangeFile.PARTIALLY_EXECUTED_to_EXECUTED
          - calculations.store_label_backlog_count
          - calculations.store_compliance_posture
          - entities.Store.fields.executed_file_count
        distinguishing_aspect: |
          Downward-to-upward completion chain of depth 4 fired by ONE call: LabelTask (hop 1) ->
          PriceChangeLine (hop 2) -> PriceChangeFile (hop 3, bubble-up once verified_line_count ==
          line_count) -> Store (hop 4, executed_file_count then backlog then posture). The chain is
          verified end-to-end and the intermediate hop is proved necessary by the second line: with
          two lines the same verify call stops at hop 2 and the file stays PARTIALLY_EXECUTED.
        test_recipe:
