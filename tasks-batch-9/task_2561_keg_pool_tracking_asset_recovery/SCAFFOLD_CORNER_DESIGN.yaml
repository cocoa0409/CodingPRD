            - call: "GET /kegs/${k2_id}"
              payload: {}
              as: AssetRecoveryAnalyst
              as_user_id: "analyst-2"
              captures: { k2_v: "$.data.version" }
            - call: "POST /loss-assessments"
              payload: { keg_id: "${k2_id}", cause: "LOST_IN_TRADE", expected_keg_version: "${k2_v}", assessment_basis: "REPLACEMENT_COST" }
              as: AssetRecoveryAnalyst
              as_user_id: "analyst-2"
              captures: { la2_id: "$.data.id" }
            - call: "POST /loss-assessments/${la2_id}/resolve"
              payload: { resolution: "UPHELD", resolution_notes: "Second shell also unaccounted for." }
              as: AssetRecoveryAnalyst
              as_user_id: "analyst-1"
          trigger:
            - call: "POST /loss-assessments/${la1_id}/chargeback-resolution"
              payload: { action: "SETTLE", amount_cents: 6000 }
              as: AssetRecoveryAnalyst
              as_user_id: "analyst-2"
              captures: { e_settle_role: "$.data.error_id" }
            - call: "POST /loss-assessments/${la1_id}/chargeback-resolution"
              payload: { action: "SETTLE", amount_cents: 1 }
              as: AssetRecoveryAnalyst
              as_user_id: "analyst-2"
              captures: { e_settle_role_wrong_amount: "$.data.error_id" }
            - call: "POST /loss-assessments/${la1_id}/chargeback-resolution"
              payload: { action: "SETTLE", amount_cents: 6000 }
              as: PoolOperator
              as_user_id: "op-1"
            - call: "POST /loss-assessments/${la2_id}/chargeback-resolution"
              payload: { action: "REVERSE", resolution_notes: "Operator trying to erase its own liability." }
              as: PoolOperator
              as_user_id: "op-1"
              captures: { e_reverse_role: "$.data.error_id" }
            - call: "POST /loss-assessments/${la2_id}/chargeback-resolution"
              payload: { action: "REVERSE", resolution_notes: "Shell recovered from the distributor's yard." }
              as: AssetRecoveryAnalyst
              as_user_id: "analyst-1"
            - call: "POST /loss-assessments/${la1_id}/chargeback-resolution"
              payload: { action: "REVERSE", resolution_notes: "Too late, that one is settled." }
              as: AssetRecoveryAnalyst
              as_user_id: "analyst-1"
              captures: { e_terminal: "$.data.error_id" }
          assert:
            - "both analyst SETTLE attempts return HTTP 403 with error_id == ERR_SEGREGATION_OF_DUTIES, and the second one proves priority 26 beats priority 51: amount_cents 1 is wrong too, yet the response is the 403 role/action refusal, never 422 ERR_SETTLEMENT_AMOUNT_MISMATCH"
            - "the operator SETTLE returns HTTP 200 with chargeback_status == SETTLED, settled_amount_cents == 6000 and la1_net == 6000"
            - "the operator REVERSE attempt returns HTTP 403 ERR_SEGREGATION_OF_DUTIES and leaves LossAssessment.${la2_id}.chargeback_status == ISSUED"
            - "the analyst REVERSE returns HTTP 200 with chargeback_status == REVERSED while assessment_status stays UPHELD: the two dimensions are independent"
            - "Brewer.${b1_id}.chargeback_balance_cents == 6000 after the reversal (the SETTLED row stays in the sum, the REVERSED row leaves it), down from 12000"
            - "Brewer.${b1_id}.status is still PROBATION with status_reason == LOSS_RATE_THRESHOLD: the balance falling below 25000 does NOT lift a probation the loss-rate gate forced, and upheld_loss_count is still 2 with loss_rate_bp_trailing_90d == 10000"
            - "FloatAgreement.${fa1_id}.float_posture is still SUSPENDED because the brewer is still on probation"
            - "the REVERSE attempt on the settled row returns HTTP 409 ERR_INVALID_STATE (SETTLED is terminal) and is judged at priority 10, i.e. before priority 26 would have accepted the analyst's role"
            - "KegPool.${p1_id}: kegs_total == 4, kegs_available == 2, kegs_circulating == 0, kegs_written_off == 2, available_pct == 50.00, posture == OPEN — a reversal is a money event only and never resurrects a LOST keg"

