            - call: "POST /ramp-slots"
              payload: { service_visit_id: "${v_id}", pad_id: "${pad_id}", window_start_utc: "2026-06-14T10:00:00.000Z", window_end_utc: "2026-06-14T11:00:00.000Z" }
              as: OpsDispatcher
              captures: { s1_id: $.data.id }
            - call: "POST /ramp-slots/${s1_id}/approve"
              payload: {}
              as: OpsDispatcher
            - call: "POST /ramp-slots"
              payload: { service_visit_id: "${v_id}", pad_id: "${pad_id}", window_start_utc: "2026-06-14T11:00:00.000Z", window_end_utc: "2026-06-14T12:00:00.000Z" }
              as: OpsDispatcher
              captures: { s2_id: $.data.id }
            - call: "POST /ramp-slots"
              payload: { service_visit_id: "${v_id}", pad_id: "${pad_id}", window_start_utc: "2026-06-14T10:30:00.000Z", window_end_utc: "2026-06-14T11:30:00.000Z" }
              as: OpsDispatcher
              captures: { s3_id: $.data.id }
          trigger:
            - call: "POST /ramp-slots/${s2_id}/approve"
              payload: {}
              as: OpsDispatcher
            - call: "POST /ramp-slots/${s3_id}/approve"
              payload: {}
              as: OpsDispatcher
          assert:
            - "RampSlot.${s2_id}.status == APPROVED"
            - "second trigger response.error_id == ERR_SLOT_OVERLAP"
            - "RampSlot.${s3_id}.status == REQUESTED"

  # =========================================================================
  # Rule 9 — Compensating-action invariants across different conserved quantities
  # =========================================================================
  - rule_id: compensating_invariant
    instances:
      - name: adjust_billing_conserves_invoice_total_equals_lines
        grounds:
          - state_machines.FuelOrder.IN_REVIEW_to_ADJUSTED
          - calculations.invoice_total
          - entities.Invoice.fields.total_cents
        distinguishing_aspect: |
          Conserved quantity #1: Invoice.total_cents MUST equal the live sum of its
          visit's billable lines after the adjust-billing re-price. After adjusting
          a flagged order from 3115000 to 3238600, total_cents == 3238600 == the
          sum of lines (the single fuel line), with no drift.
        test_recipe:
          setup:
            - "A DEPARTED visit with an ISSUED Invoice (total 3115000) whose only fuel order is IN_REVIEW after a +4.00% over-delivery (delivered 6240)."
          setup_api_calls:
            - call: "POST /operators"
              payload: { legal_name: "Aero Ops", contact_email: "ops@aero.test" }
              as: BillingClerk
              captures: { op_id: $.data.id }
            - call: "POST /aircraft"
              payload: { operator_id: "${op_id}", tail_number: "N100AA", fuel_type: "JET_A", mtow_lb: 30000 }
              as: OpsDispatcher
              captures: { ac_id: $.data.id }
            - call: "POST /fuel-contracts"
              payload: { operator_id: "${op_id}", product: "JET_A", base_price_cents_per_gal: 520, tankering_fee_cents_per_gal: 30 }
              as: BillingClerk
              captures: { fc_id: $.data.id }
            - call: "POST /service-visits"
              payload: { operator_id: "${op_id}", aircraft_id: "${ac_id}", arrival_utc: "2026-06-14T08:00:00.000Z", departure_utc: "2026-06-15T08:00:00.000Z" }
              as: OpsDispatcher
              captures: { v_id: $.data.id }
            - call: "POST /service-visits/${v_id}/arrive"
              payload: {}
              as: OpsDispatcher
            - call: "POST /fuel-orders"
              payload: { service_visit_id: "${v_id}", aircraft_id: "${ac_id}", fuel_contract_id: "${fc_id}", product: "JET_A", ordered_gallons: 6000, tankering: false }
              as: FuelTech
              captures: { fo_id: $.data.id }
            - call: "POST /fuel-orders/${fo_id}/dispatch"
              payload: {}
              as: FuelTech
            - call: "POST /fuel-orders/${fo_id}/complete-fueling"
              payload: {}
              as: FuelTech
            - call: "POST /into-plane-tickets"
              payload: { fuel_order_id: "${fo_id}", delivered_gallons: 6240 }
              as: FuelTech
            - call: "POST /service-visits/${v_id}/mark-ready"
              payload: {}
              as: OpsDispatcher
            - call: "POST /service-visits/${v_id}/depart"
              payload: {}
              as: OpsDispatcher
          trigger:
            - call: "POST /fuel-orders/${fo_id}/adjust-billing"
              payload: {}
              as: BillingClerk
          assert:
            - "Invoice[service_visit_id=${v_id}].total_cents == 3238600"
            - "Invoice[service_visit_id=${v_id}].total_cents == FuelOrder.${fo_id}.priced_amount_cents"

      - name: void_conserves_operator_open_balance
        grounds:
          - state_machines.Invoice.ISSUED_to_VOID
          - entities.Operator.fields.open_invoice_balance_cents
          - calculations.invoice_total
        distinguishing_aspect: |
          Conserved quantity #2 (a different quantity than Invoice.total_cents):
          operator.open_invoice_balance_cents MUST equal the sum of (total_cents -
          paid_cents) over the operator's ISSUED/PAST_DUE invoices. Voiding the
          sole ISSUED invoice (180000) drops it from the sum, leaving the balance
          at exactly 0 with no drift.
        test_recipe:
          setup:
            - "A DEPARTED visit with one ISSUED Invoice (total 180000 from a tankered 6000-gal order); operator.open_invoice_balance_cents == 180000."
          setup_api_calls:
            - call: "POST /operators"
              payload: { legal_name: "Aero Ops", contact_email: "ops@aero.test" }
              as: BillingClerk
              captures: { op_id: $.data.id }
            - call: "POST /aircraft"
              payload: { operator_id: "${op_id}", tail_number: "N100AA", fuel_type: "JET_A", mtow_lb: 30000 }
              as: OpsDispatcher
              captures: { ac_id: $.data.id }
            - call: "POST /fuel-contracts"
              payload: { operator_id: "${op_id}", product: "JET_A", base_price_cents_per_gal: 520, tankering_fee_cents_per_gal: 30 }
              as: BillingClerk
              captures: { fc_id: $.data.id }
            - call: "POST /service-visits"
              payload: { operator_id: "${op_id}", aircraft_id: "${ac_id}", arrival_utc: "2026-06-14T08:00:00.000Z", departure_utc: "2026-06-15T08:00:00.000Z" }
              as: OpsDispatcher
              captures: { v_id: $.data.id }
            - call: "POST /service-visits/${v_id}/arrive"
              payload: {}
              as: OpsDispatcher
            - call: "POST /fuel-orders"
              payload: { service_visit_id: "${v_id}", aircraft_id: "${ac_id}", fuel_contract_id: "${fc_id}", product: "JET_A", ordered_gallons: 6000, tankering: true }
              as: FuelTech
              captures: { fo_id: $.data.id }
            - call: "POST /fuel-orders/${fo_id}/dispatch"
              payload: {}
              as: FuelTech
            - call: "POST /fuel-orders/${fo_id}/complete-fueling"
              payload: {}
              as: FuelTech
            - call: "POST /service-visits/${v_id}/mark-ready"
              payload: {}
              as: OpsDispatcher
            - call: "POST /service-visits/${v_id}/depart"
              payload: {}
              as: OpsDispatcher
              captures: { v_status: $.data.status }
            - call: "GET /invoices"
              payload: { service_visit_id: "${v_id}" }
              as: BillingClerk
              captures: { inv_id: $.data.0.id }
          trigger:
            - call: "POST /invoices/${inv_id}/void"
              payload: {}
              as: LineManager
          assert:
            - "Invoice.${inv_id}.status == VOID"
            - "Operator.${op_id}.open_invoice_balance_cents == 0"
