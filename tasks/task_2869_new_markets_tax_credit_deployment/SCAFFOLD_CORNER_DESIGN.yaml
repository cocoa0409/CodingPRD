            - "The duplicate CDE returns HTTP 409 with error_id == \"ERR_DUPLICATE_CERTIFICATION_NUMBER\"; GET /nmtc/cdes still reports total_count == 1"
            - "The duplicate tract returns HTTP 409 with error_id == \"ERR_DUPLICATE_TRACT_CODE\"; the stored tract keeps state_code MS and poverty_rate_pct 32.00"
            - "Uniqueness wins over content: neither call is treated as an update"

      - name: reinvesting_after_the_365_day_deadline_returns_reinvestment_deadline_passed
