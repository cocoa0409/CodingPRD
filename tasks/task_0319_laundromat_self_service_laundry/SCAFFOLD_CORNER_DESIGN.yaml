# =============================================================================
# task_0319 — Laundromat & Self-Service Laundry — §1.9 Scaffold Corner Design
# Breadth probe: enumerates testable claims from §1.1–§1.7 not already covered
# by §1.8. Sections/claim_types follow references/claim-extraction-guide.md.
# Every active recipe is empty-DB reachable via §1.5 endpoints.
# =============================================================================
scaffold_corner_design:

  # ===========================================================================
  - section: entities
    instances:
      - name: create_machine_returns_201_with_defaults
        claim_type: Creation
        grounds:
          - "entities.Machine"
          - "endpoints"
        distinguishing_aspect: "POST /machines with required fields -> 201; status defaults to IDLE, lifetime_vend_count=0, fault_count=0, version=1."
        test_recipe:
          setup: ["Empty DB."]
          setup_api_calls: []
          trigger:
            - call: "POST /machines"
              payload: { label: "W1", machine_type: "WASHER", capacity_lb: 25 }
              as: Manager
              captures: { w1_id: $.data.id }
          assert:
            - "Machine.${w1_id}.status == IDLE"
            - "Machine.${w1_id}.lifetime_vend_count == 0"
            - "Machine.${w1_id}.fault_count == 0"
            - "Machine.${w1_id}.version == 1"

      - name: get_machine_not_found_returns_404
        claim_type: Not Found
        grounds:
          - "entities.Machine"
          - "validations[priority=3]"
        distinguishing_aspect: "GET /machines/{id} with a non-existent UUID returns ERR_NOT_FOUND (404)."
        test_recipe:
          setup: ["Empty DB."]
          setup_api_calls: []
          trigger:
            - call: "GET /machines/00000000-0000-4000-8000-000000000000"
              payload: {}
              as: Manager
              captures: { err: $.data.error_id }
          assert:
            - "response error_id == ERR_NOT_FOUND"
            - "HTTP status == 404"

      - name: create_member_missing_required_field_returns_422
        claim_type: Required Fields
        grounds:
          - "entities.Member"
          - "validations[priority=4]"
        distinguishing_aspect: "POST /members omitting required card_token -> ERR_INVALID_REQUEST (422)."
        test_recipe:
          setup: ["Empty DB."]
          setup_api_calls: []
          trigger:
            - call: "POST /members"
              payload: { full_name: "M One", phone: "555-0001" }
              as: Manager
              captures: { err: $.data.error_id }
          assert:
            - "response error_id == ERR_INVALID_REQUEST"
            - "HTTP status == 422"

      - name: member_defaults_active_zero_balances_on_create
        claim_type: Defaults
        grounds:
          - "entities.Member.fields.status"
          - "entities.Member.fields.wallet_cents"
        distinguishing_aspect: "POST /members applies defaults: status=ACTIVE, wallet_cents=0, loyalty_points=0, free_wash_credits=0, lifetime_spend_cents=0."
        test_recipe:
          setup: ["Empty DB."]
          setup_api_calls: []
          trigger:
            - call: "POST /members"
              payload: { full_name: "M One", phone: "555-0001", card_token: "tok-m1" }
              as: Manager
              captures: { m1_id: $.data.id }
          assert:
            - "Member.${m1_id}.status == ACTIVE"
            - "Member.${m1_id}.wallet_cents == 0"
            - "Member.${m1_id}.loyalty_points == 0"
            - "Member.${m1_id}.free_wash_credits == 0"

      - name: vend_charged_amount_is_computed_input_ignored
        claim_type: Computed Fields
        grounds:
          - "entities.VendTransaction.fields.charged_amount_cents"
          - "calculations.vend_charged_cents"
        distinguishing_aspect: "charged_amount_cents is server-computed; it is not a §1.5 input field, so a COIN washer vend charges exactly wash_base_cents=300 regardless of any client-supplied value."
        test_recipe:
          setup: ["ACTIVE plan P1 (wash_base 300); IDLE WASHER W1; clock 2026-06-01T10:00:00Z."]
          setup_api_calls:
            - call: "POST /_clock/advance"
              payload: { to_iso8601: "2026-06-01T10:00:00Z" }
              as: Manager
            - call: "POST /pricing-plans"
              payload: { label: "P1", wash_base_cents: 300, dry_base_cents_per_block: 75, wdf_rate_cents_per_lb: 180 }
              as: Manager
              captures: { plan_id: $.data.id }
            - call: "POST /pricing-plans/${plan_id}/activate"
              payload: {}
              as: Manager
            - call: "POST /machines"
              payload: { label: "W1", machine_type: "WASHER", capacity_lb: 25 }
              as: Manager
              captures: { w1_id: $.data.id, w1_v: $.data.version }
          trigger:
            - call: "POST /machines/${w1_id}/vends"
              payload: { payment_method: "COIN", expected_machine_version: "${w1_v}" }
              as: Attendant
              as_user_id: "attendant-op"
              captures: { vend_id: $.data.id }
          assert:
            - "VendTransaction.${vend_id}.charged_amount_cents == 300"

      - name: machine_system_fields_generated_not_client_set
        claim_type: System Fields
        grounds:
          - "entities.Machine.fields.id"
          - "entities.Machine.fields.status"
        distinguishing_aspect: "id, created_at, updated_at, version, and computed status are server-minted on POST /machines; client cannot set them (id is a UUID, version=1)."
        test_recipe:
          setup: ["Empty DB."]
          setup_api_calls: []
          trigger:
            - call: "POST /machines"
              payload: { label: "W1", machine_type: "WASHER", capacity_lb: 25 }
              as: Manager
              captures: { w1_id: $.data.id }
          assert:
            - "Machine.${w1_id}.id is a server-minted UUID"
            - "Machine.${w1_id}.version == 1"
            - "Machine.${w1_id}.created_at is ISO8601"

      - name: machine_invalid_enum_type_returns_422
        claim_type: Type Constraints
        grounds:
          - "entities.Machine.fields.machine_type"
          - "validations[priority=4]"
        distinguishing_aspect: "POST /machines with machine_type='TUMBLER' (not in WASHER|DRYER) -> ERR_INVALID_REQUEST (422)."
        test_recipe:
          setup: ["Empty DB."]
          setup_api_calls: []
          trigger:
            - call: "POST /machines"
              payload: { label: "X1", machine_type: "TUMBLER", capacity_lb: 25 }
              as: Manager
              captures: { err: $.data.error_id }
          assert:
            - "response error_id == ERR_INVALID_REQUEST"
            - "HTTP status == 422"

      - name: loyalty_ledger_is_immutable_no_update_endpoint
        claim_type: Immutability
        grounds:
          - "entities.LoyaltyLedgerEntry"
        distinguishing_aspect: "LoyaltyLedgerEntry has common_fields:false (only id+created_at, no version) and no PUT/PATCH/DELETE endpoint exists in §1.5; entries are append-only audit records."
        test_recipe:
          setup: ["No mutation endpoint is declared for LoyaltyLedgerEntry; only GET /members/{id}/loyalty-ledger exists."]
          setup_api_calls: []
          trigger:
            - call: "GET /members/00000000-0000-4000-8000-000000000000/loyalty-ledger"
              payload: {}
              as: Manager
              captures: { err: $.data.error_id }
          assert:
            - "response error_id == ERR_NOT_FOUND (member does not exist; no write endpoint for ledger entries is declared in §1.5)"

      - name: list_machines_pagination_envelope
        claim_type: Listing
        grounds:
          - "endpoints"
          - "entities.Machine"
        distinguishing_aspect: "GET /machines returns an array response with pagination fields total_count and has_more honoring limit/offset."
        test_recipe:
          setup: ["Two machines registered."]
          setup_api_calls:
            - call: "POST /machines"
              payload: { label: "W1", machine_type: "WASHER", capacity_lb: 25 }
              as: Manager
            - call: "POST /machines"
              payload: { label: "D1", machine_type: "DRYER", capacity_lb: 30 }
              as: Manager
          trigger:
            - call: "GET /machines"
              payload: { limit: 1, offset: 0 }
              as: Manager
          assert:
            - "response_type == array; data length == 1; total_count == 2; has_more == true"

  # ===========================================================================
  - section: state_machines
    instances:
      - name: clear_machine_from_idle_returns_invalid_state
        claim_type: Invalid Transitions
        grounds:
          - "state_machines.Machine.DONE_to_IDLE"
          - "validations[priority=6]"
        distinguishing_aspect: "POST /machines/{id}/clear on an IDLE machine (no DONE/FAULT state) -> ERR_INVALID_STATE (409); no side effects fire."
        test_recipe:
          setup: ["One IDLE WASHER W1 (never vended)."]
          setup_api_calls:
            - call: "POST /machines"
              payload: { label: "W1", machine_type: "WASHER", capacity_lb: 25 }
              as: Manager
              captures: { w1_id: $.data.id }
          trigger:
            - call: "POST /machines/${w1_id}/clear"
              payload: {}
              as: Attendant
              as_user_id: "attendant-op"
              captures: { err: $.data.error_id }
          assert:
            - "response error_id == ERR_INVALID_STATE"
            - "Machine.${w1_id}.status == IDLE"

      - name: wdf_pay_from_dropped_returns_invalid_state
        claim_type: Invalid Transitions
        grounds:
          - "state_machines.WdfOrder.READY_to_PAID"
          - "validations[priority=6]"
        distinguishing_aspect: "POST /wdf-orders/{id}/pay while order is DROPPED (not READY) -> ERR_INVALID_STATE (409)."
        test_recipe:
          setup: ["ACTIVE plan P1; attendant A1; a DROPPED WDF order (20 lb)."]
          setup_api_calls:
            - call: "POST /pricing-plans"
              payload: { label: "P1", wash_base_cents: 300, dry_base_cents_per_block: 75, wdf_rate_cents_per_lb: 180 }
              as: Manager
              captures: { plan_id: $.data.id }
            - call: "POST /pricing-plans/${plan_id}/activate"
              payload: {}
              as: Manager
            - call: "POST /members"
              payload: { full_name: "A One", phone: "555-0100", card_token: "tok-a1" }
              as: Manager
              captures: { a1_id: $.data.id }
            - call: "POST /wdf-orders"
              payload: { intake_attendant_id: "${a1_id}", weight_lb: 20 }
              as: Attendant
              as_user_id: "${a1_id}"
              captures: { order_id: $.data.id }
          trigger:
            - call: "POST /wdf-orders/${order_id}/pay"
              payload: { pay_method: "CASH" }
              as: Attendant
              as_user_id: "${a1_id}"
              captures: { err: $.data.error_id }
          assert:
            - "response error_id == ERR_INVALID_STATE"
            - "WdfOrder.${order_id}.status == DROPPED"

      - name: refund_approve_twice_idempotency_rejected
        claim_type: Idempotency
        grounds:
          - "state_machines.RefundClaim.SUBMITTED_to_APPROVED"
          - "validations[priority=6]"
        distinguishing_aspect: "Approving an already-APPROVED RefundClaim a second time -> ERR_INVALID_STATE (409); the claim is terminal."
        test_recipe:
          setup: ["ACTIVE plan P1; member M1 with an APPROVED RefundClaim against a refunded vend."]
          setup_api_calls:
            - call: "POST /_clock/advance"
              payload: { to_iso8601: "2026-06-01T10:00:00Z" }
              as: Manager
            - call: "POST /pricing-plans"
              payload: { label: "P1", wash_base_cents: 300, dry_base_cents_per_block: 75, wdf_rate_cents_per_lb: 180, loyalty_cents_per_point: 100, reload_bonus_tier2_min_cents: 5000, reload_bonus_tier2_bps: 1000, reload_bonus_tier1_min_cents: 2000, reload_bonus_tier1_bps: 500 }
              as: Manager
              captures: { plan_id: $.data.id }
            - call: "POST /pricing-plans/${plan_id}/activate"
              payload: {}
              as: Manager
            - call: "POST /machines"
              payload: { label: "W1", machine_type: "WASHER", capacity_lb: 25 }
              as: Manager
              captures: { w1_id: $.data.id, w1_v: $.data.version }
            - call: "POST /members"
              payload: { full_name: "M One", phone: "555-0001", card_token: "tok-m1" }
              as: Manager
              captures: { m1_id: $.data.id }
            - call: "POST /members/${m1_id}/reloads"
              payload: { tender: "APP", principal_cents: 5000 }
              as: Member
              as_user_id: "${m1_id}"
            - call: "POST /machines/${w1_id}/vends"
              payload: { payment_method: "APP_WALLET", member_id: "${m1_id}", expected_machine_version: "${w1_v}" }
              as: Member
              as_user_id: "${m1_id}"
              captures: { vend_id: $.data.id }
            - call: "POST /refund-claims"
              payload: { vend_id: "${vend_id}", reported_by_id: "${m1_id}", reason: "NO_CYCLE", refund_destination: "WALLET" }
              as: Member
              as_user_id: "${m1_id}"
              captures: { claim_id: $.data.id, claim_v: $.data.version }
            - call: "POST /refund-claims/${claim_id}/approve"
              payload: { expected_claim_version: "${claim_v}" }
              as: Manager
              captures: { claim_v2: $.data.version }
          trigger:
            - call: "POST /refund-claims/${claim_id}/approve"
              payload: { expected_claim_version: "${claim_v2}" }
              as: Manager
              captures: { err: $.data.error_id }
          assert:
            - "response error_id == ERR_INVALID_STATE"
            - "RefundClaim.${claim_id}.status == APPROVED"

      - name: wdf_cancel_from_paid_terminal_lockdown
        claim_type: Terminal State Lockdown
        grounds:
          - "state_machines.WdfOrder.terminal_states"
          - "validations[priority=6]"
        distinguishing_aspect: "POST /wdf-orders/{id}/cancel on a PAID (terminal) order -> ERR_INVALID_STATE (409); no transition out of PAID exists."
        test_recipe:
          setup: ["ACTIVE plan P1; attendant A1; member M1 wallet 5000; a PAID WDF order (20 lb, 3600 cents, APP_WALLET)."]
          setup_api_calls:
            - call: "POST /pricing-plans"
              payload: { label: "P1", wash_base_cents: 300, dry_base_cents_per_block: 75, wdf_rate_cents_per_lb: 180, reload_bonus_tier2_min_cents: 5000, reload_bonus_tier2_bps: 1000, reload_bonus_tier1_min_cents: 2000, reload_bonus_tier1_bps: 500 }
              as: Manager
              captures: { plan_id: $.data.id }
            - call: "POST /pricing-plans/${plan_id}/activate"
              payload: {}
              as: Manager
            - call: "POST /members"
              payload: { full_name: "A One", phone: "555-0100", card_token: "tok-a1" }
              as: Manager
              captures: { a1_id: $.data.id }
            - call: "POST /members"
              payload: { full_name: "M One", phone: "555-0001", card_token: "tok-m1" }
              as: Manager
              captures: { m1_id: $.data.id }
            - call: "POST /members/${m1_id}/reloads"
              payload: { tender: "APP", principal_cents: 5000 }
              as: Member
              as_user_id: "${m1_id}"
            - call: "POST /wdf-orders"
              payload: { intake_attendant_id: "${a1_id}", member_id: "${m1_id}", weight_lb: 20 }
              as: Attendant
              as_user_id: "${a1_id}"
              captures: { order_id: $.data.id }
            - call: "POST /wdf-orders/${order_id}/start"
              payload: {}
              as: Attendant
              as_user_id: "${a1_id}"
            - call: "POST /wdf-orders/${order_id}/ready"
              payload: {}
              as: Attendant
              as_user_id: "${a1_id}"
            - call: "POST /wdf-orders/${order_id}/pay"
              payload: { pay_method: "APP_WALLET" }
              as: Member
              as_user_id: "${m1_id}"
          trigger:
            - call: "POST /wdf-orders/${order_id}/cancel"
              payload: {}
              as: Member
              as_user_id: "${m1_id}"
              captures: { err: $.data.error_id }
          assert:
            - "response error_id == ERR_INVALID_STATE"
            - "WdfOrder.${order_id}.status == PAID"

      - name: clock_advance_completes_running_cycle_bubble_up
        claim_type: Side Effect Execution
        grounds:
          - "state_machines.Machine.RUNNING_to_DONE"
          - "endpoints"
        distinguishing_aspect: "POST /_clock/advance past cycle_ends_at drives Machine RUNNING->DONE, the vend cycle_status RUNNING->COMPLETED, and lifetime_vend_count++."
        test_recipe:
          setup: ["ACTIVE plan P1; WASHER W1 cycle_minutes=30 RUNNING from a 10:00 COIN vend (cycle_ends_at 10:30)."]
          setup_api_calls:
            - call: "POST /_clock/advance"
              payload: { to_iso8601: "2026-06-01T10:00:00Z" }
              as: Manager
            - call: "POST /pricing-plans"
              payload: { label: "P1", wash_base_cents: 300, dry_base_cents_per_block: 75, wdf_rate_cents_per_lb: 180 }
              as: Manager
              captures: { plan_id: $.data.id }
            - call: "POST /pricing-plans/${plan_id}/activate"
              payload: {}
              as: Manager
            - call: "POST /machines"
              payload: { label: "W1", machine_type: "WASHER", capacity_lb: 25, cycle_minutes: 30 }
              as: Manager
              captures: { w1_id: $.data.id, w1_v: $.data.version }
            - call: "POST /machines/${w1_id}/vends"
              payload: { payment_method: "COIN", expected_machine_version: "${w1_v}" }
              as: Attendant
              as_user_id: "attendant-op"
              captures: { vend_id: $.data.id }
          trigger:
            - call: "POST /_clock/advance"
              payload: { to_iso8601: "2026-06-01T10:30:00Z" }
              as: Manager
          assert:
            - "Machine.${w1_id}.status == DONE"
            - "VendTransaction.${vend_id}.cycle_status == COMPLETED"
            - "Machine.${w1_id}.lifetime_vend_count == 1"

      - name: lostfound_claim_sets_claimed_by_side_effect
        claim_type: Valid Transition
        grounds:
          - "state_machines.LostFoundItem.LOGGED_to_CLAIMED"
          - "entities.LostFoundItem.fields.claimed_by_id"
        distinguishing_aspect: "POST /lost-found/{id}/claim moves LOGGED->CLAIMED and sets claimed_by_id to the supplied member."
        test_recipe:
          setup: ["Attendant A1; member M1; a LOGGED lost-found item."]
          setup_api_calls:
            - call: "POST /members"
              payload: { full_name: "A One", phone: "555-0100", card_token: "tok-a1" }
              as: Manager
              captures: { a1_id: $.data.id }
            - call: "POST /members"
              payload: { full_name: "M One", phone: "555-0001", card_token: "tok-m1" }
              as: Manager
              captures: { m1_id: $.data.id }
            - call: "POST /lost-found"
              payload: { logged_by_id: "${a1_id}", description: "blue sock" }
              as: Attendant
              as_user_id: "${a1_id}"
              captures: { item_id: $.data.id }
          trigger:
            - call: "POST /lost-found/${item_id}/claim"
              payload: { claimed_by_id: "${m1_id}" }
              as: Attendant
              as_user_id: "${a1_id}"
          assert:
            - "LostFoundItem.${item_id}.status == CLAIMED"
            - "LostFoundItem.${item_id}.claimed_by_id == ${m1_id}"

  # ===========================================================================
  - section: calculations
    instances:
      - name: reload_below_tier1_min_yields_zero_bonus
        claim_type: Correct Result
        grounds:
          - "calculations.reload_bonus_cents"
          - "entities.PricingPlan.fields.reload_bonus_tier1_min_cents"
        distinguishing_aspect: "principal_cents=1999 (just below tier1 min 2000) -> bonus_cents=0, credited_cents=1999."
        test_recipe:
          setup: ["ACTIVE plan P1 (tier1 min 2000@5%, tier2 min 5000@10%); member M1 wallet 0."]
          setup_api_calls:
            - call: "POST /pricing-plans"
              payload: { label: "P1", wash_base_cents: 300, dry_base_cents_per_block: 75, wdf_rate_cents_per_lb: 180, reload_bonus_tier1_min_cents: 2000, reload_bonus_tier1_bps: 500, reload_bonus_tier2_min_cents: 5000, reload_bonus_tier2_bps: 1000 }
              as: Manager
              captures: { plan_id: $.data.id }
            - call: "POST /pricing-plans/${plan_id}/activate"
              payload: {}
              as: Manager
            - call: "POST /members"
              payload: { full_name: "M One", phone: "555-0001", card_token: "tok-m1" }
              as: Manager
              captures: { m1_id: $.data.id }
          trigger:
            - call: "POST /members/${m1_id}/reloads"
              payload: { tender: "APP", principal_cents: 1999 }
              as: Member
              as_user_id: "${m1_id}"
              captures: { reload_id: $.data.id }
          assert:
            - "ReloadTransaction.${reload_id}.bonus_cents == 0"
            - "ReloadTransaction.${reload_id}.credited_cents == 1999"
            - "Member.${m1_id}.wallet_cents == 1999"

      - name: reload_tier2_floor_rounding
        claim_type: Precision
        grounds:
          - "calculations.reload_bonus_cents"
        distinguishing_aspect: "principal_cents=4999 hits tier1 (2000<=4999<5000) at 5% -> floor(4999*500/10000)=floor(249.95)=249, credited 5248."
        test_recipe:
          setup: ["ACTIVE plan P1 (tier1 2000@5%, tier2 5000@10%); member M1 wallet 0."]
          setup_api_calls:
            - call: "POST /pricing-plans"
              payload: { label: "P1", wash_base_cents: 300, dry_base_cents_per_block: 75, wdf_rate_cents_per_lb: 180, reload_bonus_tier1_min_cents: 2000, reload_bonus_tier1_bps: 500, reload_bonus_tier2_min_cents: 5000, reload_bonus_tier2_bps: 1000 }
              as: Manager
              captures: { plan_id: $.data.id }
            - call: "POST /pricing-plans/${plan_id}/activate"
              payload: {}
              as: Manager
            - call: "POST /members"
              payload: { full_name: "M One", phone: "555-0001", card_token: "tok-m1" }
              as: Manager
              captures: { m1_id: $.data.id }
          trigger:
            - call: "POST /members/${m1_id}/reloads"
              payload: { tender: "APP", principal_cents: 4999 }
              as: Member
              as_user_id: "${m1_id}"
              captures: { reload_id: $.data.id }
          assert:
            - "ReloadTransaction.${reload_id}.bonus_cents == 249"
            - "ReloadTransaction.${reload_id}.credited_cents == 5248"

      - name: wdf_no_rush_no_minimum_uses_raw
        claim_type: Correct Result
        grounds:
          - "calculations.wdf_total_cents"
        distinguishing_aspect: "A 20-lb non-rush load: raw=3600 exceeds minimum 1500, no rush -> quoted_total_cents=3600 (raw path, minimum not binding)."
        test_recipe:
          setup: ["ACTIVE plan P1 (wdf_rate 180/lb, min 1500); attendant A1."]
          setup_api_calls:
            - call: "POST /pricing-plans"
              payload: { label: "P1", wash_base_cents: 300, dry_base_cents_per_block: 75, wdf_rate_cents_per_lb: 180, wdf_minimum_cents: 1500 }
              as: Manager
              captures: { plan_id: $.data.id }
            - call: "POST /pricing-plans/${plan_id}/activate"
              payload: {}
              as: Manager
            - call: "POST /members"
              payload: { full_name: "A One", phone: "555-0100", card_token: "tok-a1" }
              as: Manager
              captures: { a1_id: $.data.id }
          trigger:
            - call: "POST /wdf-orders"
              payload: { intake_attendant_id: "${a1_id}", weight_lb: 20, rush: false }
              as: Attendant
              as_user_id: "${a1_id}"
              captures: { order_id: $.data.id }
          assert:
            - "WdfOrder.${order_id}.quoted_total_cents == 3600"

      - name: vend_loyalty_accrual_floor_app_only
        claim_type: Input Set Filtering
        grounds:
          - "calculations.vend_charged_cents"
          - "entities.VendTransaction.fields.loyalty_points_earned"
