# =============================================================================
# SCAFFOLD.yaml — Core Banking Platform Conversion for a Community Institution
# Difficulty instruction: "Generate task much harder than expert level!"
# §1.0–§1.7 only; §1.8 lives in SCAFFOLD_DIFFICULTY_DESIGN.yaml,
# §1.9 lives in SCAFFOLD_CORNER_DESIGN.yaml.
# =============================================================================

scenario: |
  Core Banking Platform Conversion for a Community Institution (Fiserv):
  discovery of the incumbent core with product, account and general ledger
  mapping, product parameter design for deposit and loan types including
  accrual, fee and statement behavior, data conversion with multiple mock
  runs, balancing reports and exception clearing, cutover weekend plan
  covering file freeze, conversion window, balancing and reopening, ancillary
  system reintegration across cards, online banking, item processing and
  reporting, staff training and branch readiness with parallel operations,
  customer communication on changed account numbers, card reissues and
  payment redirection, post-conversion defect triage and vendor service
  credits.

domain_name: core-banking-conversion
api_prefix: /api/v1

complexity_profile:
  primary_archetype: compliance_audit
  secondary_archetype: ledger_reconciliation
  complexity_layers:
    - optimistic_concurrency
    - cascading_side_effects
    - dual_variant_calculation
    - ops_run_checkpoint
  entity_topology: flat
  state_machine_shape: compound
  relationship_patterns:
    - one_to_many
    - self_referential
    - cross_aggregate
  # note: URLs are flat collections; scoping is by explicit project_id /
  # plan_id / session_id request fields rather than nested paths
  role_model: segregation_of_duties
  consistency_model: immediate

# =============================================================================
# §1.1 Entity-Relationship Table (13 entities)
# =============================================================================
entities:
  - name: ConversionProject
    parent: null
    common_fields: true
    fields:
      - { name: institution_name, type: string, source: input, description: "Legal name of the community institution" }
      - { name: incumbent_core_name, type: string, source: input, description: "Name of the incumbent core platform being replaced" }
      - { name: target_core_name, type: string, source: input, description: "Name of the target Fiserv core platform" }
      - { name: status, type: enum, source: system, description: "DISCOVERY | CONFIGURATION | MOCK_CONVERSION | CUTOVER_PLANNED | LIVE | CLOSED", constraints: "see ConversionProject state machine" }
      - { name: mock_runs_used, type: integer, source: computed, description: "Count of MockRun rows with outcome FAILED, PASSED_WITH_EXCEPTIONS, or PASSED", default: 0 }
      - { name: cutover_scheduled_date, type: string, source: input, description: "Planned cutover date, YYYY-MM-DD; may be null until CUTOVER_PLANNED", default: null, constraints: "must be strictly after the logical clock date when set" }
      - { name: cutoff_business_date, type: string, source: system, description: "Authoritative business date for cutoff; set when the project transitions to LIVE as the clock date MINUS one day (the frozen business day; day-1 accrual runs through it)", default: null }

  - name: ProductType
    parent: null
    common_fields: true
    fields:
      - { name: project_id, type: string, source: system, description: "FK -> ConversionProject.id; reverse lookup: GET /api/v1/product-types?project_id= returns this entity list; owning conversion project" }
      - { name: product_code, type: string, source: input, description: "Short product code, unique per project", constraints: "unique within project" }
      - { name: kind, type: enum, source: input, description: "DEPOSIT | LOAN" }
      - { name: accrual_method, type: enum, source: input, description: "ACT_365 | ACT_360 | THIRTY_360", constraints: "DEPOSIT must not use THIRTY_360; LOAN must not use ACT_365" }
      - { name: rate, type: number, source: input, description: "Nominal annual rate as decimal, e.g. 0.03 for 3%; sign enforced by kind", constraints: ">= 0 for DEPOSIT, > 0 for LOAN" }
      - { name: monthly_fee_cents, type: integer, source: input, description: "Monthly maintenance fee in cents", default: 0, constraints: ">= 0" }
      - { name: fee_waiver_threshold_cents, type: integer, source: input, description: "Minimum average daily balance that waives the monthly fee; null means never waived", default: null }
      - { name: minimum_balance_cents, type: integer, source: input, description: "Minimum balance enforced on deposit accounts", default: 0 }
      - { name: statement_frequency, type: enum, source: input, description: "MONTHLY | QUARTERLY" }
      - { name: status, type: enum, source: system, description: "DRAFT | ACTIVE | RETIRED" }

  - name: Account
    parent: null
    common_fields: true
    fields:
      - { name: project_id, type: string, source: system, description: "FK -> ConversionProject.id; reverse lookup: GET /api/v1/accounts?project_id= returns this entity list; owning conversion project" }
      - { name: legacy_account_number, type: string, source: input, description: "Account number on the incumbent core", constraints: "unique per project" }
      - { name: new_account_number, type: string, source: system, description: "Converted account number on the target core; minted at Account creation (renumbering is out of scope for this task)" }
      - { name: account_type, type: enum, source: input, description: "DEPOSIT | LOAN" }
      - { name: product_type_id, type: string, source: input, description: "FK -> ProductType.id; governing product; kind must match account_type; reverse lookup: GET /api/v1/accounts?product_type_id=<product-id>" }
      - { name: status, type: enum, source: system, description: "STAGED | MAPPED | EXCEPTION | CLEARED | CONVERTED | BLOCKED" }
      - { name: exception_note, type: string, source: system, description: "Last exception note recorded when the account entered EXCEPTION", default: null }
      - { name: frozen_flag, type: boolean, source: system, description: "True while the project is in the file-freeze window (CUTOVER_PLANNED or LIVE)", default: false }
      - { name: opening_principal_cents, type: integer, source: input, description: "Balance on the incumbent core at freeze (ledger balance, cents)", constraints: ">= 0" }
      - { name: conversion_balance_cents, type: integer, source: computed, description: "Latest converted balance written by the most recent MockRun balance computation, or the cutover-day1 projection once CONVERTED" }
      - { name: cutoff_accrued_interest_cents, type: integer, source: computed, description: "Accrued interest from accrual_start_date to the clock date of the latest computation, per accrual_interest" }
      - { name: daily_interest_cents, type: integer, source: computed, description: "Rounded daily interest at the product rate, per accrual_interest" }
      - { name: monthly_fee_assessed_cents, type: integer, source: computed, description: "Fee for the latest statement cycle per monthly_fee_assessment", default: 0 }
      - { name: statement_cycle_day, type: integer, source: input, description: "Day of month the statement cycle closes", constraints: "1..28" }
      - { name: accrual_start_date, type: string, source: input, description: "First date interest accrues from, YYYY-MM-DD" }
      - { name: gl_account_id, type: string, source: system, description: "FK -> GLAccount.id; set by the mapping action, null until then; reverse lookup: GET /api/v1/accounts?gl_account_id=<gl-id>", default: null }

  - name: GLAccount
    parent: null
    common_fields: true
    fields:
      - { name: project_id, type: string, source: system, description: "FK -> ConversionProject.id; reverse lookup: GET /api/v1/gl-accounts?project_id= returns this entity list; owning conversion project" }
      - { name: gl_code, type: string, source: input, description: "Target-core GL code", constraints: "unique per project" }
      - { name: description, type: string, source: input, description: "Human-readable GL description" }
      - { name: expected_balance_cents, type: integer, source: computed, description: "Sum of opening_principal_cents over accounts with gl_account_id == this GL and status in {MAPPED, EXCEPTION, CLEARED, CONVERTED}" }
      - { name: converted_balance_cents, type: integer, source: computed, description: "Sum of conversion_balance_cents over the same account set" }
      - { name: variance_cents, type: integer, source: computed, description: "converted_balance_cents - expected_balance_cents" }

  - name: MockRun
    parent: null
    common_fields: true
    fields:
      - { name: project_id, type: string, source: system, description: "FK -> ConversionProject.id; reverse lookup: GET /api/v1/mock-runs?project_id= returns this entity list; owning conversion project" }
      - { name: run_label, type: string, source: input, description: "Label for the mock run, e.g. MOCK-1", constraints: "unique per project" }
      - { name: state, type: enum, source: system, description: "RUNNING | FAILED | PASSED_WITH_EXCEPTIONS | PASSED" }
      - { name: started_at, type: datetime, source: system, description: "Clock timestamp when the run was started" }
      - { name: finished_at, type: datetime, source: system, description: "Clock timestamp when the run was finalized, null until then", default: null }
      - { name: duration_seconds, type: integer, source: computed, description: "Whole seconds between started_at and finished_at at finalization" }
      - { name: balanced_account_count, type: integer, source: computed, description: "Count of MAPPED, CLEARED, or BLOCKED accounts at finalize time" }
      - { name: exception_account_count, type: integer, source: computed, description: "Count of EXCEPTION accounts at finalize time" }
      - { name: converted_total_cents, type: integer, source: computed, description: "Sum of conversion_balance_cents over all accounts at finalize time" }
      - { name: outcome, type: enum, source: system, description: "Mirrors state for reporting: FAILED | PASSED_WITH_EXCEPTIONS | PASSED", default: null }
      - { name: is_cutover_baseline, type: boolean, source: system, description: "True on the PASSED MockRun the cutover was planned against", default: false }

  - name: AncillarySystem
    parent: null
    common_fields: true
    fields:
      - { name: project_id, type: string, source: system, description: "FK -> ConversionProject.id; reverse lookup: GET /api/v1/ancillary-systems?project_id= returns this entity list; owning conversion project" }
      - { name: name, type: string, source: input, description: "System name", constraints: "unique per project" }
      - { name: category, type: enum, source: input, description: "CARDS | ONLINE_BANKING | ITEM_PROCESSING | REPORTING" }
      - { name: status, type: enum, source: system, description: "PENDING | INTEGRATING | VERIFIED | FAILED | RETEST_PASSED" }
      - { name: interface_version, type: string, source: input, description: "Target interface version string" }

  - name: TrainingSession
    parent: null
    common_fields: true
    fields:
      - { name: project_id, type: string, source: system, description: "FK -> ConversionProject.id; reverse lookup: GET /api/v1/training-sessions?project_id= returns this entity list; owning conversion project" }
      - { name: branch_name, type: string, source: input, description: "Branch this session covers" }
      - { name: scheduled_start, type: datetime, source: input, description: "Session start, ISO8601" }
      - { name: scheduled_end, type: datetime, source: input, description: "Session end, ISO8601; must be strictly after scheduled_start" }
      - { name: capacity, type: integer, source: input, description: "Seat capacity of the session", constraints: ">= 1" }
      - { name: reserved_count, type: integer, source: computed, description: "Count of enrollments in RESERVED state", default: 0 }
      - { name: attended_count, type: integer, source: computed, description: "Count of enrollments in ATTENDED state", default: 0 }
      - { name: status, type: enum, source: system, description: "SCHEDULED | IN_PROGRESS | COMPLETED | CANCELLED" }

  - name: Enrollment
    parent: null
    common_fields: false
    fields:
      - { name: parent_session_id, type: string, source: system, description: "Owning training session id; reverse lookup: GET /api/v1/enrollments?session_id=<session-id> returns this entity list" }
      - { name: employee_id, type: string, source: input, description: "FK -> StaffMember.id; enrolled staff member; reverse lookup: GET /api/v1/enrollments?employee_id=<staff-id>" }
      - { name: state, type: enum, source: system, description: "RESERVED | ATTENDED | NO_SHOW | CANCELLED" }

  - name: StaffMember
    parent: null
    common_fields: true
    fields:
      - { name: project_id, type: string, source: system, description: "FK -> ConversionProject.id; reverse lookup: GET /api/v1/staff?project_id= returns this entity list; owning conversion project" }
      - { name: employee_code, type: string, source: input, description: "HR employee code, unique per project", constraints: "unique per project" }
      - { name: full_name, type: string, source: input, description: "Staff member full name" }
      - { name: branch_name, type: string, source: input, description: "Home branch" }
      - { name: role_scope, type: enum, source: input, description: "TELLER | LENDER | OPS | BRANCH_MANAGER" }
      - { name: parallel_ops_certified, type: boolean, source: system, description: "True once the member carries at least one ATTENDED enrollment", default: false }

  - name: CustomerComm
    parent: null
    common_fields: true
    fields:
      - { name: project_id, type: string, source: system, description: "FK -> ConversionProject.id; reverse lookup: GET /api/v1/customer-comms?project_id= returns this entity list; owning conversion project" }
      - { name: account_id, type: string, source: input, description: "FK -> Account.id; account the communication covers; reverse lookup: GET /api/v1/customer-comms?account_id=<account-id>" }
      - { name: comm_type, type: enum, source: input, description: "ACCOUNT_NUMBER_CHANGE | CARD_REISSUE | PAYMENT_REDIRECTION" }
      - { name: wave, type: integer, source: input, description: "Communication wave number (1-based)", constraints: ">= 1" }
      - { name: send_after, type: datetime, source: system, description: "Earliest send time; project creation clock time + (wave-1) days per comm_wave_schedule" }
      - { name: send_before, type: datetime, source: system, description: "Latest allowed send time; send_after + 3 days per comm_wave_schedule" }
      - { name: scheduled_send_date, type: datetime, source: computed, description: "Effective send datetime after backoff adjustments; initialized to send_after" }
      - { name: resend_count, type: integer, source: system, description: "Number of FAILED -> SENT resend cycles recorded for this comm", default: 0 }
      - { name: status, type: enum, source: system, description: "DRAFT | SCHEDULED | SENT | DELIVERED | FAILED | CANCELLED" }

  - name: Defect
    parent: null
    common_fields: true
    fields:
      - { name: project_id, type: string, source: system, description: "FK -> ConversionProject.id; reverse lookup: GET /api/v1/defects?project_id= returns this entity list; owning conversion project" }
      - { name: title, type: string, source: input, description: "Defect title" }
      - { name: severity, type: enum, source: input, description: "SEV1 | SEV2 | SEV3" }
      - { name: linked_system_id, type: string, source: input, description: "FK -> AncillarySystem.id; ancillary system the defect is attributed to, null if not system-linked; reverse lookup: GET /api/v1/defects?linked_system_id=<system-id>", default: null }
      - { name: reported_by, type: string, source: system, description: "X-User-ID of the reporter (segregation of duties: reporter cannot triage)" }
      - { name: status, type: enum, source: system, description: "OPEN | TRIAGED | IN_FIX | RESOLVED | REOPENED | CLOSED" }
      - { name: triage_priority, type: integer, source: system, description: "1 (highest) .. 5 (lowest); assigned at triage per defect_triage_priority", default: null }
      - { name: opened_at, type: datetime, source: system, description: "Clock timestamp when the defect was reported" }
      - { name: sla_deadline, type: datetime, source: system, description: "opened_at + sla_hours by severity: SEV1 24h, SEV2 72h, SEV3 168h" }
      - { name: resolved_at, type: datetime, source: system, description: "Clock timestamp of the most recent OPEN->RESOLVED transition; cleared when reopened", default: null }
      - { name: credit_eligible, type: boolean, source: computed, description: "True while status is RESOLVED and the latest resolution missed sla_deadline" }
      - { name: reopened_count, type: integer, source: system, description: "Number of times the defect was reopened", default: 0 }

  - name: ServiceCredit
    parent: null
    common_fields: true
    fields:
      - { name: project_id, type: string, source: system, description: "FK -> ConversionProject.id; reverse lookup: GET /api/v1/service-credits?project_id= returns this entity list; owning conversion project" }
      - { name: month, type: string, source: input, description: "Accrual month YYYY-MM; the deadline-month of the defects covered", constraints: "one OPEN claim per project per month" }
      - { name: defect_ids, type: array, source: input, description: "Defect ids included in this claim; each must be credit_eligible with sla_deadline month == month, and not already in an OPEN claim", constraints: "non-empty" }
      - { name: claim_status, type: enum, source: system, description: "OPEN | APPROVED | DISPUTED | PAID | REJECTED" }
      - { name: approved_by, type: string, source: system, description: "X-User-ID of the approver (segregation of duties: approver cannot pay)", default: null }
      - { name: breach_hours, type: array, source: computed, description: "Per-defect breach hours, ordered by defect_ids order: ceil((resolved_at - sla_deadline)/3600)" }
      - { name: credit_cents, type: integer, source: computed, description: "Computed credit per service_credit_computation" }
      - { name: dispute_note, type: string, source: system, description: "Vendor note recorded on dispute", default: null }

  - name: CutoverPlan
    parent: null
    common_fields: false
    fields:
      - { name: project_id, type: string, source: system, description: "FK -> ConversionProject.id; reverse lookup: GET /api/v1/plans?project_id= returns this entity list; owning conversion project (exactly one plan per project)" }
      - { name: planned_cutover_date, type: string, source: input, description: "Cutover date YYYY-MM-DD; must equal the project's cutover_scheduled_date at planning time" }
      - { name: file_freeze_start, type: datetime, source: input, description: "Start of the file freeze window; must be strictly before the first conversion_window_start of any task, and must not fall inside [conversion_window_start, conversion_window_end + 30 minutes] of any non-cancelled CutoverPlan of ANY project (aggregate freeze-channel exclusion across projects)" }
      - { name: reopen_target, type: datetime, source: input, description: "Target reopen time; must be at or after the latest window end" }
      - { name: go_no_go_checkpoint, type: datetime, source: input, description: "Go/no-go decision checkpoint; must sit strictly between file_freeze_start and reopen_target" }
      - { name: status, type: enum, source: system, description: "DRAFT | SCHEDULED | GO | LIVE | ROLLED_BACK" }

  - name: CutoverTask
    parent: null
    common_fields: false
    fields:
      - { name: parent_plan_id, type: string, source: system, description: "Owning cutover plan id; reverse lookup: GET /api/v1/tasks?plan_id=<plan-id> returns this entity list" }
      - { name: task_name, type: string, source: input, description: "Task name" }
      - { name: sequence, type: integer, source: input, description: "Sequence number, dense and unique within the plan (1..N)" }
      - { name: conversion_window_start, type: datetime, source: input, description: "Window start; must be strictly after the plan's file_freeze_start" }
      - { name: conversion_window_end, type: datetime, source: input, description: "Window end; must be strictly after conversion_window_start" }
      - { name: depends_on_task_id, type: string, source: input, description: "FK -> CutoverTask.id; predecessor task in the same plan, null for the first task; reverse lookup: GET /api/v1/tasks?depends_on_task_id=<task-id>", default: null, constraints: "must reference a task with a smaller sequence; self-reference forbidden" }
      - { name: owner_role, type: enum, source: input, description: "Role responsible for starting this task: CONVERSION_ENGINEER | OPERATIONS_LEAD" }
      - { name: status, type: enum, source: system, description: "PENDING | RUNNING | COMPLETE | SKIPPED | FAILED" }
      - { name: duration_minutes, type: integer, source: computed, description: "Whole minutes the task ran once COMPLETE; null until then", default: null }

# =============================================================================
# §1.2 State Machine Table
# =============================================================================
state_machines:
  - entity: ConversionProject
    initial_state: DISCOVERY
    terminal_states: [CLOSED]
    transitions:
      - from: DISCOVERY
        to: CONFIGURATION
        trigger: "POST /api/v1/conversions/{id}/advance"
        actor: ProjectManager
        preconditions:
          - "At least one ProductType exists for the project (any status)"
          - "At least one GLAccount exists for the project"
        side_effects:
          - "increments ConversionProject.version by 1"
      - from: CONFIGURATION
        to: MOCK_CONVERSION
        trigger: "POST /api/v1/conversions/{id}/advance"
        actor: ProjectManager
        preconditions:
          - "At least one ProductType with status ACTIVE exists"
          - "At least one Account with status MAPPED exists"
        side_effects:
          - "increments ConversionProject.version by 1"
      - from: MOCK_CONVERSION
        to: CUTOVER_PLANNED
        trigger: "POST /api/v1/conversions/{id}/plan-cutover"
        actor: ProjectManager
        preconditions:
          - "Exactly one MockRun with state PASSED exists and is_cutover_baseline is false for all runs"
          - "No Account with status EXCEPTION exists"
          - "cutover_scheduled_date provided and strictly after the current clock date"
          - "file_freeze_start must not fall inside [conversion_window_start, conversion_window_end + 30 minutes] of any task of any CutoverPlan of any OTHER project whose status is not ROLLED_BACK (violation -> ERR_FREEZE_CHANNEL_BUSY)"
        side_effects:
          - "creates the CutoverPlan in DRAFT with planned_cutover_date = cutover_scheduled_date"
          - "the PASSED MockRun gets is_cutover_baseline = true"
          - "every Account.frozen_flag := true (file freeze begins at planning)"
          - "increments ConversionProject.version by 1"
      - from: CUTOVER_PLANNED
        to: LIVE
        trigger: "POST /api/v1/conversions/{id}/go-live"
        actor: ProjectManager
        preconditions:
          - "CutoverPlan.status == GO"
          - "Every CutoverTask of the plan has status in {COMPLETE, SKIPPED}"
          - "Every AncillarySystem of the project has status in {VERIFIED, RETEST_PASSED}"
          - "No Defect with severity SEV1 has status in {OPEN, TRIAGED, IN_FIX, REOPENED}"
        side_effects:
          - "cutoff_business_date := current clock date (YYYY-MM-DD)"
          - "every Account with status CLEARED transitions to CONVERTED and conversion_balance_cents is recomputed by accrual_interest at cutoff_business_date"
          - "every Account with status MAPPED transitions to EXCEPTION with exception_note 'uncleared at go-live'"
          - "every CustomerComm with status SCHEDULED whose scheduled_send_date <= clock now transitions to SENT"
          - "increments ConversionProject.version by 1"
      - from: LIVE
        to: CLOSED
        trigger: "POST /api/v1/conversions/{id}/close"
        actor: ProjectManager
        preconditions:
          - "No Defect has status in {OPEN, TRIAGED, IN_FIX, REOPENED}"
          - "No ServiceCredit has claim_status OPEN"
        side_effects:
          - "increments ConversionProject.version by 1"

  - entity: ProductType
    initial_state: DRAFT
    terminal_states: [RETIRED]
    transitions:
      - from: DRAFT
        to: ACTIVE
        trigger: "POST /api/v1/product-types/{ptid}/activate"
        actor: ConversionEngineer
        preconditions:
          - "Project status in {DISCOVERY, CONFIGURATION}"
          - "accrual_method legal for kind (DEPOSIT: ACT_365 or ACT_360; LOAN: ACT_360 or THIRTY_360)"
          - "rate >= 0 for DEPOSIT, > 0 for LOAN"
          - "statement_frequency is MONTHLY or QUARTERLY"
        side_effects: []
      - from: ACTIVE
        to: DRAFT
        trigger: "POST /api/v1/product-types/{ptid}/deactivate"
        actor: ConversionEngineer
        preconditions:
          - "Project status in {DISCOVERY, CONFIGURATION}"
        side_effects:
          - "every Account with product_type_id == this and status MAPPED transitions to EXCEPTION with exception_note 'product deactivated'"
      - from: ACTIVE
        to: RETIRED
        trigger: "POST /api/v1/product-types/{ptid}/retire"
        actor: ConversionEngineer
        preconditions:
          - "No Account references this product with status in {STAGED, MAPPED, EXCEPTION, CLEARED}"
        side_effects: []
      - from: DRAFT
        to: RETIRED
        trigger: "POST /api/v1/product-types/{ptid}/retire"
        actor: ConversionEngineer
        preconditions:
          - "No Account references this product with status in {STAGED, MAPPED, EXCEPTION, CLEARED}"
        side_effects: []

  - entity: Account
    initial_state: STAGED
    terminal_states: [CONVERTED, BLOCKED]
    transitions:
      - from: STAGED
        to: MAPPED
        trigger: "POST /api/v1/accounts/{aid}/map"
        actor: ConversionEngineer
        preconditions:
          - "Project status in {DISCOVERY, CONFIGURATION, MOCK_CONVERSION} (CUTOVER_PLANNED/LIVE are rejected as ERR_FROZEN, CLOSED as ERR_INVALID_STATE)"
          - "gl_account_id provided in the call and references a GLAccount of the same project"
          - "product_type_id references an ACTIVE ProductType whose kind == account_type"
        side_effects:
          - "gl_account_id := provided value"
          - "recompute expected/converted/variance on the referenced GLAccount"
      - from: MAPPED
        to: EXCEPTION
        trigger: "system (product deactivate cascade, uncleared-at-go-live cascade, a finalize that flips account exception flag) or POST /api/v1/accounts/{aid}/flag-exception"
        actor: "system or ConversionEngineer"
        preconditions:
          - "flag-exception call requires project status == MOCK_CONVERSION"
        side_effects:
          - "exception_note := provided note or cascade note"
      - from: EXCEPTION
        to: CLEARED
        trigger: "POST /api/v1/accounts/{aid}/clear-exception"
        actor: ConversionEngineer
        preconditions:
          - "Project status == MOCK_CONVERSION"
          - "Account.frozen_flag == false"
          - "resolution_note provided"
        side_effects:
          - "recompute expected/converted/variance on the account's GLAccount"
      - from: CLEARED
        to: EXCEPTION
        trigger: "POST /api/v1/accounts/{aid}/flag-exception"
        actor: ConversionEngineer
        preconditions:
          - "Project status == MOCK_CONVERSION"
          - "Account.frozen_flag == false"
        side_effects:
          - "exception_note := provided note"
      - from: CLEARED
        to: CONVERTED
        trigger: "system (go-live cascade)"
        actor: system
        preconditions: []
        side_effects:
          - "conversion_balance_cents recomputed per accrual_interest at cutoff_business_date"
      - from: MAPPED
        to: CONVERTED
        trigger: "system — never; MAPPED accounts go to EXCEPTION at go-live"
        actor: system
        preconditions: []
        side_effects: []
        note: "kept for readability; only CLEARED converts"
      - from: MAPPED
        to: BLOCKED
        trigger: "system (cutover rollback)"
        actor: system
        preconditions: []
        side_effects: []
      - from: CLEARED
        to: BLOCKED
        trigger: "system (cutover rollback)"
        actor: system
        preconditions: []
        side_effects: []
      - from: EXCEPTION
        to: BLOCKED
        trigger: "system (cutover rollback)"
        actor: system
        preconditions: []
        side_effects: []

  - entity: MockRun
    initial_state: RUNNING
    terminal_states: [FAILED, PASSED_WITH_EXCEPTIONS, PASSED]
    transitions:
      - from: RUNNING
        to: FAILED
        trigger: "POST /api/v1/mock-runs/{rid}/finalize"
        actor: ConversionEngineer
        preconditions:
          - "Project status == MOCK_CONVERSION"
          - "No other MockRun of the project is RUNNING"
        side_effects:
          - "finished_at := clock now; duration_seconds computed"
          - "balanced_account_count, exception_account_count, converted_total_cents snapshot per mock_run_balancing"
          - "project.mock_runs_used += 1"
          - "outcome := FAILED when balanced_account_count == 0"
      - from: RUNNING
        to: PASSED_WITH_EXCEPTIONS
        trigger: "POST /api/v1/mock-runs/{rid}/finalize"
        actor: ConversionEngineer
        preconditions:
          - "Project status == MOCK_CONVERSION"
        side_effects:
          - "same snapshots as FAILED; outcome := PASSED_WITH_EXCEPTIONS when balanced_account_count > 0 and exception_account_count > 0"
      - from: RUNNING
        to: PASSED
        trigger: "POST /api/v1/mock-runs/{rid}/finalize"
        actor: ConversionEngineer
        preconditions:
          - "Project status == MOCK_CONVERSION"
        side_effects:
          - "same snapshots; outcome := PASSED when balanced_account_count > 0 and exception_account_count == 0"
          - "CASCADE link 2: every Account with status CLEARED at finalize time returns to MAPPED (the passed run certifies the mapping, and cleared exceptions must be re-certified by the next run)"
          - "CASCADE link 3: each such account's transition re-triggers gl_variance recomputation on its GLAccount"

  - entity: AncillarySystem
    initial_state: PENDING
    terminal_states: [VERIFIED, RETEST_PASSED]
    transitions:
      - from: PENDING
        to: INTEGRATING
        trigger: "POST /api/v1/ancillary-systems/{sid}/start-integration"
        actor: OperationsLead
        preconditions:
          - "Project status in {MOCK_CONVERSION, CUTOVER_PLANNED}"
        side_effects: []
      - from: INTEGRATING
        to: VERIFIED
        trigger: "POST /api/v1/ancillary-systems/{sid}/verify"
        actor: OperationsLead
        preconditions:
          - "Project status in {MOCK_CONVERSION, CUTOVER_PLANNED}"
        side_effects: []
      - from: INTEGRATING
        to: FAILED
        trigger: "POST /api/v1/ancillary-systems/{sid}/fail"
        actor: OperationsLead
        preconditions: []
        side_effects: []
      - from: FAILED
        to: RETEST_PASSED
        trigger: "POST /api/v1/ancillary-systems/{sid}/retest"
        actor: OperationsLead
        preconditions: []
        side_effects: []
      - from: FAILED
        to: INTEGRATING
        trigger: "POST /api/v1/ancillary-systems/{sid}/start-integration"
        actor: OperationsLead
        preconditions:
          - "Project status in {MOCK_CONVERSION, CUTOVER_PLANNED}"
        side_effects: []

  - entity: TrainingSession
    initial_state: SCHEDULED
    terminal_states: [COMPLETED, CANCELLED]
    transitions:
      - from: SCHEDULED
        to: IN_PROGRESS
        trigger: "POST /api/v1/training-sessions/{tsid}/start"
        actor: Trainer
        preconditions:
          - "clock now >= scheduled_start and clock now < scheduled_end"
        side_effects: []
      - from: IN_PROGRESS
        to: COMPLETED
        trigger: "POST /api/v1/training-sessions/{tsid}/complete"
        actor: Trainer
        preconditions:
          - "clock now >= scheduled_end"
          - "no enrollment left in RESERVED state"
        side_effects:
          - "reserved_count / attended_count recomputed from enrollments"
          - "CASCADE link 1: every StaffMember with at least one ATTENDED enrollment in this session has parallel_ops_certified := true (certification is granted at session completion, not at attend time)"
      - from: SCHEDULED
        to: CANCELLED
        trigger: "POST /api/v1/training-sessions/{tsid}/cancel"
        actor: Trainer
        preconditions: []
        side_effects:
          - "every RESERVED enrollment -> CANCELLED; reserved_count recomputed"

  - entity: Enrollment
    initial_state: RESERVED
    terminal_states: [ATTENDED, NO_SHOW, CANCELLED]
    transitions:
      - from: RESERVED
        to: ATTENDED
        trigger: "POST /api/v1/enrollments/{eid}/attend"
        actor: Trainer
        preconditions:
          - "session status == IN_PROGRESS"
        side_effects:
          - "session.reserved_count -= 1; session.attended_count += 1"
          - "CASCADE link 2: TrainingSession.status is re-derived — if this was the last non-CANCELLED enrollment to leave RESERVED and clock now >= scheduled_end, the session auto-completes (IN_PROGRESS -> COMPLETED), which fires the completion cascade (link 3: parallel_ops_certified on ATTENDED staff)"
      - from: RESERVED
        to: NO_SHOW
        trigger: "POST /api/v1/enrollments/{eid}/no-show"
        actor: Trainer
        preconditions:
          - "session status == IN_PROGRESS"
        side_effects:
          - "session.reserved_count -= 1"
      - from: RESERVED
        to: CANCELLED
        trigger: "POST /api/v1/enrollments/{eid}/cancel or system (session cancel)"
        actor: "Trainer or system"
        preconditions: []
        side_effects:
          - "session.reserved_count -= 1"

  - entity: CustomerComm
    initial_state: DRAFT
    terminal_states: [DELIVERED, CANCELLED]
    transitions:
      - from: DRAFT
        to: SCHEDULED
        trigger: "POST /api/v1/customer-comms/{cid}/schedule"
        actor: CommunicationsOfficer
        preconditions:
          - "Account.status in {MAPPED, EXCEPTION, CLEARED}"
          - "Account.frozen_flag == false"
        side_effects:
          - "scheduled_send_date := send_after (backoff baseline)"
      - from: SCHEDULED
        to: SENT
        trigger: "POST /api/v1/customer-comms/{cid}/send or system (go-live flush)"
        actor: "CommunicationsOfficer or system"
        preconditions:
          - "send endpoint: scheduled_send_date <= clock now <= send_before (a comm whose window has expired cannot be sent; the go-live flush uses its own rule and is exempt from the upper bound)"
        side_effects: []
      - from: SENT
        to: DELIVERED
        trigger: "POST /api/v1/customer-comms/{cid}/deliver"
        actor: CommunicationsOfficer
        preconditions: []
        side_effects: []
      - from: SENT
        to: FAILED
        trigger: "POST /api/v1/customer-comms/{cid}/fail"
        actor: CommunicationsOfficer
        preconditions: []
        side_effects: []
      - from: FAILED
        to: SENT
        trigger: "POST /api/v1/customer-comms/{cid}/resend"
        actor: CommunicationsOfficer
        preconditions: []
        side_effects:
          - "resend_count += 1"
          - "scheduled_send_date recomputed per comm_wave_schedule backoff"
      - from: DRAFT
        to: CANCELLED
        trigger: "POST /api/v1/customer-comms/{cid}/cancel"
        actor: CommunicationsOfficer
        preconditions: []
        side_effects: []
      - from: SCHEDULED
        to: CANCELLED
        trigger: "POST /api/v1/customer-comms/{cid}/cancel"
        actor: CommunicationsOfficer
        preconditions: []
        side_effects: []

  - entity: Defect
    initial_state: OPEN
    terminal_states: [CLOSED]
    transitions:
      - from: OPEN
        to: TRIAGED
        trigger: "POST /api/v1/defects/{did}/triage"
        actor: VendorTriageLead
        preconditions:
          - "None beyond state and segregation of duties (triage is allowed from the moment a defect exists, including pre-live dry runs)"
        side_effects:
          - "triage_priority assigned per defect_triage_priority"
      - from: TRIAGED
        to: IN_FIX
        trigger: "POST /api/v1/defects/{did}/start-fix"
        actor: VendorTriageLead
        preconditions: []
        side_effects: []
      - from: IN_FIX
        to: OPEN
        trigger: "POST /api/v1/defects/{did}/reject-fix"
        actor: VendorTriageLead
        preconditions: []
        side_effects:
          - "triage_priority retained"
      - from: OPEN
        to: RESOLVED
        trigger: "POST /api/v1/defects/{did}/resolve"
        actor: VendorTriageLead
        preconditions: []
        side_effects:
          - "resolved_at := clock now; credit_eligible := (resolved_at > sla_deadline)"
          - "if linked_system_id is set: linked AncillarySystem VERIFIED -> INTEGRATING; RETEST_PASSED -> FAILED"
      - from: TRIAGED
        to: RESOLVED
        trigger: "POST /api/v1/defects/{did}/resolve"
        actor: VendorTriageLead
        preconditions: []
        side_effects:
          - "same as OPEN -> RESOLVED"
      - from: IN_FIX
        to: RESOLVED
        trigger: "POST /api/v1/defects/{did}/resolve"
        actor: VendorTriageLead
        preconditions: []
        side_effects:
          - "same as OPEN -> RESOLVED"
      - from: RESOLVED
        to: REOPENED
        trigger: "POST /api/v1/defects/{did}/reopen"
        actor: ProjectManager
        preconditions: []
        side_effects:
          - "reopened_count += 1; resolved_at := null; credit_eligible := false"
          - "every OPEN ServiceCredit claim of this project that references this defect in defect_ids transitions to DISPUTED with dispute_note 'auto: defect reopened'"
      - from: REOPENED
        to: RESOLVED
        trigger: "POST /api/v1/defects/{did}/resolve"
        actor: VendorTriageLead
        preconditions: []
        side_effects:
          - "same as OPEN -> RESOLVED; credit_eligible recomputed against sla_deadline (deadline is not extended)"
      - from: RESOLVED
        to: CLOSED
        trigger: "POST /api/v1/defects/{did}/close"
        actor: ProjectManager
        preconditions:
          - "the defect is not referenced by any OPEN ServiceCredit claim"
        side_effects: []

  - entity: ServiceCredit
    initial_state: OPEN
    terminal_states: [PAID, REJECTED]
    transitions:
      - from: OPEN
        to: APPROVED
        trigger: "POST /api/v1/service-credits/{scid}/approve"
        actor: FinanceController
        preconditions:
          - "every defect in defect_ids still has status RESOLVED and credit_eligible true"
        side_effects: []
      - from: OPEN
        to: DISPUTED
        trigger: "POST /api/v1/service-credits/{scid}/dispute or system (defect reopen cascade)"
        actor: "VendorTriageLead or system"
        preconditions: []
        side_effects:
          - "dispute_note recorded"
      - from: APPROVED
        to: PAID
        trigger: "POST /api/v1/service-credits/{scid}/pay"
        actor: FinanceController
        preconditions:
          - "every defect in defect_ids still has status RESOLVED"
        side_effects: []
      - from: APPROVED
        to: DISPUTED
        trigger: "POST /api/v1/service-credits/{scid}/dispute"
        actor: VendorTriageLead
        preconditions: []
        side_effects:
          - "dispute_note recorded"
      - from: DISPUTED
        to: OPEN
        trigger: "POST /api/v1/service-credits/{scid}/reopen"
        actor: FinanceController
        preconditions:
          - "every defect in defect_ids has status RESOLVED and credit_eligible true"
        side_effects:
          - "credit_cents recomputed per service_credit_computation"
      - from: OPEN
        to: REJECTED
        trigger: "POST /api/v1/service-credits/{scid}/reject"
        actor: FinanceController
        preconditions:
          - "at least one defect in defect_ids is no longer credit_eligible"
        side_effects: []

  - entity: CutoverPlan
    initial_state: DRAFT
    terminal_states: [LIVE, ROLLED_BACK]
    transitions:
      - from: DRAFT
        to: SCHEDULED
        trigger: "POST /api/v1/plans/{pid}/schedule"
        actor: ProjectManager
        preconditions:
          - "plan has at least one CutoverTask"
          - "file_freeze_start strictly before the earliest task conversion_window_start"
          - "go_no_go_checkpoint strictly between file_freeze_start and reopen_target"
          - "reopen_target >= the latest task conversion_window_end"
          - "file_freeze_start must not overlap the freeze channel of another project: it must not fall inside [conversion_window_start, conversion_window_end + 30 minutes] of any task of any CutoverPlan of any OTHER project whose status is not ROLLED_BACK (violation -> ERR_FREEZE_CHANNEL_BUSY)"
        side_effects: []
      - from: SCHEDULED
        to: GO
        trigger: "POST /api/v1/plans/{pid}/go"
        actor: ProjectManager
        preconditions:
          - "clock now >= go_no_go_checkpoint"
          - "no task has status FAILED"
          - "every task with status RUNNING belongs to owner_role CONVERSION_ENGINEER or OPERATIONS_LEAD (always true; informational)"
        side_effects: []
      - from: SCHEDULED
        to: ROLLED_BACK
        trigger: "POST /api/v1/plans/{pid}/rollback"
        actor: ProjectManager
        preconditions: []
        side_effects:
          - "every task PENDING or RUNNING -> SKIPPED; COMPLETE tasks keep their status"
          - "every Account in {MAPPED, CLEARED, EXCEPTION} -> BLOCKED; frozen_flag stays true"
          - "ConversionProject -> MOCK_CONVERSION; cutover_scheduled_date := null"
          - "the baseline MockRun.is_cutover_baseline := false"
      - from: GO
        to: ROLLED_BACK
        trigger: "POST /api/v1/plans/{pid}/rollback"
        actor: ProjectManager
        preconditions: []
        side_effects:
          - "same as SCHEDULED -> ROLLED_BACK"
      - from: GO
        to: LIVE
        trigger: "system (project go-live)"
        actor: system
        preconditions: []
        side_effects: []

  - entity: CutoverTask
    initial_state: PENDING
    terminal_states: [COMPLETE, SKIPPED, FAILED]
    transitions:
      - from: PENDING
        to: RUNNING
        trigger: "POST /api/v1/tasks/{tid}/start"
        actor: "owner_role of the task"
        preconditions:
          - "plan status == GO"
          - "clock now >= conversion_window_start and clock now < conversion_window_end"
          - "depends_on_task_id is null or the referenced task has status COMPLETE"
        side_effects: []
      - from: RUNNING
        to: COMPLETE
        trigger: "POST /api/v1/tasks/{tid}/complete"
        actor: "owner_role of the task"
        preconditions:
          - "clock now <= conversion_window_end + 30 minutes grace"
        side_effects:
          - "duration_minutes := whole minutes between start and completion clock times"
      - from: RUNNING
        to: FAILED
        trigger: "POST /api/v1/tasks/{tid}/fail"
        actor: "owner_role of the task"
        preconditions: []
        side_effects: []

# =============================================================================
# §1.2.1 Concurrency Rules (true races only; OCC on parent version)
# =============================================================================
concurrency_rules:
  - rule_id: account-map-stale-project
    parent_entity: ConversionProject
    write_endpoint: "POST /api/v1/accounts/{aid}/map"
    occ_field: "expected_project_version"
    description: |
      Mapping an account against a ConversionProject whose version has advanced
      since the client last observed it is rejected. This captures the case
      where another writer has just advanced the project phase or mapped a
      sibling account and the current writer's view of the project (its phase
      gates and GL inventory) is therefore stale.
    error_id: ERR_STALE_VERSION
    http_status: 412
  - rule_id: comm-schedule-stale-project
    parent_entity: ConversionProject
    write_endpoint: "POST /api/v1/customer-comms/{cid}/schedule"
    occ_field: "expected_project_version"
    description: |
      Scheduling a CustomerComm against a ConversionProject whose version has
      advanced since the client last observed it is rejected. This captures the
      case where the project has been re-phased (e.g. moved to CUTOVER_PLANNED,
      which freezes accounts) between the client's read and this scheduling
      call, making the client's wave/backoff assumptions stale.
    error_id: ERR_STALE_VERSION
    http_status: 412

# =============================================================================
# §1.3 Calculation Rules Table
# =============================================================================
calculations:
  - name: accrual_interest
    trigger: "MockRun finalize (computed per account at the run's clock date), go-live (recomputed per account at cutoff_business_date)"
    algorithm: aggregation
    formula: |
      Given account A with opening_principal_cents P, product rate r,
      accrual_method m, accrual_start_date d0, and computation date D
      (the run's finalize date, or cutoff_business_date):
        daily_interest_cents := round_half_up(P * r / divisor(m))
        if d0 > D: days := 0 (no negative accrual)
        else: days := number of calendar days in [d0, D] inclusive
        cutoff_accrued_interest_cents := daily_interest_cents * days
        divisor(ACT_365) = 365; divisor(ACT_360) = 360; divisor(THIRTY_360) = 360
        For THIRTY_360, `days` counts each month as exactly 30 days:
          days = 360*(Y2-Y1) + 30*(M2-M1) + min(day(D2),30) - min(day(D1),30) + 1
      conversion_balance_cents := P + cutoff_accrued_interest_cents for
      DEPOSIT accounts; conversion_balance_cents := P - 0 (principal only,
      interest tracked separately) for LOAN accounts — i.e. LOAN
      conversion_balance_cents == P always.
    input_set: "Accounts with status in {MAPPED, EXCEPTION, CLEARED, CONVERTED}; STAGED and BLOCKED excluded"
    constants:
      ACT_365_DIVISOR: 365
      ACT_360_DIVISOR: 360
      THIRTY_360_DIVISOR: 360
      THIRTY_360_DAYS_PER_MONTH: 30
    precision: "integer cents, round_half_up on the daily amount before multiplying by days"
    variants:
      - name: mock_run_variant
        when: "computed during a MockRun finalize at the finalize clock date"
        difference: "conversion_balance_cents and cutoff_accrued_interest_cents are recomputed per account but are advisory; exception flagging on accounts is NOT performed"
      - name: cutover_variant
        when: "computed at go-live with D := cutoff_business_date"
        difference: "same formula, but the result is authoritative: written as the account's final conversion_balance_cents and accrued interest for day-1 opening; only CLEARED accounts are converted"

  - name: monthly_fee_assessment
    trigger: "MockRun finalize, per account"
    algorithm: tiered_pricing
    formula: |
      average_daily_balance_cents := conversion_balance_cents (computed balance
      stands in for the cycle average in this benchmark).
      DEPOSIT accounts:
        if product.fee_waiver_threshold_cents is null:
          monthly_fee_assessed_cents := product.monthly_fee_cents
        else if average_daily_balance_cents >= product.fee_waiver_threshold_cents:
          monthly_fee_assessed_cents := 0
        else:
          monthly_fee_assessed_cents := product.monthly_fee_cents
        Boundary: equality waives the fee (>=, not >).
      LOAN accounts: monthly_fee_assessed_cents := 0 always.
    input_set: "Accounts with status in {MAPPED, EXCEPTION, CLEARED}; STAGED, CONVERTED, BLOCKED excluded"
    constants: {}
    precision: "integer cents"

  - name: gl_variance
    trigger: "any account mapping change, mock run finalize, go-live recompute"
    algorithm: aggregation
    formula: |
      expected_balance_cents := sum of opening_principal_cents over accounts
        with gl_account_id == GL and status in {MAPPED, EXCEPTION, CLEARED, CONVERTED}
      converted_balance_cents := sum of conversion_balance_cents over the same set
      variance_cents := converted_balance_cents - expected_balance_cents
      A GL is balanced iff variance_cents == 0. Mock run balancing uses these
      per-GL sums; the run-level converted_total_cents is the sum over all GLs
      plus accounts not yet mapped to a GL (which contribute their
      conversion_balance_cents but no expected balance).
    input_set: "Accounts per GLAccount with gl_account_id set and status in {MAPPED, EXCEPTION, CLEARED, CONVERTED}"
    constants: {}
    precision: "integer cents"

  - name: mock_run_balancing
    trigger: "MockRun finalize"
    algorithm: aggregation
    formula: |
      balanced_account_count := count of accounts with status in {MAPPED, CLEARED, BLOCKED}
      exception_account_count := count of accounts with status EXCEPTION
      converted_total_cents := sum of conversion_balance_cents over ALL accounts
        (any status) after running accrual_interest + monthly_fee_assessment
        at the finalize clock date
      Outcome decision (evaluated after the counts):
        if balanced_account_count == 0 -> FAILED
        else if exception_account_count > 0 -> PASSED_WITH_EXCEPTIONS
        else -> PASSED
      duration_seconds := whole seconds between started_at and finished_at.
    input_set: "All accounts of the project"
    constants: {}
    precision: "integer cents"

  - name: service_credit_computation
    trigger: "ServiceCredit creation and reopen-from-dispute"
    algorithm: waterfall_allocation
    formula: |
      For each defect d in defect_ids (order preserved):
        breach_hours[d] := ceil((d.resolved_at - d.sla_deadline) / 3600 seconds)
      Evaluation order is pinned (circular-looking dependency made explicit):
        step 1: total_breach_hours := sum(breach_hours[d])
        step 2: uncovered_hours := max(0, total_breach_hours - MONTHLY_COVERED_HOURS)
        step 3: raw_cents := uncovered_hours * RATE_CENTS_PER_HOUR
        step 4: credit_cents := min(raw_cents, MONTHLY_CAP_CENTS)
      The cap applies to the aggregated month claim, not per defect.
    input_set: "Defects listed in defect_ids; each must be credit_eligible at creation"
    constants:
      MONTHLY_COVERED_HOURS: 4
      RATE_CENTS_PER_HOUR: 25000
      MONTHLY_CAP_CENTS: 200000
    precision: "integer cents"

  - name: defect_triage_priority
    trigger: "Defect triage"
    algorithm: threshold
    formula: |
      severity_weight: SEV1 = 100, SEV2 = 50, SEV3 = 20
      age_hours := floor((clock now - opened_at) / 3600 seconds)
      age_weight := min(age_hours // 24, 3) * 10
      score := severity_weight + age_weight
      triage_priority := 1 if score >= 110
                         2 if score >= 90
                         3 if score >= 60
                         4 if score >= 30
                         5 otherwise
      Boundaries are inclusive (>=). score 110 -> 1, score 109 -> 2.
    input_set: "The defect being triaged"
    constants:
      SEV1_WEIGHT: 100
      SEV2_WEIGHT: 50
      SEV3_WEIGHT: 20
      AGE_STEP_HOURS: 24
      AGE_STEP_WEIGHT: 10
      AGE_STEP_CAP: 3
    precision: "integer score"

  - name: comm_wave_schedule
    trigger: "CustomerComm creation; comm_backoff adjustment on resend"
    algorithm: chronological
    formula: |
      send_after := project.created_at + (wave - 1) * 86400 seconds
      send_before := send_after + 3 * 86400 seconds (the send window closes
      three days after it opens; an expired window rejects send with
      ERR_OUTSIDE_WINDOW)
      scheduled_send_date := send_after at schedule time.
      On each FAILED -> SENT resend:
        backoff_days := resend_count (after increment)
        scheduled_send_date := send_after + backoff_days * 86400 seconds
      Backoff can only move a comm later, never earlier than send_after, and
      may legitimately push scheduled_send_date beyond send_before (a resent
      comm is still bound by send_before on its next send attempt).
    input_set: "The comm being scheduled or resent"
    constants:
      SECONDS_PER_DAY: 86400
      SEND_WINDOW_DAYS: 3
    precision: "second precision on datetimes"
    variants:
      - name: wave_schedule_variant
        when: "CustomerComm creation and DRAFT -> SCHEDULED"
        difference: "send_after is purely wave-derived from the project's creation clock time; backoff is zero"
      - name: comm_backoff_variant
        when: "FAILED -> SENT resend"
        difference: "scheduled_send_date is shifted later by resend_count days on top of send_after; the send window (send_before) is not extended"

# =============================================================================
# §1.4 Validation Rules Table (ordered by priority)
# =============================================================================
validations:
  - priority: 1
    category: auth
    check: "X-User-Role and X-User-ID headers present and role is declared in §1.7"
    error_id: ERR_UNAUTHENTICATED
    http_status: 401
    applies_to: "all"
  - priority: 2
    category: auth
    check: "Role is permitted to call this endpoint per §1.5 roles"
    error_id: ERR_FORBIDDEN
    http_status: 403
    applies_to: "all"
  - priority: 3
    category: existence
    check: "Every path id exists, left-to-right (project, then nested resources); nested resources must belong to the path project"
    error_id: ERR_NOT_FOUND
    http_status: 404
    applies_to: "all"
  - priority: 4
    category: business_constraint
    check: "Request body well-formed: required fields present, types correct, enum values valid, no unknown fields"
    error_id: ERR_INVALID_REQUEST
    http_status: 400
    applies_to: "all"
  - priority: 4b
    category: state
    check: "OCC: expected_project_version must equal the ConversionProject's current version on OCC-guarded endpoints"
    error_id: ERR_STALE_VERSION
    http_status: 412
    applies_to: "POST /api/v1/accounts/{aid}/map, POST /api/v1/customer-comms/{cid}/schedule"
  - priority: 5
    category: state
    check: "Target resource state permits the transition per §1.2 (invalid from-state, terminal-state lockdown)"
    error_id: ERR_INVALID_STATE
    http_status: 409
    applies_to: "all state-transition endpoints"
  - priority: 6
    category: business_temporal
    check: "Clock/window rules: training start within window, cutover task start within its conversion window, comm send not before scheduled_send_date, cutover plan window geometry (freeze < windows <= reopen, checkpoint between freeze and reopen)"
    error_id: ERR_OUTSIDE_WINDOW
    http_status: 409
    applies_to: "start/complete/send/schedule endpoints with time windows"
  - priority: 7
    category: business_referential
    check: "Cross-entity references valid: account product kind matches account_type, gl_account_id belongs to same project, depends_on_task_id is a lower-sequence task of the same plan (no self-reference, no forward reference), defect linked_system_id belongs to same project"
    error_id: ERR_INVALID_REFERENCE
    http_status: 422
    applies_to: "map, account create, cutover task create, defect create"
  - priority: 8
    category: business_constraint
    check: "Entity invariants: product accrual/rate legality, enrollment capacity, one clearance-style singleton rules (one CutoverPlan per project, one OPEN ServiceCredit per project per month), duplicate enrollment forbidden"
    error_id: ERR_INVARIANT_VIOLATION
    http_status: 422
    applies_to: "product create/activate, enroll, plan create, service-credit create"
  - priority: 9
    category: business_constraint
    check: "Uniqueness: product_code, gl_code, run_label, employee_code, legacy_account_number, ancillary system name — unique per project"
    error_id: ERR_DUPLICATE
    http_status: 409
    applies_to: "create endpoints for those entities"
  - priority: 10
    category: business_fiscal
    check: "Service-credit eligibility and amounts: every defect in defect_ids credit_eligible, sla_deadline month == claim month, not already in an OPEN claim; approve/pay re-check defect status"
    error_id: ERR_CREDIT_INELIGIBLE
    http_status: 422
    applies_to: "service-credit create/approve/pay/reopen"
  - priority: 11
    category: business_safety
    check: "Project phase gates: advance preconditions, plan-cutover preconditions (exactly one PASSED run, no EXCEPTION accounts), go-live preconditions (plan GO, tasks done, systems verified, no open SEV1)"
    error_id: ERR_PHASE_GATE
    http_status: 409
    applies_to: "advance, plan-cutover, go-live, close"
  - priority: 12
    category: business_safety
    check: "File freeze: once project is CUTOVER_PLANNED or LIVE, account mutation actions (map, flag-exception, clear-exception, comm schedule) are blocked"
    error_id: ERR_FROZEN
    http_status: 409
    applies_to: "map, flag-exception, clear-exception, comm schedule"
  - priority: 13
    category: business_temporal
    check: "Branch room overlap: a new TrainingSession whose [scheduled_start, scheduled_end) overlaps an existing non-CANCELLED session of the same branch_name is rejected; touching endpoints do NOT overlap (end == other start is allowed)"
    error_id: ERR_SESSION_OVERLAP
    http_status: 409
    applies_to: "POST /api/v1/training-sessions"
  - priority: 8b
    category: business_constraint
    check: "A second MockRun cannot be started while another run of the same project is RUNNING"
    error_id: ERR_RUN_IN_PROGRESS
    http_status: 409
    applies_to: "POST /api/v1/mock-runs"
  - priority: 11b
    category: business_safety
    check: "Cross-project freeze channel: file_freeze_start must not fall inside another active project's task conversion window plus grace"
    error_id: ERR_FREEZE_CHANNEL_BUSY
    http_status: 409
    applies_to: "POST /api/v1/conversions/{id}/plan-cutover"
  - priority: 14
    category: business_safety
    check: "Segregation of duties: the same X-User-ID that created a Defect cannot triage it; the same X-User-ID that approved a ServiceCredit cannot pay it"
    error_id: ERR_SEGREGATION_OF_DUTIES
    http_status: 403
    applies_to: "defect triage, service-credit pay"

# =============================================================================
# §1.0 Response Envelope (FIXED)
# =============================================================================
response_envelope:
  success: |
    { "meta": { "api_request_id": "req_xxx", "api_request_timestamp": "ISO8601" },
      "response_type": "object" | "array", "data": {} }
  error: |
    { "meta": { ... }, "response_type": "error",
      "data": { "error_id": "ERR_XXX", "message": "..." } }
  pagination_fields: ["limit", "offset", "total_count", "has_more"]
  pagination_defaults: { limit: 10, min: 1, max: 100, offset: 0 }

# =============================================================================
# §1.5 API Endpoint Table
# =============================================================================
endpoints:
  # --- test-driving clock ---
  - method: POST
    path: "/api/v1/_clock/set_current_utc"
    description: "Set the server's logical clock. Before any call, the clock reads exactly 2026-09-01T00:00:00Z and never falls back to wall-clock time."
    roles: [ProjectManager]
    code: 200
    input: [current_utc]
    output: "{ current_utc: string }"
    side_effects: ["logical clock advanced; no catch-up batch transitions occur (comm flush only happens at go-live)"]

  # --- ConversionProject ---
  - method: POST
    path: "/api/v1/conversions"
    description: "Create a conversion project"
    roles: [ProjectManager]
    code: 201
    input: [institution_name, incumbent_core_name, target_core_name, "cutover_scheduled_date?"]
    output: ConversionProject
    side_effects: ["status DISCOVERY, mock_runs_used 0"]
  - method: GET
    path: "/api/v1/conversions"
    description: "List conversion projects"
    roles: [ProjectManager, ConversionEngineer, OperationsLead, Trainer, CommunicationsOfficer, VendorTriageLead, FinanceController]
    code: 200
    input: ["status?", "limit?", "offset?"]
    output: "ConversionProject[]"
    side_effects: []
  - method: GET
    path: "/api/v1/conversions/{id}"
    description: "Get a conversion project"
    roles: [ProjectManager, ConversionEngineer, OperationsLead, Trainer, CommunicationsOfficer, VendorTriageLead, FinanceController]
    code: 200
    input: []
    output: ConversionProject
    side_effects: []
  - method: POST
    path: "/api/v1/conversions/{id}/advance"
    description: "Advance the project phase (DISCOVERY->CONFIGURATION->MOCK_CONVERSION)"
    roles: [ProjectManager]
    code: 200
    input: []
    output: ConversionProject
    side_effects: ["phase transition per ConversionProject state machine", "increments ConversionProject.version by 1"]
  - method: POST
    path: "/api/v1/conversions/{id}/plan-cutover"
    description: "Plan the cutover: creates the CutoverPlan, freezes accounts, marks the baseline mock run"
    roles: [ProjectManager]
    code: 200
    input: [cutover_scheduled_date, file_freeze_start, go_no_go_checkpoint, reopen_target]
    output: CutoverPlan
    side_effects: ["project -> CUTOVER_PLANNED", "CutoverPlan created DRAFT", "accounts frozen", "PASSED run marked is_cutover_baseline", "increments ConversionProject.version by 1"]
  - method: POST
    path: "/api/v1/conversions/{id}/go-live"
    description: "Go live: convert CLEARED accounts, flip uncleared to EXCEPTION, flush due comms"
    roles: [ProjectManager]
    code: 200
    input: []
    output: ConversionProject
    side_effects: ["project -> LIVE", "plan -> LIVE", "cutoff_business_date set", "CLEARED -> CONVERTED with final accrual", "MAPPED -> EXCEPTION", "due SCHEDULED comms -> SENT", "increments ConversionProject.version by 1"]
  - method: POST
    path: "/api/v1/conversions/{id}/close"
    description: "Close the project once no defect is active and no credit claim is OPEN"
    roles: [ProjectManager]
    code: 200
    input: []
    output: ConversionProject
    side_effects: ["project -> CLOSED", "increments ConversionProject.version by 1"]

  # --- ProductType ---
  - method: POST
    path: "/api/v1/product-types"
    description: "Create a product type"
    roles: [ConversionEngineer]
    code: 201
    input: [project_id, product_code, kind, accrual_method, rate, statement_frequency, "monthly_fee_cents?", "fee_waiver_threshold_cents?", "minimum_balance_cents?"]
    output: ProductType
    side_effects: ["status DRAFT"]
  - method: GET
    path: "/api/v1/product-types"
    description: "List product types of a project"
    roles: [ProjectManager, ConversionEngineer, OperationsLead]
    code: 200
    input: [project_id, "status?", "limit?", "offset?"]
    output: "ProductType[]"
    side_effects: []
  - method: GET
    path: "/api/v1/product-types/{ptid}"
    description: "Get a product type"
    roles: [ProjectManager, ConversionEngineer, OperationsLead]
    code: 200
    input: []
    output: ProductType
    side_effects: []
  - method: POST
    path: "/api/v1/product-types/{ptid}/activate"
    description: "Activate a DRAFT product type"
    roles: [ConversionEngineer]
    code: 200
    input: []
    output: ProductType
    side_effects: ["status -> ACTIVE"]
  - method: POST
    path: "/api/v1/product-types/{ptid}/deactivate"
    description: "Return an ACTIVE product type to DRAFT; cascades mapped accounts to EXCEPTION"
    roles: [ConversionEngineer]
    code: 200
    input: []
    output: ProductType
    side_effects: ["status -> DRAFT", "MAPPED accounts of this product -> EXCEPTION"]
  - method: POST
    path: "/api/v1/product-types/{ptid}/retire"
    description: "Retire a product type with no active accounts"
    roles: [ConversionEngineer]
    code: 200
    input: []
    output: ProductType
    side_effects: ["status -> RETIRED"]

  # --- GLAccount ---
  - method: POST
    path: "/api/v1/gl-accounts"
    description: "Create a GL account"
    roles: [ConversionEngineer]
    code: 201
    input: [project_id, gl_code, description]
    output: GLAccount
    side_effects: []
  - method: GET
    path: "/api/v1/gl-accounts"
    description: "List GL accounts"
    roles: [ProjectManager, ConversionEngineer, FinanceController]
    code: 200
    input: [project_id, "limit?", "offset?"]
    output: "GLAccount[]"
    side_effects: []
  - method: GET
    path: "/api/v1/gl-accounts/{gid}"
    description: "Get a GL account with computed expected/converted/variance"
    roles: [ProjectManager, ConversionEngineer, FinanceController]
    code: 200
    input: []
    output: GLAccount
    side_effects: []

  # --- Account ---
  - method: POST
    path: "/api/v1/accounts"
    description: "Stage a legacy account for conversion"
    roles: [ConversionEngineer]
    code: 201
    input: [project_id, legacy_account_number, account_type, product_type_id, opening_principal_cents, statement_cycle_day, accrual_start_date]
    output: Account
    side_effects: ["status STAGED; new_account_number minted"]
  - method: GET
    path: "/api/v1/accounts"
    description: "List accounts of a project"
    roles: [ProjectManager, ConversionEngineer, OperationsLead, FinanceController]
    code: 200
    input: [project_id, "status?", "product_type_id?", "gl_account_id?", "limit?", "offset?"]
    output: "Account[]"
    side_effects: []
  - method: GET
    path: "/api/v1/accounts/{aid}"
    description: "Get an account with computed conversion fields"
    roles: [ProjectManager, ConversionEngineer, OperationsLead, FinanceController]
    code: 200
    input: []
    output: Account
    side_effects: []
  - method: POST
    path: "/api/v1/accounts/{aid}/map"
    description: "Map a STAGED account to a GL account (OCC-guarded on project version)"
    roles: [ConversionEngineer]
    code: 200
    input: [gl_account_id, expected_project_version]
    output: Account
    side_effects: ["status -> MAPPED", "gl_account_id set", "GL recomputed", "increments ConversionProject.version by 1"]
  - method: POST
    path: "/api/v1/accounts/{aid}/flag-exception"
    description: "Flag a MAPPED or CLEARED account as exception"
    roles: [ConversionEngineer]
    code: 200
    input: [note]
    output: Account
    side_effects: ["status -> EXCEPTION", "exception_note set"]
  - method: POST
    path: "/api/v1/accounts/{aid}/clear-exception"
    description: "Clear an EXCEPTION account"
    roles: [ConversionEngineer]
    code: 200
    input: [resolution_note]
    output: Account
    side_effects: ["status -> CLEARED", "GL recomputed"]

  # --- MockRun ---
  - method: POST
    path: "/api/v1/mock-runs"
    description: "Start a mock conversion run"
    roles: [ConversionEngineer]
    code: 201
    input: [project_id, run_label]
    output: MockRun
    side_effects: ["state RUNNING; started_at := clock now; fails if another run is RUNNING"]
  - method: GET
    path: "/api/v1/mock-runs"
    description: "List mock runs"
    roles: [ProjectManager, ConversionEngineer, OperationsLead]
    code: 200
    input: [project_id, "state?", "limit?", "offset?"]
    output: "MockRun[]"
    side_effects: []
  - method: GET
    path: "/api/v1/mock-runs/{rid}"
    description: "Get a mock run with balancing report fields"
    roles: [ProjectManager, ConversionEngineer, OperationsLead]
    code: 200
    input: []
    output: MockRun
    side_effects: []
  - method: POST
    path: "/api/v1/mock-runs/{rid}/finalize"
    description: "Finalize a run: computes accruals, fees, GL variances, balancing counts, outcome"
    roles: [ConversionEngineer]
    code: 200
    input: []
    output: MockRun
    side_effects: ["accrual_interest per account (mock variant)", "monthly_fee_assessment per account", "gl_variance per GL", "mock_run_balancing counts and outcome", "project.mock_runs_used += 1"]

  # --- AncillarySystem ---
  - method: POST
    path: "/api/v1/ancillary-systems"
    description: "Register an ancillary system for reintegration"
    roles: [OperationsLead]
    code: 201
    input: [project_id, name, category, interface_version]
    output: AncillarySystem
    side_effects: ["status PENDING"]
  - method: GET
    path: "/api/v1/ancillary-systems"
    description: "List ancillary systems"
    roles: [ProjectManager, OperationsLead, VendorTriageLead]
    code: 200
    input: [project_id, "status?", "category?", "limit?", "offset?"]
    output: "AncillarySystem[]"
    side_effects: []
  - method: GET
    path: "/api/v1/ancillary-systems/{sid}"
    description: "Get an ancillary system"
    roles: [ProjectManager, OperationsLead, VendorTriageLead]
    code: 200
    input: []
    output: AncillarySystem
    side_effects: []
  - method: POST
    path: "/api/v1/ancillary-systems/{sid}/start-integration"
    description: "Begin integration work (PENDING or FAILED -> INTEGRATING)"
    roles: [OperationsLead]
    code: 200
    input: []
    output: AncillarySystem
    side_effects: ["status -> INTEGRATING"]
  - method: POST
    path: "/api/v1/ancillary-systems/{sid}/verify"
    description: "Mark integration verified"
    roles: [OperationsLead]
    code: 200
    input: []
    output: AncillarySystem
    side_effects: ["status -> VERIFIED"]
  - method: POST
    path: "/api/v1/ancillary-systems/{sid}/fail"
    description: "Mark integration failed"
    roles: [OperationsLead]
    code: 200
    input: []
    output: AncillarySystem
    side_effects: ["status -> FAILED"]
  - method: POST
    path: "/api/v1/ancillary-systems/{sid}/retest"
    description: "Retest a failed integration"
    roles: [OperationsLead]
    code: 200
    input: []
    output: AncillarySystem
    side_effects: ["status -> RETEST_PASSED"]

  # --- TrainingSession / StaffMember / Enrollment ---
  - method: POST
    path: "/api/v1/training-sessions"
    description: "Schedule a branch training session"
    roles: [Trainer]
    code: 201
    input: [project_id, branch_name, scheduled_start, scheduled_end, capacity]
    output: TrainingSession
    side_effects: ["status SCHEDULED"]
  - method: GET
    path: "/api/v1/training-sessions"
    description: "List training sessions"
    roles: [ProjectManager, Trainer, OperationsLead]
    code: 200
    input: [project_id, "status?", "branch_name?", "limit?", "offset?"]
    output: "TrainingSession[]"
    side_effects: []
  - method: GET
    path: "/api/v1/training-sessions/{tsid}"
    description: "Get a training session with computed counts"
    roles: [ProjectManager, Trainer, OperationsLead]
    code: 200
    input: []
    output: TrainingSession
    side_effects: []
  - method: POST
    path: "/api/v1/training-sessions/{tsid}/start"
    description: "Start a scheduled session (within its window)"
    roles: [Trainer]
    code: 200
    input: []
    output: TrainingSession
    side_effects: ["status -> IN_PROGRESS"]
  - method: POST
    path: "/api/v1/training-sessions/{tsid}/complete"
    description: "Complete a session; no RESERVED enrollments may remain"
    roles: [Trainer]
    code: 200
    input: []
    output: TrainingSession
    side_effects: ["status -> COMPLETED"]
  - method: POST
    path: "/api/v1/training-sessions/{tsid}/cancel"
    description: "Cancel a scheduled session; RESERVED enrollments cascade to CANCELLED"
    roles: [Trainer]
    code: 200
    input: []
    output: TrainingSession
    side_effects: ["status -> CANCELLED", "enrollments cascade"]
  - method: POST
    path: "/api/v1/staff"
    description: "Register a staff member"
    roles: [Trainer]
    code: 201
    input: [project_id, employee_code, full_name, branch_name, role_scope]
    output: StaffMember
    side_effects: []
  - method: GET
    path: "/api/v1/staff"
    description: "List staff members"
    roles: [ProjectManager, Trainer, OperationsLead]
    code: 200
    input: [project_id, "role_scope?", "branch_name?", "limit?", "offset?"]
    output: "StaffMember[]"
    side_effects: []
  - method: GET
    path: "/api/v1/staff/{smid}"
    description: "Get a staff member"
    roles: [ProjectManager, Trainer, OperationsLead]
    code: 200
    input: []
    output: StaffMember
    side_effects: []
  - method: POST
    path: "/api/v1/enrollments"
    description: "Enroll a staff member in a session"
    roles: [Trainer]
    code: 201
    input: [session_id, employee_id]
    output: Enrollment
    side_effects: ["session.reserved_count += 1"]
  - method: GET
    path: "/api/v1/enrollments"
    description: "List enrollments of a session"
    roles: [ProjectManager, Trainer]
    code: 200
    input: [session_id, "state?", "employee_id?", "limit?", "offset?"]
    output: "Enrollment[]"
    side_effects: []
  - method: POST
    path: "/api/v1/enrollments/{eid}/attend"
    description: "Mark an enrollment attended (session IN_PROGRESS); may auto-complete the session"
    roles: [Trainer]
    code: 200
    input: []
    output: Enrollment
    side_effects: ["session counts recomputed", "if last RESERVED enrollment and clock >= scheduled_end: session auto-COMPLETED and certification cascade fires (see Enrollment state machine)"]
  - method: POST
    path: "/api/v1/enrollments/{eid}/no-show"
    description: "Mark an enrollment no-show (session IN_PROGRESS)"
    roles: [Trainer]
    code: 200
    input: []
    output: Enrollment
    side_effects: ["session.reserved_count -= 1"]
  - method: POST
    path: "/api/v1/enrollments/{eid}/cancel"
    description: "Cancel a reserved enrollment"
    roles: [Trainer]
    code: 200
    input: []
    output: Enrollment
    side_effects: ["session.reserved_count -= 1"]

  # --- CustomerComm ---
  - method: POST
    path: "/api/v1/customer-comms"
    description: "Create a customer communication for an account"
    roles: [CommunicationsOfficer]
    code: 201
    input: [project_id, account_id, comm_type, wave]
    output: CustomerComm
    side_effects: ["status DRAFT", "send_after computed per comm_wave_schedule"]
  - method: GET
    path: "/api/v1/customer-comms"
    description: "List customer communications"
    roles: [ProjectManager, CommunicationsOfficer]
    code: 200
    input: [project_id, "status?", "account_id?", "wave?", "limit?", "offset?"]
    output: "CustomerComm[]"
    side_effects: []
  - method: GET
    path: "/api/v1/customer-comms/{cid}"
    description: "Get a customer communication"
    roles: [ProjectManager, CommunicationsOfficer]
    code: 200
    input: []
    output: CustomerComm
    side_effects: []
  - method: POST
    path: "/api/v1/customer-comms/{cid}/schedule"
