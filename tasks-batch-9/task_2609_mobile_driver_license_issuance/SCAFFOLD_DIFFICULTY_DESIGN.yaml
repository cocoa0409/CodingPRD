  # ===========================================================================
  # RULE 8 - resource_temporal_overlap
  # DIFFERENT interval semantics on DIFFERENT resource entities: half-open
  # non-overlap per Device (semantics A) and exact aggregate tiling per
  # InteropProfile (semantics B).
  # ===========================================================================
  - rule_id: resource_temporal_overlap
    instances:

      - name: credential_validity_windows_per_device_reject_overlap_accept_adjacency
        grounds: "validations priority 20, INTERVAL SEMANTICS A (half-open, adjacency allowed), error ERR_CREDENTIAL_VALIDITY_OVERLAP; endpoint POST /mdl/credentials"
        distinguishing_aspect: "Resource entity: the Device, which may carry several credentials over time. Semantics A is half-open [valid_from, valid_until), so exact endpoint adjacency (new.valid_from == other.valid_until) is ACCEPTED. The two calls differ only in valid_from, and one of them is precisely the adjacency case, so an implementation using closed intervals or a >= comparison fails the accepting call rather than the rejecting one."
        test_recipe:
          setup: "One attested handset already carrying a PENDING_PROVISION credential valid for [2026-08-01, 2027-08-01), plus a second VERIFIED proofing session ready to be consumed."
