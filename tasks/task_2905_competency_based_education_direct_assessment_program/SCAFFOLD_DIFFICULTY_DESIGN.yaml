  - rule_id: boundary_precision_check
    instances:
      - name: mastery_threshold_inclusive_boundary
        grounds:
          - calculations.rubric_weighted_score
          - calculations.attempt_final_score
          - entities.Competency.fields.mastery_threshold_pct
          - entities.Competency.fields.effective_mastery_threshold_pct
          - state_machines.AssessmentAttempt.UNDER_REVIEW_to_SCORED_MASTERED
        distinguishing_aspect: |
          Metric under test: the mastery threshold percentage at 2-decimal
          precision, exercised on POST /assessment-attempts/{id}/scores. The pair
          80.00 (exactly at the threshold, MASTERED) versus 79.99 (one hundredth
          below, NOT_MASTERED) pins the comparison as >= and pins the rounding to
          exactly 2 dp; max_score 10000 makes the 0.01 step reachable with integer
          raw scores, so the assertion cannot be satisfied by a wider tolerance.
