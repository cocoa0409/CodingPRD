  - rule_id: transitive_cascade
    instances:
      - name: follow_up_alarm_missing_cascades_household_then_zone_then_district
        grounds:
          - state_machines.Household.VISIT_COMPLETED_to_REVISIT_REQUIRED
          - state_machines.EscapePlan.VERIFIED_to_LAPSED
          - calculations.zone_risk_score
          - calculations.district_risk_rollup
          - entities.RiskZone.fields.post_service_alarm_loss_units
          - endpoints[POST /crr/follow-ups]
        distinguishing_aspect: |
          Trigger: a single POST /crr/follow-ups with outcome REACHED_ALARM_MISSING. Sequential spine
          of depth 4 - the FollowUpContact row flips Household to REVISIT_REQUIRED, that household
          transition (not the contact) lapses the household's VERIFIED EscapePlan and bumps the zone's
          post_service_alarm_loss_units, that zone counter change re-runs the VALIDATED zone score
          (49.52 -> 59.52), and that new zone score re-runs the parent district rollup (45.91 -> 52.58).
        test_recipe:
          setup:
            - "Logical clock starts at 2026-08-01T00:00:00Z."
            - "A district parent zone with two child leaves: zone B (2000 occupied units) and zone C (1000 occupied units, scored 38.70 / TIER_3)."
            - "Zone B is first scored PROVISIONAL at 54.52, then re-scored VALIDATED at 49.52 after one survey found a working alarm, so the district rollup sits at 45.91."
            - "The single household in zone B has one occupant aged 65+, so its required smoke coverage is 2 and it is retention-eligible."
            - "Its visit is completed on 2026-08-01, giving the zone service_start_date 2026-08-01 and driving zone B to SERVICE_COMPLETE."
            - "An escape plan is drafted and ISSUED, then VERIFIED by a first follow-up on 2026-09-05 (35 days later, past FOLLOWUP_MIN_DAYS 30) reporting REACHED_ALARM_PRESENT with plan_practiced true."
