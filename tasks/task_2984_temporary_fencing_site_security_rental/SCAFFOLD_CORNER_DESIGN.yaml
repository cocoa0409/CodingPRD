              captures: { j2_id: "$.data.id", j2_v: "$.data.version" }
          trigger:
            - call: "POST /fence-rentals/jobsites/${j1_id}/quotes"
              payload: { expected_jobsite_version: "${j1_v}", contract_type: "CONSTRUCTION", linear_feet: 500, panel_product_code: "PANEL-CL-10", term_months: 3, wind_screen: "SOLID_130" }
