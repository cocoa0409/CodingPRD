        claim_type: Satisfaction → Pass
        grounds:
          - validations[priority=12]
          - entities.Subscriber.fields.annual_usage_kwh
          - state_machines.Enrollment.DRAFT_to_SUBMITTED
        distinguishing_aspect: "annual_usage 5000 with share 5.0 → 5.0*1000 == 5000 <= 5000 passes the usage cap (boundary equality); enrollment moves to SUBMITTED."
        test_recipe:
          setup:
            - "Subscriber annual_usage 5000; enrollment share 5.0 on an OPEN project with capacity."
          setup_api_calls:
            - call: "POST /projects"
              payload: { name: "P19", state_code: "NY", nameplate_capacity_kw: 100, credit_rate_cents_per_kwh: 10 }
