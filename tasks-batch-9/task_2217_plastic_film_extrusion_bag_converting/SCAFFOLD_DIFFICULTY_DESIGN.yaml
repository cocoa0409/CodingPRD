            - *a_r1_c1
            - *a_r1_c2
            - *a_r1_c3
            - *a_r1_c4
            - *a_r1_c5
            - *a_r1_sub
            - *a_r1_app
            - *a_runfd_new
            - *a_runfd_start
            - *a_gfd_50
            - *a_gfd_50
            - *a_gfd_50
            - *a_gfd_50
            - *a_gfd_50
            - *a_rollfd
            - *a_roll2
            - *a_roll3
            - *a_runfd_comp
            - *a_rollfd_rel
            - *a_roll2_rel
            - *a_plate1
            - *a_plate1_mount
            - *a_pj1
            - *a_pj1_reg
            - *a_pj1_col
            - *a_pj1_sp
            - *a_pj1_cmp
            - &a_pj2 { call: "POST /print-jobs", payload: { job_code: "PJ-2", film_roll_id: "${roll2}", plate_set_id: "${plate1}", press_id: "${press1}", window_start: "2026-08-05T06:00:00Z", window_end: "2026-08-05T18:00:00Z" }, as: PrintOperator, captures: { pj2: "$.data.id" } }
            - &a_runfd2_new { call: "POST /extrusion-runs", payload: { run_code: "RUN-FD-2", line_id: "${line_fd}", blend_recipe_id: "${r1}", scheduled_start: "2026-08-06T06:00:00Z", scheduled_end: "2026-08-06T14:00:00Z", target_output_kg: 1000.0 }, as: ExtrusionOperator, captures: { run_fd2: "$.data.id" } }
            - *a_bl1
            - *a_bl1_s1_26
