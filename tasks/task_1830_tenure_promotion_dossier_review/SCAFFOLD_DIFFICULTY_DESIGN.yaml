  # ---------------------------------------------------------------------------
  - rule_id: cross_entity_state_dependency
    instances:
      - name: dossier_item_submit_requires_case_assembly
        grounds:
          - state_machines.DossierItem.DRAFT_to_SUBMITTED
          - state_machines.TenureCase.DOSSIER_ASSEMBLY_to_EXTERNAL_REVIEW
          - errors[ERR_CASE_STAGE_FORBIDDEN]
        distinguishing_aspect: |
          Pair (DossierItem, TenureCase): an item left DRAFT when its case
          advances to EXTERNAL_REVIEW becomes permanently unsubmittable —
          the item's DRAFT -> SUBMITTED transition is gated on the PARENT
          case's stage, not on anything about the item itself.
        test_recipe:
          setup:
            - "Case with 6 standard items SUBMITTED plus one extra item left DRAFT; dossier submitted (case now EXTERNAL_REVIEW)"
          setup_api_calls:
            - { call: "POST /api/_clock/set_current_utc", payload: { to_iso8601: "2026-08-01T00:00:00Z" }, as: SystemAdmin }
            - { call: "POST /api/candidates", payload: { full_name: "Cand G", employee_id: "E1600", department: "CS", college: "ENG", tenure_clock_start: "2020-08-01" }, as: ProvostOfficer, captures: { cand_g: $.data.id } }
            - { call: "POST /api/cases", payload: { candidate_id: "${cand_g}", review_cycle: "2026-2027", target_rank: "ASSOCIATE_PROFESSOR", seeking_tenure: true, clock_policy: "ANNIVERSARY" }, as: ProvostOfficer, as_user_id: "po_creator", captures: { case_g: $.data.id, case_g_v: $.data.version } }
            - { call: "POST /api/dossier-items", payload: { case_id: "${case_g}", category: "TEACHING", title: "T1", page_count: 10, expected_case_version: "${case_g_v}" }, as: Candidate, as_user_id: "${cand_g}", captures: { g_t1: $.data.id } }
            - { call: "POST /api/dossier-items", payload: { case_id: "${case_g}", category: "TEACHING", title: "T2", page_count: 10, expected_case_version: "${case_g_v} + 1" }, as: Candidate, as_user_id: "${cand_g}", captures: { g_t2: $.data.id } }
            - { call: "POST /api/dossier-items", payload: { case_id: "${case_g}", category: "RESEARCH", title: "R1", page_count: 12, is_peer_reviewed: true, expected_case_version: "${case_g_v} + 2" }, as: Candidate, as_user_id: "${cand_g}", captures: { g_r1: $.data.id } }
            - { call: "POST /api/dossier-items", payload: { case_id: "${case_g}", category: "RESEARCH", title: "R2", page_count: 12, expected_case_version: "${case_g_v} + 3" }, as: Candidate, as_user_id: "${cand_g}", captures: { g_r2: $.data.id } }
            - { call: "POST /api/dossier-items", payload: { case_id: "${case_g}", category: "RESEARCH", title: "R3", page_count: 12, expected_case_version: "${case_g_v} + 4" }, as: Candidate, as_user_id: "${cand_g}", captures: { g_r3: $.data.id } }
            - { call: "POST /api/dossier-items", payload: { case_id: "${case_g}", category: "SERVICE", title: "S1", page_count: 5, expected_case_version: "${case_g_v} + 5" }, as: Candidate, as_user_id: "${cand_g}", captures: { g_s1: $.data.id } }
            - { call: "POST /api/dossier-items", payload: { case_id: "${case_g}", category: "TEACHING", title: "T3 late", page_count: 4, expected_case_version: "${case_g_v} + 6" }, as: Candidate, as_user_id: "${cand_g}", captures: { g_late: $.data.id } }
            - { call: "POST /api/dossier-items/${g_t1}/submit", as: Candidate, as_user_id: "${cand_g}" }
            - { call: "POST /api/dossier-items/${g_t2}/submit", as: Candidate, as_user_id: "${cand_g}" }
            - { call: "POST /api/dossier-items/${g_r1}/submit", as: Candidate, as_user_id: "${cand_g}" }
            - { call: "POST /api/dossier-items/${g_r2}/submit", as: Candidate, as_user_id: "${cand_g}" }
            - { call: "POST /api/dossier-items/${g_r3}/submit", as: Candidate, as_user_id: "${cand_g}" }
            - { call: "POST /api/dossier-items/${g_s1}/submit", as: Candidate, as_user_id: "${cand_g}" }
            - { call: "POST /api/cases/${case_g}/submit-dossier", as: Candidate, as_user_id: "${cand_g}" }
          trigger:
            - { call: "POST /api/dossier-items/${g_late}/submit", as: Candidate, as_user_id: "${cand_g}", captures: { err_g: $.data.error_id } }
          assert:
            - "err_g == ERR_CASE_STAGE_FORBIDDEN"
            - "DossierItem.${g_late}.status == DRAFT (unchanged)"

      - name: appeal_requires_notified_case
        grounds:
          - validations[priority=6]
          - state_machines.TenureCase.DECIDED_to_NOTIFIED
          - errors[ERR_CASE_STAGE_FORBIDDEN]
        distinguishing_aspect: |
          Pair (Appeal, TenureCase/ProvostDecision): a RECORDED decision alone
          does not open the grievance channel — filing an appeal while the case
