          zone_code: US-WEST
          ship_method: GROUND
          transit_days: 4
          cutoff_hour_utc: 18
          surcharge_cents: 0
        as: MerchandiseManager
        captures:
          v1_r1_id: $.data.id
      - call: POST /dropship/vendors/${v1_id}/certify
        payload: {}
        as: VendorOpsAnalyst
        as_user_id: ops-cert-V1
      - call: POST /dropship/vendors/${v1_id}/activate
        payload: {}
