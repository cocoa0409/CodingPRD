            - { call: "POST /v1/teams/${tb_id}/place-division", payload: { division_name: "A" }, as: LeagueCoordinator }
            - { call: "POST /v1/leagues/${lg_id}/start-season", payload: {}, as: LeagueCoordinator }
            - { call: "GET /v1/leagues/${lg_id}", payload: {}, as: LeagueCoordinator, captures: { lg_v: "$.data.version" } }
            - { call: "POST /v1/leagues/${lg_id}/games", payload: { home_team_id: "${ta_id}", away_team_id: "${tb_id}", facility_id: "${f_id}", start_at: "2026-09-08T18:00:00Z", end_at: "2026-09-08T19:30:00Z", expected_league_version: "${lg_v}" }, as: LeagueCoordinator, captures: { g_id: "$.data.id" } }
            - { call: "POST /v1/staff", payload: { full_name: "Ref O", staff_role: "OFFICIAL", base_hourly_rate_cents: 2000, certification_level: 2 }, as: RecAdmin, captures: { o_id: "$.data.id" } }
