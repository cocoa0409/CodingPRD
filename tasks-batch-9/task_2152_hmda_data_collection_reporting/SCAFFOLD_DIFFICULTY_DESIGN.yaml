  - rule_id: compensating_invariant
    instances:
      - name: register_record_accounting_survives_action_taken_then_reopen
        grounds:
          - entities.Institution.fields.total_application_count
          - entities.Institution.fields.pending_record_count
          - entities.Institution.fields.reportable_record_count
          - entities.Institution.fields.excluded_record_count
          - state_machines.Application.stage.REGISTER_LOCKED_to_DECISIONED
        distinguishing_aspect: |
          Conserved quantity: the register record accounting identity
          pending_record_count + reportable_record_count + excluded_record_count
          == total_application_count. Recording the action taken moves one unit
          from pending to reportable; reopening the record moves that same unit
          back, and every one of the four counters returns to its exact
          pre-action value with zero drift.
        test_recipe:
          setup:
            - "One non partial-exempt Institution, one CensusTract."
            - "One Application geocoded MATCHED, carrying an APPLICANT DemographicEntry, advanced to DECISIONED and still PENDING_FIELDS: total 1, pending 1, reportable 0, excluded 0."
          setup_api_calls:
            - call: "POST /hmda/institutions"
              payload: { lei: "5493001KJTIIGC8Y1R12", name: "First Meridian Bank", activity_year: 2026, asset_size_usd_cents: 250000000000, prior_year_closed_end_originations: 700, prior_year_open_end_originations: 40 }
              as: SystemAdmin
              captures: { inst_id: $.data.id }
            - call: "POST /hmda/census-tracts"
              payload: { tract_code: "06075010100", county_fips: "06075", state_code: "CA", msa_md_code: "41860", minority_population_pct: 42.5, tract_to_msa_income_pct: 88.4, owner_occupied_units: 1200, median_family_income_cents: 9500000 }
              as: SystemAdmin
            - call: "POST /hmda/applications"
              payload: { institution_id: "${inst_id}", uli: "10BX939C5543TQA1B00000141", application_date: "2026-02-10T00:00:00Z", application_channel: "FACE_TO_FACE", loan_type: "CONVENTIONAL", loan_purpose: "HOME_PURCHASE", occupancy_type: "PRINCIPAL", lien_status: "FIRST_LIEN", loan_amount_cents: 35000000, income_thousands: 120 }
              as: LoanOfficer
              captures: { app_id: $.data.id, app_v1: $.data.version }
            - call: "POST /hmda/geocode-assignments"
              payload: { application_id: "${app_id}", expected_application_version: "${app_v1}", street_address: "1 Market St", city: "San Francisco", state_code: "CA", zip_code: "94105", county_fips: "06075", submitted_tract_code: "06075010100" }
              as: LoanOfficer
            - call: "POST /hmda/demographic-entries"
              payload: { application_id: "${app_id}", applicant_role: "APPLICANT", collection_method: "VISUAL_OBSERVATION_OR_SURNAME", ethnicity_codes: ["NOT_HISPANIC_OR_LATINO"], race_codes: ["WHITE"], sex_code: "MALE", observation_basis: "VISUAL" }
              as: LoanOfficer
            - call: "POST /hmda/applications/${app_id}/advance"
              payload: { to_stage: "UNDERWRITING" }
              as: LoanOfficer
            - call: "POST /hmda/applications/${app_id}/advance"
              payload: { to_stage: "DECISIONED" }
              as: LoanOfficer
            - call: "GET /hmda/institutions/${inst_id}"
              payload: {}
              as: ComplianceAnalyst
              captures: { pending_before: $.data.pending_record_count, reportable_before: $.data.reportable_record_count }
            - call: "POST /hmda/applications/${app_id}/action-taken"
              payload: { action_taken: "ORIGINATED", action_taken_date: "2026-03-15T00:00:00Z", rate_spread: 1.75, purchaser_type: "NOT_APPLICABLE" }
              as: LoanOfficer
            - call: "POST /hmda/applications/${app_id}/advance"
              payload: { to_stage: "REGISTER_LOCKED" }
              as: LoanOfficer
          trigger:
            - call: "POST /hmda/applications/${app_id}/reopen"
              payload: { reason: "Compensating correction: action taken recorded against the wrong file." }
              as: ComplianceAnalyst
              as_user_id: "analyst-nova"
          assert:
            - "before the action-taken call: Institution.${inst_id}.pending_record_count == 1 and reportable_record_count == 0"
            - "after the action-taken call: Institution.${inst_id}.pending_record_count == 0 and reportable_record_count == 1"
            - "after the reopen: Institution.${inst_id}.pending_record_count == 1"
            - "after the reopen: Institution.${inst_id}.reportable_record_count == 0"
            - "after the reopen: Institution.${inst_id}.excluded_record_count == 0"
            - "after the reopen: Institution.${inst_id}.total_application_count == 1"
            - "invariant at every observation: pending_record_count + reportable_record_count + excluded_record_count == total_application_count"
            - "Application.${app_id}.lar_status == PENDING_FIELDS"

      - name: edit_exception_ledger_survives_verify_then_reopen
        grounds:
          - entities.EditRun.fields.total_exception_count
          - entities.EditRun.fields.open_exception_count
          - entities.EditRun.fields.verified_exception_count
          - entities.EditRun.fields.stale_exception_count
          - state_machines.EditException.VERIFIED_to_OPEN
        distinguishing_aspect: |
          Conserved quantity: the edit-exception ledger identity
          open_exception_count + verified_exception_count + stale_exception_count
          == total_exception_count. Verification moves one unit from open to
          verified; the reopen cascade moves that same unit back, and
          total_exception_count is 1 before, between and after — a different
          conserved quantity from the register record accounting identity.
        test_recipe:
          setup:
            - "One non partial-exempt Institution, one CensusTract."
            - "One Application with a 196-day decision lag, REGISTER_LOCKED, so edit run 1 raises exactly one Q615 quality exception (total_exception_count 1, open 1, verified 0, stale 0)."
            - "analyst-nova verifies that exception, giving open 0, verified 1, stale 0."
          setup_api_calls:
            - call: "POST /hmda/institutions"
              payload: { lei: "5493001KJTIIGC8Y1R12", name: "First Meridian Bank", activity_year: 2026, asset_size_usd_cents: 250000000000, prior_year_closed_end_originations: 700, prior_year_open_end_originations: 40 }
              as: SystemAdmin
              captures: { inst_id: $.data.id }
            - call: "POST /hmda/census-tracts"
              payload: { tract_code: "06075010100", county_fips: "06075", state_code: "CA", msa_md_code: "41860", minority_population_pct: 42.5, tract_to_msa_income_pct: 88.4, owner_occupied_units: 1200, median_family_income_cents: 9500000 }
              as: SystemAdmin
            - call: "POST /hmda/applications"
              payload: { institution_id: "${inst_id}", uli: "10BX939C5543TQA1B00000151", application_date: "2026-01-05T00:00:00Z", application_channel: "FACE_TO_FACE", loan_type: "CONVENTIONAL", loan_purpose: "HOME_PURCHASE", occupancy_type: "PRINCIPAL", lien_status: "FIRST_LIEN", loan_amount_cents: 35000000, income_thousands: 120 }
              as: LoanOfficer
              captures: { app_id: $.data.id, app_v1: $.data.version }
            - call: "POST /hmda/geocode-assignments"
              payload: { application_id: "${app_id}", expected_application_version: "${app_v1}", street_address: "1 Market St", city: "San Francisco", state_code: "CA", zip_code: "94105", county_fips: "06075", submitted_tract_code: "06075010100" }
              as: LoanOfficer
            - call: "POST /hmda/demographic-entries"
              payload: { application_id: "${app_id}", applicant_role: "APPLICANT", collection_method: "VISUAL_OBSERVATION_OR_SURNAME", ethnicity_codes: ["NOT_HISPANIC_OR_LATINO"], race_codes: ["WHITE"], sex_code: "MALE", observation_basis: "VISUAL" }
              as: LoanOfficer
            - call: "POST /hmda/applications/${app_id}/advance"
              payload: { to_stage: "UNDERWRITING" }
              as: LoanOfficer
            - call: "POST /hmda/applications/${app_id}/advance"
              payload: { to_stage: "DECISIONED" }
              as: LoanOfficer
            - call: "POST /hmda/applications/${app_id}/action-taken"
              payload: { action_taken: "ORIGINATED", action_taken_date: "2026-07-20T00:00:00Z", rate_spread: 1.75, purchaser_type: "NOT_APPLICABLE" }
              as: LoanOfficer
            - call: "POST /hmda/applications/${app_id}/advance"
              payload: { to_stage: "REGISTER_LOCKED" }
              as: LoanOfficer
            - call: "POST /hmda/edit-runs"
              payload: { institution_id: "${inst_id}", scope: "FULL", window_start: "2026-08-01T00:00:00Z", window_end: "2026-08-02T00:00:00Z" }
              as: ComplianceAnalyst
              captures: { run_id: $.data.id, total_before: $.data.total_exception_count }
            - call: "GET /hmda/edit-runs/${run_id}/exceptions"
              payload: {}
              as: ComplianceAnalyst
              captures: { exc_id: "$.data[0].id" }
            - call: "POST /hmda/edit-exceptions/${exc_id}/verify"
              payload: { verification_note: "Lag confirmed against the underwriting file." }
              as: ComplianceAnalyst
              as_user_id: "analyst-nova"
          trigger:
            - call: "POST /hmda/applications/${app_id}/reopen"
              payload: { reason: "Compensating correction after verification." }
              as: ComplianceAnalyst
              as_user_id: "analyst-nova"
          assert:
            - "before the verify: EditRun.${run_id}.total_exception_count == 1, open_exception_count == 1, verified_exception_count == 0, stale_exception_count == 0"
            - "after the verify: EditRun.${run_id}.open_exception_count == 0 and verified_exception_count == 1"
            - "after the reopen: EditRun.${run_id}.open_exception_count == 1"
            - "after the reopen: EditRun.${run_id}.verified_exception_count == 0"
            - "after the reopen: EditRun.${run_id}.stale_exception_count == 0"
            - "after the reopen: EditRun.${run_id}.total_exception_count == 1"
            - "invariant at every observation: open_exception_count + verified_exception_count + stale_exception_count == total_exception_count"
            - "EditException.${exc_id}.status == OPEN"
