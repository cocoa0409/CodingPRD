      - name: stale_period_version_blocks_the_second_hour_posted_to_a_settlement_period
        claim_type: optimistic_concurrency
        grounds:
          - concurrency_rules.meter-interval-post-stale-period
          - errors[ERR_STALE_VERSION]
          - endpoints.POST_/ppa/settlement-periods/{id}/intervals
          - entities.SettlementPeriod.fields.interval_count
        distinguishing_aspect: |
          This is the only OCC rule whose parent is NOT the Deal, and its occ_field is named
          expected_settlement_period_version accordingly - a caller who supplies a Deal
          version here is refused even when that deal version is perfectly current. Hourly
          intervals accumulate by design, so hour 01 is not blocked by any state
          precondition; it is blocked because the token was minted before hour 00 landed.
          The refusal leaves interval_count at 1, which is exactly the counter a duplicate
          post would have corrupted.
