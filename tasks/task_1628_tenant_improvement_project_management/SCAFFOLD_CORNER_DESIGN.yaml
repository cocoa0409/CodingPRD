              captures: { space_a: $.data.id }
            - call: "POST /api/properties/${prop_id}/lease-spaces"
              payload: { suite_number: "2", floor: 1, rentable_sqft: 1000 }
              as: LandlordPM
              captures: { space_b: $.data.id }
            - call: "POST /api/tenants"
              payload: { legal_name: "TA", contact_email: "a@x.example", tax_id: "TXA" }
              as: LandlordPM
              captures: { tenant_a: $.data.id }
            - call: "POST /api/tenants"
              payload: { legal_name: "TB", contact_email: "b@x.example", tax_id: "TXB" }
              as: LandlordPM
              captures: { tenant_b: $.data.id }
            - call: "POST /api/leases"
