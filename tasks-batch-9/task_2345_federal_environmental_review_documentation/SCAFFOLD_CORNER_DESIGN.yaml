            - "Exactly one RECORD_CERTIFIED entry exists in GET /proposed-actions/${act_id}/record-entries"

      - name: corner_consultation_response_after_statutory_due_at_is_marked_late
        claim_type: valid_transition
        grounds:
          - state_machines.ConsultationRequest.PENDING_to_CONDITIONAL_CONCURRENCE
          - entities.ConsultationRequest.fields.late
          - calculations.consultation_requirement_set
        distinguishing_aspect: "A CONDITIONAL_CONCURRENCE recorded at 2026-09-10T00:00:00Z against statutory_due_at 2026-09-04T00:00:00Z sets late true and stores conditions_text, while the agency's active_consultation_count falls back to 0 — a valid transition whose derived fields all move together."
        test_recipe:
