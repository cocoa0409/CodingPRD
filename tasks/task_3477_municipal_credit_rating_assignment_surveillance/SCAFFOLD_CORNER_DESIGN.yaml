            - "the rating still has exactly one appeal"

      - name: publish_blocked_while_appeal_pending
        claim_type: Violation → Error
        grounds:
          - errors[ERR_APPEAL_PENDING]
        distinguishing_aspect: "Publish after the 120h window has elapsed is still rejected 409 ERR_APPEAL_PENDING while an appeal sits FILED — window expiry alone does not clear a pending appeal."
        test_recipe:
