          assert: ["err == ERR_FLIGHT_NOT_STARTED", "LineItem.${li_id}.status == TRAFFICKED"]

      - name: credit_ceiling_exact_ok_over_rejected
        claim_type: violation_to_error
        grounds: ["validations[priority=24]", calculations.verification_assessment, "errors[ERR_CREDIT_EXCEEDS_BASIS]"]
        distinguishing_aspect: "make_good_max_credit_cents = 1550 (shortfall 1000 + ivt 2100 = 3100 imps @ cpm 500): CREDIT 1550 succeeds, CREDIT 1551 fails; BONUS_IMPRESSIONS bypasses the credit ceiling."
        test_recipe:
          setup: ["LIVE line item; BREACH report (measured 100000, viewable 69000, ivt 2100) filed by va-1"]
          setup_api_calls:
            - { call: "POST /_clock/set_current_utc", payload: { to_iso8601: "2026-08-01T00:00:00Z" }, as: AdOpsManager }
            - { call: "POST /insertion-orders", payload: { advertiser_name: "Acme", total_budget_cents: 100000, flight_start: "2026-08-01", flight_end: "2026-08-31", billing_basis: "LOWER_OF" }, as: AdOpsManager, captures: { io_id: $.data.id } }
            - { call: "POST /line-items", payload: { io_id: "${io_id}", name: "LI1", goal_impressions: 100000, cpm_rate_cents: 500, start_date: "2026-08-01", end_date: "2026-08-31", pacing_mode: "EVEN" }, as: Trafficker, captures: { li_id: $.data.id } }
