          trigger:
            - call: "POST /v1/service-jobs/${job_id}/invoice"
              payload: {}
              as: Dispatcher
              captures: { total_due: $.data.total_due_cents }
          assert:
            - "Invoice for ${job_id}: material_subtotal_cents == 2000"   # only surviving usage Y (2*1000), X voided -> 0
            - "Invoice for ${job_id}: tax_cents == 165"                  # rhu(2000*0.0825)=rhu(165.0)
            - "ServiceJob.${job_id}.total_due_cents == 21065"            # FLAT 10000 + material 2000 + dispatch 8900 + tax 165
