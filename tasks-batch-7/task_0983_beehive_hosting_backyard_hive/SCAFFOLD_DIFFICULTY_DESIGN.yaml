            - { call: "GET /api/invoices", payload: { subscription_id: "${sub}" }, as: PlatformOps, captures: { inv1: "$.data[0].id" } }
            - { call: "POST /api/invoices/${inv1}/pay", payload: {}, as: Host, as_user_id: "${h}" }
            - { call: "POST /api/enrollments", payload: { host_id: "${h}", course_code: "HOST-101" }, as: Host, as_user_id: "${h}", captures: { en: $.data.id } }
            - { call: "POST /api/enrollments/${en}/complete", payload: { quiz_score: 91 }, as: PlatformOps }
            - { call: "POST /api/hives", payload: { site_id: "${site}", agreement_id: "${ag}" }, as: ApiaryManager, as_user_id: "mgr-1", captures: { hv: $.data.id } }
            - { call: "POST /api/inspections", payload: { hive_id: "${hv}", inspected_at: "2026-07-01T00:00:00Z", mites_counted: 0, bees_sampled: 300, disease_flag: false, brood_score: 9, queen_seen: true, stores_kg: 12.0 }, as: Beekeeper, as_user_id: "bk-1", captures: { i1: $.data.id } }
            - { call: "POST /api/inspections/${i1}/submit", payload: {}, as: Beekeeper, as_user_id: "bk-1" }
            - { call: "POST /api/inspections/${i1}/verify", payload: {}, as: ApiaryManager, as_user_id: "mgr-1" }
            - { call: "POST /api/harvests", payload: { hive_id: "${hv}", collected_on: "2026-07-10T00:00:00Z", gross_kg: 10.000, moisture_pct: 19.6 }, as: Beekeeper, as_user_id: "bk-1", captures: { h1: $.data.id } }
            - { call: "POST /api/harvests/${h1}/approve", payload: {}, as: ApiaryManager, as_user_id: "mgr-1" }
            - { call: "POST /api/inspections", payload: { hive_id: "${hv}", inspected_at: "2026-08-01T00:00:00Z", mites_counted: 1, bees_sampled: 300, disease_flag: false, brood_score: 8, queen_seen: true, stores_kg: 11.0 }, as: Beekeeper, as_user_id: "bk-1", captures: { i2: $.data.id } }
            - { call: "POST /api/inspections/${i2}/submit", payload: {}, as: Beekeeper, as_user_id: "bk-1" }
            - { call: "POST /api/inspections/${i2}/verify", payload: {}, as: ApiaryManager, as_user_id: "mgr-1" }
            - { call: "POST /api/harvests", payload: { hive_id: "${hv}", collected_on: "2026-08-10T00:00:00Z", gross_kg: 8.000, moisture_pct: 18.6 }, as: Beekeeper, as_user_id: "bk-1", captures: { h2: $.data.id } }
            - { call: "POST /api/harvests/${h2}/approve", payload: {}, as: ApiaryManager, as_user_id: "mgr-1" }
