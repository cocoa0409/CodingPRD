scaffold_difficulty_design:
  # =====================================================================
  # Rule 1 — dual_variant_calc
  # =====================================================================
  - rule_id: dual_variant_calc
    instances:
      - name: waterfall_provisional_vs_final_modification_terms
        grounds:
          - calculations.waterfall_modified_payment
          - entities.WaterfallEvaluation.fields.offered_pi_cents
          - entities.PermanentModification.fields.final_pi_cents
        distinguishing_aspect: |
          Loan-terms domain: identical program, identical verified income, but the
          provisional variant (evaluation, arrears 1200000 pre-suspense) yields rate
          575bp / P&I 148842 while the final variant (modification creation, arrears
          663474 after trial-suspense application) yields rate 600bp / P&I 148040.
        test_recipe:
          setup:
            - "Fixture A loan: UPB 20000000, rate 600bp, term 240, arrears 1200000, escrow 30000/30000, delinquency 150"
            - "Program STD_MOD rank 1 (target 3100bp, floor 200bp, step 25bp, max term 480, forbearance cap 3000bp, band 61..720)"
            - "Application COMPLETE_PACKAGE (completed 2026-08-05), verified income 483333 (biweekly paystub 200000 + tax return 600000)"
            - "Evaluation at 2026-08-06 -> OFFER (575bp, 240mo, pi 148842); trial plan accepted; 3 on-time payments of 178842"
          setup_api_calls:
            - { call: "POST /borrowers", payload: { full_name: "Alice A", email: "alice.a@x.com" }, as: ServicingAdmin, captures: { b_id: $.data.id } }
            - { call: "POST /loans", payload: { borrower_id: "${b_id}", loan_number: "LN-DV1", property_state_code: "CA", unpaid_principal_balance_cents: 20000000, interest_rate_bp: 600, remaining_term_months: 240, arrears_cents: 1200000, escrow_balance_cents: 30000, escrow_monthly_cents: 30000, delinquency_days: 150 }, as: ServicingAdmin, captures: { loan_id: $.data.id, loan_v: $.data.version } }
            - { call: "POST /program-options", payload: { code: "STD_MOD", waterfall_rank: 1, target_dti_bp: 3100, rate_floor_bp: 200, rate_step_bp: 25, max_term_months: 480, max_forbearance_pct_bp: 3000, min_delinquency_days: 61, max_delinquency_days: 720 }, as: ServicingAdmin }
            - { call: "POST /loans/${loan_id}/applications", payload: { expected_loan_version: "${loan_v}", hardship_type: "INCOME_REDUCTION", stated_monthly_income_cents: 480000 }, as: Borrower, as_user_id: "${b_id}", captures: { app_id: $.data.id } }
            - { call: "POST /applications/${app_id}/acknowledge", as: LossMitAgent }
            - { call: "POST /applications/${app_id}/documents", payload: { doc_type: "PAYSTUB", gross_per_period_cents: 200000, pay_frequency: "BIWEEKLY", pay_period_end_date: "2026-07-31" }, as: Borrower, as_user_id: "${b_id}", captures: { d_pay: $.data.id } }
            - { call: "POST /applications/${app_id}/documents", payload: { doc_type: "TAX_RETURN", annual_gross_cents: 600000 }, as: Borrower, as_user_id: "${b_id}", captures: { d_tax: $.data.id } }
            - { call: "POST /applications/${app_id}/documents", payload: { doc_type: "HARDSHIP_AFFIDAVIT" }, as: Borrower, as_user_id: "${b_id}", captures: { d_aff: $.data.id } }
            - { call: "POST /applications/${app_id}/documents", payload: { doc_type: "BANK_STATEMENT" }, as: Borrower, as_user_id: "${b_id}", captures: { d_bank: $.data.id } }
            - { call: "POST /documents/${d_pay}/accept", as: LossMitAgent }
            - { call: "POST /documents/${d_tax}/accept", as: LossMitAgent }
            - { call: "POST /documents/${d_aff}/accept", as: LossMitAgent }
            - { call: "POST /_clock/set_current_utc", payload: { to_iso8601: "2026-08-05T00:00:00Z" }, as: ServicingAdmin }
            - { call: "POST /documents/${d_bank}/accept", as: LossMitAgent }
            - { call: "POST /_clock/set_current_utc", payload: { to_iso8601: "2026-08-06T00:00:00Z" }, as: ServicingAdmin }
            - { call: "GET /applications/${app_id}", as: Underwriter, captures: { app_v: $.data.version } }
            - { call: "POST /applications/${app_id}/evaluations", payload: { expected_application_version: "${app_v}" }, as: Underwriter, as_user_id: "uw_1", captures: { ev_id: $.data.id, ev_pi: $.data.offered_pi_cents, ev_rate: $.data.offered_rate_bp } }
            - { call: "GET /trial-plans?application_id=${app_id}", as: Underwriter, captures: { plan_id: "$.data[0].id" } }
            - { call: "POST /trial-plans/${plan_id}/accept", as: Borrower, as_user_id: "${b_id}" }
            - { call: "GET /trial-plans/${plan_id}/payments", as: ServicingOps, captures: { p1: "$.data[0].id", p2: "$.data[1].id", p3: "$.data[2].id" } }
            - { call: "POST /_clock/set_current_utc", payload: { to_iso8601: "2026-09-05T00:00:00Z" }, as: ServicingAdmin }
            - { call: "POST /trial-payments/${p1}/pay", payload: { amount_cents: 178842 }, as: Borrower, as_user_id: "${b_id}" }
            - { call: "POST /_clock/set_current_utc", payload: { to_iso8601: "2026-10-05T00:00:00Z" }, as: ServicingAdmin }
            - { call: "POST /trial-payments/${p2}/pay", payload: { amount_cents: 178842 }, as: Borrower, as_user_id: "${b_id}" }
            - { call: "POST /_clock/set_current_utc", payload: { to_iso8601: "2026-11-04T00:00:00Z" }, as: ServicingAdmin }
            - { call: "POST /trial-payments/${p3}/pay", payload: { amount_cents: 178842 }, as: Borrower, as_user_id: "${b_id}" }
          trigger:
            - { call: "POST /loans/${loan_id}/modifications", payload: { trial_plan_id: "${plan_id}" }, as: ServicingOps, captures: { mod_id: $.data.id, mod_pi: $.data.final_pi_cents, mod_rate: $.data.final_rate_bp } }
          assert:
            - "WaterfallEvaluation.${ev_id}.offered_pi_cents == 148842 and offered_rate_bp == 575 (provisional variant, base 21200000)"
            - "PermanentModification.${mod_id}.final_pi_cents == 148040 and final_rate_bp == 600 (final variant, base 20663474 after suspense application)"
            - "${mod_pi} != ${ev_pi} (same program and income, different bases)"
            - "PermanentModification.${mod_id}.final_base_cents == 20663474 and capitalized_arrears_cents == 663474"

      - name: escrow_standard_vs_postmod_shortage_spread
        grounds:
          - calculations.escrow_reanalysis
          - entities.EscrowAnalysis.fields.monthly_spread_cents
        distinguishing_aspect: |
          Escrow-account domain (distinct from the loan-terms domain of the sibling
          instance): identical balance 30000 and disbursements 420000 (shortage 40000),
          but standard_annual spreads over 12 months (spread 3333, monthly 38333)
          while post_modification spreads over 6 months (spread 6667, monthly 41667).
        test_recipe:
          setup:
            - "Two loans with identical escrow posture: balance 30000, escrow_monthly 30000"
          setup_api_calls:
            - { call: "POST /borrowers", payload: { full_name: "Bob B", email: "bob.b@x.com" }, as: ServicingAdmin, captures: { b_id: $.data.id } }
            - { call: "POST /loans", payload: { borrower_id: "${b_id}", loan_number: "LN-DV2A", property_state_code: "CA", unpaid_principal_balance_cents: 20000000, interest_rate_bp: 600, remaining_term_months: 240, escrow_balance_cents: 30000, escrow_monthly_cents: 30000, delinquency_days: 0 }, as: ServicingAdmin, captures: { loan_a: $.data.id } }
            - { call: "POST /loans", payload: { borrower_id: "${b_id}", loan_number: "LN-DV2B", property_state_code: "CA", unpaid_principal_balance_cents: 20000000, interest_rate_bp: 600, remaining_term_months: 240, escrow_balance_cents: 30000, escrow_monthly_cents: 30000, delinquency_days: 0 }, as: ServicingAdmin, captures: { loan_b: $.data.id } }
          trigger:
            - { call: "POST /loans/${loan_a}/escrow-analyses", payload: { analysis_type: "STANDARD_ANNUAL", comp_year_start_month: "2026-08", comp_year_months: 12, projected_annual_disbursements_cents: 420000 }, as: ServicingOps, captures: { an_std: $.data.id } }
            - { call: "POST /loans/${loan_b}/escrow-analyses", payload: { analysis_type: "POST_MODIFICATION", comp_year_start_month: "2026-08", comp_year_months: 6, projected_annual_disbursements_cents: 420000 }, as: ServicingOps, captures: { an_pm: $.data.id } }
          assert:
            - "EscrowAnalysis.${an_std}: shortage_cents == 40000, monthly_spread_cents == 3333, new_monthly_escrow_cents == 38333"
            - "EscrowAnalysis.${an_pm}: shortage_cents == 40000, monthly_spread_cents == 6667, new_monthly_escrow_cents == 41667"
            - "monthly_spread differs across variants for identical inputs (3333 != 6667)"

  # =====================================================================
  # Rule 2 — combinatorial_formula
  # =====================================================================
  - rule_id: combinatorial_formula
    instances:
      - name: waterfall_rate_term_forbearance_branch_stack
        grounds:
          - calculations.waterfall_modified_payment
          - calculations.target_affordable_payment
        distinguishing_aspect: |
          Mode (a) non-linear multi-input interaction: all three waterfall branches
          engage in sequence (rate floor 200bp binds, term jumps 240->480, forbearance
          min(cap, needed) solves 2977697), yielding P&I exactly 100000 on a 36000000
          base — no single-input rule reproduces this path.
        test_recipe:
          setup:
            - "Fixture B loan: UPB 30000000, arrears 6000000, rate 600bp, term 240, delinquency 150"
            - "Program STD_MOD rank 1; verified income 322581 (monthly paystub) -> target 100000"
          setup_api_calls:
            - { call: "POST /borrowers", payload: { full_name: "Carol C", email: "carol.c@x.com" }, as: ServicingAdmin, captures: { b_id: $.data.id } }
            - { call: "POST /loans", payload: { borrower_id: "${b_id}", loan_number: "LN-CF1", property_state_code: "TX", unpaid_principal_balance_cents: 30000000, interest_rate_bp: 600, remaining_term_months: 240, arrears_cents: 6000000, escrow_balance_cents: 0, escrow_monthly_cents: 0, delinquency_days: 150 }, as: ServicingAdmin, captures: { loan_id: $.data.id, loan_v: $.data.version } }
            - { call: "POST /program-options", payload: { code: "STD_MOD", waterfall_rank: 1, target_dti_bp: 3100, rate_floor_bp: 200, rate_step_bp: 25, max_term_months: 480, max_forbearance_pct_bp: 3000, min_delinquency_days: 61, max_delinquency_days: 720 }, as: ServicingAdmin, captures: { prog_id: $.data.id } }
            - { call: "POST /loans/${loan_id}/applications", payload: { expected_loan_version: "${loan_v}", hardship_type: "UNEMPLOYMENT", stated_monthly_income_cents: 322581 }, as: Borrower, as_user_id: "${b_id}", captures: { app_id: $.data.id } }
            - { call: "POST /applications/${app_id}/acknowledge", as: LossMitAgent }
            - { call: "POST /applications/${app_id}/documents", payload: { doc_type: "PAYSTUB", gross_per_period_cents: 322581, pay_frequency: "MONTHLY", pay_period_end_date: "2026-07-31" }, as: Borrower, as_user_id: "${b_id}", captures: { d_pay: $.data.id } }
            - { call: "POST /applications/${app_id}/documents", payload: { doc_type: "HARDSHIP_AFFIDAVIT" }, as: Borrower, as_user_id: "${b_id}", captures: { d_aff: $.data.id } }
            - { call: "POST /applications/${app_id}/documents", payload: { doc_type: "BANK_STATEMENT" }, as: Borrower, as_user_id: "${b_id}", captures: { d_bank: $.data.id } }
            - { call: "POST /documents/${d_pay}/accept", as: LossMitAgent }
            - { call: "POST /documents/${d_aff}/accept", as: LossMitAgent }
            - { call: "POST /documents/${d_bank}/accept", as: LossMitAgent }
          trigger:
            - { call: "GET /applications/${app_id}", as: Underwriter, captures: { app_v: $.data.version } }
            - { call: "POST /applications/${app_id}/evaluations", payload: { expected_application_version: "${app_v}" }, as: Underwriter, as_user_id: "uw_1", captures: { ev_id: $.data.id } }
          assert:
            - "WaterfallEvaluation.${ev_id}.result == OFFER"
            - "offered_rate_bp == 200 (step 1 floor binds), offered_term_months == 480 (step 2 fires), offered_forbearance_cents == 2977697 (step 3 min(cap 10800000, needed) = needed)"
            - "offered_pi_cents == 100000 == target_payment_cents and eval_base_cents == 36000000"
            - "GET /evaluations/${ev_id}/steps -> exactly 1 step: program_code STD_MOD, eligible true, achieved_pi_cents 100000, met_target true, selected true"

      - name: escrow_spread_per_month_rounding_last_month_remainder
        grounds:
          - calculations.escrow_reanalysis
          - entities.EscrowAnalysis.fields.spread_last_month_cents
        distinguishing_aspect: |
          Mode (b) nested rounding order: shortage 40000 over 12 months rounds each
          month half-up first (3333) and reconciles the remainder in the LAST month
          (40000 - 3333*11 = 3337); the alternative sum-then-round order (3333 x 12 =
          39996) loses 4 cents and is rejected.
        test_recipe:
          setup:
            - "Loan with escrow balance 30000; standard annual analysis, disbursements 420000"
          setup_api_calls:
            - { call: "POST /borrowers", payload: { full_name: "Dave D", email: "dave.d@x.com" }, as: ServicingAdmin, captures: { b_id: $.data.id } }
            - { call: "POST /loans", payload: { borrower_id: "${b_id}", loan_number: "LN-CF2", property_state_code: "WA", unpaid_principal_balance_cents: 20000000, interest_rate_bp: 600, remaining_term_months: 240, escrow_balance_cents: 30000, escrow_monthly_cents: 30000, delinquency_days: 0 }, as: ServicingAdmin, captures: { loan_id: $.data.id } }
          trigger:
            - { call: "POST /loans/${loan_id}/escrow-analyses", payload: { analysis_type: "STANDARD_ANNUAL", comp_year_start_month: "2026-08", comp_year_months: 12, projected_annual_disbursements_cents: 420000 }, as: ServicingOps, captures: { an_id: $.data.id } }
          assert:
            - "EscrowAnalysis.${an_id}.cushion_cents == 70000 (420000 * 2/12)"
            - "monthly_spread_cents == 3333 and spread_last_month_cents == 3337"
            - "3333 * 11 + 3337 == 40000 == shortage_cents (sum preserved; remainder in last month, not first)"
            - "new_monthly_escrow_cents == 38333 (base 35000 + spread 3333)"

  # =====================================================================
  # Rule 3 — non_linear_state_machine
  # =====================================================================
  - rule_id: non_linear_state_machine
    instances:
      - name: application_completeness_reopen_cycle
        grounds:
          - state_machines.LossMitApplication.COMPLETE_PACKAGE_to_ACKNOWLEDGED
          - state_machines.PackageDocument.ACCEPTED_to_SUPERSEDED
        distinguishing_aspect: |
          Cyclic machine on LossMitApplication: ACKNOWLEDGED -> COMPLETE_PACKAGE ->
          ACKNOWLEDGED (supersession re-opens) -> COMPLETE_PACKAGE, with completed_at
          anchored to the FIRST completion (2026-08-05) across the whole loop.
        test_recipe:
          setup:
            - "Fixture A loan/application COMPLETE_PACKAGE (completed_at 2026-08-05T00:00:00Z), verified income 483333"
          setup_api_calls:
            - { call: "POST /borrowers", payload: { full_name: "Erin E", email: "erin.e@x.com" }, as: ServicingAdmin, captures: { b_id: $.data.id } }
            - { call: "POST /loans", payload: { borrower_id: "${b_id}", loan_number: "LN-NL1", property_state_code: "CA", unpaid_principal_balance_cents: 20000000, interest_rate_bp: 600, remaining_term_months: 240, arrears_cents: 1200000, escrow_balance_cents: 30000, escrow_monthly_cents: 30000, delinquency_days: 150 }, as: ServicingAdmin, captures: { loan_id: $.data.id, loan_v: $.data.version } }
            - { call: "POST /loans/${loan_id}/applications", payload: { expected_loan_version: "${loan_v}", hardship_type: "INCOME_REDUCTION", stated_monthly_income_cents: 480000 }, as: Borrower, as_user_id: "${b_id}", captures: { app_id: $.data.id } }
            - { call: "POST /applications/${app_id}/acknowledge", as: LossMitAgent }
            - { call: "POST /applications/${app_id}/documents", payload: { doc_type: "PAYSTUB", gross_per_period_cents: 200000, pay_frequency: "BIWEEKLY", pay_period_end_date: "2026-07-31" }, as: Borrower, as_user_id: "${b_id}", captures: { d_pay: $.data.id } }
            - { call: "POST /applications/${app_id}/documents", payload: { doc_type: "TAX_RETURN", annual_gross_cents: 600000 }, as: Borrower, as_user_id: "${b_id}", captures: { d_tax: $.data.id } }
            - { call: "POST /applications/${app_id}/documents", payload: { doc_type: "HARDSHIP_AFFIDAVIT" }, as: Borrower, as_user_id: "${b_id}", captures: { d_aff: $.data.id } }
            - { call: "POST /applications/${app_id}/documents", payload: { doc_type: "BANK_STATEMENT" }, as: Borrower, as_user_id: "${b_id}", captures: { d_bank: $.data.id } }
            - { call: "POST /documents/${d_pay}/accept", as: LossMitAgent }
            - { call: "POST /documents/${d_tax}/accept", as: LossMitAgent }
            - { call: "POST /documents/${d_aff}/accept", as: LossMitAgent }
            - { call: "POST /_clock/set_current_utc", payload: { to_iso8601: "2026-08-05T00:00:00Z" }, as: ServicingAdmin }
            - { call: "POST /documents/${d_bank}/accept", as: LossMitAgent }
          trigger:
            - { call: "POST /applications/${app_id}/documents", payload: { doc_type: "PAYSTUB", gross_per_period_cents: 210000, pay_frequency: "BIWEEKLY", pay_period_end_date: "2026-08-07" }, as: Borrower, as_user_id: "${b_id}", captures: { d_pay2: $.data.id } }
            - { call: "GET /applications/${app_id}", as: LossMitAgent, captures: { mid_status: $.data.status, mid_income: $.data.verified_monthly_income_cents, mid_completed: $.data.completed_at } }
            - { call: "POST /documents/${d_pay2}/accept", as: LossMitAgent }
          assert:
            - "After supersession: status == ACKNOWLEDGED (cycle re-opened), outstanding_doc_categories == [INCOME_PROOF]"
            - "verified_monthly_income_cents == 50000 (only the tax return remains; superseded paystub excluded)"
            - "completed_at == 2026-08-05T00:00:00Z (first-completion anchor retained through the cycle)"
            - "After accepting the new paystub: status == COMPLETE_PACKAGE again and verified_monthly_income_cents == 505000 (455000 + 50000)"

      - name: loan_parallel_workout_foreclosure_dimensions
        grounds:
          - state_machines.Loan
          - entities.Loan.fields.workout_status
          - entities.Loan.fields.foreclosure_status
        distinguishing_aspect: |
          Parallel state dimensions on ONE entity: a loss-mitigation application flips
          workout_status DELINQUENT -> LOSS_MIT_REVIEW while foreclosure_status stays
          SALE_SCHEDULED — the dimensions evolve independently (subject only to the
          dual-tracking gates).
        test_recipe:
          setup:
            - "Loan delinquency 150; foreclosure case REFERRED then SALE_SCHEDULED (sale 2026-12-01) BEFORE any application exists"
          setup_api_calls:
            - { call: "POST /borrowers", payload: { full_name: "Frank F", email: "frank.f@x.com" }, as: ServicingAdmin, captures: { b_id: $.data.id } }
            - { call: "POST /loans", payload: { borrower_id: "${b_id}", loan_number: "LN-NL2", property_state_code: "FL", unpaid_principal_balance_cents: 20000000, interest_rate_bp: 600, remaining_term_months: 240, arrears_cents: 1200000, escrow_balance_cents: 30000, escrow_monthly_cents: 30000, delinquency_days: 150 }, as: ServicingAdmin, captures: { loan_id: $.data.id, loan_v: $.data.version } }
            - { call: "POST /loans/${loan_id}/foreclosure-cases", payload: { county: "Miami-Dade", docket_number: "FC-100" }, as: ForeclosureCounsel, captures: { fc_id: $.data.id } }
            - { call: "POST /foreclosure-cases/${fc_id}/schedule-sale", payload: { sale_date: "2026-12-01" }, as: ForeclosureCounsel }
          trigger:
            - { call: "POST /loans/${loan_id}/applications", payload: { expected_loan_version: "${loan_v}", hardship_type: "MEDICAL", stated_monthly_income_cents: 400000 }, as: Borrower, as_user_id: "${b_id}", captures: { app_id: $.data.id } }
          assert:
            - "Loan.${loan_id}.workout_status == LOSS_MIT_REVIEW (application dimension moved)"
            - "Loan.${loan_id}.foreclosure_status == SALE_SCHEDULED (foreclosure dimension untouched)"
            - "ForeclosureCase.${fc_id}.status == SALE_SCHEDULED"

      - name: foreclosure_sale_hold_reschedule_cycle
        grounds:
          - state_machines.ForeclosureCase.SALE_SCHEDULED_to_SALE_HOLD
          - state_machines.ForeclosureCase.SALE_HOLD_to_SALE_SCHEDULED
        distinguishing_aspect: |
          Cyclic machine on ForeclosureCase (distinct entity from the sibling
          application cycle): SALE_SCHEDULED -> SALE_HOLD (appeal overturn) ->
          SALE_SCHEDULED (re-schedule after the re-denial appeal window lapses).
        test_recipe:
          setup:
            - "Loan delinquency 150, fixture C economics (UPB 30000000, arrears 6000000, income 100000 -> denial)"
            - "Case referred 2026-08-01, sale scheduled 2026-12-01 before the application completes"
            - "Application completes 2026-08-05, DENIAL issued 2026-08-10, appeal 2026-08-12, overturn 2026-08-14"
          setup_api_calls:
            - { call: "POST /borrowers", payload: { full_name: "Gail G", email: "gail.g@x.com" }, as: ServicingAdmin, captures: { b_id: $.data.id } }
            - { call: "POST /loans", payload: { borrower_id: "${b_id}", loan_number: "LN-NL3", property_state_code: "OH", unpaid_principal_balance_cents: 30000000, interest_rate_bp: 600, remaining_term_months: 240, arrears_cents: 6000000, escrow_balance_cents: 0, escrow_monthly_cents: 0, delinquency_days: 150 }, as: ServicingAdmin, captures: { loan_id: $.data.id, loan_v: $.data.version } }
            - { call: "POST /program-options", payload: { code: "STD_MOD", waterfall_rank: 1, target_dti_bp: 3100, rate_floor_bp: 200, rate_step_bp: 25, max_term_months: 480, max_forbearance_pct_bp: 3000, min_delinquency_days: 61, max_delinquency_days: 720 }, as: ServicingAdmin }
            - { call: "POST /loans/${loan_id}/foreclosure-cases", payload: { county: "Cuyahoga", docket_number: "FC-200" }, as: ForeclosureCounsel, captures: { fc_id: $.data.id } }
            - { call: "POST /foreclosure-cases/${fc_id}/schedule-sale", payload: { sale_date: "2026-12-01" }, as: ForeclosureCounsel }
            - { call: "POST /loans/${loan_id}/applications", payload: { expected_loan_version: "${loan_v}", hardship_type: "UNEMPLOYMENT", stated_monthly_income_cents: 100000 }, as: Borrower, as_user_id: "${b_id}", captures: { app_id: $.data.id } }
            - { call: "POST /applications/${app_id}/acknowledge", as: LossMitAgent }
            - { call: "POST /applications/${app_id}/documents", payload: { doc_type: "PAYSTUB", gross_per_period_cents: 100000, pay_frequency: "MONTHLY", pay_period_end_date: "2026-07-31" }, as: Borrower, as_user_id: "${b_id}", captures: { d_pay: $.data.id } }
            - { call: "POST /applications/${app_id}/documents", payload: { doc_type: "HARDSHIP_AFFIDAVIT" }, as: Borrower, as_user_id: "${b_id}", captures: { d_aff: $.data.id } }
            - { call: "POST /applications/${app_id}/documents", payload: { doc_type: "BANK_STATEMENT" }, as: Borrower, as_user_id: "${b_id}", captures: { d_bank: $.data.id } }
            - { call: "POST /documents/${d_pay}/accept", as: LossMitAgent }
            - { call: "POST /documents/${d_aff}/accept", as: LossMitAgent }
            - { call: "POST /_clock/set_current_utc", payload: { to_iso8601: "2026-08-05T00:00:00Z" }, as: ServicingAdmin }
            - { call: "POST /documents/${d_bank}/accept", as: LossMitAgent }
            - { call: "POST /_clock/set_current_utc", payload: { to_iso8601: "2026-08-10T00:00:00Z" }, as: ServicingAdmin }
            - { call: "GET /applications/${app_id}", as: Underwriter, captures: { app_v: $.data.version } }
