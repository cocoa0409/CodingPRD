- rule_id: priority_pair_validation_conflict
  instances:
  - name: item_not_orderable_state_check_outranks_insufficient_availability_check
    grounds:
    - validations[priority=21]
    - validations[priority=38]
    - errors[ERR_ITEM_NOT_ORDERABLE]
    - errors[ERR_INSUFFICIENT_AVAILABILITY]
    - endpoints[POST /dropship/orders]
    distinguishing_aspect: Pairs a state-category rule (priority 21) against a business_fiscal-category rule (priority
      38) on the same POST /dropship/orders call, 17 priority steps apart. Both are violated by the same payload
      - the offer is SUPPRESSED and the requested 10 units exceed the 0 available - and the state check must win.
    test_recipe:
      setup:
      - Vendor V1 is ACTIVE, COMMISSION at 1500 bps, cadence 60 minutes, safety buffer 5.
      - Offer I1 is created and activated, then receives a feed of 8 on-hand at 2026-08-03T09:00:00Z, which yields
        available_units 3 while the offer is still ACTIVE.
      - At 2026-08-03T09:30:00Z the merchandiser suppresses I1 manually, so status is SUPPRESSED, suppression_reason
        is MANUAL and available_units is forced to 0.
      - The feed is only 30 minutes old against a staleness limit of 60 * 3 = 180 minutes, so inventory_is_stale
        is false and the priority-37 staleness rule cannot fire.
      - A single order line asking for 10 units therefore violates priority 21 (offer not orderable) and priority
        38 (10 > 0 available) at once.
      setup_api_calls:
      - call: POST /dropship/_clock/set_current_utc
        payload:
          current_utc: '2026-08-01T00:00:00Z'
        as: PlatformAdmin
      - call: POST /dropship/vendors
