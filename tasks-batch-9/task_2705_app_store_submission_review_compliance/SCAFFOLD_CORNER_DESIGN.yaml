            - "AppRecord.${app2_id}.feature_compliance_index == 0.00"
            - "AppRecord.${app2_id}.compliance_posture == RESTRICTED"
            - "AppRecord.${app_id}.feature_compliance_index == 100.00"
            - "AppRecord.${app_id}.compliance_posture == OPEN"

      - name: provisioning_profile_self_referential_linked_cert_edge_is_queryable
        claim_type: graph
        grounds:
          - entities.SigningCredential.fields.linked_cert_id
          - endpoints.GET_/signing-credentials
        distinguishing_aspect: "linked_cert_id is a self-FK on SigningCredential; GET /signing-credentials?linked_cert_id=${cert_id} returns exactly the PROVISIONING_PROFILE row and the DISTRIBUTION_CERT itself has linked_cert_id null, so the edge is directed and acyclic."
        test_recipe:
          setup:
            - "Logical clock at 2026-08-01T00:00:00Z. Northwind account with an ACTIVE DISTRIBUTION_CERT and an ACTIVE PROVISIONING_PROFILE whose linked_cert_id is that cert."
          setup_api_calls:
            - *c_clock
