# =============================================================================
# SCAFFOLD.yaml — task_1103_corporate_investigations_employee
# Corporate Investigations & Employee Misconduct (in-house investigations team)
# Sections §1.0–§1.7. Difficulty design (§1.8) and corner design (§1.9) live in
# sibling files SCAFFOLD_DIFFICULTY_DESIGN.yaml / SCAFFOLD_CORNER_DESIGN.yaml.
# =============================================================================

scenario: |
  generate task hard than expert level! 1103. Corporate Investigations & Employee Misconduct (in-house investigations team): allegation intake & investigation plan approval, document/device preservation & collection scope, witness interview scheduling & Upjohn warnings, privilege designation & report distribution control, findings & disciplinary recommendation calibration, regulatory self-disclosure decision, remediation action tracking, pattern analysis across cases

domain_name: corporate-investigations
api_prefix: /api

# =============================================================================
# Step 0: Complexity Profile
# =============================================================================
complexity_profile:
  primary_archetype: compliance_audit        # mandatory cooling-off, segregation of duties, tamper-evident status trail
  secondary_archetype: workflow_orchestration # intake -> plan -> fieldwork -> findings -> disposition -> remediation pipeline with branching/rework
  complexity_layers:
    - optimistic_concurrency                  # OCC on Case.version for create-with-supersede writes
    - cascading_side_effects                  # reopen cascade depth 3; notice-release cascade depth 2
    - dual_variant_calculation                # provisional-vs-final substantiation; matrix-vs-calibrated discipline
    - derived_field_reconciliation            # case counters/ratios recomputed on every child mutation
  entity_topology: graph                      # cases at center; subjects/allegations/evidence cross-linked; findings reference evidence arrays; pattern alerts span cases
  state_machine_shape: cyclic                 # plan rejection loop, interview no-show loop, finding challenge loop, remediation reject-verify loop, case reopen loop
  relationship_patterns:
    - one_to_many                             # Case -> Allegation/Plan/Subject/Notice/Scope/Interview/Finding/Report/Disclosure/Remediation
    - many_to_many                            # Finding <-> EvidenceItem via Finding.evidence_item_ids
    - polymorphic                             # PrivilegeDesignation.target_id -> EvidenceItem | WitnessInterview | CaseReport
    - cross_aggregate                         # PatternAlert.case_ids spans cases; DisciplinaryRecommendation.prior_history_count reads other cases' findings
  role_model: segregation_of_duties           # drafter != approver; proposer != approver; owner != verifier; decider != overrider
  consistency_model: immediate                # all side effects + derived recomputes atomically visible in the same response

# =============================================================================
# §1.0 Response Envelope (FIXED — verbatim)
# =============================================================================
response_envelope:
  success: |
    { "meta": { "api_request_id": "req_xxx", "api_request_timestamp": "ISO8601" },
      "response_type": "object" | "array", "data": {} }
  error: |
    { "meta": { ... }, "response_type": "error",
      "data": { "error_id": "ERR_XXX", "message": "..." } }
  pagination_fields: ["limit", "offset", "total_count", "has_more"]
  pagination_defaults: { limit: 10, min: 1, max: 100, offset: 0 }

# =============================================================================
# §1.1 Entity-Relationship Table
# =============================================================================
entities:
  - name: Case
    parent: null
    common_fields: true
    fields:
      - { name: title, type: string, source: input, description: "Short case title" }
      - { name: description, type: string, source: input, required: false, description: "Optional narrative summary" }
      - { name: allegation_category, type: enum, source: input, description: "FRAUD | HARASSMENT | CONFLICT_OF_INTEREST | DATA_BREACH | BRIBERY | POLICY_VIOLATION" }
      - { name: severity, type: enum, source: input, description: "LOW | MEDIUM | HIGH | CRITICAL; provisional at create, confirmed at triage" }
      - { name: department, type: string, source: input, required: false, description: "Org unit where alleged misconduct occurred; required by triage" }
      - { name: lead_investigator_id, type: string, source: input, description: "Opaque X-User-ID of the assigned lead investigator; SOD anchor for finding finalization" }
      - { name: case_number, type: string, source: computed, description: "INV-<yyyy>-<zero-padded 4-digit creation sequence>, e.g. INV-2026-0001; sequence ordered by created_at" }
      - { name: status, type: enum, source: system, default: INTAKE, description: "INTAKE | TRIAGED | PLANNING | FIELDWORK | FINDINGS | DISPOSITION | REMEDIATION | CLOSED | DISMISSED" }
      - { name: pattern_escalated, type: boolean, source: computed, default: false, description: "True while any non-dismissed PatternAlert with alert_type=REPEAT_SUBJECT or DEPARTMENT_CLUSTER names this case in case_ids and is in status ACKNOWLEDGED or ESCALATED" }
      - { name: case_priority_score, type: integer, source: computed, description: "Raw priority score per calculations.case_priority_score" }
      - { name: priority_tier, type: enum, source: computed, description: "ROUTINE | ELEVATED | URGENT per calculations.case_priority_score" }
      - { name: preservation_completeness_ratio, type: number, source: computed, default: 1.00, description: "ACKNOWLEDGED notices / (ISSUED + ACKNOWLEDGED notices); RELEASED excluded; empty set => 1.00" }
      - { name: active_privileged_artifact_count, type: integer, source: computed, default: 0, description: "Count of PrivilegeDesignation rows for this case with status in {DESIGNATED, CONFIRMED, CHALLENGED}" }
      - { name: open_remediation_count, type: integer, source: computed, default: 0, description: "Count of RemediationAction rows for this case with status in {OPEN, IN_PROGRESS, AWAITING_VERIFICATION}" }

  - name: Allegation
    parent: Case
    common_fields: true
    fields:
      - { name: case_id, type: string, source: system, description: "FK -> Case.id; owning case" }
      - { name: reporter_channel, type: enum, source: input, description: "HOTLINE | EMAIL | MANAGER_REFERRAL | ANONYMOUS_PORTAL | EXTERNAL" }
      - { name: reporter_ref, type: string, source: input, required: false, description: "Opaque reporter identifier; forbidden when is_anonymous=true" }
      - { name: is_anonymous, type: boolean, source: input, description: "True => reporter_ref must be null" }
      - { name: narrative, type: string, source: input, description: "Free-text allegation narrative" }
      - { name: occurred_at, type: datetime, source: input, required: false, description: "Alleged incident time (ISO8601)" }
      - { name: status, type: enum, source: system, default: SUBMITTED, description: "SUBMITTED | TRIAGED | LINKED | DISMISSED" }

  - name: InvestigationPlan
    parent: Case
    common_fields: true
    fields:
      - { name: case_id, type: string, source: system, description: "FK -> Case.id; owning case" }
      - { name: plan_version, type: integer, source: computed, description: "1 + max(plan_version) over all plans of the case; first plan = 1" }
      - { name: scope_statement, type: string, source: input, description: "Investigation scope and methodology statement" }
      - { name: planned_start, type: datetime, source: input, description: "Planned fieldwork start (ISO8601)" }
      - { name: planned_end, type: datetime, source: input, description: "Planned fieldwork end (ISO8601); must be > planned_start" }
      - { name: drafter_id, type: string, source: system, description: "X-User-ID of the creating Investigator (opaque id); SOD anchor for approval" }
      - { name: status, type: enum, source: system, default: DRAFT, description: "DRAFT | SUBMITTED | APPROVED | REJECTED | SUPERSEDED" }
      - { name: rejection_reason, type: string, source: system, required: false, description: "Recorded when a plan is REJECTED" }
      - { name: approved_by, type: string, source: system, required: false, description: "X-User-ID of approving InvestigationsManager" }

  - name: CaseSubject
    parent: Case
    common_fields: true
    fields:
      - { name: case_id, type: string, source: system, description: "FK -> Case.id; owning case" }
      - { name: employee_ref, type: string, source: input, description: "HR employee identifier (opaque string); pattern analysis key across cases" }
      - { name: role_in_case, type: enum, source: input, description: "PRIMARY | ACCESSORY | PERSON_OF_INTEREST" }
      - { name: status, type: enum, source: system, default: ACTIVE, description: "ACTIVE | CLEARED | SEPARATED" }

  - name: PreservationNotice
    parent: Case
    common_fields: true
    fields:
      - { name: case_id, type: string, source: system, description: "FK -> Case.id; owning case" }
      - { name: custodian_ref, type: string, source: input, description: "Employee identifier of the data custodian" }
      - { name: scope, type: enum, source: input, description: "EMAIL | DEVICES | CHAT | FILES | ALL_DATA" }
      - { name: is_regulator_ordered, type: boolean, source: input, description: "True = court/regulator-ordered preservation; release blocked until case CLOSED" }
      - { name: issued_at, type: datetime, source: system, description: "Set to current logical clock at creation (created ISSUED)" }
      - { name: acknowledged_at, type: datetime, source: system, required: false, description: "Set to current logical clock on ISSUED->ACKNOWLEDGED" }
      - { name: status, type: enum, source: system, default: ISSUED, description: "ISSUED | ACKNOWLEDGED | RELEASED" }

  - name: CollectionScope
    parent: Case
    common_fields: true
    fields:
      - { name: case_id, type: string, source: system, description: "FK -> Case.id; owning case" }
      - { name: preservation_notice_id, type: string, source: input, required: false, description: "FK -> PreservationNotice.id; the notice covering this custodian, when supplied" }
      - { name: custodian_ref, type: string, source: input, description: "Employee identifier whose data is collected" }
      - { name: data_source, type: enum, source: input, description: "EMAIL | DEVICE | CHAT | FILES" }
      - { name: planned_start, type: datetime, source: input, description: "Collection window start (ISO8601)" }
      - { name: planned_end, type: datetime, source: input, description: "Collection window end (ISO8601); CLOSED-interval semantics: must be >= planned_start" }
      - { name: collected_item_count, type: integer, source: computed, default: 0, description: "Count of linked EvidenceItem with status in {LOGGED, UNDER_REVIEW, ADMITTED}" }
      - { name: collected_bytes, type: integer, source: computed, default: 0, description: "Sum of size_bytes over linked EvidenceItem with status in {LOGGED, UNDER_REVIEW, ADMITTED}" }
      - { name: review_effort_minutes, type: integer, source: computed, required: false, description: "Set at IN_PROGRESS->COLLECTED per calculations.evidence_review_effort_minutes" }
      - { name: status, type: enum, source: system, default: PROPOSED, description: "PROPOSED | APPROVED | IN_PROGRESS | COLLECTED | WITHDRAWN" }

  - name: EvidenceItem
    parent: CollectionScope
    common_fields: true
    fields:
      - { name: collection_scope_id, type: string, source: system, description: "FK -> CollectionScope.id; collecting scope" }
      - { name: case_id, type: string, source: system, description: "FK -> Case.id; denormalized owning case (equals scope's case_id)" }
      - { name: custodian_ref, type: string, source: input, description: "Custodian the item was collected from; must equal scope's custodian_ref" }
      - { name: hash_value, type: string, source: input, description: "SHA-256 content hash (chain of custody)" }
      - { name: size_bytes, type: integer, source: input, description: "Item size; must be > 0" }
      - { name: captured_at, type: datetime, source: input, description: "Collection timestamp (ISO8601)" }
      - { name: description, type: string, source: input, required: false, description: "Optional description" }
      - { name: status, type: enum, source: system, default: LOGGED, description: "LOGGED | UNDER_REVIEW | ADMITTED | EXCLUDED" }

  - name: WitnessInterview
    parent: Case
    common_fields: true
    fields:
      - { name: case_id, type: string, source: system, description: "FK -> Case.id; owning case" }
      - { name: witness_ref, type: string, source: input, description: "Employee identifier of the witness (free-form; need not be a CaseSubject)" }
      - { name: interviewer_id, type: string, source: input, description: "Opaque X-User-ID of the assigned interviewer; overlap resource key" }
      - { name: is_subject_interview, type: boolean, source: input, default: false, description: "True when the witness is also a case subject; subject interviews never count toward substantiation W" }
      - { name: scheduled_start, type: datetime, source: input, description: "Interview window start (ISO8601); half-open [start, end) for interviewer overlap" }
      - { name: scheduled_end, type: datetime, source: input, description: "Interview window end (ISO8601); must be > scheduled_start" }
      - { name: room_ref, type: string, source: input, required: false, description: "Physical room identifier; when present, room overlap uses a 15-minute buffer" }
      - { name: upjohn_delivered_at, type: datetime, source: system, required: false, description: "Set to current logical clock on SCHEDULED->UPJOHN_DELIVERED" }
      - { name: completed_at, type: datetime, source: system, required: false, description: "Set to current logical clock on UPJOHN_DELIVERED->COMPLETED" }
      - { name: completion_note, type: string, source: input, required: false, description: "Interview memo; REQUIRED when to_status=COMPLETED" }
      - { name: no_show_count, type: integer, source: computed, default: 0, description: "Increments by 1 on every transition into NO_SHOW" }
      - { name: status, type: enum, source: system, default: SCHEDULED, description: "SCHEDULED | UPJOHN_DELIVERED | COMPLETED | NO_SHOW | CANCELLED" }

  - name: PrivilegeDesignation
    parent: Case
    common_fields: true
    fields:
      - { name: case_id, type: string, source: system, description: "FK -> Case.id; owning case" }
      - { name: target_type, type: enum, source: input, description: "EVIDENCE_ITEM | INTERVIEW | CASE_REPORT" }
      - { name: target_id, type: string, source: input, description: "Polymorphic reference to the designated artifact id (EvidenceItem, WitnessInterview, or CaseReport per target_type); must belong to the same case" }
      - { name: privilege_type, type: enum, source: input, description: "ACP (attorney-client privileged) | WORK_PRODUCT" }
      - { name: rationale, type: string, source: input, required: false, description: "Why privilege attaches" }
      - { name: designated_by, type: string, source: system, description: "X-User-ID of designating GeneralCounsel" }
      - { name: status, type: enum, source: system, default: DESIGNATED, description: "DESIGNATED | CONFIRMED | CHALLENGED | WAIVED" }

  - name: Finding
    parent: Case
    common_fields: true
    fields:
      - { name: case_id, type: string, source: system, description: "FK -> Case.id; owning case" }
      - { name: allegation_id, type: string, source: input, description: "FK -> Allegation.id; must be LINKED and belong to the case" }
      - { name: subject_id, type: string, source: input, description: "FK -> CaseSubject.id; must belong to the case" }
      - { name: evidence_item_ids, type: array, source: input, required: false, default: [], description: "Element ids reference EvidenceItem.id; each must belong to the case and be in status UNDER_REVIEW or ADMITTED at link time" }
      - { name: consistency_level, type: enum, source: input, required: false, description: "LOW | MEDIUM | HIGH; supplied at calibrate; create-time provisional assumes MEDIUM" }
      - { name: subject_admission, type: boolean, source: input, required: false, default: false, description: "Whether the subject admitted the conduct; supplied at calibrate" }
      - { name: finding_type, type: enum, source: input, required: false, description: "SUBSTANTIATED | UNSUBSTANTIATED | INCONCLUSIVE; supplied at calibrate" }
      - { name: substantiation_score_provisional, type: number, source: computed, description: "calculations.substantiation_score, provisional variant, computed at creation" }
      - { name: substantiation_score_final, type: number, source: computed, required: false, description: "calculations.substantiation_score, final variant, computed at DRAFT->CALIBRATED" }
      - { name: status, type: enum, source: system, default: DRAFT, description: "DRAFT | CALIBRATED | FINAL | CHALLENGED" }

  - name: DisciplinaryRecommendation
    parent: Finding
    common_fields: true
    fields:
      - { name: finding_id, type: string, source: system, description: "FK -> Finding.id; parent finding" }
      - { name: proposed_by, type: string, source: system, description: "X-User-ID of proposing HRBusinessPartner; SOD anchor for approval" }
      - { name: severity_assessment, type: enum, source: system, description: "Snapshot of the parent Case.severity at proposal time: LOW | MEDIUM | HIGH | CRITICAL" }
      - { name: prior_history_count, type: integer, source: computed, description: "Count of FINAL SUBSTANTIATED findings on OTHER cases whose subject employee_ref equals this finding's subject employee_ref, with created_at strictly before this finding's created_at" }
      - { name: mitigation_count, type: integer, source: input, description: "Count of mitigation factors 0..2 (values >2 are clamped to 2)" }
      - { name: aggravation_count, type: integer, source: input, description: "Count of aggravation factors 0..2 (values >2 are clamped to 2)" }
      - { name: index_policy_matrix, type: integer, source: computed, description: "calculations.discipline_severity_index, POLICY_MATRIX variant (ignores mitigation/aggravation)" }
      - { name: index_calibrated, type: integer, source: computed, description: "calculations.discipline_severity_index, CALIBRATED variant (applies +/- adjustments)" }
      - { name: suggested_action, type: enum, source: computed, description: "Tier mapped from index_calibrated: COACHING | WARNING | SUSPENSION | TERMINATION" }
      - { name: recommended_action, type: enum, source: input, description: "COACHING | WARNING | SUSPENSION | TERMINATION | NONE; HR's actual proposal (may diverge from suggested_action)" }
      - { name: justification, type: string, source: input, required: false, description: "Required when recommended_action differs from suggested_action" }
      - { name: status, type: enum, source: system, default: PROPOSED, description: "PROPOSED | APPROVED | REJECTED | RECALLED" }

  - name: CaseReport
    parent: Case
    common_fields: true
    fields:
      - { name: case_id, type: string, source: system, description: "FK -> Case.id; owning case" }
      - { name: title, type: string, source: input, description: "Report title" }
      - { name: distribution_tier, type: enum, source: input, description: "RESTRICTED | LEGAL_CONFIDENTIAL | BOARD" }
      - { name: distribution_list, type: array, source: input, description: "Opaque recipient ids; must be non-empty" }
      - { name: report_privilege_type, type: enum, source: input, description: "ACP | WORK_PRODUCT | NONE" }
      - { name: pinned_designation_snapshot, type: array, source: computed, required: false, description: "Version-pinned list of PrivilegeDesignation ids active at DISTRIBUTION_APPROVED; locks the privilege basis of the approved report" }
      - { name: distributed_at, type: datetime, source: system, required: false, description: "Set on DISTRIBUTION_APPROVED->DISTRIBUTED" }
      - { name: status, type: enum, source: system, default: DRAFT, description: "DRAFT | LEGAL_REVIEW | DISTRIBUTION_APPROVED | DISTRIBUTED | RECALLED | SUPERSEDED" }

  - name: SelfDisclosureDecision
    parent: Case
    common_fields: true
    fields:
      - { name: case_id, type: string, source: system, description: "FK -> Case.id; owning case" }
      - { name: regulator, type: enum, source: input, description: "SEC | DOJ | DOL | FINRA | DATA_PROTECTION" }
      - { name: decision_deadline, type: datetime, source: input, description: "Regulatory decision deadline (ISO8601)" }
      - { name: decision, type: enum, source: input, required: false, description: "DISCLOSE | NO_DISCLOSE; required when to_status=DECIDED" }
      - { name: rationale, type: string, source: input, required: false, description: "Decision/override rationale" }
      - { name: decided_by, type: string, source: system, required: false, description: "X-User-ID of deciding ChiefLegalOfficer; SOD anchor for override" }
      - { name: decided_at, type: datetime, source: system, required: false, description: "Set to current logical clock on PENDING->DECIDED; cooling-off anchor" }
      - { name: filed_at, type: datetime, source: system, required: false, description: "Set on DECIDED->FILED" }
      - { name: status, type: enum, source: system, default: PENDING, description: "PENDING | DECIDED | FILED | OVERRIDDEN | SUPERSEDED" }

  - name: RemediationAction
    parent: Case
    common_fields: true
    fields:
      - { name: case_id, type: string, source: system, description: "FK -> Case.id; owning case" }
      - { name: action_type, type: enum, source: input, description: "POLICY_UPDATE | TRAINING | PROCESS_CHANGE | CONTROL_IMPLEMENTATION | MONITORING" }
      - { name: owner_ref, type: string, source: input, description: "Opaque owner identifier; SOD anchor for verification" }
      - { name: description, type: string, source: input, description: "What must be done" }
      - { name: due_date, type: datetime, source: input, description: "Due instant (ISO8601); strict-greater overdue boundary" }
      - { name: is_overdue, type: boolean, source: computed, default: false, description: "current_utc > due_date AND status in {OPEN, IN_PROGRESS, AWAITING_VERIFICATION}" }
      - { name: verified_by, type: string, source: system, required: false, description: "X-User-ID of verifying ComplianceAuditor" }
      - { name: status, type: enum, source: system, default: OPEN, description: "OPEN | IN_PROGRESS | AWAITING_VERIFICATION | VERIFIED | WAIVED" }

  - name: PatternAlert
    parent: null
    common_fields: true
    fields:
      - { name: alert_type, type: enum, source: computed, description: "REPEAT_SUBJECT | CATEGORY_SPIKE | DEPARTMENT_CLUSTER | RETALIATION_RISK" }
      - { name: alert_key, type: string, source: computed, description: "Grouping key: employee_ref for REPEAT_SUBJECT/RETALIATION_RISK; category for CATEGORY_SPIKE; department for DEPARTMENT_CLUSTER" }
      - { name: window_start, type: datetime, source: computed, description: "current_utc minus window_days at scan time" }
      - { name: window_end, type: datetime, source: computed, description: "current_utc at scan time" }
      - { name: case_ids, type: array, source: computed, description: "Element ids reference Case.id; qualifying cases in the window" }
      - { name: pattern_risk_score, type: number, source: computed, description: "calculations.pattern_risk_score" }
      - { name: risk_tier, type: enum, source: computed, description: "LOW | MEDIUM | HIGH per calculations.pattern_risk_score" }
      - { name: status, type: enum, source: system, default: OPEN, description: "OPEN | ACKNOWLEDGED | ESCALATED | DISMISSED" }

# =============================================================================
# §1.2 State Machine Table
# =============================================================================
state_machines:
  - entity: Case
    initial_state: INTAKE
    terminal_states: [DISMISSED]   # CLOSED is reopenable
    transitions:
      - from: INTAKE
        to: TRIAGED
        trigger: "POST /api/cases/{id}/transition {to_status: TRIAGED}"
        actor: IntakeCoordinator
        preconditions:
          - "payload severity present and in {LOW, MEDIUM, HIGH, CRITICAL}"
          - "payload department present (non-empty)"
        side_effects:
          - "Case.severity/department overwritten by payload values"
          - "Every Allegation of this case in SUBMITTED -> TRIAGED"
          - "Case.case_priority_score recomputed (severity term changes)"
      - from: INTAKE
        to: DISMISSED
        trigger: "POST /api/cases/{id}/transition {to_status: DISMISSED}"
        actor: IntakeCoordinator
        preconditions: ["payload rationale present"]
        side_effects: ["Every Allegation of this case in {SUBMITTED, TRIAGED} -> DISMISSED"]
      - from: TRIAGED
        to: DISMISSED
        trigger: "POST /api/cases/{id}/transition {to_status: DISMISSED}"
        actor: IntakeCoordinator
        preconditions: ["payload rationale present"]
        side_effects: ["Every Allegation of this case in {SUBMITTED, TRIAGED} -> DISMISSED"]
      - from: TRIAGED
        to: PLANNING
        trigger: "system: first InvestigationPlan created for the case (POST /api/cases/{id}/plans)"
        actor: system
        preconditions: []
        side_effects: []
      - from: PLANNING
        to: FIELDWORK
        trigger: "system: an InvestigationPlan of this case reaches APPROVED"
        actor: system
        preconditions: []
        side_effects: []
      - from: FIELDWORK
        to: FINDINGS
        trigger: "POST /api/cases/{id}/transition {to_status: FINDINGS}"
        actor: Investigator
        preconditions:
          - "No CollectionScope of this case in {PROPOSED, APPROVED, IN_PROGRESS} (ERR_OPEN_COLLECTION_SCOPES)"
          - "preservation_completeness_ratio == 1.00 (ERR_PRESERVATION_INCOMPLETE)"
        side_effects: []
      - from: FINDINGS
        to: FIELDWORK
        trigger: "POST /api/cases/{id}/transition {to_status: FIELDWORK}"
        actor: InvestigationsManager
        preconditions: []
        side_effects:
          - "Cycle: permits additional evidence collection after findings work began"
      - from: FINDINGS
        to: DISPOSITION
        trigger: "POST /api/cases/{id}/transition {to_status: DISPOSITION}"
        actor: InvestigationsManager
        preconditions:
          - "Every Finding of this case in FINAL (none in DRAFT, CALIBRATED, CHALLENGED) (ERR_FINDINGS_NOT_FINAL)"
        side_effects: []
      - from: DISPOSITION
        to: REMEDIATION
        trigger: "POST /api/cases/{id}/transition {to_status: REMEDIATION}"
        actor: InvestigationsManager
        preconditions:
          - "Every DisciplinaryRecommendation on every Finding of this case in {APPROVED, REJECTED} (none PROPOSED) (ERR_UNRESOLVED_DISCIPLINE)"
          - "If severity == CRITICAL: at least one SelfDisclosureDecision of this case in {DECIDED, FILED, OVERRIDDEN} and none in PENDING (ERR_DISCLOSURE_REQUIRED)"
        side_effects: []
      - from: REMEDIATION
        to: CLOSED
        trigger: "POST /api/cases/{id}/transition {to_status: CLOSED}"
        actor: InvestigationsManager
        preconditions:
          - "Every RemediationAction of this case in {VERIFIED, WAIVED} (ERR_OPEN_REMEDIATION)"
        side_effects: []
      - from: CLOSED
        to: FIELDWORK
        trigger: "POST /api/cases/{id}/transition {to_status: FIELDWORK} (reopen)"
        actor: InvestigationsManager
        preconditions: ["payload rationale present"]
        side_effects:
          - "Cascade hop 1: every Finding of this case in FINAL -> CHALLENGED"
          - "Cascade hop 2 (caused by hop 1): every DisciplinaryRecommendation in APPROVED whose finding just became CHALLENGED -> RECALLED"
          - "Cascade hop 3 (caused by hop 1): every CaseReport of this case in DISTRIBUTED -> RECALLED (its findings basis is challenged)"
          - "Case.derived fields recomputed"

  - entity: Allegation
    initial_state: SUBMITTED
    terminal_states: [DISMISSED]
    transitions:
      - from: SUBMITTED
        to: TRIAGED
        trigger: "system: parent Case INTAKE->TRIAGED; or POST /api/allegations/{id}/transition {to_status: TRIAGED}"
        actor: IntakeCoordinator
        preconditions: []
        side_effects: []
      - from: TRIAGED
        to: LINKED
        trigger: "POST /api/allegations/{id}/transition {to_status: LINKED}"
        actor: IntakeCoordinator
        preconditions: ["parent Case status in {TRIAGED, PLANNING, FIELDWORK, FINDINGS} (ERR_INVALID_STATE)"]
        side_effects: []
      - from: SUBMITTED
        to: DISMISSED
        trigger: "POST /api/allegations/{id}/transition {to_status: DISMISSED}"
        actor: IntakeCoordinator
        preconditions: ["payload rationale present"]
        side_effects: []
      - from: TRIAGED
        to: DISMISSED
        trigger: "POST /api/allegations/{id}/transition {to_status: DISMISSED}"
        actor: IntakeCoordinator
        preconditions: ["payload rationale present"]
        side_effects: []

  - entity: InvestigationPlan
    initial_state: DRAFT
    terminal_states: [APPROVED, SUPERSEDED]
    transitions:
      - from: DRAFT
        to: SUBMITTED
        trigger: "POST /api/plans/{id}/transition {to_status: SUBMITTED}"
        actor: Investigator
        preconditions: ["parent Case status in {PLANNING} (plan creation already moved TRIAGED->PLANNING) (ERR_INVALID_STATE)"]
        side_effects: []
      - from: SUBMITTED
        to: APPROVED
        trigger: "POST /api/plans/{id}/transition {to_status: APPROVED}"
        actor: InvestigationsManager
        preconditions:
          - "SOD: approver X-User-ID != drafter_id (ERR_SOD_PLAN_APPROVAL)"
        side_effects:
          - "approved_by = approver X-User-ID"
          - "parent Case PLANNING -> FIELDWORK"
      - from: SUBMITTED
        to: REJECTED
        trigger: "POST /api/plans/{id}/transition {to_status: REJECTED}"
        actor: InvestigationsManager
        preconditions:
          - "SOD: rejecter X-User-ID != drafter_id (ERR_SOD_PLAN_APPROVAL)"
          - "payload rejection_reason present (ERR_MISSING_REQUIRED_FIELD)"
        side_effects: ["rejection_reason recorded"]
      - from: REJECTED
        to: SUPERSEDED
        trigger: "system: a new InvestigationPlan is created for the same case"
        actor: system
        preconditions: []
        side_effects: []
      - from: DRAFT
        to: SUPERSEDED
        trigger: "system: a new InvestigationPlan is created for the same case"
        actor: system
        preconditions: []
        side_effects: []

  - entity: CaseSubject
    initial_state: ACTIVE
    terminal_states: [CLEARED, SEPARATED]
    transitions:
      - from: ACTIVE
        to: CLEARED
        trigger: "POST /api/subjects/{id}/transition {to_status: CLEARED}"
        actor: InvestigationsManager
        preconditions: ["No Finding references this subject with status in {DRAFT, CALIBRATED, CHALLENGED} (ERR_SUBJECT_HAS_OPEN_FINDINGS)"]
        side_effects: []
      - from: ACTIVE
        to: SEPARATED
        trigger: "POST /api/subjects/{id}/transition {to_status: SEPARATED}"
        actor: InvestigationsManager
        preconditions: []
        side_effects: []

  - entity: PreservationNotice
    initial_state: ISSUED
    terminal_states: [RELEASED]
    transitions:
      - from: ISSUED
        to: ACKNOWLEDGED
        trigger: "POST /api/preservation-notices/{id}/transition {to_status: ACKNOWLEDGED}"
        actor: GeneralCounsel
        preconditions: []
        side_effects:
          - "acknowledged_at = current logical clock"
          - "parent Case.preservation_completeness_ratio recomputed"
      - from: ISSUED
        to: RELEASED
        trigger: "POST /api/preservation-notices/{id}/transition {to_status: RELEASED}"
        actor: GeneralCounsel
        preconditions:
          - "If is_regulator_ordered: parent Case status == CLOSED (ERR_ORDERED_NOTICE_RESTRICTION)"
        side_effects:
          - "Cascade hop 1: every CollectionScope of the same case with custodian_ref == this notice's custodian_ref in {PROPOSED, APPROVED, IN_PROGRESS} -> WITHDRAWN"
          - "Cascade hop 2 (caused by hop 1): parent Case.preservation_completeness_ratio recomputed (RELEASED excluded from numerator and denominator)"
      - from: ACKNOWLEDGED
        to: RELEASED
        trigger: "POST /api/preservation-notices/{id}/transition {to_status: RELEASED}"
        actor: GeneralCounsel
        preconditions:
          - "If is_regulator_ordered: parent Case status == CLOSED (ERR_ORDERED_NOTICE_RESTRICTION)"
        side_effects:
          - "Cascade hop 1: every CollectionScope of the same case with custodian_ref == this notice's custodian_ref in {PROPOSED, APPROVED, IN_PROGRESS} -> WITHDRAWN"
          - "Cascade hop 2 (caused by hop 1): parent Case.preservation_completeness_ratio recomputed (RELEASED excluded from numerator and denominator)"

  - entity: CollectionScope
    initial_state: PROPOSED
    terminal_states: [COLLECTED, WITHDRAWN]
    transitions:
      - from: PROPOSED
        to: APPROVED
        trigger: "POST /api/collection-scopes/{id}/transition {to_status: APPROVED}"
        actor: InvestigationsManager
        preconditions:
          - "parent Case status == FIELDWORK (ERR_INVALID_STATE)"
          - "A PreservationNotice of the case covering custodian_ref and data_source is ACKNOWLEDGED (ERR_NOTICE_NOT_ACKNOWLEDGED)"
        side_effects: []
      - from: APPROVED
        to: IN_PROGRESS
        trigger: "POST /api/collection-scopes/{id}/transition {to_status: IN_PROGRESS}"
        actor: Investigator
        preconditions: ["Covering PreservationNotice still in {ISSUED, ACKNOWLEDGED} (ERR_CUSTODIAN_NOT_PRESERVED)"]
        side_effects: []
      - from: IN_PROGRESS
        to: COLLECTED
        trigger: "POST /api/collection-scopes/{id}/transition {to_status: COLLECTED}"
        actor: Investigator
        preconditions: ["At least one linked EvidenceItem with status in {LOGGED, UNDER_REVIEW, ADMITTED} (ERR_EMPTY_COLLECTION)"]
        side_effects:
          - "review_effort_minutes computed per calculations.evidence_review_effort_minutes (pinned rounding order)"
      - from: PROPOSED
        to: WITHDRAWN
        trigger: "POST /api/collection-scopes/{id}/transition {to_status: WITHDRAWN} or system cascade from notice release"
        actor: Investigator
        preconditions: []
        side_effects: ["parent Case derived fields recomputed"]
      - from: APPROVED
        to: WITHDRAWN
        trigger: "POST /api/collection-scopes/{id}/transition {to_status: WITHDRAWN} or system cascade from notice release"
        actor: Investigator
        preconditions: []
        side_effects: ["parent Case derived fields recomputed"]
      - from: IN_PROGRESS
        to: WITHDRAWN
        trigger: "POST /api/collection-scopes/{id}/transition {to_status: WITHDRAWN} or system cascade from notice release"
        actor: Investigator
        preconditions: []
        side_effects: ["parent Case derived fields recomputed"]

  - entity: EvidenceItem
    initial_state: LOGGED
    terminal_states: []   # ADMITTED/EXCLUDED are interconvertible (restore cycle)
    transitions:
      - from: LOGGED
        to: UNDER_REVIEW
        trigger: "POST /api/evidence-items/{id}/transition {to_status: UNDER_REVIEW}"
        actor: Investigator
        preconditions: []
        side_effects: []
      - from: UNDER_REVIEW
        to: ADMITTED
        trigger: "POST /api/evidence-items/{id}/transition {to_status: ADMITTED}"
        actor: Investigator
        preconditions:
          - "No PrivilegeDesignation with target_type=EVIDENCE_ITEM, target_id=this item, status=DESIGNATED (pending confirmation) (ERR_PRIVILEGE_PENDING)"
        side_effects: ["parent CollectionScope.collected_item_count/collected_bytes recomputed"]
      - from: UNDER_REVIEW
        to: EXCLUDED
        trigger: "POST /api/evidence-items/{id}/transition {to_status: EXCLUDED}"
        actor: Investigator
        preconditions: []
        side_effects: ["parent CollectionScope.collected_item_count/collected_bytes recomputed (EXCLUDED drops out of the sums)"]
      - from: ADMITTED
        to: EXCLUDED
        trigger: "POST /api/evidence-items/{id}/transition {to_status: EXCLUDED}"
        actor: Investigator
        preconditions: []
        side_effects: ["parent CollectionScope.collected_item_count/collected_bytes recomputed (EXCLUDED drops out of the sums)"]
      - from: EXCLUDED
        to: ADMITTED
        trigger: "POST /api/evidence-items/{id}/transition {to_status: ADMITTED} (restore)"
        actor: Investigator
        preconditions:
          - "No PrivilegeDesignation with target_type=EVIDENCE_ITEM, target_id=this item, status=DESIGNATED (ERR_PRIVILEGE_PENDING)"
        side_effects: ["parent CollectionScope.collected_item_count/collected_bytes recomputed (restore re-enters the sums)"]

  - entity: WitnessInterview
    initial_state: SCHEDULED
    terminal_states: [COMPLETED, CANCELLED]
    transitions:
      - from: SCHEDULED
        to: UPJOHN_DELIVERED
        trigger: "POST /api/interviews/{id}/transition {to_status: UPJOHN_DELIVERED}"
        actor: Investigator
        preconditions:
          - "current logical clock <= scheduled_end (ERR_INTERVIEW_WINDOW_EXPIRED)"
        side_effects: ["upjohn_delivered_at = current logical clock"]
      - from: UPJOHN_DELIVERED
        to: COMPLETED
        trigger: "POST /api/interviews/{id}/transition {to_status: COMPLETED}"
        actor: Investigator
        preconditions:
          - "upjohn_delivered_at present — Upjohn warning must precede completion (ERR_UPJOHN_REQUIRED)"
          - "payload completion_note present (ERR_MISSING_REQUIRED_FIELD)"
        side_effects: ["completed_at = current logical clock"]
      - from: SCHEDULED
        to: NO_SHOW
        trigger: "POST /api/interviews/{id}/transition {to_status: NO_SHOW}"
        actor: Investigator
        preconditions:
          - "current logical clock > scheduled_end (ERR_NO_SHOW_TOO_EARLY)"
        side_effects: ["no_show_count += 1"]
      - from: NO_SHOW
        to: SCHEDULED
        trigger: "POST /api/interviews/{id}/transition {to_status: SCHEDULED} (reschedule)"
        actor: Investigator
        preconditions:
          - "payload new_start and new_end present (ERR_MISSING_REQUIRED_FIELD); new_start < new_end (ERR_VALIDATION)"
          - "new_start >= current logical clock (ERR_SCHEDULE_IN_PAST)"
          - "Interviewer half-open overlap check re-run on [new_start, new_end) (ERR_INTERVIEWER_OVERLAP)"
          - "Room 15-minute-buffer overlap check re-run when room_ref present (ERR_ROOM_OVERLAP)"
        side_effects: ["scheduled_start/scheduled_end overwritten by new_start/new_end; upjohn_delivered_at cleared"]
      - from: SCHEDULED
        to: CANCELLED
        trigger: "POST /api/interviews/{id}/transition {to_status: CANCELLED}"
        actor: Investigator
        preconditions: []
        side_effects: []
      - from: UPJOHN_DELIVERED
        to: CANCELLED
        trigger: "POST /api/interviews/{id}/transition {to_status: CANCELLED}"
        actor: Investigator
        preconditions: []
        side_effects: ["upjohn_delivered_at retained for audit"]

  - entity: PrivilegeDesignation
    initial_state: DESIGNATED
    terminal_states: [WAIVED]
    transitions:
      - from: DESIGNATED
        to: CONFIRMED
        trigger: "POST /api/privilege-designations/{id}/transition {to_status: CONFIRMED}"
        actor: GeneralCounsel
        preconditions: []
        side_effects: ["parent Case.active_privileged_artifact_count unchanged (CONFIRMED still counts as active)"]
      - from: CONFIRMED
        to: CHALLENGED
        trigger: "POST /api/privilege-designations/{id}/transition {to_status: CHALLENGED}"
        actor: ChiefLegalOfficer
        preconditions: []
        side_effects: []
      - from: CHALLENGED
        to: CONFIRMED
        trigger: "POST /api/privilege-designations/{id}/transition {to_status: CONFIRMED} (reaffirm)"
        actor: GeneralCounsel
        preconditions: []
        side_effects: []
      - from: DESIGNATED
        to: WAIVED
        trigger: "POST /api/privilege-designations/{id}/transition {to_status: WAIVED}"
        actor: GeneralCounsel
        preconditions: []
        side_effects: ["parent Case.active_privileged_artifact_count recomputed (-1 for this row)"]
      - from: CONFIRMED
        to: WAIVED
        trigger: "POST /api/privilege-designations/{id}/transition {to_status: WAIVED}"
        actor: GeneralCounsel
        preconditions: []
        side_effects: ["parent Case.active_privileged_artifact_count recomputed (-1 for this row)"]
      - from: CHALLENGED
        to: WAIVED
        trigger: "POST /api/privilege-designations/{id}/transition {to_status: WAIVED}"
        actor: GeneralCounsel
        preconditions: []
        side_effects: ["parent Case.active_privileged_artifact_count recomputed (-1 for this row)"]

  - entity: Finding
    initial_state: DRAFT
    terminal_states: []   # FINAL is challengeable
    transitions:
      - from: DRAFT
        to: CALIBRATED
        trigger: "POST /api/findings/{id}/transition {to_status: CALIBRATED}"
        actor: HRBusinessPartner
        preconditions:
          - "payload consistency_level in {LOW, MEDIUM, HIGH} and payload finding_type present (ERR_MISSING_REQUIRED_FIELD)"
          - "If finding_type == SUBSTANTIATED: substantiation_score_final >= 0.70 (ERR_THRESHOLD_NOT_MET)"
        side_effects:
          - "substantiation_score_final computed per calculations.substantiation_score (final variant)"
          - "consistency_level/subject_admission/finding_type recorded"
      - from: CALIBRATED
        to: FINAL
        trigger: "POST /api/findings/{id}/transition {to_status: FINAL}"
        actor: InvestigationsManager
        preconditions:
          - "SOD: approver X-User-ID != parent Case.lead_investigator_id (ERR_SOD_FINDING_FINALIZATION)"
        side_effects: []
      - from: FINAL
        to: CHALLENGED
        trigger: "POST /api/findings/{id}/transition {to_status: CHALLENGED} or system cascade from case reopen"
        actor: GeneralCounsel
        preconditions: []
        side_effects:
          - "Every DisciplinaryRecommendation of this finding in APPROVED -> RECALLED"
      - from: CHALLENGED
        to: CALIBRATED
        trigger: "POST /api/findings/{id}/transition {to_status: CALIBRATED} (recalibrate)"
        actor: HRBusinessPartner
        preconditions:
          - "payload consistency_level and finding_type present (ERR_MISSING_REQUIRED_FIELD)"
          - "If finding_type == SUBSTANTIATED: substantiation_score_final >= 0.70 recomputed (ERR_THRESHOLD_NOT_MET)"
        side_effects: ["substantiation_score_final recomputed"]

  - entity: DisciplinaryRecommendation
    initial_state: PROPOSED
    terminal_states: [APPROVED, REJECTED]   # RECALLED is non-terminal: returns to calibration pipeline via finding recalibration? No: RECALLED is terminal-for-row; a NEW recommendation may be proposed once finding returns to FINAL.
    transitions:
      - from: PROPOSED
        to: APPROVED
        trigger: "POST /api/disciplinary-recommendations/{id}/transition {to_status: APPROVED}"
        actor: InvestigationsManager
        preconditions:
          - "SOD: approver X-User-ID != proposed_by (ERR_SOD_DISCIPLINE_APPROVAL)"
        side_effects: []
      - from: PROPOSED
        to: REJECTED
        trigger: "POST /api/disciplinary-recommendations/{id}/transition {to_status: REJECTED}"
        actor: InvestigationsManager
        preconditions: ["payload rationale present (ERR_MISSING_REQUIRED_FIELD)"]
        side_effects: []
      - from: APPROVED
        to: RECALLED
        trigger: "system: parent Finding FINAL->CHALLENGED (direct challenge or case reopen cascade)"
        actor: system
        preconditions: []
        side_effects: []

  - entity: CaseReport
    initial_state: DRAFT
    terminal_states: [RECALLED, SUPERSEDED]
    transitions:
      - from: DRAFT
        to: LEGAL_REVIEW
        trigger: "POST /api/reports/{id}/transition {to_status: LEGAL_REVIEW}"
        actor: Investigator
        preconditions:
          - "Every Finding of the parent Case in FINAL (ERR_FINDINGS_NOT_FINAL)"
        side_effects: []
      - from: LEGAL_REVIEW
        to: DISTRIBUTION_APPROVED
        trigger: "POST /api/reports/{id}/transition {to_status: DISTRIBUTION_APPROVED}"
        actor: GeneralCounsel
        preconditions:
          - "Every PrivilegeDesignation of the case in {CONFIRMED, WAIVED} (none DESIGNATED or CHALLENGED) (ERR_PRIVILEGE_PENDING)"
        side_effects:
          - "pinned_designation_snapshot = ids of case PrivilegeDesignation rows in {CONFIRMED} at this instant (version-pinned basis)"
      - from: DISTRIBUTION_APPROVED
        to: DISTRIBUTED
        trigger: "POST /api/reports/{id}/transition {to_status: DISTRIBUTED}"
        actor: GeneralCounsel
        preconditions:
          - "If distribution_tier == BOARD: actor must be ChiefLegalOfficer (ERR_UNAUTHORIZED_ROLE)"
          - "If distribution_tier == BOARD: no evidence linked to any finding of the case carries a PrivilegeDesignation of type ACP in {DESIGNATED, CONFIRMED} (ERR_PRIVILEGED_DISTRIBUTION)"
        side_effects: ["distributed_at = current logical clock"]
      - from: DISTRIBUTED
        to: RECALLED
        trigger: "POST /api/reports/{id}/transition {to_status: RECALLED} or system cascade from case reopen"
        actor: GeneralCounsel
        preconditions: []
        side_effects: []
      - from: DRAFT
        to: SUPERSEDED
        trigger: "system: a new CaseReport is created for the same case"
        actor: system
        preconditions: []
        side_effects: []

  - entity: SelfDisclosureDecision
    initial_state: PENDING
    terminal_states: [FILED, OVERRIDDEN, SUPERSEDED]
    transitions:
      - from: PENDING
        to: DECIDED
        trigger: "POST /api/self-disclosure-decisions/{id}/transition {to_status: DECIDED}"
        actor: ChiefLegalOfficer
        preconditions:
          - "payload decision in {DISCLOSE, NO_DISCLOSE} (ERR_MISSING_REQUIRED_FIELD)"
        side_effects:
          - "decided_by = X-User-ID; decided_at = current logical clock"
          - "parent Case.case_priority_score recomputed (deadline-urgency term re-evaluated)"
      - from: DECIDED
        to: FILED
        trigger: "POST /api/self-disclosure-decisions/{id}/transition {to_status: FILED}"
        actor: GeneralCounsel
        preconditions:
          - "decision == DISCLOSE (ERR_DECISION_NOT_DISCLOSE)"
          - "current logical clock >= decided_at + 72 hours (mandatory cooling-off) (ERR_COOLING_OFF)"
        side_effects: ["filed_at = current logical clock"]
      - from: DECIDED
        to: OVERRIDDEN
        trigger: "POST /api/self-disclosure-decisions/{id}/transition {to_status: OVERRIDDEN}"
        actor: ChiefLegalOfficer
        preconditions:
          - "SOD: overrider X-User-ID != decided_by (ERR_SOD_DISCLOSURE_OVERRIDE)"
          - "payload rationale present (ERR_MISSING_REQUIRED_FIELD)"
        side_effects: []
      - from: PENDING
        to: SUPERSEDED
        trigger: "system: a new SelfDisclosureDecision is created for the same case and same regulator"
        actor: system
        preconditions: []
        side_effects: []

  - entity: RemediationAction
    initial_state: OPEN
    terminal_states: [VERIFIED, WAIVED]
    transitions:
      - from: OPEN
        to: IN_PROGRESS
        trigger: "POST /api/remediation-actions/{id}/transition {to_status: IN_PROGRESS}"
        actor: HRBusinessPartner
        preconditions: []
        side_effects: []
      - from: IN_PROGRESS
        to: AWAITING_VERIFICATION
        trigger: "POST /api/remediation-actions/{id}/transition {to_status: AWAITING_VERIFICATION}"
        actor: HRBusinessPartner
        preconditions: []
        side_effects: []
      - from: AWAITING_VERIFICATION
        to: VERIFIED
        trigger: "POST /api/remediation-actions/{id}/transition {to_status: VERIFIED}"
        actor: ComplianceAuditor
        preconditions:
          - "SOD: verifier X-User-ID != owner_ref (ERR_SOD_REMEDIATION_VERIFICATION)"
        side_effects:
          - "verified_by = X-User-ID"
          - "parent Case.open_remediation_count recomputed (-1)"
      - from: AWAITING_VERIFICATION
        to: IN_PROGRESS
        trigger: "POST /api/remediation-actions/{id}/transition {to_status: IN_PROGRESS} (reject verification)"
        actor: ComplianceAuditor
        preconditions: ["payload rationale present (ERR_MISSING_REQUIRED_FIELD)"]
        side_effects: []
      - from: OPEN
        to: WAIVED
        trigger: "POST /api/remediation-actions/{id}/transition {to_status: WAIVED}"
        actor: GeneralCounsel
        preconditions: ["payload rationale present (ERR_MISSING_REQUIRED_FIELD)"]
        side_effects: ["parent Case.open_remediation_count recomputed (-1)"]
      - from: IN_PROGRESS
        to: WAIVED
        trigger: "POST /api/remediation-actions/{id}/transition {to_status: WAIVED}"
        actor: GeneralCounsel
        preconditions: ["payload rationale present (ERR_MISSING_REQUIRED_FIELD)"]
        side_effects: ["parent Case.open_remediation_count recomputed (-1)"]

  - entity: PatternAlert
    initial_state: OPEN
    terminal_states: [ESCALATED, DISMISSED]
    transitions:
      - from: OPEN
        to: ACKNOWLEDGED
        trigger: "POST /api/pattern-alerts/{id}/transition {to_status: ACKNOWLEDGED}"
        actor: InvestigationsManager
        preconditions: []
        side_effects: ["pattern_escalated recomputed for every case in case_ids (ACKNOWLEDGED counts as active)"]
      - from: ACKNOWLEDGED
        to: ESCALATED
        trigger: "POST /api/pattern-alerts/{id}/transition {to_status: ESCALATED}"
        actor: InvestigationsManager
        preconditions: []
        side_effects:
          - "Cascade hop 1: every Case in case_ids with status in {INTAKE, TRIAGED, PLANNING, FIELDWORK, FINDINGS, DISPOSITION, REMEDIATION} gets pattern_escalated = true"
          - "Cascade hop 2 (caused by hop 1): each such Case recomputes case_priority_score and priority_tier"
      - from: OPEN
        to: DISMISSED
        trigger: "POST /api/pattern-alerts/{id}/transition {to_status: DISMISSED}"
        actor: InvestigationsManager
        preconditions: ["payload rationale present (ERR_MISSING_REQUIRED_FIELD)"]
        side_effects: ["pattern_escalated recomputed for every case in case_ids"]
      - from: ACKNOWLEDGED
        to: DISMISSED
        trigger: "POST /api/pattern-alerts/{id}/transition {to_status: DISMISSED}"
        actor: InvestigationsManager
        preconditions: ["payload rationale present (ERR_MISSING_REQUIRED_FIELD)"]
        side_effects: ["pattern_escalated recomputed for every case in case_ids"]

# =============================================================================
# §1.2.1 Concurrency Rules (true create-with-supersede races, OCC on Case.version)
# =============================================================================
concurrency_rules:
  - rule_id: plan-create-stale-case
    parent_entity: Case
    write_endpoint: "POST /api/cases/{id}/plans"
    occ_field: expected_case_version
    description: |
      Creating an InvestigationPlan against a Case whose version has advanced
      since the client last observed it is rejected. A plan creation legitimately
      supersedes the case's prior DRAFT/REJECTED plan and moves TRIAGED->PLANNING,
      so a writer holding a stale Case view must restart from a fresh read.
    error_id: ERR_STALE_VERSION
    http_status: 412
  - rule_id: report-create-stale-case
    parent_entity: Case
    write_endpoint: "POST /api/cases/{id}/reports"
    occ_field: expected_case_version
    description: |
      Creating a CaseReport against a Case whose version has advanced since the
      client last observed it is rejected. A report creation legitimately
      supersedes the case's prior DRAFT report, so a writer holding a stale Case
      view must restart from a fresh read.
    error_id: ERR_STALE_VERSION
    http_status: 412
  - rule_id: disclosure-create-stale-case
    parent_entity: Case
    write_endpoint: "POST /api/cases/{id}/self-disclosure-decisions"
    occ_field: expected_case_version
    description: |
      Creating a SelfDisclosureDecision against a Case whose version has advanced
      since the client last observed it is rejected. A decision creation
      legitimately supersedes the prior PENDING decision for the same regulator,
      so a writer holding a stale Case view must restart from a fresh read.
    error_id: ERR_STALE_VERSION
    http_status: 412

# =============================================================================
# §1.3 Calculation Rules Table
# =============================================================================
calculations:
  - name: substantiation_score
    trigger: "Finding creation (provisional variant) and Finding DRAFT->CALIBRATED / CHALLENGED->CALIBRATED (final variant)"
    algorithm: weighted_scoring
    formula: |
      score = min(1.00, 0.25 * E + 0.15 * W + C + 0.10 * A)
      where
        E = count of evidence ids in finding.evidence_item_ids whose EvidenceItem.status
            is in the variant's evidence input set (see variants);
        W = count of WitnessInterview rows of the case with is_subject_interview = false
            whose status is in the variant's interview input set (see variants);
        C = consistency term: LOW => 0.00, MEDIUM => 0.15, HIGH => 0.30
            (provisional variant assumes MEDIUM => 0.15);
        A = 1 if subject_admission else 0 (provisional variant assumes 0).
      Round half-up to 2 decimal places AFTER the min().
      SUBSTANTIATED gate: finding_type == SUBSTANTIATED requires final score >= 0.70.
    input_set: "Evidence linked via Finding.evidence_item_ids; interviews of the parent Case with is_subject_interview=false; statuses per variant"
    constants:
      W_EVIDENCE: 0.25
      W_INTERVIEW: 0.15
      C_LOW: 0.00
      C_MEDIUM: 0.15
      C_HIGH: 0.30
      W_ADMISSION: 0.10
      SUBSTANTIATED_THRESHOLD: 0.70
    precision: "2 decimal places, round_half_up, applied once after min()"
    variants:
      - name: provisional
        when: "computed at Finding creation, stored in substantiation_score_provisional"
        difference: "E counts evidence in {UNDER_REVIEW, ADMITTED}; W counts interviews in {UPJOHN_DELIVERED, COMPLETED}; C fixed at 0.15 (MEDIUM); A fixed at 0"
      - name: final
        when: "computed at DRAFT->CALIBRATED and CHALLENGED->CALIBRATED, stored in substantiation_score_final"
        difference: "E counts evidence in {ADMITTED} only; W counts interviews in {COMPLETED} only; C and A taken from the calibrate payload"

  - name: discipline_severity_index
    trigger: "DisciplinaryRecommendation creation (both variants computed and stored)"
    algorithm: weighted_scoring
    formula: |
      base        = 10 * severity_weight            # LOW=1, MEDIUM=2, HIGH=3, CRITICAL=4
      multiplier  = 1 + 0.25 * min(prior_history_count, 3)
      index_policy_matrix = round_half_up(base * multiplier, 0)      # integer
      index_calibrated    = index_policy_matrix + 5 * min(aggravation_count, 2)
                                                 - 5 * min(mitigation_count, 2)
      tier mapping (both variants): index < 20 => COACHING;
        20 <= index <= 39 => WARNING; 40 <= index <= 59 => SUSPENSION; index >= 60 => TERMINATION.
      suggested_action = tier of index_calibrated; policy_action = tier of index_policy_matrix
      (policy_action is derivable from index_policy_matrix and not stored).
      prior_history_count = count of Finding rows with status FINAL, finding_type
      SUBSTANTIATED, on cases OTHER than this case, whose subject's employee_ref equals
      this finding's subject's employee_ref, and whose created_at is strictly earlier
      than this finding's created_at (earliest-created finding wins ties via created_at ASC).
    input_set: "parent Case.severity snapshot; cross-case FINAL SUBSTANTIATED findings for the same subject employee_ref"
    constants:
      SEVERITY_WEIGHT_LOW: 1
      SEVERITY_WEIGHT_MEDIUM: 2
      SEVERITY_WEIGHT_HIGH: 3
      SEVERITY_WEIGHT_CRITICAL: 4
      PRIOR_STEP: 0.25
      PRIOR_CAP: 3
      ADJ_STEP: 5
      ADJ_CAP: 2
    precision: "index_policy_matrix: integer, round_half_up at the multiplication step; index_calibrated: integer arithmetic on top"
    variants:
      - name: POLICY_MATRIX
        when: "always computed; stored in index_policy_matrix"
        difference: "ignores mitigation_count and aggravation_count entirely"
      - name: CALIBRATED
        when: "always computed; stored in index_calibrated and mapped to suggested_action"
        difference: "applies +/- 5 per min(count, 2) aggravation/mitigation factor on top of index_policy_matrix"

  - name: pattern_risk_score
    trigger: "POST /api/pattern-alerts/scan, once per newly created PatternAlert"
    algorithm: weighted_scoring
    formula: |
      Let the alert's qualifying case set be C (n = |C|, n >= 2 by construction).
      sev_max       = max severity_weight over C      # LOW=1, MEDIUM=2, HIGH=3, CRITICAL=4
      d             = days between the latest case created_at in C and window_end,
                      rounded DOWN to whole days      # 0 <= d <= 90
      recency       = max(0.20, 1 - d / 90)
      distinct_deps = count of distinct Case.department values over C
      spread        = 1 + 0.25 * min(distinct_deps - 1, 2)
      volume        = 1 + 0.5 * (n - 1)
      score         = round_half_up( min(100, 10 * sev_max * volume * recency * spread), 2 )
      risk_tier: score >= 70 => HIGH; 40 <= score < 70 => MEDIUM; score < 40 => LOW.
      Non-linear interaction: nested min()/max() clamps plus multiplicative terms.
    input_set: "Cases with created_at in [window_start, window_end] matching the alert's grouping key; status filter: all statuses EXCEPT DISMISSED"
    constants:
      RECENCY_FLOOR: 0.20
      SPREAD_STEP: 0.25
      SPREAD_CAP: 2
      VOLUME_STEP: 0.5
      BASE: 10
      TIER_HIGH: 70
      TIER_MEDIUM: 40
    precision: "2 decimal places, round_half_up, applied once after the outer min(100, ...)"

  - name: evidence_review_effort_minutes
    trigger: "CollectionScope IN_PROGRESS->COLLECTED"
    algorithm: aggregation
    formula: |
      PINNED ROUNDING ORDER (per-item first, then sum, then overhead, then final round):
        for each EvidenceItem linked to the scope with status in
        {LOGGED, UNDER_REVIEW, ADMITTED, EXCLUDED} at completion time:
          raw_i    = size_bytes / 1,000,000 * MINUTES_PER_MB
          minutes_i = ceil(raw_i)                      # per-item round UP to whole minutes
        subtotal = sum(minutes_i)
        total    = round_half_up(subtotal * OVERHEAD, 0)   # integer minutes
      The alternative order (sum raw, then round once) is FORBIDDEN: it produces a
      different value (e.g. three 300,000-byte items => per-item order 3 vs sum-first 2).
    input_set: "All EvidenceItem rows of the scope in {LOGGED, UNDER_REVIEW, ADMITTED, EXCLUDED} at the COLLECTED transition"
    constants:
      MINUTES_PER_MB: 2
      OVERHEAD: 1.15
    precision: "per-item ceil to integer; final round_half_up to integer"

  - name: case_priority_score
    trigger: "Case creation; any transition changing severity, pattern_escalated, or a PENDING SelfDisclosureDecision's decision_deadline relevance; PatternAlert transitions (via pattern_escalated)"
    algorithm: threshold
    formula: |
      PINNED EVALUATION ORDER (breaks the circular-looking dependency between
      score -> tier -> backlog -> score):
        (1) raw = 10 * severity_weight
                + (15 if pattern_escalated else 0)
                + (10 if exists a SelfDisclosureDecision of this case in PENDING
                     with decision_deadline <= current_utc + 7 days else 0)
            raw depends ONLY on severity and flags/deadlines; backlog NEVER feeds raw.
        (2) priority_tier = URGENT if raw >= 40; ELEVATED if 20 <= raw < 40; ROUTINE if raw < 20.
        (3) backlog ordering (used only by GET /api/cases?sort=priority): within a tier,
            order by raw DESC, then created_at ASC (created_at is the only permitted tie-break;
            id MUST NOT be used).
      case_priority_score stores raw.
    input_set: "the Case row itself plus its PENDING SelfDisclosureDecision rows"
    constants:
      SEVERITY_WEIGHT_LOW: 1
      SEVERITY_WEIGHT_MEDIUM: 2
      SEVERITY_WEIGHT_HIGH: 3
      SEVERITY_WEIGHT_CRITICAL: 4
      ESCALATION_BOOST: 15
      DISCLOSURE_URGENCY_BOOST: 10
      DISCLOSURE_URGENCY_WINDOW_DAYS: 7
      TIER_URGENT: 40
      TIER_ELEVATED: 20
    precision: "integer arithmetic, no rounding"

  - name: preservation_completeness_ratio
    trigger: "any PreservationNotice transition of the case; gate on Case FIELDWORK->FINDINGS"
    algorithm: aggregation
    formula: |
      ack    = count of the case's PreservationNotice rows in ACKNOWLEDGED
      issued = count of the case's PreservationNotice rows in ISSUED
      ratio  = ack / (ack + issued) when (ack + issued) > 0, else 1.00 (vacuous compliance)
      RELEASED rows are excluded from BOTH terms.
    input_set: "PreservationNotice rows of the case in {ISSUED, ACKNOWLEDGED}"
    constants:
      EMPTY_SET_RATIO: 1.00
    precision: "2 decimal places, round_half_up"

  - name: remediation_overdue_flag
    trigger: "every read of a RemediationAction and every RemediationAction transition"
    algorithm: threshold
    formula: |
      is_overdue = (current_utc > due_date) AND status in {OPEN, IN_PROGRESS, AWAITING_VERIFICATION}
      Boundary is STRICTLY greater-than: current_utc == due_date => is_overdue = false.
    input_set: "the RemediationAction row plus the logical clock"
    constants: {}
    precision: "boolean; datetime comparison at second precision"

  - name: collection_custody_totals
    trigger: "EvidenceItem creation and every EvidenceItem status transition"
    algorithm: aggregation
    formula: |
      collected_item_count = count of the scope's EvidenceItem rows in {LOGGED, UNDER_REVIEW, ADMITTED}
      collected_bytes      = sum of size_bytes over the same set
      EXCLUDED rows are excluded from both terms (they re-enter on EXCLUDED->ADMITTED restore).
    input_set: "EvidenceItem rows of the parent CollectionScope in {LOGGED, UNDER_REVIEW, ADMITTED}"
    constants: {}
    precision: "integer"

# =============================================================================
# §1.4 Validation Rules Table (ordered by priority)
# =============================================================================
validations:
  - priority: 1
    category: auth
    check: "X-User-Role and X-User-ID headers present; X-User-Role must be one of the declared roles"
    error_id: ERR_UNAUTHENTICATED
    http_status: 401
    applies_to: "all endpoints"
  - priority: 2
    category: auth
    check: "Idempotency-Key header present on every POST; a replayed key with an identical payload returns the original response; a replayed key with a different payload is rejected"
    error_id: ERR_MISSING_IDEMPOTENCY_KEY
    http_status: 400
    applies_to: "all POST endpoints (replay mismatch => ERR_IDEMPOTENCY_REPLAY_MISMATCH, 409)"
  - priority: 3
    category: auth
    check: "X-User-Role is listed in the endpoint's roles"
    error_id: ERR_UNAUTHORIZED_ROLE
    http_status: 403
    applies_to: "all endpoints"
  - priority: 4
    category: existence
    check: "Path ids exist, validated left-to-right; body-referenced ids (allegation_id, subject_id, preservation_notice_id, target_id, evidence_item_ids elements) exist"
    error_id: ERR_NOT_FOUND
    http_status: 404
    applies_to: "all endpoints with path or body resource ids"
  - priority: 5
    category: state
    check: "OCC: expected_case_version equals the Case's current version on the three create-with-supersede endpoints"
    error_id: ERR_STALE_VERSION
    http_status: 412
    applies_to: "POST /api/cases/{id}/plans, POST /api/cases/{id}/reports, POST /api/cases/{id}/self-disclosure-decisions"
  - priority: 6
    category: state
    check: "Target entity is in a from-state that permits the requested transition (terminal states reject everything); per-transition actor role is honored"
    error_id: ERR_INVALID_STATE
    http_status: 409
    applies_to: "all transition endpoints; also gates contextual creates (plan/scope/evidence/interview/finding/report/disclosure/remediation require the parent case in the correct status)"
  - priority: 7
    category: business_safety
    check: "Segregation-of-duties and compliance-safety gates: SOD on plan approve/reject (drafter != approver), finding finalize (approver != lead_investigator_id), discipline approve (approver != proposed_by), remediation verify (verifier != owner_ref), disclosure override (overrider != decided_by); Upjohn delivered before interview completion; evidence admit blocked by pending DESIGNATED privilege; BOARD distribution blocked by active ACP designations; 72-hour disclosure cooling-off; regulator-ordered notice release blocked until case CLOSED"
    error_id: "ERR_SOD_PLAN_APPROVAL | ERR_SOD_FINDING_FINALIZATION | ERR_SOD_DISCIPLINE_APPROVAL | ERR_SOD_REMEDIATION_VERIFICATION | ERR_SOD_DISCLOSURE_OVERRIDE | ERR_UPJOHN_REQUIRED | ERR_PRIVILEGE_PENDING | ERR_PRIVILEGED_DISTRIBUTION | ERR_COOLING_OFF | ERR_ORDERED_NOTICE_RESTRICTION"
    http_status: 403
    applies_to: "respective transition endpoints"
  - priority: 8
    category: business_constraint
    check: "Uniqueness/overlap/threshold/aggregate constraints: at most one SUBMITTED plan per case; unique (case_id, employee_ref) among non-terminal subjects; no duplicate active designation per target; no interviewer half-open overlap; no room overlap with 15-minute buffer; no collection-window closed-interval overlap per (custodian_ref, data_source); at most one PROPOSED recommendation per finding; SUBSTANTIATED requires final score >= 0.70; scope COLLECTED requires at least one item; fieldwork exit requires no open scopes and ratio == 1.00; disposition/remediation/close aggregate gates; reporter_ref forbidden when is_anonymous"
    error_id: "ERR_PLAN_SUBMITTED_EXISTS | ERR_DUPLICATE_SUBJECT | ERR_DUPLICATE_DESIGNATION | ERR_INTERVIEWER_OVERLAP | ERR_ROOM_OVERLAP | ERR_SCOPE_OVERLAP | ERR_OPEN_RECOMMENDATION_EXISTS | ERR_THRESHOLD_NOT_MET | ERR_EMPTY_COLLECTION | ERR_OPEN_COLLECTION_SCOPES | ERR_PRESERVATION_INCOMPLETE | ERR_FINDINGS_NOT_FINAL | ERR_UNRESOLVED_DISCIPLINE | ERR_DISCLOSURE_REQUIRED | ERR_OPEN_REMEDIATION | ERR_SUBJECT_HAS_OPEN_FINDINGS | ERR_VALIDATION"
    http_status: 409
    applies_to: "create and transition endpoints as applicable"
  - priority: 9
    category: business_referential
    check: "Cross-entity coverage/reference rules: collection scope custodian must be covered by an ISSUED or ACKNOWLEDGED preservation notice whose scope covers the data_source; scope approval requires the covering notice ACKNOWLEDGED; scope begin requires covering notice still un-released; finding allegation must be LINKED and belong to the case; finding subject must belong to the case; linked evidence must belong to the case and be in {UNDER_REVIEW, ADMITTED}; privilege target must belong to the case"
    error_id: "ERR_CUSTODIAN_NOT_PRESERVED | ERR_NOTICE_NOT_ACKNOWLEDGED | ERR_ALLEGATION_NOT_LINKED | ERR_SUBJECT_NOT_IN_CASE | ERR_EVIDENCE_NOT_REVIEWABLE | ERR_TARGET_CASE_MISMATCH"
    http_status: 409
    applies_to: "create and transition endpoints as applicable"
  - priority: 10
    category: business_temporal
    check: "Clock-relative rules: deliver-upjohn requires current_utc <= scheduled_end; no-show requires current_utc > scheduled_end; reschedule requires new_start >= current_utc; planned windows internally ordered (start < end; scope window closed start <= end)"
    error_id: "ERR_INTERVIEW_WINDOW_EXPIRED | ERR_NO_SHOW_TOO_EARLY | ERR_SCHEDULE_IN_PAST | ERR_VALIDATION"
    http_status: 409
    applies_to: "interview create/transition; scope create"

# =============================================================================
# §1.5 API Endpoint Table
# =============================================================================
endpoints:
  # ---- Case ----
  - method: POST
    path: "/api/cases"
    description: "Create a case in INTAKE; computes case_number, case_priority_score/priority_tier, preservation_completeness_ratio=1.00, counters=0"
    roles: [IntakeCoordinator]
    code: 201
    input: [title, allegation_category, severity, lead_investigator_id, "description?", "department?"]
    output: Case
    side_effects: ["status=INTAKE, version=1", "case_priority_score per calculations.case_priority_score"]
  - method: GET
    path: "/api/cases"
    description: "List cases with filters and priority sort option (sort=priority uses tier, then raw DESC, then created_at ASC)"
    roles: [IntakeCoordinator, Investigator, InvestigationsManager, HRBusinessPartner, GeneralCounsel, ChiefLegalOfficer, ComplianceAuditor]
    code: 200
    input: ["status?", "category?", "severity?", "department?", "lead_investigator_id?", "sort?", "limit?", "offset?"]
    output: "Case[]"
    side_effects: []
  - method: GET
    path: "/api/cases/{id}"
    description: "Get one case (includes computed fields and version)"
    roles: [IntakeCoordinator, Investigator, InvestigationsManager, HRBusinessPartner, GeneralCounsel, ChiefLegalOfficer, ComplianceAuditor]
    code: 200
    input: []
    output: Case
    side_effects: []
  - method: POST
    path: "/api/cases/{id}/transition"
    description: "Drive the Case state machine; triage consumes severity+department; dismiss/reopen consume rationale; increments Case.version by 1"
    roles: [IntakeCoordinator, Investigator, InvestigationsManager]
    code: 200
    input: [to_status, "severity?", "department?", "rationale?"]
    output: Case
    side_effects: ["per Case state machine incl. reopen cascade (Finding FINAL->CHALLENGED; DisciplinaryRecommendation APPROVED->RECALLED; CaseReport DISTRIBUTED->RECALLED)", "increments Case.version by 1"]

  # ---- Allegation ----
  - method: POST
    path: "/api/cases/{id}/allegations"
    description: "File an allegation against a case (SUBMITTED); rejected when case is CLOSED or DISMISSED"
    roles: [IntakeCoordinator]
    code: 201
    input: [reporter_channel, is_anonymous, narrative, "reporter_ref?", "occurred_at?"]
    output: Allegation
    side_effects: ["status=SUBMITTED"]
  - method: GET
    path: "/api/allegations"
    description: "List allegations (FK reverse lookup by case_id)"
    roles: [IntakeCoordinator, Investigator, InvestigationsManager, HRBusinessPartner, GeneralCounsel, ChiefLegalOfficer, ComplianceAuditor]
    code: 200
    input: ["case_id?", "status?", "reporter_channel?", "limit?", "offset?"]
    output: "Allegation[]"
    side_effects: []
  - method: GET
    path: "/api/allegations/{id}"
    description: "Get one allegation"
    roles: [IntakeCoordinator, Investigator, InvestigationsManager, HRBusinessPartner, GeneralCounsel, ChiefLegalOfficer, ComplianceAuditor]
    code: 200
    input: []
    output: Allegation
    side_effects: []
  - method: POST
    path: "/api/allegations/{id}/transition"
    description: "Allegation state machine (TRIAGED / LINKED / DISMISSED)"
    roles: [IntakeCoordinator, InvestigationsManager]
    code: 200
    input: [to_status, "rationale?"]
    output: Allegation
    side_effects: ["per Allegation state machine"]

  # ---- InvestigationPlan ----
  - method: POST
    path: "/api/cases/{id}/plans"
    description: "Create a DRAFT plan (OCC on Case.version); supersedes prior DRAFT/REJECTED plans; blocked while another plan is SUBMITTED; first creation moves case TRIAGED->PLANNING"
    roles: [Investigator]
    code: 201
    input: [scope_statement, planned_start, planned_end, expected_case_version]
    output: InvestigationPlan
    side_effects: ["prior DRAFT/REJECTED plans of the case -> SUPERSEDED", "plan_version = prior max + 1", "drafter_id = X-User-ID", "Case TRIAGED -> PLANNING when case was TRIAGED", "increments Case.version by 1"]
  - method: GET
    path: "/api/plans"
    description: "List plans (FK reverse lookup by case_id)"
    roles: [IntakeCoordinator, Investigator, InvestigationsManager, HRBusinessPartner, GeneralCounsel, ChiefLegalOfficer, ComplianceAuditor]
    code: 200
    input: ["case_id?", "status?", "limit?", "offset?"]
    output: "InvestigationPlan[]"
    side_effects: []
  - method: GET
    path: "/api/plans/{id}"
    description: "Get one plan"
    roles: [IntakeCoordinator, Investigator, InvestigationsManager, HRBusinessPartner, GeneralCounsel, ChiefLegalOfficer, ComplianceAuditor]
    code: 200
    input: []
    output: InvestigationPlan
    side_effects: []
  - method: POST
    path: "/api/plans/{id}/transition"
    description: "Plan submit (Investigator) / approve / reject (InvestigationsManager, SOD vs drafter_id); approve moves case PLANNING->FIELDWORK"
    roles: [Investigator, InvestigationsManager]
    code: 200
    input: [to_status, "rejection_reason?"]
    output: InvestigationPlan
    side_effects: ["on APPROVED: parent Case PLANNING->FIELDWORK and Case.version increments by 1", "on APPROVED: approved_by recorded"]

  # ---- CaseSubject ----
  - method: POST
    path: "/api/cases/{id}/subjects"
    description: "Attach a subject to a case; unique (case_id, employee_ref) among ACTIVE subjects"
    roles: [Investigator]
    code: 201
    input: [employee_ref, role_in_case]
    output: CaseSubject
    side_effects: ["status=ACTIVE"]
  - method: GET
    path: "/api/subjects"
    description: "List subjects (FK reverse lookup by case_id; employee_ref supports pattern review)"
    roles: [IntakeCoordinator, Investigator, InvestigationsManager, HRBusinessPartner, GeneralCounsel, ChiefLegalOfficer, ComplianceAuditor]
    code: 200
    input: ["case_id?", "employee_ref?", "status?", "limit?", "offset?"]
    output: "CaseSubject[]"
    side_effects: []
  - method: GET
    path: "/api/subjects/{id}"
    description: "Get one subject"
    roles: [IntakeCoordinator, Investigator, InvestigationsManager, HRBusinessPartner, GeneralCounsel, ChiefLegalOfficer, ComplianceAuditor]
    code: 200
    input: []
    output: CaseSubject
    side_effects: []
  - method: POST
    path: "/api/subjects/{id}/transition"
    description: "Subject CLEARED (blocked while open findings reference it) / SEPARATED"
    roles: [Investigator, InvestigationsManager]
    code: 200
    input: [to_status]
    output: CaseSubject
    side_effects: ["per CaseSubject state machine"]

  # ---- PreservationNotice ----
  - method: POST
    path: "/api/cases/{id}/preservation-notices"
    description: "Issue a preservation notice (created ISSUED, issued_at=now); requires case in PLANNING or later non-terminal status"
    roles: [GeneralCounsel]
    code: 201
    input: [custodian_ref, scope, is_regulator_ordered]
    output: PreservationNotice
    side_effects: ["status=ISSUED, issued_at=current_utc", "Case.preservation_completeness_ratio recomputed"]
  - method: GET
    path: "/api/preservation-notices"
    description: "List preservation notices (FK reverse lookup by case_id)"
    roles: [IntakeCoordinator, Investigator, InvestigationsManager, HRBusinessPartner, GeneralCounsel, ChiefLegalOfficer, ComplianceAuditor]
    code: 200
    input: ["case_id?", "custodian_ref?", "status?", "limit?", "offset?"]
    output: "PreservationNotice[]"
    side_effects: []
  - method: GET
    path: "/api/preservation-notices/{id}"
    description: "Get one preservation notice"
    roles: [IntakeCoordinator, Investigator, InvestigationsManager, HRBusinessPartner, GeneralCounsel, ChiefLegalOfficer, ComplianceAuditor]
    code: 200
    input: []
    output: PreservationNotice
    side_effects: []
  - method: POST
    path: "/api/preservation-notices/{id}/transition"
    description: "ACKNOWLEDGED (sets acknowledged_at) / RELEASED (cascades dependent scopes to WITHDRAWN; regulator-ordered blocked until case CLOSED)"
    roles: [GeneralCounsel]
    code: 200
    input: [to_status]
    output: PreservationNotice
    side_effects: ["per PreservationNotice state machine incl. release cascade to CollectionScope WITHDRAWN and ratio recompute"]

  # ---- CollectionScope ----
  - method: POST
    path: "/api/cases/{id}/collection-scopes"
    description: "Propose a collection scope; requires case FIELDWORK (which implies an APPROVED plan exists), covering preservation notice (ISSUED/ACKNOWLEDGED), and no closed-interval window overlap for (custodian_ref, data_source)"
    roles: [Investigator]
    code: 201
    input: [custodian_ref, data_source, planned_start, planned_end, "preservation_notice_id?"]
    output: CollectionScope
    side_effects: ["status=PROPOSED"]
  - method: GET
    path: "/api/collection-scopes"
    description: "List collection scopes (FK reverse lookup by case_id and preservation_notice_id)"
    roles: [IntakeCoordinator, Investigator, InvestigationsManager, HRBusinessPartner, GeneralCounsel, ChiefLegalOfficer, ComplianceAuditor]
    code: 200
    input: ["case_id?", "preservation_notice_id?", "custodian_ref?", "data_source?", "status?", "limit?", "offset?"]
    output: "CollectionScope[]"
    side_effects: []
  - method: GET
    path: "/api/collection-scopes/{id}"
    description: "Get one collection scope"
    roles: [IntakeCoordinator, Investigator, InvestigationsManager, HRBusinessPartner, GeneralCounsel, ChiefLegalOfficer, ComplianceAuditor]
    code: 200
    input: []
    output: CollectionScope
    side_effects: []
  - method: POST
    path: "/api/collection-scopes/{id}/transition"
    description: "Scope machine: APPROVED (Manager; covering notice must be ACKNOWLEDGED), IN_PROGRESS, COLLECTED (computes review_effort_minutes), WITHDRAWN"
    roles: [Investigator, InvestigationsManager]
    code: 200
    input: [to_status]
    output: CollectionScope
    side_effects: ["per CollectionScope state machine; COLLECTED computes review_effort_minutes"]

  # ---- EvidenceItem ----
  - method: POST
    path: "/api/collection-scopes/{id}/evidence-items"
    description: "Log an evidence item into an IN_PROGRESS scope (custodian_ref must equal the scope's); recomputes custody totals"
    roles: [Investigator]
    code: 201
    input: [custodian_ref, hash_value, size_bytes, captured_at, "description?"]
    output: EvidenceItem
    side_effects: ["status=LOGGED", "case_id denormalized from scope", "scope.collected_item_count/collected_bytes recomputed"]
  - method: GET
    path: "/api/evidence-items"
    description: "List evidence items (FK reverse lookup by collection_scope_id and case_id)"
    roles: [IntakeCoordinator, Investigator, InvestigationsManager, HRBusinessPartner, GeneralCounsel, ChiefLegalOfficer, ComplianceAuditor]
    code: 200
    input: ["collection_scope_id?", "case_id?", "custodian_ref?", "status?", "limit?", "offset?"]
    output: "EvidenceItem[]"
    side_effects: []
  - method: GET
    path: "/api/evidence-items/{id}"
    description: "Get one evidence item"
    roles: [IntakeCoordinator, Investigator, InvestigationsManager, HRBusinessPartner, GeneralCounsel, ChiefLegalOfficer, ComplianceAuditor]
    code: 200
    input: []
    output: EvidenceItem
    side_effects: []
  - method: POST
    path: "/api/evidence-items/{id}/transition"
    description: "Evidence machine: UNDER_REVIEW / ADMITTED (blocked while a DESIGNATED privilege designation pends) / EXCLUDED / restore EXCLUDED->ADMITTED"
    roles: [Investigator]
    code: 200
    input: [to_status]
    output: EvidenceItem
    side_effects: ["scope custody totals recomputed on every transition"]

  # ---- WitnessInterview ----
  - method: POST
    path: "/api/cases/{id}/interviews"
    description: "Schedule an interview in FIELDWORK; enforces interviewer half-open overlap and room 15-minute-buffer overlap"
    roles: [Investigator]
    code: 201
    input: [witness_ref, interviewer_id, scheduled_start, scheduled_end, "room_ref?", "is_subject_interview?"]
    output: WitnessInterview
    side_effects: ["status=SCHEDULED, no_show_count=0"]
  - method: GET
    path: "/api/interviews"
    description: "List interviews (FK reverse lookup by case_id)"
    roles: [IntakeCoordinator, Investigator, InvestigationsManager, HRBusinessPartner, GeneralCounsel, ChiefLegalOfficer, ComplianceAuditor]
    code: 200
    input: ["case_id?", "witness_ref?", "interviewer_id?", "status?", "limit?", "offset?"]
    output: "WitnessInterview[]"
    side_effects: []
  - method: GET
    path: "/api/interviews/{id}"
    description: "Get one interview"
    roles: [IntakeCoordinator, Investigator, InvestigationsManager, HRBusinessPartner, GeneralCounsel, ChiefLegalOfficer, ComplianceAuditor]
    code: 200
    input: []
    output: WitnessInterview
    side_effects: []
  - method: POST
    path: "/api/interviews/{id}/transition"
    description: "Interview machine: UPJOHN_DELIVERED (window-gated), COMPLETED (Upjohn + note required), NO_SHOW (after window), SCHEDULED reschedule from NO_SHOW (re-runs overlap), CANCELLED"
    roles: [Investigator]
    code: 200
    input: [to_status, "new_start?", "new_end?", "completion_note?", "no_show_reason?"]
    output: WitnessInterview
    side_effects: ["per WitnessInterview state machine; NO_SHOW increments no_show_count"]

  # ---- PrivilegeDesignation ----
  - method: POST
    path: "/api/cases/{id}/privilege-designations"
    description: "Designate privilege over an evidence item, interview, or report of the case; one active designation per target"
    roles: [GeneralCounsel]
    code: 201
    input: [target_type, target_id, privilege_type, "rationale?"]
    output: PrivilegeDesignation
    side_effects: ["status=DESIGNATED, designated_by=X-User-ID", "Case.active_privileged_artifact_count recomputed (+1)"]
  - method: GET
    path: "/api/privilege-designations"
    description: "List privilege designations (FK reverse lookup by case_id)"
    roles: [IntakeCoordinator, Investigator, InvestigationsManager, HRBusinessPartner, GeneralCounsel, ChiefLegalOfficer, ComplianceAuditor]
    code: 200
    input: ["case_id?", "target_type?", "privilege_type?", "status?", "limit?", "offset?"]
    output: "PrivilegeDesignation[]"
    side_effects: []
  - method: GET
    path: "/api/privilege-designations/{id}"
    description: "Get one privilege designation"
    roles: [IntakeCoordinator, Investigator, InvestigationsManager, HRBusinessPartner, GeneralCounsel, ChiefLegalOfficer, ComplianceAuditor]
    code: 200
    input: []
    output: PrivilegeDesignation
    side_effects: []
  - method: POST
    path: "/api/privilege-designations/{id}/transition"
    description: "Designation machine: CONFIRMED (GC), CHALLENGED (CLO), reaffirm CONFIRMED (GC), WAIVED (GC)"
    roles: [GeneralCounsel, ChiefLegalOfficer]
    code: 200
    input: [to_status, "rationale?"]
    output: PrivilegeDesignation
    side_effects: ["WAIVED recomputes Case.active_privileged_artifact_count (-1)"]

  # ---- Finding ----
  - method: POST
    path: "/api/cases/{id}/findings"
    description: "Create a DRAFT finding in FINDINGS status; allegation LINKED, subject in case, evidence linkable; computes substantiation_score_provisional"
    roles: [Investigator]
    code: 201
    input: [allegation_id, subject_id, "evidence_item_ids?"]
    output: Finding
    side_effects: ["status=DRAFT", "substantiation_score_provisional per calculations.substantiation_score (provisional variant)"]
  - method: GET
    path: "/api/findings"
    description: "List findings (FK reverse lookup by case_id, allegation_id, subject_id)"
    roles: [IntakeCoordinator, Investigator, InvestigationsManager, HRBusinessPartner, GeneralCounsel, ChiefLegalOfficer, ComplianceAuditor]
    code: 200
    input: ["case_id?", "allegation_id?", "subject_id?", "finding_type?", "status?", "limit?", "offset?"]
    output: "Finding[]"
    side_effects: []
  - method: GET
    path: "/api/findings/{id}"
    description: "Get one finding"
    roles: [IntakeCoordinator, Investigator, InvestigationsManager, HRBusinessPartner, GeneralCounsel, ChiefLegalOfficer, ComplianceAuditor]
    code: 200
    input: []
    output: Finding
    side_effects: []
  - method: POST
    path: "/api/findings/{id}/transition"
    description: "Finding machine: CALIBRATED (HR; computes final score; SUBSTANTIATED gated at >= 0.70), FINAL (Manager, SOD vs case lead), CHALLENGED (GC), recalibrate CHALLENGED->CALIBRATED (HR)"
    roles: [HRBusinessPartner, InvestigationsManager, GeneralCounsel]
    code: 200
    input: [to_status, "consistency_level?", "subject_admission?", "finding_type?"]
    output: Finding
    side_effects: ["CALIBRATED recomputes substantiation_score_final", "FINAL->CHALLENGED cascades APPROVED recommendations to RECALLED"]

  # ---- DisciplinaryRecommendation ----
  - method: POST
    path: "/api/findings/{id}/disciplinary-recommendations"
    description: "Propose discipline on a FINAL finding; computes prior_history_count (cross-case), index_policy_matrix, index_calibrated, suggested_action; one PROPOSED per finding"
    roles: [HRBusinessPartner]
    code: 201
    input: [mitigation_count, aggravation_count, recommended_action, "justification?"]
    output: DisciplinaryRecommendation
    side_effects: ["status=PROPOSED", "indexes per calculations.discipline_severity_index"]
  - method: GET
    path: "/api/disciplinary-recommendations"
    description: "List disciplinary recommendations (FK reverse lookup by finding_id)"
    roles: [IntakeCoordinator, Investigator, InvestigationsManager, HRBusinessPartner, GeneralCounsel, ChiefLegalOfficer, ComplianceAuditor]
    code: 200
    input: ["finding_id?", "status?", "recommended_action?", "limit?", "offset?"]
    output: "DisciplinaryRecommendation[]"
    side_effects: []
  - method: GET
    path: "/api/disciplinary-recommendations/{id}"
    description: "Get one disciplinary recommendation"
    roles: [IntakeCoordinator, Investigator, InvestigationsManager, HRBusinessPartner, GeneralCounsel, ChiefLegalOfficer, ComplianceAuditor]
    code: 200
    input: []
    output: DisciplinaryRecommendation
    side_effects: []
  - method: POST
    path: "/api/disciplinary-recommendations/{id}/transition"
    description: "Approve (Manager, SOD vs proposed_by) / reject (Manager, rationale required)"
    roles: [InvestigationsManager]
    code: 200
    input: [to_status, "rationale?"]
    output: DisciplinaryRecommendation
    side_effects: ["per DisciplinaryRecommendation state machine"]

  # ---- CaseReport ----
  - method: POST
    path: "/api/cases/{id}/reports"
    description: "Create a DRAFT report (OCC on Case.version); supersedes prior DRAFT reports; requires case in FINDINGS, DISPOSITION, or REMEDIATION"
    roles: [Investigator]
    code: 201
    input: [title, distribution_tier, distribution_list, report_privilege_type, expected_case_version]
    output: CaseReport
    side_effects: ["prior DRAFT reports of the case -> SUPERSEDED", "increments Case.version by 1"]
  - method: GET
    path: "/api/reports"
    description: "List case reports (FK reverse lookup by case_id)"
    roles: [IntakeCoordinator, Investigator, InvestigationsManager, HRBusinessPartner, GeneralCounsel, ChiefLegalOfficer, ComplianceAuditor]
    code: 200
    input: ["case_id?", "status?", "distribution_tier?", "limit?", "offset?"]
    output: "CaseReport[]"
    side_effects: []
  - method: GET
    path: "/api/reports/{id}"
    description: "Get one case report"
    roles: [IntakeCoordinator, Investigator, InvestigationsManager, HRBusinessPartner, GeneralCounsel, ChiefLegalOfficer, ComplianceAuditor]
    code: 200
    input: []
    output: CaseReport
    side_effects: []
  - method: POST
    path: "/api/reports/{id}/transition"
    description: "Report machine: LEGAL_REVIEW (all findings FINAL), DISTRIBUTION_APPROVED (GC; pins privilege snapshot), DISTRIBUTED (BOARD tier needs CLO and ACP-clean linkage), RECALLED (GC)"
    roles: [Investigator, GeneralCounsel, ChiefLegalOfficer]
    code: 200
    input: [to_status, "rationale?"]
    output: CaseReport
    side_effects: ["DISTRIBUTION_APPROVED pins pinned_designation_snapshot", "DISTRIBUTED sets distributed_at"]

  # ---- SelfDisclosureDecision ----
  - method: POST
    path: "/api/cases/{id}/self-disclosure-decisions"
    description: "Open a PENDING disclosure decision (OCC on Case.version); supersedes a prior PENDING decision for the same regulator; requires case in FINDINGS or DISPOSITION"
    roles: [GeneralCounsel]
    code: 201
    input: [regulator, decision_deadline, expected_case_version]
    output: SelfDisclosureDecision
    side_effects: ["prior PENDING decision of same case+regulator -> SUPERSEDED", "increments Case.version by 1", "Case.case_priority_score recomputed (urgency term)"]
  - method: GET
    path: "/api/self-disclosure-decisions"
    description: "List disclosure decisions (FK reverse lookup by case_id)"
    roles: [IntakeCoordinator, Investigator, InvestigationsManager, HRBusinessPartner, GeneralCounsel, ChiefLegalOfficer, ComplianceAuditor]
    code: 200
    input: ["case_id?", "regulator?", "status?", "decision?", "limit?", "offset?"]
    output: "SelfDisclosureDecision[]"
    side_effects: []
  - method: GET
    path: "/api/self-disclosure-decisions/{id}"
    description: "Get one disclosure decision"
    roles: [IntakeCoordinator, Investigator, InvestigationsManager, HRBusinessPartner, GeneralCounsel, ChiefLegalOfficer, ComplianceAuditor]
    code: 200
    input: []
    output: SelfDisclosureDecision
    side_effects: []
  - method: POST
    path: "/api/self-disclosure-decisions/{id}/transition"
    description: "DECIDED (CLO; records decided_by/at), FILED (GC; DISCLOSE only, 72h cooling-off), OVERRIDDEN (CLO, SOD vs decided_by)"
    roles: [ChiefLegalOfficer, GeneralCounsel]
    code: 200
    input: [to_status, "decision?", "rationale?"]
    output: SelfDisclosureDecision
    side_effects: ["DECIDED stamps decided_at and recomputes case priority", "FILED stamps filed_at"]

  # ---- RemediationAction ----
  - method: POST
    path: "/api/cases/{id}/remediation-actions"
    description: "Create an OPEN remediation action; requires case in DISPOSITION or REMEDIATION"
    roles: [HRBusinessPartner]
    code: 201
    input: [action_type, owner_ref, due_date, description]
    output: RemediationAction
    side_effects: ["status=OPEN", "Case.open_remediation_count recomputed (+1)"]
  - method: GET
    path: "/api/remediation-actions"
    description: "List remediation actions (FK reverse lookup by case_id); is_overdue recomputed against the logical clock on read"
    roles: [IntakeCoordinator, Investigator, InvestigationsManager, HRBusinessPartner, GeneralCounsel, ChiefLegalOfficer, ComplianceAuditor]
    code: 200
    input: ["case_id?", "owner_ref?", "status?", "action_type?", "limit?", "offset?"]
    output: "RemediationAction[]"
    side_effects: []
  - method: GET
    path: "/api/remediation-actions/{id}"
    description: "Get one remediation action"
    roles: [IntakeCoordinator, Investigator, InvestigationsManager, HRBusinessPartner, GeneralCounsel, ChiefLegalOfficer, ComplianceAuditor]
    code: 200
    input: []
    output: RemediationAction
    side_effects: []
  - method: POST
    path: "/api/remediation-actions/{id}/transition"
    description: "Remediation machine: IN_PROGRESS (HR), AWAITING_VERIFICATION (HR), VERIFIED (Auditor, SOD vs owner_ref), reject back to IN_PROGRESS (Auditor), WAIVED (GC)"
    roles: [HRBusinessPartner, ComplianceAuditor, GeneralCounsel]
    code: 200
    input: [to_status, "rationale?"]
    output: RemediationAction
    side_effects: ["VERIFIED/WAIVED recompute Case.open_remediation_count (-1)"]

  # ---- PatternAlert ----
  - method: POST
    path: "/api/pattern-alerts/scan"
    description: "Run cross-case pattern analysis over the rolling window ending at current_utc (window_days default 90). Creates PatternAlert rows idempotently keyed by (alert_type, alert_key, window_start): an existing OPEN/ACKNOWLEDGED alert with the same key is returned, not duplicated. Rules: REPEAT_SUBJECT >= 2 cases sharing a subject employee_ref; CATEGORY_SPIKE >= 3 cases sharing allegation_category; DEPARTMENT_CLUSTER >= 3 cases sharing department; RETALIATION_RISK: a witness_ref of an earlier-created case appears as a subject employee_ref of a later-created case within the window. DISMISSED cases never qualify."
    roles: [ComplianceAuditor]
    code: 200
    input: ["window_days?"]
    output: "PatternAlert[]"
    side_effects: ["creates alerts with pattern_risk_score/risk_tier per calculations.pattern_risk_score"]
  - method: GET
    path: "/api/pattern-alerts"
    description: "List pattern alerts"
    roles: [IntakeCoordinator, Investigator, InvestigationsManager, HRBusinessPartner, GeneralCounsel, ChiefLegalOfficer, ComplianceAuditor]
    code: 200
    input: ["alert_type?", "alert_key?", "status?", "limit?", "offset?"]
    output: "PatternAlert[]"
    side_effects: []
  - method: GET
    path: "/api/pattern-alerts/{id}"
    description: "Get one pattern alert"
    roles: [IntakeCoordinator, Investigator, InvestigationsManager, HRBusinessPartner, GeneralCounsel, ChiefLegalOfficer, ComplianceAuditor]
    code: 200
    input: []
    output: PatternAlert
    side_effects: []
  - method: POST
    path: "/api/pattern-alerts/{id}/transition"
    description: "ACKNOWLEDGED / ESCALATED (cascades pattern_escalated onto window cases and recomputes their priority) / DISMISSED (rationale required)"
    roles: [InvestigationsManager]
    code: 200
    input: [to_status, "rationale?"]
    output: PatternAlert
    side_effects: ["per PatternAlert state machine incl. escalation cascade to Case.pattern_escalated and case_priority_score"]

  # ---- Test-driving clock ----
  - method: POST
    path: "/api/_clock/set_current_utc"
    description: "Set the logical clock (test-driving endpoint). Server startup default is exactly 2026-05-01T00:00:00Z; before any set_current_utc call the logical clock reads that default and never falls back to wall-clock time."
    roles: [SystemAdmin]
    code: 200
    input: [to_iso8601]
    output: { current_utc: datetime }
    side_effects: ["logical clock advanced; all deadline/cooling-off/overdue/window rules read this clock"]

# =============================================================================
# §1.6 Error Code Catalog
# =============================================================================
errors:
  - { id: ERR_UNAUTHENTICATED, http: 401, condition: "Missing/unknown X-User-Role or missing X-User-ID" }
  - { id: ERR_MISSING_IDEMPOTENCY_KEY, http: 400, condition: "POST without Idempotency-Key header" }
  - { id: ERR_IDEMPOTENCY_REPLAY_MISMATCH, http: 409, condition: "Idempotency-Key replayed with a different payload than the original request" }
  - { id: ERR_UNAUTHORIZED_ROLE, http: 403, condition: "Caller role not in endpoint roles, or per-transition actor restriction violated (e.g. non-CLO distributing a BOARD report, non-Manager approving a plan)" }
  - { id: ERR_NOT_FOUND, http: 404, condition: "Path or body-referenced resource id does not exist" }
  - { id: ERR_VALIDATION, http: 400, condition: "Malformed field: unknown enum member, bad datetime, non-positive size_bytes, planned_end <= planned_start, empty distribution_list, reporter_ref present while is_anonymous=true, mitigation/aggravation counts negative" }
  - { id: ERR_MISSING_REQUIRED_FIELD, http: 400, condition: "Required field absent (incl. conditional: completion_note on COMPLETED, new_start/new_end on reschedule, decision on DECIDED, rationale where mandated, severity/department on triage)" }
  - { id: ERR_STALE_VERSION, http: 412, condition: "expected_case_version does not match the Case's current version on create-with-supersede endpoints" }
  - { id: ERR_INVALID_STATE, http: 409, condition: "Entity not in a from-state permitting the transition; includes terminal lockdown and wrong-case-status contextual creates" }
  - { id: ERR_SOD_PLAN_APPROVAL, http: 403, condition: "Plan approver/rejecter X-User-ID equals the plan's drafter_id" }
  - { id: ERR_SOD_FINDING_FINALIZATION, http: 403, condition: "Finding finalizer X-User-ID equals the case's lead_investigator_id" }
  - { id: ERR_SOD_DISCIPLINE_APPROVAL, http: 403, condition: "Recommendation approver X-User-ID equals proposed_by" }
  - { id: ERR_SOD_REMEDIATION_VERIFICATION, http: 403, condition: "Remediation verifier X-User-ID equals owner_ref" }
  - { id: ERR_SOD_DISCLOSURE_OVERRIDE, http: 403, condition: "Disclosure overrider X-User-ID equals decided_by" }
  - { id: ERR_UPJOHN_REQUIRED, http: 409, condition: "Interview completion attempted without a recorded Upjohn warning (upjohn_delivered_at null)" }
  - { id: ERR_PRIVILEGE_PENDING, http: 409, condition: "Evidence admit/restore blocked by a DESIGNATED (unconfirmed) privilege designation on the item; or report distribution-approval blocked by DESIGNATED/CHALLENGED designations on the case" }
  - { id: ERR_PRIVILEGED_DISTRIBUTION, http: 403, condition: "BOARD-tier distribution while evidence linked to case findings carries an active (DESIGNATED/CONFIRMED) ACP designation" }
  - { id: ERR_COOLING_OFF, http: 409, condition: "Disclosure filing attempted before decided_at + 72 hours" }
  - { id: ERR_ORDERED_NOTICE_RESTRICTION, http: 409, condition: "Release of a regulator-ordered preservation notice while the case is not CLOSED" }
  - { id: ERR_DISCLOSURE_REQUIRED, http: 409, condition: "CRITICAL case cannot move DISPOSITION->REMEDIATION while no disclosure decision is DECIDED/FILED/OVERRIDDEN or any is PENDING" }
  - { id: ERR_DECISION_NOT_DISCLOSE, http: 409, condition: "Filing attempted on a decision whose decision != DISCLOSE" }
  - { id: ERR_PLAN_SUBMITTED_EXISTS, http: 409, condition: "New plan creation while another plan of the case is SUBMITTED" }
  - { id: ERR_DUPLICATE_SUBJECT, http: 409, condition: "Subject with the same employee_ref already ACTIVE on the case" }
  - { id: ERR_DUPLICATE_DESIGNATION, http: 409, condition: "An active (DESIGNATED/CONFIRMED/CHALLENGED) designation already exists for (target_type, target_id)" }
  - { id: ERR_INTERVIEWER_OVERLAP, http: 409, condition: "Interviewer already has a SCHEDULED/UPJOHN_DELIVERED interview whose half-open [start, end) intersects the requested window (adjacent end==start is allowed)" }
  - { id: ERR_ROOM_OVERLAP, http: 409, condition: "Room already booked by a SCHEDULED/UPJOHN_DELIVERED interview whose window, expanded by +/-15 minutes, intersects the requested window (back-to-back with < 15 minute gap is rejected)" }
  - { id: ERR_SCOPE_OVERLAP, http: 409, condition: "Another CollectionScope with the same (custodian_ref, data_source) in {PROPOSED, APPROVED, IN_PROGRESS} has a closed planned window [planned_start, planned_end] intersecting the requested one (touching endpoints conflict)" }
  - { id: ERR_OPEN_RECOMMENDATION_EXISTS, http: 409, condition: "A PROPOSED disciplinary recommendation already exists for the finding" }
  - { id: ERR_THRESHOLD_NOT_MET, http: 409, condition: "finding_type=SUBSTANTIATED requested while substantiation_score_final < 0.70" }
  - { id: ERR_EMPTY_COLLECTION, http: 409, condition: "Scope COLLECTED attempted with zero linked evidence items in {LOGGED, UNDER_REVIEW, ADMITTED}" }
  - { id: ERR_OPEN_COLLECTION_SCOPES, http: 409, condition: "Case FIELDWORK->FINDINGS attempted while scopes remain in {PROPOSED, APPROVED, IN_PROGRESS}" }
  - { id: ERR_PRESERVATION_INCOMPLETE, http: 409, condition: "Case FIELDWORK->FINDINGS attempted while preservation_completeness_ratio != 1.00 (an ISSUED notice is unacknowledged)" }
  - { id: ERR_FINDINGS_NOT_FINAL, http: 409, condition: "Case FINDINGS->DISPOSITION or report LEGAL_REVIEW attempted while a finding is DRAFT/CALIBRATED/CHALLENGED" }
  - { id: ERR_UNRESOLVED_DISCIPLINE, http: 409, condition: "Case DISPOSITION->REMEDIATION attempted while a recommendation is PROPOSED" }
  - { id: ERR_OPEN_REMEDIATION, http: 409, condition: "Case REMEDIATION->CLOSED attempted while a remediation action is OPEN/IN_PROGRESS/AWAITING_VERIFICATION" }
  - { id: ERR_SUBJECT_HAS_OPEN_FINDINGS, http: 409, condition: "Subject CLEARED attempted while findings in {DRAFT, CALIBRATED, CHALLENGED} reference it" }
  - { id: ERR_CUSTODIAN_NOT_PRESERVED, http: 409, condition: "Scope create/begin: custodian not covered by an ISSUED/ACKNOWLEDGED preservation notice whose scope covers the data_source (ALL_DATA covers all; EMAIL covers EMAIL; DEVICES covers DEVICE; CHAT covers CHAT; FILES covers FILES)" }
  - { id: ERR_NOTICE_NOT_ACKNOWLEDGED, http: 409, condition: "Scope APPROVED attempted while the covering notice is ISSUED but not yet ACKNOWLEDGED" }
  - { id: ERR_ALLEGATION_NOT_LINKED, http: 409, condition: "Finding references an allegation not in LINKED status or not belonging to the case" }
  - { id: ERR_SUBJECT_NOT_IN_CASE, http: 409, condition: "Finding references a subject id that does not belong to the case" }
  - { id: ERR_EVIDENCE_NOT_REVIEWABLE, http: 409, condition: "Finding links evidence that does not belong to the case or is not in {UNDER_REVIEW, ADMITTED}" }
  - { id: ERR_TARGET_CASE_MISMATCH, http: 409, condition: "Privilege designation target does not belong to the designation's case" }
  - { id: ERR_INTERVIEW_WINDOW_EXPIRED, http: 409, condition: "UPJOHN_DELIVERED attempted after scheduled_end" }
  - { id: ERR_NO_SHOW_TOO_EARLY, http: 409, condition: "NO_SHOW attempted at or before scheduled_end" }
  - { id: ERR_SCHEDULE_IN_PAST, http: 409, condition: "Reschedule with new_start before the current logical clock" }

# =============================================================================
# §1.7 RBAC Matrix (segregation-of-duties model; all identities opaque)
# =============================================================================
roles:
  - name: IntakeCoordinator
    description: "Allegation intake and triage desk; owns case creation, triage, dismissal, and allegation lifecycle. Cannot approve plans, designate privilege, or finalize findings."
    identity: opaque
    exclusive_operations:
      - "POST /api/cases"
      - "POST /api/cases/{id}/allegations"
    shared_operations:
      - "POST /api/cases/{id}/transition (INTAKE->TRIAGED, INTAKE/TRIAGED->DISMISSED only)"
      - "POST /api/allegations/{id}/transition"
      - "All GET endpoints"
  - name: Investigator
    description: "Case investigator; drafts plans, attaches subjects, proposes/runs collection scopes, logs and reviews evidence, schedules and conducts interviews, drafts findings and reports."
    identity: opaque
    exclusive_operations:
      - "POST /api/cases/{id}/plans"
      - "POST /api/cases/{id}/subjects"
      - "POST /api/cases/{id}/collection-scopes"
      - "POST /api/collection-scopes/{id}/evidence-items"
      - "POST /api/evidence-items/{id}/transition"
      - "POST /api/cases/{id}/interviews"
      - "POST /api/interviews/{id}/transition"
      - "POST /api/cases/{id}/findings"
      - "POST /api/cases/{id}/reports"
    shared_operations:
      - "POST /api/plans/{id}/transition (SUBMITTED only)"
      - "POST /api/subjects/{id}/transition"
      - "POST /api/collection-scopes/{id}/transition (IN_PROGRESS, COLLECTED, WITHDRAWN)"
      - "POST /api/cases/{id}/transition (FIELDWORK->FINDINGS only)"
      - "POST /api/reports/{id}/transition (LEGAL_REVIEW only)"
      - "All GET endpoints"
  - name: InvestigationsManager
    description: "Approves plans, scopes, findings, and discipline; drives case stage gates, reopen, and pattern-alert handling. SOD-blocked from approving plans they drafted, finalizing findings on cases they lead, and approving recommendations they proposed."
    identity: opaque
    exclusive_operations:
      - "POST /api/pattern-alerts/{id}/transition"
      - "POST /api/disciplinary-recommendations/{id}/transition"
    shared_operations:
      - "POST /api/plans/{id}/transition (APPROVED, REJECTED)"
      - "POST /api/collection-scopes/{id}/transition (APPROVED, WITHDRAWN)"
      - "POST /api/findings/{id}/transition (FINAL, CHALLENGED)"
      - "POST /api/subjects/{id}/transition (CLEARED, SEPARATED)"
      - "POST /api/allegations/{id}/transition"
      - "POST /api/cases/{id}/transition (FINDINGS->FIELDWORK, FINDINGS->DISPOSITION, DISPOSITION->REMEDIATION, REMEDIATION->CLOSED, CLOSED->FIELDWORK)"
      - "All GET endpoints"
  - name: HRBusinessPartner
    description: "Calibrates findings and proposes calibrated disciplinary recommendations; owns remediation action lifecycle up to verification submission."
    identity: opaque
    exclusive_operations:
      - "POST /api/findings/{id}/disciplinary-recommendations"
      - "POST /api/cases/{id}/remediation-actions"
    shared_operations:
      - "POST /api/findings/{id}/transition (CALIBRATED incl. recalibration)"
      - "POST /api/remediation-actions/{id}/transition (IN_PROGRESS, AWAITING_VERIFICATION)"
      - "All GET endpoints"
  - name: GeneralCounsel
    description: "Owns legal preservation notices, privilege designations and waivers, report distribution approval/recall, disclosure decision drafting and filing, and remediation waivers."
    identity: opaque
    exclusive_operations:
      - "POST /api/cases/{id}/preservation-notices"
      - "POST /api/preservation-notices/{id}/transition"
      - "POST /api/cases/{id}/privilege-designations"
      - "POST /api/cases/{id}/self-disclosure-decisions"
    shared_operations:
      - "POST /api/privilege-designations/{id}/transition (CONFIRMED, WAIVED)"
