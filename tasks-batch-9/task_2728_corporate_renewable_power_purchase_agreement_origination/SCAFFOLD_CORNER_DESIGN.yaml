  # =========================================================================
  # Guide section 8: cross-cutting complexity layers. §1.0 declares
  # complexity_layers: [optimistic_concurrency, cascading_side_effects,
  # dual_variant_calculation, rate_threshold_triggers]. The three
  # optimistic_concurrency instances below are one per §1.2.1 rule, each using
  # that rule's own write_endpoint and occ_field; the other three layers are
  # already the whole subject of a §1.8 instance and are stubbed.
  # =========================================================================
  - section: complexity_layers
    instances:
      - name: stale_deal_version_blocks_a_second_allocation_that_would_oversubscribe
        claim_type: optimistic_concurrency
        grounds:
          - concurrency_rules.allocation-create-stale-deal
          - errors[ERR_STALE_VERSION]
          - validations.priority_9_ERR_STALE_VERSION
          - endpoints.POST_/ppa/deals/{id}/allocations
          - entities.Deal.fields.unallocated_mw
        distinguishing_aspect: |
          The second allocation is legal in every other respect - 10.000 MW into 10.000 MW
          of remaining headroom, a QUALIFIED buyer, a deal in an accepting state - and is
          refused with 412 purely because the first allocation advanced Deal.version behind
          the proposer's back. Re-reading the deal and resubmitting the SAME body then
          succeeds, which proves the refusal was about the observed version and not the
          payload. The deal version increments on every one of these writes, so the token
          from before the first allocation is stale by exactly one step.
        test_recipe:
          setup:
            - "A TERM_SHEET_ISSUED AGGREGATED 25.000 MW deal with one CONFIRMED 15.000 MW allocation to the anchor, leaving unallocated_mw 10.000."
            - "The deal version as read BEFORE that first allocation is retained as the stale token."
          setup_api_calls:
            - call: "POST /ppa/pricing-nodes"
              payload: { name: "KRAMER JUNCTION 1N", iso: "CAISO", settlement_point_type: "NODE" }
              as: Originator
              as_user_id: "u_orig_1"
              captures: { node_id: $.data.id }
            - call: "POST /ppa/offtakers"
              payload: { legal_name: "Northwind Retail Inc", credit_rating: "A", rating_agency: "SP", reported_ebitda_usd: 60000000.00, net_debt_to_ebitda: 2.5, disclosure_framework: "CDP_AND_TCFD", has_science_based_target: true, re100_member: true, scope2_target_year: 2030, registry_account_id: "WREGIS-ACC-00417" }
              as: Originator
              as_user_id: "u_orig_1"
              captures: { buyer_id: $.data.id }
            - call: "POST /ppa/offtakers/${buyer_id}/submit-qualification"
              payload: {}
              as: Originator
              as_user_id: "u_orig_1"
            - call: "POST /ppa/offtakers/${buyer_id}/qualification-decision"
              payload: { decision: "QUALIFY" }
              as: CreditOfficer
              as_user_id: "u_credit_1"
            - call: "POST /ppa/offtakers"
              payload: { legal_name: "Cascadia Data Centers LLC", credit_rating: "A", rating_agency: "SP", reported_ebitda_usd: 60000000.00, net_debt_to_ebitda: 2.5, disclosure_framework: "CDP_AND_TCFD", has_science_based_target: true, re100_member: true, scope2_target_year: 2030, registry_account_id: "WREGIS-ACC-00555" }
              as: Originator
              as_user_id: "u_orig_1"
              captures: { second_id: $.data.id }
            - call: "POST /ppa/offtakers/${second_id}/submit-qualification"
              payload: {}
              as: Originator
              as_user_id: "u_orig_1"
            - call: "POST /ppa/offtakers/${second_id}/qualification-decision"
              payload: { decision: "QUALIFY" }
              as: CreditOfficer
              as_user_id: "u_credit_1"
            - call: "POST /ppa/projects"
              payload: { name: "Kramer Junction Solar I", technology: "SOLAR", capacity_mw: 100.000, node_id: "${node_id}", cod_target_date: "2029-06-01T00:00:00Z", p50_annual_mwh: 245280.00 }
              as: Originator
              as_user_id: "u_orig_1"
              captures: { project_id: $.data.id }
            - call: "POST /ppa/deals"
              payload: { project_id: "${project_id}", anchor_offtaker_id: "${buyer_id}", settlement_point_id: "${node_id}", product_type: "AGGREGATED", contracted_mw: 25.000, term_years: 12, first_delivery_year: 2026, commercial_operation_deadline: "2029-12-31T00:00:00Z", settlement_frequency: "HOURLY", base_fixed_price_usd_per_mwh: 22.00, escalation_pct_per_year: 0.0, shape_product: "AS_GENERATED", basis_responsibility: "SHARED" }
              as: Originator
              as_user_id: "u_orig_1"
              captures: { deal_id: $.data.id }
            - call: "POST /ppa/deals/${deal_id}/rounds"
              payload: { proposed_by: "DEVELOPER", proposed_fixed_price_usd_per_mwh: 22.00, proposed_escalation_pct_per_year: 0.0, proposed_shape_product: "AS_GENERATED", proposed_basis_responsibility: "SHARED", response_deadline: "2026-09-01T00:00:00Z" }
              as: Originator
              as_user_id: "u_orig_1"
            - call: "GET /ppa/deals/${deal_id}"
              as: Originator
              as_user_id: "u_orig_1"
              captures: { deal_v_stale: $.data.version }
            - call: "POST /ppa/deals/${deal_id}/allocations"
              payload: { offtaker_id: "${buyer_id}", allocated_mw: 15.000, expected_deal_version: "${deal_v_stale}", joint_and_several: true }
              as: Originator
              as_user_id: "u_orig_1"
              captures: { alloc_anchor: $.data.id }
            - call: "POST /ppa/allocations/${alloc_anchor}/decision"
              payload: { decision: "CONFIRM" }
              as: OfftakerRep
              as_user_id: "${buyer_id}"
          trigger:
            - call: "POST /ppa/deals/${deal_id}/allocations"
              payload: { offtaker_id: "${second_id}", allocated_mw: 10.000, expected_deal_version: "${deal_v_stale}", joint_and_several: true }
              as: Originator
              as_user_id: "u_orig_1"
            - call: "GET /ppa/deals/${deal_id}"
              as: Originator
              as_user_id: "u_orig_1"
              captures: { deal_v_fresh: $.data.version }
            - call: "POST /ppa/deals/${deal_id}/allocations"
              payload: { offtaker_id: "${second_id}", allocated_mw: 10.000, expected_deal_version: "${deal_v_fresh}", joint_and_several: true }
              as: Originator
              as_user_id: "u_orig_1"
          assert:
            - "the first trigger returns 412 with error_id ERR_STALE_VERSION: the first allocation and its confirmation both advanced Deal.version past ${deal_v_stale}"
            - "no DealAllocation row was created by that refusal - GET /ppa/deals/${deal_id}/allocations returns total_count 1 - and Deal.${deal_id}.unallocated_mw is still 10.000"
            - "${deal_v_fresh} is strictly greater than ${deal_v_stale}, because the allocation create and the CONFIRM decision each incremented Deal.version"
            - "the third trigger returns 201 with the identical body under the refreshed token: DealAllocation.status PROPOSED, allocated_mw 10.000"
            - "Deal.${deal_id}.unallocated_mw is then 0.000 = 25.000 - (15.000 + 10.000), because unallocated_mw nets PROPOSED as well as CONFIRMED shares, while confirmed_allocated_mw is still 15.000 and Deal.version has advanced once more"

      - name: stale_deal_version_blocks_the_second_of_two_stacked_credit_support_posts
        claim_type: optimistic_concurrency
        grounds:
          - concurrency_rules.credit-support-post-stale-deal
          - errors[ERR_STALE_VERSION]
          - endpoints.POST_/ppa/credit-support/{id}/post
          - entities.Deal.fields.posted_credit_support_usd
        distinguishing_aspect: |
          Instruments are designed to stack, so nothing about the second post is illegal -
          the same OCC token that worked for the first cash instrument is simply one step
          behind after that post recomputed posted_credit_support_usd. The refusal leaves
          the second instrument PROPOSED with haircut_pct and eligible_credit_usd still
          null, proving no partial valuation happened, and the retry under the refreshed
          token produces the exact sum of the two eligible amounts.
        test_recipe:
          setup:
            - "A DRAFT 25.000 MW deal for the QUALIFIED Northwind buyer with credit_support_required_usd 0.00, carrying two PROPOSED CASH_COLLATERAL instruments of 300000.00 and 250000.00."
            - "The deal version as read BEFORE either post is retained as the stale token."
          setup_api_calls:
            - call: "POST /ppa/pricing-nodes"
              payload: { name: "KRAMER JUNCTION 1N", iso: "CAISO", settlement_point_type: "NODE" }
              as: Originator
