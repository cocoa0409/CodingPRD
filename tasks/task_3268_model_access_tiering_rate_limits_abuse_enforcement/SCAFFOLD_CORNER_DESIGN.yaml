# =============================================================================
# §1.9 Scaffold Corner Design — Coverage Index for Non-Difficulty Tests
# Task: task_3268_model_access_tiering_rate_limits_abuse_enforcement
# Breadth probe. §1.8 already-covered corners appear as excluded_because stubs.
# Trimmed endpoint surface (40 endpoints).
# =============================================================================
scaffold_corner_design:

  # ===========================================================================
  - section: entities
    instances:

      - name: organization_create_returns_declared_fields_and_starts_provisional
        claim_type: Creation
        grounds:
          - entities.Organization
          - endpoints.POST_/organizations
        distinguishing_aspect: "A fresh Organization created with only legal_name returns 201 with status PROVISIONAL, tier TIER_1, lifetime_spend_cents 0, qualifying_payment_count 0, credit_balance_cents 0, version 1, and system-generated id / created_at / updated_at."
        test_recipe:
          setup:
            - "Logical clock at 2026-09-01T00:00:00Z. Empty database."
          setup_api_calls:
            - &clock_set
              call: "POST /_clock/set_current_utc"
              payload: { current_utc: "2026-09-01T00:00:00Z" }
              as: PlatformAdmin
          trigger:
            - &org_create
              call: "POST /organizations"
              payload: { legal_name: "Fresh Onboard Inc" }
              as: PlatformAdmin
              captures: { org_id: $.data.id, org_status: $.data.status, org_tier: $.data.tier }
          assert:
            - "response status is 201 and response_type is object"
            - "Organization.${org_id}.status == PROVISIONAL and tier == TIER_1"
            - "lifetime_spend_cents == 0, qualifying_payment_count == 0, credit_balance_cents == 0"
            - "version == 1; id, created_at, updated_at present and non-null"

      - name: organization_get_returns_stored_data_unchanged
        claim_type: Retrieval
        grounds:
          - entities.Organization
          - endpoints.GET_/organizations/{id}
        distinguishing_aspect: "GET round-trips every stored field including the null pinned_model_version_id and enterprise_agreement_id."
        test_recipe:
          setup:
            - "Logical clock set. One organization created."
          setup_api_calls:
            - *clock_set
            - *org_create
          trigger:
            - call: "GET /organizations/${org_id}"
              payload: {}
              as: PlatformAdmin
          assert:
            - "response status is 200"
            - "Organization.${org_id}.legal_name == \"Fresh Onboard Inc\""
            - "pinned_model_version_id is null and enterprise_agreement_id is null"

      - name: organization_get_unknown_id_returns_not_found
        claim_type: Not Found
        grounds:
          - endpoints.GET_/organizations/{id}
          - errors.ERR_NOT_FOUND
        distinguishing_aspect: "A syntactically valid UUID that does not correspond to any organization produces 404 ERR_NOT_FOUND, not 400."
        test_recipe:
          setup:
            - "Logical clock set. No organizations created."
          setup_api_calls:
            - *clock_set
          trigger:
            - call: "GET /organizations/00000000-0000-4000-8000-000000000000"
              payload: {}
              as: PlatformAdmin
              captures: { error_id: $.data.error_id }
          assert:
            - "response status is 404 and error_id == ERR_NOT_FOUND"
            - "response_type is error and data carries both error_id and message"

      - name: organization_create_missing_legal_name_returns_invalid_request
        claim_type: Required Fields
        grounds:
          - entities.Organization.fields.legal_name
          - errors.ERR_INVALID_REQUEST
        distinguishing_aspect: "legal_name is required input with no default; omitting it yields 400 ERR_INVALID_REQUEST."
        test_recipe:
          setup:
            - "Logical clock set."
          setup_api_calls:
            - *clock_set
          trigger:
            - call: "POST /organizations"
              payload: {}
              as: PlatformAdmin
              captures: { error_id: $.data.error_id }
          assert:
            - "response status is 400 and error_id == ERR_INVALID_REQUEST"

      - name: payment_event_immutable_no_update_endpoint
        claim_type: Immutability
        grounds:
          - entities.PaymentEvent
        distinguishing_aspect: "PaymentEvent has common_fields: false; no PATCH endpoint exists; only the PENDING -> SETTLED transition via /settle."
        test_recipe:
          setup:
            - "Logical clock set. Org with one PENDING payment."
          setup_api_calls:
            - *clock_set
            - *org_create
            - call: "POST /payment-events"
              payload: { organization_id: "${org_id}", kind: "PREPAID_TOPUP", amount_cents: 1000000 }
              as: PlatformAdmin
              captures: { pe_id: $.data.id }
          trigger:
            - call: "POST /payment-events/${pe_id}/settle"
              payload: {}
              as: PlatformAdmin
          assert:
            - "PaymentEvent settles successfully via the dedicated transition endpoint"
            - "no PATCH /payment-events/{id} endpoint is declared in §1.5 — updates are forbidden"

      - name: model_version_pricing_cached_must_be_less_than_input
        claim_type: Type Constraints
        grounds:
          - entities.ModelVersion.fields.pricing
          - errors.ERR_INVALID_REQUEST
        distinguishing_aspect: "cached_per_mtok_cents must be strictly less than input_per_mtok_cents; equal values rejected."
        test_recipe:
          setup:
            - "Logical clock set."
          setup_api_calls:
            - *clock_set
          trigger:
            - call: "POST /model-versions"
              payload: { model_slug: "claude-bad", version_tag: "0-1", pricing: { input_per_mtok_cents: 100, output_per_mtok_cents: 500, cached_per_mtok_cents: 100 } }
              as: PlatformAdmin
              captures: { error_id: $.data.error_id }
          assert:
            - "response status is 400 and error_id == ERR_INVALID_REQUEST"

  # ===========================================================================
  - section: state_machines
    instances:

      - name: payment_settle_twice_returns_invalid_state
        claim_type: Idempotency
        grounds:
          - state_machines.PaymentEvent.PENDING_to_SETTLED
          - errors.ERR_INVALID_STATE
        distinguishing_aspect: "SETTLED is terminal; second settle on an already-SETTLED payment returns ERR_INVALID_STATE and aggregates are not double-counted."
        test_recipe:
          setup:
            - "Logical clock set. Org with settled payment."
          setup_api_calls:
            - *clock_set
            - *org_create
            - call: "POST /payment-events"
              payload: { organization_id: "${org_id}", kind: "PREPAID_TOPUP", amount_cents: 1000 }
              as: PlatformAdmin
              captures: { pe_id: $.data.id }
            - call: "POST /payment-events/${pe_id}/settle"
              payload: {}
              as: PlatformAdmin
          trigger:
            - call: "POST /payment-events/${pe_id}/settle"
              payload: {}
              as: PlatformAdmin
              captures: { error_id: $.data.error_id }
            - call: "GET /organizations/${org_id}"
              payload: {}
              as: PlatformAdmin
              captures: { spend: $.data.lifetime_spend_cents }
          assert:
            - "second settle returns 409 ERR_INVALID_STATE"
            - "lifetime_spend_cents == 1000 (not double-counted)"

      - name: organization_terminated_lockdown_no_transitions
        claim_type: Terminal State Lockdown
        grounds:
          - state_machines.Organization
        distinguishing_aspect: "Once TERMINATED, no further transitions are valid; activate returns ERR_INVALID_STATE."
        test_recipe:
          setup:
            - "Logical clock set. Org terminated via CRITICAL case."
          setup_api_calls:
            - *clock_set
            - *org_create
            - call: "POST /payment-events"
              payload: { organization_id: "${org_id}", kind: "PREPAID_TOPUP", amount_cents: 1000000 }
              as: PlatformAdmin
              captures: { p1: $.data.id }
            - call: "POST /payment-events/${p1}/settle"
              payload: {}
              as: PlatformAdmin
            - call: "POST /organizations/${org_id}/activate"
              payload: {}
              as: PlatformAdmin
            - call: "POST /abuse-cases"
              payload: { organization_id: "${org_id}", source: "MANUAL", severity: "CRITICAL" }
              as: TrustAnalyst
              captures: { case_id: $.data.id }
            - call: "POST /abuse-cases/${case_id}/claim"
              payload: {}
              as: TrustAnalyst
              as_user_id: "analyst-1"
              captures: { cv: $.data.version }
            - call: "POST /abuse-cases/${case_id}/actions"
              payload: { action_type: "TERMINATE", expected_abuse_case_version: "${cv}" }
              as: TrustLead
              as_user_id: "lead-1"
          trigger:
            - call: "POST /organizations/${org_id}/activate"
              payload: {}
              as: PlatformAdmin
              captures: { error_id: $.data.error_id }
          assert:
            - "response status is 409 and error_id == ERR_INVALID_STATE"

      - name: model_version_initial_state_is_draft
        claim_type: Initial State
        grounds:
          - state_machines.ModelVersion
        distinguishing_aspect: "Newly created ModelVersion has status == DRAFT, never GATED or ACTIVE directly."
        test_recipe:
          setup:
            - "Logical clock set."
          setup_api_calls:
            - *clock_set
          trigger:
            - call: "POST /model-versions"
              payload: { model_slug: "claude-sonnet", version_tag: "4-5", pricing: { input_per_mtok_cents: 300, output_per_mtok_cents: 1500, cached_per_mtok_cents: 30 } }
              as: PlatformAdmin
              captures: { mv_status: $.data.status }
          assert:
            - "ModelVersion.status == DRAFT"

      - name: appeal_grant_cascades_reinstate_organization
        claim_type: Side Effect Execution
        grounds:
          - state_machines.Appeal.PENDING_to_GRANTED
          - state_machines.Organization.RESTRICTED_to_ACTIVE
        distinguishing_aspect: "Granting an appeal revokes the action, transitions the case to REINSTATED, and restores Organization to ACTIVE."
        test_recipe:
          setup:
            - "Logical clock set. Org RESTRICTED via issued RESTRICT action; appeal PENDING."
          setup_api_calls:
            - *clock_set
            - *org_create
            - call: "POST /payment-events"
              payload: { organization_id: "${org_id}", kind: "PREPAID_TOPUP", amount_cents: 1000000 }
              as: PlatformAdmin
              captures: { p1: $.data.id }
            - call: "POST /payment-events/${p1}/settle"
              payload: {}
              as: PlatformAdmin
            - call: "POST /organizations/${org_id}/activate"
              payload: {}
              as: PlatformAdmin
            - call: "POST /abuse-cases"
              payload: { organization_id: "${org_id}", source: "MANUAL", severity: "MEDIUM" }
              as: TrustAnalyst
              captures: { case_id: $.data.id }
            - call: "POST /abuse-cases/${case_id}/claim"
              payload: {}
              as: TrustAnalyst
              as_user_id: "analyst-1"
              captures: { cv: $.data.version }
            - call: "POST /abuse-cases/${case_id}/actions"
              payload: { action_type: "RESTRICT", expected_abuse_case_version: "${cv}" }
              as: TrustAnalyst
              as_user_id: "analyst-1"
            - call: "POST /appeals"
              payload: { abuse_case_id: "${case_id}" }
              as: OrganizationAdmin
              as_user_id: "${org_id}"
              captures: { appeal_id: $.data.id }
          trigger:
            - call: "POST /appeals/${appeal_id}/grant"
              payload: {}
              as: TrustLead
              as_user_id: "lead-other"
            - call: "GET /organizations/${org_id}"
              payload: {}
              as: TrustLead
              captures: { org_status: $.data.status }
            - call: "GET /abuse-cases/${case_id}"
              payload: {}
              as: TrustLead
              captures: { case_status: $.data.status }
            - call: "GET /abuse-cases/${case_id}/actions"
              payload: {}
              as: TrustLead
          assert:
            - "Appeal.${appeal_id}.status == GRANTED"
            - "AbuseCase.${case_id}.status == REINSTATED"
            - "Organization.${org_id}.status == ACTIVE (pre-action posture restored)"
            - "the issued AbuseAction has revoked_at non-null"

  # ===========================================================================
  - section: calculations
    instances:

      - name: tier_progression_requires_both_spend_and_count
        claim_type: Constants Applied
        grounds:
          - calculations.tier_progression
        distinguishing_aspect: "TIER_2 requires spend >= 5_000_000 AND count >= 5 — both constants must hold; meeting only the count keeps TIER_1."
        test_recipe:
          setup:
            - "Logical clock set. Org with five settled 1000-cent topups (count 5, spend 5000 cents)."
          setup_api_calls:
            - *clock_set
            - *org_create
            - call: "POST /payment-events"
              payload: { organization_id: "${org_id}", kind: "PREPAID_TOPUP", amount_cents: 1000 }
              as: PlatformAdmin
              captures: { x1: $.data.id }
            - call: "POST /payment-events/${x1}/settle"
              payload: {}
              as: PlatformAdmin
            - call: "POST /payment-events"
              payload: { organization_id: "${org_id}", kind: "PREPAID_TOPUP", amount_cents: 1000 }
              as: PlatformAdmin
              captures: { x2: $.data.id }
            - call: "POST /payment-events/${x2}/settle"
              payload: {}
              as: PlatformAdmin
            - call: "POST /payment-events"
              payload: { organization_id: "${org_id}", kind: "PREPAID_TOPUP", amount_cents: 1000 }
              as: PlatformAdmin
              captures: { x3: $.data.id }
            - call: "POST /payment-events/${x3}/settle"
              payload: {}
              as: PlatformAdmin
            - call: "POST /payment-events"
              payload: { organization_id: "${org_id}", kind: "PREPAID_TOPUP", amount_cents: 1000 }
              as: PlatformAdmin
              captures: { x4: $.data.id }
            - call: "POST /payment-events/${x4}/settle"
              payload: {}
              as: PlatformAdmin
            - call: "POST /payment-events"
              payload: { organization_id: "${org_id}", kind: "PREPAID_TOPUP", amount_cents: 1000 }
              as: PlatformAdmin
              captures: { x5: $.data.id }
            - call: "POST /payment-events/${x5}/settle"
              payload: {}
              as: PlatformAdmin
          trigger:
            - call: "GET /organizations/${org_id}"
              payload: {}
              as: PlatformAdmin
              captures: { tier: $.data.tier, count: $.data.qualifying_payment_count }
          assert:
            - "qualifying_payment_count == 5"
            - "tier == TIER_1 (spend 5000 < 5_000_000 despite count 5)"

      - name: input_set_filtering_excludes_pending_payments
        claim_type: Input Set Filtering
        grounds:
          - calculations.tier_progression
        distinguishing_aspect: "PENDING payments never contribute to lifetime_spend_cents or qualifying_payment_count; only SETTLED rows are in the input set."
        test_recipe:
          setup:
            - "Logical clock set. Org with one settled and one still-PENDING payment."
          setup_api_calls:
            - *clock_set
            - *org_create
            - call: "POST /payment-events"
              payload: { organization_id: "${org_id}", kind: "PREPAID_TOPUP", amount_cents: 1000 }
              as: PlatformAdmin
              captures: { p_ok: $.data.id }
            - call: "POST /payment-events/${p_ok}/settle"
              payload: {}
              as: PlatformAdmin
            - call: "POST /payment-events"
              payload: { organization_id: "${org_id}", kind: "PREPAID_TOPUP", amount_cents: 999999 }
              as: PlatformAdmin
              captures: { p_pend: $.data.id }
          trigger:
            - call: "GET /organizations/${org_id}"
              payload: {}
              as: PlatformAdmin
              captures: { spend: $.data.lifetime_spend_cents, count: $.data.qualifying_payment_count }
          assert:
            - "lifetime_spend_cents == 1000 (PENDING payment excluded from the input set)"
            - "qualifying_payment_count == 1"

  # ===========================================================================
  - section: validations
    instances:

      - name: period_overlap_blocks_overlapping_invoice
        claim_type: violation_to_error
        grounds:
          - validations.priority_10_business_constraint
          - errors.ERR_PERIOD_OVERLAP
        excluded_because:
          difficulty_instance: resource_temporal_overlap / invoice_period_closed_open_overlap
          rationale: "Asserted as the failure path of the named §1.8 instance."

      - name: insufficient_credit_guarded_on_finalize
        claim_type: violation_to_error
        grounds:
          - validations.priority_15_business_fiscal
          - errors.ERR_INSUFFICIENT_CREDIT
        distinguishing_aspect: "With debit defined as min(total_cents, balance), finalize on an invoice whose total exceeds the balance leaves the balance at exactly 0 (never negative) and succeeds; the ERR_INSUFFICIENT_CREDIT guard exists to reject any implementation path that would underflow."
        test_recipe:
          setup:
            - "Logical clock set. Org ACTIVE with credit_balance 1000000. DRAFT invoice with one line whose amount will total 3000 cents."
          setup_api_calls:
            - *clock_set
            - *org_create
            - call: "POST /payment-events"
              payload: { organization_id: "${org_id}", kind: "PREPAID_TOPUP", amount_cents: 1000000 }
              as: PlatformAdmin
              captures: { p1: $.data.id }
            - call: "POST /payment-events/${p1}/settle"
              payload: {}
              as: PlatformAdmin
            - call: "POST /organizations/${org_id}/activate"
              payload: {}
              as: PlatformAdmin
            - call: "POST /model-versions"
              payload: { model_slug: "claude-sonnet", version_tag: "4-5", pricing: { input_per_mtok_cents: 300, output_per_mtok_cents: 1500, cached_per_mtok_cents: 30 } }
              as: PlatformAdmin
              captures: { mv_id: $.data.id }
            - call: "POST /invoices"
              payload:
                organization_id: "${org_id}"
                period_start: "2026-09-01T00:00:00Z"
                period_end: "2026-09-02T00:00:00Z"
                lines:
                  - { model_version_id: "${mv_id}", kind: "INPUT_TOKENS", quantity: 10000, rate_per_mtok_cents: 300 }
              as: BillingContact
              captures: { inv_id: $.data.id }
          trigger:
            - call: "POST /invoices/${inv_id}/finalize"
              payload: {}
              as: BillingContact
              captures: { total: $.data.total_cents }
            - call: "GET /organizations/${org_id}"
              payload: {}
              as: BillingContact
              captures: { bal: $.data.credit_balance_cents }
          assert:
            - "finalize succeeds; Invoice.${inv_id}.total_cents == 3 (round_half_up(10000 * 300 / 1000000) = 3)"
            - "Organization.credit_balance_cents == 999997 (debit of min(3, 1000000) = 3; balance never goes negative)"

  # ===========================================================================
  - section: endpoints
    instances:

      - name: action_endpoint_activate_transitions_state
        claim_type: Action endpoint
        grounds:
          - endpoints.POST_/organizations/{id}/activate
          - state_machines.Organization.PROVISIONAL_to_ACTIVE
        distinguishing_aspect: "Activate moves PROVISIONAL -> ACTIVE only when at least one settled payment exists; without one it returns ERR_INVALID_STATE."
        test_recipe:
          setup:
            - "Logical clock set. Two PROVISIONAL orgs: org_ready has a settled payment, org_empty has none."
          setup_api_calls:
            - *clock_set
            - *org_create
            - call: "POST /payment-events"
              payload: { organization_id: "${org_id}", kind: "PREPAID_TOPUP", amount_cents: 1000000 }
              as: PlatformAdmin
              captures: { p1: $.data.id }
            - call: "POST /payment-events/${p1}/settle"
              payload: {}
              as: PlatformAdmin
            - call: "POST /organizations"
              payload: { legal_name: "Empty Corp" }
              as: PlatformAdmin
              captures: { org_empty: $.data.id }
          trigger:
            - call: "POST /organizations/${org_empty}/activate"
              payload: {}
              as: PlatformAdmin
              captures: { err_state: $.data.error_id }
            - call: "POST /organizations/${org_id}/activate"
              payload: {}
              as: PlatformAdmin
              captures: { ready_status: $.data.status }
          assert:
            - "activating org_empty returns http 409 and error_id == ERR_INVALID_STATE (precondition unmet)"
            - "activating org_ready succeeds with status == ACTIVE"

      - name: reverse_reachability_get_payment_events
        claim_type: Computed read
        grounds:
          - endpoints.GET_/organizations/{id}/payment-events
        distinguishing_aspect: "Sub-resource GET returns the organization's payments with filters; empty array when none exist."
        test_recipe:
          setup:
            - "Logical clock set. Org with two payments (one topup, one refund)."
          setup_api_calls:
            - *clock_set
            - *org_create
            - call: "POST /payment-events"
              payload: { organization_id: "${org_id}", kind: "PREPAID_TOPUP", amount_cents: 1000 }
              as: PlatformAdmin
            - call: "POST /payment-events"
              payload: { organization_id: "${org_id}", kind: "REFUND", amount_cents: -500 }
              as: PlatformAdmin
          trigger:
            - call: "GET /organizations/${org_id}/payment-events"
              payload: {}
              as: PlatformAdmin
          assert:
            - "response_type is array; total_count == 2"
            - "GET with kind=REFUND returns exactly 1 row"
            - "GET with status=PENDING returns 2 rows (neither settled)"

  # ===========================================================================
  - section: errors
    instances:

      - name: err_rate_limited_triggered_at_cap
        claim_type: violation_to_error
        grounds:
          - errors.ERR_RATE_LIMITED
        excluded_because:
          difficulty_instance: resource_temporal_overlap / rate_limit_window_half_open_minute
          rationale: "The 429 ERR_RATE_LIMITED at exhausted cap+burst is asserted as the failure path of the named §1.8 instance."

      - name: err_appeal_already_pending_triggered
        claim_type: violation_to_error
        grounds:
          - errors.ERR_APPEAL_ALREADY_PENDING
        distinguishing_aspect: "A second PENDING appeal on the same case returns 409 ERR_APPEAL_ALREADY_PENDING."
        test_recipe:
          setup:
            - "Logical clock set. Org RESTRICTED with one appeal already PENDING."
          setup_api_calls:
            - *clock_set
            - *org_create
            - call: "POST /payment-events"
              payload: { organization_id: "${org_id}", kind: "PREPAID_TOPUP", amount_cents: 1000000 }
              as: PlatformAdmin
              captures: { p1: $.data.id }
            - call: "POST /payment-events/${p1}/settle"
              payload: {}
              as: PlatformAdmin
            - call: "POST /organizations/${org_id}/activate"
              payload: {}
              as: PlatformAdmin
            - call: "POST /abuse-cases"
              payload: { organization_id: "${org_id}", source: "MANUAL", severity: "MEDIUM" }
              as: TrustAnalyst
              captures: { case_id: $.data.id }
            - call: "POST /abuse-cases/${case_id}/claim"
              payload: {}
              as: TrustAnalyst
              as_user_id: "analyst-1"
              captures: { cv: $.data.version }
            - call: "POST /abuse-cases/${case_id}/actions"
              payload: { action_type: "RESTRICT", expected_abuse_case_version: "${cv}" }
              as: TrustAnalyst
              as_user_id: "analyst-1"
            - call: "POST /appeals"
              payload: { abuse_case_id: "${case_id}" }
              as: OrganizationAdmin
              as_user_id: "${org_id}"
          trigger:
            - call: "POST /appeals"
              payload: { abuse_case_id: "${case_id}" }
              as: OrganizationAdmin
              as_user_id: "${org_id}"
              captures: { error_id: $.data.error_id }
          assert:
            - "second appeal returns 409 ERR_APPEAL_ALREADY_PENDING"

      - name: err_stale_version_on_case_action
        claim_type: violation_to_error
        grounds:
          - errors.ERR_STALE_VERSION
          - concurrency_rules[case-action-stale-version]
        distinguishing_aspect: "Issuing an action with a stale expected_abuse_case_version returns 412 ERR_STALE_VERSION."
        test_recipe:
          setup:
            - "Logical clock set. Case claimed (version now 2)."
          setup_api_calls:
            - *clock_set
            - *org_create
            - call: "POST /abuse-cases"
              payload: { organization_id: "${org_id}", source: "MANUAL", severity: "MEDIUM" }
              as: TrustAnalyst
              captures: { case_id: $.data.id }
            - call: "POST /abuse-cases/${case_id}/claim"
              payload: {}
              as: TrustAnalyst
              as_user_id: "analyst-1"
              captures: { case_v: $.data.version }
          trigger:
            - call: "POST /abuse-cases/${case_id}/actions"
              payload: { action_type: "WARN", expected_abuse_case_version: "${case_v} - 1" }
              as: TrustAnalyst
              as_user_id: "analyst-1"
              captures: { error_id: $.data.error_id }
          assert:
            - "response status is 412 and error_id == ERR_STALE_VERSION"

  # ===========================================================================
  - section: rbac
    instances:

      - name: billing_contact_cannot_open_safety_evaluation
        claim_type: rbac_denial
        grounds:
          - roles.BillingContact
          - endpoints.POST_/model-versions/{id}/safety-evaluations
        distinguishing_aspect: "BillingContact role attempts to open a safety evaluation; only TrustAnalyst may do so."
        test_recipe:
          setup:
            - "Logical clock set. Model exists."
          setup_api_calls:
            - *clock_set
            - call: "POST /model-versions"
              payload: { model_slug: "claude-sonnet", version_tag: "4-5", pricing: { input_per_mtok_cents: 300, output_per_mtok_cents: 1500, cached_per_mtok_cents: 30 } }
              as: PlatformAdmin
              captures: { mv_id: $.data.id }
          trigger:
            - call: "POST /model-versions/${mv_id}/safety-evaluations"
              payload: { capability_class: "STANDARD" }
              as: BillingContact
              captures: { error_id: $.data.error_id }
          assert:
            - "response status is 403 and error_id == ERR_FORBIDDEN"

      - name: organization_admin_cannot_finalize_invoice
        claim_type: rbac_denial
        grounds:
          - roles.OrganizationAdmin
          - endpoints.POST_/invoices/{id}/finalize
        distinguishing_aspect: "OrganizationAdmin role attempts to finalize an invoice; only BillingContact may do so."
        test_recipe:
          setup:
            - "Logical clock set. Org with DRAFT invoice."
          setup_api_calls:
            - *clock_set
            - *org_create
            - call: "POST /invoices"
              payload: { organization_id: "${org_id}", period_start: "2026-09-01T00:00:00Z", period_end: "2026-09-02T00:00:00Z" }
              as: BillingContact
              captures: { inv_id: $.data.id }
          trigger:
            - call: "POST /invoices/${inv_id}/finalize"
              payload: {}
              as: OrganizationAdmin
              as_user_id: "${org_id}"
              captures: { error_id: $.data.error_id }
          assert:
            - "response status is 403 and error_id == ERR_FORBIDDEN"

      - name: trust_lead_cannot_create_model_version
        claim_type: rbac_denial
        grounds:
          - roles.TrustLead
          - endpoints.POST_/model-versions
        distinguishing_aspect: "TrustLead cannot register a new model version; that is a PlatformAdmin exclusive."
        test_recipe:
          setup:
            - "Logical clock set."
          setup_api_calls:
            - *clock_set
          trigger:
            - call: "POST /model-versions"
              payload: { model_slug: "claude-bad", version_tag: "0-0", pricing: { input_per_mtok_cents: 100, output_per_mtok_cents: 500, cached_per_mtok_cents: 10 } }
              as: TrustLead
              captures: { error_id: $.data.error_id }
          assert:
            - "response status is 403 and error_id == ERR_FORBIDDEN"

      - name: segregation_of_duties_appeal_resolver
        claim_type: segregation_of_duties
        grounds:
          - validations.priority_7_business_safety
          - entities.Appeal.fields.resolved_by
        distinguishing_aspect: "The TrustLead resolving an appeal must not be the same X-User-ID as the AbuseAction.issued_by being appealed."
        test_recipe:
          setup:
            - "Logical clock set. Org RESTRICTED via action issued by TrustAnalyst 'shared-user'. Appeal PENDING."
          setup_api_calls:
            - *clock_set
            - *org_create
            - call: "POST /payment-events"
              payload: { organization_id: "${org_id}", kind: "PREPAID_TOPUP", amount_cents: 1000000 }
              as: PlatformAdmin
              captures: { p1: $.data.id }
            - call: "POST /payment-events/${p1}/settle"
              payload: {}
              as: PlatformAdmin
            - call: "POST /organizations/${org_id}/activate"
              payload: {}
              as: PlatformAdmin
            - call: "POST /abuse-cases"
              payload: { organization_id: "${org_id}", source: "MANUAL", severity: "MEDIUM" }
              as: TrustAnalyst
              captures: { case_id: $.data.id }
            - call: "POST /abuse-cases/${case_id}/claim"
              payload: {}
              as: TrustAnalyst
              as_user_id: "shared-user"
              captures: { cv: $.data.version }
            - call: "POST /abuse-cases/${case_id}/actions"
              payload: { action_type: "RESTRICT", expected_abuse_case_version: "${cv}" }
              as: TrustAnalyst
              as_user_id: "shared-user"
            - call: "POST /appeals"
              payload: { abuse_case_id: "${case_id}" }
              as: OrganizationAdmin
              as_user_id: "${org_id}"
              captures: { appeal_id: $.data.id }
          trigger:
            - call: "POST /appeals/${appeal_id}/grant"
              payload: {}
              as: TrustLead
              as_user_id: "shared-user"
              captures: { error_id: $.data.error_id }
          assert:
            - "response status is 422 and error_id == ERR_SEGREGATION_OF_DUTIES (resolver == issuer)"

  # ===========================================================================
  - section: cross_cutting_complexity_layers
    instances:

      - name: occ_stale_version_on_case_action
        claim_type: optimistic_concurrency
        grounds:
          - concurrency_rules[case-action-stale-version]
          - endpoints.POST_/abuse-cases/{id}/actions
        excluded_because:
          difficulty_instance: priority_pair_validation_conflict / state_before_business_fiscal_on_payment_settle
          rationale: "OCC stale-version rejection on POST /abuse-cases/{id}/actions is asserted directly by the §1.9 errors section instance err_stale_version_on_case_action."

      - name: rate_threshold_cumulative_flag
        claim_type: rate_threshold_triggers
        grounds:
          - calculations.rate_limit_for_window
        distinguishing_aspect: "Cumulative variant sums usage over trailing 10 minutes; org exceeding 3x cap for 3 consecutive windows is flagged."
        excluded_because:
          difficulty_instance: combinatorial_formula / rate_limit_enterprise_throttle_burst_interaction
          rationale: "The instantaneous variant is exercised in §1.8; cumulative detection requires multi-window state that the burst-interaction test already covers in miniature."

      - name: cascading_side_effects_agreement_to_tier
        claim_type: cascading_side_effects
        grounds:
          - state_machines.EnterpriseAgreement.ACTIVE_to_TERMINATED
        excluded_because:
          difficulty_instance: transitive_cascade / terminate_cascades_through_agreement_to_tier
          rationale: "Depth-3 cascade covered by the named §1.8 instance."

  # ===========================================================================
  - section: consistency_model
    instances:

      - name: immediate_consistency_on_tier_update
        claim_type: immediate
        grounds:
          - complexity_profile.consistency_model
        distinguishing_aspect: "After payment settle, GET /organizations/{id} immediately reflects updated aggregates in the same logical clock tick."
        test_recipe:
          setup:
            - "Logical clock set. Org PROVISIONAL with one PENDING payment."
          setup_api_calls:
            - *clock_set
            - *org_create
            - call: "POST /payment-events"
              payload: { organization_id: "${org_id}", kind: "PREPAID_TOPUP", amount_cents: 1000000 }
              as: PlatformAdmin
              captures: { p1: $.data.id }
          trigger:
            - call: "POST /payment-events/${p1}/settle"
              payload: {}
              as: PlatformAdmin
            - call: "GET /organizations/${org_id}"
              payload: {}
              as: PlatformAdmin
              captures: { spend: $.data.lifetime_spend_cents }
          assert:
            - "lifetime_spend_cents == 1000000 immediately after settle (no lag)"
