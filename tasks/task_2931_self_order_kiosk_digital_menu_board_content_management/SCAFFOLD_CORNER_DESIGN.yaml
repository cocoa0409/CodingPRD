        grounds:
          - entities.MenuItem.fields.zone_override_total_cents
          - entities.MenuItem.fields.chainwide_availability_state
        excluded_because:
          difficulty_instance: compensating_invariant / price_rollback_restores_zone_override_total_and_cache_freshness
          rationale: "That §1.8 instance reconciles MenuItem.zone_override_total_cents across create (APPLY), update (a second APPLY) and removal (ROLLBACK); the chainwide availability roll-up is separately asserted by chainwide_availability_bubbles_up_from_every_store_row in this file."

  - section: consistency_model
    instances:

      - name: every_derived_effect_of_an_order_is_already_in_its_own_response
        claim_type: immediate
        grounds:
          - consistency_model
          - endpoints.POST_/kiosk-ops/devices/{device_id}/orders
          - entities.OrderHandoff.fields.priced_lines
          - entities.Store.fields.open_order_count
          - entities.StoreItemAvailability.fields.reserved_units
        distinguishing_aspect: "consistency_model immediate: the order-creation 201 body already carries the order number, the priced lines, every money field, the pinned bundle version and the daypart code — nothing is filled in later — and the sibling rows it mutates read their new values on the very next call, with the identical values on a repeated read."
        test_recipe:
          setup:
            - "Clock 2026-08-05T17:00:00Z (local minute 720 at S001, inside LUNCH [660, 960)); ZONE_A, cluster CL_WEST, store S001."
            - "Item A (ENTREE, base 500 -> board 559) has 40 on hand, 0 reserved, par 20; a PUBLISHED bundle covers ENTREE on LUNCH; kiosk K001 is attested COMPLIANT, ONLINE and caching that bundle."
            - "No campaign exists, so the discount is zero and the money tail is pure tax."
          setup_api_calls:
            - call: "POST /kiosk-ops/_clock/set_current_utc"
              payload: { current_utc: "2026-08-05T17:00:00Z" }
