              as: FundingOfficer
              as_user_id: "officer-1"
              captures: { fs: "$.data.id", fs_v: "$.data.version" }
            - call: "POST /recreation/activity-programs"
              payload: { name: "Inclusive Fitness", activity_type: "FITNESS", risk_tier: "LOW", pricing_mode: "PER_SESSION", rounding_policy: "ROUND_ON_TOTAL", waitlist_policy: "FIFO", fee_multiplier_bp: 10000, scheduled_session_count: 1, required_consent_types: [], required_certification_types: [], requires_medication_admin: false }
              as: ProgramAdmin
              captures: { prog: "$.data.id" }
            - call: "POST /recreation/program-sessions"
              payload: { program_id: "${prog}", start_at: "2026-06-10T14:00:00Z", end_at: "2026-06-10T16:00:00Z", slot_capacity: 2, one_to_one_pool_size: 0 }
              as: ProgramAdmin
              captures: { sess: "$.data.id" }
            - call: "POST /recreation/participants"
              payload: { legal_name: "Ada Rivera", date_of_birth: "2010-03-04", household_id: "HH-1", household_size: 3, income_band: "BAND_C", weight_kg: 40, mobility_profile: "AMBULATORY", guardianship_status: "GUARDIAN_REQUIRED" }
              as: IntakeCoordinator
              captures: { p1: "$.data.id", p1_v: "$.data.version" }
            - call: "POST /recreation/support-assessments"
              payload: { participant_id: "${p1}", assessed_on: "2026-04-01", effective_from: "2026-04-01T00:00:00Z", support_tier: "INDEPENDENT", expected_participant_version: "${p1_v}" }
              as: IntakeCoordinator
              captures: { a1: "$.data.id" }
            - call: "POST /recreation/support-assessments/${a1}/activate"
              payload: {}
              as: IntakeCoordinator
            - call: "POST /recreation/participants/${p1}/status"
              payload: { target_status: "ACTIVE" }
              as: IntakeCoordinator
            - call: "POST /recreation/program-sessions/${sess}/open"
              payload: {}
              as: ProgramAdmin
            - call: "GET /recreation/program-sessions/${sess}"
              payload: {}
              as: ProgramAdmin
              captures: { sv1: "$.data.version" }
            - call: "POST /recreation/enrollments"
              payload: { participant_id: "${p1}", session_id: "${sess}", expected_session_version: "${sv1}" }
              as: IntakeCoordinator
              captures: { e1: "$.data.id" }
            - call: "POST /recreation/scholarship-awards"
              payload: { enrollment_id: "${e1}", funding_source_id: "${fs}", expected_funding_source_version: "${fs_v}", requested_amount_cents: 3000 }
              as: FundingOfficer
              as_user_id: "officer-1"
