            - { call: "POST /spice/production-runs", payload: { line_id: "${ln}", formula_id: "${f}", blend_run_id: "${br1}", quantity_kg: 100, window_start: "2026-09-07T08:00:00Z", window_end: "2026-09-07T12:00:00Z", expected_line_version: "${ln_v1}" }, as: ProductionScheduler, captures: { r1: $.data.id } }
            - { call: "GET /spice/lines/${ln}", payload: {}, as: ProductionScheduler, captures: { ln_v2: $.data.version } }
          trigger:
            - { call: "POST /spice/production-runs", payload: { line_id: "${ln}", formula_id: "${f}", blend_run_id: "${br2}", quantity_kg: 100, window_start: "2026-09-07T10:00:00Z", window_end: "2026-09-07T14:00:00Z", expected_line_version: "${ln_v2}" }, as: ProductionScheduler, captures: { err: $.data.error_id } }
          assert:
            - "${err} == ERR_BLEND_RUN_NOT_COMMITTED (HTTP 409) — the referential violation (BR2 is DRAFT) is reported, not ERR_LINE_WINDOW_CONFLICT even though [10:00,14:00) intersects R1's [08:00,12:00)"
            - "validations[priority=14] business_referential beats validations[priority=15] business_temporal"

  - rule_id: boundary_precision_check
    instances:
      - name: adulterant_at_action_level_fails
        grounds:
          - calculations.lot_test_result
          - constants.LEAD_LIMIT_PPM
        distinguishing_aspect: |
          Metric: lead ppm on POST /spice/lots/{lotId}/tests. ADULTERANT_SCREEN
          uses action-level semantics — measured_value >= 2.00 FAILS — so 1.99
          PASSes and exactly 2.00 FAILs (and the FAIL auto-quarantines the lot).
        test_recipe:
          setup:
            - "supplier S; one RECEIVED CINNAMON lot (80 kg, flavor 65.0, moisture 9.0, cost 400, NONE, crop 2025)"
          setup_api_calls:
            - { call: "POST /spice/suppliers", payload: { name: "Ceylon Spice Board", origin_country: "LK" }, as: SupplyPlanner, captures: { sup: $.data.id } }
            - { call: "POST /spice/lots", payload: { supplier_id: "${sup}", spice_code: CINNAMON, origin_region: "Galle", crop_year: 2025, quantity_kg: 80, flavor_intensity_units: 65.0, moisture_pct: 9.0, cost_per_kg_cents: 400, allergen_profile: NONE, organic_certified: true }, as: SupplyPlanner, captures: { lot: $.data.id } }
          trigger:
            - { call: "POST /spice/lots/${lot}/tests", payload: { test_type: ADULTERANT_SCREEN, measured_value: 1.99, lab_code: "LAB-A" }, as: QualityAnalyst, as_user_id: "qa-1", captures: { r_pass: $.data.result } }
            - { call: "GET /spice/lots/${lot}", payload: {}, as: QualityManager, captures: { st_pass: $.data.status } }
            - { call: "POST /spice/lots/${lot}/tests", payload: { test_type: ADULTERANT_SCREEN, measured_value: 2.00, lab_code: "LAB-A" }, as: QualityAnalyst, as_user_id: "qa-1", captures: { r_fail: $.data.result } }
            - { call: "GET /spice/lots/${lot}", payload: {}, as: QualityManager, captures: { st_fail: $.data.status } }
          assert:
            - "1.99 ppm: ${r_pass} == PASS and lot ${st_pass} == IN_TEST (first test auto-advanced it; no quarantine)"
            - "exactly 2.00 ppm: ${r_fail} == FAIL — at-limit FAILS under >= action-level semantics"
            - "lot ${st_fail} == QUARANTINED after the at-limit FAIL (auto-quarantine fired)"

      - name: blend_residual_at_tolerance_passes
        grounds:
          - calculations.blend_lot_selection
          - entities.BlendFormula.fields.flavor_tolerance_pct
        distinguishing_aspect: |
          Metric: residual_flavor_pct on POST /spice/blend-runs/{id}/commit —
          tolerance uses inclusive <= semantics, so residual exactly +2.000% with
          tolerance 2.0 commits WITHIN_SPEC, while +2.010% is rejected
          ERR_BLEND_OUT_OF_SPEC and the run stays DRAFT with computed fields
          persisted.
        test_recipe:
          setup:
            - "supplier S; ACCEPTED pepper lots A1/A2/A3 flavor 102.0 cost 200 committed first, then B1/B2/B3 flavor 102.01 cost 100 accepted after the first commit (so COST_MIN run 2 picks the B lots)"
            - "ACTIVE formula TOL-1 (BLACK_PEPPER 100%, min flavor 50, target_flavor_units 100.0, flavor_tolerance_pct 2.0)"
            - "two blend runs, target_batch_kg 100 each"
          setup_api_calls:
            - { call: "POST /spice/suppliers", payload: { name: "Malabar Exports", origin_country: "IN" }, as: SupplyPlanner, captures: { sup: $.data.id } }
            - { call: "POST /spice/lots", payload: { supplier_id: "${sup}", spice_code: BLACK_PEPPER, origin_region: "Malabar", crop_year: 2025, quantity_kg: 100, flavor_intensity_units: 102.0, moisture_pct: 8.0, cost_per_kg_cents: 200, allergen_profile: NONE, organic_certified: false }, as: SupplyPlanner, captures: { a1: $.data.id } }
            - { call: "POST /spice/lots", payload: { supplier_id: "${sup}", spice_code: BLACK_PEPPER, origin_region: "Malabar", crop_year: 2025, quantity_kg: 100, flavor_intensity_units: 102.0, moisture_pct: 8.0, cost_per_kg_cents: 200, allergen_profile: NONE, organic_certified: false }, as: SupplyPlanner, captures: { a2: $.data.id } }
