  # =====================================================================
  # Rule 4 — transitive cascade chains from different triggers
  # =====================================================================
  - rule_id: transitive_cascade
    instances:
      - name: plan_check_corrections_chain
        grounds:
          - state_machines.PermitSubmittal.UNDER_PLAN_CHECK_to_CORRECTIONS_REQUIRED
          - state_machines.AduProject.PERMITTING_to_DESIGN_REVISION
          - state_machines.ConstructionPhase.SCHEDULED_to_BLOCKED
          - state_machines.InspectionAppointment.SCHEDULED_to_CANCELLED
        distinguishing_aspect: |
          DEPTH-4 chain triggered by POST /permit-submittals/{id}/plan-check-result with
          outcome CORRECTIONS_REQUIRED: the submittal enters CORRECTIONS_REQUIRED (L1);
          BECAUSE it did, the project leaves PERMITTING for DESIGN_REVISION (L2); BECAUSE the
          project left PERMITTING, its SCHEDULED phase becomes BLOCKED and drops both window
          dates (L3); BECAUSE that phase became BLOCKED, its SCHEDULED inspection appointment
          becomes CANCELLED and the inspector's day is freed (L4). No link is a direct effect
          of the trigger call on the far entity.
