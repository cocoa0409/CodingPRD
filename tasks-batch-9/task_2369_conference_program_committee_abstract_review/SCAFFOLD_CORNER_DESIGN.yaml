            - "second call → HTTP 409 with error_id ERR_CONFERENCE_STATE_INVALID (decisions require REVIEW_CLOSED)"
            - "Abstract.${ab1_id}.decision == null and status == SUBMITTED after both calls"
            - "Conference.${conf_id}.version == ${conf_v} (neither rejected call bumped it)"

      - name: priority_conflict_between_authorization_and_existence
        claim_type: priority_conflict
        grounds:
          - validations.p2.ERR_UNAUTHORIZED
          - validations.p4.ERR_ABSTRACT_NOT_FOUND
        excluded_because:
          difficulty_instance: priority_pair_validation_conflict / unauthorized_role_outranks_missing_abstract_on_decision_negative
          rationale: "The p2-over-p4 pairing on the decision endpoint is precisely the named §1.8 instance."

      - name: cross_entity_validation_on_presenter_registration
        claim_type: cross_entity
        grounds:
          - validations.p20.ERR_AUTHOR_NOT_REGISTERED
        excluded_because:
          difficulty_instance: cross_entity_state_dependency / abstract_confirmation_depends_on_author_registration_state
          rationale: "Both the unregistered rejection and the post-registration success are asserted by the named §1.8 instance."

      - name: temporal_validation_detects_a_future_presenter_clash
        claim_type: temporal
        grounds:
          - validations.p18.ERR_PRESENTER_TIME_CONFLICT
        excluded_because:
          difficulty_instance: resource_temporal_overlap / presenter_intervals_are_closed_so_touching_conflicts
          rationale: "A legal slot that would create a later presenter clash, and the touching-endpoint boundary, are both walked by the named §1.8 instance."

  # ===========================================================================
  # SECTION 5 — Endpoints (§1.5)
  # Note: §1.5 declares no bulk-mutation endpoint, so the guide's "Bulk action"
  # row has no applicable instance in this scaffold.
  # ===========================================================================
  - section: endpoints
    instances:

      - name: committee_member_patch_updates_selector_inputs_without_rescoring
        claim_type: standard_crud
        grounds:
          - endpoints.PATCH./committee-members/{memberId}
          - endpoints.GET./committee-members/{memberId}
          - calculations.review_weighted_score
        distinguishing_aspect: |
          The update path is partial and forward-only: PATCHing calibration_bias
          from 0.00 to -0.50 bumps the member's version, is visible on the next
          GET, leaves the untouched max_review_load alone, and does NOT
          retroactively rescore the review already submitted at 4.00 — while the
          next submission by the same reviewer is weighted with the new bias and
          lands at 3.50.
        test_recipe:
          setup:
            - "Clock 2026-01-05T00:00:00Z; Conference GOS26 at REVIEW_OPEN, category GEN with min_reviews_required 2."
            - "Chair Cho is ACTIVE. Reviewer Rui is ACTIVE with calibration_bias 0.00, max_review_load 4 and expertise [oncology]."
            - "Authors Ada and Ben each have one SUBMITTED abstract; Rui holds one ASSIGNED review on each."
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { current_utc: "2026-01-05T00:00:00Z" }
              as: ConferenceAdmin
            - call: "POST /conferences"
              payload: { name: "Global Oncology Summit 2026", code: "GOS26", event_start_utc: "2026-09-01T08:00:00Z", event_end_utc: "2026-09-03T18:00:00Z", abstract_deadline_utc: "2026-03-01T23:59:00Z", review_deadline_utc: "2026-05-01T23:59:00Z", program_freeze_utc: "2026-08-15T00:00:00Z", oral_slot_capacity: 3, poster_slot_capacity: 2, workshop_slot_capacity: 1, cme_minutes_pool_total: 600 }
              as: ConferenceAdmin
              captures: { conf_id: "$.data.id" }
            - call: "POST /categories"
              payload: { conference_id: "${conf_id}", code: "GEN", name: "General Oncology", max_word_count: 300, allowed_formats: ["ORAL", "POSTER"], min_reviews_required: 2, discrepancy_threshold: 4.00 }
              as: ConferenceAdmin
              captures: { cat_id: "$.data.id" }
            - call: "POST /authors"
              payload: { full_name: "Ada Rivera", email: "ada@lab.example", affiliation: "Northline University" }
              as: ConferenceAdmin
              captures: { au_ada_id: "$.data.id" }
            - call: "POST /authors"
              payload: { full_name: "Ben Okafor", email: "ben@lab.example", affiliation: "Southgate Institute" }
              as: ConferenceAdmin
              captures: { au_ben_id: "$.data.id" }
            - call: "POST /committee-members"
              payload: { conference_id: "${conf_id}", full_name: "Cho Bekele", email: "cho@panel.example", member_role: "CHAIR", expertise_keywords: ["oncology"], max_review_load: 4, calibration_bias: 0.00 }
              as: ConferenceAdmin
              captures: { mb_chair_id: "$.data.id" }
            - call: "POST /conflict-declarations"
              payload: { member_id: "${mb_chair_id}", conflict_subject_type: "NONE", conflict_type: "NONE" }
              as: ConferenceAdmin
            - call: "POST /committee-members/${mb_chair_id}/status-transitions"
              payload: { to_status: "ACTIVE" }
              as: ConferenceAdmin
            - call: "POST /committee-members"
              payload: { conference_id: "${conf_id}", full_name: "Rui Alvarez", email: "rui@panel.example", member_role: "REVIEWER", expertise_keywords: ["oncology"], max_review_load: 4, calibration_bias: 0.00 }
              as: ConferenceAdmin
              captures: { mb_r1_id: "$.data.id" }
            - call: "POST /conflict-declarations"
              payload: { member_id: "${mb_r1_id}", conflict_subject_type: "NONE", conflict_type: "NONE" }
              as: ConferenceAdmin
            - call: "POST /committee-members/${mb_r1_id}/status-transitions"
              payload: { to_status: "ACTIVE" }
              as: ConferenceAdmin
            - call: "POST /conferences/${conf_id}/status-transitions"
              payload: { to_status: "CFA_OPEN" }
              as: ConferenceAdmin
            - call: "POST /abstracts"
              payload: { conference_id: "${conf_id}", category_id: "${cat_id}", submitting_author_id: "${au_ada_id}", title: "Ada submission", body_word_count: 280, requested_format: "ORAL", keywords: ["oncology"] }
              as: Author
              as_user_id: "${au_ada_id}"
              captures: { ab1_id: "$.data.id" }
            - call: "POST /abstracts"
              payload: { conference_id: "${conf_id}", category_id: "${cat_id}", submitting_author_id: "${au_ben_id}", title: "Ben submission", body_word_count: 280, requested_format: "ORAL", keywords: ["oncology"] }
              as: Author
              as_user_id: "${au_ben_id}"
              captures: { ab2_id: "$.data.id" }
            - call: "POST /conferences/${conf_id}/status-transitions"
              payload: { to_status: "CFA_CLOSED" }
              as: ConferenceAdmin
            - call: "POST /conferences/${conf_id}/status-transitions"
              payload: { to_status: "REVIEW_OPEN" }
              as: ConferenceAdmin
            - call: "POST /abstracts/${ab1_id}/review-assignments"
              payload: { reviewer_member_id: "${mb_r1_id}" }
              as: ProgramChair
              as_user_id: "${mb_chair_id}"
              captures: { rv1_id: "$.data.id" }
            - call: "POST /abstracts/${ab2_id}/review-assignments"
              payload: { reviewer_member_id: "${mb_r1_id}" }
              as: ProgramChair
              as_user_id: "${mb_chair_id}"
              captures: { rv2_id: "$.data.id" }
            - call: "POST /reviews/${rv1_id}/submission"
              payload: { score_originality: 4, score_methodology: 4, score_relevance: 4, score_clarity: 4, confidence: "HIGH", recommended_format: "ORAL" }
              as: Reviewer
              as_user_id: "${mb_r1_id}"
            - call: "GET /committee-members/${mb_r1_id}"
              as: ConferenceAdmin
              captures: { v_before: "$.data.version" }
          trigger:
            - call: "PATCH /committee-members/${mb_r1_id}"
              payload: { calibration_bias: -0.50, expertise_keywords: ["oncology", "immunotherapy"] }
              as: ConferenceAdmin
              captures: { bias: "$.data.calibration_bias", v_after: "$.data.version", cap: "$.data.max_review_load" }
            - call: "GET /reviews/${rv1_id}"
              as: ProgramChair
              as_user_id: "${mb_chair_id}"
              captures: { old_ws: "$.data.weighted_score" }
            - call: "POST /reviews/${rv2_id}/submission"
