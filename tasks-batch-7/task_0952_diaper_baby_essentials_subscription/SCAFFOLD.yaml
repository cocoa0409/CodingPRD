  - method: POST
    path: "/registries/{id}/reopen"
    description: "Reopens a closed registry; permitted at most once."
    roles: [RegistryOwner]
    code: 200
    input: []
    output: Registry
    gates: [G1_AUTH, G2_RBAC, G3_EXISTENCE, G5_OWNERSHIP, G7_LIFECYCLE, G9_POLICY_FISCAL]
    side_effects: ["Registry CLOSED -> OPEN", "increments reopen_count", "increments Registry.version by 1"]

  - method: POST
    path: "/registries/{id}/archive"
    description: "Archives a closed registry once no gift is in flight."
    roles: [RegistryOwner]
    code: 200
    input: []
    output: Registry
    gates: [G1_AUTH, G2_RBAC, G3_EXISTENCE, G5_OWNERSHIP, G7_LIFECYCLE, G9_POLICY_FISCAL]
    side_effects: ["Registry CLOSED -> ARCHIVED", "increments Registry.version by 1"]

  - method: GET
    path: "/registries/{id}/summary"
    description: "Computed read of registry fulfilment progress."
    roles: [RegistryOwner, GiftPurchaser, SupportAgent, OpsAdmin]
    code: 200
    input: []
    output: { item_count: integer, requested_units: integer, fulfilled_units: integer, completion_pct: number, inflight_gift_count: integer }
    side_effects: []

