# =============================================================================
# §1.8 Scaffold Difficulty Design — Test Targeting Index
# Task 1509: Rendering & Byproduct Processing
# =============================================================================
scaffold_difficulty_design:

  # ------------------------------------------------------------------
  - rule_id: dual_variant_calc
    instances:
      - name: cook_yield_theoretical_vs_actual
        grounds:
          - calculations.cook_yield
          - entities.CookRun.fields.theoretical_fat_lbs
          - entities.CookRun.fields.yield_variance_pct
          - state_machines.CookRun.PRESSING_to_COMPLETED
        distinguishing_aspect: |
          Dual variant on the CookRun domain: identical inputs (10000 lbs BOVINE) produce
          THEORETICAL outputs from the species coefficient table (fat 1600 / meal 2400) versus
          ACTUAL scale-recorded outputs (1500 / 2450); the two variants disagree and the
          scaffold pins variance = (3950-4000)/4000*100 = -1.25.
        test_recipe:
          setup:
            - "Plant (cooker_capacity 2, std cost 38), supplier with ACTIVE agreement (species_scope [BOVINE]), one ACCEPTED 10000-lb BOVINE batch"
            - "Cook run RUMINANT_RENDER consuming all 10000 lbs, window 2026-08-03T08:00:00Z..2026-08-03T12:00:00Z, advanced to PRESSING"
          setup_api_calls:
            - { call: "POST /rendering/plants", payload: { plant_name: "Plant A", location: "Dallas TX", cooker_capacity: 2, standard_cost_cents_per_lb: 38 }, as: PlantManager, captures: { plant_id: $.data.id } }
            - { call: "POST /rendering/suppliers", payload: { plant_id: "${plant_id}", supplier_name: "Sup A", supplier_type: "FARM" }, as: ProcurementManager, as_user_id: "pm-1", captures: { sup_id: $.data.id } }
            - { call: "POST /rendering/supplier-agreements", payload: { supplier_id: "${sup_id}", plant_id: "${plant_id}", agreement_ref: "AGR-1", species_scope: ["BOVINE"], prohibited_material_policy: "SORT_AND_RETURN", accepts_dead_stock: false, pickup_base_fee_cents: 10000, per_lb_fee_cents: 2, mileage_rate_cents: 100, effective_from: "2026-08-01", effective_to: "2026-12-31" }, as: ProcurementManager, as_user_id: "pm-1", captures: { agr_id: $.data.id } }
            - { call: "POST /rendering/supplier-agreements/${agr_id}/submit", payload: {}, as: ProcurementManager, as_user_id: "pm-1" }
            - { call: "POST /rendering/supplier-agreements/${agr_id}/approve", payload: {}, as: PlantManager, as_user_id: "pmgr-1" }
            - { call: "POST /rendering/inbound-batches", payload: { plant_id: "${plant_id}", supplier_id: "${sup_id}", agreement_id: "${agr_id}", species: "BOVINE", weight_lbs: 10000, temperature_f: 65.0, received_at: "2026-08-02T08:00:00Z" }, as: ScalehouseOperator, as_user_id: "sh-1", captures: { bat_id: $.data.id } }
            - { call: "POST /rendering/inbound-batches/${bat_id}/screen", payload: { screening_result: "PASS" }, as: ScalehouseOperator, as_user_id: "sh-1" }
            - { call: "POST /rendering/cook-runs", payload: { plant_id: "${plant_id}", cooker_line: 1, recipe: "RUMINANT_RENDER", planned_inputs: [ { batch_id: "${bat_id}", weight_lbs: 10000 } ], cook_start: "2026-08-03T08:00:00Z", cook_end: "2026-08-03T12:00:00Z" }, as: ProductionSupervisor, as_user_id: "ps-1", captures: { run_id: $.data.id } }
            - { call: "POST /rendering/cook-runs/${run_id}/start", payload: {}, as: ProductionSupervisor, as_user_id: "ps-1" }
            - { call: "POST /rendering/cook-runs/${run_id}/advance", payload: {}, as: ProductionSupervisor, as_user_id: "ps-1" }
            - { call: "POST /rendering/cook-runs/${run_id}/advance", payload: {}, as: ProductionSupervisor, as_user_id: "ps-1" }
          trigger:
            - { call: "POST /rendering/cook-runs/${run_id}/complete", payload: { actual_fat_output_lbs: 1500, actual_meal_output_lbs: 2450 }, as: ProductionSupervisor, as_user_id: "ps-1" }
            - { call: "GET /rendering/product-lots?cook_run_id=${run_id}&product_type=TALLOW", as: Any, captures: { fat_lot: "$.data[0].id" } }
            - { call: "GET /rendering/product-lots?cook_run_id=${run_id}&product_type=PROTEIN_MEAL", as: Any, captures: { meal_lot: "$.data[0].id" } }
            - { call: "GET /rendering/inbound-batches/${bat_id}", as: Any }
          assert:
            - "CookRun.${run_id}.theoretical_fat_lbs == 1600 (10000 * 0.16)"
            - "CookRun.${run_id}.theoretical_meal_lbs == 2400 (10000 * 0.24)"
            - "CookRun.${run_id}.yield_variance_pct == -1.25 ((3950-4000)/4000*100, round_half_up 2dp)"
            - "CookRun.${run_id}.energy_cost_cents == 16800 (4h * 4200, all within tier 1)"
            - "CookRun.${run_id}.status == COMPLETED"
            - "ProductLot.${fat_lot}.quantity_lbs == 1500 and ProductLot.${meal_lot}.quantity_lbs == 2450"
            - "InboundBatch.${bat_id}.consumed_lbs == 10000 and status == DEPLETED"

      - name: pickup_fee_provisional_vs_final
        grounds:
          - calculations.pickup_service_fee
          - entities.RouteStop.fields.provisional_fee_cents
          - entities.RouteStop.fields.final_fee_cents
          - state_machines.RouteStop.ARRIVED_to_COLLECTED
        distinguishing_aspect: |
          Dual variant on the RouteStop logistics domain (different domain from CookRun):
          the PROVISIONAL variant uses estimated weight/miles and never discounts, while the
          FINAL variant uses actuals and applies the 5% volume discount only once the
          supplier's current-period collected volume (including the stop) reaches 20000 lbs —
          stop 1 settles 58700 vs estimate 56500 without discount; stop 2 settles 50825 vs
          estimate 53500 with the discount switched on by cumulative volume.
        test_recipe:
          setup:
            - "Plant; supplier; ACTIVE agreement: base 15000, 3 cents/lb, 250 cents/mi, dead-stock surcharge 7500, minimum_volume_lbs 20000, volume_discount_pct 0.05, accepts_dead_stock true, species [BOVINE], window 2026-08-01..2026-12-31"
            - "RAW_MATERIAL vehicle capacity 100000; route R 2026-08-10 06:00-18:00 DISPATCHED with stop1 (est 8000 lbs, 40 mi, dead stock) and stop2 (est 12000 lbs, 10 mi, regular)"
          setup_api_calls:
            - { call: "POST /rendering/plants", payload: { plant_name: "Plant A", location: "Dallas TX", cooker_capacity: 2, standard_cost_cents_per_lb: 38 }, as: PlantManager, captures: { plant_id: $.data.id } }
            - { call: "POST /rendering/suppliers", payload: { plant_id: "${plant_id}", supplier_name: "Sup A", supplier_type: "FARM" }, as: ProcurementManager, as_user_id: "pm-1", captures: { sup_id: $.data.id } }
            - { call: "POST /rendering/supplier-agreements", payload: { supplier_id: "${sup_id}", plant_id: "${plant_id}", agreement_ref: "AGR-1", species_scope: ["BOVINE"], prohibited_material_policy: "ZERO_TOLERANCE", accepts_dead_stock: true, pickup_base_fee_cents: 15000, per_lb_fee_cents: 3, mileage_rate_cents: 250, dead_stock_surcharge_cents: 7500, minimum_volume_lbs: 20000, volume_discount_pct: 0.05, effective_from: "2026-08-01", effective_to: "2026-12-31" }, as: ProcurementManager, as_user_id: "pm-1", captures: { agr_id: $.data.id } }
            - { call: "POST /rendering/supplier-agreements/${agr_id}/submit", payload: {}, as: ProcurementManager, as_user_id: "pm-1" }
            - { call: "POST /rendering/supplier-agreements/${agr_id}/approve", payload: {}, as: PlantManager, as_user_id: "pmgr-1" }
            - { call: "POST /rendering/vehicles", payload: { plant_id: "${plant_id}", vehicle_tag: "V1", capacity_lbs: 100000, duty_class: "RAW_MATERIAL" }, as: RouteDispatcher, as_user_id: "rd-1", captures: { veh_id: $.data.id } }
            - { call: "POST /rendering/collection-routes", payload: { plant_id: "${plant_id}", vehicle_id: "${veh_id}", route_code: "R1", service_date: "2026-08-10", scheduled_departure: "2026-08-10T06:00:00Z", scheduled_return: "2026-08-10T18:00:00Z" }, as: RouteDispatcher, as_user_id: "rd-1", captures: { route_id: $.data.id, route_v: $.data.version } }
            - { call: "POST /rendering/route-stops", payload: { route_id: "${route_id}", supplier_id: "${sup_id}", agreement_id: "${agr_id}", plant_id: "${plant_id}", sequence_no: 1, scheduled_window_start: "2026-08-10T08:00:00Z", scheduled_window_end: "2026-08-10T09:00:00Z", estimated_weight_lbs: 8000, estimated_distance_miles: 40, species_tag: "BOVINE", is_dead_stock: true, expected_route_version: "${route_v}" }, as: RouteDispatcher, as_user_id: "rd-1", captures: { stop1: $.data.id } }
            - { call: "GET /rendering/collection-routes/${route_id}", as: Any, captures: { route_v2: $.data.version } }
            - { call: "POST /rendering/route-stops", payload: { route_id: "${route_id}", supplier_id: "${sup_id}", agreement_id: "${agr_id}", plant_id: "${plant_id}", sequence_no: 2, scheduled_window_start: "2026-08-10T10:00:00Z", scheduled_window_end: "2026-08-10T11:00:00Z", estimated_weight_lbs: 12000, estimated_distance_miles: 10, species_tag: "BOVINE", is_dead_stock: false, expected_route_version: "${route_v2}" }, as: RouteDispatcher, as_user_id: "rd-1", captures: { stop2: $.data.id } }
            - { call: "POST /rendering/collection-routes/${route_id}/dispatch", payload: {}, as: RouteDispatcher, as_user_id: "rd-1" }
            - { call: "POST /rendering/route-stops/${stop1}/arrive", payload: {}, as: RouteDispatcher, as_user_id: "rd-1" }
            - { call: "POST /rendering/route-stops/${stop2}/arrive", payload: {}, as: RouteDispatcher, as_user_id: "rd-1" }
          trigger:
            - { call: "POST /rendering/route-stops/${stop1}/collect", payload: { actual_weight_lbs: 8400, actual_distance_miles: 44, temperature_f: 65.0 }, as: RouteDispatcher, as_user_id: "rd-1" }
            - { call: "POST /rendering/route-stops/${stop2}/collect", payload: { actual_weight_lbs: 12000, actual_distance_miles: 10, temperature_f: 60.0 }, as: RouteDispatcher, as_user_id: "rd-1" }
            - { call: "GET /rendering/period-settlements?plant_id=${plant_id}&period_index=1", as: Any, captures: { sett_id: "$.data[0].id" } }
            - { call: "GET /rendering/period-settlements/${sett_id}", as: Any }
            - { call: "GET /rendering/suppliers/${sup_id}", as: Any }
          assert:
            - "RouteStop.${stop1}.provisional_fee_cents == 56500 (15000 + 8000*3 + 40*250 + 7500)"
            - "RouteStop.${stop1}.final_fee_cents == 58700 (15000 + 8400*3 + 44*250 + 7500; cumulative 8400 < 20000, no discount)"
            - "RouteStop.${stop2}.provisional_fee_cents == 53500 (15000 + 12000*3 + 10*250)"
            - "RouteStop.${stop2}.final_fee_cents == 50825 (subtotal 53500; cumulative 20400 >= 20000, discount round_half_up(53500*0.05) = 2675)"
            - "PeriodSettlement.${sett_id}.pickup_fees_accrued_cents == 109525 (58700 + 50825)"
            - "PeriodSettlement.${sett_id}.transport_costs_cents == 8100 ((44+10) * 150)"
            - "Supplier.${sup_id}.outstanding_service_fees_cents == 109525"

  # ------------------------------------------------------------------
  - rule_id: combinatorial_formula
    instances:
      - name: index_price_multi_input_interaction
        grounds:
          - calculations.index_linked_unit_price
          - entities.CustomerContract.fields.pricing_mode
          - entities.PriceIndexEntry.fields.effective_date
        distinguishing_aspect: |
          Mode (a) — >= 3 inputs with non-linear interaction: the unit price selects an index
          entry by date filter (latest effective_date <= ship date), adds a signed basis, then
          branches on the promised grade multiplier; ship date 2026-08-05 picks the 40-cent
          entry (not the 44-cent entry effective 2026-08-10), basis +4 and PREMIUM x1.05 yield
          round_half_up(44 * 1.05) = 46, distinct from every sub-expression value.
        test_recipe:
          setup:
            - "Plant (std cost 38); INDEX_LINKED TALLOW contract ACTIVE: basis +4, tiers [{50000, 0.02}, {100000, 0.04}], margin floor 15.0, window 2026-08-01..2026-12-31"
            - "PriceIndexEntry TALLOW eff 2026-08-01 = 40 cents/lb; TALLOW eff 2026-08-10 = 44 cents/lb"
            - "SalesOrder qty 48000 lbs, requested_ship_date 2026-08-05, DRAFT"
          setup_api_calls:
            - { call: "POST /rendering/plants", payload: { plant_name: "Plant A", location: "Dallas TX", cooker_capacity: 2, standard_cost_cents_per_lb: 38 }, as: PlantManager, captures: { plant_id: $.data.id } }
            - { call: "POST /rendering/customer-contracts", payload: { plant_id: "${plant_id}", customer_name: "Cust A", product_type: "TALLOW", spec_max_moisture_pct: 0.5, spec_max_ffa_pct: 4.0, spec_min_protein_pct: 0, pricing_mode: "INDEX_LINKED", index_product: "TALLOW", index_basis_adjustment_cents: 4, volume_commitment_lbs: 200000, tier_discounts: [ { threshold_lbs: 50000, discount_pct: 0.02 }, { threshold_lbs: 100000, discount_pct: 0.04 } ], margin_floor_pct: 15.0, effective_from: "2026-08-01", effective_to: "2026-12-31" }, as: SalesManager, as_user_id: "sm-1", captures: { con_id: $.data.id } }
            - { call: "POST /rendering/customer-contracts/${con_id}/submit", payload: {}, as: SalesManager, as_user_id: "sm-1" }
            - { call: "POST /rendering/customer-contracts/${con_id}/approve", payload: {}, as: PlantManager, as_user_id: "pmgr-1", captures: { con_v: $.data.version } }
            - { call: "POST /rendering/price-index-entries", payload: { plant_id: "${plant_id}", index_product: "TALLOW", effective_date: "2026-08-01", price_cents_per_lb: 40, source: "JACOBSEN" }, as: FinanceAnalyst, as_user_id: "fa-1" }
            - { call: "POST /rendering/price-index-entries", payload: { plant_id: "${plant_id}", index_product: "TALLOW", effective_date: "2026-08-10", price_cents_per_lb: 44, source: "JACOBSEN" }, as: FinanceAnalyst, as_user_id: "fa-1" }
            - { call: "POST /rendering/sales-orders", payload: { contract_id: "${con_id}", plant_id: "${plant_id}", quantity_lbs: 48000, requested_ship_date: "2026-08-05", expected_contract_version: "${con_v}" }, as: SalesManager, as_user_id: "sm-1", captures: { ord_id: $.data.id } }
          trigger:
            - { call: "POST /rendering/sales-orders/${ord_id}/price", payload: { expected_grade: "PREMIUM" }, as: SalesManager, as_user_id: "sm-1" }
          assert:
            - "SalesOrder.${ord_id}.applied_index_price_cents == 40 (2026-08-01 entry chosen: latest effective_date <= 2026-08-05)"
            - "SalesOrder.${ord_id}.unit_price_cents == 46 (round_half_up((40+4) * 1.05) = round_half_up(46.2))"
            - "SalesOrder.${ord_id}.applied_discount_pct == 0 (projected volume 48000 < 50000)"
            - "SalesOrder.${ord_id}.gross_amount_cents == 2208000 (48000 * 46)"
            - "SalesOrder.${ord_id}.net_amount_cents == 2220500 (2208000 - 0 + 12500)"
            - "SalesOrder.${ord_id}.margin_pct == 17.39 (round_half_up((46-38)/46*100, 2)) >= floor 15.0"
            - "SalesOrder.${ord_id}.status == PRICED"

      - name: order_amount_per_unit_rounding
        grounds:
          - calculations.order_amount_composition
          - entities.SalesOrder.fields.gross_amount_cents
          - entities.SalesOrder.fields.unit_price_cents
        distinguishing_aspect: |
          Mode (b) — nested rounding order pinned: the unit price is rounded to integer cents
          per lb FIRST (46.2 -> 46), then gross = quantity * rounded unit (333 * 46 = 15318);
          the unpinned alternative round(333 * 46.2) = 15385 disagrees by 67 cents, so the
          scaffold's pinned order is observable and falsifiable.
        test_recipe:
          setup:
            - "Same contract/index setup shape as index_price_multi_input_interaction (INDEX_LINKED, basis +4, tiers, floor 15.0)"
            - "SalesOrder qty 333 lbs, requested_ship_date 2026-08-05 (selects the 40-cent entry), DRAFT"
          setup_api_calls:
            - { call: "POST /rendering/plants", payload: { plant_name: "Plant A", location: "Dallas TX", cooker_capacity: 2, standard_cost_cents_per_lb: 38 }, as: PlantManager, captures: { plant_id: $.data.id } }
            - { call: "POST /rendering/customer-contracts", payload: { plant_id: "${plant_id}", customer_name: "Cust A", product_type: "TALLOW", spec_max_moisture_pct: 0.5, spec_max_ffa_pct: 4.0, spec_min_protein_pct: 0, pricing_mode: "INDEX_LINKED", index_product: "TALLOW", index_basis_adjustment_cents: 4, volume_commitment_lbs: 200000, tier_discounts: [ { threshold_lbs: 50000, discount_pct: 0.02 }, { threshold_lbs: 100000, discount_pct: 0.04 } ], margin_floor_pct: 15.0, effective_from: "2026-08-01", effective_to: "2026-12-31" }, as: SalesManager, as_user_id: "sm-1", captures: { con_id: $.data.id } }
            - { call: "POST /rendering/customer-contracts/${con_id}/submit", payload: {}, as: SalesManager, as_user_id: "sm-1" }
            - { call: "POST /rendering/customer-contracts/${con_id}/approve", payload: {}, as: PlantManager, as_user_id: "pmgr-1", captures: { con_v: $.data.version } }
            - { call: "POST /rendering/price-index-entries", payload: { plant_id: "${plant_id}", index_product: "TALLOW", effective_date: "2026-08-01", price_cents_per_lb: 40, source: "USDA_AMS" }, as: FinanceAnalyst, as_user_id: "fa-1" }
            - { call: "POST /rendering/sales-orders", payload: { contract_id: "${con_id}", plant_id: "${plant_id}", quantity_lbs: 333, requested_ship_date: "2026-08-05", expected_contract_version: "${con_v}" }, as: SalesManager, as_user_id: "sm-1", captures: { ord_id: $.data.id } }
          trigger:
            - { call: "POST /rendering/sales-orders/${ord_id}/price", payload: { expected_grade: "PREMIUM" }, as: SalesManager, as_user_id: "sm-1" }
          assert:
            - "SalesOrder.${ord_id}.unit_price_cents == 46 (per-unit rounding applied before extension)"
            - "SalesOrder.${ord_id}.gross_amount_cents == 15318 (333 * 46), NOT 15385 (round(333 * 46.2))"
            - "SalesOrder.${ord_id}.discount_amount_cents == 0"
            - "SalesOrder.${ord_id}.freight_surcharge_cents == 12500"
            - "SalesOrder.${ord_id}.net_amount_cents == 27818 (15318 - 0 + 12500)"

      - name: tier_projection_self_inclusion
        grounds:
          - calculations.tier_selection_projected_volume
          - entities.CustomerContract.fields.delivered_volume_lbs
          - entities.CustomerContract.fields.tier_discounts
        distinguishing_aspect: |
          Mode (c) — circular-looking dependency with pinned evaluation order: the tier is
          selected from projected_volume = delivered_volume_lbs + THIS order's quantity (the
          order contributes to its own tier before it exists); projected 100000 exactly meets
          the 100000 threshold (inclusive) selecting 4%, while 99999 selects 2% — the boundary
          is falsifiable only if self-inclusion order is pinned.
        test_recipe:
          setup:
            - "Same contract/index setup shape; TALLOW index 44 eff 2026-08-01 only"
            - "Order1 qty 99999 ship 2026-08-12; Order2 qty 100000 ship 2026-08-12 (both DRAFT, nothing shipped so delivered_volume_lbs == 0 for both evaluations)"
          setup_api_calls:
            - { call: "POST /rendering/plants", payload: { plant_name: "Plant A", location: "Dallas TX", cooker_capacity: 2, standard_cost_cents_per_lb: 38 }, as: PlantManager, captures: { plant_id: $.data.id } }
            - { call: "POST /rendering/customer-contracts", payload: { plant_id: "${plant_id}", customer_name: "Cust A", product_type: "TALLOW", spec_max_moisture_pct: 0.5, spec_max_ffa_pct: 4.0, spec_min_protein_pct: 0, pricing_mode: "INDEX_LINKED", index_product: "TALLOW", index_basis_adjustment_cents: 4, volume_commitment_lbs: 300000, tier_discounts: [ { threshold_lbs: 50000, discount_pct: 0.02 }, { threshold_lbs: 100000, discount_pct: 0.04 } ], margin_floor_pct: 15.0, effective_from: "2026-08-01", effective_to: "2026-12-31" }, as: SalesManager, as_user_id: "sm-1", captures: { con_id: $.data.id } }
            - { call: "POST /rendering/customer-contracts/${con_id}/submit", payload: {}, as: SalesManager, as_user_id: "sm-1" }
            - { call: "POST /rendering/customer-contracts/${con_id}/approve", payload: {}, as: PlantManager, as_user_id: "pmgr-1", captures: { con_v: $.data.version } }
            - { call: "POST /rendering/price-index-entries", payload: { plant_id: "${plant_id}", index_product: "TALLOW", effective_date: "2026-08-01", price_cents_per_lb: 44, source: "INTERNAL" }, as: FinanceAnalyst, as_user_id: "fa-1" }
            - { call: "POST /rendering/sales-orders", payload: { contract_id: "${con_id}", plant_id: "${plant_id}", quantity_lbs: 99999, requested_ship_date: "2026-08-12", expected_contract_version: "${con_v}" }, as: SalesManager, as_user_id: "sm-1", captures: { ord1: $.data.id } }
            - { call: "GET /rendering/customer-contracts/${con_id}", as: Any, captures: { con_v2: $.data.version } }
            - { call: "POST /rendering/sales-orders", payload: { contract_id: "${con_id}", plant_id: "${plant_id}", quantity_lbs: 100000, requested_ship_date: "2026-08-12", expected_contract_version: "${con_v2}" }, as: SalesManager, as_user_id: "sm-1", captures: { ord2: $.data.id } }
          trigger:
            - { call: "POST /rendering/sales-orders/${ord1}/price", payload: { expected_grade: "PREMIUM" }, as: SalesManager, as_user_id: "sm-1" }
            - { call: "POST /rendering/sales-orders/${ord2}/price", payload: { expected_grade: "PREMIUM" }, as: SalesManager, as_user_id: "sm-1" }
          assert:
            - "SalesOrder.${ord1}.applied_discount_pct == 0.02 (projected 0 + 99999 >= 50000 but < 100000)"
            - "SalesOrder.${ord1}.unit_price_cents == 50 (round_half_up(48 * 1.05) = round_half_up(50.4))"
            - "SalesOrder.${ord1}.net_amount_cents == 4912451 (gross 4999950 - discount round_half_up(4999950*0.02)=99999 + 12500)"
            - "SalesOrder.${ord2}.applied_discount_pct == 0.04 (projected 0 + 100000 >= 100000, inclusive boundary)"
            - "SalesOrder.${ord2}.gross_amount_cents == 5000000"
            - "SalesOrder.${ord2}.net_amount_cents == 4812500 (5000000 - 200000 + 12500)"

  # ------------------------------------------------------------------
  - rule_id: non_linear_state_machine
    instances:
      - name: cook_run_recook_cycle
        grounds:
          - state_machines.CookRun.COOKING_to_FAILED
          - state_machines.CookRun.FAILED_to_STAGED
          - state_machines.CookRun.STAGED_to_COOKING
          - calculations.batch_mass_conservation
        distinguishing_aspect: |
          Cyclic machine on CookRun: COOKING -> FAILED -> STAGED -> COOKING -> SETTLING ->
          FAILED -> STAGED -> ... -> COMPLETED; batch reservations persist through both
          failures and recook_count increments to 2 — a linear machine could never revisit
          STAGED.
        test_recipe:
          setup:
            - "Plant (cooker_capacity 2, std cost 38); supplier + ACTIVE agreement [OVINE]; ACCEPTED 5000-lb OVINE batch"
            - "Cook run RUMINANT_RENDER consuming 5000 lbs, window 2026-08-04T06:00:00Z..2026-08-04T09:00:00Z"
          setup_api_calls:
            - { call: "POST /rendering/plants", payload: { plant_name: "Plant A", location: "Dallas TX", cooker_capacity: 2, standard_cost_cents_per_lb: 38 }, as: PlantManager, captures: { plant_id: $.data.id } }
            - { call: "POST /rendering/suppliers", payload: { plant_id: "${plant_id}", supplier_name: "Sup A", supplier_type: "SLAUGHTERHOUSE" }, as: ProcurementManager, as_user_id: "pm-1", captures: { sup_id: $.data.id } }
            - { call: "POST /rendering/supplier-agreements", payload: { supplier_id: "${sup_id}", plant_id: "${plant_id}", agreement_ref: "AGR-1", species_scope: ["OVINE"], prohibited_material_policy: "SORT_AND_RETURN", accepts_dead_stock: false, pickup_base_fee_cents: 10000, per_lb_fee_cents: 2, mileage_rate_cents: 100, effective_from: "2026-08-01", effective_to: "2026-12-31" }, as: ProcurementManager, as_user_id: "pm-1", captures: { agr_id: $.data.id } }
            - { call: "POST /rendering/supplier-agreements/${agr_id}/submit", payload: {}, as: ProcurementManager, as_user_id: "pm-1" }
            - { call: "POST /rendering/supplier-agreements/${agr_id}/approve", payload: {}, as: PlantManager, as_user_id: "pmgr-1" }
            - { call: "POST /rendering/inbound-batches", payload: { plant_id: "${plant_id}", supplier_id: "${sup_id}", agreement_id: "${agr_id}", species: "OVINE", weight_lbs: 5000, temperature_f: 60.0, received_at: "2026-08-03T08:00:00Z" }, as: ScalehouseOperator, as_user_id: "sh-1", captures: { bat_id: $.data.id } }
            - { call: "POST /rendering/inbound-batches/${bat_id}/screen", payload: { screening_result: "PASS" }, as: ScalehouseOperator, as_user_id: "sh-1" }
            - { call: "POST /rendering/cook-runs", payload: { plant_id: "${plant_id}", cooker_line: 1, recipe: "RUMINANT_RENDER", planned_inputs: [ { batch_id: "${bat_id}", weight_lbs: 5000 } ], cook_start: "2026-08-04T06:00:00Z", cook_end: "2026-08-04T09:00:00Z" }, as: ProductionSupervisor, as_user_id: "ps-1", captures: { run_id: $.data.id } }
            - { call: "POST /rendering/cook-runs/${run_id}/start", payload: {}, as: ProductionSupervisor, as_user_id: "ps-1" }
            - { call: "POST /rendering/cook-runs/${run_id}/fail", payload: { failure_reason: "temp fault" }, as: ProductionSupervisor, as_user_id: "ps-1" }
            - { call: "POST /rendering/cook-runs/${run_id}/restage", payload: {}, as: ProductionSupervisor, as_user_id: "ps-1" }
            - { call: "POST /rendering/cook-runs/${run_id}/start", payload: {}, as: ProductionSupervisor, as_user_id: "ps-1" }
            - { call: "POST /rendering/cook-runs/${run_id}/advance", payload: {}, as: ProductionSupervisor, as_user_id: "ps-1" }
            - { call: "POST /rendering/cook-runs/${run_id}/fail", payload: { failure_reason: "agitator jam" }, as: ProductionSupervisor, as_user_id: "ps-1" }
            - { call: "POST /rendering/cook-runs/${run_id}/restage", payload: {}, as: ProductionSupervisor, as_user_id: "ps-1" }
            - { call: "POST /rendering/cook-runs/${run_id}/start", payload: {}, as: ProductionSupervisor, as_user_id: "ps-1" }
            - { call: "POST /rendering/cook-runs/${run_id}/advance", payload: {}, as: ProductionSupervisor, as_user_id: "ps-1" }
            - { call: "POST /rendering/cook-runs/${run_id}/advance", payload: {}, as: ProductionSupervisor, as_user_id: "ps-1" }
            - { call: "GET /rendering/inbound-batches/${bat_id}", as: Any }
          trigger:
            - { call: "POST /rendering/cook-runs/${run_id}/complete", payload: { actual_fat_output_lbs: 750, actual_meal_output_lbs: 1150 }, as: ProductionSupervisor, as_user_id: "ps-1" }
          assert:
            - "CookRun.${run_id}.recook_count == 2 after two FAILED -> STAGED cycles"
            - "CookRun.${run_id}.status == COMPLETED"
            - "CookRun.${run_id}.theoretical_fat_lbs == 750 (5000 * 0.15) and theoretical_meal_lbs == 1150 (5000 * 0.23)"
            - "CookRun.${run_id}.yield_variance_pct == 0.0"
            - "CookRun.${run_id}.energy_cost_cents == 12600 (3h * 4200)"
            - "InboundBatch.${bat_id} kept reserved_lbs == 5000 through both FAILED states (GET before complete) and ends consumed_lbs == 5000, status DEPLETED"

      - name: agreement_suspend_reinstate_cycle
        grounds:
          - state_machines.SupplierAgreement.ACTIVE_to_SUSPENDED
          - state_machines.SupplierAgreement.SUSPENDED_to_ACTIVE
          - validations[priority=11]
        distinguishing_aspect: |
          Cyclic machine on SupplierAgreement (different entity from CookRun): ACTIVE ->
          SUSPENDED blocks stop creation with ERR_AGREEMENT_NOT_ACTIVE, then SUSPENDED ->
          ACTIVE re-enables it — proving the loop is traversable in both directions.
        test_recipe:
          setup:
            - "Plant; supplier; agreement ACTIVE (species [BOVINE]); RAW vehicle; PLANNED route on 2026-08-10"
          setup_api_calls:
            - { call: "POST /rendering/plants", payload: { plant_name: "Plant A", location: "Dallas TX", cooker_capacity: 2, standard_cost_cents_per_lb: 38 }, as: PlantManager, captures: { plant_id: $.data.id } }
            - { call: "POST /rendering/suppliers", payload: { plant_id: "${plant_id}", supplier_name: "Sup A", supplier_type: "FARM" }, as: ProcurementManager, as_user_id: "pm-1", captures: { sup_id: $.data.id } }
            - { call: "POST /rendering/supplier-agreements", payload: { supplier_id: "${sup_id}", plant_id: "${plant_id}", agreement_ref: "AGR-1", species_scope: ["BOVINE"], prohibited_material_policy: "SORT_AND_RETURN", accepts_dead_stock: false, pickup_base_fee_cents: 10000, per_lb_fee_cents: 2, mileage_rate_cents: 100, effective_from: "2026-08-01", effective_to: "2026-12-31" }, as: ProcurementManager, as_user_id: "pm-1", captures: { agr_id: $.data.id } }
            - { call: "POST /rendering/supplier-agreements/${agr_id}/submit", payload: {}, as: ProcurementManager, as_user_id: "pm-1" }
            - { call: "POST /rendering/supplier-agreements/${agr_id}/approve", payload: {}, as: PlantManager, as_user_id: "pmgr-1" }
            - { call: "POST /rendering/vehicles", payload: { plant_id: "${plant_id}", vehicle_tag: "V1", capacity_lbs: 100000, duty_class: "RAW_MATERIAL" }, as: RouteDispatcher, as_user_id: "rd-1", captures: { veh_id: $.data.id } }
            - { call: "POST /rendering/collection-routes", payload: { plant_id: "${plant_id}", vehicle_id: "${veh_id}", route_code: "R1", service_date: "2026-08-10", scheduled_departure: "2026-08-10T06:00:00Z", scheduled_return: "2026-08-10T18:00:00Z" }, as: RouteDispatcher, as_user_id: "rd-1", captures: { route_id: $.data.id, route_v: $.data.version } }
            - { call: "POST /rendering/supplier-agreements/${agr_id}/suspend", payload: {}, as: PlantManager, as_user_id: "pmgr-1" }
          trigger:
            - { call: "POST /rendering/route-stops", payload: { route_id: "${route_id}", supplier_id: "${sup_id}", agreement_id: "${agr_id}", plant_id: "${plant_id}", sequence_no: 1, scheduled_window_start: "2026-08-10T08:00:00Z", scheduled_window_end: "2026-08-10T09:00:00Z", estimated_weight_lbs: 5000, estimated_distance_miles: 10, species_tag: "BOVINE", is_dead_stock: false, expected_route_version: "${route_v}" }, as: RouteDispatcher, as_user_id: "rd-1", captures: { err1: $.data.error_id } }
            - { call: "POST /rendering/supplier-agreements/${agr_id}/reinstate", payload: {}, as: PlantManager, as_user_id: "pmgr-1" }
            - { call: "POST /rendering/route-stops", payload: { route_id: "${route_id}", supplier_id: "${sup_id}", agreement_id: "${agr_id}", plant_id: "${plant_id}", sequence_no: 1, scheduled_window_start: "2026-08-10T08:00:00Z", scheduled_window_end: "2026-08-10T09:00:00Z", estimated_weight_lbs: 5000, estimated_distance_miles: 10, species_tag: "BOVINE", is_dead_stock: false, expected_route_version: "${route_v}" }, as: RouteDispatcher, as_user_id: "rd-1", captures: { stop_id: $.data.id } }
          assert:
            - "First stop create rejected: ${err1} == ERR_AGREEMENT_NOT_ACTIVE (409) while agreement SUSPENDED"
            - "After reinstate: SupplierAgreement.${agr_id}.status == ACTIVE and second stop create succeeds (201) with RouteStop.${stop_id}.status == SCHEDULED"
            - "Route version was NOT advanced by the rejected create (only the successful one increments it)"

  # ------------------------------------------------------------------
  - rule_id: transitive_cascade
    instances:
      - name: odor_confirm_permit_plant_route_cascade
        grounds:
          - state_machines.OdorEvent.REPORTED_to_CONFIRMED
          - state_machines.CompliancePermit.ACTIVE_to_SUSPENDED
          - state_machines.Plant.OPERATING_to_SUSPENDED
          - state_machines.CollectionRoute.IN_PROGRESS_to_CANCELLED
          - calculations.odor_score_update
        distinguishing_aspect: |
          Depth-4 cascade triggered by odor-event confirmation: confirm -> permit.confirmed_
          violation_count increments -> count reaching threshold (2) suspends the PERMIT ->
          permit suspension suspends PLANT posture -> posture cascade CANCELS non-terminal
          routes -> each cancelled route cancels its SCHEDULED/ARRIVED stops. Each link is
          caused by the previous link, and odor_score 700 (>= 600) proves the suspension is
          permit-driven, not score-driven.
        test_recipe:
          setup:
            - "Plant; CompliancePermit ACTIVE with odor_event_threshold 2, expires_on 2027-01-31"
            - "Supplier + ACTIVE agreement [BOVINE]; RAW vehicle cap 100000"
            - "Route R1 (2026-08-10 06:00-18:00) DISPATCHED with stop1 ARRIVED and stop2 SCHEDULED; route R2 (2026-08-11 06:00-18:00, same vehicle, non-overlapping) PLANNED with stop3 SCHEDULED"
            - "Two HIGH-severity odor events REPORTED by co-1"
          setup_api_calls:
            - { call: "POST /rendering/plants", payload: { plant_name: "Plant A", location: "Dallas TX", cooker_capacity: 2, standard_cost_cents_per_lb: 38 }, as: PlantManager, captures: { plant_id: $.data.id } }
            - { call: "POST /rendering/permits", payload: { plant_id: "${plant_id}", permit_number: "P-1", odor_event_threshold: 2, emission_limit_ppm: 5.0, expires_on: "2027-01-31" }, as: ComplianceOfficer, as_user_id: "co-1", captures: { per_id: $.data.id } }
            - { call: "POST /rendering/permits/${per_id}/submit", payload: {}, as: ComplianceOfficer, as_user_id: "co-1" }
            - { call: "POST /rendering/permits/${per_id}/issue", payload: {}, as: Regulator, as_user_id: "reg-1" }
            - { call: "POST /rendering/suppliers", payload: { plant_id: "${plant_id}", supplier_name: "Sup A", supplier_type: "FARM" }, as: ProcurementManager, as_user_id: "pm-1", captures: { sup_id: $.data.id } }
            - { call: "POST /rendering/supplier-agreements", payload: { supplier_id: "${sup_id}", plant_id: "${plant_id}", agreement_ref: "AGR-1", species_scope: ["BOVINE"], prohibited_material_policy: "SORT_AND_RETURN", accepts_dead_stock: false, pickup_base_fee_cents: 10000, per_lb_fee_cents: 2, mileage_rate_cents: 100, effective_from: "2026-08-01", effective_to: "2026-12-31" }, as: ProcurementManager, as_user_id: "pm-1", captures: { agr_id: $.data.id } }
            - { call: "POST /rendering/supplier-agreements/${agr_id}/submit", payload: {}, as: ProcurementManager, as_user_id: "pm-1" }
            - { call: "POST /rendering/supplier-agreements/${agr_id}/approve", payload: {}, as: PlantManager, as_user_id: "pmgr-1" }
            - { call: "POST /rendering/vehicles", payload: { plant_id: "${plant_id}", vehicle_tag: "V1", capacity_lbs: 100000, duty_class: "RAW_MATERIAL" }, as: RouteDispatcher, as_user_id: "rd-1", captures: { veh_id: $.data.id } }
            - { call: "POST /rendering/collection-routes", payload: { plant_id: "${plant_id}", vehicle_id: "${veh_id}", route_code: "R1", service_date: "2026-08-10", scheduled_departure: "2026-08-10T06:00:00Z", scheduled_return: "2026-08-10T18:00:00Z" }, as: RouteDispatcher, as_user_id: "rd-1", captures: { r1: $.data.id, r1_v: $.data.version } }
            - { call: "POST /rendering/route-stops", payload: { route_id: "${r1}", supplier_id: "${sup_id}", agreement_id: "${agr_id}", plant_id: "${plant_id}", sequence_no: 1, scheduled_window_start: "2026-08-10T08:00:00Z", scheduled_window_end: "2026-08-10T09:00:00Z", estimated_weight_lbs: 5000, estimated_distance_miles: 10, species_tag: "BOVINE", is_dead_stock: false, expected_route_version: "${r1_v}" }, as: RouteDispatcher, as_user_id: "rd-1", captures: { s1: $.data.id } }
            - { call: "GET /rendering/collection-routes/${r1}", as: Any, captures: { r1_v2: $.data.version } }
            - { call: "POST /rendering/route-stops", payload: { route_id: "${r1}", supplier_id: "${sup_id}", agreement_id: "${agr_id}", plant_id: "${plant_id}", sequence_no: 2, scheduled_window_start: "2026-08-10T10:00:00Z", scheduled_window_end: "2026-08-10T11:00:00Z", estimated_weight_lbs: 4000, estimated_distance_miles: 5, species_tag: "BOVINE", is_dead_stock: false, expected_route_version: "${r1_v2}" }, as: RouteDispatcher, as_user_id: "rd-1", captures: { s2: $.data.id } }
            - { call: "POST /rendering/collection-routes/${r1}/dispatch", payload: {}, as: RouteDispatcher, as_user_id: "rd-1" }
            - { call: "POST /rendering/route-stops/${s1}/arrive", payload: {}, as: RouteDispatcher, as_user_id: "rd-1" }
            - { call: "POST /rendering/collection-routes", payload: { plant_id: "${plant_id}", vehicle_id: "${veh_id}", route_code: "R2", service_date: "2026-08-11", scheduled_departure: "2026-08-11T06:00:00Z", scheduled_return: "2026-08-11T18:00:00Z" }, as: RouteDispatcher, as_user_id: "rd-1", captures: { r2: $.data.id, r2_v: $.data.version } }
            - { call: "POST /rendering/route-stops", payload: { route_id: "${r2}", supplier_id: "${sup_id}", agreement_id: "${agr_id}", plant_id: "${plant_id}", sequence_no: 1, scheduled_window_start: "2026-08-11T08:00:00Z", scheduled_window_end: "2026-08-11T09:00:00Z", estimated_weight_lbs: 3000, estimated_distance_miles: 8, species_tag: "BOVINE", is_dead_stock: false, expected_route_version: "${r2_v}" }, as: RouteDispatcher, as_user_id: "rd-1", captures: { s3: $.data.id } }
            - { call: "POST /rendering/odor-events", payload: { plant_id: "${plant_id}", reported_at: "2026-08-10T09:30:00Z", location_description: "East fence", severity: "HIGH" }, as: ComplianceOfficer, as_user_id: "co-1", captures: { ev1: $.data.id } }
            - { call: "POST /rendering/odor-events", payload: { plant_id: "${plant_id}", reported_at: "2026-08-10T11:00:00Z", location_description: "North gate", severity: "HIGH" }, as: ComplianceOfficer, as_user_id: "co-1", captures: { ev2: $.data.id } }
            - { call: "POST /rendering/odor-events/${ev1}/confirm", payload: {}, as: ComplianceOfficer, as_user_id: "co-2" }
          trigger:
            - { call: "POST /rendering/odor-events/${ev2}/confirm", payload: {}, as: ComplianceOfficer, as_user_id: "co-2" }
            - { call: "GET /rendering/permits/${per_id}", as: Any }
            - { call: "GET /rendering/plants/${plant_id}", as: Any }
            - { call: "GET /rendering/collection-routes/${r1}", as: Any }
            - { call: "GET /rendering/collection-routes/${r2}", as: Any }
            - { call: "GET /rendering/route-stops/${s1}", as: Any }
            - { call: "GET /rendering/route-stops/${s3}", as: Any }
          assert:
            - "OdorEvent.${ev2}.status == CONFIRMED and permit_id == ${per_id}"
            - "CompliancePermit.${per_id}.confirmed_violation_count == 2 and status == SUSPENDED (threshold reached by the second confirm)"
            - "Plant.${plant_id}.posture == SUSPENDED while odor_score == 700 (>= 600, so suspension is permit-driven, not score-driven)"
            - "CollectionRoute.${r1}.status == CANCELLED and CollectionRoute.${r2}.status == CANCELLED"
            - "RouteStop.${s1}.status == CANCELLED (was ARRIVED) and RouteStop.${s3}.status == CANCELLED (was SCHEDULED)"

      - name: stop_rejection_strike_agreement_cascade
        grounds:
          - state_machines.RouteStop.ARRIVED_to_REJECTED_AT_SITE
          - state_machines.Supplier.ACTIVE_to_SUSPENDED
          - state_machines.SupplierAgreement.ACTIVE_to_SUSPENDED
          - state_machines.RouteStop.SCHEDULED_to_CANCELLED
        distinguishing_aspect: |
          Depth-3 cascade from a different trigger (stop rejection, not odor confirmation):
          reject-at-site with PROHIBITED_MATERIAL -> supplier.contamination_strikes increments
          -> third strike suspends the SUPPLIER -> supplier suspension suspends its ACTIVE
          AGREEMENT -> agreement suspension cancels the supplier's remaining SCHEDULED stops.
        test_recipe:
          setup:
            - "Plant; supplier; ACTIVE agreement [BOVINE]; RAW vehicle cap 100000"
            - "Route R1 (2026-08-10) DISPATCHED with stops s1, s2, s3 (all ARRIVED); route R2 (2026-08-11) PLANNED with stop s4 SCHEDULED"
          setup_api_calls:
            - { call: "POST /rendering/plants", payload: { plant_name: "Plant A", location: "Dallas TX", cooker_capacity: 2, standard_cost_cents_per_lb: 38 }, as: PlantManager, captures: { plant_id: $.data.id } }
            - { call: "POST /rendering/suppliers", payload: { plant_id: "${plant_id}", supplier_name: "Sup A", supplier_type: "FARM" }, as: ProcurementManager, as_user_id: "pm-1", captures: { sup_id: $.data.id } }
            - { call: "POST /rendering/supplier-agreements", payload: { supplier_id: "${sup_id}", plant_id: "${plant_id}", agreement_ref: "AGR-1", species_scope: ["BOVINE"], prohibited_material_policy: "ZERO_TOLERANCE", accepts_dead_stock: false, pickup_base_fee_cents: 10000, per_lb_fee_cents: 2, mileage_rate_cents: 100, effective_from: "2026-08-01", effective_to: "2026-12-31" }, as: ProcurementManager, as_user_id: "pm-1", captures: { agr_id: $.data.id } }
            - { call: "POST /rendering/supplier-agreements/${agr_id}/submit", payload: {}, as: ProcurementManager, as_user_id: "pm-1" }
            - { call: "POST /rendering/supplier-agreements/${agr_id}/approve", payload: {}, as: PlantManager, as_user_id: "pmgr-1" }
            - { call: "POST /rendering/vehicles", payload: { plant_id: "${plant_id}", vehicle_tag: "V1", capacity_lbs: 100000, duty_class: "RAW_MATERIAL" }, as: RouteDispatcher, as_user_id: "rd-1", captures: { veh_id: $.data.id } }
            - { call: "POST /rendering/collection-routes", payload: { plant_id: "${plant_id}", vehicle_id: "${veh_id}", route_code: "R1", service_date: "2026-08-10", scheduled_departure: "2026-08-10T06:00:00Z", scheduled_return: "2026-08-10T18:00:00Z" }, as: RouteDispatcher, as_user_id: "rd-1", captures: { r1: $.data.id, rv: $.data.version } }
            - { call: "POST /rendering/route-stops", payload: { route_id: "${r1}", supplier_id: "${sup_id}", agreement_id: "${agr_id}", plant_id: "${plant_id}", sequence_no: 1, scheduled_window_start: "2026-08-10T08:00:00Z", scheduled_window_end: "2026-08-10T09:00:00Z", estimated_weight_lbs: 5000, estimated_distance_miles: 10, species_tag: "BOVINE", is_dead_stock: false, expected_route_version: "${rv}" }, as: RouteDispatcher, as_user_id: "rd-1", captures: { s1: $.data.id } }
            - { call: "GET /rendering/collection-routes/${r1}", as: Any, captures: { rv2: $.data.version } }
            - { call: "POST /rendering/route-stops", payload: { route_id: "${r1}", supplier_id: "${sup_id}", agreement_id: "${agr_id}", plant_id: "${plant_id}", sequence_no: 2, scheduled_window_start: "2026-08-10T10:00:00Z", scheduled_window_end: "2026-08-10T11:00:00Z", estimated_weight_lbs: 4000, estimated_distance_miles: 5, species_tag: "BOVINE", is_dead_stock: false, expected_route_version: "${rv2}" }, as: RouteDispatcher, as_user_id: "rd-1", captures: { s2: $.data.id } }
            - { call: "GET /rendering/collection-routes/${r1}", as: Any, captures: { rv3: $.data.version } }
            - { call: "POST /rendering/route-stops", payload: { route_id: "${r1}", supplier_id: "${sup_id}", agreement_id: "${agr_id}", plant_id: "${plant_id}", sequence_no: 3, scheduled_window_start: "2026-08-10T12:00:00Z", scheduled_window_end: "2026-08-10T13:00:00Z", estimated_weight_lbs: 3000, estimated_distance_miles: 6, species_tag: "BOVINE", is_dead_stock: false, expected_route_version: "${rv3}" }, as: RouteDispatcher, as_user_id: "rd-1", captures: { s3: $.data.id } }
            - { call: "POST /rendering/collection-routes", payload: { plant_id: "${plant_id}", vehicle_id: "${veh_id}", route_code: "R2", service_date: "2026-08-11", scheduled_departure: "2026-08-11T06:00:00Z", scheduled_return: "2026-08-11T18:00:00Z" }, as: RouteDispatcher, as_user_id: "rd-1", captures: { r2: $.data.id, r2v: $.data.version } }
            - { call: "POST /rendering/route-stops", payload: { route_id: "${r2}", supplier_id: "${sup_id}", agreement_id: "${agr_id}", plant_id: "${plant_id}", sequence_no: 1, scheduled_window_start: "2026-08-11T08:00:00Z", scheduled_window_end: "2026-08-11T09:00:00Z", estimated_weight_lbs: 2000, estimated_distance_miles: 4, species_tag: "BOVINE", is_dead_stock: false, expected_route_version: "${r2v}" }, as: RouteDispatcher, as_user_id: "rd-1", captures: { s4: $.data.id } }
            - { call: "POST /rendering/collection-routes/${r1}/dispatch", payload: {}, as: RouteDispatcher, as_user_id: "rd-1" }
            - { call: "POST /rendering/route-stops/${s1}/arrive", payload: {}, as: RouteDispatcher, as_user_id: "rd-1" }
            - { call: "POST /rendering/route-stops/${s2}/arrive", payload: {}, as: RouteDispatcher, as_user_id: "rd-1" }
            - { call: "POST /rendering/route-stops/${s3}/arrive", payload: {}, as: RouteDispatcher, as_user_id: "rd-1" }
            - { call: "POST /rendering/route-stops/${s1}/reject-at-site", payload: { rejection_reason: "PROHIBITED_MATERIAL" }, as: RouteDispatcher, as_user_id: "rd-1" }
            - { call: "POST /rendering/route-stops/${s2}/reject-at-site", payload: { rejection_reason: "PROHIBITED_MATERIAL" }, as: RouteDispatcher, as_user_id: "rd-1" }
          trigger:
            - { call: "POST /rendering/route-stops/${s3}/reject-at-site", payload: { rejection_reason: "PROHIBITED_MATERIAL" }, as: RouteDispatcher, as_user_id: "rd-1" }
            - { call: "GET /rendering/suppliers/${sup_id}", as: Any }
            - { call: "GET /rendering/supplier-agreements/${agr_id}", as: Any }
            - { call: "GET /rendering/route-stops/${s4}", as: Any }
          assert:
            - "Supplier.${sup_id}.contamination_strikes == 3 and status == SUSPENDED (third strike)"
            - "SupplierAgreement.${agr_id}.status == SUSPENDED (caused by supplier suspension)"
            - "RouteStop.${s4}.status == CANCELLED (caused by agreement suspension; never dispatched)"
            - "RouteStops ${s1}/${s2}/${s3} are REJECTED_AT_SITE with final_fee_cents still null (no fee accrues on rejection)"

  # ------------------------------------------------------------------
  - rule_id: priority_pair_validation_conflict
    instances:
      - name: dispatch_cancelled_route_dirty_vehicle
        grounds:
          - validations[priority=6]
          - validations[priority=8]
          - state_machines.CollectionRoute.PLANNED_to_CANCELLED
          - state_machines.Vehicle.SANITIZED_to_DIRTY
        distinguishing_aspect: |
          Error-category pair state(6) vs business_safety(8): the dispatch request violates
          both (route already CANCELLED; vehicle QUARANTINED, not SANITIZED) and the
          lower-priority-numbered state error ERR_ROUTE_INVALID_STATE must win.
        test_recipe:
          setup:
            - "Plant; supplier + ACTIVE agreement; RAW vehicle V1; route R1 dispatched then completed via a missed stop (vehicle -> DIRTY); vehicle washed back to SANITIZED"
            - "Route R2 created for V1 on 2026-08-11 with one stop, then CANCELLED; vehicle then QUARANTINED by ComplianceOfficer"
          setup_api_calls:
            - { call: "POST /rendering/plants", payload: { plant_name: "Plant A", location: "Dallas TX", cooker_capacity: 2, standard_cost_cents_per_lb: 38 }, as: PlantManager, captures: { plant_id: $.data.id } }
            - { call: "POST /rendering/suppliers", payload: { plant_id: "${plant_id}", supplier_name: "Sup A", supplier_type: "FARM" }, as: ProcurementManager, as_user_id: "pm-1", captures: { sup_id: $.data.id } }
            - { call: "POST /rendering/supplier-agreements", payload: { supplier_id: "${sup_id}", plant_id: "${plant_id}", agreement_ref: "AGR-1", species_scope: ["BOVINE"], prohibited_material_policy: "SORT_AND_RETURN", accepts_dead_stock: false, pickup_base_fee_cents: 10000, per_lb_fee_cents: 2, mileage_rate_cents: 100, effective_from: "2026-08-01", effective_to: "2026-12-31" }, as: ProcurementManager, as_user_id: "pm-1", captures: { agr_id: $.data.id } }
            - { call: "POST /rendering/supplier-agreements/${agr_id}/submit", payload: {}, as: ProcurementManager, as_user_id: "pm-1" }
            - { call: "POST /rendering/supplier-agreements/${agr_id}/approve", payload: {}, as: PlantManager, as_user_id: "pmgr-1" }
            - { call: "POST /rendering/vehicles", payload: { plant_id: "${plant_id}", vehicle_tag: "V1", capacity_lbs: 100000, duty_class: "RAW_MATERIAL" }, as: RouteDispatcher, as_user_id: "rd-1", captures: { veh_id: $.data.id } }
            - { call: "POST /rendering/collection-routes", payload: { plant_id: "${plant_id}", vehicle_id: "${veh_id}", route_code: "R1", service_date: "2026-08-10", scheduled_departure: "2026-08-10T06:00:00Z", scheduled_return: "2026-08-10T18:00:00Z" }, as: RouteDispatcher, as_user_id: "rd-1", captures: { r1: $.data.id, r1v: $.data.version } }
            - { call: "POST /rendering/route-stops", payload: { route_id: "${r1}", supplier_id: "${sup_id}", agreement_id: "${agr_id}", plant_id: "${plant_id}", sequence_no: 1, scheduled_window_start: "2026-08-10T08:00:00Z", scheduled_window_end: "2026-08-10T09:00:00Z", estimated_weight_lbs: 5000, estimated_distance_miles: 10, species_tag: "BOVINE", is_dead_stock: false, expected_route_version: "${r1v}" }, as: RouteDispatcher, as_user_id: "rd-1", captures: { s1: $.data.id } }
            - { call: "POST /rendering/collection-routes/${r1}/dispatch", payload: {}, as: RouteDispatcher, as_user_id: "rd-1" }
            - { call: "POST /rendering/route-stops/${s1}/miss", payload: {}, as: RouteDispatcher, as_user_id: "rd-1" }
            - { call: "POST /rendering/collection-routes/${r1}/complete", payload: {}, as: RouteDispatcher, as_user_id: "rd-1" }
            - { call: "POST /rendering/vehicles/${veh_id}/wash-tickets", payload: { plant_id: "${plant_id}", wash_type: "STANDARD", washed_at: "2026-08-10T19:00:00Z", detergent_ppm: 800.0, result: "PASS" }, as: RouteDispatcher, as_user_id: "rd-1" }
            - { call: "POST /rendering/collection-routes", payload: { plant_id: "${plant_id}", vehicle_id: "${veh_id}", route_code: "R2", service_date: "2026-08-11", scheduled_departure: "2026-08-11T06:00:00Z", scheduled_return: "2026-08-11T18:00:00Z" }, as: RouteDispatcher, as_user_id: "rd-1", captures: { r2: $.data.id, r2v: $.data.version } }
            - { call: "POST /rendering/route-stops", payload: { route_id: "${r2}", supplier_id: "${sup_id}", agreement_id: "${agr_id}", plant_id: "${plant_id}", sequence_no: 1, scheduled_window_start: "2026-08-11T08:00:00Z", scheduled_window_end: "2026-08-11T09:00:00Z", estimated_weight_lbs: 5000, estimated_distance_miles: 10, species_tag: "BOVINE", is_dead_stock: false, expected_route_version: "${r2v}" }, as: RouteDispatcher, as_user_id: "rd-1" }
            - { call: "POST /rendering/collection-routes/${r2}/cancel", payload: {}, as: RouteDispatcher, as_user_id: "rd-1" }
            - { call: "POST /rendering/vehicles/${veh_id}/quarantine", payload: {}, as: ComplianceOfficer, as_user_id: "co-1" }
          trigger:
            - { call: "POST /rendering/collection-routes/${r2}/dispatch", payload: {}, as: RouteDispatcher, as_user_id: "rd-1", captures: { err1: $.data.error_id } }
          assert:
            - "${err1} == ERR_ROUTE_INVALID_STATE (state priority 6 beats business_safety priority 8 even though the vehicle is QUARANTINED)"
            - "CollectionRoute.${r2}.status remains CANCELLED; Vehicle.${veh_id}.sanitation_status remains QUARANTINED"

