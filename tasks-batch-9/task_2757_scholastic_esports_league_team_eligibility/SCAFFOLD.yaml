# ============================================================================
# PRD Benchmark Scaffold — Scholastic Esports League & Team Eligibility
# Sections §1.0–§1.7. Difficulty design lives in SCAFFOLD_DIFFICULTY_DESIGN.yaml,
# corner design in SCAFFOLD_CORNER_DESIGN.yaml.
# ============================================================================

scenario: |
  2757. Scholastic Esports League & Team Eligibility (high school esports league): school team
  registration, coach designation and roster lock deadlines, student eligibility on academic
  standing, age and enrollment verification, title selection with age rating restrictions and
  district approval, season scheduling, match server configuration and result reporting with
  dispute windows, fair play enforcement including account sharing, smurfing and cheat detection,
  playoff seeding, tiebreakers and forfeit rules, scholarship and showcase pathways with recruiting
  contact rules, streaming, spectator conduct and content moderation

domain_name: scholastic-esports-league
api_prefix: ""          # flat topology — every collection is a top-level path

complexity_profile:
  primary_archetype: compliance_audit
  secondary_archetype: temporal_windowing
  complexity_layers:
    - optimistic_concurrency
    - cascading_side_effects
    - dual_variant_calculation
    - derived_field_reconciliation

  entity_topology: flat
  # Every entity is a peer collection at the URL root; parentage is expressed
  # only through FK fields in request bodies (no nested resource paths).

  state_machine_shape: parallel
  # Match carries four independent state dimensions (play_status x result_status
  # x dispute_status x broadcast_status), RosterSlot carries two verification
  # axes plus a derived participation axis, Team has a SUSPENDED<->COMPETING
  # cycle, FairPlayCase forks REPORTED->INVESTIGATING->{SUSTAINED,DISMISSED}
  # with an APPEALED re-entry, and Season is compound over Team/Match children.

  relationship_patterns:
    - one_to_many          # District->School, School->Student, Team->RosterSlot
    - many_to_many         # District<->Title via TitleApproval; Team<->Student via RosterSlot
    - polymorphic          # FairPlayCase.subject_type ∈ {STUDENT, MATCH_BROADCAST}
    - cross_aggregate      # RosterSlot verification reads Coach + Season + Title + District

  role_model: segregation_of_duties
  # Two-person verification on RosterSlot (enrollment verifier != academics
  # verifier) and appeal independence on FairPlayCase (investigator/decider !=
  # appeal decider), both enforced on X-User-ID.

  consistency_model: immediate
  difficulty_level: expert
  # Endpoint count (58) exceeds the nominal Expert band because 11 entities each
  # owe a single-resource GET plus an FK-filtered list GET (22 of the 58 are
  # read-only discovery endpoints mandated by §1.5 FK reverse-reachability), and
  # one is the /_clock test-driving endpoint. The mutating business surface is 35.

# ---------------------------------------------------------------------------
# §1.0 Response Envelope (FIXED — verbatim)
# ---------------------------------------------------------------------------
response_envelope:
  success: |
    { "meta": { "api_request_id": "req_xxx", "api_request_timestamp": "ISO8601" },
      "response_type": "object" | "array", "data": {} }
  error: |
    { "meta": { ... }, "response_type": "error",
      "data": { "error_id": "ERR_XXX", "message": "..." } }
  pagination_fields: ["limit", "offset", "total_count", "has_more"]
  pagination_defaults: { limit: 10, min: 1, max: 100, offset: 0 }

serialization_notes:
  datetime_format: |
    Every datetime field (input and output, including created_at / updated_at and
    every *_at field) is serialized as ISO 8601 UTC with exactly three fractional
    digits and a trailing Z: YYYY-MM-DDTHH:MM:SS.mmmZ. Inputs supplied with fewer
    or more fractional digits are normalized to exactly three on persistence.
  date_format: "Pure date fields (birthdate, age_cutoff_date, enrollment_verified_through, background_check_expires_on) use YYYY-MM-DD."
  money: "All money is integer cents. No floats are persisted for money."
  logical_clock: |
    All temporal comparisons read the logical clock (POST /_clock/set_current_utc).
    Server startup default is exactly 2026-08-01T00:00:00.000Z; the real wall clock
    is never consulted.

# ---------------------------------------------------------------------------
# §1.1 Entity-Relationship Table
# ---------------------------------------------------------------------------
entities:
  - name: District
    parent: null
    common_fields: true
    fields:
      - name: name
        type: string
        source: input
        description: District display name
        constraints: 1..120 chars, required
      - name: state_code
        type: string
        source: input
        description: Two-letter US state code the district reports under
        constraints: exactly 2 uppercase letters, required
      - name: max_age_rating
        type: enum
        source: input
        description: Highest ESRB rating the district permits for league titles
        default: "T"
        constraints: "one of {E, E10, T, M}; ordinal E=0 < E10=1 < T=2 < M=3"
      - name: academic_standing_basis
        type: enum
        source: input
        description: Selects which academic_standing_evaluation variant applies to this district's students
        default: "TERM_SNAPSHOT"
        constraints: "one of {TERM_SNAPSHOT, ROLLING_CUMULATIVE}"
      - name: min_gpa
        type: number
        source: input
        description: GPA at or above which a student is in GOOD standing
        default: 2.000
        constraints: 0.000..4.000, three decimals
      - name: probation_gpa_floor
        type: number
        source: input
        description: GPA at or above which a student below min_gpa is PROBATION rather than INELIGIBLE
        default: 1.750
        constraints: 0.000..4.000, three decimals, must be <= min_gpa
      - name: dispute_window_hours
        type: integer
        source: input
        description: Hours after result confirmation during which a match result may be disputed
        default: 48
        constraints: 1..336
      - name: subsidy_pct
        type: number
        source: input
        description: Fraction of each entry-fee line item the district subsidizes
        default: 0.25
        constraints: 0.000..1.000, three decimals
      - name: subsidy_pool_cents
        type: integer
        source: input
        description: Remaining subsidy budget in cents; debited on team registration, restored on withdrawal
        default: 5000000
        constraints: ">= 0"
      - name: subsidy_pool_initial_cents
        type: integer
        source: system
        description: Immutable copy of subsidy_pool_cents at creation; anchor for the subsidy conservation invariant
      - name: recruiting_dead_period_start
        type: datetime
        source: input
        description: Inclusive start of the district recruiting dead period; null when no dead period is configured
        default: null
      - name: recruiting_dead_period_end
        type: datetime
        source: input
        description: Inclusive end of the district recruiting dead period; null when no dead period is configured
        default: null
      - name: recruiting_contact_cap_per_window
        type: integer
        source: input
        description: Maximum recruiting contacts per student inside the rolling window
        default: 3
        constraints: 1..50
      - name: recruiting_window_days
        type: integer
        source: input
        description: Length in days of the rolling recruiting-contact window
        default: 30
        constraints: 1..365
      - name: broadcast_buffer_minutes
        type: integer
        source: input
        description: Cool-down buffer applied to both ends of a broadcast window when testing channel conflicts
        default: 15
        constraints: 0..240

  - name: School
    parent: null
    common_fields: true
    fields:
      - name: district_id
        type: string
        source: input
        description: FK -> District.id; the district whose policy governs this school
      - name: name
        type: string
        source: input
        description: School display name
        constraints: 1..120 chars, required
      - name: nces_code
        type: string
        source: input
        description: School identifier code, unique within the district
        constraints: 1..24 chars, required, unique per district_id
      - name: enrollment_verified_through
        type: string
        source: input
        description: Date through which this school's enrollment roster is certified (YYYY-MM-DD)
        default: "2027-06-30"
      - name: concurrent_broadcast_capacity
        type: integer
        source: input
        description: Number of simultaneous broadcasts the school channel supports
        default: 1
        constraints: 1..4
      - name: status
        type: enum
        source: system
        description: School participation status
        default: "ACTIVE"
        constraints: "one of {ACTIVE, PROBATION, INACTIVE}"

  - name: Coach
    parent: null
    common_fields: true
    fields:
      - name: school_id
        type: string
        source: input
        description: FK -> School.id; the school that designated this coach
      - name: full_name
        type: string
        source: input
        description: Coach legal name
        constraints: 1..120 chars, required
      - name: email
        type: string
        source: input
        description: Coach contact email
        constraints: required, must contain '@'
      - name: certification_status
        type: enum
        source: system
        description: Coach certification state
        default: "PENDING"
        constraints: "one of {PENDING, CERTIFIED, SUSPENDED}"
      - name: background_check_expires_on
        type: string
        source: system
        description: Date the background check lapses (YYYY-MM-DD); set by POST /coaches/{coachId}/certification
        default: null
      - name: certified_at
        type: datetime
        source: system
        description: Timestamp certification was granted
        default: null

  - name: Student
    parent: null
    common_fields: true
    fields:
      - name: school_id
        type: string
        source: input
        description: FK -> School.id; the school where the student is enrolled
      - name: full_name
        type: string
        source: input
        description: Student legal name
        constraints: 1..120 chars, required
      - name: birthdate
        type: string
        source: input
        description: Student date of birth (YYYY-MM-DD), required
      - name: grade_level
        type: integer
        source: input
        description: Current grade level
        constraints: 9..12, required
      - name: enrollment_status
        type: enum
        source: input
        description: Registrar-reported enrollment state
        default: "ENROLLED"
        constraints: "one of {ENROLLED, WITHDRAWN, GRADUATED}"
      - name: credits_completed
        type: number
        source: input
        description: Cumulative credits completed
        default: 0
        constraints: ">= 0"
      - name: latest_term_label
        type: string
        source: system
        description: Label of the most recently posted academic term
        default: null
      - name: latest_term_gpa
        type: number
        source: system
        description: GPA of the most recently posted term; written by POST /students/{studentId}/academic-postings
        default: null
      - name: latest_term_credits
        type: number
        source: system
        description: Credits of the most recently posted term
        default: null
      - name: prior_term_gpa
        type: number
        source: system
        description: GPA of the term displaced by the latest posting (shift register of depth 2)
        default: null
      - name: prior_term_credits
        type: number
        source: system
        description: Credits of the term displaced by the latest posting
        default: null
      - name: effective_gpa
        type: number
        source: computed
        description: Output of academic_standing_evaluation under the district's academic_standing_basis; three decimals
        default: null
      - name: academic_standing
        type: enum
        source: computed
        description: Standing derived from effective_gpa against District.min_gpa / probation_gpa_floor
        default: "UNEVALUATED"
        constraints: "one of {UNEVALUATED, GOOD, PROBATION, INELIGIBLE}"
      - name: standing_basis_applied
        type: enum
        source: computed
        description: Which academic_standing_evaluation variant produced effective_gpa
        default: null
        constraints: "one of {TERM_SNAPSHOT, ROLLING_CUMULATIVE}"
      - name: fair_play_status
        type: enum
        source: system
        description: CLEAR until a FairPlayCase naming this student is SUSTAINED or SUSTAINED_FINAL
        default: "CLEAR"
        constraints: "one of {CLEAR, SANCTIONED}"
      - name: showcase_status
        type: enum
        source: system
        description: Showcase pathway state; gates recruiting contacts
        default: "NONE"
        constraints: "one of {NONE, NOMINATED}"
      - name: nominating_team_id
        type: string
        source: system
        description: FK -> Team.id; team whose seed_position fed the scholarship projection, null before nomination
        default: null
      - name: award_tier
        type: enum
        source: computed
        description: Tier chosen in STEP 2 of showcase_scholarship_award from the provisional total
        default: "NONE"
        constraints: "one of {NONE, BRONZE, SILVER, GOLD}"
      - name: provisional_award_cents
        type: integer
        source: computed
        description: STEP 1 output of showcase_scholarship_award, before the tier bonus
        default: 0
      - name: scholarship_award_cents
        type: integer
        source: computed
        description: STEP 4 output of showcase_scholarship_award
        default: 0
      - name: scholarship_award_state
        type: enum
        source: system
        description: CURRENT while the nominating team's seeding is fresh; RECALC_REQUIRED once seeding goes STALE
        default: "NONE"
        constraints: "one of {NONE, CURRENT, RECALC_REQUIRED}"
      - name: recruiting_contact_log
        type: array
        source: system
        description: "Append-only log of accepted recruiting contacts; each element {contacted_at, org_code, channel, purpose}"
        default: []

  - name: Title
    parent: null
    common_fields: true
    fields:
      - name: name
        type: string
        source: input
        description: Game title name
        constraints: 1..120 chars, required, globally unique
      - name: publisher
        type: string
        source: input
        description: Publisher name
        constraints: required
      - name: age_rating
        type: enum
        source: input
        description: ESRB rating of the title
        default: "T"
        constraints: "one of {E, E10, T, M}; ordinal E=0 < E10=1 < T=2 < M=3"
      - name: min_player_age
        type: integer
        source: input
        description: Minimum player age the publisher permits in sanctioned play
        default: 13
        constraints: 6..21
      - name: server_pool_id
        type: string
        source: input
        description: Identifier of the shared match-server pool this title runs on
        default: "POOL-DEFAULT"
      - name: server_pool_capacity
        type: integer
        source: input
        description: Maximum matches the pool can host at any single instant
        default: 1
        constraints: 1..8
      - name: match_duration_minutes
        type: integer
        source: input
        description: Scheduled duration of one match on this title; fixes each match's occupied interval
        default: 60
        constraints: 15..240

  - name: TitleApproval
    parent: null
    common_fields: true
    fields:
      - name: district_id
        type: string
        source: input
        description: FK -> District.id; the approving district
      - name: title_id
        type: string
        source: input
        description: FK -> Title.id; the title under review
      - name: requested_by_school_id
        type: string
        source: input
        description: FK -> School.id; the school that requested the approval
      - name: status
        type: enum
        source: system
        description: Approval lifecycle state
        default: "PENDING"
        constraints: "one of {PENDING, APPROVED, DENIED, REVOKED}"
      - name: decided_by_user_id
        type: string
        source: system
        description: X-User-ID of the DistrictAdmin who decided; opaque operator id, never an entity id
        default: null
      - name: decided_at
        type: datetime
        source: system
        description: Logical-clock timestamp of the decision
        default: null
      - name: decision_note
        type: string
        source: input
        description: Free-text rationale recorded with the decision
        default: null

  - name: Season
    parent: null
    common_fields: true
    fields:
      - name: title_id
        type: string
        source: input
        description: FK -> Title.id; the single title this season is played on
      - name: name
        type: string
        source: input
        description: Season display name
        constraints: 1..120 chars, required
      - name: division
        type: enum
        source: input
        description: Competitive division
        default: "VARSITY"
        constraints: "one of {VARSITY, JV}"
      - name: registration_opens_at
        type: datetime
        source: input
        description: Inclusive start of the team registration window
        default: "2026-08-01T00:00:00.000Z"
      - name: registration_closes_at
        type: datetime
        source: input
        description: Inclusive end of the team registration window
        default: "2026-09-15T23:59:59.999Z"
      - name: roster_lock_at
        type: datetime
        source: input
        description: Inclusive deadline for a coach to lock the roster
        default: "2026-09-20T00:00:00.000Z"
      - name: regular_season_end_at
        type: datetime
        source: input
        description: Inclusive end of the window in which matches may be scheduled
        default: "2026-11-30T00:00:00.000Z"
      - name: age_cutoff_date
        type: string
        source: input
        description: Date (YYYY-MM-DD) at which student age is measured for eligibility
        default: "2026-09-01"
      - name: max_age
        type: integer
        source: input
        description: A student whose age at age_cutoff_date is >= this value is over-age
        default: 19
        constraints: 14..25
      - name: min_starters
        type: integer
        source: input
        description: Minimum ACTIVE STARTER slots a team needs to register and to stay unsuspended
        default: 1
        constraints: 1..5
      - name: max_starters
        type: integer
        source: input
        description: Maximum STARTER slots a team may hold
        default: 3
        constraints: 1..8
      - name: base_entry_fee_cents
        type: integer
        source: input
        description: Flat per-team entry fee line item in cents
        default: 12510
        constraints: ">= 0"
      - name: per_starter_fee_cents
        type: integer
        source: input
        description: Per-STARTER entry fee line item in cents
        default: 3335
        constraints: ">= 0"
      - name: seeding_basis
        type: enum
        source: input
        description: Selects which seed_points variant the seeding run applies by default
        default: "MATCH_POINT_BASIS"
        constraints: "one of {MATCH_POINT_BASIS, WIN_PERCENTAGE_BASIS}"
      - name: seeding_basis_applied
        type: enum
        source: computed
        description: Which seed_points variant the last seeding run actually used (seeding_basis, or the run's basis_override when supplied)
        default: null
        constraints: "one of {MATCH_POINT_BASIS, WIN_PERCENTAGE_BASIS}"
      - name: playoff_slots
        type: integer
        source: input
        description: Number of top seeds promoted to PLAYOFF_SEEDED by a seeding run
        default: 2
        constraints: 1..16
      - name: status
        type: enum
        source: system
        description: Season stage
        default: "DRAFT"
        constraints: "one of {DRAFT, REGISTRATION_OPEN, ROSTER_LOCKED, REGULAR_SEASON, PLAYOFFS, COMPLETE}"
      - name: seeding_state
        type: enum
        source: system
        description: Freshness of the seed order relative to current team results
        default: "UNSEEDED"
        constraints: "one of {UNSEEDED, SEEDED, STALE}"
      - name: seed_order
        type: array
        source: computed
        description: "Ordered team ids produced by the last seeding run; element 0 is seed_position 1"
        default: []
      - name: registered_team_count
        type: integer
        source: computed
        description: Count of Teams in this season with status NOT IN {DRAFT, WITHDRAWN}
        default: 0
      - name: match_point_pool
        type: integer
        source: computed
        description: Running total of match points awarded in this season; anchor for the match-point conservation invariant
        default: 0

  - name: Team
    parent: null
    common_fields: true
    fields:
      - name: season_id
        type: string
        source: input
        description: FK -> Season.id; the season this team competes in
      - name: school_id
        type: string
        source: input
        description: FK -> School.id; the school fielding the team
      - name: title_id
        type: string
        source: input
        description: FK -> Title.id; must equal the season's title_id
      - name: coach_id
        type: string
        source: input
        description: FK -> Coach.id; designated coach, must belong to school_id
      - name: name
        type: string
        source: input
        description: Team display name
        constraints: 1..120 chars, required, unique per season_id
      - name: status
        type: enum
        source: system
        description: Team lifecycle state
        default: "DRAFT"
        constraints: "one of {DRAFT, REGISTERED, ROSTER_LOCKED, COMPETING, SUSPENDED, PLAYOFF_SEEDED, ELIMINATED, WITHDRAWN, DISQUALIFIED}"
      - name: registered_at
        type: datetime
        source: system
        description: Logical-clock timestamp of the DRAFT -> REGISTERED transition
        default: null
      - name: roster_locked_at
        type: datetime
        source: system
        description: Logical-clock timestamp of the REGISTERED -> ROSTER_LOCKED transition
        default: null
      - name: starter_slots_used
        type: integer
        source: computed
        description: Count of RosterSlots on this team with slot_role STARTER and participation_status IN {PROSPECTIVE, ACTIVE, INELIGIBLE}
        default: 0
      - name: starter_slots_available
        type: integer
        source: computed
        description: Season.max_starters - starter_slots_used; second half of the starter-capacity conservation invariant
        default: 0
      - name: active_starter_count
        type: integer
        source: computed
        description: Count of RosterSlots on this team with slot_role STARTER and participation_status == ACTIVE
        default: 0
      - name: entry_fee_cents
        type: integer
        source: computed
        description: Sum of entry-fee line items pinned at registration by team_entry_fee
        default: 0
      - name: subsidy_granted_cents
        type: integer
        source: computed
        description: Per-line-item rounded subsidy pinned at registration; returned to the district pool on withdrawal
        default: 0
      - name: net_fee_due_cents
        type: integer
        source: computed
        description: entry_fee_cents - subsidy_granted_cents
        default: 0
      - name: match_points
        type: integer
        source: system
        description: Accumulated league points from finalized, forfeited and adjudicated matches
        default: 0
      - name: wins
        type: integer
        source: system
        description: Count of non-forfeit match wins
        default: 0
      - name: losses
        type: integer
        source: system
        description: Count of non-forfeit match losses
        default: 0
      - name: draws
        type: integer
        source: system
        description: Count of drawn matches
        default: 0
      - name: forfeits_charged
        type: integer
        source: system
        description: Count of matches this team forfeited
        default: 0
      - name: forfeit_wins
        type: integer
        source: system
        description: Count of matches won because the opponent forfeited
        default: 0
      - name: games_won
        type: integer
        source: system
        description: Sum of games won across counted matches
        default: 0
      - name: games_lost
        type: integer
        source: system
        description: Sum of games lost across counted matches
        default: 0
      - name: game_differential
        type: integer
        source: computed
        description: games_won - games_lost; third tiebreaker in tiebreak_seed_order
        default: 0
      - name: seed_points
        type: number
        source: computed
        description: Output of the seed_points variant selected by Season.seeding_basis, four decimals
        default: 0.0
      - name: seed_position
        type: integer
        source: computed
        description: 1-based rank assigned by the last seeding run; null before the first run
        default: null
      - name: seed_stale
        type: boolean
        source: system
        description: True once results changed after the seeding run that produced seed_position
        default: false
      - name: integrity_score
        type: number
        source: computed
        description: Output of team_integrity_score, two decimals, floor 0 ceiling 100
        default: 100.0
      - name: suspension_reason
        type: enum
        source: system
        description: Why the team is SUSPENDED; null while not suspended
        default: null
        constraints: "one of {FAIR_PLAY_SANCTION, ROSTER_MINIMUM_BREACH, INTEGRITY_FLOOR_BREACH}"

  - name: RosterSlot
    parent: null
    common_fields: true
    fields:
      - name: team_id
        type: string
        source: input
        description: FK -> Team.id; the team holding this slot
      - name: student_id
        type: string
        source: input
        description: FK -> Student.id; the rostered student, must belong to the team's school
      - name: slot_role
        type: enum
        source: input
        description: Competitive role of the slot
        default: "STARTER"
        constraints: "one of {STARTER, SUB}"
      - name: verification_status
        type: enum
        source: system
        description: "Axis 1 (age + enrollment): advances only via POST /roster-slots/{slotId}/verify-enrollment"
        default: "UNVERIFIED"
        constraints: "one of {UNVERIFIED, ENROLLMENT_VERIFIED}"
      - name: academic_status
        type: enum
        source: system
        description: "Axis 2 (academics): advances only via POST /roster-slots/{slotId}/verify-academics"
        default: "PENDING"
        constraints: "one of {PENDING, CLEARED, BLOCKED}"
      - name: participation_status
        type: enum
        source: computed
        description: Derived axis reconciled from verification_status, academic_status, Student.fair_play_status and release
        default: "PROSPECTIVE"
        constraints: "one of {PROSPECTIVE, ACTIVE, INELIGIBLE, RELEASED}"
      - name: enrollment_verified_by_user_id
        type: string
        source: system
        description: X-User-ID of the EligibilityOfficer who verified enrollment; opaque operator id
        default: null
      - name: academics_verified_by_user_id
        type: string
        source: system
        description: X-User-ID of the EligibilityOfficer who verified academics; must differ from enrollment_verified_by_user_id
        default: null
      - name: enrollment_document_ref
        type: string
        source: input
        description: Registrar document reference captured at enrollment verification
        default: null
      - name: verified_birthdate
        type: string
        source: input
        description: Birthdate as printed on the registrar document (YYYY-MM-DD); must equal Student.birthdate
        default: null
      - name: age_at_cutoff
        type: integer
        source: computed
        description: Completed years from verified_birthdate to Season.age_cutoff_date, pinned at enrollment verification
        default: null
      - name: standing_at_verification
        type: enum
        source: computed
        description: Snapshot of Student.academic_standing taken when academics were verified
        default: null
        constraints: "one of {GOOD, PROBATION, INELIGIBLE}"
      - name: effective_gpa_at_verification
        type: number
        source: computed
        description: Snapshot of Student.effective_gpa taken when academics were verified, three decimals
        default: null
      - name: released_at
        type: datetime
        source: system
        description: Logical-clock timestamp the slot was released
        default: null
      - name: ineligibility_reason
        type: enum
        source: system
        description: Why participation_status is INELIGIBLE
        default: null
        constraints: "one of {ACADEMIC, FAIR_PLAY, ENROLLMENT}"

  - name: Match
    parent: null
    common_fields: true
    fields:
      - name: season_id
        type: string
        source: input
        description: FK -> Season.id; the season the match belongs to
      - name: home_team_id
        type: string
        source: input
        description: FK -> Team.id; home side
      - name: away_team_id
        type: string
        source: input
        description: FK -> Team.id; away side, must differ from home_team_id
      - name: scheduled_start_at
        type: datetime
        source: input
        description: Inclusive start of the occupied server interval
      - name: scheduled_end_at
        type: datetime
        source: computed
        description: scheduled_start_at + Title.match_duration_minutes; exclusive end of the occupied server interval
        default: null
      - name: server_pool_id
        type: string
        source: computed
        description: Copied from the season's Title at creation; the resource whose capacity overlap is checked
        default: null
      - name: region_code
        type: string
        source: input
        description: Server region set by POST /matches/{matchId}/server-config
        default: null
      - name: patch_version
        type: string
        source: input
        description: Game patch pinned for the match by POST /matches/{matchId}/server-config
        default: null
      - name: play_status
        type: enum
        source: system
        description: "Dimension 1: play lifecycle"
        default: "SCHEDULED"
        constraints: "one of {SCHEDULED, SERVER_READY, PLAYED, FINALIZED, FORFEITED}"
      - name: result_status
        type: enum
        source: system
        description: "Dimension 2: result reporting lifecycle"
        default: "AWAITING_REPORTS"
        constraints: "one of {AWAITING_REPORTS, PARTIALLY_REPORTED, CONFIRMED, CONTESTED, ADJUDICATED}"
      - name: dispute_status
        type: enum
        source: system
        description: "Dimension 3: dispute lifecycle, cyclic between UNDER_REVIEW and NEEDS_INFO"
        default: "NONE"
        constraints: "one of {NONE, OPEN, UNDER_REVIEW, NEEDS_INFO, UPHELD, REJECTED}"
      - name: broadcast_status
        type: enum
        source: system
        description: "Dimension 4: streaming lifecycle, cyclic between LIVE and SUSPENDED"
        default: "NONE"
        constraints: "one of {NONE, SCHEDULED, LIVE, SUSPENDED, ENDED}"
      - name: broadcast_school_id
        type: string
        source: input
        description: FK -> School.id; school whose channel carries the stream, null when no broadcast is registered
        default: null
      - name: broadcast_start_at
        type: datetime
        source: input
        description: Inclusive start of the requested broadcast window
        default: null
      - name: broadcast_end_at
        type: datetime
        source: input
        description: Inclusive end of the requested broadcast window
        default: null
      - name: spectator_strikes
        type: integer
        source: system
        description: Count of accepted moderation actions against this broadcast
        default: 0
      - name: home_reported_home_games_won
        type: integer
        source: system
        description: Home coach's reported home game count; null until the home report lands
        default: null
      - name: home_reported_away_games_won
        type: integer
        source: system
        description: Home coach's reported away game count
        default: null
      - name: away_reported_home_games_won
        type: integer
        source: system
        description: Away coach's reported home game count
        default: null
      - name: away_reported_away_games_won
        type: integer
        source: system
        description: Away coach's reported away game count
        default: null
      - name: home_games_won
        type: integer
        source: computed
        description: Accepted home game count once reports agree or an adjudication pins it
        default: null
      - name: away_games_won
        type: integer
        source: computed
        description: Accepted away game count once reports agree or an adjudication pins it
        default: null
      - name: result_confirmed_at
        type: datetime
        source: system
        description: Logical-clock timestamp the result reached CONFIRMED, ADJUDICATED or FORFEITED
        default: null
      - name: dispute_deadline_at
        type: datetime
        source: computed
        description: result_confirmed_at + District.dispute_window_hours, resolved through home team -> School -> District
        default: null
      - name: dispute_filed_by_team_id
        type: string
        source: system
        description: FK -> Team.id; team that filed the open dispute, null when dispute_status is NONE
        default: null
      - name: dispute_reason_code
        type: enum
        source: input
        description: Reason the result is contested
        default: null
        constraints: "one of {SCORE_MISMATCH, SERVER_FAULT, INELIGIBLE_PLAYER, CONDUCT}"
      - name: winner_team_id
        type: string
        source: computed
        description: FK -> Team.id; null on a draw or before the result is decided
        default: null
      - name: forfeiting_team_id
        type: string
        source: system
        description: FK -> Team.id; set when the match is forfeited
        default: null
      - name: home_points_awarded
        type: integer
        source: computed
        description: Match points currently credited to the home team from this match
        default: 0
      - name: away_points_awarded
        type: integer
        source: computed
        description: Match points currently credited to the away team from this match
        default: 0

  - name: FairPlayCase
    parent: null
    common_fields: true
    fields:
      - name: team_id
        type: string
        source: input
        description: FK -> Team.id; the team whose integrity_score absorbs the sanction
      - name: subject_type
        type: enum
        source: input
        description: Which kind of subject the case names (polymorphic discriminator)
        constraints: "one of {STUDENT, MATCH_BROADCAST}, required"
      - name: subject_student_id
        type: string
        source: input
        description: FK -> Student.id; required when subject_type is STUDENT, otherwise must be omitted
        default: null
      - name: subject_match_id
        type: string
        source: input
        description: FK -> Match.id; required when subject_type is MATCH_BROADCAST, otherwise must be omitted
        default: null
      - name: case_type
        type: enum
        source: input
        description: Fair-play violation class
        constraints: "one of {ACCOUNT_SHARING, SMURFING, CHEAT_DETECTION, SPECTATOR_CONDUCT}, required"
      - name: evidence_ref
        type: string
        source: input
        description: Evidence bundle reference
        constraints: required, 1..200 chars
      - name: severity
        type: enum
        source: system
        description: Severity pinned by the sustaining decision; null until sustained
        default: null
        constraints: "one of {MINOR, MAJOR, SEVERE}"
      - name: status
        type: enum
        source: system
        description: Case lifecycle state
        default: "REPORTED"
        constraints: "one of {REPORTED, INVESTIGATING, SUSTAINED, DISMISSED, APPEALED, SUSTAINED_FINAL, OVERTURNED}"
      - name: reported_by_user_id
        type: string
        source: system
        description: X-User-ID of the reporter; opaque operator id or a Coach id
        default: null
      - name: investigator_user_id
        type: string
        source: system
        description: X-User-ID recorded when the case moved to INVESTIGATING
        default: null
      - name: decider_user_id
        type: string
        source: system
        description: X-User-ID that sustained or dismissed the case
        default: null
      - name: appeal_decider_user_id
        type: string
        source: system
        description: X-User-ID that decided the appeal; must differ from investigator_user_id and decider_user_id
        default: null
      - name: severity_weight
        type: number
        source: computed
        description: SEVERITY_WEIGHT[severity] + TYPE_SURCHARGE[case_type], the per-case penalty before the repeat multiplier
        default: 0
      - name: repeat_index
        type: integer
        source: computed
        description: 1-based position of this case among the team's sustained cases ordered by created_at ASC
        default: null
      - name: applied_penalty
        type: number
        source: computed
        description: round_half_up(severity_weight * REPEAT_MULTIPLIER[repeat_index], 2) as charged to the team
        default: 0
      - name: sanction_type
        type: enum
        source: computed
        description: Sanction selected by team_integrity_score's sanction ladder
        default: "NONE"
        constraints: "one of {NONE, WARNING, STUDENT_SUSPENSION, TEAM_SUSPENSION, DISQUALIFICATION}"
      - name: appeal_grounds
        type: string
        source: input
        description: Coach's written grounds for appeal
        default: null
      - name: decided_at
        type: datetime
        source: system
        description: Logical-clock timestamp of the sustaining or dismissing decision
        default: null

# ---------------------------------------------------------------------------
# §1.2 State Machine Table
# ---------------------------------------------------------------------------
state_machines:

  - entity: TitleApproval
    initial_state: PENDING
    terminal_states: [DENIED, REVOKED]
    transitions:
      - from: PENDING
        to: APPROVED
        trigger: "POST /title-approvals/{approvalId}/decision with action=APPROVE"
        actor: DistrictAdmin
        preconditions:
          - "TitleApproval.status == PENDING"
          - "X-User-ID equals TitleApproval.district_id (DistrictAdmin acts only on own district)"
          - "ordinal(Title.age_rating) <= ordinal(District.max_age_rating) — else ERR_TITLE_AGE_RATING_EXCEEDS_DISTRICT_CEILING"
        side_effects:
          - "TitleApproval.decided_by_user_id = X-User-ID; decided_at = clock.now"
          - "increments TitleApproval.version by 1"
      - from: PENDING
        to: DENIED
        trigger: "POST /title-approvals/{approvalId}/decision with action=DENY"
        actor: DistrictAdmin
        preconditions:
          - "TitleApproval.status == PENDING"
          - "X-User-ID equals TitleApproval.district_id"
        side_effects:
          - "TitleApproval.decided_by_user_id = X-User-ID; decided_at = clock.now"
          - "increments TitleApproval.version by 1"
      - from: APPROVED
        to: REVOKED
        trigger: "POST /title-approvals/{approvalId}/decision with action=REVOKE"
        actor: DistrictAdmin
        preconditions:
          - "TitleApproval.status == APPROVED"
          - "X-User-ID equals TitleApproval.district_id"
        side_effects:
          - "TitleApproval.decided_by_user_id = X-User-ID; decided_at = clock.now"
          - "Teams in status DRAFT whose title_id == this title and whose School.district_id == this district can no longer register (guarded by the Team DRAFT -> REGISTERED precondition); already-REGISTERED teams are unaffected"
          - "increments TitleApproval.version by 1"
        note: "Revocation is deliberately non-retroactive so the Team guard reads only current approval status."

  - entity: Season
    initial_state: DRAFT
    terminal_states: [COMPLETE]
    transitions:
      - from: DRAFT
        to: REGISTRATION_OPEN
        trigger: "POST /seasons/{seasonId}/advance with to_status=REGISTRATION_OPEN"
        actor: LeagueAdmin
        preconditions: ["Season.status == DRAFT"]
        side_effects: ["increments Season.version by 1"]
      - from: REGISTRATION_OPEN
        to: ROSTER_LOCKED
        trigger: "POST /seasons/{seasonId}/advance with to_status=ROSTER_LOCKED"
        actor: LeagueAdmin
        preconditions:
          - "Season.status == REGISTRATION_OPEN"
          - "count(Team where season_id == this season AND status == ROSTER_LOCKED) >= 2 — else ERR_INVALID_SEASON_STAGE (compound over children)"
        side_effects:
          - "every Team in this season with status == REGISTERED is left untouched (it missed the lock and cannot compete)"
          - "increments Season.version by 1"
      - from: ROSTER_LOCKED
        to: REGULAR_SEASON
        trigger: "POST /seasons/{seasonId}/advance with to_status=REGULAR_SEASON"
        actor: LeagueAdmin
        preconditions: ["Season.status == ROSTER_LOCKED"]
        side_effects:
          - "every Team in this season with status == ROSTER_LOCKED auto-transitions to COMPETING (cascade down)"
          - "increments Season.version by 1"
      - from: REGULAR_SEASON
        to: PLAYOFFS
        trigger: "POST /seasons/{seasonId}/advance with to_status=PLAYOFFS"
        actor: LeagueAdmin
        preconditions:
          - "Season.status == REGULAR_SEASON"
          - "Season.seeding_state == SEEDED — else ERR_SEASON_SEEDING_NOT_CURRENT (a STALE or UNSEEDED order may not open playoffs)"
        side_effects: ["increments Season.version by 1"]
      - from: PLAYOFFS
        to: COMPLETE
        trigger: "POST /seasons/{seasonId}/advance with to_status=COMPLETE"
        actor: LeagueAdmin
        preconditions:
          - "Season.status == PLAYOFFS"
          - "every Match in this season has play_status IN {FINALIZED, FORFEITED} — else ERR_INVALID_SEASON_STAGE (compound over children)"
        side_effects: ["increments Season.version by 1"]

  - entity: Team
    initial_state: DRAFT
    terminal_states: [WITHDRAWN, DISQUALIFIED]
    transitions:
      - from: DRAFT
        to: REGISTERED
        trigger: "POST /teams/{teamId}/register"
        actor: Coach
        preconditions:
          - "Team.status == DRAFT"
          - "X-User-ID equals Team.coach_id"
          - "Season.status == REGISTRATION_OPEN"
          - "Season.registration_opens_at <= clock.now <= Season.registration_closes_at — else ERR_REGISTRATION_WINDOW_CLOSED"
          - "Coach.certification_status == CERTIFIED — else ERR_COACH_NOT_CERTIFIED"
          - "Coach.background_check_expires_on >= date(clock.now) — else ERR_COACH_BACKGROUND_CHECK_EXPIRED"
          - "exists TitleApproval where district_id == School(Team.school_id).district_id AND title_id == Team.title_id AND status == APPROVED — else ERR_TITLE_NOT_DISTRICT_APPROVED (cross-entity guard on TitleApproval)"
          - "Team.active_starter_count >= Season.min_starters — else ERR_ROSTER_MINIMUM_NOT_MET"
          - "District.subsidy_pool_cents >= team_entry_fee.subsidy_granted_cents — else ERR_SUBSIDY_POOL_EXHAUSTED"
        side_effects:
          - "runs team_entry_fee: sets Team.entry_fee_cents, Team.subsidy_granted_cents, Team.net_fee_due_cents"
          - "District.subsidy_pool_cents -= Team.subsidy_granted_cents (ledger sync)"
          - "Season.registered_team_count recomputed"
          - "Team.registered_at = clock.now"
          - "increments Team.version by 1"
      - from: REGISTERED
        to: ROSTER_LOCKED
        trigger: "POST /teams/{teamId}/roster-lock"
        actor: Coach
        preconditions:
          - "Team.status == REGISTERED"
          - "X-User-ID equals Team.coach_id"
          - "clock.now <= Season.roster_lock_at — else ERR_ROSTER_LOCK_DEADLINE_PASSED"
          - "Team.active_starter_count >= Season.min_starters — else ERR_ROSTER_MINIMUM_NOT_MET"
        side_effects:
          - "Team.roster_locked_at = clock.now"
          - "increments Team.version by 1"
      - from: ROSTER_LOCKED
        to: COMPETING
        trigger: "system event: Season advances ROSTER_LOCKED -> REGULAR_SEASON"
        actor: system
        preconditions: ["Team.status == ROSTER_LOCKED"]
        side_effects: ["increments Team.version by 1"]
      - from: COMPETING
        to: SUSPENDED
        trigger: "system event: a FairPlayCase against this team reaches SUSTAINED with sanction_type IN {TEAM_SUSPENSION, DISQUALIFICATION}, or the team's active_starter_count drops below Season.min_starters, or integrity_score < 40"
        actor: system
        preconditions: ["Team.status == COMPETING"]
        side_effects:
          - "Team.suspension_reason set to FAIR_PLAY_SANCTION | ROSTER_MINIMUM_BREACH | INTEGRITY_FLOOR_BREACH"
          - "every Match of this team with play_status IN {SCHEDULED, SERVER_READY} transitions to FORFEITED with forfeiting_team_id = this team (cascade, see the Match machine)"
          - "increments Team.version by 1"
      - from: SUSPENDED
        to: COMPETING
        trigger: "system event: the sustaining FairPlayCase is OVERTURNED on appeal and Team.active_starter_count >= Season.min_starters"
        actor: system
        preconditions:
          - "Team.status == SUSPENDED"
          - "Team.active_starter_count >= Season.min_starters"
          - "no remaining FairPlayCase against this team with status IN {SUSTAINED, SUSTAINED_FINAL} and sanction_type IN {TEAM_SUSPENSION, DISQUALIFICATION}"
        side_effects:
          - "Team.suspension_reason = null"
          - "every Match forfeited solely by this suspension is restored to its pre-suspension play_status (compensation, see the Match machine)"
          - "increments Team.version by 1"
        note: "Closes the COMPETING <-> SUSPENDED cycle; this is the non-linear shape on Team."
      - from: "COMPETING | PLAYOFF_SEEDED | ELIMINATED"
        to: PLAYOFF_SEEDED
        trigger: "system event: seeding run assigns seed_position <= Season.playoff_slots"
        actor: system
        preconditions: ["Team.status IN {COMPETING, PLAYOFF_SEEDED, ELIMINATED} (a re-seeding run may promote a previously ELIMINATED team)"]
        side_effects: ["Team.seed_position, Team.seed_points set; Team.seed_stale = false; increments Team.version by 1"]
      - from: "COMPETING | PLAYOFF_SEEDED | ELIMINATED"
        to: ELIMINATED
        trigger: "system event: seeding run assigns seed_position > Season.playoff_slots"
        actor: system
        preconditions: ["Team.status IN {COMPETING, PLAYOFF_SEEDED, ELIMINATED} (a re-seeding run may demote a previously PLAYOFF_SEEDED team)"]
        side_effects: ["Team.seed_position, Team.seed_points set; Team.seed_stale = false; increments Team.version by 1"]
      - from: REGISTERED
        to: WITHDRAWN
        trigger: "POST /teams/{teamId}/withdraw"
        actor: AthleticDirector
        preconditions:
          - "Team.status IN {REGISTERED, ROSTER_LOCKED, COMPETING, SUSPENDED, PLAYOFF_SEEDED, ELIMINATED}"
          - "X-User-ID equals Team.school_id"
        side_effects:
          - "District.subsidy_pool_cents += Team.subsidy_granted_cents; Team.subsidy_granted_cents = 0; Team.net_fee_due_cents = 0 (compensating action for the registration debit)"
          - "every RosterSlot of this team with participation_status != RELEASED transitions to RELEASED"
          - "every Match of this team with play_status IN {SCHEDULED, SERVER_READY} transitions to FORFEITED with forfeiting_team_id = this team"
          - "Season.registered_team_count recomputed; Season.seeding_state set to STALE when it was SEEDED"
          - "increments Team.version by 1"
      - from: SUSPENDED
        to: DISQUALIFIED
        trigger: "system event: a FairPlayCase against this team reaches SUSTAINED_FINAL with sanction_type == DISQUALIFICATION"
        actor: system
        preconditions: ["Team.status IN {SUSPENDED, COMPETING}"]
        side_effects:
          - "every RosterSlot of this team with participation_status != RELEASED transitions to RELEASED"
          - "Season.seeding_state set to STALE when it was SEEDED"
          - "increments Team.version by 1"

  - entity: RosterSlot
    initial_state: PROSPECTIVE
    terminal_states: [RELEASED]
    transitions:
      - from: "verification_status=UNVERIFIED"
        to: "verification_status=ENROLLMENT_VERIFIED"
        trigger: "POST /roster-slots/{slotId}/verify-enrollment"
        actor: EligibilityOfficer
        preconditions:
          - "RosterSlot.participation_status != RELEASED"
          - "Team.status IN {DRAFT, REGISTERED} — else ERR_ROSTER_LOCKED"
          - "Student.enrollment_status == ENROLLED — else ERR_STUDENT_NOT_ENROLLED"
          - "verified_birthdate == Student.birthdate — else ERR_BIRTHDATE_DOCUMENT_MISMATCH"
          - "School(Student.school_id).enrollment_verified_through >= date(clock.now) — else ERR_ENROLLMENT_CERTIFICATION_LAPSED"
          - "Coach(Team.coach_id).certification_status == CERTIFIED — else ERR_COACH_NOT_CERTIFIED (cross-entity guard on Coach)"
          - "Coach(Team.coach_id).background_check_expires_on >= date(clock.now) — else ERR_COACH_BACKGROUND_CHECK_EXPIRED"
          - "age_at_cutoff >= Title.min_player_age — else ERR_STUDENT_BELOW_TITLE_MIN_AGE"
          - "age_at_cutoff < Season.max_age — else ERR_STUDENT_OVER_AGE_LIMIT"
        side_effects:
          - "RosterSlot.age_at_cutoff = completed years from verified_birthdate to Season.age_cutoff_date"
          - "RosterSlot.enrollment_verified_by_user_id = X-User-ID"
          - "participation_status reconciled by roster_slot_participation"
          - "Team.starter_slots_used / starter_slots_available / active_starter_count recomputed"
          - "increments RosterSlot.version by 1"
        note: "Axis 1 of the parallel machine; independent of the academic axis."
      - from: "academic_status=PENDING"
        to: "academic_status=CLEARED"
        trigger: "POST /roster-slots/{slotId}/verify-academics when academic_standing_evaluation yields GOOD, or yields PROBATION on a SUB slot"
        actor: EligibilityOfficer
        preconditions:
          - "RosterSlot.participation_status != RELEASED"
          - "Team.status IN {DRAFT, REGISTERED} — else ERR_ROSTER_LOCKED"
          - "X-User-ID != RosterSlot.enrollment_verified_by_user_id — else ERR_SEGREGATION_OF_DUTIES"
          - "Student.latest_term_gpa is not null — else ERR_ACADEMIC_STANDING_INELIGIBLE"
          - "resulting academic_standing != INELIGIBLE — else ERR_ACADEMIC_STANDING_INELIGIBLE"
          - "resulting academic_standing != PROBATION when slot_role == STARTER — else ERR_PROBATION_STARTER_RESTRICTED"
        side_effects:
          - "runs academic_standing_evaluation: writes Student.effective_gpa, Student.academic_standing, Student.standing_basis_applied"
          - "RosterSlot.standing_at_verification, RosterSlot.effective_gpa_at_verification snapshotted"
          - "RosterSlot.academics_verified_by_user_id = X-User-ID"
          - "participation_status reconciled by roster_slot_participation"
          - "Team.active_starter_count recomputed"
          - "increments RosterSlot.version by 1"
        note: "Axis 2 of the parallel machine; a slot may reach CLEARED before or after ENROLLMENT_VERIFIED."
      - from: "academic_status=PENDING"
        to: "academic_status=BLOCKED"
        trigger: "system event: POST /students/{studentId}/academic-postings drops the student's recomputed academic_standing to INELIGIBLE while the slot is not yet locked"
        actor: system
        preconditions: ["RosterSlot.academic_status == PENDING", "Team.status IN {DRAFT, REGISTERED}"]
        side_effects:
          - "RosterSlot.ineligibility_reason = ACADEMIC"
          - "participation_status reconciled to INELIGIBLE"
          - "Team.active_starter_count recomputed"
          - "increments RosterSlot.version by 1"
      - from: "participation_status=ACTIVE"
        to: "participation_status=INELIGIBLE"
        trigger: "system event: Student.fair_play_status becomes SANCTIONED because a FairPlayCase naming that student was SUSTAINED"
        actor: system
        preconditions: ["RosterSlot.participation_status == ACTIVE"]
        side_effects:
          - "RosterSlot.ineligibility_reason = FAIR_PLAY"
          - "Team.active_starter_count recomputed; when it falls below Season.min_starters the Team COMPETING -> SUSPENDED transition fires (cascade link 3 -> 4)"
          - "increments RosterSlot.version by 1"
      - from: "participation_status=INELIGIBLE"
        to: "participation_status=ACTIVE"
        trigger: "system event: Student.fair_play_status returns to CLEAR because the sustaining FairPlayCase was OVERTURNED on appeal"
        actor: system
        preconditions:
          - "RosterSlot.participation_status == INELIGIBLE AND RosterSlot.ineligibility_reason == FAIR_PLAY"
          - "RosterSlot.verification_status == ENROLLMENT_VERIFIED AND RosterSlot.academic_status == CLEARED"
        side_effects:
          - "RosterSlot.ineligibility_reason = null"
          - "Team.active_starter_count recomputed"
          - "increments RosterSlot.version by 1"
      - from: "participation_status IN {PROSPECTIVE, ACTIVE, INELIGIBLE}"
        to: "participation_status=RELEASED"
        trigger: "POST /roster-slots/{slotId}/release"
        actor: Coach
        preconditions:
          - "RosterSlot.participation_status != RELEASED"
          - "X-User-ID equals Team.coach_id"
          - "Team.status IN {DRAFT, REGISTERED} — else ERR_ROSTER_LOCKED"
        side_effects:
          - "RosterSlot.released_at = clock.now"
          - "Team.starter_slots_used decremented and Team.starter_slots_available incremented (starter-capacity conservation)"
          - "Team.active_starter_count recomputed"
          - "increments RosterSlot.version by 1"

  - entity: Match
    initial_state: "play_status=SCHEDULED, result_status=AWAITING_REPORTS, dispute_status=NONE, broadcast_status=NONE"
    terminal_states: ["play_status=FINALIZED", "play_status=FORFEITED"]
    transitions:
      - from: "play_status=SCHEDULED"
        to: "play_status=SERVER_READY"
        trigger: "POST /matches/{matchId}/server-config"
        actor: LeagueAdmin
        preconditions:
          - "Match.play_status == SCHEDULED — else ERR_INVALID_MATCH_STATE"
          - "Season.status IN {ROSTER_LOCKED, REGULAR_SEASON, PLAYOFFS} — else ERR_INVALID_SEASON_STAGE"
        side_effects:
          - "Match.region_code and Match.patch_version pinned"
          - "increments Match.version by 1"
      - from: "result_status=AWAITING_REPORTS"
        to: "result_status=PARTIALLY_REPORTED"
        trigger: "POST /matches/{matchId}/result-reports (first report of the two)"
        actor: Coach
        preconditions:
          - "Match.play_status == SERVER_READY — else ERR_INVALID_MATCH_STATE"
          - "Season.status IN {REGULAR_SEASON, PLAYOFFS} — else ERR_INVALID_SEASON_STAGE (cross-entity guard on Season)"
          - "reporting_team_id IN {Match.home_team_id, Match.away_team_id} — else ERR_TEAM_NOT_MATCH_PARTICIPANT"
          - "X-User-ID equals Coach.id of the reporting team — else ERR_NOT_RESOURCE_OWNER"
          - "expected_match_version == Match.version — else ERR_STALE_VERSION"
        side_effects:
          - "stores home_reported_* or away_reported_* for the reporting side (a repeat report from the same side supersedes its prior values)"
          - "increments Match.version by 1"
      - from: "result_status=PARTIALLY_REPORTED"
        to: "result_status=CONFIRMED"
        trigger: "POST /matches/{matchId}/result-reports (second report agreeing with the first)"
        actor: Coach
        preconditions:
          - "same preconditions as the first report"
          - "home_reported_home_games_won == away_reported_home_games_won AND home_reported_away_games_won == away_reported_away_games_won"
        side_effects:
          - "Match.home_games_won / away_games_won pinned to the agreed pair; Match.winner_team_id set (null on a draw)"
          - "Match.play_status SERVER_READY -> PLAYED"
          - "Match.result_confirmed_at = clock.now"
          - "Match.dispute_deadline_at = result_confirmed_at + District.dispute_window_hours (District resolved via home_team -> School -> District)"
          - "runs match_point_award: Match.home_points_awarded / away_points_awarded set, both Teams' match_points / wins / losses / draws / games_won / games_lost updated"
          - "Season.match_point_pool += (home_points_awarded + away_points_awarded); Season.seeding_state set to STALE when it was SEEDED; both Teams' seed_stale = true"
          - "increments Match.version by 1"
      - from: "result_status=PARTIALLY_REPORTED"
        to: "result_status=CONTESTED"
        trigger: "POST /matches/{matchId}/result-reports (second report disagreeing with the first)"
        actor: Coach
        preconditions:
          - "same preconditions as the first report"
          - "the two reported pairs are not equal"
        side_effects:
          - "Match.play_status SERVER_READY -> PLAYED"
          - "no points are awarded and Match.home_games_won / away_games_won stay null until adjudication"
          - "increments Match.version by 1"
      - from: "result_status=CONTESTED"
        to: "result_status=ADJUDICATED"
        trigger: "POST /matches/{matchId}/finalize with override_home_games_won and override_away_games_won"
        actor: LeagueAdmin
        preconditions:
          - "Match.result_status == CONTESTED"
          - "both override fields present — else ERR_INVALID_REQUEST"
        side_effects:
          - "Match.home_games_won / away_games_won pinned to the overrides; winner_team_id set"
          - "Match.result_confirmed_at = clock.now; dispute_deadline_at recomputed"
          - "runs match_point_award; Season.match_point_pool and both Teams' counters updated"
          - "Match.play_status PLAYED -> FINALIZED"
          - "increments Match.version by 1"
      - from: "play_status=PLAYED"
        to: "play_status=FINALIZED"
        trigger: "POST /matches/{matchId}/finalize with no overrides"
        actor: LeagueAdmin
        preconditions:
          - "Match.play_status == PLAYED"
          - "Match.result_status IN {CONFIRMED, ADJUDICATED} — else ERR_INVALID_MATCH_STATE"
          - "override fields absent — else ERR_INVALID_REQUEST"
        side_effects: ["increments Match.version by 1"]
      - from: "play_status IN {SCHEDULED, SERVER_READY}"
        to: "play_status=FORFEITED"
        trigger: "POST /matches/{matchId}/forfeit, or system event: a participating Team enters SUSPENDED / WITHDRAWN / DISQUALIFIED"
        actor: LeagueAdmin | system
        preconditions:
          - "Match.play_status IN {SCHEDULED, SERVER_READY} — else ERR_INVALID_MATCH_STATE"
          - "forfeiting_team_id IN {home_team_id, away_team_id} — else ERR_TEAM_NOT_MATCH_PARTICIPANT"
        side_effects:
          - "Match.forfeiting_team_id set; result_status -> ADJUDICATED; winner_team_id = the other team"
          - "Match.result_confirmed_at = clock.now; dispute_deadline_at computed"
          - "runs match_point_award in FORFEIT mode: winner +3, forfeiting team +0, winner.forfeit_wins += 1, forfeiting team.forfeits_charged += 1"
          - "Season.match_point_pool += 3; Season.seeding_state set to STALE when it was SEEDED"
          - "increments Match.version by 1"
      - from: "play_status=FORFEITED"
        to: "play_status=SERVER_READY"
        trigger: "system event: the FairPlayCase whose sanction suspended the forfeiting team is OVERTURNED on appeal"
        actor: system
        preconditions:
          - "Match.play_status == FORFEITED AND Match.forfeiting_team_id == the reinstated team"
          - "the forfeit was produced by that team's suspension (not by POST /matches/{matchId}/forfeit)"
        side_effects:
          - "match_point_award reverted: the 3 points credited to the opponent are removed, forfeit_wins and forfeits_charged decremented, Season.match_point_pool -= 3 (compensation, no drift)"
          - "Match.forfeiting_team_id = null; result_status -> AWAITING_REPORTS; result_confirmed_at = null; dispute_deadline_at = null"
          - "play_status restored to SERVER_READY when region_code was already pinned, otherwise to SCHEDULED"
          - "increments Match.version by 1"
      - from: "dispute_status=NONE"
        to: "dispute_status=OPEN"
        trigger: "POST /matches/{matchId}/disputes"
        actor: Coach
        preconditions:
          - "Match.result_status IN {CONFIRMED, ADJUDICATED} — else ERR_INVALID_MATCH_STATE"
          - "Match.dispute_status == NONE — else ERR_INVALID_DISPUTE_STATE"
          - "filing_team_id IN {home_team_id, away_team_id} — else ERR_TEAM_NOT_MATCH_PARTICIPANT"
          - "clock.now <= Match.dispute_deadline_at — else ERR_DISPUTE_WINDOW_CLOSED (inclusive boundary)"
        side_effects:
          - "Match.dispute_filed_by_team_id and dispute_reason_code set"
          - "increments Match.version by 1"
      - from: "dispute_status=OPEN"
        to: "dispute_status=UNDER_REVIEW"
        trigger: "POST /matches/{matchId}/dispute-actions with action=ACCEPT_REVIEW"
        actor: LeagueAdmin
        preconditions: ["Match.dispute_status == OPEN — else ERR_INVALID_DISPUTE_STATE"]
        side_effects: ["increments Match.version by 1"]
      - from: "dispute_status=UNDER_REVIEW"
        to: "dispute_status=NEEDS_INFO"
        trigger: "POST /matches/{matchId}/dispute-actions with action=REQUEST_INFO"
        actor: LeagueAdmin
        preconditions: ["Match.dispute_status == UNDER_REVIEW — else ERR_INVALID_DISPUTE_STATE"]
        side_effects: ["increments Match.version by 1"]
      - from: "dispute_status=NEEDS_INFO"
        to: "dispute_status=UNDER_REVIEW"
        trigger: "POST /matches/{matchId}/dispute-actions with action=RESUME_REVIEW"
        actor: LeagueAdmin
        preconditions: ["Match.dispute_status == NEEDS_INFO — else ERR_INVALID_DISPUTE_STATE"]
        side_effects: ["increments Match.version by 1"]
        note: "UNDER_REVIEW <-> NEEDS_INFO is the dispute cycle; it may repeat any number of times."
      - from: "dispute_status=UNDER_REVIEW"
        to: "dispute_status=UPHELD"
        trigger: "POST /matches/{matchId}/dispute-actions with action=UPHOLD plus corrected_home_games_won and corrected_away_games_won"
        actor: LeagueAdmin
        preconditions:
          - "Match.dispute_status == UNDER_REVIEW — else ERR_INVALID_DISPUTE_STATE"
          - "both corrected_* fields present — else ERR_INVALID_REQUEST"
        side_effects:
          - "cascade link 1: Match.result_status -> ADJUDICATED; home_games_won / away_games_won replaced by the corrected pair; winner_team_id recomputed"
          - "cascade link 2 (caused by link 1): the prior match_point_award is reverted on both Teams and the corrected award applied — match_points, wins, losses, draws, games_won, games_lost, forfeit counters all restated; Season.match_point_pool adjusted by the delta so the conservation formula still holds"
          - "cascade link 3 (caused by link 2): Season.seeding_state SEEDED -> STALE and every Team in the season with seed_position != null gets seed_stale = true"
          - "cascade link 4 (caused by link 3): every Student with showcase_status == NOMINATED whose nominating_team_id is a team of this season gets scholarship_award_state CURRENT -> RECALC_REQUIRED"
          - "increments Match.version by 1"
      - from: "dispute_status=UNDER_REVIEW"
        to: "dispute_status=REJECTED"
        trigger: "POST /matches/{matchId}/dispute-actions with action=REJECT"
        actor: LeagueAdmin
        preconditions:
          - "Match.dispute_status == UNDER_REVIEW — else ERR_INVALID_DISPUTE_STATE"
          - "corrected_* fields absent — else ERR_INVALID_REQUEST"
        side_effects:
          - "no result or points change"
          - "increments Match.version by 1"
      - from: "broadcast_status=NONE"
        to: "broadcast_status=SCHEDULED"
        trigger: "POST /matches/{matchId}/broadcast with action=REGISTER"
        actor: Coach
        preconditions:
          - "Match.broadcast_status == NONE — else ERR_INVALID_BROADCAST_STATE"
          - "X-User-ID equals the Coach of the home or away team"
          - "broadcast_school_id equals the school of the requesting coach's team"
          - "no broadcast_channel_overlap conflict on that school's channel — else ERR_BROADCAST_CHANNEL_CONFLICT"
        side_effects:
          - "Match.broadcast_school_id, broadcast_start_at, broadcast_end_at pinned"
          - "increments Match.version by 1"
      - from: "broadcast_status=SCHEDULED"
        to: "broadcast_status=LIVE"
        trigger: "POST /matches/{matchId}/broadcast with action=GO_LIVE"
        actor: Coach
        preconditions:
          - "Match.broadcast_status == SCHEDULED — else ERR_INVALID_BROADCAST_STATE"
          - "Match.play_status IN {SERVER_READY, PLAYED} — else ERR_INVALID_MATCH_STATE"
        side_effects: ["increments Match.version by 1"]
      - from: "broadcast_status=LIVE"
        to: "broadcast_status=SUSPENDED"
        trigger: "system event: a FairPlayCase with case_type SPECTATOR_CONDUCT naming this match reaches SUSTAINED"
        actor: system
        preconditions: ["Match.broadcast_status == LIVE"]
        side_effects:
          - "Match.spectator_strikes += 1"
          - "increments Match.version by 1"
      - from: "broadcast_status=SUSPENDED"
        to: "broadcast_status=LIVE"
        trigger: "POST /matches/{matchId}/broadcast with action=RESUME"
        actor: Coach
        preconditions:
          - "Match.broadcast_status == SUSPENDED — else ERR_INVALID_BROADCAST_STATE"
          - "Match.spectator_strikes < 3 — else ERR_INVALID_BROADCAST_STATE"
        side_effects: ["increments Match.version by 1"]
        note: "LIVE <-> SUSPENDED is the broadcast moderation cycle, capped at 3 strikes."
      - from: "broadcast_status IN {LIVE, SUSPENDED}"
        to: "broadcast_status=ENDED"
        trigger: "POST /matches/{matchId}/broadcast with action=END"
        actor: Coach
        preconditions: ["Match.broadcast_status IN {LIVE, SUSPENDED} — else ERR_INVALID_BROADCAST_STATE"]
        side_effects: ["increments Match.version by 1"]

  - entity: FairPlayCase
    initial_state: REPORTED
    terminal_states: [DISMISSED, SUSTAINED_FINAL, OVERTURNED]
    transitions:
      - from: REPORTED
        to: INVESTIGATING
        trigger: "POST /fair-play-cases/{caseId}/investigate"
        actor: IntegrityOfficer
        preconditions: ["FairPlayCase.status == REPORTED — else ERR_INVALID_CASE_STATE"]
        side_effects:
          - "FairPlayCase.investigator_user_id = X-User-ID"
          - "increments FairPlayCase.version by 1"
      - from: INVESTIGATING
        to: SUSTAINED
        trigger: "POST /fair-play-cases/{caseId}/decision with decision=SUSTAIN and severity"
        actor: IntegrityOfficer
        preconditions:
          - "FairPlayCase.status == INVESTIGATING — else ERR_INVALID_CASE_STATE"
          - "severity present — else ERR_INVALID_REQUEST"
        side_effects:
          - "cascade link 1: FairPlayCase.decider_user_id = X-User-ID; decided_at = clock.now; severity_weight, repeat_index and applied_penalty computed; Team.integrity_score recomputed by team_integrity_score; sanction_type selected by its sanction ladder"
          - "cascade link 2 (caused by link 1, only when subject_type == STUDENT): Student.fair_play_status CLEAR -> SANCTIONED"
          - "cascade link 3 (caused by link 2): every RosterSlot of that student with participation_status == ACTIVE -> INELIGIBLE with ineligibility_reason FAIR_PLAY"
          - "cascade link 4 (caused by link 3): when the slot's Team.active_starter_count falls below Season.min_starters, or sanction_type IN {TEAM_SUSPENSION, DISQUALIFICATION}, or integrity_score < 40, Team COMPETING -> SUSPENDED"
          - "cascade link 5 (caused by link 4): every Match of that Team with play_status IN {SCHEDULED, SERVER_READY} -> FORFEITED, the opponent is credited 3 points, Season.match_point_pool += 3 per forfeited match and Season.seeding_state set to STALE"
          - "when subject_type == MATCH_BROADCAST: Match.broadcast_status LIVE -> SUSPENDED and Match.spectator_strikes += 1 instead of links 2-5"
          - "increments FairPlayCase.version by 1"
      - from: INVESTIGATING
        to: DISMISSED
        trigger: "POST /fair-play-cases/{caseId}/decision with decision=DISMISS"
        actor: IntegrityOfficer
        preconditions:
          - "FairPlayCase.status == INVESTIGATING — else ERR_INVALID_CASE_STATE"
          - "severity absent — else ERR_INVALID_REQUEST"
        side_effects:
          - "FairPlayCase.decider_user_id = X-User-ID; decided_at = clock.now; sanction_type stays NONE"
          - "no student, roster, team, match or season state changes (the DISMISS branch's side-effect set is deliberately empty)"
          - "increments FairPlayCase.version by 1"
        note: "Fork branch sibling of SUSTAINED with a disjoint side-effect set."
      - from: SUSTAINED
        to: APPEALED
        trigger: "POST /fair-play-cases/{caseId}/appeal"
        actor: Coach
        preconditions:
          - "FairPlayCase.status == SUSTAINED — else ERR_INVALID_CASE_STATE"
          - "X-User-ID equals Team.coach_id of FairPlayCase.team_id — else ERR_NOT_RESOURCE_OWNER"
        side_effects:
          - "FairPlayCase.appeal_grounds stored"
          - "sanctions remain in force while the appeal is pending"
          - "increments FairPlayCase.version by 1"
      - from: APPEALED
        to: SUSTAINED_FINAL
        trigger: "POST /fair-play-cases/{caseId}/appeal-decision with decision=AFFIRM"
        actor: IntegrityOfficer
        preconditions:
          - "FairPlayCase.status == APPEALED — else ERR_INVALID_CASE_STATE"
          - "X-User-ID NOT IN {investigator_user_id, decider_user_id} — else ERR_SEGREGATION_OF_DUTIES"
        side_effects:
          - "FairPlayCase.appeal_decider_user_id = X-User-ID"
          - "case remains in the sustained set, so Team.integrity_score is unchanged"
          - "when sanction_type == DISQUALIFICATION the Team transitions to DISQUALIFIED"
          - "increments FairPlayCase.version by 1"
      - from: APPEALED
        to: OVERTURNED
        trigger: "POST /fair-play-cases/{caseId}/appeal-decision with decision=OVERTURN"
        actor: IntegrityOfficer
        preconditions:
          - "FairPlayCase.status == APPEALED — else ERR_INVALID_CASE_STATE"
          - "X-User-ID NOT IN {investigator_user_id, decider_user_id} — else ERR_SEGREGATION_OF_DUTIES"
        side_effects:
          - "compensation link 1: FairPlayCase.appeal_decider_user_id = X-User-ID; the case leaves the sustained set, so Team.integrity_score is recomputed by team_integrity_score (repeat_index of every later sustained case on that team shifts down by one) and sanction_type -> NONE"
          - "compensation link 2 (caused by link 1, subject_type == STUDENT): Student.fair_play_status -> CLEAR when no other SUSTAINED / SUSTAINED_FINAL case names that student"
          - "compensation link 3 (caused by link 2): every RosterSlot of that student with participation_status == INELIGIBLE and ineligibility_reason == FAIR_PLAY -> ACTIVE"
          - "compensation link 4 (caused by link 3): Team SUSPENDED -> COMPETING once active_starter_count >= Season.min_starters and no other team-suspending case remains"
          - "compensation link 5 (caused by link 4): every Match forfeited by that suspension is restored and its 3-point award reverted, so Season.match_point_pool returns to its pre-suspension value"
          - "when subject_type == MATCH_BROADCAST: Match.spectator_strikes -= 1 and broadcast_status SUSPENDED -> LIVE instead of links 2-5"
          - "increments FairPlayCase.version by 1"

# ---------------------------------------------------------------------------
# §1.2.1 Concurrency Rules (OCC on the parent's `version` only)
# ---------------------------------------------------------------------------
concurrency_rules:
  - rule_id: result-report-stale-match
    parent_entity: Match
    write_endpoint: "POST /matches/{matchId}/result-reports"
    occ_field: "expected_match_version"
    description: |
      A result report carrying an expected_match_version older than Match.version is
      rejected. The product deliberately lets a coach re-report a score, and each
      accepted report supersedes that side's prior figures and advances the match's
      version; a report written against a stale view of the match would silently
      overwrite a supersession the reporter never saw, so it is refused instead.
    error_id: ERR_STALE_VERSION
    http_status: 412

  - rule_id: academic-posting-stale-student
    parent_entity: Student
    write_endpoint: "POST /students/{studentId}/academic-postings"
    occ_field: "expected_student_version"
    description: |
      An academic posting carrying an expected_student_version older than
      Student.version is rejected. A posting legitimately supersedes the student's
      standing by shifting latest_term_* into prior_term_* and recomputing
      academic_standing, so a posting written against a stale view would push the
      already-superseded term back into the shift register.
    error_id: ERR_STALE_VERSION
    http_status: 412

# ---------------------------------------------------------------------------
# §1.3 Calculation Rules Table
# ---------------------------------------------------------------------------
calculations:

  - name: academic_standing_evaluation
    trigger: "POST /roster-slots/{slotId}/verify-academics, and POST /students/{studentId}/academic-postings (recomputes for the posted student)"
    algorithm: weighted_scoring
    formula: |
      # District is resolved as School(Student.school_id).district_id.
      # Both variants read the SAME two posted terms; they disagree on the input set.
      if District.academic_standing_basis == "TERM_SNAPSHOT":
          effective_gpa = round_half_up(Student.latest_term_gpa, 3)
      else:  # ROLLING_CUMULATIVE
          num = Student.latest_term_gpa * Student.latest_term_credits
              + coalesce(Student.prior_term_gpa, 0) * coalesce(Student.prior_term_credits, 0)
          den = Student.latest_term_credits + coalesce(Student.prior_term_credits, 0)
          effective_gpa = round_half_up(num / den, 3)      # den is never 0: a posting always carries credits > 0

      if effective_gpa >= District.min_gpa:            academic_standing = "GOOD"
      elif effective_gpa >= District.probation_gpa_floor: academic_standing = "PROBATION"
      else:                                            academic_standing = "INELIGIBLE"
      standing_basis_applied = District.academic_standing_basis
    input_set: |
      Exactly the two most recent postings held in Student.latest_term_* and
      Student.prior_term_*. Terms displaced beyond depth 2 are gone and never re-enter.
      TERM_SNAPSHOT ignores prior_term_* entirely; ROLLING_CUMULATIVE credit-weights both.
    constants:
      MIN_GPA_DEFAULT: 2.000
      PROBATION_FLOOR_DEFAULT: 1.750
      GPA_PRECISION: 3
    precision: "3 decimal places, round_half_up; comparisons use >= on the rounded value"
    variants:
      - name: TERM_SNAPSHOT
        when: "District.academic_standing_basis == TERM_SNAPSHOT"
        difference: "Uses only latest_term_gpa. Worked case latest=1.900/6cr, prior=2.400/6cr yields 1.900 -> PROBATION."
      - name: ROLLING_CUMULATIVE
        when: "District.academic_standing_basis == ROLLING_CUMULATIVE"
        difference: "Credit-weights both terms. The SAME worked case yields (1.900*6 + 2.400*6)/12 = 2.150 -> GOOD, so an identical student is a legal STARTER in one district and rejected with ERR_PROBATION_STARTER_RESTRICTED in the other."

  - name: seed_points
    trigger: "POST /seasons/{seasonId}/seeding, once per team in the season"
    algorithm: aggregation
    formula: |
      counted = Matches where season_id == Season.id AND play_status IN {FINALIZED, FORFEITED}
      # Per-team counters maintained by match_point_award are the inputs.
      if basis == "MATCH_POINT_BASIS":
          seed_points = round_half_up(Team.match_points, 4)          # forfeit wins count fully
      else:  # WIN_PERCENTAGE_BASIS
          den = Team.wins + Team.losses + Team.draws                 # forfeits are NOT in wins/losses/draws
          if den == 0:
              seed_points = 0.0000                                   # empty-set fallback, ranked by tiebreakers
          else:
              seed_points = round_half_up(Team.wins / den, 4)
      basis = coalesce(request.basis_override, Season.seeding_basis)
      Season.seeding_basis_applied = basis
    input_set: |
      Teams with status IN {COMPETING, PLAYOFF_SEEDED, ELIMINATED, SUSPENDED}. Teams in
      DRAFT, REGISTERED, ROSTER_LOCKED, WITHDRAWN or DISQUALIFIED are excluded from the
      seed order entirely and keep seed_position null.
    constants:
      SEED_PRECISION: 4
    precision: "4 decimal places, round_half_up"
    variants:
      - name: MATCH_POINT_BASIS
        when: "basis == MATCH_POINT_BASIS"
        difference: "Raw league points. A team with two forfeit wins and one real loss scores 6.0000 and outranks a team with a single real win (3.0000)."
      - name: WIN_PERCENTAGE_BASIS
        when: "basis == WIN_PERCENTAGE_BASIS"
        difference: "Forfeits leave both numerator and denominator, so the SAME two teams invert: the forfeit-fed team scores 0/1 = 0.0000 while the single-real-win team scores 1/1 = 1.0000."

  - name: team_integrity_score
    trigger: "every FairPlayCase decision or appeal-decision transition, and at the start of each POST /seasons/{seasonId}/seeding run for every team in the season"
    algorithm: decay_function
    formula: |
      sustained = FairPlayCase where team_id == Team.id
                  AND status IN {SUSTAINED, SUSTAINED_FINAL}
                  ORDER BY created_at ASC          # order is pinned; never by id
      penalty = 0.00
      for repeat_index, c in enumerate(sustained, start=1):
          c.severity_weight = SEVERITY_WEIGHT[c.severity] + TYPE_SURCHARGE[c.case_type]
          mult = 1.0 if repeat_index == 1 else (1.5 if repeat_index == 2 else 2.0)
          c.applied_penalty = round_half_up(c.severity_weight * mult, 2)
          penalty = penalty + c.applied_penalty
      if sustained is empty:
          days_clean = 0
      else:
          last_decided_at = max(c.decided_at for c in sustained)
          days_clean = floor((clock.now - last_decided_at) / 86400 seconds)
      clean_credit = min(CLEAN_CREDIT_CAP, floor(days_clean / CLEAN_DAYS_PER_STEP) * CLEAN_CREDIT_STEP)
      integrity_score = max(0.00, min(100.00, round_half_up(100.00 - penalty + clean_credit, 2)))

      # Sanction ladder for the case being decided (evaluated AFTER integrity_score):
      if severity == "SEVERE":                        sanction_type = "TEAM_SUSPENSION"
      elif subject_type == "MATCH_BROADCAST":         sanction_type = "WARNING"
      else:                                           sanction_type = "STUDENT_SUSPENSION"
      if integrity_score < INTEGRITY_SUSPENSION_FLOOR: sanction_type = "TEAM_SUSPENSION"
      if integrity_score == 0.00:                      sanction_type = "DISQUALIFICATION"
    input_set: |
      Only cases whose status is SUSTAINED or SUSTAINED_FINAL, on this team, ordered by
      created_at ASC. DISMISSED and OVERTURNED cases leave the set, which re-indexes every
      later case's repeat_index and therefore changes its applied_penalty.
    constants:
      SEVERITY_WEIGHT: { MINOR: 5, MAJOR: 15, SEVERE: 40 }
      TYPE_SURCHARGE: { ACCOUNT_SHARING: 5, SMURFING: 10, CHEAT_DETECTION: 20, SPECTATOR_CONDUCT: 0 }
      REPEAT_MULTIPLIER: { 1: 1.0, 2: 1.5, "3+": 2.0 }
      CLEAN_CREDIT_CAP: 10
      CLEAN_CREDIT_STEP: 5
      CLEAN_DAYS_PER_STEP: 30
      INTEGRITY_SUSPENSION_FLOOR: 40
    precision: "2 decimal places, round_half_up per case penalty, then summed (penalties are rounded per case, never after summing)"

  - name: team_entry_fee
    trigger: "POST /teams/{teamId}/register"
    algorithm: waterfall_allocation
    formula: |
      starters = RosterSlots where team_id == Team.id
                 AND slot_role == "STARTER"
                 AND participation_status IN {PROSPECTIVE, ACTIVE, INELIGIBLE}   # RELEASED excluded
      line_items = [Season.base_entry_fee_cents] + [Season.per_starter_fee_cents for each starter]

      # PINNED ROUNDING ORDER: subsidize EACH line item, round EACH to whole cents
      # (round_half_up), THEN sum. Summing first and rounding once is WRONG and can
      # differ by 1 cent per line item.
      per_line_subsidy = [round_half_up(item * District.subsidy_pct) for item in line_items]
      subsidy_granted_cents = sum(per_line_subsidy)
      entry_fee_cents = sum(line_items)
      net_fee_due_cents = entry_fee_cents - subsidy_granted_cents
    input_set: "STARTER slots only, in states PROSPECTIVE/ACTIVE/INELIGIBLE; SUB slots and RELEASED slots contribute no line item."
    constants:
      SUBSIDY_PCT_DEFAULT: 0.25
      BASE_FEE_DEFAULT_CENTS: 12510
      PER_STARTER_FEE_DEFAULT_CENTS: 3335
    precision: "integer cents, round_half_up per line item"
    variants:
      - name: PER_LINE_ROUNDING
        when: "always — this is the pinned order"
        difference: "One STARTER: 12510 and 3335 subsidized at 0.25 give 3128 + 834 = 3962."
      - name: SUM_THEN_ROUND
        when: "never — documented only to name the trap"
        difference: "The same inputs summed first give round_half_up(15845 * 0.25) = 3961, one cent less. Implementations that sum first fail."

  - name: showcase_scholarship_award
    trigger: "POST /students/{studentId}/showcase-nomination"
    algorithm: tiered_pricing
    formula: |
      # The tier depends on the total and the bonus depends on the tier, so evaluation
      # order is PINNED in four steps and the tier is NEVER re-derived from STEP 4.
      # STEP 1 — provisional total (no bonus yet)
      seed_rank_used = coalesce(Team.seed_position, SEED_BONUS_RANK_CUTOFF)
      provisional_award_cents = round_half_up(BASE_AWARD_CENTS * ACADEMIC_MULTIPLIER[Student.academic_standing])
                              + SEED_BONUS_PER_RANK_CENTS * max(0, SEED_BONUS_RANK_CUTOFF - seed_rank_used)
      # STEP 2 — tier from the PROVISIONAL total
      if provisional_award_cents >= GOLD_FLOOR_CENTS:     award_tier = "GOLD"
      elif provisional_award_cents >= SILVER_FLOOR_CENTS: award_tier = "SILVER"
      else:                                              award_tier = "BRONZE"
      # STEP 3 — bonus at the tier's rate, applied to the provisional total
      performance_bonus_cents = round_half_up(provisional_award_cents * PERFORMANCE_BONUS_RATE[award_tier])
      # STEP 4 — final award
      scholarship_award_cents = provisional_award_cents + performance_bonus_cents
      scholarship_award_state = "CURRENT"
    input_set: "The nominated Student's academic_standing plus the seed_position of the Team named in the nomination (null seed_position means no seed bonus)."
    constants:
      BASE_AWARD_CENTS: 150000
      SEED_BONUS_PER_RANK_CENTS: 45000
      SEED_BONUS_RANK_CUTOFF: 5
      SILVER_FLOOR_CENTS: 200000
      GOLD_FLOOR_CENTS: 350000
      ACADEMIC_MULTIPLIER: { GOOD: 1.0, PROBATION: 0.5, UNEVALUATED: 0.0, INELIGIBLE: 0.0 }
      PERFORMANCE_BONUS_RATE: { BRONZE: 0.05, SILVER: 0.12, GOLD: 0.20 }
    precision: "integer cents, round_half_up at STEP 1 and STEP 3"
    variants:
      - name: TIER_FROM_PROVISIONAL
        when: "always — this is the pinned order"
        difference: "GOOD standing on seed 1: provisional 330000 -> SILVER -> bonus 39600 -> award 369600, and award_tier stays SILVER even though 369600 sits in the GOLD band."
      - name: TIER_FROM_FINAL
        when: "never — documented only to name the trap"
        difference: "Re-deriving the tier from 369600 would relabel the award GOLD and (if the bonus were recomputed) pay 66000 instead of 39600."

  - name: tiebreak_seed_order
    trigger: "POST /seasons/{seasonId}/seeding, after seed_points and team_integrity_score have been computed for every team"
    algorithm: chronological
    formula: |
      eligible = Teams where season_id == Season.id
                 AND status IN {COMPETING, PLAYOFF_SEEDED, ELIMINATED, SUSPENDED}
      sort eligible by, in strict order:
        1. seed_points                    DESC
        2. head_to_head_points            DESC   # points this team earned in FINALIZED/FORFEITED
                                                 # matches whose two participants are BOTH inside
                                                 # the currently tied group
        3. game_differential              DESC   # games_won - games_lost
        4. forfeits_charged               ASC
        5. integrity_score                DESC
        6. created_at                     ASC    # final tie-break; `id` is never consulted
      seed_position = 1-based index in the sorted list
      Season.seed_order = [team.id in sorted order]
      Season.seeding_state = "SEEDED"
      for each team: seed_stale = false
                     status = "PLAYOFF_SEEDED" if seed_position <= Season.playoff_slots else "ELIMINATED"
                     # SUSPENDED teams keep status SUSPENDED but still receive a seed_position
    input_set: "Only the eligible set above; head-to-head is recomputed per tied group, not league-wide."
    constants:
      TIEBREAK_ORDER: ["seed_points DESC", "head_to_head_points DESC", "game_differential DESC", "forfeits_charged ASC", "integrity_score DESC", "created_at ASC"]
    precision: "seed_points compared at 4 decimals; integrity_score at 2 decimals"

  - name: match_point_award
    trigger: "Match result_status -> CONFIRMED, result_status -> ADJUDICATED (finalize override or dispute UPHOLD), and play_status -> FORFEITED"
    algorithm: projection
    formula: |
      # Any re-award first REVERTS the previously credited figures for this match
      # (home_points_awarded / away_points_awarded and the per-team counters this
      # match contributed) and then applies the new ones. Revert-then-apply is pinned.
      if play_status == "FORFEITED":
          winner = the non-forfeiting side
          home_points_awarded = POINTS_WIN if winner == home else POINTS_FORFEIT_LOSS
          away_points_awarded = POINTS_WIN if winner == away else POINTS_FORFEIT_LOSS
          winner.forfeit_wins += 1 ; forfeiting_team.forfeits_charged += 1
          # wins / losses / draws / games_won / games_lost are NOT touched by a forfeit
      elif home_games_won > away_games_won:
          home_points_awarded = POINTS_WIN ; away_points_awarded = POINTS_LOSS
          home.wins += 1 ; away.losses += 1
      elif home_games_won < away_games_won:
          home_points_awarded = POINTS_LOSS ; away_points_awarded = POINTS_WIN
          home.losses += 1 ; away.wins += 1
      else:
          home_points_awarded = POINTS_DRAW ; away_points_awarded = POINTS_DRAW
          home.draws += 1 ; away.draws += 1
      if play_status != "FORFEITED":
          home.games_won += home_games_won ; home.games_lost += away_games_won
          away.games_won += away_games_won ; away.games_lost += home_games_won
      home.match_points += home_points_awarded ; away.match_points += away_points_awarded
      Season.match_point_pool += (home_points_awarded + away_points_awarded)
    input_set: "The single match being awarded; no other match is read."
    constants:
      POINTS_WIN: 3
      POINTS_DRAW: 1
      POINTS_LOSS: 0
      POINTS_FORFEIT_LOSS: 0
    precision: "integers"

  - name: dispute_window_deadline
    trigger: "Match.result_confirmed_at is set (CONFIRMED, ADJUDICATED via finalize override, or FORFEITED)"
    algorithm: interval_merge
    formula: |
      district = District(School(Team(Match.home_team_id).school_id).district_id)   # home side governs
      dispute_deadline_at = Match.result_confirmed_at + district.dispute_window_hours hours
      # Filing is permitted while clock.now <= dispute_deadline_at (INCLUSIVE at the
      # exact millisecond); clock.now > dispute_deadline_at is ERR_DISPUTE_WINDOW_CLOSED.
    input_set: "The home team's district only; the away team's district never affects the window."
    constants:
      DISPUTE_WINDOW_HOURS_DEFAULT: 48
    precision: "millisecond timestamps, three fractional digits"

  - name: roster_slot_participation
    trigger: "any write touching RosterSlot.verification_status, RosterSlot.academic_status, RosterSlot.released_at, RosterSlot.ineligibility_reason, or Student.fair_play_status"
    algorithm: constraint_propagation
    formula: |
      if released_at is not null:                      participation_status = "RELEASED"
      elif ineligibility_reason is not null:           participation_status = "INELIGIBLE"
      elif verification_status == "ENROLLMENT_VERIFIED"
           and academic_status == "CLEARED":           participation_status = "ACTIVE"
      else:                                            participation_status = "PROSPECTIVE"

      # Team roll-ups recomputed immediately afterwards, in this order:
      Team.starter_slots_used = count(slots with slot_role == STARTER
                                      and participation_status IN {PROSPECTIVE, ACTIVE, INELIGIBLE})
      Team.starter_slots_available = Season.max_starters - Team.starter_slots_used
      Team.active_starter_count = count(slots with slot_role == STARTER
                                        and participation_status == ACTIVE)
    input_set: "The slot's own two verification axes plus the Student's fair_play_status."
    constants:
      MAX_STARTERS_DEFAULT: 3
    precision: "integers"

  - name: recruiting_contact_quota
    trigger: "POST /students/{studentId}/recruiting-contacts"
    algorithm: threshold
    formula: |
      district = District(School(Student.school_id).district_id)
      window_start = clock.now - district.recruiting_window_days days
      # HALF-OPEN window (window_start, clock.now]: a logged contact whose contacted_at
      # equals window_start EXACTLY has aged out and is NOT counted.
      contacts_in_window = count(e in Student.recruiting_contact_log
                                 where e.contacted_at > window_start)
      # EVALUATION ORDER is fixed by §1.4: the dead-period check (priority 50,
      # business_temporal) runs BEFORE the cap check (priority 61, business_constraint).
      if district.recruiting_dead_period_start is not null
         and district.recruiting_dead_period_start <= clock.now <= district.recruiting_dead_period_end:
          reject ERR_RECRUITING_DEAD_PERIOD          # CLOSED interval, both ends inclusive
      if contacts_in_window >= district.recruiting_contact_cap_per_window:
          reject ERR_RECRUITING_CONTACT_CAP_EXCEEDED
      # on acceptance:
      append { contacted_at: clock.now, org_code, channel, purpose } to Student.recruiting_contact_log
    input_set: "Only entries already in Student.recruiting_contact_log; rejected attempts are never logged."
    constants:
      CAP_DEFAULT: 3
      WINDOW_DAYS_DEFAULT: 30
    precision: "integer counts, millisecond timestamp comparisons"

  - name: server_pool_overlap
    trigger: "POST /matches (scheduling), evaluated against every already-scheduled match on the same server pool"
    algorithm: interval_merge
    formula: |
      # Resource: the Title's shared server pool (Title.server_pool_id), an AGGREGATE
      # capacity resource. Interval semantics: HALF-OPEN [scheduled_start_at, scheduled_end_at).
      candidate = [new.scheduled_start_at, new.scheduled_start_at + Title.match_duration_minutes)
      peers = Matches where server_pool_id == Title.server_pool_id
              AND play_status IN {SCHEDULED, SERVER_READY, PLAYED}    # FINALIZED / FORFEITED release the slot
      # Peak concurrency is measured at the candidate's own start instant and at every
      # peer start instant that falls inside the candidate interval.
      probe_points = [candidate.start] + [p.start for p in peers if candidate.start <= p.start < candidate.end]
      for t in probe_points:
          occupancy = 1 + count(p in peers where p.start <= t < p.end)
          if occupancy > Title.server_pool_capacity:
              reject ERR_SERVER_POOL_CAPACITY_EXCEEDED
      # ADJACENCY IS LEGAL: a peer ending exactly at candidate.start, or starting exactly
      # at candidate.end, does not overlap (half-open endpoints touch but do not intersect).
    input_set: "Matches on the same server_pool_id in play_status SCHEDULED, SERVER_READY or PLAYED; terminal matches are excluded and free their capacity."
    constants:
      SERVER_POOL_CAPACITY_DEFAULT: 1
    precision: "millisecond timestamps; capacity compared as integers"

  - name: broadcast_channel_overlap
    trigger: "POST /matches/{matchId}/broadcast with action=REGISTER"
    algorithm: interval_merge
    formula: |
      # Resource: the School's broadcast channel (Match.broadcast_school_id), a
      # PER-ENTITY channel resource — a different resource entity from the server pool.
      # Interval semantics: CLOSED [start, end] EXPANDED by District.broadcast_buffer_minutes
      # on BOTH ends, so adjacency is ILLEGAL (the opposite of server_pool_overlap).
      buffer = District(School(broadcast_school_id).district_id).broadcast_buffer_minutes
      candidate = [request.broadcast_start_at - buffer, request.broadcast_end_at + buffer]
      peers = Matches where broadcast_school_id == request.broadcast_school_id
              AND broadcast_status IN {SCHEDULED, LIVE, SUSPENDED}     # ENDED and NONE release the channel
      conflicts = count(p in peers where p.broadcast_start_at <= candidate.end
                                     AND p.broadcast_end_at   >= candidate.start)
      if conflicts >= School.concurrent_broadcast_capacity:
          reject ERR_BROADCAST_CHANNEL_CONFLICT
      # The buffer expands the CANDIDATE only; peer windows are compared raw. So two
      # windows that merely touch (peer end == candidate start) CONFLICT here, and any
      # gap of at most broadcast_buffer_minutes also conflicts; a gap strictly greater
      # than broadcast_buffer_minutes clears.
    input_set: "Matches already holding the same school's channel in broadcast_status SCHEDULED, LIVE or SUSPENDED; ENDED broadcasts free the channel."
    constants:
      BROADCAST_BUFFER_MINUTES_DEFAULT: 15
      CONCURRENT_BROADCAST_CAPACITY_DEFAULT: 1
    precision: "millisecond timestamps; buffer applied in whole minutes"

conserved_quantity_invariants:
  - name: season_match_point_pool_conservation
    quantity: "Season.match_point_pool"
    formula: |
      Season.match_point_pool
        == SUM(Team.match_points for Teams where season_id == Season.id)
        == 3 * count(Matches in season with play_status IN {FINALIZED, FORFEITED} AND winner_team_id != null)
         + 2 * count(Matches in season with play_status == FINALIZED AND winner_team_id == null AND result_status IN {CONFIRMED, ADJUDICATED})
    compensating_pair: "dispute UPHOLD re-award (revert then apply) and suspension forfeit / appeal-overturn restore"

  - name: district_subsidy_pool_conservation
    quantity: "District.subsidy_pool_cents"
    formula: |
      District.subsidy_pool_cents
        + SUM(Team.subsidy_granted_cents for Teams whose School.district_id == District.id)
        == District.subsidy_pool_initial_cents
    compensating_pair: "POST /teams/{teamId}/register debit and POST /teams/{teamId}/withdraw restore"

  - name: starter_capacity_conservation
    quantity: "Team.starter_slots_used + Team.starter_slots_available"
    formula: |
      Team.starter_slots_used + Team.starter_slots_available == Season.max_starters
      (holds after every roster mutation, including release and cascaded ineligibility)
    compensating_pair: "POST /roster-slots create and POST /roster-slots/{slotId}/release"

# ---------------------------------------------------------------------------
# §1.4 Validation Rules Table (ordered by priority; lowest number wins when a
# single request violates several rules)
# ---------------------------------------------------------------------------
validations:

  # --- tier 1: authentication -------------------------------------------------
  - priority: 1
    category: auth
    check: "X-User-Role and X-User-ID headers are both present and X-User-Role is one of the seven declared roles"
    error_id: ERR_UNAUTHENTICATED
    http_status: 401
    applies_to: all

  # --- tier 2: authorization --------------------------------------------------
  - priority: 2
    category: auth
    check: "X-User-Role appears in the target endpoint's roles list"
    error_id: ERR_UNAUTHORIZED
    http_status: 403
    applies_to: all

  - priority: 3
    category: auth
    check: |
      Ownership for entity_backed roles: Coach acting on a Team, RosterSlot, Match report,
      dispute, broadcast or appeal must have X-User-ID == the governing Team.coach_id;
      AthleticDirector must have X-User-ID == the governing School.id; DistrictAdmin must
      have X-User-ID == the governing District.id.
    error_id: ERR_NOT_RESOURCE_OWNER
    http_status: 403
    applies_to: "POST /teams, POST /teams/{teamId}/register, POST /teams/{teamId}/roster-lock, POST /teams/{teamId}/withdraw, POST /roster-slots, POST /roster-slots/{slotId}/release, POST /matches/{matchId}/result-reports, POST /matches/{matchId}/disputes, POST /matches/{matchId}/broadcast, POST /fair-play-cases/{caseId}/appeal, POST /title-approvals, POST /title-approvals/{approvalId}/decision, POST /coaches/{coachId}/certification"

  # --- tier 3: existence (path segments left-to-right, then body FKs) ---------
  - priority: 4
    category: existence
    check: "every id in the path resolves, validated left-to-right"
    error_id: "ERR_DISTRICT_NOT_FOUND | ERR_SCHOOL_NOT_FOUND | ERR_COACH_NOT_FOUND | ERR_STUDENT_NOT_FOUND | ERR_TITLE_NOT_FOUND | ERR_TITLE_APPROVAL_NOT_FOUND | ERR_SEASON_NOT_FOUND | ERR_TEAM_NOT_FOUND | ERR_ROSTER_SLOT_NOT_FOUND | ERR_MATCH_NOT_FOUND | ERR_FAIR_PLAY_CASE_NOT_FOUND"
    http_status: 404
    applies_to: "every endpoint with a path parameter"

  # --- tier 4: request shape --------------------------------------------------
  - priority: 5
    category: business_constraint
    check: |
      Body shape: every required field present, every enum inside its declared set, every
      numeric inside its declared range, dates parse as YYYY-MM-DD, datetimes parse as
      ISO 8601, pagination limit in 1..100 and offset >= 0.
    error_id: ERR_INVALID_REQUEST
    http_status: 400
    applies_to: all

  - priority: 6
    category: business_constraint
    check: "District.probation_gpa_floor <= District.min_gpa"
    error_id: ERR_INVALID_GPA_THRESHOLDS
    http_status: 422
    applies_to: "POST /districts"

  - priority: 7
    category: business_constraint
    check: "Match.home_team_id != Match.away_team_id"
    error_id: ERR_SELF_MATCH_FORBIDDEN
    http_status: 422
    applies_to: "POST /matches"

  - priority: 8
    category: business_constraint
    check: |
      Action-conditional field presence: decision=SUSTAIN requires severity and DISMISS
      forbids it; dispute action=UPHOLD requires both corrected_* fields and REJECT forbids
      them; finalize from CONTESTED requires both override_* fields and finalize from
      PLAYED forbids them; broadcast action=REGISTER requires broadcast_school_id,
      broadcast_start_at and broadcast_end_at and the other broadcast actions forbid them.
    error_id: ERR_INVALID_REQUEST
    http_status: 400
    applies_to: "POST /fair-play-cases/{caseId}/decision, POST /matches/{matchId}/dispute-actions, POST /matches/{matchId}/finalize, POST /matches/{matchId}/broadcast"

  - priority: 9
    category: existence
    check: "every FK id supplied in the request body resolves to a live entity"
    error_id: "ERR_DISTRICT_NOT_FOUND | ERR_SCHOOL_NOT_FOUND | ERR_COACH_NOT_FOUND | ERR_STUDENT_NOT_FOUND | ERR_TITLE_NOT_FOUND | ERR_SEASON_NOT_FOUND | ERR_TEAM_NOT_FOUND | ERR_MATCH_NOT_FOUND"
    http_status: 404
    applies_to: "POST /schools, POST /coaches, POST /students, POST /title-approvals, POST /seasons, POST /teams, POST /roster-slots, POST /matches, POST /fair-play-cases, POST /students/{studentId}/showcase-nomination"

  - priority: 10
    category: business_referential
    check: |
      Polymorphic discriminator: FairPlayCase.subject_type == STUDENT requires
      subject_student_id present and subject_match_id absent; subject_type ==
      MATCH_BROADCAST requires subject_match_id present and subject_student_id absent.
    error_id: ERR_SUBJECT_REFERENCE_MISMATCH
    http_status: 422
    applies_to: "POST /fair-play-cases"

  # --- tier 5: optimistic concurrency ----------------------------------------
  - priority: 11
    category: state
    check: "expected_match_version == Match.version / expected_student_version == Student.version (§1.2.1). Checked after existence and body validation but BEFORE any state precondition, because a stale reader cannot be trusted to have seen the current state."
    error_id: ERR_STALE_VERSION
    http_status: 412
    applies_to: "POST /matches/{matchId}/result-reports, POST /students/{studentId}/academic-postings"

  # --- tier 6: state preconditions -------------------------------------------
  - priority: 12
    category: state
    check: "Season.status permits the operation (registration requires REGISTRATION_OPEN; advance requires the declared from-state; seeding requires REGULAR_SEASON or PLAYOFFS; result reporting requires REGULAR_SEASON or PLAYOFFS; server-config requires ROSTER_LOCKED, REGULAR_SEASON or PLAYOFFS)"
    error_id: ERR_INVALID_SEASON_STAGE
    http_status: 409
    applies_to: "POST /seasons/{seasonId}/advance, POST /seasons/{seasonId}/seeding, POST /teams/{teamId}/register, POST /matches/{matchId}/server-config, POST /matches/{matchId}/result-reports"

  - priority: 13
    category: state
    check: "Season.seeding_state == SEEDED when advancing REGULAR_SEASON -> PLAYOFFS"
    error_id: ERR_SEASON_SEEDING_NOT_CURRENT
    http_status: 409
    applies_to: "POST /seasons/{seasonId}/advance"

  - priority: 14
    category: state
    check: "Team.status is a legal from-state for the requested transition (register requires DRAFT; roster-lock requires REGISTERED; withdraw requires REGISTERED, ROSTER_LOCKED, COMPETING, SUSPENDED, PLAYOFF_SEEDED or ELIMINATED)"
    error_id: ERR_INVALID_TEAM_STATE
    http_status: 409
    applies_to: "POST /teams/{teamId}/register, POST /teams/{teamId}/roster-lock, POST /teams/{teamId}/withdraw"

  - priority: 15
    category: state
    check: "the roster is still open for mutation: Team.status IN {DRAFT, REGISTERED}"
    error_id: ERR_ROSTER_LOCKED
    http_status: 409
    applies_to: "POST /roster-slots, POST /roster-slots/{slotId}/verify-enrollment, POST /roster-slots/{slotId}/verify-academics, POST /roster-slots/{slotId}/release"

  - priority: 16
    category: state
    check: "RosterSlot.participation_status != RELEASED (RELEASED is terminal)"
    error_id: ERR_ROSTER_SLOT_RELEASED
    http_status: 409
    applies_to: "POST /roster-slots/{slotId}/verify-enrollment, POST /roster-slots/{slotId}/verify-academics, POST /roster-slots/{slotId}/release"

  - priority: 17
    category: state
    check: "Match.play_status / Match.result_status permit the operation (server-config requires SCHEDULED; result reports require SERVER_READY; finalize requires PLAYED with result_status IN {CONFIRMED, ADJUDICATED} or result_status == CONTESTED; forfeit requires SCHEDULED or SERVER_READY; disputes require result_status IN {CONFIRMED, ADJUDICATED})"
    error_id: ERR_INVALID_MATCH_STATE
    http_status: 409
    applies_to: "POST /matches/{matchId}/server-config, POST /matches/{matchId}/result-reports, POST /matches/{matchId}/finalize, POST /matches/{matchId}/forfeit, POST /matches/{matchId}/disputes, POST /matches/{matchId}/broadcast"

  - priority: 18
    category: state
    check: "Match.dispute_status is a legal from-state (filing requires NONE; ACCEPT_REVIEW requires OPEN; REQUEST_INFO and UPHOLD and REJECT require UNDER_REVIEW; RESUME_REVIEW requires NEEDS_INFO)"
    error_id: ERR_INVALID_DISPUTE_STATE
    http_status: 409
    applies_to: "POST /matches/{matchId}/disputes, POST /matches/{matchId}/dispute-actions"

  - priority: 19
    category: state
    check: "Match.broadcast_status is a legal from-state (REGISTER requires NONE; GO_LIVE requires SCHEDULED; RESUME requires SUSPENDED and spectator_strikes < 3; END requires LIVE or SUSPENDED)"
    error_id: ERR_INVALID_BROADCAST_STATE
    http_status: 409
    applies_to: "POST /matches/{matchId}/broadcast"

  - priority: 20
    category: state
    check: "FairPlayCase.status is a legal from-state (investigate requires REPORTED; decision requires INVESTIGATING; appeal requires SUSTAINED; appeal-decision requires APPEALED)"
    error_id: ERR_INVALID_CASE_STATE
    http_status: 409
    applies_to: "POST /fair-play-cases/{caseId}/investigate, POST /fair-play-cases/{caseId}/decision, POST /fair-play-cases/{caseId}/appeal, POST /fair-play-cases/{caseId}/appeal-decision"

  - priority: 21
    category: state
    check: "TitleApproval.status is a legal from-state (APPROVE and DENY require PENDING; REVOKE requires APPROVED)"
    error_id: ERR_INVALID_APPROVAL_STATE
    http_status: 409
    applies_to: "POST /title-approvals/{approvalId}/decision"

  # --- tier 7: business_safety (eligibility, compliance, segregation of duties) --
  - priority: 22
    category: business_safety
    check: "two-person roster verification: X-User-ID != RosterSlot.enrollment_verified_by_user_id"
    error_id: ERR_SEGREGATION_OF_DUTIES
    http_status: 409
    applies_to: "POST /roster-slots/{slotId}/verify-academics"

  - priority: 23
    category: business_safety
    check: "appeal independence: X-User-ID NOT IN {FairPlayCase.investigator_user_id, FairPlayCase.decider_user_id}"
    error_id: ERR_SEGREGATION_OF_DUTIES
    http_status: 409
    applies_to: "POST /fair-play-cases/{caseId}/appeal-decision"

  - priority: 24
    category: business_safety
    check: "Coach(Team.coach_id).certification_status == CERTIFIED"
    error_id: ERR_COACH_NOT_CERTIFIED
    http_status: 409
    applies_to: "POST /teams/{teamId}/register, POST /roster-slots/{slotId}/verify-enrollment"

  - priority: 25
    category: business_safety
    check: "Coach(Team.coach_id).background_check_expires_on >= date(clock.now) (inclusive: an expiry equal to today still clears)"
    error_id: ERR_COACH_BACKGROUND_CHECK_EXPIRED
    http_status: 409
    applies_to: "POST /teams/{teamId}/register, POST /roster-slots/{slotId}/verify-enrollment"

  - priority: 26
    category: business_safety
    check: "Student.enrollment_status == ENROLLED"
    error_id: ERR_STUDENT_NOT_ENROLLED
    http_status: 422
    applies_to: "POST /roster-slots, POST /roster-slots/{slotId}/verify-enrollment"

  - priority: 27
    category: business_safety
    check: "School(Student.school_id).enrollment_verified_through >= date(clock.now) — the registrar's certification of the roster has not lapsed"
    error_id: ERR_ENROLLMENT_CERTIFICATION_LAPSED
    http_status: 422
    applies_to: "POST /roster-slots/{slotId}/verify-enrollment"

  - priority: 28
    category: business_safety
    check: "verified_birthdate equals Student.birthdate exactly (registrar document must match the student record)"
    error_id: ERR_BIRTHDATE_DOCUMENT_MISMATCH
    http_status: 422
    applies_to: "POST /roster-slots/{slotId}/verify-enrollment"

  - priority: 29
    category: business_safety
    check: "age_at_cutoff >= Title.min_player_age (publisher floor; inclusive)"
    error_id: ERR_STUDENT_BELOW_TITLE_MIN_AGE
    http_status: 422
    applies_to: "POST /roster-slots/{slotId}/verify-enrollment"

  - priority: 30
    category: business_safety
    check: "age_at_cutoff < Season.max_age (league ceiling; a student whose age at Season.age_cutoff_date equals max_age is over-age)"
    error_id: ERR_STUDENT_OVER_AGE_LIMIT
    http_status: 422
    applies_to: "POST /roster-slots/{slotId}/verify-enrollment"

  - priority: 31
    category: business_safety
    check: "Student.latest_term_gpa is not null and academic_standing_evaluation does not yield INELIGIBLE"
    error_id: ERR_ACADEMIC_STANDING_INELIGIBLE
    http_status: 422
    applies_to: "POST /roster-slots/{slotId}/verify-academics"

  - priority: 32
    category: business_safety
    check: "academic_standing_evaluation does not yield PROBATION when RosterSlot.slot_role == STARTER (a PROBATION student may hold a SUB slot only)"
    error_id: ERR_PROBATION_STARTER_RESTRICTED
    http_status: 422
    applies_to: "POST /roster-slots/{slotId}/verify-academics"

  - priority: 33
    category: business_safety
    check: "Student.fair_play_status == CLEAR"
    error_id: ERR_STUDENT_FAIR_PLAY_SANCTIONED
    http_status: 409
    applies_to: "POST /roster-slots, POST /roster-slots/{slotId}/verify-academics, POST /students/{studentId}/showcase-nomination"

  - priority: 34
    category: business_safety
    check: "ordinal(Title.age_rating) <= ordinal(District.max_age_rating) with E=0 < E10=1 < T=2 < M=3"
    error_id: ERR_TITLE_AGE_RATING_EXCEEDS_DISTRICT_CEILING
    http_status: 422
    applies_to: "POST /title-approvals/{approvalId}/decision with action=APPROVE"

  - priority: 35
    category: business_safety
    check: "exists TitleApproval with district_id == School(Team.school_id).district_id AND title_id == Team.title_id AND status == APPROVED"
    error_id: ERR_TITLE_NOT_DISTRICT_APPROVED
    http_status: 409
    applies_to: "POST /teams/{teamId}/register"

  # --- tier 8: business_referential (cross-entity consistency) ----------------
  - priority: 36
    category: business_referential
    check: "Student(student_id).school_id == Team(team_id).school_id"
    error_id: ERR_STUDENT_SCHOOL_MISMATCH
    http_status: 422
    applies_to: "POST /roster-slots"

  - priority: 37
    category: business_referential
    check: "Coach(coach_id).school_id == Team.school_id"
    error_id: ERR_COACH_SCHOOL_MISMATCH
    http_status: 422
    applies_to: "POST /teams"

  - priority: 38
    category: business_referential
    check: "Team.title_id == Season(season_id).title_id"
    error_id: ERR_TEAM_TITLE_MISMATCH
    http_status: 422
    applies_to: "POST /teams"

  - priority: 39
    category: business_referential
    check: "Team(home_team_id).season_id == season_id AND Team(away_team_id).season_id == season_id"
    error_id: ERR_TEAM_SEASON_MISMATCH
    http_status: 422
    applies_to: "POST /matches"

  - priority: 40
    category: business_referential
    check: "the team named in the body participates in the match: reporting_team_id / filing_team_id / forfeiting_team_id IN {Match.home_team_id, Match.away_team_id}"
    error_id: ERR_TEAM_NOT_MATCH_PARTICIPANT
    http_status: 422
    applies_to: "POST /matches/{matchId}/result-reports, POST /matches/{matchId}/disputes, POST /matches/{matchId}/forfeit"

  - priority: 41
    category: business_referential
    check: "broadcast_school_id equals the school of the requesting coach's participating team"
    error_id: ERR_BROADCAST_SCHOOL_MISMATCH
    http_status: 422
    applies_to: "POST /matches/{matchId}/broadcast with action=REGISTER"

  - priority: 42
    category: business_referential
    check: "case subject belongs to the charged team: subject_type == STUDENT requires a non-RELEASED RosterSlot linking subject_student_id to team_id; subject_type == MATCH_BROADCAST requires team_id IN {Match.home_team_id, Match.away_team_id}"
    error_id: ERR_SUBJECT_TEAM_MISMATCH
    http_status: 422
    applies_to: "POST /fair-play-cases"

  - priority: 43
    category: business_referential
    check: "the nominated student holds a non-RELEASED RosterSlot on nominating_team_id"
    error_id: ERR_STUDENT_NOT_ON_TEAM
    http_status: 422
    applies_to: "POST /students/{studentId}/showcase-nomination"

  # --- tier 9: business_temporal (windows, deadlines, resource overlap) ------
  - priority: 44
    category: business_temporal
    check: "Season.registration_opens_at <= clock.now <= Season.registration_closes_at (both bounds inclusive)"
    error_id: ERR_REGISTRATION_WINDOW_CLOSED
    http_status: 409
    applies_to: "POST /teams/{teamId}/register"

  - priority: 45
    category: business_temporal
    check: "clock.now <= Season.roster_lock_at (inclusive: locking at the exact deadline millisecond succeeds)"
    error_id: ERR_ROSTER_LOCK_DEADLINE_PASSED
    http_status: 409
    applies_to: "POST /teams/{teamId}/roster-lock"

  - priority: 46
    category: business_temporal
    check: "Season.roster_lock_at <= scheduled_start_at AND scheduled_start_at + Title.match_duration_minutes <= Season.regular_season_end_at"
    error_id: ERR_MATCH_OUTSIDE_SEASON_WINDOW
    http_status: 409
    applies_to: "POST /matches"

  - priority: 47
    category: business_temporal
    check: "server_pool_overlap: peak occupancy of Title.server_pool_id over the HALF-OPEN interval [scheduled_start_at, scheduled_end_at) stays <= Title.server_pool_capacity; adjacency (peer end == candidate start) is legal"
    error_id: ERR_SERVER_POOL_CAPACITY_EXCEEDED
    http_status: 409
    applies_to: "POST /matches"

  - priority: 48
    category: business_temporal
    check: "broadcast_channel_overlap: conflicting broadcasts on School(broadcast_school_id) over the CLOSED interval expanded by District.broadcast_buffer_minutes on both ends stay < School.concurrent_broadcast_capacity; adjacency conflicts"
    error_id: ERR_BROADCAST_CHANNEL_CONFLICT
    http_status: 409
    applies_to: "POST /matches/{matchId}/broadcast with action=REGISTER"

  - priority: 49
    category: business_temporal
    check: "clock.now <= Match.dispute_deadline_at (inclusive at the exact millisecond)"
    error_id: ERR_DISPUTE_WINDOW_CLOSED
    http_status: 409
    applies_to: "POST /matches/{matchId}/disputes"

  - priority: 50
    category: business_temporal
    check: "clock.now is outside the CLOSED interval [District.recruiting_dead_period_start, District.recruiting_dead_period_end] when both are configured"
    error_id: ERR_RECRUITING_DEAD_PERIOD
    http_status: 409
    applies_to: "POST /students/{studentId}/recruiting-contacts"

  - priority: 51
    category: business_temporal
    check: "current_utc >= the logical clock's present value (the clock never moves backwards)"
    error_id: ERR_CLOCK_REWIND_FORBIDDEN
    http_status: 409
    applies_to: "POST /_clock/set_current_utc"

  # --- tier 10: business_constraint (uniqueness, capacity, quota) ------------
  - priority: 52
    category: business_constraint
    check: "School.nces_code is unique within district_id"
    error_id: ERR_DUPLICATE_NCES_CODE
    http_status: 409
    applies_to: "POST /schools"

  - priority: 53
    category: business_constraint
    check: "Title.name is globally unique"
    error_id: ERR_DUPLICATE_TITLE_NAME
    http_status: 409
    applies_to: "POST /titles"

  - priority: 54
    category: business_constraint
    check: "Team.name is unique within season_id"
    error_id: ERR_DUPLICATE_TEAM_NAME
    http_status: 409
    applies_to: "POST /teams"

  - priority: 55
    category: business_constraint
    check: "at most one TitleApproval per (district_id, title_id) in status PENDING or APPROVED"
    error_id: ERR_DUPLICATE_TITLE_APPROVAL
    http_status: 409
    applies_to: "POST /title-approvals"

  - priority: 56
    category: business_constraint
    check: "at most one RosterSlot per (team_id, student_id) with participation_status != RELEASED"
    error_id: ERR_DUPLICATE_ROSTER_SLOT
    http_status: 409
    applies_to: "POST /roster-slots"

  - priority: 57
    category: business_constraint
    check: "Team.starter_slots_used < Season.max_starters when slot_role == STARTER (i.e. Team.starter_slots_available >= 1)"
    error_id: ERR_STARTER_CAPACITY_EXCEEDED
    http_status: 409
    applies_to: "POST /roster-slots"

  - priority: 58
    category: business_constraint
    check: "Team.active_starter_count >= Season.min_starters"
    error_id: ERR_ROSTER_MINIMUM_NOT_MET
    http_status: 422
    applies_to: "POST /teams/{teamId}/register, POST /teams/{teamId}/roster-lock"

  - priority: 59
    category: business_constraint
    check: "Student.showcase_status == NONE (a student may be nominated once)"
    error_id: ERR_ALREADY_NOMINATED
    http_status: 409
    applies_to: "POST /students/{studentId}/showcase-nomination"

  - priority: 60
    category: business_constraint
    check: "Student.showcase_status == NOMINATED (recruiting contact is only permitted on the showcase pathway)"
    error_id: ERR_SHOWCASE_NOT_NOMINATED
    http_status: 409
    applies_to: "POST /students/{studentId}/recruiting-contacts"

  - priority: 61
    category: business_constraint
    check: "recruiting_contact_quota: contacts_in_window < District.recruiting_contact_cap_per_window over the HALF-OPEN window (clock.now - recruiting_window_days, clock.now]"
    error_id: ERR_RECRUITING_CONTACT_CAP_EXCEEDED
    http_status: 409
    applies_to: "POST /students/{studentId}/recruiting-contacts"

  - priority: 62
    category: business_constraint
    check: "at least one Team in the season has status IN {COMPETING, SUSPENDED, PLAYOFF_SEEDED, ELIMINATED}"
    error_id: ERR_SEED_ORDER_EMPTY
    http_status: 422
    applies_to: "POST /seasons/{seasonId}/seeding"

  # --- tier 11: business_fiscal (budget last) --------------------------------
  - priority: 63
    category: business_fiscal
    check: "District.subsidy_pool_cents >= the subsidy_granted_cents team_entry_fee would award"
    error_id: ERR_SUBSIDY_POOL_EXHAUSTED
    http_status: 402
    applies_to: "POST /teams/{teamId}/register"

validation_priority_conflicts:
  - name: register-state-beats-fiscal
    pair: "priority 14 ERR_INVALID_TEAM_STATE (state) vs priority 63 ERR_SUBSIDY_POOL_EXHAUSTED (business_fiscal)"
    expected: ERR_INVALID_TEAM_STATE
  - name: dispute-referential-beats-temporal
    pair: "priority 40 ERR_TEAM_NOT_MATCH_PARTICIPANT (business_referential) vs priority 49 ERR_DISPUTE_WINDOW_CLOSED (business_temporal)"
    expected: ERR_TEAM_NOT_MATCH_PARTICIPANT
  - name: verify-academics-state-beats-safety
    pair: "priority 15 ERR_ROSTER_LOCKED (state) vs priority 22 ERR_SEGREGATION_OF_DUTIES (business_safety)"
    expected: ERR_ROSTER_LOCKED
  - name: recruiting-temporal-beats-constraint
    pair: "priority 50 ERR_RECRUITING_DEAD_PERIOD (business_temporal) vs priority 61 ERR_RECRUITING_CONTACT_CAP_EXCEEDED (business_constraint)"
    expected: ERR_RECRUITING_DEAD_PERIOD

# ---------------------------------------------------------------------------
# §1.5 API Endpoint Table (flat topology: every collection is a top-level path)
# ---------------------------------------------------------------------------
endpoints:

  # ---- District -------------------------------------------------------------
  - method: POST
    path: "/districts"
    description: Create a district and pin its academic, recruiting, dispute, broadcast and subsidy policy
    roles: [LeagueAdmin]
    code: 201
    input: ["name", "state_code", "max_age_rating?", "academic_standing_basis?", "min_gpa?", "probation_gpa_floor?", "dispute_window_hours?", "subsidy_pct?", "subsidy_pool_cents?", "recruiting_dead_period_start?", "recruiting_dead_period_end?", "recruiting_contact_cap_per_window?", "recruiting_window_days?", "broadcast_buffer_minutes?"]
    output: District
    side_effects: ["subsidy_pool_initial_cents copied from subsidy_pool_cents (anchor for the subsidy conservation invariant)"]

  - method: GET
    path: "/districts/{districtId}"
    description: Read one district
    roles: [LeagueAdmin, DistrictAdmin, AthleticDirector, Coach, EligibilityOfficer, IntegrityOfficer, Recruiter]
    code: 200
    input: []
    output: District
    side_effects: []

  - method: GET
    path: "/districts"
    description: List districts
    roles: [LeagueAdmin, DistrictAdmin, EligibilityOfficer, IntegrityOfficer, Recruiter]
    code: 200
    input: ["state_code?", "limit?", "offset?"]
    output: District[]
    side_effects: []

  # ---- School ---------------------------------------------------------------
  - method: POST
    path: "/schools"
    description: Register a school under a district
    roles: [LeagueAdmin, DistrictAdmin]
    code: 201
    input: ["district_id", "name", "nces_code", "enrollment_verified_through?", "concurrent_broadcast_capacity?"]
    output: School
    side_effects: ["School.status initialised to ACTIVE"]

  - method: GET
    path: "/schools/{schoolId}"
    description: Read one school
    roles: [LeagueAdmin, DistrictAdmin, AthleticDirector, Coach, EligibilityOfficer, IntegrityOfficer, Recruiter]
    code: 200
    input: []
    output: School
    side_effects: []

  - method: GET
    path: "/schools"
    description: List schools, filterable by district (FK reverse lookup for School.district_id)
    roles: [LeagueAdmin, DistrictAdmin, AthleticDirector, EligibilityOfficer, IntegrityOfficer, Recruiter]
    code: 200
    input: ["district_id?", "status?", "limit?", "offset?"]
    output: School[]
    side_effects: []

  # ---- Coach ----------------------------------------------------------------
  - method: POST
    path: "/coaches"
    description: Designate a coach for a school
    roles: [LeagueAdmin, AthleticDirector]
    code: 201
    input: [school_id, full_name, email]
    output: Coach
    side_effects: ["Coach.certification_status initialised to PENDING with background_check_expires_on null"]

  - method: GET
    path: "/coaches/{coachId}"
    description: Read one coach
    roles: [LeagueAdmin, DistrictAdmin, AthleticDirector, Coach, EligibilityOfficer, IntegrityOfficer]
    code: 200
    input: []
    output: Coach
    side_effects: []

  - method: GET
    path: "/coaches"
    description: List coaches, filterable by school (FK reverse lookup for Coach.school_id)
    roles: [LeagueAdmin, DistrictAdmin, AthleticDirector, EligibilityOfficer, IntegrityOfficer]
    code: 200
    input: ["school_id?", "certification_status?", "limit?", "offset?"]
    output: Coach[]
    side_effects: []

  - method: POST
    path: "/coaches/{coachId}/certification"
    description: "Certify or suspend a coach; action=CERTIFY sets certification_status CERTIFIED and pins background_check_expires_on (which may be any date, including one already past, so the expiry guard is testable), action=SUSPEND sets SUSPENDED"
    roles: [AthleticDirector, LeagueAdmin]
    code: 200
    input: ["action", "background_check_expires_on?"]
    output: Coach
    side_effects:
      - "on CERTIFY: certification_status = CERTIFIED, background_check_expires_on = the supplied date, certified_at = clock.now"
      - "on SUSPEND: certification_status = SUSPENDED"
      - "increments Coach.version by 1"

  # ---- Student --------------------------------------------------------------
  - method: POST
    path: "/students"
    description: Enrol a student record at a school
    roles: [LeagueAdmin, AthleticDirector, EligibilityOfficer]
    code: 201
    input: ["school_id", "full_name", "birthdate", "grade_level", "enrollment_status?", "credits_completed?"]
    output: Student
    side_effects: ["academic_standing initialised to UNEVALUATED, fair_play_status to CLEAR, showcase_status to NONE, recruiting_contact_log to []"]

  - method: GET
    path: "/students/{studentId}"
    description: Read one student including effective_gpa, academic_standing, scholarship figures and recruiting_contact_log
    roles: [LeagueAdmin, DistrictAdmin, AthleticDirector, Coach, EligibilityOfficer, IntegrityOfficer, Recruiter]
    code: 200
    input: []
    output: Student
    side_effects: []

  - method: GET
    path: "/students"
    description: List students; FK reverse lookup for Student.school_id and Student.nominating_team_id
    roles: [LeagueAdmin, DistrictAdmin, AthleticDirector, EligibilityOfficer, IntegrityOfficer, Recruiter]
    code: 200
    input: ["school_id?", "nominating_team_id?", "academic_standing?", "showcase_status?", "limit?", "offset?"]
    output: Student[]
    side_effects: []

  - method: POST
    path: "/students/{studentId}/academic-postings"
    description: "Post one academic term for a student; the term shifts into latest_term_* and the displaced term into prior_term_* (shift register of depth 2), then academic_standing_evaluation reruns under the district's basis"
    roles: [EligibilityOfficer, LeagueAdmin]
    code: 200
    input: [term_label, term_gpa, term_credits, expected_student_version]
    output: Student
    side_effects:
      - "prior_term_gpa / prior_term_credits = the outgoing latest_term_* pair; latest_term_* = the posted values; latest_term_label = term_label"
      - "runs academic_standing_evaluation: effective_gpa, academic_standing, standing_basis_applied rewritten"
      - "every not-yet-locked RosterSlot of this student with academic_status PENDING moves to BLOCKED when the recomputed standing is INELIGIBLE"
      - "increments Student.version by 1"

  - method: POST
    path: "/students/{studentId}/showcase-nomination"
    description: Nominate a student to the showcase pathway and project the scholarship award from the nominating team's seed position
    roles: [LeagueAdmin]
    code: 200
    input: [nominating_team_id]
    output: Student
    side_effects:
      - "showcase_status = NOMINATED; nominating_team_id stored"
      - "runs showcase_scholarship_award: provisional_award_cents, award_tier, scholarship_award_cents set; scholarship_award_state = CURRENT"
      - "increments Student.version by 1"

  - method: POST
    path: "/students/{studentId}/recruiting-contacts"
    description: Log a college recruiting contact against a showcase-nominated student, subject to the dead period and the rolling contact cap
    roles: [Recruiter]
    code: 200
    input: [org_code, channel, purpose]
    output: Student
    side_effects:
      - "appends {contacted_at: clock.now, org_code, channel, purpose} to Student.recruiting_contact_log"
      - "increments Student.version by 1"

  # ---- Title ----------------------------------------------------------------
  - method: POST
    path: "/titles"
    description: Add a game title with its age rating, publisher age floor and server-pool geometry
    roles: [LeagueAdmin]
    code: 201
    input: ["name", "publisher", "age_rating?", "min_player_age?", "server_pool_id?", "server_pool_capacity?", "match_duration_minutes?"]
    output: Title
    side_effects: []

  - method: GET
    path: "/titles/{titleId}"
    description: Read one title
    roles: [LeagueAdmin, DistrictAdmin, AthleticDirector, Coach, EligibilityOfficer, IntegrityOfficer]
    code: 200
    input: []
    output: Title
    side_effects: []

  - method: GET
    path: "/titles"
    description: List titles
    roles: [LeagueAdmin, DistrictAdmin, AthleticDirector, Coach, EligibilityOfficer, IntegrityOfficer]
    code: 200
    input: ["age_rating?", "server_pool_id?", "limit?", "offset?"]
    output: Title[]
    side_effects: []

  # ---- TitleApproval --------------------------------------------------------
  - method: POST
    path: "/title-approvals"
    description: A school asks its district to approve a title for league play
    roles: [AthleticDirector, LeagueAdmin]
    code: 201
    input: [district_id, title_id, requested_by_school_id]
    output: TitleApproval
    side_effects: ["status initialised to PENDING"]

  - method: GET
    path: "/title-approvals/{approvalId}"
    description: Read one title approval
    roles: [LeagueAdmin, DistrictAdmin, AthleticDirector, Coach]
    code: 200
    input: []
    output: TitleApproval
    side_effects: []

  - method: GET
    path: "/title-approvals"
    description: List title approvals; FK reverse lookup for district_id, title_id and requested_by_school_id
    roles: [LeagueAdmin, DistrictAdmin, AthleticDirector, Coach]
    code: 200
    input: ["district_id?", "title_id?", "requested_by_school_id?", "status?", "limit?", "offset?"]
    output: TitleApproval[]
    side_effects: []

  - method: POST
    path: "/title-approvals/{approvalId}/decision"
    description: "District decision on a title: action=APPROVE | DENY | REVOKE"
    roles: [DistrictAdmin]
    code: 200
    input: ["action", "decision_note?"]
    output: TitleApproval
    side_effects:
      - "status -> APPROVED | DENIED | REVOKED per the TitleApproval machine"
      - "decided_by_user_id = X-User-ID; decided_at = clock.now"
      - "increments TitleApproval.version by 1"

  # ---- Season ---------------------------------------------------------------
  - method: POST
    path: "/seasons"
    description: Create a season on one title, fixing every window, fee, age and seeding parameter
    roles: [LeagueAdmin]
    code: 201
    input: ["title_id", "name", "division?", "registration_opens_at?", "registration_closes_at?", "roster_lock_at?", "regular_season_end_at?", "age_cutoff_date?", "max_age?", "min_starters?", "max_starters?", "base_entry_fee_cents?", "per_starter_fee_cents?", "seeding_basis?", "playoff_slots?"]
    output: Season
    side_effects: ["status initialised to DRAFT, seeding_state to UNSEEDED, seed_order to [], match_point_pool to 0"]

  - method: GET
    path: "/seasons/{seasonId}"
    description: Read one season including seeding_state, seeding_basis_applied, seed_order and match_point_pool
    roles: [LeagueAdmin, DistrictAdmin, AthleticDirector, Coach, EligibilityOfficer, IntegrityOfficer, Recruiter]
    code: 200
    input: []
    output: Season
    side_effects: []

  - method: GET
    path: "/seasons"
    description: List seasons; FK reverse lookup for Season.title_id
    roles: [LeagueAdmin, DistrictAdmin, AthleticDirector, Coach, EligibilityOfficer, IntegrityOfficer, Recruiter]
    code: 200
    input: ["title_id?", "status?", "division?", "limit?", "offset?"]
    output: Season[]
    side_effects: []

  - method: POST
    path: "/seasons/{seasonId}/advance"
    description: "Advance the season stage: to_status = REGISTRATION_OPEN | ROSTER_LOCKED | REGULAR_SEASON | PLAYOFFS | COMPLETE"
    roles: [LeagueAdmin]
    code: 200
    input: [to_status]
    output: Season
    side_effects:
      - "Season.status advances per the Season machine (compound preconditions over Team and Match children)"
      - "on ROSTER_LOCKED -> REGULAR_SEASON: every Team in the season with status ROSTER_LOCKED cascades to COMPETING"
      - "increments Season.version by 1"

  - method: POST
    path: "/seasons/{seasonId}/seeding"
    description: "Run playoff seeding. basis_override lets the same season be seeded under either seed_points variant without editing Season.seeding_basis; the applied basis is echoed in Season.seeding_basis_applied"
    roles: [LeagueAdmin]
    code: 200
    input: ["basis_override?"]
    output: Season
    side_effects:
      - "recomputes every eligible Team's integrity_score, then seed_points under the applied basis, then tiebreak_seed_order"
      - "assigns Team.seed_position, clears Team.seed_stale, promotes the top Season.playoff_slots teams to PLAYOFF_SEEDED and demotes the rest to ELIMINATED"
      - "Season.seed_order, Season.seeding_basis_applied set; Season.seeding_state = SEEDED"
      - "increments Season.version by 1 and each reseeded Team.version by 1"

  # ---- Team -----------------------------------------------------------------
  - method: POST
    path: "/teams"
    description: Create a team in DRAFT for a school, season, title and designated coach
    roles: [Coach, AthleticDirector]
    code: 201
    input: [season_id, school_id, title_id, coach_id, name]
    output: Team
    side_effects: ["status initialised to DRAFT; starter_slots_used 0 and starter_slots_available = Season.max_starters (starter-capacity conservation holds from creation)"]

  - method: GET
    path: "/teams/{teamId}"
    description: Read one team including fee, record, seed and integrity figures
    roles: [LeagueAdmin, DistrictAdmin, AthleticDirector, Coach, EligibilityOfficer, IntegrityOfficer, Recruiter]
    code: 200
    input: []
    output: Team
    side_effects: []

  - method: GET
    path: "/teams"
    description: List teams; FK reverse lookup for season_id, school_id, title_id and coach_id
    roles: [LeagueAdmin, DistrictAdmin, AthleticDirector, Coach, EligibilityOfficer, IntegrityOfficer, Recruiter]
    code: 200
    input: ["season_id?", "school_id?", "title_id?", "coach_id?", "status?", "limit?", "offset?"]
    output: Team[]
    side_effects: []

  - method: POST
    path: "/teams/{teamId}/register"
    description: Register the team into the season, pinning the entry fee and debiting the district subsidy pool
    roles: [Coach]
    code: 200
    input: []
    output: Team
    side_effects:
      - "runs team_entry_fee: entry_fee_cents, subsidy_granted_cents, net_fee_due_cents pinned (per-line-item rounding)"
      - "District.subsidy_pool_cents -= subsidy_granted_cents"
      - "status DRAFT -> REGISTERED; registered_at = clock.now; Season.registered_team_count recomputed"
      - "increments Team.version by 1"

  - method: POST
    path: "/teams/{teamId}/roster-lock"
    description: Coach locks the roster before the season deadline
    roles: [Coach]
    code: 200
    input: []
    output: Team
    side_effects: ["status REGISTERED -> ROSTER_LOCKED; roster_locked_at = clock.now", "increments Team.version by 1"]

  - method: POST
    path: "/teams/{teamId}/withdraw"
    description: Athletic director withdraws the team, restoring the subsidy and forfeiting its unplayed matches
    roles: [AthleticDirector]
    code: 200
    input: ["withdrawal_note?"]
    output: Team
    side_effects:
      - "District.subsidy_pool_cents += subsidy_granted_cents; subsidy_granted_cents = 0; net_fee_due_cents = 0 (compensation)"
      - "every RosterSlot not already RELEASED -> RELEASED; every match in SCHEDULED or SERVER_READY -> FORFEITED"
      - "Season.registered_team_count recomputed; Season.seeding_state SEEDED -> STALE"
      - "status -> WITHDRAWN; increments Team.version by 1"

  # ---- RosterSlot -----------------------------------------------------------
  - method: POST
    path: "/roster-slots"
    description: Add a student to a team roster as STARTER or SUB
    roles: [Coach]
    code: 201
    input: ["team_id", "student_id", "slot_role?"]
    output: RosterSlot
    side_effects:
      - "verification_status = UNVERIFIED, academic_status = PENDING, participation_status = PROSPECTIVE"
      - "Team.starter_slots_used / starter_slots_available recomputed by roster_slot_participation"
      - "increments RosterSlot.version by 1"

  - method: GET
    path: "/roster-slots/{slotId}"
    description: Read one roster slot with both verification axes and the derived participation axis
    roles: [LeagueAdmin, DistrictAdmin, AthleticDirector, Coach, EligibilityOfficer, IntegrityOfficer]
    code: 200
    input: []
    output: RosterSlot
    side_effects: []

  - method: GET
    path: "/roster-slots"
    description: List roster slots; FK reverse lookup for RosterSlot.team_id and RosterSlot.student_id
    roles: [LeagueAdmin, DistrictAdmin, AthleticDirector, Coach, EligibilityOfficer, IntegrityOfficer]
    code: 200
    input: ["team_id?", "student_id?", "slot_role?", "participation_status?", "limit?", "offset?"]
    output: RosterSlot[]
    side_effects: []

  - method: POST
    path: "/roster-slots/{slotId}/verify-enrollment"
    description: "Axis 1 verification: registrar enrollment plus age at the season cutoff"
    roles: [EligibilityOfficer]
    code: 200
    input: [enrollment_document_ref, verified_birthdate]
    output: RosterSlot
    side_effects:
      - "verification_status UNVERIFIED -> ENROLLMENT_VERIFIED; age_at_cutoff pinned; enrollment_verified_by_user_id = X-User-ID"
      - "participation_status reconciled by roster_slot_participation; Team roll-ups recomputed"
      - "increments RosterSlot.version by 1"

  - method: POST
    path: "/roster-slots/{slotId}/verify-academics"
    description: "Axis 2 verification: academic standing, performed by a different officer than axis 1"
    roles: [EligibilityOfficer]
    code: 200
    input: []
    output: RosterSlot
    side_effects:
      - "runs academic_standing_evaluation on the Student and snapshots standing_at_verification / effective_gpa_at_verification"
      - "academic_status PENDING -> CLEARED; academics_verified_by_user_id = X-User-ID"
      - "participation_status reconciled by roster_slot_participation; Team.active_starter_count recomputed"
      - "increments RosterSlot.version by 1 and Student.version by 1"

  - method: POST
    path: "/roster-slots/{slotId}/release"
    description: Coach releases a slot, returning its starter capacity to the team
    roles: [Coach]
    code: 200
    input: ["release_note?"]
    output: RosterSlot
    side_effects:
      - "released_at = clock.now; participation_status -> RELEASED"
      - "Team.starter_slots_used decremented and starter_slots_available incremented; active_starter_count recomputed"
      - "increments RosterSlot.version by 1"

  # ---- Match ----------------------------------------------------------------
  - method: POST
    path: "/matches"
    description: Schedule a match, occupying a half-open interval on the title's shared server pool
    roles: [LeagueAdmin]
    code: 201
    input: [season_id, home_team_id, away_team_id, scheduled_start_at]
    output: Match
    side_effects:
      - "scheduled_end_at = scheduled_start_at + Title.match_duration_minutes; server_pool_id copied from the season's Title"
      - "server_pool_overlap enforced against every non-terminal match on that pool"
      - "play_status SCHEDULED, result_status AWAITING_REPORTS, dispute_status NONE, broadcast_status NONE"

  - method: GET
    path: "/matches/{matchId}"
    description: Read one match with all four state dimensions, both report pairs and the awarded points
    roles: [LeagueAdmin, DistrictAdmin, AthleticDirector, Coach, EligibilityOfficer, IntegrityOfficer]
    code: 200
    input: []
    output: Match
    side_effects: []

  - method: GET
    path: "/matches"
    description: List matches; FK reverse lookup for season_id, home_team_id, away_team_id, broadcast_school_id, dispute_filed_by_team_id, winner_team_id and forfeiting_team_id
    roles: [LeagueAdmin, DistrictAdmin, AthleticDirector, Coach, EligibilityOfficer, IntegrityOfficer]
    code: 200
    input: ["season_id?", "home_team_id?", "away_team_id?", "broadcast_school_id?", "dispute_filed_by_team_id?", "winner_team_id?", "forfeiting_team_id?", "play_status?", "result_status?", "dispute_status?", "broadcast_status?", "limit?", "offset?"]
    output: Match[]
    side_effects: []

  - method: POST
    path: "/matches/{matchId}/server-config"
    description: Pin the match server region and game patch, moving the match to SERVER_READY
    roles: [LeagueAdmin]
    code: 200
    input: [region_code, patch_version]
    output: Match
    side_effects: ["region_code and patch_version pinned; play_status SCHEDULED -> SERVER_READY", "increments Match.version by 1"]

  - method: POST
    path: "/matches/{matchId}/result-reports"
    description: "A participating coach reports the game score. The first report moves result_status to PARTIALLY_REPORTED; an agreeing second report CONFIRMS and awards points; a disagreeing one CONTESTS. expected_match_version guards against reporting over a supersession the reporter never saw."
    roles: [Coach]
    code: 200
    input: [reporting_team_id, home_games_won, away_games_won, expected_match_version]
    output: Match
    side_effects:
      - "stores this side's report pair (a repeat report from the same side supersedes its earlier values)"
      - "on agreement: home_games_won / away_games_won pinned, winner_team_id set, play_status -> PLAYED, result_status -> CONFIRMED, result_confirmed_at = clock.now, dispute_deadline_at computed from the home team's district"
      - "on agreement: runs match_point_award; Season.match_point_pool grows; Season.seeding_state SEEDED -> STALE and both teams' seed_stale = true"
      - "on disagreement: play_status -> PLAYED, result_status -> CONTESTED, no points awarded"
      - "increments Match.version by 1"

  - method: POST
    path: "/matches/{matchId}/finalize"
    description: "Finalize a played match. From CONTESTED both override_* fields are required and the result is ADJUDICATED; from a CONFIRMED or ADJUDICATED result the overrides must be absent and the match simply reaches FINALIZED."
    roles: [LeagueAdmin]
    code: 200
    input: ["override_home_games_won?", "override_away_games_won?"]
    output: Match
    side_effects:
      - "from CONTESTED: home_games_won / away_games_won pinned to the overrides, winner_team_id set, result_status -> ADJUDICATED, result_confirmed_at = clock.now, dispute_deadline_at computed, match_point_award run"
      - "play_status PLAYED -> FINALIZED"
      - "increments Match.version by 1"

  - method: POST
    path: "/matches/{matchId}/forfeit"
    description: Charge a forfeit against one participant of an unplayed match
    roles: [LeagueAdmin]
    code: 200
    input: ["forfeiting_team_id", "reason_note?"]
    output: Match
    side_effects:
      - "play_status -> FORFEITED, result_status -> ADJUDICATED, winner_team_id = the other team, forfeiting_team_id stored"
      - "match_point_award in FORFEIT mode: winner +3 and forfeit_wins +1, forfeiting team +0 and forfeits_charged +1, wins/losses/draws untouched"
      - "result_confirmed_at = clock.now; dispute_deadline_at computed; Season.match_point_pool += 3; Season.seeding_state SEEDED -> STALE"
      - "increments Match.version by 1"

  - method: POST
    path: "/matches/{matchId}/disputes"
    description: A participating coach disputes a confirmed or adjudicated result inside the district's dispute window
    roles: [Coach]
    code: 200
    input: ["filing_team_id", "dispute_reason_code", "dispute_note?"]
    output: Match
    side_effects: ["dispute_status NONE -> OPEN; dispute_filed_by_team_id and dispute_reason_code stored", "increments Match.version by 1"]

  - method: POST
    path: "/matches/{matchId}/dispute-actions"
    description: "League action on an open dispute: action = ACCEPT_REVIEW | REQUEST_INFO | RESUME_REVIEW | UPHOLD | REJECT. UPHOLD requires both corrected_* fields and drives the four-link restatement cascade."
    roles: [LeagueAdmin]
    code: 200
    input: ["action", "corrected_home_games_won?", "corrected_away_games_won?", "info_request_note?"]
    output: Match
    side_effects:
      - "dispute_status advances per the Match dispute dimension (UNDER_REVIEW <-> NEEDS_INFO may repeat)"
      - "on UPHOLD: result_status -> ADJUDICATED with the corrected pair; the prior match_point_award is reverted and reapplied on both teams; Season.match_point_pool adjusted by the delta; Season.seeding_state -> STALE with every seeded team's seed_stale = true; every NOMINATED student of the season whose nominating team is in it moves to scholarship_award_state RECALC_REQUIRED"
      - "on REJECT: nothing but dispute_status changes"
      - "increments Match.version by 1"

  - method: POST
    path: "/matches/{matchId}/broadcast"
    description: "Broadcast control: action = REGISTER | GO_LIVE | RESUME | END. REGISTER claims the school channel subject to broadcast_channel_overlap."
    roles: [Coach]
    code: 200
    input: ["action", "broadcast_school_id?", "broadcast_start_at?", "broadcast_end_at?"]
    output: Match
    side_effects:
      - "on REGISTER: broadcast_school_id / broadcast_start_at / broadcast_end_at pinned; broadcast_status NONE -> SCHEDULED"
      - "on GO_LIVE: broadcast_status SCHEDULED -> LIVE; on RESUME: SUSPENDED -> LIVE (blocked at 3 strikes); on END: LIVE or SUSPENDED -> ENDED"
      - "increments Match.version by 1"

  # ---- FairPlayCase ---------------------------------------------------------
  - method: POST
    path: "/fair-play-cases"
    description: "Open a fair-play case against a team, naming either a student (account sharing, smurfing, cheat detection) or a match broadcast (spectator conduct)"
    roles: [IntegrityOfficer, LeagueAdmin, Coach]
    code: 201
    input: ["team_id", "subject_type", "case_type", "evidence_ref", "subject_student_id?", "subject_match_id?"]
    output: FairPlayCase
    side_effects: ["status initialised to REPORTED; reported_by_user_id = X-User-ID"]

  - method: GET
    path: "/fair-play-cases/{caseId}"
    description: Read one fair-play case including severity_weight, repeat_index, applied_penalty and sanction_type
    roles: [LeagueAdmin, DistrictAdmin, AthleticDirector, Coach, IntegrityOfficer]
    code: 200
    input: []
    output: FairPlayCase
    side_effects: []

  - method: GET
    path: "/fair-play-cases"
    description: List fair-play cases; FK reverse lookup for team_id, subject_student_id and subject_match_id
    roles: [LeagueAdmin, DistrictAdmin, AthleticDirector, Coach, IntegrityOfficer]
    code: 200
    input: ["team_id?", "subject_student_id?", "subject_match_id?", "status?", "case_type?", "limit?", "offset?"]
    output: FairPlayCase[]
    side_effects: []

  - method: POST
    path: "/fair-play-cases/{caseId}/investigate"
    description: Integrity officer takes the case, recording themselves as investigator
    roles: [IntegrityOfficer]
    code: 200
    input: ["investigation_note?"]
    output: FairPlayCase
    side_effects: ["status REPORTED -> INVESTIGATING; investigator_user_id = X-User-ID", "increments FairPlayCase.version by 1"]

  - method: POST
    path: "/fair-play-cases/{caseId}/decision"
    description: "Sustain (severity required) or dismiss (severity forbidden) the case. Sustaining drives the five-link sanction cascade."
    roles: [IntegrityOfficer]
    code: 200
    input: ["decision", "severity?", "decision_note?"]
    output: FairPlayCase
    side_effects:
      - "on SUSTAIN: severity, severity_weight, repeat_index, applied_penalty computed; Team.integrity_score recomputed; sanction_type selected; Student.fair_play_status -> SANCTIONED and its ACTIVE slots -> INELIGIBLE; Team may drop COMPETING -> SUSPENDED; its SCHEDULED / SERVER_READY matches -> FORFEITED"
      - "on SUSTAIN with subject_type MATCH_BROADCAST: Match.broadcast_status LIVE -> SUSPENDED and spectator_strikes += 1"
      - "on DISMISS: decider_user_id and decided_at recorded and nothing else changes"
      - "increments FairPlayCase.version by 1"

  - method: POST
    path: "/fair-play-cases/{caseId}/appeal"
    description: The charged team's coach appeals a sustained case; sanctions stay in force while the appeal is pending
    roles: [Coach]
    code: 200
    input: [appeal_grounds]
    output: FairPlayCase
    side_effects: ["status SUSTAINED -> APPEALED; appeal_grounds stored", "increments FairPlayCase.version by 1"]

  - method: POST
    path: "/fair-play-cases/{caseId}/appeal-decision"
    description: "Independent officer decides the appeal: decision = AFFIRM | OVERTURN. OVERTURN drives the five-link compensation cascade."
    roles: [IntegrityOfficer]
    code: 200
    input: ["decision", "appeal_note?"]
    output: FairPlayCase
    side_effects:
      - "on AFFIRM: status -> SUSTAINED_FINAL; the case stays in the sustained set so integrity_score is unchanged; a DISQUALIFICATION sanction moves the Team to DISQUALIFIED"
      - "on OVERTURN: status -> OVERTURNED; the case leaves the sustained set so Team.integrity_score is recomputed and every later case's repeat_index shifts down; Student.fair_play_status -> CLEAR; FAIR_PLAY-ineligible slots -> ACTIVE; Team SUSPENDED -> COMPETING; suspension-forfeited matches restored with their 3-point awards reverted"
      - "appeal_decider_user_id = X-User-ID; increments FairPlayCase.version by 1"

  # ---- Test-driving endpoint (last resort, §1.5 priority ladder rung 3) ------
  - method: POST
    path: "/_clock/set_current_utc"
    description: "Set the server's logical clock, which every temporal rule in this scaffold reads. The startup default is exactly 2026-08-01T00:00:00.000Z and the real wall clock is never consulted. The clock only moves forward."
    roles: [LeagueAdmin]
    code: 200
    input: [current_utc]
    output: null
    side_effects: ["all subsequent window, deadline, expiry and days_clean evaluations use the new value"]

# ---------------------------------------------------------------------------
# §1.6 Error Code Catalog
# ---------------------------------------------------------------------------
errors:

  # -- auth / authorization ---------------------------------------------------
  - id: ERR_UNAUTHENTICATED
    http: 401
    condition: "X-User-Role or X-User-ID header missing, or X-User-Role is not one of the seven declared roles"
  - id: ERR_UNAUTHORIZED
    http: 403
    condition: "the acting role is not listed in the target endpoint's roles"
  - id: ERR_NOT_RESOURCE_OWNER
    http: 403
    condition: "an entity_backed role acts on a resource it does not own (Coach on another coach's team, AthleticDirector on another school, DistrictAdmin on another district)"
  - id: ERR_SEGREGATION_OF_DUTIES
    http: 409
    condition: "the same X-User-ID would perform both roster verification axes, or would decide an appeal it investigated or already decided"

  # -- existence --------------------------------------------------------------
  - id: ERR_DISTRICT_NOT_FOUND
    http: 404
    condition: "district id in the path or body does not resolve"
  - id: ERR_SCHOOL_NOT_FOUND
    http: 404
    condition: "school id in the path or body does not resolve"
  - id: ERR_COACH_NOT_FOUND
    http: 404
    condition: "coach id in the path or body does not resolve"
  - id: ERR_STUDENT_NOT_FOUND
    http: 404
    condition: "student id in the path or body does not resolve"
  - id: ERR_TITLE_NOT_FOUND
    http: 404
    condition: "title id in the path or body does not resolve"
  - id: ERR_TITLE_APPROVAL_NOT_FOUND
    http: 404
    condition: "title approval id in the path does not resolve"
  - id: ERR_SEASON_NOT_FOUND
    http: 404
    condition: "season id in the path or body does not resolve"
  - id: ERR_TEAM_NOT_FOUND
    http: 404
    condition: "team id in the path or body does not resolve"
  - id: ERR_ROSTER_SLOT_NOT_FOUND
    http: 404
    condition: "roster slot id in the path does not resolve"
  - id: ERR_MATCH_NOT_FOUND
    http: 404
    condition: "match id in the path or body does not resolve"
  - id: ERR_FAIR_PLAY_CASE_NOT_FOUND
    http: 404
    condition: "fair play case id in the path does not resolve"

  # -- request shape ----------------------------------------------------------
  - id: ERR_INVALID_REQUEST
    http: 400
    condition: "required field missing, enum outside its set, number outside its range, malformed date or datetime, pagination limit outside 1..100, or an action-conditional field present when forbidden / absent when required"
  - id: ERR_INVALID_GPA_THRESHOLDS
    http: 422
    condition: "District.probation_gpa_floor exceeds District.min_gpa"
  - id: ERR_SELF_MATCH_FORBIDDEN
    http: 422
    condition: "a match names the same team as home and away"
  - id: ERR_SUBJECT_REFERENCE_MISMATCH
    http: 422
    condition: "FairPlayCase.subject_type does not agree with which of subject_student_id / subject_match_id was supplied"

  # -- optimistic concurrency -------------------------------------------------
  - id: ERR_STALE_VERSION
    http: 412
    condition: "expected_match_version != Match.version on a result report, or expected_student_version != Student.version on an academic posting (§1.2.1)"

  # -- state ------------------------------------------------------------------
  - id: ERR_INVALID_SEASON_STAGE
    http: 409
    condition: "the season is not in a stage that permits the operation, or a compound child precondition fails (fewer than two ROSTER_LOCKED teams, or a match still unplayed at COMPLETE)"
  - id: ERR_SEASON_SEEDING_NOT_CURRENT
    http: 409
    condition: "REGULAR_SEASON -> PLAYOFFS attempted while Season.seeding_state is UNSEEDED or STALE"
  - id: ERR_INVALID_TEAM_STATE
    http: 409
    condition: "the team is not in a legal from-state for register, roster-lock or withdraw"
  - id: ERR_ROSTER_LOCKED
    http: 409
    condition: "a roster mutation or verification was attempted while Team.status is not DRAFT or REGISTERED"
  - id: ERR_ROSTER_SLOT_RELEASED
    http: 409
    condition: "an operation targeted a RosterSlot already in the terminal RELEASED state"
  - id: ERR_INVALID_MATCH_STATE
    http: 409
    condition: "the match's play_status or result_status does not permit server-config, reporting, finalize, forfeit, dispute filing or go-live"
  - id: ERR_INVALID_DISPUTE_STATE
    http: 409
    condition: "the dispute dimension is not in a legal from-state for the requested dispute action, or a dispute already exists on the match"
  - id: ERR_INVALID_BROADCAST_STATE
    http: 409
    condition: "the broadcast dimension is not in a legal from-state for the requested action, or RESUME was attempted at 3 spectator strikes"
  - id: ERR_INVALID_CASE_STATE
    http: 409
    condition: "the fair-play case is not in a legal from-state for investigate, decision, appeal or appeal-decision"
  - id: ERR_INVALID_APPROVAL_STATE
    http: 409
    condition: "APPROVE or DENY attempted on a non-PENDING approval, or REVOKE on a non-APPROVED one"

  # -- business_safety --------------------------------------------------------
  - id: ERR_COACH_NOT_CERTIFIED
    http: 409
    condition: "the team's coach is PENDING or SUSPENDED rather than CERTIFIED"
  - id: ERR_COACH_BACKGROUND_CHECK_EXPIRED
    http: 409
    condition: "Coach.background_check_expires_on is earlier than the logical clock's date (an expiry equal to today still clears)"
  - id: ERR_STUDENT_NOT_ENROLLED
    http: 422
    condition: "the student's enrollment_status is WITHDRAWN or GRADUATED"
  - id: ERR_ENROLLMENT_CERTIFICATION_LAPSED
    http: 422
    condition: "the school's enrollment_verified_through date is earlier than the logical clock's date"
  - id: ERR_BIRTHDATE_DOCUMENT_MISMATCH
    http: 422
    condition: "verified_birthdate on the registrar document differs from Student.birthdate"
  - id: ERR_STUDENT_BELOW_TITLE_MIN_AGE
    http: 422
    condition: "age at the season cutoff is below the title's publisher min_player_age"
  - id: ERR_STUDENT_OVER_AGE_LIMIT
    http: 422
    condition: "age at the season cutoff is at or above Season.max_age"
  - id: ERR_ACADEMIC_STANDING_INELIGIBLE
    http: 422
    condition: "no academic term has been posted, or the evaluated standing is INELIGIBLE"
  - id: ERR_PROBATION_STARTER_RESTRICTED
    http: 422
    condition: "a PROBATION student was verified for a STARTER slot (SUB slots are permitted)"
  - id: ERR_STUDENT_FAIR_PLAY_SANCTIONED
    http: 409
    condition: "the student's fair_play_status is SANCTIONED"
  - id: ERR_TITLE_AGE_RATING_EXCEEDS_DISTRICT_CEILING
    http: 422
    condition: "the title's ESRB ordinal exceeds the district's max_age_rating ordinal"
  - id: ERR_TITLE_NOT_DISTRICT_APPROVED
    http: 409
    condition: "no APPROVED TitleApproval links the team's district to the team's title (a PENDING, DENIED or REVOKED approval does not qualify)"

  # -- business_referential ---------------------------------------------------
  - id: ERR_STUDENT_SCHOOL_MISMATCH
    http: 422
    condition: "the student is enrolled at a different school than the team"
  - id: ERR_COACH_SCHOOL_MISMATCH
    http: 422
    condition: "the designated coach belongs to a different school than the team"
  - id: ERR_TEAM_TITLE_MISMATCH
    http: 422
    condition: "the team's title_id differs from the season's title_id"
  - id: ERR_TEAM_SEASON_MISMATCH
    http: 422
    condition: "a match participant belongs to a different season than the match"
  - id: ERR_TEAM_NOT_MATCH_PARTICIPANT
    http: 422
    condition: "the reporting, filing or forfeiting team is neither the home nor the away side"
  - id: ERR_BROADCAST_SCHOOL_MISMATCH
    http: 422
    condition: "broadcast_school_id is not the school of the requesting coach's participating team"
  - id: ERR_SUBJECT_TEAM_MISMATCH
    http: 422
    condition: "the named student holds no non-RELEASED slot on the charged team, or the named match does not involve the charged team"
  - id: ERR_STUDENT_NOT_ON_TEAM
    http: 422
    condition: "the nominated student holds no non-RELEASED roster slot on nominating_team_id"

  # -- business_temporal ------------------------------------------------------
  - id: ERR_REGISTRATION_WINDOW_CLOSED
    http: 409
    condition: "the logical clock is before registration_opens_at or after registration_closes_at (both bounds inclusive)"
  - id: ERR_ROSTER_LOCK_DEADLINE_PASSED
    http: 409
    condition: "the logical clock is past Season.roster_lock_at (locking at the exact deadline millisecond still succeeds)"
  - id: ERR_MATCH_OUTSIDE_SEASON_WINDOW
    http: 409
    condition: "the match would start before roster_lock_at or end after regular_season_end_at"
  - id: ERR_SERVER_POOL_CAPACITY_EXCEEDED
    http: 409
    condition: "the half-open match interval would push concurrent occupancy of the title's server pool above server_pool_capacity (adjacency at an exact endpoint is legal)"
  - id: ERR_BROADCAST_CHANNEL_CONFLICT
    http: 409
    condition: "the buffer-expanded closed broadcast interval touches or overlaps another live claim on the same school channel beyond concurrent_broadcast_capacity"
  - id: ERR_DISPUTE_WINDOW_CLOSED
    http: 409
    condition: "the logical clock is past Match.dispute_deadline_at (filing at the exact deadline millisecond still succeeds)"
  - id: ERR_RECRUITING_DEAD_PERIOD
    http: 409
    condition: "the logical clock falls inside the district's closed recruiting dead period"
  - id: ERR_CLOCK_REWIND_FORBIDDEN
    http: 409
    condition: "the requested logical clock value is earlier than the current one"

  # -- business_constraint ----------------------------------------------------
  - id: ERR_DUPLICATE_NCES_CODE
    http: 409
    condition: "another school in the same district already uses this nces_code"
  - id: ERR_DUPLICATE_TITLE_NAME
    http: 409
    condition: "a title with this name already exists"
  - id: ERR_DUPLICATE_TEAM_NAME
    http: 409
    condition: "another team in the same season already uses this name"
  - id: ERR_DUPLICATE_TITLE_APPROVAL
    http: 409
    condition: "a PENDING or APPROVED approval already links this district and title"
  - id: ERR_DUPLICATE_ROSTER_SLOT
    http: 409
    condition: "the student already holds a non-RELEASED slot on this team"
  - id: ERR_STARTER_CAPACITY_EXCEEDED
    http: 409
    condition: "the team already holds Season.max_starters STARTER slots (starter_slots_available is 0)"
  - id: ERR_ROSTER_MINIMUM_NOT_MET
    http: 422
    condition: "the team's active_starter_count is below Season.min_starters at registration or roster lock"
  - id: ERR_ALREADY_NOMINATED
    http: 409
    condition: "the student's showcase_status is already NOMINATED"
  - id: ERR_SHOWCASE_NOT_NOMINATED
    http: 409
    condition: "a recruiting contact was logged against a student who is not on the showcase pathway"
  - id: ERR_RECRUITING_CONTACT_CAP_EXCEEDED
    http: 409
    condition: "the student already has recruiting_contact_cap_per_window contacts inside the half-open rolling window"
  - id: ERR_SEED_ORDER_EMPTY
    http: 422
    condition: "a seeding run found no team in COMPETING, SUSPENDED, PLAYOFF_SEEDED or ELIMINATED"

  # -- business_fiscal --------------------------------------------------------
  - id: ERR_SUBSIDY_POOL_EXHAUSTED
    http: 402
    condition: "the district's remaining subsidy_pool_cents is smaller than the subsidy this registration would grant"

# ---------------------------------------------------------------------------
# §1.7 RBAC Matrix
# ---------------------------------------------------------------------------
roles:
  - name: LeagueAdmin
    description: League operations — titles, seasons, scheduling, seeding, adjudication and the logical clock
    identity: opaque
    exclusive_operations:
      - "POST /districts"
      - "POST /titles"
      - "POST /seasons"
      - "POST /seasons/{seasonId}/advance"
      - "POST /seasons/{seasonId}/seeding"
      - "POST /matches"
      - "POST /matches/{matchId}/server-config"
      - "POST /matches/{matchId}/finalize"
      - "POST /matches/{matchId}/forfeit"
      - "POST /matches/{matchId}/dispute-actions"
      - "POST /students/{studentId}/showcase-nomination"
      - "POST /_clock/set_current_utc"
    shared_operations:
      - "POST /schools (with DistrictAdmin)"
      - "POST /coaches and POST /coaches/{coachId}/certification (with AthleticDirector)"
      - "POST /students (with AthleticDirector, EligibilityOfficer)"
      - "POST /students/{studentId}/academic-postings (with EligibilityOfficer)"
      - "POST /title-approvals (with AthleticDirector)"
      - "POST /fair-play-cases (with IntegrityOfficer, Coach)"
      - "every GET"

  - name: DistrictAdmin
    description: District authority over title approvals and district-level policy; X-User-ID is the District id
    identity: "entity_backed:District"
    exclusive_operations:
      - "POST /title-approvals/{approvalId}/decision"
    shared_operations:
      - "POST /schools (with LeagueAdmin)"
      - "read access to districts, schools, coaches, students, seasons, teams, roster slots, matches and fair-play cases"

  - name: AthleticDirector
    description: School athletics office — coach designation and certification, student records, approval requests and team withdrawal; X-User-ID is the School id
    identity: "entity_backed:School"
    exclusive_operations:
      - "POST /teams/{teamId}/withdraw"
    shared_operations:
      - "POST /coaches and POST /coaches/{coachId}/certification (with LeagueAdmin)"
      - "POST /students (with LeagueAdmin, EligibilityOfficer)"
      - "POST /title-approvals (with LeagueAdmin)"
      - "POST /teams (with Coach)"
      - "read access to schools, coaches, students, seasons, teams, roster slots, matches and fair-play cases"

  - name: Coach
    description: Team coach — roster building, registration, roster lock, result reporting, disputes, broadcast control and appeals; X-User-ID is the Coach id
    identity: "entity_backed:Coach"
    exclusive_operations:
      - "POST /teams/{teamId}/register"
      - "POST /teams/{teamId}/roster-lock"
      - "POST /roster-slots"
      - "POST /roster-slots/{slotId}/release"
      - "POST /matches/{matchId}/result-reports"
      - "POST /matches/{matchId}/disputes"
      - "POST /matches/{matchId}/broadcast"
      - "POST /fair-play-cases/{caseId}/appeal"
    shared_operations:
      - "POST /teams (with AthleticDirector)"
      - "POST /fair-play-cases (with LeagueAdmin, IntegrityOfficer)"
      - "read access to titles, seasons, teams, roster slots, matches and fair-play cases"

  - name: EligibilityOfficer
    description: Independent eligibility desk — the two-person roster verification and academic postings; X-User-ID is an opaque officer id
    identity: opaque
    exclusive_operations:
      - "POST /roster-slots/{slotId}/verify-enrollment"
      - "POST /roster-slots/{slotId}/verify-academics"
    shared_operations:
      - "POST /students (with LeagueAdmin, AthleticDirector)"
      - "POST /students/{studentId}/academic-postings (with LeagueAdmin)"
      - "read access to districts, schools, coaches, students, titles, seasons, teams, roster slots and matches"

  - name: IntegrityOfficer
    description: Fair-play investigation and adjudication, including the independent appeal decision; X-User-ID is an opaque officer id
    identity: opaque
    exclusive_operations:
      - "POST /fair-play-cases/{caseId}/investigate"
      - "POST /fair-play-cases/{caseId}/decision"
      - "POST /fair-play-cases/{caseId}/appeal-decision"
    shared_operations:
      - "POST /fair-play-cases (with LeagueAdmin, Coach)"
      - "read access to districts, schools, coaches, students, titles, seasons, teams, roster slots, matches and fair-play cases"

  - name: Recruiter
    description: College recruiter permitted to log contacts with showcase-nominated students only; X-User-ID is an opaque recruiter id
    identity: opaque
    exclusive_operations:
      - "POST /students/{studentId}/recruiting-contacts"
    shared_operations:
      - "read access to districts, schools, students, seasons and teams"

rbac_notes:
  segregation_of_duties: |
    Two independent X-User-ID separations are enforced, both inside the
    EligibilityOfficer / IntegrityOfficer opaque-identity space:
      1. RosterSlot: the officer who calls verify-academics MUST NOT be the officer
         recorded in enrollment_verified_by_user_id.
      2. FairPlayCase: the officer who calls appeal-decision MUST NOT be the
         investigator_user_id or the decider_user_id of the same case.
    Both raise ERR_SEGREGATION_OF_DUTIES (409) at §1.4 priorities 22 and 23.
  ownership: |
    Coach ownership is checked against the governing Team.coach_id, resolved through
    RosterSlot.team_id, Match.home_team_id / away_team_id and FairPlayCase.team_id as
    appropriate. AthleticDirector ownership is checked against the governing School.id
    and DistrictAdmin ownership against the governing District.id.
