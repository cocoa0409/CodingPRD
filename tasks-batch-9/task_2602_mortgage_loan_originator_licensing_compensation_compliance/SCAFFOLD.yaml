scenario: |
  2602. Mortgage Loan Originator Licensing & Compensation Compliance (mortgage lender compliance
  office): originator licensing and registration status verification with continuing education and
  renewal windows, sponsorship transfer and state-by-state authority before taking applications,
  compensation plan design prohibiting terms-based pay with permissible variables, dual compensation
  and steering prohibition monitoring, pricing exception and concession policy with documented
  justification, compensation reconciliation to closed loans with clawback on early payoff,
  advertising and license number disclosure requirements, examination response and unlicensed
  activity investigations

domain_name: mlo-licensing-compensation-compliance

# Flat topology: every aggregate is a peer top-level collection joined by foreign keys.
# There is no single owning root resource, so the prefix is empty and each entity's
# collection segment IS its top-level path (e.g. /originators, /compensation-plans).
api_prefix: ""

response_envelope:
  success: |
    { "meta": { "api_request_id": "req_xxx", "api_request_timestamp": "ISO8601" },
      "response_type": "object" | "array", "data": {} }
  error: |
    { "meta": { ... }, "response_type": "error",
      "data": { "error_id": "ERR_XXX", "message": "..." } }
  pagination_fields: ["limit", "offset", "total_count", "has_more"]
  pagination_defaults: { limit: 10, min: 1, max: 100, offset: 0 }

complexity_profile:
  primary_archetype: compliance_audit
  secondary_archetype: ledger_reconciliation
  complexity_layers:
    - dual_variant_calculation
    - cascading_side_effects
    - rate_threshold_triggers
    - optimistic_concurrency
    - ops_run_checkpoint

  entity_topology: flat
  # Peer aggregates (Originator, LicenseRegistration, CompensationPlan, LoanApplication,
  # PricingException, CompensationRecord, Advertisement, ExaminationInquiry,
  # UnlicensedActivityInvestigation) linked purely by FK fields. Only CompensationVariable
  # is addressed as a sub-resource, because a variable has no meaning outside its plan.

  state_machine_shape: cyclic
  # LicenseRegistration is cyclic (ACTIVE -> RENEWAL_PENDING -> ACTIVE, EXPIRED -> ACTIVE via
  # reinstatement); ExaminationInquiry is cyclic (RESPONSE_SUBMITTED -> INFO_REQUESTED ->
  # RESPONSE_SUBMITTED, unbounded rounds); PricingException is branching fork-join
  # (SUBMITTED -> {APPROVED, DENIED} with divergent side-effect sets); LoanApplication carries
  # two independent state dimensions (status x compensation_status) on the same row.

  relationship_patterns:
    - one_to_many          # Originator -> LicenseRegistration, LoanApplication, CeCreditRecord
    - many_to_many         # Originator x state authority, realised through LicenseRegistration
                           # rows plus SponsorshipTransfer intervals per (originator, state)
    - cross_aggregate      # CompensationRecord references LoanApplication, Originator and
                           # CompensationPlan across three aggregate boundaries
    - polymorphic          # AuditEvent.subject_type + AuditEvent.subject_ref address any entity

  role_model: segregation_of_duties
  # A CompensationPlan may not be approved by the same X-User-ID that drafted it; a
  # PricingException may not be decided by the Originator who requested it; an
  # UnlicensedActivityInvestigation finding may not be entered by the LicensingAnalyst
  # X-User-ID that created the LicenseRegistration under investigation.

  consistency_model: immediate

  difficulty_level: beyond_expert
  # 14 entities / 68 endpoints / 39 error codes / 8 calculations (3 with divergent variants) /
  # 9 state machines (7 non-linear) / 38 priority-ordered validations / 2 OCC races / 7 roles.

# =============================================================================
# 1.1 Entity-Relationship Table
# =============================================================================
entities:

  - name: Originator
    parent: null
    common_fields: true
    fields:
      - name: nmls_unique_id
        type: string
        source: input
        description: NMLS unique identifier printed on every advertisement and disclosure.
        constraints: "required; exactly 6-8 decimal digits; globally unique across Originator"
      - name: legal_name
        type: string
        source: input
        description: Individual originator legal name as filed with NMLS.
        constraints: "required; 1..120 chars"
      - name: hire_date
        type: datetime
        source: input
        description: Date the institution employed the originator; ISO 8601 UTC.
        constraints: "required"
      - name: employment_status
        type: enum
        source: input
        description: Employment posture with the sponsoring institution.
        default: EMPLOYED
        constraints: "EMPLOYED | SUSPENDED | TERMINATED"
      - name: compensation_plan_id
        type: string
        source: system
        description: "FK -> CompensationPlan.id; the plan whose assignment interval covers the
          logical clock instant, or null when no assignment covers it. Written only by
          POST /originators/{id}/compensation-plan-assignments and by assignment expiry during
          POST /_ops/daily-license-sweep."
        default: null
      - name: monitoring_status
        type: enum
        source: computed
        description: "Steering / dual-compensation monitoring posture, recomputed by
          calculations.dual_comp_steering_exposure_score. STANDARD while score < 60,
          ELEVATED while score >= 60."
        default: STANDARD
        constraints: "STANDARD | ELEVATED"
      - name: exposure_score
        type: integer
        source: computed
        description: "Output of calculations.dual_comp_steering_exposure_score, 0..100 inclusive."
        default: 0
        constraints: "0 <= exposure_score <= 100"
      - name: lifetime_accrued_cents
        type: integer
        source: computed
        description: "Conserved-quantity ledger: sum of CompensationRecord.accrued_cents over every
          CompensationRecord with originator_id = this Originator, all statuses included."
        default: 0
      - name: lifetime_clawed_back_cents
        type: integer
        source: computed
        description: "Conserved-quantity ledger: sum of CompensationRecord.clawback_cents over
          every CompensationRecord with originator_id = this Originator, all statuses included."
        default: 0
      - name: net_compensation_cents
        type: integer
        source: computed
        description: "Derived ledger balance, pinned as
          lifetime_accrued_cents - lifetime_clawed_back_cents. Never written directly."
        default: 0
      - name: authorized_state_codes
        type: array
        source: computed
        description: "Sorted-ascending list of two-letter state codes in which this originator
          currently holds authority; membership rule is pinned in
          calculations.state_authority_resolution."
        default: []
      - name: open_investigation_count
        type: integer
        source: computed
        description: "Count of UnlicensedActivityInvestigation rows with originator_id = this
          Originator and status IN {OPEN, SUBSTANTIATED}."
        default: 0

  - name: LicenseRegistration
    parent: null
    common_fields: true
    fields:
      - name: originator_id
        type: string
        source: input
        description: "FK -> Originator.id; the individual holding this state licence."
        constraints: "required; referenced Originator must exist"
      - name: state_code
        type: string
        source: input
        description: Two-letter USPS state code the licence grants authority in.
        constraints: "required; uppercase A-Z{2}; unique per (originator_id, state_code) across
          LicenseRegistration rows whose status IN {PENDING, ACTIVE, RENEWAL_PENDING, EXPIRED}"
      - name: license_number
        type: string
        source: input
        description: State-issued licence number quoted in advertising disclosures.
        constraints: "required; 4..32 chars"
      - name: issue_date
        type: datetime
        source: input
        description: Date the state issued the licence; ISO 8601 UTC.
        constraints: "required"
      - name: expiration_date
        type: datetime
        source: input
        description: Instant at which authority lapses unless renewal completes; ISO 8601 UTC.
        constraints: "required; must be strictly after issue_date"
      - name: renewal_window_opens_at
        type: datetime
        source: input
        description: Earliest instant a renewal request may be filed; ISO 8601 UTC.
        constraints: "required; must be strictly before expiration_date"
      - name: status
        type: enum
        source: computed
        description: "Licence lifecycle state; see state_machines.LicenseRegistration."
        default: PENDING
        constraints: "PENDING | ACTIVE | RENEWAL_PENDING | EXPIRED | SURRENDERED | REVOKED"
      - name: authority_effective_at
        type: datetime
        source: computed
        description: "Instant authority began: stamped from the logical clock when status first
          becomes ACTIVE, and re-stamped on every PENDING/EXPIRED -> ACTIVE transition. Null while
          status = PENDING."
        default: null
      - name: required_ce_hours
        type: integer
        source: input
        description: Total continuing-education hours this state demands per reporting period.
        default: 8
        constraints: "8 <= required_ce_hours <= 20"
      - name: ce_hours_applied
        type: integer
        source: computed
        description: "Conserved-quantity ledger: sum of CeCreditRecord.credit_hours over credits
          with originator_id = this licence's originator_id, credit_status = APPLIED, and
          attributed_year = ce_reporting_year, minus successive-year exclusions per
          calculations.ce_compliance_evaluation."
        default: 0
      - name: ce_reporting_year
        type: integer
        source: input
        description: Calendar year whose CE credits satisfy the next renewal.
        constraints: "required; 2020..2100"
      - name: ce_satisfied
        type: boolean
        source: computed
        description: "True when calculations.ce_compliance_evaluation reports every category
          minimum and the total minimum met for ce_reporting_year."
        default: false
      - name: active_sponsoring_institution_code
        type: string
        source: computed
        description: "Denormalised copy of sponsoring_institution_code taken from the
          SponsorshipTransfer row whose license_registration_id = this licence and status = ACTIVE;
          null when the licence is unsponsored. Not a foreign key - the owning direction is
          SponsorshipTransfer.license_registration_id."
        default: null
      - name: active_sponsorship_effective_at
        type: datetime
        source: computed
        description: "Denormalised copy of effective_at from the same ACTIVE SponsorshipTransfer
          row; null when the licence is unsponsored."
        default: null
      - name: reinstatement_count
        type: integer
        source: computed
        description: Number of EXPIRED -> ACTIVE reinstatements applied to this licence.
        default: 0

  - name: SponsorshipTransfer
    parent: null
    common_fields: true
    fields:
      - name: license_registration_id
        type: string
        source: input
        description: "FK -> LicenseRegistration.id; the licence whose sponsorship this row occupies."
        constraints: "required"
      - name: sponsoring_institution_code
        type: string
        source: input
        description: Institution NMLS company code claiming sponsorship.
        constraints: "required; 4..12 chars"
      - name: effective_at
        type: datetime
        source: input
        description: Inclusive start of the sponsorship interval; ISO 8601 UTC.
        constraints: "required"
      - name: relinquished_at
        type: datetime
        source: computed
        description: "Exclusive end of the sponsorship interval; null while status = ACTIVE.
          Stamped from the logical clock on RELINQUISHED and on cascaded relinquishment."
        default: null
      - name: status
        type: enum
        source: computed
        description: "Sponsorship lifecycle state; see state_machines.SponsorshipTransfer."
        default: ACTIVE
        constraints: "ACTIVE | RELINQUISHED | SUPERSEDED"
      - name: superseded_by_created_at
        type: datetime
        source: computed
        description: "created_at of the SponsorshipTransfer that superseded this one, or null.
          Used instead of an id so ordering decisions never read a random identifier."
        default: null

  - name: CeCourse
    parent: null
    common_fields: true
    fields:
      - name: course_code
        type: string
        source: input
        description: NMLS-approved course catalogue code.
        constraints: "required; globally unique across CeCourse; 4..24 chars"
      - name: credit_hours
        type: integer
        source: input
        description: Hours awarded for completing this course exactly once.
        constraints: "required; 1 <= credit_hours <= 12"
      - name: category
        type: enum
        source: input
        description: CE content category the hours count toward.
        constraints: "required; FEDERAL_LAW | ETHICS | NONTRADITIONAL | STATE_SPECIFIC | ELECTIVE"
      - name: approved_state_codes
        type: array
        source: input
        description: "Two-letter state codes whose regulator accepts this course. An empty array
          means the course is accepted in every state."
        default: []
      - name: successive_year_blocked
        type: boolean
        source: input
        description: "When true, the same course_code may not be applied in two consecutive
          attributed_year values for one originator (NMLS successive-years rule)."
        default: true
      - name: provider_status
        type: enum
        source: computed
        description: "Provider standing; APPROVED at creation, RESCINDED after
          POST /ce-courses/{id}/rescind, which voids every credit already applied from it."
        default: APPROVED
        constraints: "APPROVED | RESCINDED"

  - name: CeCreditRecord
    parent: null
    common_fields: true
    fields:
      - name: originator_id
        type: string
        source: input
        description: "FK -> Originator.id; the originator who completed the course."
        constraints: "required"
      - name: ce_course_id
        type: string
        source: input
        description: "FK -> CeCourse.id; the approved course completed."
        constraints: "required"
      - name: completion_date
        type: datetime
        source: input
        description: Instant the originator completed the course; ISO 8601 UTC.
        constraints: "required; must not be after the logical clock instant"
      - name: reporting_period_year
        type: integer
        source: input
        description: "Reporting year the originator claims the hours against. Ignored unless
          is_makeup = true, in which case it becomes attributed_year."
        constraints: "required; 2020..2100"
      - name: is_makeup
        type: boolean
        source: input
        description: "True when the credit is filed as late make-up CE for a prior reporting year."
        default: false
      - name: credit_hours
        type: integer
        source: computed
        description: "Copied from CeCourse.credit_hours at creation; input value for this field is
          ignored if supplied."
      - name: category
        type: enum
        source: computed
        description: "Copied from CeCourse.category at creation."
        constraints: "FEDERAL_LAW | ETHICS | NONTRADITIONAL | STATE_SPECIFIC | ELECTIVE"
      - name: attributed_year
        type: integer
        source: computed
        description: "Reporting year the hours land in, pinned by
          calculations.ce_compliance_evaluation attribution variants: calendar year of
          completion_date when is_makeup = false, reporting_period_year when is_makeup = true."
      - name: credit_status
        type: enum
        source: computed
        description: "APPLIED while the hours count; EXCLUDED_SUCCESSIVE_YEAR when suppressed by
          the successive-years rule; VOIDED after an explicit void or a provider rescission."
        default: APPLIED
        constraints: "APPLIED | EXCLUDED_SUCCESSIVE_YEAR | VOIDED"
      - name: void_reason
        type: enum
        source: computed
        description: "Reason the credit moved to VOIDED, or null while credit_status != VOIDED."
        default: null
        constraints: "null | ANALYST_VOID | PROVIDER_RESCINDED"

  - name: CompensationPlan
    parent: null
    common_fields: true
    fields:
      - name: plan_name
        type: string
        source: input
        description: Human-readable plan label used in examination responses.
        constraints: "required; 1..80 chars"
      - name: drafted_by_user_id
        type: string
        source: system
        description: "X-User-ID of the CompensationDesigner that created the plan; the
          segregation-of-duties check compares the approver's X-User-ID against this value."
      - name: approved_by_user_id
        type: string
        source: computed
        description: "X-User-ID of the ComplianceOfficer that approved or rejected the plan; null
          while status = DRAFT."
        default: null
      - name: base_basis_points
        type: integer
        source: input
        description: Base originator commission in basis points of the funded loan amount.
        constraints: "required; 0 <= base_basis_points <= 275"
      - name: min_fee_cents
        type: integer
        source: input
        description: Per-loan commission floor in cents applied after the basis-point computation.
        constraints: "required; 0 <= min_fee_cents"
      - name: max_fee_cents
        type: integer
        source: input
        description: Per-loan commission ceiling in cents applied after the basis-point computation.
        constraints: "required; must be >= min_fee_cents"
      - name: salary_cents_per_period
        type: integer
        source: input
        description: Fixed non-loan-dependent salary component paid per reporting period.
        default: 0
        constraints: "0 <= salary_cents_per_period"
      - name: volume_tier_enabled
        type: boolean
        source: input
        description: "When true, calculations.volume_tier_bps_selection contributes a basis-point
          adder; when false the adder is fixed at 0."
        default: false
      - name: concession_absorption_enabled
        type: boolean
        source: input
        description: "When true, approved pricing concessions reduce originator commission per
          calculations.pricing_exception_net_impact; when false a concession never touches
          commission and PricingException.comp_impact_cents is always 0."
        default: false
      - name: status
        type: enum
        source: computed
        description: "Plan lifecycle state; see state_machines.CompensationPlan."
        default: DRAFT
        constraints: "DRAFT | ACTIVE | REJECTED | SUPERSEDED"
      - name: prohibited_variable_count
        type: integer
        source: computed
        description: "Count of CompensationVariable children of this plan whose permissibility =
          PROHIBITED. A plan cannot leave DRAFT while this is greater than 0."
        default: 0
      - name: assignment_effective_from
        type: datetime
        source: computed
        description: "Inclusive start of the assignment interval written by
          POST /originators/{id}/compensation-plan-assignments; null while unassigned."
        default: null
      - name: assignment_effective_to
        type: datetime
        source: computed
        description: "Inclusive end of the assignment interval written by the same endpoint; null
          while unassigned."
        default: null
      - name: assigned_originator_id
        type: string
        source: computed
        description: "FK -> Originator.id; the originator this plan is assigned to, or null while
          unassigned. A plan is assignable to at most one originator."
        default: null

  - name: CompensationVariable
    parent: CompensationPlan
    common_fields: true
    fields:
      - name: compensation_plan_id
        type: string
        source: input
        description: "FK -> CompensationPlan.id; the plan this variable belongs to."
        constraints: "required; taken from the path segment"
      - name: variable_type
        type: enum
        source: input
        description: "The pay variable the designer wants to key compensation on."
        constraints: "required; LOAN_VOLUME_UNITS | LOAN_VOLUME_DOLLARS | PERCENTAGE_OF_LOAN_AMOUNT
          | HOURS_WORKED | FILE_QUALITY_SCORE | EXISTING_BORROWER_FLAG | INTEREST_RATE | APR
          | LOAN_TERM_MONTHS | LTV_RATIO | CREDIT_SCORE | PRODUCT_TYPE | PREPAYMENT_PENALTY_FLAG
          | LOAN_PROFITABILITY"
      - name: permissibility
        type: enum
        source: computed
        description: "PERMISSIBLE for LOAN_VOLUME_UNITS, LOAN_VOLUME_DOLLARS,
          PERCENTAGE_OF_LOAN_AMOUNT, HOURS_WORKED, FILE_QUALITY_SCORE, EXISTING_BORROWER_FLAG;
          PROHIBITED for INTEREST_RATE, APR, LOAN_TERM_MONTHS, LTV_RATIO, CREDIT_SCORE,
          PRODUCT_TYPE, PREPAYMENT_PENALTY_FLAG, LOAN_PROFITABILITY (terms of a transaction)."
        constraints: "PERMISSIBLE | PROHIBITED"
      - name: weight_pct
        type: integer
        source: input
        description: Declared weight of this variable inside the plan, 0..100.
        constraints: "required; 0 <= weight_pct <= 100"
      - name: justification_text
        type: string
        source: input
        description: Designer's written basis for including the variable; retained for examinations.
        constraints: "required; 20..1000 chars"

  - name: LoanApplication
    parent: null
    common_fields: true
    fields:
      - name: originator_id
        type: string
        source: input
        description: "FK -> Originator.id; the originator who took the application."
        constraints: "required; must equal X-User-ID when the caller's role is Originator"
      - name: compensation_plan_id
        type: string
        source: computed
        description: "FK -> CompensationPlan.id; the plan pinned onto the loan at close time from
          Originator.compensation_plan_id. Null until status = CLOSED."
        default: null
      - name: state_code
        type: string
        source: input
        description: Two-letter state code of the subject property; drives the authority check.
        constraints: "required; uppercase A-Z{2}"
      - name: borrower_reference
        type: string
        source: input
        description: Opaque borrower file reference used in examination responses.
        constraints: "required; 1..40 chars"
      - name: application_taken_at
        type: datetime
        source: computed
        description: "Logical clock instant at which the application was accepted; the instant the
          state-authority window check is evaluated against."
      - name: product_type
        type: enum
        source: input
        description: "Loan product; a transaction term, therefore never a compensation input."
        constraints: "required; FIXED_30 | FIXED_15 | ARM_5_1 | FHA_30 | VA_30"
      - name: requested_amount_cents
        type: integer
        source: input
        description: Loan amount requested on the application, in cents.
        constraints: "required; 1000000 <= requested_amount_cents <= 500000000"
      - name: par_rate_bps
        type: integer
        source: input
        description: Par (no-points) rate available for this file at application, in basis points.
        constraints: "required; 100 <= par_rate_bps <= 2000"
      - name: note_rate_bps
        type: integer
        source: computed
        description: "Locked note rate in basis points, written by POST /loan-applications/{id}/lock;
          null while status = TAKEN."
        default: null
      - name: locked_amount_cents
        type: integer
        source: computed
        description: "Loan amount at rate lock, written by POST /loan-applications/{id}/lock; the
          amount the PROVISIONAL compensation variant multiplies. Null while status = TAKEN."
        default: null
      - name: funded_amount_cents
        type: integer
        source: computed
        description: "Actual funded amount written by POST /loan-applications/{id}/close; the amount
          the FINAL compensation variant multiplies. Null until status = CLOSED."
        default: null
      - name: funded_at
        type: datetime
        source: computed
        description: "Funding instant supplied at close; the clawback window's day-0 anchor."
        default: null
      - name: payoff_date
        type: datetime
        source: computed
        description: "Payoff instant supplied at POST /loan-applications/{id}/payoff; null until
          status = PAID_OFF."
        default: null
      - name: lender_paid_comp_cents
        type: integer
        source: computed
        description: "Lender-paid originator compensation reported at close, in cents; the base the
          clawback recaptures from."
        default: 0
      - name: borrower_paid_comp_cents
        type: integer
        source: computed
        description: "Borrower-paid originator compensation reported at close, in cents. Non-zero
          together with lender_paid_comp_cents is the dual-compensation condition."
        default: 0
      - name: file_quality_score
        type: integer
        source: computed
        description: "Quality-of-file score reported at close, 0..100; a permissible compensation
          variable feeding calculations.volume_tier_bps_selection."
        default: 0
        constraints: "0 <= file_quality_score <= 100"
      - name: hours_worked_pct
        type: integer
        source: computed
        description: "Percentage of a full period the originator worked on this file, reported at
          close, 0..100; a permissible compensation variable."
        default: 0
        constraints: "0 <= hours_worked_pct <= 100"
      - name: status
        type: enum
        source: computed
        description: "Origination dimension of the loan's parallel state; see
          state_machines.LoanApplication."
        default: TAKEN
        constraints: "TAKEN | LOCKED | CLOSED | PAID_OFF | WITHDRAWN"
      - name: compensation_status
        type: enum
        source: computed
        description: "Compensation dimension of the loan's parallel state, evolving independently of
          status; see state_machines.LoanApplication."
        default: NOT_APPLICABLE
        constraints: "NOT_APPLICABLE | PENDING | ACCRUED | RECONCILED | CLAWED_BACK"
      - name: authority_flag
        type: enum
        source: computed
        description: "VERIFIED when the authority window check passed at application_taken_at and
          has not since been invalidated; SUSPENDED after a cascaded licence lapse; UNAUTHORIZED
          once an UnlicensedActivityInvestigation on this loan is SUBSTANTIATED."
        default: VERIFIED
        constraints: "VERIFIED | SUSPENDED | UNAUTHORIZED"
      - name: closed_unit_index
        type: integer
        source: computed
        description: "1-based chronological ordinal of this loan among the originator's closed loans,
          assigned at close ordered by funded_at ASC then created_at ASC. Null until CLOSED."
        default: null

  - name: PricingException
    parent: null
    common_fields: true
    fields:
      - name: loan_application_id
        type: string
        source: input
        description: "FK -> LoanApplication.id; the file the concession applies to."
        constraints: "required; taken from the path segment"
      - name: requested_by_user_id
        type: string
        source: system
        description: "X-User-ID of the Originator that filed the request; the segregation-of-duties
          check forbids this value from also appearing as decided_by_user_id."
      - name: requested_rate_bps
        type: integer
        source: input
        description: Rate in basis points the originator asks to deliver to the borrower.
        constraints: "required; 100 <= requested_rate_bps <= 2000"
      - name: concession_cents
        type: integer
        source: input
        description: Dollar concession (lender credit) requested, in cents.
        constraints: "required; 1 <= concession_cents <= 2000000"
      - name: reason_code
        type: enum
        source: input
        description: Policy-enumerated basis for the exception.
        constraints: "required; COMPETITIVE_MATCH | SERVICE_ISSUE | PRICING_ERROR
          | UNDERWRITING_DELAY | RELATIONSHIP_PRICING"
      - name: justification_text
        type: string
        source: input
        description: Documented written justification retained for examination.
        constraints: "required; 40..2000 chars"
      - name: status
        type: enum
        source: computed
        description: "Exception lifecycle state; see state_machines.PricingException."
        default: SUBMITTED
        constraints: "SUBMITTED | APPROVED | DENIED | WITHDRAWN"
      - name: requires_second_approval
        type: boolean
        source: computed
        description: "True when Originator.monitoring_status = ELEVATED at the instant this row was
          created, or when the owning originator became ELEVATED while this row was SUBMITTED."
        default: false
      - name: decided_by_user_id
        type: string
        source: computed
        description: "X-User-ID of the ComplianceOfficer that approved or denied; null while
          status = SUBMITTED."
        default: null
      - name: second_decided_by_user_id
        type: string
        source: computed
        description: "X-User-ID of the second distinct ComplianceOfficer when
          requires_second_approval = true; null otherwise."
        default: null
      - name: decided_at
        type: datetime
        source: computed
        description: "Logical clock instant of the final decision; null while status = SUBMITTED."
        default: null
      - name: decision_note
        type: string
        source: computed
        description: "Reviewer's note recorded with the decision; null while status = SUBMITTED."
        default: null
      - name: comp_impact_cents
        type: integer
        source: computed
        description: "Originator commission reduction produced by
          calculations.pricing_exception_net_impact; 0 unless status = APPROVED and the owning
          plan has concession_absorption_enabled = true."
        default: 0

  - name: CompensationRecord
    parent: null
    common_fields: true
    fields:
      - name: loan_application_id
        type: string
        source: computed
        description: "FK -> LoanApplication.id; the closed loan this commission line belongs to."
      - name: originator_id
        type: string
        source: computed
        description: "FK -> Originator.id; copied from the loan at record creation."
      - name: compensation_plan_id
        type: string
        source: computed
        description: "FK -> CompensationPlan.id; the plan pinned onto the loan at close."
      - name: variant
        type: enum
        source: computed
        description: "PROVISIONAL at close; flips to FINAL when the reconciliation run rewrites the
          line; see calculations.originator_compensation_accrual."
        default: PROVISIONAL
        constraints: "PROVISIONAL | FINAL"
      - name: tier_bps_adder
        type: integer
        source: computed
        description: "Basis-point adder chosen by calculations.volume_tier_bps_selection for the
          variant that produced this line."
        default: 0
      - name: base_comp_cents
        type: integer
        source: computed
        description: "Clamped basis-point commission before any concession absorption."
        default: 0
      - name: comp_impact_cents
        type: integer
        source: computed
        description: "Concession absorption subtracted from base_comp_cents, copied from the loan's
          approved PricingException.comp_impact_cents."
        default: 0
      - name: accrued_cents
        type: integer
        source: computed
        description: "base_comp_cents - comp_impact_cents; the commission the ledger owes."
        default: 0
      - name: paid_cents
        type: integer
        source: computed
        description: "Commission treated as disbursed and therefore recapturable; equals
          accrued_cents once the line reaches RECONCILED, 0 while ACCRUED."
        default: 0
      - name: clawback_cents
        type: integer
        source: computed
        description: "Amount recaptured by calculations.early_payoff_clawback; 0 unless
          status = CLAWED_BACK."
        default: 0
      - name: days_held
        type: integer
        source: computed
        description: "Whole days between funded_at and payoff_date, floored; null until a payoff is
          recorded."
        default: null
      - name: recapture_pct
        type: integer
        source: computed
        description: "Recapture percentage selected by the clawback day buckets; null until a payoff
          is recorded."
        default: null
      - name: status
        type: enum
        source: computed
        description: "Ledger line state; see state_machines.CompensationRecord."
        default: ACCRUED
        constraints: "ACCRUED | RECONCILED | CLAWED_BACK"
      - name: reconciled_at
        type: datetime
        source: computed
        description: "Logical clock instant the reconciliation run finalised this line; null while
          status = ACCRUED."
        default: null

  - name: Advertisement
    parent: null
    common_fields: true
    fields:
      - name: originator_id
        type: string
        source: input
        description: "FK -> Originator.id; the originator the advertisement promotes."
        constraints: "required; must equal X-User-ID when the caller's role is Originator"
      - name: medium
        type: enum
        source: input
        description: Distribution channel; drives the disclosure-placement requirement.
        constraints: "required; WEB | PRINT | SOCIAL | DIRECT_MAIL | RADIO"
      - name: content_text
        type: string
        source: input
        description: Full advertisement copy inspected for required disclosures.
        constraints: "required; 10..4000 chars"
      - name: disclosed_nmls_ids
        type: array
        source: input
        description: "NMLS unique ids the copy actually prints, as strings."
        default: []
      - name: disclosed_license_numbers
        type: array
        source: input
        description: "State licence numbers the copy actually prints, as strings."
        default: []
      - name: target_state_codes
        type: array
        source: input
        description: "Two-letter state codes the advertisement is distributed in."
        constraints: "required; 1..10 entries; each uppercase A-Z{2}"
      - name: status
        type: enum
        source: computed
        description: "Advertisement lifecycle state; see state_machines.Advertisement."
        default: DRAFT
        constraints: "DRAFT | SUBMITTED | APPROVED | REJECTED | PUBLISHED | WITHDRAWN"
      - name: disclosure_findings
        type: array
        source: computed
        description: "Sorted-ascending list of finding codes produced by
          calculations.advertising_disclosure_findings; empty when the copy is compliant."
        default: []
      - name: reviewed_by_user_id
        type: string
        source: computed
        description: "X-User-ID of the ComplianceOfficer that approved or rejected; null while
          status IN {DRAFT, SUBMITTED}."
        default: null
      - name: published_at
        type: datetime
        source: computed
        description: "Logical clock instant of publication; null until status = PUBLISHED."
        default: null

  - name: ExaminationInquiry
    parent: null
    common_fields: true
    fields:
      - name: originator_id
        type: string
        source: input
        description: "FK -> Originator.id; the examined originator, or null for an
          institution-level inquiry."
        default: null
      - name: state_code
        type: string
        source: input
        description: Two-letter code of the examining state regulator.
        constraints: "required; uppercase A-Z{2}"
      - name: exam_reference
        type: string
        source: input
        description: Regulator's examination reference number.
        constraints: "required; globally unique across ExaminationInquiry; 4..32 chars"
      - name: opened_at
        type: datetime
        source: computed
        description: Logical clock instant the inquiry was recorded.
      - name: response_due_at
        type: datetime
        source: input
        description: Regulator's response deadline; ISO 8601 UTC.
        constraints: "required; must be strictly after the logical clock instant at creation"
      - name: status
        type: enum
        source: computed
        description: "Inquiry lifecycle state; see state_machines.ExaminationInquiry."
        default: OPEN
        constraints: "OPEN | RESPONSE_SUBMITTED | INFO_REQUESTED | ESCALATED | CLOSED"
      - name: response_round_count
        type: integer
        source: computed
        description: "Number of responses submitted; increments on every entry into
          RESPONSE_SUBMITTED, including cyclic re-entries after INFO_REQUESTED."
        default: 0
      - name: last_response_at
        type: datetime
        source: computed
        description: "Logical clock instant of the most recent response; null before the first."
        default: null
      - name: escalation_reason
        type: enum
        source: computed
        description: "Why the inquiry escalated, or null."
        default: null
        constraints: "null | DEADLINE_MISSED | ROUND_LIMIT_REACHED"

  - name: UnlicensedActivityInvestigation
    parent: null
    common_fields: true
    fields:
      - name: originator_id
        type: string
        source: computed
        description: "FK -> Originator.id; the originator whose authority is in question. Copied
          from the loan when the row is opened, whether by cascade or by direct call."
      - name: loan_application_id
        type: string
        source: input
        description: "FK -> LoanApplication.id; the application allegedly taken without authority."
        constraints: "required"
      - name: opened_by
        type: enum
        source: computed
        description: "CASCADE when opened by a licence-lapse cascade, MANUAL when opened by a
          ComplianceOfficer call."
        constraints: "CASCADE | MANUAL"
      - name: detected_at
        type: datetime
        source: computed
        description: Logical clock instant the investigation opened.
      - name: trigger_reason
        type: enum
        source: input
        description: "Why the row opened. Supplied by the caller on
          POST /unlicensed-activity-investigations (MANUAL_REFERRAL for a manual referral) and
          forced to AUTHORITY_LAPSE by the licence-lapse cascade."
        constraints: "AUTHORITY_LAPSE | STATE_NOT_AUTHORIZED | SPONSORSHIP_GAP | MANUAL_REFERRAL"
      - name: status
        type: enum
        source: computed
        description: "Investigation lifecycle state; see
          state_machines.UnlicensedActivityInvestigation."
        default: OPEN
        constraints: "OPEN | SUBSTANTIATED | UNSUBSTANTIATED | REMEDIATED"
      - name: finding_by_user_id
        type: string
        source: computed
        description: "X-User-ID of the ComplianceOfficer that entered the finding; null while
          status = OPEN."
        default: null
      - name: restitution_cents
        type: integer
        source: computed
        description: "Borrower restitution ordered when the finding is SUBSTANTIATED; 0 otherwise."
        default: 0
      - name: remediated_at
        type: datetime
        source: computed
        description: "Logical clock instant remediation was recorded; null until REMEDIATED."
        default: null

  - name: AuditEvent
    parent: null
    common_fields: false
    fields:
      - name: subject_type
        type: enum
        source: computed
        description: "Entity type the event describes; polymorphic pointer, deliberately not a
          declared foreign key."
        constraints: "Originator | LicenseRegistration | SponsorshipTransfer | CeCreditRecord
          | CompensationPlan | LoanApplication | PricingException | CompensationRecord
          | Advertisement | ExaminationInquiry | UnlicensedActivityInvestigation"
      - name: subject_ref
        type: string
        source: computed
        description: "The subject row's id value as an opaque string. Used only for retrieval and
          display; never an input to ordering, ranking or selection."
      - name: event_type
        type: enum
        source: computed
        description: "Compliance-relevant event recorded for examination."
        constraints: "LICENSE_STATUS_CHANGED | SPONSORSHIP_CHANGED | CE_CREDIT_VOIDED
          | PLAN_APPROVED | PLAN_REJECTED | PROHIBITED_VARIABLE_BLOCKED | APPLICATION_TAKEN
          | EXCEPTION_DECIDED | COMP_ACCRUED | COMP_RECONCILED | COMP_CLAWED_BACK
          | AD_DECIDED | INVESTIGATION_OPENED | INVESTIGATION_FINDING | MONITORING_ESCALATED"
      - name: actor_role
        type: enum
        source: computed
        description: "X-User-Role of the caller, or SYSTEM for cascade- and sweep-generated events."
        constraints: "LicensingAnalyst | CompensationDesigner | ComplianceOfficer | Originator
          | LoanOperations | ExaminationCoordinator | PlatformAdmin | SYSTEM"
      - name: actor_user_id
        type: string
        source: computed
        description: "X-User-ID of the caller, or null for SYSTEM events."
        default: null
      - name: detail
        type: string
        source: computed
        description: "One-line human-readable summary of what changed."
      - name: sequence_no
        type: integer
        source: computed
        description: "Strictly increasing per-request-global counter starting at 1; the canonical
          ordering key for audit replay, so ordering never depends on a random id."

# =============================================================================
# 1.2 State Machine Table
# =============================================================================
state_machines:

  # --- Cyclic: PENDING -> ACTIVE -> RENEWAL_PENDING -> ACTIVE -> ... and
  #     EXPIRED -> ACTIVE reinstatement, so ACTIVE is re-entered on two distinct loops.
  - entity: LicenseRegistration
    initial_state: PENDING
    terminal_states: [SURRENDERED, REVOKED]
    transitions:
      - from: PENDING
        to: ACTIVE
        trigger: "POST /license-registrations/{id}/activations"
        actor: LicensingAnalyst
        preconditions:
          - "status == PENDING"
          - "Originator.employment_status == EMPLOYED"
          - "logical clock instant < expiration_date"
        side_effects:
          - "authority_effective_at := logical clock instant"
          - "recompute Originator.authorized_state_codes per calculations.state_authority_resolution"
          - "append AuditEvent{event_type: LICENSE_STATUS_CHANGED, subject_type: LicenseRegistration}"

      - from: ACTIVE
        to: RENEWAL_PENDING
        trigger: "POST /license-registrations/{id}/renewal-requests"
        actor: LicensingAnalyst
        preconditions:
          - "status == ACTIVE"
          - "logical clock instant >= renewal_window_opens_at"
          - "logical clock instant < expiration_date"
        side_effects:
          - "recompute ce_hours_applied and ce_satisfied per calculations.ce_compliance_evaluation
             using the CALENDAR_YEAR_ATTRIBUTION variant"
          - "authority is retained: Originator.authorized_state_codes is unchanged because
             RENEWAL_PENDING counts as authorised"
          - "append AuditEvent{event_type: LICENSE_STATUS_CHANGED}"
        note: "Cycle edge 1 of 2 into ACTIVE - the renewal loop."

      - from: RENEWAL_PENDING
        to: ACTIVE
        trigger: "POST /license-registrations/{id}/renewal-completions"
        actor: LicensingAnalyst
        preconditions:
          - "status == RENEWAL_PENDING"
          - "ce_satisfied == true after recomputation with the MAKEUP_ATTRIBUTION variant"
          - "no CeCreditRecord counted toward ce_reporting_year has credit_status = VOIDED"
        side_effects:
          - "expiration_date := expiration_date + 365 days"
          - "renewal_window_opens_at := renewal_window_opens_at + 365 days"
          - "ce_reporting_year := ce_reporting_year + 1"
          - "ce_hours_applied := 0 and ce_satisfied := false, recomputed against the new
             ce_reporting_year"
          - "authority_effective_at is left unchanged - authority never lapsed"
          - "append AuditEvent{event_type: LICENSE_STATUS_CHANGED}"

      - from: RENEWAL_PENDING
        to: EXPIRED
        trigger: "POST /_ops/daily-license-sweep (system, when logical clock >= expiration_date)"
        actor: system
        preconditions:
          - "status == RENEWAL_PENDING"
          - "logical clock instant >= expiration_date"
        side_effects:
          - "CASCADE HOP 1: the SponsorshipTransfer whose license_registration_id = this licence and
             status = ACTIVE moves to RELINQUISHED with relinquished_at := logical clock instant"
          - "CASCADE HOP 2 (caused by hop 1): active_sponsoring_institution_code := null,
             active_sponsorship_effective_at := null, and Originator.authorized_state_codes is
             recomputed, dropping this state_code"
          - "CASCADE HOP 3 (caused by hop 2): every LoanApplication with originator_id = this
             licence's originator_id, state_code = this licence's state_code and status IN
             {TAKEN, LOCKED} moves authority_flag := SUSPENDED"
          - "CASCADE HOP 4 (caused by hop 3): for each loan just suspended, an
             UnlicensedActivityInvestigation is created with opened_by = CASCADE,
             trigger_reason = AUTHORITY_LAPSE, status = OPEN"
          - "CASCADE HOP 5 (caused by hop 4): Originator.open_investigation_count is recomputed"
          - "append AuditEvent{event_type: LICENSE_STATUS_CHANGED} then one
             AuditEvent{event_type: INVESTIGATION_OPENED} per created investigation, ordered by the
             suspended loans' funded_at ASC then created_at ASC"

      - from: ACTIVE
        to: EXPIRED
        trigger: "POST /_ops/daily-license-sweep (system, when logical clock >= expiration_date)"
        actor: system
        preconditions:
          - "status == ACTIVE"
          - "logical clock instant >= expiration_date"
        side_effects:
          - "identical five-hop cascade to the RENEWAL_PENDING -> EXPIRED transition above"

      - from: EXPIRED
        to: ACTIVE
        trigger: "POST /license-registrations/{id}/status-actions with action = REINSTATE"
        actor: LicensingAnalyst
        preconditions:
          - "status == EXPIRED"
          - "ce_satisfied == true for ce_reporting_year"
          - "reinstatement_count < 2"
          - "Originator.employment_status == EMPLOYED"
        side_effects:
          - "reinstatement_count := reinstatement_count + 1"
          - "expiration_date := logical clock instant + 365 days"
          - "renewal_window_opens_at := logical clock instant + 305 days"
          - "authority_effective_at := logical clock instant (re-stamped; the pre-lapse interval is
             closed and does NOT retroactively authorise applications taken while EXPIRED)"
          - "recompute Originator.authorized_state_codes"
          - "append AuditEvent{event_type: LICENSE_STATUS_CHANGED}"
        note: "Cycle edge 2 of 2 into ACTIVE - the reinstatement loop, reached from a different
          predecessor and carrying a different side-effect set than the renewal loop."

      - from: ACTIVE
        to: SURRENDERED
        trigger: "POST /license-registrations/{id}/status-actions with action = SURRENDER"
        actor: LicensingAnalyst
        preconditions:
          - "status IN {ACTIVE, RENEWAL_PENDING}"
          - "no LoanApplication with this originator_id and this state_code has status IN
             {TAKEN, LOCKED}"
        side_effects:
          - "the ACTIVE SponsorshipTransfer on this licence moves to RELINQUISHED"
          - "recompute Originator.authorized_state_codes"
          - "append AuditEvent{event_type: LICENSE_STATUS_CHANGED}"

      - from: ACTIVE
        to: REVOKED
        trigger: "POST /license-registrations/{id}/status-actions with action = REVOKE"
        actor: LicensingAnalyst
        preconditions:
          - "status IN {ACTIVE, RENEWAL_PENDING, EXPIRED}"
        side_effects:
          - "CASCADE HOP 1: the ACTIVE SponsorshipTransfer on this licence moves to RELINQUISHED
             with relinquished_at := logical clock instant"
          - "CASCADE HOP 2 (caused by hop 1): Originator.authorized_state_codes is recomputed and
             loses this state_code"
          - "CASCADE HOP 3 (caused by hop 2): every LoanApplication with this originator_id, this
             state_code and status IN {TAKEN, LOCKED} moves authority_flag := SUSPENDED"
          - "CASCADE HOP 4 (caused by hop 3): one UnlicensedActivityInvestigation per suspended loan
             is created with opened_by = CASCADE, trigger_reason = AUTHORITY_LAPSE"
          - "CASCADE HOP 5 (caused by hop 4): Originator.open_investigation_count is recomputed"
          - "append AuditEvent{event_type: LICENSE_STATUS_CHANGED} plus one INVESTIGATION_OPENED per
             created investigation"
        note: "Terminal. Same five-hop chain as the sweep-driven expiry but triggered by an operator
          action rather than the epoch advance."

  - entity: SponsorshipTransfer
    initial_state: ACTIVE
    terminal_states: [RELINQUISHED, SUPERSEDED]
    transitions:
      - from: ACTIVE
        to: RELINQUISHED
        trigger: "POST /sponsorship-transfers/{id}/relinquish"
        actor: LicensingAnalyst
        preconditions:
          - "status == ACTIVE"
          - "LicenseRegistration.status IN {ACTIVE, RENEWAL_PENDING, EXPIRED}"
        side_effects:
          - "relinquished_at := logical clock instant"
          - "LicenseRegistration.active_sponsoring_institution_code := null and
             active_sponsorship_effective_at := null"
          - "recompute Originator.authorized_state_codes (the state is dropped: an unsponsored
             licence confers no authority)"
          - "append AuditEvent{event_type: SPONSORSHIP_CHANGED}"

      - from: ACTIVE
        to: SUPERSEDED
        trigger: "POST /license-registrations/{id}/sponsorship-transfers (a later transfer legitimately
          replaces this one)"
        actor: LicensingAnalyst
        preconditions:
          - "status == ACTIVE"
          - "the incoming transfer's effective_at >= this row's effective_at"
        side_effects:
          - "relinquished_at := the incoming transfer's effective_at"
          - "superseded_by_created_at := the incoming transfer's created_at"
          - "LicenseRegistration.active_sponsoring_institution_code := the incoming transfer's
             sponsoring_institution_code"
          - "append AuditEvent{event_type: SPONSORSHIP_CHANGED}"

      - from: ACTIVE
        to: RELINQUISHED
        trigger: "system cascade from LicenseRegistration leaving ACTIVE/RENEWAL_PENDING
          (EXPIRED, SURRENDERED, REVOKED)"
        actor: system
        preconditions:
          - "status == ACTIVE"
        side_effects:
          - "relinquished_at := logical clock instant"
          - "hop 2 of the licence-lapse cascade continues on the Originator"

  # --- Branching fork-join: DRAFT -> {ACTIVE, REJECTED} with divergent side-effect sets.
  - entity: CompensationPlan
    initial_state: DRAFT
    terminal_states: [REJECTED, SUPERSEDED]
    transitions:
      - from: DRAFT
        to: ACTIVE
        trigger: "POST /compensation-plans/{id}/approvals with decision = APPROVE"
        actor: ComplianceOfficer
        preconditions:
          - "status == DRAFT"
          - "prohibited_variable_count == 0"
          - "at least one CompensationVariable child exists"
          - "sum of CompensationVariable.weight_pct over this plan's children == 100"
          - "X-User-ID != drafted_by_user_id (segregation of duties)"
        side_effects:
          - "approved_by_user_id := X-User-ID"
          - "append AuditEvent{event_type: PLAN_APPROVED}"
        note: "Branch A of the fork. Only ACTIVE plans are assignable."

      - from: DRAFT
        to: REJECTED
        trigger: "POST /compensation-plans/{id}/approvals with decision = REJECT"
        actor: ComplianceOfficer
        preconditions:
          - "status == DRAFT"
          - "X-User-ID != drafted_by_user_id (segregation of duties)"
        side_effects:
          - "approved_by_user_id := X-User-ID"
          - "every CompensationVariable child is left untouched (the rejection record must remain
             inspectable at examination)"
          - "append AuditEvent{event_type: PLAN_REJECTED}"
        note: "Branch B of the fork. Terminal, and unlike branch A it never checks
          prohibited_variable_count or the weight sum - a non-compliant plan must be rejectable."

      - from: ACTIVE
        to: SUPERSEDED
        trigger: "POST /originators/{id}/compensation-plan-assignments (assigning a different ACTIVE
          plan whose interval starts after this plan's assignment_effective_to)"
        actor: ComplianceOfficer
        preconditions:
          - "status == ACTIVE"
          - "assigned_originator_id == the target Originator"
        side_effects:
          - "Originator.compensation_plan_id := the incoming plan's id"
          - "CompensationRecord rows already pinned to this plan keep compensation_plan_id
             unchanged - historic lines are never re-pointed"
          - "append AuditEvent{event_type: PLAN_APPROVED, detail: superseded}"

  # --- Parallel dimensions on ONE row: `status` (origination) and `compensation_status`
  #     (ledger) advance independently. A loan can be PAID_OFF while compensation is still
  #     PENDING, and RECONCILED while status is still CLOSED.
  - entity: LoanApplication
    initial_state: TAKEN
    terminal_states: [WITHDRAWN]
    transitions:
      # ---- dimension 1: status
      - from: TAKEN
        to: LOCKED
        trigger: "POST /loan-applications/{id}/lock"
        actor: Originator
        preconditions:
          - "status == TAKEN"
          - "authority_flag == VERIFIED"
          - "state_code IN Originator.authorized_state_codes at the logical clock instant"
        side_effects:
          - "note_rate_bps := input note_rate_bps"
          - "locked_amount_cents := input locked_amount_cents"
          - "compensation_status is untouched (parallel dimension)"

      - from: LOCKED
        to: CLOSED
        trigger: "POST /loan-applications/{id}/close"
        actor: LoanOperations
        preconditions:
          - "status == LOCKED"
          - "Originator.compensation_plan_id is not null and that plan's status == ACTIVE"
          - "the plan's assignment interval [assignment_effective_from, assignment_effective_to]
             contains the input funded_at (inclusive both ends)"
        side_effects:
          - "funded_amount_cents, funded_at, lender_paid_comp_cents, borrower_paid_comp_cents,
             file_quality_score, hours_worked_pct := inputs"
          - "compensation_plan_id := Originator.compensation_plan_id"
          - "closed_unit_index := 1 + count of the originator's loans already in status IN
             {CLOSED, PAID_OFF}, ordered by funded_at ASC then created_at ASC"
          - "DIMENSION 2 BRANCH A: if authority_flag == VERIFIED, compensation_status := ACCRUED and
             one CompensationRecord is created with variant = PROVISIONAL per
             calculations.originator_compensation_accrual"
          - "DIMENSION 2 BRANCH B: if authority_flag != VERIFIED, compensation_status := PENDING and
             NO CompensationRecord is created (compensation withheld)"
          - "Originator.lifetime_accrued_cents, net_compensation_cents recomputed"
          - "Originator.exposure_score and monitoring_status recomputed per
             calculations.dual_comp_steering_exposure_score"
          - "append AuditEvent{event_type: COMP_ACCRUED} when branch A fired"

      - from: CLOSED
        to: PAID_OFF
        trigger: "POST /loan-applications/{id}/payoff"
        actor: LoanOperations
        preconditions:
          - "status == CLOSED"
          - "input payoff_date >= funded_at"
        side_effects:
          - "payoff_date := input payoff_date"
          - "CASCADE HOP 1: because status became PAID_OFF, if compensation_status == RECONCILED and
             calculations.early_payoff_clawback yields recapture_pct > 0, compensation_status
             := CLAWED_BACK"
          - "CASCADE HOP 2 (caused by hop 1): the loan's FINAL CompensationRecord moves
             RECONCILED -> CLAWED_BACK, writing days_held, recapture_pct and clawback_cents"
          - "CASCADE HOP 3 (caused by hop 2): Originator.lifetime_clawed_back_cents and
             net_compensation_cents are recomputed from the record's new clawback_cents"
          - "CASCADE HOP 4 (caused by hop 3): Originator.exposure_score is recomputed and
             monitoring_status flips to ELEVATED when the score reaches 60"
          - "CASCADE HOP 5 (caused by hop 4): if monitoring_status became ELEVATED, every
             PricingException with status = SUBMITTED whose loan_application_id belongs to a
             LoanApplication of this originator sets requires_second_approval := true"
          - "append AuditEvent{event_type: COMP_CLAWED_BACK}, then MONITORING_ESCALATED when hop 4
             changed monitoring_status"
        note: "Depth-5 transitive cascade. Each hop is caused by the previous hop's mutation, not by
          the payoff call itself."

      - from: TAKEN
        to: WITHDRAWN
        trigger: "POST /loan-applications/{id}/withdraw"
        actor: Originator
        preconditions:
          - "status IN {TAKEN, LOCKED}"
        side_effects:
          - "every PricingException on this loan with status = SUBMITTED moves to WITHDRAWN"
          - "compensation_status := NOT_APPLICABLE"

      # ---- dimension 2: compensation_status
      - from: PENDING
        to: ACCRUED
        trigger: "POST /loan-applications/{id}/compensation-release"
        actor: ComplianceOfficer
        preconditions:
          - "compensation_status == PENDING"
          - "status IN {CLOSED, PAID_OFF}"
          - "every UnlicensedActivityInvestigation with loan_application_id = this loan has
             status IN {UNSUBSTANTIATED, REMEDIATED}"
        side_effects:
          - "authority_flag := VERIFIED"
          - "one CompensationRecord with variant = PROVISIONAL is created per
             calculations.originator_compensation_accrual"
          - "Originator.lifetime_accrued_cents and net_compensation_cents recomputed"
          - "append AuditEvent{event_type: COMP_ACCRUED}"
        note: "Cross-entity guard: the loan's compensation dimension cannot advance until the
          investigation aggregate on that same loan has cleared."

      - from: ACCRUED
        to: RECONCILED
        trigger: "POST /originators/{id}/compensation-reconciliations"
        actor: ComplianceOfficer
        preconditions:
          - "compensation_status == ACCRUED"
          - "status IN {CLOSED, PAID_OFF}"
        side_effects:
          - "the loan's PROVISIONAL CompensationRecord is rewritten to variant = FINAL with
             recomputed base_comp_cents, tier_bps_adder, accrued_cents, and status := RECONCILED
             and paid_cents := accrued_cents"
          - "Originator.lifetime_accrued_cents and net_compensation_cents recomputed"
          - "append AuditEvent{event_type: COMP_RECONCILED}"

      - from: RECONCILED
        to: CLAWED_BACK
        trigger: "system cascade from the CLOSED -> PAID_OFF transition"
        actor: system
        preconditions:
          - "compensation_status == RECONCILED"
          - "calculations.early_payoff_clawback yields recapture_pct > 0"
        side_effects:
          - "described as hops 2-5 of the payoff cascade above"

  # --- Branching fork-join: SUBMITTED -> {APPROVED, DENIED} with divergent side effects.
  - entity: PricingException
    initial_state: SUBMITTED
    terminal_states: [APPROVED, DENIED, WITHDRAWN]
    transitions:
      - from: SUBMITTED
        to: APPROVED
        trigger: "POST /pricing-exceptions/{id}/decisions with decision = APPROVE"
        actor: ComplianceOfficer
        preconditions:
          - "status == SUBMITTED"
          - "LoanApplication.status == LOCKED"
          - "X-User-ID != requested_by_user_id (segregation of duties)"
          - "when requires_second_approval == true, the request carries second_approver_user_id and
             that value differs from both X-User-ID and requested_by_user_id"
          - "the owning Originator's compensation_plan_id is not null and that plan's status
             == ACTIVE"
        side_effects:
          - "decided_by_user_id := X-User-ID; decided_at := logical clock instant;
             decision_note := input decision_note"
          - "second_decided_by_user_id := input second_approver_user_id when
             requires_second_approval == true, else null"
          - "comp_impact_cents := calculations.pricing_exception_net_impact output, or 0 when the
             plan has concession_absorption_enabled = false"
          - "append AuditEvent{event_type: EXCEPTION_DECIDED}"
        note: "Branch A. Only this branch touches compensation."

      - from: SUBMITTED
        to: DENIED
        trigger: "POST /pricing-exceptions/{id}/decisions with decision = DENY"
        actor: ComplianceOfficer
        preconditions:
          - "status == SUBMITTED"
          - "X-User-ID != requested_by_user_id (segregation of duties)"
        side_effects:
          - "decided_by_user_id := X-User-ID; decided_at := logical clock instant;
             decision_note := input decision_note"
          - "comp_impact_cents stays 0"
          - "append AuditEvent{event_type: EXCEPTION_DECIDED}"
        note: "Branch B. Deliberately does NOT require the loan to still be LOCKED nor a second
          approver - a denial must always be recordable."

      - from: SUBMITTED
        to: WITHDRAWN
        trigger: "POST /pricing-exceptions/{id}/withdraw"
        actor: Originator
        preconditions:
          - "status == SUBMITTED"
          - "X-User-ID == requested_by_user_id"
        side_effects:
          - "comp_impact_cents stays 0"

  - entity: CompensationRecord
    initial_state: ACCRUED
    terminal_states: [CLAWED_BACK]
    transitions:
      - from: ACCRUED
        to: RECONCILED
        trigger: "POST /originators/{id}/compensation-reconciliations"
        actor: ComplianceOfficer
        preconditions:
          - "status == ACCRUED"
          - "the owning LoanApplication.status IN {CLOSED, PAID_OFF}"
        side_effects:
          - "variant := FINAL; base_comp_cents, tier_bps_adder and accrued_cents recomputed with the
             FINAL variant; paid_cents := accrued_cents; reconciled_at := logical clock instant"
          - "the owning LoanApplication.compensation_status := RECONCILED"
          - "Originator.lifetime_accrued_cents and net_compensation_cents recomputed"

      - from: RECONCILED
        to: CLAWED_BACK
        trigger: "system cascade from LoanApplication CLOSED -> PAID_OFF inside the clawback window"
        actor: system
        preconditions:
          - "status == RECONCILED"
          - "days_held computed from the owning loan is <= EARLY_PAYOFF_OUTER_DAYS"
        side_effects:
          - "days_held, recapture_pct and clawback_cents written per
             calculations.early_payoff_clawback"
          - "Originator.lifetime_clawed_back_cents and net_compensation_cents recomputed so that
             net_compensation_cents == lifetime_accrued_cents - lifetime_clawed_back_cents holds
             exactly (compensating-action invariant)"
        note: "Compensation transition: the forward accrual and this recapture must leave the ledger
          identity exact, with zero drift."

  - entity: Advertisement
    initial_state: DRAFT
    terminal_states: [WITHDRAWN]
    transitions:
      - from: DRAFT
        to: SUBMITTED
        trigger: "POST /advertisements/{id}/submissions"
        actor: Originator
        preconditions:
          - "status == DRAFT"
          - "X-User-ID == originator_id"
        side_effects:
          - "disclosure_findings := calculations.advertising_disclosure_findings output"

      - from: SUBMITTED
        to: APPROVED
        trigger: "POST /advertisements/{id}/reviews with decision = APPROVE"
        actor: ComplianceOfficer
        preconditions:
          - "status == SUBMITTED"
          - "disclosure_findings is empty after recomputation"
        side_effects:
          - "reviewed_by_user_id := X-User-ID"
          - "append AuditEvent{event_type: AD_DECIDED}"

      - from: SUBMITTED
        to: REJECTED
        trigger: "POST /advertisements/{id}/reviews with decision = REJECT"
        actor: ComplianceOfficer
        preconditions:
          - "status == SUBMITTED"
        side_effects:
          - "reviewed_by_user_id := X-User-ID"
          - "append AuditEvent{event_type: AD_DECIDED}"

      - from: REJECTED
        to: DRAFT
        trigger: "POST /advertisements/{id}/revisions"
        actor: Originator
        preconditions:
          - "status == REJECTED"
          - "X-User-ID == originator_id"
        side_effects:
          - "content_text, disclosed_nmls_ids, disclosed_license_numbers := inputs"
          - "disclosure_findings := [] (recomputed at the next submission)"
          - "reviewed_by_user_id := null"
        note: "Revision loop REJECTED -> DRAFT -> SUBMITTED, unbounded rounds."

      - from: APPROVED
        to: PUBLISHED
        trigger: "POST /advertisements/{id}/publish"
        actor: Originator
        preconditions:
          - "status == APPROVED"
          - "every state_code in target_state_codes is present in
             Originator.authorized_state_codes at the logical clock instant"
        side_effects:
          - "published_at := logical clock instant"

      - from: PUBLISHED
        to: WITHDRAWN
        trigger: "POST /advertisements/{id}/withdraw"
        actor: ComplianceOfficer
        preconditions:
          - "status IN {SUBMITTED, APPROVED, PUBLISHED}"
        side_effects:
          - "append AuditEvent{event_type: AD_DECIDED, detail: withdrawn}"

  # --- Cyclic: RESPONSE_SUBMITTED -> INFO_REQUESTED -> RESPONSE_SUBMITTED, unbounded rounds
  #     until either CLOSED or ESCALATED by the round limit.
  - entity: ExaminationInquiry
    initial_state: OPEN
    terminal_states: [CLOSED]
    transitions:
      - from: OPEN
        to: RESPONSE_SUBMITTED
        trigger: "POST /examination-inquiries/{id}/responses"
        actor: ExaminationCoordinator
        preconditions:
          - "status IN {OPEN, INFO_REQUESTED}"
          - "logical clock instant <= response_due_at"
        side_effects:
          - "response_round_count := response_round_count + 1"
          - "last_response_at := logical clock instant"

      - from: RESPONSE_SUBMITTED
        to: INFO_REQUESTED
        trigger: "POST /examination-inquiries/{id}/info-requests"
        actor: ExaminationCoordinator
        preconditions:
          - "status == RESPONSE_SUBMITTED"
          - "response_round_count < 3"
        side_effects:
          - "response_due_at := logical clock instant + 14 days"
        note: "Cycle edge back to RESPONSE_SUBMITTED via the OPEN/INFO_REQUESTED -> RESPONSE_SUBMITTED
          transition above."

      - from: INFO_REQUESTED
        to: RESPONSE_SUBMITTED
        trigger: "POST /examination-inquiries/{id}/responses"
        actor: ExaminationCoordinator
        preconditions:
          - "status == INFO_REQUESTED"
          - "logical clock instant <= response_due_at"
        side_effects:
          - "response_round_count := response_round_count + 1"
          - "last_response_at := logical clock instant"

      - from: RESPONSE_SUBMITTED
        to: ESCALATED
        trigger: "POST /examination-inquiries/{id}/info-requests when response_round_count >= 3"
        actor: ExaminationCoordinator
        preconditions:
          - "status == RESPONSE_SUBMITTED"
          - "response_round_count >= 3"
        side_effects:
          - "escalation_reason := ROUND_LIMIT_REACHED"

      - from: OPEN
        to: ESCALATED
        trigger: "POST /_ops/daily-license-sweep (system, when logical clock > response_due_at)"
        actor: system
        preconditions:
          - "status IN {OPEN, INFO_REQUESTED}"
          - "logical clock instant > response_due_at"
        side_effects:
          - "escalation_reason := DEADLINE_MISSED"

      - from: RESPONSE_SUBMITTED
        to: CLOSED
        trigger: "POST /examination-inquiries/{id}/close"
        actor: ExaminationCoordinator
        preconditions:
          - "status IN {RESPONSE_SUBMITTED, ESCALATED}"
        side_effects:
          - "no further transitions are permitted"

  - entity: UnlicensedActivityInvestigation
    initial_state: OPEN
    terminal_states: [UNSUBSTANTIATED, REMEDIATED]
    transitions:
      - from: OPEN
        to: SUBSTANTIATED
        trigger: "POST /unlicensed-activity-investigations/{id}/findings with finding = SUBSTANTIATED"
        actor: ComplianceOfficer
        preconditions:
          - "status == OPEN"
          - "input restitution_cents >= 1"
        side_effects:
          - "finding_by_user_id := X-User-ID; restitution_cents := input"
          - "the referenced LoanApplication.authority_flag := UNAUTHORIZED"
          - "Originator.open_investigation_count recomputed"
          - "append AuditEvent{event_type: INVESTIGATION_FINDING}"

      - from: OPEN
        to: UNSUBSTANTIATED
        trigger: "POST /unlicensed-activity-investigations/{id}/findings with finding
          = UNSUBSTANTIATED"
        actor: ComplianceOfficer
        preconditions:
          - "status == OPEN"
          - "input restitution_cents == 0"
        side_effects:
          - "finding_by_user_id := X-User-ID; restitution_cents := 0"
          - "the referenced LoanApplication.authority_flag := VERIFIED"
          - "Originator.open_investigation_count recomputed"
          - "append AuditEvent{event_type: INVESTIGATION_FINDING}"

      - from: SUBSTANTIATED
        to: REMEDIATED
        trigger: "POST /unlicensed-activity-investigations/{id}/remediate"
        actor: ComplianceOfficer
        preconditions:
          - "status == SUBSTANTIATED"
          - "restitution_cents >= 1"
        side_effects:
          - "remediated_at := logical clock instant"
          - "the referenced LoanApplication.authority_flag := VERIFIED"
          - "Originator.open_investigation_count recomputed"

# =============================================================================
# 1.2.1 Concurrency Rules (OCC on the parent's `version` only)
# =============================================================================
concurrency_rules:

  - rule_id: sponsorship-create-stale-license
    parent_entity: LicenseRegistration
    write_endpoint: "POST /license-registrations/{id}/sponsorship-transfers"
    occ_field: "expected_license_registration_version"
    description: |
      Creating a SponsorshipTransfer against a LicenseRegistration whose version has advanced
      since the client last read it is rejected. This is a genuine supersede write: a new
      sponsorship legitimately displaces the licence's existing ACTIVE sponsorship
      (ACTIVE -> SUPERSEDED per state_machines.SponsorshipTransfer), so a second writer with a
      stale view of the licence would otherwise succeed and silently overwrite an authority
      interval it never saw.
    error_id: ERR_STALE_LICENSE_VERSION
    http_status: 412

  - rule_id: plan-assignment-stale-originator
    parent_entity: Originator
    write_endpoint: "POST /originators/{id}/compensation-plan-assignments"
    occ_field: "expected_originator_version"
    description: |
      Assigning a CompensationPlan to an Originator whose version has advanced since the client
      last read it is rejected. The assignment write legitimately supersedes whichever plan the
      originator currently carries (ACTIVE -> SUPERSEDED per state_machines.CompensationPlan),
      so a stale writer would otherwise re-point compensation_plan_id on top of an assignment
      interval it never observed.
    error_id: ERR_STALE_ORIGINATOR_VERSION
    http_status: 412

# =============================================================================
# 1.3 Calculation Rules Table
# =============================================================================
calculations:

  - name: ce_compliance_evaluation
    trigger: "On POST /ce-credits, POST /ce-credits/{id}/void, POST /ce-courses/{id}/rescind,
      POST /license-registrations/{id}/renewal-requests,
      POST /license-registrations/{id}/renewal-completions, and on
      GET /originators/{id}/ce-compliance"
    algorithm: aggregation
    formula: |
      # ---- step 1: attribution of each credit (stored on the row at creation)
      attributed_year(c) = c.reporting_period_year        if c.is_makeup == true
                         = calendar year of c.completion_date (UTC)  otherwise

      # ---- step 2: successive-year exclusion, evaluated when a credit is created
      # A credit c is written with credit_status = EXCLUDED_SUCCESSIVE_YEAR when
      #   CeCourse(c.ce_course_id).successive_year_blocked == true
      #   AND there exists another CeCreditRecord p with
      #        p.originator_id      == c.originator_id
      #        p.ce_course_id       == c.ce_course_id
      #        p.credit_status      == APPLIED
      #        p.attributed_year    == attributed_year(c) - 1
      # Otherwise credit_status = APPLIED. The later-attributed credit is always the excluded
      # one; the earlier row is never retroactively changed by a newer arrival.

      # ---- step 3: the counted set, selected by ONE of two variants
      counted(O, Y, variant) =
        { c : c.originator_id == O
              AND c.credit_status == APPLIED
              AND ( variant == MAKEUP_ATTRIBUTION  AND c.attributed_year == Y
                 OR variant == CALENDAR_YEAR_ATTRIBUTION
                    AND calendar year of c.completion_date == Y ) }

      # ---- step 4: hour aggregation over the counted set
      total_hours     = sum of c.credit_hours over counted(O, Y, variant)
      federal_hours   = sum of c.credit_hours over counted where c.category == FEDERAL_LAW
      ethics_hours    = sum of c.credit_hours over counted where c.category == ETHICS
      nontrad_hours   = sum of c.credit_hours over counted where c.category == NONTRADITIONAL

      LicenseRegistration.ce_hours_applied = total_hours
      LicenseRegistration.ce_satisfied =
            total_hours   >= LicenseRegistration.required_ce_hours
        AND federal_hours >= REQUIRED_FEDERAL_LAW_HOURS
        AND ethics_hours  >= REQUIRED_ETHICS_HOURS
        AND nontrad_hours >= REQUIRED_NONTRADITIONAL_HOURS
      # All four comparisons are `>=`: hitting the minimum exactly satisfies it.
    input_set: |
      CeCreditRecord rows with credit_status == APPLIED only. Rows in
      EXCLUDED_SUCCESSIVE_YEAR and VOIDED are excluded from every sum. Y is always the owning
      LicenseRegistration.ce_reporting_year; there is no cross-year carry-over other than the
      make-up attribution in step 1.
    constants:
      REQUIRED_FEDERAL_LAW_HOURS: 3
      REQUIRED_ETHICS_HOURS: 2
      REQUIRED_NONTRADITIONAL_HOURS: 2
    precision: "integer hours, no rounding"
    variants:
      - name: CALENDAR_YEAR_ATTRIBUTION
        when: "Used by POST /license-registrations/{id}/renewal-requests and by
          GET /originators/{id}/ce-compliance when attribution_variant = CALENDAR_YEAR_ATTRIBUTION.
          A credit counts in the calendar year it was actually completed in, whatever
          is_makeup says."
        difference: "A make-up credit completed on 2027-01-15 for reporting_period_year 2026 is
          attributed to 2027 and therefore does NOT enter the 2026 total."
      - name: MAKEUP_ATTRIBUTION
        when: "Used by POST /license-registrations/{id}/renewal-completions,
          POST /ce-credits, POST /ce-credits/{id}/void, POST /ce-courses/{id}/rescind, and by
          GET /originators/{id}/ce-compliance when attribution_variant = MAKEUP_ATTRIBUTION."
        difference: "The same make-up credit is attributed to 2026 and DOES enter the 2026 total,
          so identical credit rows yield ce_satisfied = false under CALENDAR_YEAR_ATTRIBUTION and
          ce_satisfied = true under MAKEUP_ATTRIBUTION."

  - name: volume_tier_bps_selection
    trigger: "Invoked as a sub-step of calculations.originator_compensation_accrual, once per
      CompensationRecord write (at POST /loan-applications/{id}/close,
      POST /loan-applications/{id}/compensation-release, and
      POST /originators/{id}/compensation-reconciliations)"
    algorithm: tiered_pricing
    formula: |
      if plan.volume_tier_enabled == false: return 0

      # input 1 - unit count (variant-dependent, supplied by the caller)
      if units <= TIER1_MAX_UNITS:      tier_bps = TIER1_BPS
      elif units <= TIER2_MAX_UNITS:    tier_bps = TIER2_BPS
      else:                             tier_bps = TIER3_BPS

      # input 2 - file quality score on the loan (permissible variable)
      if loan.file_quality_score >= QUALITY_FULL_MIN:       quality_penalty_bps = 0
      elif loan.file_quality_score >= QUALITY_PARTIAL_MIN:  quality_penalty_bps = QUALITY_PARTIAL_PENALTY_BPS
      else:                                                 quality_penalty_bps = QUALITY_FAIL_PENALTY_BPS

      adder = max(0, min(TIER3_BPS, tier_bps - quality_penalty_bps))

      # input 3 - hours worked share on the loan (permissible variable)
      if loan.hours_worked_pct < HOURS_MIN_PCT:  adder = min(adder, HOURS_CAP_BPS)

      return adder
    input_set: |
      `units` is supplied by the calling variant of originator_compensation_accrual and is never
      read from a transaction term. `loan` is the LoanApplication the CompensationRecord belongs
      to. INTEREST_RATE, APR, LTV_RATIO, CREDIT_SCORE, PRODUCT_TYPE, LOAN_TERM_MONTHS,
      PREPAYMENT_PENALTY_FLAG and LOAN_PROFITABILITY never enter this formula - they are terms of
      a transaction and their appearance as a CompensationVariable is a design-time violation.
    constants:
      TIER1_MAX_UNITS: 4
      TIER2_MAX_UNITS: 9
      TIER1_BPS: 0
      TIER2_BPS: 15
      TIER3_BPS: 30
      QUALITY_FULL_MIN: 90
      QUALITY_PARTIAL_MIN: 70
      QUALITY_PARTIAL_PENALTY_BPS: 10
      QUALITY_FAIL_PENALTY_BPS: 25
      HOURS_MIN_PCT: 50
      HOURS_CAP_BPS: 15
    precision: "integer basis points; the nested max/min clamp is applied in the written order
      (subtract penalty, then min against TIER3_BPS, then max against 0, then the hours cap)"

  - name: originator_compensation_accrual
    trigger: "POST /loan-applications/{id}/close (branch A) and
      POST /loan-applications/{id}/compensation-release create a CompensationRecord with
      variant = PROVISIONAL; POST /originators/{id}/compensation-reconciliations rewrites each
      ACCRUED record with variant = FINAL"
    algorithm: forward_looking
    formula: |
      # ---- per-loan commission, one CompensationRecord line
      units          = <variant-supplied unit count>
      amount_cents   = <variant-supplied loan amount>
      tier_bps_adder = volume_tier_bps_selection(plan, loan, units)
      effective_bps  = plan.base_basis_points + tier_bps_adder

      raw_cents       = amount_cents * effective_bps / 10000        # exact rational, NOT rounded yet
      base_comp_cents = round_half_up(raw_cents)                    # ROUNDING STEP 1 - per line
      base_comp_cents = min(plan.max_fee_cents, max(plan.min_fee_cents, base_comp_cents))

      comp_impact_cents = 0
      if plan.concession_absorption_enabled == true:
          comp_impact_cents = the comp_impact_cents of the single PricingException on this loan
                              whose status == APPROVED, else 0
      accrued_cents = base_comp_cents - comp_impact_cents

      # ---- reconciliation roll-up, PINNED ROUNDING ORDER
      # total_final_cents = sum over the reconciled lines of that line's ALREADY-ROUNDED
      # accrued_cents (round-per-line, THEN sum). Summing the exact rational raw_cents values
      # across lines and rounding once at the end is FORBIDDEN and yields a different total.
      total_final_cents = sum of accrued_cents over the lines the run rewrote
      total_delta_cents = total_final_cents - (sum of those lines' pre-run accrued_cents)
    input_set: |
      One line per LoanApplication with originator_id = O, status IN {CLOSED, PAID_OFF} and
      compensation_status == ACCRUED at the instant the reconciliation run executes. Loans with
      compensation_status IN {NOT_APPLICABLE, PENDING, RECONCILED, CLAWED_BACK} are skipped.
      Lines are processed ordered by LoanApplication.funded_at ASC, then LoanApplication.created_at
      ASC (never by id).
    constants:
      BPS_DENOMINATOR: 10000
    precision: "2 decimal places is not applicable - all money is integer cents; every division
      rounds half-up to the nearest whole cent, once per line, before any summation"
    variants:
      - name: PROVISIONAL
        when: "Written at POST /loan-applications/{id}/close and at
          POST /loan-applications/{id}/compensation-release."
        difference: |
          amount_cents = loan.locked_amount_cents (the amount at rate lock) and
          units = loan.closed_unit_index - 1, i.e. the originator's closed-unit count strictly
          BEFORE this loan. Chronological: the tier is the one the originator had earned when the
          file closed.
      - name: FINAL
        when: "Written at POST /originators/{id}/compensation-reconciliations."
        difference: |
          amount_cents = loan.funded_amount_cents (the amount actually funded) and
          units = the count of the originator's LoanApplications with status IN {CLOSED, PAID_OFF}
          at the instant the reconciliation run executes - forward-looking, so loans that closed
          after this one raise this loan's tier. Identical loan data therefore yields a different
          accrued_cents from PROVISIONAL whenever locked_amount_cents != funded_amount_cents or
          the period's unit count crosses a tier boundary.

  - name: pricing_exception_net_impact
    trigger: "POST /pricing-exceptions/{id}/decisions with decision = APPROVE"
    algorithm: constraint_propagation
    formula: |
      # This looks circular: the absorption bracket is keyed on the commission, and the
      # commission is reduced by the absorption. The evaluation order below is PINNED, and the
      # bracket is decided from the PRE-absorption commission only. Feeding net_comp_cents back
      # into step 2 is FORBIDDEN and produces a different number.
      #
      # step 1 - pre-absorption commission from the LOCKED amount. The volume tier adder is
      #          deliberately NOT applied here: file_quality_score and hours_worked_pct are only
      #          reported at close and are still 0 at decision time.
      base_comp_cents = round_half_up(loan.locked_amount_cents * plan.base_basis_points / 10000)
      base_comp_cents = min(plan.max_fee_cents, max(plan.min_fee_cents, base_comp_cents))

      # step 2 - bracket, keyed on the step-1 value
      bracket = HIGH if base_comp_cents >= CONCESSION_BRACKET_CENTS else LOW

      # step 3 - absorption share
      absorb_pct = ABSORB_HIGH_PCT if bracket == HIGH else ABSORB_LOW_PCT

      # step 4 - the originator's share of the concession
      comp_impact_cents = round_half_up(exception.concession_cents * absorb_pct / 100)

      # step 5 - reported net, NOT fed back into step 2
      net_comp_cents = base_comp_cents - comp_impact_cents

      if plan.concession_absorption_enabled == false:
          comp_impact_cents = 0
          net_comp_cents    = base_comp_cents
    input_set: |
      `plan` is the CompensationPlan referenced by Originator.compensation_plan_id at decision
      time and must have status == ACTIVE. `loan` is the PricingException's LoanApplication, which
      must be in status LOCKED so locked_amount_cents is non-null.
    constants:
      CONCESSION_BRACKET_CENTS: 300000
      ABSORB_HIGH_PCT: 50
      ABSORB_LOW_PCT: 25
    precision: "integer cents, round_half_up at step 1 and step 4 independently; no other rounding"

  - name: early_payoff_clawback
    trigger: "POST /loan-applications/{id}/payoff, as hop 2 of the payoff cascade"
    algorithm: threshold
    formula: |
      days_held = floor( (payoff_date - loan.funded_at) / 86400 seconds )

      if   days_held <= EARLY_PAYOFF_INNER_DAYS: recapture_pct = INNER_RECAPTURE_PCT
      elif days_held <= EARLY_PAYOFF_OUTER_DAYS: recapture_pct = OUTER_RECAPTURE_PCT
      else:                                      recapture_pct = 0

      clawback_cents = round_half_up(record.paid_cents * recapture_pct / 100)

      # compensating-action invariant on the money ledger, checked after every payoff:
      #   Originator.net_compensation_cents
      #     == Originator.lifetime_accrued_cents - Originator.lifetime_clawed_back_cents
      # and, when recapture_pct == 100 for every line of the originator, net_compensation_cents
      # returns to exactly its pre-close value.
    input_set: |
      Exactly one CompensationRecord: the row with loan_application_id = this loan, variant =
      FINAL and status = RECONCILED. Records still in status ACCRUED (never reconciled, so
      paid_cents = 0) are not clawed back at all and the loan's compensation_status stays ACCRUED.
    constants:
      EARLY_PAYOFF_INNER_DAYS: 90
      EARLY_PAYOFF_OUTER_DAYS: 180
      INNER_RECAPTURE_PCT: 100
      OUTER_RECAPTURE_PCT: 50
    precision: "integer cents, round_half_up; days_held is a floored whole-day count, so a payoff
      at 89 days 23 hours is 89 days"

  - name: dual_comp_steering_exposure_score
    trigger: "Recomputed at POST /loan-applications/{id}/close,
      POST /loan-applications/{id}/compensation-release,
      POST /originators/{id}/compensation-reconciliations,
      POST /pricing-exceptions/{id}/decisions with decision = APPROVE, and as hop 4 of the
      POST /loan-applications/{id}/payoff cascade"
    algorithm: weighted_scoring
    formula: |
      closed = { L : L.originator_id == O AND L.status IN {CLOSED, PAID_OFF} }
      n = count(closed)
      if n == 0:
          exposure_score = 0 ; monitoring_status = STANDARD ; return     # empty-set guard,
                                                                        # no division occurs

      dual_count           = count of L in closed with L.lender_paid_comp_cents > 0
                                                  AND L.borrower_paid_comp_cents > 0
      dual_ratio_pct       = 100 * dual_count / n                       # exact rational
      avg_spread_bps       = ( sum over closed of max(0, L.note_rate_bps - L.par_rate_bps) ) / n
      capped_spread        = min(SPREAD_CAP_BPS, avg_spread_bps)
      exception_count      = count of L in closed having at least one PricingException with
                             loan_application_id == L.id AND status == APPROVED
      exception_rate_pct   = 100 * exception_count / n                  # exact rational
      clawback_ratio_pct   = 0  if O.lifetime_accrued_cents == 0
                             else 100 * O.lifetime_clawed_back_cents / O.lifetime_accrued_cents
      capped_clawback      = min(100, clawback_ratio_pct)

      raw = DUAL_WEIGHT      * dual_ratio_pct
          + SPREAD_WEIGHT    * capped_spread
          + EXCEPTION_WEIGHT * exception_rate_pct
          + CLAWBACK_WEIGHT  * capped_clawback
      # ONE rounding, applied to the fully assembled weighted sum. Rounding the four terms
      # individually and then adding is FORBIDDEN.
      exposure_score   = min(100, max(0, round_half_up(raw)))
      monitoring_status = ELEVATED if exposure_score >= ELEVATED_THRESHOLD else STANDARD
    input_set: |
      LoanApplication rows with status IN {CLOSED, PAID_OFF} only; TAKEN, LOCKED and WITHDRAWN
      loans never enter any term, so a SUBMITTED PricingException on a LOCKED loan does not move
      the score. Ledger terms read Originator.lifetime_accrued_cents and
      lifetime_clawed_back_cents as they stand AFTER the mutation that triggered the recompute.
    constants:
      DUAL_WEIGHT: 0.35
      SPREAD_WEIGHT: 0.25
      EXCEPTION_WEIGHT: 0.15
      CLAWBACK_WEIGHT: 0.25
      SPREAD_CAP_BPS: 100
      ELEVATED_THRESHOLD: 60
    precision: "integer score 0..100, round_half_up once on the assembled weighted sum"

  - name: state_authority_resolution
    trigger: "Recomputed whenever a LicenseRegistration status or expiration_date changes, a
      SponsorshipTransfer status changes, or Originator.employment_status changes; read by
      POST /loan-applications, POST /loan-applications/{id}/lock,
      POST /advertisements/{id}/publish and GET /originators/{id}/authority"
    algorithm: interval_merge
    formula: |
      # A state S is authorised for originator O at instant T iff BOTH intervals cover T.
      #
      # Licence interval  - HALF-OPEN [authority_effective_at, expiration_date)
      # Sponsorship interval - HALF-OPEN [effective_at, relinquished_at), where a null
      #                        relinquished_at means the interval is still open-ended.
      #
      # Adjacency is therefore NOT a gap: a sponsorship relinquished at T immediately followed by
      # one effective at T leaves no unauthorised instant, and an application taken exactly at T
      # is covered by the NEW sponsorship, not the old one.
      authorised(O, S, T) =
        EXISTS LicenseRegistration L with
              L.originator_id == O
          AND L.state_code   == S
          AND L.status IN {ACTIVE, RENEWAL_PENDING}
          AND L.authority_effective_at IS NOT NULL
          AND L.authority_effective_at <= T
          AND T < L.expiration_date
          AND EXISTS SponsorshipTransfer P with
                    P.license_registration_id == L.id
                AND P.effective_at <= T
                AND (P.relinquished_at IS NULL OR T < P.relinquished_at)
        AND O.employment_status == EMPLOYED

      Originator.authorized_state_codes = the set of such S, sorted ascending as strings.
    input_set: |
      Only LicenseRegistration rows in status ACTIVE or RENEWAL_PENDING participate; PENDING,
      EXPIRED, SURRENDERED and REVOKED rows contribute nothing. Only SponsorshipTransfer rows in
      status ACTIVE (relinquished_at null) or status IN {RELINQUISHED, SUPERSEDED} whose
      half-open interval covers T participate.
    constants: {}
    precision: "instant comparison at millisecond resolution; both interval starts are inclusive
      and both ends are exclusive"

  - name: advertising_disclosure_findings
    trigger: "POST /advertisements/{id}/submissions and
      POST /advertisements/{id}/reviews with decision = APPROVE"
    algorithm: aggregation
    formula: |
      findings = empty list

      if Originator.nmls_unique_id NOT IN ad.disclosed_nmls_ids:
          findings += "MISSING_NMLS_ID"

      for S in ad.target_state_codes, iterated in ascending string order:
          L = the LicenseRegistration with originator_id == ad.originator_id AND state_code == S
              AND status IN {ACTIVE, RENEWAL_PENDING}; when more than one such row exists, take
              the one with the greatest created_at (never the greatest id)
          if L does not exist:
              findings += "NO_LICENSE_" + S
          elif L.license_number NOT IN ad.disclosed_license_numbers:
              findings += "MISSING_LICENSE_NUMBER_" + S

      if ad.medium == RADIO AND length(ad.content_text) > RADIO_SCRIPT_MAX_CHARS:
          findings += "RADIO_SCRIPT_TOO_LONG"

      if ad.medium IN {WEB, SOCIAL}
         AND ad.content_text contains "no closing cost" (case-insensitive)
         AND ad.content_text does NOT contain "APR" (case-sensitive):
          findings += "TRIGGER_TERM_WITHOUT_APR"

      Advertisement.disclosure_findings = findings, de-duplicated then sorted ascending as strings
    input_set: |
      The advertisement's own fields plus the originator's LicenseRegistration rows in status
      ACTIVE or RENEWAL_PENDING at the logical clock instant. target_state_codes is iterated in
      ascending string order so the emitted list is deterministic before the final sort.
    constants:
      RADIO_SCRIPT_MAX_CHARS: 300
    precision: "string list, sorted ascending"

# =============================================================================
# 1.4 Validation Rules Table (evaluated strictly in ascending priority order;
#     the FIRST failing row decides the response)
# =============================================================================
validations:

  - priority: 1
    category: auth
    check: "X-User-Role and X-User-ID headers are both present and non-empty. Roles declared
      `opaque` still require X-User-ID; only the Anonymous-free surface exists here, so every
      endpoint demands both headers."
    error_id: ERR_MISSING_AUTH_HEADERS
    http_status: 401
    applies_to: all

  - priority: 2
    category: auth
    check: "X-User-Role is one of the seven roles declared in the RBAC matrix."
    error_id: ERR_UNKNOWN_ROLE
    http_status: 401
    applies_to: all

  - priority: 3
    category: auth
    check: "The role is listed in the called endpoint's `roles:` set."
    error_id: ERR_ROLE_NOT_PERMITTED
    http_status: 403
    applies_to: all

  - priority: 4
    category: auth
    check: "When X-User-Role == Originator, X-User-ID equals the Originator.id the request acts on:
      the body's originator_id on POST /loan-applications and POST /advertisements, and the
      owning originator of the path resource on every /loan-applications/{id}/*,
      /pricing-exceptions/{id}/* and /advertisements/{id}/* action."
    error_id: ERR_ORIGINATOR_IDENTITY_MISMATCH
    http_status: 403
    applies_to: "all endpoints whose roles include Originator"

  - priority: 5
    category: existence
    check: "Every id in the request path resolves to an existing row, validated left to right."
    error_id: ERR_RESOURCE_NOT_FOUND
    http_status: 404
    applies_to: "all endpoints with a path id"

  - priority: 6
    category: existence
    check: "Every foreign-key id in the request body resolves to an existing row: originator_id,
      ce_course_id, compensation_plan_id, loan_application_id."
    error_id: ERR_REFERENCED_RESOURCE_NOT_FOUND
    http_status: 404
    applies_to: "POST /license-registrations, POST /ce-credits, POST /loan-applications,
      POST /advertisements, POST /examination-inquiries,
      POST /originators/{id}/compensation-plan-assignments,
      POST /unlicensed-activity-investigations"

  - priority: 7
    category: business_constraint
    check: "Request body conforms to the endpoint's declared input schema: required fields present,
      types correct, enum members valid, numeric ranges honoured, ISO 8601 timestamps parseable,
      array element formats correct."
    error_id: ERR_INVALID_REQUEST
    http_status: 400
    applies_to: all

  - priority: 8
    category: business_constraint
    check: "limit is an integer in [1, 100] and offset is an integer >= 0."
    error_id: ERR_INVALID_PAGINATION
    http_status: 400
    applies_to: "all GET list endpoints"

  - priority: 9
    category: business_constraint
    check: "Uniqueness: Originator.nmls_unique_id globally, CeCourse.course_code globally,
      ExaminationInquiry.exam_reference globally, and (originator_id, state_code) across
      LicenseRegistration rows whose status IN {PENDING, ACTIVE, RENEWAL_PENDING, EXPIRED}."
    error_id: ERR_DUPLICATE_KEY
    http_status: 409
    applies_to: "POST /originators, POST /ce-courses, POST /examination-inquiries,
      POST /license-registrations"

  - priority: 10
    category: state
    check: "OCC: the request's expected_<parent>_version equals the parent row's current version.
      Evaluated before any state precondition on that parent, so a stale version wins over an
      invalid-state rejection."
    error_id: ERR_STALE_LICENSE_VERSION
    http_status: 412
    applies_to: "POST /license-registrations/{id}/sponsorship-transfers,
      POST /originators/{id}/compensation-plan-assignments (the latter returns
      ERR_STALE_ORIGINATOR_VERSION)"

  - priority: 11
    category: state
    check: "The target row's current state has an outgoing transition matching this trigger in
      §1.2. Covers every non-terminal invalid-from case across all nine state machines."
    error_id: ERR_INVALID_STATE_TRANSITION
    http_status: 409
    applies_to: "all POST action endpoints"

  - priority: 12
    category: state
    check: "The target row is not already in one of its state machine's terminal_states."
    error_id: ERR_ALREADY_TERMINAL
    http_status: 409
    applies_to: "all POST action endpoints"

  - priority: 13
    category: business_safety
    check: "Taking or locking an application requires a LicenseRegistration for
      (originator_id, state_code) with status IN {ACTIVE, RENEWAL_PENDING}. Fires when a licence
      row exists for the state but is in PENDING, EXPIRED, SURRENDERED or REVOKED, and when no
      licence row exists for the state at all."
    error_id: ERR_LICENSE_NOT_ACTIVE
    http_status: 422
    applies_to: "POST /loan-applications, POST /loan-applications/{id}/lock"

  - priority: 14
    category: business_safety
    check: "state_code is present in Originator.authorized_state_codes at the logical clock
      instant per calculations.state_authority_resolution. Fires when the licence is in an
      authorising status but the instant falls outside the half-open licence interval
      [authority_effective_at, expiration_date), or the originator's employment_status is not
      EMPLOYED."
    error_id: ERR_STATE_NOT_AUTHORIZED
    http_status: 422
    applies_to: "POST /loan-applications, POST /loan-applications/{id}/lock,
      POST /advertisements/{id}/publish"

  - priority: 15
    category: business_safety
    check: "The authorising licence has a SponsorshipTransfer whose half-open interval
      [effective_at, relinquished_at) covers the logical clock instant."
    error_id: ERR_SPONSORSHIP_REQUIRED
    http_status: 422
    applies_to: "POST /loan-applications, POST /loan-applications/{id}/lock"

  - priority: 16
    category: business_safety
    check: "Approving a CompensationPlan requires prohibited_variable_count == 0. Any
      CompensationVariable whose variable_type is a term of the transaction (INTEREST_RATE, APR,
      LOAN_TERM_MONTHS, LTV_RATIO, CREDIT_SCORE, PRODUCT_TYPE, PREPAYMENT_PENALTY_FLAG,
      LOAN_PROFITABILITY) makes the plan unapprovable."
    error_id: ERR_PROHIBITED_COMP_VARIABLE
    http_status: 422
    applies_to: "POST /compensation-plans/{id}/approvals with decision = APPROVE"

  - priority: 17
    category: business_safety
    check: "Segregation of duties: the approving X-User-ID differs from
      CompensationPlan.drafted_by_user_id; the deciding X-User-ID differs from
      PricingException.requested_by_user_id; and any second_approver_user_id differs from both the
      deciding X-User-ID and requested_by_user_id."
    error_id: ERR_SEGREGATION_OF_DUTIES
    http_status: 422
    applies_to: "POST /compensation-plans/{id}/approvals,
      POST /pricing-exceptions/{id}/decisions"

  - priority: 18
    category: business_safety
    check: "When PricingException.requires_second_approval == true, an APPROVE decision must carry
      a non-empty second_approver_user_id."
    error_id: ERR_SECOND_APPROVAL_REQUIRED
    http_status: 422
    applies_to: "POST /pricing-exceptions/{id}/decisions with decision = APPROVE"

  - priority: 19
    category: business_safety
    check: "Heightened documentation: when reason_code == PRICING_ERROR the justification_text must
      be at least 120 characters (the generic schema floor is 40)."
    error_id: ERR_JUSTIFICATION_INSUFFICIENT
    http_status: 422
    applies_to: "POST /loan-applications/{id}/pricing-exceptions"

  - priority: 20
    category: business_safety
    check: "Dual compensation: a close reporting both lender_paid_comp_cents > 0 and
      borrower_paid_comp_cents > 0 is rejected while the Originator's monitoring_status is
      ELEVATED. Dual compensation is permitted-but-monitored at STANDARD and hard-blocked under
      enhanced supervision."
    error_id: ERR_DUAL_COMPENSATION_PROHIBITED
    http_status: 422
    applies_to: "POST /loan-applications/{id}/close"

  - priority: 21
    category: business_safety
    check: "Releasing withheld compensation requires every UnlicensedActivityInvestigation with
      loan_application_id = this loan to have status IN {UNSUBSTANTIATED, REMEDIATED}."
    error_id: ERR_UNLICENSED_ACTIVITY_OPEN
    http_status: 422
    applies_to: "POST /loan-applications/{id}/compensation-release"

  - priority: 22
    category: business_safety
    check: "Approving an advertisement requires disclosure_findings to be empty after
      recomputation by calculations.advertising_disclosure_findings."
    error_id: ERR_AD_DISCLOSURE_INCOMPLETE
    http_status: 422
    applies_to: "POST /advertisements/{id}/reviews with decision = APPROVE"

  - priority: 23
    category: business_referential
    check: "The referenced CompensationPlan has status == ACTIVE. Applies to assignment, to close
      (via Originator.compensation_plan_id) and to an APPROVE decision on a pricing exception."
    error_id: ERR_PLAN_NOT_ACTIVE
    http_status: 422
    applies_to: "POST /originators/{id}/compensation-plan-assignments,
      POST /loan-applications/{id}/close, POST /pricing-exceptions/{id}/decisions"

  - priority: 24
    category: business_referential
    check: "Closing a loan requires Originator.compensation_plan_id to be non-null."
    error_id: ERR_NO_ACTIVE_COMP_PLAN
    http_status: 422
    applies_to: "POST /loan-applications/{id}/close"

  - priority: 25
    category: business_referential
    check: "Approving a CompensationPlan requires at least one CompensationVariable child and the
      children's weight_pct values to sum to exactly 100."
    error_id: ERR_PLAN_WEIGHTS_NOT_100
    http_status: 422
    applies_to: "POST /compensation-plans/{id}/approvals with decision = APPROVE"

  - priority: 26
    category: business_referential
    check: "A CE credit's CeCourse must have provider_status == APPROVED."
    error_id: ERR_COURSE_PROVIDER_RESCINDED
    http_status: 422
    applies_to: "POST /ce-credits"

  - priority: 27
    category: business_referential
    check: "When CeCourse.approved_state_codes is non-empty, the originator must hold at least one
      LicenseRegistration whose status IN {PENDING, ACTIVE, RENEWAL_PENDING} and whose state_code
      is a member of approved_state_codes."
    error_id: ERR_COURSE_NOT_APPROVED_IN_STATE
    http_status: 422
    applies_to: "POST /ce-credits"

  - priority: 28
    category: business_temporal
    check: "A renewal request requires renewal_window_opens_at <= logical clock instant <
      expiration_date."
    error_id: ERR_RENEWAL_WINDOW_CLOSED
    http_status: 422
    applies_to: "POST /license-registrations/{id}/renewal-requests"

  - priority: 29
    category: business_temporal
    check: "HALF-OPEN sponsorship geometry on a LicenseRegistration: reject when the incoming
      effective_at falls inside an existing SponsorshipTransfer interval on the same licence, i.e.
      when some row P with status IN {RELINQUISHED, SUPERSEDED} satisfies
      P.effective_at <= new.effective_at < P.relinquished_at, or when new.effective_at is strictly
      before some P.effective_at (back-dating). Adjacency is legal:
      new.effective_at == P.relinquished_at is accepted."
    error_id: ERR_SPONSORSHIP_PERIOD_OVERLAP
    http_status: 409
    applies_to: "POST /license-registrations/{id}/sponsorship-transfers"

  - priority: 30
    category: business_temporal
    check: "CLOSED plan-assignment geometry on an Originator: reject when some CompensationPlan A
      with assigned_originator_id = this originator and status IN {ACTIVE, SUPERSEDED} satisfies
      new.effective_from <= A.assignment_effective_to AND A.assignment_effective_from <=
      new.effective_to. Both endpoints are inclusive, so adjacency IS a collision:
      new.effective_from == A.assignment_effective_to is rejected. At most one assignment may
      cover any instant."
    error_id: ERR_PLAN_PERIOD_OVERLAP
    http_status: 409
    applies_to: "POST /originators/{id}/compensation-plan-assignments"

  - priority: 31
    category: business_temporal
    check: "effective_to must be strictly after effective_from on a plan assignment;
      completion_date must not be after the logical clock instant on a CE credit; payoff_date must
      be >= funded_at on a payoff."
    error_id: ERR_INVALID_DATE_RANGE
    http_status: 422
    applies_to: "POST /originators/{id}/compensation-plan-assignments, POST /ce-credits,
      POST /loan-applications/{id}/payoff"

  - priority: 32
    category: business_temporal
    check: "An examination response requires the logical clock instant <= response_due_at."
    error_id: ERR_RESPONSE_DEADLINE_PASSED
    http_status: 422
    applies_to: "POST /examination-inquiries/{id}/responses"

  - priority: 33
    category: business_fiscal
    check: "Completing a renewal requires ce_satisfied == true after recomputation with the
      MAKEUP_ATTRIBUTION variant, and no CeCreditRecord counted toward ce_reporting_year in
      credit_status VOIDED."
    error_id: ERR_CE_HOURS_INSUFFICIENT
    http_status: 422
    applies_to: "POST /license-registrations/{id}/renewal-completions"

  - priority: 34
    category: business_fiscal
    check: "concession_cents must not exceed CONCESSION_MAX_PCT (2) percent of
      LoanApplication.locked_amount_cents, computed as
      floor(locked_amount_cents * 2 / 100)."
    error_id: ERR_CONCESSION_EXCEEDS_CAP
    http_status: 422
    applies_to: "POST /loan-applications/{id}/pricing-exceptions"

  - priority: 35
    category: business_fiscal
    check: "At close, lender_paid_comp_cents + borrower_paid_comp_cents must not exceed the
      assigned plan's max_fee_cents."
    error_id: ERR_COMP_CAP_EXCEEDED
    http_status: 422
    applies_to: "POST /loan-applications/{id}/close"

  - priority: 36
    category: business_fiscal
    check: "A SUBSTANTIATED finding requires restitution_cents >= 1; an UNSUBSTANTIATED finding
      requires restitution_cents == 0."
    error_id: ERR_RESTITUTION_MISMATCH
    http_status: 422
    applies_to: "POST /unlicensed-activity-investigations/{id}/findings"

  - priority: 37
    category: business_constraint
    check: "Reinstating an EXPIRED licence requires reinstatement_count < 2."
    error_id: ERR_REINSTATEMENT_LIMIT_REACHED
    http_status: 422
    applies_to: "POST /license-registrations/{id}/status-actions with action = REINSTATE"

  - priority: 38
    category: business_constraint
    check: "Surrendering a licence requires that no LoanApplication for that (originator_id,
      state_code) is in status TAKEN or LOCKED."
    error_id: ERR_OPEN_PIPELINE_BLOCKS_SURRENDER
    http_status: 422
    applies_to: "POST /license-registrations/{id}/status-actions with action = SURRENDER"

# =============================================================================
# 1.5 API Endpoint Table
# =============================================================================
endpoints:

  # ---------- Originator ----------
  - method: POST
    path: "/originators"
    description: "Register an individual mortgage loan originator in the compliance system."
    roles: [LicensingAnalyst]
    code: 201
    input: [nmls_unique_id, legal_name, hire_date, "employment_status?"]
    output: Originator
    side_effects:
      - "monitoring_status := STANDARD, exposure_score := 0, all ledger fields := 0,
         authorized_state_codes := []"

  - method: GET
    path: "/originators"
    description: "List originators with filters. Reverse-reachability channel for
      Originator.compensation_plan_id."
    roles: [LicensingAnalyst, CompensationDesigner, ComplianceOfficer, Originator, LoanOperations,
      ExaminationCoordinator, PlatformAdmin]
    code: 200
    input: ["limit?", "offset?", "employment_status?", "monitoring_status?", "compensation_plan_id?"]
    output: Originator[]
    side_effects: []

  - method: GET
    path: "/originators/{id}"
    description: "Fetch one originator including the recomputed ledger and monitoring fields."
    roles: [LicensingAnalyst, CompensationDesigner, ComplianceOfficer, Originator, LoanOperations,
      ExaminationCoordinator, PlatformAdmin]
    code: 200
    input: []
    output: Originator
    side_effects: []

  - method: PATCH
    path: "/originators/{id}"
    description: "Update employment posture; TERMINATED or SUSPENDED strips every state authority."
    roles: [LicensingAnalyst]
    code: 200
    input: [employment_status]
    output: Originator
    side_effects:
      - "recompute authorized_state_codes per calculations.state_authority_resolution"
      - "increments Originator.version by 1"

  - method: GET
    path: "/originators/{id}/authority"
    description: "Computed read: which states the originator may take applications in, evaluated at
      as_of_iso8601 when supplied, otherwise at the logical clock instant."
    roles: [LicensingAnalyst, CompensationDesigner, ComplianceOfficer, Originator, LoanOperations,
      ExaminationCoordinator, PlatformAdmin]
    code: 200
    input: ["as_of_iso8601?"]
    output: "{ originator_id: string, as_of: string, authorized_state_codes: string[], employment_status: string }"
    side_effects: []

  - method: GET
    path: "/originators/{id}/ce-compliance"
    description: "Computed read of calculations.ce_compliance_evaluation. attribution_variant
      defaults to MAKEUP_ATTRIBUTION; reporting_year defaults to the ce_reporting_year of the
      originator's LicenseRegistration with the greatest created_at."
    roles: [LicensingAnalyst, CompensationDesigner, ComplianceOfficer, Originator, LoanOperations,
      ExaminationCoordinator, PlatformAdmin]
    code: 200
    input: ["attribution_variant?", "reporting_year?"]
    output: { originator_id: string, reporting_year: integer, attribution_variant: string, total_hours: integer, federal_law_hours: integer, ethics_hours: integer, nontraditional_hours: integer, ce_satisfied: boolean }
    side_effects: []

  - method: POST
    path: "/originators/{id}/compensation-plan-assignments"
    description: "Assign an ACTIVE CompensationPlan to the originator over a CLOSED interval
      [effective_from, effective_to]. OCC-guarded: a stale expected_originator_version is rejected
      with 412 because the write legitimately supersedes whatever plan the originator carries."
    roles: [ComplianceOfficer]
    code: 201
    input: [compensation_plan_id, effective_from, effective_to, expected_originator_version]
    output: Originator
    side_effects:
      - "CompensationPlan.assigned_originator_id, assignment_effective_from,
         assignment_effective_to := inputs"
      - "the originator's previously assigned ACTIVE plan moves to SUPERSEDED"
      - "Originator.compensation_plan_id := compensation_plan_id"
      - "increments Originator.version by 1"

  - method: POST
    path: "/originators/{id}/compensation-reconciliations"
    description: "Reconcile every ACCRUED CompensationRecord of this originator to the FINAL
      variant. Returns 200 with reconciled_count = 0 when the eligible set is empty."
    roles: [ComplianceOfficer]
    code: 200
    input: []
    output: "{ originator_id: string, reconciled_count: integer, total_final_cents: integer, total_delta_cents: integer, compensation_record_ids: string[] }"
    side_effects:
      - "each eligible CompensationRecord: ACCRUED -> RECONCILED with variant := FINAL"
      - "each owning LoanApplication.compensation_status := RECONCILED"
      - "Originator.lifetime_accrued_cents, net_compensation_cents, exposure_score and
         monitoring_status recomputed"
      - "increments Originator.version by 1"

  # ---------- LicenseRegistration ----------
  - method: POST
    path: "/license-registrations"
    description: "File a state licence for an originator; starts in PENDING with no authority."
    roles: [LicensingAnalyst]
    code: 201
    input: [originator_id, state_code, license_number, issue_date, expiration_date,
      renewal_window_opens_at, ce_reporting_year, "required_ce_hours?"]
    output: LicenseRegistration
    side_effects:
      - "status := PENDING, authority_effective_at := null, ce_hours_applied := 0,
         ce_satisfied := false, reinstatement_count := 0"

  - method: GET
    path: "/license-registrations"
    description: "List licences with filters. Reverse-reachability channel for
      LicenseRegistration.originator_id."
    roles: [LicensingAnalyst, CompensationDesigner, ComplianceOfficer, Originator, LoanOperations,
      ExaminationCoordinator, PlatformAdmin]
    code: 200
    input: ["limit?", "offset?", "originator_id?", "state_code?", "status?"]
    output: LicenseRegistration[]
    side_effects: []

  - method: GET
    path: "/license-registrations/{id}"
    description: "Fetch one licence including ce_hours_applied, ce_satisfied and the denormalised
      sponsorship fields."
    roles: [LicensingAnalyst, CompensationDesigner, ComplianceOfficer, Originator, LoanOperations,
      ExaminationCoordinator, PlatformAdmin]
    code: 200
    input: []
    output: LicenseRegistration
    side_effects: []

  - method: POST
    path: "/license-registrations/{id}/activations"
    description: "PENDING -> ACTIVE. Stamps authority_effective_at from the logical clock."
    roles: [LicensingAnalyst]
    code: 200
    input: []
    output: LicenseRegistration
    side_effects:
      - "authority_effective_at := logical clock instant"
      - "recompute Originator.authorized_state_codes"
      - "increments LicenseRegistration.version by 1"

  - method: POST
    path: "/license-registrations/{id}/renewal-requests"
    description: "ACTIVE -> RENEWAL_PENDING inside the renewal window. Recomputes CE with the
      CALENDAR_YEAR_ATTRIBUTION variant."
    roles: [LicensingAnalyst]
    code: 200
    input: []
    output: LicenseRegistration
    side_effects:
      - "ce_hours_applied and ce_satisfied recomputed with CALENDAR_YEAR_ATTRIBUTION"
      - "increments LicenseRegistration.version by 1"

  - method: POST
    path: "/license-registrations/{id}/renewal-completions"
    description: "RENEWAL_PENDING -> ACTIVE. Recomputes CE with the MAKEUP_ATTRIBUTION variant and
      rolls expiration_date, renewal_window_opens_at and ce_reporting_year forward."
    roles: [LicensingAnalyst]
    code: 200
    input: []
    output: LicenseRegistration
    side_effects:
      - "ce_hours_applied and ce_satisfied recomputed with MAKEUP_ATTRIBUTION before the gate"
      - "expiration_date += 365 days, renewal_window_opens_at += 365 days,
         ce_reporting_year += 1, then ce_hours_applied and ce_satisfied recomputed for the new year"
      - "increments LicenseRegistration.version by 1"

  - method: POST
    path: "/license-registrations/{id}/status-actions"
    description: "Operator licence action: SURRENDER, REVOKE or REINSTATE. REVOKE drives the
      five-hop authority-lapse cascade."
    roles: [LicensingAnalyst]
    code: 200
    input: [action, "note?"]
    output: LicenseRegistration
    side_effects:
      - "SURRENDER / REVOKE: relinquish the ACTIVE SponsorshipTransfer, recompute
         Originator.authorized_state_codes, suspend TAKEN/LOCKED loans in that state, open one
         UnlicensedActivityInvestigation per suspended loan, recompute
         Originator.open_investigation_count"
      - "REINSTATE: reinstatement_count += 1, expiration_date := clock + 365 days,
         renewal_window_opens_at := clock + 305 days, authority_effective_at := clock"
      - "increments LicenseRegistration.version by 1"

  - method: POST
    path: "/license-registrations/{id}/sponsorship-transfers"
    description: "Claim sponsorship of the licence from a given effective_at. Any existing ACTIVE
      sponsorship is SUPERSEDED. OCC-guarded on the licence's version."
    roles: [LicensingAnalyst]
    code: 201
    input: [sponsoring_institution_code, effective_at, expected_license_registration_version]
    output: SponsorshipTransfer
    side_effects:
      - "the licence's ACTIVE SponsorshipTransfer moves to SUPERSEDED with
         relinquished_at := the incoming effective_at and superseded_by_created_at := the incoming
         row's created_at"
      - "LicenseRegistration.active_sponsoring_institution_code and
         active_sponsorship_effective_at := the incoming row's values"
      - "recompute Originator.authorized_state_codes"
      - "increments LicenseRegistration.version by 1"

  - method: GET
    path: "/sponsorship-transfers"
    description: "List sponsorship intervals. Reverse-reachability channel for
      SponsorshipTransfer.license_registration_id."
    roles: [LicensingAnalyst, CompensationDesigner, ComplianceOfficer, Originator, LoanOperations,
      ExaminationCoordinator, PlatformAdmin]
    code: 200
    input: ["limit?", "offset?", "license_registration_id?", "status?"]
    output: SponsorshipTransfer[]
    side_effects: []

  - method: GET
    path: "/sponsorship-transfers/{id}"
    description: "Fetch one sponsorship interval."
    roles: [LicensingAnalyst, CompensationDesigner, ComplianceOfficer, Originator, LoanOperations,
      ExaminationCoordinator, PlatformAdmin]
    code: 200
    input: []
    output: SponsorshipTransfer
    side_effects: []

  - method: POST
    path: "/sponsorship-transfers/{id}/relinquish"
    description: "ACTIVE -> RELINQUISHED, closing the half-open interval at the logical clock."
    roles: [LicensingAnalyst]
    code: 200
    input: []
    output: SponsorshipTransfer
    side_effects:
      - "relinquished_at := logical clock instant"
      - "LicenseRegistration.active_sponsoring_institution_code := null,
         active_sponsorship_effective_at := null; the licence's version increments by 1"
      - "recompute Originator.authorized_state_codes"

  # ---------- Continuing education ----------
  - method: POST
    path: "/ce-courses"
    description: "Add an NMLS-approved course to the catalogue."
    roles: [LicensingAnalyst]
    code: 201
    input: [course_code, credit_hours, category, "approved_state_codes?", "successive_year_blocked?"]
    output: CeCourse
    side_effects: ["provider_status := APPROVED"]

  - method: POST
    path: "/ce-courses/{id}/rescind"
    description: "Mark the provider's approval rescinded; every APPLIED credit sourced from this
      course is voided with void_reason = PROVIDER_RESCINDED."
    roles: [LicensingAnalyst]
    code: 200
    input: []
    output: CeCourse
    side_effects:
      - "provider_status := RESCINDED"
      - "every CeCreditRecord with this ce_course_id and credit_status = APPLIED moves to VOIDED
         with void_reason := PROVIDER_RESCINDED"
      - "every CeCreditRecord suppressed as EXCLUDED_SUCCESSIVE_YEAR solely by one of the credits
         just voided returns to APPLIED"
      - "ce_hours_applied and ce_satisfied recomputed on every affected LicenseRegistration with
         the MAKEUP_ATTRIBUTION variant"

  - method: POST
    path: "/ce-credits"
    description: "Record a completed CE course for an originator. credit_hours, category and
      attributed_year are all server-computed; supplied values for them are ignored."
    roles: [LicensingAnalyst]
    code: 201
    input: [originator_id, ce_course_id, completion_date, reporting_period_year, "is_makeup?"]
    output: CeCreditRecord
    side_effects:
      - "credit_hours and category copied from the CeCourse; attributed_year set per
         calculations.ce_compliance_evaluation step 1"
      - "credit_status := EXCLUDED_SUCCESSIVE_YEAR when step 2 suppresses the row, else APPLIED"
      - "ce_hours_applied and ce_satisfied recomputed with MAKEUP_ATTRIBUTION on every
         LicenseRegistration of this originator"

  - method: GET
    path: "/ce-credits"
    description: "List CE credits with filters. Reverse-reachability channel for both
      CeCreditRecord.originator_id and CeCreditRecord.ce_course_id."
    roles: [LicensingAnalyst, CompensationDesigner, ComplianceOfficer, Originator, LoanOperations,
      ExaminationCoordinator, PlatformAdmin]
    code: 200
    input: ["limit?", "offset?", "originator_id?", "ce_course_id?", "credit_status?", "attributed_year?"]
    output: CeCreditRecord[]
    side_effects: []

  - method: GET
    path: "/ce-credits/{id}"
    description: "Fetch one CE credit including its computed attributed_year and credit_status."
    roles: [LicensingAnalyst, CompensationDesigner, ComplianceOfficer, Originator, LoanOperations,
      ExaminationCoordinator, PlatformAdmin]
    code: 200
    input: []
    output: CeCreditRecord
    side_effects: []

  - method: POST
    path: "/ce-credits/{id}/void"
    description: "Compensating action for a mis-filed credit: removes the hours and restores any
      sibling credit that was suppressed only because of this one."
    roles: [LicensingAnalyst]
    code: 200
    input: []
    output: CeCreditRecord
    side_effects:
      - "credit_status := VOIDED, void_reason := ANALYST_VOID"
      - "every CeCreditRecord in EXCLUDED_SUCCESSIVE_YEAR that was suppressed solely by this row
         returns to APPLIED"
      - "ce_hours_applied and ce_satisfied recomputed with MAKEUP_ATTRIBUTION on every
         LicenseRegistration of this originator, restoring the CE-hours conserved quantity exactly"

  # ---------- Compensation plan design ----------
  - method: POST
    path: "/compensation-plans"
    description: "Draft a compensation plan. Starts in DRAFT with no variables."
    roles: [CompensationDesigner]
    code: 201
    input: [plan_name, base_basis_points, min_fee_cents, max_fee_cents, "salary_cents_per_period?",
      "volume_tier_enabled?", "concession_absorption_enabled?"]
    output: CompensationPlan
    side_effects:
      - "drafted_by_user_id := X-User-ID; status := DRAFT; prohibited_variable_count := 0"

  - method: GET
    path: "/compensation-plans"
    description: "List plans with filters. Reverse-reachability channel for
      CompensationPlan.assigned_originator_id."
    roles: [LicensingAnalyst, CompensationDesigner, ComplianceOfficer, Originator, LoanOperations,
      ExaminationCoordinator, PlatformAdmin]
    code: 200
    input: ["limit?", "offset?", "status?", "assigned_originator_id?"]
    output: CompensationPlan[]
    side_effects: []

  - method: GET
    path: "/compensation-plans/{id}"
    description: "Fetch one plan including prohibited_variable_count and its assignment interval."
    roles: [LicensingAnalyst, CompensationDesigner, ComplianceOfficer, Originator, LoanOperations,
      ExaminationCoordinator, PlatformAdmin]
    code: 200
    input: []
    output: CompensationPlan
    side_effects: []

  - method: POST
    path: "/compensation-plans/{id}/variables"
    description: "Declare a pay variable on a DRAFT plan. permissibility is server-computed from
      variable_type; a terms-of-transaction variable is accepted into the draft but raises
      prohibited_variable_count and blocks approval."
    roles: [CompensationDesigner]
    code: 201
    input: [variable_type, weight_pct, justification_text]
    output: CompensationVariable
    side_effects:
      - "permissibility computed from variable_type"
      - "CompensationPlan.prohibited_variable_count recomputed; the plan's version increments by 1"
      - "append AuditEvent{event_type: PROHIBITED_VARIABLE_BLOCKED} when permissibility
         = PROHIBITED"

  - method: GET
    path: "/compensation-plans/{id}/variables"
    description: "Sub-resource list of a plan's declared variables; reverse-reachability channel for
      CompensationVariable.compensation_plan_id."
    roles: [LicensingAnalyst, CompensationDesigner, ComplianceOfficer, Originator, LoanOperations,
      ExaminationCoordinator, PlatformAdmin]
    code: 200
    input: ["limit?", "offset?"]
    output: CompensationVariable[]
    side_effects: []

  - method: POST
    path: "/compensation-plans/{id}/approvals"
    description: "DRAFT -> ACTIVE (decision = APPROVE) or DRAFT -> REJECTED (decision = REJECT).
      Segregation of duties: the approver's X-User-ID must differ from drafted_by_user_id."
    roles: [ComplianceOfficer]
    code: 200
    input: [decision, "note?"]
    output: CompensationPlan
    side_effects:
      - "approved_by_user_id := X-User-ID"
      - "increments CompensationPlan.version by 1"

  # ---------- Loan applications ----------
  - method: POST
    path: "/loan-applications"
    description: "Take a mortgage application. Rejected unless the originator holds authority in
      state_code at the logical clock instant."
    roles: [Originator]
    code: 201
    input: [originator_id, state_code, borrower_reference, product_type, requested_amount_cents,
      par_rate_bps]
    output: LoanApplication
    side_effects:
      - "application_taken_at := logical clock instant; status := TAKEN;
         compensation_status := NOT_APPLICABLE; authority_flag := VERIFIED"
      - "append AuditEvent{event_type: APPLICATION_TAKEN}"

  - method: GET
    path: "/loan-applications"
    description: "List applications with filters. Reverse-reachability channel for
      LoanApplication.originator_id and LoanApplication.compensation_plan_id."
    roles: [LicensingAnalyst, CompensationDesigner, ComplianceOfficer, Originator, LoanOperations,
      ExaminationCoordinator, PlatformAdmin]
    code: 200
    input: ["limit?", "offset?", "originator_id?", "compensation_plan_id?", "state_code?", "status?",
      "compensation_status?"]
    output: LoanApplication[]
    side_effects: []

  - method: GET
    path: "/loan-applications/{id}"
    description: "Fetch one application including both state dimensions and closed_unit_index."
    roles: [LicensingAnalyst, CompensationDesigner, ComplianceOfficer, Originator, LoanOperations,
      ExaminationCoordinator, PlatformAdmin]
    code: 200
    input: []
    output: LoanApplication
    side_effects: []

  - method: POST
    path: "/loan-applications/{id}/lock"
    description: "TAKEN -> LOCKED. Re-verifies authority at the logical clock instant and records
      the locked note rate and amount."
    roles: [Originator]
    code: 200
    input: [note_rate_bps, locked_amount_cents]
    output: LoanApplication
    side_effects:
      - "note_rate_bps and locked_amount_cents := inputs; compensation_status untouched"
      - "increments LoanApplication.version by 1"

  - method: POST
    path: "/loan-applications/{id}/close"
    description: "LOCKED -> CLOSED. Pins the plan, assigns closed_unit_index and either accrues a
      PROVISIONAL CompensationRecord (authority_flag = VERIFIED) or withholds compensation with
      compensation_status = PENDING."
    roles: [LoanOperations]
    code: 200
    input: [funded_amount_cents, funded_at, lender_paid_comp_cents, borrower_paid_comp_cents,
      file_quality_score, hours_worked_pct]
    output: LoanApplication
    side_effects:
      - "compensation_plan_id := Originator.compensation_plan_id;
         closed_unit_index := 1 + count of the originator's loans already CLOSED or PAID_OFF"
      - "branch A: compensation_status := ACCRUED and one CompensationRecord created with
         variant = PROVISIONAL per calculations.originator_compensation_accrual"
      - "branch B: compensation_status := PENDING and no CompensationRecord created"
      - "Originator.lifetime_accrued_cents, net_compensation_cents, exposure_score and
         monitoring_status recomputed; the originator's version increments by 1"
      - "increments LoanApplication.version by 1"

  - method: POST
    path: "/loan-applications/{id}/payoff"
    description: "CLOSED -> PAID_OFF. Drives the depth-5 clawback cascade when the FINAL
      CompensationRecord is RECONCILED and the payoff lands inside the recapture window."
    roles: [LoanOperations]
    code: 200
    input: [payoff_date]
    output: LoanApplication
    side_effects:
      - "hop 1: compensation_status RECONCILED -> CLAWED_BACK when recapture_pct > 0"
      - "hop 2: the FINAL CompensationRecord RECONCILED -> CLAWED_BACK with days_held,
         recapture_pct and clawback_cents written"
      - "hop 3: Originator.lifetime_clawed_back_cents and net_compensation_cents recomputed"
      - "hop 4: Originator.exposure_score recomputed; monitoring_status := ELEVATED at score >= 60"
      - "hop 5: every SUBMITTED PricingException on this originator's loans sets
         requires_second_approval := true when hop 4 flipped monitoring_status to ELEVATED"
      - "increments LoanApplication.version by 1"

  - method: POST
    path: "/loan-applications/{id}/withdraw"
    description: "TAKEN or LOCKED -> WITHDRAWN; cascades SUBMITTED pricing exceptions to WITHDRAWN."
    roles: [Originator]
    code: 200
    input: []
    output: LoanApplication
    side_effects:
      - "every PricingException on this loan with status = SUBMITTED moves to WITHDRAWN"
      - "compensation_status := NOT_APPLICABLE"
      - "increments LoanApplication.version by 1"

  - method: POST
    path: "/loan-applications/{id}/compensation-release"
    description: "Release compensation withheld at close: compensation_status PENDING -> ACCRUED,
      permitted only once every investigation on the loan has cleared."
    roles: [ComplianceOfficer]
    code: 200
    input: []
    output: LoanApplication
    side_effects:
      - "authority_flag := VERIFIED; one PROVISIONAL CompensationRecord created"
      - "Originator ledger and exposure fields recomputed"
      - "increments LoanApplication.version by 1"

  # ---------- Pricing exceptions ----------
  - method: POST
    path: "/loan-applications/{id}/pricing-exceptions"
    description: "Request a rate/price concession on a LOCKED loan with documented justification.
      requires_second_approval is stamped from the originator's monitoring_status."
    roles: [Originator]
    code: 201
    input: [requested_rate_bps, concession_cents, reason_code, justification_text]
    output: PricingException
    side_effects:
      - "requested_by_user_id := X-User-ID; status := SUBMITTED; comp_impact_cents := 0"
      - "requires_second_approval := (Originator.monitoring_status == ELEVATED)"

  - method: GET
    path: "/pricing-exceptions"
    description: "List pricing exceptions with filters. Reverse-reachability channel for
      PricingException.loan_application_id."
    roles: [LicensingAnalyst, CompensationDesigner, ComplianceOfficer, Originator, LoanOperations,
      ExaminationCoordinator, PlatformAdmin]
    code: 200
    input: ["limit?", "offset?", "loan_application_id?", "status?"]
    output: PricingException[]
    side_effects: []

  - method: GET
    path: "/pricing-exceptions/{id}"
    description: "Fetch one pricing exception including comp_impact_cents and the approval trail."
    roles: [LicensingAnalyst, CompensationDesigner, ComplianceOfficer, Originator, LoanOperations,
      ExaminationCoordinator, PlatformAdmin]
    code: 200
    input: []
    output: PricingException
    side_effects: []

  - method: POST
    path: "/pricing-exceptions/{id}/decisions"
    description: "SUBMITTED -> APPROVED or DENIED. APPROVE runs
      calculations.pricing_exception_net_impact and enforces segregation of duties plus the second
      approver when required; DENY records the decision unconditionally."
    roles: [ComplianceOfficer]
    code: 200
    input: [decision, decision_note, "second_approver_user_id?"]
    output: PricingException
    side_effects:
      - "decided_by_user_id, decided_at, decision_note written"
      - "APPROVE only: comp_impact_cents := calculations.pricing_exception_net_impact output"
      - "APPROVE only: Originator.exposure_score and monitoring_status recomputed"
      - "increments PricingException.version by 1"

  - method: POST
    path: "/pricing-exceptions/{id}/withdraw"
    description: "SUBMITTED -> WITHDRAWN by the requesting originator."
    roles: [Originator]
    code: 200
    input: []
    output: PricingException
    side_effects: ["increments PricingException.version by 1"]

  # ---------- Compensation ledger ----------
  - method: GET
    path: "/compensation-records"
    description: "List commission ledger lines with filters. Reverse-reachability channel for
      CompensationRecord.loan_application_id, .originator_id and .compensation_plan_id."
    roles: [LicensingAnalyst, CompensationDesigner, ComplianceOfficer, Originator, LoanOperations,
      ExaminationCoordinator, PlatformAdmin]
    code: 200
    input: ["limit?", "offset?", "loan_application_id?", "originator_id?", "compensation_plan_id?", "status?",
      "variant?"]
    output: CompensationRecord[]
    side_effects: []

  - method: GET
    path: "/compensation-records/{id}"
    description: "Fetch one ledger line including days_held, recapture_pct and clawback_cents."
    roles: [LicensingAnalyst, CompensationDesigner, ComplianceOfficer, Originator, LoanOperations,
      ExaminationCoordinator, PlatformAdmin]
    code: 200
    input: []
    output: CompensationRecord
    side_effects: []

  # ---------- Advertising ----------
  - method: POST
    path: "/advertisements"
    description: "Draft an advertisement naming an originator and the states it will run in."
    roles: [Originator]
    code: 201
    input: [originator_id, medium, content_text, target_state_codes, "disclosed_nmls_ids?",
      "disclosed_license_numbers?"]
    output: Advertisement
    side_effects: ["status := DRAFT; disclosure_findings := []"]

  - method: GET
    path: "/advertisements"
    description: "List advertisements with filters. Reverse-reachability channel for
      Advertisement.originator_id."
    roles: [LicensingAnalyst, CompensationDesigner, ComplianceOfficer, Originator, LoanOperations,
      ExaminationCoordinator, PlatformAdmin]
    code: 200
    input: ["limit?", "offset?", "originator_id?", "status?"]
    output: Advertisement[]
    side_effects: []

  - method: GET
    path: "/advertisements/{id}"
    description: "Fetch one advertisement including disclosure_findings."
    roles: [LicensingAnalyst, CompensationDesigner, ComplianceOfficer, Originator, LoanOperations,
      ExaminationCoordinator, PlatformAdmin]
    code: 200
    input: []
    output: Advertisement
    side_effects: []

  - method: POST
    path: "/advertisements/{id}/submissions"
    description: "DRAFT -> SUBMITTED; runs calculations.advertising_disclosure_findings and stores
      the finding codes on the row."
    roles: [Originator]
    code: 200
    input: []
    output: Advertisement
    side_effects:
      - "disclosure_findings := calculations.advertising_disclosure_findings output"
      - "increments Advertisement.version by 1"

  - method: POST
    path: "/advertisements/{id}/reviews"
    description: "SUBMITTED -> APPROVED (only when disclosure_findings is empty after
      recomputation) or SUBMITTED -> REJECTED."
    roles: [ComplianceOfficer]
    code: 200
    input: [decision, "note?"]
    output: Advertisement
    side_effects:
      - "disclosure_findings recomputed; reviewed_by_user_id := X-User-ID"
      - "increments Advertisement.version by 1"

  - method: POST
    path: "/advertisements/{id}/revisions"
    description: "REJECTED -> DRAFT with revised copy; the revision loop is unbounded."
    roles: [Originator]
    code: 200
    input: [content_text, "disclosed_nmls_ids?", "disclosed_license_numbers?"]
    output: Advertisement
    side_effects:
      - "content_text and the disclosure arrays replaced; disclosure_findings := [];
         reviewed_by_user_id := null"
      - "increments Advertisement.version by 1"

  - method: POST
    path: "/advertisements/{id}/publish"
    description: "APPROVED -> PUBLISHED; requires authority in every target state at the logical
      clock instant."
    roles: [Originator]
    code: 200
    input: []
    output: Advertisement
    side_effects:
      - "published_at := logical clock instant"
      - "increments Advertisement.version by 1"

  - method: POST
    path: "/advertisements/{id}/withdraw"
    description: "SUBMITTED, APPROVED or PUBLISHED -> WITHDRAWN by compliance."
    roles: [ComplianceOfficer]
    code: 200
    input: ["reason?"]
    output: Advertisement
    side_effects: ["increments Advertisement.version by 1"]

  # ---------- Examinations ----------
  - method: POST
    path: "/examination-inquiries"
    description: "Record a state examination inquiry with a response deadline."
    roles: [ExaminationCoordinator]
    code: 201
    input: [state_code, exam_reference, response_due_at, "originator_id?"]
    output: ExaminationInquiry
    side_effects: ["status := OPEN; opened_at := logical clock instant; response_round_count := 0"]

  - method: GET
    path: "/examination-inquiries"
    description: "List inquiries with filters. Reverse-reachability channel for
      ExaminationInquiry.originator_id."
    roles: [LicensingAnalyst, CompensationDesigner, ComplianceOfficer, Originator, LoanOperations,
      ExaminationCoordinator, PlatformAdmin]
    code: 200
    input: ["limit?", "offset?", "originator_id?", "state_code?", "status?"]
    output: ExaminationInquiry[]
    side_effects: []

  - method: GET
    path: "/examination-inquiries/{id}"
    description: "Fetch one inquiry including response_round_count and escalation_reason."
    roles: [LicensingAnalyst, CompensationDesigner, ComplianceOfficer, Originator, LoanOperations,
      ExaminationCoordinator, PlatformAdmin]
    code: 200
    input: []
    output: ExaminationInquiry
    side_effects: []

  - method: POST
    path: "/examination-inquiries/{id}/responses"
    description: "OPEN or INFO_REQUESTED -> RESPONSE_SUBMITTED; increments response_round_count."
    roles: [ExaminationCoordinator]
    code: 200
    input: [narrative]
    output: ExaminationInquiry
    side_effects:
      - "response_round_count += 1; last_response_at := logical clock instant"
      - "increments ExaminationInquiry.version by 1"

  - method: POST
    path: "/examination-inquiries/{id}/info-requests"
    description: "RESPONSE_SUBMITTED -> INFO_REQUESTED (round limit not yet reached, new 14-day
      deadline) or RESPONSE_SUBMITTED -> ESCALATED once response_round_count >= 3."
    roles: [ExaminationCoordinator]
    code: 200
    input: [request_note]
    output: ExaminationInquiry
    side_effects:
      - "response_due_at := logical clock instant + 14 days on the cyclic branch"
      - "escalation_reason := ROUND_LIMIT_REACHED on the escalation branch"
      - "increments ExaminationInquiry.version by 1"

  - method: POST
    path: "/examination-inquiries/{id}/close"
    description: "RESPONSE_SUBMITTED or ESCALATED -> CLOSED (terminal)."
    roles: [ExaminationCoordinator]
    code: 200
    input: []
    output: ExaminationInquiry
    side_effects: ["increments ExaminationInquiry.version by 1"]

  # ---------- Unlicensed activity ----------
  - method: POST
    path: "/unlicensed-activity-investigations"
    description: "Open an investigation against a loan manually; originator_id is copied from the
      loan and opened_by is set to MANUAL."
    roles: [ComplianceOfficer]
    code: 201
    input: [loan_application_id, trigger_reason]
    output: UnlicensedActivityInvestigation
    side_effects:
      - "originator_id copied from the loan; opened_by := MANUAL; detected_at := logical clock
         instant; status := OPEN"
      - "Originator.open_investigation_count recomputed"

  - method: GET
    path: "/unlicensed-activity-investigations"
    description: "List investigations with filters. Reverse-reachability channel for both
      UnlicensedActivityInvestigation.originator_id and .loan_application_id, and the only
      discovery channel for cascade-created rows."
    roles: [LicensingAnalyst, CompensationDesigner, ComplianceOfficer, Originator, LoanOperations,
      ExaminationCoordinator, PlatformAdmin]
    code: 200
    input: ["limit?", "offset?", "originator_id?", "loan_application_id?", "status?", "opened_by?"]
    output: UnlicensedActivityInvestigation[]
    side_effects: []

  - method: GET
    path: "/unlicensed-activity-investigations/{id}"
    description: "Fetch one investigation including the finding trail."
    roles: [LicensingAnalyst, CompensationDesigner, ComplianceOfficer, Originator, LoanOperations,
      ExaminationCoordinator, PlatformAdmin]
    code: 200
    input: []
    output: UnlicensedActivityInvestigation
    side_effects: []

  - method: POST
    path: "/unlicensed-activity-investigations/{id}/findings"
    description: "OPEN -> SUBSTANTIATED (restitution_cents >= 1) or OPEN -> UNSUBSTANTIATED
      (restitution_cents == 0); rewrites the loan's authority_flag either way."
    roles: [ComplianceOfficer]
    code: 200
    input: [finding, restitution_cents]
    output: UnlicensedActivityInvestigation
    side_effects:
      - "finding_by_user_id := X-User-ID; restitution_cents := input"
      - "LoanApplication.authority_flag := UNAUTHORIZED (SUBSTANTIATED) or VERIFIED
         (UNSUBSTANTIATED); that loan's version increments by 1"
      - "Originator.open_investigation_count recomputed"

  - method: POST
    path: "/unlicensed-activity-investigations/{id}/remediate"
    description: "SUBSTANTIATED -> REMEDIATED once restitution is paid; restores the loan's
      authority_flag to VERIFIED."
    roles: [ComplianceOfficer]
    code: 200
    input: [remediation_note]
    output: UnlicensedActivityInvestigation
    side_effects:
      - "remediated_at := logical clock instant; LoanApplication.authority_flag := VERIFIED"
      - "Originator.open_investigation_count recomputed"

  # ---------- Audit trail ----------
  - method: GET
    path: "/audit-events"
    description: "Tamper-evident compliance trail, ordered by sequence_no ascending."
    roles: [LicensingAnalyst, CompensationDesigner, ComplianceOfficer, Originator, LoanOperations,
      ExaminationCoordinator, PlatformAdmin]
    code: 200
    input: ["limit?", "offset?", "subject_type?", "subject_ref?", "event_type?"]
    output: AuditEvent[]
    side_effects: []

  # ---------- Test-driving surface ----------
  - method: POST
    path: "/_clock/set_current_utc"
    description: "Set the server's logical clock. The startup default is exactly
      2026-08-01T00:00:00Z: before any call to this endpoint the logical clock reads that instant
      and NEVER falls back to real wall-clock time. Every deadline, renewal window, authority
      interval and clawback bucket is evaluated against this logical clock."
    roles: [PlatformAdmin]
    code: 200
    input: [to_iso8601]
    output: { current_utc: string }
    side_effects: ["no entity is mutated; subsequent requests observe the new instant"]

  - method: POST
    path: "/_ops/daily-license-sweep"
    description: "Advance the compliance epoch: expire licences past expiration_date (driving the
      five-hop authority-lapse cascade), expire plan assignments whose interval has ended, and
      escalate examination inquiries past their response_due_at."
    roles: [PlatformAdmin]
    code: 200
    input: []
    output: "{ swept_at: string, expired_license_ids: string[], relinquished_sponsorship_ids: string[], suspended_loan_ids: string[], opened_investigation_ids: string[], escalated_inquiry_ids: string[], unassigned_originator_ids: string[] }"
    side_effects:
      - "every LicenseRegistration in ACTIVE or RENEWAL_PENDING with expiration_date <= the logical
         clock instant moves to EXPIRED and runs the five-hop cascade, processed ordered by
         expiration_date ASC then created_at ASC"
      - "every CompensationPlan with assignment_effective_to < the logical clock instant clears
         Originator.compensation_plan_id on its assigned originator"
      - "every ExaminationInquiry in OPEN or INFO_REQUESTED with response_due_at < the logical clock
         instant moves to ESCALATED with escalation_reason := DEADLINE_MISSED"

# =============================================================================
# 1.6 Error Code Catalog (39 codes; every code is triggerable from §1.5)
# =============================================================================
errors:

  # ---- auth ----
  - id: ERR_MISSING_AUTH_HEADERS
    http: 401
    condition: "X-User-Role or X-User-ID absent or empty on any request."
  - id: ERR_UNKNOWN_ROLE
    http: 401
    condition: "X-User-Role is not one of the seven roles declared in §1.7."
  - id: ERR_ROLE_NOT_PERMITTED
    http: 403
    condition: "The presented role is not in the called endpoint's roles set."
  - id: ERR_ORIGINATOR_IDENTITY_MISMATCH
    http: 403
    condition: "Role Originator but X-User-ID is not the Originator.id the request acts on."

  # ---- existence ----
  - id: ERR_RESOURCE_NOT_FOUND
    http: 404
    condition: "A path id does not resolve to an existing row."
  - id: ERR_REFERENCED_RESOURCE_NOT_FOUND
    http: 404
    condition: "A foreign-key id in the request body (originator_id, ce_course_id,
      compensation_plan_id, loan_application_id) does not resolve."

  # ---- request shape ----
  - id: ERR_INVALID_REQUEST
    http: 400
    condition: "Missing required field, wrong type, unknown enum member, out-of-range number or
      unparseable ISO 8601 timestamp."
  - id: ERR_INVALID_PAGINATION
    http: 400
    condition: "limit outside [1, 100] or offset negative on a list endpoint."
  - id: ERR_DUPLICATE_KEY
    http: 409
    condition: "Duplicate Originator.nmls_unique_id, CeCourse.course_code,
      ExaminationInquiry.exam_reference, or a second non-SURRENDERED/non-REVOKED
      LicenseRegistration for the same (originator_id, state_code)."

  # ---- optimistic concurrency ----
  - id: ERR_STALE_LICENSE_VERSION
    http: 412
    condition: "expected_license_registration_version differs from the parent
      LicenseRegistration.version on POST /license-registrations/{id}/sponsorship-transfers."
  - id: ERR_STALE_ORIGINATOR_VERSION
    http: 412
    condition: "expected_originator_version differs from the parent Originator.version on
      POST /originators/{id}/compensation-plan-assignments."

  # ---- state machine ----
  - id: ERR_INVALID_STATE_TRANSITION
    http: 409
    condition: "The row's current non-terminal state has no outgoing transition for this trigger."
  - id: ERR_ALREADY_TERMINAL
    http: 409
    condition: "The row is already in one of its state machine's terminal_states."

  # ---- licensing and authority ----
  - id: ERR_LICENSE_NOT_ACTIVE
    http: 422
    condition: "No LicenseRegistration for (originator_id, state_code) with status IN
      {ACTIVE, RENEWAL_PENDING} at the logical clock instant."
  - id: ERR_STATE_NOT_AUTHORIZED
    http: 422
    condition: "state_authority_resolution returns NOT_AUTHORIZED for the requested state - the
      licence is fine but no sponsorship interval covers the logical clock instant, or the state
      is outside the sponsoring institution's authorized set."
  - id: ERR_SPONSORSHIP_REQUIRED
    http: 422
    condition: "Taking or locking an application when the authorising licence has no
      SponsorshipTransfer whose half-open [effective_at, relinquished_at) interval covers the
      logical clock instant."
  - id: ERR_SPONSORSHIP_PERIOD_OVERLAP
    http: 409
    condition: "The incoming effective_at falls strictly inside a closed SponsorshipTransfer's
      half-open [effective_at, relinquished_at) interval on the same licence, or is back-dated
      before some existing transfer's effective_at; exact adjacency
      (previous relinquished_at == new effective_at) does NOT collide."
  - id: ERR_RENEWAL_WINDOW_CLOSED
    http: 422
    condition: "A renewal request outside renewal_window_opens_at <= logical clock instant <
      expiration_date."
  - id: ERR_REINSTATEMENT_LIMIT_REACHED
    http: 422
    condition: "Reinstating an EXPIRED licence whose reinstatement_count is already 2."
  - id: ERR_OPEN_PIPELINE_BLOCKS_SURRENDER
    http: 422
    condition: "Surrendering a licence while the originator still has a LoanApplication in
      TAKEN or LOCKED in that state."

  # ---- continuing education ----
  - id: ERR_CE_HOURS_INSUFFICIENT
    http: 422
    condition: "Completing a renewal while ce_satisfied is false after recomputation with the
      MAKEUP_ATTRIBUTION variant, or while some CeCreditRecord counted toward ce_reporting_year is
      in credit_status VOIDED."
  - id: ERR_COURSE_PROVIDER_RESCINDED
    http: 422
    condition: "Filing a CeCreditRecord against a CeCourse whose provider_status is RESCINDED."
  - id: ERR_COURSE_NOT_APPROVED_IN_STATE
    http: 422
    condition: "The CeCourse has a non-empty approved_state_codes and the originator holds no
      LicenseRegistration in status PENDING, ACTIVE or RENEWAL_PENDING whose state_code is a
      member of that set."

  # ---- compensation plan design ----
  - id: ERR_PROHIBITED_COMP_VARIABLE
    http: 422
    condition: "Approving a CompensationPlan whose prohibited_variable_count is >= 1 - at least one
      CompensationVariable carries a term-of-the-transaction variable_type (INTEREST_RATE, APR,
      LOAN_TERM_MONTHS, LTV_RATIO, CREDIT_SCORE, PRODUCT_TYPE, PREPAYMENT_PENALTY_FLAG,
      LOAN_PROFITABILITY)."
  - id: ERR_PLAN_WEIGHTS_NOT_100
    http: 422
    condition: "Approving a CompensationPlan whose permissible variable weight_pct values do not
      total exactly 100."
  - id: ERR_PLAN_NOT_ACTIVE
    http: 422
    condition: "Assigning a CompensationPlan whose status is not ACTIVE."
  - id: ERR_NO_ACTIVE_COMP_PLAN
    http: 422
    condition: "Closing a loan whose originator has compensation_plan_id null."
  - id: ERR_PLAN_PERIOD_OVERLAP
    http: 409
    condition: "An incoming assignment's closed [effective_from, effective_to] interval intersects
      the closed interval of an existing ACTIVE or SUPERSEDED assignment on the same originator;
      exact adjacency (existing assignment_effective_to == new effective_from) DOES collide
      because both bounds are inclusive."
  - id: ERR_DUAL_COMPENSATION_PROHIBITED
    http: 422
    condition: "Closing a loan that reports both lender_paid_comp_cents > 0 and
      borrower_paid_comp_cents > 0 while the Originator's monitoring_status is ELEVATED; the same
      close is permitted-but-monitored at STANDARD."
  - id: ERR_COMP_CAP_EXCEEDED
    http: 422
    condition: "At close, lender_paid_comp_cents + borrower_paid_comp_cents exceeds the assigned
      plan's max_fee_cents."

  # ---- pricing exceptions ----
  - id: ERR_JUSTIFICATION_INSUFFICIENT
    http: 422
    condition: "A pricing exception with reason_code PRICING_ERROR whose justification_text is
      shorter than 120 characters (the generic schema floor of 40 characters is enforced by
      ERR_INVALID_REQUEST at priority 7)."
  - id: ERR_CONCESSION_EXCEEDS_CAP
    http: 422
    condition: "concession_cents exceeds floor(LoanApplication.locked_amount_cents * 2 / 100)."
  - id: ERR_SECOND_APPROVAL_REQUIRED
    http: 422
    condition: "An APPROVE decision on a PricingException with requires_second_approval == true
      carries no non-empty second_approver_user_id."
  - id: ERR_SEGREGATION_OF_DUTIES
    http: 422
    condition: "The acting X-User-ID equals the user who performed the incompatible earlier step -
      CompensationPlan.drafted_by_user_id approving that plan, or
      PricingException.requested_by_user_id deciding that exception - or the supplied
      second_approver_user_id equals either the deciding user or the requester."

  # ---- advertising ----
  - id: ERR_AD_DISCLOSURE_INCOMPLETE
    http: 422
    condition: "Approving or publishing an Advertisement whose recomputed disclosure_findings list
      is non-empty."

  # ---- examinations and investigations ----
  - id: ERR_RESPONSE_DEADLINE_PASSED
    http: 422
    condition: "Submitting an examination response when response_due_at is strictly before the
      logical clock instant."
  - id: ERR_UNLICENSED_ACTIVITY_OPEN
    http: 422
    condition: "Releasing withheld compensation while the loan still carries an
      UnlicensedActivityInvestigation in OPEN or SUBSTANTIATED."
  - id: ERR_RESTITUTION_MISMATCH
    http: 422
    condition: "finding = SUBSTANTIATED with restitution_cents == 0, or finding = UNSUBSTANTIATED
      with restitution_cents >= 1."

  # ---- temporal shape ----
  - id: ERR_INVALID_DATE_RANGE
    http: 422
    condition: "effective_to is not strictly after effective_from on a plan assignment, a CE
      credit's completion_date is after the logical clock instant, or payoff_date is earlier than
      the loan's funded_at."

