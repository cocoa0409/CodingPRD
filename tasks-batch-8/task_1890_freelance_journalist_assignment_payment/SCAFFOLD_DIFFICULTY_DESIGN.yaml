              as: FinanceUser
              as_user_id: "fin-1"
            - call: "POST /freelance-desk/assignments"
              payload: { contributor_id: "${contrib_k}", title: "K-story", brief: "b", commissioned_word_count: 100, deadline_utc: "2026-08-10T00:00:00Z" }
              as: Editor
              captures: { asg_k: $.data.id }
            - call: "POST /freelance-desk/assignments/${asg_k}/offer"
              payload: {}
              as: Editor
            - call: "POST /freelance-desk/assignments/${asg_k}/accept"
              payload: {}
              as: Contributor
              as_user_id: "${contrib_k}"
            - call: "POST /freelance-desk/assignments/${asg_k}/start"
              payload: {}
              as: Contributor
              as_user_id: "${contrib_k}"
            - call: "POST /freelance-desk/assignments/${asg_k}/kill"
              payload: {}
              as: Editor
            - call: "POST /freelance-desk/assignments/${asg_k}/invoices"
              payload: { fee_claim_cents: 20000, expense_claim_cents: 0 }
              as: Contributor
              as_user_id: "${contrib_k}"
              captures: { inv_k: $.data.id }
            - call: "POST /freelance-desk/invoices/${inv_k}/verify"
              payload: { decision: "VERIFY" }
