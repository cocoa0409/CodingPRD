            - { call: "POST /api/forage-tests", payload: { bale_lot_id: "${lot10_id}", sample_date: "2026-08-01" }, as: BrokerOps, captures: { t10_id: "$.data.id" } }
            - { call: "POST /api/forage-tests/${t10_id}/submit", payload: { lab_reference: "LAB-J" }, as: LabTechnician, as_user_id: "tech-1" }
