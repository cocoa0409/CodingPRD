              payload: { district_id: "${bx_d_id}", legal_name: "Bayfront Court Inn", boundary_zone: "ZONE_CORE", classification: "LIMITED_SERVICE", room_count: 90, prior_year_gross_room_revenue_cents: 40000000, operator_contact_email: "ops@bayfrontcourt.example" }
              as: DistrictAdministrator
              as_user_id: "admin-01"
