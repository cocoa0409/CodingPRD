            - call: "POST /delivery-slots"
              payload: { route_id: "${route_id}", window_start: "2026-08-05T14:00:00.000Z", window_end: "2026-08-05T16:00:00.000Z", total_capacity_units: 10, withheld_units: 0 }
              as: FulfillmentAdmin
              as_user_id: "admin-1"
