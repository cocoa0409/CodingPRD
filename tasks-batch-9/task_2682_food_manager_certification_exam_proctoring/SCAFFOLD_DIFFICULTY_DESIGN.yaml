              as: PlatformAdmin
              captures: { site_id: $.data.id }
            - call: "POST /candidates"
              payload: { full_name: "Ana Ruiz", email: "ana@x.test", preferred_language: "EN", training_provider_id: "${prov_id}", jurisdiction_id: "${jur_id}" }
              as: ProviderAdmin
              as_user_id: "${prov_id}"
              captures: { cand_id: $.data.id }
            - call: "POST /proctors"
              payload: { full_name: "Ivan Cole", email: "ivan@x.test", training_provider_id: "${prov_id}", roles_held: ["PROCTOR", "INSTRUCTOR"], languages_certified: ["EN", "ES"], remote_certified: true }
              as: ProviderAdmin
              as_user_id: "${prov_id}"
              captures: { proc_id: $.data.id }
            - call: "POST /proctors/${proc_id}/registration-decision"
              payload: { decision: "APPROVE" }
              as: PlatformAdmin
            - call: "POST /access-code-batches"
              payload: { training_provider_id: "${prov_id}", exam_form_id: "${form_id}", line_items: [{ bundle_type: "EXAM_ONLY", quantity: 25 }, { bundle_type: "COURSE_PLUS_EXAM", quantity: 1 }], expires_at: "2027-06-30T00:00:00Z" }
              as: ProviderAdmin
              as_user_id: "${prov_id}"
              captures: { batch_id: $.data.id, batch_v1: $.data.version }
            - call: "POST /access-code-batches/${batch_id}/assignments"
