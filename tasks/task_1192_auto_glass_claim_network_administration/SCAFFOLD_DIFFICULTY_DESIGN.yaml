  - rule_id: non_linear_state_machine
    instances:
      - name: claim_supplement_reverify_cycle
        grounds:
          - state_machines.Claim.COVERAGE_VERIFIED_to_SUBMITTED
          - state_machines.Claim.SUBMITTED_to_COVERAGE_VERIFIED
          - entities.Claim.fields.deductible_applied_cents
        distinguishing_aspect: |
          Claim entity revision cycle COVERAGE_VERIFIED -> SUBMITTED ->
          COVERAGE_VERIFIED: the supplement re-opens the claim, resets the final
          deductible basis to null, and recomputes the provisional responsibility
          from the revised estimate; non-linear shape on Claim, distinct from the
          Invoice and WorkOrder cycles.
        test_recipe:
          setup:
            - "AZ regulation: zero_deductible_windshield=false, glass_sales_tax_rate_bp=560, max_deductible_cents=null"
            - "Policyholder with ACTIVE COMPREHENSIVE policy deductible 50000"
            - "Claim (est 40000) COVERAGE_VERIFIED with deductible_applied 50000 basis computed"
          setup_api_calls:
            - call: "POST /state-regulations"
              payload: { state_code: "AZ", zero_deductible_windshield: false, glass_sales_tax_rate_bp: 560 }
              as: NetworkAdmin
            - call: "POST /policyholders"
              payload: { full_name: "Supp Loop", email: "supp@x.com", phone: "555-0301", state_code: "AZ" }
              as: NetworkAdmin
              captures: { ph_id: $.data.id }
            - call: "POST /policies"
              payload: { policyholder_id: "${ph_id}", policy_number: "PN-AZ-1", state_code: "AZ", coverage_type: "COMPREHENSIVE", deductible_cents: 50000, oem_endorsement: false, effective_start_date: "2026-01-01", effective_end_date: "2027-01-01" }
              as: NetworkAdmin
              captures: { pol_id: $.data.id }
            - call: "POST /claims"
              payload: { policy_id: "${pol_id}", incident_state_code: "AZ", service_zip_code: "85001", part_category: "WINDSHIELD", loss_date: "2026-04-15", description: "initial", requires_adas_calibration: false, estimated_repair_cost_cents: 40000 }
              as: Policyholder
              as_user_id: "${ph_id}"
              captures: { claim_id: $.data.id }
            - call: "POST /claims/${claim_id}/verify-coverage"
              payload: {}
              as: ClaimAdjuster
          trigger:
            - call: "POST /claims/${claim_id}/supplement"
              payload: { additional_damage_description: "more damage found", revised_estimated_repair_cost_cents: 90000 }
              as: Policyholder
              as_user_id: "${ph_id}"
            - call: "POST /claims/${claim_id}/verify-coverage"
              payload: {}
              as: ClaimAdjuster
          assert:
            - "after supplement: Claim.${claim_id}.status == SUBMITTED and estimated_repair_cost_cents == 90000"
            - "after supplement: Claim.${claim_id}.provisional_customer_responsibility_cents == 50000 (min(50000, 90000))"
            - "after supplement: Claim.${claim_id}.deductible_applied_cents == null (final basis reset until re-verify)"
            - "after second verify-coverage: Claim.${claim_id}.status == COVERAGE_VERIFIED and deductible_applied_cents == 50000"
            - "Claim.${claim_id}.version == 4 (create 1, verify 2, supplement 3, verify 4)"

