              as: DestructionOfficer
              as_user_id: "officer-12"
              captures: { e_void: $.data.error_id }
          assert:
            - "${e_void} == \"ERR_INVALID_CERTIFICATE_STATE\" with HTTP status == 409"
            - "DestructionCertificate.${cert1}.status == \"VOIDED\" and DestructionCertificate.${cert1}.version == ${cert1_v} (unchanged)"
            - "DestructionCertificate.${cert1}.void_reason == \"destroyed unit count mis-keyed at the scale\" (the second reason was not recorded)"
            - "Kit.${kit}.status == \"RECEIVED\""
            - "SponsorshipProgram.${prog}.reserved_cents == 1465, committed_cents == 0 and available_cents == 498535"
            - "TreatmentFacility.${fac}.pending_intake_units == 60, destroyed_units_total == 0 and certificates_issued_count == 1"
            - "GET /sharps/ledger-entries?sponsorship_program_id=${prog} returns total_count == 5 (no second compensation pair was appended)"

      # ---- corners the §1.8 difficulty design already owns -----------------
      - name: kit_return_to_patient_reopens_the_filling_cycle
        claim_type: valid_transition
        grounds:
          - state_machines.Kit.RECEIVED_to_RETURNED_TO_PATIENT
          - state_machines.Kit.RETURNED_TO_PATIENT_to_ACTIVE_FILLING
          - complexity_profile.state_machine_shape.cyclic
        distinguishing_aspect: "The cyclic shape: a kit that reached the facility can be sent back and re-enter ACTIVE_FILLING, so RECEIVED is not terminal and the fill/seal/ship loop runs a second time on the same kit row."
        excluded_because:
          difficulty_instance: kit_cycles_back_to_active_filling_after_return_to_patient
          rationale: "That §1.8 non-linear-state-machine instance walks the full loop (RECEIVED -> RETURNED_TO_PATIENT -> ACTIVE_FILLING -> SEALED -> new label) and asserts the re-seal and second shipment, which subsumes the plain cycle claim."

      - name: shipment_transport_and_conformance_axes_are_independent
        claim_type: valid_transition
        grounds:
          - state_machines.Shipment.dimension.transport_status
          - state_machines.Shipment.dimension.conformance_status
          - complexity_profile.state_machine_shape.parallel
        distinguishing_aspect: "Two dimensions on one row: a transport event never writes conformance_status and a screening never writes transport_status, so the combined state is a product, not a chain."
        excluded_because:
          difficulty_instance: shipment_parallel_transport_and_conformance_dimensions_advance_independently
          rationale: "The §1.8 non-linear-state-machine instance already drives both axes in interleaved order and asserts each axis is untouched by the other's event, including the DELIVERED-before-screening ordering gate."

      - name: nonconforming_screening_suspends_the_patient_and_cascades_down
        claim_type: side_effect_execution
        grounds:
          - state_machines.Shipment.UNSCREENED_to_NON_CONFORMING
          - state_machines.Patient.ENROLLED_to_SUSPENDED
          - calculations.patient_risk_score
        distinguishing_aspect: "Cascade down: one screening opens a NonConformanceEvent, recomputes the risk score, and only when the score crosses the threshold does it suspend the patient, pause enrollments, void ISSUED kits and release reservations."
        excluded_because:
          difficulty_instance: nonconforming_screening_cascades_to_patient_suspension_enrollment_pause_and_reservation_release
          rationale: "That §1.8 transitive-cascade instance asserts all five hops with exact cent and unit figures; a separate corner test would re-run the same chain."

      - name: lost_shipment_cascade_releases_label_kit_reservation_and_program_status
        claim_type: side_effect_execution
        grounds:
          - state_machines.Shipment.TENDERED_to_LOST
          - state_machines.Kit.IN_TRANSIT_to_VOIDED
          - state_machines.SponsorshipProgram.EXHAUSTED_to_ACTIVE
        distinguishing_aspect: "A four-hop compensation triggered by a carrier scan rather than by an operator: label void, kit void, reservation release plus capacity release, and program un-exhaust."
        excluded_because:
          difficulty_instance: shipment_lost_cascades_to_kit_void_reservation_release_and_program_unexhaust
          rationale: "The §1.8 transitive-cascade instance walks exactly this chain from an EXHAUSTED program and asserts the un-exhaust flip, which is the only interesting terminal hop."

      - name: kit_void_restores_the_program_available_balance
        claim_type: side_effect_execution
        grounds:
          - state_machines.Kit.ISSUED_to_VOIDED
          - entities.SponsorshipProgram.fields.available_cents
          - endpoints.POST /sharps/kits/{id}/void
        distinguishing_aspect: "Ledger sync: the reservation release must return available_cents to the exact pre-issuance figure, with no cent of drift left behind by the round_half_up transport component."
        excluded_because:
          difficulty_instance: kit_void_restores_program_available_cents_exactly
          rationale: "The §1.8 compensating-invariant instance issues and voids repeatedly and asserts the triple returns to its opening value each time, which is strictly stronger than a single void assertion."

      - name: paused_enrollment_blocks_the_kit_seal
        claim_type: precondition_enforcement
        grounds:
          - state_machines.Kit.ACTIVE_FILLING_to_SEALED
          - validations[priority 6].state
          - errors[ERR_INVALID_ENROLLMENT_STATE]
        distinguishing_aspect: "A guarded transition on a DIFFERENT entity: the kit is in the right state and the payload is valid, yet the seal fails because the parent enrollment is PAUSED."
        excluded_because:
          difficulty_instance: kit_seal_blocked_when_enrollment_paused
          rationale: "That §1.8 cross-entity-state-dependency instance already contrasts the blocked seal against the identical seal succeeding after REINSTATE."

      - name: suspended_facility_blocks_destruction_certification
        claim_type: precondition_enforcement
        grounds:
          - state_machines.TreatmentFacility.ACTIVE_to_SUSPENDED
          - validations[priority 23].cross_entity
          - errors[ERR_INVALID_FACILITY_STATE]
        distinguishing_aspect: "The facility already holds the waste, so suspension does not unwind custody — it only forbids the certificate, leaving pending_intake_units booked."
        excluded_because:
          difficulty_instance: certificate_issuance_blocked_when_treatment_facility_suspended
          rationale: "The §1.8 cross-entity-state-dependency instance asserts both the 422 and the untouched custody units, then reinstates and certifies successfully."

  # ===========================================================================
  # §1.3 CALCULATIONS
  # ===========================================================================
  - section: calculations
    instances:
      - name: risk_decay_bands_switch_at_ninety_and_one_hundred_eighty_days_of_event_age
        claim_type: decay_function
        grounds:
          - calculations.patient_risk_score
          - calculations.patient_risk_score.constants.DECAY_FRESH_MAX_AGE_DAYS
          - calculations.patient_risk_score.constants.DECAY_HALF_MAX_AGE_DAYS
          - endpoints.POST /sharps/auto-ship-runs
          - endpoints.POST /_clock/set_current_utc
        distinguishing_aspect: "One NonConformanceEvent of weight 45 is re-scored at four clock instants: age 90 -> 45 (full), age 91 -> 23 (half of 45 is 22.5, rounded half-up ONCE), age 180 -> still 23, age 181 -> 0 (the event stops contributing entirely). The AUDIT variant stays at 45 at every instant because it applies no decay."
        test_recipe:
          setup:
            - "Clock at 2026-08-01T00:00:00Z for the whole build-out; CA rule (notification deadline 72 h); ACTIVE spec; facility \"CA-TF-0001\" capacity 200."
            - "MANUFACTURER sponsor, program 500000 / 5000; patient Dana (INSULIN_PEN_NEEDLES, 20/week) ENROLLED; enrollment ACTIVE, cadence 30, 3 kits authorized, next_autoship_due_date 2026-08-31."
            - "Kit ONE_QUART issued, acknowledged, sealed at 60 units / 1200 g, labelled, tendered for intake 2026-08-05, delivered, then screened NON_CONFORMING with reason_code LOOSE_SHARPS_IN_BOX (weight 45) at 2026-08-01T00:00:00Z."
            - "So exactly one NonConformanceEvent exists with created_at 2026-08-01T00:00:00Z, Patient.screening_risk_score == 45 and Patient.status still ENROLLED (45 < 60)."
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
