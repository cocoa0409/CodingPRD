            - { call: "POST /api/campaigns", payload: { advertiser_id: "${adv}", name: "C2", start_date: "2026-08-01", end_date: "2026-09-30" }, as: SalesPlanner, captures: { camp2: $.data.id } }
            - { call: "POST /api/flights", payload: { campaign_id: "${camp1}", face_id: "${f1}", rate_card_id: "${rc}", start_date: "2026-08-10", end_date: "2026-09-06", expected_face_version: "${f1_v}" }, as: SalesPlanner }
            - { call: "POST /api/flights", payload: { campaign_id: "${camp2}", face_id: "${f2}", rate_card_id: "${rc}", start_date: "2026-08-10", end_date: "2026-09-06", expected_face_version: "${f2_v}" }, as: SalesPlanner }
            - { call: "PUT /api/campaigns/${camp2}", payload: { status: "SUBMITTED" }, as: SalesPlanner }
          trigger:
