  - rule_id: resource_temporal_overlap
    instances:

      - name: coverage_interval_half_open_adjacency_versus_overlap
        grounds:
          - validations[priority 11 — half-open [coverage_start, coverage_end) overlap per program]
          - errors.ERR_COVERAGE_OVERLAP
          - entities.ResidualBatch.fields.coverage_start
          - entities.ResidualBatch.fields.coverage_end
        distinguishing_aspect: |
          The interval is HALF-OPEN per program: with B1 covering
          [2026-07-01, 2026-08-10), a batch starting exactly on 2026-08-10 is accepted
          (touching endpoints do not overlap) while one starting 2026-08-05 and ending
          2026-08-09 — strictly inside B1 and disjoint from B2 — is rejected. A closed
          -interval implementation rejects the adjacent batch; an open-interval one
          accepts the enclosed batch. Only the half-open reading passes both calls.
        test_recipe:
          setup:
            - "Program P1 with a single batch B1 for 2026-07 covering [2026-07-01, 2026-08-10) — a deliberately ragged processor window that spills into August."
            - "A second batch B2 for 2026-08 is then ingested starting exactly on B1's exclusive end date and must be accepted."
          setup_api_calls:
            - call: "POST /processor-programs"
              payload: { name: "FirstAtlantic Core", buy_rate_bps: 45, buy_rate_per_item_cents: 6, assessment_bps: 13, normalization_mode: "NET_REVENUE_SPLIT" }
              as: IsoAdmin
              captures: { p1: $.data.id }
            - call: "POST /residual-batches"
              payload: { processor_program_id: "${p1}", period_month: "2026-07", coverage_start: "2026-07-01", coverage_end: "2026-08-10", file_checksum: "sha256:ov-0001" }
              as: ResidualAnalyst
              captures: { b1: $.data.id }
          trigger:
            - call: "POST /residual-batches"
              payload: { processor_program_id: "${p1}", period_month: "2026-08", coverage_start: "2026-08-10", coverage_end: "2026-09-01", file_checksum: "sha256:ov-0002" }
              as: ResidualAnalyst
              captures: { b2: $.data.id }
            - call: "POST /residual-batches"
              payload: { processor_program_id: "${p1}", period_month: "2026-08", coverage_start: "2026-08-05", coverage_end: "2026-08-09", file_checksum: "sha256:ov-0003" }
              as: ResidualAnalyst
              is_negative_trigger: true
              captures: { err: $.data.error_id }
            - call: "POST /residual-batches"
              payload: { processor_program_id: "${p1}", period_month: "2026-06", coverage_start: "2026-06-01", coverage_end: "2026-07-01", file_checksum: "sha256:ov-0004" }
              as: ResidualAnalyst
              captures: { b4: $.data.id }
          assert:
            - "first trigger call: HTTP 201; ResidualBatch.${b2}.coverage_start == 2026-08-10 and state == RECEIVED   # touching endpoints are adjacent, not overlapping"
            - "second trigger call: HTTP 409 with error_id == ERR_COVERAGE_OVERLAP   # [08-05, 08-09) lies strictly inside B1 and does not touch B2"
            - "third trigger call: HTTP 201; ResidualBatch.${b4}.coverage_end == 2026-07-01, adjacent to B1 from below"
            - "GET /residual-batches?processor_program_id=${p1} returns total_count 3 (B1, B2, B4) — the rejected ingest created nothing"

      - name: advance_recoupment_window_excludes_statement_period
        grounds:
          - calculations.advance_recoupment_schedule (input_set — closed month window)
          - entities.AgentAdvance.fields.first_recoupment_month
          - entities.AgentAdvance.fields.last_recoupment_month
          - entities.Agent.fields.advance_outstanding_cents
          - state_machines.AgentStatement.lifecycle_DRAFT_to_ISSUED
        distinguishing_aspect: |
          Two identical STRAIGHT_LINE advances (principal 30000 over 6 months, both
          funded 2026-07-05) sit on two identical 14643 statements for 2026-07; the only
          difference is the window's left edge. AX's window opens in 2026-08, so the
          2026-07 statement falls OUTSIDE the closed [first, last] month interval and
          recoups exactly 0 while the advance stays fully outstanding; AY's window opens
          in 2026-07 and recoups 5000. Month-string comparison, not funded_on, decides.
        test_recipe:
          setup:
            - "Program P1; agents AX and AY (split 0.45), each owning one merchant with the canonical July line and both chargebacks."
            - "One POSTED 2026-07 batch carrying both lines, giving each agent a DRAFT statement of 14643."
            - "AX: STRAIGHT_LINE advance, principal 30000, 6 instalments, window 2026-08..2027-01. AY: identical advance with window 2026-07..2026-12."
