  # Rule 9 — compensating-action invariants across different conserved quantities
  - rule_id: compensating_invariant
    instances:
      - name: judgment_ledger_conservation
        grounds:
          - calculations.collection_waterfall
          - entities.Judgment.fields.outstanding_balance_cents
          - entities.CollectionEntry.fields.reversal_of_id
        distinguishing_aspect: |
          Conserved quantity: money (cents). Invariant: total_awarded_cents ==
          outstanding_balance_cents + (sum PAYMENT - sum REVERSAL) + sum WRITE_OFF.
          A PAYMENT followed by its REVERSAL must leave outstanding exactly unchanged;
          a subsequent WRITE_OFF reduces it with no drift.
        test_recipe:
          setup:
            - "One CA judgment: rent 100000, damages 5000, late fees 2000, costs 1000, interest 0 (due date == entry date) -> total 108000, outstanding 108000"
          setup_api_calls:
            - { call: "POST /api/landlords", payload: { legal_name: "L1 LLC", contact_email: "l1@x.com" }, as: PlatformAdmin, captures: { ll: $.data.id } }
            - { call: "POST /api/units", payload: { landlord_id: "${ll}", jurisdiction_code: "CA", street_address: "1 A St", unit_label: "A" }, as: Landlord, as_user_id: "${ll}", captures: { u: $.data.id } }
            - { call: "POST /api/tenancies", payload: { unit_id: "${u}", tenant_full_name: "T A", monthly_rent_cents: 150000, lease_start_date: "2026-01-01" }, as: Landlord, as_user_id: "${ll}", captures: { t: $.data.id } }
            - { call: "POST /api/cases", payload: { tenancy_id: "${t}", case_reason: "NONPAYMENT" }, as: Landlord, as_user_id: "${ll}", captures: { c: $.data.id, cv: $.data.version } }
            - { call: "POST /api/_clock/set_current_utc", payload: { to_iso8601: "2026-05-02T08:00:00Z" }, as: PlatformAdmin }
            - { call: "POST /api/cases/${c}/notices", payload: { notice_type: "PAY_OR_QUIT", served_on: "2026-05-02", claimed_rent_owed_cents: 100000, expected_case_version: "${cv}" }, as: Landlord, as_user_id: "${ll}" }
            - { call: "POST /api/_clock/set_current_utc", payload: { to_iso8601: "2026-05-06T00:00:01Z" }, as: PlatformAdmin }
            - { call: "POST /api/ops/runs", payload: {}, as: CourtClerk }
            - { call: "POST /api/cases/${c}/filing-packages", payload: { claimed_amount_cents: 100000, defendant_names: ["Dee A"], jury_demanded: false, efiled: false }, as: Landlord, as_user_id: "${ll}", captures: { p: $.data.id } }
            - { call: "POST /api/filing-packages/${p}/fee-payments", payload: { amount_cents: 27250 }, as: Landlord, as_user_id: "${ll}" }
            - { call: "POST /api/filing-packages/${p}/review", payload: { decision: "ACCEPT" }, as: CourtClerk, as_user_id: "clerk-a" }
            - { call: "POST /api/_clock/set_current_utc", payload: { to_iso8601: "2026-06-01T11:00:00Z" }, as: PlatformAdmin }
            - { call: "POST /api/cases/${c}/service-attempts", payload: { defendant_name: "Dee A", method: "PERSONAL", result: "SERVED", served_at: "2026-06-01T10:00:00Z" }, as: ProcessServer, as_user_id: "ps-1" }
            - { call: "POST /api/cases/${c}/hearings", payload: { courtroom: "CR-1", start_at: "2026-06-15T10:00:00Z", end_at: "2026-06-15T10:30:00Z" }, as: CourtClerk, as_user_id: "clerk-a", captures: { h: $.data.id } }
            - { call: "POST /api/hearings/${h}/conclude", payload: {}, as: CourtClerk, as_user_id: "clerk-a" }
            - { call: "POST /api/_clock/set_current_utc", payload: { to_iso8601: "2026-06-20T12:00:00Z" }, as: PlatformAdmin }
            - { call: "POST /api/cases/${c}/judgment", payload: { possession_granted: true, rent_awarded_cents: 100000, damages_cents: 5000, late_fee_cents: 2000, court_costs_cents: 1000, oldest_unpaid_due_date: "2026-06-20" }, as: CourtClerk, as_user_id: "clerk-b", captures: { j: $.data.id, total: $.data.total_awarded_cents } }
          trigger:
            - { call: "POST /api/judgments/${j}/collection-entries", payload: { entry_type: "PAYMENT", amount_cents: 50000 }, as: Landlord, as_user_id: "${ll}", captures: { e1: $.data.id, out1: $.data.resulting_outstanding_cents } }
            - { call: "POST /api/judgments/${j}/collection-entries", payload: { entry_type: "REVERSAL", amount_cents: 50000, reversal_of_id: "${e1}" }, as: Landlord, as_user_id: "${ll}", captures: { e2: $.data.id, out2: $.data.resulting_outstanding_cents } }
            - { call: "POST /api/judgments/${j}/collection-entries", payload: { entry_type: "WRITE_OFF", amount_cents: 8000 }, as: Landlord, as_user_id: "${ll}", captures: { e3: $.data.id, out3: $.data.resulting_outstanding_cents } }
            - { call: "GET /api/collection-entries/${e1}", payload: {}, as: CourtClerk, captures: { e1_rev: $.data.reversed_by_id } }
            - { call: "GET /api/judgments/${j}", payload: {}, as: CourtClerk, captures: { j_out: $.data.outstanding_balance_cents, j_status: $.data.status } }
          assert:
            - "total == 108000"
            - "out1 == 58000 after PAYMENT 50000 (waterfall: costs 1000, late 2000, damages 5000, interest 0, rent 42000)"
            - "out2 == 108000 after REVERSAL of the full payment (forward + compensating action conserve the total exactly)"
            - "e1_rev == e2 (reversal links back to the payment)"
            - "out3 == 100000 after WRITE_OFF 8000"
            - "j_out == 100000 and j_status == ENTERED (invariant: 100000 + (50000 - 50000) + 8000 == 108000)"

