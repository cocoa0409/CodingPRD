              payload: { borrower_id: "${brw_id}", employer_ein: "12345", employer_type: "GOVERNMENT_FEDERAL", period_start_on: "2026-01-01", period_end_on: "2099-12-31", weekly_hours: 40 }
              as: LoanServicer
              as_user_id: "svc-1"
              captures: { err: $.data.error_id }
          assert:
            - "response.error_id == ERR_CERTIFICATION_FIELDS_INVALID"

      - name: va_doc_supplied_for_non_veteran_discharge_returns_invalid
        claim_type: Violation → Error
        grounds:
          - validations[priority=29]
          - errors[ERR_VA_DOC_REQUIRED_OR_FORBIDDEN]
        distinguishing_aspect: "POST /discharge-applications with discharge_type=DEATH AND va_certification_doc_id non-null returns 422 ERR_VA_DOC_REQUIRED_OR_FORBIDDEN."
        test_recipe:
          setup: ["One Borrower exists."]
          setup_api_calls:
            - call: "POST /v1/_clock/advance"
              payload: { to_iso8601: "2026-06-01T00:00:00Z" }
              as: LoanServicer
              as_user_id: "svc-1"
            - call: "POST /v1/borrowers"
              payload: { ssn_last4: "2121", full_name: "VA Forb", date_of_birth: "1990-01-01", email: "vaforb@example.com" }
              as: LoanServicer
              as_user_id: "svc-1"
              captures: { brw_id: $.data.id }
