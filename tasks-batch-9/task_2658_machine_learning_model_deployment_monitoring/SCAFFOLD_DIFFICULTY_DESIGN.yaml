              captures: { e3_err: $.data.error_id }
          assert:
            - "initial states: ChallengerEvaluation.${ev_id}.status == 'SCHEDULED' at creation with extension_count 0, then 'COLLECTING' after start"
            - "conclude 1 (labeled 500 < MIN_LABELED_PREDICTIONS 1000, promotion_score 0.0437 >= 0.0300): criteria_failures == ['INSUFFICIENT_LABELS'] exactly, so status == 'INCONCLUSIVE', not 'REJECTED'"
            - "conclude 1 releases the reservation: ModelVersion.${v2_id}.evaluation_sample_budget == 5000"
            - "extend 1: status back to 'COLLECTING', extension_count == 1, evaluation_ends_at == '2026-08-22T00:00:00Z', reserved_samples == 1500, criteria_failures == []"
            - "after extend 1: ModelVersion.${v2_id}.evaluation_sample_budget == 3500"
            - "conclude 2 at clock 2026-08-23 (labeled 800): status == 'INCONCLUSIVE' again — the cycle is re-entered, not a terminal state"
            - "extend 2: extension_count == 2, evaluation_ends_at == '2026-08-29T00:00:00Z' (+7 days from its previous value, not from the clock), reserved_samples == 2000"
            - "conclude 3 at clock 2026-08-30 (labeled 900): status == 'INCONCLUSIVE' for the third time"
            - "extend 3: HTTP 409 with error_id 'ERR_MAX_EXTENSIONS_REACHED' because extension_count is already MAX_EVALUATION_EXTENSIONS (2)"
            - "after the rejected extend 3: status is still 'INCONCLUSIVE', extension_count is still 2, evaluation_ends_at is still '2026-08-29T00:00:00Z' and ModelVersion.${v2_id}.evaluation_sample_budget == 5000"
            - "the bounded cycle terminates: the evaluation is permanently parked in INCONCLUSIVE, and Model.${m_id}.champion_version_id is still null because no conclude ever reached PROMOTED"

  - rule_id: transitive_cascade
    instances:

      - name: dataset_revoke_cascade_depth_four
        grounds:
          - endpoints.POST_/training-datasets/{dataset_id}/revoke
          - state_machines.TrainingDataset.APPROVED_to_REVOKED
          - state_machines.ModelVersion.APPROVED_to_BLOCKED
          - state_machines.Deployment_rollout_state.LIVE_to_DRAINING
          - state_machines.ChallengerEvaluation.COLLECTING_to_INCONCLUSIVE
          - calculations.endpoint_traffic_ledger
          - calculations.evaluation_sample_ledger
          - calculations.dataset_dependency_counter
        distinguishing_aspect: |
          TRIGGER 1 of 2 — a governance revocation on the TrainingDataset, propagating DOWN the
          lineage in FOUR hops where each hop is caused strictly by the previous one: the versions
          are blocked because the dataset was revoked, the deployments are drained because their
          versions were blocked, and the evaluation goes INCONCLUSIVE because its arms were
          drained. Nothing here is triggered by a metric or a threshold — it is pure referential
          fallout, and it reaches two different ServingEndpoint ledgers plus a sample ledger.
        test_recipe:
          setup:
            - "clock at its 2026-08-01T00:00:00Z startup default"
            - "one Model with APPROVED v1 (1.0.0) and APPROVED v2 (1.1.0, parent v1), BOTH trained on the SAME APPROVED TrainingDataset"
            - "d1 REALTIME on se1 ramped to LIVE at 100.00; d2 SHADOW on se2 ramped once to 10.00"
            - "one ChallengerEvaluation (reserved_samples 3000 against v2's 5000 quota) in status COLLECTING"
          setup_api_calls:
            - call: "POST /models"
              payload: { name: "fraud-scorer", task_type: "CLASSIFICATION", owner_team: "risk-ml", revalidation_interval_days: 90 }
              as: MLEngineer
              as_user_id: "u_mle_1"
              captures: { m_id: $.data.id }
            - call: "POST /training-datasets"
