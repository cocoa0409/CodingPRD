  - method: GET
    path: "/mlc/members/{id}/statements/{statementId}"
    description: "Get one statement"
    roles: [MLCAdministrator, MemberUser]
    code: 200
    input: []
    output: Statement
    side_effects: []

  - method: GET
    path: "/mlc/members/{id}/statements/{statementId}/lines"
    description: "List lines of a statement (FK reverse reachability)"
    roles: [MLCAdministrator, MemberUser]
    code: 200
    input: ["limit?", "offset?", "line_type?"]
    output: "StatementLine[]"
    side_effects: []

  - method: GET
    path: "/mlc/statement-lines"
    description: "Filtered list of statement lines (FK reverse reachability by usage_line_id / member_id / statement_id)"
    roles: [MLCAdministrator, MemberUser]
    code: 200
    input: ["limit?", "offset?", "statement_id?", "usage_line_id?", "member_id?", "line_type?", "payee_id?"]
