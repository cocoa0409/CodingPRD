          assert:
            - "response.status == 422"
            - "response.data.error_id == ERR_STRINGENCY_FLOOR_VIOLATION"
            - "response.data.error_id != ERR_BENEFIT_COST_BELOW_FLOOR"
            - "AmendmentProposal.${propc_id}.review_status == COMMENT_CLOSED"
            - "AmendmentProposal.${propc_id}.preliminary_benefit_cost_ratio == 1.49"
            - "GET /hearings/${hearc_id}/votes returns total_count == 0"
            - "CodeCycle.${cycle_id}.approved_proposal_count == 0"

      - name: ballot_member_not_on_committee_outranks_duplicate_ballot
        grounds:
          - validations[priority=15]
          - validations[priority=17]
          - errors.ERR_BALLOT_MEMBER_NOT_ON_COMMITTEE
          - errors.ERR_DUPLICATE_BALLOT
          - entities.VoteRecord.fields.ballots
        distinguishing_aspect: |
          Error-category pair business_referential (P15) vs business_constraint (P17): the
          ballot array carries the same MECHANICAL-committee member twice, violating both
          committee membership and one-ballot-per-member; the response is
          ERR_BALLOT_MEMBER_NOT_ON_COMMITTEE, never ERR_DUPLICATE_BALLOT.
        test_recipe:
          setup:
            - "The golden chain through convene, plus a second SEATED-in-progress MECHANICAL committee holding one member who is NOT on the ENERGY committee."
            - "The ENERGY hearing is CONVENED with quorum_required 4; five ENERGY members plus two duplicate ballots for the foreign member are submitted."
            - "Logical clock at 2026-10-05T14:00:00Z."
          setup_api_calls:
