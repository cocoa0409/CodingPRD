  - section: consistency_model
    instances:

      - name: recall_response_already_carries_the_cascaded_counters
        claim_type: immediate
        grounds:
          - calculations.lot_remediation_progress
          - endpoints[POST /appliance-lots/{lot_id}/recall]
        distinguishing_aspect: |
          The consistency model is immediate: the recall response itself already reports
          affected_device_count and pending_remediation_count computed over the cascaded population, and
          a read of the appliance in the very next request already shows RECALL_HOLD — nothing is
          deferred to a later sweep.
