# =============================================================================
# NCAA Recruiting and NIL Compliance — Scaffold Difficulty Design (Test Targeting Index)
#
# Each `rule_id` cross-references the nine Difficulty Rules in
# `scaffold-generator/SKILL.md §0.5`. Every `grounds:` reference resolves to a
# declared element in `SCAFFOLD.yaml` (§1.1–§1.6). Every numeric assertion below
# was computed against the actual formulas pinned in `SCAFFOLD.yaml` §1.3.
# =============================================================================

scaffold_difficulty_design:

  # ---------------------------------------------------------------------------
  # Rule 1 — Dual-variant calculations across different entity domains (>= 2)
  # ---------------------------------------------------------------------------
  - rule_id: dual_variant_calc
    instances:
      - name: nildeal_stated_vs_fmv_pinning
        grounds:
          - calculations.nil_deal_fair_market_value
          - entities.NILDeal.fields.stated_value_cents
          - entities.NILDeal.fields.fmv_calculated_cents
          - entities.NILDeal.fields.approved_value_cents
          - state_machines.NILDeal.UNDER_REVIEW_to_APPROVED
        distinguishing_aspect: |
          Operates on the NILDeal (compensation/financial) entity domain: two
          valid valuations of the same deal payload — the contract's stated
          value vs the independent fair-market valuation — produce different
          numbers, and the APPROVED transition pins approved_value_cents to the
          minimum, so the choice of variant is observable on the deal record.
        test_recipe:
          setup:
            - "POST /programs => Program P1 sport=FOOTBALL, scholarship_cap_equivalencies=85.0, roster_cap_count=85"
            - "POST /athletes => Athlete A1 (PROSPECTIVE)"
            - "POST /eligibility-records => decision=QUALIFIER for A1"
            - "POST /scholarship-slots => slot S1 for (A1,P1), fractional_equivalency=1.00; POST /scholarship-slots/S1/state to_status=SIGNED"
            - "POST /athletes/A1/state to_status=COMMITTED program_id=P1; then to_status=ENROLLED"
            - "POST /nil-deals => Deal D1: athlete=A1, sponsor_is_booster=false, deal_category=ENDORSEMENT, deliverables_hours=10, market_rate_cents_per_hour=50000, stated_value_cents=500000"
          trigger:
            - "POST /nil-deals/D1/state to_status=UNDER_REVIEW (as a different ComplianceOfficer X-User-ID from the submitter)"
            - "POST /nil-deals/D1/state to_status=APPROVED"
          assert:
            - "Deal D1.fmv_calculated_cents == 600000   # 10 * 50000 * 1.20 * 1.00"
            - "Deal D1.stated_value_cents == 500000"
            - "Deal D1.approved_value_cents == 500000  # min(stated, fmv) variant pins to stated when stated < fmv"
            - "Athlete A1.nil_deal_lifetime_value_cents == 500000"

      - name: violation_penalty_recidivism_variant
        grounds:
          - calculations.violation_penalty_score
          - entities.ComplianceViolation.fields.penalty_points
          - entities.ComplianceViolation.fields.severity
          - entities.Program.fields.penalty_points_total
          - state_machines.ComplianceViolation.APPEALED_to_SUSTAINED
        distinguishing_aspect: |
          Operates on the ComplianceViolation (compliance/governance) entity
          domain — structurally distinct from the NILDeal financial domain.
          Same severity LEVEL_II violation yields different penalty_points
          depending on the recidivism variant (first-offense multiplier 1.0
          vs second-offense 1.5 vs third+ 2.0), so identical raw inputs
          (severity, program) produce different point totals.
        test_recipe:
          setup:
            - "POST /programs => Program P1"
            - "POST /violations => V1: program=P1, severity=LEVEL_II"
            - "POST /violations/V1/state INVESTIGATING (officer U_REVIEWER); then SUBSTANTIATED; then APPEALED; then SUSTAINED (officer U_APPEAL, distinct from U_REVIEWER)"
            - "POST /violations => V2: program=P1, severity=LEVEL_II (created AFTER V1.created_at, both within 730d window)"
            - "POST /violations/V2/state INVESTIGATING (U_REVIEWER_2); SUBSTANTIATED; APPEALED; SUSTAINED (U_APPEAL_2)"
          trigger:
            - "GET /violations/V1; GET /violations/V2"
          assert:
            - "Violation V1.penalty_points == 5   # 5 * 1.0 (first-offense variant)"
            - "Violation V2.penalty_points == 8   # 5 * 1.5 = 7.5 -> round_half_up 8 (second-offense variant)"
            - "Program P1.penalty_points_total == 13"

  # ---------------------------------------------------------------------------
  # Rule 2 — Combinatorial formulas across different modes (>= 2)
  # ---------------------------------------------------------------------------
  - rule_id: combinatorial_formula
    instances:
      - name: nil_fmv_three_input_nonlinear      # mode (a)
        grounds:
          - calculations.nil_deal_fair_market_value
          - entities.NILDeal.fields.deal_category
          - entities.NILDeal.fields.sponsor_is_booster
          - entities.NILDeal.fields.deliverables_hours
          - entities.NILDeal.fields.market_rate_cents_per_hour
        distinguishing_aspect: |
          Mode (a) — formula with >=3 inputs and non-linear interaction. FMV is
          deliverables_hours * market_rate * category_multiplier(deal_category)
          * booster_factor(sponsor_is_booster). The category multiplier is a
          tiered lookup over the deal_category enum, and the booster_factor
          conditionally branches on the boolean. Changing any single input
          changes the product non-linearly via tier selection.
        test_recipe:
          setup:
            - "POST /programs => Program P1; POST /athletes => Athlete A1; complete eligibility -> ENROLLED as above"
            - "POST /nil-deals => Deal D_endorse_booster: deal_category=ENDORSEMENT, sponsor_is_booster=true, deliverables_hours=10, market_rate_cents_per_hour=50000, stated_value_cents=400000"
            - "POST /nil-deals => Deal D_autograph_nonbooster: deal_category=AUTOGRAPH_SIGNING, sponsor_is_booster=false, deliverables_hours=10, market_rate_cents_per_hour=50000, stated_value_cents=400000"
          trigger:
            - "GET /nil-deals/D_endorse_booster; GET /nil-deals/D_autograph_nonbooster"
          assert:
            - "D_endorse_booster.fmv_calculated_cents == 480000   # 10*50000*1.20*0.80"
            - "D_autograph_nonbooster.fmv_calculated_cents == 450000  # 10*50000*0.90*1.00"
            - "D_endorse_booster.fmv_calculated_cents != D_autograph_nonbooster.fmv_calculated_cents"

      - name: violation_recidivism_round_after_multiply   # mode (b)
        grounds:
          - calculations.violation_penalty_score
          - entities.ComplianceViolation.fields.penalty_points
        distinguishing_aspect: |
          Mode (b) — nested rounding where order matters. Scaffold pins
          'round_half_up AFTER multiplication': for LEVEL_II + recid_mult=1.5,
          5 * 1.5 = 7.5 -> 8 (round-after); but rounding 1.5 first to 2 would
          give 5*2=10 (round-before). The scaffold explicitly pins round-after,
          so the second-offense LEVEL_II case yields 8 not 10.
        test_recipe:
          setup:
            - "POST /programs => Program P1"
            - "POST /violations => V_first: program=P1, severity=LEVEL_II; drive V_first through to SUSTAINED"
            - "POST /violations => V_second: program=P1, severity=LEVEL_II (created later, still in 730d window)"
          trigger:
            - "Drive V_second through INVESTIGATING -> SUBSTANTIATED -> APPEALED -> SUSTAINED"
            - "GET /violations/V_second"
          assert:
            - "V_second.penalty_points == 8   # 5 * 1.5 = 7.5 -> round_half_up -> 8 (round AFTER multiply)"
            - "V_second.penalty_points != 10  # would equal 10 only if rounding 1.5 -> 2 before multiplying"

      - name: nildeal_approved_value_min_of_stated_fmv   # mode (c)
        grounds:
          - calculations.nil_deal_fair_market_value
          - entities.NILDeal.fields.approved_value_cents
          - entities.NILDeal.fields.fmv_calculated_cents
          - entities.NILDeal.fields.stated_value_cents
          - state_machines.NILDeal.UNDER_REVIEW_to_APPROVED
        distinguishing_aspect: |
          Mode (c) — circular-looking dependency with pinned evaluation order.
          approved_value_cents depends on fmv_calculated_cents, but fmv itself
          depends on deliverables_hours/market_rate which the athlete can edit
          via PATCH while status==SUBMITTED. The scaffold pins: fmv is
          recomputed on every PATCH; approved_value is computed only on the
          UNDER_REVIEW->APPROVED transition using the fmv as it stands at that
          instant. This gives a well-defined eval order: latest fmv at approval
          time, frozen thereafter.
        test_recipe:
          setup:
            - "POST /programs/athletes/eligibility/slot/enrollment as in earlier setups"
            - "POST /nil-deals => Deal D2: deliverables_hours=10, market_rate_cents_per_hour=50000, deal_category=ENDORSEMENT, sponsor_is_booster=false, stated_value_cents=2000000"
            - "Initially D2.fmv_calculated_cents == 600000  (10*50000*1.20*1.00)"
            - "PATCH /nil-deals/D2 deliverables_hours=20 (still SUBMITTED). Now fmv = 20*50000*1.20*1.00 = 1200000"
            - "POST /nil-deals/D2/state to_status=UNDER_REVIEW"
          trigger:
            - "POST /nil-deals/D2/state to_status=APPROVED"
          assert:
            - "Deal D2.fmv_calculated_cents == 1200000"
            - "Deal D2.approved_value_cents == 1200000   # min(2000000, 1200000) using fmv at the moment of APPROVED"

  # ---------------------------------------------------------------------------
  # Rule 3 — Non-linear state-machine shape on different entities (>= 2)
  # ---------------------------------------------------------------------------
  - rule_id: non_linear_state_machine
    instances:
      - name: nildeal_approved_suspended_cycle
        grounds:
          - state_machines.NILDeal.APPROVED_to_SUSPENDED
          - state_machines.NILDeal.SUSPENDED_to_APPROVED
        distinguishing_aspect: |
          NILDeal exhibits an explicit cycle: APPROVED -> SUSPENDED -> APPROVED.
          Caused by athlete flipping INELIGIBLE then returning to ENROLLED via
          violation OVERTURNED. Not a linear pipeline — the same deal can hold
          status==APPROVED at two different times bracketing a SUSPENDED
          interval, distinguishing this from any A->B->C pipeline.
        test_recipe:
          setup:
            - "Bring Athlete A1 to ENROLLED with amateur_status=AMATEUR (full pipeline)"
            - "POST /nil-deals D1; UNDER_REVIEW -> APPROVED (clean deal). Deal status=APPROVED"
            - "POST /violations V_sev1: program=P1, severity=LEVEL_I, related_athlete_id=A1; drive to SUSTAINED. Cascade flips A1 to INELIGIBLE and D1 to SUSPENDED"
          trigger:
            - "POST /violations/V_sev1/state to_status=APPEALED; then to_status=OVERTURNED (different officer than original reviewer)"
          assert:
            - "Athlete A1.status == ENROLLED   # restored by OVERTURNED cascade"
            - "NILDeal D1.status == APPROVED   # second time the deal is APPROVED, completing the cycle"

      - name: violation_substantiated_appealed_cycle
        grounds:
          - state_machines.ComplianceViolation.SUBSTANTIATED_to_APPEALED
          - state_machines.ComplianceViolation.APPEALED_to_OVERTURNED
          - state_machines.ComplianceViolation.APPEALED_to_SUSTAINED
        distinguishing_aspect: |
          ComplianceViolation exhibits branching fork-join shape: SUBSTANTIATED
          forks to either APPEALED (and rejoins via SUSTAINED or OVERTURNED) or
          to direct SUSTAINED via auto-expire; both terminal SUSTAINED outcomes
          carry IDENTICAL side-effect sets (penalty_points/program rollup) but
          via two structurally distinct paths. Different entity from
          NILDeal — covers the differentiation clause of Rule 3.
        test_recipe:
          setup:
            - "POST /programs => P1; POST /violations => V_a: severity=LEVEL_II; V_b: severity=LEVEL_II (both in P1)"
            - "Drive V_a: REPORTED -> INVESTIGATING -> SUBSTANTIATED -> APPEALED -> SUSTAINED (different officer)"
            - "Drive V_b: REPORTED -> INVESTIGATING -> SUBSTANTIATED"
          trigger:
            - "POST /_clock/advance to_timestamp = SUBSTANTIATED_at_of_V_b + 14 days + 1 second"
          assert:
            - "V_a.status == SUSTAINED AND V_a.penalty_points == 5"
            - "V_b.status == SUSTAINED AND V_b.penalty_points == 8   # second-offense recidivism"
            - "V_a took APPEALED path; V_b took auto-expire path — both reached SUSTAINED (branching fork that rejoins)"

  # ---------------------------------------------------------------------------
  # Rule 4 — Transitive cascade chains from different triggers (>= 2)
  # ---------------------------------------------------------------------------
  - rule_id: transitive_cascade
    instances:
      - name: violation_sustained_athlete_ineligible_deal_suspended    # depth = 3
        grounds:
          - state_machines.ComplianceViolation.APPEALED_to_SUSTAINED
          - state_machines.Athlete.ENROLLED_to_INELIGIBLE
          - state_machines.NILDeal.APPROVED_to_SUSPENDED
        distinguishing_aspect: |
          Depth-3 chain triggered by ComplianceViolation appeal SUSTAINED.
          Link 1: violation flipping to SUSTAINED causes athlete to flip to
          INELIGIBLE (caused by the violation's outcome change). Link 2: the
          athlete's flip to INELIGIBLE itself causes all APPROVED NILDeals for
          that athlete to flip to SUSPENDED — this second link is caused by
          the athlete-state change, NOT directly by the violation transition.
        test_recipe:
          setup:
            - "Bring Athlete A1 to ENROLLED, amateur_status=AMATEUR"
            - "POST /nil-deals D1; D2 — both ENROLLED, drive each through UNDER_REVIEW -> APPROVED"
            - "POST /violations V_sev1: program=P1, severity=LEVEL_I, related_athlete_id=A1; INVESTIGATING -> SUBSTANTIATED -> APPEALED"
          trigger:
            - "POST /violations/V_sev1/state to_status=SUSTAINED (officer different from original reviewer)"
          assert:
            - "V_sev1.status == SUSTAINED AND V_sev1.outcome == SUSTAINED   # link 0"
            - "Athlete A1.status == INELIGIBLE   # link 1 caused by link 0"
            - "NILDeal D1.status == SUSPENDED AND NILDeal D2.status == SUSPENDED   # link 2 caused by link 1, not directly by violation"

      - name: athlete_portal_entry_slot_release_program_recompute      # depth = 2
        grounds:
          - state_machines.Athlete.ENROLLED_to_TRANSFER_PORTAL
          - state_machines.ScholarshipSlot.ACTIVE_to_RELEASED
          - calculations.scholarship_slot_usage
          - entities.Program.fields.total_equivalencies_used
        distinguishing_aspect: |
          Depth-2 chain triggered by an athlete entering the transfer portal.
          Link 1: Athlete ENROLLED -> TRANSFER_PORTAL causes its ACTIVE
          ScholarshipSlot to flip to RELEASED. Link 2: the slot's flip to
          RELEASED itself causes Program.total_equivalencies_used to be
          recomputed — caused by the slot-state change, not the athlete-state
          change directly. Different originating trigger from instance 1.
        test_recipe:
          setup:
            - "POST /programs => P1, sport=MENS_BASKETBALL, scholarship_cap_equivalencies=13.0, roster_cap_count=15"
            - "Bring Athlete A1 to ENROLLED at P1 via slot S1 with fractional_equivalency=1.00"
            - "Confirm P1.total_equivalencies_used == 1.00 and active_roster_count == 1"
          trigger:
            - "POST /transfer-portal-entries: athlete_id=A1, reason=PLAYING_TIME"
          assert:
            - "Athlete A1.status == TRANSFER_PORTAL   # link 0"
            - "ScholarshipSlot S1.status == RELEASED   # link 1 caused by link 0"
            - "Program P1.total_equivalencies_used == 0.00   # link 2 caused by link 1"
            - "Program P1.active_roster_count == 0          # link 2 caused by link 1"

  # ---------------------------------------------------------------------------
  # Rule 5 — Validation priority conflicts across different error-category pairs (>= 2)
  # ---------------------------------------------------------------------------
  - rule_id: priority_pair_validation_conflict
    instances:
      - name: state_vs_business_safety_pair
        grounds:
          - validations[priority=6]      # ERR_INVALID_STATE  (category: state)
          - validations[priority=10]     # ERR_AMATEUR_STATUS_LOST  (category: business_safety)
        distinguishing_aspect: |
          Pair category=state (priority 6) vs category=business_safety
          (priority 10). Dual-failure scenario: caller tries to APPROVE a
          NILDeal that is in SUBMITTED (not UNDER_REVIEW) AND for an athlete
          whose amateur_status is FORFEITED. Both checks would fail, but the
          state check at priority 6 wins, yielding ERR_INVALID_STATE rather
          than ERR_AMATEUR_STATUS_LOST.
        test_recipe:
          setup:
            - "Bring Athlete A1 to ENROLLED, then force amateur_status=FORFEITED via a SUSTAINED LEVEL_I violation (now A1 is INELIGIBLE)"
            - "POST /nil-deals D_x: athlete=A1 — status is SUBMITTED (NOT moved to UNDER_REVIEW)"
          trigger:
            - "POST /nil-deals/D_x/state to_status=APPROVED"
          assert:
            - "response.status_code == 409"
            - "response.data.error_id == 'ERR_INVALID_STATE'   # state wins over business_safety"
            - "response.data.error_id != 'ERR_AMATEUR_STATUS_LOST'"

      - name: business_safety_vs_business_fiscal_pair
        grounds:
          - validations[priority=9]      # ERR_ELIGIBILITY_NOT_CLEARED  (business_safety)
          - validations[priority=16]     # ERR_SCHOLARSHIP_CAP_EXCEEDED (business_fiscal)
        distinguishing_aspect: |
          Pair category=business_safety (priority 9, eligibility) vs
          category=business_fiscal (priority 16, scholarship cap). Different
          category pair from instance 1. Dual-failure scenario: athlete
          has decision=NON_QUALIFIER AND signing this slot would exceed
          the scholarship cap. business_safety priority wins; caller sees
          ERR_ELIGIBILITY_NOT_CLEARED.
        test_recipe:
          setup:
            - "POST /programs => P1 sport=MENS_BASKETBALL scholarship_cap_equivalencies=1.00 (extreme tiny cap so a 1.00 slot would breach)"
            - "POST /athletes => A2 PROSPECTIVE"
            - "POST /eligibility-records => decision=NON_QUALIFIER for A2"
            - "Pre-fill P1 with one SIGNED slot at fractional_equivalency=1.00 for a different athlete A_pre so total_equivalencies_used==1.00 (so any new slot breaches cap)"
            - "POST /scholarship-slots => S2: program=P1, athlete=A2, fractional_equivalency=0.50"
          trigger:
            - "POST /scholarship-slots/S2/state to_status=SIGNED"
          assert:
            - "response.status_code == 409"
            - "response.data.error_id == 'ERR_ELIGIBILITY_NOT_CLEARED'   # business_safety priority 9 wins over fiscal priority 16"

  # ---------------------------------------------------------------------------
  # Rule 6 — Boundary-precision checks on different metrics/endpoints (>= 2)
  # ---------------------------------------------------------------------------
  - rule_id: boundary_precision_check
    instances:
      - name: program_compliance_yellow_boundary
        grounds:
          - calculations.program_compliance_posture
          - entities.Program.fields.compliance_status
          - entities.Program.fields.penalty_points_total
        distinguishing_aspect: |
          Numeric threshold boundary at exactly 10 cumulative penalty points.
          Scaffold pins compliance_status YELLOW at penalty_points_total >= 10
          and < 20, GREEN at < 10. Test demonstrates the >= boundary: hitting
          exactly 10 from a single LEVEL_I first-offense MUST be YELLOW, not
          GREEN. Reachable through POST /violations/{id}/state. The next
          violation crossing the 20 line (10 + 15 = 25) MUST flip to RED — so
          the boundary semantics (>=) are tested on both sides of the gap.
        test_recipe:
          setup:
            - "POST /programs => P1"
            - "Program P1.compliance_status == 'GREEN' initially (penalty_points_total == 0)"
          trigger:
            - "POST /violations V1: severity=LEVEL_I, program=P1; drive REPORTED -> INVESTIGATING -> SUBSTANTIATED -> APPEALED -> SUSTAINED (officers U_REVIEWER, U_APPEAL distinct)"
          assert:
            - "Violation V1.penalty_points == 10   # 10 * 1.0 (first-offense LEVEL_I), no rounding needed"
            - "Program P1.penalty_points_total == 10"
            - "Program P1.compliance_status == 'YELLOW'   # exact-boundary >= 10 trips YELLOW (not still GREEN)"

      - name: roster_cap_zero_remaining_boundary
        grounds:
          - calculations.scholarship_slot_usage
          - entities.Program.fields.roster_cap_count
          - entities.Program.fields.active_roster_count
          - state_machines.Athlete.COMMITTED_to_ENROLLED
          - errors[id=ERR_ROSTER_CAP_EXCEEDED]
        distinguishing_aspect: |
          Empty-set / zero-remaining boundary on a different metric
          (active_roster_count) and reached through a DIFFERENT endpoint
          (POST /athletes/{id}/state COMMITTED->ENROLLED). When
          roster_cap_count == active_roster_count (zero remaining), the next
          enrollment must be rejected. Tests the exact equality boundary.
        test_recipe:
          setup:
            - "POST /programs => P1, roster_cap_count=1, scholarship_cap_equivalencies=2.00"
            - "Bring Athlete A1 to ENROLLED at P1 (now active_roster_count == 1 == cap, zero remaining)"
            - "POST /athletes => A2; POST /eligibility-records decision=QUALIFIER for A2; POST /scholarship-slots S2 for (A2,P1) frac=1.00; POST /scholarship-slots/S2/state SIGNED; POST /athletes/A2/state to_status=COMMITTED program_id=P1"
          trigger:
            - "POST /athletes/A2/state to_status=ENROLLED"
          assert:
            - "response.status_code == 409"
            - "response.data.error_id == 'ERR_ROSTER_CAP_EXCEEDED'   # 1 + 1 > 1"
            - "Program P1.active_roster_count == 1   # unchanged"
            - "Athlete A2.status == 'COMMITTED'      # transition aborted"

  # ---------------------------------------------------------------------------
  # Rule 7 — Cross-entity state dependencies across different entity pairs (>= 2)
  # ---------------------------------------------------------------------------
  - rule_id: cross_entity_state_dependency
    instances:
      - name: nildeal_approval_depends_on_athlete_state
        grounds:
          - state_machines.NILDeal.UNDER_REVIEW_to_APPROVED
          - entities.Athlete.fields.status
          - entities.Athlete.fields.amateur_status
          - validations[priority=10]     # ERR_AMATEUR_STATUS_LOST
        distinguishing_aspect: |
          Entity pair (NILDeal -> Athlete). NILDeal UNDER_REVIEW -> APPROVED is
          legal only if the linked Athlete is in {COMMITTED, ENROLLED} AND
          amateur_status == AMATEUR. The same deal data with the same actor is
          accepted or rejected purely based on the OTHER entity's state.
        test_recipe:
          setup:
            - "Bring Athlete A1 to ENROLLED with amateur_status=AMATEUR"
            - "POST /nil-deals D1; POST /nil-deals/D1/state to_status=UNDER_REVIEW (different officer)"
            - "POST /violations V1 LEVEL_I related_athlete_id=A1; drive to SUSTAINED -> A1 becomes INELIGIBLE with amateur_status=FORFEITED"
          trigger:
            - "POST /nil-deals/D1/state to_status=APPROVED"
          assert:
            - "response.status_code == 409"
            - "response.data.error_id == 'ERR_AMATEUR_STATUS_LOST'"
            - "Deal D1.status == 'UNDER_REVIEW'   # rejected, no transition"

      - name: scholarship_slot_sign_depends_on_eligibility_record
        grounds:
          - state_machines.ScholarshipSlot.OFFERED_to_SIGNED
          - entities.EligibilityRecord.fields.decision
          - validations[priority=9]      # ERR_ELIGIBILITY_NOT_CLEARED
        distinguishing_aspect: |
          Entity pair (ScholarshipSlot -> EligibilityRecord), distinct from
          (NILDeal -> Athlete). Slot OFFERED -> SIGNED is legal only if the
          athlete has an EligibilityRecord with decision IN {QUALIFIER,
          PARTIAL_QUALIFIER}. Different cross-entity pair satisfying the rule's
          differentiation clause.
        test_recipe:
          setup:
            - "POST /programs => P1"
            - "POST /athletes => A3"
            - "POST /eligibility-records => decision=NON_QUALIFIER for A3"
            - "POST /scholarship-slots => S3 for (A3,P1) frac=0.50"
          trigger:
            - "POST /scholarship-slots/S3/state to_status=SIGNED"
          assert:
            - "response.status_code == 409"
            - "response.data.error_id == 'ERR_ELIGIBILITY_NOT_CLEARED'"
            - "ScholarshipSlot S3.status == 'OFFERED'   # unchanged"

  # ---------------------------------------------------------------------------
  # Rule 8 — Resource temporal-overlap conflicts across different interval semantics (>= 2)
  # ---------------------------------------------------------------------------
  - rule_id: resource_temporal_overlap
    instances:
      - name: recruiting_calendar_half_open_priority_overlap
        grounds:
          - calculations.recruiting_contact_permitted
          - entities.RecruitingCalendar.fields.start_date
          - entities.RecruitingCalendar.fields.end_date
          - entities.RecruitingContact.fields.contact_at
          - entities.RecruitingContact.fields.contact_period_type
          - errors[id=ERR_CONTACT_NOT_PERMITTED]
        distinguishing_aspect: |
          Interval semantics on RecruitingCalendar: half-open [start_date,
          end_date). Overlap resolution uses the MOST-RESTRICTIVE
          period_type when two windows overlap and both contain contact_at:
          priority DEAD > CONTACT > EVALUATION > QUIET. A contact at exactly
          window.end_date is OUTSIDE that window. Tests the exclusive upper
          bound AND the priority tie-break — semantics specific to this
          resource entity.
        test_recipe:
          setup:
            - "POST /programs => P1"
            - "POST /recruiting-calendars: program=P1, period_type=CONTACT,    start=2026-05-01T00Z, end=2026-05-10T00Z"
            - "POST /recruiting-calendars: program=P1, period_type=DEAD,       start=2026-05-05T00Z, end=2026-05-07T00Z (overlaps the CONTACT window)"
            - "POST /athletes => A1; full eligibility/enroll setup"
          trigger:
            - "POST /recruiting-contacts: program=P1, athlete=A1, contact_type=IN_PERSON_OFF_CAMPUS, contact_at=2026-05-06T12:00:00Z   # inside DEAD overlap"
            - "POST /recruiting-contacts: program=P1, athlete=A1, contact_type=IN_PERSON_OFF_CAMPUS, contact_at=2026-05-07T00:00:00Z   # exactly at DEAD.end_date, falls back to CONTACT (allowed)"
          assert:
            - "First contact: response.status_code == 409 AND error_id == 'ERR_CONTACT_NOT_PERMITTED'   # DEAD wins via priority tie-break"
            - "Second contact: response.status_code == 201 AND data.contact_period_type == 'CONTACT'  # half-open: 2026-05-07T00:00:00Z is NOT in DEAD, falls back to CONTACT"

      - name: transfer_portal_entry_dedup_active_window
        grounds:
          - entities.TransferPortalEntry.fields.status
          - validations[priority=20]     # ERR_DUPLICATE_PORTAL_ENTRY
          - errors[id=ERR_DUPLICATE_PORTAL_ENTRY]
          - state_machines.TransferPortalEntry.ENTERED_to_CONTACT_WINDOW
        distinguishing_aspect: |
          Interval semantics on TransferPortalEntry: AGGREGATE-CAPACITY rule —
          at most one entry per athlete may overlap the 'active' interval
          (status IN {ENTERED, CONTACT_WINDOW}). Different resource entity
          from RecruitingCalendar, and different interval semantics
          (aggregate-capacity count, not point-in-time membership). Two
          back-to-back POSTs collide; the second is rejected even though they
          are temporally adjacent rather than overlapping in wall-clock terms.
        test_recipe:
          setup:
            - "Bring Athlete A1 to ENROLLED, amateur_status=AMATEUR"
            - "POST /transfer-portal-entries: athlete_id=A1, reason=PLAYING_TIME -> entry E1 status=ENTERED"
          trigger:
            - "POST /transfer-portal-entries: athlete_id=A1, reason=COACHING_CHANGE   # while E1 still active"
          assert:
            - "response.status_code == 409"
            - "response.data.error_id == 'ERR_DUPLICATE_PORTAL_ENTRY'"
            - "TransferPortalEntry list filtered by athlete_id=A1 has exactly 1 row"

  # ---------------------------------------------------------------------------
  # Rule 9 — Compensating-action invariants across different conserved quantities (>= 2)
  # ---------------------------------------------------------------------------
  - rule_id: compensating_invariant
    instances:
      - name: portal_withdrawn_restores_athlete_status_invariant
        grounds:
          - state_machines.Athlete.ENROLLED_to_TRANSFER_PORTAL
          - state_machines.TransferPortalEntry.CONTACT_WINDOW_to_WITHDRAWN
          - state_machines.TransferPortalEntry.ENTERED_to_WITHDRAWN
          - entities.Athlete.fields.status
          - entities.Athlete.fields.current_program_id
        distinguishing_aspect: |
          Conserved quantity = Athlete identity (status, current_program_id).
          Forward action: POST /transfer-portal-entries (Athlete ENROLLED ->
          TRANSFER_PORTAL, current_program_id set to null). Compensating
          action: POST /transfer-portal-entries/{id}/state to_status=WITHDRAWN
          before window closes (Athlete TRANSFER_PORTAL -> ENROLLED,
          current_program_id := origin_program_id). Pinned invariant:
          (Athlete.status, Athlete.current_program_id) before forward action
          equals (Athlete.status, Athlete.current_program_id) after the
          compensating action.
        test_recipe:
          setup:
            - "Bring Athlete A1 to ENROLLED at Program P1 (status=ENROLLED, current_program_id=P1)"
            - "Snapshot: A1.status_pre == 'ENROLLED' AND A1.current_program_id_pre == P1"
          trigger:
            - "POST /transfer-portal-entries: athlete_id=A1, reason=PLAYING_TIME (entry E1)"
            - "POST /transfer-portal-entries/E1/state to_status=WITHDRAWN (before window opens, i.e. before clock advance)"
          assert:
            - "Athlete A1.status == 'ENROLLED'   # restored, equals pre-state"
            - "Athlete A1.current_program_id == P1   # restored, equals pre-state"
            - "Invariant: (status_pre, current_program_id_pre) == (status_post, current_program_id_post)"

      - name: nildeal_suspend_resume_lifetime_value_invariant
        grounds:
          - state_machines.NILDeal.APPROVED_to_SUSPENDED
          - state_machines.NILDeal.SUSPENDED_to_APPROVED
          - entities.NILDeal.fields.approved_value_cents
          - entities.Athlete.fields.nil_deal_lifetime_value_cents
        distinguishing_aspect: |
          Conserved quantity = Athlete.nil_deal_lifetime_value_cents (sum of
          approved_value_cents over deals with status==APPROVED). DIFFERENT
          type of conserved quantity from instance 1 (a money-total
          aggregate, not an identity tuple). Forward action: ComplianceOfficer
          POSTs APPROVED -> SUSPENDED on a deal (lifetime drops by that deal's
          approved_value_cents). Compensating action: ComplianceOfficer POSTs
          SUSPENDED -> APPROVED on the same deal (lifetime restores).
          Pinned invariant formula (over entity fields):
          Athlete.nil_deal_lifetime_value_cents_post_compensate ==
          Athlete.nil_deal_lifetime_value_cents_pre_forward; AND for the deal
          itself, NILDeal.approved_value_cents is NEVER cleared during the
          SUSPENDED window — the value is pinned at original APPROVE time
          (see scaffold §1.2 APPROVED -> SUSPENDED side_effects).
        test_recipe:
          setup:
            - "Bring Athlete A1 to ENROLLED, amateur_status=AMATEUR"
            - "POST /nil-deals D1: deliverables_hours=10, market_rate=50000, ENDORSEMENT, non-booster, stated_value_cents=500000"
            - "Drive D1 to UNDER_REVIEW (different officer) then APPROVED; D1.approved_value_cents == 500000"
            - "POST /nil-deals D2: deliverables_hours=5, market_rate=80000, APPEARANCE, non-booster, stated_value_cents=400000"
            - "Drive D2 through UNDER_REVIEW -> APPROVED; D2.approved_value_cents == 400000 (min(400000, 440000))"
            - "Snapshot Athlete A1.nil_deal_lifetime_value_cents_pre == 900000"
          trigger:
            - "POST /nil-deals/D1/state to_status=SUSPENDED (ComplianceOfficer, forward action)"
            - "After forward: Athlete A1.nil_deal_lifetime_value_cents == 400000 (only D2 still APPROVED)"
            - "POST /nil-deals/D1/state to_status=APPROVED (ComplianceOfficer, compensating action; amateur_status==AMATEUR precondition holds)"
          assert:
            - "NILDeal D1.status == 'APPROVED'"
            - "NILDeal D1.approved_value_cents == 500000   # unchanged across the suspend/resume cycle (pinned at original APPROVE)"
            - "NILDeal D2.approved_value_cents == 400000   # untouched"
            - "Athlete A1.nil_deal_lifetime_value_cents == 900000   # invariant holds: equals pre-forward snapshot"
