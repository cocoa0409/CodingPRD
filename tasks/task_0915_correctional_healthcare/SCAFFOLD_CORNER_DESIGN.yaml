              captures: { chg: $.data.id }
          assert:
            - "LedgerEntry.${led1}.balance_after_cents == 1000"
            - "GET /ledger-entries with inmate_id ${inm} returns 2 rows in created_at order with balance_after_cents 1000 then 500"
            - "The second row has entry_type == CHARGE, amount_cents == -500 and source_copay_charge_id == ${chg}"
            - "Inmate.${inm}.account_balance_cents == 500"

  - section: validations
    instances:

      - name: release_plan_scheduled_lead_time_boundary
        claim_type: Violation to Error
        grounds:
          - "validations[priority=29]"
          - "errors[ERR_RELEASE_PLAN_LEAD_TIME]"
          - calculations.bridge_supply_days
        distinguishing_aspect: "A SCHEDULED plan six days ahead returns 422 ERR_RELEASE_PLAN_LEAD_TIME while exactly BRIDGE_SUPPLY_LEAD_DAYS (7) days ahead is accepted."
        test_recipe:
          setup:
            - "One inmate at clock 2026-05-01T00:00:00Z with no medication orders."
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-05-01T00:00:00Z" }
              as: HealthServicesAdmin
            - call: "POST /inmates"
              payload: { booking_number: "C-2290", full_name: "Vin Xiao", facility_code: "FAC-01", custody_level: "MEDIUM", booked_at: "2026-05-01T00:00:00Z" }
              as: IntakeOfficer
              captures: { inm: $.data.id }
          trigger:
            - call: "POST /inmates/${inm}/release-plans"
              payload: { release_type: "SCHEDULED", planned_release_at: "2026-05-07T00:00:00Z" }
              as: HealthServicesAdmin
              captures: { err: $.data.error_id }
            - call: "POST /inmates/${inm}/release-plans"
              payload: { release_type: "SCHEDULED", planned_release_at: "2026-05-08T00:00:00Z" }
              as: HealthServicesAdmin
              captures: { plan: $.data.id }
          assert:
            - "The first trigger call returns 422 with error_id ERR_RELEASE_PLAN_LEAD_TIME"
            - "The second trigger call returns 201"
            - "ReleasePlan.${plan}.bridge_supply_total_days == 0"
            - "ReleasePlan.${plan}.status == DRAFT"

      - name: grievance_filing_window_boundary
        claim_type: Violation to Error
        grounds:
          - "validations[priority=26]"
          - "errors[ERR_GRIEVANCE_FILING_WINDOW_EXPIRED]"
          - calculations.grievance_response_due
        distinguishing_aspect: "Filing exactly GRIEVANCE_FILING_WINDOW_DAYS[INFORMAL] (15) days after the grieved event is accepted; one second later returns 422 ERR_GRIEVANCE_FILING_WINDOW_EXPIRED."
        test_recipe:
          setup:
            - "One inmate; the grieved event occurred at 2026-05-01T00:00:00Z; clock advanced to 2026-05-16T00:00:00Z."
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-05-01T00:00:00Z" }
              as: HealthServicesAdmin
            - call: "POST /inmates"
              payload: { booking_number: "C-2300", full_name: "Wil Yates", facility_code: "FAC-01", custody_level: "MEDIUM", booked_at: "2026-05-01T00:00:00Z" }
              as: IntakeOfficer
              captures: { inm: $.data.id }
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-05-16T00:00:00Z" }
              as: HealthServicesAdmin
          trigger:
            - call: "POST /inmates/${inm}/grievances"
              payload: { grievance_text: "filed exactly on the window boundary", grieved_event_at: "2026-05-01T00:00:00Z" }
              as: Inmate
              as_user_id: "${inm}"
              captures: { grv_ok: $.data.id }
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-05-16T00:00:01Z" }
              as: HealthServicesAdmin
            - call: "POST /inmates/${inm}/grievances"
              payload: { grievance_text: "filed one second too late", grieved_event_at: "2026-05-01T00:00:00Z" }
              as: Inmate
              as_user_id: "${inm}"
              captures: { err: $.data.error_id }
          assert:
            - "The first trigger call returns 201"
            - "Grievance.${grv_ok}.stage == INFORMAL and Grievance.${grv_ok}.status == FILED"
            - "Grievance.${grv_ok}.response_due_at == 2026-05-21T00:00:00.000Z"
            - "The third trigger call returns 422 with error_id ERR_GRIEVANCE_FILING_WINDOW_EXPIRED"

      - name: waived_charge_is_not_reversible_by_grievance
        claim_type: Violation to Error
        grounds:
          - "validations[priority=34]"
          - "errors[ERR_CHARGE_NOT_REVERSIBLE]"
          - entities.CopayCharge.fields.status
        distinguishing_aspect: "A GRANTED grievance naming an already-WAIVED charge returns 409 ERR_CHARGE_NOT_REVERSIBLE, and no REVERSAL LedgerEntry is appended."
        test_recipe:
          setup:
            - "One inmate with a WAIVED MENTAL_HEALTH CopayCharge and a grievance naming it, accepted for review."
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-05-01T00:00:00Z" }
              as: HealthServicesAdmin
            - call: "POST /inmates"
              payload: { booking_number: "C-2310", full_name: "Xia Zeller", facility_code: "FAC-01", custody_level: "MEDIUM", booked_at: "2026-05-01T00:00:00Z" }
              as: IntakeOfficer
              captures: { inm: $.data.id }
            - call: "POST /inmates/${inm}/copay-charges"
              payload: { encounter_type: "MENTAL_HEALTH" }
              as: HealthServicesAdmin
              captures: { chg: $.data.id }
            - call: "POST /inmates/${inm}/grievances"
              payload: { grievance_text: "I should not have been billed at all", grieved_event_at: "2026-05-01T00:00:00Z", subject_copay_charge_id: "${chg}" }
              as: Inmate
              as_user_id: "${inm}"
              captures: { grv: $.data.id }
            - call: "POST /grievances/${grv}/accept"
              payload: {}
              as: GrievanceCoordinator
              as_user_id: "u-gc-1"
          trigger:
            - call: "POST /grievances/${grv}/decide"
              payload: { outcome: "GRANTED" }
              as: GrievanceCoordinator
              as_user_id: "u-gc-1"
              captures: { err: $.data.error_id }
          assert:
            - "The call returns 409 with error_id ERR_CHARGE_NOT_REVERSIBLE"
            - "CopayCharge.${chg}.status == WAIVED"
            - "Grievance.${grv}.status == UNDER_REVIEW"
            - "GET /ledger-entries with inmate_id ${inm} returns 0 rows"

      - name: kop_order_rejects_observed_swallow_field
        claim_type: Violation to Error
        grounds:
          - "validations[priority=21]"
          - "errors[ERR_KOP_OBSERVATION_FORBIDDEN]"
          - entities.MedicationOrder.fields.route_mode
        distinguishing_aspect: "Supplying observed_swallow on a KOP order's administration returns 422 ERR_KOP_OBSERVATION_FORBIDDEN - the mirror image of the DOT requirement."
        test_recipe:
          setup:
            - "One inmate with an ACTIVE KOP order and one SCHEDULED dose."
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-05-01T00:00:00Z" }
              as: HealthServicesAdmin
            - call: "POST /inmates"
              payload: { booking_number: "C-2320", full_name: "Yan Aoki", facility_code: "FAC-01", custody_level: "MEDIUM", booked_at: "2026-05-01T00:00:00Z" }
              as: IntakeOfficer
              captures: { inm: $.data.id, inm_v1: $.data.version }
            - call: "POST /medication-orders"
              payload: { inmate_id: "${inm}", drug_name: "Lisinopril", drug_class: "CHRONIC_MAINTENANCE", route_mode: "KOP", doses_per_day: 1, start_date: "2026-05-01T00:00:00Z", end_date: "2026-05-10T00:00:00Z", expected_inmate_version: "${inm_v1}" }
              as: Provider
              as_user_id: "u-prov-1"
              captures: { ord: $.data.id }
            - call: "POST /medication-orders/${ord}/administrations"
              payload: { scheduled_at: "2026-05-01T08:00:00Z" }
              as: Nurse
              as_user_id: "u-nurse-1"
              captures: { adm: $.data.id }
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-05-01T08:00:00Z" }
              as: HealthServicesAdmin
          trigger:
            - call: "POST /medication-administrations/${adm}/record"
              payload: { outcome: "ADMINISTERED", observed_swallow: true }
              as: Nurse
              as_user_id: "u-nurse-1"
              captures: { err: $.data.error_id }
            - call: "POST /medication-administrations/${adm}/record"
              payload: { outcome: "ADMINISTERED" }
              as: Nurse
              as_user_id: "u-nurse-1"
          assert:
            - "The first trigger call returns 422 with error_id ERR_KOP_OBSERVATION_FORBIDDEN"
            - "The second trigger call returns 200"
            - "MedicationAdministration.${adm}.outcome == ADMINISTERED"
            - "MedicationAdministration.${adm}.observed_swallow == null"

      - name: released_inmate_cannot_submit_new_sick_call
        claim_type: Cross-entity validation
        grounds:
          - "validations[priority=8]"
          - "errors[ERR_INMATE_NOT_IN_CUSTODY]"
          - state_machines.Inmate.IN_CUSTODY_to_RELEASED
        distinguishing_aspect: "After release the records stay OPEN, so the priority-7 freeze gate does NOT fire; the priority-8 custody gate does, returning 409 ERR_INMATE_NOT_IN_CUSTODY."
        test_recipe:
          setup:
            - "One inmate with a FINALIZED UNEXPECTED release plan who has been released."
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-05-01T00:00:00Z" }
              as: HealthServicesAdmin
            - call: "POST /inmates"
              payload: { booking_number: "C-2330", full_name: "Zac Bruno", facility_code: "FAC-01", custody_level: "MEDIUM", booked_at: "2026-05-01T00:00:00Z" }
              as: IntakeOfficer
              captures: { inm: $.data.id }
            - call: "POST /inmates/${inm}/release-plans"
              payload: { release_type: "UNEXPECTED", planned_release_at: "2026-05-02T00:00:00Z" }
              as: HealthServicesAdmin
              captures: { plan: $.data.id }
            - call: "POST /release-plans/${plan}/finalize"
              payload: {}
              as: HealthServicesAdmin
            - call: "POST /inmates/${inm}/release"
              payload: {}
              as: HealthServicesAdmin
          trigger:
            - call: "POST /sick-call-requests"
              payload: { inmate_id: "${inm}", complaint_text: "post-release question", encounter_type: "SICK_CALL" }
              as: Nurse
              as_user_id: "u-nurse-1"
              captures: { err: $.data.error_id }
          assert:
            - "The call returns 409 with error_id ERR_INMATE_NOT_IN_CUSTODY"
            - "Inmate.${inm}.custody_status == RELEASED"
            - "Inmate.${inm}.records_state == OPEN"
            - "ReleasePlan.${plan}.status == EXECUTED"
            - "ReleasePlan.${plan}.records_packet_ready == true"

  - section: endpoints
    instances:

      - name: copay_charges_filtered_by_source_sick_call_id
        claim_type: Computed read
        grounds:
          - entities.CopayCharge.fields.source_sick_call_id
          - state_machines.SickCallRequest.SCHEDULED_to_SEEN
        distinguishing_aspect: "The cascade-created CopayCharge is discoverable only through the reverse-reachability list: GET /copay-charges filtered by source_sick_call_id returns exactly the one charge posted by the SEEN transition."
        test_recipe:
          setup:
            - "One funded inmate whose sick-call request has been triaged, scheduled and seen, posting a FUNDED 500-cent charge."
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-05-01T00:00:00Z" }
              as: HealthServicesAdmin
            - call: "POST /inmates"
              payload: { booking_number: "C-2340", full_name: "Ana Duarte", facility_code: "FAC-01", custody_level: "MEDIUM", booked_at: "2026-05-01T00:00:00Z" }
              as: IntakeOfficer
              captures: { inm: $.data.id }
            - call: "POST /inmates/${inm}/ledger-entries"
              payload: { entry_type: "DEPOSIT", amount_cents: 1000, memo: "commissary deposit" }
