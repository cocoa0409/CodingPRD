          The disputed amount is bounded by the period's own settled figure with an OPEN lower bound
          and a CLOSED upper bound: 2,400,001 is one cent too far, 0 is not a dispute at all, and
          exactly 2,400,000 - the whole settled charge - is admissible. The two rejections must not
          move the period out of SETTLED, so the third call still finds a lawful SETTLED -> DISPUTED
          transition.
          
