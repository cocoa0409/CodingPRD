# =============================================================================
# PRD Benchmark Seed Tables: Recognition & Rewards Program Administration
# =============================================================================

scenario: |
  Recognition & Rewards Program Administration (employee recognition program): program design (peer/manager nomination) & point allocation budget, nomination approval workflow & duplicate prevention, points-to-catalog redemption & fulfillment vendor, tax treatment of non-cash awards & gross-up rules, service anniversary automation, budget accrual & department chargeback, participation analytics & inclusion monitoring, program abuse detection

domain_name: recognition-rewards-administration
api_prefix: /api

complexity_profile:
  primary_archetype: "Ledger reconciliation"
  secondary_archetype: "Quota / allocation"
  complexity_layers:
    - optimistic_concurrency      # OCC on Program / Nomination / PointBudget versions
    - cascading_side_effects      # approve -> award -> ledger -> tier; abuse confirm -> suspend -> revoke -> void
    - dual_variant_calculation    # gross-up provisional vs final; accrual straight-line vs utilization-weighted
    - ops_run_checkpoint          # logical clock advances: auto-expiry, budget close, anniversary scan
  entity_topology: flat           # peer entities joined by foreign keys; no nested URL hierarchy
  state_machine_shape: hybrid     # cyclic (Nomination revision loop) + parallel (RedemptionOrder fulfillment x escrow) + posture_driven (PointBudget)
  relationship_patterns:
    - one_to_many
    - self_referential            # Employee.manager_id -> Employee.id (reporting chain)
    - polymorphic                 # PointLedgerEntry.reference_* -> Award | RedemptionOrder | AbuseFlag | AccrualRun
    - cross_aggregate             # Nomination -> PointBudget posture gate; TaxRecord -> RedemptionOrder
  role_model: segregation_of_duties  # FinanceAdmin runs accruals; PayrollSpecialist finalizes tax; approver != nominator
  consistency_model: immediate

# =============================================================================
# Table 1: Entity-Relationship Table
# =============================================================================
entities:
  - name: Program
    parent: null
    common_fields: true
    fields:
      - { name: name, type: string, source: input, description: "Program display name" }
      - { name: status, type: enum, source: system, default: DRAFT, description: "DRAFT | ACTIVE | SUSPENDED | CLOSED", constraints: "initial DRAFT" }
      - { name: peer_nomination_enabled, type: boolean, source: input, default: true, description: "Whether PEER nominations are accepted" }
      - { name: manager_nomination_enabled, type: boolean, source: input, default: true, description: "Whether MANAGER nominations are accepted" }
      - { name: max_points_per_nomination, type: integer, source: input, description: "Hard cap on points_requested per nomination", constraints: "> 0" }
      - { name: point_cost_rate_cents, type: number, source: input, description: "Budgetary cents per point for chargeback math (may be fractional, e.g. 0.5)", constraints: "> 0" }
      - { name: state_rate_map, type: object, source: input, description: "Map of 2-letter state code to supplemental state tax rate (e.g. {\"CA\": 0.093, \"TX\": 0.0}); missing key => 0.0" }
      - { name: grossup_enabled, type: boolean, source: input, default: false, description: "Whether employer pays tax gross-up on taxable awards" }
      - { name: anniversary_milestones, type: array, source: input, default: [], description: "Array of { years: integer, points: integer } milestone table for service anniversaries" }
      - { name: nomination_review_sla_days, type: integer, source: input, default: 14, description: "Days before a PENDING_REVIEW or RETURNED_FOR_REVISION nomination auto-expires" }
      - { name: duplicate_window_days, type: integer, source: input, default: 30, description: "Window for duplicate nomination detection (same nominator, nominee, reason_code)" }
      - { name: velocity_limit_per_7_days, type: integer, source: input, default: 5, description: "Max nominations a nominator may submit in any trailing 7-day window; attempt beyond this is rejected and flagged" }
      - { name: accrual_method, type: enum, source: input, default: STRAIGHT_LINE, description: "STRAIGHT_LINE | UTILIZATION_WEIGHTED — selects the monthly accrual variant" }
      - { name: fiscal_year_start_month, type: integer, source: input, default: 1, description: "1-12; accrual periods are calendar months, so this only labels the year boundary" }

  - name: Department
    parent: null
    common_fields: true
    fields:
      - { name: name, type: string, source: input, description: "Department name" }
      - { name: chargeback_account_code, type: string, source: input, description: "GL account code used on chargeback entries" }

  - name: Employee
    parent: null
    common_fields: true
    fields:
      - { name: employee_ref, type: string, source: input, description: "Unique external employee reference (e.g. HRIS id)" , constraints: "unique across all employees" }
      - { name: full_name, type: string, source: input, description: "Display name" }
      - { name: department_id, type: string, source: input, description: "FK -> Department.id; home department used for budget and chargeback attribution" }
      - { name: manager_id, type: string, source: input, description: "FK -> Employee.id; direct manager, nullable for top of chain", constraints: "nullable; must not equal own id; must not create a cycle in the manager chain" }
      - { name: hire_date, type: string, source: input, description: "ISO date YYYY-MM-DD; drives anniversary milestones" }
      - { name: state_code, type: string, source: input, description: "2-letter state code for supplemental state tax rate lookup" }
      - { name: program_status, type: enum, source: system, default: ELIGIBLE, description: "ELIGIBLE | SUSPENDED — SUSPENDED blocks nominating and redeeming" }
      - { name: recognition_tier, type: enum, source: computed, default: BRONZE, description: "BRONZE | SILVER | GOLD | PLATINUM derived from lifetime_granted_points" }
      - { name: available_points, type: integer, source: computed, default: 0, description: "Spendable points = sum of ledger; may go negative after clawback of already-spent awards" }
      - { name: held_points, type: integer, source: computed, default: 0, description: "Points escrowed by open redemption orders" }
      - { name: lifetime_granted_points, type: integer, source: computed, default: 0, description: "Sum of GRANT_* ledger entries minus CLAWBACK entries" }
      - { name: lifetime_redeemed_points, type: integer, source: computed, default: 0, description: "Settled redemption points (including restocking fee points)" }
      - { name: lifetime_expired_points, type: integer, source: computed, default: 0, description: "Points removed by award expiry" }
      - { name: ytd_supplemental_wages_cents, type: integer, source: system, default: 0, description: "Year-to-date supplemental wages for the current calendar year; set only via POST /api/employees/{id}/compensation-adjustments (PayrollSpecialist)" }
      - { name: ytd_de_minimis_cents, type: integer, source: computed, default: 0, description: "Year-to-date excluded de-minimis award value" }

  - name: PointLedgerEntry
    parent: null
    common_fields: false
    fields:
      - { name: employee_id, type: string, source: system, description: "FK -> Employee.id; account owner" }
      - { name: entry_type, type: enum, source: system, description: "GRANT_NOMINATION | GRANT_ANNIVERSARY | GRANT_ADJUSTMENT | HOLD | SETTLE_REDEEM | REFUND | RESTOCKING_FEE | EXPIRY | CLAWBACK" }
      - { name: points, type: integer, source: system, description: "Signed points movement applied to available_points (HOLD moves available->held; SETTLE_REDEEM/RESTOCKING_FEE move held->spent; CLAWBACK/EXPIRY debit available)" }
      - { name: reference_type, type: enum, source: system, description: "AWARD | REDEMPTION_ORDER | ABUSE_FLAG — polymorphic companion of reference_id (not a formal FK); AWARD set by GRANT_*/EXPIRY entries, REDEMPTION_ORDER by HOLD/SETTLE_REDEEM/REFUND/RESTOCKING_FEE, ABUSE_FLAG by cascade CLAWBACK entries" }
      - { name: reference_id, type: string, source: system, description: "Polymorphic id of the referenced entity; interpreted via reference_type (not a formal FK)" }
      - { name: idempotency_key, type: string, source: system, description: "Unique per employee_id; derived from the originating request's idempotency key plus entry role", constraints: "unique per (employee_id, idempotency_key)" }
      - { name: note, type: string, source: system, description: "Human-readable derivation note" }

  - name: PointBudget
    parent: null
    common_fields: true
    fields:
      - { name: program_id, type: string, source: input, description: "FK -> Program.id" }
      - { name: department_id, type: string, source: input, description: "FK -> Department.id" }
      - { name: period_start_date, type: string, source: input, description: "ISO date; half-open window start (inclusive)" }
      - { name: period_end_date, type: string, source: input, description: "ISO date; half-open window end (exclusive); must be > period_start_date", constraints: "windows for the same (program_id, department_id) must not overlap; adjacency (start == other.end) is allowed" }
      - { name: allocated_points, type: integer, source: input, description: "Total point pool for the window", constraints: "> 0" }
      - { name: reserved_points, type: integer, source: computed, default: 0, description: "Points held by non-terminal nominations (PENDING_REVIEW or RETURNED_FOR_REVISION)" }
      - { name: committed_points, type: integer, source: computed, default: 0, description: "Points granted via approved awards, net of revocations and expiries" }
      - { name: posture, type: enum, source: computed, default: OPEN, description: "OPEN | RESTRICTED | EXHAUSTED | CLOSED — derived from utilization and clock; gates nomination submission" }

  - name: Nomination
    parent: null
    common_fields: true
    fields:
      - { name: program_id, type: string, source: input, description: "FK -> Program.id" }
      - { name: nominator_id, type: string, source: system, description: "FK -> Employee.id; equals X-User-ID of the submitter" }
      - { name: nominee_id, type: string, source: input, description: "FK -> Employee.id" }
      - { name: type, type: enum, source: input, description: "PEER | MANAGER — PEER requires same department; MANAGER requires nominator in nominee's manager chain" }
      - { name: points_requested, type: integer, source: input, description: "Points to grant on approval", constraints: "1 <= points_requested <= program.max_points_per_nomination" }
      - { name: reason_code, type: enum, source: input, description: "TEAMWORK | INNOVATION | CUSTOMER_SAVE | DELIVERY | MENTORSHIP | OTHER" }
      - { name: message, type: string, source: input, description: "Free-text justification" }
      - { name: idempotency_key, type: string, source: input, description: "Client key; unique per nominator_id", constraints: "unique per nominator_id" }
      - { name: status, type: enum, source: system, default: PENDING_REVIEW, description: "PENDING_REVIEW | RETURNED_FOR_REVISION | APPROVED | REJECTED | CANCELLED | EXPIRED" }
      - { name: revision_count, type: integer, source: system, default: 0, description: "Number of RETURNED_FOR_REVISION cycles; returning when revision_count == 2 auto-rejects instead" }
      - { name: review_deadline, type: datetime, source: computed, description: "submitted_or_resubmitted_at + program.nomination_review_sla_days; auto-expiry boundary" }
      - { name: budget_id, type: string, source: system, description: "FK -> PointBudget.id; budget selected at submission by (program, nominee department, window containing submission date)" }
      - { name: award_id, type: string, source: system, description: "FK -> Award.id; set on approval (nullable until APPROVED)" }
      - { name: reviewer_id, type: string, source: system, description: "FK -> Employee.id of deciding manager, or opaque HRAdmin id; set on approve/reject/return" }
      - { name: decided_at, type: datetime, source: system, description: "Logical timestamp of last review decision" }

  - name: Award
    parent: null
    common_fields: true
    fields:
      - { name: program_id, type: string, source: system, description: "FK -> Program.id" }
      - { name: employee_id, type: string, source: system, description: "FK -> Employee.id; recipient" }
      - { name: nomination_id, type: string, source: system, description: "FK -> Nomination.id; null for ANNIVERSARY or ADJUSTMENT sources", constraints: "nullable" }
      - { name: source, type: enum, source: system, description: "NOMINATION | ANNIVERSARY | ADJUSTMENT" }
      - { name: points, type: integer, source: system, description: "Granted points" }
      - { name: points_remaining, type: integer, source: computed, description: "Unspent, unexpired points left on this award; decremented FIFO by redemptions and expiry" }
      - { name: status, type: enum, source: system, default: ACTIVE, description: "ACTIVE | FULLY_REDEEMED | EXPIRED | REVOKED" }
      - { name: granted_at, type: datetime, source: system, description: "Logical clock timestamp at grant (drives FIFO order and expiry)" }
      - { name: expires_at, type: datetime, source: computed, description: "granted_at + 12 months; expiry processed on clock advance" }
      - { name: revoked_by_flag_id, type: string, source: system, description: "FK -> AbuseFlag.id when revocation came from a confirmed abuse flag; null otherwise", constraints: "nullable" }

  - name: FulfillmentVendor
    parent: null
    common_fields: true
    fields:
      - { name: name, type: string, source: input, description: "Vendor name" }
      - { name: vendor_code, type: string, source: input, description: "Unique vendor code", constraints: "unique" }
      - { name: daily_ship_capacity, type: integer, source: input, description: "Max orders assigned the same ship_date", constraints: ">= 1" }
      - { name: lead_time_business_days, type: integer, source: input, description: "Business days (Mon-Fri) between submission and earliest assignable ship_date", constraints: ">= 0" }
      - { name: restocking_fee_percent, type: integer, source: input, default: 20, description: "Integer percent of points_total kept as fee on returns", constraints: "0 <= p <= 100" }
      - { name: supported_categories, type: array, source: input, description: "Array of catalog categories the vendor can fulfill" }
      - { name: status, type: enum, source: system, default: ACTIVE, description: "ACTIVE | SUSPENDED" }

  - name: CatalogItem
    parent: null
    common_fields: true
    fields:
      - { name: vendor_id, type: string, source: input, description: "FK -> FulfillmentVendor.id" }
      - { name: sku, type: string, source: input, description: "Vendor SKU", constraints: "unique per vendor_id" }
      - { name: name, type: string, source: input, description: "Item name" }
      - { name: category, type: string, source: input, description: "Category; must be in vendor.supported_categories" }
      - { name: point_cost, type: integer, source: input, description: "Points per unit", constraints: "> 0" }
      - { name: cash_value_cents, type: integer, source: input, description: "Fair-market cash value per unit; taxable value basis", constraints: "> 0" }
      - { name: taxable_class, type: enum, source: input, description: "MERCHANDISE | GIFT_CARD | EXPERIENCE — GIFT_CARD is never de-minimis eligible" }
      - { name: de_minimis_eligible, type: boolean, source: input, default: false, description: "Whether value can be excluded under the annual de-minimis cap" }
      - { name: active_window_start, type: datetime, source: input, description: "Half-open availability window start (inclusive)" }
      - { name: active_window_end, type: datetime, source: input, description: "Half-open availability window end (exclusive)", constraints: "> active_window_start" }
      - { name: inventory_quantity, type: integer, source: input, description: "Stock on hand; null means unlimited", constraints: "nullable; >= 0" }
      - { name: status, type: enum, source: system, default: ACTIVE, description: "ACTIVE | RETIRED" }

  - name: RedemptionOrder
    parent: null
    common_fields: true
    fields:
      - { name: employee_id, type: string, source: system, description: "FK -> Employee.id; equals X-User-ID of the redeemer" }
      - { name: program_id, type: string, source: system, description: "FK -> Program.id; resolved from the catalog item's program catalog scope — in this scaffold the item's vendor-agnostic catalog is program-global, so the single ACTIVE program at creation time is used; pinned to the program of the employee's department budget that granted the oldest unexpired points" }
      - { name: catalog_item_id, type: string, source: input, description: "FK -> CatalogItem.id" }
      - { name: quantity, type: integer, source: input, default: 1, description: "Units ordered", constraints: "1 <= quantity <= 5" }
      - { name: points_total, type: integer, source: computed, description: "= catalog_item.point_cost * quantity, snapshotted at creation" }
      - { name: fulfillment_status, type: enum, source: system, default: PENDING_SUBMISSION, description: "PENDING_SUBMISSION | SUBMITTED | SHIPPED | DELIVERED | RETURN_REQUESTED | RETURNED | CANCELLED" }
      - { name: escrow_status, type: enum, source: system, default: HELD, description: "HELD | SETTLED | REFUNDED | SETTLED_WITH_FEE — parallel state dimension" }
      - { name: ship_date, type: string, source: system, description: "ISO date assigned at submit by the vendor capacity selector; null until SUBMITTED", constraints: "nullable" }
      - { name: idempotency_key, type: string, source: input, description: "Client key; unique per employee_id", constraints: "unique per employee_id" }
      - { name: tax_record_id, type: string, source: system, description: "Id of the TaxRecord created at DELIVERED; null until then (1:1 link surfaced via GET /api/tax-records?redemption_order_id=)", constraints: "nullable" }
      - { name: restocking_fee_points, type: integer, source: system, default: 0, description: "Points kept as fee when SETTLED_WITH_FEE" }
      - { name: delivered_at, type: datetime, source: system, description: "Logical timestamp of delivery; return window anchor", constraints: "nullable" }

  - name: TaxRecord
    parent: null
    common_fields: true
    fields:
      - { name: employee_id, type: string, source: system, description: "FK -> Employee.id" }
      - { name: program_id, type: string, source: system, description: "FK -> Program.id" }
      - { name: redemption_order_id, type: string, source: system, description: "FK -> RedemptionOrder.id that created this record", constraints: "exactly one record per delivered order" }
      - { name: tax_year, type: integer, source: system, description: "Calendar year of delivered_at" }
      - { name: taxable_value_cents, type: integer, source: computed, description: "cash_value_cents * quantity, or 0 when fully excluded by the de-minimis rule" }
      - { name: de_minimis_applied, type: boolean, source: computed, default: false, description: "True when the award was excluded under the annual de-minimis cap" }
      - { name: federal_rate_applied, type: number, source: computed, description: "0.22 or 0.37 per the supplemental-wage tier rule at computation time" }
      - { name: state_rate_applied, type: number, source: computed, description: "Rate from program.state_rate_map for employee.state_code (0.0 if missing)" }
      - { name: estimated_gross_up_cents, type: integer, source: computed, description: "PROVISIONAL variant gross-up computed at delivery (0 when program.grossup_enabled is false or taxable_value_cents is 0)" }
      - { name: final_gross_up_cents, type: integer, source: computed, description: "FINAL variant gross-up recomputed at tax-year finalization; null until FINALIZED", constraints: "nullable" }
      - { name: delta_cents, type: integer, source: computed, description: "final_gross_up_cents - estimated_gross_up_cents; null until FINALIZED", constraints: "nullable" }
      - { name: employer_cost_cents, type: integer, source: computed, description: "taxable_value_cents + estimated_gross_up_cents (chargeback basis for the delivery period)" }
      - { name: status, type: enum, source: system, default: ESTIMATED, description: "ESTIMATED | FINALIZED | AMENDED | VOIDED" }

  - name: AccrualRun
    parent: null
    common_fields: true
    fields:
      - { name: program_id, type: string, source: input, description: "FK -> Program.id" }
      - { name: period_year, type: integer, source: input, description: "Accrual period year" }
      - { name: period_month, type: integer, source: input, description: "Accrual period month 1-12", constraints: "unique per (program_id, period_year, period_month) among non-VOIDED runs" }
      - { name: status, type: enum, source: system, default: OPEN, description: "OPEN | RECONCILED | CLOSED | VOIDED" }
      - { name: accrual_method_used, type: enum, source: system, description: "Snapshot of program.accrual_method at run creation: STRAIGHT_LINE | UTILIZATION_WEIGHTED" }
      - { name: department_breakdown, type: array, source: computed, description: "Per-department entries: { department_id, accrual_cents, redemption_cost_cents, gross_up_expense_cents, forfeiture_credit_cents, net_chargeback_cents }" }
      - { name: total_accrual_cents, type: integer, source: computed, description: "Sum of department accrual_cents" }
      - { name: total_net_chargeback_cents, type: integer, source: computed, description: "Sum of department net_chargeback_cents" }
      - { name: variance_cents, type: integer, source: computed, description: "Recomputed-at-reconcile net chargeback minus posted total_net_chargeback_cents; must be 0 to RECONCILE" }

  - name: AbuseFlag
    parent: null
    common_fields: true
    fields:
      - { name: employee_id, type: string, source: system, description: "FK -> Employee.id; subject of the flag" }
      - { name: program_id, type: string, source: system, description: "FK -> Program.id" }
      - { name: rule_code, type: enum, source: system, description: "VELOCITY_EXCEEDED | DUPLICATE_ATTEMPT | SELF_NOMINATION | MANAGER_QUID_PRO_QUO | REDEMPTION_ANOMALY | MANUAL_REVIEW" }
      - { name: details, type: object, source: system, description: "Structured evidence (counts, window, related ids)" }
      - { name: status, type: enum, source: system, default: OPEN, description: "OPEN | UNDER_REVIEW | CONFIRMED | DISMISSED" }
      - { name: raised_by, type: string, source: system, description: "'system' or the HRAdmin X-User-ID" }
      - { name: resolved_by, type: string, source: system, description: "HRAdmin X-User-ID that confirmed or dismissed", constraints: "nullable" }

  - name: AnniversaryEvent
    parent: null
    common_fields: true
    fields:
      - { name: program_id, type: string, source: system, description: "FK -> Program.id" }
      - { name: employee_id, type: string, source: system, description: "FK -> Employee.id" }
      - { name: milestone_years, type: integer, source: system, description: "Service years reached at scan date" }
      - { name: scheduled_date, type: string, source: system, description: "ISO date the event was processed (logical clock date)" }
      - { name: status, type: enum, source: system, description: "PROCESSED | SKIPPED_INELIGIBLE | SKIPPED_DUPLICATE | SKIPPED_NO_MILESTONE | SKIPPED_BUDGET_EXHAUSTED" }
      - { name: award_id, type: string, source: system, description: "FK -> Award.id created when PROCESSED; null otherwise", constraints: "nullable" }

# =============================================================================
# Table 2: State Machine Table
# =============================================================================
state_machines:
  - entity: Program
    initial_state: DRAFT
    terminal_states: [CLOSED]
    transitions:
      - from: DRAFT
        to: ACTIVE
        trigger: "POST /api/programs/{programId}/activate"
        actor: HRAdmin
        preconditions:
          - "program.status == DRAFT or program.status == SUSPENDED (else ERR_INVALID_STATE_TRANSITION)"
          - "program has at least one anniversary_milestones entry OR at least one nomination mode enabled (else ERR_INVALID_REQUEST)"
        side_effects:
          - "increments Program.version by 1"
      - from: SUSPENDED
        to: ACTIVE
        trigger: "POST /api/programs/{programId}/activate"
        actor: HRAdmin
        preconditions: []
        side_effects:
          - "increments Program.version by 1"
      - from: ACTIVE
        to: SUSPENDED
        trigger: "POST /api/programs/{programId}/suspend"
        actor: HRAdmin
        preconditions: []
        side_effects:
          - "increments Program.version by 1"
          - "new nominations, redemptions, budgets, and anniversary scans are rejected while SUSPENDED (ERR_PROGRAM_NOT_ACTIVE)"
      - from: ACTIVE
        to: CLOSED
        trigger: "POST /api/programs/{programId}/close (not exposed as a separate endpoint: HRAdmin PATCHes status=CLOSED via PATCH /api/programs/{programId})"
        actor: HRAdmin
        preconditions:
          - "no Nomination in PENDING_REVIEW or RETURNED_FOR_REVISION for this program (ERR_INVALID_STATE_TRANSITION)"
          - "no RedemptionOrder with fulfillment_status in {PENDING_SUBMISSION, SUBMITTED, SHIPPED, RETURN_REQUESTED} (ERR_INVALID_STATE_TRANSITION)"
        side_effects:
          - "increments Program.version by 1"
    note: "Program close is performed through PATCH /api/programs/{programId} with payload status=CLOSED; the PATCH endpoint enforces the preconditions above."

  - entity: Nomination
    initial_state: PENDING_REVIEW
    terminal_states: [APPROVED, REJECTED, CANCELLED, EXPIRED]
    transitions:
      - from: PENDING_REVIEW
        to: APPROVED
        trigger: "POST /api/nominations/{nominationId}/approve"
        actor: Manager | HRAdmin
        preconditions:
          - "nomination.status == PENDING_REVIEW (else ERR_INVALID_STATE_TRANSITION)"
          - "expected_nomination_version == nomination.version (else ERR_STALE_VERSION)"
          - "approver != nominator (else ERR_SELF_APPROVAL)"
          - "if actor role is Manager: approver must be in nominee's manager chain (walk nominee.manager_id transitively; else ERR_NOMINEE_NOT_IN_SCOPE)"
        side_effects:
          - "create Award (source=NOMINATION, points=points_requested, employee_id=nominee_id, nomination_id=nomination.id, granted_at=now, expires_at=now+12 months, points_remaining=points_requested) and set nomination.award_id"
          - "create PointLedgerEntry GRANT_NOMINATION for nominee (+points_requested)"
          - "PointBudget (nomination.budget_id): reserved_points -= points_requested; committed_points += points_requested; recompute posture"
          - "recompute nominee available_points, lifetime_granted_points, recognition_tier (cascade: tier may promote BRONZE->SILVER->GOLD->PLATINUM)"
          - "nomination.decided_at = now; reviewer_id = acting user"
          - "increments Nomination.version by 1"
      - from: PENDING_REVIEW
        to: REJECTED
        trigger: "POST /api/nominations/{nominationId}/reject"
        actor: Manager | HRAdmin
        preconditions:
          - "nomination.status == PENDING_REVIEW (else ERR_INVALID_STATE_TRANSITION)"
          - "approver != nominator (else ERR_SELF_APPROVAL)"
          - "if actor role is Manager: approver in nominee's manager chain (else ERR_NOMINEE_NOT_IN_SCOPE)"
        side_effects:
          - "PointBudget: reserved_points -= points_requested; recompute posture"
          - "nomination.decided_at = now; reviewer_id = acting user"
          - "increments Nomination.version by 1"
      - from: PENDING_REVIEW
        to: RETURNED_FOR_REVISION
        trigger: "POST /api/nominations/{nominationId}/return-for-revision"
        actor: Manager | HRAdmin
        preconditions:
          - "nomination.status == PENDING_REVIEW (else ERR_INVALID_STATE_TRANSITION)"
          - "nomination.revision_count < 2 (else the nomination is auto-rejected instead: status becomes REJECTED, revision_count stays 2, and this response returns the REJECTED nomination with 200)"
          - "approver != nominator (else ERR_SELF_APPROVAL)"
        side_effects:
          - "revision_count += 1 (when the revision path is taken)"
          - "review_deadline = now + program.nomination_review_sla_days"
          - "on the auto-reject branch: PointBudget reserved_points -= points_requested; recompute posture"
          - "increments Nomination.version by 1"
        note: "return-for-revision is a dual-outcome endpoint: revision_count < 2 returns 200 with status RETURNED_FOR_REVISION; revision_count == 2 returns 200 with status REJECTED (the third return is an auto-reject, not an error)."
      - from: RETURNED_FOR_REVISION
        to: PENDING_REVIEW
        trigger: "POST /api/nominations/{nominationId}/resubmit"
        actor: Employee | Manager
        preconditions:
          - "nomination.status == RETURNED_FOR_REVISION (else ERR_INVALID_STATE_TRANSITION)"
          - "acting user must be the original nominator (X-User-ID == nominator_id; else ERR_FORBIDDEN_FOR_ROLE)"
          - "if points_requested is changed: re-run budget prospective-utilization check (reserved recompute) against the budget; on failure release nothing and return ERR_BUDGET_EXHAUSTED / ERR_BUDGET_RESTRICTED_AMOUNT per posture rules"
        side_effects:
          - "if points_requested changed: PointBudget.reserved_points adjusts by the delta (new minus old); recompute posture"
          - "review_deadline = now + program.nomination_review_sla_days"
          - "increments Nomination.version by 1 (this is what invalidates an approver's previously observed version)"
      - from: PENDING_REVIEW
        to: CANCELLED
        trigger: "POST /api/nominations/{nominationId}/cancel"
        actor: Employee | Manager
        preconditions:
          - "acting user is the nominator (else ERR_FORBIDDEN_FOR_ROLE)"
        side_effects:
          - "PointBudget: reserved_points -= points_requested; recompute posture"
          - "increments Nomination.version by 1"
      - from: RETURNED_FOR_REVISION
        to: CANCELLED
        trigger: "POST /api/nominations/{nominationId}/cancel"
        actor: Employee | Manager
        preconditions:
          - "acting user is the nominator (else ERR_FORBIDDEN_FOR_ROLE)"
        side_effects:
          - "PointBudget: reserved_points -= points_requested; recompute posture"
          - "increments Nomination.version by 1"
      - from: PENDING_REVIEW
        to: EXPIRED
        trigger: "system (on POST /api/_clock/set_current_utc advance, when review_deadline < new clock time)"
        actor: system
        preconditions: []
        side_effects:
          - "PointBudget: reserved_points -= points_requested; recompute posture"
          - "increments Nomination.version by 1"
      - from: RETURNED_FOR_REVISION
        to: EXPIRED
        trigger: "system (on POST /api/_clock/set_current_utc advance, when review_deadline < new clock time)"
        actor: system
        preconditions: []
        side_effects:
          - "PointBudget: reserved_points -= points_requested; recompute posture"
          - "increments Nomination.version by 1"
    note: "PENDING_REVIEW -> RETURNED_FOR_REVISION -> PENDING_REVIEW is the revision cycle (max 2 returns; third return auto-rejects)."

  - entity: PointBudget
    initial_state: OPEN
    terminal_states: [CLOSED]
    transitions:
      - from: OPEN
        to: RESTRICTED
        trigger: "system (automatic when (reserved_points + committed_points) * 10000 / allocated_points >= 8500 and < 10000, evaluated after every mutation of reserved/committed/allocated)"
        actor: system
        preconditions: []
        side_effects:
          - "posture change does NOT alter stored counters; it gates POST /api/nominations (points_requested <= 500 while RESTRICTED)"
      - from: RESTRICTED
        to: OPEN
        trigger: "system (automatic when utilization drops below 8500 bp, e.g. after rejection/cancel/expiry releases reservations)"
        actor: system
        preconditions: []
        side_effects: []
      - from: OPEN
        to: EXHAUSTED
        trigger: "system (automatic when reserved_points + committed_points >= allocated_points)"
        actor: system
        preconditions: []
        side_effects:
          - "all new nomination submissions against this budget rejected with ERR_BUDGET_EXHAUSTED"
      - from: RESTRICTED
        to: EXHAUSTED
        trigger: "system (automatic when reserved_points + committed_points >= allocated_points)"
        actor: system
        preconditions: []
        side_effects: []
      - from: EXHAUSTED
        to: RESTRICTED
        trigger: "system (automatic when utilization falls back into [8500, 10000) bp after releases)"
        actor: system
        preconditions: []
        side_effects: []
      - from: EXHAUSTED
        to: OPEN
        trigger: "system (automatic when utilization falls below 8500 bp after releases or an allocation increase via POST /api/budgets/{budgetId}/adjustments)"
        actor: system
        preconditions: []
        side_effects: []
      - from: ANY
        to: CLOSED
        trigger: "system (on POST /api/_clock/set_current_utc advance, when current logical date >= period_end_date)"
        actor: system
        preconditions:
          - "auto-close runs AFTER nomination auto-expiry in the same clock advance (expiring nominations release their reservations first)"
        side_effects:
          - "reserved_points set to 0 (all remaining non-terminal nominations were expired earlier in the same clock advance)"
          - "further nomination submissions selecting this budget window receive ERR_BUDGET_NOT_FOUND (window no longer contains current date) — posture CLOSED is terminal"
          - "increments PointBudget.version by 1"
    note: "posture is a stored derived column recomputed on every mutation; it is ALSO readable as the entity's posture field. Shape: posture_driven."

  - entity: RedemptionOrder
    initial_state: "fulfillment_status=PENDING_SUBMISSION, escrow_status=HELD"
    terminal_states: ["fulfillment_status IN {DELIVERED, RETURNED, CANCELLED} with escrow_status IN {SETTLED, REFUNDED, SETTLED_WITH_FEE}"]
    transitions:
      - from: "fulfillment=PENDING_SUBMISSION (escrow=HELD)"
        to: "fulfillment=SUBMITTED (escrow=HELD)"
        trigger: "POST /api/redemption-orders/{redemptionOrderId}/submit"
        actor: VendorOps
        preconditions:
          - "fulfillment_status == PENDING_SUBMISSION (else ERR_INVALID_STATE_TRANSITION)"
          - "vendor.status == ACTIVE (else ERR_VENDOR_SUSPENDED)"
          - "a capacity slot exists within 45 calendar days of the logical today (else ERR_VENDOR_CAPACITY_EXCEEDED)"
        side_effects:
          - "ship_date assigned by vendor_ship_date_assignment calculation"
          - "increments RedemptionOrder.version by 1"
      - from: "fulfillment=SUBMITTED (escrow=HELD)"
        to: "fulfillment=SHIPPED (escrow=HELD)"
        trigger: "POST /api/redemption-orders/{redemptionOrderId}/mark-shipped"
        actor: VendorOps
        preconditions:
          - "fulfillment_status == SUBMITTED (else ERR_INVALID_STATE_TRANSITION)"
        side_effects:
          - "increments RedemptionOrder.version by 1"
      - from: "fulfillment=SHIPPED (escrow=HELD)"
        to: "fulfillment=DELIVERED (escrow=SETTLED)"
        trigger: "POST /api/redemption-orders/{redemptionOrderId}/mark-delivered"
        actor: VendorOps
        preconditions:
          - "fulfillment_status == SHIPPED (else ERR_INVALID_STATE_TRANSITION)"
        side_effects:
          - "create PointLedgerEntry SETTLE_REDEEM (-points_total from held_points; lifetime_redeemed_points += points_total)"
          - "consume points FIFO across the employee's ACTIVE awards (granted_at ASC, tie created_at ASC), decrementing award.points_remaining; awards reaching 0 become FULLY_REDEEMED"
          - "create TaxRecord (ESTIMATED) applying the de-minimis rule and the PROVISIONAL gross-up variant; set order.tax_record_id"
          - "delivered_at = now (logical)"
          - "the delivery is pickable by the next AccrualRun covering delivered_at's calendar month (chargeback contribution)"
          - "increments RedemptionOrder.version by 1"
      - from: "fulfillment=PENDING_SUBMISSION (escrow=HELD)"
        to: "fulfillment=CANCELLED (escrow=REFUNDED)"
        trigger: "POST /api/redemption-orders/{redemptionOrderId}/cancel"
        actor: Employee | HRAdmin
        preconditions:
          - "fulfillment_status in {PENDING_SUBMISSION, SUBMITTED} (else ERR_INVALID_STATE_TRANSITION)"
          - "if actor role is Employee: X-User-ID == order.employee_id (else ERR_FORBIDDEN_FOR_ROLE)"
        side_effects:
          - "create PointLedgerEntry REFUND (+points_total to available_points, -points_total from held_points)"
          - "restore catalog item inventory (+quantity) when inventory_quantity is not null"
          - "if order was SUBMITTED: free the vendor ship_date capacity slot"
          - "increments RedemptionOrder.version by 1"
      - from: "fulfillment=SUBMITTED (escrow=HELD)"
        to: "fulfillment=CANCELLED (escrow=REFUNDED)"
        trigger: "POST /api/redemption-orders/{redemptionOrderId}/cancel"
        actor: Employee | HRAdmin
        preconditions:
          - "same as cancel from PENDING_SUBMISSION"
        side_effects:
          - "same refund/inventory/capacity-release effects as cancel from PENDING_SUBMISSION"
      - from: "fulfillment=DELIVERED (escrow=SETTLED)"
        to: "fulfillment=RETURN_REQUESTED (escrow=SETTLED)"
        trigger: "POST /api/redemption-orders/{redemptionOrderId}/request-return"
        actor: Employee
        preconditions:
          - "fulfillment_status == DELIVERED (else ERR_INVALID_STATE_TRANSITION)"
          - "X-User-ID == order.employee_id (else ERR_FORBIDDEN_FOR_ROLE)"
          - "catalog item taxable_class != GIFT_CARD (else ERR_RETURN_NOT_ALLOWED)"
          - "now <= delivered_at + 14 days (else ERR_RETURN_NOT_ALLOWED)"
        side_effects:
          - "increments RedemptionOrder.version by 1"
      - from: "fulfillment=RETURN_REQUESTED (escrow=SETTLED)"
        to: "fulfillment=RETURNED (escrow=SETTLED_WITH_FEE)"
        trigger: "POST /api/redemption-orders/{redemptionOrderId}/complete-return"
        actor: VendorOps
        preconditions:
          - "fulfillment_status == RETURN_REQUESTED (else ERR_INVALID_STATE_TRANSITION)"
        side_effects:
          - "restocking_fee_points = floor(points_total * vendor.restocking_fee_percent / 100)"
          - "create PointLedgerEntry REFUND (+(points_total - restocking_fee_points) to available_points) and RESTOCKING_FEE (-restocking_fee_points; counted in lifetime_redeemed_points)"
          - "refunded points are NOT added back to award.points_remaining (awards already consumed stay consumed); refund lands in available_points only"
          - "item inventory is NOT restored on returns"
          - "the linked TaxRecord: if ESTIMATED -> VOIDED; if FINALIZED -> AMENDED (final figures retained, taxable reversed to 0 via a compensating amendment note in details)"
          - "increments RedemptionOrder.version by 1"
    note: "Two parallel state dimensions on one row: fulfillment_status advances PENDING_SUBMISSION->SUBMITTED->SHIPPED->DELIVERED while escrow_status stays HELD until delivery (SETTLED) or cancellation (REFUNDED). Return path forks from DELIVERED and produces the third escrow terminal SETTLED_WITH_FEE."

  - entity: Award
    initial_state: ACTIVE
    terminal_states: [FULLY_REDEEMED, EXPIRED, REVOKED]
    transitions:
      - from: ACTIVE
        to: FULLY_REDEEMED
        trigger: "system (when FIFO consumption by a settling redemption reduces points_remaining to 0)"
        actor: system
        preconditions: []
        side_effects: []
      - from: ACTIVE
        to: EXPIRED
        trigger: "system (on POST /api/_clock/set_current_utc advance, when expires_at <= new clock time)"
        actor: system
        preconditions: []
        side_effects:
          - "create PointLedgerEntry EXPIRY (-points_remaining from available_points; lifetime_expired_points += points_remaining)"
          - "PointBudget (the budget whose window contains award.granted_at for the employee's department): committed_points -= points_remaining when that budget is not CLOSED; recompute posture"
          - "points_remaining := 0"
      - from: ACTIVE
        to: REVOKED
        trigger: "POST /api/awards/{awardId}/revoke OR system cascade from AbuseFlag confirm"
        actor: HRAdmin | system
        preconditions:
          - "award.status == ACTIVE (else ERR_INVALID_STATE_TRANSITION)"
        side_effects:
          - "create PointLedgerEntry CLAWBACK (-points_remaining from available_points; may drive available_points negative)"
          - "PointBudget: committed_points -= points_remaining when not CLOSED; recompute posture"
          - "recompute employee lifetime_granted_points and recognition_tier (may demote tier)"
          - "points_remaining := 0; revoked_by_flag_id set when cascade-driven"

  - entity: Employee
    initial_state: ELIGIBLE
    terminal_states: []
    transitions:
      - from: ELIGIBLE
        to: SUSPENDED
        trigger: "system cascade from POST /api/abuse-flags/{abuseFlagId}/confirm"
        actor: system
        preconditions: []
        side_effects:
          - "cascade order is pinned: (1) cancel the employee's RedemptionOrders with fulfillment_status == PENDING_SUBMISSION (full REFUND of held points, inventory restored); (2) revoke all ACTIVE awards of the employee (each fires its own CLAWBACK side effects in granted_at ASC, tie created_at ASC order); (3) recompute recognition_tier"
          - "increments Employee.version by 1"
      - from: SUSPENDED
        to: ELIGIBLE
        trigger: "POST /api/employees/{employeeId}/reinstate"
        actor: HRAdmin
        preconditions:
          - "employee.program_status == SUSPENDED (else ERR_INVALID_STATE_TRANSITION)"
          - "no AbuseFlag for this employee in status OPEN or UNDER_REVIEW (else ERR_INVALID_STATE_TRANSITION)"
        side_effects:
          - "increments Employee.version by 1"
    note: "ELIGIBLE <-> SUSPENDED is cyclic; suspension never restores revoked awards."

  - entity: TaxRecord
    initial_state: ESTIMATED
    terminal_states: [FINALIZED, AMENDED, VOIDED]
    transitions:
      - from: ESTIMATED
        to: FINALIZED
        trigger: "system during POST /api/programs/{programId}/finalize-tax-year"
        actor: PayrollSpecialist
        preconditions:
          - "record.tax_year == request tax_year"
          - "every AccrualRun for (program_id, tax_year) months 1-12 exists and is CLOSED or VOIDED (else ERR_PERIODS_NOT_CLOSED)"
        side_effects:
          - "recompute FINAL gross-up variant with current employee ytd_supplemental_wages_cents -> final_gross_up_cents, delta_cents"
      - from: ESTIMATED
        to: VOIDED
        trigger: "system when the linked RedemptionOrder completes a return (complete-return)"
        actor: system
        preconditions: []
        side_effects: []
      - from: FINALIZED
        to: AMENDED
        trigger: "system when the linked RedemptionOrder completes a return after finalization"
        actor: system
        preconditions: []
        side_effects:
          - "delta_cents recomputed against a zeroed taxable value (amendment keeps the audit of both figures)"

  - entity: AccrualRun
    initial_state: OPEN
    terminal_states: [CLOSED, VOIDED]
    transitions:
      - from: OPEN
        to: RECONCILED
        trigger: "POST /api/accrual-runs/{accrualRunId}/reconcile"
        actor: FinanceAdmin
        preconditions:
          - "status == OPEN (else ERR_INVALID_STATE_TRANSITION)"
          - "recomputed net chargeback for the period equals posted total_net_chargeback_cents (variance_cents == 0; else ERR_ACCRUAL_VARIANCE)"
        side_effects:
          - "variance_cents := 0 on success"
          - "increments AccrualRun.version by 1"
      - from: RECONCILED
        to: CLOSED
        trigger: "POST /api/accrual-runs/{accrualRunId}/close"
        actor: FinanceAdmin
        preconditions:
          - "status == RECONCILED (else ERR_INVALID_STATE_TRANSITION)"
        side_effects:
          - "the period becomes eligible for tax-year finalization"
          - "increments AccrualRun.version by 1"
      - from: OPEN
        to: VOIDED
        trigger: "POST /api/accrual-runs/{accrualRunId}/void"
        actor: FinanceAdmin
        preconditions:
          - "status == OPEN (else ERR_INVALID_STATE_TRANSITION)"
        side_effects:
          - "a VOIDED run no longer counts toward the (program, year, month) uniqueness check or the finalize-tax-year gate"
          - "increments AccrualRun.version by 1"

  - entity: AbuseFlag
    initial_state: OPEN
    terminal_states: [CONFIRMED, DISMISSED]
    transitions:
      - from: OPEN
        to: UNDER_REVIEW
        trigger: "POST /api/abuse-flags/{abuseFlagId}/review"
        actor: HRAdmin
        preconditions:
          - "status == OPEN (else ERR_INVALID_STATE_TRANSITION)"
        side_effects:
          - "increments AbuseFlag.version by 1"
      - from: OPEN
        to: CONFIRMED
        trigger: "POST /api/abuse-flags/{abuseFlagId}/confirm"
        actor: HRAdmin
        preconditions:
          - "status in {OPEN, UNDER_REVIEW} (else ERR_INVALID_STATE_TRANSITION)"
        side_effects:
          - "Employee.program_status -> SUSPENDED (which itself cascades: ACTIVE awards REVOKED with clawback ledger entries, PENDING_SUBMISSION orders cancelled, budget committed released, recognition_tier recomputed)"
          - "resolved_by = acting HRAdmin id"
          - "increments AbuseFlag.version by 1"
      - from: UNDER_REVIEW
        to: CONFIRMED
        trigger: "POST /api/abuse-flags/{abuseFlagId}/confirm"
        actor: HRAdmin
        preconditions: []
        side_effects:
          - "same cascade as OPEN -> CONFIRMED"
      - from: OPEN
        to: DISMISSED
        trigger: "POST /api/abuse-flags/{abuseFlagId}/dismiss"
        actor: HRAdmin
        preconditions:
          - "status in {OPEN, UNDER_REVIEW} (else ERR_INVALID_STATE_TRANSITION)"
        side_effects:
          - "resolved_by = acting HRAdmin id"
          - "increments AbuseFlag.version by 1"
      - from: UNDER_REVIEW
        to: DISMISSED
        trigger: "POST /api/abuse-flags/{abuseFlagId}/dismiss"
        actor: HRAdmin
        preconditions: []
        side_effects:
          - "resolved_by = acting HRAdmin id"

  - entity: FulfillmentVendor
    initial_state: ACTIVE
    terminal_states: []
    transitions:
      - from: ACTIVE
        to: SUSPENDED
        trigger: "POST /api/vendors/{vendorId}/suspend"
        actor: HRAdmin
        preconditions:
          - "vendor.status == ACTIVE (else ERR_INVALID_STATE_TRANSITION)"
        side_effects:
          - "blocks POST /api/redemption-orders/{id}/submit for all PENDING_SUBMISSION orders of this vendor (ERR_VENDOR_SUSPENDED); SUBMITTED/SHIPPED orders may still progress"
          - "blocks POST /api/catalog-items for this vendor (ERR_VENDOR_SUSPENDED)"
          - "increments FulfillmentVendor.version by 1"
      - from: SUSPENDED
        to: ACTIVE
        trigger: "POST /api/vendors/{vendorId}/reactivate"
        actor: HRAdmin
        preconditions:
          - "vendor.status == SUSPENDED (else ERR_INVALID_STATE_TRANSITION)"
        side_effects:
          - "increments FulfillmentVendor.version by 1"

# =============================================================================
# Table 2.1: Concurrency Rules (OCC only)
# =============================================================================
concurrency_rules:
  - rule_id: program-config-stale-update
    parent_entity: Program
    write_endpoint: "PATCH /api/programs/{programId}"
    occ_field: expected_program_version
    description: |
      Updating a Program whose version has advanced since the client last read
      it is rejected. Captures the case where another administrator's config
      edit (which itself legitimately succeeds) has superseded the client's
      observed configuration.
    error_id: ERR_STALE_VERSION
    http_status: 412

  - rule_id: nomination-approve-stale-version
    parent_entity: Nomination
    write_endpoint: "POST /api/nominations/{nominationId}/approve"
    occ_field: expected_nomination_version
    description: |
      Approving a Nomination whose version has advanced since the approver last
      read it (e.g. the nominator resubmitted with a changed points_requested,
      which legitimately succeeds and bumps Nomination.version) is rejected,
      because the approver's review no longer covers the current content.
    error_id: ERR_STALE_VERSION
    http_status: 412

  - rule_id: budget-adjustment-stale-version
    parent_entity: PointBudget
    write_endpoint: "POST /api/budgets/{budgetId}/adjustments"
    occ_field: expected_budget_version
    description: |
      Posting an allocation adjustment against a PointBudget whose version has
      advanced since the client last read it (e.g. another adjustment or an
      approval-driven commit moved the counters and bumped the version) is
      rejected, because the adjustment decision was made against stale pool
      figures.
    error_id: ERR_STALE_VERSION
    http_status: 412

# =============================================================================
# Table 3: Calculation Rules Table
# =============================================================================
calculations:
  - name: gross_up_calculation
    trigger: "RedemptionOrder SHIPPED->DELIVERED (PROVISIONAL variant) and POST /api/programs/{programId}/finalize-tax-year (FINAL variant)"
    algorithm: threshold
    formula: |
      # Tax-on-tax circularity is resolved by the pinned closed form below.
      # Evaluation order (mandatory):
      #   1. fed = 0.37 if employee.ytd_supplemental_wages_cents > 100000000 else 0.22
      #   2. state = program.state_rate_map.get(employee.state_code, 0.0)
      #   3. combined_rate = fed + state + 0.0765
      #   4. gross_up_cents = round_half_up(taxable_value_cents * combined_rate / (1 - combined_rate))
      # The gross-up is itself taxable income; step 4's division by (1 - rate)
      # is the closed form of that recursion. Step 4 MUST be a single rounding
      # applied to the whole expression (no intermediate rounding of the rate).
      # If program.grossup_enabled is false or taxable_value_cents == 0, gross_up_cents = 0.
    input_set: "The delivered RedemptionOrder's TaxRecord (taxable_value_cents after de-minimis), the employee, the program's state_rate_map"
    constants:
      FEDERAL_SUPPLEMENTAL_RATE: 0.22
      FEDERAL_SUPPLEMENTAL_RATE_HIGH: 0.37
      SUPPLEMENTAL_TIER_THRESHOLD_CENTS: 100000000
      FICA_RATE: 0.0765
    precision: "integer cents, round_half_up, applied once at step 4"
    variants:
      - name: PROVISIONAL
        when: "computed at delivery time (mark-delivered)"
        difference: "uses employee.ytd_supplemental_wages_cents as recorded at delivery; result stored in estimated_gross_up_cents"
      - name: FINAL
        when: "computed at tax-year finalization"
        difference: "uses the employee's final ytd_supplemental_wages_cents (after all compensation adjustments); stored in final_gross_up_cents; identical inputs would produce identical outputs, but intervening compensation adjustments make the results diverge"

  - name: de_minimis_exclusion
    trigger: "TaxRecord creation at delivery"
    algorithm: threshold
    formula: |
      # All-or-nothing annual exclusion.
      # if item.de_minimis_eligible AND item.taxable_class != 'GIFT_CARD'
      #    AND employee.ytd_de_minimis_cents + order_value_cents <= DEMINIMIS_ANNUAL_CAP_CENTS:
      #      taxable_value_cents = 0; de_minimis_applied = true;
      #      employee.ytd_de_minimis_cents += order_value_cents
      # else: taxable_value_cents = order_value_cents (fully taxable, no partial exclusion)
      # where order_value_cents = item.cash_value_cents * quantity
      # Boundary: reaching exactly the cap (==) still excludes; cap + 1 is fully taxable.
    input_set: "CatalogItem (de_minimis_eligible, taxable_class, cash_value_cents), order quantity, employee ytd_de_minimis_cents"
    constants:
      DEMINIMIS_ANNUAL_CAP_CENTS: 10000
    precision: "integer cents; no rounding"

  - name: budget_posture
    trigger: "after every mutation of PointBudget.reserved_points, committed_points, or allocated_points, and on clock advance (CLOSED)"
    algorithm: threshold
    formula: |
      # utilization_bp = floor((reserved_points + committed_points) * 10000 / allocated_points)
      # CLOSED     if current logical date >= period_end_date   (terminal; wins over utilization)
      # EXHAUSTED  if utilization_bp >= 10000
      # RESTRICTED if utilization_bp >= 8500
      # OPEN       otherwise
      # Boundaries are inclusive (>=): exactly 85.00% is RESTRICTED, exactly 100.00% is EXHAUSTED.
    input_set: "the PointBudget row and the logical clock"
    constants:
      RESTRICTED_THRESHOLD_BP: 8500
      EXHAUSTED_THRESHOLD_BP: 10000
    precision: "basis points, floor division"

  - name: nomination_submission_gate
    trigger: "POST /api/nominations and POST /api/nominations/{nominationId}/resubmit (when points_requested changes)"
    algorithm: threshold
    formula: |
      # RESTRICTED policy cap (checked first):
      #   if posture == RESTRICTED and points_requested > RESTRICTED_APPROVAL_CAP_POINTS:
      #     reject ERR_BUDGET_RESTRICTED_AMOUNT
      # Capacity check (checked second):
      #   prospective = reserved_points + committed_points + points_requested
      #   if prospective > allocated_points: reject ERR_BUDGET_EXHAUSTED
      # (== allocated_points is allowed; > is rejected.)
      # Effective accepted amount = min(points_requested, allocated - reserved - committed)
      # with an additional RESTRICTED-only cap: min(..., 500). This nested min over
      # (request, remaining capacity, posture cap) is what makes the gate combinatorial.
    input_set: "the selected PointBudget (program + nominee department + window containing submission date, posture != CLOSED)"
    constants:
      RESTRICTED_APPROVAL_CAP_POINTS: 500
    precision: "integer points"

  - name: chargeback_calculation
    trigger: "POST /api/accrual-runs (per department, for the run's calendar month) and recompute at reconcile"
    algorithm: aggregation
    formula: |
      # For each department d with employees in the program:
      #   redemption_cost_cents   = SUM over orders settled (mark-delivered) in the period
      #                             by employees of d of round_half_up(net_settled_points * point_cost_rate_cents)
      #                             where net_settled_points = points_total when escrow_status == SETTLED,
      #                             or restocking_fee_points when escrow_status == SETTLED_WITH_FEE
      #                             (a returned order contributes only its fee; the refunded portion is compensated)
      #                             ^^^ ROUND PER SETTLED ORDER LINE FIRST, THEN SUM (mandatory order;
      #                                 sum-then-round is a different number and is FORBIDDEN)
      #   gross_up_expense_cents  = SUM over TaxRecords created in the period for employees of d
      #                             of estimated_gross_up_cents
      #   forfeiture_credit_cents = round_half_up(points_expired_or_clawed_back_in_period_for_d
      #                             * point_cost_rate_cents * FORFEITURE_RECOVERY_RATE)
      #                             (single rounding on the department aggregate)
      #   net_chargeback_cents    = redemption_cost_cents + gross_up_expense_cents - forfeiture_credit_cents
      # Input window: [period_year-period_month-01T00:00:00Z, first instant of next month), matched on
      # delivered_at for orders, created_at for TaxRecords, and ledger entry created_at for forfeitures
      # (EXPIRY + CLAWBACK entries).
    input_set: "RedemptionOrders with escrow SETTLED or SETTLED_WITH_FEE and delivered_at in the period; TaxRecords created in the period; EXPIRY/CLAWBACK ledger entries created in the period"
    constants:
      FORFEITURE_RECOVERY_RATE: 0.5
    precision: "integer cents, round_half_up; per-line rounding before summation is pinned"

  - name: budget_accrual
    trigger: "POST /api/accrual-runs (per department)"
    algorithm: forward_looking
    formula: |
      # The expense the department SHOULD have accrued for the month, under the
      # program's configured variant (snapshot accrual_method_used at run creation):
      #   STRAIGHT_LINE:        accrual_cents = round_half_up(annual_allocated_cents / 12)
      #   UTILIZATION_WEIGHTED: accrual_cents = round_half_up(annual_allocated_cents * CURVE[month])
      # where annual_allocated_cents = SUM over the department's budgets whose window
      # intersects the period month of (allocated_points * point_cost_rate_cents),
      # and CURVE = {1..11: 0.07, 12: 0.23} (sums to 1.00).
      # Both variants look forward at the SAME annual allocation and the SAME month;
      # they are two valid amortizations that yield different accrual_cents.
    input_set: "PointBudgets of the department intersecting the period month; program.point_cost_rate_cents; program.accrual_method"
    constants:
      UTILIZATION_CURVE: "{1: 0.07, 2: 0.07, 3: 0.07, 4: 0.07, 5: 0.07, 6: 0.07, 7: 0.07, 8: 0.07, 9: 0.07, 10: 0.07, 11: 0.07, 12: 0.23}"
    precision: "integer cents, round_half_up"
    variants:
      - name: STRAIGHT_LINE
        when: "program.accrual_method == STRAIGHT_LINE"
        difference: "equal twelfths of the annual allocation"
      - name: UTILIZATION_WEIGHTED
        when: "program.accrual_method == UTILIZATION_WEIGHTED"
        difference: "weights by the redemption curve; month 12 carries 0.23 while months 1-11 carry 0.07"

  - name: points_fifo_allocation
    trigger: "RedemptionOrder mark-delivered (SETTLE) and clock-advance expiry sweep"
    algorithm: chronological
    formula: |
      # Settlement consumption across the employee's ACTIVE awards:
      #   order = granted_at ASC, tie-break created_at ASC (UUID ids are NEVER used for ordering)
      #   consume up to award.points_remaining from each award in order until the
      #   redemption's points_total is satisfied; awards reaching 0 -> FULLY_REDEEMED.
      # Expiry sweep (on clock advance): for each ACTIVE award with expires_at <= now,
      #   process in the same order; debit available_points by points_remaining,
      #   lifetime_expired_points += points_remaining, award -> EXPIRED.
      # Determinism: same ledger history + same clock => same per-award remainders.
    input_set: "ACTIVE awards of the employee"
    constants: {}
    precision: "integer points"

  - name: tier_assignment
    trigger: "after every change to employee.lifetime_granted_points (grant, clawback)"
    algorithm: threshold
    formula: |
      # lifetime_granted_points >= 20000 -> PLATINUM
      # >= 5000  -> GOLD
      # >= 1000  -> SILVER
      # else     -> BRONZE
      # Inclusive lower bounds: exactly 1000 is SILVER.
    input_set: "employee.lifetime_granted_points"
    constants:
      SILVER_AT: 1000
      GOLD_AT: 5000
      PLATINUM_AT: 20000
    precision: "integer points"

  - name: velocity_check
    trigger: "POST /api/nominations"
    algorithm: threshold
    formula: |
      # count = number of nominations by this nominator (any status except CANCELLED)
      #   with created_at >= now - 7 days (INCLUSIVE lower bound)
      # if count >= program.velocity_limit_per_7_days (default 5):
      #   reject ERR_VELOCITY_LIMIT_EXCEEDED AND create AbuseFlag(rule_code=VELOCITY_EXCEEDED, status=OPEN)
      # Boundary: the (limit)th submission in the window succeeds; the (limit+1)th is rejected.
    input_set: "Nomination rows for the nominator in the rolling window"
    constants:
      VELOCITY_WINDOW_DAYS: 7
    precision: "integer count; inclusive boundary"

  - name: vendor_ship_date_assignment
    trigger: "POST /api/redemption-orders/{redemptionOrderId}/submit"
    algorithm: threshold
    formula: |
      # candidate = logical_today + vendor.lead_time_business_days business days (Mon-Fri; skip Sat/Sun)
      # while count(orders of this vendor with fulfillment_status in {SUBMITTED, SHIPPED}
      #              and ship_date == candidate) >= vendor.daily_ship_capacity:
      #   candidate = next business day
      # if candidate > logical_today + 45 calendar days: reject ERR_VENDOR_CAPACITY_EXCEEDED
      # else assign ship_date = candidate
      # Aggregate-capacity semantics: a calendar day is a bucket; there is no
      # adjacency or gap treatment — only the per-day count matters.
    input_set: "RedemptionOrders of the item's vendor with ship_date assigned and fulfillment_status in {SUBMITTED, SHIPPED}"
    constants:
      SHIP_LOOKAHEAD_CALENDAR_DAYS: 45
    precision: "whole days"

  - name: anniversary_milestone_selection
    trigger: "POST /api/programs/{programId}/anniversary-scans (scans the logical clock's current date)"
    algorithm: threshold
    formula: |
      # For every employee (any department with a budget in this program, any window):
      #   anniversary matches when (month, day) of hire_date == (month, day) of scan date,
      #   with Feb 29 hires observed on Feb 28 in non-leap years.
      #   years = scan_year - hire_year
      #   if an AnniversaryEvent already exists for (program_id, employee_id, milestone_years=years):
      #     record SKIPPED_DUPLICATE
      #   elif employee.program_status == SUSPENDED: record SKIPPED_INELIGIBLE
      #   elif no milestone row with milestone.years == years: record SKIPPED_NO_MILESTONE
      #   elif the budget gate (same selector as nominations, scan date) has no room:
      #     record SKIPPED_BUDGET_EXHAUSTED
      #   else: create Award(source=ANNIVERSARY, points=milestone.points) + ledger GRANT_ANNIVERSARY,
      #     budget committed_points += milestone.points, tier recompute; record PROCESSED
    input_set: "Employees whose department has any PointBudget in the program; program.anniversary_milestones"
    constants: {}
    precision: "whole years"

  - name: participation_inclusion_analytics
    trigger: "GET /api/programs/{programId}/analytics/participation (computed on read from the logical clock)"
    algorithm: aggregation
    formula: |
      # window = [now - window_days days, now], window_days default 90 (inclusive both ends)
      # eligible employee = employee whose department has >= 1 PointBudget in the program (any window, any posture)
      # participating = distinct employees with >= 1 of: nomination submitted (status != CANCELLED),
      #   award granted, or redemption order created, inside the window
      # department rate_bp = floor(participating_d * 10000 / eligible_d); departments with eligible_d == 0
      #   are excluded from disparity
      # participation_rate_bp = floor(total_participating * 10000 / total_eligible); 0 when total_eligible == 0
      # inclusion_disparity_bp = max(rate_bp) - min(rate_bp) over included departments; 0 if fewer than 2
      # concentration: sort employees by points granted in window DESC (tie: employee.created_at ASC);
      #   top_n = max(1, floor(total_eligible * 0.05));
      #   concentration_share_bp = floor(points_of_top_n * 10000 / total_points_in_window); 0 when total == 0
    input_set: "Employees, PointBudgets, Nominations, Awards, RedemptionOrders of the program"
    constants:
      DEFAULT_WINDOW_DAYS: 90
      TOP_PERCENT: 0.05
    precision: "basis points, floor division"

# =============================================================================
# Table 4: Validation Rules Table (ordered by priority)
# =============================================================================
validations:
  - priority: 1
    category: auth
    check: "X-User-ID and X-User-Role headers present and well-formed"
    error_id: ERR_MISSING_OR_INVALID_USER_CONTEXT_HEADER
    http_status: 400
    applies_to: "all"

  - priority: 2
    category: auth
    check: "Role permitted for this endpoint per RBAC matrix; ownership checks of the form 'Employee may only act on own resource' are enforced here (X-User-ID must equal the resource's employee/nominator id)"
    error_id: ERR_FORBIDDEN_FOR_ROLE
    http_status: 403
    applies_to: "all"

  - priority: 3
    category: existence
    check: "Path parameters resolve left-to-right; body-supplied foreign keys (nominee_id, catalog_item_id, department_id, vendor_id, program_id, budget_id, ...) resolve to existing entities. Cross-program references (entity exists but belongs to a different program) are NOT 404 — see priority 11."
    error_id: ERR_NOT_FOUND
    http_status: 404
    applies_to: "all resource endpoints"

  - priority: 4
    category: business_constraint
    check: "Request schema: required fields present, types valid, enum members valid, integers in range (points_requested >= 1 and <= program.max_points_per_nomination; quantity in 1..5 -> ERR_INVALID_QUANTITY; period_month in 1..12; tax_year in 2000..2100 -> ERR_INVALID_TAX_YEAR)"
    error_id: ERR_INVALID_REQUEST
    http_status: 400
    applies_to: "all mutating endpoints"

  - priority: 5
    category: state
    check: "Target resource's current state permits the requested transition (e.g. approve only from PENDING_REVIEW; ship only from SUBMITTED; reconcile only from OPEN)"
    error_id: ERR_INVALID_STATE_TRANSITION
    http_status: 409
    applies_to: "all action endpoints"

  - priority: 6
    category: state
    check: "OCC: expected_<parent>_version equals the parent's current version (program PATCH, nomination approve, budget adjustments)"
    error_id: ERR_STALE_VERSION
    http_status: 412
    applies_to: "PATCH /api/programs/{programId}; POST /api/nominations/{nominationId}/approve; POST /api/budgets/{budgetId}/adjustments"

  - priority: 7
    category: state
    check: "Program gate: program.status == ACTIVE for nomination submit/resubmit, redemption create, budget create, anniversary scan, catalog item create"
    error_id: ERR_PROGRAM_NOT_ACTIVE
    http_status: 409
    applies_to: "POST /api/nominations; POST /api/nominations/{id}/resubmit; POST /api/redemption-orders; POST /api/budgets; POST /api/programs/{id}/anniversary-scans; POST /api/catalog-items"

  - priority: 8
    category: business_safety
    check: "Acting employee's program_status == ELIGIBLE for nominating (as nominator) and redeeming"
    error_id: ERR_EMPLOYEE_SUSPENDED
    http_status: 409
    applies_to: "POST /api/nominations; POST /api/redemption-orders"

  - priority: 9
    category: business_safety
    check: "Velocity: fewer than program.velocity_limit_per_7_days nominations by this nominator in the trailing 7 days (inclusive). Violation rejects AND creates an OPEN AbuseFlag(rule_code=VELOCITY_EXCEEDED)."
    error_id: ERR_VELOCITY_LIMIT_EXCEEDED
    http_status: 409
    applies_to: "POST /api/nominations"

  - priority: 10
    category: business_constraint
    check: "Self-dealing: nominee_id != nominator (ERR_SELF_NOMINATION on submit); approver != nominator (ERR_SELF_APPROVAL on approve/reject/return-for-revision)"
    error_id: "ERR_SELF_NOMINATION | ERR_SELF_APPROVAL"
    http_status: "422 | 409"
    applies_to: "POST /api/nominations; POST /api/nominations/{id}/approve; POST /api/nominations/{id}/reject; POST /api/nominations/{id}/return-for-revision"

  - priority: 11
    category: business_referential
    check: "Referential scope: PEER nomination requires nominee.department_id == nominator.department_id; MANAGER nomination requires nominator in nominee's transitive manager chain; Manager-role approver must be in nominee's manager chain; order submission and catalog item creation require the vendor ACTIVE (ERR_VENDOR_SUSPENDED); employee.employee_ref unique (ERR_INVALID_REQUEST on conflict); manager_id must not create a reporting cycle (ERR_INVALID_REQUEST)"
    error_id: "ERR_NOMINEE_NOT_IN_SCOPE | ERR_VENDOR_SUSPENDED"
    http_status: 409
    applies_to: "POST /api/nominations; nomination review endpoints; POST /api/redemption-orders; POST /api/employees; POST /api/catalog-items"

  - priority: 12
    category: business_constraint
    check: "Duplicate prevention: (a) idempotency_key replay — same nominator + same key + identical payload returns the ORIGINAL nomination with 201 and no new row; same key + different payload -> ERR_IDEMPOTENCY_CONFLICT. (b) business duplicate — same nominator, nominee, reason_code with an existing non-terminal nomination created within program.duplicate_window_days -> ERR_DUPLICATE_NOMINATION."
    error_id: "ERR_IDEMPOTENCY_CONFLICT | ERR_DUPLICATE_NOMINATION"
    http_status: 409
    applies_to: "POST /api/nominations (analogous idempotency rule on POST /api/redemption-orders)"

  - priority: 13
    category: business_temporal
    check: "Temporal windows: catalog item active_window_start <= now < active_window_end and item.status == ACTIVE (ERR_CATALOG_ITEM_UNAVAILABLE); new budget window must not overlap an existing budget window for the same (program_id, department_id) — half-open [start, end), adjacency allowed (ERR_BUDGET_PERIOD_OVERLAP); return requested within 14 days of delivered_at and item not GIFT_CARD (ERR_RETURN_NOT_ALLOWED); nomination type enabled in program config (ERR_NOMINATION_TYPE_DISABLED)"
    error_id: "ERR_CATALOG_ITEM_UNAVAILABLE | ERR_BUDGET_PERIOD_OVERLAP | ERR_RETURN_NOT_ALLOWED | ERR_NOMINATION_TYPE_DISABLED"
    http_status: 409
    applies_to: "POST /api/redemption-orders; POST /api/budgets; POST /api/redemption-orders/{id}/request-return; POST /api/nominations"

  - priority: 14
    category: business_constraint
    check: "Inventory: catalog item inventory_quantity is null (unlimited) or >= quantity; decremented at order creation, restored on cancel (not on return)"
    error_id: ERR_ITEM_OUT_OF_STOCK
    http_status: 409
    applies_to: "POST /api/redemption-orders"

  - priority: 15
    category: business_fiscal
    check: "Budget posture policy cap: when selected budget posture == RESTRICTED, points_requested <= 500"
    error_id: ERR_BUDGET_RESTRICTED_AMOUNT
    http_status: 409
    applies_to: "POST /api/nominations; POST /api/nominations/{id}/resubmit"

  - priority: 16
    category: business_fiscal
    check: "Budget capacity: reserved + committed + points_requested <= allocated; no budget whose window contains the submission date (or posture CLOSED) -> ERR_BUDGET_NOT_FOUND"
    error_id: "ERR_BUDGET_EXHAUSTED | ERR_BUDGET_NOT_FOUND"
    http_status: 409
    applies_to: "POST /api/nominations; POST /api/nominations/{id}/resubmit"

  - priority: 17
    category: business_fiscal
    check: "Points balance: employee.available_points >= points_total at redemption creation"
    error_id: ERR_INSUFFICIENT_POINTS
    http_status: 409
    applies_to: "POST /api/redemption-orders"

  - priority: 18
    category: business_fiscal
    check: "Accrual/tax integrity: no duplicate non-VOIDED AccrualRun for (program, year, month) (ERR_DUPLICATE_ACCRUAL_RUN); reconcile requires variance_cents == 0 (ERR_ACCRUAL_VARIANCE); finalize-tax-year requires every month's run CLOSED or VOIDED (ERR_PERIODS_NOT_CLOSED) and the year not already finalized (ERR_TAX_YEAR_FINALIZED); budget adjustments rejected on CLOSED budgets (ERR_BUDGET_CLOSED)"
    error_id: "ERR_DUPLICATE_ACCRUAL_RUN | ERR_ACCRUAL_VARIANCE | ERR_PERIODS_NOT_CLOSED | ERR_TAX_YEAR_FINALIZED | ERR_BUDGET_CLOSED"
    http_status: 409
    applies_to: "POST /api/accrual-runs; POST /api/accrual-runs/{id}/reconcile; POST /api/programs/{id}/finalize-tax-year; POST /api/budgets/{id}/adjustments"

response_envelope:
  success: |
    { "meta": { "api_request_id": "req_xxx", "api_request_timestamp": "ISO8601" },
      "response_type": "object" | "array", "data": {} }
  error: |
    { "meta": { ... }, "response_type": "error",
      "data": { "error_id": "ERR_XXX", "message": "..." } }
  pagination_fields: ["limit", "offset", "total_count", "has_more"]
  pagination_defaults: { limit: 10, min: 1, max: 100, offset: 0 }

# =============================================================================
# Table 5: API Endpoint Table
# =============================================================================
endpoints:
  # --- Program ---
  - method: POST
    path: "/api/programs"
    description: "Create a recognition program (status=DRAFT)"
    roles: [HRAdmin]
    code: 201
    input: [name, max_points_per_nomination, point_cost_rate_cents, state_rate_map, "peer_nomination_enabled?", "manager_nomination_enabled?", "grossup_enabled?", "anniversary_milestones?", "nomination_review_sla_days?", "duplicate_window_days?", "velocity_limit_per_7_days?", "accrual_method?", "fiscal_year_start_month?"]
    output: Program
    side_effects: ["status=DRAFT"]

  - method: GET
    path: "/api/programs/{programId}"
    description: "Get a program"
    roles: [HRAdmin, FinanceAdmin, PayrollSpecialist, Manager, Employee, VendorOps]
    code: 200
    input: []
    output: Program
    side_effects: []

  - method: PATCH
    path: "/api/programs/{programId}"
    description: "Update program config under OCC; status=CLOSED here performs the guarded program close"
    roles: [HRAdmin]
    code: 200
    input: ["name?", "max_points_per_nomination?", "point_cost_rate_cents?", "state_rate_map?", "peer_nomination_enabled?", "manager_nomination_enabled?", "grossup_enabled?", "anniversary_milestones?", "nomination_review_sla_days?", "duplicate_window_days?", "velocity_limit_per_7_days?", "accrual_method?", "status?", expected_program_version]
    output: Program
    side_effects: ["increments Program.version by 1", "ERR_STALE_VERSION when expected_program_version mismatches", "status=CLOSED requires no non-terminal nominations or open redemption orders"]

  - method: POST
    path: "/api/programs/{programId}/activate"
    description: "Activate a DRAFT or SUSPENDED program"
    roles: [HRAdmin]
    code: 200
    input: []
    output: Program
    side_effects: ["status -> ACTIVE", "increments Program.version by 1"]

  - method: POST
    path: "/api/programs/{programId}/suspend"
    description: "Suspend an ACTIVE program (blocks new nominations/redemptions/budgets/scans)"
    roles: [HRAdmin]
    code: 200
    input: []
    output: Program
    side_effects: ["status -> SUSPENDED", "increments Program.version by 1"]

  - method: POST
    path: "/api/programs/{programId}/anniversary-scans"
    description: "Run the service-anniversary scan for the logical clock's current date; idempotent per (employee, milestone) via SKIPPED_DUPLICATE"
    roles: [HRAdmin]
    code: 200
    input: []
    output: "AnniversaryEvent[]"
    side_effects: ["creates AnniversaryEvent rows (PROCESSED/SKIPPED_*)", "PROCESSED creates Award + GRANT_ANNIVERSARY ledger entry and commits budget points", "tier recompute"]

  - method: POST
    path: "/api/programs/{programId}/finalize-tax-year"
    description: "Finalize all ESTIMATED TaxRecords of tax_year using the FINAL gross-up variant; requires all monthly AccrualRuns CLOSED or VOIDED"
    roles: [PayrollSpecialist]
    code: 200
    input: [tax_year]
    output: { finalized_count: integer, records: "TaxRecord[]", total_delta_cents: integer }
    side_effects: ["ESTIMATED -> FINALIZED with final_gross_up_cents and delta_cents", "ERR_PERIODS_NOT_CLOSED when any month's run is missing/OPEN/RECONCILED", "ERR_TAX_YEAR_FINALIZED on repeat"]

  - method: GET
    path: "/api/programs/{programId}/analytics/participation"
    description: "Participation and inclusion analytics computed on read (trailing window_days, default 90)"
    roles: [HRAdmin, FinanceAdmin, PayrollSpecialist, Manager, Employee, VendorOps]
    code: 200
    input: ["window_days?"]
    output: { window_days: integer, eligible_employees: integer, participating_employees: integer, participation_rate_bp: integer, department_breakdown: "array", inclusion_disparity_bp: integer, concentration_share_bp: integer }
    side_effects: []

  # --- Department ---
  - method: POST
    path: "/api/departments"
    description: "Create a department"
    roles: [HRAdmin]
    code: 201
    input: [name, chargeback_account_code]
    output: Department
    side_effects: []

  - method: GET
    path: "/api/departments/{departmentId}"
    description: "Get a department"
    roles: [HRAdmin, FinanceAdmin, PayrollSpecialist, Manager, Employee, VendorOps]
    code: 200
    input: []
    output: Department
    side_effects: []

  # --- Employee ---
  - method: POST
    path: "/api/employees"
    description: "Register an employee (program_status=ELIGIBLE, recognition_tier=BRONZE, zero balances)"
    roles: [HRAdmin]
    code: 201
    input: [employee_ref, full_name, department_id, "manager_id?", hire_date, state_code]
    output: Employee
    side_effects: ["available_points=0, held_points=0, lifetime_*=0, ytd_supplemental_wages_cents=0"]

  - method: GET
    path: "/api/employees/{employeeId}"
    description: "Get an employee"
    roles: [HRAdmin, FinanceAdmin, PayrollSpecialist, Manager, Employee, VendorOps]
    code: 200
    input: []
    output: Employee
    side_effects: []

  - method: GET
    path: "/api/employees"
    description: "List employees with filters"
    roles: [HRAdmin, FinanceAdmin, PayrollSpecialist, Manager, Employee, VendorOps]
    code: 200
    input: ["department_id?", "manager_id?", "program_status?"]
    output: "Employee[]"
    side_effects: []

  - method: POST
    path: "/api/employees/{employeeId}/compensation-adjustments"
    description: "Set ytd_supplemental_wages_cents for the current calendar year (payroll sync)"
    roles: [PayrollSpecialist]
    code: 200
    input: [ytd_supplemental_wages_cents]
    output: Employee
    side_effects: ["ytd_supplemental_wages_cents := value", "increments Employee.version by 1"]

  - method: POST
    path: "/api/employees/{employeeId}/reinstate"
    description: "Reinstate a SUSPENDED employee to ELIGIBLE (requires no open/under-review abuse flags)"
    roles: [HRAdmin]
    code: 200
    input: []
    output: Employee
    side_effects: ["program_status -> ELIGIBLE", "increments Employee.version by 1"]

  - method: GET
    path: "/api/employees/{id}/ledger-entries"
    description: "List point ledger entries for the employee (chronological)"
    roles: [HRAdmin, FinanceAdmin, PayrollSpecialist, Manager, Employee, VendorOps]
    code: 200
    input: ["entry_type?"]
    output: "PointLedgerEntry[]"
    side_effects: []

  - method: POST
    path: "/api/employees/{employeeId}/points-adjustments"
    description: "HR adjustment grant of points to an employee; charged to the budget selected by (program_id, employee department, window containing today) like a nomination grant"
    roles: [HRAdmin]
    code: 201
    input: [program_id, points, reason]
    output: Award
    side_effects: ["create Award(source=ADJUSTMENT, nomination_id=null, granted_at=now, expires_at=now+12 months)", "GRANT_ADJUSTMENT ledger entry", "budget committed_points += points (ERR_BUDGET_NOT_FOUND / ERR_BUDGET_EXHAUSTED gate applies)", "tier recompute"]

  # --- PointBudget ---
  - method: POST
    path: "/api/budgets"
    description: "Create a department point budget for a half-open [start, end) window; overlap with an existing window for the same (program, department) is rejected"
    roles: [FinanceAdmin]
    code: 201
    input: [program_id, department_id, period_start_date, period_end_date, allocated_points]
    output: PointBudget
    side_effects: ["reserved_points=0, committed_points=0, posture=OPEN"]

  - method: GET
    path: "/api/budgets/{budgetId}"
    description: "Get a point budget"
    roles: [HRAdmin, FinanceAdmin, PayrollSpecialist, Manager, Employee, VendorOps]
    code: 200
    input: []
    output: PointBudget
    side_effects: []

  - method: GET
    path: "/api/budgets"
    description: "List point budgets with filters"
    roles: [HRAdmin, FinanceAdmin, PayrollSpecialist, Manager, Employee, VendorOps]
    code: 200
    input: ["program_id?", "department_id?", "posture?"]
    output: "PointBudget[]"
    side_effects: []

  - method: POST
    path: "/api/budgets/{budgetId}/adjustments"
    description: "Adjust allocated_points by a signed delta under OCC"
    roles: [FinanceAdmin]
    code: 200
    input: [delta_allocated_points, reason, expected_budget_version]
    output: PointBudget
    side_effects: ["allocated_points += delta_allocated_points (result must stay > 0 and >= reserved+committed else ERR_INVALID_REQUEST)", "recompute posture", "increments PointBudget.version by 1", "ERR_STALE_VERSION on version mismatch", "ERR_BUDGET_CLOSED when posture CLOSED"]

  # --- Nomination ---
  - method: POST
    path: "/api/nominations"
    description: "Submit a nomination; reserves points in the selected budget; idempotent per (nominator, idempotency_key)"
    roles: [Employee, Manager]
    code: 201
    input: [program_id, nominee_id, type, points_requested, reason_code, message, idempotency_key]
    output: Nomination
    side_effects: ["status=PENDING_REVIEW", "budget reserved_points += points_requested; posture recompute", "review_deadline = now + review SLA", "velocity breach creates AbuseFlag(VELOCITY_EXCEEDED)"]

  - method: GET
    path: "/api/nominations/{nominationId}"
    description: "Get a nomination"
    roles: [HRAdmin, FinanceAdmin, PayrollSpecialist, Manager, Employee, VendorOps]
    code: 200
    input: []
    output: Nomination
    side_effects: []

  - method: GET
    path: "/api/nominations"
    description: "List nominations with filters"
    roles: [HRAdmin, FinanceAdmin, PayrollSpecialist, Manager, Employee, VendorOps]
    code: 200
    input: ["program_id?", "nominator_id?", "nominee_id?", "status?", "budget_id?", "award_id?", "reviewer_id?"]
    output: "Nomination[]"
    side_effects: []

  - method: POST
    path: "/api/nominations/{nominationId}/approve"
    description: "Approve a PENDING_REVIEW nomination under OCC; creates the Award and grants points"
    roles: [Manager, HRAdmin]
    code: 200
    input: [expected_nomination_version]
    output: Nomination
    side_effects: ["status -> APPROVED", "create Award(source=NOMINATION) + GRANT_NOMINATION ledger entry", "budget reserved->committed; posture recompute", "nominee tier recompute", "increments Nomination.version by 1", "ERR_STALE_VERSION on version mismatch", "ERR_SELF_APPROVAL when approver == nominator"]

  - method: POST
    path: "/api/nominations/{nominationId}/reject"
    description: "Reject a PENDING_REVIEW nomination; releases the reservation"
    roles: [Manager, HRAdmin]
    code: 200
    input: ["reason?"]
    output: Nomination
    side_effects: ["status -> REJECTED", "budget reserved_points -= points_requested; posture recompute", "increments Nomination.version by 1"]

  - method: POST
    path: "/api/nominations/{nominationId}/return-for-revision"
    description: "Return a PENDING_REVIEW nomination for revision; the third return (revision_count == 2) auto-REJECTS instead (200 with status REJECTED)"
    roles: [Manager, HRAdmin]
    code: 200
    input: [feedback]
    output: Nomination
    side_effects: ["status -> RETURNED_FOR_REVISION (or REJECTED on third return)", "revision_count += 1 on the revision path", "review_deadline reset", "auto-reject branch releases reservation", "increments Nomination.version by 1"]

  - method: POST
    path: "/api/nominations/{nominationId}/resubmit"
    description: "Nominator resubmits a RETURNED_FOR_REVISION nomination; optional points change re-runs the budget gate and bumps version (invalidates stale approver views)"
    roles: [Employee, Manager]
    code: 200
    input: ["points_requested?", "message?"]
    output: Nomination
    side_effects: ["status -> PENDING_REVIEW", "reservation delta applied when points_requested changed", "review_deadline reset", "increments Nomination.version by 1"]

  - method: POST
    path: "/api/nominations/{nominationId}/cancel"
    description: "Nominator cancels a PENDING_REVIEW or RETURNED_FOR_REVISION nomination; releases the reservation"
    roles: [Employee, Manager]
    code: 200
    input: []
    output: Nomination
    side_effects: ["status -> CANCELLED", "budget reserved_points -= points_requested; posture recompute", "increments Nomination.version by 1"]

