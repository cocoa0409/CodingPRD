              as_user_id: "${ch_o2}"
              captures: { inv_b: $.data.id }
            - call: "POST /rush/invitations/${inv_a}/accept"
              payload: {}
              as: PNM
              as_user_id: "${o1}"
          trigger:
            - call: "POST /rush/invitations/${inv_b}/accept"
              payload: {}
              as: PNM
              as_user_id: "${o1}"
          assert:
            - "Trigger HTTP status is 200."
            - "PartyInvitation ${inv_b}.rsvp_status == ACCEPTED (zero-gap adjacency [18:00,19:00) and [19:00,20:00) is NOT a collision)."
            - "PartyInvitation ${inv_a}.rsvp_status == ACCEPTED (unchanged)."
            - "Party ${p_a}.confirmed_count == 1 AND Party ${p_b}.confirmed_count == 1."

  # =========================================================================
  - rule_id: cross_entity_state_dependency
    instances:

      - name: cesd_party_create_requires_chapter_not_suspended
        grounds:
          - validations[priority=7]
          - calculations.risk_status_from_points
          - state_machines.Party.SCHEDULED_to_OPEN
          - entities.Chapter.fields.risk_status
        distinguishing_aspect: |
          Party's valid create transition depends on the state of a
          DIFFERENT entity (Chapter.risk_status). Pair: Party <-> Chapter.
          POST /parties is rejected when Chapter.risk_status == SUSPENDED.
        test_recipe:
          setup:
            - "Chapter P at SUSPENDED (cumulative risk_points=15)."
            - "Round.phase=PARTY."
          setup_api_calls:
            - call: "POST /rush/_clock/set_current_utc"
              payload: { to_iso8601: "2026-09-01T00:00:00Z" }
              as: PanhellenicAdmin
            - call: "POST /rush/chapters"
              payload: { name: "Pi", greek_type: "FRATERNITY", quota_total: 5, dues_per_member_cents: 10000, legacy_priority_slots: 0 }
              as: PanhellenicAdmin
              captures: { ch_p: $.data.id }
            - call: "POST /rush/rounds"
              payload: { cycle_label: "Fall 2026 cesd1", bid_day_at: "2026-09-15T12:00:00Z" }
              as: PanhellenicAdmin
              captures: { rnd: $.data.id }
            - call: "POST /rush/risk-incidents"
              payload: { chapter_id: "${ch_p}", severity_points: 10, reason: "violation" }
              as: RiskOfficer
            - call: "POST /rush/risk-incidents"
              payload: { chapter_id: "${ch_p}", severity_points: 5, reason: "violation" }
              as: RiskOfficer
          trigger:
            - call: "POST /rush/parties"
              payload: { round_id: "${rnd}", chapter_id: "${ch_p}", scheduled_start_utc: "2026-09-05T18:00:00Z", duration_minutes: 60, capacity: 10 }
              as: ChapterOfficer
              as_user_id: "${ch_p}"
              captures: { err_id: $.data.error_id }
          assert:
            - "Trigger HTTP status is 409."
            - "err_id == 'ERR_CHAPTER_SUSPENDED'."
            - "Chapter ${ch_p}.risk_status == SUSPENDED."
            - "No Party row created for chapter_id=${ch_p} in round ${rnd}."

      - name: cesd_bid_accept_requires_round_in_bid_day_phase
        grounds:
          - validations[priority=12]
          - state_machines.RecruitmentRound.MUTUAL_SELECTION_to_BID_DAY
          - state_machines.PNM.MATCHED_to_BID_ACCEPTED
          - errors[ERR_ROUND_PHASE_MISMATCH]
        distinguishing_aspect: |
          PNM's MATCHED -> BID_ACCEPTED transition depends on the state of
          a DIFFERENT entity (RecruitmentRound.phase). Different entity
          pair (PNM <-> RecruitmentRound) than instance A (Party <->
          Chapter). Attempting bid-accept while Round.phase is still
          MUTUAL_SELECTION is rejected.
        test_recipe:
          setup:
            - "Round in MUTUAL_SELECTION phase, NOT yet advanced to BID_DAY."
            - "PNM Q1 was MATCHED via the matcher? — only happens during MUTUAL_SELECTION->BID_DAY transition. Instead, manually construct: use POST /bid-matches with ChapterOfficer in MUTUAL_SELECTION, expecting that to fail too. Better: use the standard mutual_selection happy path, then BEFORE the BID_DAY advance, attempt accept."
          setup_api_calls:
            - call: "POST /rush/_clock/set_current_utc"
              payload: { to_iso8601: "2026-09-01T00:00:00Z" }
              as: PanhellenicAdmin
            - call: "POST /rush/chapters"
