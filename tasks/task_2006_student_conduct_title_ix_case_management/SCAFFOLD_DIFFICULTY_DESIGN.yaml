              captures: { det2: $.data.id }
          trigger:
            - { call: "POST /api/determinations/${det2}/issue", payload: { sanction_selections: [ { sanction_type: "SUSPENSION", duration_days: 120 } ] }, as: DecisionMaker, as_user_id: "${dm_id}" }
            - { call: "GET /api/determinations/${det1}/sanctions", as: TitleIXCoordinator, as_user_id: "${coord_id}", captures: { s1_status: "$.data[0].status", s1_days: "$.data[0].duration_days" } }
            - { call: "GET /api/determinations/${det2}/sanctions", as: TitleIXCoordinator, as_user_id: "${coord_id}", captures: { s2_status: "$.data[0].status", s2_days: "$.data[0].duration_days" } }
          assert:
            - "first sanction: status == STAYED, duration_days == 120 (contributes 0 to the ACTIVE total after the remand compensation)"
            - "second sanction: status == ACTIVE, duration_days == 120"
            - "respondent ACTIVE suspension-day total == 120, NOT 240 - impose(120) followed by compensating stay(-120 from ACTIVE) followed by re-impose(120) conserves the quantity"
            - "Determination.${det1}.status == SUPERSEDED and Determination.${det2}.status == ISSUED"
