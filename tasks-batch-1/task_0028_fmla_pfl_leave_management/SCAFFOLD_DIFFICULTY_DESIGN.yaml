            - call: "POST /leave/benefit-ledgers/${ledgerI2_list[0].id}/apply-payment"
              payload: { amount_cents: 3000 }
              as: HRAdmin
              captures: { ledger_after_p2: $.data }
          assert:
            - "ledger_after_p1.payments_received_cents == 2000 AND ledger_after_p1.employee_owes_cents == 3000 AND ledger_after_p1.payment_status == PARTIAL (invariant: employee_owes == 5000 - 2000)"
            - "ledger_after_p2.payments_received_cents == 5000 AND ledger_after_p2.employee_owes_cents == 0 AND ledger_after_p2.payment_status == PAID (invariant: employee_owes == 5000 - 5000 = 0; zero drift after compensating pair of partial payments)"
