# =============================================================================
# §1.8 Scaffold Difficulty Design (Test Targeting Index)
# Karaoke & Private Room Booking — 9 rule_ids x >=2 instances = 18 instances
# Common venue config used across instances (created via POST /venues):
#   timezone: "UTC", peak_start_minute: 1080 (18:00), peak_end_minute: 1380 (23:00),
#   peak_multiplier: 1.5, deposit_pct: 0.2, cancellation_cutoff_hours: 24,
#   grace_minutes: 15, overage_grace_minutes: 10
# Room sizes: SMALL base 3500, MEDIUM base 5000, LARGE base 6000; fb_minimum varies.
# =============================================================================
scaffold_difficulty_design:

  # ===========================================================================
  - rule_id: dual_variant_calc
    instances:
      # ---- Instance 1: room pricing — forward-looking quoted vs chronological settled ----
      - name: room_quoted_forward_vs_settled_chronological_diverge
        grounds:
          - calculations.quoted_room_subtotal
          - calculations.settled_room_subtotal
          - state_machines.Reservation.CONFIRMED_to_CHECKED_IN
          - state_machines.Reservation.CHECKED_IN_to_CLOSED
          - entities.Reservation.fields.quoted_room_subtotal_cents
          - entities.Reservation.fields.settled_room_subtotal_cents
        distinguishing_aspect: |
          On the SAME LARGE reservation, quoted_room_subtotal (forward-looking over the
          booked 20:00-22:00 interval) equals 18000 while settled_room_subtotal
          (chronological over the actual 20:00-22:30 run incl. 20 overage minutes) equals
          25500 — two algorithms, same room subject, divergent numbers.
        test_recipe:
          setup:
            - "Venue with peak [1080,1380), peak_multiplier 1.5, overage_grace_minutes 10, deposit_pct 0.2"
            - "RoomType LARGE base_hourly_rate_cents 6000, fb_minimum_cents 0, capacity 12; one Room of that type"
            - "Customer registered; clock set before slot start"
            - "Reservation booked 2026-07-01 20:00->22:00, confirmed (quoted=18000, deposit=3600), checked in at 20:00"
          setup_api_calls:
            - call: "POST /venues"
              payload: { name: "Star", timezone: "UTC", peak_start_minute: 1080, peak_end_minute: 1380, peak_multiplier: 1.5, deposit_pct: 0.2, cancellation_cutoff_hours: 24, grace_minutes: 15, overage_grace_minutes: 10 }
              as: VenueManager
              captures: { v_id: $.data.id }
            - call: "POST /room-types"
              payload: { venue_id: "${v_id}", name: "LARGE", capacity: 12, base_hourly_rate_cents: 6000, fb_minimum_cents: 0 }
              as: VenueManager
              captures: { rt_id: $.data.id }
            - call: "POST /rooms"
              payload: { venue_id: "${v_id}", room_type_id: "${rt_id}", label: "Room 1" }
              as: VenueManager
              captures: { room_id: $.data.id, room_v: $.data.version }
            - call: "POST /customers"
              payload: { full_name: "Ann", email: "ann@x.com", phone: "111" }
              as: Customer
              captures: { cust_id: $.data.id }
            - call: "POST /venues/${v_id}/_clock/set"
              payload: { now_utc: "2026-07-01T19:00:00.000Z" }
              as: FrontDesk
            - call: "POST /reservations"
              payload: { venue_id: "${v_id}", room_id: "${room_id}", customer_id: "${cust_id}", party_size: 8, slot_start_utc: "2026-07-01T20:00:00.000Z", slot_end_utc: "2026-07-01T22:00:00.000Z", expected_room_version: "${room_v}" }
              as: Customer
              as_user_id: "${cust_id}"
              captures: { res_id: $.data.id, q_quoted: $.data.quoted_room_subtotal_cents }
            - call: "POST /reservations/${res_id}/confirm"
              payload: {}
              as: Customer
              as_user_id: "${cust_id}"
              captures: { quoted: $.data.quoted_room_subtotal_cents, deposit: $.data.deposit_cents }
            - call: "POST /venues/${v_id}/_clock/set"
              payload: { now_utc: "2026-07-01T20:00:00.000Z" }
              as: FrontDesk
            - call: "POST /reservations/${res_id}/check-in"
              payload: {}
              as: FrontDesk
          trigger:
            - call: "POST /reservations/${res_id}/close"
              payload: { actual_end_utc: "2026-07-01T22:30:00.000Z" }
              as: FrontDesk
              captures: { settled: $.data.settled_room_subtotal_cents }
          assert:
            - "Reservation.${res_id}.quoted_room_subtotal_cents == 18000"
            - "Reservation.${res_id}.deposit_cents == 3600"
            - "Reservation.${res_id}.settled_room_subtotal_cents == 25500"
            - "Reservation.${res_id}.settled_room_subtotal_cents != Reservation.${res_id}.quoted_room_subtotal_cents"

      # ---- Instance 2: F&B minimum shortfall — package-credit variant vs no-credit variant ----
      - name: fb_shortfall_package_credit_vs_no_credit_diverge
        grounds:
          - calculations.fb_shortfall
          - entities.GroupPackage.fields.included_fb_credit_cents
          - entities.RoomType.fields.fb_minimum_cents
          - entities.Reservation.fields.group_package_id
        distinguishing_aspect: |
          The second dual-variant operates on the F&B-minimum domain (RoomType.fb_minimum +
          GroupPackage.credit + FbOrder sum), not the room-time domain of instance 1: for the
          IDENTICAL consumed amount (1500) and IDENTICAL room minimum (5000), the no-credit
          reservation settles fb_shortfall_cents == 3500 while the package-credit reservation
          (credit 4000) settles fb_shortfall_cents == 0 — two valid interpretations, divergent results.
        test_recipe:
          setup:
            - "Venue; RoomType LARGE base 6000 fb_minimum 5000; one Room"
            - "GroupPackage flat 20000 included_hours 2.0 included_fb_credit 4000 for LARGE"
            - "Reservation A (no package) 2026-07-02 18:00->20:00 and Reservation B (package) 20:00->22:00 on the same room, both CHECKED_IN, each with one FbOrder of 1500"
          setup_api_calls:
            - call: "POST /venues"
              payload: { name: "Star2", timezone: "UTC", peak_start_minute: 1080, peak_end_minute: 1380, peak_multiplier: 1.5, deposit_pct: 0.2, cancellation_cutoff_hours: 24, grace_minutes: 15, overage_grace_minutes: 10 }
              as: VenueManager
              captures: { v_id: $.data.id }
            - call: "POST /room-types"
              payload: { venue_id: "${v_id}", name: "LARGE", capacity: 12, base_hourly_rate_cents: 6000, fb_minimum_cents: 5000 }
              as: VenueManager
              captures: { rt_id: $.data.id }
            - call: "POST /rooms"
              payload: { venue_id: "${v_id}", room_type_id: "${rt_id}", label: "Room 1" }
              as: VenueManager
              captures: { room_id: $.data.id, room_v0: $.data.version }
            - call: "POST /group-packages"
              payload: { venue_id: "${v_id}", name: "Bash", flat_price_cents: 20000, included_hours: 2.0, included_room_type_id: "${rt_id}", included_fb_credit_cents: 4000 }
              as: VenueManager
              captures: { pkg_id: $.data.id }
            - call: "POST /customers"
              payload: { full_name: "Bo", email: "bo@x.com", phone: "222" }
              as: Customer
              captures: { cust_id: $.data.id }
            - call: "POST /venues/${v_id}/_clock/set"
              payload: { now_utc: "2026-07-02T17:00:00.000Z" }
              as: FrontDesk
            - call: "POST /reservations"
              payload: { venue_id: "${v_id}", room_id: "${room_id}", customer_id: "${cust_id}", party_size: 4, slot_start_utc: "2026-07-02T18:00:00.000Z", slot_end_utc: "2026-07-02T20:00:00.000Z", expected_room_version: "${room_v0}" }
              as: Customer
              as_user_id: "${cust_id}"
              captures: { res_a: $.data.id }
            - call: "GET /rooms/${room_id}"
              payload: {}
              as: Customer
              as_user_id: "${cust_id}"
              captures: { room_v1: $.data.version }
            - call: "POST /reservations"
              payload: { venue_id: "${v_id}", room_id: "${room_id}", customer_id: "${cust_id}", party_size: 8, slot_start_utc: "2026-07-02T20:00:00.000Z", slot_end_utc: "2026-07-02T22:00:00.000Z", expected_room_version: "${room_v1}", group_package_id: "${pkg_id}" }
              as: Customer
              as_user_id: "${cust_id}"
              captures: { res_b: $.data.id }
            - call: "POST /reservations/${res_a}/confirm"
              payload: {}
              as: Customer
              as_user_id: "${cust_id}"
            - call: "POST /reservations/${res_b}/confirm"
              payload: {}
              as: Customer
              as_user_id: "${cust_id}"
            - call: "POST /venues/${v_id}/_clock/set"
              payload: { now_utc: "2026-07-02T18:00:00.000Z" }
              as: FrontDesk
            - call: "POST /reservations/${res_a}/check-in"
              payload: {}
              as: FrontDesk
            - call: "POST /reservations/${res_a}/fb-orders"
              payload: { description: "Snack A", unit_price_cents: 1500, quantity: 1 }
              as: Customer
              as_user_id: "${cust_id}"
              captures: { fb_a: $.data.id }
            - call: "POST /reservations/${res_a}/close"
              payload: { actual_end_utc: "2026-07-02T19:30:00.000Z" }
              as: FrontDesk
              captures: { shortfall_a: $.data.fb_shortfall_cents }
            - call: "POST /venues/${v_id}/_clock/set"
              payload: { now_utc: "2026-07-02T20:00:00.000Z" }
              as: FrontDesk
            - call: "POST /reservations/${res_b}/check-in"
              payload: {}
              as: FrontDesk
            - call: "POST /reservations/${res_b}/fb-orders"
              payload: { description: "Snack B", unit_price_cents: 1500, quantity: 1 }
              as: Customer
              as_user_id: "${cust_id}"
              captures: { fb_b: $.data.id }
          trigger:
            - call: "POST /reservations/${res_b}/close"
              payload: { actual_end_utc: "2026-07-02T21:30:00.000Z" }
              as: FrontDesk
              captures: { shortfall_b: $.data.fb_shortfall_cents }
          assert:
            - "Reservation.${res_a}.fb_shortfall_cents == 3500"
            - "Reservation.${res_b}.fb_shortfall_cents == 0"
            - "Reservation.${res_a}.fb_shortfall_cents != Reservation.${res_b}.fb_shortfall_cents"

  # ===========================================================================
  - rule_id: combinatorial_formula
    instances:
      # ---- Instance 1 (mode a): nonlinear peak-straddle quote, 3+ inputs, branch per minute ----
      - name: quoted_peak_straddle_nonlinear_branch
        grounds:
          - calculations.quoted_room_subtotal
          - entities.Venue.fields.peak_start_minute
          - entities.Venue.fields.peak_multiplier
          - entities.RoomType.fields.base_hourly_rate_cents
        distinguishing_aspect: |
          Mode (a): quoted_room_subtotal over a 17:30-19:30 booking branches every minute
          on (minute-of-day in [1080,1380)) and combines base_hourly_rate, peak_multiplier,
          and minute counts non-linearly: 30 off-peak min (3000) + 90 peak min (13500) = 16500.
        test_recipe:
          setup:
            - "Venue peak [1080,1380), multiplier 1.5; RoomType LARGE base 6000; one room"
            - "Customer; clock before slot; reservation booked 2026-07-02 17:30->19:30, confirmed"
          setup_api_calls:
            - call: "POST /venues"
              payload: { name: "Combo", timezone: "UTC", peak_start_minute: 1080, peak_end_minute: 1380, peak_multiplier: 1.5, deposit_pct: 0.2, cancellation_cutoff_hours: 24, grace_minutes: 15, overage_grace_minutes: 10 }
              as: VenueManager
              captures: { v_id: $.data.id }
            - call: "POST /room-types"
              payload: { venue_id: "${v_id}", name: "LARGE", capacity: 12, base_hourly_rate_cents: 6000, fb_minimum_cents: 0 }
              as: VenueManager
              captures: { rt_id: $.data.id }
            - call: "POST /rooms"
              payload: { venue_id: "${v_id}", room_type_id: "${rt_id}", label: "Room 1" }
              as: VenueManager
              captures: { room_id: $.data.id, room_v: $.data.version }
            - call: "POST /customers"
              payload: { full_name: "Cy", email: "cy@x.com", phone: "333" }
              as: Customer
              captures: { cust_id: $.data.id }
            - call: "POST /venues/${v_id}/_clock/set"
              payload: { now_utc: "2026-07-02T16:00:00.000Z" }
              as: FrontDesk
            - call: "POST /reservations"
              payload: { venue_id: "${v_id}", room_id: "${room_id}", customer_id: "${cust_id}", party_size: 6, slot_start_utc: "2026-07-02T17:30:00.000Z", slot_end_utc: "2026-07-02T19:30:00.000Z", expected_room_version: "${room_v}" }
              as: Customer
              as_user_id: "${cust_id}"
              captures: { res_id: $.data.id }
          trigger:
            - call: "POST /reservations/${res_id}/confirm"
              payload: {}
              as: Customer
              as_user_id: "${cust_id}"
              captures: { quoted: $.data.quoted_room_subtotal_cents }
          assert:
            - "Reservation.${res_id}.quoted_room_subtotal_cents == 16500"
            - "Reservation.${res_id}.deposit_cents == 3300"

      # ---- Instance 2 (mode b): rounding order pinned (sum-then-round) ----
      - name: quoted_rounding_order_sum_then_round
        grounds:
          - calculations.quoted_room_subtotal
          - entities.RoomType.fields.base_hourly_rate_cents
          - entities.Venue.fields.peak_multiplier
        distinguishing_aspect: |
          Mode (b): with SMALL base 3500, a 17:40-18:15 booking yields 20 off-peak + 15 peak
          minutes whose exact segment costs sum to 5208.33.. then round once to 2479 cents;
          the forbidden round-then-sum order would give 2480. The scaffold pins sum-then-round.
        test_recipe:
          setup:
            - "Venue peak [1080,1380), multiplier 1.5; RoomType SMALL base 3500; one room"
            - "Customer; clock before slot; reservation booked 2026-07-04 17:40->18:15"
          setup_api_calls:
            - call: "POST /venues"
              payload: { name: "Round", timezone: "UTC", peak_start_minute: 1080, peak_end_minute: 1380, peak_multiplier: 1.5, deposit_pct: 0.2, cancellation_cutoff_hours: 24, grace_minutes: 15, overage_grace_minutes: 10 }
              as: VenueManager
              captures: { v_id: $.data.id }
            - call: "POST /room-types"
              payload: { venue_id: "${v_id}", name: "SMALL", capacity: 4, base_hourly_rate_cents: 3500, fb_minimum_cents: 0 }
              as: VenueManager
              captures: { rt_id: $.data.id }
            - call: "POST /rooms"
              payload: { venue_id: "${v_id}", room_type_id: "${rt_id}", label: "Room A" }
              as: VenueManager
              captures: { room_id: $.data.id, room_v: $.data.version }
            - call: "POST /customers"
              payload: { full_name: "Di", email: "di@x.com", phone: "444" }
              as: Customer
              captures: { cust_id: $.data.id }
            - call: "POST /venues/${v_id}/_clock/set"
              payload: { now_utc: "2026-07-04T16:00:00.000Z" }
              as: FrontDesk
            - call: "POST /reservations"
              payload: { venue_id: "${v_id}", room_id: "${room_id}", customer_id: "${cust_id}", party_size: 2, slot_start_utc: "2026-07-04T17:40:00.000Z", slot_end_utc: "2026-07-04T18:15:00.000Z", expected_room_version: "${room_v}" }
              as: Customer
              as_user_id: "${cust_id}"
              captures: { res_id: $.data.id }
          trigger:
            - call: "POST /reservations/${res_id}/confirm"
              payload: {}
              as: Customer
              as_user_id: "${cust_id}"
              captures: { quoted: $.data.quoted_room_subtotal_cents }
          assert:
            - "Reservation.${res_id}.quoted_room_subtotal_cents == 2479"

  # ===========================================================================
  - rule_id: non_linear_state_machine
    instances:
      # ---- Instance 1: Reservation branching (CONFIRMED forks to CANCELLED or NO_SHOW) ----
      - name: reservation_confirmed_branch_cancel_vs_noshow_diverge
        grounds:
          - state_machines.Reservation.CONFIRMED_to_CANCELLED
          - state_machines.Reservation.CONFIRMED_to_NO_SHOW
          - state_machines.Reservation.CONFIRMED_to_CHECKED_IN
        distinguishing_aspect: |
          From CONFIRMED the Reservation forks into divergent branches with different
          side-effect sets: cancel-before-cutoff appends Payment{REFUND}; ops NO_SHOW appends
          Payment{FORFEIT} and bumps Customer.no_show_strikes — a branching (non-linear)
          machine on Reservation.
        test_recipe:
          setup:
            - "Venue cutoff 24h, grace 15m; LARGE room; customer; reservation 2026-07-10 20:00->22:00 confirmed"
            - "Clock set to 2026-07-08 10:00 (>24h before slot) to take the outside-cutoff REFUND branch"
          setup_api_calls:
            - call: "POST /venues"
              payload: { name: "Branch", timezone: "UTC", peak_start_minute: 1080, peak_end_minute: 1380, peak_multiplier: 1.5, deposit_pct: 0.2, cancellation_cutoff_hours: 24, grace_minutes: 15, overage_grace_minutes: 10 }
              as: VenueManager
              captures: { v_id: $.data.id }
            - call: "POST /room-types"
              payload: { venue_id: "${v_id}", name: "LARGE", capacity: 12, base_hourly_rate_cents: 6000, fb_minimum_cents: 0 }
              as: VenueManager
              captures: { rt_id: $.data.id }
            - call: "POST /rooms"
              payload: { venue_id: "${v_id}", room_type_id: "${rt_id}", label: "Room 1" }
              as: VenueManager
              captures: { room_id: $.data.id, room_v: $.data.version }
            - call: "POST /customers"
              payload: { full_name: "Ed", email: "ed@x.com", phone: "555" }
              as: Customer
              captures: { cust_id: $.data.id }
            - call: "POST /venues/${v_id}/_clock/set"
              payload: { now_utc: "2026-07-08T09:00:00.000Z" }
              as: FrontDesk
            - call: "POST /reservations"
              payload: { venue_id: "${v_id}", room_id: "${room_id}", customer_id: "${cust_id}", party_size: 6, slot_start_utc: "2026-07-10T20:00:00.000Z", slot_end_utc: "2026-07-10T22:00:00.000Z", expected_room_version: "${room_v}" }
              as: Customer
              as_user_id: "${cust_id}"
              captures: { res_id: $.data.id }
            - call: "POST /reservations/${res_id}/confirm"
              payload: {}
              as: Customer
              as_user_id: "${cust_id}"
              captures: { deposit: $.data.deposit_cents }
            - call: "POST /venues/${v_id}/_clock/set"
              payload: { now_utc: "2026-07-08T10:00:00.000Z" }
              as: FrontDesk
          trigger:
            - call: "POST /reservations/${res_id}/cancel"
              payload: {}
              as: Customer
              as_user_id: "${cust_id}"
          assert:
            - "Reservation.${res_id}.status == CANCELLED"
            - "GET /venues/${v_id}/reservations/${res_id}/payments includes one Payment with kind == REFUND and amount_cents == 3600"
            - "GET /venues/${v_id}/reservations/${res_id}/payments includes no Payment with kind == FORFEIT"

      # ---- Instance 2: QueueEntry branching (PENDING forks to PLAYED / SKIPPED / CANCELLED) ----
      - name: queue_entry_pending_branch_play_vs_skip_diverge
        grounds:
          - state_machines.QueueEntry.PENDING_to_PLAYED
          - state_machines.QueueEntry.PENDING_to_SKIPPED
          - state_machines.QueueEntry.PENDING_to_CANCELLED
          - calculations.queue_play_order
        distinguishing_aspect: |
          On a DIFFERENT entity (QueueEntry), PENDING forks to PLAYED, SKIPPED, or CANCELLED;
          skipping the head (play_order 1) promotes the next entry to play_order 1 while a
          play does the same but only from the head — branching with per-branch play_order
          re-derivation, distinct from the Reservation fork in instance 1.
        test_recipe:
          setup:
            - "Venue; LARGE room; customer; reservation 2026-07-11 20:00->22:00 confirmed and CHECKED_IN at 20:00"
            - "Two songs queued: song S1 priority 10 (head), song S2 priority 20"
          setup_api_calls:
            - call: "POST /venues"
              payload: { name: "Queue", timezone: "UTC", peak_start_minute: 1080, peak_end_minute: 1380, peak_multiplier: 1.5, deposit_pct: 0.2, cancellation_cutoff_hours: 24, grace_minutes: 15, overage_grace_minutes: 10 }
              as: VenueManager
              captures: { v_id: $.data.id }
            - call: "POST /room-types"
              payload: { venue_id: "${v_id}", name: "LARGE", capacity: 12, base_hourly_rate_cents: 6000, fb_minimum_cents: 0 }
              as: VenueManager
              captures: { rt_id: $.data.id }
            - call: "POST /rooms"
              payload: { venue_id: "${v_id}", room_type_id: "${rt_id}", label: "Room 1" }
              as: VenueManager
              captures: { room_id: $.data.id, room_v: $.data.version }
            - call: "POST /customers"
              payload: { full_name: "Fi", email: "fi@x.com", phone: "666" }
              as: Customer
              captures: { cust_id: $.data.id }
            - call: "POST /songs"
              payload: { venue_id: "${v_id}", title: "Song One", artist: "A", duration_seconds: 200, language: "EN" }
              as: FrontDesk
              captures: { s1_id: $.data.id }
            - call: "POST /songs"
              payload: { venue_id: "${v_id}", title: "Song Two", artist: "B", duration_seconds: 220, language: "EN" }
              as: FrontDesk
              captures: { s2_id: $.data.id }
            - call: "POST /venues/${v_id}/_clock/set"
              payload: { now_utc: "2026-07-11T19:00:00.000Z" }
              as: FrontDesk
            - call: "POST /reservations"
              payload: { venue_id: "${v_id}", room_id: "${room_id}", customer_id: "${cust_id}", party_size: 6, slot_start_utc: "2026-07-11T20:00:00.000Z", slot_end_utc: "2026-07-11T22:00:00.000Z", expected_room_version: "${room_v}" }
              as: Customer
              as_user_id: "${cust_id}"
              captures: { res_id: $.data.id }
            - call: "POST /reservations/${res_id}/confirm"
              payload: {}
              as: Customer
              as_user_id: "${cust_id}"
            - call: "POST /venues/${v_id}/_clock/set"
              payload: { now_utc: "2026-07-11T20:00:00.000Z" }
              as: FrontDesk
            - call: "POST /reservations/${res_id}/check-in"
              payload: {}
              as: FrontDesk
            - call: "POST /reservations/${res_id}/queue"
              payload: { song_id: "${s1_id}", priority: 10 }
              as: Customer
              as_user_id: "${cust_id}"
              captures: { q1_id: $.data.id }
            - call: "POST /reservations/${res_id}/queue"
              payload: { song_id: "${s2_id}", priority: 20 }
              as: Customer
              as_user_id: "${cust_id}"
              captures: { q2_id: $.data.id }
          trigger:
            - call: "POST /queue-entries/${q1_id}/skip"
              payload: {}
              as: FrontDesk
          assert:
            - "QueueEntry.${q1_id}.status == SKIPPED"
            - "QueueEntry.${q2_id}.status == PENDING"
            - "QueueEntry.${q2_id}.play_order == 1"

  # ===========================================================================
  - rule_id: transitive_cascade
    instances:
      # ---- Instance 1 (depth >=3): NO_SHOW -> {Payment FORFEIT, Customer strikes, queue CANCELLED} ----
      - name: noshow_cascade_payment_customer_queue_depth3
        grounds:
          - state_machines.Reservation.CONFIRMED_to_NO_SHOW
          - state_machines.QueueEntry.PENDING_to_CANCELLED
          - calculations.customer_no_show_strikes
          - entities.Customer.fields.no_show_strikes
          - entities.Payment.fields.kind
        distinguishing_aspect: |
          Depth-3 chain from ONE trigger (ops NO_SHOW sweep): (A) Reservation CONFIRMED->NO_SHOW
          causes (B) Payment{FORFEIT} appended AND Customer.no_show_strikes incremented, and the
          NO_SHOW state of the reservation in turn causes (C) its PENDING QueueEntry rows to move
          to CANCELLED — each link caused by the prior, not a parallel fan-out.
        test_recipe:
          setup:
            - "Venue grace 15m; LARGE room; customer; reservation 2026-07-12 20:00->22:00 confirmed"
            - "One song queued PENDING; clock advanced to 20:16 (past grace) without check-in"
          setup_api_calls:
