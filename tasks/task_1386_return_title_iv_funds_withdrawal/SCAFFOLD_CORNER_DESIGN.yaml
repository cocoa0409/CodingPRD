  # ===========================================================================
  # Section: cross_cutting (complexity layers)
  # ===========================================================================
  - section: cross_cutting
    instances:
      - name: occ_stale_version_rejected
        claim_type: optimistic_concurrency
        grounds:
          - "concurrency_rules[case-recalculate-stale-version]"
          - "validations[priority=7]"
          - "errors[ERR_STALE_VERSION]"
        distinguishing_aspect: "OCC: a recalculate carrying version v-1 (stale by one) is a deterministic 412, while the same call carrying the current v succeeds."
        test_recipe:
          setup: ["PELL-only case A calculated; captured case version ${cv} from the calculate response"]
          setup_api_calls:
            - call: "POST /r2t4/terms"
              payload: { name: "Fall 2026", start_date: "2026-08-24", end_date: "2026-12-11" }
              as: RegistrarClerk
              captures: { t1: $.data.id }
            - call: "POST /r2t4/terms/${t1}/breaks"
              payload: { start_date: "2026-11-25", end_date: "2026-11-29" }
