      - name: two_close_gates_violated_at_once
        claim_type: Priority Ordering
        grounds:
          - validations[13]
          - validations[29]
          - validations[10]
          - validations[33]
        excluded_because:
          difficulty_instance: recall_close_shelf_safety_priority13_beats_paperwork_referential_priority29
          rationale: |
            Both priority-ordering pairs in this scaffold are already owned by
            validation_priority_conflict instances in the difficulty design: that
            instance pins shelf safety (13) beating the paperwork gate (29) on close
            with both violated simultaneously, and
            remedy_claim_cross_entity_state_priority10_beats_units_fiscal_priority33
            pins the cross-entity state error beating the unit-ledger ceiling on
            POST /remedy-claims with both violated simultaneously. The corner
            instance each_recall_close_gate_fires_alone_in_declared_priority_order
            covers the complementary one-gate-at-a-time walk, so a duplicate here
            would add no discrimination.

