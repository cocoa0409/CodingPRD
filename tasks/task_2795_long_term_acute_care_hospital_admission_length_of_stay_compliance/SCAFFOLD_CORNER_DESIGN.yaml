      - name: cascading_side_effects_of_a_discharge_through_four_levels
        claim_type: cascading_side_effects
        grounds:
          - endpoints.POST_/ltch/stays/{id}/discharge
          - state_machines.Stay.ADMITTED_to_DISCHARGED
        excluded_because:
          difficulty_instance: transitive_cascade / discharge_cascades_four_levels_to_an_auto_issued_documentation_query
          rationale: "That instance already walks the full four-level chain end-to-end (stay closure -> DRAFT determination -> DenialRiskReview -> auto-issued DocumentationQuery -> period counters), asserts the ordering sensitivity that makes the chain observable (the determination must be priced before the review can score it, and the review must exist before the query can hang off it) and asserts the all-or-nothing behaviour when a downstream level cannot be written. Repeating it here would test the same writes twice."

      - name: dual_variant_payment_calculation_on_a_single_stay
        claim_type: dual_variant_calculation
        grounds:
          - calculations.stay_payment_determination
          - entities.PaymentDetermination.standard_variant_amount_cents
          - entities.PaymentDetermination.site_neutral_variant_amount_cents
        excluded_because:
          difficulty_instance: dual_variant_calc / payment_variant_standard_vs_site_neutral_on_one_determination
          rationale: "That instance stores and asserts both variant amounts on one determination, checks that the selected payment_variant is the one the patient-level criteria dictate, and quantifies the delta on the switch - which is exactly the dual-variant claim. The variant_selection and variant_divergence entries in the calculations section of this file cover the remaining selection and divergence angles."

  - section: consistency_model
    instances:
      - name: every_cascade_effect_is_visible_in_the_same_request_cycle
        claim_type: immediate
        grounds:
          - complexity_profile.consistency_model
          - endpoints.POST_/ltch/stays/{id}/discharge
          - endpoints.POST_/ltch/payment-determinations/{id}/finalize
          - calculations.period_payment_rollup
        distinguishing_aspect: "The declared consistency model is immediate, so the discharge response body itself must already carry every derived value the four-level cascade produced - covered LOS, the SSO threshold and flag, the discharge payment percentage and the advanced payment_review_status - and the child rows it created must be readable on the very next call with no retry, polling or settle delay. The same holds for the ledger: the finalize response and an immediately following period read agree to the cent, with no intermediate window in which the determination is FINAL but the period total is still 0."
