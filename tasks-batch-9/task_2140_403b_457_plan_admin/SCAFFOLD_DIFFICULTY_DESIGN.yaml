      - name: deferral_attribution_pre_snapshot_capacity_order
        grounds:
          - calculations.deferral_attribution_order
          - calculations.catchup_capacity_403b
          - state_machines.ContributionElection.SUBMITTED_to_EFFECTIVE
          - entities.ContributionElection.fields.service_catchup_attributed_cents
          - entities.Participant.fields.cumulative_special_catchup_used_cents
        distinguishing_aspect: |
          Mode (c): the 15-year catch-up capacity is a function of
          cumulative_special_catchup_used_cents, which this very approval increments — a
          circular-looking dependency the scaffold resolves by pinning capacity to the
          PRE-attribution snapshot. With snapshot 1200000 the split is 150000 / 300000 /
          550000 and the election is approved; recomputing capacity after the increment
          would give 150000 / 0 / 800000 with a 50000-cent remainder and would instead
          reject the election with ERR_402G_LIMIT_EXCEEDED.
        test_recipe:
