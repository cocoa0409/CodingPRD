  # ===========================================================================
  - section: rbac
    instances:
      - name: spectrographer_cannot_create_heat
        claim_type: role_denial
        grounds: [roles]
        distinguishing_aspect: "Exclusive operations hold: Spectrographer calling POST /api/heats (MeltSupervisor-exclusive) is rejected ERR_UNAUTHORIZED_ROLE."
        test_recipe:
          setup: ["Foundry and furnace exist"]
          setup_api_calls:
            - { call: "POST /api/foundries", payload: { name: "F1" }, as: FoundryAdmin, captures: { f_id: $.data.id } }
            - { call: "POST /api/equipment", payload: { foundry_id: "${f_id}", kind: "FURNACE", label: "Cupola-1", daily_tap_capacity_kg: 5000 }, as: FoundryAdmin, captures: { furn_id: $.data.id } }
          trigger:
            - { call: "POST /api/heats", payload: { foundry_id: "${f_id}", furnace_id: "${furn_id}", alloy_grade: "GJS-400-15", chemistry_spec: { elements: { C: { min: 3.2, max: 3.6 } } } }, as: Spectrographer, captures: { err: $.data.error_id } }
          assert:
            - "error_id == ERR_UNAUTHORIZED_ROLE (403)"

      - name: customer_cannot_disposition_inspection
        claim_type: role_denial
        grounds: [roles]
        distinguishing_aspect: "Entity-backed Customer calling the QualityInspector-exclusive disposition endpoint is rejected ERR_UNAUTHORIZED_ROLE before any state checks."
        test_recipe:
          setup: ["Foundry exists; any inspection id (role check precedes existence for an endpoint the role may never call? — role check is p2, existence p3, so role denial wins even for a bogus id)"]
          setup_api_calls:
            - { call: "POST /api/foundries", payload: { name: "F1" }, as: FoundryAdmin, captures: { f_id: $.data.id } }
            - { call: "POST /api/customers", payload: { foundry_id: "${f_id}", company_name: "Acme", credit_limit_cents: 100000000 }, as: FoundryAdmin, captures: { cust_id: $.data.id } }
          trigger:
            - { call: "POST /api/inspections/8a3e1c0b-2f4d-4a91-9c8b-12e7b6a0f1d2/disposition", payload: { disposition: "ACCEPT" }, as: Customer, as_user_id: "${cust_id}", captures: { err: $.data.error_id } }
          assert:
            - "error_id == ERR_UNAUTHORIZED_ROLE (403) — role gate (p2) fires before existence (p3)"

      - name: customer_cannot_claim_other_customers_order
        claim_type: role_denial
        grounds: [roles, "errors[ERR_FORBIDDEN_OWNER]"]
        distinguishing_aspect: "Entity-backed ownership: customer A filing a claim against customer B's order is rejected ERR_FORBIDDEN_OWNER (X-User-ID != order.customer_id)."
        test_recipe:
          setup: ["Customers A and B; order owned by B in RECEIVED (order-state check would also fail, but ownership is an auth-layer check at p2 and wins)"]
          setup_api_calls:
            - { call: "POST /api/foundries", payload: { name: "F1" }, as: FoundryAdmin, captures: { f_id: $.data.id } }
            - { call: "POST /api/customers", payload: { foundry_id: "${f_id}", company_name: "A Corp", credit_limit_cents: 1000000 }, as: FoundryAdmin, captures: { cust_a: $.data.id } }
            - { call: "POST /api/customers", payload: { foundry_id: "${f_id}", company_name: "B Corp", credit_limit_cents: 1000000 }, as: FoundryAdmin, captures: { cust_b: $.data.id } }
            - { call: "POST /api/patterns", payload: { foundry_id: "${f_id}", part_number: "PN-1", alloy_shrink_class: "FERROUS", mold_process: "SAND", finish_dimensions_mm: [100.0], machining_allowance_mm: 8.0, impressions: 1 }, as: PatternMaker, captures: { pat_id: $.data.id } }
            - { call: "POST /api/orders", payload: { foundry_id: "${f_id}", customer_id: "${cust_b}", pattern_id: "${pat_id}", quantity: 1, unit_price_cents: 100000, machining_allowance_pct: 0.15, warranty_months: 12, warranty_budget_cents: 500000 }, as: FoundryAdmin, captures: { ord_b: $.data.id } }
          trigger:
            - { call: "POST /api/claims", payload: { order_id: "${ord_b}", claim_type: "DEFECT", claim_qty: 1, claimed_amount_cents: 1000 }, as: Customer, as_user_id: "${cust_a}", captures: { err: $.data.error_id } }
          assert:
            - "error_id == ERR_FORBIDDEN_OWNER (403): customer A may not claim against customer B's order"

      - name: sod_spectro_certifier_cannot_disposition_own_heat_casting
        claim_type: role_denial
        grounds: [roles, "errors[ERR_SEGREGATION_OF_DUTIES]", state_machines.InspectionReport.RECORDED_to_DISPOSITIONED]
        distinguishing_aspect: "Segregation of duties (metallurgical): the Spectrographer whose sample certified the heat (certified_by_user_id == spectro_1) may not disposition a casting poured from that heat, even holding a QualityInspector role header with the same X-User-ID."
        test_recipe:
