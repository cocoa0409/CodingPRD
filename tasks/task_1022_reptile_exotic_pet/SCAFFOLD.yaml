scenario: "1022. Reptile & Exotic-Pet Store: livestock & husbandry care-sheet, quarantine & health, feeder-insect/rodent inventory & subscription, habitat/build & special order, permit/regulated-species, event/expo, livestock warranty, recall"
domain_name: reptile-exotic-pet-store
api_prefix: ""

complexity_profile:
  primary_archetype: compliance_audit
  secondary_archetype: quota_allocation
  complexity_layers:
    - cascading_side_effects
    - dual_variant_calculation
    - optimistic_concurrency
    - derived_field_reconciliation
  entity_topology: hybrid
  state_machine_shape: branching
  relationship_patterns:
    - one_to_many
    - cross_aggregate
    - self_referential   # WarrantyClaim.replacement_animal points at another Animal
  role_model: segregation_of_duties
  consistency_model: immediate

# ---------------------------------------------------------------------------
# §1.0 Response Envelope (FIXED — verbatim)
# ---------------------------------------------------------------------------
response_envelope:
  success: |
    { "meta": { "api_request_id": "req_xxx", "api_request_timestamp": "ISO8601" },
      "response_type": "object" | "array", "data": {} }
  error: |
    { "meta": { ... }, "response_type": "error",
      "data": { "error_id": "ERR_XXX", "message": "..." } }
  pagination_fields: ["limit", "offset", "total_count", "has_more"]
  pagination_defaults: { limit: 10, min: 1, max: 100, offset: 0 }

# ---------------------------------------------------------------------------
# §1.1 Entity-Relationship Table
# ---------------------------------------------------------------------------
entities:
  - name: Species
    parent: null
    common_fields: true
    fields:
      - name: common_name
        type: string
        source: input
        description: "Display name, e.g. 'Ball Python'"
      - name: scientific_name
        type: string
        source: input
        description: "Binomial name"
      - name: is_regulated
        type: boolean
        source: input
        description: "True when this species requires a customer permit to purchase"
        default: false
      - name: permit_class
        type: enum
        source: input
        description: "Regulatory class gating purchase and pricing surcharge"
        default: NONE
        constraints: "one of {NONE, CLASS_I, CLASS_II, CLASS_III}; must be NONE iff is_regulated is false"
      - name: min_quarantine_days
        type: integer
        source: input
        description: "Days an intake Animal of this species must remain in quarantine before clearance"
        constraints: ">= 0"
      - name: warranty_days
        type: integer
        source: input
        description: "Livestock warranty coverage window in days from Sale confirmation"
        constraints: ">= 0"
      - name: care_temp_low_c
        type: number
        source: input
        description: "Care-sheet: minimum enclosure temperature (Celsius)"
      - name: care_temp_high_c
        type: number
        source: input
        description: "Care-sheet: maximum enclosure temperature (Celsius)"
      - name: care_humidity_low_pct
        type: integer
        source: input
        description: "Care-sheet: minimum relative humidity percent"
      - name: care_humidity_high_pct
        type: integer
        source: input
        description: "Care-sheet: maximum relative humidity percent"
      - name: feed_interval_days
        type: integer
        source: input
        description: "Care-sheet: recommended days between feedings"
      - name: care_feeder_type
        type: enum
        source: input
        description: "Care-sheet: recommended feeder"
        constraints: "one of {CRICKET, DUBIA, MOUSE_PINKY, MOUSE_ADULT, RAT}"

  - name: Animal
    parent: null
    common_fields: true
    fields:
      - name: species_id
        type: string
        source: input
        description: "FK -> Species.id"
      - name: morph
        type: string
        source: input
        description: "Colour/pattern morph label"
      - name: sex
        type: enum
        source: input
        description: "Biological sex"
        default: UNKNOWN
        constraints: "one of {MALE, FEMALE, UNKNOWN}"
      - name: acquisition_cost_cents
        type: integer
        source: input
        description: "What the store paid to acquire the animal; used as the sale price floor"
        constraints: ">= 0"
      - name: list_price_cents
        type: integer
        source: input
        description: "Sticker price before surcharge/discount"
        constraints: ">= 0"
      - name: acquired_by_user_id
        type: string
        source: system
        description: "X-User-ID of the StoreManager who performed intake; used for warranty segregation-of-duties"
      - name: hatch_date
        type: datetime
        source: input
        description: "Hatch/birth date (nullable)"
      - name: health_status
        type: enum
        source: computed
        description: "Derived health posture; DECEASED is terminal"
        default: HEALTHY
        constraints: "one of {HEALTHY, DECEASED}"
      - name: status
        type: enum
        source: computed
        description: "Lifecycle state; see §1.2 Animal"
        default: INTAKE
        constraints: "one of {INTAKE, QUARANTINE, AVAILABLE, RESERVED, SOLD, DECEASED}"
      - name: quarantine_record_id
        type: string
        source: system
        description: "Id of the open/most-recent QuarantineRecord for this animal (nullable)"

  - name: QuarantineRecord
    parent: Animal
    common_fields: true
    fields:
      - name: animal_id
        type: string
        source: input
        description: "FK -> Animal.id"
      - name: start_at
        type: datetime
        source: system
        description: "Logical-clock timestamp when quarantine began"
      - name: required_until
        type: datetime
        source: computed
        description: "start_at + Species.min_quarantine_days days; earliest instant clearance is permitted"
      - name: status
        type: enum
        source: computed
        description: "OPEN until cleared or failed"
        default: OPEN
        constraints: "one of {OPEN, CLEARED, FAILED}"
      - name: health_checks
        type: array
        source: input
        description: "Append-only log of health-check objects {check_at, result in {PASS,FAIL,TREAT}, weight_grams, vet_user_id, notes}"
        default: []
      - name: passed_checks_count
        type: integer
        source: computed
        description: "Count of health_checks entries whose result == PASS"
        default: 0

  - name: Customer
    parent: null
    common_fields: true
    fields:
      - name: full_name
        type: string
        source: input
        description: "Customer name"
      - name: email
        type: string
        source: input
        description: "Contact email (unique)"
        constraints: "unique across Customers"
      - name: loyalty_tier
        type: enum
        source: input
        description: "Loyalty tier driving the final-price loyalty discount"
        default: STANDARD
        constraints: "one of {STANDARD, SILVER, GOLD}"
      - name: wallet_credit_cents
        type: integer
        source: computed
        description: "Store-credit balance accrued from refunds/recalls"
        default: 0

  - name: Permit
    parent: Customer
    common_fields: true
    fields:
      - name: customer_id
        type: string
        source: input
        description: "FK -> Customer.id"
      - name: permit_number
        type: string
        source: input
        description: "Government permit identifier"
      - name: permit_class
        type: enum
        source: input
        description: "Highest regulatory class this permit authorises"
        constraints: "one of {CLASS_I, CLASS_II, CLASS_III}"
      - name: issued_date
        type: datetime
        source: input
        description: "Permit issue date"
      - name: expiry_date
        type: datetime
        source: input
        description: "Permit expiry date"
      - name: status
        type: enum
        source: computed
        description: "Verification lifecycle"
        default: PENDING_VERIFICATION
        constraints: "one of {PENDING_VERIFICATION, VERIFIED, REVOKED}"
      - name: verified_at
        type: datetime
        source: system
        description: "Logical-clock timestamp of verification (nullable)"
      - name: verified_by_user_id
        type: string
        source: system
        description: "X-User-ID of verifying StoreManager (nullable)"

  - name: Sale
    parent: null
    common_fields: true
    fields:
      - name: animal_id
        type: string
        source: input
        description: "FK -> Animal.id"
      - name: customer_id
        type: string
        source: input
        description: "FK -> Customer.id"
      - name: permit_id
        type: string
        source: input
        description: "FK -> Permit.id; nullable, required only when the animal's species is regulated"
      - name: sold_at_expo
        type: boolean
        source: input
        description: "True when the sale is written at an expo booth (grants expo discount)"
        default: false
      - name: status
        type: enum
        source: computed
        description: "Sale lifecycle; see §1.2 Sale"
        default: DRAFT
        constraints: "one of {DRAFT, CONFIRMED, FULFILLED, REFUNDED, VOIDED, CLOSED}"
      - name: provisional_price_cents
        type: integer
        source: computed
        description: "Price shown at DRAFT (omits loyalty discount); see calculations.sale_price"
      - name: sale_price_cents
        type: integer
        source: computed
        description: "Final price pinned at CONFIRM (includes loyalty discount); nullable before confirm"
      - name: confirmed_at
        type: datetime
        source: system
        description: "Logical-clock timestamp at confirm (nullable)"
      - name: warranty_expires_at
        type: datetime
        source: computed
        description: "confirmed_at + Species.warranty_days days; nullable before confirm"
      - name: created_by_user_id
        type: string
        source: system
        description: "X-User-ID of the SalesAssociate who drafted the sale"

  - name: WarrantyClaim
    parent: Sale
    common_fields: true
    fields:
      - name: sale_id
        type: string
        source: input
        description: "FK -> Sale.id"
      - name: claim_type
        type: enum
        source: input
        description: "DOA = dead-on-arrival (full refund); EARLY_DEATH = prorated by remaining warranty"
        constraints: "one of {DOA, EARLY_DEATH}"
      - name: reason
        type: string
        source: input
        description: "Free-text claim narrative"
      - name: status
        type: enum
        source: computed
        description: "Claim lifecycle; see §1.2 WarrantyClaim"
        default: SUBMITTED
        constraints: "one of {SUBMITTED, APPROVED, DENIED, RESOLVED}"
      - name: resolution
        type: enum
        source: input
        description: "Chosen at resolve; nullable until then"
        constraints: "one of {REFUND, REPLACEMENT, CREDIT}"
      - name: refund_cents
        type: integer
        source: computed
        description: "Computed at approve per calculations.warranty_refund; nullable before approve"
      - name: replacement_animal_id
        type: string
        source: input
        description: "Animal.id of the replacement livestock supplied at resolve when resolution==REPLACEMENT; nullable"
      - name: approved_by_user_id
        type: string
        source: system
        description: "X-User-ID of the StoreManager who approved (nullable)"

  - name: FeederBatch
    parent: null
    common_fields: true
    fields:
      - name: feeder_type
        type: enum
        source: input
        description: "Feeder species"
        constraints: "one of {CRICKET, DUBIA, MOUSE_PINKY, MOUSE_ADULT, RAT}"
      - name: size
        type: enum
        source: input
        description: "Feeder size grade driving the price multiplier"
        constraints: "one of {SMALL, MEDIUM, LARGE}"
      - name: quantity_on_hand
        type: integer
        source: computed
        description: "Remaining units; decremented by shipment allocation, restored by manual reversal"
        constraints: ">= 0"
      - name: unit_price_cents
        type: integer
        source: input
        description: "Base per-unit price before size multiplier"
        constraints: ">= 0"
      - name: received_date
        type: datetime
        source: input
        description: "Date the batch was received"
      - name: expiry_date
        type: datetime
        source: input
        description: "Batch expiry; batches with expiry_date <= clock are skipped by allocation"
      - name: status
        type: enum
        source: computed
        description: "Inventory state"
        default: AVAILABLE
        constraints: "one of {AVAILABLE, DEPLETED, RECALLED}"

  - name: FeederSubscription
    parent: Customer
    common_fields: true
    fields:
      - name: customer_id
        type: string
        source: input
        description: "FK -> Customer.id"
      - name: feeder_type
        type: enum
        source: input
        description: "Subscribed feeder species"
        constraints: "one of {CRICKET, DUBIA, MOUSE_PINKY, MOUSE_ADULT, RAT}"
      - name: size
        type: enum
        source: input
        description: "Subscribed feeder size"
        constraints: "one of {SMALL, MEDIUM, LARGE}"
      - name: quantity_per_shipment
        type: integer
        source: input
        description: "Units to allocate each shipment"
        constraints: ">= 1"
      - name: cadence_days
        type: integer
        source: input
        description: "Days between shipments"
        constraints: ">= 1"
      - name: next_ship_date
        type: datetime
        source: computed
        description: "Advances by cadence_days after each shipment"
      - name: status
        type: enum
        source: computed
        description: "Subscription lifecycle; see §1.2 FeederSubscription"
        default: ACTIVE
        constraints: "one of {ACTIVE, PAUSED, HELD, CANCELLED}"
      - name: price_last_shipment_cents
        type: integer
        source: computed
        description: "Cost of the most recent shipment per calculations.shipment_cost; nullable before first shipment"

  - name: Shipment
    parent: FeederSubscription
    common_fields: true
    fields:
      - name: subscription_id
        type: string
        source: input
        description: "FK -> FeederSubscription.id"
      - name: feeder_type
        type: enum
        source: system
        description: "Copied from subscription at creation"
        constraints: "one of {CRICKET, DUBIA, MOUSE_PINKY, MOUSE_ADULT, RAT}"
      - name: size
        type: enum
        source: system
        description: "Copied from subscription at creation"
        constraints: "one of {SMALL, MEDIUM, LARGE}"
      - name: quantity
        type: integer
        source: system
        description: "Units shipped (== subscription.quantity_per_shipment at creation)"
      - name: allocations
        type: array
        source: computed
        description: "Waterfall allocation lines {batch_id, quantity, unit_cost_cents} pulled earliest-expiry-first"
      - name: shipment_cost_cents
        type: integer
        source: computed
        description: "Sum of per-line (quantity * round(batch.unit_price_cents * size_mult)); see calculations.shipment_cost"
      - name: status
        type: enum
        source: computed
        description: "SHIPPED at creation; REVERSED after reversal/recall"
        default: SHIPPED
        constraints: "one of {SHIPPED, REVERSED}"
      - name: reversed_reason
        type: enum
        source: computed
        description: "Why the shipment was reversed (nullable)"
        constraints: "one of {RECALL, MANUAL}"

  - name: HabitatBuild
    parent: Customer
    common_fields: true
    fields:
      - name: customer_id
        type: string
        source: input
        description: "FK -> Customer.id"
      - name: spec_summary
        type: string
        source: input
        description: "Short description of the custom enclosure"
      - name: quote_cents
        type: integer
        source: input
        description: "Initial quoted build price"
        constraints: ">= 0"
      - name: deposit_cents
        type: integer
        source: computed
        description: "round(quote_cents * DEPOSIT_PCT) pinned at pay-deposit; nullable before"
      - name: change_orders_total_cents
        type: integer
        source: computed
        description: "Running sum of approved change-order deltas"
        default: 0
      - name: deposit_paid
        type: boolean
        source: computed
        description: "True once deposit is paid"
        default: false
      - name: status
        type: enum
        source: computed
        description: "Build lifecycle; see §1.2 HabitatBuild"
        default: QUOTED
        constraints: "one of {QUOTED, DEPOSIT_PAID, IN_PROGRESS, CHANGE_REQUESTED, DELIVERED, CANCELLED}"
      - name: installer_id
        type: string
        source: input
        description: "Opaque installer/crew identifier for the scheduled install (nullable); the temporal-overlap resource key"
      - name: install_start_at
        type: datetime
        source: input
        description: "Install window start (nullable until scheduled)"
      - name: install_end_at
        type: datetime
        source: input
        description: "Install window end (nullable until scheduled)"
      - name: final_invoice_cents
        type: integer
        source: computed
        description: "quote_cents + change_orders_total_cents - deposit_cents pinned at deliver; nullable before"

  - name: Expo
    parent: null
    common_fields: true
    fields:
      - name: name
        type: string
        source: input
        description: "Expo/event name"
      - name: venue
        type: string
        source: input
        description: "Venue label"
      - name: start_at
        type: datetime
        source: input
        description: "Event window start"
      - name: end_at
        type: datetime
        source: input
        description: "Event window end; must be > start_at"
      - name: venue_capacity
        type: integer
        source: input
        description: "Max animals that may be concurrently ASSIGNED to this expo"
        constraints: ">= 0"
      - name: status
        type: enum
        source: computed
        description: "Event lifecycle; see §1.2 Expo"
        default: SCHEDULED
        constraints: "one of {SCHEDULED, OPEN, CLOSED, CANCELLED}"

  - name: ExpoAssignment
    parent: Expo
    common_fields: true
    fields:
      - name: expo_id
        type: string
        source: input
        description: "FK -> Expo.id"
      - name: animal_id
        type: string
        source: input
        description: "FK -> Animal.id"
      - name: status
        type: enum
        source: computed
        description: "ASSIGNED until the expo ends or the assignment is cancelled"
        default: ASSIGNED
        constraints: "one of {ASSIGNED, ENDED, CANCELLED}"

  - name: Recall
    parent: null
    common_fields: true
    fields:
      - name: reason
        type: string
        source: input
        description: "Recall justification"
      - name: target_feeder_type
        type: enum
        source: input
        description: "Feeder species being recalled"
        constraints: "one of {CRICKET, DUBIA, MOUSE_PINKY, MOUSE_ADULT, RAT}"
      - name: affected_batch_ids
        type: array
        source: input
        description: "FeederBatch.id values to recall (each must exist and match target_feeder_type)"
      - name: opened_by_user_id
        type: string
        source: system
        description: "X-User-ID of the StoreManager who opened the recall"
      - name: closed_by_user_id
        type: string
        source: system
        description: "X-User-ID of the StoreManager who closed the recall (nullable); must differ from opener"
      - name: status
        type: enum
        source: computed
        description: "OPEN until closed"
        default: OPEN
        constraints: "one of {OPEN, CLOSED}"

# ---------------------------------------------------------------------------
# §1.2 State Machine Table
# ---------------------------------------------------------------------------
state_machines:
  - entity: Animal
    initial_state: INTAKE
    terminal_states: [SOLD, DECEASED]
    transitions:
      - from: INTAKE
        to: QUARANTINE
        trigger: "POST /animals/{id}/start-quarantine"
        actor: VetTech
        preconditions: ["Animal.status == INTAKE"]
        side_effects:
          - "create QuarantineRecord OPEN with start_at = clock, required_until = start_at + Species.min_quarantine_days days"
          - "set Animal.quarantine_record_id"
      - from: QUARANTINE
        to: AVAILABLE
        trigger: "POST /quarantine-records/{id}/clear (bubble-up from QuarantineRecord OPEN->CLEARED)"
        actor: VetTech
        preconditions: ["linked QuarantineRecord.status == CLEARED after this call"]
        side_effects: ["Animal becomes sellable"]
        note: "Cross-entity: Animal cannot become AVAILABLE unless its QuarantineRecord reaches CLEARED"
      - from: QUARANTINE
        to: DECEASED
        trigger: "POST /animals/{id}/mark-deceased"
        actor: VetTech
        preconditions: ["Animal.status == QUARANTINE"]
        side_effects:
          - "set Animal.health_status = DECEASED"
          - "linked QuarantineRecord OPEN -> FAILED (cascade)"
      - from: AVAILABLE
        to: RESERVED
        trigger: "POST /sales/{id}/confirm (side effect)"
        actor: SalesAssociate
        preconditions: ["Animal.status == AVAILABLE"]
        side_effects: ["decrement global available-animal count (invariant available_animal_conservation)"]
      - from: AVAILABLE
        to: DECEASED
        trigger: "POST /animals/{id}/mark-deceased"
        actor: VetTech
        preconditions: ["Animal.status == AVAILABLE"]
        side_effects: ["set Animal.health_status = DECEASED"]
      - from: RESERVED
        to: SOLD
        trigger: "POST /sales/{id}/fulfill (side effect)"
        actor: SalesAssociate
        preconditions: ["Animal.status == RESERVED"]
        side_effects: []
      - from: RESERVED
        to: AVAILABLE
        trigger: "POST /sales/{id}/void (compensation side effect)"
        actor: SalesAssociate
        preconditions: ["Animal.status == RESERVED"]
        side_effects: ["increment global available-animal count back (invariant available_animal_conservation)"]

  - entity: QuarantineRecord
    initial_state: OPEN
    terminal_states: [CLEARED, FAILED]
    transitions:
      - from: OPEN
        to: CLEARED
        trigger: "POST /quarantine-records/{id}/clear"
        actor: VetTech
        preconditions:
          - "QuarantineRecord.status == OPEN"
          - "clock >= required_until"
          - "passed_checks_count >= MIN_PASS_CHECKS (2)"
        side_effects: ["bubble-up: linked Animal QUARANTINE -> AVAILABLE"]
      - from: OPEN
        to: FAILED
        trigger: "system: Animal mark-deceased cascade"
        actor: system
        preconditions: ["QuarantineRecord.status == OPEN"]
        side_effects: []

  - entity: Permit
    initial_state: PENDING_VERIFICATION
    terminal_states: [REVOKED]
    transitions:
      - from: PENDING_VERIFICATION
        to: VERIFIED
        trigger: "POST /permits/{id}/verify"
        actor: StoreManager
        preconditions: ["Permit.status == PENDING_VERIFICATION", "clock < expiry_date"]
        side_effects: ["set verified_at = clock, verified_by_user_id = X-User-ID"]
      - from: VERIFIED
        to: REVOKED
        trigger: "POST /permits/{id}/revoke"
        actor: StoreManager
        preconditions: ["Permit.status == VERIFIED"]
        side_effects:
          - "cascade: every CONFIRMED Sale of a regulated Animal that cites this permit_id -> VOIDED"
          - "each such Sale's Animal RESERVED -> AVAILABLE"

  - entity: Sale
    initial_state: DRAFT
    terminal_states: [REFUNDED, VOIDED, CLOSED]
    transitions:
      - from: DRAFT
        to: CONFIRMED
        trigger: "POST /sales/{id}/confirm"
        actor: SalesAssociate
        preconditions:
          - "Animal.status == AVAILABLE (cross-entity)"
          - "if Species.is_regulated: permit_id present, Permit.status == VERIFIED, Permit.permit_class >= Species.permit_class, clock < Permit.expiry_date"
        side_effects:
          - "Animal AVAILABLE -> RESERVED"
          - "compute sale_price_cents (final variant), set confirmed_at = clock"
          - "set warranty_expires_at = confirmed_at + Species.warranty_days days"
      - from: CONFIRMED
        to: FULFILLED
        trigger: "POST /sales/{id}/fulfill"
        actor: SalesAssociate
        preconditions: ["Sale.status == CONFIRMED", "Animal.status == RESERVED"]
        side_effects: ["Animal RESERVED -> SOLD"]
      - from: CONFIRMED
        to: VOIDED
        trigger: "POST /sales/{id}/void"
        actor: SalesAssociate
        preconditions: ["Sale.status == CONFIRMED"]
        side_effects: ["Animal RESERVED -> AVAILABLE (compensation)"]
      - from: FULFILLED
        to: REFUNDED
        trigger: "system: WarrantyClaim resolve REFUND cascade"
        actor: system
        preconditions: ["Sale.status == FULFILLED"]
        side_effects: ["Customer.wallet_credit_cents += WarrantyClaim.refund_cents (cascade)"]
      - from: FULFILLED
        to: CLOSED
        trigger: "system: WarrantyClaim resolve CREDIT/REPLACEMENT cascade"
        actor: system
        preconditions: ["Sale.status == FULFILLED"]
        side_effects: ["Sale is settled without a monetary refund on the sale row"]

  - entity: WarrantyClaim
    initial_state: SUBMITTED
    terminal_states: [DENIED, RESOLVED]
    transitions:
      - from: SUBMITTED
        to: APPROVED
        trigger: "POST /warranty-claims/{id}/approve"
        actor: StoreManager
        preconditions:
          - "WarrantyClaim.status == SUBMITTED"
          - "Sale.status == FULFILLED (cross-entity)"
          - "clock <= Sale.warranty_expires_at"
          - "X-User-ID != Animal.acquired_by_user_id (segregation of duties)"
        side_effects: ["compute refund_cents per calculations.warranty_refund, set approved_by_user_id"]
      - from: SUBMITTED
        to: DENIED
        trigger: "POST /warranty-claims/{id}/deny"
        actor: StoreManager
        preconditions: ["WarrantyClaim.status == SUBMITTED"]
        side_effects: []
      - from: APPROVED
        to: RESOLVED
        trigger: "POST /warranty-claims/{id}/resolve"
        actor: StoreManager
        preconditions: ["WarrantyClaim.status == APPROVED", "if resolution==REPLACEMENT: replacement Animal.status == AVAILABLE"]
        side_effects:
          - "branch REFUND: Sale FULFILLED -> REFUNDED; Customer.wallet_credit_cents += refund_cents"
          - "branch CREDIT: Customer.wallet_credit_cents += refund_cents; Sale FULFILLED -> CLOSED"
          - "branch REPLACEMENT: replacement Animal AVAILABLE -> RESERVED -> SOLD; Sale FULFILLED -> CLOSED"
        note: "Branching fork-join with divergent side-effect sets per resolution"

  - entity: FeederSubscription
    initial_state: ACTIVE
    terminal_states: [CANCELLED]
    transitions:
      - from: ACTIVE
        to: PAUSED
        trigger: "POST /feeder-subscriptions/{id}/pause"
        actor: Customer
        preconditions: ["status == ACTIVE"]
        side_effects: []
      - from: PAUSED
        to: ACTIVE
        trigger: "POST /feeder-subscriptions/{id}/resume"
        actor: Customer
        preconditions: ["status == PAUSED"]
        side_effects: []
      - from: ACTIVE
        to: HELD
        trigger: "system: Recall cascade reverses a shipment on this subscription"
        actor: system
        preconditions: ["status == ACTIVE"]
        side_effects: []
      - from: HELD
        to: ACTIVE
        trigger: "POST /feeder-subscriptions/{id}/resume"
        actor: Customer
        preconditions: ["status == HELD"]
        side_effects: []
      - from: ACTIVE
        to: CANCELLED
        trigger: "POST /feeder-subscriptions/{id}/cancel"
        actor: Customer
        preconditions: ["status IN {ACTIVE, PAUSED, HELD}"]
        side_effects: []

  - entity: Shipment
    initial_state: SHIPPED
    terminal_states: [REVERSED]
    transitions:
      - from: SHIPPED
        to: REVERSED
        trigger: "POST /shipments/{id}/reverse (MANUAL) or Recall cascade (RECALL)"
        actor: SalesAssociate
        preconditions: ["Shipment.status == SHIPPED"]
        side_effects:
          - "MANUAL: restore each allocation.quantity to its FeederBatch.quantity_on_hand (invariant feeder_unit_conservation); a DEPLETED batch returns to AVAILABLE"
          - "RECALL: subscription ACTIVE -> HELD; Customer.wallet_credit_cents += shipment_cost_cents; recalled batches are NOT restored"

  - entity: FeederBatch
    initial_state: AVAILABLE
    terminal_states: [RECALLED]
    transitions:
      - from: AVAILABLE
        to: DEPLETED
        trigger: "system: shipment allocation drives quantity_on_hand to 0"
        actor: system
        preconditions: ["quantity_on_hand == 0 after allocation"]
        side_effects: []
      - from: DEPLETED
        to: AVAILABLE
        trigger: "system: manual shipment reversal restores quantity_on_hand above 0"
        actor: system
        preconditions: ["quantity_on_hand > 0 after restore"]
        side_effects: []
      - from: AVAILABLE
        to: RECALLED
        trigger: "system: Recall cascade"
        actor: system
        preconditions: ["batch id in Recall.affected_batch_ids"]
        side_effects: ["set quantity_on_hand = 0"]

  - entity: HabitatBuild
    initial_state: QUOTED
    terminal_states: [DELIVERED, CANCELLED]
    transitions:
      - from: QUOTED
        to: DEPOSIT_PAID
        trigger: "POST /habitat-builds/{id}/pay-deposit"
        actor: Customer
        preconditions: ["status == QUOTED"]
        side_effects: ["set deposit_cents = round(quote_cents * DEPOSIT_PCT), deposit_paid = true"]
      - from: DEPOSIT_PAID
        to: IN_PROGRESS
        trigger: "POST /habitat-builds/{id}/start"
        actor: SalesAssociate
        preconditions: ["status == DEPOSIT_PAID"]
        side_effects: []
      - from: IN_PROGRESS
        to: CHANGE_REQUESTED
        trigger: "POST /habitat-builds/{id}/change-orders"
        actor: Customer
        preconditions: ["status == IN_PROGRESS", "expected_habitat_build_version matches current version (OCC)"]
        side_effects: ["increments HabitatBuild.version by 1", "add delta_cents to change_orders_total_cents"]
        note: "Cyclic: build loops IN_PROGRESS <-> CHANGE_REQUESTED across revision rounds"
      - from: CHANGE_REQUESTED
        to: IN_PROGRESS
        trigger: "POST /habitat-builds/{id}/approve-change"
        actor: SalesAssociate
        preconditions: ["status == CHANGE_REQUESTED"]
        side_effects: []
      - from: IN_PROGRESS
        to: DELIVERED
        trigger: "POST /habitat-builds/{id}/deliver"
        actor: SalesAssociate
        preconditions: ["status == IN_PROGRESS", "install_start_at is set (scheduled)"]
        side_effects: ["set final_invoice_cents = quote_cents + change_orders_total_cents - deposit_cents"]
      - from: QUOTED
        to: CANCELLED
        trigger: "POST /habitat-builds/{id}/cancel"
        actor: Customer
        preconditions: ["status IN {QUOTED, DEPOSIT_PAID, IN_PROGRESS, CHANGE_REQUESTED}"]
        side_effects: []

  - entity: Expo
    initial_state: SCHEDULED
    terminal_states: [CLOSED, CANCELLED]
    transitions:
      - from: SCHEDULED
        to: OPEN
        trigger: "POST /expos/{id}/open"
        actor: StoreManager
        preconditions: ["status == SCHEDULED"]
        side_effects: []
      - from: OPEN
        to: CLOSED
        trigger: "POST /expos/{id}/close"
        actor: StoreManager
        preconditions: ["status == OPEN"]
        side_effects: ["every ASSIGNED ExpoAssignment -> ENDED"]
      - from: SCHEDULED
        to: CANCELLED
        trigger: "POST /expos/{id}/cancel"
        actor: StoreManager
        preconditions: ["status == SCHEDULED"]
        side_effects: ["every ASSIGNED ExpoAssignment -> CANCELLED"]
      - from: OPEN
        to: CANCELLED
        trigger: "POST /expos/{id}/cancel"
        actor: StoreManager
        preconditions: ["status == OPEN"]
        side_effects: ["every ASSIGNED ExpoAssignment -> CANCELLED"]

  - entity: ExpoAssignment
    initial_state: ASSIGNED
    terminal_states: [ENDED, CANCELLED]
    transitions:
      - from: ASSIGNED
        to: ENDED
        trigger: "system: Expo close cascade"
        actor: system
        preconditions: ["status == ASSIGNED"]
        side_effects: []
      - from: ASSIGNED
        to: CANCELLED
        trigger: "system: Expo cancel cascade"
        actor: system
        preconditions: ["status == ASSIGNED"]
        side_effects: []

  - entity: Recall
    initial_state: OPEN
    terminal_states: [CLOSED]
    transitions:
      - from: OPEN
        to: CLOSED
        trigger: "POST /recalls/{id}/close"
        actor: StoreManager
        preconditions: ["status == OPEN", "X-User-ID != opened_by_user_id (four-eyes segregation of duties)"]
        side_effects: ["set closed_by_user_id = X-User-ID"]

# ---------------------------------------------------------------------------
# §1.2.1 Concurrency Rules
# ---------------------------------------------------------------------------
concurrency_rules:
  - rule_id: change-order-stale-build
    parent_entity: HabitatBuild
    write_endpoint: "POST /habitat-builds/{id}/change-orders"
    occ_field: "expected_habitat_build_version"
    description: |
      Filing a change order against a HabitatBuild whose version has advanced
      since the client last observed it is rejected. A change order legitimately
      supersedes the running quote by adding its delta to change_orders_total_cents;
      when another change order has already been recorded, the current client's
      view of the build (and therefore its quote total) is stale, so the write is
      refused on a version mismatch rather than silently stacking on an unseen quote.
    error_id: ERR_STALE_VERSION
    http_status: 412

# ---------------------------------------------------------------------------
# §1.3 Calculation Rules Table
# ---------------------------------------------------------------------------
calculations:
  - name: sale_price
    trigger: "provisional at Sale creation (DRAFT); final at POST /sales/{id}/confirm"
    algorithm: tiered_pricing
    formula: |
      base       = Animal.list_price_cents
      surcharge  = round_half_up(base * REGULATED_SURCHARGE_PCT[Species.permit_class])
      # loyalty discount applies to the FINAL variant only; expo discount applies to both
      disc_pct   = (LOYALTY_DISCOUNT_PCT[Customer.loyalty_tier] if FINAL else 0)
                   + (EXPO_DISCOUNT_PCT if Sale.sold_at_expo else 0)
      discount   = round_half_up((base + surcharge) * disc_pct)
      gross      = base + surcharge - discount
      price      = max(gross, Animal.acquisition_cost_cents)   # sale price floor
    input_set: "single Sale joined to its Animal, Species and Customer"
    constants:
      REGULATED_SURCHARGE_PCT: { NONE: 0.00, CLASS_I: 0.05, CLASS_II: 0.10, CLASS_III: 0.15 }
      LOYALTY_DISCOUNT_PCT: { STANDARD: 0.00, SILVER: 0.05, GOLD: 0.10 }
      EXPO_DISCOUNT_PCT: 0.08
    precision: "integer cents, round_half_up on each round() step"
    variants:
      - name: provisional
        when: "Sale is DRAFT (stored in provisional_price_cents)"
        difference: "disc_pct omits the loyalty term (loyalty requires a confirmed, permit-checked sale)"
      - name: final
        when: "Sale is CONFIRMED (stored in sale_price_cents)"
        difference: "disc_pct includes LOYALTY_DISCOUNT_PCT[Customer.loyalty_tier]"

  - name: warranty_refund
    trigger: "POST /warranty-claims/{id}/approve (stored in refund_cents)"
    algorithm: threshold
    formula: |
      if claim_type == DOA:
        refund = Sale.sale_price_cents
      else:  # EARLY_DEATH
        remaining_days = max(0, ceil_days(Sale.warranty_expires_at - clock))
        refund = round_half_up(Sale.sale_price_cents * remaining_days / Species.warranty_days)
    input_set: "single WarrantyClaim joined to its Sale, Animal and Species"
    constants: {}
    precision: "integer cents, round_half_up; remaining_days is a whole-day ceil of the interval to warranty_expires_at"
    variants:
      - name: doa_full
        when: "claim_type == DOA"
        difference: "full sale_price_cents refunded regardless of elapsed time"
      - name: early_death_prorated
        when: "claim_type == EARLY_DEATH"
        difference: "prorated by remaining_days / warranty_days"

  - name: shipment_cost
    trigger: "POST /feeder-subscriptions/{id}/shipments (stored in Shipment.shipment_cost_cents and FeederSubscription.price_last_shipment_cents)"
    algorithm: waterfall_allocation
    formula: |
      # 1) Candidate batches: FeederBatch.status == AVAILABLE, feeder_type & size match,
      #    expiry_date > clock. Order by expiry_date ASC, tie-break created_at ASC.
      # 2) Waterfall-allocate quantity_per_shipment across candidates, filling the
      #    earliest-expiry batch fully before moving to the next.
      # 3) size_mult = SIZE_MULT[size]. Round the per-unit price PER BATCH LINE, then
      #    multiply by that line's quantity, then sum across lines (round-per-line, then sum):
      unit_price(batch)  = round_half_up(batch.unit_price_cents * SIZE_MULT[size])
      line_cost(batch,q) = q * unit_price(batch)
      shipment_cost      = sum(line_cost(b, q_b) for each allocation line)
    input_set: "AVAILABLE, non-expired FeederBatch rows matching (feeder_type, size)"
    constants:
      SIZE_MULT: { SMALL: 1.00, MEDIUM: 1.25, LARGE: 1.50 }
    precision: "integer cents; round_half_up applied to the per-batch unit price BEFORE multiplying by quantity and BEFORE summing (round-per-line then sum, NOT sum-then-round)"

  - name: quarantine_required_until
    trigger: "POST /animals/{id}/start-quarantine (stored in QuarantineRecord.required_until)"
    algorithm: threshold
    formula: |
      required_until = start_at + days(Species.min_quarantine_days)
      # clearance is permitted only when clock >= required_until (inclusive boundary)
      # AND passed_checks_count >= MIN_PASS_CHECKS
    input_set: "single QuarantineRecord joined to its Animal's Species"
    constants:
      MIN_PASS_CHECKS: 2
    precision: "whole days added to a datetime; comparison clock >= required_until is inclusive"

  - name: habitat_final_invoice
    trigger: "deposit at POST /habitat-builds/{id}/pay-deposit; final at POST /habitat-builds/{id}/deliver"
    algorithm: aggregation
    formula: |
      deposit_cents       = round_half_up(quote_cents * DEPOSIT_PCT)              # at pay-deposit
      final_invoice_cents = quote_cents + change_orders_total_cents - deposit_cents  # at deliver
    input_set: "single HabitatBuild plus the running change_orders_total_cents"
    constants:
      DEPOSIT_PCT: 0.30
    precision: "integer cents, round_half_up"
    variants:
      - name: deposit_provisional
        when: "at pay-deposit"
        difference: "only the 30% deposit is pinned; change orders not yet known"
      - name: final_balance
        when: "at deliver"
        difference: "full balance net of the already-paid deposit including all approved change orders"

# ---------------------------------------------------------------------------
# §1.4 Validation Rules Table (ordered by priority)
# ---------------------------------------------------------------------------
validations:
  - priority: 10
    category: auth
    check: "X-User-Role and X-User-ID headers present"
    error_id: ERR_UNAUTHENTICATED
    http_status: 401
    applies_to: all
  - priority: 20
    category: auth
    check: "role is permitted for this operation per §1.7"
    error_id: ERR_UNAUTHORIZED
    http_status: 403
    applies_to: all
  - priority: 25
    category: business_constraint
    check: "pagination limit within [1,100] and offset >= 0"
    error_id: ERR_INVALID_PAGINATION
    http_status: 400
    applies_to: "all list endpoints"
  - priority: 30
    category: existence
    check: "path/body-referenced resources exist, validated left-to-right"
    error_id: ERR_NOT_FOUND
    http_status: 404
    applies_to: all
    note: "emits the specific ERR_<ENTITY>_NOT_FOUND from §1.6 for the first missing resource"
  - priority: 35
    category: business_constraint
    check: "required body fields present and well-typed; enum values legal"
    error_id: ERR_VALIDATION
    http_status: 400
    applies_to: "all writes"
  - priority: 40
    category: state
    check: "target resource is in a state that permits the requested transition"
    error_id: ERR_INVALID_STATE
    http_status: 409
    applies_to: "all state-changing endpoints"
    note: "emits the specific state error where one exists (e.g. ERR_ANIMAL_NOT_AVAILABLE)"
  - priority: 42
    category: state
    check: "Sale confirm: animal must be AVAILABLE"
    error_id: ERR_ANIMAL_NOT_AVAILABLE
    http_status: 409
    applies_to: "POST /sales/{id}/confirm"
  - priority: 44
    category: state
    check: "quarantine clear: clock >= QuarantineRecord.required_until AND passed_checks_count >= 2"
    error_id: ERR_QUARANTINE_NOT_COMPLETE
    http_status: 409
    applies_to: "POST /quarantine-records/{id}/clear"
  - priority: 46
    category: business_safety
    check: "recall close: closing StoreManager X-User-ID differs from opened_by_user_id (four-eyes); warranty approve: approver differs from Animal.acquired_by_user_id"
    error_id: ERR_SEGREGATION_OF_DUTIES
    http_status: 403
    applies_to: "POST /recalls/{id}/close, POST /warranty-claims/{id}/approve"
  - priority: 50
    category: business_safety
    check: "shipment: all candidate batches recalled/expired -> feeder recalled/unavailable"
    error_id: ERR_FEEDER_RECALLED
    http_status: 409
    applies_to: "POST /feeder-subscriptions/{id}/shipments"
  - priority: 52
    category: business_temporal
    check: "expo assignment: animal not already ASSIGNED to another expo whose [start_at,end_at) overlaps (half-open)"
    error_id: ERR_EXPO_OVERLAP
    http_status: 409
    applies_to: "POST /expos/{id}/assignments"
  - priority: 53
    category: business_temporal
    check: "install schedule: no other HabitatBuild on the same installer_id within INSTALL_BUFFER_MINUTES (60) of the requested window (gap between window edges must be >= 60 minutes)"
    error_id: ERR_INSTALL_BUFFER_CONFLICT
    http_status: 409
    applies_to: "POST /habitat-builds/{id}/schedule-install"
  - priority: 54
    category: business_constraint
    check: "expo assignment: current ASSIGNED count on the expo < venue_capacity"
    error_id: ERR_EXPO_CAPACITY_EXCEEDED
    http_status: 409
    applies_to: "POST /expos/{id}/assignments"
  - priority: 55
    category: business_referential
    check: "Sale confirm of a regulated species requires a present, VERIFIED, class-sufficient, unexpired permit"
    error_id: ERR_PERMIT_REQUIRED
    http_status: 422
    applies_to: "POST /sales/{id}/confirm"
    note: "ERR_PERMIT_NOT_VERIFIED / ERR_PERMIT_EXPIRED are the finer-grained variants when a permit is present"
  - priority: 56
    category: business_referential
    check: "warranty claim approve: clock <= Sale.warranty_expires_at"
    error_id: ERR_WARRANTY_EXPIRED
    http_status: 422
    applies_to: "POST /warranty-claims/{id}/approve"
  - priority: 60
    category: business_fiscal
    check: "shipment: available non-expired matching stock >= quantity_per_shipment"
    error_id: ERR_INSUFFICIENT_FEEDER_STOCK
    http_status: 409
    applies_to: "POST /feeder-subscriptions/{id}/shipments"
  - priority: 62
    category: state
    check: "OCC: expected_habitat_build_version equals current HabitatBuild.version"
    error_id: ERR_STALE_VERSION
    http_status: 412
    applies_to: "POST /habitat-builds/{id}/change-orders"

# ---------------------------------------------------------------------------
# §1.5 API Endpoint Table
# ---------------------------------------------------------------------------
endpoints:
  # --- clock (test-driving) ---
  - method: POST
    path: "/_clock/set_current_utc"
    description: "Set the server logical clock. Startup default is 2026-07-01T00:00:00Z; before any call the clock reads exactly this default and never falls back to wall-clock."
    roles: [StoreManager]
    code: 200
    input: [to_iso8601]
    output: null
    side_effects: ["advances the logical clock used by every date/window rule"]

  # --- Species / care-sheet ---
  - method: POST
    path: "/species"
    description: "Create a species catalogue entry with husbandry care-sheet fields"
    roles: [StoreManager]
    code: 201
    input: [common_name, scientific_name, "is_regulated?", "permit_class?", min_quarantine_days, warranty_days, care_temp_low_c, care_temp_high_c, care_humidity_low_pct, care_humidity_high_pct, feed_interval_days, care_feeder_type]
    output: Species
    side_effects: []
  - method: GET
    path: "/species/{id}"
    description: "Fetch a species"
    roles: [StoreManager, SalesAssociate, VetTech, Customer]
    code: 200
    input: []
    output: Species
    side_effects: []
  - method: GET
    path: "/species"
    description: "List species"
    roles: [StoreManager, SalesAssociate, VetTech, Customer]
    code: 200
    input: ["is_regulated?", "limit?", "offset?"]
    output: Species[]
    side_effects: []
  - method: GET
    path: "/species/{id}/care-sheet"
    description: "Derived husbandry care-sheet view for a species"
    roles: [StoreManager, SalesAssociate, VetTech, Customer]
    code: 200
    input: []
    output: { care_temp_low_c: number, care_temp_high_c: number, care_humidity_low_pct: integer, care_humidity_high_pct: integer, feed_interval_days: integer, care_feeder_type: string }
    side_effects: []

  # --- Animal + quarantine/health ---
  - method: POST
    path: "/animals"
    description: "Intake a new animal (starts in INTAKE)"
    roles: [StoreManager]
    code: 201
    input: [species_id, morph, "sex?", acquisition_cost_cents, list_price_cents, "hatch_date?"]
    output: Animal
    side_effects: ["set acquired_by_user_id = X-User-ID"]
  - method: GET
    path: "/animals/{id}"
    description: "Fetch an animal"
    roles: [StoreManager, SalesAssociate, VetTech, Customer]
    code: 200
    input: []
    output: Animal
    side_effects: []
  - method: GET
    path: "/animals"
    description: "List/filter animals (reverse-reachability for Animal.species_id)"
    roles: [StoreManager, SalesAssociate, VetTech, Customer]
    code: 200
    input: ["species_id?", "status?", "limit?", "offset?"]
    output: Animal[]
    side_effects: []
  - method: POST
    path: "/animals/{id}/start-quarantine"
    description: "Open a quarantine record and move the animal INTAKE -> QUARANTINE"
    roles: [VetTech]
    code: 201
    input: []
    output: QuarantineRecord
    side_effects: ["create QuarantineRecord OPEN", "compute required_until", "Animal INTAKE -> QUARANTINE", "set Animal.quarantine_record_id"]
  - method: POST
    path: "/animals/{id}/mark-deceased"
    description: "Record an animal death; cascades quarantine failure"
    roles: [VetTech]
    code: 200
    input: ["notes?"]
    output: Animal
    side_effects: ["Animal -> DECEASED", "health_status = DECEASED", "open QuarantineRecord OPEN -> FAILED"]
  - method: GET
    path: "/animals/{id}/quarantine-record"
    description: "Reverse-reachability for QuarantineRecord.animal_id (0-1 array)"
    roles: [StoreManager, SalesAssociate, VetTech, Customer]
    code: 200
    input: []
    output: QuarantineRecord[]
    side_effects: []
  - method: GET
    path: "/quarantine-records/{id}"
    description: "Fetch a quarantine record"
    roles: [StoreManager, SalesAssociate, VetTech, Customer]
    code: 200
    input: []
    output: QuarantineRecord
    side_effects: []
  - method: POST
    path: "/quarantine-records/{id}/health-checks"
    description: "Append a health-check entry; recomputes passed_checks_count"
    roles: [VetTech]
    code: 201
    input: [result, "weight_grams?", "notes?"]
    output: QuarantineRecord
    side_effects: ["append health_checks entry with vet_user_id = X-User-ID and check_at = clock", "recompute passed_checks_count"]
  - method: POST
    path: "/quarantine-records/{id}/clear"
    description: "Clear quarantine (OPEN -> CLEARED); bubbles animal QUARANTINE -> AVAILABLE"
    roles: [VetTech]
    code: 200
    input: []
    output: QuarantineRecord
    side_effects: ["QuarantineRecord OPEN -> CLEARED", "Animal QUARANTINE -> AVAILABLE"]

  # --- Customer / permit ---
  - method: POST
    path: "/customers"
    description: "Register a customer"
    roles: [SalesAssociate, StoreManager]
    code: 201
    input: [full_name, email, "loyalty_tier?"]
    output: Customer
    side_effects: []
  - method: GET
    path: "/customers/{id}"
    description: "Fetch a customer"
    roles: [StoreManager, SalesAssociate, Customer]
    code: 200
    input: []
    output: Customer
    side_effects: []
  - method: POST
    path: "/customers/{id}/permits"
    description: "Attach a regulated-species permit to a customer (PENDING_VERIFICATION)"
    roles: [Customer, SalesAssociate]
    code: 201
    input: [permit_number, permit_class, issued_date, expiry_date]
    output: Permit
    side_effects: []
  - method: GET
    path: "/customers/{id}/permits"
    description: "Reverse-reachability for Permit.customer_id"
    roles: [StoreManager, SalesAssociate, Customer]
    code: 200
    input: []
    output: Permit[]
    side_effects: []
  - method: GET
    path: "/permits/{id}"
    description: "Fetch a permit"
    roles: [StoreManager, SalesAssociate, Customer]
    code: 200
    input: []
    output: Permit
    side_effects: []
  - method: POST
    path: "/permits/{id}/verify"
    description: "Verify a permit (PENDING_VERIFICATION -> VERIFIED)"
    roles: [StoreManager]
    code: 200
    input: []
    output: Permit
    side_effects: ["set verified_at, verified_by_user_id"]
  - method: POST
    path: "/permits/{id}/revoke"
    description: "Revoke a permit (VERIFIED -> REVOKED); cascades to CONFIRMED regulated sales"
    roles: [StoreManager]
    code: 200
    input: []
    output: Permit
    side_effects: ["cascade: citing CONFIRMED Sale -> VOIDED", "each such Animal RESERVED -> AVAILABLE"]

  # --- Sale ---
  - method: POST
    path: "/sales"
    description: "Draft a sale (computes provisional_price_cents)"
    roles: [SalesAssociate]
    code: 201
    input: [animal_id, customer_id, "permit_id?", "sold_at_expo?"]
    output: Sale
    side_effects: ["compute provisional_price_cents", "set created_by_user_id"]
  - method: GET
    path: "/sales/{id}"
    description: "Fetch a sale"
    roles: [StoreManager, SalesAssociate, Customer]
    code: 200
    input: []
    output: Sale
    side_effects: []
  - method: GET
    path: "/sales"
    description: "List/filter sales (reverse-reachability for Sale.animal_id, customer_id, permit_id)"
    roles: [StoreManager, SalesAssociate, Customer]
    code: 200
    input: ["animal_id?", "customer_id?", "permit_id?", "status?", "limit?", "offset?"]
    output: Sale[]
    side_effects: []
  - method: POST
    path: "/sales/{id}/confirm"
    description: "Confirm a sale (DRAFT -> CONFIRMED); reserves the animal and pins final price"
    roles: [SalesAssociate]
    code: 200
    input: []
    output: Sale
    side_effects: ["Animal AVAILABLE -> RESERVED", "compute sale_price_cents (final)", "set confirmed_at, warranty_expires_at"]
  - method: POST
    path: "/sales/{id}/fulfill"
    description: "Fulfill a sale (CONFIRMED -> FULFILLED); marks animal SOLD"
    roles: [SalesAssociate]
    code: 200
    input: []
    output: Sale
    side_effects: ["Animal RESERVED -> SOLD"]
  - method: POST
    path: "/sales/{id}/void"
    description: "Void a confirmed sale (CONFIRMED -> VOIDED); releases the animal"
    roles: [SalesAssociate]
    code: 200
    input: []
    output: Sale
    side_effects: ["Animal RESERVED -> AVAILABLE (compensation)"]

  # --- Warranty ---
  - method: POST
    path: "/sales/{id}/warranty-claims"
    description: "Submit a livestock warranty claim against a fulfilled sale"
    roles: [Customer]
    code: 201
    input: [claim_type, reason]
    output: WarrantyClaim
    side_effects: []
  - method: GET
    path: "/warranty-claims/{id}"
    description: "Fetch a warranty claim"
    roles: [StoreManager, SalesAssociate, Customer]
    code: 200
    input: []
    output: WarrantyClaim
    side_effects: []
  - method: GET
    path: "/warranty-claims"
    description: "List/filter warranty claims (reverse-reachability for WarrantyClaim.sale_id)"
    roles: [StoreManager, SalesAssociate, Customer]
    code: 200
    input: ["sale_id?", "status?", "limit?", "offset?"]
    output: WarrantyClaim[]
    side_effects: []
  - method: POST
    path: "/warranty-claims/{id}/approve"
    description: "Approve a claim (SUBMITTED -> APPROVED); computes refund_cents"
    roles: [StoreManager]
    code: 200
    input: []
    output: WarrantyClaim
    side_effects: ["compute refund_cents", "set approved_by_user_id"]
  - method: POST
    path: "/warranty-claims/{id}/deny"
    description: "Deny a claim (SUBMITTED -> DENIED)"
    roles: [StoreManager]
    code: 200
    input: ["reason?"]
    output: WarrantyClaim
    side_effects: []
  - method: POST
    path: "/warranty-claims/{id}/resolve"
    description: "Resolve an approved claim (APPROVED -> RESOLVED) with a resolution branch"
    roles: [StoreManager]
    code: 200
    input: [resolution, "replacement_animal_id?"]
    output: WarrantyClaim
    side_effects: ["REFUND: Sale -> REFUNDED + wallet credit", "CREDIT: wallet credit + Sale -> CLOSED", "REPLACEMENT: replacement Animal -> SOLD + Sale -> CLOSED"]

  # --- Feeder inventory / subscription ---
  - method: POST
    path: "/feeder-batches"
    description: "Receive a feeder inventory batch"
    roles: [StoreManager]
    code: 201
    input: [feeder_type, size, quantity_on_hand, unit_price_cents, received_date, expiry_date]
    output: FeederBatch
    side_effects: []
  - method: GET
    path: "/feeder-batches/{id}"
    description: "Fetch a feeder batch"
    roles: [StoreManager, SalesAssociate]
    code: 200
    input: []
    output: FeederBatch
    side_effects: []
  - method: GET
    path: "/feeder-batches"
    description: "List/filter feeder batches"
    roles: [StoreManager, SalesAssociate]
    code: 200
    input: ["feeder_type?", "status?", "limit?", "offset?"]
    output: FeederBatch[]
    side_effects: []
  - method: POST
    path: "/feeder-subscriptions"
    description: "Create a feeder subscription (ACTIVE)"
    roles: [Customer, SalesAssociate]
    code: 201
    input: [customer_id, feeder_type, size, quantity_per_shipment, cadence_days]
    output: FeederSubscription
    side_effects: ["set next_ship_date = clock"]
  - method: GET
    path: "/feeder-subscriptions/{id}"
    description: "Fetch a subscription"
    roles: [StoreManager, SalesAssociate, Customer]
    code: 200
    input: []
    output: FeederSubscription
    side_effects: []
  - method: GET
    path: "/feeder-subscriptions"
    description: "List/filter subscriptions (reverse-reachability for FeederSubscription.customer_id)"
    roles: [StoreManager, SalesAssociate, Customer]
    code: 200
    input: ["customer_id?", "status?", "limit?", "offset?"]
    output: FeederSubscription[]
    side_effects: []
  - method: POST
    path: "/feeder-subscriptions/{id}/pause"
    description: "Pause a subscription (ACTIVE -> PAUSED)"
    roles: [Customer]
    code: 200
    input: []
    output: FeederSubscription
    side_effects: []
  - method: POST
    path: "/feeder-subscriptions/{id}/resume"
    description: "Resume a subscription (PAUSED/HELD -> ACTIVE)"
    roles: [Customer]
    code: 200
    input: []
    output: FeederSubscription
    side_effects: []
  - method: POST
    path: "/feeder-subscriptions/{id}/cancel"
    description: "Cancel a subscription (-> CANCELLED)"
    roles: [Customer]
    code: 200
    input: []
    output: FeederSubscription
    side_effects: []
  - method: POST
    path: "/feeder-subscriptions/{id}/shipments"
    description: "Ship the subscription: waterfall-allocate stock, decrement batches, advance next_ship_date"
    roles: [SalesAssociate]
    code: 201
    input: []
    output: Shipment
    side_effects: ["allocate quantity_per_shipment earliest-expiry-first", "decrement FeederBatch.quantity_on_hand (batch -> DEPLETED at 0)", "compute shipment_cost_cents", "set price_last_shipment_cents", "advance next_ship_date by cadence_days"]
  - method: GET
    path: "/feeder-subscriptions/{id}/shipments"
    description: "Reverse-reachability for Shipment.subscription_id"
    roles: [StoreManager, SalesAssociate, Customer]
    code: 200
    input: []
    output: Shipment[]
    side_effects: []
  - method: GET
    path: "/shipments/{id}"
    description: "Fetch a shipment"
    roles: [StoreManager, SalesAssociate, Customer]
    code: 200
    input: []
    output: Shipment
    side_effects: []
  - method: POST
    path: "/shipments/{id}/reverse"
    description: "Manually reverse a shipment (SHIPPED -> REVERSED); restores batch quantities"
    roles: [SalesAssociate]
    code: 200
    input: []
    output: Shipment
    side_effects: ["restore each allocation.quantity to its FeederBatch.quantity_on_hand (DEPLETED -> AVAILABLE)", "set reversed_reason = MANUAL"]

  # --- Habitat build / special order ---
  - method: POST
    path: "/habitat-builds"
    description: "Create a custom habitat build/special order (QUOTED)"
    roles: [Customer, SalesAssociate]
    code: 201
    input: [customer_id, spec_summary, quote_cents]
    output: HabitatBuild
    side_effects: []
  - method: GET
    path: "/habitat-builds/{id}"
    description: "Fetch a habitat build"
    roles: [StoreManager, SalesAssociate, Customer]
    code: 200
    input: []
    output: HabitatBuild
    side_effects: []
  - method: GET
    path: "/habitat-builds"
    description: "List/filter habitat builds (reverse-reachability for HabitatBuild.customer_id)"
    roles: [StoreManager, SalesAssociate, Customer]
    code: 200
    input: ["customer_id?", "status?", "limit?", "offset?"]
    output: HabitatBuild[]
    side_effects: []
  - method: POST
    path: "/habitat-builds/{id}/pay-deposit"
    description: "Pay the deposit (QUOTED -> DEPOSIT_PAID); pins deposit_cents"
    roles: [Customer]
    code: 200
    input: []
    output: HabitatBuild
    side_effects: ["set deposit_cents, deposit_paid = true"]
  - method: POST
    path: "/habitat-builds/{id}/start"
    description: "Begin the build (DEPOSIT_PAID -> IN_PROGRESS)"
    roles: [SalesAssociate]
    code: 200
    input: []
    output: HabitatBuild
    side_effects: []
  - method: POST
    path: "/habitat-builds/{id}/change-orders"
    description: "File a change order (IN_PROGRESS -> CHANGE_REQUESTED); OCC-guarded"
    roles: [Customer]
    code: 200
    input: [delta_cents, expected_habitat_build_version]
    output: HabitatBuild
    side_effects: ["increments HabitatBuild.version by 1", "add delta_cents to change_orders_total_cents"]
  - method: POST
    path: "/habitat-builds/{id}/approve-change"
    description: "Approve the change and resume (CHANGE_REQUESTED -> IN_PROGRESS)"
    roles: [SalesAssociate]
    code: 200
    input: []
    output: HabitatBuild
    side_effects: []
  - method: POST
    path: "/habitat-builds/{id}/schedule-install"
    description: "Schedule the install window on an installer; buffer-overlap guarded"
    roles: [SalesAssociate]
    code: 200
    input: [installer_id, install_start_at, install_end_at]
    output: HabitatBuild
    side_effects: ["set installer_id, install_start_at, install_end_at"]
  - method: POST
    path: "/habitat-builds/{id}/deliver"
    description: "Deliver the build (IN_PROGRESS -> DELIVERED); pins final_invoice_cents"
    roles: [SalesAssociate]
    code: 200
    input: []
    output: HabitatBuild
    side_effects: ["set final_invoice_cents"]
  - method: POST
    path: "/habitat-builds/{id}/cancel"
    description: "Cancel a build (-> CANCELLED)"
    roles: [Customer]
    code: 200
    input: []
    output: HabitatBuild
    side_effects: []

  # --- Expo / event ---
  - method: POST
    path: "/expos"
    description: "Create an expo/event (SCHEDULED)"
    roles: [StoreManager]
    code: 201
    input: [name, venue, start_at, end_at, venue_capacity]
    output: Expo
    side_effects: []
  - method: GET
    path: "/expos/{id}"
    description: "Fetch an expo"
    roles: [StoreManager, SalesAssociate, Customer]
    code: 200
    input: []
    output: Expo
    side_effects: []
  - method: GET
    path: "/expos"
    description: "List/filter expos"
    roles: [StoreManager, SalesAssociate, Customer]
    code: 200
    input: ["status?", "limit?", "offset?"]
    output: Expo[]
    side_effects: []
  - method: POST
    path: "/expos/{id}/open"
    description: "Open an expo (SCHEDULED -> OPEN)"
    roles: [StoreManager]
    code: 200
    input: []
    output: Expo
    side_effects: []
  - method: POST
    path: "/expos/{id}/close"
    description: "Close an expo (OPEN -> CLOSED); ends assignments"
    roles: [StoreManager]
    code: 200
    input: []
    output: Expo
    side_effects: ["every ASSIGNED ExpoAssignment -> ENDED"]
  - method: POST
    path: "/expos/{id}/cancel"
    description: "Cancel an expo (-> CANCELLED); cancels assignments"
    roles: [StoreManager]
    code: 200
    input: []
    output: Expo
    side_effects: ["every ASSIGNED ExpoAssignment -> CANCELLED"]
  - method: POST
    path: "/expos/{id}/assignments"
    description: "Assign an animal to an expo booth; temporal-overlap and capacity guarded"
    roles: [SalesAssociate]
    code: 201
    input: [animal_id]
    output: ExpoAssignment
    side_effects: []
  - method: GET
    path: "/expos/{id}/assignments"
    description: "Reverse-reachability for ExpoAssignment.expo_id"
    roles: [StoreManager, SalesAssociate, Customer]
    code: 200
    input: []
    output: ExpoAssignment[]
    side_effects: []
  - method: GET
    path: "/expo-assignments/{id}"
    description: "Fetch an expo assignment"
    roles: [StoreManager, SalesAssociate, Customer]
    code: 200
    input: []
    output: ExpoAssignment
    side_effects: []
  - method: GET
    path: "/expo-assignments"
    description: "List/filter expo assignments (reverse-reachability for ExpoAssignment.animal_id)"
    roles: [StoreManager, SalesAssociate, Customer]
    code: 200
    input: ["animal_id?", "expo_id?", "limit?", "offset?"]
    output: ExpoAssignment[]
    side_effects: []

  # --- Recall ---
  - method: POST
    path: "/recalls"
    description: "Open a feeder recall; cascades batch -> shipment -> subscription -> customer credit"
    roles: [StoreManager]
    code: 201
    input: [reason, target_feeder_type, affected_batch_ids]
    output: Recall
    side_effects: ["each affected FeederBatch AVAILABLE -> RECALLED (quantity_on_hand = 0)", "each SHIPPED Shipment allocating a recalled batch -> REVERSED (RECALL)", "each such FeederSubscription ACTIVE -> HELD", "Customer.wallet_credit_cents += reversed shipment_cost_cents", "set opened_by_user_id"]
  - method: GET
    path: "/recalls/{id}"
    description: "Fetch a recall"
    roles: [StoreManager, SalesAssociate]
    code: 200
    input: []
    output: Recall
    side_effects: []
  - method: GET
    path: "/recalls"
    description: "List/filter recalls"
    roles: [StoreManager, SalesAssociate]
    code: 200
    input: ["status?", "limit?", "offset?"]
    output: Recall[]
    side_effects: []
  - method: POST
    path: "/recalls/{id}/close"
    description: "Close a recall (OPEN -> CLOSED); four-eyes segregation of duties"
    roles: [StoreManager]
    code: 200
    input: []
    output: Recall
    side_effects: ["set closed_by_user_id = X-User-ID"]

# ---------------------------------------------------------------------------
# §1.6 Error Code Catalog
# ---------------------------------------------------------------------------
errors:
  - id: ERR_UNAUTHENTICATED
    http: 401
    condition: "missing/blank X-User-Role or X-User-ID headers"
  - id: ERR_UNAUTHORIZED
    http: 403
    condition: "role not permitted for the operation"
  - id: ERR_VALIDATION
    http: 400
    condition: "missing required field, wrong type, or illegal enum value"
  - id: ERR_INVALID_PAGINATION
    http: 400
    condition: "limit outside [1,100] or offset < 0"
  - id: ERR_NOT_FOUND
    http: 404
    condition: "generic referenced resource not found (fallback)"
  - id: ERR_SPECIES_NOT_FOUND
    http: 404
    condition: "species_id does not resolve"
  - id: ERR_ANIMAL_NOT_FOUND
    http: 404
    condition: "animal id/animal_id does not resolve"
  - id: ERR_CUSTOMER_NOT_FOUND
    http: 404
    condition: "customer id/customer_id does not resolve"
  - id: ERR_PERMIT_NOT_FOUND
    http: 404
    condition: "permit id/permit_id does not resolve"
  - id: ERR_SALE_NOT_FOUND
    http: 404
    condition: "sale id does not resolve"
  - id: ERR_WARRANTY_CLAIM_NOT_FOUND
    http: 404
    condition: "warranty-claim id does not resolve"
  - id: ERR_QUARANTINE_NOT_FOUND
    http: 404
    condition: "quarantine-record id does not resolve"
  - id: ERR_FEEDER_BATCH_NOT_FOUND
    http: 404
    condition: "feeder-batch id does not resolve"
  - id: ERR_SUBSCRIPTION_NOT_FOUND
    http: 404
    condition: "feeder-subscription id does not resolve"
  - id: ERR_SHIPMENT_NOT_FOUND
    http: 404
    condition: "shipment id does not resolve"
  - id: ERR_HABITAT_BUILD_NOT_FOUND
    http: 404
    condition: "habitat-build id does not resolve"
  - id: ERR_EXPO_NOT_FOUND
    http: 404
    condition: "expo id does not resolve"
  - id: ERR_ASSIGNMENT_NOT_FOUND
    http: 404
    condition: "expo-assignment id does not resolve"
  - id: ERR_RECALL_NOT_FOUND
    http: 404
    condition: "recall id does not resolve"
  - id: ERR_INVALID_STATE
    http: 409
    condition: "transition requested from a state that does not allow it (generic)"
  - id: ERR_ANIMAL_NOT_AVAILABLE
    http: 409
    condition: "sale confirm / expo assignment when animal is not AVAILABLE"
  - id: ERR_QUARANTINE_NOT_COMPLETE
    http: 409
    condition: "clear before required_until reached or with fewer than MIN_PASS_CHECKS passes"
  - id: ERR_SEGREGATION_OF_DUTIES
    http: 403
    condition: "same user for both sides of a four-eyes control (recall open/close; warranty acquirer/approver)"
  - id: ERR_FEEDER_RECALLED
    http: 409
    condition: "shipment where all candidate batches are recalled/expired"
  - id: ERR_EXPO_OVERLAP
    http: 409
    condition: "animal already ASSIGNED to another expo whose half-open window overlaps"
  - id: ERR_INSTALL_BUFFER_CONFLICT
    http: 409
    condition: "install window within INSTALL_BUFFER_MINUTES (60 minutes) of another build on the same installer_id"
  - id: ERR_EXPO_CAPACITY_EXCEEDED
    http: 409
    condition: "expo already at venue_capacity ASSIGNED animals"
  - id: ERR_PERMIT_REQUIRED
    http: 422
    condition: "regulated-species sale confirm without a present permit"
  - id: ERR_PERMIT_NOT_VERIFIED
    http: 422
    condition: "cited permit is not VERIFIED or class insufficient"
  - id: ERR_PERMIT_EXPIRED
    http: 422
    condition: "cited permit expiry_date <= clock at confirm/verify"
  - id: ERR_WARRANTY_EXPIRED
    http: 422
    condition: "warranty claim approve after Sale.warranty_expires_at"
  - id: ERR_INSUFFICIENT_FEEDER_STOCK
    http: 409
    condition: "available non-expired matching stock < quantity_per_shipment"
  - id: ERR_STALE_VERSION
    http: 412
    condition: "expected_habitat_build_version != current HabitatBuild.version"

# ---------------------------------------------------------------------------
# §1.7 RBAC Matrix
# ---------------------------------------------------------------------------
roles:
  - name: StoreManager
    description: "Store operator: catalogue, intake, permits, warranty adjudication, feeder inventory, recalls, expos, clock"
    identity: opaque
    exclusive_operations:
      - "POST /species"
      - "POST /animals (intake; stamps acquired_by_user_id)"
      - "POST /permits/{id}/verify"
      - "POST /permits/{id}/revoke"
      - "POST /warranty-claims/{id}/approve"
      - "POST /warranty-claims/{id}/deny"
      - "POST /warranty-claims/{id}/resolve"
      - "POST /feeder-batches"
      - "POST /expos, /expos/{id}/open, /expos/{id}/close, /expos/{id}/cancel"
      - "POST /recalls, /recalls/{id}/close"
      - "POST /_clock/set_current_utc"
    shared_operations:
      - "POST /customers (with SalesAssociate)"
      - "all GET reads"
  - name: VetTech
    description: "Veterinary technician: quarantine and health lifecycle"
    identity: opaque
    exclusive_operations:
      - "POST /animals/{id}/start-quarantine"
      - "POST /quarantine-records/{id}/health-checks"
      - "POST /quarantine-records/{id}/clear"
      - "POST /animals/{id}/mark-deceased"
    shared_operations:
      - "GET reads on species/animals/quarantine-records"
  - name: SalesAssociate
    description: "Floor sales: sales lifecycle, expo assignments, shipments, habitat build execution"
    identity: opaque
    exclusive_operations:
      - "POST /sales, /sales/{id}/confirm, /sales/{id}/fulfill, /sales/{id}/void"
      - "POST /feeder-subscriptions/{id}/shipments"
      - "POST /shipments/{id}/reverse"
      - "POST /expos/{id}/assignments"
      - "POST /habitat-builds/{id}/start, /approve-change, /schedule-install, /deliver"
    shared_operations:
      - "POST /customers (with StoreManager)"
      - "POST /customers/{id}/permits (with Customer)"
      - "POST /feeder-subscriptions, /habitat-builds (with Customer)"
      - "all GET reads"
  - name: Customer
    description: "End customer acting on their own resources (X-User-ID == Customer.id)"
    identity: "entity_backed:Customer"
    exclusive_operations:
      - "POST /sales/{id}/warranty-claims (own sale)"
      - "POST /feeder-subscriptions/{id}/pause, /resume, /cancel (own)"
      - "POST /habitat-builds/{id}/pay-deposit, /change-orders, /cancel (own)"
    shared_operations:
      - "POST /customers/{id}/permits (with SalesAssociate)"
      - "POST /feeder-subscriptions, /habitat-builds (with SalesAssociate)"
      - "GET reads on own customer/sales/subscriptions/builds/permits"
