              as: Customer
              as_user_id: "${c}"
              captures: { av: $.data.version }
          trigger:
            - call: "POST /rental-agreements/${a}/buyout"
              payload: { amount_cents: 100000, expected_agreement_version: "${av}" }
              as: Customer
              as_user_id: "${c}"
              captures: { err: $.data.error_id }
          assert:
            - "response.error_id == ERR_PAYOFF_MISMATCH"
            - "RentalAgreement.${a}.status == ACTIVE"

      - name: reservation_mismatch_wrong_customer_on_agreement
        claim_type: Cross-entity validation
        grounds: ["validations[priority=4]", "errors[ERR_RESERVATION_MISMATCH]", state_machines.InventoryUnit.RESERVED_to_ON_RENT]
        distinguishing_aspect: "Opening an agreement for customer C2 on a unit reserved for C1 -> ERR_RESERVATION_MISMATCH (409); unit stays RESERVED for C1."
        test_recipe:
          setup: ["Customers C1 and C2, unit U reserved for C1."]
          setup_api_calls:
            - call: "POST /customers"
              payload: { full_name: "C Va2a", email: "cva2a@x.com", credit_score: 700 }
              as: SalesAssociate
              captures: { c1: $.data.id }
            - call: "POST /customers"
              payload: { full_name: "C Va2b", email: "cva2b@x.com", credit_score: 700 }
              as: SalesAssociate
              captures: { c2: $.data.id }
            - call: "POST /units"
              payload: { model_name: "Va2 Sax", category: "BAND", condition: "NEW", serial_number: "S-VA2-1", acquisition_cost_cents: 30000, list_price_cents: 60000, monthly_rent_cents: 5000 }
              as: SalesAssociate
              captures: { u: $.data.id, uv: $.data.version }
            - call: "POST /units/${u}/reserve"
              payload: { customer_id: "${c1}", expected_inventory_unit_version: "${uv}" }
