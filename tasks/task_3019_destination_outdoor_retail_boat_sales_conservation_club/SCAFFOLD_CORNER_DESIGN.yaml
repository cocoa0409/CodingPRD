  # =========================================================================
  # Section: errors
  # =========================================================================
  - section: errors
    instances:

      - name: stale_version_on_bay_booking_returns_412
        claim_type: violation_to_error
        grounds:
          - errors[ERR_STALE_VERSION]
          - concurrency_rules[oversize-carryout-stale-bay-version]
          - entities.LoadingBayBooking.fields.version
        distinguishing_aspect: "A fulfillment create carrying a bay booking version one behind the server's returns ERR_STALE_VERSION with 412, while the same call with the observed version succeeds."
        test_recipe:
          setup: ["a store, boat unit, member, oversize loading order and a bay booking whose version has already advanced past 1"]
          setup_api_calls:
            - call: "POST /stores"
              payload: { name: "Ozark Flagship", state_code: "MO", dealer_license_no: "MO-DLR-4417", dwell_capacity_minutes: 60000, load_bays_total: 4 }
              as: PlatformAdmin
              captures: { st_id: $.data.id }
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-09-01T00:00:00Z" }
              as: PlatformAdmin
            - call: "POST /stores/${st_id}/members"
              payload: { email: "m_sv@x.com", full_name: "Sten Voss", donation_opt_in: false }
              as: Anonymous
              captures: { m_id: $.data.id }
            - call: "POST /stores/${st_id}/boat-units"
              payload: { stock_no: "BU-SV", model_name: "Bay 170", unit_price_cents: 4000000, unit_condition: "NEW", hull_id_no: "HINSV0000001" }
              as: DealDeskClerk
              captures: { bu_id: $.data.id }
            - call: "POST /stores/${st_id}/service-orders"
              payload: { boat_unit_id: "${bu_id}", order_kind: "OVERSIZE_LOADING", promised_lead_days: 3 }
              as: ServiceWriter
              captures: { so_id: $.data.id }
            - call: "POST /stores/${st_id}/bay-bookings"
              payload: { bay_no: 1, member_id: "${m_id}", service_order_id: "${so_id}", booked_start_utc: "2026-12-01T09:00:00Z", booked_end_utc: "2026-12-01T10:00:00Z" }
              as: ReceivingManager
              captures: { bk_id: $.data.id, bk_v: $.data.version }
            - call: "POST /stores/${st_id}/order-fulfillments"
              payload: { member_id: "${m_id}", order_kind: "OVERSIZE_CARRYOUT", pre_service_order_id: "${so_id}", booking_id: "${bk_id}", expected_booking_version: "${bk_v}" }
              as: ReceivingManager
              captures: { of1_id: $.data.id }
            - call: "POST /stores/order-fulfillments/${of1_id}/cancel"
              payload: {}
              as: ReceivingManager
          trigger:
            - call: "GET /stores/bay-bookings/${bk_id}"
              as: ReceivingManager
              captures: { bk_v_stale: $.data.version }
            - call: "POST /stores/${st_id}/order-fulfillments"
              payload: { member_id: "${m_id}", order_kind: "OVERSIZE_CARRYOUT", pre_service_order_id: "${so_id}", booking_id: "${bk_id}", expected_booking_version: "${bk_v_stale} - 1" }
              as: ReceivingManager
              captures: { err: $.data.error_id }
            - call: "POST /stores/${st_id}/order-fulfillments"
              payload: { member_id: "${m_id}", order_kind: "OVERSIZE_CARRYOUT", pre_service_order_id: "${so_id}", booking_id: "${bk_id}", expected_booking_version: "${bk_v_stale}" }
              as: ReceivingManager
              captures: { of2_id: $.data.id }
          assert:
            - "the deliberately stale create is rejected with data.error_id == ERR_STALE_VERSION and http 412"
            - "the create carrying the freshly observed version succeeds and OrderFulfillment.${of2_id}.status == READY_FOR_RELEASE"
            - "the success incremented the parent: LoadingBayBooking.${bk_id}.version advanced by one from ${bk_v_stale}"
            - "no OrderFulfillment row exists for the stale attempt, since the two attempts produced exactly one new id"

      - name: overhead_load_above_the_bay_count_returns_bay_not_found
        claim_type: violation_to_error
        grounds:
          - errors[ERR_BAY_NOT_FOUND]
          - validations[priority=5]
          - entities.Store.fields.load_bays_total
        distinguishing_aspect: "The bay index ceiling comes from the store's own load_bays_total, so bay 5 fails at a store with 4 bays and succeeds at a store with 5."
        test_recipe:
          setup: ["two stores, one with 4 bays and one with 5, and one shared member with a service order at each"]
          setup_api_calls:
            - call: "POST /stores"
              payload: { name: "Ozark Flagship", state_code: "MO", dealer_license_no: "MO-DLR-4417", dwell_capacity_minutes: 60000, load_bays_total: 4 }
