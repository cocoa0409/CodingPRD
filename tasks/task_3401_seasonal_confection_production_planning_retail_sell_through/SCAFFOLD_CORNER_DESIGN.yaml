            - call: "POST /confection/retailer-commitments"
              payload: { program_id: "${prog_id}", retailer_id: "${r_gold}", product_id: "${prod_id}", committed_units: 10, ship_window_open_on: "2027-08-01T00:00:00Z", ship_window_close_on: "2027-09-10T00:00:00Z" }
              as: Retailer
