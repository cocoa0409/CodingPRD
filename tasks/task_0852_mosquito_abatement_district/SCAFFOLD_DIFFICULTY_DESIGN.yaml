          - calculations.trap_abundance_index
          - endpoints[POST /service-areas/{id}/risk-assessments]
        distinguishing_aspect: |
          Boundary metric #1 is the abundance_component threshold: 100 females over 4
          trap-nights gives abundance_index 25.00 and abundance_component exactly 50.00,
          which satisfies the >= OUTBREAK_ABUNDANCE_TRIGGER test, so the 1.25 multiplier
          fires and vector_index_provisional is 68.75 rather than the unamplified 55.00.
          Reached through POST /service-areas/{id}/risk-assessments.
        test_recipe:
          setup:
            - "Logical clock at 2026-06-01T00:00:00.000Z; ServiceArea NW1 with season_start_date 2026-05-01."
            - "One SUBMITTED collection of 100 females over 4 trap-nights and one RESULT_POSITIVE pool of 50."
            - "No larval inspections and no weather observations."
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-06-01T00:00:00.000Z" }
              as: DistrictAdmin
            - call: "POST /service-areas"
