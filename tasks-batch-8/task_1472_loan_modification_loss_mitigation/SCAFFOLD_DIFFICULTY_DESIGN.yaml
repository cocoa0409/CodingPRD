            - { call: "POST /applications/${app_id}/evaluations", payload: { expected_application_version: "${app_v}" }, as: Underwriter, as_user_id: "uw_1" }
          trigger:
            - { call: "POST /foreclosure-cases/${fc_id}/schedule-sale", payload: { sale_date: "2026-08-12" }, as: ForeclosureCounsel, captures: { err: $.data.error_id } }
          assert:
            - "error_id == ERR_SALE_WITHIN_APPEAL_WINDOW (safety priority 8), NOT ERR_SALE_MIN_NOTICE (temporal priority 9), though both hold"
            - "http status == 422"

  # =====================================================================
  # Rule 6 — boundary_precision_check
  # =====================================================================
  - rule_id: boundary_precision_check
    instances:
      - name: target_ratio_equality_qualifies_for_offer
        grounds:
          - calculations.target_affordable_payment
          - calculations.waterfall_modified_payment
        distinguishing_aspect: |
          Metric payment-to-income ratio at exact equality: forbearance solves the
          final P&I to EXACTLY the 100000-cent target; the inclusive <= boundary must
          yield OFFER (a strict < would wrongly deny). Endpoint: POST /applications/{id}/evaluations.
        test_recipe:
          setup:
            - "Fixture B loan (base 36000000) with verified income 322581 -> target exactly 100000"
          setup_api_calls:
            - { call: "POST /borrowers", payload: { full_name: "Nina N", email: "nina.n@x.com" }, as: ServicingAdmin, captures: { b_id: $.data.id } }
            - { call: "POST /loans", payload: { borrower_id: "${b_id}", loan_number: "LN-BP1", property_state_code: "TX", unpaid_principal_balance_cents: 30000000, interest_rate_bp: 600, remaining_term_months: 240, arrears_cents: 6000000, escrow_balance_cents: 0, escrow_monthly_cents: 0, delinquency_days: 150 }, as: ServicingAdmin, captures: { loan_id: $.data.id, loan_v: $.data.version } }
            - { call: "POST /program-options", payload: { code: "STD_MOD", waterfall_rank: 1, target_dti_bp: 3100, rate_floor_bp: 200, rate_step_bp: 25, max_term_months: 480, max_forbearance_pct_bp: 3000, min_delinquency_days: 61, max_delinquency_days: 720 }, as: ServicingAdmin }
            - { call: "POST /loans/${loan_id}/applications", payload: { expected_loan_version: "${loan_v}", hardship_type: "UNEMPLOYMENT", stated_monthly_income_cents: 322581 }, as: Borrower, as_user_id: "${b_id}", captures: { app_id: $.data.id } }
            - { call: "POST /applications/${app_id}/acknowledge", as: LossMitAgent }
            - { call: "POST /applications/${app_id}/documents", payload: { doc_type: "PAYSTUB", gross_per_period_cents: 322581, pay_frequency: "MONTHLY", pay_period_end_date: "2026-07-31" }, as: Borrower, as_user_id: "${b_id}", captures: { d_pay: $.data.id } }
            - { call: "POST /applications/${app_id}/documents", payload: { doc_type: "HARDSHIP_AFFIDAVIT" }, as: Borrower, as_user_id: "${b_id}", captures: { d_aff: $.data.id } }
            - { call: "POST /applications/${app_id}/documents", payload: { doc_type: "BANK_STATEMENT" }, as: Borrower, as_user_id: "${b_id}", captures: { d_bank: $.data.id } }
            - { call: "POST /documents/${d_pay}/accept", as: LossMitAgent }
            - { call: "POST /documents/${d_aff}/accept", as: LossMitAgent }
            - { call: "POST /documents/${d_bank}/accept", as: LossMitAgent }
          trigger:
            - { call: "GET /applications/${app_id}", as: Underwriter, captures: { app_v: $.data.version } }
            - { call: "POST /applications/${app_id}/evaluations", payload: { expected_application_version: "${app_v}" }, as: Underwriter, as_user_id: "uw_1", captures: { ev_id: $.data.id } }
          assert:
            - "WaterfallEvaluation.${ev_id}.target_payment_cents == 100000"
            - "WaterfallEvaluation.${ev_id}.offered_pi_cents == 100000 (exactly equal to target)"
            - "WaterfallEvaluation.${ev_id}.result == OFFER (equality qualifies; inclusive boundary)"

      - name: outstanding_docs_one_to_zero_flips_complete
        grounds:
          - state_machines.LossMitApplication.ACKNOWLEDGED_to_COMPLETE_PACKAGE
          - entities.LossMitApplication.fields.outstanding_doc_categories
        distinguishing_aspect: |
          Metric outstanding-category COUNT at the 1->0 edge (an empty-set boundary,
          distinct metric from the sibling ratio): accepting while one category
          remains keeps ACKNOWLEDGED; the accept that empties the set flips
          COMPLETE_PACKAGE. Endpoint: POST /documents/{id}/accept.
        test_recipe:
          setup:
            - "Application ACKNOWLEDGED with 3 required categories outstanding"
          setup_api_calls:
            - { call: "POST /borrowers", payload: { full_name: "Omar O", email: "omar.o@x.com" }, as: ServicingAdmin, captures: { b_id: $.data.id } }
            - { call: "POST /loans", payload: { borrower_id: "${b_id}", loan_number: "LN-BP2", property_state_code: "CA", unpaid_principal_balance_cents: 20000000, interest_rate_bp: 600, remaining_term_months: 240, arrears_cents: 1200000, escrow_balance_cents: 30000, escrow_monthly_cents: 30000, delinquency_days: 150 }, as: ServicingAdmin, captures: { loan_id: $.data.id, loan_v: $.data.version } }
            - { call: "POST /loans/${loan_id}/applications", payload: { expected_loan_version: "${loan_v}", hardship_type: "MEDICAL", stated_monthly_income_cents: 400000 }, as: Borrower, as_user_id: "${b_id}", captures: { app_id: $.data.id } }
            - { call: "POST /applications/${app_id}/acknowledge", as: LossMitAgent }
            - { call: "POST /applications/${app_id}/documents", payload: { doc_type: "PAYSTUB", gross_per_period_cents: 200000, pay_frequency: "BIWEEKLY", pay_period_end_date: "2026-07-31" }, as: Borrower, as_user_id: "${b_id}", captures: { d_pay: $.data.id } }
            - { call: "POST /applications/${app_id}/documents", payload: { doc_type: "HARDSHIP_AFFIDAVIT" }, as: Borrower, as_user_id: "${b_id}", captures: { d_aff: $.data.id } }
            - { call: "POST /applications/${app_id}/documents", payload: { doc_type: "BANK_STATEMENT" }, as: Borrower, as_user_id: "${b_id}", captures: { d_bank: $.data.id } }
            - { call: "POST /documents/${d_pay}/accept", as: LossMitAgent }
            - { call: "POST /documents/${d_aff}/accept", as: LossMitAgent }
            - { call: "GET /applications/${app_id}", as: LossMitAgent, captures: { mid_status: $.data.status, mid_outstanding: $.data.outstanding_doc_categories } }
            - { call: "POST /_clock/set_current_utc", payload: { to_iso8601: "2026-08-05T00:00:00Z" }, as: ServicingAdmin }
          trigger:
            - { call: "POST /documents/${d_bank}/accept", as: LossMitAgent }
          assert:
            - "At count 1 (only BANK_STATEMENT outstanding): mid_status == ACKNOWLEDGED and mid_outstanding == [BANK_STATEMENT] (no flip)"
            - "At count 0: LossMitApplication.${app_id}.status == COMPLETE_PACKAGE"
            - "completed_at == 2026-08-05T00:00:00Z (set exactly when the set empties)"

      - name: referral_delinquency_day_120_vs_121
        grounds:
          - calculations.sale_eligibility_window
          - errors[ERR_REFERRAL_TOO_EARLY]
        distinguishing_aspect: |
          Metric delinquency days with a STRICTLY-greater-than rule (distinct metric
          from both siblings): day 120 fails, day 121 passes. Endpoint: POST /loans/{id}/foreclosure-cases.
        test_recipe:
          setup:
            - "Two loans, no applications: one at delinquency 120, one at 121"
          setup_api_calls:
            - { call: "POST /borrowers", payload: { full_name: "Pam P", email: "pam.p@x.com" }, as: ServicingAdmin, captures: { b_id: $.data.id } }
            - { call: "POST /loans", payload: { borrower_id: "${b_id}", loan_number: "LN-BP3A", property_state_code: "AZ", unpaid_principal_balance_cents: 20000000, interest_rate_bp: 600, remaining_term_months: 240, arrears_cents: 1000000, escrow_balance_cents: 0, escrow_monthly_cents: 0, delinquency_days: 120 }, as: ServicingAdmin, captures: { loan_120: $.data.id } }
            - { call: "POST /loans", payload: { borrower_id: "${b_id}", loan_number: "LN-BP3B", property_state_code: "AZ", unpaid_principal_balance_cents: 20000000, interest_rate_bp: 600, remaining_term_months: 240, arrears_cents: 1000000, escrow_balance_cents: 0, escrow_monthly_cents: 0, delinquency_days: 121 }, as: ServicingAdmin, captures: { loan_121: $.data.id } }
          trigger:
            - { call: "POST /loans/${loan_120}/foreclosure-cases", payload: { county: "Maricopa", docket_number: "FC-600" }, as: ForeclosureCounsel, captures: { err: $.data.error_id } }
            - { call: "POST /loans/${loan_121}/foreclosure-cases", payload: { county: "Maricopa", docket_number: "FC-601" }, as: ForeclosureCounsel, captures: { fc_id: $.data.id } }
          assert:
            - "delinquency 120: error_id == ERR_REFERRAL_TOO_EARLY, http 422 (rule is strictly > 120)"
            - "delinquency 121: 201, ForeclosureCase.${fc_id}.status == REFERRED"

  # =====================================================================
  # Rule 7 — cross_entity_state_dependency
  # =====================================================================
  - rule_id: cross_entity_state_dependency
    instances:
      - name: sale_schedule_gated_by_blocking_application
        grounds:
          - state_machines.ForeclosureCase.REFERRED_to_SALE_SCHEDULED
          - calculations.sale_eligibility_window
        distinguishing_aspect: |
          Entity pair ForeclosureCase x LossMitApplication: scheduling is legal only
          relative to the OTHER entity's state — a COMPLETE_PACKAGE application blocks
          sale dates 37+ days out from completion (2026-09-11 blocked) but not 36 days
          out (2026-09-10 allowed).
        test_recipe:
          setup:
            - "Loan delinquency 150; case REFERRED 2026-08-01; application COMPLETE_PACKAGE at 2026-08-05 (blocking state)"
          setup_api_calls:
            - { call: "POST /borrowers", payload: { full_name: "Quinn Q", email: "quinn.q@x.com" }, as: ServicingAdmin, captures: { b_id: $.data.id } }
            - { call: "POST /loans", payload: { borrower_id: "${b_id}", loan_number: "LN-CE1", property_state_code: "CO", unpaid_principal_balance_cents: 20000000, interest_rate_bp: 600, remaining_term_months: 240, arrears_cents: 1200000, escrow_balance_cents: 30000, escrow_monthly_cents: 30000, delinquency_days: 150 }, as: ServicingAdmin, captures: { loan_id: $.data.id, loan_v: $.data.version } }
            - { call: "POST /loans/${loan_id}/foreclosure-cases", payload: { county: "Denver", docket_number: "FC-700" }, as: ForeclosureCounsel, captures: { fc_id: $.data.id } }
            - { call: "POST /loans/${loan_id}/applications", payload: { expected_loan_version: "${loan_v}", hardship_type: "MEDICAL", stated_monthly_income_cents: 400000 }, as: Borrower, as_user_id: "${b_id}", captures: { app_id: $.data.id } }
            - { call: "POST /applications/${app_id}/acknowledge", as: LossMitAgent }
            - { call: "POST /applications/${app_id}/documents", payload: { doc_type: "PAYSTUB", gross_per_period_cents: 200000, pay_frequency: "BIWEEKLY", pay_period_end_date: "2026-07-31" }, as: Borrower, as_user_id: "${b_id}", captures: { d_pay: $.data.id } }
            - { call: "POST /applications/${app_id}/documents", payload: { doc_type: "HARDSHIP_AFFIDAVIT" }, as: Borrower, as_user_id: "${b_id}", captures: { d_aff: $.data.id } }
            - { call: "POST /applications/${app_id}/documents", payload: { doc_type: "BANK_STATEMENT" }, as: Borrower, as_user_id: "${b_id}", captures: { d_bank: $.data.id } }
            - { call: "POST /documents/${d_pay}/accept", as: LossMitAgent }
            - { call: "POST /documents/${d_aff}/accept", as: LossMitAgent }
            - { call: "POST /_clock/set_current_utc", payload: { to_iso8601: "2026-08-05T00:00:00Z" }, as: ServicingAdmin }
            - { call: "POST /documents/${d_bank}/accept", as: LossMitAgent }
          trigger:
            - { call: "POST /foreclosure-cases/${fc_id}/schedule-sale", payload: { sale_date: "2026-09-11" }, as: ForeclosureCounsel, captures: { err: $.data.error_id } }
            - { call: "POST /foreclosure-cases/${fc_id}/schedule-sale", payload: { sale_date: "2026-09-10" }, as: ForeclosureCounsel }
          assert:
            - "sale 2026-09-11 (exactly 37 days after completion): ERR_DUAL_TRACKING_BLOCKED, http 422"
            - "sale 2026-09-10 (36 days): succeeds, ForeclosureCase.${fc_id}.status == SALE_SCHEDULED, sale_date == 2026-09-10"

      - name: modification_create_gated_by_trial_plan_completion
        grounds:
          - state_machines.PermanentModification.null_to_DRAFT
          - errors[ERR_TRIAL_PLAN_NOT_COMPLETED]
        distinguishing_aspect: |
          Entity pair PermanentModification x TrialPaymentPlan: modification creation
          is rejected while the referenced plan is merely ACTIVE (2 of 3 payments) and
          succeeds once the plan is COMPLETED — the child entity's state gates the
          parent's creation.
        test_recipe:
          setup:
            - "Fixture A to TRIAL_ACTIVE with 2 of 3 payments PAID_ON_TIME"
          setup_api_calls:
            - { call: "POST /borrowers", payload: { full_name: "Rosa R", email: "rosa.r@x.com" }, as: ServicingAdmin, captures: { b_id: $.data.id } }
            - { call: "POST /loans", payload: { borrower_id: "${b_id}", loan_number: "LN-CE2", property_state_code: "CA", unpaid_principal_balance_cents: 20000000, interest_rate_bp: 600, remaining_term_months: 240, arrears_cents: 1200000, escrow_balance_cents: 30000, escrow_monthly_cents: 30000, delinquency_days: 150 }, as: ServicingAdmin, captures: { loan_id: $.data.id, loan_v: $.data.version } }
            - { call: "POST /program-options", payload: { code: "STD_MOD", waterfall_rank: 1, target_dti_bp: 3100, rate_floor_bp: 200, rate_step_bp: 25, max_term_months: 480, max_forbearance_pct_bp: 3000, min_delinquency_days: 61, max_delinquency_days: 720 }, as: ServicingAdmin }
            - { call: "POST /loans/${loan_id}/applications", payload: { expected_loan_version: "${loan_v}", hardship_type: "INCOME_REDUCTION", stated_monthly_income_cents: 480000 }, as: Borrower, as_user_id: "${b_id}", captures: { app_id: $.data.id } }
            - { call: "POST /applications/${app_id}/acknowledge", as: LossMitAgent }
            - { call: "POST /applications/${app_id}/documents", payload: { doc_type: "PAYSTUB", gross_per_period_cents: 200000, pay_frequency: "BIWEEKLY", pay_period_end_date: "2026-07-31" }, as: Borrower, as_user_id: "${b_id}", captures: { d_pay: $.data.id } }
            - { call: "POST /applications/${app_id}/documents", payload: { doc_type: "TAX_RETURN", annual_gross_cents: 600000 }, as: Borrower, as_user_id: "${b_id}", captures: { d_tax: $.data.id } }
            - { call: "POST /applications/${app_id}/documents", payload: { doc_type: "HARDSHIP_AFFIDAVIT" }, as: Borrower, as_user_id: "${b_id}", captures: { d_aff: $.data.id } }
            - { call: "POST /applications/${app_id}/documents", payload: { doc_type: "BANK_STATEMENT" }, as: Borrower, as_user_id: "${b_id}", captures: { d_bank: $.data.id } }
            - { call: "POST /documents/${d_pay}/accept", as: LossMitAgent }
            - { call: "POST /documents/${d_tax}/accept", as: LossMitAgent }
            - { call: "POST /documents/${d_aff}/accept", as: LossMitAgent }
            - { call: "POST /documents/${d_bank}/accept", as: LossMitAgent }
            - { call: "GET /applications/${app_id}", as: Underwriter, captures: { app_v: $.data.version } }
            - { call: "POST /applications/${app_id}/evaluations", payload: { expected_application_version: "${app_v}" }, as: Underwriter, as_user_id: "uw_1" }
            - { call: "GET /trial-plans?application_id=${app_id}", as: ServicingOps, captures: { plan_id: "$.data[0].id" } }
            - { call: "POST /trial-plans/${plan_id}/accept", as: Borrower, as_user_id: "${b_id}" }
            - { call: "GET /trial-plans/${plan_id}/payments", as: ServicingOps, captures: { p1: "$.data[0].id", p2: "$.data[1].id", p3: "$.data[2].id" } }
            - { call: "POST /_clock/set_current_utc", payload: { to_iso8601: "2026-09-04T00:00:00Z" }, as: ServicingAdmin }
            - { call: "POST /trial-payments/${p1}/pay", payload: { amount_cents: 178842 }, as: Borrower, as_user_id: "${b_id}" }
            - { call: "POST /_clock/set_current_utc", payload: { to_iso8601: "2026-10-04T00:00:00Z" }, as: ServicingAdmin }
            - { call: "POST /trial-payments/${p2}/pay", payload: { amount_cents: 178842 }, as: Borrower, as_user_id: "${b_id}" }
          trigger:
            - { call: "POST /loans/${loan_id}/modifications", payload: { trial_plan_id: "${plan_id}" }, as: ServicingOps, captures: { err: $.data.error_id } }
            - { call: "POST /_clock/set_current_utc", payload: { to_iso8601: "2026-11-03T00:00:00Z" }, as: ServicingAdmin }
            - { call: "POST /trial-payments/${p3}/pay", payload: { amount_cents: 178842 }, as: Borrower, as_user_id: "${b_id}" }
            - { call: "POST /loans/${loan_id}/modifications", payload: { trial_plan_id: "${plan_id}" }, as: ServicingOps, captures: { mod_id: $.data.id } }
          assert:
            - "While plan ACTIVE: error_id == ERR_TRIAL_PLAN_NOT_COMPLETED, http 409"
            - "After 3rd on-time payment: 201, PermanentModification.${mod_id}.status == DRAFT"

      - name: trial_accept_gated_by_loan_foreclosure_status
        grounds:
          - state_machines.TrialPaymentPlan.OFFERED_to_ACTIVE
          - errors[ERR_LOAN_FORECLOSURE_COMPLETED]
        distinguishing_aspect: |
          Entity pair TrialPaymentPlan x Loan (distinct from both sibling pairs):
          accepting an OFFERED plan is rejected once the loan's foreclosure dimension
          reached SALE_COMPLETED, even though the plan itself is in a valid state.
        test_recipe:
          setup:
            - "Loan with sale scheduled pre-completion (2026-12-01), then OFFER issued, then sale completed"
          setup_api_calls:
            - { call: "POST /borrowers", payload: { full_name: "Sam S", email: "sam.s@x.com" }, as: ServicingAdmin, captures: { b_id: $.data.id } }
