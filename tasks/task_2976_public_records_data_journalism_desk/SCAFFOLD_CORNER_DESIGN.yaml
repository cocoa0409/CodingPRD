            - call: "POST /records-desk/datasets"
              payload: { request_id: "${req_id}", investigation_id: "${inv_id}", name: "ds-b", negotiated_format: "CSV", expected_field_count: 1, sensitivity_tier: "PUBLIC" }
              as: DataReporter
