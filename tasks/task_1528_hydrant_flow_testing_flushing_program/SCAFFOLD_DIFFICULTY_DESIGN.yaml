# =============================================================================
# SCAFFOLD_DIFFICULTY_DESIGN.yaml — Hydrant Flow Testing & Flushing Program
# §1.8 Test Targeting Index: 9 difficulty rules, 20 instances.
# Logical clock default is 2026-08-01T00:00:00Z unless a setup call sets it.
# =============================================================================
scaffold_difficulty_design:

  # ---------------------------------------------------------------- rule 1 ---
  - rule_id: dual_variant_calc
    instances:
      - name: hydrant_fire_flow_provisional_vs_approved
        grounds:
          - calculations.hydrant_available_fire_flow
          - entities.Hydrant.fields.provisional_fire_flow_gpm
          - entities.Hydrant.fields.approved_fire_flow_gpm
          - state_machines.FlowTest.RESULTS_SUBMITTED_to_APPROVED
        distinguishing_aspect: |
          Same hydrant test history yields two different readable flows:
          provisional includes the latest unreviewed RESULTS_SUBMITTED test
          (1589 gpm) while approved includes APPROVED tests only (1671 gpm) —
          a dual-variant split on the Hydrant entity domain.
        test_recipe:
          setup:
            - "Program OPEN, zone, hydrant H (required_fire_flow_gpm 1000, default outlet constants)"
            - "FlowTest FT1 on H with results (static 80, residual 40, pitot 64) APPROVED -> Q20 1671"
            - "FlowTest FT2 on H with results (static 90, residual 50, pitot 49) left RESULTS_SUBMITTED -> Q20 1589"
          setup_api_calls:
            - { call: "POST /programs", payload: { program_year: 2026, season: "SPRING" }, as: ProgramAdmin, captures: { prog_id: $.data.id } }
            - { call: "POST /zones", payload: { name: "Z-North" }, as: ProgramAdmin, captures: { zone_id: $.data.id } }
            - { call: "POST /hydrants", payload: { hydrant_number: "H-100", program_id: "${prog_id}", zone_id: "${zone_id}", ownership: "MUNICIPAL", required_fire_flow_gpm: 1000 }, as: ProgramAdmin, captures: { h_id: $.data.id } }
            - { call: "POST /flow-tests", payload: { hydrant_id: "${h_id}", window_start: "2026-08-02T10:00:00Z", window_end: "2026-08-02T11:00:00Z" }, as: FieldOperator, as_user_id: "op_1", captures: { ft1_id: $.data.id } }
            - { call: "POST /_clock/set_current_utc", payload: { to_iso8601: "2026-08-02T10:30:00Z" }, as: ProgramAdmin }
            - { call: "POST /flow-tests/${ft1_id}/results", payload: { static_psi: 80, residual_psi: 40, pitot_psi: 64 }, as: FieldOperator, as_user_id: "op_1" }
            - { call: "POST /flow-tests/${ft1_id}/review", payload: { decision: "APPROVE" }, as: UtilitySupervisor, as_user_id: "sup_1" }
            - { call: "POST /flow-tests", payload: { hydrant_id: "${h_id}", window_start: "2026-08-03T10:00:00Z", window_end: "2026-08-03T11:00:00Z" }, as: FieldOperator, as_user_id: "op_1", captures: { ft2_id: $.data.id } }
            - { call: "POST /_clock/set_current_utc", payload: { to_iso8601: "2026-08-03T10:30:00Z" }, as: ProgramAdmin }
            - { call: "POST /flow-tests/${ft2_id}/results", payload: { static_psi: 90, residual_psi: 50, pitot_psi: 49 }, as: FieldOperator, as_user_id: "op_1" }
          trigger:
            - { call: "GET /hydrants/${h_id}", as: UtilitySupervisor, as_user_id: "sup_1" }
          assert:
            - "Hydrant.${h_id}.provisional_fire_flow_gpm == 1589 (latest RESULTS_SUBMITTED test FT2)"
            - "Hydrant.${h_id}.approved_fire_flow_gpm == 1671 (latest APPROVED test FT1 only)"
            - "FlowTest.${ft2_id}.pitot_flow_gpm == 1174.56 and FlowTest.${ft2_id}.flow_at_20psi_gpm == 1589"

      - name: iso_points_municipal_only_vs_half_private
        grounds:
          - calculations.iso_rating_points
          - entities.ISOSnapshot.fields.weighting_profile
          - state_machines.ISOSnapshot.DRAFT_to_PUBLISHED
        distinguishing_aspect: |
          Identical program data published under two weighting profiles yields
          different pinned iso_points (53.3 vs 60.0) because PRIVATE hydrants are
          excluded under MUNICIPAL_ONLY and weighted 0.5 under
          ALL_HYDRANTS_HALF_PRIVATE — a dual-variant split on the ISOSnapshot
          entity domain, distinct from the Hydrant flow variant.
        test_recipe:
          setup:
            - "Program with 3 municipal hydrants: H1 flow-approved + inspection-verified, H2 flow-approved only, H3 neither; plus 1 private hydrant H4 (owner O1) flow-approved + inspection-verified"
            - "Logical clock at 2026-08-02T10:30:00Z; all flow reviews and inspection verifications are current"
          setup_api_calls:
            - { call: "POST /programs", payload: { program_year: 2026, season: "SPRING" }, as: ProgramAdmin, captures: { prog_id: $.data.id } }
            - { call: "POST /zones", payload: { name: "Z-North" }, as: ProgramAdmin, captures: { zone_id: $.data.id } }
            - { call: "POST /private-owners", payload: { name: "Mall Corp", contact_email: "ops@mall.example" }, as: ProgramAdmin, captures: { owner_id: $.data.id } }
            - { call: "POST /hydrants", payload: { hydrant_number: "H-1", program_id: "${prog_id}", zone_id: "${zone_id}", ownership: "MUNICIPAL", required_fire_flow_gpm: 1000 }, as: ProgramAdmin, captures: { h1_id: $.data.id } }
            - { call: "POST /hydrants", payload: { hydrant_number: "H-2", program_id: "${prog_id}", zone_id: "${zone_id}", ownership: "MUNICIPAL", required_fire_flow_gpm: 1000 }, as: ProgramAdmin, captures: { h2_id: $.data.id } }
            - { call: "POST /hydrants", payload: { hydrant_number: "H-3", program_id: "${prog_id}", zone_id: "${zone_id}", ownership: "MUNICIPAL", required_fire_flow_gpm: 1000 }, as: ProgramAdmin, captures: { h3_id: $.data.id } }
            - { call: "POST /hydrants", payload: { hydrant_number: "H-4", program_id: "${prog_id}", zone_id: "${zone_id}", ownership: "PRIVATE", private_owner_id: "${owner_id}", required_fire_flow_gpm: 1000 }, as: ProgramAdmin, captures: { h4_id: $.data.id } }
            - { call: "POST /flow-tests", payload: { hydrant_id: "${h1_id}", window_start: "2026-08-02T10:00:00Z", window_end: "2026-08-02T11:00:00Z" }, as: FieldOperator, as_user_id: "op_1", captures: { ft1_id: $.data.id } }
            - { call: "POST /flow-tests", payload: { hydrant_id: "${h2_id}", window_start: "2026-08-02T10:00:00Z", window_end: "2026-08-02T11:00:00Z" }, as: FieldOperator, as_user_id: "op_1", captures: { ft2_id: $.data.id } }
            - { call: "POST /flow-tests", payload: { hydrant_id: "${h4_id}", window_start: "2026-08-02T10:00:00Z", window_end: "2026-08-02T11:00:00Z" }, as: FieldOperator, as_user_id: "op_1", captures: { ft4_id: $.data.id } }
            - { call: "POST /_clock/set_current_utc", payload: { to_iso8601: "2026-08-02T10:30:00Z" }, as: ProgramAdmin }
            - { call: "POST /flow-tests/${ft1_id}/results", payload: { static_psi: 80, residual_psi: 40, pitot_psi: 64 }, as: FieldOperator, as_user_id: "op_1" }
            - { call: "POST /flow-tests/${ft2_id}/results", payload: { static_psi: 80, residual_psi: 40, pitot_psi: 64 }, as: FieldOperator, as_user_id: "op_1" }
            - { call: "POST /flow-tests/${ft4_id}/results", payload: { static_psi: 80, residual_psi: 40, pitot_psi: 64 }, as: FieldOperator, as_user_id: "op_1" }
            - { call: "POST /flow-tests/${ft1_id}/review", payload: { decision: "APPROVE" }, as: UtilitySupervisor, as_user_id: "sup_1" }
            - { call: "POST /flow-tests/${ft2_id}/review", payload: { decision: "APPROVE" }, as: UtilitySupervisor, as_user_id: "sup_1" }
            - { call: "POST /flow-tests/${ft4_id}/review", payload: { decision: "APPROVE" }, as: UtilitySupervisor, as_user_id: "sup_1" }
            - { call: "GET /hydrants/${h1_id}", as: FieldOperator, as_user_id: "op_1", captures: { h1_v: $.data.version } }
            - { call: "POST /inspections", payload: { hydrant_id: "${h1_id}", scheduled_date: "2026-07-15T00:00:00Z", expected_hydrant_version: "${h1_v}" }, as: FieldOperator, as_user_id: "op_1", captures: { in1_id: $.data.id } }
            - { call: "POST /inspections/${in1_id}/record", payload: { performed_date: "2026-07-15T00:00:00Z", defects_found: false }, as: FieldOperator, as_user_id: "op_1" }
            - { call: "POST /inspections/${in1_id}/verify", payload: { decision: "VERIFY" }, as: UtilitySupervisor, as_user_id: "sup_1" }
            - { call: "GET /hydrants/${h4_id}", as: FieldOperator, as_user_id: "op_1", captures: { h4_v: $.data.version } }
            - { call: "POST /inspections", payload: { hydrant_id: "${h4_id}", scheduled_date: "2026-07-15T00:00:00Z", expected_hydrant_version: "${h4_v}" }, as: FieldOperator, as_user_id: "op_1", captures: { in4_id: $.data.id } }
            - { call: "POST /inspections/${in4_id}/record", payload: { performed_date: "2026-07-15T00:00:00Z", defects_found: false }, as: PrivateOwnerRep, as_user_id: "${owner_id}" }
            - { call: "POST /inspections/${in4_id}/verify", payload: { decision: "VERIFY" }, as: UtilitySupervisor, as_user_id: "sup_1" }
          trigger:
            - { call: "POST /programs/${prog_id}/iso-snapshots", payload: { weighting_profile: "MUNICIPAL_ONLY" }, as: ProgramAdmin, captures: { snap_a_id: $.data.id } }
            - { call: "POST /iso-snapshots/${snap_a_id}/publish", as: ProgramAdmin }
            - { call: "POST /programs/${prog_id}/iso-snapshots", payload: { weighting_profile: "ALL_HYDRANTS_HALF_PRIVATE" }, as: ProgramAdmin, captures: { snap_b_id: $.data.id } }
            - { call: "POST /iso-snapshots/${snap_b_id}/publish", as: ProgramAdmin }
            - { call: "GET /iso-snapshots/${snap_a_id}", as: ProgramAdmin }
          assert:
            - "ISOSnapshot.${snap_a_id}.iso_points == 53.3 (municipal-only: flow 2/3, inspection 1/3)"
            - "ISOSnapshot.${snap_a_id}.total_hydrants_in_scope == 3 and status == SUPERSEDED after second publish"
            - "ISOSnapshot.${snap_b_id}.iso_points == 60.0 (half-private: flow 2.5/3.5, inspection 1.5/3.5)"
            - "ISOSnapshot.${snap_b_id}.total_hydrants_in_scope == 3.5 and status == PUBLISHED"

      - name: work_order_quoted_vs_actual_price_drift
        grounds:
          - calculations.work_order_total
          - entities.RepairWorkOrder.fields.quoted_total_cents
          - entities.RepairWorkOrder.fields.actual_total_cents
        distinguishing_aspect: |
          Identical part quantities price differently under the quoted variant
          (approve-time price snapshot, 26200 cents) and the actual variant
          (completion-time current price after a restock price change, 26600
          cents) — a dual-variant split on the RepairWorkOrder entity domain.
        test_recipe:
          setup:
            - "Program, zone, hydrant H; Part P price 6500 cents, on_hand 100"
            - "Work order W (uncapped) with one line: P x 4; submitted and approved (quoted at price 6500)"
            - "Between approve and complete, P restocked with new_unit_price_cents 7000"
          setup_api_calls:
            - { call: "POST /programs", payload: { program_year: 2026, season: "SPRING" }, as: ProgramAdmin, captures: { prog_id: $.data.id } }
            - { call: "POST /zones", payload: { name: "Z-North" }, as: ProgramAdmin, captures: { zone_id: $.data.id } }
            - { call: "POST /hydrants", payload: { hydrant_number: "H-100", program_id: "${prog_id}", zone_id: "${zone_id}", ownership: "MUNICIPAL", required_fire_flow_gpm: 1000 }, as: ProgramAdmin, captures: { h_id: $.data.id } }
            - { call: "POST /parts", payload: { sku: "GASKET-6", name: "6in gasket", unit_price_cents: 6500, on_hand_qty: 100 }, as: ProgramAdmin, captures: { part_id: $.data.id } }
            - { call: "POST /work-orders", payload: { hydrant_id: "${h_id}", description: "Replace gaskets" }, as: FieldOperator, as_user_id: "op_1", captures: { wo_id: $.data.id } }
            - { call: "POST /work-orders/${wo_id}/part-lines", payload: { part_id: "${part_id}", qty: 4 }, as: FieldOperator, as_user_id: "op_1" }
            - { call: "POST /work-orders/${wo_id}/submit", as: FieldOperator, as_user_id: "op_1" }
            - { call: "GET /work-orders/${wo_id}", as: UtilitySupervisor, as_user_id: "sup_1", captures: { wo_v: $.data.version } }
            - { call: "POST /work-orders/${wo_id}/approve", payload: { expected_work_order_version: "${wo_v}" }, as: UtilitySupervisor, as_user_id: "sup_1" }
            - { call: "POST /parts/${part_id}/restock", payload: { add_qty: 10, new_unit_price_cents: 7000 }, as: ProgramAdmin }
          trigger:
            - { call: "POST /work-orders/${wo_id}/complete", as: FieldOperator, as_user_id: "op_1" }
            - { call: "GET /parts/${part_id}", as: ProgramAdmin }
          assert:
            - "RepairWorkOrder.${wo_id}.quoted_total_cents == 26200 (subtotal 26000, 5% discount 1300, fee 1500 at price 6500)"
            - "RepairWorkOrder.${wo_id}.actual_total_cents == 26600 (subtotal 28000, 5% discount 1400, no fee at price 7000)"
            - "Part.${part_id}.on_hand_qty == 106 and available_qty == 106 after consumption and restock"

  # ---------------------------------------------------------------- rule 2 ---
  - rule_id: combinatorial_formula
    instances:
      - name: flow_at_20psi_three_input_exponent
        grounds:
          - calculations.pitot_flow
          - calculations.flow_at_20psi
          - entities.FlowTest.fields.flow_at_20psi_gpm
        distinguishing_aspect: |
          Mode (a): a 3-input non-linear formula (pitot flow through a square
          and a square root, then pressure-ratio exponentiation 0.54) whose
          result 1671 gpm cannot be reproduced by any linear decomposition of
          static 80 / residual 40 / pitot 64.
        test_recipe:
          setup:
            - "Program, zone, hydrant H with default outlet constants (diameter 2.5, coefficient 0.9), required_fire_flow_gpm 1671"
            - "FlowTest FT window 2026-08-02T10:00-11:00Z; clock inside window"
          setup_api_calls:
            - { call: "POST /programs", payload: { program_year: 2026, season: "SPRING" }, as: ProgramAdmin, captures: { prog_id: $.data.id } }
            - { call: "POST /zones", payload: { name: "Z-North" }, as: ProgramAdmin, captures: { zone_id: $.data.id } }
            - { call: "POST /hydrants", payload: { hydrant_number: "H-100", program_id: "${prog_id}", zone_id: "${zone_id}", ownership: "MUNICIPAL", required_fire_flow_gpm: 1671 }, as: ProgramAdmin, captures: { h_id: $.data.id } }
            - { call: "POST /flow-tests", payload: { hydrant_id: "${h_id}", window_start: "2026-08-02T10:00:00Z", window_end: "2026-08-02T11:00:00Z" }, as: FieldOperator, as_user_id: "op_1", captures: { ft_id: $.data.id } }
            - { call: "POST /_clock/set_current_utc", payload: { to_iso8601: "2026-08-02T10:30:00Z" }, as: ProgramAdmin }
          trigger:
            - { call: "POST /flow-tests/${ft_id}/results", payload: { static_psi: 80, residual_psi: 40, pitot_psi: 64 }, as: FieldOperator, as_user_id: "op_1" }
          assert:
            - "FlowTest.${ft_id}.pitot_flow_gpm == 1342.35"
            - "FlowTest.${ft_id}.flow_at_20psi_gpm == 1671 (round_half_up of 1670.917...)"
            - "FlowTest.${ft_id}.classification == PASS (1671 >= required 1671)"

      - name: flush_volume_per_step_rounding
        grounds:
          - calculations.flush_volume_total
          - calculations.dechlorination_tablets
          - entities.FlushSequence.fields.total_flushed_gallons
        distinguishing_aspect: |
          Mode (b): rounding order is pinned — per-step round_half_up then sum
          yields 3305 gallons, while the forbidden sum-then-round order yields
          3304; the tablet count (3) chains off the per-step-rounded total.
        test_recipe:
          setup:
            - "Program, zone (default cooldown), hydrant H; sequence S with two steps, IN_PROGRESS, source residual 2.0 mg/L"
            - "Step 1 executed at 250.5 gpm for 7 minutes; step 2 executed at 310.12 gpm for 5 minutes"
          setup_api_calls:
            - { call: "POST /programs", payload: { program_year: 2026, season: "SPRING" }, as: ProgramAdmin, captures: { prog_id: $.data.id } }
            - { call: "POST /zones", payload: { name: "Z-North" }, as: ProgramAdmin, captures: { zone_id: $.data.id } }
            - { call: "POST /hydrants", payload: { hydrant_number: "H-100", program_id: "${prog_id}", zone_id: "${zone_id}", ownership: "MUNICIPAL", required_fire_flow_gpm: 1000 }, as: ProgramAdmin, captures: { h_id: $.data.id } }
            - { call: "POST /flush-sequences", payload: { program_id: "${prog_id}", zone_id: "${zone_id}", hydrant_id: "${h_id}", window_start: "2026-08-03T10:00:00Z", window_end: "2026-08-03T12:00:00Z", steps: [{ step_index: 1, valve_tag: "V-A", action: "OPEN" }, { step_index: 2, valve_tag: "V-B", action: "CLOSE" }] }, as: FieldOperator, as_user_id: "op_1", captures: { seq_id: $.data.id } }
            - { call: "POST /flush-sequences/${seq_id}/start", payload: { source_chlorine_residual_mg_L: 2.0 }, as: FieldOperator, as_user_id: "op_1" }
            - { call: "POST /flush-sequences/${seq_id}/execute-step", payload: { step_index: 1, flow_gpm: 250.5, duration_minutes: 7 }, as: FieldOperator, as_user_id: "op_1" }
            - { call: "POST /flush-sequences/${seq_id}/execute-step", payload: { step_index: 2, flow_gpm: 310.12, duration_minutes: 5 }, as: FieldOperator, as_user_id: "op_1" }
          trigger:
            - { call: "POST /flush-sequences/${seq_id}/complete", payload: { final_discharge_residual_mg_L: 0.05 }, as: FieldOperator, as_user_id: "op_1" }
          assert:
            - "FlushSequence.${seq_id}.total_flushed_gallons == 3305 (1754 + 1551 per-step rounded; sum-then-round would give 3304)"
            - "FlushSequence.${seq_id}.dechlorination_tablets_required == 3 (ceil(3305 * 3.785 * 2.0 / 8500))"
            - "FlushSequence.${seq_id}.status == COMPLETED"

      - name: work_order_total_evaluation_order
        grounds:
          - calculations.work_order_total
          - entities.RepairWorkOrder.fields.quoted_fee_cents
        distinguishing_aspect: |
          Mode (c): the fee tier is keyed on the post-discount total while the
          discount tier is keyed on the pre-discount subtotal — pinned order
          resolves the circular-looking dependency; subtotal 26316 yields
          discounted exactly 25000, which is NOT < 25000, so fee is 0.
        test_recipe:
          setup:
            - "Program, zone, hydrant H; Part P price 13158 cents, on_hand 10"
            - "Work order W (uncapped) with one line: P x 2; submitted"
          setup_api_calls:
            - { call: "POST /programs", payload: { program_year: 2026, season: "SPRING" }, as: ProgramAdmin, captures: { prog_id: $.data.id } }
            - { call: "POST /zones", payload: { name: "Z-North" }, as: ProgramAdmin, captures: { zone_id: $.data.id } }
            - { call: "POST /hydrants", payload: { hydrant_number: "H-100", program_id: "${prog_id}", zone_id: "${zone_id}", ownership: "MUNICIPAL", required_fire_flow_gpm: 1000 }, as: ProgramAdmin, captures: { h_id: $.data.id } }
            - { call: "POST /parts", payload: { sku: "VALVE-6", name: "6in gate valve", unit_price_cents: 13158, on_hand_qty: 10 }, as: ProgramAdmin, captures: { part_id: $.data.id } }
            - { call: "POST /work-orders", payload: { hydrant_id: "${h_id}", description: "Valve replacement" }, as: FieldOperator, as_user_id: "op_1", captures: { wo_id: $.data.id } }
            - { call: "POST /work-orders/${wo_id}/part-lines", payload: { part_id: "${part_id}", qty: 2 }, as: FieldOperator, as_user_id: "op_1" }
            - { call: "POST /work-orders/${wo_id}/submit", as: FieldOperator, as_user_id: "op_1" }
            - { call: "GET /work-orders/${wo_id}", as: UtilitySupervisor, as_user_id: "sup_1", captures: { wo_v: $.data.version } }
          trigger:
            - { call: "POST /work-orders/${wo_id}/approve", payload: { expected_work_order_version: "${wo_v}" }, as: UtilitySupervisor, as_user_id: "sup_1" }
          assert:
            - "RepairWorkOrder.${wo_id}.quoted_subtotal_cents == 26316"
            - "RepairWorkOrder.${wo_id}.quoted_discount_cents == 1316 (5% tier, subtotal >= 20000)"
            - "RepairWorkOrder.${wo_id}.quoted_fee_cents == 0 (discounted == 25000 is not strictly < 25000)"
            - "RepairWorkOrder.${wo_id}.quoted_total_cents == 25000"

  # ---------------------------------------------------------------- rule 3 ---
  - rule_id: non_linear_state_machine
    instances:
      - name: hydrant_service_cycle_in_out
        grounds:
          - state_machines.Hydrant.IN_SERVICE_to_OUT_OF_SERVICE
          - state_machines.Hydrant.OUT_OF_SERVICE_to_IN_SERVICE
          - state_machines.HydrantOutage.ACTIVE_to_CLOSED
        distinguishing_aspect: |
          Cyclic shape on Hydrant: IN_SERVICE -> OUT_OF_SERVICE -> IN_SERVICE
          via outage create then close; the cycle is re-enterable and each pass
          rewires active_outage_id.
        test_recipe:
          setup:
            - "Program OPEN, zone, hydrant H IN_SERVICE"
          setup_api_calls:
            - { call: "POST /programs", payload: { program_year: 2026, season: "SPRING" }, as: ProgramAdmin, captures: { prog_id: $.data.id } }
            - { call: "POST /zones", payload: { name: "Z-North" }, as: ProgramAdmin, captures: { zone_id: $.data.id } }
            - { call: "POST /hydrants", payload: { hydrant_number: "H-100", program_id: "${prog_id}", zone_id: "${zone_id}", ownership: "MUNICIPAL", required_fire_flow_gpm: 1000 }, as: ProgramAdmin, captures: { h_id: $.data.id } }
            - { call: "POST /outages", payload: { hydrant_id: "${h_id}", reason: "LEAK" }, as: FieldOperator, as_user_id: "op_1", captures: { out_id: $.data.id } }
            - { call: "POST /outages/${out_id}/acknowledge-notification", as: FireDeptLiaison, as_user_id: "fd_1" }
          trigger:
            - { call: "POST /outages/${out_id}/close", as: FieldOperator, as_user_id: "op_1" }
            - { call: "GET /hydrants/${h_id}", as: FieldOperator, as_user_id: "op_1" }
          assert:
            - "Hydrant.${h_id}.status == IN_SERVICE after completing the cycle"
            - "Hydrant.${h_id}.active_outage_id is null"
            - "HydrantOutage.${out_id}.status == CLOSED and closed_at is set"

      - name: work_order_reject_revision_loop
        grounds:
          - state_machines.RepairWorkOrder.SUBMITTED_to_DRAFT
          - state_machines.RepairWorkOrder.DRAFT_to_SUBMITTED
          - state_machines.RepairWorkOrder.SUBMITTED_to_APPROVED
        distinguishing_aspect: |
          Cyclic shape on RepairWorkOrder (different entity than Hydrant):
          SUBMITTED -> DRAFT on reject re-opens part-line editing, and the
          revised order re-enters SUBMITTED and reaches APPROVED.
        test_recipe:
          setup:
            - "Program, zone, hydrant H; Part P price 6500, on_hand 100"
            - "Work order W with one line P x 2, submitted"
          setup_api_calls:
            - { call: "POST /programs", payload: { program_year: 2026, season: "SPRING" }, as: ProgramAdmin, captures: { prog_id: $.data.id } }
            - { call: "POST /zones", payload: { name: "Z-North" }, as: ProgramAdmin, captures: { zone_id: $.data.id } }
            - { call: "POST /hydrants", payload: { hydrant_number: "H-100", program_id: "${prog_id}", zone_id: "${zone_id}", ownership: "MUNICIPAL", required_fire_flow_gpm: 1000 }, as: ProgramAdmin, captures: { h_id: $.data.id } }
            - { call: "POST /parts", payload: { sku: "GASKET-6", name: "6in gasket", unit_price_cents: 6500, on_hand_qty: 100 }, as: ProgramAdmin, captures: { part_id: $.data.id } }
            - { call: "POST /work-orders", payload: { hydrant_id: "${h_id}", description: "Replace gaskets" }, as: FieldOperator, as_user_id: "op_1", captures: { wo_id: $.data.id } }
            - { call: "POST /work-orders/${wo_id}/part-lines", payload: { part_id: "${part_id}", qty: 2 }, as: FieldOperator, as_user_id: "op_1" }
            - { call: "POST /work-orders/${wo_id}/submit", as: FieldOperator, as_user_id: "op_1" }
            - { call: "POST /work-orders/${wo_id}/reject", payload: { rejection_reason: "scope incomplete" }, as: UtilitySupervisor, as_user_id: "sup_1" }
            - { call: "POST /work-orders/${wo_id}/part-lines", payload: { part_id: "${part_id}", qty: 1 }, as: FieldOperator, as_user_id: "op_1" }
            - { call: "POST /work-orders/${wo_id}/submit", as: FieldOperator, as_user_id: "op_1" }
            - { call: "GET /work-orders/${wo_id}", as: UtilitySupervisor, as_user_id: "sup_1", captures: { wo_v: $.data.version } }
          trigger:
            - { call: "POST /work-orders/${wo_id}/approve", payload: { expected_work_order_version: "${wo_v}" }, as: UtilitySupervisor, as_user_id: "sup_1" }
          assert:
            - "RepairWorkOrder.${wo_id}.status == APPROVED after the DRAFT loop"
            - "RepairWorkOrder.${wo_id}.last_rejection_reason == 'scope incomplete'"
            - "RepairWorkOrder.${wo_id} has 2 part lines both in status RESERVED"

  # ---------------------------------------------------------------- rule 4 ---
  - rule_id: transitive_cascade
    instances:
      - name: outage_tag_cascade_depth3
        grounds:
          - state_machines.Hydrant.IN_SERVICE_to_OUT_OF_SERVICE
          - state_machines.HydrantOutage.ACTIVE_to_CLOSED
          - entities.FlushingProgram.fields.hydrants_out_of_service_count
          - entities.FlowTest.fields.cancel_reason
        distinguishing_aspect: |
          Depth-3 chain from POST /outages: outage creation (hop 1) flips the
          Hydrant to OUT_OF_SERVICE (hop 2), and the hydrant's status change
          itself cancels its SCHEDULED FlowTests and moves program counters
          (hop 3) — each hop is caused by the previous hop, not by the request.
        test_recipe:
          setup:
            - "Program OPEN, zone, hydrant H IN_SERVICE"
            - "FlowTest FT on H SCHEDULED with window 2026-08-04T10:00-11:00Z"
          setup_api_calls:
            - { call: "POST /programs", payload: { program_year: 2026, season: "SPRING" }, as: ProgramAdmin, captures: { prog_id: $.data.id } }
            - { call: "POST /zones", payload: { name: "Z-North" }, as: ProgramAdmin, captures: { zone_id: $.data.id } }
            - { call: "POST /hydrants", payload: { hydrant_number: "H-100", program_id: "${prog_id}", zone_id: "${zone_id}", ownership: "MUNICIPAL", required_fire_flow_gpm: 1000 }, as: ProgramAdmin, captures: { h_id: $.data.id } }
            - { call: "POST /flow-tests", payload: { hydrant_id: "${h_id}", window_start: "2026-08-04T10:00:00Z", window_end: "2026-08-04T11:00:00Z" }, as: FieldOperator, as_user_id: "op_1", captures: { ft_id: $.data.id } }
          trigger:
            - { call: "POST /outages", payload: { hydrant_id: "${h_id}", reason: "VALVE_FAILURE" }, as: FieldOperator, as_user_id: "op_1", captures: { out_id: $.data.id } }
            - { call: "GET /hydrants/${h_id}", as: FieldOperator, as_user_id: "op_1" }
            - { call: "GET /programs/${prog_id}", as: ProgramAdmin }
            - { call: "GET /flow-tests/${ft_id}", as: FieldOperator, as_user_id: "op_1" }
          assert:
            - "HydrantOutage.${out_id}.status == ACTIVE and notification_status == PENDING and notified_at == outage created_at and ack_deadline == notified_at + 2h"
            - "Hydrant.${h_id}.status == OUT_OF_SERVICE and active_outage_id == ${out_id}"
            - "FlushingProgram.${prog_id}.hydrants_out_of_service_count == 1 and unacknowledged_notification_count == 1"
            - "FlowTest.${ft_id}.status == CANCELLED and cancel_reason == OUTAGE_AUTO_CANCEL"

      - name: complaint_cluster_cascade
        grounds:
          - calculations.complaint_cluster
          - state_machines.WaterQualityComplaint.OPEN_to_LINKED
          - entities.Hydrant.fields.targeted_flush_pending
        distinguishing_aspect: |
          Depth-3 chain from a different trigger (POST /complaints): the third
          complaint's creation (hop 1) crosses the cluster threshold which
          auto-creates a COMPLAINT_AUTO FlushSequence (hop 2), whose existence
          flips each clustered complaint to LINKED and the hydrant's
          targeted_flush_pending flag (hop 3).
        test_recipe:
          setup:
            - "Program OPEN, zone, hydrant H IN_SERVICE; logical clock at default 2026-08-01T00:00:00Z"
          setup_api_calls:
            - { call: "POST /programs", payload: { program_year: 2026, season: "SPRING" }, as: ProgramAdmin, captures: { prog_id: $.data.id } }
            - { call: "POST /zones", payload: { name: "Z-North" }, as: ProgramAdmin, captures: { zone_id: $.data.id } }
            - { call: "POST /hydrants", payload: { hydrant_number: "H-100", program_id: "${prog_id}", zone_id: "${zone_id}", ownership: "MUNICIPAL", required_fire_flow_gpm: 1000 }, as: ProgramAdmin, captures: { h_id: $.data.id } }
            - { call: "POST /complaints", payload: { hydrant_id: "${h_id}", category: "DISCOLORED_WATER" }, as: FieldOperator, as_user_id: "op_1", captures: { c1_id: $.data.id } }
            - { call: "POST /complaints", payload: { hydrant_id: "${h_id}", category: "DISCOLORED_WATER" }, as: FieldOperator, as_user_id: "op_1", captures: { c2_id: $.data.id } }
          trigger:
            - { call: "POST /complaints", payload: { hydrant_id: "${h_id}", category: "DISCOLORED_WATER" }, as: FieldOperator, as_user_id: "op_1", captures: { c3_id: $.data.id, auto_seq_id: $.data.flush_sequence_id } }
            - { call: "GET /hydrants/${h_id}", as: FieldOperator, as_user_id: "op_1" }
          assert:
            - "WaterQualityComplaint.${c1_id}.status == LINKED, .${c2_id}.status == LINKED, .${c3_id}.status == LINKED"
            - "FlushSequence.${auto_seq_id}.origin == COMPLAINT_AUTO and status == PLANNED"
            - "FlushSequence.${auto_seq_id}.window_start == 2026-08-02T00:00:00Z and window_end == 2026-08-02T04:00:00Z"
            - "Hydrant.${h_id}.targeted_flush_pending == true"

  # ---------------------------------------------------------------- rule 5 ---
  - rule_id: priority_pair_validation_conflict
    instances:
      - name: approve_state_before_fiscal
        grounds:
          - validations[priority=8]
          - validations[priority=13]
          - errors[ERR_WORK_ORDER_NOT_SUBMITTED]
          - errors[ERR_WORK_ORDER_BUDGET_EXCEEDED]
        distinguishing_aspect: |
          Error-category pair state vs business_fiscal: approving a DRAFT work
          order whose quoted total (25000) would also exceed its budget cap
          (10000) returns the state error ERR_WORK_ORDER_NOT_SUBMITTED, not the
          fiscal ERR_WORK_ORDER_BUDGET_EXCEEDED.
        test_recipe:
          setup:
            - "Program, zone, hydrant H; Part P price 13158 on_hand 10"
            - "Work order W (budget_cap_cents 10000) with line P x 2, left in DRAFT (never submitted)"
          setup_api_calls:
            - { call: "POST /programs", payload: { program_year: 2026, season: "SPRING" }, as: ProgramAdmin, captures: { prog_id: $.data.id } }
            - { call: "POST /zones", payload: { name: "Z-North" }, as: ProgramAdmin, captures: { zone_id: $.data.id } }
            - { call: "POST /hydrants", payload: { hydrant_number: "H-100", program_id: "${prog_id}", zone_id: "${zone_id}", ownership: "MUNICIPAL", required_fire_flow_gpm: 1000 }, as: ProgramAdmin, captures: { h_id: $.data.id } }
            - { call: "POST /parts", payload: { sku: "VALVE-6", name: "6in gate valve", unit_price_cents: 13158, on_hand_qty: 10 }, as: ProgramAdmin, captures: { part_id: $.data.id } }
            - { call: "POST /work-orders", payload: { hydrant_id: "${h_id}", description: "Valve replacement", budget_cap_cents: 10000 }, as: FieldOperator, as_user_id: "op_1", captures: { wo_id: $.data.id } }
            - { call: "POST /work-orders/${wo_id}/part-lines", payload: { part_id: "${part_id}", qty: 2 }, as: FieldOperator, as_user_id: "op_1" }
            - { call: "GET /work-orders/${wo_id}", as: UtilitySupervisor, as_user_id: "sup_1", captures: { wo_v: $.data.version } }
          trigger:
            - { call: "POST /work-orders/${wo_id}/approve", payload: { expected_work_order_version: "${wo_v}" }, as: UtilitySupervisor, as_user_id: "sup_1", captures: { err: $.data.error_id } }
          assert:
            - "error_id == ERR_WORK_ORDER_NOT_SUBMITTED with http 409 (state priority 8 beats fiscal priority 13)"
            - "RepairWorkOrder.${wo_id}.status remains DRAFT and no part line leaves PENDING"

      - name: complete_safety_before_constraint
        grounds:
          - validations[priority=9]
          - validations[priority=10]
          - errors[ERR_DECHLORINATION_LIMIT_EXCEEDED]
          - errors[ERR_STEPS_INCOMPLETE]
        distinguishing_aspect: |
          Error-category pair business_safety vs business_constraint (different
          pair than state-vs-fiscal): completing a sequence with BOTH an
          over-limit discharge residual and unexecuted steps returns the safety
          error ERR_DECHLORINATION_LIMIT_EXCEEDED, not ERR_STEPS_INCOMPLETE.
        test_recipe:
          setup:
            - "Program, zone, hydrant H; sequence S IN_PROGRESS with 2 steps, only step 1 executed"
          setup_api_calls:
            - { call: "POST /programs", payload: { program_year: 2026, season: "SPRING" }, as: ProgramAdmin, captures: { prog_id: $.data.id } }
            - { call: "POST /zones", payload: { name: "Z-North" }, as: ProgramAdmin, captures: { zone_id: $.data.id } }
            - { call: "POST /hydrants", payload: { hydrant_number: "H-100", program_id: "${prog_id}", zone_id: "${zone_id}", ownership: "MUNICIPAL", required_fire_flow_gpm: 1000 }, as: ProgramAdmin, captures: { h_id: $.data.id } }
            - { call: "POST /flush-sequences", payload: { program_id: "${prog_id}", zone_id: "${zone_id}", hydrant_id: "${h_id}", window_start: "2026-08-03T10:00:00Z", window_end: "2026-08-03T12:00:00Z", steps: [{ step_index: 1, valve_tag: "V-A", action: "OPEN" }, { step_index: 2, valve_tag: "V-B", action: "CLOSE" }] }, as: FieldOperator, as_user_id: "op_1", captures: { seq_id: $.data.id } }
            - { call: "POST /flush-sequences/${seq_id}/start", payload: { source_chlorine_residual_mg_L: 2.0 }, as: FieldOperator, as_user_id: "op_1" }
            - { call: "POST /flush-sequences/${seq_id}/execute-step", payload: { step_index: 1, flow_gpm: 500, duration_minutes: 10 }, as: FieldOperator, as_user_id: "op_1" }
          trigger:
            - { call: "POST /flush-sequences/${seq_id}/complete", payload: { final_discharge_residual_mg_L: 0.5 }, as: FieldOperator, as_user_id: "op_1", captures: { err: $.data.error_id } }
          assert:
            - "error_id == ERR_DECHLORINATION_LIMIT_EXCEEDED with http 422 (safety priority 9 beats constraint priority 10)"
            - "FlushSequence.${seq_id}.status remains IN_PROGRESS and total_flushed_gallons remains null"

  # ---------------------------------------------------------------- rule 6 ---
  - rule_id: boundary_precision_check
    instances:
      - name: flow_pass_exact_threshold_boundary
        grounds:
          - calculations.flow_at_20psi
          - entities.FlowTest.fields.classification
          - entities.Hydrant.fields.required_fire_flow_gpm
        distinguishing_aspect: |
          Boundary on the fire-flow metric via POST /flow-tests/{id}/results:
          flow_at_20psi_gpm exactly equal to required_fire_flow_gpm (1671) is
          PASS (>=), while required 1672 on identical readings is FAIL.
        test_recipe:
          setup:
            - "Program, zone; hydrant HA required 1671; hydrant HB required 1672"
            - "Identical tests and readings (static 80, residual 40, pitot 64) on both; clock inside both windows"
          setup_api_calls:
            - { call: "POST /programs", payload: { program_year: 2026, season: "SPRING" }, as: ProgramAdmin, captures: { prog_id: $.data.id } }
            - { call: "POST /zones", payload: { name: "Z-North" }, as: ProgramAdmin, captures: { zone_id: $.data.id } }
            - { call: "POST /hydrants", payload: { hydrant_number: "H-A", program_id: "${prog_id}", zone_id: "${zone_id}", ownership: "MUNICIPAL", required_fire_flow_gpm: 1671 }, as: ProgramAdmin, captures: { ha_id: $.data.id } }
            - { call: "POST /hydrants", payload: { hydrant_number: "H-B", program_id: "${prog_id}", zone_id: "${zone_id}", ownership: "MUNICIPAL", required_fire_flow_gpm: 1672 }, as: ProgramAdmin, captures: { hb_id: $.data.id } }
            - { call: "POST /flow-tests", payload: { hydrant_id: "${ha_id}", window_start: "2026-08-02T10:00:00Z", window_end: "2026-08-02T11:00:00Z" }, as: FieldOperator, as_user_id: "op_1", captures: { fta_id: $.data.id } }
            - { call: "POST /flow-tests", payload: { hydrant_id: "${hb_id}", window_start: "2026-08-02T10:00:00Z", window_end: "2026-08-02T11:00:00Z" }, as: FieldOperator, as_user_id: "op_1", captures: { ftb_id: $.data.id } }
            - { call: "POST /_clock/set_current_utc", payload: { to_iso8601: "2026-08-02T10:30:00Z" }, as: ProgramAdmin }
          trigger:
            - { call: "POST /flow-tests/${fta_id}/results", payload: { static_psi: 80, residual_psi: 40, pitot_psi: 64 }, as: FieldOperator, as_user_id: "op_1" }
            - { call: "POST /flow-tests/${ftb_id}/results", payload: { static_psi: 80, residual_psi: 40, pitot_psi: 64 }, as: FieldOperator, as_user_id: "op_1" }
          assert:
            - "FlowTest.${fta_id}.flow_at_20psi_gpm == 1671 and classification == PASS (equality satisfies >=)"
            - "FlowTest.${ftb_id}.flow_at_20psi_gpm == 1671 and classification == FAIL (1671 < 1672)"

      - name: complaint_cluster_exactly_three_triggers
        grounds:
          - calculations.complaint_cluster
          - entities.WaterQualityComplaint.fields.status
        distinguishing_aspect: |
          Boundary on a count metric via a different endpoint (POST /complaints):
          the 2nd qualifying complaint leaves the system untouched while the
          3rd (count reaching exactly 3, the >= threshold) fires auto-creation.
        test_recipe:
          setup:
            - "Program OPEN, zone, hydrant H IN_SERVICE; clock at default 2026-08-01T00:00:00Z"
          setup_api_calls:
            - { call: "POST /programs", payload: { program_year: 2026, season: "SPRING" }, as: ProgramAdmin, captures: { prog_id: $.data.id } }
            - { call: "POST /zones", payload: { name: "Z-North" }, as: ProgramAdmin, captures: { zone_id: $.data.id } }
            - { call: "POST /hydrants", payload: { hydrant_number: "H-100", program_id: "${prog_id}", zone_id: "${zone_id}", ownership: "MUNICIPAL", required_fire_flow_gpm: 1000 }, as: ProgramAdmin, captures: { h_id: $.data.id } }
            - { call: "POST /complaints", payload: { hydrant_id: "${h_id}", category: "DISCOLORED_WATER" }, as: FieldOperator, as_user_id: "op_1", captures: { c1_id: $.data.id } }
          trigger:
            - { call: "POST /complaints", payload: { hydrant_id: "${h_id}", category: "DISCOLORED_WATER" }, as: FieldOperator, as_user_id: "op_1", captures: { c2_id: $.data.id } }
            - { call: "GET /flush-sequences", payload: { hydrant_id: "${h_id}" }, as: FieldOperator, as_user_id: "op_1" }
            - { call: "POST /complaints", payload: { hydrant_id: "${h_id}", category: "DISCOLORED_WATER" }, as: FieldOperator, as_user_id: "op_1", captures: { c3_id: $.data.id } }
            - { call: "GET /flush-sequences", payload: { hydrant_id: "${h_id}" }, as: FieldOperator, as_user_id: "op_1" }
          assert:
            - "After complaint 2: WaterQualityComplaint.${c2_id}.status == OPEN and the hydrant's flush-sequence list is empty"
            - "After complaint 3: the hydrant's flush-sequence list has exactly 1 entry with origin == COMPLAINT_AUTO and status == PLANNED"
            - "WaterQualityComplaint.${c3_id}.status == LINKED"

  # ---------------------------------------------------------------- rule 7 ---
  - rule_id: cross_entity_state_dependency
    instances:
      - name: flow_test_requires_hydrant_in_service
        grounds:
          - state_machines.FlowTest.transitions
          - entities.FlowTest.fields.hydrant_id
          - errors[ERR_HYDRANT_NOT_IN_SERVICE]
        distinguishing_aspect: |
          Entity pair FlowTest -> Hydrant: scheduling a flow test is gated on
          the referenced hydrant being IN_SERVICE; an OUT_OF_SERVICE hydrant
          rejects the create with ERR_HYDRANT_NOT_IN_SERVICE.
        test_recipe:
          setup:
            - "Program OPEN, zone, hydrant H forced OUT_OF_SERVICE by an outage"
          setup_api_calls:
            - { call: "POST /programs", payload: { program_year: 2026, season: "SPRING" }, as: ProgramAdmin, captures: { prog_id: $.data.id } }
            - { call: "POST /zones", payload: { name: "Z-North" }, as: ProgramAdmin, captures: { zone_id: $.data.id } }
            - { call: "POST /hydrants", payload: { hydrant_number: "H-100", program_id: "${prog_id}", zone_id: "${zone_id}", ownership: "MUNICIPAL", required_fire_flow_gpm: 1000 }, as: ProgramAdmin, captures: { h_id: $.data.id } }
            - { call: "POST /outages", payload: { hydrant_id: "${h_id}", reason: "DAMAGE" }, as: FieldOperator, as_user_id: "op_1" }
          trigger:
            - { call: "POST /flow-tests", payload: { hydrant_id: "${h_id}", window_start: "2026-08-05T10:00:00Z", window_end: "2026-08-05T11:00:00Z" }, as: FieldOperator, as_user_id: "op_1", captures: { err: $.data.error_id } }
          assert:
            - "error_id == ERR_HYDRANT_NOT_IN_SERVICE with http 409"
            - "No FlowTest exists for Hydrant.${h_id}"

      - name: outage_close_blocked_by_open_work_order
        grounds:
          - state_machines.HydrantOutage.ACTIVE_to_CLOSED
          - entities.RepairWorkOrder.fields.hydrant_id
          - errors[ERR_OPEN_WORK_ORDERS_EXIST]
        distinguishing_aspect: |
          Entity pair HydrantOutage -> RepairWorkOrder (different pair than
          FlowTest -> Hydrant): closing an outage is gated on the absence of
          DRAFT/SUBMITTED/APPROVED work orders for the hydrant; cancelling the
          work order unblocks the close.
        test_recipe:
          setup:
            - "Program OPEN, zone, hydrant H OUT_OF_SERVICE with notification ACKNOWLEDGED"
            - "RepairWorkOrder W for H in DRAFT"
          setup_api_calls:
            - { call: "POST /programs", payload: { program_year: 2026, season: "SPRING" }, as: ProgramAdmin, captures: { prog_id: $.data.id } }
            - { call: "POST /zones", payload: { name: "Z-North" }, as: ProgramAdmin, captures: { zone_id: $.data.id } }
            - { call: "POST /hydrants", payload: { hydrant_number: "H-100", program_id: "${prog_id}", zone_id: "${zone_id}", ownership: "MUNICIPAL", required_fire_flow_gpm: 1000 }, as: ProgramAdmin, captures: { h_id: $.data.id } }
            - { call: "POST /outages", payload: { hydrant_id: "${h_id}", reason: "LEAK" }, as: FieldOperator, as_user_id: "op_1", captures: { out_id: $.data.id } }
            - { call: "POST /outages/${out_id}/acknowledge-notification", as: FireDeptLiaison, as_user_id: "fd_1" }
            - { call: "POST /work-orders", payload: { hydrant_id: "${h_id}", description: "Fix leak" }, as: FieldOperator, as_user_id: "op_1", captures: { wo_id: $.data.id } }
          trigger:
            - { call: "POST /outages/${out_id}/close", as: FieldOperator, as_user_id: "op_1", captures: { err: $.data.error_id } }
            - { call: "POST /work-orders/${wo_id}/cancel", as: FieldOperator, as_user_id: "op_1" }
            - { call: "POST /outages/${out_id}/close", as: FieldOperator, as_user_id: "op_1" }
          assert:
            - "First close: error_id == ERR_OPEN_WORK_ORDERS_EXIST with http 409 and outage remains ACTIVE"
            - "After work-order cancel: close succeeds, outage CLOSED, Hydrant.${h_id}.status == IN_SERVICE"

  # ---------------------------------------------------------------- rule 8 ---
  - rule_id: resource_temporal_overlap
    instances:
      - name: flow_test_half_open_window_adjacency
        grounds:
          - validations[priority=11]
          - entities.FlowTest.fields.window_start
          - errors[ERR_FLOW_TEST_WINDOW_OVERLAP]
        distinguishing_aspect: |
          Interval semantics: half-open [start, end) on the Hydrant resource —
          a new test starting exactly at the existing window's end is allowed,
          while one overlapping by any positive amount is rejected.
        test_recipe:
          setup:
            - "Program OPEN, zone, hydrant H IN_SERVICE; existing SCHEDULED test FT1 [2026-08-02T10:00Z, 2026-08-02T11:00Z)"
          setup_api_calls:
            - { call: "POST /programs", payload: { program_year: 2026, season: "SPRING" }, as: ProgramAdmin, captures: { prog_id: $.data.id } }
            - { call: "POST /zones", payload: { name: "Z-North" }, as: ProgramAdmin, captures: { zone_id: $.data.id } }
            - { call: "POST /hydrants", payload: { hydrant_number: "H-100", program_id: "${prog_id}", zone_id: "${zone_id}", ownership: "MUNICIPAL", required_fire_flow_gpm: 1000 }, as: ProgramAdmin, captures: { h_id: $.data.id } }
            - { call: "POST /flow-tests", payload: { hydrant_id: "${h_id}", window_start: "2026-08-02T10:00:00Z", window_end: "2026-08-02T11:00:00Z" }, as: FieldOperator, as_user_id: "op_1", captures: { ft1_id: $.data.id } }
          trigger:
            - { call: "POST /flow-tests", payload: { hydrant_id: "${h_id}", window_start: "2026-08-02T11:00:00Z", window_end: "2026-08-02T12:00:00Z" }, as: FieldOperator, as_user_id: "op_1", captures: { ft2_id: $.data.id } }
            - { call: "POST /flow-tests", payload: { hydrant_id: "${h_id}", window_start: "2026-08-02T10:30:00Z", window_end: "2026-08-02T11:30:00Z" }, as: FieldOperator, as_user_id: "op_1", captures: { err: $.data.error_id } }
          assert:
            - "Adjacent create [11:00, 12:00) succeeds: FlowTest.${ft2_id}.status == SCHEDULED"
            - "Overlapping create [10:30, 11:30) fails: error_id == ERR_FLOW_TEST_WINDOW_OVERLAP with http 409"

      - name: sequence_zone_cooldown_buffer
        grounds:
          - validations[priority=11]
          - entities.PressureZone.fields.cooldown_minutes
          - errors[ERR_SEQUENCE_ZONE_COOLDOWN]
        distinguishing_aspect: |
          Different interval semantics on a different resource (PressureZone vs
          Hydrant): flush sequences in one zone must keep a buffer of
          cooldown_minutes (60) between windows — plain adjacency (gap 0 or 30)
          violates, and a gap of exactly 60 minutes passes (>=).
        test_recipe:
          setup:
            - "Program OPEN; zone Z with cooldown_minutes 60; hydrants H1, H2, H3 all in Z"
            - "Existing PLANNED sequence S1 in Z with window [2026-08-03T10:00Z, 2026-08-03T11:00Z]"
          setup_api_calls:
            - { call: "POST /programs", payload: { program_year: 2026, season: "SPRING" }, as: ProgramAdmin, captures: { prog_id: $.data.id } }
            - { call: "POST /zones", payload: { name: "Z-North", cooldown_minutes: 60 }, as: ProgramAdmin, captures: { zone_id: $.data.id } }
            - { call: "POST /hydrants", payload: { hydrant_number: "H-1", program_id: "${prog_id}", zone_id: "${zone_id}", ownership: "MUNICIPAL", required_fire_flow_gpm: 1000 }, as: ProgramAdmin, captures: { h1_id: $.data.id } }
            - { call: "POST /hydrants", payload: { hydrant_number: "H-2", program_id: "${prog_id}", zone_id: "${zone_id}", ownership: "MUNICIPAL", required_fire_flow_gpm: 1000 }, as: ProgramAdmin, captures: { h2_id: $.data.id } }
            - { call: "POST /hydrants", payload: { hydrant_number: "H-3", program_id: "${prog_id}", zone_id: "${zone_id}", ownership: "MUNICIPAL", required_fire_flow_gpm: 1000 }, as: ProgramAdmin, captures: { h3_id: $.data.id } }
            - { call: "POST /flush-sequences", payload: { program_id: "${prog_id}", zone_id: "${zone_id}", hydrant_id: "${h1_id}", window_start: "2026-08-03T10:00:00Z", window_end: "2026-08-03T11:00:00Z", steps: [{ step_index: 1, valve_tag: "V-A", action: "OPEN" }] }, as: FieldOperator, as_user_id: "op_1", captures: { s1_id: $.data.id } }
          trigger:
            - { call: "POST /flush-sequences", payload: { program_id: "${prog_id}", zone_id: "${zone_id}", hydrant_id: "${h2_id}", window_start: "2026-08-03T11:30:00Z", window_end: "2026-08-03T12:00:00Z", steps: [{ step_index: 1, valve_tag: "V-A", action: "OPEN" }] }, as: FieldOperator, as_user_id: "op_1", captures: { err: $.data.error_id } }
            - { call: "POST /flush-sequences", payload: { program_id: "${prog_id}", zone_id: "${zone_id}", hydrant_id: "${h3_id}", window_start: "2026-08-03T12:00:00Z", window_end: "2026-08-03T13:00:00Z", steps: [{ step_index: 1, valve_tag: "V-A", action: "OPEN" }] }, as: FieldOperator, as_user_id: "op_1", captures: { s3_id: $.data.id } }
          assert:
            - "Gap 30 min < cooldown 60: error_id == ERR_SEQUENCE_ZONE_COOLDOWN with http 409"
            - "Gap exactly 60 min: FlushSequence.${s3_id}.status == PLANNED (>= satisfies the buffer)"

  # ---------------------------------------------------------------- rule 9 ---
  - rule_id: compensating_invariant
    instances:
      - name: parts_reserve_release_conserves_available
        grounds:
          - calculations.part_available_qty
          - state_machines.RepairWorkOrder.SUBMITTED_to_APPROVED
          - state_machines.RepairWorkOrder.APPROVED_to_CANCELLED
        distinguishing_aspect: |
          Conserved quantity: part availability. The approve (reserve) / cancel
          (release) pair leaves Part.available_qty identical to its pre-pair
          value per the pinned formula available = on_hand - SUM(RESERVED qty).
        test_recipe:
          setup:
            - "Program, zone, hydrant H; Part P on_hand 100 (available 100)"
            - "Work order W (uncapped) with line P x 30, submitted"
          setup_api_calls:
            - { call: "POST /programs", payload: { program_year: 2026, season: "SPRING" }, as: ProgramAdmin, captures: { prog_id: $.data.id } }
            - { call: "POST /zones", payload: { name: "Z-North" }, as: ProgramAdmin, captures: { zone_id: $.data.id } }
            - { call: "POST /hydrants", payload: { hydrant_number: "H-100", program_id: "${prog_id}", zone_id: "${zone_id}", ownership: "MUNICIPAL", required_fire_flow_gpm: 1000 }, as: ProgramAdmin, captures: { h_id: $.data.id } }
            - { call: "POST /parts", payload: { sku: "GASKET-6", name: "6in gasket", unit_price_cents: 6500, on_hand_qty: 100 }, as: ProgramAdmin, captures: { part_id: $.data.id } }
            - { call: "POST /work-orders", payload: { hydrant_id: "${h_id}", description: "Replace gaskets" }, as: FieldOperator, as_user_id: "op_1", captures: { wo_id: $.data.id } }
            - { call: "POST /work-orders/${wo_id}/part-lines", payload: { part_id: "${part_id}", qty: 30 }, as: FieldOperator, as_user_id: "op_1" }
            - { call: "POST /work-orders/${wo_id}/submit", as: FieldOperator, as_user_id: "op_1" }
            - { call: "GET /work-orders/${wo_id}", as: UtilitySupervisor, as_user_id: "sup_1", captures: { wo_v: $.data.version } }
            - { call: "POST /work-orders/${wo_id}/approve", payload: { expected_work_order_version: "${wo_v}" }, as: UtilitySupervisor, as_user_id: "sup_1" }
            - { call: "GET /parts/${part_id}", as: ProgramAdmin, captures: { avail_mid: $.data.available_qty } }
          trigger:
            - { call: "POST /work-orders/${wo_id}/cancel", as: FieldOperator, as_user_id: "op_1" }
            - { call: "GET /parts/${part_id}", as: ProgramAdmin }
          assert:
            - "After approve: Part.${part_id}.available_qty == 70 (100 - 30 RESERVED) and on_hand_qty == 100"
            - "After cancel: Part.${part_id}.available_qty == 100 == on_hand_qty (reserve/release pair conserves availability)"
            - "RepairWorkOrder.${wo_id}.status == CANCELLED and all part lines RELEASED"

      - name: outage_create_close_conserves_counts
        grounds:
          - state_machines.Hydrant.IN_SERVICE_to_OUT_OF_SERVICE
          - state_machines.Hydrant.OUT_OF_SERVICE_to_IN_SERVICE
          - entities.FlushingProgram.fields.hydrants_out_of_service_count
          - entities.FlushingProgram.fields.unacknowledged_notification_count
        distinguishing_aspect: |
          Conserved quantity of a different type (entity-state counts rather
          than material quantity): the outage create / close pair returns both
          program counters to their pre-pair values, and
          hydrants_out_of_service_count always equals the live count of the
          program's OUT_OF_SERVICE hydrants.
        test_recipe:
          setup:
            - "Program OPEN, zone, hydrant H IN_SERVICE; both program counters at 0"
          setup_api_calls:
            - { call: "POST /programs", payload: { program_year: 2026, season: "SPRING" }, as: ProgramAdmin, captures: { prog_id: $.data.id } }
            - { call: "POST /zones", payload: { name: "Z-North" }, as: ProgramAdmin, captures: { zone_id: $.data.id } }
            - { call: "POST /hydrants", payload: { hydrant_number: "H-100", program_id: "${prog_id}", zone_id: "${zone_id}", ownership: "MUNICIPAL", required_fire_flow_gpm: 1000 }, as: ProgramAdmin, captures: { h_id: $.data.id } }
            - { call: "POST /outages", payload: { hydrant_id: "${h_id}", reason: "LEAK" }, as: FieldOperator, as_user_id: "op_1", captures: { out_id: $.data.id } }
            - { call: "GET /programs/${prog_id}", as: ProgramAdmin }
          trigger:
            - { call: "POST /outages/${out_id}/acknowledge-notification", as: FireDeptLiaison, as_user_id: "fd_1" }
            - { call: "POST /outages/${out_id}/close", as: FieldOperator, as_user_id: "op_1" }
            - { call: "GET /programs/${prog_id}", as: ProgramAdmin }
          assert:
            - "After create: hydrants_out_of_service_count == 1 and unacknowledged_notification_count == 1"
            - "After acknowledge + close: both counters == 0 (pair conserves the counts)"
            - "Hydrant.${h_id}.status == IN_SERVICE and active_outage_id is null"
