  # =====================================================================
  # Rule 4: transitive cascades from DIFFERENT triggers.
  # Instance A (depth >= 3) — Dispatch /complete -> CoveredItem.last_dispatch_*
  #   -> next /dispatch is_return_visit pin -> service_fee_charged_cents pin
  #   -> final_copay reads pinned SF.
  # Instance B (depth >= 2) — Claim /resolve -> Contract.total_paid_out_cents
  #   recompute AND Contract.claims_in_period_count recompute.
  # =====================================================================
  - rule_id: transitive_cascade
    instances:

      - name: dispatch_complete_propagates_to_next_claim_final_copay
        grounds:
          - state_machines.Dispatch.IN_PROGRESS_to_COMPLETED
          - state_machines.ClaimTicket.ASSESSED_to_DISPATCHED
          - state_machines.ClaimTicket.DISPATCHED_to_RESOLVED
          - calculations.is_return_visit
          - calculations.service_fee_charged
          - calculations.final_copay
          - entities.CoveredItem.fields.last_dispatch_completed_utc
        distinguishing_aspect: |
          Cascade depth 4: (1) /dispatches/{d1}/complete updates
          CoveredItem.last_dispatch_completed_utc; (2) a subsequent
          /claims/{c2}/dispatch reads that updated field to pin
          ClaimTicket.is_return_visit = true; (3) the dispatch transition's
          side effect pins service_fee_charged_cents = 0 (vs the package's
          7500); (4) /claims/{c2}/resolve reads the pinned SF to compute
          final_copay_cents. Each link is caused by the PRIOR link, not by
          the original /complete call.
        test_recipe:
          setup:
            - "A contract with two sequential claims on the same CoveredItem; the first claim has been DISPATCHED and the linked Dispatch is in IN_PROGRESS, ready for /complete."
            - "A second claim has been filed (SUBMITTED) and ASSESSED on the same CoveredItem, awaiting /dispatch."
