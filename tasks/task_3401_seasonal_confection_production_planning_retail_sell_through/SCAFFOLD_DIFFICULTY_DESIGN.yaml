        distinguishing_aspect: "Inclusive >= boundary on the in_use_units metric via run complete: 849 units is OPEN, and adding exactly 1 more to reach floor(0.85 x 1000) == 850 flips CONGESTED — an off-by-one (> instead of >=) shows up here."
