  # =========================================================================
  # Rule 9 — Compensating-action invariants across different conserved quantities
  # =========================================================================
  - rule_id: compensating_invariant
    instances:
      - name: order_cancel_releases_exposure
        grounds:
          - state_machines.Order.HELD_FOR_CERT_to_CANCELLED
          - entities.Customer.fields.blocked_exposure_cents
          - entities.Tenant.fields.open_exposure_cents
        distinguishing_aspect: |
          Conserved quantity: customer.blocked_exposure_cents and
          tenant.open_exposure_cents. Submitting a HELD_FOR_CERT order debits
          both; cancelling that same order MUST credit both back to exactly the
          pre-submit values. Forward action + compensating action = net zero.
        test_recipe:
          setup:
            - "Tenant, CA jurisdiction, RESALE reason, customer C1 onboarded"
            - "Pre-state: customer.blocked_exposure_cents == 0; tenant.open_exposure_cents == 0"
          setup_api_calls:
            - call: "POST /tenants"
              payload: { legal_name: "T1 Inc", home_state_code: "NY" }
              as: TenantAdmin
              captures: { tid: $.data.id }
            - call: "POST /tenants/${tid}/jurisdiction_rules"
              payload: { state_code: "CA", accepted_form_types: ["RESALE"], validity_window_days: 0, anchor_rule: "EFFECTIVE_DATE", allows_drop_ship_resale: false, requires_state_registration_number: false, blanket_cert_allowed: false }
              as: TenantAdmin
            - call: "POST /tenants/${tid}/exemption_reasons"
              payload: { code: "RES", description: "Resale", tax_engine_code: "R", requires_certificate: true, allowed_form_types: ["RESALE"] }
              as: TenantAdmin
            - call: "POST /tenants/${tid}/customers"
              payload: { external_ref: "C1", legal_name: "Cust 1", primary_ship_to_state: "CA", exemption_reason_code: "RES" }
              as: ComplianceOfficer
              captures: { cid: $.data.id }
            - call: "POST /tenants/${tid}/customers/${cid}/complete_onboarding"
              payload: {}
              as: ComplianceOfficer
            - call: "GET /tenants/${tid}/customers/${cid}"
              payload: {}
              as: Auditor
              captures: { blocked_pre: $.data.blocked_exposure_cents }
            - call: "GET /tenants/${tid}"
              payload: {}
              as: Auditor
              captures: { open_pre: $.data.open_exposure_cents }
            - call: "POST /tenants/${tid}/customers/${cid}/orders"
              payload: { order_ref: "O1", ship_to_state: "CA", exemption_reason_code: "RES" }
              as: OrderClerk
              captures: { oid: $.data.id }
            - call: "POST /tenants/${tid}/orders/${oid}/lines"
              payload: { sku: "ABC", quantity: 1, unit_price_cents: 5000, is_exempt_claimed: true }
              as: OrderClerk
          trigger:
            - call: "POST /tenants/${tid}/orders/${oid}/submit"
              payload: {}
              as: OrderClerk
            - call: "GET /tenants/${tid}/customers/${cid}"
              payload: {}
              as: Auditor
              captures: { blocked_mid: $.data.blocked_exposure_cents }
            - call: "GET /tenants/${tid}"
              payload: {}
              as: Auditor
              captures: { open_mid: $.data.open_exposure_cents }
            - call: "POST /tenants/${tid}/orders/${oid}/cancel"
              payload: {}
              as: OrderClerk
            - call: "GET /tenants/${tid}/customers/${cid}"
              payload: {}
              as: Auditor
              captures: { blocked_post: $.data.blocked_exposure_cents }
            - call: "GET /tenants/${tid}"
              payload: {}
              as: Auditor
              captures: { open_post: $.data.open_exposure_cents }
          assert:
            - "blocked_pre == 0"
            - "open_pre == 0"
            - "blocked_mid == 5000"
            - "open_mid == 5000"
            - "blocked_post == 0"
            - "open_post == 0"
            - "blocked_post == blocked_pre (invariant restored)"
            - "open_post == open_pre (invariant restored)"

      - name: remediation_resolve_restores_customer_audit_standing
        grounds:
          - state_machines.Customer
          - state_machines.RemediationAction.IN_PROGRESS_to_RESOLVED
          - entities.Customer.fields.audit_standing
        distinguishing_aspect: |
          Different conserved quantity than instance 1: customer.audit_standing.
          Sample fail -> FAILED_SAMPLING; RemediationAction resolve -> REMEDIATED
          (not back to NOT_UNDER_AUDIT — but the FAILED flag is cleared). The
          invariant is "every FAILED sample has at least one RESOLVED
          remediation"; restore path is fail -> remediate. Forward +
          compensating action conserves the FAILED-unremediated count at zero.
        test_recipe:
          setup:
            - "Tenant, CA jurisdiction, customer C1 with one APPROVED cert"
            - "AuditCampaign in FIELDWORK, one sample S1 in DOC_RECEIVED"
