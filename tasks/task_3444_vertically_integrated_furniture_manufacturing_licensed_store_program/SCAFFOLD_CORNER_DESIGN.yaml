              payload: { buyer_type: LICENSEE, licensee_id: "${lN}", allocation_cycle_id: "${cB}", product_line_id: "${pl1}", quantity: 6, delivery_mode: FREIGHT_TO_STORE }
              as: LicenseeManager
              as_user_id: "${lN}"
              captures: { oN: $.data.id }
            - call: "POST /api/orders/${oN}/transition"
              payload: { action: SUBMIT }
