        distinguishing_aspect: "ApostilleOrder SUBMITTED->ROUTED depends on a different entity pair (ApostilleOrder<-RequestDocument<-SigningRequest): routing fails ERR_DOCUMENT_NOT_NOTARIZED while the document's request is not COMPLETED."
