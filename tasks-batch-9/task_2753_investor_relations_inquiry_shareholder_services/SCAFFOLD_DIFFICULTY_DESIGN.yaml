              as: IRAdmin
              as_user_id: "u_ir_admin_1"
          assert:
            - "after trigger step 1: Contact.${c_id}.ownership_pct == 0.9999 and Contact.${c_id}.target_tier == TIER_3"
            - "after trigger step 3: Contact.${c_id}.ownership_pct == 1.0000 and Contact.${c_id}.target_tier == TIER_2"
            - "after trigger step 3: Contact.${c_id}.threat_level == NONE (activist_stake_escalation does not fire below 5.0% and for a non-activist contact)"
            - "Company.${co_id}.version == 3 after both patches"

      - name: consensus_ninety_day_window_boundary_and_empty_eligible_set
        grounds:
          - calculations.consensus_estimate
          - validations[priority=16]
          - errors[ERR_NO_ELIGIBLE_ESTIMATES]
          - endpoints[GET /companies/{id}/consensus]
        distinguishing_aspect: |
          The staleness cutoff is inclusive: with a single estimate stamped 2026-08-01T00:00:00Z the
          consensus read at 2026-10-30T00:00:00Z (exactly 90 days) returns eligible_count 1, while the
          same read one day later collapses the eligible set to empty and returns
          ERR_NO_ELIGIBLE_ESTIMATES — an empty-collection edge on a different endpoint and metric
          from the ownership_pct threshold instance.
        test_recipe:
          setup:
            - "Logical clock at 2026-08-01T00:00:00Z when the estimate is filed."
            - "Issuer STL with one SELL_SIDE_ANALYST contact, nda_on_file true, coverage_status INITIATED, model access GRANTED."
            - "No published guidance exists for EPS / FY2026, so the outlier band is anchored on the simple mean."
