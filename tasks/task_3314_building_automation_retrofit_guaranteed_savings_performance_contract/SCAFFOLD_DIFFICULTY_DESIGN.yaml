scaffold_difficulty_design:
- rule_id: dual_variant_calc
  instances:
  - name: measured_vs_stipulated_savings_diverge_on_identical_meter_data
    grounds:
    - calculations.savings_verification
    - entities.SavingsReport.fields.verified_savings_cents
    - entities.PerformanceContract.fields.mv_protocol
    distinguishing_aspect: 'Same report inputs (actual_energy_kwh, weather, occupancy) produce

      verified_savings_cents = 240000 under the measured variant

      (IPMVP_C contract) and 285000 under the stipulated variant

      (IPMVP_A contract with one VERIFIED measure at 300000 annual

      savings) — dual-variant divergence on the SavingsReport domain.

      '
    test_recipe:
      setup:
      - Logical clock 2026-09-01T00:00:00Z.
      - 'Contract C1: mv_protocol=IPMVP_C, guarantee_start 2026-10-01, term 10, guaranteed 250000; baseline 100000 kwh, occ 0.5, rate [[100000,12],[null,15]]; adjusted cost 1200000.'
      - C1 has one bundle APPROVED→ACTIVE, one measure VERIFIED with annual_savings_cents 300000; C1 walked to PERFORMANCE; clock advanced to 2027-09-30 (year 1 ended).
      - 'Contract C2: identical baseline but mv_protocol=IPMVP_A, also in PERFORMANCE with a VERIFIED measure at 300000.'
      - Both contracts have a DRAFT report period_year 1, actual 80000 kwh, weather equal to baseline, occupancy equal to baseline.
      setup_api_calls:
      - &id001
        call: POST /_clock/set_current_utc
        payload:
          current_utc: '2026-09-01T00:00:00Z'
        as: PlatformAdmin
      - &id002
        call: POST /esco-engineers
        payload:
          full_name: Erin ESCO
          license_number: PE-1042
        as: PlatformAdmin
        captures:
          eng_id: $.data.id
      - &id003
        call: POST /owner-reps
        payload:
          full_name: Owen Owner
          organization: City Schools
        as: PlatformAdmin
        captures:
          owner_id: $.data.id
      - &id004
