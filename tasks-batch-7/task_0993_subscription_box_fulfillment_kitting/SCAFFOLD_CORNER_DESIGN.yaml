  # ---------------------------------------------------------------------------
  - section: cross_cutting_layers
    instances:
      - name: occ_revision_create_stale_plan_version_rejected
        claim_type: occ_stale_version
        grounds:
          - concurrency_rules[revision-create-stale-plan]
        distinguishing_aspect: "OCC on BoxPlan.version: after the first revision create bumps the plan version 1 -> 2, replaying the same create with the stale captured version fails 412 ERR_STALE_VERSION."
        test_recipe:
          setup: ["client + plan PL-X1 created (version 1); revision 1 already created with expected_box_plan_version 1 (plan now version 2)"]
          setup_api_calls:
            - { call: "POST /_clock/set_current_utc", payload: { to_iso8601: "2026-05-01T00:00:00Z" }, as: PlatformAdmin }
            - call: "POST /clients"
              payload: { name: "X1 Client", billing_email: "x1@acme.test" }
              as: PlatformAdmin
              captures: { x1_cl: $.data.id }
            - call: "POST /box-plans"
              payload: { client_id: "${x1_cl}", name: "X1 Box", sku: "PL-X1", price_per_box_cents: 1000, shipping_weight_grams: 500 }
              as: ClientOps
              as_user_id: "${x1_cl}"
              captures: { x1_pl: $.data.id, x1_pl_v: $.data.version }
            - call: "POST /box-plans/${x1_pl}/kit-revisions"
              payload: { expected_box_plan_version: "${x1_pl_v}" }
              as: ClientOps
              as_user_id: "${x1_cl}"
              captures: { x1_rv1: $.data.id }
          trigger:
            - call: "POST /box-plans/${x1_pl}/kit-revisions"
              payload: { expected_box_plan_version: "${x1_pl_v}" }
              as: ClientOps
              as_user_id: "${x1_cl}"
              captures: { x1_err: $.data.error_id }
          assert:
            - "second create replaying the stale captured version -> error_id == ERR_STALE_VERSION (${x1_err}) with HTTP 412"
            - "no third revision is persisted for the plan (GET /box-plans/${x1_pl}/kit-revisions shows exactly 1)"

      - name: occ_receipt_stale_component_version_rejected
        claim_type: occ_stale_version
        grounds:
          - concurrency_rules[receipt-create-stale-component]
        distinguishing_aspect: "OCC on Component.version: after a first receipt moves the component to version 2, a second receipt carrying the pre-receipt captured version fails 412 and appends no event."
        test_recipe:
          setup: ["component CMP-X2 created (version 1); one receipt of 5 units recorded (version now 2)"]
          setup_api_calls:
            - { call: "POST /_clock/set_current_utc", payload: { to_iso8601: "2026-05-01T00:00:00Z" }, as: PlatformAdmin }
            - call: "POST /components"
              payload: { sku: "CMP-X2", name: "X2 widget", unit_cost_cents: 10 }
              as: WarehouseOps
              captures: { x2_cp: $.data.id, x2_cp_v: $.data.version }
            - { call: "POST /components/${x2_cp}/receipts", payload: { quantity: 5, expected_component_version: "${x2_cp_v}" }, as: WarehouseOps }
          trigger:
            - call: "POST /components/${x2_cp}/receipts"
              payload: { quantity: 5, expected_component_version: "${x2_cp_v}" }
              as: WarehouseOps
              captures: { x2_err: $.data.error_id }
            - call: "GET /components/${x2_cp}"
              as: WarehouseOps
              captures: { x2_onhand: $.data.on_hand_units, x2_v: $.data.version }
          assert:
            - "error_id == ERR_STALE_VERSION (${x2_err}) with HTTP 412"
            - "Component.${x2_cp}.on_hand_units == 5 and version == 2 (the rejected receipt changed nothing)"

      - name: occ_receipt_current_version_succeeds
        claim_type: occ_stale_version
        grounds:
          - concurrency_rules[receipt-create-stale-component]
        distinguishing_aspect: "Positive arm: a receipt carrying the version returned by the previous receipt succeeds and increments Component.version by exactly 1."
        test_recipe:
          setup: ["component CMP-X3 created (version 1)"]
          setup_api_calls:
            - { call: "POST /_clock/set_current_utc", payload: { to_iso8601: "2026-05-01T00:00:00Z" }, as: PlatformAdmin }
            - call: "POST /components"
              payload: { sku: "CMP-X3", name: "X3 widget", unit_cost_cents: 10 }
              as: WarehouseOps
              captures: { x3_cp: $.data.id, x3_cp_v: $.data.version }
          trigger:
            - call: "POST /components/${x3_cp}/receipts"
              payload: { quantity: 8, expected_component_version: "${x3_cp_v}" }
              as: WarehouseOps
              captures: { x3_v2: $.data.version, x3_onhand: $.data.on_hand_units }
          assert:
            - "receipt succeeds: on_hand_units == 8 and version == 2 (exactly +1)"

      - name: cascade_return_replace_full_chain
        claim_type: cascading_side_effects
        grounds:
          - state_machines.ReturnCase.RECEIVED_to_RESOLVED
        excluded_because:
          difficulty_instance: return_replace_cascade_to_component_posture
          rationale: "The N-level cascade (ReturnCase -> Shipment -> InventoryEvent -> Component) is asserted hop-by-hop in that §1.8 instance."

      - name: dual_variant_statement_variants
        claim_type: dual_variant_calculation
        grounds:
          - calculations.statement_net_amount
        excluded_because:
          difficulty_instance: statement_provisional_vs_final_variant_divergence
          rationale: "Both variants and their divergence are asserted there (6000 -> 3000 at finalize)."

      - name: derived_reconciliation_statement_postage
        claim_type: derived_field_reconciliation
        grounds:
          - entities.BillingStatement.fields.postage_cents
          - calculations.statement_net_amount
        excluded_because:
          difficulty_instance: wave_cancel_cascade_to_statement_postage
          rationale: "Recompute of the denormalized postage_cents on label void is asserted there (970 -> 0)."

  # ---------------------------------------------------------------------------
  - section: consistency_model
    instances:
      - name: immediate_visibility_after_pause
        claim_type: immediate_visibility
        grounds:
          - complexity_profile.consistency_model
        distinguishing_aspect: "Immediate consistency: the mutation response and a follow-up GET in the next request both show PAUSED with version bumped — no lag, no reconciliation pass."
        test_recipe:
          setup: ["client + plan PL-Y1; subscriber y1@x.test ACTIVE"]
          setup_api_calls:
            - { call: "POST /_clock/set_current_utc", payload: { to_iso8601: "2026-05-01T00:00:00Z" }, as: PlatformAdmin }
            - call: "POST /clients"
              payload: { name: "Y1 Client", billing_email: "y1@acme.test" }
              as: PlatformAdmin
              captures: { y1_cl: $.data.id }
            - call: "POST /box-plans"
              payload: { client_id: "${y1_cl}", name: "Y1 Box", sku: "PL-Y1", price_per_box_cents: 1000, shipping_weight_grams: 500 }
              as: ClientOps
              as_user_id: "${y1_cl}"
              captures: { y1_pl: $.data.id }
            - call: "POST /box-plans/${y1_pl}/import-batches"
              payload: { rows: [{ email: "y1@x.test", zone: 2 }] }
              as: ClientOps
              as_user_id: "${y1_cl}"
              captures: { y1_ib: $.data.id }
            - { call: "POST /import-batches/${y1_ib}/commit", as: ClientOps, as_user_id: "${y1_cl}" }
            - call: "GET /subscribers"
              payload: { import_batch_id: "${y1_ib}" }
              as: ClientOps
              as_user_id: "${y1_cl}"
              captures: { y1_sb: "$.data[0].id" }
          trigger:
            - call: "POST /subscribers/${y1_sb}/pause"
              as: ClientOps
              as_user_id: "${y1_cl}"
              captures: { y1_resp_status: $.data.status }
            - call: "GET /subscribers/${y1_sb}"
              as: WarehouseOps
              captures: { y1_get_status: $.data.status, y1_get_v: $.data.version }
          assert:
            - "pause response status == PAUSED"
            - "immediate GET (different role, next request): status == PAUSED and version == 2"
