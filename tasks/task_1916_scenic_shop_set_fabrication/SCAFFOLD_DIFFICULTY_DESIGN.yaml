            - call: "POST /scenic/bids"
              payload: { client_id: "${cl_id}", design_package_id: "${pkg_id}", pricing_variant: "ROM", has_automation_scope: false, bays_required: 1, build_start_at: "2026-09-01T00:00:00Z", validity_days: 30, floor_area_sqft: 100, complexity_class: "A_SIMPLE", estimated_crew_hours: 100 }
              as: Estimator
              captures: { bid_id: $.data.id }
            - call: "POST /scenic/bids/${bid_id}/submit"
              payload: {}
              as: Estimator
            - call: "POST /scenic/bids/${bid_id}/accept"
              payload: {}
              as: ClientPM
              as_user_id: "${cl_id}"
              captures: { prod_id: $.data.production_id }
            - call: "POST /scenic/design-packages"
              payload: { client_id: "${cl_id}", show_title: "Hamlet", venue: "Lyric Theatre", load_in_at: "2026-09-26T00:00:00Z", strike_at: "2026-10-10T00:00:00Z" }
              as: ClientPM
              as_user_id: "${cl_id}"
            - call: "GET /scenic/productions/${prod_id}"
              payload: {}
              as: Estimator
              captures: { prod_v: $.data.version }
            - call: "POST /scenic/change-orders"
              payload: { production_id: "${prod_id}", expected_production_version: "${prod_v}", new_drawing_revision: 2, delta_materials_cents: 50000, delta_labor_hours: 10, delta_load_in_days: 2 }
              as: Estimator
              captures: { co_id: $.data.id }
          trigger:
            - call: "POST /scenic/change-orders/${co_id}/reject"
              payload: {}
              as: ClientPM
              as_user_id: "${cl_id}"
          assert:
            - "ChangeOrder.${co_id}.status == REJECTED and delta_price_cents == 135000 (pinned at creation)"
            - "Production.${prod_id}.current_price_cents == 900000   # invariant: rejected CO contributes 0"
            - "Production.${prod_id}.load_in_deadline_at == 2026-09-26T00:00:00Z and committed_crew_hours == 100 and applied_drawing_revision == 1"

      - name: production_close_restores_committed_capacity
        grounds:
          - state_machines.Production.STRUCK_to_CLOSED
          - calculations.capacity_posture
          - errors[ERR_RESERVATIONS_OPEN]
        distinguishing_aspect: |
          Conserved quantity: shop crew-hour capacity. Pin:
          Shop.committed_crew_hours(after accept..close cycle) ==
          committed_crew_hours(before accept) — acceptance commits 320
          (posture TIGHT at 8000bp) and close releases exactly 320 (posture
          back to OPEN at 0bp); close is itself gated on releasing bay
          reservations first.
        test_recipe:
          setup:
            - "Production driven to STRUCK (full lifecycle: review approved, bay reserved, started, sample approved, completed, transport confirmed, loaded in, struck); one reservation still ACTIVE"
          setup_api_calls:
            - call: "POST /scenic/shops"
              payload: { name: "Metro Scenic", weekly_crew_hours_capacity: 100, horizon_weeks: 4, bay_count: 2, truck_fleet_size: 6, labor_rate_cents_per_hour: 8000, overtime_multiplier_bp: 15000, overhead_pct_bp: 1000, margin_pct_bp: 2000 }
              as: ShopAdmin
              captures: { shop_id: $.data.id }
            - call: "POST /scenic/clients"
              payload: { shop_id: "${shop_id}", company_name: "Northlight Productions", contact_email: "pm@northlight.example", credit_limit_cents: 100000000 }
              as: ShopAdmin
              captures: { cl_id: $.data.id }
            - call: "POST /scenic/design-packages"
              payload: { client_id: "${cl_id}", show_title: "Hamlet", venue: "Lyric Theatre", load_in_at: "2026-09-26T00:00:00Z", strike_at: "2026-10-10T00:00:00Z" }
              as: ClientPM
              as_user_id: "${cl_id}"
              captures: { pkg_id: $.data.id }
            - call: "POST /scenic/bids"
              payload: { client_id: "${cl_id}", design_package_id: "${pkg_id}", pricing_variant: "ROM", has_automation_scope: false, bays_required: 1, build_start_at: "2026-09-01T00:00:00Z", validity_days: 30, floor_area_sqft: 100, complexity_class: "A_SIMPLE", estimated_crew_hours: 320 }
              as: Estimator
              captures: { bid_id: $.data.id }
            - call: "POST /scenic/bids/${bid_id}/submit"
              payload: {}
              as: Estimator
            - call: "POST /scenic/bids/${bid_id}/accept"
              payload: {}
              as: ClientPM
              as_user_id: "${cl_id}"
              captures: { prod_id: $.data.production_id }
            - call: "POST /scenic/engineering-reviews"
              payload: { production_id: "${prod_id}", scope: "STRUCTURAL", design_load_lb: 4000, member_capacity_lb: 6000 }
              as: ShopForeman
              as_user_id: "foreman_1"
              captures: { rev_id: $.data.id }
            - call: "POST /scenic/engineering-reviews/${rev_id}/approve"
              payload: {}
              as: StaffEngineer
              as_user_id: "eng_2"
            - call: "POST /scenic/bay-reservations"
              payload: { production_id: "${prod_id}", bay_slot: 1, window_start: "2026-09-01T00:00:00Z", window_end: "2026-09-26T00:00:00Z" }
              as: ShopForeman
              captures: { res_id: $.data.id }
            - call: "POST /scenic/productions/${prod_id}/start-build"
              payload: {}
              as: ShopForeman
            - call: "POST /scenic/finish-samples"
              payload: { production_id: "${prod_id}", finish_code: "SCUFF_BRICK_RED", texture_ref: "tex_v1" }
              as: PaintCharge
              captures: { smp_id: $.data.id }
            - call: "POST /scenic/finish-samples/${smp_id}/approve"
              payload: {}
              as: ClientPM
              as_user_id: "${cl_id}"
            - call: "POST /scenic/productions/${prod_id}/complete-build"
              payload: {}
              as: ShopForeman
            - call: "POST /scenic/transport-plans"
              payload: { production_id: "${prod_id}", truck_count: 2, install_crew_hours: 16, depart_at: "2026-09-11T00:00:00Z", arrive_at: "2026-09-12T00:00:00Z" }
              as: TransportCoordinator
              captures: { tp_id: $.data.id }
            - call: "POST /scenic/transport-plans/${tp_id}/confirm"
              payload: {}
              as: TransportCoordinator
            - call: "POST /scenic/productions/${prod_id}/load-in"
              payload: {}
              as: TransportCoordinator
            - call: "POST /scenic/productions/${prod_id}/strike"
              payload: { reclaim_lines: [] }
              as: ShopForeman
          trigger:
            - call: "POST /scenic/productions/${prod_id}/close"
              payload: {}
              as: ShopForeman
              captures: { err: $.data.error_id }
            - call: "DELETE /scenic/bay-reservations/${res_id}"
              payload: {}
              as: ShopForeman
            - call: "POST /scenic/productions/${prod_id}/close"
              payload: {}
              as: ShopForeman
          assert:
            - "first close fails with ERR_RESERVATIONS_OPEN (HTTP 409)   # reservation still ACTIVE"
            - "before accept the shop had committed_crew_hours 0; during the build it was 320 (posture TIGHT)"
            - "after release + close: Production.${prod_id}.status == CLOSED and Shop.${shop_id}.committed_crew_hours == 0 and capacity_ratio_bp == 0 and posture == OPEN   # invariant restored"
            - "Client.${cl_id}.outstanding_cents == 0   # closed production leaves the outstanding set"
