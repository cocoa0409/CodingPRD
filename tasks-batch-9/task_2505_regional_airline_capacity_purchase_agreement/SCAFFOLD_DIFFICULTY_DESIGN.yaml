            - "Agreement.${ag}.open_invoice_count == 0"
            - "Invoice.${inv}.total_usd == 334362.99 — the voided invoice keeps its frozen components"

      - name: pilot_attrition_three_hop_grounds_newest_tail
        grounds:
          - state_machines.Pilot.LINE_QUALIFIED_to_ATTRITED_TO_MAINLINE
          - state_machines.Aircraft.IN_SERVICE_to_GROUNDED_STAFFING
          - calculations.pilot_staffing_shortfall
          - entities.CrewBase.fields.allocatable_aircraft_count
          - entities.Aircraft.fields.grounded_reason
        distinguishing_aspect: |
          Depth 3 across a different chain of entities than the settlement cascade:
          a single attrition call (hop 1, Pilot) recomputes the CrewBase staffing
          derivations (hop 2) which in turn grounds exactly one IN_SERVICE tail
          (hop 3, Aircraft) chosen by the pinned created_at DESC selector — the
          newest tail N702RG is grounded while N701RG keeps flying.
