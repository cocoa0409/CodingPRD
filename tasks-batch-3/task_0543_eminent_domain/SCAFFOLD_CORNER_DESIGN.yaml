# =============================================================================
# §1.9 Scaffold Corner Design (Coverage Index for Non-Difficulty Tests)
# Eminent Domain & Right-of-Way Acquisition — Expert (breadth probe)
# =============================================================================
scaffold_corner_design:

  # ==== Entities ============================================================
  - section: entities
    instances:
      - name: create_project_returns_all_fields
        claim_type: Creation
        grounds: [entities.Project, endpoints]
        distinguishing_aspect: "POST /projects with all required fields returns 201 and a Project whose committed_cents/disbursed_cents/acquired_area_sqft are 0 and available_cents == total_budget_cents."
        test_recipe:
          setup: ["Empty DB."]
          setup_api_calls: []
          trigger:
            - call: "POST /projects"
              payload: { name: "PJ", agency_name: "DOT", total_budget_cents: 50000000 }
              as: ProgramAdmin
              captures: { proj_id: $.data.id }
          assert:
            - "response code 201; Project.${proj_id}.committed_cents == 0"
            - "Project.${proj_id}.disbursed_cents == 0 AND Project.${proj_id}.acquired_area_sqft == 0"
            - "Project.${proj_id}.available_cents == 50000000 AND Project.${proj_id}.version == 1"

      - name: get_parcel_not_found_returns_404
        claim_type: Not Found
        grounds: [entities.Parcel, "errors[ERR_NOT_FOUND]"]
        distinguishing_aspect: "GET /parcels/{id} for a non-existent UUID returns ERR_NOT_FOUND (404)."
        test_recipe:
          setup: ["Empty DB."]
          setup_api_calls: []
          trigger:
            - call: "GET /parcels/00000000-0000-4000-8000-000000000000"
              payload: {}
              as: RightOfWayAgent
              captures: { err: $.data.error_id }
          assert:
            - "response code 404; error_id == ERR_NOT_FOUND"

      - name: create_parcel_missing_required_field_returns_validation
        claim_type: Required Fields
        grounds: [entities.Parcel.fields.take_type, "errors[ERR_VALIDATION]"]
        distinguishing_aspect: "POST /parcels omitting take_type returns ERR_VALIDATION (400)."
        test_recipe:
          setup: ["A project exists."]
          setup_api_calls:
            - call: "POST /projects"
              payload: { name: "PJ", agency_name: "DOT", total_budget_cents: 50000000 }
              as: ProgramAdmin
              captures: { proj_id: $.data.id }
          trigger:
            - call: "POST /parcels"
              payload: { project_id: "${proj_id}", apn: "APN-C1", total_area_sqft: 10000, take_area_sqft: 5000 }
              as: RightOfWayAgent
              captures: { err: $.data.error_id }
          assert:
            - "response code 400; error_id == ERR_VALIDATION"

      - name: create_parcel_take_area_exceeds_total_returns_validation
        claim_type: Type Constraints
        grounds: [entities.Parcel.fields.take_area_sqft, "errors[ERR_VALIDATION]"]
        distinguishing_aspect: "POST /parcels with take_area_sqft > total_area_sqft returns ERR_VALIDATION (400)."
        test_recipe:
          setup: ["A project exists."]
          setup_api_calls:
            - call: "POST /projects"
              payload: { name: "PJ", agency_name: "DOT", total_budget_cents: 50000000 }
              as: ProgramAdmin
              captures: { proj_id: $.data.id }
          trigger:
            - call: "POST /parcels"
              payload: { project_id: "${proj_id}", apn: "APN-C2", total_area_sqft: 4000, take_area_sqft: 5000, take_type: "PARTIAL" }
              as: RightOfWayAgent
              captures: { err: $.data.error_id }
          assert:
            - "response code 400; error_id == ERR_VALIDATION"

      - name: create_parcel_bad_project_fk_returns_not_found
        claim_type: Parent Relationships
        grounds: [entities.Parcel.fields.project_id, "errors[ERR_NOT_FOUND]"]
        distinguishing_aspect: "POST /parcels with a project_id that does not exist returns ERR_NOT_FOUND (404)."
        test_recipe:
          setup: ["Empty DB."]
          setup_api_calls: []
          trigger:
            - call: "POST /parcels"
              payload: { project_id: "11111111-1111-4111-8111-111111111111", apn: "APN-C3", total_area_sqft: 10000, take_area_sqft: 5000, take_type: "FULL" }
              as: RightOfWayAgent
              captures: { err: $.data.error_id }
          assert:
            - "response code 404; error_id == ERR_NOT_FOUND"

      - name: appraisal_computed_fields_ignore_input_overrides
        claim_type: Computed Fields
        grounds: [entities.Appraisal.fields.just_compensation_cents, entities.Appraisal.fields.condemnation_basis_cents]
        distinguishing_aspect: "just_compensation_cents / condemnation_basis_cents are server-computed from the value inputs; the response reflects the formula, not any client-sent value."
        test_recipe:
          setup: ["A parcel exists."]
          setup_api_calls:
            - call: "POST /projects"
              payload: { name: "PJ", agency_name: "DOT", total_budget_cents: 100000000 }
              as: ProgramAdmin
              captures: { proj_id: $.data.id }
            - call: "POST /parcels"
              payload: { project_id: "${proj_id}", apn: "APN-C4", total_area_sqft: 10000, take_area_sqft: 5000, take_type: "PARTIAL" }
              as: RightOfWayAgent
              captures: { parcel_id: $.data.id }
            - call: "GET /parcels/${parcel_id}"
              payload: {}
              as: Appraiser
              captures: { parcel_v: $.data.version }
          trigger:
            - call: "POST /parcels/${parcel_id}/appraisals"
              payload: { appraiser_name: "AX", land_value_cents: 10000000, improvements_value_cents: 2000000, severance_damages_cents: 4000000, special_benefits_cents: 1000000, expected_parcel_version: "${parcel_v}" }
              as: Appraiser
              captures: { appr_id: $.data.id }
          assert:
            - "Appraisal.${appr_id}.just_compensation_cents == 15000000"
            - "Appraisal.${appr_id}.condemnation_basis_cents == 16000000"

      - name: offer_round_is_immutable_no_version_field
        claim_type: Immutability
        grounds: [entities.OfferRound]
        distinguishing_aspect: "OfferRound has common_fields:false — the created OfferRound carries id and created_at but no version field and has no update endpoint."
        test_recipe:
          setup: ["Cleared, appraised parcel with an open negotiation."]
          setup_api_calls:
            - call: "POST /projects"
              payload: { name: "PJ", agency_name: "DOT", total_budget_cents: 100000000 }
              as: ProgramAdmin
              captures: { proj_id: $.data.id }
            - call: "POST /parcels"
              payload: { project_id: "${proj_id}", apn: "APN-C5", total_area_sqft: 10000, take_area_sqft: 5000, take_type: "PARTIAL" }
              as: RightOfWayAgent
              captures: { parcel_id: $.data.id }
            - call: "POST /parcels/${parcel_id}/ownership-interests"
              payload: { interest_type: "FEE_OWNER", holder_name: "O", ownership_pct: 100 }
              as: RightOfWayAgent
              captures: { oi_id: $.data.id }
            - call: "POST /parcels/${parcel_id}/clear-ownership"
              payload: {}
              as: RightOfWayAgent
            - call: "GET /parcels/${parcel_id}"
              payload: {}
              as: Appraiser
              captures: { parcel_v: $.data.version }
            - call: "POST /parcels/${parcel_id}/appraisals"
              payload: { appraiser_name: "AX", land_value_cents: 20000000, improvements_value_cents: 5000000, severance_damages_cents: 3000000, special_benefits_cents: 1000000, expected_parcel_version: "${parcel_v}" }
              as: Appraiser
              captures: { appr_id: $.data.id }
            - call: "POST /appraisals/${appr_id}/finalize"
              payload: {}
              as: Appraiser
            - call: "POST /parcels/${parcel_id}/negotiations"
              payload: { initial_offer_cents: 27000000 }
              as: RightOfWayAgent
              captures: { neg_id: $.data.id }
          trigger:
            - call: "GET /negotiations/${neg_id}/rounds"
              payload: {}
              as: RightOfWayAgent
          assert:
            - "the round-1 OfferRound has action == OFFER, party == AGENCY, round_no == 1, amount_cents == 27000000, and exposes no version field"

  # ==== State Machines ======================================================
  - section: state_machines
    instances:
      - name: finalize_already_finalized_appraisal_returns_invalid_state
        claim_type: invalid_transition
        grounds: [state_machines.Appraisal.DRAFT_to_FINALIZED, "errors[ERR_INVALID_APPRAISAL_STATE]"]
        distinguishing_aspect: "Finalizing an appraisal that is already FINALIZED returns ERR_INVALID_APPRAISAL_STATE (409); no fields change."
        test_recipe:
          setup: ["A parcel with a FINALIZED appraisal."]
          setup_api_calls:
            - call: "POST /projects"
              payload: { name: "PJ", agency_name: "DOT", total_budget_cents: 100000000 }
              as: ProgramAdmin
              captures: { proj_id: $.data.id }
            - call: "POST /parcels"
              payload: { project_id: "${proj_id}", apn: "APN-C6", total_area_sqft: 10000, take_area_sqft: 5000, take_type: "PARTIAL" }
              as: RightOfWayAgent
              captures: { parcel_id: $.data.id }
            - call: "GET /parcels/${parcel_id}"
              payload: {}
              as: Appraiser
              captures: { parcel_v: $.data.version }
            - call: "POST /parcels/${parcel_id}/appraisals"
              payload: { appraiser_name: "AX", land_value_cents: 20000000, improvements_value_cents: 5000000, expected_parcel_version: "${parcel_v}" }
              as: Appraiser
              captures: { appr_id: $.data.id }
            - call: "POST /appraisals/${appr_id}/finalize"
              payload: {}
              as: Appraiser
          trigger:
            - call: "POST /appraisals/${appr_id}/finalize"
              payload: {}
              as: Appraiser
              captures: { err: $.data.error_id }
          assert:
            - "response code 409; error_id == ERR_INVALID_APPRAISAL_STATE"

      - name: round_on_agreed_negotiation_returns_invalid_state
        claim_type: terminal_state_lockdown
        grounds: [entities.Negotiation.fields.status, "errors[ERR_INVALID_NEGOTIATION_STATE]"]
        distinguishing_aspect: "Appending an OfferRound to a negotiation already AGREED (terminal) returns ERR_INVALID_NEGOTIATION_STATE (409)."
        test_recipe:
          setup: ["A negotiation already AGREED (owner accepted the opening offer)."]
          setup_api_calls:
            - call: "POST /projects"
              payload: { name: "PJ", agency_name: "DOT", total_budget_cents: 100000000 }
              as: ProgramAdmin
              captures: { proj_id: $.data.id }
            - call: "POST /parcels"
              payload: { project_id: "${proj_id}", apn: "APN-C7", total_area_sqft: 10000, take_area_sqft: 5000, take_type: "PARTIAL" }
              as: RightOfWayAgent
              captures: { parcel_id: $.data.id }
            - call: "POST /parcels/${parcel_id}/ownership-interests"
              payload: { interest_type: "FEE_OWNER", holder_name: "O", ownership_pct: 100 }
              as: RightOfWayAgent
              captures: { oi_id: $.data.id }
            - call: "POST /parcels/${parcel_id}/clear-ownership"
              payload: {}
              as: RightOfWayAgent
            - call: "GET /parcels/${parcel_id}"
              payload: {}
              as: Appraiser
              captures: { parcel_v: $.data.version }
            - call: "POST /parcels/${parcel_id}/appraisals"
              payload: { appraiser_name: "AX", land_value_cents: 20000000, improvements_value_cents: 5000000, severance_damages_cents: 3000000, special_benefits_cents: 1000000, expected_parcel_version: "${parcel_v}" }
              as: Appraiser
              captures: { appr_id: $.data.id }
            - call: "POST /appraisals/${appr_id}/finalize"
              payload: {}
              as: Appraiser
            - call: "POST /parcels/${parcel_id}/negotiations"
              payload: { initial_offer_cents: 27000000 }
              as: RightOfWayAgent
              captures: { neg_id: $.data.id }
            - call: "POST /negotiations/${neg_id}/rounds"
              payload: { action: "ACCEPT" }
              as: PropertyOwner
              as_user_id: "${oi_id}"
          trigger:
            - call: "POST /negotiations/${neg_id}/rounds"
              payload: { action: "COUNTER", amount_cents: 29000000 }
              as: PropertyOwner
              as_user_id: "${oi_id}"
              captures: { err: $.data.error_id }
          assert:
            - "response code 409; error_id == ERR_INVALID_NEGOTIATION_STATE"

      - name: owner_acts_out_of_turn_returns_not_your_turn
        claim_type: guarded_transition
        grounds: ["validations[priority=7]", "errors[ERR_NOT_YOUR_TURN]"]
        distinguishing_aspect: "After the owner counters (status OWNER_COUNTERED, agency's turn), a further owner COUNTER returns ERR_NOT_YOUR_TURN (409)."
        test_recipe:
          setup: ["Open negotiation where the owner has just countered (status OWNER_COUNTERED)."]
          setup_api_calls:
            - call: "POST /projects"
              payload: { name: "PJ", agency_name: "DOT", total_budget_cents: 100000000 }
              as: ProgramAdmin
              captures: { proj_id: $.data.id }
            - call: "POST /parcels"
              payload: { project_id: "${proj_id}", apn: "APN-C8", total_area_sqft: 10000, take_area_sqft: 5000, take_type: "PARTIAL" }
              as: RightOfWayAgent
              captures: { parcel_id: $.data.id }
            - call: "POST /parcels/${parcel_id}/ownership-interests"
              payload: { interest_type: "FEE_OWNER", holder_name: "O", ownership_pct: 100 }
              as: RightOfWayAgent
              captures: { oi_id: $.data.id }
            - call: "POST /parcels/${parcel_id}/clear-ownership"
              payload: {}
              as: RightOfWayAgent
            - call: "GET /parcels/${parcel_id}"
              payload: {}
              as: Appraiser
              captures: { parcel_v: $.data.version }
            - call: "POST /parcels/${parcel_id}/appraisals"
              payload: { appraiser_name: "AX", land_value_cents: 20000000, improvements_value_cents: 5000000, severance_damages_cents: 3000000, special_benefits_cents: 1000000, expected_parcel_version: "${parcel_v}" }
              as: Appraiser
              captures: { appr_id: $.data.id }
            - call: "POST /appraisals/${appr_id}/finalize"
              payload: {}
              as: Appraiser
            - call: "POST /parcels/${parcel_id}/negotiations"
              payload: { initial_offer_cents: 27000000 }
              as: RightOfWayAgent
              captures: { neg_id: $.data.id }
            - call: "POST /negotiations/${neg_id}/rounds"
              payload: { action: "COUNTER", amount_cents: 30000000 }
              as: PropertyOwner
              as_user_id: "${oi_id}"
          trigger:
            - call: "POST /negotiations/${neg_id}/rounds"
              payload: { action: "COUNTER", amount_cents: 31000000 }
              as: PropertyOwner
              as_user_id: "${oi_id}"
              captures: { err: $.data.error_id }
          assert:
            - "response code 409; error_id == ERR_NOT_YOUR_TURN"

      - name: schedule_utility_before_possession_returns_not_possessed
        claim_type: guarded_transition
        grounds: [state_machines.UtilityRelocation.IDENTIFIED_to_SCHEDULED, "errors[ERR_PARCEL_NOT_POSSESSED]"]
        distinguishing_aspect: "Scheduling a utility relocation while the parcel is not yet POSSESSED (possession_cleared false) returns ERR_PARCEL_NOT_POSSESSED (409)."
        test_recipe:
          setup: ["A parcel (PENDING) with one IDENTIFIED utility relocation, possession_cleared false."]
          setup_api_calls:
            - call: "POST /projects"
              payload: { name: "PJ", agency_name: "DOT", total_budget_cents: 100000000 }
              as: ProgramAdmin
              captures: { proj_id: $.data.id }
            - call: "POST /parcels"
              payload: { project_id: "${proj_id}", apn: "APN-C9", total_area_sqft: 10000, take_area_sqft: 5000, take_type: "PARTIAL" }
              as: RightOfWayAgent
              captures: { parcel_id: $.data.id }
            - call: "POST /parcels/${parcel_id}/utility-relocations"
              payload: { utility_type: "GAS" }
              as: UtilityCoordinator
              captures: { ur_id: $.data.id }
          trigger:
            - call: "POST /utility-relocations/${ur_id}/schedule"
              payload: { crew_name: "CX", scheduled_start: "2026-05-10T09:00:00Z", scheduled_end: "2026-05-10T10:00:00Z" }
              as: UtilityCoordinator
              captures: { err: $.data.error_id }
          assert:
            - "response code 409; error_id == ERR_PARCEL_NOT_POSSESSED"

      - name: relocation_deny_reaches_denied_terminal
        claim_type: valid_transition
        grounds: [state_machines.RelocationBenefit.SUBMITTED_to_DENIED, entities.RelocationBenefit.fields.status]
        distinguishing_aspect: "Denying a SUBMITTED relocation benefit moves it to DENIED (a terminal state), producing the DENIED enum value."
        test_recipe:
          setup: ["A SUBMITTED relocation benefit filed by an occupant owner."]
          setup_api_calls:
            - call: "POST /projects"
              payload: { name: "PJ", agency_name: "DOT", total_budget_cents: 100000000 }
              as: ProgramAdmin
              captures: { proj_id: $.data.id }
            - call: "POST /parcels"
              payload: { project_id: "${proj_id}", apn: "APN-C10", total_area_sqft: 8000, take_area_sqft: 8000, take_type: "FULL" }
              as: RightOfWayAgent
              captures: { parcel_id: $.data.id }
            - call: "POST /parcels/${parcel_id}/ownership-interests"
              payload: { interest_type: "FEE_OWNER", holder_name: "Occ", ownership_pct: 100, is_occupant: true }
              as: RightOfWayAgent
              captures: { oi_id: $.data.id }
            - call: "POST /parcels/${parcel_id}/relocation-benefits"
              payload: { claimant_name: "Occ", occupant_type: "RESIDENTIAL", comparable_replacement_cost_cents: 20000000, acquired_dwelling_price_cents: 19000000, moving_expense_cents: 50000 }
              as: PropertyOwner
              as_user_id: "${oi_id}"
              captures: { rb_id: $.data.id }
          trigger:
            - call: "POST /relocation-benefits/${rb_id}/deny"
              payload: { reason: "insufficient documentation" }
              as: RightOfWayAgent
          assert:
            - "RelocationBenefit.${rb_id}.status == DENIED"
            - "RelocationBenefit.${rb_id}.benefit_amount_cents == 1050000"

      - name: relocation_pay_reaches_paid
        claim_type: valid_transition
        grounds: [state_machines.RelocationBenefit.APPROVED_to_PAID, entities.RelocationBenefit.fields.status]
        distinguishing_aspect: "An APPROVED relocation benefit paid by the EscrowOfficer reaches PAID."
        test_recipe:
          setup: ["An APPROVED relocation benefit."]
          setup_api_calls:
            - call: "POST /projects"
              payload: { name: "PJ", agency_name: "DOT", total_budget_cents: 100000000 }
              as: ProgramAdmin
              captures: { proj_id: $.data.id }
            - call: "POST /parcels"
              payload: { project_id: "${proj_id}", apn: "APN-C11", total_area_sqft: 8000, take_area_sqft: 8000, take_type: "FULL" }
              as: RightOfWayAgent
              captures: { parcel_id: $.data.id }
            - call: "POST /parcels/${parcel_id}/ownership-interests"
              payload: { interest_type: "FEE_OWNER", holder_name: "Occ", ownership_pct: 100, is_occupant: true }
              as: RightOfWayAgent
              captures: { oi_id: $.data.id }
            - call: "POST /parcels/${parcel_id}/relocation-benefits"
              payload: { claimant_name: "Occ", occupant_type: "BUSINESS", reestablishment_cost_cents: 3000000, moving_expense_cents: 100000 }
              as: PropertyOwner
              as_user_id: "${oi_id}"
              captures: { rb_id: $.data.id }
            - call: "POST /relocation-benefits/${rb_id}/approve"
              payload: {}
              as: RightOfWayAgent
          trigger:
            - call: "POST /relocation-benefits/${rb_id}/pay"
              payload: {}
              as: EscrowOfficer
          assert:
            - "RelocationBenefit.${rb_id}.status == PAID"
            - "RelocationBenefit.${rb_id}.benefit_amount_cents == 3100000"

      - name: award_computes_statutory_interest_and_settlement
        claim_type: valid_transition
        grounds: [state_machines.Condemnation.POSSESSED_to_AWARDED, calculations.statutory_interest_settlement, entities.Condemnation.fields.settlement_total_cents]
        distinguishing_aspect: "Entering a final award of 30,000,000 on a condemnation with deposit 28,000,000, possession 2026-06-01, award 2026-07-01 (30 days) yields statutory_interest 6,000 and settlement_total 30,006,000."
        test_recipe:
          setup: ["A condemnation POSSESSED: deposit 28,000,000 at 2026-06-01, possession granted at 2026-06-01."]
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-06-01T00:00:00Z" }
              as: ProgramAdmin
            - call: "POST /projects"
              payload: { name: "PJ", agency_name: "DOT", total_budget_cents: 100000000 }
              as: ProgramAdmin
              captures: { proj_id: $.data.id }
            - call: "POST /parcels"
              payload: { project_id: "${proj_id}", apn: "APN-C12", total_area_sqft: 10000, take_area_sqft: 5000, take_type: "PARTIAL" }
              as: RightOfWayAgent
              captures: { parcel_id: $.data.id }
            - call: "POST /parcels/${parcel_id}/ownership-interests"
              payload: { interest_type: "FEE_OWNER", holder_name: "O", ownership_pct: 100 }
              as: RightOfWayAgent
              captures: { oi_id: $.data.id }
            - call: "POST /parcels/${parcel_id}/clear-ownership"
              payload: {}
              as: RightOfWayAgent
            - call: "GET /parcels/${parcel_id}"
              payload: {}
              as: Appraiser
              captures: { parcel_v: $.data.version }
            - call: "POST /parcels/${parcel_id}/appraisals"
              payload: { appraiser_name: "AX", land_value_cents: 20000000, improvements_value_cents: 5000000, severance_damages_cents: 3000000, special_benefits_cents: 1000000, expected_parcel_version: "${parcel_v}" }
              as: Appraiser
              captures: { appr_id: $.data.id }
            - call: "POST /appraisals/${appr_id}/finalize"
              payload: {}
              as: Appraiser
            - call: "POST /parcels/${parcel_id}/negotiations"
              payload: { initial_offer_cents: 27000000 }
              as: RightOfWayAgent
              captures: { neg_id: $.data.id }
            - call: "POST /parcels/${parcel_id}/condemnations"
              payload: {}
              as: RightOfWayAgent
              captures: { cond_id: $.data.id }
            - call: "POST /condemnations/${cond_id}/deposit"
              payload: { deposit_amount_cents: 28000000 }
              as: RightOfWayAgent
            - call: "POST /condemnations/${cond_id}/grant-possession"
              payload: {}
              as: ProgramAdmin
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-07-01T00:00:00Z" }
              as: ProgramAdmin
          trigger:
            - call: "POST /condemnations/${cond_id}/award"
              payload: { final_award_cents: 30000000 }
              as: ProgramAdmin
          assert:
            - "Condemnation.${cond_id}.status == AWARDED"
            - "Condemnation.${cond_id}.statutory_interest_cents == 6000"
            - "Condemnation.${cond_id}.settlement_total_cents == 30006000"

      - name: grant_possession_before_deposit_returns_invalid_state
        claim_type: invalid_transition
        grounds: [state_machines.Condemnation.DEPOSIT_MADE_to_POSSESSED, "errors[ERR_INVALID_CONDEMNATION_STATE]"]
        distinguishing_aspect: "grant-possession on a condemnation still in FILED (no deposit) returns ERR_INVALID_CONDEMNATION_STATE (409)."
        test_recipe:
          setup: ["A condemnation in FILED (no deposit yet)."]
          setup_api_calls:
            - call: "POST /projects"
              payload: { name: "PJ", agency_name: "DOT", total_budget_cents: 100000000 }
              as: ProgramAdmin
              captures: { proj_id: $.data.id }
            - call: "POST /parcels"
              payload: { project_id: "${proj_id}", apn: "APN-C13", total_area_sqft: 10000, take_area_sqft: 5000, take_type: "PARTIAL" }
              as: RightOfWayAgent
              captures: { parcel_id: $.data.id }
            - call: "POST /parcels/${parcel_id}/ownership-interests"
              payload: { interest_type: "FEE_OWNER", holder_name: "O", ownership_pct: 100 }
              as: RightOfWayAgent
              captures: { oi_id: $.data.id }
            - call: "POST /parcels/${parcel_id}/clear-ownership"
              payload: {}
