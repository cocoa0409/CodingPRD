              captures: { err: $.data.error_id }
          assert:
            - "response.status == 422"
            - "response.data.error_id == ERR_AMOUNT_MISMATCH"

      - name: priority_existence_beats_state_on_unknown_transaction_settle
        claim_type: Priority Ordering
        grounds:
          - "validations[priority=3]"
          - "validations[priority=10]"
          - "errors[ERR_NOT_FOUND]"
        distinguishing_aspect: "Settling a non-existent transaction id -> existence (priority 3) wins over state (priority 10): ERR_NOT_FOUND (404)."
        test_recipe:
          setup: ["An ACTIVE seller s exists (used as the acting role); no transaction with the cited id."]
          setup_api_calls:
            - call: "POST /sellers"
              payload: { legal_name: "S", origin_state_code: "CA" }
              as: PlatformAdmin
              as_user_id: "admin-1"
              captures: { s_id: $.data.id }
          trigger:
            - call: "POST /transactions/00000000-0000-4000-8000-000000000000/settle"
              payload: {}
              as: Seller
              as_user_id: "${s_id}"
              captures: { err: $.data.error_id }
          assert:
            - "response.status == 404"
            - "response.data.error_id == ERR_NOT_FOUND"

  # =========================================================================
  # Errors — remaining catalog entries triggerable
  # =========================================================================
  - section: errors
    instances:
      - name: error_stale_version_already_covered_by_concurrency
        claim_type: violation_to_error
        grounds:
          - "errors[ERR_STALE_VERSION]"
          - "concurrency_rules[remit-stale-return]"
        excluded_because:
          difficulty_instance: boundary_precision_check / nexus_sales_threshold_inclusive_at_exact_value
          rationale: "ERR_STALE_VERSION is enumerated separately under cross_cutting OCC below; this errors-row stub avoids double-counting. See cross_cutting.optimistic_concurrency.remit_stale_expected_version_returns_412."

      - name: error_certificate_overlap_already_covered
        claim_type: violation_to_error
        grounds:
          - "errors[ERR_CERTIFICATE_OVERLAP]"
        excluded_because:
          difficulty_instance: resource_temporal_overlap / certificate_halfopen_overlap_adjacency_allowed
          rationale: "ERR_CERTIFICATE_OVERLAP is asserted as the failure of the named §1.8 instance."

      - name: error_return_period_overlap_already_covered
        claim_type: violation_to_error
        grounds:
          - "errors[ERR_RETURN_PERIOD_OVERLAP]"
        excluded_because:
          difficulty_instance: resource_temporal_overlap / return_closed_overlap_adjacency_forbidden
          rationale: "ERR_RETURN_PERIOD_OVERLAP is asserted as the failure of the named §1.8 instance."

  # =========================================================================
  # RBAC — denials and segregation of duties
  # =========================================================================
  - section: rbac
    instances:
      - name: seller_cannot_create_tax_jurisdiction_returns_unauthorized
        claim_type: exclusive_op_denied
        grounds:
          - roles
          - endpoints
          - "errors[ERR_UNAUTHORIZED]"
        distinguishing_aspect: "A Seller calling POST /tax-jurisdictions (a PlatformAdmin-exclusive op) -> ERR_UNAUTHORIZED (403)."
        test_recipe:
          setup: ["An ACTIVE seller s exists."]
          setup_api_calls:
            - call: "POST /sellers"
              payload: { legal_name: "S", origin_state_code: "CA" }
              as: PlatformAdmin
              as_user_id: "admin-1"
              captures: { s_id: $.data.id }
          trigger:
            - call: "POST /tax-jurisdictions"
              payload: { state_code: "CA", sourcing_rule: "DESTINATION", state_rate: 0.0725, local_rate: 0.0100, reduced_rate: 0.02, economic_nexus_sales_threshold: 100000.00, economic_nexus_txn_threshold: 0 }
              as: Seller
              as_user_id: "${s_id}"
              captures: { err: $.data.error_id }
          assert:
            - "response.status == 403"
            - "response.data.error_id == ERR_UNAUTHORIZED"

      - name: preparer_cannot_accept_return_returns_unauthorized
        claim_type: exclusive_op_denied
        grounds:
          - roles
          - endpoints
          - "errors[ERR_UNAUTHORIZED]"
        distinguishing_aspect: "A TaxPreparer calling POST /tax-returns/{id}/accept (a TaxApprover-exclusive op) -> ERR_UNAUTHORIZED (403); segregation enforced at the role level."
        test_recipe:
          setup: ["CA jurisdiction; seller s; a DRAFT return prepared by preparer-1."]
          setup_api_calls:
            - call: "POST /tax-jurisdictions"
              payload: { state_code: "CA", sourcing_rule: "DESTINATION", state_rate: 0.0725, local_rate: 0.0100, reduced_rate: 0.02, economic_nexus_sales_threshold: 100000.00, economic_nexus_txn_threshold: 0 }
              as: PlatformAdmin
              as_user_id: "admin-1"
              captures: { ca_id: $.data.id }
            - call: "POST /sellers"
              payload: { legal_name: "S", origin_state_code: "CA" }
              as: PlatformAdmin
              as_user_id: "admin-1"
              captures: { s_id: $.data.id }
            - call: "POST /tax-returns"
              payload: { seller_id: "${s_id}", jurisdiction_id: "${ca_id}", period_start: "2026-02-01T00:00:00Z", period_end: "2026-03-01T00:00:00Z" }
              as: TaxPreparer
              as_user_id: "preparer-1"
              captures: { ret_id: $.data.id }
          trigger:
            - call: "POST /tax-returns/${ret_id}/accept"
              payload: {}
              as: TaxPreparer
              as_user_id: "preparer-1"
              captures: { err: $.data.error_id }
          assert:
            - "response.status == 403"
            - "response.data.error_id == ERR_UNAUTHORIZED"

      - name: missing_headers_returns_unauthenticated
        claim_type: unauthenticated
        grounds:
          - "validations[priority=1]"
          - "errors[ERR_UNAUTHENTICATED]"
        distinguishing_aspect: "A request with an unknown X-User-Role -> ERR_UNAUTHENTICATED (401) before any business logic."
        test_recipe:
          setup: ["Empty DB."]
          setup_api_calls: []
          trigger:
            - call: "GET /tax-jurisdictions"
              payload: {}
              as: Ghost
              as_user_id: "nobody"
              captures: { err: $.data.error_id }
          assert:
            - "response.status == 401"
            - "response.data.error_id == ERR_UNAUTHENTICATED"

      - name: segregation_of_duties_same_user_already_covered
        claim_type: segregation_of_duties
        grounds:
          - "validations[priority=11]"
          - "errors[ERR_SEGREGATION_OF_DUTIES]"
        excluded_because:
          difficulty_instance: priority_pair_validation_conflict / segregation_beats_nexus_on_accept_draft
          rationale: "Same-user accept (X-User-ID == prepared_by) producing ERR_SEGREGATION_OF_DUTIES is asserted in the named §1.8 instance."

  # =========================================================================
  # Cross-Cutting Complexity Layers
  # =========================================================================
  - section: cross_cutting
    instances:
      - name: remit_stale_expected_version_returns_412
        claim_type: optimistic_concurrency
        grounds:
          - "concurrency_rules[remit-stale-return]"
          - "validations[priority=16]"
          - "errors[ERR_STALE_VERSION]"
          - entities.TaxReturn.fields.version
        distinguishing_aspect: "A remittance create carrying expected_tax_return_version one less than the return's current version (stale, after acceptance/file bumped it) -> ERR_STALE_VERSION (412)."
        test_recipe:
          setup: ["CA jurisdiction; seller s REGISTERED; one SETTLED SELLER txn; a FILED return whose version advanced past the client's captured value."]
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-02-15T00:00:00Z" }
              as: PlatformAdmin
              as_user_id: "admin-1"
            - call: "POST /tax-jurisdictions"
              payload: { state_code: "CA", sourcing_rule: "DESTINATION", state_rate: 0.0725, local_rate: 0.0100, reduced_rate: 0.02, economic_nexus_sales_threshold: 100000.00, economic_nexus_txn_threshold: 0 }
              as: PlatformAdmin
              as_user_id: "admin-1"
              captures: { ca_id: $.data.id }
            - call: "POST /product-categories"
              payload: { jurisdiction_id: "${ca_id}", category_code: "TANGIBLE", taxability: "FULL" }
              as: PlatformAdmin
              as_user_id: "admin-1"
            - call: "POST /sellers"
              payload: { legal_name: "S", origin_state_code: "CA" }
              as: PlatformAdmin
              as_user_id: "admin-1"
              captures: { s_id: $.data.id }
            - call: "POST /nexus-profiles"
              payload: { seller_id: "${s_id}", jurisdiction_id: "${ca_id}" }
              as: Seller
              as_user_id: "${s_id}"
              captures: { np_id: $.data.id }
            - call: "POST /transactions"
              payload: { seller_id: "${s_id}", jurisdiction_id: "${ca_id}", customer_ref: "big", customer_exempt_requested: false }
              as: Seller
              as_user_id: "${s_id}"
              captures: { t_big_id: $.data.id }
            - call: "POST /line-items"
              payload: { transaction_id: "${t_big_id}", category_code: "TANGIBLE", quantity: 1, unit_price: 100000.00 }
              as: Seller
              as_user_id: "${s_id}"
            - call: "POST /transactions/${t_big_id}/settle"
              payload: {}
              as: Seller
              as_user_id: "${s_id}"
            - call: "POST /nexus-profiles/${np_id}/register"
              payload: {}
              as: Seller
              as_user_id: "${s_id}"
            - call: "POST /transactions"
              payload: { seller_id: "${s_id}", jurisdiction_id: "${ca_id}", customer_ref: "small", customer_exempt_requested: false }
              as: Seller
              as_user_id: "${s_id}"
              captures: { t_id: $.data.id }
            - call: "POST /line-items"
              payload: { transaction_id: "${t_id}", category_code: "TANGIBLE", quantity: 1, unit_price: 10.00 }
              as: Seller
              as_user_id: "${s_id}"
            - call: "POST /transactions/${t_id}/settle"
              payload: {}
              as: Seller
              as_user_id: "${s_id}"
            - call: "POST /tax-returns"
              payload: { seller_id: "${s_id}", jurisdiction_id: "${ca_id}", period_start: "2026-02-01T00:00:00Z", period_end: "2026-03-01T00:00:00Z" }
              as: TaxPreparer
              as_user_id: "preparer-1"
              captures: { ret_id: $.data.id }
            - call: "POST /tax-returns/${ret_id}/accept"
              payload: {}
              as: TaxApprover
              as_user_id: "approver-1"
            - call: "POST /tax-returns/${ret_id}/file"
              payload: {}
              as: TaxApprover
              as_user_id: "approver-1"
              captures: { v_filed: $.data.version }
          trigger:
            - call: "POST /remittance-payments"
              payload: { tax_return_id: "${ret_id}", amount: 0.83, expected_tax_return_version: "${v_filed} - 1" }
              as: TaxApprover
              as_user_id: "approver-1"
              captures: { err: $.data.error_id }
          assert:
            - "response.status == 412"
            - "response.data.error_id == ERR_STALE_VERSION"

      - name: derived_nexus_status_reconciled_on_read_after_settle
        claim_type: derived_field_reconciliation
        grounds:
          - calculations.nexus_status
          - entities.NexusProfile.fields.nexus_status
        distinguishing_aspect: "NexusProfile.nexus_status read after a sub-threshold settle stays NO_NEXUS (cumulative 7.95 < threshold 100000); derived field consistent with source on read."
        test_recipe:
          setup: ["CA jurisdiction threshold 100000.00; seller s; CA NexusProfile; one SETTLED SELLER txn subtotal 7.95."]
          setup_api_calls:
            - call: "POST /tax-jurisdictions"
              payload: { state_code: "CA", sourcing_rule: "DESTINATION", state_rate: 0.0725, local_rate: 0.0100, reduced_rate: 0.02, economic_nexus_sales_threshold: 100000.00, economic_nexus_txn_threshold: 0 }
              as: PlatformAdmin
              as_user_id: "admin-1"
              captures: { ca_id: $.data.id }
            - call: "POST /product-categories"
              payload: { jurisdiction_id: "${ca_id}", category_code: "TANGIBLE", taxability: "FULL" }
              as: PlatformAdmin
              as_user_id: "admin-1"
            - call: "POST /sellers"
              payload: { legal_name: "S", origin_state_code: "CA" }
              as: PlatformAdmin
              as_user_id: "admin-1"
              captures: { s_id: $.data.id }
            - call: "POST /nexus-profiles"
              payload: { seller_id: "${s_id}", jurisdiction_id: "${ca_id}" }
              as: Seller
              as_user_id: "${s_id}"
              captures: { np_id: $.data.id }
            - call: "POST /transactions"
              payload: { seller_id: "${s_id}", jurisdiction_id: "${ca_id}", customer_ref: "b1", customer_exempt_requested: false }
              as: Seller
              as_user_id: "${s_id}"
              captures: { t_id: $.data.id }
            - call: "POST /line-items"
              payload: { transaction_id: "${t_id}", category_code: "TANGIBLE", quantity: 1, unit_price: 7.95 }
              as: Seller
              as_user_id: "${s_id}"
            - call: "POST /transactions/${t_id}/settle"
              payload: {}
              as: Seller
              as_user_id: "${s_id}"
          trigger:
            - call: "GET /nexus-profiles/${np_id}"
              payload: {}
              as: Seller
              as_user_id: "${s_id}"
              captures: { st: $.data.nexus_status, cum: $.data.cumulative_taxable_sales }
          assert:
            - "NexusProfile.${np_id}.nexus_status == NO_NEXUS"
            - "NexusProfile.${np_id}.cumulative_taxable_sales == 7.95"

      - name: cascade_marketplace_facilitated_does_not_accrue_nexus
        claim_type: cascading_side_effects
        grounds:
          - calculations.remittance_responsibility
          - entities.NexusProfile.fields.cumulative_taxable_sales
        excluded_because:
          difficulty_instance: dual_variant_calc / remittance_responsibility_marketplace_vs_seller_diverge
          rationale: "The marketplace-facilitated zero-accrual side-effect is asserted in the named §1.8 instance."

  # =========================================================================
  # Consistency model (immediate)
  # =========================================================================
  - section: consistency_model
    instances:
      - name: settle_response_reflects_computed_tax_immediately
        claim_type: immediate
        grounds:
          - calculations.line_item_tax
          - entities.Transaction.fields.tax_collected
        distinguishing_aspect: "The settle response itself carries the computed tax_collected (immediate consistency) — no re-read needed; one FULL line qty1 @10.00 -> 0.83."
        test_recipe:
          setup: ["CA jurisdiction; TANGIBLE=FULL; seller s; PENDING CA txn with one TANGIBLE line qty1 @10.00."]
          setup_api_calls:
            - call: "POST /tax-jurisdictions"
              payload: { state_code: "CA", sourcing_rule: "DESTINATION", state_rate: 0.0725, local_rate: 0.0100, reduced_rate: 0.02, economic_nexus_sales_threshold: 100000.00, economic_nexus_txn_threshold: 0 }
              as: PlatformAdmin
              as_user_id: "admin-1"
              captures: { ca_id: $.data.id }
            - call: "POST /product-categories"
              payload: { jurisdiction_id: "${ca_id}", category_code: "TANGIBLE", taxability: "FULL" }
              as: PlatformAdmin
              as_user_id: "admin-1"
            - call: "POST /sellers"
              payload: { legal_name: "S", origin_state_code: "CA" }
              as: PlatformAdmin
              as_user_id: "admin-1"
              captures: { s_id: $.data.id }
            - call: "POST /transactions"
              payload: { seller_id: "${s_id}", jurisdiction_id: "${ca_id}", customer_ref: "b1", customer_exempt_requested: false }
              as: Seller
              as_user_id: "${s_id}"
              captures: { t_id: $.data.id }
            - call: "POST /line-items"
              payload: { transaction_id: "${t_id}", category_code: "TANGIBLE", quantity: 1, unit_price: 10.00 }
              as: Seller
              as_user_id: "${s_id}"
          trigger:
            - call: "POST /transactions/${t_id}/settle"
              payload: {}
              as: Seller
              as_user_id: "${s_id}"
              captures: { tc: $.data.tax_collected }
          assert:
            - "response.data.tax_collected == 0.83"
