          - errors[ERR_SHADE_BAND_NOT_APPROVABLE]
          - calculations.shade_band_assignment
        distinguishing_aspect: |
          The legal disposition set is a function of the assigned band, and the two sets are not
          complements: a band-A lot may be APPROVEd but not REDYEd, while a band-OUT lot may be
          REDYEd but not APPROVEd. Both lots sit in the identical MEASURED state, so only the
          measured colour distinguishes them.
