              payload: { vendor_id: "${v_id}", name: "Shadow Quiz", category: "ASSESSMENT", grade_band_low: 6, grade_band_high: 8, sso_protocol: "NONE", accessibility_conformance_level: "NONE", vpat_on_file: false }
              as: PrivacyOfficeAdmin
              captures: { app_id: $.data.id }
            - call: "POST /telemetry-detections"
              payload: { observed_domain: "quiz.shadow.example", application_id: "${app_id}", school_code: "MS-04", source: "NETWORK_DNS", observed_at: "2026-07-31T12:00:00Z", distinct_user_count: 30, session_count: 120 }
              as: TelemetryAgent
              captures: { det_id: $.data.id }
          trigger:
            - call: "POST /telemetry-detections/${det_id}/triage"
              payload: { disposition: "ESCALATE", note: "Unauthorized use at MS-04." }
              as: PrivacyOfficeAdmin
              captures: { inc_id: $.data.linked_incident_id }
            - call: "GET /vendor-incidents/${inc_id}"
