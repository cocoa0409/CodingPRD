        distinguishing_aspect: "Publishing moves the only declared non-terminal RateCard transition and stamps published_at with the logical clock 2026-08-01T00:00:00Z; the same card is invisible on the rate board while DRAFT (line_count 0) and appears with buy 970600 / sell 878600 immediately after."
        test_recipe:
