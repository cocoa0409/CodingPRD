              as: ProgramOperator
              captures: { unit_a_id: "$.data.id" }
            - call: "POST /properties/${prop_id}/activate"
              payload: {}
              as: ProgramOperator
            - call: "POST /properties/${prop_id}/units"
              payload: { unit_label: "A-201", hvac_system_type: "TWO_STAGE", filter_slot_count: 1, return_grille_count: 1, nominal_size_code: "16x25x1" }
              as: ProgramOperator
              captures: { unit_b_id: "$.data.id" }
            - call: "POST /residents"
              payload: { full_name: "Ada Reyes", email: "ada.reyes@example.com", household_size: 3, has_pets: false, smoker: false, allergy_flag: false }
              as: ProgramOperator
              captures: { res_a_id: "$.data.id" }
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-08-05T00:00:00Z" }
              as: ProgramOperator
            - call: "POST /subscriptions"
              payload: { resident_id: "${res_a_id}", unit_id: "${unit_a_id}", billing_party: "PROPERTY_MANAGER", enrollment_channel: "MOVE_IN_PACKET", lease_start_date: "2026-08-01", lease_end_date: "2027-07-31" }
              as: ProgramOperator
              captures: { sub_a_id: "$.data.id" }
            - call: "POST /subscriptions/${sub_a_id}/activate"
              payload: {}
              as: ProgramOperator
              captures: { stale_version: "$.data.version" }
            - call: "POST /subscriptions/${sub_a_id}/renewal-surveys"
              payload: { installed_last_shipment: true, filters_on_hand_count: 1, self_reported_change_date: "2026-08-05" }
              as: ProgramOperator
            - call: "GET /subscriptions/${sub_a_id}"
              payload: {}
              as: ProgramOperator
              captures: { fresh_version: "$.data.version" }
          trigger:
            - call: "POST /subscription-transfers"
              payload: { subscription_id: "${sub_a_id}", to_unit_id: "${unit_b_id}", effective_date: "2026-08-05", expected_subscription_version: "${stale_version}" }
              as: ProgramOperator
