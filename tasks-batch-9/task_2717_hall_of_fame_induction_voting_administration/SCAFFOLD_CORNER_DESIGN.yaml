          - state_machines.Ballot.OPEN_to_CLOSED
          - entities.Ballot.fields.credentialed_roster_at_close
        distinguishing_aspect: |
          One endpoint, two target states chosen by the clock rather than by the payload: called
          before closes_at it produces CLOSED, called at or after closes_at it produces EXPIRED. Both
          branches still snapshot credentialed_roster_at_close (2 credentialed electors), so the
          snapshot cannot be used to tell the branches apart - only voting_status can, and EXPIRED is
          terminal, so the recorded submission is void and the cycle needs a replacement ballot.
