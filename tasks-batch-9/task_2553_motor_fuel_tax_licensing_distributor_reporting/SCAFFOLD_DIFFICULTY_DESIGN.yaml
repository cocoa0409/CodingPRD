  - rule_id: resource_temporal_overlap
    instances:
      - name: exemption_certificate_closed_interval_shared_endpoint_collides
        grounds:
          - validations[priority=301]
          - errors[ERR_CERTIFICATE_PERIOD_OVERLAP]
          - entities.ExemptionCertificate.fields.valid_from
          - entities.ExemptionCertificate.fields.valid_to
          - validations[priority=412]
        distinguishing_aspect: |
          Resource is an ExemptionCertificate slot keyed on (purchaser_licensee_id, exemption_type) and
          the interval semantics are CLOSED DAY intervals: a new window starting on the very last day of
          the existing one (2026-06-30) collides with ERR_CERTIFICATE_PERIOD_OVERLAP, the next day
          (2026-07-01) is accepted, and the same 2026-01-01..2026-06-30 window is accepted for a
          different exemption_type because the resource key includes the type.
        test_recipe:
          setup:
            - "One ACTIVE RETAILER government fleet (required bond 400000, posted 400000)."
            - "One ACTIVE GOVERNMENT certificate for that fleet valid 2026-01-01..2026-06-30."
            - "Clock left at its 2026-08-01T00:00:00Z default."
          setup_api_calls:
            - call: "POST /mft/licensees"
              payload: { legal_name: "Dakota County Fleet Services", fein: "41-2000001", license_type: "RETAILER", mailing_state: "MN" }
              as: LicensingOfficer
              captures: { gov_id: $.data.id, gov_v0: $.data.version }
            - call: "POST /mft/licensees/${gov_id}/bonds"
              payload: { amount_cents: 400000, surety_name: "Granite Surety Co", effective_date: "2026-07-01", expected_licensee_version: "${gov_v0}" }
              as: LicensingOfficer
            - call: "POST /mft/licensees/${gov_id}/activate"
              payload: {}
              as: LicensingOfficer
            - call: "POST /mft/exemption-certificates"
              payload: { purchaser_licensee_id: "${gov_id}", exemption_type: "GOVERNMENT", document_number: "GOV-CERT-2553-H1", valid_from: "2026-01-01", valid_to: "2026-06-30" }
              as: LicensingOfficer
              captures: { cert_h1_id: $.data.id }
          trigger:
            - call: "POST /mft/exemption-certificates"
              payload: { purchaser_licensee_id: "${gov_id}", exemption_type: "GOVERNMENT", document_number: "GOV-CERT-2553-TOUCH", valid_from: "2026-06-30", valid_to: "2026-12-31" }
              as: LicensingOfficer
            - call: "POST /mft/exemption-certificates"
              payload: { purchaser_licensee_id: "${gov_id}", exemption_type: "GOVERNMENT", document_number: "GOV-CERT-2553-H2", valid_from: "2026-07-01", valid_to: "2026-12-31" }
              as: LicensingOfficer
              captures: { cert_h2_id: $.data.id }
            - call: "POST /mft/exemption-certificates"
              payload: { purchaser_licensee_id: "${gov_id}", exemption_type: "AGRICULTURE", document_number: "AG-CERT-2553-H1", valid_from: "2026-01-01", valid_to: "2026-06-30" }
              as: LicensingOfficer
              captures: { cert_ag_id: $.data.id }
          assert:
            - "the 2026-06-30 start returns 422 with error_id == ERR_CERTIFICATE_PERIOD_OVERLAP (closed intervals share the endpoint day)"
            - "the 2026-07-01 start returns 201: ExemptionCertificate.${cert_h2_id}.status == ACTIVE with valid_from 2026-07-01 and valid_to 2026-12-31"
            - "the AGRICULTURE window returns 201: ExemptionCertificate.${cert_ag_id}.valid_from == 2026-01-01 and valid_to == 2026-06-30, overlapping the GOVERNMENT window legally"
            - "ExemptionCertificate.${cert_h1_id}.status == ACTIVE and its window is unchanged"
            - "GET /mft/exemption-certificates filtered by purchaser_licensee_id == ${gov_id} returns total_count 3"

      - name: audit_case_period_buffer_collides_across_one_month_gap
        grounds:
          - validations[priority=302]
          - errors[ERR_AUDIT_PERIOD_OVERLAP]
          - entities.AuditCase.fields.period_start_month
          - entities.AuditCase.fields.period_end_month
          - calculations.cross_match_variance
        distinguishing_aspect: |
          Resource is an AuditCase examination window keyed on subject_licensee_id and the interval
          semantics are MONTH-granular windows widened by AUDIT_PERIOD_BUFFER_MONTHS on both ends - a
          different semantics from the certificate's raw closed-day intervals: 2026-07..2026-08 collides
          with an existing 2026-03..2026-05 case despite a one-month calendar gap, while 2026-08..2026-09
          is accepted.
        test_recipe:
          setup:
            - "One ACTIVE fully bonded DISTRIBUTOR subject."
            - "One OPEN AuditCase on that subject over 2026-03..2026-05, selection_method ROADSIDE_REFERRAL."
            - "Clock left at its 2026-08-01T00:00:00Z default."
          setup_api_calls:
            - call: "POST /mft/licensees"
              payload: { legal_name: "Ridgeway Fuel Distribution Inc", fein: "41-1000002", license_type: "DISTRIBUTOR", mailing_state: "MN", gross_net_election: "NET" }
              as: LicensingOfficer
              captures: { dist_id: $.data.id, dist_v0: $.data.version }
            - call: "POST /mft/licensees/${dist_id}/bonds"
              payload: { amount_cents: 1500000, surety_name: "Granite Surety Co", effective_date: "2026-07-01", expected_licensee_version: "${dist_v0}" }
              as: LicensingOfficer
            - call: "POST /mft/licensees/${dist_id}/activate"
              payload: {}
              as: LicensingOfficer
            - call: "POST /mft/audit-cases"
              payload: { subject_licensee_id: "${dist_id}", selection_method: "ROADSIDE_REFERRAL", period_start_month: "2026-03", period_end_month: "2026-05" }
              as: AuditManager
              as_user_id: "aud-01"
              captures: { case_spring_id: $.data.id }
          trigger:
            - call: "POST /mft/audit-cases"
              payload: { subject_licensee_id: "${dist_id}", selection_method: "ROADSIDE_REFERRAL", period_start_month: "2026-07", period_end_month: "2026-08" }
              as: AuditManager
              as_user_id: "aud-01"
            - call: "POST /mft/audit-cases"
              payload: { subject_licensee_id: "${dist_id}", selection_method: "ROADSIDE_REFERRAL", period_start_month: "2026-08", period_end_month: "2026-09" }
              as: AuditManager
              as_user_id: "aud-01"
              captures: { case_late_id: $.data.id }
          assert:
            - "the 2026-07..2026-08 case returns 422 with error_id == ERR_AUDIT_PERIOD_OVERLAP (2026-03..2026-05 widens to 2026-02..2026-06 and 2026-07..2026-08 widens to 2026-06..2026-09, so both cover 2026-06)"
            - "the 2026-08..2026-09 case returns 201: AuditCase.${case_late_id}.case_status == OPEN with period_start_month 2026-08 and period_end_month 2026-09"
            - "AuditCase.${case_spring_id}.case_status == OPEN and its window is unchanged"
            - "Licensee.${dist_id}.open_audit_count == 2 (the refused case was never created)"
            - "GET /mft/audit-cases filtered by subject_licensee_id == ${dist_id} returns total_count 2"

  - rule_id: compensating_invariant
    instances:
      - name: assessment_then_abatement_restores_licensee_balance_invariant_m
        grounds:
          - calculations.licensee_balance
          - calculations.assessment_amounts
          - state_machines.AuditCase.NONE_to_ISSUED
          - state_machines.AuditCase.ISSUED_to_ABATED
          - entities.LedgerEntry.fields.entry_type
          - validations[priority=505]
          - validations[priority=107]
        distinguishing_aspect: |
          Conserved quantity is MONEY (Invariant M: Licensee.balance_cents == sum of its
          LedgerEntry.amount_cents): issuing a 278750-cent assessment and then abating it returns
          balance_cents to exactly its pre-assessment 500000 while all three ledger rows are retained,
          so the compensation is an offsetting entry and never a deletion or an in-place edit.
        test_recipe:
          setup:
            - "One ACTIVE SUPPLIER counterparty and one ACTIVE fully bonded DISTRIBUTOR subject."
            - "Clock at 2026-09-05T00:00:00Z; the distributor's FILED 2026-08 return carries SCH_2 GASOLINE 17482.52 gallons, so tax_due_cents is exactly 500000 and balance_cents is 500000."
            - "One AuditCase over 2026-08..2026-08 opened by AuditManager aud-01 and advanced to PRELIM_FINDINGS."
            - "Clock then moved to 2026-11-19T23:59:59Z, exactly 60 days past the period's due instant."
          setup_api_calls:
            - call: "POST /mft/licensees"
              payload: { legal_name: "Northline Fuel Supply LLC", fein: "41-1000001", license_type: "SUPPLIER", mailing_state: "MN", gross_net_election: "NET" }
              as: LicensingOfficer
              captures: { sup_id: $.data.id, sup_v0: $.data.version }
            - call: "POST /mft/licensees/${sup_id}/bonds"
              payload: { amount_cents: 1500000, surety_name: "Granite Surety Co", effective_date: "2026-07-01", expected_licensee_version: "${sup_v0}" }
              as: LicensingOfficer
            - call: "POST /mft/licensees/${sup_id}/activate"
              payload: {}
              as: LicensingOfficer
            - call: "POST /mft/licensees"
              payload: { legal_name: "Ridgeway Fuel Distribution Inc", fein: "41-1000002", license_type: "DISTRIBUTOR", mailing_state: "MN", gross_net_election: "NET" }
              as: LicensingOfficer
              captures: { dist_id: $.data.id, dist_v0: $.data.version }
            - call: "POST /mft/licensees/${dist_id}/bonds"
              payload: { amount_cents: 1500000, surety_name: "Granite Surety Co", effective_date: "2026-07-01", expected_licensee_version: "${dist_v0}" }
              as: LicensingOfficer
            - call: "POST /mft/licensees/${dist_id}/activate"
              payload: {}
              as: LicensingOfficer
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-09-05T00:00:00Z" }
              as: ReturnsExaminer
            - call: "POST /mft/returns"
              payload: { licensee_id: "${dist_id}", period_month: "2026-08" }
              as: ReturnsExaminer
              captures: { d_ret_id: $.data.id }
            - call: "POST /mft/returns/${d_ret_id}/schedules"
              payload: { schedule_code: "SCH_2_RECEIVED_TAX_UNPAID", product_code: "GASOLINE", total_gallons: 17482.52 }
              as: ReturnsExaminer
              captures: { d_sch_gas: $.data.id }
            - call: "POST /mft/schedules/${d_sch_gas}/lines"
              payload: { counterparty_licensee_id: "${sup_id}", transaction_type: "PURCHASE", gallons: 17482.52, document_date: "2026-08-08", bill_of_lading_number: "BOL-D2-GAS-040" }
              as: ReturnsExaminer
            - call: "POST /mft/returns/${d_ret_id}/file"
              payload: { attest_name: "D. Ridgeway" }
              as: ReturnsExaminer
            - call: "POST /mft/audit-cases"
              payload: { subject_licensee_id: "${dist_id}", selection_method: "ROADSIDE_REFERRAL", period_start_month: "2026-08", period_end_month: "2026-08" }
              as: AuditManager
              as_user_id: "aud-01"
              captures: { case_id: $.data.id }
            - call: "POST /mft/audit-cases/${case_id}/advance"
              payload: { to_status: "FIELDWORK" }
              as: AuditManager
              as_user_id: "aud-01"
            - call: "POST /mft/audit-cases/${case_id}/advance"
              payload: { to_status: "PRELIM_FINDINGS" }
              as: AuditManager
              as_user_id: "aud-01"
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-11-19T23:59:59Z" }
              as: AuditManager
              as_user_id: "aud-01"
          trigger:
            - call: "POST /mft/audit-cases/${case_id}/assessments"
              payload: { additional_tax_cents: 250000, evasion_indicator: false }
              as: TaxSupervisor
              as_user_id: "sup-01"
            - call: "POST /mft/audit-cases/${case_id}/abate"
              payload: { abatement_reason: "Fieldwork re-read of the terminal schedules withdrew the deficiency" }
              as: TaxSupervisor
              as_user_id: "sup-02"
          assert:
            - "after the assessment: AuditCase.${case_id}.assessed_total_cents == 278750 (250000 tax + 25000 penalty + 3750 interest) and Licensee.${dist_id}.balance_cents == 778750"
            - "after the abatement: AuditCase.${case_id}.assessment_status == ABATED and Licensee.${dist_id}.balance_cents == 500000, exactly its pre-assessment value"
            - "AuditCase.${case_id}.assessed_total_cents is still 278750 after the abatement (the figures are retained, not zeroed)"
            - "GET /mft/licensees/${dist_id}/ledger-entries returns exactly three rows: RETURN_TAX +500000, ASSESSMENT +278750, ABATEMENT -278750"
            - "the three ledger amount_cents values sum to 500000, equal to Licensee.${dist_id}.balance_cents (Invariant M)"
            - "AuditCase.${case_id}.assessed_by_user_id == sup-01 while the abating user is sup-02, so priority 107 is satisfied"
            - "AuditCase.${case_id}.case_status == PRELIM_FINDINGS (the money compensation moved no case_status)"

      - name: discrepancy_write_off_conserves_run_gross_unreported_gallons
        grounds:
          - state_machines.MatchDiscrepancy.RESPONSE_RECEIVED_to_WRITTEN_OFF
          - entities.CrossMatchRun.fields.gross_unreported_gallons_total
          - entities.CrossMatchRun.fields.unreported_gallons_total
          - entities.CrossMatchRun.fields.written_off_gallons_total
          - entities.Licensee.fields.unreported_gallons_total
          - validations[priority=409]
        distinguishing_aspect: |
          Conserved quantity is GALLONS, not money: writing off one 3000.00-gallon discrepancy moves
          those gallons from CrossMatchRun.unreported_gallons_total into written_off_gallons_total while
          gross_unreported_gallons_total stays at 7000.00, so the identity
          gross == unreported + written_off holds before and after the compensating action.
        test_recipe:
          setup:
            - "One ACTIVE SUPPLIER and one ACTIVE fully bonded DISTRIBUTOR; clock at 2026-09-05T00:00:00Z."
            - "The supplier's FILED 2026-08 return reports SCH_5 GASOLINE 3000.00 and SCH_5 UNDYED_DIESEL 4000.00 gallons delivered to the distributor."
            - "The distributor's FILED 2026-08 return reports only SCH_1 BIODIESEL_B100 100.00 gallons, so both cells are fully unreported."
            - "A cross-match run for 2026-08 creates two OPEN discrepancies (3000.00 GASOLINE and 4000.00 UNDYED_DIESEL), both below the 10000.00 write-off ceiling."
            - "The GASOLINE discrepancy is then walked OPEN -> INQUIRY_SENT -> RESPONSE_RECEIVED, the only from-state the machine declares for a WRITTEN_OFF resolve."
          setup_api_calls:
            - call: "POST /mft/licensees"
              payload: { legal_name: "Northline Fuel Supply LLC", fein: "41-1000001", license_type: "SUPPLIER", mailing_state: "MN", gross_net_election: "NET" }
              as: LicensingOfficer
              captures: { sup_id: $.data.id, sup_v0: $.data.version }
            - call: "POST /mft/licensees/${sup_id}/bonds"
              payload: { amount_cents: 1500000, surety_name: "Granite Surety Co", effective_date: "2026-07-01", expected_licensee_version: "${sup_v0}" }
              as: LicensingOfficer
            - call: "POST /mft/licensees/${sup_id}/activate"
              payload: {}
              as: LicensingOfficer
            - call: "POST /mft/licensees"
              payload: { legal_name: "Ridgeway Fuel Distribution Inc", fein: "41-1000002", license_type: "DISTRIBUTOR", mailing_state: "MN", gross_net_election: "NET" }
              as: LicensingOfficer
              captures: { dist_id: $.data.id, dist_v0: $.data.version }
            - call: "POST /mft/licensees/${dist_id}/bonds"
              payload: { amount_cents: 1500000, surety_name: "Granite Surety Co", effective_date: "2026-07-01", expected_licensee_version: "${dist_v0}" }
              as: LicensingOfficer
            - call: "POST /mft/licensees/${dist_id}/activate"
              payload: {}
              as: LicensingOfficer
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-09-05T00:00:00Z" }
              as: ReturnsExaminer
            - call: "POST /mft/returns"
              payload: { licensee_id: "${sup_id}", period_month: "2026-08" }
              as: ReturnsExaminer
              captures: { s_ret_id: $.data.id }
            - call: "POST /mft/returns/${s_ret_id}/schedules"
              payload: { schedule_code: "SCH_5_DELIVERED_TAX_COLLECTED", product_code: "GASOLINE", total_gallons: 3000.00 }
              as: ReturnsExaminer
              captures: { s_sch_gas: $.data.id }
            - call: "POST /mft/schedules/${s_sch_gas}/lines"
              payload: { counterparty_licensee_id: "${dist_id}", transaction_type: "SALE", gallons: 3000.00, document_date: "2026-08-10", bill_of_lading_number: "BOL-S5-GAS-050" }
              as: ReturnsExaminer
            - call: "POST /mft/returns/${s_ret_id}/schedules"
              payload: { schedule_code: "SCH_5_DELIVERED_TAX_COLLECTED", product_code: "UNDYED_DIESEL", total_gallons: 4000.00 }
              as: ReturnsExaminer
              captures: { s_sch_und: $.data.id }
            - call: "POST /mft/schedules/${s_sch_und}/lines"
              payload: { counterparty_licensee_id: "${dist_id}", transaction_type: "SALE", gallons: 4000.00, document_date: "2026-08-11", bill_of_lading_number: "BOL-S5-UND-050" }
              as: ReturnsExaminer
            - call: "POST /mft/returns/${s_ret_id}/file"
              payload: { attest_name: "S. Northline" }
              as: ReturnsExaminer
            - call: "POST /mft/returns"
              payload: { licensee_id: "${dist_id}", period_month: "2026-08" }
              as: ReturnsExaminer
              captures: { d_ret_id: $.data.id }
            - call: "POST /mft/returns/${d_ret_id}/schedules"
              payload: { schedule_code: "SCH_1_RECEIVED_TAX_PAID", product_code: "BIODIESEL_B100", total_gallons: 100.00 }
              as: ReturnsExaminer
              captures: { d_sch_bio: $.data.id }
            - call: "POST /mft/schedules/${d_sch_bio}/lines"
              payload: { counterparty_licensee_id: "${sup_id}", transaction_type: "PURCHASE", gallons: 100.00, document_date: "2026-08-12", bill_of_lading_number: "BOL-D1-BIO-050" }
              as: ReturnsExaminer
            - call: "POST /mft/returns/${d_ret_id}/file"
              payload: { attest_name: "D. Ridgeway" }
              as: ReturnsExaminer
            - call: "POST /mft/cross-match-runs"
              payload: { period_month: "2026-08" }
              as: ReturnsExaminer
              captures: { run_id: $.data.id }
            - call: "GET /mft/discrepancies"
              payload: { run_id: "${run_id}", product_code: "GASOLINE" }
              as: ReturnsExaminer
              captures: { disc_gas_id: "$.data[0].id" }
            - call: "GET /mft/discrepancies"
              payload: { run_id: "${run_id}", product_code: "UNDYED_DIESEL" }
              as: ReturnsExaminer
              captures: { disc_und_id: "$.data[0].id" }
            - call: "POST /mft/discrepancies/${disc_gas_id}/inquiries"
              payload: { question: "Your 2026-08 return reports no GASOLINE receipts from Northline; explain the 3000.00 gallon gap", response_due_date: "2026-09-30" }
              as: ReturnsExaminer
            - call: "POST /mft/discrepancies/${disc_gas_id}/responses"
              payload: { explanation: "The supplier billed a load that our terminal never received; the counterparty has since ceased trading" }
              as: LicenseeAgent
              as_user_id: "${dist_id}"
          trigger:
            - call: "POST /mft/discrepancies/${disc_gas_id}/resolve"
              payload: { resolution: "WRITTEN_OFF", write_off_reason: "Counterparty ceased trading; the gallons are uncollectible" }
              as: ReturnsExaminer
          assert:
            - "before the write-off: CrossMatchRun.${run_id}.discrepancy_count == 2, gross_unreported_gallons_total == 7000.00, unreported_gallons_total == 7000.00, written_off_gallons_total == 0.00"
            - "before the write-off: MatchDiscrepancy.${disc_gas_id}.status == RESPONSE_RECEIVED with inquiry_round == 1, and the inquiry/response round changed none of the run counters"
            - "after the write-off: CrossMatchRun.${run_id}.gross_unreported_gallons_total == 7000.00 (unchanged)"
            - "after the write-off: CrossMatchRun.${run_id}.unreported_gallons_total == 4000.00 and written_off_gallons_total == 3000.00, so gross == unreported + written_off"
            - "MatchDiscrepancy.${disc_gas_id}.status == WRITTEN_OFF with variance_gallons still 3000.00"
            - "MatchDiscrepancy.${disc_und_id}.status == OPEN with variance_gallons 4000.00"
            - "Licensee.${dist_id}.open_discrepancy_count == 1 and unreported_gallons_total == 4000.00"
            - "MonthlyReturn.${d_ret_id}.match_status == MATCH_VARIANCE (one discrepancy is still live)"
            - "Licensee.${dist_id}.balance_cents == 0 (a gallons write-off posts no LedgerEntry)"
