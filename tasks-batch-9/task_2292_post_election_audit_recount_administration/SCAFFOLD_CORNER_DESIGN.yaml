              as: ElectionsDirector
              captures: { p2_id: "$.data.id" }
          trigger:
            - call: "POST /contests/${p1_id}/canvass-results"
              payload: { reported_votes: { KING: 8011, LOWE: 7988 } }
              as: ElectionsDirector
              captures: { p1_mv: "$.data.margin_votes", p1_pct: "$.data.margin_pct", p1_auto: "$.data.automatic_recount_required" }
            - call: "POST /contests/${p2_id}/canvass-results"
              payload: { reported_votes: { MOORE: 3050, NASH: 2950 } }
              as: ElectionsDirector
              captures: { p2_mv: "$.data.margin_votes", p2_pct: "$.data.margin_pct", p2_auto: "$.data.automatic_recount_required" }
          assert:
            - "${p1_mv} == 23 and ${p1_pct} == 0.1438 and ${p1_auto} == true"
            - "${p2_mv} == 100 and ${p2_pct} == 1.6667 and ${p2_auto} == false"
            - "Contest.${p1_id}.winner_name == KING and Contest.${p2_id}.winner_name == MOORE"
            - "both contests report margin_pct with exactly 4 decimal places"
      - name: identical_seed_and_pool_produce_the_same_draw_prefix
        claim_type: Correct Result
        grounds:
          - calculations.batch_selection_sequence
          - entities.AuditRound.fields.selection_sequence
          - entities.AuditBatch.fields.selection_index
          - entities.BallotBatch.fields.retrieval_authorized_at
        distinguishing_aspect: |
          Two audits on the same contest seeded with the same ten digits draw the same prefix in the same
          order - [B-003, B-004, B-005] for the 3-batch risk-limiting sample and [B-003, B-004] for the
          2-batch comparison sample - because the pool is rebuilt per audit and the LCG advances before each
