# =============================================================================
# Scaffold Difficulty Design (Test Targeting Index) — section 1.8
# Task: task_1410_playtest_recruitment_feedback_program
# 9 rules x >=2 instances = 19 instances. Every instance grounds in SCAFFOLD.yaml
# sections 1.1-1.7 and drives empty-DB state via declared section-1.5 endpoints.
# =============================================================================

scaffold_difficulty_design:
  # ---------------------------------------------------------------------------
  # Rule 1: dual-variant calculations on DIFFERENT entity domains
  # ---------------------------------------------------------------------------
  - rule_id: dual_variant_calc
    instances:
      - name: screening_fit_provisional_vs_verified
        grounds:
          - calculations.screening_fit_score
          - entities.ScreeningApplication.fields.fit_score_provisional
          - entities.ScreeningApplication.fields.fit_score_final
        distinguishing_aspect: |
          Same application, same study: the self_reported variant (platform basis =
          participant.platform_tags) yields 100 while the verified variant
          (platform basis = participant.verified_platform_tags narrowed to ["PS5"])
          yields 70 on the ScreeningApplication domain — a different entity domain
          from the payout variant instance.
        test_recipe:
          setup:
            - "Clock at 2026-08-01T00:00:00Z; participant age 25, region US-W, platforms [PC, PS5], ACTIVE; study RECRUITING with min_age 18, max_age 35, allowed_regions [US-W], required_platforms [PC]; NDA v1 PUBLISHED; application SUBMITTED then UNDER_REVIEW; attributes verified down to [PS5]"
          setup_api_calls:
            - call: "POST /playtests/_clock/set_current_utc"
              payload: { to_iso8601: "2026-08-01T00:00:00Z" }
              as: ResearchOpsAdmin
            - call: "POST /playtests/participants"
              payload: { email: "dv1-p@x.com", full_name: "DV One", age_years: 25, region_code: "US-W", platform_tags: ["PC", "PS5"] }
              as: ResearchOpsAdmin
              captures: { p_id: "$.data.id"}
            - call: "POST /playtests/participants/${p_id}/activate"
              payload: {}
              as: ResearchOpsAdmin
            - call: "POST /playtests/studies"
              payload: { title: "DV Study", code: "DV1", min_age: 18, max_age: 35, allowed_regions: ["US-W"], required_platforms: ["PC"], cohort_capacity: 10, incentive_budget_cents: 1000000 }
              as: ResearchOpsAdmin
              captures: { s_id: "$.data.id"}
            - call: "POST /playtests/studies/${s_id}/open-recruitment"
              payload: {}
              as: ResearchOpsAdmin
            - call: "POST /playtests/nda-agreements"
              payload: { study_id: "${s_id}", version_label: "v1", body_text: "NDA text v1" }
              as: LegalCounsel
              captures: { nda_id: "$.data.id"}
            - call: "POST /playtests/nda-agreements/${nda_id}/publish"
              payload: {}
              as: LegalCounsel
            - call: "POST /playtests/applications"
              payload: { study_id: "${s_id}" }
              as: Participant
              as_user_id: "${p_id}"
              captures: { app_id: "$.data.id", prov_score: "$.data.fit_score_provisional"}
            - call: "POST /playtests/applications/${app_id}/start-review"
              payload: {}
              as: Researcher
            - call: "POST /playtests/participants/${p_id}/verify-attributes"
              payload: { verified_platform_tags: ["PS5"] }
              as: ResearchOpsAdmin
          trigger:
            - call: "POST /playtests/applications/${app_id}/approve"
              payload: {}
              as: Researcher
              captures: { final_score: "$.data.fit_score_final", app_status: "$.data.status", pinned: "$.data.pinned_nda_agreement_id"}
          assert:
            - "captured prov_score == 100"
            - "captured final_score == 70"
            - "prov_score != final_score (identical application data, divergent variants)"
            - "app_status == APPROVED"
            - "pinned == ${nda_id}"
      - name: incentive_provisional_vs_final_recompute
        grounds:
          - calculations.incentive_amount
          - entities.IncentivePayout.fields.amount_provisional_cents
          - entities.IncentivePayout.fields.amount_final_cents
        distinguishing_aspect: |
          On the IncentivePayout domain (different entity domain from
          ScreeningApplication), the provisional variant frozen at draft creation
          is 13500 while the final variant recomputed at approve subtracts the
          no-show penalty and yields 11500 for the same underlying data.
        test_recipe:
          setup:
            - "Participant P enrolled in study S (budget 1000000); moderator M assigned to three REMOTE sessions A (10:00-11:00), B (12:00-13:00), C (14:00-15:00) on 2026-08-10; P ATTENDED A and B, NO_SHOW on C; one PUBLISHED instrument with a submitted passed response for session A"
