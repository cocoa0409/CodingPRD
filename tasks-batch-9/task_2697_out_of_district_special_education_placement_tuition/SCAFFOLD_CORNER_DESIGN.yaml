  # ===========================================================================
  # Table 4 (Validations) - violation -> error and satisfaction -> pass across
  # the ladder (p1, p4, p10, p11, p12, p13), plus the conditional / temporal
  # validation patterns; the priority-conflict, cross-entity, cascading and
  # aggregate rows are already discharged in §1.8.
  # ===========================================================================
  - section: validations
    instances:
      - name: priority_ladder_returns_401_unauthenticated_then_403_then_404_before_any_400
        claim_type: Priority Ordering
        grounds:
          - "validations[priority=1]"
          - "validations[priority=2]"
          - "validations[priority=3]"
          - "validations[priority=4]"
          - "validations[priority=5]"
          - "errors[ERR_UNAUTHENTICATED]"
          - "errors[ERR_ROLE_NOT_PERMITTED]"
          - "errors[ERR_PLACEMENT_NOT_FOUND]"
          - "errors[ERR_INVALID_REQUEST]"
          - "errors[ERR_STUDENT_NOT_FOUND]"
        distinguishing_aspect: |
          The validation ladder is TOTAL, and this instance walks its top five rungs by violating
          several at once in every trigger and demanding the highest-priority answer each time.
          Trigger 1 violates rungs 1, 2, 3 and 4 simultaneously and must answer 401. Trigger 2 drops
          the auth defect and must answer 403, not the 404 it also earns. Trigger 3 drops the role
          defect and finally gets its 404. Trigger 4 pairs a malformed body with an unresolvable body
          FK and must answer 400, because shape precedes reference. Trigger 5 pairs an unresolvable
          body FK with an out-of-scope actor and must answer 404, because reference precedes scope.
          Each step down the ladder changes exactly one thing, so an implementation with the rungs in
          the wrong order cannot pass all five by accident. The lower rungs (8 over 13, 9 over 10, 11
          over 12) are exercised by the priority_pair_validation_conflict instances in the difficulty
          design.
        test_recipe:
          setup:
            - "Clock at the default 2026-08-01T00:00:00Z."
            - "DistrictFiscalAccount FY2027 authorized_cents 100000000, Harbor Academy APPROVED with a STATE_APPROVED FY2027 schedule."
            - "One Student, one APPROVED DAY PlacementDecision and one PROPOSED Placement whose contract has NOT been executed."
