  # ===========================================================================
  - rule_id: boundary_precision_check
    instances:
      - name: detour_allowance_inclusive_equality_accepted_next_step_rejected
        grounds:
          - calculations.corridor_travel_geometry.detour_allowance_minutes
          - validations.priority_44.ERR_DETOUR_TOLERANCE_EXCEEDED
          - entities.VehicleBlock.fields.committed_index_min
        distinguishing_aspect: |
          Exercises the INCLUSIVE detour comparison at exact equality, with the allowance itself
          coming from the max() branch that the floor wins: baseline 6 minutes gives
          ceil(6 * 0.25) == 2, so detour_allowance_minutes == max(6, 2) == 6. Two blocks that differ
          only in already-committed corridor span (0..4 versus 0..5) receive the SAME S0->S2 trip
          geometry: the first yields projected_detour_minutes == 6 which must be ACCEPTED because the
          comparison is <=, the second yields 9 which must be rejected. An implementation using
          strict < rejects the first; one that uses the percentage instead of the floor computes an
          allowance of 2 and rejects both.
        test_recipe:
          setup:
            - "Zone RBM-DTR ACTIVE with detour_tolerance_pct 0.25, detour_tolerance_floor_minutes 6 and curb_capacity_per_bucket 6 (raised so the shared S0 curb bucket never becomes the binding constraint at priority 40)."
            - "Approved stops S0 (index 0), S2 (index 2), S4 (index 4) and S5 (index 5); TRAVEL_MINUTES_PER_INDEX is 3."
            - "Blocks BA (V1/D1) and BB (V2/D2) are both OPEN 06:00-10:00Z on 6-seat vehicles with 0 WAV positions."
            - "Anchor trip TA (S0->S4) is offered on BA, giving BA committed_index_min 0 / committed_index_max 4; anchor trip TB (S0->S5) is offered on BB, giving BB span 0..5. Each anchor sits on an empty block at offer time, so both anchors have projected_detour_minutes 0."
            - "Boundary trips T_OK and T_BAD are identical S0->S2 requests (baseline_direct_minutes 6, allowance 6) held by two different riders so no fare-cap interaction is possible."
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-08-03T06:00:00Z" }
              as: ZoneAdmin
            - call: "POST /service-zones"
              payload: { name: "Riverbend Detour Lab", zone_code: "RBM-DTR", max_walk_meters: 600, detour_tolerance_pct: 0.25, detour_tolerance_floor_minutes: 6, base_fare_cents: 250, fare_cap_cents_daily: 600, fare_cap_cents_weekly: 2500, on_time_window_minutes: 10, curb_capacity_per_bucket: 6 }
              as: ZoneAdmin
              captures: { z_id: $.data.id }
            - call: "POST /service-zones/${z_id}/activate"
              payload: {}
              as: ZoneAdmin
            - call: "POST /virtual-stops"
              payload: { zone_id: "${z_id}", stop_code: "S0", corridor_index: 0, walk_shed_meters: 400, accessibility: "ACCESSIBLE_PATH" }
              as: ZoneAdmin
              captures: { s0_id: $.data.id }
            - call: "POST /virtual-stops/${s0_id}/approve"
              payload: {}
              as: ZoneAdmin
            - call: "POST /virtual-stops"
              payload: { zone_id: "${z_id}", stop_code: "S2", corridor_index: 2, walk_shed_meters: 400, accessibility: "ACCESSIBLE_PATH" }
              as: ZoneAdmin
              captures: { s2_id: $.data.id }
            - call: "POST /virtual-stops/${s2_id}/approve"
              payload: {}
              as: ZoneAdmin
            - call: "POST /virtual-stops"
              payload: { zone_id: "${z_id}", stop_code: "S4", corridor_index: 4, walk_shed_meters: 400, accessibility: "ACCESSIBLE_PATH" }
              as: ZoneAdmin
              captures: { s4_id: $.data.id }
            - call: "POST /virtual-stops/${s4_id}/approve"
              payload: {}
              as: ZoneAdmin
            - call: "POST /virtual-stops"
              payload: { zone_id: "${z_id}", stop_code: "S5", corridor_index: 5, walk_shed_meters: 400, accessibility: "ACCESSIBLE_PATH" }
              as: ZoneAdmin
              captures: { s5_id: $.data.id }
            - call: "POST /virtual-stops/${s5_id}/approve"
              payload: {}
              as: ZoneAdmin
            - call: "POST /vehicles"
              payload: { zone_id: "${z_id}", vehicle_code: "V1", seat_capacity: 6, wav_positions: 0 }
              as: ZoneAdmin
