              captures: { pool_c9_paid_2: "$.data.paid_claims_cents", pool_c9_ratio_2: "$.data.loss_ratio_bps", pool_c9_deficit_2: "$.data.deficit_flag" }
            - call: "GET /ipa/delegation-agreements/${agr_c9}"
              as: IpaAdmin
              captures: { agr_c9_posture_2: "$.data.capitation_posture" }
            - call: "POST /ipa/downstream-claims/${clm_c9b}/state"
              payload: { to_state: "VOIDED" }
              as: ClaimsExaminer
              captures: { clm_c9b_status: "$.data.status" }
            - call: "GET /ipa/risk-pools/${pool_c9}"
              as: IpaAdmin
              captures: { pool_c9_paid_3: "$.data.paid_claims_cents", pool_c9_ratio_3: "$.data.loss_ratio_bps", pool_c9_deficit_3: "$.data.deficit_flag" }
            - call: "GET /ipa/enrollees/${e_c9}"
              as: IpaAdmin
              captures: { e_c9_cumulative_3: "$.data.cumulative_paid_claims_cents" }
            - call: "GET /ipa/delegation-agreements/${agr_c9}"
              as: IpaAdmin
              captures: { agr_c9_posture_3: "$.data.capitation_posture" }
            - call: "GET /ipa/downstream-claims"
              payload: { pool_id: "${pool_c9}", status: "PAID", limit: 10, offset: 0 }
              as: ClaimsExaminer
          assert:
            - "${file_c9_status} == \"POSTED\" and RiskPool.${pool_c9}.funded_cents == 20000"
            - "${pool_c9_paid_1} == 8000, ${pool_c9_ratio_1} == 4000, ${pool_c9_deficit_1} == false"
            - "${pool_c9_paid_2} == 20000, ${pool_c9_ratio_2} == 10000, ${pool_c9_deficit_2} == true — 10000 bps is strictly above the 9500 bps threshold"
            - "${agr_c9_posture_2} == \"UNDER_REVIEW\""
            - "${clm_c9b_status} == \"VOIDED\" and DownstreamClaim.${clm_c9b}.paid_cents == null — the recoup nulls the paid amount"
            - "${pool_c9_paid_3} == 8000 (not 20000, not 0), ${pool_c9_ratio_3} == 4000, ${pool_c9_deficit_3} == false — the flag unlatches"
            - "${e_c9_cumulative_3} == 8000 — the enrollee ledger reverses by exactly the voided paid_cents"
            - "${agr_c9_posture_3} == \"CURRENT\" — no DISPUTED remittance and no deficit pool remain"
            - "call 9 returns exactly 1 row, total_count == 1 (the surviving 8000 claim)"
            - "RiskPool.${pool_c9}.stop_loss_eligible_enrollee_count == 0 throughout — 20000 never reached the 5000000 attachment"

      - name: prorated_capitation_rounds_per_member_before_summation
        claim_type: precision
        grounds:
          - calculations.expected_capitation_for_coverage_month
        excluded_because:
          difficulty_instance: combinatorial_formula / prorated_capitation_round_per_member_then_sum
          rationale: "That §1.8 instance asserts the pinned per-member-then-sum rounding order on a three-enrollee roster (86275 versus the sum-then-round 86274), which is exactly the precision claim for this calculation."

      - name: capitation_reconciliation_variants_diverge_on_the_same_roster
        claim_type: variant_divergence
        grounds:
          - calculations.expected_capitation_for_coverage_month
        excluded_because:
          difficulty_instance: dual_variant_calc / capitation_reconciliation_variant_divergence_on_remittance
          rationale: "Both ROSTER_SNAPSHOT and MEMBER_MONTHS_PRORATED are driven over the identical roster there, with the delta asserted on expected_capitation_cents and member_month_count_bps."

      - name: pool_deficit_threshold_is_strictly_greater_than_9500_bps
        claim_type: threshold
        grounds:
          - calculations.pool_loss_ratio_and_deficit
        excluded_because:
          difficulty_instance: boundary_precision_check / pool_deficit_flag_strict_greater_at_9500_bps
          rationale: "That §1.8 instance tests the ratio at exactly 9500 bps (no deficit) and at 9501 bps (deficit) on the same pool, covering threshold-1 / at-threshold / threshold+1 for this rule."

      - name: settlement_tier_boundaries_and_marginal_admin_rate
        claim_type: tiered_pricing
        grounds:
          - calculations.pool_settlement_waterfall
        excluded_because:
          difficulty_instance: combinatorial_formula / settlement_tier_pinned_before_admin_fee
          rationale: "The tier is keyed on the pre-fee ratio there, with the forbidden post-fee re-tiering (TIER_3 -> TIER_2, 1674 -> 1395) asserted as the wrong answer, which covers the tier-boundary and marginal-rate claims."

      - name: settlement_waterfall_fills_buckets_in_pinned_order
        claim_type: waterfall_allocation
        grounds:
          - calculations.pool_settlement_waterfall
        excluded_because:
          difficulty_instance: combinatorial_formula / settlement_tier_pinned_before_admin_fee
          rationale: "S1..S9 are walked in order with every intermediate literal asserted in that §1.8 instance; re-testing bucket ordering here would duplicate it."

      - name: assignment_intervals_are_half_open_so_adjacency_is_not_overlap
        claim_type: interval_merge
        grounds:
          - validations.priority_19_ERR_ASSIGNMENT_PERIOD_OVERLAP
        excluded_because:
          difficulty_instance: resource_temporal_overlap / assignment_half_open_adjacency_allowed_then_overlap_rejected
          rationale: "Gap-zero adjacency (accepted) and a one-instant overlap (rejected) are both driven there on the same enrollee, which is the adjacent-versus-overlapping interval claim."

      - name: posture_propagates_through_the_funding_chain_to_a_fixed_point
        claim_type: constraint_propagation
        grounds:
          - calculations.capitation_posture_derivation
        excluded_because:
          difficulty_instance: transitive_cascade / enrollment_file_post_funding_cascade_depth_five
          rationale: "The L1..L5 POSTED cascade there is precisely the propagation chain reaching its fixed point (remittance -> pool funding -> loss ratio -> posture -> panel closure)."

      - name: ibnr_reserve_looks_forward_from_the_paid_triangle
        claim_type: forward_looking
        grounds:
          - calculations.ibnr_reserve_estimate
        excluded_because:
          difficulty_instance: dual_variant_calc / ibnr_reserve_variant_divergence_on_risk_pool
          rationale: "That §1.8 instance asserts both reserve variants and their input-set restriction to PAID claims, including re-evaluation after a claim moves into PAID, which is the forward-looking claim."

  # ===========================================================================
  - section: validations
    instances:

      - name: agreement_pool_shares_not_summing_to_10000_rejected
        claim_type: violation_to_error
        grounds:
          - validations.priority_21_ERR_POOL_SHARE_SUM_INVALID
          - endpoints.POST_/ipa/delegation-agreements
        distinguishing_aspect: |
          professional_pool_share_bps 6000 with institutional_pool_share_bps 3000
          are each individually a legal basis-point value in [0, 10000], so
          ERR_INVALID_REQUEST (priority 3) must NOT fire; the pair only fails the
          sum rule at priority 21, which returns ERR_POOL_SHARE_SUM_INVALID with
          HTTP 422. An implementation that folds this into request validation
          returns 400 and fails.
        test_recipe:
          setup:
            - "No fixture beyond the logical clock; the agreement create is the trigger."
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { current_utc: "2026-08-01T00:00:00Z" }
              as: IpaAdmin
          trigger:
            - call: "POST /ipa/delegation-agreements"
              payload: { payer_name: "Corner Share Sum Health", payer_tax_id: "94-3000061", delegation_scope: "FULL_RISK", base_pmpm_cents: 20000, reconciliation_method: "ROSTER_SNAPSHOT", ibnr_method: "COMPLETION_FACTOR", ibnr_completion_factor_bps: 8000, target_claims_pmpm_cents: 15000, professional_pool_share_bps: 6000, institutional_pool_share_bps: 3000, quality_withhold_bps: 700, stop_loss_attachment_cents: 5000000, reinsurance_recovery_bps: 9000, max_panel_size: 5 }
              as: IpaAdmin
              captures: { share_sum_error: "$.data.error_id" }
          assert:
            - "HTTP 422 and ${share_sum_error} == \"ERR_POOL_SHARE_SUM_INVALID\" (not ERR_INVALID_REQUEST, not 400)"
            - "no DelegationAgreement with payer_tax_id \"94-3000061\" exists afterwards"

      - name: agreement_pool_shares_summing_to_10000_accepted
        claim_type: satisfaction_to_pass
        grounds:
          - validations.priority_21_ERR_POOL_SHARE_SUM_INVALID
          - endpoints.POST_/ipa/delegation-agreements
        distinguishing_aspect: |
          The mirror of the violation case: 6000 + 4000 == 10000 satisfies the
          rule and the create must return 201 with both shares echoed, proving
          the check is an equality on the sum and not a rejection of any
          particular split. A DRAFT → ACTIVE activation on the same agreement
          re-checks the same sum at the transition and must also pass.
        test_recipe:
          setup:
            - "No fixture beyond the logical clock."
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { current_utc: "2026-08-01T00:00:00Z" }
              as: IpaAdmin
          trigger:
            - call: "POST /ipa/delegation-agreements"
              payload: { payer_name: "Corner Share Sum Ok Health", payer_tax_id: "94-3000062", delegation_scope: "FULL_RISK", base_pmpm_cents: 20000, reconciliation_method: "ROSTER_SNAPSHOT", ibnr_method: "COMPLETION_FACTOR", ibnr_completion_factor_bps: 8000, target_claims_pmpm_cents: 15000, professional_pool_share_bps: 6000, institutional_pool_share_bps: 4000, quality_withhold_bps: 700, stop_loss_attachment_cents: 5000000, reinsurance_recovery_bps: 9000, max_panel_size: 5 }
              as: IpaAdmin
              captures: { agr_v2: "$.data.id", agr_v2_prof: "$.data.professional_pool_share_bps", agr_v2_inst: "$.data.institutional_pool_share_bps" }
            - call: "POST /ipa/delegation-agreements/${agr_v2}/state"
              payload: { to_state: "ACTIVE" }
              as: IpaAdmin
              captures: { agr_v2_status: "$.data.status" }
          assert:
            - "HTTP 201 on call 1 with ${agr_v2_prof} == 6000 and ${agr_v2_inst} == 4000"
            - "${agr_v2_status} == \"ACTIVE\" — the same sum rule is re-checked as a DRAFT -> ACTIVE precondition and passes"
            - "DelegationAgreement.${agr_v2}.capitation_posture == \"CURRENT\""

      - name: notice_given_error_precedes_period_overlap_error
        claim_type: priority_ordering
        grounds:
          - validations.priority_15_ERR_ASSIGNMENT_BEFORE_COVERAGE
          - validations.priority_18_ERR_ASSIGNMENT_PERIOD_OVERLAP
        excluded_because:
          difficulty_instance: priority_pair_validation_conflict / assignment_before_coverage_wins_over_period_overlap
          rationale: "That §1.8 instance violates both rules with one request and asserts the lower-priority-number error is returned, then fixes only the coverage clause to expose the overlap error underneath — the two-rules-violated claim in full."

      - name: panel_capacity_error_is_masked_by_the_earlier_credential_check
        claim_type: priority_conflict
        grounds:
          - validations.priority_9_ERR_PHYSICIAN_NOT_ACCEPTING_ASSIGNMENTS
          - validations.priority_27_ERR_PANEL_CAPACITY_EXCEEDED
        excluded_because:
          difficulty_instance: priority_pair_validation_conflict / physician_notice_given_wins_over_full_panel_capacity
          rationale: "A single request there violates priority 9 and priority 27 at once and must return the priority 9 error; the capacity error is then exposed by repairing only the credential status."

      - name: panel_capacity_counts_the_collective_not_the_single_assignment
        claim_type: aggregate_validation
        grounds:
          - validations.priority_27_ERR_PANEL_CAPACITY_EXCEEDED
        excluded_because:
          difficulty_instance: priority_pair_validation_conflict / physician_notice_given_wins_over_full_panel_capacity
          rationale: "That fixture fills a panel to max_panel_size with individually valid assignments and then asserts the aggregate limit rejects the next one, which is exactly the aggregate-validation claim."

      - name: enrollment_file_row_gate_runs_before_the_matched_row_gate
        claim_type: cascading_validation
        grounds:
          - validations.priority_22_ERR_ENROLLMENT_FILE_EMPTY
        excluded_because:
          difficulty_instance: boundary_precision_check / enrollment_file_row_count_boundary_at_zero_then_one
          rationale: "Both clauses of the rule are driven in order there (row_count >= 1 for PARSED, then matched_row_count >= 1 for RECONCILED), so check B is shown to run only after check A passes."

      - name: assignment_across_two_agreements_rejected_then_same_agreement_accepted
        claim_type: cross_entity_validation
        grounds:
          - validations.priority_12_ERR_AGREEMENT_MISMATCH
          - endpoints.POST_/ipa/member-assignments
        distinguishing_aspect: |
          Both the enrollee and the physician exist and are individually
          assignable, so no NOT_FOUND and no state error applies; the request is
          invalid only because they belong to different DelegationAgreements.
          Repointing the same enrollee at its OWN agreement's physician then
          succeeds, which proves the check is a cross-entity comparison rather
          than a blanket rejection.
        test_recipe:
          setup:
            - "Two ACTIVE agreements AGR_V5A and AGR_V5B, each with one ACTIVE physician; the enrollee lives on AGR_V5A."
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { current_utc: "2026-08-01T00:00:00Z" }
              as: IpaAdmin
            - call: "POST /ipa/delegation-agreements"
              payload: { payer_name: "Corner Mismatch A Health", payer_tax_id: "94-3000063", delegation_scope: "FULL_RISK", base_pmpm_cents: 20000, reconciliation_method: "ROSTER_SNAPSHOT", ibnr_method: "COMPLETION_FACTOR", ibnr_completion_factor_bps: 8000, target_claims_pmpm_cents: 15000, professional_pool_share_bps: 6000, institutional_pool_share_bps: 4000, quality_withhold_bps: 700, stop_loss_attachment_cents: 5000000, reinsurance_recovery_bps: 9000, max_panel_size: 5 }
