      - "RoleRequisition -> WITHDRAWN from DRAFT, SCOPING, SOURCING or TRIALING"
      - "cancels every SCHEDULED / IN_PROGRESS TrialEngagement of the requisition with cancel_reason CLIENT_REQUEST, restoring each candidate's availability_status to AVAILABLE"
      - "rejects every PROPOSED / COUNTERED AccommodationTerm of the requisition"
