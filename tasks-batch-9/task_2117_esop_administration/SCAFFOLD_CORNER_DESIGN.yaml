  # =========================================================================
  - section: errors
    instances:

      - name: missing_auth_headers_return_unauthenticated
        claim_type: violation_to_error
        grounds:
          - validations[priority=1]
          - errors[ERR_UNAUTHENTICATED]
        distinguishing_aspect: "A request with no X-User-Role and no X-User-ID returns ERR_UNAUTHENTICATED (401) before any existence or state check runs, so a non-existent plan id still yields 401 rather than 404."
        test_recipe:
          setup: ["Empty database."]
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-03-02T00:00:00Z" }
              as: PlanSponsor
              as_user_id: "sponsor-01"
          trigger:
            - call: "GET /plans/8a3e1c0b-2f4d-4a91-9c8b-12e7b6a0f1d2"
              payload: {}
              as: ""
              captures: { err: $.data.error_id }
          assert:
            - "the response error_id == ERR_UNAUTHENTICATED with HTTP 401"
            - "the response error_id != ERR_PLAN_NOT_FOUND, proving auth precedes existence"
            - "an unrecognised X-User-Role such as Auditor also returns ERR_UNAUTHENTICATED (401)"

      - name: every_not_found_error_id_is_reachable
        claim_type: violation_to_error
        grounds:
          - errors[ERR_PARTICIPANT_NOT_FOUND]
          - errors[ERR_VALUATION_NOT_FOUND]
          - errors[ERR_LOAN_NOT_FOUND]
          - errors[ERR_LOAN_PAYMENT_NOT_FOUND]
          - errors[ERR_RUN_NOT_FOUND]
          - errors[ERR_ALLOCATION_NOT_FOUND]
          - errors[ERR_FORFEITURE_NOT_FOUND]
          - errors[ERR_ELECTION_NOT_FOUND]
          - errors[ERR_INSTALLMENT_NOT_FOUND]
          - errors[ERR_EXERCISE_NOT_FOUND]
          - errors[ERR_STATEMENT_NOT_FOUND]
        distinguishing_aspect: "Each single-resource GET returns its own entity-specific 404 code for an unmatched UUID, so the eleven not-found codes are distinguishable from one another rather than collapsing into a generic ERR_NOT_FOUND."
        test_recipe:
          setup: ["Empty database."]
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-03-02T00:00:00Z" }
