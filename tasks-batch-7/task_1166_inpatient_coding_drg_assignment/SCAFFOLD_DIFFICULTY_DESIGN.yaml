            - { call: "POST /coders", payload: { employee_no: "E-BP2A", full_name: "Sub One", credential: "CCS" }, as: CodingManager, captures: { s1_id: $.data.id } }
            - { call: "POST /coders", payload: { employee_no: "E-BP2B", full_name: "Sub Two", credential: "CCS" }, as: CodingManager, captures: { s2_id: $.data.id } }
            - { call: "POST /coders", payload: { employee_no: "E-BP2C", full_name: "Aud Three", credential: "RHIA" }, as: CodingManager, captures: { auditor_id: $.data.id } }
            # --- S1 chart with 20 lines
