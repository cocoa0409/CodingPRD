- section: errors
  instances:
  - name: error_envelope_shape
    claim_type: violation_to_error
    grounds:
    - response_envelope
    - errors[ERR_CUSTOMER_NOT_FOUND]
    distinguishing_aspect: 'Error responses use the fixed envelope: response_type == error with data.error_id and data.message present; success
      responses carry meta.api_request_id and meta.api_request_timestamp.'
    test_recipe:
      setup:
      - one customer exists
      setup_api_calls:
      - call: POST /_clock/set_current_utc
        payload:
          to_iso8601: '2026-08-01T00:00:00Z'
        as: PlatformAdmin
      - call: POST /customers
        payload:
          name: ENV
          contact_email: env@x.com
          credit_limit_cents: 1000
        as: CustomerServiceRep
        captures:
          ok_id: $.data.id
      trigger:
      - call: GET /customers/00000000-0000-0000-0000-000000000000
        as: Any
        captures:
          err: $.data.error_id
          msg: $.data.message
      assert:
      - 'success envelope: meta.api_request_id and meta.api_request_timestamp present, response_type == object'
      - 'error envelope: response_type == error, data.error_id == ERR_CUSTOMER_NOT_FOUND, data.message is a non-empty string'
  - name: err_variant_below_minimum_covered
    claim_type: violation_to_error
    grounds:
    - errors[ERR_VARIANT_BELOW_MINIMUM]
    excluded_because:
      difficulty_instance: variant_minimum_exact_boundary
      rationale: Boundary instance asserts 100 passes / 99 fails with this exact error_id.
  - name: err_qc_hold_requires_repress_covered
    claim_type: violation_to_error
    grounds:
    - errors[ERR_QC_HOLD_REQUIRES_REPRESS]
    excluded_because:
      difficulty_instance: reject_rate_strictly_greater_boundary
      rationale: HOLD-then-ACCEPT rejection asserted there.
  - name: err_credit_limit_exceeded_covered
    claim_type: violation_to_error
    grounds:
    - errors[ERR_CREDIT_LIMIT_EXCEEDED]
    excluded_because:
      difficulty_instance: credit_limit_inclusive_boundary
      rationale: One-cent-short confirm failure asserted there.
