            - "the 307.000 RECEIVE is 409 ERR_CORE_MASS_VARIANCE_EXCEEDED - the tolerance is 2 percent of 300.000, i.e. exactly +/- 6.000 kg"
            - "${recv_a} == 306.000 and ${core_a2} == RECEIVED   # 306.000 == 300.000 * 1.02 exactly, and the boundary is inclusive"
            - "${core_a3} == RECYCLED and ${core_b2} == RECEIVED"
            - "${mb2_inv} == 9400.000 and ${mb2_field} == 0.000 and ${mb2_rec} == 600.000 and ${mb2_var} == 0.000   # mass moved field -> recycled at RECEIVE; RECYCLE moved no mass a second time"
