            - { call: "POST /v1/rotation-shifts", payload: { technician_id: "${t1}", start_at: "2026-08-03T00:00:00Z", end_at: "2026-08-03T08:00:00Z" }, as: PropertyAdmin, captures: { shB: $.data.id } }
            - { call: "POST /v1/rotation-shifts/${shA}/start", as: PropertyAdmin }
            - { call: "POST /v1/call-tickets", payload: { unit_id: "${u1}", caller_name: "Caller I", caller_phone: "555-0110", category: "NO_HEAT", description: "Furnace out" }, as: Dispatcher, captures: { tk: $.data.id } }
            - { call: "POST /v1/call-tickets/${tk}/triage", payload: { is_true_emergency: true }, as: Dispatcher }
