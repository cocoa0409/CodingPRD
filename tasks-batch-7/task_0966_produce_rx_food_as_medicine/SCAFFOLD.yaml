# =============================================================================
# Task 0966: Produce-Rx & Food-as-Medicine Program
# Scaffold seed tables (§1.0–§1.7)
# =============================================================================

scenario: |
  966. Produce-Rx & Food-as-Medicine Program: clinic referral & enrollment,
  benefit/voucher allocation, retailer/market redemption, nutrition education
  & tracking, produce incentive (Double-Up), A1c/outcome, funder reporting,
  renewal

domain_name: produce-rx-food-as-medicine
api_prefix: "/"

complexity_profile:
  primary_archetype: "Quota / allocation"
  secondary_archetype: "Ledger reconciliation"
  complexity_layers:
    - optimistic_concurrency
    - cascading_side_effects
    - dual_variant_calculation
    - rate_threshold_triggers
    - ops_run_checkpoint
  entity_topology: flat
  state_machine_shape: cyclic
  relationship_patterns: [one_to_many, cross_aggregate]
  role_model: segregation_of_duties
  consistency_model: immediate

response_envelope:
  success: |
    { "meta": { "api_request_id": "req_xxx", "api_request_timestamp": "ISO8601" },
      "response_type": "object" | "array", "data": {} }
  error: |
    { "meta": { ... }, "response_type": "error",
      "data": { "error_id": "ERR_XXX", "message": "..." } }
  pagination_fields: ["limit", "offset", "total_count", "has_more"]
  pagination_defaults: { limit: 10, min: 1, max: 100, offset: 0 }

# =============================================================================
# §1.1 Entity-Relationship Table (flat topology; all FK links in bodies)
# =============================================================================
entities:
  - name: Program
    parent: null
    common_fields: true
    fields:
      - { name: name, type: string, source: input, description: "Program name" }
      - { name: start_date, type: string, source: input, description: "Program window start, YYYY-MM-DD, inclusive" }
      - { name: end_date, type: string, source: input, description: "Program window end, YYYY-MM-DD, exclusive" }
      - { name: base_monthly_benefit_cents, type: integer, source: input, description: "Base voucher face value for household_size 1" }
      - { name: household_increment_cents, type: integer, source: input, description: "Added to base per additional household member" }
      - { name: max_household_size, type: integer, source: input, description: "Household size cap for benefit computation" }
      - { name: double_up_multiplier, type: number, source: input, description: "Double-Up match multiplier on PRODUCE_ELIGIBLE line amounts (e.g. 1.0)" }
      - { name: double_up_daily_cap_cents, type: integer, source: input, description: "Max match cents per enrollment per UTC calendar day" }
      - { name: double_up_pool_cents, type: integer, source: input, description: "Total Double-Up incentive budget" }
      - { name: double_up_matched_cents, type: integer, source: computed, default: 0, description: "Sum of match_cents over SETTLED (non-VOIDED) redemptions in this program" }
      - { name: double_up_remaining_cents, type: integer, source: computed, description: "= double_up_pool_cents - double_up_matched_cents" }
      - { name: tier2_completions, type: integer, source: input, description: "Passed completions needed (>=) for engagement tier T2" }
      - { name: tier3_completions, type: integer, source: input, description: "Passed completions needed (>=) for engagement tier T3" }
      - { name: renewal_window_days, type: integer, source: input, description: "Days after lapse during which a renewal may be created" }
      - { name: outcome_improvement_threshold, type: number, source: input, description: "A1c drop (in points) counted as improved; improved iff delta <= -threshold" }
      - { name: status, type: enum, source: system, description: "DRAFT | ACTIVE | FROZEN | CLOSED" }
      - { name: ops_run_index, type: integer, source: system, default: 0, description: "Monotone counter incremented by run-ops" }

  - name: Funder
    parent: null
    common_fields: true
    fields:
      - { name: name, type: string, source: input, description: "Funder organization name" }
      - { name: contact_email, type: string, source: input, description: "Contact email" }
      - { name: total_commitment_cents, type: integer, source: input, description: "Maximum total cents this funder commits across all pools" }
      - { name: status, type: enum, source: system, description: "ACTIVE | SUSPENDED" }

  - name: FundingPool
    parent: null
    common_fields: true
    fields:
      - { name: program_id, type: string, source: input, description: "FK -> Program.id; program this pool funds" }
      - { name: funder_id, type: string, source: input, description: "FK -> Funder.id; funding source" }
      - { name: committed_cents, type: integer, source: input, description: "Cents committed to this pool" }
      - { name: disbursed_cents, type: integer, source: computed, default: 0, description: "Sum of voucher_applied_cents over SETTLED (non-VOIDED) redemptions of this program's vouchers" }
      - { name: reserved_cents, type: integer, source: computed, default: 0, description: "Sum of remaining_cents over ISSUED vouchers of this program" }
      - { name: available_cents, type: integer, source: computed, description: "= committed_cents - disbursed_cents - reserved_cents" }
      - { name: status, type: enum, source: system, description: "PENDING | FUNDED | SUSPENDED | CLOSED" }

  - name: Clinic
    parent: null
    common_fields: true
    fields:
      - { name: name, type: string, source: input, description: "Clinic name" }
      - { name: npi_number, type: string, source: input, description: "NPI identifier; unique across clinics" }
      - { name: max_active_referrals, type: integer, source: input, description: "Cap on referrals in SUBMITTED or UNDER_REVIEW for this clinic" }
      - { name: status, type: enum, source: system, description: "ACTIVE | SUSPENDED" }

  - name: Retailer
    parent: null
    common_fields: true
    fields:
      - { name: name, type: string, source: input, description: "Retailer/market name" }
      - { name: kind, type: enum, source: input, description: "GROCERY | FARMERS_MARKET | MOBILE_MARKET" }
      - { name: double_up_eligible, type: boolean, source: input, description: "Whether Double-Up match applies at this retailer" }
      - { name: status, type: enum, source: system, description: "ACTIVE | SUSPENDED" }

  - name: Patient
    parent: null
    common_fields: true
    fields:
      - { name: clinic_id, type: string, source: input, description: "FK -> Clinic.id; managing clinic" }
      - { name: full_name, type: string, source: input, description: "Patient full name" }
      - { name: date_of_birth, type: string, source: input, description: "YYYY-MM-DD" }
      - { name: household_size, type: integer, source: input, description: "Household size, integer >= 1" }
      - { name: consent_status, type: enum, source: system, description: "PENDING | GRANTED | REVOKED" }

  - name: Referral
    parent: null
    common_fields: true
    fields:
      - { name: clinic_id, type: string, source: input, description: "FK -> Clinic.id; referring clinic (must equal patient.clinic_id)" }
      - { name: patient_id, type: string, source: input, description: "FK -> Patient.id; referred patient" }
      - { name: program_id, type: string, source: input, description: "FK -> Program.id; target program" }
      - { name: diagnosis_code, type: string, source: input, description: "ICD-10 code, e.g. E11.9" }
      - { name: priority, type: enum, source: input, description: "STANDARD | URGENT" }
      - { name: decision_reason, type: string, source: input, description: "Required on decline" }
      - { name: appeal_reason, type: string, source: input, description: "Required on appeal" }
      - { name: appeal_count, type: integer, source: system, default: 0, description: "Number of appeals (DECLINED -> UNDER_REVIEW)" }
      - { name: enrollment_id, type: string, source: system, description: "FK -> Enrollment.id; enrollment created on approve, null before" }
      - { name: status, type: enum, source: system, description: "SUBMITTED | UNDER_REVIEW | APPROVED | DECLINED | WITHDRAWN | EXPIRED" }

  - name: Enrollment
    parent: null
    common_fields: true
    fields:
      - { name: program_id, type: string, source: system, description: "FK -> Program.id; copied from referral" }
      - { name: patient_id, type: string, source: system, description: "FK -> Patient.id; copied from referral" }
      - { name: referral_id, type: string, source: system, description: "FK -> Referral.id; originating referral" }
      - { name: household_size, type: integer, source: system, description: "Snapshot of patient.household_size at approval time" }
      - { name: engagement_tier, type: enum, source: computed, description: "T1 | T2 | T3 — derived from passed completion counts vs program tier thresholds" }
      - { name: lifetime_redeemed_cents, type: integer, source: computed, default: 0, description: "Sum of voucher_applied_cents over this enrollment's SETTLED redemptions" }
      - { name: lifetime_match_cents, type: integer, source: computed, default: 0, description: "Sum of match_cents over this enrollment's SETTLED redemptions" }
      - { name: lapsed_at, type: datetime, source: system, description: "Timestamp when enrollment entered LAPSED; null otherwise" }
      - { name: status, type: enum, source: system, description: "ACTIVE | SUSPENDED | LAPSED | TERMINATED | COMPLETED" }

  - name: BenefitCycle
    parent: null
    common_fields: true
    fields:
      - { name: program_id, type: string, source: system, description: "FK -> Program.id; from path" }
      - { name: period_index, type: integer, source: input, description: "Monotone period number within program, unique per program" }
      - { name: start_date, type: string, source: input, description: "Cycle start, YYYY-MM-DD, inclusive" }
      - { name: end_date, type: string, source: input, description: "Cycle end, YYYY-MM-DD, exclusive (half-open interval)" }
      - { name: status, type: enum, source: system, description: "SCHEDULED | OPEN | CLOSED" }

  - name: Voucher
    parent: null
    common_fields: true
    fields:
      - { name: enrollment_id, type: string, source: system, description: "FK -> Enrollment.id; recipient enrollment" }
      - { name: benefit_cycle_id, type: string, source: system, description: "FK -> BenefitCycle.id; issuing cycle" }
      - { name: face_value_cents, type: integer, source: computed, description: "Issued face value from monthly_benefit_allocation" }
      - { name: redeemed_cents, type: integer, source: computed, default: 0, description: "Cents applied by SETTLED redemptions" }
      - { name: remaining_cents, type: integer, source: computed, description: "= face_value_cents - redeemed_cents" }
      - { name: status, type: enum, source: system, description: "ISSUED | EXHAUSTED | EXPIRED | VOIDED" }

  - name: Redemption
    parent: null
    common_fields: true
    fields:
      - { name: retailer_id, type: string, source: input, description: "FK -> Retailer.id; redeeming retailer (must equal acting X-User-ID)" }
      - { name: enrollment_id, type: string, source: input, description: "FK -> Enrollment.id; redeeming enrollment" }
      - { name: lines, type: array, source: input, description: "Non-empty array of { category: PRODUCE_ELIGIBLE | STAPLE | OTHER, amount_cents: integer > 0 }" }
      - { name: subtotal_cents, type: integer, source: computed, description: "Sum of line amount_cents" }
      - { name: produce_eligible_cents, type: integer, source: computed, description: "Sum of amount_cents over PRODUCE_ELIGIBLE lines" }
      - { name: match_cents, type: integer, source: computed, description: "Double-Up match per double_up_match calculation" }
      - { name: voucher_applied_cents, type: integer, source: computed, description: "Cents drawn from the oldest ISSUED voucher" }
      - { name: voucher_id, type: string, source: system, description: "FK -> Voucher.id; voucher actually debited, null if voucher_applied_cents == 0" }
      - { name: patient_pay_cents, type: integer, source: computed, description: "= subtotal_cents - match_cents - voucher_applied_cents" }
      - { name: redeemed_at, type: datetime, source: system, description: "Logical-clock timestamp at creation" }
      - { name: status, type: enum, source: system, description: "SETTLED | VOIDED" }

  - name: EducationSession
    parent: null
    common_fields: true
    fields:
      - { name: program_id, type: string, source: system, description: "FK -> Program.id; from path" }
      - { name: topic, type: string, source: input, description: "Session topic" }
      - { name: venue, type: string, source: input, description: "Venue identifier string; overlap-checked within program" }
      - { name: starts_at, type: datetime, source: input, description: "ISO8601 start" }
      - { name: ends_at, type: datetime, source: input, description: "ISO8601 end, must be after starts_at" }
      - { name: capacity, type: integer, source: input, description: "Max completions recorded for the session, >= 1" }
      - { name: educator_ref, type: string, source: input, description: "Opaque educator operator id recorded for audit" }
      - { name: status, type: enum, source: system, description: "SCHEDULED | COMPLETED | CANCELLED" }

  - name: EducationCompletion
    parent: null
    common_fields: false
    fields:
      - { name: enrollment_id, type: string, source: input, description: "FK -> Enrollment.id; attendee" }
      - { name: session_id, type: string, source: system, description: "FK -> EducationSession.id; from path" }
      - { name: minutes_attended, type: integer, source: input, description: "Minutes attended, > 0" }
      - { name: passed, type: boolean, source: input, description: "Whether the completion counts toward engagement tier" }

  - name: BiometricReading
    parent: null
    common_fields: false
    fields:
      - { name: enrollment_id, type: string, source: system, description: "FK -> Enrollment.id; from path" }
      - { name: kind, type: enum, source: input, description: "A1C | WEIGHT_KG | SYSTOLIC_BP" }
      - { name: value, type: number, source: input, description: "Measured value; A1C must be within [3.0, 20.0]" }
      - { name: measured_at, type: datetime, source: input, description: "ISO8601 measurement time (may precede creation time)" }
      - { name: source, type: enum, source: input, description: "CLINIC | LAB_VERIFIED | SELF_REPORT" }

  - name: FunderReport
    parent: null
    common_fields: true
    fields:
      - { name: program_id, type: string, source: system, description: "FK -> Program.id; from path" }
      - { name: funding_pool_id, type: string, source: input, description: "FK -> FundingPool.id; reported pool (must belong to program)" }
      - { name: period_start, type: string, source: input, description: "Report window start, YYYY-MM-DD inclusive" }
      - { name: period_end, type: string, source: input, description: "Report window end, YYYY-MM-DD exclusive (half-open)" }
      - { name: basis, type: enum, source: input, description: "ACCRUAL | CASH — selects utilization and A1c variants" }
      - { name: utilization_cents, type: integer, source: computed, description: "ACCRUAL: pool.disbursed_cents + pool.reserved_cents; CASH: pool.disbursed_cents (frozen at creation)" }
      - { name: total_redeemed_cents, type: integer, source: computed, description: "Sum voucher_applied_cents of SETTLED redemptions with redeemed_at date in [period_start, period_end)" }
      - { name: total_match_cents, type: integer, source: computed, description: "Sum match_cents over same window" }
      - { name: active_enrollments, type: integer, source: computed, description: "Count of program enrollments in status ACTIVE at creation" }
      - { name: a1c_improved_count, type: integer, source: computed, description: "ACCRUAL: inclusive variant; CASH: verified variant (see a1c_outcome_delta)" }
      - { name: revision_count, type: integer, source: system, default: 0, description: "Number of times this report was RETURNED" }
      - { name: return_reason, type: string, source: input, description: "Required on return" }
      - { name: status, type: enum, source: system, description: "DRAFT | SUBMITTED | RETURNED | ACCEPTED | SUPERSEDED" }

  - name: Renewal
    parent: null
    common_fields: true
    fields:
      - { name: enrollment_id, type: string, source: system, description: "FK -> Enrollment.id; from path" }
      - { name: reason, type: string, source: input, description: "Renewal reason / resubmission note" }
      - { name: resubmit_count, type: integer, source: system, default: 0, description: "Number of DENIED -> SUBMITTED resubmissions" }
      - { name: denial_reason, type: string, source: input, description: "Required on deny" }
      - { name: status, type: enum, source: system, description: "DRAFT | SUBMITTED | APPROVED | DENIED | SUPERSEDED" }

# =============================================================================
# §1.2 State Machine Table
# =============================================================================
state_machines:
  - entity: Program
    initial_state: DRAFT
    terminal_states: [CLOSED]
    transitions:
      - from: DRAFT
        to: ACTIVE
        trigger: "POST /programs/{programId}/activate"
        actor: ProgramAdmin
        preconditions:
          - "At least one FundingPool with program_id == Program.id has status FUNDED (else ERR_NO_FUNDED_POOL)"
        side_effects: ["status -> ACTIVE"]
      - from: ACTIVE
        to: FROZEN
        trigger: "system (automatic when the program's last FUNDED pool becomes SUSPENDED)"
        actor: system
        preconditions: []
        side_effects:
          - "status -> FROZEN"
          - "Every Enrollment of this program in status ACTIVE -> SUSPENDED (caused by the program freeze)"
      - from: FROZEN
        to: ACTIVE
        trigger: "system (automatic when a pool of this program returns to FUNDED)"
        actor: system
        preconditions: []
        side_effects:
          - "status -> ACTIVE"
          - "Enrollments stay SUSPENDED (asymmetric: manual reinstate required)"
      - from: ACTIVE
        to: CLOSED
        trigger: "POST /programs/{programId}/close"
        actor: ProgramAdmin
        preconditions: ["No BenefitCycle of this program has status OPEN (else ERR_OPEN_CYCLES_EXIST)"]
        side_effects:
          - "status -> CLOSED"
          - "Enrollments in ACTIVE or LAPSED -> COMPLETED; enrollments in SUSPENDED -> TERMINATED"
      - from: FROZEN
        to: CLOSED
        trigger: "POST /programs/{programId}/close"
        actor: ProgramAdmin
        preconditions: ["No BenefitCycle of this program has status OPEN (else ERR_OPEN_CYCLES_EXIST)"]
        side_effects:
          - "status -> CLOSED"
          - "Enrollments in SUSPENDED -> TERMINATED"

  - entity: Funder
    initial_state: ACTIVE
    terminal_states: []
    transitions:
      - from: ACTIVE
        to: SUSPENDED
        trigger: "POST /funders/{funderId}/suspend"
        actor: ProgramAdmin
        preconditions: []
        side_effects:
          - "status -> SUSPENDED"
          - "Each FundingPool with funder_id == Funder.id and status FUNDED -> SUSPENDED (caused by funder suspension)"
          - "Each such pool suspension itself triggers: its Program (if no other FUNDED pool remains) -> FROZEN, which in turn suspends that program's ACTIVE enrollments"
      - from: SUSPENDED
        to: ACTIVE
        trigger: "POST /funders/{funderId}/reinstate"
        actor: ProgramAdmin
        preconditions: []
        side_effects:
          - "status -> ACTIVE"
          - "Each FundingPool with funder_id == Funder.id and status SUSPENDED -> FUNDED (caused by funder reinstatement)"
          - "Each such pool restoration itself triggers: its Program (if FROZEN) -> ACTIVE"

  - entity: FundingPool
    initial_state: PENDING
    terminal_states: [CLOSED]
    transitions:
      - from: PENDING
        to: FUNDED
        trigger: "POST /funding-pools/{poolId}/fund"
        actor: FunderAnalyst
        preconditions:
          - "Acting X-User-ID must equal pool.funder_id (else ERR_FORBIDDEN)"
          - "pool's Funder.status == ACTIVE (else ERR_INVALID_STATE)"
          - "pool's Program.status in {DRAFT, ACTIVE, FROZEN} (else ERR_PROGRAM_NOT_ACTIVE)"
        side_effects:
          - "status -> FUNDED"
          - "If program was FROZEN: program -> ACTIVE (system cascade)"
      - from: FUNDED
        to: SUSPENDED
        trigger: "system (automatic when owning Funder is suspended)"
        actor: system
        preconditions: []
        side_effects:
          - "status -> SUSPENDED"
          - "If program has no remaining FUNDED pool: program -> FROZEN"
      - from: SUSPENDED
        to: FUNDED
        trigger: "system (automatic when owning Funder is reinstated)"
        actor: system
        preconditions: []
        side_effects:
          - "status -> FUNDED"
          - "If program FROZEN: program -> ACTIVE"
      - from: FUNDED
        to: CLOSED
        trigger: "POST /funding-pools/{poolId}/close"
        actor: ProgramAdmin
        preconditions: ["reserved_cents == 0 (else ERR_POOL_BUSY)"]
        side_effects: ["status -> CLOSED"]
      - from: SUSPENDED
        to: CLOSED
        trigger: "POST /funding-pools/{poolId}/close"
        actor: ProgramAdmin
        preconditions: ["reserved_cents == 0 (else ERR_POOL_BUSY)"]
        side_effects: ["status -> CLOSED"]

  - entity: Clinic
    initial_state: ACTIVE
    terminal_states: []
    transitions:
      - from: ACTIVE
        to: SUSPENDED
        trigger: "POST /clinics/{clinicId}/suspend"
        actor: ProgramAdmin
        preconditions: []
        side_effects: ["status -> SUSPENDED; new referrals, patients, and biometric reads for this clinic are rejected while SUSPENDED"]
      - from: SUSPENDED
        to: ACTIVE
        trigger: "POST /clinics/{clinicId}/reinstate"
        actor: ProgramAdmin
        preconditions: []
        side_effects: ["status -> ACTIVE"]

  - entity: Retailer
    initial_state: ACTIVE
    terminal_states: []
    transitions:
      - from: ACTIVE
        to: SUSPENDED
        trigger: "POST /retailers/{retailerId}/suspend"
        actor: ProgramAdmin
        preconditions: []
        side_effects: ["status -> SUSPENDED; new redemptions rejected with ERR_RETAILER_SUSPENDED; existing SETTLED redemptions unaffected"]
      - from: SUSPENDED
        to: ACTIVE
        trigger: "POST /retailers/{retailerId}/reinstate"
        actor: ProgramAdmin
        preconditions: []
        side_effects: ["status -> ACTIVE"]

  - entity: Patient
    initial_state: PENDING
    terminal_states: []
    transitions:
      - from: PENDING
        to: GRANTED
        trigger: "POST /patients/{patientId}/grant-consent"
        actor: ClinicStaff
        preconditions: ["Acting clinic owns the patient (patient.clinic_id == X-User-ID, else ERR_FORBIDDEN)"]
        side_effects: ["consent_status -> GRANTED"]
      - from: GRANTED
        to: REVOKED
        trigger: "POST /patients/{patientId}/revoke-consent"
        actor: ClinicStaff
        preconditions: ["Acting clinic owns the patient"]
        side_effects: ["consent_status -> REVOKED; new referrals and biometric readings blocked"]
      - from: REVOKED
        to: GRANTED
        trigger: "POST /patients/{patientId}/grant-consent"
        actor: ClinicStaff
        preconditions: ["Acting clinic owns the patient"]
        side_effects: ["consent_status -> GRANTED (re-grant cycle allowed)"]

  - entity: Referral
    initial_state: SUBMITTED
    terminal_states: [APPROVED, WITHDRAWN, EXPIRED]
    transitions:
      - from: SUBMITTED
        to: UNDER_REVIEW
        trigger: "POST /referrals/{referralId}/start-review"
        actor: ProgramAdmin
        preconditions: []
        side_effects: ["status -> UNDER_REVIEW"]
      - from: UNDER_REVIEW
        to: APPROVED
        trigger: "POST /referrals/{referralId}/approve"
        actor: ProgramAdmin
        preconditions:
          - "Program.status == ACTIVE (else ERR_PROGRAM_NOT_ACTIVE)"
          - "Patient.consent_status == GRANTED (else ERR_CONSENT_REVOKED)"
          - "No Enrollment exists with same patient_id and program_id in status ACTIVE, SUSPENDED, or LAPSED (else ERR_DUPLICATE_ENROLLMENT)"
        side_effects:
          - "status -> APPROVED"
          - "Create Enrollment: status ACTIVE, household_size snapshot from patient, engagement_tier T1, referral_id set; referral.enrollment_id set"
      - from: UNDER_REVIEW
        to: DECLINED
        trigger: "POST /referrals/{referralId}/decline"
        actor: ProgramAdmin
        preconditions: ["decision_reason required (else ERR_VALIDATION)"]
        side_effects: ["status -> DECLINED"]
      - from: DECLINED
        to: UNDER_REVIEW
        trigger: "POST /referrals/{referralId}/appeal"
        actor: ClinicStaff
        preconditions:
          - "Acting clinic owns the referral (referral.clinic_id == X-User-ID, else ERR_FORBIDDEN)"
          - "appeal_reason required (else ERR_VALIDATION)"
        side_effects: ["status -> UNDER_REVIEW", "appeal_count += 1"]
        note: "Cyclic review loop: a declined referral can be appealed back into review repeatedly"
      - from: SUBMITTED
        to: WITHDRAWN
        trigger: "POST /referrals/{referralId}/withdraw"
        actor: ClinicStaff
        preconditions: ["Acting clinic owns the referral"]
        side_effects: ["status -> WITHDRAWN"]
      - from: UNDER_REVIEW
        to: WITHDRAWN
        trigger: "POST /referrals/{referralId}/withdraw"
        actor: ClinicStaff
        preconditions: ["Acting clinic owns the referral"]
        side_effects: ["status -> WITHDRAWN"]
      - from: SUBMITTED
        to: EXPIRED
        trigger: "system (automatic during run-ops when referral age > REFERRAL_EXPIRY_DAYS)"
        actor: system
        preconditions: []
        side_effects: ["status -> EXPIRED"]
      - from: UNDER_REVIEW
        to: EXPIRED
        trigger: "system (automatic during run-ops when referral age > REFERRAL_EXPIRY_DAYS)"
        actor: system
        preconditions: []
        side_effects: ["status -> EXPIRED"]

  - entity: Enrollment
    initial_state: ACTIVE
    terminal_states: [TERMINATED, COMPLETED]
    transitions:
      - from: ACTIVE
        to: SUSPENDED
        trigger: "POST /enrollments/{enrollmentId}/suspend"
        actor: ProgramAdmin
        preconditions: []
        side_effects: ["status -> SUSPENDED"]
      - from: ACTIVE
        to: SUSPENDED
        trigger: "system (automatic when owning Program is frozen)"
        actor: system
        preconditions: []
        side_effects: ["status -> SUSPENDED"]
      - from: SUSPENDED
        to: ACTIVE
        trigger: "POST /enrollments/{enrollmentId}/reinstate"
        actor: ProgramAdmin
        preconditions:
          - "Program.status != FROZEN (else ERR_PROGRAM_FROZEN)"
          - "Program.status != CLOSED (else ERR_PROGRAM_NOT_ACTIVE)"
        side_effects: ["status -> ACTIVE"]
      - from: ACTIVE
        to: LAPSED
        trigger: "system (automatic during run-ops per enrollment_lapse_rule)"
        actor: system
        preconditions: []
        side_effects: ["status -> LAPSED", "lapsed_at = current logical clock"]
      - from: LAPSED
        to: ACTIVE
        trigger: "system (automatic when a Renewal for this enrollment is APPROVED)"
        actor: system
        preconditions: []
        side_effects: ["status -> ACTIVE", "lapsed_at = null"]
      - from: ACTIVE
        to: TERMINATED
        trigger: "POST /enrollments/{enrollmentId}/terminate"
        actor: ProgramAdmin
        preconditions: ["reason required"]
        side_effects: ["status -> TERMINATED"]
      - from: SUSPENDED
        to: TERMINATED
        trigger: "POST /enrollments/{enrollmentId}/terminate"
        actor: ProgramAdmin
        preconditions: ["reason required"]
        side_effects: ["status -> TERMINATED"]
      - from: LAPSED
        to: TERMINATED
        trigger: "POST /enrollments/{enrollmentId}/terminate"
        actor: ProgramAdmin
        preconditions: ["reason required"]
        side_effects: ["status -> TERMINATED"]
      - from: ACTIVE
        to: COMPLETED
        trigger: "system (automatic when owning Program is closed)"
        actor: system
        preconditions: []
        side_effects: ["status -> COMPLETED"]
      - from: LAPSED
        to: COMPLETED
        trigger: "system (automatic when owning Program is closed)"
        actor: system
        preconditions: []
        side_effects: ["status -> COMPLETED"]
      - from: SUSPENDED
        to: TERMINATED
        trigger: "system (automatic when owning Program is closed)"
        actor: system
        preconditions: []
        side_effects: ["status -> TERMINATED"]

  - entity: BenefitCycle
    initial_state: SCHEDULED
    terminal_states: [CLOSED]
    transitions:
      - from: SCHEDULED
        to: OPEN
        trigger: "POST /cycles/{cycleId}/open"
        actor: ProgramAdmin
        preconditions:
          - "Program.status == ACTIVE (else ERR_PROGRAM_NOT_ACTIVE)"
          - "No other BenefitCycle of this program has status OPEN (else ERR_CYCLE_ALREADY_OPEN)"
          - "Every BenefitCycle of this program with lower period_index has status CLOSED (else ERR_PRIOR_CYCLE_UNCLOSED)"
        side_effects: ["status -> OPEN"]
      - from: OPEN
        to: CLOSED
        trigger: "POST /cycles/{cycleId}/close"
        actor: ProgramAdmin
        preconditions: []
        side_effects:
          - "status -> CLOSED"
          - "Each Voucher of this cycle in status ISSUED -> EXPIRED (in voucher.created_at ASC order)"
          - "Each such voucher expiry itself triggers pool ledger release: pool.reserved_cents -= voucher.remaining_cents; pool.available_cents += voucher.remaining_cents (cycle_close_settlement)"

  - entity: Voucher
    initial_state: ISSUED
    terminal_states: [EXHAUSTED, EXPIRED, VOIDED]
    transitions:
      - from: ISSUED
        to: EXHAUSTED
        trigger: "system (automatic when a redemption drives remaining_cents to exactly 0)"
        actor: system
        preconditions: []
        side_effects: ["status -> EXHAUSTED"]
      - from: EXHAUSTED
        to: ISSUED
        trigger: "system (automatic when a debiting redemption is voided and remaining_cents becomes > 0)"
        actor: system
        preconditions: []
        side_effects: ["status -> ISSUED"]
      - from: ISSUED
        to: EXPIRED
        trigger: "system (automatic during cycle close when remaining_cents > 0)"
        actor: system
        preconditions: []
        side_effects: ["status -> EXPIRED", "pool release: reserved_cents -= remaining_cents, available_cents += remaining_cents"]
      - from: ISSUED
        to: VOIDED
        trigger: "POST /vouchers/{voucherId}/void"
        actor: ProgramAdmin
        preconditions: ["reason required"]
        side_effects: ["status -> VOIDED", "pool release: reserved_cents -= remaining_cents, available_cents += remaining_cents"]

  - entity: Redemption
    initial_state: SETTLED
    terminal_states: [VOIDED]
    transitions:
      - from: SETTLED
        to: VOIDED
        trigger: "POST /redemptions/{redemptionId}/void"
        actor: "RetailerStaff (own retailer) or ProgramAdmin"
        preconditions:
          - "reason required"
          - "The BenefitCycle of the debited voucher has status OPEN (else ERR_VOID_NOT_ALLOWED); redemptions with voucher_id null may be voided while their enrollment's program is not CLOSED"
        side_effects:
          - "status -> VOIDED"
          - "Compensation: voucher.redeemed_cents -= voucher_applied_cents (voucher EXHAUSTED -> ISSUED if remaining becomes > 0)"
          - "pool.disbursed_cents -= voucher_applied_cents; pool.reserved_cents += voucher_applied_cents (voucher still ISSUED)"
          - "program.double_up_matched_cents -= match_cents; program.double_up_remaining_cents += match_cents"
          - "enrollment.lifetime_redeemed_cents -= voucher_applied_cents; enrollment.lifetime_match_cents -= match_cents"

  - entity: EducationSession
    initial_state: SCHEDULED
    terminal_states: [COMPLETED, CANCELLED]
    transitions:
      - from: SCHEDULED
        to: COMPLETED
        trigger: "POST /education-sessions/{sessionId}/complete"
        actor: Educator
        preconditions: []
        side_effects: ["status -> COMPLETED; completions may now be recorded"]
      - from: SCHEDULED
        to: CANCELLED
        trigger: "POST /education-sessions/{sessionId}/cancel"
        actor: Educator
        preconditions: []
        side_effects: ["status -> CANCELLED"]

  - entity: FunderReport
    initial_state: DRAFT
    terminal_states: [ACCEPTED, SUPERSEDED]
    transitions:
      - from: DRAFT
        to: SUBMITTED
        trigger: "POST /funder-reports/{reportId}/submit"
        actor: ProgramAdmin
        preconditions: []
        side_effects: ["status -> SUBMITTED"]
      - from: RETURNED
        to: SUBMITTED
        trigger: "POST /funder-reports/{reportId}/submit"
        actor: ProgramAdmin
        preconditions: []
        side_effects: ["status -> SUBMITTED (resubmission cycle)"]
      - from: SUBMITTED
        to: ACCEPTED
        trigger: "POST /funder-reports/{reportId}/accept"
        actor: FunderAnalyst
        preconditions: ["Acting X-User-ID must equal the report pool's funder_id (else ERR_FORBIDDEN)"]
        side_effects: ["status -> ACCEPTED"]
      - from: SUBMITTED
        to: RETURNED
        trigger: "POST /funder-reports/{reportId}/return"
        actor: FunderAnalyst
        preconditions:
          - "Acting X-User-ID must equal the report pool's funder_id (else ERR_FORBIDDEN)"
          - "return_reason required (else ERR_VALIDATION)"
        side_effects: ["status -> RETURNED", "revision_count += 1"]
      - from: DRAFT
        to: SUPERSEDED
        trigger: "system (automatic when a new report is created for the same funding_pool_id + period_start + period_end)"
        actor: system
        preconditions: []
        side_effects: ["status -> SUPERSEDED"]
      - from: RETURNED
        to: SUPERSEDED
        trigger: "system (automatic when a new report is created for the same funding_pool_id + period_start + period_end)"
        actor: system
        preconditions: []
        side_effects: ["status -> SUPERSEDED"]

  - entity: Renewal
    initial_state: DRAFT
    terminal_states: [APPROVED, SUPERSEDED]
    transitions:
      - from: DRAFT
        to: SUBMITTED
        trigger: "POST /renewals/{renewalId}/submit"
        actor: ClinicStaff
        preconditions: ["Acting clinic owns the enrollment's patient (else ERR_FORBIDDEN)"]
        side_effects: ["status -> SUBMITTED"]
      - from: SUBMITTED
        to: APPROVED
        trigger: "POST /renewals/{renewalId}/approve"
        actor: ProgramAdmin
        preconditions:
          - "Clinic of the enrollment's patient has status ACTIVE (else ERR_CLINIC_SUSPENDED)"
        side_effects:
          - "status -> APPROVED"
          - "If enrollment.status == LAPSED: enrollment -> ACTIVE and lapsed_at = null (enrollment.version increments)"
      - from: SUBMITTED
        to: DENIED
        trigger: "POST /renewals/{renewalId}/deny"
        actor: ProgramAdmin
        preconditions: ["denial_reason required (else ERR_VALIDATION)"]
        side_effects: ["status -> DENIED"]
      - from: DENIED
        to: SUBMITTED
        trigger: "POST /renewals/{renewalId}/resubmit"
        actor: ClinicStaff
        preconditions: ["Acting clinic owns the enrollment's patient", "reason required"]
        side_effects: ["status -> SUBMITTED", "resubmit_count += 1"]
        note: "Cyclic renewal loop: a denied renewal may be resubmitted repeatedly"
      - from: DRAFT
        to: SUPERSEDED
        trigger: "system (automatic when a new Renewal is created for the same enrollment)"
        actor: system
        preconditions: []
        side_effects: ["status -> SUPERSEDED"]

# =============================================================================
# §1.2.1 Concurrency Rules (true races only; OCC on parent version)
# =============================================================================
concurrency_rules:
  - rule_id: renewal-create-stale-enrollment
    parent_entity: Enrollment
    write_endpoint: "POST /enrollments/{enrollmentId}/renewals"
    occ_field: "expected_enrollment_version"
    description: |
      Creating a Renewal against an Enrollment whose version has advanced since
      the client last observed it is rejected with 412. This captures the case
      where another writer has just created a renewal (which legitimately
      supersedes the prior DRAFT renewal) and the current writer's view of the
      enrollment is therefore stale.
    error_id: ERR_STALE_VERSION
    http_status: 412

  - rule_id: report-create-stale-program
    parent_entity: Program
    write_endpoint: "POST /programs/{programId}/funder-reports"
    occ_field: "expected_program_version"
    description: |
      Creating a FunderReport against a Program whose version has advanced
      since the client last observed it is rejected with 412. This captures
      the case where another writer has just created a report for the same
      pool and period (which legitimately supersedes the prior DRAFT or
      RETURNED report) and the current writer's view of the program is stale.
    error_id: ERR_STALE_VERSION
    http_status: 412

# =============================================================================
# §1.3 Calculation Rules Table
# =============================================================================
calculations:
  - name: monthly_benefit_allocation
    trigger: "cycle issuance (POST /cycles/{cycleId}/issue), per eligible enrollment"
    algorithm: tiered_pricing
    formula: |
      hh = min(enrollment.household_size, program.max_household_size)
      base = program.base_monthly_benefit_cents + (hh - 1) * program.household_increment_cents
      tier_mult = 1.00 if enrollment.engagement_tier == T1
                  1.10 if T2
                  1.25 if T3
      priority_mult = 1.10 if referral.priority == URGENT else 1.00
      face_value_cents = round_half_up(base * tier_mult * priority_mult)
      (referral = the enrollment's originating Referral)
    input_set: "Enrollments of the program with status ACTIVE, evaluated at issuance time"
    constants:
      TIER_T1_MULT: 1.00
      TIER_T2_MULT: 1.10
      TIER_T3_MULT: 1.25
      URGENT_MULT: 1.10
    precision: "integer cents, round_half_up of the full product (single final rounding)"

  - name: double_up_match
    trigger: "redemption creation (POST /redemptions)"
    algorithm: aggregation
    formula: |
      Step 1 (per-line rounding, THEN sum — pinned order):
        for each line with category == PRODUCE_ELIGIBLE:
          line_match_cents = round_half_up(line.amount_cents * program.double_up_multiplier)
        raw_match_cents = sum(line_match_cents)   # per-line rounding first;
        # round(sum(line * mult)) would give a different result and is FORBIDDEN
      Step 2 (caps, in this order):
        if retailer.double_up_eligible == false: match_cents = 0
        else: match_cents = min(raw_match_cents, daily_match_remaining, program.double_up_remaining_cents)
      Step 3 (tender split, evaluation order pinned):
        subtotal_cents = sum(line.amount_cents over all lines)
        voucher = oldest ISSUED voucher of the enrollment (created_at ASC; ties cannot occur at millisecond precision)
        voucher_applied_cents = min(voucher.remaining_cents, subtotal_cents - match_cents) if voucher exists else 0
        patient_pay_cents = subtotal_cents - match_cents - voucher_applied_cents
    input_set: "Lines of the new redemption; the enrollment's SETTLED (non-VOIDED) redemptions on the current UTC calendar day (per logical clock) for the daily cap"
    constants: {}
    precision: "integer cents, round_half_up per line"

  - name: daily_match_remaining
    trigger: "evaluated inside double_up_match"
    algorithm: aggregation
    formula: |
      matched_today = sum(match_cents over the enrollment's redemptions with
        status == SETTLED and redeemed_at UTC calendar date == current logical-clock date)
      daily_match_remaining = program.double_up_daily_cap_cents - matched_today
      Boundary: a redemption whose resulting matched_today == cap exactly is
      ALLOWED (cap is >= semantics: only exceeding is clamped); match is
      clamped to the remaining amount, never an error.
    input_set: "SETTLED redemptions of the enrollment on the current UTC date"
    constants: {}
    precision: "integer cents"

  - name: engagement_tier
    trigger: "every EducationCompletion creation for the enrollment"
    algorithm: threshold
    formula: |
      passed_count = count of EducationCompletion rows with enrollment_id == enrollment.id and passed == true
      tier = T3 if passed_count >= program.tier3_completions
             T2 if passed_count >= program.tier2_completions
             T1 otherwise
      Boundary: reaching the threshold exactly promotes (>= semantics).
    input_set: "All EducationCompletion rows of the enrollment (sessions in any status; only passed == true counted)"
    constants: {}
    precision: "integer counts"

  - name: issuance_waterfall
    trigger: "POST /cycles/{cycleId}/issue"
    algorithm: waterfall_allocation
    formula: |
      candidates = enrollments of the program with status == ACTIVE that do NOT
        already have a voucher for this cycle (one voucher per enrollment per cycle)
      order: enrollment.created_at ASC; tie-break: originating referral.created_at ASC;
        further tie-break: patient.created_at ASC (ids are never used for ordering)
      for each enrollment in order:
        face = monthly_benefit_allocation(enrollment)
        if pool.available_cents >= face:
          create Voucher(face_value_cents = face, status ISSUED)
          pool.reserved_cents += face; pool.available_cents -= face
        else:
          skip enrollment; record id in skipped_enrollment_ids; CONTINUE to next
      output: { issued_count, total_face_value_cents, skipped_enrollment_ids }
      Re-running issue on the same cycle only considers enrollments without a
      voucher for the cycle, so a second run issues nothing new for prior recipients.
    input_set: "ACTIVE enrollments of the program without a voucher in this cycle; the program's single FUNDED pool (if multiple FUNDED pools exist, the one with earliest created_at)"
    constants: {}
    precision: "integer cents"

  - name: cycle_close_settlement
    trigger: "POST /cycles/{cycleId}/close"
    algorithm: chronological
    formula: |
      for each Voucher of the cycle with status == ISSUED, in voucher.created_at ASC order:
        voucher.status -> EXPIRED
        pool.reserved_cents -= voucher.remaining_cents
        pool.available_cents += voucher.remaining_cents
      cycle.status -> CLOSED
    input_set: "ISSUED vouchers of this cycle only"
    constants: {}
    precision: "integer cents"

  - name: pool_utilization
    trigger: "funder report creation (POST /programs/{programId}/funder-reports); value frozen on the report"
    algorithm: aggregation
    formula: |
      disbursed = sum(voucher_applied_cents over SETTLED redemptions of this program's vouchers)
      reserved  = sum(remaining_cents over ISSUED vouchers of this program)
      ACCRUAL (provisional): utilization_cents = disbursed + reserved
      CASH (final):          utilization_cents = disbursed
    input_set: "All vouchers of the program and their SETTLED redemptions, at report creation time"
    constants: {}
    precision: "integer cents"
    variants:
      - name: accrual_basis
        when: "report.basis == ACCRUAL"
        difference: "Counts outstanding issued-but-unredeemed voucher value (reserved) as utilized"
      - name: cash_basis
        when: "report.basis == CASH"
        difference: "Counts only settled disbursements; reserved value excluded"

  - name: a1c_outcome_delta
    trigger: "program summary (GET /programs/{programId}/summary) and funder report creation"
    algorithm: chronological
    formula: |
      For each enrollment (status in {ACTIVE, SUSPENDED, LAPSED}) of the program:
        readings = A1C BiometricReadings of the enrollment
        baseline = value of the reading with earliest measured_at (tie-break: created_at ASC)
        latest   = value of the reading with latest measured_at   (tie-break: created_at ASC)
      INCLUSIVE variant (all sources):
        if >= 2 readings: delta = latest - baseline
        improved_inclusive = (delta <= -program.outcome_improvement_threshold)
      VERIFIED variant (source == LAB_VERIFIED only):
        if >= 2 LAB_VERIFIED readings: delta_v = latest_verified - earliest_verified
        improved_verified = (delta_v defined and delta_v <= -threshold)
        Fewer than 2 verified readings => never improved under this variant.
      Counts: a1c_improved_inclusive_count / a1c_improved_verified_count over the input set.
      Report mapping: basis ACCRUAL uses inclusive count; basis CASH uses verified count.
    input_set: "Enrollments of the program with status in {ACTIVE, SUSPENDED, LAPSED}; their A1C readings"
    constants: {}
    precision: "one decimal place comparison on A1c points"
    variants:
      - name: inclusive
        when: "program summary field a1c_improved_inclusive_count and reports with basis ACCRUAL"
        difference: "Any source counts; a self-reported latest reading can flip the outcome"
      - name: verified
        when: "program summary field a1c_improved_verified_count and reports with basis CASH"
        difference: "Only LAB_VERIFIED readings count; same raw data can yield a different improved set"

  - name: referral_expiry_and_lapse_ops
    trigger: "POST /programs/{programId}/run-ops"
    algorithm: threshold
    formula: |
      program.ops_run_index += 1
      Referral expiry: for each Referral of the program with status in
        {SUBMITTED, UNDER_REVIEW} and (current logical clock - referral.created_at) > REFERRAL_EXPIRY_DAYS days:
        status -> EXPIRED (strictly greater: exactly REFERRAL_EXPIRY_DAYS old is NOT expired)
      Enrollment lapse: let C = the program's CLOSED BenefitCycle with the highest period_index (if any).
        For each Enrollment with status ACTIVE that has >= 1 voucher in C and
        sum(redeemed_cents over those vouchers) == 0:
        status -> LAPSED, lapsed_at = current logical clock
      output: { ops_run_index, expired_referral_count, lapsed_enrollment_count }
    input_set: "Referrals of the program in SUBMITTED/UNDER_REVIEW; ACTIVE enrollments with vouchers in the latest CLOSED cycle"
    constants:
      REFERRAL_EXPIRY_DAYS: 14
    precision: "whole days on UTC timestamps"

  - name: report_window_totals
    trigger: "funder report creation"
    algorithm: aggregation
    formula: |
      window = [period_start, period_end) as UTC dates (half-open:
        a redemption whose redeemed_at date == period_start is INCLUDED;
        a redemption whose redeemed_at date == period_end is EXCLUDED)
      total_redeemed_cents = sum(voucher_applied_cents over SETTLED redemptions
        of this program's vouchers with redeemed_at date in window)
      total_match_cents = sum(match_cents over same set)
      active_enrollments = count of program enrollments with status == ACTIVE at creation
    input_set: "SETTLED (non-VOIDED) redemptions of the program's vouchers"
    constants: {}
    precision: "integer cents"

# =============================================================================
# §1.4 Validation Rules Table (ordered by priority)
# =============================================================================
validations:
  - priority: 1
    category: auth
    check: "X-User-Role and X-User-ID headers present and role is a declared role"
    error_id: ERR_UNAUTHENTICATED
    http_status: 401
    applies_to: "all"
  - priority: 2
    category: auth
    check: "Role is allowed on the endpoint AND entity_backed ownership holds (ClinicStaff clinic_id == X-User-ID; RetailerStaff retailer_id == X-User-ID; FunderAnalyst funder scope; Participant reads own records only)"
    error_id: ERR_FORBIDDEN
    http_status: 403
    applies_to: "all"
  - priority: 3
    category: existence
    check: "Path and body-referenced ids exist (validated left-to-right: path ids first, then body FK ids in payload order)"
    error_id: ERR_NOT_FOUND
    http_status: 404
    applies_to: "all"
  - priority: 4
    category: business_constraint
    check: "Required fields present; types correct; enum values in declared sets; integer ranges (household_size >= 1, capacity >= 1, amounts > 0)"
    error_id: ERR_VALIDATION
    http_status: 400
    applies_to: "all POST/PUT/PATCH"
  - priority: 5
    category: state
    check: "OCC: expected_<parent>_version matches the parent's current version"
    error_id: ERR_STALE_VERSION
    http_status: 412
    applies_to: "POST /enrollments/{enrollmentId}/renewals, POST /programs/{programId}/funder-reports"
  - priority: 6
    category: state
    check: "Target and parent entity state preconditions for the transition (from-state membership; terminal lockdown; program/enrollment/referral/voucher/cycle/report/renewal/session status gates)"
    error_id: "ERR_INVALID_STATE | ERR_ALREADY_TERMINAL | ERR_PROGRAM_NOT_ACTIVE | ERR_PROGRAM_FROZEN | ERR_ENROLLMENT_NOT_ACTIVE | ERR_REFERRAL_NOT_REVIEWABLE | ERR_VOUCHER_NOT_REDEEMABLE | ERR_CYCLE_NOT_OPEN | ERR_CYCLE_ALREADY_OPEN | ERR_PRIOR_CYCLE_UNCLOSED | ERR_REPORT_NOT_EDITABLE | ERR_RENEWAL_NOT_ACTIONABLE | ERR_SESSION_NOT_SCHEDULED"
    http_status: 409
    applies_to: "all state-transition and state-gated endpoints"
  - priority: 7
    category: business_safety
    check: "Patient consent must be GRANTED for referral creation/approval and biometric recording; A1C values must be clinically plausible within [3.0, 20.0]"
    error_id: "ERR_CONSENT_REVOKED | ERR_A1C_OUT_OF_RANGE"
    http_status: 422
    applies_to: "POST /referrals, POST /referrals/{id}/approve, POST /enrollments/{id}/biometric-readings"
  - priority: 8
    category: business_temporal
    check: "Temporal rules: cycle start_date < end_date and within program window; cycle periods must not overlap (half-open, adjacency allowed); session venue conflicts with 30-minute buffer; renewal creation within renewal window after lapse"
    error_id: "ERR_INVALID_DATE_RANGE | ERR_PERIOD_OVERLAP | ERR_VENUE_CONFLICT | ERR_OUTSIDE_RENEWAL_WINDOW"
    http_status: 422
    applies_to: "POST /programs/{id}/cycles, POST /programs/{id}/education-sessions, POST /enrollments/{id}/renewals, POST /programs/{id}/funder-reports"
  - priority: 9
    category: business_constraint
    check: "Uniqueness and capacity: one non-terminal referral per (patient, program); clinic active-referral cap; one enrollment per (patient, program); one voucher per enrollment per cycle; session capacity; unique completion per (enrollment, session); npi_number unique; period_index unique per program"
    error_id: "ERR_DUPLICATE_REFERRAL | ERR_CLINIC_REFERRAL_CAP | ERR_DUPLICATE_ENROLLMENT | ERR_SESSION_FULL | ERR_DUPLICATE_COMPLETION | ERR_VALIDATION"
    http_status: 409
    applies_to: "creation endpoints"
  - priority: 10
    category: business_referential
    check: "Cross-entity state gates: clinic ACTIVE for referral/patient/biometric writes; retailer ACTIVE for redemptions; pool FUNDED for issuance; at least one FUNDED pool for program activation; referral clinic matches patient clinic"
    error_id: "ERR_CLINIC_SUSPENDED | ERR_RETAILER_SUSPENDED | ERR_POOL_NOT_FUNDED | ERR_NO_FUNDED_POOL | ERR_PATIENT_CLINIC_MISMATCH"
    http_status: 409
    applies_to: "POST /referrals, POST /patients, POST /enrollments/{id}/biometric-readings, POST /redemptions, POST /cycles/{id}/issue, POST /programs/{id}/activate, POST /renewals/{id}/approve"
  - priority: 11
    category: business_fiscal
    check: "Fiscal rules: sum of pools' committed_cents per funder must not exceed funder.total_commitment_cents; redemption lines valid tender; void allowed only while funds not finalized; pool close requires zero reserves"
    error_id: "ERR_COMMITMENT_EXCEEDED | ERR_INVALID_TENDER | ERR_VOID_NOT_ALLOWED | ERR_POOL_BUSY"
    http_status: 422
    applies_to: "POST /funding-pools, POST /redemptions, POST /redemptions/{id}/void, POST /funding-pools/{id}/close"

# =============================================================================
# §1.5 API Endpoint Table
# =============================================================================
endpoints:
  # --- Logical clock (test-driving; default time 2026-05-01T00:00:00Z) ---
  - method: POST
    path: "/_clock/set_current_utc"
    description: "Set the logical clock. Before any call, the logical clock reads exactly 2026-05-01T00:00:00Z and never falls back to wall-clock time."
    roles: [ProgramAdmin]
    code: 200
    input: [to_iso8601]
    output: "{ current_utc: string }"
    side_effects: ["logical clock advanced; no entity mutation"]

  # --- Program ---
  - method: POST
    path: "/programs"
    description: "Create a program (DRAFT)"
    roles: [ProgramAdmin]
    code: 201
    input: [name, start_date, end_date, base_monthly_benefit_cents, household_increment_cents, max_household_size, double_up_multiplier, double_up_daily_cap_cents, double_up_pool_cents, tier2_completions, tier3_completions, renewal_window_days, outcome_improvement_threshold]
    output: Program
    side_effects: ["status=DRAFT", "double_up_matched_cents=0", "double_up_remaining_cents=double_up_pool_cents", "ops_run_index=0"]
  - method: GET
    path: "/programs/{programId}"
    description: "Get a program"
    roles: [ProgramAdmin, FunderAnalyst, ClinicStaff]
    code: 200
    input: []
    output: Program
    side_effects: []
  - method: GET
    path: "/programs"
    description: "List programs"
    roles: [ProgramAdmin, FunderAnalyst, ClinicStaff]
    code: 200
    input: ["status?"]
    output: "Program[]"
    side_effects: []
  - method: POST
    path: "/programs/{programId}/activate"
    description: "Activate a DRAFT program; requires at least one FUNDED pool"
    roles: [ProgramAdmin]
    code: 200
    input: []
    output: Program
    side_effects: ["status -> ACTIVE"]
  - method: POST
    path: "/programs/{programId}/close"
    description: "Close a program; requires no OPEN cycles"
    roles: [ProgramAdmin]
    code: 200
    input: []
    output: Program
    side_effects: ["status -> CLOSED", "enrollment terminal cascade (ACTIVE/LAPSED -> COMPLETED, SUSPENDED -> TERMINATED)"]
  - method: POST
    path: "/programs/{programId}/run-ops"
    description: "Advance the operations epoch: expire stale referrals, lapse inactive enrollments"
    roles: [ProgramAdmin]
    code: 200
    input: []
    output: "{ ops_run_index: integer, expired_referral_count: integer, lapsed_enrollment_count: integer }"
    side_effects: ["ops_run_index += 1", "referral_expiry_and_lapse_ops"]
  - method: GET
    path: "/programs/{programId}/summary"
    description: "Computed program posture: pool ledger rollup, Double-Up pool, tier distribution, A1c outcome counts (both variants)"
    roles: [ProgramAdmin, FunderAnalyst]
    code: 200
    input: []
    output: "{ committed_cents: integer, reserved_cents: integer, disbursed_cents: integer, available_cents: integer, double_up_matched_cents: integer, double_up_remaining_cents: integer, active_enrollment_count: integer, tier_t1_count: integer, tier_t2_count: integer, tier_t3_count: integer, a1c_improved_inclusive_count: integer, a1c_improved_verified_count: integer }"
    side_effects: []

  # --- Funder ---
  - method: POST
    path: "/funders"
    description: "Create a funder (ACTIVE)"
    roles: [ProgramAdmin]
    code: 201
    input: [name, contact_email, total_commitment_cents]
    output: Funder
    side_effects: ["status=ACTIVE"]
  - method: GET
    path: "/funders/{funderId}"
    description: "Get a funder"
    roles: [ProgramAdmin, FunderAnalyst]
    code: 200
    input: []
    output: Funder
    side_effects: []
  - method: POST
    path: "/funders/{funderId}/suspend"
    description: "Suspend a funder; cascades pool -> program -> enrollment"
    roles: [ProgramAdmin]
    code: 200
    input: []
    output: Funder
    side_effects: ["status -> SUSPENDED", "FUNDED pools -> SUSPENDED", "programs without remaining FUNDED pool -> FROZEN", "their ACTIVE enrollments -> SUSPENDED"]
  - method: POST
    path: "/funders/{funderId}/reinstate"
    description: "Reinstate a suspended funder; pools restore, programs unfreeze, enrollments stay SUSPENDED"
    roles: [ProgramAdmin]
    code: 200
    input: []
    output: Funder
    side_effects: ["status -> ACTIVE", "SUSPENDED pools -> FUNDED", "FROZEN programs -> ACTIVE"]

  # --- FundingPool ---
