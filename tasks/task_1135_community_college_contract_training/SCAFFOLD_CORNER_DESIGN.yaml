# =============================================================================
# §1.9 Scaffold Corner Design — Coverage Index for Non-Difficulty Tests
# Task 1135: Community College Contract Training
# =============================================================================
scaffold_corner_design:
  - section: entities
    instances:
      - name: employer_creation_applies_defaults
        claim_type: creation_defaults
        grounds:
          - entities.Employer
          - endpoints."POST /ct/employers"
        distinguishing_aspect: "New employer starts PROSPECT with both rollup fields 0 and version 1; system fields are server-minted."
        test_recipe:
          setup: ["empty DB; clock at default 2026-05-01T00:00:00Z"]
          setup_api_calls:
            - call: "POST /ct/employers"
              payload: { legal_name: "NewCo", industry_code: "111110", contact_email: "hr@newco.example" }
              as: WorkforceCoordinator
              as_user_id: "wc-01"
              captures: { emp: $.data.id }
          trigger:
            - call: "GET /ct/employers/${emp}"
              as: WorkforceCoordinator
              as_user_id: "wc-01"
          assert:
            - "Employer.${emp}.status == PROSPECT"
            - "Employer.${emp}.lifetime_billed_cents == 0 and follow_on_pipeline_cents == 0"
            - "Employer.${emp}.version == 1 and id/created_at are server-minted"

      - name: employer_create_missing_required_field_returns_invalid_request
        claim_type: required_fields
        grounds:
          - entities.Employer.fields.contact_email
          - validations[priority=4]
          - errors[ERR_INVALID_REQUEST]
        distinguishing_aspect: "Omitting required contact_email on employer create yields ERR_INVALID_REQUEST (400) and no row is created."
        test_recipe:
          setup: ["empty DB"]
          setup_api_calls: []
          trigger:
            - call: "POST /ct/employers"
              payload: { legal_name: "NoMail", industry_code: "111110" }
              as: WorkforceCoordinator
              as_user_id: "wc-01"
              captures: { err: $.data.error_id }
          assert:
            - "error_id == ERR_INVALID_REQUEST"

      - name: entity_get_unknown_id_returns_not_found
        claim_type: not_found
        grounds:
          - validations[priority=3]
          - errors[ERR_NOT_FOUND]
          - endpoints."GET /ct/employers/{id}"
        distinguishing_aspect: "GET with a well-formed but nonexistent UUID returns 404 ERR_NOT_FOUND."
        test_recipe:
          setup: ["empty DB"]
          setup_api_calls: []
          trigger:
            - call: "GET /ct/employers/8a3e1c0b-2f4d-4a91-9c8b-12e7b6a0f1d2"
              as: WorkforceCoordinator
              as_user_id: "wc-01"
              captures: { err: $.data.error_id }
          assert:
            - "error_id == ERR_NOT_FOUND (http 404)"

      - name: cohort_computed_enrolled_count_ignores_input
        claim_type: computed_fields
        grounds:
          - entities.Cohort.fields.enrolled_count
          - endpoints."POST /ct/training-agreements/{id}/cohorts"
        distinguishing_aspect: "enrolled_count is computed: the create schema does not even accept it, and after one enrollment it reads 1 regardless of any client attempt to set it."
        test_recipe:
          setup: ["SIGNED FLAT_COHORT ON_SITE agreement"]
          setup_api_calls:
            - call: "POST /ct/employers"
              payload: { legal_name: "CompCo", industry_code: "213111", contact_email: "hr@comp.example" }
              as: WorkforceCoordinator
              as_user_id: "wc-01"
              captures: { emp: $.data.id }
            - call: "POST /ct/employers/${emp}/needs-assessments"
              payload: { title: "T", skill_gaps: ["t"], target_roles: ["r"], curriculum_modules: [{ code: "T-1", hours: 2, required_credential_codes: [] }] }
              as: WorkforceCoordinator
              as_user_id: "wc-01"
              captures: { na: $.data.id }
            - call: "POST /ct/needs-assessments/${na}/submit"
              payload: {}
              as: WorkforceCoordinator
              as_user_id: "wc-01"
            - call: "POST /ct/needs-assessments/${na}/approve"
              payload: {}
              as: CollegeAdmin
              as_user_id: "adm-01"
            - call: "POST /ct/employers/${emp}/training-agreements"
              payload: { needs_assessment_id: "${na}", pricing_model: "FLAT_COHORT", delivery_mode: "ON_SITE", est_participant_count: 2, est_delivery_hours: 2, target_start_date: "2026-06-15T00:00:00Z", max_cohorts: 2 }
              as: WorkforceCoordinator
              as_user_id: "wc-01"
              captures: { agr: $.data.id }
            - call: "POST /ct/training-agreements/${agr}/quote"
              payload: {}
              as: WorkforceCoordinator
              as_user_id: "wc-01"
            - call: "POST /ct/training-agreements/${agr}/sign"
              payload: {}
              as: EmployerContact
              as_user_id: "${emp}"
          trigger:
            - call: "POST /ct/training-agreements/${agr}/cohorts"
              payload: { delivery_mode: "ON_SITE", min_enrollment: 1, start_date: "2026-06-15T00:00:00Z", end_date: "2026-06-15T00:00:00Z" }
              as: WorkforceCoordinator
              as_user_id: "wc-01"
              captures: { coh: $.data.id, ec0: $.data.enrolled_count }
            - call: "POST /ct/cohorts/${coh}/participants"
              payload: { external_employee_ref: "C01", full_name: "C One" }
              as: WorkforceCoordinator
              as_user_id: "wc-01"
            - call: "GET /ct/cohorts/${coh}"
              as: WorkforceCoordinator
              as_user_id: "wc-01"
              captures: { ec1: $.data.enrolled_count }
          assert:
            - "enrolled_count at creation == 0 (computed, not client-set)"
            - "after one participant create: enrolled_count == 1"

      - name: invalid_enum_on_agreement_create_rejected
        claim_type: type_constraints
        grounds:
          - entities.TrainingAgreement.fields.pricing_model
          - validations[priority=4]
          - errors[ERR_INVALID_REQUEST]
        distinguishing_aspect: "pricing_model outside {PER_PARTICIPANT, FLAT_COHORT} is rejected with ERR_INVALID_REQUEST before any state or business check."
        test_recipe:
          setup: ["Employer with APPROVED assessment"]
          setup_api_calls:
            - call: "POST /ct/employers"
              payload: { legal_name: "EnumCo", industry_code: "213112", contact_email: "hr@enum.example" }
              as: WorkforceCoordinator
              as_user_id: "wc-01"
              captures: { emp: $.data.id }
            - call: "POST /ct/employers/${emp}/needs-assessments"
              payload: { title: "T", skill_gaps: ["t"], target_roles: ["r"], curriculum_modules: [{ code: "T-1", hours: 2, required_credential_codes: [] }] }
              as: WorkforceCoordinator
              as_user_id: "wc-01"
              captures: { na: $.data.id }
            - call: "POST /ct/needs-assessments/${na}/submit"
              payload: {}
              as: WorkforceCoordinator
              as_user_id: "wc-01"
            - call: "POST /ct/needs-assessments/${na}/approve"
              payload: {}
              as: CollegeAdmin
              as_user_id: "adm-01"
          trigger:
            - call: "POST /ct/employers/${emp}/training-agreements"
              payload: { needs_assessment_id: "${na}", pricing_model: "PER_HEAD", delivery_mode: "ON_SITE", est_participant_count: 2, est_delivery_hours: 2, target_start_date: "2026-06-15T00:00:00Z", max_cohorts: 2 }
              as: WorkforceCoordinator
              as_user_id: "wc-01"
              captures: { err: $.data.error_id }
          assert:
            - "error_id == ERR_INVALID_REQUEST (400)"

  - section: state_machines
    instances:
      - name: assessment_initial_state_and_submit_transition
        claim_type: initial_state_and_valid_transition
        grounds:
          - state_machines.NeedsAssessment
          - endpoints."POST /ct/needs-assessments/{id}/submit"
        distinguishing_aspect: "A new assessment is DRAFT; submit moves it to SUBMITTED exactly once."
        test_recipe:
          setup: ["Employer exists"]
          setup_api_calls:
            - call: "POST /ct/employers"
              payload: { legal_name: "InitCo", industry_code: "111199", contact_email: "hr@init.example" }
              as: WorkforceCoordinator
              as_user_id: "wc-01"
              captures: { emp: $.data.id }
            - call: "POST /ct/employers/${emp}/needs-assessments"
              payload: { title: "T", skill_gaps: ["t"], target_roles: ["r"], curriculum_modules: [{ code: "T-1", hours: 2, required_credential_codes: [] }] }
              as: WorkforceCoordinator
              as_user_id: "wc-01"
              captures: { na: $.data.id, st0: $.data.status }
          trigger:
            - call: "POST /ct/needs-assessments/${na}/submit"
              payload: {}
              as: WorkforceCoordinator
              as_user_id: "wc-01"
              captures: { st1: $.data.status }
          assert:
            - "status at creation == DRAFT (initial_state)"
            - "after submit: status == SUBMITTED"

      - name: cancelled_agreement_terminal_lockdown_rejected
        claim_type: terminal_state_lockdown
        grounds:
          - state_machines.TrainingAgreement
          - errors[ERR_INVALID_STATE]
        distinguishing_aspect: "From terminal CANCELLED no further transition exists: sign on a cancelled agreement returns ERR_INVALID_STATE and leaves state unchanged."
        test_recipe:
          setup: ["Agreement QUOTED then CANCELLED"]
          setup_api_calls:
            - call: "POST /ct/employers"
              payload: { legal_name: "TermCo", industry_code: "111198", contact_email: "hr@term.example" }
              as: WorkforceCoordinator
              as_user_id: "wc-01"
              captures: { emp: $.data.id }
            - call: "POST /ct/employers/${emp}/needs-assessments"
              payload: { title: "T", skill_gaps: ["t"], target_roles: ["r"], curriculum_modules: [{ code: "T-1", hours: 2, required_credential_codes: [] }] }
              as: WorkforceCoordinator
              as_user_id: "wc-01"
              captures: { na: $.data.id }
            - call: "POST /ct/needs-assessments/${na}/submit"
              payload: {}
              as: WorkforceCoordinator
              as_user_id: "wc-01"
            - call: "POST /ct/needs-assessments/${na}/approve"
              payload: {}
              as: CollegeAdmin
              as_user_id: "adm-01"
            - call: "POST /ct/employers/${emp}/training-agreements"
              payload: { needs_assessment_id: "${na}", pricing_model: "FLAT_COHORT", delivery_mode: "ON_SITE", est_participant_count: 2, est_delivery_hours: 2, target_start_date: "2026-06-15T00:00:00Z", max_cohorts: 2 }
              as: WorkforceCoordinator
              as_user_id: "wc-01"
              captures: { agr: $.data.id }
            - call: "POST /ct/training-agreements/${agr}/quote"
              payload: {}
              as: WorkforceCoordinator
              as_user_id: "wc-01"
            - call: "POST /ct/training-agreements/${agr}/cancel"
              payload: {}
              as: WorkforceCoordinator
              as_user_id: "wc-01"
          trigger:
            - call: "POST /ct/training-agreements/${agr}/sign"
              payload: {}
              as: EmployerContact
              as_user_id: "${emp}"
              captures: { err: $.data.error_id }
          assert:
            - "error_id == ERR_INVALID_STATE (409); agreement remains CANCELLED"

      - name: invoice_paid_lockdown_void_rejected
        claim_type: invalid_transition
        grounds:
          - state_machines.Invoice
          - errors[ERR_INVALID_STATE]
          - endpoints."POST /ct/invoices/{id}/void"
        distinguishing_aspect: "void is declared only from DRAFT/ISSUED; a PAID invoice rejects void with ERR_INVALID_STATE."
        test_recipe:
          setup: ["Full delivered cohort with a PAID FINAL invoice (single 2h session, 1 participant full attendance, instructor rate 9000)"]
          setup_api_calls:
            - call: "POST /ct/employers"
              payload: { legal_name: "LockCo", industry_code: "111197", contact_email: "hr@lock.example" }
              as: WorkforceCoordinator
              as_user_id: "wc-01"
              captures: { emp: $.data.id }
            - call: "POST /ct/employers/${emp}/needs-assessments"
              payload: { title: "T", skill_gaps: ["t"], target_roles: ["r"], curriculum_modules: [{ code: "T-1", hours: 2, required_credential_codes: [] }] }
              as: WorkforceCoordinator
              as_user_id: "wc-01"
              captures: { na: $.data.id }
            - call: "POST /ct/needs-assessments/${na}/submit"
              payload: {}
              as: WorkforceCoordinator
              as_user_id: "wc-01"
            - call: "POST /ct/needs-assessments/${na}/approve"
              payload: {}
              as: CollegeAdmin
              as_user_id: "adm-01"
            - call: "POST /ct/employers/${emp}/training-agreements"
              payload: { needs_assessment_id: "${na}", pricing_model: "FLAT_COHORT", delivery_mode: "ON_SITE", est_participant_count: 1, est_delivery_hours: 2, target_start_date: "2026-06-15T00:00:00Z", max_cohorts: 2 }
              as: WorkforceCoordinator
              as_user_id: "wc-01"
              captures: { agr: $.data.id }
            - call: "POST /ct/training-agreements/${agr}/quote"
              payload: {}
              as: WorkforceCoordinator
              as_user_id: "wc-01"
            - call: "POST /ct/training-agreements/${agr}/sign"
              payload: {}
              as: EmployerContact
              as_user_id: "${emp}"
            - call: "POST /ct/venues"
              payload: { name: "Lock Site", kind: "EMPLOYER_SITE", capacity: 5, hourly_cost_cents: 0 }
              as: CollegeAdmin
              as_user_id: "adm-01"
              captures: { ven: $.data.id }
            - call: "POST /ct/training-agreements/${agr}/cohorts"
              payload: { delivery_mode: "ON_SITE", min_enrollment: 1, start_date: "2026-06-15T00:00:00Z", end_date: "2026-06-15T00:00:00Z", venue_id: "${ven}" }
              as: WorkforceCoordinator
              as_user_id: "wc-01"
              captures: { coh: $.data.id }
            - call: "POST /ct/cohorts/${coh}/sessions"
              payload: { venue_id: "${ven}", start_at: "2026-06-15T09:00:00Z", end_at: "2026-06-15T11:00:00Z" }
              as: WorkforceCoordinator
              as_user_id: "wc-01"
              captures: { s1: $.data.id }
            - call: "POST /ct/instructors"
              payload: { full_name: "Lou Instructor", credentials: [], hourly_rate_cents: 9000 }
              as: CollegeAdmin
              as_user_id: "adm-01"
              captures: { ins: $.data.id }
            - call: "POST /ct/sessions/${s1}/instructor-assignments"
              payload: { instructor_id: "${ins}" }
              as: WorkforceCoordinator
              as_user_id: "wc-01"
              captures: { asg: $.data.id }
            - call: "POST /ct/instructor-assignments/${asg}/confirm"
              payload: {}
              as: CredentialOfficer
              as_user_id: "co-01"
            - call: "POST /ct/cohorts/${coh}/participants"
              payload: { external_employee_ref: "L01", full_name: "L One" }
              as: WorkforceCoordinator
              as_user_id: "wc-01"
            - call: "POST /ct/cohorts/${coh}/launch"
              payload: {}
              as: WorkforceCoordinator
              as_user_id: "wc-01"
            - call: "POST /ct/sessions/${s1}/close_attendance"
              payload: { attendance: [{ external_employee_ref: "L01", attended_hours: 2 }] }
              as: Instructor
              as_user_id: "${ins}"
            - call: "POST /ct/cohorts/${coh}/invoices"
              payload: { variant: "FINAL" }
              as: BillingClerk
              as_user_id: "bc-01"
              captures: { inv: $.data.id }
            - call: "POST /ct/invoices/${inv}/issue"
              payload: {}
              as: BillingClerk
              as_user_id: "bc-01"
            - call: "POST /ct/invoices/${inv}/mark_paid"
              payload: {}
              as: BillingClerk
              as_user_id: "bc-01"
          trigger:
            - call: "POST /ct/invoices/${inv}/void"
              payload: {}
              as: BillingClerk
              as_user_id: "bc-01"
              captures: { err: $.data.error_id }
          assert:
            - "error_id == ERR_INVALID_STATE (PAID is terminal for void)"
            - "Invoice.${inv}.status == PAID still"

      - name: grant_program_suspend_reopen_cycle
        claim_type: cyclic_transition
        grounds:
          - state_machines.GrantProgram
        distinguishing_aspect: "OPEN -> SUSPENDED -> OPEN is a legal cycle; each suspend blocks submit until reopen."
        test_recipe:
          setup: ["Program GP OPEN"]
          setup_api_calls:
            - call: "POST /ct/grant-programs"
              payload: { code: "GP-CYC", name: "Cycle", appropriation_cents: 1000000, max_share_pct: 0.5, cap_per_trainee_cents: 50000, application_window_end: "2026-06-30T23:59:59Z", claim_deadline_days: 60 }
              as: CollegeAdmin
              as_user_id: "adm-01"
              captures: { gp: $.data.id }
          trigger:
            - call: "POST /ct/grant-programs/${gp}/suspend"
              payload: {}
              as: CollegeAdmin
              as_user_id: "adm-01"
              captures: { st1: $.data.status }
            - call: "POST /ct/grant-programs/${gp}/reopen"
              payload: {}
              as: CollegeAdmin
              as_user_id: "adm-01"
              captures: { st2: $.data.status }
          assert:
            - "after suspend: status == SUSPENDED"
            - "after reopen: status == OPEN (cycle traversed)"

      - name: cancel_cascade_skips_terminal_cohort
        claim_type: conditional_cascade
        grounds:
          - state_machines.TrainingAgreement.SIGNED_to_CANCELLED
          - state_machines.Cohort
        distinguishing_aspect: "The agreement-cancel cascade is conditional: only cohorts in {SCHEDULED, LAUNCHED, IN_PROGRESS} are cancelled; a CREDENTIALED cohort of the same agreement is untouched."
        test_recipe:
          setup:
            - "Agreement with two cohorts: C1 fully CREDENTIALED (1 session, 1 participant, full attendance, credentials issued); C2 SCHEDULED with 1 session + confirmed assignment + 1 participant"
          setup_api_calls:
            - call: "POST /ct/employers"
              payload: { legal_name: "CondCo", industry_code: "111196", contact_email: "hr@cond.example" }
              as: WorkforceCoordinator
              as_user_id: "wc-01"
              captures: { emp: $.data.id }
            - call: "POST /ct/employers/${emp}/needs-assessments"
              payload: { title: "T", skill_gaps: ["t"], target_roles: ["r"], curriculum_modules: [{ code: "T-1", hours: 2, required_credential_codes: [] }] }
              as: WorkforceCoordinator
              as_user_id: "wc-01"
              captures: { na: $.data.id }
            - call: "POST /ct/needs-assessments/${na}/submit"
              payload: {}
              as: WorkforceCoordinator
              as_user_id: "wc-01"
            - call: "POST /ct/needs-assessments/${na}/approve"
              payload: {}
              as: CollegeAdmin
              as_user_id: "adm-01"
            - call: "POST /ct/employers/${emp}/training-agreements"
              payload: { needs_assessment_id: "${na}", pricing_model: "FLAT_COHORT", delivery_mode: "ON_SITE", est_participant_count: 2, est_delivery_hours: 4, target_start_date: "2026-06-15T00:00:00Z", max_cohorts: 3 }
              as: WorkforceCoordinator
              as_user_id: "wc-01"
              captures: { agr: $.data.id }
            - call: "POST /ct/training-agreements/${agr}/quote"
              payload: {}
              as: WorkforceCoordinator
              as_user_id: "wc-01"
            - call: "POST /ct/training-agreements/${agr}/sign"
              payload: {}
              as: EmployerContact
              as_user_id: "${emp}"
            - call: "POST /ct/venues"
              payload: { name: "Cond Site", kind: "EMPLOYER_SITE", capacity: 8, hourly_cost_cents: 0 }
              as: CollegeAdmin
              as_user_id: "adm-01"
              captures: { ven: $.data.id }
            - call: "POST /ct/instructors"
              payload: { full_name: "Meg Instructor", credentials: [], hourly_rate_cents: 9000 }
              as: CollegeAdmin
              as_user_id: "adm-01"
              captures: { ins: $.data.id }
            - call: "POST /ct/training-agreements/${agr}/cohorts"
              payload: { delivery_mode: "ON_SITE", min_enrollment: 1, start_date: "2026-06-15T00:00:00Z", end_date: "2026-06-15T00:00:00Z", venue_id: "${ven}" }
              as: WorkforceCoordinator
              as_user_id: "wc-01"
              captures: { c1: $.data.id }
            - call: "POST /ct/cohorts/${c1}/sessions"
              payload: { venue_id: "${ven}", start_at: "2026-06-15T09:00:00Z", end_at: "2026-06-15T11:00:00Z" }
              as: WorkforceCoordinator
              as_user_id: "wc-01"
              captures: { s1: $.data.id }
            - call: "POST /ct/sessions/${s1}/instructor-assignments"
              payload: { instructor_id: "${ins}" }
              as: WorkforceCoordinator
              as_user_id: "wc-01"
              captures: { asg1: $.data.id }
            - call: "POST /ct/instructor-assignments/${asg1}/confirm"
              payload: {}
              as: CredentialOfficer
              as_user_id: "co-01"
            - call: "POST /ct/cohorts/${c1}/participants"
              payload: { external_employee_ref: "CC1", full_name: "C One" }
              as: WorkforceCoordinator
              as_user_id: "wc-01"
            - call: "POST /ct/cohorts/${c1}/launch"
              payload: {}
              as: WorkforceCoordinator
              as_user_id: "wc-01"
            - call: "POST /ct/sessions/${s1}/close_attendance"
              payload: { attendance: [{ external_employee_ref: "CC1", attended_hours: 2 }] }
              as: Instructor
              as_user_id: "${ins}"
            - call: "POST /ct/cohorts/${c1}/issue_credentials"
              payload: {}
              as: CredentialOfficer
              as_user_id: "co-01"
            - call: "POST /ct/training-agreements/${agr}/cohorts"
              payload: { delivery_mode: "ON_SITE", min_enrollment: 1, start_date: "2026-06-22T00:00:00Z", end_date: "2026-06-22T00:00:00Z", venue_id: "${ven}" }
              as: WorkforceCoordinator
              as_user_id: "wc-01"
              captures: { c2: $.data.id }
            - call: "POST /ct/cohorts/${c2}/sessions"
              payload: { venue_id: "${ven}", start_at: "2026-06-22T09:00:00Z", end_at: "2026-06-22T11:00:00Z" }
              as: WorkforceCoordinator
              as_user_id: "wc-01"
              captures: { s2: $.data.id }
            - call: "POST /ct/sessions/${s2}/instructor-assignments"
              payload: { instructor_id: "${ins}" }
              as: WorkforceCoordinator
              as_user_id: "wc-01"
              captures: { asg2: $.data.id }
            - call: "POST /ct/instructor-assignments/${asg2}/confirm"
              payload: {}
              as: CredentialOfficer
              as_user_id: "co-01"
            - call: "POST /ct/cohorts/${c2}/participants"
              payload: { external_employee_ref: "CC2", full_name: "C Two" }
              as: WorkforceCoordinator
              as_user_id: "wc-01"
          trigger:
            - call: "POST /ct/training-agreements/${agr}/cancel"
              payload: {}
              as: CollegeAdmin
              as_user_id: "adm-01"
            - call: "GET /ct/cohorts/${c1}"
              as: CollegeAdmin
              as_user_id: "adm-01"
              captures: { c1_st: $.data.delivery_status }
            - call: "GET /ct/cohorts/${c2}"
              as: CollegeAdmin
              as_user_id: "adm-01"
              captures: { c2_st: $.data.delivery_status }
          assert:
            - "Cohort.${c1}.delivery_status == CREDENTIALED (terminal cohort untouched by cascade)"
            - "Cohort.${c2}.delivery_status == CANCELLED (non-terminal cohort cascaded)"
            - "TrainingAgreement.${agr}.contract_status == CANCELLED"

  - section: calculations
    instances:
      - name: credential_match_score_recency_weighting
        claim_type: correct_result
        grounds:
          - calculations.credential_match_score
