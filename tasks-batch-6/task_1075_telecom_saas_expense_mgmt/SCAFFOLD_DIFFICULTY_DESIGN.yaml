            - "HTTP status == 409"

      - name: renew_referential_beats_temporal_vendor_suspended
        grounds:
          - validations[priority=6]
          - validations[priority=7]
          - errors[ERR_VENDOR_SUSPENDED]
          - errors[ERR_OUTSIDE_RENEWAL_WINDOW]
        distinguishing_aspect: |
          On renew the referential check (vendor SUSPENDED, priority 6) outranks the temporal check (clock 2026-10-31 is
          before the 2026-11-01 window open, priority 7); the response is ERR_VENDOR_SUSPENDED, not ERR_OUTSIDE_RENEWAL_WINDOW.
        test_recipe:
          setup:
            - "ACTIVE contract term_end 2026-12-31 notice 60; vendor then SUSPENDED; clock 2026-10-31 (outside the renewal window)."
          setup_api_calls:
            - call: "POST /vendors"
