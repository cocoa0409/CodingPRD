# =============================================================================
# SCAFFOLD_DIFFICULTY_DESIGN.yaml — §1.8 Test Targeting Index
# Infusion Prior Authorization & Site-of-Care Steering
# =============================================================================
scaffold_difficulty_design:
  - rule_id: dual_variant_calc
    instances:
      - name: responsibility_accumulator_vs_billed_variant
        grounds:
          - calculations.patient_responsibility_estimate
          - entities.FinancialClearance.fields.method
          - entities.FinancialClearance.fields.estimated_patient_responsibility_cents
        distinguishing_aspect: |
          Two policies differing ONLY in allowed_amount_known route the identical line-item set through
          ACCUMULATOR_METHOD (allowed-amount base) and BILLED_CHARGES_METHOD (discounted billed base);
          with discount_rate 1.00 the estimates are 100000 vs 114000 cents — different results on the
          FinancialClearance entity domain for identical inputs.
        test_recipe:
          setup:
            - "Policy A (PAYERX/J9001) with allowed_amount_known=true; Policy B (PAYERX/J9002) with allowed_amount_known=false, discount_rate 1.00; both deductible_cents 100000, coinsurance_pct 0.20, prepay_limit_cents 250000"
            - "Two patients with identical accumulators (deductible_remaining_cents 50000, oop_remaining_cents 300000), each with a fully APPROVED authorization (dose 500, OFFICE) under its policy"
            - "Each clearance carries line items L1 (allowed 200000, billed 250000) and L2 (allowed 100000, billed 120000) added in that order"
          setup_api_calls:
            - { call: "POST /infusion/payer-policies", payload: { payer_code: "PAYERX", drug_code: "J9001", regimen_name: "DrugA q4w", benefit_channel: "MEDICAL", validity_days: 90, max_course_days: 60, max_dose_mg: 1000, deductible_cents: 100000, coinsurance_pct: 0.20, oop_max_cents: 500000, prepay_limit_cents: 250000 }, as: PolicyAdmin, as_user_id: "admin-1", captures: { pol_a: $.data.id } }
            - { call: "POST /infusion/payer-policies", payload: { payer_code: "PAYERX", drug_code: "J9002", regimen_name: "DrugA q4w", benefit_channel: "MEDICAL", validity_days: 90, max_course_days: 60, max_dose_mg: 1000, deductible_cents: 100000, coinsurance_pct: 0.20, oop_max_cents: 500000, prepay_limit_cents: 250000, allowed_amount_known: false, discount_rate: 1.00 }, as: PolicyAdmin, as_user_id: "admin-1", captures: { pol_b: $.data.id } }
            - { call: "POST /infusion/patients", payload: { member_id: "M100A", full_name: "Pat Alpha", diagnosis_code: "C50", payer_code: "PAYERX", plan_year_end: "2026-12-31T00:00:00Z", deductible_remaining_cents: 50000, oop_remaining_cents: 300000 }, as: AuthCoordinator, as_user_id: "coord-1", captures: { pat_a: $.data.id } }
            - { call: "POST /infusion/patients", payload: { member_id: "M100B", full_name: "Pat Beta", diagnosis_code: "C50", payer_code: "PAYERX", plan_year_end: "2026-12-31T00:00:00Z", deductible_remaining_cents: 50000, oop_remaining_cents: 300000 }, as: AuthCoordinator, as_user_id: "coord-1", captures: { pat_b: $.data.id } }
            - { call: "POST /infusion/authorization-requests", payload: { patient_id: "${pat_a}", policy_id: "${pol_a}", requested_site_type: "OFFICE", requested_dose_mg: 500, patient_weight_kg: 70 }, as: AuthCoordinator, as_user_id: "coord-1", captures: { auth_a: $.data.id } }
            - { call: "POST /infusion/authorization-requests/${auth_a}/benefit-investigations", payload: {}, as: AuthCoordinator, as_user_id: "coord-1", captures: { bi_a: $.data.id } }
            - { call: "POST /infusion/benefit-investigations/${bi_a}/verify", payload: { determined_channel: "MEDICAL" }, as: FinanceSpecialist, as_user_id: "fin-1" }
            - { call: "POST /infusion/authorization-requests/${auth_a}/criteria-submissions", payload: { criterion_code: "DIAG_CONFIRM", response_value: "biopsy-on-file" }, as: AuthCoordinator, as_user_id: "coord-1", captures: { cs_a: $.data.id } }
            - { call: "POST /infusion/criteria-submissions/${cs_a}/reviews", payload: { outcome: "ACCEPTED" }, as: MedicalDirector, as_user_id: "md-1" }
            - { call: "POST /infusion/authorization-requests/${auth_a}/site-of-care-determinations", payload: { home_allowed_cents: 100000, hospital_allowed_cents: 300000, home_billed_cents: 120000, hospital_billed_cents: 360000 }, as: MedicalDirector, as_user_id: "md-1" }
            - { call: "POST /infusion/authorization-requests/${auth_a}/submit", payload: {}, as: AuthCoordinator, as_user_id: "coord-1", captures: { v_a: $.data.version } }
            - { call: "POST /infusion/authorization-requests/${auth_a}/determinations", payload: { outcome: "APPROVED", expected_authorization_version: "${v_a}" }, as: MedicalDirector, as_user_id: "md-2" }
            - { call: "POST /infusion/authorization-requests", payload: { patient_id: "${pat_b}", policy_id: "${pol_b}", requested_site_type: "OFFICE", requested_dose_mg: 500, patient_weight_kg: 70 }, as: AuthCoordinator, as_user_id: "coord-1", captures: { auth_b: $.data.id } }
            - { call: "POST /infusion/authorization-requests/${auth_b}/benefit-investigations", payload: {}, as: AuthCoordinator, as_user_id: "coord-1", captures: { bi_b: $.data.id } }
            - { call: "POST /infusion/benefit-investigations/${bi_b}/verify", payload: { determined_channel: "MEDICAL" }, as: FinanceSpecialist, as_user_id: "fin-1" }
            - { call: "POST /infusion/authorization-requests/${auth_b}/criteria-submissions", payload: { criterion_code: "DIAG_CONFIRM", response_value: "biopsy-on-file" }, as: AuthCoordinator, as_user_id: "coord-1", captures: { cs_b: $.data.id } }
            - { call: "POST /infusion/criteria-submissions/${cs_b}/reviews", payload: { outcome: "ACCEPTED" }, as: MedicalDirector, as_user_id: "md-1" }
            - { call: "POST /infusion/authorization-requests/${auth_b}/site-of-care-determinations", payload: { home_allowed_cents: 100000, hospital_allowed_cents: 300000, home_billed_cents: 120000, hospital_billed_cents: 360000 }, as: MedicalDirector, as_user_id: "md-1" }
            - { call: "POST /infusion/authorization-requests/${auth_b}/submit", payload: {}, as: AuthCoordinator, as_user_id: "coord-1", captures: { v_b: $.data.version } }
            - { call: "POST /infusion/authorization-requests/${auth_b}/determinations", payload: { outcome: "APPROVED", expected_authorization_version: "${v_b}" }, as: MedicalDirector, as_user_id: "md-2" }
            - { call: "POST /infusion/authorization-requests/${auth_a}/financial-clearances", payload: {}, as: FinanceSpecialist, as_user_id: "fin-1", captures: { fc_a: $.data.id } }
            - { call: "POST /infusion/financial-clearances/${fc_a}/line-items", payload: { description: "drug", allowed_amount_cents: 200000, billed_charges_cents: 250000 }, as: FinanceSpecialist, as_user_id: "fin-1", captures: { l_a1_share: $.data.patient_share_cents } }
            - { call: "POST /infusion/financial-clearances/${fc_a}/line-items", payload: { description: "admin", allowed_amount_cents: 100000, billed_charges_cents: 120000 }, as: FinanceSpecialist, as_user_id: "fin-1", captures: { l_a2_share: $.data.patient_share_cents } }
            - { call: "POST /infusion/authorization-requests/${auth_b}/financial-clearances", payload: {}, as: FinanceSpecialist, as_user_id: "fin-1", captures: { fc_b: $.data.id, method_b: $.data.method } }
            - { call: "POST /infusion/financial-clearances/${fc_b}/line-items", payload: { description: "drug", allowed_amount_cents: 200000, billed_charges_cents: 250000 }, as: FinanceSpecialist, as_user_id: "fin-1" }
            - { call: "POST /infusion/financial-clearances/${fc_b}/line-items", payload: { description: "admin", allowed_amount_cents: 100000, billed_charges_cents: 120000 }, as: FinanceSpecialist, as_user_id: "fin-1" }
          trigger:
            - { call: "GET /infusion/financial-clearances/${fc_a}", payload: {}, as: FinanceSpecialist, as_user_id: "fin-1", captures: { est_a: $.data.estimated_patient_responsibility_cents, method_a: $.data.method } }
            - { call: "GET /infusion/financial-clearances/${fc_b}", payload: {}, as: FinanceSpecialist, as_user_id: "fin-1", captures: { est_b: $.data.estimated_patient_responsibility_cents } }
          assert:
            - "FinancialClearance.${fc_a}.method == ACCUMULATOR_METHOD and FinancialClearance.${fc_b}.method == BILLED_CHARGES_METHOD"
            - "FinancialClearance.${fc_a}.estimated_patient_responsibility_cents == 100000"
            - "FinancialClearance.${fc_b}.estimated_patient_responsibility_cents == 114000"
            - "ResponsibilityLineItem shares on ${fc_a} are [80000, 20000]; on ${fc_b} they are [90000, 24000]"
            - "${est_a} != ${est_b}"
      - name: site_score_cost_ratio_vs_travel_burden_variant
        grounds:
          - calculations.site_steering_score
          - entities.SiteOfCareDetermination.fields.score_variant
          - entities.SiteOfCareDetermination.fields.steer_score
        distinguishing_aspect: |
          Identical cost inputs on two patients differing ONLY in rural_resident select COST_RATIO
          (allowed-amount ratio, burden weight 0.5 -> steer_score 3.125) vs TRAVEL_BURDEN (billed-charges
          ratio, burden weight 1.0 -> steer_score 3.250): same inputs, two valid variants, different
          numeric results on the SiteOfCareDetermination entity domain (distinct from FinancialClearance).
        test_recipe:
          setup:
            - "Policy with site_policy STEER_TO_HOME, steer_threshold 1.50 (other fields standard)"
            - "Patient URBAN (rural_resident false, travel_minutes_to_hospital 30) and patient RURAL (rural_resident true, travel 30), each with a DRAFT authorization requesting HOSPITAL_OUTPATIENT"
          setup_api_calls:
            - { call: "POST /infusion/payer-policies", payload: { payer_code: "PAYERX", drug_code: "J9003", regimen_name: "DrugA q4w", benefit_channel: "MEDICAL", validity_days: 90, max_course_days: 60, max_dose_mg: 1000, deductible_cents: 100000, coinsurance_pct: 0.20, oop_max_cents: 500000, prepay_limit_cents: 250000, site_policy: "STEER_TO_HOME", steer_threshold: 1.50 }, as: PolicyAdmin, as_user_id: "admin-1", captures: { pol_s: $.data.id } }
            - { call: "POST /infusion/patients", payload: { member_id: "M200U", full_name: "Urban U", diagnosis_code: "C50", payer_code: "PAYERX", plan_year_end: "2026-12-31T00:00:00Z", deductible_remaining_cents: 50000, oop_remaining_cents: 300000, rural_resident: false, travel_minutes_to_hospital: 30 }, as: AuthCoordinator, as_user_id: "coord-1", captures: { pat_u: $.data.id } }
            - { call: "POST /infusion/patients", payload: { member_id: "M200R", full_name: "Rural R", diagnosis_code: "C50", payer_code: "PAYERX", plan_year_end: "2026-12-31T00:00:00Z", deductible_remaining_cents: 50000, oop_remaining_cents: 300000, rural_resident: true, travel_minutes_to_hospital: 30 }, as: AuthCoordinator, as_user_id: "coord-1", captures: { pat_r: $.data.id } }
            - { call: "POST /infusion/authorization-requests", payload: { patient_id: "${pat_u}", policy_id: "${pol_s}", requested_site_type: "HOSPITAL_OUTPATIENT", requested_dose_mg: 500, patient_weight_kg: 70 }, as: AuthCoordinator, as_user_id: "coord-1", captures: { auth_u: $.data.id } }
            - { call: "POST /infusion/authorization-requests", payload: { patient_id: "${pat_r}", policy_id: "${pol_s}", requested_site_type: "HOSPITAL_OUTPATIENT", requested_dose_mg: 500, patient_weight_kg: 70 }, as: AuthCoordinator, as_user_id: "coord-1", captures: { auth_r: $.data.id } }
          trigger:
            - { call: "POST /infusion/authorization-requests/${auth_u}/site-of-care-determinations", payload: { home_allowed_cents: 100000, hospital_allowed_cents: 300000, home_billed_cents: 120000, hospital_billed_cents: 360000 }, as: MedicalDirector, as_user_id: "md-1", captures: { score_u: $.data.steer_score, variant_u: $.data.score_variant } }
            - { call: "POST /infusion/authorization-requests/${auth_r}/site-of-care-determinations", payload: { home_allowed_cents: 100000, hospital_allowed_cents: 300000, home_billed_cents: 120000, hospital_billed_cents: 360000 }, as: MedicalDirector, as_user_id: "md-1", captures: { score_r: $.data.steer_score, variant_r: $.data.score_variant } }
          assert:
            - "SiteOfCareDetermination for ${auth_u}: score_variant == COST_RATIO and steer_score == 3.125"
            - "SiteOfCareDetermination for ${auth_r}: score_variant == TRAVEL_BURDEN and steer_score == 3.250"
            - "${score_u} != ${score_r}"
            - "Both determinations: recommended_site_type == HOME and steered == true (3.125 >= 1.50 and 3.250 >= 1.50)"

  - rule_id: combinatorial_formula
    instances:
      - name: validity_window_nested_min_three_dates
        grounds:
          - calculations.auth_validity_window
          - entities.AuthorizationRequest.fields.auth_valid_to
        distinguishing_aspect: |
          Mode (a): >=3 inputs with nested min and a channel-conditional branch. Policy W1 (validity_days 90,
          max_course_days 60, plan_year_end 2026-12-31) makes the COURSE CAP bind -> auth_valid_to
          2026-09-30T00:00:00Z; policy W2 (validity_days 30, max_course_days 60) makes the VALIDITY DAYS
          input bind -> 2026-08-31T00:00:00Z. The winning input of the min differs between the two.
        test_recipe:
          setup:
            - "Policies W1 (drug J9011: validity 90, course 60) and W2 (drug J9012: validity 30, course 60); patients with plan_year_end 2026-12-31T00:00:00Z; logical clock at startup default 2026-08-01T00:00:00Z"
            - "Each policy has a fully approved authorization (decision date 2026-08-01)"
          setup_api_calls:
            - { call: "POST /infusion/payer-policies", payload: { payer_code: "PAYERX", drug_code: "J9011", regimen_name: "W1", benefit_channel: "MEDICAL", validity_days: 90, max_course_days: 60, max_dose_mg: 1000, deductible_cents: 100000, coinsurance_pct: 0.20, oop_max_cents: 500000, prepay_limit_cents: 250000 }, as: PolicyAdmin, as_user_id: "admin-1", captures: { pol_w1: $.data.id } }
            - { call: "POST /infusion/payer-policies", payload: { payer_code: "PAYERX", drug_code: "J9012", regimen_name: "W2", benefit_channel: "MEDICAL", validity_days: 30, max_course_days: 60, max_dose_mg: 1000, deductible_cents: 100000, coinsurance_pct: 0.20, oop_max_cents: 500000, prepay_limit_cents: 250000 }, as: PolicyAdmin, as_user_id: "admin-1", captures: { pol_w2: $.data.id } }
            - { call: "POST /infusion/patients", payload: { member_id: "M301", full_name: "Win One", diagnosis_code: "C50", payer_code: "PAYERX", plan_year_end: "2026-12-31T00:00:00Z", deductible_remaining_cents: 50000, oop_remaining_cents: 300000 }, as: AuthCoordinator, as_user_id: "coord-1", captures: { pat_w1: $.data.id } }
            - { call: "POST /infusion/patients", payload: { member_id: "M302", full_name: "Win Two", diagnosis_code: "C50", payer_code: "PAYERX", plan_year_end: "2026-12-31T00:00:00Z", deductible_remaining_cents: 50000, oop_remaining_cents: 300000 }, as: AuthCoordinator, as_user_id: "coord-1", captures: { pat_w2: $.data.id } }
            - { call: "POST /infusion/authorization-requests", payload: { patient_id: "${pat_w1}", policy_id: "${pol_w1}", requested_site_type: "OFFICE", requested_dose_mg: 500, patient_weight_kg: 70 }, as: AuthCoordinator, as_user_id: "coord-1", captures: { auth_w1: $.data.id } }
            - { call: "POST /infusion/authorization-requests/${auth_w1}/benefit-investigations", payload: {}, as: AuthCoordinator, as_user_id: "coord-1", captures: { bi_w1: $.data.id } }
            - { call: "POST /infusion/benefit-investigations/${bi_w1}/verify", payload: { determined_channel: "MEDICAL" }, as: FinanceSpecialist, as_user_id: "fin-1" }
            - { call: "POST /infusion/authorization-requests/${auth_w1}/criteria-submissions", payload: { criterion_code: "DIAG_CONFIRM", response_value: "yes" }, as: AuthCoordinator, as_user_id: "coord-1", captures: { cs_w1: $.data.id } }
            - { call: "POST /infusion/criteria-submissions/${cs_w1}/reviews", payload: { outcome: "ACCEPTED" }, as: MedicalDirector, as_user_id: "md-1" }
            - { call: "POST /infusion/authorization-requests/${auth_w1}/site-of-care-determinations", payload: { home_allowed_cents: 100000, hospital_allowed_cents: 300000, home_billed_cents: 120000, hospital_billed_cents: 360000 }, as: MedicalDirector, as_user_id: "md-1" }
            - { call: "POST /infusion/authorization-requests/${auth_w1}/submit", payload: {}, as: AuthCoordinator, as_user_id: "coord-1", captures: { v_w1: $.data.version } }
            - { call: "POST /infusion/authorization-requests/${auth_w1}/determinations", payload: { outcome: "APPROVED", expected_authorization_version: "${v_w1}" }, as: MedicalDirector, as_user_id: "md-2" }
            - { call: "POST /infusion/authorization-requests", payload: { patient_id: "${pat_w2}", policy_id: "${pol_w2}", requested_site_type: "OFFICE", requested_dose_mg: 500, patient_weight_kg: 70 }, as: AuthCoordinator, as_user_id: "coord-1", captures: { auth_w2: $.data.id } }
            - { call: "POST /infusion/authorization-requests/${auth_w2}/benefit-investigations", payload: {}, as: AuthCoordinator, as_user_id: "coord-1", captures: { bi_w2: $.data.id } }
            - { call: "POST /infusion/benefit-investigations/${bi_w2}/verify", payload: { determined_channel: "MEDICAL" }, as: FinanceSpecialist, as_user_id: "fin-1" }
            - { call: "POST /infusion/authorization-requests/${auth_w2}/criteria-submissions", payload: { criterion_code: "DIAG_CONFIRM", response_value: "yes" }, as: AuthCoordinator, as_user_id: "coord-1", captures: { cs_w2: $.data.id } }
            - { call: "POST /infusion/criteria-submissions/${cs_w2}/reviews", payload: { outcome: "ACCEPTED" }, as: MedicalDirector, as_user_id: "md-1" }
            - { call: "POST /infusion/authorization-requests/${auth_w2}/site-of-care-determinations", payload: { home_allowed_cents: 100000, hospital_allowed_cents: 300000, home_billed_cents: 120000, hospital_billed_cents: 360000 }, as: MedicalDirector, as_user_id: "md-1" }
            - { call: "POST /infusion/authorization-requests/${auth_w2}/submit", payload: {}, as: AuthCoordinator, as_user_id: "coord-1", captures: { v_w2: $.data.version } }
            - { call: "POST /infusion/authorization-requests/${auth_w2}/determinations", payload: { outcome: "APPROVED", expected_authorization_version: "${v_w2}" }, as: MedicalDirector, as_user_id: "md-2" }
          trigger:
            - { call: "GET /infusion/authorization-requests/${auth_w1}", payload: {}, as: AuthCoordinator, as_user_id: "coord-1", captures: { vf_w1: $.data.auth_valid_from, vt_w1: $.data.auth_valid_to } }
            - { call: "GET /infusion/authorization-requests/${auth_w2}", payload: {}, as: AuthCoordinator, as_user_id: "coord-1", captures: { vt_w2: $.data.auth_valid_to } }
          assert:
            - "AuthorizationRequest.${auth_w1}.auth_valid_from == 2026-08-01T00:00:00Z"
            - "AuthorizationRequest.${auth_w1}.auth_valid_to == 2026-09-30T00:00:00Z (course cap 60d binds, not validity 90d -> 2026-10-30, not plan_year_end)"
            - "AuthorizationRequest.${auth_w2}.auth_valid_to == 2026-08-31T00:00:00Z (validity_days 30 binds)"
      - name: responsibility_per_line_rounding_then_sum
        grounds:
          - calculations.patient_responsibility_estimate
          - entities.ResponsibilityLineItem.fields.patient_share_cents
        distinguishing_aspect: |
          Mode (b): nested rounding order is pinned — round each line's coinsurance half-up to whole cents,
          THEN sum. Three lines of allowed 33333 at coinsurance 0.20 with zero deductible yield
          3 x round(6666.6) = 20001; the alternative sum-then-round would give round(19999.8) = 20000.
          Distinct mode from the nested-min instance (mode a).
        test_recipe:
          setup:
            - "Policy (drug J9013) coinsurance_pct 0.20; patient with deductible_remaining_cents 0 and oop_remaining_cents 900000; approved authorization; clearance with three ACTIVE line items of allowed 33333 each"
          setup_api_calls:
            - { call: "POST /infusion/payer-policies", payload: { payer_code: "PAYERX", drug_code: "J9013", regimen_name: "RoundTest", benefit_channel: "MEDICAL", validity_days: 90, max_course_days: 60, max_dose_mg: 1000, deductible_cents: 0, coinsurance_pct: 0.20, oop_max_cents: 500000, prepay_limit_cents: 250000 }, as: PolicyAdmin, as_user_id: "admin-1", captures: { pol_r: $.data.id } }
            - { call: "POST /infusion/patients", payload: { member_id: "M303", full_name: "Round P", diagnosis_code: "C50", payer_code: "PAYERX", plan_year_end: "2026-12-31T00:00:00Z", deductible_remaining_cents: 0, oop_remaining_cents: 900000 }, as: AuthCoordinator, as_user_id: "coord-1", captures: { pat_r2: $.data.id } }
            - { call: "POST /infusion/authorization-requests", payload: { patient_id: "${pat_r2}", policy_id: "${pol_r}", requested_site_type: "OFFICE", requested_dose_mg: 500, patient_weight_kg: 70 }, as: AuthCoordinator, as_user_id: "coord-1", captures: { auth_r2: $.data.id } }
            - { call: "POST /infusion/authorization-requests/${auth_r2}/benefit-investigations", payload: {}, as: AuthCoordinator, as_user_id: "coord-1", captures: { bi_r2: $.data.id } }
            - { call: "POST /infusion/benefit-investigations/${bi_r2}/verify", payload: { determined_channel: "MEDICAL" }, as: FinanceSpecialist, as_user_id: "fin-1" }
            - { call: "POST /infusion/authorization-requests/${auth_r2}/criteria-submissions", payload: { criterion_code: "DIAG_CONFIRM", response_value: "yes" }, as: AuthCoordinator, as_user_id: "coord-1", captures: { cs_r2: $.data.id } }
            - { call: "POST /infusion/criteria-submissions/${cs_r2}/reviews", payload: { outcome: "ACCEPTED" }, as: MedicalDirector, as_user_id: "md-1" }
            - { call: "POST /infusion/authorization-requests/${auth_r2}/site-of-care-determinations", payload: { home_allowed_cents: 100000, hospital_allowed_cents: 300000, home_billed_cents: 120000, hospital_billed_cents: 360000 }, as: MedicalDirector, as_user_id: "md-1" }
            - { call: "POST /infusion/authorization-requests/${auth_r2}/submit", payload: {}, as: AuthCoordinator, as_user_id: "coord-1", captures: { v_r2: $.data.version } }
            - { call: "POST /infusion/authorization-requests/${auth_r2}/determinations", payload: { outcome: "APPROVED", expected_authorization_version: "${v_r2}" }, as: MedicalDirector, as_user_id: "md-2" }
            - { call: "POST /infusion/authorization-requests/${auth_r2}/financial-clearances", payload: {}, as: FinanceSpecialist, as_user_id: "fin-1", captures: { fc_r: $.data.id } }
            - { call: "POST /infusion/financial-clearances/${fc_r}/line-items", payload: { description: "L1", allowed_amount_cents: 33333, billed_charges_cents: 33333 }, as: FinanceSpecialist, as_user_id: "fin-1", captures: { s1: $.data.patient_share_cents } }
            - { call: "POST /infusion/financial-clearances/${fc_r}/line-items", payload: { description: "L2", allowed_amount_cents: 33333, billed_charges_cents: 33333 }, as: FinanceSpecialist, as_user_id: "fin-1", captures: { s2: $.data.patient_share_cents } }
            - { call: "POST /infusion/financial-clearances/${fc_r}/line-items", payload: { description: "L3", allowed_amount_cents: 33333, billed_charges_cents: 33333 }, as: FinanceSpecialist, as_user_id: "fin-1", captures: { s3: $.data.patient_share_cents } }
          trigger:
            - { call: "GET /infusion/financial-clearances/${fc_r}", payload: {}, as: FinanceSpecialist, as_user_id: "fin-1", captures: { est_r: $.data.estimated_patient_responsibility_cents } }
          assert:
            - "Each ResponsibilityLineItem.patient_share_cents == 6667 (round_half_up(33333 * 0.20) = round_half_up(6666.6))"
            - "FinancialClearance.${fc_r}.estimated_patient_responsibility_cents == 20001 (NOT 20000 — per-line rounding then sum)"

  - rule_id: non_linear_state_machine
    instances:
      - name: auth_pend_resubmit_cycle
        grounds:
          - state_machines.AuthorizationRequest.SUBMITTED_to_PENDED
          - state_machines.AuthorizationRequest.PENDED_to_SUBMITTED
        distinguishing_aspect: |
          AuthorizationRequest runs the cycle SUBMITTED -> PENDED -> SUBMITTED -> APPROVED: resubmission
          is only accepted after a fresh ACCEPTED criteria submission created after pended_at, proving the
          machine is cyclic rather than a linear pipeline.
        test_recipe:
          setup:
            - "Policy/patient/request in DRAFT with verified benefit, one ACCEPTED criterion, and a site determination; then submitted and PENDED"
          setup_api_calls:
            - { call: "POST /infusion/payer-policies", payload: { payer_code: "PAYERX", drug_code: "J9021", regimen_name: "CycleTest", benefit_channel: "MEDICAL", validity_days: 90, max_course_days: 60, max_dose_mg: 1000, deductible_cents: 100000, coinsurance_pct: 0.20, oop_max_cents: 500000, prepay_limit_cents: 250000 }, as: PolicyAdmin, as_user_id: "admin-1", captures: { pol_c: $.data.id } }
            - { call: "POST /infusion/patients", payload: { member_id: "M401", full_name: "Cyc P", diagnosis_code: "C50", payer_code: "PAYERX", plan_year_end: "2026-12-31T00:00:00Z", deductible_remaining_cents: 50000, oop_remaining_cents: 300000 }, as: AuthCoordinator, as_user_id: "coord-1", captures: { pat_c: $.data.id } }
            - { call: "POST /infusion/authorization-requests", payload: { patient_id: "${pat_c}", policy_id: "${pol_c}", requested_site_type: "OFFICE", requested_dose_mg: 500, patient_weight_kg: 70 }, as: AuthCoordinator, as_user_id: "coord-1", captures: { auth_c: $.data.id } }
            - { call: "POST /infusion/authorization-requests/${auth_c}/benefit-investigations", payload: {}, as: AuthCoordinator, as_user_id: "coord-1", captures: { bi_c: $.data.id } }
            - { call: "POST /infusion/benefit-investigations/${bi_c}/verify", payload: { determined_channel: "MEDICAL" }, as: FinanceSpecialist, as_user_id: "fin-1" }
            - { call: "POST /infusion/authorization-requests/${auth_c}/criteria-submissions", payload: { criterion_code: "DIAG_CONFIRM", response_value: "yes" }, as: AuthCoordinator, as_user_id: "coord-1", captures: { cs_c1: $.data.id } }
            - { call: "POST /infusion/criteria-submissions/${cs_c1}/reviews", payload: { outcome: "ACCEPTED" }, as: MedicalDirector, as_user_id: "md-1" }
            - { call: "POST /infusion/authorization-requests/${auth_c}/site-of-care-determinations", payload: { home_allowed_cents: 100000, hospital_allowed_cents: 300000, home_billed_cents: 120000, hospital_billed_cents: 360000 }, as: MedicalDirector, as_user_id: "md-1" }
            - { call: "POST /infusion/authorization-requests/${auth_c}/submit", payload: {}, as: AuthCoordinator, as_user_id: "coord-1", captures: { v_c2: $.data.version } }
          trigger:
            - { call: "POST /infusion/authorization-requests/${auth_c}/determinations", payload: { outcome: "PENDED", expected_authorization_version: "${v_c2}" }, as: MedicalDirector, as_user_id: "md-2", captures: { st_pend: $.data.status, v_c3: $.data.version } }
            - { call: "POST /infusion/authorization-requests/${auth_c}/criteria-submissions", payload: { criterion_code: "PRIOR_THERAPY_FAIL", response_value: "methotrexate-12wk" }, as: AuthCoordinator, as_user_id: "coord-1", captures: { cs_c2: $.data.id } }
            - { call: "POST /infusion/criteria-submissions/${cs_c2}/reviews", payload: { outcome: "ACCEPTED" }, as: MedicalDirector, as_user_id: "md-1" }
            - { call: "POST /infusion/authorization-requests/${auth_c}/submit", payload: {}, as: AuthCoordinator, as_user_id: "coord-1", captures: { st_resub: $.data.status, v_c4: $.data.version } }
            - { call: "POST /infusion/authorization-requests/${auth_c}/determinations", payload: { outcome: "APPROVED", expected_authorization_version: "${v_c4}" }, as: MedicalDirector, as_user_id: "md-2", captures: { st_fin: $.data.status } }
          assert:
            - "After PENDED determination: status == PENDED (was SUBMITTED)"
            - "Resubmit after fresh ACCEPTED criterion: status == SUBMITTED (cycle back)"
            - "Final determination: status == APPROVED and auth_valid_from == 2026-08-01T00:00:00Z"
            - "Versions advance strictly: submit ${v_c2} -> pend ${v_c3} -> resubmit ${v_c4}"
      - name: p2p_reschedule_cycle_with_limit
        grounds:
          - state_machines.PeerToPeerReview.SCHEDULED_to_SCHEDULED
          - state_machines.PeerToPeerReview.NO_SHOW_to_SCHEDULED
          - validations[priority=19]
        distinguishing_aspect: |
          PeerToPeerReview loops SCHEDULED -> SCHEDULED via reschedule (count 1, then 2) and the third
          reschedule is rejected with ERR_P2P_RESCHEDULE_LIMIT — a self-loop cycle with a termination
          counter, on a different entity than AuthorizationRequest.
        test_recipe:
          setup:
            - "Denied authorization with an appeal decided UPHELD at LEVEL_1 (status LEVEL_1_DECIDED) and one SCHEDULED peer-to-peer review for reviewer md-9"
          setup_api_calls:
            - { call: "POST /infusion/payer-policies", payload: { payer_code: "PAYERX", drug_code: "J9022", regimen_name: "P2PTest", benefit_channel: "MEDICAL", validity_days: 90, max_course_days: 60, max_dose_mg: 1000, deductible_cents: 100000, coinsurance_pct: 0.20, oop_max_cents: 500000, prepay_limit_cents: 250000 }, as: PolicyAdmin, as_user_id: "admin-1", captures: { pol_p: $.data.id } }
            - { call: "POST /infusion/patients", payload: { member_id: "M402", full_name: "P2P Pat", diagnosis_code: "C50", payer_code: "PAYERX", plan_year_end: "2026-12-31T00:00:00Z", deductible_remaining_cents: 50000, oop_remaining_cents: 300000 }, as: AuthCoordinator, as_user_id: "coord-1", captures: { pat_p: $.data.id } }
            - { call: "POST /infusion/authorization-requests", payload: { patient_id: "${pat_p}", policy_id: "${pol_p}", requested_site_type: "OFFICE", requested_dose_mg: 500, patient_weight_kg: 70 }, as: AuthCoordinator, as_user_id: "coord-1", captures: { auth_p: $.data.id } }
            - { call: "POST /infusion/authorization-requests/${auth_p}/benefit-investigations", payload: {}, as: AuthCoordinator, as_user_id: "coord-1", captures: { bi_p: $.data.id } }
            - { call: "POST /infusion/benefit-investigations/${bi_p}/verify", payload: { determined_channel: "MEDICAL" }, as: FinanceSpecialist, as_user_id: "fin-1" }
            - { call: "POST /infusion/authorization-requests/${auth_p}/criteria-submissions", payload: { criterion_code: "DIAG_CONFIRM", response_value: "yes" }, as: AuthCoordinator, as_user_id: "coord-1", captures: { cs_p: $.data.id } }
            - { call: "POST /infusion/criteria-submissions/${cs_p}/reviews", payload: { outcome: "ACCEPTED" }, as: MedicalDirector, as_user_id: "md-1" }
            - { call: "POST /infusion/authorization-requests/${auth_p}/site-of-care-determinations", payload: { home_allowed_cents: 100000, hospital_allowed_cents: 300000, home_billed_cents: 120000, hospital_billed_cents: 360000 }, as: MedicalDirector, as_user_id: "md-1" }
            - { call: "POST /infusion/authorization-requests/${auth_p}/submit", payload: {}, as: AuthCoordinator, as_user_id: "coord-1", captures: { v_p2: $.data.version } }
            - { call: "POST /infusion/authorization-requests/${auth_p}/determinations", payload: { outcome: "DENIED", expected_authorization_version: "${v_p2}", denial_reason: "criteria-not-met" }, as: MedicalDirector, as_user_id: "md-2" }
            - { call: "POST /infusion/authorization-requests/${auth_p}/appeals", payload: { reason: "new-evidence" }, as: AuthCoordinator, as_user_id: "coord-1", captures: { ap_p: $.data.id } }
            - { call: "POST /infusion/appeals/${ap_p}/decisions", payload: { outcome: "UPHELD" }, as: MedicalDirector, as_user_id: "md-1", captures: { ap_st: $.data.status } }
            - { call: "POST /infusion/appeals/${ap_p}/peer-to-peer-reviews", payload: { reviewer_user_id: "md-9", scheduled_start: "2026-08-05T10:00:00Z", scheduled_end: "2026-08-05T10:30:00Z" }, as: MedicalDirector, as_user_id: "md-1", captures: { p2p: $.data.id, rc0: $.data.reschedule_count } }
          trigger:
            - { call: "POST /infusion/peer-to-peer-reviews/${p2p}/reschedules", payload: { scheduled_start: "2026-08-06T10:00:00Z", scheduled_end: "2026-08-06T10:30:00Z" }, as: MedicalDirector, as_user_id: "md-1", captures: { rc1: $.data.reschedule_count, st1: $.data.status } }
            - { call: "POST /infusion/peer-to-peer-reviews/${p2p}/reschedules", payload: { scheduled_start: "2026-08-07T10:00:00Z", scheduled_end: "2026-08-07T10:30:00Z" }, as: MedicalDirector, as_user_id: "md-1", captures: { rc2: $.data.reschedule_count } }
            - { call: "POST /infusion/peer-to-peer-reviews/${p2p}/reschedules", payload: { scheduled_start: "2026-08-08T10:00:00Z", scheduled_end: "2026-08-08T10:30:00Z" }, as: MedicalDirector, as_user_id: "md-1", captures: { err3: $.data.error_id } }
          assert:
            - "First reschedule: status stays SCHEDULED (self-loop), reschedule_count == 1"
            - "Second reschedule: reschedule_count == 2"
            - "Third reschedule rejected: error_id == ERR_P2P_RESCHEDULE_LIMIT (409)"

  - rule_id: transitive_cascade
    instances:
      - name: dose_change_approval_supersede_cascade
        grounds:
          - state_machines.DoseChangeRequest.PENDING_to_APPROVED
          - state_machines.AuthorizationRequest.APPROVED_to_SUPERSEDED
          - state_machines.InfusionAppointment.SCHEDULED_to_CANCELLED
          - state_machines.FinancialClearance.ESTIMATED_to_ON_HOLD
        distinguishing_aspect: |
          Depth-3 cascade: dose-change decision APPROVED (reauth_required) -> AuthorizationRequest
          APPROVED->SUPERSEDED -> its future SCHEDULED appointment -> CANCELLED (chair released), while the
          FinancialClearance was already driven ESTIMATED->ON_HOLD by the dose-change CREATION. Each hop is
          caused by the previous hop, not by the original trigger.
        test_recipe:
          setup:
            - "Approved authorization (dose 500, validity 90, course 60 -> window to 2026-09-30) with a future SCHEDULED appointment (2026-08-20) and an ESTIMATED clearance holding one line item; clock at default 2026-08-01"
          setup_api_calls:
            - { call: "POST /infusion/payer-policies", payload: { payer_code: "PAYERX", drug_code: "J9031", regimen_name: "CascA", benefit_channel: "MEDICAL", validity_days: 90, max_course_days: 60, max_dose_mg: 1000, deductible_cents: 100000, coinsurance_pct: 0.20, oop_max_cents: 500000, prepay_limit_cents: 250000 }, as: PolicyAdmin, as_user_id: "admin-1", captures: { pol_ca: $.data.id } }
            - { call: "POST /infusion/infusion-chairs", payload: { site_type: "OFFICE", label: "CH-1", turnover_buffer_minutes: 15 }, as: PolicyAdmin, as_user_id: "admin-1", captures: { chair_ca: $.data.id } }
            - { call: "POST /infusion/patients", payload: { member_id: "M501", full_name: "Casc Pat", diagnosis_code: "C50", payer_code: "PAYERX", plan_year_end: "2026-12-31T00:00:00Z", deductible_remaining_cents: 50000, oop_remaining_cents: 300000 }, as: AuthCoordinator, as_user_id: "coord-1", captures: { pat_ca: $.data.id } }
            - { call: "POST /infusion/authorization-requests", payload: { patient_id: "${pat_ca}", policy_id: "${pol_ca}", requested_site_type: "OFFICE", requested_dose_mg: 500, patient_weight_kg: 70 }, as: AuthCoordinator, as_user_id: "coord-1", captures: { auth_ca: $.data.id } }
            - { call: "POST /infusion/authorization-requests/${auth_ca}/benefit-investigations", payload: {}, as: AuthCoordinator, as_user_id: "coord-1", captures: { bi_ca: $.data.id } }
            - { call: "POST /infusion/benefit-investigations/${bi_ca}/verify", payload: { determined_channel: "MEDICAL" }, as: FinanceSpecialist, as_user_id: "fin-1" }
            - { call: "POST /infusion/authorization-requests/${auth_ca}/criteria-submissions", payload: { criterion_code: "DIAG_CONFIRM", response_value: "yes" }, as: AuthCoordinator, as_user_id: "coord-1", captures: { cs_ca: $.data.id } }
            - { call: "POST /infusion/criteria-submissions/${cs_ca}/reviews", payload: { outcome: "ACCEPTED" }, as: MedicalDirector, as_user_id: "md-1" }
            - { call: "POST /infusion/authorization-requests/${auth_ca}/site-of-care-determinations", payload: { home_allowed_cents: 100000, hospital_allowed_cents: 300000, home_billed_cents: 120000, hospital_billed_cents: 360000 }, as: MedicalDirector, as_user_id: "md-1" }
            - { call: "POST /infusion/authorization-requests/${auth_ca}/submit", payload: {}, as: AuthCoordinator, as_user_id: "coord-1", captures: { v_ca2: $.data.version } }
            - { call: "POST /infusion/authorization-requests/${auth_ca}/determinations", payload: { outcome: "APPROVED", expected_authorization_version: "${v_ca2}" }, as: MedicalDirector, as_user_id: "md-2", captures: { v_ca3: $.data.version } }
            - { call: "POST /infusion/authorization-requests/${auth_ca}/appointments", payload: { chair_id: "${chair_ca}", scheduled_start: "2026-08-20T10:00:00Z", scheduled_end: "2026-08-20T11:00:00Z" }, as: Scheduler, as_user_id: "sched-1", captures: { appt_ca: $.data.id } }
            - { call: "POST /infusion/authorization-requests/${auth_ca}/financial-clearances", payload: {}, as: FinanceSpecialist, as_user_id: "fin-1", captures: { fc_ca: $.data.id } }
            - { call: "POST /infusion/financial-clearances/${fc_ca}/line-items", payload: { description: "drug", allowed_amount_cents: 100000, billed_charges_cents: 100000 }, as: FinanceSpecialist, as_user_id: "fin-1" }
          trigger:
            - { call: "POST /infusion/authorization-requests/${auth_ca}/dose-change-requests", payload: { new_dose_mg: 600 }, as: AuthCoordinator, as_user_id: "coord-1", captures: { dcr_ca: $.data.id, dcr_reauth: $.data.reauth_required } }
            - { call: "POST /infusion/dose-change-requests/${dcr_ca}/decisions", payload: { outcome: "APPROVED" }, as: MedicalDirector, as_user_id: "md-1" }
          assert:
            - "DoseChangeRequest.${dcr_ca}.reauth_required == true and status == APPROVED"
            - "AuthorizationRequest.${auth_ca}.status == SUPERSEDED and version == ${v_ca3} + 1 (hop 1)"
            - "InfusionAppointment.${appt_ca}.status == CANCELLED (hop 2 caused by hop 1, appointment start 2026-08-20 > clock 2026-08-01)"
            - "FinancialClearance.${fc_ca}.status == ON_HOLD (set at dose-change creation; NOT re-estimated by the approval)"
      - name: p2p_uphold_closes_appeal_and_auth
        grounds:
          - state_machines.PeerToPeerReview.SCHEDULED_to_COMPLETED
          - state_machines.Appeal.LEVEL_1_DECIDED_to_CLOSED_UPHELD
          - state_machines.AuthorizationRequest.DENIED_to_DENIED_CLOSED
        distinguishing_aspect: |
          Depth-3 cascade from a different trigger: peer-to-peer completion (UPHOLD) -> Appeal
          LEVEL_1_DECIDED->CLOSED_UPHELD -> AuthorizationRequest DENIED->DENIED_CLOSED. Distinct origin
          (completions endpoint) and distinct propagation path from the dose-change cascade.
        test_recipe:
          setup:
            - "Denied authorization (version 3 after denial), appeal at LEVEL_1_DECIDED, one SCHEDULED peer-to-peer review for reviewer md-9; clock at default 2026-08-01"
          setup_api_calls:
            - { call: "POST /infusion/payer-policies", payload: { payer_code: "PAYERX", drug_code: "J9032", regimen_name: "CascB", benefit_channel: "MEDICAL", validity_days: 90, max_course_days: 60, max_dose_mg: 1000, deductible_cents: 100000, coinsurance_pct: 0.20, oop_max_cents: 500000, prepay_limit_cents: 250000 }, as: PolicyAdmin, as_user_id: "admin-1", captures: { pol_cb: $.data.id } }
            - { call: "POST /infusion/patients", payload: { member_id: "M502", full_name: "CascB Pat", diagnosis_code: "C50", payer_code: "PAYERX", plan_year_end: "2026-12-31T00:00:00Z", deductible_remaining_cents: 50000, oop_remaining_cents: 300000 }, as: AuthCoordinator, as_user_id: "coord-1", captures: { pat_cb: $.data.id } }
            - { call: "POST /infusion/authorization-requests", payload: { patient_id: "${pat_cb}", policy_id: "${pol_cb}", requested_site_type: "OFFICE", requested_dose_mg: 500, patient_weight_kg: 70 }, as: AuthCoordinator, as_user_id: "coord-1", captures: { auth_cb: $.data.id } }
            - { call: "POST /infusion/authorization-requests/${auth_cb}/benefit-investigations", payload: {}, as: AuthCoordinator, as_user_id: "coord-1", captures: { bi_cb: $.data.id } }
            - { call: "POST /infusion/benefit-investigations/${bi_cb}/verify", payload: { determined_channel: "MEDICAL" }, as: FinanceSpecialist, as_user_id: "fin-1" }
            - { call: "POST /infusion/authorization-requests/${auth_cb}/criteria-submissions", payload: { criterion_code: "DIAG_CONFIRM", response_value: "yes" }, as: AuthCoordinator, as_user_id: "coord-1", captures: { cs_cb: $.data.id } }
            - { call: "POST /infusion/criteria-submissions/${cs_cb}/reviews", payload: { outcome: "ACCEPTED" }, as: MedicalDirector, as_user_id: "md-1" }
            - { call: "POST /infusion/authorization-requests/${auth_cb}/site-of-care-determinations", payload: { home_allowed_cents: 100000, hospital_allowed_cents: 300000, home_billed_cents: 120000, hospital_billed_cents: 360000 }, as: MedicalDirector, as_user_id: "md-1" }
            - { call: "POST /infusion/authorization-requests/${auth_cb}/submit", payload: {}, as: AuthCoordinator, as_user_id: "coord-1", captures: { v_cb2: $.data.version } }
            - { call: "POST /infusion/authorization-requests/${auth_cb}/determinations", payload: { outcome: "DENIED", expected_authorization_version: "${v_cb2}", denial_reason: "criteria-not-met" }, as: MedicalDirector, as_user_id: "md-2", captures: { v_cb3: $.data.version } }
            - { call: "POST /infusion/authorization-requests/${auth_cb}/appeals", payload: { reason: "contest" }, as: AuthCoordinator, as_user_id: "coord-1", captures: { ap_cb: $.data.id } }
            - { call: "POST /infusion/appeals/${ap_cb}/decisions", payload: { outcome: "UPHELD" }, as: MedicalDirector, as_user_id: "md-1" }
            - { call: "POST /infusion/appeals/${ap_cb}/peer-to-peer-reviews", payload: { reviewer_user_id: "md-9", scheduled_start: "2026-08-05T10:00:00Z", scheduled_end: "2026-08-05T10:30:00Z" }, as: MedicalDirector, as_user_id: "md-1", captures: { p2p_cb: $.data.id } }
          trigger:
            - { call: "POST /infusion/peer-to-peer-reviews/${p2p_cb}/completions", payload: { outcome: "UPHOLD" }, as: MedicalDirector, as_user_id: "md-1", captures: { p2p_st: $.data.status } }
          assert:
            - "PeerToPeerReview.${p2p_cb}.status == COMPLETED and outcome == UPHOLD (hop 0)"
            - "Appeal.${ap_cb}.status == CLOSED_UPHELD (hop 1, caused by the completion)"
            - "AuthorizationRequest.${auth_cb}.status == DENIED_CLOSED and version == ${v_cb3} + 1 (hop 2, caused by hop 1)"

  - rule_id: priority_pair_validation_conflict
    instances:
      - name: appointment_create_state_beats_temporal
        grounds:
          - validations[priority=6]
          - validations[priority=15]
          - errors[ERR_AUTH_NOT_APPROVED]
          - errors[ERR_OUTSIDE_VALIDITY_WINDOW]
        distinguishing_aspect: |
          Category pair state vs business_temporal: creating an appointment on a SUPERSEDED request with a
          scheduled_start beyond its old auth_valid_to violates both; the state error
          ERR_AUTH_NOT_APPROVED (priority 6) MUST win over ERR_OUTSIDE_VALIDITY_WINDOW (priority 15).
        test_recipe:
          setup:
            - "Request approved (validity 30 -> auth_valid_to 2026-08-31T00:00:00Z), then SUPERSEDED via an approved reauth-required dose change; an OFFICE chair exists"
          setup_api_calls:
            - { call: "POST /infusion/payer-policies", payload: { payer_code: "PAYERX", drug_code: "J9041", regimen_name: "PrioA", benefit_channel: "MEDICAL", validity_days: 30, max_course_days: 60, max_dose_mg: 1000, deductible_cents: 100000, coinsurance_pct: 0.20, oop_max_cents: 500000, prepay_limit_cents: 250000 }, as: PolicyAdmin, as_user_id: "admin-1", captures: { pol_pa: $.data.id } }
            - { call: "POST /infusion/infusion-chairs", payload: { site_type: "OFFICE", label: "CH-PA" }, as: PolicyAdmin, as_user_id: "admin-1", captures: { chair_pa: $.data.id } }
            - { call: "POST /infusion/patients", payload: { member_id: "M601", full_name: "Prio Pat", diagnosis_code: "C50", payer_code: "PAYERX", plan_year_end: "2026-12-31T00:00:00Z", deductible_remaining_cents: 50000, oop_remaining_cents: 300000 }, as: AuthCoordinator, as_user_id: "coord-1", captures: { pat_pa: $.data.id } }
            - { call: "POST /infusion/authorization-requests", payload: { patient_id: "${pat_pa}", policy_id: "${pol_pa}", requested_site_type: "OFFICE", requested_dose_mg: 500, patient_weight_kg: 70 }, as: AuthCoordinator, as_user_id: "coord-1", captures: { auth_pa: $.data.id } }
            - { call: "POST /infusion/authorization-requests/${auth_pa}/benefit-investigations", payload: {}, as: AuthCoordinator, as_user_id: "coord-1", captures: { bi_pa: $.data.id } }
            - { call: "POST /infusion/benefit-investigations/${bi_pa}/verify", payload: { determined_channel: "MEDICAL" }, as: FinanceSpecialist, as_user_id: "fin-1" }
            - { call: "POST /infusion/authorization-requests/${auth_pa}/criteria-submissions", payload: { criterion_code: "DIAG_CONFIRM", response_value: "yes" }, as: AuthCoordinator, as_user_id: "coord-1", captures: { cs_pa: $.data.id } }
            - { call: "POST /infusion/criteria-submissions/${cs_pa}/reviews", payload: { outcome: "ACCEPTED" }, as: MedicalDirector, as_user_id: "md-1" }
            - { call: "POST /infusion/authorization-requests/${auth_pa}/site-of-care-determinations", payload: { home_allowed_cents: 100000, hospital_allowed_cents: 300000, home_billed_cents: 120000, hospital_billed_cents: 360000 }, as: MedicalDirector, as_user_id: "md-1" }
            - { call: "POST /infusion/authorization-requests/${auth_pa}/submit", payload: {}, as: AuthCoordinator, as_user_id: "coord-1", captures: { v_pa2: $.data.version } }
            - { call: "POST /infusion/authorization-requests/${auth_pa}/determinations", payload: { outcome: "APPROVED", expected_authorization_version: "${v_pa2}" }, as: MedicalDirector, as_user_id: "md-2" }
            - { call: "POST /infusion/authorization-requests/${auth_pa}/dose-change-requests", payload: { new_dose_mg: 600 }, as: AuthCoordinator, as_user_id: "coord-1", captures: { dcr_pa: $.data.id } }
            - { call: "POST /infusion/dose-change-requests/${dcr_pa}/decisions", payload: { outcome: "APPROVED" }, as: MedicalDirector, as_user_id: "md-1" }
          trigger:
            - { call: "POST /infusion/authorization-requests/${auth_pa}/appointments", payload: { chair_id: "${chair_pa}", scheduled_start: "2026-09-15T10:00:00Z", scheduled_end: "2026-09-15T11:00:00Z" }, as: Scheduler, as_user_id: "sched-1", captures: { err_pa: $.data.error_id } }
          assert:
            - "error_id == ERR_AUTH_NOT_APPROVED (state, priority 6) and NOT ERR_OUTSIDE_VALIDITY_WINDOW (temporal, priority 15), although the start 2026-09-15 is also beyond auth_valid_to 2026-08-31"
      - name: appointment_create_temporal_beats_site_constraint
        grounds:
          - validations[priority=15]
