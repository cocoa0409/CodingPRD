      - name: slow_moving_threshold_boundary_is_covered_by_the_difficulty_index
        claim_type: threshold
        excluded_because:
          difficulty_instance: slow_moving_index_exactly_at_threshold_is_flagged
          rationale: "lot_monitor_flag is the scaffold's only threshold algorithm, and the interesting claims are the inclusive comparison at exactly 0.6000 and the one-ten-thousandth below it; §1.8 pins a fixture that lands the rounded index on the threshold and asserts SLOW_MOVING with AVAILABLE -> WATCH, plus the 0.5999 neighbour staying NONE. A §1.9 instance would reuse the same two lots."

      - name: admin_funds_variant_reconciliation_is_covered_by_the_difficulty_index
        claim_type: reconciliation
        excluded_because:
          difficulty_instance: admin_funds_withhold_then_redistribute_single_pass_mode_c
          rationale: "The only reconciliation-on-switch in §1.3 is admin_funds_allocation, where the withheld 10 percent of a non-compliant agency is redistributed to the compliant ones in a single pass and the cycle total must still equal admin_funds_pool_cents to the cent. §1.8 asserts every intermediate field (base, withheld, final) and the conservation identity, so a §1.9 duplicate could only weaken it."

