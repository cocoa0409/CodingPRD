        grounds:
          - validations[priority=13]
          - errors.ERR_COLLECTION_WINDOW_INVALID
          - errors.ERR_INVALID_REQUEST
        distinguishing_aspect: >-
          The availability window must be strictly ordered and the collection must happen inside it:
          window_end_at at or before window_start_at is a schema violation, and collecting after the
          window closes is a temporal violation reporting ERR_COLLECTION_WINDOW_INVALID.
        test_recipe:
          setup:
            - "One FIELD_OPEN edition and one athlete; the clock reads 2026-09-01T00:00:00Z."
          setup_api_calls:
            - call: POST /_clock/set_current_utc
