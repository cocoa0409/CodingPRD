# =============================================================================
# Copyright Licensing Trading Platform — SCAFFOLD_DIFFICULTY_DESIGN.yaml
# Test Targeting Index (§1.8). Sole top-level key: scaffold_difficulty_design.
# Every `grounds` ref points to a declared element of SCAFFOLD.yaml §1.1–§1.6.
# =============================================================================

scaffold_difficulty_design:

  # ---------------------------------------------------------------------------
  # Rule 1 — Dual-variant calculations across different entity domains
  # ---------------------------------------------------------------------------
  - rule_id: dual_variant_calc
    instances:
      - name: royalty_provisional_vs_final
        grounds:
          - calculations.royalty_payable
          - entities.RoyaltyStatement.fields.variant
          - entities.RoyaltyStatement.fields.earned_royalty_cents
          - entities.RoyaltyStatement.fields.net_payable_cents
        distinguishing_aspect: |
          PROVISIONAL ignores minimum_guarantee_cents while FINAL applies max(revenue_share, MG); given identical
          gross_revenue_cents=1000000, revenue_share_bps=1500, minimum_guarantee_cents=200000, advance_cents=50000,
          PROVISIONAL.net_payable_cents=100000 and FINAL.net_payable_cents=150000 — RoyaltyStatement is the entity domain.
        test_recipe:
          setup:
            - "Create RightsHolder licensor=RH_A, RightsHolder licensee=RH_B"
            - "Create Work W with primary_owner_id=RH_A.id, primary_share_bps=10000, ownership_proof_doc_id='doc-1'"
            - "Submit Work W; emit COPYRIGHT_AUTHORITY:REGISTRATION_APPROVED so W.registration_status=REGISTERED"
            - "Create License L on W: revenue_share_bps=1500, minimum_guarantee_cents=200000, advance_cents=50000, settlement_period=MONTHLY, term_start=2026-01-01T00:00:00Z, term_end=2027-01-01T00:00:00Z"
            - "Run negotiation: RH_B accepts; create Contract C with effective_date_target=2026-01-01T00:00:00Z, signing_order=[RH_A.id, RH_B.id]; both sign"
            - "Advance clock to 2026-01-01T00:00:00Z so License.status=EFFECTIVE"
          trigger:
            - "POST /licenses/{L.id}/royalty-statements with variant=PROVISIONAL, period_start_at=2026-01-01, period_end_at=2026-02-01, gross_revenue_cents=1000000 → S_prov"
            - "POST /licenses/{L.id}/royalty-statements with variant=FINAL, period_start_at=2026-02-01, period_end_at=2026-03-01, gross_revenue_cents=1000000 → S_final"
          assert:
            - "S_prov.net_payable_cents == 100000"
            - "S_final.net_payable_cents == 150000"
            - "S_prov.earned_royalty_cents == 150000"
            - "S_final.earned_royalty_cents == 200000"

      - name: rights_conflict_exclusive_vs_nonexclusive_check
        grounds:
          - calculations.rights_conflict_check
          - entities.License.fields.exclusivity
          - entities.License.fields.territory
          - entities.License.fields.media_types
          - errors[ERR_EXCLUSIVE_LICENSE_VIOLATION]
        distinguishing_aspect: |
          Two valid interpretations of "overlap" on the License entity domain produce different outcomes for identical
          territory/media/term geometry: the EXCLUSIVE-vs-EXCLUSIVE branch raises ERR_EXCLUSIVE_LICENSE_VIOLATION while the
          NON_EXCLUSIVE-vs-NON_EXCLUSIVE branch logs RIGHTS_CONFLICT_DETECTED to AuditLog and accepts. Same inputs, two
          algorithm variants, different observable results — License is a different entity domain from RoyaltyStatement.
        test_recipe:
          setup:
            - "Register Work W (RH_A primary, REGISTERED)"
            - "Create RH_B and RH_C as licensees"
            - "Create License L1 on W: licensee=RH_B, territory=['US'], media_types=['DIGITAL'], term=[2026-01-01, 2027-01-01), exclusivity=EXCLUSIVE; accept; sign; clock-advance so EFFECTIVE"
            - "Create License L2 on W: licensee=RH_C, territory=['US'], media_types=['DIGITAL'], term=[2026-06-01, 2026-12-01), exclusivity=EXCLUSIVE"
            - "Create License L3 on W: licensee=RH_C, same overlap geometry as L2 but exclusivity=NON_EXCLUSIVE; assume L1 had been created NON_EXCLUSIVE for this branch (use a sibling Work W' or pre-mutate L1 in second test pass)"
          trigger:
            - "POST /licenses/{L2.id}/rounds action=ACCEPT (caller=RH_C) → expect 409 ERR_EXCLUSIVE_LICENSE_VIOLATION"
            - "On parallel Work W' with NON_EXCLUSIVE incumbent, POST /licenses/{L3'.id}/rounds action=ACCEPT → expect 201 and AuditLog row with change_type=RIGHTS_CONFLICT_DETECTED"
          assert:
            - "L2 status remains OFFERED/COUNTERED after rejected ACCEPT and response.error_id == 'ERR_EXCLUSIVE_LICENSE_VIOLATION'"
            - "L3' status == ACCEPTED and exists AuditLog where subject_id == L3'.id AND change_type == 'RIGHTS_CONFLICT_DETECTED'"

  # ---------------------------------------------------------------------------
  # Rule 2 — Combinatorial formulas across different modes
  # ---------------------------------------------------------------------------
  - rule_id: combinatorial_formula
    instances:
      - name: royalty_payable_three_input_nonlinear_mode_a
        grounds:
          - calculations.royalty_payable
          - entities.License.fields.revenue_share_bps
          - entities.License.fields.minimum_guarantee_cents
          - entities.License.fields.advance_cents
          - entities.License.fields.cumulative_advance_recouped_cents
        distinguishing_aspect: |
          Mode (a) — formula combines >=3 inputs (gross_revenue_cents, revenue_share_bps, minimum_guarantee_cents,
          advance_cents, cumulative_advance_recouped_cents) with non-linear interaction via nested max/min and a tiered
          MG floor. Different from the rounding-order instance (mode b) below.
        test_recipe:
          setup:
            - "Create License L with revenue_share_bps=1500, minimum_guarantee_cents=200000, advance_cents=50000, cumulative_advance_recouped_cents=0; status=EFFECTIVE per setup chain in Rule 1 instance 1"
          trigger:
            - "POST /licenses/{L.id}/royalty-statements variant=FINAL, gross_revenue_cents=1000000 → S1"
            - "Settle S1 via PAYMENT_RECEIVED with amount_cents=150000"
            - "POST /licenses/{L.id}/royalty-statements variant=FINAL, gross_revenue_cents=1000000 → S2 (now cumulative_advance_recouped_cents=50000, remaining_advance=0)"
          assert:
            - "S1.net_payable_cents == 150000"
            - "S2.advance_recouped_cents == 0"
            - "S2.net_payable_cents == 200000"
            - "License.cumulative_advance_recouped_cents == 50000 after S1 SETTLED"

      - name: royalty_rounding_order_pinned_mode_b
        grounds:
          - calculations.royalty_payable
          - calculations.royalty_payable.constants.ROUNDING_ORDER
        distinguishing_aspect: |
          Mode (b) — rounding order is explicitly pinned: revenue_share = floor(gross * bps / 10000) BEFORE max with MG
          BEFORE subtracting recoupment. The reverse order (subtract-then-round, or round-after-max) on
          gross_revenue_cents=333, revenue_share_bps=3333 would yield revenue_share=110.99889 → 111 cents under
          round-half-up of an unrounded ratio, vs the pinned order's floor=110 cents. Distinct from the mode (a)
          instance which is multi-input non-linear, not rounding-order-sensitive.
        test_recipe:
          setup:
            - "Create License L with revenue_share_bps=3333, minimum_guarantee_cents=0, advance_cents=0; status=EFFECTIVE"
          trigger:
            - "POST /licenses/{L.id}/royalty-statements variant=FINAL, gross_revenue_cents=333 → S"
          assert:
            - "S.earned_royalty_cents == 110"
            - "S.advance_recouped_cents == 0"
            - "S.net_payable_cents == 110"

  # ---------------------------------------------------------------------------
  # Rule 3 — Non-linear state-machine shape on different entities
  # ---------------------------------------------------------------------------
  - rule_id: non_linear_state_machine
    instances:
      - name: license_negotiation_cycle
        grounds:
          - state_machines.License
          - state_machines.License.OFFERED_to_COUNTERED
          - state_machines.License.COUNTERED_to_COUNTERED
          - state_machines.License.COUNTERED_to_ACCEPTED
        distinguishing_aspect: |
          License has a self-loop on COUNTERED (counter-offer rounds may repeat indefinitely until ACCEPT or WITHDRAW),
          producing a true cyclic shape. State graph is non-linear because COUNTERED→COUNTERED revisits the same node.
        test_recipe:
          setup:
            - "Setup Work W as in Rule 1 instance 1; create License L (status=OFFERED, current_round=1, proposed_by=RH_A)"
          trigger:
            - "POST /licenses/{L.id}/rounds action=COUNTER caller=RH_B (round 2)"
            - "POST /licenses/{L.id}/rounds action=COUNTER caller=RH_A (round 3)"
            - "POST /licenses/{L.id}/rounds action=COUNTER caller=RH_B (round 4)"
          assert:
            - "L.status == 'COUNTERED'"
            - "L.current_round == 4"
            - "GET /licenses/{L.id}/rounds returns 4 NegotiationRound rows with action sequence ['OFFER','COUNTER','COUNTER','COUNTER']"

      - name: contract_branching_supersede_or_terminate
        grounds:
          - state_machines.Contract
          - state_machines.Contract.EFFECTIVE_to_TERMINATED
          - state_machines.Contract.EFFECTIVE_to_SUPERSEDED
          - entities.Contract.fields.parent_contract_id
        distinguishing_aspect: |
          Contract from EFFECTIVE branches to two distinct terminal-ish states: TERMINATED (via License termination
          cascade) and SUPERSEDED (via supplementary contract reaching FULLY_SIGNED). Side-effect sets diverge per
          branch — TERMINATED appends LICENSE_TERMINATED RightsChainEvent, SUPERSEDED only appends AuditLog. Different
          entity from License's cyclic shape above.
        test_recipe:
          setup:
            - "Setup License L1 + primary Contract C1 with both signers signed; advance clock so License is EFFECTIVE and Contract C1 is EFFECTIVE"
          trigger:
            - "Branch A: POST /licenses/{L1.id}/terminate → C1.status should become TERMINATED"
            - "Branch B (separate seed pair L2/C2 in same setup): POST /contracts with license_id=L2.id, parent_contract_id=C2.id → C2supp; sign C2supp; expect C2 transitions to SUPERSEDED"
          assert:
            - "After Branch A: C1.status == 'TERMINATED' and exists RightsChainEvent for L1 with event_type=='LICENSE_TERMINATED'"
            - "After Branch B: C2.status == 'SUPERSEDED' and exists AuditLog with change_type=='CONTRACT_AMENDED' and after.status=='SUPERSEDED'"

  # ---------------------------------------------------------------------------
  # Rule 4 — Transitive cascade chains from different triggers
  # ---------------------------------------------------------------------------
  - rule_id: transitive_cascade
    instances:
      - name: takedown_cascade_depth_three
        grounds:
          - calculations.takedown_termination_cascade
          - state_machines.InfringementCase.RESPONSE_RECEIVED_to_UNDER_ARBITRATION
          - state_machines.License.EFFECTIVE_to_TERMINATED
          - state_machines.Contract.EFFECTIVE_to_TERMINATED
        distinguishing_aspect: |
          Depth-3 chain originating from POST /infringement-cases/{caseId}/escalate:
          (1) InfringementCase: RESPONSE_RECEIVED→UNDER_ARBITRATION causes
          (2) License: EFFECTIVE→TERMINATED, which itself causes
          (3) Contract: EFFECTIVE→TERMINATED.
          Each link is caused by the previous link, not by the original action. Trigger differs from instance below
          (which originates at signature submission).
        test_recipe:
          setup:
            - "Register Work W (owner=RH_A); create RH_B as alleged infringer/licensee"
            - "Create License L: licensee=RH_B; accept; create Contract C (signing_order=[RH_A,RH_B]); both sign; clock-advance to make L EFFECTIVE and C EFFECTIVE"
            - "Create InfringementCase IC: work=W, alleged_infringer=RH_B, evidence_doc_ids=['ev-1']"
            - "POST /infringement-cases/{IC.id}/verify-ownership (PlatformAdmin)"
            - "POST /infringement-cases/{IC.id}/respond (caller=RH_B, response_text='deny')"
          trigger:
            - "POST /infringement-cases/{IC.id}/escalate (caller=RH_A)"
          assert:
            - "IC.review_stage == 'UNDER_ARBITRATION'"
            - "IC.takedown_issued_at is not null"
            - "L.status == 'TERMINATED'"
            - "C.status == 'TERMINATED'"
            - "Exists RightsChainEvent for W with event_type=='LICENSE_TERMINATED' AND payload.reason=='TAKEDOWN'"

      - name: signature_completion_cascade_depth_two
        grounds:
          - calculations.signing_progress
          - state_machines.Contract.PENDING_SIGNATURES_to_FULLY_SIGNED
          - state_machines.License.ACCEPTED_to_SIGNED
        distinguishing_aspect: |
          Depth-2 chain from a different trigger (POST /contracts/{contractId}/signatures): the final signature causes
          (1) Contract: PENDING_SIGNATURES→FULLY_SIGNED, which itself causes
          (2) License: ACCEPTED→SIGNED.
          Originates from signature, not infringement escalation, and stops at depth 2 (License.SIGNED does not auto-flip
          further until the clock advances).
        test_recipe:
          setup:
            - "Register Work W (owner=RH_A); create RH_B"
            - "Create License L: licensee=RH_B; RH_B accepts → L.status=ACCEPTED, L.pinned_work_version=W.version"
            - "Create Contract C with signing_order=[RH_A.id, RH_B.id], effective_date_target=2026-01-01"
            - "POST /contracts/{C.id}/signatures signer=RH_A → C.signed_count=1, C.status=PENDING_SIGNATURES"
          trigger:
            - "POST /contracts/{C.id}/signatures signer=RH_B"
          assert:
            - "C.status == 'FULLY_SIGNED'"
            - "C.fully_signed_at is not null"
            - "L.status == 'SIGNED'"
            - "Exists RightsChainEvent for W with event_type=='LICENSE_SIGNED' AND ref_id==L.id"

  # ---------------------------------------------------------------------------
  # Rule 5 — Validation priority conflicts across different error-category pairs
  # ---------------------------------------------------------------------------
  - rule_id: priority_pair_validation_conflict
    instances:
      - name: state_vs_business_referential_on_license_termination
        grounds:
          - validations[priority=5]
          - validations[priority=6]
          - errors[ERR_INVALID_STATE]
          - errors[ERR_FORBIDDEN]
          - state_machines.License.EFFECTIVE_to_TERMINATED
        distinguishing_aspect: |
          When a non-licensor caller (RH_B) attempts to terminate a License that is still in OFFERED state, two checks
          fail simultaneously: state precondition (priority 5, category=state) and business_referential ownership check
          (priority 6, category=business_referential). Priority 5 wins → ERR_INVALID_STATE. Pair: state vs
          business_referential.
        test_recipe:
          setup:
            - "Register Work W (owner=RH_A); create RH_B (not licensor)"
            - "Create License L on W: licensor=RH_A, licensee=RH_B; status=OFFERED"
          trigger:
            - "POST /licenses/{L.id}/terminate as caller=RH_B with version=L.version"
          assert:
            - "Response status == 409"
            - "Response error_id == 'ERR_INVALID_STATE'"

      - name: business_safety_vs_business_temporal_on_license_accept
        grounds:
          - validations[priority=7]
          - validations[priority=8]
          - errors[ERR_EXCLUSIVE_LICENSE_VIOLATION]
          - errors[ERR_TERRITORY_TERM_OVERLAP]
          - calculations.rights_conflict_check
        distinguishing_aspect: |
          When acceptance triggers BOTH an exclusive-license violation (priority 7, category=business_safety) AND a
          territory/term overlap with an EXCLUSIVE incumbent (priority 8, category=business_temporal), priority 7 wins
          → ERR_EXCLUSIVE_LICENSE_VIOLATION. Different category pair from the previous instance.
        test_recipe:
          setup:
            - "Register Work W (owner=RH_A); create RH_B, RH_C"
            - "Create License L1: licensee=RH_B, territory=['US','CA'], media_types=['DIGITAL'], term=[2026-01-01,2027-01-01), exclusivity=EXCLUSIVE; accept; sign; clock-advance to EFFECTIVE"
            - "Create License L2: licensee=RH_C, territory=['CA'], media_types=['DIGITAL'], term=[2026-06-01,2026-12-01), exclusivity=EXCLUSIVE"
          trigger:
            - "POST /licenses/{L2.id}/rounds action=ACCEPT, caller=RH_C"
          assert:
            - "Response status == 409"
            - "Response error_id == 'ERR_EXCLUSIVE_LICENSE_VIOLATION'"

  # ---------------------------------------------------------------------------
  # Rule 6 — Boundary-precision checks on different metrics/endpoints
  # ---------------------------------------------------------------------------
  - rule_id: boundary_precision_check
    instances:
      - name: clock_advance_exact_effective_date
        grounds:
          - calculations.contract_effective_date
          - calculations.contract_effective_date.constants.BOUNDARY
          - state_machines.License.SIGNED_to_EFFECTIVE
          - endpoints[POST /_clock/advance]
        distinguishing_aspect: |
          Boundary check on a datetime metric: now() >= effective_date_target (inclusive). At exact equality the
          transition fires; one second prior, it does not. Reachable through POST /_clock/advance — distinct endpoint
          from instance below.
        test_recipe:
          setup:
            - "Setup License L (term_start=2026-01-01T00:00:00Z, term_end=2027-01-01T00:00:00Z) with Contract C effective_date_target=2026-03-01T00:00:00Z; both parties signed → L.status=SIGNED, C.status=FULLY_SIGNED"
          trigger:
            - "POST /_clock/advance to=2026-02-28T23:59:59Z (one second before)"
            - "POST /_clock/advance to=2026-03-01T00:00:00Z (exact)"
          assert:
            - "After first advance: L.status == 'SIGNED' (transition has NOT fired)"
            - "After second advance: L.status == 'EFFECTIVE'"
            - "After second advance: L.effective_date == '2026-03-01T00:00:00.000Z'"

      - name: empty_evidence_array_rejection
        grounds:
          - validations[priority=21]
          - errors[ERR_EVIDENCE_MISSING]
          - entities.InfringementCase.fields.evidence_doc_ids
          - endpoints[POST /infringement-cases]
        distinguishing_aspect: |
          Boundary check on a different metric (collection cardinality, not datetime): evidence_doc_ids of length 0 is
          rejected; length 1 is accepted. Reachable through POST /infringement-cases — a different endpoint from the
          clock-advance boundary.
        test_recipe:
          setup:
            - "Register Work W (owner=RH_A); create RH_B"
          trigger:
            - "POST /infringement-cases body={work_id:W.id, alleged_infringer_id:RH_B.id, evidence_doc_ids:[]}"
            - "POST /infringement-cases body={work_id:W.id, alleged_infringer_id:RH_B.id, evidence_doc_ids:['ev-1']}"
          assert:
            - "First call → 422 with error_id == 'ERR_EVIDENCE_MISSING'"
            - "Second call → 201 with InfringementCase.review_stage == 'REPORTED'"

  # ---------------------------------------------------------------------------
  # Rule 7 — Cross-entity state dependencies across different entity pairs
  # ---------------------------------------------------------------------------
  - rule_id: cross_entity_state_dependency
    instances:
      - name: license_accept_requires_work_registered
        grounds:
          - state_machines.License.OFFERED_to_ACCEPTED
          - state_machines.License.COUNTERED_to_ACCEPTED
          - errors[ERR_WORK_NOT_REGISTERED]
          - entities.Work.fields.registration_status
        distinguishing_aspect: |
          License's ACCEPTED transition requires Work.registration_status == REGISTERED. Entity pair: License → Work.
        test_recipe:
          setup:
            - "Create RightsHolder RH_A and RH_B; Create Work W with primary_owner=RH_A, registration_status=DRAFT (not yet submitted)"
            - "Create License L: licensor=RH_A, licensee=RH_B, work_id=W.id, status=OFFERED"
          trigger:
            - "POST /licenses/{L.id}/rounds action=ACCEPT, caller=RH_B"
          assert:
            - "Response status == 409"
            - "Response error_id == 'ERR_WORK_NOT_REGISTERED'"

      - name: contract_create_requires_license_accepted
        grounds:
          - state_machines.Contract.PENDING_SIGNATURES_to_PENDING_SIGNATURES
          - errors[ERR_LICENSE_NOT_ACCEPTED]
          - entities.License.fields.status
          - endpoints[POST /contracts]
        distinguishing_aspect: |
          Contract creation (and first-signature precondition) requires License.status == ACCEPTED. Entity pair:
          Contract → License. Different from License → Work above.
        test_recipe:
          setup:
            - "Register Work W (owner=RH_A); create RH_B"
            - "Create License L; status remains OFFERED (RH_B has not accepted)"
          trigger:
            - "POST /contracts body={license_id:L.id, signing_order:[RH_A.id, RH_B.id], effective_date_target:2026-03-01T00:00:00Z}"
          assert:
            - "Response status == 409"
            - "Response error_id == 'ERR_LICENSE_NOT_ACCEPTED'"

  # ---------------------------------------------------------------------------
  # Rule 8 — Resource temporal-overlap conflicts across different interval semantics
  # ---------------------------------------------------------------------------
  - rule_id: resource_temporal_overlap
    instances:
      - name: license_term_half_open_overlap_check
        grounds:
          - calculations.rights_conflict_check
          - calculations.rights_conflict_check.constants.INTERVAL_SEMANTICS
          - entities.License.fields.term_start
          - entities.License.fields.term_end
        distinguishing_aspect: |
          License term is half-open [term_start, term_end). Adjacency does NOT count as overlap: License A
          [2026-01-01, 2026-06-01) and License B [2026-06-01, 2026-12-01) are NON-overlapping; whereas
          [2026-01-01, 2026-06-02) and [2026-06-01, 2026-12-01) overlap by 1 day. Resource entity: License.
        test_recipe:
          setup:
            - "Register Work W (owner=RH_A); create RH_B, RH_C"
            - "Create License L1: licensee=RH_B, territory=['US'], media_types=['DIGITAL'], term=[2026-01-01,2026-06-01), exclusivity=EXCLUSIVE; accept; sign; clock-advance to EFFECTIVE"
            - "Create License L2: licensee=RH_C, territory=['US'], media_types=['DIGITAL'], term=[2026-06-01,2026-12-01), exclusivity=EXCLUSIVE"
            - "Create License L3: licensee=RH_C, territory=['US'], media_types=['DIGITAL'], term=[2026-05-31T23:59:59Z,2026-12-01), exclusivity=EXCLUSIVE"
          trigger:
            - "POST /licenses/{L2.id}/rounds action=ACCEPT, caller=RH_C → expect 201 (adjacency, no overlap)"
            - "POST /licenses/{L3.id}/rounds action=ACCEPT, caller=RH_C → expect 409"
          assert:
            - "L2.status == 'ACCEPTED' after first call"
            - "Second call response.error_id == 'ERR_EXCLUSIVE_LICENSE_VIOLATION'"

      - name: royalty_period_alignment_to_settlement_period
        grounds:
          - validations[priority=16]
          - errors[ERR_INVALID_PERIOD]
          - entities.RoyaltyStatement.fields.period_start_at
          - entities.RoyaltyStatement.fields.period_end_at
          - entities.License.fields.settlement_period
        distinguishing_aspect: |
          Different interval semantics: RoyaltyStatement period must EXACTLY align with License.settlement_period
          duration (calendar-month for MONTHLY). This is a duration-equality check, not a half-open overlap check —
          a different interval-arithmetic rule on a different resource entity (RoyaltyStatement vs License).
        test_recipe:
          setup:
            - "Setup License L with settlement_period=MONTHLY, status=EFFECTIVE per Rule 1 instance 1"
          trigger:
            - "POST /licenses/{L.id}/royalty-statements with variant=FINAL, period_start_at=2026-01-01T00:00:00Z, period_end_at=2026-01-15T00:00:00Z, gross_revenue_cents=100000 (15-day window, NOT monthly)"
            - "POST /licenses/{L.id}/royalty-statements with variant=FINAL, period_start_at=2026-01-01T00:00:00Z, period_end_at=2026-02-01T00:00:00Z, gross_revenue_cents=100000 (proper monthly)"
          assert:
            - "First call → 422 with error_id == 'ERR_INVALID_PERIOD'"
            - "Second call → 201 with RoyaltyStatement.status == 'DRAFT'"

  # ---------------------------------------------------------------------------
  # Rule 9 — Compensating-action invariants across different conserved quantities
  # ---------------------------------------------------------------------------
  - rule_id: compensating_invariant
    instances:
      - name: advance_recoupment_invariant_under_reversal
        grounds:
          - calculations.advance_recoupment_invariant
          - state_machines.RoyaltyStatement.SETTLED_to_REVERSED
          - entities.License.fields.cumulative_advance_recouped_cents
          - entities.RoyaltyStatement.fields.advance_recouped_cents
        distinguishing_aspect: |
          Conserved quantity: License.cumulative_advance_recouped_cents. After SETTLE(S) followed by REVERSE(S) via a
          paired reversal entry R, the invariant states cumulative_advance_recouped_cents must equal the value it had
          BEFORE S was settled. Spelled as: License.cumulative_advance_recouped_cents == sum(SETTLED non-reversed
          advance_recouped_cents). The pair of forward action (settle) + compensating action (reverse) leaves the
          named monetary quantity unchanged.
        test_recipe:
          setup:
            - "Setup License L from Rule 1 instance 1 with advance_cents=50000, cumulative_advance_recouped_cents=0; status=EFFECTIVE"
            - "POST /licenses/{L.id}/royalty-statements variant=FINAL gross_revenue_cents=1000000 → S (net_payable_cents=150000, advance_recouped_cents=50000)"
            - "POST /_events/emit PAYMENT_RECEIVED ref_id=S.id payload={amount_cents:150000} → S.status=SETTLED"
            - "Snapshot L.cumulative_advance_recouped_cents == 50000"
          trigger:
            - "POST /licenses/{L.id}/royalty-statements variant=FINAL, reversal_of_id=S.id, refund_cents=150000, gross_revenue_cents=0 → R (reversal entry)"
            - "POST /_events/emit PAYMENT_REFUNDED ref_id=R.id payload={amount_cents:150000}"
          assert:
            - "S.status == 'REVERSED'"
            - "L.cumulative_advance_recouped_cents == 0"
            - "Identity holds: L.cumulative_advance_recouped_cents == sum(stmt.advance_recouped_cents for SETTLED non-reversed stmts on L) == 0"

      - name: ownership_share_total_invariant_under_patch
        grounds:
          - calculations.ownership_share_validation
          - calculations.ownership_share_validation.constants.TOTAL_BPS
          - entities.Work.fields.primary_share_bps
          - entities.Work.fields.co_owners
          - validations[priority=13]
          - errors[ERR_OWNERSHIP_SHARES_INVALID]
        distinguishing_aspect: |
          Different conserved quantity: ownership share basis points on Work. The invariant
          primary_share_bps + sum(co_owners.share_bps) == 10000 must hold across every PATCH. The forward action (PATCH
          increasing co_owner share) paired with the compensating action (matching decrease in primary_share_bps in
          the same request) leaves the named quantity (TOTAL_BPS=10000) unchanged. A PATCH that only increases without
          compensating must be rejected.
        test_recipe:
          setup:
            - "Create RightsHolder RH_A, RH_B; create Work W with primary_owner=RH_A, primary_share_bps=10000, co_owners=[]"
          trigger:
            - "PATCH /works/{W.id} body={primary_share_bps:10000, co_owners:[{rights_holder_id:RH_B.id, share_bps:1000}]} (uncompensated — total = 11000)"
            - "PATCH /works/{W.id} body={primary_share_bps:9000, co_owners:[{rights_holder_id:RH_B.id, share_bps:1000}]} (compensated — total = 10000)"
          assert:
            - "First PATCH → 422 with error_id == 'ERR_OWNERSHIP_SHARES_INVALID'"
            - "Second PATCH → 200 with W.primary_share_bps==9000 and W.co_owners[0].share_bps==1000"
            - "After second PATCH: W.primary_share_bps + sum(W.co_owners[i].share_bps) == 10000"
