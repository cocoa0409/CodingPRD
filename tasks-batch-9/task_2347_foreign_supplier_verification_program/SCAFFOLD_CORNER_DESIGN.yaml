# =============================================================================
# task_2347 — Foreign Supplier Verification Program
# §1.9 Scaffold Corner Design (Coverage Index for Non-Difficulty Tests)
#
# Breadth probe over the nine sections of references/claim-extraction-guide.md.
# Every numeric literal in `assert:` was computed by executing the §1.3 formulas
# with their declared constants; every chain was replayed call-by-call against
# §1.2 / §1.4 / §1.6 from an empty database.
#
# Shared fixture skeleton (rebuilt from empty DB inside every recipe):
#   clock 2026-09-01T00:00:00Z; importer "Northbrook Foods Import LLC"
#   (dnb 123456789 / UFI UFI-NB-0001, small_importer_flag false,
#   record_retention_months 24); QI Ada Ruiz (training 2025-06-01, valid until
#   2028-06-01) and QI Ben Osei (training 2025-07-01), both DESIGNATED;
#   supplier "Rio Verde SA" (NO_ADVERSE_FINDINGS → APPROVED);
#   food "Frozen mango chunks" (GENERAL, non-RAC, ready_to_eat true);
#   pair P1; hazard analysis HA1 with the single control hazard
#   Listeria (severity 4 × probability 3 × rte 1.15 = 13.80, requires_control).
#   => pair risk_tier LOW, composite_hazard_risk 13.80,
#      required_annual_frequency 1, required_coverage 20.70.
#   Activity A1 SAMPLING_AND_TESTING frequency 3, window
#   [2026-10-01, 2026-10-15), coverage_weight 18.00 => adequacy_planned 86.96.
# =============================================================================

scaffold_corner_design:

  # ===========================================================================
  # 1. From Table 1 (Entities)
  # ===========================================================================
  - section: entities
    instances:
      - name: importer_creation_returns_program_rollup_fields_at_version_one
        claim_type: creation
        grounds:
          - entities.Importer
          - endpoints["POST /fsvp/importers"]
          - calculations.importer_program_status
          - response_envelope.success
        distinguishing_aspect: "A brand-new importer is NON_COMPLIANT, not COMPLIANT: importer_program_status fails the qualified_individual_designated clause before any pair exists, and every roll-up counter starts at 0 with version 1."
        test_recipe:
          setup:
            - "Empty database with the logical clock pinned to 2026-09-01T00:00:00Z."
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-09-01T00:00:00Z" }
              as: PlatformAdmin
          trigger:
            - call: "POST /fsvp/importers"
              payload: { legal_name: "Northbrook Foods Import LLC", dnb_number: "123456789", unique_facility_identifier: "UFI-NB-0001" }
              as: ComplianceOfficer
              captures: { imp: $.data.id }
          assert:
            - "HTTP 201"
            - "response_type == object"
            - "Importer.${imp}.legal_name == Northbrook Foods Import LLC"
            - "Importer.${imp}.dnb_number == 123456789"
            - "Importer.${imp}.unique_facility_identifier == UFI-NB-0001"
            - "Importer.${imp}.blocked_pair_count == 0"
            - "Importer.${imp}.open_corrective_action_count == 0"
            - "Importer.${imp}.qualified_individual_designated == false"
            - "Importer.${imp}.program_status == NON_COMPLIANT"
            - "Importer.${imp}.version == 1"

      - name: supplier_food_pair_retrieval_returns_three_status_dimensions_and_risk_fields
        claim_type: retrieval
        grounds:
          - entities.SupplierFoodPair
          - endpoints["GET /fsvp/supplier-food-pairs/{id}"]
          - calculations.pair_composite_hazard_risk
        distinguishing_aspect: "One GET must expose all three independent status dimensions plus the STEP 2–5 outputs of pair_composite_hazard_risk simultaneously: HAZARD_ANALYZED / PENDING / NONE with composite 13.80, tier LOW, frequency 1 and required_coverage 20.70."
        setup_note: "Uses the shared fixture skeleton through hazard-analysis approval."
        test_recipe:
          setup:
            - "Shared fixture through HA1 approval; no verification activity exists yet."
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-09-01T00:00:00Z" }
              as: PlatformAdmin
            - call: "POST /fsvp/importers"
              payload: { legal_name: "Northbrook Foods Import LLC", dnb_number: "123456789", unique_facility_identifier: "UFI-NB-0001" }
              as: ComplianceOfficer
              captures: { imp: $.data.id }
            - call: "POST /fsvp/qualified-individuals"
              payload: { importer_id: "${imp}", full_name: "Ada Ruiz", email: "ada@northbrook.example", qualification_summary: "PCQI and FSVP training plus eight years of supplier audit experience", training_completed_at: "2025-06-01T00:00:00Z" }
              as: ComplianceOfficer
              captures: { qi_a: $.data.id }
            - call: "POST /fsvp/qualified-individuals/${qi_a}/designation"
              payload: { action: "DESIGNATE" }
              as: ComplianceOfficer
            - call: "POST /fsvp/foreign-suppliers"
              payload: { importer_id: "${imp}", name: "Rio Verde SA", country_code: "PE", facility_registration_number: "FRN-PE-77001", regulatory_compliance_status: "NO_ADVERSE_FINDINGS" }
              as: ComplianceOfficer
              captures: { sup: $.data.id }
            - call: "POST /fsvp/foreign-suppliers/${sup}/evaluation"
              payload: { decision: "APPROVE", performance_basis_note: "No adverse FDA findings and two acceptable prior audits on file" }
              as: QualifiedIndividual
              as_user_id: "${qi_a}"
            - call: "POST /fsvp/foods"
              payload: { importer_id: "${imp}", food_name: "Frozen mango chunks", fda_product_code: "20-MAN-01", is_raw_agricultural_commodity: false, intended_consumer_group: "GENERAL", ready_to_eat: true }
              as: ComplianceOfficer
              captures: { food1: $.data.id }
            - call: "POST /fsvp/supplier-food-pairs"
              payload: { importer_id: "${imp}", supplier_id: "${sup}", food_id: "${food1}", designated_qi_id: "${qi_a}" }
              as: ComplianceOfficer
              captures: { pair1: $.data.id, pair1_v: $.data.version }
            - call: "POST /fsvp/hazard-analyses"
              payload: { pair_id: "${pair1}", expected_pair_version: "${pair1_v}", methodology_note: "Codex hazard identification for frozen ready-to-eat fruit" }
              as: QualifiedIndividual
              as_user_id: "${qi_a}"
              captures: { ha1: $.data.id }
            - call: "POST /fsvp/hazard-analyses/${ha1}/hazards"
              payload: { hazard_type: "BIOLOGICAL", hazard_name: "Listeria monocytogenes", severity: 4, probability: 3, control_owner: "FOREIGN_SUPPLIER" }
              as: QualifiedIndividual
              as_user_id: "${qi_a}"
            - call: "POST /fsvp/hazard-analyses/${ha1}/approval"
              payload: { approval_note: "Hazard analysis complete for this supplier and food combination" }
              as: QualifiedIndividual
              as_user_id: "${qi_a}"
          trigger:
            - call: "GET /fsvp/supplier-food-pairs/${pair1}"
              payload: {}
              as: ComplianceOfficer
          assert:
            - "HTTP 200"
            - "SupplierFoodPair.${pair1}.verification_status == HAZARD_ANALYZED"
            - "SupplierFoodPair.${pair1}.entry_eligibility_status == PENDING"
            - "SupplierFoodPair.${pair1}.exemption_status == NONE"
            - "SupplierFoodPair.${pair1}.active_hazard_analysis_id == ${ha1}"
            - "SupplierFoodPair.${pair1}.hazard_analysis_count == 1"
            - "SupplierFoodPair.${pair1}.composite_hazard_risk == 13.80"
            - "SupplierFoodPair.${pair1}.risk_tier == LOW"
            - "SupplierFoodPair.${pair1}.required_annual_frequency == 1"
            - "SupplierFoodPair.${pair1}.required_coverage == 20.70"
            - "SupplierFoodPair.${pair1}.uncontrolled_significant_hazard_count == 1"
            - "SupplierFoodPair.${pair1}.adequacy_score_planned == 0.00"
            - "SupplierFoodPair.${pair1}.adequacy_score_realized == 0.00"
            - "SupplierFoodPair.${pair1}.last_reassessed_at == null"
            - "SupplierFoodPair.${pair1}.reassessment_due_at == null"

      - name: importer_foods_listing_paginates_with_total_count_and_has_more
        claim_type: listing
        grounds:
          - endpoints["GET /fsvp/importers/{id}/foods"]
          - response_envelope.pagination_fields
          - response_envelope.pagination_defaults
        distinguishing_aspect: "limit=2 over three foods must return exactly 2 rows with total_count 3 and has_more true — total_count counts the whole filtered set, not the returned page."
        test_recipe:
          setup:
            - "One importer with exactly three Food rows."
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-09-01T00:00:00Z" }
              as: PlatformAdmin
            - call: "POST /fsvp/importers"
              payload: { legal_name: "Northbrook Foods Import LLC", dnb_number: "123456789", unique_facility_identifier: "UFI-NB-0001" }
              as: ComplianceOfficer
              captures: { imp: $.data.id }
            - call: "POST /fsvp/foods"
              payload: { importer_id: "${imp}", food_name: "Frozen mango chunks", fda_product_code: "20-MAN-01", is_raw_agricultural_commodity: false, intended_consumer_group: "GENERAL", ready_to_eat: true }
              as: ComplianceOfficer
            - call: "POST /fsvp/foods"
              payload: { importer_id: "${imp}", food_name: "Pasteurized mango juice", fda_product_code: "20-JUI-02", is_raw_agricultural_commodity: false, intended_consumer_group: "GENERAL", process_control_category: "JUICE_HACCP", ready_to_eat: true }
              as: ComplianceOfficer
            - call: "POST /fsvp/foods"
              payload: { importer_id: "${imp}", food_name: "Fresh green beans", fda_product_code: "20-BEA-03", is_raw_agricultural_commodity: true, intended_consumer_group: "GENERAL" }
              as: ComplianceOfficer
          trigger:
            - call: "GET /fsvp/importers/${imp}/foods"
              payload: { limit: 2, offset: 0 }
              as: FdaInspector
          assert:
            - "HTTP 200"
            - "response_type == array"
            - "total_count == 3"
            - "has_more == true"
            - "len(data) == 2"

      - name: get_supplier_food_pair_with_unknown_id_returns_pair_not_found
        claim_type: not_found
        grounds:
          - validations[priority=8]
          - errors[ERR_PAIR_NOT_FOUND]
          - endpoints["GET /fsvp/supplier-food-pairs/{id}"]
        distinguishing_aspect: "A syntactically valid UUID that resolves to no SupplierFoodPair yields ERR_PAIR_NOT_FOUND (404), never an empty 200 body."
        test_recipe:
          setup:
            - "One importer exists; no supplier-food pair has ever been created."
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-09-01T00:00:00Z" }
              as: PlatformAdmin
            - call: "POST /fsvp/importers"
              payload: { legal_name: "Northbrook Foods Import LLC", dnb_number: "123456789", unique_facility_identifier: "UFI-NB-0001" }
              as: ComplianceOfficer
              captures: { imp: $.data.id }
          trigger:
            - call: "GET /fsvp/supplier-food-pairs/00000000-0000-4000-8000-0000000000ff"
              payload: {}
              as: ComplianceOfficer
              captures: { err: $.data.error_id }
          assert:
            - "HTTP 404"
            - "error_id == ERR_PAIR_NOT_FOUND"

      - name: importer_create_without_dnb_number_returns_invalid_request
        claim_type: required_fields
        grounds:
          - validations[priority=3]
          - errors[ERR_INVALID_REQUEST]
          - entities.Importer.fields.dnb_number
        distinguishing_aspect: "dnb_number carries `source: input` with no default, so omitting it is a shape violation caught at priority 3 (400) before any uniqueness check at priority 15 can run."
        test_recipe:
          setup:
            - "Empty database with the clock pinned."
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-09-01T00:00:00Z" }
              as: PlatformAdmin
          trigger:
            - call: "POST /fsvp/importers"
              payload: { legal_name: "Northbrook Foods Import LLC", unique_facility_identifier: "UFI-NB-0001" }
              as: ComplianceOfficer
              captures: { err: $.data.error_id }
          assert:
            - "HTTP 400"
            - "error_id == ERR_INVALID_REQUEST"
            - "no Importer row was persisted"

      - name: omitted_optional_inputs_take_their_declared_defaults
        claim_type: defaults
        grounds:
          - entities.Importer.fields.small_importer_flag
          - entities.Importer.fields.record_retention_months
          - entities.Food.fields.process_control_category
          - entities.Food.fields.ready_to_eat
          - entities.QualifiedIndividual.fields.concurrent_activity_capacity
        distinguishing_aspect: "Four separate defaults must materialize from three creates with the optional keys absent: small_importer_flag false, record_retention_months 24, Food.process_control_category NONE with ready_to_eat false, and QI concurrent_activity_capacity 2."
        test_recipe:
          setup:
            - "Clock pinned; importer created WITHOUT small_importer_flag and record_retention_months."
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-09-01T00:00:00Z" }
              as: PlatformAdmin
            - call: "POST /fsvp/importers"
              payload: { legal_name: "Northbrook Foods Import LLC", dnb_number: "123456789", unique_facility_identifier: "UFI-NB-0001" }
              as: ComplianceOfficer
              captures: { imp: $.data.id }
          trigger:
            - call: "POST /fsvp/foods"
              payload: { importer_id: "${imp}", food_name: "Frozen mango chunks", fda_product_code: "20-MAN-01", is_raw_agricultural_commodity: false, intended_consumer_group: "GENERAL" }
              as: ComplianceOfficer
              captures: { food1: $.data.id }
            - call: "POST /fsvp/qualified-individuals"
              payload: { importer_id: "${imp}", full_name: "Ada Ruiz", email: "ada@northbrook.example", qualification_summary: "PCQI and FSVP training plus eight years of supplier audit experience", training_completed_at: "2025-06-01T00:00:00Z" }
              as: ComplianceOfficer
              captures: { qi_a: $.data.id }
          assert:
            - "Importer.${imp}.small_importer_flag == false"
            - "Importer.${imp}.record_retention_months == 24"
            - "Food.${food1}.process_control_category == NONE"
            - "Food.${food1}.ready_to_eat == false"
            - "QualifiedIndividual.${qi_a}.concurrent_activity_capacity == 2"
            - "QualifiedIndividual.${qi_a}.status == PROPOSED"

      - name: qi_training_valid_until_computed_thirty_six_months_after_training
        claim_type: computed_fields
        grounds:
          - entities.QualifiedIndividual.fields.training_valid_until
          - calculations.record_retention_and_availability.constants.reassessment_cycle_months
          - endpoints["POST /fsvp/qualified-individuals"]
        distinguishing_aspect: "training_valid_until is derived (training_completed_at + 36 calendar months = 2028-06-01), never echoed from the request, and the row still starts in PROPOSED so the derived field alone does not designate anyone."
        test_recipe:
          setup:
            - "Importer registered; clock 2026-09-01T00:00:00Z."
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-09-01T00:00:00Z" }
              as: PlatformAdmin
            - call: "POST /fsvp/importers"
              payload: { legal_name: "Northbrook Foods Import LLC", dnb_number: "123456789", unique_facility_identifier: "UFI-NB-0001" }
              as: ComplianceOfficer
              captures: { imp: $.data.id }
          trigger:
            - call: "POST /fsvp/qualified-individuals"
              payload: { importer_id: "${imp}", full_name: "Ada Ruiz", email: "ada@northbrook.example", qualification_summary: "PCQI and FSVP training plus eight years of supplier audit experience", training_completed_at: "2025-06-01T00:00:00Z" }
              as: ComplianceOfficer
              captures: { qi_a: $.data.id }
          assert:
            - "HTTP 201"
            - "QualifiedIndividual.${qi_a}.training_valid_until == 2028-06-01T00:00:00.000Z"
            - "QualifiedIndividual.${qi_a}.status == PROPOSED"
            - "QualifiedIndividual.${qi_a}.active_assignment_count == 0"
            - "Importer.${imp}.qualified_individual_designated == false"
            - "Importer.${imp}.program_status == NON_COMPLIANT"

      - name: pair_system_fields_minted_by_server_on_create
        claim_type: system_fields
        grounds:
          - entities.SupplierFoodPair.fields.verification_status
          - entities.SupplierFoodPair.fields.entry_eligibility_status
          - entities.SupplierFoodPair.fields.exemption_status
          - endpoints["POST /fsvp/supplier-food-pairs"]
        distinguishing_aspect: "The three status dimensions are `source: system` and the id/created_at/updated_at/version quartet is server-minted: the create body carries only the four FKs, yet the response is fully populated with DRAFT/PENDING/NONE at version 1 and an un-prefixed UUID id."
        test_recipe:
          setup:
            - "Importer, designated QI Ada, APPROVED supplier and one food exist."
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-09-01T00:00:00Z" }
              as: PlatformAdmin
            - call: "POST /fsvp/importers"
              payload: { legal_name: "Northbrook Foods Import LLC", dnb_number: "123456789", unique_facility_identifier: "UFI-NB-0001" }
              as: ComplianceOfficer
              captures: { imp: $.data.id }
            - call: "POST /fsvp/qualified-individuals"
              payload: { importer_id: "${imp}", full_name: "Ada Ruiz", email: "ada@northbrook.example", qualification_summary: "PCQI and FSVP training plus eight years of supplier audit experience", training_completed_at: "2025-06-01T00:00:00Z" }
              as: ComplianceOfficer
              captures: { qi_a: $.data.id }
            - call: "POST /fsvp/qualified-individuals/${qi_a}/designation"
              payload: { action: "DESIGNATE" }
              as: ComplianceOfficer
            - call: "POST /fsvp/foreign-suppliers"
              payload: { importer_id: "${imp}", name: "Rio Verde SA", country_code: "PE", facility_registration_number: "FRN-PE-77001", regulatory_compliance_status: "NO_ADVERSE_FINDINGS" }
              as: ComplianceOfficer
              captures: { sup: $.data.id }
            - call: "POST /fsvp/foreign-suppliers/${sup}/evaluation"
              payload: { decision: "APPROVE", performance_basis_note: "No adverse FDA findings and two acceptable prior audits on file" }
              as: QualifiedIndividual
              as_user_id: "${qi_a}"
            - call: "POST /fsvp/foods"
              payload: { importer_id: "${imp}", food_name: "Frozen mango chunks", fda_product_code: "20-MAN-01", is_raw_agricultural_commodity: false, intended_consumer_group: "GENERAL", ready_to_eat: true }
              as: ComplianceOfficer
              captures: { food1: $.data.id }
          trigger:
            - call: "POST /fsvp/supplier-food-pairs"
              payload: { importer_id: "${imp}", supplier_id: "${sup}", food_id: "${food1}", designated_qi_id: "${qi_a}" }
              as: ComplianceOfficer
              captures: { pair1: $.data.id }
          assert:
            - "HTTP 201"
            - "SupplierFoodPair.${pair1}.id is a bare UUID with no type prefix"
            - "SupplierFoodPair.${pair1}.version == 1"
            - "SupplierFoodPair.${pair1}.created_at == 2026-09-01T00:00:00.000Z"
            - "SupplierFoodPair.${pair1}.updated_at == 2026-09-01T00:00:00.000Z"
            - "SupplierFoodPair.${pair1}.verification_status == DRAFT"
            - "SupplierFoodPair.${pair1}.entry_eligibility_status == PENDING"
            - "SupplierFoodPair.${pair1}.exemption_status == NONE"
            - "SupplierFoodPair.${pair1}.exemption_type == null"
            - "SupplierFoodPair.${pair1}.modified_requirements_only == false"

      - name: hazard_create_with_severity_above_five_returns_invalid_request
        claim_type: type_constraints
        grounds:
          - entities.Hazard.fields.severity
          - validations[priority=3]
          - errors[ERR_INVALID_REQUEST]
        distinguishing_aspect: "severity is declared `1..5`, so severity 6 is rejected at priority 3 with 400 and no Hazard row is created — the risk_score formula is never reached, so no clamped 25.00 row appears."
        test_recipe:
          setup:
            - "Shared fixture through DRAFT hazard analysis HA1 with zero hazards."
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-09-01T00:00:00Z" }
              as: PlatformAdmin
            - call: "POST /fsvp/importers"
              payload: { legal_name: "Northbrook Foods Import LLC", dnb_number: "123456789", unique_facility_identifier: "UFI-NB-0001" }
              as: ComplianceOfficer
              captures: { imp: $.data.id }
            - call: "POST /fsvp/qualified-individuals"
              payload: { importer_id: "${imp}", full_name: "Ada Ruiz", email: "ada@northbrook.example", qualification_summary: "PCQI and FSVP training plus eight years of supplier audit experience", training_completed_at: "2025-06-01T00:00:00Z" }
              as: ComplianceOfficer
              captures: { qi_a: $.data.id }
            - call: "POST /fsvp/qualified-individuals/${qi_a}/designation"
              payload: { action: "DESIGNATE" }
              as: ComplianceOfficer
            - call: "POST /fsvp/foreign-suppliers"
              payload: { importer_id: "${imp}", name: "Rio Verde SA", country_code: "PE", facility_registration_number: "FRN-PE-77001", regulatory_compliance_status: "NO_ADVERSE_FINDINGS" }
              as: ComplianceOfficer
              captures: { sup: $.data.id }
            - call: "POST /fsvp/foreign-suppliers/${sup}/evaluation"
              payload: { decision: "APPROVE", performance_basis_note: "No adverse FDA findings and two acceptable prior audits on file" }
              as: QualifiedIndividual
              as_user_id: "${qi_a}"
            - call: "POST /fsvp/foods"
              payload: { importer_id: "${imp}", food_name: "Frozen mango chunks", fda_product_code: "20-MAN-01", is_raw_agricultural_commodity: false, intended_consumer_group: "GENERAL", ready_to_eat: true }
              as: ComplianceOfficer
              captures: { food1: $.data.id }
            - call: "POST /fsvp/supplier-food-pairs"
              payload: { importer_id: "${imp}", supplier_id: "${sup}", food_id: "${food1}", designated_qi_id: "${qi_a}" }
              as: ComplianceOfficer
              captures: { pair1: $.data.id, pair1_v: $.data.version }
            - call: "POST /fsvp/hazard-analyses"
              payload: { pair_id: "${pair1}", expected_pair_version: "${pair1_v}", methodology_note: "Codex hazard identification for frozen ready-to-eat fruit" }
              as: QualifiedIndividual
              as_user_id: "${qi_a}"
              captures: { ha1: $.data.id }
          trigger:
            - call: "POST /fsvp/hazard-analyses/${ha1}/hazards"
              payload: { hazard_type: "BIOLOGICAL", hazard_name: "Listeria monocytogenes", severity: 6, probability: 3, control_owner: "FOREIGN_SUPPLIER" }
              as: QualifiedIndividual
              as_user_id: "${qi_a}"
              captures: { err: $.data.error_id }
          assert:
            - "HTTP 400"
            - "error_id == ERR_INVALID_REQUEST"
            - "HazardAnalysis.${ha1}.hazard_count == 0"
            - "HazardAnalysis.${ha1}.risk_total == 0.00"

      - name: food_row_is_immutable_with_no_version_field
        claim_type: immutability
        grounds:
          - entities.Food
          - endpoints["POST /fsvp/foods"]
          - endpoints["GET /fsvp/importers/{id}/foods"]
        distinguishing_aspect: "Food is declared `common_fields: false`, so the row exposes only id and created_at — no version, no updated_at — and §1.5 declares no PATCH/PUT/DELETE for it, which is why hazard scoring can safely read food attributes without an OCC guard."
        test_recipe:
          setup:
            - "Importer with one Food row."
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-09-01T00:00:00Z" }
              as: PlatformAdmin
            - call: "POST /fsvp/importers"
              payload: { legal_name: "Northbrook Foods Import LLC", dnb_number: "123456789", unique_facility_identifier: "UFI-NB-0001" }
              as: ComplianceOfficer
              captures: { imp: $.data.id }
            - call: "POST /fsvp/foods"
              payload: { importer_id: "${imp}", food_name: "Frozen mango chunks", fda_product_code: "20-MAN-01", is_raw_agricultural_commodity: false, intended_consumer_group: "GENERAL", ready_to_eat: true }
              as: ComplianceOfficer
              captures: { food1: $.data.id }
          trigger:
            - call: "GET /fsvp/importers/${imp}/foods"
              payload: {}
              as: ComplianceOfficer
          assert:
            - "HTTP 200"
            - "total_count == 1"
