          - state_machines.PeerReviewCase.IN_REVIEW_to_REVIEWS_COMPLETE
          - state_machines.PeerReviewCase.REVIEWS_COMPLETE_to_CLOSED
          - calculations.peer_review_surcharge_pct
          - entities.PeerReviewCase.fields.surcharge_pct_assigned
        distinguishing_aspect: |
          Fork-join shape: a committee vote attempted before either branch runs is refused with
          ERR_PEER_REVIEW_STATE_INVALID, the first review track lands the case in IN_REVIEW with
          only its own outcome set, the second joins the fork into REVIEWS_COMPLETE, and only then
          does the vote close the case and restack the insured's surcharge onto the DRAFT term.
