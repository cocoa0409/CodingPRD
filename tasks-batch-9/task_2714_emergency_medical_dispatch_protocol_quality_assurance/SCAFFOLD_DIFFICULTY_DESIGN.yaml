              as_user_id: "dir-1"
            - call: "POST /dispatchers"
              payload: { program_id: "${prog_id}", employee_code: "EMD-A01", full_name: "Jonah Prine" }
              as: ProgramAdmin
              as_user_id: "admin-1"
              captures: { d1_id: $.data.id }
            - call: "POST /dispatchers"
              payload: { program_id: "${prog_id}", employee_code: "EMD-A02", full_name: "Kira Stamos" }
              as: ProgramAdmin
              as_user_id: "admin-1"
              captures: { d2_id: $.data.id }
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-08-20T00:00:00Z" }
              as: ProgramAdmin
              as_user_id: "admin-1"
            - call: "POST /dispatchers/${d1_id}/certify"
