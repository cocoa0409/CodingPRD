            - { call: "POST /production-lots", as: SystemAdmin, payload: { product_id: "${pr1}", production_line_id: "${ln1}", batch_code: "A1B-2026-0710", code_date: "2026-07-10T00:00:00Z", units_produced: 200000 }, captures: { lot1: "$.data.id" } }
            - { call: "POST /response-templates", as: CareSupervisor, as_user_id: "${sup1}", payload: { template_code: "T-ILL-S3", title: "Mild illness reply", body: "Sorry to hear this.", applies_to_type: ILLNESS, max_band_allowed: S3 }, captures: { t3: "$.data.id" } }
