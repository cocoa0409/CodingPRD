              as: Anonymous
              captures: { s_id: $.data.id }
            - call: "POST /accounts"
              payload: { email: "b14@x.com", display_name: "B14", roles: ["BUYER"] }
              as: Anonymous
              captures: { b_id: $.data.id }
            - call: "POST /_clock/set"
              payload: { to_iso8601: "2026-06-01T00:00:00Z" }
              as: PlatformAdmin
