            - "page two returns 2 rows with total_count 5 and has_more true; ${p2_0} == ${q3} and ${p2_1} == ${q4}"
            - "page three returns 1 row with total_count 5 and has_more false; ${p3_0} == ${q5} — has_more is (offset + returned_rows) < total_count, so 4 + 1 == 5 closes the walk"
            - "${pre_mut_0} == ${q3} and ${pre_mut_1} == ${q4} — with all five QUOTED, the filtered window matches the unfiltered one"
            - "${q2_state} == DECLINED"
            - "${post_mut_0} == ${q4} and ${post_mut_1} == ${q5}, and the response reports total_count 4 with has_more false — the same offset now yields different rows because the filtered population shrank under the client; offset windows are positional, not stable"
            - "the QUOTED read returns 4 rows with total_count 4; ${quoted_0} == ${q1} and ${quoted_3} == ${q5} — the declined quote is gone from this population but the ordering of the survivors is unchanged"
            - "the DECLINED read returns 1 row with total_count 1 and ${declined_0} == ${q2} — the row was reclassified, not deleted"
            - "the is_lead=false read returns 4 rows with total_count 4, ${follower_0} == ${q2} and ${follower_3} == ${q5} — filters are independent, so a declined quote still matches a filter that says nothing about status"
            - "the reinsurer_id + is_lead=true read returns 1 row with total_count 1 and ${lead_0} == ${q1} — two filters compose conjunctively"
            - "the market_submission_id + status read returns 1 row with total_count 1 and ${ms_c_0} == ${q3} — the narrowest scope still reports its own total_count"
            - "both empty reads (status=LAPSED, and Bravo with is_lead=true) return HTTP 200 with response_type == \"array\", data == [], total_count 0 and has_more false — an empty filtered population is not a 404 (${empty_probe} and ${empty_probe2} are only there to prove the envelope was well formed)"
            - "${e_limit0} == ERR_VALIDATION, ${e_limit101} == ERR_VALIDATION and ${e_offset} == ERR_VALIDATION, all HTTP 400 — the bounds are limit in [1, 100] and offset >= 0, and the limit ceiling is 100, not 200"
            - "the limit=100 read returns all 5 rows with ${max_page_0} == ${q1}, ${max_page_4} == ${q5}, total_count 5 and has_more false — the maximum limit is inclusive"
            - "the offset=99 read returns HTTP 200 with data == [], total_count 5 and has_more false — an offset past the end is empty, not an error, and total_count still describes the whole filtered population (${far_probe} proves the envelope)"

      - name: excluded_cascading_side_effects_chain_ordering_and_partial_failure
        claim_type: cascading_side_effects
        excluded_because:
          difficulty_instance: firm_order_cascades_line_to_layer_to_program_to_rival_quote_lapse
          rationale: |
            The whole cross-cutting row — an N-level chain end to end, the ordering sensitivity
            between the hops, and the partial-failure case where the chain must not half-run — is
            asserted twice in §1.8 already: rule 8 instance 1 walks SigningLine -> Layer ->
            Program -> rival Quote/MarketSubmission from a single firm order and pins that a
            refused firm order leaves all four levels untouched, and
            collection_cascades_erosion_to_reinstatement_premium_to_cedent_exposure walks the
            claims-side chain Collection -> ClaimAdvocacy -> reinstatement premium -> Cedent
            exposure. Repeating either here would duplicate the assertions rather than probe a
            new corner.

      - name: excluded_dual_variant_calculations_and_the_delta_on_switching
        claim_type: dual_variant_calculation
        excluded_because:
          difficulty_instance: signdown_pro_rata_versus_lead_protected_on_signing_line_percentages
          rationale: |
            Both variant-bearing calculations are already probed in §1.8 with identical inputs run
            through both branches and a pinned per-line delta: rule 1 drives
            signing_down_allocation through PRO_RATA and LEAD_PROTECTED on the same four written
            lines, and ceding_commission_provisional_flat_versus_final_sliding_on_layer_money
            drives ceding_commission_settlement through PROVISIONAL_FLAT and FINAL_SLIDING on the
            same layer money, including the pivot loss ratio and both clamps. The third
            variant-bearing calculation, reinsurer_aggregate_capacity, is covered by
            buffered_capacity_window_counts_a_line_from_a_program_incepting_exactly_on_the_boundary.
            A §1.9 instance here would restate those deltas.

  - section: consistency_model
    instances:
      - name: every_cascade_is_visible_in_the_response_that_caused_it
        claim_type: immediate
        grounds:
          - complexity_profile.consistency_model immediate
          - calculations.submission_completeness_score
          - calculations.layer_technical_premium
          - calculations.brokerage_and_net_remittance
          - calculations.fiduciary_holding
        distinguishing_aspect: |
          The declared consistency model is immediate, which is a much stronger statement than "the
          data eventually agrees": every derived field and every cascaded status must already be
          correct in the body of the very response that caused the change, and the first read
          afterwards must return byte-identical values with no second write, no polling and no
          convergence step. This corner walks a whole placement asserting both halves at each hop —
          the write's own response body, then an immediate re-read — including the awkward hops where
          the cascade lands on an entity that is *not* the response's output entity (a firm order
          returns a SigningLine while moving the Layer and the Program, and a settlement returns a
          FiduciaryTransaction while moving the Program's balance). Those are exactly the hops an
          implementation defers to the next request.
        test_recipe:
          setup:
            - "One cedent, one reinsurer, one program driven to IN_MARKET with a single CATASTROPHE layer and one lead quote for the whole layer."
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { current_utc: "2026-01-01T00:00:00.000Z" }
              as: PlatformAdmin
              as_user_id: "admin-1"
            - call: "POST /cedents"
              payload: { name: "Immediate Mutual", domicile_code: "USNYC", financial_rating: "A" }
              as: PlatformAdmin
              as_user_id: "admin-1"
              captures: { ced_id: $.data.id }
            - call: "POST /reinsurers"
              payload: { name: "Alpha Re", security_rating: "AA", capacity_limit_minor: 5000000000, max_line_pct: 100.0000, lead_authorised: true }
              as: PlatformAdmin
              as_user_id: "admin-1"
              captures: { alpha: $.data.id }
            - call: "POST /programs"
              payload: { cedent_id: "${ced_id}", program_name: "Immediate Property CAT 2026", line_of_business: "PROPERTY", underwriting_year: 2026, inception_date: "2026-01-01T00:00:00.000Z", expiry_date: "2027-01-01T00:00:00.000Z", estimated_premium_income_minor: 2000000000, brokerage_pct: 2.5000 }
              as: BrokerPlacementLead
              as_user_id: "lead-1"
              captures: { prog_id: $.data.id }
          trigger:
            - call: "POST /programs/${prog_id}/exposure-submissions"
              payload: { package_label: "IM-EDP-1", exposure_records_count: 1000, data_quality_flags_count: 20, historical_years_supplied: 5, cat_model_version: "RMS-23.1", loss_history_completeness_pct: 90.0000, actuarial_report_attached: true }
              as: CedentUnderwriter
              as_user_id: "${ced_id}"
              captures: { sub_id: $.data.id, score_in_write: $.data.completeness_score }
            - call: "GET /exposure-submissions/${sub_id}"
              payload: {}
              as: BrokerPlacementLead
              as_user_id: "lead-1"
              captures: { score_in_read: $.data.completeness_score }
            - call: "POST /exposure-submissions/${sub_id}/submit-for-review"
              payload: {}
              as: BrokerPlacementLead
              as_user_id: "lead-1"
            - call: "POST /exposure-submissions/${sub_id}/signoff"
              payload: { decision: "SIGNED_OFF" }
              as: BrokerActuary
              as_user_id: "act-1"
              captures: { sub_state_in_write: $.data.status }
            - call: "GET /programs/${prog_id}"
              payload: {}
              as: BrokerPlacementLead
              as_user_id: "lead-1"
              captures: { prog_state_after_signoff: $.data.placement_status }
            - call: "POST /programs/${prog_id}/layers"
              payload: { layer_label: "IM CAT 1B xs 2B", layer_type: "CATASTROPHE", attachment_minor: 2000000000, limit_minor: 1000000000, base_rate_pct: 8.0000, subject_premium_base_minor: 1250000000, expected_loss_cost_minor: 60000000, reinstatements_total: 1, reinstatement_premium_pct: 100.0000, sublimit_minor: 0 }
              as: BrokerPlacementLead
              as_user_id: "lead-1"
              captures: { layer_id: $.data.id, prem_in_write: $.data.quoted_gross_premium_minor }
            - call: "GET /layers/${layer_id}"
              payload: {}
              as: BrokerPlacementLead
              as_user_id: "lead-1"
              captures: { prem_in_read: $.data.quoted_gross_premium_minor }
            - call: "POST /programs/${prog_id}/go-to-market"
              payload: {}
              as: BrokerPlacementLead
              as_user_id: "lead-1"
              captures: { prog_state_in_write: $.data.placement_status }
            - call: "POST /layers/${layer_id}/market-submissions"
              payload: { reinsurer_id: "${alpha}", response_deadline: "2026-02-01T00:00:00.000Z" }
              as: BrokerPlacementLead
              as_user_id: "lead-1"
              captures: { ms_a: $.data.id }
            - call: "GET /layers/${layer_id}"
              payload: {}
              as: BrokerPlacementLead
              as_user_id: "lead-1"
              captures: { layer_state_after_ms: $.data.status, lv_read: $.data.version }
            - call: "POST /market-submissions/${ms_a}/quotes"
              payload: { offered_line_pct: 100.0000, quoted_rate_pct: 8.0000, ceding_commission_pct: 0.0000, reinstatements_offered: 1, sublimit_minor: 0, expires_at: "2026-03-01T00:00:00.000Z", is_lead: true }
              as: ReinsurerUnderwriter
              as_user_id: "${alpha}"
              captures: { q_a: $.data.id }
            - call: "POST /programs/${prog_id}/brokerage-disclosures"
              payload: { brokerage_pct: 2.5000, contingent_commission_pct: 0.0000, market_service_fee_minor: 0 }
              as: BrokerAccountant
              as_user_id: "acct-1"
              captures: { disc_id: $.data.id }
            - call: "POST /brokerage-disclosures/${disc_id}/disclose"
              payload: {}
              as: BrokerAccountant
              as_user_id: "acct-1"
            - call: "POST /brokerage-disclosures/${disc_id}/decision"
              payload: { decision: "ACKNOWLEDGE", decision_note: "Understood" }
              as: CedentUnderwriter
              as_user_id: "${ced_id}"
              captures: { disc_state_in_write: $.data.status }
            - call: "GET /programs/${prog_id}"
              payload: {}
              as: BrokerPlacementLead
              as_user_id: "lead-1"
              captures: { ack_flag: $.data.disclosure_acknowledged }
            - call: "POST /quotes/${q_a}/firm-order"
              payload: { accepted_line_pct: 100.0000, expected_layer_version: "${lv_read}" }
              as: BrokerPlacementLead
              as_user_id: "lead-1"
              captures: { sl_a: $.data.id, sl_written_in_write: $.data.written_line_pct, sl_capacity_in_write: $.data.committed_capacity_minor }
            - call: "GET /layers/${layer_id}"
              payload: {}
              as: BrokerPlacementLead
              as_user_id: "lead-1"
              captures: { layer_state_after_fo: $.data.status, written_after_fo: $.data.written_line_total_pct }
            - call: "GET /programs/${prog_id}"
              payload: {}
              as: BrokerPlacementLead
              as_user_id: "lead-1"
              captures: { prog_state_after_fo: $.data.placement_status }
            - call: "GET /reinsurers/${alpha}"
              payload: {}
              as: BrokerPlacementLead
              as_user_id: "lead-1"
              captures: { alpha_committed_after_fo: $.data.committed_capacity_minor }
            - call: "POST /programs/${prog_id}/bind"
              payload: {}
              as: BrokerPlacementLead
              as_user_id: "lead-1"
              captures: { bind_state_in_write: $.data.placement_status, gwp_in_write: $.data.gross_written_premium_minor, brok_in_write: $.data.brokerage_earned_minor, net_in_write: $.data.net_remittance_minor, residue_in_write: $.data.rounding_residue_minor }
            - call: "GET /programs/${prog_id}"
              payload: {}
              as: BrokerPlacementLead
              as_user_id: "lead-1"
              captures: { gwp_in_read: $.data.gross_written_premium_minor, brok_in_read: $.data.brokerage_earned_minor, net_in_read: $.data.net_remittance_minor, residue_in_read: $.data.rounding_residue_minor }
            - call: "GET /layers/${layer_id}"
              payload: {}
              as: BrokerPlacementLead
              as_user_id: "lead-1"
              captures: { layer_state_after_bind: $.data.status }
            - call: "GET /signing-lines/${sl_a}"
              payload: {}
              as: BrokerPlacementLead
              as_user_id: "lead-1"
              captures: { sl_state_after_bind: $.data.status, sl_signed_after_bind: $.data.signed_line_pct }
            - call: "POST /programs/${prog_id}/contract-documents"
              payload: { document_type: "SLIP", wording_reference: "IM-SLIP-1" }
              as: BrokerPlacementLead
              as_user_id: "lead-1"
              captures: { doc_in_write: $.data.document_type }
            - call: "GET /programs/${prog_id}"
              payload: {}
              as: BrokerPlacementLead
              as_user_id: "lead-1"
              captures: { doc_status_after_slip: $.data.documentation_status, placement_after_slip: $.data.placement_status, pv_read: $.data.version }
            - call: "POST /programs/${prog_id}/fiduciary-transactions"
              payload: { txn_type: "CEDENT_RECEIPT", amount_minor: 97125000, expected_program_version: "${pv_read}" }
              as: BrokerAccountant
              as_user_id: "acct-1"
              captures: { rx_id: $.data.id, rx_state_in_write: $.data.status }
            - call: "GET /programs/${prog_id}"
              payload: {}
              as: BrokerAccountant
              as_user_id: "acct-1"
              captures: { hold_after_booking: $.data.fiduciary_holding_minor }
            - call: "POST /fiduciary-transactions/${rx_id}/approve"
              payload: {}
              as: ComplianceOfficer
              as_user_id: "compl-1"
            - call: "POST /fiduciary-transactions/${rx_id}/settle"
              payload: {}
              as: BrokerAccountant
              as_user_id: "acct-1"
              captures: { rx_state_in_write2: $.data.status }
            - call: "GET /programs/${prog_id}"
              payload: {}
              as: BrokerAccountant
              as_user_id: "acct-1"
              captures: { hold_after_settle: $.data.fiduciary_holding_minor }
            - call: "GET /cedents/${ced_id}"
              payload: {}
              as: BrokerAccountant
              as_user_id: "acct-1"
              captures: { ced_receipts: $.data.settled_receipts_minor }
          assert:
            - "${score_in_write} == 96.70 and ${score_in_read} == 96.70 — the weighted score is already in the create response, not filled in by a later read"
            - "${sub_state_in_write} == SIGNED_OFF and ${prog_state_after_signoff} == SUBMISSION_READY — the bubble-up onto the parent Program is visible on the very next read, with no second write in between"
            - "${prem_in_write} == 97125000 and ${prem_in_read} == 97125000 — the technical premium is derived inside the create, not on first read"
            - "${prog_state_in_write} == IN_MARKET and ${layer_state_after_ms} == IN_MARKET — the action's own response carries the new status, and the child's cascade is already applied"
            - "${disc_state_in_write} == ACKNOWLEDGED and ${ack_flag} == true — the acknowledgement flips a flag on a different entity, and that flag is already true on the immediately following read"
            - "${sl_written_in_write} == 100.0000 and ${sl_capacity_in_write} == 1000000000 — the firm order's response returns the SigningLine with its capacity already computed"
            - "${layer_state_after_fo} == FULLY_PLACED with ${written_after_fo} == 100.0000, ${prog_state_after_fo} == FIRM_ORDER and ${alpha_committed_after_fo} == 1000000000 — all three entities the firm order cascaded onto are correct on the first read, even though none of them was the response's output entity"
            - "${bind_state_in_write} == BOUND, ${gwp_in_write} == 97125000, ${brok_in_write} == 2428125, ${net_in_write} == 94696875 and ${residue_in_write} == 0 — the bind response already carries all four money fields"
            - "${gwp_in_read} == ${gwp_in_write}, ${brok_in_read} == ${brok_in_write}, ${net_in_read} == ${net_in_write} and ${residue_in_read} == ${residue_in_write} — the re-read is byte-identical; nothing converges after the fact"
            - "${layer_state_after_bind} == BOUND, ${sl_state_after_bind} == BOUND and ${sl_signed_after_bind} == 100.0000 — the bind's grandchild effects are immediate too"
            - "${doc_in_write} == SLIP, ${doc_status_after_slip} == SLIP_ISSUED and ${placement_after_slip} == BOUND — the documentation dimension advances immediately while the placement dimension is untouched"
            - "${rx_state_in_write} == PENDING and ${hold_after_booking} == 0 — immediate consistency is not eagerness: the booking is immediately visible as PENDING, and the balance is immediately visible as still zero because no money has moved"
            - "${rx_state_in_write2} == SETTLED, ${hold_after_settle} == 97125000 and ${ced_receipts} == 97125000 — the settlement's effects on the Program projection and on the Cedent's roll-up are both readable at once, in the same request cycle"
