              as: VenueOpsManager
              as_user_id: "vom-1"
            - call: "POST /venues/${venue_id}/permit-decisions"
              payload: { decision: "ISSUED", note: "occupancy 180 granted" }
              as: SafetyOfficer
              as_user_id: "officer-1"
            - call: "POST /build-kits"
              payload: { kit_code: "KIT-P9B-001", module_count: 20, initial_condition_score: 100.00, localization_language: "en-US" }
              as: VenueOpsManager
              as_user_id: "vom-1"
              captures: { kit_a: $.data.id }
            - call: "POST /build-kits"
