# =============================================================================
# Table 1.8: Difficulty Design — Programming Carriage & Affiliate Agreement
# Administration
#
# Every instance below is a falsifiable test recipe. All numeric assertions are
# pre-computed literals derived from the constants pinned in SCAFFOLD.yaml
# §1.3; no assertion restates a formula. The logical clock is left at its
# startup default 2026-08-01T00:00:00Z unless a recipe advances it explicitly.
#
# Canonical actor ids used throughout:
#   u-admin-1   NetworkAdmin
#   u-sales-1   AffiliateSalesExec      u-sales-2  AffiliateSalesExec (2nd desk)
#   u-rev-1     RevenueAccountant       u-rev-2    RevenueAccountant (2nd desk)
#   u-audit-1   AuditManager
#   u-rights-1  RightsAdministrator
#   DistributorLiaison actors are entity-backed: X-User-ID == Distributor.id
# =============================================================================
scaffold_difficulty_design:

  # ===========================================================================
  # RULE 1 — dual_variant_calc
  # ===========================================================================
  - rule_id: dual_variant_calc
    rule_summary: >-
      Three separate calculations each carry two named variants that are
      selected by stored data rather than by a request flag, and each pair is
      observable on the same fixture. The variants are not scale factors on one
      another: each pair changes a different structural input (which subscriber
      count is billable, which month's rate prices a variance, which churn
      recapture assumption drives the loss projection).
    instances:

      - instance_id: DV-1
        name: final_fee_exceeds_provisional_when_reported_below_penetration_floor
        grounds:
          - calculations.subscriber_report_license_fee
          - calculations.agreement_effective_rate
          - entities.SubscriberReport.fields.provisional_fee_cents
          - entities.SubscriberReport.fields.license_fee_due_cents
          - entities.SubscriberReport.fields.billable_subscribers
        title: "subscriber_report_license_fee — PROVISIONAL accrual vs FINAL billable, penetration floor engaged"
        calculation: subscriber_report_license_fee
        rationale: >-
          The same SubscriberReport is priced twice by the same formula. At
          submission the PROVISIONAL variant takes reported_subscribers
          verbatim; at acceptance the FINAL variant substitutes
          max(reported_subscribers, floor(penetration_floor_pct *
          Distributor.total_subscribers)). A distributor that under-penetrates
          therefore accrues less than it finally owes, and the gap is the
          network's penetration remedy. An implementation that computes one fee
          and reuses it for both stamps cannot produce two different numbers on
          one row.
        distinguishing_aspect: >-
          provisional_fee_cents == 145367040 while license_fee_due_cents ==
          154452480 on the SAME report row, a strict 9085440-cent gap created
          purely by the floor substitution (billable_subscribers 3400000 vs the
          3200000 actually reported). A single-variant implementation returns
          145367040 in both fields; a implementation that applies the floor at
          submission returns 154452480 in both.
        test_recipe:
          setup: >-
            Northgate Cable Systems (CABLE_MSO, 4,000,000 total video
            subscribers) carries the network on EXPANDED_BASIC under an executed
            four-year agreement: base 42.0000 cents per subscriber per month, a
            4% annual compounding escalator anchored to 2024-01-01, and an 85%
            penetration floor. The clock stands at the 2026-08-01 default, so
            the 2026-06 reporting month falls in contract year index 2 and
            prices at round_half_up(42.0000 * 1.04^2, 4) = 45.4272. The
            operator files 3,200,000 subscribers for 2026-06 — 80.00%
            penetration, below the 85% floor whose enforceable equivalent is
            floor(0.85 * 4,000,000) = 3,400,000 subscribers.
          setup_api_calls:
            - call: "POST /carriage/distributors"
              payload:
                legal_name: "Northgate Cable Systems"
                distributor_type: "CABLE_MSO"
                rate_card_class: "CLASS_A"
                total_subscribers: 4000000
                credit_limit_cents: 500000000
              as: NetworkAdmin
              as_user_id: "u-admin-1"
              captures:
                d1_id: "id"
                d1_version: "version"
            - call: "POST /carriage/agreements"
              payload:
                distributor_id: "${d1_id}"
                contract_code: "NG-2024-01"
                term_start_date: "2024-01-01T00:00:00Z"
                term_end_date: "2027-12-31T00:00:00Z"
                base_license_fee_cents_per_sub: 42.0000
                escalator_pct: 0.04
                penetration_floor_pct: 0.85
                committed_tier: "EXPANDED_BASIC"
                launch_fee_cents: 0
                marketing_commitment_cents: 0
              as: AffiliateSalesExec
              as_user_id: "u-sales-1"
              captures:
                a1_id: "id"
            - call: "POST /carriage/agreements/${a1_id}/lifecycle"
              payload:
                action: "SUBMIT_FOR_NEGOTIATION"
              as: AffiliateSalesExec
              as_user_id: "u-sales-1"
            - call: "POST /carriage/agreements/${a1_id}/lifecycle"
              payload:
                action: "EXECUTE"
              as: AffiliateSalesExec
              as_user_id: "u-sales-1"
              captures:
                a1_version: "version"
            - call: "POST /carriage/subscriber-reports"
              payload:
                agreement_id: "${a1_id}"
                period_month: "2026-06"
                reported_subscribers: 3200000
                reported_tier: "EXPANDED_BASIC"
                expected_agreement_version: "${a1_version}"
              as: DistributorLiaison
              as_user_id: "${d1_id}"
              captures:
                rep1_id: "id"
                rep1_provisional: "provisional_fee_cents"
          trigger:
            call: "POST /carriage/subscriber-reports/${rep1_id}/review"
            payload:
              action: "ACCEPT"
            as: RevenueAccountant
            as_user_id: "u-rev-1"
          assert:
            - "the captured rep1_provisional from the submission step equals 145367040"
            - "response body status == \"ACCEPTED\""
            - "response body rate_applied_cents_per_sub == 45.4272"
            - "response body penetration_pct == 0.8000"
            - "response body billable_subscribers == 3400000"
            - "response body license_fee_due_cents == 154452480"
            - "response body provisional_fee_cents == 145367040 (the accrual figure is NOT overwritten by acceptance)"
            - "response body tier_placement_breach == false"
            - "GET /carriage/agreements/${a1_id} returns recognized_revenue_cents == 154452480 and penetration_compliance_status == \"BREACH\""

      - instance_id: DV-2
        name: audit_recovery_period_rate_versus_closing_rate_variants
        grounds:
          - calculations.audit_recovery_amount
          - entities.AuditEngagement.fields.rate_basis
          - entities.AuditEngagement.fields.recovery_amount_cents
          - entities.AuditFinding.fields.rate_applied_cents_per_sub
        title: "audit_recovery_amount — PERIOD_RATE re-pricing vs CLOSING_RATE re-pricing across two contract years"
        calculation: audit_recovery_amount
        rationale: >-
          AuditEngagement.rate_basis selects which rate prices each finding.
          PERIOD_RATE re-prices every audited month at the escalated rate that
          was in force for that month; CLOSING_RATE re-prices the whole sample
          at the rate standing when findings issue. On an escalating agreement
          the two readings diverge on every audited month older than the current
          contract year, and because monthly interest is computed on the
          already-rounded per-finding recovery the divergence compounds into the
          interest line as well.
        distinguishing_aspect: >-
          With identical findings (100,000 under-reported subscribers in 2024-03
          and 100,000 in 2026-03), PERIOD_RATE yields base_recovery_cents
          8742720 / interest_cents 1018282 / recovery_amount_cents 9761002,
          while CLOSING_RATE yields 9085440 / 1090253 / 10175693. The gap comes
          entirely from the 2024-03 finding, priced at 42.0000 under PERIOD_RATE
          and at 45.4272 under CLOSING_RATE; the 2026-03 finding is identical
          under both bases because 2026-08 and 2026-03 share contract year index
          2. An implementation that always uses the agreement's current rate
          produces 10175693 for a PERIOD_RATE engagement.
        test_recipe:
          setup: >-
            The Northgate agreement of DV-1. Two months are reported and
            accepted: 2024-03 at 3,600,000 subscribers (90.00% penetration) and
            2026-03 at 3,500,000 (87.50%), both above the 85% floor so no
            suspension interferes. An audit engagement is opened over the
            2024-03..2026-03 sample with rate_basis = PERIOD_RATE, fieldwork
            starts, and both months are found under-reported by exactly 100,000
            subscribers. Aggregate under-reporting is
            round_half_up(200000/7100000, 4) = 0.0282, below the 0.05 tier, so
            penalty_multiplier stays 1.00 and no audit cost is shifted — the two
            variants are compared with the penalty ladder deliberately inert.
            Interest accrues at 0.75%/month over 28 whole months for 2024-03
            (last day 2024-03-31) and 4 months for 2026-03.
          setup_api_calls:
            - call: "POST /carriage/distributors"
              payload:
                legal_name: "Northgate Cable Systems"
                distributor_type: "CABLE_MSO"
                rate_card_class: "CLASS_A"
                total_subscribers: 4000000
                credit_limit_cents: 500000000
              as: NetworkAdmin
              as_user_id: "u-admin-1"
              captures:
                d1_id: "id"
            - call: "POST /carriage/agreements"
              payload:
                distributor_id: "${d1_id}"
                contract_code: "NG-2024-01"
                term_start_date: "2024-01-01T00:00:00Z"
                term_end_date: "2027-12-31T00:00:00Z"
                base_license_fee_cents_per_sub: 42.0000
                escalator_pct: 0.04
                penetration_floor_pct: 0.85
                committed_tier: "EXPANDED_BASIC"
                launch_fee_cents: 0
                marketing_commitment_cents: 0
              as: AffiliateSalesExec
              as_user_id: "u-sales-1"
              captures:
                a1_id: "id"
            - call: "POST /carriage/agreements/${a1_id}/lifecycle"
              payload:
                action: "SUBMIT_FOR_NEGOTIATION"
              as: AffiliateSalesExec
              as_user_id: "u-sales-1"
            - call: "POST /carriage/agreements/${a1_id}/lifecycle"
              payload:
                action: "EXECUTE"
              as: AffiliateSalesExec
              as_user_id: "u-sales-1"
              captures:
                a1_version: "version"
            - call: "POST /carriage/subscriber-reports"
              payload:
                agreement_id: "${a1_id}"
                period_month: "2024-03"
                reported_subscribers: 3600000
                reported_tier: "EXPANDED_BASIC"
                expected_agreement_version: "${a1_version}"
              as: DistributorLiaison
              as_user_id: "${d1_id}"
              captures:
                rep_mar24_id: "id"
            - call: "POST /carriage/subscriber-reports/${rep_mar24_id}/review"
              payload:
                action: "ACCEPT"
              as: RevenueAccountant
              as_user_id: "u-rev-1"
            - call: "GET /carriage/agreements/${a1_id}"
              payload: {}
              as: RevenueAccountant
              as_user_id: "u-rev-1"
              captures:
                a1_version_2: "version"
            - call: "POST /carriage/subscriber-reports"
              payload:
                agreement_id: "${a1_id}"
                period_month: "2026-03"
                reported_subscribers: 3500000
                reported_tier: "EXPANDED_BASIC"
                expected_agreement_version: "${a1_version_2}"
              as: DistributorLiaison
              as_user_id: "${d1_id}"
              captures:
                rep_mar26_id: "id"
            - call: "POST /carriage/subscriber-reports/${rep_mar26_id}/review"
              payload:
                action: "ACCEPT"
              as: RevenueAccountant
              as_user_id: "u-rev-1"
            - call: "POST /carriage/audit-engagements"
              payload:
                agreement_id: "${a1_id}"
                sample_period_start: "2024-03"
                sample_period_end: "2026-03"
                rate_basis: "PERIOD_RATE"
              as: AuditManager
              as_user_id: "u-audit-1"
              captures:
                eng_period_id: "id"
            - call: "POST /carriage/audit-engagements/${eng_period_id}/lifecycle"
              payload:
                action: "START_FIELDWORK"
              as: AuditManager
              as_user_id: "u-audit-1"
            - call: "POST /carriage/audit-engagements/${eng_period_id}/findings"
              payload:
                subscriber_report_id: "${rep_mar24_id}"
                audited_subscribers: 3700000
              as: AuditManager
              as_user_id: "u-audit-1"
              captures:
                find_mar24_id: "id"
            - call: "POST /carriage/audit-engagements/${eng_period_id}/findings"
              payload:
                subscriber_report_id: "${rep_mar26_id}"
                audited_subscribers: 3600000
              as: AuditManager
              as_user_id: "u-audit-1"
              captures:
                find_mar26_id: "id"
          trigger:
            call: "POST /carriage/audit-engagements/${eng_period_id}/lifecycle"
            payload:
              action: "ISSUE_FINDINGS"
            as: AuditManager
            as_user_id: "u-audit-1"
          assert:
            - "response body status == \"FINDINGS_ISSUED\""
            - "response body total_variance_subscribers == 200000"
            - "response body total_reported_subscribers == 7100000"
            - "response body underreporting_pct == 0.0282"
            - "response body penalty_multiplier == 1.00"
            - "response body audit_cost_shift_cents == 0"
            - "response body base_recovery_cents == 8742720"
            - "response body interest_cents == 1018282"
            - "response body recovery_amount_cents == 9761002"
            - "GET /carriage/audit-findings/${find_mar24_id} returns rate_applied_cents_per_sub == 42.0000 and finding_recovery_cents == 4200000"
            - "GET /carriage/audit-findings/${find_mar26_id} returns rate_applied_cents_per_sub == 45.4272 and finding_recovery_cents == 4542720"
            - "repeating this entire recipe with rate_basis == \"CLOSING_RATE\" yields base_recovery_cents == 9085440, interest_cents == 1090253, recovery_amount_cents == 10175693, and rate_applied_cents_per_sub == 45.4272 on BOTH findings"

      - instance_id: DV-3
        name: renewal_leverage_base_case_versus_downside_variants
        grounds:
          - calculations.renewal_leverage_model
          - entities.RenewalAnalysis.fields.variant
          - entities.RenewalAnalysis.fields.leverage_score
          - entities.RenewalAnalysis.fields.distribution_loss_subscribers
          - entities.RenewalAnalysis.fields.annualized_revenue_at_risk_cents
        title: "renewal_leverage_model — BASE_CASE vs DOWNSIDE recapture with an invariant leverage score"
        calculation: renewal_leverage_model
        rationale: >-
          RenewalAnalysis.variant selects the churn-recapture assumption used
          for distribution-loss modelling. The subtlety is asymmetric coverage:
          the weighted leverage_score is IDENTICAL across variants because no
          weight depends on recapture, while distribution_loss_subscribers and
          annualized_revenue_at_risk_cents differ substantially. An
          implementation that threads the variant through the whole model
          produces two different scores; one that ignores the variant produces
          two identical loss projections.
        distinguishing_aspect: >-
          Two RenewalAnalysis rows over identical agreement data:
          leverage_score == 64.01 on BOTH, but distribution_loss_subscribers
          2275000 vs 3150000 and annualized_revenue_at_risk_cents 1240162560 vs
          1717148160. The 875,000-subscriber delta is exactly
          4,000,000 * 0.8750 * (0.35 - 0.10).
        test_recipe:
          setup: >-
            The Northgate agreement of DV-1 with one accepted month: 2026-06 at
            3,500,000 subscribers, i.e. penetration_pct 0.8750 against the 0.85
            floor, so penetration_ratio = round_half_up(0.8750/0.85, 4) =
            1.0294. Northgate has no outstanding receivable and no penetration
            breaches, so payment_score and compliance_score are both 1.0000, and
            subscriber_share = round_half_up(4,000,000/90,000,000, 6) =
            0.044444. The agreement's effective_rate_cents_per_sub stands at
            45.4272.
          setup_api_calls:
            - call: "POST /carriage/distributors"
              payload:
                legal_name: "Northgate Cable Systems"
                distributor_type: "CABLE_MSO"
                rate_card_class: "CLASS_A"
                total_subscribers: 4000000
                credit_limit_cents: 500000000
              as: NetworkAdmin
              as_user_id: "u-admin-1"
              captures:
                d1_id: "id"
            - call: "POST /carriage/agreements"
              payload:
                distributor_id: "${d1_id}"
                contract_code: "NG-2024-01"
                term_start_date: "2024-01-01T00:00:00Z"
                term_end_date: "2027-12-31T00:00:00Z"
                base_license_fee_cents_per_sub: 42.0000
                escalator_pct: 0.04
                penetration_floor_pct: 0.85
                committed_tier: "EXPANDED_BASIC"
                launch_fee_cents: 0
                marketing_commitment_cents: 0
              as: AffiliateSalesExec
              as_user_id: "u-sales-1"
              captures:
                a1_id: "id"
            - call: "POST /carriage/agreements/${a1_id}/lifecycle"
              payload:
                action: "SUBMIT_FOR_NEGOTIATION"
              as: AffiliateSalesExec
              as_user_id: "u-sales-1"
            - call: "POST /carriage/agreements/${a1_id}/lifecycle"
              payload:
                action: "EXECUTE"
              as: AffiliateSalesExec
              as_user_id: "u-sales-1"
              captures:
                a1_version: "version"
            - call: "POST /carriage/subscriber-reports"
              payload:
                agreement_id: "${a1_id}"
                period_month: "2026-06"
                reported_subscribers: 3500000
                reported_tier: "EXPANDED_BASIC"
                expected_agreement_version: "${a1_version}"
              as: DistributorLiaison
              as_user_id: "${d1_id}"
              captures:
                rep_jun_id: "id"
            - call: "POST /carriage/subscriber-reports/${rep_jun_id}/review"
              payload:
                action: "ACCEPT"
              as: RevenueAccountant
              as_user_id: "u-rev-1"
            - call: "POST /carriage/renewal-analyses"
              payload:
                agreement_id: "${a1_id}"
                variant: "BASE_CASE"
              as: AffiliateSalesExec
              as_user_id: "u-sales-1"
              captures:
                base_analysis_id: "id"
                base_leverage: "leverage_score"
                base_loss: "distribution_loss_subscribers"
          trigger:
            call: "POST /carriage/renewal-analyses"
            payload:
              agreement_id: "${a1_id}"
              variant: "DOWNSIDE"
            as: AffiliateSalesExec
            as_user_id: "u-sales-1"
          assert:
            - "the captured base_leverage equals 64.01 and base_loss equals 2275000"
            - "response body variant == \"DOWNSIDE\""
            - "response body latest_accepted_report_id == ${rep_jun_id}"
            - "response body subscriber_share == 0.044444"
            - "response body penetration_ratio == 1.0294"
            - "response body payment_score == 1.0000"
            - "response body compliance_score == 1.0000"
            - "response body leverage_score == 64.01 (identical to the BASE_CASE row)"
            - "response body distribution_loss_subscribers == 3150000"
            - "response body annualized_revenue_at_risk_cents == 1717148160"
            - "GET /carriage/renewal-analyses/${base_analysis_id} still returns distribution_loss_subscribers == 2275000 and annualized_revenue_at_risk_cents == 1240162560"

  # ===========================================================================
  # RULE 2 — combinatorial_formula
  # ===========================================================================
  - rule_id: combinatorial_formula
    rule_summary: >-
      Three calculations are irreducible to a single arithmetic expression.
      mfn_benchmark_rate is an eligibility filter plus a banded ranking
      expression plus a created_at tie-break plus an empty-pool fallback.
      invoice_net_due is a six-step waterfall whose percentage band is selected
      from a quantity the waterfall itself later reduces — the evaluation order
      is load-bearing. agreement_effective_rate is a compounding escalator
      wrapped in a two-sided clamp where the floor can override the cap.
    instances:

      - instance_id: CF-1
        name: mfn_benchmark_scope_filter_changes_winning_peer
        grounds:
          - calculations.mfn_benchmark_rate
          - entities.MfnClause.fields.mfn_scope
          - entities.MfnClause.fields.benchmark_rate_cents
          - entities.MfnClause.fields.benchmark_peer_agreement_id
          - concurrency_rules[mfn-reset-stale-agreement]
        title: "mfn_benchmark_rate — scope filter excludes the cheapest peer, volume band re-ranks the survivors"
        calculation: mfn_benchmark_rate
        rationale: >-
          The benchmark is not min(peer rates). It is the min of a per-peer
          ADJUSTED rate over a filtered candidate set, where the filter turns on
          the clause's mfn_scope (DOMESTIC admits only CABLE_MSO/DBS/TELCO),
          the peer's lifecycle_status, like-for-like committed_tier, term
          currency against the logical clock, min_peer_subscribers, and
          distributor distinctness; and where the adjustment multiplies by a
          three-way subscriber volume band and, for VMVPD peers, an additional
          platform discount. Four independent structures must all be present for
          the answer to come out right.
        distinguishing_aspect: >-
          The genuinely cheapest peer on paper is the VMVPD operator (38.0000
          raw, 36.7080 adjusted), but a DOMESTIC clause excludes VMVPD entirely,
          so benchmark_rate_cents == 38.7280 with benchmark_peer_agreement_id ==
          the DBS agreement — even though the DBS peer's RAW rate 41.2000 is
          HIGHER than the VMVPD peer's 38.0000 and higher than the subject's own
          escalated 45.4272 before its LARGE-band factor 0.94 is applied. An
          implementation that skips the scope filter returns 36.7080; one that
          skips the volume band returns 41.2000 and picks no cap at all is
          impossible to reach from these inputs.
        test_recipe:
          setup: >-
            Three operators carry the network on EXPANDED_BASIC. Northgate Cable
            Systems (CABLE_MSO, 4,000,000 subs) is the subject, escalated to
            45.4272 in contract year 2. Vale Satellite (DBS, 12,000,000 subs) is
            executed at base 40.0000 with a 3% escalator from 2025-01-01, so its
            effective rate is 41.2000 in contract year 1; 12,000,000 subscribers
            puts it in the LARGE band, factor 0.94, adjusted
            round_half_up(41.2000 * 0.94, 4) = 38.7280. Streamline (VMVPD,
            1,500,000 subs) is executed at a flat 38.0000; SMALL band factor
            1.05 and the 8% VMVPD platform discount give
            round_half_up(38.0000 * 1.05 * 0.92, 4) = 36.7080 — the lowest
            adjusted rate in the market. Northgate's MFN clause is DOMESTIC with
            min_peer_subscribers 1,000,000 and a 30.0000 floor that does not
            bite.
          setup_api_calls:
            - call: "POST /carriage/distributors"
              payload:
                legal_name: "Northgate Cable Systems"
                distributor_type: "CABLE_MSO"
                rate_card_class: "CLASS_A"
                total_subscribers: 4000000
                credit_limit_cents: 500000000
              as: NetworkAdmin
              as_user_id: "u-admin-1"
              captures:
                d1_id: "id"
            - call: "POST /carriage/distributors"
              payload:
                legal_name: "Vale Satellite Group"
                distributor_type: "DBS"
                rate_card_class: "CLASS_B"
                total_subscribers: 12000000
                credit_limit_cents: 900000000
              as: NetworkAdmin
              as_user_id: "u-admin-1"
              captures:
                d2_id: "id"
            - call: "POST /carriage/distributors"
              payload:
                legal_name: "Streamline Digital"
                distributor_type: "VMVPD"
                rate_card_class: "CLASS_C"
                total_subscribers: 1500000
                credit_limit_cents: 200000000
              as: NetworkAdmin
              as_user_id: "u-admin-1"
              captures:
                d3_id: "id"
            - call: "POST /carriage/agreements"
              payload:
                distributor_id: "${d2_id}"
                contract_code: "VS-2025-01"
                term_start_date: "2025-01-01T00:00:00Z"
                term_end_date: "2028-12-31T00:00:00Z"
                base_license_fee_cents_per_sub: 40.0000
                escalator_pct: 0.03
                penetration_floor_pct: 0.80
                committed_tier: "EXPANDED_BASIC"
                launch_fee_cents: 0
                marketing_commitment_cents: 0
              as: AffiliateSalesExec
              as_user_id: "u-sales-1"
              captures:
                a2_id: "id"
            - call: "POST /carriage/agreements/${a2_id}/lifecycle"
              payload:
                action: "SUBMIT_FOR_NEGOTIATION"
              as: AffiliateSalesExec
              as_user_id: "u-sales-1"
            - call: "POST /carriage/agreements/${a2_id}/lifecycle"
              payload:
                action: "EXECUTE"
              as: AffiliateSalesExec
              as_user_id: "u-sales-1"
            - call: "POST /carriage/agreements"
              payload:
                distributor_id: "${d3_id}"
                contract_code: "SD-2025-06"
