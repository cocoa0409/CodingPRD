        as: ProgramManager
      - call: POST /streetlights/salvage-batches/${b2}/seal
        payload:
          contaminated_flag: false
        as: ComplianceOfficer
      - call: POST /streetlights/salvage-batches/${b2}/settle
        payload: {}
        as: BillingAnalyst
        captures:
