    - name: award_state_guard_outranks_the_budget_ceiling_guard
      claim_type: Priority conflict
      grounds:
      - validations[priority=40]
      - validations[priority=90]
      - errors[ERR_EVENT_STATE_INVALID]
      - errors[ERR_BUDGET_CEILING_EXCEEDED]
      excluded_because:
        difficulty_instance: award_event_state_beats_budget_ceiling
        rationale: That difficulty instance constructs a request that violates both the event-state rule at priority 40 and the budget-ceiling rule at priority 90 and asserts the 409 from 40 is returned, then repairs the state to expose the 422 from 90.
    - name: counter_validity_depends_on_the_parent_rfp_state
      claim_type: Cross-entity validation
      grounds:
      - validations[priority=50]
      - errors[ERR_RFP_NOT_OPEN]
      - entities.NegotiationCounter
      - entities.Rfp.fields.status
      excluded_because:
        difficulty_instance: counter_requires_parent_rfp_still_issued
        rationale: The cross-entity claim - a counter on a perfectly UNDER_REVIEW proposal is refused purely because its grandparent Rfp has been CLOSED, and succeeds while that Rfp is ISSUED - is that difficulty instance's entire subject.
    - name: room_block_capacity_is_an_aggregate_over_overlapping_contracts
      claim_type: Aggregate validation
      grounds:
      - validations[priority=82]
      - errors[ERR_VENUE_ROOM_BLOCK_CAPACITY_EXCEEDED]
      - calculations.room_night_inventory_invariant
      - entities.Contract.fields.peak_rooms_per_night
      excluded_because:
        difficulty_instance: countersign_room_block_capacity_at_exact_guest_room_count
        rationale: Each contract is individually within the venue's guest_rooms_total there, but their summed peak_rooms_per_night over overlapping event dates lands exactly on the capacity and then one room over it, which is precisely the aggregate-validation claim.
