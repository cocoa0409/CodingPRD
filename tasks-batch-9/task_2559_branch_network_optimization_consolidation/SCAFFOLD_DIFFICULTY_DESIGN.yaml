              as: NetworkStrategist
              as_user_id: "u_strategist_1"
              captures: { caseA_id: $.data.id }
            - call: "POST /distribution/consolidation-cases"
              payload: { closing_branch_id: "${b2_id}", receiving_branch_id: "${b3_id}", rationale_code: "LOW_PERFORMANCE", planned_closure_date: "2026-12-01", expected_branch_version: "${b2_v}" }
              as: NetworkStrategist
              as_user_id: "u_strategist_1"
