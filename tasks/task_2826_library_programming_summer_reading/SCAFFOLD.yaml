# =============================================================================
# Library Programming & Summer Reading — benchmark seed tables
# Public library programming department: program calendar, presenter
# contracting & screening, room reservation with accessibility, summer
# reading challenge with incentive tiers and prize procurement, outcome
# measurement for funder reporting, materials budgeting with cross-branch
# supply reuse, cancellation / weather closure / no-show handling.
# =============================================================================

scenario: |
  Library Programming & Summer Reading (public library programming department):
  program calendar planning across age groups with attendance targets and space
  constraints, presenter contracting with fees, insurance and background
  screening for programs involving minors, room reservation, setup and
  accessibility accommodations with registration or drop-in policy decisions,
  summer reading program design with logging methods, incentive tiers and prize
  procurement, community partner collaboration with schools, parks and
  nonprofits for outreach sites, attendance and outcome measurement with survey
  instruments for funder reporting, program materials budgeting, supply
  purchasing and reuse across branches, cancellation, weather closure and
  no-show handling.

domain_name: library-programming
api_prefix: /library

# =============================================================================
# §0 Complexity Profile
# =============================================================================
complexity_profile:
  primary_archetype: temporal_windowing
  secondary_archetype: quota_allocation
  complexity_layers:
    - optimistic_concurrency
    - cascading_side_effects
    - derived_field_reconciliation
    - conditional_feature_flags

  entity_topology: flat
  # Peer entities linked by foreign keys; every collection is addressed at
  # `/library/<collection>` and never nested more than one action segment deep.
  # The only sub-resource reads are the FK reverse-reachability GETs.

  state_machine_shape: parallel
  # Program carries two independent state dimensions (operational_status ×
  # compliance_status) that advance on disjoint triggers; PresenterContract is
  # cyclic (OFFERED -> COUNTERED -> OFFERED with a bounded round counter);
  # Presenter's screening dimension cycles ACTIVE -> EXPIRED -> PENDING ->
  # ACTIVE; TierAward branches RESERVED|DEFERRED with divergent settlements.

  relationship_patterns:
    - one_to_many          # Branch -> Room/Program/InventoryLot/Participant
    - self_referential     # ReadingLogEntry.corrected_entry_id -> ReadingLogEntry.id
    - cross_aggregate      # TierAward binds Participant, IncentiveTier and InventoryLot
    - polymorphic_free     # no polymorphic FKs: every FK names exactly one parent entity

  role_model: segregation_of_duties
  # The user id that offered a PresenterContract may not be the user id that
  # executes it; screening decisions are exclusive to ScreeningOfficer; readers
  # may only self-log against their own Participant record.

  consistency_model: immediate

  difficulty_level: expert_plus
  entity_count: 12
  endpoint_count: 49
  error_code_count: 61
  calculation_count: 13
  state_machine_count: 9

# =============================================================================
# §1.0 Response Envelope (FIXED)
# =============================================================================
response_envelope:
  success: |
    { "meta": { "api_request_id": "req_xxx", "api_request_timestamp": "ISO8601" },
      "response_type": "object" | "array", "data": {} }
  error: |
    { "meta": { ... }, "response_type": "error",
      "data": { "error_id": "ERR_XXX", "message": "..." } }
  pagination_fields: ["limit", "offset", "total_count", "has_more"]
  pagination_defaults: { limit: 10, min: 1, max: 100, offset: 0 }

# =============================================================================
# §1.1 Entity-Relationship Table
# =============================================================================
entities:

  - name: Branch
    parent: null
    common_fields: true
    fields:
      - { name: name, type: string, source: input, description: "Branch display name" }
      - { name: branch_code, type: string, source: input, description: "Short code, unique across all branches", constraints: "unique; 2-8 uppercase chars" }
      - { name: overlapping_program_capacity, type: integer, source: input, description: "Maximum number of CONFIRMED programs at this branch whose public windows may intersect (staffing ceiling)", constraints: ">= 1" }
      - { name: per_program_fee_cap_cents, type: integer, source: input, description: "Branch ceiling on a single program's presenter total_fee_cents", constraints: ">= 0" }
      - { name: programs_over_budget_count, type: integer, source: computed, description: "Count of this branch's Programs whose budget_posture == OVER_BUDGET, recomputed only when a Program's budget_posture changes", default: 0 }

  - name: Room
    parent: null
    common_fields: true
    fields:
      - { name: branch_id, type: string, source: system, description: "FK -> Branch.id; taken from the creation path, never from the body" }
      - { name: room_name, type: string, source: input, description: "Room label within the branch" }
      - { name: capacity_seats, type: integer, source: input, description: "Nominal seated capacity", constraints: ">= 1" }
      - { name: min_setup_minutes, type: integer, source: input, description: "Minimum minutes of pre-program setup this room requires", constraints: ">= 0" }
      - { name: min_teardown_minutes, type: integer, source: input, description: "Minimum minutes of post-program teardown this room requires", constraints: ">= 0" }
      - { name: accessibility_features, type: array, source: input, description: "Subset of WHEELCHAIR_ACCESSIBLE | HEARING_LOOP | ADJUSTABLE_LIGHTING | QUIET_ZONE; may be empty" }
      - { name: status, type: enum, source: input, description: "AVAILABLE | OUT_OF_SERVICE", default: "AVAILABLE" }

  - name: Program
    parent: null
    common_fields: true
    fields:
      - { name: branch_id, type: string, source: input, description: "FK -> Branch.id; owning branch, also the staffing pool for overlap accounting" }
      - { name: challenge_id, type: string, source: input, description: "FK -> ReadingChallenge.id; null when the program is not part of the summer reading season", default: null }
      - { name: title, type: string, source: input, description: "Program title" }
      - { name: age_group, type: enum, source: input, description: "EARLY_CHILDHOOD | SCHOOL_AGE | TEEN | ADULT | ALL_AGES" }
      - { name: serves_minors, type: boolean, source: computed, description: "true when age_group IN {EARLY_CHILDHOOD, SCHOOL_AGE, TEEN, ALL_AGES}; false only for ADULT" }
      - { name: delivery_mode, type: enum, source: input, description: "IN_BRANCH | PARTNER_SITE" }
      - { name: partner_type, type: enum, source: input, description: "NONE | SCHOOL | PARKS | NONPROFIT; must not be NONE when delivery_mode == PARTNER_SITE", default: "NONE" }
      - { name: partner_org_name, type: string, source: input, description: "Community partner organisation name; required when delivery_mode == PARTNER_SITE", default: null }
      - { name: partner_insurance_expires_on, type: string, source: input, description: "ISO date (YYYY-MM-DD) of the partner's liability certificate expiry; required when delivery_mode == PARTNER_SITE", default: null }
      - { name: registration_policy, type: enum, source: input, description: "REGISTRATION | DROP_IN" }
      - { name: start_utc, type: datetime, source: input, description: "Public program start instant (ISO 8601 UTC, three fractional digits)" }
      - { name: end_utc, type: datetime, source: input, description: "Public program end instant; must be strictly after start_utc" }
      - { name: attendance_target, type: integer, source: input, description: "Attendance target used as the funder-reported denominator", constraints: ">= 1" }
      - { name: attendance_cap, type: integer, source: input, description: "Hard registration ceiling set by the coordinator", constraints: ">= attendance_target" }
      - { name: accessibility_accommodations, type: array, source: input, description: "Subset of ASL_INTERPRETER | SENSORY_QUIET_HOUR | WHEELCHAIR_LAYOUT | LARGE_PRINT_HANDOUTS; may be empty", default: "[]" }
      - { name: supply_sku, type: string, source: input, description: "SKU of the program materials kit drawn at confirm time" }
      - { name: supply_units_per_attendee, type: integer, source: input, description: "Kit units drawn per attendance_target head", constraints: ">= 0" }
      - { name: materials_budget_cents, type: integer, source: input, description: "Materials budget ceiling for this program", constraints: ">= 0" }
      - { name: presenter_fee_budget_cents, type: integer, source: input, description: "Planned presenter fee budget; overruns are allowed but flip budget_posture", constraints: ">= 0" }
      - { name: operational_status, type: enum, source: computed, description: "DRAFT | SCHEDULED | CONFIRMED | CLOSED_OUT | CANCELLED | WEATHER_CLOSED", default: "DRAFT" }
      - { name: compliance_status, type: enum, source: computed, description: "UNVERIFIED | PENDING_SCREENING | CLEARED | BLOCKED — independent dimension driven by presenter screening events", default: "UNVERIFIED" }
      - { name: registered_count, type: integer, source: computed, description: "Monotone sum of seats accepted through POST /library/programs/{program_id}/registrations; never decremented", default: 0 }
      - { name: confirmed_room_capacity, type: integer, source: computed, description: "effective_capacity_seats of this program's RoomReservation whose status == CONFIRMED; 0 when delivery_mode == PARTNER_SITE or no reservation is CONFIRMED", default: 0 }
      - { name: supply_draw_lines, type: array, source: computed, description: "Ordered array of objects { lot_id, units, unit_cost_cents, surcharge_cents, line_total_cents } produced by supply_draw_allocation at confirm; empty until confirmed, emptied when the draw is returned", default: "[]" }
      - { name: materials_committed_cents, type: integer, source: computed, description: "Output of materials_commitment_with_contingency; 0 before confirm and after a draw return", default: 0 }
      - { name: materials_spent_cents, type: integer, source: computed, description: "Committed materials converted to spend at close-out", default: 0 }
      - { name: materials_available_cents, type: integer, source: computed, description: "materials_budget_cents - materials_committed_cents - materials_spent_cents", default: 0 }
      - { name: presenter_fee_committed_cents, type: integer, source: computed, description: "Sum of total_fee_cents over this program's PresenterContracts with status == EXECUTED, plus kill_fee_cents of contracts with status IN {CANCELLED_WEATHER, CANCELLED_LIBRARY}", default: 0 }
      - { name: presenter_fee_spent_cents, type: integer, source: computed, description: "Committed presenter fees converted to spend at close-out (contracts become COMPLETED)", default: 0 }
      - { name: budget_variance_cents, type: integer, source: computed, description: "(materials_budget_cents + presenter_fee_budget_cents) - (materials_committed_cents + materials_spent_cents + presenter_fee_committed_cents + presenter_fee_spent_cents)" }
      - { name: budget_posture, type: enum, source: computed, description: "OVER_BUDGET when budget_variance_cents < 0, else WITHIN_BUDGET", default: "WITHIN_BUDGET" }
      - { name: verified_registrant_attendance, type: integer, source: input, description: "Close-out input: registrants confirmed present at the door", default: 0 }
      - { name: drop_in_headcount, type: integer, source: input, description: "Close-out input: unregistered walk-in and outreach-site heads counted", default: 0 }
      - { name: gross_attendance, type: integer, source: computed, description: "verified_registrant_attendance + drop_in_headcount", default: 0 }
      - { name: no_show_count, type: integer, source: computed, description: "max(0, registered_count - verified_registrant_attendance)", default: 0 }
      - { name: surveys_collected, type: integer, source: input, description: "Close-out input: completed outcome survey instruments", default: 0 }
      - { name: attendance_attainment_funder_pct, type: number, source: computed, description: "Funder-reported attainment variant, one decimal place", default: 0 }
      - { name: attendance_attainment_internal_pct, type: number, source: computed, description: "Internal capacity-adjusted attainment variant, one decimal place", default: 0 }
      - { name: survey_response_rate_pct, type: number, source: computed, description: "100 * surveys_collected / gross_attendance, one decimal place; exactly 0.0 when gross_attendance == 0", default: 0 }
      - { name: closure_reason, type: string, source: input, description: "Reason text captured by cancel or weather-close", default: null }
      - { name: registrant_references, type: array, source: computed, description: "Array of registrant_reference strings accepted so far; used for duplicate detection", default: "[]" }

  - name: RoomReservation
    parent: null
    common_fields: true
    fields:
      - { name: program_id, type: string, source: system, description: "FK -> Program.id; taken from the creation path" }
      - { name: room_id, type: string, source: input, description: "FK -> Room.id; the reserved room" }
      - { name: start_utc, type: datetime, source: input, description: "Booked room start instant; must be <= Program.start_utc" }
      - { name: end_utc, type: datetime, source: input, description: "Booked room end instant; must be >= Program.end_utc" }
      - { name: setup_minutes, type: integer, source: input, description: "Setup buffer claimed before start_utc", constraints: ">= 0" }
      - { name: teardown_minutes, type: integer, source: input, description: "Teardown buffer claimed after end_utc", constraints: ">= 0" }
      - { name: occupancy_start_utc, type: datetime, source: computed, description: "start_utc - setup_minutes" }
      - { name: occupancy_end_utc, type: datetime, source: computed, description: "end_utc + teardown_minutes" }
      - { name: effective_capacity_seats, type: integer, source: computed, description: "Room.capacity_seats, reduced by WHEELCHAIR_LAYOUT_SEAT_LOSS_RATE when the program requires WHEELCHAIR_LAYOUT (see calculation room_effective_capacity)" }
      - { name: status, type: enum, source: computed, description: "HELD | CONFIRMED | RELEASED | SUPERSEDED", default: "HELD" }

  - name: Presenter
    parent: null
    common_fields: true
    fields:
      - { name: legal_name, type: string, source: input, description: "Presenter legal name as contracted" }
      - { name: presenter_type, type: enum, source: input, description: "INDIVIDUAL | AGENCY" }
      - { name: insurance_certificate_expires_on, type: string, source: input, description: "ISO date (YYYY-MM-DD) the liability certificate lapses" }
      - { name: quoted_fee_cents, type: integer, source: input, description: "Presenter's standing quote, used as the coordinator's opening reference", constraints: ">= 0" }
      - { name: engagement_status, type: enum, source: computed, description: "PROSPECT | ACTIVE | SUSPENDED — advances to ACTIVE on the presenter's first EXECUTED contract, SUSPENDED on a FLAGGED result or DENIED adjudication, back to ACTIVE on a CLEARED_WITH_CONDITIONS adjudication", default: "PROSPECT" }
      - { name: screening_tier, type: enum, source: computed, description: "NONE | NAME_CHECK | FINGERPRINT — tier of the most recent screening request", default: "NONE" }
      - { name: screening_decision, type: enum, source: computed, description: "NONE | PENDING | CLEAR | FLAGGED | CLEARED_WITH_CONDITIONS | DENIED — stored outcome of the screening workflow", default: "NONE" }
      - { name: screening_decided_on, type: string, source: input, description: "ISO date the screening result or adjudication was recorded", default: null }
      - { name: screening_valid_until, type: string, source: computed, description: "screening_decided_on + SCREENING_VALIDITY_DAYS_NAME_CHECK (365) or SCREENING_VALIDITY_DAYS_FINGERPRINT (730) by screening_tier; null while no decision exists", default: null }
      - { name: screening_status, type: enum, source: computed, description: "NONE | PENDING | PENDING_ADJUDICATION | ACTIVE | EXPIRED | BLOCKED — derived from screening_decision plus the logical clock (see calculation screening_validity_window)", default: "NONE" }
      - { name: executed_contract_count, type: integer, source: computed, description: "Count of this presenter's PresenterContracts with status IN {EXECUTED, COMPLETED}", default: 0 }

  - name: PresenterContract
    parent: null
    common_fields: true
    fields:
      - { name: presenter_id, type: string, source: input, description: "FK -> Presenter.id; the contracted presenter" }
      - { name: program_id, type: string, source: input, description: "FK -> Program.id; the program being staffed" }
      - { name: round_trip_miles, type: integer, source: input, description: "Reimbursable round-trip mileage used by the tiered travel formula", constraints: ">= 0" }
      - { name: negotiation_round, type: integer, source: computed, description: "Number of offers issued so far; incremented by every offer, capped by MAX_NEGOTIATION_ROUNDS", default: 0 }
      - { name: offered_fee_cents, type: integer, source: input, description: "Most recent library offer", default: null }
      - { name: countered_fee_cents, type: integer, source: input, description: "Most recent presenter counter", default: null }
      - { name: agreed_fee_cents, type: integer, source: computed, description: "offered_fee_cents of the offer standing when execute succeeded", default: null }
      - { name: travel_fee_cents, type: integer, source: computed, description: "Tiered mileage reimbursement (see calculation contract_total_fee)", default: 0 }
      - { name: escort_fee_cents, type: integer, source: computed, description: "MINORS_ESCORT_FEE_CENTS when Program.serves_minors, else 0", default: 0 }
      - { name: insurance_rider_fee_cents, type: integer, source: computed, description: "INSURANCE_RIDER_FEE_CENTS when the certificate lapses within INSURANCE_RIDER_WINDOW_DAYS after the program end date, else 0", default: 0 }
      - { name: weekend_premium_cents, type: integer, source: computed, description: "WEEKEND_PREMIUM_RATE applied to the pre-premium subtotal when Program.start_utc falls on Saturday or Sunday (UTC), else 0", default: 0 }
      - { name: total_fee_cents, type: integer, source: computed, description: "Payable contract total produced by contract_total_fee at execute; 0 until then", default: 0 }
      - { name: kill_fee_cents, type: integer, source: computed, description: "Cancellation liability produced by contract_cancellation_fee; 0 unless the contract was cancelled", default: 0 }
      - { name: offered_by_user_id, type: string, source: system, description: "X-User-ID of the actor who issued the standing offer; segregation-of-duties key", default: null }
      - { name: executed_by_user_id, type: string, source: system, description: "X-User-ID of the actor who executed the contract", default: null }
      - { name: status, type: enum, source: computed, description: "DRAFT | OFFERED | COUNTERED | EXECUTED | BLOCKED | COMPLETED | CANCELLED_WEATHER | CANCELLED_LIBRARY", default: "DRAFT" }

  - name: ReadingChallenge
    parent: null
    common_fields: true
    fields:
      - { name: name, type: string, source: input, description: "Summer reading challenge name" }
      - { name: logging_method, type: enum, source: input, description: "MINUTES | BOOKS | ACTIVITIES — selects the per-day logging cap" }
      - { name: unit_label, type: string, source: input, description: "Human label for one logged unit" }
      - { name: start_on, type: string, source: input, description: "ISO date the logging window opens (inclusive)" }
      - { name: end_on, type: string, source: input, description: "ISO date the logging window closes (inclusive); must be >= start_on" }
      - { name: correction_policy, type: enum, source: input, description: "HIGH_WATER | LEDGER_TRUTH — selects the tier-award variant applied when a correction reduces a participant's units" }
      - { name: prize_budget_cents, type: integer, source: input, description: "Prize procurement budget for the whole challenge", constraints: ">= 0" }
      - { name: prize_committed_cents, type: integer, source: computed, description: "Sum of award_total_cents over TierAwards with status == RESERVED", default: 0 }
      - { name: prize_spent_cents, type: integer, source: computed, description: "Sum of award_total_cents over TierAwards with status == ISSUED", default: 0 }
      - { name: prize_available_cents, type: integer, source: computed, description: "prize_budget_cents - prize_committed_cents - prize_spent_cents" }
      - { name: prize_inventory_posture, type: enum, source: computed, description: "CONSTRAINED when at least one of this challenge's tiers has zero drawable units across ACTIVE PRIZE lots, else AMPLE", default: "AMPLE" }
      - { name: participant_count, type: integer, source: computed, description: "Count of Participants whose challenge_id is this challenge", default: 0 }
      - { name: deferred_award_count, type: integer, source: computed, description: "Count of this challenge's TierAwards with status == DEFERRED", default: 0 }
      - { name: status, type: enum, source: computed, description: "PLANNING | OPEN | RECONCILED", default: "PLANNING" }

  - name: IncentiveTier
    parent: null
    common_fields: true
    fields:
      - { name: challenge_id, type: string, source: system, description: "FK -> ReadingChallenge.id; taken from the creation path" }
      - { name: tier_index, type: integer, source: input, description: "1-based tier position; must be exactly one greater than the challenge's current highest tier_index", constraints: ">= 1" }
      - { name: threshold_units, type: integer, source: input, description: "Cumulative units at or above which this tier is earned; must be strictly greater than the previous tier's threshold_units", constraints: ">= 1" }
      - { name: prize_sku, type: string, source: input, description: "SKU drawn from PRIZE InventoryLots when this tier is earned" }
      - { name: prize_units_per_participant, type: integer, source: input, description: "Units of prize_sku granted per earning participant", constraints: ">= 1" }
      - { name: award_count, type: integer, source: computed, description: "Count of this tier's TierAwards with status IN {RESERVED, ISSUED}", default: 0 }
      - { name: deferred_count, type: integer, source: computed, description: "Count of this tier's TierAwards with status == DEFERRED", default: 0 }

  - name: Participant
    parent: null
    common_fields: true
    fields:
      - { name: challenge_id, type: string, source: input, description: "FK -> ReadingChallenge.id; the challenge this reader is enrolled in" }
      - { name: home_branch_id, type: string, source: input, description: "FK -> Branch.id; the reader's home branch, used for cross-branch prize surcharge accounting" }
      - { name: display_name, type: string, source: input, description: "Reader display name" }
      - { name: age_band, type: enum, source: input, description: "UNDER_5 | AGE_5_11 | AGE_12_17 | ADULT" }
      - { name: cumulative_units, type: integer, source: computed, description: "Sum of units over this participant's ReadingLogEntries of entry_type == LOG plus the signed units_delta of every entry_type == CORRECTION; floor 0" }
      - { name: awarded_tier_index, type: integer, source: computed, description: "Highest tier_index this participant holds a TierAward for with status IN {RESERVED, DEFERRED, ISSUED}; 0 when none", default: 0 }
      - { name: eligible_tier_index, type: integer, source: computed, description: "Highest tier_index whose threshold_units <= cumulative_units right now; 0 when none", default: 0 }
      - { name: entry_count, type: integer, source: computed, description: "Count of this participant's ReadingLogEntries of every entry_type", default: 0 }
      - { name: last_entry_on, type: string, source: computed, description: "Greatest logged_on date across this participant's entry_type == LOG entries; null when none", default: null }

  - name: ReadingLogEntry
    parent: null
    common_fields: false
    # Append-only ledger entry: it carries `id` and `created_at` (needed as the
    # chronological replay key and as corrected_entry_id's target) but has NO
    # `updated_at` and NO `version` — an entry is never mutated, only superseded
    # by a CORRECTION entry that points at it.
    fields:
      - { name: participant_id, type: string, source: system, description: "FK -> Participant.id; taken from the creation path" }
      - { name: entry_type, type: enum, source: system, description: "LOG for /log-entries, CORRECTION for /log-corrections" }
      - { name: units, type: integer, source: input, description: "Units logged by a LOG entry; > 0", default: 0 }
      - { name: units_delta, type: integer, source: input, description: "Signed adjustment carried by a CORRECTION entry; non-zero", default: 0 }
      - { name: logged_on, type: string, source: input, description: "ISO date the reading happened (LOG entries); a CORRECTION copies the logged_on of its target entry" }
      - { name: source, type: enum, source: input, description: "SELF_SERVICE | STAFF_DESK | OUTREACH_SITE — provenance of the entry" }
      - { name: corrected_entry_id, type: string, source: input, description: "FK -> ReadingLogEntry.id; the LOG entry a CORRECTION adjusts; null on LOG entries", default: null }
      - { name: note, type: string, source: input, description: "Free-text justification recorded on corrections", default: null }
      - { name: recorded_by_user_id, type: string, source: system, description: "X-User-ID of the actor that posted this entry" }

  - name: InventoryLot
    parent: null
    common_fields: true
    fields:
      - { name: branch_id, type: string, source: input, description: "FK -> Branch.id; the branch that procured and stores the lot" }
      - { name: category, type: enum, source: input, description: "PRIZE | SUPPLY" }
      - { name: sku, type: string, source: input, description: "Stock keeping unit; matched against IncentiveTier.prize_sku or Program.supply_sku" }
      - { name: description, type: string, source: input, description: "Human description of the lot contents", default: null }
      - { name: unit_cost_cents, type: integer, source: input, description: "Procured cost per unit", constraints: ">= 0" }
      - { name: quantity_procured, type: integer, source: input, description: "Units purchased into this lot; never mutated after creation", constraints: ">= 1" }
      - { name: reuse_pool, type: boolean, source: input, description: "true when other branches may draw from this lot (cross-branch reuse)" }
      - { name: quantity_reserved, type: integer, source: computed, description: "Units held by RESERVED TierAwards plus units held by supply_draw_lines of Programs with operational_status == CONFIRMED", default: 0 }
      - { name: quantity_issued, type: integer, source: computed, description: "Units consumed permanently: ISSUED TierAwards plus supply draws of Programs with operational_status == CLOSED_OUT", default: 0 }
      - { name: quantity_available, type: integer, source: computed, description: "quantity_procured - quantity_reserved - quantity_issued; never negative" }
      - { name: status, type: enum, source: computed, description: "ACTIVE while quantity_available > 0, DEPLETED when quantity_available == 0", default: "ACTIVE" }

  - name: TierAward
    parent: null
    common_fields: true
    fields:
      - { name: participant_id, type: string, source: system, description: "FK -> Participant.id; the earning reader" }
      - { name: tier_id, type: string, source: system, description: "FK -> IncentiveTier.id; the tier earned" }
      - { name: lot_id, type: string, source: system, description: "FK -> InventoryLot.id; the PRIZE lot the units were drawn from; null while status == DEFERRED", default: null }
      - { name: units, type: integer, source: system, description: "IncentiveTier.prize_units_per_participant captured at award time" }
      - { name: unit_cost_cents, type: integer, source: computed, description: "InventoryLot.unit_cost_cents captured at award time; 0 while DEFERRED", default: 0 }
      - { name: line_cost_cents, type: integer, source: computed, description: "units * unit_cost_cents; 0 while DEFERRED", default: 0 }
      - { name: transfer_surcharge_cents, type: integer, source: computed, description: "Cross-branch reuse surcharge, rounded per award (see calculation prize_award_cost)", default: 0 }
      - { name: award_total_cents, type: integer, source: computed, description: "line_cost_cents + transfer_surcharge_cents; 0 while DEFERRED", default: 0 }
      - { name: status, type: enum, source: computed, description: "RESERVED | DEFERRED | ISSUED | REVOKED | FORFEITED", default: "RESERVED" }

# =============================================================================
# §1.2 State Machine Table
# =============================================================================
state_machines:

  # ---------------------------------------------------------------- Program (1/2)
  - entity: Program
    dimension: operational_status
    initial_state: DRAFT
    terminal_states: [CLOSED_OUT, CANCELLED, WEATHER_CLOSED]
    transitions:
      - from: DRAFT
        to: SCHEDULED
        trigger: "POST /library/programs/{program_id}/schedule"
        actor: ProgramCoordinator
        preconditions:
          - "operational_status == DRAFT"
          - "end_utc > start_utc"
          - "attendance_cap >= attendance_target"
          - "delivery_mode == IN_BRANCH => at least one RoomReservation with program_id == this program and status IN {HELD, CONFIRMED} exists"
          - "delivery_mode == PARTNER_SITE => partner_type != NONE AND partner_org_name is not null AND partner_insurance_expires_on >= date(end_utc)"
        side_effects:
          - "operational_status := SCHEDULED"
        note: "PARTNER_SITE programs never hold a RoomReservation; their space gate is the partner insurance certificate instead."

      - from: SCHEDULED
        to: CONFIRMED
        trigger: "POST /library/programs/{program_id}/confirm"
        actor: ProgramManager
        preconditions:
          - "operational_status == SCHEDULED"
          - "compliance_status NOT IN {PENDING_SCREENING, BLOCKED}"
          - "delivery_mode == IN_BRANCH => exactly one RoomReservation of this program has status == CONFIRMED"
          - "branch_overlap_load (calculation branch_overlap_load) <= Branch.overlapping_program_capacity"
          - "supply_draw_allocation can satisfy attendance_target * supply_units_per_attendee units"
          - "materials_commitment_with_contingency output <= materials_budget_cents"
        side_effects:
          - "operational_status := CONFIRMED"
          - "supply_draw_lines := output of calculation supply_draw_allocation (ordered draw plan)"
          - "for each draw line: InventoryLot.quantity_reserved += line.units, InventoryLot.quantity_available recomputed, InventoryLot.status := DEPLETED when quantity_available == 0"
          - "materials_committed_cents := output of calculation materials_commitment_with_contingency; materials_available_cents recomputed"
          - "confirmed_room_capacity := effective_capacity_seats of the CONFIRMED RoomReservation (0 for PARTNER_SITE)"
          - "budget_variance_cents and budget_posture recomputed (calculation program_budget_posture)"
          - "Branch.programs_over_budget_count recomputed when budget_posture changed"

      - from: CONFIRMED
        to: SCHEDULED
        trigger: "system: cascade link 4 of compliance_status -> BLOCKED (see Presenter screening cascade)"
        actor: system
        preconditions:
          - "compliance_status transitioned to BLOCKED in this request"
          - "operational_status == CONFIRMED"
        side_effects:
          - "operational_status := SCHEDULED"
          - "for each supply_draw_lines entry: InventoryLot.quantity_reserved -= line.units, quantity_available recomputed, status := ACTIVE when quantity_available > 0"
          - "supply_draw_lines := []; materials_committed_cents := 0; materials_available_cents recomputed"
          - "the RoomReservation with status == CONFIRMED reverts to HELD; confirmed_room_capacity := 0"
          - "budget_variance_cents and budget_posture recomputed; Branch.programs_over_budget_count recomputed when budget_posture changed"

      - from: CONFIRMED
        to: CLOSED_OUT
        trigger: "POST /library/programs/{program_id}/close-out"
        actor: ProgramManager
        preconditions:
          - "operational_status == CONFIRMED"
          - "logical clock >= end_utc"
          - "verified_registrant_attendance <= registered_count"
          - "surveys_collected <= verified_registrant_attendance + drop_in_headcount"
        side_effects:
          - "operational_status := CLOSED_OUT"
          - "gross_attendance, no_show_count, attendance_attainment_funder_pct, attendance_attainment_internal_pct, survey_response_rate_pct := outputs of calculation program_attendance_attainment"
          - "materials_spent_cents += materials_committed_cents; materials_committed_cents := 0; materials_available_cents recomputed"
          - "for each supply_draw_lines entry: InventoryLot.quantity_reserved -= line.units, InventoryLot.quantity_issued += line.units (quantity_available unchanged, status unchanged)"
          - "every PresenterContract of this program with status == EXECUTED becomes COMPLETED"
          - "presenter_fee_spent_cents += presenter_fee_committed_cents; presenter_fee_committed_cents := 0"
          - "budget_variance_cents and budget_posture recomputed; Branch.programs_over_budget_count recomputed when budget_posture changed"

      - from: SCHEDULED
        to: WEATHER_CLOSED
        trigger: "POST /library/programs/{program_id}/weather-close"
        actor: ProgramManager
        preconditions:
          - "operational_status IN {SCHEDULED, CONFIRMED}"
          - "logical clock < end_utc"
        side_effects:
          - "operational_status := WEATHER_CLOSED; closure_reason := reason"
          - "CASCADE-A link 1: every PresenterContract of this program with status IN {OFFERED, COUNTERED, EXECUTED} becomes CANCELLED_WEATHER and kill_fee_cents := calculation contract_cancellation_fee (WEATHER variant)"
          - "CASCADE-A link 2 (caused by link 1): presenter_fee_committed_cents := sum of kill_fee_cents over this program's CANCELLED_WEATHER contracts"
          - "CASCADE-A link 3 (caused by link 2): budget_variance_cents recomputed and budget_posture recomputed from it"
          - "CASCADE-A link 4 (caused by link 3): Branch.programs_over_budget_count decremented when budget_posture flipped OVER_BUDGET -> WITHIN_BUDGET"
          - "every RoomReservation of this program with status IN {HELD, CONFIRMED} becomes RELEASED; confirmed_room_capacity := 0"
          - "for each supply_draw_lines entry: InventoryLot.quantity_reserved -= line.units and status := ACTIVE when quantity_available > 0; supply_draw_lines := []; materials_committed_cents := 0"

      - from: CONFIRMED
        to: WEATHER_CLOSED
        trigger: "POST /library/programs/{program_id}/weather-close"
        actor: ProgramManager
        preconditions:
          - "operational_status IN {SCHEDULED, CONFIRMED}"
          - "logical clock < end_utc"
        side_effects:
          - "identical to the SCHEDULED -> WEATHER_CLOSED side-effect list, including CASCADE-A links 1-4"

      - from: DRAFT
        to: CANCELLED
        trigger: "POST /library/programs/{program_id}/cancel"
        actor: ProgramManager
        preconditions:
          - "operational_status IN {DRAFT, SCHEDULED, CONFIRMED}"
        side_effects:
          - "operational_status := CANCELLED; closure_reason := reason"
          - "every PresenterContract of this program with status IN {DRAFT, OFFERED, COUNTERED, EXECUTED} becomes CANCELLED_LIBRARY with kill_fee_cents := calculation contract_cancellation_fee (LIBRARY variant)"
          - "presenter_fee_committed_cents := sum of kill_fee_cents over this program's CANCELLED_LIBRARY contracts; budget_variance_cents, budget_posture and Branch.programs_over_budget_count recomputed"
          - "every RoomReservation of this program with status IN {HELD, CONFIRMED} becomes RELEASED; confirmed_room_capacity := 0"
          - "supply draw returned exactly as in the WEATHER_CLOSED transition"

      - from: SCHEDULED
        to: CANCELLED
        trigger: "POST /library/programs/{program_id}/cancel"
        actor: ProgramManager
        preconditions: ["operational_status IN {DRAFT, SCHEDULED, CONFIRMED}"]
        side_effects: ["identical to the DRAFT -> CANCELLED side-effect list"]

      - from: CONFIRMED
        to: CANCELLED
        trigger: "POST /library/programs/{program_id}/cancel"
        actor: ProgramManager
        preconditions: ["operational_status IN {DRAFT, SCHEDULED, CONFIRMED}"]
        side_effects: ["identical to the DRAFT -> CANCELLED side-effect list"]

  # ---------------------------------------------------------------- Program (2/2)
  - entity: Program
    dimension: compliance_status
    initial_state: UNVERIFIED
    terminal_states: []
    transitions:
      - from: UNVERIFIED
        to: PENDING_SCREENING
        trigger: "POST /library/contracts (creating a contract for this program)"
        actor: ProgramCoordinator
        preconditions:
          - "serves_minors == true"
          - "Presenter.screening_status != ACTIVE"
        side_effects:
          - "compliance_status := PENDING_SCREENING"
        note: "operational_status is untouched: the two dimensions advance on disjoint triggers."

      - from: PENDING_SCREENING
        to: CLEARED
        trigger: "POST /library/contracts/{contract_id}/execute"
        actor: ProgramManager
        preconditions:
          - "the executing contract belongs to this program"
          - "serves_minors == false OR Presenter.screening_status == ACTIVE"
        side_effects:
          - "compliance_status := CLEARED"

      - from: UNVERIFIED
        to: CLEARED
        trigger: "POST /library/contracts/{contract_id}/execute"
        actor: ProgramManager
        preconditions:
          - "the executing contract belongs to this program"
          - "serves_minors == false OR Presenter.screening_status == ACTIVE"
        side_effects:
          - "compliance_status := CLEARED"

      - from: CLEARED
        to: BLOCKED
        trigger: "system: CASCADE-B link 3 (a PresenterContract of this program became BLOCKED)"
        actor: system
        preconditions:
          - "a PresenterContract with program_id == this program transitioned to BLOCKED in this request"
        side_effects:
          - "compliance_status := BLOCKED"
          - "CASCADE-B link 4 (caused by this link): when operational_status == CONFIRMED it reverts to SCHEDULED with the supply-draw return and reservation revert listed on that transition"

      - from: PENDING_SCREENING
        to: BLOCKED
        trigger: "system: CASCADE-B link 3 (a PresenterContract of this program became BLOCKED)"
        actor: system
        preconditions: ["a PresenterContract with program_id == this program transitioned to BLOCKED in this request"]
        side_effects: ["compliance_status := BLOCKED", "CASCADE-B link 4 as above"]

      - from: BLOCKED
        to: PENDING_SCREENING
        trigger: "system: a BLOCKED PresenterContract of this program was restored to OFFERED by a CLEARED_WITH_CONDITIONS adjudication"
        actor: system
        preconditions: ["a PresenterContract with program_id == this program transitioned BLOCKED -> OFFERED in this request"]
        side_effects:
          - "compliance_status := PENDING_SCREENING"
        note: "The program must be re-executed and re-confirmed; the restore never returns it straight to CLEARED."

  # ---------------------------------------------------------------- RoomReservation
  - entity: RoomReservation
    initial_state: HELD
    terminal_states: [RELEASED, SUPERSEDED]
    transitions:
      - from: HELD
        to: CONFIRMED
        trigger: "POST /library/reservations/{reservation_id}/confirm"
        actor: ProgramCoordinator
        preconditions:
          - "status == HELD"
          - "Program.operational_status IN {DRAFT, SCHEDULED}"
          - "Room.status == AVAILABLE"
          - "no other RoomReservation on the same room_id with status IN {HELD, CONFIRMED} has an occupancy interval overlapping this one (calculation room_occupancy_interval)"
        side_effects:
          - "status := CONFIRMED"
          - "Program.confirmed_room_capacity := effective_capacity_seats"

      - from: HELD
        to: SUPERSEDED
        trigger: "system: a newer RoomReservation was created for the same program_id"
        actor: system
        preconditions:
          - "status == HELD"
          - "a POST /library/programs/{program_id}/reservations for the same program succeeded in this request"
        side_effects:
          - "status := SUPERSEDED"
        note: "Only HELD reservations are superseded; a CONFIRMED reservation blocks the create with ERR_RESERVATION_STATE_INVALID."

      - from: HELD
        to: RELEASED
        trigger: "system: owning Program became WEATHER_CLOSED or CANCELLED"
        actor: system
        preconditions: ["status IN {HELD, CONFIRMED}", "Program.operational_status IN {WEATHER_CLOSED, CANCELLED}"]
        side_effects: ["status := RELEASED", "Program.confirmed_room_capacity := 0"]

      - from: CONFIRMED
        to: RELEASED
        trigger: "system: owning Program became WEATHER_CLOSED or CANCELLED"
        actor: system
        preconditions: ["status IN {HELD, CONFIRMED}", "Program.operational_status IN {WEATHER_CLOSED, CANCELLED}"]
        side_effects: ["status := RELEASED", "Program.confirmed_room_capacity := 0"]

      - from: CONFIRMED
        to: HELD
        trigger: "system: owning Program reverted CONFIRMED -> SCHEDULED (CASCADE-B link 4)"
        actor: system
        preconditions: ["status == CONFIRMED", "Program.operational_status transitioned CONFIRMED -> SCHEDULED in this request"]
        side_effects: ["status := HELD", "Program.confirmed_room_capacity := 0"]
        note: "Revert edge: the room stays occupied (HELD still blocks overlapping bookings) but no longer satisfies the confirm gate."

  # ---------------------------------------------------------------- PresenterContract (cyclic)
  - entity: PresenterContract
    initial_state: DRAFT
    terminal_states: [COMPLETED, CANCELLED_WEATHER, CANCELLED_LIBRARY]
    transitions:
      - from: DRAFT
        to: OFFERED
        trigger: "POST /library/contracts/{contract_id}/offer"
        actor: ProgramCoordinator
        preconditions:
          - "status IN {DRAFT, COUNTERED}"
          - "negotiation_round < MAX_NEGOTIATION_ROUNDS"
          - "Presenter.engagement_status != SUSPENDED"
          - "Program.operational_status IN {DRAFT, SCHEDULED}"
        side_effects:
          - "status := OFFERED; offered_fee_cents := offered_fee_cents input; negotiation_round += 1"
          - "offered_by_user_id := X-User-ID of this request (overwritten on every offer)"

      - from: OFFERED
        to: COUNTERED
        trigger: "POST /library/contracts/{contract_id}/counter"
        actor: ProgramCoordinator
        preconditions:
          - "status == OFFERED"
          - "Presenter.engagement_status != SUSPENDED"
        side_effects:
          - "status := COUNTERED; countered_fee_cents := countered_fee_cents input"

      - from: COUNTERED
        to: OFFERED
        trigger: "POST /library/contracts/{contract_id}/offer (next negotiation round)"
        actor: ProgramCoordinator
        preconditions:
          - "status IN {DRAFT, COUNTERED}"
          - "negotiation_round < MAX_NEGOTIATION_ROUNDS"
          - "Presenter.engagement_status != SUSPENDED"
        side_effects:
          - "status := OFFERED; offered_fee_cents := offered_fee_cents input; negotiation_round += 1; offered_by_user_id := X-User-ID"
        note: "The OFFERED -> COUNTERED -> OFFERED loop is the cycle; MAX_NEGOTIATION_ROUNDS (3) is the termination condition, enforced as ERR_NEGOTIATION_ROUNDS_EXHAUSTED on the 4th offer."

      - from: OFFERED
        to: EXECUTED
        trigger: "POST /library/contracts/{contract_id}/execute"
        actor: ProgramManager
        preconditions:
          - "status == OFFERED"
          - "X-User-ID != offered_by_user_id (segregation of duties)"
          - "Presenter.engagement_status != SUSPENDED"
          - "Program.serves_minors == false OR Presenter.screening_status == ACTIVE"
          - "Presenter.insurance_certificate_expires_on >= date(Program.end_utc)"
          - "no other PresenterContract of the same presenter with status IN {EXECUTED, COMPLETED} has an engagement window overlapping this program's (calculation presenter_engagement_window)"
          - "Program.operational_status IN {DRAFT, SCHEDULED}"
          - "total_fee_cents (calculation contract_total_fee) <= min(PROGRAM_FEE_CAP_CENTS, Branch.per_program_fee_cap_cents)"
        side_effects:
          - "agreed_fee_cents := offered_fee_cents; travel_fee_cents, escort_fee_cents, insurance_rider_fee_cents, weekend_premium_cents, total_fee_cents := outputs of calculation contract_total_fee"
          - "status := EXECUTED; executed_by_user_id := X-User-ID"
          - "Presenter.executed_contract_count += 1; Presenter.engagement_status := ACTIVE"
          - "Program.compliance_status := CLEARED"
          - "Program.presenter_fee_committed_cents += total_fee_cents; budget_variance_cents and budget_posture recomputed (calculation program_budget_posture)"
          - "Branch.programs_over_budget_count incremented when budget_posture flipped WITHIN_BUDGET -> OVER_BUDGET"

      - from: EXECUTED
        to: BLOCKED
        trigger: "system: CASCADE-B link 2 (presenter became SUSPENDED)"
        actor: system
        preconditions: ["status IN {OFFERED, COUNTERED, EXECUTED}", "Presenter.engagement_status transitioned to SUSPENDED in this request"]
        side_effects:
          - "status := BLOCKED"
          - "Program.presenter_fee_committed_cents -= total_fee_cents (the blocked fee is no longer committed)"
          - "CASCADE-B link 3 (caused by this link): Program.compliance_status := BLOCKED"

      - from: OFFERED
        to: BLOCKED
        trigger: "system: CASCADE-B link 2 (presenter became SUSPENDED)"
        actor: system
        preconditions: ["status IN {OFFERED, COUNTERED, EXECUTED}", "Presenter.engagement_status transitioned to SUSPENDED in this request"]
        side_effects: ["status := BLOCKED", "CASCADE-B link 3: Program.compliance_status := BLOCKED"]

      - from: COUNTERED
        to: BLOCKED
        trigger: "system: CASCADE-B link 2 (presenter became SUSPENDED)"
        actor: system
        preconditions: ["status IN {OFFERED, COUNTERED, EXECUTED}", "Presenter.engagement_status transitioned to SUSPENDED in this request"]
        side_effects: ["status := BLOCKED", "CASCADE-B link 3: Program.compliance_status := BLOCKED"]

      - from: BLOCKED
        to: OFFERED
        trigger: "system: a CLEARED_WITH_CONDITIONS adjudication restored the presenter"
        actor: system
        preconditions: ["status == BLOCKED", "Presenter.screening_decision transitioned FLAGGED -> CLEARED_WITH_CONDITIONS in this request"]
        side_effects:
          - "status := OFFERED; negotiation_round unchanged; offered_by_user_id unchanged"
          - "Program.compliance_status := PENDING_SCREENING"
        note: "A restored contract must be executed again; total_fee_cents stays 0 until then."

      - from: EXECUTED
        to: COMPLETED
        trigger: "system: owning Program reached CLOSED_OUT"
        actor: system
        preconditions: ["status == EXECUTED", "Program.operational_status == CLOSED_OUT"]
        side_effects: ["status := COMPLETED"]

      - from: EXECUTED
        to: CANCELLED_WEATHER
        trigger: "system: CASCADE-A link 1 (owning Program became WEATHER_CLOSED)"
        actor: system
        preconditions: ["status IN {OFFERED, COUNTERED, EXECUTED}", "Program.operational_status == WEATHER_CLOSED"]
        side_effects:
          - "status := CANCELLED_WEATHER; kill_fee_cents := calculation contract_cancellation_fee (WEATHER variant)"
          - "CASCADE-A link 2 (caused by this link): Program.presenter_fee_committed_cents := sum of kill_fee_cents over the program's cancelled contracts"

      - from: OFFERED
        to: CANCELLED_WEATHER
        trigger: "system: CASCADE-A link 1 (owning Program became WEATHER_CLOSED)"
        actor: system
        preconditions: ["status IN {OFFERED, COUNTERED, EXECUTED}", "Program.operational_status == WEATHER_CLOSED"]
        side_effects: ["status := CANCELLED_WEATHER; kill_fee_cents := 0 because total_fee_cents == 0 for a contract that was never executed"]

      - from: EXECUTED
        to: CANCELLED_LIBRARY
        trigger: "system: owning Program became CANCELLED"
        actor: system
        preconditions: ["status IN {DRAFT, OFFERED, COUNTERED, EXECUTED}", "Program.operational_status == CANCELLED"]
        side_effects:
          - "status := CANCELLED_LIBRARY; kill_fee_cents := calculation contract_cancellation_fee (LIBRARY variant)"
          - "Program.presenter_fee_committed_cents := sum of kill_fee_cents over the program's cancelled contracts; budget_posture and Branch.programs_over_budget_count recomputed"

      - from: DRAFT
        to: CANCELLED_LIBRARY
        trigger: "system: owning Program became CANCELLED"
        actor: system
        preconditions: ["status IN {DRAFT, OFFERED, COUNTERED, EXECUTED}", "Program.operational_status == CANCELLED"]
        side_effects: ["status := CANCELLED_LIBRARY; kill_fee_cents := 0 (total_fee_cents == 0)"]

  # ---------------------------------------------------------------- Presenter (screening dimension, cyclic)
  - entity: Presenter
    dimension: screening_decision
    initial_state: NONE
    terminal_states: []
    transitions:
      - from: NONE
        to: PENDING
        trigger: "POST /library/presenters/{presenter_id}/screening-requests"
        actor: ScreeningOfficer
        preconditions:
          - "screening_status IN {NONE, EXPIRED, BLOCKED}"
        side_effects:
          - "screening_decision := PENDING; screening_tier := screening_tier input; screening_decided_on := null; screening_valid_until := null"
          - "screening_status recomputed to PENDING"

      - from: DENIED
        to: PENDING
        trigger: "POST /library/presenters/{presenter_id}/screening-requests (re-screen after a denial or an expiry)"
        actor: ScreeningOfficer
        preconditions: ["screening_status IN {NONE, EXPIRED, BLOCKED}"]
        side_effects: ["screening_decision := PENDING; screening_tier := screening_tier input; screening_valid_until := null"]
        note: "This edge plus CLEAR -> (clock past screening_valid_until) -> EXPIRED -> PENDING closes the screening cycle."

      - from: CLEAR
        to: PENDING
        trigger: "POST /library/presenters/{presenter_id}/screening-requests (renewal once screening_status == EXPIRED)"
        actor: ScreeningOfficer
        preconditions: ["screening_status == EXPIRED"]
        side_effects: ["screening_decision := PENDING; screening_tier := screening_tier input; screening_valid_until := null"]

      - from: PENDING
        to: CLEAR
        trigger: "POST /library/presenters/{presenter_id}/screening-results with result == CLEAR"
        actor: ScreeningOfficer
        preconditions: ["screening_decision == PENDING"]
        side_effects:
          - "screening_decision := CLEAR; screening_decided_on := decided_on input"
          - "screening_valid_until := output of calculation screening_validity_window"
          - "screening_status recomputed (ACTIVE while the clock date <= screening_valid_until)"

      - from: PENDING
        to: FLAGGED
        trigger: "POST /library/presenters/{presenter_id}/screening-results with result == FLAGGED"
        actor: ScreeningOfficer
        preconditions: ["screening_decision == PENDING"]
        side_effects:
          - "screening_decision := FLAGGED; screening_decided_on := decided_on input; screening_valid_until := null; screening_status := PENDING_ADJUDICATION"
          - "CASCADE-B link 1: engagement_status := SUSPENDED"
          - "CASCADE-B link 2 (caused by link 1): every PresenterContract of this presenter with status IN {OFFERED, COUNTERED, EXECUTED} becomes BLOCKED"
          - "CASCADE-B links 3-4 follow on those contracts (see PresenterContract and Program compliance_status)"

      - from: FLAGGED
        to: CLEARED_WITH_CONDITIONS
        trigger: "POST /library/presenters/{presenter_id}/adjudications with decision == CLEARED_WITH_CONDITIONS"
        actor: ScreeningOfficer
        preconditions: ["screening_decision == FLAGGED"]
        side_effects:
          - "screening_decision := CLEARED_WITH_CONDITIONS; screening_decided_on := decided_on input; screening_valid_until := output of calculation screening_validity_window; screening_status recomputed to ACTIVE"
          - "engagement_status := ACTIVE when executed_contract_count > 0, else PROSPECT"
          - "every PresenterContract of this presenter with status == BLOCKED is restored to OFFERED; each such contract's Program.compliance_status := PENDING_SCREENING"

      - from: FLAGGED
        to: DENIED
        trigger: "POST /library/presenters/{presenter_id}/adjudications with decision == DENIED"
        actor: ScreeningOfficer
        preconditions: ["screening_decision == FLAGGED"]
        side_effects:
          - "screening_decision := DENIED; screening_decided_on := decided_on input; screening_valid_until := null; screening_status := BLOCKED"
          - "engagement_status stays SUSPENDED; contracts already BLOCKED by the FLAGGED result stay BLOCKED"

  # ---------------------------------------------------------------- Presenter (engagement dimension)
  - entity: Presenter
    dimension: engagement_status
    initial_state: PROSPECT
    terminal_states: []
    transitions:
      - from: PROSPECT
        to: ACTIVE
        trigger: "POST /library/contracts/{contract_id}/execute (first executed contract)"
        actor: ProgramManager
        preconditions: ["engagement_status IN {PROSPECT, ACTIVE}", "the execute transition succeeded"]
        side_effects: ["engagement_status := ACTIVE", "executed_contract_count += 1"]
        note: "Independent of the screening dimension: a presenter can be ACTIVE with screening_decision == NONE as long as no program serves minors."

      - from: ACTIVE
        to: SUSPENDED
        trigger: "POST /library/presenters/{presenter_id}/screening-results (FLAGGED) or /adjudications (DENIED)"
        actor: ScreeningOfficer
        preconditions: ["screening_decision transitions to FLAGGED or DENIED"]
        side_effects: ["engagement_status := SUSPENDED", "CASCADE-B link 2 fires on the presenter's contracts"]

      - from: PROSPECT
        to: SUSPENDED
        trigger: "POST /library/presenters/{presenter_id}/screening-results with result == FLAGGED before any contract was executed"
        actor: ScreeningOfficer
        preconditions: ["screening_decision transitions to FLAGGED"]
        side_effects: ["engagement_status := SUSPENDED"]

      - from: SUSPENDED
        to: ACTIVE
        trigger: "POST /library/presenters/{presenter_id}/adjudications with decision == CLEARED_WITH_CONDITIONS and executed_contract_count > 0"
        actor: ScreeningOfficer
        preconditions: ["engagement_status == SUSPENDED", "executed_contract_count > 0"]
        side_effects: ["engagement_status := ACTIVE"]

      - from: SUSPENDED
        to: PROSPECT
        trigger: "POST /library/presenters/{presenter_id}/adjudications with decision == CLEARED_WITH_CONDITIONS and executed_contract_count == 0"
        actor: ScreeningOfficer
        preconditions: ["engagement_status == SUSPENDED", "executed_contract_count == 0"]
        side_effects: ["engagement_status := PROSPECT"]

  # ---------------------------------------------------------------- ReadingChallenge
  - entity: ReadingChallenge
    initial_state: PLANNING
    terminal_states: [RECONCILED]
    transitions:
      - from: PLANNING
        to: OPEN
        trigger: "POST /library/reading-challenges/{challenge_id}/open"
        actor: ProgramManager
        preconditions:
          - "status == PLANNING"
          - "at least one IncentiveTier exists for this challenge"
          - "the challenge's tiers form a gap-free ascending ladder starting at tier_index 1"
        side_effects:
          - "status := OPEN"
          - "the tier ladder is locked: POST /library/reading-challenges/{challenge_id}/incentive-tiers is rejected with ERR_CHALLENGE_STATE_INVALID once status != PLANNING"

      - from: OPEN
        to: RECONCILED
        trigger: "POST /library/reading-challenges/{challenge_id}/reconcile"
        actor: ProgramManager
        preconditions:
          - "status == OPEN"
          - "clock date > end_on (the logging window must be closed)"
        side_effects:
          - "status := RECONCILED"
          - "every TierAward of this challenge with status == DEFERRED becomes FORFEITED; prize_committed_cents decreases by each forfeited award's award_total_cents"
          - "every TierAward with status == RESERVED becomes ISSUED; prize_committed_cents decreases and prize_spent_cents increases by each issued award's award_total_cents"
          - "each issuing InventoryLot moves the award's quantity from quantity_reserved to quantity_issued; each forfeiting lot moves it back to quantity_available and any lot whose status was DEPLETED returns to ACTIVE when quantity_available > 0"
          - "participant_count and deferred_award_count refreshed from the challenge's Participants and TierAwards; prize_available_cents recomputed"

  # ---------------------------------------------------------------- TierAward
  - entity: TierAward
    initial_state: RESERVED
    terminal_states: [ISSUED, REVOKED, FORFEITED]
    transitions:
      - from: RESERVED
        to: ISSUED
        trigger: "system: owning ReadingChallenge reached RECONCILED"
        actor: system
        preconditions: ["status == RESERVED", "ReadingChallenge.status == RECONCILED"]
        side_effects:
          - "status := ISSUED"
          - "InventoryLot.quantity_reserved -= 1; InventoryLot.quantity_issued += 1"
          - "ReadingChallenge.prize_committed_cents -= award_total_cents; prize_spent_cents += award_total_cents"

      - from: DEFERRED
        to: RESERVED
        trigger: "system: an InventoryLot of the tier's prize_sku regained availability (a REVOKED or FORFEITED award released a unit, or a new lot was procured)"
        actor: system
        preconditions: ["status == DEFERRED", "some ACTIVE InventoryLot with matching prize_sku and branch has quantity_available > 0"]
        side_effects:
          - "status := RESERVED; lot_id := the promoted lot; award_total_cents recomputed (calculation prize_award_cost) from that lot's unit_cost_cents"
          - "InventoryLot.quantity_available -= 1; quantity_reserved += 1; lot becomes DEPLETED when quantity_available reaches 0"
          - "ReadingChallenge.prize_committed_cents += award_total_cents"
        note: "Promotion order is created_at ASC over the challenge's DEFERRED awards, never id order; exactly as many awards are promoted as there are freed units."

      - from: RESERVED
        to: REVOKED
        trigger: "system: a log correction dropped the participant's progress below the tier threshold (CASCADE-D link 2)"
        actor: system
        preconditions: ["status IN {RESERVED, DEFERRED}", "Participant.cumulative_units < IncentiveTier.threshold_units after the correction"]
        side_effects:
          - "status := REVOKED"
          - "CASCADE-D link 3: InventoryLot.quantity_reserved -= 1; quantity_available += 1; a DEPLETED lot returns to ACTIVE"
          - "CASCADE-D link 4: ReadingChallenge.prize_committed_cents -= award_total_cents"
          - "Participant.awarded_tier_index recomputed as the highest tier_index still held; IncentiveTier.award_count -= 1"

      - from: DEFERRED
        to: REVOKED
        trigger: "system: a log correction dropped the participant's progress below the tier threshold (CASCADE-D link 2)"
        actor: system
        preconditions: ["status IN {RESERVED, DEFERRED}", "Participant.cumulative_units < IncentiveTier.threshold_units after the correction"]
        side_effects:
          - "status := REVOKED"
          - "no inventory movement: a DEFERRED award never held a reserved unit"
          - "ReadingChallenge.prize_committed_cents unchanged (a DEFERRED award commits nothing)"
          - "Participant.awarded_tier_index and IncentiveTier.deferred_count recomputed; ReadingChallenge.deferred_award_count -= 1"

      - from: DEFERRED
        to: FORFEITED
        trigger: "system: owning ReadingChallenge reached RECONCILED with the award still unfilled"
        actor: system
        preconditions: ["status == DEFERRED", "ReadingChallenge.status == RECONCILED"]
        side_effects: ["status := FORFEITED", "no inventory or budget movement; ReadingChallenge.deferred_award_count -= 1"]

  # ---------------------------------------------------------------- InventoryLot
  - entity: InventoryLot
    initial_state: ACTIVE
    terminal_states: []
    transitions:
      - from: ACTIVE
        to: DEPLETED
        trigger: "system: a reservation or supply draw took quantity_available to 0"
        actor: system
        preconditions: ["status == ACTIVE", "quantity_available reached 0 in this request"]
        side_effects:
          - "status := DEPLETED"
          - "CASCADE-C link 4 (prize lots only): ReadingChallenge.prize_inventory_posture := CONSTRAINED when no ACTIVE lot with drawable units remains for at least one of the challenge's tiers"

      - from: DEPLETED
        to: ACTIVE
        trigger: "system: a released unit or a supply return took quantity_available above 0"
        actor: system
        preconditions: ["status == DEPLETED", "quantity_available > 0 after this request"]
        side_effects:
          - "status := ACTIVE"
          - "ReadingChallenge.prize_inventory_posture := AMPLE when every tier of the challenge again has at least one drawable ACTIVE lot"
          - "any DEFERRED TierAward for this lot's prize_sku and branch is promoted (created_at ASC) up to the number of freed units"

# =============================================================================
# §1.2.1 Concurrency rules
# =============================================================================
concurrency_rules:
  - rule_id: reservation-create-stale-program
    parent_entity: Program
    child_entity: RoomReservation
    write_endpoint: "POST /library/programs/{program_id}/reservations"
    occ_field: expected_program_version
    error_id: ERR_STALE_PROGRAM_VERSION
    status: 412
    description: >-
      Room reservations are created against a Program whose window and accessibility profile
      determine the setup and teardown buffers. A caller must echo the Program.version it read
      when it computed the requested window. If any earlier write in the same session moved the
      program (a reschedule, a registration that changed effective capacity, or a contract
      execution that changed the committed fee), the echoed value is behind and the reservation
      is rejected with ERR_STALE_PROGRAM_VERSION.
    legitimate_overwrite: >-
      Creating a second reservation for the same Program with the current version is legitimate:
      the prior HELD reservation for that program is moved to SUPERSEDED and the new one becomes
      the program's HELD reservation. Only a CONFIRMED reservation blocks a replacement.
    version_increment: "Program.version increments by 1 on every accepted reservation create."

  - rule_id: correction-post-stale-participant
    parent_entity: Participant
    child_entity: ReadingLogEntry
    write_endpoint: "POST /library/participants/{participant_id}/log-corrections"
    occ_field: expected_participant_version
    error_id: ERR_STALE_PARTICIPANT_VERSION
    status: 412
    description: >-
      A correction rewrites a previously accepted log entry and can retract tier awards, so the
      caller must echo the Participant.version it read when it chose the target entry. If a log
      entry was accepted for that participant after the read, the echoed version is behind and
      the correction is rejected with ERR_STALE_PARTICIPANT_VERSION before any target validation
      runs.
    legitimate_overwrite: >-
      A second correction against the same original entry with the current version is legitimate
      and supersedes the first correction's arithmetic; corrections are chained through
      ReadingLogEntry.corrected_entry_id, never edited in place.
    version_increment: "Participant.version increments by 1 on every accepted correction and on every accepted log entry."

# =============================================================================
# §1.3 Calculation Rules Table
# =============================================================================
calculations:

  # ------------------------------------------------------------------ 1
  - name: contract_total_fee
    trigger: "POST /library/contracts/{contract_id}/execute, before the fee-cap validation runs"
    algorithm: tiered_pricing
    formula: |
      # every intermediate is integer cents; the steps are strictly ordered
      step 1  base_cents := PresenterContract.offered_fee_cents   # the standing OFFERED amount, never countered_fee_cents
      step 2  travel_fee_cents := tiered mileage over PresenterContract.round_trip_miles:
                  billable_1 := max(0, min(round_trip_miles, MILEAGE_TIER1_LIMIT_MILES) - MILEAGE_FREE_MILES)
                  billable_2 := max(0, round_trip_miles - MILEAGE_TIER1_LIMIT_MILES)
                  travel_fee_cents := billable_1 * MILEAGE_TIER1_RATE_CENTS + billable_2 * MILEAGE_TIER2_RATE_CENTS
      step 3  escort_fee_cents := MINORS_ESCORT_FEE_CENTS if Program.serves_minors else 0
      step 4  rider_needed := Presenter.insurance_certificate_expires_on
                              < date(Program.end_utc) + INSURANCE_RIDER_WINDOW_DAYS
              insurance_rider_fee_cents := INSURANCE_RIDER_FEE_CENTS if rider_needed else 0
      step 5  subtotal_cents := base_cents + travel_fee_cents + escort_fee_cents + insurance_rider_fee_cents
      step 6  is_weekend := weekday(Program.start_utc, UTC) IN {SATURDAY, SUNDAY}
              weekend_premium_cents := round_half_up(subtotal_cents * WEEKEND_PREMIUM_RATE) if is_weekend else 0
      step 7  total_fee_cents := subtotal_cents + weekend_premium_cents
      # NOTE: total_fee_cents is never clamped. Exceeding the cap is a rejection
      # (ERR_FEE_CAP_EXCEEDED, priority 45), not a silent truncation.
    input_set: >-
      One contract at a time. Reads the contract's own offered_fee_cents and round_trip_miles, the owning
      Program's serves_minors / start_utc / end_utc, and the Presenter's insurance_certificate_expires_on.
      countered_fee_cents is never an input to the payable total.
    constants:
      MILEAGE_FREE_MILES: 20
      MILEAGE_TIER1_LIMIT_MILES: 60
      MILEAGE_TIER1_RATE_CENTS: 65
      MILEAGE_TIER2_RATE_CENTS: 45
      MINORS_ESCORT_FEE_CENTS: 4000
      INSURANCE_RIDER_FEE_CENTS: 2500
      INSURANCE_RIDER_WINDOW_DAYS: 30
      WEEKEND_PREMIUM_RATE: 0.10
      # System-wide payable ceiling, consumed by validation priority 45
      # (ERR_FEE_CAP_EXCEEDED) as min(PROGRAM_FEE_CAP_CENTS, Branch.per_program_fee_cap_cents).
      # It never participates in the arithmetic above.
      PROGRAM_FEE_CAP_CENTS: 250000
    precision: "integer cents; the single rounding happens at step 6, round_half_up"
    worked_example: >-
      offered_fee_cents 90000, round_trip_miles 75, serves_minors true, certificate expiring inside the
      30-day window, Program.start_utc 2026-08-15T14:00:00.000Z (a Saturday):
      travel = (60-20)*65 + (75-60)*45 = 2600 + 675 = 3275; escort = 4000; rider = 2500;
      subtotal = 99775; weekend premium = round_half_up(9977.5) = 9978; total_fee_cents = 109753.
      Applying the premium to base_cents alone (9000) would yield 108775 — the step order is observable.
      Boundary mileage values: 20 mi -> 0, 21 mi -> 65, 60 mi -> 2600, 61 mi -> 2645.

  # ------------------------------------------------------------------ 2
  - name: contract_cancellation_fee
    trigger: "system, while a Program transitions to WEATHER_CLOSED or CANCELLED and its contracts are cancelled"
    algorithm: threshold
    formula: |
      if PresenterContract.total_fee_cents == 0:           # never executed
          kill_fee_cents := 0
      else if cause == WEATHER:
          hours_notice := (Program.start_utc - clock_now_utc) / 3600
          kill_fee_cents := round_half_up(total_fee_cents * WEATHER_KILL_FEE_RATE)
                            if hours_notice <= WEATHER_KILL_FEE_WINDOW_HOURS else 0
      else:                                                # cause == LIBRARY (voluntary cancellation)
          days_notice := date(Program.start_utc) - date(clock_now_utc)   # whole calendar days
          kill_fee_cents := total_fee_cents
                            if days_notice < LIBRARY_CANCEL_LATE_WINDOW_DAYS
                            else round_half_up(total_fee_cents * LIBRARY_CANCEL_EARLY_RATE)
    input_set: "Contracts of the cancelled Program with status IN {OFFERED, COUNTERED, EXECUTED}; DRAFT and already-cancelled contracts are skipped."
    constants:
      WEATHER_KILL_FEE_RATE: 0.50
      WEATHER_KILL_FEE_WINDOW_HOURS: 48
      LIBRARY_CANCEL_LATE_WINDOW_DAYS: 14
      LIBRARY_CANCEL_EARLY_RATE: 0.25
    precision: "integer cents, round_half_up"
    worked_example: >-
      total_fee_cents 109753 weather-closed 12 hours out -> round_half_up(54876.5) = 54877;
      the same contract weather-closed 72 hours out -> 0.
      total_fee_cents 99775 library-cancelled 3 days out -> 99775 (full liability);
      the same contract library-cancelled 30 days out -> round_half_up(24943.75) = 24944.
      Exactly 48.0 hours of weather notice still charges the kill fee (<=), and exactly
      14 days of library notice takes the early rate (< is strict).

  # ------------------------------------------------------------------ 3
  - name: presenter_engagement_window
    trigger: "POST /library/contracts/{contract_id}/execute, as a cross-contract conflict check"
    algorithm: interval_merge
    formula: |
      engagement_window(contract) :=
          [ Program.start_utc - PRESENTER_TRAVEL_BUFFER_MINUTES,
            Program.end_utc   + PRESENTER_TRAVEL_BUFFER_MINUTES ]        # CLOSED on both ends
      conflict := EXISTS other contract of the same presenter with
                  status IN {EXECUTED, COMPLETED} and
                  engagement_window(other) intersects engagement_window(candidate)
      # Closed-interval semantics: windows that merely touch DO conflict.
      # a.end == b.start  ->  conflict (ERR_PRESENTER_DOUBLE_BOOKED)
    input_set: "The presenter's contracts with status IN {EXECUTED, COMPLETED}; BLOCKED, cancelled, DRAFT, OFFERED and COUNTERED contracts hold no window."
    constants:
      PRESENTER_TRAVEL_BUFFER_MINUTES: 90
    precision: "whole minutes; buffers are symmetric on both ends"
    worked_example: >-
      Program A 2026-08-12T14:00:00.000Z..15:00:00.000Z gives window 12:30..16:30.
      Program B starting 2026-08-12T16:30:00.000Z has window 15:00..18:30 — the windows touch at 16:30
      and also genuinely overlap, so B is rejected. Program C starting 2026-08-12T18:00:00.000Z has
      window 16:30..19:30, which touches A's window at exactly 16:30 and is therefore ALSO rejected —
      this is where the closed-interval rule differs from the room rule.

  # ------------------------------------------------------------------ 4
  - name: screening_validity_window
    trigger: "POST /library/presenters/{presenter_id}/screening-results and /adjudications; re-derived on every read of Presenter.screening_status"
    algorithm: threshold
    formula: |
      validity_days := SCREENING_VALIDITY_DAYS_NAME_CHECK  if screening_tier == NAME_CHECK
                       else SCREENING_VALIDITY_DAYS_FINGERPRINT
      screening_valid_until := screening_decided_on + validity_days   # calendar days, ISO date
      screening_status :=
          NONE                  if screening_decision == NONE
          PENDING               if screening_decision == PENDING
          PENDING_ADJUDICATION  if screening_decision == FLAGGED
          BLOCKED               if screening_decision == DENIED
          ACTIVE                if screening_decision IN {CLEAR, CLEARED_WITH_CONDITIONS}
                                   and date(clock_now_utc) <= screening_valid_until
          EXPIRED               if screening_decision IN {CLEAR, CLEARED_WITH_CONDITIONS}
                                   and date(clock_now_utc) >  screening_valid_until
    input_set: "The presenter's single stored screening decision; there is no screening history entity — a re-screen overwrites the decision fields."
    constants:
      SCREENING_VALIDITY_DAYS_NAME_CHECK: 365
      SCREENING_VALIDITY_DAYS_FINGERPRINT: 730
    precision: "whole calendar days on ISO dates; comparison is date-level, not instant-level"
    worked_example: >-
      NAME_CHECK decided 2026-06-01 -> screening_valid_until 2027-06-01; with the clock exactly at
      2027-06-01T23:59:59.000Z the status is still ACTIVE, and at 2027-06-02T00:00:00.000Z it is EXPIRED.
      FINGERPRINT decided 2026-06-01 -> 2028-05-31 (730 days across the 2028 leap day).

  # ------------------------------------------------------------------ 5
  - name: room_occupancy_interval
    trigger: "POST /library/programs/{program_id}/reservations and POST /library/reservations/{reservation_id}/confirm"
    algorithm: interval_merge
    formula: |
      occupancy_start_utc := RoomReservation.start_utc - setup_minutes        # asymmetric buffers
      occupancy_end_utc   := RoomReservation.end_utc   + teardown_minutes
      occupancy(reservation) := [occupancy_start_utc, occupancy_end_utc)      # HALF-OPEN, end exclusive
      conflict := EXISTS other reservation of the SAME room with
                  status IN {HELD, CONFIRMED} and
                  occupancy(other) intersects occupancy(candidate)
      # Half-open semantics: back-to-back bookings are legal.
      # a.occupancy_end == b.occupancy_start  ->  NO conflict
      required_setup := max(Room.min_setup_minutes,
                            ACCESSIBLE_SETUP_MINUTES if Program.accessibility_accommodations is non-empty else 0)
      required_teardown := Room.min_teardown_minutes
      # setup_minutes < required_setup or teardown_minutes < required_teardown -> ERR_SETUP_BUFFER_TOO_SHORT
    input_set: "Reservations of the same room_id with status IN {HELD, CONFIRMED}; RELEASED and SUPERSEDED reservations are invisible to the check."
    constants:
      ACCESSIBLE_SETUP_MINUTES: 30
    precision: "whole minutes; interval arithmetic on UTC instants"
    worked_example: >-
      Reservation A 2026-08-15T13:30:00.000Z..16:15:00.000Z with setup 30 and teardown 15 occupies
      13:00..16:30. Reservation B occupying 16:30..18:00 is accepted (adjacency allowed). Reservation C
      occupying 16:29..18:00 is rejected with ERR_ROOM_DOUBLE_BOOKED. A program carrying
      WHEELCHAIR_LAYOUT in a room whose min_setup_minutes is 10 must claim setup_minutes >= 30.

  # ------------------------------------------------------------------ 6
  - name: room_effective_capacity
    trigger: "POST /library/programs/{program_id}/reservations (stored on the reservation) and re-read at close-out"
    algorithm: threshold
    formula: |
      if "WHEELCHAIR_LAYOUT" IN Program.accessibility_accommodations:
          effective_capacity_seats := floor(Room.capacity_seats * (1 - WHEELCHAIR_LAYOUT_SEAT_LOSS_RATE))
      else:
          effective_capacity_seats := Room.capacity_seats
      # the registration ceiling is the tighter of the program cap and the confirmed room
      registration_ceiling := min(Program.attendance_cap, Program.confirmed_room_capacity)
                              if Program.confirmed_room_capacity > 0 else Program.attendance_cap
    input_set: "The reserved Room and the owning Program's accessibility_accommodations at reservation time; later edits to the room's capacity_seats do not retro-adjust a stored reservation."
    constants:
      WHEELCHAIR_LAYOUT_SEAT_LOSS_RATE: 0.15
    precision: "integer seats, floor (never round up — the lost seats are physically unavailable)"
    worked_example: >-
      capacity_seats 60 with WHEELCHAIR_LAYOUT -> floor(51.0) = 51; capacity_seats 61 -> floor(51.85) = 51.
      With attendance_cap 55 and a CONFIRMED reservation of 51 seats the 52nd registration is rejected
      with ERR_PROGRAM_AT_CAPACITY even though the program cap has room.

  # ------------------------------------------------------------------ 7
  - name: branch_overlap_load
    trigger: "POST /library/programs/{program_id}/confirm"
    algorithm: aggregation
    formula: |
      public_window(program) := [start_utc, end_utc]                    # CLOSED on both ends, no buffers
      peers := Programs of the same branch_id with
               operational_status == CONFIRMED and
               public_window(peer) intersects public_window(candidate)
      overlap_load := count(peers) + 1                                  # the candidate counts itself
      # overlap_load > Branch.overlapping_program_capacity -> ERR_BRANCH_STAFFING_CAPACITY_EXCEEDED
    input_set: >-
      Programs of the same branch with operational_status == CONFIRMED only. DRAFT, SCHEDULED,
      CLOSED_OUT, CANCELLED and WEATHER_CLOSED programs consume no staffing. PARTNER_SITE programs
      are included — outreach still consumes branch staff.
    constants: {}
    precision: "integer count; this is an aggregate ceiling, not a pairwise check"
    worked_example: >-
      Branch.overlapping_program_capacity 2. Programs P1 09:00..11:00 and P2 10:00..12:00 confirm
      successfully (loads 1 and 2). P3 10:30..11:30 computes overlap_load 3 and is rejected. P4
      11:00..13:00 touches P1 at exactly 11:00 and P2 across 11:00..12:00, so its load is also 3 and it
      is rejected — closed-interval touching counts here, unlike the half-open room rule.

  # ------------------------------------------------------------------ 8
  - name: supply_draw_allocation
    trigger: "POST /library/programs/{program_id}/confirm"
    algorithm: waterfall_allocation
    formula: |
      units_required := Program.supply_units_per_attendee * Program.attendance_target
      candidate_lots  := SUPPLY InventoryLots with sku == Program.supply_sku and status == ACTIVE, ordered:
                           bucket 1: lots with branch_id == Program.branch_id, created_at ASC
                           bucket 2: lots with branch_id != Program.branch_id and reuse_pool == true, created_at ASC
                         (lots of another branch with reuse_pool == false are never candidates)
      remaining := units_required; lines := []
      for lot in candidate_lots while remaining > 0:
          take := min(remaining, lot.quantity_available)
          base_cents := take * lot.unit_cost_cents
          surcharge_cents := round_half_up(base_cents * CROSS_BRANCH_SURCHARGE_RATE)
                             if lot.branch_id != Program.branch_id else 0
          lines.append({ lot_id, units: take, unit_cost_cents: lot.unit_cost_cents,
                         surcharge_cents, line_total_cents: base_cents + surcharge_cents })
          remaining -= take
      if remaining > 0: reject with ERR_SUPPLY_INVENTORY_INSUFFICIENT and allocate nothing
      draw_subtotal_cents := sum(line.line_total_cents for line in lines)   # surcharge rounded PER LINE
    input_set: "ACTIVE SUPPLY lots matching the program's supply_sku; DEPLETED lots and non-reuse lots of other branches are excluded."
    constants:
      CROSS_BRANCH_SURCHARGE_RATE: 0.08
    precision: "integer cents; the surcharge is rounded once per line, never once over the subtotal"
    worked_example: >-
      units_required 49 (units_per_attendee 1 x attendance_target 49). Local lot L1 has 30 available at
      200 -> line 6000 + 0. Reuse lot L2 at another branch has 25 available at 150 -> take 19,
      base 2850, surcharge round_half_up(228.0) = 228, line 3078. draw_subtotal_cents = 9078.
      Rounding the 8% over the combined base (8850 -> 708) instead of per line would give 9558.

  # ------------------------------------------------------------------ 9
  - name: materials_commitment_with_contingency
    trigger: "POST /library/programs/{program_id}/confirm, immediately after supply_draw_allocation"
    algorithm: threshold
    formula: |
      # STRICT step order — the contingency sits on the post-surcharge subtotal
      step 1  draw_subtotal_cents := output of supply_draw_allocation
      step 2  rate := MATERIALS_CONTINGENCY_LOW_RATE
                        if draw_subtotal_cents < MATERIALS_CONTINGENCY_THRESHOLD_CENTS
                      else MATERIALS_CONTINGENCY_HIGH_RATE
      step 3  contingency_cents := round_half_up(draw_subtotal_cents * rate)
      step 4  materials_committed_cents := draw_subtotal_cents + contingency_cents
      step 5  if materials_committed_cents > Program.materials_budget_cents:
                  reject with ERR_MATERIALS_BUDGET_EXCEEDED and allocate nothing
      step 6  materials_available_cents := materials_budget_cents
                                           - materials_committed_cents - materials_spent_cents
      # conservation invariant, checkable on every read:
      #   materials_budget_cents == materials_available_cents
      #                             + materials_committed_cents + materials_spent_cents
    input_set: "The single program being confirmed; its own draw lines only."
    constants:
      MATERIALS_CONTINGENCY_LOW_RATE: 0.10
      MATERIALS_CONTINGENCY_HIGH_RATE: 0.05
      MATERIALS_CONTINGENCY_THRESHOLD_CENTS: 20000
    precision: "integer cents, round_half_up; one rounding, at step 3"
    worked_example: >-
      draw_subtotal 9078 (< 20000) -> rate 0.10 -> contingency round_half_up(907.8) = 908 ->
      materials_committed_cents 9986; with materials_budget_cents 12000 the available balance is 2014.
      Computing the contingency on the pre-surcharge base 8850 would give 885 and a committed 9963.
      A draw_subtotal of exactly 20000 takes the HIGH rate (1000) and commits 21000.

  # ------------------------------------------------------------------ 10
  - name: program_budget_posture
    trigger: "Every write that moves a Program's committed or spent money: contract execute, contract cancellation, program confirm, revert, close-out"
    algorithm: aggregation
    formula: |
      total_budget_cents := Program.materials_budget_cents + Program.presenter_fee_budget_cents
      total_encumbered_cents := Program.materials_committed_cents + Program.materials_spent_cents
                              + Program.presenter_fee_committed_cents + Program.presenter_fee_spent_cents
      budget_variance_cents := total_budget_cents - total_encumbered_cents
      budget_posture := OVER_BUDGET if budget_variance_cents < 0 else WITHIN_BUDGET
      # Branch.programs_over_budget_count is adjusted ONLY on a posture flip:
      #   WITHIN_BUDGET -> OVER_BUDGET : +1
      #   OVER_BUDGET -> WITHIN_BUDGET : -1
    input_set: "The single Program's own four money fields; the branch counter is a derived roll-up over that branch's Programs, CANCELLED and WEATHER_CLOSED programs included (their kill fees are real money)."
    constants: {}
    precision: "integer cents; variance may be negative — overruns are recorded, not rejected"
    worked_example: >-
      materials_budget 12000, presenter_fee_budget 100000, materials_committed 9986,
      presenter_fee_committed 109753 -> variance 112000 - 119739 = -7739 -> OVER_BUDGET, and the owning
      branch's programs_over_budget_count goes 0 -> 1. A variance of exactly 0 is WITHIN_BUDGET.

  # ------------------------------------------------------------------ 11
  - name: program_attendance_attainment
    trigger: "POST /library/programs/{program_id}/close-out"
    algorithm: weighted_scoring
    formula: |
      gross_attendance := verified_registrant_attendance + drop_in_headcount
      no_show_count    := max(0, Program.registered_count - verified_registrant_attendance)
      survey_response_rate_pct := 0.0 if gross_attendance == 0
                                  else round_half_up_1dp(100 * surveys_collected / gross_attendance)
      # the two attainment variants below differ ONLY in the denominator
    input_set: "Close-out inputs of the one program plus its registered_count and confirmed_room_capacity; no other program contributes."
    constants: {}
    precision: "percentages carry exactly one decimal place, round_half_up; counts are integers"
    variants:
      - name: FUNDER
        when: "Always computed; this is the number reported to the grant funder"
        difference: >-
          Denominator is Program.attendance_target — the number promised in the grant application.
          attendance_attainment_funder_pct := round_half_up_1dp(100 * gross_attendance / attendance_target)
      - name: INTERNAL
        when: "Always computed alongside FUNDER; used by the branch to judge space utilisation"
        difference: >-
          Denominator is the seats that actually existed: Program.confirmed_room_capacity when it is
          greater than 0, otherwise Program.attendance_target (a PARTNER_SITE program has no room).
          attendance_attainment_internal_pct := round_half_up_1dp(100 * gross_attendance / that denominator)
    worked_example: >-
      registered_count 39, verified_registrant_attendance 33, drop_in_headcount 0, surveys_collected 12,
      attendance_target 55, confirmed_room_capacity 51 ->
      gross_attendance 33, no_show_count 6, survey_response_rate_pct 36.4,
      attendance_attainment_funder_pct 60.0, attendance_attainment_internal_pct 64.7.
      The same close-out on a PARTNER_SITE program (confirmed_room_capacity 0) makes both variants 60.0.
      A close-out with gross_attendance 0 yields 0.0 for all three percentages, never a division error.

  # ------------------------------------------------------------------ 12
  - name: participant_progress_ledger
    trigger: "POST /library/participants/{participant_id}/log-entries and /log-corrections"
    algorithm: chronological
    formula: |
      cumulative_units := max(0, sum(e.units for e in entries where entry_type == LOG)
                                 + sum(e.units_delta for e in entries where entry_type == CORRECTION))
      eligible_tier_index := max({ t.tier_index of the challenge's IncentiveTiers
                                   where t.threshold_units <= cumulative_units }, default 0)
      # entries are replayed in created_at ASC order; a CORRECTION is a new immutable entry that
      # references its target through corrected_entry_id and never edits the target in place.
      daily_cap := DAILY_LOG_CAP_MINUTES     if ReadingChallenge.logging_method == MINUTES
                   DAILY_LOG_CAP_BOOKS       if logging_method == BOOKS
                   DAILY_LOG_CAP_ACTIVITIES  if logging_method == ACTIVITIES
      # sum of LOG units for one participant on one logged_on date, after corrections against that
      # date, may not exceed daily_cap -> ERR_DAILY_LOG_CAP_EXCEEDED
      # awards are granted for every tier_index in (awarded_tier_index, eligible_tier_index]
    input_set: >-
      All ReadingLogEntries of the one participant, both LOG and CORRECTION; entries belonging to other
      participants of the same challenge never contribute. Tier thresholds come from the participant's
      own challenge.
    constants:
      DAILY_LOG_CAP_MINUTES: 300
      DAILY_LOG_CAP_BOOKS: 10
      DAILY_LOG_CAP_ACTIVITIES: 5
    precision: "integer units; cumulative_units has a hard floor of 0"
    variants:
      - name: LEDGER_TRUTH
        when: "ReadingChallenge.correction_policy == LEDGER_TRUTH"
        difference: >-
          awarded_tier_index tracks cumulative_units downward. When a correction pushes cumulative_units
          below a held tier's threshold_units, that tier's TierAward is REVOKED (CASCADE-D) and
          awarded_tier_index falls back to the highest tier still met.
      - name: HIGH_WATER
        when: "ReadingChallenge.correction_policy == HIGH_WATER"
        difference: >-
          An award already granted is never retracted: awarded_tier_index is monotone non-decreasing.
          cumulative_units still drops, so eligible_tier_index falls while awarded_tier_index and every
          TierAward stay put, and no inventory or prize budget is released.
    worked_example: >-
      Tiers: tier_index 1 threshold 60, tier_index 2 threshold 150. LOG 100 then LOG 80 gives
      cumulative_units 180, eligible_tier_index 2, awards for tiers 1 and 2. A CORRECTION of -50 leaves
      cumulative_units 130 and eligible_tier_index 1. Under LEDGER_TRUTH the tier-2 award becomes
      REVOKED and awarded_tier_index becomes 1; under HIGH_WATER the tier-2 award stays RESERVED and
      awarded_tier_index stays 2 — identical data, divergent results. A participant sitting at exactly
      60 units holds tier 1 (threshold comparison is <=); at 59 units, no tier.

  # ------------------------------------------------------------------ 13
  - name: prize_award_cost
    trigger: "system, whenever a TierAward is created or a DEFERRED award is promoted to RESERVED"
    algorithm: waterfall_allocation
    formula: |
      units := IncentiveTier.prize_units_per_participant
      candidate_lots := PRIZE InventoryLots with sku == IncentiveTier.prize_sku and status == ACTIVE
                        and quantity_available >= units, ordered:
                          bucket 1: lots with branch_id == Participant.home_branch_id, created_at ASC
                          bucket 2: lots with branch_id != home_branch_id and reuse_pool == true, created_at ASC
      if candidate_lots is empty:
          TierAward is created with status DEFERRED, lot_id null and all money fields 0
      else:
          lot := first candidate; lot_id := lot.id; unit_cost_cents := lot.unit_cost_cents
          line_cost_cents := units * unit_cost_cents
          transfer_surcharge_cents := round_half_up(line_cost_cents * CROSS_BRANCH_SURCHARGE_RATE)
                                      if lot.branch_id != Participant.home_branch_id else 0
          award_total_cents := line_cost_cents + transfer_surcharge_cents      # rounded PER AWARD
          lot.quantity_available -= units; lot.quantity_reserved += units
          ReadingChallenge.prize_committed_cents += award_total_cents
      # conservation invariants, checkable on every read:
      #   lot.quantity_procured == quantity_available + quantity_reserved + quantity_issued
      #   challenge.prize_budget_cents == prize_available_cents + prize_committed_cents + prize_spent_cents
    input_set: "ACTIVE PRIZE lots matching the tier's prize_sku with enough available units; DEPLETED lots and non-reuse lots of other branches are excluded."
    constants:
      CROSS_BRANCH_SURCHARGE_RATE: 0.08
    precision: "integer cents; the surcharge is rounded once per award, never once over the challenge total"
    worked_example: >-
      A cross-branch reuse lot with unit_cost_cents 469 and prize_units_per_participant 1 gives
      surcharge round_half_up(37.52) = 38 and award_total_cents 507. Two participants earning that same
      tier commit 1014 cents; rounding 8% over the combined base 938 would give 1013 — the per-award
      rounding is observable in ReadingChallenge.prize_committed_cents.

# =============================================================================
# §1.4 Validation Rules Table (evaluated strictly in ascending priority order;
# the FIRST violated rule decides the response)
# =============================================================================
validations:

  # ---- authentication / authorization -----------------------------------
  - priority: 1
    category: auth
    check: "X-User-Id and X-User-Role headers are both present and non-empty"
    error_id: ERR_UNAUTHENTICATED
    http_status: 401
    applies_to: "all"

  - priority: 2
    category: auth
    check: "X-User-Role is one of ProgramManager | ProgramCoordinator | ScreeningOfficer | Reader AND is listed in the target endpoint's roles"
    error_id: ERR_UNAUTHORIZED
    http_status: 403
    applies_to: "all"

  # ---- request shape ----------------------------------------------------
  - priority: 3
    category: business_constraint
    check: "Body parses; every required input field present; types, enum members, ISO-8601 formats and declared field constraints (>= bounds, non-empty arrays) satisfied; unknown fields ignored"
    error_id: ERR_INVALID_REQUEST
    http_status: 400
    applies_to: "all write endpoints"

  - priority: 4
    category: business_constraint
    check: "limit is an integer in [1, 100] and offset is an integer >= 0 when supplied"
    error_id: ERR_INVALID_PAGINATION
    http_status: 400
    applies_to: "all list endpoints"

  # ---- existence --------------------------------------------------------
  - priority: 5
    category: existence
    check: >-
      Every resource named in the request PATH exists, validated left to right. Emits the error of the
      leftmost missing segment: ERR_BRANCH_NOT_FOUND, ERR_PROGRAM_NOT_FOUND, ERR_RESERVATION_NOT_FOUND,
      ERR_PRESENTER_NOT_FOUND, ERR_CONTRACT_NOT_FOUND, ERR_CHALLENGE_NOT_FOUND,
      ERR_PARTICIPANT_NOT_FOUND, ERR_LOG_ENTRY_NOT_FOUND, ERR_LOT_NOT_FOUND, ERR_AWARD_NOT_FOUND.
    error_id: "ERR_<PATH_RESOURCE>_NOT_FOUND"
    http_status: 404
    applies_to: "every endpoint carrying a path parameter"

  - priority: 6
    category: existence
    check: >-
      Every foreign key supplied in the BODY resolves, validated in the order the fields are declared in
      §1.1: ERR_BRANCH_NOT_FOUND (branch_id, home_branch_id), ERR_CHALLENGE_NOT_FOUND (challenge_id),
      ERR_ROOM_NOT_FOUND (room_id), ERR_PRESENTER_NOT_FOUND (presenter_id),
      ERR_PROGRAM_NOT_FOUND (program_id), ERR_LOG_ENTRY_NOT_FOUND (corrected_entry_id).
      Path resources always outrank body resources.
    error_id: "ERR_<BODY_RESOURCE>_NOT_FOUND"
    http_status: 404
    applies_to: "POST /library/programs, POST /library/contracts, POST /library/participants, POST /library/inventory-lots, POST /library/programs/{program_id}/reservations, POST /library/participants/{participant_id}/log-corrections"

  # ---- ownership / segregation of duties --------------------------------
  - priority: 7
    category: auth
    check: "When X-User-Role == Reader, X-User-Id equals the {participant_id} in the path (a reader may only act on their own participant record)"
    error_id: ERR_NOT_RESOURCE_OWNER
    http_status: 403
    applies_to: "GET /library/participants/{participant_id}, POST /library/participants/{participant_id}/log-entries, POST /library/participants/{participant_id}/log-corrections"

  - priority: 8
    category: auth
    check: "X-User-Id differs from PresenterContract.offered_by_user_id — the user who issued the standing offer may not execute it"
    error_id: ERR_SEGREGATION_OF_DUTIES
    http_status: 403
    applies_to: "POST /library/contracts/{contract_id}/execute"

  # ---- optimistic concurrency ------------------------------------------
  - priority: 9
    category: state
    check: "expected_program_version equals the current Program.version"
    error_id: ERR_STALE_PROGRAM_VERSION
    http_status: 412
    applies_to: "POST /library/programs/{program_id}/reservations"

  - priority: 10
    category: state
    check: "expected_participant_version equals the current Participant.version"
    error_id: ERR_STALE_PARTICIPANT_VERSION
    http_status: 412
    applies_to: "POST /library/participants/{participant_id}/log-corrections"

  # ---- state preconditions ---------------------------------------------
  - priority: 11
    category: state
    check: >-
      Program.operational_status admits the requested transition: schedule and reservations require
      DRAFT or SCHEDULED; registrations require SCHEDULED or CONFIRMED; confirm requires SCHEDULED;
      close-out requires CONFIRMED; weather-close requires SCHEDULED or CONFIRMED; cancel requires
      DRAFT, SCHEDULED or CONFIRMED.
    error_id: ERR_PROGRAM_STATE_INVALID
    http_status: 409
    applies_to: "POST /library/programs/{program_id}/schedule|reservations|registrations|confirm|close-out|weather-close|cancel"

  - priority: 12
    category: state
    check: "RoomReservation.status == HELD when confirming; a CONFIRMED reservation already exists for the program when creating another (a HELD one is legitimately superseded)"
    error_id: ERR_RESERVATION_STATE_INVALID
    http_status: 409
    applies_to: "POST /library/reservations/{reservation_id}/confirm, POST /library/programs/{program_id}/reservations"

  - priority: 13
    category: state
    check: "PresenterContract.status admits the action: offer requires DRAFT or COUNTERED; counter requires OFFERED; execute requires OFFERED"
    error_id: ERR_CONTRACT_STATE_INVALID
    http_status: 409
    applies_to: "POST /library/contracts/{contract_id}/offer|counter|execute"

  - priority: 14
    category: state
    check: "ReadingChallenge.status admits the action: adding an IncentiveTier requires PLANNING; open requires PLANNING; reconcile requires OPEN; enrolling a Participant requires PLANNING or OPEN; posting log entries and corrections requires OPEN"
    error_id: ERR_CHALLENGE_STATE_INVALID
    http_status: 409
    applies_to: "POST /library/reading-challenges/{challenge_id}/incentive-tiers|open|reconcile, POST /library/participants, POST /library/participants/{participant_id}/log-entries, POST /library/participants/{participant_id}/log-corrections"

  - priority: 15
    category: state
    check: "Screening workflow order: a screening request requires screening_status IN {NONE, EXPIRED, BLOCKED}; a screening result requires screening_decision == PENDING; an adjudication requires screening_decision == FLAGGED"
    error_id: ERR_SCREENING_STATE_INVALID
    http_status: 409
    applies_to: "POST /library/presenters/{presenter_id}/screening-requests|screening-results|adjudications"

  - priority: 16
    category: state
    check: "Presenter.engagement_status != SUSPENDED"
    error_id: ERR_PRESENTER_SUSPENDED
    http_status: 409
    applies_to: "POST /library/contracts, POST /library/contracts/{contract_id}/offer|counter|execute"

  - priority: 17
    category: state
    check: "On POST /library/programs/{program_id}/confirm: Program.compliance_status NOT IN {PENDING_SCREENING, BLOCKED} — a drafted, offered or countered presenter contract that was never executed leaves the program PENDING_SCREENING and unconfirmable. On POST /library/programs/{program_id}/registrations: Program.compliance_status != BLOCKED (registrations continue while screening is merely pending)."
    error_id: ERR_PROGRAM_COMPLIANCE_BLOCKED
    http_status: 409
    applies_to: "POST /library/programs/{program_id}/confirm, POST /library/programs/{program_id}/registrations"

  - priority: 18
    category: state
    check: "Room.status == AVAILABLE"
    error_id: ERR_ROOM_OUT_OF_SERVICE
    http_status: 409
    applies_to: "POST /library/programs/{program_id}/reservations"

  # ---- business rules: safety / compliance first -----------------------
  - priority: 19
    category: business_safety
    check: "Program.serves_minors == false OR Presenter.screening_status == ACTIVE at the moment of execution"
    error_id: ERR_PRESENTER_SCREENING_REQUIRED
    http_status: 422
    applies_to: "POST /library/contracts/{contract_id}/execute"

  - priority: 20
    category: business_safety
    check: "Presenter.insurance_certificate_expires_on >= date(Program.end_utc)"
    error_id: ERR_PRESENTER_INSURANCE_LAPSED
    http_status: 422
    applies_to: "POST /library/contracts/{contract_id}/execute"

  - priority: 21
    category: business_safety
    check: "For a PARTNER_SITE program, partner_insurance_expires_on >= date(Program.end_utc); IN_BRANCH programs skip this rule entirely"
    error_id: ERR_PARTNER_INSURANCE_LAPSED
    http_status: 422
    applies_to: "POST /library/programs/{program_id}/confirm"

  - priority: 22
    category: business_safety
    check: "When Program.accessibility_accommodations contains WHEELCHAIR_LAYOUT the room's accessibility_features must contain WHEELCHAIR_ACCESSIBLE; when it contains ASL_INTERPRETER or SENSORY_QUIET_HOUR the room must contain HEARING_LOOP or QUIET_ZONE respectively"
    error_id: ERR_ACCESSIBILITY_UNSUPPORTED
    http_status: 422
    applies_to: "POST /library/programs/{program_id}/reservations"

  - priority: 23
    category: business_safety
    check: "setup_minutes >= max(Room.min_setup_minutes, ACCESSIBLE_SETUP_MINUTES when accessibility_accommodations is non-empty) AND teardown_minutes >= Room.min_teardown_minutes"
    error_id: ERR_SETUP_BUFFER_TOO_SHORT
    http_status: 422
    applies_to: "POST /library/programs/{program_id}/reservations"

  # ---- business rules: temporal / referential constraints --------------
  - priority: 24
    category: business_temporal
    check: "Reservation start_utc <= Program.start_utc and end_utc >= Program.end_utc — the booking must cover the public window"
    error_id: ERR_RESERVATION_WINDOW_MISMATCH
    http_status: 422
    applies_to: "POST /library/programs/{program_id}/reservations"

  - priority: 25
    category: business_temporal
    check: "The candidate's half-open occupancy interval does not intersect any HELD or CONFIRMED reservation of the same room (calculation room_occupancy_interval)"
    error_id: ERR_ROOM_DOUBLE_BOOKED
    http_status: 409
    applies_to: "POST /library/programs/{program_id}/reservations"

  - priority: 26
    category: business_referential
    check: "An IN_BRANCH program has a RoomReservation with status == CONFIRMED; PARTNER_SITE programs skip this rule"
    error_id: ERR_NO_CONFIRMED_ROOM
    http_status: 422
    applies_to: "POST /library/programs/{program_id}/confirm"

  - priority: 27
    category: business_temporal
    check: "The presenter has no other EXECUTED or COMPLETED contract whose closed engagement window intersects this program's (calculation presenter_engagement_window)"
    error_id: ERR_PRESENTER_DOUBLE_BOOKED
    http_status: 409
    applies_to: "POST /library/contracts/{contract_id}/execute"

  - priority: 28
    category: business_constraint
    check: "overlap_load (calculation branch_overlap_load) <= Branch.overlapping_program_capacity"
    error_id: ERR_BRANCH_STAFFING_CAPACITY_EXCEEDED
    http_status: 422
    applies_to: "POST /library/programs/{program_id}/confirm"

  - priority: 29
    category: business_temporal
    check: "start_utc is strictly before end_utc, and both lie at or after the logical clock at creation or reschedule time"
    error_id: ERR_INVALID_PROGRAM_WINDOW
    http_status: 422
    applies_to: "POST /library/programs, POST /library/programs/{program_id}/schedule"

  - priority: 30
    category: business_constraint
    check: "delivery_mode == PARTNER_SITE requires partner_type != NONE, a non-empty partner_org_name and a partner_insurance_expires_on; delivery_mode == IN_BRANCH requires partner_type == NONE and both partner fields null"
    error_id: ERR_PARTNER_FIELDS_REQUIRED
    http_status: 422
    applies_to: "POST /library/programs"

  # ---- business rules: registration & attendance ----------------------
  - priority: 31
    category: business_constraint
    check: "Program.registration_policy == REGISTRATION"
    error_id: ERR_DROP_IN_NO_REGISTRATION
    http_status: 422
    applies_to: "POST /library/programs/{program_id}/registrations"

  - priority: 32
    category: business_temporal
    check: "The logical clock is strictly before Program.start_utc"
    error_id: ERR_REGISTRATION_WINDOW_CLOSED
    http_status: 422
    applies_to: "POST /library/programs/{program_id}/registrations"

  - priority: 33
    category: business_constraint
    check: "registrant_reference is not already present in Program.registrant_references"
    error_id: ERR_DUPLICATE_REGISTRANT
    http_status: 422
    applies_to: "POST /library/programs/{program_id}/registrations"

  - priority: 34
    category: business_fiscal
    check: "registered_count + seats <= min(Program.attendance_cap, Program.confirmed_room_capacity) when a room is CONFIRMED, else <= Program.attendance_cap (calculation room_effective_capacity)"
    error_id: ERR_PROGRAM_AT_CAPACITY
    http_status: 422
    applies_to: "POST /library/programs/{program_id}/registrations"

  # ---- business rules: reading log ------------------------------------
  - priority: 35
    category: business_constraint
    check: "A Reader may only post source == SELF_SERVICE; STAFF_DESK and OUTREACH_SITE entries require ProgramCoordinator or ProgramManager"
    error_id: ERR_LOG_SOURCE_NOT_PERMITTED
    http_status: 422
    applies_to: "POST /library/participants/{participant_id}/log-entries"

  - priority: 36
    category: business_temporal
    check: "logged_on lies within [ReadingChallenge.start_on, ReadingChallenge.end_on] inclusive"
    error_id: ERR_LOG_DATE_OUTSIDE_WINDOW
    http_status: 422
    applies_to: "POST /library/participants/{participant_id}/log-entries"

  - priority: 37
    category: business_temporal
    check: "logged_on is not after date(logical clock)"
    error_id: ERR_LOG_DATE_IN_FUTURE
    http_status: 422
    applies_to: "POST /library/participants/{participant_id}/log-entries"

  - priority: 38
    category: business_constraint
    check: "The participant's net LOG units for that logged_on date, including this entry, do not exceed the challenge's daily cap (calculation participant_progress_ledger)"
    error_id: ERR_DAILY_LOG_CAP_EXCEEDED
    http_status: 422
    applies_to: "POST /library/participants/{participant_id}/log-entries"

  - priority: 39
    category: business_referential
    check: "corrected_entry_id names an entry_type == LOG entry belonging to this participant that no earlier CORRECTION has already superseded"
    error_id: ERR_CORRECTION_TARGET_INVALID
    http_status: 422
    applies_to: "POST /library/participants/{participant_id}/log-corrections"

  - priority: 40
    category: business_constraint
    check: "units_delta is non-zero and the target entry's post-correction units stay >= 0 (a correction may not drive one entry negative)"
    error_id: ERR_CORRECTION_WOULD_GO_NEGATIVE
    http_status: 422
    applies_to: "POST /library/participants/{participant_id}/log-corrections"

  # ---- business rules: challenge ladder -------------------------------
  - priority: 41
    category: business_constraint
    check: "tier_index equals the challenge's current highest tier_index + 1 and threshold_units is strictly greater than the previous tier's threshold_units"
    error_id: ERR_TIER_SEQUENCE_INVALID
    http_status: 422
    applies_to: "POST /library/reading-challenges/{challenge_id}/incentive-tiers"

  - priority: 42
    category: business_referential
    check: "The challenge has at least one IncentiveTier"
    error_id: ERR_CHALLENGE_HAS_NO_TIERS
    http_status: 422
    applies_to: "POST /library/reading-challenges/{challenge_id}/open"

  - priority: 43
    category: business_temporal
    check: "date(logical clock) is strictly after ReadingChallenge.end_on"
    error_id: ERR_CHALLENGE_WINDOW_STILL_OPEN
    http_status: 422
    applies_to: "POST /library/reading-challenges/{challenge_id}/reconcile"

  # ---- business rules: money last -------------------------------------
  - priority: 44
    category: business_constraint
    check: "negotiation_round < MAX_NEGOTIATION_ROUNDS (3)"
    error_id: ERR_NEGOTIATION_ROUNDS_EXHAUSTED
    http_status: 422
    applies_to: "POST /library/contracts/{contract_id}/offer"

  - priority: 45
    category: business_fiscal
    check: "total_fee_cents (calculation contract_total_fee) <= min(PROGRAM_FEE_CAP_CENTS, Branch.per_program_fee_cap_cents)"
    error_id: ERR_FEE_CAP_EXCEEDED
    http_status: 422
    applies_to: "POST /library/contracts/{contract_id}/execute"

  - priority: 46
    category: business_referential
    check: "The candidate SUPPLY lots cover units_required in full (calculation supply_draw_allocation); a partial draw is never persisted"
    error_id: ERR_SUPPLY_INVENTORY_INSUFFICIENT
    http_status: 422
    applies_to: "POST /library/programs/{program_id}/confirm"

  - priority: 47
    category: business_fiscal
    check: "materials_committed_cents (calculation materials_commitment_with_contingency) <= Program.materials_budget_cents"
    error_id: ERR_MATERIALS_BUDGET_EXCEEDED
    http_status: 422
    applies_to: "POST /library/programs/{program_id}/confirm"

  # ---- business rules: close-out & closure ----------------------------
  - priority: 48
    category: business_temporal
    check: "The logical clock is at or after Program.end_utc"
    error_id: ERR_PROGRAM_NOT_YET_ENDED
    http_status: 422
    applies_to: "POST /library/programs/{program_id}/close-out"

  - priority: 49
    category: business_constraint
    check: "verified_registrant_attendance <= Program.registered_count"
    error_id: ERR_ATTENDANCE_EXCEEDS_REGISTRATIONS
    http_status: 422
    applies_to: "POST /library/programs/{program_id}/close-out"

  - priority: 50
    category: business_constraint
    check: "surveys_collected <= verified_registrant_attendance + drop_in_headcount"
    error_id: ERR_SURVEY_COUNT_EXCEEDS_ATTENDANCE
    http_status: 422
    applies_to: "POST /library/programs/{program_id}/close-out"

  - priority: 51
    category: business_temporal
    check: "The logical clock is strictly before Program.end_utc — a weather closure cannot be declared after the program has already ended"
    error_id: ERR_WEATHER_WINDOW_PASSED
    http_status: 422
    applies_to: "POST /library/programs/{program_id}/weather-close"

  - priority: 52
    category: business_constraint
    check: "branch_code is not already used by another Branch"
    error_id: ERR_BRANCH_CODE_DUPLICATE
    http_status: 422
    applies_to: "POST /library/branches"

# =============================================================================
# §1.5 API Endpoint Table (49 endpoints: 21 reads, 27 business writes,
# 1 test-driving clock endpoint)
# =============================================================================
endpoints:

  # -------------------------------------------------- reads: single resource
  - method: GET
    path: "/library/branches/{branch_id}"
    description: "Read one branch, including the derived programs_over_budget_count roll-up"
    roles: [ProgramManager, ProgramCoordinator, ScreeningOfficer]
    code: 200
    input: []
    output: Branch
    side_effects: []

  - method: GET
    path: "/library/rooms/{room_id}"
    description: "Read one room with its buffer minimums and accessibility features"
    roles: [ProgramManager, ProgramCoordinator]
    code: 200
    input: []
    output: Room
    side_effects: []

  - method: GET
    path: "/library/programs/{program_id}"
    description: "Read one program: both status dimensions, the money roll-ups, the supply draw lines and the close-out outcome fields"
    roles: [ProgramManager, ProgramCoordinator]
    code: 200
    input: []
    output: Program
    side_effects: []

  - method: GET
    path: "/library/reservations/{reservation_id}"
    description: "Read one room reservation with its computed occupancy interval and effective capacity"
    roles: [ProgramManager, ProgramCoordinator]
    code: 200
    input: []
    output: RoomReservation
    side_effects: []

  - method: GET
    path: "/library/presenters/{presenter_id}"
    description: "Read one presenter, including the derived screening_status and screening_valid_until"
    roles: [ProgramManager, ProgramCoordinator, ScreeningOfficer]
    code: 200
    input: []
    output: Presenter
    side_effects: []

  - method: GET
    path: "/library/contracts/{contract_id}"
    description: "Read one presenter contract with its fee breakdown, negotiation round and segregation-of-duties actor ids"
    roles: [ProgramManager, ProgramCoordinator]
    code: 200
    input: []
    output: PresenterContract
    side_effects: []

  - method: GET
    path: "/library/reading-challenges/{challenge_id}"
    description: "Read one summer reading challenge with its prize budget roll-ups and inventory posture"
    roles: [ProgramManager, ProgramCoordinator]
    code: 200
    input: []
    output: ReadingChallenge
    side_effects: []

  - method: GET
    path: "/library/incentive-tiers/{tier_id}"
    description: "Read one incentive tier with its award and deferral counts"
    roles: [ProgramManager, ProgramCoordinator]
    code: 200
    input: []
    output: IncentiveTier
    side_effects: []

  - method: GET
    path: "/library/participants/{participant_id}"
    description: "Read one participant with cumulative_units, eligible_tier_index and awarded_tier_index; a Reader may only read their own record"
    roles: [ProgramManager, ProgramCoordinator, Reader]
    code: 200
    input: []
    output: Participant
    side_effects: []

  - method: GET
    path: "/library/log-entries/{entry_id}"
    description: "Read one reading log entry (LOG or CORRECTION)"
    roles: [ProgramManager, ProgramCoordinator]
    code: 200
    input: []
    output: ReadingLogEntry
    side_effects: []

  - method: GET
    path: "/library/inventory-lots/{lot_id}"
    description: "Read one inventory lot with its available / reserved / issued split"
    roles: [ProgramManager, ProgramCoordinator]
    code: 200
    input: []
    output: InventoryLot
    side_effects: []

  - method: GET
    path: "/library/tier-awards/{award_id}"
    description: "Read one tier award with its per-award cost breakdown"
    roles: [ProgramManager, ProgramCoordinator]
    code: 200
    input: []
    output: TierAward
    side_effects: []

  # -------------------------------------------------- reads: filtered lists
  - method: GET
    path: "/library/rooms"
    description: "List rooms, filterable by owning branch — the reverse-reachability read for Room.branch_id"
    roles: [ProgramManager, ProgramCoordinator]
    code: 200
    input: ["branch_id?", "status?", "limit?", "offset?"]
    output: Room[]
    side_effects: []

  - method: GET
    path: "/library/programs"
    description: "List programs, filterable by branch, challenge and operational status — the reverse-reachability read for Program.branch_id and Program.challenge_id"
    roles: [ProgramManager, ProgramCoordinator]
    code: 200
    input: ["branch_id?", "challenge_id?", "operational_status?", "compliance_status?", "limit?", "offset?"]
    output: Program[]
    side_effects: []

  - method: GET
    path: "/library/reservations"
    description: "List room reservations, filterable by program and room — the reverse-reachability read for RoomReservation.program_id and RoomReservation.room_id"
    roles: [ProgramManager, ProgramCoordinator]
    code: 200
    input: ["program_id?", "room_id?", "status?", "limit?", "offset?"]
    output: RoomReservation[]
    side_effects: []

  - method: GET
    path: "/library/contracts"
    description: "List presenter contracts, filterable by presenter and program — the reverse-reachability read for PresenterContract.presenter_id and PresenterContract.program_id, and the only channel that surfaces contracts a cascade has mutated"
    roles: [ProgramManager, ProgramCoordinator]
    code: 200
    input: ["presenter_id?", "program_id?", "status?", "limit?", "offset?"]
    output: PresenterContract[]
    side_effects: []

  - method: GET
    path: "/library/incentive-tiers"
    description: "List incentive tiers of a challenge in ascending tier_index order — the reverse-reachability read for IncentiveTier.challenge_id"
    roles: [ProgramManager, ProgramCoordinator]
    code: 200
    input: ["challenge_id?", "limit?", "offset?"]
    output: IncentiveTier[]
    side_effects: []

  - method: GET
    path: "/library/participants"
    description: "List participants, filterable by challenge and home branch — the reverse-reachability read for Participant.challenge_id and Participant.home_branch_id"
    roles: [ProgramManager, ProgramCoordinator]
    code: 200
    input: ["challenge_id?", "home_branch_id?", "limit?", "offset?"]
    output: Participant[]
    side_effects: []

  - method: GET
    path: "/library/log-entries"
    description: "List reading log entries in created_at ASC order, filterable by participant, entry type and correction target — the reverse-reachability read for ReadingLogEntry.participant_id and ReadingLogEntry.corrected_entry_id"
    roles: [ProgramManager, ProgramCoordinator]
    code: 200
    input: ["participant_id?", "entry_type?", "corrected_entry_id?", "limit?", "offset?"]
    output: ReadingLogEntry[]
    side_effects: []

  - method: GET
    path: "/library/inventory-lots"
    description: "List inventory lots in created_at ASC order, filterable by branch, category, sku and status — the reverse-reachability read for InventoryLot.branch_id and the way tests observe the allocation order"
    roles: [ProgramManager, ProgramCoordinator]
    code: 200
    input: ["branch_id?", "category?", "sku?", "status?", "limit?", "offset?"]
    output: InventoryLot[]
    side_effects: []

  - method: GET
    path: "/library/tier-awards"
    description: "List tier awards in created_at ASC order, filterable by participant, tier, lot and status — the reverse-reachability read for TierAward.participant_id, TierAward.tier_id and TierAward.lot_id, and the only channel that surfaces cascade-created awards"
    roles: [ProgramManager, ProgramCoordinator]
    code: 200
    input: ["participant_id?", "tier_id?", "lot_id?", "status?", "limit?", "offset?"]
    output: TierAward[]
    side_effects: []

  # -------------------------------------------------- writes: reference data
  - method: POST
    path: "/library/branches"
    description: "Create a branch with its staffing overlap ceiling and per-program fee cap"
    roles: [ProgramManager]
    code: 201
    input: [name, branch_code, overlapping_program_capacity, per_program_fee_cap_cents]
    output: Branch
    side_effects:
      - "branch_code uniqueness enforced (ERR_BRANCH_CODE_DUPLICATE)"
      - "programs_over_budget_count initialised to 0"

  - method: POST
    path: "/library/branches/{branch_id}/rooms"
    description: "Create a room inside a branch; branch_id is taken from the path and ignored in the body"
    roles: [ProgramManager]
    code: 201
    input: ["room_name", "capacity_seats", "min_setup_minutes", "min_teardown_minutes", "accessibility_features?", "status?"]
    output: Room
    side_effects:
      - "Room.branch_id := {branch_id} from the path"
      - "status defaults to AVAILABLE when omitted"

  - method: POST
    path: "/library/inventory-lots"
    description: "Procure an inventory lot of PRIZE or SUPPLY units at a branch, optionally shared with other branches through the reuse pool"
    roles: [ProgramManager]
    code: 201
    input: ["branch_id", "category", "sku", "unit_cost_cents", "quantity_procured", "reuse_pool", "description?"]
    output: InventoryLot
    side_effects:
      - "quantity_available := quantity_procured; quantity_reserved := 0; quantity_issued := 0; status := ACTIVE"
      - "Any DEFERRED TierAward whose tier prize_sku matches this lot and whose participant may draw from it is promoted to RESERVED in created_at ASC order (TierAward DEFERRED -> RESERVED transition), which raises ReadingChallenge.prize_committed_cents"

  - method: POST
    path: "/library/presenters"
    description: "Register a presenter with their insurance certificate expiry and standing quote"
    roles: [ProgramCoordinator, ProgramManager]
    code: 201
    input: [legal_name, presenter_type, insurance_certificate_expires_on, quoted_fee_cents]
    output: Presenter
    side_effects:
      - "engagement_status := PROSPECT; screening_decision := NONE; screening_status := NONE; screening_tier := NONE"

  # -------------------------------------------------- writes: screening workflow
  - method: POST
    path: "/library/presenters/{presenter_id}/screening-requests"
    description: "Open a background screening at NAME_CHECK or FINGERPRINT tier; also the re-screen entry point after an EXPIRED or BLOCKED status"
    roles: [ScreeningOfficer]
    code: 200
    input: [screening_tier]
    output: Presenter
    side_effects:
      - "screening_decision := PENDING; screening_tier := input; screening_decided_on := null; screening_valid_until := null; screening_status := PENDING"
      - "increments Presenter.version by 1"

  - method: POST
    path: "/library/presenters/{presenter_id}/screening-results"
    description: "Record the screening outcome; a FLAGGED result suspends the presenter and fires CASCADE-B across their contracts and those contracts' programs"
    roles: [ScreeningOfficer]
    code: 200
    input: [result, decided_on]
    output: Presenter
    side_effects:
      - "result == CLEAR: screening_decision := CLEAR; screening_valid_until := calculation screening_validity_window; screening_status := ACTIVE"
      - "result == FLAGGED: screening_decision := FLAGGED; screening_status := PENDING_ADJUDICATION; engagement_status := SUSPENDED (CASCADE-B link 1)"
      - "CASCADE-B link 2: every PresenterContract of this presenter with status IN {OFFERED, COUNTERED, EXECUTED} becomes BLOCKED and its EXECUTED fee is removed from Program.presenter_fee_committed_cents"
      - "CASCADE-B link 3: each affected contract's Program.compliance_status := BLOCKED"
      - "CASCADE-B link 4: each such Program with operational_status == CONFIRMED reverts to SCHEDULED, its supply draw is returned to the drawing lots and materials_committed_cents drops to 0; budget_posture and Branch.programs_over_budget_count are recomputed"
      - "increments Presenter.version by 1"

  - method: POST
    path: "/library/presenters/{presenter_id}/adjudications"
    description: "Adjudicate a FLAGGED screening: CLEARED_WITH_CONDITIONS restores the presenter and their BLOCKED contracts, DENIED blocks them permanently"
    roles: [ScreeningOfficer]
    code: 200
    input: [decision, decided_on]
    output: Presenter
    side_effects:
      - "decision == CLEARED_WITH_CONDITIONS: screening_decision := CLEARED_WITH_CONDITIONS; screening_valid_until := calculation screening_validity_window; screening_status := ACTIVE; engagement_status := ACTIVE when executed_contract_count > 0 else PROSPECT; every BLOCKED contract returns to OFFERED with negotiation_round and offered_by_user_id preserved and total_fee_cents reset to 0; each such Program.compliance_status := PENDING_SCREENING"
      - "decision == DENIED: screening_decision := DENIED; screening_status := BLOCKED; engagement_status stays SUSPENDED; contracts stay BLOCKED"
      - "increments Presenter.version by 1"

  # -------------------------------------------------- writes: summer reading challenge
  - method: POST
    path: "/library/reading-challenges"
    description: "Create a summer reading challenge with its logging method, window, correction policy and prize budget"
    roles: [ProgramManager]
    code: 201
    input: [name, logging_method, unit_label, start_on, end_on, correction_policy, prize_budget_cents]
    output: ReadingChallenge
    side_effects:
      - "status := PLANNING; prize_committed_cents := 0; prize_spent_cents := 0; prize_available_cents := prize_budget_cents; prize_inventory_posture := AMPLE"

  - method: POST
    path: "/library/reading-challenges/{challenge_id}/incentive-tiers"
    description: "Append the next incentive tier to a PLANNING challenge's ladder"
    roles: [ProgramManager]
    code: 201
    input: [tier_index, threshold_units, prize_sku, prize_units_per_participant]
    output: IncentiveTier
    side_effects:
      - "IncentiveTier.challenge_id := {challenge_id} from the path"
      - "tier_index must be exactly previous_max + 1 and threshold_units strictly ascending (ERR_TIER_SEQUENCE_INVALID)"
      - "ReadingChallenge.prize_inventory_posture recomputed against the ACTIVE PRIZE lots for the new prize_sku"

  - method: POST
    path: "/library/reading-challenges/{challenge_id}/open"
    description: "Open a challenge for logging; locks the tier ladder"
    roles: [ProgramManager]
    code: 200
    input: []
    output: ReadingChallenge
    side_effects:
      - "status := OPEN; further POSTs to /incentive-tiers are rejected with ERR_CHALLENGE_STATE_INVALID"
      - "increments ReadingChallenge.version by 1"

  - method: POST
    path: "/library/reading-challenges/{challenge_id}/reconcile"
    description: "Close out the challenge after its logging window: RESERVED awards are issued, DEFERRED awards are forfeited"
    roles: [ProgramManager]
    code: 200
    input: []
    output: ReadingChallenge
    side_effects:
      - "status := RECONCILED"
      - "every RESERVED TierAward becomes ISSUED: its lot moves units from quantity_reserved to quantity_issued; prize_committed_cents decreases and prize_spent_cents increases by award_total_cents"
      - "every DEFERRED TierAward becomes FORFEITED with no money or inventory movement"
      - "participant_count, deferred_award_count and prize_available_cents refreshed"
      - "increments ReadingChallenge.version by 1"

  - method: POST
    path: "/library/participants"
    description: "Enrol a reader in a challenge; the resulting Participant.id is the X-User-Id a Reader authenticates with"
    roles: [ProgramCoordinator, ProgramManager]
    code: 201
    input: [challenge_id, home_branch_id, display_name, age_band]
    output: Participant
    side_effects:
      - "cumulative_units := 0; eligible_tier_index := 0; awarded_tier_index := 0; entry_count := 0"
      - "ReadingChallenge.participant_count += 1"

  - method: POST
    path: "/library/participants/{participant_id}/log-entries"
    description: "Post a reading log entry; may cascade into tier awards, prize reservations, lot depletion and challenge posture (CASCADE-C)"
    roles: [Reader, ProgramCoordinator, ProgramManager]
    code: 201
    input: [units, logged_on, source]
    output: ReadingLogEntry
    side_effects:
      - "entry_type := LOG; participant_id := {participant_id} from the path; recorded_by_user_id := X-User-Id"
      - "CASCADE-C link 1: Participant.cumulative_units, eligible_tier_index, entry_count and last_entry_on recomputed (calculation participant_progress_ledger)"
      - "CASCADE-C link 2: a TierAward is created for every newly reached tier_index in (awarded_tier_index, eligible_tier_index], each priced by calculation prize_award_cost; a tier with no drawable lot yields status DEFERRED"
      - "CASCADE-C link 3: each RESERVED award moves units from InventoryLot.quantity_available to quantity_reserved and raises ReadingChallenge.prize_committed_cents"
      - "CASCADE-C link 4: a lot whose quantity_available reaches 0 becomes DEPLETED, which can flip ReadingChallenge.prize_inventory_posture to CONSTRAINED"
      - "increments Participant.version by 1"

  - method: POST
    path: "/library/participants/{participant_id}/log-corrections"
    description: "Post an immutable correction against an earlier LOG entry; under LEDGER_TRUTH it can revoke awards and release prize units (CASCADE-D)"
    roles: [ProgramCoordinator, ProgramManager]
    code: 201
    input: ["corrected_entry_id", "units_delta", "expected_participant_version", "note?"]
    output: ReadingLogEntry
    side_effects:
      - "entry_type := CORRECTION; logged_on copied from the target entry; recorded_by_user_id := X-User-Id; the target entry itself is never mutated"
      - "CASCADE-D link 1: Participant.cumulative_units and eligible_tier_index recomputed"
      - "CASCADE-D link 2 (correction_policy == LEDGER_TRUTH only): every TierAward of a tier whose threshold_units now exceeds cumulative_units becomes REVOKED; under HIGH_WATER no award is touched"
      - "CASCADE-D link 3: a revoked RESERVED award returns its units from InventoryLot.quantity_reserved to quantity_available, moving a DEPLETED lot back to ACTIVE and promoting DEFERRED awards in created_at ASC order"
      - "CASCADE-D link 4: ReadingChallenge.prize_committed_cents, prize_available_cents and prize_inventory_posture recomputed"
      - "increments Participant.version by 1"

  # -------------------------------------------------- writes: program calendar
  - method: POST
    path: "/library/programs"
    description: "Draft a program on the calendar, including its partner-site profile, accessibility accommodations, attendance targets and both budgets"
    roles: [ProgramCoordinator, ProgramManager]
    code: 201
    input: ["branch_id", "title", "age_group", "delivery_mode", "registration_policy", "start_utc", "end_utc", "attendance_target", "attendance_cap", "supply_sku", "supply_units_per_attendee", "materials_budget_cents", "presenter_fee_budget_cents", "challenge_id?", "partner_type?", "partner_org_name?", "partner_insurance_expires_on?", "accessibility_accommodations?"]
    output: Program
    side_effects:
      - "operational_status := DRAFT; compliance_status := UNVERIFIED; serves_minors derived from age_group"
      - "budget_variance_cents := materials_budget_cents + presenter_fee_budget_cents; budget_posture := WITHIN_BUDGET"
      - "partner field coherence enforced (ERR_PARTNER_FIELDS_REQUIRED); window ordering enforced (ERR_INVALID_PROGRAM_WINDOW)"

  - method: POST
    path: "/library/programs/{program_id}/schedule"
    description: "Publish a DRAFT program to the calendar, optionally moving its window at the same time; a reschedule of a SCHEDULED program is also accepted"
    roles: [ProgramCoordinator, ProgramManager]
    code: 200
    input: ["start_utc?", "end_utc?"]
    output: Program
    side_effects:
      - "operational_status := SCHEDULED"
      - "when start_utc or end_utc is supplied the window moves and every HELD reservation of this program is RELEASED (a moved program must be re-booked)"
      - "increments Program.version by 1"

  - method: POST
    path: "/library/programs/{program_id}/reservations"
    description: "Reserve a room for a program. Requires expected_program_version — the version the caller observed when it computed the requested window. A prior HELD reservation of the same program is superseded."
    roles: [ProgramCoordinator, ProgramManager]
    code: 201
    input: [room_id, start_utc, end_utc, setup_minutes, teardown_minutes, expected_program_version]
    output: RoomReservation
    side_effects:
      - "expected_program_version must equal Program.version or the request fails with ERR_STALE_PROGRAM_VERSION (412)"
      - "occupancy_start_utc, occupancy_end_utc and effective_capacity_seats computed (calculations room_occupancy_interval and room_effective_capacity)"
      - "status := HELD; any other HELD reservation of the same program becomes SUPERSEDED"
      - "increments Program.version by 1"

  - method: POST
    path: "/library/reservations/{reservation_id}/confirm"
    description: "Confirm a held room reservation, fixing the program's confirmed_room_capacity"
    roles: [ProgramCoordinator, ProgramManager]
    code: 200
    input: []
    output: RoomReservation
    side_effects:
      - "status := CONFIRMED"
      - "Program.confirmed_room_capacity := effective_capacity_seats, which tightens the registration ceiling"
      - "increments Program.version by 1"

  - method: POST
    path: "/library/programs/{program_id}/registrations"
    description: "Register one party for a REGISTRATION-policy program; returns the updated program so the caller can observe registered_count"
    roles: [ProgramCoordinator, ProgramManager]
    code: 200
    input: ["registrant_reference", "seats?"]
    output: Program
    side_effects:
      - "seats defaults to 1; registered_count += seats; registrant_reference appended to registrant_references"
      - "capacity ceiling enforced against min(attendance_cap, confirmed_room_capacity) (ERR_PROGRAM_AT_CAPACITY)"
      - "increments Program.version by 1"

  - method: POST
    path: "/library/programs/{program_id}/confirm"
    description: "Confirm a scheduled program: checks partner insurance, the confirmed room, branch staffing load, supply availability and the materials budget, then draws the materials"
    roles: [ProgramManager]
    code: 200
    input: []
    output: Program
    side_effects:
      - "supply_draw_lines := calculation supply_draw_allocation; materials_committed_cents := calculation materials_commitment_with_contingency; materials_available_cents recomputed"
      - "each drawn InventoryLot moves units from quantity_available to quantity_reserved and becomes DEPLETED at 0"
      - "operational_status := CONFIRMED; budget_variance_cents and budget_posture recomputed; Branch.programs_over_budget_count adjusted on a posture flip"
      - "increments Program.version by 1"

  - method: POST
    path: "/library/programs/{program_id}/close-out"
    description: "Record attendance, walk-ins and survey returns after the program has ended; computes both attainment variants and settles the money"
    roles: [ProgramManager]
    code: 200
    input: [verified_registrant_attendance, drop_in_headcount, surveys_collected]
    output: Program
    side_effects:
      - "gross_attendance, no_show_count, survey_response_rate_pct, attendance_attainment_funder_pct and attendance_attainment_internal_pct computed (calculation program_attendance_attainment)"
      - "materials_committed_cents moves to materials_spent_cents; each drawn lot moves its units from quantity_reserved to quantity_issued"
      - "presenter_fee_committed_cents moves to presenter_fee_spent_cents and every EXECUTED contract of the program becomes COMPLETED"
      - "operational_status := CLOSED_OUT; every HELD or CONFIRMED reservation becomes RELEASED"
      - "increments Program.version by 1"

  - method: POST
    path: "/library/programs/{program_id}/weather-close"
    description: "Declare a weather closure before the program's end instant; fires CASCADE-A across contracts, money, reservations and the branch roll-up"
    roles: [ProgramManager]
    code: 200
    input: [closure_reason]
    output: Program
    side_effects:
      - "operational_status := WEATHER_CLOSED; closure_reason stored"
      - "CASCADE-A link 1: every contract with status IN {OFFERED, COUNTERED, EXECUTED} becomes CANCELLED_WEATHER with kill_fee_cents from calculation contract_cancellation_fee (WEATHER variant)"
      - "CASCADE-A link 2: presenter_fee_committed_cents := the sum of those kill fees"
      - "CASCADE-A link 3: budget_variance_cents and budget_posture recomputed"
      - "CASCADE-A link 4: Branch.programs_over_budget_count adjusted when link 3 flipped the posture"
      - "the supply draw is returned to its lots (materials_committed_cents := 0, DEPLETED lots reactivate) and every HELD or CONFIRMED reservation becomes RELEASED"
      - "increments Program.version by 1"

  - method: POST
    path: "/library/programs/{program_id}/cancel"
    description: "Cancel a program for library reasons; contracts settle at the notice-dependent library rate"
    roles: [ProgramManager]
    code: 200
    input: [closure_reason]
    output: Program
    side_effects:
      - "operational_status := CANCELLED; closure_reason stored"
      - "every contract with status IN {DRAFT, OFFERED, COUNTERED, EXECUTED} becomes CANCELLED_LIBRARY with kill_fee_cents from calculation contract_cancellation_fee (LIBRARY variant)"
      - "presenter_fee_committed_cents := the sum of those kill fees; budget_variance_cents, budget_posture and Branch.programs_over_budget_count recomputed"
      - "the supply draw is returned to its lots and every HELD or CONFIRMED reservation becomes RELEASED"
      - "increments Program.version by 1"

  # -------------------------------------------------- writes: presenter contracting
  - method: POST
    path: "/library/contracts"
    description: "Draft a presenter contract for a program with its reimbursable mileage"
    roles: [ProgramCoordinator, ProgramManager]
    code: 201
    input: [presenter_id, program_id, round_trip_miles]
    output: PresenterContract
    side_effects:
      - "status := DRAFT; negotiation_round := 0; every fee field 0"
      - "Program.compliance_status := PENDING_SCREENING when it was UNVERIFIED"

  - method: POST
    path: "/library/contracts/{contract_id}/offer"
    description: "Issue or re-issue the library's offer; each offer consumes one negotiation round and stamps the offering user for segregation of duties"
    roles: [ProgramCoordinator, ProgramManager]
    code: 200
    input: [offered_fee_cents]
    output: PresenterContract
    side_effects:
      - "status := OFFERED; offered_fee_cents stored; negotiation_round += 1; offered_by_user_id := X-User-Id (overwritten on every offer)"
      - "rejected with ERR_NEGOTIATION_ROUNDS_EXHAUSTED once negotiation_round would exceed MAX_NEGOTIATION_ROUNDS (3)"
      - "increments PresenterContract.version by 1"

  - method: POST
    path: "/library/contracts/{contract_id}/counter"
    description: "Record the presenter's counter-offer, returning the contract to the negotiation loop"
    roles: [ProgramCoordinator, ProgramManager]
    code: 200
    input: [countered_fee_cents]
    output: PresenterContract
    side_effects:
      - "status := COUNTERED; countered_fee_cents stored; negotiation_round unchanged"
      - "increments PresenterContract.version by 1"

  - method: POST
    path: "/library/contracts/{contract_id}/execute"
    description: "Execute the standing offer. Enforces segregation of duties, screening for programs serving minors, insurance validity, presenter travel-buffer conflicts and the fee cap, then prices the contract."
    roles: [ProgramManager]
    code: 200
    input: []
    output: PresenterContract
    side_effects:
      - "X-User-Id must differ from offered_by_user_id (ERR_SEGREGATION_OF_DUTIES)"
      - "agreed_fee_cents, travel_fee_cents, escort_fee_cents, insurance_rider_fee_cents, weekend_premium_cents and total_fee_cents computed (calculation contract_total_fee)"
      - "status := EXECUTED; executed_by_user_id := X-User-Id; Presenter.executed_contract_count += 1; Presenter.engagement_status := ACTIVE"
      - "Program.compliance_status := CLEARED; presenter_fee_committed_cents += total_fee_cents; budget_variance_cents, budget_posture and Branch.programs_over_budget_count recomputed"
      - "increments PresenterContract.version by 1 and Program.version by 1"

  # -------------------------------------------------- test-driving endpoint
  - method: POST
    path: "/_clock/set_current_utc"
    description: "Set the server's logical clock, which every window, expiry, notice and date rule reads. The clock's startup default is exactly 2026-08-01T00:00:00.000Z; before any call to this endpoint the server reports that instant and never falls back to real wall-clock time."
    roles: [ProgramManager, ProgramCoordinator, ScreeningOfficer, Reader]
    code: 200
    input: [current_utc]
    output: null
    side_effects:
      - "The logical clock is set to current_utc; no entity is mutated and no derived field is recomputed eagerly — screening_status and every window check re-derive from the new clock on their next read"

# =============================================================================
# §1.6 Error Code Catalog (61 codes)
# =============================================================================
errors:

  # ---- authentication / authorization ----
  - { id: ERR_UNAUTHENTICATED, http: 401, condition: "X-User-Id or X-User-Role header missing or empty" }
  - { id: ERR_UNAUTHORIZED, http: 403, condition: "X-User-Role is unrecognised, or is not listed in the target endpoint's roles" }
  - { id: ERR_NOT_RESOURCE_OWNER, http: 403, condition: "A Reader acts on a participant record whose id differs from their X-User-Id" }
  - { id: ERR_SEGREGATION_OF_DUTIES, http: 403, condition: "The user executing a contract is the same user who issued the standing offer" }

  # ---- request shape ----
  - { id: ERR_INVALID_REQUEST, http: 400, condition: "Missing required field, wrong type, unknown enum member, malformed ISO-8601 value, or a declared field constraint violated" }
  - { id: ERR_INVALID_PAGINATION, http: 400, condition: "limit outside [1, 100] or offset negative / non-integer" }

  # ---- existence ----
  - { id: ERR_BRANCH_NOT_FOUND, http: 404, condition: "branch_id or home_branch_id names no Branch" }
  - { id: ERR_ROOM_NOT_FOUND, http: 404, condition: "room_id names no Room" }
  - { id: ERR_PROGRAM_NOT_FOUND, http: 404, condition: "program_id names no Program" }
  - { id: ERR_RESERVATION_NOT_FOUND, http: 404, condition: "reservation_id names no RoomReservation" }
  - { id: ERR_PRESENTER_NOT_FOUND, http: 404, condition: "presenter_id names no Presenter" }
  - { id: ERR_CONTRACT_NOT_FOUND, http: 404, condition: "contract_id names no PresenterContract" }
  - { id: ERR_CHALLENGE_NOT_FOUND, http: 404, condition: "challenge_id names no ReadingChallenge" }
  - { id: ERR_PARTICIPANT_NOT_FOUND, http: 404, condition: "participant_id names no Participant" }
  - { id: ERR_LOG_ENTRY_NOT_FOUND, http: 404, condition: "entry_id or corrected_entry_id names no ReadingLogEntry" }
  - { id: ERR_LOT_NOT_FOUND, http: 404, condition: "lot_id names no InventoryLot" }
  - { id: ERR_AWARD_NOT_FOUND, http: 404, condition: "award_id names no TierAward" }

  # ---- optimistic concurrency ----
  - { id: ERR_STALE_PROGRAM_VERSION, http: 412, condition: "expected_program_version does not equal the current Program.version" }
  - { id: ERR_STALE_PARTICIPANT_VERSION, http: 412, condition: "expected_participant_version does not equal the current Participant.version" }

  # ---- state preconditions ----
  - { id: ERR_PROGRAM_STATE_INVALID, http: 409, condition: "Program.operational_status does not admit the requested transition" }
  - { id: ERR_RESERVATION_STATE_INVALID, http: 409, condition: "Reservation is not HELD when confirming, or the program already holds a CONFIRMED reservation" }
  - { id: ERR_CONTRACT_STATE_INVALID, http: 409, condition: "PresenterContract.status does not admit offer, counter or execute" }
  - { id: ERR_CHALLENGE_STATE_INVALID, http: 409, condition: "ReadingChallenge.status does not admit the action (tier append, open, reconcile, enrol, log, correct)" }
  - { id: ERR_SCREENING_STATE_INVALID, http: 409, condition: "Screening step posted out of order: request while already PENDING/ACTIVE, result while not PENDING, or adjudication while not FLAGGED" }
  - { id: ERR_PRESENTER_SUSPENDED, http: 409, condition: "Presenter.engagement_status == SUSPENDED blocks all contracting activity" }
  - { id: ERR_PROGRAM_COMPLIANCE_BLOCKED, http: 409, condition: "Program.compliance_status == BLOCKED blocks confirmation and further registrations; compliance_status == PENDING_SCREENING additionally blocks confirmation (registrations are unaffected)" }
  - { id: ERR_ROOM_OUT_OF_SERVICE, http: 409, condition: "The requested room's status is OUT_OF_SERVICE" }

  # ---- business: safety and compliance ----
  - { id: ERR_PRESENTER_SCREENING_REQUIRED, http: 422, condition: "A program serving minors is staffed by a presenter whose screening_status is not ACTIVE" }
  - { id: ERR_PRESENTER_INSURANCE_LAPSED, http: 422, condition: "The presenter's certificate expires before the program's end date" }
  - { id: ERR_PARTNER_INSURANCE_LAPSED, http: 422, condition: "A PARTNER_SITE program's partner certificate expires before the program's end date" }
  - { id: ERR_ACCESSIBILITY_UNSUPPORTED, http: 422, condition: "The reserved room lacks the accessibility feature the program's accommodations require" }
  - { id: ERR_SETUP_BUFFER_TOO_SHORT, http: 422, condition: "setup_minutes or teardown_minutes below the room's minimum (or below the 30-minute accessible-setup floor)" }

  # ---- business: temporal and referential constraints ----
  - { id: ERR_RESERVATION_WINDOW_MISMATCH, http: 422, condition: "The reservation window does not fully cover the program's public window" }
  - { id: ERR_ROOM_DOUBLE_BOOKED, http: 409, condition: "The candidate half-open occupancy interval intersects a HELD or CONFIRMED reservation of the same room" }
  - { id: ERR_NO_CONFIRMED_ROOM, http: 422, condition: "An IN_BRANCH program is confirmed without a CONFIRMED room reservation" }
  - { id: ERR_PRESENTER_DOUBLE_BOOKED, http: 409, condition: "The presenter's 90-minute closed travel window collides with another EXECUTED or COMPLETED contract" }
  - { id: ERR_BRANCH_STAFFING_CAPACITY_EXCEEDED, http: 422, condition: "Confirming would push the branch's overlapping CONFIRMED program count past overlapping_program_capacity" }
  - { id: ERR_INVALID_PROGRAM_WINDOW, http: 422, condition: "start_utc is not strictly before end_utc, or the window lies before the logical clock" }
  - { id: ERR_PARTNER_FIELDS_REQUIRED, http: 422, condition: "PARTNER_SITE program missing partner_type / partner_org_name / partner_insurance_expires_on, or an IN_BRANCH program supplying them" }

  # ---- business: registration and attendance ----
  - { id: ERR_DROP_IN_NO_REGISTRATION, http: 422, condition: "Registration attempted on a DROP_IN program" }
  - { id: ERR_REGISTRATION_WINDOW_CLOSED, http: 422, condition: "Registration attempted at or after the program's start instant" }
  - { id: ERR_DUPLICATE_REGISTRANT, http: 422, condition: "registrant_reference already present on the program" }
  - { id: ERR_PROGRAM_AT_CAPACITY, http: 422, condition: "The requested seats would exceed min(attendance_cap, confirmed_room_capacity)" }

  # ---- business: reading log ----
  - { id: ERR_LOG_SOURCE_NOT_PERMITTED, http: 422, condition: "A Reader posts a STAFF_DESK or OUTREACH_SITE entry" }
  - { id: ERR_LOG_DATE_OUTSIDE_WINDOW, http: 422, condition: "logged_on falls outside the challenge's inclusive [start_on, end_on] window" }
  - { id: ERR_LOG_DATE_IN_FUTURE, http: 422, condition: "logged_on is after the logical clock's date" }
  - { id: ERR_DAILY_LOG_CAP_EXCEEDED, http: 422, condition: "The participant's net units for that date would exceed the challenge's per-day cap" }
  - { id: ERR_CORRECTION_TARGET_INVALID, http: 422, condition: "corrected_entry_id is not a LOG entry of this participant, or has already been superseded" }
  - { id: ERR_CORRECTION_WOULD_GO_NEGATIVE, http: 422, condition: "units_delta is zero, or would drive the target entry's units below 0" }

  # ---- business: challenge ladder ----
  - { id: ERR_TIER_SEQUENCE_INVALID, http: 422, condition: "tier_index is not previous_max + 1, or threshold_units is not strictly greater than the previous tier's" }
  - { id: ERR_CHALLENGE_HAS_NO_TIERS, http: 422, condition: "A challenge with no IncentiveTier is opened" }
  - { id: ERR_CHALLENGE_WINDOW_STILL_OPEN, http: 422, condition: "Reconcile attempted while the clock's date is at or before end_on" }

  # ---- business: money ----
  - { id: ERR_NEGOTIATION_ROUNDS_EXHAUSTED, http: 422, condition: "A fourth offer is issued on a contract that already consumed MAX_NEGOTIATION_ROUNDS (3)" }
  - { id: ERR_FEE_CAP_EXCEEDED, http: 422, condition: "total_fee_cents exceeds min(PROGRAM_FEE_CAP_CENTS, Branch.per_program_fee_cap_cents)" }
  - { id: ERR_SUPPLY_INVENTORY_INSUFFICIENT, http: 422, condition: "The eligible SUPPLY lots cannot cover units_required in full" }
  - { id: ERR_MATERIALS_BUDGET_EXCEEDED, http: 422, condition: "draw subtotal plus contingency exceeds materials_budget_cents" }

  # ---- business: close-out and closure ----
  - { id: ERR_PROGRAM_NOT_YET_ENDED, http: 422, condition: "Close-out attempted before the program's end instant" }
  - { id: ERR_ATTENDANCE_EXCEEDS_REGISTRATIONS, http: 422, condition: "verified_registrant_attendance exceeds registered_count" }
  - { id: ERR_SURVEY_COUNT_EXCEEDS_ATTENDANCE, http: 422, condition: "surveys_collected exceeds gross attendance" }
  - { id: ERR_WEATHER_WINDOW_PASSED, http: 422, condition: "Weather closure declared at or after the program's end instant" }
  - { id: ERR_BRANCH_CODE_DUPLICATE, http: 422, condition: "branch_code already used by another Branch" }

# =============================================================================
# §1.7 RBAC Matrix (segregation of duties)
# =============================================================================
roles:

  - name: ProgramManager
    description: "Programming department head. Owns reference data, the challenge lifecycle, program confirmation and closure, and is the only role that may execute a presenter contract."
    identity: opaque
    exclusive_operations:
      - "POST /library/branches"
      - "POST /library/branches/{branch_id}/rooms"
      - "POST /library/inventory-lots"
      - "POST /library/reading-challenges"
      - "POST /library/reading-challenges/{challenge_id}/incentive-tiers"
      - "POST /library/reading-challenges/{challenge_id}/open"
      - "POST /library/reading-challenges/{challenge_id}/reconcile"
      - "POST /library/programs/{program_id}/confirm"
      - "POST /library/programs/{program_id}/close-out"
      - "POST /library/programs/{program_id}/weather-close"
      - "POST /library/programs/{program_id}/cancel"
      - "POST /library/contracts/{contract_id}/execute"
    shared_operations:
      - "POST /library/programs"
      - "POST /library/programs/{program_id}/schedule"
      - "POST /library/programs/{program_id}/reservations"
      - "POST /library/reservations/{reservation_id}/confirm"
      - "POST /library/programs/{program_id}/registrations"
      - "POST /library/presenters"
      - "POST /library/contracts"
      - "POST /library/contracts/{contract_id}/offer"
      - "POST /library/contracts/{contract_id}/counter"
      - "POST /library/participants"
      - "POST /library/participants/{participant_id}/log-entries"
      - "POST /library/participants/{participant_id}/log-corrections"
      - "POST /_clock/set_current_utc"
      - "all GET endpoints"
    notes: >-
      Segregation of duties is enforced on user id, not on role: a ProgramManager who issued the
      standing offer (offers are shared with ProgramCoordinator) cannot execute that same contract.
      A second ProgramManager user id must execute it.

  - name: ProgramCoordinator
    description: "Branch programming coordinator. Builds the calendar, books rooms, takes registrations, negotiates presenter fees and keeps the reading log on behalf of readers — but may never execute a contract or confirm a program."
    identity: opaque
    exclusive_operations: []
    shared_operations:
      - "POST /library/programs"
      - "POST /library/programs/{program_id}/schedule"
      - "POST /library/programs/{program_id}/reservations"
      - "POST /library/reservations/{reservation_id}/confirm"
      - "POST /library/programs/{program_id}/registrations"
      - "POST /library/presenters"
      - "POST /library/contracts"
      - "POST /library/contracts/{contract_id}/offer"
      - "POST /library/contracts/{contract_id}/counter"
      - "POST /library/participants"
      - "POST /library/participants/{participant_id}/log-entries"
      - "POST /library/participants/{participant_id}/log-corrections"
      - "POST /_clock/set_current_utc"
      - "all GET endpoints except GET /library/branches/{branch_id} is shared with ScreeningOfficer"

  - name: ScreeningOfficer
    description: "Human-resources screening officer. Sole owner of the background-screening workflow for programs involving minors; touches nothing else."
    identity: opaque
    exclusive_operations:
      - "POST /library/presenters/{presenter_id}/screening-requests"
      - "POST /library/presenters/{presenter_id}/screening-results"
      - "POST /library/presenters/{presenter_id}/adjudications"
    shared_operations:
      - "GET /library/presenters/{presenter_id}"
      - "GET /library/branches/{branch_id}"
      - "POST /_clock/set_current_utc"

  - name: Reader
    description: "A registered summer-reading participant acting for themselves. May self-log and read their own record only."
    identity: "entity_backed:Participant"
    exclusive_operations: []
    shared_operations:
      - "POST /library/participants/{participant_id}/log-entries"
      - "GET /library/participants/{participant_id}"
      - "POST /_clock/set_current_utc"
    notes: >-
      X-User-Id MUST equal the Participant.id the path names (ERR_NOT_RESOURCE_OWNER otherwise), and a
      Reader may only post source == SELF_SERVICE entries (ERR_LOG_SOURCE_NOT_PERMITTED otherwise).
      Corrections are never available to a Reader — only staff may adjust a ledger.
