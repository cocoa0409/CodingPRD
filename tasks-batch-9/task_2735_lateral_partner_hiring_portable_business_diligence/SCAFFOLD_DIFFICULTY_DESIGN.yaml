      - name: engagement_temporal_geometry_outranks_fee_pct_constraint
        grounds:
          - validations[priority=17]
          - validations[priority=22]
          - errors[ERR_ENGAGEMENT_EXCLUSIVITY_CONFLICT]
          - errors[ERR_FEE_PCT_ABOVE_FIRM_MAX]
          - entities.SearchFirm.fields.max_fee_pct
        distinguishing_aspect: |
          Error-category pair = business_temporal (priority 17,
          ERR_ENGAGEMENT_EXCLUSIVITY_CONFLICT, 409) versus business_constraint (priority 22,
          ERR_FEE_PCT_ABOVE_FIRM_MAX, 422) — a third distinct pair. fee_pct 0.4000 is a
          legal value in its own numeric domain, so priority 4 cannot intercept it; only the
          cross-entity comparison against SearchFirm.max_fee_pct 0.3000 can. The first
          request violates the exclusivity geometry AND the fee ceiling and must return the
          409; moving the window past the tail-off gap leaves only the 422.
