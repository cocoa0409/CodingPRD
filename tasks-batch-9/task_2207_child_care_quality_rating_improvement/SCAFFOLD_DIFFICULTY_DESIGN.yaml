      - name: observer_same_provider_48h_cooldown_buffer
        grounds:
          - validations[priority=41]
          - validations[priority=43]
          - calculations.validity_period
          - entities.ObservationVisit.fields.window_end
          - state_machines.RatingCycle.AWARDED_to_ACTIVE
        distinguishing_aspect: |
          Resource = Observer, but the interval semantics here is the BUFFERED variant of
          priority 41: because the existing FINALIZED visit belongs to the SAME provider, a new
          window that is geometrically disjoint (starting 39 hours after the existing window
          ended) is still REJECTED with 409 ERR_OBSERVER_SCHEDULE_CONFLICT since
          2028-06-12T08:00:00Z < 2028-06-10T17:00:00Z + 48h, while a window starting exactly at
          2028-06-12T17:00:00Z is ACCEPTED because the buffer comparison is strict <.
        test_recipe:
          setup:
            - "logical clock starts pinned at 2026-08-01T00:00:00Z, then moves to 2026-09-01T00:00:00Z, then to 2028-06-02T00:00:00Z"
            - "all 5 StandardDomain rows exist with weights 0.20 each"
            - "one RELIABLE Observer obs_lead certified_until 2029-12-31"
            - "one Provider whose INITIAL cycle is AWARDED with awarded_tier 1, weighted_total 37.00, effective_date 2026-09-01T00:00:00.000Z, expires_on 2028-08-31T23:59:59.999Z, validity_months 24, rerating_window_opens_on 2028-06-02T00:00:00.000Z"
            - "its FINALIZED ObservationVisit occupies [2028-06-10T09:00:00Z, 2028-06-10T17:00:00Z) and stays in the priority-41 candidate set because FINALIZED is a candidate status"
            - "an expiry run at clock 2026-09-01 promoted the cycle AWARDED -> ACTIVE and the Provider ENROLLED -> ACTIVE with current_tier 1"
            - "at clock 2028-06-02 (exactly rerating_window_opens_on) a RERATING cycle was opened and driven to DOCS_VERIFIED"
