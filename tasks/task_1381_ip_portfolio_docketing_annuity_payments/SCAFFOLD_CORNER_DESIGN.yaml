              as_user_id: mgr-1
              captures: { err_stale: $.data.error_id }

          assert:
            - "rv_id is a created review id"
            - "app_v2 == app_v1 + 1 (review creation increments the application version)"
            - "err_stale == ERR_STALE_VERSION"

      - name: sweep_noop_before_deadline_then_lapses
        claim_type: scheduled_actions
        grounds: ["\"endpoints.\"POST /docket-sweeps\"\"\"", "state_machines.DocketEntry.PENDING_to_LAPSED", "state_machines.AnnuityObligation.SCHEDULED_to_LAPSED"]
        distinguishing_aspect: "Deferred execution is clock-gated: with clock 2026-08-02 the sweep lapses nothing (entry due 2026-08-03 not yet past; obligation window ends 2029-03-01); advancing the clock to 2026-08-04 lapses exactly the overdue entry — same sweep, different logical date."
        test_recipe:
          setup: ["Clock 2026-08-01; US rule; client; family; PENDING app with manual STATUTORY entry due 2026-08-03; GRANTED app2 (grant 2026-03-01) with obligations"]
          setup_api_calls:
