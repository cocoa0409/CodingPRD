  - rule_id: transitive_cascade
    instances:

      - name: sustained_severe_case_cascades_five_links_case_student_slot_team_match
        depth: 5
        grounds:
          - state_machines.FairPlayCase.INVESTIGATING_to_SUSTAINED
          - state_machines.RosterSlot.participation_ACTIVE_to_INELIGIBLE
          - state_machines.Team.COMPETING_to_SUSPENDED
          - state_machines.Match.play_SCHEDULED_to_FORFEITED
          - calculations.team_integrity_score
          - calculations.match_point_award
          - conserved_quantity_invariants.season_match_point_pool_conservation
        distinguishing_aspect: |
          A five-link causal chain, each link caused by the previous one and not by the
          triggering call: (1) the case is SUSTAINED and team_integrity_score plus the
          sanction ladder produce sanction_type TEAM_SUSPENSION, which (2) sanctions the named
          student, which (3) demotes that student's ACTIVE slot to INELIGIBLE, which (4)
          suspends the Team — here via the sanction path, not roster starvation, because
          Alpha keeps a second active starter and stays at or above min_starters — which (5)
          forfeits Alpha's scheduled match, credits the opponent 3 points and raises the
          season pool. Cutting any link leaves the later ones unreachable, so it cannot be
          satisfied by a fan-out of independent effects from the trigger.
