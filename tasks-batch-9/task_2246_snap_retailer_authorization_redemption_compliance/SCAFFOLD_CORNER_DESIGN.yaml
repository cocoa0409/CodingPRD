      - name: pos_basket_is_written_atomically_with_flagged_lines_in_request_order
        claim_type: Bulk action
        grounds:
          - endpoints.POST_/pos-transactions
          - calculations.pos_eligibility_split_tender
          - entities.PosTransaction.flagged_line_skus
        distinguishing_aspect: "The only multi-item write in the API is all-or-nothing over its lines: a five-line basket mixing three ineligible classes is scored in one shot - eligible 997, ineligible 2745, tax 226 at 825 bps applied once to the sum, other tender clamped to the required 2971 out of a 5000 offer - and flagged_line_skus preserves request order rather than sorting or grouping."
