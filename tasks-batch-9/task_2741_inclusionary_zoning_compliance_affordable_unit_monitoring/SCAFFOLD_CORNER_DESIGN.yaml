      - name: excluded_precision_reassociation_of_the_rent_ceiling
        claim_type: precision
        grounds:
          - calculations.max_allowed_rent
        excluded_because:
          difficulty_instance: max_allowed_rent_pinned_rounding_order_yields_one_cent_less
          rationale: |
            The only precision claim worth pinning in this scaffold is the mandated rounding
            ORDER inside max_allowed_rent (annual income limit rounded to whole dollars, then
            integer-divided by 12, then the 30 percent share rounded half up, then the utility
            allowance subtracted). §1.8 already asserts the exact 143872 result against the
            143873 that any reassociation of those steps produces, together with the 2028
            counterpart. A separate corner instance would restate the same arithmetic with no
            new discriminating power.

      - name: excluded_variant_divergence_of_the_two_resale_formulas
        claim_type: variant_divergence
        grounds:
          - calculations.max_resale_price
        excluded_because:
          difficulty_instance: resale_price_ami_indexed_vs_shared_appreciation_diverge
          rationale: |
            §1.8 already drives both max_resale_price variants from one identical unit and
            transaction after advancing the AMI schedule to 2028, showing 36872471 against
            36725000 for a 147471 spread. The corner file keeps only the complementary
            variant_selection claim (that the branch is read from the agreement, not the
            payload), which is a different failure mode from getting one variant's arithmetic wrong.

      - name: excluded_dual_metric_reconciliation_on_the_funder_report
        claim_type: reconciliation
        grounds:
          - calculations.funder_report_metrics
        excluded_because:
          difficulty_instance: funder_report_entitlement_vs_occupancy_diverge
          rationale: |
            The ENTITLEMENT and OCCUPANCY bases of the funder report are reconciled against the
            same total_obligation_bps denominator in §1.8, where delivered and occupied
            equivalents diverge (2500 bps against 1250 bps of the same 80000 bps obligation).
            Reconciliation has no independent corner: it is exactly the §1.8 assertion.

      - name: excluded_interval_merge_boundary_on_certification_periods
        claim_type: boundary_interval_merge
        grounds:
          - calculations.certification_period_overlap
        excluded_because:
          difficulty_instance: certification_period_touching_endpoint_collides_on_unit
          rationale: |
            The half-open versus closed-interval question for certification terms is settled in
            §1.8, where a new period starting exactly on the predecessor's expires_at is rejected
            while a period starting one day later is accepted. The marketing-window counterpart is
            covered by marketing_window_exact_adjacency_accepted_on_project. Both endpoints of
            both interval families are therefore already pinned.

      - name: excluded_threshold_boundary_on_project_size_and_refinance_cap
        claim_type: boundary_threshold
        grounds:
          - calculations.required_units_and_fraction
          - calculations.refinance_capacity
        excluded_because:
          difficulty_instance: project_size_threshold_inclusive_at_ten_units
          rationale: |
            Inclusivity at the two headline thresholds is already pinned in §1.8: 10 units against
            a min_project_units_threshold of 10 screens SUBJECT while 9 screens EXEMPT, and
            refinance_cap_inclusive_at_exact_ltv_ceiling accepts a requested balance equal to the
            LTV ceiling to the cent. The corner file keeps only the distinct comparability-floor
            constant boundary, whose comparison direction (sqft strictly below the floor) is
            independent of both.

  # ===========================================================================
  # SECTION 4 — Validations (Table 4 rows). One instance per cluster of rules
  # that share a setup; every negative trigger names the exact error_id and the
  # rule priority that must win, and each instance states which lower-priority
  # rule would have fired if the ladder were mis-ordered.
  # ===========================================================================
  - section: validations
    instances:
      - name: bootstrap_guards_reject_screening_election_and_restriction
        claim_type: violation_to_error
        grounds:
          - validations.priority_26
          - validations.priority_27
          - validations.priority_28
          - errors[ERR_NO_GOVERNING_ORDINANCE]
          - errors[ERR_NO_AMI_SCHEDULE]
          - errors[ERR_PATH_NOT_PERMITTED]
        distinguishing_aspect: |
          The three reference-data guards fire in three different places and for two different
          reasons. Screening with no ordinance at all and screening a project approved BEFORE the
          only published vintage both yield ERR_NO_GOVERNING_ORDINANCE, which shows the guard is
          vintage selection by approval_date rather than a mere table-empty check. Electing
          LAND_DEDICATION — a member of the compliance_path enum, so ERR_INVALID_REQUEST cannot
          preempt it — is refused because the governing ordinance does not list it. Recording a
          deed restriction with no AmiSchedule published is refused at priority 27 even though
          every state precondition is satisfied, because ami_income_at_purchase_cents cannot be
          pinned without a schedule.
        test_recipe:
          setup:
            - "Clock at 2026-08-01T00:00:00Z. NOTHING else is published: no Ordinance and no AmiSchedule exist."
            - "Project P0 (R-2, 20 units, approval 2026-01-15) and project P1 (R-2, 20 units, approval 2023-06-01) created by dev-1."
            - "Ordinance IZ-2024-01 (effective 2024-01-01) is published only after the first screening attempt; no AmiSchedule is ever published in this instance."
          setup_api_calls:
            - { call: "POST /_clock/set_current_utc", payload: { current_utc: "2026-08-01T00:00:00Z" }, as: ProgramAdministrator }
            - { call: "POST /iz-compliance/projects", payload: { name: "No Reference Data", zoning_district: "R-2", total_units: 20, approval_date: "2026-01-15" }, as: Developer, as_user_id: "dev-1", captures: { p0_id: $.data.id } }
            - { call: "POST /iz-compliance/projects", payload: { name: "Approved Too Early", zoning_district: "R-2", total_units: 20, approval_date: "2023-06-01" }, as: Developer, as_user_id: "dev-1", captures: { p1_id: $.data.id } }
          trigger:
            - { call: "POST /iz-compliance/projects/${p0_id}/screen", payload: {}, as: HousingComplianceOfficer, as_user_id: "hco-1", captures: { err_no_ord_empty: $.data.error_id } }
            - { call: "POST /iz-compliance/ordinances", payload: { code: "IZ-2024-01", effective_date: "2024-01-01", min_project_units_threshold: 10, set_aside_bps_by_district: { "R-2": 1000, "R-4": 1500, "C-2": 2000 }, gap_basis_cents_by_level: { "5000": 24000000, "8000": 18000000, "12000": 12000000 }, fee_gap_level_bps: 5000, surcharge_bps: 350, surcharge_cap_cents: 5000000, discount_tiers: [ { min_pre_discount_cents: 0, discount_bps: 0 }, { min_pre_discount_cents: 20000000, discount_bps: 150 }, { min_pre_discount_cents: 100000000, discount_bps: 400 } ], fee_due_days: 45, alternative_paths_allowed: ["IN_LIEU_FEE", "OFFSITE"] }, as: ProgramAdministrator, captures: { ord_id: $.data.id } }
            - { call: "POST /iz-compliance/projects/${p1_id}/screen", payload: {}, as: HousingComplianceOfficer, as_user_id: "hco-1", captures: { err_no_ord_vintage: $.data.error_id } }
            - { call: "POST /iz-compliance/projects/${p0_id}/screen", payload: {}, as: HousingComplianceOfficer, as_user_id: "hco-1" }
            - { call: "POST /iz-compliance/projects/${p0_id}/elect-path", payload: { compliance_path: "LAND_DEDICATION" }, as: Developer, as_user_id: "dev-1", captures: { err_path: $.data.error_id } }
            - { call: "POST /iz-compliance/projects/${p0_id}/elect-path", payload: { compliance_path: "ONSITE" }, as: Developer, as_user_id: "dev-1" }
            - { call: "POST /iz-compliance/regulatory-agreements", payload: { project_id: "${p0_id}", term_years: 45, resale_formula: "AMI_INDEXED", owner_appreciation_share_bps: 2500, max_refinance_ltv_bps: 9000 }, as: HousingComplianceOfficer, as_user_id: "hco-1", captures: { a_id: $.data.id } }
            - { call: "POST /iz-compliance/regulatory-agreements/${a_id}/record", payload: { doc_number: "DOC-NR-0001", recorded_at: "2026-08-01" }, as: HousingComplianceOfficer, as_user_id: "hco-1" }
            - { call: "POST /iz-compliance/affordable-units", payload: { project_id: "${p0_id}", agreement_id: "${a_id}", unit_number: "NR-101", bedrooms: 2, sqft: 900, market_comparable_sqft: 1000, tenure: "OWNERSHIP", affordability_level_bps: 5000 }, as: Developer, as_user_id: "dev-1", captures: { u_id: $.data.id } }
            - { call: "POST /iz-compliance/affordable-units/${u_id}/record-restriction", payload: { original_purchase_price_cents: 32500000, recorded_at: "2026-08-01" }, as: HousingComplianceOfficer, as_user_id: "hco-1", captures: { err_no_ami: $.data.error_id } }
          assert:
            - "the first screen returns 422 ERR_NO_GOVERNING_ORDINANCE and leaves Project.${p0_id}.state DRAFT with applicability PENDING and screen_count 0"
            - "P1's screen returns 422 ERR_NO_GOVERNING_ORDINANCE even though IZ-2024-01 now exists — its effective_date 2024-01-01 is after the 2023-06-01 approval, so vintage selection finds nothing"
            - "P0's second screen returns 200 SCREENED_SUBJECT with required_affordable_units 2 and total_obligation_bps 20000 — the same call succeeds once a vintage governs it"
            - "electing LAND_DEDICATION returns 422 ERR_PATH_NOT_PERMITTED, NOT 400 ERR_INVALID_REQUEST: the value is inside the compliance_path enum but outside the ordinance's alternative_paths_allowed"
            - "Project.${p0_id}.compliance_path stays null after the refused election and is ONSITE after the accepted one"
            - "record-restriction returns 422 ERR_NO_AMI_SCHEDULE and AffordableUnit.${u_id}.restriction_state stays NOT_RECORDED with ami_income_at_purchase_cents null"
            - "the record-restriction failure is priority 27, not 11 or 53: restriction_state is NOT_RECORDED and tenure is OWNERSHIP, so both higher rules pass"

      - name: uniqueness_is_enforced_per_parent_where_the_rule_declares_a_scope
        claim_type: violation_to_error
        grounds:
          - validations.priority_29
          - errors[ERR_DUPLICATE_RESOURCE]
        distinguishing_aspect: |
          Priority 29 covers five different uniqueness scopes and two of them are global while one
          is scoped to a parent. Re-publishing Ordinance.code and AmiSchedule.effective_year is
          refused globally; re-using a unit_number is refused inside the same project but ACCEPTED
          in a different project, which is the discriminating pair. RegulatoryAgreement.doc_number
          is global, so recording a second project's agreement under the first project's document
          number is refused — and that has to be probed on a third project still in PATH_ELECTED,
          because a second record on an already-recorded project is stopped earlier by priority 9.
        test_recipe:
          setup:
            - "Clock at 2026-08-01T00:00:00Z; ordinance IZ-2024-01 and AmiSchedule 2026 published."
            - "Projects PA and PB (both R-2, 20 units, approval 2026-01-15, dev-1) screened SUBJECT, ONSITE elected, agreements recorded under DOC-DP-0001 and DOC-DP-0002."
            - "Project PC (R-2, 20 units, dev-2) screened SUBJECT, ONSITE elected, agreement created but NOT recorded, so PC is still in PATH_ELECTED."
            - "Unit DUP-101 already exists on PA."
