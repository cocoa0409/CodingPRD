# =============================================================================
# §1.8 Scaffold Difficulty Design — Test Targeting Index
# Task 1905: Private School Admissions & Tuition Assistance
# 9 rules x 2 instances = 18 instances. Every chain replays from empty DB;
# logical clock defaults to 2026-08-01T00:00:00Z unless set by the chain.
# =============================================================================
scaffold_difficulty_design:
  # ---------------------------------------------------------------- Rule 1
  - rule_id: dual_variant_calc
    instances:
      - name: aid_award_provisional_vs_final_diverge
        grounds:
          - calculations.aid_award_amount
          - entities.AidApplication.fields.provisional_award_cents
          - entities.AidApplication.fields.final_award_cents
        distinguishing_aspect: |
          Aid-award domain: the same tiered-EFC formula runs on reported income
          (provisional variant, at submission) and on verified income (final variant,
          at finalize); with reported 9,500,000 and verified 12,000,000 the two
          variants yield 2,370,000 vs 1,820,000 for identical household/tuition inputs.
        test_recipe:
          setup:
            - "OPEN cycle 2027-2028 (budget 18,050,000), G9 section capacity 10 tuition 3,000,000 pct 0.5"
            - "fam-a applicant with an EARLY application in SUBMITTED status"
            - "AidApplication: reported 9,500,000 household 4 -> provisional 2,370,000"
          setup_api_calls:
            - { call: "POST /admissions/cycles", payload: { academic_year: "2027-2028", early_deadline_at: "2026-11-01T00:00:00Z", regular_deadline_at: "2027-01-15T00:00:00Z", reenroll_response_deadline_at: "2027-03-01T00:00:00Z", melt_deadline_at: "2027-08-01T00:00:00Z", aid_budget_total_cents: 18050000 }, as: AdmissionDirector, captures: { cyc: $.data.id } }
            - { call: "POST /admissions/grade-sections", payload: { cycle_id: "${cyc}", grade_level: "G9", capacity: 10, tuition_cents: 3000000, max_aid_seat_pct: 0.5 }, as: AdmissionDirector, captures: { sec: $.data.id } }
            - { call: "POST /admissions/cycles/${cyc}/open", payload: {}, as: AdmissionDirector }
            - { call: "POST /admissions/applicants", payload: { family_id: "fam-a", first_name: "Ann", last_name: "Able", date_of_birth: "2013-05-01" }, as: Parent, as_user_id: "fam-a", captures: { apl: $.data.id } }
            - { call: "POST /admissions/applications", payload: { applicant_id: "${apl}", cycle_id: "${cyc}", grade_section_id: "${sec}", round: "EARLY" }, as: Parent, as_user_id: "fam-a", captures: { app: $.data.id } }
            - { call: "POST /admissions/applications/${app}/submit", payload: {}, as: Parent, as_user_id: "fam-a" }
            - { call: "POST /admissions/aid-applications", payload: { application_id: "${app}", reported_annual_income_cents: 9500000, household_size: 4 }, as: Parent, as_user_id: "fam-a", captures: { aid: $.data.id } }
          trigger:
            - { call: "POST /admissions/aid-applications/${aid}/verify", payload: { verified_annual_income_cents: 12000000 }, as: FinancialAidOfficer, as_user_id: "fao-1" }
            - { call: "POST /admissions/aid-applications/${aid}/finalize-award", payload: {}, as: FinancialAidOfficer, as_user_id: "fao-2" }
          assert:
            - "AidApplication.${aid}.provisional_award_cents == 2370000 (EFC 630,000 on reported 9,500,000)"
            - "AidApplication.${aid}.final_award_cents == 1820000 (EFC 1,180,000 on verified 12,000,000)"
            - "AidApplication.${aid}.final_award_cents != AidApplication.${aid}.provisional_award_cents"
            - "AidApplication.${aid}.verification_status == VERIFIED and award_status == OFFERED"

      - name: deposit_estimate_vs_contract_final_diverge
        grounds:
          - calculations.deposit_amount
          - entities.Application.fields.estimated_deposit_cents
          - entities.EnrollmentContract.fields.deposit_amount_cents
        distinguishing_aspect: |
          Deposit domain (distinct from the aid-award domain of the sibling instance):
          the offer letter's estimated deposit uses the provisional award (630,000 net ->
          63,000) while the issued contract's deposit uses the accepted final award
          (1,180,000 net -> 118,000); identical tuition, divergent variants.
        test_recipe:
          setup:
            - "Same world as aid_award_provisional_vs_final_diverge, plus: both evaluations SCORED (80 test, 90 interview, no preferences -> composite 84.0)"
            - "Clock 2026-11-02; close-round EARLY -> application OFFERED with estimated_deposit_cents == 63000"
          setup_api_calls:
            - { call: "POST /admissions/cycles", payload: { academic_year: "2027-2028", early_deadline_at: "2026-11-01T00:00:00Z", regular_deadline_at: "2027-01-15T00:00:00Z", reenroll_response_deadline_at: "2027-03-01T00:00:00Z", melt_deadline_at: "2027-08-01T00:00:00Z", aid_budget_total_cents: 18050000 }, as: AdmissionDirector, captures: { cyc: $.data.id } }
            - { call: "POST /admissions/grade-sections", payload: { cycle_id: "${cyc}", grade_level: "G9", capacity: 10, tuition_cents: 3000000, max_aid_seat_pct: 0.5 }, as: AdmissionDirector, captures: { sec: $.data.id } }
            - { call: "POST /admissions/cycles/${cyc}/open", payload: {}, as: AdmissionDirector }
            - { call: "POST /admissions/applicants", payload: { family_id: "fam-a", first_name: "Ann", last_name: "Able", date_of_birth: "2013-05-01" }, as: Parent, as_user_id: "fam-a", captures: { apl: $.data.id } }
            - { call: "POST /admissions/applications", payload: { applicant_id: "${apl}", cycle_id: "${cyc}", grade_section_id: "${sec}", round: "EARLY" }, as: Parent, as_user_id: "fam-a", captures: { app: $.data.id } }
            - { call: "POST /admissions/applications/${app}/submit", payload: {}, as: Parent, as_user_id: "fam-a" }
            - { call: "POST /admissions/aid-applications", payload: { application_id: "${app}", reported_annual_income_cents: 9500000, household_size: 4 }, as: Parent, as_user_id: "fam-a", captures: { aid: $.data.id } }
            - { call: "POST /admissions/aid-applications/${aid}/verify", payload: { verified_annual_income_cents: 12000000 }, as: FinancialAidOfficer, as_user_id: "fao-1" }
            - { call: "POST /admissions/aid-applications/${aid}/finalize-award", payload: {}, as: FinancialAidOfficer, as_user_id: "fao-2" }
            - { call: "POST /admissions/test-sessions", payload: { cycle_id: "${cyc}", session_start: "2026-10-10T09:00:00Z", session_end: "2026-10-10T12:00:00Z", room_capacity: 5 }, as: AdmissionDirector, captures: { tss: $.data.id } }
            - { call: "POST /admissions/evaluations", payload: { application_id: "${app}", kind: "TEST", scheduled_start: "2026-10-10T09:00:00Z", scheduled_end: "2026-10-10T10:00:00Z", test_session_id: "${tss}" }, as: AdmissionOfficer, captures: { evt: $.data.id } }
            - { call: "POST /admissions/evaluations", payload: { application_id: "${app}", kind: "INTERVIEW", scheduled_start: "2026-10-12T10:00:00Z", scheduled_end: "2026-10-12T11:00:00Z", interviewer_id: "int-7" }, as: AdmissionOfficer, captures: { evi: $.data.id } }
            - { call: "POST /admissions/evaluations/${evt}/score", payload: { score: 80 }, as: AdmissionOfficer }
            - { call: "POST /admissions/evaluations/${evi}/score", payload: { score: 90 }, as: AdmissionOfficer }
            - { call: "POST /_clock/set_current_utc", payload: { to_iso8601: "2026-11-02T00:00:00Z" }, as: AdmissionDirector }
            - { call: "POST /admissions/cycles/${cyc}/close-round", payload: { round: "EARLY" }, as: AdmissionDirector }
          trigger:
            - { call: "POST /admissions/aid-applications/${aid}/accept-award", payload: {}, as: Parent, as_user_id: "fam-a" }
            - { call: "POST /admissions/applications/${app}/issue-contract", payload: {}, as: AdmissionOfficer, captures: { con: $.data.id } }
          assert:
            - "Application.${app}.estimated_deposit_cents == 63000 (provisional variant: max(50000, 10% of (3,000,000 - 2,370,000)))"
            - "EnrollmentContract.${con}.deposit_amount_cents == 118000 (final variant: max(50000, 10% of (3,000,000 - 1,820,000)))"
            - "EnrollmentContract.${con}.net_tuition_cents == 1180000 and award_cents == 1820000 and tuition_cents == 3000000"
            - "EnrollmentContract.${con}.response_due_at == 2026-11-16T00:00:00Z (issuance clock + 14 days)"

  # ---------------------------------------------------------------- Rule 2
  - rule_id: combinatorial_formula
    instances:
      - name: aid_award_tiered_efc_crossing_tiers
        grounds:
          - calculations.aid_award_amount
          - validations[priority=2.8]
        distinguishing_aspect: |
          Mode (a): a formula with 3+ inputs (income, household_size, tuition) and
          non-linear tiered-rate interaction: household 1, income 11,000,000 crosses
          all three EFC tiers (300,000 + 1,100,000 + 75,000 = 1,475,000 EFC) and the
          90%-of-tuition cap does not bind against tuition 4,000,000 -> award 2,525,000.
        test_recipe:
          setup:
            - "OPEN cycle, G10 section tuition 4,000,000 capacity 10 pct 0.5"
            - "fam-b applicant with REGULAR application SUBMITTED"
            - "AidApplication reported 11,000,000 household 1 -> provisional 2,525,000 already computed at create"
          setup_api_calls:
            - { call: "POST /admissions/cycles", payload: { academic_year: "2027-2028", early_deadline_at: "2026-11-01T00:00:00Z", regular_deadline_at: "2027-01-15T00:00:00Z", reenroll_response_deadline_at: "2027-03-01T00:00:00Z", melt_deadline_at: "2027-08-01T00:00:00Z", aid_budget_total_cents: 18050000 }, as: AdmissionDirector, captures: { cyc: $.data.id } }
            - { call: "POST /admissions/grade-sections", payload: { cycle_id: "${cyc}", grade_level: "G10", capacity: 10, tuition_cents: 4000000, max_aid_seat_pct: 0.5 }, as: AdmissionDirector, captures: { sec: $.data.id } }
            - { call: "POST /admissions/cycles/${cyc}/open", payload: {}, as: AdmissionDirector }
            - { call: "POST /admissions/applicants", payload: { family_id: "fam-b", first_name: "Ben", last_name: "Baker", date_of_birth: "2012-02-02" }, as: Parent, as_user_id: "fam-b", captures: { apl: $.data.id } }
            - { call: "POST /admissions/applications", payload: { applicant_id: "${apl}", cycle_id: "${cyc}", grade_section_id: "${sec}", round: "REGULAR" }, as: Parent, as_user_id: "fam-b", captures: { app: $.data.id } }
            - { call: "POST /admissions/applications/${app}/submit", payload: {}, as: Parent, as_user_id: "fam-b" }
            - { call: "POST /admissions/aid-applications", payload: { application_id: "${app}", reported_annual_income_cents: 11000000, household_size: 1 }, as: Parent, as_user_id: "fam-b", captures: { aid: $.data.id } }
          trigger:
            - { call: "POST /admissions/aid-applications/${aid}/verify", payload: { verified_annual_income_cents: 11000000 }, as: FinancialAidOfficer, as_user_id: "fao-1" }
            - { call: "POST /admissions/aid-applications/${aid}/finalize-award", payload: {}, as: FinancialAidOfficer, as_user_id: "fao-2" }
          assert:
            - "AidApplication.${aid}.final_award_cents == 2525000 (allowance 3,250,000; discretionary 7,750,000; EFC 300,000+1,100,000+75,000 = 1,475,000; need 2,525,000; cap 3,600,000 not binding)"
            - "AidApplication.${aid}.provisional_award_cents == 2525000 (reported == verified here; tier-3 term is the discriminator vs a 2-tier implementation)"

      - name: reenrollment_sibling_discount_per_line_rounding
        grounds:
          - calculations.reenrollment_family_total
          - entities.ReenrollmentOffer.fields.sibling_discount_cents
        distinguishing_aspect: |
          Mode (b) nested rounding (distinct from mode (a) of the sibling instance):
          each additional-sibling discount is rounded per line BEFORE summation —
          two siblings at tuition 2,833,333 each give 283,333 + 283,333 = 566,666 total
          discount, whereas rounding 10% of the aggregate would give 566,667; the pinned
          order yields a family total of exactly 8,300,000.
        test_recipe:
          setup:
            - "Current cycle 2026-2027 with sections G9 (3,000,000), G5 (2,800,000), G3 (2,600,000); target cycle 2027-2028 with sections G10 (3,200,000), G6 (2,833,333), G4 (2,833,333)"
            - "fam-r ACTIVE students created in order: st1 (G9, senior), st2 (G5), st3 (G3)"
          setup_api_calls:
            - { call: "POST /admissions/cycles", payload: { academic_year: "2026-2027", early_deadline_at: "2025-11-01T00:00:00Z", regular_deadline_at: "2026-01-15T00:00:00Z", reenroll_response_deadline_at: "2026-03-01T00:00:00Z", melt_deadline_at: "2026-08-01T00:00:00Z", aid_budget_total_cents: 0 }, as: AdmissionDirector, captures: { cycC: $.data.id } }
            - { call: "POST /admissions/cycles", payload: { academic_year: "2027-2028", early_deadline_at: "2026-11-01T00:00:00Z", regular_deadline_at: "2027-01-15T00:00:00Z", reenroll_response_deadline_at: "2027-03-01T00:00:00Z", melt_deadline_at: "2027-08-01T00:00:00Z", aid_budget_total_cents: 18050000 }, as: AdmissionDirector, captures: { cycN: $.data.id } }
            - { call: "POST /admissions/grade-sections", payload: { cycle_id: "${cycC}", grade_level: "G9", capacity: 20, tuition_cents: 3000000, max_aid_seat_pct: 1.0 }, as: AdmissionDirector, captures: { secC9: $.data.id } }
            - { call: "POST /admissions/grade-sections", payload: { cycle_id: "${cycC}", grade_level: "G5", capacity: 20, tuition_cents: 2800000, max_aid_seat_pct: 1.0 }, as: AdmissionDirector, captures: { secC5: $.data.id } }
            - { call: "POST /admissions/grade-sections", payload: { cycle_id: "${cycC}", grade_level: "G3", capacity: 20, tuition_cents: 2600000, max_aid_seat_pct: 1.0 }, as: AdmissionDirector, captures: { secC3: $.data.id } }
            - { call: "POST /admissions/grade-sections", payload: { cycle_id: "${cycN}", grade_level: "G10", capacity: 20, tuition_cents: 3200000, max_aid_seat_pct: 1.0 }, as: AdmissionDirector, captures: { secN10: $.data.id } }
            - { call: "POST /admissions/grade-sections", payload: { cycle_id: "${cycN}", grade_level: "G6", capacity: 20, tuition_cents: 2833333, max_aid_seat_pct: 1.0 }, as: AdmissionDirector, captures: { secN6: $.data.id } }
            - { call: "POST /admissions/grade-sections", payload: { cycle_id: "${cycN}", grade_level: "G4", capacity: 20, tuition_cents: 2833333, max_aid_seat_pct: 1.0 }, as: AdmissionDirector, captures: { secN4: $.data.id } }
            - { call: "POST /admissions/students", payload: { family_id: "fam-r", first_name: "Sam", last_name: "Rey", current_grade_section_id: "${secC9}" }, as: AdmissionDirector, captures: { st1: $.data.id, st1_v: $.data.version } }
            - { call: "POST /admissions/students", payload: { family_id: "fam-r", first_name: "Tess", last_name: "Rey", current_grade_section_id: "${secC5}" }, as: AdmissionDirector, captures: { st2: $.data.id, st2_v: $.data.version } }
            - { call: "POST /admissions/students", payload: { family_id: "fam-r", first_name: "Uli", last_name: "Rey", current_grade_section_id: "${secC3}" }, as: AdmissionDirector, captures: { st3: $.data.id, st3_v: $.data.version } }
          trigger:
            - { call: "POST /admissions/reenrollment-offers", payload: { student_id: "${st1}", cycle_id: "${cycN}", expected_student_version: "${st1_v}" }, as: AdmissionDirector, captures: { of1: $.data.id } }
            - { call: "POST /admissions/reenrollment-offers", payload: { student_id: "${st2}", cycle_id: "${cycN}", expected_student_version: "${st2_v}" }, as: AdmissionDirector, captures: { of2: $.data.id } }
            - { call: "POST /admissions/reenrollment-offers", payload: { student_id: "${st3}", cycle_id: "${cycN}", expected_student_version: "${st3_v}" }, as: AdmissionDirector, captures: { of3: $.data.id } }
          assert:
            - "ReenrollmentOffer.${of1}: prior_tuition_cents == 3000000, new_tuition_cents == 3200000, sibling_discount_cents == 0, discounted_tuition_cents == 3200000 (senior student)"
            - "ReenrollmentOffer.${of2}: new_tuition_cents == 2833333, sibling_discount_cents == 283333, discounted_tuition_cents == 2550000"
            - "ReenrollmentOffer.${of3}: new_tuition_cents == 2833333, sibling_discount_cents == 283333, discounted_tuition_cents == 2550000"
            - "Family total == 3,200,000 + 2,550,000 + 2,550,000 == 8300000; sum-then-round would yield 8299999, so the pinned per-line order is observable"

  # ---------------------------------------------------------------- Rule 3
  - rule_id: non_linear_state_machine
    instances:
      - name: aid_verification_and_award_parallel_cycles
        grounds:
          - state_machines.AidApplication.verification_status.VERIFIED_to_SUBMITTED
          - state_machines.AidApplication.award_status.OFFERED_to_APPEALED
          - state_machines.AidApplication.award_status.APPEALED_to_OFFERED
        distinguishing_aspect: |
          AidApplication carries two PARALLEL cyclic state dimensions on one row:
          appeal/revise loops award_status OFFERED->APPEALED->OFFERED without touching
          verification_status, and resubmit-income loops verification_status
          VERIFIED->SUBMITTED without touching award_status (an OFFERED award survives
          resubmission as a stale offer). Distinct entity from the Application instance.
        test_recipe:
          setup:
            - "fam-a aid application fully verified (reported 9,500,000 hh4, verified 12,000,000) and finalized: verification_status VERIFIED, award_status OFFERED, final 1,820,000"
          setup_api_calls:
            - { call: "POST /admissions/cycles", payload: { academic_year: "2027-2028", early_deadline_at: "2026-11-01T00:00:00Z", regular_deadline_at: "2027-01-15T00:00:00Z", reenroll_response_deadline_at: "2027-03-01T00:00:00Z", melt_deadline_at: "2027-08-01T00:00:00Z", aid_budget_total_cents: 18050000 }, as: AdmissionDirector, captures: { cyc: $.data.id } }
            - { call: "POST /admissions/grade-sections", payload: { cycle_id: "${cyc}", grade_level: "G9", capacity: 10, tuition_cents: 3000000, max_aid_seat_pct: 0.5 }, as: AdmissionDirector, captures: { sec: $.data.id } }
            - { call: "POST /admissions/cycles/${cyc}/open", payload: {}, as: AdmissionDirector }
            - { call: "POST /admissions/applicants", payload: { family_id: "fam-a", first_name: "Ann", last_name: "Able", date_of_birth: "2013-05-01" }, as: Parent, as_user_id: "fam-a", captures: { apl: $.data.id } }
            - { call: "POST /admissions/applications", payload: { applicant_id: "${apl}", cycle_id: "${cyc}", grade_section_id: "${sec}", round: "EARLY" }, as: Parent, as_user_id: "fam-a", captures: { app: $.data.id } }
            - { call: "POST /admissions/applications/${app}/submit", payload: {}, as: Parent, as_user_id: "fam-a" }
            - { call: "POST /admissions/aid-applications", payload: { application_id: "${app}", reported_annual_income_cents: 9500000, household_size: 4 }, as: Parent, as_user_id: "fam-a", captures: { aid: $.data.id } }
            - { call: "POST /admissions/aid-applications/${aid}/verify", payload: { verified_annual_income_cents: 12000000 }, as: FinancialAidOfficer, as_user_id: "fao-1" }
            - { call: "POST /admissions/aid-applications/${aid}/finalize-award", payload: {}, as: FinancialAidOfficer, as_user_id: "fao-2" }
          trigger:
            - { call: "POST /admissions/aid-applications/${aid}/appeal-award", payload: { appeal_reason: "parent job loss in October" }, as: Parent, as_user_id: "fam-a" }
            - { call: "POST /admissions/aid-applications/${aid}/revise-award", payload: { revised_final_amount_cents: 1900000 }, as: FinancialAidOfficer, as_user_id: "fao-2" }
            - { call: "POST /admissions/aid-applications/${aid}/resubmit-income", payload: { reported_annual_income_cents: 11000000, household_size: 4 }, as: Parent, as_user_id: "fam-a" }
            - { call: "POST /admissions/aid-applications/${aid}/verify", payload: { verified_annual_income_cents: 11000000 }, as: FinancialAidOfficer, as_user_id: "fao-1" }
          assert:
            - "After appeal: award_status == APPEALED while verification_status stays VERIFIED (dimension 1 moves alone)"
            - "After revise: award_status == OFFERED and final_award_cents == 1900000"
            - "After resubmit: verification_status == SUBMITTED while award_status stays OFFERED (dimension 2 moves alone), and provisional_award_cents == 2040000 (reported 11,000,000: EFC 960,000)"
            - "After re-verify: verification_status == VERIFIED again and final_award_cents remains 1900000 (verify never recomputes the award)"

      - name: round_close_fork_and_waitlist_join
        grounds:
          - state_machines.Application.EVALUATION_COMPLETE_to_OFFERED
          - state_machines.Application.EVALUATION_COMPLETE_to_WAITLISTED
          - state_machines.Application.EVALUATION_COMPLETE_to_DENIED
          - state_machines.Application.WAITLISTED_to_OFFERED
          - calculations.committee_rank_assignment
        distinguishing_aspect: |
          Application is a branching fork-join machine (distinct entity from the
          AidApplication instance): one close-round forks three EVALUATION_COMPLETE
          siblings into OFFERED / WAITLISTED / DENIED with divergent side-effect sets,
          and the WAITLISTED branch later joins the OFFERED branch via promotion.
        test_recipe:
          setup:
            - "OPEN cycle, G9 section capacity 2 tuition 3,000,000 pct 1.0; test session capacity 5"
            - "Three REGULAR applications fully scored: fam-h 100.0, fam-m 84.0, fam-l 60.0 (no preferences)"
            - "Clock 2026-11-02: close EARLY (empty pool). Clock 2027-01-16: close REGULAR runs the fork"
          setup_api_calls:
            - { call: "POST /admissions/cycles", payload: { academic_year: "2027-2028", early_deadline_at: "2026-11-01T00:00:00Z", regular_deadline_at: "2027-01-15T00:00:00Z", reenroll_response_deadline_at: "2027-03-01T00:00:00Z", melt_deadline_at: "2027-08-01T00:00:00Z", aid_budget_total_cents: 18050000 }, as: AdmissionDirector, captures: { cyc: $.data.id } }
            - { call: "POST /admissions/grade-sections", payload: { cycle_id: "${cyc}", grade_level: "G9", capacity: 1, tuition_cents: 3000000, max_aid_seat_pct: 1.0 }, as: AdmissionDirector, captures: { sec: $.data.id } }
            - { call: "POST /admissions/cycles/${cyc}/open", payload: {}, as: AdmissionDirector }
            - { call: "POST /admissions/test-sessions", payload: { cycle_id: "${cyc}", session_start: "2026-10-10T09:00:00Z", session_end: "2026-10-10T12:00:00Z", room_capacity: 5 }, as: AdmissionDirector, captures: { tss: $.data.id } }
            - { call: "POST /admissions/applicants", payload: { family_id: "fam-h", first_name: "Hal", last_name: "High", date_of_birth: "2013-01-01" }, as: Parent, as_user_id: "fam-h", captures: { aplH: $.data.id } }
            - { call: "POST /admissions/applications", payload: { applicant_id: "${aplH}", cycle_id: "${cyc}", grade_section_id: "${sec}", round: "REGULAR" }, as: Parent, as_user_id: "fam-h", captures: { appH: $.data.id } }
            - { call: "POST /admissions/applications/${appH}/submit", payload: {}, as: Parent, as_user_id: "fam-h" }
            - { call: "POST /admissions/evaluations", payload: { application_id: "${appH}", kind: "TEST", scheduled_start: "2026-10-10T09:00:00Z", scheduled_end: "2026-10-10T10:00:00Z", test_session_id: "${tss}" }, as: AdmissionOfficer, captures: { evHT: $.data.id } }
