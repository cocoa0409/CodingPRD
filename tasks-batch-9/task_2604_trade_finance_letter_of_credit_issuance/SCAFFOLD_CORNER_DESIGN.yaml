            - "Logical clock at 2026-08-10T09:00:00Z, then 2026-09-14T09:00:00Z."
            - "The standard 10000000 SIGHT_PAYMENT credit is ISSUED on a 50000000 facility for applicant Baltic Timber Imports AS."
            - "A presentation with a 4000000 invoice and a bill of lading is submitted, so it is UNDER_EXAMINATION with examination_deadline 2026-09-21T23:59:59.999Z."
