      assert:
      - the trigger returned status 200 and Production.${prod_id}.status == SUSPENDED
      - 'hop 1: RushAllocation.${alloc_id}.status == SUSPENDED because the production left ACTIVE'
      - 'hop 2: QueuePosition.${q1_id}.status == ABANDONED and QueuePosition.${q2_id}.status == ABANDONED because the allocation stopped dispensing seats'
      - 'hop 3: SeatHold.${hold_id}.status == ORPHANED because no queue position can reach the held seat any more'
