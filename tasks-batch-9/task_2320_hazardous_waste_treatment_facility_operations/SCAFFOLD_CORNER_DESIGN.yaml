          The leak definition is inclusive for detection but strict for closure: 250.0 ppm on a LEVEL_2
          unit both opens the order and refuses to close it, while 249.9 ppm closes it. The same number
          therefore behaves differently at the two ends of the repair.
        test_recipe:
          setup:
            - "LEVEL_2 tank unit with a repair order opened at exactly 250.0 ppm on 2026-08-01, first attempt recorded 2026-08-02"
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { current_utc: "2026-08-01T00:00:00Z" }
              as: PlatformAdmin
            - call: "POST /tsdf/facilities"
              payload: { name: "Ridgeline TSDF", epa_id: "TXD000111222", permit_number: "TX-HW-0091", permit_expires_at: "2027-06-30T00:00:00Z", permitted_methods: ["INCINERATION"], max_concurrent_treatment_batches: 5, post_closure_cost_cents: 8000000 }
              as: PlatformAdmin
              captures: { fac_id: $.data.id, fac_v: $.data.version }
            - call: "POST /tsdf/storage-units"
              payload: { facility_id: "${fac_id}", unit_code: "TK-01", unit_type: "TANK_SYSTEM", permitted_capacity_kg: 20000.0, aisle_width_cm: 200.0, aisle_free_container_capacity: 0, inspection_frequency_days: 1, allowed_compatibility_classes: ["ORGANIC_SOLVENT"], air_emission_control_level: "LEVEL_2", containment_volume_l: 30000.0 }
              as: PlatformAdmin
              captures: { unit_id: $.data.id }
            - call: "POST /tsdf/inspection-events"
              payload: { storage_unit_id: "${unit_id}", inspection_type: "AIR_MONITORING", finding_code: "NONE", measured_organic_vapor_ppm: 250.0 }
              as: ComplianceManager
              as_user_id: "cm-01"
            - call: "GET /tsdf/emission-repair-orders?storage_unit_id=${unit_id}"
              payload: {}
              as: ComplianceManager
              captures: { order_id: "$.data[0].id" }
            - call: "POST /_clock/set_current_utc"
              payload: { current_utc: "2026-08-02T00:00:00Z" }
              as: PlatformAdmin
            - call: "POST /tsdf/emission-repair-orders/${order_id}/actions"
              payload: { action: "FIRST_ATTEMPT", monitored_ppm: 255.0 }
              as: TreatmentOperator
              as_user_id: "op-01"
          trigger:
            - call: "POST /tsdf/emission-repair-orders/${order_id}/actions"
              payload: { action: "CLOSE", monitored_ppm: 250.0 }
              as: ComplianceManager
              as_user_id: "cm-01"
            - call: "POST /tsdf/emission-repair-orders/${order_id}/actions"
              payload: { action: "CLOSE", monitored_ppm: 249.9 }
              as: ComplianceManager
              as_user_id: "cm-01"
          assert:
            - "The 250.0 inspection opened an order, proving detection is inclusive"
            - "Closure at 250.0: status == 409 and data.error_id == ERR_LEAK_PERSISTS"
            - "EmissionRepairOrder.${order_id}.status == FIRST_ATTEMPTED after the refused closure"
            - "EmissionRepairOrder.${order_id}.attempt_count == 1"
            - "Closure at 249.9: status == 200 and EmissionRepairOrder.${order_id}.status == REPAIRED"
            - "EmissionRepairOrder.${order_id}.last_monitored_ppm == 249.9"
            - "EmissionRepairOrder.${order_id}.is_overdue == false"
            - "StorageUnit.${unit_id}.posture == OPEN"

      - name: delay_of_repair_beyond_the_180_day_ceiling_rejected
