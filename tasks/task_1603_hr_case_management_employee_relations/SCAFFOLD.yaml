# =============================================================================
# PRD Benchmark Scaffold — HR Case Management & Employee Relations Investigations
# =============================================================================

scenario: |
  HR Case Management & Employee Relations Investigations (employee relations department): intake channel & case categorization, investigator assignment & conflict check, interview scheduling & documentation standards, evidence review & credibility assessment, findings & recommended action calibration across cases, closure notification & confidentiality, trend analysis by manager/location, litigation-ready file assembly

domain_name: hr-er-case-management
api_prefix: /er

# =============================================================================
# Step 0: Complexity Profile
# =============================================================================
complexity_profile:
  primary_archetype: compliance_audit
  secondary_archetype: multi_party_negotiation
  complexity_layers:
    - optimistic_concurrency
    - cascading_side_effects
    - dual_variant_calculation
    - rate_threshold_triggers
  entity_topology: hybrid
  state_machine_shape: branching
  relationship_patterns:
    - one_to_many
    - many_to_many
    - self_referential
    - cross_aggregate
  role_model: segregation_of_duties
  consistency_model: immediate

# =============================================================================
# §1.0 Response Envelope (FIXED — verbatim)
# =============================================================================
response_envelope:
  success: |
    { "meta": { "api_request_id": "req_xxx", "api_request_timestamp": "ISO8601" },
      "response_type": "object" | "array", "data": {} }
  error: |
    { "meta": { ... }, "response_type": "error",
      "data": { "error_id": "ERR_XXX", "message": "..." } }
  pagination_fields: ["limit", "offset", "total_count", "has_more"]
  pagination_defaults: { limit: 10, min: 1, max: 100, offset: 0 }

# =============================================================================
# §1.1 Entity-Relationship Table (12 entities — Expert band)
# =============================================================================
entities:
  - name: Employee
    parent: null
    common_fields: true
    fields:
      - name: employee_number
        type: string
        source: input
        description: "Unique corporate employee number (tenant-scoped unique)"
        constraints: "unique across all Employee rows; immutable after creation"
      - name: full_name
        type: string
        source: input
        description: "Legal full name"
      - name: email
        type: string
        source: input
        description: "Work email, unique"
        constraints: "unique across all Employee rows"
      - name: manager_id
        type: string
        source: input
        description: "FK -> Employee.id; the employee's direct manager (self-referential). Null for top-of-tree."
        constraints: "must reference an existing Employee when non-null; manager chain must be acyclic"
      - name: location_code
        type: string
        source: input
        description: "Office / site location code used for trend rollups"
      - name: department
        type: string
        source: input
        description: "Department name"
      - name: employment_status
        type: enum
        source: input
        description: "Lifecycle of employment"
        default: ACTIVE
        constraints: "one of ACTIVE, ON_LEAVE, TERMINATED"
      - name: hire_date
        type: datetime
        source: input
        description: "Hire date (ISO 8601 date)"

  - name: Investigator
    parent: null
    common_fields: true
    fields:
      - name: employee_id
        type: string
        source: input
        description: "FK -> Employee.id; the investigator's underlying employee record"
        constraints: "unique; referenced Employee must exist"
      - name: certification_level
        type: enum
        source: input
        description: "Highest case severity this investigator may lead"
        constraints: "one of LEVEL_1, LEVEL_2, LEVEL_3; LEVEL_1 may lead only LOW cases, LEVEL_2 leads LOW|MEDIUM, LEVEL_3 leads any severity"
      - name: max_active_cases
        type: integer
        source: input
        description: "Cap on the number of assigned non-closed cases held at any one time"
        constraints: "integer >= 1"
      - name: active_case_count
        type: integer
        source: computed
        description: "Derived count of Case rows where assigned_investigator_id = this Investigator.id and Case.status in {TRIAGE, ASSIGNED, INVESTIGATING, FINDINGS_DRAFT, CALIBRATION, PENDING_CLOSURE}. Recomputed on every Case assignment, unassignment, closure, and reopen."
        default: 0
      - name: conflicted_employee_ids
        type: array
        source: input
        description: "Array of Employee.id values this investigator is conflicted against (personal relationship, prior involvement). Assignment conflict check consults this list."
        default: []

  - name: IntakeChannelConfig
    parent: null
    common_fields: true
    fields:
      - name: channel_code
        type: enum
        source: input
        description: "Intake channel identifier"
        constraints: "one of HOTLINE, WEB_PORTAL, MANAGER_REFERRAL, HR_DIRECT, ANONYMOUS_LETTER; unique"
      - name: display_name
        type: string
        source: input
        description: "Human-readable channel label"
      - name: default_category
        type: enum
        source: input
        description: "Case category applied when the intake payload omits category"
        constraints: "one of HARASSMENT, DISCRIMINATION, RETALIATION, POLICY_VIOLATION, SAFETY, COMPENSATION, OTHER"
      - name: default_severity
        type: enum
        source: input
        description: "Case severity applied when the intake payload omits severity"
        default: MEDIUM
        constraints: "one of LOW, MEDIUM, HIGH, CRITICAL"
      - name: requires_reporter_identity
        type: boolean
        source: input
        description: "When true, intake through this channel MUST supply reporter_employee_id"
        default: false
      - name: sla_business_days
        type: integer
        source: input
        description: "Target business days from intake to closure for cases entering via this channel"
        constraints: "integer >= 1"

  - name: Case
    parent: null
    common_fields: true
    fields:
      - name: case_number
        type: string
        source: system
        description: "Server-minted human reference, format ER-<yyyy>-<zero-padded-sequence>; sequence assigned in created_at order within calendar year"
      - name: intake_channel_id
        type: string
        source: input
        description: "FK -> IntakeChannelConfig.id; the channel the report arrived through"
      - name: reporter_employee_id
        type: string
        source: input
        description: "FK -> Employee.id; reporting employee. Null when channel permits anonymous reports."
        constraints: "required when the channel's requires_reporter_identity is true"
      - name: subject_employee_id
        type: string
        source: input
        description: "FK -> Employee.id; the employee the allegation is against"
      - name: category
        type: enum
        source: input
        description: "Allegation category; falls back to channel default_category when omitted"
        constraints: "one of HARASSMENT, DISCRIMINATION, RETALIATION, POLICY_VIOLATION, SAFETY, COMPENSATION, OTHER"
      - name: severity
        type: enum
        source: input
        description: "Case severity; falls back to channel default_severity when omitted"
        constraints: "one of LOW, MEDIUM, HIGH, CRITICAL"
      - name: status
        type: enum
        source: system
        description: "Case lifecycle state (see state machine)"
        default: TRIAGE
        constraints: "one of TRIAGE, ASSIGNED, INVESTIGATING, FINDINGS_DRAFT, CALIBRATION, PENDING_CLOSURE, CLOSED, REOPENED, ON_HOLD"
      - name: assigned_investigator_id
        type: string
        source: system
        description: "FK -> Investigator.id; set by the assignment action, cleared by unassign"
      - name: litigation_hold
        type: boolean
        source: input
        description: "When true, the case file is frozen for litigation readiness; most mutating transitions are blocked"
        default: false
      - name: reopen_count
        type: integer
        source: system
        description: "Number of times this case has transitioned CLOSED -> REOPENED"
        default: 0
      - name: sla_due_date
        type: datetime
        source: computed
        description: "Computed at intake as intake_received_at + channel.sla_business_days business days, skipping weekend days (Saturday/Sunday) and any HolidayCalendarEntry dates. Persisted at creation; recomputed only if intake_channel_id changes before ASSIGNED."
      - name: intake_received_at
        type: datetime
        source: system
        description: "Logical-clock timestamp at case creation; source of SLA arithmetic"
      - name: closed_at
        type: datetime
        source: system
        description: "Logical-clock timestamp of the most recent transition into CLOSED; null while not closed"
      - name: days_to_close
        type: integer
        source: computed
        description: "Calendar days between intake_received_at and closed_at for the most recent closure; null while never closed"
      - name: overdue_business_days
        type: integer
        source: computed
        description: "Business days elapsed past sla_due_date per the overdue_business_days calculation; computed on every case read against the logical clock"

  - name: Interview
    parent: Case
    common_fields: true
    fields:
      - name: case_id
        type: string
        source: input
        description: "FK -> Case.id; parent case"
      - name: interviewee_employee_id
        type: string
        source: input
        description: "FK -> Employee.id; person being interviewed"
      - name: interviewer_investigator_id
        type: string
        source: system
        description: "FK -> Investigator.id; defaults to the case's assigned investigator at scheduling time"
      - name: scheduled_start
        type: datetime
        source: input
        description: "Planned start (ISO 8601 UTC)"
      - name: scheduled_end
        type: datetime
        source: input
        description: "Planned end (ISO 8601 UTC); must be strictly after scheduled_start"
      - name: status
        type: enum
        source: system
        description: "Interview lifecycle"
        default: SCHEDULED
        constraints: "one of SCHEDULED, COMPLETED, NO_SHOW, CANCELLED"
      - name: documentation_text
        type: string
        source: input
        description: "Interview notes; required to mark COMPLETED, minimum 50 characters"
        constraints: "on completion must be >= 50 characters"
      - name: documentation_word_count
        type: integer
        source: computed
        description: "Whitespace-delimited word count of documentation_text, computed when documentation_text is submitted"
        default: 0
      - name: completed_at
        type: datetime
        source: system
        description: "Logical-clock timestamp of transition into COMPLETED; null otherwise"

  - name: EvidenceItem
    parent: Case
    common_fields: true
    fields:
      - name: case_id
        type: string
        source: input
        description: "FK -> Case.id; parent case"
      - name: submitted_by_employee_id
        type: string
        source: input
        description: "FK -> Employee.id; who submitted the item"
      - name: evidence_type
        type: enum
        source: input
        description: "Kind of evidence"
        constraints: "one of DOCUMENT, EMAIL, CHAT_LOG, PHOTO, AUDIO, VIDEO, PHYSICAL, TESTIMONY"
      - name: description
        type: string
        source: input
        description: "Free-text description"
      - name: custody_sequence
        type: integer
        source: system
        description: "Chain-of-custody ordinal within the case; starts at 1 and increments by 1 per EvidenceItem created under the same case in created_at order. Never reused, even after archival."
      - name: status
        type: enum
        source: system
        description: "Evidence lifecycle"
        default: LOGGED
        constraints: "one of LOGGED, UNDER_REVIEW, ADMITTED, EXCLUDED, ARCHIVED"
      - name: weight
        type: number
        source: input
        description: "Assessor-assigned evidentiary weight in [0.0, 1.0]; required before ADMITTED"
        constraints: "0.0 <= weight <= 1.0; 2 decimal places"
      - name: reviewed_by_investigator_id
        type: string
        source: system
        description: "FK -> Investigator.id; the investigator who last moved the item out of LOGGED"

  - name: CredibilityAssessment
    parent: Case
    common_fields: true
    fields:
      - name: case_id
        type: string
        source: input
        description: "FK -> Case.id; parent case"
      - name: subject_employee_id
        type: string
        source: input
        description: "FK -> Employee.id; the person whose account is being assessed (may differ from case subject, e.g. a witness)"
      - name: assessor_investigator_id
        type: string
        source: system
        description: "FK -> Investigator.id; investigator recording the assessment"
      - name: corroboration_count
        type: integer
        source: input
        description: "Number of independent corroborating sources"
        constraints: "integer >= 0"
      - name: contradiction_count
        type: integer
        source: input
        description: "Number of material contradictions identified"
        constraints: "integer >= 0"
      - name: account_age_days
        type: integer
        source: input
        description: "Days between the alleged event and the account being given"
        constraints: "integer >= 0"
      - name: score_corroboration
        type: number
        source: computed
        description: "Credibility score under the CORROBORATION_WEIGHTED variant; see calculation credibility_score"
      - name: score_recency
        type: number
        source: computed
        description: "Credibility score under the RECENCY_WEIGHTED variant; see calculation credibility_score"
      - name: active_variant
        type: enum
        source: system
        description: "Which variant currently drives downstream substantiation; defaults to CORROBORATION_WEIGHTED and flips to RECENCY_WEIGHTED when the case is REOPENED"
        default: CORROBORATION_WEIGHTED
        constraints: "one of CORROBORATION_WEIGHTED, RECENCY_WEIGHTED"

  - name: Finding
    parent: Case
    common_fields: true
    fields:
      - name: case_id
        type: string
        source: input
        description: "FK -> Case.id; parent case"
      - name: author_investigator_id
        type: string
        source: system
        description: "FK -> Investigator.id; finding author (the assigned investigator at draft time)"
      - name: substantiation_status
        type: enum
        source: system
        description: "Independent dimension: whether the allegation is substantiated"
        default: DRAFT
        constraints: "one of DRAFT, SUBSTANTIATED, UNSUBSTANTIATED, INCONCLUSIVE"
      - name: approval_status
        type: enum
        source: system
        description: "Independent dimension: calibration approval workflow state"
        default: PENDING_REVIEW
        constraints: "one of PENDING_REVIEW, CALIBRATED, REJECTED, APPROVED"
      - name: rationale_text
        type: string
        source: input
        description: "Findings narrative; required before substantiation_status leaves DRAFT, minimum 100 characters"
        constraints: ">= 100 characters before substantiation"
      - name: calibration_score
        type: number
        source: computed
        description: "Cross-case calibration score produced by the action_calibration calculation at CALIBRATED time"
      - name: calibrated_by_ids
        type: array
        source: system
        description: "Array of Investigator.id values who cast CALIBRATE votes; quorum is 2 distinct investigators neither of whom is author_investigator_id"
        default: []

  - name: RecommendedAction
    parent: Finding
    common_fields: true
    fields:
      - name: finding_id
        type: string
        source: input
        description: "FK -> Finding.id; parent finding"
      - name: action_type
        type: enum
        source: input
        description: "Recommended discipline/remedy"
        constraints: "one of NO_ACTION, COACHING, WRITTEN_WARNING, FINAL_WARNING, SUSPENSION, DEMOTION, TERMINATION, POLICY_CHANGE"
      - name: severity_points
        type: integer
        source: input
        description: "Relative harshness points 0–100 used by cross-case calibration"
        constraints: "integer 0..100"
      - name: justification
        type: string
        source: input
        description: "Why this action is proportionate; minimum 30 characters"
        constraints: ">= 30 characters"
      - name: status
        type: enum
        source: system
        description: "Action lifecycle"
        default: PROPOSED
        constraints: "one of PROPOSED, ACCEPTED, SUPERSEDED, WITHDRAWN"

  - name: ClosureNotice
    parent: Case
    common_fields: true
    fields:
      - name: case_id
        type: string
        source: system
        description: "FK -> Case.id; exactly one ClosureNotice per case closure event (reopens may mint subsequent notices)"
      - name: closure_sequence
        type: integer
        source: system
        description: "Ordinal of this closure event for the case, starting at 1; equals Case.reopen_count + 1 at mint time"
      - name: recipient_employee_id
        type: string
        source: input
        description: "FK -> Employee.id; notice recipient (reporter or subject)"
      - name: recipient_role
        type: enum
        source: input
        description: "Whether the recipient is the REPORTER or the SUBJECT"
        constraints: "one of REPORTER, SUBJECT"
      - name: confidentiality_tier
        type: enum
        source: input
        description: "Disclosure band governing body redaction"
        constraints: "one of TIER_1_SUMMARY, TIER_2_LIMITED, TIER_3_FULL; SUBJECT recipients may receive at most TIER_2_LIMITED"
      - name: body_text
        type: string
        source: input
        description: "Notice body; must not contain other involved employees' names when confidentiality_tier is TIER_1_SUMMARY"
      - name: sent_at
        type: datetime
        source: system
        description: "Logical-clock timestamp when the notice was dispatched"
      - name: delivery_status
        type: enum
        source: system
        description: "Delivery lifecycle"
        default: QUEUED
        constraints: "one of QUEUED, SENT, FAILED, SUPPRESSED"

  - name: TrendSnapshot
    parent: null
    common_fields: true
    fields:
      - name: scope_type
        type: enum
        source: input
        description: "Aggregation axis"
        constraints: "one of MANAGER, LOCATION"
      - name: scope_key
        type: string
        source: input
        description: "The manager Employee.id (scope_type=MANAGER) or location_code (scope_type=LOCATION)"
      - name: window_kind
        type: enum
        source: input
        description: "Which rate variant this snapshot materializes"
        constraints: "one of ROLLING_90D, CALENDAR_QUARTER"
      - name: as_of
        type: datetime
        source: system
        description: "Logical-clock timestamp the snapshot was computed at"
      - name: closed_case_count
        type: integer
        source: computed
        description: "Cases in scope closed within the window; see trend_case_rate calculation"
      - name: substantiated_count
        type: integer
        source: computed
        description: "Closed cases in scope whose final Finding substantiation_status = SUBSTANTIATED"
      - name: case_rate_per_100
        type: number
        source: computed
        description: "closed_case_count / headcount_in_scope * 100; headcount rule differs per window_kind (see trend_case_rate)"
      - name: is_stale
        type: boolean
        source: system
        description: "Set true when any underlying case closes or reopens after as_of; cleared when recomputed"
        default: false

  - name: LitigationFilePackage
    parent: Case
    common_fields: true
    fields:
      - name: case_id
        type: string
        source: input
        description: "FK -> Case.id; the case being packaged"
      - name: assembled_by
        type: string
        source: system
        description: "Opaque X-User-ID of the LegalCounsel who assembled the package"
      - name: status
        type: enum
        source: system
        description: "Package lifecycle"
        default: ASSEMBLING
        constraints: "one of ASSEMBLING, READY, SEALED, RELEASED"
      - name: manifest_hash
        type: string
        source: computed
        description: "Deterministic SHA-256 over the ordered manifest (see litigation_manifest calculation); recomputed at SEALED"
      - name: item_count
        type: integer
        source: computed
        description: "Count of manifest entries: 1 per non-ARCHIVED EvidenceItem + 1 per COMPLETED Interview + 1 per Finding + 1 per SENT ClosureNotice on the case"
      - name: sealed_at
        type: datetime
        source: system
        description: "Logical-clock timestamp of ASSEMBLING -> SEALED (via READY); null until sealed"
      - name: package_version
        type: integer
        source: system
        description: "Monotonic package content version; increments whenever the manifest membership changes while ASSEMBLING"
        default: 1

  - name: HolidayCalendarEntry
    parent: null
    common_fields: false
    fields:
      - name: holiday_date
        type: datetime
        source: input
        description: "ISO 8601 date (UTC midnight) recognized as a company holiday; excluded from SLA business-day arithmetic"
        constraints: "unique across all entries"
      - name: label
        type: string
        source: input
        description: "Holiday name"

# =============================================================================
# §1.2 State Machine Table
# =============================================================================
state_machines:
  - entity: Case
    initial_state: TRIAGE
    terminal_states: [CLOSED]
    transitions:
      - from: TRIAGE
        to: ASSIGNED
        trigger: "POST /er/cases/{id}/assign"
        actor: ERManager
        preconditions:
          - "Case.status == TRIAGE"
          - "Case.litigation_hold == false"
          - "payload.investigator_id references an existing Investigator"
          - "Investigator.certification_level authorizes the Case.severity (LEVEL_1 -> LOW only; LEVEL_2 -> LOW|MEDIUM; LEVEL_3 -> any)"
          - "Case.subject_employee_id NOT IN Investigator.conflicted_employee_ids"
          - "Case.reporter_employee_id is null OR Case.reporter_employee_id NOT IN Investigator.conflicted_employee_ids"
          - "Investigator.active_case_count < Investigator.max_active_cases"
          - "payload.expected_case_version == Case.version"
        side_effects:
          - "Case.assigned_investigator_id := payload.investigator_id"
          - "Investigator.active_case_count recomputed (increments by 1)"
          - "Case.version increments by 1"
      - from: ASSIGNED
        to: INVESTIGATING
        trigger: "POST /er/cases/{id}/begin-investigation"
        actor: Investigator
        preconditions:
          - "Case.status == ASSIGNED"
          - "Case.litigation_hold == false"
          - "acting X-User-ID equals Case.assigned_investigator_id's Investigator.id"
        side_effects:
          - "Case.version increments by 1"
      - from: INVESTIGATING
        to: FINDINGS_DRAFT
        trigger: "POST /er/cases/{id}/findings (first Finding draft creation)"
        actor: Investigator
        preconditions:
          - "Case.status == INVESTIGATING"
          - "acting X-User-ID equals Case.assigned_investigator_id"
          - "at least one Interview on the case has status == COMPLETED"
          - "at least one EvidenceItem on the case has status == ADMITTED"
        side_effects:
          - "Finding row created with substantiation_status=DRAFT, approval_status=PENDING_REVIEW"
          - "Case.version increments by 1"
      - from: FINDINGS_DRAFT
        to: CALIBRATION
        trigger: "POST /er/findings/{id}/submit-for-calibration"
        actor: Investigator
        preconditions:
          - "Finding.substantiation_status IN {SUBSTANTIATED, UNSUBSTANTIATED, INCONCLUSIVE}"
          - "Finding.approval_status == PENDING_REVIEW"
          - "Finding.rationale_text length >= 100 characters"
          - "at least one RecommendedAction on the Finding has status == PROPOSED"
          - "acting X-User-ID equals Finding.author_investigator_id"
        side_effects:
          - "Finding.approval_status := CALIBRATED (enters calibration pool)"
          - "Case.status := CALIBRATION"
          - "Case.version increments by 1"
      - from: CALIBRATION
        to: PENDING_CLOSURE
        trigger: "POST /er/findings/{id}/approve (calibration quorum reached)"
        actor: Investigator
        preconditions:
          - "Finding.approval_status == CALIBRATED"
          - "the approving investigator is NOT Finding.author_investigator_id (segregation of duties)"
          - "the approving investigator is NOT in Case subject/reporter conflict list"
          - "after this vote, Finding.calibrated_by_ids contains >= 2 distinct Investigator.ids (quorum)"
        side_effects:
          - "Finding.calibrated_by_ids appends acting Investigator.id"
          - "when quorum first satisfied: Finding.approval_status := APPROVED; Finding.calibration_score := action_calibration(...); Case.status := PENDING_CLOSURE"
          - "every RecommendedAction on the Finding with status PROPOSED and action_type matching the calibration winner flips to ACCEPTED; other PROPOSED actions flip to SUPERSEDED"
          - "Case.version increments by 1"
      - from: CALIBRATION
        to: FINDINGS_DRAFT
        trigger: "POST /er/findings/{id}/reject"
        actor: Investigator
        preconditions:
          - "Finding.approval_status == CALIBRATED"
          - "the rejecting investigator is NOT Finding.author_investigator_id"
          - "payload.rejection_reason present (>= 20 characters)"
        side_effects:
          - "Finding.approval_status := REJECTED, then immediately reset to PENDING_REVIEW with substantiation_status := DRAFT (revision loop)"
          - "Case.status := FINDINGS_DRAFT"
          - "Case.version increments by 1"
      - from: PENDING_CLOSURE
        to: CLOSED
        trigger: "POST /er/cases/{id}/close"
        actor: ERManager
        preconditions:
          - "Case.status == PENDING_CLOSURE"
          - "Finding on the case has approval_status == APPROVED"
          - "at least one ClosureNotice for the SUBJECT has delivery_status == SENT"
          - "at least one ClosureNotice for the REPORTER has delivery_status == SENT (skipped when Case.reporter_employee_id is null — anonymous)"
          - "payload.expected_case_version == Case.version"
        side_effects:
          - "Case.closed_at := logical clock now; Case.days_to_close computed"
          - "Investigator.active_case_count recomputed (decrements by 1)"
          - "every TrendSnapshot whose scope matches the case's manager chain or location_code is marked is_stale := true (bubble-up invalidation; the stale flag itself triggers recomputation eligibility on next trend read)"
          - "Case.version increments by 1"
      - from: CLOSED
        to: REOPENED
        trigger: "POST /er/cases/{id}/reopen"
        actor: ERManager
        preconditions:
          - "Case.status == CLOSED"
          - "Case.litigation_hold == false"
          - "Case.reopen_count < 2 (a case may be reopened at most twice)"
          - "payload.reopen_reason present (>= 30 characters)"
        side_effects:
          - "Case.reopen_count increments by 1"
          - "Case.closed_at retained for the prior closure; days_to_close retained"
          - "CredibilityAssessment.active_variant on all of the case's assessments flips to RECENCY_WEIGHTED and both scores recomputed"
          - "Case.status := REOPENED then immediately eligible for ASSIGN flow via assign (REOPENED behaves as TRIAGE for assignment rules)"
          - "every TrendSnapshot whose scope matches is marked is_stale := true"
          - "Case.version increments by 1"
      - from: REOPENED
        to: ASSIGNED
        trigger: "POST /er/cases/{id}/assign (same rules as TRIAGE->ASSIGNED)"
        actor: ERManager
        preconditions:
          - "Case.status == REOPENED"
          - "all TRIAGE->ASSIGNED preconditions apply identically"
        side_effects:
          - "identical side effects to TRIAGE->ASSIGNED"
      - from: INVESTIGATING
        to: ON_HOLD
        trigger: "POST /er/cases/{id}/hold"
        actor: ERManager
        preconditions:
          - "Case.status == INVESTIGATING"
          - "payload.hold_reason present (>= 20 characters)"
        side_effects:
          - "all SCHEDULED Interviews on the case transition to CANCELLED (cascade down)"
          - "each cancelled Interview whose interviewer had it as their only SCHEDULED interview in its [scheduled_start, scheduled_end) window triggers Investigator.active_case_count recomputation (no numeric change; recomputed for freshness)"
          - "Case.version increments by 1"
      - from: ON_HOLD
        to: INVESTIGATING
        trigger: "POST /er/cases/{id}/resume"
        actor: ERManager
        preconditions:
          - "Case.status == ON_HOLD"
          - "Case.litigation_hold == false"
        side_effects:
          - "Case.version increments by 1"
      - from: ASSIGNED
        to: TRIAGE
        trigger: "POST /er/cases/{id}/unassign"
        actor: ERManager
        preconditions:
          - "Case.status == ASSIGNED"
          - "no Interview on the case has status == COMPLETED"
          - "payload.expected_case_version == Case.version"
        side_effects:
          - "Case.assigned_investigator_id := null"
          - "Investigator.active_case_count recomputed (decrements by 1)"
          - "Case.version increments by 1"

  - entity: Interview
    initial_state: SCHEDULED
    terminal_states: [COMPLETED, NO_SHOW, CANCELLED]
    transitions:
      - from: SCHEDULED
        to: COMPLETED
        trigger: "POST /er/interviews/{id}/complete"
        actor: Investigator
        preconditions:
          - "Interview.status == SCHEDULED"
          - "parent Case.status == INVESTIGATING"
          - "acting X-User-ID equals Interview.interviewer_investigator_id"
          - "payload.documentation_text present with length >= 50 characters"
          - "logical clock now >= Interview.scheduled_start"
        side_effects:
          - "Interview.completed_at := logical clock now"
          - "Interview.documentation_word_count computed"
      - from: SCHEDULED
        to: NO_SHOW
        trigger: "POST /er/interviews/{id}/mark-no-show"
        actor: Investigator
        preconditions:
          - "Interview.status == SCHEDULED"
          - "acting X-User-ID equals Interview.interviewer_investigator_id"
          - "logical clock now > Interview.scheduled_end + 30 minutes"
        side_effects: []
      - from: SCHEDULED
        to: CANCELLED
        trigger: "POST /er/interviews/{id}/cancel OR cascade from Case hold"
        actor: Investigator | system
        preconditions:
          - "Interview.status == SCHEDULED"
          - "when actor-initiated: acting X-User-ID equals Interview.interviewer_investigator_id OR caller is ERManager"
        side_effects: []

  - entity: EvidenceItem
    initial_state: LOGGED
    terminal_states: [ADMITTED, EXCLUDED, ARCHIVED]
    transitions:
      - from: LOGGED
        to: UNDER_REVIEW
        trigger: "POST /er/evidence-items/{id}/begin-review"
        actor: Investigator
        preconditions:
          - "EvidenceItem.status == LOGGED"
          - "parent Case.status IN {INVESTIGATING, FINDINGS_DRAFT}"
          - "acting X-User-ID equals Case.assigned_investigator_id"
        side_effects:
          - "EvidenceItem.reviewed_by_investigator_id := acting investigator"
      - from: UNDER_REVIEW
        to: ADMITTED
        trigger: "POST /er/evidence-items/{id}/admit"
        actor: Investigator
        preconditions:
          - "EvidenceItem.status == UNDER_REVIEW"
          - "payload.weight present, 0.0 <= weight <= 1.0, at most 2 decimal places"
          - "parent Case.status IN {INVESTIGATING, FINDINGS_DRAFT}"
          - "acting X-User-ID equals EvidenceItem.reviewed_by_investigator_id (same reviewer must admit — segregation of duties across reviewers)"
        side_effects: []
      - from: UNDER_REVIEW
        to: EXCLUDED
        trigger: "POST /er/evidence-items/{id}/exclude"
        actor: Investigator
        preconditions:
          - "EvidenceItem.status == UNDER_REVIEW"
          - "payload.exclusion_reason present (>= 20 characters)"
          - "acting X-User-ID equals EvidenceItem.reviewed_by_investigator_id"
        side_effects: []
      - from: EXCLUDED
        to: ARCHIVED
        trigger: "POST /er/evidence-items/{id}/archive"
        actor: ERManager
        preconditions:
          - "EvidenceItem.status == EXCLUDED"
          - "parent Case.status == CLOSED"
        side_effects:
          - "custody_sequence of remaining items unchanged (sequence never reused or compacted)"

  - entity: Finding
    initial_state: "substantiation_status=DRAFT, approval_status=PENDING_REVIEW"
    terminal_states: ["approval_status=APPROVED"]
    transitions:
      - from: "substantiation_status=DRAFT"
        to: "substantiation_status IN {SUBSTANTIATED, UNSUBSTANTIATED, INCONCLUSIVE}"
        trigger: "POST /er/findings/{id}/substantiate"
        actor: Investigator
        preconditions:
          - "Finding.substantiation_status == DRAFT"
          - "Finding.rationale_text length >= 100 characters"
          - "acting X-User-ID equals Finding.author_investigator_id"
          - "substantiation outcome consistent with active credibility scores: if every CredibilityAssessment on the case has active score < 0.50, outcome must NOT be SUBSTANTIATED"
        side_effects:
          - "Finding.substantiation_status := payload.outcome"
      - from: "approval_status=PENDING_REVIEW"
        to: "approval_status=CALIBRATED"
        trigger: "POST /er/findings/{id}/submit-for-calibration"
        actor: Investigator
        preconditions:
          - "Finding.substantiation_status != DRAFT"
          - "at least one RecommendedAction with status == PROPOSED"
        side_effects:
          - "Case.status := CALIBRATION"
      - from: "approval_status=CALIBRATED"
        to: "approval_status=APPROVED"
        trigger: "POST /er/findings/{id}/approve (second distinct non-author vote)"
        actor: Investigator
        preconditions:
          - "quorum of 2 distinct non-author investigators reached with this vote"
        side_effects:
          - "Finding.calibration_score := action_calibration(...)"
          - "RecommendedAction status flips per calibration outcome"
          - "Case.status := PENDING_CLOSURE"
      - from: "approval_status=CALIBRATED"
        to: "approval_status=PENDING_REVIEW (with substantiation_status=DRAFT)"
        trigger: "POST /er/findings/{id}/reject"
        actor: Investigator
        preconditions:
          - "rejector is not author"
        side_effects:
          - "revision loop: substantiation_status := DRAFT; calibrated_by_ids cleared"
          - "Case.status := FINDINGS_DRAFT"

  - entity: RecommendedAction
    initial_state: PROPOSED
    terminal_states: [ACCEPTED, SUPERSEDED, WITHDRAWN]
    transitions:
      - from: PROPOSED
        to: ACCEPTED
        trigger: "system cascade on Finding approval"
        actor: system
        preconditions:
          - "parent Finding.approval_status transitions to APPROVED"
          - "this action's action_type == calibration winner action_type"
        side_effects: []
      - from: PROPOSED
        to: SUPERSEDED
        trigger: "system cascade on Finding approval"
        actor: system
        preconditions:
          - "parent Finding.approval_status transitions to APPROVED"
          - "this action's action_type != calibration winner action_type"
        side_effects: []
      - from: PROPOSED
        to: WITHDRAWN
        trigger: "POST /er/recommended-actions/{id}/withdraw"
        actor: Investigator
        preconditions:
          - "RecommendedAction.status == PROPOSED"
          - "parent Finding.approval_status IN {PENDING_REVIEW, REJECTED}"
          - "acting X-User-ID equals parent Finding.author_investigator_id"
        side_effects: []

  - entity: ClosureNotice
    initial_state: QUEUED
    terminal_states: [SENT, FAILED, SUPPRESSED]
    transitions:
      - from: QUEUED
        to: SENT
        trigger: "POST /er/closure-notices/{id}/send"
        actor: ERManager
        preconditions:
          - "ClosureNotice.status == QUEUED"
          - "parent Case.status == PENDING_CLOSURE"
          - "confidentiality_tier valid for recipient_role (SUBJECT may not receive TIER_3_FULL)"
        side_effects:
          - "ClosureNotice.sent_at := logical clock now"
      - from: QUEUED
        to: FAILED
        trigger: "POST /er/closure-notices/{id}/mark-failed"
        actor: ERManager
        preconditions:
          - "ClosureNotice.status == QUEUED"
          - "payload.failure_reason present"
        side_effects: []
      - from: FAILED
        to: QUEUED
        trigger: "POST /er/closure-notices/{id}/retry"
        actor: ERManager
        preconditions:
          - "ClosureNotice.status == FAILED"
        side_effects: []
      - from: QUEUED
        to: SUPPRESSED
        trigger: "POST /er/closure-notices/{id}/suppress"
        actor: LegalCounsel
        preconditions:
          - "ClosureNotice.status == QUEUED"
          - "parent Case.litigation_hold == true"
        side_effects: []

  - entity: LitigationFilePackage
    initial_state: ASSEMBLING
    terminal_states: [RELEASED]
    transitions:
      - from: ASSEMBLING
        to: READY
        trigger: "POST /er/litigation-packages/{id}/finalize"
        actor: LegalCounsel
        preconditions:
          - "LitigationFilePackage.status == ASSEMBLING"
          - "parent Case.status == CLOSED"
          - "parent Case.litigation_hold == true"
          - "item_count >= 1"
        side_effects:
          - "manifest_hash computed"
      - from: READY
        to: SEALED
        trigger: "POST /er/litigation-packages/{id}/seal"
        actor: LegalCounsel
        preconditions:
          - "LitigationFilePackage.status == READY"
          - "payload.expected_case_version == Case.version (OCC on the parent case — sealing pins the case file at the observed version)"
        side_effects:
          - "manifest_hash recomputed and frozen"
          - "sealed_at := logical clock now"
          - "Case.version increments by 1 (the seal mutates the case's file state)"
      - from: SEALED
        to: RELEASED
        trigger: "POST /er/litigation-packages/{id}/release"
        actor: LegalCounsel
        preconditions:
          - "LitigationFilePackage.status == SEALED"
          - "payload.release_authority_reference present (court order / subpoena id, >= 8 characters)"
        side_effects: []

# =============================================================================
# §1.2.1 Concurrency Rules (OCC on parent version only)
# =============================================================================
concurrency_rules:
  - rule_id: case-assign-stale-version
    parent_entity: Case
    write_endpoint: "POST /er/cases/{id}/assign"
    occ_field: "expected_case_version"
    description: |
      Assigning an investigator to a Case whose version has advanced since the
      ERManager last observed it is rejected. This captures the situation where
      another writer has just mutated the case (assignment, hold, reopen) and
      the current writer's view of the case is therefore stale.
    error_id: ERR_STALE_VERSION
    http_status: 412
  - rule_id: case-close-stale-version
    parent_entity: Case
    write_endpoint: "POST /er/cases/{id}/close"
    occ_field: "expected_case_version"
    description: |
      Closing a Case whose version has advanced since the ERManager last
      observed it is rejected. Closure must operate on the writer's current
      view of findings, notices, and hold status.
    error_id: ERR_STALE_VERSION
    http_status: 412
  - rule_id: case-unassign-stale-version
    parent_entity: Case
    write_endpoint: "POST /er/cases/{id}/unassign"
    occ_field: "expected_case_version"
    description: |
      Unassigning a Case whose version has advanced since the ERManager last
      observed it is rejected; the writer may be undoing an assignment that has
      already been superseded by a newer one.
    error_id: ERR_STALE_VERSION
    http_status: 412
  - rule_id: package-seal-stale-case-version
    parent_entity: Case
    write_endpoint: "POST /er/litigation-packages/{id}/seal"
    occ_field: "expected_case_version"
    description: |
      Sealing a LitigationFilePackage against a Case whose version has advanced
      since the LegalCounsel last observed it is rejected; the seal must pin
      the manifest to the case-file state the counsel actually reviewed.
    error_id: ERR_STALE_VERSION
    http_status: 412

# =============================================================================
# §1.3 Calculation Rules Table
# =============================================================================
calculations:
  - name: credibility_score
    trigger: "on CredibilityAssessment creation; recomputed for all assessments of a case when the case transitions CLOSED -> REOPENED (active_variant flips)"
    algorithm: weighted_scoring
    formula: |
      # Two sanctioned variants over the same inputs. Each variant yields a
      # score in [0.00, 1.00]. The active_variant field decides which score
      # downstream gates (substantiation consistency check) consult.
      base = 0.50
      corro_term_c = 0.10 * min(corroboration_count, 4)     # cap at 4
      contra_term_c = 0.15 * min(contradiction_count, 3)    # cap at 3
      score_corroboration = clamp(base + corro_term_c - contra_term_c, 0.00, 1.00)

      recency_decay = 0.005 * min(account_age_days, 60)     # cap at 60 days
      corro_term_r = 0.06 * min(corroboration_count, 4)
      contra_term_r = 0.10 * min(contradiction_count, 3)
      score_recency = clamp(base + corro_term_r - contra_term_r - recency_decay, 0.00, 1.00)
    input_set: "The single CredibilityAssessment's input fields. No cross-case data."
    constants:
      BASE: 0.50
      CORRO_W_C: 0.10
      CONTRA_W_C: 0.15
      CORRO_W_R: 0.06
      CONTRA_W_R: 0.10
      RECENCY_DECAY_PER_DAY: 0.005
      CORRO_CAP: 4
      CONTRA_CAP: 3
      AGE_CAP_DAYS: 60
    precision: "2 decimal places, round_half_up, applied after clamp"
    variants:
      - name: CORROBORATION_WEIGHTED
        when: "default for all cases in their first investigation pass"
        difference: "higher corroboration weight (0.10 vs 0.06), no age decay"
      - name: RECENCY_WEIGHTED
        when: "all assessments of a case once the case has been REOPENED"
        difference: "adds recency_decay term; lower corroboration weight; same inputs produce a strictly lower-or-equal score whenever account_age_days > 0"

  - name: action_calibration
    trigger: "when a Finding reaches approval quorum (CALIBRATED -> APPROVED)"
    algorithm: weighted_scoring
    formula: |
      # Cross-case calibration: compares this Finding's proposed actions against
      # historical APPROVED findings in the same category over the trailing
      # 365 days (logical clock). Mode (a): >= 3 inputs, nested min/max, tier
      # selection.
      hist = all Findings F2 where F2.approval_status == APPROVED
             and F2.case.category == this.case.category
             and F2 approval timestamp within [now - 365d, now]
             and F2.id != this.id
      hist_scores = [ max([a.severity_points for a in F2.actions where status==ACCEPTED], default=0) for F2 in hist ]
      hist_median = median(hist_scores) if len(hist_scores) >= 3 else FALLBACK_MEDIAN[case.severity]
      proposed_max = max([a.severity_points for a in this.actions where status==PROPOSED], default=0)
      deviation = abs(proposed_max - hist_median)
      calibration_score = max(0.0, 100.0 - deviation) / 100.0   # in [0.00, 1.00]
      # calibration winner: the PROPOSED action with max severity_points;
      # ties broken by earliest RecommendedAction.created_at; that action flips
      # to ACCEPTED, all other PROPOSED flip to SUPERSEDED.
    input_set: "Findings with approval_status == APPROVED, same case category, approved within trailing 365 days of logical clock; excludes the finding under calibration. RecommendedActions of those findings with status == ACCEPTED."
    constants:
      FALLBACK_MEDIAN_LOW: 10
      FALLBACK_MEDIAN_MEDIUM: 30
      FALLBACK_MEDIAN_HIGH: 60
      FALLBACK_MEDIAN_CRITICAL: 85
      HISTORY_WINDOW_DAYS: 365
      MIN_HISTORY_FOR_MEDIAN: 3
    precision: "2 decimal places, round_half_up"
    variants: []

  - name: trend_case_rate
    trigger: "on GET /er/trend-snapshots compute request; also conceptually re-validated whenever a Case closes or reopens (which marks snapshots stale)"
    algorithm: aggregation
    formula: |
      # Two window variants; both count cases but differ in the headcount
      # denominator rule, so identical case data yields different rates.
      #
      # Scope membership:
      #   MANAGER scope: cases whose subject's manager chain (walking
      #     Employee.manager_id transitively) includes scope_key, OR whose
      #     subject.id == scope_key.
      #   LOCATION scope: cases whose subject.location_code == scope_key.
      #
      # Window membership (cases):
      #   ROLLING_90D: Case.closed_at within (as_of - 90 days, as_of]
      #   CALENDAR_QUARTER: Case.closed_at within [quarter_start(as_of), as_of]
      #
      # Headcount denominator:
      #   ROLLING_90D: count of Employee rows currently in scope with
      #     employment_status == ACTIVE at as_of.
      #   CALENDAR_QUARTER: count of Employee rows in scope with
      #     employment_status IN {ACTIVE, ON_LEAVE} and hire_date <= quarter_end.
      #
      # Nested rounding — pinned order (mode (b)):
      #   per_scope_rate = round_half_up(closed_case_count / headcount * 100, 2)
      #   A portfolio rollup (if requested) sums UNROUNDED per-scope rates then
      #   rounds once: round_half_up(sum(raw_rates), 2). Summing pre-rounded
      #   rates is FORBIDDEN.
      case_rate_per_100 = round_half_up(closed_case_count / headcount_in_scope * 100, 2)
      # Zero-headcount rule: headcount_in_scope == 0 -> case_rate_per_100 = 0.00
      # when closed_case_count == 0 else error ERR_TREND_HEADCOUNT_ZERO.
    input_set: "Cases with closed_at in the window, filtered by scope; Employee rows for headcount as pinned above. Reopened-and-reclosed cases count once per distinct closure (closure_sequence)."
    constants:
      ROLLING_WINDOW_DAYS: 90
      RATE_MULTIPLIER: 100
    precision: "2 decimal places, round_half_up; per-scope rounding BEFORE any cross-scope summation is forbidden; sum-then-round is the pinned rollup order"
    variants:
      - name: ROLLING_90D
        when: "window_kind == ROLLING_90D"
        difference: "denominator counts ACTIVE employees only, evaluated at as_of"
      - name: CALENDAR_QUARTER
        when: "window_kind == CALENDAR_QUARTER"
        difference: "denominator counts ACTIVE + ON_LEAVE employees with hire_date <= quarter_end; wider denominator generally yields a lower rate for identical case data"

  - name: sla_business_day_due_date
    trigger: "at Case creation (intake); recomputed only if intake_channel_id changes while Case.status == TRIAGE"
    algorithm: chronological
    formula: |
      # Mode (c): circular-looking dependency pinned to an explicit evaluation
      # order. sla_due_date depends on the holiday set; the holiday set is
      # scanned by calendar date; business days are counted by advancing one
      # calendar day at a time. Pinned order:
      #   1. Load all HolidayCalendarEntry.holiday_date values into set H.
      #   2. cursor = date(intake_received_at)  # the intake day itself is day 0
      #      and does NOT count toward the SLA even if it is a business day.
      #   3. remaining = channel.sla_business_days
      #   4. repeat: cursor += 1 day; if cursor is Saturday/Sunday -> skip;
      #      if cursor in H -> skip; else remaining -= 1; until remaining == 0.
      #   5. sla_due_date = cursor at 17:00:00Z.
      sla_due_date = advance_business_days(date(intake_received_at), channel.sla_business_days, H) at 17:00:00Z
    input_set: "IntakeChannelConfig.sla_business_days for the case's channel; all HolidayCalendarEntry rows; Case.intake_received_at."
    constants:
      BUSINESS_DAY_END_HOUR_UTC: 17
    precision: "date granularity; result stamped at 17:00:00Z"
    variants: []

  - name: overdue_business_days
    trigger: "on GET /er/cases/{id} and list reads (computed read); also used by trend alerting"
    algorithm: chronological
    formula: |
      # Business days elapsed past sla_due_date. Boundary semantics:
      # overdue_business_days == 0 while now <= sla_due_date.
      # When now > sla_due_date: count business days (Mon-Fri, not in holiday
      # set H) in the half-open interval (sla_due_date, now], i.e. the first
      # business day AFTER the due date counts as 1.
      if now <= sla_due_date: overdue_business_days = 0
      else: overdue_business_days = count_business_days_in((date(sla_due_date), date(now)], H)
    input_set: "Case.sla_due_date; HolidayCalendarEntry set; logical clock now."
    constants: {}
    precision: "integer business days"
    variants: []

  - name: litigation_manifest
    trigger: "on LitigationFilePackage finalize and seal"
    algorithm: projection
    formula: |
      # Manifest membership — the package projects the case file:
      #   entries = (EvidenceItem where case_id = case.id and status != ARCHIVED)
      #           + (Interview where case_id = case.id and status == COMPLETED)
      #           + (Finding where case_id = case.id)
      #           + (ClosureNotice where case_id = case.id and status == SENT)
      # Ordering: entries sorted by (created_at ASC, entry_type tie-break order
      #   EVIDENCE < INTERVIEW < FINDING < NOTICE). id is never a sort key.
      # item_count = len(entries)
      # manifest_hash = SHA-256 over the concatenation of per-entry strings
      #   "<entry_type>:<entity_uuid>:<updated_at_iso>" joined by "\n".
    input_set: "EvidenceItem (status != ARCHIVED), Interview (COMPLETED), Finding (all), ClosureNotice (SENT) for the case."
    constants:
      TYPE_ORDER: "EVIDENCE,INTERVIEW,FINDING,NOTICE"
    precision: "hash is exact; item_count integer"
    variants: []

# =============================================================================
# §1.4 Validation Rules Table (ordered by priority)
# =============================================================================
validations:
  - priority: 1
    category: auth
    check: "X-User-Role header present and names a declared role"
    error_id: ERR_UNAUTHENTICATED
    http_status: 401
    applies_to: "all"
  - priority: 2
    category: auth
    check: "X-User-ID header present (required for entity_backed roles)"
    error_id: ERR_UNAUTHENTICATED
    http_status: 401
    applies_to: "all"
  - priority: 3
    category: auth
    check: "Role is permitted to invoke this endpoint per §1.5 roles"
    error_id: ERR_UNAUTHORIZED
    http_status: 403
    applies_to: "all"
  - priority: 4
    category: existence
    check: "Path-referenced resources exist, validated left-to-right (case before interview before finding etc.)"
    error_id: ERR_NOT_FOUND
    http_status: 404
    applies_to: "all"
  - priority: 5
    category: existence
    check: "Body-referenced foreign keys resolve to existing rows (employee ids, channel id, investigator id, finding id)"
    error_id: ERR_REFERENCED_NOT_FOUND
    http_status: 422
    applies_to: "all"
  - priority: 6
    category: state
    check: "Target resource is in a state from which the requested transition exists per §1.2; for PATCH /er/cases/{id}: intake_channel_id/category/severity require status TRIAGE, litigation_hold requires status IN {TRIAGE, CLOSED}"
    error_id: ERR_INVALID_STATE
    http_status: 409
    applies_to: "all action endpoints"
  - priority: 7
    category: state
    check: "Case.litigation_hold == false for any mutating transition on Case or its children, EXCEPT: LitigationFilePackage assembly actions, ClosureNotice suppress, and PATCH /er/cases/{id} itself (the endpoint that toggles the hold)"
    error_id: ERR_LITIGATION_HOLD
    http_status: 409
    applies_to: "all case-mutating endpoints"
  - priority: 8
    category: business_safety
    check: "Segregation of duties: finding approver/rejector is not the finding author; evidence admitter is the same investigator who began review"
    error_id: ERR_SEGREGATION_OF_DUTIES
    http_status: 422
    applies_to: "POST /er/findings/{id}/approve, POST /er/findings/{id}/reject, POST /er/evidence-items/{id}/admit, POST /er/evidence-items/{id}/exclude"
  - priority: 9
    category: business_safety
    check: "Conflict check: investigator's conflicted_employee_ids must not contain the case subject or reporter"
    error_id: ERR_INVESTIGATOR_CONFLICT
    http_status: 422
    applies_to: "POST /er/cases/{id}/assign, POST /er/findings/{id}/approve"
  - priority: 10
    category: business_safety
    check: "Certification level authorizes the case severity"
    error_id: ERR_CERTIFICATION_INSUFFICIENT
    http_status: 422
    applies_to: "POST /er/cases/{id}/assign"
  - priority: 11
    category: business_safety
    check: "Confidentiality: SUBJECT recipients may not receive TIER_3_FULL notices; TIER_1_SUMMARY body must not name other involved employees"
    error_id: ERR_CONFIDENTIALITY_VIOLATION
    http_status: 422
    applies_to: "POST /er/cases/{id}/closure-notices, POST /er/closure-notices/{id}/send"
  - priority: 12
    category: business_temporal
    check: "Interview window: scheduled_end strictly after scheduled_start; new interview must not overlap (half-open [start, end)) any existing SCHEDULED interview of the same interviewer"
    error_id: ERR_INTERVIEW_OVERLAP
    http_status: 422
    applies_to: "POST /er/cases/{id}/interviews"
  - priority: 13
    category: business_temporal
    check: "Interview completion/marking timing rules (complete only at/after scheduled_start; no-show only after scheduled_end + 30 min)"
    error_id: ERR_TIMING_VIOLATION
    http_status: 422
    applies_to: "POST /er/interviews/{id}/complete, POST /er/interviews/{id}/mark-no-show"
  - priority: 14
    category: business_constraint
    check: "Investigator capacity: active_case_count < max_active_cases at assignment"
    error_id: ERR_CAPACITY_EXCEEDED
    http_status: 422
    applies_to: "POST /er/cases/{id}/assign"
  - priority: 15
    category: business_constraint
    check: "Uniqueness: employee_number, email, channel_code, holiday_date unique; manager chain acyclic"
    error_id: ERR_DUPLICATE
    http_status: 409
    applies_to: "POST /er/employees, PATCH /er/employees/{id}, POST /er/intake-channels, POST /er/holiday-calendar"
  - priority: 16
    category: business_constraint
    check: "Documentation standards: interview documentation_text >= 50 chars; finding rationale_text >= 100 chars; action justification >= 30 chars; reopen_reason >= 30; rejection_reason >= 20; exclusion_reason >= 20; hold_reason >= 20"
    error_id: ERR_DOCUMENTATION_STANDARD
    http_status: 422
    applies_to: "documentation-bearing endpoints"
  - priority: 17
    category: business_constraint
    check: "Substantiation consistency: SUBSTANTIATED forbidden when every CredibilityAssessment active score < 0.50"
    error_id: ERR_INSUFFICIENT_CREDIBILITY
    http_status: 422
    applies_to: "POST /er/findings/{id}/substantiate"
  - priority: 18
    category: business_constraint
    check: "Closure gates: finding APPROVED, required notices SENT (reporter notice skipped for anonymous cases)"
    error_id: ERR_CLOSURE_GATE
    http_status: 422
    applies_to: "POST /er/cases/{id}/close"
  - priority: 19
    category: business_constraint
    check: "Reopen cap: reopen_count < 2"
    error_id: ERR_REOPEN_LIMIT
    http_status: 422
    applies_to: "POST /er/cases/{id}/reopen"
  - priority: 20
    category: business_referential
    check: "Closure notice recipient must be the case's reporter or subject employee"
    error_id: ERR_RECIPIENT_MISMATCH
    http_status: 422
    applies_to: "POST /er/cases/{id}/closure-notices"
  - priority: 21
    category: business_referential
    check: "Trend snapshot scope_key must resolve: MANAGER scope requires an existing Employee id; LOCATION scope requires a location_code present on at least one Employee"
    error_id: ERR_SCOPE_NOT_FOUND
    http_status: 422
    applies_to: "POST /er/trend-snapshots"
  - priority: 22
    category: business_fiscal
    check: "Trend headcount denominator non-zero when closed_case_count > 0"
    error_id: ERR_TREND_HEADCOUNT_ZERO
    http_status: 422
    applies_to: "POST /er/trend-snapshots"
  - priority: 23
    category: business_fiscal
    check: "OCC: expected_case_version equals the case's current version on guarded endpoints"
    error_id: ERR_STALE_VERSION
    http_status: 412
    applies_to: "POST /er/cases/{id}/assign, POST /er/cases/{id}/close, POST /er/cases/{id}/unassign, POST /er/litigation-packages/{id}/seal"
  - priority: 24
    category: business_constraint
    check: "Required request fields present and well-typed; enum values in declared sets"
    error_id: ERR_INVALID_REQUEST
    http_status: 400
    applies_to: "all"

# =============================================================================
# §1.5 API Endpoint Table
# =============================================================================
endpoints:
  # --- clock (logical time) ---
  - method: POST
    path: "/er/_clock/set_current_utc"
    description: "Sets the logical clock used by all timestamps, SLA arithmetic, and timing validations. Server startup default is exactly 2026-08-01T00:00:00Z; before any set call the clock reads this default and never wall-clock time."
    roles: [ERManager]
    code: 200
    input: [to_iso8601]
    output: { current_utc: string }
    side_effects: ["logical clock advanced"]

  # --- employees ---
  - method: POST
    path: "/er/employees"
    description: "Create an employee record"
    roles: [ERManager]
    code: 201
    input: [employee_number, full_name, email, location_code, department, hire_date, "manager_id?", "employment_status?"]
    output: Employee
    side_effects: []
  - method: GET
    path: "/er/employees/{id}"
    description: "Fetch one employee"
    roles: [ERManager, Investigator, LegalCounsel, HRAnalyst]
    code: 200
    input: []
    output: Employee
    side_effects: []
  - method: GET
    path: "/er/employees"
    description: "List employees with pagination and filters"
    roles: [ERManager, Investigator, LegalCounsel, HRAnalyst]
    code: 200
    input: ["location_code?", "department?", "employment_status?", "manager_id?", "limit?", "offset?"]
    output: Employee[]
    side_effects: []
  - method: PATCH
    path: "/er/employees/{id}"
    description: "Update mutable employee fields (manager, location, status). Manager-chain cycle check applies."
    roles: [ERManager]
    code: 200
    input: ["full_name?", "manager_id?", "location_code?", "department?", "employment_status?"]
    output: Employee
    side_effects: ["Employee.version increments by 1"]

  # --- investigators ---
  - method: POST
    path: "/er/investigators"
    description: "Create an investigator profile bound to an employee"
    roles: [ERManager]
    code: 201
    input: [employee_id, certification_level, max_active_cases, "conflicted_employee_ids?"]
    output: Investigator
    side_effects: []
  - method: GET
    path: "/er/investigators/{id}"
    description: "Fetch one investigator (includes derived active_case_count)"
    roles: [ERManager, Investigator, LegalCounsel]
    code: 200
    input: []
    output: Investigator
    side_effects: []
  - method: GET
    path: "/er/investigators"
    description: "List investigators"
    roles: [ERManager, LegalCounsel, HRAnalyst]
    code: 200
    input: ["certification_level?", "employee_id?", "limit?", "offset?"]
    output: Investigator[]
    side_effects: []
  - method: PATCH
    path: "/er/investigators/{id}"
    description: "Update investigator capacity or conflict list"
    roles: [ERManager]
    code: 200
    input: ["certification_level?", "max_active_cases?", "conflicted_employee_ids?"]
    output: Investigator
    side_effects: ["Investigator.version increments by 1"]

  # --- intake channels ---
  - method: POST
    path: "/er/intake-channels"
    description: "Create an intake channel configuration"
    roles: [ERManager]
    code: 201
    input: [channel_code, display_name, default_category, sla_business_days, "default_severity?", "requires_reporter_identity?"]
    output: IntakeChannelConfig
    side_effects: []
  - method: GET
    path: "/er/intake-channels"
    description: "List intake channels"
    roles: [ERManager, Investigator, HRAnalyst]
    code: 200
    input: ["limit?", "offset?"]
    output: IntakeChannelConfig[]
    side_effects: []

  # --- holidays (SLA calendar) ---
  - method: POST
    path: "/er/holiday-calendar"
    description: "Register a company holiday excluded from SLA business-day arithmetic"
    roles: [ERManager]
    code: 201
    input: [holiday_date, label]
    output: HolidayCalendarEntry
    side_effects: []
  - method: GET
    path: "/er/holiday-calendar"
    description: "List holiday entries"
    roles: [ERManager, Investigator, LegalCounsel, HRAnalyst]
    code: 200
    input: ["limit?", "offset?"]
    output: HolidayCalendarEntry[]
    side_effects: []

  # --- cases ---
  - method: POST
    path: "/er/cases"
    description: "Intake a new case. Category/severity fall back to channel defaults when omitted. Server stamps intake_received_at from the logical clock and computes sla_due_date."
    roles: [ERManager]
    code: 201
    input: [intake_channel_id, subject_employee_id, "reporter_employee_id?", "category?", "severity?", "litigation_hold?"]
    output: Case
    side_effects: ["case_number minted", "sla_due_date computed via sla_business_day_due_date"]
  - method: GET
    path: "/er/cases/{id}"
    description: "Fetch a case (computed overdue_business_days included)"
    roles: [ERManager, Investigator, LegalCounsel, HRAnalyst]
    code: 200
    input: []
    output: Case
    side_effects: []
  - method: GET
    path: "/er/cases"
    description: "List cases with filters and pagination"
    roles: [ERManager, Investigator, LegalCounsel, HRAnalyst]
    code: 200
    input: ["status?", "category?", "severity?", "assigned_investigator_id?", "subject_employee_id?", "reporter_employee_id?", "intake_channel_id?", "litigation_hold?", "limit?", "offset?"]
    output: Case[]
    side_effects: []
  - method: POST
    path: "/er/cases/{id}/assign"
    description: "Assign an investigator (TRIAGE/REOPENED -> ASSIGNED). OCC-guarded."
    roles: [ERManager]
    code: 200
    input: [investigator_id, expected_case_version]
    output: Case
    side_effects: ["Case.assigned_investigator_id set", "Investigator.active_case_count recomputed", "increments Case.version by 1"]
  - method: POST
    path: "/er/cases/{id}/unassign"
    description: "Remove assignment (ASSIGNED -> TRIAGE). OCC-guarded."
    roles: [ERManager]
    code: 200
    input: [expected_case_version]
    output: Case
    side_effects: ["Case.assigned_investigator_id cleared", "Investigator.active_case_count recomputed", "increments Case.version by 1"]
  - method: POST
    path: "/er/cases/{id}/begin-investigation"
    description: "Assigned investigator opens the investigation (ASSIGNED -> INVESTIGATING)"
    roles: [Investigator]
    code: 200
    input: []
    output: Case
    side_effects: ["increments Case.version by 1"]
  - method: POST
    path: "/er/cases/{id}/hold"
    description: "Place an investigating case on hold; cancels all SCHEDULED interviews (cascade)"
    roles: [ERManager]
    code: 200
    input: [hold_reason]
    output: Case
    side_effects: ["SCHEDULED Interviews -> CANCELLED", "increments Case.version by 1"]
  - method: POST
    path: "/er/cases/{id}/resume"
    description: "Resume a held case (ON_HOLD -> INVESTIGATING)"
    roles: [ERManager]
    code: 200
    input: []
    output: Case
    side_effects: ["increments Case.version by 1"]
  - method: POST
    path: "/er/cases/{id}/close"
    description: "Close a case (PENDING_CLOSURE -> CLOSED). OCC-guarded. Validates closure gates."
    roles: [ERManager]
    code: 200
    input: [expected_case_version]
    output: Case
    side_effects: ["closed_at and days_to_close stamped", "Investigator.active_case_count recomputed (decrement)", "matching TrendSnapshots marked is_stale", "increments Case.version by 1"]
  - method: POST
    path: "/er/cases/{id}/reopen"
    description: "Reopen a closed case (CLOSED -> REOPENED). Max two reopens. Flips credibility variant to RECENCY_WEIGHTED."
    roles: [ERManager]
    code: 200
    input: [reopen_reason]
    output: Case
    side_effects: ["reopen_count + 1", "CredibilityAssessment.active_variant := RECENCY_WEIGHTED and scores recomputed", "matching TrendSnapshots marked is_stale", "increments Case.version by 1"]
  - method: PATCH
    path: "/er/cases/{id}"
    description: "Update mutable case fields. intake_channel_id, category, and severity are mutable only while Case.status == TRIAGE (channel change recomputes sla_due_date). litigation_hold is mutable only while Case.status IN {TRIAGE, CLOSED} — legal places a litigation hold either at intake or immediately after closure when litigation is anticipated."
    roles: [ERManager]
    code: 200
    input: ["intake_channel_id?", "category?", "severity?", "litigation_hold?"]
    output: Case
    side_effects: ["sla_due_date recomputed when intake_channel_id changes", "increments Case.version by 1"]

  # --- interviews ---
  - method: POST
    path: "/er/cases/{id}/interviews"
    description: "Schedule an interview under a case (case must be INVESTIGATING). Half-open overlap check against the interviewer's existing SCHEDULED interviews."
    roles: [Investigator]
    code: 201
    input: [interviewee_employee_id, scheduled_start, scheduled_end]
    output: Interview
    side_effects: ["interviewer_investigator_id := case's assigned investigator"]
  - method: GET
    path: "/er/cases/{id}/interviews"
    description: "List interviews of a case"
    roles: [ERManager, Investigator, LegalCounsel]
    code: 200
    input: ["status?", "limit?", "offset?"]
    output: Interview[]
    side_effects: []
  - method: GET
    path: "/er/interviews/{id}"
    description: "Fetch one interview"
    roles: [ERManager, Investigator, LegalCounsel]
    code: 200
    input: []
    output: Interview
    side_effects: []
  - method: GET
    path: "/er/interviews"
    description: "List interviews across cases with filters (supports reverse lookup by interviewee or interviewer)"
    roles: [ERManager, Investigator, LegalCounsel]
    code: 200
    input: ["interviewee_employee_id?", "interviewer_investigator_id?", "status?", "limit?", "offset?"]
    output: Interview[]
    side_effects: []
  - method: POST
    path: "/er/interviews/{id}/complete"
    description: "Mark an interview COMPLETED with documentation (>= 50 chars)"
    roles: [Investigator]
    code: 200
    input: [documentation_text]
    output: Interview
    side_effects: ["completed_at stamped", "documentation_word_count computed"]
  - method: POST
    path: "/er/interviews/{id}/mark-no-show"
    description: "Mark an interview NO_SHOW (only after scheduled_end + 30 minutes)"
    roles: [Investigator]
    code: 200
    input: []
    output: Interview
    side_effects: []
  - method: POST
    path: "/er/interviews/{id}/cancel"
    description: "Cancel a scheduled interview"
    roles: [Investigator, ERManager]
    code: 200
    input: []
    output: Interview
    side_effects: []

  # --- evidence ---
  - method: POST
    path: "/er/cases/{id}/evidence-items"
    description: "Log an evidence item under a case (case must be INVESTIGATING or FINDINGS_DRAFT). Server assigns custody_sequence."
    roles: [Investigator]
    code: 201
    input: [submitted_by_employee_id, evidence_type, description]
    output: EvidenceItem
    side_effects: ["custody_sequence assigned (next per-case ordinal)"]
  - method: GET
    path: "/er/cases/{id}/evidence-items"
    description: "List evidence items of a case"
    roles: [ERManager, Investigator, LegalCounsel]
    code: 200
    input: ["status?", "evidence_type?", "limit?", "offset?"]
    output: EvidenceItem[]
    side_effects: []
  - method: GET
    path: "/er/evidence-items/{id}"
    description: "Fetch one evidence item"
    roles: [ERManager, Investigator, LegalCounsel]
    code: 200
    input: []
    output: EvidenceItem
    side_effects: []
  - method: GET
    path: "/er/evidence-items"
    description: "List evidence items across cases with filters (supports reverse lookup by submitter or reviewer)"
    roles: [ERManager, Investigator, LegalCounsel]
    code: 200
    input: ["submitted_by_employee_id?", "reviewed_by_investigator_id?", "status?", "evidence_type?", "limit?", "offset?"]
    output: EvidenceItem[]
    side_effects: []
  - method: POST
    path: "/er/evidence-items/{id}/begin-review"
    description: "Move evidence LOGGED -> UNDER_REVIEW; binds the reviewing investigator"
    roles: [Investigator]
    code: 200
    input: []
    output: EvidenceItem
    side_effects: ["reviewed_by_investigator_id set"]
  - method: POST
    path: "/er/evidence-items/{id}/admit"
    description: "Admit evidence with weight; only the bound reviewer may admit"
    roles: [Investigator]
    code: 200
    input: [weight]
    output: EvidenceItem
    side_effects: []
  - method: POST
    path: "/er/evidence-items/{id}/exclude"
    description: "Exclude evidence with reason; only the bound reviewer may exclude"
    roles: [Investigator]
    code: 200
    input: [exclusion_reason]
    output: EvidenceItem
    side_effects: []
  - method: POST
    path: "/er/evidence-items/{id}/archive"
    description: "Archive excluded evidence after case closure"
    roles: [ERManager]
    code: 200
    input: []
    output: EvidenceItem
    side_effects: []

  # --- credibility assessments ---
  - method: POST
    path: "/er/cases/{id}/credibility-assessments"
    description: "Record a credibility assessment; both score variants computed server-side"
    roles: [Investigator]
    code: 201
    input: [subject_employee_id, corroboration_count, contradiction_count, account_age_days]
    output: CredibilityAssessment
    side_effects: ["score_corroboration and score_recency computed via credibility_score"]
  - method: GET
    path: "/er/cases/{id}/credibility-assessments"
    description: "List credibility assessments of a case"
    roles: [ERManager, Investigator, LegalCounsel]
    code: 200
    input: ["limit?", "offset?"]
    output: CredibilityAssessment[]
    side_effects: []
  - method: GET
    path: "/er/credibility-assessments/{id}"
    description: "Fetch one credibility assessment"
    roles: [ERManager, Investigator, LegalCounsel]
    code: 200
    input: []
    output: CredibilityAssessment
    side_effects: []
  - method: GET
    path: "/er/credibility-assessments"
    description: "List credibility assessments across cases with filters (supports reverse lookup by subject or assessor)"
    roles: [ERManager, Investigator, LegalCounsel]
    code: 200
    input: ["subject_employee_id?", "assessor_investigator_id?", "limit?", "offset?"]
    output: CredibilityAssessment[]
    side_effects: []

  # --- findings & actions ---
  - method: POST
    path: "/er/cases/{id}/findings"
    description: "Create the finding draft for a case (moves INVESTIGATING -> FINDINGS_DRAFT). Requires at least one COMPLETED interview and one ADMITTED evidence item."
    roles: [Investigator]
    code: 201
    input: [rationale_text]
    output: Finding
    side_effects: ["Case.status := FINDINGS_DRAFT", "author_investigator_id := acting investigator", "increments Case.version by 1"]
  - method: GET
    path: "/er/cases/{id}/findings"
    description: "List findings of a case"
    roles: [ERManager, Investigator, LegalCounsel]
    code: 200
    input: ["limit?", "offset?"]
    output: Finding[]
    side_effects: []
  - method: GET
    path: "/er/findings/{id}"
    description: "Fetch one finding"
    roles: [ERManager, Investigator, LegalCounsel]
    code: 200
    input: []
    output: Finding
    side_effects: []
  - method: GET
    path: "/er/findings"
    description: "List findings across cases with filters (supports reverse lookup by author)"
    roles: [ERManager, Investigator, LegalCounsel]
    code: 200
    input: ["author_investigator_id?", "substantiation_status?", "approval_status?", "limit?", "offset?"]
    output: Finding[]
    side_effects: []
  - method: PATCH
    path: "/er/findings/{id}"
    description: "Edit rationale_text while substantiation_status == DRAFT"
    roles: [Investigator]
    code: 200
    input: [rationale_text]
    output: Finding
    side_effects: []
  - method: POST
    path: "/er/findings/{id}/substantiate"
    description: "Set substantiation outcome (DRAFT -> SUBSTANTIATED/UNSUBSTANTIATED/INCONCLUSIVE). Credibility-consistency gate applies."
    roles: [Investigator]
    code: 200
    input: [outcome]
    output: Finding
    side_effects: []
  - method: POST
    path: "/er/findings/{id}/actions"
    description: "Propose a recommended action under a finding"
    roles: [Investigator]
    code: 201
    input: [action_type, severity_points, justification]
    output: RecommendedAction
    side_effects: []
  - method: GET
    path: "/er/findings/{id}/actions"
    description: "List recommended actions of a finding"
    roles: [ERManager, Investigator, LegalCounsel]
    code: 200
    input: ["status?", "limit?", "offset?"]
    output: RecommendedAction[]
    side_effects: []
  - method: POST
    path: "/er/recommended-actions/{id}/withdraw"
    description: "Withdraw a PROPOSED action while the finding is still in PENDING_REVIEW/REJECTED"
    roles: [Investigator]
    code: 200
    input: []
    output: RecommendedAction
    side_effects: []
  - method: POST
    path: "/er/findings/{id}/submit-for-calibration"
    description: "Move finding PENDING_REVIEW -> CALIBRATED (enters calibration pool); case moves to CALIBRATION"
    roles: [Investigator]
    code: 200
    input: []
    output: Finding
    side_effects: ["Case.status := CALIBRATION", "increments Case.version by 1"]
  - method: POST
    path: "/er/findings/{id}/approve"
    description: "Cast a calibration approval vote. Second distinct non-author vote reaches quorum: finding APPROVED, calibration_score computed, actions flipped, case -> PENDING_CLOSURE."
    roles: [Investigator]
    code: 200
    input: []
    output: Finding
    side_effects: ["calibrated_by_ids appended", "on quorum: calibration_score computed, PROPOSED actions -> ACCEPTED/SUPERSEDED, Case.status := PENDING_CLOSURE", "increments Case.version by 1"]
  - method: POST
    path: "/er/findings/{id}/reject"
    description: "Reject a finding in calibration; loops back to DRAFT (FINDINGS_DRAFT) with calibrated_by_ids cleared"
    roles: [Investigator]
    code: 200
    input: [rejection_reason]
    output: Finding
    side_effects: ["substantiation_status := DRAFT, approval_status := PENDING_REVIEW, calibrated_by_ids cleared", "Case.status := FINDINGS_DRAFT", "increments Case.version by 1"]

  # --- closure notices ---
  - method: POST
    path: "/er/cases/{id}/closure-notices"
    description: "Draft a closure notice for the reporter or subject (case must be PENDING_CLOSURE)"
    roles: [ERManager]
    code: 201
    input: [recipient_employee_id, recipient_role, confidentiality_tier, body_text]
    output: ClosureNotice
    side_effects: ["closure_sequence assigned (reopen_count + 1)"]
  - method: GET
    path: "/er/cases/{id}/closure-notices"
    description: "List closure notices of a case"
    roles: [ERManager, LegalCounsel]
    code: 200
    input: ["delivery_status?", "recipient_role?", "limit?", "offset?"]
    output: ClosureNotice[]
    side_effects: []
  - method: GET
    path: "/er/closure-notices/{id}"
    description: "Fetch one closure notice"
    roles: [ERManager, LegalCounsel]
    code: 200
    input: []
    output: ClosureNotice
    side_effects: []
  - method: GET
    path: "/er/closure-notices"
    description: "List closure notices across cases with filters (supports reverse lookup by recipient)"
    roles: [ERManager, LegalCounsel]
    code: 200
    input: ["recipient_employee_id?", "delivery_status?", "recipient_role?", "limit?", "offset?"]
    output: ClosureNotice[]
    side_effects: []
  - method: POST
    path: "/er/closure-notices/{id}/send"
    description: "Send a queued notice (QUEUED -> SENT); stamps sent_at"
    roles: [ERManager]
    code: 200
    input: []
    output: ClosureNotice
    side_effects: ["sent_at stamped"]
  - method: POST
    path: "/er/closure-notices/{id}/mark-failed"
    description: "Mark a queued notice FAILED"
    roles: [ERManager]
    code: 200
    input: [failure_reason]
    output: ClosureNotice
    side_effects: []
  - method: POST
    path: "/er/closure-notices/{id}/retry"
    description: "Retry a failed notice (FAILED -> QUEUED)"
    roles: [ERManager]
    code: 200
    input: []
    output: ClosureNotice
    side_effects: []
  - method: POST
    path: "/er/closure-notices/{id}/suppress"
    description: "Suppress a queued notice under litigation hold (QUEUED -> SUPPRESSED)"
    roles: [LegalCounsel]
    code: 200
    input: []
    output: ClosureNotice
    side_effects: []

  # --- trend snapshots ---
  - method: POST
    path: "/er/trend-snapshots"
    description: "Compute and persist a trend snapshot for a MANAGER or LOCATION scope under a chosen window variant"
    roles: [HRAnalyst, ERManager]
    code: 201
    input: [scope_type, scope_key, window_kind]
    output: TrendSnapshot
    side_effects: ["trend_case_rate computed; prior snapshot with identical (scope_type, scope_key, window_kind) is superseded (is_stale := true)"]
  - method: GET
    path: "/er/trend-snapshots"
    description: "List trend snapshots with filters"
    roles: [HRAnalyst, ERManager, LegalCounsel]
    code: 200
    input: ["scope_type?", "scope_key?", "window_kind?", "is_stale?", "limit?", "offset?"]
    output: TrendSnapshot[]
    side_effects: []
  - method: GET
    path: "/er/trend-snapshots/{id}"
    description: "Fetch one trend snapshot"
    roles: [HRAnalyst, ERManager, LegalCounsel]
    code: 200
    input: []
    output: TrendSnapshot
    side_effects: []

  # --- litigation packages ---
  - method: POST
    path: "/er/cases/{id}/litigation-packages"
    description: "Start assembling a litigation-ready file package for a case (case must be CLOSED with litigation_hold == true)"
    roles: [LegalCounsel]
    code: 201
    input: []
    output: LitigationFilePackage
    side_effects: ["item_count computed via litigation_manifest projection"]
  - method: GET
    path: "/er/cases/{id}/litigation-packages"
    description: "List litigation packages of a case"
    roles: [LegalCounsel, ERManager]
    code: 200
    input: ["status?", "limit?", "offset?"]
    output: LitigationFilePackage[]
    side_effects: []
  - method: GET
    path: "/er/litigation-packages/{id}"
    description: "Fetch one litigation package"
    roles: [LegalCounsel, ERManager]
    code: 200
    input: []
    output: LitigationFilePackage
    side_effects: []
  - method: POST
    path: "/er/litigation-packages/{id}/finalize"
    description: "ASSEMBLING -> READY; computes manifest_hash"
    roles: [LegalCounsel]
    code: 200
    input: []
    output: LitigationFilePackage
    side_effects: ["manifest_hash computed"]
  - method: POST
    path: "/er/litigation-packages/{id}/seal"
    description: "READY -> SEALED; OCC-guarded on parent case version; freezes manifest_hash"
    roles: [LegalCounsel]
    code: 200
    input: [expected_case_version]
    output: LitigationFilePackage
    side_effects: ["sealed_at stamped", "manifest_hash frozen", "increments Case.version by 1"]
  - method: POST
    path: "/er/litigation-packages/{id}/release"
    description: "SEALED -> RELEASED with external authority reference"
    roles: [LegalCounsel]
    code: 200
    input: [release_authority_reference]
    output: LitigationFilePackage
    side_effects: []

# =============================================================================
# §1.6 Error Code Catalog
# =============================================================================
errors:
  - id: ERR_UNAUTHENTICATED
    http: 401
    condition: "Missing/invalid X-User-Role or X-User-ID header"
  - id: ERR_UNAUTHORIZED
    http: 403
    condition: "Role not permitted to invoke this endpoint"
  - id: ERR_NOT_FOUND
    http: 404
    condition: "Path-referenced resource does not exist"
  - id: ERR_REFERENCED_NOT_FOUND
    http: 422
    condition: "Body-referenced FK (employee, channel, investigator, finding) does not resolve"
  - id: ERR_INVALID_STATE
    http: 409
    condition: "Requested transition is not defined from the resource's current state"
  - id: ERR_LITIGATION_HOLD
    http: 409
    condition: "Mutation blocked because Case.litigation_hold is true"
  - id: ERR_SEGREGATION_OF_DUTIES
    http: 422
    condition: "Same-investigator action forbidden (author vs approver; reviewer binding)"
  - id: ERR_INVESTIGATOR_CONFLICT
    http: 422
    condition: "Investigator conflicted against case subject or reporter"
  - id: ERR_CERTIFICATION_INSUFFICIENT
    http: 422
    condition: "Investigator certification level does not cover the case severity"
  - id: ERR_CONFIDENTIALITY_VIOLATION
    http: 422
    condition: "Notice content/tier violates confidentiality rules for the recipient role"
  - id: ERR_INTERVIEW_OVERLAP
    http: 422
    condition: "Interview window overlaps (half-open) an existing SCHEDULED interview of the same interviewer, or end <= start"
  - id: ERR_TIMING_VIOLATION
    http: 422
    condition: "Action attempted outside its permitted time window (complete before start; no-show before end+30min)"
  - id: ERR_CAPACITY_EXCEEDED
    http: 422
    condition: "Investigator active_case_count would reach/exceed max_active_cases"
  - id: ERR_DUPLICATE
    http: 409
    condition: "Uniqueness violation (employee_number, email, channel_code, holiday_date) or manager-chain cycle"
  - id: ERR_DOCUMENTATION_STANDARD
    http: 422
    condition: "Narrative field below its minimum length standard"
  - id: ERR_INSUFFICIENT_CREDIBILITY
    http: 422
    condition: "SUBSTANTIATED outcome inconsistent with active credibility scores (all < 0.50)"
  - id: ERR_CLOSURE_GATE
    http: 422
    condition: "Closure precondition unmet (finding not APPROVED; required notices not SENT)"
  - id: ERR_REOPEN_LIMIT
    http: 422
    condition: "Case has already been reopened twice"
  - id: ERR_RECIPIENT_MISMATCH
    http: 422
    condition: "Closure notice recipient is not the case reporter or subject"
  - id: ERR_SCOPE_NOT_FOUND
    http: 422
    condition: "Trend scope_key does not resolve to an employee (MANAGER) or known location (LOCATION)"
  - id: ERR_TREND_HEADCOUNT_ZERO
    http: 422
    condition: "Trend denominator zero while closed cases exist in window"
  - id: ERR_STALE_VERSION
    http: 412
    condition: "expected_case_version does not match the case's current version (OCC)"
  - id: ERR_INVALID_REQUEST
    http: 400
    condition: "Missing required field, malformed value, or out-of-set enum"

# =============================================================================
# §1.7 RBAC Matrix
# =============================================================================
roles:
  - name: ERManager
    description: "Employee-relations department manager; owns intake, assignment, closure, calendar, and reference data"
    identity: "opaque"
    exclusive_operations:
      - "create/patch employees, investigators, intake channels, holiday calendar"
      - "intake cases; assign/unassign investigators; hold/resume; close; reopen"
      - "draft/send/fail/retry closure notices; archive evidence"
    shared_operations:
      - "read cases, employees, investigators, interviews, evidence, findings, notices, trends, packages"
      - "compute trend snapshots"
  - name: Investigator
    description: "Case investigator; conducts interviews, reviews evidence, drafts findings, casts calibration votes"
    identity: "entity_backed:Investigator"
    exclusive_operations:
      - "begin investigation on own assigned cases"
      - "schedule/complete/cancel/mark-no-show own interviews"
      - "log/review/admit/exclude evidence on own cases"
      - "create credibility assessments, findings, recommended actions"
      - "substantiate findings; submit for calibration; approve/reject others' findings"
    shared_operations:
      - "read cases, employees, interviews, evidence, findings, intake channels"
  - name: LegalCounsel
    description: "Legal department counsel; assembles litigation packages, suppresses notices under hold"
    identity: "opaque"
    exclusive_operations:
      - "create/finalize/seal/release litigation packages"
      - "suppress closure notices"
    shared_operations:
      - "read cases, employees, investigators, interviews, evidence, findings, notices, trends"
  - name: HRAnalyst
    description: "People-analytics analyst; computes and reads trend snapshots"
    identity: "opaque"
    exclusive_operations:
      - "compute trend snapshots (shared with ERManager)"
    shared_operations:
      - "read cases, employees, intake channels, trend snapshots"
