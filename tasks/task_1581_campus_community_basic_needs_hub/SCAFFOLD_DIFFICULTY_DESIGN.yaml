              as: ShelterCoordinator
              as_user_id: "${sc_id}"
              captures: { s_n: $.data.id }
            - call: "POST /clients/${c2_id}/shelter-stays"
              payload: { bed_id: "${bed_p}", check_in_date: "2026-08-10", planned_nights: 2 }
              as: ShelterCoordinator
              as_user_id: "${sc_id}"
              captures: { s_p: $.data.id, s_p_co: $.data.check_out_exclusive, s_p_buf: $.data.buffer_until_exclusive }
          trigger:
            - call: "POST /clients/${c1_id}/shelter-stays"
              payload: { bed_id: "${bed_n}", check_in_date: "2026-08-12", planned_nights: 1 }
