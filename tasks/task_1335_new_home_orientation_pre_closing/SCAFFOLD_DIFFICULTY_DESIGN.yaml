# =============================================================================
# §1.8 Scaffold Difficulty Design — Test Targeting Index (task 1335)
# 9 Difficulty Rules x 2 instances each = 18 instances.
# Every instance grounds in SCAFFOLD.yaml §1.1–§1.7 and is replayable from
# empty-DB via the declared setup_api_calls chain.
# =============================================================================
scaffold_difficulty_design:

  # ------------------------------------------------------------------ Rule 1
  - rule_id: dual_variant_calc
    instances:
      - name: escrow_holdback_provisional_vs_final_at_close
        grounds:
          - calculations.escrow_holdback_amount
          - entities.EscrowHoldback.fields.final_holdback_cents
          - entities.EscrowHoldback.fields.holdback_amount_cents
          - state_machines.Home.READY_TO_CLOSE_to_CLOSED
        distinguishing_aspect: |
          Escrow domain variant split: for the SAME home and the SAME two
          after-closing items, the provisional variant (inclusion set includes
          SIGNED_OFF) yields 60000 while the final variant (excludes SIGNED_OFF)
          yields 40000 — a fiscal dual-variant, distinct from the analytics
          dual-variant of quality_trend_response_vs_home_weighted.
        test_recipe:
          setup:
            - "Community with holdback multiplier 2.0, min 1000, max 10000000"
            - "Home h1 (closing 2026-09-01T17:00:00Z) with orientation completed"
            - "Item d1 WARRANTABLE 20000 AFTER_CLOSING (contribution 40000); item d2 WARRANTABLE 10000 AFTER_CLOSING (contribution 20000)"
            - "d2 repaired, reinspected PASS and signed off by the buyer BEFORE closing"
            - "Acknowledgment signed; home READY_TO_CLOSE; escrow ACTIVE with provisional amount 60000"
          setup_api_calls:
            - { call: "POST /api/communities", payload: { name: "Riverbend", holdback_cost_multiplier: 2.0, holdback_min_cents: 1000, holdback_max_cents: 10000000 }, as: CustomerCareManager, captures: { c1: "$.data.id" } }
            - { call: "POST /api/homebuyers", payload: { full_name: "Alice Avery", email: "alice@example.com" }, as: CustomerCareManager, captures: { b1: "$.data.id" } }
            - { call: "POST /api/reps", payload: { full_name: "Rita Rep", email: "rita@example.com" }, as: CustomerCareManager, captures: { r1: "$.data.id" } }
            - { call: "POST /api/homes", payload: { community_id: "${c1}", primary_buyer_id: "${b1}", lot_number: "L-101", address: "1 Riverbend Way", sales_price_cents: 45000000, closing_date: "2026-09-01T17:00:00Z" }, as: CustomerCareManager, captures: { h1: "$.data.id" } }
            - { call: "POST /api/homes/${h1}/mark-ready", payload: {}, as: CustomerCareManager }
            - { call: "POST /api/appointments", payload: { home_id: "${h1}", rep_id: "${r1}", scheduled_start: "2026-08-25T14:00:00Z" }, as: CustomerCareRep, as_user_id: "${r1}", captures: { a1: "$.data.id" } }
            - { call: "POST /api/appointments/${a1}/confirm", payload: {}, as: CustomerCareManager }
            - { call: "POST /_clock/set_current_utc", payload: { to_iso8601: "2026-08-25T14:00:00Z" }, as: CustomerCareManager }
            - { call: "POST /api/appointments/${a1}/start", payload: {}, as: CustomerCareRep, as_user_id: "${r1}" }
            - { call: "POST /api/deficiency-items", payload: { home_id: "${h1}", appointment_id: "${a1}", system_key: "HVAC", title: "Furnace ignition fault" }, as: CustomerCareRep, as_user_id: "${r1}", captures: { d1: "$.data.id" } }
            - { call: "POST /api/deficiency-items/${d1}/classify", payload: { classification: "WARRANTABLE", estimated_repair_cost_cents: 20000 }, as: CustomerCareRep, as_user_id: "${r1}" }
            - { call: "POST /api/deficiency-items/${d1}/decide", payload: { resolution: "COMPLETE_AFTER_CLOSING" }, as: CustomerCareManager }
            - { call: "POST /api/deficiency-items", payload: { home_id: "${h1}", appointment_id: "${a1}", system_key: "EXTERIOR", title: "Gate latch misaligned" }, as: CustomerCareRep, as_user_id: "${r1}", captures: { d2: "$.data.id" } }
            - { call: "POST /api/deficiency-items/${d2}/classify", payload: { classification: "WARRANTABLE", estimated_repair_cost_cents: 10000 }, as: CustomerCareRep, as_user_id: "${r1}" }
            - { call: "POST /api/deficiency-items/${d2}/decide", payload: { resolution: "COMPLETE_AFTER_CLOSING" }, as: CustomerCareManager }
            - { call: "POST /api/attendees", payload: { appointment_id: "${a1}", attendee_type: "BUYER", buyer_id: "${b1}" }, as: CustomerCareRep, as_user_id: "${r1}", captures: { at1: "$.data.id" } }
            - { call: "POST /api/attendees/${at1}/decide-verification", payload: { decision: "VERIFIED" }, as: CustomerCareManager }
            - { call: "POST /api/appointments/${a1}/checklist-items/HVAC/mark", payload: { outcome: "DEMONSTRATED" }, as: CustomerCareRep, as_user_id: "${r1}" }
            - { call: "POST /api/appointments/${a1}/checklist-items/PLUMBING/mark", payload: { outcome: "DEMONSTRATED" }, as: CustomerCareRep, as_user_id: "${r1}" }
            - { call: "POST /api/appointments/${a1}/checklist-items/ELECTRICAL/mark", payload: { outcome: "DEMONSTRATED" }, as: CustomerCareRep, as_user_id: "${r1}" }
            - { call: "POST /api/appointments/${a1}/checklist-items/EXTERIOR/mark", payload: { outcome: "DEMONSTRATED" }, as: CustomerCareRep, as_user_id: "${r1}" }
            - { call: "POST /api/appointments/${a1}/checklist-items/SAFETY/mark", payload: { outcome: "DEMONSTRATED" }, as: CustomerCareRep, as_user_id: "${r1}" }
            - { call: "POST /api/appointments/${a1}/checklist-items/APPLIANCES/mark", payload: { outcome: "SKIPPED" }, as: CustomerCareRep, as_user_id: "${r1}" }
            - { call: "POST /api/appointments/${a1}/complete", payload: {}, as: CustomerCareRep, as_user_id: "${r1}" }
            - { call: "POST /api/deficiency-items/${d2}/start-repair", payload: {}, as: CustomerCareRep, as_user_id: "${r1}" }
            - { call: "POST /api/deficiency-items/${d2}/complete-repair", payload: {}, as: CustomerCareRep, as_user_id: "${r1}" }
            - { call: "POST /api/reinspection-visits", payload: { home_id: "${h1}", rep_id: "${r1}", scheduled_start: "2026-08-26T10:00:00Z", duration_minutes: 60 }, as: CustomerCareRep, as_user_id: "${r1}", captures: { v1: "$.data.id" } }
            - { call: "POST /_clock/set_current_utc", payload: { to_iso8601: "2026-08-26T10:00:00Z" }, as: CustomerCareManager }
            - { call: "POST /api/reinspection-visits/${v1}/complete", payload: { results: [ { deficiency_item_id: "${d2}", outcome: "PASS" } ] }, as: CustomerCareRep, as_user_id: "${r1}" }
            - { call: "POST /api/deficiency-items/${d2}/sign-off", payload: {}, as: Homebuyer, as_user_id: "${b1}" }
            - { call: "GET /api/acknowledgment-signatures?home_id=${h1}", payload: {}, as: CustomerCareManager, captures: { sg1: "$.data[0].id" } }
            - { call: "POST /api/acknowledgment-signatures/${sg1}/respond", payload: { decision: "SIGN", signature_payload: "sig:alice:1" }, as: Homebuyer, as_user_id: "${b1}" }
            - { call: "GET /api/escrow-holdbacks?home_id=${h1}", payload: {}, as: CustomerCareManager, captures: { esc1: "$.data[0].id", esc_prov_pre: "$.data[0].holdback_amount_cents", esc_status_pre: "$.data[0].status" } }
          trigger:
            - { call: "POST /api/homes/${h1}/close", payload: { funded_holdback_cents: 40000 }, as: CustomerCareManager }
            - { call: "GET /api/escrow-holdbacks/${esc1}", payload: {}, as: CustomerCareManager, captures: { esc_final: "$.data.final_holdback_cents", esc_prov_post: "$.data.holdback_amount_cents", esc_funded: "$.data.funded_amount_cents", esc_rem: "$.data.remaining_amount_cents" } }
            - { call: "GET /api/homes/${h1}", payload: {}, as: CustomerCareManager, captures: { home_status: "$.data.status" } }
          assert:
            - "EscrowHoldback.${esc1}.final_holdback_cents == 40000  # FINAL variant: SIGNED_OFF d2 excluded -> 2.0 * 20000"
            - "EscrowHoldback.${esc1}.holdback_amount_cents == 60000  # PROVISIONAL variant: same items, SIGNED_OFF included -> 2.0 * (20000 + 10000)"
            - "EscrowHoldback.${esc1}.funded_amount_cents == 40000"
            - "EscrowHoldback.${esc1}.remaining_amount_cents == 40000"
            - "Home.${h1}.status == CLOSED"
            - "provisional (${esc_prov_post}) != final (${esc_final}) for identical underlying item data"

      - name: quality_trend_response_vs_home_weighted
        grounds:
          - calculations.quality_trend_aggregation
          - calculations.survey_composite_score
          - endpoints: "GET /api/communities/{id}/quality-trend"
        distinguishing_aspect: |
          Analytics domain variant split (distinct from the escrow fiscal
          variants): the SAME three submitted surveys yield
          response_weighted_avg_score 3.67 (each survey equal) versus
          home_weighted_avg_score 3.75 (per-home mean first, then mean across
          homes), because home h1 contributed 2 surveys and home h2 only 1.
        test_recipe:
          setup:
            - "Default-policy community; one buyer; one rep"
            - "Home h1: orientation completed 2026-08-25, survey s1 submitted (5,5,5,true) -> composite 5.00"
            - "Home h1: second orientation completed 2026-08-26, survey s2 submitted (1,5,5,true) -> composite 2.00 (detractor cap)"
            - "Home h2: orientation completed 2026-08-27, survey s3 submitted (4,4,4,true) -> composite 4.00"
          setup_api_calls:
            - { call: "POST /api/communities", payload: { name: "Riverbend" }, as: CustomerCareManager, captures: { c1: "$.data.id" } }
            - { call: "POST /api/homebuyers", payload: { full_name: "Alice Avery", email: "alice@example.com" }, as: CustomerCareManager, captures: { b1: "$.data.id" } }
            - { call: "POST /api/reps", payload: { full_name: "Rita Rep", email: "rita@example.com" }, as: CustomerCareManager, captures: { r1: "$.data.id" } }
            - { call: "POST /api/homes", payload: { community_id: "${c1}", primary_buyer_id: "${b1}", lot_number: "L-101", address: "1 Riverbend Way", sales_price_cents: 45000000, closing_date: "2026-09-20T17:00:00Z" }, as: CustomerCareManager, captures: { h1: "$.data.id" } }
            - { call: "POST /api/homes", payload: { community_id: "${c1}", primary_buyer_id: "${b1}", lot_number: "L-102", address: "2 Riverbend Way", sales_price_cents: 46000000, closing_date: "2026-09-20T17:00:00Z" }, as: CustomerCareManager, captures: { h2: "$.data.id" } }
            - { call: "POST /api/homes/${h1}/mark-ready", payload: {}, as: CustomerCareManager }
            - { call: "POST /api/homes/${h2}/mark-ready", payload: {}, as: CustomerCareManager }
            # h1 orientation #1 (2026-08-25)
            - { call: "POST /api/appointments", payload: { home_id: "${h1}", rep_id: "${r1}", scheduled_start: "2026-08-25T14:00:00Z" }, as: CustomerCareRep, as_user_id: "${r1}", captures: { a1: "$.data.id" } }
            - { call: "POST /api/appointments/${a1}/confirm", payload: {}, as: CustomerCareManager }
            - { call: "POST /_clock/set_current_utc", payload: { to_iso8601: "2026-08-25T14:00:00Z" }, as: CustomerCareManager }
            - { call: "POST /api/appointments/${a1}/start", payload: {}, as: CustomerCareRep, as_user_id: "${r1}" }
            - { call: "POST /api/attendees", payload: { appointment_id: "${a1}", attendee_type: "BUYER", buyer_id: "${b1}" }, as: CustomerCareRep, as_user_id: "${r1}", captures: { at1: "$.data.id" } }
            - { call: "POST /api/attendees/${at1}/decide-verification", payload: { decision: "VERIFIED" }, as: CustomerCareManager }
            - { call: "POST /api/appointments/${a1}/checklist-items/HVAC/mark", payload: { outcome: "DEMONSTRATED" }, as: CustomerCareRep, as_user_id: "${r1}" }
            - { call: "POST /api/appointments/${a1}/checklist-items/PLUMBING/mark", payload: { outcome: "DEMONSTRATED" }, as: CustomerCareRep, as_user_id: "${r1}" }
            - { call: "POST /api/appointments/${a1}/checklist-items/ELECTRICAL/mark", payload: { outcome: "DEMONSTRATED" }, as: CustomerCareRep, as_user_id: "${r1}" }
            - { call: "POST /api/appointments/${a1}/checklist-items/EXTERIOR/mark", payload: { outcome: "DEMONSTRATED" }, as: CustomerCareRep, as_user_id: "${r1}" }
            - { call: "POST /api/appointments/${a1}/checklist-items/SAFETY/mark", payload: { outcome: "DEMONSTRATED" }, as: CustomerCareRep, as_user_id: "${r1}" }
            - { call: "POST /api/appointments/${a1}/checklist-items/APPLIANCES/mark", payload: { outcome: "SKIPPED" }, as: CustomerCareRep, as_user_id: "${r1}" }
            - { call: "POST /api/appointments/${a1}/complete", payload: {}, as: CustomerCareRep, as_user_id: "${r1}" }
            - { call: "GET /api/feedback-surveys?home_id=${h1}&status=ISSUED", payload: {}, as: CustomerCareManager, captures: { s1: "$.data[0].id" } }
            - { call: "POST /api/feedback-surveys/${s1}/submit", payload: { overall_rating: 5, systems_demo_rating: 5, timeliness_rating: 5, would_recommend: true }, as: Homebuyer, as_user_id: "${b1}" }
            # h1 orientation #2 (2026-08-26) — re-orientation from ORIENTED
            - { call: "POST /api/appointments", payload: { home_id: "${h1}", rep_id: "${r1}", scheduled_start: "2026-08-26T14:00:00Z" }, as: CustomerCareRep, as_user_id: "${r1}", captures: { a2: "$.data.id" } }
            - { call: "POST /api/appointments/${a2}/confirm", payload: {}, as: CustomerCareManager }
            - { call: "POST /_clock/set_current_utc", payload: { to_iso8601: "2026-08-26T14:00:00Z" }, as: CustomerCareManager }
            - { call: "POST /api/appointments/${a2}/start", payload: {}, as: CustomerCareRep, as_user_id: "${r1}" }
            - { call: "POST /api/attendees", payload: { appointment_id: "${a2}", attendee_type: "BUYER", buyer_id: "${b1}" }, as: CustomerCareRep, as_user_id: "${r1}", captures: { at2: "$.data.id" } }
            - { call: "POST /api/attendees/${at2}/decide-verification", payload: { decision: "VERIFIED" }, as: CustomerCareManager }
            - { call: "POST /api/appointments/${a2}/checklist-items/HVAC/mark", payload: { outcome: "DEMONSTRATED" }, as: CustomerCareRep, as_user_id: "${r1}" }
            - { call: "POST /api/appointments/${a2}/checklist-items/PLUMBING/mark", payload: { outcome: "DEMONSTRATED" }, as: CustomerCareRep, as_user_id: "${r1}" }
            - { call: "POST /api/appointments/${a2}/checklist-items/ELECTRICAL/mark", payload: { outcome: "DEMONSTRATED" }, as: CustomerCareRep, as_user_id: "${r1}" }
            - { call: "POST /api/appointments/${a2}/checklist-items/EXTERIOR/mark", payload: { outcome: "DEMONSTRATED" }, as: CustomerCareRep, as_user_id: "${r1}" }
            - { call: "POST /api/appointments/${a2}/checklist-items/SAFETY/mark", payload: { outcome: "DEMONSTRATED" }, as: CustomerCareRep, as_user_id: "${r1}" }
            - { call: "POST /api/appointments/${a2}/checklist-items/APPLIANCES/mark", payload: { outcome: "SKIPPED" }, as: CustomerCareRep, as_user_id: "${r1}" }
            - { call: "POST /api/appointments/${a2}/complete", payload: {}, as: CustomerCareRep, as_user_id: "${r1}" }
            - { call: "GET /api/feedback-surveys?home_id=${h1}&status=ISSUED", payload: {}, as: CustomerCareManager, captures: { s2: "$.data[0].id" } }
