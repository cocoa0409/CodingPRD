              captures: { e1_id: $.data.id }
            - call: "POST /employees"
              payload: { team_id: "${t2_id}", employee_number: "E-2001", work_email: "e2001@corp.example", home_timezone: "America/New_York", tenure_start_date: "2024-03-04", demographic_band: "BAND_B", manager_user_id: "mgr-2", hr_partner_user_id: "hrbp-1", disability_accommodation_on_file: false }
