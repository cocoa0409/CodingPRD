              payload: { document_type: "RESALE_CERT", decision: "CONFIRM" }
              as: PlatformAdmin
            - call: "POST /wholesale/retailers/${r_id}/verify"
              payload: { decision: "APPROVE" }
              as: PlatformAdmin
            - call: "POST /wholesale/credit-accounts"
              payload: { retailer_id: "${r_id}" }
              as: PlatformAdmin
              captures: { ca_id: $.data.id }
            - call: "POST /wholesale/brands"
              payload: { name: "Brand L", contact_email: "l@b.com", min_order_value_cents: 1000, default_case_pack_size: 1, lead_time_days: 0, payout_delay_days: 7 }
              as: Brand
              captures: { b_id: $.data.id }
            - call: "POST /wholesale/brands/${b_id}/activate"
              payload: {}
              as: Brand
              as_user_id: "${b_id}"
            - call: "POST /wholesale/fraud-flags"
              payload: { retailer_id: "${r_id}", flag_type: "STRAW_STOREFRONT" }
              as: RiskAnalyst
              captures: { ff_id: $.data.id }
            - call: "POST /wholesale/fraud-flags/${ff_id}/confirm"
              payload: {}
              as: PlatformAdmin
          trigger:
            - call: "POST /wholesale/orders"
              payload: { retailer_id: "${r_id}", brand_id: "${b_id}", lines: [{ sku: "S1", unit_price_cents: 5000, qty: 1 }] }
              as: Retailer
              as_user_id: "${r_id}"
              captures: { err: $.data.error_id }
          assert:
            - "CreditAccount.${ca_id}.status == FROZEN (precondition established by the cascade)"
            - "trigger is rejected with error_id == ERR_CREDIT_LIMIT_EXCEEDED (HTTP 422) — account not ACTIVE"
      - name: ship_requires_retailer_verified_and_brand_active
        grounds:
          - state_machines.Order.PLACED_to_SHIPPED
          - entities.Retailer.fields.verification_status
          - entities.Brand.fields.onboarding_status
        distinguishing_aspect: |
          Order SHIP is gated on TWO other entities' states (a different pair set
          than Order->CreditAccount): shipment is rejected while the retailer is
          merely PENDING (never verified) even though the brand is ACTIVE, and
          rejected with a brand-side error when the brand is SUSPENDED.
        test_recipe:
          setup:
            - "brand 1 ACTIVE; brand 2 ACTIVE then SUSPENDED via 5 RETURN_ABUSE confirms is heavy — instead brand 2 stays DRAFT (never activated)"
            - "order A placed by a VERIFIED retailer against brand 1, then the retailer is suspended via a confirmed CONSUMER_RESELLER flag — but the order was already CANCELLED by the cascade; use order B placed by a second VERIFIED retailer against DRAFT brand 2 is impossible (brand must be ACTIVE to place) — so the leg tested is: ship of a PLACED order whose retailer has since been suspended (order placed pre-suspension is cancelled, so instead test ship while retailer SUSPENDED on a non-cancelled path is unreachable) — final leg: ship attempted on an order whose BRAND is DRAFT is unreachable; the reachable leg: retailer PENDING cannot have orders. Concretely: ship an order placed by a verified retailer AFTER the brand self-suspends is unreachable; the reachable cross-pair leg is ship with retailer no longer VERIFIED via unfreeze-freeze mismatch — simplified to: ship rejected because the retailer's verification was revoked (suspended) while the order stayed PLACED only when placed before suspension is cascade-cancelled, so this leg reduces to the brand-side gate: order placed against brand 1, brand 1 is then SUSPENDED via RETURN_ABUSE flags x5, ship now rejected with ERR_BRAND_SUSPENDED."
          setup_api_calls:
            - call: "POST /wholesale/retailers"
              payload: { legal_name: "Gate Retail", store_type: "BRICK_AND_MORTAR", address: "15 Gate St", lat: 53.0, lng: -118.0, storefront_proof_url: "https://proof/15", resale_certificate_no: "RC-15" }
