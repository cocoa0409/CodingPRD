              as: DataEngineer
              as_user_id: "de-1"
              captures: { gc2: "$.data.id" }
            - call: "POST /mmm/markets"
              payload: { market_code: "EU_CORE", name: "US Core Brand Market", total_population: 8000000, annual_budget_ceiling_cents: 5000000000, currency_code: "USD" }
              as: DataEngineer
              as_user_id: "de-1"
              captures: { mkt2: "$.data.id" }
            - call: "POST /mmm/geo-cells"
              payload: { market_id: "${mkt2}", cell_code: "GC01", population: 100000 }
              as: DataEngineer
              as_user_id: "de-1"
              captures: { eu1: "$.data.id" }
            - call: "POST /mmm/experiments"
              payload: { market_id: "${mkt}", channel_id: "${cha}", design_type: "GEO_HOLDOUT", readout_method: "DIFF_IN_DIFF", start_date: "2026-09-07T00:00:00Z", end_date: "2026-10-05T00:00:00Z", washout_days: 7, minimum_detectable_effect_pct: 5.0, baseline_conversion_rate: 0.0200, planned_treatment_population: 245000, planned_control_population: 245000 }
              as: ExperimentDesigner
