              as: SchoolAdmin
              captures: { w: $.data.id, w_v1: $.data.version }
            - { call: "POST /conf/teachers", payload: { full_name: "T1", email: "t1@x.edu", grade_band: "ELEMENTARY", subjects: [], supports_in_person: true }, as: SchoolAdmin, captures: { t1: $.data.id } }
            - { call: "POST /conf/windows/${w}/publish", payload: {}, as: SchoolAdmin, captures: { w_v2: $.data.version } }
            - { call: "POST /conf/windows/${w}/generate-slots", payload: { expected_window_version: "${w_v2}" }, as: SchoolAdmin }
            - { call: "GET /conf/windows/${w}/slots", as: SchoolAdmin, captures: { s0: "$.data[0].id", s1: "$.data[1].id" } }
            - { call: "POST /conf/windows/${w}/open-booking", payload: {}, as: SchoolAdmin }
            - { call: "POST /conf/families", payload: { primary_guardian_name: "GA", email: "fa@x.com" }, as: FrontOfficeStaff, captures: { famA: $.data.id } }
            - { call: "POST /conf/families", payload: { primary_guardian_name: "GB", email: "fb@x.com" }, as: FrontOfficeStaff, captures: { famB: $.data.id } }
            - { call: "POST /conf/families/${famA}/students", payload: { full_name: "A1", grade_level: 1 }, as: FrontOfficeStaff, captures: { a1: $.data.id } }
            - { call: "POST /conf/families/${famA}/students", payload: { full_name: "A2", grade_level: 2 }, as: FrontOfficeStaff, captures: { a2: $.data.id } }
            - { call: "POST /conf/families/${famB}/students", payload: { full_name: "B1", grade_level: 3 }, as: FrontOfficeStaff, captures: { b1: $.data.id } }
            - { call: "POST /conf/students/${a1}/teacher-links", payload: { teacher_id: "${t1}", is_homeroom: true }, as: FrontOfficeStaff }
            - { call: "POST /conf/students/${a2}/teacher-links", payload: { teacher_id: "${t1}", is_homeroom: true }, as: FrontOfficeStaff }
            - { call: "POST /conf/students/${b1}/teacher-links", payload: { teacher_id: "${t1}", is_homeroom: true }, as: FrontOfficeStaff }
            - { call: "POST /conf/bookings", payload: { slot_id: "${s0}", student_id: "${a1}", channel: "IN_PERSON" }, as: FamilyGuardian, as_user_id: "${famA}", captures: { bkA1: $.data.id } }
            - { call: "POST /conf/bookings", payload: { slot_id: "${s1}", student_id: "${a2}", channel: "IN_PERSON" }, as: FamilyGuardian, as_user_id: "${famA}", captures: { bkA2: $.data.id } }
            - { call: "POST /conf/waitlist-entries", payload: { window_id: "${w}", student_id: "${b1}", teacher_id: "${t1}", channel_pref: "EITHER" }, as: FamilyGuardian, as_user_id: "${famB}", captures: { entry: $.data.id } }
          trigger:
            - { call: "POST /conf/bookings/${bkA1}/cancel", payload: { reason: "plans changed" }, as: FamilyGuardian, as_user_id: "${famA}" }
            - { call: "GET /conf/waitlist-entries/${entry}", as: FrontOfficeStaff, captures: { st1: $.data.status, cnt1: $.data.offers_made_count, slot1: $.data.offered_slot_id } }
            - { call: "POST /conf/waitlist-entries/${entry}/decline-offer", payload: {}, as: FamilyGuardian, as_user_id: "${famB}", captures: { st2: $.data.status } }
