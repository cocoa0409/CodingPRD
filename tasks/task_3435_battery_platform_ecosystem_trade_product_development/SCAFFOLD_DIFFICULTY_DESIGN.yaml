          - errors.ERR_NO_SERVICE_CAPACITY
        distinguishing_aspect: |
          Conserved quantity = the center's booked_count for (service_center_id,
          service_date): the forward action (claim creation, +1) paired with its
          compensating action (adjudication REJECTED, -1) returns the count to its
          original value — proven behaviorally when a previously-rejected identical
          claim is then accepted into the freed slot.
