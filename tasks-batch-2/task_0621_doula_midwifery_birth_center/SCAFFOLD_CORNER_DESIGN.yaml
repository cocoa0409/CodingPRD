      - name: missing_auth_headers_unauthenticated
        claim_type: peer_roles
        grounds: ['validations[priority=1]', 'errors[ERR_UNAUTHENTICATED]']
        distinguishing_aspect: "Request without X-User-Role/X-User-ID -> ERR_UNAUTHENTICATED (401)."
        test_recipe:
