  - method: POST
    path: /water-om/_clock/set_current_utc
    description: set the server's logical clock. The server starts at the fixed default 2026-09-01T00:00:00Z and never reads wall-clock time; every deadline, grace window and rate transition evaluates against
      this logical instant
    roles:
    - PlatformAdmin
    code: 200
    input:
    - to_iso8601
    output: ClockState
    side_effects:
    - the logical clock is set to the supplied instant
    - no business state is otherwise mutated
  - method: POST
    path: /water-om/pm-schedules/{id}/evaluate
    description: run the preventive maintenance due and overdue evaluation against the logical clock
    roles:
    - OperatorAdmin
    code: 200
    input: []
    output: PMSchedule
    side_effects:
    - ACTIVE -> DUE when now >= PMSchedule.next_due_at
    - DUE or ACTIVE -> OVERDUE when now > PMSchedule.next_due_at + 7 days and the linked preventive WorkOrder.status != CLOSED, incrementing missed_occurrence_count and advancing next_due_at by frequency_days
    - PMSchedule.compliance_rate_pct recomputed by the pm_compliance_rate calculation
    - the owning Asset transitions IN_SERVICE -> REPLACEMENT_FLAGGED when the recomputed missed_occurrence_count reaches exactly 3
  - method: POST
    path: /water-om/transition-obligations/{id}/evaluate
    description: run the hand-back obligation overdue and escalation evaluation against the logical clock
    roles:
    - MunicipalityAdmin
    code: 200
    input: []
    output: TransitionObligation
    side_effects:
    - PENDING or IN_PROGRESS -> OVERDUE when now >= TransitionObligation.due_at
    - TransitionObligation.outstanding_days computed by the transition_back_credit calculation
    - TransitionObligation.withholding_cents recomputed by the transition_back_credit calculation
    - OVERDUE -> ESCALATED when outstanding_days > 30, forcing the owning Contract back to UNDER_REVIEW when it is in HANDING_BACK
  - method: GET
    path: /water-om/contracts/{id}/pm-schedules
    description: list the preventive maintenance schedules under a contract
    roles:
    - PlatformAdmin
    - MunicipalityAdmin
    - OperatorAdmin
    code: 200
    input:
    - status?
    - asset_id?
    - limit?
    - offset?
    output: PMSchedule[]
    side_effects: []
  - method: GET
    path: /water-om/assets/{id}/emergency-events
    description: list the emergency events recorded against an asset
    roles:
    - PlatformAdmin
    - MunicipalityAdmin
    - OperatorAdmin
    code: 200
    input:
    - status?
    - event_type?
    - limit?
    - offset?
    output: EmergencyEvent[]
    side_effects: []
errors:
  - id: ERR_UNAUTHENTICATED
    http: 401
    condition: X-User-Role or X-User-ID header missing or empty
  - id: ERR_UNKNOWN_ROLE
    http: 401
    condition: X-User-Role is not one of the declared roles
  - id: ERR_ACTOR_NOT_FOUND
    http: 401
    condition: X-User-ID does not identify an instance of the entity the role is bound to
  - id: ERR_ROLE_FORBIDDEN
    http: 403
    condition: the acting role is not permitted for this operation
  - id: ERR_CROSS_TENANT_DENIED
    http: 403
    condition: the acting party is attempting the opposing party's step, or a record is being re-verified by its own creator
  - id: ERR_SELF_SERVICE_OWNER_MISMATCH
    http: 403
    condition: an Employee-role self-service call carries an X-User-ID that is not the employee's own id
  - id: ERR_MUNICIPALITY_NOT_FOUND
    http: 404
    condition: no Municipality matches the supplied id
  - id: ERR_CONTRACT_NOT_FOUND
    http: 404
    condition: no Contract matches the supplied id
  - id: ERR_PERMIT_NOT_FOUND
    http: 404
    condition: no Permit matches the supplied id
  - id: ERR_STANDARD_NOT_FOUND
    http: 404
    condition: no PerformanceStandard matches the supplied id
  - id: ERR_MEASUREMENT_NOT_FOUND
    http: 404
    condition: no PerformanceMeasurement matches the supplied id
  - id: ERR_ASSET_NOT_FOUND
    http: 404
    condition: no Asset matches the supplied id
  - id: ERR_ASSESSMENT_NOT_FOUND
    http: 404
    condition: no AssetConditionAssessment matches the supplied id
  - id: ERR_EMPLOYEE_NOT_FOUND
    http: 404
    condition: no Employee matches the supplied id
  - id: ERR_STAFFING_NOT_FOUND
    http: 404
    condition: no StaffingCommitment matches the supplied id
  - id: ERR_WORK_ORDER_NOT_FOUND
    http: 404
    condition: no WorkOrder matches the supplied id
  - id: ERR_PM_SCHEDULE_NOT_FOUND
    http: 404
    condition: no PMSchedule matches the supplied id
  - id: ERR_EMERGENCY_NOT_FOUND
    http: 404
    condition: no EmergencyEvent matches the supplied id
  - id: ERR_ALLOCATION_NOT_FOUND
    http: 404
    condition: no PenaltyAllocation matches the supplied id
  - id: ERR_PROPOSAL_NOT_FOUND
    http: 404
    condition: no RenewalProposal matches the supplied id
  - id: ERR_OBLIGATION_NOT_FOUND
    http: 404
    condition: no TransitionObligation matches the supplied id
  - id: ERR_CONTRACT_INVALID_STATE
    http: 409
    condition: the contract is not in the from-state required by this transition
  - id: ERR_ASSET_INVALID_STATE
    http: 409
    condition: the asset is not in the from-state required by this transition
  - id: ERR_WORK_ORDER_INVALID_STATE
    http: 409
    condition: the work order is not in the from-state required by this transition
  - id: ERR_PM_SCHEDULE_INVALID_STATE
    http: 409
    condition: the preventive maintenance schedule is not in the from-state required by this transition
  - id: ERR_EMERGENCY_INVALID_STATE
    http: 409
    condition: the emergency event is not in the from-state required by this transition
  - id: ERR_ALLOCATION_INVALID_STATE
    http: 409
    condition: the penalty allocation is not in a state that accepts an adjustment
  - id: ERR_ALREADY_TERMINAL
    http: 409
    condition: the target resource is already in a terminal state
  - id: ERR_BASELINE_FROZEN
    http: 409
    condition: the contract-start baseline is frozen and can no longer be amended or disputed
  - id: ERR_OPEN_BREACH_BLOCKS
    http: 409
    condition: a breaching performance standard blocks the contract from returning to operation
  - id: ERR_OPEN_WORK_ORDER_BLOCKS
    http: 409
    condition: an open work order blocks the asset from leaving service
  - id: ERR_CRITICAL_OBLIGATION_NOT_WAIVABLE
    http: 403
    condition: a critical transition-back obligation cannot be waived
  - id: ERR_INVALID_DATE_WINDOW
    http: 400
    condition: supplied instants violate their required ordering
  - id: ERR_NOTIFICATION_WINDOW_CLOSED
    http: 409
    condition: the emergency notification was filed at or after its computed deadline
  - id: ERR_CONTAINMENT_WINDOW_EXCEEDED
    http: 409
    condition: the containment instant precedes the event or exceeds the critical containment window
  - id: ERR_PM_WINDOW_EXPIRED
    http: 409
    condition: the preventive maintenance grace window has closed
  - id: ERR_REPORTAGE_PERIOD_OPEN
    http: 409
    condition: the municipality's five day reportage period has not elapsed
  - id: ERR_PM_WINDOW_TOO_FAR
    http: 409
    condition: the scheduled maintenance occupation extends beyond the 30 day scheduling horizon
  - id: ERR_OBLIGATION_DUE_BEFORE_HANDOFF
    http: 400
    condition: a transition-back obligation is due before the hand-back started
  - id: ERR_BACKDATED_RECORD_REJECTED
    http: 400
    condition: an ingested record is dated more than 7 days before the current logical clock
  - id: ERR_MEASUREMENT_PERIOD_OVERLAP
    http: 409
    condition: the measurement period overlaps an existing period on the same standard
  - id: ERR_PM_OCCUPATION_OVERLAP
    http: 409
    condition: the maintenance occupation overlaps an existing schedule or open preventive work order on the same asset
  - id: ERR_DUPLICATE_STANDARD_CODE
    http: 409
    condition: a performance standard with this code already exists on the contract
  - id: ERR_DUPLICATE_ASSET_TAG
    http: 409
    condition: an asset with this tag already exists on the contract
  - id: ERR_BASELINE_ALREADY_FROZEN
    http: 409
    condition: an accepted baseline already exists for the asset
  - id: ERR_DUPLICATE_ROUND_PROPOSAL
    http: 409
    condition: a proposal for this negotiation round already exists
  - id: ERR_DUPLICATE_ACTIVE_PERMIT_TYPE
    http: 409
    condition: a non-expired permit of this type already exists on the contract
  - id: ERR_THRESHOLD_DIRECTION_INVALID
    http: 400
    condition: the threshold direction is inconsistent with the metric type
  - id: ERR_RENEWAL_ROUND_MISMATCH
    http: 409
    condition: the proposal round number does not follow the contract's renewal round
  - id: ERR_CLOSED_WORK_ORDER_IMMUTABLE
    http: 409
    condition: a closed work order cannot be amended
  - id: ERR_EXPENSE_CLASS_UNRESOLVED
    http: 409
    condition: a work order whose expense class is unresolved cannot be closed
  - id: ERR_BENCHMARK_RATIO_EXCEEDED
    http: 422
    condition: the renewal proposal's benchmark ratio exceeds 1.25
  - id: ERR_BREACH_UNRESOLVED_AT_RENEWAL
    http: 409
    condition: a breaching standard remains on the contract when renewal is proposed
  - id: ERR_PENALTY_ALLOCATION_NOT_CONSERVED
    http: 422
    condition: operator and municipality shares do not sum to the regulator's total penalty
  - id: ERR_NEGATIVE_SETTLEMENT
    http: 422
    condition: the computed net settlement is negative
  - id: ERR_PENALTY_CAP_EXCEEDED
    http: 409
    condition: aggregate breach penalties would exceed the annual fee
  - id: ERR_CAPITAL_THRESHOLD_NOT_MET
    http: 422
    condition: a capital classification is offered before the asset has reached the required proportion of its useful life
  - id: ERR_ASSET_BASELINE_UNRESOLVED
    http: 409
    condition: an asset cannot be placed in service without exactly one frozen baseline assessment
  - id: ERR_CRITICAL_OBLIGATIONS_OUTSTANDING
    http: 409
    condition: critical transition-back obligations remain unsatisfied
  - id: ERR_PERMIT_ACTION_UNRESOLVED
    http: 409
    condition: an unresolved regulatory action blocks wind-down
  - id: ERR_ASSET_CONTRACT_MISMATCH
    http: 409
    condition: the supplied asset does not belong to the path's contract
  - id: ERR_CRITICAL_ACKNOWLEDGEMENT_MISSING
    http: 422
    condition: a critical emergency lacks the required operator acknowledgements
  - id: ERR_EMERGENCY_STAFFING_FLOOR
    http: 409
    condition: staffing would be reduced below the committed floor while an emergency is open
  - id: ERR_OVERFLOW_CONTAINMENT_REQUIRED
    http: 409
    condition: a sanitary overflow has no containment record
  - id: ERR_REPORTING_FREQUENCY_VIOLATION
    http: 422
    condition: the measurement interval is shorter than the permit's reporting frequency
  - id: ERR_CONTAMINATION_CONTAINMENT_REQUIRED
    http: 409
    condition: a contamination event has no containment instant before the notification is filed
  - id: ERR_WORK_ORDER_DOCUMENTATION_INCOMPLETE
    http: 409
    condition: a work order is completed with incomplete mandatory documentation
  - id: ERR_STALE_VERSION
    http: 412
    condition: the supplied expected contract version does not match the contract's current version
roles:
  - name: PlatformAdmin
    description: platform operator who provisions municipalities and administers the benchmark and the logical clock
    identity: opaque
    exclusive_operations:
    - POST /water-om/municipalities
    - POST /water-om/_clock/set_current_utc
    shared_operations:
    - GET /water-om/contracts/{id}
    - GET /water-om/contracts/{id}/performance-standards
    - GET /water-om/contracts/{id}/work-orders
    - GET /water-om/contracts/{id}/settlement
  - name: MunicipalityAdmin
    description: the municipal utility owner's contract manager who receives reports, verifies work, and controls hand-back
    identity: entity_backed:Municipality
    exclusive_operations:
    - POST /water-om/municipalities/{id}/contracts
    - POST /water-om/contracts/{id}/freeze-baseline
    - POST /water-om/contracts/{id}/hand-back
    - POST /water-om/contracts/{id}/complete-hand-back
    - POST /water-om/contracts/{id}/terminate
    - POST /water-om/permits/{id}/penalty-allocations
    shared_operations:
    - GET /water-om/contracts/{id}
    - GET /water-om/assets/{id}
    - POST /water-om/asset-assessments/{id}/dispute
    - POST /water-om/work-orders/{id}/verify
    - POST /water-om/renewal-proposals/{id}/counter
    - POST /water-om/emergency-events/{id}/escalate
  - name: OperatorAdmin
    description: the contracted operator's delivery manager who executes the maintenance programme and reports performance
    identity: entity_backed:Contract
    exclusive_operations:
    - POST /water-om/contracts/{id}/mobilize
    - POST /water-om/contracts/{id}/commence-operating
    - POST /water-om/work-orders/{id}/schedule
    - POST /water-om/work-orders/{id}/complete
    - POST /water-om/pm-schedules/{id}/regenerate
    - POST /water-om/emergency-events/{id}/dispatch
    - POST /water-om/emergency-events/{id}/contain
    shared_operations:
    - GET /water-om/contracts/{id}
    - GET /water-om/work-orders/{id}
    - POST /water-om/performance-standards/{id}/measurements
    - POST /water-om/transition-obligations/{id}/satisfy
  - name: Employee
    description: a municipal employee deciding whether to accept the operator's transfer offer
    identity: entity_backed:Employee
    exclusive_operations:
    - POST /water-om/employees/{id}/accept
    - POST /water-om/employees/{id}/decline
    shared_operations:
    - GET /water-om/employees/{id}

# SCAFFOLD END
