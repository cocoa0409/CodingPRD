      - name: dispute_window_is_governed_by_the_home_teams_district_only
        claim_type: input_set_filtering
        grounds:
          - calculations.dispute_window_deadline
          - calculations.dispute_window_deadline.input_set
          - entities.District.dispute_window_hours
          - validations[priority=49]
        distinguishing_aspect: |
          The home team sits in a 48-hour district and the away team in a 6-hour
          district. The deadline must be result_confirmed_at + 48 hours
          (2026-08-03T00:00:00.000Z), never +6 hours, and a dispute filed by the AWAY
          coach twelve hours after confirmation must succeed — even though twelve hours
          is outside the away side's own district window. An implementation that resolves
          the district from the filing team, or from whichever district it finds first,
          rejects that filing with ERR_DISPUTE_WINDOW_CLOSED.
