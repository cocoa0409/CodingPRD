            - call: "POST /reinsurers"
              payload: { name: "Echo Re", security_rating: "A", capacity_limit_minor: 5000000000, max_line_pct: 100.0000, lead_authorised: false }
              as: PlatformAdmin
              as_user_id: "admin-1"
              captures: { echo: $.data.id }
            - call: "POST /programs"
              payload: { cedent_id: "${ced_id}", program_name: "Paging Property CAT 2026", line_of_business: "PROPERTY", underwriting_year: 2026, inception_date: "2026-01-01T00:00:00.000Z", expiry_date: "2027-01-01T00:00:00.000Z", estimated_premium_income_minor: 2000000000, brokerage_pct: 2.5000 }
