          - entities.Account.fields.contact_status
          - state_machines.CommunicationAttempt
        distinguishing_aspect: |
          Whether a CommunicationAttempt may be logged depends on the parent Account's contact_status
          (CEASED rejects) — a CommunicationAttempt<-Account cross-entity dependency.
        test_recipe:
