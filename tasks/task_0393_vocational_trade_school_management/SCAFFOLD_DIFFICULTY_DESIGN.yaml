  # ===========================================================================
  - rule_id: compensating_invariant
    instances:
      - name: externship_place_then_terminate_conserves_site_count
        grounds:
          - state_machines.ExternshipAssignment.PLACED_to_TERMINATED
          - entities.ExternshipSite.fields.active_assignment_count
          - endpoints[POST /v1/externship-assignments]
        distinguishing_aspect: |
          Invariant on the conserved quantity ExternshipSite.active_assignment_count:
          placing an assignment (+1) then terminating it (-1) leaves
          active_assignment_count == its pre-place value (0), pinned as
          count_after == count_before.
        test_recipe:
          setup:
            - "Site capacity 3, active_assignment_count 0; agreement ENROLLED."
          setup_api_calls:
            - call: "POST /v1/programs"
              payload: { name: "Pharmacy", credential_type: "DIPLOMA", required_clock_hours: 1000, required_theory_hours: 600, required_externship_hours: 400, tuition_cents: 400000 }
              as: SystemAdmin
              captures: { prog_id: $.data.id }
            - call: "POST /v1/programs/${prog_id}/open"
              payload: {}
              as: SystemAdmin
            - call: "POST /v1/cohorts"
              payload: { program_id: "${prog_id}", code: "PH-A", start_term_index: 0, end_term_index: 10, seat_capacity: 5 }
              as: Registrar
              captures: { coh_id: $.data.id }
            - call: "POST /v1/cohorts/${coh_id}/start"
              payload: {}
              as: Registrar
            - call: "POST /v1/externship-sites"
