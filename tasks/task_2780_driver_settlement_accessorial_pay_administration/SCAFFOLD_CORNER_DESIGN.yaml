          difficulty_instance: transitive_cascade / mileage_uphold_depth4_settlement_hold_cascade
          rationale: "That instance walks all four hops of the resolve cascade end-to-end - Load rewrite, RetroCorrection insert, pending sum recompute, settlement_hold recompute - and asserts each hop's observable field, which is the whole cascading_side_effects layer for this trigger."
