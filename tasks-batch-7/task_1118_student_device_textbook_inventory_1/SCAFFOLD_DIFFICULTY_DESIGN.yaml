              payload: { asset_tag_barcode: "BC-X2", serial_number: "SN-X2", condition_grade: "C" }
              as: SiteTechnician
              captures: { asset_id: $.data.id, asset_v0: $.data.version }
            - call: "POST /api/programs/${prog_id}/activate"
              payload: {}
              as: DistrictAdmin
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-06-01T00:00:00Z" }
              as: DistrictAdmin
            - call: "GET /api/programs/${prog_id}/asset-units/${asset_id}"
              payload: {}
              as: DistrictAdmin
              captures: { asset_v: $.data.version }
            - call: "POST /api/programs/${prog_id}/asset-units/${asset_id}/retire"
              payload: { expected_asset_unit_version: "${asset_v}" }
              as: DistrictAdmin
          trigger:
            - call: "POST /api/programs/${prog_id}/asset-units/${asset_id}/write-off"
              payload: {}
              as: DistrictAdmin
              captures: { err_id: $.data.error_id }
          assert:
            - "HTTP status == 409"
            - "error_id == ERR_NOT_UNACCOUNTED (no CLOSED AuditSweep has flagged this unit)"

  # -----------------------------------------------------------------
  # Rule 8 — Resource temporal-overlap conflicts across DIFFERENT interval semantics
  # -----------------------------------------------------------------
  - rule_id: resource_temporal_overlap
    instances:
      - name: assignment_expected_return_overlap_same_student
        grounds:
          - state_machines.Assignment
          - validations[priority=7]
        distinguishing_aspect: |
          Semantics: open-ended [checked_out_at, expected_return_date]
          interval vs another open Assignment for the SAME student —
          rejection is based on overlap of OPEN assignment windows
          (student is the resource). A student may not hold two concurrent
          DEVICE-class assignments (textbook assignments are exempt).
          Interval arithmetic: closed interval on the checked_out side,
          open on the expected_return side; overlap rejected.
        test_recipe:
          setup:
            - "Program ACTIVE, fleet DEVICE with two AssetUnits A1 A2 (both READY, grade A)"
            - "Student S enrolled, agreement signed, no fees"
            - "Assignment AS1 created (A1 → DEPLOYED to S)"
            - "Attempt Assignment AS2 for same student S, different asset A2"
          setup_api_calls:
            - call: "POST /api/programs"
              payload: { program_name: "P", school_year: "2026-2027" }
              as: DistrictAdmin
              captures: { prog_id: $.data.id }
            - call: "POST /api/programs/${prog_id}/fleets"
              payload: { fleet_name: "F", asset_class: "DEVICE", unit_replacement_cost_cents: 100000, salvage_value_cents: 10000, useful_life_months: 36, in_service_date: "2025-09-01T00:00:00Z" }
              as: DistrictAdmin
              captures: { fleet_id: $.data.id }
            - call: "POST /api/programs/${prog_id}/fleets/${fleet_id}/asset-units"
              payload: { asset_tag_barcode: "BC-OV1", serial_number: "SN-OV1", condition_grade: "A" }
              as: SiteTechnician
              captures: { asset1_id: $.data.id }
            - call: "POST /api/programs/${prog_id}/fleets/${fleet_id}/asset-units"
              payload: { asset_tag_barcode: "BC-OV2", serial_number: "SN-OV2", condition_grade: "A" }
              as: SiteTechnician
              captures: { asset2_id: $.data.id }
            - call: "POST /api/programs/${prog_id}/activate"
              payload: {}
              as: DistrictAdmin
            - call: "POST /api/programs/${prog_id}/students"
              payload: { student_external_id: "SIS-OV", full_name: "Ov", grade_level: 9, free_lunch_eligible: false }
              as: Registrar
              captures: { student_id: $.data.id }
            - call: "POST /api/programs/${prog_id}/students/${student_id}/family-agreement/sign"
              payload: { acceptable_use_version: "AUP-2026.v3", signed_by_guardian_name: "G" }
              as: Family
              as_user_id: "${student_id}"
            - call: "GET /api/programs/${prog_id}/students/${student_id}"
              payload: {}
              as: Registrar
              captures: { student_v1: $.data.version }
            - call: "POST /api/programs/${prog_id}/students/${student_id}/assignments"
              payload: { asset_unit_id: "${asset1_id}", expected_return_date: "2027-06-01T00:00:00Z", expected_student_version: "${student_v1}" }
              as: Registrar
              captures: { as1_id: $.data.id }
            - call: "GET /api/programs/${prog_id}/students/${student_id}"
              payload: {}
              as: Registrar
              captures: { student_v2: $.data.version }
          trigger:
            - call: "POST /api/programs/${prog_id}/students/${student_id}/assignments"
              payload: { asset_unit_id: "${asset2_id}", expected_return_date: "2027-06-01T00:00:00Z", expected_student_version: "${student_v2}" }
              as: Registrar
              captures: { err_id: $.data.error_id }
          assert:
            - "HTTP status == 409"
            - "error_id == ERR_OPEN_ASSIGNMENTS (one open DEVICE assignment per student)"
            - "Second assignment rejected — student is the contested resource"

      - name: loaner_checkout_max_loaner_days_interval_cap
        grounds:
          - state_machines.LoanerCheckout.OPEN_to_OVERDUE
          - entities.LoanerCheckout.fields.max_loaner_days
        distinguishing_aspect: |
          Different interval semantics from instance 1: this is a DURATION
          CAP, not an overlap. A LoanerCheckout transitions OPEN → OVERDUE
          automatically when current_utc − checked_out_at > max_loaner_days
          (strict greater-than, not >=). The interval is a point-to-now
          duration measured against a configured cap. Reachable via the
          system-scan path (clock-set + read).
        test_recipe:
          setup:
            - "Program ACTIVE, 1 loaner asset in pool (sufficient to satisfy floor — use floor=0.0 to bypass the floor check)"
            - "Student S (agreement signed), no fees"
            - "LoanerCheckout L created with max_loaner_days=14 at clock T0=2026-05-01"
            - "Advance clock to T0+14 days (2026-05-15): exactly at cap, NOT > cap → still OPEN"
            - "Advance clock to T0+15 days (2026-05-16): > cap → OVERDUE"
          setup_api_calls:
            - call: "POST /api/programs"
              payload: { program_name: "P", school_year: "2026-2027", loaner_pool_threshold_pct: 0.0 }
              as: DistrictAdmin
              captures: { prog_id: $.data.id }
            - call: "POST /api/programs/${prog_id}/fleets"
              payload: { fleet_name: "F", asset_class: "DEVICE", unit_replacement_cost_cents: 100000, salvage_value_cents: 10000, useful_life_months: 36, in_service_date: "2025-09-01T00:00:00Z" }
              as: DistrictAdmin
              captures: { fleet_id: $.data.id }
            - call: "POST /api/programs/${prog_id}/fleets/${fleet_id}/asset-units"
              payload: { asset_tag_barcode: "BC-LC", serial_number: "SN-LC", condition_grade: "A" }
              as: SiteTechnician
              captures: { asset_id: $.data.id }
            - call: "POST /api/programs/${prog_id}/activate"
              payload: {}
              as: DistrictAdmin
            - call: "POST /api/programs/${prog_id}/asset-units/${asset_id}/designate-loaner"
              payload: {}
              as: SiteTechnician
            - call: "POST /api/programs/${prog_id}/students"
              payload: { student_external_id: "SIS-LC", full_name: "Lc", grade_level: 9, free_lunch_eligible: false }
              as: Registrar
              captures: { student_id: $.data.id }
            - call: "POST /api/programs/${prog_id}/students/${student_id}/family-agreement/sign"
              payload: { acceptable_use_version: "AUP-2026.v3", signed_by_guardian_name: "G" }
              as: Family
              as_user_id: "${student_id}"
            - call: "POST /api/programs/${prog_id}/students/${student_id}/loaner-checkouts"
              payload: { checkout_reason: "REPAIR", loaner_asset_unit_id: "${asset_id}", max_loaner_days: 14 }
              as: SiteTechnician
              captures: { checkout_id: $.data.id }
          trigger:
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-05-15T00:00:00Z" }
              as: DistrictAdmin
            - call: "GET /api/programs/${prog_id}/students/${student_id}/loaner-checkouts/${checkout_id}"
              payload: {}
              as: DistrictAdmin
              captures: { status_at_14: $.data.status }
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-05-16T00:00:00Z" }
              as: DistrictAdmin
            - call: "GET /api/programs/${prog_id}/students/${student_id}/loaner-checkouts/${checkout_id}"
              payload: {}
              as: DistrictAdmin
              captures: { status_at_15: $.data.status }
          assert:
            - "LoanerCheckout.${checkout_id}.status at T0+14 days == OPEN (cap boundary: exactly 14 days is NOT yet OVERDUE because trigger is strict >)"
            - "LoanerCheckout.${checkout_id}.status at T0+15 days == OVERDUE"

  # -----------------------------------------------------------------
  # Rule 9 — Compensating-action invariants across DIFFERENT conserved quantities
  # -----------------------------------------------------------------
  - rule_id: compensating_invariant
    instances:
      - name: assignment_return_conserves_fleet_unit_count
        grounds:
          - state_machines.AssetUnit.READY_to_DEPLOYED
          - state_machines.AssetUnit.SUMMER_INTAKE_to_READY
          - state_machines.Assignment.ACTIVE_to_RETURNED
        distinguishing_aspect: |
          Conserved quantity: total AssetUnit count in the fleet across the
          full assignment lifecycle. Checkout (READY → DEPLOYED) followed by
          return (DEPLOYED → READY or SUMMER_INTAKE → RE_IMAGING → READY)
          MUST leave count(AssetUnits in fleet) unchanged AND leave
          count(AssetUnits by lifecycle_status) balanced: DEPLOYED +1 then
          -1, READY -1 then +1. No net drift across the pair of actions.
        test_recipe:
          setup:
            - "Program ACTIVE, fleet F (DEVICE), asset A (grade A, READY)"
            - "Initial: count by status = { READY: 1, DEPLOYED: 0, IN_REPAIR: 0, ... }"
            - "Student S (agreement signed, no fees)"
          setup_api_calls:
            - call: "POST /api/programs"
              payload: { program_name: "P", school_year: "2026-2027" }
              as: DistrictAdmin
              captures: { prog_id: $.data.id }
            - call: "POST /api/programs/${prog_id}/fleets"
              payload: { fleet_name: "F", asset_class: "DEVICE", unit_replacement_cost_cents: 100000, salvage_value_cents: 10000, useful_life_months: 36, in_service_date: "2025-09-01T00:00:00Z" }
              as: DistrictAdmin
              captures: { fleet_id: $.data.id }
            - call: "POST /api/programs/${prog_id}/fleets/${fleet_id}/asset-units"
              payload: { asset_tag_barcode: "BC-INV", serial_number: "SN-INV", condition_grade: "A" }
              as: SiteTechnician
              captures: { asset_id: $.data.id }
            - call: "POST /api/programs/${prog_id}/activate"
              payload: {}
              as: DistrictAdmin
            - call: "POST /api/programs/${prog_id}/students"
              payload: { student_external_id: "SIS-INV", full_name: "Inv", grade_level: 9, free_lunch_eligible: false }
              as: Registrar
              captures: { student_id: $.data.id }
            - call: "POST /api/programs/${prog_id}/students/${student_id}/family-agreement/sign"
              payload: { acceptable_use_version: "AUP-2026.v3", signed_by_guardian_name: "G" }
              as: Family
              as_user_id: "${student_id}"
            - call: "GET /api/programs/${prog_id}/fleets/${fleet_id}/asset-units"
              payload: {}
              as: DistrictAdmin
            - call: "GET /api/programs/${prog_id}/students/${student_id}"
              payload: {}
              as: Registrar
              captures: { student_v: $.data.version }
          trigger:
            - call: "POST /api/programs/${prog_id}/students/${student_id}/assignments"
              payload: { asset_unit_id: "${asset_id}", expected_return_date: "2027-06-01T00:00:00Z", expected_student_version: "${student_v}" }
              as: Registrar
              captures: { as_id: $.data.id }
            - call: "GET /api/programs/${prog_id}/asset-units/${asset_id}"
              payload: {}
              as: DistrictAdmin
              captures: { status_during: $.data.lifecycle_status }
            - call: "POST /api/programs/${prog_id}/students/${student_id}/assignments/${as_id}/return"
              payload: { return_condition_grade: "A" }
              as: SiteTechnician
            - call: "GET /api/programs/${prog_id}/asset-units/${asset_id}"
              payload: {}
              as: DistrictAdmin
              captures: { status_after: $.data.lifecycle_status }
            - call: "GET /api/programs/${prog_id}/fleets/${fleet_id}/asset-units"
              payload: {}
              as: DistrictAdmin
          assert:
            - "AssetUnit.${asset_id}.lifecycle_status after checkout == DEPLOYED"
            - "AssetUnit.${asset_id}.lifecycle_status after return == READY"
            - "list length of GET /api/programs/${prog_id}/fleets/${fleet_id}/asset-units is the same before checkout and after return (no drift — creation and return are exactly compensating)"

      - name: settle_then_appeal_grant_conserves_total_collected_plus_outstanding
        grounds:
          - state_machines.FeeAssessment.ASSESSED_to_SETTLED
          - state_machines.FeeAssessment.APPEALED_to_WAIVED
          - calculations.financial_posture_derivation
        distinguishing_aspect: |
          Conserved quantity: for every FeeAssessment, amount_cents ==
          paid_cents + waived_cents + (residual outstanding) at every
          observable point. The invariant: no transition creates or
          destroys cents — settle fills paid_cents; appeal-grant fills
          waived_cents; write-off zeroes residual. Across multiple
          transitions the sum paid + waived + outstanding_residual ==
          amount_cents exactly.
        test_recipe:
          setup:
            - "Program ACTIVE, fleet+asset ready, student S (agreement signed, free_lunch_eligible=true)"
            - "Assignment AS; late return 4 days (4*100=400); waiver rate 50% on late_return (different rate than damage waiver) — actual fee = round(400 * 0.5) = 200 cents. Wait — the late_return_fee calculation applies waiver at calculation time, so amount_cents stored is 200 (post-waiver). waived_cents is 0. paid_cents is 0."
            - "Actually the FeeAssessment.amount_cents is computed by late_return_fee which already applies the 50% waiver internally; the stored waived_cents field is 0 (no separate waiver). To exercise the invariant across settle + appeal-grant we need a fee that is NOT pre-waivered — use a DAMAGE fee on a non-free-lunch student."
            - "Redo setup: student free_lunch_eligible=FALSE; assignment; damage report damage_category=COSMETIC, observed_grade=A → provisional = 100000 * 0.10 * 1.00 = 10000; confirm → final = 10000 (no insurance, no waiver); FeeAssessment created amount=10000, waived=0, paid=0, outstanding_residual=10000"
          setup_api_calls:
            - call: "POST /api/programs"
              payload: { program_name: "P", school_year: "2026-2027" }
              as: DistrictAdmin
              captures: { prog_id: $.data.id }
            - call: "POST /api/programs/${prog_id}/fleets"
              payload: { fleet_name: "F", asset_class: "DEVICE", unit_replacement_cost_cents: 100000, salvage_value_cents: 10000, useful_life_months: 36, in_service_date: "2025-09-01T00:00:00Z" }
              as: DistrictAdmin
              captures: { fleet_id: $.data.id }
            - call: "POST /api/programs/${prog_id}/fleets/${fleet_id}/asset-units"
              payload: { asset_tag_barcode: "BC-CONS", serial_number: "SN-CONS", condition_grade: "A" }
              as: SiteTechnician
              captures: { asset_id: $.data.id }
            - call: "POST /api/programs/${prog_id}/activate"
              payload: {}
              as: DistrictAdmin
            - call: "POST /api/programs/${prog_id}/students"
              payload: { student_external_id: "SIS-CONS", full_name: "Cons", grade_level: 9, free_lunch_eligible: false }
              as: Registrar
              captures: { student_id: $.data.id }
            - call: "POST /api/programs/${prog_id}/students/${student_id}/family-agreement/sign"
              payload: { acceptable_use_version: "AUP-2026.v3", signed_by_guardian_name: "G" }
              as: Family
              as_user_id: "${student_id}"
            - call: "GET /api/programs/${prog_id}/students/${student_id}"
              payload: {}
              as: Registrar
              captures: { student_v: $.data.version }
            - call: "POST /api/programs/${prog_id}/students/${student_id}/assignments"
              payload: { asset_unit_id: "${asset_id}", expected_return_date: "2027-06-01T00:00:00Z", expected_student_version: "${student_v}" }
              as: Registrar
              captures: { as_id: $.data.id }
            - call: "POST /api/programs/${prog_id}/students/${student_id}/assignments/${as_id}/damage-reports"
              payload: { damage_category: "COSMETIC", observed_condition_grade: "A" }
              as: Family
              as_user_id: "${student_id}"
              captures: { dr_id: $.data.id }
            - call: "POST /api/programs/${prog_id}/students/${student_id}/assignments/${as_id}/damage-reports/${dr_id}/submit"
              payload: {}
              as: Family
              as_user_id: "${student_id}"
            - call: "POST /api/programs/${prog_id}/students/${student_id}/assignments/${as_id}/damage-reports/${dr_id}/confirm"
              payload: {}
              as: SiteTechnician
            - call: "GET /api/programs/${prog_id}/students/${student_id}/fees"
              payload: {}
              as: DistrictAdmin
              captures: { fee_id: "$.data[0].id" }
          trigger:
            - call: "POST /api/programs/${prog_id}/students/${student_id}/fees/${fee_id}/settle"
              payload: { payment_cents: 6000 }
              as: DistrictAdmin
              captures: { paid_after_settle: $.data.paid_cents, status_after_settle: $.data.status }
            - call: "POST /api/programs/${prog_id}/students/${student_id}/fees/${fee_id}/appeal"
              payload: {}
              as: Family
              as_user_id: "${student_id}"
            - call: "POST /api/programs/${prog_id}/students/${student_id}/fees/${fee_id}/appeal-grant"
              payload: {}
              as: DistrictAdmin
              captures: { waived_after_grant: $.data.waived_cents, status_final: $.data.status }
          assert:
            - "After settle of 6000: paid_cents == 6000, waived_cents == 0, status == ASSESSED (not fully paid)"
            - "After appeal-grant: waived_cents == amount_cents - paid_cents == 10000 - 6000 == 4000"
            - "Final status == WAIVED"
            - "Invariant holds: paid_cents (6000) + waived_cents (4000) + residual (0) == amount_cents (10000)"
