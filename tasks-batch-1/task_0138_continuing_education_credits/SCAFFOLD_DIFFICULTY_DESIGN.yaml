  # ===========================================================================
  # Rule 9 — Compensating-action invariants across different conserved quantities
  # ===========================================================================
  - rule_id: compensating_invariant
    instances:
      - name: reciprocity_approve_then_revoke_conserves_reciprocity_hours
        grounds:
          - state_machines.ReciprocityGrant.REQUESTED_to_APPROVED
          - state_machines.ReciprocityGrant.APPROVED_to_DENIED
          - entities.RenewalCycle.fields.reciprocity_hours
          - entities.RenewalCycle.fields.final_earned_hours
        distinguishing_aspect: |
          Conserved quantity = cycle.reciprocity_hours (and final_earned_hours): approve adds 2.0 then
          revoke subtracts exactly 2.0, leaving reciprocity_hours == 0.0 and final_earned_hours back to
          its pre-approve value (28.0). No drift.
        test_recipe:
          setup:
            - "Board CA. ETHICS 4.0 + SUBSTANCE 2.0 + GENERAL 22.0 VERIFIED (final 28.0). A GENERAL reciprocity grant of 2.0h from NY exists and is approved then revoked."
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-01-01T00:00:00Z" }
              as: BoardAdmin
            - call: "POST /license-boards"
              payload: { name: "CA Board", jurisdiction_code: "CA", credit_unit: "CLE", cycle_length_months: 24, total_required_hours: 30.0, carryover_cap_hours: 10.0, reminder_lead_days: 60, audit_cooldown_days: 365 }
              as: BoardAdmin
              captures: { board_id: $.data.id }
            - call: "POST /license-boards/${board_id}/requirements"
              payload: { category: "ETHICS", min_hours: 4.0 }
              as: BoardAdmin
            - call: "POST /license-boards/${board_id}/requirements"
              payload: { category: "SUBSTANCE", min_hours: 2.0 }
              as: BoardAdmin
            - call: "POST /providers"
              payload: { name: "Provider P", board_id: "${board_id}" }
              as: BoardAdmin
              captures: { provider_id: $.data.id }
            - call: "POST /providers/${provider_id}/accredit"
              payload: { accredited_until: "2030-01-01T00:00:00Z" }
              as: BoardAdmin
            - call: "POST /courses"
              payload: { provider_id: "${provider_id}", title: "E4", category: "ETHICS", credit_hours: 4.0 }
              as: BoardAdmin
              captures: { course_e_id: $.data.id }
            - call: "POST /courses"
              payload: { provider_id: "${provider_id}", title: "S2", category: "SUBSTANCE", credit_hours: 2.0 }
              as: BoardAdmin
              captures: { course_s_id: $.data.id }
            - call: "POST /courses"
              payload: { provider_id: "${provider_id}", title: "G22", category: "GENERAL", credit_hours: 22.0 }
              as: BoardAdmin
              captures: { course_g_id: $.data.id }
            - call: "POST /licensees"
              payload: { full_name: "L Seventeen", home_board_id: "${board_id}", license_number: "L-017" }
              as: BoardAdmin
              captures: { lic_id: $.data.id }
            - call: "POST /renewal-cycles"
              payload: { licensee_id: "${lic_id}", board_id: "${board_id}", cycle_start: "2026-01-01T00:00:00Z" }
              as: BoardAdmin
              captures: { cycle_id: $.data.id }
            - call: "POST /completions"
              payload: { licensee_id: "${lic_id}", course_id: "${course_e_id}", cycle_id: "${cycle_id}", completed_at: "2026-02-01T00:00:00Z" }
              as: Licensee
              as_user_id: "${lic_id}"
              captures: { comp_e_id: $.data.id }
            - call: "POST /completions/${comp_e_id}/verify"
              payload: {}
              as: BoardAdmin
            - call: "POST /completions"
              payload: { licensee_id: "${lic_id}", course_id: "${course_s_id}", cycle_id: "${cycle_id}", completed_at: "2026-02-01T00:00:00Z" }
              as: Licensee
              as_user_id: "${lic_id}"
              captures: { comp_s_id: $.data.id }
            - call: "POST /completions/${comp_s_id}/verify"
              payload: {}
              as: BoardAdmin
            - call: "POST /completions"
              payload: { licensee_id: "${lic_id}", course_id: "${course_g_id}", cycle_id: "${cycle_id}", completed_at: "2026-02-01T00:00:00Z" }
              as: Licensee
              as_user_id: "${lic_id}"
              captures: { comp_g_id: $.data.id }
            - call: "POST /completions/${comp_g_id}/verify"
              payload: {}
              as: BoardAdmin
            - call: "POST /reciprocity-grants"
              payload: { licensee_id: "${lic_id}", target_cycle_id: "${cycle_id}", source_jurisdiction_code: "NY", category: "GENERAL", credit_hours: 2.0 }
              as: Licensee
              as_user_id: "${lic_id}"
              captures: { grant_id: $.data.id }
            - call: "POST /reciprocity-grants/${grant_id}/approve"
              payload: {}
              as: BoardAdmin
          trigger:
            - call: "POST /reciprocity-grants/${grant_id}/revoke"
              payload: {}
              as: BoardAdmin
            - call: "GET /renewal-cycles/${cycle_id}"
              payload: {}
              as: BoardAdmin
              captures: { recip: $.data.reciprocity_hours, fin: $.data.final_earned_hours, st: $.data.status }
          assert:
            - "RenewalCycle.${cycle_id}.reciprocity_hours == 0.0 (approve +2.0 then revoke -2.0; conserved)"
            - "RenewalCycle.${cycle_id}.final_earned_hours == 28.0 (back to pre-approve value)"
            - "RenewalCycle.${cycle_id}.status == OPEN (reverted from REQUIREMENTS_MET)"

      - name: completion_reject_resubmit_conserves_provisional_hours
        grounds:
          - state_machines.Completion.PENDING_VERIFICATION_to_REJECTED
          - state_machines.Completion.REJECTED_to_PENDING_VERIFICATION
          - entities.RenewalCycle.fields.provisional_earned_hours
        distinguishing_aspect: |
          A different conserved quantity (cycle.provisional_earned_hours, not reciprocity_hours):
          rejecting a completion subtracts its 4.0h from provisional, resubmitting re-adds exactly 4.0h,
          leaving provisional_earned_hours back at its pre-reject value (4.0). No drift.
        test_recipe:
          setup:
            - "Board CA, Provider P accredited, ETHICS course E=4.0h. One ETHICS completion PENDING (provisional 4.0)."
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-01-01T00:00:00Z" }
              as: BoardAdmin
            - call: "POST /license-boards"
              payload: { name: "CA Board", jurisdiction_code: "CA", credit_unit: "CLE", cycle_length_months: 24, total_required_hours: 30.0, carryover_cap_hours: 10.0, reminder_lead_days: 60, audit_cooldown_days: 365 }
              as: BoardAdmin
              captures: { board_id: $.data.id }
            - call: "POST /providers"
              payload: { name: "Provider P", board_id: "${board_id}" }
              as: BoardAdmin
              captures: { provider_id: $.data.id }
            - call: "POST /providers/${provider_id}/accredit"
              payload: { accredited_until: "2030-01-01T00:00:00Z" }
              as: BoardAdmin
            - call: "POST /courses"
              payload: { provider_id: "${provider_id}", title: "E4", category: "ETHICS", credit_hours: 4.0 }
              as: BoardAdmin
              captures: { course_e_id: $.data.id }
            - call: "POST /licensees"
              payload: { full_name: "L Eighteen", home_board_id: "${board_id}", license_number: "L-018" }
              as: BoardAdmin
              captures: { lic_id: $.data.id }
            - call: "POST /renewal-cycles"
              payload: { licensee_id: "${lic_id}", board_id: "${board_id}", cycle_start: "2026-01-01T00:00:00Z" }
              as: BoardAdmin
              captures: { cycle_id: $.data.id }
            - call: "POST /completions"
              payload: { licensee_id: "${lic_id}", course_id: "${course_e_id}", cycle_id: "${cycle_id}", completed_at: "2026-02-01T00:00:00Z" }
              as: Licensee
              as_user_id: "${lic_id}"
              captures: { comp_e_id: $.data.id }
            - call: "POST /completions/${comp_e_id}/reject"
              payload: { reason: "needs correction" }
              as: BoardAdmin
          trigger:
            - call: "POST /completions/${comp_e_id}/resubmit"
              payload: {}
              as: Licensee
              as_user_id: "${lic_id}"
            - call: "GET /renewal-cycles/${cycle_id}"
              payload: {}
              as: BoardAdmin
              captures: { prov: $.data.provisional_earned_hours }
          assert:
            - "RenewalCycle.${cycle_id}.provisional_earned_hours == 4.0 (reject -4.0 then resubmit +4.0; conserved)"
            - "Completion.${comp_e_id}.status == PENDING_VERIFICATION"
