# =============================================================================
# §1.8 Scaffold Difficulty Design (Test Targeting Index)
# Task 2137 — Spare Parts Planning & Aftermarket Support
# 9 rule_ids / 24 instances. Every literal below was executed against the
# §1.3 formulas and their constants before being written down.
# =============================================================================
scaffold_difficulty_design:

  # ==========================================================================
  - rule_id: dual_variant_calc
    instances:

      - name: pricing_list_vs_quote_rounding_divergence_on_part_line
        grounds:
          - calculations.aftermarket_price_uplift
          - entities.WorkOrderPartLine.fields.list_line_total_cents
          - entities.WorkOrderPartLine.fields.quoted_line_total_cents
          - entities.WorkOrderPartLine.fields.variant_delta_cents
        distinguishing_aspect: |
          The dual variant here lives on the MONEY domain of a WorkOrderPartLine: LIST rounds
          the per-unit price first and multiplies, QUOTE multiplies the extended cost and
          rounds once, and for unit_cost 1333 / uplift 0.35 / qty 7 the two orders produce
          12600 and 12597 — a 3-cent divergence on the same row.
        test_recipe:
          setup:
            - "one ACTIVE DESIRABLE price rule with base_uplift_pct 0.35, max_uplift_pct 0.60, min_margin_pct 0.20"
            - "a GOLD dealer with credit_limit_cents 100000000 and outstanding_balance_cents 0 (credit_hold false)"
            - "one equipment model with one ACTIVE installed unit at build_revision 100 owned by that dealer"
            - "part HP-1333 with unit_cost_cents 1333, lead_time_days 60, weight_kg 12.5, hazmat false, lifecycle_state ACTIVE, criticality_class DESIRABLE"
            - "an ACTIVE applicability row covering build revisions 0..unbounded with qty_per_unit 5"
            - "100 units received into stock, so Part.on_hand_units == 100 and Part.available_units == 100"
            - "an OPEN work order with downtime_priority DEGRADED on that installed unit"
          setup_api_calls:
            - call: "POST /aftermarket/price-rules"
              payload: { criticality_class: "DESIRABLE", base_uplift_pct: 0.35, max_uplift_pct: 0.60, min_margin_pct: 0.20 }
              as: PricingAnalyst
              as_user_id: "pricing-1"
            - call: "POST /aftermarket/dealers"
              payload: { dealer_code: "D-GOLD-1", tier: "GOLD", region: "NA", credit_limit_cents: 100000000 }
              as: PlatformAdmin
              as_user_id: "admin-1"
              captures: { d_id: $.data.id }
            - call: "POST /aftermarket/equipment-models"
              payload: { model_code: "EM-100", name: "Excavator 100", production_end_date: "2025-01-01T00:00:00Z", support_end_date: "2035-01-01T00:00:00Z" }
              as: PlatformAdmin
              as_user_id: "admin-1"
              captures: { m_id: $.data.id }
            - call: "POST /aftermarket/installed-units"
              payload: { model_id: "${m_id}", dealer_id: "${d_id}", serial_number: "SN-0001", build_revision: 100, commission_date: "2025-06-01T00:00:00Z", region: "NA" }
              as: PlatformAdmin
              as_user_id: "admin-1"
              captures: { u_id: $.data.id }
            - call: "POST /aftermarket/parts"
              payload: { part_number: "HP-1333", description: "Hydraulic pump", unit_cost_cents: 1333, lead_time_days: 60, weight_kg: 12.5, hazmat: false, max_stock_units: 30 }
              as: AftermarketPlanner
              as_user_id: "planner-1"
              captures: { p_id: $.data.id }
            - call: "POST /aftermarket/part-applicabilities"
              payload: { part_id: "${p_id}", model_id: "${m_id}", effective_from_build_revision: 0, qty_per_unit: 5 }
              as: AftermarketPlanner
              as_user_id: "planner-1"
            - call: "POST /aftermarket/replenishment-orders"
              payload: { part_id: "${p_id}", order_type: "STOCK", qty: 100 }
              as: InventoryController
              as_user_id: "ctrl-1"
              captures: { ro_id: $.data.id }
            - call: "POST /aftermarket/replenishment-orders/${ro_id}/approve"
              payload: {}
              as: InventoryController
              as_user_id: "ctrl-1"
            - call: "POST /aftermarket/replenishment-orders/${ro_id}/ship"
              payload: {}
              as: InventoryController
              as_user_id: "ctrl-1"
            - call: "POST /aftermarket/replenishment-orders/${ro_id}/receive"
              payload: {}
              as: InventoryController
              as_user_id: "ctrl-1"
            - call: "POST /aftermarket/work-orders"
              payload: { installed_unit_id: "${u_id}", work_type: "BREAKDOWN", downtime_priority: "DEGRADED" }
              as: DealerUser
              as_user_id: "${d_id}"
              captures: { wo_id: $.data.id }
          trigger:
            - call: "POST /aftermarket/work-orders/${wo_id}/part-lines"
              payload: { part_id: "${p_id}", qty_requested: 7 }
              as: DealerUser
              as_user_id: "${d_id}"
              captures: { line_id: $.data.id }
          assert:
            - "WorkOrderPartLine.${line_id}.effective_uplift_pct == 0.35"
            - "WorkOrderPartLine.${line_id}.list_unit_price_cents == 1800"
            - "WorkOrderPartLine.${line_id}.list_line_total_cents == 12600"
            - "WorkOrderPartLine.${line_id}.quoted_line_total_cents == 12597"
            - "WorkOrderPartLine.${line_id}.variant_delta_cents == 3"
            - "WorkOrderPartLine.${line_id}.margin_pct == 0.2593"
            - "WorkOrderPartLine.${line_id}.fulfillment_mode == STOCK"
            - "WorkOrderPartLine.${line_id}.line_status == RESERVED"
            - "Part.${p_id}.allocated_units == 7 and Part.${p_id}.available_units == 93"

      - name: ltb_decay_vs_flat_quantity_divergence_on_campaign
        grounds:
          - calculations.ltb_lifetime_buy_quantity
          - entities.LastTimeBuyCampaign.fields.proposed_qty
          - entities.LastTimeBuyCampaign.fields.method
          - state_machines.LastTimeBuyCampaign.DRAFT_to_CANCELLED
        distinguishing_aspect: |
          This dual variant lives on a different entity domain — the QUANTITY of a
          LastTimeBuyCampaign, not line pricing: with annual_demand_units 10, coverage_years 5
          and 20 units already on the shelf, DEMAND_DECAY proposes 17 units while FLAT_RATE
          proposes 30 from byte-identical inputs.
        test_recipe:
          setup:
            - "a dealer, an equipment model and exactly one ACTIVE installed unit at build_revision 100"
            - "part LTB-A with unit_cost_cents 1333, lead_time_days 60, weight_kg 12.5"
            - "an ACTIVE applicability row covering build revisions 0..unbounded with qty_per_unit 50, so installed_base_units == 1 and ib_rate_units == 10.00"
            - "20 units received into stock, so Part.on_hand_units == 20 and Part.in_transit_units == 0"
            - "a CURRENT 12-month DemandForecast computed by INSTALLED_BASE_RATE with forecast_units == 10"
            - "the part moved to PHASE_OUT"
          setup_api_calls:
            - call: "POST /aftermarket/dealers"
              payload: { dealer_code: "D-GOLD-2", tier: "GOLD", region: "EU", credit_limit_cents: 100000000 }
              as: PlatformAdmin
              as_user_id: "admin-1"
              captures: { d_id: $.data.id }
            - call: "POST /aftermarket/equipment-models"
              payload: { model_code: "EM-200", name: "Loader 200", production_end_date: "2025-01-01T00:00:00Z", support_end_date: "2035-01-01T00:00:00Z" }
              as: PlatformAdmin
              as_user_id: "admin-1"
              captures: { m_id: $.data.id }
            - call: "POST /aftermarket/installed-units"
              payload: { model_id: "${m_id}", dealer_id: "${d_id}", serial_number: "SN-2001", build_revision: 100, commission_date: "2025-06-01T00:00:00Z", region: "EU" }
              as: PlatformAdmin
              as_user_id: "admin-1"
            - call: "POST /aftermarket/parts"
              payload: { part_number: "LTB-A", description: "Final drive seal", unit_cost_cents: 1333, lead_time_days: 60, weight_kg: 12.5, max_stock_units: 30 }
              as: AftermarketPlanner
              as_user_id: "planner-1"
              captures: { p_id: $.data.id }
            - call: "POST /aftermarket/part-applicabilities"
              payload: { part_id: "${p_id}", model_id: "${m_id}", effective_from_build_revision: 0, qty_per_unit: 50 }
              as: AftermarketPlanner
              as_user_id: "planner-1"
            - call: "POST /aftermarket/replenishment-orders"
              payload: { part_id: "${p_id}", order_type: "STOCK", qty: 20 }
              as: InventoryController
              as_user_id: "ctrl-1"
              captures: { ro_id: $.data.id }
            - call: "POST /aftermarket/replenishment-orders/${ro_id}/approve"
              payload: {}
              as: InventoryController
              as_user_id: "ctrl-1"
            - call: "POST /aftermarket/replenishment-orders/${ro_id}/ship"
              payload: {}
              as: InventoryController
              as_user_id: "ctrl-1"
            - call: "POST /aftermarket/replenishment-orders/${ro_id}/receive"
              payload: {}
              as: InventoryController
              as_user_id: "ctrl-1"
            - call: "POST /aftermarket/parts/${p_id}/forecasts"
              payload: { horizon_months: 12, method: "INSTALLED_BASE_RATE" }
              as: AftermarketPlanner
              as_user_id: "planner-1"
              captures: { f_id: $.data.id, f_units: $.data.forecast_units }
            - call: "POST /aftermarket/parts/${p_id}/phase-out"
              payload: {}
              as: AftermarketPlanner
              as_user_id: "planner-1"
            - call: "GET /aftermarket/parts/${p_id}"
              payload: {}
              as: AftermarketPlanner
              as_user_id: "planner-1"
              captures: { p_v1: $.data.version }
          trigger:
            - call: "POST /aftermarket/last-time-buy-campaigns"
              payload: { part_id: "${p_id}", method: "DEMAND_DECAY", coverage_years: 5, ltb_window_start: "2026-09-01T00:00:00Z", ltb_window_end: "2026-10-01T00:00:00Z", expected_part_version: "${p_v1}" }
              as: AftermarketPlanner
              as_user_id: "planner-1"
              captures: { c1_id: $.data.id }
            - call: "GET /aftermarket/parts/${p_id}"
              payload: {}
              as: AftermarketPlanner
              as_user_id: "planner-1"
              captures: { p_v2: $.data.version }
            - call: "POST /aftermarket/last-time-buy-campaigns"
              payload: { part_id: "${p_id}", method: "FLAT_RATE", coverage_years: 5, ltb_window_start: "2026-09-01T00:00:00Z", ltb_window_end: "2026-10-01T00:00:00Z", expected_part_version: "${p_v2}" }
              as: AftermarketPlanner
              as_user_id: "planner-1"
              captures: { c2_id: $.data.id }
          assert:
            - "DemandForecast.${f_id}.installed_base_units == 1"
            - "DemandForecast.${f_id}.ib_rate_units == 10.00"
            - "DemandForecast.${f_id}.forecast_units == 10"
            - "LastTimeBuyCampaign.${c1_id}.annual_demand_units == 10"
            - "LastTimeBuyCampaign.${c1_id}.proposed_qty == 17"
            - "LastTimeBuyCampaign.${c2_id}.annual_demand_units == 10"
            - "LastTimeBuyCampaign.${c2_id}.proposed_qty == 30"
            - "LastTimeBuyCampaign.${c1_id}.status == CANCELLED"
            - "LastTimeBuyCampaign.${c2_id}.status == DRAFT"

  # ==========================================================================
  - rule_id: combinatorial_formula
    instances:

      - name: air_freight_four_input_nonlinear_branch_selection
        grounds:
          - calculations.emergency_air_freight_decision
          - entities.WorkOrderPartLine.fields.decision_net_benefit_cents
          - entities.WorkOrderPartLine.fields.freight_cost_cents
          - state_machines.WorkOrderPartLine.REQUESTED_to_BACKORDERED
        distinguishing_aspect: |
          MODE (a) — a formula with four inputs (Part.available_units, the work order's
          downtime_priority, Part.weight_kg x qty, Dealer.tier) interacting non-linearly
          through a ceil, a max against a minimum charge, and a four-way ordered branch:
          ceil(12.5*2)=25 kg gives max(45000, 25*2000+10000)=60000 and 250000*45-60000
          = 11190000, which clears the branch-4 threshold and expedites.
        test_recipe:
          setup:
            - "one ACTIVE DESIRABLE price rule with base_uplift_pct 0.35, max_uplift_pct 0.60, min_margin_pct 0.20"
            - "a GOLD dealer (so the PLATINUM override branch cannot fire) with credit_hold false"
            - "part AIR-1 with unit_cost_cents 1333, lead_time_days 45, weight_kg 12.5, hazmat false and zero stock"
            - "an OPEN work order with downtime_priority MACHINE_DOWN on an ACTIVE installed unit covered by an ACTIVE applicability row"
          setup_api_calls:
            - call: "POST /aftermarket/price-rules"
              payload: { criticality_class: "DESIRABLE", base_uplift_pct: 0.35, max_uplift_pct: 0.60, min_margin_pct: 0.20 }
              as: PricingAnalyst
              as_user_id: "pricing-1"
            - call: "POST /aftermarket/dealers"
              payload: { dealer_code: "D-GOLD-3", tier: "GOLD", region: "NA", credit_limit_cents: 100000000 }
              as: PlatformAdmin
              as_user_id: "admin-1"
              captures: { d_id: $.data.id }
            - call: "POST /aftermarket/equipment-models"
              payload: { model_code: "EM-300", name: "Dozer 300", production_end_date: "2025-01-01T00:00:00Z", support_end_date: "2035-01-01T00:00:00Z" }
              as: PlatformAdmin
              as_user_id: "admin-1"
              captures: { m_id: $.data.id }
            - call: "POST /aftermarket/installed-units"
              payload: { model_id: "${m_id}", dealer_id: "${d_id}", serial_number: "SN-3001", build_revision: 100, commission_date: "2025-06-01T00:00:00Z", region: "NA" }
              as: PlatformAdmin
              as_user_id: "admin-1"
              captures: { u_id: $.data.id }
            - call: "POST /aftermarket/parts"
              payload: { part_number: "AIR-1", description: "Turbo cartridge", unit_cost_cents: 1333, lead_time_days: 45, weight_kg: 12.5, hazmat: false }
              as: AftermarketPlanner
              as_user_id: "planner-1"
              captures: { p_id: $.data.id }
            - call: "POST /aftermarket/part-applicabilities"
              payload: { part_id: "${p_id}", model_id: "${m_id}", effective_from_build_revision: 0, qty_per_unit: 1 }
              as: AftermarketPlanner
              as_user_id: "planner-1"
            - call: "POST /aftermarket/work-orders"
              payload: { installed_unit_id: "${u_id}", work_type: "BREAKDOWN", downtime_priority: "MACHINE_DOWN" }
              as: DealerUser
              as_user_id: "${d_id}"
              captures: { wo_id: $.data.id }
          trigger:
            - call: "POST /aftermarket/work-orders/${wo_id}/part-lines"
              payload: { part_id: "${p_id}", qty_requested: 2 }
              as: DealerUser
              as_user_id: "${d_id}"
              captures: { line_id: $.data.id }
            - call: "GET /aftermarket/replenishment-orders"
              payload: { part_id: "${p_id}", auto_generated: true }
              as: InventoryController
              as_user_id: "ctrl-1"
              captures: { auto_ro_id: "$.data[0].id" }
          assert:
            - "WorkOrderPartLine.${line_id}.decision_net_benefit_cents == 11190000"
            - "WorkOrderPartLine.${line_id}.freight_cost_cents == 60000"
            - "WorkOrderPartLine.${line_id}.fulfillment_mode == AIR_FREIGHT"
            - "WorkOrderPartLine.${line_id}.line_status == BACKORDERED"
            - "WorkOrderPartLine.${line_id}.quoted_line_total_cents == 3599 and list_line_total_cents == 3600"
            - "ServiceWorkOrder.${wo_id}.status == PARTS_PENDING"
            - "GET /aftermarket/replenishment-orders?part_id=${p_id}&auto_generated=true returns total_count == 1"
            - "ReplenishmentOrder.${auto_ro_id}.order_type == EMERGENCY_AIR"
            - "ReplenishmentOrder.${auto_ro_id}.qty == 2"
            - "ReplenishmentOrder.${auto_ro_id}.freight_cost_cents == 60000"
            - "ReplenishmentOrder.${auto_ro_id}.approval_status == PENDING and logistics_status == NOT_STARTED"
            - "Part.${p_id}.allocated_units == 0 and Part.${p_id}.available_units == 0"

      - name: price_quote_rounding_order_diverges_across_quantities
        grounds:
          - calculations.aftermarket_price_uplift
          - endpoints["GET /aftermarket/parts/{id}/price-quote"]
        distinguishing_aspect: |
          MODE (b) — nested rounding whose ORDER changes the cents. The scaffold pins
          round-per-unit-then-multiply for LIST and multiply-then-round-once for QUOTE, so
          the same part at unit_cost 1333 / uplift 0.35 yields variant_delta_cents of 0 at
          qty 1, 1 at qty 3 and 3 at qty 7 — a divergence that only exists because of the
          rounding order, not the inputs.
        test_recipe:
          setup:
            - "one ACTIVE DESIRABLE price rule with base_uplift_pct 0.35, max_uplift_pct 0.60, min_margin_pct 0.20"
            - "part RND-1 with unit_cost_cents 1333 in lifecycle_state ACTIVE and criticality_class DESIRABLE"
          setup_api_calls:
            - call: "POST /aftermarket/price-rules"
              payload: { criticality_class: "DESIRABLE", base_uplift_pct: 0.35, max_uplift_pct: 0.60, min_margin_pct: 0.20 }
              as: PricingAnalyst
              as_user_id: "pricing-1"
            - call: "POST /aftermarket/parts"
              payload: { part_number: "RND-1", description: "Rounding probe part", unit_cost_cents: 1333, lead_time_days: 30, weight_kg: 1.0 }
              as: AftermarketPlanner
              as_user_id: "planner-1"
              captures: { p_id: $.data.id }
          trigger:
            - call: "GET /aftermarket/parts/${p_id}/price-quote"
              payload: { qty: 1 }
              as: PricingAnalyst
              as_user_id: "pricing-1"
            - call: "GET /aftermarket/parts/${p_id}/price-quote"
              payload: { qty: 3 }
              as: PricingAnalyst
              as_user_id: "pricing-1"
            - call: "GET /aftermarket/parts/${p_id}/price-quote"
              payload: { qty: 7 }
              as: PricingAnalyst
              as_user_id: "pricing-1"
          assert:
            - "qty 1 response: list_unit_price_cents == 1800, list_line_total_cents == 1800, quoted_line_total_cents == 1800, variant_delta_cents == 0, margin_pct == 0.2594"
            - "qty 3 response: list_line_total_cents == 5400, quoted_line_total_cents == 5399, variant_delta_cents == 1, margin_pct == 0.2593"
            - "qty 7 response: list_line_total_cents == 12600, quoted_line_total_cents == 12597, variant_delta_cents == 3, margin_pct == 0.2593"
            - "effective_uplift_pct == 0.35 in all three responses"
            - "Part.${p_id}.current_list_unit_price_cents == 1800 (the qty-1 LIST value)"

      - name: restocking_rebate_tier_pinned_to_pre_rebate_net
        grounds:
          - calculations.return_restocking_fee_and_credit
          - entities.ReturnAuthorization.fields.rebate_pct
          - entities.ReturnAuthorization.fields.net_before_rebate_cents
          - entities.ReturnAuthorization.fields.final_credit_cents
        distinguishing_aspect: |
          MODE (c) — a circular-looking dependency with a PINNED evaluation order. The rebate
          tier is keyed on net_before_rebate_cents 497999 (tier 0.02), even though the
          resulting final_credit_cents 507959 sits above REBATE_TIER_HIGH_CENTS 500000; a
          reader who keyed the tier on the final credit would compute 24900 instead of 9960.
        test_recipe:
          setup:
            - "one ACTIVE DESIRABLE price rule with base_uplift_pct 0.35, max_uplift_pct 0.60, min_margin_pct 0.20"
            - "a GOLD dealer with credit_limit_cents 100000000"
            - "part CIRC-1 with unit_cost_cents 46111 and 8 units in stock"
            - "a work order line for qty 8 fitted at the default clock 2026-08-01T00:00:00Z, charged_amount_cents 497999"
            - "the logical clock advanced to 2026-08-06T00:00:00Z, so age_days == 5"
          setup_api_calls:
            - call: "POST /aftermarket/price-rules"
              payload: { criticality_class: "DESIRABLE", base_uplift_pct: 0.35, max_uplift_pct: 0.60, min_margin_pct: 0.20 }
              as: PricingAnalyst
              as_user_id: "pricing-1"
            - call: "POST /aftermarket/dealers"
              payload: { dealer_code: "D-GOLD-4", tier: "GOLD", region: "NA", credit_limit_cents: 100000000 }
              as: PlatformAdmin
              as_user_id: "admin-1"
              captures: { d_id: $.data.id }
            - call: "POST /aftermarket/equipment-models"
              payload: { model_code: "EM-400", name: "Grader 400", production_end_date: "2025-01-01T00:00:00Z", support_end_date: "2035-01-01T00:00:00Z" }
              as: PlatformAdmin
              as_user_id: "admin-1"
              captures: { m_id: $.data.id }
            - call: "POST /aftermarket/installed-units"
              payload: { model_id: "${m_id}", dealer_id: "${d_id}", serial_number: "SN-4001", build_revision: 100, commission_date: "2025-06-01T00:00:00Z", region: "NA" }
              as: PlatformAdmin
              as_user_id: "admin-1"
              captures: { u_id: $.data.id }
            - call: "POST /aftermarket/parts"
              payload: { part_number: "CIRC-1", description: "Swing gearbox", unit_cost_cents: 46111, lead_time_days: 60, weight_kg: 1.0 }
              as: AftermarketPlanner
              as_user_id: "planner-1"
              captures: { p_id: $.data.id }
            - call: "POST /aftermarket/part-applicabilities"
              payload: { part_id: "${p_id}", model_id: "${m_id}", effective_from_build_revision: 0, qty_per_unit: 1 }
              as: AftermarketPlanner
              as_user_id: "planner-1"
            - call: "POST /aftermarket/replenishment-orders"
              payload: { part_id: "${p_id}", order_type: "STOCK", qty: 8 }
              as: InventoryController
              as_user_id: "ctrl-1"
              captures: { ro_id: $.data.id }
            - call: "POST /aftermarket/replenishment-orders/${ro_id}/approve"
              payload: {}
              as: InventoryController
              as_user_id: "ctrl-1"
            - call: "POST /aftermarket/replenishment-orders/${ro_id}/ship"
              payload: {}
              as: InventoryController
              as_user_id: "ctrl-1"
            - call: "POST /aftermarket/replenishment-orders/${ro_id}/receive"
              payload: {}
              as: InventoryController
              as_user_id: "ctrl-1"
            - call: "POST /aftermarket/work-orders"
              payload: { installed_unit_id: "${u_id}", work_type: "SCHEDULED_MAINTENANCE", downtime_priority: "PLANNED" }
              as: DealerUser
              as_user_id: "${d_id}"
              captures: { wo_id: $.data.id }
            - call: "POST /aftermarket/work-orders/${wo_id}/part-lines"
              payload: { part_id: "${p_id}", qty_requested: 8 }
              as: DealerUser
              as_user_id: "${d_id}"
              captures: { line_id: $.data.id }
            - call: "POST /aftermarket/work-order-part-lines/${line_id}/consume"
              payload: { qty_consumed: 8 }
              as: DealerUser
              as_user_id: "${d_id}"
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-08-06T00:00:00Z" }
              as: PlatformAdmin
              as_user_id: "admin-1"
          trigger:
            - call: "POST /aftermarket/return-authorizations"
              payload: { work_order_part_line_id: "${line_id}", qty_returned: 8, return_reason: "DEFECTIVE" }
              as: DealerUser
              as_user_id: "${d_id}"
              captures: { rma_id: $.data.id }
          assert:
            - "WorkOrderPartLine.${line_id}.charged_amount_cents == 497999"
            - "ReturnAuthorization.${rma_id}.age_days == 5"
            - "ReturnAuthorization.${rma_id}.gross_credit_cents == 497999"
            - "ReturnAuthorization.${rma_id}.fee_pct == 0.0000"
            - "ReturnAuthorization.${rma_id}.restocking_fee_cents == 0"
