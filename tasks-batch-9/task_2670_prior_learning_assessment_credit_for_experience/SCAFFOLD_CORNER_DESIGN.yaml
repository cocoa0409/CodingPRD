        grounds:
          - validations[priority 26].ERR_RESIDENCY_REQUIREMENT_VIOLATION
          - validations[priority 39].ERR_PLA_CAP_EXCEEDED
          - calculations.program_pla_credit_capacity
          - endpoints[PATCH /students/{student_id}]
          - endpoints[POST /pla-claims/{claim_id}/transcript-posting]
        distinguishing_aspect: |
          Transfer credits are raised from 0 to 88 AFTER the 6-credit award, so at
