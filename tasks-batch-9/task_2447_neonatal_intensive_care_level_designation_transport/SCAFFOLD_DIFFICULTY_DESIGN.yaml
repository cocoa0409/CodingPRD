# =============================================================================
# §1.8 Scaffold Difficulty Design (Test Targeting Index) — task_2447
# Nine §0.5 rule_ids, 25 instances. Every literal in an `assert:` line was
# computed by executing the §1.3 formula it belongs to.
# =============================================================================
scaffold_difficulty_design:

  - rule_id: dual_variant_calc
    instances:

      - name: referral_current_support_vs_anticipated_need_level
        grounds:
          - calculations.referral_required_level
          - calculations.triage_priority
          - entities.Referral.fields.current_support_level
          - entities.Referral.fields.anticipated_need_level
          - entities.Referral.fields.level_basis
          - entities.Referral.fields.maternal_transfer_preferred
        distinguishing_aspect: |
          The dual variant lives on Referral (clinical level-of-care assignment):
          the same maternal case is LEVEL_I under the current-support variant and
          LEVEL_III under the anticipated-need variant, a two-level divergence,
          while a postnatal case with identical weight-band data has both
          variants agree at LEVEL_III.
        test_recipe:
          setup:
            - "The logical clock is at 2026-08-01T00:00:00Z."
            - "Network standards for LEVEL_I, LEVEL_II and LEVEL_III are declared."
            - "Regional NICU A is designated LEVEL_III with 4 staffed beds, transport capable, annual volume 400, and holds valid NEO_BOARD (1.0 FTE) and RN_NICU_CORE (3.0 FTE) credentials plus in-service CONVENTIONAL_VENT and HFOV assets, so its effective_level is LEVEL_III."
            - "Community Hospital B is a COMMUNITY unit designated LEVEL_I with 6 staffed beds and a follow-up clinic capacity of 1."
          setup_api_calls:
            - &k_clock
              call: "POST /_clock/set_current_utc"
              payload: { current_utc: "2026-08-01T00:00:00Z" }
              as: NetworkAdmin
              as_user_id: "net-1"
            - &k_std1
              call: "POST /designation-standards"
              payload: { level: "LEVEL_I", required_credential_codes: [], required_equipment_codes: [], nurse_patient_ratio_denominator: 4.0, min_annual_volume: 100, transport_capability_required: false, min_compliance_score: 85.00, conditional_floor_score: 70.00 }
              as: NetworkAdmin
              as_user_id: "net-1"
            - &k_std2
              call: "POST /designation-standards"
              payload: { level: "LEVEL_II", required_credential_codes: ["RN_NICU_CORE"], required_equipment_codes: ["CONVENTIONAL_VENT"], nurse_patient_ratio_denominator: 3.0, min_annual_volume: 300, transport_capability_required: false, min_compliance_score: 85.00, conditional_floor_score: 70.00 }
              as: NetworkAdmin
              as_user_id: "net-1"
            - &k_std3
              call: "POST /designation-standards"
              payload: { level: "LEVEL_III", required_credential_codes: ["NEO_BOARD", "RN_NICU_CORE"], required_equipment_codes: ["CONVENTIONAL_VENT", "HFOV"], nurse_patient_ratio_denominator: 2.0, min_annual_volume: 500, transport_capability_required: false, min_compliance_score: 85.00, conditional_floor_score: 70.00 }
              as: NetworkAdmin
              as_user_id: "net-1"
            - &k_unit_a
              call: "POST /nicu-units"
              payload: { name: "Regional NICU A", hospital_type: "REGIONAL_CENTER", staffed_bed_target: 4, designated_level: "LEVEL_III", transport_capable: true, annual_admission_volume: 400, followup_clinic_daily_capacity: 2 }
              as: NetworkAdmin
              as_user_id: "net-1"
              captures: { unit_a: $.data.id }
            - &k_unit_b
              call: "POST /nicu-units"
              payload: { name: "Community Hospital B", hospital_type: "COMMUNITY", staffed_bed_target: 6, designated_level: "LEVEL_I", transport_capable: false, annual_admission_volume: 300, followup_clinic_daily_capacity: 1 }
              as: NetworkAdmin
              as_user_id: "net-1"
              captures: { unit_b: $.data.id }
            - &k_cred_neo
              call: "POST /staff-credentials"
              payload: { unit_id: "${unit_a}", credential_code: "NEO_BOARD", holder_reference: "neo-1", fte: 1.0, expires_on: "2027-01-01T00:00:00Z" }
              as: UnitDirector
              as_user_id: "${unit_a}:dir-1"
            - &k_cred_rn
              call: "POST /staff-credentials"
              payload: { unit_id: "${unit_a}", credential_code: "RN_NICU_CORE", holder_reference: "rn-pool", fte: 3.0, expires_on: "2027-01-01T00:00:00Z" }
              as: UnitDirector
              as_user_id: "${unit_a}:dir-1"
              captures: { cred_rn_a: $.data.id }
            - &k_vent
              call: "POST /equipment-assets"
              payload: { unit_id: "${unit_a}", equipment_code: "CONVENTIONAL_VENT", asset_tag: "VENT-1", last_service_at: "2026-07-01T00:00:00Z", service_interval_days: 365 }
              as: UnitDirector
              as_user_id: "${unit_a}:dir-1"
              captures: { vent_a: $.data.id }
            - &k_hfov
              call: "POST /equipment-assets"
              payload: { unit_id: "${unit_a}", equipment_code: "HFOV", asset_tag: "HFOV-1", last_service_at: "2026-07-01T00:00:00Z", service_interval_days: 365 }
              as: UnitDirector
              as_user_id: "${unit_a}:dir-1"
              captures: { hfov_a: $.data.id }
          trigger:
            - call: "POST /referrals"
              payload: { referring_unit_id: "${unit_b}", receiving_unit_id: "${unit_a}", referral_kind: "MATERNAL_ANTENATAL", case_reference: "CASE-M1", gestational_age_weeks: 30.0, birth_weight_grams: 1300, support_modality: "ROOM_AIR" }
              as: ReferringClinician
              as_user_id: "${unit_b}:ref-1"
              captures: { ref_m: $.data.id }
            - call: "POST /referrals"
              payload: { referring_unit_id: "${unit_b}", receiving_unit_id: "${unit_a}", referral_kind: "INBOUND_NEONATAL", case_reference: "CASE-N1", gestational_age_weeks: 29.0, birth_weight_grams: 1200, support_modality: "ROOM_AIR" }
              as: ReferringClinician
              as_user_id: "${unit_b}:ref-1"
              captures: { ref_n: $.data.id }
          assert:
            - "Referral.${ref_m}.current_support_level == LEVEL_I"
            - "Referral.${ref_m}.anticipated_need_level == LEVEL_III"
            - "Referral.${ref_m}.level_basis == ANTICIPATED_NEED"
            - "Referral.${ref_m}.required_level == LEVEL_III"
            - "Referral.${ref_m}.maternal_transfer_preferred == true"
            - "Referral.${ref_m}.triage_priority == 78.75"
            - "Referral.${ref_n}.current_support_level == LEVEL_III"
            - "Referral.${ref_n}.anticipated_need_level == LEVEL_III"
            - "Referral.${ref_n}.level_basis == CURRENT_SUPPORT"
            - "Referral.${ref_n}.triage_priority == 71.25"
            - "Referral.${ref_m}.current_support_level != Referral.${ref_n}.current_support_level while both required_level values are LEVEL_III — the estimated fetal weight is counted only by the anticipated variant"

      - name: clabsi_crude_versus_device_adjusted_rate
        grounds:
          - calculations.clabsi_surveillance_rates
          - entities.SurveillanceReport.fields.crude_clabsi_rate
          - entities.SurveillanceReport.fields.device_adjusted_clabsi_rate
          - entities.SurveillanceReport.fields.variant_applied
          - entities.SurveillanceReport.fields.birth_weight_risk_weight
        distinguishing_aspect: |
          The second dual variant sits on a different entity domain
          (SurveillanceReport infection epidemiology, not Referral clinical
          acuity): the identical infection count yields 2.00 per 1000
          patient-days crude and 9.58 per 1000 line-days device-adjusted, and
          the scaffold pins DEVICE_ADJUSTED as the applied variant.
          Verified: 1 * 1.15 * 1000 / 120 = 9.58 and 1 * 1000 / 500 = 2.00.
        test_recipe:
          setup:
            - "Prelude as in referral_current_support_vs_anticipated_need_level."
            - "Two admissions created on 2026-08-01 at Regional NICU A: birth weights 900 g and 2000 g."
            - "The 900 g infant has one central-line care-update and its infection dimension has been driven SURVEILLANCE_CLEAR -> SUSPECTED -> CONFIRMED_CLABSI."
          setup_api_calls:
            - *k_clock
            - *k_std1
            - *k_std2
            - *k_std3
            - *k_unit_a
            - *k_unit_b
            - *k_cred_neo
            - *k_cred_rn
            - *k_vent
            - *k_hfov
            - call: "POST /referrals"
              payload: { referring_unit_id: "${unit_b}", receiving_unit_id: "${unit_a}", referral_kind: "INBOUND_NEONATAL", case_reference: "CASE-S1", gestational_age_weeks: 29.0, birth_weight_grams: 900, support_modality: "ROOM_AIR" }
              as: ReferringClinician
              as_user_id: "${unit_b}:ref-1"
              captures: { ref_s1: $.data.id }
            - call: "GET /nicu-units/${unit_a}"
              payload: {}
              as: IntakeNeonatologist
              as_user_id: "${unit_a}:intake-1"
              captures: { v_s1: $.data.version }
            - call: "POST /referrals/${ref_s1}/accept"
              payload: { expected_unit_version: "${v_s1}" }
              as: IntakeNeonatologist
              as_user_id: "${unit_a}:intake-1"
            - call: "POST /admissions"
              payload: { referral_id: "${ref_s1}" }
              as: IntakeNeonatologist
              as_user_id: "${unit_a}:intake-1"
              captures: { adm_s1: $.data.id }
            - call: "POST /admissions/${adm_s1}/care-updates"
              payload: { current_weight_grams: 950, support_modality: "CPAP", central_line_present: true, ventilated: false }
              as: BedsideNurse
              as_user_id: "nurse-1"
            - call: "POST /admissions/${adm_s1}/infection-events"
              payload: { event: "SUSPECT" }
              as: BedsideNurse
              as_user_id: "nurse-1"
            - call: "POST /admissions/${adm_s1}/infection-events"
              payload: { event: "CONFIRM_CLABSI" }
              as: BedsideNurse
              as_user_id: "nurse-1"
            - call: "POST /referrals"
              payload: { referring_unit_id: "${unit_b}", receiving_unit_id: "${unit_a}", referral_kind: "INBOUND_NEONATAL", case_reference: "CASE-S2", gestational_age_weeks: 34.0, birth_weight_grams: 2000, support_modality: "ROOM_AIR" }
              as: ReferringClinician
              as_user_id: "${unit_b}:ref-1"
              captures: { ref_s2: $.data.id }
            - call: "GET /nicu-units/${unit_a}"
              payload: {}
              as: IntakeNeonatologist
              as_user_id: "${unit_a}:intake-1"
              captures: { v_s2: $.data.version }
            - call: "POST /referrals/${ref_s2}/accept"
              payload: { expected_unit_version: "${v_s2}" }
              as: IntakeNeonatologist
              as_user_id: "${unit_a}:intake-1"
            - call: "POST /admissions"
              payload: { referral_id: "${ref_s2}" }
              as: IntakeNeonatologist
              as_user_id: "${unit_a}:intake-1"
              captures: { adm_s2: $.data.id }
          trigger:
            - call: "POST /surveillance-reports"
              payload: { unit_id: "${unit_a}", period_start: "2026-08-01T00:00:00Z", period_end: "2026-08-31T23:59:59Z", reported_patient_days: 500, reported_central_line_days: 120 }
              as: UnitDirector
              as_user_id: "${unit_a}:dir-1"
              captures: { rep_1: $.data.id }
          assert:
            - "SurveillanceReport.${rep_1}.cohort_size == 2"
            - "SurveillanceReport.${rep_1}.clabsi_count == 1"
            - "SurveillanceReport.${rep_1}.birth_weight_risk_weight == 1.1500"
            - "SurveillanceReport.${rep_1}.crude_clabsi_rate == 2.00"
            - "SurveillanceReport.${rep_1}.device_adjusted_clabsi_rate == 9.58"
            - "SurveillanceReport.${rep_1}.variant_applied == DEVICE_ADJUSTED"
            - "SurveillanceReport.${rep_1}.data_completeness_flag == COMPLETE"
            - "SurveillanceReport.${rep_1}.network_benchmark_flag == ABOVE_BENCHMARK"
            - "The two variants differ by 7.58 on identical source data and the flag is decided by the DEVICE_ADJUSTED value"

      - name: capacity_committed_versus_forecast_beds
        grounds:
          - calculations.capacity_projection
          - calculations.bed_ledger
          - calculations.census_posture
          - entities.NicuUnit.fields.available_bed_count
        distinguishing_aspect: |
          A third dual variant on yet another domain (NicuUnit bed capacity):
          committed_available is 0 while forecast_available is 2, and the
          scaffold pins that only the advisory projection endpoint may publish
          the forecast — acceptance always reads committed.
        test_recipe:
          setup:
            - "Prelude as above; the clock is moved to 2026-08-02T00:00:00Z before the four acceptances and to 2026-08-02T03:05:00Z afterwards."
            - "Regional NICU A (4 staffed beds) holds two admissions — one ADMITTED, one BACK_TRANSFER_READY — and two HELD reservations, one from a MATERNAL_ANTENATAL referral (720-minute hold, expires 2026-08-02T12:00:00Z) and one from an INBOUND_NEONATAL referral (240-minute hold, expires 2026-08-02T04:00:00Z)."
            - "At 03:05 exactly one hold expires within the next 60 minutes."
          setup_api_calls:
            - *k_clock
            - *k_std1
            - *k_std2
            - *k_std3
            - *k_unit_a
            - *k_unit_b
            - *k_cred_neo
            - *k_cred_rn
            - *k_vent
            - *k_hfov
            - &k_clock_0802
              call: "POST /_clock/set_current_utc"
              payload: { current_utc: "2026-08-02T00:00:00Z" }
              as: NetworkAdmin
              as_user_id: "net-1"
            - call: "POST /referrals"
              payload: { referring_unit_id: "${unit_b}", receiving_unit_id: "${unit_a}", referral_kind: "INBOUND_NEONATAL", case_reference: "CASE-C1", gestational_age_weeks: 34.0, birth_weight_grams: 2000, support_modality: "ROOM_AIR" }
              as: ReferringClinician
              as_user_id: "${unit_b}:ref-1"
              captures: { ref_c1: $.data.id }
            - call: "GET /nicu-units/${unit_a}"
              payload: {}
              as: IntakeNeonatologist
              as_user_id: "${unit_a}:intake-1"
              captures: { v_c1: $.data.version }
            - call: "POST /referrals/${ref_c1}/accept"
              payload: { expected_unit_version: "${v_c1}" }
              as: IntakeNeonatologist
              as_user_id: "${unit_a}:intake-1"
            - call: "POST /admissions"
              payload: { referral_id: "${ref_c1}" }
              as: IntakeNeonatologist
              as_user_id: "${unit_a}:intake-1"
              captures: { adm_c1: $.data.id }
            - call: "POST /referrals"
              payload: { referring_unit_id: "${unit_b}", receiving_unit_id: "${unit_a}", referral_kind: "INBOUND_NEONATAL", case_reference: "CASE-C2", gestational_age_weeks: 34.0, birth_weight_grams: 2000, support_modality: "ROOM_AIR" }
              as: ReferringClinician
              as_user_id: "${unit_b}:ref-1"
              captures: { ref_c2: $.data.id }
            - call: "GET /nicu-units/${unit_a}"
              payload: {}
              as: IntakeNeonatologist
              as_user_id: "${unit_a}:intake-1"
              captures: { v_c2: $.data.version }
            - call: "POST /referrals/${ref_c2}/accept"
              payload: { expected_unit_version: "${v_c2}" }
              as: IntakeNeonatologist
              as_user_id: "${unit_a}:intake-1"
            - call: "POST /admissions"
              payload: { referral_id: "${ref_c2}" }
              as: IntakeNeonatologist
              as_user_id: "${unit_a}:intake-1"
              captures: { adm_c2: $.data.id }
            - call: "POST /admissions/${adm_c2}/care-updates"
              payload: { current_weight_grams: 2050, support_modality: "ROOM_AIR", central_line_present: false, ventilated: false }
              as: BedsideNurse
              as_user_id: "nurse-1"
            - &k_round_60_240_t_f
              call: "POST /admissions/${adm_c2}/developmental-rounds"
              payload: { kangaroo_care_minutes: 60, family_presence_minutes: 240, cluster_care_compliant: true, light_cycling_compliant: false }
              as: BedsideNurse
              as_user_id: "nurse-1"
            - *k_round_60_240_t_f
            - call: "POST /admissions/${adm_c2}/back-transfer-ready"
              payload: { back_transfer_attestation_note: "Growing, room air, feeding — appropriate for community level" }
              as: IntakeNeonatologist
              as_user_id: "${unit_a}:intake-1"
            - call: "POST /referrals"
              payload: { referring_unit_id: "${unit_b}", receiving_unit_id: "${unit_a}", referral_kind: "MATERNAL_ANTENATAL", case_reference: "CASE-C3", gestational_age_weeks: 30.0, birth_weight_grams: 1300, support_modality: "ROOM_AIR" }
              as: ReferringClinician
              as_user_id: "${unit_b}:ref-1"
              captures: { ref_c3: $.data.id }
            - call: "GET /nicu-units/${unit_a}"
              payload: {}
              as: IntakeNeonatologist
              as_user_id: "${unit_a}:intake-1"
              captures: { v_c3: $.data.version }
            - call: "POST /referrals/${ref_c3}/accept"
              payload: { expected_unit_version: "${v_c3}" }
              as: IntakeNeonatologist
              as_user_id: "${unit_a}:intake-1"
            - call: "POST /referrals"
              payload: { referring_unit_id: "${unit_b}", receiving_unit_id: "${unit_a}", referral_kind: "INBOUND_NEONATAL", case_reference: "CASE-C4", gestational_age_weeks: 34.0, birth_weight_grams: 2000, support_modality: "ROOM_AIR" }
              as: ReferringClinician
              as_user_id: "${unit_b}:ref-1"
              captures: { ref_c4: $.data.id }
            - call: "GET /nicu-units/${unit_a}"
              payload: {}
              as: IntakeNeonatologist
              as_user_id: "${unit_a}:intake-1"
              captures: { v_c4: $.data.version }
            - call: "POST /referrals/${ref_c4}/accept"
              payload: { expected_unit_version: "${v_c4}" }
              as: IntakeNeonatologist
              as_user_id: "${unit_a}:intake-1"
            - call: "POST /_clock/set_current_utc"
              payload: { current_utc: "2026-08-02T03:05:00Z" }
              as: NetworkAdmin
              as_user_id: "net-1"
          trigger:
            - call: "GET /nicu-units/${unit_a}/capacity-projection"
              payload: {}
              as: UnitDirector
              as_user_id: "${unit_a}:dir-1"
          assert:
            - "capacity-projection.committed_available == 0"
            - "capacity-projection.forecast_available == 2"
            - "capacity-projection.back_transfer_ready_count == 1"
            - "capacity-projection.expiring_hold_count == 1"
            - "capacity-projection.census_posture == CLOSED"
            - "NicuUnit.${unit_a}.occupied_bed_count == 2 and held_bed_count == 2 and available_bed_count == 0"
            - "The MATERNAL_ANTENATAL hold (expires 2026-08-02T12:00:00Z) is NOT counted as expiring while the INBOUND hold (expires 2026-08-02T04:00:00Z) is"

  - rule_id: combinatorial_formula
    instances:

      - name: required_nurse_count_per_band_ceiling_order
        grounds:
          - calculations.required_nurse_count
          - entities.NicuUnit.fields.required_nurse_count
          - entities.Admission.fields.current_care_level
        distinguishing_aspect: |
          Mode (b) — nested rounding where the order is decisive: the scaffold
          pins ceiling-per-acuity-band-then-sum, which yields 3 nurses for a
          census of one LEVEL_III, one LEVEL_II and one LEVEL_I infant, whereas
          sum-the-fractions-then-ceil yields 2. No other instance in this file
          turns on rounding placement.
        test_recipe:
          setup:
            - "Prelude as above."
            - "Regional NICU A holds exactly three admissions whose current_care_level values are LEVEL_III (1200 g, room air), LEVEL_II (1600 g, room air) and LEVEL_I (2600 g, room air), with no active surge escalation so the waiver is 1.00."
          setup_api_calls:
            - *k_clock
            - *k_std1
            - *k_std2
            - *k_std3
            - *k_unit_a
            - *k_unit_b
            - *k_cred_neo
            - *k_cred_rn
            - *k_vent
            - *k_hfov
            - call: "POST /referrals"
              payload: { referring_unit_id: "${unit_b}", receiving_unit_id: "${unit_a}", referral_kind: "INBOUND_NEONATAL", case_reference: "CASE-N3", gestational_age_weeks: 29.0, birth_weight_grams: 1200, support_modality: "ROOM_AIR" }
              as: ReferringClinician
              as_user_id: "${unit_b}:ref-1"
              captures: { ref_b3: $.data.id }
            - call: "GET /nicu-units/${unit_a}"
              payload: {}
              as: IntakeNeonatologist
              as_user_id: "${unit_a}:intake-1"
              captures: { v_b3: $.data.version }
            - call: "POST /referrals/${ref_b3}/accept"
              payload: { expected_unit_version: "${v_b3}" }
              as: IntakeNeonatologist
              as_user_id: "${unit_a}:intake-1"
            - call: "POST /admissions"
              payload: { referral_id: "${ref_b3}" }
              as: IntakeNeonatologist
              as_user_id: "${unit_a}:intake-1"
              captures: { adm_b3: $.data.id }
            - call: "POST /referrals"
              payload: { referring_unit_id: "${unit_b}", receiving_unit_id: "${unit_a}", referral_kind: "INBOUND_NEONATAL", case_reference: "CASE-N2", gestational_age_weeks: 34.0, birth_weight_grams: 1600, support_modality: "ROOM_AIR" }
              as: ReferringClinician
              as_user_id: "${unit_b}:ref-1"
              captures: { ref_b2: $.data.id }
            - call: "GET /nicu-units/${unit_a}"
              payload: {}
              as: IntakeNeonatologist
              as_user_id: "${unit_a}:intake-1"
              captures: { v_b2: $.data.version }
            - call: "POST /referrals/${ref_b2}/accept"
              payload: { expected_unit_version: "${v_b2}" }
              as: IntakeNeonatologist
              as_user_id: "${unit_a}:intake-1"
            - call: "POST /admissions"
              payload: { referral_id: "${ref_b2}" }
              as: IntakeNeonatologist
              as_user_id: "${unit_a}:intake-1"
              captures: { adm_b2: $.data.id }
            - call: "POST /referrals"
              payload: { referring_unit_id: "${unit_b}", receiving_unit_id: "${unit_a}", referral_kind: "INBOUND_NEONATAL", case_reference: "CASE-N1B", gestational_age_weeks: 38.0, birth_weight_grams: 2600, support_modality: "ROOM_AIR" }
              as: ReferringClinician
              as_user_id: "${unit_b}:ref-1"
              captures: { ref_b1: $.data.id }
            - call: "GET /nicu-units/${unit_a}"
              payload: {}
              as: IntakeNeonatologist
              as_user_id: "${unit_a}:intake-1"
              captures: { v_b1: $.data.version }
            - call: "POST /referrals/${ref_b1}/accept"
              payload: { expected_unit_version: "${v_b1}" }
              as: IntakeNeonatologist
              as_user_id: "${unit_a}:intake-1"
            - call: "POST /admissions"
              payload: { referral_id: "${ref_b1}" }
              as: IntakeNeonatologist
              as_user_id: "${unit_a}:intake-1"
              captures: { adm_b1: $.data.id }
          trigger:
            - call: "GET /nicu-units/${unit_a}"
              payload: {}
              as: UnitDirector
              as_user_id: "${unit_a}:dir-1"
          assert:
            - "Admission.${adm_b3}.current_care_level == LEVEL_III"
            - "Admission.${adm_b2}.current_care_level == LEVEL_II"
            - "Admission.${adm_b1}.current_care_level == LEVEL_I"
            - "NicuUnit.${unit_a}.required_nurse_count == 3"
            - "NicuUnit.${unit_a}.required_nurse_count != 2 — the sum-then-ceil order is rejected"
            - "NicuUnit.${unit_a}.occupied_bed_count == 3 and available_bed_count == 1 and census_posture == OPEN"

      - name: surge_authorization_excludes_its_own_beds_from_the_ratio
        grounds:
          - calculations.surge_escalation_authorization
          - calculations.bed_ledger
          - state_machines.SurgeEscalation.REQUESTED_to_ACTIVE
          - entities.SurgeEscalation.fields.census_ratio_at_request
          - errors[ERR_SURGE_THRESHOLD_NOT_MET]
        distinguishing_aspect: |
          Mode (c) — a circular-looking dependency with a pinned evaluation
          order: authorized_beds is computed from a census ratio whose
          denominator excludes the escalation being authorized but includes
          every OTHER active escalation, so the first request at ratio 1.0000
          grants 6 beds and an identical second request is refused at ratio
          0.2500. Reading the ratio after adding the row's own beds would refuse
          the first request too.
        test_recipe:
          setup:
            - "Prelude as above, then Regional NICU A's staffed_bed_target is reduced to 2 under OCC."
            - "Both beds are occupied by admissions, no reservations are held, and the unit holds 3.0 FTE of valid RN_NICU_CORE, so capacity_from_staff at the TIER_3 waiver is floor(3.0 * 1.50 * 2) = 9."
            - "Two escalation requests exist for non-overlapping windows: 2026-08-02T00:00:00Z..2026-08-03T00:00:00Z and 2026-08-05T00:00:00Z..2026-08-06T00:00:00Z."
