            - "DonationPickup.${pickup_id}.manifest_status == SEALED, unchanged by the completion"
  - rule_id: transitive_cascade
    instances:
      - name: shrink_verify_depth_four_cascade_to_department_watch
        grounds:
          - state_machines.ShrinkEvent.RECORDED_to_VERIFIED
          - calculations.shrink_cost_ratio
          - calculations.markdown_liability
          - calculations.department_compliance_posture
          - entities.Department.fields.compliance_status
        distinguishing_aspect: |
          Depth-4 chain (this is the >= 3 instance): verifying one ShrinkEvent moves units on its
          DateCodeLot (hop 1), the emptied lot becomes DEPLETED (hop 2), the unsellable lot voids its
          APPLIED label and drops Department.markdown_liability_cents from 1080 to 0 (hop 3), and the
          moved shrink cost drives Department.shrink_cost_ratio_pct to 100.00 which flips
          Department.compliance_status from COMPLIANT to WATCH (hop 4) -- each hop caused by the
          previous hop, none of them by the verify call directly.
        test_recipe:
          setup:
            - "One SEAFOOD department on store 0412 with shrink_budget_pct 0.10 and an ACTIVE two-rung ladder (days_remaining_max 3 at 15 percent, 1 at 40 percent), max_total_discount_pct 40."
            - "One item at 1200 cents retail, 800 cents cost, daily_forecast_units 2.00, department shelf_life_days_default 10."
            - "One lot of 6 units produced 2026-08-05 (sell_by_at 2026-08-15T00:00:00.000Z), marked down at the clock 2026-08-12T00:00:00.000Z to 1020 cents with its label PRINTED then APPLIED."
            - "One RECORDED shrink event by clerk-7 for all 6 units, cause SPOILAGE; the department is COMPLIANT and markdown_liability_cents is 1080 before the trigger."
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { current_utc: "2026-08-10T08:00:00.000Z" }
              as: StoreOperationsAdmin
            - call: "POST /fresh/stores"
              payload: { store_number: "0412", name: "Fresh Market 0412", region_code: "MID-ATL" }
              as: StoreOperationsAdmin
              captures: { store_id: $.data.id }
            - call: "POST /fresh/markdown-ladders"
              payload: { name: "SEAFOOD-STD-2026", department_code: "SEAFOOD", rungs: [{ days_remaining_max: 3, discount_pct: 15, requires_manager_approval: false }, { days_remaining_max: 1, discount_pct: 40, requires_manager_approval: true }], sell_through_floor_pct: 60, max_total_discount_pct: 40 }
              as: StoreOperationsAdmin
              captures: { ladder_id: $.data.id }
            - call: "POST /fresh/markdown-ladders/${ladder_id}/activate"
              payload: {}
              as: StoreOperationsAdmin
            - call: "POST /fresh/departments"
              payload: { store_id: "${store_id}", markdown_ladder_id: "${ladder_id}", code: "SEAFOOD", shelf_life_days_default: 10, past_date_tolerance_hours: 2, shrink_budget_pct: 0.10 }
              as: StoreOperationsAdmin
              captures: { dept_id: $.data.id }
            - call: "POST /fresh/items"
              payload: { department_id: "${dept_id}", upc: "000999888777", description: "Atlantic Salmon Fillet", base_retail_cents: 1200, unit_cost_cents: 800, daily_forecast_units: 2.00 }
              as: DepartmentManager
              captures: { item_id: $.data.id }
            - call: "POST /fresh/lots"
              payload: { item_id: "${item_id}", production_date: "2026-08-05", quantity_original: 6 }
              as: FreshClerk
              captures: { lot_id: $.data.id, lot_v1: $.data.version }
            - call: "POST /_clock/set_current_utc"
              payload: { current_utc: "2026-08-12T00:00:00.000Z" }
              as: StoreOperationsAdmin
            - call: "POST /fresh/lots/${lot_id}/markdowns"
              payload: { expected_lot_version: "${lot_v1}" }
              as: DepartmentManager
              captures: { label_id: $.data.id }
            - call: "POST /fresh/markdown-labels/${label_id}/print"
              payload: {}
              as: FreshClerk
            - call: "POST /fresh/markdown-labels/${label_id}/apply"
              payload: {}
              as: FreshClerk
            - call: "GET /fresh/departments/${dept_id}"
              payload: {}
              as: DepartmentManager
              captures: { liability_before: $.data.markdown_liability_cents, status_before: $.data.compliance_status, ratio_before: $.data.shrink_cost_ratio_pct }
            - call: "POST /fresh/shrink-events"
              payload: { lot_id: "${lot_id}", cause_code: "SPOILAGE", quantity_units: 6, note: "cooler failure overnight" }
              as: FreshClerk
              as_user_id: "clerk-7"
              captures: { shrink_id: $.data.id }
          trigger:
            - call: "POST /fresh/shrink-events/${shrink_id}/verify"
              payload: {}
              as: DepartmentManager
              as_user_id: "mgr-3"
              captures: { shrink_status: $.data.status, shrink_cost: $.data.cost_value_cents, shrink_retail: $.data.retail_value_cents }
            - call: "GET /fresh/lots/${lot_id}"
              payload: {}
              as: DepartmentManager
              captures: { lot_status_after: $.data.status, qoh_after: $.data.quantity_on_hand, shrunk_after: $.data.units_shrunk }
            - call: "GET /fresh/departments/${dept_id}"
              payload: {}
              as: DepartmentManager
              captures: { liability_after: $.data.markdown_liability_cents, ratio_after: $.data.shrink_cost_ratio_pct, status_after: $.data.compliance_status }
          assert:
            - "${liability_before} == 1080 and ${ratio_before} == 0 and ${status_before} == COMPLIANT"
            - "${shrink_status} == VERIFIED"
            - "${shrink_cost} == 4968"
            - "${shrink_retail} == 6120"
            - "ShrinkEvent.${shrink_id}.verified_by_user_id == 'mgr-3' and ShrinkEvent.${shrink_id}.verified_at == '2026-08-12T00:00:00.000Z'"
            - "hop 1: ${shrunk_after} == 6 and ${qoh_after} == 0"
            - "hop 2: ${lot_status_after} == DEPLETED"
            - "hop 3: MarkdownLabel.${label_id}.status == VOIDED and ${liability_after} == 0"
            - "hop 4: ${ratio_after} == 100.00"
            - "hop 4: ${status_after} == WATCH, because 100.00 exceeds shrink_budget_pct 0.10"
            - "DateCodeLot.${lot_id} satisfies lot_unit_conservation: 6 == 0 + 0 + 6 + 0"
      - name: finding_remediation_depth_four_cascade_unblocks_department
        grounds:
          - state_machines.AuditFinding.OPEN_to_RESOLVED
          - state_machines.ComplianceAudit.ESCALATED_to_REMEDIATED
          - calculations.compliance_severity
          - calculations.department_compliance_posture
          - entities.Department.fields.open_finding_count
        distinguishing_aspect: |
          Remediating the audit's last OPEN finding cascades four hops in the opposite direction from
          the shrink chain: the finding closes (hop 1), its lot runs the full withdrawal cascade to
          WITHDRAWN with a synthetic 20-unit WITHDRAWAL_AUTO shrink event (hop 2),
          Department.open_finding_count falls to 0 which bubbles the audit's disposition_status
          ESCALATED -> REMEDIATED (hop 3), and the posture recomputation drops the department from
          BLOCKED back to COMPLIANT (hop 4).
