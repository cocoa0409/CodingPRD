# =============================================================================
# §1.8 Scaffold Difficulty Design (Test Targeting Index)
# Cross-references SCAFFOLD.yaml §1.1–§1.7 against the nine §0.5 Difficulty Rules.
# 9 rule_ids × 2 instances = 18 instances.
# All formula-derived assert values precomputed as literals (contract item 7).
# =============================================================================
scaffold_difficulty_design:

  # ---------------------------------------------------------------------------
  - rule_id: dual_variant_calc
    instances:
      - name: case_statement_provisional_vs_final
        grounds:
          - calculations.statement_total
          - entities.Case.fields.statement_total_provisional_cents
          - entities.Case.fields.statement_total_final_cents
          - state_machines.Case.DISCLOSED_to_ARRANGED
        distinguishing_aspect: |
          On the Case entity domain: provisional total includes PROPOSED+SELECTED lines
          (362000) while the final total locked at GFS includes SELECTED-only (200000) —
          same lines, two inclusion sets, different cents.
        test_recipe:
          setup:
            - "FuneralHome with sales_tax_pct=0.08; a non-declinable SERVICE GplItem priced 200000 and a taxable MERCHANDISE casket priced 150000."
            - "AT_NEED Case past disclosure; non-declinable line auto-SELECTED (200000); casket line left PROPOSED (162000 incl tax)."
          setup_api_calls:
            - call: "POST /funeral-homes"
              payload: { name: "Rose Hill", sales_tax_pct: 0.08, state_trust_pct: 0.90, trust_admin_retention_cents: 5000, chapel_buffer_minutes: 30 }
              as: Admin
              captures: { home_id: $.data.id }
            - call: "POST /gpl-items"
              payload: { funeral_home_id: "${home_id}", code: "SVC-BASIC", name: "Basic services of funeral director", category: "SERVICE", taxable: false, non_declinable: true, preneed_trustable: true, unit_price_cents: 200000 }
              as: Admin
              captures: { svc_item_id: $.data.id }
            - call: "POST /gpl-items"
              payload: { funeral_home_id: "${home_id}", code: "CASKET-A", name: "Oak casket", category: "MERCHANDISE", taxable: true, non_declinable: false, preneed_trustable: true, unit_price_cents: 150000 }
              as: Admin
              captures: { casket_item_id: $.data.id }
            - call: "POST /cases"
              payload: { funeral_home_id: "${home_id}", decedent_name: "Jane Doe", case_mode: "AT_NEED", date_of_death: "2026-06-01T00:00:00.000Z" }
              as: Arranger
              as_user_id: "arr-1"
              captures: { case_id: $.data.id }
            - call: "POST /cases/${case_id}/acknowledge-disclosure"
              payload: {}
              as: Arranger
              as_user_id: "arr-1"
            - call: "POST /cases/${case_id}/statement-lines"
              payload: { gpl_item_id: "${svc_item_id}", quantity: 1 }
              as: Arranger
              as_user_id: "arr-1"
            - call: "POST /cases/${case_id}/statement-lines"
              payload: { gpl_item_id: "${casket_item_id}", quantity: 1 }
              as: Arranger
              as_user_id: "arr-1"
          trigger:
            - call: "GET /cases/${case_id}"
              payload: {}
              as: Arranger
              as_user_id: "arr-1"
              captures: { prov: $.data.statement_total_provisional_cents }
          assert:
            - "Case.${case_id}.statement_total_provisional_cents == 362000"
            - "Case.${case_id}.statement_total_final_cents == 0 (final not yet locked; GFS not issued)"
            - "Case.${case_id}.gfs_issued == false"

      - name: contract_funded_preneed_projection_vs_at_need_chronological
        grounds:
          - calculations.contract_funded_amount
          - calculations.projected_trust_earnings
          - entities.Contract.fields.funded_amount_cents
          - state_machines.Contract.DRAFT_to_PENDING_FUNDING
        distinguishing_aspect: |
          On the Contract entity domain (different from Case): PRENEED_TRUST funded_amount
          adds forward-looking projected_earnings (principal 360000 + floor(360000*0.03)=10800
          => 370800), whereas AT_NEED_DIRECT sums realized POSTED principal chronologically
          (200000 then 162000 => 362000, no projection).
        test_recipe:
          setup:
            - "PRENEED Case with GFS issued; contract PRENEED_TRUST; one POSTED PRINCIPAL deposit of 360000."
          setup_api_calls:
            - call: "POST /funeral-homes"
              payload: { name: "Rose Hill", sales_tax_pct: 0.08, state_trust_pct: 0.90, trust_admin_retention_cents: 5000 }
              as: Admin
              captures: { home_id: $.data.id }
            - call: "POST /gpl-items"
              payload: { funeral_home_id: "${home_id}", code: "SVC-BASIC", name: "Basic services", category: "SERVICE", taxable: false, non_declinable: true, preneed_trustable: true, unit_price_cents: 200000 }
              as: Admin
              captures: { svc_item_id: $.data.id }
            - call: "POST /gpl-items"
              payload: { funeral_home_id: "${home_id}", code: "CASKET-A", name: "Oak casket", category: "MERCHANDISE", taxable: true, non_declinable: false, preneed_trustable: true, unit_price_cents: 150000 }
              as: Admin
              captures: { casket_item_id: $.data.id }
            - call: "POST /cases"
              payload: { funeral_home_id: "${home_id}", decedent_name: "Jane Doe", case_mode: "PRENEED" }
              as: Arranger
              as_user_id: "arr-1"
              captures: { case_id: $.data.id }
            - call: "POST /cases/${case_id}/acknowledge-disclosure"
              payload: {}
              as: Arranger
              as_user_id: "arr-1"
            - call: "POST /cases/${case_id}/statement-lines"
              payload: { gpl_item_id: "${svc_item_id}", quantity: 1 }
              as: Arranger
              as_user_id: "arr-1"
            - call: "POST /cases/${case_id}/statement-lines"
              payload: { gpl_item_id: "${casket_item_id}", quantity: 1 }
              as: Arranger
              as_user_id: "arr-1"
              captures: { casket_line_id: $.data.id }
            - call: "POST /cases/${case_id}/statement-lines/${casket_line_id}/select"
              payload: {}
              as: Arranger
              as_user_id: "arr-1"
            - call: "POST /cases/${case_id}/contract"
              payload: { funding_type: "PRENEED_TRUST" }
              as: Arranger
              as_user_id: "arr-1"
              captures: { contract_id: $.data.id }
            - call: "POST /cases/${case_id}/issue-gfs"
              payload: {}
              as: Arranger
              as_user_id: "arr-1"
            - call: "POST /contracts/${contract_id}/trust-deposits"
              payload: { kind: "PRINCIPAL", amount_cents: 360000 }
              as: TrustOfficer
              as_user_id: "to-1"
          trigger:
            - call: "GET /contracts/${contract_id}"
              payload: {}
              as: TrustOfficer
              as_user_id: "to-1"
              captures: { funded: $.data.funded_amount_cents }
          assert:
            - "Contract.${contract_id}.funding_type == PRENEED_TRUST"
            - "Contract.${contract_id}.trust_principal_cents == 360000"
            - "Contract.${contract_id}.projected_earnings_cents == 10800"
            - "Contract.${contract_id}.funded_amount_cents == 370800"
            - "Contract.${contract_id}.contract_amount_cents == 362000"

  # ---------------------------------------------------------------------------
  - rule_id: combinatorial_formula
    instances:
      - name: trust_required_conditional_tiered_floor
        grounds:
          - calculations.trust_required_principal
          - entities.Contract.fields.trust_required_cents
          - entities.FuneralHome.fields.state_trust_pct
          - entities.FuneralHome.fields.trust_admin_retention_cents
        distinguishing_aspect: |
          Mode (a) — >=3 inputs (trustable_base, state_trust_pct, admin_retention) with a
          conditional branch on funding_type and a nested max(0, ...) floor:
          max(0, round_half_up(362000*0.90) - 5000) = max(0, 325800 - 5000) = 320800.
        test_recipe:
          setup:
            - "PRENEED Case, GFS issued, two SELECTED preneed_trustable lines summing to 362000."
          setup_api_calls:
            - call: "POST /funeral-homes"
              payload: { name: "Rose Hill", sales_tax_pct: 0.08, state_trust_pct: 0.90, trust_admin_retention_cents: 5000 }
              as: Admin
              captures: { home_id: $.data.id }
            - call: "POST /gpl-items"
              payload: { funeral_home_id: "${home_id}", code: "SVC-BASIC", name: "Basic services", category: "SERVICE", taxable: false, non_declinable: true, preneed_trustable: true, unit_price_cents: 200000 }
              as: Admin
              captures: { svc_item_id: $.data.id }
            - call: "POST /gpl-items"
              payload: { funeral_home_id: "${home_id}", code: "CASKET-A", name: "Oak casket", category: "MERCHANDISE", taxable: true, non_declinable: false, preneed_trustable: true, unit_price_cents: 150000 }
              as: Admin
              captures: { casket_item_id: $.data.id }
            - call: "POST /cases"
              payload: { funeral_home_id: "${home_id}", decedent_name: "Jane Doe", case_mode: "PRENEED" }
              as: Arranger
              as_user_id: "arr-1"
              captures: { case_id: $.data.id }
            - call: "POST /cases/${case_id}/acknowledge-disclosure"
              payload: {}
              as: Arranger
              as_user_id: "arr-1"
            - call: "POST /cases/${case_id}/statement-lines"
              payload: { gpl_item_id: "${svc_item_id}", quantity: 1 }
              as: Arranger
              as_user_id: "arr-1"
            - call: "POST /cases/${case_id}/statement-lines"
              payload: { gpl_item_id: "${casket_item_id}", quantity: 1 }
              as: Arranger
              as_user_id: "arr-1"
              captures: { casket_line_id: $.data.id }
            - call: "POST /cases/${case_id}/statement-lines/${casket_line_id}/select"
              payload: {}
              as: Arranger
              as_user_id: "arr-1"
            - call: "POST /cases/${case_id}/contract"
              payload: { funding_type: "PRENEED_TRUST" }
              as: Arranger
              as_user_id: "arr-1"
              captures: { contract_id: $.data.id }
            - call: "POST /cases/${case_id}/issue-gfs"
              payload: {}
              as: Arranger
              as_user_id: "arr-1"
          trigger:
            - call: "GET /contracts/${contract_id}"
              payload: {}
              as: Arranger
              as_user_id: "arr-1"
              captures: { req: $.data.trust_required_cents }
          assert:
            - "Contract.${contract_id}.trust_required_cents == 320800"
            - "Contract.${contract_id}.contract_amount_cents == 362000"

      - name: statement_total_per_line_rounding_then_sum
        grounds:
          - calculations.statement_total
          - entities.Case.fields.statement_total_provisional_cents
          - entities.GplItem.fields.taxable
        distinguishing_aspect: |
          Mode (b) — nested rounding ORDER: two taxable lines unit 631 (tax 631*0.08=50.48
          round_half_up=>50 each) plus a non-declinable 100000 service => per-line-then-sum
          = 100000 + 681 + 681 = 101362; the forbidden sum-then-round would yield 101363.
        test_recipe:
          setup:
            - "FuneralHome sales_tax_pct=0.08; non-declinable SERVICE 100000; taxable MERCHANDISE token priced 631."
            - "AT_NEED Case disclosed; non-declinable line SELECTED; two token lines added then both SELECTED."
          setup_api_calls:
            - call: "POST /funeral-homes"
              payload: { name: "Rounding Home", sales_tax_pct: 0.08, state_trust_pct: 0.90 }
              as: Admin
              captures: { home_id: $.data.id }
            - call: "POST /gpl-items"
              payload: { funeral_home_id: "${home_id}", code: "SVC-BASIC", name: "Basic services", category: "SERVICE", taxable: false, non_declinable: true, preneed_trustable: true, unit_price_cents: 100000 }
              as: Admin
              captures: { svc_item_id: $.data.id }
            - call: "POST /gpl-items"
              payload: { funeral_home_id: "${home_id}", code: "TOKEN", name: "Memorial token", category: "MERCHANDISE", taxable: true, non_declinable: false, preneed_trustable: true, unit_price_cents: 631 }
              as: Admin
              captures: { token_item_id: $.data.id }
            - call: "POST /cases"
              payload: { funeral_home_id: "${home_id}", decedent_name: "Roundy Roe", case_mode: "AT_NEED", date_of_death: "2026-06-01T00:00:00.000Z" }
              as: Arranger
              as_user_id: "arr-1"
              captures: { case_id: $.data.id }
            - call: "POST /cases/${case_id}/acknowledge-disclosure"
              payload: {}
              as: Arranger
              as_user_id: "arr-1"
            - call: "POST /cases/${case_id}/statement-lines"
              payload: { gpl_item_id: "${svc_item_id}", quantity: 1 }
              as: Arranger
              as_user_id: "arr-1"
            - call: "POST /cases/${case_id}/statement-lines"
              payload: { gpl_item_id: "${token_item_id}", quantity: 1 }
              as: Arranger
              as_user_id: "arr-1"
              captures: { token_line_1: $.data.id }
            - call: "POST /cases/${case_id}/statement-lines"
              payload: { gpl_item_id: "${token_item_id}", quantity: 1 }
              as: Arranger
              as_user_id: "arr-1"
              captures: { token_line_2: $.data.id }
            - call: "POST /cases/${case_id}/statement-lines/${token_line_1}/select"
              payload: {}
              as: Arranger
              as_user_id: "arr-1"
            - call: "POST /cases/${case_id}/statement-lines/${token_line_2}/select"
              payload: {}
              as: Arranger
              as_user_id: "arr-1"
          trigger:
            - call: "GET /cases/${case_id}"
              payload: {}
              as: Arranger
              as_user_id: "arr-1"
              captures: { prov: $.data.statement_total_provisional_cents }
          assert:
            - "Case.${case_id}.statement_total_provisional_cents == 101362"
            - "Case.${case_id}.statement_total_provisional_cents != 101363 (sum-then-round is wrong)"

  # ---------------------------------------------------------------------------
  - rule_id: non_linear_state_machine
    instances:
      - name: contract_pending_funding_revert_to_draft_cycle
        grounds:
          - state_machines.Contract.PENDING_FUNDING_to_DRAFT
          - state_machines.Contract.DRAFT_to_PENDING_FUNDING
          - entities.Contract.fields.status
        distinguishing_aspect: |
          Cyclic shape on the Contract entity: DRAFT->PENDING_FUNDING->DRAFT (reopen) is a
          revision loop; a preneed contract returns to DRAFT and can be resubmitted, unlike a
          pure linear pipeline.
        test_recipe:
          setup:
            - "PRENEED contract submitted for funding (PENDING_FUNDING) after GFS issued."
          setup_api_calls:
            - call: "POST /funeral-homes"
              payload: { name: "Rose Hill", sales_tax_pct: 0.08, state_trust_pct: 0.90 }
              as: Admin
              captures: { home_id: $.data.id }
            - call: "POST /gpl-items"
              payload: { funeral_home_id: "${home_id}", code: "SVC-BASIC", name: "Basic services", category: "SERVICE", taxable: false, non_declinable: true, preneed_trustable: true, unit_price_cents: 200000 }
              as: Admin
              captures: { svc_item_id: $.data.id }
            - call: "POST /cases"
              payload: { funeral_home_id: "${home_id}", decedent_name: "Jane Doe", case_mode: "PRENEED" }
              as: Arranger
              as_user_id: "arr-1"
              captures: { case_id: $.data.id }
            - call: "POST /cases/${case_id}/acknowledge-disclosure"
              payload: {}
              as: Arranger
              as_user_id: "arr-1"
            - call: "POST /cases/${case_id}/statement-lines"
              payload: { gpl_item_id: "${svc_item_id}", quantity: 1 }
              as: Arranger
              as_user_id: "arr-1"
            - call: "POST /cases/${case_id}/contract"
              payload: { funding_type: "PRENEED_TRUST" }
              as: Arranger
              as_user_id: "arr-1"
              captures: { contract_id: $.data.id }
            - call: "POST /cases/${case_id}/issue-gfs"
              payload: {}
              as: Arranger
              as_user_id: "arr-1"
            - call: "POST /contracts/${contract_id}/submit-for-funding"
              payload: {}
              as: Arranger
              as_user_id: "arr-1"
          trigger:
            - call: "POST /contracts/${contract_id}/reopen"
              payload: {}
              as: Arranger
              as_user_id: "arr-1"
              captures: { st: $.data.status }
          assert:
            - "Contract.${contract_id}.status == DRAFT"
            - "Contract.${contract_id} can be re-submitted (DRAFT->PENDING_FUNDING) again afterward"

      - name: permit_applied_branch_reject_then_reapply_loop
        grounds:
          - state_machines.Permit.APPLIED_to_REJECTED
          - state_machines.Permit.REJECTED_to_APPLIED
          - state_machines.Permit.APPLIED_to_ISSUED
          - entities.Permit.fields.status
        distinguishing_aspect: |
          Branching-with-revert on the Permit entity (different entity from Contract):
          APPLIED forks to {ISSUED, REJECTED}, and REJECTED reverts to APPLIED via reapply —
          a non-linear fork/loop shape.
        test_recipe:
          setup:
            - "AT_NEED Case with a DEATH_CERTIFICATE permit APPLIED then REJECTED."
          setup_api_calls:
            - call: "POST /funeral-homes"
              payload: { name: "Rose Hill", sales_tax_pct: 0.08, state_trust_pct: 0.90 }
              as: Admin
              captures: { home_id: $.data.id }
            - call: "POST /cases"
              payload: { funeral_home_id: "${home_id}", decedent_name: "Jane Doe", case_mode: "AT_NEED", date_of_death: "2026-06-01T00:00:00.000Z" }
              as: Arranger
              as_user_id: "arr-1"
              captures: { case_id: $.data.id }
            - call: "POST /cases/${case_id}/permits"
              payload: { permit_type: "DEATH_CERTIFICATE" }
              as: Registrar
              as_user_id: "reg-1"
              captures: { permit_id: $.data.id }
            - call: "POST /permits/${permit_id}/reject"
              payload: {}
              as: Registrar
              as_user_id: "reg-1"
          trigger:
            - call: "POST /permits/${permit_id}/reapply"
              payload: {}
              as: Registrar
              as_user_id: "reg-1"
              captures: { st: $.data.status }
          assert:
            - "Permit.${permit_id}.status == APPLIED"
            - "Permit.${permit_id} can then be issued (APPLIED->ISSUED)"

  # ---------------------------------------------------------------------------
  - rule_id: transitive_cascade
    instances:
      - name: case_cancel_void_refund_release_plot_cancel_events_depth4
        grounds:
          - state_machines.Case.ARRANGED_to_CANCELLED
          - state_machines.Contract.FUNDED_to_VOID
          - state_machines.Plot.RESERVED_to_AVAILABLE
          - state_machines.Event.SCHEDULED_to_CANCELLED
        distinguishing_aspect: |
          Depth-4 chain from POST /cases/{id}/cancel: Case CANCELLED -> Contract VOID
          (link1) -> Contract VOID refunds TrustDeposits AND releases reserved Plot
          (link2/3 caused by void) -> released Plot drives SCHEDULED graveside/chapel
          Events to CANCELLED (link4). Each link caused by the prior, not the original call.
        test_recipe:
          setup:
            - "PRENEED Case ARRANGED with a DRAFT contract holding a POSTED 360000 deposit, a RESERVED plot, and a SCHEDULED chapel event."
          setup_api_calls:
            - call: "POST /funeral-homes"
              payload: { name: "Rose Hill", sales_tax_pct: 0.08, state_trust_pct: 0.90, chapel_buffer_minutes: 30 }
              as: Admin
              captures: { home_id: $.data.id }
            - call: "POST /gpl-items"
              payload: { funeral_home_id: "${home_id}", code: "SVC-BASIC", name: "Basic services", category: "SERVICE", taxable: false, non_declinable: true, preneed_trustable: true, unit_price_cents: 200000 }
              as: Admin
              captures: { svc_item_id: $.data.id }
            - call: "POST /venues"
              payload: { funeral_home_id: "${home_id}", name: "Main Chapel", capacity: 120 }
              as: Admin
              captures: { venue_id: $.data.id }
            - call: "POST /plots"
              payload: { funeral_home_id: "${home_id}", section: "A", plot_code: "A-12", current_price_cents: 80000 }
              as: CemeteryClerk
              as_user_id: "cc-1"
              captures: { plot_id: $.data.id, plot_v0: $.data.version }
            - call: "POST /cases"
              payload: { funeral_home_id: "${home_id}", decedent_name: "Jane Doe", case_mode: "PRENEED" }
              as: Arranger
              as_user_id: "arr-1"
              captures: { case_id: $.data.id }
            - call: "POST /cases/${case_id}/acknowledge-disclosure"
              payload: {}
              as: Arranger
              as_user_id: "arr-1"
            - call: "POST /cases/${case_id}/statement-lines"
              payload: { gpl_item_id: "${svc_item_id}", quantity: 1 }
              as: Arranger
              as_user_id: "arr-1"
            - call: "POST /cases/${case_id}/contract"
              payload: { funding_type: "PRENEED_TRUST" }
              as: Arranger
              as_user_id: "arr-1"
              captures: { contract_id: $.data.id }
            - call: "POST /cases/${case_id}/issue-gfs"
              payload: {}
              as: Arranger
              as_user_id: "arr-1"
            - call: "POST /contracts/${contract_id}/trust-deposits"
              payload: { kind: "PRINCIPAL", amount_cents: 360000 }
              as: TrustOfficer
              as_user_id: "to-1"
            - call: "POST /plots/${plot_id}/reserve"
              payload: { case_id: "${case_id}", expected_plot_version: "${plot_v0}" }
              as: CemeteryClerk
              as_user_id: "cc-1"
            - call: "POST /cases/${case_id}/events"
              payload: { resource_kind: "CHAPEL", resource_id: "${venue_id}", starts_at: "2026-06-10T15:00:00.000Z", ends_at: "2026-06-10T16:00:00.000Z" }
              as: Arranger
              as_user_id: "arr-1"
              captures: { event_id: $.data.id }
          trigger:
            - call: "POST /cases/${case_id}/cancel"
              payload: {}
              as: Arranger
              as_user_id: "arr-1"
          assert:
            - "Case.${case_id}.arrangement_status == CANCELLED"
            - "Contract.${contract_id}.status == VOID"
            - "Contract.${contract_id}.trust_principal_cents == 0 (deposit refunded by a REFUND leg)"
            - "Plot.${plot_id}.status == AVAILABLE and reserved_case_id == null"
            - "Event.${event_id}.status == CANCELLED"

      - name: permit_issue_makes_case_ready_then_inter_makes_interred_depth2
        grounds:
          - state_machines.Permit.APPLIED_to_ISSUED
          - state_machines.Plot.RESERVED_to_INTERRED
          - entities.Case.fields.interment_status
        distinguishing_aspect: |
          Depth-2 chain originating from a DIFFERENT trigger (POST /plots/{id}/inter):
          Plot RESERVED->INTERRED (link1) -> reserved Case.interment_status READY->INTERRED
          (link2 caused by the plot becoming INTERRED). Distinct from the cancel cascade.
        test_recipe:
          setup:
            - "AT_NEED Case with both DEATH_CERTIFICATE and BURIAL_TRANSIT permits ISSUED (interment_status auto READY) and a plot RESERVED for the case."
          setup_api_calls:
            - call: "POST /funeral-homes"
              payload: { name: "Rose Hill", sales_tax_pct: 0.08, state_trust_pct: 0.90 }
              as: Admin
              captures: { home_id: $.data.id }
            - call: "POST /plots"
              payload: { funeral_home_id: "${home_id}", section: "A", plot_code: "A-13", current_price_cents: 80000 }
              as: CemeteryClerk
              as_user_id: "cc-1"
              captures: { plot_id: $.data.id, plot_v0: $.data.version }
            - call: "POST /cases"
