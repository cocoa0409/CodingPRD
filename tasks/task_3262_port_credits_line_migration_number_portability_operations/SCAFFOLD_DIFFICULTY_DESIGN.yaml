              as: PlatformAdmin
            - call: "POST /portability/_clock/set_current_utc"
              payload: { to_iso8601: "2026-09-02T00:00:00Z" }
              as: PlatformAdmin
            - call: "GET /portability/subscriber-lines/${line}"
              as: PlatformAdmin
              captures: { line_v1: $.data.version }
            - call: "POST /portability/port-requests"
              payload: { subscriber_line_id: "${line}", losing_carrier_code: "ATTC", account_number_at_losing_carrier: "ACC16", transfer_pin: "1616", requested_cutover_at: "2026-09-20T00:00:00Z", expected_subscriber_line_version: "${line_v1}" }
              as: CustomerService
              captures: { pr: $.data.id }
            - call: "POST /portability/port-requests/${pr}/submit"
              payload: { transfer_pin: "1616", account_number_at_losing_carrier: "ACC16" }
              as: CustomerService
            - call: "POST /portability/port-requests/${pr}/rejections"
              payload: { rejection_code: "ACCT_LOCKED" }
              as: PlatformAdmin
            - call: "POST /portability/port-requests/${pr}/resubmit"
              payload: { transfer_pin: "1616", account_number_at_losing_carrier: "ACC16" }
              as: CustomerService
            - call: "POST /portability/migration-requests"
              payload: { subscriber_line_id: "${line}", source_billing_mode: "PREPAID", target_billing_mode: "POSTPAID", prepaid_balance_cents: 0, requested_cutover_at: "2026-10-01T00:00:00Z" }
              as: CustomerService
