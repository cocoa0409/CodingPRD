# =============================================================================
# Task 1140: eConsult & Specialist Curbside Program — scaffold seed tables
# Difficulty: beyond-expert (dense coupling over flat topology)
# =============================================================================

scenario: |
  1140. eConsult & Specialist Curbside Program (health system eConsult program):
  asynchronous consult submission with structured question, specialty routing &
  response-time target, response payment/compensation model, conversion to
  in-person visit determination, documentation into both records & billing rules,
  quality review of consult responses, avoided-visit measurement, panel of
  participating specialists

domain_name: econsult-curbside
api_prefix: /econsult

complexity_profile:
  primary_archetype: workflow_orchestration
  secondary_archetype: compliance_audit
  complexity_layers:
    - optimistic_concurrency      # OCC on ConsultRequest.version for PATCH + reroute
    - dual_variant_calculation    # provisional vs posted compensation; attributed vs conservative avoided visits
    - cascading_side_effects      # review rebuke -> response -> ledger -> membership standing -> re-queue consults
    - selector_policy             # deterministic panel routing with eligibility/ranking/tie-break/fallback
  entity_topology: flat           # peer entities joined by FK references; no nested creation paths
  state_machine_shape: parallel   # ConsultRequest.status x ConsultRequest.billing_status evolve independently; cyclic standing on PanelMembership
  relationship_patterns:
    - one_to_many
    - cross_aggregate
  role_model: segregation_of_duties   # quality reviewer must not be the responding specialist; billing separated from clinical roles
  consistency_model: immediate

# =============================================================================
# 1.0 Response Envelope (FIXED)
# =============================================================================
response_envelope:
  success: |
    { "meta": { "api_request_id": "req_xxx", "api_request_timestamp": "ISO8601" },
      "response_type": "object" | "array", "data": {} }
  error: |
    { "meta": { ... }, "response_type": "error",
      "data": { "error_id": "ERR_XXX", "message": "..." } }
  pagination_fields: ["limit", "offset", "total_count", "has_more"]
  pagination_defaults: { limit: 10, min: 1, max: 100, offset: 0 }

# =============================================================================
# 1.1 Entity-Relationship Table
# =============================================================================
entities:
  - name: SpecialtyTrack
    parent: null
    common_fields: true
    fields:
      - { name: specialty_code, type: enum, source: input, description: "Specialty identifier", constraints: "one of CARDIOLOGY | ENDOCRINOLOGY | NEUROLOGY | DERMATOLOGY | RHEUMATOLOGY; unique across tracks" }
      - { name: response_time_target_hours, type: integer, source: input, description: "Routine SLA target in hours", constraints: "> 0" }
      - { name: urgent_target_hours, type: integer, source: input, description: "Urgent SLA target in hours", constraints: "> 0 and < response_time_target_hours" }
      - { name: base_response_fee_cents, type: integer, source: input, description: "Specialist fee for an answered (non-conversion) response", constraints: ">= 0" }
      - { name: conversion_response_fee_cents, type: integer, source: input, description: "Specialist fee when disposition is CONVERT_TO_VISIT", constraints: ">= 0" }
      - { name: clarification_fee_cents, type: integer, source: input, description: "Fee per clarification round answered by the specialist", constraints: ">= 0" }
      - { name: late_penalty_cents, type: integer, source: input, description: "Penalty subtracted at finalize when response was late", constraints: ">= 0" }
      - { name: monthly_billing_cap_cents, type: integer, source: input, description: "Aggregate cap on SUBMITTED+PAID claims per calendar month for this track", constraints: "> 0" }

  - name: ReferringProvider
    parent: null
    common_fields: true
    fields:
      - { name: full_name, type: string, source: input, description: "Provider display name" }
      - { name: npi, type: string, source: input, description: "National provider identifier", constraints: "unique; 10-digit string" }
      - { name: status, type: enum, source: input, description: "ACTIVE | DEACTIVATED", default: ACTIVE }

  - name: Specialist
    parent: null
    common_fields: true
    fields:
      - { name: full_name, type: string, source: input, description: "Specialist display name" }
      - { name: npi, type: string, source: input, description: "National provider identifier", constraints: "unique; 10-digit string" }
      - { name: status, type: enum, source: input, description: "ACTIVE | DEACTIVATED", default: ACTIVE }

  - name: PanelMembership
    parent: null
    common_fields: true
    fields:
      - { name: specialist_id, type: string, source: input, description: "FK -> Specialist.id; the panelled specialist" }
      - { name: specialty_track_id, type: string, source: input, description: "FK -> SpecialtyTrack.id; panel specialty" }
      - { name: standing, type: enum, source: system, description: "GOOD_STANDING | PROBATION | SUSPENDED", default: GOOD_STANDING }
      - { name: quality_score_bps, type: integer, source: computed, description: "Blended quality score in basis points (0-10000)", default: 8500 }
      - { name: reviews_count, type: integer, source: computed, description: "Number of COMPLETED quality reviews", default: 0 }
      - { name: reviews_score_sum, type: integer, source: computed, description: "Sum of composite_score_bps over COMPLETED reviews", default: 0 }
      - { name: responded_count, type: integer, source: computed, description: "Responses submitted (first submission per consult only)", default: 0 }
      - { name: on_time_count, type: integer, source: computed, description: "Responses with on_time == true", default: 0 }
      - { name: rebuke_count, type: integer, source: computed, description: "Reviews completed with verdict REBUKE", default: 0 }
      - { name: expired_count, type: integer, source: computed, description: "Assigned consults that EXPIRED unanswered", default: 0 }
      - { name: open_consult_count, type: integer, source: computed, description: "Consults currently ASSIGNED or CLARIFICATION_REQUESTED to this membership", default: 0 }
      - { name: provisional_balance_cents, type: integer, source: computed, description: "Sum of amount_cents over CompensationEntry with posture PROVISIONAL", default: 0 }
      - { name: posted_balance_cents, type: integer, source: computed, description: "Sum of amount_cents over CompensationEntry with posture POSTED", default: 0 }
      - { name: is_accepting, type: boolean, source: input, description: "Whether the membership accepts new routings", default: true }
      - { name: unique_membership, type: string, source: system, description: "Uniqueness marker over (specialist_id, specialty_track_id)", constraints: "pair must be unique; duplicate create -> ERR_DUPLICATE_MEMBERSHIP" }

  - name: ConsultRequest
    parent: null
    common_fields: true
    fields:
      - { name: referring_provider_id, type: string, source: system, description: "FK -> ReferringProvider.id; set from X-User-ID of the creator" }
      - { name: patient_ref, type: string, source: input, description: "De-identified patient reference", constraints: "non-empty; at most one non-terminal consult per (patient_ref, specialty_track_id)" }
      - { name: specialty_track_id, type: string, source: input, description: "FK -> SpecialtyTrack.id; routing target specialty" }
      - { name: question_text, type: string, source: input, description: "Structured clinical question", constraints: "length >= 20 characters" }
      - { name: icd10_primary, type: string, source: input, description: "Primary ICD-10 code", constraints: "non-empty" }
      - { name: comorbidity_flags, type: array, source: input, description: "List of comorbidity flag strings", default: [] }
      - { name: urgency, type: enum, source: input, description: "ROUTINE | URGENT", default: ROUTINE }
      - { name: status, type: enum, source: system, description: "SUBMITTED | QUEUED | ASSIGNED | CLARIFICATION_REQUESTED | ANSWERED | CLOSED | EXPIRED | CANCELLED" }
      - { name: billing_status, type: enum, source: system, description: "UNBILLABLE | PENDING_DOCUMENTATION | CHARGEABLE | CLAIMED | VOID (parallel dimension, independent of status)" }
      - { name: assigned_specialist_id, type: string, source: system, description: "FK -> Specialist.id; nullable; set by routing selector, cleared on re-queue" }
      - { name: assigned_membership_id, type: string, source: system, description: "FK -> PanelMembership.id; nullable; set by routing selector, cleared on re-queue" }
      - { name: sla_due_at, type: datetime, source: computed, description: "created_at + (urgency == URGENT ? urgent_target_hours : response_time_target_hours) of the track" }
      - { name: sla_breached, type: boolean, source: computed, description: "True once a response is submitted with responded_at > sla_due_at, or consult EXPIRED", default: false }
      - { name: clarification_rounds, type: integer, source: computed, description: "Number of specialist clarification requests issued", default: 0 }

  - name: ConsultResponse
    parent: null
    common_fields: true
    fields:
      - { name: consult_id, type: string, source: system, description: "FK -> ConsultRequest.id; parent consult (from path)" }
      - { name: specialist_id, type: string, source: system, description: "FK -> Specialist.id; responder, from X-User-ID" }
      - { name: disposition, type: enum, source: input, description: "MANAGE_IN_PRIMARY_CARE | MANAGE_WITH_PLAN | CONVERT_TO_VISIT" }
      - { name: recommendation_text, type: string, source: input, description: "Clinical recommendation", constraints: "length >= 20 characters" }
      - { name: on_time, type: boolean, source: computed, description: "responded_at <= consult.sla_due_at (inclusive boundary)" }
      - { name: response_minutes, type: integer, source: computed, description: "Whole minutes from consult.created_at to response created_at" }
      - { name: pcp_note_documented, type: boolean, source: system, description: "PCP chart note written back to referring record", default: false }
      - { name: specialist_note_documented, type: boolean, source: system, description: "Specialist consult note written to specialist record", default: false }
      - { name: documentation_complete, type: boolean, source: computed, description: "pcp_note_documented AND specialist_note_documented", default: false }
      - { name: review_required, type: boolean, source: computed, description: "Snapshot at submission: (membership.standing == PROBATION) OR (disposition == CONVERT_TO_VISIT) OR (on_time == false); never recomputed after create" }
      - { name: last_submitted_at, type: datetime, source: system, description: "Timestamp of most recent transition into SUBMITTED (create or revise)" }
      - { name: revision_count, type: integer, source: system, description: "Number of REBUKED -> SUBMITTED revisions", default: 0 }
      - { name: status, type: enum, source: system, description: "SUBMITTED | FINALIZED | REBUKED" }

  - name: ClarificationMessage
    parent: null
    common_fields: false   # append-only event: id + created_at only
    fields:
      - { name: consult_id, type: string, source: system, description: "FK -> ConsultRequest.id; parent consult (from path)" }
      - { name: author_role, type: enum, source: system, description: "REFERRING_PROVIDER | SPECIALIST; derived from caller role" }
      - { name: body, type: string, source: input, description: "Clarification text", constraints: "non-empty" }
      - { name: sequence_no, type: integer, source: computed, description: "1-based per-consult sequence ordered by created_at" }

  - name: InPersonConversion
    parent: null
    common_fields: true
    fields:
      - { name: consult_id, type: string, source: system, description: "FK -> ConsultRequest.id; parent consult (from path); unique — at most one conversion per consult" }
      - { name: specialist_id, type: string, source: system, description: "FK -> Specialist.id; converting specialist (from X-User-ID)" }
      - { name: appointment_start, type: datetime, source: input, description: "In-person appointment start (inclusive)" }
      - { name: appointment_end, type: datetime, source: input, description: "In-person appointment end (exclusive)", constraints: "must be > appointment_start" }
      - { name: status, type: enum, source: system, description: "SCHEDULED | COMPLETED | CANCELLED" }

  - name: QualityReview
    parent: null
    common_fields: true
    fields:
      - { name: response_id, type: string, source: input, description: "FK -> ConsultResponse.id; the response under review" }
      - { name: reviewer_specialist_id, type: string, source: system, description: "FK -> Specialist.id; reviewer, from X-User-ID; MUST differ from response.specialist_id (segregation of duties)" }
      - { name: timeliness_score, type: integer, source: input, description: "1..5 timeliness score (set at complete)" }
      - { name: appropriateness_score, type: integer, source: input, description: "1..5 appropriateness score (set at complete)" }
      - { name: clarity_score, type: integer, source: input, description: "1..5 clarity score (set at complete)" }
      - { name: composite_score_bps, type: integer, source: computed, description: "round_half_up((appropriateness*50 + timeliness*25 + clarity*25) / 5) * 100" }
      - { name: verdict, type: enum, source: input, description: "PASS | REBUKE; MUST equal the computed band: composite >= 6000 requires PASS, composite < 6000 requires REBUKE" }
      - { name: status, type: enum, source: system, description: "PENDING | COMPLETED" }

  - name: CompensationEntry
    parent: null
    common_fields: true
    fields:
      - { name: membership_id, type: string, source: system, description: "FK -> PanelMembership.id; earning membership" }
      - { name: consult_id, type: string, source: system, description: "FK -> ConsultRequest.id; originating consult" }
      - { name: entry_type, type: enum, source: system, description: "RESPONSE_FEE | CLARIFICATION_FEE" }
      - { name: amount_cents, type: integer, source: computed, description: "Signed amount; provisional base at create, recomputed to final at POSTED for RESPONSE_FEE" }
      - { name: posture, type: enum, source: system, description: "PROVISIONAL | POSTED | REVERSED" }
      - { name: period_key, type: string, source: computed, description: "YYYY-MM of created_at" }

  - name: SpecialistAvailabilityWindow
    parent: null
    common_fields: true
    fields:
      - { name: membership_id, type: string, source: input, description: "FK -> PanelMembership.id; on-call membership" }
      - { name: window_start, type: datetime, source: input, description: "Window start (inclusive)" }
      - { name: window_end, type: datetime, source: input, description: "Window end (exclusive); half-open semantics", constraints: "must be > window_start" }
      - { name: status, type: enum, source: system, description: "ACTIVE | CANCELLED" }

  - name: BillingClaim
    parent: null
    common_fields: true
    fields:
      - { name: consult_id, type: string, source: system, description: "FK -> ConsultRequest.id; parent consult (from path); unique — at most one claim per consult" }
      - { name: claim_code, type: string, source: computed, description: "ECONSULT-{RUT|URG}-{ANSW|CONV} from consult urgency and response disposition" }
      - { name: amount_cents, type: integer, source: computed, description: "professional component + documentation add-on; per-component round_half_up then sum (pinned order)" }
      - { name: period_key, type: string, source: computed, description: "YYYY-MM of created_at (cap accounting period)" }
      - { name: status, type: enum, source: system, description: "DRAFT | SUBMITTED | PAID | DENIED | VOID" }

  - name: AvoidedVisitMeasurement
    parent: null
    common_fields: true
    fields:
      - { name: specialty_track_id, type: string, source: input, description: "FK -> SpecialtyTrack.id; measured track" }
      - { name: period_key, type: string, source: input, description: "Calendar month YYYY-MM; consults counted by created_at in that month", constraints: "format YYYY-MM; unique per (specialty_track_id, period_key)" }
      - { name: responded_count, type: integer, source: computed, description: "Consults for the track created in period with status ANSWERED or CLOSED" }
      - { name: conversions_count, type: integer, source: computed, description: "Of those, consults having an InPersonConversion with status SCHEDULED or COMPLETED" }
      - { name: avoided_attributed_count, type: integer, source: computed, description: "Variant ATTRIBUTED: responded_count - conversions_count" }
      - { name: avoided_conservative_count, type: integer, source: computed, description: "Variant CONSERVATIVE: consults CLOSED whose latest response disposition == MANAGE_IN_PRIMARY_CARE AND no InPersonConversion exists in any status" }
      - { name: status, type: enum, source: system, description: "OPEN | FINALIZED" }

  - name: RoutingDecision
    parent: null
    common_fields: false   # append-only audit log
    fields:
      - { name: consult_id, type: string, source: system, description: "FK -> ConsultRequest.id; consult that was routed" }
      - { name: outcome, type: enum, source: system, description: "ASSIGNED | QUEUED" }
      - { name: candidate_count, type: integer, source: system, description: "Size of the eligible pool at decision time" }
      - { name: selected_membership_id, type: string, source: system, description: "Winning membership id; null when QUEUED" }
      - { name: ranking_basis, type: string, source: system, description: "Human-readable ranking record, e.g. 'open_consult_count ASC, quality_score_bps DESC, created_at ASC' or 'SPECIALIST_SUSPENDED'" }

# =============================================================================
# 1.2 State Machine Table
# =============================================================================
state_machines:
  - entity: ConsultRequest
    initial_state: SUBMITTED
    terminal_states: [CLOSED, EXPIRED, CANCELLED]
    transitions:
      - from: SUBMITTED
        to: ASSIGNED
        trigger: "system (routing selector runs immediately inside POST /econsult/consult-requests when the eligible pool is non-empty)"
        actor: system
        preconditions:
          - "Eligible pool non-empty per calculations.routing_selection"
        side_effects:
          - "assigned_specialist_id / assigned_membership_id set to the selected membership"
          - "sla_due_at computed from track targets and urgency"
          - "RoutingDecision appended (outcome ASSIGNED, candidate_count, selected_membership_id)"
          - "PanelMembership.open_consult_count += 1 (bumps membership updated_at + version)"
          - "ConsultRequest.version incremented"
      - from: SUBMITTED
        to: QUEUED
        trigger: "system (same routing pass, empty eligible pool)"
        actor: system
        preconditions:
          - "Eligible pool empty per calculations.routing_selection"
        side_effects:
          - "RoutingDecision appended (outcome QUEUED, candidate_count 0, selected_membership_id null)"
          - "ConsultRequest.version incremented"
      - from: QUEUED
        to: ASSIGNED
        trigger: "POST /econsult/consult-requests/{id}/reroute"
        actor: ProgramCoordinator
        preconditions:
          - "status == QUEUED (ERR_CONSULT_NOT_QUEUED)"
          - "expected_consult_version matches (ERR_STALE_CONSULT_VERSION)"
          - "Eligible pool non-empty (ERR_NO_ELIGIBLE_SPECIALIST)"
        side_effects:
          - "Same assignment side effects as SUBMITTED -> ASSIGNED (selector, RoutingDecision, open_consult_count += 1)"
          - "ConsultRequest.version incremented"
      - from: ASSIGNED
        to: QUEUED
        trigger: "system (assigned membership's standing transitions to SUSPENDED)"
        actor: system
        preconditions: []
        side_effects:
          - "assigned_specialist_id / assigned_membership_id cleared to null"
          - "PanelMembership.open_consult_count -= 1"
          - "RoutingDecision appended (outcome QUEUED, ranking_basis 'SPECIALIST_SUSPENDED')"
      - from: CLARIFICATION_REQUESTED
        to: QUEUED
        trigger: "system (assigned membership's standing transitions to SUSPENDED)"
        actor: system
        preconditions: []
        side_effects:
          - "assigned_specialist_id / assigned_membership_id cleared to null"
          - "PanelMembership.open_consult_count -= 1"
          - "RoutingDecision appended (outcome QUEUED, ranking_basis 'SPECIALIST_SUSPENDED')"
      - from: ASSIGNED
        to: CLARIFICATION_REQUESTED
        trigger: "POST /econsult/consult-requests/{id}/clarifications as the assigned Specialist"
        actor: Specialist
        preconditions:
          - "status == ASSIGNED (ERR_CONSULT_NOT_ASSIGNED)"
          - "X-User-ID == assigned_specialist_id (ERR_NOT_ASSIGNED_SPECIALIST)"
          - "clarification_rounds < MAX_CLARIFICATION_ROUNDS (2) (ERR_MAX_CLARIFICATION_ROUNDS_REACHED)"
        side_effects:
          - "ClarificationMessage appended (author_role SPECIALIST, sequence_no = prior count + 1)"
          - "clarification_rounds += 1"
          - "ConsultRequest.version incremented"
      - from: CLARIFICATION_REQUESTED
        to: ASSIGNED
        trigger: "POST /econsult/consult-requests/{id}/clarifications as the owning ReferringProvider"
        actor: ReferringProvider
        preconditions:
          - "status == CLARIFICATION_REQUESTED (ERR_CONSULT_NOT_AWAITING_CLARIFICATION)"
          - "X-User-ID == referring_provider_id (ERR_NOT_CONSULT_OWNER)"
        side_effects:
          - "ClarificationMessage appended (author_role REFERRING_PROVIDER, sequence_no = prior count + 1)"
          - "CompensationEntry appended: entry_type CLARIFICATION_FEE, amount_cents = track.clarification_fee_cents, posture PROVISIONAL"
          - "PanelMembership.provisional_balance_cents += track.clarification_fee_cents"
          - "ConsultRequest.version incremented"
      - from: ASSIGNED
        to: ANSWERED
        trigger: "POST /econsult/consult-requests/{id}/responses"
        actor: Specialist
        preconditions:
          - "status == ASSIGNED (ERR_CONSULT_NOT_ASSIGNED; terminal states -> ERR_CONSULT_ALREADY_TERMINAL)"
          - "X-User-ID == assigned_specialist_id (ERR_NOT_ASSIGNED_SPECIALIST)"
          - "membership.standing != SUSPENDED (ERR_MEMBERSHIP_SUSPENDED)"
        side_effects:
          - "ConsultResponse created (status SUBMITTED; on_time, response_minutes, review_required snapshotted)"
          - "CompensationEntry appended: RESPONSE_FEE, amount = provisional base by disposition, posture PROVISIONAL"
          - "PanelMembership: provisional_balance_cents += provisional amount; responded_count += 1; on_time_count += (on_time ? 1 : 0); open_consult_count -= 1"
          - "consult.sla_breached set when on_time == false"
          - "billing_status UNBILLABLE -> PENDING_DOCUMENTATION"
          - "calculations.panel_quality_score_bps recomputed for the membership (may drive standing transition)"
          - "ConsultRequest.version incremented"
      - from: ANSWERED
        to: CLOSED
        trigger: "POST /econsult/consult-requests/{id}/close"
        actor: ReferringProvider
        preconditions:
          - "status == ANSWERED (ERR_CONSULT_NOT_ANSWERED)"
          - "X-User-ID == referring_provider_id (ERR_NOT_CONSULT_OWNER)"
          - "The consult's ConsultResponse.status == FINALIZED (ERR_RESPONSE_NOT_FINALIZED) [cross-entity dependency ConsultRequest -> ConsultResponse]"
        side_effects:
          - "ConsultRequest.version incremented"
      - from: SUBMITTED
        to: CANCELLED
        trigger: "POST /econsult/consult-requests/{id}/cancel"
        actor: ReferringProvider
        preconditions:
          - "status in {SUBMITTED, QUEUED, ASSIGNED, CLARIFICATION_REQUESTED} (terminal states -> ERR_CONSULT_ALREADY_TERMINAL; ANSWERED -> ERR_CONSULT_ALREADY_TERMINAL)"
          - "X-User-ID == referring_provider_id (ERR_NOT_CONSULT_OWNER)"
        side_effects:
          - "If status was ASSIGNED or CLARIFICATION_REQUESTED: PanelMembership.open_consult_count -= 1"
          - "All PROVISIONAL CompensationEntry rows for this consult -> REVERSED; provisional_balance_cents reduced accordingly"
          - "billing_status UNBILLABLE -> VOID"
          - "ConsultRequest.version incremented"
      - from: QUEUED
        to: CANCELLED
        trigger: "POST /econsult/consult-requests/{id}/cancel"
        actor: ReferringProvider
        preconditions:
          - "status in {SUBMITTED, QUEUED, ASSIGNED, CLARIFICATION_REQUESTED}"
          - "X-User-ID == referring_provider_id (ERR_NOT_CONSULT_OWNER)"
        side_effects:
          - "billing_status UNBILLABLE -> VOID"
          - "ConsultRequest.version incremented"
      - from: ASSIGNED
        to: CANCELLED
        trigger: "POST /econsult/consult-requests/{id}/cancel"
        actor: ReferringProvider
        preconditions:
          - "status in {SUBMITTED, QUEUED, ASSIGNED, CLARIFICATION_REQUESTED}"
          - "X-User-ID == referring_provider_id (ERR_NOT_CONSULT_OWNER)"
        side_effects:
          - "PanelMembership.open_consult_count -= 1"
          - "All PROVISIONAL CompensationEntry rows for this consult -> REVERSED"
          - "billing_status UNBILLABLE -> VOID"
          - "ConsultRequest.version incremented"
      - from: CLARIFICATION_REQUESTED
        to: CANCELLED
        trigger: "POST /econsult/consult-requests/{id}/cancel"
        actor: ReferringProvider
        preconditions:
          - "status in {SUBMITTED, QUEUED, ASSIGNED, CLARIFICATION_REQUESTED}"
          - "X-User-ID == referring_provider_id (ERR_NOT_CONSULT_OWNER)"
        side_effects:
          - "PanelMembership.open_consult_count -= 1"
          - "All PROVISIONAL CompensationEntry rows for this consult -> REVERSED (includes CLARIFICATION_FEE rows)"
          - "billing_status UNBILLABLE -> VOID"
          - "ConsultRequest.version incremented"
      - from: ASSIGNED
        to: EXPIRED
        trigger: "system (inside POST /econsult/_clock/set_current_utc sweep: now > sla_due_at + EXPIRY_GRACE_HOURS, strict >)"
        actor: system
        preconditions:
          - "logical clock now strictly greater than sla_due_at + 24h"
        side_effects:
          - "sla_breached = true"
          - "PanelMembership.expired_count += 1; open_consult_count -= 1"
          - "billing_status UNBILLABLE -> VOID"
          - "ConsultRequest.version incremented"
      - from: CLARIFICATION_REQUESTED
        to: EXPIRED
        trigger: "system (clock sweep, same rule as ASSIGNED -> EXPIRED)"
        actor: system
        preconditions:
          - "logical clock now strictly greater than sla_due_at + 24h"
        side_effects:
          - "sla_breached = true"
          - "PanelMembership.expired_count += 1; open_consult_count -= 1"
          - "All PROVISIONAL CompensationEntry rows for this consult -> REVERSED"
          - "billing_status UNBILLABLE -> VOID"
          - "ConsultRequest.version incremented"
      - from: QUEUED
        to: EXPIRED
        trigger: "system (clock sweep: now > created_at + QUEUE_TTL_HOURS (72), strict >)"
        actor: system
        preconditions:
          - "logical clock now strictly greater than created_at + 72h"
        side_effects:
          - "billing_status UNBILLABLE -> VOID"
          - "ConsultRequest.version incremented"

  - entity: ConsultRequest
    initial_state: UNBILLABLE
    terminal_states: [VOID]
    note: "Parallel billing dimension (field billing_status); evolves independently of status"
    transitions:
      - from: UNBILLABLE
        to: PENDING_DOCUMENTATION
        trigger: "system (ASSIGNED -> ANSWERED on response submit)"
        actor: system
        preconditions: []
        side_effects: []
      - from: PENDING_DOCUMENTATION
        to: CHARGEABLE
        trigger: "system (ConsultResponse SUBMITTED -> FINALIZED)"
        actor: system
        preconditions:
          - "Response finalized (documentation complete and review gate passed)"
        side_effects: []
      - from: CHARGEABLE
        to: CLAIMED
        trigger: "system (BillingClaim DRAFT -> SUBMITTED)"
        actor: system
        preconditions: []
        side_effects: []
      - from: CLAIMED
        to: VOID
        trigger: "system (BillingClaim DENIED -> VOID via write-off)"
        actor: system
        preconditions: []
        side_effects: []
      - from: UNBILLABLE
        to: VOID
        trigger: "system (consult CANCELLED or EXPIRED before any response)"
        actor: system
        preconditions: []
        side_effects: []

  - entity: ConsultResponse
    initial_state: SUBMITTED
    terminal_states: [FINALIZED]
    transitions:
      - from: SUBMITTED
        to: FINALIZED
        trigger: "POST /econsult/consult-responses/{id}/finalize"
        actor: Specialist
        preconditions:
          - "status == SUBMITTED (ERR_RESPONSE_NOT_SUBMITTED)"
          - "X-User-ID == specialist_id (ERR_NOT_ASSIGNED_SPECIALIST)"
          - "documentation_complete == true (ERR_DOCUMENTATION_INCOMPLETE)"
          - "If review_required == true: a COMPLETED QualityReview with verdict PASS whose created_at >= response.last_submitted_at exists (ERR_REVIEW_REQUIRED_NOT_PASSED)"
        side_effects:
          - "RESPONSE_FEE CompensationEntry for this consult: posture PROVISIONAL -> POSTED and amount_cents recomputed via calculations.final_response_compensation (quality band + late penalty at finalize time)"
          - "All CLARIFICATION_FEE entries for this consult: PROVISIONAL -> POSTED (amount unchanged)"
          - "PanelMembership.provisional_balance_cents -= prior provisional amounts; posted_balance_cents += posted amounts"
          - "consult.billing_status PENDING_DOCUMENTATION -> CHARGEABLE"
      - from: SUBMITTED
        to: REBUKED
        trigger: "system (QualityReview PENDING -> COMPLETED with verdict REBUKE on this response)"
        actor: system
        preconditions: []
        side_effects:
          - "All PROVISIONAL CompensationEntry rows for this consult -> REVERSED (provisional_balance_cents reduced)"
          - "PanelMembership.rebuke_count += 1"
          - "calculations.panel_quality_score_bps recomputed (may drive standing transition and its suspension cascade)"
      - from: REBUKED
        to: SUBMITTED
        trigger: "POST /econsult/consult-responses/{id}/revise"
        actor: Specialist
        preconditions:
          - "status == REBUKED (ERR_RESPONSE_NOT_REBUKED)"
          - "X-User-ID == specialist_id (ERR_NOT_ASSIGNED_SPECIALIST)"
        side_effects:
          - "recommendation_text replaced; disposition replaced when provided"
          - "revision_count += 1; last_submitted_at = now"
          - "pcp_note_documented = false; specialist_note_documented = false; documentation_complete = false (both records must be re-documented)"
          - "New PROVISIONAL RESPONSE_FEE entry appended at provisional base (membership.provisional_balance_cents += base)"
          - "consult remains ANSWERED; billing_status remains PENDING_DOCUMENTATION"

  - entity: PanelMembership
    initial_state: GOOD_STANDING
    terminal_states: []
    transitions:
      - from: GOOD_STANDING
        to: PROBATION
        trigger: "system (after panel_quality_score_bps recompute: score < 7000, strict <)"
        actor: system
        preconditions: []
        side_effects: []
      - from: GOOD_STANDING
        to: SUSPENDED
        trigger: "system (after recompute: score < 5000, strict <)"
        actor: system
        preconditions: []
        side_effects:
          - "is_accepting = false"
          - "All consults ASSIGNED or CLARIFICATION_REQUESTED to this membership -> QUEUED (assignment cleared, open_consult_count decremented per consult, RoutingDecision appended per consult)"
      - from: PROBATION
        to: GOOD_STANDING
        trigger: "system (after recompute: score >= 7500)"
        actor: system
        preconditions: []
        side_effects: []
      - from: PROBATION
        to: SUSPENDED
        trigger: "system (after recompute: score < 5000 OR rebuke_count >= 2)"
        actor: system
        preconditions: []
        side_effects:
          - "is_accepting = false"
          - "All consults ASSIGNED or CLARIFICATION_REQUESTED to this membership -> QUEUED (assignment cleared, open_consult_count decremented, RoutingDecision appended)"
      - from: SUSPENDED
        to: PROBATION
        trigger: "POST /econsult/panel-memberships/{id}/reinstate"
        actor: ProgramCoordinator
        preconditions:
          - "standing == SUSPENDED (ERR_MEMBERSHIP_NOT_SUSPENDED)"
        side_effects:
          - "is_accepting = true"

  - entity: QualityReview
    initial_state: PENDING
    terminal_states: [COMPLETED]
    transitions:
      - from: PENDING
        to: COMPLETED
        trigger: "POST /econsult/quality-reviews/{id}/complete"
        actor: QualityReviewer
        preconditions:
          - "status == PENDING (ERR_REVIEW_NOT_PENDING)"
          - "X-User-ID == reviewer_specialist_id (ERR_NOT_REVIEW_OWNER)"
          - "scores each in 1..5 (ERR_INVALID_REQUEST)"
          - "verdict consistent with composite band: composite_score_bps >= 6000 requires PASS, < 6000 requires REBUKE (ERR_VERDICT_SCORE_MISMATCH)"
        side_effects:
          - "composite_score_bps computed"
          - "PanelMembership.reviews_count += 1; reviews_score_sum += composite_score_bps"
          - "If verdict == REBUKE: ConsultResponse SUBMITTED -> REBUKED (cascade: entries REVERSED, rebuke_count += 1)"
          - "calculations.panel_quality_score_bps recomputed (may drive standing transition and suspension cascade)"

  - entity: InPersonConversion
    initial_state: SCHEDULED
    terminal_states: [COMPLETED, CANCELLED]
    transitions:
      - from: SCHEDULED
        to: COMPLETED
        trigger: "POST /econsult/in-person-conversions/{id}/complete"
        actor: Specialist
        preconditions:
          - "status == SCHEDULED (ERR_CONVERSION_NOT_SCHEDULED)"
          - "X-User-ID == specialist_id (ERR_NOT_ASSIGNED_SPECIALIST)"
        side_effects: []
      - from: SCHEDULED
        to: CANCELLED
        trigger: "POST /econsult/in-person-conversions/{id}/cancel"
        actor: Specialist | ReferringProvider
        preconditions:
          - "status == SCHEDULED (ERR_CONVERSION_NOT_SCHEDULED)"
          - "X-User-ID == specialist_id OR X-User-ID == consult.referring_provider_id (ERR_NOT_ASSIGNED_SPECIALIST / ERR_NOT_CONSULT_OWNER)"
        side_effects: []

  - entity: BillingClaim
    initial_state: DRAFT
    terminal_states: [PAID, VOID]
    transitions:
      - from: DRAFT
        to: SUBMITTED
        trigger: "POST /econsult/billing-claims/{id}/submit"
        actor: BillingClerk
        preconditions:
          - "status == DRAFT (ERR_CLAIM_INVALID_STATE)"
          - "consult.billing_status == CHARGEABLE (ERR_CONSULT_NOT_CHARGEABLE) [cross-entity dependency BillingClaim -> ConsultRequest]"
          - "sum(amount_cents of track claims with status SUBMITTED or PAID and same period_key) + amount_cents <= track.monthly_billing_cap_cents (ERR_TRACK_BILLING_CAP_EXCEEDED)"
        side_effects:
          - "consult.billing_status CHARGEABLE -> CLAIMED"
      - from: SUBMITTED
        to: PAID
        trigger: "POST /econsult/billing-claims/{id}/mark-paid"
        actor: BillingClerk
        preconditions:
          - "status == SUBMITTED (ERR_CLAIM_INVALID_STATE)"
        side_effects: []
      - from: SUBMITTED
        to: DENIED
        trigger: "POST /econsult/billing-claims/{id}/deny"
        actor: BillingClerk
        preconditions:
          - "status == SUBMITTED (ERR_CLAIM_INVALID_STATE)"
        side_effects: []
      - from: DENIED
        to: VOID
        trigger: "POST /econsult/billing-claims/{id}/write-off"
        actor: BillingClerk
        preconditions:
          - "status == DENIED (ERR_CLAIM_INVALID_STATE)"
        side_effects:
          - "consult.billing_status CLAIMED -> VOID"

  - entity: SpecialistAvailabilityWindow
    initial_state: ACTIVE
    terminal_states: [CANCELLED]
    transitions:
      - from: ACTIVE
        to: CANCELLED
        trigger: "POST /econsult/specialist-availability-windows/{id}/cancel"
        actor: Specialist
        preconditions:
          - "status == ACTIVE (ERR_WINDOW_NOT_ACTIVE)"
          - "X-User-ID == membership.specialist_id (ERR_NOT_MEMBERSHIP_OWNER)"
        side_effects: []

  - entity: AvoidedVisitMeasurement
    initial_state: OPEN
    terminal_states: [FINALIZED]
    transitions:
      - from: OPEN
        to: FINALIZED
        trigger: "POST /econsult/avoided-visit-measurements/{id}/finalize"
        actor: ProgramCoordinator
        preconditions:
          - "status == OPEN (ERR_MEASUREMENT_ALREADY_FINALIZED)"
        side_effects:
          - "Both variants recomputed at finalize time and frozen"

# =============================================================================
# 1.2.1 Concurrency Rules (OCC on parent version only)
# =============================================================================
concurrency_rules:
  - rule_id: consult-patch-stale-version
    parent_entity: ConsultRequest
    write_endpoint: "PATCH /econsult/consult-requests/{id}"
    occ_field: "expected_consult_version"
    description: |
      Amending a consult's structured question against a version the client no
      longer holds is rejected. The client presents the ConsultRequest.version it
      last observed; if any intervening mutation (a prior amendment, a routing
      event, a clarification, a response, or a cascade) has advanced the version,
      the amendment is stale and rejected with 412.
    error_id: ERR_STALE_CONSULT_VERSION
    http_status: 412
  - rule_id: consult-reroute-stale-version
    parent_entity: ConsultRequest
    write_endpoint: "POST /econsult/consult-requests/{id}/reroute"
    occ_field: "expected_consult_version"
    description: |
      Re-routing a QUEUED consult against a stale observed version is rejected.
      Rerouting a queued consult is legitimate whenever it is queued, so the
      stale-view conflict is resolved by OCC on ConsultRequest.version rather
      than by a state precondition.
    error_id: ERR_STALE_CONSULT_VERSION
    http_status: 412

# =============================================================================
# 1.3 Calculation Rules Table
# =============================================================================
calculations:
  - name: sla_due_at
    trigger: "consult assignment (SUBMITTED->ASSIGNED or QUEUED->ASSIGNED)"
    algorithm: threshold
    formula: |
      sla_due_at = consult.created_at + target_hours
      target_hours = track.urgent_target_hours        if urgency == URGENT
                   = track.response_time_target_hours  if urgency == ROUTINE
      on_time (at response submit) = (response.created_at <= sla_due_at)   # inclusive
    input_set: "the consult and its specialty track"
    precision: "second precision; comparison is <="

  - name: provisional_response_fee
    trigger: "response submission (ASSIGNED -> ANSWERED)"
    algorithm: aggregation
    formula: |
      provisional = track.conversion_response_fee_cents  if disposition == CONVERT_TO_VISIT
                  = track.base_response_fee_cents        otherwise
      No quality multiplier and no late penalty at provisional time.
    input_set: "the new ConsultResponse and the track"
    precision: "integer cents"
    variants:
      - name: provisional
        when: "at response submission"
        difference: "flat disposition base; ignores quality band and lateness"
      - name: posted
        when: "at response finalization (see final_response_compensation)"
        difference: "quality-band multiplier applied and late penalty subtracted; may differ from provisional for identical response data"

  - name: final_response_compensation
    trigger: "response finalize (ConsultResponse SUBMITTED -> FINALIZED)"
    algorithm: tiered_pricing
    formula: |
      base   = track.conversion_response_fee_cents if disposition == CONVERT_TO_VISIT else track.base_response_fee_cents
      band   = quality multiplier from membership.quality_score_bps AT FINALIZE TIME:
                 >= 9000 -> 12000 bps (1.20)
                 7500..8999 -> 10000 bps (1.00)
                 5000..7499 -> 8000 bps (0.80)
                 < 5000 -> 5000 bps (0.50)
      gross  = round_half_up(base * band_bps / 10000)
      penalty = track.late_penalty_cents if response.on_time == false else 0
      final  = max(0, gross - penalty)
    input_set: "the ConsultResponse, its track, and the membership quality_score_bps"
    constants:
      BAND_EXCELLENT_BPS: 12000
      BAND_STANDARD_BPS: 10000
      BAND_REDUCED_BPS: 8000
      BAND_MINIMAL_BPS: 5000
    precision: "integer cents, round_half_up on the product only"
    variants:
      - name: provisional
        when: "response submission"
        difference: "flat base by disposition; no band, no penalty"
      - name: posted
        when: "finalize"
        difference: "band x base minus penalty, floored at 0; identical response data yields a different amount whenever band != 1.00 or response late"

  - name: clarification_fee
    trigger: "provider clarification reply (CLARIFICATION_REQUESTED -> ASSIGNED)"
    algorithm: aggregation
    formula: |
      entry.amount_cents = track.clarification_fee_cents, posture PROVISIONAL.
      At finalize the posture flips to POSTED with the amount unchanged.
    input_set: "the consult's track"
    precision: "integer cents"

  - name: billing_claim_amount
    trigger: "billing claim creation (POST /econsult/consult-requests/{id}/billing-claims)"
    algorithm: tiered_pricing
    formula: |
      # PINNED ROUNDING ORDER: round the professional component FIRST,
      # then compute the documentation add-on FROM THE ROUNDED component,
      # round the add-on, then sum. Computing the add-on from the unrounded
      # component and rounding once at the end yields a different cent value
      # and is NON-CONFORMANT.
      professional = round_half_up(track.base_response_fee_cents * urgency_bps / 10000)
        where urgency_bps = 15000 if consult.urgency == URGENT else 10000
      addon_pct_bps = 1000 (10%) if an InPersonConversion with status SCHEDULED or COMPLETED
                      exists for the consult, else 500 (5%)
      addon = round_half_up(professional * addon_pct_bps / 10000)
      amount_cents = professional + addon
      claim_code = "ECONSULT-" + (urgency == URGENT ? "URG" : "RUT") + "-" + (response.disposition == CONVERT_TO_VISIT ? "CONV" : "ANSW")
    input_set: "the consult, its FINALIZED-or-SUBMITTED response, its track, its conversions"
    precision: "integer cents, round_half_up per component then sum (order pinned)"

  - name: avoided_visit_counts
    trigger: "measurement create and measurement finalize"
    algorithm: aggregation
    formula: |
      Let R = consults of the track with created_at inside [period_start, period_end)
              (period_key YYYY-MM) and status in {ANSWERED, CLOSED}.
      responded_count = |R|
      conversions_count = |{ c in R : exists InPersonConversion for c with status in {SCHEDULED, COMPLETED} }|
      avoided_attributed_count   = responded_count - conversions_count
      avoided_conservative_count = |{ c in R : c.status == CLOSED
                                       AND c's response.disposition == MANAGE_IN_PRIMARY_CARE
                                       AND no InPersonConversion exists for c in any status }|
    input_set: "ConsultRequest by track + created_at month, joined to ConsultResponse and InPersonConversion"
    precision: "integer counts"
    variants:
      - name: attributed
        when: "program-level attribution reporting"
        difference: "every responded consult counts as avoided unless a non-cancelled conversion exists"
      - name: conservative
        when: "audited reporting"
        difference: "only CLOSED consults explicitly managed in primary care with zero conversion records count; identical data yields a strictly smaller-or-equal number"

  - name: panel_quality_score_bps
    trigger: "after any of: response submission (timeliness counters change), quality review completion (review counters change)"
    algorithm: weighted_scoring
    formula: |
      # CIRCULAR-LOOKING DEPENDENCY — EVALUATION ORDER PINNED:
      # standing gates review_required and routing eligibility, which shape the
      # very counters this score blends. The recompute MUST therefore use only
      # persisted counters, applied AFTER the triggering mutation, in this order:
      #   (1) apply the triggering mutation's counter updates
      #   (2) timeliness_component = responded_count == 0 ? 10000
      #                            : round_half_up(10000 * on_time_count / responded_count)
      #   (3) review_component     = reviews_count == 0 ? 8500
      #                            : round_half_up(reviews_score_sum / reviews_count)
      #   (4) quality_score_bps    = round_half_up((6 * review_component + 4 * timeliness_component) / 10)
      #   (5) standing thresholds (evaluated once, in this order):
      #         GOOD_STANDING: score < 5000 -> SUSPENDED; elif score < 7000 -> PROBATION
      #         PROBATION:     score < 5000 or rebuke_count >= 2 -> SUSPENDED;
      #                        elif score >= 7500 -> GOOD_STANDING
      #         SUSPENDED:     no automatic transition
    input_set: "the membership's persisted counters"
    constants:
      DEFAULT_REVIEW_COMPONENT_BPS: 8500
      DEFAULT_TIMELINESS_BPS: 10000
      DEMOTE_BELOW_BPS: 7000
      RECOVER_AT_BPS: 7500
      SUSPEND_BELOW_BPS: 5000
      REBUKE_SUSPEND_COUNT: 2
    precision: "integer bps, round_half_up at each step"

  - name: routing_selection
    trigger: "consult create routing pass; POST /econsult/consult-requests/{id}/reroute"
    algorithm: constraint_propagation
    formula: |
      eligibility(m):
        m.specialty_track_id == consult.specialty_track_id
        AND m.standing == GOOD_STANDING
        AND m.is_accepting == true
        AND m.open_consult_count < MAX_OPEN_CONSULTS
        AND exists SpecialistAvailabilityWindow w with w.membership_id == m.id,
            w.status == ACTIVE, w.window_start <= now < w.window_end   (half-open)
      ranking: open_consult_count ASC, then quality_score_bps DESC, then created_at ASC
      (created_at is the final deterministic tie-break; id MUST NOT be used)
      fallback: pool empty -> consult QUEUED + RoutingDecision(outcome QUEUED) on create;
                on reroute -> ERR_NO_ELIGIBLE_SPECIALIST
    input_set: "all PanelMembership rows joined to their ACTIVE availability windows at logical now"
    constants:
      MAX_OPEN_CONSULTS: 5
    precision: "deterministic; no randomness"

  - name: billing_cap_check
    trigger: "billing claim submit"
    algorithm: threshold
    formula: |
      consumed = sum(amount_cents) over BillingClaim joined via consult to the same track
                 where claim.status in {SUBMITTED, PAID} and claim.period_key == new_claim.period_key
      reject iff consumed + new_claim.amount_cents > track.monthly_billing_cap_cents
      (exactly reaching the cap is ALLOWED: comparison is strict >)
    input_set: "claims of the same track and period in SUBMITTED or PAID status"
    precision: "integer cents"

  - name: availability_overlap_check
    trigger: "availability window create"
    algorithm: interval_merge
    formula: |
      HALF-OPEN semantics: windows occupy [window_start, window_end).
      conflict(new, existing) iff existing.status == ACTIVE AND same membership
        AND new.window_start < existing.window_end AND existing.window_start < new.window_end
      Adjacent windows (new.window_start == existing.window_end) do NOT conflict.
    input_set: "ACTIVE windows of the same membership"

  - name: conversion_overlap_check
    trigger: "conversion create"
    algorithm: interval_merge
    formula: |
      CLOSED-WITH-BUFFER semantics: each scheduled appointment occupies
      [appointment_start - 30min, appointment_end + 30min] inclusive of the buffer.
      conflict(new, existing) iff existing.status == SCHEDULED AND same specialist
        AND new.appointment_start < existing.appointment_end + 30min
        AND existing.appointment_start < new.appointment_end + 30min
      A gap of exactly 30 minutes between end and next start does NOT conflict
      (boundary is excluded by the strict <).
    input_set: "SCHEDULED conversions of the same specialist"
    constants:
      CONVERSION_BUFFER_MINUTES: 30

# =============================================================================
# 1.4 Validation Rules Table (ordered by priority)
# =============================================================================
validations:
  - priority: 1
    category: auth
    check: "X-User-ID and X-User-Role headers present and role is a declared role"
    error_id: ERR_MISSING_OR_INVALID_USER_CONTEXT_HEADER
    http_status: 400
    applies_to: "all"

  - priority: 2
    category: auth
    check: "Caller role is listed in the endpoint's roles"
    error_id: ERR_INSUFFICIENT_PERMISSIONS
    http_status: 403
    applies_to: "all"

  - priority: 2.5
    category: business_constraint
    check: "Request body schema: required fields present, types correct, enum members valid, string lengths honored (question_text / recommendation_text >= 20 chars, scores 1..5, period_key format)"
    error_id: ERR_INVALID_REQUEST
    http_status: 400
    applies_to: "all"

  - priority: 3
    category: existence
    check: "Path and body-referenced resource ids exist, validated left-to-right"
    error_id: ERR_NOT_FOUND
    http_status: 404
    applies_to: "all resource endpoints"

  - priority: 3.5
    category: state
    check: "expected_consult_version equals ConsultRequest.version (OCC)"
    error_id: ERR_STALE_CONSULT_VERSION
    http_status: 412
    applies_to: "PATCH /econsult/consult-requests/{id}; POST /econsult/consult-requests/{id}/reroute"

  - priority: 3.6
    category: auth
    check: "Ownership: provider owns the consult (referring_provider_id == X-User-ID); specialist is the assigned responder / membership owner; reviewer owns the review"
    error_id: "ERR_NOT_CONSULT_OWNER | ERR_NOT_ASSIGNED_SPECIALIST | ERR_NOT_MEMBERSHIP_OWNER | ERR_NOT_REVIEW_OWNER"
    http_status: 403
    applies_to: "owner-scoped endpoints"

  - priority: 4
    category: state
    check: "State preconditions per state machine (from-state, terminal lockdown, cross-entity response FINALIZED / billing CHARGEABLE gates)"
    error_id: "ERR_CONSULT_NOT_QUEUED | ERR_CONSULT_NOT_ASSIGNED | ERR_CONSULT_NOT_AWAITING_CLARIFICATION | ERR_CONSULT_NOT_ANSWERED | ERR_CONSULT_ALREADY_TERMINAL | ERR_RESPONSE_NOT_SUBMITTED | ERR_RESPONSE_NOT_REBUKED | ERR_RESPONSE_NOT_FINALIZED | ERR_REVIEW_NOT_PENDING | ERR_CONVERSION_NOT_SCHEDULED | ERR_CLAIM_INVALID_STATE | ERR_MEASUREMENT_ALREADY_FINALIZED | ERR_WINDOW_NOT_ACTIVE | ERR_MEMBERSHIP_NOT_SUSPENDED | ERR_CONSULT_NOT_CHARGEABLE | ERR_DOCUMENTATION_INCOMPLETE | ERR_REVIEW_REQUIRED_NOT_PASSED"
    http_status: 409
    applies_to: "all action endpoints"

  - priority: 5
    category: business_safety
    check: "Membership standing gate (SUSPENDED blocks response submission and availability creation) and segregation of duties (quality reviewer must not be the responding specialist)"
    error_id: "ERR_MEMBERSHIP_SUSPENDED | ERR_REVIEWER_IS_RESPONDER"
    http_status: 403
    applies_to: "POST responses; POST specialist-availability-windows; POST quality-reviews"

  - priority: 6
    category: business_constraint
    check: "Uniqueness and caps: one non-terminal consult per (patient_ref, track); one membership per (specialist, track); one response per consult; one conversion per consult; one claim per consult; one measurement per (track, period); clarification round cap; verdict must match computed band; conversion create requires response disposition CONVERT_TO_VISIT"
    error_id: "ERR_DUPLICATE_OPEN_CONSULT | ERR_DUPLICATE_MEMBERSHIP | ERR_CONVERSION_ALREADY_EXISTS | ERR_CLAIM_ALREADY_EXISTS | ERR_MEASUREMENT_ALREADY_EXISTS | ERR_MAX_CLARIFICATION_ROUNDS_REACHED | ERR_VERDICT_SCORE_MISMATCH | ERR_DISPOSITION_NOT_CONVERSION"
    http_status: 409
    applies_to: "creation and completion endpoints"

  - priority: 7
    category: business_temporal
    check: "Interval rules: window_end > window_start; appointment_end > appointment_start; half-open availability overlap; buffered conversion overlap; eligibility window coverage"
    error_id: "ERR_WINDOW_INVALID_RANGE | ERR_AVAILABILITY_WINDOW_OVERLAP | ERR_APPOINTMENT_WINDOW_OVERLAP"
    http_status: 409
    applies_to: "window and conversion creation"

  - priority: 8
    category: business_referential
    check: "Referenced actors usable: referring provider ACTIVE at consult create; specialist ACTIVE at membership create; no eligible panel candidate on reroute"
    error_id: "ERR_PROVIDER_INACTIVE | ERR_SPECIALIST_INACTIVE | ERR_NO_ELIGIBLE_SPECIALIST"
    http_status: 409
    applies_to: "POST consult-requests; POST panel-memberships; POST reroute"

  - priority: 9
    category: business_fiscal
    check: "Aggregate fiscal gate: track monthly billing cap on claim submit"
    error_id: ERR_TRACK_BILLING_CAP_EXCEEDED
    http_status: 402
    applies_to: "POST /econsult/billing-claims/{id}/submit"

# =============================================================================
# 1.5 API Endpoint Table
# =============================================================================
endpoints:
  # --- logical clock (test-driving; default 2026-05-01T00:00:00Z) ---
  - method: POST
    path: "/econsult/_clock/set_current_utc"
    description: "Set the logical clock. Server startup default is exactly 2026-05-01T00:00:00Z and MUST NOT fall back to wall-clock. Side effect: runs the expiry sweep (ASSIGNED/CLARIFICATION_REQUESTED past sla_due_at + 24h -> EXPIRED; QUEUED past created_at + 72h -> EXPIRED)."
    roles: [ProgramCoordinator]
    code: 200
    input: [to_iso8601]
    output: null
    side_effects: ["logical clock set", "expiry sweep transitions with their cascades"]

  # --- Specialty tracks ---
  - method: POST
