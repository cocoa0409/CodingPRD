              captures: { err_mismatch: $.data.error_id }
            - call: "POST /playground/placements/${pl_deck_id}/retrofit"
              payload: { replacement_model_id: "${m_deck_id}", quantity: 1 }
              as: DesignConsultant
              as_user_id: "consultant-1"
            - call: "POST /playground/placements/${pl_deck_id}/retrofit"
              payload: { replacement_model_id: "${m_v2_id}", quantity: 4 }
              as: DesignConsultant
              as_user_id: "consultant-1"
          assert:
            - "unrelated model: HTTP 422 and ${err_mismatch} == ERR_RETROFIT_MODEL_MISMATCH (POST-STD-120 is neither the placement's model nor a model whose supersedes_model_id is it)"
            - "own-model replacement part: HTTP 200 with retrofit_model_id == ${m_deck_id}, retrofit_quantity == 1, retrofit_unit_price_cents == 64350, legacy_surcharge_applied == false, retrofit_handling_cents == 3500 (line 64350 < 250000), retrofit_total_cents == 67850"
            - "successor retrofit: HTTP 200 with retrofit_model_id == ${m_v2_id}, retrofit_quantity == 4, retrofit_unit_price_cents == 66950, retrofit_handling_cents == 0 (line 267800 >= 250000), retrofit_total_cents == 267800 - the second retrofit overwrites the first, it does not accumulate"
            - "ComponentPlacement.${pl_deck_id}.component_model_id is STILL ${m_deck_id} and status is still DRAFT: the model swap is conditional on NEEDS_RECERTIFICATION"
            - "PlayArea.${area_id}.critical_fall_height_cm == 122 and required_surfacing_depth_cm == 28 throughout (both models declare deck_height_cm 122)"

      - name: community_vote_batch_endpoint_is_covered_by_the_difficulty_design
        claim_type: bulk_action
        grounds:
          - endpoints[POST /playground/renderings/{id}/community-votes]
          - endpoints[POST /playground/renderings/{id}/close-review]
        distinguishing_aspect: "Votes arrive as batched counts rather than one row per vote, so the batch must accumulate onto the running totals and the close-review gate must read the accumulated pair, not the last batch."
        excluded_because:
          difficulty_instance: community_approval_exactly_sixty_pct_approves_design
          rationale: "That boundary_precision_check instance already posts successive vote batches, blocks close-review at 24 accumulated votes with ERR_INSUFFICIENT_COMMUNITY_INPUT and closes at 26 with exactly 60.0 percent."

      - name: installer_committed_crew_days_read_is_covered_by_the_difficulty_design
        claim_type: computed_read
        grounds:
          - endpoints[GET /playground/installers/{id}]
          - calculations.installer_committed_crew_days
          - entities.CertifiedInstaller.fields.committed_crew_days
        distinguishing_aspect: "The read must expose the aggregate recomputed over the installer's non-excluded jobs, so a cancelled booking must leave committed_crew_days exactly where it started."
        excluded_because:
          difficulty_instance: job_schedule_then_cancel_conserves_installer_committed_crew_days
          rationale: "That compensating_invariant instance already reads committed_crew_days before the booking, after the booking and after the cancellation, asserting the exact crew-day literals each time."

  # =========================================================================
  - section: errors
    instances:
      - name: list_pagination_bounds_are_enforced_at_zero_and_one_hundred_one
        claim_type: violation_to_error
        grounds:
          - validations[priority=26]
          - errors.ERR_INVALID_PAGINATION
          - response_envelope.pagination
          - endpoints[GET /playground/component-models]
        distinguishing_aspect: "limit 0, limit 101 and offset -1 are each 422 while limit 1 and limit 100 are accepted, and the accepted page still reports the unpaginated total_count 3 with has_more derived from offset + returned rows, not from the page size."
        test_recipe:
          setup:
            - "Three ComponentModel rows exist (POST-STD-120, DECK-TDL-122, SLIDE-HD-122); no certification is needed because this claim only exercises the list endpoint."
          setup_api_calls:
            - call: "POST /playground/component-models"
              payload: { sku: "POST-STD-120", category: "POST", age_group: "TODDLER_6_23M", deck_height_cm: 0, use_zone_footprint_cm: 30, color_options: ["CEDAR", "FOREST_GREEN"], unit_price_cents: 10750, hardware_bag_count: 2, warranty_years: 15, parts_support_until_year: 2040 }
              as: ManufacturerAdmin
              as_user_id: "admin-1"
              captures: { m_post_id: $.data.id }
            - call: "POST /playground/component-models"
              payload: { sku: "DECK-TDL-122", category: "DECK", age_group: "TODDLER_6_23M", deck_height_cm: 122, use_zone_footprint_cm: 183, color_options: ["CEDAR", "SKY_BLUE"], unit_price_cents: 64350, hardware_bag_count: 6, warranty_years: 15, parts_support_until_year: 2040, accessible_transfer_ready: true }
              as: ManufacturerAdmin
              as_user_id: "admin-1"
              captures: { m_deck_id: $.data.id }
            - call: "POST /playground/component-models"
              payload: { sku: "SLIDE-HD-122", category: "PLASTIC_SLIDE", age_group: "TODDLER_6_23M", deck_height_cm: 122, use_zone_footprint_cm: 183, color_options: ["CRIMSON", "SKY_BLUE"], unit_price_cents: 44200, hardware_bag_count: 3, warranty_years: 10, parts_support_until_year: 2040 }
              as: ManufacturerAdmin
              as_user_id: "admin-1"
              captures: { m_slide_id: $.data.id }
          trigger:
            - call: "GET /playground/component-models"
              payload: { limit: 0 }
              as: ManufacturerAdmin
              as_user_id: "admin-1"
              captures: { err_limit_low: $.data.error_id }
            - call: "GET /playground/component-models"
              payload: { limit: 101 }
              as: ManufacturerAdmin
              as_user_id: "admin-1"
              captures: { err_limit_high: $.data.error_id }
            - call: "GET /playground/component-models"
              payload: { offset: -1 }
              as: ManufacturerAdmin
              as_user_id: "admin-1"
              captures: { err_offset: $.data.error_id }
            - call: "GET /playground/component-models"
              payload: { limit: 1, offset: 0 }
              as: ManufacturerAdmin
              as_user_id: "admin-1"
            - call: "GET /playground/component-models"
              payload: { limit: 1, offset: 2 }
              as: ManufacturerAdmin
              as_user_id: "admin-1"
            - call: "GET /playground/component-models"
              payload: { limit: 100, offset: 0 }
              as: ManufacturerAdmin
              as_user_id: "admin-1"
          assert:
            - "limit 0: HTTP 422 and ${err_limit_low} == ERR_INVALID_PAGINATION (the declared minimum is 1)"
            - "limit 101: HTTP 422 and ${err_limit_high} == ERR_INVALID_PAGINATION (the declared maximum is 100)"
            - "offset -1: HTTP 422 and ${err_offset} == ERR_INVALID_PAGINATION"
            - "limit 1 offset 0: HTTP 200, len(data) == 1, limit == 1, offset == 0, total_count == 3, has_more == true"
            - "limit 1 offset 2: HTTP 200, len(data) == 1, total_count == 3, has_more == false"
            - "limit 100 offset 0: HTTP 200, len(data) == 3, limit == 100, total_count == 3, has_more == false - the boundary values 1 and 100 are both inside the accepted range"
            - "every successful list response carries response_type == \"array\" plus meta.api_request_id and meta.api_request_timestamp; every 422 carries response_type == \"error\" with data.error_id and data.message"

      - name: unknown_ids_resolve_to_the_owning_entity_not_found_code
