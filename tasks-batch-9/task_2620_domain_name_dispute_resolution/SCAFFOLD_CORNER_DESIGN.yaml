            - call: "POST /udrp/cases/${case_id}/registrar-verifications/${ver_id}/response"
              payload: { lock_applied: true, verified_registrant_name: "Ident Underlying Holder", verified_registrant_email: "registrant@ident.example" }
              as: RegistrarAgent
