            - call: "POST /api/stunt-sequences"
              payload: { production_id: "${p1}", name: "P1 Seq", hazard_class: "FIGHT", risk_category: "MEDIUM", scheduled_execution_start: "2026-08-05T00:00:00Z", scheduled_execution_end: "2026-08-06T00:00:00Z", required_equipment_ids: [] }
              as: StuntCoordinator
              as_user_id: "coord-1"
