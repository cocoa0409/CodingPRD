      - name: consultation_pipeline_is_frozen_at_hold_from_property_occupancy
        claim_type: Computed Fields
        grounds: ["entities.Consultation.fields.pipeline", "state_machines.Consultation.SCHEDULED_to_HELD", "entities.Property.fields.occupancy"]
        distinguishing_aspect: "Holding a consultation on a VACANT property stamps pipeline VACANT_STAGING and held_at with the logical clock; pipeline is a computed field the client cannot supply."
        test_recipe:
          setup: ["A SCHEDULED consultation on a VACANT property, clock at the scheduled instant."]
          setup_api_calls: *listing_ready
          trigger:
            - call: "POST /staging/consultations"
