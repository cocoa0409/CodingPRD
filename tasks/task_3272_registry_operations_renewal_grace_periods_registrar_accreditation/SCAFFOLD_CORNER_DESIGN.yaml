  # ===========================================================================
  - section: calculations
    instances:
      - name: capacity_summary_aggregates_and_flags_below_commitment
        claim_type: Correct Result
        grounds:
          - calculations.capacity_utilization
          - endpoints.GET_/capacity/summary
        distinguishing_aspect: "With two nameservers at 3000 + 4000 qps the summary reports provisioned_qps 7000, utilization_ratio 0.875, status BELOW_COMMITMENT; adding a 2000-qps node flips it to OK at exactly 1.125."
        test_recipe:
          setup:
            - "Two nameservers registered (3000 and 4000 qps)."
          setup_api_calls:
            - call: "POST /registry/nameservers"
              payload: { hostname: "ns1.alpha.example", ip_addresses: ["192.0.2.10"], capacity_qps: 3000 }
              as: RegistryAdmin
            - call: "POST /registry/nameservers"
              payload: { hostname: "ns2.alpha.example", ip_addresses: ["192.0.2.11"], capacity_qps: 4000 }
              as: RegistryAdmin
          trigger:
            - call: "GET /registry/capacity/summary"
              payload: {}
              as: RegistryAdmin
              captures: { prov: $.data.provisioned_qps, status: $.data.status }
            - call: "POST /registry/nameservers"
              payload: { hostname: "ns3.alpha.example", ip_addresses: ["192.0.2.12"], capacity_qps: 2000 }
              as: RegistryAdmin
            - call: "GET /registry/capacity/summary"
              payload: {}
              as: RegistryAdmin
              captures: { prov2: $.data.provisioned_qps, status2: $.data.status }
          assert:
            - "first summary: provisioned_qps == 7000, commitment_qps == 8000, utilization_ratio == 0.875, status == BELOW_COMMITMENT"
            - "second summary: provisioned_qps == 9000, utilization_ratio == 1.125, status == OK"

      - name: nameserver_below_minimum_capacity_rejected
        claim_type: Constants Applied
        grounds:
          - calculations.capacity_utilization
          - errors.ERR_CAPACITY_BELOW_MINIMUM
        distinguishing_aspect: "The MIN_NAMESERVER_QPS 2000 floor is enforced per-node at creation: 1999 is rejected, exactly 2000 is accepted (>= boundary)."
        test_recipe:
          setup:
            - "Empty database."
          setup_api_calls: []
          trigger:
            - call: "POST /registry/nameservers"
              payload: { hostname: "ns-weak.example", ip_addresses: ["198.51.100.1"], capacity_qps: 1999 }
              as: RegistryAdmin
              captures: { err: $.data.error_id }
            - call: "POST /registry/nameservers"
              payload: { hostname: "ns-floor.example", ip_addresses: ["198.51.100.2"], capacity_qps: 2000 }
              as: RegistryAdmin
              captures: { ns_ok: $.data.id }
          assert:
            - "capacity_qps 1999 is rejected 409 ERR_CAPACITY_BELOW_MINIMUM"
            - "capacity_qps 2000 succeeds (201)"

      - name: price_notice_under_180_days_rejected
        claim_type: Input Set Filtering
        grounds:
          - calculations.wholesale_price_cap
          - errors.ERR_PRICE_NOTICE_TOO_SHORT
        distinguishing_aspect: "The 180-day notice constant is enforced at submission: a schedule submitted 2026-01-01T00:00:00Z with effective_on 2026-06-29T00:00:00Z (179 days) fails; effective_on 2026-06-30T00:00:00Z (exactly 180 days) passes."
        test_recipe:
          setup:
            - "Clock 2026-01-01T00:00:00Z. Baseline schedule effective same day."
          setup_api_calls:
            - call: "POST /registry/_clock/set_current_utc"
              payload: { to_iso8601: "2026-01-01T00:00:00Z" }
              as: RegistryAdmin
            - call: "POST /registry/price-schedules"
              payload: { create_fee_cents: 700, renew_fee_cents: 850, restore_fee_cents: 12000, transfer_fee_cents: 700, effective_on: "2026-01-01T00:00:00Z" }
              as: RegistryAdmin
              captures: { s1: $.data.id }
          trigger:
            - call: "POST /registry/price-schedules"
              payload: { create_fee_cents: 710, renew_fee_cents: 850, restore_fee_cents: 12000, transfer_fee_cents: 700, effective_on: "2026-06-29T00:00:00Z", supersedes_schedule_id: "${s1}" }
              as: RegistryAdmin
              captures: { err_short: $.data.error_id }
            - call: "POST /registry/price-schedules"
              payload: { create_fee_cents: 710, renew_fee_cents: 850, restore_fee_cents: 12000, transfer_fee_cents: 700, effective_on: "2026-06-30T00:00:00Z", supersedes_schedule_id: "${s1}" }
              as: RegistryAdmin
              captures: { s2: $.data.id }
          assert:
            - "the 179-day-notice schedule is rejected 409 ERR_PRICE_NOTICE_TOO_SHORT"
            - "the exactly-180-day-notice schedule is accepted 201 with status PROPOSED"

  # ===========================================================================
  - section: validations
    instances:
      - name: auth_header_missing_returns_unauthenticated_before_any_other_check
        claim_type: Priority Ordering
        grounds:
          - validations[priority=1]
          - errors.ERR_UNAUTHENTICATED
        distinguishing_aspect: "A request with no X-User-Role header to a nonexistent path id returns 401 ERR_UNAUTHENTICATED — priority 1 auth beats priority 3 existence (which would have been a 404)."
        test_recipe:
          setup:
            - "Empty database."
          setup_api_calls: []
          trigger:
            - call: "GET /registry/registrars/00000000-0000-4000-8000-000000000000"
              payload: {}
              as: ""
              captures: { err: $.data.error_id }
          assert:
            - "response status 401 and error_id == ERR_UNAUTHENTICATED (not 404 ERR_NOT_FOUND)"

      - name: forbidden_role_beats_not_found_for_hidden_resource
        claim_type: Priority Ordering
        grounds:
          - validations[priority=2]
          - validations[priority=3]
          - errors.ERR_FORBIDDEN
        distinguishing_aspect: "AbuseAnalyst calling POST /registrars/{id}/suspend (a role-gated endpoint) with a nonexistent id gets 403 ERR_FORBIDDEN — authorization (priority 2) precedes existence (priority 3), so the endpoint does not leak resource existence."
        test_recipe:
          setup:
            - "Empty database."
          setup_api_calls: []
          trigger:
            - call: "POST /registry/registrars/00000000-0000-4000-8000-000000000000/suspend"
              payload: {}
              as: AbuseAnalyst
              captures: { err: $.data.error_id }
          assert:
            - "response status 403 and error_id == ERR_FORBIDDEN"

      - name: accreditation_gates_technical_then_financial
        claim_type: Violation → Error
        grounds:
          - validations[priority=10]
          - errors.ERR_TECHNICAL_TEST_FAILED
          - errors.ERR_FINANCIAL_STANDING_UNVERIFIED
        distinguishing_aspect: "A registrar failing both accreditation gates (score 79, financials unverified) receives ERR_TECHNICAL_TEST_FAILED — the technical gate is evaluated first within the fiscal/accreditation cluster; fixing the score surfaces ERR_FINANCIAL_STANDING_UNVERIFIED on the retry."
        test_recipe:
          setup:
            - "Registrar applicant with technical_test_score 79 and financial_statement_verified false."
          setup_api_calls:
            - call: "POST /registry/registrars"
