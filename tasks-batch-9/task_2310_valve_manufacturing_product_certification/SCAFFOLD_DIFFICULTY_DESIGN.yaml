              payload: { test_type: "CRYOGENIC", test_bench_code: "BENCH-2", started_at: "2026-08-01T09:00:00Z", ended_at: "2026-08-01T10:00:00Z", test_pressure_bar: 60.0, hold_seconds: 60, result: "PASS" }
              as: TestTechnician
              as_user_id: "tech-1"
            - call: "POST /valve-mfg/valve-models/${m_id}/actions"
              payload: { action: "RELEASE" }
              as: QualityManager
            - call: "POST /valve-mfg/engineered-orders"
              payload: { order_code: "ETO-7", model_id: "${m_id}", ordered_qty: 4, unit_price_cents: 1250000, customer_credit_limit_cents: 9000000, datasheet_break_torque_nm: 420.0, datasheet_torque_source: "VENDOR_MEASURED", requested_special_services: ["FIRE_SAFE", "CRYOGENIC"], expedite_requested: true }
              as: ProductEngineer
              captures: { o_id: $.data.id }
            - call: "POST /valve-mfg/engineered-orders/${o_id}/review-actions"
              payload: { action: "SUBMIT_REVIEW" }
              as: ProductEngineer
          trigger:
            - call: "POST /valve-mfg/engineered-orders/${o_id}/review-actions"
              payload: { action: "APPROVE" }
              as: QualityManager
          assert:
            - "EngineeredOrder.${o_id}.status == APPROVED"
            - "EngineeredOrder.${o_id}.gross_quoted_cents == 6180840"
            - "EngineeredOrder.${o_id}.net_billable_cents == 6180840"
            - "EngineeredOrder.${o_id}.credit_issued_cents == 0"
            - "EngineeredOrder.${o_id}.pinned_model_id == ${m_id}"
            - "EngineeredOrder.${o_id}.pinned_model_spec_revision == 1"
            - "EngineeredOrder.${o_id}.spec_stale == false"

      - name: documentation_completeness_pinned_two_stage_rounding
        grounds:
          - calculations.documentation_completeness_pct
          - entities.EngineeredOrder.fields.documentation_completeness_pct
          - entities.EngineeredOrder.fields.documents
        distinguishing_aspect: |
          Mode (b) — pinned rounding order: each per-category fraction is rounded to 2dp before the weighted sum,
          so 1 of 7 material test reports contributes 0.14 (not 0.142857…) and the result is exactly 43.50;
          summing unrounded fractions and rounding once at the end would yield 43.57.
        test_recipe:
          setup:
            - "One DRAFT valve model (no release needed — order authoring does not require it)."
            - "One DRAFT engineered order for 7 units with no actuator package anywhere, so ACTUATOR_DATASHEET is not required."
            - "Exactly three documents attached: one MATERIAL_TEST_REPORT, one DIMENSIONAL_REPORT, one NDE_REPORT."
          setup_api_calls:
            - call: "POST /valve-mfg/valve-models"
