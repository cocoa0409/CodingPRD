            - "response.data.findings == [] and response.data.completed_at_utc == null"
            - "GET /arbitration/sales/${sale_id}/post-sale-inspections returns 1 row with program_tier == \"STANDARD\""

      - name: a_seller_scorecard_with_no_sales_reads_all_zeros
        claim_type: computed_read
        grounds:
          - endpoints[GET /arbitration/sellers/{id}/scorecard]
          - calculations.seller_arbitration_rate.formula
        distinguishing_aspect: "With zero sales the rate function short-circuits to 0 bps rather than dividing by zero, and the MIN_SCORECARD_SALES gate keeps the tier at GOOD_STANDING."
        test_recipe:
          setup: ["A freshly registered seller with no sales and no decisions."]
          setup_api_calls:
            - call: "POST /arbitration/sellers"
              payload: { name: "Ridgeline Motors", dealer_license_no: "SL-1001" }
              as: AuctionAdmin
              as_user_id: "admin-01"
              captures: { seller_id: $.data.id }
          trigger:
            - call: "GET /arbitration/sellers/${seller_id}/scorecard"
              payload: {}
              as: SellerRep
              as_user_id: "${seller_id}"
          assert:
            - "HTTP 200, response.data.seller_id == ${seller_id} and response.data.policy_tier == \"GOOD_STANDING\""
            - "response.data.rolling_window_sales_count == 0, rolling_window_upheld_count == 0 and rolling_arbitration_rate_bps == 0"
            - "response.data.lifetime_sales_count == 0, lifetime_upheld_count == 0 and lifetime_arbitration_rate_bps == 0"
            - "response.data.computed_at_utc == \"2026-08-01T00:00:00.000Z\" — the default logical clock"

      # --- corners already covered by §1.8 -----------------------------------
      - name: escalate_is_a_conditional_action_excluded
        claim_type: conditional_action
        grounds:
          - endpoints[POST /arbitration/cases/{id}/escalate]
        excluded_because:
          difficulty_instance: non_linear_state_machine / negotiation_cycle_three_rounds_then_escalation_unlocks
          rationale: "That instance shows escalate refused at round indices 1 and 2 and permitted at 3, which is the conditional-action claim for this endpoint."

  - section: errors
    instances:
      - name: a_blank_user_id_header_returns_unauthenticated
        claim_type: error_triggerable
        grounds:
          - errors[ERR_UNAUTHENTICATED]
          - validations[priority 2 ERR_UNAUTHENTICATED]
        distinguishing_aspect: "An empty-string X-User-ID on an otherwise valid GET returns 401 ERR_UNAUTHENTICATED, which outranks the 404 the unknown-looking path would otherwise produce."
        test_recipe:
          setup: ["One registered seller."]
          setup_api_calls:
            - call: "POST /arbitration/sellers"
