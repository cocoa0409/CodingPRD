  - rule_id: resource_temporal_overlap
    instances:
      - name: return_period_closed_interval_overlap
        grounds:
          - validations[priority=7]
          - state_machines.TaxReturn.DRAFT_to_FILED
          - errors[ERR_PERIOD_OVERLAP]
        distinguishing_aspect: >
          Return periods are treated as closed inclusive intervals: filing [2026-01-15,2026-02-15]
          against an existing [2026-01-01,2026-01-31] return is rejected (day overlap), yet an
          adjacent distinct month [2026-02-01,2026-02-28] files cleanly.
