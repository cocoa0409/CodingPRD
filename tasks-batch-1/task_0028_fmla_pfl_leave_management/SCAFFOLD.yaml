scenario: |
  FMLA/PFL Leave Management: eligibility threshold (12 months/1250 hours),
  intermittent leave, medical certification, FMLA quota, state PFL concurrent,
  benefit continuation, Job Restoration protection.

domain_name: "fmla-pfl-leave"
api_prefix: "/leave"

complexity_profile:
  primary_archetype: "quota_allocation"
  secondary_archetype: "compliance_audit"
  complexity_layers:
    - "rate_threshold_triggers"
    - "temporal_windowing"
    - "cascading_side_effects"
    - "dual_variant_calculation"
    - "derived_field_reconciliation"
    - "optimistic_concurrency"

  entity_topology: "flat"
  state_machine_shape: "branching"
  relationship_patterns:
    - "one_to_many"
    - "cross_aggregate"

  role_model: "peer_roles"
  consistency_model: "immediate"

response_envelope:
  success: |
    { "meta": { "api_request_id": "req_xxx", "api_request_timestamp": "ISO8601" },
      "response_type": "object" | "array", "data": {} }
  error: |
    { "meta": { ... }, "response_type": "error",
      "data": { "error_id": "ERR_XXX", "message": "..." } }
  pagination_fields: ["limit", "offset", "total_count", "has_more"]
  pagination_defaults: { limit: 10, min: 1, max: 100, offset: 0 }

# =============================================================================
# §1.1 Entity-Relationship Table
# =============================================================================
entities:

  - name: Employer
    parent: null
    common_fields: true
    fields:
      - name: legal_name
        type: string
        source: input
        description: "Employer legal name."
      - name: state_code
        type: enum
        source: input
        description: "Two-letter US state where the worksite is located."
        constraints: "One of: CA, NY, NJ, MA, WA, CT, RI, CO, OR, FED (no state PFL)."
      - name: fmla_method
        type: enum
        source: input
        description: "Method used to compute the rolling FMLA 12-week pool."
        constraints: "One of: ROLLING_BACKWARD, CALENDAR_YEAR. Pinned by employer; cannot be changed once employees have used FMLA hours."
        default: "ROLLING_BACKWARD"
      - name: pfl_enabled
        type: boolean
        source: computed
        description: "TRUE iff state_code is in {CA, NY, NJ, MA, WA, CT, RI, CO, OR}. Computed at create and refreshed if state_code changes."
        default: false
      - name: employer_premium_share_pct
        type: number
        source: input
        description: "Employer's share of the monthly health-insurance premium during active employment, expressed as 0.00–1.00."
        constraints: "0.00 <= value <= 1.00; precision 2 decimal places."
      - name: monthly_premium_total_cents
        type: integer
        source: input
        description: "Total monthly health-insurance premium in cents for a single covered employee. Used by BenefitContinuationLedger calculations."
        constraints: ">= 0."

  - name: Employee
    parent: null
    common_fields: true
    fields:
      - name: employer_id
        type: string
        source: input
        description: "FK -> Employer.id; the employer that employs this Employee."
      - name: email
        type: string
        source: input
        description: "Employee work email; case-insensitive unique within an Employer."
      - name: full_name
        type: string
        source: input
        description: "Employee full legal name."
      - name: hire_date
        type: datetime
        source: input
        description: "Employment start date (UTC midnight). Used for the 12-month-of-service eligibility test."
      - name: hours_worked_trailing_12mo
        type: integer
        source: input
        description: "Hours actually worked in the trailing 12 months as of the leave request. Used for the 1250-hour eligibility test."
        constraints: ">= 0."
      - name: home_state_code
        type: enum
        source: input
        description: "Employee work-site state. Drives state PFL applicability."
        constraints: "Same enum as Employer.state_code."
      - name: health_plan_enrolled
        type: boolean
        source: input
        description: "TRUE iff the employee is enrolled in the employer health plan at the moment of leave-case approval. Drives BenefitContinuationLedger creation."
        default: true
      - name: employment_status
        type: enum
        source: computed
        description: "ACTIVE | ON_LEAVE | TERMINATED. Re-derived whenever LeaveCase transitions or admin terminates."
        constraints: "Enum: ACTIVE, ON_LEAVE, TERMINATED."
        default: "ACTIVE"
      - name: job_restoration_deadline
        type: datetime
        source: computed
        description: "While ON_LEAVE, the latest UTC date by which the employer MUST restore the employee to the same/equivalent position. Recomputed on each LeaveInterval recorded; null when no protected leave is active."
        default: null

  - name: HealthcareProvider
    parent: null
    common_fields: true
    fields:
      - name: license_id
        type: string
        source: input
        description: "Provider license identifier; case-insensitive unique."
      - name: full_name
        type: string
        source: input
        description: "Provider full name."
      - name: specialty
        type: string
        source: input
        description: "Free-text specialty label."

  - name: LeaveCase
    parent: null
    common_fields: true
    fields:
      - name: employee_id
        type: string
        source: input
        description: "FK -> Employee.id; the employee taking leave."
      - name: qualifying_reason
        type: enum
        source: input
        description: "FMLA-qualifying reason. Drives whether PFL runs concurrently and whether intermittent leave is permitted."
        constraints: "One of: OWN_SERIOUS_HEALTH_CONDITION, FAMILY_SERIOUS_HEALTH_CONDITION, NEW_CHILD_BONDING, MILITARY_CAREGIVER, QUALIFYING_EXIGENCY."
      - name: leave_type
        type: enum
        source: input
        description: "Leave pattern requested by the employee."
        constraints: "One of: CONTINUOUS, INTERMITTENT, REDUCED_SCHEDULE. INTERMITTENT and REDUCED_SCHEDULE require a medical certification declaring frequency/duration."
      - name: requested_start_at
        type: datetime
        source: input
        description: "UTC instant the requested leave begins."
      - name: requested_end_at
        type: datetime
        source: input
        description: "UTC instant the requested leave is expected to end."
      - name: status
        type: enum
        source: computed
        description: "LeaveCase lifecycle status — see §1.2 state machine."
        constraints: "Enum: SUBMITTED, ELIGIBILITY_PENDING, CERTIFICATION_PENDING, APPROVED, DENIED, ACTIVE, COMPLETED, JOB_RESTORED, JOB_FORFEITED."
        default: "SUBMITTED"
      - name: eligibility_evaluated
        type: boolean
        source: computed
        description: "TRUE once the eligibility calculation has run and stamped the case."
        default: false
      - name: tenure_months_at_request
        type: integer
        source: computed
        description: "Months of service at requested_start_at, floored. Stamped on eligibility evaluation."
        default: null
      - name: hours_at_request
        type: integer
        source: computed
        description: "Snapshot of Employee.hours_worked_trailing_12mo taken at eligibility evaluation."
        default: null
      - name: pfl_concurrent
        type: boolean
        source: computed
        description: "TRUE iff Employer.pfl_enabled AND Employee.home_state_code matches Employer.state_code AND qualifying_reason is in {OWN_SERIOUS_HEALTH_CONDITION, FAMILY_SERIOUS_HEALTH_CONDITION, NEW_CHILD_BONDING}. Pinned at APPROVED; never changes after."
        default: false
      - name: fmla_hours_charged
        type: integer
        source: computed
        description: "Total FMLA hours debited from the employee's FMLA pool by all LeaveIntervals on this case with status RECORDED."
        default: 0
      - name: pfl_hours_charged
        type: integer
        source: computed
        description: "Total PFL hours debited from the employee's state PFL pool by all LeaveIntervals on this case with status RECORDED. Always <= fmla_hours_charged when pfl_concurrent."
        default: 0
      - name: job_restoration_protected
        type: boolean
        source: computed
        description: "TRUE while the case has remaining FMLA quota AND not all intervals are flagged for unprotected exhaustion. Drives Employee.job_restoration_deadline."
        default: false

  - name: CertificationRecord
    parent: null
    common_fields: true
    fields:
      - name: leave_case_id
        type: string
        source: input
        description: "FK -> LeaveCase.id; the case this certification supports."
      - name: provider_id
        type: string
        source: input
        description: "FK -> HealthcareProvider.id; the certifying provider."
      - name: certification_status
        type: enum
        source: computed
        description: "Lifecycle of the certification — see §1.2 state machine."
        constraints: "Enum: PENDING, RECEIVED, INSUFFICIENT, COMPLETE, RECERTIFICATION_REQUESTED."
        default: "PENDING"
      - name: expected_duration_weeks
        type: number
        source: input
        description: "Provider-attested expected duration in weeks. Required for CONTINUOUS leave; cross-checked against requested span."
      - name: intermittent_frequency_per_month
        type: integer
        source: input
        description: "For INTERMITTENT/REDUCED_SCHEDULE: max episodes per month the provider certifies. Required when leave_type is non-CONTINUOUS. Must be >= 1."
        default: null
      - name: intermittent_hours_per_episode
        type: number
        source: input
        description: "For INTERMITTENT/REDUCED_SCHEDULE: max hours per episode. Required when leave_type is non-CONTINUOUS. > 0."
        default: null
      - name: provider_attestation_signed_at
        type: datetime
        source: input
        description: "UTC instant the provider signed the certification."
      - name: received_at
        type: datetime
        source: system
        description: "UTC instant the employer system recorded receipt of the signed certification."
      - name: insufficient_reason
        type: string
        source: input
        description: "When transitioning to INSUFFICIENT, free-text reason. Null otherwise."
        default: null

  - name: LeaveInterval
    parent: null
    common_fields: true
    fields:
      - name: leave_case_id
        type: string
        source: input
        description: "FK -> LeaveCase.id; the case the interval belongs to."
      - name: start_datetime
        type: datetime
        source: input
        description: "UTC start of the interval."
      - name: end_datetime
        type: datetime
        source: input
        description: "UTC end of the interval; exclusive."
      - name: hours_taken
        type: number
        source: input
        description: "Hours actually taken during this interval. Must be > 0 and <= business_hours_between(start, end)."
      - name: fmla_hours_charged
        type: number
        source: computed
        description: "Hours debited to the FMLA pool — see §1.3 fmla_pfl_pool_charge calculation."
        default: 0
      - name: pfl_hours_charged
        type: number
        source: computed
        description: "Hours debited to the PFL pool — see §1.3 fmla_pfl_pool_charge calculation."
        default: 0
      - name: status
        type: enum
        source: computed
        description: "Interval lifecycle — see §1.2."
        constraints: "Enum: RECORDED, REVERSED."
        default: "RECORDED"

  - name: BenefitContinuationLedger
    parent: null
    common_fields: true
    fields:
      - name: employee_id
        type: string
        source: input
        description: "FK -> Employee.id; the employee whose benefit continuation is being tracked."
      - name: leave_case_id
        type: string
        source: input
        description: "FK -> LeaveCase.id; the case during which benefit continuation applies."
      - name: period_start
        type: datetime
        source: input
        description: "UTC start of the billing period (typically calendar month)."
      - name: period_end
        type: datetime
        source: input
        description: "UTC end of the billing period (exclusive)."
      - name: employer_premium_share_cents
        type: integer
        source: computed
        description: "Employer's prorated premium share for the period — see §1.3 benefit_continuation_premium calculation."
        default: 0
      - name: employee_premium_share_cents
        type: integer
        source: computed
        description: "Employee's prorated premium share for the period."
        default: 0
      - name: employee_owes_cents
        type: integer
        source: computed
        description: "Running balance: employee_premium_share_cents minus payments_received_cents on this ledger row."
        default: 0
      - name: payments_received_cents
        type: integer
        source: input
        description: "Cumulative employee payments applied to this ledger period."
        default: 0
      - name: payment_status
        type: enum
        source: computed
        description: "PENDING | PARTIAL | PAID | DELINQUENT (> 30 days past period_end with employee_owes_cents > 0)."
        constraints: "Enum: PENDING, PARTIAL, PAID, DELINQUENT."
        default: "PENDING"

  - name: Notice
    parent: null
    common_fields: true
    fields:
      - name: leave_case_id
        type: string
        source: input
        description: "FK -> LeaveCase.id; the case this notice attaches to."
      - name: notice_type
        type: enum
        source: input
        description: "Statutory notice category."
        constraints: "Enum: ELIGIBILITY_NOTICE, RIGHTS_RESPONSIBILITIES_NOTICE, DESIGNATION_NOTICE, CERTIFICATION_DEMAND, RECERTIFICATION_REQUEST."
      - name: sent_at
        type: datetime
        source: system
        description: "UTC instant the notice was issued."
      - name: response_due_at
        type: datetime
        source: computed
        description: "UTC deadline by which the employee must respond. CERTIFICATION_DEMAND defaults to sent_at + 15 days; RECERTIFICATION_REQUEST defaults to sent_at + 15 days; other types null."
        default: null
      - name: response_received
        type: boolean
        source: computed
        description: "TRUE iff the corresponding CertificationRecord (when notice_type is CERTIFICATION_DEMAND or RECERTIFICATION_REQUEST) reaches RECEIVED before response_due_at."
        default: false

# =============================================================================
# §1.2 State Machine Table
# =============================================================================
state_machines:

  - entity: LeaveCase
    initial_state: SUBMITTED
    terminal_states: [DENIED, JOB_RESTORED, JOB_FORFEITED]
    transitions:
      - from: SUBMITTED
        to: ELIGIBILITY_PENDING
        trigger: "POST /leave/cases (success path: case created)"
        actor: Employee
        preconditions:
          - "Employee.employment_status == ACTIVE"
          - "requested_start_at > now() (no retroactive submission)"
          - "qualifying_reason is one of the enum values"
        side_effects:
          - "Notice(ELIGIBILITY_NOTICE) auto-created with response_due_at = sent_at + 5 days"
          - "Notice(RIGHTS_RESPONSIBILITIES_NOTICE) auto-created"

      - from: ELIGIBILITY_PENDING
        to: CERTIFICATION_PENDING
        trigger: "POST /leave/cases/{id}/evaluate-eligibility"
        actor: HRAdmin
        preconditions:
          - "Employee.hire_date <= requested_start_at - 365 days (12 months of service)"
          - "Employee.hours_worked_trailing_12mo >= 1250"
        side_effects:
          - "LeaveCase.eligibility_evaluated set to true"
          - "LeaveCase.tenure_months_at_request stamped (floor of months between hire_date and requested_start_at)"
          - "LeaveCase.hours_at_request stamped from Employee.hours_worked_trailing_12mo"
          - "Notice(CERTIFICATION_DEMAND) auto-created with response_due_at = sent_at + 15 days (the calculation cert_response_window_days fires)"

      - from: ELIGIBILITY_PENDING
        to: DENIED
        trigger: "POST /leave/cases/{id}/evaluate-eligibility (when thresholds not met)"
        actor: HRAdmin
        preconditions:
          - "Employee.hire_date > requested_start_at - 365 days OR Employee.hours_worked_trailing_12mo < 1250"
        side_effects:
          - "LeaveCase.eligibility_evaluated set to true"
          - "DENIED is terminal — no further transitions"

      - from: CERTIFICATION_PENDING
        to: APPROVED
        trigger: "POST /leave/cases/{id}/approve"
        actor: HRAdmin
        preconditions:
          - "The most-recent CertificationRecord for this case has certification_status == COMPLETE"
          - "Employee.employment_status == ACTIVE (not TERMINATED)"
        side_effects:
          - "LeaveCase.pfl_concurrent computed and stamped (Employer.pfl_enabled AND home_state_code == Employer.state_code AND qualifying_reason in {OWN_SERIOUS_HEALTH_CONDITION, FAMILY_SERIOUS_HEALTH_CONDITION, NEW_CHILD_BONDING}); cascades to side_effect on Employee.job_restoration_deadline"
          - "LeaveCase.job_restoration_protected = true"
          - "Notice(DESIGNATION_NOTICE) auto-created"
          - "If Employee.health_plan_enrolled, an initial BenefitContinuationLedger(period_start = requested_start_at, period_end = requested_start_at + 1 month) row is created with computed shares"

      - from: CERTIFICATION_PENDING
        to: DENIED
        trigger: "POST /leave/cases/{id}/deny"
        actor: HRAdmin
        preconditions:
          - "Either (a) no CertificationRecord reached COMPLETE before the case's certification window expired (now() > Notice(CERTIFICATION_DEMAND).response_due_at AND latest CertificationRecord.certification_status != COMPLETE), OR (b) the case has a CertificationRecord.certification_status == INSUFFICIENT AND no successor CertificationRecord exists"
        side_effects:
          - "DENIED is terminal"

      - from: APPROVED
        to: ACTIVE
        trigger: "POST /leave/intervals (the first LeaveInterval is recorded for this case)"
        actor: HRAdmin
        preconditions:
          - "LeaveCase.status == APPROVED"
          - "now() >= LeaveCase.requested_start_at"
        side_effects:
          - "Employee.employment_status = ON_LEAVE"
          - "Employee.job_restoration_deadline = requested_start_at + 84 days (12 weeks)"
          - "LeaveInterval.fmla_hours_charged / pfl_hours_charged computed via §1.3 fmla_pfl_pool_charge"
          - "LeaveCase.fmla_hours_charged += interval.fmla_hours_charged; LeaveCase.pfl_hours_charged += interval.pfl_hours_charged"

      - from: ACTIVE
        to: ACTIVE
        trigger: "POST /leave/intervals (subsequent intervals)"
        actor: HRAdmin
        preconditions:
          - "No overlap with any existing RECORDED LeaveInterval on the same case (start_datetime < other.end_datetime AND end_datetime > other.start_datetime is forbidden; adjacency allowed where start_datetime == other.end_datetime)"
          - "For INTERMITTENT/REDUCED_SCHEDULE cases: the count of RECORDED intervals in the calendar month containing start_datetime is < CertificationRecord(COMPLETE).intermittent_frequency_per_month; hours_taken <= intermittent_hours_per_episode"
        side_effects:
          - "fmla_hours_charged + pfl_hours_charged debited via §1.3 fmla_pfl_pool_charge"
          - "If cumulative LeaveCase.fmla_hours_charged would cross the 480-hour quota (12 weeks × 40 hours), the excess hours are NOT charged to FMLA — LeaveInterval.fmla_hours_charged is capped at remaining quota and LeaveCase.job_restoration_protected is set false for the case once cumulative fmla_hours_charged == 480"

      - from: ACTIVE
        to: COMPLETED
        trigger: "POST /leave/cases/{id}/complete"
        actor: HRAdmin
        preconditions:
          - "LeaveCase.status == ACTIVE"
          - "At least one LeaveInterval exists with status RECORDED"
        side_effects:
          - "Employee.employment_status = ACTIVE (will further transition to JOB_RESTORED or JOB_FORFEITED depending on protection)"

      - from: COMPLETED
        to: JOB_RESTORED
        trigger: "POST /leave/cases/{id}/restore"
        actor: HRAdmin
        preconditions:
          - "LeaveCase.job_restoration_protected == true"
          - "now() <= Employee.job_restoration_deadline"
        side_effects:
          - "Employee.employment_status = ACTIVE; Employee.job_restoration_deadline = null"
          - "JOB_RESTORED is terminal"

      - from: COMPLETED
        to: JOB_FORFEITED
        trigger: "POST /leave/cases/{id}/forfeit-restoration"
        actor: HRAdmin
        preconditions:
          - "LeaveCase.job_restoration_protected == false OR now() > Employee.job_restoration_deadline"
        side_effects:
          - "Employee.job_restoration_deadline = null"
          - "JOB_FORFEITED is terminal (employee may be lawfully terminated outside this system)"

  - entity: CertificationRecord
    initial_state: PENDING
    terminal_states: [COMPLETE]
    transitions:
      - from: PENDING
        to: RECEIVED
        trigger: "POST /leave/certifications/{id}/receive"
        actor: HRAdmin
        preconditions:
          - "LeaveCase.status == CERTIFICATION_PENDING"
          - "provider_attestation_signed_at is set"
        side_effects:
          - "received_at stamped with now()"

      - from: RECEIVED
        to: COMPLETE
        trigger: "POST /leave/certifications/{id}/mark-complete"
        actor: HRAdmin
        preconditions:
          - "For INTERMITTENT/REDUCED_SCHEDULE: intermittent_frequency_per_month >= 1 AND intermittent_hours_per_episode > 0"
          - "For CONTINUOUS: expected_duration_weeks > 0"
          - "There is no later CertificationRecord on the same case (this is the most recent)"
        side_effects:
          - "Marks this certification as authoritative; LeaveCase becomes eligible for APPROVE transition"

      - from: RECEIVED
        to: INSUFFICIENT
        trigger: "POST /leave/certifications/{id}/mark-insufficient"
        actor: HRAdmin
        preconditions:
          - "insufficient_reason is non-empty"
        side_effects:
          - "Notice(RECERTIFICATION_REQUEST) auto-created on LeaveCase with response_due_at = now() + 15 days"

      - from: COMPLETE
        to: RECERTIFICATION_REQUESTED
        trigger: "POST /leave/cases/{id}/request-recertification (creates a new CertificationRecord that transitions to RECERTIFICATION_REQUESTED on the PREVIOUS record)"
        actor: HRAdmin
        preconditions:
          - "LeaveCase.status in {APPROVED, ACTIVE}"
          - "At least 30 days have passed since the prior COMPLETE certification's received_at"
        side_effects:
          - "A new CertificationRecord (PENDING) is created"
          - "Previous CertificationRecord transitions to RECERTIFICATION_REQUESTED — this is a cycle: COMPLETE -> RECERTIFICATION_REQUESTED, while the new record is in the PENDING -> RECEIVED -> COMPLETE branch"

  - entity: BenefitContinuationLedger
    initial_state: PENDING
    terminal_states: [PAID, DELINQUENT]
    transitions:
      - from: PENDING
        to: PARTIAL
        trigger: "POST /leave/benefit-ledgers/{id}/apply-payment"
        actor: HRAdmin
        preconditions:
          - "0 < payment.amount_cents < employee_premium_share_cents - payments_received_cents"
        side_effects:
          - "payments_received_cents += payment.amount_cents"
          - "employee_owes_cents recomputed"

      - from: PENDING
        to: PAID
        trigger: "POST /leave/benefit-ledgers/{id}/apply-payment (paying the full balance)"
        actor: HRAdmin
        preconditions:
          - "payment.amount_cents == employee_premium_share_cents - payments_received_cents"
        side_effects:
          - "employee_owes_cents = 0"

      - from: PARTIAL
        to: PAID
        trigger: "POST /leave/benefit-ledgers/{id}/apply-payment (paying remaining balance)"
        actor: HRAdmin
        preconditions:
          - "payment.amount_cents == employee_premium_share_cents - payments_received_cents"
        side_effects:
          - "employee_owes_cents = 0"

      - from: PENDING
        to: DELINQUENT
        trigger: "POST /_clock/set_current_utc (auto-transition when now() > period_end + 30 days AND employee_owes_cents > 0)"
        actor: system
        preconditions:
          - "now() > period_end + 30 days"
          - "employee_owes_cents > 0"
        side_effects:
          - "DELINQUENT is terminal for this period; cascades to LeaveCase.job_restoration_protected = false (employer-paid coverage lapses → restoration protection lapses for the period)"

      - from: PARTIAL
        to: DELINQUENT
        trigger: "POST /_clock/set_current_utc (auto-transition when now() > period_end + 30 days AND employee_owes_cents > 0)"
        actor: system
        preconditions:
          - "now() > period_end + 30 days"
          - "employee_owes_cents > 0"
        side_effects:
          - "DELINQUENT is terminal; cascades to LeaveCase.job_restoration_protected = false"

  - entity: LeaveInterval
    initial_state: RECORDED
    terminal_states: [REVERSED]
    transitions:
      - from: RECORDED
        to: REVERSED
        trigger: "POST /leave/intervals/{id}/reverse"
        actor: HRAdmin
        preconditions:
          - "LeaveCase.status == ACTIVE"
          - "Interval was recorded within the last 14 days"
        side_effects:
          - "LeaveCase.fmla_hours_charged -= fmla_hours_charged of this interval"
          - "LeaveCase.pfl_hours_charged -= pfl_hours_charged of this interval"
          - "If cumulative fmla_hours_charged drops below 480 after reversal, LeaveCase.job_restoration_protected is set back to true (compensating invariant: total quota charged == sum of RECORDED interval charges)"

# =============================================================================
# §1.2.1 Concurrency Rules
# =============================================================================
concurrency_rules:
  - rule_id: case-approve-stale-version
    parent_entity: LeaveCase
    write_endpoint: "POST /leave/cases/{id}/approve"
    occ_field: "expected_leave_case_version"
    description: |
      Approving a LeaveCase whose version has advanced since the client last
      observed it is rejected with ERR_STALE_VERSION. This captures the case
      where another HRAdmin has just attached a recertification (which
      legitimately re-opens the certification window and changes which
      CertificationRecord is authoritative); the current writer's view of the
      case is therefore stale and approval against the prior certification
      would be incorrect.
    error_id: ERR_STALE_VERSION
    http_status: 412

  - rule_id: employee-update-stale-version
    parent_entity: Employee
    write_endpoint: "PATCH /leave/employees/{id}/health-enrollment"
    occ_field: "expected_employee_version"
    description: |
      Changing the employee's health_plan_enrolled flag concurrently with
      another writer changing the same flag (e.g., HR records an unenrollment
      while another admin records re-enrollment) is rejected when the second
      writer's expected_employee_version no longer matches the live version.
      Sequential evaluation: writer 1 toggles the flag and bumps version 5 -> 6;
      writer 2 (still holding version 5 in its request) is deterministically
      rejected with ERR_STALE_VERSION.
    error_id: ERR_STALE_VERSION
    http_status: 412

# =============================================================================
# §1.3 Calculation Rules Table
# =============================================================================
calculations:

  - name: fmla_eligibility
    trigger: "POST /leave/cases/{id}/evaluate-eligibility"
    algorithm: threshold
    formula: |
      tenure_months = floor((requested_start_at - employee.hire_date) / 30 days)
      tenure_ok = tenure_months >= 12
      hours_ok  = employee.hours_worked_trailing_12mo >= 1250
      eligible  = tenure_ok AND hours_ok
    input_set: "Employee.hire_date, Employee.hours_worked_trailing_12mo, LeaveCase.requested_start_at"
    constants:
      TENURE_THRESHOLD_MONTHS: 12
      HOURS_THRESHOLD: 1250
      DAYS_PER_MONTH: 30
    precision: "integer (floor of months)"
    variants: []

  - name: fmla_quota_remaining
    trigger: "Pre-flight read for any new LeaveInterval; refreshed after every interval record/reverse"
    algorithm: aggregation
    formula: |
      # Two valid algorithms — Employer.fmla_method picks one and pins it for this Employer:
      #
      # Variant A (ROLLING_BACKWARD):
      #   start_window = requested_start_at - 365 days
      #   charged = sum(LeaveInterval.fmla_hours_charged
      #                 WHERE leave_case.employee_id == employee.id
      #                   AND interval.status == RECORDED
      #                   AND interval.start_datetime >= start_window
      #                   AND interval.start_datetime <  requested_start_at)
      #   remaining = max(0, 480 - charged)
      #
      # Variant B (CALENDAR_YEAR):
      #   year = year_of(requested_start_at)
      #   charged = sum(LeaveInterval.fmla_hours_charged
      #                 WHERE leave_case.employee_id == employee.id
      #                   AND interval.status == RECORDED
      #                   AND year_of(interval.start_datetime) == year)
      #   remaining = max(0, 480 - charged)
      #
      # Tie-break: when an interval straddles the variant boundary (a multi-day
      # interval that begins in one window and ends in another), the entire
      # fmla_hours_charged value is attributed to the window containing
      # interval.start_datetime. This rule is pinned, not the natural-language
      # "split proportionally"; the implementation MUST NOT prorate.
    input_set: "All LeaveInterval rows for the employee with status RECORDED, plus Employer.fmla_method"
    constants:
      ANNUAL_QUOTA_HOURS: 480
      DAYS_PER_YEAR: 365
    precision: "integer hours"
    variants:
      - name: ROLLING_BACKWARD
        when: "Employer.fmla_method == ROLLING_BACKWARD"
        difference: "Window is [requested_start_at - 365 days, requested_start_at); slides with every new request."
      - name: CALENDAR_YEAR
        when: "Employer.fmla_method == CALENDAR_YEAR"
        difference: "Window is the calendar year containing requested_start_at; resets at Jan 1 UTC."

  - name: fmla_pfl_pool_charge
    trigger: "POST /leave/intervals (each new interval)"
    algorithm: waterfall_allocation
    formula: |
      # Charge order: FMLA first, then PFL, with concurrency rule.
      #
      # 1) raw_hours = interval.hours_taken
      #
      # 2) fmla_remaining = max(0, 480 - leave_case.fmla_hours_charged_pre)
      #    fmla_charge   = min(raw_hours, fmla_remaining)
      #
      # 3) If leave_case.pfl_concurrent:
      #       pfl_remaining = max(0, PFL_QUOTA_HOURS[employee.home_state_code] - leave_case.pfl_hours_charged_pre)
      #       # Concurrent: PFL ticks down ALONGSIDE FMLA up to PFL_QUOTA_HOURS
      #       pfl_charge = min(fmla_charge, pfl_remaining)
      #    Else:
      #       pfl_charge = 0
      #
      # 4) unprotected_overflow = raw_hours - fmla_charge
      #    (these hours are taken but DO NOT debit FMLA — the employee is not protected for them;
      #     job_restoration_protected flips to false once total fmla_charged hits 480.)
      #
      # Evaluation order is pinned: FMLA charge computed first, then PFL is derived
      # from the FMLA charge (NOT raw_hours), because PFL only runs concurrently
      # with protected FMLA time. Reversing the order (PFL first, then FMLA) would
      # produce a different charge in the boundary case where PFL_QUOTA_HOURS <
      # 480 AND raw_hours > pfl_remaining.
    input_set: "interval.hours_taken, leave_case.fmla_hours_charged, leave_case.pfl_hours_charged, leave_case.pfl_concurrent, employee.home_state_code"
    constants:
      ANNUAL_QUOTA_HOURS: 480
      PFL_QUOTA_HOURS:
        CA: 320   # 8 weeks
        NY: 480   # 12 weeks
        NJ: 480
        MA: 480
        WA: 480
        CT: 480
        RI: 200
        CO: 480
        OR: 480
        FED: 0
    precision: "1 decimal place (hours), round_half_up at the per-interval level; per-case totals are the sum of per-interval rounded values"
    variants:
      - name: CONCURRENT_DEBIT
        when: "leave_case.pfl_concurrent == true; the canonical approach this scaffold uses."
        difference: "PFL ticks down ALONGSIDE FMLA up to PFL_QUOTA_HOURS — pfl_charge = min(fmla_charge, pfl_remaining). When PFL_QUOTA_HOURS < 480 (e.g., CA = 320), once cumulative pfl_hours_charged hits PFL_QUOTA_HOURS, subsequent FMLA hours still flow but PFL accrues 0. Total time off the job equals max(FMLA used, PFL used) since they run concurrently."
      - name: PFL_FIRST_THEN_FMLA
        when: "An alternative interpretation of 'concurrent' that this scaffold REJECTS."
        difference: "PFL is exhausted before FMLA begins debiting — pfl_charge = min(raw_hours, pfl_remaining), then fmla_charge = min(raw_hours - pfl_charge, fmla_remaining). For identical inputs (raw_hours = 400, CA employee with pfl_remaining = 320, fmla_remaining = 480), CONCURRENT_DEBIT yields fmla_charge=400, pfl_charge=320 whereas PFL_FIRST_THEN_FMLA yields fmla_charge=80, pfl_charge=320 — a different cumulative FMLA balance and a different job_restoration_protected flip point. The scaffold pins CONCURRENT_DEBIT."

  - name: benefit_continuation_premium
    trigger: "POST /leave/cases/{id}/approve (initial period), then monthly while LeaveCase is ACTIVE; recomputed on case completion to prorate the final partial month"
    algorithm: tiered_pricing
    formula: |
      # 1) period_business_days = count of weekdays (Mon-Fri) in [period_start, period_end)
      # 2) leave_business_days  = count of weekdays in
      #       intersect([period_start, period_end), union of all RECORDED LeaveInterval ranges on this case)
      # 3) leave_fraction = leave_business_days / period_business_days
      #    (precision: round_half_up to 4 decimal places at this step ONLY)
      # 4) monthly_total_cents = employer.monthly_premium_total_cents
      #    employer_share_cents = round_half_up(monthly_total_cents * employer.employer_premium_share_pct * leave_fraction)
      #    employee_share_cents = round_half_up(monthly_total_cents * (1 - employer.employer_premium_share_pct) * leave_fraction)
      #
      # Rounding order is pinned: leave_fraction rounded to 4 dp BEFORE multiplication;
      # employer_share and employee_share each rounded to 0 dp (cents) AFTER multiplication.
      # The alternative ordering (multiply then sum then round) produces drift of up to 1 cent
      # per period and is explicitly forbidden.
    input_set: "Employer.monthly_premium_total_cents, Employer.employer_premium_share_pct, period_start, period_end, RECORDED LeaveIntervals on the case"
    constants:
      ROUNDING_INTERMEDIATE_DP: 4
      ROUNDING_OUTPUT_DP: 0
    precision: "integer cents, round_half_up after intermediate 4-dp rounding"
    variants: []

  - name: cert_response_window_days
    trigger: "Whenever a Notice with notice_type in {CERTIFICATION_DEMAND, RECERTIFICATION_REQUEST} is created"
    algorithm: threshold
    formula: |
      response_due_at = sent_at + 15 days
      # Receipt of CertificationRecord with received_at <= response_due_at marks
      # the notice as response_received = true.
    input_set: "Notice.sent_at, CertificationRecord.received_at"
    constants:
      RESPONSE_WINDOW_DAYS: 15
    precision: "integer days"
    variants: []

# =============================================================================
# §1.4 Validation Rules Table (ordered by priority)
# =============================================================================
validations:

  - priority: 1
    category: auth
    check: "X-User-Role and X-User-ID headers present"
    error_id: ERR_UNAUTHENTICATED
    http_status: 401
    applies_to: "all"

  - priority: 2
    category: auth
    check: "X-User-Role is allowed by the endpoint's roles list in §1.5"
    error_id: ERR_FORBIDDEN
    http_status: 403
    applies_to: "all"

  - priority: 3
    category: existence
    check: "Every path id resolves to an existing entity (left-to-right)"
    error_id: ERR_NOT_FOUND
    http_status: 404
    applies_to: "all endpoints with {id} segments"

  - priority: 4
    category: existence
    check: "Every FK in the request body resolves to an existing entity"
    error_id: ERR_REFERENCED_ENTITY_NOT_FOUND
    http_status: 404
    applies_to: "all endpoints whose input contains an *_id field"

  - priority: 5
    category: state
    check: "The target entity is in a state that allows the requested transition (per §1.2)"
    error_id: ERR_INVALID_STATE
    http_status: 409
    applies_to: "all action endpoints"

  - priority: 6
    category: state
    check: "Acting Employee is not TERMINATED"
    error_id: ERR_EMPLOYEE_TERMINATED
    http_status: 409
    applies_to: "POST /leave/cases, POST /leave/cases/{id}/evaluate-eligibility, POST /leave/cases/{id}/approve"

  - priority: 7
    category: business_safety
    check: "When approving a LeaveCase, the most-recent CertificationRecord must be COMPLETE"
    error_id: ERR_CERTIFICATION_INCOMPLETE
    http_status: 409
    applies_to: "POST /leave/cases/{id}/approve"

  - priority: 8
    category: business_safety
    check: "For INTERMITTENT/REDUCED_SCHEDULE leave, the COMPLETE certification must declare intermittent_frequency_per_month >= 1 AND intermittent_hours_per_episode > 0"
    error_id: ERR_INTERMITTENT_CERT_REQUIRED
    http_status: 422
    applies_to: "POST /leave/certifications/{id}/mark-complete"

  - priority: 9
    category: business_referential
    check: "OCC: expected_<parent>_version equals the live <parent>.version (§1.2.1)"
    error_id: ERR_STALE_VERSION
    http_status: 412
    applies_to: "POST /leave/cases/{id}/approve, PATCH /leave/employees/{id}/health-enrollment"

  - priority: 10
    category: business_constraint
    check: "Employee meets BOTH 12-months-of-service AND 1250-hours eligibility thresholds"
    error_id: ERR_INELIGIBLE
    http_status: 422
    applies_to: "POST /leave/cases/{id}/evaluate-eligibility"

  - priority: 11
    category: business_temporal
    check: "LeaveInterval does not overlap any other RECORDED LeaveInterval on the same case (start strictly before other.end AND end strictly after other.start)"
    error_id: ERR_INTERVAL_OVERLAP
    http_status: 409
    applies_to: "POST /leave/intervals"

  - priority: 12
    category: business_temporal
    check: "For INTERMITTENT cases: monthly episode count in the calendar month containing start_datetime, INCLUDING this new interval, must not exceed CertificationRecord.intermittent_frequency_per_month"
    error_id: ERR_INTERMITTENT_FREQUENCY_EXCEEDED
    http_status: 409
    applies_to: "POST /leave/intervals"

  - priority: 13
    category: business_temporal
    check: "For INTERMITTENT cases: hours_taken on a single interval must not exceed CertificationRecord.intermittent_hours_per_episode"
    error_id: ERR_INTERMITTENT_HOURS_EXCEEDED
    http_status: 422
    applies_to: "POST /leave/intervals"

  - priority: 14
    category: business_constraint
    check: "Recertification requested too soon: at least 30 days since prior COMPLETE certification.received_at"
    error_id: ERR_RECERT_TOO_SOON
    http_status: 409
    applies_to: "POST /leave/cases/{id}/request-recertification"

  - priority: 15
    category: business_fiscal
    check: "Benefit-continuation payment.amount_cents > 0 AND <= (employee_premium_share_cents - payments_received_cents)"
    error_id: ERR_INVALID_PAYMENT_AMOUNT
    http_status: 422
    applies_to: "POST /leave/benefit-ledgers/{id}/apply-payment"

  - priority: 16
    category: business_constraint
    check: "Request body well-formed: required fields present and types correct"
    error_id: ERR_INVALID_REQUEST
    http_status: 400
    applies_to: "all"

# =============================================================================
# §1.5 API Endpoint Table
# =============================================================================
endpoints:

  # ---- Employer ----
  - method: POST
    path: "/leave/employers"
    description: "Create an employer profile."
    roles: [PlatformAdmin]
    code: 201
    input: [legal_name, state_code, "fmla_method?", employer_premium_share_pct, monthly_premium_total_cents]
    output: Employer
    side_effects:
      - "pfl_enabled computed from state_code"

  - method: GET
    path: "/leave/employers/{id}"
    description: "Fetch an employer."
    roles: [PlatformAdmin, HRAdmin]
    code: 200
    input: []
    output: Employer
    side_effects: []

  # ---- Employee ----
  - method: POST
    path: "/leave/employees"
    description: "Create an employee record under an employer."
    roles: [HRAdmin]
    code: 201
    input: [employer_id, email, full_name, hire_date, hours_worked_trailing_12mo, home_state_code, "health_plan_enrolled?"]
    output: Employee
    side_effects:
      - "employment_status defaulted to ACTIVE"

  - method: GET
    path: "/leave/employees/{id}"
    description: "Fetch an employee."
    roles: [HRAdmin, Employee]
    code: 200
    input: []
    output: Employee
    side_effects: []

  - method: GET
    path: "/leave/employees"
    description: "List employees. Filter by employer_id."
    roles: [HRAdmin]
    code: 200
    input: ["employer_id?", "limit?", "offset?"]
    output: Employee[]
    side_effects: []

  - method: PATCH
    path: "/leave/employees/{id}/health-enrollment"
    description: "Toggle the employee's health_plan_enrolled flag. OCC-guarded."
    roles: [HRAdmin]
    code: 200
    input: [health_plan_enrolled, expected_employee_version]
    output: Employee
    side_effects:
      - "Employee.health_plan_enrolled updated"
      - "increments Employee.version by 1"

  - method: POST
    path: "/leave/employees/{id}/terminate"
    description: "Mark an employee TERMINATED. Forbidden while ON_LEAVE with active job-restoration protection."
    roles: [HRAdmin]
    code: 200
    input: []
    output: Employee
    side_effects:
      - "Employee.employment_status = TERMINATED if currently ACTIVE; rejected with ERR_INVALID_STATE if ON_LEAVE with job_restoration_protected"

  # ---- HealthcareProvider ----
  - method: POST
    path: "/leave/providers"
    description: "Register a healthcare provider."
    roles: [PlatformAdmin, HRAdmin]
    code: 201
    input: [license_id, full_name, specialty]
    output: HealthcareProvider
    side_effects: []

  - method: GET
    path: "/leave/providers/{id}"
    description: "Fetch a provider."
    roles: [PlatformAdmin, HRAdmin, HealthcareProvider]
    code: 200
    input: []
    output: HealthcareProvider
    side_effects: []

  # ---- LeaveCase ----
  - method: POST
    path: "/leave/cases"
    description: "Employee submits a leave request."
    roles: [Employee, HRAdmin]
    code: 201
    input: [employee_id, qualifying_reason, leave_type, requested_start_at, requested_end_at]
    output: LeaveCase
    side_effects:
      - "Case starts in SUBMITTED then auto-transitions to ELIGIBILITY_PENDING within the same request"
      - "Notice(ELIGIBILITY_NOTICE) and Notice(RIGHTS_RESPONSIBILITIES_NOTICE) auto-created"

  - method: GET
    path: "/leave/cases/{id}"
    description: "Fetch a leave case."
    roles: [HRAdmin, Employee]
    code: 200
    input: []
    output: LeaveCase
    side_effects: []

  - method: GET
    path: "/leave/cases"
    description: "List leave cases, filterable by employee_id."
    roles: [HRAdmin, Employee]
    code: 200
    input: ["employee_id?", "status?", "limit?", "offset?"]
    output: LeaveCase[]
    side_effects: []

  - method: POST
    path: "/leave/cases/{id}/evaluate-eligibility"
    description: "Run the eligibility threshold against the snapshot Employee fields. Stamps tenure_months_at_request, hours_at_request, and either advances to CERTIFICATION_PENDING (issuing a CERTIFICATION_DEMAND notice) or transitions to DENIED."
    roles: [HRAdmin]
    code: 200
    input: []
    output: LeaveCase
    side_effects:
      - "fmla_eligibility calculation runs"
      - "On eligible: Notice(CERTIFICATION_DEMAND) created with response_due_at = sent_at + 15 days"
      - "On ineligible: LeaveCase.status = DENIED"

  - method: POST
    path: "/leave/cases/{id}/approve"
    description: "Approve a LeaveCase once its certification is COMPLETE. OCC-guarded."
    roles: [HRAdmin]
    code: 200
    input: [expected_leave_case_version]
    output: LeaveCase
    side_effects:
      - "pfl_concurrent computed and stamped"
      - "Notice(DESIGNATION_NOTICE) auto-created"
      - "If health_plan_enrolled, initial BenefitContinuationLedger row created via benefit_continuation_premium"
      - "increments LeaveCase.version by 1"

  - method: POST
    path: "/leave/cases/{id}/deny"
    description: "Deny a LeaveCase after a failed/missing certification."
    roles: [HRAdmin]
    code: 200
    input: []
    output: LeaveCase
    side_effects:
      - "Case becomes DENIED (terminal)"

  - method: POST
    path: "/leave/cases/{id}/complete"
    description: "Mark an ACTIVE case complete (employee returns)."
    roles: [HRAdmin]
    code: 200
    input: []
    output: LeaveCase
    side_effects:
      - "Employee.employment_status returns to ACTIVE"

  - method: POST
    path: "/leave/cases/{id}/restore"
    description: "Restore the employee's job after a protected, completed leave."
    roles: [HRAdmin]
    code: 200
    input: []
    output: LeaveCase
    side_effects:
      - "Employee.job_restoration_deadline cleared; LeaveCase becomes JOB_RESTORED"

  - method: POST
    path: "/leave/cases/{id}/forfeit-restoration"
    description: "Mark restoration forfeited when protection has lapsed or deadline passed."
    roles: [HRAdmin]
    code: 200
    input: []
    output: LeaveCase
    side_effects:
      - "LeaveCase becomes JOB_FORFEITED"

  - method: POST
    path: "/leave/cases/{id}/request-recertification"
    description: "Open a new PENDING CertificationRecord on an APPROVED/ACTIVE case."
    roles: [HRAdmin]
    code: 201
    input: []
    output: CertificationRecord
    side_effects:
      - "New CertificationRecord (PENDING) created"
      - "Notice(RECERTIFICATION_REQUEST) created with response_due_at = sent_at + 15 days"
      - "Previous CertificationRecord transitions to RECERTIFICATION_REQUESTED"

  # ---- CertificationRecord ----
  - method: POST
    path: "/leave/certifications"
    description: "Submit a medical certification draft against a case."
    roles: [HealthcareProvider, HRAdmin]
    code: 201
    input: [leave_case_id, provider_id, expected_duration_weeks, "intermittent_frequency_per_month?", "intermittent_hours_per_episode?", provider_attestation_signed_at]
    output: CertificationRecord
    side_effects:
      - "Created in PENDING state"

  - method: GET
    path: "/leave/certifications/{id}"
    description: "Fetch a certification record."
    roles: [HRAdmin, Employee, HealthcareProvider]
    code: 200
    input: []
    output: CertificationRecord
    side_effects: []

  - method: GET
    path: "/leave/certifications"
    description: "List certification records, filterable by leave_case_id or provider_id."
    roles: [HRAdmin, HealthcareProvider]
    code: 200
    input: ["leave_case_id?", "provider_id?", "limit?", "offset?"]
    output: CertificationRecord[]
    side_effects: []

  - method: POST
    path: "/leave/certifications/{id}/receive"
    description: "HR marks a certification as RECEIVED (signed copy in hand)."
    roles: [HRAdmin]
    code: 200
    input: []
    output: CertificationRecord
    side_effects:
      - "received_at stamped"

  - method: POST
    path: "/leave/certifications/{id}/mark-complete"
    description: "HR marks a received certification COMPLETE; unblocks LeaveCase approval."
    roles: [HRAdmin]
    code: 200
    input: []
    output: CertificationRecord
    side_effects:
      - "Validation: intermittent fields required if leave_type is INTERMITTENT/REDUCED_SCHEDULE"

  - method: POST
    path: "/leave/certifications/{id}/mark-insufficient"
    description: "HR marks a received certification INSUFFICIENT; triggers a RECERTIFICATION_REQUEST notice."
    roles: [HRAdmin]
    code: 200
    input: [insufficient_reason]
    output: CertificationRecord
    side_effects:
      - "Notice(RECERTIFICATION_REQUEST) auto-created"

  # ---- LeaveInterval ----
  - method: POST
    path: "/leave/intervals"
    description: "Record a taken leave interval; debits FMLA (and PFL if concurrent)."
    roles: [HRAdmin]
    code: 201
    input: [leave_case_id, start_datetime, end_datetime, hours_taken]
    output: LeaveInterval
    side_effects:
      - "fmla_pfl_pool_charge calculation runs"
      - "LeaveCase.fmla_hours_charged / pfl_hours_charged updated"
      - "If cumulative fmla_hours_charged reaches 480, LeaveCase.job_restoration_protected = false"
      - "On first interval of a case in APPROVED, LeaveCase transitions to ACTIVE and Employee.employment_status = ON_LEAVE"

  - method: GET
    path: "/leave/intervals/{id}"
    description: "Fetch a leave interval."
    roles: [HRAdmin, Employee]
    code: 200
    input: []
    output: LeaveInterval
    side_effects: []

  - method: GET
    path: "/leave/intervals"
    description: "List leave intervals filterable by leave_case_id."
    roles: [HRAdmin, Employee]
    code: 200
    input: ["leave_case_id?", "limit?", "offset?"]
    output: LeaveInterval[]
    side_effects: []

  - method: POST
    path: "/leave/intervals/{id}/reverse"
    description: "Reverse a recorded interval (compensating action). Restores quota and may flip job_restoration_protected back to true."
    roles: [HRAdmin]
    code: 200
    input: []
    output: LeaveInterval
    side_effects:
      - "LeaveCase.fmla_hours_charged / pfl_hours_charged decremented"
      - "If cumulative drops below 480, LeaveCase.job_restoration_protected = true"

  # ---- BenefitContinuationLedger ----
  - method: GET
    path: "/leave/benefit-ledgers/{id}"
    description: "Fetch a benefit-continuation ledger row."
    roles: [HRAdmin, Employee]
    code: 200
    input: []
    output: BenefitContinuationLedger
    side_effects: []

  - method: GET
    path: "/leave/benefit-ledgers"
    description: "List ledger rows. Filterable by employee_id, leave_case_id."
    roles: [HRAdmin, Employee]
    code: 200
    input: ["employee_id?", "leave_case_id?", "limit?", "offset?"]
    output: BenefitContinuationLedger[]
    side_effects: []

  - method: POST
    path: "/leave/benefit-ledgers/{id}/apply-payment"
    description: "Apply an employee payment to the ledger row."
    roles: [HRAdmin]
    code: 200
    input: [amount_cents]
    output: BenefitContinuationLedger
    side_effects:
      - "payments_received_cents += amount_cents; payment_status recomputed"

  # ---- Notices ----
  - method: GET
    path: "/leave/notices/{id}"
    description: "Fetch a notice."
    roles: [HRAdmin, Employee]
    code: 200
    input: []
    output: Notice
    side_effects: []

  - method: GET
    path: "/leave/notices"
    description: "List notices, filterable by leave_case_id."
    roles: [HRAdmin, Employee]
    code: 200
    input: ["leave_case_id?", "notice_type?", "limit?", "offset?"]
    output: Notice[]
    side_effects: []

  # ---- Test-driving endpoints ----
  - method: POST
    path: "/_clock/set_current_utc"
    description: "Set the server clock for deterministic time-dependent tests. Auto-runs the BenefitContinuationLedger.PENDING/PARTIAL -> DELINQUENT transition for any row whose period_end + 30 days has now passed."
    roles: [PlatformAdmin]
    code: 200
    input: [to_iso8601]
    output: "{ current_utc: string, delinquent_ledger_ids: string[] }"
    side_effects:
      - "Server clock advanced"
      - "Any BenefitContinuationLedger row with employee_owes_cents > 0 AND now() > period_end + 30 days transitions to DELINQUENT"
      - "Cascading: each newly-DELINQUENT ledger row sets the corresponding LeaveCase.job_restoration_protected = false (then if Employee.job_restoration_deadline was set, recomputed)"

  - method: POST
    path: "/_intervals/seed-historic"
    description: "Test-driving endpoint: directly seed a LeaveInterval for an employee in a PRIOR rolling-12-month window, bypassing the requested_start_at constraint. Used by tests that need pre-existing FMLA hours to verify quota behavior at boundaries."
    roles: [PlatformAdmin]
    code: 201
    input: [leave_case_id, start_datetime, end_datetime, hours_taken, fmla_hours_charged, pfl_hours_charged]
    output: LeaveInterval
    side_effects:
      - "Bypasses the standard fmla_pfl_pool_charge calculation; fmla_hours_charged / pfl_hours_charged are accepted as direct inputs"
      - "LeaveCase.fmla_hours_charged / pfl_hours_charged increment by the seeded amounts"

# =============================================================================
# §1.6 Error Code Catalog
# =============================================================================
errors:
  - id: ERR_UNAUTHENTICATED
    http: 401
    condition: "X-User-Role or X-User-ID header missing/empty."

  - id: ERR_FORBIDDEN
    http: 403
    condition: "X-User-Role not permitted for this endpoint."

  - id: ERR_NOT_FOUND
    http: 404
    condition: "Path {id} does not resolve to an entity of the expected type."

  - id: ERR_REFERENCED_ENTITY_NOT_FOUND
    http: 404
    condition: "An *_id field in the request body refers to a non-existent entity."

  - id: ERR_INVALID_REQUEST
    http: 400
    condition: "Required field missing, wrong type, malformed JSON, enum value invalid."

  - id: ERR_INVALID_STATE
    http: 409
    condition: "Target entity is not in a state that permits the requested operation per §1.2."

  - id: ERR_EMPLOYEE_TERMINATED
    http: 409
    condition: "Acting on behalf of an Employee whose employment_status is TERMINATED."

  - id: ERR_CERTIFICATION_INCOMPLETE
    http: 409
    condition: "Approve attempted but the most-recent CertificationRecord on the case is not COMPLETE."

  - id: ERR_INTERMITTENT_CERT_REQUIRED
    http: 422
    condition: "mark-complete on a certification whose case is INTERMITTENT/REDUCED_SCHEDULE but lacks intermittent_frequency_per_month >= 1 OR intermittent_hours_per_episode > 0."

  - id: ERR_STALE_VERSION
    http: 412
    condition: "OCC: the supplied expected_<parent>_version does not equal the live parent.version."

  - id: ERR_INELIGIBLE
    http: 422
    condition: "FMLA eligibility evaluation: Employee.hire_date < 12 months OR hours_worked_trailing_12mo < 1250."

  - id: ERR_INTERVAL_OVERLAP
    http: 409
    condition: "A new LeaveInterval overlaps an existing RECORDED interval on the same case (start strictly before other.end AND end strictly after other.start)."

  - id: ERR_INTERMITTENT_FREQUENCY_EXCEEDED
    http: 409
    condition: "Recording an interval would push the monthly episode count past CertificationRecord.intermittent_frequency_per_month."

  - id: ERR_INTERMITTENT_HOURS_EXCEEDED
    http: 422
    condition: "Interval hours_taken exceeds CertificationRecord.intermittent_hours_per_episode."

  - id: ERR_RECERT_TOO_SOON
    http: 409
    condition: "Recertification requested fewer than 30 days after the previous COMPLETE certification.received_at."

  - id: ERR_INVALID_PAYMENT_AMOUNT
    http: 422
    condition: "Benefit-continuation payment.amount_cents <= 0 OR > employee_premium_share_cents - payments_received_cents."

# =============================================================================
# §1.7 RBAC Matrix
# =============================================================================
roles:
  - name: PlatformAdmin
    description: "Operator who sets up employers, providers, and time-travel test fixtures."
    identity: "opaque"
    exclusive_operations:
      - "POST /leave/employers"
      - "POST /_clock/set_current_utc"
      - "POST /_intervals/seed-historic"
    shared_operations:
      - "GET /leave/employers/{id}"
      - "POST /leave/providers"
      - "GET /leave/providers/{id}"

  - name: HRAdmin
    description: "Employer-side HR officer who runs the FMLA/PFL process: eligibility, approval, interval recording, benefit-continuation accounting, recertification."
    identity: "opaque"
    exclusive_operations:
      - "POST /leave/employees"
      - "PATCH /leave/employees/{id}/health-enrollment"
      - "POST /leave/employees/{id}/terminate"
      - "POST /leave/cases/{id}/evaluate-eligibility"
      - "POST /leave/cases/{id}/approve"
      - "POST /leave/cases/{id}/deny"
      - "POST /leave/cases/{id}/complete"
      - "POST /leave/cases/{id}/restore"
      - "POST /leave/cases/{id}/forfeit-restoration"
      - "POST /leave/cases/{id}/request-recertification"
      - "POST /leave/certifications/{id}/receive"
      - "POST /leave/certifications/{id}/mark-complete"
      - "POST /leave/certifications/{id}/mark-insufficient"
      - "POST /leave/intervals"
      - "POST /leave/intervals/{id}/reverse"
      - "POST /leave/benefit-ledgers/{id}/apply-payment"
    shared_operations:
      - "GET /leave/employers/{id}"
      - "GET /leave/employees"
      - "GET /leave/employees/{id}"
      - "POST /leave/providers"
      - "GET /leave/providers/{id}"
      - "POST /leave/cases"
      - "GET /leave/cases"
      - "GET /leave/cases/{id}"
      - "POST /leave/certifications"
      - "GET /leave/certifications"
      - "GET /leave/certifications/{id}"
      - "GET /leave/intervals"
      - "GET /leave/intervals/{id}"
      - "GET /leave/benefit-ledgers"
      - "GET /leave/benefit-ledgers/{id}"
      - "GET /leave/notices"
      - "GET /leave/notices/{id}"

  - name: Employee
    description: "Worker submitting a leave request and viewing their own case."
    identity: "entity_backed:Employee"
    exclusive_operations: []
    shared_operations:
      - "POST /leave/cases"
      - "GET /leave/cases"
      - "GET /leave/cases/{id}"
      - "GET /leave/employees/{id}"
      - "GET /leave/certifications/{id}"
      - "GET /leave/intervals"
      - "GET /leave/intervals/{id}"
      - "GET /leave/benefit-ledgers"
      - "GET /leave/benefit-ledgers/{id}"
      - "GET /leave/notices"
      - "GET /leave/notices/{id}"

  - name: HealthcareProvider
    description: "Treating provider who submits medical certifications."
    identity: "entity_backed:HealthcareProvider"
    exclusive_operations:
      - "POST /leave/certifications"
    shared_operations:
      - "GET /leave/providers/{id}"
      - "GET /leave/certifications"
      - "GET /leave/certifications/{id}"
