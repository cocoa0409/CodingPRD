      - name: cure_referential_beats_temporal
        grounds:
          - validations[priority=7]
          - validations[priority=8]
          - state_machines.CodeViolation.OPEN_to_CURE_IN_PROGRESS
          - errors[ERR_REGISTRATION_REQUIRED]
          - errors[ERR_CURE_DEADLINE_PASSED]
        distinguishing_aspect: |
          Pair business_referential-vs-business_temporal (different category pair
          from the other instance): start-cure on a property with no ACTIVE
          registration AND a cure_deadline already past violates both p7 and p8;
          p7 wins with ERR_REGISTRATION_REQUIRED, not ERR_CURE_DEADLINE_PASSED.
        test_recipe:
          setup:
            - "Property P with NO municipal registration; MAJOR violation cure_deadline 2026-08-10; CODE_CURE work order in ISSUED; clock advanced past deadline to 2026-08-14"
