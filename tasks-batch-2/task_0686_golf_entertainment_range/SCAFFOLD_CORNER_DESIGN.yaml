      - name: sweep_marks_confirmed_unplayed_reservation_no_show
        claim_type: scheduled_actions
        grounds:
          - state_machines.Reservation.CONFIRMED_to_NO_SHOW
          - calculations.NO_SHOW_FEE
          - entities.Reservation.fields.no_show_fee_cents
        distinguishing_aspect: "After clock passes a CONFIRMED reservation's end_utc with no realizing session, sweep_holds marks it NO_SHOW and sets no_show_fee_cents=NO_SHOW_FEE(quote) = 50% of 6800 = 3400."
        test_recipe:
          setup: ["Venue+Bay+Member(PLATINUM wallet 50000). PEAK 60-min reservation confirmed (quote 6800). Clock advanced past end_utc, no session started."]
