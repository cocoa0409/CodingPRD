            - { call: "POST /spirit-store/vendors", payload: { program_id: "${prog}", name: "PrintCo", contact_email: "p@co.com", quotes: [ { design_id: "${des}", unit_cost_cents: 500, min_order_qty: 25, production_days: 10, status: ACTIVE } ] }, as: StoreManager, captures: { ven: $.data.id } }
            - { call: "PATCH /spirit-store/vendors/${ven}", payload: { status: APPROVED }, as: StoreManager }
            - { call: "POST /spirit-store/purchase-orders", payload: { program_id: "${prog}", variant_id: "${var}", vendor_id: "${ven}", qty_ordered: 25 }, as: StoreManager, captures: { po: $.data.id } }
            - { call: "POST /spirit-store/purchase-orders/${po}/submit", payload: {}, as: StoreManager }
            - { call: "POST /spirit-store/purchase-orders/${po}/receive", payload: { qty: 25 }, as: StoreManager }
            - { call: "POST /spirit-store/event-sales", payload: { program_id: "${prog}", name: "Game", register_location: "GYM-R", starts_at: "2026-09-05T14:00:00Z", ends_at: "2026-09-05T16:00:00Z" }, as: StoreManager, captures: { ev: $.data.id } }
            - { call: "POST /spirit-store/event-sales/${ev}/open-drawer", payload: { opening_float_cents: 10000 }, as: StudentCashier, as_user_id: "cashier-01" }
            - { call: "POST /spirit-store/orders", payload: { program_id: "${prog}", channel: EVENT_POS, event_id: "${ev}", customer_user_id: "walkup", payment_method: CASH, lines: [ { variant_id: "${var}", qty: 1 } ] }, as: StudentCashier, as_user_id: "cashier-01", captures: { ord: $.data.id } }
          trigger:
            - { call: "POST /spirit-store/orders/${ord}/refund", payload: { amount_cents: 2501 }, as: Treasurer, captures: { err: $.data.error_id } }
          assert:
            - "err == ERR_REFUND_EXCEEDS_PAID"

      - name: exchange_window_last_day_allowed_day15_rejected
        claim_type: temporal_validation
        grounds: ["validations[priority=9]", "errors[ERR_EXCHANGE_WINDOW_CLOSED]"]
        distinguishing_aspect: "Inclusive boundary: exchange created exactly fulfillment_day + 14 succeeds; +15 rejects. Two orders at the same POS event isolate the boundary."
        test_recipe:
          setup: ["Program ACTIVE (window 14); design APPROVED fee 0; variants M and L price 2500 stocked 25 each; clock 2026-09-05T15:00:00Z; event OPEN; two CARD POS orders (O1, O2) of M qty 1"]
          setup_api_calls:
