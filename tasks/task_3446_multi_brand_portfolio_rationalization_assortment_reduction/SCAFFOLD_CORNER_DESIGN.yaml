            - { call: "POST /portfolio/plants", payload: { name: "P-VA14", quarterly_capacity_units: 1000000 }, as: PortfolioManager, captures: { p_id: $.data.id } }
            - { call: "POST /portfolio/items", payload: { brand_id: "${b_id}", primary_plant_id: "${p_id}", sku_code: "SKU-VA14", annual_units: 4000, unit_net_revenue_cents: 2000, unit_cost_cents: 1700, units_on_hand: 50 }, as: PortfolioManager, captures: { i_id: $.data.id, i_v: $.data.version } }
          trigger:
