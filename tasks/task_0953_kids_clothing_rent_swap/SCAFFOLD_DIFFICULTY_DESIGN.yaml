          TRIGGER = POST /kidswear/trade-in-submissions/{id}/finalize, a different triggering
          transition from the mark-lost cascade and propagating in the opposite money direction.
          Seven caused hops: submission CREDITED -> items CREDITED -> a 6000-cent credit entry
