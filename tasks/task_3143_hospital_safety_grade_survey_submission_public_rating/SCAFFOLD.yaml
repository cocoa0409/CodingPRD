  # --- Test-driving ----------------------------------------------------------
  - method: POST
    path: "/hospital-safety-rating/_clock/set_current_utc"
    description: >
      Test-driving endpoint. Sets the logical clock. The server's startup
      default is exactly 2026-09-01T00:00:00Z and never falls back to real
      wall-clock time.
    roles: [RatingAdmin]
    code: 200
    input: [to_iso8601]
    output: "{ current_utc: string }"
    side_effects:
      - "the logical clock instant becomes to_iso8601"
      - "derived window and embargo fields are re-evaluated on the next read"

