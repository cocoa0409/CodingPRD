# =============================================================================
# §1.8 SCAFFOLD DIFFICULTY DESIGN — Test Targeting Index
# Every instance grounds in SCAFFOLD.yaml §1.1-§1.7. Every numeric assert was
# computed by executing the named §1.3 formula against the pinned setup.
# =============================================================================

scaffold_difficulty_design:
- rule_id: dual_variant_calc
  instances:
  - name: price_binding_uses_cutoff_instant_not_line_creation_instant
    grounds:
    - calculations.price_binding
    - calculations.split_unit_price
    - entities.OrderLine.fields.bound_case_price_cents
    - state_machines.OrderLine.REQUESTED_to_CONFIRMED
    - entities.PriceVersion.fields.effective_from
    distinguishing_aspect: 'This instance is the dual variant on the OrderLine/PriceVersion pricing domain: OAT-25 carries a 12000-cent price effective 2026-04-01 and a 13200-cent price effective 2026-05-20, the line is created at clock 2026-05-05, and the cycle cutoff is 2026-05-25, so the cutoff_bound variant binds 13200 while the rejected add_time_bound variant would bind 12000.'
    test_recipe:
      setup:
      - A May cycle is open with cutoff 2026-05-25T00:00:00Z.
      - OAT-25 has two price versions, 12000 cents from 2026-04-01 and 13200 cents from 2026-05-20.
      - Mara (PLUS) created her 5-unit OAT line at clock 2026-05-05, before the second price took effect, and submitted the order.
      - The clock now reads exactly the cutoff instant.
      setup_api_calls:
      - call: POST /_clock/set_current_utc
        payload:
          to_iso8601: '2026-05-05T00:00:00Z'
        as: ClubAdmin
      - call: POST /routes
        payload:
          code: R-NORTH
          name: North Route
          reefer_slots: 2
          route_minimum_cents: 1000
          max_pallets: 12
        as: ClubAdmin
        captures:
          r_north: $.data.id
      - call: POST /drop-points
        payload:
          route_id: ${r_north}
          name: Depot A
          drop_minimum_cents: 1000
        as: ClubAdmin
        captures:
          d_a: $.data.id
      - call: POST /members
        payload:
          email: cora@coop.test
          full_name: Cora Ord
          home_drop_point_id: ${d_a}
          tier: PRO
        as: ClubAdmin
        captures:
          mc_id: $.data.id
          mc_v: $.data.version
      - call: POST /members/${mc_id}/dues-payments
        payload:
          amount_cents: 18000
          term_years: 1
          expected_member_version: ${mc_v}
        as: ClubAdmin
      - call: POST /drop-points
        payload:
          route_id: ${r_north}
          name: Depot B
          coordinator_member_id: ${mc_id}
          drop_minimum_cents: 1000
        as: ClubAdmin
        captures:
          d_b: $.data.id
      - call: POST /members
        payload:
          email: mara@coop.test
          full_name: Mara Plus
          home_drop_point_id: ${d_b}
          tier: PLUS
        as: ClubAdmin
        captures:
          ma_id: $.data.id
          ma_v: $.data.version
      - call: POST /members/${ma_id}/dues-payments
        payload:
          amount_cents: 9000
          term_years: 1
          expected_member_version: ${ma_v}
        as: ClubAdmin
      - call: POST /members
        payload:
          email: ben@coop.test
          full_name: Ben Basic
          home_drop_point_id: ${d_b}
        as: ClubAdmin
        captures:
          mb_id: $.data.id
          mb_v: $.data.version
      - call: POST /members/${mb_id}/dues-payments
        payload:
          amount_cents: 3000
          term_years: 1
          expected_member_version: ${mb_v}
        as: ClubAdmin
      - call: POST /items
        payload:
          sku: OAT-25
          name: Rolled Oats 25lb
          temp_class: DRY
          case_pack_units: 4
          unit_weight_grams: 1000
          unit_cube_cm3: 3000
          split_allowed: true
          remainder_policy: SHORT_FILL
        as: ClubAdmin
        captures:
          i_oat: $.data.id
      - call: POST /price-versions
        payload:
          item_id: ${i_oat}
          effective_from: '2026-04-01T00:00:00Z'
          case_price_cents: 12000
        as: ClubAdmin
        captures:
          pv_oat_1: $.data.id
      - call: POST /price-versions
        payload:
          item_id: ${i_oat}
          effective_from: '2026-05-20T00:00:00Z'
          case_price_cents: 13200
        as: ClubAdmin
        captures:
          pv_oat_2: $.data.id
      - call: POST /items
        payload:
          sku: BERRY-10
          name: Frozen Berries 10lb
          temp_class: FROZEN
          case_pack_units: 6
          unit_weight_grams: 500
          unit_cube_cm3: 1200
          split_allowed: true
          remainder_policy: ROUND_UP
        as: ClubAdmin
        captures:
          i_berry: $.data.id
      - call: POST /price-versions
        payload:
          item_id: ${i_berry}
          effective_from: '2026-04-01T00:00:00Z'
          case_price_cents: 9000
        as: ClubAdmin
        captures:
          pv_berry: $.data.id
      - call: POST /items
        payload:
          sku: CHEESE-2
          name: Raw Cheddar 2lb
          temp_class: CHILLED
          case_pack_units: 3
          unit_weight_grams: 900
          unit_cube_cm3: 1500
          split_allowed: true
          remainder_policy: DROP
        as: ClubAdmin
        captures:
          i_cheese: $.data.id
      - call: POST /price-versions
