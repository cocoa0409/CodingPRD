# ===========================================================================
# 1.8 Scaffold Difficulty Design (Test Targeting Index)
# Task 2992 — Consumer Device Security Labeling
#
# Nine §0.5 rule ids x 2 differentiated instances = 18 instances.
# Every literal below (scores, fees, penalties, ledger values, instants) was
# computed by executing the pinned formulas in SCAFFOLD.yaml §1.3 against the
# fixture values in the setup chains.
# ===========================================================================
scaffold_difficulty_design:

  # =========================================================================
  # RULE 1 — dual-variant calculations on DIFFERENT entity domains
  #   instance 1: conformance scoring on a ConformanceAssessment (technical)
  #   instance 2: penalty assessment on an EnforcementCase (monetary)
  # =========================================================================
  - rule_id: dual_variant_calc
    instances:
      - name: provisional_vs_verified_conformance_score_on_router_assessment
        grounds:
          - calculations.conformance_score
          - entities.ConformanceAssessment.fields.provisional_overall_score
          - entities.ConformanceAssessment.fields.verified_overall_score
          - entities.ConformanceAssessment.fields.decided_overall_score
          - state_machines.TestEngagement.transitions.SCHEDULED_to_COMPLETED
        distinguishing_aspect: |
          The PROVISIONAL and VERIFIED variants of conformance_score read the SAME five
          CriterionResponse rows and produce 80.80 versus 100.00, because PROVISIONAL pays
          a lab-required criterion only weight * 0.60 while VERIFIED pays it full weight on
          lab_result == PASS; the divergence is exactly 19.20 points on a ConformanceAssessment,
          a technical-conformance subject unrelated to instance 2's monetary penalty subject.
        test_recipe:
          setup:
            - "Logical clock at 2026-08-01T00:00:00Z."
            - "TIER_2 program tier: THIRD_PARTY_TEST route, unverified_weight_factor 0.60, min_overall_score 80.80."
            - "HOME_ROUTER device category is ELIGIBLE and mapped to TIER_2."
            - "Five criteria: AUTH-1 (AUTHENTICATION, weight 60, lab-required), AUTH-2 (AUTHENTICATION, weight 40, no lab), UPD-1 (SOFTWARE_UPDATE, weight 100, lab-required), DATA-1 (DATA_PROTECTION, weight 100, no lab), VDP-1 (VULN_DISCLOSURE, weight 100, no lab)."
            - "One SMALL manufacturer owning one ELIGIBLE router product with support period ending 2030-01-01T00:00:00Z."
            - "One ConformanceAssessment on that product, route THIRD_PARTY_TEST, with all five criteria self-declared conformant, already submitted (status UNDER_REVIEW) so provisional_overall_score is 80.80 and verified_overall_score is still null."
            - "One SCHEDULED TestEngagement of that assessment at an ACCREDITED lab with 240 total bench hours and concurrent_bench_capacity 2."
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-08-01T00:00:00Z" }
              as: ProgramAdministrator
            - call: "POST /labeling/program-tiers"
              payload: { tier_code: "TIER_2", required_route: "THIRD_PARTY_TEST", label_validity_days: 730, min_overall_score: 80.80, unverified_weight_factor: 0.60, issuance_base_fee_cents: 145000, max_deficiency_rounds: 1 }
              as: ProgramAdministrator
              captures: { tier2_id: $.data.id }
            - call: "POST /labeling/device-categories"
              payload: { category_code: "HOME_ROUTER", display_name: "Home Router", eligibility_status: "ELIGIBLE", program_tier_id: "${tier2_id}", min_support_period_days: 1095 }
              as: ProgramAdministrator
              captures: { cat_router_id: $.data.id }
            - call: "POST /labeling/security-criteria"
              payload: { criteria: [ { criterion_code: "AUTH-1", practice_area: "AUTHENTICATION", weight: 60, requires_lab_verification: true, criterion_text: "Unique per-device credentials or forced change at first use" }, { criterion_code: "AUTH-2", practice_area: "AUTHENTICATION", weight: 40, requires_lab_verification: false, criterion_text: "Brute-force resistant authentication with lockout" }, { criterion_code: "UPD-1", practice_area: "SOFTWARE_UPDATE", weight: 100, requires_lab_verification: true, criterion_text: "Signed automatic security updates for the declared support period" }, { criterion_code: "DATA-1", practice_area: "DATA_PROTECTION", weight: 100, requires_lab_verification: false, criterion_text: "Personal data encrypted in transit and at rest" }, { criterion_code: "VDP-1", practice_area: "VULN_DISCLOSURE", weight: 100, requires_lab_verification: false, criterion_text: "Published vulnerability disclosure policy with monitored contact" } ] }
              as: ProgramAdministrator
              captures: { crit_auth1_id: "$.data[0].id", crit_auth2_id: "$.data[1].id", crit_upd1_id: "$.data[2].id", crit_data1_id: "$.data[3].id", crit_vdp1_id: "$.data[4].id" }
            - call: "POST /labeling/manufacturers"
              payload: { legal_name: "Northwind Devices LLC", contact_email: "compliance@northwind.example", enterprise_class: "SMALL", annual_us_revenue_cents: 250000000 }
              as: ProgramAdministrator
              captures: { mfr_small_id: $.data.id }
            - call: "POST /labeling/test-labs"
              payload: { lab_name: "Cascade Security Labs", accreditation_status: "ACCREDITED", total_bench_hours: 240, concurrent_bench_capacity: 2 }
              as: ProgramAdministrator
              captures: { lab_acc_id: $.data.id }
            - call: "POST /labeling/products"
              payload: { manufacturer_id: "${mfr_small_id}", device_category_id: "${cat_router_id}", model_name: "Northwind Router R7", sku: "NW-RTR-R7", firmware_version: "1.0.0", declared_support_period_end: "2030-01-01T00:00:00Z", update_policy_disclosed: true, retail_units_shipped: 40000 }
              as: Manufacturer
              as_user_id: "${mfr_small_id}"
              captures: { prod_router_id: $.data.id, prod_router_v: $.data.version }
            - call: "POST /labeling/products/${prod_router_id}/assessments"
              payload: { expected_product_version: "${prod_router_v}" }
              as: Manufacturer
              as_user_id: "${mfr_small_id}"
              captures: { asmt_router_id: $.data.id }
            - call: "POST /labeling/assessments/${asmt_router_id}/responses"
              payload: { responses: [ { criterion_id: "${crit_auth1_id}", self_declared_conformant: true, evidence_ref: "EV-AUTH1" }, { criterion_id: "${crit_auth2_id}", self_declared_conformant: true, evidence_ref: "EV-AUTH2" }, { criterion_id: "${crit_upd1_id}", self_declared_conformant: true, evidence_ref: "EV-UPD1" }, { criterion_id: "${crit_data1_id}", self_declared_conformant: true, evidence_ref: "EV-DATA1" }, { criterion_id: "${crit_vdp1_id}", self_declared_conformant: true, evidence_ref: "EV-VDP1" } ] }
              as: Manufacturer
              as_user_id: "${mfr_small_id}"
            - call: "POST /labeling/assessments/${asmt_router_id}/submit"
              payload: {}
              as: Manufacturer
              as_user_id: "${mfr_small_id}"
            - call: "POST /labeling/test-engagements"
              payload: { assessment_id: "${asmt_router_id}", test_lab_id: "${lab_acc_id}", window_start: "2026-09-01T00:00:00Z", window_end: "2026-09-03T00:00:00Z", bench_hours: 48 }
              as: Manufacturer
              as_user_id: "${mfr_small_id}"
              captures: { eng_router_id: $.data.id }
          trigger:
            - call: "POST /labeling/test-engagements/${eng_router_id}/report"
              payload: { failed_criterion_codes: [], report_reference: "RPT-R7-0001" }
              as: TestLabOperator
              as_user_id: "${lab_acc_id}"
          assert:
            - "ConformanceAssessment.${asmt_router_id}.provisional_overall_score == 80.80"
            - "ConformanceAssessment.${asmt_router_id}.provisional_area_scores.AUTHENTICATION == 76.00"
            - "ConformanceAssessment.${asmt_router_id}.provisional_area_scores.SOFTWARE_UPDATE == 60.00"
            - "ConformanceAssessment.${asmt_router_id}.provisional_area_scores.DATA_PROTECTION == 100.00"
            - "ConformanceAssessment.${asmt_router_id}.provisional_area_scores.VULN_DISCLOSURE == 100.00"
            - "ConformanceAssessment.${asmt_router_id}.verified_overall_score == 100.00"
            - "ConformanceAssessment.${asmt_router_id}.verified_area_scores.AUTHENTICATION == 100.00"
            - "ConformanceAssessment.${asmt_router_id}.verified_area_scores.SOFTWARE_UPDATE == 100.00"
            - "ConformanceAssessment.${asmt_router_id}.verified_overall_score - ConformanceAssessment.${asmt_router_id}.provisional_overall_score == 19.20"
            - "ConformanceAssessment.${asmt_router_id}.decided_overall_score == 100.00"
            - "ConformanceAssessment.${asmt_router_id}.gate_applied == false"
            - "ConformanceAssessment.${asmt_router_id}.grade == A"
            - "TestEngagement.${eng_router_id}.status == COMPLETED"

      - name: statutory_vs_revenue_linked_penalty_on_two_manufacturer_cases
        grounds:
          - calculations.enforcement_penalty
          - entities.EnforcementCase.fields.penalty_variant
          - entities.EnforcementCase.fields.penalty_cents
          - entities.Manufacturer.fields.enterprise_class
          - state_machines.EnforcementCase.transitions.NOTICE_ISSUED_to_ADJUDICATED_UPHELD
        distinguishing_aspect: |
          Two EnforcementCase rows carrying byte-identical violation_type and violation_line_items
          settle at 35476 cents under STATUTORY_SCHEDULE (SMALL subject, per-unit schedule x channel
          factor) and 3920000 cents under REVENUE_LINKED (LARGE subject, 0.0004 of annual revenue,
          line items ignored); the variant is selected by Manufacturer.enterprise_class, making the
          subject a monetary-enforcement entity domain distinct from instance 1's assessment scoring.
        test_recipe:
          setup:
            - "Logical clock at 2026-08-01T00:00:00Z."
            - "TIER_1 self-attestation tier (validity 365 days, min_overall_score 80.80, unverified_weight_factor 0.60, base fee 40000, max_deficiency_rounds 2) and an ELIGIBLE SMART_SPEAKER category mapped to it."
            - "The five-criterion catalogue AUTH-1/AUTH-2/UPD-1/DATA-1/VDP-1."
            - "Two manufacturers: Northwind Devices LLC (SMALL, annual_us_revenue_cents 250000000) and Orion Consumer Electronics Inc (LARGE, annual_us_revenue_cents 9800000000); both standing GOOD with upheld_case_count 0."
            - "One PUBLISHED, ACTIVE label grant on Northwind's speaker whose scannable_code exists in the registry, so a reported code resolves and code_matches_registry is true."
            - "Two EnforcementCase rows, one per manufacturer, both violation_type EXPIRED_LABEL_DISPLAY with violation_line_items [ONLINE x7, IN_STORE x3] and both already NOTICE_ISSUED by administrator admin-notice-1."
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-08-01T00:00:00Z" }
              as: ProgramAdministrator
            - call: "POST /labeling/program-tiers"
              payload: { tier_code: "TIER_1", required_route: "SELF_ATTESTATION", label_validity_days: 365, min_overall_score: 80.80, unverified_weight_factor: 0.60, issuance_base_fee_cents: 40000, max_deficiency_rounds: 2 }
              as: ProgramAdministrator
              captures: { tier1_id: $.data.id }
            - call: "POST /labeling/device-categories"
              payload: { category_code: "SMART_SPEAKER", display_name: "Smart Speaker", eligibility_status: "ELIGIBLE", program_tier_id: "${tier1_id}", min_support_period_days: 730 }
              as: ProgramAdministrator
              captures: { cat_speaker_id: $.data.id }
            - call: "POST /labeling/security-criteria"
              payload: { criteria: [ { criterion_code: "AUTH-1", practice_area: "AUTHENTICATION", weight: 60, requires_lab_verification: true, criterion_text: "Unique per-device credentials or forced change at first use" }, { criterion_code: "AUTH-2", practice_area: "AUTHENTICATION", weight: 40, requires_lab_verification: false, criterion_text: "Brute-force resistant authentication with lockout" }, { criterion_code: "UPD-1", practice_area: "SOFTWARE_UPDATE", weight: 100, requires_lab_verification: true, criterion_text: "Signed automatic security updates for the declared support period" }, { criterion_code: "DATA-1", practice_area: "DATA_PROTECTION", weight: 100, requires_lab_verification: false, criterion_text: "Personal data encrypted in transit and at rest" }, { criterion_code: "VDP-1", practice_area: "VULN_DISCLOSURE", weight: 100, requires_lab_verification: false, criterion_text: "Published vulnerability disclosure policy with monitored contact" } ] }
              as: ProgramAdministrator
              captures: { crit_auth1_id: "$.data[0].id", crit_auth2_id: "$.data[1].id", crit_upd1_id: "$.data[2].id", crit_data1_id: "$.data[3].id", crit_vdp1_id: "$.data[4].id" }
            - call: "POST /labeling/manufacturers"
              payload: { legal_name: "Northwind Devices LLC", contact_email: "compliance@northwind.example", enterprise_class: "SMALL", annual_us_revenue_cents: 250000000 }
              as: ProgramAdministrator
              captures: { mfr_small_id: $.data.id }
            - call: "POST /labeling/manufacturers"
              payload: { legal_name: "Orion Consumer Electronics Inc", contact_email: "legal@orion.example", enterprise_class: "LARGE", annual_us_revenue_cents: 9800000000 }
              as: ProgramAdministrator
              captures: { mfr_large_id: $.data.id }
            - call: "POST /labeling/products"
              payload: { manufacturer_id: "${mfr_small_id}", device_category_id: "${cat_speaker_id}", model_name: "Northwind Speaker S1", sku: "NW-SPK-S1", firmware_version: "1.0.0", declared_support_period_end: "2030-01-01T00:00:00Z", update_policy_disclosed: true, retail_units_shipped: 12000 }
              as: Manufacturer
              as_user_id: "${mfr_small_id}"
              captures: { prod_speaker_id: $.data.id, prod_speaker_v: $.data.version }
            - call: "POST /labeling/products/${prod_speaker_id}/assessments"
              payload: { expected_product_version: "${prod_speaker_v}" }
              as: Manufacturer
              as_user_id: "${mfr_small_id}"
              captures: { asmt_speaker_id: $.data.id }
            - call: "POST /labeling/assessments/${asmt_speaker_id}/responses"
              payload: { responses: [ { criterion_id: "${crit_auth1_id}", self_declared_conformant: true, evidence_ref: "EV-AUTH1" }, { criterion_id: "${crit_auth2_id}", self_declared_conformant: true, evidence_ref: "EV-AUTH2" }, { criterion_id: "${crit_upd1_id}", self_declared_conformant: true, evidence_ref: "EV-UPD1" }, { criterion_id: "${crit_data1_id}", self_declared_conformant: true, evidence_ref: "EV-DATA1" }, { criterion_id: "${crit_vdp1_id}", self_declared_conformant: true, evidence_ref: "EV-VDP1" } ] }
              as: Manufacturer
              as_user_id: "${mfr_small_id}"
            - call: "POST /labeling/assessments/${asmt_speaker_id}/submit"
              payload: {}
              as: Manufacturer
              as_user_id: "${mfr_small_id}"
            - call: "POST /labeling/assessments/${asmt_speaker_id}/decide"
              payload: { decision: "APPROVED", reviewer_note: "Self-attestation complete, score 80.80 meets the tier minimum." }
              as: ConformityReviewer
              as_user_id: "reviewer-1"
            - call: "POST /labeling/label-grants"
              payload: { product_id: "${prod_speaker_id}", assessment_id: "${asmt_speaker_id}" }
              as: Manufacturer
              as_user_id: "${mfr_small_id}"
              captures: { grant_speaker_id: $.data.id, grant_speaker_code: $.data.scannable_code }
            - call: "POST /labeling/label-grants/${grant_speaker_id}/registry-entry"
              payload: { update_policy_url: "https://northwind.example/updates/spk-s1", update_cadence: "AUTOMATIC", vuln_disclosure_contact: "security@northwind.example" }
              as: Manufacturer
              as_user_id: "${mfr_small_id}"
            - call: "POST /labeling/label-grants/${grant_speaker_id}/registry-publication"
              payload: { publication_decision: "PUBLISHED", publication_note: "Registry content complete." }
              as: ConformityReviewer
              as_user_id: "reviewer-2"
            - call: "POST /labeling/enforcement-cases"
              payload: { subject_manufacturer_id: "${mfr_small_id}", reported_scannable_code: "${grant_speaker_code}", violation_type: "EXPIRED_LABEL_DISPLAY", violation_line_items: [ { retail_listing_ref: "LST-ONLINE-01", channel: "ONLINE", unit_count: 7 }, { retail_listing_ref: "LST-STORE-01", channel: "IN_STORE", unit_count: 3 } ], reporter_note: "Label displayed after expiry on 7 online listings and 3 store endcaps." }
              as: ProgramAdministrator
              as_user_id: "admin-intake-1"
              captures: { case_small_id: $.data.id }
            - call: "POST /labeling/enforcement-cases"
              payload: { subject_manufacturer_id: "${mfr_large_id}", reported_scannable_code: "${grant_speaker_code}", violation_type: "EXPIRED_LABEL_DISPLAY", violation_line_items: [ { retail_listing_ref: "LST-ONLINE-01", channel: "ONLINE", unit_count: 7 }, { retail_listing_ref: "LST-STORE-01", channel: "IN_STORE", unit_count: 3 } ], reporter_note: "Identical line items reported against the large manufacturer." }
              as: ProgramAdministrator
              as_user_id: "admin-intake-1"
              captures: { case_large_id: $.data.id }
            - call: "POST /labeling/enforcement-cases/${case_small_id}/notice"
              payload: { notice_reference: "NOT-2026-0001" }
              as: ProgramAdministrator
              as_user_id: "admin-notice-1"
            - call: "POST /labeling/enforcement-cases/${case_large_id}/notice"
              payload: { notice_reference: "NOT-2026-0002" }
              as: ProgramAdministrator
              as_user_id: "admin-notice-1"
          trigger:
            - call: "POST /labeling/enforcement-cases/${case_small_id}/adjudicate"
              payload: { outcome: "UPHELD", adjudication_note: "Misuse established on all ten units." }
              as: ProgramAdministrator
              as_user_id: "admin-adjudicate-1"
            - call: "POST /labeling/enforcement-cases/${case_large_id}/adjudicate"
              payload: { outcome: "UPHELD", adjudication_note: "Misuse established on all ten units." }
              as: ProgramAdministrator
              as_user_id: "admin-adjudicate-1"
          assert:
            - "EnforcementCase.${case_small_id}.penalty_variant == STATUTORY_SCHEDULE"
            - "EnforcementCase.${case_small_id}.aggravation_multiplier == 1.00"
            - "EnforcementCase.${case_small_id}.penalty_cents == 35476"
            - "EnforcementCase.${case_large_id}.penalty_variant == REVENUE_LINKED"
            - "EnforcementCase.${case_large_id}.aggravation_multiplier == 1.00"
            - "EnforcementCase.${case_large_id}.penalty_cents == 3920000"
            - "EnforcementCase.${case_small_id}.violation_unit_count == 10 and EnforcementCase.${case_large_id}.violation_unit_count == 10"
            - "EnforcementCase.${case_large_id}.penalty_cents != EnforcementCase.${case_small_id}.penalty_cents"
            - "Manufacturer.${mfr_small_id}.outstanding_penalty_cents == 35476"
            - "Manufacturer.${mfr_large_id}.outstanding_penalty_cents == 3920000"

  # =========================================================================
  # RULE 2 — combinatorial formulas in DIFFERENT modes
  #   instance 1: mode (a) >=3 inputs, nested min/max + conditional branches
  #   instance 2: mode (b) rounding order pinned per line, not on the sum
  #   instance 3: mode (c) circular-looking band selection with pinned order
  # =========================================================================
  - rule_id: combinatorial_formula
    instances:
      - name: area_floor_gate_and_tiered_grade_in_conformance_score
        grounds:
          - calculations.conformance_score
          - entities.ConformanceAssessment.fields.gate_applied
          - entities.ConformanceAssessment.fields.decided_min_area_score
          - entities.ConformanceAssessment.fields.grade
          - state_machines.ConformanceAssessment.transitions.DRAFT_to_UNDER_REVIEW
        distinguishing_aspect: |
          Mode (a): conformance_score combines four per-area ratios, four area weights, the tier's
          unverified_weight_factor, a nested min/max floor gate and a three-branch grade ladder, so a
          single false self-declaration on AUTH-2 drops AUTHENTICATION to 36.00, drives the weighted
          68.80 through max-of-floor-cap logic down to exactly 65.00 and lands grade FAIL — a
          non-linear interaction no additive formula reproduces.
        test_recipe:
          setup:
            - "Logical clock at 2026-08-01T00:00:00Z."
            - "TIER_1 self-attestation tier with unverified_weight_factor 0.60 and min_overall_score 80.80."
            - "ELIGIBLE SMART_SPEAKER category mapped to TIER_1, five-criterion catalogue."
            - "One SMALL manufacturer with one ELIGIBLE speaker product, support period ending 2030-01-01T00:00:00Z."
            - "A DRAFT assessment on that product whose five responses declare AUTH-1, UPD-1, DATA-1 and VDP-1 conformant but AUTH-2 NON-conformant."
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-08-01T00:00:00Z" }
              as: ProgramAdministrator
            - call: "POST /labeling/program-tiers"
              payload: { tier_code: "TIER_1", required_route: "SELF_ATTESTATION", label_validity_days: 365, min_overall_score: 80.80, unverified_weight_factor: 0.60, issuance_base_fee_cents: 40000, max_deficiency_rounds: 2 }
              as: ProgramAdministrator
              captures: { tier1_id: $.data.id }
            - call: "POST /labeling/device-categories"
              payload: { category_code: "SMART_SPEAKER", display_name: "Smart Speaker", eligibility_status: "ELIGIBLE", program_tier_id: "${tier1_id}", min_support_period_days: 730 }
              as: ProgramAdministrator
              captures: { cat_speaker_id: $.data.id }
            - call: "POST /labeling/security-criteria"
              payload: { criteria: [ { criterion_code: "AUTH-1", practice_area: "AUTHENTICATION", weight: 60, requires_lab_verification: true, criterion_text: "Unique per-device credentials or forced change at first use" }, { criterion_code: "AUTH-2", practice_area: "AUTHENTICATION", weight: 40, requires_lab_verification: false, criterion_text: "Brute-force resistant authentication with lockout" }, { criterion_code: "UPD-1", practice_area: "SOFTWARE_UPDATE", weight: 100, requires_lab_verification: true, criterion_text: "Signed automatic security updates for the declared support period" }, { criterion_code: "DATA-1", practice_area: "DATA_PROTECTION", weight: 100, requires_lab_verification: false, criterion_text: "Personal data encrypted in transit and at rest" }, { criterion_code: "VDP-1", practice_area: "VULN_DISCLOSURE", weight: 100, requires_lab_verification: false, criterion_text: "Published vulnerability disclosure policy with monitored contact" } ] }
              as: ProgramAdministrator
              captures: { crit_auth1_id: "$.data[0].id", crit_auth2_id: "$.data[1].id", crit_upd1_id: "$.data[2].id", crit_data1_id: "$.data[3].id", crit_vdp1_id: "$.data[4].id" }
            - call: "POST /labeling/manufacturers"
              payload: { legal_name: "Northwind Devices LLC", contact_email: "compliance@northwind.example", enterprise_class: "SMALL", annual_us_revenue_cents: 250000000 }
              as: ProgramAdministrator
              captures: { mfr_small_id: $.data.id }
            - call: "POST /labeling/products"
              payload: { manufacturer_id: "${mfr_small_id}", device_category_id: "${cat_speaker_id}", model_name: "Northwind Speaker S1", sku: "NW-SPK-S1", firmware_version: "1.0.0", declared_support_period_end: "2030-01-01T00:00:00Z", update_policy_disclosed: true, retail_units_shipped: 12000 }
              as: Manufacturer
              as_user_id: "${mfr_small_id}"
              captures: { prod_speaker_id: $.data.id, prod_speaker_v: $.data.version }
            - call: "POST /labeling/products/${prod_speaker_id}/assessments"
              payload: { expected_product_version: "${prod_speaker_v}" }
              as: Manufacturer
              as_user_id: "${mfr_small_id}"
              captures: { asmt_gate_id: $.data.id }
            - call: "POST /labeling/assessments/${asmt_gate_id}/responses"
              payload: { responses: [ { criterion_id: "${crit_auth1_id}", self_declared_conformant: true, evidence_ref: "EV-AUTH1" }, { criterion_id: "${crit_auth2_id}", self_declared_conformant: false, evidence_ref: "EV-AUTH2-GAP" }, { criterion_id: "${crit_upd1_id}", self_declared_conformant: true, evidence_ref: "EV-UPD1" }, { criterion_id: "${crit_data1_id}", self_declared_conformant: true, evidence_ref: "EV-DATA1" }, { criterion_id: "${crit_vdp1_id}", self_declared_conformant: true, evidence_ref: "EV-VDP1" } ] }
              as: Manufacturer
              as_user_id: "${mfr_small_id}"
          trigger:
            - call: "POST /labeling/assessments/${asmt_gate_id}/submit"
              payload: {}
              as: Manufacturer
              as_user_id: "${mfr_small_id}"
          assert:
            - "ConformanceAssessment.${asmt_gate_id}.provisional_area_scores.AUTHENTICATION == 36.00"
            - "ConformanceAssessment.${asmt_gate_id}.provisional_area_scores.SOFTWARE_UPDATE == 60.00"
            - "ConformanceAssessment.${asmt_gate_id}.provisional_area_scores.DATA_PROTECTION == 100.00"
            - "ConformanceAssessment.${asmt_gate_id}.provisional_area_scores.VULN_DISCLOSURE == 100.00"
