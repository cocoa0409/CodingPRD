scaffold_corner_design:
  # ===========================================================================
  # Section: entities
  # ===========================================================================
  - section: entities
    instances:
      - name: corner_patient_creation_defaults_and_envelope
        claim_type: creation_defaults
        grounds:
          - entities.Patient
          - response_envelope
        distinguishing_aspect: "Create with only required fields applies the default default_ambient_opt_in=true, mints id/version, and wraps the result in the fixed success envelope."
        test_recipe:
          setup: ["empty database"]
          setup_api_calls: []
          trigger:
            - call: "POST /ambient-clinical-documentation/patients"
              payload: { mrn: "MRN-EN1-1", full_name: "Pat En1" }
              as: PlatformAdmin
              captures: { pat: "$.data.id", pat_v: "$.data.version", pat_optin: "$.data.default_ambient_opt_in" }
          assert:
            - "HTTP 201; response carries meta.api_request_id, response_type == 'object'"
            - "pat_optin == true (default applied); pat_v == 1; created_at/updated_at present in ISO8601 with three fractional digits"
      - name: corner_physician_creation_missing_required_npi_returns_400
        claim_type: required_fields
        grounds:
          - entities.Physician.fields.npi
          - errors[ERR_INVALID_REQUEST]
        distinguishing_aspect: "Omitting the required npi is rejected with ERR_INVALID_REQUEST before any persistence."
        test_recipe:
          setup: ["empty database"]
          setup_api_calls: []
          trigger:
            - call: "POST /ambient-clinical-documentation/physicians"
              payload: { full_name: "No Npi", specialty_code: "CARD" }
              as: PlatformAdmin
              captures: { err: "$.data.error_id" }
          assert:
            - "err == ERR_INVALID_REQUEST and HTTP status == 400"
      - name: corner_template_field_spec_enum_rejected
        claim_type: type_constraints
        grounds:
          - entities.NoteTemplate.fields.field_specs
          - errors[ERR_INVALID_REQUEST]
        distinguishing_aspect: "A field_specs entry with importance outside CRITICAL|MAJOR|MINOR is rejected at creation."
        test_recipe:
          setup: ["empty database"]
          setup_api_calls: []
          trigger:
            - call: "POST /ambient-clinical-documentation/note-templates"
              payload: { specialty_code: "CARD", template_version: "bad1", field_specs: [{ key: "chief_complaint", importance: "HUGE", required: true }] }
              as: PlatformAdmin
              captures: { err: "$.data.error_id" }
          assert:
            - "err == ERR_INVALID_REQUEST and HTTP status == 400"
      - name: corner_patient_unknown_field_input_rejected
        claim_type: system_fields
        grounds:
          - entities.Patient
          - errors[ERR_INVALID_REQUEST]
        distinguishing_aspect: "Client-supplied system fields (id, version) in a create payload are rejected as unknown keys — the server owns them."
        test_recipe:
          setup: ["empty database"]
          setup_api_calls: []
          trigger:
            - call: "POST /ambient-clinical-documentation/patients"
              payload: { mrn: "MRN-EN4-1", full_name: "Pat En4", id: "00000000-0000-0000-0000-000000000000" }
              as: PlatformAdmin
              captures: { err: "$.data.error_id" }
          assert:
            - "err == ERR_INVALID_REQUEST and HTTP status == 400 (id is server-minted, never client input)"
      - name: corner_encounter_get_not_found_returns_404
        claim_type: not_found
        grounds:
          - errors[ERR_NOT_FOUND]
        distinguishing_aspect: "GET on a non-existent encounter id returns ERR_NOT_FOUND 404."
        test_recipe:
          setup: ["empty database"]
          setup_api_calls: []
          trigger:
            - call: "GET /ambient-clinical-documentation/encounters/00000000-0000-0000-0000-000000000000"
              payload: {}
              as: PlatformAdmin
              captures: { err: "$.data.error_id" }
          assert:
            - "err == ERR_NOT_FOUND and HTTP status == 404"
      - name: corner_attestation_append_only_immutability
        claim_type: immutability
        grounds:
          - entities.Attestation
        distinguishing_aspect: "Attestation (common_fields: false) exposes id and created_at only — no version/updated_at and no update endpoint; the legal record row is immutable once written."
        test_recipe:
          setup:
            - "One attested note (1-field template, chief filled, completeness 100)"
          setup_api_calls:
            - call: "POST /ambient-clinical-documentation/patients"
              payload: { mrn: "MRN-EN6-1", full_name: "Pat En6" }
              as: PlatformAdmin
              captures: { pat: "$.data.id" }
            - call: "POST /ambient-clinical-documentation/physicians"
              payload: { npi: "NPI-EN6-1", full_name: "Doc En6", specialty_code: "CARD" }
              as: PlatformAdmin
              captures: { phy: "$.data.id" }
            - call: "POST /ambient-clinical-documentation/note-templates"
              payload: { specialty_code: "CARD", template_version: "en6", field_specs: [{ key: "chief_complaint", importance: "CRITICAL", required: true }] }
              as: PlatformAdmin
              captures: { tpl: "$.data.id" }
            - call: "POST /ambient-clinical-documentation/_clock/set_current_utc"
              payload: { to_iso8601: "2026-09-01T16:00:00Z" }
              as: PlatformAdmin
            - call: "POST /ambient-clinical-documentation/encounters"
              payload: { patient_id: "${pat}", physician_id: "${phy}" }
              as: Physician
              as_user_id: "${phy}"
              captures: { enc: "$.data.id" }
            - call: "POST /ambient-clinical-documentation/encounters/${enc}/consents"
              payload: { patient_id: "${pat}", signage_posted: true, captured_via: "ROOM_SIGNAGE" }
              as: Patient
              as_user_id: "${pat}"
            - call: "POST /ambient-clinical-documentation/encounters/${enc}/start"
              payload: {}
              as: Physician
              as_user_id: "${phy}"
            - call: "POST /ambient-clinical-documentation/encounters/${enc}/audio-captures"
              payload: { planned_retention_days: 30 }
              as: Physician
              as_user_id: "${phy}"
              captures: { cap: "$.data.id" }
            - call: "POST /ambient-clinical-documentation/audio-captures/${cap}/stop"
              payload: {}
              as: Physician
              as_user_id: "${phy}"
            - call: "POST /ambient-clinical-documentation/_audio/simulate-transcription"
              payload: { audio_capture_id: "${cap}" }
              as: PlatformAdmin
            - call: "GET /ambient-clinical-documentation/encounters/${enc}"
              payload: {}
              as: Physician
              as_user_id: "${phy}"
              captures: { enc_v: "$.data.version" }
            - call: "POST /ambient-clinical-documentation/encounters/${enc}/note-drafts"
              payload: { template_id: "${tpl}", expected_encounter_version: "${enc_v}" }
              as: Physician
              as_user_id: "${phy}"
              captures: { draft: "$.data.id", draft_v: "$.data.version" }
            - call: "PATCH /ambient-clinical-documentation/note-drafts/${draft}"
              payload: { expected_note_draft_version: "${draft_v}", field_updates: [{ field_key: "chief_complaint", field_value: "fever" }] }
              as: Physician
              as_user_id: "${phy}"
            - call: "POST /ambient-clinical-documentation/note-drafts/${draft}/submit-review"
              payload: {}
              as: Physician
              as_user_id: "${phy}"
            - call: "POST /ambient-clinical-documentation/note-drafts/${draft}/attest"
              payload: {}
              as: Physician
              as_user_id: "${phy}"
          trigger:
            - call: "GET /ambient-clinical-documentation/note-drafts/${draft}/attestations"
              payload: {}
              as: Physician
              as_user_id: "${phy}"
              captures: { att_type: "$.data[0].attestation_type", att_completeness: "$.data[0].completeness_at_attestation" }
          assert:
            - "Exactly 1 Attestation row with att_type == INITIAL and att_completeness == 100"
            - "The row carries id and created_at but no version or updated_at fields (append-only legal record)"
      - name: corner_notefields_seeded_from_template_at_draft_creation
        claim_type: creation
        grounds:
          - entities.NoteField
          - state_machines.NoteDraft
        distinguishing_aspect: "Draft creation seeds exactly one NoteField per template field_spec with value null, source SYSTEM, validated false, importance copied."
        test_recipe:
          setup:
            - "Encounter with TRANSCRIBED capture and GRANTED consent; template with CRITICAL+MINOR specs"
          setup_api_calls:
            - call: "POST /ambient-clinical-documentation/patients"
              payload: { mrn: "MRN-EN7-1", full_name: "Pat En7" }
              as: PlatformAdmin
              captures: { pat: "$.data.id" }
            - call: "POST /ambient-clinical-documentation/physicians"
              payload: { npi: "NPI-EN7-1", full_name: "Doc En7", specialty_code: "CARD" }
              as: PlatformAdmin
              captures: { phy: "$.data.id" }
            - call: "POST /ambient-clinical-documentation/note-templates"
              payload: { specialty_code: "CARD", template_version: "en7", field_specs: [{ key: "chief_complaint", importance: "CRITICAL", required: true }, { key: "ros", importance: "MINOR", required: false }] }
              as: PlatformAdmin
              captures: { tpl: "$.data.id" }
            - call: "POST /ambient-clinical-documentation/_clock/set_current_utc"
              payload: { to_iso8601: "2026-09-01T16:00:00Z" }
              as: PlatformAdmin
            - call: "POST /ambient-clinical-documentation/encounters"
              payload: { patient_id: "${pat}", physician_id: "${phy}" }
              as: Physician
              as_user_id: "${phy}"
              captures: { enc: "$.data.id" }
            - call: "POST /ambient-clinical-documentation/encounters/${enc}/consents"
              payload: { patient_id: "${pat}", signage_posted: true, captured_via: "VERBAL" }
              as: Patient
              as_user_id: "${pat}"
            - call: "POST /ambient-clinical-documentation/encounters/${enc}/start"
              payload: {}
              as: Physician
              as_user_id: "${phy}"
            - call: "POST /ambient-clinical-documentation/encounters/${enc}/audio-captures"
              payload: { planned_retention_days: 30 }
              as: Physician
              as_user_id: "${phy}"
              captures: { cap: "$.data.id" }
            - call: "POST /ambient-clinical-documentation/audio-captures/${cap}/stop"
              payload: {}
              as: Physician
              as_user_id: "${phy}"
            - call: "POST /ambient-clinical-documentation/_audio/simulate-transcription"
              payload: { audio_capture_id: "${cap}" }
              as: PlatformAdmin
            - call: "GET /ambient-clinical-documentation/encounters/${enc}"
              payload: {}
              as: Physician
              as_user_id: "${phy}"
              captures: { enc_v: "$.data.version" }
            - call: "POST /ambient-clinical-documentation/encounters/${enc}/note-drafts"
              payload: { template_id: "${tpl}", expected_encounter_version: "${enc_v}" }
              as: Physician
              as_user_id: "${phy}"
              captures: { draft: "$.data.id" }
          trigger:
            - call: "GET /ambient-clinical-documentation/note-drafts/${draft}/fields"
              payload: {}
              as: Physician
              as_user_id: "${phy}"
              captures: { f0_key: "$.data[0].field_key", f0_source: "$.data[0].source" }
          assert:
            - "GET fields returns exactly 2 rows (one per field_spec)"
            - "Every row: field_value == null, validated == false, source == SYSTEM; importance/required copied from the spec (ros is required=false)"
            - "NoteDraft.completeness_score == 49 (only the required CRITICAL field counts as missing: raw 100-25=75, but a missing CRITICAL field caps at 49; ros is not required and never penalized)"

  # ===========================================================================
  # Section: state_machines
  # ===========================================================================
  - section: state_machines
    instances:
      - name: corner_start_in_progress_encounter_returns_409
        claim_type: invalid_transition
        grounds:
          - state_machines.Encounter.SCHEDULED_to_IN_PROGRESS
          - errors[ERR_INVALID_STATE]
        distinguishing_aspect: "Starting an already IN_PROGRESS encounter is not a listed transition and fails with ERR_INVALID_STATE."
        test_recipe:
          setup: ["Encounter started once"]
          setup_api_calls:
            - call: "POST /ambient-clinical-documentation/patients"
              payload: { mrn: "MRN-SM1-1", full_name: "Pat Sm1" }
              as: PlatformAdmin
              captures: { pat: "$.data.id" }
            - call: "POST /ambient-clinical-documentation/physicians"
              payload: { npi: "NPI-SM1-1", full_name: "Doc Sm1", specialty_code: "CARD" }
              as: PlatformAdmin
              captures: { phy: "$.data.id" }
            - call: "POST /ambient-clinical-documentation/encounters"
              payload: { patient_id: "${pat}", physician_id: "${phy}" }
              as: Physician
              as_user_id: "${phy}"
              captures: { enc: "$.data.id" }
            - call: "POST /ambient-clinical-documentation/encounters/${enc}/start"
              payload: {}
              as: Physician
              as_user_id: "${phy}"
          trigger:
            - call: "POST /ambient-clinical-documentation/encounters/${enc}/start"
              payload: {}
              as: Physician
              as_user_id: "${phy}"
              captures: { err: "$.data.error_id" }
          assert:
            - "err == ERR_INVALID_STATE and HTTP status == 409"
      - name: corner_cancelled_encounter_terminal_lockdown_returns_409
        claim_type: terminal_state_lockdown
        grounds:
          - state_machines.Encounter.SCHEDULED_to_CANCELLED
          - errors[ERR_INVALID_STATE]
        distinguishing_aspect: "From the terminal CANCELLED state no further transitions exist — start is rejected."
        test_recipe:
          setup: ["Encounter cancelled from SCHEDULED"]
          setup_api_calls:
            - call: "POST /ambient-clinical-documentation/patients"
              payload: { mrn: "MRN-SM2-1", full_name: "Pat Sm2" }
              as: PlatformAdmin
              captures: { pat: "$.data.id" }
            - call: "POST /ambient-clinical-documentation/physicians"
              payload: { npi: "NPI-SM2-1", full_name: "Doc Sm2", specialty_code: "CARD" }
              as: PlatformAdmin
              captures: { phy: "$.data.id" }
            - call: "POST /ambient-clinical-documentation/encounters"
              payload: { patient_id: "${pat}", physician_id: "${phy}" }
              as: Physician
              as_user_id: "${phy}"
              captures: { enc: "$.data.id" }
            - call: "POST /ambient-clinical-documentation/encounters/${enc}/cancel"
              payload: { cancel_reason: "no-show" }
              as: Physician
              as_user_id: "${phy}"
          trigger:
            - call: "POST /ambient-clinical-documentation/encounters/${enc}/start"
              payload: {}
              as: Physician
              as_user_id: "${phy}"
              captures: { err: "$.data.error_id" }
          assert:
            - "err == ERR_INVALID_STATE and HTTP status == 409 (terminal lockdown)"
      - name: corner_regenerate_from_draft_status_returns_409
        claim_type: invalid_transition
        grounds:
          - state_machines.NoteDraft.IN_REVIEW_to_DRAFT
          - errors[ERR_INVALID_STATE]
        distinguishing_aspect: "Regenerate is only valid from IN_REVIEW; calling it on a fresh DRAFT fails."
        test_recipe:
          setup: ["Draft created, never submitted"]
          setup_api_calls:
            - call: "POST /ambient-clinical-documentation/patients"
              payload: { mrn: "MRN-SM3-1", full_name: "Pat Sm3" }
              as: PlatformAdmin
              captures: { pat: "$.data.id" }
            - call: "POST /ambient-clinical-documentation/physicians"
              payload: { npi: "NPI-SM3-1", full_name: "Doc Sm3", specialty_code: "CARD" }
              as: PlatformAdmin
              captures: { phy: "$.data.id" }
            - call: "POST /ambient-clinical-documentation/note-templates"
              payload: { specialty_code: "CARD", template_version: "sm3", field_specs: [{ key: "chief_complaint", importance: "CRITICAL", required: true }] }
              as: PlatformAdmin
              captures: { tpl: "$.data.id" }
            - call: "POST /ambient-clinical-documentation/_clock/set_current_utc"
              payload: { to_iso8601: "2026-09-01T16:00:00Z" }
              as: PlatformAdmin
            - call: "POST /ambient-clinical-documentation/encounters"
              payload: { patient_id: "${pat}", physician_id: "${phy}" }
              as: Physician
              as_user_id: "${phy}"
              captures: { enc: "$.data.id" }
            - call: "POST /ambient-clinical-documentation/encounters/${enc}/consents"
              payload: { patient_id: "${pat}", signage_posted: true, captured_via: "ROOM_SIGNAGE" }
              as: Patient
              as_user_id: "${pat}"
            - call: "POST /ambient-clinical-documentation/encounters/${enc}/start"
              payload: {}
              as: Physician
              as_user_id: "${phy}"
            - call: "POST /ambient-clinical-documentation/encounters/${enc}/audio-captures"
              payload: { planned_retention_days: 30 }
              as: Physician
              as_user_id: "${phy}"
              captures: { cap: "$.data.id" }
            - call: "POST /ambient-clinical-documentation/audio-captures/${cap}/stop"
              payload: {}
              as: Physician
              as_user_id: "${phy}"
            - call: "POST /ambient-clinical-documentation/_audio/simulate-transcription"
              payload: { audio_capture_id: "${cap}" }
              as: PlatformAdmin
            - call: "GET /ambient-clinical-documentation/encounters/${enc}"
              payload: {}
              as: Physician
              as_user_id: "${phy}"
              captures: { enc_v: "$.data.version" }
            - call: "POST /ambient-clinical-documentation/encounters/${enc}/note-drafts"
              payload: { template_id: "${tpl}", expected_encounter_version: "${enc_v}" }
              as: Physician
              as_user_id: "${phy}"
              captures: { draft: "$.data.id" }
          trigger:
            - call: "POST /ambient-clinical-documentation/note-drafts/${draft}/regenerate"
              payload: {}
              as: Physician
              as_user_id: "${phy}"
              captures: { err: "$.data.error_id" }
          assert:
            - "err == ERR_INVALID_STATE and HTTP status == 409 (regenerate requires IN_REVIEW)"
      - name: corner_patch_attested_note_locked_returns_409
        claim_type: invalid_transition
        grounds:
          - validations[priority=6]
          - errors[ERR_NOTE_LOCKED]
        distinguishing_aspect: "PATCH with a correct OCC version on an ATTESTED draft is rejected with ERR_NOTE_LOCKED — amendment, not direct edit, is the only path."
        test_recipe:
          setup: ["Draft attested (1-field template, chief filled)"]
          setup_api_calls:
            - call: "POST /ambient-clinical-documentation/patients"
