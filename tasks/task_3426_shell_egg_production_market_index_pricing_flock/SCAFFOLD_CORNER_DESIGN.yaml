        distinguishing_aspect: "OCC on CustomerCommitment.version: the first order create (expected version matching) succeeds and bumps the version; a second create replaying the pre-first-create version is rejected 412 ERR_STALE_COMMITMENT_VERSION — deterministic across two sequential requests."
        test_recipe:
