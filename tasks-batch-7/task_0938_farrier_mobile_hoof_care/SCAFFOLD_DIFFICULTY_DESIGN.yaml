        grounds:
          - validations[priority=45]
          - calculations.appointment_service_minutes
          - entities.Barn.fields.access_close_minute
          - entities.RouteStop.fields.end_minute
          - errors[ERR_OUTSIDE_ACCESS_WINDOW]
