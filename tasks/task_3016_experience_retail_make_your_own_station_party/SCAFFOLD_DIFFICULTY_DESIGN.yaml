              payload: { to_iso8601: "2026-10-08T18:00:00Z" }
              as: StoreManager
            - call: "GET /parties/${party7}/guests"
              payload: {}
              as: Customer
              as_user_id: "${cust7}"
              captures: { solo_session: "$.data[0].workshop_session_id" }
            - call: "POST /workshops/${solo_session}/advance-step"
