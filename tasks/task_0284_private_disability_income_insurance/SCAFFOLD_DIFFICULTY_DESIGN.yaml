              payload: {}
              as: ClaimsAdjudicator
            - call: "POST /disability/claims/${c_id}/approve"
              payload: {}
              as: ClaimsAdjudicator
            - call: "POST /disability/claims/${c_id}/benefit-periods"
              payload: { coverage_month: 3 }
              as: ClaimsAdjudicator
          trigger:
            - call: "POST /disability/claims/${c_id}/benefit-periods"
              payload: { coverage_month: 4 }
              as: ClaimsAdjudicator
              captures: { err: $.data.error_id }
          assert:
            - "Claim ${c_id} is BENEFIT_EXHAUSTED after the first accrual (consumed 1.0 == cap 1)"
            - "Second accrual at month 4: HTTP 409 and data.error_id == ERR_CLAIM_NOT_PAYABLE (payable check, priority 10, fires before the would-exceed fiscal check, priority 12)"

