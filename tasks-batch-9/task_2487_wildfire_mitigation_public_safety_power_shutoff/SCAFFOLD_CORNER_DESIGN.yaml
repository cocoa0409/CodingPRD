      - name: notification_safety_gate_precedes_the_fiscal_threshold
        claim_type: Priority Ordering
        excluded_because:
          difficulty_instance: notification_safety_beats_fiscal_threshold_on_arm
          rationale: "That instance arms an event that violates both the advance-notice requirement (priority 11) and the 0.25 net-benefit floor (priority 17) and pins the answer to ERR_ADVANCE_NOTIFICATION_MISSING."
