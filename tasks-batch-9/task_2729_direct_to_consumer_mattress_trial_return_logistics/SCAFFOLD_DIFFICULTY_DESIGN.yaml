              as: PlatformAdmin
              captures: { model_firm_id: $.data.id }
            - call: "POST /customers"
              payload: { email: "pp1a@example.com", full_name: "Blocked Bella", household_hash: "HH-PP1A" }
              as: PlatformAdmin
              captures: { cust_a_id: $.data.id }
            - call: "POST /customers"
              payload: { email: "pp1b@example.com", full_name: "Clean Cleo", household_hash: "HH-PP1B" }
              as: PlatformAdmin
              captures: { cust_b_id: $.data.id }
            - call: "POST /trial-orders"
              payload: { customer_id: "${cust_a_id}", model_id: "${model_med_id}", channel: "DTC", gross_price_cents: 120000 }
              as: TrialSupportAgent
              captures: { order_a_id: $.data.id }
            - call: "POST /trial-orders/${order_a_id}/dispatch"
              payload: {}
              as: LogisticsCoordinator
            - call: "POST /trial-orders/${order_a_id}/deliver"
              payload: {}
              as: LogisticsCoordinator
            - call: "POST /trial-orders"
              payload: { customer_id: "${cust_b_id}", model_id: "${model_med_id}", channel: "DTC", gross_price_cents: 120000 }
              as: TrialSupportAgent
              captures: { order_b_id: $.data.id }
            - call: "POST /trial-orders/${order_b_id}/dispatch"
              payload: {}
              as: LogisticsCoordinator
            - call: "POST /trial-orders/${order_b_id}/deliver"
              payload: {}
              as: LogisticsCoordinator
            - call: "POST /trial-abuse-signals"
              payload: { customer_id: "${cust_a_id}", signal_type: "HOUSEHOLD_MATCH", recorded_at: "2026-08-01T00:00:00Z", source_note: "same address" }
              as: PlatformAdmin
            - call: "POST /trial-abuse-signals"
              payload: { customer_id: "${cust_a_id}", signal_type: "REPEAT_RETURN", recorded_at: "2026-08-01T00:00:00Z", source_note: "third return" }
              as: PlatformAdmin
            - call: "POST /trial-abuse-signals"
              payload: { customer_id: "${cust_a_id}", signal_type: "MULTI_CHANNEL", recorded_at: "2026-08-01T00:00:00Z", source_note: "retail and dtc" }
              as: PlatformAdmin
            - call: "POST /trial-abuse-signals"
              payload: { customer_id: "${cust_a_id}", signal_type: "SHORT_TRIAL", recorded_at: "2026-08-01T00:00:00Z", source_note: "9-night trial" }
              as: PlatformAdmin
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-08-10T00:00:00Z" }
              as: PlatformAdmin
          trigger:
            - call: "POST /comfort-exchanges"
              payload: { original_order_id: "${order_a_id}", target_model_id: "${model_firm_id}" }
              as: Customer
              as_user_id: "${cust_a_id}"
            - call: "POST /comfort-exchanges"
              payload: { original_order_id: "${order_b_id}", target_model_id: "${model_firm_id}" }
              as: Customer
              as_user_id: "${cust_b_id}"
          assert:
            - "trigger call 1 (blocked customer, pre-break-in) -> 403 with error_id ERR_TRIAL_ABUSE_BLOCK, NOT ERR_BREAK_IN_NOT_ELAPSED"
            - "Customer.${cust_a_id}.abuse_score_rolling == 80 and status == BLOCKED"
            - "trigger call 2 (clean customer, pre-break-in) -> 422 with error_id ERR_BREAK_IN_NOT_ELAPSED, proving priority 17 is genuinely violated in both calls"
            - "no ComfortExchange row exists for ${order_a_id} or ${order_b_id}"
            - "TrialOrder.${order_a_id}.fulfillment_status == DELIVERED and trial_status == BREAK_IN (a rejected request mutates nothing)"

      - name: open_quality_claim_p36_outranks_no_refundable_balance_p40_on_refund_creation
        grounds:
          - validations[priority=36]
          - validations[priority=40]
          - calculations.refund_settlement
          - calculations.bundle_unwind
          - calculations.damage_offset
          - errors.ERR_OPEN_QUALITY_CLAIM
          - errors.ERR_NO_REFUNDABLE_BALANCE
        distinguishing_aspect: |
          A different endpoint and a much wider priority gap than the first instance
          (business_referential 409 at 36 versus business_fiscal 422 at 40), and the loser is the
          expensive check: final_refund_cents is -34000, so an implementation that prices the
          settlement before scanning for open complaints returns the wrong error. Clearing the
          claim in-place with an adjudication then exposes ERR_NO_REFUNDABLE_BALANCE on a byte
          identical retry with the same expected_return_case_version.
        test_recipe:
          setup:
            - "One QUEEN MattressModel priced 120000 cents, donation_eligible false, break_in_nights 21, trial_nights 100."
            - "One DEDUCT_RETAIL PromotionBundle with accessory_retail_cents 60000, gift_card_cents 40000, percent_off_bps 0, requires_accessory_return true (so paid_amount_cents == 120000 and bundle_unwind_cents == 100000 when the accessory is not returned)."
