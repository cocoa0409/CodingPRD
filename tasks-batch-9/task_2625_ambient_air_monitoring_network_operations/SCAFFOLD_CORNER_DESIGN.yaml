          - validations[priority=50]
          - validations[priority=57]
        excluded_because:
          difficulty_instance: priority_pair_validation_conflict / validate_method_designation_beats_qc_delinquency
          rationale: "The both-violated case returning ERR_METHOD_NOT_DESIGNATED and the single-violation control returning ERR_MONITOR_QC_DELINQUENT are asserted by the named difficulty instance."

      - name: member_batch_state_check_outranks_the_certification_deadline_check
        claim_type: priority_ordering
        grounds:
          - validations[priority=24]
          - validations[priority=71]
        excluded_because:
          difficulty_instance: priority_pair_validation_conflict / certify_member_batch_state_conflict_beats_deadline_conflict
          rationale: "The both-violated case returning ERR_MEMBER_BATCH_NOT_VALIDATED and the deadline-only control returning ERR_CERTIFICATION_DEADLINE_PASSED are asserted by the named difficulty instance."

      - name: applied_invalidation_ranges_may_abut_but_not_overlap
