              as_user_id: "${ct_id}"
              captures: { pj_id: $.data.id }
            - call: "POST /eqp/retrofit-projects/${pj_id}/start-work"
              payload: {}
              as: CertifiedContractor
              as_user_id: "${ct_id}"
            - call: "POST /eqp/retrofit-projects/${pj_id}/request-inspection"
              payload: {}
              as: CertifiedContractor
