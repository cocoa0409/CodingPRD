            - "GET /roi/requests/${rq}/turnaround data.days_late_business == 4"
            - "GET /roi/requests/${rq}/turnaround data.chargeable_days == 2"
            - "GET /roi/requests/${rq}/turnaround data.breached == true"
            - "Facility.${fac}.penalty_exposure_cents == 15000"
            - "GET /roi/requests/${rq}/compliance-events contains exactly one event with event_type STATUTORY_DEADLINE_BREACHED"

