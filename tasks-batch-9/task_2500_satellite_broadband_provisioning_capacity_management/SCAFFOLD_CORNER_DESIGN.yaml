              captures: { sn1_id: "$.data.id" }
            - { call: "POST /satellite-broadband/subscriptions/${sn1_id}/disclosure-acknowledgement", payload: { acknowledged_version: "CD-2026.1" }, as: Subscriber, as_user_id: "${sub1_id}" }
            - { call: "POST /satellite-broadband/subscriptions/${sn1_id}/authorize", payload: { authorization_mode: "FIXED" }, as: ProvisioningAgent }
            - call: "POST /satellite-broadband/subscribers"
              payload: { email: "sub2@example.com", full_name: "Sub Two", jurisdiction_code: "US-CA" }
              as: ProvisioningAgent
              captures: { sub2_id: "$.data.id" }
            - call: "POST /satellite-broadband/service-orders"
              payload: { subscriber_id: "${sub2_id}", service_cell_id: "${cell2_id}", requested_plan_id: "${plan_id}" }
              as: ProvisioningAgent
              captures: { order2_id: "$.data.id" }
            - call: "POST /satellite-broadband/roaming-authorizations"
              payload: { subscription_id: "${sn1_id}", mode: "PORTABILITY_MOVE", target_jurisdiction_code: "US-CA", target_service_cell_id: "${cell2_id}", effective_from: "2026-08-05T00:00:00Z", effective_until: "2026-08-06T00:00:00Z" }
              as: ProvisioningAgent
              captures: { ra1_id: "$.data.id" }
          trigger:
            - call: "POST /satellite-broadband/roaming-authorizations/${ra1_id}/decide"
              payload: { decision: "APPROVE", decision_note: "attempt to relocate onto a full cell" }
              as: ComplianceOfficer
              as_user_id: "compliance-user-1"
              captures: { err: "$.data.error_id" }
          assert:
            - "trigger response HTTP status == 409"
            - "trigger response: data.error_id == ERR_CELL_CAPACITY_EXHAUSTED"
            - "RoamingAuthorization.${ra1_id}.auth_state == REQUESTED"
            - "RoamingAuthorization.${ra1_id}.governing_license_id == null"
            - "Subscription.${sn1_id}.service_cell_id == ${cell_id}"
            - "ServiceCell.${cell2_id}.committed_terminal_count == 0 and reserved_slot_count == 1 and free_slot_count == 0"
            - "ServiceCell.${cell_id}.committed_terminal_count == 1"
            - "ServiceOrder.${order2_id}.order_state == RESERVED"

      - name: install_without_any_obstruction_scan_rejected_before_the_verdict_check
        claim_type: cascading_validation
        grounds:
          - validations[priority=31]
          - validations[priority=32]
          - 'errors[ERR_OBSTRUCTION_SCAN_REQUIRED]'
        distinguishing_aspect: "Priority 31 (a qualifying scan must exist) must run before priority 32 (the verdict must not be FAIL): on a DELIVERED terminal with zero scans the answer is ERR_OBSTRUCTION_SCAN_REQUIRED, not a verdict error and not the priority-9 state error."
        test_recipe:
          setup:
            - "Subscriber sub1@example.com owns terminal TRM-0001; it is DELIVERED (so the priority-9 gate passes) and has no ObstructionScan rows at all."
          setup_api_calls:
            - { call: "POST /satellite-broadband/_clock/set_current_utc", payload: { to_iso8601: "2026-08-01T00:00:00Z" }, as: NetworkOpsEngineer }
            - call: "POST /satellite-broadband/subscribers"
              payload: { email: "sub1@example.com", full_name: "Sub One", jurisdiction_code: "US-CA" }
              as: ProvisioningAgent
              captures: { sub1_id: "$.data.id" }
            - call: "POST /satellite-broadband/terminals"
              payload: { serial_number: "TRM-0001", subscriber_id: "${sub1_id}", warranty_expires_at: "2028-08-01T00:00:00Z" }
              as: LogisticsCoordinator
              captures: { term1_id: "$.data.id" }
            - { call: "POST /satellite-broadband/terminals/${term1_id}/deliver", payload: {}, as: LogisticsCoordinator }
          trigger:
            - call: "POST /satellite-broadband/terminals/${term1_id}/install"
              payload: {}
              as: Subscriber
              as_user_id: "${sub1_id}"
              captures: { err: "$.data.error_id" }
          assert:
            - "trigger response HTTP status == 422"
            - "trigger response: data.error_id == ERR_OBSTRUCTION_SCAN_REQUIRED (not ERR_OBSTRUCTION_VERDICT_FAIL, not ERR_TERMINAL_STATE_INVALID)"
            - "Terminal.${term1_id}.terminal_state == DELIVERED"
            - "Terminal.${term1_id}.installed_at == null and last_scan_verdict == null"
            - "GET /satellite-broadband/terminals/${term1_id}/obstruction-scans returns data.total_count == 0"

      - name: install_succeeds_when_the_newest_scan_verdict_is_only_marginal
        claim_type: satisfaction_pass
        grounds:
          - validations[priority=32]
          - entities.ObstructionScan.fields.scan_verdict
          - 'endpoints["POST /satellite-broadband/terminals/{id}/install"]'
        distinguishing_aspect: "Priority 32 blocks FAIL only: a 10/200 scan gives obstruction_pct 5.00 and verdict MARGINAL, which is inside the 2.00 < pct <= 8.00 band, so the install is accepted and the terminal records the MARGINAL verdict rather than being refused."
        test_recipe:
          setup:
            - "Subscriber sub1@example.com owns terminal TRM-0001; it is DELIVERED and its only scan is 10 obstructed of 200 samples."
          setup_api_calls:
            - { call: "POST /satellite-broadband/_clock/set_current_utc", payload: { to_iso8601: "2026-08-01T00:00:00Z" }, as: NetworkOpsEngineer }
            - call: "POST /satellite-broadband/subscribers"
              payload: { email: "sub1@example.com", full_name: "Sub One", jurisdiction_code: "US-CA" }
              as: ProvisioningAgent
              captures: { sub1_id: "$.data.id" }
            - call: "POST /satellite-broadband/terminals"
              payload: { serial_number: "TRM-0001", subscriber_id: "${sub1_id}", warranty_expires_at: "2028-08-01T00:00:00Z" }
              as: LogisticsCoordinator
              captures: { term1_id: "$.data.id" }
            - { call: "POST /satellite-broadband/terminals/${term1_id}/deliver", payload: {}, as: LogisticsCoordinator }
            - { call: "POST /satellite-broadband/terminals/${term1_id}/obstruction-scans", payload: { obstructed_sample_count: 10, total_sample_count: 200 }, as: Subscriber, as_user_id: "${sub1_id}" }
          trigger:
            - { call: "POST /satellite-broadband/terminals/${term1_id}/install", payload: {}, as: Subscriber, as_user_id: "${sub1_id}" }
          assert:
            - "trigger response HTTP status == 200"
            - "Terminal.${term1_id}.terminal_state == INSTALLED"
            - "Terminal.${term1_id}.installed_at == 2026-08-01T00:00:00.000Z"
            - "Terminal.${term1_id}.last_scan_verdict == MARGINAL"
            - "GET /satellite-broadband/terminals/${term1_id}/obstruction-scans returns data.items[0].obstruction_pct == 5.00 and data.items[0].scan_verdict == MARGINAL"

      - name: expired_reservation_outranks_a_suspended_beam_on_activation
        claim_type: priority_conflict
        grounds:
          - validations[priority=26]
          - validations[priority=38]
          - 'errors[ERR_RESERVATION_EXPIRED]'
        distinguishing_aspect: "Both the priority-26 temporal rule and the priority-38 beam-suspension rule are violated by the same POST /subscriptions; the response must be ERR_RESERVATION_EXPIRED, proving the fiscal/temporal check is evaluated before the safety check rather than in catalogue order."
        test_recipe:
          setup:
            - "Licence LIC-US-CA-KA-01 was ACTIVE + COORDINATED, beam BEAM-01 on it, cell CELL-001 (max 1), plan PLAN-P1-200."
            - "Order o1 was RESERVED at 2026-08-01 (hold to 2026-08-04) and terminal TRM-0001 is INSTALLED for sub1."
            - "The clock is at 2026-08-05T00:00:00Z and the licence has since been SUSPENDED, so BEAM-01 is SUSPENDED and the cell is CLOSED."
          setup_api_calls:
            - { call: "POST /satellite-broadband/_clock/set_current_utc", payload: { to_iso8601: "2026-08-01T00:00:00Z" }, as: NetworkOpsEngineer }
            - call: "POST /satellite-broadband/spectrum-licenses"
              payload: { license_code: "LIC-US-CA-KA-01", jurisdiction_code: "US-CA", frequency_band: "KA_FORWARD", max_eirp_dbw: 62.5, expires_at: "2027-12-31T00:00:00Z", consumer_disclosure_version: "CD-2026.1", in_motion_permitted: true }
              as: ComplianceOfficer
              captures: { lic_id: "$.data.id" }
            - { call: "POST /satellite-broadband/spectrum-licenses/${lic_id}/coordination", payload: { outcome: "GRANTED", coordination_note: "no neighbour objection" }, as: ComplianceOfficer }
            - call: "POST /satellite-broadband/beams"
              payload: { beam_code: "BEAM-01", satellite_code: "SAT-A", spectrum_license_id: "${lic_id}", forward_capacity_mbps: 100, oversubscription_limit: 4.0 }
              as: NetworkOpsEngineer
              captures: { beam_id: "$.data.id" }
            - call: "POST /satellite-broadband/service-cells"
              payload: { cell_code: "CELL-001", beam_id: "${beam_id}", jurisdiction_code: "US-CA", max_active_terminals: 1 }
              as: NetworkOpsEngineer
              captures: { cell_id: "$.data.id" }
            - call: "POST /satellite-broadband/service-plans"
              payload: { plan_code: "PLAN-P1-200", committed_rate_mbps: 200, priority_tier: "PRIORITY_1", monthly_fee_cents: 9900, priority_data_gb: 100, deprioritized_rate_mbps: 20, overage_rate_cents_per_gb: 25, roaming_allowed: true, in_motion_allowed: true }
              as: ProvisioningAgent
              captures: { plan_id: "$.data.id" }
            - call: "POST /satellite-broadband/subscribers"
              payload: { email: "sub1@example.com", full_name: "Sub One", jurisdiction_code: "US-CA" }
              as: ProvisioningAgent
              captures: { sub1_id: "$.data.id" }
            - call: "POST /satellite-broadband/service-orders"
              payload: { subscriber_id: "${sub1_id}", service_cell_id: "${cell_id}", requested_plan_id: "${plan_id}" }
              as: ProvisioningAgent
              captures: { order1_id: "$.data.id" }
            - call: "POST /satellite-broadband/terminals"
              payload: { serial_number: "TRM-0001", subscriber_id: "${sub1_id}", warranty_expires_at: "2028-08-01T00:00:00Z" }
              as: LogisticsCoordinator
              captures: { term1_id: "$.data.id" }
            - { call: "POST /satellite-broadband/terminals/${term1_id}/deliver", payload: {}, as: LogisticsCoordinator }
            - { call: "POST /satellite-broadband/terminals/${term1_id}/obstruction-scans", payload: { obstructed_sample_count: 1, total_sample_count: 200 }, as: Subscriber, as_user_id: "${sub1_id}" }
            - { call: "POST /satellite-broadband/terminals/${term1_id}/install", payload: {}, as: Subscriber, as_user_id: "${sub1_id}" }
            - { call: "POST /satellite-broadband/_clock/set_current_utc", payload: { to_iso8601: "2026-08-05T00:00:00Z" }, as: NetworkOpsEngineer }
            - { call: "POST /satellite-broadband/spectrum-licenses/${lic_id}/enforcement-action", payload: { action: "SUSPEND", reason: "interference investigation" }, as: ComplianceOfficer }
            - { call: "GET /satellite-broadband/service-cells/${cell_id}", payload: {}, as: ProvisioningAgent, captures: { cell_vnow: "$.data.version" } }
          trigger:
            - call: "POST /satellite-broadband/subscriptions"
              payload: { service_order_id: "${order1_id}", terminal_id: "${term1_id}", expected_service_cell_version: "${cell_vnow}" }
              as: ProvisioningAgent
              captures: { err: "$.data.error_id" }
          assert:
            - "trigger response HTTP status == 409"
            - "trigger response: data.error_id == ERR_RESERVATION_EXPIRED (NOT ERR_BEAM_SUSPENDED)"
            - "Beam.${beam_id}.beam_state == SUSPENDED (the lower-priority violation really was present)"
            - "ServiceOrder.${order1_id}.order_state == RESERVED"
            - "GET /satellite-broadband/subscriptions?service_order_id=${order1_id} returns data.total_count == 0"

      - name: beam_creation_with_an_out_of_range_oversubscription_limit_rejected
        claim_type: violation_error
        grounds:
          - validations[priority=4]
          - entities.Beam.fields.oversubscription_limit
          - 'errors[ERR_INVALID_REQUEST]'
        distinguishing_aspect: "The declared range is 1.0 .. 20.0, so 25.0 is refused 400 by the priority-4 field check before any FK resolution; no Beam row is created even though spectrum_license_id is valid."
        test_recipe:
          setup:
            - "Licence LIC-US-CA-KA-01 is ACTIVE + COORDINATED; no beams exist."
          setup_api_calls:
            - { call: "POST /satellite-broadband/_clock/set_current_utc", payload: { to_iso8601: "2026-08-01T00:00:00Z" }, as: NetworkOpsEngineer }
            - call: "POST /satellite-broadband/spectrum-licenses"
              payload: { license_code: "LIC-US-CA-KA-01", jurisdiction_code: "US-CA", frequency_band: "KA_FORWARD", max_eirp_dbw: 62.5, expires_at: "2027-12-31T00:00:00Z", consumer_disclosure_version: "CD-2026.1", in_motion_permitted: true }
              as: ComplianceOfficer
              captures: { lic_id: "$.data.id" }
            - { call: "POST /satellite-broadband/spectrum-licenses/${lic_id}/coordination", payload: { outcome: "GRANTED", coordination_note: "no neighbour objection" }, as: ComplianceOfficer }
          trigger:
            - call: "POST /satellite-broadband/beams"
              payload: { beam_code: "BEAM-01", satellite_code: "SAT-A", spectrum_license_id: "${lic_id}", forward_capacity_mbps: 100, oversubscription_limit: 25.0 }
              as: NetworkOpsEngineer
              captures: { err: "$.data.error_id" }
          assert:
            - "trigger response HTTP status == 400"
            - "trigger response: data.error_id == ERR_INVALID_REQUEST"
            - "GET /satellite-broadband/beams?spectrum_license_id=${lic_id} returns data.total_count == 0"

      - name: obstruction_scan_with_more_obstructed_than_total_samples_rejected
        claim_type: violation_error
        grounds:
          - validations[priority=4]
          - entities.ObstructionScan.fields.obstructed_sample_count
          - 'errors[ERR_INVALID_REQUEST]'
        distinguishing_aspect: "A cross-field constraint inside one payload: obstructed_sample_count 201 against total_sample_count 200 is impossible, so the scan is refused 400 and no ObstructionScan row is stored — last_scan_verdict stays null and the terminal remains uninstallable."
        test_recipe:
          setup:
            - "Subscriber sub1@example.com owns terminal TRM-0001, which is DELIVERED and has no scans."
          setup_api_calls:
            - { call: "POST /satellite-broadband/_clock/set_current_utc", payload: { to_iso8601: "2026-08-01T00:00:00Z" }, as: NetworkOpsEngineer }
            - call: "POST /satellite-broadband/subscribers"
              payload: { email: "sub1@example.com", full_name: "Sub One", jurisdiction_code: "US-CA" }
              as: ProvisioningAgent
              captures: { sub1_id: "$.data.id" }
            - call: "POST /satellite-broadband/terminals"
              payload: { serial_number: "TRM-0001", subscriber_id: "${sub1_id}", warranty_expires_at: "2028-08-01T00:00:00Z" }
              as: LogisticsCoordinator
              captures: { term1_id: "$.data.id" }
            - { call: "POST /satellite-broadband/terminals/${term1_id}/deliver", payload: {}, as: LogisticsCoordinator }
          trigger:
            - call: "POST /satellite-broadband/terminals/${term1_id}/obstruction-scans"
              payload: { obstructed_sample_count: 201, total_sample_count: 200 }
              as: Subscriber
              as_user_id: "${sub1_id}"
              captures: { err: "$.data.error_id" }
          assert:
            - "trigger response HTTP status == 400"
            - "trigger response: data.error_id == ERR_INVALID_REQUEST"
            - "GET /satellite-broadband/terminals/${term1_id}/obstruction-scans returns data.total_count == 0"
            - "Terminal.${term1_id}.last_scan_verdict == null and terminal_state == DELIVERED"

      - name: activation_blocked_by_a_terminal_that_is_only_delivered
        claim_type: cross_entity_validation
        grounds:
          - validations[priority=15]
          - 'errors[ERR_TERMINAL_NOT_INSTALLED]'
        excluded_because:
          difficulty_instance: cross_entity_state_dependency / activation_rejected_when_the_bound_terminal_is_only_delivered
          rationale: "The valid/invalid pair for this cross-entity precondition (INSTALLED admits, DELIVERED rejects) is asserted by that §1.8 instance."

      - name: higher_priority_error_wins_when_order_state_and_beam_capacity_both_fail
        claim_type: priority_ordering
        grounds:
          - validations[priority=10]
          - validations[priority=36]
        excluded_because:
          difficulty_instance: priority_pair_validation_conflict / order_state_conflict_outranks_beam_oversubscription_on_activation
          rationale: "That §1.8 instance violates both rules in one request and asserts the priority-10 error is returned, which is exactly this claim."

