  - rule_id: compensating_invariant
    instances:
      - name: plan_committed_cost_returns_to_baseline_after_create_then_cancel
        grounds:
          - state_machines.WorkOrder.SCHEDULED_to_CANCELLED
          - state_machines.WorkOrder.IN_PROGRESS_to_CANCELLED
          - calculations.farming_plan_committed_cost
          - calculations.work_order_cancellation_pay
          - entities.FarmingPlan.fields.budget_posture
        distinguishing_aspect: |
          Cancellation is a true compensation only from SCHEDULED: create-then-cancel restores
          committed_cost to exactly the 0.00 baseline and remaining_budget to 14687.50 with
          actual_labor_cost still null and payroll_status NOT_PAYABLE, whereas the same cancel
          after a start deliberately does NOT fully reverse — it substitutes reporting-time pay
          1017.72 and pushes payroll_status to PENDING. The invariant under test is
          committed_cost + remaining_budget == total_budget at every observation.
        test_recipe:
          setup:
            - "Contract C1 ACTIVE with block B-12 enrolled; plan P1 APPROVED with total_budget 14687.50, committed_cost 0.00, remaining_budget 14687.50, budget_posture WITHIN_BUDGET."
            - "PIECE_RATE crew CR1 ACTIVE (crew_size 12, base_hourly_rate 19.50, piece_rate_per_vine 0.65, vines_per_hour_standard 45)."
