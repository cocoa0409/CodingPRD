        grounds: ["roles[MillManager]", "validations[priority=3]", "errors[ERR_FORBIDDEN]"]
        distinguishing_aspect: "Customer role is absent from POST /api/ingredients roles -> 403 ERR_FORBIDDEN (valid body, so the role check is what fires)."
        test_recipe:
          setup: ["a customer exists"]
          setup_api_calls:
            - { call: "POST /api/customers", payload: { name: "Acme Farms", credit_limit_cents: 1000000 }, as: MillManager, captures: { cust_id: $.data.id } }
          trigger:
            - { call: "POST /api/ingredients", payload: { code: "CORN", name: "Yellow corn", hazard_class: "STANDARD", crude_protein_pct: 9.0, crude_fiber_pct: 2.2, metabolizable_energy_kcal_kg: 3300 }, as: Customer, as_user_id: "${cust_id}", captures: { err: $.data.error_id } }
          assert:
            - "error_id == ERR_FORBIDDEN, http 403"

      - name: operator_cannot_enter_sample_result
        claim_type: rbac_denial
        grounds: ["roles[QualityTech]", "errors[ERR_FORBIDDEN]"]
        distinguishing_aspect: "Operator role is absent from POST /api/samples and POST /api/samples/{id}/result -> 403; authorization (priority 3) fires before existence (priority 4), so even a placeholder sample id yields 403."
        test_recipe:
