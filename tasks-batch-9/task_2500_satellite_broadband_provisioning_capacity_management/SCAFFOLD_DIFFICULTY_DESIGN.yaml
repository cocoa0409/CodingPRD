      - name: cell_slot_ledger_conserved_across_activation_and_termination
        grounds:
          - calculations.cell_slot_availability
          - state_machines.Subscription.ACTIVE_to_TERMINATED
          - entities.ServiceCell.fields.committed_terminal_count
          - entities.ServiceCell.fields.free_slot_count
          - endpoints["POST /satellite-broadband/subscriptions/{id}/terminate"]
