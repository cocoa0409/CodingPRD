          setup:
            - "Logical clock at 2026-08-01T00:00:00Z."
            - "Carrier A (OCN 1234) ELIGIBLE in OH with a submitted 2026H1 filing computing to 93.33 and forecast [3000, 2000, 1000, 500]."
            - "NPA 614 / rate center COLUMBUS where carrier A holds two RESERVED, never-activated blocks 614-555-0 and 614-555-1, both due 2027-01-28T00:00:00Z."
