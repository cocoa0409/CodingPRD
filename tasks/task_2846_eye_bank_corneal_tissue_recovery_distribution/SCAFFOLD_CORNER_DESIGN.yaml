  - section: cross_cutting_complexity_layers
    instances:
      - name: a_stale_expected_tissue_version_on_the_second_evaluation_returns_412
        claim_type: optimistic_concurrency
        grounds:
          - "concurrency_rules[evaluation-create-stale-tissue]"
          - "errors[ERR_STALE_TISSUE_VERSION]"
          - "endpoints[POST /eye-bank/tissues/{id}/evaluations]"
        distinguishing_aspect: |
          The client reads the tissue once, posts the slit-lamp grading with the version it saw, and
          then posts the specular grading still echoing that same now-stale version. The second write
          must fail with 412 ERR_STALE_TISSUE_VERSION rather than succeed on a first-write-wins basis,
          and the retry carrying tissue_version_after from the first response must succeed — so the
          version is proven to advance by exactly one per accepted evaluation and not at all on the
          rejected one.
        test_recipe:
          setup:
            - "logical clock at 2026-08-03T06:00:00.000Z"
            - "one UNGRADED tissue from a COMPLETED recovery by technician A, with grading technician B"
