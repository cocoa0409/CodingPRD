              captures: { asg_o: $.data.id }
            - call: "POST /irb/protocols/${proto_id}/review-assignments"
              payload: { reviewer_id: "${rev_p}", reviewer_role: "SECONDARY" }
              as: IrbCoordinator
              captures: { asg_p: $.data.id }
            - call: "POST /irb/review-assignments/${asg_o}/respond"
              payload: { response: "ACCEPT" }
              as: Reviewer
              as_user_id: "${rev_o}"
            - call: "POST /irb/review-assignments/${asg_p}/respond"
