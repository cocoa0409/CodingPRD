          - state_machines.ArticulationRule.APPROVED_to_SUSPENDED
          - state_machines.PlaClaim.UNDER_ASSESSMENT_to_REVISION_REQUESTED
          - state_machines.AssessorAssignment.ACCEPTED_to_REVOKED
          - entities.FacultyAssessor.fields.active_assignment_count
          - entities.Student.fields.fee_paid_net_cents
          - endpoints[POST /credential-recommendations/{recommendation_id}/retire]
