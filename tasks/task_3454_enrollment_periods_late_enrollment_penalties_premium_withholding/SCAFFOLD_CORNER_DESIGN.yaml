            - "after cycle at 2027-05: status == EXPIRED"

  # =========================================================================
  # Section: calculations
  # =========================================================================
  - section: calculations
    instances:
      - name: sep_anchor_uses_earlier_of_employment_and_coverage_end
        claim_type: correct_result
        grounds: [calculations.calc_sep_window]
        distinguishing_aspect: "min() branch not exercised by the difficulty cascade: employment ends 2026-07 BEFORE coverage ends 2026-10, so the SEP anchors on employment -> [2026-08, 2027-03]."
        test_recipe:
          setup:
            - "Beneficiary created at clock 2026-01-05; VERIFIED ACME record (size 30, coverage from 2024-01)"
            - "Clock at 2026-11-01 so both end months are in the past"
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-01-05T00:00:00Z" }
              as: BenefitAdministrator
            - call: "POST /medicare/beneficiaries"
              payload: { full_name: "Sep Anchor", date_of_birth: "1961-03-10" }
              as: FieldOfficer
              captures: { b_id: "$.data.id" }
            - call: "POST /medicare/employer-coverages"
              payload: { beneficiary_id: "${b_id}", employer_name: "ACME", employer_size: 30, coverage_start_month: "2024-01" }
              as: Beneficiary
              as_user_id: "${b_id}"
              captures: { ec_id: "$.data.id" }
            - call: "POST /medicare/employer-coverages/${ec_id}/verify"
              payload: { decision: "VERIFIED" }
              as: FieldOfficer
              as_user_id: "fo-100"
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-11-01T00:00:00Z" }
              as: BenefitAdministrator
          trigger:
            - call: "POST /medicare/employer-coverages/${ec_id}/end"
              payload: { coverage_end_month: "2026-10", employment_end_month: "2026-07" }
              as: FieldOfficer
            - call: "GET /medicare/beneficiaries/${b_id}/enrollment-periods"
              as: FieldOfficer
              captures: { sep_start: "$.data[1].window_start_month", sep_end: "$.data[1].window_end_month", sep_type: "$.data[1].window_type" }
          assert:
            - "SEP row created (list index 1 after the IEP row, created_at ASC): window_type == SEP"
            - "window_start_month == \"2026-08\" (anchor = employment end 2026-07, the EARLIER end)"
            - "window_end_month == \"2027-03\" (anchor + 8, inclusive)"
      - name: payer_role_employer_size_twenty_boundary
        claim_type: constants_applied
        grounds: [calculations.calc_payer_role, entities.PayerCoordinationRecord.fields.role]
        distinguishing_aspect: "The >= 20 threshold is inclusive: size 20 -> MEDICARE_SECONDARY/LARGE_EMPLOYER; size 19 -> MEDICARE_PRIMARY/SMALL_EMPLOYER (basis updated in place on the open row)."
        test_recipe:
          setup:
            - "Two beneficiaries X (employer size 20) and Y (employer size 19), created at clock 2026-01-05; both records start 2024-01 and get VERIFIED"
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-01-05T00:00:00Z" }
              as: BenefitAdministrator
            - call: "POST /medicare/beneficiaries"
              payload: { full_name: "Size Twenty", date_of_birth: "1961-03-10" }
              as: FieldOfficer
              captures: { bx_id: "$.data.id" }
            - call: "POST /medicare/beneficiaries"
              payload: { full_name: "Size Nineteen", date_of_birth: "1961-03-10" }
              as: FieldOfficer
              captures: { by_id: "$.data.id" }
            - call: "POST /medicare/employer-coverages"
              payload: { beneficiary_id: "${bx_id}", employer_name: "BIGCO", employer_size: 20, coverage_start_month: "2024-01" }
              as: Beneficiary
              as_user_id: "${bx_id}"
              captures: { ecx_id: "$.data.id" }
            - call: "POST /medicare/employer-coverages"
              payload: { beneficiary_id: "${by_id}", employer_name: "SMALLCO", employer_size: 19, coverage_start_month: "2024-01" }
              as: Beneficiary
              as_user_id: "${by_id}"
              captures: { ecy_id: "$.data.id" }
          trigger:
            - call: "POST /medicare/employer-coverages/${ecx_id}/verify"
              payload: { decision: "VERIFIED" }
              as: FieldOfficer
              as_user_id: "fo-100"
            - call: "POST /medicare/employer-coverages/${ecy_id}/verify"
              payload: { decision: "VERIFIED" }
              as: FieldOfficer
              as_user_id: "fo-100"
            - call: "GET /medicare/beneficiaries/${bx_id}/payer-coordination"
              as: FieldOfficer
              captures: { x_role: "$.data[0].role", x_basis: "$.data[0].basis", x_start: "$.data[0].effective_start_month" }
            - call: "GET /medicare/beneficiaries/${by_id}/payer-coordination"
              as: FieldOfficer
              captures: { y_role: "$.data[0].role", y_basis: "$.data[0].basis" }
          assert:
            - "X: exactly one interval row, role == MEDICARE_SECONDARY, basis == LARGE_EMPLOYER, effective_start_month == \"2024-01\" (retroactive to coverage start; degenerate initial row removed)"
            - "Y: exactly one interval row, role == MEDICARE_PRIMARY, basis == SMALL_EMPLOYER (role unchanged, basis updated in place)"
      - name: creditable_months_reduce_part_b_gap_below_threshold
        claim_type: input_set_filtering
        grounds: [calculations.calc_lep_gap_months, calculations.calc_part_b_lep]
        distinguishing_aspect: "Input-set filtering: 12 VERIFIED employer-coverage months are subtracted from the 14-month span, leaving gap 2 -> floor(2/12) = 0 -> NO penalty assessment is created."
        test_recipe:
          setup:
            - "Rate schedule 2026; beneficiary DOB 1960-06-10 (IEP end 2025-09)"
            - "VERIFIED employer coverage 2024-01..2026-09 (ACME, size 30), ended at clock 2026-10-05 -> SEP [2026-10, 2027-05]"
          setup_api_calls:
            - call: "POST /medicare/rate-schedules"
              payload: { coverage_year: 2026, part_b_standard_cents: 18500, part_d_national_base_cents: 3450, irmaa_brackets: [ { tier: 0, single_floor_cents: 0, joint_floor_cents: 0, part_b_surcharge_cents: 0, part_d_surcharge_cents: 0 }, { tier: 1, single_floor_cents: 10000000, joint_floor_cents: 20000000, part_b_surcharge_cents: 7400, part_d_surcharge_cents: 1370 }, { tier: 2, single_floor_cents: 13300000, joint_floor_cents: 26600000, part_b_surcharge_cents: 18500, part_d_surcharge_cents: 3530 }, { tier: 3, single_floor_cents: 16700000, joint_floor_cents: 33400000, part_b_surcharge_cents: 29590, part_d_surcharge_cents: 5680 }, { tier: 4, single_floor_cents: 20000000, joint_floor_cents: 40000000, part_b_surcharge_cents: 40680, part_d_surcharge_cents: 7850 }, { tier: 5, single_floor_cents: 50000000, joint_floor_cents: 75000000, part_b_surcharge_cents: 44390, part_d_surcharge_cents: 8580 } ] }
              as: BenefitAdministrator
            - call: "POST /medicare/beneficiaries"
              payload: { full_name: "Cred It", date_of_birth: "1960-06-10" }
              as: FieldOfficer
              captures: { b_id: "$.data.id" }
            - call: "POST /medicare/employer-coverages"
              payload: { beneficiary_id: "${b_id}", employer_name: "ACME", employer_size: 30, coverage_start_month: "2024-01" }
              as: Beneficiary
              as_user_id: "${b_id}"
              captures: { ec_id: "$.data.id" }
            - call: "POST /medicare/employer-coverages/${ec_id}/verify"
              payload: { decision: "VERIFIED" }
              as: FieldOfficer
              as_user_id: "fo-100"
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-10-05T00:00:00Z" }
              as: BenefitAdministrator
            - call: "POST /medicare/employer-coverages/${ec_id}/end"
              payload: { coverage_end_month: "2026-09", employment_end_month: "2026-09" }
              as: FieldOfficer
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-11-10T00:00:00Z" }
              as: BenefitAdministrator
          trigger:
            - call: "POST /medicare/enrollments"
              payload: { beneficiary_id: "${b_id}", part: "PART_B" }
              as: Beneficiary
              as_user_id: "${b_id}"
              captures: { e_eff: "$.data.effective_month", e_via: "$.data.enrolled_via_window" }
            - call: "GET /medicare/beneficiaries/${b_id}/penalties"
              as: FieldOfficer
          assert:
            - "enrollment succeeds via SEP: effective_month == \"2026-12\", enrolled_via_window == SEP"
            - "span [2025-10 .. 2026-11] = 14 months minus 12 creditable months = 2 -> no PenaltyAssessment row (penalties list is EMPTY)"
      - name: part_b_lep_amount_floats_with_coverage_year_standard
        claim_type: constants_applied
        grounds: [calculations.calc_part_b_lep, entities.PremiumDetermination.fields.lep_cents]
        distinguishing_aspect: "The penalty PERCENT is lifetime-fixed (10%) but the CENT amount floats with each year's standard premium: 1850 against RS2026 (18500), 1900 against RS2027 (19000) — same assessment, two determinations."
        test_recipe:
          setup:
            - "Rate schedules 2026 + 2027; beneficiary DOB 1959-11-20 (IEP end 2025-02)"
            - "PART_B enrolled at clock 2026-03-10 (GEP -> effective 2026-04); gap 13 months -> penalty_pct 10"
            - "tax records 2024 and 2025 (both MAGI 5000000 SINGLE)"
          setup_api_calls:
            - call: "POST /medicare/rate-schedules"
              payload: { coverage_year: 2026, part_b_standard_cents: 18500, part_d_national_base_cents: 3450, irmaa_brackets: [ { tier: 0, single_floor_cents: 0, joint_floor_cents: 0, part_b_surcharge_cents: 0, part_d_surcharge_cents: 0 }, { tier: 1, single_floor_cents: 10000000, joint_floor_cents: 20000000, part_b_surcharge_cents: 7400, part_d_surcharge_cents: 1370 }, { tier: 2, single_floor_cents: 13300000, joint_floor_cents: 26600000, part_b_surcharge_cents: 18500, part_d_surcharge_cents: 3530 }, { tier: 3, single_floor_cents: 16700000, joint_floor_cents: 33400000, part_b_surcharge_cents: 29590, part_d_surcharge_cents: 5680 }, { tier: 4, single_floor_cents: 20000000, joint_floor_cents: 40000000, part_b_surcharge_cents: 40680, part_d_surcharge_cents: 7850 }, { tier: 5, single_floor_cents: 50000000, joint_floor_cents: 75000000, part_b_surcharge_cents: 44390, part_d_surcharge_cents: 8580 } ] }
              as: BenefitAdministrator
            - call: "POST /medicare/rate-schedules"
              payload: { coverage_year: 2027, part_b_standard_cents: 19000, part_d_national_base_cents: 3600, irmaa_brackets: [ { tier: 0, single_floor_cents: 0, joint_floor_cents: 0, part_b_surcharge_cents: 0, part_d_surcharge_cents: 0 }, { tier: 1, single_floor_cents: 10000000, joint_floor_cents: 20000000, part_b_surcharge_cents: 7600, part_d_surcharge_cents: 1400 }, { tier: 2, single_floor_cents: 13300000, joint_floor_cents: 26600000, part_b_surcharge_cents: 19000, part_d_surcharge_cents: 3620 }, { tier: 3, single_floor_cents: 16700000, joint_floor_cents: 33400000, part_b_surcharge_cents: 30400, part_d_surcharge_cents: 5830 }, { tier: 4, single_floor_cents: 20000000, joint_floor_cents: 40000000, part_b_surcharge_cents: 41800, part_d_surcharge_cents: 8060 }, { tier: 5, single_floor_cents: 50000000, joint_floor_cents: 75000000, part_b_surcharge_cents: 45600, part_d_surcharge_cents: 8810 } ] }
              as: BenefitAdministrator
            - call: "POST /medicare/beneficiaries"
              payload: { full_name: "Lep Float", date_of_birth: "1959-11-20" }
              as: FieldOfficer
              captures: { b_id: "$.data.id" }
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-03-10T00:00:00Z" }
