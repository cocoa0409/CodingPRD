            - "ArrivalBank.${bank_id}.status == EN_ROUTE and actual_start_minutes is null"
            - "Aircraft.${ac1_id}.status == LANDED, so the aircraft gate was satisfied and only the crew gate failed"

      - name: aircraft_begin_unload_while_the_bank_is_not_unloading_returns_bank_not_unloading
        claim_type: precondition_enforcement
        grounds:
          - state_machines.Aircraft.transitions.LANDED_to_UNLOADING
