            - "Trigger call 2 returns 400 ERR_INVALID_REQUEST (staffing_window_start and staffing_window_end missing) and GET /seasons still returns exactly 1 row"
            - "Trigger call 3 returns 400 ERR_INVALID_REQUEST (expected_room_version missing) - a 412 would be wrong, the field never reached the OCC comparison"
            - "WritersRoom.${rm}.open_seat_count == 3 and version == 2: the refused seat offer moved no counter"
            - "Trigger call 4 returns 400 ERR_INVALID_REQUEST (commitment_type has no default and is missing) and GET /availability-windows?writer_id=${w1} still returns exactly 1 row"

      - name: omitting_every_optional_agreement_field_applies_the_declared_defaults
        claim_type: defaults
        grounds:
