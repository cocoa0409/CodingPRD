  # ===========================================================================
  - rule_id: cross_entity_state_dependency
    instances:
      - name: program_activation_gated_on_network_registration_reaching_effective
        grounds:
          - state_machines.SurchargeProgram.PENDING_REGISTRATION_to_ACTIVE
          - state_machines.NetworkRegistration.ACKNOWLEDGED_to_EFFECTIVE
          - calculations.registration_notice_window
          - validations[priority=98]
          - validations[priority=94]
          - errors[ERR_REGISTRATION_NOT_EFFECTIVE]
          - errors[ERR_NOTICE_PERIOD_NOT_ELAPSED]
        distinguishing_aspect: |
          The GATED entity is SurchargeProgram and the GATING entity is its NetworkRegistration: activation is
          refused while the registration sits in ACKNOWLEDGED (ERR_REGISTRATION_NOT_EFFECTIVE) and the gate is
          opened not by touching the program at all but by advancing the OTHER entity to EFFECTIVE once the
          30-day notice window has elapsed.
        test_recipe:
          setup:
            - "AZ jurisdiction (no disclosure mandates), one merchant with docA, one SURCHARGE program in PENDING_REGISTRATION with a VISA/ALL rate rule at 2.19 percent."
            - "Its single VISA NetworkRegistration has been ACKNOWLEDGED but NOT effectuated; clock is still 2026-08-01T00:00:00Z."
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-08-01T00:00:00Z" }
              as: PlatformAdmin
              as_user_id: "admin-1"
            - call: "POST /jurisdictions"
              payload: { state_code: "AZ", surcharge_permitted: true, surcharge_cap_pct: 4.0, cash_discount_permitted: true, price_posting_required: false, disclosure_signage_required: false, receipt_line_item_required: false, ag_enforcement_posture: "PERMISSIVE" }
              as: PlatformAdmin
              as_user_id: "admin-1"
              captures: { jur_az_id: $.data.id }
            - call: "POST /merchants"
              payload: { jurisdiction_id: "${jur_az_id}", legal_name: "Sonoran Supply Co", mcc: "5734" }
              as: PlatformAdmin
              as_user_id: "admin-1"
              captures: { merch_id: $.data.id, merch_v0: $.data.version }
            - call: "POST /merchants/${merch_id}/cost-documentations"
              payload: { base_mdr_pct: 1.85, assessment_pct: 0.14, per_item_fee_cents: 10, evidence_uri: "s3://acq/az/2026-07.pdf", expected_merchant_version: "${merch_v0}" }
              as: ComplianceOfficer
              as_user_id: "officer-1"
              captures: { doc_a_id: $.data.id }
            - call: "POST /surcharge-programs"
              payload: { merchant_id: "${merch_id}", jurisdiction_id: "${jur_az_id}", cost_documentation_id: "${doc_a_id}", program_type: "SURCHARGE", consistency_scope: "BRAND_LEVEL" }
              as: ComplianceOfficer
              as_user_id: "officer-1"
              captures: { prog_id: $.data.id, prog_v0: $.data.version }
            - call: "POST /surcharge-programs/${prog_id}/rate-rules"
              payload: { brand: "VISA", product_tier: "ALL", rate_pct: 2.19, effective_from: "2026-08-01T00:00:00Z", effective_to: "2026-12-31T00:00:00Z", expected_program_version: "${prog_v0}" }
              as: ComplianceOfficer
              as_user_id: "officer-1"
            - call: "POST /surcharge-programs/${prog_id}/network-registrations"
              payload: { network: "VISA", registration_ref: "VS-2940-AZ-007" }
              as: ComplianceOfficer
              as_user_id: "officer-1"
              captures: { reg_id: $.data.id }
            - call: "POST /network-registrations/${reg_id}/decision"
              payload: { decision: "ACKNOWLEDGE", decision_note: "queued for effective date" }
              as: NetworkAuditor
              as_user_id: "auditor-1"
          trigger:
            - call: "POST /surcharge-programs/${prog_id}/activate"
              payload: {}
              as: ComplianceOfficer
              as_user_id: "officer-1"
            - call: "POST /network-registrations/${reg_id}/effectuate"
              payload: {}
              as: ComplianceOfficer
              as_user_id: "officer-1"
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-08-31T00:00:00Z" }
              as: PlatformAdmin
              as_user_id: "admin-1"
            - call: "POST /network-registrations/${reg_id}/effectuate"
              payload: {}
              as: ComplianceOfficer
              as_user_id: "officer-1"
            - call: "POST /surcharge-programs/${prog_id}/activate"
              payload: {}
              as: ComplianceOfficer
              as_user_id: "officer-1"
          assert:
            - "Trigger step 1 returns HTTP 409 with response.data.error_id == ERR_REGISTRATION_NOT_EFFECTIVE"
            - "SurchargeProgram.${prog_id}.status == PENDING_REGISTRATION after trigger step 1"
            - "Trigger step 2 returns HTTP 422 with response.data.error_id == ERR_NOTICE_PERIOD_NOT_ELAPSED"
            - "NetworkRegistration.${reg_id}.status == ACKNOWLEDGED after trigger step 2"
            - "Trigger step 4 returns HTTP 200 and NetworkRegistration.${reg_id}.status == EFFECTIVE and effective_at == 2026-08-31T00:00:00.000Z"
            - "Trigger step 5 returns HTTP 200 and SurchargeProgram.${prog_id}.status == ACTIVE"
            - "SurchargeProgram.${prog_id}.activated_at == 2026-08-31T00:00:00.000Z"

      - name: terminal_enforcement_gated_on_owning_program_not_being_suspended
        grounds:
          - state_machines.Terminal.CONFIGURED_to_ENFORCING
          - state_machines.SurchargeProgram.ACTIVE_to_SUSPENDED
          - state_machines.SurchargeProgram.SUSPENDED_to_ACTIVE
          - validations[priority=75]
          - errors[ERR_INVALID_PROGRAM_STATE]
        distinguishing_aspect: |
          The gated entity is a TERMINAL and the gating entity is its SurchargeProgram, and the gate here is
          closed by a REVERSIBLE state (SUSPENDED) rather than by a not-yet-reached one: the identical ENFORCE
          call on the identical CONFIGURED terminal fails with ERR_INVALID_PROGRAM_STATE and then succeeds after
          the program is RESUMEd, proving the check reads live program state at each attempt.
        test_recipe:
          setup:
            - "AZ jurisdiction, one merchant with docA, one ACTIVE SURCHARGE program (VISA/ALL at 2.19 percent, VISA registration EFFECTIVE) at clock 2026-08-31T00:00:00Z."
            - "One terminal on that program advanced PROVISIONED -> CONFIGURED (so the later program SUSPEND does not quarantine it), then the program is SUSPENDED."
