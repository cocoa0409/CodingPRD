  - section: validations
    instances:
      - name: missing_or_undeclared_role_header_returns_unauthenticated
        claim_type: violation_to_error
        grounds: ['validations[priority=1]', 'errors[ERR_UNAUTHENTICATED]']
        distinguishing_aspect: "Priority 1 fires before any resource lookup: an absent X-User-Role and an X-User-Role value that is not a declared role both return 401 ERR_UNAUTHENTICATED, never 404 or 403."
        test_recipe:
          setup: ["empty DB; clock at default"]
          setup_api_calls:
            - call: "POST /api/_clock/set_current_utc"
              payload: { to_iso8601: "2026-09-01T00:00:00Z" }
              as: PlatformAdmin
          trigger:
            - call: "GET /api/grants"
              payload: {}
              as: "<no headers>"
            - call: "GET /api/grants"
              payload: {}
              as: "Auditor"
          assert:
            - "first.code == 401 and first.data.error_id == \"ERR_UNAUTHENTICATED\""
            - "second.code == 401 and second.data.error_id == \"ERR_UNAUTHENTICATED\""

      - name: exclusive_operations_reject_other_roles_with_forbidden_role
        claim_type: violation_to_error
        grounds: ['validations[priority=2]', 'roles[ProgramManager].exclusive_operations', 'roles[IntakeSpecialist].exclusive_operations']
        distinguishing_aspect: "A declared but unauthorized role is refused at priority 2 with ERR_FORBIDDEN_ROLE before existence checks run, so an unknown path id still returns 403 rather than 404."
        test_recipe:
          setup: ["empty DB; clock at default"]
          setup_api_calls:
            - call: "POST /api/_clock/set_current_utc"
              payload: { to_iso8601: "2026-09-01T00:00:00Z" }
              as: PlatformAdmin
          trigger:
            - call: "POST /api/programs"
              payload: { name: "Housing First", service_domain: "HOUSING", faith_based_activity_offered: false, nondiscrimination_attested: true, capacity_slots: 3, match_eligible: true }
              as: ProgramManager
            - call: "POST /api/eligibility-screens/00000000-0000-4000-8000-000000000000/determine"
              payload: { determination: "ELIGIBLE" }
              as: IntakeSpecialist
            - call: "POST /api/service-deliveries/00000000-0000-4000-8000-000000000000/bill"
              payload: {}
              as: ProgramManager
          assert:
            - "first.code == 403 and first.data.error_id == \"ERR_FORBIDDEN_ROLE\""
            - "second.code == 403 and second.data.error_id == \"ERR_FORBIDDEN_ROLE\" (the undeclared path id is never resolved)"
            - "third.code == 403 and third.data.error_id == \"ERR_FORBIDDEN_ROLE\" (bill is exclusive to FinanceOfficer)"

      - name: client_role_reads_own_record_through_entity_backed_identity
        claim_type: rbac_identity
        grounds: ['roles[Client].identity', 'roles[Client].shared_operations', 'endpoints[GET /api/clients/{id}]']
        distinguishing_aspect: "With X-User-Role Client the X-User-ID must equal the persisted Client id, so the same id that works as the caller's identity also resolves the record."
        test_recipe:
          setup: ["one registered client; clock at default"]
          setup_api_calls:
            - call: "POST /api/_clock/set_current_utc"
              payload: { to_iso8601: "2026-09-01T00:00:00Z" }
