            - "${cas_allowed} == 3"
            - "first trigger call -> HTTP 201"
            - "HazmatUsePermit.${h_ok_id}.status == REQUESTED"
            - "HazmatUsePermit.${h_ok_id}.quantity_gal == 180.00"
            - "HazmatUsePermit.${h_ok_id}.control_area_index == 3"
            - "second trigger call -> HTTP 409 with error_id == ERR_CONTROL_AREA_MAQ_EXCEEDED"
            - "${err_over} == ERR_CONTROL_AREA_MAQ_EXCEEDED"
            - "GET /hazmat-permits?project_id=${pr_id} returns exactly 1 row"

      - name: suitability_height_boundary_12_50_scores_68_0_and_12_49_caps_to_49_0
        grounds:
          - calculations.suitability_score
          - entities.SuitabilityAssessment.fields.measured_floor_to_floor_ft
          - entities.SuitabilityAssessment.fields.hard_fail_capped
          - state_machines.SuitabilityAssessment.DRAFT_to_SUBMITTED
        distinguishing_aspect: |
          The marginal floor-to-floor threshold is inclusive at exactly 12.5 ft: 12.50 earns
          height_credit 60 and scores 68.0 / SUITABLE_WITH_CONVERSION, while 12.49 earns credit 0
          whose raw 53.0 is then pulled down by the hard-fail cap to exactly 49.0 / UNSUITABLE - a
          one-hundredth-of-a-foot input change that moves the score by 19.0 points and flips two
          different fields (hard_fail_capped and verdict).
        test_recipe:
          setup:
            - "Building 'Kendall Labs 400' in suitability_state DRAFT with published 14.0 ft / 95 psf / VC_C, 60000 CFM riser, 800 kW"
            - "Assessment A_hi (INVESTIGATION, measured height 12.50, live load 95, vibration VC_C) submitted and ACCEPTED -> building ASSESSED_CONDITIONAL"
            - "Assessment A_lo (INVESTIGATION, measured height 12.49, all other inputs identical) exists in DRAFT"
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { current_utc: "2026-08-01T00:00:00Z" }
              as: LandlordAssetManager
            - call: "POST /buildings"
              payload: { name: "Kendall Labs 400", address_city: "Cambridge", occupancy_status: "PARTIALLY_OCCUPIED", published_floor_to_floor_ft: 14.0, published_live_load_psf: 95, published_vibration_class: "VC_C", exhaust_riser_capacity_cfm: 60000, emergency_power_capacity_kw: 800, chilled_water_capacity_tons: 1200 }
              as: LandlordAssetManager
              captures: { b_id: $.data.id }
            - call: "POST /buildings/${b_id}/suitability-assessments"
              payload: { assessment_basis: "INVESTIGATION", required_vibration_class: "VC_C", required_exhaust_cfm: 50000, required_power_kw: 700, measured_floor_to_floor_ft: 12.50, measured_live_load_psf: 95, measured_vibration_class: "VC_C" }
              as: BaseBuildingEngineer
              captures: { a_hi_id: $.data.id }
            - call: "POST /suitability-assessments/${a_hi_id}/submit"
              payload: {}
              as: BaseBuildingEngineer
              captures: { hi_score: $.data.suitability_score, hi_verdict: $.data.verdict }
            - call: "POST /suitability-assessments/${a_hi_id}/decision"
              payload: { decision: "ACCEPT" }
              as: LandlordAssetManager
              captures: { state_after_hi: $.data.status }
            - call: "POST /buildings/${b_id}/suitability-assessments"
              payload: { assessment_basis: "INVESTIGATION", required_vibration_class: "VC_C", required_exhaust_cfm: 50000, required_power_kw: 700, measured_floor_to_floor_ft: 12.49, measured_live_load_psf: 95, measured_vibration_class: "VC_C" }
              as: BaseBuildingEngineer
              captures: { a_lo_id: $.data.id }
          trigger:
            - call: "POST /suitability-assessments/${a_lo_id}/submit"
              payload: {}
              as: BaseBuildingEngineer
              captures: { lo_score: $.data.suitability_score, lo_verdict: $.data.verdict }
          assert:
            - "${hi_score} == 68.0"
            - "${hi_verdict} == SUITABLE_WITH_CONVERSION"
            - "SuitabilityAssessment.${a_hi_id}.height_credit == 60"
            - "SuitabilityAssessment.${a_hi_id}.hard_fail_capped == false"
            - "SuitabilityAssessment.${a_lo_id}.suitability_score == 49.0"
            - "SuitabilityAssessment.${a_lo_id}.verdict == UNSUITABLE"
            - "SuitabilityAssessment.${a_lo_id}.height_credit == 0"
            - "SuitabilityAssessment.${a_lo_id}.structural_credit == 60"
            - "SuitabilityAssessment.${a_lo_id}.vibration_credit == 100"
            - "SuitabilityAssessment.${a_lo_id}.utility_credit == 60"
            - "SuitabilityAssessment.${a_lo_id}.hard_fail_capped == true"
            - "Building.${b_id}.suitability_state == ASSESSING"
            - "Building.${b_id}.latest_assessment_verdict == SUITABLE_WITH_CONVERSION"

  # ===========================================================================
  # RULE 7 - cross_entity_state_dependency
  # ===========================================================================
  - rule_id: cross_entity_state_dependency
    instances:
      - name: permit_application_gated_on_lab_exhaust_scope_item_state
        grounds:
          - validations[priority=40]
          - state_machines.FitOutProject.P_UNPERMITTED_to_P_APPLIED
          - state_machines.ConversionScopeItem.PLANNED_to_COMPLETE
          - entities.ConversionScopeItem.fields.status
        distinguishing_aspect: |
          The FitOutProject's own fields are complete and its lease is EXECUTED, yet the permit
          application is refused with ERR_EXHAUST_SCOPE_INCOMPLETE purely because a different
          aggregate - the building's LAB_EXHAUST ConversionScopeItem - is not yet COMPLETE; the
          identical request succeeds the moment that unrelated row transitions, with nothing about
          the project or lease having changed.
        test_recipe:
          setup:
            - "Building conversion-approved (verdict SUITABLE) with its LAB_EXHAUST ConversionScopeItem still in PLANNED"
            - "Lease executed on floor 2; project PR created with permit_status = P_UNPERMITTED"
