            - call: "POST /annexation-cases"
              payload: { municipality_id: "${muni_r4}", method: "INVOLUNTARY_ORDINANCE", shared_boundary_feet: 20000, total_lot_count: 1, developed_lot_count: 1, dwelling_units: 4 }
