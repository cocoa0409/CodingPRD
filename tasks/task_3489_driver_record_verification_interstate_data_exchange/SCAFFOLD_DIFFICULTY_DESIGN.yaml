              payload: { record_id: "${r_id}", start_date: "2026-09-10", end_date: "2026-10-10" }
              as: AuditAuthority
              captures: { dq1_id: $.data.id }
            - call: "POST /driver-exchange/disqualifications"
              payload: { record_id: "${r_id}", start_date: "2026-10-10", end_date: "2026-11-09" }
              as: AuditAuthority
              captures: { err: $.data.error_id }
            - call: "POST /driver-exchange/disqualifications"
              payload: { record_id: "${r_id}", start_date: "2026-10-11", end_date: "2026-11-09" }
              as: AuditAuthority
              captures: { dq2_id: $.data.id }
