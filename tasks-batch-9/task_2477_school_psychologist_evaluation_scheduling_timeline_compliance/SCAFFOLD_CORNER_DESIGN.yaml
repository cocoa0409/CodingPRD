      - name: duplicate_building_code_is_case_sensitive
        claim_type: violation_to_error
        grounds:
          - validations[priority=25]
          - errors.ERR_DUPLICATE_BUILDING_CODE
          - entities.School.fields.building_code
        distinguishing_aspect: "Uniqueness is exact and case-SENSITIVE: \"FG50\" twice is a 409, but \"fg50\" alongside \"FG50\" is accepted — an implementation that folds case would wrongly reject it."
        test_recipe:
          setup:
            - "Clock 2026-08-01T00:00:00Z; one School with building_code FG50."
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { current_utc: "2026-08-01T00:00:00Z" }
              as: DistrictAdmin
            - call: "POST /psych-services/schools"
              payload: { name: "Fairground High", building_code: "FG50", grade_band: "HIGH", concurrent_meeting_capacity: 2, enrollment_count: 810 }
              as: DistrictAdmin
              captures: { s1: $.data.id }
          trigger:
            - call: "POST /psych-services/schools"
              payload: { name: "Fairground Annex", building_code: "FG50", grade_band: "HIGH", concurrent_meeting_capacity: 1, enrollment_count: 90 }
              as: DistrictAdmin
          assert:
            - "HTTP 409 with data.error_id == \"ERR_DUPLICATE_BUILDING_CODE\" and no second School created"
            - "The same payload with building_code \"fg50\" returns HTTP 201 (case-sensitive exact match)"

      - name: consent_waiver_requires_reevaluation_and_reason
        claim_type: violation_to_error
        grounds:
          - validations[priority=24]
          - errors.ERR_WAIVER_NOT_APPLICABLE
          - state_machines.Referral.INTAKE_RECEIVED_to_CONSENT_WAIVED
        distinguishing_aspect: "Two independent clauses share one error: an INITIAL referral can never waive, and a REEVALUATION with an empty waiver_reason fails too — so the rule is not satisfied by referral_type alone."
        test_recipe:
          setup:
            - "Clock 2026-08-01T00:00:00Z; one School; one consented INITIAL referral supplying a prior_evaluation_id."
            - "Referral W: INITIAL, INTAKE_RECEIVED. Referral V: REEVALUATION of that evaluation, INTAKE_RECEIVED."
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { current_utc: "2026-08-01T00:00:00Z" }
              as: DistrictAdmin
            - call: "POST /psych-services/schools"
              payload: { name: "Gladewood Elementary", building_code: "GW51", grade_band: "ELEMENTARY", concurrent_meeting_capacity: 2, enrollment_count: 340 }
              as: DistrictAdmin
              captures: { s1: $.data.id }
            - call: "POST /psych-services/referrals"
              payload: { school_id: "${s1}", student_local_id: "STU-36", referral_type: "INITIAL", requested_domains: ["COGNITIVE"] }
              as: IntakeCoordinator
              captures: { r0: $.data.id }
            - call: "POST /psych-services/referrals/${r0}/consent-events"
              payload: { event_type: "CONSENT_RECEIVED", effective_at: "2026-08-01T09:00:00Z", parent_signature_reference: "SIG-36" }
              as: IntakeCoordinator
              captures: { eval0: $.data.active_evaluation_id }
            - call: "POST /psych-services/referrals"
              payload: { school_id: "${s1}", student_local_id: "STU-37", referral_type: "INITIAL", requested_domains: ["COGNITIVE"] }
              as: IntakeCoordinator
              captures: { rw: $.data.id }
            - call: "POST /psych-services/referrals"
              payload: { school_id: "${s1}", student_local_id: "STU-36", referral_type: "REEVALUATION", prior_evaluation_id: "${eval0}", requested_domains: ["COGNITIVE"] }
              as: IntakeCoordinator
              captures: { rv: $.data.id }
          trigger:
            - call: "POST /psych-services/referrals/${rw}/consent-events"
              payload: { event_type: "CONSENT_WAIVED", effective_at: "2026-08-01T10:00:00Z", waiver_reason: "Family declined a full reevaluation." }
              as: IntakeCoordinator
          assert:
            - "HTTP 422 with data.error_id == \"ERR_WAIVER_NOT_APPLICABLE\" — Referral ${rw} is INITIAL"
            - "Referral.${rw}.status is still INTAKE_RECEIVED with active_evaluation_id == null and waiver_reason == null"
            - "The same event on the REEVALUATION ${rv} with waiver_reason \"\" is ALSO rejected with ERR_WAIVER_NOT_APPLICABLE (non-empty string clause)"
            - "The same event on ${rv} with a non-empty waiver_reason returns HTTP 200 with status == CONSENT_WAIVED"

      - name: consent_effective_at_in_the_future_rejected
        claim_type: violation_to_error
        grounds:
          - validations[priority=20]
          - errors.ERR_CONSENT_TIMESTAMP_FUTURE
          - endpoints["POST /_clock/set_current_utc"]
        distinguishing_aspect: "The comparison is <= against the logical clock instant, so a timestamp one second ahead fails while a timestamp EXACTLY equal to the clock is accepted — and the accepted event starts the statutory clock on that same UTC date."
        test_recipe:
          setup:
            - "Clock 2026-08-01T00:00:00Z; one School; one INITIAL 1-domain referral in INTAKE_RECEIVED."
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { current_utc: "2026-08-01T00:00:00Z" }
              as: DistrictAdmin
            - call: "POST /psych-services/schools"
              payload: { name: "Havenhill Middle", building_code: "HH52", grade_band: "MIDDLE", concurrent_meeting_capacity: 2, enrollment_count: 455 }
              as: DistrictAdmin
              captures: { s1: $.data.id }
            - call: "POST /psych-services/referrals"
              payload: { school_id: "${s1}", student_local_id: "STU-38", referral_type: "INITIAL", requested_domains: ["COGNITIVE"] }
              as: IntakeCoordinator
              captures: { r1: $.data.id }
          trigger:
            - call: "POST /psych-services/referrals/${r1}/consent-events"
              payload: { event_type: "CONSENT_RECEIVED", effective_at: "2026-08-01T00:00:01Z", parent_signature_reference: "SIG-38" }
              as: IntakeCoordinator
          assert:
            - "HTTP 422 with data.error_id == \"ERR_CONSENT_TIMESTAMP_FUTURE\""
            - "Referral.${r1}.status is still INTAKE_RECEIVED, consent_received_at == null, active_evaluation_id == null, and no Evaluation exists"
            - "The same call with effective_at exactly \"2026-08-01T00:00:00Z\" returns HTTP 200 and the new Evaluation has clock_start_date == \"2026-08-01\""

      - name: receipt_quantity_bounds_enforced
        claim_type: violation_to_error
        grounds:
          - validations[priority=30]
          - errors.ERR_RECEIPT_QUANTITY_EXCEEDS_ORDER
          - state_machines.ProtocolOrder.APPROVED_to_RECEIVED
        distinguishing_aspect: "Both ends of the receipt window are closed: 31 against a 30-unit order and 0 are each 422s, while a PARTIAL receipt of 29 is legal and credits exactly 29 booklets."
        test_recipe:
          setup:
            - "Clock 2026-08-01T00:00:00Z; one AssessmentInstrument (unit cost 1799, stock 0)."
            - "One 30-unit non-rush order (total 47681, so SUBMITTED) approved by the DistrictAdmin."
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { current_utc: "2026-08-01T00:00:00Z" }
              as: DistrictAdmin
            - call: "POST /psych-services/assessment-instruments"
              payload: { name: "TOWL-4", instrument_code: "TOWL4", protocol_stock_count: 0, protocol_units_per_administration: 1, protocol_unit_cost_cents: 1799, license_seat_total: 1, license_expires_on: "2027-06-30", supported_language_editions: ["en"] }
              as: DistrictAdmin
              captures: { inst: $.data.id }
            - call: "POST /psych-services/protocol-orders"
              payload: { instrument_id: "${inst}", quantity_requested: 30, rush_flag: false }
              as: PsychServicesSupervisor
              captures: { order1: $.data.id }
            - call: "POST /psych-services/protocol-orders/${order1}/decision"
              payload: { decision: "APPROVE" }
              as: DistrictAdmin
          trigger:
            - call: "POST /psych-services/protocol-orders/${order1}/receive"
              payload: { received_quantity: 31 }
              as: PsychServicesSupervisor
          assert:
            - "HTTP 422 with data.error_id == \"ERR_RECEIPT_QUANTITY_EXCEEDS_ORDER\""
            - "ProtocolOrder.${order1}.status is still APPROVED with received_quantity == 0 and AssessmentInstrument.${inst}.protocol_stock_count == 0"
            - "received_quantity: 0 is rejected with the same error (the >= 1 clause)"
            - "received_quantity: 29 returns HTTP 200 with status == RECEIVED and protocol_stock_count == 29 — a partial receipt is legal"

      - name: remedy_award_cap_is_never_silently_clamped
        claim_type: violation_to_error
        grounds:
          - validations[priority=31]
          - errors.ERR_REMEDY_MINUTES_EXCEED_CAP
          - calculations.compensatory_minutes
        distinguishing_aspect: "A 40-day SEVERE breach lands the day basis EXACTLY on REMEDY_MINUTES_CAP (1800), so additional_minutes 5 must be rejected rather than clamped — while the SAME breach on the missed-service basis (1350 + 5) is accepted, proving the cap is checked after basis selection."
        test_recipe:
          setup:
            - "Clock 2026-06-01T00:00:00Z; one School; one INITIAL 1-domain referral consented effective 2026-06-01 (base_due_date 2026-07-31), left PENDING_ASSIGNMENT."
            - "Clock advanced to 2026-09-09T00:00:00Z (100 elapsed days, days_remaining -40) and a compliance run executed, creating one TimelineBreach with breach_days 40 / SEVERE."
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { current_utc: "2026-06-01T00:00:00Z" }
              as: DistrictAdmin
            - call: "POST /psych-services/schools"
              payload: { name: "Ivywood High", building_code: "IV53", grade_band: "HIGH", concurrent_meeting_capacity: 2, enrollment_count: 690 }
              as: DistrictAdmin
              captures: { s1: $.data.id }
