# =============================================================================
# §1.9 Scaffold Corner Design (Coverage Index for Non-Difficulty Tests)
# Online Course Marketplace — breadth probe over §1.1–§1.7. Sections/claim_types
# come from references/claim-extraction-guide.md. excluded_because stubs cite a
# §1.8 instance by name. Every active test_recipe call resolves to §1.5; every
# ${var} is bound by an earlier captures:.
# =============================================================================
scaffold_corner_design:

  # ===========================================================================
  - section: entities
    instances:
      - name: create_course_returns_201_with_defaults_applied
        claim_type: Creation
        grounds: [entities.Course, endpoints]
        distinguishing_aspect: "POST /courses with only required fields returns 201; defaults passing_score_pct=0.70, refund_window_days=30, drip_enabled=false, ceu_credits=0.0, completion_threshold_pct=1.00, status=DRAFT."
        test_recipe:
          setup: ["One instructor exists."]
          setup_api_calls:
            - call: "POST /instructors"
              payload: { display_name: "Inst", email: "e1@x.com", revenue_share_pct: 0.50 }
              as: Anonymous
              captures: { inst_id: $.data.id }
          trigger:
            - call: "POST /courses"
              payload: { instructor_id: "${inst_id}", title: "Defaults", list_price_cents: 1000 }
              as: Instructor
              as_user_id: "${inst_id}"
              captures: { course_id: $.data.id, status: $.data.status }
          assert:
            - "response status code == 201"
            - "Course.status == DRAFT, passing_score_pct == 0.70, refund_window_days == 30, drip_enabled == false, completion_threshold_pct == 1.0"

      - name: instructor_revenue_share_default_applied
        claim_type: Defaults
        grounds: [entities.Instructor.fields.revenue_share_pct]
        distinguishing_aspect: "Omitting revenue_share_pct on POST /instructors applies the 0.50 default."
        test_recipe:
          setup: ["Empty DB."]
          setup_api_calls: []
          trigger:
            - call: "POST /instructors"
              payload: { display_name: "NoShare", email: "ns@x.com" }
              as: Anonymous
              captures: { share: $.data.revenue_share_pct }
          assert:
            - "Instructor.revenue_share_pct == 0.50 (default applied)"

      - name: get_course_not_found_returns_404
        claim_type: Not Found
        grounds: [entities.Course, "errors[ERR_NOT_FOUND]"]
        distinguishing_aspect: "GET /courses/{id} for a non-existent UUID returns ERR_NOT_FOUND (404)."
        test_recipe:
          setup: ["One instructor (acts as reader)."]
          setup_api_calls:
            - call: "POST /instructors"
              payload: { display_name: "R", email: "r@x.com", revenue_share_pct: 0.50 }
              as: Anonymous
              captures: { inst_id: $.data.id }
          trigger:
            - call: "GET /courses/00000000-0000-4000-8000-000000000000"
              payload: {}
              as: Instructor
              as_user_id: "${inst_id}"
              captures: { err: $.data.error_id }
          assert:
            - "response status code == 404"
            - "data.error_id == ERR_NOT_FOUND"

      - name: create_course_missing_required_field_returns_invalid_request
        claim_type: Required Fields
        grounds: [entities.Course.fields.list_price_cents, "validations[priority=11]", "errors[ERR_INVALID_REQUEST]"]
        distinguishing_aspect: "POST /courses without list_price_cents (required input, no default) returns ERR_INVALID_REQUEST (400)."
        test_recipe:
          setup: ["One instructor."]
          setup_api_calls:
            - call: "POST /instructors"
              payload: { display_name: "I", email: "i@x.com", revenue_share_pct: 0.50 }
              as: Anonymous
              captures: { inst_id: $.data.id }
          trigger:
            - call: "POST /courses"
              payload: { instructor_id: "${inst_id}", title: "NoPrice" }
              as: Instructor
              as_user_id: "${inst_id}"
              captures: { err: $.data.error_id }
          assert:
            - "response status code == 400"
            - "data.error_id == ERR_INVALID_REQUEST"

      - name: review_stars_out_of_range_returns_invalid_request
        claim_type: Type Constraints
        grounds: [entities.Review.fields.stars, "validations[priority=11]", "errors[ERR_INVALID_REQUEST]"]
        distinguishing_aspect: "POST /reviews with stars=6 (outside 1–5) returns ERR_INVALID_REQUEST (400)."
        test_recipe:
          setup: ["Learner with a COMPLETED single-lesson enrollment at clock 2026-06-01."]
          setup_api_calls:
            - call: "POST /instructors"
              payload: { display_name: "I2", email: "i2@x.com", revenue_share_pct: 0.50 }
              as: Anonymous
              captures: { inst_id: $.data.id }
            - call: "POST /learners"
              payload: { full_name: "Lrn", email: "lrn@x.com" }
              as: Anonymous
              captures: { learner_id: $.data.id }
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-06-01T00:00:00Z" }
              as: PlatformAdmin
            - call: "POST /courses"
              payload: { instructor_id: "${inst_id}", title: "RC", list_price_cents: 0, completion_threshold_pct: 1.00 }
              as: Instructor
              as_user_id: "${inst_id}"
              captures: { course_id: $.data.id }
            - call: "POST /lessons"
              payload: { course_id: "${course_id}", title: "L1", order_index: 1 }
              as: Instructor
              as_user_id: "${inst_id}"
              captures: { lesson_id: $.data.id }
            - call: "POST /courses/${course_id}/publish"
              payload: {}
              as: Instructor
              as_user_id: "${inst_id}"
            - call: "POST /courses/${course_id}/enroll"
              payload: { learner_id: "${learner_id}" }
              as: Learner
              as_user_id: "${learner_id}"
              captures: { enr_id: $.data.id }
            - call: "POST /lesson-completions"
              payload: { enrollment_id: "${enr_id}", lesson_id: "${lesson_id}" }
              as: Learner
              as_user_id: "${learner_id}"
          trigger:
            - call: "POST /reviews"
              payload: { enrollment_id: "${enr_id}", stars: 6, body: "too high" }
              as: Learner
              as_user_id: "${learner_id}"
              captures: { err: $.data.error_id }
          assert:
            - "response status code == 400"
            - "data.error_id == ERR_INVALID_REQUEST"

      - name: enrollment_system_fields_generated_input_ignored
        claim_type: System Fields
        grounds: [entities.Enrollment.fields.gross_price_cents, entities.Enrollment.fields.status]
        distinguishing_aspect: "POST /courses/{id}/enroll computes gross_price_cents/status server-side; client cannot set them (not in input schema)."
        test_recipe:
          setup: ["PUBLISHED course list 2000c; learner."]
          setup_api_calls:
            - call: "POST /instructors"
              payload: { display_name: "I3", email: "i3@x.com", revenue_share_pct: 0.50 }
              as: Anonymous
              captures: { inst_id: $.data.id }
            - call: "POST /learners"
              payload: { full_name: "Ln3", email: "ln3@x.com" }
              as: Anonymous
              captures: { learner_id: $.data.id }
            - call: "POST /courses"
              payload: { instructor_id: "${inst_id}", title: "Sys", list_price_cents: 2000 }
              as: Instructor
              as_user_id: "${inst_id}"
              captures: { course_id: $.data.id }
            - call: "POST /lessons"
              payload: { course_id: "${course_id}", title: "L1", order_index: 1 }
              as: Instructor
              as_user_id: "${inst_id}"
            - call: "POST /courses/${course_id}/publish"
              payload: {}
              as: Instructor
              as_user_id: "${inst_id}"
          trigger:
            - call: "POST /courses/${course_id}/enroll"
              payload: { learner_id: "${learner_id}" }
              as: Learner
              as_user_id: "${learner_id}"
              captures: { gross: $.data.gross_price_cents, status: $.data.status }
          assert:
            - "Enrollment.gross_price_cents == 2000 (server-computed) and status == ACTIVE"
            - "Enrollment.version == 1"

  # ===========================================================================
  - section: state_machines
    instances:
      - name: publish_from_published_returns_invalid_state
        claim_type: Invalid Transitions
        grounds: [state_machines.Course.DRAFT_to_PUBLISHED, "errors[ERR_INVALID_STATE]"]
        distinguishing_aspect: "Publishing a course already PUBLISHED returns ERR_INVALID_STATE (409); no side effects fire."
        test_recipe:
          setup: ["A PUBLISHED course with one lesson."]
          setup_api_calls:
            - call: "POST /instructors"
              payload: { display_name: "I4", email: "i4@x.com", revenue_share_pct: 0.50 }
              as: Anonymous
              captures: { inst_id: $.data.id }
            - call: "POST /courses"
              payload: { instructor_id: "${inst_id}", title: "Pub", list_price_cents: 1000 }
              as: Instructor
              as_user_id: "${inst_id}"
              captures: { course_id: $.data.id }
            - call: "POST /lessons"
              payload: { course_id: "${course_id}", title: "L1", order_index: 1 }
              as: Instructor
              as_user_id: "${inst_id}"
            - call: "POST /courses/${course_id}/publish"
              payload: {}
              as: Instructor
              as_user_id: "${inst_id}"
          trigger:
            - call: "POST /courses/${course_id}/publish"
              payload: {}
              as: Instructor
              as_user_id: "${inst_id}"
              captures: { err: $.data.error_id }
          assert:
            - "response status code == 409"
            - "data.error_id == ERR_INVALID_STATE"

      - name: publish_course_with_no_lessons_returns_not_publishable
        claim_type: Precondition Enforcement
        grounds: [state_machines.Course.DRAFT_to_PUBLISHED, "validations[priority=5]", "errors[ERR_COURSE_NOT_PUBLISHABLE]"]
        distinguishing_aspect: "Publishing a DRAFT course with zero lessons returns ERR_COURSE_NOT_PUBLISHABLE (422)."
        test_recipe:
          setup: ["A DRAFT course with no lessons."]
          setup_api_calls:
            - call: "POST /instructors"
              payload: { display_name: "I5", email: "i5@x.com", revenue_share_pct: 0.50 }
              as: Anonymous
              captures: { inst_id: $.data.id }
            - call: "POST /courses"
              payload: { instructor_id: "${inst_id}", title: "Empty", list_price_cents: 1000 }
              as: Instructor
              as_user_id: "${inst_id}"
              captures: { course_id: $.data.id }
          trigger:
            - call: "POST /courses/${course_id}/publish"
              payload: {}
              as: Instructor
              as_user_id: "${inst_id}"
              captures: { err: $.data.error_id }
          assert:
            - "response status code == 422"
            - "data.error_id == ERR_COURSE_NOT_PUBLISHABLE"

      - name: publish_graded_lesson_missing_questions_not_publishable
        claim_type: Precondition Enforcement
        grounds: [state_machines.Course.DRAFT_to_PUBLISHED, "errors[ERR_COURSE_NOT_PUBLISHABLE]"]
        distinguishing_aspect: "Publishing a course with a graded lesson having question_count=0 returns ERR_COURSE_NOT_PUBLISHABLE (422)."
        test_recipe:
          setup: ["A DRAFT course with one graded lesson question_count=0."]
          setup_api_calls:
            - call: "POST /instructors"
              payload: { display_name: "I6", email: "i6@x.com", revenue_share_pct: 0.50 }
              as: Anonymous
              captures: { inst_id: $.data.id }
            - call: "POST /courses"
              payload: { instructor_id: "${inst_id}", title: "BadGrade", list_price_cents: 1000 }
              as: Instructor
              as_user_id: "${inst_id}"
              captures: { course_id: $.data.id }
            - call: "POST /lessons"
              payload: { course_id: "${course_id}", title: "G", order_index: 1, is_graded: true, quiz_weight: 2, question_count: 0 }
              as: Instructor
              as_user_id: "${inst_id}"
          trigger:
            - call: "POST /courses/${course_id}/publish"
              payload: {}
              as: Instructor
              as_user_id: "${inst_id}"
              captures: { err: $.data.error_id }
          assert:
            - "response status code == 422"
            - "data.error_id == ERR_COURSE_NOT_PUBLISHABLE"

      - name: unpublish_blocks_new_enrollment_invalid_state
        claim_type: Valid Transition
        grounds: [state_machines.Course.PUBLISHED_to_UNPUBLISHED, "errors[ERR_INVALID_STATE]"]
        distinguishing_aspect: "After PUBLISHED->UNPUBLISHED, POST /courses/{id}/enroll is rejected with ERR_INVALID_STATE (course not enrollable)."
        test_recipe:
          setup: ["A PUBLISHED course then UNPUBLISHED; a learner."]
          setup_api_calls:
            - call: "POST /instructors"
              payload: { display_name: "I7", email: "i7@x.com", revenue_share_pct: 0.50 }
              as: Anonymous
              captures: { inst_id: $.data.id }
            - call: "POST /learners"
              payload: { full_name: "Ln7", email: "ln7@x.com" }
              as: Anonymous
              captures: { learner_id: $.data.id }
            - call: "POST /courses"
              payload: { instructor_id: "${inst_id}", title: "Unp", list_price_cents: 1000 }
              as: Instructor
              as_user_id: "${inst_id}"
              captures: { course_id: $.data.id }
            - call: "POST /lessons"
              payload: { course_id: "${course_id}", title: "L1", order_index: 1 }
              as: Instructor
              as_user_id: "${inst_id}"
            - call: "POST /courses/${course_id}/publish"
              payload: {}
              as: Instructor
              as_user_id: "${inst_id}"
            - call: "POST /courses/${course_id}/unpublish"
              payload: {}
              as: Instructor
              as_user_id: "${inst_id}"
          trigger:
            - call: "POST /courses/${course_id}/enroll"
              payload: { learner_id: "${learner_id}" }
              as: Learner
              as_user_id: "${learner_id}"
              captures: { err: $.data.error_id }
          assert:
            - "response status code == 409"
            - "data.error_id == ERR_INVALID_STATE"

      - name: retire_is_terminal_no_republish
        claim_type: Terminal State Lockdown
        grounds: [state_machines.Course.PUBLISHED_to_RETIRED, "errors[ERR_INVALID_STATE]"]
        distinguishing_aspect: "From terminal RETIRED, POST /courses/{id}/publish is rejected with ERR_INVALID_STATE."
        test_recipe:
          setup: ["A PUBLISHED course with no active enrollments, then RETIRED."]
          setup_api_calls:
            - call: "POST /instructors"
              payload: { display_name: "I8", email: "i8@x.com", revenue_share_pct: 0.50 }
              as: Anonymous
              captures: { inst_id: $.data.id }
            - call: "POST /courses"
              payload: { instructor_id: "${inst_id}", title: "Ret", list_price_cents: 1000 }
              as: Instructor
              as_user_id: "${inst_id}"
              captures: { course_id: $.data.id }
            - call: "POST /lessons"
              payload: { course_id: "${course_id}", title: "L1", order_index: 1 }
              as: Instructor
              as_user_id: "${inst_id}"
            - call: "POST /courses/${course_id}/publish"
              payload: {}
              as: Instructor
              as_user_id: "${inst_id}"
            - call: "POST /courses/${course_id}/retire"
              payload: {}
              as: Instructor
              as_user_id: "${inst_id}"
          trigger:
            - call: "POST /courses/${course_id}/publish"
              payload: {}
              as: Instructor
              as_user_id: "${inst_id}"
              captures: { err: $.data.error_id }
          assert:
            - "response status code == 409"
            - "data.error_id == ERR_INVALID_STATE"

      - name: coupon_republish_cycle_after_disable_returns_invalid_state
        claim_type: Terminal State Lockdown
        grounds: [state_machines.Coupon.ACTIVE_to_DISABLED, "errors[ERR_INVALID_STATE]"]
        distinguishing_aspect: "DISABLED is terminal for Coupon; a second POST /coupons/{id}/disable returns ERR_INVALID_STATE."
        test_recipe:
          setup: ["A PUBLISHED course; a DISABLED coupon."]
          setup_api_calls:
            - call: "POST /instructors"
              payload: { display_name: "I9", email: "i9@x.com", revenue_share_pct: 0.50 }
              as: Anonymous
              captures: { inst_id: $.data.id }
            - call: "POST /courses"
              payload: { instructor_id: "${inst_id}", title: "Cc", list_price_cents: 1000 }
              as: Instructor
              as_user_id: "${inst_id}"
              captures: { course_id: $.data.id }
            - call: "POST /lessons"
              payload: { course_id: "${course_id}", title: "L1", order_index: 1 }
              as: Instructor
              as_user_id: "${inst_id}"
            - call: "POST /courses/${course_id}/publish"
              payload: {}
              as: Instructor
              as_user_id: "${inst_id}"
            - call: "POST /coupons"
              payload: { instructor_id: "${inst_id}", course_id: "${course_id}", code: "DIS", discount_type: "PERCENT", discount_value: 10, max_redemptions: 5, valid_from: "2026-01-01T00:00:00Z", valid_until: "2027-01-01T00:00:00Z" }
              as: Instructor
              as_user_id: "${inst_id}"
              captures: { coupon_id: $.data.id }
            - call: "POST /coupons/${coupon_id}/disable"
              payload: {}
              as: Instructor
              as_user_id: "${inst_id}"
          trigger:
            - call: "POST /coupons/${coupon_id}/disable"
              payload: {}
              as: Instructor
              as_user_id: "${inst_id}"
              captures: { err: $.data.error_id }
          assert:
            - "response status code == 409"
            - "data.error_id == ERR_INVALID_STATE"

      - name: review_hide_then_unhide_recomputes_rating
        claim_type: Side Effect Execution
        grounds: [state_machines.Review.PUBLISHED_to_HIDDEN, state_machines.Review.HIDDEN_to_PUBLISHED, entities.Course.fields.average_rating]
        distinguishing_aspect: "Hiding the only PUBLISHED review drops Course.rating_count to 0 and average_rating to null; unhiding restores rating_count 1 and average 5.0."
        test_recipe:
          setup: ["A COMPLETED enrollment with one 5-star PUBLISHED review at clock 2026-06-01."]
          setup_api_calls:
            - call: "POST /instructors"
              payload: { display_name: "I10", email: "i10@x.com", revenue_share_pct: 0.50 }
              as: Anonymous
              captures: { inst_id: $.data.id }
            - call: "POST /learners"
              payload: { full_name: "Ln10", email: "ln10@x.com" }
              as: Anonymous
              captures: { learner_id: $.data.id }
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-06-01T00:00:00Z" }
              as: PlatformAdmin
            - call: "POST /courses"
              payload: { instructor_id: "${inst_id}", title: "Rate", list_price_cents: 0, completion_threshold_pct: 1.00 }
              as: Instructor
              as_user_id: "${inst_id}"
              captures: { course_id: $.data.id }
            - call: "POST /lessons"
              payload: { course_id: "${course_id}", title: "L1", order_index: 1 }
              as: Instructor
              as_user_id: "${inst_id}"
              captures: { lesson_id: $.data.id }
            - call: "POST /courses/${course_id}/publish"
              payload: {}
              as: Instructor
              as_user_id: "${inst_id}"
            - call: "POST /courses/${course_id}/enroll"
              payload: { learner_id: "${learner_id}" }
              as: Learner
              as_user_id: "${learner_id}"
              captures: { enr_id: $.data.id }
            - call: "POST /lesson-completions"
              payload: { enrollment_id: "${enr_id}", lesson_id: "${lesson_id}" }
              as: Learner
              as_user_id: "${learner_id}"
            - call: "POST /reviews"
              payload: { enrollment_id: "${enr_id}", stars: 5, body: "great" }
              as: Learner
              as_user_id: "${learner_id}"
              captures: { review_id: $.data.id }
          trigger:
            - call: "POST /reviews/${review_id}/hide"
              payload: {}
              as: PlatformAdmin
            - call: "GET /courses/${course_id}"
              payload: {}
              as: Instructor
              as_user_id: "${inst_id}"
              captures: { rc_hidden: $.data.rating_count }
          assert:
            - "after hide Course.${course_id}.rating_count == 0 and average_rating == null"

      - name: refund_window_closed_returns_error
        claim_type: Precondition Enforcement
        grounds: [state_machines.Enrollment.ACTIVE_to_REFUNDED, "validations[priority=8]", "errors[ERR_REFUND_WINDOW_CLOSED]"]
        distinguishing_aspect: "Refunding an ACTIVE enrollment after refund_deadline (clock advanced) returns ERR_REFUND_WINDOW_CLOSED (422); the enrollment lazily becomes EXPIRED."
        test_recipe:
          setup: ["An ACTIVE enrollment (refund_window 5 days, enrolled 2026-06-01); clock then advanced to 2026-06-10 (past deadline 2026-06-06)."]
          setup_api_calls:
            - call: "POST /instructors"
              payload: { display_name: "I11", email: "i11@x.com", revenue_share_pct: 0.50 }
              as: Anonymous
              captures: { inst_id: $.data.id }
            - call: "POST /learners"
              payload: { full_name: "Ln11", email: "ln11@x.com" }
              as: Anonymous
              captures: { learner_id: $.data.id }
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-06-01T00:00:00Z" }
              as: PlatformAdmin
            - call: "POST /courses"
              payload: { instructor_id: "${inst_id}", title: "Late", list_price_cents: 1000, refund_window_days: 5 }
              as: Instructor
              as_user_id: "${inst_id}"
              captures: { course_id: $.data.id }
            - call: "POST /lessons"
              payload: { course_id: "${course_id}", title: "L1", order_index: 1 }
              as: Instructor
              as_user_id: "${inst_id}"
            - call: "POST /courses/${course_id}/publish"
              payload: {}
              as: Instructor
              as_user_id: "${inst_id}"
            - call: "POST /courses/${course_id}/enroll"
              payload: { learner_id: "${learner_id}" }
              as: Learner
              as_user_id: "${learner_id}"
              captures: { enr_id: $.data.id }
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-06-10T00:00:00Z" }
              as: PlatformAdmin
          trigger:
            - call: "POST /enrollments/${enr_id}/refund"
              payload: {}
              as: Learner
              as_user_id: "${learner_id}"
              captures: { err: $.data.error_id }
          assert:
            - "response status code == 422"
            - "data.error_id == ERR_REFUND_WINDOW_CLOSED"

      - name: enrollment_branch_fork_completed_vs_refunded_stub
        claim_type: Valid Transition
        grounds: [state_machines.Enrollment.ACTIVE_to_COMPLETED]
        excluded_because:
          difficulty_instance: non_linear_state_machine / enrollment_branch_fork_completed_vs_refunded
          rationale: "The COMPLETED/REFUNDED/EXPIRED branching with divergent side-effects is the named §1.8 instance."

  # ===========================================================================
  - section: calculations
    instances:
      - name: lesson_completion_nongraded_scores_full
        claim_type: Correct Result
        grounds: [calculations.lesson_completion_score, entities.LessonCompletion.fields.score_pct]
        distinguishing_aspect: "A non-graded lesson completion sets score_pct=1.0 and passed=true regardless of correct_answers."
        test_recipe:
          setup: ["PUBLISHED course with one non-graded lesson; ACTIVE enrollment."]
          setup_api_calls:
            - call: "POST /instructors"
              payload: { display_name: "I12", email: "i12@x.com", revenue_share_pct: 0.50 }
              as: Anonymous
              captures: { inst_id: $.data.id }
            - call: "POST /learners"
              payload: { full_name: "Ln12", email: "ln12@x.com" }
              as: Anonymous
              captures: { learner_id: $.data.id }
            - call: "POST /courses"
              payload: { instructor_id: "${inst_id}", title: "Ng", list_price_cents: 0, completion_threshold_pct: 1.00 }
              as: Instructor
              as_user_id: "${inst_id}"
              captures: { course_id: $.data.id }
            - call: "POST /lessons"
