            - call: "GET /awards/${award_id}"
              payload: {}
              as: CNCSProgramOfficer
              captures: { award_v2: $.data.version }
          trigger:
            - call: "POST /awards/${award_id}/enrollments"
              payload: { member_id: "${m_b}", term_category: "FULL_TIME", service_start_date: "2026-11-01", service_end_date: "2027-09-01", expected_award_version: "${award_v2}" }
              as: GranteeStaff
              as_user_id: "${org_id}"
              captures: { error_id: $.data.error_id }
          assert:
            - "CriminalHistoryCheck.${chk_b}.adjudication == FLAGGED (NSOPR FLAGGED + STATE CLEAR + FBI CLEAR)"
            - "the only FULL_TIME slot is FILLED by member A, so the slot selector's candidate set is empty"
            - "the response status is 422 and error_id == ERR_CRIMINAL_CHECK_FLAGGED (safety priority 18 beats constraint priority 28), NOT ERR_NO_OPEN_SLOT"
            - "GET /enrollments?member_id=${m_b} returns 0 rows"

