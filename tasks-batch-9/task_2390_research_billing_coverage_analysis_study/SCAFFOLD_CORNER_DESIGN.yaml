              payload: { source_analysis_id: "${analysis_id}", basis: "COVERAGE_DRIVEN", indirect_rate_pct: 32.0, expected_study_version: "${study_v4}" }
              as: ResearchBillingManager
              as_user_id: "mgr_1"
            - call: "POST /research-billing/studies/${study_id}/budget-execute"
              as: ResearchBillingManager
              as_user_id: "mgr_2"
              captures: { budget_after_execute: "$.data.budget_status", lifecycle_before_accrual: "$.data.lifecycle_status" }
            - call: "POST /research-billing/study-calendars"
              payload: { study_id: "${study_id}", source_analysis_id: "${analysis_id}" }
