          Mode (c) - self-referential input selection. The commission tier is chosen on the
          pre-commission net, so a buy with net 4,998,400 cents keeps the 0.0700 small-tier
          rate even though its gross of 5,348,288 cents sits above the 5,000,000 cent mid
          tier floor, while a buy whose net is exactly 5,000,000 cents takes 0.0550; feeding
          gross back into tier selection would report 274,912 instead of 349,888.
