  - rule_id: priority_pair_validation_conflict
    instances:
      - name: placement_agreement_state_error_outranks_credit_hold
        grounds:
          - validations.agreement_must_be_active
          - validations.customer_not_on_credit_hold
          - validations.parent_version_current
          - endpoints.POST_machine_placements
        distinguishing_aspect: |
          Category pair is state (priority 30, ERR_AGREEMENT_NOT_ACTIVE, 409) versus fiscal
          (priority 70, ERR_CUSTOMER_CREDIT_HOLD, 402) on POST /warewashing/machine-placements. Both
          conditions hold simultaneously - the agreement is still DRAFT AND the customer is on
          CREDIT_HOLD - and the response must be the state error with HTTP 409. The pair is proven by a
          control: activating the agreement (the only change) flips the very same request to 402, so
          the fiscal rule really was violated on the first attempt and was merely outranked. The OCC
          field is always supplied with the parent's true current version so the higher-priority
          412 rule (priority 24) never masks the pair.
        test_recipe:
          setup:
            - "Logical clock stays at its 2026-08-01T00:00:00Z default."
            - "One customer created with billing_status CREDIT_HOLD."
            - "One agreement left in DRAFT (never activated)."
          setup_api_calls:
            - call: "POST /warewashing/customers"
              payload: { name: "Ridgeline Resorts", sustainability_goal_water_l: 500000, billing_status: "CREDIT_HOLD" }
              as: AccountManager
              captures: { cust_id: $.data.id, billing: $.data.billing_status }
            - call: "POST /warewashing/chemical-products"
              payload: { sku: "DET-100", product_type: "DETERGENT", concentration_target_ppm: 1200, spec_dose_ml_per_rack: 8.00, unit_size_ml: 20000, unit_price_cents: 9600 }
              as: PlatformAdmin
              captures: { det_id: $.data.id }
            - call: "POST /warewashing/machine-models"
              payload: { model_code: "DT-88", machine_class: "DOOR_TYPE", racks_per_hour: 60, rated_water_l_per_rack: 0.74, rated_kwh_per_rack: 0.41, min_final_rinse_temp_f: 180, min_wash_temp_f: 150, min_rinse_pressure_psi: 15, max_rinse_pressure_psi: 25, equipment_value_cents: 480000, max_cycles_between_calibrations: 20000 }
              as: PlatformAdmin
              captures: { model_id: $.data.id }
            - call: "POST /warewashing/sites"
              payload: { customer_id: "${cust_id}", name: "Ridgeline Lodge Kitchen", region_code: "NW", operating_window_start_minute_utc: 600, operating_window_end_minute_utc: 1320, baseline_water_l_per_rack: 1.20, baseline_kwh_per_rack: 0.62, water_cost_cents_per_1000l: 480, energy_cost_cents_per_kwh: 14 }
              as: AccountManager
              captures: { site_id: $.data.id }
            - call: "POST /warewashing/service-agreements"
              payload: { customer_id: "${cust_id}", agreement_code: "AGR-2701-I", start_date: "2026-08-01", minimum_term_months: 36, monthly_minimum_spend_cents: 20000, covered_product_ids: ["${det_id}"] }
              as: AccountManager
              captures: { agr_id: $.data.id, agr_v_draft: $.data.version, agr_status: $.data.status }
          trigger:
            - call: "POST /warewashing/machine-placements"
              payload: { site_id: "${site_id}", agreement_id: "${agr_id}", machine_model_id: "${model_id}", asset_tag: "AT-701", expected_agreement_version: "${agr_v_draft}" }
              as: AccountManager
              captures: { err_1: $.data.error_id }
            - call: "POST /warewashing/service-agreements/${agr_id}/activate"
              payload: {}
              as: AccountManager
              captures: { agr_v_active: $.data.version }
            - call: "POST /warewashing/machine-placements"
              payload: { site_id: "${site_id}", agreement_id: "${agr_id}", machine_model_id: "${model_id}", asset_tag: "AT-701", expected_agreement_version: "${agr_v_active}" }
              as: AccountManager
              captures: { err_2: $.data.error_id }
          assert:
            - "${billing} == CREDIT_HOLD and ${agr_status} == DRAFT - both violations are staged"
            - "${err_1} == ERR_AGREEMENT_NOT_ACTIVE with HTTP 409, NOT ERR_CUSTOMER_CREDIT_HOLD and NOT ERR_STALE_PARENT_VERSION"
            - "${err_2} == ERR_CUSTOMER_CREDIT_HOLD with HTTP 402 - the fiscal rule was violated all along and only surfaced once the state rule was satisfied"
            - "no MachinePlacement row exists for site ${site_id} after either attempt"
            - "Customer.${cust_id}.equipment_on_placement_value_cents == 0 and ServiceAgreement.${agr_id}.placement_count == 0"

      - name: publish_safety_posture_error_outranks_insufficient_telemetry
        grounds:
          - validations.site_posture_critical_blocks_publish
          - validations.telemetry_sufficient_for_publish
          - entities.Site.fields.service_posture
          - state_machines.UsageVarianceReview.status.DRAFT_to_PUBLISHED
        distinguishing_aspect: |
          A DIFFERENT category pair on a different endpoint: safety (priority 40,
          ERR_SITE_POSTURE_CRITICAL, 409) versus constraint (priority 55, ERR_INSUFFICIENT_TELEMETRY,
          422) on POST /warewashing/usage-variance-reviews/{review_id}/publish. Neither category
          appears in the other instance of this rule, and neither error is a state error, so the
          ordering being probed is safety-before-constraint rather than state-before-fiscal. The
          control removes only the posture cause (raising a retrieval order cancels the QUEUED
          auto-ticket, so the posture falls back to NORMAL) and the very same publish then reports the
          constraint error.
        test_recipe:
          setup:
            - "Logical clock starts at its 2026-08-01T00:00:00Z default, one placement is INSTALLED at that instant, and the clock is then moved to 2026-08-05T14:00:00Z (minute 840, inside the 600-1320 operating window)."
            - "An 11 psi DEVICE reading at 2026-08-05T14:00:00Z opens a CRITICAL LOW_RINSE_PRESSURE alert, drives the placement to DOWN and auto-raises a QUEUED MACHINE_DOWN ticket with priority_score 700, so Site.service_posture is CRITICAL."
            - "The review window is [2026-08-01T00:00:00Z, 2026-08-04T00:00:00Z) - inside the agreement term but strictly before the only reading - so rack_count_in_period is 0, expected_consumption_ml is 0 and the classification is INSUFFICIENT_DATA."
