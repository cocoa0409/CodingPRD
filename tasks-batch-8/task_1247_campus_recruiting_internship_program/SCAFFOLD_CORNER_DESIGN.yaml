  - section: consistency_model
    instances:
      - name: immediate_consistency_on_accept
        claim_type: immediate_visibility
        grounds: [complexity_profile.consistency_model]
        distinguishing_aspect: "All mutations are visible in the same request's response and in the immediately following read: the accept response shows ACCEPTED + stipend, and the very next season GET shows the bumped counters and ledger."
        test_recipe:
          setup: ["season OFFER_PERIOD; offer EXTENDED (stipend 200000); clock within deadline"]
          setup_api_calls:
            - call: "POST /campus-recruiting/seasons"
              payload: { name: "S1", application_open_at: "2026-05-10T00:00:00Z", application_close_at: "2026-05-20T00:00:00Z", interview_window_start_at: "2026-06-01T00:00:00Z", interview_window_end_at: "2026-06-30T23:59:59Z", offer_window_open_at: "2026-07-01T00:00:00Z", offer_window_close_at: "2026-07-31T23:59:59Z", shortlist_score_threshold: 10, stipend_budget_cents: 1000000 }
              as: RecruitingAdmin
              captures: { sid: $.data.id }
            - call: "POST /campus-recruiting/seasons/${sid}/school-targets"
              payload: { school_name: "StateU", tier: "TARGET", application_cap: 10, stipend_region: "REGIONAL" }
              as: RecruitingAdmin
              captures: { st_id: $.data.id }
            - call: "POST /campus-recruiting/seasons/${sid}/advance"
              payload: {}
              as: RecruitingAdmin
            - call: "POST /campus-recruiting/_clock/set_current_utc"
              payload: { to_iso8601: "2026-05-15T00:00:00Z" }
              as: RecruitingAdmin
            - call: "POST /campus-recruiting/candidates"
              payload: { email: "a@x.com", full_name: "Candidate A", expected_graduation_date: "2027-05-15T00:00:00Z" }
              as: Anonymous
              captures: { cand_id: $.data.id }
            - call: "POST /campus-recruiting/seasons/${sid}/applications"
              payload: { candidate_id: "${cand_id}", school_target_id: "${st_id}", relocation_distance_miles: 100 }
              as: Candidate
              as_user_id: "${cand_id}"
              captures: { app_id: $.data.id }
            - call: "POST /campus-recruiting/_clock/set_current_utc"
              payload: { to_iso8601: "2026-05-21T00:00:00Z" }
              as: RecruitingAdmin
            - call: "POST /campus-recruiting/seasons/${sid}/advance"
              payload: {}
              as: RecruitingAdmin
            - call: "POST /campus-recruiting/applications/${app_id}/screen"
              payload: { decision: "SHORTLIST" }
              as: Recruiter
            - call: "POST /campus-recruiting/seasons/${sid}/employees"
              payload: { full_name: "Eve", email: "ev@co.com" }
              as: RecruitingAdmin
              captures: { ev_id: $.data.id }
            - call: "POST /campus-recruiting/seasons/${sid}/interview-days"
              payload: { window_start_at: "2026-06-08T09:00:00Z", window_end_at: "2026-06-08T17:00:00Z", capacity: 5 }
              as: Recruiter
              captures: { day_id: $.data.id }
            - call: "POST /campus-recruiting/interview-days/${day_id}/interview-slots"
              payload: { application_id: "${app_id}", evaluator_id: "${ev_id}", start_at: "2026-06-08T10:00:00Z", end_at: "2026-06-08T11:00:00Z" }
              as: Recruiter
              captures: { slot_id: $.data.id }
            - call: "POST /campus-recruiting/interview-slots/${slot_id}/evaluations"
              payload: { score: 4, recommendation: "HIRE" }
              as: Evaluator
              as_user_id: "${ev_id}"
            - call: "POST /campus-recruiting/seasons/${sid}/advance"
              payload: {}
              as: RecruitingAdmin
            - call: "POST /campus-recruiting/applications/${app_id}/offers"
              payload: { weekly_rate_cents: 150000, duration_weeks: 12 }
              as: Recruiter
              captures: { off_id: $.data.id }
            - call: "POST /campus-recruiting/_clock/set_current_utc"
              payload: { to_iso8601: "2026-07-06T10:00:00Z" }
              as: RecruitingAdmin
            - call: "POST /campus-recruiting/offers/${off_id}/extend"
              payload: {}
              as: Recruiter
          trigger:
            - call: "POST /campus-recruiting/offers/${off_id}/accept"
              payload: {}
              as: Candidate
              as_user_id: "${cand_id}"
              captures: { st: $.data.status, stip: $.data.stipend_amount_cents }
            - call: "GET /campus-recruiting/seasons/${sid}"
