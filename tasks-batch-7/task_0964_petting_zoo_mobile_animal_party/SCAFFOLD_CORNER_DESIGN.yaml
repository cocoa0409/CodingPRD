            - { call: "POST /petting-zoo/bookings", payload: { venue_id: "${v1}", start_time: "2026-06-17T14:00:00Z", end_time: "2026-06-17T16:00:00Z", guest_count: 20, child_guest_count: 0, booking_type: "PRIVATE_PARTY", planned_handwash_stations: 1 }, as: Customer, as_user_id: "${c1}", captures: { bk: $.data.id } }
