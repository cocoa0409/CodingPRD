              as: DisposalOfficer
              as_user_id: "officer-01"
              captures: { cyc: $.data.id }
            - call: "POST /screening-cycles/${cyc}/advance-tier"
              payload: {}
              as: DisposalOfficer
              as_user_id: "officer-01"
            - call: "POST /screening-cycles/${cyc}/advance-tier"
              payload: {}
              as: DisposalOfficer
              as_user_id: "officer-01"
            - call: "POST /screening-cycles/${cyc}/advance-tier"
              payload: {}
              as: DisposalOfficer
              as_user_id: "officer-01"
            - call: "POST /screening-cycles/${cyc}/advance-tier"
              payload: {}
