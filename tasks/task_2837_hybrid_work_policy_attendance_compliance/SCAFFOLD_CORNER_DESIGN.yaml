              payload: { employee_id: "${e1_id}", jurisdiction_code: "IE" }
              as: WorkplaceProgramOffice
              as_user_id: "wpo-1"
          assert:
            - "Call 1: preliminary_risk_score == 36 (IE 18 + CONFIDENTIAL 18) and final_risk_score == 0 - FINAL is not scored at creation"
            - "Call 4: final_risk_score == 96, decomposed as base 36 + licensing min(21, 7 * 5 == 35) == 21 + control min(27, 9 * 4 == 36) == 27 + nexus min(12, floor(3000000 / 250000) == 12) == 12; the raw uncapped sum would have been 36 + 35 + 36 + 12 == 119, and the RISK_CEILING of 100 is never reached because the per-term caps bite first"
            - "Call 4: preliminary_risk_score is STILL 36 on the same row, a 60-point divergence between the two variants of one calculation"
            - "Call 4: status == 'DENIED' and decision_reason == 'REVIEW_BLOCKED' (the security dimension was BLOCKED), so no ERR_RELOCATION_RISK_CEILING is involved even though 96 is far above APPROVAL_RISK_CEILING 60 - a DENY writes the score without consulting the approval ceiling"
            - "Call 5: total_count == 1 and the listed row carries both scores, tax_review_status 'CLEARED' and security_review_status 'BLOCKED'"

