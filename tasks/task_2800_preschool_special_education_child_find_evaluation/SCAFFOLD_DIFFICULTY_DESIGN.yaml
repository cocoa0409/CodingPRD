        grounds:
          - validations[priority=12]
          - validations[priority=18]
          - state_machines.EvaluationCase.IN_PROGRESS_to_CANCELLED
          - errors.ERR_INVALID_CASE_STATE
          - errors.ERR_PROVIDER_NOT_ACTIVE
        distinguishing_aspect: |
          The `state` category at priority 12 outranks the
          `business_referential` category at priority 18, so scheduling an
          assessment on a CANCELLED case with an ON_LEAVE evaluator returns
          ERR_INVALID_CASE_STATE (409) and never ERR_PROVIDER_NOT_ACTIVE (422).
        test_recipe:
          setup:
            - "Logical clock at 2026-08-01T00:00:00Z."
            - "One child born 2023-11-01 whose evaluation consent was granted and then revoked, so the referral is WITHDRAWN and its evaluation case is CANCELLED."
            - "The ECSE_TEACHER evaluator has been placed ON_LEAVE."
            - "Both violations are therefore live on the same request."
          setup_api_calls:
            - call: "POST /child-find/_clock/set_current_utc"
              payload: { current_utc: "2026-08-01T00:00:00Z" }
              as: DistrictAdmin
