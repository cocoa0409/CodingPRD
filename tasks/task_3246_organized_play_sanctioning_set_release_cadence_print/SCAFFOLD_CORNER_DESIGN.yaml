          - validations[priority=20]
        excluded_because:
          difficulty_instance: unknown_allocation_outranks_already_filed_report
          rationale: "The second §1.8 priority_pair_validation_conflict instance pins ERR_NOT_FOUND over ERR_PRIZE_REPORT_ALREADY_FILED."

      - name: aggregate_event_space_capacity_with_buffer
        claim_type: Aggregate validation
