  - rule_id: transitive_cascade
    instances:
      - name: sustained_full_withhold_cascade_depth_four
        grounds:
          - state_machines.ExemptionClaim.ASSERTED_to_SUSTAINED
          - state_machines.ResponsiveRecord.RESPONSIVE_to_WITHHELD_IN_FULL
          - state_machines.RedactionTask.DRAFT_to_CANCELLED
          - state_machines.PublicRecordsRequest.REDACTION_to_RELEASE_READY
          - state_machines.FeeEstimate.ACTIVE_to_STALE
          - calculations.record_release_posture
          - calculations.record_redaction_burden
          - calculations.request_billable_labor_minutes
          - entities.StaffMember.fields.open_qa_assignment_count
        distinguishing_aspect: |
          Depth-4 cascade triggered by POST /records/exemption-claims/{id}/adjudication:
          claim ASSERTED->SUSTAINED (link 1) forces record RESPONSIVE->WITHHELD_IN_FULL with
          posture BLOCKED (link 2), which cancels the record's QA_PENDING task (link 3),
          which both decrements the reviewer's open_qa_assignment_count to 0 and leaves every
          task on the request terminal so the request auto-advances REDACTION->RELEASE_READY
          (link 4) - each link caused by the previous one, not by the adjudication call.
        test_recipe:
          setup:
            - "Logical clock at 2026-08-01T00:00:00Z."
            - "Staff: two COUNSEL (level 3), one TECHNICIAN (level 3), one REVIEWER (level 3)."
            - "One GENERAL_PUBLIC Requester."
            - "Two VideoAssets on incident INC-2026-0407: A1 duration_ms 1800000 (30 min) and A2 duration_ms 600000 (10 min), both ROUTINE."
            - "One PublicRecordsRequest with record R1 on A1 and record R2 on A2, both RESPONSIVE."
            - "R2 carries a SUSTAINED PERSONAL_PRIVACY PARTIAL_REDACT claim, so R2 is RESTRICTED and the request already reached processing_status REDACTION with unadjudicated_claim_count 0."
            - "R1 then receives an ASSERTED ONGOING_INVESTIGATION FULL_WITHHOLD claim worth 30 minutes, so R1 is RESTRICTED and the request's unadjudicated_claim_count is 1."
            - "An ACTIVE PRESUMPTIVE FeeEstimate priced at 1750 cents exists (fee_status ESTIMATED, deposit_required_cents 0)."
            - "One FACE RedactionTask on R1 clip [0,60000) is QA_PENDING with the reviewer's open_qa_assignment_count == 1; no task exists on R2."
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { current_utc: "2026-08-01T00:00:00Z" }
              as: RecordsSupervisor
              as_user_id: "supv-1"
            - call: "POST /records/staff"
