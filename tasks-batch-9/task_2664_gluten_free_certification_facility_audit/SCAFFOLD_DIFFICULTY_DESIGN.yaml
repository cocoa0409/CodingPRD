      - name: scheduled_lot_sampling_exclusion_is_a_closed_interval_that_unannounced_lots_ignore
        grounds:
          - validations.priority_37
          - validations.priority_36
          - errors.ERR_SAMPLING_EXCLUSION_WINDOW
          - calculations.lot_sampling_frequency
          - entities.Product.fields.sampling_exclusion_days
          - entities.Product.fields.last_scheduled_sample_on
          - endpoints."POST /gfco/lot-tests"
        distinguishing_aspect: |
          The contended resource is the product's sampling calendar, and its exclusion interval is
          CLOSED on both ends and derived from a computed field rather than supplied: two
          INHERENTLY_GF lines at a threshold of 10 ppm give ROUND_HALF_UP(4 * 0.25 * 1.5) = 2 lots
          per line, 4 lots per year, and floor(365 / 4) = 91 exclusion days, so a SCHEDULED sample
          on 2026-08-12 blocks [2026-08-12 .. 2026-11-10] and frees 2026-11-11. Setup proves an
          UNANNOUNCED lot collected on the last blocked day is exempt and that 2026-11-11 is
          accepted; the trigger then back-dates a SCHEDULED lot to 2026-11-10, which must be
          rejected against the ORIGINAL August lot even though a newer SCHEDULED lot exists whose
          own window does not contain that date. Off-by-one (91 vs 90 days, open vs closed upper
          bound), checking only the most recent SCHEDULED lot, or applying the window to
          UNANNOUNCED lots each break a different assertion.
        test_recipe:
          setup:
            - "One applicant, one facility with shared equipment on ADJACENT_LINES, one supplier, and two APPROVED INHERENTLY_GF ingredients each carrying a verified ALLERGEN_STATEMENT."
            - "One STANDARD-tier product with both ingredients at inclusion_pct 60 and 40, formula CLEARED, and an active testing plan; the plan computes threshold_ppm 10, sampling_lots_per_year 4 and sampling_exclusion_days 91."
            - "At clock 2026-08-12 a SCHEDULED lot is recorded at 3.0 ppm (PASS), setting last_scheduled_sample_on to 2026-08-12 and blocking SCHEDULED samples through 2026-11-10 inclusive."
            - "At clock 2026-11-10T12:00Z an UNANNOUNCED lot collected 2026-11-10 at 4.0 ppm is accepted, because only SCHEDULED lots observe the exclusion window."
            - "At clock 2026-11-11 a SCHEDULED lot collected 2026-11-11 at 2.0 ppm is accepted - the first day outside the closed interval - moving last_scheduled_sample_on to 2026-11-11."
          setup_api_calls:
            - call: "POST /gfco/_clock/set_current_utc"
              payload: { to_iso8601: "2026-08-01T00:00:00Z" }
              as: ProgramAdministrator
