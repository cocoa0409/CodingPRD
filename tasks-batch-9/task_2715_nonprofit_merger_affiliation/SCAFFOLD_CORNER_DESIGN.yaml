      - name: denied_consent_blocks_the_posture_until_the_petition_is_filed
        claim_type: constraint_propagation
        grounds:
          - calculations.restricted_asset_posture
          - state_machines.RestrictedFund.CONSENT_SOUGHT_to_CONSENT_DENIED
          - state_machines.RestrictedFund.CONSENT_DENIED_to_PETITION_FILED
        distinguishing_aspect: |
          The posture is a first-match-wins ladder over ALL party funds, so a single
          CONSENT_DENIED fund forces BLOCKED even though the unresolved count is 2 and
          RESTRICTED_PENDING would also match. Filing the petition removes the only
          CONSENT_DENIED row without resolving anything - the count stays 2 - and the
          posture must therefore fall exactly one rung, from BLOCKED to
          RESTRICTED_PENDING, never straight to CLEARED. The two-rung ladder is only
          observable because the count is held constant across the transition.
        test_recipe:
          setup:
            - "A Restructuring between two CA organizations in any pre-terminal status"
            - "Two initiator RestrictedFunds: one TEMP_RESTRICTED with a reachable donor, one TEMP_RESTRICTED left HELD"
          setup_api_calls:
            - call: "POST /organizations"
              payload: { legal_name: "Riverside Youth Alliance", ein: "11-1111111", state_code: "CA", mission_code: "YM-YOUTH_MENTORING", annual_expense_cents: 100000002, unrestricted_net_assets_cents: 59916670 }
              as: PlatformAdmin
              captures: { org_a: $.data.id }
            - call: "POST /organizations"
              payload: { legal_name: "Harbor Youth Collective", ein: "22-2222222", state_code: "CA", mission_code: "YM-YOUTH_MENTORING", annual_expense_cents: 100000002, unrestricted_net_assets_cents: 40000000 }
              as: PlatformAdmin
              captures: { org_b: $.data.id }
