              captures: { b_v: $.data.version }
          trigger:
            - call: "POST /cash-vault/count-sessions"
              payload: { sealed_bag_id: "${b_id}", counting_machine_id: "${m1_id}", window_start: "2026-08-03T09:00:00Z", window_end: "2026-08-03T10:00:00Z", expected_sealed_bag_version: "${b_v}" }
              as: VaultTeller
              as_user_id: "u-tel-1"
              captures: { s1_id: $.data.id }
            - call: "POST /cash-vault/count-sessions"
              payload: { sealed_bag_id: "${b_id}", counting_machine_id: "${m2_id}", window_start: "2026-08-03T11:00:00Z", window_end: "2026-08-03T12:00:00Z", expected_sealed_bag_version: "${b_v}" }
