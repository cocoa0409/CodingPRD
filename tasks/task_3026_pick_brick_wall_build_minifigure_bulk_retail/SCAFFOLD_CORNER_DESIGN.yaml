            - "GET /stores/wall-bins?element_id=${el5901} returns 1 bin"
            - "GET /stores/wall-bins?store_id=${st222}&status=OPEN returns 1 bin"

      - name: rotating_an_empty_candidate_pool_returns_a_success_envelope
        claim_type: Bulk action
        grounds: ["endpoints.POST_/stores/wall-bins/rotate"]
        excluded_because:
          difficulty_instance: wall_fill_boundaries_are_strictly_less_than
          rationale: "The empty-candidate rotation and the fill-percentage boundary walk are the same selector surface; the boundary instance already drives rotate over the boundary states."

  # ===========================================================================
  - section: errors
    instances:

      - name: frozen_store_blocks_a_replacement_filing
        claim_type: violation_to_error
        grounds: ["errors[ERR_STORE_FROZEN]", "validations[priority=9]"]
        distinguishing_aspect: "The same posture error also guards the replacement endpoint: with an empty wall the store is FROZEN and a filing is refused even though the member is under their ceiling and the element is sourced."
        test_recipe:
          setup: ["Logical clock at 2026-09-01T00:00:00Z. Store LEGO-0223 whose only bin is empty, with element 6001 retired so it sources as surplus, and one member."]
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-09-01T00:00:00Z" }
              as: PlatformAdmin
            - call: "POST /stores"
              payload: { store_code: "LEGO-0223", display_name: "Brick Yard Twenty Three", wall_bin_capacity_grams: 1000, event_capacity_units: 40, checklist_required: true }
              as: PlatformAdmin
              captures: { st223: $.data.id }
            - call: "POST /stores/elements"
              payload: { element_code: "6001", element_name: "Brick 2x2 Corner", theme: "Town", unit_mass_grams: 1.0, cost_basis_cents: 5, make_ready_lead_days: 5 }
              as: PlatformAdmin
              captures: { el6001: $.data.id, el6001_v1: $.data.version }
            - call: "POST /stores/members"
              payload: { email: "m_frozen@example.com", display_name: "Frozen Member", home_store_id: "${st223}" }
              as: PlatformAdmin
              captures: { mem_frozen: $.data.id, mem_frozen_v1: $.data.version }
            - call: "POST /stores/wall-bins"
              payload: { store_id: "${st223}", element_id: "${el6001}", bin_label: "T01", bin_capacity_grams: 1000, bin_mass_grams: 0 }
              as: StoreAssociate
              captures: { bin_t01: $.data.id }
            - call: "POST /stores/elements/{id}/retire"
              payload: { expected_element_version: "${el6001_v1}" }
              as: StoreAssociate
              captures: { el6001_mode: $.data.sourcing_mode }
          trigger:
            - call: "POST /stores/replacement-requests"
              payload: { store_id: "${st223}", member_id: "${mem_frozen}", element_id: "${el6001}", quantity_missing: 1, proof_of_purchase_supplied: false, window_days: 30, expected_member_version: "${mem_frozen_v1}" }
              as: StoreAssociate
              captures: { frozen_req_err: $.data.error_id }
          assert:
            - "Store.${st223}.stage == FROZEN"
            - "the filing returns error_id == ERR_STORE_FROZEN"
            - "GET /stores/replacement-requests?store_id=${st223} returns zero requests"

      - name: restricted_store_caps_the_cup_but_admits_a_smaller_one
        claim_type: violation_to_error
        grounds: ["errors[ERR_STORE_RESTRICTED]", "state_machines.Store.TRADING_to_RESTRICTED"]
        distinguishing_aspect: "With 199 g on a 2000 g wall the store sits RESTRICTED, so a 400 g LARGE cup is refused while a 200 g LARGE cup is admitted, pinning the restricted-mass ceiling against the state flag."
        test_recipe:
          setup: ["Logical clock at 2026-09-01T00:00:00Z. Store LEGO-0224 with element 6101, one member and one bin holding 199 g so the store reads RESTRICTED."]
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-09-01T00:00:00Z" }
              as: PlatformAdmin
            - call: "POST /stores"
              payload: { store_code: "LEGO-0224", display_name: "Brick Yard Twenty Four", wall_bin_capacity_grams: 2000, event_capacity_units: 40, checklist_required: true }
              as: PlatformAdmin
              captures: { st224: $.data.id }
            - call: "POST /stores/elements"
              payload: { element_code: "6101", element_name: "Brick 2x4", theme: "Town", unit_mass_grams: 2.5, cost_basis_cents: 6, make_ready_lead_days: 5 }
              as: PlatformAdmin
              captures: { el6101: $.data.id }
            - call: "POST /stores/members"
              payload: { email: "m_rest@example.com", display_name: "Restricted Member", home_store_id: "${st224}" }
              as: PlatformAdmin
              captures: { mem_rest: $.data.id }
            - call: "POST /stores/wall-bins"
              payload: { store_id: "${st224}", element_id: "${el6101}", bin_label: "U01", bin_capacity_grams: 2000, bin_mass_grams: 199 }
              as: StoreAssociate
              captures: { bin_u01: $.data.id }
          trigger:
            - call: "POST /stores/fusion-orders"
              payload: { store_id: "${st224}", member_id: "${mem_rest}", cup_size: "LARGE", pricing_model: "CUP_FILL", declared_mass_grams: 400 }
              as: StoreAssociate
              captures: { restricted_err: $.data.error_id }
          assert:
            - "Store.${st224}.stage == RESTRICTED"
            - "the 400 g cup returns error_id == ERR_STORE_RESTRICTED"
            - "the 400 g draw is refused, so GET /stores/fusion-orders?store_id=${st224} returns zero orders"

      - name: per_piece_cup_on_a_current_production_element_is_refused
        claim_type: violation_to_error
        grounds: ["errors[ERR_ELEMENT_NOT_SOURCED]", "validations[priority=5]"]
        distinguishing_aspect: "Per-piece pricing requires a surplus-sourced element, so the same cup is refused while the element is CURRENT_PRODUCTION and admitted once that element is retired into surplus sourcing."
        test_recipe:
          setup: ["Logical clock at 2026-09-01T00:00:00Z. Store LEGO-0225 with element 6201 loaded in one bin holding 600 g and no surplus drawer entry."]
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-09-01T00:00:00Z" }
              as: PlatformAdmin
            - call: "POST /stores"
              payload: { store_code: "LEGO-0225", display_name: "Brick Yard Twenty Five", wall_bin_capacity_grams: 1000, event_capacity_units: 40, checklist_required: true }
              as: PlatformAdmin
              captures: { st225: $.data.id }
            - call: "POST /stores/elements"
              payload: { element_code: "6201", element_name: "Brick 2x6", theme: "Icons", unit_mass_grams: 3.0, cost_basis_cents: 7, make_ready_lead_days: 5 }
              as: PlatformAdmin
              captures: { el6201: $.data.id }
            - call: "POST /stores/members"
              payload: { email: "m_src@example.com", display_name: "Source Member", home_store_id: "${st225}" }
              as: PlatformAdmin
              captures: { mem_src: $.data.id }
            - call: "POST /stores/wall-bins"
              payload: { store_id: "${st225}", element_id: "${el6201}", bin_label: "V01", bin_capacity_grams: 1000, bin_mass_grams: 600 }
              as: StoreAssociate
              captures: { bin_v01: $.data.id }
          trigger:
            - call: "POST /stores/fusion-orders"
              payload: { store_id: "${st225}", member_id: "${mem_src}", cup_size: "SMALL", pricing_model: "PER_PIECE", declared_mass_grams: 10, pieced_element_id: "${el6201}", declared_piece_count: 5 }
              as: StoreAssociate
              captures: { src_err: $.data.error_id }
          assert:
            - "Element.${el6201}.sourcing_mode == CURRENT_PRODUCTION"
            - "the per-piece cup returns error_id == ERR_ELEMENT_NOT_SOURCED"
            - "Store.${st225}.bin_engine_mass_grams == 600"

      - name: overlapping_event_slots_error
        claim_type: violation_to_error
        grounds: ["errors[ERR_EVENT_SLOT_OVERLAP]"]
        excluded_because:
          difficulty_instance: touching_event_slots_are_admitted_by_half_open_semantics
          rationale: "Both the admitted touching case and the rejected overlapping case are asserted in that §1.8 instance."

      - name: stale_launch_version_error
        claim_type: violation_to_error
        grounds: ["errors[ERR_STALE_VERSION]", "concurrency_rules[launch-grant-stale-launch]"]
        excluded_because:
          difficulty_instance: voided_cup_unwinds_exclusive_purchase_and_reopens_the_launch
          rationale: "The grant batch in that §1.8 instance already captures the launch version and replays the OCC chain against it."

      - name: components_incomplete_error
        claim_type: violation_to_error
        grounds: ["errors[ERR_COMPONENTS_INCOMPLETE]"]
        excluded_because:
          difficulty_instance: build_seal_depends_on_every_component_bin_state
          rationale: "The incomplete-seal rejection and the complete-seal success are the two arms asserted in that §1.8 instance."

      - name: queue_not_ready_error
        claim_type: violation_to_error
        grounds: ["errors[ERR_QUEUE_NOT_READY]"]
        excluded_because:
          difficulty_instance: launch_queue_slot_and_identity_axes_move_independently
          rationale: "The identity axis is driven to IDENTITY_ESCALATED there, which is the state that produces this error on a purchase attempt."

      - name: window_expired_error
        claim_type: violation_to_error
        grounds: ["errors[ERR_WINDOW_EXPIRED]"]
        excluded_because:
          difficulty_instance: replacement_claim_and_completion_award_different_points
          rationale: "The window field and its expiry arithmetic are pinned as assertions of that §1.8 instance."

  # ===========================================================================
  - section: rbac
    instances:

      - name: member_cannot_restock_the_wall
        claim_type: role_denial
        grounds: ["roles.Member.exclusive_operations", "roles.StoreAssociate.exclusive_operations"]
        distinguishing_aspect: "The member role owns the checkout side but not the wall side, so a member-role caller restocking a bin is refused while the store associate succeeds on the same bin."
        test_recipe:
          setup: ["Logical clock at 2026-09-01T00:00:00Z. Store LEGO-0226 with element 6301 and one bin holding 300 g."]
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
