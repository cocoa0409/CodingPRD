# =============================================================================
# PRD Benchmark Seed Tables
# Task: task_3475_government_digital_payment_portal_convenience_fee_administration
# §1.0–§1.7 (difficulty design §1.8 and corner design §1.9 live in sibling files)
# =============================================================================

scenario: |
  Government Digital Payment Portal & Convenience Fee Administration (NIC): agency portal implementation with service catalog, payment types and account structures across state and local entities, payment method acceptance with card, electronic check and wallet options and per-method cost differences, convenience fee models where the payer bears processing cost with statutory authorization and disclosure requirements, absorbed fee arrangements where the agency pays with contract pricing tiers, funds settlement to agency accounts with reconciliation files and deposit timing, refund, chargeback and dispute handling where the agency controls the underlying transaction, self-funded model where portal development is paid from transaction fees rather than appropriations, security and compliance requirements for payment data across many agency integrations

domain_name: government-payment-portal
api_prefix: /portal

# =============================================================================
# §0: Complexity Profile
# =============================================================================
complexity_profile:
  primary_archetype: ledger_reconciliation
  secondary_archetype: compliance_audit
  complexity_layers:
    - dual_variant_calculation
    - ops_run_checkpoint
    - derived_field_reconciliation
    - optimistic_concurrency
  entity_topology: flat          # all references via FK fields in request bodies; sub-resources used only for read paths
  state_machine_shape: cyclic    # ACH return/re-present cycle on PaymentTransaction; ACTIVE<->SUSPENDED on Agency; self-loop on PaymentInstrument
  relationship_patterns:
    - one_to_many
    - cross_aggregate
  role_model: segregation_of_duties   # refund initiate vs decide must be different users; batch submit vs deposit confirm are different roles
  consistency_model: immediate

# =============================================================================
# §1.0: Response Envelope (FIXED)
# =============================================================================
response_envelope:
  success: |
    { "meta": { "api_request_id": "req_xxx", "api_request_timestamp": "ISO8601" },
      "response_type": "object" | "array", "data": {} }
  error: |
    { "meta": { ... }, "response_type": "error",
      "data": { "error_id": "ERR_XXX", "message": "..." } }
  pagination_fields: ["limit", "offset", "total_count", "has_more"]
  pagination_defaults: { limit: 10, min: 1, max: 100, offset: 0 }

# =============================================================================
# §1.1: Entity-Relationship Table
# =============================================================================
entities:
  - name: Agency
    parent: null
    common_fields: true
    fields:
      - { name: legal_name, type: string, source: input, description: "Agency legal name" }
      - { name: agency_type, type: enum, source: input, description: "STATE | LOCAL" }
      - { name: default_fee_model, type: enum, source: input, description: "CONVENIENCE_FEE | ABSORBED; default for new services of this agency" }
      - { name: status, type: enum, source: system, description: "ONBOARDING | ACTIVE | SUSPENDED | OFFBOARDED", default: ONBOARDING }
      - { name: activated_at, type: datetime, source: system, description: "Logical-clock timestamp of most recent transition into ACTIVE; null until first activation" }

  - name: AgencySettlementAccount
    parent: null
    common_fields: true
    fields:
      - { name: agency_id, type: string, source: input, description: "FK -> Agency.id" }
      - { name: routing_number, type: string, source: input, description: "9-digit ACH routing number" }
      - { name: account_number_last4, type: string, source: input, description: "Last 4 digits only; the full account number is never stored" }
      - { name: effective_from, type: datetime, source: input, description: "Start of half-open effectiveness window [effective_from, effective_to)" }
      - { name: effective_to, type: datetime, source: system, description: "Set when superseded; null while the account is the live window" }
      - { name: status, type: enum, source: system, description: "PENDING_VERIFICATION | VERIFIED | RETIRED", default: PENDING_VERIFICATION }
      - { name: verification_attempts, type: integer, source: system, default: 0, description: "Count of verify calls made against this account" }
      - { name: verified_at, type: datetime, source: system, description: "Logical-clock timestamp of successful verification; null while unverified" }

  - name: ContractPricingTier
    parent: null
    common_fields: false
    fields:
      - { name: agency_id, type: string, source: input, description: "FK -> Agency.id" }
      - { name: volume_min_cents, type: integer, source: input, description: "Inclusive lower bound of the monthly-volume band" }
      - { name: volume_max_cents, type: integer, source: input, description: "Inclusive upper bound of the monthly-volume band; null = unbounded top band" }
      - { name: rate_bp, type: integer, source: input, description: "Marginal rate in basis points applied to volume portions inside this band" }
      - { name: per_txn_cents, type: integer, source: input, description: "Flat per-transaction amount charged when the transaction's first cumulative cent lands in this band" }
      - { name: effective_month, type: string, source: input, description: "Month the band config applies to, format YYYY-MM" }

  - name: ComplianceAttestation
    parent: null
    common_fields: false
    fields:
      - { name: agency_id, type: string, source: input, description: "FK -> Agency.id" }
      - { name: attestation_type, type: enum, source: input, description: "PCI_DSS_AOC | PENETRATION_TEST | INTEGRATION_REVIEW" }
      - { name: issued_at, type: datetime, source: input, description: "When the attestation was issued" }
      - { name: expires_at, type: datetime, source: input, description: "Expiry instant; attestation is EXPIRED when logical clock >= expires_at" }
      - { name: status, type: enum, source: computed, description: "CURRENT | EXPIRED — derived from the logical clock on every read, never stored" }

  - name: ServiceCatalogItem
    parent: null
    common_fields: true
    fields:
      - { name: agency_id, type: string, source: input, description: "FK -> Agency.id" }
      - { name: service_code, type: string, source: input, description: "Unique per agency among services whose status is not DEACTIVATED" }
      - { name: name, type: string, source: input, description: "Display name" }
      - { name: fee_model, type: enum, source: input, description: "CONVENIENCE_FEE | ABSORBED; defaults to the agency's default_fee_model when omitted" }
      - { name: allowed_methods, type: array, source: input, description: "Non-empty subset of [CARD, ECHECK, WALLET]" }
      - { name: min_amount_cents, type: integer, source: input, description: "Smallest payable amount, inclusive" }
      - { name: max_amount_cents, type: integer, source: input, description: "Largest payable amount, inclusive" }
      - { name: gl_code, type: string, source: input, description: "Agency general-ledger code stamped on reconciliation lines" }
      - { name: status, type: enum, source: system, description: "DRAFT | ACTIVE | DEACTIVATED", default: DRAFT }

  - name: StatutoryAuthorization
    parent: null
    common_fields: true
    fields:
      - { name: service_id, type: string, source: input, description: "FK -> ServiceCatalogItem.id" }
      - { name: statute_citation, type: string, source: input, description: "Statutory citation authorizing the convenience fee (e.g. '62 O.S. § 34.9')" }
      - { name: disclosure_text_version, type: string, source: input, description: "Version tag of the mandated disclosure text shown to the payer" }
      - { name: fee_cap_cents, type: integer, source: input, description: "Statutory cap: the charged convenience fee must be <= this value" }
      - { name: effective_from, type: datetime, source: input, description: "Inclusive start of the closed effectiveness window [effective_from, effective_to]" }
      - { name: effective_to, type: datetime, source: input, description: "Inclusive end of the closed effectiveness window" }
      - { name: status, type: enum, source: system, description: "DRAFT | APPROVED", default: DRAFT }
      - { name: in_effect, type: boolean, source: computed, description: "status == APPROVED and effective_from <= logical clock <= effective_to" }

  - name: Payer
    parent: null
    common_fields: true
    fields:
      - { name: full_name, type: string, source: input, description: "Payer full name" }
      - { name: email, type: string, source: input, description: "Unique across all payers" }
      - { name: billing_zip, type: string, source: input, description: "Billing postal code" }

  - name: PaymentInstrument
    parent: null
    common_fields: true
    fields:
      - { name: payer_id, type: string, source: input, description: "FK -> Payer.id" }
      - { name: method, type: enum, source: input, description: "CARD | ECHECK | WALLET" }
      - { name: card_brand, type: enum, source: input, description: "VISA | MASTERCARD | AMEX | DISCOVER; required iff method == CARD, forbidden otherwise" }
      - { name: card_cost_bucket, type: enum, source: input, description: "CONSUMER_DEBIT | CONSUMER_CREDIT | COMMERCIAL; required iff method == CARD, forbidden otherwise" }
      - { name: last4, type: string, source: input, description: "Last 4 digits of card or bank account; only masked data is stored" }
      - { name: token_ref, type: string, source: system, description: "Gateway token reference minted at creation; raw PAN/ABA numbers are never persisted" }
      - { name: status, type: enum, source: system, description: "ACTIVE | PENDING_VERIFICATION | DEACTIVATED. CARD and WALLET are created ACTIVE; ECHECK is created PENDING_VERIFICATION", default: ACTIVE }
      - { name: ach_verify_failures, type: integer, source: system, default: 0, description: "Failed micro-deposit verification attempts; reaching 3 deactivates the instrument" }

  - name: FeeQuote
    parent: null
    common_fields: false
    fields:
      - { name: service_id, type: string, source: input, description: "FK -> ServiceCatalogItem.id" }
      - { name: payer_id, type: string, source: system, description: "FK -> Payer.id; taken from the authenticated payer's X-User-ID" }
      - { name: statutory_authorization_id, type: string, source: computed, description: "FK -> StatutoryAuthorization.id; the covering APPROVED authorization for CONVENIENCE_FEE services, null for ABSORBED" }
      - { name: amount_cents, type: integer, source: input, description: "Principal amount being paid" }
      - { name: method, type: enum, source: input, description: "CARD | ECHECK | WALLET" }
      - { name: quoted_fee_cents, type: integer, source: computed, description: "QUOTED variant of convenience_fee; the disclosure-binding fee the payer will be charged. 0 for ABSORBED services" }
      - { name: payer_total_cents, type: integer, source: computed, description: "amount_cents + quoted_fee_cents for CONVENIENCE_FEE; amount_cents for ABSORBED" }
      - { name: disclosure_text_version, type: string, source: computed, description: "Copied from the covering StatutoryAuthorization; null for ABSORBED" }
      - { name: service_version_pinned, type: integer, source: computed, description: "ServiceCatalogItem.version at quote time; authorize rejects if the service has since changed" }
      - { name: expires_at, type: datetime, source: computed, description: "created_at + 30 minutes; authorize at logical clock >= expires_at fails ERR_QUOTE_EXPIRED" }
      - { name: status, type: enum, source: system, description: "OPEN | CONSUMED | VOIDED", default: OPEN }

  - name: PaymentTransaction
    parent: null
    common_fields: true
    fields:
      - { name: quote_id, type: string, source: input, description: "FK -> FeeQuote.id" }
      - { name: instrument_id, type: string, source: input, description: "FK -> PaymentInstrument.id" }
      - { name: service_id, type: string, source: system, description: "FK -> ServiceCatalogItem.id; denormalized from the quote at authorize" }
      - { name: agency_id, type: string, source: system, description: "FK -> Agency.id; denormalized from the service at authorize" }
      - { name: payer_id, type: string, source: system, description: "FK -> Payer.id; denormalized from the quote at authorize" }
      - { name: current_batch_id, type: string, source: system, description: "FK -> SettlementBatch.id; set when the transaction settles in a batch, cleared to null by an ACH return" }
      - { name: method, type: enum, source: system, description: "CARD | ECHECK | WALLET, copied from the quote" }
      - { name: fee_model, type: enum, source: system, description: "CONVENIENCE_FEE | ABSORBED, copied from the service at authorize" }
      - { name: amount_cents, type: integer, source: system, description: "Principal, copied from the quote" }
      - { name: charged_fee_cents, type: integer, source: system, description: "Fee actually charged to the payer (the disclosure-binding QUOTED fee); 0 for ABSORBED" }
      - { name: final_fee_cents, type: integer, source: computed, description: "FINAL variant of convenience_fee computed at authorize from the instrument's actual card_cost_bucket; also the portal's processing-cost accrual for this transaction" }
      - { name: payer_total_cents, type: integer, source: computed, description: "amount_cents + charged_fee_cents" }
      - { name: funds_status, type: enum, source: system, description: "AUTHORIZED | CAPTURED | SETTLED | VOIDED | RETURNED | RE_PRESENTED", default: AUTHORIZED }
      - { name: representment_count, type: integer, source: system, default: 0, description: "Number of completed re-presentments; hard maximum 1" }
      - { name: captured_at, type: datetime, source: system, description: "Logical-clock timestamp of capture; null until captured" }
      - { name: value_date, type: string, source: computed, description: "YYYY-MM-DD deposit-eligibility date = capture date + method lag (CARD 1 day, WALLET 1 day, ECHECK 2 days); recomputed on re-presentment" }
      - { name: returned_at, type: datetime, source: system, description: "Logical-clock timestamp of the most recent ACH return; null if never returned" }
      - { name: refunded_cents, type: integer, source: system, default: 0, description: "Sum of amounts of APPROVED refunds" }
      - { name: charged_back_cents, type: integer, source: system, default: 0, description: "Network debit booked when a chargeback reaches ACCEPTED or LOST" }
      - { name: remaining_refundable_cents, type: integer, source: computed, description: "amount_cents - refunded_cents - charged_back_cents" }

  - name: SettlementBatch
    parent: null
    common_fields: true
    fields:
      - { name: agency_id, type: string, source: input, description: "FK -> Agency.id" }
      - { name: business_date, type: string, source: input, description: "YYYY-MM-DD settlement business date" }
      - { name: status, type: enum, source: system, description: "OPEN | CLOSED | SUBMITTED | CONFIRMED | EXCEPTION | RECONCILED", default: OPEN }
      - { name: member_count, type: integer, source: computed, description: "Transactions swept in at close; 0 until close" }
      - { name: gross_amount_cents, type: integer, source: computed, description: "Sum of member amount_cents, finalized at close" }
      - { name: fees_withheld_cents, type: integer, source: computed, description: "Sum of member charged_fee_cents retained by the portal, finalized at close" }
      - { name: refund_debits_cents, type: integer, source: system, default: 0, description: "Approved-refund debits posted into this batch while OPEN" }
      - { name: return_debits_cents, type: integer, source: system, default: 0, description: "ACH return debits posted into this batch while OPEN" }
      - { name: chargeback_debits_cents, type: integer, source: system, default: 0, description: "Chargeback network debits posted into this batch while OPEN" }
      - { name: deposit_cents, type: integer, source: computed, description: "gross_amount_cents - refund_debits_cents - return_debits_cents - chargeback_debits_cents; finalized at close (may be negative), 0 while OPEN" }
      - { name: deposit_due_date, type: string, source: computed, description: "max(value_date) over members at close; business_date when the batch closes empty" }
      - { name: submitted_at, type: datetime, source: system, description: "Logical-clock timestamp of submission to the bank" }
      - { name: confirmed_at, type: datetime, source: system, description: "Logical-clock timestamp of treasury deposit confirmation" }
      - { name: actual_deposit_cents, type: integer, source: system, description: "Deposit amount confirmed by TreasuryOfficer; null until confirmed" }
      - { name: open_exception_count, type: integer, source: computed, description: "ReconciliationExceptions of this batch with status OPEN" }

  - name: ReconciliationException
    parent: null
    common_fields: true
    fields:
      - { name: batch_id, type: string, source: system, description: "FK -> SettlementBatch.id" }
      - { name: exception_type, type: enum, source: system, description: "AMOUNT_MISMATCH | DEPOSIT_LATE" }
      - { name: expected_cents, type: integer, source: system, description: "Expected deposit (AMOUNT_MISMATCH) or expected latest date epoch-day context" }
      - { name: actual_cents, type: integer, source: system, description: "Confirmed deposit for AMOUNT_MISMATCH; null for DEPOSIT_LATE" }
      - { name: detail, type: string, source: system, description: "Human-readable mismatch description" }
      - { name: status, type: enum, source: system, description: "OPEN | RESOLVED", default: OPEN }
      - { name: resolution_note, type: string, source: system, description: "Note supplied at resolution; null while OPEN" }

  - name: Refund
    parent: null
    common_fields: true
    fields:
      - { name: transaction_id, type: string, source: input, description: "FK -> PaymentTransaction.id" }
      - { name: amount_cents, type: integer, source: input, description: "Principal-only refund amount; convenience fees are statutorily non-refundable and never included" }
      - { name: reason, type: string, source: input, description: "Free-text reason recorded for audit" }
      - { name: initiated_by_user_id, type: string, source: system, description: "X-User-ID of the AgencyAdmin who created the refund" }
      - { name: decided_by_user_id, type: string, source: system, description: "X-User-ID of the deciding AgencyAdmin; must differ from initiated_by_user_id" }
      - { name: status, type: enum, source: system, description: "REQUESTED | APPROVED | DENIED", default: REQUESTED }

  - name: ChargebackCase
    parent: null
    common_fields: true
    fields:
      - { name: transaction_id, type: string, source: input, description: "FK -> PaymentTransaction.id" }
      - { name: reason_code, type: enum, source: input, description: "FRAUD | DUPLICATE | SERVICE_NOT_RECEIVED | CREDIT_NOT_ISSUED" }
      - { name: network_debit_cents, type: integer, source: computed, description: "Booked at ACCEPTED/LOST outcome as transaction amount_cents minus refunded_cents at that moment; the convenience fee is never clawed back" }
      - { name: opened_at, type: datetime, source: system, description: "Logical-clock timestamp when the case was opened" }
      - { name: evidence_due_at, type: datetime, source: computed, description: "opened_at + 10 days; contest is accepted while logical clock <= evidence_due_at" }
      - { name: evidence_note, type: string, source: system, description: "Evidence memo supplied by the agency at contest; null until contested" }
      - { name: status, type: enum, source: system, description: "OPENED | CONTESTED | ACCEPTED | WON | LOST", default: OPENED }

  - name: SelfFundingLedgerEntry
    parent: null
    common_fields: false
    fields:
      - { name: period, type: string, source: input, description: "YYYY-MM period being closed; unique across entries" }
      - { name: fees_collected_cents, type: integer, source: computed, description: "Sum of charged_fee_cents over all transactions with captured_at inside the period" }
      - { name: absorbed_billed_cents, type: integer, source: computed, description: "Sum of tiered monthly invoices (MARGINAL_CHRONOLOGICAL variant) over agencies' ABSORBED transactions captured in the period" }
      - { name: absorbed_billed_flat_cents, type: integer, source: computed, description: "Audit-only FLAT_RETROACTIVE variant of the same invoice set; differs from absorbed_billed_cents whenever a month crosses a band boundary" }
      - { name: processing_costs_cents, type: integer, source: computed, description: "Sum of final_fee_cents over all transactions (both fee models) captured in the period" }
      - { name: accrual_portal_recovery_cents, type: integer, source: computed, description: "ACCRUAL variant: straight-line amortization recognized this period regardless of pool sufficiency" }
      - { name: cash_portal_recovery_cents, type: integer, source: computed, description: "CASH variant: recovery actually taken from the pool this period" }
      - { name: surplus_remitted_cents, type: integer, source: computed, description: "Pool remainder swept to the state treasury after cost recovery" }
      - { name: pool_balance_after_cents, type: integer, source: computed, description: "Self-funding pool balance after this close; carries deficits negative" }
      - { name: portal_cost_remaining_accrual_cents, type: integer, source: computed, description: "TOTAL_PORTAL_COST minus cumulative accrual recognition" }
      - { name: portal_cost_remaining_cash_cents, type: integer, source: computed, description: "TOTAL_PORTAL_COST minus cumulative cash recovery" }

# =============================================================================
# §1.2: State Machine Table
# =============================================================================
state_machines:
  - entity: Agency
    initial_state: ONBOARDING
    terminal_states: [OFFBOARDED]
    transitions:
      - from: ONBOARDING
        to: ACTIVE
        trigger: "POST /portal/agencies/{id}/activate"
        actor: PlatformAdmin
        preconditions:
          - "At least one AgencySettlementAccount of this agency has status VERIFIED (else ERR_NO_VERIFIED_ACCOUNT)"
          - "At least one ComplianceAttestation of this agency with attestation_type PCI_DSS_AOC has computed status CURRENT (else ERR_COMPLIANCE_LAPSED)"
        side_effects:
          - "activated_at = logical clock; Agency.version increments"
      - from: SUSPENDED
        to: ACTIVE
        trigger: "POST /portal/agencies/{id}/activate"
        actor: PlatformAdmin
        preconditions:
          - "Same two gates as ONBOARDING -> ACTIVE (verified account, CURRENT PCI_DSS_AOC)"
        side_effects:
          - "activated_at = logical clock; Agency.version increments"
          - "Services DEACTIVATED by the earlier suspend cascade are NOT restored; each needs its own activate call"
      - from: ACTIVE
        to: SUSPENDED
        trigger: "POST /portal/agencies/{id}/suspend"
        actor: PlatformAdmin
        preconditions: []
        side_effects:
          - "Cascade (link 1): every ServiceCatalogItem of this agency in status ACTIVE -> DEACTIVATED"
          - "Cascade (link 2): for each service deactivated by link 1, every FeeQuote of that service in status OPEN -> VOIDED"
          - "In-flight transactions (AUTHORIZED / CAPTURED) are unaffected and may still capture and settle"
      - from: ACTIVE
        to: OFFBOARDED
        trigger: "POST /portal/agencies/{id}/offboard"
        actor: PlatformAdmin
        preconditions:
          - "No PaymentTransaction of this agency in funds_status AUTHORIZED, CAPTURED or RE_PRESENTED"
          - "No SettlementBatch of this agency in status OPEN, CLOSED, SUBMITTED, CONFIRMED or EXCEPTION"
          - "Else ERR_OFFBOARD_BLOCKED"
        side_effects:
          - "All remaining non-DEACTIVATED ServiceCatalogItems -> DEACTIVATED; their OPEN FeeQuotes -> VOIDED"

  - entity: AgencySettlementAccount
    initial_state: PENDING_VERIFICATION
    terminal_states: [RETIRED]
    transitions:
      - from: PENDING_VERIFICATION
        to: VERIFIED
        trigger: "POST /portal/settlement-accounts/{id}/verify with outcome SUCCESS"
        actor: TreasuryOfficer
        preconditions: []
        side_effects:
          - "verified_at = logical clock; verification_attempts += 1"
      - from: PENDING_VERIFICATION
        to: PENDING_VERIFICATION
        trigger: "POST /portal/settlement-accounts/{id}/verify with outcome FAILURE"
        actor: TreasuryOfficer
        preconditions: []
        side_effects:
          - "verification_attempts += 1"
      - from: VERIFIED
        to: RETIRED
        trigger: "system (a newer AgencySettlementAccount created with supersedes_account_id pointing at this account)"
        actor: system
        preconditions:
          - "New account's effective_from is strictly later than this account's effective_from (else ERR_INVALID_REQUEST)"
        side_effects:
          - "effective_to = new account's effective_from (half-open handoff: [old.from, new.from) then [new.from, null))"

  - entity: ServiceCatalogItem
    initial_state: DRAFT
    terminal_states: [DEACTIVATED]
    transitions:
      - from: DRAFT
        to: ACTIVE
        trigger: "POST /portal/services/{id}/activate"
        actor: PlatformAdmin
        preconditions:
          - "Agency of this service has status ACTIVE (else ERR_AGENCY_NOT_ACTIVE)"
          - "If fee_model == CONVENIENCE_FEE: at least one StatutoryAuthorization of this service has in_effect == true at the logical clock (else ERR_NO_STATUTORY_COVERAGE); ABSORBED services need none"
        side_effects: []
      - from: ACTIVE
        to: DEACTIVATED
        trigger: "POST /portal/services/{id}/deactivate OR system (agency suspend/offboard cascade)"
        actor: PlatformAdmin | system
        preconditions: []
        side_effects:
          - "Every FeeQuote of this service in status OPEN -> VOIDED"
      - from: DRAFT
        to: DEACTIVATED
        trigger: "POST /portal/services/{id}/deactivate"
        actor: PlatformAdmin
        preconditions: []
        side_effects: []

  - entity: StatutoryAuthorization
    initial_state: DRAFT
    terminal_states: []
    transitions:
      - from: DRAFT
        to: APPROVED
        trigger: "POST /portal/statutory-authorizations/{id}/approve"
        actor: PlatformAdmin
        preconditions:
          - "Parent service exists and is not DEACTIVATED (else ERR_INVALID_STATE)"
          - "Closed-window overlap: no other APPROVED authorization of the same service with [effective_from, effective_to] intersecting this one; closed intervals, so effective_from == other.effective_to IS an overlap (ERR_AUTHORIZATION_WINDOW_OVERLAP)"
        side_effects: []
    note: "Expiry is not a stored transition: in_effect flips to false when the logical clock passes effective_to."

  - entity: PaymentInstrument
    initial_state: ACTIVE
    terminal_states: [DEACTIVATED]
    transitions:
      - from: PENDING_VERIFICATION
        to: ACTIVE
        trigger: "POST /portal/instruments/{id}/verify-ach with outcome SUCCESS"
        actor: Payer | PlatformAdmin
        preconditions:
          - "Instrument method == ECHECK (else ERR_INVALID_STATE)"
        side_effects: []
      - from: PENDING_VERIFICATION
        to: PENDING_VERIFICATION
        trigger: "POST /portal/instruments/{id}/verify-ach with outcome FAILURE while ach_verify_failures < 2"
        actor: Payer | PlatformAdmin
        preconditions: []
        side_effects:
          - "ach_verify_failures += 1"
      - from: PENDING_VERIFICATION
        to: DEACTIVATED
        trigger: "POST /portal/instruments/{id}/verify-ach with outcome FAILURE that makes ach_verify_failures reach 3"
        actor: Payer | PlatformAdmin
        preconditions: []
        side_effects:
          - "ach_verify_failures = 3"
    note: "CARD and WALLET instruments are created ACTIVE and never enter PENDING_VERIFICATION; ECHECK instruments are created PENDING_VERIFICATION."

  - entity: PaymentTransaction
    initial_state: AUTHORIZED
    terminal_states: [VOIDED]
    transitions:
      - from: AUTHORIZED
        to: CAPTURED
        trigger: "POST /portal/payment-transactions/{id}/capture"
        actor: AgencyAdmin | PlatformAdmin
        preconditions: []
        side_effects:
          - "captured_at = logical clock"
          - "value_date = capture calendar date + method lag (CARD 1 day, WALLET 1 day, ECHECK 2 days)"
      - from: AUTHORIZED
        to: VOIDED
        trigger: "POST /portal/payment-transactions/{id}/void"
        actor: AgencyAdmin | PlatformAdmin
        preconditions: []
        side_effects:
          - "Authorization released; the transaction can never be captured, settled, refunded, returned or charged back"
      - from: CAPTURED
        to: SETTLED
        trigger: "system (POST /portal/settlement-batches/{id}/close sweeps eligible transactions)"
        actor: system
        preconditions:
          - "value_date <= batch.business_date and current_batch_id is null"
        side_effects:
          - "current_batch_id = batch.id"
      - from: SETTLED
        to: RETURNED
        trigger: "POST /portal/payment-transactions/{id}/ach-return"
        actor: PlatformAdmin
        preconditions:
          - "method == ECHECK (else ERR_RETURN_NOT_PERMITTED)"
        side_effects:
          - "returned_at = logical clock; current_batch_id = null"
          - "Cascade (link 1): a return debit of amount_cents is posted into the agency's OPEN batch (return_debits_cents += amount_cents); if no OPEN batch exists the system auto-creates one with business_date = current clock date"
          - "Cascade (link 2): that batch's projected deposit drops by amount_cents"
          - "The withheld convenience fee is NOT returned to the payer and NOT clawed back from the pool"
      - from: RE_PRESENTED
        to: RETURNED
        trigger: "POST /portal/payment-transactions/{id}/ach-return"
        actor: PlatformAdmin
        preconditions:
          - "method == ECHECK (else ERR_RETURN_NOT_PERMITTED)"
        side_effects:
          - "Same cascade as SETTLED -> RETURNED; representment_count stays 1, so no further re-presentment is possible"
      - from: RETURNED
        to: RE_PRESENTED
        trigger: "POST /portal/payment-transactions/{id}/re-present"
        actor: AgencyAdmin
        preconditions:
          - "representment_count == 0 (else ERR_REPRESENTMENT_EXHAUSTED)"
          - "logical clock <= returned_at + 30 days (else ERR_REPRESENTMENT_WINDOW_CLOSED)"
        side_effects:
          - "representment_count = 1"
          - "value_date = current clock calendar date + 2 days (ECHECK lag); the transaction re-enters batch membership"
      - from: RE_PRESENTED
        to: SETTLED
        trigger: "system (POST /portal/settlement-batches/{id}/close sweeps eligible transactions)"
        actor: system
        preconditions:
          - "value_date <= batch.business_date and current_batch_id is null"
        side_effects:
          - "current_batch_id = batch.id"
    note: "RETURNED with representment_count == 1 is effectively terminal for the funds flow; refunds remain possible from any of CAPTURED, SETTLED, RE_PRESENTED per the Refund machine."

  - entity: SettlementBatch
    initial_state: OPEN
    terminal_states: [RECONCILED]
    transitions:
      - from: OPEN
        to: CLOSED
        trigger: "POST /portal/settlement-batches/{id}/close"
        actor: PlatformAdmin
        preconditions: []
        side_effects:
          - "Sweep: every PaymentTransaction of this agency with funds_status in {CAPTURED, RE_PRESENTED}, current_batch_id null and value_date <= business_date becomes a member and transitions to SETTLED"
          - "member_count, gross_amount_cents, fees_withheld_cents finalized; deposit_cents = gross - refund_debits - return_debits - chargeback_debits"
          - "deposit_due_date = max(member value_date), or business_date when member_count == 0"
          - "Cascade: each newly SETTLED transaction updates the period accruals used by the self-funding sweep (fees_collected bases on captured_at, unaffected by this batching)"
      - from: CLOSED
        to: SUBMITTED
        trigger: "POST /portal/settlement-batches/{id}/submit"
        actor: PlatformAdmin
        preconditions: []
        side_effects:
          - "submitted_at = logical clock; reconciliation expectation (deposit_cents, deposit_due_date) is frozen"
      - from: SUBMITTED
        to: CONFIRMED
        trigger: "POST /portal/settlement-batches/{id}/confirm-deposit"
        actor: TreasuryOfficer
        preconditions: []
        side_effects:
          - "actual_deposit_cents = input; confirmed_at = logical clock"
          - "Segregation of duties: the confirming TreasuryOfficer role is disjoint from the PlatformAdmin role that submitted"
      - from: CONFIRMED
        to: RECONCILED
        trigger: "POST /portal/settlement-batches/{id}/reconcile and no mismatch is found"
        actor: PlatformAdmin
        preconditions: []
        side_effects: []
      - from: CONFIRMED
        to: EXCEPTION
        trigger: "POST /portal/settlement-batches/{id}/reconcile and a mismatch is found"
        actor: PlatformAdmin
        preconditions: []
        side_effects:
          - "If actual_deposit_cents != deposit_cents: create ReconciliationException AMOUNT_MISMATCH (expected_cents = deposit_cents, actual_cents = actual_deposit_cents)"
          - "If calendar date of confirmed_at > deposit_due_date + 1 day grace: create ReconciliationException DEPOSIT_LATE (actual_cents null)"
          - "Both exceptions may be created by one reconcile"
      - from: EXCEPTION
        to: RECONCILED
        trigger: "system (the batch's last OPEN ReconciliationException is resolved)"
        actor: system
        preconditions:
          - "open_exception_count reaches 0"
        side_effects: []

  - entity: ReconciliationException
    initial_state: OPEN
    terminal_states: [RESOLVED]
    transitions:
      - from: OPEN
        to: RESOLVED
        trigger: "POST /portal/reconciliation-exceptions/{id}/resolve"
        actor: PlatformAdmin
        preconditions:
          - "Parent batch status == EXCEPTION (else ERR_INVALID_STATE)"
        side_effects:
          - "resolution_note = input"
          - "Bubble up: when the parent batch's open_exception_count reaches 0, batch EXCEPTION -> RECONCILED"

  - entity: Refund
    initial_state: REQUESTED
    terminal_states: [APPROVED, DENIED]
    transitions:
      - from: REQUESTED
        to: APPROVED
        trigger: "POST /portal/refunds/{id}/decide with decision APPROVE"
        actor: AgencyAdmin
        preconditions:
          - "decided_by (X-User-ID) != initiated_by_user_id (else ERR_SEGREGATION_OF_DUTIES)"
          - "An OPEN SettlementBatch exists for the agency of the underlying transaction (else ERR_NO_OPEN_BATCH)"
        side_effects:
          - "decided_by_user_id = X-User-ID"
          - "Cascade (link 1): PaymentTransaction.refunded_cents += amount_cents; remaining_refundable_cents recomputed"
          - "Cascade (link 2): refund debit of amount_cents posted into the agency's OPEN batch (refund_debits_cents += amount_cents)"
      - from: REQUESTED
        to: DENIED
        trigger: "POST /portal/refunds/{id}/decide with decision DENY"
        actor: AgencyAdmin
        preconditions:
          - "decided_by (X-User-ID) != initiated_by_user_id (else ERR_SEGREGATION_OF_DUTIES)"
        side_effects:
          - "decided_by_user_id = X-User-ID"

  - entity: ChargebackCase
    initial_state: OPENED
    terminal_states: [ACCEPTED, WON, LOST]
    transitions:
      - from: OPENED
        to: CONTESTED
        trigger: "POST /portal/chargebacks/{id}/contest"
        actor: AgencyAdmin
        preconditions:
          - "logical clock <= evidence_due_at (else ERR_EVIDENCE_DEADLINE_PASSED)"
        side_effects:
          - "evidence_note = input"
      - from: OPENED
        to: ACCEPTED
        trigger: "POST /portal/chargebacks/{id}/accept"
        actor: AgencyAdmin
        preconditions: []
        side_effects:
          - "network_debit_cents = transaction.amount_cents - transaction.refunded_cents at this moment"
          - "PaymentTransaction.charged_back_cents = network_debit_cents; remaining_refundable_cents recomputed"
          - "Chargeback debit of network_debit_cents posted into the agency's OPEN batch (chargeback_debits_cents += network_debit_cents); if no OPEN batch exists the system auto-creates one with business_date = current clock date"
      - from: CONTESTED
        to: WON
        trigger: "POST /portal/chargebacks/{id}/record-outcome with outcome WON"
        actor: PlatformAdmin
        preconditions: []
        side_effects:
          - "No financial movement: the provisional case closes with zero debit"
      - from: CONTESTED
        to: LOST
        trigger: "POST /portal/chargebacks/{id}/record-outcome with outcome LOST"
        actor: PlatformAdmin
        preconditions: []
        side_effects:
          - "Same financial effects as OPENED -> ACCEPTED (network_debit_cents computed now, txn charged_back_cents set, OPEN-batch debit with auto-create)"
      - from: OPENED
        to: LOST
        trigger: "POST /portal/chargebacks/{id}/record-outcome with outcome LOST while the case is still OPENED and the logical clock > evidence_due_at"
        actor: PlatformAdmin
        preconditions:
          - "logical clock > evidence_due_at (an OPENED case whose deadline has not passed cannot be outcome-recorded: ERR_INVALID_STATE)"
        side_effects:
          - "Same financial effects as CONTESTED -> LOST"

# =============================================================================
# §1.2.1: Concurrency Rules (OCC on parent version only)
# =============================================================================
concurrency_rules:
  - rule_id: settlement-account-create-stale-agency
    parent_entity: Agency
    write_endpoint: "POST /portal/settlement-accounts"
    occ_field: "expected_agency_version"
    description: |
      Creating a settlement account mutates the agency aggregate (a supersede
      retires the live account and closes its window). A create carrying an
      expected_agency_version older than the agency's current version is
      rejected: the caller's view of the agency's account structure predates a
      change another writer already committed (e.g. a prior create that
      legitimately superseded the same live account).
    error_id: ERR_STALE_VERSION
    http_status: 412
  - rule_id: service-update-stale-version
    parent_entity: ServiceCatalogItem
    write_endpoint: "PUT /portal/services/{id}"
    occ_field: "expected_service_version"
    description: |
      Repricing a service invalidates quotes pinned to its prior version. A
      PUT carrying an expected_service_version older than the service's
      current version is rejected: the caller edited a stale copy of the
      pricing configuration.
    error_id: ERR_STALE_VERSION
    http_status: 412

# =============================================================================
# §1.3: Calculation Rules Table
# =============================================================================
calculations:
  - name: convenience_fee
    trigger: "QUOTED variant: POST /portal/fee-quotes. FINAL variant: POST /portal/payment-transactions (authorize)"
    algorithm: tiered_pricing
    formula: |
      Inputs: amount_cents, method, card_cost_bucket_used, covering statutory fee_cap_cents.
      Step 1 (rate selection): pick (rate_bp, fixed_cents) from FEE_RATES by method:
        CARD   -> by card_cost_bucket_used
        ECHECK -> flat 150 cents, no rate
        WALLET -> (180, 25)
      Step 2 (gross-up, circular resolution): the processor charges its rate on the
        GROSS charge (amount + fee), and the fee must exactly cover that cost, so
        fee appears on both sides. The evaluation order is pinned: resolve the rate
        FIRST, then apply the closed form, never iterate:
          fee_raw_cents = ceil( (rate_bp * amount_cents + fixed_cents * 10000) / (10000 - rate_bp) )
        For ECHECK: fee_raw_cents = 150 (flat, no gross-up).
      Step 3 (floor): fee_cents = max(MIN_FEE_CENTS, fee_raw_cents)
      Step 4 (statutory cap, checked AFTER the floor): if fee_cents > fee_cap_cents
        the payment cannot proceed under CONVENIENCE_FEE -> ERR_FEE_EXCEEDS_STATUTORY_CAP
        (the fee is never clamped to the cap; the cap is a hard stop).
        fee_cents == fee_cap_cents exactly is allowed.
      ABSORBED services: fee is 0 in both variants; steps 1-4 are skipped.
    input_set: "The quote's amount_cents and method; card_cost_bucket_used per variant below"
    constants:
      MIN_FEE_CENTS: 100
      FEE_RATES: "{CARD: {CONSUMER_DEBIT: [150, 25], CONSUMER_CREDIT: [220, 30], COMMERCIAL: [290, 35]}, ECHECK: [0, 150], WALLET: [180, 25]}"
      QUOTE_TTL_MINUTES: 30
    precision: "integer cents; the gross-up division rounds UP (ceiling) to the next cent"
    variants:
      - name: QUOTED
        when: "FeeQuote creation (checkout disclosure)"
        difference: "card_cost_bucket_used = CONSUMER_CREDIT whenever method == CARD (conservative statutory disclosure), regardless of the instrument later presented; ECHECK and WALLET quotes are exact"
      - name: FINAL
        when: "Authorize (PaymentTransaction creation)"
        difference: "card_cost_bucket_used = the instrument's actual card_cost_bucket; recorded as PaymentTransaction.final_fee_cents and accrued as the portal's processing cost for the transaction"

  - name: agency_absorbed_monthly_invoice
    trigger: "POST /portal/self-funding/close-period"
    algorithm: tiered_pricing
    formula: |
      For each agency, take its ABSORBED-fee-model transactions with captured_at inside
      the period, ordered by captured_at ASC then created_at ASC (chronological).
      Walk a cumulative volume counter starting at 0. For each transaction:
        first_cent = cumulative + 1; last_cent = cumulative + amount_cents.
        Split [first_cent, last_cent] across the agency's pricing bands for
        effective_month == period (bands are CLOSED intervals [volume_min_cents,
        volume_max_cents] on the cumulative-volume axis).
        unrounded = sum over bands of portion_cents * rate_bp / 10000
        line_fee_cents = round_half_up(unrounded) + per_txn_cents of the band
                         containing first_cent
        cumulative = last_cent
      invoice_cents = sum of line_fee_cents over the month's transactions.
      If the agency has ABSORBED captures in the period but its tier bands for the
      month do not cover the reached cumulative volume -> ERR_TIER_COVERAGE_GAP
      aborts the whole close-period call.
    input_set: "Agency ABSORBED transactions with captured_at in the period, funds_status != VOIDED"
    constants: {}
    precision: "per-transaction line rounded half-up to cents FIRST, then summed as integers (never round the aggregate)"
    variants:
      - name: MARGINAL_CHRONOLOGICAL
        when: "The governing variant (pinned)"
        difference: "each transaction is priced at the band(s) its own cumulative span touches, straddling splits across bands"
      - name: FLAT_RETROACTIVE
        when: "Alternative reading of 'contract pricing tiers', computed for audit only"
        difference: "the month's TOTAL volume selects a single band whose rate applies to all volume: round_half_up(total * rate_bp / 10000) + count * per_txn_cents of that band; produces a different invoice whenever the month crosses a band boundary"

  - name: value_date
    trigger: "POST /portal/payment-transactions/{id}/capture; recomputed by re-present"
    algorithm: threshold
    formula: |
      value_date = calendar_date(captured_at) + METHOD_LAG_DAYS[method]
      On re-present: value_date = calendar_date(current logical clock) + METHOD_LAG_DAYS.ECHECK
      Batch membership requires value_date <= batch.business_date (inclusive:
      value_date == business_date IS swept in).
    input_set: "The transaction's method and capture date"
    constants:
      METHOD_LAG_DAYS: "{CARD: 1, WALLET: 1, ECHECK: 2}"
    precision: "calendar-day granularity, YYYY-MM-DD"

  - name: settlement_batch_totals
    trigger: "POST /portal/settlement-batches/{id}/close"
    algorithm: aggregation
    formula: |
      members = transactions of the batch's agency with funds_status in
        {CAPTURED, RE_PRESENTED}, current_batch_id == null, value_date <= business_date
      member_count = |members| (an empty close is legal: member_count 0)
      gross_amount_cents = sum(member.amount_cents)
      fees_withheld_cents = sum(member.charged_fee_cents)
      deposit_cents = gross_amount_cents - refund_debits_cents - return_debits_cents
                      - chargeback_debits_cents   (may be negative)
      deposit_due_date = max(member.value_date) if members else business_date
      Each member: funds_status -> SETTLED, current_batch_id = batch.id.
    input_set: "Agency transactions meeting the membership predicate at close time"
    constants: {}
    precision: "integer cents"

  - name: portal_cost_recognition
    trigger: "POST /portal/self-funding/close-period"
    algorithm: forward_looking
    formula: |
      cost_remaining_accrual_before = TOTAL_PORTAL_COST_CENTS
                                      - sum(prior entries.accrual_portal_recovery_cents)
      accrual_portal_recovery_cents = min(MONTHLY_AMORTIZATION_CENTS, cost_remaining_accrual_before)
      (Cash variant computed inside portal_pool_sweep.)
      portal_cost_remaining_accrual_cents = cost_remaining_accrual_before - accrual_portal_recovery_cents
      portal_cost_remaining_cash_cents = TOTAL_PORTAL_COST_CENTS
                                         - sum(all entries.cash_portal_recovery_cents including this one)
    input_set: "All prior SelfFundingLedgerEntry rows"
    constants:
      TOTAL_PORTAL_COST_CENTS: 12000000
      AMORTIZATION_MONTHS: 60
      MONTHLY_AMORTIZATION_CENTS: 200000
    precision: "integer cents"
    variants:
      - name: ACCRUAL
        when: "Financial reporting basis (pinned for portal_cost_remaining reporting)"
        difference: "recognizes the full monthly amortization even when the fee pool cannot cover it"
      - name: CASH
        when: "Governs actual money movement in the pool sweep"
        difference: "recognizes only what the pool can pay after processing costs: min(accrual_portal_recovery_cents, max(0, pool_available)); shortfalls defer, they never vanish"

  - name: portal_pool_sweep
    trigger: "POST /portal/self-funding/close-period"
    algorithm: waterfall_allocation
    formula: |
      fees_collected_cents    = sum(charged_fee_cents) over transactions (any model)
                                with captured_at inside the period
      absorbed_billed_cents   = sum(agency_absorbed_monthly_invoice) over agencies with
                                ABSORBED captures in the period
      processing_costs_cents  = sum(final_fee_cents) over the same transaction set
      pool_available          = fees_collected_cents + absorbed_billed_cents - processing_costs_cents
      Bucket 1 (processing costs): already netted inside pool_available; pool may go
        negative — a deficit carries, it is not an error.
      Bucket 2 (portal cost recovery, CASH): cash_portal_recovery_cents =
        min(accrual_portal_recovery_cents, max(0, pool_available))
      Bucket 3 (surplus to treasury): surplus_remitted_cents =
        max(0, pool_available - cash_portal_recovery_cents)
      pool_balance_after_cents = prior pool balance + pool_available
                                 - cash_portal_recovery_cents - surplus_remitted_cents
      Conservation: pool_balance_after == prior + pool_available - cash_recovery - surplus,
      with zero remainder — every cent lands in exactly one bucket.
      A period may be closed only once (ERR_PERIOD_ALREADY_CLOSED).
    input_set: "All transactions with captured_at in the period; all prior ledger entries"
    constants: {}
    precision: "integer cents"

  - name: reconciliation_match
    trigger: "POST /portal/settlement-batches/{id}/reconcile"
    algorithm: threshold
    formula: |
      amount_ok = (actual_deposit_cents == deposit_cents)
      late      = calendar_date(confirmed_at) > deposit_due_date + GRACE_DAYS
      amount mismatch -> create AMOUNT_MISMATCH exception (expected_cents = deposit_cents,
        actual_cents = actual_deposit_cents)
      late            -> create DEPOSIT_LATE exception
      both clean -> batch CONFIRMED -> RECONCILED; else batch CONFIRMED -> EXCEPTION
      Grace boundary: confirmed exactly on deposit_due_date + GRACE_DAYS is NOT late.
    input_set: "The batch's finalized deposit_cents / deposit_due_date and the confirmation record"
    constants:
      GRACE_DAYS: 1
    precision: "integer cents; calendar-day granularity"

# =============================================================================
# §1.4: Validation Rules Table (ordered by priority; a request failing several
# checks reports the LOWEST priority number's error)
# =============================================================================
validations:
  - priority: 1
    category: auth
    check: "X-User-ID and X-User-Role headers present; X-User-Role is a declared role"
    error_id: ERR_MISSING_OR_INVALID_USER_CONTEXT
    http_status: 400
    applies_to: "all endpoints"

  - priority: 2
    category: auth
    check: "Caller role is listed in the endpoint's roles"
    error_id: ERR_FORBIDDEN_FOR_ROLE
    http_status: 403
    applies_to: "all endpoints"

  - priority: 3
    category: existence
    check: "Path ids resolve first (left to right), then body foreign keys in the endpoint's declared input order"
    error_id: "ERR_AGENCY_NOT_FOUND | ERR_SERVICE_NOT_FOUND | ERR_PAYER_NOT_FOUND | ERR_INSTRUMENT_NOT_FOUND | ERR_QUOTE_NOT_FOUND | ERR_TRANSACTION_NOT_FOUND | ERR_BATCH_NOT_FOUND | ERR_ACCOUNT_NOT_FOUND | ERR_AUTHORIZATION_NOT_FOUND | ERR_REFUND_NOT_FOUND | ERR_CHARGEBACK_NOT_FOUND | ERR_EXCEPTION_NOT_FOUND"
    http_status: 404
    applies_to: "all resource endpoints"

  - priority: 4
    category: state
    check: "OCC: expected_agency_version / expected_service_version equals the parent's current version (evaluated before all state checks)"
    error_id: ERR_STALE_VERSION
    http_status: 412
    applies_to: "POST /portal/settlement-accounts; PUT /portal/services/{id}"

  - priority: 5
    category: state
    check: "Target resource is in a state that permits the operation (incl. ERR_AGENCY_NOT_ACTIVE for agency-gated operations, ERR_QUOTE_ALREADY_CONSUMED folded into ERR_INVALID_STATE, ERR_BATCH_ALREADY_OPEN for batch create, ERR_CHARGEBACK_ALREADY_OPEN for chargeback create, ERR_PERIOD_ALREADY_CLOSED for period close, ERR_INVALID_STATE otherwise)"
    error_id: "ERR_INVALID_STATE | ERR_AGENCY_NOT_ACTIVE | ERR_BATCH_ALREADY_OPEN | ERR_CHARGEBACK_ALREADY_OPEN | ERR_PERIOD_ALREADY_CLOSED"
    http_status: 409
    applies_to: "all state-transition and state-gated endpoints"

  - priority: 6
    category: business_safety
    check: "Compliance and statutory gates: agency holds a CURRENT PCI_DSS_AOC attestation where required (ERR_COMPLIANCE_LAPSED); CONVENIENCE_FEE quote/activation requires a covering in-effect StatutoryAuthorization (ERR_NO_STATUTORY_COVERAGE); agency activation requires a VERIFIED settlement account (ERR_NO_VERIFIED_ACCOUNT)"
    error_id: "ERR_COMPLIANCE_LAPSED | ERR_NO_STATUTORY_COVERAGE | ERR_NO_VERIFIED_ACCOUNT"
    http_status: 409
    applies_to: "agency activate; service activate; POST /portal/fee-quotes; POST /portal/payment-transactions"
    note: "ERR_NO_STATUTORY_COVERAGE is http 422; the other two are 409."

  - priority: 7
    category: business_safety
    check: "Segregation of duties: refund decide X-User-ID must differ from the refund's initiated_by_user_id"
    error_id: ERR_SEGREGATION_OF_DUTIES
    http_status: 403
    applies_to: "POST /portal/refunds/{id}/decide"

  - priority: 8
    category: business_constraint
    check: "Structural uniqueness and interval rules: settlement-account windows half-open non-overlap (ERR_ACCOUNT_WINDOW_OVERLAP); authorization windows closed-interval non-overlap (ERR_AUTHORIZATION_WINDOW_OVERLAP); pricing bands closed-interval non-overlap per agency+month (ERR_TIER_BAND_OVERLAP); service_code unique per agency among non-DEACTIVATED (ERR_DUPLICATE_SERVICE_CODE); payer email unique (ERR_DUPLICATE_PAYER_EMAIL); re-presentment count limit (ERR_REPRESENTMENT_EXHAUSTED); method-specific operation legality (ERR_RETURN_NOT_PERMITTED, ERR_CHARGEBACK_NOT_PERMITTED)"
    error_id: "ERR_ACCOUNT_WINDOW_OVERLAP | ERR_AUTHORIZATION_WINDOW_OVERLAP | ERR_TIER_BAND_OVERLAP | ERR_DUPLICATE_SERVICE_CODE | ERR_DUPLICATE_PAYER_EMAIL | ERR_REPRESENTMENT_EXHAUSTED | ERR_RETURN_NOT_PERMITTED | ERR_CHARGEBACK_NOT_PERMITTED"
    http_status: 409
    applies_to: "resource-creation and method-specific action endpoints"

  - priority: 9
    category: business_temporal
    check: "Clock-relative gates: quote not expired (ERR_QUOTE_EXPIRED); chargeback contest within evidence window (ERR_EVIDENCE_DEADLINE_PASSED); re-presentment within 30 days of return (ERR_REPRESENTMENT_WINDOW_CLOSED)"
    error_id: "ERR_QUOTE_EXPIRED | ERR_EVIDENCE_DEADLINE_PASSED | ERR_REPRESENTMENT_WINDOW_CLOSED"
    http_status: 409
    applies_to: "authorize; chargeback contest; re-present"

  - priority: 10
    category: business_referential
    check: "Ownership and linkage: Payer may only touch own payer record, instruments, quotes, transactions (ERR_NOT_RESOURCE_OWNER); instrument status usable for authorize (ERR_INSTRUMENT_NOT_USABLE); instrument method matches quote method and is in service.allowed_methods (ERR_METHOD_NOT_ALLOWED); service version unchanged since quote (ERR_STALE_SERVICE_VERSION); an OPEN settlement batch exists for refund approval (ERR_NO_OPEN_BATCH)"
    error_id: "ERR_NOT_RESOURCE_OWNER | ERR_INSTRUMENT_NOT_USABLE | ERR_METHOD_NOT_ALLOWED | ERR_STALE_SERVICE_VERSION | ERR_NO_OPEN_BATCH"
    http_status: 409
    applies_to: "payer-scoped reads/writes; authorize; refund decide"
    note: "ERR_NOT_RESOURCE_OWNER is http 403; the rest are 409."

  - priority: 11
    category: business_fiscal
    check: "Money and range rules: amount within service [min_amount_cents, max_amount_cents] inclusive (ERR_AMOUNT_OUT_OF_RANGE); computed fee within statutory cap (ERR_FEE_EXCEEDS_STATUTORY_CAP); refund amount <= remaining_refundable_cents (ERR_REFUND_EXCEEDS_REMAINING); absorbed tier coverage for the month's volume (ERR_TIER_COVERAGE_GAP); offboard requires zero unsettled exposure (ERR_OFFBOARD_BLOCKED)"
    error_id: "ERR_AMOUNT_OUT_OF_RANGE | ERR_FEE_EXCEEDS_STATUTORY_CAP | ERR_REFUND_EXCEEDS_REMAINING | ERR_TIER_COVERAGE_GAP | ERR_OFFBOARD_BLOCKED"
    http_status: 422
    applies_to: "quote create; refund create; self-funding close-period; agency offboard"
    note: "ERR_TIER_COVERAGE_GAP and ERR_OFFBOARD_BLOCKED are http 409; the range/cap/refund errors are 422."

# =============================================================================
# §1.5: API Endpoint Table
# =============================================================================
endpoints:
  # --- Test-driving logical clock (outside the business prefix) ---
  - method: POST
    path: "/_clock/set_current_utc"
    description: "Set the server's logical clock. Startup default before any call is exactly 2026-09-01T00:00:00Z; the logical clock never falls back to wall-clock time."
    roles: [PlatformAdmin]
    code: 200
    input: [current_utc]
    output: { current_utc: string }
    side_effects: ["All clock-derived computed fields (attestation status, quote expiry, deadlines) re-derive from the new clock on next read"]

  # --- Agency ---
  - method: POST
    path: "/portal/agencies"
    description: "Onboard an agency (status ONBOARDING)"
    roles: [PlatformAdmin]
    code: 201
    input: [legal_name, agency_type, default_fee_model]
    output: Agency
    side_effects: ["status=ONBOARDING, version=1"]

  - method: GET
    path: "/portal/agencies/{id}"
    description: "Get an agency"
    roles: [PlatformAdmin, AgencyAdmin, TreasuryOfficer, ComplianceAuditor]
    code: 200
    input: []
    output: Agency
    side_effects: []

  - method: POST
    path: "/portal/agencies/{id}/activate"
    description: "Activate from ONBOARDING or SUSPENDED; requires a VERIFIED settlement account and a CURRENT PCI_DSS_AOC attestation"
    roles: [PlatformAdmin]
    code: 200
    input: []
    output: Agency
    side_effects: ["status -> ACTIVE; activated_at set; does NOT restore services deactivated by a prior suspend"]

  - method: POST
    path: "/portal/agencies/{id}/suspend"
    description: "Suspend an ACTIVE agency; deactivates its ACTIVE services and voids their OPEN quotes"
    roles: [PlatformAdmin]
    code: 200
    input: []
    output: Agency
    side_effects: ["status -> SUSPENDED; service + quote cascade per Agency state machine"]

  - method: POST
    path: "/portal/agencies/{id}/offboard"
    description: "Terminal offboard; blocked while any unsettled transaction or unfinished batch exists"
    roles: [PlatformAdmin]
    code: 200
    input: []
    output: Agency
    side_effects: ["status -> OFFBOARDED; remaining services deactivated; ERR_OFFBOARD_BLOCKED on exposure"]

  # --- AgencySettlementAccount ---
  - method: POST
    path: "/portal/settlement-accounts"
    description: "Create a settlement account for an agency (OCC on Agency.version). Without supersedes_account_id the create fails if any non-RETIRED account window overlaps; with it, the named VERIFIED account is retired and its window closes at the new effective_from"
    roles: [PlatformAdmin]
    code: 201
    input: [agency_id, routing_number, account_number_last4, effective_from, "supersedes_account_id?", expected_agency_version]
    output: AgencySettlementAccount
    side_effects: ["status=PENDING_VERIFICATION; increments Agency.version by 1; on supersede: old account VERIFIED -> RETIRED with effective_to = new effective_from; ERR_ACCOUNT_WINDOW_OVERLAP; ERR_STALE_VERSION"]

  - method: GET
    path: "/portal/agencies/{id}/settlement-accounts"
    description: "List an agency's settlement accounts"
    roles: [PlatformAdmin, AgencyAdmin, TreasuryOfficer]
    code: 200
    input: []
    output: "AgencySettlementAccount[]"
    default_sort: "created_at ASC"
    side_effects: []

  - method: POST
    path: "/portal/settlement-accounts/{id}/verify"
    description: "Treasury verifies micro-deposit evidence; SUCCESS -> VERIFIED, FAILURE stays PENDING_VERIFICATION"
    roles: [TreasuryOfficer]
    code: 200
    input: [outcome]
    output: AgencySettlementAccount
    side_effects: ["verification_attempts += 1; verified_at set on SUCCESS"]

  # --- ContractPricingTier ---
  - method: POST
    path: "/portal/pricing-tiers"
    description: "Create an absorbed-model pricing band for an agency+month; closed-interval bands of the same agency and effective_month must not overlap (shared boundary cents count as overlap)"
    roles: [PlatformAdmin]
    code: 201
    input: [agency_id, volume_min_cents, volume_max_cents, rate_bp, per_txn_cents, effective_month]
    output: ContractPricingTier
    side_effects: ["ERR_TIER_BAND_OVERLAP on inclusive band collision"]

  - method: GET
    path: "/portal/agencies/{id}/pricing-tiers"
    description: "List an agency's pricing tiers"
    roles: [PlatformAdmin, AgencyAdmin, TreasuryOfficer]
    code: 200
    input: ["effective_month?"]
    output: "ContractPricingTier[]"
    default_sort: "created_at ASC"
    side_effects: []

  # --- ComplianceAttestation ---
  - method: POST
    path: "/portal/attestations"
    description: "File a compliance attestation for an agency; status CURRENT/EXPIRED is computed against the logical clock on read"
    roles: [ComplianceAuditor]
    code: 201
    input: [agency_id, attestation_type, issued_at, expires_at]
    output: ComplianceAttestation
    side_effects: []

  - method: GET
    path: "/portal/agencies/{id}/attestations"
    description: "List an agency's attestations (computed CURRENT/EXPIRED status)"
    roles: [PlatformAdmin, AgencyAdmin, ComplianceAuditor]
    code: 200
    input: []
    output: "ComplianceAttestation[]"
    default_sort: "created_at ASC"
    side_effects: []

  # --- ServiceCatalogItem ---
  - method: POST
    path: "/portal/services"
    description: "Create a catalog service (status DRAFT)"
    roles: [AgencyAdmin]
    code: 201
    input: [agency_id, service_code, name, "fee_model?", allowed_methods, min_amount_cents, max_amount_cents, gl_code]
    output: ServiceCatalogItem
    side_effects: ["fee_model defaults to the agency's default_fee_model; ERR_DUPLICATE_SERVICE_CODE"]

  - method: GET
    path: "/portal/services/{id}"
    description: "Get a service"
    roles: [PlatformAdmin, AgencyAdmin, TreasuryOfficer, ComplianceAuditor, Payer]
    code: 200
    input: []
    output: ServiceCatalogItem
    side_effects: []

  - method: GET
    path: "/portal/agencies/{id}/services"
    description: "List an agency's services"
    roles: [PlatformAdmin, AgencyAdmin, TreasuryOfficer, ComplianceAuditor, Payer]
    code: 200
    input: ["status?"]
    output: "ServiceCatalogItem[]"
    default_sort: "created_at ASC"
    side_effects: []

  - method: PUT
    path: "/portal/services/{id}"
    description: "Update pricing fields of a service (OCC on Service.version); bumps version and thereby invalidates quotes pinned to earlier versions"
    roles: [AgencyAdmin]
    code: 200
    input: ["name?", "min_amount_cents?", "max_amount_cents?", "allowed_methods?", expected_service_version]
    output: ServiceCatalogItem
    side_effects: ["increments ServiceCatalogItem.version by 1; ERR_STALE_VERSION on version mismatch"]

  - method: POST
    path: "/portal/services/{id}/activate"
    description: "Activate a DRAFT service; agency must be ACTIVE and CONVENIENCE_FEE services need an in-effect statutory authorization"
    roles: [PlatformAdmin]
    code: 200
    input: []
    output: ServiceCatalogItem
    side_effects: ["status -> ACTIVE; ERR_AGENCY_NOT_ACTIVE; ERR_NO_STATUTORY_COVERAGE"]

  - method: POST
    path: "/portal/services/{id}/deactivate"
    description: "Deactivate a DRAFT or ACTIVE service; voids its OPEN quotes"
    roles: [PlatformAdmin]
    code: 200
    input: []
    output: ServiceCatalogItem
    side_effects: ["status -> DEACTIVATED; OPEN FeeQuotes -> VOIDED"]

  # --- StatutoryAuthorization ---
  - method: POST
    path: "/portal/statutory-authorizations"
    description: "Draft a statutory authorization for a service"
    roles: [AgencyAdmin]
    code: 201
    input: [service_id, statute_citation, disclosure_text_version, fee_cap_cents, effective_from, effective_to]
    output: StatutoryAuthorization
    side_effects: ["status=DRAFT"]

  - method: POST
    path: "/portal/statutory-authorizations/{id}/approve"
    description: "Approve a DRAFT authorization; rejects closed-window overlaps with other APPROVED authorizations of the same service"
    roles: [PlatformAdmin]
    code: 200
    input: []
    output: StatutoryAuthorization
    side_effects: ["status -> APPROVED; ERR_AUTHORIZATION_WINDOW_OVERLAP"]

  - method: GET
    path: "/portal/services/{id}/authorizations"
    description: "List a service's statutory authorizations"
    roles: [PlatformAdmin, AgencyAdmin, ComplianceAuditor]
    code: 200
    input: []
    output: "StatutoryAuthorization[]"
    default_sort: "created_at ASC"
    side_effects: []

  # --- Payer ---
  - method: POST
    path: "/portal/payers"
    description: "Register a payer"
    roles: [Anonymous, PlatformAdmin]
    code: 201
    input: [full_name, email, billing_zip]
    output: Payer
    side_effects: ["ERR_DUPLICATE_PAYER_EMAIL"]

  - method: GET
    path: "/portal/payers/{id}"
    description: "Get a payer (Payer role may only read its own record)"
    roles: [PlatformAdmin, Payer]
    code: 200
    input: []
    output: Payer
    side_effects: ["ERR_NOT_RESOURCE_OWNER when Payer role reads another payer"]

  # --- PaymentInstrument ---
  - method: POST
    path: "/portal/payers/{id}/instruments"
    description: "Add a payment instrument. CARD/WALLET are ACTIVE immediately; ECHECK starts PENDING_VERIFICATION. Only last4 + a system token_ref are ever stored."
    roles: [Payer, PlatformAdmin]
    code: 201
    input: [method, "card_brand?", "card_cost_bucket?", last4]
    output: PaymentInstrument
    side_effects: ["Payer role must own path payer (ERR_NOT_RESOURCE_OWNER); card_brand/card_cost_bucket required iff method=CARD (ERR_INVALID_REQUEST)"]

  - method: GET
    path: "/portal/payers/{id}/instruments"
    description: "List a payer's instruments"
    roles: [PlatformAdmin, Payer]
    code: 200
    input: []
    output: "PaymentInstrument[]"
    default_sort: "created_at ASC"
    side_effects: []

  - method: POST
    path: "/portal/instruments/{id}/verify-ach"
    description: "Report micro-deposit verification outcome for an ECHECK instrument; third FAILURE deactivates it"
    roles: [Payer, PlatformAdmin]
    code: 200
    input: [outcome]
    output: PaymentInstrument
    side_effects: ["SUCCESS -> ACTIVE; FAILURE increments ach_verify_failures, DEACTIVATED at 3"]

  # --- FeeQuote ---
  - method: POST
    path: "/portal/fee-quotes"
    description: "Create a checkout fee quote: computes the QUOTED convenience fee, pins the disclosure text and the service version, expires 30 minutes after creation"
    roles: [Payer]
    code: 201
    input: [service_id, amount_cents, method]
    output: FeeQuote
    side_effects: ["payer_id = X-User-ID; gates: service ACTIVE, agency ACTIVE, attestation CURRENT, statutory coverage + disclosure for CONVENIENCE_FEE, amount in range, method allowed; ERR_AMOUNT_OUT_OF_RANGE; ERR_FEE_EXCEEDS_STATUTORY_CAP"]

  - method: GET
    path: "/portal/fee-quotes/{id}"
    description: "Get a fee quote"
    roles: [PlatformAdmin, Payer]
    code: 200
    input: []
    output: FeeQuote
    side_effects: []

  - method: GET
    path: "/portal/fee-quotes"
    description: "List fee quotes with optional filters"
    roles: [PlatformAdmin, AgencyAdmin, Payer]
    code: 200
    input: ["service_id?", "payer_id?", "statutory_authorization_id?"]
    output: "FeeQuote[]"
    default_sort: "created_at ASC"
    side_effects: []

  # --- PaymentTransaction ---
  - method: POST
    path: "/portal/payment-transactions"
    description: "Authorize a payment against an OPEN unexpired quote with a usable instrument; computes the FINAL fee variant and processing-cost accrual"
    roles: [Payer]
    code: 201
    input: [quote_id, instrument_id]
    output: PaymentTransaction
    side_effects: ["status=AUTHORIZED; quote OPEN -> CONSUMED; gates: attestation CURRENT, quote not expired, payer owns quote+instrument, instrument ACTIVE, method match, service version pin; ERR_STALE_SERVICE_VERSION; ERR_QUOTE_EXPIRED; ERR_INSTRUMENT_NOT_USABLE"]

  - method: GET
    path: "/portal/payment-transactions/{id}"
    description: "Get a payment transaction"
    roles: [PlatformAdmin, AgencyAdmin, TreasuryOfficer, Payer]
    code: 200
    input: []
    output: PaymentTransaction
    side_effects: []

  - method: GET
    path: "/portal/payment-transactions"
    description: "List payment transactions with optional filters; paginated per response envelope"
    roles: [PlatformAdmin, AgencyAdmin, TreasuryOfficer, Payer]
    code: 200
    input: ["agency_id?", "service_id?", "payer_id?", "instrument_id?", "quote_id?", "current_batch_id?", "funds_status?", "limit?", "offset?"]
    output: "PaymentTransaction[]"
    default_sort: "created_at ASC"
    side_effects: []

  - method: POST
    path: "/portal/payment-transactions/{id}/capture"
    description: "Capture an AUTHORIZED transaction; stamps captured_at and value_date"
    roles: [AgencyAdmin, PlatformAdmin]
    code: 200
    input: []
    output: PaymentTransaction
    side_effects: ["funds_status -> CAPTURED; captured_at = clock; value_date computed"]

  - method: POST
    path: "/portal/payment-transactions/{id}/void"
    description: "Void an AUTHORIZED transaction before capture (terminal)"
    roles: [AgencyAdmin, PlatformAdmin]
    code: 200
    input: []
    output: PaymentTransaction
    side_effects: ["funds_status -> VOIDED"]

  - method: POST
    path: "/portal/payment-transactions/{id}/ach-return"
    description: "Record an ACH return (R-code) for a SETTLED or RE_PRESENTED ECHECK transaction; posts a return debit into the agency's OPEN batch, auto-creating one for the clock date when none exists"
    roles: [PlatformAdmin]
    code: 200
    input: []
    output: PaymentTransaction
    side_effects: ["funds_status -> RETURNED; current_batch_id cleared; OPEN-batch return debit (auto-create batch if none); withheld fee retained by the portal"]

  - method: POST
    path: "/portal/payment-transactions/{id}/re-present"
    description: "Re-present a RETURNED ECHECK transaction once within 30 days of the return"
    roles: [AgencyAdmin]
    code: 200
    input: []
    output: PaymentTransaction
    side_effects: ["funds_status -> RE_PRESENTED; representment_count = 1; value_date recomputed; ERR_REPRESENTMENT_EXHAUSTED; ERR_REPRESENTMENT_WINDOW_CLOSED"]

  - method: GET
    path: "/portal/payment-transactions/{id}/refunds"
    description: "List refunds of a transaction"
    roles: [PlatformAdmin, AgencyAdmin, TreasuryOfficer, Payer]
    code: 200
    input: []
    output: "Refund[]"
    default_sort: "created_at ASC"
    side_effects: []

  - method: GET
    path: "/portal/payment-transactions/{id}/chargebacks"
    description: "List chargeback cases of a transaction"
    roles: [PlatformAdmin, AgencyAdmin, TreasuryOfficer, Payer]
    code: 200
    input: []
    output: "ChargebackCase[]"
    default_sort: "created_at ASC"
    side_effects: []

  # --- SettlementBatch ---
  - method: POST
    path: "/portal/settlement-batches"
    description: "Open a settlement batch for an agency and business date; only one OPEN batch per agency"
    roles: [PlatformAdmin, AgencyAdmin]
    code: 201
    input: [agency_id, business_date]
    output: SettlementBatch
    side_effects: ["status=OPEN; ERR_BATCH_ALREADY_OPEN"]

  - method: GET
    path: "/portal/settlement-batches/{id}"
    description: "Get a settlement batch"
    roles: [PlatformAdmin, AgencyAdmin, TreasuryOfficer]
    code: 200
    input: []
    output: SettlementBatch
    side_effects: []

  - method: GET
    path: "/portal/agencies/{id}/settlement-batches"
    description: "List an agency's settlement batches"
    roles: [PlatformAdmin, AgencyAdmin, TreasuryOfficer]
    code: 200
    input: ["status?"]
    output: "SettlementBatch[]"
    default_sort: "created_at ASC"
    side_effects: []

  - method: POST
    path: "/portal/settlement-batches/{id}/close"
    description: "Close an OPEN batch: sweeps eligible transactions (value_date <= business_date) to SETTLED and finalizes totals"
    roles: [PlatformAdmin]
    code: 200
    input: []
    output: SettlementBatch
    side_effects: ["member sweep per settlement_batch_totals; member transactions -> SETTLED"]

  - method: POST
    path: "/portal/settlement-batches/{id}/submit"
    description: "Submit a CLOSED batch to the bank; freezes the reconciliation expectation"
    roles: [PlatformAdmin]
    code: 200
    input: []
    output: SettlementBatch
    side_effects: ["status -> SUBMITTED; submitted_at set"]

  - method: POST
    path: "/portal/settlement-batches/{id}/confirm-deposit"
    description: "Treasury confirms the actual deposit received for a SUBMITTED batch"
    roles: [TreasuryOfficer]
    code: 200
    input: [actual_deposit_cents]
    output: SettlementBatch
    side_effects: ["status -> CONFIRMED; actual_deposit_cents and confirmed_at set"]

  - method: POST
    path: "/portal/settlement-batches/{id}/reconcile"
    description: "Match the confirmed deposit against the frozen expectation; clean -> RECONCILED, mismatch -> EXCEPTION with exception rows"
    roles: [PlatformAdmin]
    code: 200
    input: []
    output: SettlementBatch
    side_effects: ["per reconciliation_match; may create ReconciliationException rows"]

  - method: GET
    path: "/portal/settlement-batches/{id}/exceptions"
    description: "List reconciliation exceptions of a batch"
    roles: [PlatformAdmin, AgencyAdmin, TreasuryOfficer]
    code: 200
    input: []
    output: "ReconciliationException[]"
    default_sort: "created_at ASC, then exception_type ASC (deterministic even when one reconcile creates several rows under a frozen clock)"
    side_effects: []

  - method: POST
    path: "/portal/reconciliation-exceptions/{id}/resolve"
    description: "Resolve an OPEN exception; resolving the last OPEN exception bubbles the batch to RECONCILED"
    roles: [PlatformAdmin]
    code: 200
    input: [resolution_note]
    output: ReconciliationException
    side_effects: ["status -> RESOLVED; batch EXCEPTION -> RECONCILED when open_exception_count reaches 0"]

  # --- Refund ---
  - method: POST
    path: "/portal/refunds"
    description: "Initiate a principal-only refund against a transaction the agency controls"
    roles: [AgencyAdmin]
    code: 201
    input: [transaction_id, amount_cents, reason]
    output: Refund
    side_effects: ["status=REQUESTED; initiated_by_user_id = X-User-ID; transaction must be CAPTURED, SETTLED or RE_PRESENTED; amount <= remaining_refundable_cents"]

  - method: POST
    path: "/portal/refunds/{id}/decide"
    description: "Approve or deny a REQUESTED refund; decider must differ from initiator; approval debits the agency's OPEN batch"
    roles: [AgencyAdmin]
    code: 200
    input: [decision]
    output: Refund
    side_effects: ["APPROVE: txn refunded_cents += amount, OPEN-batch refund debit; DENY: no financial movement; ERR_SEGREGATION_OF_DUTIES; ERR_NO_OPEN_BATCH"]

  # --- ChargebackCase ---
  - method: POST
    path: "/portal/chargebacks"
    description: "Ingest a card-network chargeback against a CARD transaction (ops-side webhook intake)"
    roles: [PlatformAdmin]
    code: 201
    input: [transaction_id, reason_code]
    output: ChargebackCase
    side_effects: ["status=OPENED; opened_at = clock; evidence_due_at = opened_at + 10 days; ERR_CHARGEBACK_NOT_PERMITTED for non-CARD or non-fundable states; ERR_CHARGEBACK_ALREADY_OPEN"]

  - method: POST
    path: "/portal/chargebacks/{id}/contest"
    description: "Agency contests with evidence before the deadline"
    roles: [AgencyAdmin]
    code: 200
    input: [evidence_note]
    output: ChargebackCase
    side_effects: ["status -> CONTESTED; evidence_note set; ERR_EVIDENCE_DEADLINE_PASSED"]

  - method: POST
    path: "/portal/chargebacks/{id}/accept"
    description: "Agency accepts liability for the underlying transaction"
    roles: [AgencyAdmin]
    code: 200
    input: []
    output: ChargebackCase
    side_effects: ["status -> ACCEPTED; network debit = amount - refunded at this moment; txn charged_back_cents set; OPEN-batch debit (auto-create if none)"]

  - method: POST
    path: "/portal/chargebacks/{id}/record-outcome"
    description: "Record the network outcome of a CONTESTED case; an OPENED case past its evidence deadline is force-decided LOST"
    roles: [PlatformAdmin]
    code: 200
    input: [outcome]
    output: ChargebackCase
    side_effects: ["CONTESTED -> WON (no financial movement) or LOST (same effects as accept); OPENED + past deadline -> LOST"]

  # --- SelfFundingLedger ---
  - method: POST
    path: "/portal/self-funding/close-period"
    description: "Close a YYYY-MM period: tiered absorbed billing, fee-pool waterfall, dual (ACCRUAL/CASH) portal-cost recognition, surplus remittance; one entry per period"
    roles: [TreasuryOfficer]
    code: 201
    input: [period]
    output: SelfFundingLedgerEntry
    side_effects: ["per portal_pool_sweep + portal_cost_recognition + agency_absorbed_monthly_invoice; ERR_PERIOD_ALREADY_CLOSED; ERR_TIER_COVERAGE_GAP"]

  - method: GET
    path: "/portal/self-funding-ledger"
    description: "List self-funding ledger entries"
    roles: [PlatformAdmin, TreasuryOfficer, ComplianceAuditor]
    code: 200
    input: ["period?"]
    output: "SelfFundingLedgerEntry[]"
    default_sort: "created_at ASC"
    side_effects: []

# =============================================================================
# §1.6: Error Code Catalog
# =============================================================================
errors:
  - { id: ERR_MISSING_OR_INVALID_USER_CONTEXT, http: 400, condition: "X-User-ID or X-User-Role header missing or not a declared role" }
  - { id: ERR_FORBIDDEN_FOR_ROLE, http: 403, condition: "Authenticated role is not in the endpoint's roles list" }
  - { id: ERR_AGENCY_NOT_FOUND, http: 404, condition: "Agency id does not exist" }
  - { id: ERR_SERVICE_NOT_FOUND, http: 404, condition: "Service id does not exist" }
  - { id: ERR_PAYER_NOT_FOUND, http: 404, condition: "Payer id does not exist (including unknown payer X-User-ID on payer-scoped writes)" }
  - { id: ERR_INSTRUMENT_NOT_FOUND, http: 404, condition: "PaymentInstrument id does not exist" }
  - { id: ERR_QUOTE_NOT_FOUND, http: 404, condition: "FeeQuote id does not exist" }
  - { id: ERR_TRANSACTION_NOT_FOUND, http: 404, condition: "PaymentTransaction id does not exist" }
  - { id: ERR_BATCH_NOT_FOUND, http: 404, condition: "SettlementBatch id does not exist" }
  - { id: ERR_ACCOUNT_NOT_FOUND, http: 404, condition: "AgencySettlementAccount id does not exist" }
  - { id: ERR_AUTHORIZATION_NOT_FOUND, http: 404, condition: "StatutoryAuthorization id does not exist" }
  - { id: ERR_REFUND_NOT_FOUND, http: 404, condition: "Refund id does not exist" }
  - { id: ERR_CHARGEBACK_NOT_FOUND, http: 404, condition: "ChargebackCase id does not exist" }
  - { id: ERR_EXCEPTION_NOT_FOUND, http: 404, condition: "ReconciliationException id does not exist" }
  - { id: ERR_INVALID_REQUEST, http: 400, condition: "Missing required field, malformed value, out-of-enum value, non-positive amount, card fields on a non-CARD instrument (or missing on CARD), or a supersede whose effective_from does not advance the old window" }
  - { id: ERR_INVALID_STATE, http: 409, condition: "Target resource's state does not permit the operation (e.g. capture a VOIDED transaction, decide a DENIED refund, outcome an OPENED chargeback before its deadline)" }
  - { id: ERR_AGENCY_NOT_ACTIVE, http: 409, condition: "Operation requires the agency in ACTIVE status (service activate, quote create, authorize)" }
  - { id: ERR_NO_VERIFIED_ACCOUNT, http: 409, condition: "Agency activation without any VERIFIED settlement account" }
  - { id: ERR_COMPLIANCE_LAPSED, http: 409, condition: "Agency lacks a CURRENT PCI_DSS_AOC attestation at the logical clock" }
  - { id: ERR_NO_STATUTORY_COVERAGE, http: 422, condition: "CONVENIENCE_FEE operation has no in-effect APPROVED StatutoryAuthorization covering the logical clock" }
  - { id: ERR_SEGREGATION_OF_DUTIES, http: 403, condition: "Refund decider X-User-ID equals the refund's initiated_by_user_id" }
  - { id: ERR_ACCOUNT_WINDOW_OVERLAP, http: 409, condition: "New settlement account's half-open window overlaps a live (non-RETIRED) account of the same agency and no valid supersedes_account_id was given" }
  - { id: ERR_TIER_BAND_OVERLAP, http: 409, condition: "Pricing band's closed [min, max] interval intersects another band of the same agency and effective_month; equal boundary cents count as overlap" }
  - { id: ERR_AUTHORIZATION_WINDOW_OVERLAP, http: 409, condition: "Approved authorization's closed [effective_from, effective_to] intersects another APPROVED authorization of the same service; effective_from == other.effective_to is an overlap" }
  - { id: ERR_DUPLICATE_SERVICE_CODE, http: 409, condition: "service_code already used by a non-DEACTIVATED service of the same agency" }
  - { id: ERR_DUPLICATE_PAYER_EMAIL, http: 409, condition: "email already registered to another payer" }
  - { id: ERR_BATCH_ALREADY_OPEN, http: 409, condition: "The agency already has an OPEN settlement batch" }
  - { id: ERR_CHARGEBACK_ALREADY_OPEN, http: 409, condition: "The transaction already has a chargeback case in OPENED or CONTESTED" }
  - { id: ERR_QUOTE_EXPIRED, http: 409, condition: "Authorize attempted at logical clock >= quote.expires_at" }
  - { id: ERR_EVIDENCE_DEADLINE_PASSED, http: 409, condition: "Contest attempted at logical clock > chargeback.evidence_due_at" }
  - { id: ERR_REPRESENTMENT_WINDOW_CLOSED, http: 409, condition: "Re-present attempted more than 30 days after returned_at" }
  - { id: ERR_NOT_RESOURCE_OWNER, http: 403, condition: "Payer role touches a payer-scoped resource whose payer_id != X-User-ID" }
  - { id: ERR_INSTRUMENT_NOT_USABLE, http: 409, condition: "Instrument is PENDING_VERIFICATION or DEACTIVATED at authorize time" }
  - { id: ERR_METHOD_NOT_ALLOWED, http: 409, condition: "Quote method not in the service's allowed_methods, or instrument method differs from quote method" }
  - { id: ERR_STALE_SERVICE_VERSION, http: 409, condition: "Service version at authorize differs from the quote's service_version_pinned" }
  - { id: ERR_NO_OPEN_BATCH, http: 409, condition: "Refund approval requires an existing OPEN settlement batch for the agency" }
  - { id: ERR_AMOUNT_OUT_OF_RANGE, http: 422, condition: "amount_cents outside the service's inclusive [min_amount_cents, max_amount_cents]" }
  - { id: ERR_FEE_EXCEEDS_STATUTORY_CAP, http: 422, condition: "Computed convenience fee (after the MIN_FEE floor) exceeds the covering authorization's fee_cap_cents" }
  - { id: ERR_REFUND_EXCEEDS_REMAINING, http: 422, condition: "Refund amount_cents > transaction.remaining_refundable_cents" }
  - { id: ERR_REPRESENTMENT_EXHAUSTED, http: 409, condition: "Re-present attempted with representment_count already 1" }
  - { id: ERR_RETURN_NOT_PERMITTED, http: 409, condition: "ach-return on a transaction whose method is not ECHECK" }
  - { id: ERR_CHARGEBACK_NOT_PERMITTED, http: 409, condition: "Chargeback on a transaction whose method is not CARD, or whose funds_status is not CAPTURED/SETTLED/RE_PRESENTED" }
  - { id: ERR_OFFBOARD_BLOCKED, http: 409, condition: "Offboard with transactions in AUTHORIZED/CAPTURED/RE_PRESENTED or batches in OPEN/CLOSED/SUBMITTED/CONFIRMED/EXCEPTION" }
  - { id: ERR_TIER_COVERAGE_GAP, http: 409, condition: "Period close: an agency's absorbed volume reaches beyond its pricing bands for that month" }
  - { id: ERR_PERIOD_ALREADY_CLOSED, http: 409, condition: "A SelfFundingLedgerEntry already exists for the period" }
  - { id: ERR_STALE_VERSION, http: 412, condition: "expected_*_version does not match the parent entity's current version (OCC)" }

# =============================================================================
# §1.7: RBAC Matrix
# =============================================================================
roles:
  - name: PlatformAdmin
    description: "Portal operator (NIC) staff: onboards and suspends agencies, manages settlement accounts and pricing tiers, approves statutory authorizations, activates services, runs settlement batches and reconciliation, ingests chargebacks, records outcomes"
    identity: opaque
    exclusive_operations:
      - "POST /portal/agencies, /portal/agencies/{id}/activate|suspend|offboard"
      - "POST /portal/settlement-accounts, POST /portal/pricing-tiers"
      - "POST /portal/statutory-authorizations/{id}/approve"
      - "POST /portal/services/{id}/activate|deactivate"
      - "POST /portal/settlement-batches/{id}/close|submit|reconcile"
      - "POST /portal/reconciliation-exceptions/{id}/resolve"
      - "POST /portal/chargebacks, /portal/chargebacks/{id}/record-outcome"
      - "POST /portal/payment-transactions/{id}/ach-return"
      - "POST /_clock/set_current_utc"
    shared_operations:
      - "POST /portal/payers; POST /portal/payers/{id}/instruments; POST /portal/instruments/{id}/verify-ach (bypasses payer ownership)"
      - "POST /portal/payment-transactions/{id}/capture|void"
      - "POST /portal/settlement-batches"
      - "All GET endpoints except payer-scoped restrictions"

  - name: AgencyAdmin
    description: "Agency staff user. Controls the agency's catalog drafts, statutory filings, captures/voids, refunds and chargeback responses. X-User-ID is an opaque staff id recorded on refunds for segregation of duties."
    identity: opaque
    exclusive_operations:
      - "POST /portal/services; PUT /portal/services/{id}"
      - "POST /portal/statutory-authorizations"
      - "POST /portal/refunds; POST /portal/refunds/{id}/decide (decider must differ from initiator)"
      - "POST /portal/chargebacks/{id}/contest|accept"
      - "POST /portal/payment-transactions/{id}/re-present"
    shared_operations:
      - "POST /portal/payment-transactions/{id}/capture|void"
      - "POST /portal/settlement-batches"
      - "Agency-scoped GET endpoints"

  - name: TreasuryOfficer
    description: "State treasury officer: verifies settlement accounts, confirms deposits, runs the self-funding period close. Disjoint from PlatformAdmin on the settlement pipeline (submit vs confirm)."
    identity: opaque
    exclusive_operations:
      - "POST /portal/settlement-accounts/{id}/verify"
      - "POST /portal/settlement-batches/{id}/confirm-deposit"
      - "POST /portal/self-funding/close-period"
    shared_operations:
      - "Settlement and agency GET endpoints; GET /portal/self-funding-ledger"

  - name: ComplianceAuditor
    description: "Files compliance attestations; otherwise read-only across agency, service, authorization and ledger surfaces"
    identity: opaque
    exclusive_operations:
      - "POST /portal/attestations"
    shared_operations:
      - "GET endpoints for agencies, services, authorizations, attestations, self-funding ledger"

  - name: Payer
    description: "A registered payer. X-User-ID equals the Payer.id; may only touch quotes, instruments and transactions whose payer_id equals X-User-ID."
    identity: "entity_backed:Payer"
    exclusive_operations:
      - "POST /portal/fee-quotes"
      - "POST /portal/payment-transactions"
    shared_operations:
      - "POST /portal/payers/{id}/instruments; POST /portal/instruments/{id}/verify-ach (own instruments only)"
      - "GET /portal/payers/{id}, /portal/payers/{id}/instruments, /portal/fee-quotes*, /portal/payment-transactions* (own records only); GET /portal/services*, /portal/agencies/{id}/services"

  - name: Anonymous
    description: "Unauthenticated registration caller; X-User-ID is ignored"
    identity: opaque
    exclusive_operations: []
    shared_operations:
      - "POST /portal/payers"
