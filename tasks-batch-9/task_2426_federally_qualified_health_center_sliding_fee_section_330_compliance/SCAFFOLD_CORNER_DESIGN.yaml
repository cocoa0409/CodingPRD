          - calculations.fpg_percent
        distinguishing_aspect: >-
          The ADOPTED schedule spans [2026-01-01, 2028-01-01) with fpg_year 2026, so it covers an
          effective_date of 2027-02-01 and priority 36 stays silent; the INTAKE_YEAR variant still
          needs the 2027 guideline, which is unpublished, so verification fails with
          ERR_POVERTY_GUIDELINE_MISSING / 422 and the row stays SUBMITTED.
        test_recipe:
          setup:
            - "Only the 2026 guideline is published; 2027 is missing"
            - "A two-year ADOPTED FeeSchedule (fpg_year 2026, [2026-01-01, 2028-01-01), nominal 2500) carries the standard two-band ladder"
            - "Patient 'Val Osei' submits a verification with effective_date 2027-02-01"
          setup_api_calls:
            - *c_pg26
            - *c_hc
            - *c_site
            - *c_svc
            - *c_chair
            - call: "POST /health-centers/${chc_id}/fee-schedules"
              payload: { fpg_year: 2026, effective_start: "2026-01-01T00:00:00Z", effective_end: "2028-01-01T00:00:00Z", nominal_fee_cents: 2500 }
              as: ComplianceOfficer
              as_user_id: "co-1"
              captures: { cfs_id: $.data.id }
            - *c_t1
            - *c_t2
            - *c_hcv
            - *c_adopt
            - *c_p
            - call: "POST /patients/${cp_id}/income-verifications"
              payload: { declared_annual_income_cents: 1000000, household_size: 1, documentation_type: "TAX_RETURN", effective_date: "2027-02-01T00:00:00Z", expected_patient_version: "${cp_v}" }
              as: PatientServicesRep
              as_user_id: "psr-1"
              captures: { civ27_id: $.data.id }
          trigger:
            - call: "POST /income-verifications/${civ27_id}/verify"
              payload: { decision: "VERIFY" }
              as: EligibilityVerifier
              as_user_id: "ev-1"
              captures: { e_nopg: $.data.error_id }
          assert:
            - "HTTP 422 and data.error_id == \"ERR_POVERTY_GUIDELINE_MISSING\""
            - "IncomeVerification.${civ27_id}.status == \"SUBMITTED\""
            - "IncomeVerification.${civ27_id}.fpg_percent == null and uds_fpg_percent == null"
            - "IncomeVerification.${civ27_id}.assigned_discount_tier_id == null"

      - name: baseline_scope_addition_after_lock_rejected
