          Error-category pair business_safety (priority 100) versus business_constraint
          (priority 120) on POST /comp/ballots/{id}/cast: a committee member casting their
          own ballot with points_proposed 2000.00 violates both, and ERR_SELF_VOTE_FORBIDDEN
          (403) is returned; the same 2000.00 on a ballot whose subject is somebody else
