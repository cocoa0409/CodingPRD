scenario: |
  Generate task harder than expert level!

  2537. Bridge Inspection & Load Rating Program (state transportation bridge unit): inventory with
  inspection frequency by condition, type and special features including underwater and
  fracture-critical elements, inspection team qualification and quality assurance review of reports,
  element-level condition rating with defect quantification and photographic documentation, load
  rating calculation and posting decisions with permit vehicle analysis, critical finding
  identification with immediate closure or restriction authority and notification chains, scour
  evaluation, plan of action for scour-critical structures, programming of repair, rehabilitation and
  replacement projects from condition data, federal reporting submissions and compliance reviews

domain_name: bridge-inspection-load-rating-program

# All business collections are top-level peers (graph topology: PermitApplication and Bridge are
# joined many-to-many through PermitBridgeAnalysis, and Inspection / LoadRating / ScourEvaluation
# fan out from Bridge as sibling aggregates). There is therefore no single owning resource path;
# every endpoint below is rooted directly under "/".
api_prefix: "/"

complexity_profile:
  primary_archetype: compliance_audit
  secondary_archetype: quota_allocation
  complexity_layers:
    - optimistic_concurrency
    - cascading_side_effects
    - dual_variant_calculation
    - derived_field_reconciliation

  entity_topology: graph
  state_machine_shape: cyclic
  relationship_patterns:
    - one_to_many
    - many_to_many
    - cross_aggregate
  role_model: segregation_of_duties
  consistency_model: immediate

  difficulty_level: expert_plus
  notes: |
    Density sources: (1) inspection frequency is a nested min/max policy over condition, structure
    features, scour status and service posture, so a single accepted report can shorten the cycle;
    (2) load rating is one formula evaluated under two load-factor sets (operating vs inventory)
    whose divergence decides posting and the posted limit; (3) the element-level condition-state
    quantities are the single source for the health index, the NBI component ratings, the repair cost
    estimate and the priority score, so one quantity edit ripples into programming; (4) critical
    findings carry two independent status dimensions (finding lifecycle and notification chain) and
    hold immediate restriction/closure authority whose cascade revokes already-approved permits;
    (5) programming is a rank-gated waterfall against a reserved budget with an exact
    forward/compensating money identity.

response_envelope:
  success: |
    { "meta": { "api_request_id": "req_xxx", "api_request_timestamp": "ISO8601" },
      "response_type": "object" | "array", "data": {} }
  error: |
    { "meta": { ... }, "response_type": "error",
      "data": { "error_id": "ERR_XXX", "message": "..." } }
  pagination_fields: ["limit", "offset", "total_count", "has_more"]
  pagination_defaults: { limit: 10, min: 1, max: 100, offset: 0 }

# =============================================================================
# §1.1 Entity-Relationship Table
# =============================================================================
entities:
  - name: Bridge
    parent: null
    common_fields: true
    fields:
      - name: nbi_structure_number
        type: string
        source: input
        description: National Bridge Inventory structure number; unique across the inventory
        constraints: "unique; 1..15 characters"
      - name: name
        type: string
        source: input
        description: Facility carried / feature crossed label
      - name: owner_agency
        type: string
        source: input
        description: Owning agency label (state DOT district, county, city)
      - name: structure_type
        type: enum
        source: input
        description: Primary structural system
        constraints: "GIRDER | TRUSS | ARCH | SUSPENSION | CULVERT"
      - name: deck_area_sqm
        type: number
        source: input
        description: Deck area used for reporting and cost scaling
        constraints: "> 0"
      - name: year_built
        type: integer
        source: input
        description: Year of original construction
        constraints: "1850..2026"
      - name: adt
        type: integer
        source: input
        description: Average daily traffic; drives extended-interval eligibility and risk exposure
        constraints: ">= 0"
      - name: detour_length_km
        type: number
        source: input
        description: Detour length if the structure is closed; risk exposure input
        constraints: ">= 0"
      - name: spans_water
        type: boolean
        source: input
        description: True when the structure crosses a waterway
        default: false
      - name: underwater_elements
        type: boolean
        source: input
        description: True when submerged elements require diver inspection
        default: false
      - name: fracture_critical
        type: boolean
        source: input
        description: True when the structure has fracture-critical members
        default: false
      - name: deck_rating
        type: integer
        source: computed
        description: >-
          NBI deck condition rating 0..9. Seeded from initial_deck_rating at creation (default 7),
          thereafter overwritten by calculations.nbi_component_rating on Inspection ACCEPTED
        constraints: "0..9"
      - name: superstructure_rating
        type: integer
        source: computed
        description: >-
          NBI superstructure condition rating 0..9. Seeded from initial_superstructure_rating at
          creation (default 7), thereafter from calculations.nbi_component_rating
        constraints: "0..9"
      - name: substructure_rating
        type: integer
        source: computed
        description: >-
          NBI substructure condition rating 0..9. Seeded from initial_substructure_rating at
          creation (default 7), thereafter from calculations.nbi_component_rating
        constraints: "0..9"
      - name: min_nbi_rating
        type: integer
        source: computed
        description: min(deck_rating, superstructure_rating, substructure_rating)
        constraints: "0..9"
      - name: bridge_health_index
        type: number
        source: computed
        description: >-
          Element-weighted health index from the latest ACCEPTED Inspection
          (calculations.bridge_health_index); null until the first acceptance
        constraints: "0.00..100.00, 2 decimals"
      - name: inventoried_quantity_total
        type: number
        source: computed
        description: Sum of ElementCondition.total_quantity on the latest ACCEPTED Inspection
        default: 0
      - name: deficiency_pct
        type: number
        source: computed
        description: >-
          100 * sum(cs3_qty + cs4_qty) / sum(total_quantity) over the latest ACCEPTED Inspection,
          2 decimals; 0.00 before the first acceptance
        default: 0
      - name: service_posture
        type: enum
        source: computed
        description: >-
          Derived gate over child operations, recomputed by calculations.service_posture on
          CriticalFinding restriction/resolution and LoadRating approval
        default: OPEN
        constraints: "OPEN | POSTED | RESTRICTED | CLOSED"
      - name: scour_status
        type: enum
        source: computed
        description: Derived from the latest FINAL ScourEvaluation.scour_code
        default: NOT_EVALUATED
        constraints: "NOT_EVALUATED | LOW_RISK | SCOUR_CRITICAL | STABILIZED"
      - name: poa_compliant
        type: boolean
        source: computed
        description: >-
          False when scour_status == SCOUR_CRITICAL and no PlanOfAction for this bridge is APPROVED;
          true otherwise
        default: true
      - name: inspection_interval_months
        type: integer
        source: computed
        description: Routine inspection cycle from calculations.inspection_interval_months
        default: 24
      - name: underwater_interval_months
        type: integer
        source: computed
        description: >-
          Underwater inspection cycle from calculations.inspection_interval_months; null when
          underwater_elements is false
      - name: last_routine_inspection_date
        type: datetime
        source: computed
        description: inspection_date of the latest ACCEPTED Inspection with inspection_type ROUTINE
      - name: next_inspection_due_date
        type: datetime
        source: computed
        description: >-
          last_routine_inspection_date plus inspection_interval_months (calendar month addition with
          end-of-month clamping); null until the first ROUTINE acceptance
      - name: last_underwater_inspection_date
        type: datetime
        source: computed
        description: inspection_date of the latest ACCEPTED Inspection with inspection_type UNDERWATER
      - name: next_underwater_due_date
        type: datetime
        source: computed
        description: last_underwater_inspection_date plus underwater_interval_months
      - name: posting_required
        type: boolean
        source: computed
        description: posting_required of the governing LoadRating; false when there is none
        default: false
      - name: posted_limit_tons
        type: number
        source: computed
        description: posted_limit_tons of the governing LoadRating; null when posting is not required
      - name: operating_rating_tons
        type: number
        source: computed
        description: operating_rating_tons of the governing LoadRating
      - name: inventory_rating_tons
        type: number
        source: computed
        description: inventory_rating_tons of the governing LoadRating
      - name: governing_load_rating_id
        type: string
        source: computed
        description: >-
          FK -> LoadRating.id; output of calculations.governing_load_rating_selector (latest
          APPROVED rating for this bridge); null when no rating is APPROVED
      - name: open_critical_finding_count
        type: integer
        source: computed
        description: Count of CriticalFinding for this bridge with finding_status IN {OPEN, MITIGATED}
        default: 0
      - name: initial_deck_rating
        type: integer
        source: input
        description: Creation-only seed for deck_rating
        default: 7
        constraints: "0..9"
      - name: initial_superstructure_rating
        type: integer
        source: input
        description: Creation-only seed for superstructure_rating
        default: 7
        constraints: "0..9"
      - name: initial_substructure_rating
        type: integer
        source: input
        description: Creation-only seed for substructure_rating
        default: 7
        constraints: "0..9"

  - name: Personnel
    parent: null
    common_fields: true
    fields:
      - name: full_name
        type: string
        source: input
        description: Staff member name
      - name: agency
        type: string
        source: input
        description: Employing organisation label
      - name: nbis_refresher_expiry_date
        type: datetime
        source: input
        description: Expiry instant of the NBIS refresher training certificate
      - name: team_leader_certified
        type: boolean
        source: input
        description: Qualified to act as inspection team leader
        default: false
      - name: underwater_diver_certified
        type: boolean
        source: input
        description: Qualified to lead UNDERWATER inspections
        default: false
      - name: fracture_critical_certified
        type: boolean
        source: input
        description: Qualified to lead FRACTURE_CRITICAL inspections
        default: false
      - name: load_rating_engineer_licensed
        type: boolean
        source: input
        description: Licensed professional engineer permitted to seal load ratings
        default: false
      - name: pe_license_number
        type: string
        source: input
        description: Professional engineer licence number; null when not licensed
      - name: qualification_status
        type: enum
        source: computed
        description: >-
          EXPIRED when the logical clock instant is strictly after nbis_refresher_expiry_date,
          CURRENT otherwise
        constraints: "CURRENT | EXPIRED"

  - name: Inspection
    parent: Bridge
    common_fields: true
    fields:
      - name: bridge_id
        type: string
        source: system
        description: FK -> Bridge.id; taken from the creation path
      - name: inspection_type
        type: enum
        source: input
        description: Inspection kind; drives required certifications and element-group coverage
        constraints: "ROUTINE | UNDERWATER | FRACTURE_CRITICAL | SPECIAL | DAMAGE"
      - name: team_leader_id
        type: string
        source: input
        description: FK -> Personnel.id; the certified team leader who owns the report
      - name: qa_reviewer_id
        type: string
        source: system
        description: >-
          FK -> Personnel.id; set to the acting reviewer's X-User-ID on qa-claim, null before that
      - name: status
        type: enum
        source: system
        description: Report lifecycle state
        default: DRAFT
        constraints: "DRAFT | SUBMITTED | IN_QA | ACCEPTED | VOIDED"
      - name: field_window_start
        type: datetime
        source: input
        description: Start of the reserved field-work window (half-open interval start)
      - name: field_window_end
        type: datetime
        source: input
        description: End of the reserved field-work window (half-open interval end, exclusive)
        constraints: "> field_window_start"
      - name: inspection_date
        type: datetime
        source: input
        description: Instant the condition data was observed; must fall inside the field window
      - name: submitted_at
        type: datetime
        source: system
        description: Logical-clock instant of the most recent submit
      - name: qa_claimed_at
        type: datetime
        source: system
        description: Logical-clock instant of the most recent qa-claim
      - name: accepted_at
        type: datetime
        source: system
        description: Logical-clock instant of acceptance
      - name: returned_count
        type: integer
        source: system
        description: Number of times QA has returned this report to DRAFT
        default: 0
      - name: qa_escalation_required
        type: boolean
        source: computed
        description: True when returned_count >= 2; acceptance then requires DistrictEngineer
        default: false
      - name: element_count
        type: integer
        source: computed
        description: Count of ElementCondition rows on this inspection
        default: 0
      - name: reported_quantity_total
        type: number
        source: computed
        description: Sum of ElementCondition.total_quantity over this inspection
        default: 0
      - name: deficient_quantity_total
        type: number
        source: computed
        description: Sum of (cs3_qty + cs4_qty) over this inspection's ElementCondition rows
        default: 0
      - name: photo_count_total
        type: integer
        source: computed
        description: Sum of ElementCondition.photo_count over this inspection
        default: 0
      - name: quantity_balanced
        type: boolean
        source: computed
        description: >-
          True when every ElementCondition on this inspection satisfies
          cs1_qty + cs2_qty + cs3_qty + cs4_qty == total_quantity
        default: true
      - name: deck_group_ehi
        type: number
        source: computed
        description: Weighted group index for DECK_GROUP elements; null when the group has no rows
      - name: superstructure_group_ehi
        type: number
        source: computed
        description: Weighted group index for SUPERSTRUCTURE elements; null when the group has no rows
      - name: substructure_group_ehi
        type: number
        source: computed
        description: Weighted group index for SUBSTRUCTURE elements; null when the group has no rows
      - name: computed_deck_rating
        type: integer
        source: computed
        description: NBI 0..9 rating mapped from deck_group_ehi; null when the group has no rows
      - name: computed_superstructure_rating
        type: integer
        source: computed
        description: NBI 0..9 rating mapped from superstructure_group_ehi
      - name: computed_substructure_rating
        type: integer
        source: computed
        description: NBI 0..9 rating mapped from substructure_group_ehi
      - name: bridge_health_index
        type: number
        source: computed
        description: Health index over all elements of this inspection, 2 decimals
      - name: notes
        type: string
        source: input
        description: Free-text field notes

  - name: ElementCondition
    parent: Inspection
    common_fields: true
    fields:
      - name: inspection_id
        type: string
        source: system
        description: FK -> Inspection.id; taken from the creation path
      - name: element_key
        type: enum
        source: input
        description: National bridge element; unique per inspection
        constraints: "DECK | JOINT | RAILING | GIRDER | BEARING | PIER_CAP | COLUMN | ABUTMENT"
      - name: element_group
        type: enum
        source: computed
        description: >-
          DECK_GROUP for {DECK, JOINT, RAILING}; SUPERSTRUCTURE for {GIRDER, BEARING};
          SUBSTRUCTURE for {PIER_CAP, COLUMN, ABUTMENT}
        constraints: "DECK_GROUP | SUPERSTRUCTURE | SUBSTRUCTURE"
      - name: unit
        type: enum
        source: input
        description: Quantity unit of measure
        constraints: "SQM | M | EA"
      - name: total_quantity
        type: number
        source: input
        description: Total inventoried element quantity
        constraints: "> 0"
      - name: cs1_qty
        type: number
        source: input
        description: Quantity in condition state 1 (good)
        default: 0
        constraints: ">= 0 and <= total_quantity"
      - name: cs2_qty
        type: number
        source: input
        description: Quantity in condition state 2 (fair)
        default: 0
        constraints: ">= 0 and <= total_quantity"
      - name: cs3_qty
        type: number
        source: input
        description: Quantity in condition state 3 (poor)
        default: 0
        constraints: ">= 0 and <= total_quantity"
      - name: cs4_qty
        type: number
        source: input
        description: Quantity in condition state 4 (severe)
        default: 0
        constraints: ">= 0 and <= total_quantity"
      - name: reported_sum
        type: number
        source: computed
        description: cs1_qty + cs2_qty + cs3_qty + cs4_qty
        default: 0
      - name: balanced
        type: boolean
        source: computed
        description: True when reported_sum == total_quantity
        default: false
      - name: deficient_quantity
        type: number
        source: computed
        description: cs3_qty + cs4_qty
        default: 0
      - name: element_health_index
        type: number
        source: computed
        description: Per-element index from calculations.element_health_index, 2 decimals
      - name: photo_count
        type: integer
        source: input
        description: Number of attached defect photographs
        default: 0
        constraints: ">= 0"
      - name: defect_notes
        type: string
        source: input
        description: Defect narrative for quantified condition states

  - name: CriticalFinding
    parent: Bridge
    common_fields: true
    fields:
      - name: bridge_id
        type: string
        source: system
        description: FK -> Bridge.id; copied from the source inspection's bridge_id
      - name: source_inspection_id
        type: string
        source: input
        description: FK -> Inspection.id; the report that surfaced the deficiency
      - name: element_condition_id
        type: string
        source: input
        description: >-
          FK -> ElementCondition.id; the quantified severe defect; must belong to
          source_inspection_id and carry cs4_qty > 0
      - name: severity
        type: enum
        source: input
        description: Finding severity; only IMMEDIATE authorises full closure
        constraints: "URGENT | IMMEDIATE"
      - name: finding_status
        type: enum
        source: system
        description: First independent status dimension - remediation lifecycle
        default: OPEN
        constraints: "OPEN | MITIGATED | RESOLVED"
      - name: notification_status
        type: enum
        source: system
        description: Second independent status dimension - notification chain progress
        default: PENDING
        constraints: "PENDING | OWNER_NOTIFIED | FHWA_REPORTED"
      - name: restriction_action
        type: enum
        source: system
        description: Restriction authority exercised on this finding
        default: NONE
        constraints: "NONE | RESTRICT | CLOSE"
      - name: restriction_authorized_by_id
        type: string
        source: input
        description: FK -> Personnel.id; the district engineer who signed the restriction; null until imposed
      - name: restriction_imposed_at
        type: datetime
        source: system
        description: Logical-clock instant the restriction was imposed
      - name: notification_due_at
        type: datetime
        source: computed
        description: created_at plus 24 hours - deadline for reaching OWNER_NOTIFIED
      - name: notification_late
        type: boolean
        source: computed
        description: >-
          True when the logical clock is strictly after notification_due_at and notification_status
          is still PENDING, or when the OWNER_NOTIFIED NotificationLog.sent_at was after the deadline
        default: false
      - name: description
        type: string
        source: input
        description: Narrative of the critical finding
      - name: mitigation_note
        type: string
        source: input
        description: Interim mitigation narrative; null until mitigated
      - name: resolution_note
        type: string
        source: input
        description: Permanent resolution narrative; null until resolved

  - name: NotificationLog
    parent: CriticalFinding
    common_fields: false
    fields:
      - name: critical_finding_id
        type: string
        source: system
        description: FK -> CriticalFinding.id; taken from the notify path
      - name: tier
        type: enum
        source: input
        description: Notification chain tier
        constraints: "BRIDGE_OWNER | FHWA"
      - name: channel
        type: enum
        source: input
        description: Delivery channel actually used
        constraints: "EMAIL | PHONE | PORTAL"
      - name: recipient_label
        type: string
        source: input
        description: Recipient organisation or person label
      - name: sent_at
        type: datetime
        source: system
        description: Logical-clock instant of dispatch
      - name: late
        type: boolean
        source: computed
        description: True when tier == BRIDGE_OWNER and sent_at is after the finding's notification_due_at
        default: false

  - name: LoadRating
    parent: Bridge
    common_fields: true
    fields:
      - name: bridge_id
        type: string
        source: system
        description: FK -> Bridge.id; taken from the creation path
      - name: source_inspection_id
        type: string
        source: input
        description: >-
          FK -> Inspection.id; the report whose element condition states set condition_factor_phi_c;
          must belong to the same bridge
      - name: method
        type: enum
        source: input
        description: Rating methodology
        constraints: "LRFR | LFR | ASD"
      - name: rating_vehicle
        type: enum
        source: input
        description: Rating vehicle whose gross weight scales the rating factor into tons
        constraints: "HL93 | HS20"
      - name: capacity_c_kn_m
        type: number
        source: input
        description: Nominal member moment capacity C in kN-m
        constraints: "> 0"
      - name: dead_load_dc_kn_m
        type: number
        source: input
        description: Structural dead-load moment DC in kN-m
        constraints: ">= 0"
      - name: dead_load_dw_kn_m
        type: number
        source: input
        description: Wearing-surface dead-load moment DW in kN-m
        constraints: ">= 0"
      - name: live_load_ll_kn_m
        type: number
        source: input
        description: Distributed live-load moment LL per lane in kN-m for the rating vehicle
        constraints: "> 0"
      - name: impact_im_factor
        type: number
        source: input
        description: Dynamic load allowance multiplier IM
        default: 1.33
        constraints: "1.00..1.50"
      - name: system_factor_phi_s
        type: number
        source: input
        description: System factor phi_s
        default: 1.00
        constraints: "0.85..1.00"
      - name: resistance_factor_phi
        type: number
        source: input
        description: Resistance factor phi
        default: 0.90
        constraints: "0.75..1.00"
      - name: condition_factor_phi_c
        type: number
        source: computed
        description: >-
          Condition factor from the worst reported condition state among SUPERSTRUCTURE elements of
          source_inspection_id (calculations.condition_factor_phi_c)
        constraints: "0.85 | 0.95 | 1.00"
      - name: rating_factor_operating
        type: number
        source: computed
        description: Operating-variant rating factor, 3 decimals
      - name: rating_factor_inventory
        type: number
        source: computed
        description: Inventory-variant rating factor, 3 decimals
      - name: operating_rating_tons
        type: number
        source: computed
        description: rating_factor_operating times the rating-vehicle weight, 1 decimal
      - name: inventory_rating_tons
        type: number
        source: computed
        description: rating_factor_inventory times the rating-vehicle weight, 1 decimal
      - name: posting_required
        type: boolean
        source: computed
        description: True when rating_factor_operating < 1.000
        default: false
      - name: posted_limit_tons
        type: number
        source: computed
        description: >-
          inventory_rating_tons rounded DOWN to the nearest 0.5 ton when posting_required, else null
      - name: rating_status
        type: enum
        source: system
        description: Rating lifecycle state
        default: DRAFT
        constraints: "DRAFT | SEALED | APPROVED | REJECTED | SUPERSEDED"
      - name: sealed_by_id
        type: string
        source: input
        description: FK -> Personnel.id; the licensed engineer who sealed the rating; null in DRAFT
      - name: approved_by_id
        type: string
        source: input
        description: FK -> Personnel.id; the district engineer who approved the rating; null before approval
      - name: rating_effective_date
        type: datetime
        source: system
        description: Logical-clock instant of approval; ranking key of the governing-rating selector
      - name: rejection_note
        type: string
        source: input
        description: Reviewer note recorded on rejection

  - name: PermitApplication
    parent: null
    common_fields: true
    fields:
      - name: permit_number
        type: string
        source: input
        description: Carrier-facing permit number
      - name: carrier_name
        type: string
        source: input
        description: Requesting carrier
      - name: axle_loads_tons
        type: array
        source: input
        description: Per-axle loads in tons, in axle order; at least 2 entries, each > 0
      - name: route_bridge_ids
        type: array
        source: input
        description: >-
          Ordered Bridge ids on the requested route; each element must reference an existing Bridge.
          Junction rows are materialised as PermitBridgeAnalysis (see PermitBridgeAnalysis.bridge_id)
      - name: axle_count
        type: integer
        source: computed
        description: Length of axle_loads_tons
      - name: gross_weight_tons
        type: number
        source: computed
        description: >-
          Permit gross weight from calculations.permit_gross_weight_tons (per-axle rounding then sum),
          1 decimal
      - name: speed_category
        type: enum
        source: input
        description: NORMAL applies the dynamic allowance; CRAWL removes it
        default: NORMAL
        constraints: "NORMAL | CRAWL"
      - name: status
        type: enum
        source: system
        description: Permit lifecycle state
        default: RECEIVED
        constraints: "RECEIVED | ANALYZED | APPROVED | APPROVED_WITH_CONDITIONS | DENIED | REVOKED"
      - name: recommended_decision
        type: enum
        source: computed
        description: Aggregate of this permit's PermitBridgeAnalysis results
        default: PENDING
        constraints: "PENDING | APPROVE | APPROVE_WITH_CONDITIONS | DENY"
      - name: governing_analysis_min_rf
        type: number
        source: computed
        description: Minimum rating_factor_permit across this permit's analyses; null before analysis
      - name: decided_at
        type: datetime
        source: system
        description: Logical-clock instant of the decision
      - name: revoked_at
        type: datetime
        source: system
        description: Logical-clock instant of cascade revocation
      - name: decision_note
        type: string
        source: input
        description: Permit officer note recorded with the decision

  - name: PermitBridgeAnalysis
    parent: PermitApplication
    common_fields: true
    fields:
      - name: permit_application_id
        type: string
        source: system
        description: FK -> PermitApplication.id; taken from the analyze path
      - name: bridge_id
        type: string
        source: system
        description: FK -> Bridge.id; one row per route entry
      - name: governing_load_rating_id
        type: string
        source: computed
        description: >-
          FK -> LoadRating.id; output of calculations.governing_load_rating_selector for this bridge
          at analysis time; null when the bridge has no APPROVED rating
      - name: sequence_index
        type: integer
        source: system
        description: Zero-based position of this bridge in route_bridge_ids
      - name: permit_live_load_kn_m
        type: number
        source: computed
        description: Governing rating's live_load_ll_kn_m scaled by the permit gross-weight ratio
      - name: permit_impact_factor
        type: number
        source: computed
        description: >-
          Governing rating's impact_im_factor when speed_category == NORMAL, else 1.00
      - name: rating_factor_permit
        type: number
        source: computed
        description: Permit rating factor under operating load factors, 3 decimals
      - name: analysis_result
        type: enum
        source: computed
        description: Per-bridge permit verdict
        constraints: "ALLOWED | ALLOWED_WITH_CONDITIONS | DENIED"
      - name: result_reason
        type: enum
        source: computed
        description: Reason code behind analysis_result
        constraints: "RF_ADEQUATE | RF_MARGINAL | RF_INSUFFICIENT | NO_APPROVED_RATING | BRIDGE_CLOSED"

  - name: ScourEvaluation
    parent: Bridge
    common_fields: true
    fields:
      - name: bridge_id
        type: string
        source: system
        description: FK -> Bridge.id; taken from the creation path
      - name: evaluated_by_id
        type: string
        source: input
        description: FK -> Personnel.id; engineer of record for the evaluation
      - name: evaluation_method
        type: enum
        source: input
        description: Evaluation technique
        constraints: "HEC18_SCREENING | DETAILED_HYDRAULIC | FIELD_OBSERVATION"
      - name: foundation_type
        type: enum
        source: input
        description: Foundation type assessed
        constraints: "SPREAD_FOOTING | PILE | DRILLED_SHAFT | UNKNOWN"
      - name: scour_code
        type: integer
        source: input
        description: NBI item 113 scour critical code
        constraints: "0..9"
      - name: observed_scour_depth_m
        type: number
        source: input
        description: Measured scour depth at the controlling substructure unit
        default: 0
        constraints: ">= 0"
      - name: status
        type: enum
        source: system
        description: Evaluation lifecycle state
        default: DRAFT
        constraints: "DRAFT | FINAL"
      - name: finalized_at
        type: datetime
        source: system
        description: Logical-clock instant of finalisation
      - name: derived_scour_status
        type: enum
        source: computed
        description: >-
          SCOUR_CRITICAL when scour_code <= 3, LOW_RISK when 4..6, STABILIZED when >= 7; propagated to
          Bridge.scour_status on finalisation
        constraints: "SCOUR_CRITICAL | LOW_RISK | STABILIZED"

  - name: PlanOfAction
    parent: Bridge
    common_fields: true
    fields:
      - name: bridge_id
        type: string
        source: system
        description: FK -> Bridge.id; copied from the triggering scour evaluation
      - name: scour_evaluation_id
        type: string
        source: system
        description: FK -> ScourEvaluation.id; the FINAL evaluation that required this plan
      - name: status
        type: enum
        source: system
        description: Plan lifecycle state
        default: REQUIRED
        constraints: "REQUIRED | DRAFT | SUBMITTED | APPROVED"
      - name: monitoring_frequency_months
        type: integer
        source: input
        description: Monitoring interval committed by the plan
        constraints: "1..24"
      - name: closure_trigger_stage_m
        type: number
        source: input
        description: Flood stage at which the structure is closed under the plan
        constraints: "> 0"
      - name: countermeasure_type
        type: enum
        source: input
        description: Committed countermeasure
        default: NONE
        constraints: "NONE | RIPRAP | MONITORING_ONLY | STRUCTURAL"
      - name: approved_by_id
        type: string
        source: input
        description: FK -> Personnel.id; approving district engineer; null before approval
      - name: revision_count
        type: integer
        source: system
        description: Number of times the plan has been returned to DRAFT
        default: 0
      - name: submitted_at
        type: datetime
        source: system
        description: Logical-clock instant of the most recent submit
      - name: approved_at
        type: datetime
        source: system
        description: Logical-clock instant of approval
      - name: return_note
        type: string
        source: input
        description: Reviewer note recorded on return

  - name: ProgramCycle
    parent: null
    common_fields: true
    fields:
      - name: fiscal_year
        type: integer
        source: input
        description: Programming fiscal year
        constraints: "2020..2040"
      - name: authorized_budget_cents
        type: integer
        source: input
        description: Total authorised programme budget in cents
        constraints: "> 0"
      - name: reserve_pct
        type: number
        source: input
        description: Contingency reserve fraction of authorized_budget_cents
        default: 0.05
        constraints: "0.00..0.25"
      - name: ranking_policy
        type: enum
        source: input
        description: Which priority_score variant this cycle applies to its candidates
        default: CONDITION_BASED
        constraints: "CONDITION_BASED | RISK_BASED"
      - name: reserve_cents
        type: integer
        source: computed
        description: round_half_up(reserve_pct * authorized_budget_cents); fixed at creation
      - name: available_cents
        type: integer
        source: computed
        description: authorized_budget_cents - reserve_cents; fixed at creation
      - name: committed_cents
        type: integer
        source: computed
        description: Sum of estimated_cost_cents over this cycle's PROGRAMMED candidates
        default: 0
      - name: remaining_cents
        type: integer
        source: computed
        description: available_cents - committed_cents
      - name: status
        type: enum
        source: system
        description: Cycle lifecycle state
        default: PLANNING
        constraints: "PLANNING | LOCKED | SUBMITTED | CLOSED"
      - name: identified_count
        type: integer
        source: computed
        description: Count of this cycle's candidates with status IDENTIFIED
        default: 0
      - name: programmed_count
        type: integer
        source: computed
        description: Count of this cycle's candidates with status PROGRAMMED
        default: 0
      - name: deferred_count
        type: integer
        source: computed
        description: Count of this cycle's candidates with status DEFERRED
        default: 0
      - name: unprogrammed_cost_cents
        type: integer
        source: computed
        description: Sum of estimated_cost_cents over this cycle's IDENTIFIED candidates
        default: 0
      - name: locked_at
        type: datetime
        source: system
        description: Logical-clock instant of the most recent lock
      - name: submitted_at
        type: datetime
        source: system
        description: Logical-clock instant the cycle was released to federal submission
      - name: closed_at
        type: datetime
        source: system
        description: Logical-clock instant of closure

  - name: ProjectCandidate
    parent: Bridge
    common_fields: true
    fields:
      - name: bridge_id
        type: string
        source: input
        description: FK -> Bridge.id; the structure the work would address
      - name: program_cycle_id
        type: string
        source: system
        description: FK -> ProgramCycle.id; taken from the creation path or the auto-creation cycle
      - name: source_inspection_id
        type: string
        source: input
        description: >-
          FK -> Inspection.id; the ACCEPTED report whose condition data produced the estimate;
          defaults to the bridge's latest ACCEPTED inspection when omitted
      - name: work_type
        type: enum
        source: computed
        description: >-
          REPLACEMENT when min_nbi_rating <= 3, REHABILITATION at 4, REPAIR at 5, PRESERVATION at >= 6
        constraints: "PRESERVATION | REPAIR | REHABILITATION | REPLACEMENT"
      - name: estimated_cost_cents
        type: integer
        source: computed
        description: Output of calculations.estimated_repair_cost_cents
      - name: priority_score
        type: number
        source: computed
        description: >-
          Output of calculations.candidate_priority_score under the cycle's ranking_policy, 2 decimals
      - name: ranking_policy_applied
        type: enum
        source: computed
        description: Copy of the owning cycle's ranking_policy at score time
        constraints: "CONDITION_BASED | RISK_BASED"
      - name: status
        type: enum
        source: system
        description: Candidate lifecycle state
        default: IDENTIFIED
        constraints: "IDENTIFIED | PROGRAMMED | DEFERRED | WITHDRAWN"
      - name: origin
        type: enum
        source: system
        description: AUTO_FROM_INSPECTION when created by the acceptance cascade, MANUAL otherwise
        constraints: "AUTO_FROM_INSPECTION | MANUAL"
      - name: programmed_at
        type: datetime
        source: system
        description: Logical-clock instant of programming
      - name: withdrawn_at
        type: datetime
        source: system
        description: Logical-clock instant of withdrawal
      - name: deferred_at
        type: datetime
        source: system
        description: Logical-clock instant of deferral
      - name: justification
        type: string
        source: input
        description: Programming justification narrative

  - name: FederalSubmission
    parent: ProgramCycle
    common_fields: true
    fields:
      - name: program_cycle_id
        type: string
        source: system
        description: FK -> ProgramCycle.id; taken from the creation path
      - name: submission_type
        type: enum
        source: input
        description: Federal reporting package type
        constraints: "NBI_ANNUAL | ELEMENT_DATA | SCOUR_POA"
      - name: status
        type: enum
        source: system
        description: Submission lifecycle state
        default: BUILDING
        constraints: "BUILDING | SUBMITTED | ACCEPTED | REJECTED"
      - name: total_bridge_count
        type: integer
        source: computed
        description: Count of all Bridge rows at submit time
        default: 0
      - name: overdue_inspection_count
        type: integer
        source: computed
        description: >-
          Count of Bridge rows whose next_inspection_due_date is strictly before the logical clock at
          submit time
        default: 0
      - name: inspection_compliance_pct
        type: number
        source: computed
        description: Output of calculations.inspection_compliance_pct, 2 decimals
      - name: poa_noncompliant_count
        type: integer
        source: computed
        description: Count of Bridge rows with poa_compliant == false at submit time
        default: 0
      - name: open_immediate_finding_count
        type: integer
        source: computed
        description: >-
          Count of CriticalFinding rows with severity IMMEDIATE and finding_status IN {OPEN, MITIGATED}
        default: 0
      - name: error_count
        type: integer
        source: computed
        description: poa_noncompliant_count + open_immediate_finding_count at submit time
        default: 0
      - name: submitted_by_user_id
        type: string
        source: system
        description: Opaque X-User-ID of the ProgramAdmin who submitted; null while BUILDING
      - name: reviewer_user_id
        type: string
        source: system
        description: Opaque X-User-ID of the FhwaReviewer who reviewed; null before review
      - name: rejection_reason_code
        type: enum
        source: system
        description: Reason recorded when the reviewer rejects
        default: NONE
        constraints: "NONE | COMPLIANCE_BELOW_THRESHOLD | DATA_GAPS"
      - name: submitted_at
        type: datetime
        source: system
        description: Logical-clock instant of submission
      - name: reviewed_at
        type: datetime
        source: system
        description: Logical-clock instant of review

# =============================================================================
# §1.2 State Machine Table
# =============================================================================
state_machines:
  - entity: Inspection
    initial_state: DRAFT
    terminal_states: [ACCEPTED, VOIDED]
    shape: cyclic
    transitions:
      - from: null
        to: DRAFT
        trigger: "POST /bridges/{id}/inspections"
        actor: BridgeInspector
        preconditions:
          - "Bridge exists"
          - "Personnel(team_leader_id) exists and team_leader_id == X-User-ID"
          - "Personnel(team_leader_id).team_leader_certified == true"
          - "Personnel(team_leader_id).qualification_status == CURRENT"
          - "inspection_type == UNDERWATER requires Bridge.underwater_elements == true"
          - "inspection_type == FRACTURE_CRITICAL requires Bridge.fracture_critical == true"
          - "field_window_end > field_window_start"
          - "No Inspection on this Bridge with status IN {DRAFT, SUBMITTED, IN_QA, ACCEPTED} whose 72-hour buffer-expanded window collides (validations priority 25)"
          - "No Inspection with the same team_leader_id and status IN {DRAFT, SUBMITTED, IN_QA, ACCEPTED} whose half-open window overlaps (validations priority 26)"
        side_effects:
          - "Inspection created with status DRAFT, returned_count 0, element_count 0"
          - "bridge_id copied from the path"
      - from: DRAFT
        to: SUBMITTED
        trigger: "POST /inspections/{id}/submit"
        actor: BridgeInspector
        preconditions:
          - "X-User-ID == Inspection.team_leader_id"
          - "Personnel(team_leader_id).qualification_status == CURRENT at the current logical clock"
          - "inspection_type UNDERWATER requires Personnel(team_leader_id).underwater_diver_certified == true"
          - "inspection_type FRACTURE_CRITICAL requires Personnel(team_leader_id).fracture_critical_certified == true"
          - "element_count >= 1"
          - "inspection_type IN {ROUTINE, SPECIAL, DAMAGE, FRACTURE_CRITICAL} requires at least one ElementCondition in each of DECK_GROUP, SUPERSTRUCTURE, SUBSTRUCTURE; inspection_type UNDERWATER requires at least one SUBSTRUCTURE row only"
          - "quantity_balanced == true (every element's cs1..cs4 sum equals total_quantity)"
          - "every ElementCondition with deficient_quantity > 0 has photo_count >= 1 and non-empty defect_notes"
          - "field_window_start <= inspection_date <= field_window_end and inspection_date <= logical clock (validations priority 27)"
        side_effects:
          - "status = SUBMITTED; submitted_at = logical clock"
          - "recompute ElementCondition.element_health_index for every row (calculations.element_health_index)"
          - "recompute Inspection.deck_group_ehi / superstructure_group_ehi / substructure_group_ehi and the three computed_*_rating fields (calculations.nbi_component_rating)"
          - "recompute Inspection.bridge_health_index (calculations.bridge_health_index)"
      - from: SUBMITTED
        to: IN_QA
        trigger: "POST /inspections/{id}/qa-claim"
        actor: QaReviewer
        preconditions:
          - "X-User-ID != Inspection.team_leader_id (segregation of duties, validations priority 12)"
          - "Personnel(X-User-ID).team_leader_certified == true and qualification_status == CURRENT"
        side_effects:
          - "status = IN_QA; qa_reviewer_id = X-User-ID; qa_claimed_at = logical clock"
      - from: IN_QA
        to: DRAFT
        trigger: "POST /inspections/{id}/qa-decision with decision = RETURN"
        actor: QaReviewer
        preconditions:
          - "X-User-ID == Inspection.qa_reviewer_id"
        side_effects:
          - "status = DRAFT; returned_count = returned_count + 1; qa_reviewer_id = null"
          - "qa_escalation_required recomputed as (returned_count >= 2)"
        note: "Revision loop DRAFT -> SUBMITTED -> IN_QA -> DRAFT; the report may cycle any number of times"
      - from: IN_QA
        to: ACCEPTED
        trigger: "POST /inspections/{id}/qa-decision with decision = ACCEPT"
        actor: QaReviewer
        preconditions:
          - "X-User-ID == Inspection.qa_reviewer_id"
        side_effects:
          - "HOP 1: status = ACCEPTED; accepted_at = logical clock"
          - "HOP 2 (caused by HOP 1): Bridge.deck_rating / superstructure_rating / substructure_rating overwritten from this inspection's computed_*_rating for every group that has at least one element row; Bridge.min_nbi_rating, bridge_health_index, inventoried_quantity_total and deficiency_pct recomputed; Bridge.version incremented by 1"
          - "HOP 3 (caused by the HOP 2 rating change): Bridge.inspection_interval_months recomputed by calculations.inspection_interval_months from the new min_nbi_rating; Bridge.underwater_interval_months recomputed; when inspection_type == ROUTINE, Bridge.last_routine_inspection_date = inspection_date and next_inspection_due_date = last_routine_inspection_date + inspection_interval_months; when inspection_type == UNDERWATER, Bridge.last_underwater_inspection_date and next_underwater_due_date are set the same way"
          - "HOP 4 (caused by the HOP 2 rating change, only when the new Bridge.min_nbi_rating <= 5 and exactly one ProgramCycle has status PLANNING): a ProjectCandidate is created for this Bridge in that cycle with origin AUTO_FROM_INSPECTION, source_inspection_id = this inspection, status IDENTIFIED, work_type and estimated_cost_cents and priority_score computed; any prior IDENTIFIED candidate for the same (bridge_id, program_cycle_id) is set to WITHDRAWN"
          - "HOP 5 (caused by the HOP 4 candidate insert): ProgramCycle.identified_count and unprogrammed_cost_cents recomputed; ProgramCycle.version incremented by 1"
      - from: DRAFT
        to: VOIDED
        trigger: "POST /inspections/{id}/void"
        actor: BridgeInspector
        preconditions:
          - "status IN {DRAFT, SUBMITTED}"
        side_effects:
          - "status = VOIDED; the inspection's reserved field window is released, so it no longer participates in the buffer or team-leader overlap checks"
      - from: SUBMITTED
        to: VOIDED
        trigger: "POST /inspections/{id}/void"
        actor: BridgeInspector
        preconditions:
          - "status IN {DRAFT, SUBMITTED}"
        side_effects:
          - "status = VOIDED; reserved field window released"

  - entity: CriticalFinding
    dimension: finding_status
    initial_state: OPEN
    terminal_states: [RESOLVED]
    shape: linear_dimension_of_independent_pair
    transitions:
      - from: null
        to: OPEN
        trigger: "POST /critical-findings"
        actor: BridgeInspector | QaReviewer
        preconditions:
          - "Inspection(source_inspection_id).status IN {SUBMITTED, IN_QA, ACCEPTED}"
          - "ElementCondition(element_condition_id).inspection_id == source_inspection_id (validations priority 21)"
          - "severity == IMMEDIATE requires a non-null element_condition_id whose cs4_qty > 0 (validations priority 22); severity URGENT may omit element_condition_id entirely"
        side_effects:
          - "CriticalFinding created with finding_status OPEN, notification_status PENDING, restriction_action NONE"
          - "bridge_id copied from Inspection(source_inspection_id).bridge_id"
          - "notification_due_at = created_at + 24 hours"
          - "Bridge.open_critical_finding_count recomputed"
      - from: OPEN
        to: MITIGATED
        trigger: "POST /critical-findings/{id}/mitigate"
        actor: DistrictEngineer
        preconditions:
          - "finding_status == OPEN"
        side_effects:
          - "finding_status = MITIGATED; mitigation_note stored"
          - "notification_status and restriction_action are untouched"
      - from: OPEN
        to: RESOLVED
        trigger: "POST /critical-findings/{id}/resolve"
        actor: DistrictEngineer
        preconditions:
          - "finding_status IN {OPEN, MITIGATED}"
          - "notification_status IN {OWNER_NOTIFIED, FHWA_REPORTED} (the owner chain must have been walked before close-out)"
        side_effects:
          - "finding_status = RESOLVED; resolution_note stored"
          - "Bridge.open_critical_finding_count recomputed"
          - "Bridge.service_posture recomputed by calculations.service_posture - a RESOLVED finding no longer contributes its restriction_action, so the restriction or closure is lifted"
          - "Bridge.inspection_interval_months recomputed (the posture floor of 6 months no longer applies)"
          - "Bridge.version incremented by 1"
      - from: MITIGATED
        to: RESOLVED
        trigger: "POST /critical-findings/{id}/resolve"
        actor: DistrictEngineer
        preconditions:
          - "finding_status IN {OPEN, MITIGATED}"
          - "notification_status IN {OWNER_NOTIFIED, FHWA_REPORTED}"
        side_effects:
          - "finding_status = RESOLVED; resolution_note stored"
          - "Bridge.open_critical_finding_count, service_posture, inspection_interval_months recomputed; Bridge.version incremented by 1"

  - entity: CriticalFinding
    dimension: notification_status
    initial_state: PENDING
    terminal_states: [FHWA_REPORTED]
    shape: independent_dimension
    note: >-
      This dimension advances only through POST /critical-findings/{id}/notify and is never touched by
      mitigate / resolve / impose-restriction; finding_status and restriction_action likewise never
      move this field. The two dimensions therefore evolve independently on the same row.
    transitions:
      - from: PENDING
        to: OWNER_NOTIFIED
        trigger: "POST /critical-findings/{id}/notify with tier = BRIDGE_OWNER"
        actor: DistrictEngineer
        preconditions:
          - "notification_status == PENDING"
          - "finding_status != RESOLVED"
        side_effects:
          - "NotificationLog row appended with tier BRIDGE_OWNER, sent_at = logical clock, late = (sent_at > CriticalFinding.notification_due_at)"
          - "notification_status = OWNER_NOTIFIED"
          - "CriticalFinding.notification_late recomputed from the appended row"
      - from: OWNER_NOTIFIED
        to: FHWA_REPORTED
        trigger: "POST /critical-findings/{id}/notify with tier = FHWA"
        actor: DistrictEngineer
        preconditions:
          - "notification_status == OWNER_NOTIFIED (a FHWA tier notice before the owner tier is rejected by validations priority 24)"
        side_effects:
          - "NotificationLog row appended with tier FHWA, sent_at = logical clock, late = false"
          - "notification_status = FHWA_REPORTED"

  - entity: CriticalFinding
    dimension: restriction_action
    initial_state: NONE
    terminal_states: [CLOSE]
    shape: independent_dimension
    transitions:
      - from: NONE
        to: RESTRICT
        trigger: "POST /critical-findings/{id}/impose-restriction with action = RESTRICT"
        actor: DistrictEngineer
        preconditions:
          - "finding_status IN {OPEN, MITIGATED}"
          - "restriction_action == NONE"
          - "authorized_by_id == X-User-ID and Personnel(authorized_by_id) exists"
          - "authorized_by_id != Inspection(source_inspection_id).team_leader_id (segregation of duties)"
        side_effects:
          - "restriction_action = RESTRICT; restriction_authorized_by_id = authorized_by_id; restriction_imposed_at = logical clock"
          - "Bridge.service_posture recomputed to RESTRICTED (unless a CLOSE-level finding already forces CLOSED)"
          - "Bridge.inspection_interval_months recomputed with the posture floor min(current, 6)"
          - "Bridge.version incremented by 1"
      - from: NONE
        to: CLOSE
        trigger: "POST /critical-findings/{id}/impose-restriction with action = CLOSE"
        actor: DistrictEngineer
        preconditions:
          - "finding_status IN {OPEN, MITIGATED}"
          - "restriction_action IN {NONE, RESTRICT}"
          - "severity == IMMEDIATE (validations priority 23)"
          - "authorized_by_id == X-User-ID"
          - "authorized_by_id != Inspection(source_inspection_id).team_leader_id"
        side_effects:
          - "HOP 1: restriction_action = CLOSE; restriction_authorized_by_id = authorized_by_id; restriction_imposed_at = logical clock"
          - "HOP 2 (caused by HOP 1): Bridge.service_posture = CLOSED; Bridge.inspection_interval_months = min(current, 6); Bridge.version incremented by 1"
          - "HOP 3 (caused by the HOP 2 posture change): every PermitBridgeAnalysis with bridge_id == this bridge whose PermitApplication.status IN {ANALYZED, APPROVED, APPROVED_WITH_CONDITIONS} has analysis_result set to DENIED and result_reason set to BRIDGE_CLOSED"
          - "HOP 4 (caused by the HOP 3 analysis flips): each affected PermitApplication recomputes recommended_decision = DENY and governing_analysis_min_rf; any such application with status IN {APPROVED, APPROVED_WITH_CONDITIONS} transitions to REVOKED with revoked_at = logical clock"
      - from: RESTRICT
        to: CLOSE
        trigger: "POST /critical-findings/{id}/impose-restriction with action = CLOSE"
        actor: DistrictEngineer
        preconditions:
          - "severity == IMMEDIATE"
          - "authorized_by_id == X-User-ID"
        side_effects:
          - "restriction_action = CLOSE; Bridge.service_posture = CLOSED; the HOP 3 / HOP 4 permit cascade above runs identically"

  - entity: LoadRating
    initial_state: DRAFT
    terminal_states: [REJECTED, SUPERSEDED]
    shape: branching
    transitions:
      - from: null
        to: DRAFT
        trigger: "POST /bridges/{id}/load-ratings"
        actor: RatingEngineer
        preconditions:
          - "expected_bridge_version == Bridge.version (concurrency_rules load-rating-create-stale-bridge)"
          - "Inspection(source_inspection_id).bridge_id == path bridge id"
        side_effects:
          - "LoadRating created with rating_status DRAFT"
          - "condition_factor_phi_c, rating_factor_operating, rating_factor_inventory, operating_rating_tons, inventory_rating_tons, posting_required and posted_limit_tons computed immediately from the submitted inputs"
          - "Bridge.version incremented by 1"
      - from: DRAFT
        to: SEALED
        trigger: "POST /load-ratings/{id}/seal"
        actor: RatingEngineer
        preconditions:
          - "rating_status == DRAFT"
          - "sealed_by_id == X-User-ID"
          - "Personnel(sealed_by_id).load_rating_engineer_licensed == true and qualification_status == CURRENT (validations priority 15)"
        side_effects:
          - "rating_status = SEALED; sealed_by_id stored"
          - "all rating factors recomputed and frozen from the current source inspection element data"
      - from: SEALED
        to: APPROVED
        trigger: "POST /load-ratings/{id}/approve"
        actor: DistrictEngineer
        preconditions:
          - "rating_status == SEALED"
          - "approved_by_id == X-User-ID"
          - "approved_by_id != sealed_by_id (segregation of duties, validations priority 12)"
          - "Inspection(source_inspection_id).status == ACCEPTED (validations priority 28)"
        side_effects:
          - "rating_status = APPROVED; approved_by_id stored; rating_effective_date = logical clock"
          - "any other LoadRating on the same bridge with rating_status APPROVED transitions to SUPERSEDED"
          - "Bridge.governing_load_rating_id recomputed by calculations.governing_load_rating_selector; Bridge.posting_required, posted_limit_tons, operating_rating_tons and inventory_rating_tons copied from the governing rating"
          - "Bridge.service_posture recomputed - POSTED when the governing rating requires posting and no unresolved finding forces RESTRICTED or CLOSED"
          - "Bridge.version incremented by 1"
      - from: SEALED
        to: REJECTED
        trigger: "POST /load-ratings/{id}/reject"
        actor: DistrictEngineer
        preconditions:
          - "rating_status == SEALED"
        side_effects:
          - "rating_status = REJECTED; rejection_note stored; no Bridge field changes"
      - from: APPROVED
        to: SUPERSEDED
        trigger: "system event - another LoadRating on the same bridge reaches APPROVED"
        actor: system
        preconditions:
          - "a different LoadRating on the same bridge_id transitions SEALED -> APPROVED"
        side_effects:
          - "rating_status = SUPERSEDED; this rating stops being a candidate for the governing-rating selector"

  - entity: ScourEvaluation
    initial_state: DRAFT
    terminal_states: [FINAL]
    shape: linear
    transitions:
      - from: null
        to: DRAFT
        trigger: "POST /bridges/{id}/scour-evaluations"
        actor: RatingEngineer | BridgeInspector
        preconditions:
          - "Bridge.spans_water == true"
          - "Personnel(evaluated_by_id) exists and evaluated_by_id == X-User-ID"
          - "Personnel(evaluated_by_id).qualification_status == CURRENT"
        side_effects:
          - "ScourEvaluation created with status DRAFT; derived_scour_status computed from scour_code"
      - from: DRAFT
        to: FINAL
        trigger: "POST /scour-evaluations/{id}/finalize"
        actor: RatingEngineer
        preconditions:
          - "status == DRAFT"
          - "Personnel(evaluated_by_id).load_rating_engineer_licensed == true"
        side_effects:
          - "HOP 1: status = FINAL; finalized_at = logical clock"
          - "HOP 2 (caused by HOP 1): Bridge.scour_status = derived_scour_status; Bridge.inspection_interval_months recomputed (SCOUR_CRITICAL applies the min(current, 12) floor); Bridge.version incremented by 1"
          - "HOP 3 (caused by the HOP 2 scour_status change to SCOUR_CRITICAL, and only when no PlanOfAction for this bridge has status IN {REQUIRED, DRAFT, SUBMITTED, APPROVED}): a PlanOfAction is created with status REQUIRED, bridge_id and scour_evaluation_id copied from this evaluation"
          - "HOP 4 (caused by the HOP 3 plan insert): Bridge.poa_compliant = false, because a SCOUR_CRITICAL bridge has no APPROVED plan"

  - entity: PlanOfAction
    initial_state: REQUIRED
    terminal_states: [APPROVED]
    shape: cyclic
    transitions:
      - from: REQUIRED
        to: DRAFT
        trigger: "PUT /plans-of-action/{id}"
        actor: DistrictEngineer | BridgeInspector
        preconditions:
          - "status IN {REQUIRED, DRAFT}"
        side_effects:
          - "monitoring_frequency_months, closure_trigger_stage_m and countermeasure_type stored; status = DRAFT"
      - from: DRAFT
        to: DRAFT
        trigger: "PUT /plans-of-action/{id}"
        actor: DistrictEngineer | BridgeInspector
        preconditions:
          - "status IN {REQUIRED, DRAFT}"
        side_effects:
          - "plan fields overwritten; status stays DRAFT; revision_count untouched"
      - from: DRAFT
        to: SUBMITTED
        trigger: "POST /plans-of-action/{id}/submit"
        actor: DistrictEngineer | BridgeInspector
        preconditions:
          - "status == DRAFT"
          - "monitoring_frequency_months is not null and closure_trigger_stage_m is not null"
          - "countermeasure_type != NONE"
        side_effects:
          - "status = SUBMITTED; submitted_at = logical clock"
      - from: SUBMITTED
        to: DRAFT
        trigger: "POST /plans-of-action/{id}/decision with decision = RETURN"
        actor: DistrictEngineer
        preconditions:
          - "status == SUBMITTED"
        side_effects:
          - "status = DRAFT; revision_count = revision_count + 1; return_note stored"
        note: "Revision loop DRAFT -> SUBMITTED -> DRAFT"
      - from: SUBMITTED
        to: APPROVED
        trigger: "POST /plans-of-action/{id}/decision with decision = APPROVE"
        actor: DistrictEngineer
        preconditions:
          - "status == SUBMITTED"
          - "approved_by_id == X-User-ID and Personnel(approved_by_id) exists"
        side_effects:
          - "status = APPROVED; approved_at = logical clock; approved_by_id stored"
          - "Bridge.poa_compliant recomputed to true; Bridge.version incremented by 1"

  - entity: PermitApplication
    initial_state: RECEIVED
    terminal_states: [DENIED, REVOKED]
    shape: branching
    transitions:
      - from: null
        to: RECEIVED
        trigger: "POST /permit-applications"
        actor: PermitOfficer
        preconditions:
          - "axle_loads_tons has at least 2 entries, each > 0"
          - "route_bridge_ids has at least 1 entry and every entry references an existing Bridge"
        side_effects:
          - "PermitApplication created with status RECEIVED, recommended_decision PENDING"
          - "axle_count and gross_weight_tons computed by calculations.permit_gross_weight_tons"
      - from: RECEIVED
        to: ANALYZED
        trigger: "POST /permit-applications/{id}/analyze"
        actor: PermitOfficer
        preconditions:
          - "status == RECEIVED"
        side_effects:
          - "one PermitBridgeAnalysis row is created per route_bridge_ids entry, sequence_index following route order"
          - "each row resolves governing_load_rating_id via calculations.governing_load_rating_selector and computes permit_live_load_kn_m, permit_impact_factor, rating_factor_permit, analysis_result and result_reason (calculations.permit_rating_factor)"
          - "status = ANALYZED; governing_analysis_min_rf = min(rating_factor_permit) over rows that have a governing rating; recommended_decision aggregated by calculations.permit_recommended_decision"
      - from: ANALYZED
        to: APPROVED
        trigger: "POST /permit-applications/{id}/decide with decision = APPROVE"
        actor: PermitOfficer
        preconditions:
          - "status == ANALYZED"
          - "decision == recommended_decision (validations priority 30)"
        side_effects:
          - "status = APPROVED; decided_at = logical clock; decision_note stored"
      - from: ANALYZED
        to: APPROVED_WITH_CONDITIONS
        trigger: "POST /permit-applications/{id}/decide with decision = APPROVE_WITH_CONDITIONS"
        actor: PermitOfficer
        preconditions:
          - "status == ANALYZED"
          - "decision == recommended_decision"
        side_effects:
          - "status = APPROVED_WITH_CONDITIONS; decided_at = logical clock"
      - from: ANALYZED
        to: DENIED
        trigger: "POST /permit-applications/{id}/decide with decision = DENY"
        actor: PermitOfficer
        preconditions:
          - "status == ANALYZED"
          - "decision == recommended_decision"
        side_effects:
          - "status = DENIED; decided_at = logical clock"
      - from: APPROVED
        to: REVOKED
        trigger: "system event - a route bridge reaches service_posture CLOSED through a CriticalFinding closure"
        actor: system
        preconditions:
          - "at least one PermitBridgeAnalysis of this application flipped to analysis_result DENIED with result_reason BRIDGE_CLOSED"
        side_effects:
          - "status = REVOKED; revoked_at = logical clock; recommended_decision = DENY"
      - from: APPROVED_WITH_CONDITIONS
        to: REVOKED
        trigger: "system event - a route bridge reaches service_posture CLOSED"
        actor: system
        preconditions:
          - "at least one PermitBridgeAnalysis of this application flipped to DENIED with result_reason BRIDGE_CLOSED"
        side_effects:
          - "status = REVOKED; revoked_at = logical clock; recommended_decision = DENY"

  - entity: ProgramCycle
    initial_state: PLANNING
    terminal_states: [CLOSED]
    shape: cyclic
    transitions:
      - from: null
        to: PLANNING
        trigger: "POST /program-cycles"
        actor: ProgramAdmin
        preconditions:
          - "authorized_budget_cents > 0"
        side_effects:
          - "reserve_cents = round_half_up(reserve_pct * authorized_budget_cents); available_cents = authorized_budget_cents - reserve_cents; committed_cents = 0; remaining_cents = available_cents"
      - from: PLANNING
        to: LOCKED
        trigger: "POST /program-cycles/{id}/lock"
        actor: ProgramAdmin
        preconditions:
          - "status == PLANNING"
        side_effects:
          - "status = LOCKED; locked_at = logical clock; candidate creation, programming, withdrawal and deferral are all blocked while LOCKED"
      - from: LOCKED
        to: PLANNING
        trigger: "POST /program-cycles/{id}/reopen"
        actor: ProgramAdmin
        preconditions:
          - "status == LOCKED"
        side_effects:
          - "status = PLANNING; locked_at retained as the last lock instant"
        note: "Lock / reopen loop; the cycle may oscillate before submission"
      - from: LOCKED
        to: SUBMITTED
        trigger: "system event - a FederalSubmission for this cycle reaches SUBMITTED"
        actor: system
        preconditions:
          - "status == LOCKED"
        side_effects:
          - "status = SUBMITTED; submitted_at = logical clock"
      - from: SUBMITTED
        to: CLOSED
        trigger: "system event - the cycle's FederalSubmission reaches ACCEPTED"
        actor: system
        preconditions:
          - "status == SUBMITTED"
        side_effects:
          - "status = CLOSED; closed_at = logical clock"
      - from: SUBMITTED
        to: LOCKED
        trigger: "system event - the cycle's FederalSubmission reaches REJECTED"
        actor: system
        preconditions:
          - "status == SUBMITTED"
        side_effects:
          - "status = LOCKED; submitted_at cleared to null so a corrected submission can be resent"
        note: "Rejection returns the cycle to LOCKED, closing the SUBMITTED -> LOCKED -> SUBMITTED loop"

  - entity: ProjectCandidate
    initial_state: IDENTIFIED
    terminal_states: [DEFERRED, WITHDRAWN]
    shape: branching
    transitions:
      - from: null
        to: IDENTIFIED
        trigger: "POST /program-cycles/{id}/candidates (or the Inspection ACCEPT cascade HOP 4)"
        actor: DistrictEngineer | system
        preconditions:
          - "ProgramCycle.status == PLANNING"
          - "expected_program_cycle_version == ProgramCycle.version (concurrency_rules candidate-create-stale-cycle) for the API path"
          - "Bridge has at least one Inspection with status ACCEPTED (validations priority 35)"
        side_effects:
          - "ProjectCandidate created with status IDENTIFIED, origin MANUAL for the API path and AUTO_FROM_INSPECTION for the cascade"
          - "work_type, estimated_cost_cents, priority_score and ranking_policy_applied computed"
          - "any prior ProjectCandidate for the same (bridge_id, program_cycle_id) with status IDENTIFIED is set to WITHDRAWN - the new candidate supersedes it"
          - "ProgramCycle.identified_count and unprogrammed_cost_cents recomputed; ProgramCycle.version incremented by 1"
      - from: IDENTIFIED
        to: PROGRAMMED
        trigger: "POST /project-candidates/{id}/program"
        actor: DistrictEngineer
        preconditions:
          - "status == IDENTIFIED"
          - "ProgramCycle.status == PLANNING (validations priority 10)"
          - "no other ProjectCandidate in the same cycle with status IDENTIFIED outranks this one and still fits in remaining_cents (validations priority 31)"
          - "estimated_cost_cents <= ProgramCycle.remaining_cents (validations priority 33)"
        side_effects:
          - "status = PROGRAMMED; programmed_at = logical clock"
          - "ProgramCycle.committed_cents += estimated_cost_cents; remaining_cents = available_cents - committed_cents; programmed_count += 1; identified_count -= 1; unprogrammed_cost_cents -= estimated_cost_cents; ProgramCycle.version incremented by 1"
      - from: PROGRAMMED
        to: WITHDRAWN
        trigger: "POST /project-candidates/{id}/withdraw"
        actor: DistrictEngineer
        preconditions:
          - "status == PROGRAMMED"
          - "ProgramCycle.status == PLANNING"
        side_effects:
          - "status = WITHDRAWN; withdrawn_at = logical clock"
          - "ProgramCycle.committed_cents -= estimated_cost_cents; remaining_cents = available_cents - committed_cents; programmed_count -= 1; ProgramCycle.version incremented by 1"
          - "compensating action of the program transition: authorized_budget_cents == reserve_cents + committed_cents + remaining_cents holds again with committed_cents back at its pre-programming value"
      - from: IDENTIFIED
        to: DEFERRED
        trigger: "POST /project-candidates/{id}/defer"
        actor: DistrictEngineer
        preconditions:
          - "status == IDENTIFIED"
          - "ProgramCycle.status == PLANNING"
        side_effects:
          - "status = DEFERRED; deferred_at = logical clock"
          - "ProgramCycle.identified_count -= 1; deferred_count += 1; unprogrammed_cost_cents -= estimated_cost_cents; ProgramCycle.version incremented by 1"
      - from: IDENTIFIED
        to: WITHDRAWN
        trigger: "system event - a newer candidate for the same (bridge_id, program_cycle_id) is created"
        actor: system
        preconditions:
          - "status == IDENTIFIED"
        side_effects:
          - "status = WITHDRAWN; withdrawn_at = logical clock; ProgramCycle.identified_count and unprogrammed_cost_cents recomputed"

  - entity: FederalSubmission
    initial_state: BUILDING
    terminal_states: [ACCEPTED]
    shape: cyclic
    transitions:
      - from: null
        to: BUILDING
        trigger: "POST /program-cycles/{id}/federal-submissions"
        actor: ProgramAdmin
        preconditions:
          - "ProgramCycle exists"
        side_effects:
          - "FederalSubmission created with status BUILDING and all compliance counters 0"
      - from: BUILDING
        to: SUBMITTED
        trigger: "POST /federal-submissions/{id}/submit"
        actor: ProgramAdmin
        preconditions:
          - "status IN {BUILDING, REJECTED}"
          - "ProgramCycle.status == LOCKED (validations priority 10)"
          - "no Bridge has poa_compliant == false (validations priority 29)"
        side_effects:
          - "total_bridge_count, overdue_inspection_count, inspection_compliance_pct, poa_noncompliant_count, open_immediate_finding_count and error_count recomputed at the current logical clock"
          - "status = SUBMITTED; submitted_at = logical clock; submitted_by_user_id = X-User-ID"
          - "the owning ProgramCycle transitions LOCKED -> SUBMITTED"
      - from: REJECTED
        to: SUBMITTED
        trigger: "POST /federal-submissions/{id}/submit"
        actor: ProgramAdmin
        preconditions:
          - "status IN {BUILDING, REJECTED}"
          - "ProgramCycle.status == LOCKED"
          - "no Bridge has poa_compliant == false"
        side_effects:
          - "all compliance counters recomputed; status = SUBMITTED; rejection_reason_code = NONE"
          - "the owning ProgramCycle transitions LOCKED -> SUBMITTED"
        note: "Resubmission loop SUBMITTED -> REJECTED -> SUBMITTED"
      - from: SUBMITTED
        to: ACCEPTED
        trigger: "POST /federal-submissions/{id}/review with decision = ACCEPT"
        actor: FhwaReviewer
        preconditions:
          - "status == SUBMITTED"
          - "X-User-ID != submitted_by_user_id (segregation of duties, validations priority 12)"
          - "inspection_compliance_pct >= 90.00 (validations priority 34)"
        side_effects:
          - "status = ACCEPTED; reviewed_at = logical clock; reviewer_user_id = X-User-ID"
          - "the owning ProgramCycle transitions SUBMITTED -> CLOSED"
      - from: SUBMITTED
        to: REJECTED
        trigger: "POST /federal-submissions/{id}/review with decision = REJECT"
        actor: FhwaReviewer
        preconditions:
          - "status == SUBMITTED"
          - "X-User-ID != submitted_by_user_id"
        side_effects:
          - "status = REJECTED; reviewed_at = logical clock; reviewer_user_id = X-User-ID"
          - "rejection_reason_code = COMPLIANCE_BELOW_THRESHOLD when inspection_compliance_pct < 90.00, else DATA_GAPS"
          - "the owning ProgramCycle transitions SUBMITTED -> LOCKED"

  - entity: Bridge
    dimension: service_posture
    initial_state: OPEN
    terminal_states: []
    shape: posture_driven
    note: >-
      service_posture is never written directly by a client; it is the output of
      calculations.service_posture and is recomputed after every CriticalFinding restriction or
      resolution and after every LoadRating approval. It gates nothing on the bridge itself but
      drives the inspection-interval floor and the permit cascade.
    transitions:
      - from: OPEN
        to: POSTED
        trigger: "system event - a LoadRating with posting_required true becomes the governing rating"
        actor: system
        preconditions:
          - "no CriticalFinding on this bridge with finding_status IN {OPEN, MITIGATED} and restriction_action IN {RESTRICT, CLOSE}"
        side_effects:
          - "posting_required = true; posted_limit_tons copied from the governing rating"
      - from: POSTED
        to: OPEN
        trigger: "system event - a governing rating with posting_required false supersedes the posted one"
        actor: system
        preconditions:
          - "no unresolved finding carries a restriction"
        side_effects:
          - "posting_required = false; posted_limit_tons = null"
      - from: OPEN
        to: RESTRICTED
        trigger: "system event - CriticalFinding restriction_action becomes RESTRICT"
        actor: system
        preconditions: []
        side_effects:
          - "inspection_interval_months = min(current, 6)"
      - from: POSTED
        to: RESTRICTED
        trigger: "system event - CriticalFinding restriction_action becomes RESTRICT while the bridge is posted"
        actor: system
        preconditions: []
        side_effects:
          - "RESTRICTED outranks POSTED in calculations.service_posture; posting_required stays true underneath"
      - from: RESTRICTED
        to: CLOSED
        trigger: "system event - CriticalFinding restriction_action becomes CLOSE"
        actor: system
        preconditions: []
        side_effects:
          - "the permit cascade HOP 3 / HOP 4 runs"
      - from: OPEN
        to: CLOSED
        trigger: "system event - CriticalFinding restriction_action becomes CLOSE"
        actor: system
        preconditions: []
        side_effects:
          - "the permit cascade HOP 3 / HOP 4 runs"
      - from: CLOSED
        to: OPEN
        trigger: "system event - every finding carrying a restriction reaches finding_status RESOLVED and no governing rating requires posting"
        actor: system
        preconditions: []
        side_effects:
          - "inspection_interval_months recomputed without the posture floor; already REVOKED permits are NOT reinstated"
      - from: CLOSED
        to: POSTED
        trigger: "system event - every restriction is resolved while the governing rating still requires posting"
        actor: system
        preconditions: []
        side_effects:
          - "posture falls back to POSTED; posted_limit_tons unchanged"
      - from: RESTRICTED
        to: OPEN
        trigger: "system event - every finding carrying a restriction reaches RESOLVED"
        actor: system
        preconditions: []
        side_effects:
          - "inspection_interval_months recomputed without the posture floor"

# =============================================================================
# §1.2.1 Concurrency Rules (OCC on the parent's version - the only sanctioned mechanism)
# =============================================================================
concurrency_rules:
  - rule_id: load-rating-create-stale-bridge
    parent_entity: Bridge
    write_endpoint: "POST /bridges/{id}/load-ratings"
    occ_field: "expected_bridge_version"
    description: |
      Creating a LoadRating against a Bridge whose version has advanced since the client last read it
      is rejected with a stale-version error. A new rating legitimately supersedes the prior approved
      rating for the structure, so a second create observing identical state would itself succeed
      under the product semantics; the OCC check on Bridge.version is what makes the outcome
      deterministic. Every rating create, approval, restriction and acceptance cascade bumps
      Bridge.version, so the client must re-read the bridge before rating it again.
    error_id: ERR_STALE_BRIDGE_VERSION
    http_status: 412

  - rule_id: candidate-create-stale-cycle
    parent_entity: ProgramCycle
    write_endpoint: "POST /program-cycles/{id}/candidates"
    occ_field: "expected_program_cycle_version"
    description: |
      Creating a ProjectCandidate against a ProgramCycle whose version has advanced since the client
      last read it is rejected with a stale-version error. Candidate creation is a supersede
      operation - a new candidate for the same (bridge_id, program_cycle_id) withdraws the prior
      IDENTIFIED one - so a create observing identical cycle state would legitimately succeed. The
      OCC check on ProgramCycle.version reduces the supersede ambiguity to a deterministic
      version comparison.
    error_id: ERR_STALE_CYCLE_VERSION
    http_status: 412

# =============================================================================
# §1.3 Calculation Rules Table
# =============================================================================
calculations:
  - name: personnel_qualification_status
    trigger: "Recomputed on every read of Personnel and on every Inspection submit / QA claim / QA decision / load-rating seal that names the person"
    algorithm: threshold
    formula: |
      # Pure function of the NBIS refresher expiry date and the logical clock.
      if nbis_refresher_expiry_date >= current_date(logical_clock):
          qualification_status = "CURRENT"
      else:
          qualification_status = "EXPIRED"
      # Boundary: expiry == today is still CURRENT (inclusive). Expiry == today - 1 day is EXPIRED.
    input_set: "The single Personnel row; the logical clock supplies current_date as the UTC calendar date of POST /_clock/set_current_utc (startup default 2026-08-01T00:00:00Z)."
    constants: {}
    precision: "Whole calendar days, UTC; time-of-day is discarded on both sides of the comparison"

  - name: element_health_index
    trigger: "On POST /inspections/{id}/element-conditions and on PUT /element-conditions/{id}"
    algorithm: weighted_scoring
    formula: |
      reported_sum = cs1_qty + cs2_qty + cs3_qty + cs4_qty
      balanced     = (reported_sum == total_quantity)
      deficient_quantity = cs3_qty + cs4_qty
      raw = 100 * (CS_WEIGHT.CS1 * cs1_qty
                 + CS_WEIGHT.CS2 * cs2_qty
                 + CS_WEIGHT.CS3 * cs3_qty
                 + CS_WEIGHT.CS4 * cs4_qty) / total_quantity
      element_health_index = round_half_up(raw, 2)
      # Worked: total 1000, cs1 600, cs2 200, cs3 150, cs4 50
      #   raw = 100*(600 + 160 + 60 + 0)/1000 = 82.00 -> 82.00
      # Worked: total 300, cs1 0, cs2 100, cs3 100, cs4 100
      #   raw = 100*(0 + 80 + 40 + 0)/300 = 40.00 -> 40.00
      # Worked: total 4, cs1 0, cs2 2, cs3 1, cs4 1
      #   raw = 100*(0 + 1.6 + 0.4 + 0)/4 = 50.00 -> 50.00
    input_set: "The single ElementCondition row being written. total_quantity must be > 0. The index is computed even when balanced == false, so the mismatch is visible before submit rejects it."
    constants:
      CS_WEIGHT_CS1: 1.00
      CS_WEIGHT_CS2: 0.80
      CS_WEIGHT_CS3: 0.40
      CS_WEIGHT_CS4: 0.00
    precision: "2 decimal places, round_half_up; exact rational arithmetic before the single final rounding"

  - name: bridge_health_index
    trigger: "On POST /inspections/{id}/submit (stored on the Inspection) and again on the IN_QA -> ACCEPTED transition (copied to the Bridge)"
    algorithm: weighted_scoring
    formula: |
      # ROUNDING ORDER IS PINNED: each element's health index is rounded to 2dp FIRST
      # (calculations.element_health_index), and the weighted average consumes the ROUNDED values.
      # Rounding the weighted average of unrounded indices is the wrong order.
      present = [ec for ec in element_conditions(inspection)]
      weight_sum = sum(ELEMENT_WEIGHT[ec.element_key] for ec in present)
      score_sum  = sum(ELEMENT_WEIGHT[ec.element_key] * ec.element_health_index for ec in present)
      bridge_health_index = round_half_up(score_sum / weight_sum, 2)
      # Weights are re-normalised over the elements actually reported, so an inspection that omits
      # RAILING does not silently score it 0.
      # Worked (4 elements: DECK 82.00, GIRDER 40.00, BEARING 50.00, ABUTMENT 95.00):
      #   weight_sum = 0.30 + 0.25 + 0.10 + 0.10 = 0.75
      #   score_sum  = 24.60 + 10.00 + 5.00 + 9.50 = 49.10
      #   49.10 / 0.75 = 65.4666... -> 65.47
    input_set: "All ElementCondition rows of the Inspection. Each element_key appears at most once (enforced by ERR_DUPLICATE_ELEMENT_KEY)."
    constants:
      ELEMENT_WEIGHT_DECK: 0.30
      ELEMENT_WEIGHT_GIRDER: 0.25
      ELEMENT_WEIGHT_BEARING: 0.10
      ELEMENT_WEIGHT_PIER_CAP: 0.10
      ELEMENT_WEIGHT_COLUMN: 0.10
      ELEMENT_WEIGHT_ABUTMENT: 0.10
      ELEMENT_WEIGHT_JOINT: 0.05
      ELEMENT_WEIGHT_RAILING: 0.05
    precision: "2 decimal places, round_half_up, applied exactly twice: once per element index, once on the weighted average"

  - name: nbi_component_rating
    trigger: "On POST /inspections/{id}/submit, once per element group"
    algorithm: threshold
    formula: |
      # Step 1 - group health index: weighted average (same ELEMENT_WEIGHT map, re-normalised
      # inside the group) over the ROUNDED element indices of that group.
      GROUP_MEMBERS = {
        "DECK_GROUP":     ["DECK", "JOINT", "RAILING"],
        "SUPERSTRUCTURE": ["GIRDER", "BEARING"],
        "SUBSTRUCTURE":   ["PIER_CAP", "COLUMN", "ABUTMENT"],
      }
      group_ehi = round_half_up(
          sum(ELEMENT_WEIGHT[k] * ehi[k] for k in reported_members) /
          sum(ELEMENT_WEIGHT[k]          for k in reported_members), 2)
      # Step 2 - descending threshold ladder, first match wins (all comparisons are >=):
      #   >= 97 -> 9,  >= 90 -> 8,  >= 80 -> 7,  >= 70 -> 6,  >= 60 -> 5,
      #   >= 45 -> 4,  >= 30 -> 3,  >= 15 -> 2,  >=  5 -> 1,  else 0
      # A group with no reported members yields group_ehi = null and the rating carries forward
      # from the Bridge's current value (initial_* seed on first inspection).
      # Worked: DECK_GROUP with only DECK 82.00 -> group 82.00 -> 7
      #         SUPERSTRUCTURE GIRDER 40.00 (w .25) + BEARING 50.00 (w .10)
      #           = (10.00 + 5.00) / 0.35 = 42.857142... -> 42.86 -> 3
      #         SUBSTRUCTURE with only ABUTMENT 95.00 -> 95.00 -> 8
      # min_nbi_rating = min(deck_rating, superstructure_rating, substructure_rating) = 3
    input_set: "ElementCondition rows of the Inspection, partitioned by element_group. element_group must agree with GROUP_MEMBERS for the element_key (ERR_INVALID_REQUEST otherwise)."
    constants:
      RATING_THRESHOLDS: "[[97,9],[90,8],[80,7],[70,6],[60,5],[45,4],[30,3],[15,2],[5,1]]"
      DEFAULT_RATING_WHEN_GROUP_ABSENT: "carry forward the Bridge's current group rating"
    precision: "group_ehi to 2 decimal places round_half_up; the rating is an integer 0..9"

  - name: bridge_deficiency_pct
    trigger: "On POST /inspections/{id}/submit and on the IN_QA -> ACCEPTED transition"
    algorithm: aggregation
    formula: |
      inventoried_quantity_total = sum(ec.total_quantity for ec in element_conditions)
      deficient_quantity_total   = sum(ec.cs3_qty + ec.cs4_qty for ec in element_conditions)
      if inventoried_quantity_total == 0:
          deficiency_pct = 0.00
      else:
          deficiency_pct = round_half_up(
              100 * deficient_quantity_total / inventoried_quantity_total, 2)
      # NOTE: quantities of different units (SQM, M, EA) are summed as bare numbers. This is the
      # domain's declared convention - deficiency_pct is a coarse programming signal, not an area.
      # Worked: totals 1000 + 300 + 4 + 4 = 1308; deficient 200 + 200 + 2 + 0 = 402
      #   100 * 402 / 1308 = 30.7339... -> 30.73
    input_set: "All ElementCondition rows of the Inspection being submitted / accepted"
    constants: {}
    precision: "2 decimal places, round_half_up"

  - name: scour_status_derivation
    trigger: "On POST /bridges/{id}/scour-evaluations (stored as derived_scour_status) and applied to the Bridge on finalize"
    algorithm: threshold
    formula: |
      if scour_code <= 3:      derived_scour_status = "SCOUR_CRITICAL"
      elif scour_code <= 6:    derived_scour_status = "LOW_RISK"
      else:                    derived_scour_status = "STABILIZED"
      # scour_code is an integer 0..9 (NBI item 113 convention: lower = worse).
      # Boundary: 3 -> SCOUR_CRITICAL, 4 -> LOW_RISK, 6 -> LOW_RISK, 7 -> STABILIZED.
      # A bridge that has never had a FINAL evaluation stays NOT_EVALUATED.
    input_set: "The single ScourEvaluation row; only a FINAL evaluation writes through to Bridge.scour_status"
    constants:
      SCOUR_CRITICAL_MAX_CODE: 3
      LOW_RISK_MAX_CODE: 6
    precision: "Integer codes; no rounding"

  - name: inspection_interval_months
    trigger: "On Bridge create, on the IN_QA -> ACCEPTED transition, on ScourEvaluation finalize, and on every service_posture recomputation"
    algorithm: constraint_propagation
    formula: |
      # Nested min/max ladder over four independent regulatory drivers. Order is pinned: the base
      # tier is selected first, then each floor is applied by min() in the order written.
      # STEP 1 - base tier from condition and exposure (a max() over the two extension tests):
      if min_nbi_rating <= POOR_RATING_MAX:                      # <= 4
          base = SHORT_INTERVAL_MONTHS                           # 12
      elif (min_nbi_rating >= EXTENDED_RATING_MIN                 # >= 7
            and year_built >= EXTENDED_YEAR_BUILT_MIN             # >= 1990
            and adt <= EXTENDED_ADT_MAX):                         # <= 5000
          base = EXTENDED_INTERVAL_MONTHS                         # 48
      else:
          base = STANDARD_INTERVAL_MONTHS                         # 24
      # STEP 2 - special-feature floor:
      interval = base
      if fracture_critical:                    interval = min(interval, FRACTURE_CRITICAL_CAP)   # 12
      # STEP 3 - scour floor:
      if scour_status == "SCOUR_CRITICAL":      interval = min(interval, SCOUR_CRITICAL_CAP)     # 12
      # STEP 4 - posture floor (tightest):
      if service_posture in ("RESTRICTED", "CLOSED"):
                                               interval = min(interval, RESTRICTED_CAP)          #  6
      inspection_interval_months = interval
      # Underwater track is a separate, independently computed interval:
      if not underwater_elements:               underwater_interval_months = null
      elif scour_status == "SCOUR_CRITICAL":     underwater_interval_months = UNDERWATER_SCOUR_CAP  # 24
      else:                                     underwater_interval_months = UNDERWATER_BASE_MONTHS # 60
      # Worked: min_nbi 3 -> base 12; not fracture critical; LOW_RISK; OPEN -> 12
      # Worked: min_nbi 8, year_built 2005, adt 5000, fracture_critical false, LOW_RISK, OPEN -> 48
      # Worked: same but adt 5001 -> base 24 (the extension test fails on exposure alone)
      # Worked: min_nbi 8, year_built 2005, adt 4000, fracture_critical true -> min(48,12) = 12
      # Worked: min_nbi 8, year_built 2005, adt 4000, SCOUR_CRITICAL -> min(48,12) = 12
      # Worked: min_nbi 8, year_built 2005, adt 4000, fracture_critical true, RESTRICTED
      #         -> min(min(48,12),6) = 6
    input_set: "The single Bridge row after all derived fields (min_nbi_rating, scour_status, service_posture) have settled for this request"
    constants:
      STANDARD_INTERVAL_MONTHS: 24
      SHORT_INTERVAL_MONTHS: 12
      EXTENDED_INTERVAL_MONTHS: 48
      POOR_RATING_MAX: 4
      EXTENDED_RATING_MIN: 7
      EXTENDED_YEAR_BUILT_MIN: 1990
      EXTENDED_ADT_MAX: 5000
      FRACTURE_CRITICAL_CAP: 12
      SCOUR_CRITICAL_CAP: 12
      RESTRICTED_CAP: 6
      UNDERWATER_BASE_MONTHS: 60
      UNDERWATER_SCOUR_CAP: 24
    precision: "Whole months; every combination step is an exact integer min/max, never a rounded average"

  - name: next_inspection_due_date
    trigger: "Whenever inspection_interval_months or last_routine_inspection_date changes"
    algorithm: chronological
    formula: |
      # Calendar-month addition with end-of-month clamping - never 30-day arithmetic.
      def add_months(d, n):
          y, m = d.year, d.month + n
          y += (m - 1) // 12
          m  = (m - 1) % 12 + 1
          return date(y, m, min(d.day, days_in_month(y, m)))
      base = last_routine_inspection_date or date_of(bridge.created_at)
      next_inspection_due_date = add_months(base, inspection_interval_months)
      # Underwater track uses last_underwater_inspection_date (or the bridge creation date) and
      # underwater_interval_months; when underwater_interval_months is null the due date is null.
      # Worked: 2026-08-31 + 6 months -> 2027-02-28 (day clamped, February has 28 days in 2027)
      # Worked: 2026-01-31 + 1 month  -> 2026-02-28
      # Worked: 2026-08-15 + 24 months -> 2028-08-15
    input_set: "The single Bridge row"
    constants: {}
    precision: "Whole calendar dates, UTC"

  - name: condition_factor_phi_c
    trigger: "On POST /bridges/{id}/load-ratings, from the named source inspection"
    algorithm: threshold
    formula: |
      # LRFR condition factor driven by the WORST condition state that carries any quantity among
      # the SUPERSTRUCTURE-group elements of the source inspection.
      worst = "CS1"
      for ec in element_conditions(source_inspection) where ec.element_group == "SUPERSTRUCTURE":
          if ec.cs4_qty > 0:   worst = max_state(worst, "CS4")
          elif ec.cs3_qty > 0: worst = max_state(worst, "CS3")
          elif ec.cs2_qty > 0: worst = max_state(worst, "CS2")
      condition_factor_phi_c = PHI_C_BY_STATE[worst]   # CS1/CS2 -> 1.00, CS3 -> 0.95, CS4 -> 0.85
      # Note the per-element elif ladder: an element reports its own worst non-empty state, and the
      # bridge-level worst is the max over elements. An element with cs4_qty 0 but cs3_qty 5
      # contributes CS3, not CS4.
      # Worked: GIRDER (0,100,100,100) has cs4_qty > 0 -> CS4 -> phi_c 0.85
      # Worked: GIRDER (200,100,0,0) and BEARING (4,0,0,0) -> worst CS2 -> phi_c 1.00
      # If the source inspection reports no SUPERSTRUCTURE element the rating create is rejected
      # by ERR_ELEMENT_GROUP_MISSING (validations priority 18).
    input_set: "ElementCondition rows of source_inspection_id with element_group == SUPERSTRUCTURE"
    constants:
      PHI_C_CS1: 1.00
      PHI_C_CS2: 1.00
      PHI_C_CS3: 0.95
      PHI_C_CS4: 0.85
    precision: "Exact 2-decimal constant; no rounding of the lookup itself"

  - name: load_rating_factor
    trigger: "On POST /bridges/{id}/load-ratings; both variants are always computed and stored on the same row"
    algorithm: threshold
    formula: |
      # LRFR general rating equation. gamma_LL is the ONLY term that differs between the two
      # variants, and it changes the result for identical structural data.
      numerator   = phi_c * phi_s * phi * capacity_c_kn_m
                    - GAMMA_DC * dead_load_dc_kn_m
                    - GAMMA_DW * dead_load_dw_kn_m
      denominator = gamma_LL * live_load_ll_kn_m * impact_im_factor
      RF = round_half_up(numerator / denominator, 3)          # ROUND FIRST
      tons = round_half_up(RF * RATING_VEHICLE_TONS, 1)       # THEN convert the ROUNDED RF
      # Both variants share the numerator; only gamma_LL differs.
      rating_factor_operating = RF with gamma_LL = GAMMA_LL_OPERATING   # 1.35
      rating_factor_inventory = RF with gamma_LL = GAMMA_LL_INVENTORY   # 1.75
      operating_rating_tons   = round_half_up(rating_factor_operating * 36.0, 1)
      inventory_rating_tons   = round_half_up(rating_factor_inventory * 36.0, 1)
      posting_required = (rating_factor_operating < POSTING_RF_THRESHOLD)   # strict <, 1.000
      if posting_required:
          posted_limit_tons = floor(inventory_rating_tons * 2) / 2   # round DOWN to nearest 0.5 t
      else:
          posted_limit_tons = null
      # Worked case A: C=2000, DC=600, DW=150, LL=500, IM=1.33, phi=0.90, phi_s=1.00, phi_c=0.85
      #   numerator = 0.85*1.00*0.90*2000 - 1.25*600 - 1.50*150 = 1530 - 750 - 225 = 555
      #   inventory: denom = 1.75*500*1.33 = 1163.75 -> RF 0.4769... -> 0.477 -> 17.172 -> 17.2 t
      #   operating: denom = 1.35*500*1.33 =  897.75 -> RF 0.6182... -> 0.618 -> 22.248 -> 22.2 t
      #   posting_required = true (0.618 < 1.000); posted_limit = floor(34.4)/2 = 17.0 t
      # Worked boundary case: C=2000, DC=465.6, DW=33.5, LL=500, IM=1.33, phi_c=0.85
      #   numerator = 1530 - 582.0 - 50.25 = 897.75
      #   operating RF = 897.75/897.75 = 1.000 exactly -> posting_required FALSE, posted_limit null
      #   inventory RF = 897.75/1163.75 = 0.77143... -> 0.771 -> 27.756 -> 27.8 t
      #   operating tons = 1.000 * 36.0 = 36.0 t
      # Worked sibling case: C=2000, DC=466.0, DW=34.0 -> numerator = 1530 - 582.5 - 51.0 = 896.5
      #   operating RF = 896.5/897.75 = 0.99860... -> 0.999 -> posting_required TRUE
      #   inventory RF = 896.5/1163.75 = 0.77035... -> 0.770 -> 27.72 -> 27.7 t
      #   posted_limit = floor(55.4)/2 = 27.5 t
    input_set: "The single LoadRating row being created, plus condition_factor_phi_c derived from its source inspection"
    constants:
      GAMMA_DC: 1.25
      GAMMA_DW: 1.50
      GAMMA_LL_OPERATING: 1.35
      GAMMA_LL_INVENTORY: 1.75
      RATING_VEHICLE_TONS: 36.0
      POSTING_RF_THRESHOLD: 1.000
      POSTED_LIMIT_STEP_TONS: 0.5
    variants:
      - name: operating
        when: "Always computed; governs posting decisions, permit analysis and the bridge's service posture"
        difference: "gamma_LL = 1.35 (the maximum live load the structure may carry for occasional passage). Yields the HIGHER rating factor of the two."
      - name: inventory
        when: "Always computed; governs the posted weight limit that is signed on the structure"
        difference: "gamma_LL = 1.75 (the load level the structure can carry for an indefinite period). Yields the LOWER rating factor, and is the only variant that feeds posted_limit_tons."
    precision: "Rating factors to 3 decimal places round_half_up; tons to 1 decimal place round_half_up computed from the ALREADY-ROUNDED rating factor; posted_limit_tons floored to the 0.5-ton step"

  - name: governing_load_rating_selector
    trigger: "On the SEALED -> APPROVED LoadRating transition, on POST /permit-applications/{id}/analyze, and on every service_posture recomputation"
    algorithm: chronological
    formula: |
      candidates = [lr for lr in load_ratings
                    if lr.bridge_id == bridge.id and lr.rating_status == "APPROVED"]
      if candidates is empty:
          governing_load_rating_id = null          # permit analysis -> NO_APPROVED_RATING
      else:
          # Rank by effective date descending; break ties on created_at descending.
          # The row id is NEVER a decision input.
          governing = max(candidates, key=(rating_effective_date, created_at))
          governing_load_rating_id = governing.id
      # Approving a rating supersedes the previously governing one: its rating_status becomes
      # SUPERSEDED, so it leaves the candidate set for all later selections.
    input_set: "LoadRating rows for the bridge with rating_status == APPROVED. DRAFT, SEALED, REJECTED and SUPERSEDED rows are excluded."
    constants: {}
    precision: "No arithmetic; ordering only. Tie-break is created_at descending, never id."

  - name: service_posture
    trigger: "After every CriticalFinding restriction / mitigation / resolution, after every LoadRating approval, and after every ScourEvaluation finalize"
    algorithm: constraint_propagation
    formula: |
      # Strict precedence ladder - the most severe active driver wins.
      active_restrictions = [cf for cf in critical_findings
                             if cf.bridge_id == bridge.id
                             and cf.finding_status in ("OPEN", "MITIGATED")
                             and cf.restriction_action in ("RESTRICT", "CLOSE")]
      if any(cf.restriction_action == "CLOSE" for cf in active_restrictions):
          service_posture = "CLOSED"
      elif active_restrictions:                       # at least one RESTRICT
          service_posture = "RESTRICTED"
      elif governing_rating is not null and governing_rating.posting_required:
          service_posture = "POSTED"
      else:
          service_posture = "OPEN"
      # posting_required / posted_limit_tons on the Bridge always mirror the governing rating,
      # independently of the posture ladder - a CLOSED bridge can still carry a posted limit.
      # A finding whose finding_status is RESOLVED no longer restricts, even though its
      # restriction_action stays RESTRICT/CLOSE for the audit record.
    input_set: "CriticalFinding rows of the bridge with finding_status IN {OPEN, MITIGATED}, plus the governing LoadRating"
    constants:
      POSTURE_PRECEDENCE: "CLOSED > RESTRICTED > POSTED > OPEN"
    precision: "Enum selection; no arithmetic"

  - name: permit_gross_weight_tons
    trigger: "On POST /permit-applications"
    algorithm: aggregation
    formula: |
      # ROUNDING ORDER IS PINNED: each axle load is rounded to 1 decimal place FIRST (the scale
      # ticket records tenths of a ton per axle), and the gross weight is the sum of the ROUNDED
      # axle loads. Summing the raw axle loads and rounding the total is the WRONG order and
      # produces a different answer.
      axle_count = len(axle_loads_tons)
      rounded    = [round_half_up(a, 1) for a in axle_loads_tons]
      gross_weight_tons = round_half_up(sum(rounded), 1)
      # Worked: [8.25, 8.25, 8.25, 8.25, 6.4]
      #   pinned order:  [8.3, 8.3, 8.3, 8.3, 6.4] -> sum 39.6 -> 39.6   <-- correct
      #   wrong order:   sum 39.4 -> 39.4                                <-- 0.2 t low
      # Worked: [10.0, 10.0, 10.0, 6.0] -> 36.0 (a permit exactly at the rating vehicle weight)
    input_set: "The axle_loads_tons array of the single PermitApplication being created"
    constants:
      AXLE_ROUNDING_DECIMALS: 1
    precision: "Each axle to 1 decimal place round_half_up, then the sum to 1 decimal place round_half_up"

  - name: permit_rating_factor
    trigger: "On POST /permit-applications/{id}/analyze, once per route bridge"
    algorithm: threshold
    formula: |
      governing = governing_load_rating_selector(bridge)
      if bridge.service_posture == "CLOSED":
          rating_factor_permit = null
          analysis_result = "DENIED";  result_reason = "BRIDGE_CLOSED"
      elif governing is null:
          rating_factor_permit = null
          analysis_result = "DENIED";  result_reason = "NO_APPROVED_RATING"
      else:
          # Scale the governing rating's live-load effect by the permit's weight ratio.
          permit_live_load_kn_m = governing.live_load_ll_kn_m
                                  * (application.gross_weight_tons / RATING_VEHICLE_TONS)
          permit_impact_factor  = (governing.impact_im_factor
                                   if application.speed_category == "NORMAL"
                                   else CRAWL_IMPACT_FACTOR)          # 1.00
          numerator = governing.condition_factor_phi_c * governing.system_factor_phi_s
                      * governing.resistance_factor_phi * governing.capacity_c_kn_m
                      - GAMMA_DC * governing.dead_load_dc_kn_m
                      - GAMMA_DW * governing.dead_load_dw_kn_m
          denominator = GAMMA_LL_OPERATING * permit_live_load_kn_m * permit_impact_factor
          rating_factor_permit = round_half_up(numerator / denominator, 3)
          if   rating_factor_permit >= PERMIT_ADEQUATE_RF:   # >= 1.000
              analysis_result = "ALLOWED";                  result_reason = "RF_ADEQUATE"
          elif rating_factor_permit >= PERMIT_MARGINAL_RF:   # >= 0.900
              analysis_result = "ALLOWED_WITH_CONDITIONS";   result_reason = "RF_MARGINAL"
          else:
              analysis_result = "DENIED";                   result_reason = "RF_INSUFFICIENT"
      # Worked (governing = boundary case: C=2000, DC=465.6, DW=33.5, LL=500, IM=1.33,
      #         phi_c=0.85, permit gross 36.0 t, speed NORMAL):
      #   permit_live_load = 500 * (36.0/36.0) = 500; IM = 1.33
      #   RF = 897.75 / (1.35*500*1.33) = 897.75/897.75 = 1.000 -> ALLOWED / RF_ADEQUATE
      # Worked (same governing, permit gross 39.6 t, speed NORMAL):
      #   permit_live_load = 500 * (39.6/36.0) = 550; denom = 1.35*550*1.33 = 987.525
      #   RF = 897.75/987.525 = 0.90909... -> 0.909 -> ALLOWED_WITH_CONDITIONS / RF_MARGINAL
      # Worked (same governing, permit gross 39.6 t, speed CRAWL):
      #   IM = 1.00; denom = 1.35*550*1.00 = 742.5; RF = 1.2091... -> 1.209 -> ALLOWED
      # Worked (same governing, permit gross 48.0 t, speed NORMAL):
      #   permit_live_load = 500*(48.0/36.0) = 666.666...; denom = 1.35*666.666...*1.33
      #     = 1197.0; RF = 897.75/1197.0 = 0.75 -> 0.750 -> DENIED / RF_INSUFFICIENT
    input_set: "One route bridge, its governing APPROVED LoadRating, and the PermitApplication's gross_weight_tons and speed_category"
    constants:
      RATING_VEHICLE_TONS: 36.0
      CRAWL_IMPACT_FACTOR: 1.00
      GAMMA_DC: 1.25
      GAMMA_DW: 1.50
      GAMMA_LL_OPERATING: 1.35
      PERMIT_ADEQUATE_RF: 1.000
      PERMIT_MARGINAL_RF: 0.900
    precision: "Exact rational arithmetic through the scaling step; a single round_half_up to 3 decimal places on the rating factor, and the thresholds compare the ROUNDED value"

  - name: permit_recommended_decision
    trigger: "At the end of POST /permit-applications/{id}/analyze"
    algorithm: aggregation
    formula: |
      results = [row.analysis_result for row in permit_bridge_analyses(application)]
      if "DENIED" in results:                          recommended_decision = "DENY"
      elif "ALLOWED_WITH_CONDITIONS" in results:       recommended_decision = "APPROVE_WITH_CONDITIONS"
      else:                                            recommended_decision = "APPROVE"
      rf_values = [row.rating_factor_permit for row in rows if row.rating_factor_permit is not null]
      governing_analysis_min_rf = min(rf_values) if rf_values else null
      # The worst bridge on the route decides the whole permit - one DENIED span denies the move
      # even when every other span is ALLOWED.
    input_set: "All PermitBridgeAnalysis rows of the application (one per route_bridge_ids entry, duplicates in the route array produce duplicate rows)"
    constants: {}
    precision: "Enum aggregation; governing_analysis_min_rf keeps the 3-decimal precision of its source row"

  - name: estimated_repair_cost_cents
    trigger: "On ProjectCandidate creation (API path and the Inspection ACCEPT cascade)"
    algorithm: aggregation
    formula: |
      # Per-element line rounding FIRST, then the mobilization multiplier on the summed lines.
      lines = []
      for ec in element_conditions(source_inspection):
          qty  = ec.cs3_qty + ec.cs4_qty
          line = round_half_up(UNIT_REPAIR_COST_CENTS[ec.element_key] * qty)
          lines.append(line)
      subtotal = sum(lines)
      estimated_cost_cents = round_half_up(subtotal * MOBILIZATION_FACTOR)
      # Worked (source inspection: DECK cs3 150 + cs4 50 = 200; GIRDER 100 + 100 = 200;
      #         BEARING 1 + 1 = 2; ABUTMENT 0 + 0 = 0):
      #   DECK     18000 * 200 = 3,600,000
      #   GIRDER   95000 * 200 = 19,000,000
      #   BEARING 260000 *   2 =    520,000
      #   ABUTMENT             =          0
      #   subtotal = 23,120,000; * 1.15 = 26,588,000 -> 26,588,000 cents
    input_set: "ElementCondition rows of the candidate's source_inspection_id; only cs3_qty and cs4_qty quantities are priced (CS1/CS2 need no work)"
    constants:
      UNIT_REPAIR_COST_CENTS_DECK: 18000
      UNIT_REPAIR_COST_CENTS_GIRDER: 95000
      UNIT_REPAIR_COST_CENTS_BEARING: 260000
      UNIT_REPAIR_COST_CENTS_PIER_CAP: 140000
      UNIT_REPAIR_COST_CENTS_COLUMN: 210000
      UNIT_REPAIR_COST_CENTS_ABUTMENT: 175000
      UNIT_REPAIR_COST_CENTS_JOINT: 55000
      UNIT_REPAIR_COST_CENTS_RAILING: 40000
      MOBILIZATION_FACTOR: 1.15
    precision: "Whole cents; round_half_up per element line and once more after the mobilization multiplier"

  - name: candidate_work_type
    trigger: "On ProjectCandidate creation"
    algorithm: threshold
    formula: |
      m = bridge.min_nbi_rating
      if   m <= 3: work_type = "REPLACEMENT"
      elif m == 4: work_type = "REHABILITATION"
      elif m == 5: work_type = "REPAIR"
      else:        work_type = "PRESERVATION"
      # Boundary: 3 -> REPLACEMENT, 4 -> REHABILITATION, 5 -> REPAIR, 6 -> PRESERVATION.
    input_set: "The Bridge's min_nbi_rating as of candidate creation"
    constants:
      REPLACEMENT_MAX_RATING: 3
      REHABILITATION_RATING: 4
      REPAIR_RATING: 5
    precision: "Integer comparison"

  - name: candidate_priority_score
    trigger: "On ProjectCandidate creation; the variant is selected by the owning ProgramCycle's ranking_policy"
    algorithm: weighted_scoring
    formula: |
      condition_gap  = 100 - bridge.bridge_health_index
      rating_gap     = (9 - bridge.min_nbi_rating) * (100 / 9)
      scour_points   = SCOUR_POINTS[bridge.scour_status]
      exposure_points = min(100.00, round_half_up(bridge.adt / 250 + bridge.detour_length_km, 2))
      posting_points = POSTING_POINTS[bridge.service_posture]

      if cycle.ranking_policy == "CONDITION_BASED":
          score = 0.50 * condition_gap + 0.30 * rating_gap + 0.20 * bridge.deficiency_pct
      else:  # RISK_BASED
          score = 0.35 * condition_gap + 0.25 * scour_points
                + 0.25 * exposure_points + 0.15 * posting_points
      priority_score = round_half_up(score, 2)
      ranking_policy_applied = cycle.ranking_policy
      # Worked (BHI 65.47, min_nbi 3, deficiency_pct 30.73, scour LOW_RISK, adt 12000,
      #          detour 8.5 km, posture OPEN):
      #   CONDITION_BASED: 0.50*34.53 + 0.30*(6*100/9) + 0.20*30.73
      #                  = 17.265 + 20.00 + 6.146 = 43.411 -> 43.41
      #   RISK_BASED:      exposure = min(100, 12000/250 + 8.5 = 56.50) = 56.50
      #                  = 0.35*34.53 + 0.25*40 + 0.25*56.50 + 0.15*0
      #                  = 12.0855 + 10.00 + 14.125 + 0 = 36.2105 -> 36.21
      #   Same bridge, same cycle data, 7.20 points of divergence between the two policies.
    input_set: "The single Bridge row (post-acceptance derived fields) and the owning ProgramCycle's ranking_policy"
    constants:
      SCOUR_POINTS_SCOUR_CRITICAL: 100
      SCOUR_POINTS_NOT_EVALUATED: 70
      SCOUR_POINTS_LOW_RISK: 40
      SCOUR_POINTS_STABILIZED: 20
      POSTING_POINTS_CLOSED: 100
      POSTING_POINTS_RESTRICTED: 80
      POSTING_POINTS_POSTED: 60
      POSTING_POINTS_OPEN: 0
      EXPOSURE_ADT_DIVISOR: 250
      EXPOSURE_CAP: 100.00
    variants:
      - name: condition_based
        when: "ProgramCycle.ranking_policy == CONDITION_BASED - the default statewide preservation ranking"
        difference: "Uses only condition inputs (health index, NBI rating gap, deficiency percentage) with weights 0.50 / 0.30 / 0.20. Ignores scour, traffic exposure and posting entirely."
      - name: risk_based
        when: "ProgramCycle.ranking_policy == RISK_BASED - used in cycles that prioritise vulnerability and public exposure"
        difference: "Replaces the NBI-gap and deficiency terms with scour risk points, traffic/detour exposure points and posting points at weights 0.35 / 0.25 / 0.25 / 0.15, so a sound but scour-critical high-traffic bridge outranks a deteriorated rural one."
    precision: "Exact rational arithmetic throughout; exposure_points rounded to 2 decimal places before weighting, and the final score rounded once to 2 decimal places round_half_up"

  - name: program_budget_waterfall
    trigger: "On ProgramCycle creation and after every candidate program / withdraw / defer"
    algorithm: waterfall_allocation
    formula: |
      # The reserve is a function of the AUTHORIZED budget ONLY. It is computed once at creation
      # and is NEVER recomputed from committed_cents - that circularity is explicitly excluded.
      reserve_cents   = round_half_up(reserve_pct * authorized_budget_cents)   # fixed at creation
      available_cents = authorized_budget_cents - reserve_cents                # fixed at creation
      committed_cents = sum(c.estimated_cost_cents for c in candidates
                            if c.status == "PROGRAMMED")
      remaining_cents = available_cents - committed_cents
      # Invariant, checked after every mutation:
      #   authorized_budget_cents == reserve_cents + committed_cents + remaining_cents
      # Bucket order: reserve fills first (off the top), then commitments in programming order,
      # and remaining_cents is the residual. A program action is rejected by ERR_BUDGET_EXCEEDED
      # when estimated_cost_cents > remaining_cents (strict >; a candidate that consumes exactly
      # remaining_cents is allowed and drives remaining_cents to 0).
      unprogrammed_cost_cents = sum(c.estimated_cost_cents for c in candidates
                                    if c.status == "IDENTIFIED")
      # Worked: authorized 10,000,000,000, reserve_pct 0.05
      #   reserve = 500,000,000; available = 9,500,000,000; remaining = 9,500,000,000
      #   program a 26,588,000 candidate -> committed 26,588,000; remaining 9,473,412,000
      #   invariant: 500,000,000 + 26,588,000 + 9,473,412,000 = 10,000,000,000  OK
      #   withdraw it -> committed 0; remaining 9,500,000,000; invariant holds again
    input_set: "ProjectCandidate rows of the cycle; only status == PROGRAMMED rows contribute to committed_cents, only status == IDENTIFIED rows to unprogrammed_cost_cents. DEFERRED and WITHDRAWN rows contribute to neither."
    constants:
      DEFAULT_RESERVE_PCT: 0.05
    precision: "Whole cents; the reserve is the only rounded quantity and it is rounded exactly once, at creation"

  - name: candidate_rank_gate
    trigger: "On POST /project-candidates/{id}/program, before the budget check"
    algorithm: chronological
    formula: |
      # Programming must respect the cycle's ranking: a lower-priority candidate cannot jump ahead
      # of a higher-priority one that the remaining budget could still fund.
      blockers = [c for c in candidates(cycle)
                  if c.status == "IDENTIFIED"
                  and c.id != target.id
                  and outranks(c, target)
                  and c.estimated_cost_cents <= cycle.remaining_cents]
      if blockers: reject with ERR_HIGHER_PRIORITY_CANDIDATE_PENDING
      # outranks(a, b) is: a.priority_score > b.priority_score, or
      #                    (a.priority_score == b.priority_score and a.created_at < b.created_at)
      # The tie-break is the earlier created_at - never the row id.
      # A higher-priority candidate that no longer FITS in remaining_cents does not block: the
      # cycle is allowed to spend its residual on affordable lower-priority work.
    input_set: "ProjectCandidate rows of the same ProgramCycle with status == IDENTIFIED"
    constants: {}
    precision: "priority_score compared at its stored 2-decimal precision; created_at to full timestamp precision"

  - name: inspection_compliance_pct
    trigger: "On POST /federal-submissions/{id}/submit and on GET /bridges/{id}/compliance-summary"
    algorithm: aggregation
    formula: |
      total_bridge_count = count(all bridges)
      overdue_inspection_count = count(b for b in bridges
                                       if b.next_inspection_due_date < current_date(logical_clock))
      # STRICT less-than: a bridge whose due date IS today is compliant, not overdue.
      if total_bridge_count == 0:
          inspection_compliance_pct = 100.00
      else:
          inspection_compliance_pct = round_half_up(
              100 * (total_bridge_count - overdue_inspection_count) / total_bridge_count, 2)
      poa_noncompliant_count       = count(b for b in bridges if b.poa_compliant == false)
      open_immediate_finding_count = count(cf for cf in critical_findings
                                           if cf.severity == "IMMEDIATE"
                                           and cf.finding_status in ("OPEN", "MITIGATED"))
      error_count = poa_noncompliant_count + open_immediate_finding_count
      # Worked: 3 bridges, 1 overdue -> 100*2/3 = 66.6666... -> 66.67
      # Worked: 10 bridges, 1 overdue -> 90.00 exactly -> ACCEPT allowed (>= 90.00)
      # Worked: 10 bridges, 2 overdue -> 80.00 -> ERR_COMPLIANCE_BELOW_THRESHOLD on ACCEPT
    input_set: "All Bridge rows in the system (the federal submission is statewide, not cycle-scoped) plus all CriticalFinding rows"
    constants:
      ACCEPTANCE_COMPLIANCE_THRESHOLD_PCT: 90.00
    precision: "2 decimal places, round_half_up; the acceptance threshold compares the ROUNDED percentage with >="

  - name: notification_deadline
    trigger: "On CriticalFinding creation and on every POST /critical-findings/{id}/notify"
    algorithm: chronological
    formula: |
      notification_due_at = created_at + NOTIFICATION_WINDOW_HOURS   # 24 hours
      # On each notify call:
      late = (logical_clock > finding.notification_due_at)     # STRICT >; exactly at the deadline
                                                              # is on time
      NotificationLog.sent_at = logical_clock
      NotificationLog.late    = late
      finding.notification_late = finding.notification_late or late   # sticky once true
      # Worked: finding created at 2026-08-01T00:00:00Z -> due 2026-08-02T00:00:00Z
      #   notify at 2026-08-02T00:00:00Z -> late = false
      #   notify at 2026-08-02T00:00:01Z -> late = true
    input_set: "The single CriticalFinding row and the logical clock"
    constants:
      NOTIFICATION_WINDOW_HOURS: 24
    precision: "Whole seconds, UTC; the comparison is strict >"

  - name: inspection_window_conflicts
    trigger: "On POST /bridges/{id}/inspections, before any state write"
    algorithm: interval_merge
    formula: |
      # TWO overlap tests with DELIBERATELY DIFFERENT interval semantics run against the same
      # candidate window [field_window_start, field_window_end).
      #
      # (1) TEAM-LEADER CAPACITY - HALF-OPEN [start, end), capacity 1.
      #     A team leader cannot lead two inspections whose windows overlap, but back-to-back
      #     windows that merely TOUCH are allowed (new.start == existing.end is fine).
      #     conflict := new.start < existing.end AND existing.start < new.end
      #     -> ERR_TEAM_LEADER_WINDOW_CONFLICT (409)
      #
      # (2) BRIDGE ACCESS BUFFER - CLOSED interval inflated by a 72-hour buffer on BOTH sides.
      #     Traffic control setup and teardown mean two inspections on the SAME structure need a
      #     three-day gap; touching or merely-close windows are rejected.
      #     conflict := new.start < existing.end + 72h AND existing.start < new.end + 72h
      #     -> ERR_BRIDGE_ACCESS_BUFFER_CONFLICT (409)
      #
      # Both tests ignore Inspection rows with status == VOIDED. A window with
      # field_window_start == field_window_end is rejected by ERR_INVALID_REQUEST.
      # Worked (team leader, existing 2026-09-01T08:00Z .. 2026-09-01T16:00Z):
      #   new 2026-09-01T16:00Z .. 2026-09-01T20:00Z -> adjacency, ALLOWED
      #   new 2026-09-01T15:59Z .. 2026-09-01T20:00Z -> overlap, REJECTED
      # Worked (same bridge, existing 2026-09-01T08:00Z .. 2026-09-01T16:00Z):
      #   new 2026-09-04T15:59Z .. 2026-09-04T20:00Z -> gap 95h59m > 72h, ALLOWED
      #   new 2026-09-04T15:00Z .. 2026-09-04T20:00Z -> 2026-09-04T15:00Z <
      #       2026-09-01T16:00Z + 72h = 2026-09-04T16:00Z, REJECTED (buffer)
    input_set: "Existing Inspection rows with status != VOIDED: all rows sharing team_leader_id for test (1), all rows sharing bridge_id for test (2)"
    constants:
      BRIDGE_ACCESS_BUFFER_HOURS: 72
      TEAM_LEADER_CAPACITY: 1
    precision: "Whole seconds, UTC. Test (1) is half-open [start, end); test (2) is closed and buffer-inflated."

# =============================================================================
# §1.4 Validation Rules Table (ordered by priority - lowest number wins when several are violated)
# =============================================================================
validations:
  - priority: 1
    category: auth
    check: "X-User-ID and X-User-Role headers are both present and X-User-Role is one of the seven declared roles"
    error_id: ERR_UNAUTHENTICATED
    http_status: 401
    applies_to: all

  - priority: 2
    category: auth
    check: "The authenticated role appears in the endpoint's roles list"
    error_id: ERR_ROLE_NOT_PERMITTED
    http_status: 403
    applies_to: all

  - priority: 3
    category: business_constraint
    check: "Request body and query parameters are well formed: required fields present, enums within their declared value sets, numeric fields within range (total_quantity > 0, cs*_qty >= 0, authorized_budget_cents > 0, scour_code 0..9, axle loads > 0, at least 2 axles, at least 1 route bridge, field_window_start < field_window_end, limit 1..100, offset >= 0, reserve_pct 0.00..0.50)"
    error_id: ERR_INVALID_REQUEST
    http_status: 400
    applies_to: all

  - priority: 5
    category: existence
    check: "Every resource named in the path exists, validated left to right"
    error_id: "ERR_BRIDGE_NOT_FOUND | ERR_PERSONNEL_NOT_FOUND | ERR_INSPECTION_RECORD_NOT_FOUND | ERR_RATING_RECORD_NOT_FOUND | ERR_PERMIT_NOT_FOUND | ERR_PROGRAM_RECORD_NOT_FOUND"
    http_status: 404
    applies_to: "all endpoints with a path parameter"

  - priority: 6
    category: business_referential
    check: "Every foreign key in the request body references an existing row (team_leader_id, qa_reviewer_id, evaluated_by_id, authorized_by_id, approved_by_id, bridge_id, source_inspection_id, element_condition_id, every entry of route_bridge_ids)"
    error_id: "ERR_PERSONNEL_NOT_FOUND | ERR_BRIDGE_NOT_FOUND | ERR_INSPECTION_RECORD_NOT_FOUND"
    http_status: 404
    applies_to: "POST /bridges/{id}/inspections, POST /critical-findings, POST /bridges/{id}/load-ratings, POST /bridges/{id}/scour-evaluations, POST /permit-applications, POST /program-cycles/{id}/candidates, POST /critical-findings/{id}/impose-restriction, POST /plans-of-action/{id}/decision, POST /load-ratings/{id}/approve"

  - priority: 7
    category: auth
    check: "For entity_backed roles that name themselves in the payload, the named Personnel id equals X-User-ID (a BridgeInspector may not file an inspection under another inspector's id; a RatingEngineer may not seal under another engineer's id)"
    error_id: ERR_IDENTITY_MISMATCH
    http_status: 403
    applies_to: "POST /bridges/{id}/inspections, POST /bridges/{id}/scour-evaluations, POST /plans-of-action/{id}/decision"

  - priority: 8
    category: state
    check: "expected_bridge_version equals the Bridge's current version (concurrency_rules load-rating-create-stale-bridge)"
    error_id: ERR_STALE_BRIDGE_VERSION
    http_status: 412
    applies_to: "POST /bridges/{id}/load-ratings"

  - priority: 9
    category: state
    check: "expected_program_cycle_version equals the ProgramCycle's current version (concurrency_rules candidate-create-stale-cycle)"
    error_id: ERR_STALE_CYCLE_VERSION
    http_status: 412
    applies_to: "POST /program-cycles/{id}/candidates"

  - priority: 10
    category: state
    check: "The target resource - and any parent whose state gates the operation - is in a state from which this transition is declared in §1.2"
    error_id: "ERR_INSPECTION_STATE_INVALID | ERR_RATING_STATE_INVALID | ERR_FINDING_STATE_INVALID | ERR_PERMIT_STATE_INVALID | ERR_PROGRAM_STATE_INVALID"
    http_status: 409
    applies_to: "all action endpoints and all nested creates"

  - priority: 11
    category: business_constraint
    check: "Uniqueness: nbi_structure_number is unique across bridges; permit_number is unique across permit applications; element_key is unique within an inspection"
    error_id: "ERR_DUPLICATE_STRUCTURE_NUMBER | ERR_DUPLICATE_PERMIT_NUMBER | ERR_DUPLICATE_ELEMENT_KEY"
    http_status: 409
    applies_to: "POST /bridges, POST /permit-applications, POST /inspections/{id}/element-conditions"

  - priority: 12
    category: business_safety
    check: "Segregation of duties: the QA reviewer of an inspection is not its team leader; the approver of a load rating is not the engineer who sealed it; the FHWA reviewer of a submission is not the user who submitted it; the person authorising a restriction is not the team leader of the source inspection"
    error_id: ERR_SEGREGATION_OF_DUTIES
    http_status: 403
    applies_to: "POST /inspections/{id}/qa-claim, POST /inspections/{id}/qa-decision, POST /load-ratings/{id}/approve, POST /federal-submissions/{id}/review, POST /critical-findings/{id}/impose-restriction"

  - priority: 13
    category: business_safety
    check: "The named team leader holds team_leader_certified and qualification_status == CURRENT, plus the type-specific certificate: underwater_diver_certified for UNDERWATER, fracture_critical_certified for FRACTURE_CRITICAL"
    error_id: ERR_TEAM_LEADER_NOT_QUALIFIED
    http_status: 422
    applies_to: "POST /bridges/{id}/inspections, POST /inspections/{id}/submit"

  - priority: 14
    category: business_safety
    check: "The QA reviewer holds team_leader_certified and qualification_status == CURRENT at the moment of the claim or decision"
    error_id: ERR_QA_REVIEWER_NOT_QUALIFIED
    http_status: 422
    applies_to: "POST /inspections/{id}/qa-claim, POST /inspections/{id}/qa-decision"

  - priority: 15
    category: business_safety
    check: "The engineer sealing a load rating or finalising a scour evaluation holds load_rating_engineer_licensed with a non-null pe_license_number and qualification_status == CURRENT"
    error_id: ERR_RATING_ENGINEER_NOT_LICENSED
    http_status: 422
    applies_to: "POST /load-ratings/{id}/seal, POST /scour-evaluations/{id}/finalize"

  - priority: 16
    category: business_safety
    check: "The requested inspection_type is applicable to the structure: UNDERWATER requires underwater_elements == true, FRACTURE_CRITICAL requires fracture_critical == true, and a scour evaluation requires spans_water == true"
    error_id: ERR_INSPECTION_TYPE_NOT_APPLICABLE
    http_status: 422
    applies_to: "POST /bridges/{id}/inspections, POST /bridges/{id}/scour-evaluations"

  - priority: 17
    category: business_constraint
    check: "An inspection being submitted has at least one ElementCondition row"
    error_id: ERR_NO_ELEMENT_CONDITIONS
    http_status: 422
    applies_to: "POST /inspections/{id}/submit"

  - priority: 18
    category: business_constraint
    check: "A ROUTINE inspection being submitted reports at least one element from each of DECK_GROUP, SUPERSTRUCTURE and SUBSTRUCTURE; a load rating's source inspection reports at least one SUPERSTRUCTURE element so condition_factor_phi_c is derivable"
    error_id: ERR_ELEMENT_GROUP_MISSING
    http_status: 422
    applies_to: "POST /inspections/{id}/submit, POST /bridges/{id}/load-ratings"

  - priority: 19
    category: business_constraint
    check: "Every ElementCondition of the inspection satisfies cs1_qty + cs2_qty + cs3_qty + cs4_qty == total_quantity"
    error_id: ERR_ELEMENT_QUANTITY_MISMATCH
    http_status: 422
    applies_to: "POST /inspections/{id}/submit"

  - priority: 20
    category: business_safety
    check: "Every ElementCondition of the inspection that reports cs3_qty + cs4_qty > 0 carries photo_count >= 1 and a non-empty defect_notes"
    error_id: ERR_PHOTO_DOCUMENTATION_MISSING
    http_status: 422
    applies_to: "POST /inspections/{id}/submit"

  - priority: 21
    category: business_referential
    check: "A critical finding's element_condition_id, when supplied, belongs to the finding's source_inspection_id, and that inspection belongs to the finding's bridge_id"
    error_id: ERR_ELEMENT_INSPECTION_MISMATCH
    http_status: 422
    applies_to: "POST /critical-findings"

  - priority: 22
    category: business_safety
    check: "A finding with severity IMMEDIATE names an element_condition_id whose cs4_qty > 0 - an immediate-danger finding must be anchored to a quantified CS4 defect"
    error_id: ERR_NO_CS4_DEFICIENCY
    http_status: 422
    applies_to: "POST /critical-findings"

  - priority: 23
    category: business_safety
    check: "restriction_action CLOSE requires severity == IMMEDIATE; a finding with severity URGENT may only be escalated to RESTRICT"
    error_id: ERR_SEVERITY_INSUFFICIENT_FOR_CLOSURE
    http_status: 422
    applies_to: "POST /critical-findings/{id}/impose-restriction"

  - priority: 24
    category: business_safety
    check: "The notification chain runs in tier order: the BRIDGE_OWNER tier must be notified before the FHWA tier, and neither tier may be notified twice"
    error_id: ERR_NOTIFICATION_SEQUENCE
    http_status: 409
    applies_to: "POST /critical-findings/{id}/notify"

  - priority: 25
    category: business_temporal
    check: "No non-VOIDED inspection on the same bridge has a field window within 72 hours of the requested window on either side (closed, buffer-inflated interval test)"
    error_id: ERR_BRIDGE_ACCESS_BUFFER_CONFLICT
    http_status: 409
    applies_to: "POST /bridges/{id}/inspections"

  - priority: 26
    category: business_temporal
    check: "The named team leader has no other non-VOIDED inspection whose half-open window [start, end) overlaps the requested window; exactly adjacent windows are permitted"
    error_id: ERR_TEAM_LEADER_WINDOW_CONFLICT
    http_status: 409
    applies_to: "POST /bridges/{id}/inspections"

  - priority: 27
    category: business_temporal
    check: "inspection_date falls inside the inspection's field window [field_window_start, field_window_end] and is not after the logical clock"
    error_id: ERR_INSPECTION_DATE_OUT_OF_WINDOW
    http_status: 422
    applies_to: "POST /inspections/{id}/submit"

  - priority: 28
    category: business_referential
    check: "A load rating's source_inspection_id names an Inspection with status ACCEPTED that belongs to the same bridge; approving a rating re-checks that its source inspection is still ACCEPTED"
    error_id: ERR_RATING_SOURCE_NOT_ACCEPTED
    http_status: 422
    applies_to: "POST /bridges/{id}/load-ratings, POST /load-ratings/{id}/approve"

  - priority: 29
    category: business_safety
    check: "No bridge in the inventory has poa_compliant == false - every SCOUR_CRITICAL structure needs an APPROVED plan of action before a federal submission may be sent"
    error_id: ERR_SCOUR_CRITICAL_POA_MISSING
    http_status: 422
    applies_to: "POST /federal-submissions/{id}/submit"

  - priority: 30
    category: business_constraint
    check: "The permit decision submitted equals the analysis-derived recommended_decision - an officer may not approve a move the analysis denied"
    error_id: ERR_PERMIT_DECISION_MISMATCH
    http_status: 422
    applies_to: "POST /permit-applications/{id}/decide"

  - priority: 31
    category: business_constraint
    check: "No other IDENTIFIED candidate in the same cycle outranks this one while still fitting inside remaining_cents (calculations.candidate_rank_gate)"
    error_id: ERR_HIGHER_PRIORITY_CANDIDATE_PENDING
    http_status: 409
    applies_to: "POST /project-candidates/{id}/program"

  - priority: 33
    category: business_fiscal
    check: "estimated_cost_cents <= ProgramCycle.remaining_cents (strict >, so a candidate consuming the exact residual is allowed)"
    error_id: ERR_BUDGET_EXCEEDED
    http_status: 422
    applies_to: "POST /project-candidates/{id}/program"

  - priority: 34
    category: business_fiscal
    check: "inspection_compliance_pct >= 90.00 before a federal submission may be ACCEPTED"
    error_id: ERR_COMPLIANCE_BELOW_THRESHOLD
    http_status: 422
    applies_to: "POST /federal-submissions/{id}/review"

  - priority: 35
    category: business_referential
    check: "A project candidate's bridge has at least one Inspection with status ACCEPTED, so condition data exists to rank it"
    error_id: ERR_BRIDGE_NOT_INSPECTED
    http_status: 422
    applies_to: "POST /program-cycles/{id}/candidates"

# =============================================================================
# §1.5 API Endpoint Table (api_prefix "/" - every path below is absolute)
# =============================================================================
endpoints:
  - method: POST
    path: "/_clock/set_current_utc"
    description: "Test-driving endpoint: sets the server's logical clock to an arbitrary UTC instant. Every deadline, interval, expiry, window and overdue test in this domain reads this clock, never wall-clock time. MANDATORY STARTUP DEFAULT: before any call to this endpoint the logical clock reads exactly 2026-08-01T00:00:00Z; it MUST NOT fall back to real wall-clock time."
    roles: [ProgramAdmin]
    code: 200
    input: [to_iso8601]
    output: { current_utc: datetime }
    side_effects:
      - "All subsequent qualification_status, notification_late, overdue-inspection and window comparisons evaluate against the new instant"
      - "No stored entity is mutated; derived fields are recomputed on read"

  - method: POST
    path: "/personnel"
    description: "Register an inspection or engineering staff member with their NBIS certifications"
    roles: [ProgramAdmin]
    code: 201
    input: ["full_name", "agency", "nbis_refresher_expiry_date", "team_leader_certified?", "underwater_diver_certified?", "fracture_critical_certified?", "load_rating_engineer_licensed?", "pe_license_number?"]
    output: Personnel
    side_effects:
      - "qualification_status derived from nbis_refresher_expiry_date against the logical clock"

  - method: GET
    path: "/personnel/{id}"
    description: "Read one staff member, including the currently derived qualification_status"
    roles: [ProgramAdmin, BridgeInspector, QaReviewer, RatingEngineer, DistrictEngineer, PermitOfficer, FhwaReviewer]
    code: 200
    input: []
    output: Personnel
    side_effects: []

  - method: GET
    path: "/personnel"
    description: "List staff, filterable by agency and certification"
    roles: [ProgramAdmin, BridgeInspector, QaReviewer, RatingEngineer, DistrictEngineer, PermitOfficer, FhwaReviewer]
    code: 200
    input: ["agency?", "team_leader_certified?", "load_rating_engineer_licensed?", "qualification_status?", "limit?", "offset?"]
    output: Personnel[]
    side_effects: []

  - method: POST
    path: "/bridges"
    description: "Add a structure to the NBI inventory. initial_* ratings seed the component ratings until the first inspection is accepted."
    roles: [ProgramAdmin]
    code: 201
    input: ["nbi_structure_number", "name", "owner_agency", "structure_type", "deck_area_sqm", "year_built", "adt", "detour_length_km", "spans_water?", "underwater_elements?", "fracture_critical?", "initial_deck_rating?", "initial_superstructure_rating?", "initial_substructure_rating?"]
    output: Bridge
    side_effects:
      - "min_nbi_rating derived from the seeded component ratings"
      - "inspection_interval_months and underwater_interval_months computed (calculations.inspection_interval_months)"
      - "next_inspection_due_date and next_underwater_due_date computed from the creation date"
      - "service_posture OPEN, scour_status NOT_EVALUATED, poa_compliant true"

  - method: GET
    path: "/bridges/{id}"
