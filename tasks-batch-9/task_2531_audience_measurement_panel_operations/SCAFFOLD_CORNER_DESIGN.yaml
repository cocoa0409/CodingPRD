      - name: design_denominator_excludes_a_retired_contributor
        claim_type: input_set_filtering
        grounds:
          - calculations.household_base_weight.variants.DESIGN
          - calculations.household_base_weight.variants.FINAL
          - validations[priority 40, 41]
        distinguishing_aspect: "Retiring the only contributing household AFTER the edit pass is the one way to empty the DESIGN denominator without emptying the run: contributing_household_count is a stored counter and still reads 1, so priority 40 passes and priority 41 is the rule that actually fires - while the FINAL denominator, which is deliberately not re-filtered on current status, still weights the retired household."
