            - call: "POST /licensing/audit-findings"
              payload: { audit_id: "${au_id}", report_id: "${r_id}", finding_type: UNDERREPORTED_BASE, audited_base_cents: 150000 }
              as: LicensingAnalyst
              captures: { f_short: $.data.shortfall_cents }
          assert:
            - "captured f_short == 2500 (7500 recomputed - 5000 recognized; report stayed ACCEPTED so it was NOT auto-referred)"
