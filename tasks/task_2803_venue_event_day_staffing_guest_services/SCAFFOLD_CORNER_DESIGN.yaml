              captures: { a5: $.data.id }
            - call: "POST /events/${ev_id}/lifecycle"
              payload: { target_status: "IN_PROGRESS" }
              as: GuestExperienceDirector
          trigger:
            - call: "POST /_clock/set_current_utc"
              payload: { current_utc: "2026-09-12T13:05:00Z" }
              as: StaffingCoordinator
            - call: "POST /staff-assignments/${a1}/attendance"
              payload: { action: "NO_SHOW" }
              as: StaffingCoordinator
            - call: "GET /staff-members/${m1}"
              as: StaffingCoordinator
              captures: { rel_1: $.data.reliability_score, status_1: $.data.status }
            - call: "POST /_clock/set_current_utc"
              payload: { current_utc: "2026-09-12T14:06:00Z" }
              as: StaffingCoordinator
            - call: "POST /staff-assignments/${a2}/attendance"
