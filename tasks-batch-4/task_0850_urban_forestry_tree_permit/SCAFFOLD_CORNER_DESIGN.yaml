            - call: "POST /forestry/permits"
              payload: { tree_id: "${t20}", permit_type: "REMOVAL", reason: "decay" }
              as: Applicant
              as_user_id: "applicant-1"
              captures: { p: $.data.id }
            - call: "POST /forestry/permits/${p}/submit"
              payload: {}
              as: Applicant
              as_user_id: "applicant-1"
            - call: "POST /forestry/permits/${p}/review"
