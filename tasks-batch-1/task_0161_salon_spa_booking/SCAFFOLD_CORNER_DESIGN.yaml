      - name: error_client_not_bookable_excluded
        claim_type: violation_to_error
        grounds:
          - errors[ERR_CLIENT_NOT_BOOKABLE]
        excluded_because:
          difficulty_instance: cross_entity_state_dependency / suspended_client_self_book_rejected_pair_appointment_client
          rationale: "ERR_CLIENT_NOT_BOOKABLE triggered by the named §1.8 instance."

  # =========================================================================
  # RBAC — peer-role denials.
  # =========================================================================
  - section: rbac
    instances:
      - name: frontdesk_cannot_create_service_returns_forbidden
        claim_type: peer_roles
        grounds:
          - roles
          - errors[ERR_FORBIDDEN]
        distinguishing_aspect: "FrontDesk POSTing /services (a SalonOwner-exclusive catalog op) returns ERR_FORBIDDEN (403)."
        test_recipe:
          setup:
            - "A salon exists."
          setup_api_calls:
            - call: "POST /salons"
              payload: { name: "S" }
              as: SalonOwner
              captures: { sid: $.data.id }
          trigger:
            - call: "POST /services"
              payload: { salon_id: "${sid}", name: "Cut", duration_minutes: 30, base_price_cents: 5000 }
              as: FrontDesk
              captures: { err: $.data.error_id }
          assert:
            - "response.status == 403"
            - "response.data.error_id == ERR_FORBIDDEN"

      - name: stylist_cannot_book_appointment_returns_forbidden
        claim_type: peer_roles
        grounds:
          - roles
          - errors[ERR_FORBIDDEN]
        distinguishing_aspect: "A Stylist (read-only role) POSTing /appointments returns ERR_FORBIDDEN (403)."
        test_recipe:
          setup:
            - "Salon, stylist (the acting role), chair, service base 5000 deposit 0, client, clock 12:00."
          setup_api_calls:
            - call: "POST /salons"
              payload: { name: "S" }
              as: SalonOwner
              captures: { sid: $.data.id, salon_v0: $.data.version }
            - call: "POST /stylists"
              payload: { salon_id: "${sid}", full_name: "S1", compensation_model: "COMMISSION", buffer_minutes: 0 }
              as: SalonOwner
              captures: { st1: $.data.id, st1_v0: $.data.version }
            - call: "POST /resources"
              payload: { salon_id: "${sid}", label: "Chair A", resource_type: "CHAIR" }
              as: SalonOwner
              captures: { chA: $.data.id }
            - call: "POST /services"
              payload: { salon_id: "${sid}", name: "Cut", duration_minutes: 30, base_price_cents: 5000, deposit_pct: 0.0, requires_room: false }
              as: SalonOwner
              captures: { svc: $.data.id }
            - call: "POST /clients"
              payload: { salon_id: "${sid}", full_name: "C1", email: "sb@x.com" }
              as: FrontDesk
              captures: { cli: $.data.id }
            - call: "POST /salons/${sid}/_clock/advance"
              payload: { to_iso8601: "2026-07-01T12:00:00Z", expected_salon_version: "${salon_v0}" }
              as: SalonOwner
          trigger:
            - call: "POST /appointments"
              payload: { salon_id: "${sid}", client_id: "${cli}", stylist_id: "${st1}", resource_id: "${chA}", service_id: "${svc}", start_utc: "2026-07-01T13:00:00Z", expected_stylist_version: "${st1_v0}" }
              as: Stylist
              as_user_id: "${st1}"
              captures: { err: $.data.error_id }
          assert:
            - "response.status == 403"
            - "response.data.error_id == ERR_FORBIDDEN"

      - name: frontdesk_cannot_void_checkout_returns_forbidden
        claim_type: peer_roles
        grounds:
          - roles
          - errors[ERR_FORBIDDEN]
        distinguishing_aspect: "FrontDesk POSTing /checkouts/{id}/void (a SalonOwner-exclusive op) returns ERR_FORBIDDEN (403); checkout stays SETTLED."
        test_recipe:
          setup:
            - "Salon, stylist buffer 0, chair, service base 6000 deposit 0, client, clock 14:00, appointment at 13:00 completed (checkout SETTLED)."
          setup_api_calls:
            - call: "POST /salons"
              payload: { name: "S", no_show_fee_pct: 0.0 }
              as: SalonOwner
              captures: { sid: $.data.id, salon_v0: $.data.version }
            - call: "POST /stylists"
              payload: { salon_id: "${sid}", full_name: "S1", compensation_model: "COMMISSION", buffer_minutes: 0 }
              as: SalonOwner
              captures: { st1: $.data.id, st1_v0: $.data.version }
            - call: "POST /resources"
              payload: { salon_id: "${sid}", label: "Chair A", resource_type: "CHAIR" }
              as: SalonOwner
              captures: { chA: $.data.id }
            - call: "POST /services"
              payload: { salon_id: "${sid}", name: "Cut", duration_minutes: 30, base_price_cents: 6000, deposit_pct: 0.0, requires_room: false }
              as: SalonOwner
              captures: { svc: $.data.id }
            - call: "POST /clients"
              payload: { salon_id: "${sid}", full_name: "C1", email: "fv@x.com" }
              as: FrontDesk
              captures: { cli: $.data.id }
            - call: "POST /salons/${sid}/_clock/advance"
              payload: { to_iso8601: "2026-07-01T12:00:00Z", expected_salon_version: "${salon_v0}" }
              as: SalonOwner
              captures: { salon_v1: $.data.version }
            - call: "POST /appointments"
              payload: { salon_id: "${sid}", client_id: "${cli}", stylist_id: "${st1}", resource_id: "${chA}", service_id: "${svc}", start_utc: "2026-07-01T13:00:00Z", expected_stylist_version: "${st1_v0}" }
              as: FrontDesk
              captures: { appt: $.data.id }
            - call: "POST /salons/${sid}/_clock/advance"
              payload: { to_iso8601: "2026-07-01T14:00:00Z", expected_salon_version: "${salon_v1}" }
              as: SalonOwner
            - call: "POST /checkouts"
              payload: { appointment_id: "${appt}", tip_cents: 0 }
              as: FrontDesk
              captures: { co: $.data.id }
          trigger:
            - call: "POST /checkouts/${co}/void"
              payload: {}
              as: FrontDesk
              captures: { err: $.data.error_id }
          assert:
            - "response.status == 403"
            - "response.data.error_id == ERR_FORBIDDEN"
            - "Checkout.${co}.status == SETTLED"

      - name: missing_auth_headers_returns_unauthenticated
        claim_type: peer_roles
        grounds:
          - validations[priority=1]
          - errors[ERR_UNAUTHENTICATED]
        distinguishing_aspect: "A request with an unknown/blank X-User-Role returns ERR_UNAUTHENTICATED (401)."
        test_recipe:
          setup:
            - "A salon exists."
          setup_api_calls:
            - call: "POST /salons"
              payload: { name: "S" }
              as: SalonOwner
              captures: { sid: $.data.id }
          trigger:
            - call: "GET /salons/${sid}"
              payload: {}
              as: Nobody
              captures: { err: $.data.error_id }
          assert:
            - "response.status == 401"
            - "response.data.error_id == ERR_UNAUTHENTICATED"

  # =========================================================================
  # Cross-Cutting Complexity Layers — OCC happy path, derived-field reconcile.
  # =========================================================================
  - section: cross_cutting_complexity_layers
    instances:
      - name: occ_correct_stylist_version_succeeds
        claim_type: optimistic_concurrency
        grounds:
          - concurrency_rules[booking-create-stale-stylist]
          - entities.Stylist.fields.version
        distinguishing_aspect: "Booking with the current expected_stylist_version succeeds (201) and increments Stylist.version from 1 to 2."
        test_recipe:
          setup:
            - "Salon, one stylist buffer 0 (version 1), chair, service base 5000 deposit 0, client, clock 12:00."
          setup_api_calls:
            - call: "POST /salons"
              payload: { name: "S" }
              as: SalonOwner
              captures: { sid: $.data.id, salon_v0: $.data.version }
            - call: "POST /stylists"
              payload: { salon_id: "${sid}", full_name: "S1", compensation_model: "COMMISSION", buffer_minutes: 0 }
              as: SalonOwner
              captures: { st1: $.data.id, st1_v0: $.data.version }
            - call: "POST /resources"
              payload: { salon_id: "${sid}", label: "Chair A", resource_type: "CHAIR" }
              as: SalonOwner
              captures: { chA: $.data.id }
            - call: "POST /services"
              payload: { salon_id: "${sid}", name: "Cut", duration_minutes: 30, base_price_cents: 5000, deposit_pct: 0.0, requires_room: false }
              as: SalonOwner
              captures: { svc: $.data.id }
            - call: "POST /clients"
              payload: { salon_id: "${sid}", full_name: "C1", email: "ok@x.com" }
              as: FrontDesk
              captures: { cli: $.data.id }
            - call: "POST /salons/${sid}/_clock/advance"
              payload: { to_iso8601: "2026-07-01T12:00:00Z", expected_salon_version: "${salon_v0}" }
              as: SalonOwner
          trigger:
            - call: "POST /appointments"
              payload: { salon_id: "${sid}", client_id: "${cli}", stylist_id: "${st1}", resource_id: "${chA}", service_id: "${svc}", start_utc: "2026-07-01T13:00:00Z", expected_stylist_version: "${st1_v0}" }
              as: FrontDesk
              captures: { appt: $.data.id }
            - call: "GET /stylists/${st1}"
              payload: {}
              as: FrontDesk
              captures: { st1_v_after: $.data.version }
          assert:
            - "response.status == 201"
            - "${st1_v_after} == 2"

      - name: wallet_credit_reconciles_after_noshow_partial_forfeit
        claim_type: derived_field_reconciliation
        grounds:
          - entities.Client.fields.wallet_credit_cents
          - state_machines.Appointment.BOOKED_to_NO_SHOW
          - entities.Salon.fields.no_show_fee_pct
        distinguishing_aspect: "With deposit 5000 (deposit_pct 0.5 on 10000) and no_show_fee_pct 0.30, a no-show forfeits round_half_up(10000*0.30)=3000 and refunds 5000-3000=2000 to wallet_credit_cents."
        test_recipe:
          setup:
            - "Salon no_show_fee_pct 0.30 threshold 3, stylist buffer 0, chair, service base 10000 deposit 0.5, client, clock 13:30, appointment at 13:00 (started)."
          setup_api_calls:
            - call: "POST /salons"
              payload: { name: "S", no_show_fee_pct: 0.30, no_show_suspend_threshold: 3 }
              as: SalonOwner
              captures: { sid: $.data.id, salon_v0: $.data.version }
            - call: "POST /stylists"
              payload: { salon_id: "${sid}", full_name: "S1", compensation_model: "COMMISSION", buffer_minutes: 0 }
              as: SalonOwner
              captures: { st1: $.data.id, st1_v0: $.data.version }
            - call: "POST /resources"
              payload: { salon_id: "${sid}", label: "Chair A", resource_type: "CHAIR" }
              as: SalonOwner
              captures: { chA: $.data.id }
            - call: "POST /services"
              payload: { salon_id: "${sid}", name: "Color", duration_minutes: 60, base_price_cents: 10000, deposit_pct: 0.5, requires_room: false }
              as: SalonOwner
              captures: { svc: $.data.id }
            - call: "POST /clients"
              payload: { salon_id: "${sid}", full_name: "C1", email: "wc@x.com" }
              as: FrontDesk
              captures: { cli: $.data.id }
            - call: "POST /salons/${sid}/_clock/advance"
              payload: { to_iso8601: "2026-07-01T12:00:00Z", expected_salon_version: "${salon_v0}" }
              as: SalonOwner
              captures: { salon_v1: $.data.version }
            - call: "POST /appointments"
              payload: { salon_id: "${sid}", client_id: "${cli}", stylist_id: "${st1}", resource_id: "${chA}", service_id: "${svc}", start_utc: "2026-07-01T13:00:00Z", expected_stylist_version: "${st1_v0}" }
              as: FrontDesk
              captures: { appt: $.data.id }
            - call: "POST /salons/${sid}/_clock/advance"
              payload: { to_iso8601: "2026-07-01T13:30:00Z", expected_salon_version: "${salon_v1}" }
              as: SalonOwner
          trigger:
            - call: "POST /appointments/${appt}/no-show"
              payload: {}
              as: FrontDesk
          assert:
            - "Appointment.${appt}.deposit_held_cents == 5000"
            - "Client.${cli}.wallet_credit_cents == 2000"
            - "Client.${cli}.no_show_strikes == 1"

      - name: occ_stale_salon_version_excluded
        claim_type: optimistic_concurrency
        grounds:
          - concurrency_rules[clock-advance-stale-salon]
        excluded_because:
          difficulty_instance: compensating_invariant / void_conserves_product_inventory_units
          rationale: "Stale-salon-version 412 is exercised as a negative-path error elsewhere; the canonical stale-salon trigger is asserted in errors/clock_advance_stale_salon_version_returns_412."

  # =========================================================================
  # Consistency Model — immediate visibility of cascades.
  # =========================================================================
  - section: consistency_model
    instances:
      - name: checkout_cascade_visible_in_same_request
        claim_type: immediate
        grounds:
          - state_machines.Appointment.BOOKED_to_COMPLETED
          - entities.PackagePurchase.fields.sessions_remaining
        distinguishing_aspect: "A package-redeeming checkout's response is created, and an immediate GET of the package-purchase shows sessions_remaining already decremented (4 -> 3) in the same synchronous flow."
        test_recipe:
          setup:
            - "Salon, stylist buffer 0, chair, service base 9000 deposit 0, package 4 sessions price 24000, client buys it, clock 14:00, package appointment at 13:00."
          setup_api_calls:
            - call: "POST /salons"
              payload: { name: "S", no_show_fee_pct: 0.0 }
              as: SalonOwner
              captures: { sid: $.data.id, salon_v0: $.data.version }
            - call: "POST /stylists"
              payload: { salon_id: "${sid}", full_name: "S1", compensation_model: "COMMISSION", buffer_minutes: 0 }
              as: SalonOwner
              captures: { st1: $.data.id, st1_v0: $.data.version }
            - call: "POST /resources"
              payload: { salon_id: "${sid}", label: "Chair A", resource_type: "CHAIR" }
              as: SalonOwner
              captures: { chA: $.data.id }
            - call: "POST /services"
              payload: { salon_id: "${sid}", name: "Facial", duration_minutes: 45, base_price_cents: 9000, deposit_pct: 0.0, requires_room: false }
              as: SalonOwner
              captures: { svc: $.data.id }
            - call: "POST /packages"
              payload: { salon_id: "${sid}", service_id: "${svc}", session_count: 4, price_cents: 24000 }
              as: SalonOwner
              captures: { pkg: $.data.id }
            - call: "POST /clients"
              payload: { salon_id: "${sid}", full_name: "C1", email: "im@x.com" }
              as: FrontDesk
              captures: { cli: $.data.id }
            - call: "POST /package-purchases"
              payload: { client_id: "${cli}", package_id: "${pkg}" }
              as: FrontDesk
              captures: { pp: $.data.id }
            - call: "POST /salons/${sid}/_clock/advance"
              payload: { to_iso8601: "2026-07-01T12:00:00Z", expected_salon_version: "${salon_v0}" }
              as: SalonOwner
              captures: { salon_v1: $.data.version }
            - call: "POST /appointments"
              payload: { salon_id: "${sid}", client_id: "${cli}", stylist_id: "${st1}", resource_id: "${chA}", service_id: "${svc}", start_utc: "2026-07-01T13:00:00Z", expected_stylist_version: "${st1_v0}", package_purchase_id: "${pp}" }
              as: FrontDesk
              captures: { appt: $.data.id }
            - call: "POST /salons/${sid}/_clock/advance"
              payload: { to_iso8601: "2026-07-01T14:00:00Z", expected_salon_version: "${salon_v1}" }
              as: SalonOwner
          trigger:
            - call: "POST /checkouts"
              payload: { appointment_id: "${appt}", tip_cents: 0 }
              as: FrontDesk
              captures: { co: $.data.id }
            - call: "GET /package-purchases/${pp}"
              payload: {}
              as: FrontDesk
              captures: { sessions_now: $.data.sessions_remaining }
          assert:
            - "${sessions_now} == 3"
            - "PackagePurchase.${pp}.status == ACTIVE"
