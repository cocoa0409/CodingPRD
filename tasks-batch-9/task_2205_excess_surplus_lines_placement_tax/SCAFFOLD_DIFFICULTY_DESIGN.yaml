              captures: { placement_id: $.data.id }
            - &c_begin_search
              call: "POST /placements/${placement_id}/begin-search"
              payload: {}
              as: PlacementBroker
              as_user_id: "${broker_id}"
            - &c_decl_1
              call: "POST /placements/${placement_id}/declinations"
              payload: { admitted_carrier_name: "Republic Admitted Mutual", state_code: "TX", reason_code: "NO_APPETITE", declined_on: "2026-07-10T00:00:00Z" }
              as: PlacementBroker
              as_user_id: "${broker_id}"
            - &c_decl_2
              call: "POST /placements/${placement_id}/declinations"
              payload: { admitted_carrier_name: "Pecos Standard Insurance", state_code: "TX", reason_code: "CAPACITY", declined_on: "2026-07-12T00:00:00Z" }
              as: PlacementBroker
              as_user_id: "${broker_id}"
            - &c_decl_3
