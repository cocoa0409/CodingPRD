            - { call: "POST /programs", payload: { name: "DupStmt" }, as: JobberAdmin, captures: { prog: "$.data.id" } }
            - { call: "POST /stores", payload: { name: "DSStore2", store_code: "DS2", total_facings: 50 }, as: JobberAdmin, captures: { store: "$.data.id" } }
            - { call: "POST /agreements", payload: { program_id: "${prog}", store_id: "${store}", base_margin_pct: 0.25, shrink_retailer_share_pct: 0.5, restock_value_cap_cents: 50000 }, as: JobberAdmin, captures: { agr: "$.data.id" } }
            - { call: "POST /agreements/${agr}/submit", payload: {}, as: JobberAdmin }
            - { call: "POST /agreements/${agr}/accept", payload: {}, as: RetailerManager, as_user_id: "${store}" }
            - { call: "POST /settlement-statements", payload: { store_agreement_id: "${agr}", period_index: 0 }, as: JobberFinance, as_user_id: "fin-1" }
          trigger:
            - { call: "POST /settlement-statements", payload: { store_agreement_id: "${agr}", period_index: 0 }, as: JobberFinance, as_user_id: "fin-1", captures: { err: "$.data.error_id" } }
          assert:
            - "err == ERR_SETTLEMENT_ALREADY_EXISTS (http 409)"

      - name: settlement_period_not_closed_rejected
        claim_type: temporal_validation
        grounds: ["validations[priority=16]", "errors[ERR_SETTLEMENT_PERIOD_NOT_CLOSED]"]
        distinguishing_aspect: "Finalize while the logical clock is still inside the period window is rejected even with a fresh OCC version."
        test_recipe:
