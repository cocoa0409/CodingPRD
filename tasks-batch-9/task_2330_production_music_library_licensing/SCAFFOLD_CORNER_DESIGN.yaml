      - name: statement_period_overlap_and_no_activity_rules_enforced
        claim_type: aggregate_validation
        grounds:
          - validations[priority=45].statement_period_no_overlap
          - validations[priority=46].statement_has_activity
          - errors[ERR_STATEMENT_PERIOD_OVERLAP]
          - errors[ERR_STATEMENT_NO_ACTIVITY]
        distinguishing_aspect: |
          The overlap rule is exercised with a window that only partially overlaps an existing statement
          (2026-08-15 falls inside 2026-08-01..2026-08-31) rather than an exact repeat, and the
          no-activity rule is shown to be a finalize-time gate rather than a create-time one: the empty
          window still yields a DRAFT statement, which only fails when finalization is attempted.
        test_recipe:
          setup:
            - "One composer with tax_withholding_pct 0.30 and a single manual ADJUSTMENT of 40000 recognised at the initial clock."
          setup_api_calls:
            - call: "POST /music-library/composers"
              payload: { display_name: "Nadia Okoro", pro_affiliation: "ASCAP", payee_country: "US", tax_withholding_pct: 0.30 }
              as: CatalogAdmin
              captures: { c1: $.data.id }
            - call: "POST /music-library/royalty-ledger-entries"
              payload: { composer_id: "${c1}", source_type: "ADJUSTMENT", amount_cents: 40000, memo: "Library-wide catalogue bonus" }
              as: RoyaltyAccountant
            - call: "GET /music-library/composers/${c1}"
              payload: {}
              as: RoyaltyAccountant
              captures: { c1_v: $.data.version }
          trigger:
            - call: "POST /music-library/royalty-statements"
              payload: { composer_id: "${c1}", period_start: "2026-08-01T00:00:00Z", period_end: "2026-08-31T00:00:00Z", basis: "ACCRUAL", expected_composer_version: "${c1_v}" }
              as: RoyaltyAccountant
              captures: { st1: $.data.id }
            - call: "GET /music-library/composers/${c1}"
              payload: {}
              as: RoyaltyAccountant
              captures: { c1_v2: $.data.version }
            - call: "POST /music-library/royalty-statements"
              payload: { composer_id: "${c1}", period_start: "2026-08-15T00:00:00Z", period_end: "2026-09-15T00:00:00Z", basis: "ACCRUAL", expected_composer_version: "${c1_v2}" }
              as: RoyaltyAccountant
            - call: "POST /music-library/royalty-statements"
              payload: { composer_id: "${c1}", period_start: "2026-10-01T00:00:00Z", period_end: "2026-10-31T00:00:00Z", basis: "ACCRUAL", expected_composer_version: "${c1_v2}" }
              as: RoyaltyAccountant
              captures: { st2: $.data.id }
            - call: "POST /music-library/royalty-statements/${st2}/finalize"
              payload: {}
              as: RoyaltyAccountant
            - call: "POST /music-library/royalty-statements/${st1}/finalize"
              payload: {}
              as: RoyaltyAccountant
            - call: "GET /music-library/royalty-statements?composer_id=${c1}"
              payload: { composer_id: "${c1}" }
              as: RoyaltyAccountant
          assert:
            - "Call 1 → 201 with gross_cents 40000, recouped_cents 0, withholding_cents 12000 (40000 * 0.30), net_payable_cents 28000, line_count 1, payout_status \"PAYABLE\" and status \"DRAFT\""
            - "Call 3 → 409 with data.error_id == \"ERR_STATEMENT_PERIOD_OVERLAP\" (2026-08-15..2026-09-15 partially overlaps ${st1}'s inclusive window) and no statement row is created"
            - "Call 4 → 201 with gross_cents 0, line_count 0, net_payable_cents 0, payout_status \"NO_ACTIVITY\" and status \"DRAFT\" — the empty window is created, not refused"
            - "Call 5 → 409 with data.error_id == \"ERR_STATEMENT_NO_ACTIVITY\" and RoyaltyStatement.${st2}.status stays \"DRAFT\""
            - "Call 6 → 200 with status \"FINALIZED\" (the same finalize endpoint succeeds on the statement that has activity)"
            - "Call 7 → total_count 2"

