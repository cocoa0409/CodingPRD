            - call: "POST /products"
              payload: { sku: "SKU-V93B", product_name: "Void Allowed Widget", product_category: "CONSUMER_GOOD", distribution_channels: ["RETAIL"], label_area_sq_in: 10.0, annual_units: 4000 }
              as: RegistryAdmin
              captures: { prod_b: $.data.id }
            - call: "POST /notices"
              payload: { product_id: "${prod_b}", chemical_id: "${chem_bz}", noticing_party_name: "Coastal Watch Alliance", noticing_party_type: "PRIVATE_PARTY", alleged_violation_type: "FAILURE_TO_WARN", alleged_units: 4000, earliest_violation_date: "2026-05-01T00:00:00Z", served_at: "2026-07-01T00:00:00Z" }
              as: RegulatoryCounsel
              as_user_id: "rc_1"
              captures: { notice_b: $.data.id }
            - call: "POST /notices/${notice_b}/transitions"
              payload: { action: "EVALUATE" }
              as: RegulatoryCounsel
              as_user_id: "rc_1"
            - call: "POST /notices/${notice_b}/transitions"
              payload: { action: "ESCALATE" }
              as: RegulatoryCounsel
              as_user_id: "rc_1"
            - call: "GET /notices/${notice_b}"
              payload: {}
              as: RegulatoryCounsel
              captures: { nv_b: $.data.version }
            - call: "POST /notices/${notice_b}/settlements"
              payload: { requested_attorney_fees_cents: 500000, reformulation_commitment: true, expected_notice_version: "${nv_b}" }
              as: RegulatoryCounsel
              as_user_id: "rc_1"
              captures: { stl_b: $.data.id }
            - call: "POST /settlements/${stl_b}/transitions"
              payload: { action: "ACCEPT_EXECUTE" }
              as: RegulatoryCounsel
              as_user_id: "rc_2"
          trigger:
            - call: "POST /settlements/${stl_a}/transitions"
              payload: { action: "VOID" }
              as: RegulatoryCounsel
              as_user_id: "rc_1"
            - call: "POST /settlements/${stl_b}/transitions"
              payload: { action: "VOID" }
              as: RegulatoryCounsel
              as_user_id: "rc_1"
          assert:
            - "ReformulationProject.${rp_1}.baseline_daily_exposure_ug == 100.000 (800.0 x 0.25 x 0.5 x 1.00 ORAL absorption), verified_daily_exposure_ug == 1.000, reduction_pct == 99.00 and status == COMPLETED"
            - "MaterialChemical.${link_1}.declared_concentration_ppm == 8.0 with measurement_basis SUPPLIER_DECLARED and status DECLARED after SUBMIT_VERIFICATION, and ExposureAssessment.${asmt_1}.status == SUPERSEDED"
            - "Settlement.${stl_a}: violation_days == 92, base_penalty_cents == 2000000, mitigation_factor == 0.7500 (reformulation commitment only - the supplier has no warranty), adjusted_penalty_cents == 1500000, fee_cap_cents == 900000, allowed_fees_cents == 500000, state_share_cents == 1125000, noticing_party_share_cents == 375000, total_settlement_cents == 2000000"
            - "before the triggers: Settlement.${stl_a}.status == EXECUTED and Product.${prod_a}.accrued_penalty_cents == 1500000"
            - "first trigger call: HTTP 409 with error_id ERR_SETTLEMENT_NOT_VOIDABLE; Settlement.${stl_a}.status is still EXECUTED and Product.${prod_a}.accrued_penalty_cents is still 1500000 (no partial unwind)"
            - "Settlement.${stl_b} carries the identical money (adjusted_penalty_cents 1500000, total_settlement_cents 2000000) and reformulation_commitment true"
            - "second trigger call: HTTP 200 - no COMPLETED ReformulationProject exists for ${prod_b}, so the commitment flag alone does not block the unwind - with Settlement.${stl_b}.status == VOID, Product.${prod_b}.accrued_penalty_cents == 0, open_notice_count == 1 and NoticeOfViolation.${notice_b}.status == SETTLEMENT_NEGOTIATION"
            - "GET /reformulation-projects?product_id=${prod_b} returns total_count == 0"

  # ===========================================================================
  # SECTION 5 - endpoints  (52 declared; every side_effect list needs a witness)
  # ===========================================================================
  - section: endpoints
    instances:

      - name: ep_component_create_supersede_is_conditional_on_supersedes_component_id
        claim_type: conditional_action
        grounds:
          - endpoints[POST /products/{product_id}/components]
          - state_machines.ProductComponent.ACTIVE_to_SUPERSEDED
          - validations[priority=22]
        distinguishing_aspect: |
          The same create endpoint behaves in two different ways depending on one optional field.
          Without supersedes_component_id a second component for the same material collides with the
          ACTIVE-scoped uniqueness rule (ERR_DUPLICATE_RESOURCE); with it, the named row is moved to
          SUPERSEDED *before* the uniqueness check runs, so the create succeeds and the load is
          recomputed from the new quantity only. An implementation that ran the uniqueness check first
          would reject both forms.
        test_recipe:
          setup:
            - "Bisphenol A is LISTED; material RM-EP1 (supplier Northgate, disclosure VERIFIED) declares 20.0 ppm."
            - "Product SKU-EP1 has one ACTIVE component of RM-EP1 at 0.5 g/unit."
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { current_utc: "2026-08-01T00:00:00Z" }
              as: RegistryAdmin
            - call: "POST /listed-chemicals"
              payload: { chemical_name: "Bisphenol A", cas_number: "80-05-7", endpoint_type: "REPRODUCTIVE_FEMALE", safe_harbor_basis: "MADL", safe_harbor_level_ug_per_day: 0.5 }
              as: RegistryAdmin
              captures: { chem_bpa: $.data.id }
            - call: "POST /listed-chemicals/${chem_bpa}/transitions"
              payload: { action: "LIST", listing_effective_date: "2026-01-01T00:00:00Z" }
              as: RegistryAdmin
            - call: "POST /suppliers"
              payload: { legal_name: "Northgate Polymers", contact_email: "qa@northgate.example" }
              as: ComplianceAnalyst
              captures: { sup_1: $.data.id }
            - call: "POST /materials"
              payload: { material_code: "RM-EP1", material_class: "RAW_MATERIAL", supplier_id: "${sup_1}" }
              as: ComplianceAnalyst
              captures: { mat_1: $.data.id }
            - call: "POST /materials/${mat_1}/chemicals"
              payload: { chemical_id: "${chem_bpa}", declared_concentration_ppm: 20.0 }
              as: ComplianceAnalyst
            - call: "POST /materials/${mat_1}/disclosure"
              payload: { action: "REQUEST" }
              as: ComplianceAnalyst
            - call: "POST /materials/${mat_1}/disclosure"
              payload: { action: "RECORD_RESPONSE", response_completeness: "COMPLETE" }
              as: ComplianceAnalyst
            - call: "POST /materials/${mat_1}/disclosure"
              payload: { action: "VERIFY" }
              as: ComplianceAnalyst
            - call: "POST /products"
              payload: { sku: "SKU-EP1", product_name: "Endpoint Widget One", product_category: "CONSUMER_GOOD", distribution_channels: ["RETAIL"], label_area_sq_in: 10.0, annual_units: 1000 }
              as: RegistryAdmin
              captures: { prod_1: $.data.id }
            - call: "POST /products/${prod_1}/components"
              payload: { material_id: "${mat_1}", quantity_grams_per_unit: 0.5, contact_factor: 1.0 }
              as: ComplianceAnalyst
              captures: { comp_a: $.data.id }
          trigger:
            - call: "POST /products/${prod_1}/components"
              payload: { material_id: "${mat_1}", quantity_grams_per_unit: 0.75, contact_factor: 1.0 }
              as: ComplianceAnalyst
            - call: "POST /products/${prod_1}/components"
              payload: { material_id: "${mat_1}", quantity_grams_per_unit: 0.25, contact_factor: 1.0, supersedes_component_id: "${comp_a}" }
              as: ComplianceAnalyst
              captures: { comp_b: $.data.id }
            - call: "POST /product-components/${comp_b}/transitions"
              payload: { action: "REMOVE" }
              as: ComplianceAnalyst
          assert:
            - "after setup: Product.${prod_1}.total_listed_chemical_load_ug == 10.000 (20.0 x 0.5)"
            - "first trigger call: HTTP 409 with error_id ERR_DUPLICATE_RESOURCE and Product.${prod_1}.total_listed_chemical_load_ug still 10.000"
            - "second trigger call: HTTP 201 with ProductComponent.${comp_b}.status == ACTIVE and ProductComponent.${comp_a}.status == SUPERSEDED"
            - "after the second trigger call: Product.${prod_1}.total_listed_chemical_load_ug == 5.000 - the SUPERSEDED row contributes nothing"
            - "GET /product-components?product_id=${prod_1} returns total_count == 2, and adding &status=ACTIVE returns total_count == 1"
            - "third trigger call: HTTP 200 with ProductComponent.${comp_b}.status == REMOVED, Product.${prod_1}.total_listed_chemical_load_ug == 0.000 and compliance_posture == EXPOSURE_UNKNOWN (last ACTIVE component gone)"
            - "Product.${prod_1}.version increased by exactly 2 across the three trigger calls (the rejected create does not bump it)"

      - name: ep_material_reparent_recomputes_descendant_depth_and_product_load
        claim_type: standard_crud
        grounds:
          - endpoints[PATCH /materials/{material_id}]
          - calculations.effective_concentration_ppm
          - calculations.total_listed_chemical_load_ug
        distinguishing_aspect: |
          A PATCH that only moves one material has effects two hops away: the moved material's own
          descendant is re-depthed, and the product that reaches the *old* parent loses the whole
          moved subtree from its roll-up. The load drops from 12.200 to 10.000 - which is only correct
          if the roll-up is recomputed post-order from the new tree rather than cached per material.
        test_recipe:
          setup:
            - "Bisphenol A is LISTED. RA is a root material declaring 100.0 ppm; C is RA's child at parent_mass_fraction 0.5 declaring 40.0 ppm; G is C's child at parent_mass_fraction 0.5 declaring 8.0 ppm. RB is a second root and RB1 is RB's child at fraction 0.5. All five are disclosure VERIFIED."
            - "Product SKU-EP2 has one ACTIVE component of RA at 0.1 g/unit."
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { current_utc: "2026-08-01T00:00:00Z" }
              as: RegistryAdmin
            - call: "POST /listed-chemicals"
              payload: { chemical_name: "Bisphenol A", cas_number: "80-05-7", endpoint_type: "REPRODUCTIVE_FEMALE", safe_harbor_basis: "MADL", safe_harbor_level_ug_per_day: 0.5 }
              as: RegistryAdmin
              captures: { chem_bpa: $.data.id }
            - call: "POST /listed-chemicals/${chem_bpa}/transitions"
              payload: { action: "LIST", listing_effective_date: "2026-01-01T00:00:00Z" }
              as: RegistryAdmin
            - call: "POST /suppliers"
              payload: { legal_name: "Northgate Polymers", contact_email: "qa@northgate.example" }
              as: ComplianceAnalyst
              captures: { sup_1: $.data.id }
            - call: "POST /materials"
              payload: { material_code: "RA", material_class: "RAW_MATERIAL", supplier_id: "${sup_1}" }
              as: ComplianceAnalyst
              captures: { mat_ra: $.data.id }
            - call: "POST /materials"
              payload: { material_code: "C", material_class: "RAW_MATERIAL", supplier_id: "${sup_1}", parent_material_id: "${mat_ra}", parent_mass_fraction: 0.5 }
              as: ComplianceAnalyst
              captures: { mat_c: $.data.id }
            - call: "POST /materials"
              payload: { material_code: "G", material_class: "RAW_MATERIAL", supplier_id: "${sup_1}", parent_material_id: "${mat_c}", parent_mass_fraction: 0.5 }
              as: ComplianceAnalyst
              captures: { mat_g: $.data.id }
            - call: "POST /materials"
              payload: { material_code: "RB", material_class: "PACKAGING", supplier_id: "${sup_1}" }
              as: ComplianceAnalyst
              captures: { mat_rb: $.data.id }
            - call: "POST /materials"
              payload: { material_code: "RB1", material_class: "PACKAGING", supplier_id: "${sup_1}", parent_material_id: "${mat_rb}", parent_mass_fraction: 0.5 }
              as: ComplianceAnalyst
              captures: { mat_rb1: $.data.id }
            - call: "POST /materials/${mat_ra}/chemicals"
              payload: { chemical_id: "${chem_bpa}", declared_concentration_ppm: 100.0 }
              as: ComplianceAnalyst
            - call: "POST /materials/${mat_c}/chemicals"
              payload: { chemical_id: "${chem_bpa}", declared_concentration_ppm: 40.0 }
              as: ComplianceAnalyst
            - call: "POST /materials/${mat_g}/chemicals"
              payload: { chemical_id: "${chem_bpa}", declared_concentration_ppm: 8.0 }
              as: ComplianceAnalyst
            - call: "POST /materials/${mat_ra}/disclosure"
              payload: { action: "REQUEST" }
              as: ComplianceAnalyst
            - call: "POST /materials/${mat_ra}/disclosure"
              payload: { action: "RECORD_RESPONSE", response_completeness: "COMPLETE" }
              as: ComplianceAnalyst
            - call: "POST /materials/${mat_ra}/disclosure"
              payload: { action: "VERIFY" }
              as: ComplianceAnalyst
            - call: "POST /materials/${mat_c}/disclosure"
              payload: { action: "REQUEST" }
              as: ComplianceAnalyst
            - call: "POST /materials/${mat_c}/disclosure"
              payload: { action: "RECORD_RESPONSE", response_completeness: "COMPLETE" }
              as: ComplianceAnalyst
            - call: "POST /materials/${mat_c}/disclosure"
              payload: { action: "VERIFY" }
              as: ComplianceAnalyst
            - call: "POST /materials/${mat_g}/disclosure"
              payload: { action: "REQUEST" }
              as: ComplianceAnalyst
            - call: "POST /materials/${mat_g}/disclosure"
              payload: { action: "RECORD_RESPONSE", response_completeness: "COMPLETE" }
              as: ComplianceAnalyst
            - call: "POST /materials/${mat_g}/disclosure"
              payload: { action: "VERIFY" }
              as: ComplianceAnalyst
            - call: "POST /products"
              payload: { sku: "SKU-EP2", product_name: "Endpoint Widget Two", product_category: "CONSUMER_GOOD", distribution_channels: ["RETAIL"], label_area_sq_in: 10.0, annual_units: 1000 }
              as: RegistryAdmin
              captures: { prod_1: $.data.id }
            - call: "POST /products/${prod_1}/components"
              payload: { material_id: "${mat_ra}", quantity_grams_per_unit: 0.1, contact_factor: 1.0 }
              as: ComplianceAnalyst
          trigger:
            - call: "PATCH /materials/${mat_c}"
              payload: { parent_material_id: "${mat_rb1}", parent_mass_fraction: 0.25 }
              as: ComplianceAnalyst
            - call: "GET /materials?parent_material_id=${mat_ra}"
              payload: {}
              as: ComplianceAnalyst
          assert:
            - "before the PATCH: Material.${mat_ra}.bom_depth == 0, Material.${mat_c}.bom_depth == 1, Material.${mat_g}.bom_depth == 2, Material.${mat_rb1}.bom_depth == 1"
            - "before the PATCH: Product.${prod_1}.total_listed_chemical_load_ug == 12.200 (RA rolls up to 100.0 + 0.5 x (40.0 + 0.5 x 8.0) == 122.0000, times 0.1 g/unit)"
            - "first trigger call: HTTP 200 with Material.${mat_c}.parent_material_id == ${mat_rb1}, parent_mass_fraction == 0.25 and bom_depth == 2"
            - "Material.${mat_g}.bom_depth == 3 after the PATCH - the descendant is re-depthed even though it was not named in the request"
            - "Material.${mat_ra}.bom_depth is still 0 and Material.${mat_ra}.version is unchanged by the PATCH"
            - "after the PATCH: Product.${prod_1}.total_listed_chemical_load_ug == 10.000 (RA now rolls up to its own 100.0000 only)"
            - "second trigger call: total_count == 0 - RA has no children left"
            - "GET /materials?parent_material_id=${mat_rb1} returns total_count == 1 containing ${mat_c}"

      - name: ep_product_listing_filters_combine_conjunctively_with_pagination
        claim_type: standard_crud
        grounds:
          - endpoints[GET /products]
          - validations[priority=4]
        distinguishing_aspect: |
          The three optional filters on GET /products are ANDed, not ORed, and they compose with
          limit/offset over the filtered set rather than over the whole table. A category filter that
          matches two rows narrows to one when a lifecycle filter is added, and offset is applied
          after filtering.
        test_recipe:
          setup:
            - "Four products exist: SKU-F1 (CONSUMER_GOOD, DEVELOPMENT), SKU-F2 (FOOD, DEVELOPMENT), SKU-F3 (CONSUMER_GOOD, DISCONTINUED), SKU-F4 (FURNITURE, DISCONTINUED). None has components, so every compliance_posture is EXPOSURE_UNKNOWN."
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { current_utc: "2026-08-01T00:00:00Z" }
              as: RegistryAdmin
            - call: "POST /products"
              payload: { sku: "SKU-F1", product_name: "Filter One", product_category: "CONSUMER_GOOD", distribution_channels: ["RETAIL"], label_area_sq_in: 10.0, annual_units: 100 }
              as: RegistryAdmin
              captures: { p1: $.data.id }
            - call: "POST /products"
              payload: { sku: "SKU-F2", product_name: "Filter Two", product_category: "FOOD", distribution_channels: ["RETAIL"], label_area_sq_in: 10.0, annual_units: 100 }
              as: RegistryAdmin
              captures: { p2: $.data.id }
            - call: "POST /products"
              payload: { sku: "SKU-F3", product_name: "Filter Three", product_category: "CONSUMER_GOOD", distribution_channels: ["CATALOG"], label_area_sq_in: 10.0, annual_units: 100 }
              as: RegistryAdmin
              captures: { p3: $.data.id }
            - call: "POST /products"
              payload: { sku: "SKU-F4", product_name: "Filter Four", product_category: "FURNITURE", distribution_channels: ["INTERNET"], label_area_sq_in: 10.0, annual_units: 100 }
              as: RegistryAdmin
              captures: { p4: $.data.id }
            - call: "POST /products/${p3}/transitions"
              payload: { action: "DISCONTINUE" }
              as: RegistryAdmin
            - call: "POST /products/${p4}/transitions"
              payload: { action: "DISCONTINUE" }
              as: RegistryAdmin
          trigger:
            - call: "GET /products?product_category=CONSUMER_GOOD"
              payload: {}
              as: ComplianceAnalyst
            - call: "GET /products?product_category=CONSUMER_GOOD&lifecycle_state=DEVELOPMENT"
              payload: {}
              as: ComplianceAnalyst
            - call: "GET /products?lifecycle_state=DISCONTINUED&compliance_posture=EXPOSURE_UNKNOWN"
              payload: {}
              as: ComplianceAnalyst
            - call: "GET /products?lifecycle_state=MARKETED"
              payload: {}
              as: ComplianceAnalyst
            - call: "GET /products?limit=3&offset=3"
              payload: {}
              as: ComplianceAnalyst
            - call: "GET /products?product_category=CONSUMER_GOOD&limit=1&offset=1"
              payload: {}
              as: ComplianceAnalyst
          assert:
            - "first trigger call: HTTP 200 with total_count == 2 holding ${p1} and ${p3}"
            - "second trigger call: total_count == 1 holding only ${p1} - the filters are ANDed"
            - "third trigger call: total_count == 2 holding ${p3} and ${p4}"
            - "fourth trigger call: total_count == 0 with an empty data array, not HTTP 404"
            - "fifth trigger call: total_count == 4 with exactly 1 row returned and has_more false"
            - "sixth trigger call: total_count == 2 (the filtered set) with exactly 1 row - ${p3} - and has_more false, proving offset applies after filtering"

      - name: ep_compliance_summary_computed_read_reports_zero_evidence_and_unknown_notice_not_found
        claim_type: computed_read
        grounds:
          - endpoints[GET /products/{product_id}/compliance-summary]
          - calculations.defense_strength_score
          - validations[priority=21]
        distinguishing_aspect: |
          The computed read has no stored counterpart: it must synthesise every counter on demand and,
          for a bare product with no components, report score 0 with all four evidence components at
          0.0 while still echoing the AS_OF_TODAY variant and the current logical clock as as_of. The
          endpoint also owns the only body-side foreign key on a GET - an as_of_notice_id that does
          not resolve is ERR_NOT_FOUND, not a silent fall back to AS_OF_TODAY.
        test_recipe:
          setup:
            - "Product SKU-EP4 exists with no components, no assessments, no determinations and no notices; the clock is 2026-08-01T00:00:00Z."
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { current_utc: "2026-08-01T00:00:00Z" }
              as: RegistryAdmin
            - call: "POST /products"
              payload: { sku: "SKU-EP4", product_name: "Endpoint Widget Four", product_category: "CONSUMER_GOOD", distribution_channels: ["RETAIL"], label_area_sq_in: 10.0, annual_units: 1000 }
              as: RegistryAdmin
              captures: { prod_1: $.data.id }
          trigger:
            - call: "GET /products/${prod_1}/compliance-summary"
              payload: {}
              as: RegulatoryCounsel
            - call: "GET /products/${prod_1}/compliance-summary?as_of_notice_id=00000000-0000-0000-0000-0000000000ff"
              payload: {}
              as: RegulatoryCounsel
            - call: "GET /products/00000000-0000-0000-0000-0000000000fe/compliance-summary"
              payload: {}
              as: RegulatoryCounsel
          assert:
            - "first trigger call: HTTP 200 with variant == AS_OF_TODAY and as_of == 2026-08-01T00:00:00Z"
            - "first trigger call: defense_strength_score == 0 with warning_evidence 0.0, assessment_evidence 0.0, warranty_evidence 0.0 and recordkeeping_evidence 0.0 (zero ACTIVE components forces the warranty and recordkeeping components to 0.0 rather than to the vacuous-truth value 1.0)"
            - "first trigger call: required_channel_count, covered_channel_count, verified_channel_count, final_assessment_count, verified_material_count and active_component_count are all 0"
            - "second trigger call: HTTP 404 with error_id ERR_NOT_FOUND - the unresolvable as_of_notice_id is rejected instead of being ignored"
            - "third trigger call: HTTP 404 with error_id ERR_NOT_FOUND for the unknown path id"
            - "no call mutates anything: Product.${prod_1}.version is unchanged after all three reads"

      - name: ep_material_chemical_link_listings_filter_from_both_sides
        claim_type: cross_reference_link
        grounds:
          - endpoints[GET /material-chemicals]
          - endpoints[GET /materials]
          - entities.MaterialChemical
        distinguishing_aspect: |
          MaterialChemical is the junction entity of the Material/ListedChemical many-to-many, so its
          collection must be reachable from either side and by the pair; and measurement_basis
          filtering must follow the REPORT_RESULT flip rather than the value the link was created
          with.
        test_recipe:
          setup:
            - "Bisphenol A and Cadmium are both LISTED. Material RM-X declares both; material RM-Y declares Bisphenol A only. Both belong to supplier Northgate."
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { current_utc: "2026-08-01T00:00:00Z" }
              as: RegistryAdmin
            - call: "POST /listed-chemicals"
              payload: { chemical_name: "Bisphenol A", cas_number: "80-05-7", endpoint_type: "REPRODUCTIVE_FEMALE", safe_harbor_basis: "MADL", safe_harbor_level_ug_per_day: 0.5 }
              as: RegistryAdmin
              captures: { chem_bpa: $.data.id }
            - call: "POST /listed-chemicals/${chem_bpa}/transitions"
              payload: { action: "LIST", listing_effective_date: "2026-01-01T00:00:00Z" }
              as: RegistryAdmin
            - call: "POST /listed-chemicals"
              payload: { chemical_name: "Cadmium", cas_number: "7440-43-9", endpoint_type: "CANCER", safe_harbor_basis: "NONE" }
              as: RegistryAdmin
              captures: { chem_cd: $.data.id }
            - call: "POST /listed-chemicals/${chem_cd}/transitions"
              payload: { action: "LIST", listing_effective_date: "2026-01-01T00:00:00Z" }
              as: RegistryAdmin
            - call: "POST /suppliers"
              payload: { legal_name: "Northgate Polymers", contact_email: "qa@northgate.example" }
              as: ComplianceAnalyst
              captures: { sup_1: $.data.id }
            - call: "POST /materials"
              payload: { material_code: "RM-X", material_class: "RAW_MATERIAL", supplier_id: "${sup_1}" }
              as: ComplianceAnalyst
              captures: { mat_x: $.data.id }
            - call: "POST /materials"
              payload: { material_code: "RM-Y", material_class: "MANUFACTURING_AID", supplier_id: "${sup_1}" }
              as: ComplianceAnalyst
              captures: { mat_y: $.data.id }
            - call: "POST /materials/${mat_x}/chemicals"
              payload: { chemical_id: "${chem_bpa}", declared_concentration_ppm: 20.0 }
              as: ComplianceAnalyst
              captures: { link_x_bpa: $.data.id }
            - call: "POST /materials/${mat_x}/chemicals"
              payload: { chemical_id: "${chem_cd}", declared_concentration_ppm: 5.0 }
              as: ComplianceAnalyst
            - call: "POST /materials/${mat_y}/chemicals"
              payload: { chemical_id: "${chem_bpa}", declared_concentration_ppm: 3.0 }
              as: ComplianceAnalyst
          trigger:
            - call: "GET /material-chemicals?material_id=${mat_x}"
              payload: {}
              as: ToxicologyReviewer
            - call: "GET /material-chemicals?chemical_id=${chem_bpa}"
              payload: {}
              as: ToxicologyReviewer
            - call: "GET /material-chemicals?material_id=${mat_x}&chemical_id=${chem_bpa}"
              payload: {}
              as: ToxicologyReviewer
            - call: "POST /material-chemicals/${link_x_bpa}/transitions"
              payload: { action: "REPORT_RESULT", lab_name: "Harbor Analytical", lab_result_ppm: 18.0, lab_loq_ppm: 1.0 }
              as: ToxicologyReviewer
            - call: "GET /material-chemicals?measurement_basis=LAB_TESTED"
              payload: {}
              as: ToxicologyReviewer
            - call: "GET /materials?supplier_id=${sup_1}&material_class=MANUFACTURING_AID"
              payload: {}
              as: ComplianceAnalyst
          assert:
            - "first trigger call: total_count == 2 (both links of RM-X)"
            - "second trigger call: total_count == 2 (both materials declaring Bisphenol A) - the junction is reachable from the chemical side too"
            - "third trigger call: total_count == 1 holding ${link_x_bpa} - the pair is unique"
            - "before the REPORT_RESULT: GET /material-chemicals?measurement_basis=LAB_TESTED returns total_count == 0 (creates land as DECLARED)"
            - "fifth trigger call: total_count == 1 holding ${link_x_bpa} with measurement_basis == LAB_TESTED and lab_reported_at == 2026-08-01T00:00:00Z"
            - "sixth trigger call: total_count == 1 holding ${mat_y} - the two Material filters are ANDed"

      - name: ep_reformulation_transition_action_endpoint_side_effects
        claim_type: action_endpoint
        grounds:
          - endpoints[POST /reformulation-projects/{reformulation_project_id}/transitions]
        distinguishing_aspect: |
          The declared side effects of SUBMIT_VERIFICATION reach outside the project: they rewrite the
          linked MaterialChemical, supersede FINAL assessments and move the product's posture, so the
          action endpoint's response is not the whole observable effect.
        excluded_because:
          difficulty_instance: reformulation_verification_cascades_three_levels
          rationale: |
            The §1.8 transitive_cascade instance already drives SUBMIT_VERIFICATION and asserts every
            declared side effect at all three levels, including the recomputed load and posture.

      - name: ep_listed_chemical_transition_revise_safe_harbor_side_effects
        claim_type: action_endpoint
        grounds:
          - endpoints[POST /listed-chemicals/{chemical_id}/transitions]
        distinguishing_aspect: |
          REVISE_SAFE_HARBOR is the widest-reaching action in the API: one call must re-run verdicts,
          supersede assessments, revoke a determination and flag its placements.
        excluded_because:
          difficulty_instance: revise_safe_harbor_cascades_four_levels
          rationale: |
            The §1.8 transitive_cascade instance walks all four hops of this single action and asserts
            each intermediate row, which subsumes any narrower endpoint-level probe.

      - name: ep_compliance_summary_variant_selection_by_as_of_notice_id
        claim_type: computed_read
        grounds:
          - endpoints[GET /products/{product_id}/compliance-summary]
          - calculations.defense_strength_score
        distinguishing_aspect: |
          The presence of as_of_notice_id switches the whole evaluation date, so the same stored rows
          must yield a lower or equal score under AS_OF_SERVICE_DATE.
        excluded_because:
          difficulty_instance: dual_variant_calc / defense_score_as_of_today_vs_as_of_service_date
          rationale: |
            The §1.8 dual_variant_calculation instance already calls the endpoint both ways against
            one fixture and asserts the two scores plus every evidence component that diverges.

      - name: ep_settlement_transition_recomputes_money_only_on_revision
        claim_type: action_endpoint
        grounds:
          - endpoints[POST /settlements/{settlement_id}/transitions]
        distinguishing_aspect: |
          COUNTER and REVISE may carry a new fee request, and ACCEPT_EXECUTE has product-level side
          effects (accrued_penalty_cents, open_notice_count, the notice moving to SETTLED).
        excluded_because:
          difficulty_instance: settlement_void_restores_accrued_penalty_and_open_notice_count
          rationale: |
            The §1.8 compensating_invariant instance already executes and then voids a settlement,
            asserting the product-level counters before, between and after, which covers this
            endpoint's side effects end to end.

  # ===========================================================================
  # SECTION 6 - errors  (46 declared; every code must be triggerable)
  # Codes already asserted elsewhere in this file: ERR_INVALID_REQUEST,
  # ERR_INVALID_PAGINATION, ERR_VALUE_OUT_OF_RANGE, ERR_INVALID_CAS_NUMBER,
  # ERR_SAFE_HARBOR_BASIS_MISMATCH, ERR_INVALID_INTERVAL, ERR_UNKNOWN_ACTION,
  # ERR_FIELD_NOT_WRITABLE, ERR_NOT_FOUND, ERR_DUPLICATE_RESOURCE,
  # ERR_MATERIAL_CYCLE, ERR_REFORMULATION_LINK_MISMATCH, ERR_STALE_NOTICE_VERSION,
  # ERR_INVALID_STATE_TRANSITION, ERR_ENTITY_IMMUTABLE, ERR_PRODUCT_ON_ENFORCEMENT_HOLD,
  # ERR_NO_ACTIVE_COMPONENTS, ERR_SUPPLIER_DATA_INCOMPLETE, ERR_NO_QUALIFYING_EXPOSURE,
  # ERR_EXPOSURE_ABOVE_SAFE_HARBOR, ERR_BASIS_ASSESSMENT_NOT_FINAL,
  # ERR_OPEN_DETERMINATION_EXISTS, ERR_CHANNEL_NOT_REQUIRED, ERR_NOTICE_NOT_NEGOTIABLE,
  # ERR_SETTLEMENT_ROUND_LIMIT, ERR_NO_VIOLATION_WINDOW, ERR_INDEMNITY_CAP_EXCEEDED,
  # ERR_SETTLEMENT_NOT_VOIDABLE, ERR_WARRANTY_IN_USE.  ERR_UNAUTHORIZED and
  # ERR_SEGREGATION_OF_DUTIES are covered in the rbac section, ERR_STALE_PRODUCT_VERSION
  # in cross_cutting_complexity_layers.  The rest are either driven below or stubbed
  # against the §1.8 instance that already asserts them.
  # ===========================================================================
  - section: errors
    instances:

      - name: err_parent_state_forbids_write_on_discontinued_product_and_withdrawn_chemical
        claim_type: violation_to_error
        grounds:
          - validations[priority=41]
          - errors[ERR_PARENT_STATE_FORBIDS_WRITE]
          - state_machines.Product.DEVELOPMENT_to_DISCONTINUED
          - state_machines.ListedChemical.PROPOSED_to_WITHDRAWN
        distinguishing_aspect: |
          One error code covers three different parents: a DISCONTINUED product refuses both component
          creates and assessment creates, and a WITHDRAWN chemical refuses MaterialChemical creates.
          The rule is deliberately scoped to those three creates - placement creation is NOT covered
          (it is policed at priority 71 instead), and REMOVE on an existing component of a
          DISCONTINUED product is refused by the component transition's own precondition rather than
          by this create-time rule.
        test_recipe:
          setup:
            - "Benzene is LISTED and Toluene is left in PROPOSED and then WITHDRAWN; the clock is 2026-08-01T00:00:00Z."
            - "Product SKU-E41 has one ACTIVE component of RM-E41 and is then DISCONTINUED straight out of DEVELOPMENT."
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { current_utc: "2026-08-01T00:00:00Z" }
              as: RegistryAdmin
            - call: "POST /listed-chemicals"
              payload: { chemical_name: "Benzene", cas_number: "71-43-2", endpoint_type: "CANCER", safe_harbor_basis: "NSRL", safe_harbor_level_ug_per_day: 6.4 }
              as: RegistryAdmin
              captures: { chem_bz: $.data.id }
            - call: "POST /listed-chemicals/${chem_bz}/transitions"
              payload: { action: "LIST", listing_effective_date: "2026-01-01T00:00:00Z" }
              as: RegistryAdmin
            - call: "POST /listed-chemicals"
              payload: { chemical_name: "Toluene", cas_number: "108-88-3", endpoint_type: "DEVELOPMENTAL", safe_harbor_basis: "MADL", safe_harbor_level_ug_per_day: 7.0 }
              as: RegistryAdmin
              captures: { chem_tol: $.data.id }
            - call: "POST /listed-chemicals/${chem_tol}/transitions"
              payload: { action: "WITHDRAW" }
              as: RegistryAdmin
            - call: "POST /suppliers"
              payload: { legal_name: "Northgate Polymers", contact_email: "qa@northgate.example" }
              as: ComplianceAnalyst
              captures: { sup_1: $.data.id }
            - call: "POST /materials"
              payload: { material_code: "RM-E41", material_class: "RAW_MATERIAL", supplier_id: "${sup_1}" }
              as: ComplianceAnalyst
              captures: { mat_1: $.data.id }
            - call: "POST /materials"
              payload: { material_code: "RM-E41B", material_class: "PACKAGING", supplier_id: "${sup_1}" }
              as: ComplianceAnalyst
              captures: { mat_2: $.data.id }
            - call: "POST /materials/${mat_1}/chemicals"
              payload: { chemical_id: "${chem_bz}", declared_concentration_ppm: 40.0 }
              as: ComplianceAnalyst
            - call: "POST /products"
              payload: { sku: "SKU-E41", product_name: "Discontinued Widget", product_category: "CONSUMER_GOOD", distribution_channels: ["RETAIL"], label_area_sq_in: 10.0, annual_units: 500 }
              as: RegistryAdmin
              captures: { prod_1: $.data.id }
            - call: "POST /products/${prod_1}/components"
              payload: { material_id: "${mat_1}", quantity_grams_per_unit: 0.25, contact_factor: 0.5 }
              as: ComplianceAnalyst
              captures: { comp_1: $.data.id }
            - call: "POST /products/${prod_1}/transitions"
              payload: { action: "DISCONTINUE" }
              as: RegistryAdmin
          trigger:
            - call: "POST /products/${prod_1}/components"
              payload: { material_id: "${mat_2}", quantity_grams_per_unit: 0.10, contact_factor: 1.0 }
              as: ComplianceAnalyst
            - call: "POST /products/${prod_1}/exposure-assessments"
              payload: { chemical_id: "${chem_bz}", method: "MODELED", route: "ORAL", uses_per_day: 1.0 }
              as: ComplianceAnalyst
              as_user_id: "ca_1"
            - call: "POST /materials/${mat_2}/chemicals"
              payload: { chemical_id: "${chem_tol}", declared_concentration_ppm: 12.0 }
              as: ComplianceAnalyst
            - call: "POST /product-components/${comp_1}/transitions"
              payload: { action: "REMOVE" }
              as: ComplianceAnalyst
            - call: "POST /materials/${mat_2}/chemicals"
              payload: { chemical_id: "${chem_bz}", declared_concentration_ppm: 12.0 }
              as: ComplianceAnalyst
          assert:
            - "Product.${prod_1}.lifecycle_state == DISCONTINUED while compliance_posture is still EXPOSURE_UNKNOWN (the two dimensions are independent)"
            - "first trigger call: HTTP 409 with error_id ERR_PARENT_STATE_FORBIDS_WRITE"
            - "second trigger call: HTTP 409 with error_id ERR_PARENT_STATE_FORBIDS_WRITE"
            - "third trigger call: HTTP 409 with error_id ERR_PARENT_STATE_FORBIDS_WRITE - the WITHDRAWN chemical is the forbidding parent here, not the product"
            - "fourth trigger call: HTTP 409 with error_id ERR_PARENT_STATE_FORBIDS_WRITE and ProductComponent.${comp_1}.status still ACTIVE"
            - "fifth trigger call: HTTP 201 - RM-E41B is not attached to the discontinued product's ACTIVE components as a parent write, and Benzene is LISTED, so the same endpoint that just failed now succeeds"
            - "Product.${prod_1}.total_listed_chemical_load_ug == 10.000 throughout (40.0 x 0.25) - none of the refused calls moved it"

      - name: err_reformulation_target_not_below_threshold_at_create_and_at_complete
        claim_type: violation_to_error
        grounds:
          - validations[priority=58]
          - errors[ERR_TARGET_NOT_BELOW_THRESHOLD]
          - state_machines.ReformulationProject.VERIFICATION_to_COMPLETED
        distinguishing_aspect: |
          The same error code guards two different comparisons at two different times: at create the
          target must be strictly below the link's CURRENT effective concentration, and at COMPLETE the
          recomputed verified_daily_exposure_ug must be strictly below the chemical's safe harbor
          level. The COMPLETE branch is pinned at exact equality (6.400 vs 6.4), which an
          implementation using <= would wrongly accept.
        test_recipe:
          setup:
            - "Benzene is LISTED with NSRL 6.4 ug/day; the clock is 2026-08-01T00:00:00Z."
            - "Product SKU-T58 has one ACTIVE component of RM-T58 (disclosure VERIFIED, Benzene declared 800.0 ppm) at 0.25 g/unit with contact_factor 0.5 and a FINAL MODELED/ORAL assessment at 100.000 ug/day."
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { current_utc: "2026-08-01T00:00:00Z" }
              as: RegistryAdmin
            - call: "POST /listed-chemicals"
              payload: { chemical_name: "Benzene", cas_number: "71-43-2", endpoint_type: "CANCER", safe_harbor_basis: "NSRL", safe_harbor_level_ug_per_day: 6.4 }
              as: RegistryAdmin
              captures: { chem_bz: $.data.id }
            - call: "POST /listed-chemicals/${chem_bz}/transitions"
              payload: { action: "LIST", listing_effective_date: "2026-01-01T00:00:00Z" }
              as: RegistryAdmin
            - call: "POST /suppliers"
              payload: { legal_name: "Northgate Polymers", contact_email: "qa@northgate.example" }
              as: ComplianceAnalyst
              captures: { sup_1: $.data.id }
            - call: "POST /materials"
              payload: { material_code: "RM-T58", material_class: "RAW_MATERIAL", supplier_id: "${sup_1}" }
              as: ComplianceAnalyst
              captures: { mat_1: $.data.id }
            - call: "POST /materials/${mat_1}/chemicals"
              payload: { chemical_id: "${chem_bz}", declared_concentration_ppm: 800.0 }
              as: ComplianceAnalyst
              captures: { link_1: $.data.id }
            - call: "POST /materials/${mat_1}/disclosure"
              payload: { action: "REQUEST" }
              as: ComplianceAnalyst
            - call: "POST /materials/${mat_1}/disclosure"
              payload: { action: "RECORD_RESPONSE", response_completeness: "COMPLETE" }
              as: ComplianceAnalyst
            - call: "POST /materials/${mat_1}/disclosure"
              payload: { action: "VERIFY" }
              as: ComplianceAnalyst
            - call: "POST /products"
              payload: { sku: "SKU-T58", product_name: "Threshold Widget", product_category: "CONSUMER_GOOD", distribution_channels: ["RETAIL"], label_area_sq_in: 10.0, annual_units: 500 }
              as: RegistryAdmin
              captures: { prod_1: $.data.id }
            - call: "POST /products/${prod_1}/components"
              payload: { material_id: "${mat_1}", quantity_grams_per_unit: 0.25, contact_factor: 0.5 }
              as: ComplianceAnalyst
            - call: "POST /products/${prod_1}/exposure-assessments"
              payload: { chemical_id: "${chem_bz}", method: "MODELED", route: "ORAL", uses_per_day: 1.0 }
              as: ComplianceAnalyst
              as_user_id: "ca_1"
              captures: { asmt_1: $.data.id }
            - call: "POST /exposure-assessments/${asmt_1}/transitions"
              payload: { action: "SUBMIT" }
              as: ComplianceAnalyst
              as_user_id: "ca_1"
            - call: "POST /exposure-assessments/${asmt_1}/transitions"
              payload: { action: "PEER_REVIEW" }
              as: ToxicologyReviewer
              as_user_id: "tox_1"
            - call: "POST /exposure-assessments/${asmt_1}/transitions"
              payload: { action: "FINALIZE" }
              as: ToxicologyReviewer
              as_user_id: "tox_1"
          trigger:
            - call: "POST /reformulation-projects"
              payload: { product_id: "${prod_1}", chemical_id: "${chem_bz}", material_chemical_id: "${link_1}", target_concentration_ppm: 800.0, planned_start_date: "2026-08-01T00:00:00Z", planned_end_date: "2026-09-01T00:00:00Z" }
              as: ComplianceAnalyst
            - call: "POST /reformulation-projects"
              payload: { product_id: "${prod_1}", chemical_id: "${chem_bz}", material_chemical_id: "${link_1}", target_concentration_ppm: 51.2, planned_start_date: "2026-08-01T00:00:00Z", planned_end_date: "2026-09-01T00:00:00Z" }
              as: ComplianceAnalyst
              captures: { rp_1: $.data.id }
            - call: "POST /reformulation-projects/${rp_1}/transitions"
              payload: { action: "START" }
              as: ComplianceAnalyst
            - call: "POST /reformulation-projects/${rp_1}/transitions"
              payload: { action: "SUBMIT_VERIFICATION" }
              as: ComplianceAnalyst
            - call: "POST /reformulation-projects/${rp_1}/transitions"
              payload: { action: "COMPLETE" }
              as: ComplianceAnalyst
            - call: "POST /reformulation-projects/${rp_1}/transitions"
              payload: { action: "ABANDON" }
              as: ComplianceAnalyst
            - call: "POST /reformulation-projects"
              payload: { product_id: "${prod_1}", chemical_id: "${chem_bz}", material_chemical_id: "${link_1}", target_concentration_ppm: 8.0, planned_start_date: "2026-09-01T00:00:00Z", planned_end_date: "2026-10-01T00:00:00Z" }
              as: ComplianceAnalyst
              captures: { rp_2: $.data.id }
            - call: "POST /reformulation-projects/${rp_2}/transitions"
              payload: { action: "START" }
              as: ComplianceAnalyst
            - call: "POST /reformulation-projects/${rp_2}/transitions"
              payload: { action: "SUBMIT_VERIFICATION" }
              as: ComplianceAnalyst
            - call: "POST /reformulation-projects/${rp_2}/transitions"
              payload: { action: "COMPLETE" }
              as: ComplianceAnalyst
          assert:
            - "before the triggers: Product.${prod_1}.total_listed_chemical_load_ug == 200.000 (800.0 x 0.25) and ExposureAssessment.${asmt_1}.daily_exposure_ug == 100.000 with margin_ratio 15.6250 and result AT_OR_ABOVE_SAFE_HARBOR"
            - "first trigger call: HTTP 422 with error_id ERR_TARGET_NOT_BELOW_THRESHOLD - 800.0 is not strictly below the link's current 800.0"
            - "second trigger call: HTTP 201 with ReformulationProject.${rp_1}.status == PLANNED, baseline_daily_exposure_ug == 100.000 and verified_daily_exposure_ug == null"
            - "after SUBMIT_VERIFICATION: MaterialChemical.${link_1}.declared_concentration_ppm == 51.2, ReformulationProject.${rp_1}.verified_daily_exposure_ug == 6.400, reduction_pct == 93.60, ExposureAssessment.${asmt_1}.status == SUPERSEDED and Product.${prod_1}.total_listed_chemical_load_ug == 12.800"
            - "fifth trigger call: HTTP 422 with error_id ERR_TARGET_NOT_BELOW_THRESHOLD - 6.400 equals the 6.4 safe harbor and equality is not strictly below - and ReformulationProject.${rp_1}.status is still VERIFICATION"
            - "sixth trigger call: HTTP 200 with ReformulationProject.${rp_1}.status == ABANDONED"
            - "seventh trigger call: HTTP 201 - 8.0 is strictly below the link's now-current 51.2 - with ReformulationProject.${rp_2}.baseline_daily_exposure_ug == 0 (no FINAL assessment survives) and reduction_pct == null"
            - "after the ${rp_2} SUBMIT_VERIFICATION: verified_daily_exposure_ug == 1.000, reduction_pct == null (baseline 0) and Product.${prod_1}.total_listed_chemical_load_ug == 2.000"
            - "tenth trigger call: HTTP 200 with ReformulationProject.${rp_2}.status == COMPLETED - 1.000 is strictly below 6.4 - and MaterialChemical.${link_1}.declared_concentration_ppm stays 8.0"

      - name: err_cure_not_available_within_quiet_period_or_over_unit_ceiling
        claim_type: violation_to_error
        grounds:
          - errors[ERR_CURE_NOT_AVAILABLE]
        distinguishing_aspect: |
          ELECT_CURE is refused when the product is above the annual-unit ceiling or when a prior
          executed settlement falls inside the quiet period.
        excluded_because:
          difficulty_instance: cure_eligibility_at_exact_annual_unit_ceiling_and_one_above
          rationale: |
            The §1.8 boundary_precision_check instance drives ELECT_CURE at exactly CURE_UNIT_CEILING
            and one unit above it, asserting the accepted transition and the
            ERR_CURE_NOT_AVAILABLE refusal in the same recipe.

      - name: err_chemical_not_listed_on_assessment_create
        claim_type: violation_to_error
        grounds:
          - errors[ERR_CHEMICAL_NOT_LISTED]
        distinguishing_aspect: |
          An assessment may only be opened against a chemical whose ListedChemical status is LISTED, so
          PROPOSED, DELISTED and WITHDRAWN chemicals are all refused.
        excluded_because:
          difficulty_instance: assessment_create_requires_listed_chemical_status
          rationale: |
            The §1.8 cross_entity_state_dependency instance already refuses the create against a
            PROPOSED chemical, then LISTs it and repeats the identical create successfully.

      - name: err_peer_review_required_on_finalize
        claim_type: violation_to_error
        grounds:
          - errors[ERR_PEER_REVIEW_REQUIRED]
        distinguishing_aspect: |
          FINALIZE demands that the assessment has passed through PEER_REVIEWED, which is a different
          failure from attempting FINALIZE out of an illegal source state.
        excluded_because:
          difficulty_instance: finalize_from_draft_reports_illegal_transition_over_missing_peer_review
          rationale: |
            The §1.8 priority_pair_validation_conflict instance asserts this code as the outcome of
            FINALIZE from SUBMITTED, alongside the illegal-transition outcome from DRAFT.

      - name: err_determination_not_approved_on_placement_create
        claim_type: violation_to_error
        grounds:
          - errors[ERR_DETERMINATION_NOT_APPROVED]
        distinguishing_aspect: |
          Placements may only be attached to an APPROVED determination, and that check runs after the
          overlap check.
        excluded_because:
          difficulty_instance: placement_overlap_reported_before_determination_not_approved
          rationale: |
            The §1.8 priority_pair_validation_conflict instance asserts this code on its own and in
            the ordered pair with ERR_PLACEMENT_OVERLAP.

      - name: err_lab_result_missing_on_lab_tested_submit
        claim_type: violation_to_error
        grounds:
          - errors[ERR_LAB_RESULT_MISSING]
        distinguishing_aspect: |
          A LAB_TESTED assessment cannot be submitted while any contributing link still lacks lab data.
        excluded_because:
          difficulty_instance: lab_tested_submit_requires_lab_basis_on_every_link
          rationale: |
            The §1.8 cross_entity_state_dependency instance asserts this code and then clears it by
            recording the missing lab result.

      - name: err_rejection_limit_reached_on_reject
        claim_type: violation_to_error
        grounds:
          - errors[ERR_REJECTION_LIMIT_REACHED]
        distinguishing_aspect: |
          The rejection ceiling is per assessment and survives reopen cycles.
        excluded_because:
          difficulty_instance: assessment_reject_reopen_cycle_hits_rejection_ceiling
          rationale: |
            The §1.8 non_linear_state_machine instance walks the cycle to the ceiling and asserts this
            code on the attempt past it.

      - name: err_cure_window_closed_on_complete_cure
        claim_type: violation_to_error
        grounds:
          - errors[ERR_CURE_WINDOW_CLOSED]
        distinguishing_aspect: |
          COMPLETE_CURE is refused once the logical clock passes cure_deadline_at, inclusive of the
          deadline instant itself.
        excluded_because:
          difficulty_instance: complete_cure_at_exact_deadline_instant_then_one_second_later
          rationale: |
            The §1.8 boundary_precision_check instance asserts this code one second past the deadline
            against the accepted call at the deadline.

      - name: err_open_settlement_exists_on_settlement_create
        claim_type: violation_to_error
        grounds:
          - errors[ERR_OPEN_SETTLEMENT_EXISTS]
        distinguishing_aspect: |
          Only one non-terminal settlement may exist per notice.
        excluded_because:
          difficulty_instance: open_settlement_conflict_beats_absolute_fee_ceiling
          rationale: |
            The §1.8 priority_pair_validation_conflict instance asserts this code both alone and as the
            winner over ERR_FEE_REQUEST_EXCEEDS_CEILING.

      - name: err_fee_request_exceeds_ceiling_on_settlement_create
        claim_type: violation_to_error
        grounds:
          - errors[ERR_FEE_REQUEST_EXCEEDS_CEILING]
        distinguishing_aspect: |
          The absolute fee ceiling is a field-level bound independent of the computed fee cap.
        excluded_because:
          difficulty_instance: open_settlement_conflict_beats_absolute_fee_ceiling
          rationale: |
            The §1.8 instance isolates this code on a notice with no open settlement, which is the only
            state in which it can be observed.

      - name: err_placement_overlap_on_placement_create
        claim_type: violation_to_error
        grounds:
          - errors[ERR_PLACEMENT_OVERLAP]
        distinguishing_aspect: |
          Two placements of the same determination and channel may not share any instant, endpoints
          included.
        excluded_because:
          difficulty_instance: placement_closed_windows_collide_on_touching_endpoint
          rationale: |
            The §1.8 resource_temporal_overlap instance asserts this code on the touching endpoint and
            the acceptance one second later.

      - name: err_reformulation_overlap_on_project_create
        claim_type: violation_to_error
        grounds:
          - errors[ERR_REFORMULATION_OVERLAP]
        distinguishing_aspect: |
          Reformulation windows are half-open, so only genuinely intersecting windows collide.
        excluded_because:
          difficulty_instance: reformulation_half_open_windows_allow_touching_endpoint
          rationale: |
            The §1.8 resource_temporal_overlap instance asserts this code for the intersecting pair and
            the acceptance for the touching pair.

      - name: err_enforcement_hold_freeze_on_bom_write
        claim_type: violation_to_error
        grounds:
          - errors[ERR_ENFORCEMENT_HOLD_FREEZE]
        distinguishing_aspect: |
          All three bill-of-materials writes are frozen while the product sits on ENFORCEMENT_HOLD.
        excluded_because:
          difficulty_instance: bom_write_blocked_while_product_on_enforcement_hold
          rationale: |
            The §1.8 cross_entity_state_dependency instance asserts this code on a component write
            under an open notice and the same write succeeding once the notice closes.

  # ===========================================================================
  # SECTION 7 - rbac  (6 roles; RegistryAdmin/ComplianceAnalyst/ToxicologyReviewer/
  # LabelingSpecialist/RegulatoryCounsel are opaque, SupplierPortalUser is
  # entity_backed:Supplier)
  # ===========================================================================
  - section: rbac
    instances:

      - name: rbac_product_create_is_registry_admin_exclusive_and_rejects_every_other_role
        claim_type: exclusive_operations
        grounds:
          - roles.RegistryAdmin.exclusive_operations
          - endpoints[POST /products]
          - validations[priority=2]
          - errors[ERR_UNAUTHORIZED]
        distinguishing_aspect: |
          POST /products declares exactly one role. Every other declared role - including
          ComplianceAnalyst, who owns the whole bill of materials hanging off the product - is denied
          with ERR_UNAUTHORIZED, and the denial happens before any body validation, so an otherwise
          invalid payload from the wrong role still reports ERR_UNAUTHORIZED rather than
          ERR_INVALID_REQUEST.
        test_recipe:
          setup:
            - "The clock is 2026-08-01T00:00:00Z; no product exists yet."
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { current_utc: "2026-08-01T00:00:00Z" }
              as: RegistryAdmin
          trigger:
            - call: "POST /products"
              payload: { sku: "SKU-RB1", product_name: "Role Widget", product_category: "CONSUMER_GOOD", distribution_channels: ["RETAIL"], label_area_sq_in: 10.0, annual_units: 100 }
              as: ComplianceAnalyst
            - call: "POST /products"
              payload: { sku: "SKU-RB1", product_name: "Role Widget", product_category: "CONSUMER_GOOD", distribution_channels: ["RETAIL"], label_area_sq_in: 10.0, annual_units: 100 }
              as: LabelingSpecialist
            - call: "POST /products"
              payload: { sku: "SKU-RB1", product_name: "Role Widget", product_category: "CONSUMER_GOOD", distribution_channels: [], label_area_sq_in: 10.0, annual_units: 100 }
              as: RegulatoryCounsel
            - call: "POST /products"
              payload: { sku: "SKU-RB1", product_name: "Role Widget", product_category: "CONSUMER_GOOD", distribution_channels: ["RETAIL"], label_area_sq_in: 10.0, annual_units: 100 }
              as: RegistryAdmin
              captures: { prod_1: $.data.id }
          assert:
            - "first trigger call: HTTP 403 with error_id ERR_UNAUTHORIZED"
            - "second trigger call: HTTP 403 with error_id ERR_UNAUTHORIZED"
            - "third trigger call: HTTP 403 with error_id ERR_UNAUTHORIZED even though distribution_channels is empty - the role check at priority 2 outranks the body check at priority 12"
            - "fourth trigger call: HTTP 201 with Product.${prod_1}.sku == SKU-RB1"
            - "GET /products returns total_count == 1 - none of the three denied calls persisted anything"

      - name: rbac_absent_or_unknown_role_header_is_unauthorized
        claim_type: other_role_denial
        grounds:
          - validations[priority=1]
          - errors[ERR_UNAUTHORIZED]
          - endpoints[GET /products]
        distinguishing_aspect: |
          Priority 1 covers the two authentication-shaped failures that are not "wrong role for this
          endpoint": no X-User-Role header at all, and a header naming a role the scaffold never
          declared. Both are ERR_UNAUTHORIZED on a read endpoint that five of the six roles are allowed
          to call, which proves the check is on the header rather than on the endpoint's role list.
        test_recipe:
          setup:
            - "One product SKU-RB2 exists; the clock is 2026-08-01T00:00:00Z."
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { current_utc: "2026-08-01T00:00:00Z" }
              as: RegistryAdmin
            - call: "POST /products"
              payload: { sku: "SKU-RB2", product_name: "Header Widget", product_category: "CONSUMER_GOOD", distribution_channels: ["RETAIL"], label_area_sq_in: 10.0, annual_units: 100 }
              as: RegistryAdmin
              captures: { prod_1: $.data.id }
          trigger:
            - call: "GET /products/${prod_1}"
              payload: {}
              as: ""
            - call: "GET /products/${prod_1}"
              payload: {}
              as: "AuditorGeneral"
            - call: "GET /products/${prod_1}"
              payload: {}
              as: ComplianceAnalyst
          assert:
            - "first trigger call (the fixture sends NO X-User-Role header at all): HTTP 403 with error_id ERR_UNAUTHORIZED"
            - "second trigger call (X-User-Role: AuditorGeneral, a role §1.7 does not declare): HTTP 403 with error_id ERR_UNAUTHORIZED"
            - "third trigger call: HTTP 200 with data.id == ${prod_1}, proving the endpoint itself is reachable and only the header was at fault"
            - "even POST /_clock/set_current_utc without an X-User-Role header returns HTTP 403 ERR_UNAUTHORIZED - the clock endpoint is not exempt"

      - name: rbac_supplier_portal_user_cannot_reach_other_suppliers_materials_or_product_data
        claim_type: other_role_denial
        grounds:
          - roles.SupplierPortalUser
          - endpoints[POST /materials/{material_id}/chemicals]
          - endpoints[POST /materials/{material_id}/disclosure]
          - errors[ERR_UNAUTHORIZED]
        distinguishing_aspect: |
          SupplierPortalUser is the only entity_backed role, so its authorisation is row-scoped rather
          than endpoint-scoped: the identical call succeeds on a material whose supplier_id equals the
          caller's X-User-ID and is denied on a sibling supplier's material. It is additionally
          action-scoped (RECORD_RESPONSE only, never REQUEST) and has no visibility into products at
          all, even though ComplianceAnalyst shares both write endpoints with it.
        test_recipe:
          setup:
            - "Suppliers Northgate (${sup_1}) and Southbay (${sup_2}) each own one material; Bisphenol A is LISTED; product SKU-RB3 exists; the clock is 2026-08-01T00:00:00Z."
            - "Northgate's material RM-N is in disclosure REQUESTED, so a portal response is due."
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { current_utc: "2026-08-01T00:00:00Z" }
              as: RegistryAdmin
            - call: "POST /listed-chemicals"
              payload: { chemical_name: "Bisphenol A", cas_number: "80-05-7", endpoint_type: "REPRODUCTIVE_FEMALE", safe_harbor_basis: "MADL", safe_harbor_level_ug_per_day: 0.5 }
              as: RegistryAdmin
              captures: { chem_bpa: $.data.id }
            - call: "POST /listed-chemicals/${chem_bpa}/transitions"
              payload: { action: "LIST", listing_effective_date: "2026-01-01T00:00:00Z" }
              as: RegistryAdmin
            - call: "POST /suppliers"
              payload: { legal_name: "Northgate Polymers", contact_email: "qa@northgate.example" }
              as: ComplianceAnalyst
              captures: { sup_1: $.data.id }
            - call: "POST /suppliers"
              payload: { legal_name: "Southbay Resins", contact_email: "qa@southbay.example" }
              as: ComplianceAnalyst
              captures: { sup_2: $.data.id }
            - call: "POST /materials"
              payload: { material_code: "RM-N", material_class: "RAW_MATERIAL", supplier_id: "${sup_1}" }
              as: ComplianceAnalyst
              captures: { mat_n: $.data.id }
            - call: "POST /materials"
              payload: { material_code: "RM-S", material_class: "RAW_MATERIAL", supplier_id: "${sup_2}" }
              as: ComplianceAnalyst
              captures: { mat_s: $.data.id }
            - call: "POST /materials/${mat_n}/disclosure"
              payload: { action: "REQUEST" }
              as: ComplianceAnalyst
            - call: "POST /products"
              payload: { sku: "SKU-RB3", product_name: "Portal Widget", product_category: "CONSUMER_GOOD", distribution_channels: ["RETAIL"], label_area_sq_in: 10.0, annual_units: 100 }
              as: RegistryAdmin
              captures: { prod_1: $.data.id }
          trigger:
            - call: "POST /materials/${mat_s}/chemicals"
              payload: { chemical_id: "${chem_bpa}", declared_concentration_ppm: 12.0 }
              as: SupplierPortalUser
              as_user_id: "${sup_1}"
            - call: "POST /materials/${mat_n}/disclosure"
              payload: { action: "REQUEST" }
              as: SupplierPortalUser
              as_user_id: "${sup_1}"
            - call: "GET /products/${prod_1}"
              payload: {}
              as: SupplierPortalUser
              as_user_id: "${sup_1}"
            - call: "POST /materials/${mat_n}/chemicals"
              payload: { chemical_id: "${chem_bpa}", declared_concentration_ppm: 12.0 }
              as: SupplierPortalUser
              as_user_id: "${sup_1}"
              captures: { link_n: $.data.id }
            - call: "POST /materials/${mat_n}/disclosure"
              payload: { action: "RECORD_RESPONSE", response_completeness: "COMPLETE" }
              as: SupplierPortalUser
              as_user_id: "${sup_1}"
          assert:
            - "first trigger call: HTTP 403 with error_id ERR_UNAUTHORIZED - RM-S belongs to ${sup_2} while the caller is ${sup_1}"
            - "second trigger call: HTTP 403 with error_id ERR_UNAUTHORIZED - the portal may file responses but may not raise requests"
            - "third trigger call: HTTP 403 with error_id ERR_UNAUTHORIZED - SupplierPortalUser is not among the roles of GET /products/{product_id}"
            - "fourth trigger call: HTTP 201 - the same endpoint that was denied in call one succeeds on the caller's own material - with MaterialChemical.${link_n}.declared_concentration_ppm == 12.0 and measurement_basis SUPPLIER_DECLARED"
            - "fifth trigger call: HTTP 200 with Material.${mat_n}.disclosure_status == RECEIVED and data_received_at == 2026-08-01T00:00:00Z"
            - "GET /material-chemicals?material_id=${mat_s} as ComplianceAnalyst returns total_count == 0 - the denied write left no row"

      - name: rbac_shared_transition_endpoints_are_action_scoped_and_reject_the_wrong_role
        claim_type: shared_operations
        grounds:
          - roles.ComplianceAnalyst.shared_operations
          - roles.ToxicologyReviewer.exclusive_operations
          - roles.LabelingSpecialist.exclusive_operations
          - roles.RegulatoryCounsel.exclusive_operations
          - errors[ERR_UNAUTHORIZED]
        distinguishing_aspect: |
          Two roles share the transition endpoint but not the actions on it. ComplianceAnalyst may
          SUBMIT and REOPEN an assessment yet is denied PEER_REVIEW and FINALIZE; LabelingSpecialist
          may SUBMIT_FOR_APPROVAL a determination yet is denied APPROVE, and RegulatoryCounsel is
          denied SUBMIT_FOR_APPROVAL. Endpoint-level role checking alone would let all of these
          through.
        test_recipe:
          setup:
            - "Benzene is LISTED with NSRL 6.4 ug/day; product SKU-RB4 has one ACTIVE component of RM-RB4 (disclosure VERIFIED, Benzene 800.0 ppm) at 0.25 g/unit with contact_factor 0.5; a DRAFT MODELED/ORAL assessment exists; the clock is 2026-08-01T00:00:00Z."
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { current_utc: "2026-08-01T00:00:00Z" }
              as: RegistryAdmin
            - call: "POST /listed-chemicals"
              payload: { chemical_name: "Benzene", cas_number: "71-43-2", endpoint_type: "CANCER", safe_harbor_basis: "NSRL", safe_harbor_level_ug_per_day: 6.4 }
              as: RegistryAdmin
              captures: { chem_bz: $.data.id }
            - call: "POST /listed-chemicals/${chem_bz}/transitions"
              payload: { action: "LIST", listing_effective_date: "2026-01-01T00:00:00Z" }
              as: RegistryAdmin
            - call: "POST /suppliers"
              payload: { legal_name: "Northgate Polymers", contact_email: "qa@northgate.example" }
              as: ComplianceAnalyst
              captures: { sup_1: $.data.id }
            - call: "POST /materials"
              payload: { material_code: "RM-RB4", material_class: "RAW_MATERIAL", supplier_id: "${sup_1}" }
              as: ComplianceAnalyst
              captures: { mat_1: $.data.id }
            - call: "POST /materials/${mat_1}/chemicals"
              payload: { chemical_id: "${chem_bz}", declared_concentration_ppm: 800.0 }
              as: ComplianceAnalyst
            - call: "POST /materials/${mat_1}/disclosure"
              payload: { action: "REQUEST" }
              as: ComplianceAnalyst
            - call: "POST /materials/${mat_1}/disclosure"
              payload: { action: "RECORD_RESPONSE", response_completeness: "COMPLETE" }
              as: ComplianceAnalyst
            - call: "POST /materials/${mat_1}/disclosure"
              payload: { action: "VERIFY" }
              as: ComplianceAnalyst
            - call: "POST /products"
              payload: { sku: "SKU-RB4", product_name: "Action Scope Widget", product_category: "CONSUMER_GOOD", distribution_channels: ["RETAIL"], label_area_sq_in: 10.0, annual_units: 100 }
              as: RegistryAdmin
              captures: { prod_1: $.data.id }
            - call: "POST /products/${prod_1}/components"
              payload: { material_id: "${mat_1}", quantity_grams_per_unit: 0.25, contact_factor: 0.5 }
              as: ComplianceAnalyst
            - call: "POST /products/${prod_1}/exposure-assessments"
              payload: { chemical_id: "${chem_bz}", method: "MODELED", route: "ORAL", uses_per_day: 1.0 }
              as: ComplianceAnalyst
              as_user_id: "ca_1"
              captures: { asmt_1: $.data.id }
          trigger:
            - call: "POST /exposure-assessments/${asmt_1}/transitions"
              payload: { action: "SUBMIT" }
              as: ComplianceAnalyst
              as_user_id: "ca_1"
            - call: "POST /exposure-assessments/${asmt_1}/transitions"
              payload: { action: "PEER_REVIEW" }
              as: ComplianceAnalyst
              as_user_id: "ca_1"
            - call: "POST /exposure-assessments/${asmt_1}/transitions"
              payload: { action: "PEER_REVIEW" }
              as: ToxicologyReviewer
              as_user_id: "tox_1"
            - call: "POST /exposure-assessments/${asmt_1}/transitions"
              payload: { action: "FINALIZE" }
              as: ComplianceAnalyst
              as_user_id: "ca_1"
            - call: "POST /exposure-assessments/${asmt_1}/transitions"
              payload: { action: "FINALIZE" }
              as: ToxicologyReviewer
              as_user_id: "tox_1"
            - call: "GET /products/${prod_1}"
              payload: {}
              as: LabelingSpecialist
              captures: { pv_1: $.data.version }
            - call: "POST /warning-determinations"
              payload: { product_id: "${prod_1}", assessment_id: "${asmt_1}", decision: "WARNING_REQUIRED", expected_product_version: "${pv_1}" }
              as: LabelingSpecialist
              as_user_id: "ls_1"
              captures: { det_1: $.data.id }
            - call: "POST /warning-determinations/${det_1}/transitions"
              payload: { action: "SUBMIT_FOR_APPROVAL" }
              as: RegulatoryCounsel
              as_user_id: "rc_1"
            - call: "POST /warning-determinations/${det_1}/transitions"
              payload: { action: "SUBMIT_FOR_APPROVAL" }
              as: LabelingSpecialist
              as_user_id: "ls_1"
            - call: "POST /warning-determinations/${det_1}/transitions"
              payload: { action: "APPROVE" }
              as: LabelingSpecialist
              as_user_id: "ls_1"
            - call: "POST /warning-determinations/${det_1}/transitions"
              payload: { action: "APPROVE" }
              as: RegulatoryCounsel
              as_user_id: "rc_1"
          assert:
            - "first trigger call: HTTP 200, ExposureAssessment.${asmt_1}.status == SUBMITTED (SUBMIT is shared with ComplianceAnalyst)"
            - "second trigger call: HTTP 403 with error_id ERR_UNAUTHORIZED - PEER_REVIEW is ToxicologyReviewer-exclusive on an endpoint ComplianceAnalyst may otherwise call - and the status is still SUBMITTED"
            - "third trigger call: HTTP 200 with status PEER_REVIEWED and reviewed_by_user_id == tox_1"
            - "fourth trigger call: HTTP 403 with error_id ERR_UNAUTHORIZED for FINALIZE"
            - "fifth trigger call: HTTP 200 with status FINAL, daily_exposure_ug == 100.000, margin_ratio == 15.6250, result == AT_OR_ABOVE_SAFE_HARBOR and finalized_at == 2026-08-01T00:00:00Z"
            - "eighth trigger call: HTTP 403 with error_id ERR_UNAUTHORIZED - SUBMIT_FOR_APPROVAL is LabelingSpecialist-exclusive even though RegulatoryCounsel shares the endpoint"
            - "ninth trigger call: HTTP 200 with WarningDetermination.${det_1}.status == PENDING_APPROVAL"
            - "tenth trigger call: HTTP 403 with error_id ERR_UNAUTHORIZED - APPROVE is RegulatoryCounsel-exclusive - and the status is still PENDING_APPROVAL"
            - "eleventh trigger call: HTTP 200 with status APPROVED and approved_by_user_id == rc_1"

      - name: rbac_segregation_of_duties_blocks_reviewer_and_approver_reuse
        claim_type: segregation_of_duties
        grounds:
          - validations[priority=56]
          - errors[ERR_SEGREGATION_OF_DUTIES]
          - roles.ToxicologyReviewer
          - roles.RegulatoryCounsel
        distinguishing_aspect: |
          Segregation of duties is enforced on X-User-ID, not on X-User-Role: a user who submitted an
          assessment is refused its PEER_REVIEW even while presenting the ToxicologyReviewer role, and
          the user who prepared a determination is refused its APPROVE even while presenting
          RegulatoryCounsel. A different user id with the same role succeeds on the identical call, so
          the block is the identity and nothing else. Because the role check at priority 2 has already
          passed, the failure is ERR_SEGREGATION_OF_DUTIES at priority 56 rather than
          ERR_UNAUTHORIZED.
        test_recipe:
          setup:
            - "Benzene is LISTED with NSRL 6.4 ug/day; product SKU-SOD has one ACTIVE component of RM-SOD (disclosure VERIFIED, Benzene 800.0 ppm) at 0.25 g/unit with contact_factor 0.5; the clock is 2026-08-01T00:00:00Z."
            - "The assessment is submitted by user dual_1 wearing the ComplianceAnalyst role; the determination is prepared by user ls_1."
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { current_utc: "2026-08-01T00:00:00Z" }
              as: RegistryAdmin
            - call: "POST /listed-chemicals"
              payload: { chemical_name: "Benzene", cas_number: "71-43-2", endpoint_type: "CANCER", safe_harbor_basis: "NSRL", safe_harbor_level_ug_per_day: 6.4 }
              as: RegistryAdmin
              captures: { chem_bz: $.data.id }
            - call: "POST /listed-chemicals/${chem_bz}/transitions"
              payload: { action: "LIST", listing_effective_date: "2026-01-01T00:00:00Z" }
              as: RegistryAdmin
            - call: "POST /suppliers"
              payload: { legal_name: "Northgate Polymers", contact_email: "qa@northgate.example" }
              as: ComplianceAnalyst
              captures: { sup_1: $.data.id }
            - call: "POST /materials"
              payload: { material_code: "RM-SOD", material_class: "RAW_MATERIAL", supplier_id: "${sup_1}" }
              as: ComplianceAnalyst
              captures: { mat_1: $.data.id }
            - call: "POST /materials/${mat_1}/chemicals"
              payload: { chemical_id: "${chem_bz}", declared_concentration_ppm: 800.0 }
              as: ComplianceAnalyst
            - call: "POST /materials/${mat_1}/disclosure"
              payload: { action: "REQUEST" }
              as: ComplianceAnalyst
            - call: "POST /materials/${mat_1}/disclosure"
              payload: { action: "RECORD_RESPONSE", response_completeness: "COMPLETE" }
              as: ComplianceAnalyst
            - call: "POST /materials/${mat_1}/disclosure"
              payload: { action: "VERIFY" }
              as: ComplianceAnalyst
            - call: "POST /products"
              payload: { sku: "SKU-SOD", product_name: "Duties Widget", product_category: "CONSUMER_GOOD", distribution_channels: ["RETAIL"], label_area_sq_in: 10.0, annual_units: 100 }
              as: RegistryAdmin
              captures: { prod_1: $.data.id }
            - call: "POST /products/${prod_1}/components"
              payload: { material_id: "${mat_1}", quantity_grams_per_unit: 0.25, contact_factor: 0.5 }
              as: ComplianceAnalyst
            - call: "POST /products/${prod_1}/exposure-assessments"
              payload: { chemical_id: "${chem_bz}", method: "MODELED", route: "ORAL", uses_per_day: 1.0 }
              as: ComplianceAnalyst
              as_user_id: "dual_1"
              captures: { asmt_1: $.data.id }
            - call: "POST /exposure-assessments/${asmt_1}/transitions"
              payload: { action: "SUBMIT" }
              as: ComplianceAnalyst
              as_user_id: "dual_1"
          trigger:
            - call: "POST /exposure-assessments/${asmt_1}/transitions"
              payload: { action: "PEER_REVIEW" }
              as: ToxicologyReviewer
              as_user_id: "dual_1"
            - call: "POST /exposure-assessments/${asmt_1}/transitions"
              payload: { action: "PEER_REVIEW" }
              as: ToxicologyReviewer
              as_user_id: "tox_1"
            - call: "POST /exposure-assessments/${asmt_1}/transitions"
              payload: { action: "FINALIZE" }
              as: ToxicologyReviewer
              as_user_id: "tox_1"
            - call: "GET /products/${prod_1}"
              payload: {}
              as: LabelingSpecialist
              captures: { pv_1: $.data.version }
            - call: "POST /warning-determinations"
              payload: { product_id: "${prod_1}", assessment_id: "${asmt_1}", decision: "WARNING_REQUIRED", expected_product_version: "${pv_1}" }
              as: LabelingSpecialist
              as_user_id: "ls_1"
              captures: { det_1: $.data.id }
            - call: "POST /warning-determinations/${det_1}/transitions"
              payload: { action: "SUBMIT_FOR_APPROVAL" }
              as: LabelingSpecialist
              as_user_id: "ls_1"
            - call: "POST /warning-determinations/${det_1}/transitions"
              payload: { action: "APPROVE" }
              as: RegulatoryCounsel
              as_user_id: "ls_1"
            - call: "POST /warning-determinations/${det_1}/transitions"
              payload: { action: "APPROVE" }
              as: RegulatoryCounsel
              as_user_id: "rc_1"
          assert:
            - "ExposureAssessment.${asmt_1}.submitted_by_user_id == dual_1 after the setup SUBMIT"
            - "first trigger call: HTTP 409 with error_id ERR_SEGREGATION_OF_DUTIES (not ERR_UNAUTHORIZED - the ToxicologyReviewer role itself is allowed here) and the status is still SUBMITTED"
            - "second trigger call: HTTP 200 with status PEER_REVIEWED and reviewed_by_user_id == tox_1 - same role, different user id, identical payload"
            - "third trigger call: HTTP 200 with status FINAL and daily_exposure_ug == 100.000"
            - "WarningDetermination.${det_1}.prepared_by_user_id == ls_1"
            - "seventh trigger call: HTTP 409 with error_id ERR_SEGREGATION_OF_DUTIES - the preparer may not approve even while presenting RegulatoryCounsel - and the status is still PENDING_APPROVAL with approved_by_user_id null"
            - "eighth trigger call: HTTP 200 with status APPROVED and approved_by_user_id == rc_1"

  # ===========================================================================
  # SECTION 8 - cross_cutting_complexity_layers
  # active layers: optimistic_concurrency, cascading_side_effects,
  #                dual_variant_calculation, rate_threshold_triggers
  # ===========================================================================
  - section: cross_cutting_complexity_layers
    instances:

      - name: cc_stale_expected_product_version_rejected_then_fresh_version_accepted
        claim_type: optimistic_concurrency
        grounds:
          - concurrency_rules[determination-create-stale-product]
          - endpoints[POST /warning-determinations]
          - validations[priority=30]
          - errors[ERR_STALE_PRODUCT_VERSION]
        distinguishing_aspect: |
          The §1.2.1 rule for POST /warning-determinations is exercised on both sides of the same
          version: a determination create carrying the version observed before an unrelated PATCH is
          refused with 412, and the identical body carrying the re-read version succeeds. The version
          the client observed was made stale by a call that touched no determination at all - a product
          rename - which is what distinguishes OCC from a business-rule conflict. The create itself
          then bumps Product.version again, so every write on the parent is monotonic.
        test_recipe:
          setup:
            - "Benzene is LISTED with NSRL 6.4 ug/day; product SKU-OCC has one ACTIVE component of RM-OCC (disclosure VERIFIED, Benzene 800.0 ppm) at 0.25 g/unit with contact_factor 0.5 and a FINAL MODELED/ORAL assessment at 100.000 ug/day; the clock is 2026-08-01T00:00:00Z."
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { current_utc: "2026-08-01T00:00:00Z" }
              as: RegistryAdmin
            - call: "POST /listed-chemicals"
              payload: { chemical_name: "Benzene", cas_number: "71-43-2", endpoint_type: "CANCER", safe_harbor_basis: "NSRL", safe_harbor_level_ug_per_day: 6.4 }
              as: RegistryAdmin
              captures: { chem_bz: $.data.id }
            - call: "POST /listed-chemicals/${chem_bz}/transitions"
              payload: { action: "LIST", listing_effective_date: "2026-01-01T00:00:00Z" }
              as: RegistryAdmin
            - call: "POST /suppliers"
              payload: { legal_name: "Northgate Polymers", contact_email: "qa@northgate.example" }
              as: ComplianceAnalyst
              captures: { sup_1: $.data.id }
            - call: "POST /materials"
              payload: { material_code: "RM-OCC", material_class: "RAW_MATERIAL", supplier_id: "${sup_1}" }
              as: ComplianceAnalyst
              captures: { mat_1: $.data.id }
            - call: "POST /materials/${mat_1}/chemicals"
              payload: { chemical_id: "${chem_bz}", declared_concentration_ppm: 800.0 }
              as: ComplianceAnalyst
            - call: "POST /materials/${mat_1}/disclosure"
              payload: { action: "REQUEST" }
              as: ComplianceAnalyst
            - call: "POST /materials/${mat_1}/disclosure"
              payload: { action: "RECORD_RESPONSE", response_completeness: "COMPLETE" }
              as: ComplianceAnalyst
            - call: "POST /materials/${mat_1}/disclosure"
              payload: { action: "VERIFY" }
              as: ComplianceAnalyst
            - call: "POST /products"
              payload: { sku: "SKU-OCC", product_name: "Concurrency Widget", product_category: "CONSUMER_GOOD", distribution_channels: ["RETAIL"], label_area_sq_in: 10.0, annual_units: 100 }
              as: RegistryAdmin
              captures: { prod_1: $.data.id }
            - call: "POST /products/${prod_1}/components"
              payload: { material_id: "${mat_1}", quantity_grams_per_unit: 0.25, contact_factor: 0.5 }
              as: ComplianceAnalyst
            - call: "POST /products/${prod_1}/exposure-assessments"
              payload: { chemical_id: "${chem_bz}", method: "MODELED", route: "ORAL", uses_per_day: 1.0 }
              as: ComplianceAnalyst
              as_user_id: "ca_1"
              captures: { asmt_1: $.data.id }
            - call: "POST /exposure-assessments/${asmt_1}/transitions"
              payload: { action: "SUBMIT" }
              as: ComplianceAnalyst
              as_user_id: "ca_1"
            - call: "POST /exposure-assessments/${asmt_1}/transitions"
              payload: { action: "PEER_REVIEW" }
              as: ToxicologyReviewer
              as_user_id: "tox_1"
            - call: "POST /exposure-assessments/${asmt_1}/transitions"
              payload: { action: "FINALIZE" }
              as: ToxicologyReviewer
              as_user_id: "tox_1"
            - call: "GET /products/${prod_1}"
              payload: {}
              as: LabelingSpecialist
              captures: { pv_stale: $.data.version }
          trigger:
            - call: "PATCH /products/${prod_1}"
              payload: { product_name: "Concurrency Widget Mk II" }
              as: RegistryAdmin
            - call: "POST /warning-determinations"
              payload: { product_id: "${prod_1}", assessment_id: "${asmt_1}", decision: "WARNING_REQUIRED", expected_product_version: "${pv_stale}" }
              as: LabelingSpecialist
              as_user_id: "ls_1"
            - call: "GET /products/${prod_1}"
              payload: {}
              as: LabelingSpecialist
              captures: { pv_fresh: $.data.version }
            - call: "POST /warning-determinations"
              payload: { product_id: "${prod_1}", assessment_id: "${asmt_1}", decision: "WARNING_REQUIRED", expected_product_version: "${pv_fresh}" }
              as: LabelingSpecialist
              as_user_id: "ls_1"
              captures: { det_1: $.data.id }
            - call: "GET /products/${prod_1}"
              payload: {}
              as: LabelingSpecialist
          assert:
            - "first trigger call: HTTP 200 with Product.${prod_1}.product_name == Concurrency Widget Mk II and version == ${pv_stale} + 1"
            - "second trigger call: HTTP 412 with error_id ERR_STALE_PRODUCT_VERSION - the observed version was invalidated by a rename that touched no determination"
            - "after the 412: GET /warning-determinations?product_id=${prod_1} returns total_count == 0, and Product.${prod_1}.version is unchanged (a rejected write does not bump it)"
            - "third trigger call returns ${pv_fresh} == ${pv_stale} + 1"
            - "fourth trigger call: HTTP 201 with WarningDetermination.${det_1}.status == DRAFT, decision == WARNING_REQUIRED and prepared_by_user_id == ls_1"
            - "fifth trigger call: Product.${prod_1}.version == ${pv_fresh} + 1 - the successful determination create bumps its OCC parent, so a replay of the same body now fails with ERR_STALE_PRODUCT_VERSION too"
            - "the sibling rule settlement-create-stale-notice behaves identically on POST /notices/{notice_id}/settlements with expected_notice_version, asserted by val_stale_notice_version_reported_before_notice_not_negotiable"

      - name: cc_cascading_side_effects_chain_verified_end_to_end
        claim_type: cascading_side_effects
        grounds:
          - complexity_profile.complexity_layers
        distinguishing_aspect: |
          The scaffold's deepest chain is four levels (chemical revision -> assessment -> determination
          -> placement -> posture) and must be verified at every hop, including that a rejected call
          leaves no partial cascade.
        excluded_because:
          difficulty_instance: revise_safe_harbor_cascades_four_levels
          rationale: |
            The §1.8 transitive_cascade instance walks the whole chain and asserts each intermediate
            row; its siblings reformulation_verification_cascades_three_levels and
            disclosure_response_cascades_modeled_exposure_and_load cover the other two chains.

      - name: cc_dual_variant_calculation_delta_on_switch
        claim_type: dual_variant_calculation
        grounds:
          - complexity_profile.complexity_layers
        distinguishing_aspect: |
          Three calculations carry variants (exposure MODELED vs LAB_TESTED, defense score AS_OF_TODAY
          vs AS_OF_SERVICE_DATE); both branches and the delta on switching must be asserted.
        excluded_because:
          difficulty_instance: modeled_vs_lab_tested_diverge_on_incomplete_disclosure
          rationale: |
            The §1.8 dual_variant_calculation instances cover all three variant pairs on shared
            fixtures, including the half-LOQ versus zero divergence and the as-of date switch.

      - name: cc_rate_threshold_triggers_tested_at_the_boundary
        claim_type: rate_threshold_triggers
        grounds:
          - complexity_profile.complexity_layers
        distinguishing_aspect: |
          Three thresholds gate behaviour: exposure against the safe harbor level, annual units against
          the cure ceiling, and the settlement round ceiling; each must be probed exactly at the
          boundary and one step past it.
        excluded_because:
          difficulty_instance: cure_eligibility_at_exact_annual_unit_ceiling_and_one_above
          rationale: |
            The §1.8 boundary_precision_check instances probe the cure unit ceiling and the safe-harbor
            equality boundary from both sides; the settlement round ceiling is probed by
            val_settlement_round_ceiling_counts_counter_and_revise.

  # ===========================================================================
  # SECTION 9 - consistency_model  (immediate)
  # ===========================================================================
  - section: consistency_model
    instances:

      - name: consistency_immediate_visibility_of_posture_and_counters_after_every_write
        claim_type: immediate
        grounds:
          - complexity_profile.consistency_model
          - entities.Product.fields.compliance_posture
          - entities.Product.fields.open_notice_count
          - entities.Product.fields.total_listed_chemical_load_ug
        distinguishing_aspect: |
          Nothing in this API converges later. Each write's derived consequences - the recomputed load,
          the posture ladder, open_notice_count - are readable by the very next call with no delay, no
          retry and no reconciliation job, and the ladder walks both up and back down within one test:
          EXPOSURE_UNKNOWN -> WARNING_REQUIRED on FINALIZE, -> ENFORCEMENT_HOLD the instant a notice is
          served, and back to WARNING_REQUIRED the instant that notice is dismissed.
        test_recipe:
          setup:
            - "Benzene is LISTED with NSRL 6.4 ug/day; RM-CM (disclosure VERIFIED) declares Benzene at 800.0 ppm; product SKU-CM has annual_units 100 and no components yet; the clock is 2026-08-01T00:00:00Z."
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { current_utc: "2026-08-01T00:00:00Z" }
              as: RegistryAdmin
            - call: "POST /listed-chemicals"
              payload: { chemical_name: "Benzene", cas_number: "71-43-2", endpoint_type: "CANCER", safe_harbor_basis: "NSRL", safe_harbor_level_ug_per_day: 6.4 }
              as: RegistryAdmin
              captures: { chem_bz: $.data.id }
            - call: "POST /listed-chemicals/${chem_bz}/transitions"
              payload: { action: "LIST", listing_effective_date: "2026-01-01T00:00:00Z" }
              as: RegistryAdmin
            - call: "POST /suppliers"
              payload: { legal_name: "Northgate Polymers", contact_email: "qa@northgate.example" }
              as: ComplianceAnalyst
              captures: { sup_1: $.data.id }
            - call: "POST /materials"
              payload: { material_code: "RM-CM", material_class: "RAW_MATERIAL", supplier_id: "${sup_1}" }
              as: ComplianceAnalyst
              captures: { mat_1: $.data.id }
            - call: "POST /materials/${mat_1}/chemicals"
              payload: { chemical_id: "${chem_bz}", declared_concentration_ppm: 800.0 }
              as: ComplianceAnalyst
            - call: "POST /materials/${mat_1}/disclosure"
              payload: { action: "REQUEST" }
              as: ComplianceAnalyst
            - call: "POST /materials/${mat_1}/disclosure"
              payload: { action: "RECORD_RESPONSE", response_completeness: "COMPLETE" }
              as: ComplianceAnalyst
            - call: "POST /materials/${mat_1}/disclosure"
              payload: { action: "VERIFY" }
              as: ComplianceAnalyst
            - call: "POST /products"
              payload: { sku: "SKU-CM", product_name: "Immediate Widget", product_category: "CONSUMER_GOOD", distribution_channels: ["RETAIL"], label_area_sq_in: 10.0, annual_units: 100 }
              as: RegistryAdmin
              captures: { prod_1: $.data.id }
          trigger:
            - call: "POST /products/${prod_1}/components"
              payload: { material_id: "${mat_1}", quantity_grams_per_unit: 0.25, contact_factor: 0.5 }
              as: ComplianceAnalyst
              captures: { comp_1: $.data.id }
            - call: "GET /products/${prod_1}"
              payload: {}
              as: ComplianceAnalyst
            - call: "POST /products/${prod_1}/exposure-assessments"
              payload: { chemical_id: "${chem_bz}", method: "MODELED", route: "ORAL", uses_per_day: 1.0 }
              as: ComplianceAnalyst
              as_user_id: "ca_1"
              captures: { asmt_1: $.data.id }
            - call: "POST /exposure-assessments/${asmt_1}/transitions"
              payload: { action: "SUBMIT" }
              as: ComplianceAnalyst
              as_user_id: "ca_1"
            - call: "POST /exposure-assessments/${asmt_1}/transitions"
              payload: { action: "PEER_REVIEW" }
              as: ToxicologyReviewer
              as_user_id: "tox_1"
            - call: "POST /exposure-assessments/${asmt_1}/transitions"
              payload: { action: "FINALIZE" }
              as: ToxicologyReviewer
              as_user_id: "tox_1"
            - call: "GET /products/${prod_1}"
              payload: {}
              as: ComplianceAnalyst
            - call: "POST /notices"
              payload: { product_id: "${prod_1}", chemical_id: "${chem_bz}", noticing_party_name: "Coastal Watch Alliance", noticing_party_type: "PRIVATE_PARTY", alleged_violation_type: "FAILURE_TO_WARN", alleged_units: 100, earliest_violation_date: "2026-05-01T00:00:00Z", served_at: "2026-07-01T00:00:00Z" }
              as: RegulatoryCounsel
              as_user_id: "rc_1"
              captures: { notice_1: $.data.id }
            - call: "GET /products/${prod_1}"
              payload: {}
              as: RegulatoryCounsel
            - call: "POST /notices/${notice_1}/transitions"
              payload: { action: "EVALUATE" }
              as: RegulatoryCounsel
              as_user_id: "rc_1"
            - call: "POST /notices/${notice_1}/transitions"
              payload: { action: "DISMISS", evaluation_note: "No listed-chemical exposure above safe harbor at the alleged dates" }
              as: RegulatoryCounsel
              as_user_id: "rc_1"
            - call: "GET /products/${prod_1}"
              payload: {}
              as: RegulatoryCounsel
          assert:
            - "before the triggers: Product.${prod_1}.total_listed_chemical_load_ug == 0, compliance_posture == EXPOSURE_UNKNOWN, open_notice_count == 0"
            - "second trigger call: total_listed_chemical_load_ug == 200.000 already visible on the first read after the component create (800.0 x 0.25), with compliance_posture still EXPOSURE_UNKNOWN because no assessment is FINAL yet"
            - "third trigger call: the DRAFT assessment's response already carries daily_exposure_ug == 100.000, margin_ratio == 15.6250, result == AT_OR_ABOVE_SAFE_HARBOR and contribution_count == 1 - the calculation runs inside the create, not afterwards"
            - "seventh trigger call: compliance_posture == WARNING_REQUIRED immediately after FINALIZE, with no intervening call needed"
            - "eighth trigger call: the notice create response carries status RECEIVED and cure_deadline_at == 2026-08-30T00:00:00Z (served_at + 60 days)"
            - "ninth trigger call: open_notice_count == 1 and compliance_posture == ENFORCEMENT_HOLD on the read immediately following the notice create"
            - "twelfth trigger call: open_notice_count == 0 and compliance_posture == WARNING_REQUIRED again immediately after DISMISS, and accrued_penalty_cents is still 0"
            - "no assertion in this recipe requires a second read of the same endpoint to see the same value - every derived field is stable on its first observation"
