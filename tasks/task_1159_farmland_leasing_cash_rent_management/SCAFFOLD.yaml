# =============================================================================
# Task 1159: Farmland Leasing & Cash-Rent Management — seed tables
# =============================================================================

scenario: |
  1159. Farmland Leasing & Cash-Rent Management (farm management company): lease type (cash/flex/share) & rent formula, tenant selection & bidding, payment schedule & escalation clause, input-cost sharing & yield-share settlement, conservation practice requirement & tenant compliance, lease termination notice statutory deadline, landlord reporting & absentee owner communication, improvement & drainage cost allocation

difficulty_calibration: "hard than expert level"

domain_name: farmland-leasing
api_prefix: ""

complexity_profile:
  primary_archetype: compliance_audit
  secondary_archetype: ledger_reconciliation
  complexity_layers:
    - optimistic_concurrency
    - dual_variant_calculation
    - derived_field_reconciliation
    - scheduled_actions
  entity_topology: flat
  state_machine_shape: cyclic
  relationship_patterns:
    - one_to_many
    - cross_aggregate
  role_model: segregation_of_duties
  consistency_model: immediate

# =============================================================================
# §1.0 Response Envelope (FIXED)
# =============================================================================
response_envelope:
  success: |
    { "meta": { "api_request_id": "req_xxx", "api_request_timestamp": "ISO8601" },
      "response_type": "object" | "array", "data": {} }
  error: |
    { "meta": { ... }, "response_type": "error",
      "data": { "error_id": "ERR_XXX", "message": "..." } }
  pagination_fields: ["limit", "offset", "total_count", "has_more"]
  pagination_defaults: { limit: 10, min: 1, max: 100, offset: 0 }

# =============================================================================
# §1.1 Entity-Relationship Table (flat topology; all links are FK fields)
# =============================================================================
entities:
  - name: Landlord
    parent: null
    common_fields: true
    fields:
      - { name: name, type: string, source: input, description: "Landlord display name" }
      - { name: contact_email, type: string, source: input, description: "Owner contact email" }
      - { name: absentee, type: boolean, source: input, default: false, description: "True for absentee owners; drives report acknowledgment escalation" }
      - { name: report_channel, type: enum, source: input, default: EMAIL, description: "Preferred report delivery channel: EMAIL | MAIL | PORTAL", constraints: "enum EMAIL | MAIL | PORTAL" }
      - { name: ack_required_days, type: integer, source: input, default: 14, description: "Days an absentee owner has to acknowledge a report before escalation_required flips true", constraints: "> 0" }
      - { name: total_received_cents, type: integer, source: computed, default: 0, description: "Sum of paid_cents over all installments of all leases where landlord_id = this landlord (calc landlord_ledger_totals)" }
      - { name: pending_receivable_cents, type: integer, source: computed, default: 0, description: "Sum of (amount_cents + late_fee_cents - paid_cents) over installments in status OPEN or LATE of this landlord's leases" }

  - name: Tenant
    parent: null
    common_fields: true
    fields:
      - { name: name, type: string, source: input, description: "Tenant operator name" }
      - { name: years_experience, type: integer, source: input, description: "Farming experience in years, feeds bid_evaluation_score", constraints: ">= 0" }
      - { name: status, type: enum, source: system, description: "APPLICANT | APPROVED | SUSPENDED", constraints: "initial APPLICANT" }
      - { name: compliance_score, type: integer, source: computed, default: 100, description: "0..100 standing score; -15 per compliance record entering NON_COMPLIANT, +15 when such a record is WAIVED; floor 0 cap 100 (calc compliance_score_update)" }

  - name: Field
    parent: null
    common_fields: true
    fields:
      - { name: landlord_id, type: string, source: system, description: "FK -> Landlord.id; owning landlord" }
      - { name: name, type: string, source: input, description: "Field/tract name" }
      - { name: acres, type: integer, source: input, description: "Tillable acres", constraints: "> 0" }
      - { name: soil_csr2, type: number, source: input, description: "CSR2 soil productivity rating 0..100" }
      - { name: drainage_status, type: enum, source: input, default: ADEQUATE, description: "POOR | ADEQUATE | TILED; completing a TILE_DRAINAGE improvement sets it to TILED", constraints: "enum POOR | ADEQUATE | TILED" }
      - { name: status, type: enum, source: system, description: "AVAILABLE | LEASED; LEASED while any lease on this field is ACTIVE or TERMINATION_PENDING", constraints: "initial AVAILABLE" }

  - name: LeaseOffering
    parent: null
    common_fields: true
    fields:
      - { name: field_id, type: string, source: system, description: "FK -> Field.id; field being offered for lease" }
      - { name: term_years, type: integer, source: input, description: "Proposed lease term length in years", constraints: "1..5" }
      - { name: term_start_date, type: datetime, source: input, description: "Proposed lease start date (ISO8601)" }
      - { name: min_bid_per_acre_cents, type: integer, source: input, description: "Minimum acceptable cash_equivalent_bid_cents_per_acre", constraints: ">= 0" }
      - { name: reference_yield_bu_per_acre, type: integer, source: input, description: "Reference yield used in scoring estimates", constraints: "> 0" }
      - { name: reference_price_cents_per_bu, type: integer, source: input, description: "Reference commodity price used in scoring estimates", constraints: "> 0" }
      - { name: bid_deadline, type: datetime, source: input, description: "Bids accepted while offering OPEN and clock <= bid_deadline" }
      - { name: status, type: enum, source: system, description: "OPEN | CLOSED | AWARDED | CANCELLED", constraints: "initial OPEN" }
      - { name: eligible_bid_count, type: integer, source: computed, default: 0, description: "Count of bids on this offering with status in {SUBMITTED, SHORTLISTED}; recomputed on every bid create/revise/withdraw/award/cancel/suspension cascade" }

  - name: Bid
    parent: null
    common_fields: true
    fields:
      - { name: offering_id, type: string, source: system, description: "FK -> LeaseOffering.id; offering this bid targets" }
      - { name: tenant_id, type: string, source: system, description: "FK -> Tenant.id; set from X-User-ID of the creating Tenant caller" }
      - { name: lease_type, type: enum, source: input, description: "CASH | FLEX | SHARE", constraints: "enum CASH | FLEX | SHARE" }
      - { name: cash_bid_per_acre_cents, type: integer, source: input, description: "Fixed cash rent offer per acre; required when lease_type=CASH" }
      - { name: flex_base_per_acre_cents, type: integer, source: input, description: "Guaranteed base per acre; required when lease_type=FLEX" }
      - { name: flex_bonus_pct, type: number, source: input, description: "Landlord bonus share of revenue above trigger; required when FLEX, 0..1" }
      - { name: flex_cap_cents, type: integer, source: input, description: "Bonus cap per year; required when FLEX" }
      - { name: revenue_trigger_cents, type: integer, source: input, description: "Gross revenue above which the flex bonus applies; required when FLEX" }
      - { name: landlord_share_pct, type: number, source: input, description: "Landlord share of gross revenue; required when SHARE, 0..1" }
      - { name: input_share_pct, type: number, source: input, description: "Landlord share of approved input costs; required when SHARE, optional when FLEX, 0..1" }
      - { name: cash_equivalent_bid_cents_per_acre, type: integer, source: input, description: "Tenant-stated cash-equivalent offer per acre, used by bid_evaluation_score and min-bid check; always required" }
      - { name: evaluation_score, type: number, source: computed, description: "Weighted selection score, 4 decimal places (calc bid_evaluation_score)" }
      - { name: accepted_at, type: datetime, source: system, description: "Set when bid transitions to ACCEPTED; lease creation requires clock <= accepted_at + 30 days" }
      - { name: status, type: enum, source: system, description: "SUBMITTED | SHORTLISTED | ACCEPTED | REJECTED | WITHDRAWN", constraints: "initial SUBMITTED" }

  - name: Lease
    parent: null
    common_fields: true
    fields:
      - { name: bid_id, type: string, source: system, description: "FK -> Bid.id; awarded bid this lease originates from" }
      - { name: field_id, type: string, source: system, description: "FK -> Field.id; copied from the offering" }
      - { name: landlord_id, type: string, source: system, description: "FK -> Landlord.id; copied from the field" }
      - { name: tenant_id, type: string, source: system, description: "FK -> Tenant.id; copied from the bid" }
      - { name: lease_type, type: enum, source: system, description: "CASH | FLEX | SHARE; copied from the bid" }
      - { name: term_start_date, type: datetime, source: input, description: "Lease term start (inclusive); half-open interval [term_start_date, term_end_date)" }
      - { name: term_end_date, type: datetime, source: input, description: "Lease term end (exclusive); extended +1 year on each auto-renewal" }
      - { name: term_index, type: integer, source: system, default: 1, description: "1-based term-year counter, incremented on auto-renewal" }
      - { name: base_rent_cents_per_acre, type: integer, source: system, description: "CASH: bid.cash_bid_per_acre_cents; FLEX: bid.flex_base_per_acre_cents; SHARE: 0. Amended via PATCH; escalated on renewal" }
      - { name: revenue_trigger_cents, type: integer, source: system, description: "FLEX only: copied from bid" }
      - { name: landlord_bonus_pct, type: number, source: system, description: "FLEX only: copied from bid" }
      - { name: flex_cap_cents, type: integer, source: system, description: "FLEX only: copied from bid" }
      - { name: landlord_share_pct, type: number, source: system, description: "SHARE only: copied from bid" }
      - { name: input_share_pct, type: number, source: system, description: "SHARE (required) / FLEX (optional): copied from bid; null on CASH" }
      - { name: escalation_type, type: enum, source: input, default: NONE, description: "NONE | FIXED_PCT", constraints: "enum NONE | FIXED_PCT" }
      - { name: escalation_pct, type: number, source: input, description: "Annual escalation fraction, required iff escalation_type=FIXED_PCT, 0..0.25" }
      - { name: payment_pattern, type: enum, source: input, description: "MAR_NOV_50_50 | QUARTERLY | FULL_MAR | NONE; NONE typical for SHARE", constraints: "enum MAR_NOV_50_50 | QUARTERLY | FULL_MAR | NONE" }
      - { name: notice_lead_days, type: integer, source: input, default: 180, description: "Statutory lead days: termination notice must be served on or before term_end_date - notice_lead_days to be effective at current term end", constraints: "> 0" }
      - { name: conservation_practices, type: array, source: input, description: "Required practices: [{ practice_type: COVER_CROP|NO_TILL|BUFFER_STRIP|NUTRIENT_PLAN, due_date }]; editable only while DRAFT" }
      - { name: current_notice_deadline, type: datetime, source: computed, description: "= term_end_date - notice_lead_days; recomputed on each renewal" }
      - { name: landlord_credit_cents, type: integer, source: system, default: 0, description: "Credit owed back to tenant when a countersigned settlement true-up is negative" }
      - { name: status, type: enum, source: system, description: "DRAFT | ACTIVE | TERMINATION_PENDING | TERMINATED | CANCELLED", constraints: "initial DRAFT" }

  - name: PaymentInstallment
    parent: null
    common_fields: true
    fields:
      - { name: lease_id, type: string, source: system, description: "FK -> Lease.id; owning lease" }
      - { name: term_index, type: integer, source: system, description: "Term year this installment bills" }
      - { name: due_date, type: datetime, source: system, description: "Per payment_pattern: Mar 1 / Nov 1 (MAR_NOV_50_50), Mar/Jun/Sep/Dec 1 (QUARTERLY), Mar 1 (FULL_MAR)" }
      - { name: amount_cents, type: integer, source: computed, description: "Scheduled principal (calc rent_schedule_generation)" }
      - { name: late_fee_cents, type: integer, source: computed, default: 0, description: "5% of amount_cents, applied once when the installment flips OPEN -> LATE (calc late_fee_and_allocation)" }
      - { name: paid_cents, type: integer, source: system, default: 0, description: "Cumulative cash applied (fees first, then principal); reset to 0 by reverse_payment" }
      - { name: last_payment_at, type: datetime, source: system, description: "Clock timestamp of the most recent record_payment; null until first payment" }
      - { name: paid_recorded_by, type: string, source: system, description: "X-User-ID of the manager who recorded the latest record_payment; drives reverse segregation-of-duties" }
      - { name: status, type: enum, source: system, description: "SCHEDULED | OPEN | LATE | PAID | WAIVED", constraints: "initial SCHEDULED" }

  - name: HarvestSettlement
    parent: null
    common_fields: true
    fields:
      - { name: lease_id, type: string, source: system, description: "FK -> Lease.id; settled lease (FLEX or SHARE only)" }
      - { name: crop_year, type: integer, source: input, description: "Calendar year of harvest; maps to the term whose term_start year equals crop_year" }
      - { name: price_source, type: enum, source: input, description: "ESTIMATED (provisional estimate) | ACTUAL (final harvest price)", constraints: "enum ESTIMATED | ACTUAL" }
      - { name: yield_bu_per_acre, type: integer, source: input, description: "Actual or estimated yield", constraints: "> 0" }
      - { name: harvest_price_cents_per_bu, type: integer, source: input, description: "Actual or estimated harvest price per bushel", constraints: "> 0" }
      - { name: gross_revenue_cents, type: integer, source: computed, description: "= yield_bu_per_acre * harvest_price_cents_per_bu * field.acres" }
      - { name: landlord_amount_cents, type: integer, source: computed, description: "FLEX: base_rent*acres + bonus (calc flex_rent_computation); SHARE: round_half_up(gross * landlord_share_pct) (calc share_settlement)" }
      - { name: input_share_total_cents, type: integer, source: computed, description: "Sum of landlord_share_cents over APPROVED ExpenseRecords of this lease+crop_year (per-line rounding, calc share_settlement)" }
      - { name: net_settlement_cents, type: integer, source: computed, description: "= landlord_amount_cents - input_share_total_cents" }
      - { name: billed_amount_cents, type: integer, source: computed, description: "Sum of amount_cents over this lease's installments for the matching term_index, excluding any adjustment installments created by THIS settlement; computed at countersign (calc settlement_true_up)" }
      - { name: true_up_cents, type: integer, source: computed, description: "= net_settlement_cents - billed_amount_cents; >0 creates an adjustment installment, <0 credits Lease.landlord_credit_cents" }
      - { name: finalized_by, type: string, source: system, description: "X-User-ID of the manager who finalized (or refinalized); countersign requires a different X-User-ID" }
      - { name: status, type: enum, source: system, description: "PROVISIONAL | FINALIZED | DISPUTED | COUNTERSIGNED | VOID", constraints: "initial PROVISIONAL" }

  - name: ExpenseRecord
    parent: null
    common_fields: true
    fields:
      - { name: lease_id, type: string, source: system, description: "FK -> Lease.id; lease this input cost belongs to (FLEX or SHARE only)" }
      - { name: category, type: enum, source: input, description: "SEED | FERTILIZER | CHEMICAL | FUEL | OTHER", constraints: "enum SEED | FERTILIZER | CHEMICAL | FUEL | OTHER" }
      - { name: total_cost_cents, type: integer, source: input, description: "Full invoice cost fronted by the tenant", constraints: "> 0" }
      - { name: incurred_date, type: datetime, source: input, description: "Date the input was purchased" }
      - { name: crop_year, type: integer, source: input, description: "Settlement crop year this expense applies to" }
      - { name: landlord_share_pct, type: number, source: system, description: "Copied from Lease.input_share_pct at creation (0 when lease has none)" }
      - { name: landlord_share_cents, type: integer, source: computed, description: "= round_half_up(total_cost_cents * landlord_share_pct); per-line rounding pinned by calc share_settlement" }
      - { name: approved_at, type: datetime, source: system, description: "Clock timestamp when approved; null until APPROVED" }
      - { name: status, type: enum, source: system, description: "SUBMITTED | APPROVED | REJECTED", constraints: "initial SUBMITTED" }

  - name: ComplianceRecord
    parent: null
    common_fields: true
    fields:
      - { name: lease_id, type: string, source: system, description: "FK -> Lease.id; lease requiring the practice" }
      - { name: practice_type, type: enum, source: system, description: "COVER_CROP | NO_TILL | BUFFER_STRIP | NUTRIENT_PLAN; copied from lease.conservation_practices at activation" }
      - { name: due_date, type: datetime, source: system, description: "Practice completion due date, copied from the lease practice entry" }
      - { name: cure_deadline, type: datetime, source: computed, description: "= due_date + 30 days; sweep flips unresolved records to NON_COMPLIANT once clock > cure_deadline" }
      - { name: evidence_note, type: string, source: input, description: "Tenant evidence description at submit_evidence" }
      - { name: noncompliant_at, type: datetime, source: system, description: "Clock timestamp when the record entered NON_COMPLIANT; null otherwise" }
      - { name: verified_by, type: string, source: system, description: "X-User-ID of verifying manager; null until VERIFIED" }
      - { name: status, type: enum, source: system, description: "PENDING | EVIDENCE_SUBMITTED | REJECTED | VERIFIED | NON_COMPLIANT | WAIVED", constraints: "initial PENDING" }

  - name: ImprovementProject
    parent: null
    common_fields: true
    fields:
      - { name: field_id, type: string, source: system, description: "FK -> Field.id; field being improved" }
      - { name: lease_id, type: string, source: input, description: "FK -> Lease.id; optional linked lease whose tenant funds the tenant share; required for early-termination reimbursement" }
      - { name: project_type, type: enum, source: input, description: "TILE_DRAINAGE | IRRIGATION | LIMING | FENCING", constraints: "enum TILE_DRAINAGE | IRRIGATION | LIMING | FENCING" }
      - { name: total_cost_cents, type: integer, source: input, description: "Total project cost", constraints: "> 0" }
      - { name: landlord_share_pct, type: number, source: input, description: "Landlord cost share 0..1; landlord_share_pct + tenant_share_pct must equal 1.0" }
      - { name: tenant_share_pct, type: number, source: input, description: "Tenant cost share 0..1" }
      - { name: reimbursement_method, type: enum, source: input, description: "STRAIGHT_LINE | AGREED_VALUE (calc early_termination_reimbursement)", constraints: "enum STRAIGHT_LINE | AGREED_VALUE" }
      - { name: amortization_years, type: integer, source: input, description: "Years over which the tenant share amortizes", constraints: "1..10" }
      - { name: tenant_paid_cents, type: integer, source: computed, description: "= round_half_up(total_cost_cents * tenant_share_pct)" }
      - { name: completed_at, type: datetime, source: system, description: "Clock timestamp at completion; amortization epoch; null until COMPLETED" }
      - { name: reimbursement_due_cents, type: integer, source: computed, description: "Unamortized tenant contribution owed by landlord on early lease termination; null until computed" }
      - { name: reimbursement_status, type: enum, source: system, description: "NONE | DUE | PAID; parallel state dimension to status", constraints: "initial NONE" }
      - { name: status, type: enum, source: system, description: "PROPOSED | APPROVED | REJECTED | COMPLETED | CANCELLED", constraints: "initial PROPOSED" }

  - name: TerminationNotice
    parent: null
    common_fields: true
    fields:
      - { name: lease_id, type: string, source: system, description: "FK -> Lease.id; lease being terminated" }
      - { name: served_by, type: enum, source: input, description: "LANDLORD | TENANT; must match the caller's role", constraints: "enum LANDLORD | TENANT" }
      - { name: served_date, type: datetime, source: system, description: "Logical clock timestamp at creation" }
      - { name: statutory_deadline, type: datetime, source: computed, description: "= lease.term_end_date - lease.notice_lead_days, captured at serve time (calc statutory_notice_deadline)" }
      - { name: effective_date, type: datetime, source: computed, description: "= term_end_date when served_date <= statutory_deadline; otherwise the renewed term_end_date (next cycle)" }
      - { name: status, type: enum, source: system, description: "SERVED | EFFECTIVE | WITHDRAWN", constraints: "initial SERVED" }

  - name: OwnerReport
    parent: null
    common_fields: true
    fields:
      - { name: landlord_id, type: string, source: system, description: "FK -> Landlord.id; report recipient" }
      - { name: report_type, type: enum, source: input, description: "QUARTERLY | ANNUAL | SETTLEMENT | TERMINATION", constraints: "enum QUARTERLY | ANNUAL | SETTLEMENT | TERMINATION" }
      - { name: period_start, type: datetime, source: input, description: "Report window start (inclusive); closed interval" }
      - { name: period_end, type: datetime, source: input, description: "Report window end (inclusive); closed interval [period_start, period_end]" }
      - { name: rent_collected_cents, type: integer, source: computed, description: "Sum of paid_cents over installments of this landlord's leases whose last_payment_at falls in [period_start, period_end] inclusive (calc owner_report_aggregation)" }
      - { name: expenses_approved_cents, type: integer, source: computed, description: "Sum of landlord_share_cents over APPROVED expenses of this landlord's leases with approved_at in window (inclusive)" }
      - { name: noncompliant_count, type: integer, source: computed, description: "Count of compliance records of this landlord's leases with noncompliant_at in window (inclusive)" }
      - { name: sent_at, type: datetime, source: system, description: "Clock timestamp when SENT; null while DRAFT" }
      - { name: ack_due_date, type: datetime, source: computed, description: "= sent_at + landlord.ack_required_days; null while DRAFT" }
      - { name: acknowledged_at, type: datetime, source: system, description: "Clock timestamp of landlord acknowledgment; null until ACKNOWLEDGED" }
      - { name: escalation_required, type: boolean, source: computed, default: false, description: "Sweep sets true when landlord.absentee AND status=SENT AND clock > ack_due_date; acknowledgment clears it" }
      - { name: status, type: enum, source: system, description: "DRAFT | SENT | ACKNOWLEDGED", constraints: "initial DRAFT" }

# =============================================================================
# §1.2 State Machine Table
# =============================================================================
state_machines:
  - entity: Tenant
    initial_state: APPLICANT
    terminal_states: []
    transitions:
      - from: APPLICANT
        to: APPROVED
        trigger: "POST /tenants/{tenantId}/approve"
        actor: FarmManager
        preconditions: []
        side_effects: []
      - from: APPROVED
        to: SUSPENDED
        trigger: "POST /tenants/{tenantId}/suspend OR system (compliance cascade when compliance_score < 50)"
        actor: FarmManager | system
        preconditions: []
        side_effects:
          - "Every Bid of this tenant in status SUBMITTED or SHORTLISTED transitions to WITHDRAWN"
          - "Each affected LeaseOffering recomputes eligible_bid_count and re-runs bid_evaluation_score over the remaining eligible bids"
      - from: SUSPENDED
        to: APPROVED
        trigger: "POST /tenants/{tenantId}/approve"
        actor: FarmManager
        preconditions: []
        side_effects: []
        note: "Reinstatement is manual; previously withdrawn bids stay WITHDRAWN."

  - entity: LeaseOffering
    initial_state: OPEN
    terminal_states: [AWARDED, CANCELLED]
    transitions:
      - from: OPEN
        to: CLOSED
        trigger: "POST /offerings/{offeringId}/close"
        actor: FarmManager
        preconditions: []
        side_effects: []
      - from: OPEN
        to: CANCELLED
        trigger: "POST /offerings/{offeringId}/cancel"
        actor: FarmManager
        preconditions: []
        side_effects:
          - "All bids of this offering in SUBMITTED or SHORTLISTED transition to REJECTED; eligible_bid_count recomputed to 0"
      - from: CLOSED
        to: CANCELLED
        trigger: "POST /offerings/{offeringId}/cancel"
        actor: FarmManager
        preconditions: []
        side_effects:
          - "All bids of this offering in SUBMITTED or SHORTLISTED transition to REJECTED; eligible_bid_count recomputed to 0"
      - from: CLOSED
        to: AWARDED
        trigger: "POST /offerings/{offeringId}/award"
        actor: Landlord
        preconditions:
          - "Caller X-User-ID equals the landlord_id of the offering's field (ERR_NOT_RESOURCE_OWNER)"
          - "Request bid_id references a bid of this offering (ERR_NOT_FOUND)"
          - "That bid is SHORTLISTED (ERR_INVALID_STATE)"
        side_effects:
          - "Winning bid transitions SHORTLISTED -> ACCEPTED with accepted_at = clock"
          - "All other bids of this offering in SUBMITTED or SHORTLISTED transition to REJECTED; eligible_bid_count recomputed to 0"

  - entity: Bid
    initial_state: SUBMITTED
    terminal_states: [ACCEPTED, REJECTED, WITHDRAWN]
    transitions:
      - from: SUBMITTED
        to: SHORTLISTED
        trigger: "POST /bids/{bidId}/shortlist"
        actor: FarmManager
        preconditions:
          - "Offering of this bid is OPEN (ERR_INVALID_STATE)"
        side_effects:
          - "Offering eligible_bid_count and evaluation scores recomputed"
      - from: SHORTLISTED
        to: SUBMITTED
        trigger: "POST /bids/{bidId}/demote"
        actor: FarmManager
        preconditions: []
        side_effects:
          - "Offering eligible_bid_count and evaluation scores recomputed"
      - from: SUBMITTED
        to: WITHDRAWN
        trigger: "POST /bids/{bidId}/withdraw OR system (tenant suspension cascade)"
        actor: Tenant | system
        preconditions:
          - "Tenant caller owns the bid: bid.tenant_id == X-User-ID (ERR_NOT_RESOURCE_OWNER; system cascade exempt)"
        side_effects:
          - "Offering eligible_bid_count and evaluation scores recomputed"
      - from: SHORTLISTED
        to: WITHDRAWN
        trigger: "POST /bids/{bidId}/withdraw OR system (tenant suspension cascade)"
        actor: Tenant | system
        preconditions:
          - "Tenant caller owns the bid: bid.tenant_id == X-User-ID (ERR_NOT_RESOURCE_OWNER; system cascade exempt)"
        side_effects:
          - "Offering eligible_bid_count and evaluation scores recomputed"
      - from: SHORTLISTED
        to: ACCEPTED
        trigger: "system (POST /offerings/{offeringId}/award side effect)"
        actor: system
        preconditions: []
        side_effects:
          - "accepted_at = clock"
      - from: SUBMITTED
        to: REJECTED
        trigger: "system (award of another bid, or offering cancel)"
        actor: system
        preconditions: []
        side_effects: []
      - from: SHORTLISTED
        to: REJECTED
        trigger: "system (award of another bid, or offering cancel)"
        actor: system
        preconditions: []
        side_effects: []
    note: "Bid amounts may be revised via PATCH /bids/{bidId} while SUBMITTED (OCC on expected_bid_version); revision recomputes evaluation_score."

  - entity: Lease
    initial_state: DRAFT
    terminal_states: [TERMINATED, CANCELLED]
    transitions:
      - from: DRAFT
        to: ACTIVE
        trigger: "POST /leases/{leaseId}/activate"
        actor: FarmManager
        preconditions:
          - "Tenant status is APPROVED (ERR_TENANT_NOT_APPROVED)"
          - "Tenant has no ComplianceRecord in NON_COMPLIANT on any lease (ERR_TENANT_NONCOMPLIANT)"
          - "No other lease on the same field in ACTIVE or TERMINATION_PENDING overlaps [term_start_date, term_end_date), half-open (ERR_FIELD_LEASE_OVERLAP)"
        side_effects:
          - "Field transitions AVAILABLE -> LEASED"
          - "PaymentInstallments generated per payment_pattern (calc rent_schedule_generation); none when pattern NONE"
          - "One ComplianceRecord (PENDING) created per entry in conservation_practices"
      - from: DRAFT
        to: CANCELLED
        trigger: "POST /leases/{leaseId}/cancel"
        actor: FarmManager
        preconditions: []
        side_effects: []
      - from: ACTIVE
        to: TERMINATION_PENDING
        trigger: "system (POST /notices side effect)"
        actor: system
        preconditions: []
        side_effects: []
      - from: TERMINATION_PENDING
        to: ACTIVE
        trigger: "system (POST /notices/{noticeId}/withdraw side effect)"
        actor: system
        preconditions: []
        side_effects: []
        note: "If the clock has already passed current_notice_deadline, the next sweep re-renews the lease."
      - from: ACTIVE
        to: ACTIVE
        trigger: "system (auto-renewal sweep in POST /_clock/set_current_utc)"
        actor: system
        preconditions:
          - "clock > current_notice_deadline"
          - "No TerminationNotice of this lease in status SERVED"
        side_effects:
          - "term_index += 1; term_end_date += 1 year; current_notice_deadline recomputed"
          - "base_rent_cents_per_acre escalated (calc escalated_base_rent)"
          - "New-term PaymentInstallments generated per payment_pattern (calc rent_schedule_generation)"
          - "increments Lease.version by 1"
        note: "Statutory auto-renewal: missing the notice deadline renews the lease for one year."
      - from: TERMINATION_PENDING
        to: TERMINATED
        trigger: "system (TerminationNotice SERVED -> EFFECTIVE sweep side effect)"
        actor: system
        preconditions: []
        side_effects:
          - "Field transitions LEASED -> AVAILABLE"
          - "Every linked ImprovementProject in COMPLETED with reimbursement_status NONE computes reimbursement_due_cents (calc early_termination_reimbursement) and flips reimbursement_status NONE -> DUE"
          - "If landlord.absentee: a TERMINATION OwnerReport (DRAFT) is auto-created for the window [term_start_date of final term, effective_date]"
          - "Landlord pending_receivable_cents / total_received_cents recomputed (calc landlord_ledger_totals)"

  - entity: PaymentInstallment
    initial_state: SCHEDULED
    terminal_states: [WAIVED]
    note: "PAID is NOT terminal: reverse_payment (segregation-of-duties compensating action) reopens a PAID installment to OPEN or LATE."
    transitions:
      - from: SCHEDULED
        to: OPEN
        trigger: "system (sweep when clock >= due_date - 30 days)"
        actor: system
        preconditions: []
        side_effects:
          - "Landlord pending_receivable_cents recomputed (calc landlord_ledger_totals)"
      - from: OPEN
        to: LATE
        trigger: "system (sweep when clock > due_date + 10 days and paid_cents < amount_cents + late_fee_cents)"
        actor: system
        preconditions: []
        side_effects:
          - "late_fee_cents = round_half_up(amount_cents * 0.05), computed once at this transition"
          - "Landlord pending_receivable_cents recomputed"
      - from: OPEN
        to: PAID
        trigger: "POST /installments/{installmentId}/record_payment"
        actor: FarmManager
        preconditions:
          - "amount_cents input > 0 and <= outstanding (amount_cents + late_fee_cents - paid_cents) else ERR_PAYMENT_EXCEEDS_BALANCE"
        side_effects:
          - "Waterfall allocation: late fee first, then principal (calc late_fee_and_allocation); paid_cents += amount input"
          - "last_payment_at = clock; paid_recorded_by = X-User-ID"
          - "Landlord total_received_cents / pending_receivable_cents recomputed"
      - from: LATE
        to: PAID
        trigger: "POST /installments/{installmentId}/record_payment"
        actor: FarmManager
        preconditions:
          - "amount_cents input > 0 and <= outstanding (amount_cents + late_fee_cents - paid_cents) else ERR_PAYMENT_EXCEEDS_BALANCE"
        side_effects:
          - "Waterfall allocation: late fee first, then principal; paid_cents += amount input"
          - "last_payment_at = clock; paid_recorded_by = X-User-ID"
          - "Landlord total_received_cents / pending_receivable_cents recomputed"
      - from: PAID
        to: OPEN
        trigger: "POST /installments/{installmentId}/reverse_payment"
        actor: FarmManager
        preconditions:
          - "X-User-ID != paid_recorded_by (ERR_DUTY_SEGREGATION_VIOLATION)"
        side_effects:
          - "paid_cents reset to 0; paid_recorded_by cleared"
          - "If clock > due_date + 10 days the installment lands in LATE instead of OPEN (late_fee_cents retained)"
          - "Landlord total_received_cents / pending_receivable_cents recomputed"
        note: "Full reversal of all payments on the installment; compensating action for record_payment."
      - from: OPEN
        to: WAIVED
        trigger: "POST /installments/{installmentId}/waive"
        actor: FarmManager
        preconditions:
          - "Outstanding <= 100000 cents unless landlord_consent=true (ERR_WAIVER_EXCEEDS_AUTHORITY)"
        side_effects:
          - "Landlord pending_receivable_cents recomputed"
      - from: LATE
        to: WAIVED
        trigger: "POST /installments/{installmentId}/waive"
        actor: FarmManager
        preconditions:
          - "Outstanding <= 100000 cents unless landlord_consent=true (ERR_WAIVER_EXCEEDS_AUTHORITY)"
        side_effects:
          - "Landlord pending_receivable_cents recomputed"

  - entity: HarvestSettlement
    initial_state: PROVISIONAL
    terminal_states: [COUNTERSIGNED, VOID]
    transitions:
      - from: PROVISIONAL
        to: FINALIZED
        trigger: "POST /settlements/{settlementId}/finalize"
        actor: FarmManager
        preconditions:
          - "price_source == ACTUAL (ERR_PRICE_NOT_FINAL)"
        side_effects:
          - "input_share_total_cents refreshed from APPROVED expenses; amounts recomputed"
          - "finalized_by = X-User-ID"
      - from: PROVISIONAL
        to: VOID
        trigger: "system (superseded by a newer POST /settlements for the same lease_id + crop_year)"
        actor: system
        preconditions: []
        side_effects: []
      - from: FINALIZED
        to: DISPUTED
        trigger: "POST /settlements/{settlementId}/dispute"
        actor: Tenant | Landlord
        preconditions:
          - "Caller is a party: lease.tenant_id == X-User-ID or lease.landlord_id == X-User-ID (ERR_NOT_RESOURCE_OWNER)"
        side_effects: []
      - from: DISPUTED
        to: FINALIZED
        trigger: "POST /settlements/{settlementId}/refinalize"
        actor: FarmManager
        preconditions: []
        side_effects:
          - "yield_bu_per_acre / harvest_price_cents_per_bu replaced; all computed amounts recomputed; finalized_by = X-User-ID"
      - from: FINALIZED
        to: COUNTERSIGNED
        trigger: "POST /settlements/{settlementId}/countersign"
        actor: FarmManager
        preconditions:
          - "X-User-ID != finalized_by (ERR_DUTY_SEGREGATION_VIOLATION)"
        side_effects:
          - "billed_amount_cents and true_up_cents computed (calc settlement_true_up)"
          - "If true_up_cents > 0: an adjustment PaymentInstallment (amount = true_up_cents, due = clock + 30 days, current term_index, status SCHEDULED) is created"
          - "If true_up_cents < 0: Lease.landlord_credit_cents += |true_up_cents|"
          - "Landlord totals recomputed"

  - entity: ExpenseRecord
    initial_state: SUBMITTED
    terminal_states: [APPROVED, REJECTED]
    transitions:
      - from: SUBMITTED
        to: APPROVED
        trigger: "POST /expenses/{expenseId}/approve"
        actor: FarmManager
        preconditions: []
        side_effects:
          - "approved_at = clock"
      - from: SUBMITTED
        to: REJECTED
        trigger: "POST /expenses/{expenseId}/reject"
        actor: FarmManager
        preconditions: []
        side_effects: []

  - entity: ComplianceRecord
    initial_state: PENDING
    terminal_states: [VERIFIED, WAIVED]
    transitions:
      - from: PENDING
        to: EVIDENCE_SUBMITTED
        trigger: "POST /compliance-records/{recordId}/submit_evidence"
        actor: Tenant
        preconditions:
          - "Caller is the lease tenant: lease.tenant_id == X-User-ID (ERR_NOT_RESOURCE_OWNER)"
        side_effects: []
      - from: REJECTED
        to: EVIDENCE_SUBMITTED
        trigger: "POST /compliance-records/{recordId}/submit_evidence"
        actor: Tenant
        preconditions:
          - "Caller is the lease tenant: lease.tenant_id == X-User-ID (ERR_NOT_RESOURCE_OWNER)"
        side_effects: []
        note: "Resubmission cycle: REJECTED evidence may be replaced before the cure deadline."
      - from: EVIDENCE_SUBMITTED
        to: VERIFIED
        trigger: "POST /compliance-records/{recordId}/verify"
        actor: FarmManager
        preconditions: []
        side_effects:
          - "verified_by = X-User-ID"
      - from: EVIDENCE_SUBMITTED
        to: REJECTED
        trigger: "POST /compliance-records/{recordId}/reject_evidence"
        actor: FarmManager
        preconditions: []
        side_effects: []
      - from: PENDING
        to: NON_COMPLIANT
        trigger: "system (sweep when clock > cure_deadline)"
        actor: system
        preconditions: []
        side_effects:
          - "noncompliant_at = clock"
          - "Tenant.compliance_score = max(0, compliance_score - 15) (calc compliance_score_update)"
          - "If the score change drops compliance_score < 50 and the tenant is APPROVED: Tenant -> SUSPENDED, and that suspension itself cascades: the tenant's bids in SUBMITTED or SHORTLISTED -> WITHDRAWN, and each affected offering recomputes eligible_bid_count and evaluation scores"
      - from: EVIDENCE_SUBMITTED
        to: NON_COMPLIANT
        trigger: "system (sweep when clock > cure_deadline)"
        actor: system
        preconditions: []
        side_effects:
          - "noncompliant_at = clock; same tenant score and suspension cascade as the PENDING -> NON_COMPLIANT transition"
      - from: REJECTED
        to: NON_COMPLIANT
        trigger: "system (sweep when clock > cure_deadline)"
        actor: system
        preconditions: []
        side_effects:
          - "noncompliant_at = clock; same tenant score and suspension cascade as the PENDING -> NON_COMPLIANT transition"
      - from: PENDING
        to: WAIVED
        trigger: "POST /compliance-records/{recordId}/waive"
        actor: FarmManager
        preconditions: []
        side_effects: []
      - from: EVIDENCE_SUBMITTED
        to: WAIVED
        trigger: "POST /compliance-records/{recordId}/waive"
        actor: FarmManager
        preconditions: []
        side_effects: []
      - from: REJECTED
        to: WAIVED
        trigger: "POST /compliance-records/{recordId}/waive"
        actor: FarmManager
        preconditions: []
        side_effects: []
      - from: NON_COMPLIANT
        to: WAIVED
        trigger: "POST /compliance-records/{recordId}/waive"
        actor: FarmManager
        preconditions: []
        side_effects:
          - "Tenant.compliance_score = min(100, compliance_score + 15); tenant status is NOT changed back (reinstatement is via POST /tenants/{tenantId}/approve)"

  - entity: ImprovementProject
    initial_state: PROPOSED
    terminal_states: [REJECTED, COMPLETED, CANCELLED]
    note: "Parallel state dimensions: status (lifecycle) x reimbursement_status (NONE | DUE | PAID) evolve independently after COMPLETED."
    transitions:
      - from: PROPOSED
        to: APPROVED
        trigger: "POST /improvements/{improvementId}/approve"
        actor: Landlord
        preconditions:
          - "Caller owns the field: field.landlord_id == X-User-ID (ERR_NOT_RESOURCE_OWNER)"
          - "If lease_id is set, that lease must be ACTIVE (ERR_IMPROVEMENT_LEASE_NOT_ACTIVE)"
        side_effects: []
      - from: PROPOSED
        to: REJECTED
        trigger: "POST /improvements/{improvementId}/reject"
        actor: Landlord
        preconditions:
          - "Caller owns the field (ERR_NOT_RESOURCE_OWNER)"
        side_effects: []
      - from: APPROVED
        to: COMPLETED
        trigger: "POST /improvements/{improvementId}/complete"
        actor: FarmManager
        preconditions: []
        side_effects:
          - "completed_at = clock"
          - "If project_type == TILE_DRAINAGE: Field.drainage_status = TILED"
      - from: APPROVED
        to: CANCELLED
        trigger: "POST /improvements/{improvementId}/cancel"
        actor: FarmManager
        preconditions: []
        side_effects: []
      - from: COMPLETED
        to: COMPLETED
        trigger: "system (lease termination computes reimbursement) and POST /improvements/{improvementId}/mark_reimbursed"
        actor: system | FarmManager
        preconditions: []
        side_effects:
          - "reimbursement_status NONE -> DUE when the linked lease TERMINATES before amortization ends (calc early_termination_reimbursement)"
          - "reimbursement_status DUE -> PAID via mark_reimbursed"

  - entity: TerminationNotice
    initial_state: SERVED
    terminal_states: [EFFECTIVE, WITHDRAWN]
    transitions:
      - from: SERVED
        to: EFFECTIVE
        trigger: "system (sweep when clock >= effective_date)"
        actor: system
        preconditions: []
        side_effects:
          - "Lease TERMINATION_PENDING -> TERMINATED (which itself cascades: field -> AVAILABLE, linked completed improvements compute reimbursement_due_cents and flip NONE -> DUE, absentee landlord gets an auto-created TERMINATION OwnerReport DRAFT, landlord ledger totals recomputed)"
      - from: SERVED
        to: WITHDRAWN
        trigger: "POST /notices/{noticeId}/withdraw"
        actor: Landlord | Tenant
        preconditions:
          - "Caller is the serving party and a party to the lease (ERR_NOT_RESOURCE_OWNER)"
        side_effects:
          - "Lease TERMINATION_PENDING -> ACTIVE"

  - entity: OwnerReport
    initial_state: DRAFT
    terminal_states: [ACKNOWLEDGED]
    transitions:
      - from: DRAFT
        to: SENT
        trigger: "POST /reports/{reportId}/send"
        actor: FarmManager
        preconditions: []
        side_effects:
          - "sent_at = clock; ack_due_date = sent_at + landlord.ack_required_days"
      - from: SENT
        to: ACKNOWLEDGED
        trigger: "POST /reports/{reportId}/acknowledge"
        actor: Landlord
        preconditions:
          - "Caller is the recipient: report.landlord_id == X-User-ID (ERR_NOT_RESOURCE_OWNER)"
        side_effects:
          - "acknowledged_at = clock; escalation_required = false"
    note: "escalation_required is a computed flag, not a status: the sweep sets it true when landlord.absentee AND status == SENT AND clock > ack_due_date."

# =============================================================================
# §1.2.1 Concurrency Rules (OCC on parent version; no wall-clock mechanisms)
# =============================================================================
concurrency_rules:
  - rule_id: lease-amend-stale-version
    parent_entity: Lease
    write_endpoint: "PATCH /leases/{leaseId}"
    occ_field: "expected_lease_version"
    description: |
      Amending a Lease whose version has advanced since the client last
      observed it is rejected. The natural product semantics allow any number
      of sequential amendments; only the stale version blocks the write, so
      the conflict is resolved by OCC on Lease.version.
    error_id: ERR_STALE_VERSION
    http_status: 412
  - rule_id: settlement-create-stale-lease
    parent_entity: Lease
    write_endpoint: "POST /settlements"
    occ_field: "expected_lease_version"
    description: |
      Creating a HarvestSettlement against a Lease whose version has advanced
      since the client last observed it is rejected. A new settlement for the
      same lease_id + crop_year legitimately supersedes the prior PROVISIONAL
      one, so the only thing that blocks the second create is the stale
      Lease.version observed by the client.
    error_id: ERR_STALE_VERSION
    http_status: 412
  - rule_id: bid-revise-stale-version
    parent_entity: Bid
    write_endpoint: "PATCH /bids/{bidId}"
    occ_field: "expected_bid_version"
    description: |
      Revising a Bid whose version has advanced since the client last
      observed it is rejected. Sequential revisions of a SUBMITTED bid are
      otherwise legitimate, so the conflict is resolved by OCC on Bid.version.
    error_id: ERR_STALE_VERSION
    http_status: 412

# =============================================================================
# §1.3 Calculation Rules Table
# =============================================================================
calculations:
  - name: rent_schedule_generation
    trigger: "Lease activation (POST /leases/{leaseId}/activate) and auto-renewal sweep"
    algorithm: forward_looking
    formula: |
      annual_rent_cents = base_rent_cents_per_acre * field.acres
      For each 12-month term year (term_index) within [term_start_date, term_end_date):
        MAR_NOV_50_50: dues Mar 1 and Nov 1 of the term year;
          first = round_half_up(annual_rent_cents * 0.5); second = annual_rent_cents - first
        QUARTERLY: dues Mar 1, Jun 1, Sep 1, Dec 1;
          first three = round_half_up(annual_rent_cents * 0.25); fourth = annual_rent_cents - 3 * quarter
        FULL_MAR: single installment due Mar 1 = annual_rent_cents
        NONE: no installments
      Rounding order pinned: per-installment round_half_up FIRST, remainder allocated to the LAST installment of the term year.
    input_set: "The lease being activated/renewed and its field.acres"
    precision: "integer cents, round_half_up"
    constants:
      LATE_FEE_PCT: 0.05
      GRACE_DAYS: 10
      OPEN_LEAD_DAYS: 30

  - name: escalated_base_rent
    trigger: "auto-renewal sweep (Lease ACTIVE -> ACTIVE)"
    algorithm: threshold
    formula: |
      NONE: new_base = base_rent_cents_per_acre (unchanged)
      FIXED_PCT: new_base = round_half_up(base_rent_cents_per_acre * (1 + escalation_pct))
      Evaluation order pinned: compounding applies the rounded value of the previous term,
      NOT the original base — base_n = round_half_up(base_(n-1) * (1 + pct)).
    input_set: "The renewing lease"
    precision: "integer cents, round_half_up per term year before next compounding"
    variants:
      - name: none_flat
        when: "escalation_type == NONE"
        difference: "base carries forward unchanged"
      - name: fixed_pct_compounded
        when: "escalation_type == FIXED_PCT"
        difference: "per-year rounded compound; differs from compounding the unrounded original base"

  - name: flex_rent_computation
    trigger: "POST /settlements (create), POST /settlements/{settlementId}/refinalize"
    algorithm: tiered_pricing
    formula: |
      gross_revenue_cents = yield_bu_per_acre * harvest_price_cents_per_bu * field.acres
      base_total_cents = lease.base_rent_cents_per_acre * field.acres
      raw_bonus = (gross_revenue_cents - lease.revenue_trigger_cents) * lease.landlord_bonus_pct
      bonus_cents = 0 if raw_bonus <= 0 else min(lease.flex_cap_cents, round_half_up(raw_bonus))
      landlord_amount_cents = base_total_cents + bonus_cents
      Boundary pinned: bonus applies only when gross_revenue_cents > revenue_trigger_cents;
      at exact equality raw_bonus == 0 and bonus is 0.
    input_set: "The settlement row + its lease + field; lease_type must be FLEX"
    precision: "integer cents, round_half_up applied to the bonus before the cap min()"
    variants:
      - name: provisional
        when: "price_source == ESTIMATED"
        difference: "uses the estimated harvest price; produces a different landlord_amount_cents than final for identical lease parameters"
      - name: final
        when: "price_source == ACTUAL"
        difference: "uses the actual harvest price; only ACTUAL settlements can be FINALIZED"

  - name: share_settlement
    trigger: "POST /settlements (create), POST /settlements/{settlementId}/refinalize"
    algorithm: aggregation
    formula: |
      landlord_amount_cents = round_half_up(gross_revenue_cents * lease.landlord_share_pct)
      For each ExpenseRecord of this lease + crop_year in status APPROVED:
        landlord_share_cents = round_half_up(total_cost_cents * landlord_share_pct)   # per line
      input_share_total_cents = SUM of the per-line rounded landlord_share_cents
      net_settlement_cents = landlord_amount_cents - input_share_total_cents
      Rounding order pinned: round EACH expense line to integer cents first, THEN sum.
      (Sum-then-round produces a different cent total on half-cent lines and is forbidden.)
    input_set: "SHARE leases: expenses with status APPROVED only (SUBMITTED/REJECTED excluded); for FLEX leases the same per-line sum runs with lease.input_share_pct (0 when null)"
    precision: "integer cents, round_half_up per expense line"
    variants:
      - name: provisional
        when: "price_source == ESTIMATED"
        difference: "estimated price drives gross_revenue_cents; informational only"
      - name: final
        when: "price_source == ACTUAL"
        difference: "actual price; required for finalize"

  - name: settlement_true_up
    trigger: "POST /settlements/{settlementId}/countersign"
    algorithm: aggregation
    formula: |
      Evaluation order pinned (circular-looking dependency made explicit):
      1. billed_amount_cents = SUM(amount_cents) over the lease's installments whose
         term_index maps to the settlement's crop_year, EXCLUDING any adjustment
         installment created by THIS settlement (prior settlements' adjustment
         installments ARE included).
      2. true_up_cents = net_settlement_cents - billed_amount_cents
      3. If true_up_cents > 0 create the adjustment installment (due = clock + 30 days);
         this new installment never feeds back into step 1 for this settlement.
      4. If true_up_cents < 0: Lease.landlord_credit_cents += |true_up_cents|.
    input_set: "Installments of the settlement's lease for the mapped term_index, any status except none excluded (CANCELLED does not exist for installments)"
    precision: "integer cents"

  - name: late_fee_and_allocation
    trigger: "sweep (OPEN -> LATE) and POST /installments/{installmentId}/record_payment"
    algorithm: chronological
    formula: |
      Late fee: applied once at the OPEN -> LATE transition:
        late_fee_cents = round_half_up(amount_cents * LATE_FEE_PCT)
      Payment allocation waterfall per record_payment call:
        outstanding = amount_cents + late_fee_cents - paid_cents
        Reject when input amount_cents > outstanding (ERR_PAYMENT_EXCEEDS_BALANCE).
        Apply to the late-fee portion first, then principal.
        status -> PAID exactly when paid_cents >= amount_cents + late_fee_cents
        (boundary pinned: equality pays in full).
      Cross-installment ordering (when reporting or auto-allocating): due_date ASC,
      tie-break created_at ASC. Random id is never used for ordering.
    input_set: "The single installment receiving the payment"
    precision: "integer cents, round_half_up"
    constants:
      LATE_FEE_PCT: 0.05
      GRACE_DAYS: 10

  - name: statutory_notice_deadline
    trigger: "POST /notices"
    algorithm: threshold
    formula: |
      statutory_deadline = lease.term_end_date - lease.notice_lead_days (captured at serve time)
      served_date = logical clock at creation
      Boundary pinned: served_date <= statutory_deadline is ON TIME (<=, not <);
      effective_date = term_end_date when on time, else the term_end_date AFTER the
      auto-renewal that the missed deadline triggers (i.e., the next cycle's end).
    input_set: "The lease referenced by the notice"
    precision: "date precision at day granularity (T00:00:00Z values)"
    constants:
      DEFAULT_NOTICE_LEAD_DAYS: 180

  - name: auto_renewal_sweep
    trigger: "POST /_clock/set_current_utc"
    algorithm: threshold
    formula: |
      For each Lease in ACTIVE with no TerminationNotice in SERVED:
        if clock > lease.current_notice_deadline:
          renew: term_index += 1, term_end_date += 1 year,
          current_notice_deadline = term_end_date - notice_lead_days,
          base = escalated_base_rent(base), generate new-term installments,
          Lease.version += 1.
      Boundary pinned: clock exactly == current_notice_deadline does NOT renew
      (renewal requires strictly greater); a notice served exactly on the deadline
      is on time and blocks renewal.
    input_set: "All leases in ACTIVE"
    precision: "day granularity"

  - name: bid_evaluation_score
    trigger: "POST /bids, PATCH /bids/{bidId}, bid withdraw/shortlist/demote, award, tenant-suspension cascade (recomputed for all eligible bids of the offering)"
    algorithm: weighted_scoring
    formula: |
      eligible bids = bids of the offering in status SUBMITTED or SHORTLISTED
      max_ce = max(cash_equivalent_bid_cents_per_acre) over eligible bids
      For each eligible bid:
        rent_component = cash_equivalent_bid_cents_per_acre / max_ce   (1.0 when alone)
        compliance_component = tenant.compliance_score / 100
        experience_component = min(tenant.years_experience, 20) / 20
        evaluation_score = round_half_up_4dp(0.6 * rent_component + 0.25 * compliance_component + 0.15 * experience_component)
      Recommendation order: evaluation_score DESC; ties broken by Bid.created_at ASC
      (never by random id).
    input_set: "Eligible bids of one offering only"
    precision: "4 decimal places, round_half_up"
    constants:
      W_RENT: 0.6
      W_COMPLIANCE: 0.25
      W_EXPERIENCE: 0.15
      EXPERIENCE_CAP_YEARS: 20

  - name: early_termination_reimbursement
    trigger: "system (Lease TERMINATION_PENDING -> TERMINATED side effect) for each linked COMPLETED ImprovementProject with reimbursement_status NONE"
    algorithm: decay_function
    formula: |
      elapsed_days = days between completed_at and notice effective_date
      STRAIGHT_LINE:
        total_days = amortization_years * 365 (365-day years pinned; no leap handling)
        remaining_days = max(0, total_days - elapsed_days)
        reimbursement_due_cents = round_half_up(tenant_paid_cents * remaining_days / total_days)
      AGREED_VALUE (residual schedule by elapsed year bucket = floor(elapsed_days / 365)):
        bucket 0 -> 100%, 1 -> 75%, 2 -> 55%, 3 -> 35%, 4 -> 15%, >= 5 -> 0%
        reimbursement_due_cents = round_half_up(tenant_paid_cents * residual_pct)
      If elapsed_days >= total_days: reimbursement_due_cents = 0 for both variants.
      Then reimbursement_status NONE -> DUE (even when the computed amount is 0).
    input_set: "COMPLETED improvements with lease_id == the terminated lease"
    precision: "integer cents, round_half_up"
    variants:
      - name: straight_line
        when: "reimbursement_method == STRAIGHT_LINE"
        difference: "linear day-prorated residual; for identical cost/timing it produces a different amount than agreed_value"
      - name: agreed_value
        when: "reimbursement_method == AGREED_VALUE"
        difference: "stepwise contractual residual schedule"
    constants:
      DAYS_PER_YEAR: 365
      AGREED_VALUE_RESIDUAL_PCT: [1.0, 0.75, 0.55, 0.35, 0.15, 0.0]

  - name: compliance_score_update
    trigger: "ComplianceRecord -> NON_COMPLIANT (sweep) and NON_COMPLIANT -> WAIVED (waive)"
    algorithm: threshold
    formula: |
      On NON_COMPLIANT: tenant.compliance_score = max(0, score - 15)
        If score < SUSPENSION_THRESHOLD (50) and tenant is APPROVED: tenant -> SUSPENDED
        (boundary pinned: score exactly 50 does NOT suspend; strictly below).
      On WAIVED from NON_COMPLIANT: tenant.compliance_score = min(100, score + 15);
        status is unchanged (manual reinstatement only).
    input_set: "The compliance record's lease tenant"
    precision: "integer score"
    constants:
      NON_COMPLIANCE_PENALTY: 15
      SUSPENSION_THRESHOLD: 50
      SCORE_FLOOR: 0
      SCORE_CAP: 100

  - name: landlord_ledger_totals
    trigger: "installment create/pay/reverse/waive, OPEN/LATE transitions, lease termination, settlement countersign"
    algorithm: aggregation
    formula: |
      landlord.total_received_cents = SUM(paid_cents) over all installments of all leases
        with landlord_id == this landlord (any status)
      landlord.pending_receivable_cents = SUM(amount_cents + late_fee_cents - paid_cents)
        over installments in status OPEN or LATE of this landlord's leases
      Recomputed on every triggering mutation (immediate consistency).
    input_set: "All installments joined through leases where lease.landlord_id == landlord"
    precision: "integer cents"

  - name: owner_report_aggregation
    trigger: "POST /reports"
    algorithm: aggregation
    formula: |
      Window is the CLOSED interval [period_start, period_end] (both ends inclusive).
      rent_collected_cents = SUM(paid_cents) over installments of this landlord's leases
        whose last_payment_at falls inside the window.
        An installment contributes its full current paid_cents to the window containing
        its most recent payment; installments never paid contribute 0.
      expenses_approved_cents = SUM(landlord_share_cents) over APPROVED ExpenseRecords of
        this landlord's leases with approved_at inside the window.
      noncompliant_count = COUNT of ComplianceRecords of this landlord's leases with
        noncompliant_at inside the window.
      Empty window pins: no matching rows -> 0 (not null, not an error).
    input_set: "Entities reachable through leases where lease.landlord_id == report.landlord_id"
    precision: "integer cents / integer count"

# =============================================================================
# §1.4 Validation Rules Table (ordered by priority)
# =============================================================================
validations:
  - priority: 1
    category: auth
    check: "X-User-ID and X-User-Role headers must be present and well-formed"
    error_id: ERR_MISSING_OR_INVALID_USER_CONTEXT_HEADER
    http_status: 400
    applies_to: "all endpoints"

  - priority: 2
    category: auth
    check: "Caller role must be listed in the endpoint's roles"
    error_id: ERR_FORBIDDEN_FOR_ROLE
    http_status: 403
    applies_to: "all endpoints"

  - priority: 3
    category: business_constraint
    check: "Request body shape: required fields present, enum members valid, integer amounts > 0 where required, conditional bid parameters present per lease_type (CASH: cash_bid_per_acre_cents; FLEX: flex_base_per_acre_cents + flex_bonus_pct + flex_cap_cents + revenue_trigger_cents; SHARE: landlord_share_pct + input_share_pct), escalation_pct present iff escalation_type=FIXED_PCT, term_end_date > term_start_date, conservation_practices editable via PATCH only while DRAFT, notice served_by value must match the caller role (Landlord->LANDLORD, Tenant->TENANT)"
    error_id: ERR_VALIDATION
    http_status: 400
    applies_to: "all endpoints with a request body"

  - priority: 4
    category: existence
    check: "Path ids and body FK ids (landlord_id, field_id, offering_id, bid_id, lease_id) must resolve to existing resources; award's bid_id must belong to the path offering"
    error_id: ERR_NOT_FOUND
    http_status: 404
    applies_to: "all resource endpoints"

  - priority: 5
    category: auth
    check: "Entity-backed ownership: Tenant caller owns the bid / is the lease tenant (bid revise/withdraw, expense create, compliance submit_evidence, settlement dispute as tenant); Landlord caller owns the field/offering/report (award, improvement approve/reject, report acknowledge, settlement dispute as landlord); notice create/withdraw caller is the serving party"
    error_id: ERR_NOT_RESOURCE_OWNER
    http_status: 403
    applies_to: "endpoints with ownership checks"

  - priority: 6
    category: state
    check: "Target resource must be in a valid from-state for the transition (generic ERR_INVALID_STATE); lease must be ACTIVE/TERMINATION_PENDING/TERMINATED for settlement creation and ACTIVE for expense creation (ERR_LEASE_NOT_ACTIVE); tenant must be APPROVED for bid creation and lease activation (ERR_TENANT_NOT_APPROVED)"
    error_id: "ERR_INVALID_STATE / ERR_LEASE_NOT_ACTIVE / ERR_TENANT_NOT_APPROVED"
    http_status: 409
    applies_to: "all action endpoints"

  - priority: 7
    category: business_safety
    check: "Compliance gates: lease activation blocked while the tenant has any ComplianceRecord in NON_COMPLIANT on any lease (ERR_TENANT_NONCOMPLIANT); segregation of duties: settlement countersign requires X-User-ID != finalized_by and installment reverse requires X-User-ID != paid_recorded_by (ERR_DUTY_SEGREGATION_VIOLATION)"
    error_id: "ERR_TENANT_NONCOMPLIANT / ERR_DUTY_SEGREGATION_VIOLATION"
    http_status: "409 / 403"
    applies_to: "POST /leases/{id}/activate, POST /settlements/{id}/countersign, POST /installments/{id}/reverse_payment"

  - priority: 8
    category: business_temporal
    check: "Deadline and window checks: bid creation requires clock <= offering.bid_deadline (ERR_BID_WINDOW_CLOSED); lease creation requires clock <= bid.accepted_at + 30 days (ERR_BID_ACCEPTANCE_EXPIRED); report period_start must be <= period_end (ERR_INVALID_PERIOD, 422)"
    error_id: "ERR_BID_WINDOW_CLOSED / ERR_BID_ACCEPTANCE_EXPIRED / ERR_INVALID_PERIOD"
    http_status: "409 / 409 / 422"
    applies_to: "POST /bids, POST /leases, POST /reports"

  - priority: 9
    category: business_constraint
    check: "Type applicability: settlements only on FLEX/SHARE leases (ERR_SETTLEMENT_NOT_APPLICABLE); expense records only on leases with input sharing, i.e. non-CASH (ERR_INPUT_SHARING_NOT_APPLICABLE); improvement landlord_share_pct + tenant_share_pct must equal 1.0 (ERR_COST_SHARE_INVALID, 422)"
    error_id: "ERR_SETTLEMENT_NOT_APPLICABLE / ERR_INPUT_SHARING_NOT_APPLICABLE / ERR_COST_SHARE_INVALID"
    http_status: "409 / 409 / 422"
    applies_to: "POST /settlements, POST /expenses, POST /improvements"

  - priority: 10
    category: business_referential
    check: "Cross-entity integrity: no overlapping ACTIVE/TERMINATION_PENDING lease on the same field under HALF-OPEN [start, end) semantics, adjacency allowed (ERR_FIELD_LEASE_OVERLAP); no overlapping OwnerReport period for the same landlord under CLOSED [start, end] inclusive semantics, touching endpoints count as overlap (ERR_REPORT_PERIOD_OVERLAP); a bid already linked to a lease cannot originate a second lease (ERR_BID_ALREADY_LEASED); only one non-VOID settlement per lease+crop_year — a FINALIZED/DISPUTED/COUNTERSIGNED sibling blocks creation (ERR_SETTLEMENT_YEAR_FINAL_EXISTS)"
    error_id: "ERR_FIELD_LEASE_OVERLAP / ERR_REPORT_PERIOD_OVERLAP / ERR_BID_ALREADY_LEASED / ERR_SETTLEMENT_YEAR_FINAL_EXISTS"
    http_status: 409
    applies_to: "POST /leases, POST /leases/{id}/activate, POST /reports, POST /settlements"

  - priority: 11
    category: business_fiscal
    check: "Money caps and amounts: bid cash_equivalent_bid_cents_per_acre >= offering.min_bid_per_acre_cents (ERR_BID_BELOW_MINIMUM); record_payment amount <= outstanding balance (ERR_PAYMENT_EXCEEDS_BALANCE); waive outstanding <= 100000 cents unless landlord_consent=true (ERR_WAIVER_EXCEEDS_AUTHORITY)"
    error_id: "ERR_BID_BELOW_MINIMUM / ERR_PAYMENT_EXCEEDS_BALANCE / ERR_WAIVER_EXCEEDS_AUTHORITY"
    http_status: 409
    applies_to: "POST /bids, PATCH /bids/{id}, POST /installments/{id}/record_payment, POST /installments/{id}/waive"

# =============================================================================
# §1.5 API Endpoint Table
# =============================================================================
endpoints:
  # --- Logical clock (test-driving) ---
  - method: POST
    path: "/_clock/set_current_utc"
    description: "Set the server's logical clock. Startup default (before any call) is exactly 2026-05-01T00:00:00Z; the logical clock NEVER falls back to wall-clock time. Setting the clock runs all due sweeps in this order: installment SCHEDULED->OPEN and OPEN->LATE (with late fees), compliance cure-deadline NON_COMPLIANT cascade, lease auto-renewal, termination-notice EFFECTIVE cascade, owner-report escalation flags."
    roles: [FarmManager]
    code: 200
    input: [to_iso8601]
    output: { current_utc: string, sweeps_applied: integer }
    side_effects: ["Runs the sweep pipeline described above; each fired sweep applies its own side effects"]

  # --- Landlords ---
  - method: POST
    path: "/landlords"
    description: "Create a landlord (farm owner, possibly absentee)"
    roles: [FarmManager]
    code: 201
    input: [name, contact_email, "absentee?", "report_channel?", "ack_required_days?"]
    output: Landlord
    side_effects: ["balances initialized to 0"]

  - method: GET
    path: "/landlords/{landlordId}"
    description: "Get a landlord"
    roles: [FarmManager, Landlord, Tenant]
    code: 200
    input: []
    output: Landlord
    side_effects: []

  - method: GET
    path: "/landlords"
    description: "List landlords, sorted by created_at ASC"
    roles: [FarmManager, Landlord, Tenant]
    code: 200
    input: ["absentee?"]
    output: "Landlord[]"
    side_effects: []

  # --- Tenants ---
  - method: POST
    path: "/tenants"
    description: "Create a tenant operator (status APPLICANT, compliance_score 100)"
    roles: [FarmManager]
    code: 201
    input: [name, years_experience]
    output: Tenant
    side_effects: []

  - method: GET
    path: "/tenants/{tenantId}"
    description: "Get a tenant"
    roles: [FarmManager, Landlord, Tenant]
    code: 200
    input: []
    output: Tenant
    side_effects: []

  - method: GET
    path: "/tenants"
    description: "List tenants, sorted by created_at ASC"
    roles: [FarmManager, Landlord, Tenant]
    code: 200
    input: ["status?"]
    output: "Tenant[]"
    side_effects: []

  - method: POST
    path: "/tenants/{tenantId}/approve"
    description: "Approve an applicant or reinstate a suspended tenant"
    roles: [FarmManager]
    code: 200
    input: []
    output: Tenant
    side_effects: ["status -> APPROVED"]

  - method: POST
    path: "/tenants/{tenantId}/suspend"
    description: "Suspend an approved tenant; cascades to bids"
    roles: [FarmManager]
    code: 200
    input: []
    output: Tenant
    side_effects:
      - "status -> SUSPENDED"
      - "Tenant's bids in SUBMITTED/SHORTLISTED -> WITHDRAWN; affected offerings recompute eligible_bid_count and evaluation scores"

  # --- Fields ---
  - method: POST
    path: "/fields"
    description: "Create a field for a landlord"
    roles: [FarmManager]
    code: 201
    input: [landlord_id, name, acres, soil_csr2, "drainage_status?"]
    output: Field
    side_effects: ["status = AVAILABLE"]

  - method: GET
    path: "/fields/{fieldId}"
    description: "Get a field"
    roles: [FarmManager, Landlord, Tenant]
    code: 200
    input: []
    output: Field
    side_effects: []

  - method: GET
    path: "/fields"
    description: "List fields, sorted by created_at ASC"
    roles: [FarmManager, Landlord, Tenant]
    code: 200
    input: ["landlord_id?", "status?"]
    output: "Field[]"
    side_effects: []

  # --- Offerings ---
  - method: POST
    path: "/offerings"
    description: "Open a lease offering (bid solicitation) for a field"
    roles: [FarmManager]
    code: 201
    input: [field_id, term_years, term_start_date, min_bid_per_acre_cents, reference_yield_bu_per_acre, reference_price_cents_per_bu, bid_deadline]
    output: LeaseOffering
    side_effects: ["status = OPEN, eligible_bid_count = 0"]

  - method: GET
    path: "/offerings/{offeringId}"
    description: "Get an offering"
    roles: [FarmManager, Landlord, Tenant]
    code: 200
    input: []
    output: LeaseOffering
    side_effects: []

  - method: GET
    path: "/offerings"
    description: "List offerings, sorted by created_at ASC"
    roles: [FarmManager, Landlord, Tenant]
    code: 200
    input: ["field_id?", "status?"]
    output: "LeaseOffering[]"
    side_effects: []

  - method: POST
    path: "/offerings/{offeringId}/close"
    description: "Close an offering to further bidding (manual close; bids also stop being accepted after bid_deadline)"
    roles: [FarmManager]
    code: 200
    input: []
    output: LeaseOffering
    side_effects: ["status OPEN -> CLOSED"]

  - method: POST
    path: "/offerings/{offeringId}/award"
    description: "Landlord selects the winning bid (tenant selection)"
    roles: [Landlord]
    code: 200
    input: [bid_id]
    output: LeaseOffering
    side_effects:
      - "Winning bid SHORTLISTED -> ACCEPTED with accepted_at = clock"
      - "All other SUBMITTED/SHORTLISTED bids -> REJECTED; eligible_bid_count -> 0"
      - "status CLOSED -> AWARDED"

  - method: POST
    path: "/offerings/{offeringId}/cancel"
    description: "Cancel an offering"
    roles: [FarmManager]
    code: 200
    input: []
    output: LeaseOffering
    side_effects: ["status OPEN|CLOSED -> CANCELLED; eligible bids -> REJECTED; eligible_bid_count -> 0"]

  # --- Bids ---
  - method: POST
    path: "/bids"
    description: "Tenant submits a bid on an offering; tenant_id is taken from X-User-ID"
    roles: [Tenant]
    code: 201
    input: [offering_id, lease_type, "cash_bid_per_acre_cents?", "flex_base_per_acre_cents?", "flex_bonus_pct?", "flex_cap_cents?", "revenue_trigger_cents?", "landlord_share_pct?", "input_share_pct?", cash_equivalent_bid_cents_per_acre]
    output: Bid
    side_effects:
      - "status = SUBMITTED; tenant_id = X-User-ID"
      - "evaluation_score computed; offering eligible_bid_count recomputed"

  - method: GET
    path: "/bids/{bidId}"
    description: "Get a bid"
    roles: [FarmManager, Landlord, Tenant]
    code: 200
    input: []
    output: Bid
    side_effects: []

  - method: GET
    path: "/bids"
    description: "List bids, sorted by created_at ASC"
    roles: [FarmManager, Landlord, Tenant]
    code: 200
    input: ["offering_id?", "tenant_id?", "status?"]
    output: "Bid[]"
    side_effects: []

  - method: PATCH
    path: "/bids/{bidId}"
    description: "Revise a SUBMITTED bid's amounts (OCC on expected_bid_version)"
    roles: [Tenant]
    code: 200
    input: [expected_bid_version, "cash_bid_per_acre_cents?", "flex_base_per_acre_cents?", "flex_bonus_pct?", "flex_cap_cents?", "revenue_trigger_cents?", "landlord_share_pct?", "input_share_pct?", "cash_equivalent_bid_cents_per_acre?"]
    output: Bid
    side_effects:
      - "increments Bid.version by 1"
      - "evaluation_score recomputed for all eligible bids of the offering"

  - method: POST
    path: "/bids/{bidId}/withdraw"
    description: "Tenant withdraws own bid"
    roles: [Tenant]
    code: 200
    input: []
    output: Bid
    side_effects: ["status SUBMITTED|SHORTLISTED -> WITHDRAWN; offering eligible_bid_count recomputed"]

  - method: POST
    path: "/bids/{bidId}/shortlist"
    description: "Manager shortlists a submitted bid (award candidate)"
    roles: [FarmManager]
    code: 200
    input: []
    output: Bid
    side_effects: ["status SUBMITTED -> SHORTLISTED"]

  - method: POST
    path: "/bids/{bidId}/demote"
    description: "Manager demotes a shortlisted bid back to the pool"
    roles: [FarmManager]
    code: 200
    input: []
    output: Bid
    side_effects: ["status SHORTLISTED -> SUBMITTED"]

  # --- Leases ---
  - method: POST
    path: "/leases"
    description: "Create a DRAFT lease from an awarded bid; rent parameters are copied from the bid"
    roles: [FarmManager]
    code: 201
    input: [bid_id, term_start_date, term_end_date, payment_pattern, escalation_type, "escalation_pct?", "notice_lead_days?", "conservation_practices?"]
    output: Lease
    side_effects:
      - "status = DRAFT; lease_type/base_rent/share parameters copied from the bid"
      - "current_notice_deadline = term_end_date - notice_lead_days"

  - method: GET
    path: "/leases/{leaseId}"
    description: "Get a lease"
    roles: [FarmManager, Landlord, Tenant]
    code: 200
    input: []
    output: Lease
    side_effects: []

  - method: GET
    path: "/leases"
    description: "List leases, sorted by created_at ASC"
    roles: [FarmManager, Landlord, Tenant]
    code: 200
    input: ["field_id?", "landlord_id?", "tenant_id?", "bid_id?", "status?"]
    output: "Lease[]"
    side_effects: []

  - method: PATCH
    path: "/leases/{leaseId}"
    description: "Amend a lease (OCC on expected_lease_version). While ACTIVE only base_rent_cents_per_acre, escalation_type, escalation_pct, notice_lead_days may change; conservation_practices editable only while DRAFT. Amendments never retroactively change existing installments; they apply to future renewals and settlements."
    roles: [FarmManager]
    code: 200
    input: [expected_lease_version, "base_rent_cents_per_acre?", "escalation_type?", "escalation_pct?", "notice_lead_days?", "conservation_practices?"]
    output: Lease
    side_effects: ["increments Lease.version by 1"]

  - method: POST
    path: "/leases/{leaseId}/activate"
    description: "Activate a DRAFT lease; generates installments and compliance records"
    roles: [FarmManager]
    code: 200
    input: []
    output: Lease
    side_effects:
      - "status DRAFT -> ACTIVE; Field AVAILABLE -> LEASED"
      - "calc rent_schedule_generation creates installments; calc compliance creates PENDING records per practice"

  - method: POST
    path: "/leases/{leaseId}/cancel"
    description: "Cancel a DRAFT lease"
    roles: [FarmManager]
    code: 200
    input: []
    output: Lease
    side_effects: ["status DRAFT -> CANCELLED"]

  # --- Installments ---
  - method: GET
    path: "/installments/{installmentId}"
    description: "Get an installment"
    roles: [FarmManager, Landlord, Tenant]
    code: 200
    input: []
    output: PaymentInstallment
    side_effects: []

  - method: GET
    path: "/installments"
    description: "List installments, sorted by due_date ASC then created_at ASC"
    roles: [FarmManager, Landlord, Tenant]
    code: 200
    input: ["lease_id?", "status?"]
    output: "PaymentInstallment[]"
    side_effects: []

  - method: POST
    path: "/installments/{installmentId}/record_payment"
    description: "Record a (possibly partial) cash-rent payment against an OPEN or LATE installment"
    roles: [FarmManager]
    code: 200
    input: [amount_cents]
    output: PaymentInstallment
    side_effects:
      - "Waterfall allocation fee-first then principal; paid_cents += amount_cents; status -> PAID at full coverage"
      - "last_payment_at = clock; paid_recorded_by = X-User-ID; landlord ledger totals recomputed"

  - method: POST
    path: "/installments/{installmentId}/reverse_payment"
    description: "Reverse all payments on a PAID installment; a different manager than the recorder must perform it (segregation of duties)"
    roles: [FarmManager]
    code: 200
    input: []
    output: PaymentInstallment
    side_effects:
      - "paid_cents reset to 0; status PAID -> OPEN (or LATE when past grace); landlord ledger totals recomputed"

  - method: POST
    path: "/installments/{installmentId}/waive"
    description: "Waive an outstanding installment balance"
    roles: [FarmManager]
    code: 200
    input: [reason, "landlord_consent?"]
    output: PaymentInstallment
    side_effects: ["status OPEN|LATE -> WAIVED; landlord pending_receivable_cents recomputed"]

  # --- Settlements ---
  - method: POST
    path: "/settlements"
    description: "Create a PROVISIONAL harvest settlement for a FLEX/SHARE lease + crop_year (OCC on expected_lease_version); supersedes an existing PROVISIONAL sibling to VOID"
    roles: [FarmManager]
    code: 201
    input: [lease_id, crop_year, price_source, yield_bu_per_acre, harvest_price_cents_per_bu, expected_lease_version]
    output: HarvestSettlement
    side_effects:
      - "computes gross_revenue_cents, landlord_amount_cents, input_share_total_cents, net_settlement_cents (calcs flex_rent_computation / share_settlement)"
      - "existing PROVISIONAL settlement for same lease+crop_year -> VOID"
      - "increments Lease.version by 1"

  - method: GET
    path: "/settlements/{settlementId}"
    description: "Get a settlement"
    roles: [FarmManager, Landlord, Tenant]
    code: 200
    input: []
    output: HarvestSettlement
    side_effects: []

  - method: GET
    path: "/settlements"
    description: "List settlements, sorted by created_at ASC"
    roles: [FarmManager, Landlord, Tenant]
    code: 200
    input: ["lease_id?", "status?", "crop_year?"]
    output: "HarvestSettlement[]"
    side_effects: []

  - method: POST
    path: "/settlements/{settlementId}/finalize"
    description: "Finalize a PROVISIONAL settlement (requires ACTUAL price source)"
    roles: [FarmManager]
    code: 200
    input: []
    output: HarvestSettlement
    side_effects: ["status PROVISIONAL -> FINALIZED; finalized_by = X-User-ID; input_share_total refreshed"]

  - method: POST
    path: "/settlements/{settlementId}/countersign"
    description: "Second manager countersigns a FINALIZED settlement (segregation of duties) and posts the true-up"
    roles: [FarmManager]
    code: 200
    input: []
    output: HarvestSettlement
    side_effects:
      - "status FINALIZED -> COUNTERSIGNED"
      - "calc settlement_true_up; positive true_up creates an adjustment installment (due clock + 30 days); negative credits Lease.landlord_credit_cents"

  - method: POST
    path: "/settlements/{settlementId}/dispute"
    description: "Lease party disputes a FINALIZED settlement"
    roles: [Tenant, Landlord]
    code: 200
    input: []
    output: HarvestSettlement
    side_effects: ["status FINALIZED -> DISPUTED"]

  - method: POST
    path: "/settlements/{settlementId}/refinalize"
    description: "Manager corrects and re-finalizes a DISPUTED settlement"
    roles: [FarmManager]
    code: 200
    input: [yield_bu_per_acre, harvest_price_cents_per_bu]
    output: HarvestSettlement
    side_effects: ["status DISPUTED -> FINALIZED; amounts recomputed; finalized_by = X-User-ID"]

  # --- Expenses (input-cost sharing) ---
  - method: POST
    path: "/expenses"
    description: "Tenant submits an input cost for sharing on a FLEX/SHARE lease"
    roles: [Tenant]
    code: 201
    input: [lease_id, category, total_cost_cents, incurred_date, crop_year]
    output: ExpenseRecord
    side_effects:
      - "status = SUBMITTED; landlord_share_pct copied from lease (0 when null); landlord_share_cents = round_half_up(total * pct)"

  - method: GET
    path: "/expenses/{expenseId}"
    description: "Get an expense record"
    roles: [FarmManager, Landlord, Tenant]
    code: 200
    input: []
    output: ExpenseRecord
    side_effects: []

  - method: GET
    path: "/expenses"
    description: "List expense records, sorted by created_at ASC"
    roles: [FarmManager, Landlord, Tenant]
    code: 200
    input: ["lease_id?", "status?", "crop_year?"]
    output: "ExpenseRecord[]"
    side_effects: []

  - method: POST
    path: "/expenses/{expenseId}/approve"
    description: "Approve a submitted expense"
    roles: [FarmManager]
    code: 200
    input: []
    output: ExpenseRecord
    side_effects: ["status SUBMITTED -> APPROVED; approved_at = clock"]

  - method: POST
    path: "/expenses/{expenseId}/reject"
    description: "Reject a submitted expense"
    roles: [FarmManager]
    code: 200
    input: []
    output: ExpenseRecord
    side_effects: ["status SUBMITTED -> REJECTED"]

  # --- Compliance ---
  - method: GET
    path: "/compliance-records/{recordId}"
    description: "Get a compliance record"
    roles: [FarmManager, Landlord, Tenant]
    code: 200
    input: []
    output: ComplianceRecord
    side_effects: []

  - method: GET
    path: "/compliance-records"
    description: "List compliance records, sorted by created_at ASC"
    roles: [FarmManager, Landlord, Tenant]
    code: 200
    input: ["lease_id?", "status?"]
    output: "ComplianceRecord[]"
    side_effects: []

  - method: POST
    path: "/compliance-records/{recordId}/submit_evidence"
    description: "Lease tenant submits practice evidence (from PENDING or REJECTED)"
    roles: [Tenant]
    code: 200
    input: [evidence_note]
    output: ComplianceRecord
    side_effects: ["status -> EVIDENCE_SUBMITTED"]

  - method: POST
    path: "/compliance-records/{recordId}/verify"
    description: "Verify submitted evidence"
    roles: [FarmManager]
    code: 200
    input: []
    output: ComplianceRecord
    side_effects: ["status EVIDENCE_SUBMITTED -> VERIFIED; verified_by = X-User-ID"]

  - method: POST
    path: "/compliance-records/{recordId}/reject_evidence"
    description: "Reject submitted evidence (tenant may resubmit)"
    roles: [FarmManager]
    code: 200
    input: [reason]
    output: ComplianceRecord
    side_effects: ["status EVIDENCE_SUBMITTED -> REJECTED"]

  - method: POST
    path: "/compliance-records/{recordId}/waive"
    description: "Waive a practice requirement; waiving a NON_COMPLIANT record restores 15 score points"
    roles: [FarmManager]
    code: 200
    input: [reason]
    output: ComplianceRecord
    side_effects: ["status -> WAIVED; if from NON_COMPLIANT: tenant.compliance_score = min(100, score + 15)"]

  # --- Improvements ---
  - method: POST
    path: "/improvements"
    description: "Propose an improvement/drainage project with cost allocation"
    roles: [FarmManager]
    code: 201
    input: [field_id, "lease_id?", project_type, total_cost_cents, landlord_share_pct, tenant_share_pct, reimbursement_method, amortization_years]
    output: ImprovementProject
    side_effects: ["status = PROPOSED; tenant_paid_cents = round_half_up(total * tenant_share_pct)"]

  - method: GET
    path: "/improvements/{improvementId}"
    description: "Get an improvement project"
    roles: [FarmManager, Landlord, Tenant]
    code: 200
    input: []
    output: ImprovementProject
    side_effects: []

  - method: GET
    path: "/improvements"
    description: "List improvement projects, sorted by created_at ASC"
    roles: [FarmManager, Landlord, Tenant]
    code: 200
    input: ["field_id?", "lease_id?", "status?"]
    output: "ImprovementProject[]"
    side_effects: []

  - method: POST
    path: "/improvements/{improvementId}/approve"
    description: "Landlord approves a proposed project (owner consent for capital works)"
    roles: [Landlord]
    code: 200
    input: []
    output: ImprovementProject
    side_effects: ["status PROPOSED -> APPROVED"]

  - method: POST
    path: "/improvements/{improvementId}/reject"
    description: "Landlord rejects a proposed project"
    roles: [Landlord]
    code: 200
    input: []
    output: ImprovementProject
    side_effects: ["status PROPOSED -> REJECTED"]

  - method: POST
    path: "/improvements/{improvementId}/complete"
    description: "Mark an approved project completed"
    roles: [FarmManager]
    code: 200
    input: []
    output: ImprovementProject
    side_effects: ["status APPROVED -> COMPLETED; completed_at = clock; TILE_DRAINAGE sets Field.drainage_status = TILED"]

  - method: POST
    path: "/improvements/{improvementId}/cancel"
    description: "Cancel an approved project before completion"
    roles: [FarmManager]
    code: 200
    input: []
    output: ImprovementProject
    side_effects: ["status APPROVED -> CANCELLED"]

  - method: POST
    path: "/improvements/{improvementId}/mark_reimbursed"
    description: "Mark a due early-termination reimbursement as paid out"
    roles: [FarmManager]
    code: 200
    input: []
    output: ImprovementProject
    side_effects: ["reimbursement_status DUE -> PAID"]

  # --- Termination notices ---
  - method: POST
    path: "/notices"
    description: "Serve a statutory termination notice on an ACTIVE lease; served_by must match the caller role (Landlord->LANDLORD, Tenant->TENANT)"
    roles: [Landlord, Tenant]
    code: 201
    input: [lease_id, served_by]
    output: TerminationNotice
    side_effects:
      - "status = SERVED; served_date = clock; statutory_deadline and effective_date computed (calc statutory_notice_deadline)"
      - "Lease ACTIVE -> TERMINATION_PENDING"

  - method: GET
    path: "/notices/{noticeId}"
    description: "Get a termination notice"
    roles: [FarmManager, Landlord, Tenant]
    code: 200
    input: []
    output: TerminationNotice
    side_effects: []

  - method: GET
    path: "/notices"
    description: "List termination notices, sorted by created_at ASC"
    roles: [FarmManager, Landlord, Tenant]
    code: 200
    input: ["lease_id?", "status?"]
    output: "TerminationNotice[]"
    side_effects: []

  - method: POST
    path: "/notices/{noticeId}/withdraw"
    description: "Serving party withdraws a SERVED notice before it becomes effective"
    roles: [Landlord, Tenant]
    code: 200
    input: []
    output: TerminationNotice
    side_effects: ["status SERVED -> WITHDRAWN; Lease TERMINATION_PENDING -> ACTIVE"]

  # --- Owner reports ---
  - method: POST
    path: "/reports"
    description: "Generate a landlord report over a closed period window; aggregates computed at creation (calc owner_report_aggregation)"
    roles: [FarmManager]
    code: 201
    input: [landlord_id, report_type, period_start, period_end]
    output: OwnerReport
    side_effects: ["status = DRAFT; rent_collected_cents / expenses_approved_cents / noncompliant_count computed"]

  - method: GET
    path: "/reports/{reportId}"
    description: "Get an owner report"
    roles: [FarmManager, Landlord, Tenant]
    code: 200
    input: []
    output: OwnerReport
    side_effects: []

  - method: GET
    path: "/reports"
    description: "List owner reports, sorted by created_at ASC"
    roles: [FarmManager, Landlord, Tenant]
    code: 200
    input: ["landlord_id?", "status?"]
    output: "OwnerReport[]"
    side_effects: []

  - method: POST
    path: "/reports/{reportId}/send"
    description: "Send a draft report to the landlord"
    roles: [FarmManager]
    code: 200
    input: []
    output: OwnerReport
    side_effects: ["status DRAFT -> SENT; sent_at = clock; ack_due_date = sent_at + landlord.ack_required_days"]

  - method: POST
    path: "/reports/{reportId}/acknowledge"
    description: "Landlord acknowledges a sent report (absentee-owner communication)"
    roles: [Landlord]
    code: 200
    input: []
    output: OwnerReport
    side_effects: ["status SENT -> ACKNOWLEDGED; acknowledged_at = clock; escalation_required = false"]

# =============================================================================
# §1.6 Error Code Catalog
# =============================================================================
errors:
  - { id: ERR_MISSING_OR_INVALID_USER_CONTEXT_HEADER, http: 400, condition: "X-User-ID or X-User-Role header missing or malformed" }
  - { id: ERR_FORBIDDEN_FOR_ROLE, http: 403, condition: "Caller role not allowed for this endpoint" }
  - { id: ERR_NOT_RESOURCE_OWNER, http: 403, condition: "Entity-backed caller does not own the target resource (tenant/landlord/party mismatch)" }
  - { id: ERR_DUTY_SEGREGATION_VIOLATION, http: 403, condition: "Segregation of duties: countersigner equals finalized_by, or reverser equals paid_recorded_by" }
  - { id: ERR_VALIDATION, http: 400, condition: "Malformed body: missing required field, invalid enum member, non-positive amount, conditional type parameters missing, term_end_date <= term_start_date, conservation_practices patched while lease ACTIVE" }
  - { id: ERR_NOT_FOUND, http: 404, condition: "Path id or body FK reference does not resolve (including award bid_id not belonging to the offering)" }
  - { id: ERR_INVALID_STATE, http: 409, condition: "Target resource is in a state where the requested transition is not allowed" }
  - { id: ERR_LEASE_NOT_ACTIVE, http: 409, condition: "Settlement creation requires lease ACTIVE/TERMINATION_PENDING/TERMINATED; expense creation requires lease ACTIVE" }
  - { id: ERR_TENANT_NOT_APPROVED, http: 409, condition: "Bid creation or lease activation requires tenant status APPROVED" }
  - { id: ERR_TENANT_NONCOMPLIANT, http: 409, condition: "Lease activation blocked: tenant has an unresolved ComplianceRecord in NON_COMPLIANT on some lease" }
  - { id: ERR_BID_WINDOW_CLOSED, http: 409, condition: "Bid submitted when clock is past the offering's bid_deadline" }
  - { id: ERR_BID_ACCEPTANCE_EXPIRED, http: 409, condition: "Lease creation when clock is past bid.accepted_at + 30 days" }
  - { id: ERR_BID_ALREADY_LEASED, http: 409, condition: "The awarded bid is already linked to an existing lease" }
  - { id: ERR_BID_BELOW_MINIMUM, http: 409, condition: "cash_equivalent_bid_cents_per_acre below the offering's min_bid_per_acre_cents" }
  - { id: ERR_FIELD_LEASE_OVERLAP, http: 409, condition: "New lease term [start, end) overlaps an ACTIVE or TERMINATION_PENDING lease on the same field (half-open; adjacency allowed)" }
  - { id: ERR_REPORT_PERIOD_OVERLAP, http: 409, condition: "New report period [start, end] overlaps an existing report for the same landlord (closed interval; touching endpoints overlap)" }
  - { id: ERR_INVALID_PERIOD, http: 422, condition: "Report period_start after period_end" }
  - { id: ERR_SETTLEMENT_NOT_APPLICABLE, http: 409, condition: "Settlement creation attempted on a CASH lease" }
  - { id: ERR_SETTLEMENT_YEAR_FINAL_EXISTS, http: 409, condition: "A FINALIZED/DISPUTED/COUNTERSIGNED settlement already exists for this lease + crop_year" }
  - { id: ERR_PRICE_NOT_FINAL, http: 409, condition: "Finalize attempted on an ESTIMATED (provisional) settlement" }
  - { id: ERR_INPUT_SHARING_NOT_APPLICABLE, http: 409, condition: "Expense record attempted on a CASH lease (no input-cost sharing)" }
  - { id: ERR_COST_SHARE_INVALID, http: 422, condition: "Improvement landlord_share_pct + tenant_share_pct does not equal 1.0" }
  - { id: ERR_PAYMENT_EXCEEDS_BALANCE, http: 409, condition: "record_payment amount exceeds outstanding (amount + late_fee - paid)" }
  - { id: ERR_WAIVER_EXCEEDS_AUTHORITY, http: 409, condition: "Waive outstanding exceeds 100000 cents without landlord_consent=true" }
  - { id: ERR_IMPROVEMENT_LEASE_NOT_ACTIVE, http: 409, condition: "Improvement approval blocked: linked lease is not ACTIVE" }
  - { id: ERR_STALE_VERSION, http: 412, condition: "OCC mismatch: expected_*_version does not match the parent entity's current version" }

# =============================================================================
# §1.7 RBAC Matrix
# =============================================================================
roles:
  - name: FarmManager
    description: "Farm management company operator; runs the full workflow except owner approvals, owner/tenant party actions"
    identity: "opaque"
    exclusive_operations:
      - "POST /landlords, POST /tenants, POST /fields, POST /offerings — master-data creation"
      - "POST /tenants/{id}/approve, POST /tenants/{id}/suspend — tenant lifecycle"
      - "POST /offerings/{id}/close, POST /offerings/{id}/cancel — offering control"
      - "POST /bids/{id}/shortlist, POST /bids/{id}/demote — bid curation"
      - "POST /leases, PATCH /leases/{id}, POST /leases/{id}/activate, POST /leases/{id}/cancel — lease management"
      - "POST /installments/{id}/record_payment, /reverse_payment, /waive — cash-rent collection"
      - "POST /settlements, /finalize, /countersign, /refinalize — settlement processing"
      - "POST /expenses/{id}/approve, /reject — expense review"
      - "POST /compliance-records/{id}/verify, /reject_evidence, /waive — compliance enforcement"
      - "POST /improvements, /complete, /cancel, /mark_reimbursed — project execution"
      - "POST /reports, POST /reports/{id}/send — landlord reporting"
      - "POST /_clock/set_current_utc — logical clock control"
    shared_operations:
      - "All GET endpoints (shared with Landlord and Tenant)"
    note: "Segregation of duties inside this role: the manager who finalizes a settlement cannot countersign it; the manager who recorded a payment cannot reverse it."

  - name: Landlord
    description: "Farmland owner (possibly absentee); selects tenants, approves capital improvements, serves notices, acknowledges reports"
    identity: "entity_backed:Landlord"
    exclusive_operations:
      - "POST /offerings/{id}/award — tenant selection (owner-only; managers shortlist but cannot award)"
      - "POST /improvements/{id}/approve, /reject — owner consent for capital works"
      - "POST /reports/{id}/acknowledge — report acknowledgment"
    shared_operations:
      - "POST /notices, POST /notices/{id}/withdraw — as the LANDLORD serving party (shared with Tenant)"
      - "POST /settlements/{id}/dispute — as lease party (shared with Tenant)"
      - "All GET endpoints"

  - name: Tenant
    description: "Farm operator bidding on leases and fulfilling lease obligations"
    identity: "entity_backed:Tenant"
    exclusive_operations:
      - "POST /bids, PATCH /bids/{id}, POST /bids/{id}/withdraw — bidding"
      - "POST /expenses — input-cost submission"
      - "POST /compliance-records/{id}/submit_evidence — conservation evidence"
    shared_operations:
      - "POST /notices, POST /notices/{id}/withdraw — as the TENANT serving party (shared with Landlord)"
      - "POST /settlements/{id}/dispute — as lease party (shared with Landlord)"
      - "All GET endpoints"

  - name: System
    description: "Automation identity for logical-clock sweeps: installment OPEN/LATE, compliance NON_COMPLIANT cascade, lease auto-renewal, notice EFFECTIVE cascade, report escalation flags"
    identity: "opaque"
    exclusive_operations: []
    shared_operations: []
    note: "System performs no HTTP calls; its transitions are triggered inside POST /_clock/set_current_utc sweeps."
