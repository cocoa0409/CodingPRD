            - "HTTP status == 200"
            - "SubstantiationRecord.${r1}.status == VERIFIED"
            - "RawMaterial.${m1}.claim_status == CLEAR"
            - "RawMaterial.${m1}.verified_claim_types == [\"KOSHER\"]"

