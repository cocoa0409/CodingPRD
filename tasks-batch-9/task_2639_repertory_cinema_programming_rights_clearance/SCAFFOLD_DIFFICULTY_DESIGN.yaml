        distinguishing_aspect: |
          Resource: the venue's ingest LANES, a counted pool rather than an exclusive slot. Interval
          semantics: CLOSED windows with AGGREGATE capacity - overlap by itself is not an error at all, which
          is what separates this instance from both siblings. Two fully overlapping windows are accepted
