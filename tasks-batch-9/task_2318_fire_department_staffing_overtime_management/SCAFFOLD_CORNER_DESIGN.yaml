          assert:
            - "The ACCEPT response body itself already reports status \"ACCEPTED\" — no intermediate state is observable"
            - "The very next shift read shows status \"STAFFED\", assigned_headcount 1, open_vacancy_count 0, staffing_gap 0, staffing_posture \"FULLY_STAFFED\" without any staffing-run call"
            - "The very next station read shows ot_committed_cents == 144000 and budget_posture == \"WITHIN\" (16 % of the budget, 1600 basis points)"
            - "The very next work-period read shows scheduled_hours == 24, adjusted_scheduled_hours == 24, projected_flsa_overtime_hours == 0 and flsa_premium_cents == 0"
            - "Vacancy.${vac134}.status == \"FILLED\" on first read and the created ShiftAssignment carries source_offer_id == ${off134} — every link is populated in the same transaction"
