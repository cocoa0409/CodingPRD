scenario: |
  Generate task harder than expert level!

  2611. Membership Campground & Recreational Vehicle Club Program (membership campground network):
  membership tier purchase with upfront cost, annual dues and usage entitlements by park class,
  reservation rules including advance windows, stay length limits and out-and-back requirements
  between stays, park capacity allocation between members and transient public guests, member
  transfer, resale restrictions and dues delinquency suspension, park amenity standards, seasonal
  opening and maintenance scheduling, long-term occupancy prevention with policy enforcement and
  exceptions, member satisfaction, park rating and capital reinvestment prioritization, affiliate
  network access agreements with partner campground systems

domain_name: membership-campground-rv-club
api_prefix: ""

complexity_profile:
  primary_archetype: quota_allocation
  secondary_archetype: temporal_windowing
  complexity_layers:
    - optimistic_concurrency
    - cascading_side_effects
    - dual_variant_calculation
    - rate_threshold_triggers

  entity_topology: flat
  # Peer entities linked by explicit foreign keys. Only four read paths are nested
  # (park/reservation sub-resource lists); every mutation targets a flat collection
  # and carries its parents as FK body fields.

  state_machine_shape: parallel
  # Membership carries two independent state axes (membership_status x dues_status) that
  # advance under different triggers; Reservation adds a CHECKED_IN <-> EXTENSION_REVIEW
  # cycle and a PENDING -> {CONFIRMED, WAITLISTED} fork; Park and AffiliateAgreement each
  # carry a revert cycle.

  relationship_patterns:
    - one_to_many          # Park -> Reservation, Membership -> DuesInvoice
    - self_referential     # Membership.transferred_from_membership_id -> Membership.id
    - cross_aggregate      # Reservation -> AffiliateAgreement via Park.affiliate_agreement_id
    - polymorphic_actor    # requested_by_user_id / decided_by_user_id hold either a Park id (ParkManager) or an opaque operator id

  role_model: segregation_of_duties
  # A ClubAdmin who proposes a CapitalProject may not decide it; the deciding
  # X-User-ID must differ from CapitalProject.requested_by_user_id.

  consistency_model: immediate

response_envelope:
  success: |
    { "meta": { "api_request_id": "req_xxx", "api_request_timestamp": "ISO8601" },
      "response_type": "object" | "array", "data": {} }
  error: |
    { "meta": { ... }, "response_type": "error",
      "data": { "error_id": "ERR_XXX", "message": "..." } }
  pagination_fields: ["limit", "offset", "total_count", "has_more"]
  pagination_defaults: { limit: 10, min: 1, max: 100, offset: 0 }

entities:
  - name: MembershipTier
    parent: null
    common_fields: true
    fields:
      - name: code
        type: string
        source: input
        description: Short tier code used in prose and in affiliate rank comparisons
        constraints: unique across MembershipTier; 2-24 chars uppercase
      - name: name
        type: string
        source: input
        description: Marketing name of the tier
      - name: tier_rank
        type: integer
        source: input
        description: Ordinal rank used for affiliate eligibility comparisons; higher is more privileged
        constraints: 1..5
      - name: upfront_cost_cents
        type: integer
        source: input
        description: One-time membership purchase price in cents
        constraints: ">= 0"
      - name: annual_dues_cents
        type: integer
        source: input
        description: Base annual dues in cents, before capital assessment and loyalty credit
        constraints: ">= 0"
      - name: entitlement_nights_class_a
        type: integer
        source: input
        description: Nights per entitlement year usable at CLASS_A parks
        constraints: ">= 0"
      - name: entitlement_nights_class_b
        type: integer
        source: input
        description: Nights per entitlement year usable at CLASS_B parks
        constraints: ">= 0"
      - name: entitlement_nights_class_c
        type: integer
        source: input
        description: Nights per entitlement year usable at CLASS_C parks
        constraints: ">= 0"
      - name: annual_total_night_cap
        type: integer
        source: input
        description: Ceiling on total nights across all park classes per entitlement year
        constraints: ">= 1"
      - name: advance_window_days
        type: integer
        source: input
        description: Maximum number of days between the booking date and the arrival date
        constraints: 1..365
      - name: max_consecutive_stay_nights
        type: integer
        source: input
        description: Longest merged occupancy run permitted at one park without a granted OccupancyException
        constraints: 1..45
      - name: min_out_nights_between_stays
        type: integer
        source: input
        description: Out-and-back requirement — nights the member must be off the network between two stays
        constraints: 0..30
      - name: affiliate_access_enabled
        type: boolean
        source: input
        description: Whether memberships on this tier may book parks that belong to an affiliate agreement
      - name: resale_allowed
        type: boolean
        source: input
        description: Whether a membership on this tier may be transferred with transfer_type RESALE
      - name: transfer_fee_cents
        type: integer
        source: input
        description: Base transfer fee in cents before type multiplier and resale surcharge
        constraints: ">= 0"

  - name: Member
    parent: null
    common_fields: true
    fields:
      - name: full_name
        type: string
        source: input
        description: Legal name of the natural person holding or receiving memberships
      - name: email
        type: string
        source: input
        description: Contact email
        constraints: unique across Member
      - name: home_region
        type: string
        source: input
        description: Free-text home region used only for reporting
      - name: status
        type: enum
        source: system
        description: Lifecycle of the person record
        default: ACTIVE
        constraints: "{ACTIVE, CLOSED}"

  - name: Membership
    parent: null
    common_fields: true
    fields:
      - name: member_id
        type: string
        source: input
        description: FK -> Member.id; the natural person who currently holds this membership contract
      - name: tier_id
        type: string
        source: input
        description: FK -> MembershipTier.id; pinned at purchase and carried unchanged through transfers
      - name: transferred_from_membership_id
        type: string
        source: system
        description: FK -> Membership.id; set on the successor membership minted by an APPROVED TransferRequest, null for an original purchase
        default: null
      - name: membership_status
        type: enum
        source: system
        description: Contract axis of the parallel state machine
        default: ACTIVE
        constraints: "{ACTIVE, SUSPENDED, TRANSFER_PENDING, TERMINATED}"
      - name: dues_status
        type: enum
        source: system
        description: Billing axis of the parallel state machine; advanced only by POST /ops/dues-delinquency-run and by invoice payment/reversal
        default: CURRENT
        constraints: "{CURRENT, GRACE, DELINQUENT, WRITTEN_OFF}"
      - name: suspension_reason
        type: enum
        source: system
        description: Why membership_status is SUSPENDED; cleared on reinstatement
        default: null
        constraints: "{DUES_DELINQUENCY, OCCUPANCY_POLICY, ADMIN_ACTION, null}"
      - name: purchased_at
        type: datetime
        source: system
        description: Logical-clock instant at which this membership row was created
      - name: tenure_origin_at
        type: datetime
        source: system
        description: Logical-clock instant of the ORIGINAL purchase in this membership's transfer chain; copied verbatim onto successor memberships so tenure survives transfer
      - name: upfront_paid_cents
        type: integer
        source: input
        description: Upfront amount actually collected at purchase
        constraints: ">= 0"
      - name: entitlement_year_start
        type: string
        source: system
        description: ISO 8601 date (YYYY-MM-DD) that opens the current entitlement year; equals date(purchased_at) at creation
      - name: nights_used_class_a
        type: integer
        source: computed
        description: Nights charged against the CLASS_A entitlement in the current entitlement year
        default: 0
      - name: nights_used_class_b
        type: integer
        source: computed
        description: Nights charged against the CLASS_B entitlement in the current entitlement year
        default: 0
      - name: nights_used_class_c
        type: integer
        source: computed
        description: Nights charged against the CLASS_C entitlement in the current entitlement year
        default: 0
      - name: annual_nights_used
        type: integer
        source: computed
        description: nights_used_class_a + nights_used_class_b + nights_used_class_c
        default: 0
      - name: dues_balance_cents
        type: integer
        source: computed
        description: Sum over this membership's DuesInvoice rows with status IN {OPEN, PAST_DUE} of (amount_cents + late_fee_cents - paid_amount_cents)
        default: 0
      - name: dues_paid_through
        type: string
        source: computed
        description: ISO 8601 date through which dues are settled; advanced by a full payment, rolled back by a payment reversal
      - name: transfer_count
        type: integer
        source: system
        description: Number of APPROVED transfers already consumed by this membership chain
        default: 0
      - name: resale_eligible_at
        type: datetime
        source: computed
        description: purchased_at + RESALE_HOLD_DAYS days; gates transfer_type RESALE only
      - name: tenure_years
        type: integer
        source: computed
        description: floor((current logical date - date(tenure_origin_at)) / 365); feeds the dues loyalty band
        default: 0

  - name: Park
    parent: null
    common_fields: true
    fields:
      - name: name
        type: string
        source: input
        description: Park name
      - name: park_class
        type: enum
        source: input
        description: Entitlement class of the park; selects which nights_used_class_* bucket a stay debits
        constraints: "{CLASS_A, CLASS_B, CLASS_C}"
      - name: affiliate_agreement_id
        type: string
        source: input
        description: FK -> AffiliateAgreement.id; present only for partner-network parks, null for club-owned parks
        default: null
      - name: network_type
        type: enum
        source: computed
        description: AFFILIATE when affiliate_agreement_id is non-null, otherwise CLUB_OWNED
        constraints: "{CLUB_OWNED, AFFILIATE}"
      - name: total_sites
        type: integer
        source: input
        description: Physical RV sites at the park
        constraints: 1..500
      - name: member_allocation_pct
        type: integer
        source: input
        description: Percentage of total_sites reserved for member bookings before any borrowing
        constraints: 0..100
      - name: member_pool_sites
        type: integer
        source: computed
        description: floor(total_sites * member_allocation_pct / 100)
      - name: transient_pool_sites
        type: integer
        source: computed
        description: total_sites - member_pool_sites
      - name: season_open_date
        type: string
        source: input
        description: ISO 8601 date (YYYY-MM-DD); first date of the operating season
      - name: season_close_date
        type: string
        source: input
        description: ISO 8601 date (YYYY-MM-DD); last date of the operating season, inclusive
        constraints: must be strictly after season_open_date
      - name: park_status
        type: enum
        source: system
        description: Operating state of the park
        default: SEASONAL_CLOSED
        constraints: "{SEASONAL_CLOSED, OPEN, MAINTENANCE_HOLD}"
      - name: amenity_compliance_status
        type: enum
        source: computed
        description: Derived from the newest AmenityInspection result and from forced_cancellation_count
        default: COMPLIANT
        constraints: "{COMPLIANT, PROBATION, NON_COMPLIANT}"
      - name: rating_score
        type: number
        source: computed
        description: Recency-weighted lifetime member satisfaction score (park_rating_score variant recency_weighted_lifetime), 2 decimals
        default: 0.00
      - name: forced_cancellation_count
        type: integer
        source: computed
        description: Count of reservations this park has force-cancelled through maintenance activation or season closure during the current calendar year
        default: 0
      - name: funded_capital_cents_ytd
        type: integer
        source: computed
        description: Sum of funded_amount_cents over this park's CapitalProject rows with status FUNDED in the current fiscal year
        default: 0
      - name: last_inspection_at
        type: datetime
        source: computed
        description: inspected_at of the newest AmenityInspection for this park, null when none exists
        default: null

  - name: Reservation
    parent: null
    common_fields: true
    fields:
      - name: park_id
        type: string
        source: input
        description: FK -> Park.id; the park being occupied
      - name: membership_id
        type: string
        source: input
        description: FK -> Membership.id; null for transient public bookings
        default: null
      - name: booker_type
        type: enum
        source: system
        description: MEMBER when membership_id is non-null, TRANSIENT otherwise
        constraints: "{MEMBER, TRANSIENT}"
      - name: guest_name
        type: string
        source: input
        description: Name of the transient public guest; null for member bookings
        default: null
      - name: arrival_date
        type: string
        source: input
        description: ISO 8601 date (YYYY-MM-DD); first occupied night
      - name: departure_date
        type: string
        source: system
        description: ISO 8601 date (YYYY-MM-DD); exclusive end of the occupied night set, mutated by extensions and check-out
      - name: scheduled_departure_date
        type: string
        source: input
        description: ISO 8601 date (YYYY-MM-DD); the departure date requested at booking, never mutated
      - name: nights
        type: integer
        source: computed
        description: departure_date - arrival_date in days; the size of the occupied night set
      - name: status
        type: enum
        source: system
        description: Reservation lifecycle
        default: PENDING
        constraints: "{PENDING, CONFIRMED, WAITLISTED, CHECKED_IN, EXTENSION_REVIEW, COMPLETED, CANCELLED, EXPIRED}"
      - name: pool_charged
        type: enum
        source: computed
        description: Which capacity pool this reservation occupies; MEMBER_POOL, BORROWED_TRANSIENT for a member booking that borrowed a transient site, TRANSIENT_POOL for public bookings, NONE while PENDING/WAITLISTED/CANCELLED/EXPIRED
        default: NONE
        constraints: "{NONE, MEMBER_POOL, BORROWED_TRANSIENT, TRANSIENT_POOL}"
      - name: entitlement_nights_charged
        type: integer
        source: computed
        description: Nights currently debited from the membership's park-class bucket by this reservation; 0 for transient bookings and for non-charging states
        default: 0
      - name: affiliate_nights_charged
        type: integer
        source: computed
        description: Nights currently debited from the park's AffiliateAgreement quota by this reservation
        default: 0
      - name: total_charge_cents
        type: integer
        source: computed
        description: Cash charge for a transient booking (transient_stay_charge); 0 for member bookings
        default: 0
      - name: extension_count
        type: integer
        source: computed
        description: Number of granted extensions applied to this reservation
        default: 0
      - name: extension_denied_count
        type: integer
        source: computed
        description: Number of extension requests denied by a ComplianceOfficer on this reservation
        default: 0
      - name: cancellation_reason
        type: enum
        source: system
        description: Why the reservation left CONFIRMED/WAITLISTED without being stayed
        default: null
        constraints: "{MEMBER_REQUEST, MEMBERSHIP_SUSPENDED, MAINTENANCE, SEASON_CLOSURE, null}"
      - name: checked_in_at
        type: datetime
        source: system
        description: Logical-clock instant of check-in, null before it
        default: null
      - name: checked_out_at
        type: datetime
        source: system
        description: Logical-clock instant of check-out, null before it
        default: null
      - name: consecutive_run_nights
        type: integer
        source: computed
        description: Size of the merged occupancy run at this park that contains this reservation (consecutive_occupancy_nights)
        default: 0

  - name: AffiliateAgreement
    parent: null
    common_fields: true
    fields:
      - name: partner_name
        type: string
        source: input
        description: Partner campground system name
        constraints: unique across AffiliateAgreement
      - name: status
        type: enum
        source: system
        description: Agreement lifecycle
        default: DRAFT
        constraints: "{DRAFT, ACTIVE, SUSPENDED, EXPIRED}"
      - name: effective_from
        type: string
        source: input
        description: ISO 8601 date (YYYY-MM-DD); first date member stays may occupy partner parks
      - name: effective_to
        type: string
        source: input
        description: ISO 8601 date (YYYY-MM-DD); last date member stays may occupy partner parks, inclusive
      - name: annual_member_night_quota
        type: integer
        source: input
        description: Quota nights the club may consume per calendar year under this agreement
        constraints: ">= 1"
      - name: reciprocity_ratio
        type: number
        source: input
        description: Quota nights consumed per occupied night; charged as ceil(nights * reciprocity_ratio)
        constraints: 0.5..3.0
      - name: min_tier_rank
        type: integer
        source: input
        description: Lowest MembershipTier.tier_rank permitted to book parks under this agreement
        constraints: 1..5
      - name: advance_window_cap_days
        type: integer
        source: input
        description: Caps the effective advance window for stays at parks under this agreement
        constraints: 1..365
      - name: per_stay_night_cap
        type: integer
        source: input
        description: Maximum occupied nights in a single stay at a park under this agreement
        constraints: 1..30
      - name: settlement_rate_cents_per_night
        type: integer
        source: input
        description: Cents owed to the partner per quota night consumed
        constraints: ">= 0"
      - name: nights_consumed_ytd
        type: integer
        source: computed
        description: Sum of affiliate_nights_charged over reservations at parks under this agreement whose status IN {CONFIRMED, CHECKED_IN, COMPLETED} with arrival_date in the current calendar year
        default: 0
      - name: settlement_owed_cents
        type: integer
        source: computed
        description: nights_consumed_ytd * settlement_rate_cents_per_night
        default: 0

  - name: DuesInvoice
    parent: null
    common_fields: true
    fields:
      - name: membership_id
        type: string
        source: system
        description: FK -> Membership.id; the billed membership
      - name: cycle_year
        type: integer
        source: system
        description: Dues year this invoice bills
      - name: amount_cents
        type: integer
        source: computed
        description: Output of dues_invoice_total at issuance; frozen thereafter
      - name: base_dues_cents
        type: integer
        source: computed
        description: MembershipTier.annual_dues_cents captured at issuance
      - name: capital_assessment_cents
        type: integer
        source: computed
        description: Step 2 of dues_invoice_total
      - name: loyalty_credit_cents
        type: integer
        source: computed
        description: Step 5 of dues_invoice_total
      - name: late_fee_cents
        type: integer
        source: computed
        description: Output of dues_late_fee; recomputed on every POST /ops/dues-delinquency-run while the invoice is unpaid
        default: 0
      - name: paid_amount_cents
        type: integer
        source: computed
        description: Cash applied to this invoice; reset to 0 by a payment reversal
        default: 0
      - name: due_date
        type: string
        source: system
        description: ISO 8601 date (YYYY-MM-DD); issuance date + DUES_NET_DAYS days
      - name: paid_at
        type: datetime
        source: system
        description: Logical-clock instant of the settling payment, null when unpaid
        default: null
      - name: status
        type: enum
        source: system
        description: Invoice lifecycle
        default: OPEN
        constraints: "{OPEN, PAST_DUE, PAID, WRITTEN_OFF}"
      - name: days_past_due
        type: integer
        source: computed
        description: max(0, current logical date - due_date in days) as of the last POST /ops/dues-delinquency-run; 0 before the first run
        default: 0

  - name: TransferRequest
    parent: null
    common_fields: true
    fields:
      - name: membership_id
        type: string
        source: input
        description: FK -> Membership.id; the membership being transferred
      - name: from_member_id
        type: string
        source: system
        description: FK -> Member.id; copied from Membership.member_id at submission
      - name: to_member_id
        type: string
        source: input
        description: FK -> Member.id; the receiving natural person
      - name: transfer_type
        type: enum
        source: input
        description: Basis of the transfer; drives the fee multiplier and whether the resale hold applies
        constraints: "{GIFT, RESALE, ESTATE}"
      - name: sale_price_cents
        type: integer
        source: input
        description: Agreed resale price in cents; required when transfer_type is RESALE, must be omitted or 0 otherwise
        default: 0
      - name: status
        type: enum
        source: system
        description: Request lifecycle
        default: SUBMITTED
        constraints: "{SUBMITTED, APPROVED, REJECTED, VOIDED}"
      - name: transfer_fee_cents
        type: integer
        source: computed
        description: Output of transfer_fee_total, computed at submission and frozen
      - name: successor_membership_id
        type: string
        source: system
        description: FK -> Membership.id; the membership minted on approval, null otherwise
        default: null
      - name: decided_by_user_id
        type: string
        source: system
        description: X-User-ID of the ClubAdmin who approved or rejected, null while SUBMITTED
        default: null
      - name: decided_at
        type: datetime
        source: system
        description: Logical-clock instant of the decision, null while SUBMITTED
        default: null
      - name: rejection_reason
        type: string
        source: input
        description: Free-text reason recorded on a REJECTED or VOIDED request
        default: null

  - name: AmenityInspection
    parent: null
    common_fields: false
    fields:
      - name: park_id
        type: string
        source: input
        description: FK -> Park.id; the inspected park
      - name: inspected_at
        type: datetime
        source: system
        description: Logical-clock instant of the inspection
      - name: inspector_user_id
        type: string
        source: system
        description: X-User-ID of the ParkManager who filed the inspection
      - name: restroom_score
        type: integer
        source: input
        description: Restroom and shower-house standard score
        constraints: 1..5
      - name: hookup_score
        type: integer
        source: input
        description: Water/sewer/electric hookup standard score
        constraints: 1..5
      - name: utility_score
        type: integer
        source: input
        description: Utility plant and dump-station standard score
        constraints: 1..5
      - name: road_score
        type: integer
        source: input
        description: Interior road and pad standard score
        constraints: 1..5
      - name: composite_score
        type: number
        source: computed
        description: Output of amenity_composite_score, 2 decimals
      - name: result
        type: enum
        source: computed
        description: Banded from composite_score
        constraints: "{PASS, PROBATION, FAIL}"

  - name: SatisfactionSurvey
    parent: null
    common_fields: false
    fields:
      - name: reservation_id
        type: string
        source: input
        description: FK -> Reservation.id; the completed stay being rated
      - name: park_id
        type: string
        source: system
        description: FK -> Park.id; copied from the rated reservation
      - name: membership_id
        type: string
        source: system
        description: FK -> Membership.id; copied from the rated reservation
      - name: overall_rating
        type: integer
        source: input
        description: Overall stay rating
        constraints: 1..5
      - name: cleanliness_rating
        type: integer
        source: input
        description: Cleanliness rating
        constraints: 1..5
      - name: staff_rating
        type: integer
        source: input
        description: Staff rating
        constraints: 1..5
      - name: value_rating
        type: integer
        source: input
        description: Value-for-dues rating
        constraints: 1..5
      - name: weighted_score
        type: number
        source: computed
        description: Output of survey_weighted_score, 2 decimals
      - name: submitted_at
        type: datetime
        source: system
        description: Logical-clock instant of submission; drives both park_rating_score variants

  - name: CapitalProject
    parent: null
    common_fields: true
    fields:
      - name: park_id
        type: string
        source: input
        description: FK -> Park.id; the park to be reinvested in
      - name: title
        type: string
        source: input
        description: Short project title
      - name: category
        type: enum
        source: input
        description: Project category; selects the category weight in capital_priority_score
        constraints: "{SAFETY, UTILITY, AMENITY, EXPANSION}"
      - name: requested_cost_cents
        type: integer
        source: input
        description: Requested capital cost in cents
        constraints: ">= 1"
      - name: fiscal_year
        type: integer
        source: input
        description: Fiscal year the project competes in
        constraints: 2020..2100
      - name: status
        type: enum
        source: system
        description: Project lifecycle
        default: PROPOSED
        constraints: "{PROPOSED, APPROVED, REJECTED, FUNDED, DEFERRED}"
      - name: priority_score
        type: integer
        source: computed
        description: Output of capital_priority_score; recomputed on creation, whenever the park's amenity_compliance_status or rating_score changes, and at the start of every reinvestment run
        default: 0
      - name: funded_amount_cents
        type: integer
        source: computed
        description: Cents allocated by the newest reinvestment run; 0 unless status is FUNDED
        default: 0
      - name: requested_by_user_id
        type: string
        source: system
        description: X-User-ID of the proposing actor (a Park id for ParkManager, an opaque operator id for ClubAdmin)
      - name: decided_by_user_id
        type: string
        source: system
        description: X-User-ID of the ClubAdmin who approved or rejected; must differ from requested_by_user_id
        default: null

  - name: OccupancyException
    parent: null
    common_fields: true
    fields:
      - name: reservation_id
        type: string
        source: input
        description: FK -> Reservation.id; the stay whose merged occupancy run exceeds the tier limit
      - name: requested_run_nights
        type: integer
        source: system
        description: Merged occupancy run length that would result if the pending extension were applied
      - name: tier_limit_nights
        type: integer
        source: system
        description: MembershipTier.max_consecutive_stay_nights captured at request time
      - name: reason
        type: enum
        source: input
        description: Policy basis for exceeding the long-term occupancy limit
        constraints: "{MEDICAL, EMPLOYMENT, WEATHER, RIG_REPAIR}"
      - name: status
        type: enum
        source: system
        description: Exception lifecycle
        default: REQUESTED
        constraints: "{REQUESTED, GRANTED, DENIED}"
      - name: granted_run_nights
        type: integer
        source: computed
        description: Merged run length the ComplianceOfficer authorised; 0 unless status is GRANTED
        default: 0
      - name: requested_by_user_id
        type: string
        source: system
        description: X-User-ID of the Member who requested the extension
      - name: decided_by_user_id
        type: string
        source: system
        description: X-User-ID of the ComplianceOfficer who decided, null while REQUESTED
        default: null
      - name: decision_note
        type: string
        source: input
        description: Free-text decision note
        default: null

  - name: MaintenanceWindow
    parent: null
    common_fields: true
    fields:
      - name: park_id
        type: string
        source: input
        description: FK -> Park.id; the park taken out of service
      - name: start_date
        type: string
        source: input
        description: ISO 8601 date (YYYY-MM-DD); first blocked night, inclusive
      - name: end_date
        type: string
        source: input
        description: ISO 8601 date (YYYY-MM-DD); last blocked night, INCLUSIVE — the window is a closed interval
      - name: work_type
        type: enum
        source: input
        description: Nature of the work
        constraints: "{ROUTINE, CAPITAL, EMERGENCY}"
      - name: status
        type: enum
        source: system
        description: Window lifecycle
        default: SCHEDULED
        constraints: "{SCHEDULED, ACTIVE, COMPLETED}"
      - name: cancelled_reservation_count
        type: integer
        source: computed
        description: Reservations force-cancelled when this window was activated
        default: 0

state_machines:
  # ---------------------------------------------------------------------------
  # Membership carries TWO independent state axes on the same row (parallel
  # dimensions). membership_status is driven by admin action, transfer decisions
  # and delinquency cascade; dues_status is driven only by the dues ops run and
  # by invoice payment/reversal. Neither axis constrains the other's reachable
  # values except through the explicit preconditions listed below.
  # ---------------------------------------------------------------------------
  - entity: Membership
    state_field: membership_status
    initial_state: ACTIVE
    terminal_states: [TERMINATED]
    transitions:
      - from: ACTIVE
        to: SUSPENDED
        trigger: "POST /memberships/{id}/suspension"
        actor: ClubAdmin
        preconditions:
          - "membership_status == ACTIVE"
        side_effects:
          - "suspension_reason := body.reason (ADMIN_ACTION or OCCUPANCY_POLICY)"
          - "every Reservation of this membership with status IN {CONFIRMED, WAITLISTED} and arrival_date > current logical date -> CANCELLED with cancellation_reason MEMBERSHIP_SUSPENDED"
          - "each such cancellation credits entitlement_nights_charged back to nights_used_class_<park.park_class> and affiliate_nights_charged back to the park's AffiliateAgreement.nights_consumed_ytd, then releases its pool seat and runs waitlist_promotion on the freed park/nights"
          - "any TransferRequest of this membership with status SUBMITTED -> VOIDED"
          - "increments Membership.version by 1"
      - from: ACTIVE
        to: SUSPENDED
        trigger: "POST /ops/dues-delinquency-run (system, fired for each membership whose dues_status advanced to DELINQUENT in this run)"
        actor: system
        preconditions:
          - "dues_status transitioned to DELINQUENT in this same run"
          - "membership_status IN {ACTIVE, TRANSFER_PENDING}"
        side_effects:
          - "suspension_reason := DUES_DELINQUENCY"
          - "cascade link 4: every Reservation of this membership with status IN {CONFIRMED, WAITLISTED} and arrival_date > current logical date -> CANCELLED with cancellation_reason MEMBERSHIP_SUSPENDED"
          - "cascade link 5: each cancellation credits entitlement_nights_charged back to the membership's class bucket and releases the pool seat"
          - "cascade link 6: the released member-pool seats trigger waitlist_promotion at that park for the freed nights"
          - "any TransferRequest of this membership with status SUBMITTED -> VOIDED"
          - "increments Membership.version by 1"
      - from: TRANSFER_PENDING
        to: SUSPENDED
        trigger: "POST /ops/dues-delinquency-run (system, same cascade as ACTIVE -> SUSPENDED)"
        actor: system
        preconditions:
          - "dues_status transitioned to DELINQUENT in this same run"
        side_effects:
          - "suspension_reason := DUES_DELINQUENCY"
          - "the membership's SUBMITTED TransferRequest -> VOIDED with rejection_reason 'dues delinquency'"
          - "increments Membership.version by 1"
      - from: SUSPENDED
        to: ACTIVE
        trigger: "POST /memberships/{id}/reinstatement"
        actor: ClubAdmin
        preconditions:
          - "membership_status == SUSPENDED"
          - "dues_status == CURRENT"
          - "body.reinstatement_fee_paid_cents >= REINSTATEMENT_FEE_CENTS"
        side_effects:
          - "suspension_reason := null"
          - "increments Membership.version by 1"
        note: "Cycle back into ACTIVE; previously cancelled reservations are NOT restored."
      - from: ACTIVE
        to: TRANSFER_PENDING
        trigger: "POST /transfer-requests"
        actor: Member
        preconditions:
          - "membership_status == ACTIVE"
          - "dues_status == CURRENT"
          - "no Reservation of this membership has status IN {CONFIRMED, CHECKED_IN, EXTENSION_REVIEW}"
        side_effects:
          - "TransferRequest created with status SUBMITTED and transfer_fee_cents from transfer_fee_total"
          - "increments Membership.version by 1"
      - from: TRANSFER_PENDING
        to: ACTIVE
        trigger: "POST /transfer-requests/{id}/decision with decision REJECT"
        actor: ClubAdmin
        preconditions:
          - "the request's status == SUBMITTED"
        side_effects:
          - "TransferRequest -> REJECTED, decided_by_user_id and decided_at stamped"
          - "increments Membership.version by 1"
      - from: TRANSFER_PENDING
        to: TERMINATED
        trigger: "POST /transfer-requests/{id}/decision with decision APPROVE"
        actor: ClubAdmin
        preconditions:
          - "the request's status == SUBMITTED"
          - "dues_status == CURRENT"
        side_effects:
          - "a successor Membership row is minted for to_member_id with tier_id, tenure_origin_at and dues_paid_through copied verbatim, transferred_from_membership_id := this membership id, transfer_count := this.transfer_count + 1, purchased_at := current logical instant, nights_used_class_a/b/c := 0, membership_status ACTIVE, dues_status CURRENT"
          - "TransferRequest -> APPROVED with successor_membership_id set"
          - "this membership's remaining WAITLISTED reservations -> EXPIRED"
          - "increments Membership.version by 1"
      - from: SUSPENDED
        to: TERMINATED
        trigger: "POST /ops/dues-delinquency-run (system, when dues_status advances to WRITTEN_OFF)"
        actor: system
        preconditions:
          - "dues_status transitioned to WRITTEN_OFF in this same run"
        side_effects:
          - "every Reservation of this membership with status IN {CONFIRMED, WAITLISTED} -> CANCELLED / EXPIRED respectively"
          - "increments Membership.version by 1"

  - entity: Membership
    state_field: dues_status
    initial_state: CURRENT
    terminal_states: [WRITTEN_OFF]
    transitions:
      - from: CURRENT
        to: GRACE
        trigger: "POST /ops/dues-delinquency-run"
        actor: system
        preconditions:
          - "the membership has a DuesInvoice with status IN {OPEN, PAST_DUE} whose days_past_due IS >= DUES_GRACE_START_DAYS and < DUES_DELINQUENT_DAYS"
        side_effects:
          - "the invoice -> PAST_DUE and its late_fee_cents is recomputed by dues_late_fee"
          - "increments Membership.version by 1"
        note: "GRACE members may still book CLASS_B and CLASS_C parks but are refused at CLASS_A parks."
      - from: CURRENT
        to: DELINQUENT
        trigger: "POST /ops/dues-delinquency-run"
        actor: system
        preconditions:
          - "the membership has a DuesInvoice with status IN {OPEN, PAST_DUE} whose days_past_due IS >= DUES_DELINQUENT_DAYS and < DUES_WRITE_OFF_DAYS"
        side_effects:
          - "cascade link 1: the invoice -> PAST_DUE with late_fee_cents recomputed"
          - "cascade link 2: dues_status := DELINQUENT"
          - "cascade link 3: membership_status ACTIVE|TRANSFER_PENDING -> SUSPENDED with suspension_reason DUES_DELINQUENCY (see the membership_status axis for links 4-6)"
          - "increments Membership.version by 1"
        note: "A membership can reach DELINQUENT without ever being observed in GRACE when no run executed inside the grace band."
      - from: GRACE
        to: DELINQUENT
        trigger: "POST /ops/dues-delinquency-run"
        actor: system
        preconditions:
          - "days_past_due IS >= DUES_DELINQUENT_DAYS and < DUES_WRITE_OFF_DAYS on an invoice with status PAST_DUE"
        side_effects:
          - "same links 1-6 as CURRENT -> DELINQUENT"
          - "increments Membership.version by 1"
      - from: GRACE
        to: CURRENT
        trigger: "POST /dues-invoices/{id}/payments"
        actor: Member | ClubAdmin
        preconditions:
          - "the payment settles the invoice in full (body.amount_cents == amount_cents + late_fee_cents - paid_amount_cents)"
          - "no other DuesInvoice of this membership has status PAST_DUE after this payment"
        side_effects:
          - "invoice -> PAID with paid_at and paid_amount_cents stamped"
          - "dues_paid_through := invoice due_date + DUES_CYCLE_DAYS"
          - "dues_balance_cents recomputed"
          - "increments Membership.version by 1"
      - from: DELINQUENT
        to: CURRENT
        trigger: "POST /dues-invoices/{id}/payments"
        actor: Member | ClubAdmin
        preconditions:
          - "the payment settles the invoice in full"
          - "no other DuesInvoice of this membership has status PAST_DUE after this payment"
        side_effects:
          - "invoice -> PAID; dues_paid_through advanced; dues_balance_cents recomputed"
          - "membership_status remains SUSPENDED — reinstatement is a separate ClubAdmin action"
          - "increments Membership.version by 1"
      - from: CURRENT
        to: GRACE
        trigger: "POST /dues-invoices/{id}/payment-reversals"
        actor: ClubAdmin
        preconditions:
          - "the reversed invoice's due_date < current logical date"
        side_effects:
          - "invoice PAID -> PAST_DUE, paid_amount_cents := 0, paid_at := null, late_fee_cents recomputed by dues_late_fee"
          - "dues_paid_through rolled back to its pre-payment value"
          - "dues_balance_cents recomputed — the compensating action restores the exact pre-payment balance"
          - "increments Membership.version by 1"
      - from: DELINQUENT
        to: WRITTEN_OFF
        trigger: "POST /ops/dues-delinquency-run"
        actor: system
        preconditions:
          - "days_past_due >= DUES_WRITE_OFF_DAYS on an invoice with status PAST_DUE"
        side_effects:
          - "the invoice -> WRITTEN_OFF"
          - "membership_status SUSPENDED -> TERMINATED"
          - "increments Membership.version by 1"

  - entity: Reservation
    state_field: status
    initial_state: PENDING
    terminal_states: [COMPLETED, CANCELLED, EXPIRED]
    transitions:
      - from: PENDING
        to: CONFIRMED
        trigger: "POST /reservations (member) or POST /transient-reservations (public); resolved inside the same request"
        actor: Member | TransientGuest | ParkManager
        preconditions:
          - "every §1.4 row up to priority 26 passes for this request"
          - "park_capacity_allocation returns a seat: MEMBER_POOL, or BORROWED_TRANSIENT for a member booking, or TRANSIENT_POOL for a public booking"
        side_effects:
          - "pool_charged := the pool granted by park_capacity_allocation"
          - "member booking: entitlement_nights_charged := nights (entitlement_nights_charge variant provisional_at_confirmation) and Membership.nights_used_class_<park.park_class> += nights; annual_nights_used recomputed; Membership.version += 1"
          - "member booking at a park whose affiliate_agreement_id is non-null: affiliate_nights_charged := ceil(nights * agreement.reciprocity_ratio) and AffiliateAgreement.nights_consumed_ytd += that amount; settlement_owed_cents recomputed"
          - "transient booking: total_charge_cents := transient_stay_charge"
          - "consecutive_run_nights := consecutive_occupancy_nights for this membership at this park"
          - "departure_date := scheduled_departure_date"
      - from: PENDING
        to: WAITLISTED
        trigger: "POST /reservations (member); resolved inside the same request"
        actor: Member
        preconditions:
          - "booker_type == MEMBER"
          - "every §1.4 row up to priority 26 passes for this request"
          - "park_capacity_allocation grants no seat: on at least one requested night the member pool is full AND transient borrowing is unavailable"
        side_effects:
          - "pool_charged := NONE; entitlement_nights_charged := 0; affiliate_nights_charged := 0 — a waitlisted stay debits nothing"
          - "departure_date := scheduled_departure_date"
        note: "A transient booking that finds no seat is rejected with ERR_NO_TRANSIENT_CAPACITY instead of being waitlisted."
      - from: WAITLISTED
        to: CONFIRMED
        trigger: "system waitlist_promotion, fired by any member-pool release at the park (reservation cancellation, suspension cascade, maintenance completion, check-out)"
        actor: system
        preconditions:
          - "the reservation is the winner of waitlist_promotion for the released park/night set"
          - "its Membership has membership_status ACTIVE and dues_status IN {CURRENT, GRACE}"
          - "its Membership still has entitlement headroom for the stay"
        side_effects:
          - "pool_charged := MEMBER_POOL"
          - "entitlement_nights_charged := nights; Membership.nights_used_class_<class> += nights; Membership.version += 1"
          - "affiliate quota debited when the park belongs to an agreement"
          - "consecutive_run_nights recomputed"
      - from: WAITLISTED
        to: CANCELLED
        trigger: "POST /reservations/{id}/cancellation"
        actor: Member | ClubAdmin
        preconditions:
          - "status == WAITLISTED"
        side_effects:
          - "cancellation_reason := MEMBER_REQUEST"
          - "no entitlement or capacity change (nothing was debited)"
      - from: WAITLISTED
        to: EXPIRED
        trigger: "POST /ops/dues-delinquency-run (system sweep of stale waitlist rows)"
        actor: system
        preconditions:
          - "arrival_date < current logical date"
        side_effects:
          - "no entitlement or capacity change"
      - from: CONFIRMED
        to: CANCELLED
        trigger: "POST /reservations/{id}/cancellation"
        actor: Member | ClubAdmin
        preconditions:
          - "status == CONFIRMED"
        side_effects:
          - "cancellation_reason := MEMBER_REQUEST"
          - "member booking: Membership.nights_used_class_<class> -= entitlement_nights_charged, then entitlement_nights_charged := 0; Membership.version += 1 — the compensating action leaves the entitlement invariant intact"
          - "affiliate park: AffiliateAgreement.nights_consumed_ytd -= affiliate_nights_charged, then affiliate_nights_charged := 0; settlement_owed_cents recomputed"
          - "pool_charged := NONE, releasing the seat on every night of the stay"
          - "waitlist_promotion runs on the released park/night set"
      - from: CONFIRMED
        to: CANCELLED
        trigger: "POST /maintenance-windows/{id}/activation or POST /parks/{id}/season-closures (system force-cancel)"
        actor: system
        preconditions:
          - "the reservation's night set intersects the closed interval [MaintenanceWindow.start_date, MaintenanceWindow.end_date], or the park is being closed for the season"
        side_effects:
          - "cancellation_reason := MAINTENANCE or SEASON_CLOSURE"
          - "entitlement and affiliate quota credited back exactly as in the member-request cancellation"
          - "Park.forced_cancellation_count += 1 and MaintenanceWindow.cancelled_reservation_count += 1"
          - "no waitlist_promotion is run — the park cannot host anyone during the hold"
      - from: CONFIRMED
        to: CHECKED_IN
        trigger: "POST /reservations/{id}/check-in"
        actor: ParkManager
        preconditions:
          - "status == CONFIRMED"
          - "Park.park_status == OPEN"
          - "Membership.membership_status == ACTIVE"
          - "current logical date IS >= arrival_date and < departure_date"
        side_effects:
          - "checked_in_at := current logical instant"
      - from: CHECKED_IN
        to: CHECKED_IN
        trigger: "POST /reservations/{id}/extensions when the resulting merged run stays within the tier limit"
        actor: Member
        preconditions:
          - "status == CHECKED_IN"
          - "consecutive_occupancy_nights with the extension applied IS <= tier.max_consecutive_stay_nights"
          - "entitlement headroom covers the added nights, i.e. body.new_departure_date minus the current departure_date"
        side_effects:
          - "departure_date := body.new_departure_date; nights recomputed"
          - "entitlement_nights_charged += the added nights; Membership.nights_used_class_<class> += the added nights; Membership.version += 1"
          - "extension_count += 1; consecutive_run_nights recomputed"
      - from: CHECKED_IN
        to: EXTENSION_REVIEW
        trigger: "POST /reservations/{id}/extensions when the resulting merged run exceeds the tier limit"
        actor: Member
        preconditions:
          - "status == CHECKED_IN"
          - "consecutive_occupancy_nights with the extension applied IS > tier.max_consecutive_stay_nights"
          - "consecutive_occupancy_nights with the extension applied IS <= ABSOLUTE_MAX_RUN_NIGHTS"
        side_effects:
          - "an OccupancyException is created with status REQUESTED, requested_run_nights := the projected merged run, tier_limit_nights := tier.max_consecutive_stay_nights, requested_by_user_id := X-User-ID"
          - "departure_date := body.new_departure_date immediately, but NO entitlement is debited yet — the added nights are debited only if the exception is GRANTED, and departure_date is rolled back if it is DENIED"
      - from: EXTENSION_REVIEW
        to: CHECKED_IN
        trigger: "POST /occupancy-exceptions/{id}/decision with decision GRANT"
        actor: ComplianceOfficer
        preconditions:
          - "the exception's status == REQUESTED"
          - "body.granted_run_nights IS >= tier_limit_nights and <= ABSOLUTE_MAX_RUN_NIGHTS"
          - "the membership still has entitlement headroom for the granted nights"
        side_effects:
          - "OccupancyException -> GRANTED with granted_run_nights and decided_by_user_id stamped"
          - "departure_date := arrival_date + (granted_run_nights - nights already in the run before this reservation), which equals the requested new_departure_date whenever granted_run_nights == requested_run_nights and is shorter on a partial grant"
          - "entitlement_nights_charged and Membership.nights_used_class_<class> increased by the granted delta; Membership.version += 1"
          - "extension_count += 1; consecutive_run_nights recomputed"
        note: "Cycle: the reservation returns to CHECKED_IN and may request another extension."
      - from: EXTENSION_REVIEW
        to: CHECKED_IN
        trigger: "POST /occupancy-exceptions/{id}/decision with decision DENY"
        actor: ComplianceOfficer
        preconditions:
          - "the exception's status == REQUESTED"
        side_effects:
          - "OccupancyException -> DENIED with decided_by_user_id stamped"
          - "departure_date rolled back to its pre-extension value and no entitlement debited"
          - "extension_denied_count += 1"
      - from: CHECKED_IN
        to: COMPLETED
        trigger: "POST /reservations/{id}/check-out"
        actor: ParkManager
        preconditions:
          - "status == CHECKED_IN"
          - "body.actual_departure_date IS > arrival_date and <= departure_date"
        side_effects:
          - "checked_out_at := current logical instant; departure_date := body.actual_departure_date; nights recomputed"
          - "entitlement_nights_charge switches to variant final_at_checkout: Membership.nights_used_class_<class> -= (previous entitlement_nights_charged - final nights); entitlement_nights_charged := final nights; Membership.version += 1"
          - "affiliate quota re-derived from the final nights and the difference credited back to AffiliateAgreement.nights_consumed_ytd"
          - "pool seat released for every night from actual_departure_date onward, then waitlist_promotion runs on those nights"

  - entity: Park
    state_field: park_status
    initial_state: SEASONAL_CLOSED
    terminal_states: []
    transitions:
      - from: SEASONAL_CLOSED
        to: OPEN
        trigger: "POST /parks/{id}/season-openings"
        actor: ParkManager
        preconditions:
          - "park_status == SEASONAL_CLOSED"
          - "current logical date IS >= season_open_date minus SEASON_OPEN_LEAD_DAYS days and <= season_close_date"
          - "no MaintenanceWindow of this park has status ACTIVE"
        side_effects:
          - "park_status := OPEN"
          - "increments Park.version by 1"
      - from: OPEN
        to: SEASONAL_CLOSED
        trigger: "POST /parks/{id}/season-closures"
        actor: ParkManager
        preconditions:
          - "park_status == OPEN"
          - "no Reservation at this park has status IN {CHECKED_IN, EXTENSION_REVIEW}"
        side_effects:
          - "every Reservation at this park with status CONFIRMED and arrival_date >= current logical date -> CANCELLED with cancellation_reason SEASON_CLOSURE (entitlement and affiliate quota credited back)"
          - "every Reservation at this park with status WAITLISTED -> EXPIRED"
          - "Park.forced_cancellation_count += the number of CONFIRMED reservations cancelled"
          - "increments Park.version by 1"
      - from: OPEN
        to: MAINTENANCE_HOLD
        trigger: "POST /maintenance-windows/{id}/activation"
        actor: ParkManager
        preconditions:
          - "park_status == OPEN"
          - "the window's status == SCHEDULED"
        side_effects:
          - "cascade link 1: MaintenanceWindow -> ACTIVE and park_status := MAINTENANCE_HOLD"
          - "cascade link 2: every Reservation at this park with status IN {CONFIRMED, WAITLISTED} whose night set intersects the CLOSED interval [start_date, end_date] -> CANCELLED (CONFIRMED) or EXPIRED (WAITLISTED) with cancellation_reason MAINTENANCE"
          - "cascade link 3: each cancelled reservation credits entitlement_nights_charged back to its Membership's class bucket (Membership.version += 1) and its affiliate_nights_charged back to the agreement quota"
          - "cascade link 4: Park.forced_cancellation_count += cancelled count; when forced_cancellation_count IS >= FORCED_CANCELLATION_PROBATION_THRESHOLD, amenity_compliance_status COMPLIANT -> PROBATION"
          - "cascade link 5: the amenity_compliance_status change re-runs capital_priority_score for every CapitalProject of this park with status IN {PROPOSED, APPROVED, DEFERRED}"
          - "MaintenanceWindow.cancelled_reservation_count := cancelled count"
          - "increments Park.version by 1"
      - from: MAINTENANCE_HOLD
        to: OPEN
        trigger: "POST /maintenance-windows/{id}/completion"
        actor: ParkManager
        preconditions:
          - "park_status == MAINTENANCE_HOLD"
          - "the window's status == ACTIVE"
        side_effects:
          - "MaintenanceWindow -> COMPLETED; park_status := OPEN"
          - "waitlist_promotion runs for the park's remaining WAITLISTED reservations whose night set starts after end_date"
          - "increments Park.version by 1"
        note: "Revert cycle: a park may be held and reopened any number of times inside one season."

  - entity: DuesInvoice
    state_field: status
    initial_state: OPEN
    terminal_states: [WRITTEN_OFF]
    transitions:
      - from: OPEN
        to: PAID
        trigger: "POST /dues-invoices/{id}/payments"
        actual_actor_note: "settles in full"
        actor: Member | ClubAdmin
        preconditions:
          - "status == OPEN"
          - "body.amount_cents == amount_cents + late_fee_cents - paid_amount_cents"
        side_effects:
          - "paid_amount_cents := body.amount_cents; paid_at := current logical instant"
          - "Membership.dues_balance_cents recomputed; Membership.dues_paid_through advanced"
      - from: OPEN
        to: PAST_DUE
        trigger: "POST /ops/dues-delinquency-run"
        actor: system
        preconditions:
          - "days_past_due >= DUES_GRACE_START_DAYS"
        side_effects:
          - "days_past_due := max(0, current logical date - due_date); late_fee_cents := dues_late_fee"
          - "the owning Membership's dues_status axis advances (see the dues_status machine)"
      - from: PAST_DUE
        to: PAID
        trigger: "POST /dues-invoices/{id}/payments"
        actor: Member | ClubAdmin
        preconditions:
          - "status == PAST_DUE"
          - "body.amount_cents == amount_cents + late_fee_cents - paid_amount_cents"
        side_effects:
          - "paid_amount_cents := body.amount_cents; paid_at stamped; Membership dues_status -> CURRENT"
      - from: PAID
        to: PAST_DUE
        trigger: "POST /dues-invoices/{id}/payment-reversals"
        actor: ClubAdmin
        preconditions:
          - "status == PAID"
          - "due_date < current logical date"
        side_effects:
          - "paid_amount_cents := 0; paid_at := null; late_fee_cents recomputed; Membership dues_status -> GRACE and dues_balance_cents restored to its pre-payment value"
      - from: PAID
        to: OPEN
        trigger: "POST /dues-invoices/{id}/payment-reversals"
        actor: ClubAdmin
        preconditions:
          - "status == PAID"
          - "due_date >= current logical date"
        side_effects:
          - "paid_amount_cents := 0; paid_at := null; late_fee_cents := 0; Membership dues_status stays CURRENT and dues_balance_cents restored to its pre-payment value"
      - from: PAST_DUE
        to: WRITTEN_OFF
        trigger: "POST /ops/dues-delinquency-run"
        actor: system
        preconditions:
          - "days_past_due >= DUES_WRITE_OFF_DAYS"
        side_effects:
          - "Membership dues_status -> WRITTEN_OFF and membership_status -> TERMINATED"

  - entity: TransferRequest
    state_field: status
    initial_state: SUBMITTED
    terminal_states: [APPROVED, REJECTED, VOIDED]
    transitions:
      - from: SUBMITTED
        to: APPROVED
        trigger: "POST /transfer-requests/{id}/decision with decision APPROVE"
        actor: ClubAdmin
        preconditions:
          - "status == SUBMITTED"
          - "the membership's dues_status == CURRENT"
          - "the membership's membership_status == TRANSFER_PENDING"
        side_effects:
          - "successor Membership minted (see Membership TRANSFER_PENDING -> TERMINATED); successor_membership_id set"
          - "decided_by_user_id, decided_at stamped"
      - from: SUBMITTED
        to: REJECTED
        trigger: "POST /transfer-requests/{id}/decision with decision REJECT"
        actor: ClubAdmin
        preconditions:
          - "status == SUBMITTED"
        side_effects:
          - "the membership returns to ACTIVE; NO successor membership is minted and no fee is retained"
          - "rejection_reason, decided_by_user_id, decided_at stamped"
        note: "Branch divergence: APPROVE mints a row and terminates the old membership; REJECT mutates nothing but this request and the membership_status axis."
      - from: SUBMITTED
        to: VOIDED
        trigger: "POST /memberships/{id}/suspension or POST /ops/dues-delinquency-run (system)"
        actor: system
        preconditions:
          - "the membership became SUSPENDED while this request was SUBMITTED"
        side_effects:
          - "rejection_reason := the suspension reason; decided_by_user_id stays null"

  - entity: OccupancyException
    state_field: status
    initial_state: REQUESTED
    terminal_states: [GRANTED, DENIED]
    transitions:
      - from: REQUESTED
        to: GRANTED
        trigger: "POST /occupancy-exceptions/{id}/decision with decision GRANT"
        actor: ComplianceOfficer
        preconditions:
          - "status == REQUESTED"
          - "body.granted_run_nights IS >= tier_limit_nights and <= ABSOLUTE_MAX_RUN_NIGHTS"
        side_effects:
          - "the reservation returns to CHECKED_IN with an extended departure_date (see the Reservation machine)"
      - from: REQUESTED
        to: DENIED
        trigger: "POST /occupancy-exceptions/{id}/decision with decision DENY"
        actor: ComplianceOfficer
        preconditions:
          - "status == REQUESTED"
        side_effects:
          - "the reservation returns to CHECKED_IN unchanged and extension_denied_count += 1"

  - entity: MaintenanceWindow
    state_field: status
    initial_state: SCHEDULED
    terminal_states: [COMPLETED]
    transitions:
      - from: SCHEDULED
        to: ACTIVE
        trigger: "POST /maintenance-windows/{id}/activation"
        actor: ParkManager
        preconditions:
          - "status == SCHEDULED"
          - "the park's park_status == OPEN"
        side_effects:
          - "the five-link park cascade documented on Park OPEN -> MAINTENANCE_HOLD"
      - from: ACTIVE
        to: COMPLETED
        trigger: "POST /maintenance-windows/{id}/completion"
        actor: ParkManager
        preconditions:
          - "status == ACTIVE"
        side_effects:
          - "park_status returns to OPEN and waitlist_promotion runs for nights after end_date"

  - entity: CapitalProject
    state_field: status
    initial_state: PROPOSED
    terminal_states: [REJECTED, FUNDED]
    transitions:
      - from: PROPOSED
        to: APPROVED
        trigger: "POST /capital-projects/{id}/decision with decision APPROVE"
        actor: ClubAdmin
        preconditions:
          - "status == PROPOSED"
          - "X-User-ID != requested_by_user_id (segregation of duties)"
          - "body.expected_park_version == Park.version"
          - "the park's amenity_compliance_status != NON_COMPLIANT OR category IN {SAFETY, UTILITY}"
        side_effects:
          - "priority_score recomputed by capital_priority_score against current park state"
          - "decided_by_user_id stamped; increments Park.version by 1"
      - from: PROPOSED
        to: REJECTED
        trigger: "POST /capital-projects/{id}/decision with decision REJECT"
        actor: ClubAdmin
        preconditions:
          - "status == PROPOSED"
          - "X-User-ID != requested_by_user_id"
          - "body.expected_park_version == Park.version"
        side_effects:
          - "decided_by_user_id stamped; funded_amount_cents stays 0; increments Park.version by 1"
      - from: APPROVED
        to: FUNDED
        trigger: "POST /ops/reinvestment-runs"
        actor: system
        preconditions:
          - "the project is reached by reinvestment_allocation with requested_cost_cents <= remaining budget"
        side_effects:
          - "funded_amount_cents := requested_cost_cents; Park.funded_capital_cents_ytd += that amount; increments Park.version by 1"
      - from: APPROVED
        to: DEFERRED
        trigger: "POST /ops/reinvestment-runs"
        actor: system
        preconditions:
          - "requested_cost_cents > remaining budget when the walk reaches this project"
        side_effects:
          - "funded_amount_cents stays 0; the walk continues to the next candidate (no partial funding, no early stop)"
      - from: DEFERRED
        to: FUNDED
        trigger: "POST /ops/reinvestment-runs (a later run)"
        actor: system
        preconditions:
          - "requested_cost_cents <= remaining budget when the walk reaches this project"
        side_effects:
          - "funded_amount_cents := requested_cost_cents; Park.funded_capital_cents_ytd += that amount; increments Park.version by 1"

  - entity: AffiliateAgreement
    state_field: status
    initial_state: DRAFT
    terminal_states: [EXPIRED]
    transitions:
      - from: DRAFT
        to: ACTIVE
        trigger: "POST /affiliate-agreements/{id}/status-changes with new_status ACTIVE"
        actor: ClubAdmin
        preconditions:
          - "status == DRAFT"
        side_effects:
          - "member bookings at this agreement's parks become permitted"
      - from: ACTIVE
        to: SUSPENDED
        trigger: "POST /affiliate-agreements/{id}/status-changes with new_status SUSPENDED"
        actor: ClubAdmin
        preconditions:
          - "status == ACTIVE"
        side_effects:
          - "new bookings at this agreement's parks are refused with ERR_AFFILIATE_AGREEMENT_INACTIVE; reservations already CONFIRMED or CHECKED_IN are untouched"
      - from: SUSPENDED
        to: ACTIVE
        trigger: "POST /affiliate-agreements/{id}/status-changes with new_status ACTIVE"
        actor: ClubAdmin
        preconditions:
          - "status == SUSPENDED"
        side_effects:
          - "bookings resume; nights_consumed_ytd is unchanged by the cycle"
        note: "Revert cycle on the agreement axis."
      - from: ACTIVE
        to: EXPIRED
        trigger: "POST /affiliate-agreements/{id}/status-changes with new_status EXPIRED"
        actor: ClubAdmin
        preconditions:
          - "status == ACTIVE"
        side_effects:
          - "no further bookings; nights_consumed_ytd and settlement_owed_cents freeze"

concurrency_rules:
  - rule_id: transfer-request-create-stale-membership
    parent_entity: Membership
    write_endpoint: "POST /transfer-requests"
    occ_field: "expected_membership_version"
    description: |
      Submitting a TransferRequest against a Membership whose version has advanced
      since the client last observed it is rejected with a stale-version error. The
      product spec lets a newly submitted request legitimately supersede the client's
      view of the membership (a prior request may have just been decided, a dues
      payment may have moved dues_paid_through, or a reservation may have changed the
      entitlement counters), so the write cannot be resolved by a state precondition
      alone — the writer must prove it read the membership at its current version.
    error_id: ERR_STALE_MEMBERSHIP_VERSION
    http_status: 412
  - rule_id: capital-project-decision-stale-park
    parent_entity: Park
    write_endpoint: "POST /capital-projects/{id}/decision"
    occ_field: "expected_park_version"
    description: |
      Deciding a CapitalProject against a Park whose version has advanced since the
      approver read it is rejected with a stale-version error. A decision is only
      meaningful against the park state that produced the project's priority_score;
      an intervening amenity inspection, satisfaction survey, maintenance cascade or
      sibling funding decision changes that score, so the approver's view is stale.
    error_id: ERR_STALE_PARK_VERSION
    http_status: 412

calculations:
  - name: entitlement_nights_charge
    trigger: "Reservation PENDING -> CONFIRMED, WAITLISTED -> CONFIRMED, CHECKED_IN extension, OccupancyException GRANT, and CHECKED_IN -> COMPLETED"
    algorithm: aggregation
    formula: |
      # Which class bucket a stay debits is fixed by the park, never by the tier.
      bucket = park.park_class            # CLASS_A -> nights_used_class_a, etc.

      # variant provisional_at_confirmation (used at CONFIRMED and at every extension)
      provisional_nights = (scheduled_departure_date - arrival_date).days
      Membership.nights_used_<bucket> += provisional_nights

      # variant final_at_checkout (used at CHECKED_IN -> COMPLETED)
      final_nights = (actual_departure_date - arrival_date).days
      delta = Reservation.entitlement_nights_charged - final_nights   # >= 0 on early departure
      Membership.nights_used_<bucket> -= delta
      Reservation.entitlement_nights_charged = final_nights

      # Headroom gate evaluated BEFORE any debit (validation priority 26):
      #   provisional_nights + Membership.nights_used_<bucket> <= tier.entitlement_nights_<bucket>
      #   AND provisional_nights + Membership.annual_nights_used <= tier.annual_total_night_cap
    input_set: "Reservation rows of the membership whose status IS IN {CONFIRMED, CHECKED_IN, EXTENSION_REVIEW, COMPLETED} and whose arrival_date IS >= Membership.entitlement_year_start and < entitlement_year_start + 365 days. WAITLISTED, PENDING, CANCELLED and EXPIRED rows are excluded and debit nothing."
    constants:
      ENTITLEMENT_YEAR_DAYS: 365
    precision: "integer nights, no rounding"
    variants:
      - name: provisional_at_confirmation
        when: "the reservation becomes CONFIRMED (at booking or at waitlist promotion) and on every granted extension"
        difference: "charges the full scheduled night set up front, so a member who departs early has over-paid entitlement until check-out reconciles"
      - name: final_at_checkout
        when: "the reservation moves CHECKED_IN -> COMPLETED"
        difference: "charges only the nights actually occupied (actual_departure_date - arrival_date) and credits the difference back; identical inputs therefore yield a different nights_used value depending on which variant has run last"

  - name: park_capacity_allocation
    trigger: "POST /reservations and POST /transient-reservations, evaluated per requested night before the PENDING -> CONFIRMED / WAITLISTED fork"
    algorithm: interval_merge
    formula: |
      member_pool_sites    = floor(park.total_sites * park.member_allocation_pct / 100)
      transient_pool_sites = park.total_sites - member_pool_sites

      # Night sets are HALF-OPEN [arrival_date, departure_date): the departure day is
      # never occupied, so a stay departing on D and a stay arriving on D never collide.
      nights(r) = { d : r.arrival_date <= d < r.departure_date }

      occupying = Reservation rows at this park with status IN {CONFIRMED, CHECKED_IN, EXTENSION_REVIEW}
      member_committed(d)    = count(r in occupying where r.pool_charged == MEMBER_POOL          and d in nights(r))
      transient_committed(d) = count(r in occupying where r.pool_charged IN {TRANSIENT_POOL, BORROWED_TRANSIENT} and d in nights(r))

      # MEMBER request, evaluated over EVERY requested night:
      if for all d in nights(request): member_committed(d) + 1 <= member_pool_sites
          -> grant MEMBER_POOL
      elif for all d in nights(request): transient_committed(d) + 1 <= transient_pool_sites - TRANSIENT_FLOOR_SITES
          -> grant BORROWED_TRANSIENT        # members may borrow, but never below the public floor
      else
          -> grant nothing; the reservation resolves to WAITLISTED

      # TRANSIENT request, evaluated over EVERY requested night:
      if for all d in nights(request): transient_committed(d) + 1 <= transient_pool_sites
          -> grant TRANSIENT_POOL           # the public may use the whole transient pool
      else
          -> reject with ERR_NO_TRANSIENT_CAPACITY   # the public is never waitlisted and never borrows member sites
    input_set: "Only reservations with status IN {CONFIRMED, CHECKED_IN, EXTENSION_REVIEW} occupy a seat. PENDING, WAITLISTED, CANCELLED, EXPIRED and COMPLETED rows occupy nothing."
    constants:
      TRANSIENT_FLOOR_SITES: 1
      SEASON_OPEN_LEAD_DAYS: 30
    precision: "integer site counts; floor() on the member pool, never round-half-up"

  - name: waitlist_promotion
    trigger: "any member-pool release at a park: CONFIRMED -> CANCELLED, suspension cascade, CHECKED_IN -> COMPLETED with an early actual_departure_date, and MaintenanceWindow ACTIVE -> COMPLETED"
    algorithm: chronological
    formula: |
      # (a) eligibility filter
      candidates = Reservation rows where park_id == released park
                   AND status == WAITLISTED
                   AND booker_type == MEMBER
                   AND every night in nights(candidate) satisfies
                       member_committed(d) + 1 <= member_pool_sites   (recomputed after the release)
                   AND candidate.membership.membership_status == ACTIVE
                   AND candidate.membership.dues_status IN {CURRENT, GRACE}
                   AND the membership still has entitlement headroom for nights(candidate)
      # (b) ranking expression
      order candidates by created_at ASC
      # (c) tie-break when created_at ties
      then by arrival_date ASC
      # (d) empty-pool fallback
      if candidates is empty: no promotion occurs, no error is raised

      promote the first candidate -> CONFIRMED, then RE-EVALUATE the remaining
      candidates against the reduced free capacity and repeat until the candidate
      set is empty. A candidate that fails the eligibility filter is skipped and
      stays WAITLISTED; it is never expired by the promotion sweep.
    input_set: "WAITLISTED member reservations at the released park only; other parks are never touched by a release."
    constants: {}
    precision: "n/a"

  - name: transient_stay_charge
    trigger: "POST /transient-reservations, on PENDING -> CONFIRMED"
    algorithm: tiered_pricing
    formula: |
      base = CLASS_NIGHT_RATE_CENTS[park.park_class]
      for each night d in [arrival_date, departure_date):          # half-open
          peak    = PEAK_MULTIPLIER   if PEAK_START_MMDD <= MMDD(d) <= PEAK_END_MMDD else 1.00
          weekend = WEEKEND_MULTIPLIER if weekday(d) IN {FRI, SAT} else 1.00
          night_charge[d] = round_half_up(base * peak * weekend)    # ROUND PER NIGHT, to whole cents
      subtotal_cents = sum(night_charge[d] over all nights)          # THEN sum
      resort_fee_cents = round_half_up(subtotal_cents * RESORT_FEE_PCT)
      total_charge_cents = subtotal_cents + resort_fee_cents

      # Rounding order is PINNED: round each night first, then sum. The alternative
      # (sum the unrounded night rates, then round once) is WRONG here and differs by
      # up to one cent per night — e.g. two peak weekend CLASS_B nights are
      # 9626 + 9626 = 19252, not round(9625.5 + 9625.5) = 19251.
    input_set: "The night set of the single reservation being priced; no other reservation participates."
    constants:
      CLASS_NIGHT_RATE_CENTS: { CLASS_A: 8500, CLASS_B: 6200, CLASS_C: 4100 }
      PEAK_START_MMDD: "07-01"
      PEAK_END_MMDD: "09-07"
      PEAK_MULTIPLIER: 1.35
      WEEKEND_MULTIPLIER: 1.15
      RESORT_FEE_PCT: 0.09
    precision: "whole cents, round_half_up, applied per night and once more on the resort fee"

  - name: dues_invoice_total
    trigger: "POST /memberships (first cycle) and POST /ops/annual-dues-run (subsequent cycles)"
    algorithm: waterfall_allocation
    formula: |
      # Evaluation order is PINNED. The loyalty band keys off the SUBTOTAL, which itself
      # contains the capital assessment derived from the base dues - a circular-looking
      # dependency that is well defined only because the five steps run in this order.
      1. base_dues_cents          = tier.annual_dues_cents
      2. capital_assessment_cents = round_half_up(base_dues_cents * CAPITAL_ASSESSMENT_PCT)
      3. subtotal_cents           = base_dues_cents + capital_assessment_cents
      4. loyalty_pct =
             LOYALTY_PCT_HIGH_LONG if subtotal_cents >= LOYALTY_SUBTOTAL_BAND_CENTS and membership.tenure_years >= LOYALTY_TENURE_YEARS
             LOYALTY_PCT_HIGH      if subtotal_cents >= LOYALTY_SUBTOTAL_BAND_CENTS
             LOYALTY_PCT_LONG      if membership.tenure_years >= LOYALTY_TENURE_YEARS
             0.00                  otherwise
         loyalty_credit_cents     = round_half_up(subtotal_cents * loyalty_pct)
      5. amount_cents             = subtotal_cents - loyalty_credit_cents

      # Keying step 4 off base_dues_cents instead of subtotal_cents is the classic wrong
      # reading: base 58000 sits below the band, subtotal 62640 sits above it.
    input_set: "The single MembershipTier pinned on the membership plus the membership's tenure_years at issuance time."
    constants:
      CAPITAL_ASSESSMENT_PCT: 0.08
      LOYALTY_SUBTOTAL_BAND_CENTS: 60000
      LOYALTY_TENURE_YEARS: 5
      LOYALTY_PCT_HIGH_LONG: 0.10
      LOYALTY_PCT_HIGH: 0.05
      LOYALTY_PCT_LONG: 0.03
      DUES_NET_DAYS: 30
      DUES_CYCLE_DAYS: 365
    precision: "whole cents, round_half_up, applied once at step 2 and once at step 4"

  - name: dues_late_fee
    trigger: "POST /ops/dues-delinquency-run, for every DuesInvoice with status IN {OPEN, PAST_DUE} whose days_past_due >= DUES_GRACE_START_DAYS"
    algorithm: threshold
    formula: |
      days_past_due  = max(0, (current logical date - due_date).days)
      months_late    = ceil(days_past_due / 30)
      late_fee_cents = round_half_up(amount_cents * LATE_FEE_PCT * months_late)
      # One multiplication, ONE rounding at the end. Rounding LATE_FEE_PCT * amount first
      # and then multiplying by months_late produces a different cent value.
    input_set: "The single invoice being swept."
    constants:
      LATE_FEE_PCT: 0.015
      DUES_GRACE_START_DAYS: 1
      DUES_DELINQUENT_DAYS: 30
      DUES_WRITE_OFF_DAYS: 120
    precision: "whole cents, round_half_up, once"

  - name: consecutive_occupancy_nights
    trigger: "POST /reservations (before the fork), POST /reservations/{id}/extensions, and OccupancyException GRANT"
    algorithm: interval_merge
    formula: |
      # Long-term occupancy prevention. Stays at the SAME park by the SAME membership
      # are merged into runs; a gap of at most LINK_GAP_NIGHTS nights does NOT break
      # the run, which is what stops a member from parking permanently by re-booking
      # around the limit.
      stays = Reservation rows where membership_id == M and park_id == P
              and status IN {CONFIRMED, CHECKED_IN, EXTENSION_REVIEW, COMPLETED}
              plus the request under evaluation
      sort stays by arrival_date ASC, then created_at ASC
      run = [first stay]
      for each subsequent stay s:
          if s.arrival_date <= run.departure_date + LINK_GAP_NIGHTS days:
              run.departure_date = max(run.departure_date, s.departure_date)   # merge
          else:
              start a new run
      consecutive_run_nights = (run.departure_date - run.arrival_date).days for the run containing the request

      # Gates (validation priorities 12 and 15):
      #   consecutive_run_nights <= tier.max_consecutive_stay_nights, unless a GRANTED
      #   OccupancyException on this reservation covers it; and, exception or not,
      #   consecutive_run_nights <= ABSOLUTE_MAX_RUN_NIGHTS always.
    input_set: "Same membership AND same park only. CANCELLED, EXPIRED, WAITLISTED and PENDING rows never join a run."
    constants:
      LINK_GAP_NIGHTS: 1
      ABSOLUTE_MAX_RUN_NIGHTS: 45
    precision: "integer nights"

  - name: out_and_back_gap
    trigger: "POST /reservations, validation priority 16"
    algorithm: interval_merge
    formula: |
      # Out-and-back requirement, measured NETWORK-WIDE (any park), unlike
      # consecutive_occupancy_nights which is per-park.
      previous = the membership's Reservation with the greatest departure_date among rows with
                 status IN {CONFIRMED, CHECKED_IN, EXTENSION_REVIEW, COMPLETED}
                 and departure_date <= request.arrival_date
                 (tie-break: created_at ASC)
      if previous is null: the rule passes
      gap_nights = (request.arrival_date - previous.departure_date).days
      pass when gap_nights >= tier.min_out_nights_between_stays
      # Boundary: gap_nights == min_out_nights_between_stays passes (>=, not >).
      # The buffer is measured departure-to-arrival, so back-to-back stays give gap 0.
    input_set: "All parks, all classes; WAITLISTED, PENDING, CANCELLED and EXPIRED stays are ignored."
    constants: {}
    precision: "integer nights"

  - name: affiliate_quota_consumption
    trigger: "PENDING -> CONFIRMED, WAITLISTED -> CONFIRMED, extensions, and the compensating credit on cancellation / early check-out, for parks whose affiliate_agreement_id is non-null"
    algorithm: aggregation
    formula: |
      charged = ceil(nights * agreement.reciprocity_ratio)      # ceiling, never round-half-up
      AffiliateAgreement.nights_consumed_ytd += charged
      Reservation.affiliate_nights_charged   = charged
      settlement_owed_cents = nights_consumed_ytd * settlement_rate_cents_per_night

      # Gate (validation priority 45, ERR_AFFILIATE_QUOTA_EXHAUSTED):
      #   nights_consumed_ytd + charged <= annual_member_night_quota   (<=, so landing
      #   exactly on the quota is allowed)
      # Effective advance window for these parks (validation priority 31, ERR_ADVANCE_WINDOW_EXCEEDED):
      #   min(tier.advance_window_days, agreement.advance_window_cap_days)
    input_set: "Reservations at parks under this agreement with status IN {CONFIRMED, CHECKED_IN, EXTENSION_REVIEW, COMPLETED} and arrival_date inside the current calendar year."
    constants: {}
    precision: "integer nights, ceiling"

  - name: survey_weighted_score
    trigger: "POST /reservations/{id}/satisfaction-surveys"
    algorithm: weighted_scoring
    formula: |
      weighted_score = round_half_up(0.40*overall_rating + 0.25*cleanliness_rating
                                     + 0.20*staff_rating + 0.15*value_rating, 2)
    input_set: "The single survey being submitted."
    constants:
      W_OVERALL: 0.40
      W_CLEANLINESS: 0.25
      W_STAFF: 0.20
      W_VALUE: 0.15
    precision: "2 decimal places, round_half_up"

  - name: park_rating_score
    trigger: "POST /reservations/{id}/satisfaction-surveys (variant recency_weighted_lifetime, writes Park.rating_score) and POST /ops/reinvestment-runs plus CapitalProject decisions (variant trailing_window_mean, feeds capital_priority_score)"
    algorithm: decay_function
    formula: |
      age_days(s) = (current logical date - date(s.submitted_at)).days

      # variant recency_weighted_lifetime  -> Park.rating_score
      w(s) = 1.0 if age_days(s) <= RECENT_DAYS
             0.6 if age_days(s) <= MID_DAYS
             0.3 otherwise
      rating_score = round_half_up(sum(w(s) * s.weighted_score) / sum(w(s)), 2)
      if the park has no surveys at all: rating_score = 0.00

      # variant trailing_window_mean      -> input to capital_priority_score
      window = surveys with age_days(s) <= TRAILING_WINDOW_DAYS
      trailing_rating = round_half_up(mean(s.weighted_score for s in window), 2)
      if window is empty: trailing_rating = DEFAULT_TRAILING_RATING
    input_set: "All SatisfactionSurvey rows with park_id == this park. Surveys are immutable, so no status filter is needed; the two variants differ only in the age filter and the weighting."
    constants:
      RECENT_DAYS: 90
      MID_DAYS: 365
      TRAILING_WINDOW_DAYS: 180
      DEFAULT_TRAILING_RATING: 3.00
    precision: "2 decimal places, round_half_up, applied once to the final quotient"
    variants:
      - name: recency_weighted_lifetime
        when: "recomputed on every survey submission and stored on Park.rating_score"
        difference: "keeps every survey forever at decayed weight, so old glowing reviews keep propping the score up"
      - name: trailing_window_mean
        when: "computed on demand inside capital_priority_score"
        difference: "hard-drops anything older than TRAILING_WINDOW_DAYS and weights the survivors equally, so the same survey set yields a different number (e.g. 3.19 lifetime vs 2.10 trailing) and a park can look healthy while its reinvestment score treats it as failing"

  - name: amenity_composite_score
    trigger: "POST /parks/{id}/amenity-inspections"
    algorithm: weighted_scoring
    formula: |
      composite_score = round_half_up(0.35*restroom_score + 0.25*hookup_score
                                      + 0.25*utility_score + 0.15*road_score, 2)
      result = PASS       if composite_score >= AMENITY_PASS_MIN
               PROBATION  if composite_score >= AMENITY_PROBATION_MIN
               FAIL       otherwise
      Park.amenity_compliance_status = COMPLIANT (PASS) | PROBATION (PROBATION) | NON_COMPLIANT (FAIL)
      # Boundaries are inclusive on the lower edge: 4.00 is a PASS, 3.00 is a PROBATION.
      # A PASS never clears a PROBATION caused by forced cancellations in the same
      # calendar year: if Park.forced_cancellation_count >= FORCED_CANCELLATION_PROBATION_THRESHOLD
      # the status floor stays PROBATION even when result == PASS.
    input_set: "The single inspection being filed; only the newest inspection drives Park.amenity_compliance_status."
    constants:
      W_RESTROOM: 0.35
      W_HOOKUP: 0.25
      W_UTILITY: 0.25
      W_ROAD: 0.15
      AMENITY_PASS_MIN: 4.00
      AMENITY_PROBATION_MIN: 3.00
      FORCED_CANCELLATION_PROBATION_THRESHOLD: 2
    precision: "2 decimal places, round_half_up"

  - name: capital_priority_score
    trigger: "POST /capital-projects, POST /capital-projects/{id}/decision, any change to the park's amenity_compliance_status or rating_score, and the start of every POST /ops/reinvestment-runs"
    algorithm: weighted_scoring
    formula: |
      compliance_factor = 1.30 if park.amenity_compliance_status == NON_COMPLIANT
                          1.15 if park.amenity_compliance_status == PROBATION
                          1.00 if park.amenity_compliance_status == COMPLIANT
      category_weight   = CATEGORY_WEIGHTS[project.category]
      satisfaction_gap  = max(0.00, TARGET_RATING - park_rating_score.trailing_window_mean(park))
      usage_intensity   = min(USAGE_CAP,
                              round_half_up(member_nights_ytd(park) / max(1, park.total_sites * USAGE_DENOM_NIGHTS), 4))
      cost_factor       = 1.20 if requested_cost_cents <= COST_BAND_LOW_CENTS
                          1.00 if requested_cost_cents <= COST_BAND_MID_CENTS
                          0.85 otherwise
      raw = category_weight * compliance_factor * (1 + satisfaction_gap) * (1 + usage_intensity) * cost_factor
      priority_score = round_half_up(raw * 1000, 0)      # integer, single rounding at the end

      # member_nights_ytd(park) = sum of Reservation.entitlement_nights_charged over rows
      # at this park with status IN {CHECKED_IN, EXTENSION_REVIEW, COMPLETED} and
      # arrival_date in the current calendar year. CONFIRMED, CANCELLED, WAITLISTED and
      # EXPIRED nights are excluded - a cancelled stay never inflates a park's score.
    input_set: "One CapitalProject plus its park's current amenity_compliance_status, trailing-window rating and year-to-date stayed nights."
    constants:
      CATEGORY_WEIGHTS: { SAFETY: 1.40, UTILITY: 1.20, AMENITY: 1.00, EXPANSION: 0.80 }
      TARGET_RATING: 4.50
      USAGE_CAP: 1.50
      USAGE_DENOM_NIGHTS: 30
      COST_BAND_LOW_CENTS: 5000000
      COST_BAND_MID_CENTS: 20000000
    precision: "usage_intensity to 4 decimals, then the final score to an integer, round_half_up"

  - name: reinvestment_allocation
    trigger: "POST /ops/reinvestment-runs"
    algorithm: waterfall_allocation
    formula: |
      # (a) eligibility filter
      candidates = CapitalProject rows with status IN {APPROVED, DEFERRED}
                   AND fiscal_year == run.fiscal_year
                   AND park.park_status IN {OPEN, SEASONAL_CLOSED, MAINTENANCE_HOLD}
      recompute priority_score for every candidate BEFORE ordering
      # (b) ranking expression   # (c) tie-break
      order candidates by priority_score DESC, then created_at ASC
      # (d) empty-pool fallback
      if candidates is empty: allocated_cents = 0, funded_project_ids = [], no error

      remaining = run.budget_cents
      for project in ordered candidates:
          if project.requested_cost_cents <= remaining:
              project -> FUNDED; project.funded_amount_cents = requested_cost_cents
              remaining -= requested_cost_cents
          else:
              project -> DEFERRED; project.funded_amount_cents = 0
              # NO partial funding and NO early stop: the walk continues, so a cheap
              # low-priority project can be funded after an expensive high-priority
              # project has been skipped.
      allocated_cents   = run.budget_cents - remaining
      unallocated_cents = remaining
      # Conservation invariant: budget_cents == allocated_cents + unallocated_cents
      #                     and allocated_cents == sum(funded_amount_cents this run)
    input_set: "APPROVED and DEFERRED projects of the run's fiscal_year only; PROPOSED, REJECTED and already-FUNDED projects never enter the walk."
    constants: {}
    precision: "whole cents, no rounding (costs are integers)"

  - name: transfer_fee_total
    trigger: "POST /transfer-requests"
    algorithm: tiered_pricing
    formula: |
      type_multiplier   = 1.00 if transfer_type == RESALE
                          0.50 if transfer_type == GIFT
                          0.00 if transfer_type == ESTATE
      resale_surcharge  = round_half_up(sale_price_cents * RESALE_SURCHARGE_PCT) if transfer_type == RESALE else 0
      transfer_fee_cents = round_half_up(tier.transfer_fee_cents * type_multiplier) + resale_surcharge
      # Two independent roundings, then an integer add.
    input_set: "The tier pinned on the membership plus the submitted transfer_type and sale_price_cents."
    constants:
      RESALE_SURCHARGE_PCT: 0.06
      RESALE_HOLD_DAYS: 730
      MAX_TRANSFERS_PER_CHAIN: 2
      REINSTATEMENT_FEE_CENTS: 15000
    precision: "whole cents, round_half_up on each of the two components"

validations:
  - priority: 1
    category: auth
    check: "X-User-Role and X-User-ID headers are both present and X-User-Role is one of Member, ParkManager, ClubAdmin, ComplianceOfficer, TransientGuest"
    error_id: ERR_UNAUTHENTICATED
    http_status: 401
    applies_to: "all except POST /_clock/set_current_utc"
  - priority: 2
    category: auth
    check: "the acting role appears in the target endpoint's roles list"
    error_id: ERR_UNAUTHORIZED
    http_status: 403
    applies_to: "all"
  - priority: 3
    category: auth
    check: "when the acting role is Member, X-User-ID equals the member_id of the Membership that owns the addressed membership, reservation, dues invoice, transfer request or occupancy exception"
    error_id: ERR_NOT_RESOURCE_OWNER
    http_status: 403
    applies_to: "POST /reservations, POST /reservations/{id}/cancellation, POST /reservations/{id}/check-in, POST /reservations/{id}/check-out, POST /reservations/{id}/extensions, POST /reservations/{id}/satisfaction-surveys, POST /dues-invoices/{id}/payments, POST /transfer-requests, GET /memberships/{id}, GET /memberships/{id}/dues-invoices, GET /reservations/{id}"
  - priority: 4
    category: auth
    check: "when the acting role is ParkManager, X-User-ID equals the id of the Park the request targets (directly, or via the addressed maintenance window / inspection / capital project / reservation)"
    error_id: ERR_NOT_PARK_MANAGER
    http_status: 403
    applies_to: "POST /parks/{id}/season-openings, POST /parks/{id}/season-closures, POST /parks/{id}/amenity-inspections, POST /maintenance-windows, POST /maintenance-windows/{id}/activation, POST /maintenance-windows/{id}/completion, POST /capital-projects"
  - priority: 5
    category: existence
    check: "every membership id in the path or body resolves to a Membership row"
    error_id: ERR_MEMBERSHIP_NOT_FOUND
    http_status: 404
    applies_to: "GET /memberships/{id}, GET /memberships/{id}/dues-invoices, POST /memberships/{id}/suspension, POST /memberships/{id}/reinstatement, POST /reservations, POST /transfer-requests"
  - priority: 6
    category: existence
    check: "tier_id resolves to a MembershipTier row"
    error_id: ERR_TIER_NOT_FOUND
    http_status: 404
    applies_to: "GET /membership-tiers/{id}, POST /memberships"
  - priority: 7
    category: existence
    check: "member_id / to_member_id resolves to a Member row"
    error_id: ERR_MEMBER_NOT_FOUND
    http_status: 404
    applies_to: "POST /memberships, POST /transfer-requests"
  - priority: 8
    category: existence
    check: "every park id in the path or body resolves to a Park row"
    error_id: ERR_PARK_NOT_FOUND
    http_status: 404
    applies_to: "GET /parks/{id}, GET /parks/{id}/amenity-inspections, GET /parks/{id}/satisfaction-surveys, GET /parks/{id}/maintenance-windows, GET /parks/{id}/capital-projects, POST /parks/{id}/season-openings, POST /parks/{id}/season-closures, POST /parks/{id}/amenity-inspections, POST /reservations, POST /transient-reservations, POST /maintenance-windows, POST /capital-projects"
  - priority: 9
    category: existence
    check: "every reservation id in the path resolves to a Reservation row"
    error_id: ERR_RESERVATION_NOT_FOUND
    http_status: 404
    applies_to: "GET /reservations/{id}, GET /reservations/{id}/satisfaction-surveys, GET /reservations/{id}/occupancy-exceptions, POST /reservations/{id}/cancellation, POST /reservations/{id}/check-in, POST /reservations/{id}/check-out, POST /reservations/{id}/extensions, POST /reservations/{id}/satisfaction-surveys"
  - priority: 10
    category: existence
    check: "the dues invoice id in the path resolves to a DuesInvoice row"
    error_id: ERR_DUES_INVOICE_NOT_FOUND
    http_status: 404
    applies_to: "POST /dues-invoices/{id}/payments, POST /dues-invoices/{id}/payment-reversals"
  - priority: 11
    category: existence
    check: "the transfer request id in the path resolves to a TransferRequest row"
    error_id: ERR_TRANSFER_REQUEST_NOT_FOUND
    http_status: 404
    applies_to: "GET /transfer-requests/{id}, POST /transfer-requests/{id}/decision"
  - priority: 12
    category: existence
    check: "the maintenance window id in the path resolves to a MaintenanceWindow row"
    error_id: ERR_MAINTENANCE_WINDOW_NOT_FOUND
    http_status: 404
    applies_to: "POST /maintenance-windows/{id}/activation, POST /maintenance-windows/{id}/completion"
  - priority: 13
    category: existence
    check: "the capital project id in the path resolves to a CapitalProject row"
    error_id: ERR_CAPITAL_PROJECT_NOT_FOUND
    http_status: 404
    applies_to: "POST /capital-projects/{id}/decision"
  - priority: 14
    category: existence
    check: "the occupancy exception id in the path resolves to an OccupancyException row"
    error_id: ERR_OCCUPANCY_EXCEPTION_NOT_FOUND
    http_status: 404
    applies_to: "POST /occupancy-exceptions/{id}/decision"
  - priority: 15
    category: existence
    check: "affiliate_agreement_id resolves to an AffiliateAgreement row"
    error_id: ERR_AFFILIATE_AGREEMENT_NOT_FOUND
    http_status: 404
    applies_to: "GET /affiliate-agreements/{id}, POST /parks, POST /affiliate-agreements/{id}/status-changes"
  - priority: 16
    category: existence
    check: "all required body fields are present, enums hold declared values, integer amounts are >= 0, dates are ISO-8601 calendar dates, and departure_date is strictly greater than arrival_date"
    error_id: ERR_INVALID_REQUEST
    http_status: 400
    applies_to: "all POST endpoints"
  - priority: 17
    category: state
    check: "expected_membership_version equals the current Membership.version"
    error_id: ERR_STALE_MEMBERSHIP_VERSION
    http_status: 412
    applies_to: "POST /transfer-requests"
  - priority: 18
    category: state
    check: "expected_park_version equals the current Park.version"
    error_id: ERR_STALE_PARK_VERSION
    http_status: 412
    applies_to: "POST /capital-projects/{id}/decision"
  - priority: 19
    category: state
    check: "the reservation is in a status from which the requested transition is declared in §1.2 (cancellation from PENDING/CONFIRMED/WAITLISTED, check-in from CONFIRMED, check-out from CHECKED_IN, extension from CHECKED_IN, survey from COMPLETED)"
    error_id: ERR_INVALID_RESERVATION_STATE
    http_status: 409
    applies_to: "POST /reservations/{id}/cancellation, POST /reservations/{id}/check-in, POST /reservations/{id}/check-out, POST /reservations/{id}/extensions, POST /reservations/{id}/satisfaction-surveys"
  - priority: 20
    category: state
    check: "the park is in a park_status from which the requested transition is declared (season-opening from SEASONAL_CLOSED, season-closure from OPEN, inspection from OPEN or MAINTENANCE_HOLD); a season-opening additionally requires the current logical date to lie within [season_open_date - SEASON_OPEN_LEAD_DAYS, season_close_date]"
    error_id: ERR_INVALID_PARK_STATE
    http_status: 409
    applies_to: "POST /parks/{id}/season-openings, POST /parks/{id}/season-closures, POST /parks/{id}/amenity-inspections"
  - priority: 21
    category: state
    check: "the maintenance window is SCHEDULED for activation and ACTIVE for completion"
    error_id: ERR_INVALID_MAINTENANCE_STATE
    http_status: 409
    applies_to: "POST /maintenance-windows/{id}/activation, POST /maintenance-windows/{id}/completion"
  - priority: 22
    category: state
    check: "the transfer request is SUBMITTED when a decision is submitted"
    error_id: ERR_INVALID_TRANSFER_STATE
    http_status: 409
    applies_to: "POST /transfer-requests/{id}/decision"
  - priority: 23
    category: state
    check: "the occupancy exception is REQUESTED when a decision is submitted"
    error_id: ERR_EXCEPTION_ALREADY_DECIDED
    http_status: 409
    applies_to: "POST /occupancy-exceptions/{id}/decision"
  - priority: 24
    category: state
    check: "the dues invoice is OPEN or PAST_DUE for a payment, and PAID for a payment reversal"
    error_id: ERR_DUES_INVOICE_NOT_PAYABLE
    http_status: 409
    applies_to: "POST /dues-invoices/{id}/payments, POST /dues-invoices/{id}/payment-reversals"
  - priority: 25
    category: state
    check: "the booking membership's membership_status is ACTIVE (SUSPENDED, TRANSFER_PENDING and TERMINATED memberships cannot book, extend or transfer)"
    error_id: ERR_MEMBERSHIP_NOT_ACTIVE
    http_status: 409
    applies_to: "POST /reservations, POST /reservations/{id}/extensions, POST /transfer-requests"
  - priority: 26
    category: state
    check: "when the target park has an affiliate_agreement_id, that agreement's status is ACTIVE"
    error_id: ERR_AFFILIATE_AGREEMENT_INACTIVE
    http_status: 409
    applies_to: "POST /reservations, POST /transient-reservations"
  - priority: 27
    category: state
    check: "the requested new_status is reachable from the agreement's current status per the AffiliateAgreement state machine (DRAFT -> ACTIVE, ACTIVE <-> SUSPENDED, ACTIVE -> EXPIRED)"
    error_id: ERR_INVALID_AGREEMENT_STATE
    http_status: 409
    applies_to: "POST /affiliate-agreements/{id}/status-changes"
  - priority: 28
    category: business_safety
    check: "the target park's park_status is OPEN (bookings are refused at SEASONAL_CLOSED and MAINTENANCE_HOLD parks)"
    error_id: ERR_PARK_NOT_OPEN
    http_status: 422
    applies_to: "POST /reservations, POST /transient-reservations"
  - priority: 29
    category: business_safety
    check: "no night of the requested or extended stay falls inside the CLOSED-inclusive interval [start_date, end_date] of a SCHEDULED or ACTIVE MaintenanceWindow at that park"
    error_id: ERR_MAINTENANCE_WINDOW_CONFLICT
    http_status: 409
    applies_to: "POST /reservations, POST /transient-reservations, POST /reservations/{id}/extensions"
  - priority: 30
    category: business_safety
    check: "consecutive_occupancy_nights for the merged run containing this stay is <= ABSOLUTE_MAX_RUN_NIGHTS; this cap binds even when a GRANTED OccupancyException exists"
    error_id: ERR_ABSOLUTE_OCCUPANCY_CAP
    http_status: 422
    applies_to: "POST /reservations, POST /reservations/{id}/extensions, POST /occupancy-exceptions/{id}/decision"
  - priority: 31
    category: business_temporal
    check: "days_until_arrival (arrival_date minus the current logical date) is <= min(tier.advance_window_days, agreement.advance_window_cap_days when the park is affiliated)"
    error_id: ERR_ADVANCE_WINDOW_EXCEEDED
    http_status: 422
    applies_to: "POST /reservations"
  - priority: 32
    category: business_temporal
    check: "every night of the stay falls inside the park's [season_open_date, season_close_date] window"
    error_id: ERR_STAY_OUTSIDE_SEASON
    http_status: 422
    applies_to: "POST /reservations, POST /transient-reservations, POST /reservations/{id}/extensions"
  - priority: 33
    category: business_constraint
    check: "consecutive_occupancy_nights for the merged run containing this stay is <= tier.max_consecutive_stay_nights, unless a GRANTED OccupancyException covers the reservation; and, at an affiliated park, the stay's own nights are <= agreement.per_stay_night_cap (an exception never lifts the partner's per-stay cap). On POST /reservations a merged-run overrun refuses the booking; on POST /reservations/{id}/extensions it does NOT refuse — the stay routes CHECKED_IN -> EXTENSION_REVIEW and an OccupancyException is opened instead, so on the extension endpoint only the affiliate per_stay_night_cap half of this rule can raise"
    error_id: ERR_STAY_LENGTH_EXCEEDED
    http_status: 422
    applies_to: "POST /reservations, POST /reservations/{id}/extensions"
  - priority: 34
    category: business_constraint
    check: "out_and_back_gap between the previous stay's departure_date and this arrival_date is >= tier.min_out_nights_between_stays"
    error_id: ERR_OUT_AND_BACK_VIOLATION
    http_status: 422
    applies_to: "POST /reservations"
  - priority: 35
    category: business_constraint
    check: "the requested half-open night set does not intersect the night set of another CONFIRMED, CHECKED_IN or EXTENSION_REVIEW reservation of the same membership at any park"
    error_id: ERR_OVERLAPPING_STAY
    http_status: 409
    applies_to: "POST /reservations, POST /reservations/{id}/extensions"
  - priority: 36
    category: business_referential
    check: "for an affiliated park, the booking tier has affiliate_access_enabled true AND tier.tier_rank >= agreement.min_tier_rank"
    error_id: ERR_AFFILIATE_TIER_INELIGIBLE
    http_status: 422
    applies_to: "POST /reservations"
  - priority: 37
    category: business_referential
    check: "for transfer_type RESALE, the membership's tier has resale_allowed true"
    error_id: ERR_RESALE_NOT_PERMITTED
    http_status: 422
    applies_to: "POST /transfer-requests"
  - priority: 38
    category: business_temporal
    check: "for transfer_type RESALE, at least RESALE_HOLD_DAYS have elapsed between Membership.purchased_at and the current logical date"
    error_id: ERR_RESALE_HOLD_ACTIVE
    http_status: 422
    applies_to: "POST /transfer-requests"
  - priority: 39
    category: business_constraint
    check: "Membership.transfer_count is < MAX_TRANSFERS_PER_CHAIN"
    error_id: ERR_TRANSFER_LIMIT_REACHED
    http_status: 422
    applies_to: "POST /transfer-requests"
  - priority: 40
    category: business_constraint
    check: "the membership has no reservation in status PENDING, CONFIRMED, WAITLISTED, CHECKED_IN or EXTENSION_REVIEW"
    error_id: ERR_TRANSFER_BLOCKED_OPEN_RESERVATIONS
    http_status: 409
    applies_to: "POST /transfer-requests"
  - priority: 41
    category: auth
    check: "the X-User-ID deciding a capital project differs from the X-User-ID that created it, and the X-User-ID deciding a transfer request differs from the X-User-ID that submitted it"
    error_id: ERR_SEGREGATION_OF_DUTIES
    http_status: 403
    applies_to: "POST /capital-projects/{id}/decision, POST /transfer-requests/{id}/decision"
  - priority: 42
    category: business_fiscal
    check: "a booking or extension requires dues_status IN {CURRENT, GRACE} (DELINQUENT and WRITTEN_OFF memberships cannot book), while a transfer submission or transfer decision is stricter and requires dues_status == CURRENT, matching the ACTIVE -> TRANSFER_PENDING and TRANSFER_PENDING -> TERMINATED preconditions in §1.2"
    error_id: ERR_DUES_NOT_CURRENT
    http_status: 409
    applies_to: "POST /reservations, POST /reservations/{id}/extensions, POST /transfer-requests, POST /transfer-requests/{id}/decision"
  - priority: 43
    category: business_fiscal
    check: "a membership whose dues_status is GRACE may not book or extend at a CLASS_A park"
    error_id: ERR_CLASS_A_RESTRICTED_IN_GRACE
    http_status: 422
    applies_to: "POST /reservations, POST /reservations/{id}/extensions"
  - priority: 44
    category: business_fiscal
    check: "nights_used_<park_class> + requested nights <= tier.entitlement_nights_<park_class> AND annual_nights_used + requested nights <= tier.annual_total_night_cap"
    error_id: ERR_ENTITLEMENT_NIGHTS_EXHAUSTED
    http_status: 422
    applies_to: "POST /reservations, POST /reservations/{id}/extensions, POST /occupancy-exceptions/{id}/decision"
  - priority: 45
    category: business_fiscal
    check: "agreement.nights_consumed_ytd + affiliate_quota_consumption(requested nights) <= agreement.annual_member_night_quota"
    error_id: ERR_AFFILIATE_QUOTA_EXHAUSTED
    http_status: 422
    applies_to: "POST /reservations, POST /reservations/{id}/extensions"
  - priority: 46
    category: business_fiscal
    check: "the transient pool has a free site on every requested night; the public never borrows from the member pool and is never waitlisted"
    error_id: ERR_NO_TRANSIENT_CAPACITY
    http_status: 409
    applies_to: "POST /transient-reservations"
  - priority: 47
    category: business_fiscal
    check: "the payment amount_cents equals DuesInvoice.amount_cents + DuesInvoice.late_fee_cents - DuesInvoice.paid_amount_cents (no partial and no over-payment)"
    error_id: ERR_PAYMENT_AMOUNT_MISMATCH
    http_status: 422
    applies_to: "POST /dues-invoices/{id}/payments"
  - priority: 48
    category: business_fiscal
    check: "reinstatement requires Membership.dues_balance_cents == 0 and a reinstatement_fee_paid_cents equal to REINSTATEMENT_FEE_CENTS"
    error_id: ERR_REINSTATEMENT_FEE_REQUIRED
    http_status: 422
    applies_to: "POST /memberships/{id}/reinstatement"

endpoints:
  - method: POST
    path: "/membership-tiers"
    description: "Create a membership tier — the purchase price, annual dues basis, per-class night entitlements and the reservation-rule parameters every membership on the tier inherits"
    roles: [ClubAdmin]
    code: 201
    input: [code, name, tier_rank, upfront_cost_cents, annual_dues_cents, entitlement_nights_class_a, entitlement_nights_class_b, entitlement_nights_class_c, annual_total_night_cap, advance_window_days, max_consecutive_stay_nights, min_out_nights_between_stays, affiliate_access_enabled, resale_allowed, transfer_fee_cents]
    output: MembershipTier
    side_effects: []
  - method: GET
    path: "/membership-tiers/{id}"
    description: "Read one membership tier"
    roles: [ClubAdmin, Member, ParkManager, ComplianceOfficer]
    code: 200
    input: []
    output: MembershipTier
    side_effects: []
  - method: GET
    path: "/membership-tiers"
    description: "List membership tiers"
    roles: [ClubAdmin, Member, ParkManager, ComplianceOfficer]
    code: 200
    input: ["code?", "limit?", "offset?"]
    output: MembershipTier[]
    side_effects: []
  - method: POST
    path: "/members"
    description: "Register a natural person who may hold or receive a membership"
    roles: [ClubAdmin]
    code: 201
    input: [full_name, email, "home_region?"]
    output: Member
    side_effects: []
  - method: GET
    path: "/members/{id}"
    description: "Read one member record"
    roles: [ClubAdmin, Member]
    code: 200
    input: []
    output: Member
    side_effects: []
  - method: POST
    path: "/memberships"
    description: "Sell a membership: pins the tier, collects the upfront cost, opens the entitlement year and issues the first annual dues invoice"
    roles: [ClubAdmin]
    code: 201
    input: [member_id, tier_id, upfront_paid_cents]
    output: Membership
    side_effects: ["membership_status = ACTIVE, dues_status = CURRENT", "purchased_at and tenure_origin_at set to the current logical clock instant", "entitlement_year_start set to the current logical date; nights_used_class_a/b/c and annual_nights_used set to 0", "resale_eligible_at set to purchased_at + RESALE_HOLD_DAYS", "creates one DuesInvoice for the current cycle_year via dues_invoice_total, status OPEN, due_date = current logical date + DUES_NET_DAYS", "recomputes dues_balance_cents"]
  - method: GET
    path: "/memberships/{id}"
    description: "Read one membership including its entitlement counters, dues balance and both state axes"
    roles: [ClubAdmin, Member]
    code: 200
    input: []
    output: Membership
    side_effects: []
  - method: GET
    path: "/memberships"
    description: "List memberships filtered by holder, tier, transfer lineage or either state axis"
    roles: [ClubAdmin]
    code: 200
    input: ["member_id?", "tier_id?", "transferred_from_membership_id?", "membership_status?", "dues_status?", "limit?", "offset?"]
    output: Membership[]
    side_effects: []
  - method: GET
    path: "/memberships/{id}/dues-invoices"
    description: "List the dues invoices billed to one membership"
    roles: [ClubAdmin, Member]
    code: 200
    input: ["status?", "cycle_year?"]
    output: DuesInvoice[]
    side_effects: []
  - method: GET
    path: "/memberships/{id}/satisfaction-surveys"
    description: "List the satisfaction surveys this membership has submitted"
    roles: [ClubAdmin, Member]
    code: 200
    input: []
