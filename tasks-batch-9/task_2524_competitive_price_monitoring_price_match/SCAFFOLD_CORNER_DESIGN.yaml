        grounds: [validations.priority_61_ERR_CATEGORY_EXCLUDED, validations.priority_80_ERR_CLAIM_NO_SAVINGS]
        distinguishing_aspect: "One claim violates two rules 19 priority steps apart and must report the lower number: with APPLIANCE excluded and zero savings the answer is ERR_CATEGORY_EXCLUDED, and the very same claim body against a policy without the exclusion reports ERR_CLAIM_NO_SAVINGS."
        test_recipe:
          setup:
            - "Logical clock at 2026-08-01T00:00:00Z; store STORE-101; ACTIVE PRIMARY eligible competitor C-A."
            - "Product SKU-PO-1 own 10000, cost 8000, margin 0.20 -> effective_floor 10000, so a 9500 claim yields discount 0."
            - "Policy STRICT excludes category APPLIANCE; policy OPEN excludes nothing; both ACTIVE in the same market with identical numeric limits."
          setup_api_calls:
            - call: "POST /pricing/_clock/set_current_utc"
              payload: { current_utc: "2026-08-01T00:00:00Z" }
              as: PlatformAdmin
            - call: "POST /pricing/markets"
              payload: { market_code: "US-WEST", name: "US West", strategic_positioning: "AT_PARITY", strategic_index_target_bp: 9800 }
              as: PlatformAdmin
              captures: { m_id: $.data.id }
            - call: "POST /pricing/products"
              payload: { market_id: "${m_id}", sku: "SKU-PO-1", category_code: "APPLIANCE", brand: "Vitala", own_price_cents: 10000, unit_cost_cents: 8000, margin_floor_pct: 0.20 }
              as: PlatformAdmin
              captures: { p_id: $.data.id }
            - call: "POST /pricing/stores"
              payload: { market_id: "${m_id}", store_code: "STORE-101", override_authority_cents: 5000, label_printer_capacity_per_day: 5 }
              as: PlatformAdmin
              captures: { s_id: $.data.id }
            - call: "POST /pricing/competitors"
              payload: { market_id: "${m_id}", competitor_code: "C-A", name: "Alpha Mart", collection_method: "ONLINE", tier: "PRIMARY", price_match_eligible: true }
              as: PlatformAdmin
              captures: { c1_id: $.data.id }
            - call: "POST /pricing/match-policies"
              payload: { market_id: "${m_id}", eligible_competitor_tiers: ["PRIMARY"], excluded_category_codes: ["APPLIANCE"], daily_override_budget_cents: 100000, max_match_discount_pct: 0.30 }
              as: PricingManager
              as_user_id: "manager-9"
              captures: { pol_strict: $.data.id }
            - call: "POST /pricing/match-policies"
              payload: { market_id: "${m_id}", eligible_competitor_tiers: ["PRIMARY"], excluded_category_codes: [], daily_override_budget_cents: 100000, max_match_discount_pct: 0.30 }
              as: PricingManager
              as_user_id: "manager-9"
              captures: { pol_open: $.data.id }
          trigger:
            - call: "POST /pricing/claims"
              payload: { policy_id: "${pol_strict}", product_id: "${p_id}", competitor_id: "${c1_id}", store_id: "${s_id}", claimed_price_cents: 9500, claimed_observed_at: "2026-07-31T18:00:00Z", competitor_evidence_ref: "receipt-strict" }
              as: StoreAssociate
              as_user_id: "${s_id}"
              captures: { err_high: $.data.error_id }
            - call: "POST /pricing/claims"
              payload: { policy_id: "${pol_open}", product_id: "${p_id}", competitor_id: "${c1_id}", store_id: "${s_id}", claimed_price_cents: 9500, claimed_observed_at: "2026-07-31T18:00:00Z", competitor_evidence_ref: "receipt-open" }
              as: StoreAssociate
              as_user_id: "${s_id}"
              captures: { err_low: $.data.error_id }
          assert:
            - "First trigger: HTTP 422 with error_id == ERR_CATEGORY_EXCLUDED, not ERR_CLAIM_NO_SAVINGS, although both conditions hold"
            - "Second trigger: HTTP 422 with error_id == ERR_CLAIM_NO_SAVINGS once the exclusion is out of the way"
            - "GET /pricing/claims?store_id=${s_id} returns total_count == 0"

      - name: corner_map_floor_outranks_match_discount_cap
        claim_type: priority_conflict
        grounds: [validations.priority_50_ERR_MAP_FLOOR_VIOLATION, validations.priority_82_ERR_MATCH_DISCOUNT_CAP_EXCEEDED]
        distinguishing_aspect: "A claim that is both below the MAP floor and past the discount cap must report the MAP violation at priority 50, not the fiscal cap at 82."
        excluded_because:
          difficulty_instance: priority_pair_validation_conflict / map_floor_outranks_match_discount_cap_on_claim_creation
          rationale: "The §1.8 priority_pair_validation_conflict instance already stages one claim violating both rules and a control claim that violates only the cap, so a separate corner recipe would repeat the same assertions."

      - name: corner_invalid_state_outranks_confidence_threshold
        claim_type: priority_conflict
        grounds: [validations.priority_40_ERR_INVALID_STATE, validations.priority_69_ERR_CONFIDENCE_BELOW_CONFIRM_THRESHOLD]
        distinguishing_aspect: "Confirming an already-CONFIRMED link whose confidence is below the threshold must report the state error at 40 rather than the confidence error at 69."
        excluded_because:
          difficulty_instance: priority_pair_validation_conflict / invalid_state_outranks_confidence_threshold_on_match_confirm
          rationale: "The §1.8 priority_pair_validation_conflict instance already drives both violations on one link plus the single-violation control, covering violation-to-error and ordering for both rules."

      - name: corner_override_budget_is_an_aggregate_across_claims
        claim_type: aggregate_validation
        grounds: [validations.priority_86_ERR_OVERRIDE_BUDGET_EXCEEDED, calculations.store_override_budget_ledger]
        distinguishing_aspect: "Each honored claim is individually inside the store's daily budget while their sum is not, and the boundary is inclusive: reaching the budget exactly is allowed and one cent beyond is refused."
        excluded_because:
          difficulty_instance: boundary_precision_check / override_budget_exact_equality_allowed_then_one_cent_over_refused
          rationale: "The §1.8 boundary_precision_check instance already honors claims up to exact budget equality and then refuses the one-cent-over claim on the same store and UTC day."

      - name: corner_effective_window_overlap_is_half_open
        claim_type: temporal_validation
        grounds: [validations.priority_74_ERR_EFFECTIVE_WINDOW_OVERLAP, entities.PriceChangeOrder.fields.effective_from]
        distinguishing_aspect: "Two orders on one product may touch at the boundary but not overlap, so adjacency with gap zero is accepted while a one-second intrusion is refused."
        excluded_because:
          difficulty_instance: resource_temporal_overlap / order_effective_window_half_open_adjacency_allowed_overlap_refused
          rationale: "The §1.8 resource_temporal_overlap instance already exercises the adjacent-accepted and overlapping-refused pair against the same live order."

      - name: corner_print_window_and_daily_capacity_are_both_temporal
        claim_type: aggregate_validation
        grounds: [validations.priority_76_ERR_PRINT_WINDOW_CONFLICT, validations.priority_77_ERR_PRINT_CAPACITY_EXCEEDED, calculations.store_label_slot_ledger]
        distinguishing_aspect: "Label batches contend on two axes at once — a buffered print window per printer and a per-store daily slot count — and each must be able to reject a batch the other would allow."
        excluded_because:
          difficulty_instance: resource_temporal_overlap / label_batch_buffered_window_and_daily_slot_capacity
          rationale: "The §1.8 resource_temporal_overlap instance already stages a buffer-zone conflict and a capacity exhaustion on the same store and day, including the accepted batch just outside the buffer."

      - name: corner_execute_blocked_by_market_posture
        claim_type: cross_entity_validation
        grounds: [validations.priority_45_ERR_MARKET_POSTURE_BLOCKED, calculations.market_posture_evaluation]
        distinguishing_aspect: "Execution validity depends on a field of a different entity — the market's derived posture — so the identical order both fails and succeeds depending only on the governing index report."
        excluded_because:
          difficulty_instance: cross_entity_state_dependency / order_execute_requires_market_posture_open
          rationale: "The §1.8 cross_entity_state_dependency instance already publishes a RESTRICTED-posture report, shows the execute rejection, then republishes an OPEN posture and shows the same execute succeeding."

      - name: corner_insufficient_index_data_blocks_publish
        claim_type: violation_to_error
        grounds: [validations.priority_70_ERR_INSUFFICIENT_INDEX_DATA, calculations.price_index]
        distinguishing_aspect: "A report with zero matched products cannot be published, because an index computed over an empty basket would silently read as parity."
        excluded_because:
          difficulty_instance: boundary_precision_check / zero_matched_products_makes_index_insufficient_and_blocks_publish
          rationale: "The §1.8 boundary_precision_check instance already computes the empty-basket report, asserts the null index and the publish rejection, then adds one matched product and publishes."

      - name: corner_competitor_eligibility_rechecked_at_decide
        claim_type: cross_entity_validation
        grounds: [validations.priority_60_ERR_COMPETITOR_NOT_ELIGIBLE, entities.Competitor.fields.price_match_eligible]
        distinguishing_aspect: "Eligibility is re-evaluated at decide time, not frozen at claim creation, so retiring or de-flagging the competitor after a valid claim was filed blocks the verification."
        excluded_because:
          difficulty_instance: cross_entity_state_dependency / claim_verified_requires_active_eligible_competitor
          rationale: "The §1.8 cross_entity_state_dependency instance already files a valid claim, retires the competitor, shows the decide rejection, and reinstates it to show the decide succeeding."

  - section: endpoints
    instances:
      - name: corner_suspend_competitor_endpoint_runs_its_whole_side_effect_list
        claim_type: action_endpoint
        grounds: ["endpoints.PATCH_/pricing/competitors/{id}/status.side_effects", state_machines.Competitor.ACTIVE_to_SUSPENDED]
        distinguishing_aspect: "Suspension is reversible where retirement is not: the CONFIRMED link lands in UNDER_REVIEW (not REJECTED), its ACTIVE observation is VOIDED, and the link's derived price fields are cleared — three separate writes from one PATCH."
        test_recipe:
          setup:
            - "Logical clock at 2026-08-01T00:00:00Z."
            - "Product SKU-SUS-1 own 20000, cost 8000; ACTIVE PRIMARY competitor C-A."
            - "Link L is CONFIRMED at IDENTIFIER 95/95/95 (confidence 10000, EXACT) with one ACTIVE in-stock observation at 19000, so data_status is SUFFICIENT and gap_bp 10526."
          setup_api_calls:
            - call: "POST /pricing/_clock/set_current_utc"
              payload: { current_utc: "2026-08-01T00:00:00Z" }
              as: PlatformAdmin
            - call: "POST /pricing/markets"
              payload: { market_code: "US-WEST", name: "US West", strategic_positioning: "AT_PARITY", strategic_index_target_bp: 9800 }
              as: PlatformAdmin
              captures: { m_id: $.data.id }
            - call: "POST /pricing/products"
              payload: { market_id: "${m_id}", sku: "SKU-SUS-1", category_code: "APPLIANCE", brand: "Vitala", own_price_cents: 20000, unit_cost_cents: 8000 }
              as: PlatformAdmin
              captures: { p_id: $.data.id }
            - call: "POST /pricing/competitors"
              payload: { market_id: "${m_id}", competitor_code: "C-A", name: "Alpha Mart", collection_method: "ONLINE", tier: "PRIMARY" }
              as: PlatformAdmin
              captures: { c1_id: $.data.id }
            - call: "POST /pricing/matches"
              payload: { product_id: "${p_id}", competitor_id: "${c1_id}", match_method: "IDENTIFIER", identifier_score: 95, attribute_score: 95, image_score: 95, competitor_identifier: "00712345678905" }
              as: PricingAnalyst
              captures: { l_id: $.data.id }
            - call: "POST /pricing/matches/${l_id}/review"
              payload: { decision: "CONFIRM" }
              as: PricingManager
              as_user_id: "manager-9"
            - call: "POST /pricing/observations"
              payload: { link_id: "${l_id}", observed_price_cents: 19000, collection_method: "ONLINE", observed_at: "2026-07-31T18:00:00Z", in_stock: true }
              as: DataCollector
              captures: { o_id: $.data.id }
          trigger:
            - call: "PATCH /pricing/competitors/${c1_id}/status"
              payload: { to_status: "SUSPENDED", reason: "feed integrity review" }
              as: ComplianceOfficer
              captures: { c_status: $.data.status }
          assert:
            - "HTTP 200 with Competitor.${c1_id}.status == SUSPENDED"
            - "CompetitorProductLink.${l_id}.status == UNDER_REVIEW, not REJECTED"
            - "PriceObservation.${o_id}.status == VOIDED"
            - "CompetitorProductLink.${l_id}.data_status == INSUFFICIENT with latest_effective_price_cents == null, selected_observation_id == null and gap_bp == null"
            - "CompetitorProductLink.${l_id}.confidence_bp is still 10000 and match_grade still EXACT — suspension touches state and data, not scoring"

      - name: corner_void_endpoint_reselects_then_empties_the_benchmark
        claim_type: action_endpoint
        grounds: ["endpoints.POST_/pricing/observations/{id}/void.side_effects", calculations.effective_competitor_price]
        distinguishing_aspect: "Voiding is not simply destructive: with two qualifying observations the selector falls back to the survivor and recomputes gap_bp, and only the second void empties the benchmark and drops the link to INSUFFICIENT."
        test_recipe:
          setup:
            - "Logical clock at 2026-08-01T00:00:00Z."
            - "Product SKU-VOID-1 own 20000, cost 8000; CONFIRMED link L to ACTIVE PRIMARY C-A."
            - "Two ACTIVE in-stock ONLINE observations two hours apart: 19000 at 2026-07-31T16:00:00Z and 20000 at 2026-07-31T18:00:00Z, so the 60-minute proximity rule is satisfied and the cheaper one is selected."
          setup_api_calls:
            - call: "POST /pricing/_clock/set_current_utc"
              payload: { current_utc: "2026-08-01T00:00:00Z" }
              as: PlatformAdmin
            - call: "POST /pricing/markets"
              payload: { market_code: "US-WEST", name: "US West", strategic_positioning: "AT_PARITY", strategic_index_target_bp: 9800 }
              as: PlatformAdmin
              captures: { m_id: $.data.id }
            - call: "POST /pricing/products"
              payload: { market_id: "${m_id}", sku: "SKU-VOID-1", category_code: "APPLIANCE", brand: "Vitala", own_price_cents: 20000, unit_cost_cents: 8000 }
              as: PlatformAdmin
              captures: { p_id: $.data.id }
            - call: "POST /pricing/competitors"
              payload: { market_id: "${m_id}", competitor_code: "C-A", name: "Alpha Mart", collection_method: "ONLINE", tier: "PRIMARY" }
              as: PlatformAdmin
              captures: { c1_id: $.data.id }
            - call: "POST /pricing/matches"
              payload: { product_id: "${p_id}", competitor_id: "${c1_id}", match_method: "IDENTIFIER", identifier_score: 95, attribute_score: 95, image_score: 95, competitor_identifier: "00712345678905" }
              as: PricingAnalyst
              captures: { l_id: $.data.id }
            - call: "POST /pricing/matches/${l_id}/review"
              payload: { decision: "CONFIRM" }
              as: PricingManager
              as_user_id: "manager-9"
            - call: "POST /pricing/observations"
              payload: { link_id: "${l_id}", observed_price_cents: 19000, collection_method: "ONLINE", observed_at: "2026-07-31T16:00:00Z", in_stock: true }
              as: DataCollector
              captures: { o_cheap: $.data.id }
            - call: "POST /pricing/observations"
              payload: { link_id: "${l_id}", observed_price_cents: 20000, collection_method: "ONLINE", observed_at: "2026-07-31T18:00:00Z", in_stock: true }
              as: DataCollector
              captures: { o_dear: $.data.id }
          trigger:
            - call: "POST /pricing/observations/${o_cheap}/void"
              payload: { void_reason: "collection error" }
              as: DataCollector
              captures: { v1: $.data.status }
            - call: "POST /pricing/observations/${o_dear}/void"
              payload: { void_reason: "collection error" }
              as: PricingAnalyst
              captures: { v2: $.data.status }
          assert:
            - "Before the trigger: CompetitorProductLink.${l_id}.selected_observation_id == ${o_cheap}, latest_effective_price_cents == 19000, gap_bp == 10526, data_status == SUFFICIENT"
            - "After the first void: HTTP 200 with PriceObservation.${o_cheap}.status == VOIDED and the link now reads selected_observation_id == ${o_dear}, latest_effective_price_cents == 20000, gap_bp == 10000, data_status == SUFFICIENT"
            - "After the second void: PriceObservation.${o_dear}.status == VOIDED and the link reads latest_effective_price_cents == null, selected_observation_id == null, gap_bp == null, gap_stale == false, data_status == INSUFFICIENT"
            - "CompetitorProductLink.${l_id}.status is still CONFIRMED throughout — losing data does not un-confirm a match"
            - "Competitor.${c1_id}.confirmed_match_count is still 1"

