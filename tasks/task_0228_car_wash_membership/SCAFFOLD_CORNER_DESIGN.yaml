      - name: freeze_window_end_before_start_invalid_window
        claim_type: Temporal validation
        grounds: ["validations[priority=14]", "errors[ERR_INVALID_WINDOW]"]
        distinguishing_aspect: "POST /memberships/{id}/freeze-scheduled with end_utc <= start_utc -> ERR_INVALID_WINDOW (422), checked before the overlap rule."
