  # Rule 6 — Boundary precision checks (distinct metrics, distinct endpoints)
  # =====================================================================
  - rule_id: boundary_precision_check
    instances:
      - name: sa_tally_yes_share_bp_6666_rejects_6667_approves_and_floor_beats_round_half_up
        grounds:
          - calculations.special_assessment_tally
          - endpoints[POST /special-assessments/{id}/close-ballot]
          - state_machines.SpecialAssessment.BALLOTING_to_APPROVED
          - state_machines.SpecialAssessment.BALLOTING_to_FAILED
          - entities.Association.fields.special_assessment_approval_bp
        distinguishing_aspect: |
          METRIC: yes_share_bp = floor(yes_weight_bp * 10000 / eligible_weight_bp) in basis
          points, tested against special_assessment_approval_bp 6667 with an INCLUSIVE >=.
          ENDPOINT: POST /special-assessments/{id}/close-ballot. Three ballots on one roster of
          3333 / 3333 / 3333 / 1 bp pin the boundary to a single basis point: 6666 FAILS,
          6667 APPROVES, and a third ballot whose denominator is the eligible weight 6667 (not
          the total 10000) yields exactly 9998 by floor where round_half_up would give 9999. The failing terminal state is approval_status FAILED (not REJECTED, which belongs to Budget).
        test_recipe:
          setup:
            - "Association with default special_assessment_approval_bp 6667, lien_threshold_cents 180000, reserve_designated_cents 0."
            - "One seated director (no unit needed; close-ballot is a board act) and four owners each holding one unit."
            - "Units: A 3333 bp, B 3333 bp, C 3333 bp, D 1 bp (a storage unit). Sum == 10000 exactly."
            - "Ballot 1 (sa_a, 800000): YES from A and B, NO from C, ABSTAIN from D -> yes_weight_bp 6666, eligible_weight_bp 10000."
            - "Ballot 2 (sa_b, 1000000): YES from A, B and the 1 bp unit D, NO from C -> yes_weight_bp 6667, eligible_weight_bp 10000."
            - "Ballot 3 (sa_c, 1200000): unit C is pushed into LIEN_FILED first so voting_eligible is false, dropping eligible_weight_bp to 6667; YES from A and B only."
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { current_utc: "2026-08-01T00:00:00Z" }
              as: CommunityManager
            - call: "POST /associations"
