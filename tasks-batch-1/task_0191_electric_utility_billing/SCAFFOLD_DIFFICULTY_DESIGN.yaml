          - entities.Account.fields.financial_status
        distinguishing_aspect: |
          Numeric threshold crossing on a date metric reached via POST /_clock/set_current_utc: at
          exactly 45 days past due (>= ARREARS_DAYS) financial_status == IN_ARREARS; at 44 days it is
          DELINQUENT. Distinct metric/endpoint from the empty-set boundary below.
        test_recipe:
