              as: IntakeCoordinator
              captures: { qt_id: $.data.id }
            - call: "POST /home-oxygen/cmns"
              payload: { patient_id: "${p_id}", qualifying_test_id: "${qt_id}", form_type: "INITIAL", prescribed_lpm: 1.0, hours_per_day: 24, portable_prescribed: false, length_of_need_months: 99, narrative_element_count: 3, expected_patient_version: "${p_ver}" }
              as: IntakeCoordinator
              captures: { cmn_id: $.data.id }
            - call: "POST /home-oxygen/cmns/${cmn_id}/submit"
              payload: {}
              as: IntakeCoordinator
              as_user_id: "u-intake-1"
            - call: "POST /home-oxygen/cmns/${cmn_id}/sign"
              payload: {}
              as: Physician
              as_user_id: "u-phys-1"
            - call: "POST /home-oxygen/cmns/${cmn_id}/approve"
              payload: {}
              as: ComplianceAuditor
              as_user_id: "u-audit-1"
            - call: "POST /home-oxygen/rental-contracts"
              payload: { patient_id: "${p_id}", cmn_id: "${cmn_id}", pricing_basis: "COMPETITIVE_BID_SINGLE_PAYMENT", cap_month_limit: 36 }
              as: BillingSpecialist
              captures: { c_id: $.data.id, c_ver: $.data.version }
          trigger:
            - call: "POST /home-oxygen/rental-contracts/${c_id}/travel-authorizations"
              payload: { destination_altitude_feet: 500, depart_utc: "2026-08-10T00:00:00Z", return_utc: "2026-08-11T16:00:00Z", expected_contract_version: "${c_ver}" }
              as: IntakeCoordinator
              captures: { ta_short: $.data.id }
            - call: "GET /home-oxygen/rental-contracts/${c_id}"
              payload: {}
              as: BillingSpecialist
              captures: { c_ver2: $.data.version }
            - call: "POST /home-oxygen/rental-contracts/${c_id}/travel-authorizations"
              payload: { destination_altitude_feet: 500, depart_utc: "2026-08-20T00:00:00Z", return_utc: "2026-08-22T00:00:00Z", expected_contract_version: "${c_ver2}" }
              as: IntakeCoordinator
              captures: { ta_long: $.data.id }
          assert:
            - "TravelAuthorization.${ta_short}: trip_hours == 40, altitude_factor == 1.00, effective_lpm == 1.00, base_liters == 2400, reserve_liters == 840, required_liters == 3240, cylinders_raw == 5, handling_surcharge_cylinders == 0, supply_cylinders_authorized == 5"
            - "TravelAuthorization.${ta_long}: trip_hours == 48, altitude_factor == 1.00, effective_lpm == 1.00, base_liters == 2880, reserve_liters == 1008, required_liters == 3888, cylinders_raw == 6, handling_surcharge_cylinders == 1, supply_cylinders_authorized == 7"
            - "The 8-hour difference in trip length moves the authorized count by 2 cylinders (5 -> 7), because crossing cylinders_raw 6 also switches the surcharge on"
            - "supply_cylinders_authorized for ${ta_long} is exactly cylinders_raw + handling_surcharge_cylinders == 6 + 1 == 7; it is NOT re-evaluated against the total (which would give 8 or more)"
            - "Both authorizations have status REQUESTED; RentalContract.${c_id}.version increased by exactly 1 per created authorization"
            - "The 40-hour trip uses RESERVE_PCT_TIER_2 (0.35) because 24 < 40 <= 72, so the reserve is floor(2400 * 0.35) == 840, not floor(2400 * 0.20) == 480"

  # ===========================================================================
  - rule_id: non_linear_state_machine
    instances:

      - name: cmn_revision_cycle_returns_to_draft_and_caps_at_three_rounds
        grounds:
          - state_machines.CertificateOfMedicalNecessity.DRAFT_to_SUBMITTED
          - state_machines.CertificateOfMedicalNecessity.SUBMITTED_to_RETURNED_FOR_CORRECTION
          - state_machines.CertificateOfMedicalNecessity.RETURNED_FOR_CORRECTION_to_DRAFT
          - state_machines.CertificateOfMedicalNecessity.PHYSICIAN_SIGNED_to_RETURNED_FOR_CORRECTION
          - validations[priority=32]
          - errors[ERR_REVISION_LIMIT_REACHED]
          - entities.CertificateOfMedicalNecessity.fields.revision_round
        distinguishing_aspect: |
          This instance exercises the CertificateOfMedicalNecessity cycle DRAFT -> SUBMITTED ->
          RETURNED_FOR_CORRECTION -> DRAFT, which is non-linear because the certificate re-enters a
          state it already left, and it terminates only when revision_round reaches 3 — the fourth
          return attempt is rejected even though the certificate is legally SUBMITTED.
        test_recipe:
          setup:
            - "One branch and one ACTIVE patient (ACTIVE_AMBULATORY)."
            - "One GROUP_I study (SpO2 87%, tested 2026-07-25) and one DRAFT certificate prescribing 3.0 LPM, 24 h/day, portable indicated, lifetime need, three narrative elements (documentation_score 100.00, revision_round 0)."
          setup_api_calls:
            - call: "POST /home-oxygen/branches"
              payload: { name: "Tampa Bay", state_code: "FL", competitive_bid_area: true, liquid_oxygen_certified: false, refill_capacity_per_day: 4, tank_exchange_buffer_minutes: 30 }
              as: BranchManager
              captures: { br_id: $.data.id }
            - call: "POST /home-oxygen/patients"
              payload: { mrn: "MRN-0040", full_name: "Fern Adeyemi", branch_id: "${br_id}", payer_type: "MEDICARE_COMPETITIVE_BID", mobility_profile: "ACTIVE_AMBULATORY", altitude_feet: 500 }
              as: IntakeCoordinator
              captures: { p_id: $.data.id, p_ver: $.data.version }
            - call: "POST /home-oxygen/qualifying-tests"
              payload: { patient_id: "${p_id}", test_type: "RESTING_ROOM_AIR", spo2_percent: 87, tested_at: "2026-07-25T14:00:00Z", ordering_physician_npi: "1234567893" }
              as: IntakeCoordinator
              captures: { qt_id: $.data.id }
            - call: "POST /home-oxygen/cmns"
              payload: { patient_id: "${p_id}", qualifying_test_id: "${qt_id}", form_type: "INITIAL", prescribed_lpm: 3.0, hours_per_day: 24, portable_prescribed: true, length_of_need_months: 99, narrative_element_count: 3, expected_patient_version: "${p_ver}" }
              as: IntakeCoordinator
              captures: { cmn_id: $.data.id }
          trigger:
            - call: "POST /home-oxygen/cmns/${cmn_id}/submit"
              payload: {}
              as: IntakeCoordinator
              as_user_id: "u-intake-1"
            - call: "POST /home-oxygen/cmns/${cmn_id}/return-for-correction"
              payload: { correction_notes: "Round 1: liter flow not documented against the study." }
              as: ComplianceAuditor
              as_user_id: "u-audit-1"
            - call: "PATCH /home-oxygen/cmns/${cmn_id}"
              payload: { narrative_element_count: 2 }
              as: IntakeCoordinator
              as_user_id: "u-intake-1"
            - call: "POST /home-oxygen/cmns/${cmn_id}/submit"
              payload: {}
              as: IntakeCoordinator
              as_user_id: "u-intake-1"
            - call: "POST /home-oxygen/cmns/${cmn_id}/sign"
              payload: {}
              as: Physician
              as_user_id: "u-phys-1"
            - call: "POST /home-oxygen/cmns/${cmn_id}/return-for-correction"
              payload: { correction_notes: "Round 2: narrative regressed; signature discarded." }
              as: ComplianceAuditor
              as_user_id: "u-audit-1"
            - call: "PATCH /home-oxygen/cmns/${cmn_id}"
              payload: { narrative_element_count: 3 }
              as: IntakeCoordinator
              as_user_id: "u-intake-1"
            - call: "POST /home-oxygen/cmns/${cmn_id}/submit"
              payload: {}
              as: IntakeCoordinator
              as_user_id: "u-intake-1"
            - call: "POST /home-oxygen/cmns/${cmn_id}/return-for-correction"
              payload: { correction_notes: "Round 3: hours per day still unsupported." }
              as: ComplianceAuditor
              as_user_id: "u-audit-1"
            - call: "PATCH /home-oxygen/cmns/${cmn_id}"
              payload: { hours_per_day: 24 }
              as: IntakeCoordinator
              as_user_id: "u-intake-1"
            - call: "POST /home-oxygen/cmns/${cmn_id}/submit"
              payload: {}
              as: IntakeCoordinator
              as_user_id: "u-intake-1"
            - call: "POST /home-oxygen/cmns/${cmn_id}/return-for-correction"
              payload: { correction_notes: "Round 4 attempt: must be refused." }
              as: ComplianceAuditor
              as_user_id: "u-audit-1"
          assert:
            - "After the first return: CertificateOfMedicalNecessity.${cmn_id}.status == RETURNED_FOR_CORRECTION AND revision_round == 1 AND Patient.${p_id}.current_cmn_status == RETURNED_FOR_CORRECTION"
            - "After the first PATCH: status == DRAFT (the cycle closed back onto an already-visited state) AND submitted_by_user_id == null AND documentation_score == 93.33 (narrative 2 of 3: 30 + 20 + 15 + 13.333... + 10 + 5)"
            - "After the second return (from PHYSICIAN_SIGNED): status == RETURNED_FOR_CORRECTION, revision_round == 2, signed_by_user_id == null, physician_signature_date == null"
            - "After the second PATCH: status == DRAFT AND documentation_score == 100.00"
            - "After the third return: revision_round == 3"
            - "After the third PATCH and re-submit: status == SUBMITTED AND revision_round == 3 (PATCH and submit never touch revision_round)"
            - "The fourth POST /home-oxygen/cmns/${cmn_id}/return-for-correction -> 409 ERR_REVISION_LIMIT_REACHED; status stays SUBMITTED and revision_round stays 3"
            - "POST /home-oxygen/cmns/${cmn_id}/void on the still-SUBMITTED certificate -> 409 ERR_INVALID_STATE (void is reachable only from DRAFT, RETURNED_FOR_CORRECTION or ACTIVE), so the exhausted certificate is genuinely stuck at SUBMITTED"
            - "CertificateOfMedicalNecessity.${cmn_id} visited DRAFT three separate times and SUBMITTED four separate times"

      - name: contract_parallel_billing_and_service_dimensions_evolve_independently
        grounds:
          - state_machines.RentalContract[state_field=billing_status].ACCRUING_to_CAP_REACHED
          - state_machines.RentalContract[state_field=service_status].IN_SERVICE_to_PICKUP_SCHEDULED
          - state_machines.RentalContract[state_field=service_status].PICKUP_SCHEDULED_to_IN_SERVICE
