  - section: state_machines
    instances:
      - name: offer_publish_moves_pending_to_live
        claim_type: valid_transition
        grounds:
          - state_machines.Offer.PENDING_to_LIVE
          - entities.Offer.fields.status
        distinguishing_aspect: "POST /offers/{id}/publish on a PENDING offer of a CERTIFIED supplier with an ACTIVE agreement returns status LIVE, bumps Offer.version from 1 to 2 and leaves every money field untouched."
        test_recipe:
          setup:
            - "A CERTIFIED hotel supplier, ACTIVE AGENCY agreement, ACTIVE FLEX plan and one PENDING offer for 2026-09-20 at net 24000."
          setup_api_calls:
            - *c_clock
            - *c_market
            - *c_sup
            - *c_cert_sub
            - *c_cert_rev
            - *c_cert_dec
            - *c_ma
            - *c_ma_act
            - *c_rp
            - *c_off
          trigger:
            - call: "POST /offers/${off}/publish"
              payload: { note: "loaded and ready to sell" }
              as: SupplierUser
              as_user_id: "${sup}"
          assert:
            - "HTTP 200 with Offer.${off}.status == LIVE and suppression_reason == null"
            - "Offer.${off}.version == 2 (it was 1 at creation)"
            - "Offer.${off}.display_total_cents is still 24240 and allotment_remaining is still 3"

      - name: certification_certify_decision_side_effects_are_all_applied
        claim_type: side_effect_execution
        grounds:
          - state_machines.Certification.IN_REVIEW_to_CERTIFIED
          - state_machines.Supplier.PENDING_CERT_to_ACTIVE
          - entities.Certification.fields.expires_at
          - entities.Supplier.fields.certification_level
        distinguishing_aspect: "One decide call must apply all four declared side effects: it stores the reviewer scores and decision, sets expires_at to the logical clock plus 365 days (2027-08-05T00:00:00Z), copies both scores onto the Supplier, and drives the Supplier PENDING_CERT -> ACTIVE with certification_level CERTIFIED."
        test_recipe:
          setup:
            - "Logical clock at 2026-08-05T00:00:00Z."
            - "Supplier Hotel Lutetia at visibility_status PENDING_CERT with content_score 0 and connectivity_score 0."
            - "Its certification is IN_REVIEW after start-review."
          setup_api_calls:
            - *c_clock
            - *c_market
            - *c_sup
            - *c_cert_sub
            - *c_cert_rev
          trigger:
            - call: "POST /certifications/${cert}/decide"
              payload: { decision: "CERTIFY", content_score: 88, connectivity_score: 91, note: "full certification granted" }
              as: ComplianceOfficer
              as_user_id: "co-1"
          assert:
            - "Certification.${cert}.status == CERTIFIED, decision == CERTIFY, content_score == 88, connectivity_score == 91, reviewed_by_user_id == co-1"
            - "Certification.${cert}.expires_at == 2027-08-05T00:00:00Z (logical clock 2026-08-05T00:00:00Z plus CERT_FULL_VALIDITY_DAYS 365)"
            - "Supplier.${sup}.visibility_status == ACTIVE, certification_level == CERTIFIED, content_score == 88, connectivity_score == 91"
            - "Supplier.${sup}.suspension_reason == null and Supplier.${sup}.version was incremented by the cascade"

      - name: complete_a_confirmed_booking_before_arrival_is_rejected
        claim_type: precondition_enforcement
        grounds:
          - state_machines.Booking.CONFIRMED_to_COMPLETED
          - errors[ERR_BOOKING_NOT_CONFIRMED]
          - validations[priority=9]
        distinguishing_aspect: "The CONFIRMED -> COMPLETED precondition 'the logical clock is at or after Booking.arrival_at' is enforced independently of fulfillment_status: at clock 2026-08-05 against an arrival_at of 2026-09-20T15:00:00Z the call returns HTTP 409 ERR_BOOKING_NOT_CONFIRMED and the booking stays CONFIRMED."
        test_recipe:
          setup:
            - "A LIVE offer for 2026-09-20 at display 24240 on a CERTIFIED supplier."
            - "A booking on it, CAPTURED and CONFIRMED, with arrival_at 2026-09-20T15:00:00Z."
            - "The logical clock is still 2026-08-05T00:00:00Z."
          setup_api_calls:
            - *c_clock
            - *c_market
            - *c_sup
            - *c_cert_sub
            - *c_cert_rev
            - *c_cert_dec
            - *c_ma
            - *c_ma_act
            - *c_rp
            - *c_off
            - *c_off_pub
            - &c_bk
              call: "POST /bookings"
              payload: { offer_id: "${off}", traveler_reference: "PNR-K1", quoted_total_cents: 24240, payment_token: "tok_live_9" }
              as: BookingAgent
              as_user_id: "ba-1"
              captures: { bk: $.data.id }
            - &c_bk_cap
              call: "POST /bookings/${bk}/capture"
              payload: {}
              as: BookingAgent
              as_user_id: "ba-1"
            - call: "POST /bookings/${bk}/confirm"
              payload: { supplier_confirmation_code: "LUT-77001" }
              as: SupplierUser
              as_user_id: "${sup}"
          trigger:
            - call: "POST /bookings/${bk}/complete"
              payload: {}
              as: SupplierUser
              as_user_id: "${sup}"
              captures: { err_cmp: $.data.error_id }
          assert:
            - "HTTP 409 and ${err_cmp} == ERR_BOOKING_NOT_CONFIRMED"
            - "Booking.${bk}.fulfillment_status is still CONFIRMED and payment_status is still CAPTURED"
            - "Booking.${bk}.arrival_at == 2026-09-20T15:00:00Z, derived from travel_date and ARRIVAL_HOUR_UTC 15"

      - name: capture_an_already_captured_booking_is_rejected
        claim_type: invalid_transition
        grounds:
          - state_machines.Booking.AUTHORIZED_to_CAPTURED
          - errors[ERR_PAYMENT_NOT_AUTHORIZED]
        distinguishing_aspect: "capture is declared only from payment_status AUTHORIZED, so a second capture on a CAPTURED booking returns HTTP 409 ERR_PAYMENT_NOT_AUTHORIZED and does not bump Booking.version a second time."
        test_recipe:
          setup:
