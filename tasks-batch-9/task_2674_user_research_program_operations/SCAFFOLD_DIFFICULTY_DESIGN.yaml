        grounds:
          - state_machines.ResearchRequest.SUBMITTED_to_NEEDS_REFRAMING
          - state_machines.ResearchRequest.NEEDS_REFRAMING_to_SUBMITTED
          - state_machines.ResearchRequest.NEEDS_REFRAMING_to_REJECTED
          - entities.ResearchRequest.fields.revision_round
