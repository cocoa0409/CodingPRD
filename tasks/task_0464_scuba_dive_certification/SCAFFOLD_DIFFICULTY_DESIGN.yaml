          - entities.Session.fields.starts_at
          - entities.Session.fields.ends_at
          - entities.Instructor.fields.rating
        distinguishing_aspect: |
          Half-open interval semantics on the Instructor resource: a session
          adjacent at the boundary (09:00-11:00 then 11:00-13:00) is accepted,
          but an overlapping one (10:30-12:00) is rejected with
          ERR_INSTRUCTOR_CONFLICT. Adjacency-allowed arithmetic.
        test_recipe:
          setup:
            - "Clock 2026-06-01T00:00:00Z. An INSTRUCTOR with one SCHEDULED OW session 2026-07-01T09:00..11:00 and an adjacent one 11:00..13:00 (both accepted)."
