  - rule_id: transitive_cascade
    instances:
      - name: policy_rejection_cascades_five_levels_to_exam_cancellation
        grounds:
          - state_machines.PolicyDocument.EXAMINER_ACCEPTED_to_REJECTED
          - state_machines.RegulatoryFiling.CONDITIONALLY_APPROVED_to_ADDITIONAL_INFO_REQUESTED
          - state_machines.OrganizingGroup.PRE_OPENING_to_CONDITIONALLY_APPROVED
          - state_machines.ReadinessExam.SCHEDULED_to_CANCELLED
          - calculations.filing_condition_posture
          - entities.OrganizingGroup.fields.opening_blocked_reason
        distinguishing_aspect: >
          Cascade DEPTH FIVE from one call: PolicyDocument -> ApprovalCondition -> RegulatoryFiling
          -> OrganizingGroup -> ReadinessExam, each link a different entity, and the last link
          (exam cancellation) is only reachable because the group left PRE_OPENING three links
          upstream.
        test_recipe:
          setup:
            - "Group at stage PRE_OPENING: both filings CONDITIONALLY_APPROVED, escrow locked, all four"
            - "policy domains EXAMINER_ACCEPTED, the CRITICAL core-processing vendor SIGNED."
            - "The CHARTERING_AUTHORITY filing carries one pre-opening-blocking POLICY condition that"
            - "has already been adjudicated SATISFIED, so open_blocking_condition_count == 0 and"
            - "pre_opening_clearance == true."
            - "A FULL_SCOPE ReadinessExam is SCHEDULED for 2026-10-05T09:00:00Z and not yet resolved."
