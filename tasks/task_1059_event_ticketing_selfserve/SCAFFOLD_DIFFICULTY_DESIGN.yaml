            - "SeatBlock.${sb_id}.seats_taken == 0"
            - "TicketType.${tt_id}.sold_count == 0"
            - "GET /api/refund-requests?order_id=${order_id} returns exactly 1 row with status == APPROVED, policy == FEE_INCLUDED and refund_amount_cents == 10728"

      - name: refund_settle_drives_order_then_payout_recompute_then_hold
        grounds:
          - state_machines.RefundRequest.APPROVED_to_SETTLED
          - calculations.payout_net_amount
