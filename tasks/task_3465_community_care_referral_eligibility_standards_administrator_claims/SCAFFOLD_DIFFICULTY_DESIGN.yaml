            - "after documentation ACCEPTED: decide succeeds, ExtensionRequest.${ext_id}.status == APPROVED"
            - "ReferralAuthorization.${ra_id}.extended_visits == 5"
            - "ReferralAuthorization.${ra_id}.end_date_exclusive == 2027-07-12 (2026-09-05 + 300d + 10d)"

      - name: claim_adjudication_blocked_when_provider_suspended
        grounds:
          - state_machines.Claim.RECEIVED_to_PAID
          - entities.CommunityProvider.fields.credentialing_status
          - errors[ERR_PROVIDER_NOT_CREDENTIALED]
        distinguishing_aspect: |
          Entity pair Claim x CommunityProvider (different pair than the
          sibling's ExtensionRequest x MedicalDocumentation): adjudicating a
          perfectly valid RECEIVED claim fails with
          ERR_PROVIDER_NOT_CREDENTIALED the moment the provider's credentialing
          flips to SUSPENDED, and succeeds after reinstatement to CREDENTIALED.
        test_recipe:
          setup:
