        claim_type: Role Denial
        grounds: ["validations[priority=1]", "errors[ERR_UNAUTHENTICATED]"]
        distinguishing_aspect: "Priority 1 fires before everything else, so a household create with no X-User-Role header returns ERR_UNAUTHENTICATED (401) and creates nothing."
        test_recipe:
          setup: ["Clock 2026-05-01T00:00:00Z; empty database."]
          setup_api_calls:
            - call: "POST /smart-home-support/_clock/set_current_utc"
              payload: { to_iso8601: "2026-05-01T00:00:00Z" }
              as: PlatformAdmin
          trigger:
            - call: "POST /smart-home-support/households"
              payload: { name: "No Auth House", region_code: "NWA", billing_email: "noauth@example.com" }
              captures: { err_id: "$.data.error_id" }
          assert:
            - "the request is sent with NO X-User-Role header at all"
            - "HTTP status == 401"
            - "response data.error_id == ERR_UNAUTHENTICATED"

