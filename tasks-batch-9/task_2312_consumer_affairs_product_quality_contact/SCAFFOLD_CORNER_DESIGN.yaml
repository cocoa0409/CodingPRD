            - { call: "GET /production-lots/${lot1}", as: CareSupervisor, as_user_id: "${sup1}", payload: {}, captures: { rs1: "$.data.release_status", pc1: "$.data.provisional_complaint_count", ac1: "$.data.adjudicated_complaint_count" } }
            - { call: "GET /plants/${pl1}", as: CareSupervisor, as_user_id: "${sup1}", payload: {}, captures: { op1: "$.data.oversight_posture", oc1: "$.data.open_investigation_count" } }
