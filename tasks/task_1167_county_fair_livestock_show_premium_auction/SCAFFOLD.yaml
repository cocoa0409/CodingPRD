# =============================================================================
# Task 1167: County Fair Livestock Show & Premium Auction — seed tables (v1)
# =============================================================================

scenario: |
  generate task hard than expert level! 1167. County Fair Livestock Show & Premium Auction (county fair board): exhibitor entry & ownership/possession deadline verification, weigh-in, classification & class placement, show ring scheduling & judge assignment, premium payment schedule & state fair qualification, buyer registration & auction order, add-on donation processing & buyer invoicing, animal disposition (harvest/return) logistics, health inspection & drug-free affidavit compliance

domain_name: county-fair-livestock-auction
api_prefix: /v1

complexity_profile:
  primary_archetype: compliance_audit
  secondary_archetype: posture_driven_gating
  complexity_layers:
    - optimistic_concurrency
    - cascading_side_effects
    - dual_variant_calculation
    - derived_field_reconciliation
  entity_topology: flat
  state_machine_shape: cyclic
  relationship_patterns:
    - one_to_many
    - cross_aggregate
  role_model: segregation_of_duties
  consistency_model: immediate

# =============================================================================
# Table 1: Entity-Relationship Table
# All ids are server-minted UUIDs with no type prefix; id is identity only and
# is never used for ranking/tie-break/selection (created_at is the fallback).
# =============================================================================
entities:
  - name: Fair
    parent: null
    common_fields: true
    fields:
      - { name: name, type: string, source: input, description: "Fair edition name" }
      - { name: ownership_deadline_at, type: datetime, source: input, description: "Latest allowable AnimalEntry.ownership_acquired_at (inclusive)" }
      - { name: possession_deadline_at, type: datetime, source: input, description: "Latest allowable AnimalEntry.possession_start_at (inclusive)" }
      - { name: premium_budget_cents, type: integer, source: input, description: "Total premium purse; conserved: budget == available_premium_pool_cents + outstanding award reservations" }
      - { name: available_premium_pool_cents, type: integer, source: computed, description: "= premium_budget_cents - sum(provisional_amount_cents of PremiumAward status IN {ACCRUED, APPROVED, PAID})" }
      - { name: commission_rate, type: number, source: input, description: "Fair commission fraction on hammer price (e.g. 0.05), deducted from exhibitor payout" }
      - { name: buyer_premium_rate, type: number, source: input, description: "Buyer premium fraction charged per HAMMER invoice line (e.g. 0.03)" }
      - { name: yardage_fee_cents, type: integer, source: input, description: "Flat per-lot fee deducted from exhibitor payout" }
      - { name: premium_cap_cents, type: integer, source: input, description: "Per-award cap applied AFTER large-class bonus" }
      - { name: large_class_min_entries, type: integer, source: input, default: 8, description: "Class placed_count at/above which the large-class bonus applies" }
      - { name: large_class_bonus_rate, type: number, source: input, default: 0.10, description: "Bonus fraction of base premium for large classes" }
      - { name: premium_schedule, type: object, source: input, description: "{SPECIES: {grand_champion_cents, reserve_champion_cents, rank_1_cents, rank_2_cents, rank_3_cents, other_rank_cents}}" }
      - { name: state_qualify_rank, type: object, source: input, description: "{SPECIES: max rank (inclusive) qualifying for state fair; any non-NONE award also qualifies}" }
      - { name: sale_rank_threshold, type: object, source: input, description: "{SPECIES: max rank (inclusive) eligible for auction lot generation; any non-NONE award also qualifies}" }
      - { name: species_sale_order, type: array, source: input, description: "Species enum list giving auction lot order within the same award tier" }
      - { name: posture, type: enum, source: system, default: SETUP, description: "SETUP | ENTRIES_OPEN | ENTRIES_LOCKED | WEIGH_IN | SHOWING | AUCTION | SETTLEMENT | CLOSED; gates child operations" }

  - name: Exhibitor
    parent: null
    common_fields: true
    fields:
      - { name: fair_id, type: string, source: input, description: "FK -> Fair.id" }
      - { name: full_name, type: string, source: input, description: "Exhibitor legal name" }
      - { name: organization, type: enum, source: input, description: "FFA | FOUR_H | INDEPENDENT" }
      - { name: status, type: enum, source: system, default: ACTIVE, description: "ACTIVE | SUSPENDED" }

  - name: AnimalEntry
    parent: null
    common_fields: true
    fields:
      - { name: fair_id, type: string, source: input, description: "FK -> Fair.id" }
      - { name: exhibitor_id, type: string, source: input, description: "FK -> Exhibitor.id; owning exhibitor (ownership check for Exhibitor role)" }
      - { name: species, type: enum, source: input, description: "MARKET_STEER | MARKET_SWINE | MARKET_LAMB | MARKET_GOAT" }
      - { name: tag_number, type: string, source: input, description: "Ear tag; unique per fair" }
      - { name: ownership_acquired_at, type: datetime, source: input, description: "Date exhibitor acquired ownership; verified against Fair.ownership_deadline_at" }
      - { name: possession_start_at, type: datetime, source: input, description: "Date continuous possession began; verified against Fair.possession_deadline_at" }
      - { name: official_weight_lbs, type: number, source: computed, description: "Weight of latest ACTIVE WeighTicket (calc official_weight_resolution); null before first weigh-in" }
      - { name: class_id, type: string, source: system, description: "FK -> ShowClass.id; null until classified; cleared on reweigh/disqualify" }
      - { name: state_fair_qualified, type: boolean, source: computed, default: false, description: "Set by calc state_fair_qualification at placing time; cleared on placing void / disqualify" }
      - { name: status, type: enum, source: system, default: ENTERED, description: "ENTERED | VERIFIED | WEIGHED | CLASSIFIED | SHOWN | SOLD | NOT_SOLD | DISQUALIFIED | CLEARED | REJECTED" }
      - { name: disqualification_reason, type: string, source: system, description: "Set on DISQUALIFIED; null otherwise" }

  - name: WeighTicket
    parent: null
    common_fields: true
    fields:
      - { name: entry_id, type: string, source: input, description: "FK -> AnimalEntry.id" }
      - { name: weight_lbs, type: number, source: input, description: "Scale reading; must be > 0" }
      - { name: weighed_at, type: datetime, source: input, description: "Timestamp on the scale ticket" }
      - { name: scale_identifier, type: string, source: input, description: "Scale station id", default: null }
      - { name: status, type: enum, source: system, default: ACTIVE, description: "ACTIVE | VOIDED; creating a new ticket supersedes (voids) the prior ACTIVE ticket" }
      - { name: void_reason, type: string, source: system, description: "Set when voided (manual void or supersede)" }

  - name: ShowClass
    parent: null
    common_fields: true
    fields:
      - { name: fair_id, type: string, source: input, description: "FK -> Fair.id" }
      - { name: species, type: enum, source: input, description: "MARKET_STEER | MARKET_SWINE | MARKET_LAMB | MARKET_GOAT" }
      - { name: class_code, type: string, source: input, description: "Human label (e.g. LAMB-LIGHT); unique per fair+species" }
      - { name: weight_min_lbs, type: number, source: input, description: "Lower weight bound, INCLUSIVE" }
      - { name: weight_max_lbs, type: number, source: input, description: "Upper weight bound, EXCLUSIVE; must be > weight_min_lbs" }
      - { name: capacity, type: integer, source: input, description: "Max placed entries; must be > 0" }
      - { name: placed_count, type: integer, source: computed, default: 0, description: "= count(AnimalEntry with class_id=this and status IN {CLASSIFIED, SHOWN, SOLD, NOT_SOLD, CLEARED})" }
      - { name: status, type: enum, source: system, default: OPEN, description: "OPEN | FINALIZED; FINALIZED when placings submitted; reopens on placing void or shown-entry disqualify" }

  - name: Judge
    parent: null
    common_fields: true
    fields:
      - { name: fair_id, type: string, source: input, description: "FK -> Fair.id" }
      - { name: full_name, type: string, source: input, description: "Judge name" }
      - { name: qualified_species, type: array, source: input, description: "Non-empty list of species enums the judge may place" }

  - name: RingSlot
    parent: null
    common_fields: true
    fields:
      - { name: fair_id, type: string, source: input, description: "FK -> Fair.id" }
      - { name: class_id, type: string, source: input, description: "FK -> ShowClass.id; one slot per class (unique per fair)" }
      - { name: ring_name, type: string, source: input, description: "Physical ring identifier" }
      - { name: starts_at, type: datetime, source: input, description: "Slot start (half-open interval start)" }
      - { name: ends_at, type: datetime, source: input, description: "Slot end (half-open interval end); must be > starts_at" }
      - { name: judge_id, type: string, source: system, description: "FK -> Judge.id; null until assign-judge" }
      - { name: status, type: enum, source: system, default: SCHEDULED, description: "SCHEDULED | IN_PROGRESS | COMPLETED" }

  - name: Placing
    parent: null
    common_fields: true
    fields:
      - { name: ring_slot_id, type: string, source: system, description: "FK -> RingSlot.id; the slot whose class was placed" }
      - { name: class_id, type: string, source: system, description: "FK -> ShowClass.id; denormalized from slot" }
      - { name: entry_id, type: string, source: system, description: "FK -> AnimalEntry.id" }
      - { name: rank, type: integer, source: input, description: "1..N unique contiguous within the class" }
      - { name: award, type: enum, source: input, default: NONE, description: "NONE | GRAND_CHAMPION | RESERVE_CHAMPION; at most one GRAND and one RESERVE per species per fair" }
      - { name: status, type: enum, source: system, default: RECORDED, description: "RECORDED | VOIDED" }
      - { name: void_reason, type: string, source: system, description: "Set on void" }

  - name: PremiumAward
    parent: null
    common_fields: true
    fields:
      - { name: entry_id, type: string, source: system, description: "FK -> AnimalEntry.id" }
      - { name: placing_id, type: string, source: system, description: "FK -> Placing.id; one award per placing" }
      - { name: provisional_amount_cents, type: integer, source: computed, description: "Calc premium_award_amount (provisional variant) at placing time" }
      - { name: final_amount_cents, type: integer, source: computed, description: "Calc premium_award_amount (final variant) at run-settlement; null until then" }
      - { name: status, type: enum, source: system, default: ACCRUED, description: "ACCRUED | APPROVED | PAID | FORFEITED" }
      - { name: approved_by_user_id, type: string, source: system, description: "X-User-ID of approving Treasurer (segregation-of-duties anchor)" }
      - { name: paid_by_user_id, type: string, source: system, description: "X-User-ID of paying Treasurer; MUST differ from approved_by_user_id" }

  - name: Buyer
    parent: null
    common_fields: true
    fields:
      - { name: fair_id, type: string, source: input, description: "FK -> Fair.id" }
      - { name: business_name, type: string, source: input, description: "Buyer business or individual name" }
      - { name: bidder_number, type: string, source: computed, description: "B-<zero-padded 3-digit sequence> assigned per fair in created_at ASC order" }
      - { name: credit_limit_cents, type: integer, source: input, description: "Max outstanding commitment; enforced by calc buyer_exposure_check (equality allowed)" }

  - name: AuctionLot
    parent: null
    common_fields: true
    fields:
      - { name: fair_id, type: string, source: system, description: "FK -> Fair.id" }
      - { name: entry_id, type: string, source: system, description: "FK -> AnimalEntry.id; one lot per entry (unique)" }
      - { name: lot_number, type: integer, source: computed, description: "1..N assigned by calc auction_lot_ordering at generate time" }
      - { name: status, type: enum, source: system, default: QUEUED, description: "QUEUED | OPEN | SOLD | PASSED | NO_SALE" }
      - { name: buyer_id, type: string, source: system, description: "FK -> Buyer.id; winning buyer, null until SOLD" }
      - { name: hammer_price_cents, type: integer, source: system, description: "Winning bid; null until SOLD" }
      - { name: invoice_id, type: string, source: system, description: "FK -> Invoice.id that swept this lot; null until issued" }
      - { name: reoffer_count, type: integer, source: system, default: 0, description: "Number of PASSED->OPEN reoffers; max 2" }
      - { name: provisional_payout_cents, type: integer, source: computed, description: "Calc exhibitor_payout (provisional variant) at close-sold" }
      - { name: final_payout_cents, type: integer, source: computed, description: "Calc exhibitor_payout (final variant, includes non-VOID add-ons) at run-settlement; null until then" }

  - name: AddOnPledge
    parent: null
    common_fields: true
    fields:
      - { name: lot_id, type: string, source: input, description: "FK -> AuctionLot.id; lot must be SOLD and not yet swept into an ISSUED invoice" }
      - { name: buyer_id, type: string, source: input, description: "FK -> Buyer.id; pledging buyer (ownership check for Buyer role)" }
      - { name: invoice_id, type: string, source: system, description: "FK -> Invoice.id; null until swept by invoice issue" }
      - { name: amount_cents, type: integer, source: input, description: "Donation amount; must be > 0" }
      - { name: status, type: enum, source: system, default: PLEDGED, description: "PLEDGED | INVOICED | PAID | VOIDED" }

  - name: Invoice
    parent: null
    common_fields: true
    fields:
      - { name: fair_id, type: string, source: system, description: "FK -> Fair.id" }
      - { name: buyer_id, type: string, source: system, description: "FK -> Buyer.id" }
      - { name: status, type: enum, source: system, default: DRAFT, description: "DRAFT | ISSUED | PARTIALLY_PAID | PAID" }
      - { name: hammer_subtotal_cents, type: integer, source: computed, default: 0, description: "Sum of swept lot hammer prices; live-computed while DRAFT, frozen at issue" }
      - { name: addon_subtotal_cents, type: integer, source: computed, default: 0, description: "Sum of swept non-VOID add-on amounts; live while DRAFT, frozen at issue" }
      - { name: buyer_premium_cents, type: integer, source: computed, default: 0, description: "Calc invoice_totals: sum of PER-LINE round_half_up(hammer * buyer_premium_rate)" }
      - { name: total_due_cents, type: integer, source: computed, default: 0, description: "= hammer_subtotal_cents + addon_subtotal_cents + buyer_premium_cents" }
      - { name: amount_paid_cents, type: integer, source: computed, default: 0, description: "Sum of posted payments" }
      - { name: balance_cents, type: integer, source: computed, default: 0, description: "= total_due_cents - amount_paid_cents" }
      - { name: line_count, type: integer, source: computed, default: 0, description: "Number of swept lines (HAMMER + ADD_ON)" }

  - name: DispositionOrder
    parent: null
    common_fields: true
    fields:
      - { name: entry_id, type: string, source: input, description: "FK -> AnimalEntry.id" }
      - { name: disposition_type, type: enum, source: input, description: "HARVEST | RETURN; HARVEST required for SOLD entries, RETURN required for DISQUALIFIED entries" }
      - { name: destination, type: string, source: input, description: "Processor or home destination", default: null }
      - { name: scheduled_date, type: datetime, source: input, description: "Planned movement date; complete blocked before this instant", default: null }
      - { name: status, type: enum, source: system, default: REQUESTED, description: "REQUESTED | APPROVED | REJECTED | COMPLETED" }
      - { name: created_by_user_id, type: string, source: system, description: "X-User-ID of creator, or SYSTEM when auto-created by close-sold cascade" }
      - { name: approved_by_user_id, type: string, source: system, description: "X-User-ID of approving FairBoardAdmin; MUST differ from created_by_user_id unless creator is SYSTEM" }
      - { name: reject_reason, type: string, source: system, description: "Set on reject" }

  - name: HealthInspection
    parent: null
    common_fields: false
    fields:
      - { name: entry_id, type: string, source: input, description: "FK -> AnimalEntry.id" }
      - { name: result, type: enum, source: input, description: "PASS | FAIL | QUARANTINE; FAIL auto-disqualifies the entry" }
      - { name: notes, type: string, source: input, description: "Inspector notes", default: null }

  - name: Affidavit
    parent: null
    common_fields: true
    fields:
      - { name: entry_id, type: string, source: input, description: "FK -> AnimalEntry.id; at most one affidavit per entry" }
      - { name: exhibitor_id, type: string, source: system, description: "FK -> Exhibitor.id; denormalized from entry" }
      - { name: signed_at, type: datetime, source: system, description: "Logical clock time at signing" }
      - { name: withdrawal_end_date, type: datetime, source: input, description: "Drug withdrawal end; HARVEST complete blocked before this instant", default: null }
      - { name: status, type: enum, source: system, default: SIGNED, description: "SIGNED | REVOKED" }
      - { name: revoked_reason, type: string, source: system, description: "Set on revoke" }

# =============================================================================
# Table 2: State Machine Table
# =============================================================================
state_machines:
  - entity: Fair
    initial_state: SETUP
    terminal_states: [CLOSED]
    transitions:
      - from: SETUP
        to: ENTRIES_OPEN
        trigger: "POST /v1/fairs/{fairId}/advance-posture {to_posture: ENTRIES_OPEN}"
        actor: FairBoardAdmin
        preconditions: []
        side_effects: []
      - from: ENTRIES_OPEN
        to: ENTRIES_LOCKED
        trigger: "POST /v1/fairs/{fairId}/advance-posture {to_posture: ENTRIES_LOCKED}"
        actor: FairBoardAdmin
        preconditions: []
        side_effects: []
      - from: ENTRIES_LOCKED
        to: ENTRIES_OPEN
        trigger: "POST /v1/fairs/{fairId}/reopen-entries"
        actor: FairBoardAdmin
        preconditions:
          - "No WeighTicket with status ACTIVE exists for any entry of this fair (ERR_INVALID_STATE)"
        side_effects: []
        note: "Cycle: entries may reopen before any weigh-in has occurred"
      - from: ENTRIES_LOCKED
        to: WEIGH_IN
        trigger: "POST /v1/fairs/{fairId}/advance-posture {to_posture: WEIGH_IN}"
        actor: FairBoardAdmin
        preconditions: []
        side_effects: []
      - from: WEIGH_IN
        to: SHOWING
        trigger: "POST /v1/fairs/{fairId}/advance-posture {to_posture: SHOWING}"
        actor: FairBoardAdmin
        preconditions: []
        side_effects: []
      - from: SHOWING
        to: AUCTION
        trigger: "POST /v1/fairs/{fairId}/advance-posture {to_posture: AUCTION}"
        actor: FairBoardAdmin
        preconditions: []
        side_effects: []
      - from: AUCTION
        to: SETTLEMENT
        trigger: "POST /v1/fairs/{fairId}/advance-posture {to_posture: SETTLEMENT}"
        actor: FairBoardAdmin
        preconditions:
          - "Every AuctionLot of this fair is terminal (status IN {SOLD, NO_SALE}) (ERR_INVALID_STATE)"
        side_effects: []
      - from: SETTLEMENT
        to: CLOSED
        trigger: "POST /v1/fairs/{fairId}/advance-posture {to_posture: CLOSED}"
        actor: FairBoardAdmin
        preconditions:
          - "Every Invoice of this fair has status PAID (ERR_INVALID_STATE)"
          - "Every PremiumAward of this fair has status IN {PAID, FORFEITED} (ERR_INVALID_STATE)"
          - "Every DispositionOrder of this fair has status IN {COMPLETED, REJECTED} (ERR_INVALID_STATE)"
        side_effects: []
      - from: ANY_NON_TERMINAL
        to: ANY
        trigger: "advance-posture with a target that is not exactly the next posture in canonical order"
        actor: FairBoardAdmin
        preconditions: []
        side_effects: []
        note: "REJECTED with ERR_INVALID_STATE — advance is strictly one step; skipping or going backward is invalid (reopen-entries is the sole backward edge)"

  - entity: Exhibitor
    initial_state: ACTIVE
    terminal_states: []
    transitions:
      - from: ACTIVE
        to: SUSPENDED
        trigger: "POST /v1/exhibitors/{exhibitorId}/suspend"
        actor: FairBoardAdmin
        preconditions: []
        side_effects:
          - "Exhibitor can no longer create entries (ERR_EXHIBITOR_SUSPENDED); existing entries are unaffected"

  - entity: AnimalEntry
    initial_state: ENTERED
    terminal_states: [REJECTED, DISQUALIFIED, CLEARED]
    transitions:
      - from: ENTERED
        to: VERIFIED
        trigger: "POST /v1/entries/{entryId}/verify {decision: APPROVE}"
        actor: FairBoardAdmin
        preconditions:
          - "Fair posture IN {ENTRIES_OPEN, ENTRIES_LOCKED} (ERR_POSTURE_FORBIDS)"
          - "ownership_acquired_at <= fair.ownership_deadline_at, inclusive (ERR_OWNERSHIP_DEADLINE_MISSED)"
          - "possession_start_at <= fair.possession_deadline_at, inclusive (ERR_POSSESSION_DEADLINE_MISSED)"
        side_effects: []
      - from: ENTERED
        to: REJECTED
        trigger: "POST /v1/entries/{entryId}/verify {decision: REJECT}"
        actor: FairBoardAdmin
        preconditions:
          - "Fair posture IN {ENTRIES_OPEN, ENTRIES_LOCKED} (ERR_POSTURE_FORBIDS)"
        side_effects: []
      - from: VERIFIED
        to: WEIGHED
        trigger: "POST /v1/weigh-tickets (first ACTIVE ticket for the entry)"
        actor: WeighMaster
        preconditions:
          - "Fair posture == WEIGH_IN (ERR_POSTURE_FORBIDS)"
        side_effects:
          - "official_weight_lbs set via official_weight_resolution"
      - from: WEIGHED
        to: CLASSIFIED
        trigger: "POST /v1/entries/{entryId}/classify"
        actor: ShowClerk
        preconditions:
          - "Fair posture == WEIGH_IN (ERR_POSTURE_FORBIDS)"
          - "class_weight_placement selects a class (else ERR_NO_CLASS_FOR_WEIGHT)"
        side_effects:
          - "class_id set; target ShowClass.placed_count += 1 (calc class_placed_count)"
      - from: CLASSIFIED
        to: WEIGHED
        trigger: "POST /v1/weigh-tickets (reweigh: new ACTIVE ticket supersedes)"
        actor: WeighMaster
        preconditions:
          - "Fair posture == WEIGH_IN (ERR_POSTURE_FORBIDS)"
        side_effects:
          - "Prior ACTIVE ticket -> VOIDED (void_reason SUPERSEDED)"
          - "class_id cleared to null; prior ShowClass.placed_count -= 1"
          - "official_weight_lbs recomputed"
        note: "Cycle WEIGHED -> CLASSIFIED -> WEIGHED: reweigh un-classifies"
      - from: CLASSIFIED
        to: SHOWN
        trigger: "POST /v1/ring-slots/{slotId}/placings (entry included in submitted placings)"
        actor: Judge
        preconditions: []
        side_effects:
          - "Placing RECORDED created; PremiumAward ACCRUED created (provisional variant)"
          - "Fair.available_premium_pool_cents -= provisional_amount_cents"
          - "state_fair_qualified recomputed (calc state_fair_qualification)"
      - from: SHOWN
        to: SOLD
        trigger: "POST /v1/auction-lots/{lotId}/close-sold on the entry's lot"
        actor: Auctioneer
        preconditions: []
        side_effects:
          - "Any DispositionOrder for this entry in REQUESTED/APPROVED with disposition_type RETURN -> REJECTED (reason SALE_REQUIRES_HARVEST)"
          - "New DispositionOrder auto-created: disposition_type HARVEST, status REQUESTED, created_by_user_id SYSTEM"
      - from: SHOWN
        to: NOT_SOLD
        trigger: "POST /v1/auction-lots/{lotId}/no-sale on the entry's lot"
        actor: Auctioneer
        preconditions: []
        side_effects: []
      - from: SOLD
        to: CLEARED
        trigger: "POST /v1/dispositions/{orderId}/complete"
        actor: FairBoardAdmin
        preconditions: []
        side_effects: []
      - from: NOT_SOLD
        to: CLEARED
        trigger: "POST /v1/dispositions/{orderId}/complete"
        actor: FairBoardAdmin
        preconditions: []
        side_effects: []
      - from: VERIFIED
        to: DISQUALIFIED
        trigger: "POST /v1/entries/{entryId}/disqualify, HealthInspection FAIL, or Affidavit revoke"
        actor: "FairBoardAdmin | system"
        preconditions: []
        side_effects: ["See cascade_disqualify_entry in calculations (links: placings voided, awards forfeited, pool released, lots NO_SALE, dispositions REJECTED, state_fair_qualified=false)"]
      - from: WEIGHED
        to: DISQUALIFIED
        trigger: "same as VERIFIED->DISQUALIFIED"
        actor: "FairBoardAdmin | system"
        preconditions: []
        side_effects: ["Same cascade"]
      - from: CLASSIFIED
        to: DISQUALIFIED
        trigger: "same as VERIFIED->DISQUALIFIED"
        actor: "FairBoardAdmin | system"
        preconditions: []
        side_effects: ["Same cascade; class_id cleared and ShowClass.placed_count -= 1"]
      - from: SHOWN
        to: DISQUALIFIED
        trigger: "same as VERIFIED->DISQUALIFIED"
        actor: "FairBoardAdmin | system"
        preconditions: []
        side_effects: ["Same cascade; class_id cleared and ShowClass.placed_count -= 1; if class FINALIZED it reopens to OPEN"]
      - from: NOT_SOLD
        to: DISQUALIFIED
        trigger: "same as VERIFIED->DISQUALIFIED"
        actor: "FairBoardAdmin | system"
        preconditions: []
        side_effects: ["Same cascade"]
        note: "SOLD and CLEARED entries cannot be disqualified (ERR_INVALID_STATE): the sale is final"

  - entity: WeighTicket
    initial_state: ACTIVE
    terminal_states: [VOIDED]
    transitions:
      - from: ACTIVE
        to: VOIDED
        trigger: "POST /v1/weigh-tickets/{ticketId}/void, or system supersede on new ticket creation"
        actor: "WeighMaster | system"
        preconditions:
          - "Manual void: parent AnimalEntry.status == WEIGHED (ERR_INVALID_STATE) — a CLASSIFIED-or-later entry is reweighed via POST /v1/weigh-tickets instead"
        side_effects:
          - "AnimalEntry.official_weight_lbs recomputed from remaining ACTIVE tickets (null if none)"
          - "If no ACTIVE ticket remains: AnimalEntry WEIGHED -> VERIFIED"

  - entity: ShowClass
    initial_state: OPEN
    terminal_states: []
    transitions:
      - from: OPEN
        to: FINALIZED
        trigger: "POST /v1/ring-slots/{slotId}/placings (complete placing set accepted)"
        actor: Judge
        preconditions: []
        side_effects: []
      - from: FINALIZED
        to: OPEN
        trigger: "POST /v1/placings/{placingId}/void, or shown-entry disqualify cascade touching this class"
        actor: "Judge | FairBoardAdmin | system"
        preconditions: []
        side_effects: []
        note: "Cycle OPEN -> FINALIZED -> OPEN on correction"

  - entity: RingSlot
    initial_state: SCHEDULED
    terminal_states: []
    transitions:
      - from: SCHEDULED
        to: IN_PROGRESS
        trigger: "POST /v1/ring-slots/{slotId}/start"
        actor: ShowClerk
        preconditions:
          - "judge_id is assigned (ERR_INVALID_STATE)"
          - "Fair posture == SHOWING (ERR_POSTURE_FORBIDS)"
        side_effects: []
      - from: IN_PROGRESS
        to: COMPLETED
        trigger: "POST /v1/ring-slots/{slotId}/placings accepted"
        actor: Judge
        preconditions: []
        side_effects: []

  - entity: AuctionLot
    initial_state: QUEUED
    terminal_states: [SOLD, NO_SALE]
    transitions:
      - from: QUEUED
        to: OPEN
        trigger: "POST /v1/auction-lots/{lotId}/open"
        actor: Auctioneer
        preconditions:
          - "Fair posture == AUCTION (ERR_POSTURE_FORBIDS)"
          - "Every AuctionLot of this fair with a smaller lot_number has status != QUEUED (strict sale order) (ERR_INVALID_STATE)"
        side_effects: []
      - from: OPEN
        to: SOLD
        trigger: "POST /v1/auction-lots/{lotId}/close-sold"
        actor: Auctioneer
        preconditions:
          - "buyer_id references an existing Buyer (ERR_NOT_FOUND)"
          - "buyer_exposure_check passes: committed_cents + hammer_price_cents <= buyer.credit_limit_cents (ERR_CREDIT_LIMIT_EXCEEDED)"
          - "hammer_price_cents > 0 (ERR_INVALID_AMOUNT)"
        side_effects:
          - "buyer_id, hammer_price_cents set; provisional_payout_cents computed (calc exhibitor_payout provisional variant)"
          - "AnimalEntry SHOWN -> SOLD (link 2 of cascade_close_sold)"
          - "Entry becoming SOLD auto-creates DispositionOrder(HARVEST, REQUESTED, created_by_user_id=SYSTEM) and auto-rejects its pending RETURN orders (link 3)"
          - "Buyer DRAFT Invoice upserted and the lot line added; DRAFT totals live-recomputed (calc invoice_totals)"
      - from: OPEN
        to: PASSED
        trigger: "POST /v1/auction-lots/{lotId}/close-passed"
        actor: Auctioneer
        preconditions: []
        side_effects: []
      - from: PASSED
        to: OPEN
        trigger: "POST /v1/auction-lots/{lotId}/reoffer"
        actor: Auctioneer
        preconditions:
          - "reoffer_count < 2 (ERR_REOFFER_LIMIT_REACHED)"
        side_effects:
          - "reoffer_count += 1"
        note: "Cycle OPEN -> PASSED -> OPEN bounded by reoffer_count <= 2"
      - from: PASSED
        to: NO_SALE
        trigger: "POST /v1/auction-lots/{lotId}/no-sale"
        actor: Auctioneer
        preconditions: []
        side_effects:
          - "AnimalEntry SHOWN -> NOT_SOLD"
      - from: QUEUED
        to: NO_SALE
        trigger: "system (entry disqualified cascade)"
        actor: system
        preconditions: []
        side_effects: []
      - from: PASSED
        to: NO_SALE
        trigger: "system (entry disqualified cascade)"
        actor: system
        preconditions: []
        side_effects:
          - "AnimalEntry -> DISQUALIFIED (already applied by the same cascade; lot just closes)"

  - entity: PremiumAward
    initial_state: ACCRUED
    terminal_states: [PAID, FORFEITED]
    transitions:
      - from: ACCRUED
        to: APPROVED
        trigger: "POST /v1/premium-awards/{awardId}/approve"
        actor: Treasurer
        preconditions:
          - "Fair posture == SETTLEMENT (ERR_POSTURE_FORBIDS)"
          - "Entry has an Affidavit with status SIGNED (ERR_AFFIDAVIT_MISSING)"
        side_effects:
          - "approved_by_user_id set to X-User-ID"
      - from: APPROVED
        to: PAID
        trigger: "POST /v1/premium-awards/{awardId}/pay"
        actor: Treasurer
        preconditions:
          - "X-User-ID != approved_by_user_id (segregation of duties) (ERR_SEGREGATION_OF_DUTIES)"
        side_effects:
          - "paid_by_user_id set; paid amount = final_amount_cents if set else provisional_amount_cents"
      - from: ACCRUED
        to: FORFEITED
        trigger: "POST /v1/premium-awards/{awardId}/forfeit, placing void, or disqualify cascade"
        actor: "Treasurer | system"
        preconditions: []
        side_effects:
          - "Fair.available_premium_pool_cents += provisional_amount_cents (pool release compensation)"
      - from: APPROVED
        to: FORFEITED
        trigger: "POST /v1/premium-awards/{awardId}/forfeit"
        actor: Treasurer
        preconditions: []
        side_effects:
          - "Fair.available_premium_pool_cents += provisional_amount_cents (clawback to pool)"

  - entity: Invoice
    initial_state: DRAFT
    terminal_states: [PAID]
    transitions:
      - from: DRAFT
        to: ISSUED
        trigger: "POST /v1/invoices/{invoiceId}/issue"
        actor: Treasurer
        preconditions:
          - "Fair posture == SETTLEMENT (ERR_POSTURE_FORBIDS)"
          - "At least one unswept line exists for the buyer (ERR_INVALID_STATE)"
        side_effects:
          - "Sweeps buyer's SOLD lots with invoice_id null and their PLEDGED AddOnPledges into this invoice"
          - "Swept AddOnPledges PLEDGED -> INVOICED (invoice_id set); swept lots get invoice_id set"
          - "Totals frozen per calc invoice_totals (per-line buyer-premium rounding, then summed)"
      - from: ISSUED
        to: PARTIALLY_PAID
        trigger: "POST /v1/invoices/{invoiceId}/payments with amount_cents < balance_cents"
        actor: Treasurer
        preconditions:
          - "amount_cents > 0 (ERR_INVALID_AMOUNT); amount_cents <= balance_cents (ERR_OVERPAYMENT)"
        side_effects: ["amount_paid_cents, balance_cents recomputed"]
      - from: PARTIALLY_PAID
        to: PARTIALLY_PAID
        trigger: "POST /v1/invoices/{invoiceId}/payments with amount_cents < balance_cents"
        actor: Treasurer
        preconditions:
          - "amount_cents > 0 (ERR_INVALID_AMOUNT); amount_cents <= balance_cents (ERR_OVERPAYMENT)"
        side_effects: ["amount_paid_cents, balance_cents recomputed"]
      - from: ISSUED
        to: PAID
        trigger: "POST /v1/invoices/{invoiceId}/payments with amount_cents == balance_cents"
        actor: Treasurer
        preconditions:
          - "amount_cents > 0 (ERR_INVALID_AMOUNT); amount_cents <= balance_cents (ERR_OVERPAYMENT)"
        side_effects:
          - "balance_cents = 0; swept AddOnPledges INVOICED -> PAID"
      - from: PARTIALLY_PAID
        to: PAID
        trigger: "POST /v1/invoices/{invoiceId}/payments with amount_cents == balance_cents"
        actor: Treasurer
        preconditions: ["same as ISSUED->PAID"]
        side_effects:
          - "balance_cents = 0; swept AddOnPledges INVOICED -> PAID"

  - entity: AddOnPledge
    initial_state: PLEDGED
    terminal_states: [PAID, VOIDED]
    transitions:
      - from: PLEDGED
        to: INVOICED
        trigger: "POST /v1/invoices/{invoiceId}/issue (sweep)"
        actor: Treasurer
        preconditions: []
        side_effects: ["invoice_id set"]
      - from: INVOICED
        to: PAID
        trigger: "system (invoice reaches PAID)"
        actor: system
        preconditions: []
        side_effects: []
      - from: PLEDGED
        to: VOIDED
        trigger: "POST /v1/add-ons/{addonId}/void"
        actor: "Buyer | FairBoardAdmin"
        preconditions: []
        side_effects: ["Removed from DRAFT invoice totals (derived reconciliation)"]

  - entity: DispositionOrder
    initial_state: REQUESTED
    terminal_states: [COMPLETED, REJECTED]
    transitions:
      - from: REQUESTED
        to: APPROVED
        trigger: "POST /v1/dispositions/{orderId}/approve"
        actor: FairBoardAdmin
        preconditions:
          - "X-User-ID != created_by_user_id unless created_by_user_id == SYSTEM (segregation of duties) (ERR_SEGREGATION_OF_DUTIES)"
          - "Entry has an Affidavit with status SIGNED (ERR_AFFIDAVIT_MISSING)"
          - "disposition_type compatible with entry status: HARVEST requires entry status IN {SOLD, NOT_SOLD}; RETURN requires entry status IN {SHOWN, NOT_SOLD, DISQUALIFIED} (ERR_DISPOSITION_NOT_ALLOWED)"
        side_effects: ["approved_by_user_id set"]
      - from: REQUESTED
        to: REJECTED
        trigger: "POST /v1/dispositions/{orderId}/reject, or system cascades (disqualify; sale requiring harvest)"
        actor: "FairBoardAdmin | system"
        preconditions: []
        side_effects: ["reject_reason set"]
      - from: APPROVED
        to: REJECTED
        trigger: "system (entry disqualified cascade)"
        actor: system
        preconditions: []
        side_effects: ["reject_reason set"]
      - from: APPROVED
        to: COMPLETED
        trigger: "POST /v1/dispositions/{orderId}/complete"
        actor: FairBoardAdmin
        preconditions:
          - "Latest HealthInspection (by created_at) for the entry exists and has result PASS (ERR_HEALTH_HOLD)"
          - "HARVEST only: affidavit.withdrawal_end_date is null OR current logical time >= withdrawal_end_date (ERR_WITHDRAWAL_NOT_CLEARED)"
          - "scheduled_date is null OR current logical time >= scheduled_date (ERR_DISPOSITION_TOO_EARLY)"
          - "disposition_type still compatible with the entry's CURRENT status (ERR_DISPOSITION_NOT_ALLOWED)"
        side_effects:
          - "If entry status IN {SOLD, NOT_SOLD}: AnimalEntry -> CLEARED"

  - entity: Affidavit
    initial_state: SIGNED
    terminal_states: [REVOKED]
    transitions:
      - from: SIGNED
        to: REVOKED
        trigger: "POST /v1/affidavits/{affidavitId}/revoke"
        actor: HealthInspector
        preconditions:
          - "Entry status NOT IN {SOLD, CLEARED, REJECTED, DISQUALIFIED} (ERR_INVALID_STATE)"
        side_effects:
          - "revoked_reason set; entry disqualified via cascade_disqualify_entry (links: entry DISQUALIFIED -> placings VOIDED -> awards FORFEITED -> pool released)"

# =============================================================================
# Table 2.1: Concurrency Rules (OCC only — all other conflicts are state
# preconditions in §1.2 / §1.4)
# =============================================================================
concurrency_rules:
  - rule_id: weigh-ticket-supersede-stale-entry
    parent_entity: AnimalEntry
    write_endpoint: "POST /v1/weigh-tickets"
    occ_field: "expected_entry_version"
    description: |
      Creating a WeighTicket supersedes the entry's prior ACTIVE ticket and
      rewrites official_weight_lbs; a client holding a stale AnimalEntry.version
      is rejected with ERR_STALE_VERSION. The check is the OCC version match on
      the parent entry; the second of two strictly sequential creates observes
      the advanced version and fails deterministically.
    error_id: ERR_STALE_VERSION
    http_status: 412
  - rule_id: slot-judge-assign-stale-slot
    parent_entity: RingSlot
    write_endpoint: "POST /v1/ring-slots/{slotId}/assign-judge"
    occ_field: "expected_ring_slot_version"
    description: |
      Assigning a judge overwrites RingSlot.judge_id; a client holding a stale
      RingSlot.version is rejected with ERR_STALE_VERSION. The check is the OCC
      version match on the slot; a second strictly sequential assign carrying
      the pre-assignment version fails deterministically.
    error_id: ERR_STALE_VERSION
    http_status: 412

# =============================================================================
# Table 3: Calculation Rules Table
# =============================================================================
calculations:
  - name: official_weight_resolution
    trigger: "WeighTicket create or void"
    algorithm: aggregation
    formula: |
      candidates = WeighTicket where entry_id == entry.id AND status == ACTIVE
      if candidates empty: official_weight_lbs = null
      else: pick ticket with max created_at; tie-break (identical created_at
      millisecond): larger weighed_at; still tied: larger weight_lbs.
      official_weight_lbs = picked.weight_lbs. id is NEVER used as tie-break.
    input_set: "WeighTicket rows of the entry in status ACTIVE only; VOIDED excluded"
    precision: "weight stored as given (one decimal place typical); no rounding"

  - name: class_placed_count
    trigger: "classify, reweigh (un-classify), disqualify from CLASSIFIED/SHOWN"
    algorithm: aggregation
    formula: |
      ShowClass.placed_count = count(AnimalEntry where class_id == class.id
        AND status IN {CLASSIFIED, SHOWN, SOLD, NOT_SOLD, CLEARED})
    input_set: "AnimalEntry rows referencing the class in placed statuses only"

  - name: class_weight_placement
    trigger: "POST /v1/entries/{entryId}/classify"
    algorithm: threshold
    formula: |
      w = entry.official_weight_lbs
      eligible = ShowClass where fair_id == entry.fair_id
        AND species == entry.species
        AND status == OPEN
        AND weight_min_lbs <= w < weight_max_lbs   # lower INCLUSIVE, upper EXCLUSIVE
        AND placed_count < capacity
      if request supplies class_id: restrict eligible to that class;
        specific failures map: status != OPEN -> ERR_CLASS_NOT_OPEN;
        placed_count >= capacity -> ERR_CLASS_CAPACITY_FULL;
        weight outside [min, max) or species mismatch -> ERR_NO_CLASS_FOR_WEIGHT.
      if eligible empty (selector mode): ERR_NO_CLASS_FOR_WEIGHT
      else pick min weight_min_lbs; tie-break: created_at ASC (never id).
    input_set: "ShowClass rows of the same fair and species, status OPEN, weight interval containing w, under capacity"
    precision: "weight compared exactly as stored"

  - name: premium_award_amount
    trigger: "placings accepted (provisional variant); POST /v1/fairs/{fairId}/run-settlement (final variant)"
    algorithm: tiered_pricing
    formula: |
      schedule = fair.premium_schedule[entry.species]
      base = placing.award == GRAND_CHAMPION   ? schedule.grand_champion_cents
           : placing.award == RESERVE_CHAMPION ? schedule.reserve_champion_cents
           : placing.rank == 1 ? schedule.rank_1_cents
           : placing.rank == 2 ? schedule.rank_2_cents
           : placing.rank == 3 ? schedule.rank_3_cents
           : schedule.other_rank_cents
      class_size = ShowClass(placing.class_id).placed_count  # after this placing batch lands
      bonus = (class_size >= fair.large_class_min_entries)
              ? round_half_up(base * fair.large_class_bonus_rate) : 0
      provisional_amount_cents = min(base + bonus, fair.premium_cap_cents)
      # FINAL variant (run-settlement):
      outstanding = sum(provisional_amount_cents of PremiumAward where fair matches
                        AND status IN {ACCRUED, APPROVED})
      scale = min(1, fair.premium_budget_cents / outstanding)  # outstanding==0 -> scale=1 vacuously
      final_amount_cents = floor(provisional_amount_cents * scale)
    input_set: "provisional: the placing, its class placed_count, fair config; final: all non-forfeited, non-paid awards of the fair (status ACCRUED or APPROVED)"
    constants:
      ROUNDING: round_half_up to whole cents for bonus; floor to whole cents for final scale
    precision: "integer cents"
    variants:
      - name: provisional
        when: "computed at placing acceptance; ignores purse-wide oversubscription"
        difference: "no scale factor; amount = min(base + bonus, cap)"
      - name: final
        when: "computed at run-settlement"
        difference: "pro-rata floor(provisional * min(1, budget/outstanding)); differs from provisional whenever the purse is oversubscribed"

  - name: auction_lot_ordering
    trigger: "POST /v1/auction-lots/generate"
    algorithm: chronological
    formula: |
      eligible = AnimalEntry where fair_id == fair.id
        AND status == SHOWN
        AND no existing AuctionLot references the entry
        AND Exhibitor(entry.exhibitor_id).status == ACTIVE
        AND no HealthInspection of the entry has result FAIL,
            and the latest HealthInspection (by created_at), if any, is PASS
        AND (placing.award != NONE OR placing.rank <= fair.sale_rank_threshold[species])
      sort key: (award_tier ASC, species_order_index ASC, rank ASC, entry.created_at ASC)
        where award_tier: GRAND_CHAMPION=0, RESERVE_CHAMPION=1, NONE=2
        and species_order_index = index of species in fair.species_sale_order
      lot_number = 1..N in that order. id NEVER participates in ordering.
    input_set: "SHOWN entries of the fair passing the eligibility predicate; placing = the entry's RECORDED placing"
    precision: "integer lot numbers, gapless from 1"

  - name: invoice_totals
    trigger: "invoice issue (freeze); live-derived while DRAFT"
    algorithm: aggregation
    formula: |
      # PINNED ROUNDING ORDER — per line first, then sum:
      for each HAMMER line: line_premium_cents = round_half_up(line.hammer_price_cents * fair.buyer_premium_rate)
      buyer_premium_cents = sum(line_premium_cents)         # sum of rounded line values
      hammer_subtotal_cents = sum(hammer of swept SOLD lots)
      addon_subtotal_cents = sum(amount_cents of swept AddOnPledges)   # add-ons carry NO buyer premium
      total_due_cents = hammer_subtotal_cents + addon_subtotal_cents + buyer_premium_cents
      # The alternative order round_half_up(sum(hammer) * rate) can differ by cents;
      # the per-line-then-sum order above is the contract.
    input_set: "SOLD lots of the buyer with invoice_id null at issue time, plus their PLEDGED AddOnPledges"
    precision: "integer cents, round_half_up per line"

  - name: exhibitor_payout
    trigger: "close-sold (provisional variant); run-settlement (final variant)"
    algorithm: aggregation
    formula: |
      commission_cents = round_half_up(lot.hammer_price_cents * fair.commission_rate)
      provisional_payout_cents = hammer_price_cents - commission_cents - fair.yardage_fee_cents
      final_payout_cents = hammer_price_cents
        + sum(amount_cents of AddOnPledges of the lot with status != VOIDED)
        - commission_cents - fair.yardage_fee_cents
    input_set: "the SOLD lot; final variant additionally sums the lot's non-VOID add-on pledges"
    precision: "integer cents, round_half_up for commission"
    variants:
      - name: provisional
        when: "at close-sold; add-ons unknown"
        difference: "excludes add-ons entirely"
      - name: final
        when: "at run-settlement"
        difference: "includes sum of the lot's non-VOID add-on pledges; differs from provisional whenever any non-VOID add-on exists"

  - name: state_fair_qualification
    trigger: "placings accepted; re-evaluated (to false) on placing void or disqualify"
    algorithm: threshold
    formula: |
      entry.state_fair_qualified =
        (placing.award != NONE) OR (placing.rank <= fair.state_qualify_rank[entry.species])
      # boundary is INCLUSIVE: rank exactly equal to the threshold qualifies
    input_set: "the entry's RECORDED placing and fair.state_qualify_rank"
    precision: "boolean"

  - name: buyer_exposure_check
    trigger: "POST /v1/auction-lots/{lotId}/close-sold"
    algorithm: threshold
    formula: |
      committed_cents = sum(hammer_price_cents of AuctionLot where buyer_id == buyer.id
                            AND status == SOLD AND (invoice_id is null
                              OR Invoice(invoice_id).status != PAID))
                      + sum(amount_cents of AddOnPledge where buyer_id == buyer.id
                            AND status IN {PLEDGED, INVOICED})
      require committed_cents + hammer_price_cents <= buyer.credit_limit_cents
      # boundary INCLUSIVE: equality passes; one cent over fails with ERR_CREDIT_LIMIT_EXCEEDED
    input_set: "buyer's SOLD lots not on a PAID invoice, plus buyer's PLEDGED/INVOICED add-ons"
    precision: "integer cents"

  - name: premium_pool_reconciliation
    trigger: "award accrual (placings), forfeit (any path), pay"
    algorithm: aggregation
    formula: |
      Fair.available_premium_pool_cents = Fair.premium_budget_cents
        - sum(provisional_amount_cents of PremiumAward of the fair
              where status IN {ACCRUED, APPROVED, PAID})
      # Conserved quantity (Rule 9): premium_budget_cents ==
      #   available_premium_pool_cents + outstanding reservations, across every
      #   accrue/forfeit/pay pair. Pool may transiently go negative when
      #   oversubscribed; run-settlement scaling brings payouts back within budget.
    input_set: "PremiumAward rows of the fair in ACCRUED/APPROVED/PAID; FORFEITED excluded (returned to pool)"
    precision: "integer cents"

# =============================================================================
# Table 4: Validation Rules Table (ordered by priority; first failure wins)
# =============================================================================
validations:
  - { priority: 1, category: auth, check: "X-User-Role and X-User-ID headers present and role is a declared role", error_id: ERR_UNAUTHENTICATED, http_status: 401, applies_to: "all except none" }
  - { priority: 2, category: auth, check: "Role permitted for endpoint; entity-backed ownership: Exhibitor acts only on own entries/affidavits/dispositions (exhibitor_id == X-User-ID), Buyer pledges only for self (buyer_id == X-User-ID), Judge places only slots where judge_id == X-User-ID (else ERR_NOT_ASSIGNED_JUDGE)", error_id: ERR_FORBIDDEN, http_status: 403, applies_to: "all" }
  - { priority: 3, category: existence, check: "Path ids then body FK ids exist, validated left-to-right", error_id: ERR_NOT_FOUND, http_status: 404, applies_to: "all resource endpoints" }
  - { priority: 4, category: state, check: "Target resource in a valid from-state for the requested transition; terminal states reject all transitions; invoice issue/payment state gates; void of already-voided; reoffer from non-PASSED; etc.", error_id: ERR_INVALID_STATE, http_status: 409, applies_to: "all action endpoints" }
  - { priority: 5, category: state, check: "Fair posture gates the operation (entries only in ENTRIES_OPEN; verify in ENTRIES_OPEN/ENTRIES_LOCKED; weigh/classify in WEIGH_IN; slot start/placings in SHOWING; lot ops in AUCTION; invoice issue/payments and premium approve/pay in SETTLEMENT)", error_id: ERR_POSTURE_FORBIDS, http_status: 409, applies_to: "posture-gated endpoints" }
  - { priority: 6, category: business_safety, check: "Disposition complete requires a latest HealthInspection with result PASS", error_id: ERR_HEALTH_HOLD, http_status: 409, applies_to: "POST /v1/dispositions/{orderId}/complete" }
  - { priority: 7, category: business_safety, check: "Entry create rejected when exhibitor is SUSPENDED", error_id: ERR_EXHIBITOR_SUSPENDED, http_status: 409, applies_to: "POST /v1/entries" }
  - { priority: 8, category: business_safety, check: "Disposition approve and premium approve require a SIGNED affidavit on the entry", error_id: ERR_AFFIDAVIT_MISSING, http_status: 409, applies_to: "POST /v1/dispositions/{orderId}/approve; POST /v1/premium-awards/{awardId}/approve" }
  - { priority: 9, category: business_safety, check: "Segregation of duties: disposition approver != creator (unless creator SYSTEM); premium payer != approver", error_id: ERR_SEGREGATION_OF_DUTIES, http_status: 403, applies_to: "POST /v1/dispositions/{orderId}/approve; POST /v1/premium-awards/{awardId}/pay" }
  - { priority: 10, category: business_temporal, check: "verify APPROVE requires ownership_acquired_at <= fair.ownership_deadline_at (inclusive)", error_id: ERR_OWNERSHIP_DEADLINE_MISSED, http_status: 422, applies_to: "POST /v1/entries/{entryId}/verify" }
  - { priority: 11, category: business_temporal, check: "verify APPROVE requires possession_start_at <= fair.possession_deadline_at (inclusive)", error_id: ERR_POSSESSION_DEADLINE_MISSED, http_status: 422, applies_to: "POST /v1/entries/{entryId}/verify" }
  - { priority: 12, category: business_temporal, check: "Ring slot create: same ring_name, half-open [starts_at, ends_at) intervals must not overlap; touching (end == start) is allowed", error_id: ERR_RING_TIME_CONFLICT, http_status: 409, applies_to: "POST /v1/ring-slots" }
  - { priority: 13, category: business_temporal, check: "Judge assignment: same judge's slots must leave a >= 15 minute gap between any two assignments (adjacency WITHOUT buffer is a conflict)", error_id: ERR_JUDGE_TIME_CONFLICT, http_status: 409, applies_to: "POST /v1/ring-slots/{slotId}/assign-judge" }
  - { priority: 14, category: business_temporal, check: "HARVEST complete requires withdrawal_end_date null or current logical time >= withdrawal_end_date (inclusive)", error_id: ERR_WITHDRAWAL_NOT_CLEARED, http_status: 409, applies_to: "POST /v1/dispositions/{orderId}/complete" }
  - { priority: 15, category: business_temporal, check: "Disposition complete requires scheduled_date null or current logical time >= scheduled_date", error_id: ERR_DISPOSITION_TOO_EARLY, http_status: 409, applies_to: "POST /v1/dispositions/{orderId}/complete" }
  - { priority: 16, category: business_constraint, check: "Well-formedness: required fields present, enum values valid, weight_lbs > 0, ends_at > starts_at, weight_max_lbs > weight_min_lbs, capacity > 0, ranks positive integers", error_id: ERR_INVALID_REQUEST, http_status: 400, applies_to: "all write endpoints" }
  - { priority: 17, category: business_constraint, check: "tag_number unique per fair", error_id: ERR_DUPLICATE_TAG, http_status: 409, applies_to: "POST /v1/entries" }
  - { priority: 18, category: business_constraint, check: "ShowClass weight ranges for same fair+species must not overlap under half-open semantics; touching ranges (max == next min) are allowed; class_code unique per fair+species", error_id: ERR_CLASS_RANGE_OVERLAP, http_status: 409, applies_to: "POST /v1/classes" }
  - { priority: 19, category: business_constraint, check: "Explicit class_id on classify must be status OPEN", error_id: ERR_CLASS_NOT_OPEN, http_status: 409, applies_to: "POST /v1/entries/{entryId}/classify" }
  - { priority: 20, category: business_constraint, check: "Target class placed_count < capacity", error_id: ERR_CLASS_CAPACITY_FULL, http_status: 409, applies_to: "POST /v1/entries/{entryId}/classify" }
  - { priority: 21, category: business_constraint, check: "Selector found no eligible class for the entry's weight/species", error_id: ERR_NO_CLASS_FOR_WEIGHT, http_status: 422, applies_to: "POST /v1/entries/{entryId}/classify" }
  - { priority: 22, category: business_constraint, check: "Assigned judge's qualified_species must include the slot class's species", error_id: ERR_JUDGE_NOT_QUALIFIED, http_status: 422, applies_to: "POST /v1/ring-slots/{slotId}/assign-judge" }
  - { priority: 23, category: business_constraint, check: "At most one GRAND_CHAMPION and one RESERVE_CHAMPION award per species per fair", error_id: ERR_CHAMPION_ALREADY_AWARDED, http_status: 409, applies_to: "POST /v1/ring-slots/{slotId}/placings" }
  - { priority: 24, category: business_constraint, check: "Placing ranks within a class must be exactly the contiguous set 1..N with no duplicates or gaps", error_id: ERR_RANK_SEQUENCE_INVALID, http_status: 422, applies_to: "POST /v1/ring-slots/{slotId}/placings" }
  - { priority: 25, category: business_constraint, check: "Placing submission must cover every entry whose class_id is the slot's class and whose status is CLASSIFIED", error_id: ERR_INCOMPLETE_PLACINGS, http_status: 422, applies_to: "POST /v1/ring-slots/{slotId}/placings" }
  - { priority: 26, category: business_constraint, check: "Reoffer allowed only while reoffer_count < 2", error_id: ERR_REOFFER_LIMIT_REACHED, http_status: 409, applies_to: "POST /v1/auction-lots/{lotId}/reoffer" }
  - { priority: 27, category: business_constraint, check: "Disposition type compatible with entry status (HARVEST: SOLD/NOT_SOLD; RETURN: SHOWN/NOT_SOLD/DISQUALIFIED); RETURN on SOLD entry and HARVEST on DISQUALIFIED entry are forbidden", error_id: ERR_DISPOSITION_NOT_ALLOWED, http_status: 409, applies_to: "POST /v1/dispositions; POST /v1/dispositions/{orderId}/approve; POST /v1/dispositions/{orderId}/complete" }
  - { priority: 28, category: business_constraint, check: "At most one Affidavit per entry", error_id: ERR_AFFIDAVIT_EXISTS, http_status: 409, applies_to: "POST /v1/affidavits" }
  - { priority: 29, category: business_referential, check: "Every placing line's entry_id must belong to the slot's class (class_id == slot.class_id) and be status CLASSIFIED", error_id: ERR_ENTRY_NOT_IN_CLASS, http_status: 422, applies_to: "POST /v1/ring-slots/{slotId}/placings" }
  - { priority: 30, category: business_referential, check: "Add-on pledge requires the referenced lot to be SOLD and not yet swept into an ISSUED invoice", error_id: ERR_LOT_NOT_SOLD, http_status: 409, applies_to: "POST /v1/add-ons" }
  - { priority: 31, category: business_fiscal, check: "buyer_exposure_check: committed_cents + hammer_price_cents <= buyer.credit_limit_cents", error_id: ERR_CREDIT_LIMIT_EXCEEDED, http_status: 422, applies_to: "POST /v1/auction-lots/{lotId}/close-sold" }
  - { priority: 32, category: business_fiscal, check: "Amounts must be positive: hammer_price_cents > 0, add-on amount_cents > 0, payment amount_cents > 0", error_id: ERR_INVALID_AMOUNT, http_status: 422, applies_to: "close-sold; POST /v1/add-ons; POST /v1/invoices/{invoiceId}/payments" }
  - { priority: 33, category: business_fiscal, check: "Payment amount_cents <= invoice balance_cents", error_id: ERR_OVERPAYMENT, http_status: 422, applies_to: "POST /v1/invoices/{invoiceId}/payments" }

# =============================================================================
# 1.0 Response Envelope (FIXED — verbatim)
# =============================================================================
response_envelope:
  success: |
    { "meta": { "api_request_id": "req_xxx", "api_request_timestamp": "ISO8601" },
      "response_type": "object" | "array", "data": {} }
  error: |
    { "meta": { ... }, "response_type": "error",
      "data": { "error_id": "ERR_XXX", "message": "..." } }
  pagination_fields: ["limit", "offset", "total_count", "has_more"]
  pagination_defaults: { limit: 10, min: 1, max: 100, offset: 0 }

# =============================================================================
# Table 5: API Endpoint Table
# GET endpoints are readable by every role; writes are role-restricted per §1.7.
# =============================================================================
endpoints:
  # --- Fair / posture / clock ---
  - { method: POST, path: "/v1/fairs", description: "Create a Fair edition with deadlines, purse, fee and schedule config", roles: [FairBoardAdmin], code: 201, input: [name, ownership_deadline_at, possession_deadline_at, premium_budget_cents, commission_rate, buyer_premium_rate, yardage_fee_cents, premium_cap_cents, "large_class_min_entries?", "large_class_bonus_rate?", premium_schedule, state_qualify_rank, sale_rank_threshold, species_sale_order], output: Fair, side_effects: ["posture=SETUP", "available_premium_pool_cents = premium_budget_cents"] }
  - { method: GET, path: "/v1/fairs/{fairId}", description: "Get a Fair (incl. posture and available_premium_pool_cents)", roles: [FairBoardAdmin, Exhibitor, WeighMaster, ShowClerk, Judge, Auctioneer, Buyer, HealthInspector, Treasurer], code: 200, input: [], output: Fair, side_effects: [] }
  - { method: POST, path: "/v1/fairs/{fairId}/advance-posture", description: "Advance posture exactly one step in canonical order; guards per Fair state machine", roles: [FairBoardAdmin], code: 200, input: [to_posture], output: Fair, side_effects: ["posture transition; increments Fair.version by 1"] }
  - { method: POST, path: "/v1/fairs/{fairId}/reopen-entries", description: "ENTRIES_LOCKED -> ENTRIES_OPEN; only before any ACTIVE weigh ticket exists", roles: [FairBoardAdmin], code: 200, input: [], output: Fair, side_effects: ["posture transition; increments Fair.version by 1"] }
  - { method: POST, path: "/v1/fairs/{fairId}/run-settlement", description: "Settlement sweep: compute final premium amounts (scaled if oversubscribed) and final exhibitor payouts", roles: [FairBoardAdmin], code: 200, input: [], output: Fair, side_effects: ["premium_award_amount final variant applied to all ACCRUED/APPROVED awards", "exhibitor_payout final variant applied to all SOLD lots", "increments Fair.version by 1"] }
  - { method: POST, path: "/_clock/set_current_utc", description: "Set the logical clock. Startup default before any call is exactly 2026-05-01T00:00:00Z; the clock never falls back to wall-clock time", roles: [FairBoardAdmin], code: 200, input: [to_iso8601], output: "{ current_utc: string }", side_effects: ["logical clock advanced/rewound to to_iso8601"] }

  # --- Exhibitor ---
  - { method: POST, path: "/v1/exhibitors", description: "Register an exhibitor", roles: [FairBoardAdmin], code: 201, input: [fair_id, full_name, organization], output: Exhibitor, side_effects: ["status=ACTIVE"] }
  - { method: GET, path: "/v1/exhibitors/{exhibitorId}", description: "Get an exhibitor", roles: [FairBoardAdmin, Exhibitor, WeighMaster, ShowClerk, Judge, Auctioneer, Buyer, HealthInspector, Treasurer], code: 200, input: [], output: Exhibitor, side_effects: [] }
  - { method: GET, path: "/v1/exhibitors", description: "List exhibitors (filter by fair)", roles: [FairBoardAdmin, Exhibitor, WeighMaster, ShowClerk, Judge, Auctioneer, Buyer, HealthInspector, Treasurer], code: 200, input: ["fair_id?", "status?"], output: "Exhibitor[]", side_effects: [] }
  - { method: POST, path: "/v1/exhibitors/{exhibitorId}/suspend", description: "Suspend an exhibitor (blocks new entries)", roles: [FairBoardAdmin], code: 200, input: [], output: Exhibitor, side_effects: ["status -> SUSPENDED"] }

  # --- AnimalEntry ---
  - { method: POST, path: "/v1/entries", description: "Create an animal entry; Exhibitor role may only create for self (exhibitor_id == X-User-ID)", roles: [FairBoardAdmin, Exhibitor], code: 201, input: [fair_id, exhibitor_id, species, tag_number, ownership_acquired_at, possession_start_at], output: AnimalEntry, side_effects: ["status=ENTERED", "official_weight_lbs=null", "class_id=null"] }
  - { method: GET, path: "/v1/entries/{entryId}", description: "Get an entry", roles: [FairBoardAdmin, Exhibitor, WeighMaster, ShowClerk, Judge, Auctioneer, Buyer, HealthInspector, Treasurer], code: 200, input: [], output: AnimalEntry, side_effects: [] }
  - { method: GET, path: "/v1/entries", description: "List entries with filters", roles: [FairBoardAdmin, Exhibitor, WeighMaster, ShowClerk, Judge, Auctioneer, Buyer, HealthInspector, Treasurer], code: 200, input: ["fair_id?", "exhibitor_id?", "class_id?", "status?", "species?"], output: "AnimalEntry[]", side_effects: [] }
  - { method: POST, path: "/v1/entries/{entryId}/verify", description: "Verify ownership/possession deadlines; decision APPROVE -> VERIFIED, REJECT -> REJECTED", roles: [FairBoardAdmin], code: 200, input: [decision, "note?"], output: AnimalEntry, side_effects: ["status transition; increments AnimalEntry.version by 1"] }
  - { method: POST, path: "/v1/entries/{entryId}/disqualify", description: "Manual disqualification with full compensation cascade", roles: [FairBoardAdmin], code: 200, input: [reason], output: AnimalEntry, side_effects: ["cascade_disqualify_entry links 1-5"] }

  # --- WeighTicket ---
  - { method: POST, path: "/v1/weigh-tickets", description: "Record a weigh-in; supersedes the entry's prior ACTIVE ticket (OCC on expected_entry_version)", roles: [WeighMaster], code: 201, input: [entry_id, weight_lbs, weighed_at, expected_entry_version, "scale_identifier?"], output: WeighTicket, side_effects: ["prior ACTIVE ticket -> VOIDED (SUPERSEDED)", "official_weight_lbs recomputed", "entry VERIFIED->WEIGHED, or CLASSIFIED->WEIGHED with class_id cleared and old class placed_count -= 1", "increments AnimalEntry.version by 1"] }
  - { method: GET, path: "/v1/weigh-tickets/{ticketId}", description: "Get a weigh ticket", roles: [FairBoardAdmin, Exhibitor, WeighMaster, ShowClerk, Judge, Auctioneer, Buyer, HealthInspector, Treasurer], code: 200, input: [], output: WeighTicket, side_effects: [] }
  - { method: GET, path: "/v1/weigh-tickets", description: "List weigh tickets (filter by entry)", roles: [FairBoardAdmin, Exhibitor, WeighMaster, ShowClerk, Judge, Auctioneer, Buyer, HealthInspector, Treasurer], code: 200, input: ["entry_id?", "status?"], output: "WeighTicket[]", side_effects: [] }
  - { method: POST, path: "/v1/weigh-tickets/{ticketId}/void", description: "Void an ACTIVE ticket (entry must be WEIGHED; reweigh uses POST /v1/weigh-tickets instead)", roles: [WeighMaster], code: 200, input: ["reason?"], output: WeighTicket, side_effects: ["status -> VOIDED", "official_weight_lbs recomputed; entry WEIGHED->VERIFIED if no ACTIVE ticket remains"] }

  # --- ShowClass / classification ---
  - { method: POST, path: "/v1/classes", description: "Create a show class with half-open [weight_min_lbs, weight_max_lbs) bracket", roles: [FairBoardAdmin], code: 201, input: [fair_id, species, class_code, weight_min_lbs, weight_max_lbs, capacity], output: ShowClass, side_effects: ["status=OPEN", "placed_count=0"] }
  - { method: GET, path: "/v1/classes/{classId}", description: "Get a class", roles: [FairBoardAdmin, Exhibitor, WeighMaster, ShowClerk, Judge, Auctioneer, Buyer, HealthInspector, Treasurer], code: 200, input: [], output: ShowClass, side_effects: [] }
  - { method: GET, path: "/v1/classes", description: "List classes", roles: [FairBoardAdmin, Exhibitor, WeighMaster, ShowClerk, Judge, Auctioneer, Buyer, HealthInspector, Treasurer], code: 200, input: ["fair_id?", "species?", "status?"], output: "ShowClass[]", side_effects: [] }
  - { method: POST, path: "/v1/entries/{entryId}/classify", description: "Place a WEIGHED entry into a class via class_weight_placement (optional explicit class_id)", roles: [ShowClerk], code: 200, input: ["class_id?"], output: AnimalEntry, side_effects: ["entry WEIGHED->CLASSIFIED", "class_id set", "target class placed_count += 1"] }

  # --- Judge / RingSlot / Placing ---
  - { method: POST, path: "/v1/judges", description: "Register a judge with species qualifications", roles: [FairBoardAdmin], code: 201, input: [fair_id, full_name, qualified_species], output: Judge, side_effects: [] }
  - { method: GET, path: "/v1/judges/{judgeId}", description: "Get a judge", roles: [FairBoardAdmin, Exhibitor, WeighMaster, ShowClerk, Judge, Auctioneer, Buyer, HealthInspector, Treasurer], code: 200, input: [], output: Judge, side_effects: [] }
  - { method: GET, path: "/v1/judges", description: "List judges", roles: [FairBoardAdmin, Exhibitor, WeighMaster, ShowClerk, Judge, Auctioneer, Buyer, HealthInspector, Treasurer], code: 200, input: ["fair_id?"], output: "Judge[]", side_effects: [] }
  - { method: POST, path: "/v1/ring-slots", description: "Schedule a class into a ring time slot; half-open ring overlap check", roles: [ShowClerk], code: 201, input: [fair_id, class_id, ring_name, starts_at, ends_at], output: RingSlot, side_effects: ["status=SCHEDULED"] }
  - { method: GET, path: "/v1/ring-slots/{slotId}", description: "Get a ring slot", roles: [FairBoardAdmin, Exhibitor, WeighMaster, ShowClerk, Judge, Auctioneer, Buyer, HealthInspector, Treasurer], code: 200, input: [], output: RingSlot, side_effects: [] }
  - { method: GET, path: "/v1/ring-slots", description: "List ring slots", roles: [FairBoardAdmin, Exhibitor, WeighMaster, ShowClerk, Judge, Auctioneer, Buyer, HealthInspector, Treasurer], code: 200, input: ["fair_id?", "class_id?", "judge_id?", "ring_name?"], output: "RingSlot[]", side_effects: [] }
  - { method: POST, path: "/v1/ring-slots/{slotId}/assign-judge", description: "Assign/reassign the slot judge (OCC on expected_ring_slot_version); qualification + 15-minute buffered conflict checks", roles: [ShowClerk], code: 200, input: [judge_id, expected_ring_slot_version], output: RingSlot, side_effects: ["judge_id set", "increments RingSlot.version by 1"] }
  - { method: POST, path: "/v1/ring-slots/{slotId}/start", description: "SCHEDULED -> IN_PROGRESS (requires judge assigned, posture SHOWING)", roles: [ShowClerk], code: 200, input: [], output: RingSlot, side_effects: ["status -> IN_PROGRESS"] }
  - { method: POST, path: "/v1/ring-slots/{slotId}/placings", description: "Judge submits the complete placing set for the slot's class (atomic: all lines valid or none recorded); caller must be the assigned judge", roles: [Judge], code: 201, input: [placings], output: "{ placing_ids: string[], premium_award_ids: string[] }", side_effects: ["Placing RECORDED rows created", "entries CLASSIFIED->SHOWN", "class OPEN->FINALIZED", "slot IN_PROGRESS->COMPLETED", "PremiumAward ACCRUED rows created (provisional variant)", "Fair.available_premium_pool_cents debited", "state_fair_qualified recomputed"] }
  - { method: GET, path: "/v1/placings/{placingId}", description: "Get a placing", roles: [FairBoardAdmin, Exhibitor, WeighMaster, ShowClerk, Judge, Auctioneer, Buyer, HealthInspector, Treasurer], code: 200, input: [], output: Placing, side_effects: [] }
  - { method: GET, path: "/v1/placings", description: "List placings", roles: [FairBoardAdmin, Exhibitor, WeighMaster, ShowClerk, Judge, Auctioneer, Buyer, HealthInspector, Treasurer], code: 200, input: ["ring_slot_id?", "class_id?", "entry_id?", "status?"], output: "Placing[]", side_effects: [] }
  - { method: POST, path: "/v1/placings/{placingId}/void", description: "Void a RECORDED placing; compensates award, pool, class and entry", roles: [Judge, FairBoardAdmin], code: 200, input: [reason], output: Placing, side_effects: ["status -> VOIDED", "its PremiumAward -> FORFEITED with pool release", "entry SHOWN -> CLASSIFIED", "state_fair_qualified recomputed to false", "class FINALIZED -> OPEN"] }

  # --- PremiumAward ---
  - { method: GET, path: "/v1/premium-awards/{awardId}", description: "Get a premium award", roles: [FairBoardAdmin, Exhibitor, WeighMaster, ShowClerk, Judge, Auctioneer, Buyer, HealthInspector, Treasurer], code: 200, input: [], output: PremiumAward, side_effects: [] }
  - { method: GET, path: "/v1/premium-awards", description: "List premium awards", roles: [FairBoardAdmin, Exhibitor, WeighMaster, ShowClerk, Judge, Auctioneer, Buyer, HealthInspector, Treasurer], code: 200, input: ["entry_id?", "placing_id?", "status?"], output: "PremiumAward[]", side_effects: [] }
  - { method: POST, path: "/v1/premium-awards/{awardId}/approve", description: "Approve an ACCRUED award (requires SETTLEMENT posture and SIGNED affidavit)", roles: [Treasurer], code: 200, input: [], output: PremiumAward, side_effects: ["status -> APPROVED", "approved_by_user_id set"] }
  - { method: POST, path: "/v1/premium-awards/{awardId}/pay", description: "Pay an APPROVED award; payer must differ from approver (segregation of duties)", roles: [Treasurer], code: 200, input: [], output: PremiumAward, side_effects: ["status -> PAID", "paid_by_user_id set"] }
  - { method: POST, path: "/v1/premium-awards/{awardId}/forfeit", description: "Forfeit an ACCRUED/APPROVED award; reservation returns to the premium pool", roles: [Treasurer], code: 200, input: [reason], output: PremiumAward, side_effects: ["status -> FORFEITED", "Fair.available_premium_pool_cents += provisional_amount_cents"] }

  # --- Buyer ---
  - { method: POST, path: "/v1/buyers", description: "Register a buyer at the sale desk; bidder_number auto-assigned per fair in created_at order", roles: [FairBoardAdmin], code: 201, input: [fair_id, business_name, credit_limit_cents], output: Buyer, side_effects: ["bidder_number assigned"] }
  - { method: GET, path: "/v1/buyers/{buyerId}", description: "Get a buyer", roles: [FairBoardAdmin, Exhibitor, WeighMaster, ShowClerk, Judge, Auctioneer, Buyer, HealthInspector, Treasurer], code: 200, input: [], output: Buyer, side_effects: [] }
  - { method: GET, path: "/v1/buyers", description: "List buyers", roles: [FairBoardAdmin, Exhibitor, WeighMaster, ShowClerk, Judge, Auctioneer, Buyer, HealthInspector, Treasurer], code: 200, input: ["fair_id?"], output: "Buyer[]", side_effects: [] }

  # --- AuctionLot ---
  - { method: POST, path: "/v1/auction-lots/generate", description: "Build the sale order: one QUEUED lot per eligible SHOWN entry, lot_number per auction_lot_ordering", roles: [Auctioneer], code: 201, input: [fair_id], output: "{ lot_ids: string[], lot_count: integer }", side_effects: ["AuctionLot rows created (QUEUED) per eligibility+ordering calc"] }
  - { method: GET, path: "/v1/auction-lots/{lotId}", description: "Get an auction lot", roles: [FairBoardAdmin, Exhibitor, WeighMaster, ShowClerk, Judge, Auctioneer, Buyer, HealthInspector, Treasurer], code: 200, input: [], output: AuctionLot, side_effects: [] }
  - { method: GET, path: "/v1/auction-lots", description: "List auction lots", roles: [FairBoardAdmin, Exhibitor, WeighMaster, ShowClerk, Judge, Auctioneer, Buyer, HealthInspector, Treasurer], code: 200, input: ["fair_id?", "entry_id?", "buyer_id?", "invoice_id?", "status?"], output: "AuctionLot[]", side_effects: [] }
  - { method: POST, path: "/v1/auction-lots/{lotId}/open", description: "Open a lot for bidding; lots must open in lot_number order", roles: [Auctioneer], code: 200, input: [], output: AuctionLot, side_effects: ["status QUEUED->OPEN"] }
  - { method: POST, path: "/v1/auction-lots/{lotId}/close-sold", description: "Record the hammer: buyer, price; fires cascade_close_sold (entry SOLD, harvest disposition auto-created, DRAFT invoice upserted, provisional payout)", roles: [Auctioneer], code: 200, input: [buyer_id, hammer_price_cents], output: AuctionLot, side_effects: ["cascade_close_sold links 1-3", "buyer_exposure_check"] }
  - { method: POST, path: "/v1/auction-lots/{lotId}/close-passed", description: "Pass an OPEN lot (no acceptable bid)", roles: [Auctioneer], code: 200, input: [], output: AuctionLot, side_effects: ["status OPEN->PASSED"] }
  - { method: POST, path: "/v1/auction-lots/{lotId}/reoffer", description: "Reopen a PASSED lot (max 2 reoffers)", roles: [Auctioneer], code: 200, input: [], output: AuctionLot, side_effects: ["status PASSED->OPEN", "reoffer_count += 1"] }
  - { method: POST, path: "/v1/auction-lots/{lotId}/no-sale", description: "Declare a PASSED lot no-sale; entry becomes NOT_SOLD", roles: [Auctioneer], code: 200, input: [], output: AuctionLot, side_effects: ["status PASSED->NO_SALE", "entry SHOWN->NOT_SOLD"] }

  # --- AddOnPledge ---
  - { method: POST, path: "/v1/add-ons", description: "Pledge an add-on donation on a SOLD lot not yet swept into an ISSUED invoice; Buyer role pledges only for self", roles: [Buyer, FairBoardAdmin], code: 201, input: [lot_id, buyer_id, amount_cents], output: AddOnPledge, side_effects: ["status=PLEDGED", "buyer DRAFT invoice totals live-recomputed"] }
  - { method: GET, path: "/v1/add-ons/{addonId}", description: "Get an add-on pledge", roles: [FairBoardAdmin, Exhibitor, WeighMaster, ShowClerk, Judge, Auctioneer, Buyer, HealthInspector, Treasurer], code: 200, input: [], output: AddOnPledge, side_effects: [] }
  - { method: GET, path: "/v1/add-ons", description: "List add-on pledges", roles: [FairBoardAdmin, Exhibitor, WeighMaster, ShowClerk, Judge, Auctioneer, Buyer, HealthInspector, Treasurer], code: 200, input: ["lot_id?", "buyer_id?", "invoice_id?", "status?"], output: "AddOnPledge[]", side_effects: [] }
  - { method: POST, path: "/v1/add-ons/{addonId}/void", description: "Void a PLEDGED add-on (before invoicing)", roles: [Buyer, FairBoardAdmin], code: 200, input: ["reason?"], output: AddOnPledge, side_effects: ["status -> VOIDED"] }

  # --- Invoice ---
  - { method: GET, path: "/v1/invoices/{invoiceId}", description: "Get an invoice (DRAFT totals are live-derived; ISSUED totals are frozen)", roles: [FairBoardAdmin, Exhibitor, WeighMaster, ShowClerk, Judge, Auctioneer, Buyer, HealthInspector, Treasurer], code: 200, input: [], output: Invoice, side_effects: [] }
  - { method: GET, path: "/v1/invoices", description: "List invoices", roles: [FairBoardAdmin, Exhibitor, WeighMaster, ShowClerk, Judge, Auctioneer, Buyer, HealthInspector, Treasurer], code: 200, input: ["fair_id?", "buyer_id?", "status?"], output: "Invoice[]", side_effects: [] }
  - { method: POST, path: "/v1/invoices/{invoiceId}/issue", description: "Issue a DRAFT invoice: sweep unswept SOLD lots + PLEDGED add-ons, freeze totals, add-ons -> INVOICED", roles: [Treasurer], code: 200, input: [], output: Invoice, side_effects: ["status DRAFT->ISSUED", "calc invoice_totals frozen", "swept lots get invoice_id", "swept add-ons PLEDGED->INVOICED"] }
  - { method: POST, path: "/v1/invoices/{invoiceId}/payments", description: "Post a payment; ISSUED->PARTIALLY_PAID->PAID; PAID cascades add-ons to PAID", roles: [Treasurer], code: 200, input: [amount_cents], output: Invoice, side_effects: ["amount_paid_cents/balance_cents recomputed", "on PAID: swept add-ons INVOICED->PAID"] }

  # --- DispositionOrder ---
  - { method: POST, path: "/v1/dispositions", description: "Request an animal disposition (HARVEST/RETURN) for a SHOWN/SOLD/NOT_SOLD/DISQUALIFIED entry; Exhibitor role only for own entries", roles: [FairBoardAdmin, Exhibitor], code: 201, input: [entry_id, disposition_type, "destination?", "scheduled_date?"], output: DispositionOrder, side_effects: ["status=REQUESTED", "created_by_user_id = X-User-ID"] }
  - { method: GET, path: "/v1/dispositions/{orderId}", description: "Get a disposition order", roles: [FairBoardAdmin, Exhibitor, WeighMaster, ShowClerk, Judge, Auctioneer, Buyer, HealthInspector, Treasurer], code: 200, input: [], output: DispositionOrder, side_effects: [] }
  - { method: GET, path: "/v1/dispositions", description: "List disposition orders", roles: [FairBoardAdmin, Exhibitor, WeighMaster, ShowClerk, Judge, Auctioneer, Buyer, HealthInspector, Treasurer], code: 200, input: ["entry_id?", "status?"], output: "DispositionOrder[]", side_effects: [] }
  - { method: POST, path: "/v1/dispositions/{orderId}/approve", description: "Approve a REQUESTED order; approver must differ from creator (unless SYSTEM-created); requires SIGNED affidavit", roles: [FairBoardAdmin], code: 200, input: [], output: DispositionOrder, side_effects: ["status -> APPROVED", "approved_by_user_id set"] }
  - { method: POST, path: "/v1/dispositions/{orderId}/reject", description: "Reject a REQUESTED order", roles: [FairBoardAdmin], code: 200, input: [reason], output: DispositionOrder, side_effects: ["status -> REJECTED"] }
  - { method: POST, path: "/v1/dispositions/{orderId}/complete", description: "Complete an APPROVED order after health PASS, withdrawal clearance and scheduled date; entry SOLD/NOT_SOLD -> CLEARED", roles: [FairBoardAdmin], code: 200, input: [], output: DispositionOrder, side_effects: ["status -> COMPLETED", "entry -> CLEARED when SOLD/NOT_SOLD"] }

  # --- HealthInspection / Affidavit ---
  - { method: POST, path: "/v1/health-inspections", description: "Record a health inspection; FAIL auto-disqualifies the entry (cascade_disqualify_entry)", roles: [HealthInspector], code: 201, input: [entry_id, result, "notes?"], output: HealthInspection, side_effects: ["on FAIL: cascade_disqualify_entry", "immutable record"] }
  - { method: GET, path: "/v1/health-inspections/{inspectionId}", description: "Get a health inspection", roles: [FairBoardAdmin, Exhibitor, WeighMaster, ShowClerk, Judge, Auctioneer, Buyer, HealthInspector, Treasurer], code: 200, input: [], output: HealthInspection, side_effects: [] }
  - { method: GET, path: "/v1/health-inspections", description: "List health inspections (filter by entry)", roles: [FairBoardAdmin, Exhibitor, WeighMaster, ShowClerk, Judge, Auctioneer, Buyer, HealthInspector, Treasurer], code: 200, input: ["entry_id?", "result?"], output: "HealthInspection[]", side_effects: [] }
  - { method: POST, path: "/v1/affidavits", description: "Sign the drug-free affidavit for an entry (one per entry); Exhibitor role signs only own entries", roles: [Exhibitor, FairBoardAdmin], code: 201, input: [entry_id, "withdrawal_end_date?"], output: Affidavit, side_effects: ["status=SIGNED", "signed_at = logical clock", "exhibitor_id denormalized from entry"] }
  - { method: GET, path: "/v1/affidavits/{affidavitId}", description: "Get an affidavit", roles: [FairBoardAdmin, Exhibitor, WeighMaster, ShowClerk, Judge, Auctioneer, Buyer, HealthInspector, Treasurer], code: 200, input: [], output: Affidavit, side_effects: [] }
  - { method: GET, path: "/v1/affidavits", description: "List affidavits", roles: [FairBoardAdmin, Exhibitor, WeighMaster, ShowClerk, Judge, Auctioneer, Buyer, HealthInspector, Treasurer], code: 200, input: ["entry_id?", "exhibitor_id?", "status?"], output: "Affidavit[]", side_effects: [] }
  - { method: POST, path: "/v1/affidavits/{affidavitId}/revoke", description: "Revoke a SIGNED affidavit; triggers cascade_disqualify_entry", roles: [HealthInspector], code: 200, input: [reason], output: Affidavit, side_effects: ["status -> REVOKED", "cascade_disqualify_entry links 1-5"] }

# =============================================================================
# Table 6: Error Code Catalog
# =============================================================================
errors:
  - { id: ERR_UNAUTHENTICATED, http: 401, condition: "Missing/invalid X-User-Role or X-User-ID headers" }
  - { id: ERR_FORBIDDEN, http: 403, condition: "Role not permitted for endpoint, or entity-backed ownership mismatch (Exhibitor/Buyer acting on another's resources)" }
  - { id: ERR_NOT_ASSIGNED_JUDGE, http: 403, condition: "Judge submitting/voiding placings for a slot whose judge_id != X-User-ID" }
  - { id: ERR_NOT_FOUND, http: 404, condition: "Path or body-referenced resource id does not exist" }
  - { id: ERR_INVALID_REQUEST, http: 400, condition: "Missing required field, invalid enum, or malformed value (weight_lbs <= 0, ends_at <= starts_at, weight_max_lbs <= weight_min_lbs, capacity <= 0, bad rank)" }
  - { id: ERR_INVALID_STATE, http: 409, condition: "Resource in wrong state for the requested transition; includes terminal lockdown, non-adjacent posture advance, settlement/close guards, reoffer from non-PASSED, double issue/void, lot opened out of lot_number order, disqualify of SOLD/CLEARED/REJECTED/DISQUALIFIED entry" }
  - { id: ERR_STALE_VERSION, http: 412, condition: "OCC: expected_<parent>_version does not match the parent entity's current version (weigh-ticket supersede, judge assignment)" }
  - { id: ERR_POSTURE_FORBIDS, http: 409, condition: "Fair posture does not permit the operation (e.g. entry create outside ENTRIES_OPEN, weigh-in outside WEIGH_IN, lot ops outside AUCTION, settlement ops outside SETTLEMENT)" }
  - { id: ERR_OWNERSHIP_DEADLINE_MISSED, http: 422, condition: "verify APPROVE with ownership_acquired_at > fair.ownership_deadline_at" }
  - { id: ERR_POSSESSION_DEADLINE_MISSED, http: 422, condition: "verify APPROVE with possession_start_at > fair.possession_deadline_at" }
  - { id: ERR_DUPLICATE_TAG, http: 409, condition: "tag_number already used by another entry of the same fair" }
  - { id: ERR_EXHIBITOR_SUSPENDED, http: 409, condition: "Entry creation by/for a SUSPENDED exhibitor" }
  - { id: ERR_NO_CLASS_FOR_WEIGHT, http: 422, condition: "No OPEN class of the entry's species contains official_weight_lbs in [min, max), or explicit class_id weight/species mismatch" }
  - { id: ERR_CLASS_RANGE_OVERLAP, http: 409, condition: "New class weight range overlaps an existing class of the same fair+species (touching boundaries allowed), or class_code duplicated within fair+species" }
  - { id: ERR_CLASS_NOT_OPEN, http: 409, condition: "Explicit class_id on classify targets a FINALIZED class" }
  - { id: ERR_CLASS_CAPACITY_FULL, http: 409, condition: "Target class placed_count == capacity" }
  - { id: ERR_RING_TIME_CONFLICT, http: 409, condition: "New slot overlaps an existing slot in the same ring (half-open [start, end); touching allowed)" }
  - { id: ERR_JUDGE_TIME_CONFLICT, http: 409, condition: "Judge already assigned to a slot with < 15 minute gap between the intervals (buffered adjacency is a conflict)" }
  - { id: ERR_JUDGE_NOT_QUALIFIED, http: 422, condition: "Judge's qualified_species does not include the slot class's species" }
  - { id: ERR_ENTRY_NOT_IN_CLASS, http: 422, condition: "Placing line references an entry whose class_id != slot's class or whose status != CLASSIFIED" }
  - { id: ERR_RANK_SEQUENCE_INVALID, http: 422, condition: "Ranks in a placing submission are not exactly the contiguous set 1..N" }
  - { id: ERR_INCOMPLETE_PLACINGS, http: 422, condition: "Placing submission omits a CLASSIFIED entry of the slot's class" }
  - { id: ERR_CHAMPION_ALREADY_AWARDED, http: 409, condition: "Second GRAND_CHAMPION or RESERVE_CHAMPION award for the same species in the same fair" }
  - { id: ERR_CREDIT_LIMIT_EXCEEDED, http: 422, condition: "close-sold would push buyer committed_cents above credit_limit_cents" }
  - { id: ERR_LOT_NOT_SOLD, http: 409, condition: "Add-on pledge on a lot whose status != SOLD, or whose invoice has already been ISSUED" }
  - { id: ERR_INVALID_AMOUNT, http: 422, condition: "hammer_price_cents, add-on amount_cents, or payment amount_cents <= 0" }
  - { id: ERR_OVERPAYMENT, http: 422, condition: "Payment amount_cents exceeds invoice balance_cents" }
  - { id: ERR_REOFFER_LIMIT_REACHED, http: 409, condition: "Reoffer attempted with reoffer_count == 2" }
  - { id: ERR_DISPOSITION_NOT_ALLOWED, http: 409, condition: "Disposition type incompatible with entry status (RETURN on SOLD; HARVEST on DISQUALIFIED; disposition on pre-SHOWN entry)" }
  - { id: ERR_AFFIDAVIT_EXISTS, http: 409, condition: "Second affidavit for the same entry" }
  - { id: ERR_AFFIDAVIT_MISSING, http: 409, condition: "Disposition approve or premium approve without a SIGNED affidavit on the entry" }
  - { id: ERR_HEALTH_HOLD, http: 409, condition: "Disposition complete without a latest HealthInspection result of PASS (none, QUARANTINE, or FAIL latest)" }
  - { id: ERR_WITHDRAWAL_NOT_CLEARED, http: 409, condition: "HARVEST complete before affidavit.withdrawal_end_date (current logical time strictly earlier)" }
  - { id: ERR_DISPOSITION_TOO_EARLY, http: 409, condition: "Disposition complete before scheduled_date" }
  - { id: ERR_SEGREGATION_OF_DUTIES, http: 403, condition: "Same X-User-ID attempting both maker and checker steps (disposition create/approve; premium approve/pay)" }

# =============================================================================
# Table 7: RBAC Matrix
# =============================================================================
roles:
  - name: FairBoardAdmin
    description: "County fair board administrator; configures the fair, advances posture, verifies entries, schedules nothing (that is the clerk), approves/rejects/completes dispositions as checker"
    identity: opaque
    exclusive_operations:
      - "POST /v1/fairs, /advance-posture, /reopen-entries, /run-settlement"
      - "POST /v1/exhibitors, /v1/exhibitors/{id}/suspend, /v1/buyers"
      - "POST /v1/entries/{id}/verify, /v1/entries/{id}/disqualify"
      - "POST /v1/classes, /v1/judges"
      - "POST /v1/dispositions/{id}/approve, /reject, /complete"
      - "POST /_clock/set_current_utc"
    shared_operations:
      - "POST /v1/entries, /v1/dispositions, /v1/affidavits, /v1/add-ons (with ownership rules where applicable)"
      - "POST /v1/placings/{id}/void"
      - "All GET endpoints"
  - name: Exhibitor
    description: "Youth exhibitor; owns entries, signs affidavits, requests dispositions for own animals"
    identity: "entity_backed:Exhibitor"
    exclusive_operations: []
    shared_operations:
      - "POST /v1/entries (exhibitor_id must equal X-User-ID)"
      - "POST /v1/affidavits (entry must belong to X-User-ID)"
      - "POST /v1/dispositions (entry must belong to X-User-ID)"
      - "All GET endpoints"
  - name: WeighMaster
    description: "Scale official; records and voids weigh tickets"
    identity: opaque
    exclusive_operations:
      - "POST /v1/weigh-tickets, /v1/weigh-tickets/{id}/void"
    shared_operations: ["All GET endpoints"]
  - name: ShowClerk
    description: "Show office clerk; classifies entries, schedules rings, assigns judges, starts slots"
    identity: opaque
    exclusive_operations:
      - "POST /v1/entries/{id}/classify"
      - "POST /v1/ring-slots, /v1/ring-slots/{id}/assign-judge, /v1/ring-slots/{id}/start"
    shared_operations: ["All GET endpoints"]
  - name: Judge
    description: "Species-qualified judge; submits and voids placings only for slots where judge_id == X-User-ID"
    identity: "entity_backed:Judge"
    exclusive_operations:
      - "POST /v1/ring-slots/{id}/placings (assigned judge only)"
    shared_operations:
      - "POST /v1/placings/{id}/void (assigned judge of that slot, or FairBoardAdmin)"
      - "All GET endpoints"
  - name: Auctioneer
    description: "Sale auctioneer; generates sale order, opens/closes/reoffers lots"
    identity: opaque
    exclusive_operations:
      - "POST /v1/auction-lots/generate, /open, /close-sold, /close-passed, /reoffer, /no-sale"
    shared_operations: ["All GET endpoints"]
  - name: Buyer
    description: "Registered buyer; pledges add-on donations for self"
    identity: "entity_backed:Buyer"
    exclusive_operations: []
    shared_operations:
      - "POST /v1/add-ons, /v1/add-ons/{id}/void (buyer_id must equal X-User-ID)"
      - "All GET endpoints"
  - name: HealthInspector
    description: "Official veterinarian; records health inspections, revokes drug-free affidavits"
    identity: opaque
    exclusive_operations:
      - "POST /v1/health-inspections"
      - "POST /v1/affidavits/{id}/revoke"
    shared_operations: ["All GET endpoints"]
  - name: Treasurer
    description: "Fair treasurer; approves/pays/forfeits premiums and issues/collects invoices; segregation of duties enforced on X-User-ID"
    identity: opaque
    exclusive_operations:
      - "POST /v1/premium-awards/{id}/approve, /pay, /forfeit"
      - "POST /v1/invoices/{id}/issue, /payments"
    shared_operations: ["All GET endpoints"]
