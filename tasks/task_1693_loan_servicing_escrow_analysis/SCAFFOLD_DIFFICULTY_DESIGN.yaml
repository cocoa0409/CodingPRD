            - { call: "POST /servicing/escrow-accounts/${acct_id}/activate", payload: {}, as: EscrowAnalyst, as_user_id: "ea_1" }
            - { call: "POST /servicing/loans/${loan_id}/activate", payload: {}, as: ComplianceOfficer, as_user_id: "co_1" }
            - { call: "POST /servicing/escrow-accounts/${acct_id}/deposits", payload: { amount_cents: 50000, effective_date: "2026-08-05" }, as: EscrowAnalyst, as_user_id: "ea_1" }
            - { call: "POST /servicing/escrow-accounts/${acct_id}/disbursements", payload: { line_item_id: "${li_id}", payee_id: "${pay_id}", amount_cents: 70000, due_date: "2026-08-20", scheduled_release_date: "2026-08-10" }, as: DisbursementProcessor, as_user_id: "dp_1", captures: { disb_id: $.data.id } }
            - { call: "POST /_clock/set_current_utc", payload: { to_iso8601: "2026-08-10T00:00:00Z" }, as: ComplianceOfficer, as_user_id: "co_1" }
          trigger:
