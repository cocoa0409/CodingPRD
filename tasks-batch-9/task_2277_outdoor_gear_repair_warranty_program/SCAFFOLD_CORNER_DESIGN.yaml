      - name: surge_window_retired_by_queue_review_after_end_date
        claim_type: side_effect_execution
        grounds:
          - state_machines[SurgeWindow]
          - entities.SurgeWindow.fields.status
          - endpoints[POST /gear-service/service-centers/{id}/queue-review]
        distinguishing_aspect: "SurgeWindow.status is not time-derived on read: the window stays ACTIVE after its end_date until a queue-review observes it, and only then flips to RETIRED and drops current_surge_multiplier back to 1.00."
        test_recipe:
          setup: ["clock 2026-06-15T09:00:00Z with an ACTIVE window 2026-06-20..2026-06-30 at 1.50, then the clock is advanced to 2026-07-05T09:00:00Z"]
          setup_api_calls:
            - call: "POST /gear-service/_clock/set_current_utc"
              payload: { current_utc: "2026-06-15T09:00:00Z" }
              as: ProgramAdmin
            - call: "POST /gear-service/service-centers"
              payload: { name: "Cascade Service Hub", region_code: "US-OR", liability_cap_cents: 5000000 }
              as: ProgramAdmin
              captures: { sc_id: $.data.id }
            - call: "POST /gear-service/service-centers/${sc_id}/surge-windows"
              payload: { label: "Summer peak", start_date: "2026-06-20T00:00:00Z", end_date: "2026-06-30T23:59:59Z", multiplier: 1.50 }
              as: ProgramAdmin
              captures: { sw_id: $.data.id }
            - call: "POST /gear-service/_clock/set_current_utc"
              payload: { current_utc: "2026-07-05T09:00:00Z" }
              as: ProgramAdmin
          trigger:
            - call: "GET /gear-service/service-centers/${sc_id}/surge-windows"
              payload: { status: "ACTIVE" }
              as: ProgramAdmin
            - call: "POST /gear-service/service-centers/${sc_id}/queue-review"
              payload: {}
              as: ProgramAdmin
            - call: "GET /gear-service/service-centers/${sc_id}/surge-windows"
              payload: { status: "RETIRED" }
              as: ProgramAdmin
          assert:
            - "the first list (before the review) returns 1 row: SurgeWindow.${sw_id}.status == ACTIVE even though end_date < clock now"
            - "the queue-review answers 200 and SurgeWindow.${sw_id}.status == RETIRED"
            - "the second list returns exactly 1 row (${sw_id}) and the ACTIVE filter would now return 0"
            - "ServiceCenter.${sc_id}.current_surge_multiplier == 1.00, active_queue_depth == 0, last_queue_review_at == 2026-07-05T09:00:00Z"

