# =============================================================================
# SCAFFOLD.yaml — task_3077_electronic_mortgage_registry_membership_transfer_reporting
# Electronic Mortgage Registry Membership & Transfer Reporting (MERS-like)
# Sections 1.0–1.7. Difficulty design (§1.8) and corner design (§1.9) live in
# sibling files SCAFFOLD_DIFFICULTY_DESIGN.yaml / SCAFFOLD_CORNER_DESIGN.yaml.
# =============================================================================

scenario: |
  Electronic Mortgage Registry Membership & Transfer Reporting (MERS): member
  registration with organizational identifiers and authorized signer
  designation, registration of loans on the registry at closing with a mortgage
  identification number, transfer of beneficial and servicing rights reported
  within required timeframes with reconciliation of unmatched transfers,
  quality assurance reviews and annual reporting with sanctions for data
  discrepancies, foreclosure handling requiring assignment out of the registry
  in certain jurisdictions, membership termination with deactivation of
  registered loans, borrower inquiry servicing to identify the current investor
  and servicer, system-of-record reconciliation against servicing platforms.

domain_name: electronic-mortgage-registry
api_prefix: /registry

complexity_profile:
  primary_archetype: compliance_audit
  secondary_archetype: ledger_reconciliation
  complexity_layers:
    - cascading_side_effects
    - derived_field_reconciliation
    - dual_variant_calculation
    - optimistic_concurrency
  entity_topology: flat
  state_machine_shape: branching
  relationship_patterns:
    - one_to_many
    - self_referential
  role_model: segregation_of_duties
  consistency_model: immediate

# =============================================================================
# §1.0 Response Envelope (FIXED — verbatim)
# =============================================================================
response_envelope:
  success: |
    { "meta": { "api_request_id": "req_xxx", "api_request_timestamp": "ISO8601" },
      "response_type": "object" | "array", "data": {} }
  error: |
    { "meta": { ... }, "response_type": "error",
      "data": { "error_id": "ERR_XXX", "message": "..." } }
  pagination_fields: ["limit", "offset", "total_count", "has_more"]
  pagination_defaults: { limit: 10, min: 1, max: 100, offset: 0 }

# =============================================================================
# §1.1 Entity-Relationship Table (11 entities)
# =============================================================================
entities:
  - name: Member
    parent: null
    common_fields: true
    fields:
      - name: legal_name
        type: string
        source: input
        description: "Legal name of the member organization"
      - name: org_id
        type: string
        source: input
        description: "7-digit organizational identifier assigned by the operator; unique among all members ever registered (incl. terminated)"
        constraints: "string of exactly 7 digits; globally unique (incl. TERMINATED members) -> ERR_DUPLICATE_ORG_ID"
      - name: org_id_type
        type: enum
        source: input
        description: "Kind of organizational identifier"
        constraints: "enum {TAX_ID, CHARTER_NUMBER, LEI}"
      - name: member_type
        type: enum
        source: input
        description: "Business type of the member"
        constraints: "enum {ORIGINATOR, SERVICER, INVESTOR, SUBSERVICER, CUSTODIAN}"
      - name: termination_effective_date
        type: datetime
        source: system
        default: null
        description: "Logical timestamp at which termination takes effect; null until a termination request is accepted"
      - name: status
        type: enum
        source: system
        description: "Membership lifecycle"
        constraints: "enum {PENDING_ACTIVATION, ACTIVE, SUSPENDED, TERMINATION_PENDING, TERMINATED}; initial PENDING_ACTIVATION"

  - name: AuthorizedSigner
    parent: null
    common_fields: true
    fields:
      - name: member_id
        type: string
        source: input
        description: "FK -> Member.id; the member this signer may act for"
      - name: full_name
        type: string
        source: input
        description: "Signer full legal name"
      - name: email
        type: string
        source: input
        description: "Signer contact email"
      - name: effective_from
        type: datetime
        source: input
        description: "Inclusive start of authority window (ISO 8601 UTC)"
      - name: effective_until
        type: datetime
        source: input
        default: null
        description: "Exclusive end of authority window; null means open-ended; when present must be strictly greater than effective_from -> ERR_INVALID_SIGNER_WINDOW"
      - name: role_scope
        type: enum
        source: input
        description: "Which sensitive operations this signer may perform"
        constraints: "enum {REGISTRATION, TRANSFER, FORECLOSURE, ALL}"
      - name: status
        type: enum
        source: system
        description: "ACTIVE on creation; REVOKED on revocation"
        constraints: "enum {ACTIVE, REVOKED}"

  - name: RegisteredLoan
    parent: null
    common_fields: true
    fields:
      - name: min
        type: string
        source: system
        description: "18-digit Mortgage Identification Number = 7-digit member org_id + 10-digit zero-padded serial + 1 check digit (Luhn, weights 2/1 alternating from the right, doubled digits >9 reduced by subtracting 9); unique across all loans"
        constraints: "18 digits; final digit is the Luhn check digit over the first 17"
      - name: serial
        type: integer
        source: system
        description: "Per-registering-member sequence number; starts at 1 and increments per successful registration by that member; never reused, survives member termination"
      - name: registering_member_id
        type: string
        source: system
        description: "FK -> Member.id; the ACTIVE member that registered the loan"
      - name: loan_amount_cents
        type: integer
        source: input
        description: "Original principal in cents"
        constraints: "positive integer"
      - name: property_state
        type: string
        source: input
        description: "US state code of the property (2 uppercase letters)"
      - name: closing_date
        type: datetime
        source: input
        description: "Closing timestamp; must be on or before the current logical clock -> ERR_CLOSING_DATE_IN_FUTURE"
      - name: foreclosure_mode
        type: enum
        source: system
        description: "Derived from property_state at registration: ASSIGN_OUT_REQUIRED for states {NY, CA}, else IN_REGISTRY_ALLOWED"
        constraints: "enum {ASSIGN_OUT_REQUIRED, IN_REGISTRY_ALLOWED}"
      - name: current_investor_id
        type: string
        source: system
        description: "FK -> Member.id; holder of beneficial rights; set to registering member at registration"
      - name: current_servicer_id
        type: string
        source: system
        description: "FK -> Member.id; holder of servicing rights; set to registering member at registration"
      - name: status
        type: enum
        source: system
        description: "Loan registry lifecycle; ACTIVE -> FORECLOSING -> ACTIVE allowed (rescind loop), terminal states exit the registry"
        constraints: "enum {ACTIVE, FORECLOSING, INACTIVE_ASSIGNED_OUT, INACTIVE_TERMINATED, INACTIVE_SATISFIED}"
      - name: assigned_out_at
        type: datetime
        source: system
        default: null
        description: "Logical timestamp when the loan was assigned out of the registry for foreclosure; null otherwise"

  - name: Transfer
    parent: null
    common_fields: true
    fields:
      - name: loan_id
        type: string
        source: input
        description: "FK -> RegisteredLoan.id; loan whose rights move"
      - name: from_member_id
        type: string
        source: system
        description: "FK -> Member.id; derived server-side from the loan's current holder of the transferred right type; client-supplied from_member_id is ignored"
      - name: to_member_id
        type: string
        source: input
        description: "FK -> Member.id; receiving member (must be ACTIVE and distinct from the right's current holder)"
      - name: transfer_type
        type: enum
        source: input
        description: "Which rights move; BOTH requires from-member to currently hold both rights on the loan"
        constraints: "enum {BENEFICIAL, SERVICING, BOTH}"
      - name: effective_date
        type: datetime
        source: input
        description: "When the transfer legally occurred; must be on or before the logical clock; drives the timeliness calculation"
      - name: idempotency_key
        type: string
        source: input
        description: "Client-supplied key; uniqueness enforced only among transfers with status != REJECTED -> ERR_DUPLICATE_IDEMPOTENCY_KEY"
      - name: expected_loan_version
        type: integer
        source: input
        description: "OCC guard on RegisteredLoan.version; mismatch -> ERR_STALE_LOAN_VERSION (412)"
      - name: days_late
        type: integer
        source: computed
        description: "max(0, calendar_day_floor(clock_now) - calendar_day_floor(effective_date) - TRANSFER_WINDOW_DAYS)"
      - name: late_fee_cents
        type: integer
        source: computed
        description: "Marginal day-tiered late fee on days_late (see transfer_late_fee calculation)"
      - name: status
        type: enum
        source: system
        description: "CONFIRMED on accept; REJECTED if the from-side rejects the pending match"
        constraints: "enum {CONFIRMED, REJECTED}"

  - name: TransferMatch
    parent: null
    common_fields: true
    fields:
      - name: transfer_id
        type: string
        source: input
        description: "FK -> Transfer.id; the CONFIRMED transfer this report refers to"
      - name: reported_by_member_id
        type: string
        source: system
        description: "FK -> Member.id; the submitting member (X-User-ID)"
      - name: reported_at
        type: datetime
        source: system
        description: "Logical clock timestamp of the report"
      - name: status
        type: enum
        source: system
        description: "MATCHED / PENDING / EXPIRED when reporting from-side; WAIVED when the transfer is intra-org"
        constraints: "enum {MATCHED, PENDING, EXPIRED, WAIVED}"

  - name: QAReview
    parent: null
    common_fields: true
    fields:
      - name: member_id
        type: string
        source: input
        description: "FK -> Member.id; member under review"
      - name: period_start
        type: datetime
        source: input
        description: "Inclusive start of review period"
      - name: period_end
        type: datetime
        source: input
        description: "Inclusive end of review period; must be >= period_start -> ERR_INVALID_PERIOD"
      - name: sample_size
        type: integer
        source: computed
        description: "Count of loans ever registered by member_id (any status), sampled in registration order (serial ASC)"
      - name: discrepancy_score
        type: number
        source: computed
        description: "Weighted discrepancy rate in [0,1], 4 decimal places, round_half_up; see qa_discrepancy_score"
      - name: status
        type: enum
        source: system
        description: "DRAFT -> FINDINGS_ISSUED -> SETTLED; corrective re-review loop FINDINGS_ISSUED -> DRAFT"
        constraints: "enum {DRAFT, FINDINGS_ISSUED, SETTLED}"
      - name: created_by
        type: string
        source: system
        description: "X-User-ID of the QAAuditor who created the review; drives segregation-of-duties on settle"
      - name: settled_by
        type: string
        source: system
        default: null
        description: "X-User-ID of the QAAuditor who settled the review; drives segregation-of-duties on sanction adjudication"
      - name: settled_at
        type: datetime
        source: system
        default: null
        description: "Logical timestamp of settle; used for latest-settled-review selection"

  - name: QAFinding
    parent: QAReview
    common_fields: true
    fields:
      - name: review_id
        type: string
        source: system
        description: "FK -> QAReview.id (path parent)"
      - name: loan_id
        type: string
        source: input
        description: "FK -> RegisteredLoan.id; the sampled loan with the discrepancy"
      - name: field_name
        type: string
        source: input
        description: "Which loan field was wrong"
        constraints: "enum {MIN, CURRENT_SERVICER, CURRENT_INVESTOR, PROPERTY_STATE, CLOSING_DATE}"
      - name: expected_value
        type: string
        source: input
        description: "Value the field should hold"
      - name: actual_value
        type: string
        source: input
        description: "Value found on the registry"
      - name: severity
        type: enum
        source: input
        description: "Finding severity driving weights and sanction bases"
        constraints: "enum {CRITICAL, MAJOR, MINOR}"

  - name: AnnualReport
    parent: null
    common_fields: true
    fields:
      - name: member_id
        type: string
        source: input
        description: "FK -> Member.id; member being reported"
      - name: report_year
        type: integer
        source: input
        description: "Calendar year covered; (member_id, report_year) unique among non-VOID reports -> ERR_DUPLICATE_ANNUAL_REPORT"
      - name: reporting_rate
        type: number
        source: computed
        description: "Count-based on-time transfer rate, 4dp round_half_up; 1.0 when zero CONFIRMED transfers (vacuous)"
      - name: reporting_rate_amount_weighted
        type: number
        source: computed
        description: "Amount-weighted on-time transfer rate (loan_amount_cents weights), 4dp round_half_up; 1.0 when zero CONFIRMED transfers; published alongside reporting_rate"
      - name: discrepancy_rate
        type: number
        source: computed
        description: "discrepancy_score of the latest SETTLED QA review for the member (by settled_at, tie -> created_at ASC), else 0.0"
      - name: open_exceptions
        type: integer
        source: computed
        description: "Count of this member's TransferMatch rows with status PENDING or EXPIRED at generation"
      - name: standing_score
        type: number
        source: computed
        description: "Composite 0–100 score (see member_standing_score); drives derived standing_band"
      - name: standing_band
        type: enum
        source: computed
        description: "Derived: GOOD_STANDING if score >= 80; else PROBATION if >= 60; else DISENGAGEMENT_ELIGIBLE"
        constraints: "enum {GOOD_STANDING, PROBATION, DISENGAGEMENT_ELIGIBLE}"
      - name: status
        type: enum
        source: system
        description: "FINAL on generation; VOID if superseded by a regeneration for the same (member, year)"
        constraints: "enum {FINAL, VOID}"

  - name: Sanction
    parent: null
    common_fields: true
    fields:
      - name: member_id
        type: string
        source: system
        description: "FK -> Member.id; sanctioned member (from the review)"
      - name: review_id
        type: string
        source: system
        description: "FK -> QAReview.id; exactly one sanction per settled review"
      - name: abatement_factor
        type: number
        source: input
        description: "Multiplier in [0,1]; 1.0 when omitted (no abatement)"
        default: 1.0
        constraints: "0 <= abatement_factor <= 1 -> ERR_INVALID_ABATEMENT_FACTOR"
      - name: total_amount_cents
        type: integer
        source: computed
        description: "Sum over findings of round_half_up(base(severity) * repeat_multiplier * abatement_factor); per-line rounding pinned (see sanction_assessment)"
      - name: line_count
        type: integer
        source: computed
        description: "Number of findings assessed"
      - name: status
        type: enum
        source: system
        description: "ASSESSED -> APPEALED -> UPHELD | REDUCED | VACATED; also ASSESSED -> PAID"
        constraints: "enum {ASSESSED, APPEALED, UPHELD, REDUCED, VACATED, PAID}"

  - name: SORReconciliationRun
    parent: null
    common_fields: true
    fields:
      - name: member_id
      # (continued)
        type: string
        source: input
        description: "FK -> Member.id; member whose servicing platform records are reconciled"
      - name: total_records
        type: integer
        source: computed
        description: "Number of submitted platform records"
      - name: matched_count
        type: integer
        source: computed
        description: "Records whose MIN exists and whose servicer/investor agree with the registry"
      - name: registry_only_count
        type: integer
        source: computed
        description: "Loans ACTIVE or FORECLOSING on the registry for this member's portfolio that appear in no submitted record"
      - name: platform_only_count
        type: integer
        source: computed
        description: "Submitted records whose MIN is unknown to the registry"
      - name: field_mismatch_count
        type: integer
        source: computed
        description: "Records whose MIN exists but servicer or investor differs"
      - name: match_rate
        type: number
        source: computed
        description: "matched_count / max(1, total_records + registry_only_count), 4dp round_half_up"
      - name: status
        type: enum
        source: system
        description: "OPEN on submission; COMPLETED once exceptions resolved; CANCELLED when run while another run for the same member is OPEN (that older run gets cancelled instead — see transitions)"
        constraints: "enum {OPEN, COMPLETED, CANCELLED}"

  - name: SORException
    parent: null
    common_fields: true
    fields:
      - name: run_id
        type: string
        source: system
        description: "FK -> SORReconciliationRun.id; generating run"
      - name: loan_id
        type: string
        source: system
        description: "FK -> RegisteredLoan.id; null only for PLATFORM_ONLY exceptions"
      - name: exception_type
        type: enum
        source: system
        description: "REGISTRY_ONLY (registry loan absent from platform records) | PLATFORM_ONLY (unknown MIN) | FIELD_MISMATCH (servicer/investor disagree)"
        constraints: "enum {REGISTRY_ONLY, PLATFORM_ONLY, FIELD_MISMATCH}"
      - name: detail
        type: string
        source: system
        description: "Human-readable difference summary"
      - name: status
        type: enum
        source: system
        description: "OPEN -> RESOLVED; resolving the last OPEN exception completes the parent run"
        constraints: "enum {OPEN, RESOLVED}"

# =============================================================================
# §1.2 State Machine Table
# =============================================================================
state_machines:
  - entity: Member
    initial_state: PENDING_ACTIVATION
    terminal_states: [TERMINATED]
    transitions:
      - from: PENDING_ACTIVATION
        to: ACTIVE
        trigger: "POST /registry/members/{memberId}/activate"
        actor: RegistryAdmin
        preconditions:
          - "Member has at least one AuthorizedSigner with status == ACTIVE (ERR_NO_AUTHORIZED_SIGNER)"
        side_effects: []

      - from: ACTIVE
        to: SUSPENDED
        trigger: "POST /registry/members/{memberId}/suspend"
        actor: RegistryAdmin
        preconditions: []
        side_effects: []

      - from: SUSPENDED
        to: ACTIVE
        trigger: "POST /registry/members/{memberId}/reinstate"
        actor: RegistryAdmin
        preconditions:
          - "Member has at least one AuthorizedSigner with status == ACTIVE (ERR_NO_AUTHORIZED_SIGNER)"
        side_effects: []

      - from: ACTIVE
        to: TERMINATION_PENDING
        trigger: "POST /registry/members/{memberId}/terminate with effective_date on or before the logical clock"
        actor: RegistryAdmin
        preconditions:
          - "Member holds no right on any loan: no RegisteredLoan (any status) has current_investor_id == member or current_servicer_id == member (ERR_MEMBER_HOLDS_ACTIVE_RIGHTS)"
          - "Member has no TransferMatch with status == PENDING (ERR_OPEN_TRANSFER_MATCHES)"
        side_effects:
          - "Hop 1: every RegisteredLoan with registering_member_id == member and status == ACTIVE transitions to INACTIVE_TERMINATED (member's own un-transferred portfolio deactivates)"
          - "Hop 2: each loan flipped by hop 1 generates a REGISTRY_ONLY SORException on the member's currently OPEN SORReconciliationRun (if one exists)"
          - "Hop 3: if that run's exception counts changed and it now has zero OPEN exceptions it remains OPEN (termination never auto-completes a run)"

      - from: TERMINATION_PENDING
        to: TERMINATED
        trigger: "system (automatic when the logical clock reaches termination_effective_date, evaluated on the next timed operation after clock advance)"
        actor: system
        preconditions:
          - "logical clock >= termination_effective_date"
        side_effects:
          - "All AuthorizedSigner rows of the member with status == ACTIVE transition to REVOKED"

  - entity: AuthorizedSigner
    initial_state: ACTIVE
    terminal_states: [REVOKED]
    transitions:
      - from: ACTIVE
        to: REVOKED
        trigger: "POST /registry/members/{memberId}/signers/{signerId}/revoke (manual), or system cascade when the owning Member reaches TERMINATED"
        actor: "RegistryAdmin | system"
        preconditions:
          - "For the manual endpoint: signer.member_id == path memberId"
          - "Creation-side rule (applies at POST /registry/members/{memberId}/signers, not to this transition): the new signer's half-open window [effective_from, effective_until) must not intersect any other existing signer window of the same member regardless of that signer's status -> ERR_SIGNER_WINDOW_OVERLAP"
        side_effects:
          - "No cascade to Member (a member may have zero ACTIVE signers only while PENDING_ACTIVATION or SUSPENDED or TERMINATED; revoking the last signer of an ACTIVE member is rejected with ERR_NO_AUTHORIZED_SIGNER)"

  - entity: RegisteredLoan
    initial_state: ACTIVE
    terminal_states: [INACTIVE_ASSIGNED_OUT, INACTIVE_TERMINATED, INACTIVE_SATISFIED]
    transitions:
      - from: ACTIVE
        to: FORECLOSING
        trigger: "POST /registry/loans/{loanId}/foreclose"
        actor: MemberRep
        preconditions:
          - "Loan status == ACTIVE (ERR_LOAN_NOT_ACTIVE)"
          - "Acting member is current servicer or investor of the loan (ERR_NOT_RIGHTS_HOLDER)"
          - "An AuthorizedSigner of the acting member with role_scope in {FORECLOSURE, ALL}, status ACTIVE, and effective_from <= clock < (effective_until or +inf) is named by signer_id (ERR_SIGNER_NOT_AUTHORIZED)"
          - "If loan.foreclosure_mode == ASSIGN_OUT_REQUIRED then request field assignment_out == true; if foreclosure_mode == IN_REGISTRY_ALLOWED then assignment_out must be false or omitted (ERR_ASSIGNMENT_OUT_REQUIRED / ERR_FORECLOSURE_MODE_FORBIDS_ASSIGN_OUT)"
        side_effects:
          - "If assignment_out == true: loan transitions directly to INACTIVE_ASSIGNED_OUT instead of FORECLOSING (see separate transition row)"
      - from: ACTIVE
        to: INACTIVE_ASSIGNED_OUT
        trigger: "POST /registry/loans/{loanId}/foreclose with assignment_out == true on an ASSIGN_OUT_REQUIRED loan"
        actor: MemberRep
        preconditions:
          - "Same as ACTIVE -> FORECLOSING preconditions; foreclosure_mode == ASSIGN_OUT_REQUIRED"
        side_effects:
          - "Loan leaves the registry: excluded from future transfer/reconciliation inclusion sets"
          - "A FIELD_MISMATCH-free exit note is written to the loan record (assigned_out_at = clock)"
      - from: FORECLOSING
        to: ACTIVE
        trigger: "POST /registry/loans/{loanId}/rescind-foreclosure"
        actor: MemberRep
        preconditions:
          - "Loan status == FORECLOSING (ERR_LOAN_NOT_FORECLOSING)"
          - "Acting member is current servicer or investor (ERR_NOT_RIGHTS_HOLDER)"
        side_effects: []
        note: "Cyclic loop: ACTIVE -> FORECLOSING -> ACTIVE is permitted repeatedly; each entry into FORECLOSING re-runs signer checks"
      - from: ACTIVE
        to: INACTIVE_SATISFIED
        trigger: "POST /registry/loans/{loanId}/satisfy"
        actor: MemberRep
        preconditions:
          - "Loan status == ACTIVE (ERR_LOAN_NOT_ACTIVE)"
          - "Acting member is current servicer or investor (ERR_NOT_RIGHTS_HOLDER)"
        side_effects:
          - "Loan excluded from reconciliation inclusion sets from this point on"
      - from: ACTIVE
        to: INACTIVE_TERMINATED
        trigger: "system cascade from Member ACTIVE -> TERMINATION_PENDING (registering member's portfolio)"
        actor: system
        preconditions:
          - "registering_member_id == terminated member AND loan status == ACTIVE"
        side_effects:
          - "Generates a REGISTRY_ONLY SORException on the member's OPEN SORReconciliationRun if one exists"

  - entity: Transfer
    initial_state: CONFIRMED
    terminal_states: [CONFIRMED, REJECTED]
    transitions:
      - from: "(creation)"
        to: CONFIRMED
        trigger: "POST /registry/transfers"
        actor: MemberRep
        preconditions:
          - "Loan exists and status == ACTIVE (ERR_LOAN_NOT_ACTIVE)"
          - "expected_loan_version == loan.version (ERR_STALE_LOAN_VERSION)"
          - "to_member exists and status == ACTIVE (ERR_MEMBER_NOT_ACTIVE)"
          - "transfer_type == BOTH requires acting member to hold both rights; single-type requires holding that right (ERR_NOT_RIGHTS_HOLDER)"
          - "to_member != current holder of the moved right(s) (ERR_SELF_TRANSFER)"
          - "effective_date <= logical clock (ERR_FUTURE_EFFECTIVE_DATE)"
          - "No other non-REJECTED Transfer with the same idempotency_key (ERR_DUPLICATE_IDEMPOTENCY_KEY)"
        side_effects:
          - "loan.current_investor_id := to_member (BENEFICIAL or BOTH); loan.current_servicer_id := to_member (SERVICING or BOTH); loan.version += 1; loan.updated_at := clock"
          - "days_late and late_fee_cents computed and stored (see transfer_late_fee)"
          - "If from_member.org_id == to_member.org_id cannot occur (org_ids unique); intra-org defined as from_member == to_member is rejected, so match flow: a TransferMatch is created in PENDING status unless reporting obligations are waived — see TransferMatch creation rule"
      - from: CONFIRMED
        to: REJECTED
        trigger: "POST /registry/transfers/{transferId}/reject-match by the from-side member (via its open TransferMatch)"
        actor: MemberRep
        preconditions:
          - "TransferMatch for (transfer, acting member) exists with status == PENDING"
        side_effects:
          - "TransferMatch.status := EXPIRED is NOT used here; match -> REJECTED is disallowed at match level (see TransferMatch machine): instead the transfer itself is marked REJECTED and the loan rights are NOT rolled back — the mismatch is escalated to QA"
          - "TransferMatch.status := EXPIRED"
          - "QAReview in DRAFT for the from-side member (if any) gains one auto finding with severity MAJOR, field_name CURRENT_SERVICER"
        note: "Rejecting a match does not undo the rights move; it flags the pair for QA. This asymmetry is intentional."

  - entity: TransferMatch
    initial_state: PENDING
    terminal_states: [MATCHED, EXPIRED, WAIVED]
    transitions:
      - from: "(creation)"
        to: PENDING
        trigger: "system (on Transfer CONFIRMED)"
        actor: system
        preconditions:
          - "from_member != to_member (always true; self-transfer rejected)"
        side_effects: []
        note: "One TransferMatch per Transfer, addressed to the from-side member"
      - from: PENDING
        to: MATCHED
        trigger: "POST /registry/transfers/{transferId}/match-confirm by the from-side member"
        actor: MemberRep
        preconditions:
          - "Acting member == transfer.from_member_id (ERR_NOT_MATCH_PARTY)"
          - "Match status == PENDING (ERR_MATCH_NOT_PENDING)"
        side_effects: []
      - from: PENDING
        to: EXPIRED
        trigger: "system (logical clock passes transfer effective_date + MATCH_WINDOW_DAYS without confirmation) or transfer reject-match"
        actor: system
        preconditions: []
        side_effects:
          - "EXPIRED matches count into AnnualReport.open_exceptions"
      - from: PENDING
        to: WAIVED
        trigger: "not reachable (reserved enum; no transition emits WAIVED because self-transfers are rejected at creation)"
        actor: system
        preconditions: []
        side_effects: []
        note: "WAIVED is declared for forward compatibility; no endpoint produces it"

  - entity: QAReview
    initial_state: DRAFT
    terminal_states: [SETTLED]
    transitions:
      - from: DRAFT
        to: FINDINGS_ISSUED
        trigger: "POST /registry/qa-reviews/{reviewId}/issue"
        actor: QAAuditor
        preconditions:
          - "Review has at least one QAFinding (ERR_NO_FINDINGS)"
        side_effects:
          - "discrepancy_score and sample_size computed and frozen on the review"
      - from: FINDINGS_ISSUED
        to: DRAFT
        trigger: "POST /registry/qa-reviews/{reviewId}/reopen (corrective re-review loop)"
        actor: QAAuditor
        preconditions: []
        side_effects:
          - "Findings are retained; score recomputed on next issue"
        note: "Cyclic loop DRAFT -> FINDINGS_ISSUED -> DRAFT; each re-issue refreezes the score"
      - from: FINDINGS_ISSUED
        to: SETTLED
        trigger: "POST /registry/qa-reviews/{reviewId}/settle"
        actor: QAAuditor
        preconditions:
          - "X-User-ID != review.created_by (segregation of duties: the auditor who created the review may not settle it; ERR_SOD_SAME_ACTOR)"
        side_effects:
          - "A Sanction is created in ASSESSED status with total_amount_cents per sanction_assessment (hop 1)"
          - "If sanction total_amount_cents > 0 and the member's latest AnnualReport.standing_band is DISENGAGEMENT_ELIGIBLE, no automatic member action (hop 2 reserved to operator policy; none automated)"

  - entity: Sanction
    initial_state: ASSESSED
    terminal_states: [UPHELD, REDUCED, VACATED, PAID]
    transitions:
      - from: ASSESSED
        to: APPEALED
        trigger: "POST /registry/sanctions/{sanctionId}/appeal"
        actor: MemberRep
        preconditions:
          - "Acting member == sanction.member_id (ERR_NOT_SANCTION_PARTY)"
          - "Appeal filed within APPEAL_WINDOW_DAYS of sanction created_at (ERR_APPEAL_WINDOW_EXPIRED)"
        side_effects: []
      - from: APPEALED
        to: UPHELD
        trigger: "POST /registry/sanctions/{sanctionId}/adjudicate {decision: UPHELD}"
        actor: QAAuditor
        preconditions:
          - "X-User-ID != member's appealing signer is not tracked; SOD applies vs the review settler: X-User-ID != the QAAuditor user id that settled the parent review (ERR_SOD_SAME_ACTOR)"
        side_effects: []
      - from: APPEALED
        to: REDUCED
        trigger: "POST /registry/sanctions/{sanctionId}/adjudicate {decision: REDUCED, reduced_total_cents}"
        actor: QAAuditor
        preconditions:
          - "Same SOD rule as UPHELD"
          - "reduced_total_cents < total_amount_cents (ERR_REDUCTION_NOT_LOWER)"
        side_effects:
          - "total_amount_cents := reduced_total_cents"
      - from: APPEALED
        to: VACATED
        trigger: "POST /registry/sanctions/{sanctionId}/adjudicate {decision: VACATED}"
        actor: QAAuditor
        preconditions:
          - "Same SOD rule as UPHELD"
        side_effects:
          - "total_amount_cents := 0 (compensating write keeps sanction ledger consistent)"
      - from: ASSESSED
        to: PAID
        trigger: "POST /registry/sanctions/{sanctionId}/pay"
        actor: MemberRep
        preconditions:
          - "Acting member == sanction.member_id"
        side_effects: []

  - entity: AnnualReport
    initial_state: FINAL
    terminal_states: [FINAL, VOID]
    transitions:
      - from: "(creation)"
        to: FINAL
        trigger: "POST /registry/members/{memberId}/annual-reports"
        actor: RegistryAdmin
        preconditions:
          - "No existing report for (member_id, report_year) with status == FINAL (ERR_DUPLICATE_ANNUAL_REPORT)"
        side_effects:
          - "reporting_rate, discrepancy_rate, open_exceptions, standing_score, standing_band computed at generation"
      - from: FINAL
        to: VOID
        trigger: "system (supersede when a regeneration for the same (member, year) occurs after voiding the prior report)"
        actor: system
        preconditions: []
        side_effects: []
        note: "Regeneration path: POST with force_regenerate=true voids the prior FINAL report then creates a new FINAL report; the compensating invariant is exactly one FINAL report per (member, year)"

  - entity: SORReconciliationRun
    initial_state: OPEN
    terminal_states: [COMPLETED, CANCELLED]
    transitions:
      - from: "(creation)"
        to: OPEN
        trigger: "POST /registry/sor-reconciliation-runs"
        actor: MemberRep
        preconditions:
          - "Acting member's status == ACTIVE (ERR_MEMBER_NOT_ACTIVE)"
        side_effects:
          - "Any prior OPEN run for the same member transitions to CANCELLED (supersede-on-submit)"
          - "Diff computed: matched/registry_only/platform_only/field_mismatch counts and match_rate stored"
          - "One SORException (status OPEN) generated per diff item"
          - "If total exceptions == 0 the run transitions immediately to COMPLETED"
      - from: OPEN
        to: COMPLETED
        trigger: "system (when the last OPEN SORException of the run is resolved)"
        actor: system
        preconditions:
          - "Count of run's SORException with status == OPEN becomes 0"
        side_effects: []
        note: "Compound/aggregate transition: run state derived from children"
      - from: OPEN
        to: CANCELLED
        trigger: "system (a newer run submitted for the same member)"
        actor: system
        preconditions: []
        side_effects:
          - "Its still-OPEN exceptions are marked RESOLVED with detail 'superseded' so no orphan OPEN exceptions survive"

# =============================================================================
# §1.2.1 Concurrency Rules (OCC)
# =============================================================================
concurrency_rules:
  - rule_id: transfer-create-stale-loan
    parent_entity: RegisteredLoan
    write_endpoint: "POST /registry/transfers"
    occ_field: "expected_loan_version"
    description: |
      Creating a Transfer against a RegisteredLoan whose version has advanced
      since the client last observed it is rejected with 412. This captures the
      case where another writer has just confirmed a transfer (which moved
      rights and bumped loan.version) and the current writer's view of the
      loan's rights holders is therefore stale.
    error_id: ERR_STALE_LOAN_VERSION
    http_status: 412

  - rule_id: termination-request-stale-member
    parent_entity: Member
    write_endpoint: "POST /registry/members/{memberId}/terminate"
    occ_field: "expected_member_version"
    description: |
      Filing a termination request against a Member whose version has advanced
      since the operator last observed it is rejected with 412. This captures
      the case where another operator action (suspend/reinstate) has just
      mutated the member and the terminator's view of its standing is stale.
    error_id: ERR_STALE_MEMBER_VERSION
    http_status: 412

# =============================================================================
# §1.3 Calculation Rules Table
# =============================================================================
calculations:
  - name: min_check_digit
    trigger: "loan registration (POST /registry/loans)"
    algorithm: aggregation
    formula: |
      payload = member.org_id (7 digits) || zero_pad(serial, 10)
      total = 0; weight = 2
      for ch in reversed(payload):
          d = int(ch) * weight
          if d > 9: d -= 9
          total += d
          weight = 1 if weight == 2 else 2
      check_digit = (10 - (total mod 10)) mod 10
      min = payload || str(check_digit)
    input_set: "the registering member's org_id and its next serial"
    constants:
      PAYLOAD_LENGTH: 17
    precision: "integer digits, no rounding"

  - name: transfer_late_fee
    trigger: "transfer confirmation (POST /registry/transfers)"
    algorithm: tiered_pricing
    formula: |
      days_late = max(0, calendar_day_floor(clock_now) - calendar_day_floor(effective_date) - TRANSFER_WINDOW_DAYS)
      fee = 0
      for (lo, hi, rate) in [(1,15,TIER1),(16,30,TIER2),(31,+inf,TIER3)]:
          if days_late >= lo:
              fee += (min(days_late, hi) - lo + 1) * rate
      late_fee_cents = fee
    input_set: "the single transfer being confirmed; effective_date vs logical clock"
    constants:
      TRANSFER_WINDOW_DAYS: 10
      TIER1: 2500
      TIER2: 5000
      TIER3: 10000
    precision: "integer cents; marginal tier allocation (each late day billed at exactly one tier's rate)"
    note: "boundary: effective_date + 10 days is the last on-time day; day 11 after effective_date is the first late day"

  - name: qa_discrepancy_score
    trigger: "QA review issue (DRAFT -> FINDINGS_ISSUED) and re-issue"
    algorithm: weighted_scoring
    formula: |
      sample = all loans ever registered by review.member_id (any status), ordered by serial ASC
      sample_size = len(sample)
      weighted = 1.0 * count(findings severity CRITICAL) + 0.5 * count(MAJOR) + 0.2 * count(MINOR)
      discrepancy_score = round_half_up(weighted / sample_size, 4)  (0 when sample_size == 0 -> review cannot be issued without findings anyway)
    input_set: "QAFindings attached to the review at issue time; findings on loans not in the sample are rejected at finding creation (ERR_LOAN_NOT_IN_SAMPLE)"
    constants:
      W_CRITICAL: 1.0
      W_MAJOR: 0.5
      W_MINOR: 0.2
    precision: "4 decimal places, round_half_up"

  - name: sanction_assessment
    trigger: "QA review settle (FINDINGS_ISSUED -> SETTLED)"
    algorithm: aggregation
    formula: |
      prior = count of Sanction rows for this member with status in {UPHELD, REDUCED, PAID} (proven priors)
      repeat_multiplier = 1.0 if prior == 0 else 1.5
      for each finding on the review (in created_at ASC order, tie impossible):
          base = BASE[severity]        # CRITICAL 500000, MAJOR 100000, MINOR 25005
          line_cents = round_half_up(base * repeat_multiplier * abatement_factor, 0)   # ROUND PER LINE
      total_amount_cents = sum(line_cents)                                             # THEN SUM
      line_count = number of findings
    input_set: "the review's findings; the member's sanction history"
    constants:
      BASE_CRITICAL: 500000
      BASE_MAJOR: 100000
      BASE_MINOR: 25005
      REPEAT_MULTIPLIER: 1.5
    precision: "integer cents; rounding order PINNED: round each line first, then sum. (Sum-then-round is a rejected variant: 3 MINOR findings x 25005 x 1.5 x 0.9 = 33756.75/line -> 33757 x 3 = 101271 vs 101270.)"

  - name: transfer_timeliness_reporting_rate
    trigger: "annual report generation (POST /registry/members/{memberId}/annual-reports)"
    algorithm: aggregation
    formula: |
      transfers = all Transfers with from_member_id == member, status == CONFIRMED,
                  effective_date within the report calendar year [Jan 1 00:00:00Z, Dec 31 23:59:59.999Z]
      VARIANT count_based (stored as AnnualReport.reporting_rate):
          rate_c = if len(transfers) == 0 then 1.0
                   else round_half_up(count(days_late == 0) / count(transfers), 4)
      VARIANT amount_weighted (published alongside as reporting_rate_amount_weighted):
          rate_a = if sum(loan_amount_cents of transferred loans) == 0 then 1.0
                   else round_half_up(sum(loan_amount_cents where days_late == 0) / sum(loan_amount_cents all), 4)
    input_set: "CONFIRMED transfers from the member in the calendar year; REJECTED transfers excluded"
    constants: {}
    precision: "4 decimal places, round_half_up"
    variants:
      - name: count_based
        when: "default regulatory view (stored field reporting_rate)"
        difference: "each transfer weighs equally regardless of loan size"
      - name: amount_weighted
        when: "investor-materiality view (stored field reporting_rate_amount_weighted)"
        difference: "a late transfer of a large loan drags the rate more; identical inputs yield different rates (2 on-time of 3 transfers: 0.6667 vs 0.5000)"

  - name: member_standing_score
    trigger: "annual report generation"
    algorithm: constraint_propagation
    formula: |
      standing_score = 100
                       - 60 * (1 - reporting_rate_count_based)
                       - 40 * min(1, discrepancy_rate)
                       - 2  * min(open_exceptions, EXCEPTION_CAP)   # cap: at most 10 exceptions penalize
      clamp to [0, 100]; then:
      standing_band = GOOD_STANDING          if standing_score >= 80
                      PROBATION              if 60 <= standing_score < 80
                      DISENGAGEMENT_ELIGIBLE if standing_score < 60
      where discrepancy_rate comes from the member's latest SETTLED QA review
      (by settled_at, tie -> created_at ASC; none -> 0.0) and open_exceptions
      counts the member's TransferMatch rows in {PENDING, EXPIRED} at generation.
    input_set: "the member's reporting_rate (count variant), latest SETTLED review, open matches"
    constants:
      W_TIMELINESS: 60
      W_DISCREPANCY: 40
      EXCEPTION_PENALTY: 2
      EXCEPTION_CAP: 10
    precision: "2 decimal places, round_half_up; band boundaries are >= (80.00 is GOOD_STANDING, 79.99 is PROBATION)"

  - name: sor_match_rate
    trigger: "SOR reconciliation run submission"
    algorithm: aggregation
    formula: |
      for each submitted record (processed in submission order):
          if record.min unknown on registry: platform_only_count += 1; exception PLATFORM_ONLY
          elif registry loan status in {INACTIVE_*}: platform_only_count += 1; exception PLATFORM_ONLY (loan left registry)
          elif record.servicer_org_id != org_id_of(loan.current_servicer_id) or
               record.investor_org_id != org_id_of(loan.current_investor_id):
               field_mismatch_count += 1; exception FIELD_MISMATCH
          else: matched_count += 1
      registry_only_count = count of loans with status in {ACTIVE, FORECLOSING}
          where (current_servicer_id == member or current_investor_id == member)
          and loan.min not in submitted records
      for each registry_only loan: exception REGISTRY_ONLY
      match_rate = round_half_up(matched_count / max(1, total_records + registry_only_count), 4)
    input_set: "submitted platform records; the member's registry-side portfolio in {ACTIVE, FORECLOSING}"
    constants: {}
    precision: "4 decimal places, round_half_up"

# =============================================================================
# §1.4 Validation Rules Table (ordered by priority)
# =============================================================================
validations:
  - priority: 0
    category: existence
    check: "Request body carries every required input field of the endpoint (§1.5 `input:` entries without `?`)"
    error_id: ERR_INVALID_REQUEST
    http_status: 400
    applies_to: "all write endpoints"
  - priority: 1
    category: auth
    check: "X-User-Role header present and a declared role; X-User-ID present"
    error_id: ERR_MISSING_USER_CONTEXT
    http_status: 401
    applies_to: "all endpoints"
  - priority: 2
    category: auth
    check: "Role permitted for this endpoint per §1.5 roles"
    error_id: ERR_ROLE_FORBIDDEN
    http_status: 403
    applies_to: "all endpoints"
  - priority: 3
    category: existence
    check: "Path-segment ids exist, validated left to right (memberId before signerId before loanId...)"
    error_id: "ERR_MEMBER_NOT_FOUND | ERR_SIGNER_NOT_FOUND | ERR_LOAN_NOT_FOUND | ERR_TRANSFER_NOT_FOUND | ERR_REVIEW_NOT_FOUND | ERR_FINDING_NOT_FOUND | ERR_SANCTION_NOT_FOUND | ERR_RUN_NOT_FOUND | ERR_EXCEPTION_NOT_FOUND | ERR_REPORT_NOT_FOUND"
    http_status: 404
    applies_to: "all endpoints with path ids"
  - priority: 4
    category: existence
    check: "Body-referenced entity ids exist (member_id, to_member_id, loan_id, transfer_id, review_id...)"
    error_id: "same family as priority 3, chosen by which reference fails"
    http_status: 404
    applies_to: "creation/action endpoints with body references"
  - priority: 5
    category: state
    check: "Acting/target member status permits the operation (transfers and registrations require ACTIVE members; suspended members cannot file)"
    error_id: ERR_MEMBER_NOT_ACTIVE
    http_status: 409
    applies_to: "POST /registry/loans, POST /registry/transfers, POST /registry/sor-reconciliation-runs, signer-gated actions"
  - priority: 6
    category: state
    check: "Target resource in correct state for the transition (loan ACTIVE for transfer/foreclose/satisfy; review DRAFT to issue; match PENDING to confirm; sanction ASSESSED to appeal/pay, APPEALED to adjudicate; run OPEN to resolve exceptions)"
    error_id: "ERR_LOAN_NOT_ACTIVE | ERR_LOAN_NOT_FORECLOSING | ERR_REVIEW_NOT_DRAFT | ERR_REVIEW_NOT_ISSUED | ERR_MATCH_NOT_PENDING | ERR_SANCTION_NOT_APPEALABLE | ERR_SANCTION_NOT_APPEALED | ERR_RUN_NOT_OPEN | ERR_EXCEPTION_NOT_OPEN"
    http_status: 409
    applies_to: "state transition endpoints"
  - priority: 7
    category: business_safety
    check: "Segregation of duties: the QAAuditor user id that created a QAReview may not settle it; the QAAuditor user id that settled a review may not adjudicate its sanction"
    error_id: ERR_SOD_SAME_ACTOR
    http_status: 403
    applies_to: "POST /registry/qa-reviews/{reviewId}/settle, POST /registry/sanctions/{sanctionId}/adjudicate"
  - priority: 8
    category: business_safety
    check: "Authorized signer gate: signer_id must reference an ACTIVE AuthorizedSigner of the acting member with covering role_scope and effective window containing the logical clock"
    error_id: ERR_SIGNER_NOT_AUTHORIZED
    http_status: 403
    applies_to: "POST /registry/loans/{loanId}/foreclose"
  - priority: 9
    category: business_safety
    check: "Foreclosure jurisdiction: ASSIGN_OUT_REQUIRED loans must assign out (assignment_out=true); IN_REGISTRY_ALLOWED loans must not (assignment_out omitted or false)"
    error_id: "ERR_ASSIGNMENT_OUT_REQUIRED | ERR_FORECLOSURE_MODE_FORBIDS_ASSIGN_OUT"
    http_status: 422
    applies_to: "POST /registry/loans/{loanId}/foreclose"
  - priority: 10
    category: business_temporal
    check: "Clock discipline: closing_date <= clock on registration; effective_date <= clock on transfer; appeal within APPEAL_WINDOW_DAYS; termination effective_date >= clock for future-dated termination"
    error_id: "ERR_CLOSING_DATE_IN_FUTURE | ERR_FUTURE_EFFECTIVE_DATE | ERR_APPEAL_WINDOW_EXPIRED | ERR_TERMINATION_DATE_PAST"
    http_status: 422
    applies_to: "dated write endpoints"
  - priority: 11
    category: business_constraint
    check: "Uniqueness and interval integrity: org_id globally unique (incl. TERMINATED); idempotency_key unique among non-REJECTED transfers; (member_id, report_year) unique among FINAL reports; signer effective window valid; a member's signer authority windows must not overlap (half-open [effective_from, effective_until): touching endpoints are clean)"
    error_id: "ERR_DUPLICATE_ORG_ID | ERR_DUPLICATE_IDEMPOTENCY_KEY | ERR_DUPLICATE_ANNUAL_REPORT | ERR_INVALID_SIGNER_WINDOW | ERR_SIGNER_WINDOW_OVERLAP"
    http_status: 409
    applies_to: "creation endpoints"
  - priority: 12
    category: business_constraint
    check: "Transfer semantics: to_member ACTIVE; to_member != current holder of the moved right(s); BOTH requires holding both rights; QAFinding loan must belong to the review's sample"
    error_id: "ERR_MEMBER_NOT_ACTIVE | ERR_SELF_TRANSFER | ERR_NOT_RIGHTS_HOLDER | ERR_LOAN_NOT_IN_SAMPLE"
    http_status: 422
    applies_to: "POST /registry/transfers, POST /registry/qa-reviews/{reviewId}/findings"
  - priority: 13
    category: business_constraint
    check: "Termination gates: member holds no current rights on any loan and has no PENDING TransferMatch rows"
    error_id: "ERR_MEMBER_HOLDS_ACTIVE_RIGHTS | ERR_OPEN_TRANSFER_MATCHES"
    http_status: 409
    applies_to: "POST /registry/members/{memberId}/terminate"
  - priority: 14
    category: business_fiscal
    check: "Sanction adjudication economics: reduced_total_cents strictly below total_amount_cents; abatement_factor within [0,1]"
    error_id: "ERR_REDUCTION_NOT_LOWER | ERR_INVALID_ABATEMENT_FACTOR"
    http_status: 422
    applies_to: "POST /registry/sanctions/{sanctionId}/adjudicate, POST /registry/qa-reviews/{reviewId}/settle"
  - priority: 15
    category: business_referential
    check: "OCC expected_*_version matches the parent's current version"
    error_id: "ERR_STALE_LOAN_VERSION | ERR_STALE_MEMBER_VERSION"
    http_status: 412
    applies_to: "POST /registry/transfers, POST /registry/members/{memberId}/terminate"
    note: "OCC sits lowest: a request that is both stale and state-invalid reports the state error first"

# =============================================================================
# §1.5 API Endpoint Table (40 endpoints)
# =============================================================================
endpoints:
  # --- Logical clock (test-driving) ---
  - method: POST
    path: "/registry/_clock/set_current_utc"
    description: "Set the registry logical clock. Startup default is exactly 2026-09-01T00:00:00Z before any set call; never falls back to wall-clock."
    roles: [RegistryAdmin]
    code: 200
    input: [to_iso8601]
    output:
      current_utc: datetime
    side_effects:
      - "Evaluates due Member TERMINATION_PENDING -> TERMINATED transitions and TransferMatch PENDING -> EXPIRED expirations at the new clock position"

  # --- Member ---
  - method: POST
    path: "/registry/members"
    description: "Register a new member organization"
    roles: [RegistryAdmin]
    code: 201
    input: [legal_name, org_id, org_id_type, member_type]
    output: Member
    side_effects: ["status := PENDING_ACTIVATION"]

  - method: GET
    path: "/registry/members"
    description: "List members with optional filters"
    roles: [RegistryAdmin, MemberRep, QAAuditor]
    code: 200
    input: ["status?", "member_type?", "limit?", "offset?"]
    output: "Member[]"
    side_effects: []

  - method: GET
    path: "/registry/members/{memberId}"
    description: "Get one member"
    roles: [RegistryAdmin, MemberRep, QAAuditor]
    code: 200
    input: []
    output: Member
    side_effects: []

  - method: POST
    path: "/registry/members/{memberId}/activate"
    description: "Activate a PENDING_ACTIVATION member (requires >= 1 ACTIVE signer)"
    roles: [RegistryAdmin]
    code: 200
    input: []
    output: Member
    side_effects: ["status := ACTIVE", "increments Member.version by 1"]

  - method: POST
    path: "/registry/members/{memberId}/suspend"
    description: "Suspend an ACTIVE member"
    roles: [RegistryAdmin]
    code: 200
    input: []
    output: Member
    side_effects: ["status := SUSPENDED", "increments Member.version by 1"]

  - method: POST
    path: "/registry/members/{memberId}/reinstate"
    description: "Reinstate a SUSPENDED member"
    roles: [RegistryAdmin]
    code: 200
    input: []
    output: Member
    side_effects: ["status := ACTIVE", "increments Member.version by 1"]

  - method: POST
    path: "/registry/members/{memberId}/terminate"
    description: "Request membership termination; zero-loan portfolio deactivates, clock >= effective_date finalizes"
    roles: [RegistryAdmin]
    code: 200
    input: [effective_date, expected_member_version]
    output: Member
    side_effects:
      - "status := TERMINATION_PENDING (or TERMINATED immediately when effective_date <= clock)"
      - "ACTIVE loans registered by the member cascade to INACTIVE_TERMINATED"
      - "each such loan generates a REGISTRY_ONLY SORException on the member's OPEN run if one exists"
      - "increments Member.version by 1"

  # --- AuthorizedSigner ---
  - method: POST
    path: "/registry/members/{memberId}/signers"
    description: "Designate an authorized signer for a member"
    roles: [RegistryAdmin]
    code: 201
    input: [full_name, email, effective_from, role_scope, "effective_until?"]
    output: AuthorizedSigner
    side_effects: []

  - method: GET
    path: "/registry/members/{memberId}/signers"
    description: "List signers of a member (reverse reachability for AuthorizedSigner.member_id)"
    roles: [RegistryAdmin, QAAuditor]
    code: 200
    input: ["status?", "limit?", "offset?"]
    output: "AuthorizedSigner[]"
    side_effects: []

  - method: GET
    path: "/registry/members/{memberId}/signers/{signerId}"
    description: "Get one signer of a member (nested form; parent id validated first)"
    roles: [RegistryAdmin, QAAuditor]
    code: 200
    input: []
    output: AuthorizedSigner
    side_effects: []

  - method: GET
    path: "/registry/signers/{signerId}"
    description: "Get one signer by id (flat form)"
    roles: [RegistryAdmin, QAAuditor]
    code: 200
    input: []
    output: AuthorizedSigner
    side_effects: []

  - method: GET
    path: "/registry/signers"
    description: "List signers across members (flat form; reverse reachability for AuthorizedSigner.member_id)"
    roles: [RegistryAdmin, QAAuditor]
    code: 200
    input: ["member_id?", "status?", "limit?", "offset?"]
    output: "AuthorizedSigner[]"
    side_effects: []

  - method: POST
    path: "/registry/members/{memberId}/signers/{signerId}/revoke"
    description: "Revoke a signer; revoking the last ACTIVE signer of an ACTIVE member is rejected"
    roles: [RegistryAdmin]
    code: 200
    input: []
    output: AuthorizedSigner
    side_effects: ["status := REVOKED"]

  # --- RegisteredLoan ---
  - method: POST
    path: "/registry/loans"
    description: "Register a loan at closing; mints MIN (org_id + serial + Luhn check digit)"
    roles: [MemberRep]
    code: 201
    input: [loan_amount_cents, property_state, closing_date]
    output: RegisteredLoan
    side_effects:
      - "serial := member's next sequence; min := org_id + zero_pad(serial,10) + check digit"
      - "foreclosure_mode derived from property_state"
      - "current_investor_id := current_servicer_id := acting member"

  - method: GET
    path: "/registry/loans"
    description: "List loans with filters"
    roles: [RegistryAdmin, MemberRep, QAAuditor, BorrowerInquirer]
    code: 200
    input: ["registering_member_id?", "current_investor_id?", "current_servicer_id?", "status?", "limit?", "offset?"]
    output: "RegisteredLoan[]"
    side_effects: []

  - method: GET
    path: "/registry/loans/{loanId}"
    description: "Get one loan"
    roles: [RegistryAdmin, MemberRep, QAAuditor, BorrowerInquirer]
    code: 200
    input: []
    output: RegisteredLoan
    side_effects: []

  - method: POST
    path: "/registry/loans/{loanId}/foreclose"
    description: "Enter foreclosure; ASSIGN_OUT_REQUIRED jurisdictions must assign out of the registry"
    roles: [MemberRep]
    code: 200
    input: [signer_id, "assignment_out?"]
    output: RegisteredLoan
    side_effects:
      - "status := FORECLOSING (IN_REGISTRY_ALLOWED) or INACTIVE_ASSIGNED_OUT (ASSIGN_OUT_REQUIRED with assignment_out=true)"
      - "assigned_out_at := clock when assigned out"
      - "increments RegisteredLoan.version by 1"

  - method: POST
    path: "/registry/loans/{loanId}/rescind-foreclosure"
    description: "Rescind a foreclosure, returning the loan to ACTIVE (cyclic)"
    roles: [MemberRep]
    code: 200
    input: []
    output: RegisteredLoan
    side_effects: ["status := ACTIVE", "increments RegisteredLoan.version by 1"]

  - method: POST
    path: "/registry/loans/{loanId}/satisfy"
    description: "Mark loan satisfied (paid off); leaves the registry"
    roles: [MemberRep]
    code: 200
    input: []
    output: RegisteredLoan
    side_effects: ["status := INACTIVE_SATISFIED", "increments RegisteredLoan.version by 1"]

  # --- Transfer ---
  - method: POST
    path: "/registry/transfers"
    description: "Report a transfer of beneficial and/or servicing rights (OCC-guarded on loan version)"
    roles: [MemberRep]
    code: 201
    input: [loan_id, to_member_id, transfer_type, effective_date, idempotency_key, expected_loan_version]
    output: Transfer
    side_effects:
      - "from_member_id derived from the loan's current holder of the moved right(s)"
      - "loan rights move; increments RegisteredLoan.version by 1"
      - "days_late and late_fee_cents computed"
      - "TransferMatch created in PENDING for the from-side member"

  - method: GET
    path: "/registry/transfers"
    description: "List transfers with filters (reverse reachability for Transfer.loan_id, Transfer.from_member_id, Transfer.to_member_id)"
    roles: [RegistryAdmin, MemberRep, QAAuditor]
    code: 200
    input: ["loan_id?", "from_member_id?", "to_member_id?", "status?", "limit?", "offset?"]
    output: "Transfer[]"
    side_effects: []

  - method: GET
    path: "/registry/transfers/{transferId}"
    description: "Get one transfer"
    roles: [RegistryAdmin, MemberRep, QAAuditor]
    code: 200
    input: []
    output: Transfer
    side_effects: []

  - method: POST
    path: "/registry/transfers/{transferId}/match-confirm"
    description: "From-side member confirms the match for a confirmed transfer"
    roles: [MemberRep]
    code: 200
    input: []
    output: TransferMatch
    side_effects: ["TransferMatch.status := MATCHED"]

  - method: POST
    path: "/registry/transfers/{transferId}/reject-match"
    description: "From-side member rejects the match; transfer flips to REJECTED and QA gains an auto finding"
    roles: [MemberRep]
    code: 200
    input: []
    output: TransferMatch
    side_effects:
      - "Transfer.status := REJECTED (rights move NOT rolled back)"
      - "TransferMatch.status := EXPIRED"
      - "if a DRAFT QAReview exists for the from-side member, add one auto QAFinding (severity MAJOR, field_name CURRENT_SERVICER)"

  - method: GET
    path: "/registry/transfer-matches"
    description: "List transfer matches (reverse reachability for TransferMatch.transfer_id)"
    roles: [RegistryAdmin, MemberRep, QAAuditor]
    code: 200
    input: ["transfer_id?", "reported_by_member_id?", "status?", "limit?", "offset?"]
    output: "TransferMatch[]"
    side_effects: []

  - method: GET
    path: "/registry/transfer-matches/{matchId}"
    description: "Get one transfer match"
    roles: [RegistryAdmin, MemberRep, QAAuditor]
    code: 200
    input: []
    output: TransferMatch
    side_effects: []

  # --- Borrower inquiry ---
  - method: GET
    path: "/registry/borrower-inquiries/{min}"
    description: "Borrower-facing lookup: given a MIN, return the current investor and servicer member ids and org_ids"
    roles: [BorrowerInquirer]
    code: 200
    input: []
    output:
      min: string
      loan_id: string
      loan_status: string
      current_investor_id: string
      current_investor_org_id: string
      current_servicer_id: string
      current_servicer_org_id: string
    side_effects: []

  # --- QAReview / QAFinding ---
  - method: POST
    path: "/registry/qa-reviews"
    description: "Open a QA review for a member over a period"
    roles: [QAAuditor]
    code: 201
    input: [member_id, period_start, period_end]
    output: QAReview
    side_effects: ["created_by := X-User-ID"]

  - method: GET
    path: "/registry/qa-reviews"
    description: "List QA reviews (reverse reachability for QAReview.member_id)"
    roles: [RegistryAdmin, QAAuditor]
    code: 200
    input: ["member_id?", "status?", "limit?", "offset?"]
    output: "QAReview[]"
    side_effects: []

  - method: GET
    path: "/registry/qa-reviews/{reviewId}"
    description: "Get one QA review"
    roles: [RegistryAdmin, QAAuditor]
    code: 200
    input: []
    output: QAReview
    side_effects: []

  - method: POST
    path: "/registry/qa-reviews/{reviewId}/findings"
    description: "Record a discrepancy finding against a sampled loan"
    roles: [QAAuditor]
    code: 201
    input: [loan_id, field_name, expected_value, actual_value, severity]
    output: QAFinding
    side_effects: ["review must be DRAFT; loan must be in the review's sample"]

  - method: GET
    path: "/registry/qa-reviews/{reviewId}/findings"
    description: "List findings of a review (reverse reachability for QAFinding.review_id and QAFinding.loan_id via loan_id filter)"
    roles: [RegistryAdmin, QAAuditor]
    code: 200
    input: ["loan_id?", "severity?", "limit?", "offset?"]
    output: "QAFinding[]"
    side_effects: []

  - method: GET
    path: "/registry/qa-reviews/{reviewId}/findings/{findingId}"
    description: "Get one finding of a review (nested form; review id validated first)"
    roles: [RegistryAdmin, QAAuditor]
    code: 200
    input: []
    output: QAFinding
    side_effects: []

  - method: GET
    path: "/registry/qa-findings/{findingId}"
    description: "Get one QA finding by id (flat form)"
    roles: [RegistryAdmin, QAAuditor]
    code: 200
    input: []
    output: QAFinding
    side_effects: []

  - method: GET
    path: "/registry/qa-findings"
    description: "List QA findings across reviews (reverse reachability for QAFinding.review_id and QAFinding.loan_id)"
    roles: [RegistryAdmin, QAAuditor]
    code: 200
    input: ["review_id?", "loan_id?", "severity?", "limit?", "offset?"]
    output: "QAFinding[]"
    side_effects: []

  - method: POST
    path: "/registry/qa-reviews/{reviewId}/issue"
    description: "Issue findings; freezes sample_size and discrepancy_score"
    roles: [QAAuditor]
    code: 200
    input: []
    output: QAReview
    side_effects: ["status := FINDINGS_ISSUED; runs the qa_discrepancy_score calculation and freezes sample_size + discrepancy_score", "increments QAReview.version by 1"]

  - method: POST
    path: "/registry/qa-reviews/{reviewId}/reopen"
    description: "Reopen an issued review for corrective re-review (cyclic)"
    roles: [QAAuditor]
    code: 200
    input: []
    output: QAReview
    side_effects: ["status := DRAFT", "increments QAReview.version by 1"]

  - method: POST
    path: "/registry/qa-reviews/{reviewId}/settle"
    description: "Settle a review; creates the Sanction (segregation of duties vs created_by)"
    roles: [QAAuditor]
    code: 200
    input: ["abatement_factor?"]
    output: QAReview
    side_effects:
      - "status := SETTLED; settled_by := X-User-ID; settled_at := clock"
      - "creates Sanction (ASSESSED) with total_amount_cents per sanction_assessment"

  # --- Sanction ---
  - method: GET
    path: "/registry/sanctions"
    description: "List sanctions (reverse reachability for Sanction.member_id and Sanction.review_id)"
    roles: [RegistryAdmin, MemberRep, QAAuditor]
    code: 200
    input: ["member_id?", "review_id?", "status?", "limit?", "offset?"]
    output: "Sanction[]"
    side_effects: []

  - method: GET
    path: "/registry/sanctions/{sanctionId}"
    description: "Get one sanction"
    roles: [RegistryAdmin, MemberRep, QAAuditor]
    code: 200
    input: []
    output: Sanction
    side_effects: []

  - method: POST
    path: "/registry/sanctions/{sanctionId}/appeal"
    description: "Sanctioned member appeals within the appeal window"
    roles: [MemberRep]
    code: 200
    input: []
    output: Sanction
    side_effects: ["status := APPEALED"]

  - method: POST
    path: "/registry/sanctions/{sanctionId}/adjudicate"
    description: "Adjudicate an appealed sanction (SOD vs the review settler)"
    roles: [QAAuditor]
    code: 200
    input: [decision, "reduced_total_cents?"]
    output: Sanction
    side_effects: ["status := UPHELD | REDUCED | VACATED; REDUCED sets total_amount_cents := reduced_total_cents; VACATED sets total_amount_cents := 0"]

  - method: POST
    path: "/registry/sanctions/{sanctionId}/pay"
    description: "Sanctioned member pays an ASSESSED sanction"
    roles: [MemberRep]
    code: 200
    input: []
    output: Sanction
    side_effects: ["status := PAID"]

  # --- AnnualReport ---
  - method: POST
    path: "/registry/members/{memberId}/annual-reports"
    description: "Generate the annual report for a member/year; force_regenerate=true voids the prior FINAL report and recomputes"
    roles: [RegistryAdmin]
    code: 201
    input: [report_year, "force_regenerate?"]
    output: AnnualReport
    side_effects:
      - "runs transfer_timeliness_reporting_rate (both variants) and member_standing_score; stores reporting_rate, reporting_rate_amount_weighted, discrepancy_rate, open_exceptions, standing_score, standing_band"
      - "force_regenerate: prior FINAL report for (member, year) -> VOID"

  - method: GET
    path: "/registry/annual-reports"
    description: "List annual reports (reverse reachability for AnnualReport.member_id)"
    roles: [RegistryAdmin, MemberRep, QAAuditor]
    code: 200
    input: ["member_id?", "report_year?", "status?", "limit?", "offset?"]
    output: "AnnualReport[]"
    side_effects: []

  - method: GET
    path: "/registry/annual-reports/{reportId}"
    description: "Get one annual report"
    roles: [RegistryAdmin, MemberRep, QAAuditor]
    code: 200
    input: []
    output: AnnualReport
    side_effects: []

  # --- SOR Reconciliation ---
  - method: POST
    path: "/registry/sor-reconciliation-runs"
    description: "Submit servicing-platform records for reconciliation against the registry (system of record)"
    roles: [MemberRep]
    code: 201
    input: [records]
    side_effects:
      - "member_id := acting member"
      - "prior OPEN run for the member -> CANCELLED (its OPEN exceptions -> RESOLVED 'superseded')"
      - "runs sor_match_rate; stores diff counts and match_rate; generates SORException rows; zero exceptions -> COMPLETED immediately"
    output: SORReconciliationRun

  - method: GET
    path: "/registry/sor-reconciliation-runs"
    description: "List reconciliation runs (reverse reachability for SORReconciliationRun.member_id)"
    roles: [RegistryAdmin, MemberRep, QAAuditor]
    code: 200
    input: ["member_id?", "status?", "limit?", "offset?"]
    output: "SORReconciliationRun[]"
    side_effects: []

  - method: GET
    path: "/registry/sor-reconciliation-runs/{runId}"
    description: "Get one reconciliation run"
    roles: [RegistryAdmin, MemberRep, QAAuditor]
    code: 200
    input: []
    output: SORReconciliationRun
    side_effects: []

  - method: GET
    path: "/registry/sor-exceptions"
    description: "List SOR exceptions (reverse reachability for SORException.run_id and SORException.loan_id via loan_id filter)"
    roles: [RegistryAdmin, MemberRep, QAAuditor]
    code: 200
    input: ["run_id?", "loan_id?", "exception_type?", "status?", "limit?", "offset?"]
    output: "SORException[]"
    side_effects: []

  - method: GET
    path: "/registry/sor-exceptions/{exceptionId}"
    description: "Get one SOR exception"
    roles: [RegistryAdmin, MemberRep, QAAuditor]
    code: 200
    input: []
    output: SORException
    side_effects: []

  - method: POST
    path: "/registry/sor-exceptions/{exceptionId}/resolve"
    description: "Resolve one OPEN exception; resolving the last OPEN exception completes the parent run"
    roles: [MemberRep]
    code: 200
    input: ["resolution_note?"]
    output: SORException
    side_effects: ["status := RESOLVED", "if parent run has no remaining OPEN exceptions: run status := COMPLETED"]

# =============================================================================
# §1.6 Error Code Catalog
# =============================================================================
errors:
  - { id: ERR_MISSING_USER_CONTEXT, http: 401, condition: "X-User-Role or X-User-ID header missing, or role not a declared role" }
  - { id: ERR_ROLE_FORBIDDEN, http: 403, condition: "Authenticated role not in the endpoint's roles list" }
  - { id: ERR_INVALID_REQUEST, http: 400, condition: "Required request field missing or malformed (wrong type)" }
  - { id: ERR_MEMBER_NOT_FOUND, http: 404, condition: "member id in path or body does not exist" }
  - { id: ERR_SIGNER_NOT_FOUND, http: 404, condition: "signer id in path or body does not exist (or does not belong to the path member)" }
  - { id: ERR_LOAN_NOT_FOUND, http: 404, condition: "loan id (or MIN on borrower inquiry) does not exist" }
  - { id: ERR_TRANSFER_NOT_FOUND, http: 404, condition: "transfer id in path does not exist" }
  - { id: ERR_REVIEW_NOT_FOUND, http: 404, condition: "QA review id in path does not exist" }
  - { id: ERR_FINDING_NOT_FOUND, http: 404, condition: "QA finding id in path does not exist" }
  - { id: ERR_SANCTION_NOT_FOUND, http: 404, condition: "sanction id in path does not exist" }
  - { id: ERR_RUN_NOT_FOUND, http: 404, condition: "SOR reconciliation run id in path does not exist" }
  - { id: ERR_EXCEPTION_NOT_FOUND, http: 404, condition: "SOR exception id in path does not exist" }
  - { id: ERR_REPORT_NOT_FOUND, http: 404, condition: "annual report id in path does not exist" }
  - { id: ERR_MEMBER_NOT_ACTIVE, http: 409, condition: "Acting or target member not in ACTIVE status where ACTIVE is required (registration, transfer to-side, SOR run)" }
  - { id: ERR_NO_AUTHORIZED_SIGNER, http: 409, condition: "Activation/reinstatement requires >= 1 ACTIVE signer; revoking the last ACTIVE signer of an ACTIVE member" }
  - { id: ERR_LOAN_NOT_ACTIVE, http: 409, condition: "Loan not ACTIVE where ACTIVE is required (transfer, foreclose, satisfy)" }
  - { id: ERR_LOAN_NOT_FORECLOSING, http: 409, condition: "Rescind attempted on a loan not in FORECLOSING" }
  - { id: ERR_MATCH_NOT_PENDING, http: 409, condition: "Match confirm/reject attempted on a TransferMatch not in PENDING" }
  - { id: ERR_REVIEW_NOT_DRAFT, http: 409, condition: "Finding add or issue attempted on a review not in DRAFT" }
  - { id: ERR_REVIEW_NOT_ISSUED, http: 409, condition: "Settle or reopen attempted on a review not in FINDINGS_ISSUED" }
  - { id: ERR_NO_FINDINGS, http: 409, condition: "Issuing a review that has zero findings" }
  - { id: ERR_SANCTION_NOT_APPEALABLE, http: 409, condition: "Appeal attempted on a sanction not in ASSESSED" }
  - { id: ERR_SANCTION_NOT_APPEALED, http: 409, condition: "Adjudicate attempted on a sanction not in APPEALED" }
  - { id: ERR_RUN_NOT_OPEN, http: 409, condition: "Operation attempted on a reconciliation run not in OPEN" }
  - { id: ERR_EXCEPTION_NOT_OPEN, http: 409, condition: "Resolve attempted on an SOR exception not in OPEN" }
  - { id: ERR_MEMBER_HOLDS_ACTIVE_RIGHTS, http: 409, condition: "Termination requested while member is current investor or servicer of any loan (any loan status)" }
  - { id: ERR_OPEN_TRANSFER_MATCHES, http: 409, condition: "Termination requested while the member has TransferMatch rows in PENDING" }
  - { id: ERR_DUPLICATE_ORG_ID, http: 409, condition: "org_id already registered, including on TERMINATED members" }
  - { id: ERR_DUPLICATE_IDEMPOTENCY_KEY, http: 409, condition: "idempotency_key already used by a non-REJECTED transfer" }
  - { id: ERR_DUPLICATE_ANNUAL_REPORT, http: 409, condition: "A FINAL AnnualReport already exists for (member_id, report_year) and force_regenerate was not set" }
  - { id: ERR_INVALID_SIGNER_WINDOW, http: 422, condition: "signer effective_until present but not strictly greater than effective_from" }
  - { id: ERR_SIGNER_WINDOW_OVERLAP, http: 409, condition: "new signer's half-open authority window [effective_from, effective_until) intersects another signer window of the same member; touching endpoints are not an overlap" }
  - { id: ERR_CLOSING_DATE_IN_FUTURE, http: 422, condition: "closing_date is after the current logical clock" }
  - { id: ERR_FUTURE_EFFECTIVE_DATE, http: 422, condition: "transfer effective_date is after the current logical clock" }
  - { id: ERR_TERMINATION_DATE_PAST, http: 422, condition: "terminate requested with effective_date in the past relative to the logical clock (immediate termination uses effective_date == clock only)" }
  - { id: ERR_APPEAL_WINDOW_EXPIRED, http: 422, condition: "appeal filed more than APPEAL_WINDOW_DAYS (30 days) after sanction created_at" }
  - { id: ERR_INVALID_PERIOD, http: 422, condition: "QA review period_end before period_start" }
  - { id: ERR_INVALID_ABATEMENT_FACTOR, http: 422, condition: "abatement_factor outside [0,1]" }
  - { id: ERR_REDUCTION_NOT_LOWER, http: 422, condition: "adjudicate REDUCED with reduced_total_cents >= total_amount_cents" }
  - { id: ERR_SELF_TRANSFER, http: 422, condition: "to_member is already the current holder of the moved right(s)" }
  - { id: ERR_NOT_RIGHTS_HOLDER, http: 409, condition: "Acting member does not hold the right(s) being moved (transfer), or is not servicer/investor (foreclose/satisfy/rescind)" }
  - { id: ERR_NOT_MATCH_PARTY, http: 403, condition: "Match confirm/reject attempted by a member other than the transfer's from-side" }
  - { id: ERR_NOT_SANCTION_PARTY, http: 403, condition: "Appeal/pay attempted by a member other than the sanctioned member" }
  - { id: ERR_SIGNER_NOT_AUTHORIZED, http: 403, condition: "signer_id missing, not ACTIVE, wrong member, role_scope does not cover FORECLOSURE, or outside its effective window" }
  - { id: ERR_SOD_SAME_ACTOR, http: 403, condition: "Segregation of duties violated: review creator settling own review, or review settler adjudicating the resulting sanction" }
  - { id: ERR_ASSIGNMENT_OUT_REQUIRED, http: 422, condition: "Foreclosure on an ASSIGN_OUT_REQUIRED loan without assignment_out=true" }
  - { id: ERR_FORECLOSURE_MODE_FORBIDS_ASSIGN_OUT, http: 422, condition: "assignment_out=true on an IN_REGISTRY_ALLOWED loan" }
  - { id: ERR_LOAN_NOT_IN_SAMPLE, http: 422, condition: "QA finding references a loan not registered by the reviewed member" }
  - { id: ERR_STALE_LOAN_VERSION, http: 412, condition: "expected_loan_version does not match the loan's current version (OCC)" }
  - { id: ERR_STALE_MEMBER_VERSION, http: 412, condition: "expected_member_version does not match the member's current version (OCC)" }

# =============================================================================
# §1.7 RBAC Matrix
# =============================================================================
roles:
  - name: RegistryAdmin
    description: "Registry operator staff; administers membership lifecycle, signers, annual reports, and the logical clock"
    identity: "opaque"
    exclusive_operations:
      - "POST /registry/members"
      - "POST /registry/members/{memberId}/activate"
      - "POST /registry/members/{memberId}/suspend"
      - "POST /registry/members/{memberId}/reinstate"
      - "POST /registry/members/{memberId}/terminate"
      - "POST /registry/members/{memberId}/signers"
      - "POST /registry/members/{memberId}/signers/{signerId}/revoke"
      - "POST /registry/members/{memberId}/annual-reports"
      - "POST /registry/_clock/set_current_utc"
    shared_operations:
      - "GET endpoints across members, loans, transfers, matches, reviews, findings, sanctions, reports, runs, exceptions"

  - name: MemberRep
    description: "Authorized representative acting as a member organization; X-User-ID equals the Member.id it represents"
    identity: "entity_backed:Member"
    exclusive_operations:
      - "POST /registry/loans"
      - "POST /registry/transfers"
      - "POST /registry/transfers/{transferId}/match-confirm"
      - "POST /registry/transfers/{transferId}/reject-match"
      - "POST /registry/loans/{loanId}/foreclose"
      - "POST /registry/loans/{loanId}/rescind-foreclosure"
      - "POST /registry/loans/{loanId}/satisfy"
      - "POST /registry/sor-reconciliation-runs"
      - "POST /registry/sor-exceptions/{exceptionId}/resolve"
      - "POST /registry/sanctions/{sanctionId}/appeal"
      - "POST /registry/sanctions/{sanctionId}/pay"
    shared_operations:
      - "GET endpoints across members, loans, transfers, matches, sanctions, reports, runs, exceptions"

  - name: QAAuditor
    description: "Quality assurance auditor; runs reviews, records findings, settles reviews, adjudicates sanctions (segregation of duties across settle/adjudicate)"
    identity: "opaque"
    exclusive_operations:
      - "POST /registry/qa-reviews"
      - "POST /registry/qa-reviews/{reviewId}/findings"
      - "POST /registry/qa-reviews/{reviewId}/issue"
      - "POST /registry/qa-reviews/{reviewId}/reopen"
      - "POST /registry/qa-reviews/{reviewId}/settle"
      - "POST /registry/sanctions/{sanctionId}/adjudicate"
    shared_operations:
      - "GET endpoints across members, signers, loans, transfers, matches, reviews, findings, sanctions, reports, runs, exceptions"

  - name: BorrowerInquirer
    description: "Borrower inquiry service account; identifies the current investor and servicer for a MIN"
    identity: "opaque"
    exclusive_operations:
      - "GET /registry/borrower-inquiries/{min}"
    shared_operations:
      - "GET /registry/loans"
      - "GET /registry/loans/{loanId}"
