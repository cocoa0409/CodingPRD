        distinguishing_aspect: "BOARD_INVESTMENT publish fails while two allocations sit BREACHED; acknowledging BOTH (US_EQUITY and CASH) clears the gate and the same publish then succeeds — a per-row acknowledgement, not a global one."
        test_recipe:
          setup: ["pool with allocations {US_EQUITY 5000/500, CASH 5000/500} and one engaged manager per class; Q1-Q3 finalized in band (5000000/5000000 each); Q4 reports shift values to 6000000/4000000 so both classes breach at finalize (actuals 6000/4000, drift 1000 > band 500); FY2026 complete"]
