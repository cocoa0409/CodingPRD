              as: PlantOperator
          assert:
            - "at report time the CRITICAL incident already moved farm to SUSPENDED and skipped the stop"
            - "after resolve: Farm.${f_id}.status == REMOVED and certification_status == DECERTIFIED (link 1)"
            - "FarmContract.${ct_id}.status == TERMINATED (link 2: caused by the removal, not by the incident directly)"
            - "SupplyCommitment.${c_id}.status == CANCELLED (link 3: week_start 2026-09-14 is strictly after the current date 2026-09-08)"
