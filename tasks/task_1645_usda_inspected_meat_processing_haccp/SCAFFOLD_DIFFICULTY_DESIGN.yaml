# =============================================================================
# §1.8 Scaffold Difficulty Design — USDA Meat Processing & HACCP
# 9 Difficulty Rules x 2 instances each = 18 instances.
# =============================================================================
scaffold_difficulty_design:
  # ---------------------------------------------------------------------------
  - rule_id: dual_variant_calc
    instances:
      - name: yield_cold_vs_hot_basis_divergence
        grounds:
          - calculations.carcass_cutout_yield
          - entities.CarcassLot.fields.fabrication_yield_pct
          - entities.CarcassLot.fields.packer_yield_pct
          - entities.CarcassLot.fields.drip_loss_pct
        distinguishing_aspect: |
          Same cut-out data yields two different percentages because the cold-basis
          variant (fabrication_yield_pct, entity domain CarcassLot) divides by cold
          weight while the hot-basis variant (packer_yield_pct) divides by hot weight;
          this instance lives in the carcass/yield domain, not the compliance domain.
        test_recipe:
          setup:
            - "Plant with EFFECTIVE RAW_GROUND plan, inspector ON_PREMISE, OPEN day on 2026-08-01"
            - "Lot harvested at hot 1030.0 lbs, chilled to cold 1000.0 lbs, FABRICATING with 3 cut records of 200.0625 lbs each"
          setup_api_calls:
            - { call: "POST /plants", payload: { establishment_number: "EST-1645-A", name: "Prairie Packing", district_code: "D25", cooler_capacity_lbs: 10000 }, as: PlantAdmin, captures: { plant_id: $.data.id } }
            - { call: "POST /plants/${plant_id}/haccp-plans", payload: { process_type: "RAW_GROUND" }, as: QAManager, captures: { plan_id: $.data.id } }
            - { call: "POST /haccp-plans/${plan_id}/ccps", payload: { ccp_code: "CCP-1B", hazard_category: "BIOLOGICAL", description: "Carcass chill cooler", critical_limit_min_f: 32.0, critical_limit_max_f: 40.0, monitoring_frequency_minutes: 60 }, as: QAManager }
            - { call: "POST /haccp-plans/${plan_id}/submit", payload: {}, as: QAManager }
            - { call: "POST /haccp-plans/${plan_id}/approve", payload: {}, as: Inspector, as_user_id: "insp-01" }
            - { call: "POST /haccp-plans/${plan_id}/activate", payload: {}, as: QAManager }
            - { call: "POST /plants/${plant_id}/inspector-shifts", payload: { inspector_user_id: "insp-01", scheduled_start: "2026-08-01T06:00:00Z", scheduled_end: "2026-08-01T18:00:00Z" }, as: PlantAdmin, captures: { shift_id: $.data.id } }
            - { call: "POST /_clock/set_current_utc", payload: { to_iso8601: "2026-08-01T07:00:00Z" }, as: PlantAdmin }
            - { call: "POST /inspector-shifts/${shift_id}/check-in", payload: {}, as: Inspector, as_user_id: "insp-01" }
            - { call: "POST /plants/${plant_id}/production-days", payload: { production_date: "2026-08-01", process_type: "RAW_GROUND" }, as: ProductionManager, captures: { day_id: $.data.id } }
            - { call: "POST /production-days/${day_id}/open", payload: {}, as: ProductionManager }
            - { call: "POST /production-days/${day_id}/lots", payload: { species: "BOVINE", supplier_name: "Verde Farms", head_count: 10, live_weight_lbs: 12500 }, as: ProductionManager, captures: { lot_id: $.data.id } }
            - { call: "POST /lots/${lot_id}/pass-ante-mortem", payload: {}, as: Inspector, as_user_id: "insp-01" }
            - { call: "POST /lots/${lot_id}/harvest", payload: { hot_carcass_weight_lbs: 1030.0 }, as: ProductionManager }
            - { call: "POST /lots/${lot_id}/chill-complete", payload: { cold_carcass_weight_lbs: 1000.0 }, as: ProductionManager }
            - { call: "POST /lots/${lot_id}/fabricate", payload: {}, as: ProductionManager }
            - { call: "POST /lots/${lot_id}/cut-records", payload: { primal_type: "CHUCK", weight_lbs: 200.0625 }, as: ProductionManager }
            - { call: "POST /lots/${lot_id}/cut-records", payload: { primal_type: "RIB", weight_lbs: 200.0625 }, as: ProductionManager }
            - { call: "POST /lots/${lot_id}/cut-records", payload: { primal_type: "LOIN", weight_lbs: 200.0625 }, as: ProductionManager }
          trigger:
            - { call: "POST /lots/${lot_id}/complete-fabrication", payload: { trim_waste_lbs: 399.8125 }, as: ProductionManager, captures: { fab_yield: $.data.fabrication_yield_pct, packer_yield: $.data.packer_yield_pct, drip: $.data.drip_loss_pct, grade: $.data.yield_grade, status_after: $.data.status } }
          assert:
            - "CarcassLot.${lot_id}.status == FABRICATED"
            - "CarcassLot.${lot_id}.fabrication_yield_pct == 60.02 (cold basis: 100*600.1875/1000.0 = 60.01875, round_half_up 2dp)"
            - "CarcassLot.${lot_id}.packer_yield_pct == 58.27 (hot basis: 100*600.1875/1030.0 = 58.27063..., round_half_up 2dp)"
            - "CarcassLot.${lot_id}.drip_loss_pct == 2.91"
            - "CarcassLot.${lot_id}.yield_grade == C (60.02 < 68.0)"
            - "fabrication_yield_pct != packer_yield_pct for identical cut data"

      - name: compliance_score_provisional_vs_official_divergence
        grounds:
          - calculations.plant_compliance_score
          - entities.Plant.fields.provisional_compliance_score
          - entities.Plant.fields.official_compliance_score
        distinguishing_aspect: |
          Same deviation data yields two different plant scores because the provisional
          variant flat-counts unresolved deviations (100 - 2*1 = 98) while the official
          variant severity-weights only VERIFIED deviations (100 - 5 - 2 = 93); this
          instance lives in the Plant/Deviation compliance domain, not the yield domain.
        test_recipe:
          setup:
            - "Plant with EFFECTIVE RAW_GROUND plan carrying CCP-B (BIOLOGICAL, max 40.0) and CCP-P (PHYSICAL, max 10.0), inspector ON_PREMISE, OPEN day on 2026-08-01"
            - "Deviation D1 (MAJOR, from CCP-B observation 41.0) VERIFIED; D2 (MINOR, from CCP-P observation 11.0) VERIFIED; D3 (MINOR, from CCP-P observation 12.0) left OPEN"
          setup_api_calls:
            - { call: "POST /plants", payload: { establishment_number: "EST-1645-B", name: "Prairie Packing", district_code: "D25", cooler_capacity_lbs: 10000 }, as: PlantAdmin, captures: { plant_id: $.data.id } }
            - { call: "POST /plants/${plant_id}/haccp-plans", payload: { process_type: "RAW_GROUND" }, as: QAManager, captures: { plan_id: $.data.id } }
            - { call: "POST /haccp-plans/${plan_id}/ccps", payload: { ccp_code: "CCP-B", hazard_category: "BIOLOGICAL", description: "Chill cooler", critical_limit_max_f: 40.0, monitoring_frequency_minutes: 60 }, as: QAManager, captures: { ccp_b: $.data.id } }
            - { call: "POST /haccp-plans/${plan_id}/ccps", payload: { ccp_code: "CCP-P", hazard_category: "PHYSICAL", description: "Metal detector", critical_limit_max_f: 10.0, monitoring_frequency_minutes: 30 }, as: QAManager, captures: { ccp_p: $.data.id } }
            - { call: "POST /haccp-plans/${plan_id}/submit", payload: {}, as: QAManager }
            - { call: "POST /haccp-plans/${plan_id}/approve", payload: {}, as: Inspector, as_user_id: "insp-01" }
            - { call: "POST /haccp-plans/${plan_id}/activate", payload: {}, as: QAManager }
            - { call: "POST /plants/${plant_id}/inspector-shifts", payload: { inspector_user_id: "insp-01", scheduled_start: "2026-08-01T06:00:00Z", scheduled_end: "2026-08-01T18:00:00Z" }, as: PlantAdmin, captures: { shift_id: $.data.id } }
            - { call: "POST /_clock/set_current_utc", payload: { to_iso8601: "2026-08-01T07:00:00Z" }, as: PlantAdmin }
            - { call: "POST /inspector-shifts/${shift_id}/check-in", payload: {}, as: Inspector, as_user_id: "insp-01" }
            - { call: "POST /plants/${plant_id}/production-days", payload: { production_date: "2026-08-01", process_type: "RAW_GROUND" }, as: ProductionManager, captures: { day_id: $.data.id } }
            - { call: "POST /production-days/${day_id}/open", payload: {}, as: ProductionManager }
            - { call: "POST /ccps/${ccp_b}/observations", payload: { observed_value_f: 41.0 }, as: QATech, as_user_id: "qa-tech-1", captures: { dev1: $.data.deviation_id } }
            - { call: "POST /ccps/${ccp_p}/observations", payload: { observed_value_f: 11.0 }, as: QATech, as_user_id: "qa-tech-1", captures: { dev2: $.data.deviation_id } }
            - { call: "POST /ccps/${ccp_p}/observations", payload: { observed_value_f: 12.0 }, as: QATech, as_user_id: "qa-tech-1", captures: { dev3: $.data.deviation_id } }
            - { call: "POST /deviations/${dev1}/log-corrective-action", payload: { corrective_action_note: "Rechilled and re-monitored" }, as: QAManager, as_user_id: "qa-mgr-1" }
            - { call: "POST /deviations/${dev1}/verify", payload: {}, as: QAManager, as_user_id: "qa-mgr-2" }
            - { call: "POST /deviations/${dev2}/log-corrective-action", payload: { corrective_action_note: "Recalibrated detector" }, as: QAManager, as_user_id: "qa-mgr-1" }
            - { call: "POST /deviations/${dev2}/verify", payload: {}, as: QAManager, as_user_id: "qa-mgr-2" }
          trigger:
            - { call: "GET /plants/${plant_id}", as: QAManager, captures: { prov: $.data.provisional_compliance_score, off: $.data.official_compliance_score } }
          assert:
            - "Plant.${plant_id}.provisional_compliance_score == 98 (100 - 2 x 1 unresolved deviation D3)"
            - "Plant.${plant_id}.official_compliance_score == 93 (100 - 5 MAJOR - 2 MINOR over VERIFIED only)"
            - "provisional_compliance_score != official_compliance_score for identical deviation data"

  # ---------------------------------------------------------------------------
  - rule_id: combinatorial_formula
    instances:
      - name: shelf_life_tiered_penalty_schedule
        grounds:
          - calculations.shelf_life_dating
          - entities.FinishedLot.fields.penalty_hours
          - entities.FinishedLot.fields.use_by_at
        distinguishing_aspect: |
          Mode (a) instance: the penalty formula has >= 3 inputs (temp_f, interval
          duration, shelf_life_days) with non-linear tiered multipliers (1.0x/1.5x/2.0x)
          and a nested max() floor at production_date; 4h at 46F plus 2h at 52F accrue
          4*1.5 + 2*2.0 = 10.0 penalty hours.
        test_recipe:
          setup:
            - "Plant with EFFECTIVE plan, inspector ON_PREMISE, OPEN day, FABRICATED lot, APPROVED label"
            - "FinishedLot created at clock 2026-08-01T07:00:00Z with shelf_life_days 10 (base use-by 2026-08-11T07:00:00Z)"
          setup_api_calls:
            - { call: "POST /plants", payload: { establishment_number: "EST-1645-C", name: "Prairie Packing", district_code: "D25", cooler_capacity_lbs: 10000 }, as: PlantAdmin, captures: { plant_id: $.data.id } }
            - { call: "POST /plants/${plant_id}/haccp-plans", payload: { process_type: "RAW_GROUND" }, as: QAManager, captures: { plan_id: $.data.id } }
            - { call: "POST /haccp-plans/${plan_id}/ccps", payload: { ccp_code: "CCP-1B", hazard_category: "BIOLOGICAL", description: "Chill cooler", critical_limit_max_f: 40.0, monitoring_frequency_minutes: 60 }, as: QAManager }
            - { call: "POST /haccp-plans/${plan_id}/submit", payload: {}, as: QAManager }
            - { call: "POST /haccp-plans/${plan_id}/approve", payload: {}, as: Inspector, as_user_id: "insp-01" }
            - { call: "POST /haccp-plans/${plan_id}/activate", payload: {}, as: QAManager }
            - { call: "POST /plants/${plant_id}/inspector-shifts", payload: { inspector_user_id: "insp-01", scheduled_start: "2026-08-01T06:00:00Z", scheduled_end: "2026-08-01T18:00:00Z" }, as: PlantAdmin, captures: { shift_id: $.data.id } }
            - { call: "POST /_clock/set_current_utc", payload: { to_iso8601: "2026-08-01T07:00:00Z" }, as: PlantAdmin }
            - { call: "POST /inspector-shifts/${shift_id}/check-in", payload: {}, as: Inspector, as_user_id: "insp-01" }
            - { call: "POST /plants/${plant_id}/production-days", payload: { production_date: "2026-08-01", process_type: "RAW_GROUND" }, as: ProductionManager, captures: { day_id: $.data.id } }
            - { call: "POST /production-days/${day_id}/open", payload: {}, as: ProductionManager }
            - { call: "POST /production-days/${day_id}/lots", payload: { species: "BOVINE", supplier_name: "Verde Farms", head_count: 10, live_weight_lbs: 12500 }, as: ProductionManager, captures: { lot_id: $.data.id } }
            - { call: "POST /lots/${lot_id}/pass-ante-mortem", payload: {}, as: Inspector, as_user_id: "insp-01" }
            - { call: "POST /lots/${lot_id}/harvest", payload: { hot_carcass_weight_lbs: 1030.0 }, as: ProductionManager }
            - { call: "POST /lots/${lot_id}/chill-complete", payload: { cold_carcass_weight_lbs: 1000.0 }, as: ProductionManager }
            - { call: "POST /lots/${lot_id}/fabricate", payload: {}, as: ProductionManager }
            - { call: "POST /lots/${lot_id}/cut-records", payload: { primal_type: "CHUCK", weight_lbs: 600.0 }, as: ProductionManager }
            - { call: "POST /lots/${lot_id}/complete-fabrication", payload: { trim_waste_lbs: 400.0 }, as: ProductionManager }
            - { call: "POST /plants/${plant_id}/label-approvals", payload: { product_name: "Ground Beef 80/20", claims: ["NATURAL"], substantiation_doc_refs: ["doc-nat-1"], formulation_version: 1 }, as: QAManager, captures: { label_id: $.data.id } }
            - { call: "POST /label-approvals/${label_id}/submit", payload: {}, as: QAManager }
            - { call: "POST /label-approvals/${label_id}/approve", payload: {}, as: Inspector, as_user_id: "insp-01" }
            - { call: "POST /production-days/${day_id}/finished-lots", payload: { source_lot_id: "${lot_id}", label_approval_id: "${label_id}", units_produced: 10, unit_weight_lbs: 10.0, shelf_life_days: 10 }, as: ProductionManager, captures: { fl_id: $.data.id, prod_date: $.data.production_date, base_use_by: $.data.base_use_by_at } }
            - { call: "POST /_clock/set_current_utc", payload: { to_iso8601: "2026-08-02T00:00:00Z" }, as: PlantAdmin }
            - { call: "POST /finished-lots/${fl_id}/log-temperature", payload: { temp_f: 46.0 }, as: ProductionManager }
            - { call: "POST /_clock/set_current_utc", payload: { to_iso8601: "2026-08-02T04:00:00Z" }, as: PlantAdmin }
            - { call: "POST /finished-lots/${fl_id}/log-temperature", payload: { temp_f: 38.0 }, as: ProductionManager }
            - { call: "POST /_clock/set_current_utc", payload: { to_iso8601: "2026-08-03T00:00:00Z" }, as: PlantAdmin }
            - { call: "POST /finished-lots/${fl_id}/log-temperature", payload: { temp_f: 52.0 }, as: ProductionManager }
            - { call: "POST /_clock/set_current_utc", payload: { to_iso8601: "2026-08-03T02:00:00Z" }, as: PlantAdmin }
          trigger:
            - { call: "POST /finished-lots/${fl_id}/log-temperature", payload: { temp_f: 39.0 }, as: ProductionManager, captures: { use_by: $.data.use_by_at, penalty: $.data.penalty_hours, fl_status: $.data.status } }
          assert:
            - "FinishedLot.${fl_id}.production_date == 2026-08-01T07:00:00Z"
            - "FinishedLot.${fl_id}.base_use_by_at == 2026-08-11T07:00:00Z"
            - "FinishedLot.${fl_id}.penalty_hours == 10.0 (4h at 46F x 1.5 = 6.0; 2h at 52F x 2.0 = 4.0)"
            - "FinishedLot.${fl_id}.use_by_at == 2026-08-10T21:00:00Z"
            - "FinishedLot.${fl_id}.status == PRODUCED (use_by_at still after current clock 2026-08-03T02:00:00Z)"

      - name: yield_per_line_vs_total_rounding_order
        grounds:
          - calculations.carcass_cutout_yield
          - entities.CutRecord.fields.pct_of_cold_weight
          - entities.CarcassLot.fields.fabrication_yield_pct
        distinguishing_aspect: |
          Mode (b) instance (different mode than the tiered-penalty instance): per-line
          pct_of_cold_weight is rounded per line (12.50 + 12.50 = 25.00) while the
          lot-level fabrication_yield_pct rounds the unrounded sum once (25.00625 ->
          25.01); the scaffold pins sum-then-round as authoritative, so the two orders
          observably diverge by 0.01.
        test_recipe:
          setup:
            - "Plant with EFFECTIVE plan, inspector ON_PREMISE, OPEN day"
            - "Lot hot 820.0 lbs, cold 800.0 lbs, FABRICATING with 2 cut records of 100.025 lbs each"
          setup_api_calls:
            - { call: "POST /plants", payload: { establishment_number: "EST-1645-D", name: "Prairie Packing", district_code: "D25", cooler_capacity_lbs: 10000 }, as: PlantAdmin, captures: { plant_id: $.data.id } }
            - { call: "POST /plants/${plant_id}/haccp-plans", payload: { process_type: "RAW_GROUND" }, as: QAManager, captures: { plan_id: $.data.id } }
            - { call: "POST /haccp-plans/${plan_id}/ccps", payload: { ccp_code: "CCP-1B", hazard_category: "BIOLOGICAL", description: "Chill cooler", critical_limit_max_f: 40.0, monitoring_frequency_minutes: 60 }, as: QAManager }
            - { call: "POST /haccp-plans/${plan_id}/submit", payload: {}, as: QAManager }
            - { call: "POST /haccp-plans/${plan_id}/approve", payload: {}, as: Inspector, as_user_id: "insp-01" }
            - { call: "POST /haccp-plans/${plan_id}/activate", payload: {}, as: QAManager }
            - { call: "POST /plants/${plant_id}/inspector-shifts", payload: { inspector_user_id: "insp-01", scheduled_start: "2026-08-01T06:00:00Z", scheduled_end: "2026-08-01T18:00:00Z" }, as: PlantAdmin, captures: { shift_id: $.data.id } }
            - { call: "POST /_clock/set_current_utc", payload: { to_iso8601: "2026-08-01T07:00:00Z" }, as: PlantAdmin }
            - { call: "POST /inspector-shifts/${shift_id}/check-in", payload: {}, as: Inspector, as_user_id: "insp-01" }
            - { call: "POST /plants/${plant_id}/production-days", payload: { production_date: "2026-08-01", process_type: "RAW_GROUND" }, as: ProductionManager, captures: { day_id: $.data.id } }
            - { call: "POST /production-days/${day_id}/open", payload: {}, as: ProductionManager }
            - { call: "POST /production-days/${day_id}/lots", payload: { species: "SWINE", supplier_name: "Verde Farms", head_count: 20, live_weight_lbs: 5200 }, as: ProductionManager, captures: { lot_id: $.data.id } }
            - { call: "POST /lots/${lot_id}/pass-ante-mortem", payload: {}, as: Inspector, as_user_id: "insp-01" }
            - { call: "POST /lots/${lot_id}/harvest", payload: { hot_carcass_weight_lbs: 820.0 }, as: ProductionManager }
            - { call: "POST /lots/${lot_id}/chill-complete", payload: { cold_carcass_weight_lbs: 800.0 }, as: ProductionManager }
            - { call: "POST /lots/${lot_id}/fabricate", payload: {}, as: ProductionManager }
            - { call: "POST /lots/${lot_id}/cut-records", payload: { primal_type: "BELLY", weight_lbs: 100.025 }, as: ProductionManager, captures: { cut1_pct: $.data.pct_of_cold_weight } }
            - { call: "POST /lots/${lot_id}/cut-records", payload: { primal_type: "HAM", weight_lbs: 100.025 }, as: ProductionManager, captures: { cut2_pct: $.data.pct_of_cold_weight } }
          trigger:
            - { call: "POST /lots/${lot_id}/complete-fabrication", payload: { trim_waste_lbs: 599.95 }, as: ProductionManager, captures: { fab_yield: $.data.fabrication_yield_pct } }
          assert:
            - "CutRecord[0].pct_of_cold_weight == 12.5 (per-line round of 12.503125)"
            - "CutRecord[1].pct_of_cold_weight == 12.5"
            - "CarcassLot.${lot_id}.fabrication_yield_pct == 25.01 (sum-then-round of 25.00625)"
            - "sum of per-line pcts (25.0) != fabrication_yield_pct (25.01) — rounding order is observable and pinned"

  # ---------------------------------------------------------------------------
  - rule_id: non_linear_state_machine
    instances:
      - name: haccp_plan_reject_resubmit_cycle_and_supersede
        grounds:
          - state_machines.HACCPPlan.REJECTED_to_SUBMITTED
          - state_machines.HACCPPlan.APPROVED_to_EFFECTIVE
        distinguishing_aspect: |
          Cyclic machine on HACCPPlan (REJECTED -> SUBMITTED resubmission loop with
          revision_number incrementing) plus the EFFECTIVE -> SUPERSEDED auto-transition
          when a sibling plan for the same (plant, process_type) activates; the second
          rule-3 instance cycles a different entity (ProductionDay).
        test_recipe:
          setup:
            - "Plant registered; no plans yet"
          setup_api_calls:
            - { call: "POST /plants", payload: { establishment_number: "EST-1645-E", name: "Prairie Packing", district_code: "D25", cooler_capacity_lbs: 10000 }, as: PlantAdmin, captures: { plant_id: $.data.id } }
            - { call: "POST /plants/${plant_id}/haccp-plans", payload: { process_type: "RAW_GROUND" }, as: QAManager, captures: { plan_id: $.data.id, rev0: $.data.revision_number } }
            - { call: "POST /haccp-plans/${plan_id}/ccps", payload: { ccp_code: "CCP-1B", hazard_category: "BIOLOGICAL", description: "Chill cooler", critical_limit_max_f: 40.0, monitoring_frequency_minutes: 60 }, as: QAManager }
            - { call: "POST /haccp-plans/${plan_id}/submit", payload: {}, as: QAManager, captures: { st1: $.data.status } }
            - { call: "POST /haccp-plans/${plan_id}/reject", payload: { rejection_reason: "Monitoring frequency unspecified for CCP-2" }, as: Inspector, as_user_id: "insp-01", captures: { st2: $.data.status } }
            - { call: "POST /haccp-plans/${plan_id}/submit", payload: {}, as: QAManager, captures: { st3: $.data.status, rev1: $.data.revision_number } }
            - { call: "POST /haccp-plans/${plan_id}/approve", payload: {}, as: Inspector, as_user_id: "insp-01" }
            - { call: "POST /haccp-plans/${plan_id}/activate", payload: {}, as: QAManager, captures: { st4: $.data.status } }
            - { call: "POST /plants/${plant_id}/haccp-plans", payload: { process_type: "RAW_GROUND" }, as: QAManager, captures: { plan2_id: $.data.id } }
            - { call: "POST /haccp-plans/${plan2_id}/ccps", payload: { ccp_code: "CCP-1B", hazard_category: "BIOLOGICAL", description: "Chill cooler v2", critical_limit_max_f: 40.0, monitoring_frequency_minutes: 30 }, as: QAManager }
            - { call: "POST /haccp-plans/${plan2_id}/submit", payload: {}, as: QAManager }
            - { call: "POST /haccp-plans/${plan2_id}/approve", payload: {}, as: Inspector, as_user_id: "insp-01" }
          trigger:
            - { call: "POST /haccp-plans/${plan2_id}/activate", payload: {}, as: QAManager, captures: { plan2_status: $.data.status } }
            - { call: "GET /haccp-plans/${plan_id}", as: QAManager, captures: { plan1_status: $.data.status } }
          assert:
            - "HACCPPlan.${plan_id} initial revision_number == 0"
            - "status after first submit == SUBMITTED, after reject == REJECTED, after resubmit == SUBMITTED with revision_number == 1"
            - "HACCPPlan.${plan_id} status == EFFECTIVE after activate, then == SUPERSEDED after plan2 activates"
            - "HACCPPlan.${plan2_id} status == EFFECTIVE (at most one EFFECTIVE plan per (plant, process_type))"

      - name: production_day_open_suspend_resume_cycle
        grounds:
          - state_machines.ProductionDay.OPEN_to_SUSPENDED
