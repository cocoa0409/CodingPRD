            - call: "GET /royalty-statements/${issued_stmt}"
              payload: {}
              as: LicensingManager
              as_user_id: "lm-1"
          assert:
            - "trigger 1 responds 422 ERR_VALIDATION: period_end_date is missing, and rung 40 fires even though the run id does not exist and the version is stale — body shape is checked before anything is looked up"
            - "trigger 2 responds 404 ERR_RUN_NOT_FOUND: the shape is now complete, so rung 50 resolves the body foreign key and fails before the OCC guard at rung 60 can compare versions"
            - "trigger 3 responds 412 ERR_RUN_VERSION_CONFLICT: the run resolves, so rung 60 fires on the stale expected_run_version and the out-of-term period at rung 100 is never reached"
            - "trigger 4 responds 422 ERR_PERIOD_OUTSIDE_TERM: with a fresh version the ladder advances to rung 100, where 2026-07-01 precedes the agreement term"
            - "trigger 5 responds 412 ERR_RUN_VERSION_CONFLICT, NOT 409 ERR_STATEMENT_PERIOD_ISSUED: the period does collide with the ISSUED statement, but rung 60 precedes rung 150"
            - "trigger 6 responds 409 ERR_STATEMENT_PERIOD_ISSUED: with a fresh version the ladder finally reaches rung 150, which refuses to supersede an ISSUED statement"
            - "trigger 7 responds 201 for a clean period, proving the endpoint still works when no rung is violated"
            - "trigger 8 reports the ISSUED statement unchanged: status still ISSUED, superseded_by_statement_id still null and the same version it had after finalisation, so none of the six refused calls mutated it"

      - name: clock_position_gates_hold_at_four_different_edges
        claim_type: temporal_validation
        grounds:
          - validations[priority 105]
          - errors[ERR_LEASE_START_NOT_REACHED]
          - errors[ERR_TERM_NOT_ENDED]
          - errors[ERR_SHIFT_NOT_ENDED]
          - errors[ERR_PERIOD_NOT_ENDED]
        distinguishing_aspect: |
          Four gates on one priority with two different edge conventions: a lease activates ON or
          after its start date and a shift completes ON or after its end instant (inclusive), while
          an agreement expires and a statement finalises only STRICTLY after their end dates
          (exclusive). Sharing one comparison operator across the four breaks two of them, and each
          gate carries its own error id at 409 rather than the generic invalid-state error, so a
          state-first implementation that reports ERR_VENUE_INVALID_STATE also fails.
