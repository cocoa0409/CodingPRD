  - section: validations
    instances:
      - name: exempt_establishment_blocks_classification
        claim_type: violation_to_error
        grounds: ["validations[priority=4]", "errors[ERR_ESTABLISHMENT_EXEMPT]"]
        distinguishing_aspect: "is_partially_exempt == true establishment rejects classify with ERR_ESTABLISHMENT_EXEMPT, but severe-injury report filing remains allowed."
        test_recipe:
          setup: ["Exempt establishment EX, employee W, case K on EX"]
          setup_api_calls:
            - call: "POST /safety/companies"
              payload: { legal_name: "Exempt Co", fein: "01-0000019" }
              as: PlatformAdmin
              captures: { co_id: $.data.id }
            - call: "POST /safety/establishments"
              payload: { company_id: "${co_id}", site_name: "Retail Kiosk", naics_code: "452210", state_code: "OH", size_class: "SMALL", is_partially_exempt: true }
              as: PlatformAdmin
              captures: { est_id: $.data.id }
            - call: "POST /safety/employees"
              payload: { company_id: "${co_id}", full_name: "Ex Worker", job_title: "Clerk", hire_date: "2024-01-01" }
              as: RecordkeepingCoordinator
              captures: { emp_id: $.data.id }
            - call: "POST /safety/_clock/set_current_utc"
              payload: { to_iso8601: "2026-08-01T12:00:00Z" }
              as: PlatformAdmin
            - call: "POST /safety/cases"
              payload: { establishment_id: "${est_id}", employee_id: "${emp_id}", occurred_at: "2026-08-01T10:00:00Z", description: "Paper cut", body_part: "finger", event_type: "INJURY", is_severe_event: "AMPUTATION" }
              as: SafetyOfficer
              captures: { case_id: $.data.id, case_v: $.data.version }
          trigger:
            - call: "POST /safety/cases/${case_id}/classify"
              payload: { classification: "MEDICAL_TREATMENT", expected_case_version: "${case_v}" }
              as: SafetyOfficer
              captures: { err: $.data.error_id }
            - call: "POST /safety/cases/${case_id}/severe-reports"
              payload: { report_kind: "AMPUTATION", occurred_at: "2026-08-01T10:00:00Z", reported_to_agency_at: "2026-08-01T20:00:00Z" }
              as: SafetyOfficer
              captures: { sev_status: $.data.status }
          assert:
            - "classify -> error_id == ERR_ESTABLISHMENT_EXEMPT"
            - "severe report filing succeeds even for exempt establishment: status == TIMELY"

      - name: cross_company_employee_reference_rejected
        claim_type: violation_to_error
        grounds: ["validations[priority=7]", "errors[ERR_CROSS_COMPANY_REFERENCE]"]
        distinguishing_aspect: "Case intake with employee from Company A but establishment from Company B -> ERR_CROSS_COMPANY_REFERENCE 422."
        test_recipe:
          setup: ["Companies A and B; employee in A; establishment in B"]
          setup_api_calls:
            - call: "POST /safety/companies"
              payload: { legal_name: "Co Alpha", fein: "02-0000020" }
              as: PlatformAdmin
              captures: { co_a: $.data.id }
            - call: "POST /safety/companies"
              payload: { legal_name: "Co Beta", fein: "02-0000021" }
              as: PlatformAdmin
              captures: { co_b: $.data.id }
            - call: "POST /safety/employees"
              payload: { company_id: "${co_a}", full_name: "Alpha Worker", job_title: "Tech", hire_date: "2024-01-01" }
              as: RecordkeepingCoordinator
              captures: { emp_a: $.data.id }
            - call: "POST /safety/establishments"
              payload: { company_id: "${co_b}", site_name: "Beta Site", naics_code: "332710", state_code: "OH", size_class: "SMALL" }
              as: PlatformAdmin
              captures: { est_b: $.data.id }
          trigger:
            - call: "POST /safety/cases"
              payload: { establishment_id: "${est_b}", employee_id: "${emp_a}", occurred_at: "2026-08-01T10:00:00Z", description: "X-co", body_part: "arm", event_type: "INJURY" }
              as: SafetyOfficer
              captures: { err: $.data.error_id }
          assert:
            - "error_id == ERR_CROSS_COMPANY_REFERENCE"

      - name: day_interval_end_before_start_rejected
        claim_type: violation_to_error
        grounds: ["validations[priority=10]", "errors[ERR_DAY_INTERVAL_INVALID]"]
        distinguishing_aspect: "end_date < start_date -> ERR_DAY_INTERVAL_INVALID."
        test_recipe:
          setup: ["Case K RECORDABLE"]
          setup_api_calls:
            - call: "POST /safety/companies"
              payload: { legal_name: "DI Co", fein: "03-0000022" }
              as: PlatformAdmin
              captures: { co_id: $.data.id }
            - call: "POST /safety/establishments"
