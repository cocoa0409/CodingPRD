            - "the BOS row has revenue_share_units_snapshot == 3, equal_component_cents == 167500, weighted_component_cents == 50250, remainder_cent_applied == 1, amount_cents == 217751"
            - "the CHI row has revenue_share_units_snapshot == 2, equal_component_cents == 167500, weighted_component_cents == 33500, remainder_cent_applied == 0, amount_cents == 201000"
