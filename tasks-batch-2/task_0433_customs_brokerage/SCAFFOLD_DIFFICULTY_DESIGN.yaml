scaffold_difficulty_design:

  # =========================================================================
  - rule_id: dual_variant_calc
    instances:
      - name: entry_provisional_vs_final_charges_diverge_on_unverified_usmca
        grounds:
          - calculations.compute_entry_charges
          - calculations.compute_line_duty
          - state_machines.CustomsEntry.FILED_to_RELEASED
          - state_machines.CustomsEntry.RELEASED_to_LIQUIDATED
          - entities.CustomsEntry.fields.provisional_total_cents
          - entities.CustomsEntry.fields.final_total_cents
        distinguishing_aspect: |
          On the CustomsEntry domain: a USMCA-claimed apparel line from origin CN produces
          provisional_total_cents == 520 (duty trusted to 0, MPF waived) at FILED but
          final_total_cents == 69735 at LIQUIDATED (duty restored to 66000, MPF floor 3215
          applied) — same inputs, two algorithms, different totals.
        test_recipe:
          setup:
            - "Importer ACTIVE owned by imp-user-1, CONTINUOUS bond ACTIVE with a high limit."
            - "ISFFiling FILED with all 10 data elements and vessel_eta 2026-06-10T00:00:00Z."
            - "Entry country_of_origin=CN with one apparel line (hts 6109100012, customs_value 400000) claiming USMCA, FILED then RELEASED."
            - "Clock at 2026-06-05T00:00:00Z throughout."
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-06-05T00:00:00Z" }
              as: AccountAdmin
            - call: "POST /importers"
              payload: { name: "Acme Imports", ior_number: "IOR-DV-001", owner_user_id: "imp-user-1" }
              as: AccountAdmin
              captures: { imp_id: $.data.id }
            - call: "POST /bonds"
              payload: { importer_id: "${imp_id}", bond_type: "CONTINUOUS", limit_cents: 100000000 }
              as: AccountAdmin
              captures: { bond_id: $.data.id }
            - call: "POST /bonds/${bond_id}/activate"
              payload: {}
              as: AccountAdmin
            - call: "POST /isf-filings"
              payload: { importer_id: "${imp_id}", bill_of_lading: "BOL-DV-001", vessel_eta: "2026-06-10T00:00:00Z", data_element_count: 10 }
              as: LicensedBroker
              captures: { isf_id: $.data.id }
            - call: "POST /isf-filings/${isf_id}/file"
              payload: {}
              as: LicensedBroker
            - call: "POST /entries"
              payload: { importer_id: "${imp_id}", bond_id: "${bond_id}", isf_filing_id: "${isf_id}", entry_type: "CONSUMPTION_01", country_of_origin: "CN", entry_date: "2026-06-10T00:00:00Z" }
              as: LicensedBroker
              captures: { entry_id: $.data.id }
            - call: "POST /entries/${entry_id}/lines"
              payload: { hts_code: "6109100012", customs_value_cents: 400000, quantity: 10, preference_claim: "USMCA" }
              as: LicensedBroker
            - call: "POST /entries/${entry_id}/file"
              payload: {}
              as: LicensedBroker
              captures: { prov_total: $.data.provisional_total_cents }
            - call: "POST /entries/${entry_id}/review"
              payload: { action: "RELEASE" }
              as: CBPOfficer
              as_user_id: "officer-1"
          trigger:
            - call: "POST /entries/${entry_id}/liquidate"
              payload: {}
              as: CBPOfficer
              as_user_id: "officer-1"
              captures: { final_total: $.data.final_total_cents }
          assert:
            - "CustomsEntry.${entry_id}.provisional_total_cents == 520"
            - "CustomsEntry.${entry_id}.final_total_cents == 69735"
            - "CustomsEntry.${entry_id}.total_duties_owed_cents == 69735"

      - name: psc_grant_adjustment_vs_zero_when_preference_verified
        grounds:
          - calculations.compute_psc_adjustment
          - state_machines.PostSummaryCorrection.SUBMITTED_to_GRANTED
          - entities.PostSummaryCorrection.fields.adjustment_cents
          - entities.EntryLine.fields.preference_verified
        distinguishing_aspect: |
          On the PostSummaryCorrection domain (different entity from the entry-charges dual
          variant): granting a PSC with corrected_value_delta_cents=200000 on a no-preference
          general-rate entry yields adjustment_cents == 10000, whereas the same delta on an
          entry whose every line preference_verified==true yields adjustment_cents == 0.
        test_recipe:
          setup:
            - "A LIQUIDATED general-rate entry (origin CN, single ch94 line, no preference, customs_value 1000000)."
            - "Bond/importer/ISF set up as in the canonical chain; clock at 2026-06-05T00:00:00Z."
            - "A PSC SUBMITTED against the LIQUIDATED entry with corrected_value_delta_cents=200000."
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-06-05T00:00:00Z" }
              as: AccountAdmin
            - call: "POST /importers"
              payload: { name: "Acme Imports", ior_number: "IOR-DV-002", owner_user_id: "imp-user-1" }
              as: AccountAdmin
              captures: { imp_id: $.data.id }
            - call: "POST /bonds"
              payload: { importer_id: "${imp_id}", bond_type: "CONTINUOUS", limit_cents: 100000000 }
              as: AccountAdmin
              captures: { bond_id: $.data.id }
            - call: "POST /bonds/${bond_id}/activate"
              payload: {}
              as: AccountAdmin
            - call: "POST /isf-filings"
              payload: { importer_id: "${imp_id}", bill_of_lading: "BOL-DV-002", vessel_eta: "2026-06-10T00:00:00Z", data_element_count: 10 }
              as: LicensedBroker
              captures: { isf_id: $.data.id }
            - call: "POST /isf-filings/${isf_id}/file"
              payload: {}
              as: LicensedBroker
            - call: "POST /entries"
              payload: { importer_id: "${imp_id}", bond_id: "${bond_id}", isf_filing_id: "${isf_id}", entry_type: "CONSUMPTION_01", country_of_origin: "CN", entry_date: "2026-06-10T00:00:00Z" }
              as: LicensedBroker
              captures: { entry_id: $.data.id }
            - call: "POST /entries/${entry_id}/lines"
              payload: { hts_code: "9403600080", customs_value_cents: 1000000, quantity: 5, preference_claim: "NONE" }
              as: LicensedBroker
            - call: "POST /entries/${entry_id}/file"
              payload: {}
              as: LicensedBroker
            - call: "POST /entries/${entry_id}/review"
              payload: { action: "RELEASE" }
              as: CBPOfficer
              as_user_id: "officer-1"
            - call: "POST /entries/${entry_id}/liquidate"
              payload: {}
              as: CBPOfficer
              as_user_id: "officer-1"
              captures: { entry_v: $.data.version }
            - call: "POST /post-summary-corrections"
              payload: { entry_id: "${entry_id}", filing_kind: "PSC", corrected_value_delta_cents: 200000, expected_entry_version: "${entry_v}" }
              as: LicensedBroker
              captures: { psc_id: $.data.id }
          trigger:
            - call: "POST /post-summary-corrections/${psc_id}/grant"
              payload: {}
              as: CBPOfficer
              as_user_id: "officer-1"
              captures: { adj: $.data.adjustment_cents }
          assert:
            - "PostSummaryCorrection.${psc_id}.adjustment_cents == 10000"
            - "PostSummaryCorrection.${psc_id}.status == GRANTED"
            - "CustomsEntry.${entry_id}.final_total_cents == 64800"

  # =========================================================================
  - rule_id: combinatorial_formula
    instances:
      - name: mpf_floor_ceiling_nonlinear_min_max
        grounds:
          - calculations.compute_entry_charges
          - entities.CustomsEntry.fields.provisional_total_cents
        distinguishing_aspect: |
          Mode (a): MPF = min(MPF_MAX_CENTS, max(MPF_MIN_CENTS, round(total_dutiable_value*MPF_RATE_BPS/10000)))
          nests max-then-min over 3 inputs. A tiny entry (total_dutiable_value=50000 -> mpf_raw=175)
          clamps UP to the floor 3215, proving the nested min/max selects the floor, not the raw value.
        test_recipe:
          setup:
            - "Canonical chain to a FILED entry, origin CN, single ch94 general line customs_value=50000."
            - "Clock 2026-06-05T00:00:00Z; bond high limit."
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-06-05T00:00:00Z" }
              as: AccountAdmin
            - call: "POST /importers"
              payload: { name: "Acme Imports", ior_number: "IOR-CF-001", owner_user_id: "imp-user-1" }
              as: AccountAdmin
              captures: { imp_id: $.data.id }
            - call: "POST /bonds"
              payload: { importer_id: "${imp_id}", bond_type: "CONTINUOUS", limit_cents: 100000000 }
              as: AccountAdmin
              captures: { bond_id: $.data.id }
            - call: "POST /bonds/${bond_id}/activate"
              payload: {}
              as: AccountAdmin
            - call: "POST /isf-filings"
              payload: { importer_id: "${imp_id}", bill_of_lading: "BOL-CF-001", vessel_eta: "2026-06-10T00:00:00Z", data_element_count: 10 }
              as: LicensedBroker
              captures: { isf_id: $.data.id }
            - call: "POST /isf-filings/${isf_id}/file"
              payload: {}
              as: LicensedBroker
            - call: "POST /entries"
              payload: { importer_id: "${imp_id}", bond_id: "${bond_id}", isf_filing_id: "${isf_id}", entry_type: "CONSUMPTION_01", country_of_origin: "CN", entry_date: "2026-06-10T00:00:00Z" }
              as: LicensedBroker
              captures: { entry_id: $.data.id }
            - call: "POST /entries/${entry_id}/lines"
              payload: { hts_code: "9403600080", customs_value_cents: 50000, quantity: 1, preference_claim: "NONE" }
              as: LicensedBroker
          trigger:
            - call: "POST /entries/${entry_id}/file"
              payload: {}
              as: LicensedBroker
              captures: { prov_total: $.data.provisional_total_cents }
          assert:
            - "CustomsEntry.${entry_id}.provisional_total_cents == 5780"

      - name: duty_round_per_line_then_sum_order_pinned
        grounds:
          - calculations.compute_line_duty
          - calculations.compute_entry_charges
          - entities.EntryLine.fields.line_duty_cents
        distinguishing_aspect: |
          Mode (b): rounding ORDER is pinned to round-PER-LINE then sum and genuinely DIVERGES from
          sum-then-round. Line A dv=500070 at 1650bps = 82511.55 -> 82512; line B dv=300070 =
          49511.55 -> 49512; per-line sum = 132024. The sum-then-round path (800140*1650/10000 =
          132023.1 -> 132023) yields 132023 — one cent less. The scaffold pins round-per-line, so the
          entry duty component is 132024 and provisional_total_cents == 136279, NOT 136278.
        test_recipe:
          setup:
            - "Canonical chain; origin CN; two apparel ch62 lines with values chosen so per-line rounding != sum-then-round."
            - "Line A customs_value 500070 (duty 1650bps), Line B customs_value 300070 (duty 1650bps), no preference."
            - "Clock 2026-06-05T00:00:00Z; bond high limit."
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-06-05T00:00:00Z" }
              as: AccountAdmin
            - call: "POST /importers"
              payload: { name: "Acme Imports", ior_number: "IOR-CF-002", owner_user_id: "imp-user-1" }
              as: AccountAdmin
              captures: { imp_id: $.data.id }
            - call: "POST /bonds"
              payload: { importer_id: "${imp_id}", bond_type: "CONTINUOUS", limit_cents: 100000000 }
              as: AccountAdmin
              captures: { bond_id: $.data.id }
            - call: "POST /bonds/${bond_id}/activate"
              payload: {}
              as: AccountAdmin
            - call: "POST /isf-filings"
              payload: { importer_id: "${imp_id}", bill_of_lading: "BOL-CF-002", vessel_eta: "2026-06-10T00:00:00Z", data_element_count: 10 }
              as: LicensedBroker
              captures: { isf_id: $.data.id }
            - call: "POST /isf-filings/${isf_id}/file"
              payload: {}
              as: LicensedBroker
            - call: "POST /entries"
              payload: { importer_id: "${imp_id}", bond_id: "${bond_id}", isf_filing_id: "${isf_id}", entry_type: "CONSUMPTION_01", country_of_origin: "CN", entry_date: "2026-06-10T00:00:00Z" }
              as: LicensedBroker
              captures: { entry_id: $.data.id }
            - call: "POST /entries/${entry_id}/lines"
              payload: { hts_code: "6203420000", customs_value_cents: 500070, quantity: 1, preference_claim: "NONE" }
              as: LicensedBroker
              captures: { line_a: $.data.id }
            - call: "POST /entries/${entry_id}/lines"
              payload: { hts_code: "6203420000", customs_value_cents: 300070, quantity: 1, preference_claim: "NONE" }
              as: LicensedBroker
              captures: { line_b: $.data.id }
          trigger:
            - call: "POST /entries/${entry_id}/file"
              payload: {}
              as: LicensedBroker
              captures: { prov_total: $.data.provisional_total_cents }
          assert:
            - "EntryLine.${line_a}.line_duty_cents == 82512"
            - "EntryLine.${line_b}.line_duty_cents == 49512"
            - "CustomsEntry.${entry_id}.provisional_total_cents == 136279"

  # =========================================================================
  - rule_id: non_linear_state_machine
    instances:
      - name: pga_review_cyclic_hold_then_may_proceed
        grounds:
          - state_machines.PGAReview.PENDING_to_HOLD
          - state_machines.PGAReview.HOLD_to_MAY_PROCEED
          - entities.PGAReview.fields.decision
        distinguishing_aspect: |
          On the PGAReview entity: the machine is cyclic-recovery — PENDING->HOLD->MAY_PROCEED
          re-enters a non-terminal-then-clearable path. After HOLD then MAY_PROCEED the decision
          reads MAY_PROCEED and the entry can release, proving the HOLD state was escapable.
        test_recipe:
          setup:
            - "A FILED entry with one FDA-flagged line and an open PGAReview(agency=FDA, decision=PENDING)."
            - "Canonical chain; clock 2026-06-05T00:00:00Z; bond high limit."
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-06-05T00:00:00Z" }
              as: AccountAdmin
            - call: "POST /importers"
              payload: { name: "Acme Imports", ior_number: "IOR-NL-001", owner_user_id: "imp-user-1" }
              as: AccountAdmin
              captures: { imp_id: $.data.id }
            - call: "POST /bonds"
              payload: { importer_id: "${imp_id}", bond_type: "CONTINUOUS", limit_cents: 100000000 }
              as: AccountAdmin
              captures: { bond_id: $.data.id }
            - call: "POST /bonds/${bond_id}/activate"
              payload: {}
              as: AccountAdmin
            - call: "POST /isf-filings"
              payload: { importer_id: "${imp_id}", bill_of_lading: "BOL-NL-001", vessel_eta: "2026-06-10T00:00:00Z", data_element_count: 10 }
              as: LicensedBroker
              captures: { isf_id: $.data.id }
            - call: "POST /isf-filings/${isf_id}/file"
              payload: {}
              as: LicensedBroker
            - call: "POST /entries"
              payload: { importer_id: "${imp_id}", bond_id: "${bond_id}", isf_filing_id: "${isf_id}", entry_type: "CONSUMPTION_01", country_of_origin: "CN", entry_date: "2026-06-10T00:00:00Z" }
              as: LicensedBroker
              captures: { entry_id: $.data.id }
            - call: "POST /entries/${entry_id}/lines"
              payload: { hts_code: "2106909998", customs_value_cents: 200000, quantity: 1, preference_claim: "NONE", pga_flag: "FDA" }
              as: LicensedBroker
            - call: "POST /pga-reviews"
              payload: { entry_id: "${entry_id}", agency: "FDA" }
              as: LicensedBroker
              captures: { pga_id: $.data.id }
            - call: "POST /entries/${entry_id}/file"
              payload: {}
              as: LicensedBroker
            - call: "POST /pga-reviews/${pga_id}/decide"
              payload: { decision: "HOLD" }
              as: CBPOfficer
              as_user_id: "officer-1"
          trigger:
            - call: "POST /pga-reviews/${pga_id}/decide"
              payload: { decision: "MAY_PROCEED" }
              as: CBPOfficer
              as_user_id: "officer-1"
              captures: { dec: $.data.decision }
          assert:
            - "PGAReview.${pga_id}.decision == MAY_PROCEED"

      - name: entry_branching_filed_to_hold_then_release_divergent_effects
        grounds:
          - state_machines.CustomsEntry.FILED_to_HOLD_EXAM
          - state_machines.CustomsEntry.HOLD_EXAM_to_RELEASED
          - entities.CustomsEntry.fields.statement_id
          - entities.ISFFiling.fields.status
        distinguishing_aspect: |
          On the CustomsEntry entity (different entity from PGAReview): FILED forks to HOLD_EXAM
          (no statement scheduling, ISF stays FILED) versus RELEASED. The HOLD branch leaves
          statement_id null; only on the later HOLD_EXAM->RELEASED does the ISF become MATCHED
          and a statement_id get assigned — divergent side-effect sets per branch.
        test_recipe:
          setup:
            - "A FILED entry, FDA-flagged line, PGAReview held then proceeded, officer routes it to HOLD_EXAM first."
            - "Canonical chain; clock 2026-06-05T00:00:00Z; bond high limit."
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-06-05T00:00:00Z" }
              as: AccountAdmin
            - call: "POST /importers"
              payload: { name: "Acme Imports", ior_number: "IOR-NL-002", owner_user_id: "imp-user-1" }
              as: AccountAdmin
              captures: { imp_id: $.data.id }
            - call: "POST /bonds"
              payload: { importer_id: "${imp_id}", bond_type: "CONTINUOUS", limit_cents: 100000000 }
              as: AccountAdmin
              captures: { bond_id: $.data.id }
            - call: "POST /bonds/${bond_id}/activate"
              payload: {}
              as: AccountAdmin
            - call: "POST /isf-filings"
              payload: { importer_id: "${imp_id}", bill_of_lading: "BOL-NL-002", vessel_eta: "2026-06-10T00:00:00Z", data_element_count: 10 }
              as: LicensedBroker
              captures: { isf_id: $.data.id }
            - call: "POST /isf-filings/${isf_id}/file"
              payload: {}
              as: LicensedBroker
            - call: "POST /entries"
              payload: { importer_id: "${imp_id}", bond_id: "${bond_id}", isf_filing_id: "${isf_id}", entry_type: "CONSUMPTION_01", country_of_origin: "CN", entry_date: "2026-06-10T00:00:00Z" }
              as: LicensedBroker
              captures: { entry_id: $.data.id }
            - call: "POST /entries/${entry_id}/lines"
              payload: { hts_code: "2106909998", customs_value_cents: 200000, quantity: 1, preference_claim: "NONE", pga_flag: "FDA" }
              as: LicensedBroker
            - call: "POST /pga-reviews"
              payload: { entry_id: "${entry_id}", agency: "FDA" }
              as: LicensedBroker
              captures: { pga_id: $.data.id }
            - call: "POST /entries/${entry_id}/file"
              payload: {}
              as: LicensedBroker
            - call: "POST /entries/${entry_id}/review"
              payload: { action: "HOLD" }
              as: CBPOfficer
              as_user_id: "officer-1"
              captures: { stmt_after_hold: $.data.statement_id }
            - call: "POST /pga-reviews/${pga_id}/decide"
              payload: { decision: "MAY_PROCEED" }
              as: CBPOfficer
              as_user_id: "officer-1"
          trigger:
            - call: "POST /entries/${entry_id}/review"
              payload: { action: "RELEASE" }
              as: CBPOfficer
              as_user_id: "officer-1"
              captures: { stmt_after_release: $.data.statement_id }
          assert:
            - "CustomsEntry.${entry_id}.status == RELEASED after the trigger; was HOLD_EXAM before it"
            - "CustomsEntry.${entry_id}.statement_id was null while HOLD_EXAM and is non-null after RELEASE"
            - "ISFFiling.${isf_id}.status == MATCHED only after the HOLD_EXAM->RELEASED trigger"

  # =========================================================================
  - rule_id: transitive_cascade
    instances:
      - name: psc_refund_cascade_entry_to_bond_liability_to_bond_desaturate
        grounds:
          - state_machines.PostSummaryCorrection.SUBMITTED_to_GRANTED
          - state_machines.Bond.SATURATED_to_ACTIVE
          - entities.CustomsEntry.fields.final_total_cents
          - entities.Bond.fields.outstanding_liability_cents
          - entities.Bond.fields.status
        distinguishing_aspect: |
          Depth-3 chain from a single trigger: grant(PSC, delta=-200000) -> entry.final_total_cents
          drops by the -10000 adjustment (54800 -> 44800) -> bond.outstanding_liability_cents
          decreases (54800 -> 44800) -> bond crosses strictly below its limit_cents=54800 and
          auto-transitions SATURATED->ACTIVE. Each hop is caused by the previous hop, not by the grant
          call directly.
        test_recipe:
          setup:
            - "Bond limit_cents=54800; a general entry (origin CN, ch94 line cv 1000000) FILED reserves 54800 -> bond SATURATES."
            - "Entry RELEASED then LIQUIDATED (final 54800, delta 0, still SATURATED)."
            - "A SUBMITTED PSC with corrected_value_delta_cents=-200000 (a refund claim)."
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-06-05T00:00:00Z" }
              as: AccountAdmin
            - call: "POST /importers"
              payload: { name: "Acme Imports", ior_number: "IOR-TC-001", owner_user_id: "imp-user-1" }
              as: AccountAdmin
              captures: { imp_id: $.data.id }
            - call: "POST /bonds"
              payload: { importer_id: "${imp_id}", bond_type: "CONTINUOUS", limit_cents: 54800 }
              as: AccountAdmin
              captures: { bond_id: $.data.id }
            - call: "POST /bonds/${bond_id}/activate"
              payload: {}
              as: AccountAdmin
            - call: "POST /isf-filings"
              payload: { importer_id: "${imp_id}", bill_of_lading: "BOL-TC-001", vessel_eta: "2026-06-10T00:00:00Z", data_element_count: 10 }
              as: LicensedBroker
              captures: { isf_id: $.data.id }
            - call: "POST /isf-filings/${isf_id}/file"
              payload: {}
              as: LicensedBroker
            - call: "POST /entries"
              payload: { importer_id: "${imp_id}", bond_id: "${bond_id}", isf_filing_id: "${isf_id}", entry_type: "CONSUMPTION_01", country_of_origin: "CN", entry_date: "2026-06-10T00:00:00Z" }
              as: LicensedBroker
              captures: { entry_id: $.data.id }
            - call: "POST /entries/${entry_id}/lines"
              payload: { hts_code: "9403600080", customs_value_cents: 1000000, quantity: 1, preference_claim: "NONE" }
              as: LicensedBroker
            - call: "POST /entries/${entry_id}/file"
              payload: {}
              as: LicensedBroker
            - call: "POST /entries/${entry_id}/review"
              payload: { action: "RELEASE" }
              as: CBPOfficer
              as_user_id: "officer-1"
            - call: "POST /entries/${entry_id}/liquidate"
              payload: {}
              as: CBPOfficer
              as_user_id: "officer-1"
              captures: { entry_v: $.data.version }
            - call: "POST /post-summary-corrections"
              payload: { entry_id: "${entry_id}", filing_kind: "PSC", corrected_value_delta_cents: -200000, expected_entry_version: "${entry_v}" }
              as: LicensedBroker
              captures: { psc_id: $.data.id }
          trigger:
            - call: "POST /post-summary-corrections/${psc_id}/grant"
              payload: {}
              as: CBPOfficer
              as_user_id: "officer-1"
          assert:
            - "PostSummaryCorrection.${psc_id}.adjustment_cents == -10000"
            - "CustomsEntry.${entry_id}.final_total_cents == 44800"
