              as: TaxPreparer
              captures: { run: "$.data.id" }
          trigger:
            - call: "POST /funds/allocation-runs/${run}/lock"
              payload: {}
              as: InvestorServicesRep
              captures: { e: "$.data.error_id" }
          assert:
            - "error_id == ERR_FORBIDDEN_FOR_ROLE (403); run remains COMPUTED"

      - name: investor_acknowledge_own_vs_other_k1
        claim_type: role_denial
        grounds: ["roles[Investor]", entities.K1Package.fields.partner_id, "validations[priority=2]"]
        distinguishing_aspect: "Entity-backed identity: Investor with X-User-ID == partner_id acknowledges OWN delivered K1 (200) but is forbidden (403) on the other partner's K1."
        test_recipe:
          setup: ["fund with partners P1 and P2; TaxYear APPROVED; both K1s delivered (delivery SENT)"]
          setup_api_calls:
            - call: "POST /funds"
              payload: { legal_name: "Fund RB3", ein: "22-7000003", waterfall_hurdle_rate_bps: 800, waterfall_catchup_bps: 2000, waterfall_carry_bps: 2000, foreign_ownership_cap_pct_bps: 10000, management_fee_rate_bps: 0, fee_discount_threshold_cents: 1, fee_discount_bps: 0 }
