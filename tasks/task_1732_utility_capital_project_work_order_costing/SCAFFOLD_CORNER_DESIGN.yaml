            - { call: "POST /ucp/ciac-agreements", payload: { work_order_id: "${wo}", pledged_cents: 150000, pledge_expiry_at: "2026-12-31T00:00:00Z" }, as: RateAnalyst, as_user_id: rates-1, captures: { ciac: $.data.id } }
            - { call: "POST /ucp/ciac-agreements/${ciac}/receive", payload: {}, as: RateAnalyst, as_user_id: rates-1 }
            - { call: "POST /ucp/work-orders/${wo}/complete", payload: { in_service_date: "2026-08-20" }, as: WorkOrderSupervisor, as_user_id: sup-1 }
          trigger:
            - { call: "POST /ucp/work-orders/${wo}/closeout", payload: { unitization_lines: [ { unit_catalog_id: "${cat_t}", quantity: 1 } ] }, as: Controller, as_user_id: ctrl-1, captures: { cap: $.data.capitalizable_total_cents, applied: $.data.ciac_applied_cents } }
            - { call: "GET /ucp/ciac-agreements/${ciac}", payload: {}, as: Auditor, captures: { c_st: $.data.status, c_applied: $.data.applied_cents, c_ref: $.data.refunded_cents } }
            - { call: "GET /ucp/fixed-asset-units", payload: { work_order_id: "${wo}" }, as: Auditor, captures: { alloc: "$.data[0].allocated_cost_cents" } }
          assert:
            - "WorkOrder.ciac_applied_cents ${applied} == 120000 and capitalizable_total_cents ${cap} == 0"
            - "CIAC: status ${c_st} == APPLIED, applied ${c_applied} == 120000, excess refunded ${c_ref} == 30000"
            - "Unit allocated the remaining 0c: ${alloc} == 0"

      - name: closeout_coverage_insufficient_then_topped_up
        claim_type: correct_result
        grounds: [calculations.closeout_variance_gate, "errors[ERR_REGULATORY_COVERAGE_INSUFFICIENT]"]
        distinguishing_aspect: "Partial coverage (999c approved against 1,000c needed) fails with ERR_REGULATORY_COVERAGE_INSUFFICIENT — a different error than no coverage at all — and a second 1c approved deferral tops coverage up to exactly 1,000c, which passes (equality allowed)."
        test_recipe:
          setup: ["CAPITAL work order approved at 100,000c, actual_direct 116,000c (charges 10,000 + 106,000), completed 2026-08-20; RegulatoryAsset A of 999c sourced to the order is APPROVED; TRANSFORMER catalog row; period 2026-08 open"]
          setup_api_calls:
            - { call: "POST /ucp/capital-programs", payload: { code: "CAP-INSUF", fiscal_year: 2026, authorized_amount_cents: 100000000, afudc_debt_rate_pct: 12.0, afudc_equity_rate_pct: 0.0, afudc_debt_weight_pct: 100, afudc_method: HALF_MONTH, ciac_method: NET_OF_CIAC }, as: SystemAdmin, as_user_id: admin-1, captures: { prog: $.data.id } }
            - { call: "POST /ucp/unit-catalog", payload: { asset_class: TRANSFORMER, standard_cost_cents: 50000, annual_depreciation_rate_pct: 12.0 }, as: SystemAdmin, as_user_id: admin-1, captures: { cat_t: $.data.id } }
            - { call: "POST /ucp/overhead-schedules", payload: { cost_type: MATERIAL, order_type: CAPITAL, rate_pct: 0.0, effective_from: "2026-01-01" }, as: SystemAdmin, as_user_id: admin-1 }
            - { call: "POST /ucp/accounting-periods", payload: { fiscal_year: 2026, period_no: 8, start_date: "2026-08-01", end_date: "2026-08-31" }, as: SystemAdmin, as_user_id: admin-1 }
            - { call: "POST /ucp/work-orders", payload: { program_id: "${prog}", order_type: CAPITAL, title: "Insufficient coverage", initial_estimated_cost_cents: 100000 }, as: ProjectEngineer, as_user_id: eng-1, captures: { wo: $.data.id } }
            - { call: "POST /ucp/work-orders/${wo}/submit", payload: {}, as: ProjectEngineer, as_user_id: eng-1, captures: { wo_v2: $.data.version } }
            - { call: "GET /ucp/estimates", payload: { work_order_id: "${wo}" }, as: Auditor, captures: { est: "$.data[0].id" } }
            - { call: "POST /ucp/estimates/${est}/approve", payload: { expected_work_order_version: "${wo_v2}" }, as: WorkOrderSupervisor, as_user_id: sup-1 }
            - { call: "POST /ucp/work-orders/${wo}/authorize", payload: {}, as: WorkOrderSupervisor, as_user_id: sup-1 }
            - { call: "POST /ucp/work-orders/${wo}/start", payload: {}, as: WorkOrderSupervisor, as_user_id: sup-1 }
            - { call: "POST /ucp/cost-charges", payload: { work_order_id: "${wo}", cost_type: MATERIAL, base_amount_cents: 10000, charge_date: "2026-08-05" }, as: FieldClerk, as_user_id: clerk-1 }
            - { call: "POST /ucp/cost-charges", payload: { work_order_id: "${wo}", cost_type: MATERIAL, base_amount_cents: 106000, charge_date: "2026-08-06" }, as: FieldClerk, as_user_id: clerk-1 }
            - { call: "POST /ucp/work-orders/${wo}/complete", payload: { in_service_date: "2026-08-20" }, as: WorkOrderSupervisor, as_user_id: sup-1 }
            - { call: "POST /ucp/regulatory-assets", payload: { description: "Partial cover", original_cents: 999, amortization_months: 12, source_work_order_id: "${wo}" }, as: RateAnalyst, as_user_id: rates-1, captures: { ra1: $.data.id } }
            - { call: "POST /ucp/regulatory-assets/${ra1}/approve", payload: {}, as: Controller, as_user_id: ctrl-1 }
          trigger:
            - { call: "POST /ucp/work-orders/${wo}/closeout", payload: { unitization_lines: [ { unit_catalog_id: "${cat_t}", quantity: 1 } ] }, as: Controller, as_user_id: ctrl-1, captures: { err: $.data.error_id } }
            - { call: "POST /ucp/regulatory-assets", payload: { description: "Top-up cover", original_cents: 1, amortization_months: 12, source_work_order_id: "${wo}" }, as: RateAnalyst, as_user_id: rates-1, captures: { ra2: $.data.id } }
            - { call: "POST /ucp/regulatory-assets/${ra2}/approve", payload: {}, as: Controller, as_user_id: ctrl-1 }
            - { call: "POST /ucp/work-orders/${wo}/closeout", payload: { unitization_lines: [ { unit_catalog_id: "${cat_t}", quantity: 1 } ] }, as: Controller, as_user_id: ctrl-1, captures: { st: $.data.status } }
          assert:
            - "Partial coverage: ${err} == ERR_REGULATORY_COVERAGE_INSUFFICIENT (not ERR_CLOSEOUT_VARIANCE_EXCEEDS_TOLERANCE)"
            - "Topped up to exactly 1,000c: closeout succeeds, status ${st} == CLOSED"

  # ===========================================================================
  - section: validations
    instances:
      - name: missing_auth_header_returns_unauthenticated
        claim_type: violation_to_error
        grounds: ["validations[priority=1]", "errors[ERR_UNAUTHENTICATED]"]
        distinguishing_aspect: "A mutating call without X-User-Role/X-User-ID is rejected 401 ERR_UNAUTHENTICATED before any role, existence, or shape check (the program code is unique — a second attempt with auth would fail differently)."
        test_recipe:
          setup: ["Database is empty"]
          setup_api_calls: []
          trigger:
            - call: "POST /ucp/capital-programs"
              payload: { code: "CAP-NOAUTH", fiscal_year: 2026, authorized_amount_cents: 5000000, afudc_debt_rate_pct: 12.0, afudc_equity_rate_pct: 0.0, afudc_debt_weight_pct: 100, afudc_method: HALF_MONTH, ciac_method: NET_OF_CIAC }
              captures: { err: $.data.error_id }
          assert:
            - "No headers at all: error_id ${err} == ERR_UNAUTHENTICATED (401)"

      - name: body_fk_existence_and_charge_date_without_period
        claim_type: violation_to_error
        grounds: ["validations[priority=3]", "errors[ERR_NOT_FOUND]", "errors[ERR_PERIOD_NOT_FOUND]"]
        distinguishing_aspect: "Body foreign keys are existence-checked (bogus program_id on work-order create and bogus work_order_id on charge create both 404), and a charge whose date falls outside every accounting period fails 422 ERR_PERIOD_NOT_FOUND."
        test_recipe:
          setup: ["Program, MATERIAL/CAPITAL 0% schedule, period 2026-08, and an authorized/started work order exist"]
          setup_api_calls:
            - { call: "POST /ucp/capital-programs", payload: { code: "CAP-FK", fiscal_year: 2026, authorized_amount_cents: 100000000, afudc_debt_rate_pct: 12.0, afudc_equity_rate_pct: 0.0, afudc_debt_weight_pct: 100, afudc_method: HALF_MONTH, ciac_method: NET_OF_CIAC }, as: SystemAdmin, as_user_id: admin-1, captures: { prog: $.data.id } }
            - { call: "POST /ucp/overhead-schedules", payload: { cost_type: MATERIAL, order_type: CAPITAL, rate_pct: 0.0, effective_from: "2026-01-01" }, as: SystemAdmin, as_user_id: admin-1 }
            - { call: "POST /ucp/accounting-periods", payload: { fiscal_year: 2026, period_no: 8, start_date: "2026-08-01", end_date: "2026-08-31" }, as: SystemAdmin, as_user_id: admin-1 }
            - { call: "POST /ucp/work-orders", payload: { program_id: "${prog}", order_type: CAPITAL, title: "FK order", initial_estimated_cost_cents: 9000000 }, as: ProjectEngineer, as_user_id: eng-1, captures: { wo: $.data.id } }
            - { call: "POST /ucp/work-orders/${wo}/submit", payload: {}, as: ProjectEngineer, as_user_id: eng-1, captures: { wo_v2: $.data.version } }
            - { call: "GET /ucp/estimates", payload: { work_order_id: "${wo}" }, as: Auditor, captures: { est: "$.data[0].id" } }
            - { call: "POST /ucp/estimates/${est}/approve", payload: { expected_work_order_version: "${wo_v2}" }, as: WorkOrderSupervisor, as_user_id: sup-1 }
            - { call: "POST /ucp/work-orders/${wo}/authorize", payload: {}, as: WorkOrderSupervisor, as_user_id: sup-1 }
            - { call: "POST /ucp/work-orders/${wo}/start", payload: {}, as: WorkOrderSupervisor, as_user_id: sup-1 }
          trigger:
            - { call: "POST /ucp/work-orders", payload: { program_id: "00000000-0000-0000-0000-000000000000", order_type: CAPITAL, title: "Ghost program", initial_estimated_cost_cents: 1000 }, as: ProjectEngineer, as_user_id: eng-1, captures: { err1: $.data.error_id } }
            - { call: "POST /ucp/cost-charges", payload: { work_order_id: "00000000-0000-0000-0000-000000000000", cost_type: MATERIAL, base_amount_cents: 1000, charge_date: "2026-08-10" }, as: FieldClerk, as_user_id: clerk-1, captures: { err2: $.data.error_id } }
            - { call: "POST /ucp/cost-charges", payload: { work_order_id: "${wo}", cost_type: MATERIAL, base_amount_cents: 1000, charge_date: "2027-05-05" }, as: FieldClerk, as_user_id: clerk-1, captures: { err3: $.data.error_id } }
          assert:
            - "Bogus program_id: ${err1} == ERR_NOT_FOUND; bogus work_order_id: ${err2} == ERR_NOT_FOUND"
            - "Charge date in no period: ${err3} == ERR_PERIOD_NOT_FOUND"

      - name: program_budget_exceeded_and_exact_fit_boundary
        claim_type: violation_to_error
        grounds: [calculations.program_budget_accounting, "errors[ERR_PROGRAM_BUDGET_EXCEEDED]"]
        distinguishing_aspect: "Authorize enforces available >= approved with an inclusive boundary: 600,000c against 500,000c fails ERR_PROGRAM_BUDGET_EXCEEDED, while exactly 500,000c (equality) succeeds."
        test_recipe:
          setup: ["Program authorized 500,000c; WO-A submitted with approved 600,000c estimate; WO-B submitted with approved 500,000c estimate"]
          setup_api_calls:
            - { call: "POST /ucp/capital-programs", payload: { code: "CAP-BUDG", fiscal_year: 2026, authorized_amount_cents: 500000, afudc_debt_rate_pct: 12.0, afudc_equity_rate_pct: 0.0, afudc_debt_weight_pct: 100, afudc_method: HALF_MONTH, ciac_method: NET_OF_CIAC }, as: SystemAdmin, as_user_id: admin-1, captures: { prog: $.data.id } }
            - { call: "POST /ucp/work-orders", payload: { program_id: "${prog}", order_type: CAPITAL, title: "Too big", initial_estimated_cost_cents: 600000 }, as: ProjectEngineer, as_user_id: eng-1, captures: { wa: $.data.id } }
            - { call: "POST /ucp/work-orders/${wa}/submit", payload: {}, as: ProjectEngineer, as_user_id: eng-1, captures: { wa_v2: $.data.version } }
            - { call: "GET /ucp/estimates", payload: { work_order_id: "${wa}" }, as: Auditor, captures: { esta: "$.data[0].id" } }
            - { call: "POST /ucp/estimates/${esta}/approve", payload: { expected_work_order_version: "${wa_v2}" }, as: WorkOrderSupervisor, as_user_id: sup-1 }
            - { call: "POST /ucp/work-orders", payload: { program_id: "${prog}", order_type: CAPITAL, title: "Exact fit", initial_estimated_cost_cents: 500000 }, as: ProjectEngineer, as_user_id: eng-1, captures: { wb: $.data.id } }
            - { call: "POST /ucp/work-orders/${wb}/submit", payload: {}, as: ProjectEngineer, as_user_id: eng-1, captures: { wb_v2: $.data.version } }
            - { call: "GET /ucp/estimates", payload: { work_order_id: "${wb}" }, as: Auditor, captures: { estb: "$.data[0].id" } }
            - { call: "POST /ucp/estimates/${estb}/approve", payload: { expected_work_order_version: "${wb_v2}" }, as: WorkOrderSupervisor, as_user_id: sup-1 }
          trigger:
            - { call: "POST /ucp/work-orders/${wa}/authorize", payload: {}, as: WorkOrderSupervisor, as_user_id: sup-1, captures: { err: $.data.error_id } }
            - { call: "POST /ucp/work-orders/${wb}/authorize", payload: {}, as: WorkOrderSupervisor, as_user_id: sup-1, captures: { st: $.data.status } }
          assert:
            - "600,000 > 500,000 available: ${err} == ERR_PROGRAM_BUDGET_EXCEEDED"
            - "Exactly 500,000 == available passes (inclusive): status ${st} == AUTHORIZED"

      - name: estimate_below_actuals_rejected
        claim_type: violation_to_error
        grounds: ["errors[ERR_ESTIMATE_BELOW_ACTUALS]", state_machines.Estimate.PROPOSED_to_APPROVED]
        distinguishing_aspect: "A re-estimate below already-posted actuals (4,000c proposed vs 5,000c actual) cannot be approved: ERR_ESTIMATE_BELOW_ACTUALS."
        test_recipe:
          setup: ["CAPITAL work order authorized/started at 10,000c with a 5,000c charge posted; re-estimate E2 of 4,000c proposed; period 2026-08 open"]
          setup_api_calls:
            - { call: "POST /ucp/capital-programs", payload: { code: "CAP-BELOW", fiscal_year: 2026, authorized_amount_cents: 100000000, afudc_debt_rate_pct: 12.0, afudc_equity_rate_pct: 0.0, afudc_debt_weight_pct: 100, afudc_method: HALF_MONTH, ciac_method: NET_OF_CIAC }, as: SystemAdmin, as_user_id: admin-1, captures: { prog: $.data.id } }
            - { call: "POST /ucp/overhead-schedules", payload: { cost_type: MATERIAL, order_type: CAPITAL, rate_pct: 0.0, effective_from: "2026-01-01" }, as: SystemAdmin, as_user_id: admin-1 }
            - { call: "POST /ucp/accounting-periods", payload: { fiscal_year: 2026, period_no: 8, start_date: "2026-08-01", end_date: "2026-08-31" }, as: SystemAdmin, as_user_id: admin-1 }
            - { call: "POST /ucp/work-orders", payload: { program_id: "${prog}", order_type: CAPITAL, title: "Below actuals", initial_estimated_cost_cents: 10000 }, as: ProjectEngineer, as_user_id: eng-1, captures: { wo: $.data.id } }
            - { call: "POST /ucp/work-orders/${wo}/submit", payload: {}, as: ProjectEngineer, as_user_id: eng-1, captures: { wo_v2: $.data.version } }
            - { call: "GET /ucp/estimates", payload: { work_order_id: "${wo}" }, as: Auditor, captures: { est1: "$.data[0].id" } }
            - { call: "POST /ucp/estimates/${est1}/approve", payload: { expected_work_order_version: "${wo_v2}" }, as: WorkOrderSupervisor, as_user_id: sup-1 }
            - { call: "POST /ucp/work-orders/${wo}/authorize", payload: {}, as: WorkOrderSupervisor, as_user_id: sup-1 }
            - { call: "POST /ucp/work-orders/${wo}/start", payload: {}, as: WorkOrderSupervisor, as_user_id: sup-1 }
            - { call: "POST /ucp/cost-charges", payload: { work_order_id: "${wo}", cost_type: MATERIAL, base_amount_cents: 5000, charge_date: "2026-08-05" }, as: FieldClerk, as_user_id: clerk-1 }
            - { call: "GET /ucp/work-orders/${wo}", payload: {}, as: Auditor, captures: { wo_v: $.data.version } }
            - { call: "POST /ucp/estimates", payload: { work_order_id: "${wo}", estimated_cost_cents: 4000, expected_work_order_version: "${wo_v}" }, as: ProjectEngineer, as_user_id: eng-1, captures: { est2: $.data.id } }
            - { call: "GET /ucp/work-orders/${wo}", payload: {}, as: Auditor, captures: { wo_vb: $.data.version } }
          trigger:
            - { call: "POST /ucp/estimates/${est2}/approve", payload: { expected_work_order_version: "${wo_vb}" }, as: Controller, as_user_id: ctrl-1, captures: { err: $.data.error_id } }
          assert:
            - "The 60% delta routes to Controller tier, so a Controller (who passes the tier and SoD) hits the fiscal floor: 4,000 < 5,000 actual -> ${err} == ERR_ESTIMATE_BELOW_ACTUALS"

      - name: writeoff_disposition_required_on_cancel
        claim_type: violation_to_error
        grounds: ["errors[ERR_WRITEOFF_DISPOSITION_REQUIRED]", state_machines.WorkOrder.IN_PROGRESS_to_CANCELLED]
        distinguishing_aspect: "Cancelling an order holding 20,000c CWIP without writeoff_disposition fails 400 ERR_WRITEOFF_DISPOSITION_REQUIRED; retrying with EXPENSE succeeds and records the write-off."
        test_recipe:
          setup: ["CAPITAL work order authorized/started with a 20,000c charge; period 2026-08 open"]
          setup_api_calls:
            - { call: "POST /ucp/capital-programs", payload: { code: "CAP-WOFF", fiscal_year: 2026, authorized_amount_cents: 100000000, afudc_debt_rate_pct: 12.0, afudc_equity_rate_pct: 0.0, afudc_debt_weight_pct: 100, afudc_method: HALF_MONTH, ciac_method: NET_OF_CIAC }, as: SystemAdmin, as_user_id: admin-1, captures: { prog: $.data.id } }
            - { call: "POST /ucp/overhead-schedules", payload: { cost_type: MATERIAL, order_type: CAPITAL, rate_pct: 0.0, effective_from: "2026-01-01" }, as: SystemAdmin, as_user_id: admin-1 }
            - { call: "POST /ucp/accounting-periods", payload: { fiscal_year: 2026, period_no: 8, start_date: "2026-08-01", end_date: "2026-08-31" }, as: SystemAdmin, as_user_id: admin-1 }
            - { call: "POST /ucp/work-orders", payload: { program_id: "${prog}", order_type: CAPITAL, title: "Writeoff order", initial_estimated_cost_cents: 400000 }, as: ProjectEngineer, as_user_id: eng-1, captures: { wo: $.data.id } }
            - { call: "POST /ucp/work-orders/${wo}/submit", payload: {}, as: ProjectEngineer, as_user_id: eng-1, captures: { wo_v2: $.data.version } }
            - { call: "GET /ucp/estimates", payload: { work_order_id: "${wo}" }, as: Auditor, captures: { est: "$.data[0].id" } }
            - { call: "POST /ucp/estimates/${est}/approve", payload: { expected_work_order_version: "${wo_v2}" }, as: WorkOrderSupervisor, as_user_id: sup-1 }
            - { call: "POST /ucp/work-orders/${wo}/authorize", payload: {}, as: WorkOrderSupervisor, as_user_id: sup-1 }
            - { call: "POST /ucp/work-orders/${wo}/start", payload: {}, as: WorkOrderSupervisor, as_user_id: sup-1 }
            - { call: "POST /ucp/cost-charges", payload: { work_order_id: "${wo}", cost_type: MATERIAL, base_amount_cents: 20000, charge_date: "2026-08-05" }, as: FieldClerk, as_user_id: clerk-1 }
          trigger:
            - { call: "POST /ucp/work-orders/${wo}/cancel", payload: {}, as: WorkOrderSupervisor, as_user_id: sup-1, captures: { err: $.data.error_id } }
            - { call: "POST /ucp/work-orders/${wo}/cancel", payload: { writeoff_disposition: EXPENSE }, as: WorkOrderSupervisor, as_user_id: sup-1, captures: { st: $.data.status, disp: $.data.cancel_writeoff_disposition } }
            - { call: "GET /ucp/capital-programs/${prog}", payload: {}, as: Auditor, captures: { writeoff: $.data.expense_writeoff_cents } }
          assert:
            - "Missing disposition: ${err} == ERR_WRITEOFF_DISPOSITION_REQUIRED (400)"
            - "With EXPENSE: status ${st} == CANCELLED, disposition ${disp} == EXPENSE, program write-off ${writeoff} == 20000"

      - name: ciac_pledged_outstanding_blocks_closeout
        claim_type: violation_to_error
        grounds: ["errors[ERR_CIAC_PLEDGED_OUTSTANDING]", state_machines.WorkOrder.COMPLETED_to_CLOSED]
        distinguishing_aspect: "Closeout refuses to run while a CIAC is still PLEDGED; once the pledge is received (allowed even while COMPLETED), closeout succeeds and the CIAC is APPLIED."
        test_recipe:
          setup: ["CAPITAL work order completed (in-service 2026-08-20) with a 120,000c charge; CIAC of 50,000c pledged but not received; TRANSFORMER catalog row; period 2026-08 open"]
          setup_api_calls:
            - { call: "POST /ucp/capital-programs", payload: { code: "CAP-PLDG", fiscal_year: 2026, authorized_amount_cents: 100000000, afudc_debt_rate_pct: 12.0, afudc_equity_rate_pct: 0.0, afudc_debt_weight_pct: 100, afudc_method: HALF_MONTH, ciac_method: NET_OF_CIAC }, as: SystemAdmin, as_user_id: admin-1, captures: { prog: $.data.id } }
            - { call: "POST /ucp/unit-catalog", payload: { asset_class: TRANSFORMER, standard_cost_cents: 50000, annual_depreciation_rate_pct: 12.0 }, as: SystemAdmin, as_user_id: admin-1, captures: { cat_t: $.data.id } }
            - { call: "POST /ucp/overhead-schedules", payload: { cost_type: MATERIAL, order_type: CAPITAL, rate_pct: 0.0, effective_from: "2026-01-01" }, as: SystemAdmin, as_user_id: admin-1 }
            - { call: "POST /ucp/accounting-periods", payload: { fiscal_year: 2026, period_no: 8, start_date: "2026-08-01", end_date: "2026-08-31" }, as: SystemAdmin, as_user_id: admin-1 }
            - { call: "POST /ucp/work-orders", payload: { program_id: "${prog}", order_type: CAPITAL, title: "Pledged CIAC", initial_estimated_cost_cents: 500000 }, as: ProjectEngineer, as_user_id: eng-1, captures: { wo: $.data.id } }
            - { call: "POST /ucp/work-orders/${wo}/submit", payload: {}, as: ProjectEngineer, as_user_id: eng-1, captures: { wo_v2: $.data.version } }
            - { call: "GET /ucp/estimates", payload: { work_order_id: "${wo}" }, as: Auditor, captures: { est: "$.data[0].id" } }
            - { call: "POST /ucp/estimates/${est}/approve", payload: { expected_work_order_version: "${wo_v2}" }, as: WorkOrderSupervisor, as_user_id: sup-1 }
            - { call: "POST /ucp/work-orders/${wo}/authorize", payload: {}, as: WorkOrderSupervisor, as_user_id: sup-1 }
            - { call: "POST /ucp/work-orders/${wo}/start", payload: {}, as: WorkOrderSupervisor, as_user_id: sup-1 }
            - { call: "POST /ucp/cost-charges", payload: { work_order_id: "${wo}", cost_type: MATERIAL, base_amount_cents: 120000, charge_date: "2026-08-05" }, as: FieldClerk, as_user_id: clerk-1 }
            - { call: "POST /ucp/ciac-agreements", payload: { work_order_id: "${wo}", pledged_cents: 50000, pledge_expiry_at: "2026-12-31T00:00:00Z" }, as: RateAnalyst, as_user_id: rates-1, captures: { ciac: $.data.id } }
            - { call: "POST /ucp/work-orders/${wo}/complete", payload: { in_service_date: "2026-08-20" }, as: WorkOrderSupervisor, as_user_id: sup-1 }
          trigger:
            - { call: "POST /ucp/work-orders/${wo}/closeout", payload: { unitization_lines: [ { unit_catalog_id: "${cat_t}", quantity: 1 } ] }, as: Controller, as_user_id: ctrl-1, captures: { err: $.data.error_id } }
            - { call: "POST /ucp/ciac-agreements/${ciac}/receive", payload: {}, as: RateAnalyst, as_user_id: rates-1 }
            - { call: "POST /ucp/work-orders/${wo}/closeout", payload: { unitization_lines: [ { unit_catalog_id: "${cat_t}", quantity: 1 } ] }, as: Controller, as_user_id: ctrl-1, captures: { st: $.data.status, applied: $.data.ciac_applied_cents, cap: $.data.capitalizable_total_cents } }
          assert:
            - "Pledged CIAC blocks closeout: ${err} == ERR_CIAC_PLEDGED_OUTSTANDING"
            - "After receive: closeout succeeds, status ${st} == CLOSED, ciac_applied ${applied} == 50000, capitalizable ${cap} == 70000 (120000 - 50000)"

      - name: unitization_zero_target_rejected
        claim_type: violation_to_error
        grounds: ["errors[ERR_UNITIZATION_ZERO_TARGET]", calculations.unitization_allocation]
        distinguishing_aspect: "A closeout whose only line references a zero-standard-cost class has total target 0 and fails ERR_UNITIZATION_ZERO_TARGET; adding a positive-weight line salvages the same closeout and allocates 0c to the zero-weight line."
        test_recipe:
          setup: ["CAPITAL work order completed with a 120,000c charge; catalog has METER (standard_cost 0) and TRANSFORMER (50,000c); period 2026-08 open"]
          setup_api_calls:
            - { call: "POST /ucp/capital-programs", payload: { code: "CAP-ZT", fiscal_year: 2026, authorized_amount_cents: 100000000, afudc_debt_rate_pct: 12.0, afudc_equity_rate_pct: 0.0, afudc_debt_weight_pct: 100, afudc_method: HALF_MONTH, ciac_method: NET_OF_CIAC }, as: SystemAdmin, as_user_id: admin-1, captures: { prog: $.data.id } }
            - { call: "POST /ucp/unit-catalog", payload: { asset_class: METER, standard_cost_cents: 0, annual_depreciation_rate_pct: 6.0 }, as: SystemAdmin, as_user_id: admin-1, captures: { cat_m: $.data.id } }
            - { call: "POST /ucp/unit-catalog", payload: { asset_class: TRANSFORMER, standard_cost_cents: 50000, annual_depreciation_rate_pct: 12.0 }, as: SystemAdmin, as_user_id: admin-1, captures: { cat_t: $.data.id } }
            - { call: "POST /ucp/overhead-schedules", payload: { cost_type: MATERIAL, order_type: CAPITAL, rate_pct: 0.0, effective_from: "2026-01-01" }, as: SystemAdmin, as_user_id: admin-1 }
            - { call: "POST /ucp/accounting-periods", payload: { fiscal_year: 2026, period_no: 8, start_date: "2026-08-01", end_date: "2026-08-31" }, as: SystemAdmin, as_user_id: admin-1 }
            - { call: "POST /ucp/work-orders", payload: { program_id: "${prog}", order_type: CAPITAL, title: "Zero target", initial_estimated_cost_cents: 500000 }, as: ProjectEngineer, as_user_id: eng-1, captures: { wo: $.data.id } }
            - { call: "POST /ucp/work-orders/${wo}/submit", payload: {}, as: ProjectEngineer, as_user_id: eng-1, captures: { wo_v2: $.data.version } }
            - { call: "GET /ucp/estimates", payload: { work_order_id: "${wo}" }, as: Auditor, captures: { est: "$.data[0].id" } }
            - { call: "POST /ucp/estimates/${est}/approve", payload: { expected_work_order_version: "${wo_v2}" }, as: WorkOrderSupervisor, as_user_id: sup-1 }
            - { call: "POST /ucp/work-orders/${wo}/authorize", payload: {}, as: WorkOrderSupervisor, as_user_id: sup-1 }
            - { call: "POST /ucp/work-orders/${wo}/start", payload: {}, as: WorkOrderSupervisor, as_user_id: sup-1 }
            - { call: "POST /ucp/cost-charges", payload: { work_order_id: "${wo}", cost_type: MATERIAL, base_amount_cents: 120000, charge_date: "2026-08-05" }, as: FieldClerk, as_user_id: clerk-1 }
            - { call: "POST /ucp/work-orders/${wo}/complete", payload: { in_service_date: "2026-08-20" }, as: WorkOrderSupervisor, as_user_id: sup-1 }
          trigger:
            - { call: "POST /ucp/work-orders/${wo}/closeout", payload: { unitization_lines: [ { unit_catalog_id: "${cat_m}", quantity: 3 } ] }, as: Controller, as_user_id: ctrl-1, captures: { err: $.data.error_id } }
            - { call: "POST /ucp/work-orders/${wo}/closeout", payload: { unitization_lines: [ { unit_catalog_id: "${cat_m}", quantity: 3 }, { unit_catalog_id: "${cat_t}", quantity: 1 } ] }, as: Controller, as_user_id: ctrl-1, captures: { st: $.data.status } }
            - { call: "GET /ucp/fixed-asset-units", payload: { work_order_id: "${wo}" }, as: Auditor, captures: { a0: "$.data[0].allocated_cost_cents", a1: "$.data[1].allocated_cost_cents" } }
          assert:
            - "All-zero target rejected: ${err} == ERR_UNITIZATION_ZERO_TARGET"
            - "Mixed lines succeed: ${st} == CLOSED; zero-weight METER line allocated ${a0} == 0, TRANSFORMER line ${a1} == 120000"

      - name: program_close_blocked_by_open_work_orders
        claim_type: violation_to_error
        grounds: ["errors[ERR_PROGRAM_HAS_OPEN_WORK_ORDERS]", state_machines.CapitalProgram.OPEN_to_CLOSED]
        distinguishing_aspect: "A program with a non-terminal work order (even DRAFT) cannot close; cancelling the order releases the close."
        test_recipe:
          setup: ["Program with one DRAFT work order"]
          setup_api_calls:
            - { call: "POST /ucp/capital-programs", payload: { code: "CAP-PCLOSE", fiscal_year: 2026, authorized_amount_cents: 5000000, afudc_debt_rate_pct: 12.0, afudc_equity_rate_pct: 0.0, afudc_debt_weight_pct: 100, afudc_method: HALF_MONTH, ciac_method: NET_OF_CIAC }, as: SystemAdmin, as_user_id: admin-1, captures: { prog: $.data.id } }
            - { call: "POST /ucp/work-orders", payload: { program_id: "${prog}", order_type: CAPITAL, title: "Blocking order", initial_estimated_cost_cents: 100000 }, as: ProjectEngineer, as_user_id: eng-1, captures: { wo: $.data.id } }
          trigger:
            - { call: "POST /ucp/capital-programs/${prog}/close", payload: {}, as: Controller, as_user_id: ctrl-1, captures: { err: $.data.error_id } }
            - { call: "POST /ucp/work-orders/${wo}/cancel", payload: {}, as: WorkOrderSupervisor, as_user_id: sup-1 }
            - { call: "POST /ucp/capital-programs/${prog}/close", payload: {}, as: Controller, as_user_id: ctrl-1, captures: { st: $.data.status } }
          assert:
            - "Blocked: ${err} == ERR_PROGRAM_HAS_OPEN_WORK_ORDERS"
            - "After cancel: close succeeds, status ${st} == CLOSED"

