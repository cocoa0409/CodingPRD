            - "${e_ser} == ERR_DUPLICATE_SERIAL_NUMBER with HTTP 409, even though the second unit belongs to a different branch"
            - "GET /home-oxygen/patients reports total_count 2 after the third call (MRN-0270 and MRN-0271) and GET /home-oxygen/equipment-units reports total_count 1"
            - "Patient.${p2_id}.mrn == \"MRN-0271\": only the collision is refused, not the branch"

      - name: qualifying_test_is_immutable_and_carries_no_version
        claim_type: immutability
        grounds:
          - entities.QualifyingTest
          - endpoints[GET /home-oxygen/qualifying-tests/{qualifying_test_id}]
          - calculations.qualifying_group_determination
        distinguishing_aspect: |
          QualifyingTest is the one entity declared with common_fields false: §1.5 exposes no PATCH
          and no DELETE for it and the row carries no version field, so a re-read of a study can
          never disagree with the certificate that was scored against it.
        test_recipe:
          setup:
            - "One branch, one ACTIVE patient, and one RESTING_ROOM_AIR study with spo2_percent 87 recorded at 2026-07-25T14:00:00Z."
          setup_api_calls:
