# =============================================================================
# §1.8 Scaffold Difficulty Design (Test Targeting Index)
# Task 2788 — Supermarket In-Store Bakery Production Planning
#
# 9 rule_ids / 22 instances. Every numeric literal in an `assert:` line was
# computed against the named calculations[].formula and its constants:.
# Shared fixture conventions used by every instance below:
#   * logical clock is set explicitly (server default would be 2026-08-01T00:00:00Z)
#   * business_date 2026-08-12 is a WEDNESDAY -> DOW_UPLIFT 1.00, so forecast
#     uplift never distorts the arithmetic under test
#   * oven shift window is 2026-08-12T04:00:00Z .. 2026-08-12T20:00:00Z
#   * a THAW_AND_SERVE product "THAW-FIL" (units_per_rack 1, zero labor, zero
#     recipe) is forecast at 1 unit purely to make generate-plan non-empty so
#     the BakeDay reaches PLANNED; it consumes no oven, no labor and no
#     ingredient, and stays SCHEDULED for the whole test
# =============================================================================

scaffold_difficulty_design:

  # ===========================================================================
  - rule_id: dual_variant_calc
    instances:

      - name: run_labor_planned_vs_actual_diverges_on_allergen_changeover
        grounds:
          - calculations.run_labor_minutes
          - entities.ProductionRun.fields.planned_labor_minutes
          - entities.ProductionRun.fields.final_labor_minutes
          - entities.Oven.fields.changeover_buffer_minutes
          - state_machines.ProductionRun.BAKING_to_COMPLETED
        distinguishing_aspect: |
          Subject is LABOR MINUTES on a ProductionRun: the PLANNED variant reads only
          Product.setup_labor_minutes, rack_count and METHOD_LABOR_FACTOR and returns
          68.00, while the ACTUAL variant additionally reads the COMPLETED predecessor
          run on the same oven deck and adds changeover_buffer_minutes * 0.5 = 10.00,
          returning 78.00 for the identical run row.
        test_recipe:
          setup:
            - "One department, one 2-deck oven with changeover_buffer_minutes 20, one flour ingredient with plenty on hand."
            - "PAR-CROIS (PAR_BAKED, allergen_tags [WHEAT]) already COMPLETED on oven deck 0 with bake window 05:00-05:20Z."
            - "SCR-MILK (SCRATCH, allergen_tags [WHEAT, MILK]) scheduled on the SAME oven deck 0, bake 06:00Z, 4 racks."
            - "BakeDay is PLANNED with labor_budget_minutes 600."
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-08-10T04:00:00Z" }
              as: RegionalAdmin
            - call: "POST /bakery/departments"
              payload: { name: "Store 41 Bakery", store_number: "0041", shrink_budget_pct: 0.03, labor_rate_cents_per_minute: 40, freight_surcharge_pct: 0.05 }
              as: RegionalAdmin
              captures: { dept_id: $.data.id }
            - call: "POST /bakery/ingredients"
              payload: { department_id: "${dept_id}", name: "Bread Flour", case_pack_units: 45, unit_cost_cents: 10, shelf_life_days: 30, daily_usage_units: 40, reorder_point_units: 120, on_hand_units: 2000, allergen_tags: ["WHEAT"] }
              as: RegionalAdmin
              captures: { flour_id: $.data.id }
            - call: "POST /bakery/products"
              payload: { department_id: "${dept_id}", sku: "THAW-FIL", name: "Thaw Filler Danish", production_method: "THAW_AND_SERVE", units_per_rack: 1, proof_minutes: 0, bake_minutes: 0, cool_minutes: 0, base_labor_minutes_per_rack: 0, setup_labor_minutes: 0, unit_retail_cents: 100, shelf_life_hours: 24 }
              as: RegionalAdmin
              captures: { fil_id: $.data.id }
            - call: "POST /bakery/products"
              payload: { department_id: "${dept_id}", sku: "PAR-CROIS", name: "Par-baked Croissant", production_method: "PAR_BAKED", units_per_rack: 40, proof_minutes: 0, bake_minutes: 20, cool_minutes: 15, base_labor_minutes_per_rack: 10, setup_labor_minutes: 15, unit_retail_cents: 150, shelf_life_hours: 10, allergen_tags: ["WHEAT"], recipe_lines: [{ ingredient_id: "${flour_id}", units_per_rack: 30 }] }
              as: RegionalAdmin
              captures: { crois_id: $.data.id }
            - call: "POST /bakery/products"
              payload: { department_id: "${dept_id}", sku: "SCR-MILK", name: "Scratch Milk Bread", production_method: "SCRATCH", units_per_rack: 20, proof_minutes: 45, bake_minutes: 30, cool_minutes: 20, base_labor_minutes_per_rack: 12, setup_labor_minutes: 20, unit_retail_cents: 250, shelf_life_hours: 12, allergen_tags: ["WHEAT", "MILK"], recipe_lines: [{ ingredient_id: "${flour_id}", units_per_rack: 20 }] }
              as: RegionalAdmin
              captures: { milk_id: $.data.id }
            - call: "POST /bakery/ovens"
              payload: { department_id: "${dept_id}", name: "Deck Oven A", deck_count: 2, rack_capacity_per_deck: 4, changeover_buffer_minutes: 20, allergen_mode: "SHARED" }
              as: RegionalAdmin
              captures: { oven_a_id: $.data.id }
            - call: "POST /bakery/bake-days"
              payload: { department_id: "${dept_id}", business_date: "2026-08-12", labor_budget_minutes: 600, oven_shift_start_utc: "2026-08-12T04:00:00Z", oven_shift_end_utc: "2026-08-12T20:00:00Z" }
              as: DepartmentManager
              as_user_id: "${dept_id}"
              captures: { bd_id: $.data.id }
            - call: "POST /bakery/bake-days/${bd_id}/forecast-lines"
              payload: { product_id: "${fil_id}", daypart: "MORNING", forecasted_units: 1 }
              as: DepartmentManager
              as_user_id: "${dept_id}"
              captures: { bd_v1: $.data.version }
            - call: "POST /bakery/bake-days/${bd_id}/generate-plan"
              payload: { expected_bake_day_version: "${bd_v1}" }
              as: DepartmentManager
              as_user_id: "${dept_id}"
            - call: "POST /bakery/production-runs"
              payload: { bake_day_id: "${bd_id}", product_id: "${crois_id}", rack_count: 2, oven_id: "${oven_a_id}", deck_index: 0, bake_start_utc: "2026-08-12T05:00:00Z" }
              as: Baker
              as_user_id: "baker-01"
              captures: { run_a_id: $.data.id }
            - call: "POST /bakery/production-runs/${run_a_id}/start-bake"
              payload: {}
              as: Baker
              as_user_id: "baker-01"
            - call: "POST /bakery/production-runs/${run_a_id}/complete"
              payload: { actual_units: 80 }
              as: Baker
              as_user_id: "baker-01"
            - call: "POST /bakery/production-runs"
              payload: { bake_day_id: "${bd_id}", product_id: "${milk_id}", rack_count: 4, oven_id: "${oven_a_id}", deck_index: 0, proof_start_utc: "2026-08-12T05:15:00Z", bake_start_utc: "2026-08-12T06:00:00Z" }
              as: Baker
              as_user_id: "baker-01"
              captures: { run_b_id: $.data.id, run_b_planned_labor: $.data.planned_labor_minutes }
            - call: "POST /bakery/production-runs/${run_b_id}/start-proof"
              payload: {}
              as: Baker
              as_user_id: "baker-01"
            - call: "POST /bakery/production-runs/${run_b_id}/start-bake"
              payload: {}
              as: Baker
              as_user_id: "baker-01"
          trigger:
            - call: "POST /bakery/production-runs/${run_b_id}/complete"
              payload: { actual_units: 80 }
              as: Baker
              as_user_id: "baker-01"
          assert:
            - "ProductionRun.${run_b_id}.planned_labor_minutes == 68.00 (PLANNED variant: 20 setup + 4 racks * 12 * 1.00)"
            - "ProductionRun.${run_b_id}.final_labor_minutes == 78.00 (ACTUAL variant: 68.00 + 20 * 0.5 allergen changeover allowance)"
            - "ProductionRun.${run_b_id}.final_labor_minutes - ProductionRun.${run_b_id}.planned_labor_minutes == 10.00"
            - "ProductionRun.${run_a_id}.final_labor_minutes == 27.00 (no predecessor on deck 0, so no changeover allowance)"
            - "BakeDay.${bd_id}.planned_labor_minutes == 95.00"
            - "BakeDay.${bd_id}.actual_labor_minutes == 105.00 (27.00 + 78.00)"
            - "ProductionRun.${run_b_id}.ingredient_cost_cents == 800 and unit_cost_basis_cents == 10"

      - name: shrink_rate_cost_basis_vs_unit_basis_diverge_on_same_waste
        grounds:
          - calculations.shrink_rate
          - calculations.bake_day_rollups
          - entities.BakeDay.fields.shrink_cost_basis_pct
          - entities.BakeDay.fields.shrink_unit_basis_pct
          - entities.BakeDay.fields.markdown_authorization
        distinguishing_aspect: |
          Subject is the SHRINK RATE on a BakeDay (accounting on WasteRecord aggregates,
          a different entity domain from ProductionRun labor): the same 10 wasted units
          yield shrink_cost_basis_pct 0.0714 (100 cents of waste over 1400 cents of
          production) and shrink_unit_basis_pct 0.0625 (10 units over 160 produced),
          and ONLY the cost-basis variant flips markdown_authorization to MANAGER_ONLY.
        test_recipe:
          setup:
            - "Department shrink_budget_pct 0.03."
            - "Two COMPLETED runs on the same PLANNED BakeDay: SCR-MILK 4 racks (ingredient_cost 800, 80 units, basis 10 cents/unit) on deck 0 and PAR-CROIS 2 racks (ingredient_cost 600, 80 units, basis 8 cents/unit) on deck 1."
            - "No waste attested yet; markdown_authorization is AUTO."
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-08-10T04:00:00Z" }
              as: RegionalAdmin
            - call: "POST /bakery/departments"
              payload: { name: "Store 41 Bakery", store_number: "0041", shrink_budget_pct: 0.03, labor_rate_cents_per_minute: 40, freight_surcharge_pct: 0.05 }
              as: RegionalAdmin
              captures: { dept_id: $.data.id }
            - call: "POST /bakery/ingredients"
              payload: { department_id: "${dept_id}", name: "Bread Flour", case_pack_units: 45, unit_cost_cents: 10, shelf_life_days: 30, daily_usage_units: 40, reorder_point_units: 120, on_hand_units: 2000, allergen_tags: ["WHEAT"] }
              as: RegionalAdmin
              captures: { flour_id: $.data.id }
            - call: "POST /bakery/products"
              payload: { department_id: "${dept_id}", sku: "THAW-FIL", name: "Thaw Filler Danish", production_method: "THAW_AND_SERVE", units_per_rack: 1, proof_minutes: 0, bake_minutes: 0, cool_minutes: 0, base_labor_minutes_per_rack: 0, setup_labor_minutes: 0, unit_retail_cents: 100, shelf_life_hours: 24 }
              as: RegionalAdmin
              captures: { fil_id: $.data.id }
            - call: "POST /bakery/products"
              payload: { department_id: "${dept_id}", sku: "PAR-CROIS", name: "Par-baked Croissant", production_method: "PAR_BAKED", units_per_rack: 40, proof_minutes: 0, bake_minutes: 20, cool_minutes: 15, base_labor_minutes_per_rack: 10, setup_labor_minutes: 15, unit_retail_cents: 150, shelf_life_hours: 10, allergen_tags: ["WHEAT"], recipe_lines: [{ ingredient_id: "${flour_id}", units_per_rack: 30 }] }
              as: RegionalAdmin
              captures: { crois_id: $.data.id }
            - call: "POST /bakery/products"
              payload: { department_id: "${dept_id}", sku: "SCR-MILK", name: "Scratch Milk Bread", production_method: "SCRATCH", units_per_rack: 20, proof_minutes: 45, bake_minutes: 30, cool_minutes: 20, base_labor_minutes_per_rack: 12, setup_labor_minutes: 20, unit_retail_cents: 250, shelf_life_hours: 12, allergen_tags: ["WHEAT", "MILK"], recipe_lines: [{ ingredient_id: "${flour_id}", units_per_rack: 20 }] }
              as: RegionalAdmin
              captures: { milk_id: $.data.id }
            - call: "POST /bakery/ovens"
              payload: { department_id: "${dept_id}", name: "Deck Oven A", deck_count: 2, rack_capacity_per_deck: 4, changeover_buffer_minutes: 20, allergen_mode: "SHARED" }
              as: RegionalAdmin
              captures: { oven_a_id: $.data.id }
            - call: "POST /bakery/bake-days"
              payload: { department_id: "${dept_id}", business_date: "2026-08-12", labor_budget_minutes: 600, oven_shift_start_utc: "2026-08-12T04:00:00Z", oven_shift_end_utc: "2026-08-12T20:00:00Z" }
              as: DepartmentManager
              as_user_id: "${dept_id}"
              captures: { bd_id: $.data.id }
            - call: "POST /bakery/bake-days/${bd_id}/forecast-lines"
              payload: { product_id: "${fil_id}", daypart: "MORNING", forecasted_units: 1 }
              as: DepartmentManager
              as_user_id: "${dept_id}"
              captures: { bd_v1: $.data.version }
            - call: "POST /bakery/bake-days/${bd_id}/generate-plan"
              payload: { expected_bake_day_version: "${bd_v1}" }
              as: DepartmentManager
              as_user_id: "${dept_id}"
            - call: "POST /bakery/production-runs"
              payload: { bake_day_id: "${bd_id}", product_id: "${milk_id}", rack_count: 4, oven_id: "${oven_a_id}", deck_index: 0, proof_start_utc: "2026-08-12T04:15:00Z", bake_start_utc: "2026-08-12T05:00:00Z" }
              as: Baker
              as_user_id: "baker-01"
              captures: { run_x_id: $.data.id }
            - call: "POST /bakery/production-runs"
              payload: { bake_day_id: "${bd_id}", product_id: "${crois_id}", rack_count: 2, oven_id: "${oven_a_id}", deck_index: 1, bake_start_utc: "2026-08-12T05:00:00Z" }
              as: Baker
              as_user_id: "baker-01"
              captures: { run_y_id: $.data.id }
            - call: "POST /bakery/production-runs/${run_x_id}/start-proof"
              payload: {}
              as: Baker
              as_user_id: "baker-01"
            - call: "POST /bakery/production-runs/${run_x_id}/start-bake"
              payload: {}
              as: Baker
              as_user_id: "baker-01"
            - call: "POST /bakery/production-runs/${run_x_id}/complete"
              payload: { actual_units: 80 }
              as: Baker
              as_user_id: "baker-01"
            - call: "POST /bakery/production-runs/${run_y_id}/start-bake"
              payload: {}
              as: Baker
              as_user_id: "baker-01"
            - call: "POST /bakery/production-runs/${run_y_id}/complete"
              payload: { actual_units: 80 }
              as: Baker
              as_user_id: "baker-01"
          trigger:
            - call: "POST /bakery/waste-records"
              payload: { production_run_id: "${run_x_id}", disposition_reason: "BURNT", units: 10 }
              as: Baker
              as_user_id: "baker-02"
              captures: { waste_id: $.data.id }
          assert:
            - "WasteRecord.${waste_id}.unit_cost_basis_cents == 10 and waste_cost_cents == 100"
            - "BakeDay.${bd_id}.production_cost_cents == 1400 and produced_units_total == 160"
            - "BakeDay.${bd_id}.shrink_cost_basis_pct == 0.0714 (100/1400 rounded half-up to 4dp)"
            - "BakeDay.${bd_id}.shrink_unit_basis_pct == 0.0625 (10/160)"
            - "BakeDay.${bd_id}.shrink_cost_basis_pct != BakeDay.${bd_id}.shrink_unit_basis_pct"
            - "BakeDay.${bd_id}.markdown_authorization == MANAGER_ONLY (driven by the COST_BASIS variant only: 0.0714 > 0.03)"
            - "ProductionRun.${run_x_id}.on_shelf_units == 70 and wasted_units_total == 10 and disposition_status == ON_SHELF"

  # ===========================================================================
  - rule_id: combinatorial_formula
    instances:

      - name: plan_generation_takes_min_of_forecast_labor_and_oven_racks
        grounds:
          - calculations.bake_day_plan_generation
          - entities.BakeDay.fields.plan_unmet_unit_count
          - entities.BakeDay.fields.labor_budget_minutes
          - entities.Oven.fields.rack_capacity_per_deck
          - endpoints.POST_/bakery/bake-days/{bakeDayId}/generate-plan
        distinguishing_aspect: |
          Mode (a): min/max SELECTION among three competing candidate rack counts —
          forecast-required racks (12), labor-affordable racks (6) and oven-capacity
          racks (4) — where the winner differs per forecast line (line 1 is capped by
          its forecast at 2, line 2 by oven capacity at 4) and the residual labor
          budget consumed by line 1 changes line 2's candidate set.
        test_recipe:
          setup:
            - "labor_budget_minutes 120; one 2-deck oven with rack_capacity_per_deck 4 and changeover_buffer_minutes 20."
            - "Forecast line 1: PAR-CROIS (PAR_BAKED, units_per_rack 40, setup 15, base 10/rack) MORNING 60 units."
            - "Forecast line 2: SCR-ROLL (SCRATCH, units_per_rack 25, setup 20, base 12/rack, proof 45) MIDDAY 280 units."
            - "business_date 2026-08-12 is a Wednesday so DOW_UPLIFT is 1.00 and effective_units equal forecasted_units."
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-08-10T04:00:00Z" }
              as: RegionalAdmin
            - call: "POST /bakery/departments"
              payload: { name: "Store 41 Bakery", store_number: "0041", shrink_budget_pct: 0.03, labor_rate_cents_per_minute: 40, freight_surcharge_pct: 0.05 }
              as: RegionalAdmin
              captures: { dept_id: $.data.id }
            - call: "POST /bakery/ingredients"
              payload: { department_id: "${dept_id}", name: "Bread Flour", case_pack_units: 45, unit_cost_cents: 10, shelf_life_days: 30, daily_usage_units: 40, reorder_point_units: 120, on_hand_units: 2000, allergen_tags: ["WHEAT"] }
              as: RegionalAdmin
              captures: { flour_id: $.data.id }
            - call: "POST /bakery/products"
              payload: { department_id: "${dept_id}", sku: "PAR-CROIS", name: "Par-baked Croissant", production_method: "PAR_BAKED", units_per_rack: 40, proof_minutes: 0, bake_minutes: 20, cool_minutes: 15, base_labor_minutes_per_rack: 10, setup_labor_minutes: 15, unit_retail_cents: 150, shelf_life_hours: 10, allergen_tags: ["WHEAT"], recipe_lines: [{ ingredient_id: "${flour_id}", units_per_rack: 30 }] }
              as: RegionalAdmin
              captures: { crois_id: $.data.id }
            - call: "POST /bakery/products"
              payload: { department_id: "${dept_id}", sku: "SCR-ROLL", name: "Scratch Dinner Roll", production_method: "SCRATCH", units_per_rack: 25, proof_minutes: 45, bake_minutes: 30, cool_minutes: 20, base_labor_minutes_per_rack: 12, setup_labor_minutes: 20, unit_retail_cents: 199, shelf_life_hours: 12, allergen_tags: ["WHEAT"], recipe_lines: [{ ingredient_id: "${flour_id}", units_per_rack: 25 }] }
              as: RegionalAdmin
              captures: { roll_id: $.data.id }
            - call: "POST /bakery/ovens"
              payload: { department_id: "${dept_id}", name: "Deck Oven A", deck_count: 2, rack_capacity_per_deck: 4, changeover_buffer_minutes: 20, allergen_mode: "SHARED" }
              as: RegionalAdmin
              captures: { oven_a_id: $.data.id }
            - call: "POST /bakery/bake-days"
              payload: { department_id: "${dept_id}", business_date: "2026-08-12", labor_budget_minutes: 120, oven_shift_start_utc: "2026-08-12T04:00:00Z", oven_shift_end_utc: "2026-08-12T20:00:00Z" }
              as: DepartmentManager
              as_user_id: "${dept_id}"
              captures: { bd_id: $.data.id }
            - call: "POST /bakery/bake-days/${bd_id}/forecast-lines"
              payload: { product_id: "${crois_id}", daypart: "MORNING", forecasted_units: 60 }
              as: DepartmentManager
              as_user_id: "${dept_id}"
            - call: "POST /bakery/bake-days/${bd_id}/forecast-lines"
              payload: { product_id: "${roll_id}", daypart: "MIDDAY", forecasted_units: 280 }
              as: DepartmentManager
              as_user_id: "${dept_id}"
              captures: { bd_v2: $.data.version }
          trigger:
            - call: "POST /bakery/bake-days/${bd_id}/generate-plan"
              payload: { expected_bake_day_version: "${bd_v2}" }
              as: DepartmentManager
              as_user_id: "${dept_id}"
          assert:
            - "BakeDay.${bd_id}.plan_posture == PLANNED"
            - "exactly 2 ProductionRun rows exist for ${bd_id}"
            - "PAR-CROIS run: rack_count == 2 (forecast candidate 2 wins over affordable 7 and capacity 4), planned_labor_minutes == 27.00 (15 + 2*10*0.60)"
            - "SCR-ROLL run: rack_count == 4 (oven-capacity candidate 4 wins over required 12 and affordable 6, where affordable = floor((120-27-20)/12) = 6)"
            - "SCR-ROLL run: planned_labor_minutes == 68.00 (20 + 4*12*1.00)"
            - "BakeDay.${bd_id}.planned_labor_minutes == 95.00 and 95.00 <= 120"
            - "BakeDay.${bd_id}.planned_units_total == 180 (2*40 + 4*25)"
            - "BakeDay.${bd_id}.plan_unmet_unit_count == 180 (0 unmet croissants + 280 - 100 rolls)"
            - "PAR-CROIS run: deck_index == 0, bake_start_utc == 2026-08-12T04:00:00Z, proof_start_utc == null"
            - "SCR-ROLL run: bake_start_utc == 2026-08-12T04:45:00Z and proof_start_utc == 2026-08-12T04:00:00Z (proof may not start before the oven shift, which binds later than the 04:40 buffered deck release)"

      - name: ingredient_order_freight_rounds_per_line_then_sums
        grounds:
          - calculations.ingredient_order_costing
          - entities.IngredientOrder.fields.lines
          - entities.IngredientOrder.fields.order_total_cents
          - entities.BakeryDepartment.fields.freight_surcharge_pct
          - concurrency_rules
        distinguishing_aspect: |
          Mode (b): PER-ELEMENT rounding then aggregation. Each line applies the 5%
          freight surcharge to its own case-pack-rounded cost and rounds to whole
          cents (1350 -> 1417.5 -> 1418) before the order sums the two lines to 2836;
          aggregating first and rounding once would give round_half_up(2700 * 1.05)
          = 2835, so the two evaluation orders differ by 1 cent.
        test_recipe:
          setup:
            - "Department freight_surcharge_pct 0.05."
            - "FLOUR: case_pack_units 45, unit_cost_cents 10, daily_usage 40, shelf_life_days 30 (cap 1200 units)."
            - "SUGAR: case_pack_units 30, unit_cost_cents 15, daily_usage 20, shelf_life_days 10 (cap 200 units)."
            - "Order requests 100 flour units and 75 sugar units, both of which round up to 3 cases."
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-08-10T04:00:00Z" }
              as: RegionalAdmin
            - call: "POST /bakery/departments"
              payload: { name: "Store 41 Bakery", store_number: "0041", shrink_budget_pct: 0.03, labor_rate_cents_per_minute: 40, freight_surcharge_pct: 0.05 }
              as: RegionalAdmin
              captures: { dept_id: $.data.id }
            - call: "POST /bakery/ingredients"
              payload: { department_id: "${dept_id}", name: "Bread Flour", case_pack_units: 45, unit_cost_cents: 10, shelf_life_days: 30, daily_usage_units: 40, reorder_point_units: 120, on_hand_units: 2000, allergen_tags: ["WHEAT"] }
              as: RegionalAdmin
              captures: { flour_id: $.data.id }
            - call: "POST /bakery/ingredients"
              payload: { department_id: "${dept_id}", name: "Baker Sugar", case_pack_units: 30, unit_cost_cents: 15, shelf_life_days: 10, daily_usage_units: 20, reorder_point_units: 60, on_hand_units: 500 }
              as: RegionalAdmin
              captures: { sugar_id: $.data.id }
            - call: "GET /bakery/departments/${dept_id}"
              payload: {}
              as: DepartmentManager
              as_user_id: "${dept_id}"
              captures: { dept_v: $.data.version }
          trigger:
