  # ==========================================================================
  - rule_id: non_linear_state_machine
    instances:

      - name: donor_info_requested_revision_cycle
        grounds:
          - state_machines.Donor.SCREENING_to_INFO_REQUESTED
          - state_machines.Donor.INFO_REQUESTED_to_SCREENING
          - state_machines.Donor.SCREENING_to_QUALIFIED
          - state_machines.HealthHistoryQuestionnaire.ACCEPTED_to_SUPERSEDED
          - calculations.donor_risk_score
          - entities.Donor.fields.qualified_by_user_id
        distinguishing_aspect: |
          The Donor machine is cyclic on the SCREENING <-> INFO_REQUESTED pair: the same donor
          row re-enters SCREENING it has already left, and only the SECOND traversal reaches
          QUALIFIED. A linear implementation that treats INFO_REQUESTED as terminal, or that
          refuses a second questionnaire, can never qualify this donor. The revisit is proven
          by the first questionnaire ending SUPERSEDED while the row itself moves forward.
        test_recipe:
          setup:
            - "Logical clock is 2026-08-05T08:00:00Z."
            - "Donor DNR-1007 has submitted one questionnaire flagging 2 medications and recent travel with no serology on file, giving base 41 and screening 61, which is above RISK_ACCEPT_MAX (60) and at or below RISK_DEFER_MAX (85)."
            - "The donor therefore sits in INFO_REQUESTED with an INFO_REQUESTED questionnaire."
            - "A non-reactive serology panel and an active physician approval are then filed, so the only thing still blocking qualification is the questionnaire verdict."
          setup_api_calls:
            - { call: "POST /milk-bank/_clock/set_current_utc", payload: { current_utc: "2026-08-05T08:00:00Z" }, as: MilkBankAdmin, as_user_id: "u-admin-1" }
            - { call: "POST /milk-bank/donors", payload: { donor_code: "DNR-1007", full_name: "Gil Haddad", email: "gil.haddad@example.org", zone_code: "Z1" }, as: IntakeCoordinator, as_user_id: "u-intake-1", captures: { gh: "$.data.id" } }
            - { call: "POST /milk-bank/donors/${gh}/health-history", payload: { medication_flag_count: 2, travel_risk_flag: true, tobacco_use: false, alcohol_units_per_week: 0, months_postpartum: 12 }, as: IntakeCoordinator, as_user_id: "u-intake-1" }
            - { call: "POST /milk-bank/donors/${gh}/serology-panels", payload: { collected_on: "2026-07-20", hiv_result: "NON_REACTIVE", htlv_result: "NON_REACTIVE", hbv_result: "NON_REACTIVE", hcv_result: "NON_REACTIVE", syphilis_result: "NON_REACTIVE" }, as: MedicalDirector, as_user_id: "u-md-1" }
            - { call: "POST /milk-bank/donors/${gh}/physician-approvals", payload: { physician_npi: "1234567893", approved_on: "2026-07-15" }, as: MedicalDirector, as_user_id: "u-md-1" }
          trigger:
            - { call: "POST /milk-bank/donors/${gh}/health-history", payload: { medication_flag_count: 0, travel_risk_flag: false, tobacco_use: false, alcohol_units_per_week: 0, months_postpartum: 12 }, as: IntakeCoordinator, as_user_id: "u-intake-1" }
            - { call: "GET /milk-bank/donors/${gh}", payload: {}, as: MedicalDirector, as_user_id: "u-md-1", captures: { st_after_revision: "$.data.status" } }
            - { call: "POST /milk-bank/donors/${gh}/qualify", payload: {}, as: MedicalDirector, as_user_id: "u-md-1" }
          assert:
            - "${st_after_revision} == SCREENING (the row re-entered a state it had already left)"
            - "GET /milk-bank/donors/${gh}/health-history returns 2 rows created_at ASC and data[0].status == SUPERSEDED"
            - "data[0].base_risk_points == 41 and data[0].screening_risk_score == 61"
            - "data[1].status == ACCEPTED and data[1].base_risk_points == 0 and data[1].screening_risk_score == 0"
            - "Donor.${gh}.screening_risk_score == 0 and surveillance_risk_score == 0"
            - "Donor.${gh}.status == QUALIFIED"
            - "Donor.${gh}.qualified_by_user_id == u-md-1 and qualified_at == 2026-08-05T08:00:00Z"

      - name: run_three_parallel_dimensions
        grounds:
          - state_machines.PasteurizationRun.IN_PROGRESS_to_COMPLETED
          - state_machines.PasteurizationRun.COMPLETED_to_BOTTLED
          - state_machines.PasteurizationRun.COMPLETED_to_COMPLETED
          - entities.PasteurizationRun.fields.run_status
          - entities.PasteurizationRun.fields.thermal_status
          - entities.PasteurizationRun.fields.culture_status
          - entities.PasteurizationRun.fields.release_eligibility
          - calculations.thermal_hold_verification
        distinguishing_aspect: |
          PasteurizationRun — a different entity from Donor — is not cyclic but PARALLEL: three
          independent dimensions live on one row and release_eligibility is derived from two of
          them. Bottling advances run_status COMPLETED -> BOTTLED while culture_status stays
          NOT_COLLECTED and release_eligibility stays BLOCKED; the culture call then advances
          culture_status to PASSED and flips release_eligibility to ELIGIBLE without moving
          run_status off the terminal BOTTLED. A single-status-field implementation cannot hold
          both facts at once.
        test_recipe:
          setup:
            - "Pool POOL-0001 is COMMITTED with 2100 ml from three distinct donors and projected_kcal_per_oz 20.14."
