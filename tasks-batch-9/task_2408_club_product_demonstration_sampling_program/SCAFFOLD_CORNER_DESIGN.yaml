          assert:
            - "the response status is 201"
            - "${meas_state} == POSTED"
            - "${meas_created} is not null"
            - "the measurement response body has no version field and no updated_at field"
            - "§1.5 declares no PATCH or DELETE endpoint whose path resolves to a SalesLiftMeasurement row"
            - "SampleReconciliation.${recon_id}.recon_status == BALANCED"
            - "ClubProductBaseline.${baseline_id}.restatement_count == 0"

      - name: demo_event_create_with_unknown_product_id_returns_product_not_found
        claim_type: parent_relationships
        grounds:
          - validations[priority=7]
          - errors[ERR_PRODUCT_NOT_FOUND]
          - endpoints[POST /demo-events]
        distinguishing_aspect: "POST /demo-events resolves body foreign keys in the declared order manufacturer_id, club_id, product_id; with a real manufacturer and club but an unpersisted product_id the response is ERR_PRODUCT_NOT_FOUND 404, and no DemoEvent row is created."
        test_recipe:
          setup:
            - "A manufacturer and a club exist; no Product has ever been created."
          setup_api_calls:
