          - calculations.support_person_occupancy
          - entities.ObstetricUnit.fields.last_capacity_sweep_at
          - endpoints[POST /obstetric-units/{unitId}/capacity-sweep]
        distinguishing_aspect: |
          The sweep's six pinned steps each read a candidate set defined by a deadline comparison, and
          this unit is populated precisely so that every set is EMPTY while superficially similar rows
          exist: a CATEGORY_I assessment that never had a deadline to miss, an ISSUED support pass whose
          valid_until is a full day away, a fully covered encounter whose assigned units equal its
          required units, and two AVAILABLE LDR beds with no turnover pending. Advancing the clock ten
          minutes and sweeping must therefore stamp last_capacity_sweep_at and change nothing else — no
          breach counted, no pass expired, no encounter pushed to COVERAGE_BREACH. An implementation that
          filters on row existence rather than on due-ness breaches the CATEGORY_I chain or expires the
          pass; one that only writes last_capacity_sweep_at when work was found leaves it null.
        test_recipe:
          setup: |
            Clock at 2026-08-01T06:00:00Z. One unit with two AVAILABLE LDR beds and no bookings at all,
            so the promotion step of step 5 has an empty candidate set and cannot mistake this for a
            working sweep. One ADVANCED RN on an ACTIVE CHARGE shift 05:00-15:00 with
            capacity_units_effective 2.0. One term singleton vertex encounter in ANTEPARTUM covered
            RATIO_SHARED for 0.5 units, so required_coverage_units 0.5 equals assigned_coverage_units 0.5
            and coverage_deficit_units is 0.0. One CATEGORY_I assessment on that encounter sits in
            NOT_REQUIRED with a null escalation_due_at, and one PARTNER support pass is ISSUED with
            valid_until 2026-08-02T06:00:00Z. No bundle exists, so there are no checklist items to miss.
          setup_api_calls:
            - call: POST /_clock/set_current_utc
