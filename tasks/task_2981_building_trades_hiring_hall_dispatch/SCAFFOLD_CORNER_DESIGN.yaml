  - section: errors
    instances:
      - name: missing_blank_and_unknown_role_headers_are_unauthenticated
        claim_type: violation_to_error
        grounds:
          - errors.ERR_UNAUTHENTICATED
          - validations[priority=1]
        distinguishing_aspect: "Priority 1 rejects three separate header defects with the same code before any lookup happens: an empty X-User-Role, a role string outside the declared five, and an empty X-User-ID on an entity-backed role — and an unknown role loses even to a malformed body."
        test_recipe:
          setup:
            - "Clock 2026-09-01T00:00:00.000Z; one HOME local exists so the target of the read is real."
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { current_utc: "2026-09-01T00:00:00.000Z" }
              as: HallAdmin
            - call: "POST /hiring-hall/locals"
              payload: { local_number: 512, name: "Local 512 (home)", kind: "HOME", reciprocity_factor_bp: 0 }
              as: HallAdmin
              captures: { home_local_id: $.data.id }
          trigger:
            - call: "GET /hiring-hall/locals/${home_local_id}"
              payload: {}
              as: ""
              captures: { err_blank_role: $.data.error_id }
            - call: "GET /hiring-hall/locals/${home_local_id}"
              payload: {}
              as: "Steward"
              captures: { err_unknown_role: $.data.error_id }
            - call: "GET /hiring-hall/members/${home_local_id}"
              payload: {}
              as: Member
              as_user_id: ""
              captures: { err_blank_user: $.data.error_id }
            - call: "POST /hiring-hall/locals"
              payload: { local_number: "not-an-integer", name: "Local 999", kind: "SISTER" }
              as: "Steward"
              captures: { err_ladder: $.data.error_id }
          assert:
            - "HTTP 401 with ${err_blank_role} == ERR_UNAUTHENTICATED — an empty role header is not treated as an anonymous read"
            - "HTTP 401 with ${err_unknown_role} == ERR_UNAUTHENTICATED for the role Steward, which is outside {HallAdmin, Dispatcher, BusinessManager, ContractorRep, Member}"
            - "HTTP 401 with ${err_blank_user} == ERR_UNAUTHENTICATED — an entity-backed role with an empty X-User-ID never reaches the member lookup, so the answer is not ERR_MEMBER_NOT_FOUND"
            - "HTTP 401 with ${err_ladder} == ERR_UNAUTHENTICATED even though the body is also malformed — priority 1 runs before priority 3"
      - name: unknown_path_ids_return_each_entitys_own_not_found_code
        claim_type: violation_to_error
        grounds:
          - errors.ERR_LOCAL_NOT_FOUND
          - errors.ERR_LIST_NOT_FOUND
          - errors.ERR_CONTRACTOR_NOT_FOUND
          - errors.ERR_JOB_REQUEST_NOT_FOUND
          - errors.ERR_DISPATCH_NOT_FOUND
          - errors.ERR_GRIEVANCE_NOT_FOUND
          - errors.ERR_LEDGER_ENTRY_NOT_FOUND
          - validations[priority=4]
        distinguishing_aspect: "Priority 4 is per-entity, not generic: the same syntactically valid but unknown UUID produces a different error_id on each of the seven remaining path-parameter reads, so a shared 'ERR_NOT_FOUND' would fail every leg but one."
        test_recipe:
          setup:
            - "Clock 2026-09-01T00:00:00.000Z; no fixtures are needed — every id below is the all-zero UUID, which is well-formed and unknown."
          setup_api_calls:
