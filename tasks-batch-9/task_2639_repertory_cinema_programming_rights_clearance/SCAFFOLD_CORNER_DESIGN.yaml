      - name: member_tier_threshold_fires_at_the_exact_constant_and_not_one_cent_below
        claim_type: rate_threshold_triggers
        grounds:
          - calculations.member_standing
          - constants.TIER_SUPPORTER_CENTS
          - constants.TIER_BASIC_CENTS
          - entities.Member.effective_tier
          - entities.Member.comp_tickets_granted
        distinguishing_aspect: |
          The tier ladder uses >= comparisons, so a cumulative total of exactly TIER_SUPPORTER_CENTS must
          reach SUPPORTER while one cent less must stay BASIC - and the consequences (discount, advance window,
          comps) must move with it. Two members differing by a single cent isolate the comparison operator from
          everything else.
        test_recipe:
          setup:
            - "Both members are created with no donations, so both start PENDING with effective_tier PROSPECT."
            - "Ada Wells receives one donation of exactly 15000 cents, equal to TIER_SUPPORTER_CENTS, on 2026-03-01T10:00:00Z."
            - "Cy Marsh receives one donation of 14999 cents, one cent below the constant, on the same instant."
            - "The clock is at its startup default 2026-08-01T00:00:00Z, so both donations sit inside the 365-day rolling window and both sit before FISCAL_YEAR_START 2026-07-01, making fiscal_tier PROSPECT for each."
          setup_api_calls:
            - call: "POST /members"
              payload: { full_name: "Ada Wells", email: "ada@example.com", join_date: "2026-07-01" }
              as: BoxOfficeManager
              captures: { m1_id: $.data.id }
            - call: "POST /members"
              payload: { full_name: "Cy Marsh", email: "cy@example.com", join_date: "2026-07-01" }
              as: BoxOfficeManager
              captures: { m2_id: $.data.id }
          trigger:
            - call: "POST /members/${m1_id}/donations"
              payload: { amount_cents: 15000, received_at: "2026-03-01T10:00:00Z" }
              as: BoxOfficeManager
            - call: "POST /members/${m2_id}/donations"
              payload: { amount_cents: 14999, received_at: "2026-03-01T10:00:00Z" }
              as: BoxOfficeManager
          assert:
            - "Both donations return 200 and both members move PENDING -> ACTIVE, since 14999 still clears TIER_BASIC_CENTS 6000."
            - "Member.${m1_id}.rolling_donation_cents == 15000, rolling_tier == SUPPORTER, fiscal_ytd_donation_cents == 0, fiscal_tier == PROSPECT and effective_tier == SUPPORTER."
            - "Member.${m1_id}.discount_pct == 0.15, advance_access_hours == 48, comp_tickets_granted == 2 and comp_tickets_remaining == 2."
            - "Member.${m2_id}.rolling_donation_cents == 14999, rolling_tier == BASIC and effective_tier == BASIC."
            - "Member.${m2_id}.discount_pct == 0.10, advance_access_hours == 24, comp_tickets_granted == 0 and comp_tickets_remaining == 0."
            - "Both members have expires_at == 2027-03-01T10:00:00.000Z, so the term calculation is unaffected by the tier."
            - "A further 1-cent donation to Cy Marsh at the same instant lifts rolling_donation_cents to 15000 and flips effective_tier to SUPPORTER, discount_pct to 0.15 and comp_tickets_granted to 2."

      - name: four_level_cascade_from_one_confirmation
        claim_type: cascading_side_effects
        grounds:
          - complexity_profile.complexity_layers.cascading_side_effects
          - state_machines.SpecialEvent[PLANNED -> CONFIRMED]
        excluded_because:
          difficulty_instance: transitive_cascade / special_event_confirm_displacement_depth_four_cascade
          rationale: "The named 1.8 instance walks all four hops end to end from a single confirm and pins the state of every entity at each depth."

      - name: both_settlement_variants_over_one_dataset
        claim_type: dual_variant_calculation
        grounds:
          - complexity_profile.complexity_layers.dual_variant_calculation
          - calculations.settlement_film_rent.variants
        excluded_because:
          difficulty_instance: dual_variant_calc / settlement_provisional_vs_final_inclusion_set_divergence
          rationale: "The named 1.8 instance computes PROVISIONAL and FINAL over identical data and pins the delta on every figure."

  # ==========================================================================
  - section: consistency_model
    instances:

      - name: every_derived_figure_is_visible_in_the_same_response_that_caused_it
        claim_type: immediate
        grounds:
          - complexity_profile.consistency_model
          - calculations.showtime_box_office_rollup
          - entities.Showtime.seats_sold
          - entities.Member.comp_tickets_remaining
        distinguishing_aspect: |
          The declared model is immediate, so the response to the write that changed a derived figure must
          already carry the new value - no re-read, no lag, no background recompute. The strongest form of the
          claim is that the response body and an immediately following independent read agree field for field
          across three different entities touched by one order.
        test_recipe:
          setup:
            - "Canonical venue (12 seats, 4 held back, 8 sellable) / distributor / title / CONFIRMED booking / CLEARED clearance / non-encrypted DCP asset."
            - "Showtime SA at 2026-08-14T12:00:00Z has base_price_cents 1450, open sales, seats_sold 0 and seats_available 8."
            - "Member Ada Wells is ACTIVE at SUPPORTER with discount_pct 0.15, comp_tickets_granted 2 and comp_tickets_remaining 2."
            - "The order is for 3 seats of which 1 is a comp, priced at unit 1233, line 2466, facility fee 450 and total 2916."
