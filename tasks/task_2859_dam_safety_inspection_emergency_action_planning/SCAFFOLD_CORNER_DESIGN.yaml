        claim_type: violation_to_error
        grounds:
          - errors[ERR_DEFICIENCY_INVALID_STATE]
          - errors[ERR_ORDER_INVALID_STATE]
          - errors[ERR_EAP_INVALID_STATE]
          - errors[ERR_PERMIT_INVALID_STATE]
          - errors[ERR_DRAWDOWN_INVALID_STATE]
          - errors[ERR_INSPECTION_INVALID_STATE]
          - validations[priority 16]
          - validations[priority 24]
        distinguishing_aspect: |
          Six entity-scoped 409 state codes fired from one fully built program, each on an entity
          whose other preconditions are satisfied; the drawdown case also proves priority 16 beats
          priority 24, since activating a REQUESTED order under a MONITORING event reports
          ERR_DRAWDOWN_INVALID_STATE rather than ERR_EVENT_NOT_IN_EMERGENCY.
