      - name: outage_windows_may_abut_but_not_share_a_minute_on_one_tower
        grounds:
          - validations[priority=15]
          - errors[ERR_OUTAGE_WINDOW_OVERLAP]
          - state_machines.OutageEvent.OPEN_to_CLOSED
          - entities.OutageEvent.fields.duration_minutes
          - entities.OutageEvent.fields.sla_excluded
        distinguishing_aspect: |
          A different resource entity and different interval semantics from
          guard_band_inflated_channel_may_touch_but_not_overlap_neighbour: this one contests the
          Tower's outage CALENDAR using bare half-open [started_at, ended_at) instants with NO buffer
          at all - a second window starting at exactly 2026-08-06T04:00:00Z, the instant the first
          one ends, closes successfully with duration_minutes 60, while a window inside the first
          one is refused with ERR_OUTAGE_WINDOW_OVERLAP and stays OPEN.
        test_recipe:
          setup:
            - "One ACTIVE Tower RB-TWR-001 with one ACCEPTED BackhaulCircuit."
            - "Logical clock advanced to 2026-08-20T00:00:00Z so every outage instant below is in the past."
            - "One CLOSED OutageEvent O1 on that tower: cause WEATHER_WIND, started_at 2026-08-05T00:00:00Z, ended_at 2026-08-06T04:00:00Z, peak_wind_mph 41.0, duration_minutes 1680, sla_excluded false."
          setup_api_calls:
            - call: "POST /towers"
              payload: { site_code: "RB-TWR-001", latitude: 41.2500, longitude: -104.8000, ground_elevation_m: 1200.0, antenna_agl_m: 45.0, lease_landowner_name: "Hartley Ranch LLC", lease_monthly_base_rent_cents: 45000, lease_escalator_pct: 0.0275, lease_start_date: "2023-04-01", lease_term_months: 60 }
              as: NetworkEngineer
              captures: { tower_id: $.data.id }
            - call: "POST /backhaul-circuits"
              payload: { tower_id: "${tower_id}", carrier_name: "Prairie Fiber", circuit_ref: "PF-CIR-8801", committed_mbps: 500, monthly_cost_cents: 120000 }
              as: NetworkEngineer
              captures: { circuit_id: $.data.id }
            - call: "POST /backhaul-circuits/${circuit_id}/state-changes"
              payload: { to_state: "INSTALLED" }
              as: NetworkEngineer
            - call: "POST /backhaul-circuits/${circuit_id}/state-changes"
              payload: { to_state: "ACCEPTED", measured_mbps: 505.0 }
              as: NetworkEngineer
            - call: "POST /towers/${tower_id}/status-changes"
              payload: { to_status: "ACTIVE" }
              as: NetworkEngineer
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-08-20T00:00:00Z" }
              as: NetworkEngineer
            - call: "POST /outage-events"
              payload: { tower_id: "${tower_id}", cause: "WEATHER_WIND", started_at: "2026-08-05T00:00:00Z" }
              as: NetworkEngineer
              captures: { outage_o1_id: $.data.id }
            - call: "POST /outage-events/${outage_o1_id}/closure"
              payload: { ended_at: "2026-08-06T04:00:00Z", peak_wind_mph: 41.0 }
              as: NetworkEngineer
            - call: "POST /outage-events"
              payload: { tower_id: "${tower_id}", cause: "POWER", started_at: "2026-08-06T04:00:00Z" }
              as: NetworkEngineer
              captures: { outage_o2_id: $.data.id }
            - call: "POST /outage-events"
              payload: { tower_id: "${tower_id}", cause: "EQUIPMENT", started_at: "2026-08-05T12:00:00Z" }
              as: NetworkEngineer
              captures: { outage_o3_id: $.data.id }
          trigger:
            - call: "POST /outage-events/${outage_o2_id}/closure"
              payload: { ended_at: "2026-08-06T05:00:00Z" }
              as: NetworkEngineer
            - call: "POST /outage-events/${outage_o3_id}/closure"
              payload: { ended_at: "2026-08-05T13:00:00Z" }
              as: NetworkEngineer
              captures: { window_error: $.data.error_id }
          assert:
            - "OutageEvent.${outage_o1_id}.status == CLOSED and OutageEvent.${outage_o1_id}.duration_minutes == 1680"
            - "OutageEvent.${outage_o1_id}.sla_excluded == false (peak_wind_mph 41.0 < SEVERE_WIND_MPH 58.0)"
            - "the first trigger call returns HTTP 200 with success == true"
            - "OutageEvent.${outage_o2_id}.status == CLOSED"
            - "OutageEvent.${outage_o2_id}.duration_minutes == 60"
            - "OutageEvent.${outage_o2_id}.started_at == \"2026-08-06T04:00:00Z\" == OutageEvent.${outage_o1_id}.ended_at (abutting is legal)"
            - "the second trigger call returns HTTP 409 with error.error_id == ERR_OUTAGE_WINDOW_OVERLAP and success == false"
            - "OutageEvent.${outage_o3_id}.status == OPEN"
            - "OutageEvent.${outage_o3_id}.ended_at == null"
            - "OutageEvent.${outage_o3_id}.duration_minutes == null"

  - rule_id: compensating_invariant
    instances:
      - name: hold_then_release_conserves_sector_sold_plus_held_bandwidth
        grounds:
          - state_machines.CapacityHold.HELD_to_RELEASED
          - entities.Sector.fields.sold_mbps
          - entities.Sector.fields.held_mbps
          - entities.Sector.fields.committed_mbps
          - calculations.sector_capacity_posture
          - endpoints[POST /capacity-holds/{id}/release]
        distinguishing_aspect: |
          The conserved global quantity is BANDWIDTH in Mbps - Sector.sold_mbps +
          Sector.held_mbps - and the forward/compensating pair is POST /capacity-holds followed by
          POST /capacity-holds/{id}/release: the sum reads 0 before the pair, 50 between the two
          calls, and exactly 0 again afterwards, with capacity_posture back to OPEN and
          oversubscription_ratio back to 0.000 (no residue, no double subtraction).
        test_recipe:
          setup:
            - "The ACTIVE tower / ACTIVE sector (capacity_mbps 25, max_oversubscription_ratio 8.0) / STD50 plan baseline."
            - "The sector is untouched: sold_mbps 0, held_mbps 0, committed_mbps 0, oversubscription_ratio 0.000, capacity_posture OPEN, version 2 after activation."
            - "One QUALIFIED ServiceabilityRequest SR1 on the STD50 plan, no hold yet."
            - "Logical clock at its startup default 2026-08-01T00:00:00Z."
          setup_api_calls:
            - call: "POST /towers"
              payload: { site_code: "RB-TWR-001", latitude: 41.2500, longitude: -104.8000, ground_elevation_m: 1200.0, antenna_agl_m: 45.0, lease_landowner_name: "Hartley Ranch LLC", lease_monthly_base_rent_cents: 45000, lease_escalator_pct: 0.0275, lease_start_date: "2023-04-01", lease_term_months: 60 }
              as: NetworkEngineer
              captures: { tower_id: $.data.id }
            - call: "POST /backhaul-circuits"
              payload: { tower_id: "${tower_id}", carrier_name: "Prairie Fiber", circuit_ref: "PF-CIR-8801", committed_mbps: 500, monthly_cost_cents: 120000 }
              as: NetworkEngineer
              captures: { circuit_id: $.data.id }
            - call: "POST /backhaul-circuits/${circuit_id}/state-changes"
              payload: { to_state: "INSTALLED" }
              as: NetworkEngineer
            - call: "POST /backhaul-circuits/${circuit_id}/state-changes"
              payload: { to_state: "ACCEPTED", measured_mbps: 505.0 }
              as: NetworkEngineer
            - call: "POST /towers/${tower_id}/status-changes"
              payload: { to_status: "ACTIVE" }
              as: NetworkEngineer
            - call: "POST /spectrum-licenses"
              payload: { license_ref: "CBRS-PAL-4412", band: "CBRS_3_5GHZ", channel_center_mhz: 3600.0, channel_width_mhz: 100.0, max_eirp_dbm: 47.0, license_area_code: "WY-021", effective_from: "2025-01-01T00:00:00Z", effective_to: "2030-01-01T00:00:00Z" }
              as: NetworkEngineer
              captures: { license_id: $.data.id }
            - call: "POST /sectors"
              payload: { tower_id: "${tower_id}", spectrum_license_id: "${license_id}", azimuth_deg: 90.0, beamwidth_deg: 65.0, channel_center_mhz: 3555.0, channel_width_mhz: 10.0, tx_power_dbm: 25.0, antenna_gain_dbi: 17.0, capacity_mbps: 25, max_oversubscription_ratio: 8.0 }
              as: NetworkEngineer
              captures: { sector_id: $.data.id }
            - call: "POST /sectors/${sector_id}/activation"
              payload: {}
              as: NetworkEngineer
              captures: { sector_v1: $.data.version }
            - call: "POST /service-plans"
              payload: { tier_code: "STD50", downstream_mbps: 50, upstream_mbps: 10, monthly_price_cents: 6999, soft_cap_gb: 600.0, deprioritization_factor: 0.25, sla_uptime_pct: 99.5, sla_credit_method: "SLA_SHORTFALL", equipment_policy: "RENTAL_OR_PURCHASE" }
              as: CapacityPlanner
              captures: { plan_id: $.data.id }
            - call: "POST /serviceability-requests"
              payload: { candidate_tower_id: "${tower_id}", requested_plan_id: "${plan_id}", contact_name: "Dana Reyes", premise_latitude: 41.2600, premise_longitude: -104.7600, premise_ground_elevation_m: 1210.0, roof_height_m: 4.0, declared_tree_line_height_m: 3.0, obstruction_class: "CLEAR", path_distance_km: 5.0 }
              as: SalesAgent
              captures: { sr1_id: $.data.id }
          trigger:
            - call: "POST /capacity-holds"
              payload: { serviceability_request_id: "${sr1_id}", expected_sector_version: "${sector_v1}", hold_days: 14 }
              as: SalesAgent
              captures: { hold1_id: $.data.id }
            - call: "POST /capacity-holds/${hold1_id}/release"
              payload: { note: "Customer withdrew the order before install" }
              as: CapacityPlanner
              captures: { released_posture: $.data.status }
          assert:
            - "between the two trigger calls: Sector.${sector_id}.sold_mbps + Sector.${sector_id}.held_mbps == 50"
            - "between the two trigger calls: Sector.${sector_id}.committed_mbps == 50 and Sector.${sector_id}.oversubscription_ratio == 2.000"
            - "after the compensating call: Sector.${sector_id}.sold_mbps + Sector.${sector_id}.held_mbps == 0 (identical to the pre-trigger value)"
            - "after the compensating call: Sector.${sector_id}.sold_mbps == 0"
            - "after the compensating call: Sector.${sector_id}.held_mbps == 0"
            - "after the compensating call: Sector.${sector_id}.committed_mbps == 0"
            - "after the compensating call: Sector.${sector_id}.oversubscription_ratio == 0.000"
            - "after the compensating call: Sector.${sector_id}.capacity_posture == OPEN"
            - "after the compensating call: Sector.${sector_id}.version == ${sector_v1} + 2 (one bump per trigger call, no extra writes)"
            - "${released_posture} == RELEASED"
            - "CapacityHold.${hold1_id}.release_reason == MANUAL"
            - "CapacityHold.${hold1_id}.held_mbps == 50 (the hold row keeps its reserved amount for audit)"
            - "ServiceabilityRequest.${sr1_id}.status == EXPIRED and ServiceabilityRequest.${sr1_id}.qualified_sector_id == null"

      - name: credit_reversal_conserves_subscriber_balance_and_outage_credited_total
        grounds:
          - state_machines.OutageCredit.APPLIED_to_REVERSED
          - state_machines.OutageCredit.PENDING_to_APPLIED
          - entities.Subscriber.fields.credit_balance_cents
          - entities.OutageEvent.fields.total_credited_cents
          - entities.OutageCredit.fields.credit_cents
          - calculations.outage_credit_amount
          - validations[priority=12]
        distinguishing_aspect: |
          A different conserved quantity from
          hold_then_release_conserves_sector_sold_plus_held_bandwidth: this pair conserves MONEY in
          cents across two entities at once - Subscriber.credit_balance_cents and
          OutageEvent.total_credited_cents both read 0 before application, 2372 while APPLIED, and
          exactly 0 again after the reversal, while OutageCredit.credit_cents stays 2372 because the
