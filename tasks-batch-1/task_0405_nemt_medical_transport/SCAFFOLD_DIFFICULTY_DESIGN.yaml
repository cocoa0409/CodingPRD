            - "TripRequest.${trip_id}.encounter_cost_cents == 7780"

      - name: claim_nonlinear_round_trip_multiplier_and_branch
        grounds:
          - calculations.claimed_cost_forward
          - entities.TripRequest.fields.is_round_trip
          - entities.TripRequest.fields.scheduled_loaded_miles
        distinguishing_aspect: |
          Mode (a) >=3-input non-linear interaction: claimed cost combines
          base_fare_cents, loaded_rate_cents_per_mile, scheduled_loaded_miles AND a
          conditional leg_multiplier branch on is_round_trip (2 vs 1). The multiplier
          multiplies both base and loaded terms: 2000*2 + (150*10)*2 = 7000. Distinct
          mode from the round-order instance.
        test_recipe:
          setup:
            - "Same WHEELCHAIR rate and ELIGIBLE member as above; COMPLETED round-trip trip with scheduled_loaded_miles 10."
            - "Claim submission under test."
          setup_api_calls:
            - call: "POST /_clock/set"
              payload: { now_utc: "2026-03-01T08:00:00Z" }
              as: Coordinator
            - call: "POST /rate-schedules"
              payload: { modality: "WHEELCHAIR", base_fare_cents: 2000, loaded_rate_cents_per_mile: 150, dwell_free_minutes: 10, dwell_cents_per_minute: 50 }
              as: Coordinator
            - call: "POST /members"
              payload: { medicaid_id: "M-CB-1", full_name: "Cleo B", mobility_level: "WHEELCHAIR", home_county: "C1" }
              as: Coordinator
              captures: { mem_id: $.data.id }
            - call: "POST /eligibility-spans"
              payload: { member_id: "${mem_id}", level_of_service: "BARIATRIC", coverage_start: "2026-01-01T00:00:00Z", coverage_end: "2027-01-01T00:00:00Z" }
              as: Coordinator
            - call: "POST /brokers"
              payload: { name: "BrokerCB", covered_counties: ["C1"], max_modality: "STRETCHER", free_deadhead_miles: 5, deadhead_rate_cents_per_mile: 80 }
              as: Coordinator
              captures: { brk_id: $.data.id }
            - call: "POST /_geo/county_distance"
              payload: { county_a: "C2", county_b: "C1", miles: 12 }
              as: Coordinator
            - call: "POST /drivers"
              payload: { broker_id: "${brk_id}", full_name: "Cob D", vehicle_modality: "WHEELCHAIR", base_county: "C2" }
              as: Broker
              captures: { drv_id: $.data.id }
            - call: "POST /trips"
              payload: { member_id: "${mem_id}", modality: "WHEELCHAIR", requested_level_of_service: "ROUTINE", appointment_at: "2026-03-02T09:00:00Z", scheduled_loaded_miles: 10, is_round_trip: true, return_is_will_call: false }
              as: Coordinator
              captures: { trip_id: $.data.id }
            - call: "POST /trips/${trip_id}/schedule"
              payload: {}
              as: Coordinator
              captures: { trip_v_sched: $.data.version }
            - call: "GET /trips/${trip_id}/legs"
              payload: {}
              as: Coordinator
              captures: { ob_leg_id: "$.data[0].id", rt_leg_id: "$.data[1].id" }
            - call: "POST /trips/${trip_id}/assign"
              payload: { expected_trip_version: "${trip_v_sched}", preferred_broker_id: "${brk_id}" }
              as: Broker
            - call: "POST /legs/${ob_leg_id}/depart"
              payload: {}
              as: Driver
              as_user_id: "${drv_id}"
            - call: "POST /legs/${ob_leg_id}/arrive"
              payload: {}
              as: Driver
              as_user_id: "${drv_id}"
            - call: "POST /legs/${ob_leg_id}/pickup"
              payload: {}
              as: Driver
              as_user_id: "${drv_id}"
            - call: "POST /legs/${ob_leg_id}/dropoff"
              payload: { odometer_loaded_miles: 10.0 }
              as: Driver
              as_user_id: "${drv_id}"
            - call: "POST /legs/${rt_leg_id}/depart"
              payload: {}
              as: Driver
              as_user_id: "${drv_id}"
            - call: "POST /legs/${rt_leg_id}/arrive"
              payload: {}
              as: Driver
              as_user_id: "${drv_id}"
            - call: "POST /legs/${rt_leg_id}/pickup"
              payload: {}
              as: Driver
              as_user_id: "${drv_id}"
            - call: "POST /legs/${rt_leg_id}/dropoff"
              payload: { odometer_loaded_miles: 10.0 }
              as: Driver
              as_user_id: "${drv_id}"
          trigger:
            - call: "POST /claims"
              payload: { trip_id: "${trip_id}" }
              as: Broker
              captures: { billed: $.data.billed_cents }
          assert:
            - "Claim.billed_cents == 7000 (= 2000*2 + 150*10*2, round-trip multiplier applied to both terms)"
            - "TripRequest.${trip_id}.claimed_cost_cents == 7000"
