  # =========================================================================
  # Rule 9 — Compensating-action invariants across different conserved quantities
  # =========================================================================
  - rule_id: compensating_invariant
    instances:
      - name: withdraw_refund_conserves_applicant_total_fees_paid
        grounds:
          - calculations.fee_ledger_conservation
          - state_machines.FeeAssessment.PAID_to_REFUNDED
          - state_machines.Application.DRAFT_to_WITHDRAWN
          - entities.Applicant.fields.total_fees_paid_cents
        distinguishing_aspect: |
          Conserved quantity #1 — Applicant.total_fees_paid_cents (a money ledger): paying a 16500 fee then
          withdrawing the application refunds it, and total_fees_paid_cents returns to exactly its pre-payment
          value 0 (forward +16500 then compensating -16500 net to 0).
        test_recipe:
          setup:
            - "Adult NEW BOOK application SUBMITTED, fee 16500 PAID (total_fees_paid_cents == 16500), still pre-verification."
          setup_api_calls:
            - call: "POST /applicants"
              payload: { full_legal_name: "Pat Adult", date_of_birth: "1990-01-01", email: "pat12@x.com" }
              as: Applicant
              captures: { appl_id: "$.data.id" }
            - call: "POST /applications"
              payload: { applicant_id: "${appl_id}", application_type: "NEW", product_type: "BOOK", service_level: "ROUTINE" }
              as: Applicant
              as_user_id: "${appl_id}"
              captures: { app_id: "$.data.id", app_v0: "$.data.version" }
            - call: "POST /applications/${app_id}/photos"
              payload: { width_px: 600, height_px: 600, head_height_fraction: 0.60, background_is_white: true }
              as: Applicant
              as_user_id: "${appl_id}"
            - call: "POST /applications/${app_id}/documents"
              payload: { doc_category: "IDENTITY", doc_kind: "DRIVERS_LICENSE", declared_quality: 100 }
              as: Applicant
              as_user_id: "${appl_id}"
            - call: "POST /applications/${app_id}/documents"
              payload: { doc_category: "CITIZENSHIP", doc_kind: "BIRTH_CERTIFICATE", declared_quality: 100 }
              as: Applicant
              as_user_id: "${appl_id}"
            - call: "POST /applications/${app_id}/submit"
              payload: { expected_application_version: "${app_v0}" }
              as: Applicant
              as_user_id: "${appl_id}"
            - call: "GET /fee-assessments?application_id=${app_id}"
              payload: {}
              as: Applicant
              as_user_id: "${appl_id}"
              captures: { fee_id: "$.data[0].id" }
            - call: "POST /fee-assessments/${fee_id}/pay"
              payload: { amount_tendered_cents: 16500 }
              as: Applicant
              as_user_id: "${appl_id}"
            - call: "GET /applicants/${appl_id}"
              payload: {}
              as: Applicant
              as_user_id: "${appl_id}"
              captures: { paid_before: "$.data.total_fees_paid_cents" }
          trigger:
            - call: "POST /applications/${app_id}/withdraw"
              payload: {}
              as: Applicant
              as_user_id: "${appl_id}"
            - call: "GET /applicants/${appl_id}"
              payload: {}
              as: Applicant
              as_user_id: "${appl_id}"
              captures: { paid_after: "$.data.total_fees_paid_cents" }
          assert:
            - "Applicant.${appl_id}.total_fees_paid_cents before withdraw == 16500"
            - "Applicant.${appl_id}.total_fees_paid_cents after withdraw == 0"
            - "FeeAssessment.${fee_id}.payment_status after withdraw == \"REFUNDED\""

      - name: cancel_urgent_appointment_conserves_fee_total_due
        grounds:
          - state_machines.Appointment.BOOKED_to_CANCELLED
          - entities.Application.fields.urgent_travel
          - entities.FeeAssessment.fields.total_due_cents
          - calculations.fee_assessment
        distinguishing_aspect: |
          Conserved quantity #2 — FeeAssessment.total_due_cents on an UNPAID assessment (a price total, a
          different conserved quantity than the money-paid ledger): booking an urgent counter appointment adds
          6000 (16500 -> 22500), cancelling it reverses exactly 6000 back to 16500, leaving the fee total
          where it began.
        test_recipe:
          setup:
            - "Adult NEW BOOK ROUTINE application SUBMITTED with UNPAID fee 16500; an urgent counter exists; an urgent appointment is BOOKED (fee re-derived to 22500)."
          setup_api_calls:
            - call: "POST /urgent-travel-counters"
              payload: { name: "Counter 1", cleanup_buffer_minutes: 15 }
              as: Adjudicator
              captures: { counter_id: "$.data.id" }
            - call: "POST /applicants"
              payload: { full_legal_name: "Pat Adult", date_of_birth: "1990-01-01", email: "pat13@x.com" }
              as: Applicant
              captures: { appl_id: "$.data.id" }
            - call: "POST /applications"
              payload: { applicant_id: "${appl_id}", application_type: "NEW", product_type: "BOOK", service_level: "ROUTINE" }
              as: Applicant
              as_user_id: "${appl_id}"
              captures: { app_id: "$.data.id", app_v0: "$.data.version" }
            - call: "POST /applications/${app_id}/photos"
              payload: { width_px: 600, height_px: 600, head_height_fraction: 0.60, background_is_white: true }
              as: Applicant
              as_user_id: "${appl_id}"
            - call: "POST /applications/${app_id}/documents"
              payload: { doc_category: "IDENTITY", doc_kind: "DRIVERS_LICENSE", declared_quality: 100 }
              as: Applicant
              as_user_id: "${appl_id}"
            - call: "POST /applications/${app_id}/documents"
              payload: { doc_category: "CITIZENSHIP", doc_kind: "BIRTH_CERTIFICATE", declared_quality: 100 }
              as: Applicant
              as_user_id: "${appl_id}"
            - call: "POST /applications/${app_id}/submit"
              payload: { expected_application_version: "${app_v0}" }
              as: Applicant
              as_user_id: "${appl_id}"
              captures: { app_v1: "$.data.version" }
            - call: "POST /appointments"
              payload: { application_id: "${app_id}", resource_kind: "URGENT_TRAVEL_COUNTER", counter_id: "${counter_id}", start_utc: "2026-06-09T09:00:00Z", end_utc: "2026-06-09T09:30:00Z", expected_application_version: "${app_v1}" }
              as: Applicant
              as_user_id: "${appl_id}"
              captures: { appt_id: "$.data.id" }
            - call: "GET /fee-assessments?application_id=${app_id}"
              payload: {}
              as: Applicant
              as_user_id: "${appl_id}"
              captures: { total_before_cancel: "$.data[0].total_due_cents" }
          trigger:
            - call: "POST /appointments/${appt_id}/cancel"
              payload: {}
              as: Applicant
              as_user_id: "${appl_id}"
            - call: "GET /fee-assessments?application_id=${app_id}"
              payload: {}
              as: Applicant
              as_user_id: "${appl_id}"
              captures: { total_after_cancel: "$.data[0].total_due_cents", urgent_after: "$.data[0].urgent_surcharge_cents" }
          assert:
            - "FeeAssessment.total_due_cents while urgent appointment BOOKED == 22500"
            - "FeeAssessment.total_due_cents after cancel == 16500"
            - "FeeAssessment.urgent_surcharge_cents after cancel == 0"
            - "Application.${app_id}.urgent_travel after cancel == false"
