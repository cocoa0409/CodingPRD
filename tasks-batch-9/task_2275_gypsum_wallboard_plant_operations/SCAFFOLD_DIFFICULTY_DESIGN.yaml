          Entity pair MaintenanceOutage -> ProductionRun. The approval cascade only cancels DRAFT and
          SCHEDULED runs, so a run already RUNNING survives it and blocks the outage from starting with
          ERR_RUN_ACTIVE_ON_LINE even though the clock is inside the outage window; completing the run
