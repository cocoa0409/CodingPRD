  - rule_id: transitive_cascade
    instances:

      - name: amended_return_acceptance_cascade_depth_five
        grounds:
          - state_machines.AmendedReturn.SUBMITTED_to_ACCEPTED
          - state_machines.Discrepancy.CATEGORIZED_to_RESOLVED
          - state_machines.CorrectionCase.FILING_IN_PROGRESS_to_FILING_COMPLETE
          - state_machines.CorrectionCase.OPEN_to_REMEDIATION_PENDING
          - calculations.case_exposure_rollup
          - calculations.employer_open_exposure_rollup
        distinguishing_aspect: |
          One agency-outcome call propagates five levels deep, each level triggered only by the
          level above it: L1 the AmendedReturn reaches ACCEPTED, L2 every CATEGORIZED Discrepancy
          it covers becomes RESOLVED, L3 the case's filing dimension reaches FILING_COMPLETE
          because no unresolved discrepancy remains, L4 the case status joins into
          REMEDIATION_PENDING and auto-creates a ControlRemediation seeded from the dominant root
          cause, and L5 the Employer's open_remediation_count is re-derived from that new child.
          Nothing but the single trigger call touches levels 2 through 5.
        test_recipe:
          setup:
            - "Logical clock at 2026-04-30T00:00:00Z."
            - "Employer Acme (SEMIWEEKLY, authorization_limit_cents 5000000); federal agency FED-941 (800 bps, STATUTORY_DAILY, penalty_multiplier_bps 10000, min_days_between_amendments 30, amendment_window_days 1095, requires_registration false)."
            - "2025 Q1 register lines totalling 5000000 taxable wage and 750000 withheld; the filed return reports 4750000 and 500000; one CLEARED deposit of 500000 against a 750000 obligation due 2025-02-19."
            - "Reconciliation therefore emits exactly three variances of 250000 cents each — TAXABLE_WAGE, WITHHOLDING and DEPOSIT_SHORTFALL, in that emission order — and no JURISDICTION_ASSIGNMENT variance, so the statement dimension is STMT_NOT_REQUIRED."
            - "All three discrepancies are categorised; the first-created one (TAXABLE_WAGE) carries root_cause_code RATE_TABLE_STALE and the deposit one carries DEPOSIT_SCHEDULING_ERROR, so with all three magnitudes equal the dominant-root-cause tie-break falls to the earliest created_at."
            - "An amended return has been prepared by u_prep_alex, signed by u_off_bree and submitted."
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-04-30T00:00:00Z" }
              as: PlatformAdmin
            - call: "POST /employers"
              payload: { legal_name: "Acme Manufacturing", fein: "12-3456789", deposit_schedule: "SEMIWEEKLY", authorization_limit_cents: 5000000 }
              as: PlatformAdmin
              captures: { emp_id: "$.data.id" }
            - call: "POST /tax-agencies"
              payload: { agency_code: "FED-941", level: "FEDERAL", jurisdiction_code: "US", interest_rate_bps_annual: 800, interest_method: "STATUTORY_DAILY", penalty_multiplier_bps: 10000, min_days_between_amendments: 30, amendment_window_days: 1095, requires_registration: false }
              as: PlatformAdmin
              captures: { fed_id: "$.data.id" }
            - call: "POST /employees"
              payload: { employer_id: "${emp_id}", full_name: "Dana Reed", national_id_last4: "4821", mailing_state_code: "NY" }
              as: PayrollAnalyst
              captures: { e1_id: "$.data.id" }
            - call: "POST /employees"
              payload: { employer_id: "${emp_id}", full_name: "Lee Park", national_id_last4: "7130", mailing_state_code: "NY" }
              as: PayrollAnalyst
              captures: { e2_id: "$.data.id" }
            - call: "POST /payroll-register-lines"
              payload: { employer_id: "${emp_id}", employee_id: "${e1_id}", agency_id: "${fed_id}", tax_year: 2025, quarter: 1, taxable_wage_cents: 3000000, withheld_cents: 450000, work_jurisdiction_code: "US" }
