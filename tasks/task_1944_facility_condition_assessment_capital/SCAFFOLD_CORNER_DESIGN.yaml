              captures: { err: "$.data.error_id" }
          assert:
            - "err == ERR_REFERENTIAL_CONFLICT (line item's plan ${plan1} != bundle's plan ${plan2})"
      - name: recompute_endpoint_persists_derived_fields
        claim_type: computed_read
        grounds: ["endpoints.\"POST /fca/facilities/{id}/recompute\"", calculations.facility_condition_index]
        distinguishing_aspect: "POST recompute runs the FCI aggregation and bumps Facility.version by 1 while values stay consistent with the source rows."
        test_recipe:
          setup: ["Facility with one system (CRV 100000000) and one OPEN deficiency 10000000 -> FCI 0.1000"]
          setup_api_calls:
            - call: "POST /fca/clients"
              payload: { name: "E3", contact_email: "e3@e3.example" }
              as: Consultant
              captures: { client_id: "$.data.id" }
