            - call: "POST /pricing-proposals"
              payload: { submission_id: "${sub_id}", bundle_id: "${bnd_roster_id}", base_price_cents: 9000, term_years: 1, annual_escalator_bps: 0, projected_adoption_units: 100, digital_seat_price_cents: 1500, expected_submission_version: "${sub_v}" }
              as: PricingManager
              captures: { err_roster: $.data.error_id }
            - call: "POST /pricing-proposals"
              payload: { submission_id: "${sub_id}", bundle_id: "${bnd_other_id}", base_price_cents: 9000, term_years: 1, annual_escalator_bps: 0, projected_adoption_units: 100, digital_seat_price_cents: 1500, expected_submission_version: "${sub_v}" }
