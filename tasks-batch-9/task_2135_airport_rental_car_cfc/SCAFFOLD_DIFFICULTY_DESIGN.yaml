            - call: "POST /rac/concessionaires"
              payload: { facility_id: "${fac_id}", legal_name: "Budline Auto Rental", brand_code: "BUD", contact_email: "ops@budline.example" }
              as: FacilityAdmin
              captures: { conc_b_id: $.data.id }
            - call: "POST /rac/concessionaires"
