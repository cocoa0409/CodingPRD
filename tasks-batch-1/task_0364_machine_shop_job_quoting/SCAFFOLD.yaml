# =============================================================================
# SCAFFOLD — Machine Shop / Job Shop Quoting & Production
# Difficulty band: Expert (§0.4)
# =============================================================================

scenario: |
  Machine Shop / Job Shop Quoting & Production: RFQ & part/drawing intake, material & cycle-time quote, work order & routing, machine/CNC scheduling, material lot & traceability, inspection/QC, rework/scrap, on-time delivery & invoice。

domain_name: machine-shop-job-quoting
# Flat topology: entities are peers addressed at their own top-level collection
# (/rfqs, /quotes, /work-orders, ...). There is no single shared URL prefix, so
# api_prefix is empty and every collection segment is the entity's own path root.
api_prefix: ""

complexity_profile:
  primary_archetype: workflow_orchestration
  secondary_archetype: pricing_engine
  complexity_layers:
    - optimistic_concurrency
    - cascading_side_effects
    - dual_variant_calculation
    - rate_threshold_triggers
    - derived_field_reconciliation
  entity_topology: graph
  # RFQ→Quote→WorkOrder form a tree spine, but MaterialLot, MachineSlot,
  # Inspection, Shipment, Invoice link across aggregate boundaries by FK,
  # and LotAllocation is a many-to-many junction (WorkOrder ↔ MaterialLot).
  state_machine_shape: branching
  # Quote has approve/reject revert cycle; WorkOrder forks into
  # {REWORK, SCRAP, ACCEPTED} with divergent side-effect sets; Inspection
  # disposition branches; Shipment carries an independent on-time dimension.
  relationship_patterns:
    - one_to_many        # RFQ→PartLine, WorkOrder→RoutingOp, WorkOrder→Inspection
    - many_to_many       # WorkOrder ↔ MaterialLot via LotAllocation junction
    - cross_aggregate    # MachineSlot→RoutingOp, Shipment→WorkOrder, Invoice→Shipment
  role_model: peer_roles
  # Estimator owns Quote, Scheduler owns MachineSlot, MaterialController owns
  # MaterialLot/allocations, Inspector owns Inspection/disposition,
  # ShopAdmin is the operational superset for RFQ/WorkOrder/Shipment/Invoice.
  consistency_model: immediate

# =============================================================================
# 1.0 Response Envelope (FIXED — EMIT VERBATIM)
# =============================================================================
response_envelope:
  success: |
    { "meta": { "api_request_id": "req_xxx", "api_request_timestamp": "ISO8601" },
      "response_type": "object" | "array", "data": {} }
  error: |
    { "meta": { ... }, "response_type": "error",
      "data": { "error_id": "ERR_XXX", "message": "..." } }
  pagination_fields: ["limit", "offset", "total_count", "has_more"]
  pagination_defaults: { limit: 10, min: 1, max: 100, offset: 0 }

# =============================================================================
# 1.1 Entity-Relationship Table
# =============================================================================
entities:
  - name: RFQ
    parent: null
    common_fields: true   # id, created_at, updated_at, version
    fields:
      - { name: customer_name, type: string, source: input, description: "Buying customer's company name" }
      - { name: customer_id, type: string, source: input, description: "Opaque external customer key used for audit; not an entity FK" }
      - { name: requested_due_date, type: datetime, source: input, description: "Customer-requested delivery date (ISO 8601 UTC, date-precision compared)" }
      - { name: incoterm, type: enum, source: input, default: "EXW", description: "EXW | FOB | DDP — affects nothing computed but recorded for traceability", constraints: "one of EXW, FOB, DDP" }
      - { name: status, type: enum, source: system, default: "DRAFT", description: "DRAFT → SUBMITTED → QUOTED → CLOSED / CANCELLED", constraints: "one of DRAFT, SUBMITTED, QUOTED, CLOSED, CANCELLED" }
      - { name: part_line_count, type: integer, source: computed, default: 0, description: "Count of PartLine children; derived field, recomputed on PartLine create/delete" }

  - name: PartLine
    parent: RFQ
    common_fields: true
    fields:
      - { name: rfq_id, type: string, source: system, description: "FK -> RFQ.id; owning RFQ" }
      - { name: part_number, type: string, source: input, description: "Customer or shop part number" }
      - { name: drawing_rev, type: string, source: input, description: "Drawing revision string, e.g. 'C'" }
      - { name: material_spec, type: enum, source: input, description: "AL_6061 | SS_304 | TI_6AL4V | BRASS_360 — material spec the part is cut from", constraints: "one of AL_6061, SS_304, TI_6AL4V, BRASS_360" }
      - { name: quantity, type: integer, source: input, description: "Number of parts requested for this line", constraints: ">= 1" }
      - { name: tolerance_class, type: enum, source: input, default: "STANDARD", description: "STANDARD | PRECISION | CRITICAL — gates which inspection mode is required", constraints: "one of STANDARD, PRECISION, CRITICAL" }

  - name: Quote
    parent: null
    common_fields: true
    fields:
      - { name: rfq_id, type: string, source: input, description: "FK -> RFQ.id; the RFQ being quoted" }
      - { name: part_line_id, type: string, source: input, description: "FK -> PartLine.id; the specific part line this quote prices" }
      - { name: status, type: enum, source: system, default: "DRAFT", description: "DRAFT → PRICED → APPROVED → REJECTED ; REJECTED → DRAFT (revision loop)", constraints: "one of DRAFT, PRICED, APPROVED, REJECTED" }
      - { name: material_unit_cost_cents, type: integer, source: input, description: "Raw material cost per part in cents" }
      - { name: scrap_allowance_pct, type: integer, source: input, default: 0, description: "Percent material overage assumed for scrap in the estimate, 0..100", constraints: "0 <= x <= 100" }
      - { name: margin_pct, type: integer, source: computed, description: "Margin percent selected by tier from extended_cost_cents (35/25/18)" }
      - { name: extended_cost_cents, type: integer, source: computed, default: 0, description: "Estimated total cost (labor + setup + material) in cents; ESTIMATE variant" }
      - { name: quoted_price_cents, type: integer, source: computed, default: 0, description: "Estimated price after margin in cents" }
      - { name: quoted_unit_price_cents, type: integer, source: computed, default: 0, description: "Per-part quoted price = round_half_up(quoted_price_cents / PartLine.quantity)" }
      - { name: rejection_reason, type: string, source: input, default: null, description: "Reason recorded when a Quote is rejected" }

  - name: RoutingOp
    parent: Quote
    common_fields: true
    fields:
      - { name: quote_id, type: string, source: system, description: "FK -> Quote.id; the quote whose routing this op belongs to" }
      - { name: seq, type: integer, source: input, description: "Operation sequence number within the routing (1-based, unique per quote)", constraints: ">= 1" }
      - { name: machine_class, type: enum, source: input, description: "MILL_3AX | MILL_5AX | LATHE — selects the per-minute rate", constraints: "one of MILL_3AX, MILL_5AX, LATHE" }
      - { name: estimated_cycle_min, type: number, source: input, description: "Estimated per-part cycle time in minutes (used by ESTIMATE cost variant)" }
      - { name: actual_cycle_min, type: number, source: input, default: null, description: "Recorded per-part cycle time in minutes (used by ACTUAL cost variant; set on op completion)" }
      - { name: setup_fee_cents, type: integer, source: input, default: 0, description: "Flat setup fee for this op in cents" }
      - { name: status, type: enum, source: system, default: "PLANNED", description: "PLANNED → SCHEDULED → COMPLETED", constraints: "one of PLANNED, SCHEDULED, COMPLETED" }

  - name: WorkOrder
    parent: null
    common_fields: true
    fields:
      - { name: quote_id, type: string, source: input, description: "FK -> Quote.id; the APPROVED quote this WO realizes" }
      - { name: part_line_id, type: string, source: input, description: "FK -> PartLine.id; the part being produced" }
      - { name: qty_ordered, type: integer, source: input, description: "Parts the customer ordered (defaults from PartLine.quantity but may be lower)", constraints: ">= 1" }
      - { name: qty_started, type: integer, source: input, default: 0, description: "Parts released to the floor (>= qty_ordered to cover scrap); set on RELEASE" }
      - { name: qty_in_process, type: integer, source: computed, default: 0, description: "Parts still on the floor, not yet dispositioned" }
      - { name: qty_accepted, type: integer, source: computed, default: 0, description: "Cumulative parts accepted by inspection" }
      - { name: qty_rework_pending, type: integer, source: computed, default: 0, description: "Cumulative parts routed to rework, not yet re-inspected" }
      - { name: qty_scrapped, type: integer, source: computed, default: 0, description: "Cumulative parts scrapped" }
      - { name: qty_shipped, type: integer, source: computed, default: 0, description: "Cumulative parts shipped" }
      - { name: status, type: enum, source: system, default: "PLANNED", description: "PLANNED → RELEASED → IN_PROCESS → {INSPECT} → COMPLETED → SHIPPED / CLOSED ; cancellable from PLANNED/RELEASED", constraints: "one of PLANNED, RELEASED, IN_PROCESS, COMPLETED, SHIPPED, CLOSED, CANCELLED" }
      - { name: material_allocated, type: boolean, source: computed, default: false, description: "True once a successful LotAllocation set covers qty_started" }
      - { name: actual_cost_cents, type: integer, source: computed, default: 0, description: "Realized cost (ACTUAL variant) from actual cycle times and lot draws; recomputed on op completion and allocation" }

  - name: MaterialLot
    parent: null
    common_fields: true
    fields:
      - { name: material_spec, type: enum, source: input, description: "AL_6061 | SS_304 | TI_6AL4V | BRASS_360 — spec this lot stocks", constraints: "one of AL_6061, SS_304, TI_6AL4V, BRASS_360" }
      - { name: heat_number, type: string, source: input, description: "Mill heat/lot traceability number" }
      - { name: qty_received, type: integer, source: input, description: "Units received into stock", constraints: ">= 1" }
      - { name: unit_cost_cents, type: integer, source: input, description: "Acquisition cost per unit in cents" }
      - { name: received_at, type: datetime, source: input, description: "Receipt timestamp (ISO 8601 UTC); FIFO allocation orders by this ASC" }
      - { name: qty_remaining, type: integer, source: computed, description: "Units still available = qty_received - sum(active LotAllocation.qty_allocated)" }
      - { name: status, type: enum, source: computed, default: "AVAILABLE", description: "AVAILABLE | DEPLETED — DEPLETED when qty_remaining == 0", constraints: "one of AVAILABLE, DEPLETED" }

  - name: LotAllocation
    parent: null
    common_fields: true
    fields:
      - { name: work_order_id, type: string, source: input, description: "FK -> WorkOrder.id; consuming work order" }
      - { name: material_lot_id, type: string, source: input, description: "FK -> MaterialLot.id; lot drawn from" }
      - { name: qty_allocated, type: integer, source: system, description: "Units drawn from this lot for the WO (set by the FIFO waterfall)", constraints: ">= 1" }
      - { name: status, type: enum, source: system, default: "ACTIVE", description: "ACTIVE | VOIDED — VOIDED restores qty_remaining to the lot", constraints: "one of ACTIVE, VOIDED" }

  - name: MachineSlot
    parent: null
    common_fields: true
    fields:
      - { name: machine_class, type: enum, source: input, description: "MILL_3AX | MILL_5AX | LATHE — the physical machine class booked", constraints: "one of MILL_3AX, MILL_5AX, LATHE" }
      - { name: machine_code, type: string, source: input, description: "Specific machine identifier within the class, e.g. 'HAAS-VF2-01'" }
      - { name: routing_op_id, type: string, source: input, description: "FK -> RoutingOp.id; the op this slot is reserved for" }
      - { name: start_min, type: integer, source: input, description: "Slot start, integer minutes from shop epoch (half-open interval start)" }
      - { name: end_min, type: integer, source: input, description: "Slot end, integer minutes from shop epoch (half-open interval end, exclusive)", constraints: "end_min > start_min" }
      - { name: status, type: enum, source: system, default: "BOOKED", description: "BOOKED | RELEASED — RELEASED frees the interval", constraints: "one of BOOKED, RELEASED" }

  - name: Inspection
    parent: WorkOrder
    common_fields: true
    fields:
      - { name: work_order_id, type: string, source: system, description: "FK -> WorkOrder.id; inspected work order" }
      - { name: inspection_station_id, type: string, source: input, description: "FK -> InspectionStation.id; station performing the inspection" }
      - { name: mode, type: enum, source: input, description: "FAI | IN_PROCESS | FINAL — first-article, in-process, or final QC", constraints: "one of FAI, IN_PROCESS, FINAL" }
      - { name: window_start_min, type: integer, source: input, description: "Station booking start, integer minutes from shop epoch (closed interval)" }
      - { name: window_end_min, type: integer, source: input, description: "Station booking end, integer minutes from shop epoch (closed interval)", constraints: "window_end_min >= window_start_min" }
      - { name: qty_inspected, type: integer, source: input, default: 0, description: "Parts examined in this inspection; set on disposition" }
      - { name: qty_accepted, type: integer, source: input, default: 0, description: "Parts passed" }
      - { name: qty_rework, type: integer, source: input, default: 0, description: "Parts routed to rework" }
      - { name: qty_scrap, type: integer, source: input, default: 0, description: "Parts scrapped" }
      - { name: status, type: enum, source: system, default: "OPEN", description: "OPEN → DISPOSITIONED", constraints: "one of OPEN, DISPOSITIONED" }
      - { name: first_pass_yield_pct, type: number, source: computed, default: 0, description: "= round_half_up(qty_accepted / qty_inspected * 100, 2) on disposition" }

  - name: InspectionStation
    parent: null
    common_fields: false   # configuration entity: only id + created_at
    fields:
      - { name: name, type: string, source: input, description: "Station name, e.g. 'CMM-1'" }
      - { name: supports_mode, type: enum, source: input, description: "FAI | IN_PROCESS | FINAL | ALL — modes this station can perform", constraints: "one of FAI, IN_PROCESS, FINAL, ALL" }
      - { name: buffer_min, type: integer, source: input, default: 15, description: "Cleanup/calibration buffer in minutes applied on both sides of every booking window" }

  - name: Shipment
    parent: null
    common_fields: true
    fields:
      - { name: work_order_id, type: string, source: input, description: "FK -> WorkOrder.id; the WO being shipped" }
      - { name: qty_shipped, type: integer, source: input, description: "Parts in this shipment", constraints: ">= 1" }
      - { name: promised_date, type: datetime, source: input, description: "Promised delivery date (ISO 8601 UTC, date-precision compared)" }
      - { name: actual_ship_date, type: datetime, source: input, description: "Actual ship date (ISO 8601 UTC, date-precision compared)" }
      - { name: on_time, type: boolean, source: computed, description: "= actual_ship_date <= promised_date (date precision, inclusive)" }
      - { name: days_late, type: integer, source: computed, default: 0, description: "= max(0, floor(actual_ship_date - promised_date in whole days))" }
      - { name: late_penalty_cents, type: integer, source: computed, default: 0, description: "Liquidated damages = min(PENALTY_CAP_CENTS, qty_shipped * UNIT_PENALTY_PER_DAY_CENTS * days_late)" }
      - { name: status, type: enum, source: system, default: "SHIPPED", description: "SHIPPED | VOIDED — VOIDED reverses qty_shipped on the WO", constraints: "one of SHIPPED, VOIDED" }

  - name: Invoice
    parent: null
    common_fields: true
    fields:
      - { name: shipment_id, type: string, source: input, description: "FK -> Shipment.id; the shipment being billed" }
      - { name: work_order_id, type: string, source: system, description: "FK -> WorkOrder.id; copied from the shipment for traceability" }
      - { name: subtotal_cents, type: integer, source: computed, description: "= Quote.quoted_unit_price_cents * Shipment.qty_shipped" }
      - { name: tax_cents, type: integer, source: computed, description: "= round_half_up(subtotal_cents * TAX_PCT/100)" }
      - { name: penalty_credit_cents, type: integer, source: computed, default: 0, description: "= Shipment.late_penalty_cents, credited (subtracted) to the customer" }
      - { name: total_cents, type: integer, source: computed, description: "= subtotal_cents + tax_cents - penalty_credit_cents" }
      - { name: status, type: enum, source: system, default: "ISSUED", description: "ISSUED → PAID / VOIDED", constraints: "one of ISSUED, PAID, VOIDED" }

# =============================================================================
# 1.2 State Machine Table
# =============================================================================
state_machines:
  - entity: RFQ
    initial_state: DRAFT
    terminal_states: [CLOSED, CANCELLED]
    transitions:
      - from: DRAFT
        to: SUBMITTED
        trigger: "POST /rfqs/{rfqId}/submit"
        actor: ShopAdmin
        preconditions:
          - "RFQ has >= 1 PartLine (part_line_count >= 1), else ERR_RFQ_NO_PART_LINES"
        side_effects:
          - "status -> SUBMITTED"
      - from: SUBMITTED
        to: QUOTED
        trigger: "system (automatic when every PartLine of the RFQ has an APPROVED Quote)"
        actor: system
        preconditions:
          - "For each PartLine of this RFQ there exists a Quote in status APPROVED"
        side_effects:
          - "status -> QUOTED (bubble-up from Quote APPROVED transition)"
      - from: QUOTED
        to: CLOSED
        trigger: "POST /rfqs/{rfqId}/close"
        actor: ShopAdmin
        preconditions:
          - "Every WorkOrder derived from this RFQ's quotes is in SHIPPED or CLOSED"
        side_effects:
          - "status -> CLOSED"
      - from: DRAFT
        to: CANCELLED
        trigger: "POST /rfqs/{rfqId}/cancel"
        actor: ShopAdmin
        preconditions: []
        side_effects:
          - "status -> CANCELLED"
      - from: SUBMITTED
        to: CANCELLED
        trigger: "POST /rfqs/{rfqId}/cancel"
        actor: ShopAdmin
        preconditions:
          - "No Quote of this RFQ is APPROVED (ERR_RFQ_HAS_APPROVED_QUOTE)"
        side_effects:
          - "status -> CANCELLED"
          - "All DRAFT/PRICED Quotes of this RFQ -> REJECTED (cascade down), rejection_reason='RFQ cancelled'"

  - entity: Quote
    initial_state: DRAFT
    terminal_states: []
    transitions:
      - from: DRAFT
        to: PRICED
        trigger: "POST /quotes/{quoteId}/price"
        actor: Estimator
        preconditions:
          - "Quote has >= 1 RoutingOp, else ERR_QUOTE_NO_ROUTING"
          - "Owning RFQ.status == SUBMITTED, else ERR_RFQ_NOT_SUBMITTED"
        side_effects:
          - "Run calculation quote_estimate_cost: set extended_cost_cents, margin_pct, quoted_price_cents, quoted_unit_price_cents (ESTIMATE variant)"
          - "status -> PRICED"
      - from: PRICED
        to: APPROVED
        trigger: "POST /quotes/{quoteId}/approve"
        actor: Estimator
        preconditions:
          - "expected_quote_version matches Quote.version (OCC)"
        side_effects:
          - "status -> APPROVED"
          - "increments Quote.version by 1"
          - "Bubble-up: if every PartLine of the RFQ now has an APPROVED Quote and RFQ.status==SUBMITTED, RFQ -> QUOTED"
      - from: PRICED
        to: REJECTED
        trigger: "POST /quotes/{quoteId}/reject"
        actor: Estimator
        preconditions: []
        side_effects:
          - "status -> REJECTED, store rejection_reason"
      - from: REJECTED
        to: DRAFT
        trigger: "POST /quotes/{quoteId}/reopen"
        actor: Estimator
        preconditions:
          - "Owning RFQ.status IN {SUBMITTED} (cross-entity: cannot reopen a quote on a CLOSED/CANCELLED RFQ), else ERR_RFQ_NOT_SUBMITTED"
        side_effects:
          - "status -> DRAFT (revision loop), clear margin_pct/extended_cost_cents/quoted_price_cents/quoted_unit_price_cents to 0, clear rejection_reason"

  - entity: WorkOrder
    initial_state: PLANNED
    terminal_states: [CLOSED, CANCELLED]
    transitions:
      - from: PLANNED
        to: RELEASED
        trigger: "POST /work-orders/{woId}/release"
        actor: ShopAdmin
        preconditions:
          - "Quote.status == APPROVED (cross-entity: WorkOrder→Quote), else ERR_QUOTE_NOT_APPROVED"
          - "material_allocated == true (a successful LotAllocation set covers qty_started), else ERR_MATERIAL_NOT_ALLOCATED"
          - "qty_started >= qty_ordered, else ERR_INVALID_QTY_STARTED"
          - "expected_work_order_version matches WorkOrder.version (OCC)"
        side_effects:
          - "status -> RELEASED"
          - "qty_in_process = qty_started"
          - "increments WorkOrder.version by 1"
      - from: RELEASED
        to: IN_PROCESS
        trigger: "system (automatic when the first RoutingOp of the WO's quote reaches SCHEDULED)"
        actor: system
        preconditions: []
        side_effects:
          - "status -> IN_PROCESS"
      - from: IN_PROCESS
        to: COMPLETED
        trigger: "system (automatic when qty_in_process == 0 and qty_rework_pending == 0)"
        actor: system
        preconditions:
          - "qty_in_process == 0 and qty_rework_pending == 0 (all parts dispositioned to accepted/scrap)"
        side_effects:
          - "status -> COMPLETED"
      - from: COMPLETED
        to: SHIPPED
        trigger: "system (automatic when sum of SHIPPED shipments' qty_shipped == qty_accepted and qty_accepted > 0)"
        actor: system
        preconditions:
          - "qty_shipped == qty_accepted and qty_accepted > 0"
        side_effects:
          - "status -> SHIPPED"
      - from: SHIPPED
        to: CLOSED
        trigger: "POST /work-orders/{woId}/close"
        actor: ShopAdmin
        preconditions:
          - "Every Invoice for this WO's shipments is in PAID, else ERR_INVOICE_UNPAID"
        side_effects:
          - "status -> CLOSED"
      - from: PLANNED
        to: CANCELLED
        trigger: "POST /work-orders/{woId}/cancel"
        actor: ShopAdmin
        preconditions: []
        side_effects:
          - "status -> CANCELLED"
      - from: RELEASED
        to: CANCELLED
        trigger: "POST /work-orders/{woId}/cancel"
        actor: ShopAdmin
        preconditions:
          - "No Inspection of this WO is DISPOSITIONED (ERR_WO_ALREADY_INSPECTED)"
        side_effects:
          - "status -> CANCELLED"
          - "Compensation cascade: all ACTIVE LotAllocations of this WO -> VOIDED; each restores qty_remaining on its lot; depleted lots flip back to AVAILABLE"
          - "All BOOKED MachineSlots on this WO's RoutingOps -> RELEASED; those RoutingOps revert SCHEDULED -> PLANNED"
          - "qty_in_process = 0, material_allocated = false"

  - entity: RoutingOp
    initial_state: PLANNED
    terminal_states: [COMPLETED]
    transitions:
      - from: PLANNED
        to: SCHEDULED
        trigger: "system (automatic when a BOOKED MachineSlot is created referencing this RoutingOp)"
        actor: system
        preconditions:
          - "Owning Quote.status == APPROVED"
          - "The WorkOrder for this quote is in RELEASED or IN_PROCESS"
        side_effects:
          - "status -> SCHEDULED"
          - "Bubble-up: if this is the first op of the WO's quote to reach SCHEDULED, WorkOrder RELEASED -> IN_PROCESS"
      - from: SCHEDULED
        to: COMPLETED
        trigger: "POST /routing-ops/{opId}/complete"
        actor: ShopAdmin
        preconditions:
          - "actual_cycle_min provided in request, else ERR_MISSING_ACTUAL_CYCLE"
        side_effects:
          - "status -> COMPLETED, store actual_cycle_min"
          - "Recompute WorkOrder.actual_cost_cents (ACTUAL variant) over COMPLETED ops + ACTIVE lot draws"
      - from: SCHEDULED
        to: PLANNED
        trigger: "system (automatic when the booking MachineSlot is RELEASED or the WorkOrder is cancelled)"
        actor: system
        preconditions: []
        side_effects:
          - "status -> PLANNED (revert)"

  - entity: Inspection
    initial_state: OPEN
    terminal_states: [DISPOSITIONED]
    transitions:
      - from: OPEN
        to: DISPOSITIONED
        trigger: "POST /inspections/{inspectionId}/disposition"
        actor: Inspector
        preconditions:
          - "WorkOrder.status == IN_PROCESS (cross-entity: Inspection→WorkOrder), else ERR_WO_NOT_IN_PROCESS"
          - "qty_inspected == qty_accepted + qty_rework + qty_scrap, else ERR_DISPOSITION_QTY_MISMATCH"
          - "qty_inspected <= WorkOrder.qty_in_process, else ERR_DISPOSITION_EXCEEDS_WIP"
          - "If PartLine.tolerance_class == CRITICAL then mode must be FAI or FINAL, else ERR_INSPECTION_MODE_REQUIRED"
        side_effects:
          - "status -> DISPOSITIONED"
          - "Compute first_pass_yield_pct (yield calc)"
          - "WorkOrder cascade: qty_in_process -= qty_inspected; qty_accepted += qty_accepted; qty_rework_pending += qty_rework; qty_scrapped += qty_scrap"
          - "Rework branch: qty_rework parts return to the floor at next op — handled by re-inspection (qty_rework_pending later consumed by a follow-up disposition that moves them to accepted/scrap)"
          - "Bubble-up: if WorkOrder.qty_in_process == 0 and qty_rework_pending == 0, WorkOrder IN_PROCESS -> COMPLETED"

  - entity: Shipment
    initial_state: SHIPPED
    terminal_states: [VOIDED]
    transitions:
      - from: SHIPPED
        to: VOIDED
        trigger: "POST /shipments/{shipmentId}/void"
        actor: ShopAdmin
        preconditions:
          - "No ISSUED/PAID Invoice references this shipment (ERR_SHIPMENT_HAS_INVOICE)"
        side_effects:
          - "status -> VOIDED"
          - "Compensation: WorkOrder.qty_shipped -= qty_shipped; if WorkOrder was SHIPPED it reverts to COMPLETED"

  - entity: Invoice
    initial_state: ISSUED
    terminal_states: [PAID, VOIDED]
    transitions:
      - from: ISSUED
        to: PAID
        trigger: "POST /invoices/{invoiceId}/pay"
        actor: ShopAdmin
        preconditions: []
        side_effects:
          - "status -> PAID"
      - from: ISSUED
        to: VOIDED
        trigger: "POST /invoices/{invoiceId}/void"
        actor: ShopAdmin
        preconditions: []
        side_effects:
          - "status -> VOIDED"

  - entity: MachineSlot
    initial_state: BOOKED
    terminal_states: [RELEASED]
    transitions:
      - from: BOOKED
        to: RELEASED
        trigger: "POST /machine-slots/{slotId}/release"
        actor: Scheduler
        preconditions: []
        side_effects:
          - "status -> RELEASED (interval freed)"
          - "Cross-entity: the referenced RoutingOp reverts SCHEDULED -> PLANNED"
      - from: BOOKED
        to: RELEASED
        trigger: "system (automatic during WorkOrder RELEASED->CANCELLED compensation)"
        actor: system
        preconditions: []
        side_effects:
          - "status -> RELEASED"
        note: "Slots booked on a cancelled WO's routing ops are auto-released by the cancel cascade."

# -----------------------------------------------------------------------------
# 1.2.1 Concurrency Rules (OCC on parent version — see §1.2.1 filter)
# -----------------------------------------------------------------------------
concurrency_rules:
  - rule_id: wo-release-stale
    parent_entity: WorkOrder
    write_endpoint: "POST /work-orders/{woId}/release"
    occ_field: "expected_work_order_version"
    description: |
      Releasing a WorkOrder whose version has advanced since the client last
      observed it is rejected. Material allocation, slot booking, and op
      completion all bump the WorkOrder's version between its creation and the
      release call; a client holding a stale version is operating on an
      outdated view and the release is refused with a stale-version error.
    error_id: ERR_STALE_VERSION
    http_status: 412
  - rule_id: quote-approve-stale
    parent_entity: Quote
    write_endpoint: "POST /quotes/{quoteId}/approve"
    occ_field: "expected_quote_version"
    description: |
      Approving a Quote whose version has advanced since the client last read
      it is rejected. Pricing (DRAFT->PRICED) and reopen cycles bump the
      Quote's version; an approve carrying a stale expected_quote_version is
      refused with a stale-version error so a client cannot approve a price it
      never saw.
    error_id: ERR_STALE_VERSION
    http_status: 412

# =============================================================================
# 1.3 Calculation Rules Table
# =============================================================================
calculations:
  - name: quote_estimate_cost
    trigger: "Quote DRAFT->PRICED transition (POST /quotes/{quoteId}/price)"
    algorithm: tiered_pricing
    formula: |
      # ESTIMATE variant — uses RoutingOp.estimated_cycle_min and the quote's
      # scrap_allowance_pct. PartLine.quantity = Q.
      # Per-op labor (round per line, THEN multiply by qty, THEN add setup):
      #   op_labor_cents = round_half_up(estimated_cycle_min * RATE[machine_class]) * Q + setup_fee_cents
      # labor_total_cents = sum over ops of op_labor_cents
      # Material line (round the per-part marked-up unit cost, THEN multiply):
      #   mat_per_part = round_half_up(material_unit_cost_cents * (1 + scrap_allowance_pct/100))
      #   material_total_cents = mat_per_part * Q
      # extended_cost_cents = labor_total_cents + material_total_cents
      # margin_pct (TIER on extended_cost_cents):
      #   extended_cost_cents <  50000             -> 35
      #   50000 <= extended_cost_cents < 200000    -> 25
      #   extended_cost_cents >= 200000            -> 18
      # quoted_price_cents = round_half_up(extended_cost_cents * (1 + margin_pct/100))
      # quoted_unit_price_cents = round_half_up(quoted_price_cents / Q)
    input_set: "All RoutingOp rows of the quote (any status — at PRICED time all are PLANNED); ESTIMATE never reads actual_cycle_min."
    constants:
      RATE_MILL_3AX: 180   # cents per minute
      RATE_MILL_5AX: 320
      RATE_LATHE: 150
      MARGIN_TIER_LOW_MAX: 50000     # exclusive upper bound for 35% tier
      MARGIN_TIER_MID_MAX: 200000    # exclusive upper bound for 25% tier
      MARGIN_PCT_LOW: 35
      MARGIN_PCT_MID: 25
      MARGIN_PCT_HIGH: 18
    precision: "integer cents; round_half_up at each pinned step (per-op labor, per-part material, quoted_price, quoted_unit_price)"
    variants:
      - name: ESTIMATE
        when: "Quote pricing (DRAFT->PRICED)"
        difference: "Uses estimated_cycle_min and scrap_allowance_pct over PartLine.quantity; applies the margin tier and writes quoted_price_cents."

  - name: work_order_actual_cost
    trigger: "RoutingOp SCHEDULED->COMPLETED (POST /routing-ops/{opId}/complete) AND material allocation/void on the WO"
    algorithm: aggregation
    formula: |
      # ACTUAL variant on WorkOrder — realized cost, NO margin re-applied.
      # Q_started = WorkOrder.qty_started.
      # Per COMPLETED op (rounding order identical to estimate but qty = Q_started):
      #   op_actual_cents = round_half_up(actual_cycle_min * RATE[machine_class]) * Q_started + setup_fee_cents
      # labor_actual_cents = sum over COMPLETED ops of op_actual_cents   (PLANNED/SCHEDULED ops contribute 0)
      # material_actual_cents = sum over ACTIVE LotAllocations of (qty_allocated * MaterialLot.unit_cost_cents)
      # actual_cost_cents = labor_actual_cents + material_actual_cents
    input_set: "RoutingOps with status==COMPLETED (others excluded); LotAllocations with status==ACTIVE (VOIDED excluded)."
    constants:
      RATE_MILL_3AX: 180
      RATE_MILL_5AX: 320
      RATE_LATHE: 150
    precision: "integer cents; round_half_up per-op then sum (same order as estimate); material uses true lot unit_cost_cents, no markup"
    variants:
      - name: ACTUAL
        when: "Op completion and allocation events on a released WorkOrder"
        difference: "Uses actual_cycle_min over qty_started, true lot unit costs with NO scrap markup and NO margin; diverges from quote_estimate_cost which uses estimated_cycle_min over PartLine.quantity, marks material up by scrap_allowance_pct, and applies a margin tier."

  - name: lot_waterfall_allocation
    trigger: "POST /work-orders/{woId}/allocate-material"
    algorithm: waterfall_allocation
    formula: |
      # Allocate WorkOrder.qty_started units of PartLine.material_spec across
      # AVAILABLE MaterialLots of the same spec, ordered received_at ASC,
      # tie-break created_at ASC (NEVER id). Draw from each lot's qty_remaining
      # until the requirement is met.
      #   need = WorkOrder.qty_started
      #   for lot in sorted(AVAILABLE lots of spec, key=(received_at ASC, created_at ASC)):
      #       take = min(need, lot.qty_remaining)
      #       if take > 0: create LotAllocation(qty_allocated=take); lot.qty_remaining -= take
      #                    if lot.qty_remaining == 0: lot.status = DEPLETED
      #       need -= take
      #       if need == 0: break
      #   if need > 0: ROLL BACK all draws this call and reject ERR_INSUFFICIENT_MATERIAL
      # On full success: WorkOrder.material_allocated = true.
    input_set: "MaterialLots with status==AVAILABLE and material_spec == PartLine.material_spec; DEPLETED lots excluded."
    constants: {}
    precision: "integer units; no rounding (counts)"

  - name: shipment_on_time_and_penalty
    trigger: "POST /shipments (Shipment creation)"
    algorithm: threshold
    formula: |
      # Date-precision comparison (truncate both timestamps to UTC calendar date).
      # on_time = (date(actual_ship_date) <= date(promised_date))
      # days_late = max(0, (date(actual_ship_date) - date(promised_date)) in whole days)
      # late_penalty_cents = min(PENALTY_CAP_CENTS,
      #                          qty_shipped * UNIT_PENALTY_PER_DAY_CENTS * days_late)
      # on_time == true  =>  days_late == 0  =>  late_penalty_cents == 0
    input_set: "The single Shipment being created; promised_date and actual_ship_date from the request."
    constants:
      UNIT_PENALTY_PER_DAY_CENTS: 50
      PENALTY_CAP_CENTS: 20000
    precision: "integer cents; days computed as whole-day difference of UTC dates"

  - name: invoice_total
    trigger: "POST /invoices (Invoice creation)"
    algorithm: aggregation
    formula: |
      # subtotal_cents = Quote.quoted_unit_price_cents * Shipment.qty_shipped
      #   (Quote resolved via Shipment.work_order_id -> WorkOrder.quote_id)
      # tax_cents = round_half_up(subtotal_cents * TAX_PCT / 100)
      # penalty_credit_cents = Shipment.late_penalty_cents
      # total_cents = subtotal_cents + tax_cents - penalty_credit_cents
    input_set: "The Shipment named in the request, its WorkOrder, and that WO's Quote.quoted_unit_price_cents."
    constants:
      TAX_PCT: 8.25
    precision: "integer cents; round_half_up on tax only; subtotal and total are exact integer arithmetic"

  - name: first_pass_yield
    trigger: "Inspection OPEN->DISPOSITIONED (POST /inspections/{inspectionId}/disposition)"
    algorithm: aggregation
    formula: |
      # first_pass_yield_pct = round_half_up(qty_accepted / qty_inspected * 100, 2)
      # if qty_inspected == 0: first_pass_yield_pct = 0   (empty-set / zero-divisor edge)
    input_set: "The single Inspection being dispositioned."
    constants: {}
    precision: "2 decimal places, round_half_up; zero qty_inspected yields 0"

# =============================================================================
# 1.4 Validation Rules Table (ordered by priority)
# =============================================================================
validations:
  - priority: 1
    category: auth
    check: "X-User-Role and X-User-ID headers present"
    error_id: ERR_UNAUTHENTICATED
    http_status: 401
    applies_to: "all except pure GET reads that allow any authenticated role"
  - priority: 2
    category: auth
    check: "Acting role permitted for this operation per §1.7 RBAC"
    error_id: ERR_UNAUTHORIZED
    http_status: 403
    applies_to: "all"
  - priority: 3
    category: existence
    check: "Every path/body referenced resource exists, validated left-to-right in path then body FKs"
    error_id: ERR_NOT_FOUND
    http_status: 404
    applies_to: "all"
  - priority: 4
    category: business_constraint
    check: "Request body well-formed: required fields present, enums valid, numeric ranges (quantity>=1, end_min>start_min, scrap_allowance 0..100)"
    error_id: ERR_INVALID_REQUEST
    http_status: 422
    applies_to: "all writes"
  - priority: 5
    category: state
    check: "Target resource in a state from which this transition is defined (§1.2)"
    error_id: ERR_INVALID_STATE
    http_status: 409
    applies_to: "all state-changing endpoints"
  - priority: 6
    category: state
    check: "OCC: expected_<parent>_version matches current parent.version on guarded writes"
    error_id: ERR_STALE_VERSION
    http_status: 412
    applies_to: "POST /work-orders/{woId}/release, POST /quotes/{quoteId}/approve"
  - priority: 7
    category: business_referential
    check: "Cross-entity precondition: WorkOrder.release requires Quote.status==APPROVED; Inspection.disposition requires WorkOrder.status==IN_PROCESS; Quote.reopen requires RFQ.status==SUBMITTED"
    error_id: "ERR_QUOTE_NOT_APPROVED / ERR_WO_NOT_IN_PROCESS / ERR_RFQ_NOT_SUBMITTED"
    http_status: 409
    applies_to: "POST /work-orders/{woId}/release, POST /inspections/{inspectionId}/disposition, POST /quotes/{quoteId}/reopen"
  - priority: 8
    category: business_safety
    check: "QC gate: a CRITICAL-tolerance PartLine may only be dispositioned via mode FAI or FINAL (no IN_PROCESS sign-off)"
    error_id: ERR_INSPECTION_MODE_REQUIRED
    http_status: 409
    applies_to: "POST /inspections/{inspectionId}/disposition"
  - priority: 9
    category: business_temporal
    check: "MachineSlot half-open interval [start_min,end_min) must not overlap any BOOKED slot on the same machine_code"
    error_id: ERR_SLOT_CONFLICT
    http_status: 409
    applies_to: "POST /machine-slots"
  - priority: 10
    category: business_temporal
    check: "Inspection window [window_start_min,window_end_min] expanded by station buffer_min on both sides must not overlap any OPEN/DISPOSITIONED inspection window on the same station; station must support the requested mode"
    error_id: "ERR_STATION_CONFLICT / ERR_STATION_MODE_UNSUPPORTED"
    http_status: 409
    applies_to: "POST /inspections"
  - priority: 11
    category: business_constraint
    check: "Disposition arithmetic: qty_inspected == qty_accepted+qty_rework+qty_scrap and qty_inspected <= WorkOrder.qty_in_process"
    error_id: "ERR_DISPOSITION_QTY_MISMATCH / ERR_DISPOSITION_EXCEEDS_WIP"
    http_status: 409
    applies_to: "POST /inspections/{inspectionId}/disposition"
  - priority: 12
    category: business_fiscal
    check: "Material sufficiency: AVAILABLE lots of the spec must cover WorkOrder.qty_started"
    error_id: ERR_INSUFFICIENT_MATERIAL
    http_status: 409
    applies_to: "POST /work-orders/{woId}/allocate-material"

# =============================================================================
# 1.5 API Endpoint Table
# =============================================================================
endpoints:
  # ---------------- RFQ ----------------
  - method: POST
    path: "/rfqs"
    description: "Create an RFQ in DRAFT"
    roles: [ShopAdmin]
    code: 201
    input: ["customer_name", "customer_id", "requested_due_date", "incoterm?"]
    output: RFQ
    side_effects: ["status=DRAFT, part_line_count=0"]
  - method: GET
    path: "/rfqs/{rfqId}"
    description: "Get an RFQ"
    roles: [ShopAdmin, Estimator, Scheduler, MaterialController, Inspector]
    code: 200
    input: []
    output: RFQ
    side_effects: []
  - method: GET
    path: "/rfqs"
    description: "List RFQs (paginated, optional status filter)"
    roles: [ShopAdmin, Estimator, Scheduler, MaterialController, Inspector]
    code: 200
    input: ["status?", "limit?", "offset?"]
    output: RFQ[]
    side_effects: []
  - method: POST
    path: "/rfqs/{rfqId}/submit"
    description: "Submit an RFQ for quoting"
    roles: [ShopAdmin]
    code: 200
    input: []
    output: RFQ
    side_effects: ["status DRAFT->SUBMITTED"]
  - method: POST
    path: "/rfqs/{rfqId}/close"
    description: "Close a fully-shipped RFQ"
    roles: [ShopAdmin]
    code: 200
    input: []
    output: RFQ
    side_effects: ["status QUOTED->CLOSED"]
  - method: POST
    path: "/rfqs/{rfqId}/cancel"
    description: "Cancel an RFQ"
    roles: [ShopAdmin]
    code: 200
    input: []
    output: RFQ
    side_effects: ["status ->CANCELLED; from SUBMITTED cascades DRAFT/PRICED quotes -> REJECTED"]

  # ---------------- PartLine ----------------
  - method: POST
    path: "/rfqs/{rfqId}/part-lines"
    description: "Add a PartLine to a DRAFT RFQ"
    roles: [ShopAdmin]
    code: 201
    input: ["part_number", "drawing_rev", "material_spec", "quantity", "tolerance_class?"]
    output: PartLine
    side_effects: ["RFQ.part_line_count += 1 (derived-field recompute)"]
  - method: GET
    path: "/rfqs/{rfqId}/part-lines"
    description: "List PartLines of an RFQ (sub-resource view)"
    roles: [ShopAdmin, Estimator, Scheduler, MaterialController, Inspector]
    code: 200
    input: []
    output: PartLine[]
    side_effects: []
  - method: GET
    path: "/part-lines"
    description: "List PartLines (filterable by rfq_id — FK reverse-reachability for PartLine.rfq_id)"
    roles: [ShopAdmin, Estimator, Scheduler, MaterialController, Inspector]
    code: 200
    input: ["rfq_id?", "limit?", "offset?"]
    output: PartLine[]
    side_effects: []
  - method: GET
    path: "/part-lines/{partLineId}"
    description: "Get a PartLine"
    roles: [ShopAdmin, Estimator, Scheduler, MaterialController, Inspector]
    code: 200
    input: []
    output: PartLine
    side_effects: []

  # ---------------- Quote ----------------
  - method: POST
    path: "/quotes"
    description: "Create a DRAFT Quote for a PartLine"
    roles: [Estimator]
    code: 201
    input: ["rfq_id", "part_line_id", "material_unit_cost_cents", "scrap_allowance_pct?"]
    output: Quote
    side_effects: ["status=DRAFT"]
  - method: GET
    path: "/quotes/{quoteId}"
    description: "Get a Quote"
    roles: [ShopAdmin, Estimator, Scheduler, MaterialController, Inspector]
    code: 200
    input: []
    output: Quote
    side_effects: []
  - method: GET
    path: "/quotes"
    description: "List Quotes (filterable by rfq_id and/or part_line_id — FK reverse-reachability for Quote.rfq_id and Quote.part_line_id)"
    roles: [ShopAdmin, Estimator, Scheduler, MaterialController, Inspector]
    code: 200
    input: ["rfq_id?", "part_line_id?", "status?", "limit?", "offset?"]
    output: Quote[]
    side_effects: []
  - method: POST
    path: "/quotes/{quoteId}/routing-ops"
    description: "Add a RoutingOp to a DRAFT Quote"
    roles: [Estimator]
    code: 201
    input: ["seq", "machine_class", "estimated_cycle_min", "setup_fee_cents?"]
    output: RoutingOp
    side_effects: ["status=PLANNED"]
  - method: GET
    path: "/quotes/{quoteId}/routing-ops"
    description: "List RoutingOps of a Quote (FK reverse-reachability for RoutingOp.quote_id)"
    roles: [ShopAdmin, Estimator, Scheduler, MaterialController, Inspector]
    code: 200
    input: []
    output: RoutingOp[]
    side_effects: []
  - method: POST
    path: "/quotes/{quoteId}/price"
    description: "Price a Quote (run ESTIMATE calculation)"
    roles: [Estimator]
    code: 200
    input: []
    output: Quote
    side_effects: ["run quote_estimate_cost; status DRAFT->PRICED"]
  - method: POST
    path: "/quotes/{quoteId}/approve"
    description: "Approve a PRICED Quote (OCC-guarded)"
    roles: [Estimator]
    code: 200
    input: [expected_quote_version]
    output: Quote
    side_effects: ["status PRICED->APPROVED; increments Quote.version by 1; bubble-up RFQ SUBMITTED->QUOTED when all part lines approved"]
  - method: POST
    path: "/quotes/{quoteId}/reject"
    description: "Reject a PRICED Quote"
    roles: [Estimator]
    code: 200
    input: ["rejection_reason?"]
    output: Quote
    side_effects: ["status PRICED->REJECTED, store rejection_reason"]
  - method: POST
    path: "/quotes/{quoteId}/reopen"
    description: "Reopen a REJECTED Quote back to DRAFT (revision loop)"
    roles: [Estimator]
    code: 200
    input: []
    output: Quote
    side_effects: ["status REJECTED->DRAFT; clear computed price fields and rejection_reason"]

  # ---------------- RoutingOp ----------------
  - method: GET
    path: "/routing-ops/{opId}"
    description: "Get a RoutingOp"
    roles: [ShopAdmin, Estimator, Scheduler, MaterialController, Inspector]
    code: 200
    input: []
    output: RoutingOp
    side_effects: []
  - method: GET
    path: "/routing-ops"
    description: "List RoutingOps (filterable by quote_id — FK reverse-reachability for RoutingOp.quote_id)"
    roles: [ShopAdmin, Estimator, Scheduler, MaterialController, Inspector]
    code: 200
    input: ["quote_id?", "status?", "limit?", "offset?"]
    output: RoutingOp[]
    side_effects: []
  - method: POST
    path: "/routing-ops/{opId}/complete"
    description: "Complete a SCHEDULED RoutingOp, recording actual_cycle_min"
    roles: [ShopAdmin]
    code: 200
    input: [actual_cycle_min]
    output: RoutingOp
    side_effects: ["status SCHEDULED->COMPLETED; recompute WorkOrder.actual_cost_cents (ACTUAL variant)"]

  # ---------------- WorkOrder ----------------
  - method: POST
    path: "/work-orders"
    description: "Create a WorkOrder in PLANNED from an APPROVED Quote"
    roles: [ShopAdmin]
    code: 201
    input: [quote_id, part_line_id, qty_ordered, qty_started]
    output: WorkOrder
    side_effects: ["status=PLANNED; material_allocated=false"]
  - method: GET
    path: "/work-orders/{woId}"
    description: "Get a WorkOrder (computed cost + qty fields)"
    roles: [ShopAdmin, Estimator, Scheduler, MaterialController, Inspector]
    code: 200
    input: []
    output: WorkOrder
    side_effects: []
  - method: GET
    path: "/work-orders"
    description: "List WorkOrders (filterable by quote_id and/or part_line_id — FK reverse-reachability)"
    roles: [ShopAdmin, Estimator, Scheduler, MaterialController, Inspector]
    code: 200
    input: ["quote_id?", "part_line_id?", "status?", "limit?", "offset?"]
    output: WorkOrder[]
    side_effects: []
  - method: POST
    path: "/work-orders/{woId}/allocate-material"
    description: "Run FIFO waterfall material allocation for the WO"
    roles: [MaterialController]
    code: 200
    input: []
    output: WorkOrder
    side_effects: ["run lot_waterfall_allocation; create ACTIVE LotAllocations; decrement lot qty_remaining; set material_allocated=true; increments WorkOrder.version by 1"]
  - method: POST
    path: "/work-orders/{woId}/release"
    description: "Release a WorkOrder to the floor (OCC-guarded, cross-entity gated)"
    roles: [ShopAdmin]
    code: 200
    input: [expected_work_order_version]
    output: WorkOrder
    side_effects: ["status PLANNED->RELEASED; qty_in_process=qty_started; increments WorkOrder.version by 1"]
  - method: POST
    path: "/work-orders/{woId}/close"
    description: "Close a fully-shipped, fully-paid WorkOrder"
    roles: [ShopAdmin]
    code: 200
    input: []
    output: WorkOrder
    side_effects: ["status SHIPPED->CLOSED"]
  - method: POST
    path: "/work-orders/{woId}/cancel"
    description: "Cancel a PLANNED/RELEASED WorkOrder (compensation cascade)"
    roles: [ShopAdmin]
    code: 200
    input: []
    output: WorkOrder
    side_effects: ["status->CANCELLED; void ACTIVE LotAllocations and restore lot qty_remaining; release BOOKED MachineSlots and revert RoutingOps to PLANNED; qty_in_process=0; material_allocated=false; increments WorkOrder.version by 1"]
  - method: GET
    path: "/work-orders/{woId}/lot-allocations"
    description: "List LotAllocations for a WO (FK reverse-reachability for LotAllocation.work_order_id)"
    roles: [ShopAdmin, Estimator, Scheduler, MaterialController, Inspector]
    code: 200
    input: []
    output: LotAllocation[]
    side_effects: []
  - method: GET
    path: "/work-orders/{woId}/inspections"
    description: "List Inspections of a WO (FK reverse-reachability for Inspection.work_order_id)"
    roles: [ShopAdmin, Estimator, Scheduler, MaterialController, Inspector]
    code: 200
    input: []
    output: Inspection[]
    side_effects: []

  # ---------------- MaterialLot ----------------
  - method: POST
    path: "/material-lots"
    description: "Receive a MaterialLot into stock"
    roles: [MaterialController]
    code: 201
    input: [material_spec, heat_number, qty_received, unit_cost_cents, received_at]
    output: MaterialLot
    side_effects: ["qty_remaining=qty_received, status=AVAILABLE"]
  - method: GET
    path: "/material-lots/{lotId}"
    description: "Get a MaterialLot"
    roles: [ShopAdmin, Estimator, Scheduler, MaterialController, Inspector]
    code: 200
    input: []
    output: MaterialLot
    side_effects: []
  - method: GET
    path: "/material-lots"
    description: "List MaterialLots (filterable by material_spec/status)"
    roles: [ShopAdmin, Estimator, Scheduler, MaterialController, Inspector]
    code: 200
    input: ["material_spec?", "status?", "limit?", "offset?"]
    output: MaterialLot[]
    side_effects: []
  - method: GET
    path: "/material-lots/{lotId}/lot-allocations"
    description: "List LotAllocations drawn from a lot (FK reverse-reachability for LotAllocation.material_lot_id)"
    roles: [ShopAdmin, Estimator, Scheduler, MaterialController, Inspector]
    code: 200
    input: []
    output: LotAllocation[]
    side_effects: []

  # ---------------- LotAllocation ----------------
  - method: GET
    path: "/lot-allocations/{allocationId}"
    description: "Get a LotAllocation"
    roles: [ShopAdmin, Estimator, Scheduler, MaterialController, Inspector]
    code: 200
    input: []
    output: LotAllocation
    side_effects: []
  - method: GET
    path: "/lot-allocations"
    description: "List LotAllocations (filterable by work_order_id and/or material_lot_id — FK reverse-reachability for both LotAllocation FKs)"
    roles: [ShopAdmin, Estimator, Scheduler, MaterialController, Inspector]
    code: 200
    input: ["work_order_id?", "material_lot_id?", "status?", "limit?", "offset?"]
    output: LotAllocation[]
    side_effects: []

  # ---------------- MachineSlot ----------------
  - method: POST
    path: "/machine-slots"
    description: "Book a CNC machine slot for a RoutingOp (half-open overlap check)"
    roles: [Scheduler]
    code: 201
    input: [machine_class, machine_code, routing_op_id, start_min, end_min]
    output: MachineSlot
    side_effects: ["status=BOOKED; RoutingOp PLANNED->SCHEDULED; bubble-up WorkOrder RELEASED->IN_PROCESS on first scheduled op"]
  - method: GET
    path: "/machine-slots/{slotId}"
    description: "Get a MachineSlot"
    roles: [ShopAdmin, Estimator, Scheduler, MaterialController, Inspector]
    code: 200
    input: []
    output: MachineSlot
    side_effects: []
  - method: GET
    path: "/machine-slots"
    description: "List MachineSlots (filterable by routing_op_id and/or machine_code — FK reverse-reachability for MachineSlot.routing_op_id)"
    roles: [ShopAdmin, Estimator, Scheduler, MaterialController, Inspector]
    code: 200
    input: ["routing_op_id?", "machine_code?", "status?", "limit?", "offset?"]
    output: MachineSlot[]
    side_effects: []
  - method: POST
    path: "/machine-slots/{slotId}/release"
    description: "Release a BOOKED slot (frees interval, reverts RoutingOp)"
    roles: [Scheduler]
    code: 200
    input: []
    output: MachineSlot
    side_effects: ["status BOOKED->RELEASED; RoutingOp SCHEDULED->PLANNED (revert)"]

  # ---------------- InspectionStation ----------------
  - method: POST
    path: "/inspection-stations"
    description: "Create an InspectionStation (configuration, immutable)"
    roles: [ShopAdmin, Inspector]
    code: 201
    input: ["name", "supports_mode", "buffer_min?"]
    output: InspectionStation
    side_effects: []
  - method: GET
    path: "/inspection-stations/{stationId}"
    description: "Get an InspectionStation"
    roles: [ShopAdmin, Estimator, Scheduler, MaterialController, Inspector]
    code: 200
    input: []
    output: InspectionStation
    side_effects: []

  # ---------------- Inspection ----------------
  - method: POST
    path: "/inspections"
    description: "Open an Inspection booking on a station (buffered closed-interval overlap check)"
    roles: [Inspector]
    code: 201
    input: [work_order_id, inspection_station_id, mode, window_start_min, window_end_min]
    output: Inspection
    side_effects: ["status=OPEN"]
  - method: GET
    path: "/inspections/{inspectionId}"
    description: "Get an Inspection"
    roles: [ShopAdmin, Estimator, Scheduler, MaterialController, Inspector]
    code: 200
    input: []
    output: Inspection
    side_effects: []
  - method: GET
    path: "/inspections"
    description: "List Inspections (filterable by work_order_id and/or inspection_station_id — FK reverse-reachability for Inspection.inspection_station_id)"
    roles: [ShopAdmin, Estimator, Scheduler, MaterialController, Inspector]
    code: 200
    input: ["work_order_id?", "inspection_station_id?", "status?", "limit?", "offset?"]
    output: Inspection[]
    side_effects: []
  - method: POST
    path: "/inspections/{inspectionId}/disposition"
    description: "Disposition an OPEN inspection (accept/rework/scrap counts), cascades WO qty fields"
    roles: [Inspector]
    code: 200
    input: [qty_inspected, qty_accepted, qty_rework, qty_scrap]
    output: Inspection
    side_effects: ["status OPEN->DISPOSITIONED; compute first_pass_yield_pct; cascade WorkOrder qty fields; bubble-up WO IN_PROCESS->COMPLETED"]

  # ---------------- Shipment ----------------
  - method: POST
    path: "/shipments"
    description: "Create a Shipment for a COMPLETED/SHIPPED WO (computes on-time + penalty)"
    roles: [ShopAdmin]
    code: 201
    input: [work_order_id, qty_shipped, promised_date, actual_ship_date]
    output: Shipment
    side_effects: ["run shipment_on_time_and_penalty; WorkOrder.qty_shipped += qty_shipped; bubble-up WO COMPLETED->SHIPPED when qty_shipped==qty_accepted"]
  - method: GET
    path: "/shipments/{shipmentId}"
    description: "Get a Shipment"
    roles: [ShopAdmin, Estimator, Scheduler, MaterialController, Inspector]
    code: 200
    input: []
    output: Shipment
    side_effects: []
  - method: GET
    path: "/shipments"
    description: "List Shipments (filterable by work_order_id — FK reverse-reachability for Shipment.work_order_id)"
    roles: [ShopAdmin, Estimator, Scheduler, MaterialController, Inspector]
    code: 200
    input: ["work_order_id?", "status?", "limit?", "offset?"]
    output: Shipment[]
    side_effects: []
  - method: POST
    path: "/shipments/{shipmentId}/void"
    description: "Void a Shipment (compensation: reverse WO.qty_shipped)"
    roles: [ShopAdmin]
    code: 200
    input: []
    output: Shipment
    side_effects: ["status SHIPPED->VOIDED; WorkOrder.qty_shipped -= qty_shipped; WO SHIPPED->COMPLETED if it had shipped"]

  # ---------------- Invoice ----------------
  - method: POST
    path: "/invoices"
    description: "Create an Invoice for a SHIPPED Shipment (computes subtotal/tax/penalty/total)"
    roles: [ShopAdmin]
    code: 201
    input: [shipment_id]
    output: Invoice
    side_effects: ["run invoice_total; status=ISSUED"]
  - method: GET
    path: "/invoices/{invoiceId}"
    description: "Get an Invoice"
    roles: [ShopAdmin, Estimator, Scheduler, MaterialController, Inspector]
    code: 200
    input: []
    output: Invoice
    side_effects: []
  - method: GET
    path: "/invoices"
    description: "List Invoices (filterable by shipment_id and/or work_order_id — FK reverse-reachability)"
    roles: [ShopAdmin, Estimator, Scheduler, MaterialController, Inspector]
    code: 200
    input: ["shipment_id?", "work_order_id?", "status?", "limit?", "offset?"]
    output: Invoice[]
    side_effects: []
  - method: POST
    path: "/invoices/{invoiceId}/pay"
    description: "Mark an Invoice PAID"
    roles: [ShopAdmin]
    code: 200
    input: []
    output: Invoice
    side_effects: ["status ISSUED->PAID"]
  - method: POST
    path: "/invoices/{invoiceId}/void"
    description: "Void an Invoice"
    roles: [ShopAdmin]
    code: 200
    input: []
    output: Invoice
    side_effects: ["status ISSUED->VOIDED"]

# =============================================================================
# 1.6 Error Code Catalog
# =============================================================================
errors:
  - { id: ERR_UNAUTHENTICATED, http: 401, condition: "X-User-Role / X-User-ID header missing or empty" }
  - { id: ERR_UNAUTHORIZED, http: 403, condition: "Acting role not permitted for this operation per RBAC" }
  - { id: ERR_NOT_FOUND, http: 404, condition: "Referenced resource (path or body FK) does not exist" }
  - { id: ERR_INVALID_REQUEST, http: 422, condition: "Malformed body: missing required field, invalid enum, out-of-range number (quantity<1, end_min<=start_min, scrap_allowance outside 0..100)" }
  - { id: ERR_INVALID_STATE, http: 409, condition: "Resource not in a state from which the requested transition is defined" }
  - { id: ERR_STALE_VERSION, http: 412, condition: "expected_<parent>_version does not match current parent version on an OCC-guarded write" }
  - { id: ERR_RFQ_NO_PART_LINES, http: 409, condition: "Submit attempted on an RFQ with zero PartLines" }
  - { id: ERR_RFQ_NOT_SUBMITTED, http: 409, condition: "Pricing or quote reopen attempted while owning RFQ is not SUBMITTED" }
  - { id: ERR_RFQ_HAS_APPROVED_QUOTE, http: 409, condition: "Cancel attempted on a SUBMITTED RFQ that already has an APPROVED Quote" }
  - { id: ERR_QUOTE_NO_ROUTING, http: 409, condition: "Pricing attempted on a Quote with zero RoutingOps" }
  - { id: ERR_QUOTE_NOT_APPROVED, http: 409, condition: "WorkOrder release attempted while its Quote is not APPROVED" }
  - { id: ERR_MATERIAL_NOT_ALLOCATED, http: 409, condition: "WorkOrder release attempted before material_allocated is true" }
  - { id: ERR_INSUFFICIENT_MATERIAL, http: 409, condition: "AVAILABLE lots of the spec cannot cover WorkOrder.qty_started" }
  - { id: ERR_INVALID_QTY_STARTED, http: 409, condition: "WorkOrder release attempted with qty_started < qty_ordered" }
  - { id: ERR_SLOT_CONFLICT, http: 409, condition: "MachineSlot half-open interval overlaps an existing BOOKED slot on the same machine_code" }
  - { id: ERR_STATION_CONFLICT, http: 409, condition: "Inspection buffered window overlaps an existing window on the same station" }
  - { id: ERR_STATION_MODE_UNSUPPORTED, http: 409, condition: "Requested inspection mode not supported by the station's supports_mode" }
  - { id: ERR_WO_NOT_IN_PROCESS, http: 409, condition: "Disposition attempted while WorkOrder is not IN_PROCESS" }
  - { id: ERR_INSPECTION_MODE_REQUIRED, http: 409, condition: "CRITICAL-tolerance part dispositioned with a mode other than FAI/FINAL" }
  - { id: ERR_DISPOSITION_QTY_MISMATCH, http: 409, condition: "qty_inspected != qty_accepted + qty_rework + qty_scrap" }
  - { id: ERR_DISPOSITION_EXCEEDS_WIP, http: 409, condition: "qty_inspected exceeds WorkOrder.qty_in_process" }
  - { id: ERR_MISSING_ACTUAL_CYCLE, http: 409, condition: "RoutingOp complete called without actual_cycle_min" }
  - { id: ERR_WO_ALREADY_INSPECTED, http: 409, condition: "Cancel attempted on a RELEASED WorkOrder that already has a DISPOSITIONED inspection" }
  - { id: ERR_SHIPMENT_HAS_INVOICE, http: 409, condition: "Shipment void attempted while an ISSUED/PAID invoice references it" }
  - { id: ERR_INVOICE_UNPAID, http: 409, condition: "WorkOrder close attempted while an invoice for its shipments is not PAID" }

# =============================================================================
# 1.7 RBAC Matrix
# =============================================================================
roles:
  - name: ShopAdmin
    description: "Operational superset for RFQ lifecycle, WorkOrder lifecycle, shipping and invoicing. Does NOT price/approve quotes, book machine slots, allocate material, or disposition inspections — those are peer-owned."
    identity: "opaque"
    exclusive_operations:
      - "POST /rfqs, /rfqs/{id}/submit|close|cancel"
      - "POST /rfqs/{id}/part-lines"
      - "POST /work-orders, /work-orders/{id}/release|close|cancel"
      - "POST /routing-ops/{id}/complete"
      - "POST /shipments, /shipments/{id}/void"
      - "POST /invoices, /invoices/{id}/pay|void"
    shared_operations:
      - "All GET reads"
      - "POST /inspection-stations (shared with Inspector)"
  - name: Estimator
    description: "Owns quoting: creates quotes, builds routing, prices, approves, rejects, reopens."
    identity: "opaque"
    exclusive_operations:
      - "POST /quotes, /quotes/{id}/routing-ops"
      - "POST /quotes/{id}/price|approve|reject|reopen"
    shared_operations:
      - "All GET reads"
  - name: Scheduler
    description: "Owns CNC scheduling: books and releases machine slots."
    identity: "opaque"
    exclusive_operations:
      - "POST /machine-slots, /machine-slots/{id}/release"
    shared_operations:
      - "All GET reads"
  - name: MaterialController
    description: "Owns material traceability: receives lots and runs allocation."
    identity: "opaque"
    exclusive_operations:
      - "POST /material-lots"
      - "POST /work-orders/{id}/allocate-material"
    shared_operations:
      - "All GET reads"
  - name: Inspector
    description: "Owns QC: opens inspections and dispositions them."
    identity: "opaque"
    exclusive_operations:
      - "POST /inspections, /inspections/{id}/disposition"
    shared_operations:
      - "All GET reads"
      - "POST /inspection-stations (shared with ShopAdmin)"
