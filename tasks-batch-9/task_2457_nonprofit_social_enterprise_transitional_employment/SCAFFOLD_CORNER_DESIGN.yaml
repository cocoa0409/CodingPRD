              as_user_id: "${rp_id}"
            - call: "GET /referral-partners/${rp_id}"
              payload: {}
              as: ProgramDirector
          assert:
            - "duplicate reference: HTTP 409 with data.error_id == \"ERR_DUPLICATE_CANDIDATE_REFERENCE\"; the stored CAND-501 row keeps its original household_income_cents 100000"
            - "new reference: HTTP 201 with data.status == \"SUBMITTED\" and data.eligibility_score == null (scoring happens only at screening)"
            - "the partner read reports referrals_submitted_count == 2 and conversion_rate == 0.0000 (0 enrolled of 2 -- a real zero, distinct from the null of an empty denominator)"

      - name: open_assignment_blocks_period_close_until_released
        claim_type: aggregate_validation
        grounds:
          - validations[priority 32]
          - errors[ERR_OPEN_ASSIGNMENTS_BLOCK_CLOSE]
          - state_machines.SubsidyPeriod.transitions.OPEN_to_CLOSED
        distinguishing_aspect: |
          Priority 32 looks across entities the period does not own: a single ASSIGNED seat on a shift
          whose starts_at falls inside the period interval blocks the close even though the period's
          own ledger is complete. Releasing that seat -- not completing it -- unblocks the close, and
          priority 15 (period ended) has already passed, so 32 is genuinely the deciding rule.
        test_recipe:
          setup:
            - "Launched line, TIER_1 partner, ELIGIBLE referral, participant p1, period 2026-09-01..2026-09-30."
            - "Shift ws1 on 2026-09-07 with one ASSIGNED (never completed) seat for p1."
            - "Logical clock advanced to 2026-10-01, past period_end, so priority 15 no longer fires."
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-09-07T00:00:00Z" }
              as: ProgramDirector
            - call: "POST /business-lines"
              payload: { name: "Cafe & Catering", market_viability_score: 90, training_relevance_score: 80, mission_alignment_score: 75, training_slots_total: 3, supervisor_capacity: 2, target_gross_margin_pct: 0.2000, subsidy_cap_cents: 5000000 }
              as: ProgramDirector
              captures: { bl_id: $.data.id }
            - call: "POST /business-lines/${bl_id}/review"
              payload: { decision: "APPROVED" }
              as: ProgramDirector
            - call: "POST /business-lines/${bl_id}/launch"
              payload: {}
              as: ProgramDirector
              captures: { bl_v: $.data.version }
            - call: "POST /referral-partners"
              payload: { organization_name: "Eastside Works", mou_tier: "TIER_1", referral_quota_per_period: 5 }
              as: ProgramDirector
              captures: { rp_id: $.data.id }
            - call: "POST /referrals"
              payload: { referral_partner_id: "${rp_id}", candidate_reference: "CAND-001", declared_barrier_codes: ["JUSTICE_INVOLVED", "HOUSING_INSTABILITY", "LONG_TERM_UNEMPLOYED"], household_income_cents: 100000, household_size: 2, hours_available_per_week: 40 }
              as: ReferralPartner
              as_user_id: "${rp_id}"
              captures: { ref1_id: $.data.id }
            - call: "POST /referrals/${ref1_id}/screen"
              payload: { decision: "ELIGIBLE", verified_barrier_codes: ["JUSTICE_INVOLVED", "HOUSING_INSTABILITY", "LONG_TERM_UNEMPLOYED"], verified_household_income_cents: 100000, verified_household_size: 2, verified_hours_available_per_week: 40 }
              as: IntakeSpecialist
            - call: "POST /subsidy-periods"
              payload: { business_line_id: "${bl_id}", period_start: "2026-09-01T00:00:00Z", period_end: "2026-09-30T00:00:00Z", supervisor_hours: 40.0 }
              as: ProgramDirector
              captures: { sp_id: $.data.id }
            - call: "POST /participants"
              payload: { referral_id: "${ref1_id}", business_line_id: "${bl_id}", wage_cents_per_hour: 1650, expected_business_line_version: "${bl_v}" }
              as: IntakeSpecialist
              captures: { p1_id: $.data.id }
            - call: "POST /work-shifts"
              payload: { business_line_id: "${bl_id}", starts_at: "2026-09-07T08:00:00Z", ends_at: "2026-09-07T20:00:00Z", trainee_capacity: 2, supervisor_user_id: "sup-1" }
              as: ProgramDirector
              captures: { ws1_id: $.data.id }
            - call: "POST /shift-assignments"
              payload: { work_shift_id: "${ws1_id}", participant_id: "${p1_id}" }
              as: CaseManager
