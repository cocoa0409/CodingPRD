# =============================================================================
# SCAFFOLD — task_3305_third_party_multifamily_management_agreements_owner_reporting
# Third-Party Multifamily Management Agreements & Owner Reporting (Greystar-style)
# §1.0–§1.7. Difficulty design lives in SCAFFOLD_DIFFICULTY_DESIGN.yaml;
# corner design lives in SCAFFOLD_CORNER_DESIGN.yaml.
# =============================================================================

scenario: |
  Third-Party Multifamily Management Agreements & Owner Reporting (Greystar):
  management agreement terms with base fees as a percentage of collected revenue,
  minimum fees and incentive structures, onboarding a property from a prior
  manager with resident data, ledger balances and vendor contract transition,
  budgeting and reforecast cycles with owner approval thresholds for capital
  and operating variances, revenue management pricing recommendations with
  owner override rights, staffing model and payroll charged to the property
  with shared regional overhead allocation, owner reporting packages,
  distribution timing and lender-required reporting, property disposition and
  management termination with fee tails and transition obligations, risk
  allocation for resident incidents and employment claims

domain_name: multifamily-management-agreements
api_prefix: /mgmt

complexity_profile:
  primary_archetype: ledger_reconciliation
  secondary_archetype: compliance_audit
  complexity_layers:
    - optimistic_concurrency
    - cascading_side_effects
    - dual_variant_calculation
    - rate_threshold_triggers
  entity_topology: hybrid
  state_machine_shape: branching
  relationship_patterns:
    - one_to_many
    - cross_aggregate
  role_model: approval_chain
  consistency_model: immediate

# =============================================================================
# §1.0 Response Envelope (FIXED — verbatim)
# =============================================================================
response_envelope:
  success: |
    { "meta": { "api_request_id": "req_xxx", "api_request_timestamp": "ISO8601" },
      "response_type": "object" | "array", "data": {} }
  error: |
    { "meta": { ... }, "response_type": "error",
      "data": { "error_id": "ERR_XXX", "message": "..." } }
  pagination_fields: ["limit", "offset", "total_count", "has_more"]
  pagination_defaults: { limit: 10, min: 1, max: 100, offset: 0 }

# =============================================================================
# §1.1 Entity-Relationship Table
# =============================================================================
entities:
  - name: Owner
    parent: null
    common_fields: true
    fields:
      - { name: legal_name, type: string, source: input, description: "Owner entity legal name" }
      - { name: distribution_day_of_month, type: integer, source: input, default: 10, description: "Contractual owner distribution target day (1-28)" }
      - { name: status, type: enum, source: system, default: ACTIVE, description: "ACTIVE | SUSPENDED | EXITED" , constraints: "ACTIVE|SUSPENDED|EXITED" }

  - name: ManagementAgreement
    parent: Owner
    common_fields: true
    fields:
      - { name: owner_id, type: string, source: system, description: "FK -> Owner.id; owning owner" }
      - { name: property_id, type: string, source: input, description: "FK -> Property.id; the managed property (set at onboarding completion)" }
      - { name: base_fee_pct, type: number, source: input, description: "Base management fee as fraction of collected revenue (e.g., 0.04)" }
      - { name: minimum_monthly_fee_cents, type: integer, source: input, description: "Monthly floor on base fee" }
      - { name: incentive_threshold_egi_cents, type: integer, source: input, description: "Monthly EGI threshold above which incentive tier 1 applies" }
      - { name: incentive_tier1_rate, type: number, source: input, description: "Fraction of EGI above threshold paid as incentive (e.g., 0.10)" }
      - { name: noi_hurdle_pct, type: number, source: input, default: 0.08, description: "Annual NOI outperformance hurdle for incentive fee" }
      - { name: incentive_noi_share_pct, type: number, source: input, default: 0.20, description: "Manager share of NOI above hurdle" }
      - { name: tail_months, type: integer, source: input, default: 3, description: "Months of fee tail owed on termination for convenience" }
      - { name: tail_rate_pct, type: number, source: input, default: 0.50, description: "Fraction of trailing-average monthly base fee owed per tail month" }
      - { name: effective_date, type: datetime, source: input, description: "Agreement effective date (ISO8601)" }
      - { name: term_end_date, type: datetime, source: input, description: "Agreement scheduled end date (ISO8601)" }
      - { name: status, type: enum, source: system, default: DRAFT, description: "DRAFT | ACTIVE | SUSPENDED | TERMINATION_PENDING | TERMINATED | EXPIRED", constraints: "DRAFT|ACTIVE|SUSPENDED|TERMINATION_PENDING|TERMINATED|EXPIRED" }
      - { name: terminated_reason, type: enum, source: input, description: "CONVENIENCE | CAUSE | DISPOSITION | EXPIRY; required when terminating", constraints: "CONVENIENCE|CAUSE|DISPOSITION|EXPIRY" }
      - { name: termination_fee_tail_cents, type: integer, source: computed, default: 0, description: "Fee tail computed at termination for CONVENIENCE/DISPOSITION (see calculation fee_tail)" }

  - name: Property
    parent: Owner
    common_fields: true
    fields:
      - { name: owner_id, type: string, source: system, description: "FK -> Owner.id; owning owner" }
      - { name: name, type: string, source: input, description: "Property name" }
      - { name: unit_count, type: integer, source: input, description: "Total residential units" }
      - { name: management_posture, type: enum, source: computed, default: UNMANAGED, description: "UNMANAGED | ONBOARDING | MANAGED | TRANSITIONING_OUT | DISPOSED", constraints: "UNMANAGED|ONBOARDING|MANAGED|TRANSITIONING_OUT|DISPOSED" }
      - { name: disposition_listed_at, type: datetime, source: system, description: "When property was listed for disposition; null otherwise" }
      - { name: status, type: enum, source: system, default: OPEN, description: "OPEN | CLOSED", constraints: "OPEN|CLOSED" }

  - name: OnboardingTransition
    parent: Property
    common_fields: true
    fields:
      - { name: property_id, type: string, source: system, description: "FK -> Property.id; property being onboarded. Reverse reachability: GET /mgmt/properties/{id}/onboardings." }
      - { name: prior_manager_name, type: string, source: input, description: "Name of outgoing manager" }
      - { name: takeover_date, type: datetime, source: input, description: "Effective takeover date (ISO8601); cutoff for ledger import" }
      - { name: status, type: enum, source: system, default: INTAKE, description: "INTAKE | DATA_VERIFIED | LEDGER_IMPORTED | VENDOR_REVIEW | READY | ACTIVATED | ABORTED", constraints: "INTAKE|DATA_VERIFIED|LEDGER_IMPORTED|VENDOR_REVIEW|READY|ACTIVATED|ABORTED" }
      - { name: deposits_received_cents, type: integer, source: input, default: 0, description: "Resident security deposits transferred by prior manager" }
      - { name: prepaid_rent_cents, type: integer, source: input, default: 0, description: "Prepaid rent transferred" }
      - { name: delinquency_cents, type: integer, source: input, default: 0, description: "Delinquent balances inherited" }
      - { name: net_position_cents, type: integer, source: computed, description: "deposits_received_cents + prepaid_rent_cents - delinquency_cents (onboarding_net_position)" }

  - name: Resident
    parent: Property
    common_fields: true
    fields:
      - { name: property_id, type: string, source: system, description: "FK -> Property.id; resident's property" }
      - { name: unit_label, type: string, source: input, description: "Unit identifier within property" }
      - { name: full_name, type: string, source: input, description: "Resident name" }
      - { name: lease_end_date, type: datetime, source: input, description: "Lease expiration (ISO8601)" }
      - { name: lease_status, type: enum, source: system, default: ACTIVE, description: "ACTIVE | NOTICE | VACATED", constraints: "ACTIVE|NOTICE|VACATED" }

  - name: VendorContract
    parent: Property
    common_fields: true
    fields:
      - { name: property_id, type: string, source: system, description: "FK -> Property.id; property serviced" }
      - { name: vendor_name, type: string, source: input, description: "Vendor legal name" }
      - { name: service_type, type: string, source: input, description: "e.g., LANDSCAPING, ELEVATOR, PEST" }
      - { name: monthly_cost_cents, type: integer, source: input, description: "Recurring monthly contract cost" }
      - { name: start_date, type: datetime, source: input, description: "Service window start (ISO8601)" }
      - { name: end_date, type: datetime, source: input, description: "Service window end (ISO8601, exclusive)" }
      - { name: assignment_status, type: enum, source: system, default: PENDING, description: "PENDING | ASSUMED | ASSIGNED_TO_MANAGER | TERMINATED", constraints: "PENDING|ASSUMED|ASSIGNED_TO_MANAGER|TERMINATED" }

  - name: Budget
    parent: Property
    common_fields: true
    fields:
      - { name: property_id, type: string, source: system, description: "FK -> Property.id; budgeted property" }
      - { name: fiscal_year, type: integer, source: input, description: "Budget fiscal year (e.g., 2026)" }
      - { name: kind, type: enum, source: input, default: ANNUAL, description: "ANNUAL | REFORECAST", constraints: "ANNUAL|REFORECAST" }
      - { name: operating_revenue_cents, type: integer, source: input, description: "Budgeted operating revenue" }
      - { name: operating_expense_cents, type: integer, source: input, description: "Budgeted operating expense" }
      - { name: capex_total_cents, type: integer, source: input, description: "Budgeted capital expenditure" }
      - { name: supersedes_budget_id, type: string, source: input, description: "FK -> Budget.id; reforecast must supersede the currently APPROVED budget for the same property+year" }
      - { name: status, type: enum, source: system, default: DRAFT, description: "DRAFT | SUBMITTED | APPROVED | REJECTED | SUPERSEDED", constraints: "DRAFT|SUBMITTED|APPROVED|REJECTED|SUPERSEDED" }
      - { name: decided_by, type: string, source: system, description: "X-User-ID of deciding OwnerRep; null until decided" }

  - name: PricingRecommendation
    parent: Property
    common_fields: true
    fields:
      - { name: property_id, type: string, source: system, description: "FK -> Property.id; priced property" }
      - { name: unit_label, type: string, source: input, description: "Unit the recommendation applies to" }
      - { name: recommended_rent_cents, type: integer, source: input, description: "Model-recommended rent" }
      - { name: effective_start_date, type: datetime, source: input, description: "Window start (ISO8601)" }
      - { name: effective_end_date, type: datetime, source: input, description: "Window end (ISO8601, exclusive)" }
      - { name: status, type: enum, source: system, default: PROPOSED, description: "PROPOSED | PUBLISHED | OWNER_OVERRIDDEN | WITHDRAWN", constraints: "PROPOSED|PUBLISHED|OWNER_OVERRIDDEN|WITHDRAWN" }
      - { name: final_rent_cents, type: integer, source: computed, description: "Published rent; equals recommended_rent_cents unless owner override sets it" }
      - { name: override_rent_cents, type: integer, source: input, description: "Owner-set rent on override; must differ from recommended by <= MAX_OVERRIDE_BAND_PCT unless band exception" }

  - name: StaffPosition
    parent: Property
    common_fields: true
    fields:
      - { name: property_id, type: string, source: system, description: "FK -> Property.id; property charged" }
      - { name: role_title, type: string, source: input, description: "e.g., PROPERTY_MANAGER, LEASING_AGENT, MAINTENANCE_TECH" }
      - { name: hourly_cost_cents, type: integer, source: input, description: "Fully burdened hourly cost charged to property" }
      - { name: scheduled_hours_per_week, type: integer, source: input, description: "Scheduled weekly hours" }
      - { name: shared_region_code, type: string, source: input, description: "Region code; positions with same region share regional overhead pool" }
      - { name: status, type: enum, source: system, default: ACTIVE, description: "ACTIVE | INACTIVE", constraints: "ACTIVE|INACTIVE" }

  - name: MonthlyStatement
    parent: Property
    common_fields: true
    fields:
      - { name: property_id, type: string, source: system, description: "FK -> Property.id; statement property" }
      - { name: period_month, type: string, source: input, description: "Statement month, format YYYY-MM" }
      - { name: basis, type: enum, source: input, description: "CASH | ACCRUAL; which fee-basis variant this statement uses", constraints: "CASH|ACCRUAL" }
      - { name: collected_revenue_cents, type: integer, source: computed, description: "Sum of POSTED LedgerEntry amounts of kind RENT|FEE|RECOVERY for the month, per basis inclusion rules" }
      - { name: base_fee_cents, type: integer, source: computed, description: "max(minimum_monthly_fee_cents, base_fee_pct * basis revenue)" }
      - { name: incentive_fee_cents, type: integer, source: computed, description: "EGI-threshold incentive component (incentive_fee)" }
      - { name: payroll_charge_cents, type: integer, source: computed, description: "staffing_cost_allocation total for the month" }
      - { name: management_fee_total_cents, type: integer, source: computed, description: "base_fee_cents + incentive_fee_cents" }
      - { name: status, type: enum, source: system, default: OPEN, description: "OPEN | CLOSED | RESTATED", constraints: "OPEN|CLOSED|RESTATED" }

  - name: LedgerEntry
    parent: Property
    common_fields: true
    fields:
      - { name: property_id, type: string, source: system, description: "FK -> Property.id; ledger property" }
      - { name: resident_id, type: string, source: input, description: "FK -> Resident.id; resident charged/credited; null for non-resident entries" }
      - { name: kind, type: enum, source: input, description: "RENT | FEE | RECOVERY | CONCESSION | EXPENSE | PAYROLL", constraints: "RENT|FEE|RECOVERY|CONCESSION|EXPENSE|PAYROLL" }
      - { name: amount_cents, type: integer, source: input, description: "Signed amount; charges positive, credits negative" }
      - { name: accrual_month, type: string, source: input, description: "Month the charge was earned/incurred, YYYY-MM (ACCRUAL basis key)" }
      - { name: collected_month, type: string, source: input, description: "Month cash was collected, YYYY-MM; null until cash received (CASH basis key)" }
      - { name: status, type: enum, source: system, default: POSTED, description: "POSTED | VOID", constraints: "POSTED|VOID" }

  - name: OwnerReportPackage
    parent: Property
    common_fields: true
    fields:
      - { name: property_id, type: string, source: system, description: "FK -> Property.id; reported property" }
      - { name: period_month, type: string, source: input, description: "Report month, YYYY-MM" }
      - { name: package_type, type: enum, source: input, description: "MONTHLY_OWNER | LENDER", constraints: "MONTHLY_OWNER|LENDER" }
      - { name: distribution_amount_cents, type: integer, source: computed, description: "owner_distribution result for the month (MONTHLY_OWNER only; 0 for LENDER)" }
      - { name: status, type: enum, source: system, default: DRAFT, description: "DRAFT | GENERATED | DELIVERED", constraints: "DRAFT|GENERATED|DELIVERED" }

  - name: Claim
    parent: Property
    common_fields: true
    fields:
      - { name: property_id, type: string, source: system, description: "FK -> Property.id; property where incident occurred" }
      - { name: claim_type, type: enum, source: input, description: "RESIDENT_INCIDENT | EMPLOYMENT", constraints: "RESIDENT_INCIDENT|EMPLOYMENT" }
      - { name: reserved_amount_cents, type: integer, source: input, description: "Loss reserve held against property funds" }
      - { name: indemnified_by, type: enum, source: input, description: "OWNER | MANAGER | SHARED per agreement risk allocation", constraints: "OWNER|MANAGER|SHARED" }
      - { name: incident_date, type: datetime, source: input, description: "Date of incident (ISO8601); must be within agreement term for manager indemnification" }
      - { name: status, type: enum, source: system, default: OPEN, description: "OPEN | UNDER_REVIEW | SETTLED | CLOSED", constraints: "OPEN|UNDER_REVIEW|SETTLED|CLOSED" }

  - name: ClaimSettlement
    parent: Claim
    common_fields: false
    fields:
      - { name: claim_id, type: string, source: system, description: "FK -> Claim.id; settled claim" }
      - { name: amount_cents, type: integer, source: input, description: "Total settlement amount" }
      - { name: manager_share_cents, type: integer, source: computed, description: "Manager-borne share per risk_allocation (claim_settlement_shares)" }
      - { name: owner_share_cents, type: integer, source: computed, description: "Owner-borne share; amount_cents - manager_share_cents" }

# =============================================================================
# §1.2 State Machine Table
# =============================================================================
state_machines:
  - entity: ManagementAgreement
    initial_state: DRAFT
    terminal_states: [TERMINATED, EXPIRED]
    transitions:
      - from: DRAFT
        to: ACTIVE
        trigger: "POST /mgmt/agreements/{agreementId}/activate"
        actor: PortfolioManager
        preconditions:
          - "Owner.status == ACTIVE (else ERR_OWNER_NOT_ACTIVE)"
          - "expected_agreement_version matches current version (else ERR_STALE_VERSION)"
        side_effects:
          - "Increments ManagementAgreement.version by 1"
      - from: ACTIVE
        to: SUSPENDED
        trigger: "POST /mgmt/agreements/{agreementId}/suspend"
        actor: PortfolioManager
        preconditions:
          - "No Budget in status SUBMITTED for the property (else ERR_PENDING_OWNER_DECISION)"
        side_effects:
          - "Increments ManagementAgreement.version by 1"
          - "All StaffPosition rows for the property -> INACTIVE (cascade down)"
      - from: SUSPENDED
        to: ACTIVE
        trigger: "POST /mgmt/agreements/{agreementId}/resume"
        actor: PortfolioManager
        preconditions: []
        side_effects:
          - "Increments ManagementAgreement.version by 1"
          - "All StaffPosition rows INACTIVE due to suspension -> ACTIVE (compensation)"
      - from: ACTIVE
        to: TERMINATION_PENDING
        trigger: "POST /mgmt/agreements/{agreementId}/terminate"
        actor: OwnerRep
        preconditions:
          - "terminated_reason provided (else ERR_INVALID_REQUEST)"
          - "Property.management_posture == MANAGED (else ERR_INVALID_STATE_TRANSITION)"
        side_effects:
          - "If terminated_reason == CONVENIENCE or DISPOSITION: compute fee_tail -> termination_fee_tail_cents"
          - "Property.management_posture -> TRANSITIONING_OUT"
      - from: TERMINATION_PENDING
        to: TERMINATED
        trigger: "POST /mgmt/agreements/{agreementId}/complete_termination"
        actor: PortfolioManager
        preconditions:
          - "All OnboardingTransition obligations for the property are terminal (ACTIVATED or ABORTED)"
          - "No Claim for the property in status OPEN or UNDER_REVIEW (else ERR_OPEN_CLAIMS_BLOCK_EXIT)"
          - "termination_fee_tail_cents == 0 OR a POSTED LedgerEntry of kind EXPENSE with amount == termination_fee_tail_cents exists for the property (tail invoiced)"
        side_effects:
          - "Property.management_posture -> UNMANAGED (or DISPOSED if terminated_reason == DISPOSITION and disposition completed)"
          - "All VendorContract rows ASSIGNED_TO_MANAGER -> TERMINATED (cascade down)"
      - from: ACTIVE
        to: EXPIRED
        trigger: "system (logical clock reaches term_end_date during advance_month)"
        actor: system
        preconditions:
          - "logical clock >= term_end_date"
        side_effects:
          - "Property.management_posture -> UNMANAGED"
          - "No fee tail accrues on EXPIRY"

  - entity: Property
    initial_state: OPEN
    terminal_states: [CLOSED]
    transitions:
      - from: OPEN
        to: OPEN
        trigger: "POST /mgmt/properties/{propertyId}/list_for_disposition"
        actor: OwnerRep
        preconditions:
          - "Property.management_posture == MANAGED (else ERR_INVALID_STATE_TRANSITION)"
        side_effects:
          - "disposition_listed_at = logical clock now"
          - "Dispositions require lender-style reporting: OwnerReportPackage rows of type LENDER become due monthly until disposition completes"
      - from: OPEN
        to: CLOSED
        trigger: "POST /mgmt/properties/{propertyId}/complete_disposition"
        actor: OwnerRep
        preconditions:
          - "disposition_listed_at is not null (else ERR_INVALID_STATE_TRANSITION)"
          - "ManagementAgreement for the property in TERMINATION_PENDING with terminated_reason == DISPOSITION (else ERR_INVALID_STATE_TRANSITION)"
        side_effects:
          - "status -> CLOSED; Property.management_posture -> DISPOSED"
          - "Agreement TERMINATION_PENDING -> TERMINATED immediately (disposition shortcut; tail still invoiced if fee_tail computed > 0)"

  - entity: OnboardingTransition
    initial_state: INTAKE
    terminal_states: [ACTIVATED, ABORTED]
    transitions:
      - from: INTAKE
        to: DATA_VERIFIED
        trigger: "POST /mgmt/onboardings/{onboardingId}/verify_resident_data"
        actor: PropertyAccountant
        preconditions:
          - "At least one Resident row exists for the property (else ERR_NO_RESIDENT_DATA)"
        side_effects: []
      - from: DATA_VERIFIED
        to: LEDGER_IMPORTED
        trigger: "POST /mgmt/onboardings/{onboardingId}/import_ledger"
        actor: PropertyAccountant
        preconditions:
          - "deposits_received_cents, prepaid_rent_cents, delinquency_cents set (>= 0 each)"
        side_effects:
          - "Compute onboarding_net_position -> net_position_cents"
          - "Create balancing LedgerEntry rows as of takeover_date: deposits and prepaid import as credits, delinquency as charges"
      - from: LEDGER_IMPORTED
        to: VENDOR_REVIEW
        trigger: "POST /mgmt/onboardings/{onboardingId}/begin_vendor_review"
        actor: PropertyAccountant
        preconditions: []
        side_effects: []
      - from: VENDOR_REVIEW
        to: READY
        trigger: "POST /mgmt/onboardings/{onboardingId}/complete_vendor_review"
        actor: PropertyAccountant
        preconditions:
          - "Every VendorContract for the property has assignment_status in {ASSUMED, ASSIGNED_TO_MANAGER, TERMINATED} — none left PENDING (else ERR_VENDOR_CONTRACTS_PENDING)"
        side_effects: []
      - from: READY
        to: ACTIVATED
        trigger: "POST /mgmt/onboardings/{onboardingId}/activate"
        actor: PortfolioManager
        preconditions:
          - "ManagementAgreement for the property is ACTIVE (else ERR_AGREEMENT_NOT_ACTIVE)"
        side_effects:
          - "Property.management_posture -> MANAGED"
          - "OnboardingTransition sets Property into service; first MonthlyStatement may be created"
      - from: INTAKE
        to: ABORTED
        trigger: "POST /mgmt/onboardings/{onboardingId}/abort"
        actor: PortfolioManager
        preconditions: []
        side_effects:
          - "Property.management_posture -> UNMANAGED"
    note: "Onboarding is a branching pipeline with an abort escape; VENDOR_REVIEW -> READY is gated on the aggregate state of child VendorContract rows (guarded transition)."

  - entity: Budget
    initial_state: DRAFT
    terminal_states: [APPROVED, REJECTED, SUPERSEDED]
    transitions:
      - from: DRAFT
        to: SUBMITTED
        trigger: "POST /mgmt/budgets/{budgetId}/submit"
        actor: PropertyAccountant
        preconditions:
          - "Property.management_posture == MANAGED (else ERR_INVALID_STATE_TRANSITION)"
          - "kind == ANNUAL OR (kind == REFORECAST AND supersedes_budget_id references an APPROVED budget for same property+fiscal_year, else ERR_REFORECAST_REQUIRES_APPROVED_BASE)"
        side_effects: []
      - from: SUBMITTED
        to: APPROVED
        trigger: "POST /mgmt/budgets/{budgetId}/approve"
        actor: OwnerRep
        preconditions:
          - "OwnerRep must not equal the submitting user (segregation of duties — else ERR_SOD_VIOLATION)"
          - "If kind == REFORECAST: the superseded APPROVED budget flips to SUPERSEDED in the same request"
        side_effects:
          - "Increments Budget.version by 1"
          - "decided_by = X-User-ID"
          - "Cascade: if kind == REFORECAST, supersedes_budget_id budget status -> SUPERSEDED (cross-entity within aggregate)"
      - from: SUBMITTED
        to: REJECTED
        trigger: "POST /mgmt/budgets/{budgetId}/reject"
        actor: OwnerRep
        preconditions:
          - "OwnerRep must not equal the submitting user (else ERR_SOD_VIOLATION)"
        side_effects:
          - "decided_by = X-User-ID"
    note: "REFORECAST approval is a create-with-supersede: a second SUBMITTED reforecast may legitimately replace the first; the loser is detected via OCC on the superseded APPROVED budget's version (see concurrency_rules[budget-reforecast-stale-base])."

  - entity: PricingRecommendation
    initial_state: PROPOSED
    terminal_states: [PUBLISHED, OWNER_OVERRIDDEN, WITHDRAWN]
    transitions:
      - from: PROPOSED
        to: PUBLISHED
        trigger: "POST /mgmt/pricing/{pricingId}/publish"
        actor: RevenueAnalyst
        preconditions:
          - "No other PUBLISHED PricingRecommendation for same property+unit_label with overlapping [effective_start_date, effective_end_date) window (else ERR_PRICING_WINDOW_OVERLAP)"
          - "effective_start_date < effective_end_date (else ERR_INVALID_REQUEST)"
        side_effects:
          - "final_rent_cents = recommended_rent_cents"
      - from: PUBLISHED
        to: OWNER_OVERRIDDEN
        trigger: "POST /mgmt/pricing/{pricingId}/override"
        actor: OwnerRep
        preconditions:
          - "override_rent_cents within MAX_OVERRIDE_BAND_PCT of recommended_rent_cents (else ERR_OVERRIDE_BAND_EXCEEDED)"
        side_effects:
          - "final_rent_cents = override_rent_cents"
      - from: PROPOSED
        to: WITHDRAWN
        trigger: "POST /mgmt/pricing/{pricingId}/withdraw"
        actor: RevenueAnalyst
        preconditions: []
        side_effects: []
      - from: PUBLISHED
        to: WITHDRAWN
        trigger: "POST /mgmt/pricing/{pricingId}/withdraw"
        actor: RevenueAnalyst
        preconditions:
          - "logical clock < effective_start_date (cannot withdraw a live price window; else ERR_INVALID_STATE_TRANSITION)"
        side_effects: []

  - entity: MonthlyStatement
    initial_state: OPEN
    terminal_states: [CLOSED]
    transitions:
      - from: OPEN
        to: CLOSED
        trigger: "POST /mgmt/statements/{statementId}/close"
        actor: PropertyAccountant
        preconditions:
          - "Property.management_posture in {MANAGED, TRANSITIONING_OUT} (else ERR_INVALID_STATE_TRANSITION)"
          - "logical clock >= first day of the month following period_month (statement may only close after its month ends; else ERR_STATEMENT_PERIOD_OPEN)"
        side_effects:
          - "Run management_fee_invoice + incentive_fee + staffing_cost_allocation; freeze computed fields"
          - "Cascade: property cash_available reduced by management_fee_total_cents + payroll_charge_cents (fees are paid to manager)"
          - "Cascade: OwnerReportPackage DRAFT for same property+period_month becomes GENERATED and its distribution_amount_cents is computed via owner_distribution"
      - from: CLOSED
        to: CLOSED
        trigger: "POST /mgmt/statements/{statementId}/restate"
        actor: PropertyAccountant
        preconditions:
          - "Books for the period not owner-locked: no DELIVERED OwnerReportPackage exists for same property+period_month (else ERR_BOOKS_LOCKED)"
        side_effects:
          - "Statement remains CLOSED but all computed fields are recomputed from current LedgerEntry state; prior computed values superseded (restatement)"
          - "Increments MonthlyStatement.version by 1"

  - entity: Claim
    initial_state: OPEN
    terminal_states: [CLOSED]
    transitions:
      - from: OPEN
        to: UNDER_REVIEW
        trigger: "POST /mgmt/claims/{claimId}/begin_review"
        actor: RiskOfficer
        preconditions: []
        side_effects:
          - "Reserve: property cash_available reduced by reserved_amount_cents (contingent hold)"
      - from: UNDER_REVIEW
        to: SETTLED
        trigger: "POST /mgmt/claims/{claimId}/settle"
        actor: RiskOfficer
        preconditions:
          - "incident_date within [agreement.effective_date, agreement.term_end_date] when indemnified_by == MANAGER (manager indemnifies only incidents inside the term; else ERR_INCIDENT_OUTSIDE_TERM)"
          - "expected_claim_version matches (else ERR_STALE_VERSION)"
        side_effects:
          - "Create ClaimSettlement row computing manager_share_cents/owner_share_cents (claim_settlement_shares)"
          - "Release reserve: reserved_amount_cents hold removed; owner_share_cents deducted from property cash_available"
          - "Increments Claim.version by 1"
      - from: SETTLED
        to: CLOSED
        trigger: "POST /mgmt/claims/{claimId}/close"
        actor: RiskOfficer
        preconditions: []
        side_effects: []
      - from: OPEN
        to: CLOSED
        trigger: "POST /mgmt/claims/{claimId}/close"
        actor: RiskOfficer
        preconditions:
          - "reserved_amount_cents == 0 (no reserve outstanding; else ERR_RESERVE_OUTSTANDING)"
        side_effects: []

  - entity: OwnerReportPackage
    initial_state: DRAFT
    terminal_states: [DELIVERED]
    transitions:
      - from: DRAFT
        to: GENERATED
        trigger: "system (cascade from MonthlyStatement close) or POST /mgmt/reports/{reportId}/generate"
        actor: PropertyAccountant | system
        preconditions:
          - "MonthlyStatement for property+period_month is CLOSED (else ERR_INVALID_STATE_TRANSITION)"
        side_effects:
          - "distribution_amount_cents computed via owner_distribution (MONTHLY_OWNER packages only)"
      - from: GENERATED
        to: DELIVERED
        trigger: "POST /mgmt/reports/{reportId}/deliver"
        actor: PropertyAccountant
        preconditions:
          - "For MONTHLY_OWNER: logical clock day-of-month <= Owner.distribution_day_of_month + 5 (late delivery permitted within 5-day grace; else ERR_DISTRIBUTION_WINDOW_MISSED)"
          - "For LENDER on a property with disposition_listed_at set: delivery mandatory by month-end (validated at advance_month; missed -> ERR_LENDER_REPORT_OVERDUE)"
        side_effects:
          - "Distribution posted: for MONTHLY_OWNER, property cash_available reduced by distribution_amount_cents and an Owner distribution LedgerEntry of kind EXPENSE is recorded"

# =============================================================================
# §1.2.1 Concurrency Rules (true races only; OCC on parent version)
# =============================================================================
concurrency_rules:
  - rule_id: agreement-activate-stale-version
    parent_entity: ManagementAgreement
    write_endpoint: "POST /mgmt/agreements/{agreementId}/activate"
    occ_field: "expected_agreement_version"
    description: |
      Activating a ManagementAgreement whose version has advanced since the
      client last observed it is rejected. The activation request must carry
      the version the client read; a stale value means another writer has
      already mutated the agreement (e.g., terms amended) and activation
      would proceed on outdated terms.
    error_id: ERR_STALE_VERSION
    http_status: 412
  - rule_id: budget-reforecast-stale-base
    parent_entity: Budget
    write_endpoint: "POST /mgmt/budgets"
    occ_field: "expected_base_budget_version"
    description: |
      Creating a REFORECAST Budget that supersedes an APPROVED base Budget
      whose version has advanced since the client last observed it is
      rejected. The supersede is legitimate — a newer reforecast replaces the
      prior one — but the client must supersede the version it actually read;
      a stale expected_base_budget_version means the base budget was amended
      or already superseded by another reforecast.
    error_id: ERR_STALE_VERSION
    http_status: 412
  - rule_id: claim-settle-stale-version
    parent_entity: Claim
    write_endpoint: "POST /mgmt/claims/{claimId}/settle"
    occ_field: "expected_claim_version"
    description: |
      Settling a Claim whose version has advanced since the client last
      observed it is rejected. Settlement terms depend on the claim's current
      reserve and indemnification fields; a stale expected_claim_version
      means those fields changed after the client read them.
    error_id: ERR_STALE_VERSION
    http_status: 412

# =============================================================================
# §1.3 Calculation Rules Table
# =============================================================================
calculations:
  - name: management_fee_invoice
    trigger: "MonthlyStatement close (and preview on statement GET)"
    algorithm: threshold
    formula: |
      revenue = collected_revenue_cents for the statement's basis (see variants)
      base_fee_cents = max(agreement.minimum_monthly_fee_cents,
                           round(agreement.base_fee_pct * revenue))
      Rounding: round_half_up to whole cents, applied once after the
      percentage multiplication (never round the percentage itself).
    input_set: "LedgerEntry rows for the property with status == POSTED and kind in {RENT, FEE, RECOVERY}; CONCESSION entries reduce RENT revenue; EXPENSE and PAYROLL kinds are excluded from revenue. CASH basis includes rows whose collected_month == period_month; ACCRUAL basis includes rows whose accrual_month == period_month regardless of collection."
    constants:
      ROUNDING: round_half_up
    precision: "0 decimal places (whole cents), round_half_up"
    variants:
      - name: cash_basis
        when: "MonthlyStatement.basis == CASH"
        difference: "Revenue counted in the month cash is collected; a charge accrued in month M but collected in M+1 counts in M+1 only."
      - name: accrual_basis
        when: "MonthlyStatement.basis == ACCRUAL"
        difference: "Revenue counted in the month earned regardless of collection; the identical ledger produces a different fee whenever collection lags accrual."
  - name: incentive_fee
    trigger: "MonthlyStatement close"
    algorithm: threshold
    formula: |
      egi = collected_revenue_cents (same basis as the statement)
      if egi > agreement.incentive_threshold_egi_cents:
        incentive_fee_cents = round(agreement.incentive_tier1_rate *
                                    (egi - agreement.incentive_threshold_egi_cents))
      else:
        incentive_fee_cents = 0
      Boundary: EGI exactly equal to the threshold yields 0 (strictly greater
      than triggers; >= does not).
    input_set: "Same LedgerEntry input set as management_fee_invoice for the statement's basis."
    constants:
      ROUNDING: round_half_up
    precision: "0 decimal places (whole cents), round_half_up"
  - name: annual_noi_incentive
    trigger: "advance_month when period_month is December (annual settlement)"
    algorithm: threshold
    formula: |
      budget_noi = APPROVED ANNUAL Budget.operating_revenue_cents -
                   APPROVED ANNUAL Budget.operating_expense_cents
      actual_noi = sum over the fiscal year's CLOSED MonthlyStatement rows of
                   (collected_revenue_cents) -
                   sum of POSTED LedgerEntry kind == EXPENSE amounts for the year
      if actual_noi > budget_noi * (1 + agreement.noi_hurdle_pct):
        annual_incentive_cents = round(agreement.incentive_noi_share_pct *
          (actual_noi - round(budget_noi * (1 + agreement.noi_hurdle_pct))))
      else:
        annual_incentive_cents = 0
      Evaluation order pinned: hurdle base round(budget_noi * (1+hurdle)) is
      computed and rounded first, then subtracted from actual_noi, then the
      share percentage is applied and rounded. This ordering is normative —
      sharing-then-subtracting produces different cents and is non-compliant.
    input_set: "The fiscal year's 12 MonthlyStatement rows with status == CLOSED for the property and the APPROVED ANNUAL Budget (SUPERSEDED bases are excluded; only the currently-APPROVED budget counts)."
    constants:
      ROUNDING: round_half_up
    precision: "0 decimal places (whole cents), round_half_up"
    variants:
      - name: cash_noi
        when: "Majority of the year's statements used CASH basis"
        difference: "actual_noi aggregates cash-basis revenue."
      - name: accrual_noi
        when: "Majority of the year's statements used ACCRUAL basis"
        difference: "actual_noi aggregates accrual-basis revenue; identical ledgers yield a different annual incentive whenever basis mix differs."
  - name: staffing_cost_allocation
    trigger: "MonthlyStatement close"
    algorithm: aggregation
    formula: |
      For each StaffPosition with property_id == property AND status == ACTIVE:
        direct_cents = scheduled_hours_per_week * WEEKS_PER_MONTH * hourly_cost_cents
      direct_total = sum(direct_cents) over qualifying positions
      regional_pool_cents = sum over all ACTIVE StaffPosition rows across ALL
        properties sharing the same shared_region_code of direct_cents
      property_share = round(regional_pool_cents * REGIONAL_OVERHEAD_PCT *
        (property_direct_total / region_direct_total))
      loaded = round((direct_total + property_share) * LOAD_PCT)
      payroll_charge_cents = direct_total + property_share + loaded
      Rounding order is normative: round the regional allocation FIRST, then
      apply LOAD_PCT and round again. Summing-then-rounding in one step
      produces different cents and is non-compliant.
    input_set: "StaffPosition rows status == ACTIVE for the property (direct) and for every property sharing shared_region_code (regional pool). INACTIVE positions are excluded from both."
    constants:
      WEEKS_PER_MONTH: 4
      REGIONAL_OVERHEAD_PCT: 0.20
      LOAD_PCT: 0.32
      ROUNDING: round_half_up
    precision: "0 decimal places (whole cents), round_half_up; two-step rounding pinned"
  - name: owner_distribution
    trigger: "OwnerReportPackage GENERATED (MONTHLY_OWNER)"
    algorithm: waterfall_allocation
    formula: |
      cash_available = property cash on hand (computed from ledger: sum POSTED
        credits minus charges, minus fees and payroll paid, minus reserves held)
      reserve_floor = PROPERTY_RESERVE_FLOOR_CENTS
      lender_holdback = LENDER_ESCROW_HOLDBACK_CENTS if the property has any
        LENDER OwnerReportPackage due this period, else 0
      claim_holds = sum of reserved_amount_cents over Claims with status in
        {OPEN, UNDER_REVIEW} for the property
      distribution_amount_cents = max(0, cash_available - reserve_floor -
        lender_holdback - claim_holds)
      Buckets fill in this pinned order: reserve_floor, then lender_holdback,
      then claim_holds, then owner distribution. The distribution is the
      remainder, never negative.
    input_set: "Property ledger aggregate, Claims in {OPEN, UNDER_REVIEW}, LENDER report packages due for period_month."
    constants:
      PROPERTY_RESERVE_FLOOR_CENTS: 20000000
      LENDER_ESCROW_HOLDBACK_CENTS: 15000000
    precision: "0 decimal places (whole cents)"
  - name: fee_tail
    trigger: "ManagementAgreement terminate with terminated_reason in {CONVENIENCE, DISPOSITION}"
    algorithm: aggregation
    formula: |
      Look back over the TAIL_LOOKBACK_MONTHS most recent CLOSED
      MonthlyStatement rows for the property, ordered by period_month
      descending; if fewer than TAIL_LOOKBACK_MONTHS exist, average over what
      exists; if none exist, tail = 0.
      avg_monthly_base_fee = round(mean of base_fee_cents over the window)
      termination_fee_tail_cents = round(avg_monthly_base_fee *
        agreement.tail_rate_pct * agreement.tail_months)
      On CAUSE or EXPIRY the tail is 0 regardless of the formula.
    input_set: "MonthlyStatement rows status == CLOSED for the property, most recent TAIL_LOOKBACK_MONTHS by period_month."
    constants:
      TAIL_LOOKBACK_MONTHS: 6
      ROUNDING: round_half_up
    precision: "0 decimal places (whole cents), round_half_up"
  - name: onboarding_net_position
    trigger: "OnboardingTransition import_ledger"
    algorithm: chronological
    formula: |
      Imported ledger rows are ordered by their original posting date as of
      takeover_date; rows posted after takeover_date are excluded from the
      import (they belong to the new manager's books).
      net_position_cents = deposits_received_cents + prepaid_rent_cents -
        delinquency_cents
      A positive net position means the prior manager owes the property funds;
      a negative position means the property inherited net liabilities.
    input_set: "OnboardingTransition deposit/prepaid/delinquency inputs as of takeover_date."
    precision: "0 decimal places (whole cents)"
  - name: claim_settlement_shares
    trigger: "Claim settle"
    algorithm: constraint_propagation
    formula: |
      if claim.indemnified_by == MANAGER:
        manager_share_cents = min(amount_cents, MANAGER_INDEMNITY_CAP_CENTS)
      elif claim.indemnified_by == OWNER:
        manager_share_cents = 0
      else:  # SHARED
        manager_share_cents = round(amount_cents * SHARED_MANAGER_PCT)
      owner_share_cents = amount_cents - manager_share_cents
      Invariant: manager_share_cents + owner_share_cents == amount_cents for
      every settlement (no rounding drift — owner absorbs the remainder).
    input_set: "The Claim being settled."
    constants:
      MANAGER_INDEMNITY_CAP_CENTS: 100000000
      SHARED_MANAGER_PCT: 0.25
      ROUNDING: round_half_up
    precision: "0 decimal places (whole cents), round_half_up; remainder to owner"

# =============================================================================
# §1.4 Validation Rules Table (ordered by priority)
# =============================================================================
validations:
  - priority: 1
    category: auth
    check: "X-User-ID and X-User-Role headers must be present and well-formed"
    error_id: ERR_MISSING_OR_INVALID_USER_CONTEXT_HEADER
    http_status: 400
    applies_to: all
  - priority: 2
    category: auth
    check: "Caller role must be permitted for the endpoint per RBAC matrix"
    error_id: ERR_FORBIDDEN_FOR_ROLE
    http_status: 403
    applies_to: all
  - priority: 3
    category: existence
    check: "Path-identified resources must exist (validated left-to-right: owner, then property/agreement, then child)"
    error_id: ERR_NOT_FOUND
    http_status: 404
    applies_to: all resource endpoints
  - priority: 4
    category: state
    check: "Target resource must be in a state from which the requested transition is defined"
    error_id: ERR_INVALID_STATE_TRANSITION
    http_status: 409
    applies_to: "all action endpoints (activate/suspend/resume/terminate/submit/approve/reject/publish/override/withdraw/close/settle/...)"
  - priority: 5
    category: business_safety
    check: "Risk allocation: manager indemnification applies only to incidents within the agreement term; settlements on OPEN claims with outstanding reserves are blocked"
    error_id: ERR_INCIDENT_OUTSIDE_TERM
    http_status: 409
    applies_to: "POST /mgmt/claims/{claimId}/settle"
  - priority: 6
    category: business_referential
    check: "Onboarding vendor review cannot complete while any VendorContract for the property is PENDING; termination cannot complete with non-terminal onboarding obligations or open claims"
    error_id: ERR_VENDOR_CONTRACTS_PENDING
    http_status: 409
    applies_to: "POST /mgmt/onboardings/{onboardingId}/complete_vendor_review; POST /mgmt/agreements/{agreementId}/complete_termination (ERR_OPEN_CLAIMS_BLOCK_EXIT)"
  - priority: 7
    category: business_temporal
    check: "Temporal windows: pricing recommendation windows must be half-open and non-overlapping per property+unit; statements close only after their month ends; distribution delivery within grace window; vendor contract windows valid"
    error_id: ERR_PRICING_WINDOW_OVERLAP
    http_status: 409
    applies_to: "POST /mgmt/pricing/{pricingId}/publish; POST /mgmt/statements/{statementId}/close (ERR_STATEMENT_PERIOD_OPEN); POST /mgmt/reports/{reportId}/deliver (ERR_DISTRIBUTION_WINDOW_MISSED); vendor contract create (ERR_INVALID_REQUEST when start >= end)"
  - priority: 8
    category: business_constraint
    check: "Override band: OwnerRep override_rent_cents must be within MAX_OVERRIDE_BAND_PCT of recommended_rent_cents; segregation of duties: budget approver != budget submitter"
    error_id: ERR_OVERRIDE_BAND_EXCEEDED
    http_status: 409
    applies_to: "POST /mgmt/pricing/{pricingId}/override; POST /mgmt/budgets/{budgetId}/approve|reject (ERR_SOD_VIOLATION)"
  - priority: 9
    category: business_fiscal
    check: "Fiscal guards: reforecast requires an APPROVED base budget for the same property+year; owner distribution never drives cash below reserve floor; termination fee tail must be invoiced before termination completes"
    error_id: ERR_REFORECAST_REQUIRES_APPROVED_BASE
    http_status: 409
    applies_to: "POST /mgmt/budgets (kind=REFORECAST); owner_distribution (floor enforced in formula); complete_termination (tail invoice precondition)"
  - priority: 10
    category: business_fiscal
    check: "Books locked: a MonthlyStatement may not be restated once any OwnerReportPackage for the same property+period_month is DELIVERED"
    error_id: ERR_BOOKS_LOCKED
    http_status: 409
    applies_to: "POST /mgmt/statements/{statementId}/restate"

# =============================================================================
# §1.5 API Endpoint Table
# =============================================================================
endpoints:
  # --- Logical clock (test-driving; default time fixed) ---
  - method: POST
    path: "/mgmt/_clock/set_current_utc"
    description: "Set the logical clock. Before any call to this endpoint the logical clock reads exactly 2026-09-01T00:00:00Z and MUST NOT fall back to real wall-clock time."
    roles: [PortfolioManager]
    code: 200
    input: [to_iso8601]
    output: { current_utc: string }
    side_effects: ["Logical clock advanced; no automatic month roll (use advance_month)"]

  # --- Owner ---
  - method: POST
    path: "/mgmt/owners"
    description: "Create an Owner"
    roles: [PortfolioManager]
    code: 201
    input: ["legal_name", "distribution_day_of_month?"]
    output: Owner
    side_effects: ["status=ACTIVE"]
  - method: GET
    path: "/mgmt/owners/{ownerId}"
    description: "Get an Owner"
    roles: [PortfolioManager, PropertyAccountant, OwnerRep, RevenueAnalyst, RiskOfficer]
    code: 200
    input: []
    output: Owner
    side_effects: []
  - method: GET
    path: "/mgmt/owners"
    description: "List Owners"
    roles: [PortfolioManager, PropertyAccountant, OwnerRep, RevenueAnalyst, RiskOfficer]
    code: 200
    input: ["status?", "limit?", "offset?"]
    output: Owner[]
    side_effects: []

  # --- Property ---
  - method: POST
    path: "/mgmt/owners/{ownerId}/properties"
    description: "Create a Property under an Owner"
    roles: [PortfolioManager]
    code: 201
    input: [name, unit_count]
    output: Property
    side_effects: ["management_posture=UNMANAGED, status=OPEN"]
  - method: GET
    path: "/mgmt/properties/{propertyId}"
    description: "Get a Property"
    roles: [PortfolioManager, PropertyAccountant, OwnerRep, RevenueAnalyst, RiskOfficer]
    code: 200
    input: []
    output: Property
    side_effects: []
  - method: GET
    path: "/mgmt/properties"
    description: "List Properties (filterable by owner_id, management_posture)"
    roles: [PortfolioManager, PropertyAccountant, OwnerRep, RevenueAnalyst, RiskOfficer]
    code: 200
    input: ["owner_id?", "management_posture?", "limit?", "offset?"]
    output: Property[]
    side_effects: []
  - method: POST
    path: "/mgmt/properties/{propertyId}/list_for_disposition"
    description: "Mark a managed property listed for sale"
    roles: [OwnerRep]
    code: 200
    input: []
    output: Property
    side_effects: ["disposition_listed_at set; LENDER reports become due monthly"]
  - method: POST
    path: "/mgmt/properties/{propertyId}/complete_disposition"
    description: "Complete a property disposition (sale closes)"
    roles: [OwnerRep]
    code: 200
    input: []
    output: Property
    side_effects: ["status=CLOSED, management_posture=DISPOSED; agreement TERMINATION_PENDING(DISPOSITION) -> TERMINATED"]

  # --- ManagementAgreement ---
  - method: POST
    path: "/mgmt/owners/{ownerId}/agreements"
    description: "Create a ManagementAgreement (DRAFT)"
    roles: [PortfolioManager]
    code: 201
    input: ["property_id", "base_fee_pct", "minimum_monthly_fee_cents", "incentive_threshold_egi_cents", "incentive_tier1_rate", "noi_hurdle_pct?", "incentive_noi_share_pct?", "tail_months?", "tail_rate_pct?", "effective_date", "term_end_date"]
    output: ManagementAgreement
    side_effects: ["status=DRAFT"]
  - method: GET
    path: "/mgmt/agreements/{agreementId}"
    description: "Get a ManagementAgreement"
    roles: [PortfolioManager, PropertyAccountant, OwnerRep, RevenueAnalyst, RiskOfficer]
    code: 200
    input: []
    output: ManagementAgreement
    side_effects: []
  - method: GET
    path: "/mgmt/agreements"
    description: "List ManagementAgreements (filterable by owner_id, property_id, status)"
    roles: [PortfolioManager, PropertyAccountant, OwnerRep, RevenueAnalyst, RiskOfficer]
    code: 200
    input: ["owner_id?", "property_id?", "status?", "limit?", "offset?"]
    output: ManagementAgreement[]
    side_effects: []
  - method: POST
    path: "/mgmt/agreements/{agreementId}/activate"
    description: "Activate a DRAFT agreement (OCC-guarded)"
    roles: [PortfolioManager]
    code: 200
    input: [expected_agreement_version]
    output: ManagementAgreement
    side_effects: ["status=ACTIVE; increments ManagementAgreement.version by 1"]
  - method: POST
    path: "/mgmt/agreements/{agreementId}/suspend"
    description: "Suspend an ACTIVE agreement"
    roles: [PortfolioManager]
    code: 200
    input: []
    output: ManagementAgreement
    side_effects: ["status=SUSPENDED; StaffPosition rows for property -> INACTIVE; increments ManagementAgreement.version by 1"]
  - method: POST
    path: "/mgmt/agreements/{agreementId}/resume"
    description: "Resume a SUSPENDED agreement"
    roles: [PortfolioManager]
    code: 200
    input: []
    output: ManagementAgreement
    side_effects: ["status=ACTIVE; suspended StaffPosition rows -> ACTIVE; increments ManagementAgreement.version by 1"]
  - method: POST
    path: "/mgmt/agreements/{agreementId}/terminate"
    description: "Owner initiates termination (reason required)"
    roles: [OwnerRep]
    code: 200
    input: [terminated_reason]
    output: ManagementAgreement
    side_effects: ["status=TERMINATION_PENDING; fee_tail computed for CONVENIENCE/DISPOSITION; Property.management_posture=TRANSITIONING_OUT"]
  - method: POST
    path: "/mgmt/agreements/{agreementId}/complete_termination"
    description: "Complete termination after obligations and tail invoice settle"
    roles: [PortfolioManager]
    code: 200
    input: []
    output: ManagementAgreement
    side_effects: ["status=TERMINATED; VendorContract ASSIGNED_TO_MANAGER -> TERMINATED; Property posture -> UNMANAGED/DISPOSED"]

  # --- Onboarding ---
  - method: POST
    path: "/mgmt/properties/{propertyId}/onboardings"
    description: "Start onboarding a property from a prior manager"
    roles: [PortfolioManager, PropertyAccountant]
    code: 201
    input: ["prior_manager_name", "takeover_date", "deposits_received_cents?", "prepaid_rent_cents?", "delinquency_cents?"]
    output: OnboardingTransition
    side_effects: ["status=INTAKE; Property.management_posture=ONBOARDING"]
  - method: GET
    path: "/mgmt/onboardings/{onboardingId}"
    description: "Get an OnboardingTransition"
    roles: [PortfolioManager, PropertyAccountant, OwnerRep, RiskOfficer]
    code: 200
    input: []
    output: OnboardingTransition
    side_effects: []
  - method: GET
    path: "/mgmt/properties/{propertyId}/onboardings"
    description: "List onboarding transitions for a property"
    roles: [PortfolioManager, PropertyAccountant, OwnerRep, RiskOfficer]
    code: 200
    input: ["limit?", "offset?"]
    output: OnboardingTransition[]
    side_effects: []
  - method: POST
    path: "/mgmt/onboardings/{onboardingId}/verify_resident_data"
    description: "Mark resident data verified"
    roles: [PropertyAccountant]
    code: 200
    input: []
    output: OnboardingTransition
    side_effects: ["status=DATA_VERIFIED"]
  - method: POST
    path: "/mgmt/onboardings/{onboardingId}/import_ledger"
    description: "Import prior-manager ledger balances"
    roles: [PropertyAccountant]
    code: 200
    input: [deposits_received_cents, prepaid_rent_cents, delinquency_cents]
    output: OnboardingTransition
    side_effects: ["status=LEDGER_IMPORTED; computes net_position_cents; creates balancing LedgerEntry rows"]
  - method: POST
    path: "/mgmt/onboardings/{onboardingId}/begin_vendor_review"
    description: "Begin vendor contract transition review"
    roles: [PropertyAccountant]
    code: 200
    input: []
    output: OnboardingTransition
    side_effects: ["status=VENDOR_REVIEW"]
  - method: POST
    path: "/mgmt/onboardings/{onboardingId}/complete_vendor_review"
    description: "Complete vendor review (all contracts resolved)"
    roles: [PropertyAccountant]
    code: 200
    input: []
    output: OnboardingTransition
    side_effects: ["status=READY"]
  - method: POST
