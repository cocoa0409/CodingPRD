              as_user_id: "${cust_id}"
              captures: { err: "$.data.error_id"}
          assert:
            - "${err} == ERR_INVALID_RETURN_STATE"
            - "HTTP 409"

      - name: deciding_an_already_decided_return_returns_invalid_return_state
        claim_type: idempotency
        grounds: ["state_machines.ReturnRequest", "errors[ERR_INVALID_RETURN_STATE]"]
        distinguishing_aspect: "APPROVED is terminal: a second decision on the same ReturnRequest returns ERR_INVALID_RETURN_STATE (409) and does not refund a second time (Order.refunded_cents stays 2500)."
        test_recipe:
          setup: ["A SHIPPED, CAPTURED order (1 unit at 2500, SEALED) with an APPROVED return for that unit."]
          setup_api_calls:
            - call: "POST /stores"
