  - section: rbac
    instances:
      - name: field_technician_cannot_dispatch_tickets
        claim_type: rbac_deny
        grounds: ["roles[ServiceDispatcher]", "roles[FieldTechnician]", "validations[priority=2]"]
        distinguishing_aspect: "dispatch is exclusive to ServiceDispatcher; a FieldTechnician caller gets 403 even when the ticket is otherwise dispatchable."
        test_recipe:
          setup: ["Accepted-sale fixture; technician T1; ticket K assessed to COVERAGE_ASSESSED"]
          setup_api_calls:
            - { call: "POST /api/practices", payload: { name: "P Rb", region: "R1", credit_limit_cents: 10000000 }, as: DistributionAdmin, captures: { p: $.data.id } }
            - { call: "POST /api/products", payload: { sku: "EQ-23", name: "Chair", kind: "EQUIPMENT", unit_price_cents: 500000, manufacturer: "M", warranty_months: 12 }, as: DistributionAdmin, captures: { eq: $.data.id } }
