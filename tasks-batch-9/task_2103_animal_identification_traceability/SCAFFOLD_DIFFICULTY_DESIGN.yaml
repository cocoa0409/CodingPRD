  - rule_id: boundary_precision_check
    instances:

      - name: variance_pct_exactly_tolerance_approves_without_suspension
        grounds:
          - calculations.reconciliation_variance
          - state_machines.ReconciliationRun.SUBMITTED_to_APPROVED
          - entities.ReconciliationRun.fields.variance_pct
        distinguishing_aspect: |
          Boundary on the variance metric at POST /reconciliation-runs/{id}/approve: a book of 200
          against a physical count of 199 is exactly 0.50 percent, which is inside tolerance
          (`<=`), so the run APPROVES and the premises stays ACTIVE; 0.51 would have flagged it.
        test_recipe:
          setup:
            - "Premises P (COW_CALF, ACTIVE) holds one 200-device lot with zero applications, so the AS_ISSUED book balance is 200."
            - "The producer counts 199 devices on hand."
