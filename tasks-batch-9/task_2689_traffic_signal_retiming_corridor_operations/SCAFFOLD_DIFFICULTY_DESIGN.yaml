            - call: "POST /signal-ops/timing-plans/${pe_id}/submit"
              payload: {}
              as: TimingEngineer
              as_user_id: "eng-1"
              captures: { e_status: $.data.status, e_offset: $.data.offset_sec }
          assert:
            - "${a_status} == SUBMITTED"
            - "${a_cycle} == 105"
            - "${a_offset} == 0"
            - "OVERLAP on the same intersection ([500,700) intersects [360,540) at minutes 500..539): HTTP 409 with ${b_err} == ERR_TOD_WINDOW_OVERLAP"
            - "TimingPlan.${pb_id}.status == COORDINATED (the refused submit left the plan where it was)"
            - "${d_status} == SUBMITTED"
            - "${d_offset} == 60 (2640 ft / 44.0 fps == 60 s, and 60 mod 105 == 60)"
            - "ADJACENCY IS PERMITTED (zero buffer, half-open): ${e_status} == SUBMITTED even though D ends exactly where E starts at minute 540"
            - "${e_offset} == 60"
            - "RESOURCE SCOPE: E's [540,700) overlaps B's [500,700) but they are on different intersections, so E is accepted"

      - name: travel_time_run_intervals_closed_with_120_second_buffer_per_project_direction
        grounds:
          - validations[priority=67]
          - errors.ERR_RUN_SPACING_VIOLATION
          - entities.TravelTimeRun.fields.started_at
          - entities.TravelTimeRun.fields.duration_sec
          - entities.TravelTimeRun.fields.direction
        distinguishing_aspect: |
          INTERVAL SEMANTICS B — CLOSED interval [started_at, started_at + duration_sec] plus a
          MANDATORY 120-second buffer, on the RetimingProject resource keyed by
          (project_id, direction, study_role) and measured in seconds. Every geometric distinction is
          the opposite of instance A: touching endpoints are REJECTED here and permitted there; a
          non-zero buffer applies here and none applies there; the gap is checked on BOTH sides of the
          stored interval rather than only against a start-ordered predecessor. The 119 s / 120 s pair
          pins the >= boundary, and the same-instant SB run proves the direction component of the
          resource key.
