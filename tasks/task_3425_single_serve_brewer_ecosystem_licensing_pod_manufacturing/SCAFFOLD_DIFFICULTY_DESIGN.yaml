              as: PlatformAdmin
            - call: "POST /brands"
              payload: { name: "Termina Tea", kind: "LICENSED", home_region: "US" }
              as: PlatformAdmin
              captures: { tc2_brand: $.data.id }
            - call: "POST /license-agreements"
              payload: { brand_id: "${tc2_brand}", territory_code: "US", effective_start: "2026-01-01", effective_end: "2026-12-31", royalty_tiers: [{up_to_units: null, millicents_per_pod: 500}], quality_min_cup_score: 80, exclusive: false }
              as: LicensingManager
              captures: { tc2_ag: $.data.id }
            - call: "POST /license-agreements/${tc2_ag}/transition"
              payload: { target_state: "ACTIVE" }
              as: LicensingManager
            - call: "POST /pod-varieties"
              payload: { brand_id: "${tc2_brand}", name: "Termina Black", roast_level: "DARK", flavor_family: "UNFLAVORED", wholesale_price_cents: 118, margin_cents: 33 }
              as: BrandManager
              as_user_id: "${tc2_brand}"
              captures: { tc2_var: $.data.id }
            - call: "POST /facilities"
              payload: { name: "Temple Plant", kind: "PARTNER", region: "US-S" }
              as: OperationsDirector
              captures: { tc2_fac: $.data.id }
            - call: "POST /facilities/${tc2_fac}/filling-lines"
              payload: { line_code: "L9", supported_roast: "UNIVERSAL", supports_flavored: true, material_capability: "BOTH", capacity_pods_per_day: 80000, changeover_hours: 0 }
              as: OperationsDirector
              captures: { tc2_line: $.data.id }
            - call: "POST /production-runs"
              payload: { line_id: "${tc2_line}", variety_id: "${tc2_var}", window_start: "2026-09-10T00:00:00Z", window_end: "2026-09-11T00:00:00Z", planned_units: 1000 }
              as: ProductionPlanner
              captures: { tc2_run: $.data.id }
          trigger:
            - call: "POST /license-agreements/${tc2_ag}/transition"
              payload: { target_state: "TERMINATED" }
              as: LicensingManager
            - call: "POST /production-runs"
              payload: { line_id: "${tc2_line}", variety_id: "${tc2_var}", window_start: "2026-09-12T00:00:00Z", window_end: "2026-09-13T00:00:00Z", planned_units: 100 }
              as: ProductionPlanner
              captures: { tc2_err: $.data.error_id }
          assert:
            - "hop 1: LicenseAgreement.${tc2_ag}.status == TERMINATED"
            - "hop 2: PodVariety.${tc2_var}.status == DELISTED"
            - "hop 3: ProductionRun.${tc2_run}.status == CANCELLED"
            - "post-state: producing the delisted variety is rejected with ERR_VARIETY_NOT_ACTIVE"

      - name: replacement_depth3_cascade
        grounds:
          - state_machines.ServiceEvent.OPEN_to_RESOLVED
          - state_machines.Brewer
          - entities.Household.fields.engagement
        distinguishing_aspect: |
          Depth-3 chain from a THIRD trigger family (service resolution, not licensing):
          REPLACEMENT resolve APPROVED -> Brewer operational DECOMMISSIONED -> Household
          installed_brewers recomputes to 0 -> engagement flips CHURNED and the forward
          consumption model collapses to 0.00.
        test_recipe:
