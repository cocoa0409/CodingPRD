              payload: { action: "REOPEN", reason_code: "MANAGEMENT_OVERRIDE" }
              as: FacilitiesDirector
              as_user_id: "${s_dir}"
              captures: { err: $.data.error_id }
          assert:
            - "response status == 409 and response.data.error_id == \"ERR_UNSAFE_CLOSURE_IN_FORCE\""
            - "Field.${f_new}.play_status == \"CLOSED_UNSAFE\" and open_mandatory_remediation_count == 1"
            - "Field.${f_new}.admin_closure_active == false - the closure is a safety projection, not an administrative flag the reopen could clear"
            - "closing the order via a passing verification assessment and then re-reading the field yields play_status \"OPEN\" without any REOPEN call, confirming the posture is derived rather than stored"

      - name: remediation_order_returns_to_open_when_verification_is_rejected
        claim_type: cyclic
        grounds:
          - state_machines.RemediationOrder
          - endpoints[POST /turf/remediation-orders/{id}/submit-verification]
          - endpoints[POST /turf/remediation-orders/{id}/decide-verification]
          - entities.RemediationOrder.fields.rejection_count
        distinguishing_aspect: "OPEN -> AWAITING_DECISION -> OPEN is a genuine loop: a rejected verification returns the order to OPEN with rejection_count 1 and verification_assessment_id cleared, the field stays CLOSED_UNSAFE, and the order can then be resubmitted."
        test_recipe:
          setup:
            - "One NATURAL_GRASS field (Grass Practice 3), one SafetyInspector (Ines Vargas) and one TurfAgronomist (Tobias Lund)."
            - "A FAIL IMPACT_ATTENUATION assessment (three readings of 210.0) has opened a MANDATORY RemediationOrder; the field is CLOSED_UNSAFE."
            - "A later PASS IMPACT_ATTENUATION assessment on the same field (three readings of 120.0, assessed 2026-08-02T00:00:00Z with the clock at 2026-08-02T00:00:00Z) is available as the verification evidence."
            - "The agronomist submits that verification, moving the order to AWAITING_DECISION."
          setup_api_calls:
            - call: "POST /turf/staff-members"
              payload: { full_name: "Dana Reyes", roles: ["FacilitiesDirector"] }
              as: FacilitiesDirector
              as_user_id: "00000000-0000-0000-0000-000000000000"
              captures: { s_dir: $.data.id }
            - call: "POST /turf/staff-members"
              payload: { full_name: "Ines Vargas", roles: ["SafetyInspector"] }
              as: FacilitiesDirector
              as_user_id: "${s_dir}"
              captures: { s_ins: $.data.id }
            - call: "POST /turf/staff-members"
              payload: { full_name: "Tobias Lund", roles: ["TurfAgronomist"] }
              as: FacilitiesDirector
              as_user_id: "${s_dir}"
              captures: { s_agr: $.data.id }
            - call: "POST /turf/fields"
              payload: { name: "Grass Practice 3", surface_type: "NATURAL_GRASS", installed_on_date: "2025-08-01", expected_life_years: 12, area_sq_ft: 60000, sanctioned_level: "LOCAL", warranty_expires_on: "2030-08-01" }
              as: FacilitiesDirector
              as_user_id: "${s_dir}"
              captures: { f_new: $.data.id }
            - call: "POST /turf/safety-assessments"
              payload: { field_id: "${f_new}", inspector_staff_member_id: "${s_ins}", assessment_type: "IMPACT_ATTENUATION", assessed_at_utc: "2026-08-01T00:00:00Z", gmax_readings: [210.0, 210.0, 210.0] }
              as: SafetyInspector
              as_user_id: "${s_ins}"
              captures: { a_fail: $.data.id }
            - call: "GET /turf/remediation-orders"
              payload: { field_id: "${f_new}" }
              as: SafetyInspector
              as_user_id: "${s_ins}"
              captures: { ord1: "$.data[0].id" }
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-08-02T00:00:00Z" }
              as: FacilitiesDirector
              as_user_id: "${s_dir}"
            - call: "POST /turf/safety-assessments"
              payload: { field_id: "${f_new}", inspector_staff_member_id: "${s_ins}", assessment_type: "IMPACT_ATTENUATION", assessed_at_utc: "2026-08-02T00:00:00Z", gmax_readings: [120.0, 120.0, 120.0] }
              as: SafetyInspector
              as_user_id: "${s_ins}"
              captures: { a_pass: $.data.id, a_pass_result: $.data.result }
            - call: "POST /turf/remediation-orders/${ord1}/submit-verification"
              payload: { verification_assessment_id: "${a_pass}", submitted_by_staff_member_id: "${s_agr}", remediation_notes: "Base layer regraded and retested." }
              as: TurfAgronomist
              as_user_id: "${s_agr}"
              captures: { ord1_status: $.data.status }
          trigger:
            - call: "POST /turf/remediation-orders/${ord1}/decide-verification"
              payload: { decision: "REJECT", decision_notes: "Retest taken outside the remediated zone." }
              as: SafetyInspector
              as_user_id: "${s_ins}"
              captures: { after_status: $.data.status, after_rejects: $.data.rejection_count }
          assert:
            - "after the setup submission RemediationOrder.${ord1}.status == \"AWAITING_DECISION\" and verification_assessment_id == ${a_pass}"
            - "after the trigger RemediationOrder.${ord1}.status == \"OPEN\" - a state it already occupied"
            - "RemediationOrder.${ord1}.rejection_count == 1 and verification_assessment_id is null"
            - "Field.${f_new}.open_mandatory_remediation_count == 1 and play_status == \"CLOSED_UNSAFE\" - the rejection did not release the closure"
            - "resubmitting the same verification succeeds and moves the order back to \"AWAITING_DECISION\", and a subsequent ACCEPT sets status \"CLOSED_VERIFIED\", open_mandatory_remediation_count 0 and play_status \"OPEN\""

      - name: certification_packet_cyclic_resubmission_after_return
        claim_type: cyclic
        grounds:
          - state_machines.CertificationPacket
          - entities.CertificationPacket.fields.return_count
        excluded_because:
          difficulty_instance: non_linear_state_machine / certification_packet_return_resubmit_cycle_rescores_completeness
          rationale: "That §1.8 instance drives SUBMITTED -> RETURNED -> SUBMITTED end to end and asserts the re-entered state, return_count 1 and the rescored 90.00 completeness."

