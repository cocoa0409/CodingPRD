            - { call: "POST /api/parties", payload: { party_type: "TRUSTEE", legal_name: "Unverified Trustee Inc" }, as: EscrowOfficer, captures: { tr: $.data.id } }
            - { call: "POST /api/trust-agreements", payload: { aircraft_id: "${ac}", trustee_party_id: "${tr}", beneficiary_name: "Ben LLC", beneficiary_citizenship: "NON_US_CITIZEN", effective_date: "2026-01-01", expiry_date: "2026-12-31" }, as: EscrowOfficer, captures: { ta: $.data.id } }
          trigger:
            - { call: "POST /api/trust-agreements/${ta}/submit", payload: {}, as: EscrowOfficer, captures: { err: $.data.error_id } }
          assert:
            - "rejected ERR_TRUSTEE_NOT_QUALIFIED; trust remains DRAFT"

  - section: endpoints
    instances:
      - name: ep_statement_read_fields
        claim_type: computed_read
        grounds: [endpoints, calculations.closing_statement_totals]
        distinguishing_aspect: "GET statement on a fresh file returns the full pinned field set with coherent values: fee 150000 (floor), proration 0, due 10150000, funded 0, balance 0, seller_net 9850000."
        test_recipe:
          setup: ["one file, price 10000000, annual fee 0"]
          setup_api_calls:
            - { call: "POST /api/aircraft", payload: { n_number: "N150ST", serial_number: "S-31", make_model: "Cirrus SR22T", year: 2018 }, as: EscrowOfficer, captures: { ac: $.data.id } }
            - { call: "POST /api/parties", payload: { party_type: "BUYER", legal_name: "Buyer Co" }, as: EscrowOfficer, captures: { b: $.data.id } }
            - { call: "POST /api/parties", payload: { party_type: "SELLER", legal_name: "Seller Co" }, as: EscrowOfficer, captures: { s: $.data.id } }
            - { call: "POST /api/escrow-files", payload: { aircraft_id: "${ac}", buyer_party_id: "${b}", seller_party_id: "${s}", purchase_price_cents: 10000000, annual_registration_fee_cents: 0, proration_method: "DAILY", expected_close_date: "2026-06-30" }, as: EscrowOfficer, captures: { f: $.data.id } }
          trigger:
            - { call: "GET /api/escrow-files/${f}/statement", payload: {}, as: Auditor, captures: { fee: $.data.escrow_fee_cents, due: $.data.buyer_amount_due_cents, net: $.data.seller_net_proceeds_cents } }
          assert:
            - "statement fields: purchase_price_cents == 10000000, proration_amount_cents == 0, escrow_fee_cents == 150000"
            - "buyer_amount_due_cents == 10150000, total_funded_cents == 0, escrow_balance_cents == 0, seller_net_proceeds_cents == 9850000"
      - name: ep_get_nested_child_wrong_parent_returns_404
        claim_type: retrieval
        grounds: [endpoints, "validations[priority=5]"]
        distinguishing_aspect: "Nested read with a child that exists but belongs to a different parent returns ERR_NOT_FOUND (left-to-right path existence including parent-child membership)."
        test_recipe:
          setup: ["two files on two aircraft; file A has a search; we query the search under file B"]
          setup_api_calls:
            - { call: "POST /api/aircraft", payload: { n_number: "N151NP", serial_number: "S-32", make_model: "Cessna 180", year: 1975 }, as: EscrowOfficer, captures: { a1: $.data.id } }
            - { call: "POST /api/aircraft", payload: { n_number: "N152NP", serial_number: "S-33", make_model: "Cessna 185", year: 1976 }, as: EscrowOfficer, captures: { a2: $.data.id } }
            - { call: "POST /api/parties", payload: { party_type: "BUYER", legal_name: "Buyer Co" }, as: EscrowOfficer, captures: { b: $.data.id } }
            - { call: "POST /api/parties", payload: { party_type: "SELLER", legal_name: "Seller Co" }, as: EscrowOfficer, captures: { s: $.data.id } }
            - { call: "POST /api/escrow-files", payload: { aircraft_id: "${a1}", buyer_party_id: "${b}", seller_party_id: "${s}", purchase_price_cents: 5000000, annual_registration_fee_cents: 0, proration_method: "DAILY", expected_close_date: "2026-06-30" }, as: EscrowOfficer, captures: { fa: $.data.id } }
            - { call: "POST /api/escrow-files", payload: { aircraft_id: "${a2}", buyer_party_id: "${b}", seller_party_id: "${s}", purchase_price_cents: 5000000, annual_registration_fee_cents: 0, proration_method: "DAILY", expected_close_date: "2026-06-30" }, as: EscrowOfficer, captures: { fb: $.data.id } }
            - { call: "POST /api/escrow-files/${fa}/title-searches", payload: {}, as: EscrowOfficer, captures: { ts: $.data.id } }
          trigger:
            - { call: "POST /api/title-searches/${ts}/complete", payload: { findings: [] }, as: EscrowOfficer }
            - { call: "GET /api/escrow-files/${fb}/title-searches", payload: {}, as: EscrowOfficer }
          assert:
            - "search ${ts} belongs to file A; listing searches under file B returns an empty array (total_count == 0), never file A's search"
            - "direct completion of ${ts} succeeded (parent membership respected on the happy path)"

  - section: errors
    instances:
      - name: er_already_signed_rejected
        claim_type: violation_to_error
        grounds: ["errors[ERR_ALREADY_SIGNED]", "validations[priority=19]"]
        distinguishing_aspect: "Signing twice with the same party fails ERR_ALREADY_SIGNED (409); signature list unchanged."
        test_recipe:
          setup: ["CLEARED file; document requiring [buyer], sent, buyer already signed (FULLY_SIGNED)"]
          setup_api_calls:
            - { call: "POST /api/_clock/set_current_utc", payload: { to_iso8601: "2026-06-01T00:00:00Z" }, as: EscrowManager }
