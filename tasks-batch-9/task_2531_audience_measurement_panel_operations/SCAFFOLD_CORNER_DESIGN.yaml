            - call: "POST /meters/${mt52a_id}/install-confirmations"
              payload: {}
              as: FieldTechnician
            - call: "POST /meters/${mt52b_id}/install-confirmations"
              payload: {}
              as: FieldTechnician
            - call: "POST /meters/${mt52c_id}/install-confirmations"
              payload: {}
              as: FieldTechnician
            - call: "POST /meters/${mt52d_id}/install-confirmations"
              payload: {}
              as: FieldTechnician
          trigger:
            - call: "POST /households/${h52a_id}/enumerations"
              payload: { roster_persons_count: 2, tv_sets_count: 1 }
              as: FieldTechnician
            - call: "POST /households/${h52b_id}/enumerations"
              payload: { roster_persons_count: 2, tv_sets_count: 1 }
              as: FieldTechnician
            - call: "POST /households/${h52c_id}/enumerations"
              payload: { roster_persons_count: 2, tv_sets_count: 1 }
              as: FieldTechnician
            - call: "GET /quota-cells/${c52_id}"
              payload: {}
              as: PanelOperationsManager
            - call: "GET /markets/${m52_id}"
              payload: {}
              as: PanelOperationsManager
            - call: "POST /households/${h52d_id}/enumerations"
              payload: { roster_persons_count: 2, tv_sets_count: 1 }
              as: FieldTechnician
            - call: "GET /quota-cells/${c52_id}"
              payload: {}
              as: PanelOperationsManager
            - call: "GET /markets/${m52_id}"
              payload: {}
              as: PanelOperationsManager
            - call: "POST /households"
              payload: { market_id: "${m52_id}", quota_cell_id: "${c52_id}", recruitment_source: "RDD_PHONE", persons_count: 1 }
              as: PanelOperationsManager
          assert:
            - "Trigger call 4: data.intab_count == 3, data.fill_rate == 0.6000, data.quota_status == UNDER_TARGET, data.incentive_boost_active == true, data.effective_incentive_multiplier == 1.25 - 0.6000 is below the 0.8000 threshold"
            - "Trigger call 5: data.incentive_budget_reserved_cents == 1250, data.under_target_cell_count == 1, data.filled_cell_count == 0, data.recruitment_posture == OPEN (clause 4)"
            - "Trigger call 6: HTTP 200 with data.status == ACTIVE"
            - "Trigger call 7: data.intab_count == 4, data.fill_rate == 0.8000 == ON_TARGET_THRESHOLD exactly, data.quota_status == ON_TARGET, data.incentive_boost_active == false and data.effective_incentive_multiplier == 1.00 - the boost disarms at the boundary, it does not wait for FILLED"
            - "Trigger call 8: data.incentive_budget_reserved_cents == 0 (the same round_half_up(1000 * 0.25 * 5, 0) == 1250 released), data.under_target_cell_count == 0, data.filled_cell_count == 0, data.quota_cell_count == 1, so clause 2 fails and clause 3 fires: data.recruitment_posture == RESTRICTED with data.posture_changed_at == 2026-08-01T00:00:00Z"
            - "Trigger call 9: HTTP 201 - RESTRICTED is not CLOSED and not FROZEN, so priority 10 does not fire and the cell is not FILLED either, so priority 12 does not fire; recruitment into a RESTRICTED market is legal"

      - name: fill_rate_rounds_half_up_to_four_decimal_places
        claim_type: precision
        grounds:
          - calculations.quota_cell_fill.precision
        distinguishing_aspect: "A target of 3 makes the fill rate non-terminating: 1/3 must be stored as 0.3333 and 2/3 as 0.6667, which is the only place the round_half_up direction of the fill rate is observable."
        test_recipe:
          setup:
            - "CHAIN A with CODE DMA-653, RANK 153, T 3, B 1000, BUDGET 500000; two households h1 and h2, persons_count 2 each, with TV_TUNERs MT-002057 and MT-002058 install-confirmed, both ENUM_PENDING."
          setup_api_calls:
            - call: "POST /markets"
              payload: { name: "Metro Thirds", market_code: "DMA-653", dma_rank: 153, incentive_budget_cents: 500000 }
              as: PanelOperationsManager
