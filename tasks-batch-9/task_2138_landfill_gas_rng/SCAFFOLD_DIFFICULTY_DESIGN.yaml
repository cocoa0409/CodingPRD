  - rule_id: resource_temporal_overlap
    instances:
      - name: work_order_buffered_closed_window_collision_on_well
        grounds:
          - calculations.work_order_lockout_occupancy
          - entities.WorkOrder.fields.lockout_buffer_minutes
          - errors[ERR_WELL_LOCKOUT_CONFLICT]
        distinguishing_aspect: |
          Interval semantics A - CLOSED intervals inflated by a 120-minute purge buffer at each
          end, with EXCLUSIVE occupancy of a GasWell. A new window starting at 16:00 (buffered
          start 14:00) collides with an incumbent ending at 12:00 (buffered end 14:00) because
          closed intervals that merely touch at one instant intersect; moving the start one
          minute later to 16:01 clears it.
        test_recipe:
          setup:
            - "Logical clock at 2026-08-10T00:00:00Z."
            - "One LandfillSite and one GasWell W-01 in ONLINE."
            - "One PLANNED WorkOrder on W-01 with window 2026-08-12T08:00:00Z to 2026-08-12T12:00:00Z (buffered occupancy [2026-08-12T06:00:00Z, 2026-08-12T14:00:00Z])."
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-08-10T00:00:00Z" }
              as: ProjectAdmin
            - call: "POST /sites"
              payload: { name: "Rolling Hills Landfill", state_code: "CA", host_royalty_pct: 0.12, royalty_variant: "GROSS_REVENUE_SHARE", permit_nmoc_limit_lb_per_hr: 3.5 }
              as: ProjectAdmin
              captures: { site_id: $.data.id }
            - call: "POST /wells"
              payload: { site_id: "${site_id}", well_code: "W-01", target_flow_scfm: 500.0 }
              as: ProjectAdmin
              captures: { w1_id: $.data.id }
            - call: "POST /work-orders"
              payload: { well_id: "${w1_id}", work_type: "WELL_RETUNE", window_start: "2026-08-12T08:00:00Z", window_end: "2026-08-12T12:00:00Z" }
              as: WellfieldTechnician
              captures: { wo1_id: $.data.id }
          trigger:
            - call: "POST /work-orders"
              payload: { well_id: "${w1_id}", work_type: "SUMP_PUMP_SERVICE", window_start: "2026-08-12T16:00:00Z", window_end: "2026-08-12T18:00:00Z" }
              as: WellfieldTechnician
              captures: { err_id: $.data.error_id }
            - call: "POST /work-orders"
              payload: { well_id: "${w1_id}", work_type: "SUMP_PUMP_SERVICE", window_start: "2026-08-12T16:01:00Z", window_end: "2026-08-12T18:00:00Z" }
              as: WellfieldTechnician
              captures: { wo2_id: $.data.id }
          assert:
            - "The 16:00 request returns HTTP 409 with data.error_id == 'ERR_WELL_LOCKOUT_CONFLICT'"
            - "The 16:01 request returns HTTP 201 and WorkOrder.${wo2_id}.status == PLANNED"
            - "WorkOrder.${wo2_id}.lockout_buffer_minutes == 120"
            - "GET /work-orders?well_id=${w1_id} returns total_count == 2"

      - name: nomination_half_open_windows_pool_receipt_point_capacity
        grounds:
          - calculations.receipt_point_headroom
          - entities.PipelineNomination.fields.hourly_rate_dth
          - entities.ProcessingPlant.fields.receipt_point_mdq_dth_per_day
          - errors[ERR_RECEIPT_POINT_CAPACITY_EXCEEDED]
        distinguishing_aspect: |
          Interval semantics B, and a different resource entity - HALF-OPEN [start, end) windows
          on a ProcessingPlant receipt point with POOLED aggregate capacity rather than exclusive
          occupancy. Two 2400-dth nominations on the same gas day coexist because 100 + 100
          exactly equals the 200 dth/hour cap (inclusive), a third one of any size is rejected,
          and a nomination on the adjacent gas day starting exactly when the first ends does not
          intersect at all.
        test_recipe:
          setup:
            - "One LandfillSite, one ProcessingPlant with receipt_point_mdq_dth_per_day 4800.0 (a 200.0 dth/hour cap), and one ACTIVE OfftakeContract with contract_mdq_dth_per_day 3000.0 running 2026-08-01 to 2027-08-01."
            - "No nomination exists yet."
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-08-10T00:00:00Z" }
              as: ProjectAdmin
            - call: "POST /sites"
              payload: { name: "Rolling Hills Landfill", state_code: "CA", host_royalty_pct: 0.12, royalty_variant: "GROSS_REVENUE_SHARE", permit_nmoc_limit_lb_per_hr: 3.5 }
              as: ProjectAdmin
              captures: { site_id: $.data.id }
            - call: "POST /plants"
              payload: { site_id: "${site_id}", plant_code: "P1", receipt_point_code: "RP-7", receipt_point_mdq_dth_per_day: 4800.0, min_feed_scfm: 900.0 }
              as: ProjectAdmin
              captures: { plant_id: $.data.id }
            - call: "POST /offtake-contracts"
              payload: { site_id: "${site_id}", counterparty_name: "Bluewater Energy", contract_mdq_dth_per_day: 3000.0, price_usd_per_dth: 5.25, term_start: "2026-08-01T00:00:00Z", term_end: "2027-08-01T00:00:00Z" }
              as: CommercialScheduler
              captures: { contract_id: $.data.id }
            - call: "POST /offtake-contracts/${contract_id}/status"
              payload: { to_status: "ACTIVE" }
              as: CommercialScheduler
              captures: { ctr_v1: $.data.version }
          trigger:
            - call: "POST /pipeline-nominations"
              payload: { contract_id: "${contract_id}", plant_id: "${plant_id}", gas_day_start: "2026-08-11T00:00:00Z", gas_day_end: "2026-08-12T00:00:00Z", nominated_dth: 2400.0, expected_contract_version: "${ctr_v1}" }
              as: CommercialScheduler
              captures: { n1_id: $.data.id }
            - call: "GET /offtake-contracts/${contract_id}"
              as: CommercialScheduler
              captures: { ctr_v2: $.data.version }
            - call: "POST /pipeline-nominations"
              payload: { contract_id: "${contract_id}", plant_id: "${plant_id}", gas_day_start: "2026-08-11T00:00:00Z", gas_day_end: "2026-08-12T00:00:00Z", nominated_dth: 2400.0, expected_contract_version: "${ctr_v2}" }
              as: CommercialScheduler
              captures: { n2_id: $.data.id }
            - call: "GET /offtake-contracts/${contract_id}"
              as: CommercialScheduler
              captures: { ctr_v3: $.data.version }
            - call: "POST /pipeline-nominations"
              payload: { contract_id: "${contract_id}", plant_id: "${plant_id}", gas_day_start: "2026-08-11T00:00:00Z", gas_day_end: "2026-08-12T00:00:00Z", nominated_dth: 24.0, expected_contract_version: "${ctr_v3}" }
              as: CommercialScheduler
              captures: { err_id: $.data.error_id }
            - call: "POST /pipeline-nominations"
              payload: { contract_id: "${contract_id}", plant_id: "${plant_id}", gas_day_start: "2026-08-12T00:00:00Z", gas_day_end: "2026-08-13T00:00:00Z", nominated_dth: 2400.0, expected_contract_version: "${ctr_v3}" }
              as: CommercialScheduler
              captures: { n4_id: $.data.id }
          assert:
            - "PipelineNomination.${n1_id}.hourly_rate_dth == 100.0 and status == DRAFT"
            - "PipelineNomination.${n2_id}.hourly_rate_dth == 100.0 - accepted because 100.0 + 100.0 lands exactly on the 200.0 dth/hour cap"
            - "The 24.0 dth request returns HTTP 409 with data.error_id == 'ERR_RECEIPT_POINT_CAPACITY_EXCEEDED'"
            - "PipelineNomination.${n4_id}.hourly_rate_dth == 100.0 and status == DRAFT - the 2026-08-12 window does not intersect the half-open [2026-08-11T00:00:00Z, 2026-08-12T00:00:00Z) window"
            - "GET /pipeline-nominations?plant_id=${plant_id} returns total_count == 3"

  - rule_id: compensating_invariant
    instances:
      - name: rin_count_ledger_conserved_across_generation_and_reversal
        grounds:
          - calculations.rin_ledger_invariant
          - state_machines.AttributeBatch.PENDING_to_GENERATED
          - state_machines.AttributeBatch.GENERATED_to_REVERSED
          - entities.LandfillSite.fields.rin_generated_total
          - entities.LandfillSite.fields.rin_available_count
          - entities.LandfillSite.fields.rin_reversed_count
        distinguishing_aspect: |
          Conserved quantity A - the integer count of D3 RINs. Generation credits
          rin_generated_total and rin_available_count by 3988; the compensating reversal moves
          exactly those 3988 from rin_available_count into rin_reversed_count and leaves
          rin_generated_total untouched, so
          rin_generated_total == rin_available_count + rin_retired_count + rin_reversed_count
          holds identically (3988 == 0 + 0 + 3988) before and after.
        test_recipe:
          setup:
            - "Producing site with one InjectionBatch of gross_mmbtu 340.14 in status INJECTED and a plant availability_factor_pct of 100.00."
            - "All four LandfillSite RIN counters are 0."
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-08-10T00:00:00Z" }
              as: ProjectAdmin
            - call: "POST /sites"
              payload: { name: "Rolling Hills Landfill", state_code: "CA", host_royalty_pct: 0.12, royalty_variant: "GROSS_REVENUE_SHARE", permit_nmoc_limit_lb_per_hr: 3.5 }
