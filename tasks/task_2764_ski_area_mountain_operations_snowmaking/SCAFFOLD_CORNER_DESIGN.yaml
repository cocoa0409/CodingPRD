          staffed_operator_count is a derived count over ASSIGNED rows, so releasing an assignment on a
          STANDBY lift silently drops the lift below its own required_operator_count without changing any
          lift state. The rejected OPEN transition must therefore be attributed to priority 37 rather than
          to the lift state machine, and re-staffing the vacated role must cure it - which also proves the
          released row stopped counting instead of merely being flagged.
