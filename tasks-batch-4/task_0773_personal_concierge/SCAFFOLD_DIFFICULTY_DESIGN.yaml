          assert:
            - "HTTP 409"
            - "response error_id == ERR_MEMBERSHIP_NOT_ACTIVE"

      - name: engagement_confirm_requires_vendor_active
        grounds:
          - validations[priority=16]
          - entities.Vendor.fields.status
          - state_machines.Vendor.ACTIVE_to_SUSPENDED
        distinguishing_aspect: |
          VendorEngagement confirm is gated by Vendor.status: an engagement whose vendor was
          suspended after creation rejects confirm with ERR_VENDOR_INACTIVE. Entity pair:
