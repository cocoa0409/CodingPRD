  - rule_id: non_linear_state_machine
    instances:
      - name: application_tentative_approval_reopen_cycle
        grounds:
          - state_machines.GenericApplication.RECEIVED_to_TENTATIVE_APPROVAL
          - state_machines.GenericApplication.TENTATIVE_APPROVAL_to_RECEIVED
          - state_machines.GenericApplication.TENTATIVE_APPROVAL_to_APPROVED
