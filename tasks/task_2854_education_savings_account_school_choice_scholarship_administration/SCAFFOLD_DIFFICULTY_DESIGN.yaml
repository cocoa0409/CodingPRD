  - rule_id: compensating_invariant
    instances:
      - name: overturned_clawback_appeal_restores_the_account_money_identity
        grounds:
          - state_machines.MisuseCase.UNDER_APPEAL_to_REVERSED
          - state_machines.Appeal.FILED_to_OVERTURNED
          - entities.ClawbackEntry.fields.entry_type
          - entities.Account.fields.lifetime_clawed_back_cents
          - calculations.clawback_assessment
        distinguishing_aspect: |
          The compensation must restore an identity, not merely flip a status: after the 180000
          debit and its reversal, balance_cents + lifetime_spent_cents + lifetime_clawed_back_cents
          + lifetime_admin_fee_cents must equal lifetime_disbursed_cents (233168) again, the
          REVERSAL entry must be appended rather than the ACCOUNT_DEBIT row mutated or deleted, and
          lifetime_clawed_back_cents must return to 0 with no 1-cent drift.
        test_recipe:
          setup:
            - "ProgramYear 2026-27 is ACTIVE with current_quarter 1; the quarter-1 run credited net 229088 with a 4080 admin fee, so lifetime_disbursed_cents is 233168."
            - "MisuseCase MC1 (FALSIFIED_ENROLLMENT, disallowed_principal_cents 150000) was reviewed, SUBSTANTIATED by co-1 (suspending ACCT1) and its clawback issued: rate 0.20, penalty 30000, total 180000, debit 180000, receivable 0, leaving balance_cents 49088."
            - "The guardian filed Appeal AP2 with subject_type CLAWBACK naming MC1, moving MC1 to UNDER_APPEAL."
          setup_api_calls:
            - call: "POST /esa/program-years"
              payload: { label: "2026-27", residency_state: "TX", total_seats: 2, window_open_at: "2026-08-15T00:00:00Z", window_close_at: "2026-09-30T23:59:59Z", term_start_date: "2026-08-01", term_end_date: "2027-06-30", base_award_cents: 731500, rollover_cap_pct: 0.25, admin_fee_pct: 0.0175, acceptance_deadline_days: 14, min_assessment_percentile: 40, min_portfolio_artifacts: 6 }
              as: ProgramAdmin
              captures: { py_id: $.data.id }
            - call: "POST /esa/program-years/${py_id}/open-window"
              payload: {}
              as: ProgramAdmin
            - call: "POST /esa/students"
              payload: { household_id: "HH-1", first_name: "Ana", last_name: "Reyes", date_of_birth: "2014-04-02", residency_state: "TX", prior_enrollment: "PUBLIC_SCHOOL_FULL_YEAR", income_band: "BAND_B", category_flags: ["DISABILITY_IEP", "PRIOR_PUBLIC_SCHOOL"], has_enrolled_sibling: false }
              as: ProgramAdmin
              captures: { s1_id: $.data.id }
            - call: "POST /esa/_clock/set_current_utc"
              payload: { to_iso8601: "2026-09-01T00:00:00Z" }
              as: ProgramAdmin
            - call: "POST /esa/applications"
              payload: { program_year_id: "${py_id}", student_id: "${s1_id}", claimed_income_band: "BAND_B", claimed_category_flags: ["DISABILITY_IEP", "PRIOR_PUBLIC_SCHOOL"] }
              as: Guardian
              as_user_id: "${s1_id}"
              captures: { a1_id: $.data.id }
            - call: "POST /esa/applications/${a1_id}/submit"
              payload: {}
              as: Guardian
              as_user_id: "${s1_id}"
            - call: "POST /esa/applications/${a1_id}/eligibility-determinations"
              payload: { residency_check: "PASS", prior_enrollment_check: "PASS", verified_income_band: "BAND_B", verified_prior_enrollment: "PUBLIC_SCHOOL_FULL_YEAR", verified_category_flags: ["DISABILITY_IEP"] }
              as: EligibilityOfficer
              as_user_id: "eo-1"
            - call: "POST /esa/program-years/${py_id}/awarding-runs"
              payload: {}
              as: ProgramAdmin
            - call: "POST /esa/applications/${a1_id}/accept-award"
              payload: {}
              as: Guardian
              as_user_id: "${s1_id}"
              captures: { acct1_id: $.data.account_id }
            - call: "POST /esa/program-years/${py_id}/disbursement-runs"
              payload: { quarter: 1 }
              as: ProgramAdmin
            - call: "POST /esa/misuse-cases"
              payload: { account_id: "${acct1_id}", detection_rule: "FALSIFIED_ENROLLMENT", disallowed_principal_cents: 150000, narrative: "Enrollment letter did not match the school roster." }
              as: ComplianceOfficer
              as_user_id: "co-1"
              captures: { mc1_id: $.data.id }
            - call: "POST /esa/misuse-cases/${mc1_id}/review"
              payload: {}
              as: ComplianceOfficer
              as_user_id: "co-1"
            - call: "POST /esa/misuse-cases/${mc1_id}/adjudication"
              payload: { outcome: "SUBSTANTIATED", rationale: "Roster mismatch unexplained after two notices." }
              as: ComplianceOfficer
              as_user_id: "co-1"
            - call: "POST /esa/misuse-cases/${mc1_id}/clawbacks"
              payload: {}
              as: ComplianceOfficer
              as_user_id: "co-1"
              captures: { cb_total: $.data.clawback_total_cents, cb_balance: $.data.account_balance_cents }
            - call: "POST /esa/appeals"
              payload: { subject_type: "CLAWBACK", misuse_case_id: "${mc1_id}", grounds: "The school has since issued a corrected enrollment letter." }
              as: Guardian
              as_user_id: "${s1_id}"
              captures: { ap2_id: $.data.id }
          trigger:
            - call: "POST /esa/appeals/${ap2_id}/decision"
              payload: { decision: "OVERTURNED", rationale: "Corrected enrollment letter verified with the registrar." }
              as: AppealsOfficer
              as_user_id: "ao-1"
          assert:
            - "before the trigger: clawback_total_cents == 180000, account_debit_cents == 180000, receivable_cents == 0 and Account.${acct1_id}.balance_cents == 49088"
            - "Appeal.${ap2_id}.status == OVERTURNED"
            - "MisuseCase.${mc1_id}.status == REVERSED with clawback_total_cents 180000 still recorded on the case"
            - "GET /esa/misuse-cases/${mc1_id}/clawback-entries returns exactly 2 rows: ACCOUNT_DEBIT 180000 then REVERSAL 180000 (append-only, nothing deleted)"
            - "Account.${acct1_id}.balance_cents == 229088 (the pre-clawback balance, restored exactly)"
            - "Account.${acct1_id}.lifetime_clawed_back_cents == 0 and receivable side is cleared"
            - "Account.${acct1_id}.status == ACTIVE with suspension_reason null"
            - "identity restored: balance_cents 229088 + lifetime_spent_cents 0 + lifetime_clawed_back_cents 0 + lifetime_admin_fee_cents 4080 == lifetime_disbursed_cents 233168"

      - name: seat_identity_holds_across_withdrawal_and_waitlist_promotion
        grounds:
          - state_machines.Application.ACCEPTED_to_WITHDRAWN
          - state_machines.Application.WAITLISTED_to_AWARD_OFFERED
          - state_machines.Account.ACTIVE_to_CLOSED
          - entities.ProgramYear.fields.seats_committed
          - entities.ProgramYear.fields.seats_available
          - calculations.priority_score_and_rank
        distinguishing_aspect: |
          A seat-count invariant rather than a money one, and the compensation is immediately
          re-consumed inside the same request: the withdrawal releases the only seat and the
          waitlist promotion takes it back, so seats_committed + seats_available == total_seats == 1
          must hold before, during and after - an implementation that decrements without promoting,
          or promotes without freeing, breaks the identity even though every individual status
          looks plausible.
        test_recipe:
          setup:
            - "ProgramYear 2026-27 has total_seats 1 and is WINDOW_OPEN; the clock reads 2026-09-01."
            - "Student S1 (TX, PUBLIC_SCHOOL_FULL_YEAR) is verified BAND_A + [DISABILITY_IEP], so tier 3 with priority_score 140; Student S2 (TX, PRIVATE_SCHOOL) is verified BAND_B with no flags, so tier 5 with priority_score 60."
            - "The awarding run gave the single seat to A1 (AWARD_OFFERED, then ACCEPTED with an Account) and put A2 at waitlist_position 1."
          setup_api_calls:
            - call: "POST /esa/program-years"
              payload: { label: "2026-27", residency_state: "TX", total_seats: 1, window_open_at: "2026-08-15T00:00:00Z", window_close_at: "2026-09-30T23:59:59Z", term_start_date: "2026-08-01", term_end_date: "2027-06-30", base_award_cents: 731500, rollover_cap_pct: 0.25, admin_fee_pct: 0.0175, acceptance_deadline_days: 14, min_assessment_percentile: 40, min_portfolio_artifacts: 6 }
              as: ProgramAdmin
              captures: { py_id: $.data.id }
            - call: "POST /esa/program-years/${py_id}/open-window"
              payload: {}
              as: ProgramAdmin
            - call: "POST /esa/students"
