      - name: foreign_key_payloads_resolve_the_referenced_entity_before_any_business_rule
        claim_type: Error Triggerability
        grounds:
          - errors.ERR_OWNER_NOT_FOUND
          - errors.ERR_INSPECTOR_NOT_FOUND
          - errors.ERR_REDEMPTION_PERIOD_NOT_FOUND
          - errors.ERR_DEPLOYMENT_NOT_FOUND
          - errors.ERR_EQUIPMENT_ORDER_NOT_FOUND
          - errors.ERR_STORE_VISIT_NOT_FOUND
          - errors.ERR_POS_TRANSACTION_NOT_FOUND
          - errors.ERR_INVESTIGATION_NOT_FOUND
        distinguishing_aspect: "The same 404 family is reachable from writes, both through body foreign keys and through nested action path ids: a store create naming a phantom owner, a visit create naming a phantom inspector, an investigation naming a phantom trigger period, and four action routes on phantom parents all fail at resolution - before the criterion, capacity, interval or state checks those same requests would otherwise hit."
        test_recipe:
          setup:
            - "One owner and one store (the store exists, so failures below are attributable to the phantom reference alone)."
          setup_api_calls:
            - *k_owner
            - *k_store
          trigger:
            - call: "POST /stores"
              payload: { owner_id: "00000000-0000-4000-8000-0000000000e1", store_name: "Phantom Owner Mart", state_code: "TX", store_type: "GROCERY", checkout_lane_count: 3, staple_shelf_linear_feet: 80, annual_gross_sales_cents: 50000000, annual_staple_sales_cents: 30000000, max_terminal_slots: 2 }
              as: FnsAdmin
              as_user_id: "fns-admin-1"
              captures: { fk_owner: $.data.error_id }
            - call: "POST /store-visits"
              payload: { application_id: "00000000-0000-4000-8000-0000000000e2", inspector_id: "00000000-0000-4000-8000-0000000000e3", visit_type: "PRE_AUTHORIZATION", window_start: "2026-08-01T02:00:00Z", window_end: "2026-08-01T03:00:00Z" }
              as: FnsAnalyst
              as_user_id: "fns-analyst-1"
              captures: { fk_app_or_inspector: $.data.error_id }
            - call: "POST /investigations"
              payload: { store_id: "${store_id}", opened_reason: "REDEMPTION_ANOMALY", trigger_period_id: "00000000-0000-4000-8000-0000000000e4" }
              as: FnsAnalyst
              as_user_id: "fns-analyst-1"
              captures: { fk_period: $.data.error_id }
            - call: "POST /terminal-deployments/00000000-0000-4000-8000-0000000000e5/activate"
              payload: {}
              as: FnsAdmin
              as_user_id: "fns-admin-1"
              captures: { fk_deploy: $.data.error_id }
            - call: "POST /equipment-orders/00000000-0000-4000-8000-0000000000e6/place"
              payload: {}
              as: FnsAdmin
              as_user_id: "fns-admin-1"
              captures: { fk_order: $.data.error_id }
            - call: "POST /store-visits/00000000-0000-4000-8000-0000000000e7/start"
              payload: {}
              as: FnsAdmin
              as_user_id: "fns-admin-1"
              captures: { fk_visit: $.data.error_id }
            - call: "POST /pos-transactions/00000000-0000-4000-8000-0000000000e8/void"
              payload: { void_reason_code: "CLERK_ERROR" }
              as: FnsAdmin
              as_user_id: "fns-admin-1"
              captures: { fk_txn: $.data.error_id }
            - call: "POST /investigations/00000000-0000-4000-8000-0000000000e9/evidence"
              payload: { evidence_type: "HOUSEHOLD_INTERVIEW", observed_at: "2026-07-30T00:00:00Z" }
              as: FnsAnalyst
              as_user_id: "fns-analyst-1"
              captures: { fk_inv: $.data.error_id }
          assert:
            - "every response is 404"
            - "${fk_owner} == ERR_OWNER_NOT_FOUND (not ERR_INVALID_REQUEST)"
            - "${fk_app_or_inspector} is ERR_APPLICATION_NOT_FOUND or ERR_INSPECTOR_NOT_FOUND, never ERR_INSPECTOR_DAILY_LIMIT_EXCEEDED or ERR_INVALID_STATE"
            - "${fk_period} == ERR_REDEMPTION_PERIOD_NOT_FOUND, not ERR_TRIGGER_PERIOD_NOT_FLAGGED"
            - "${fk_deploy} == ERR_DEPLOYMENT_NOT_FOUND and ${fk_order} == ERR_EQUIPMENT_ORDER_NOT_FOUND"
            - "${fk_visit} == ERR_STORE_VISIT_NOT_FOUND and ${fk_txn} == ERR_POS_TRANSACTION_NOT_FOUND"
            - "${fk_inv} == ERR_INVESTIGATION_NOT_FOUND"
            - "no rows were created: GET /stores?owner_id=${owner_id} still returns total_count == 1"

      - name: malformed_requests_are_rejected_with_invalid_request_and_write_nothing
        claim_type: Error Triggerability
        grounds:
          - errors.ERR_INVALID_REQUEST
          - response_envelope.pagination_defaults
        distinguishing_aspect: "ERR_INVALID_REQUEST is the shape-level code and stays out of the business codes' territory: a negative quantity, an unknown item_class enum, a limit above the declared max of 100 and a negative penalty payment are all 400s, and specifically NOT ERR_NO_ELIGIBLE_ITEMS or ERR_CMP_OVERPAYMENT."
