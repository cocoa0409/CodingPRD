            - { call: "POST /sales-planning/reps", payload: { full_name: "R1", email: "r1@x.com", hire_date: "2025-01-05" }, as: SalesOpsAdmin, captures: { r1: $.data.id } }
            - { call: "POST /sales-planning/reps", payload: { full_name: "R2", email: "r2@x.com", hire_date: "2025-01-05" }, as: SalesOpsAdmin, captures: { r2: $.data.id } }
          trigger:
            - { call: "GET /sales-planning/plan-years/${plan}/coverage-report", as: SalesOpsAdmin }
            - { call: "POST /sales-planning/rep-assignments", payload: { plan_year_id: "${plan}", rep_id: "${r1}", territory_id: "${t}", effective_from: "2027-01-01" }, as: SalesOpsAdmin }
            - { call: "GET /sales-planning/plan-years/${plan}/coverage-report", as: SalesOpsAdmin }
            - { call: "POST /sales-planning/rep-assignments", payload: { plan_year_id: "${plan}", rep_id: "${r2}", territory_id: "${t}", effective_from: "2027-01-01" }, as: SalesOpsAdmin }
            - { call: "GET /sales-planning/plan-years/${plan}/coverage-report", as: SalesOpsAdmin }
          assert:
            - "0 reps: row ${t} coverage_status == GAP, active_rep_count == 0, staffing_gap == 2"
            - "1 rep: coverage_status == UNDERSTAFFED, staffing_gap == 1"
            - "2 reps: coverage_status == COVERED, staffing_gap == 0 (active_rep_count == required_headcount satisfies the >= rule)"

      - name: reconciliation_policy_variants
        claim_type: variant_divergence
        grounds: ["calculations.reconciliation_final"]
        excluded_because:
          difficulty_instance: reconciliation_blended_vs_top_down_wins
          rationale: "Both policy variants with identical inputs are asserted in the named §1.8 instance."

      - name: credit_transition_policy_variants
        claim_type: variant_divergence
        grounds: ["calculations.credit_transition_transfer"]
        excluded_because:
          difficulty_instance: credit_transition_day_proration_vs_month_snapshot
          rationale: "PRORATE_BY_DAY vs MONTH_SNAPSHOT divergence is asserted in the named §1.8 instance."

  - section: validations
    instances:
      - name: missing_auth_header_returns_400
        claim_type: violation_to_error
        grounds: ["validations[priority=1]", "errors[ERR_MISSING_OR_INVALID_USER_CONTEXT_HEADER]"]
        distinguishing_aspect: "A request without X-User-ID / X-User-Role headers is rejected before any role, existence or business check."
        test_recipe:
          setup: ["Empty database"]
          setup_api_calls: []
          trigger:
            - { call: "GET /sales-planning/plan-years", as: SalesOpsAdmin, captures: { err: $.data.error_id } }
          assert:
            - "The request is sent with both auth headers omitted; ${err} == ERR_MISSING_OR_INVALID_USER_CONTEXT_HEADER (HTTP 400)"

      - name: cross_plan_assignment_reference_rejected
        claim_type: violation_to_error
        grounds: ["validations[priority=5]", "errors[ERR_CROSS_PLAN_REFERENCE]"]
        distinguishing_aspect: "A rep-assignment naming plan A's plan_year_id with a territory from plan B violates cross-plan integrity."
        test_recipe:
          setup: ["Plan A OPEN with ACTIVE TA; plan B (2028) with ACTIVE TB; rep R"]
          setup_api_calls:
            - { call: "POST /sales-planning/plan-years", payload: { label: "A", start_date: "2027-01-01", end_date: "2027-12-31", company_target_cents: 100000, productivity_per_rep_cents: 1000000, lock_date: "2027-01-15" }, as: SalesOpsAdmin, captures: { pa: $.data.id } }
            - { call: "POST /sales-planning/territories", payload: { plan_year_id: "${pa}", name: "TA", potential_cents: 100, headcount_capacity: 2 }, as: SalesOpsAdmin, captures: { ta: $.data.id } }
            - { call: "POST /sales-planning/territories/${ta}/activate", as: SalesOpsAdmin }
            - { call: "POST /sales-planning/plan-years", payload: { label: "B", start_date: "2028-01-01", end_date: "2028-12-31", company_target_cents: 100000, productivity_per_rep_cents: 1000000, lock_date: "2028-01-15" }, as: SalesOpsAdmin, captures: { pb: $.data.id } }
            - { call: "POST /sales-planning/territories", payload: { plan_year_id: "${pb}", name: "TB", potential_cents: 100, headcount_capacity: 2 }, as: SalesOpsAdmin, captures: { tb: $.data.id } }
            - { call: "POST /sales-planning/territories/${tb}/activate", as: SalesOpsAdmin }
            - { call: "POST /sales-planning/reps", payload: { full_name: "R", email: "r@x.com", hire_date: "2025-01-05" }, as: SalesOpsAdmin, captures: { rep: $.data.id } }
          trigger:
            - { call: "POST /sales-planning/rep-assignments", payload: { plan_year_id: "${pa}", rep_id: "${rep}", territory_id: "${tb}", effective_from: "2027-01-01" }, as: SalesOpsAdmin, captures: { err: $.data.error_id } }
          assert:
            - "${err} == ERR_CROSS_PLAN_REFERENCE (HTTP 409)"

      - name: allocation_create_requires_open_plan_rejected
        claim_type: violation_to_error
        grounds: ["validations[priority=4]", "errors[ERR_PLAN_NOT_OPEN]"]
        distinguishing_aspect: "Allocation creation against a DRAFT plan (not LOCKED) yields ERR_PLAN_NOT_OPEN."
        test_recipe:
          setup: ["Plan DRAFT with ACTIVE territory T"]
          setup_api_calls:
            - { call: "POST /sales-planning/plan-years", payload: { label: "FY27", start_date: "2027-01-01", end_date: "2027-12-31", company_target_cents: 100000, productivity_per_rep_cents: 1000000, lock_date: "2027-01-15" }, as: SalesOpsAdmin, captures: { plan: $.data.id } }
            - { call: "POST /sales-planning/territories", payload: { plan_year_id: "${plan}", name: "T", potential_cents: 100, headcount_capacity: 2 }, as: SalesOpsAdmin, captures: { t: $.data.id } }
            - { call: "POST /sales-planning/territories/${t}/activate", as: SalesOpsAdmin }
          trigger:
            - { call: "POST /sales-planning/allocations", payload: { plan_year_id: "${plan}", scope_territory_id: "${t}", pool_cents: 100000 }, as: SalesOpsAdmin, captures: { err: $.data.error_id } }
          assert:
            - "${err} == ERR_PLAN_NOT_OPEN (HTTP 409)"

      - name: territory_reparent_cycle_rejected
        claim_type: violation_to_error
        grounds: ["validations[priority=7]", "errors[ERR_TERRITORY_CYCLE]"]
        distinguishing_aspect: "Re-parenting A under its own child B is detected by walking the ancestor chain and rejected."
        test_recipe:
          setup: ["Plan DRAFT; territory A (root) with child B"]
          setup_api_calls:
            - { call: "POST /sales-planning/plan-years", payload: { label: "FY27", start_date: "2027-01-01", end_date: "2027-12-31", company_target_cents: 100000, productivity_per_rep_cents: 1000000, lock_date: "2027-01-15" }, as: SalesOpsAdmin, captures: { plan: $.data.id } }
            - { call: "POST /sales-planning/territories", payload: { plan_year_id: "${plan}", name: "A", potential_cents: 100, headcount_capacity: 2 }, as: SalesOpsAdmin, captures: { a: $.data.id } }
            - { call: "POST /sales-planning/territories", payload: { plan_year_id: "${plan}", name: "B", potential_cents: 100, headcount_capacity: 2, parent_territory_id: "${a}" }, as: SalesOpsAdmin, captures: { b: $.data.id } }
          trigger:
            - { call: "PATCH /sales-planning/territories/${a}", payload: { parent_territory_id: "${b}" }, as: SalesOpsAdmin, captures: { err: $.data.error_id } }
          assert:
            - "${err} == ERR_TERRITORY_CYCLE (HTTP 409); A remains parentless"

      - name: duplicate_named_rule_rejected
        claim_type: violation_to_error
        grounds: ["validations[priority=7]", "errors[ERR_DUPLICATE_NAMED_RULE]"]
        distinguishing_aspect: "One ACTIVE NAMED_ACCOUNT rule per account per plan; the second create is rejected."
        test_recipe:
          setup: ["Plan OPEN; ACTIVE territories T1, T2; account A"]
          setup_api_calls:
            - { call: "POST /sales-planning/plan-years", payload: { label: "FY27", start_date: "2027-01-01", end_date: "2027-12-31", company_target_cents: 100000, productivity_per_rep_cents: 1000000, lock_date: "2027-01-15" }, as: SalesOpsAdmin, captures: { plan: $.data.id } }
            - { call: "POST /sales-planning/territories", payload: { plan_year_id: "${plan}", name: "T1", potential_cents: 100, headcount_capacity: 2 }, as: SalesOpsAdmin, captures: { t1: $.data.id } }
            - { call: "POST /sales-planning/territories", payload: { plan_year_id: "${plan}", name: "T2", potential_cents: 100, headcount_capacity: 2 }, as: SalesOpsAdmin, captures: { t2: $.data.id } }
            - { call: "POST /sales-planning/accounts", payload: { plan_year_id: "${plan}", name: "A", country_code: "US", segment: "SMB", annual_potential_cents: 50000 }, as: SalesOpsAdmin, captures: { acc: $.data.id } }
            - { call: "POST /sales-planning/assignment-rules", payload: { plan_year_id: "${plan}", rule_type: "NAMED_ACCOUNT", priority: 5, territory_id: "${t1}", named_account_id: "${acc}" }, as: SalesOpsAdmin }
          trigger:
            - { call: "POST /sales-planning/assignment-rules", payload: { plan_year_id: "${plan}", rule_type: "NAMED_ACCOUNT", priority: 1, territory_id: "${t2}", named_account_id: "${acc}" }, as: SalesOpsAdmin, captures: { err: $.data.error_id } }
          assert:
            - "${err} == ERR_DUPLICATE_NAMED_RULE (HTTP 409); lower priority value does not displace the existing ACTIVE named rule"

      - name: duplicate_submission_rejected
        claim_type: violation_to_error
        grounds: ["validations[priority=7]", "errors[ERR_DUPLICATE_SUBMISSION]"]
        distinguishing_aspect: "One SUBMITTED submission per territory; a second concurrent submission (even from the same rep) is rejected until the first is withdrawn."
        test_recipe:
          setup: ["Plan OPEN; T ACTIVE; rep R assigned to T; one SUBMITTED submission exists"]
          setup_api_calls:
            - { call: "POST /sales-planning/plan-years", payload: { label: "FY27", start_date: "2027-01-01", end_date: "2027-12-31", company_target_cents: 100000, productivity_per_rep_cents: 1000000, lock_date: "2027-01-15" }, as: SalesOpsAdmin, captures: { plan: $.data.id } }
            - { call: "POST /sales-planning/territories", payload: { plan_year_id: "${plan}", name: "T", potential_cents: 100, headcount_capacity: 2 }, as: SalesOpsAdmin, captures: { t: $.data.id } }
            - { call: "POST /sales-planning/territories/${t}/activate", as: SalesOpsAdmin }
            - { call: "POST /sales-planning/plan-years/${plan}/open", as: SalesOpsAdmin }
            - { call: "POST /sales-planning/reps", payload: { full_name: "R", email: "r@x.com", hire_date: "2025-01-05" }, as: SalesOpsAdmin, captures: { rep: $.data.id } }
            - { call: "POST /sales-planning/rep-assignments", payload: { plan_year_id: "${plan}", rep_id: "${rep}", territory_id: "${t}", effective_from: "2027-01-01" }, as: SalesOpsAdmin }
            - { call: "POST /sales-planning/submissions", payload: { plan_year_id: "${plan}", territory_id: "${t}", proposed_quota_cents: 90000 }, as: SalesRep, as_user_id: "${rep}", captures: { s1: $.data.id } }
          trigger:
            - { call: "POST /sales-planning/submissions", payload: { plan_year_id: "${plan}", territory_id: "${t}", proposed_quota_cents: 95000 }, as: SalesRep, as_user_id: "${rep}", captures: { err: $.data.error_id } }
            - { call: "POST /sales-planning/submissions/${s1}/withdraw", as: SalesRep, as_user_id: "${rep}" }
            - { call: "POST /sales-planning/submissions", payload: { plan_year_id: "${plan}", territory_id: "${t}", proposed_quota_cents: 95000 }, as: SalesRep, as_user_id: "${rep}", captures: { s2: $.data.id } }
          assert:
            - "Second submission while first SUBMITTED: ${err} == ERR_DUPLICATE_SUBMISSION (HTTP 409)"
            - "After withdrawing the first, the same request succeeds: BottomUpSubmission.${s2}.status == SUBMITTED"

      - name: submission_by_non_member_rejected
        claim_type: violation_to_error
        grounds: ["validations[priority=7]", "errors[ERR_NOT_TERRITORY_MEMBER]"]
        distinguishing_aspect: "A rep without an ACTIVE assignment on the territory cannot submit its bottom-up quota."
