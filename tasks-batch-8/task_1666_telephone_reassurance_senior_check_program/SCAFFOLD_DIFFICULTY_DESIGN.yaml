            - { call: "POST /api/participants/${p_id}/emergency-contacts", payload: { full_name: "KR", phone: "555-9700", relationship: "son", contact_rank: "PRIMARY" }, as: IntakeWorker }
            - { call: "POST /api/participants/${p_id}/submit-review", payload: {}, as: IntakeWorker }
            - { call: "POST /api/participants/${p_id}/approve", payload: {}, as: IntakeWorker }
            - { call: "POST /api/participants/${p_id}/call-schedules", payload: { weekday: "MON", window_start: "09:00", window_end: "11:00" }, as: ProgramCoordinator }
            - { call: "POST /api/volunteers", payload: { full_name: "Vol F", phone: "555-1701" }, as: ProgramCoordinator, captures: { v_id: $.data.id } }
            - { call: "POST /api/volunteers/${v_id}/begin-training", payload: {}, as: ProgramCoordinator }
            - { call: "POST /api/volunteers/${v_id}/training-records", payload: { module: "SAFETY_PROTOCOL", completed_at: "2026-07-01T00:00:00Z", valid_until: "2027-08-01T00:00:00Z" }, as: ProgramCoordinator }
            - { call: "POST /api/volunteers/${v_id}/training-records", payload: { module: "LISTENING_SKILLS", completed_at: "2026-07-01T00:00:00Z", valid_until: "2027-08-01T00:00:00Z" }, as: ProgramCoordinator }
            - { call: "POST /api/volunteers/${v_id}/training-records", payload: { module: "MANDATED_REPORTING", completed_at: "2026-07-01T00:00:00Z", valid_until: "2027-08-01T00:00:00Z" }, as: ProgramCoordinator }
            - { call: "POST /api/volunteers/${v_id}/confidentiality-agreements", payload: { policy_version: "v2026.1", valid_until: "2027-08-01T00:00:00Z" }, as: VolunteerCaller, as_user_id: "${v_id}" }
            - { call: "POST /api/volunteers/${v_id}/certify", payload: {}, as: ProgramCoordinator }
            - { call: "POST /api/volunteers/${v_id}/availability-windows", payload: { weekday: "MON", window_start: "08:00", window_end: "17:00", effective_from: "2026-08-01" }, as: ProgramCoordinator }
            - { call: "POST /api/call-assignments", payload: { participant_id: "${p_id}", volunteer_id: "${v_id}", scheduled_date: "2026-08-03", window_start: "09:00", window_end: "09:30" }, as: ProgramCoordinator, captures: { a_id: $.data.id } }
            - { call: "POST /api/_clock/set_current_utc", payload: { to_iso8601: "2026-08-03T10:00:00Z" }, as: ProgramCoordinator }
            - { call: "POST /api/call-assignments/${a_id}/call-logs", payload: { called_at: "2026-08-03T09:05:00Z", duration_seconds: 420, outcome: "REACHED_CONCERN", concern_level: "ROUTINE", concern_categories: ["NUTRITION"], follow_up_needed: true }, as: VolunteerCaller, as_user_id: "${v_id}", captures: { log_id: $.data.id } }
          trigger:
            - { call: "POST /api/service-referrals", payload: { participant_id: "${p_id}", service_type: "MEALS", priority: "STANDARD", source_call_log_id: "${log_id}" }, as: ProgramCoordinator, captures: { ref_id: $.data.id, st1: $.data.status } }
            - { call: "POST /api/service-referrals/${ref_id}/submit", payload: {}, as: ProgramCoordinator, captures: { st2: $.data.status, due1: $.data.sla_due_at } }
            - { call: "POST /api/service-referrals/${ref_id}/decline", payload: { reason: "provider full" }, as: ProgramCoordinator, captures: { st3: $.data.status } }
            - { call: "POST /api/service-referrals/${ref_id}/revise", payload: {}, as: ProgramCoordinator, captures: { st4: $.data.status, sub4: $.data.submitted_at } }
            - { call: "POST /api/_clock/set_current_utc", payload: { to_iso8601: "2026-08-04T09:00:00Z" }, as: ProgramCoordinator }
            - { call: "POST /api/service-referrals/${ref_id}/submit", payload: {}, as: ProgramCoordinator, captures: { st5: $.data.status, due5: $.data.sla_due_at } }
            - { call: "POST /api/service-referrals/${ref_id}/accept", payload: {}, as: ProgramCoordinator, captures: { st6: $.data.status } }
            - { call: "POST /api/service-referrals/${ref_id}/close", payload: {}, as: QualityReviewer, captures: { st7: $.data.status } }
          assert:
            - "st1 == DRAFT, st2 == SUBMITTED with due1 == 2026-08-06T10:00:00Z (STANDARD 72h from 2026-08-03T10:00:00Z)"
            - "st3 == DECLINED, st4 == DRAFT with sub4 == null (rework loop leg DECLINED -> DRAFT clears submission)"
            - "st5 == SUBMITTED with due5 == 2026-08-07T09:00:00Z (recomputed from the new clock, not restored)"
            - "st6 == ACCEPTED, st7 == CLOSED — full cycle DRAFT -> SUBMITTED -> DECLINED -> DRAFT -> SUBMITTED -> ACCEPTED -> CLOSED"

  # ---------------------------------------------------------------------------
  - rule_id: transitive_cascade
    instances:
      - name: immediate_danger_call_log_cascade
        grounds:
          - state_machines.CallAssignment.SCHEDULED_to_COMPLETED
          - state_machines.EscalationCase
          - state_machines.Participant.ENROLLED_to_WELFARE_HOLD
        distinguishing_aspect: |
          Depth-5 chain from a single POST call-logs trigger (different trigger than
          training_lapse_closeout_cascade): CallLog(IMMEDIATE_DANGER) -> EscalationCase opened at
          STEP_3_WELFARE -> WelfareCheckRequest created (REQUESTED) -> Participant ENROLLED ->
          WELFARE_HOLD -> every future-dated SCHEDULED assignment CANCELLED with cancel_reason
          WELFARE_HOLD. Each link is caused by the previous link, not by the original request.
        test_recipe:
          setup:
            - "Program; participant ENROLLED with MON schedule; certified volunteer"
            - "Assignment A1 on 2026-08-03 (to be logged) and A2 on 2026-08-10 (future, to observe the cancellation hop)"
          setup_api_calls:
            - { call: "POST /api/programs", payload: { name: "AAA", total_capacity: 5, current_policy_version: "v2026.1", max_reserve_slots: 0 }, as: ProgramCoordinator, captures: { prog_id: $.data.id } }
