  # ===========================================================================
  - rule_id: compensating_invariant
    instances:

      - name: grind_run_abort_restores_trim_pounds_with_zero_drift
        grounds:
          - state_machines.GrindRun.IN_PROGRESS_to_ABORTED
          - state_machines.TrimLot.PARTIALLY_COMMITTED_to_AVAILABLE
          - state_machines.TrimLot.FULLY_COMMITTED_to_PARTIALLY_COMMITTED
          - entities.TrimLot.fields.remaining_lb
          - entities.TrimLot.fields.allocated_lb
          - entities.GrindInput.fields.consumed
          - calculations.grind_blend_derivation
        distinguishing_aspect: |
          The conserved quantity is POUNDS across the many-to-many GrindInput junction:
          received_lb == remaining_lb + allocated_lb + consumed_lb + discarded_lb holds before,
          during and after an ABORT, every lot returns to exactly its pre-commitment
          remaining_lb, and none of the COMPLETED branch's cost/label/fill effects leak in. The
          sibling instance conserves CENTS on the purchase cost ledger under a supersede.
        test_recipe:
          setup:
            - "Department 'Meat 41' at default config; clock at 2026-08-05T08:00:00Z; posture SALES_OPEN."
            - "CuttingTest T1 on P1 is APPROVED; its GRIND_TRIM lines are seq 2 (12.0 lb, lean 78.0) and seq 3 (6.5 lb, lean 92.0)."
            - "TrimLot TL-A78 holds received_lb 12.00 (lean 78.0) and TL-B92 holds received_lb 6.50 (lean 92.0); both are AVAILABLE."
            - "GRD80 (GROUND) is PROPOSED so the run may START."
            - "GrindRun GR1 is SCHEDULED for [2026-08-06T06:00:00Z, 2026-08-06T07:00:00Z) with declared_coo USA and target_lean_pct 84.3."
          setup_api_calls:
            - call: "POST /meat-ops/departments"
              payload: { name: "Meat 41", store_code: "S041" }
              as: StoreAdmin
              as_user_id: "admin-01"
              captures: { dept_id: $.data.id }
            - call: "POST /_clock/set_current_utc"
              payload: { current_utc: "2026-08-05T08:00:00Z" }
              as: StoreAdmin
              as_user_id: "admin-01"
            - call: "POST /meat-ops/retail-items"
              payload: { department_id: "${dept_id}", item_code: "RIB01", subprimal_code: "RIBEYE_STEAK", product_class: "WHOLE_MUSCLE" }
              as: MeatManager
              as_user_id: "mgr-01"
              captures: { ri1_id: $.data.id }
            - call: "POST /meat-ops/retail-items"
              payload: { department_id: "${dept_id}", item_code: "GRD80", subprimal_code: "GROUND_CHUCK_80", product_class: "GROUND" }
              as: MeatManager
              as_user_id: "mgr-01"
              captures: { ri2_id: $.data.id }
            - call: "POST /meat-ops/primal-purchases"
              payload: { department_id: "${dept_id}", primal_code: "BEEF_RIBEYE_LIP_ON", product_class: "WHOLE_MUSCLE", country_of_origin: "USA", vendor_name: "Prairie Packing", gross_weight_lb: 100.0, invoice_cost_cents: 84000, freight_cost_cents: 2500, vendor_allowance_cents: 500, receiving_shrink_lb: 1.5, received_at: "2026-08-05T06:00:00Z" }
              as: MeatCutter
              as_user_id: "cutter-01"
              captures: { p1_id: $.data.id, p1_v: $.data.version }
            - call: "POST /meat-ops/retail-items/${ri2_id}/price-proposals"
              payload: { primal_purchase_id: "${p1_id}" }
              as: PricingAnalyst
              as_user_id: "analyst-01"
            - call: "POST /meat-ops/cutting-tests"
              payload: { primal_purchase_id: "${p1_id}", test_weight_lb: 98.5, expected_primal_purchase_version: "${p1_v}" }
              as: MeatCutter
              as_user_id: "cutter-01"
              captures: { t1_id: $.data.id }
            - call: "POST /meat-ops/cutting-tests/${t1_id}/lines"
              payload: { line_seq: 1, subprimal_code: "RIBEYE_STEAK", disposition: "SALABLE_CUT", yield_weight_lb: 62.0, market_value_per_lb_cents: 1450, retail_item_id: "${ri1_id}" }
              as: MeatCutter
              as_user_id: "cutter-01"
            - call: "POST /meat-ops/cutting-tests/${t1_id}/lines"
              payload: { line_seq: 2, subprimal_code: "RIBEYE_TRIM_LEAN", disposition: "GRIND_TRIM", yield_weight_lb: 12.0, market_value_per_lb_cents: 420, lean_pct: 78.0 }
              as: MeatCutter
              as_user_id: "cutter-01"
              captures: { ctl2_id: $.data.id }
            - call: "POST /meat-ops/cutting-tests/${t1_id}/lines"
              payload: { line_seq: 3, subprimal_code: "RIBEYE_TRIM_EXTRA_LEAN", disposition: "GRIND_TRIM", yield_weight_lb: 6.5, market_value_per_lb_cents: 520, lean_pct: 92.0 }
              as: MeatCutter
              as_user_id: "cutter-01"
              captures: { ctl3_id: $.data.id }
            - call: "POST /meat-ops/cutting-tests/${t1_id}/lines"
              payload: { line_seq: 4, subprimal_code: "RIBEYE_FAT_BONE", disposition: "FAT_BONE_LOSS", yield_weight_lb: 18.0, market_value_per_lb_cents: 0 }
              as: MeatCutter
              as_user_id: "cutter-01"
            - call: "POST /meat-ops/cutting-tests/${t1_id}/transitions"
              payload: { action: "SUBMIT" }
              as: MeatCutter
              as_user_id: "cutter-01"
            - call: "POST /meat-ops/cutting-tests/${t1_id}/transitions"
              payload: { action: "APPROVE" }
              as: MeatManager
              as_user_id: "mgr-01"
            - call: "POST /meat-ops/trim-lots"
              payload: { department_id: "${dept_id}", lot_code: "TL-A78", received_lb: 12.0, pack_date: "2026-08-05", cutting_test_line_id: "${ctl2_id}" }
              as: MeatCutter
              as_user_id: "cutter-01"
              captures: { tl1_id: $.data.id }
            - call: "POST /meat-ops/trim-lots"
              payload: { department_id: "${dept_id}", lot_code: "TL-B92", received_lb: 6.5, pack_date: "2026-08-05", cutting_test_line_id: "${ctl3_id}" }
              as: MeatCutter
              as_user_id: "cutter-01"
              captures: { tl2_id: $.data.id }
            - call: "POST /meat-ops/grind-runs"
              payload: { department_id: "${dept_id}", target_retail_item_id: "${ri2_id}", declared_coo: "USA", scheduled_start_at: "2026-08-06T06:00:00Z", scheduled_end_at: "2026-08-06T07:00:00Z", target_lean_pct: 84.3 }
              as: MeatCutter
              as_user_id: "cutter-01"
              captures: { gr1_id: $.data.id }
          trigger:
            - call: "POST /meat-ops/grind-runs/${gr1_id}/inputs"
              payload: { trim_lot_id: "${tl1_id}", input_seq: 1, weight_lb: 8.0 }
              as: MeatCutter
              as_user_id: "cutter-01"
              captures: { gi1_id: $.data.id }
            - call: "POST /meat-ops/grind-runs/${gr1_id}/inputs"
              payload: { trim_lot_id: "${tl2_id}", input_seq: 2, weight_lb: 6.5 }
              as: MeatCutter
              as_user_id: "cutter-01"
              captures: { gi2_id: $.data.id }
            - call: "POST /meat-ops/grind-runs/${gr1_id}/transitions"
              payload: { action: "START" }
              as: MeatCutter
              as_user_id: "cutter-01"
            - call: "POST /meat-ops/grind-runs/${gr1_id}/transitions"
              payload: { action: "ABORT", abort_reason: "auger seal failed mid-batch, product pulled to rework hold" }
              as: MeatManager
              as_user_id: "mgr-01"
          assert:
            - "After input 1: TrimLot.${tl1_id}.allocated_lb == 8.00, remaining_lb == 4.00, status == PARTIALLY_COMMITTED (8.00 < 12.00)"
            - "After input 2: TrimLot.${tl2_id}.allocated_lb == 6.50, remaining_lb == 0.00, status == FULLY_COMMITTED (6.50 == 6.50)"
            - "After START: GrindRun.${gr1_id}.status == IN_PROGRESS, batch_weight_lb == 14.50, blended_lean_pct == 84.28 ((8.0*78.0 + 6.5*92.0)/14.5 == 84.275862 rounded half-up to 2dp), coo_label == USA"
            - "After ABORT: GrindRun.${gr1_id}.status == ABORTED with abort_reason stored and completed_at unset"
            - "TrimLot.${tl1_id}.allocated_lb == 0.00, remaining_lb == 12.00, consumed_lb == 0.00, discarded_lb == 0.00, status == AVAILABLE"
            - "TrimLot.${tl2_id}.allocated_lb == 0.00, remaining_lb == 6.50, consumed_lb == 0.00, discarded_lb == 0.00, status == AVAILABLE"
            - "INVARIANT for both lots at every step: received_lb == remaining_lb + allocated_lb + consumed_lb + discarded_lb (12.00 and 6.50 respectively), with zero drift"
            - "GrindInput.${gi1_id}.consumed == false and GrindInput.${gi2_id}.consumed == false"
            - "RetailItem.${ri2_id}.yield_adjusted_cost_per_lb_cents == 0 and country_of_origin_label == PENDING and price_status == PROPOSED (no COMPLETED-branch side effect leaked)"

      - name: cutting_test_supersede_conserves_purchase_cost_ledger
        grounds:
          - state_machines.CuttingTest.APPROVED_to_SUPERSEDED
          - state_machines.PrimalPurchase.CUT_TESTED_to_RECEIVED
          - entities.PrimalPurchase.fields.allocated_cost_cents
          - entities.PrimalPurchase.fields.unallocated_cost_cents
          - entities.CuttingTestLine.fields.allocated_cost_cents
          - calculations.subprimal_cost_allocation
          - concurrency_rules[cutting-test-create-stale-purchase]
        distinguishing_aspect: |
          The conserved quantity is CENTS on the purchase cost ledger:
          allocated_cost_cents + unallocated_cost_cents == landed_cost_total_cents == 86000 both
          while an APPROVED test holds the whole 86000 and after a newly created test supersedes
          it and rewinds every line allocation to 0, with PrimalPurchase.version incrementing so
          the rewind is observable. The sibling instance conserves pounds under a GrindRun ABORT.
        test_recipe:
          setup:
            - "Department 'Meat 41' at default config; clock at 2026-08-05T08:00:00Z."
            - "PrimalPurchase P1: net_weight_lb 98.5, landed_cost_total_cents 86000, status RECEIVED, allocated_cost_cents 0, unallocated_cost_cents 86000."
            - "CuttingTest T1 carries the four standard lines and has been SUBMITTED then APPROVED, so the allocation is 78636 / 4408 / 2956 / 0 cents."
          setup_api_calls:
            - call: "POST /meat-ops/departments"
              payload: { name: "Meat 41", store_code: "S041" }
              as: StoreAdmin
              as_user_id: "admin-01"
              captures: { dept_id: $.data.id }
            - call: "POST /_clock/set_current_utc"
              payload: { current_utc: "2026-08-05T08:00:00Z" }
              as: StoreAdmin
              as_user_id: "admin-01"
            - call: "POST /meat-ops/retail-items"
              payload: { department_id: "${dept_id}", item_code: "RIB01", subprimal_code: "RIBEYE_STEAK", product_class: "WHOLE_MUSCLE" }
              as: MeatManager
              as_user_id: "mgr-01"
              captures: { ri1_id: $.data.id }
            - call: "POST /meat-ops/primal-purchases"
              payload: { department_id: "${dept_id}", primal_code: "BEEF_RIBEYE_LIP_ON", product_class: "WHOLE_MUSCLE", country_of_origin: "USA", vendor_name: "Prairie Packing", gross_weight_lb: 100.0, invoice_cost_cents: 84000, freight_cost_cents: 2500, vendor_allowance_cents: 500, receiving_shrink_lb: 1.5, received_at: "2026-08-05T06:00:00Z" }
              as: MeatCutter
              as_user_id: "cutter-01"
              captures: { p1_id: $.data.id, p1_v: $.data.version }
            - call: "POST /meat-ops/cutting-tests"
              payload: { primal_purchase_id: "${p1_id}", test_weight_lb: 98.5, expected_primal_purchase_version: "${p1_v}" }
              as: MeatCutter
              as_user_id: "cutter-01"
              captures: { t1_id: $.data.id }
            - call: "POST /meat-ops/cutting-tests/${t1_id}/lines"
              payload: { line_seq: 1, subprimal_code: "RIBEYE_STEAK", disposition: "SALABLE_CUT", yield_weight_lb: 62.0, market_value_per_lb_cents: 1450, retail_item_id: "${ri1_id}" }
              as: MeatCutter
              as_user_id: "cutter-01"
              captures: { ctl1_id: $.data.id }
            - call: "POST /meat-ops/cutting-tests/${t1_id}/lines"
              payload: { line_seq: 2, subprimal_code: "RIBEYE_TRIM_LEAN", disposition: "GRIND_TRIM", yield_weight_lb: 12.0, market_value_per_lb_cents: 420, lean_pct: 78.0 }
              as: MeatCutter
              as_user_id: "cutter-01"
              captures: { ctl2_id: $.data.id }
            - call: "POST /meat-ops/cutting-tests/${t1_id}/lines"
              payload: { line_seq: 3, subprimal_code: "RIBEYE_TRIM_EXTRA_LEAN", disposition: "GRIND_TRIM", yield_weight_lb: 6.5, market_value_per_lb_cents: 520, lean_pct: 92.0 }
              as: MeatCutter
              as_user_id: "cutter-01"
              captures: { ctl3_id: $.data.id }
            - call: "POST /meat-ops/cutting-tests/${t1_id}/lines"
              payload: { line_seq: 4, subprimal_code: "RIBEYE_FAT_BONE", disposition: "FAT_BONE_LOSS", yield_weight_lb: 18.0, market_value_per_lb_cents: 0 }
              as: MeatCutter
              as_user_id: "cutter-01"
              captures: { ctl4_id: $.data.id }
            - call: "POST /meat-ops/cutting-tests/${t1_id}/transitions"
              payload: { action: "SUBMIT" }
              as: MeatCutter
              as_user_id: "cutter-01"
            - call: "POST /meat-ops/cutting-tests/${t1_id}/transitions"
              payload: { action: "APPROVE" }
              as: MeatManager
              as_user_id: "mgr-01"
          trigger:
            - call: "GET /meat-ops/primal-purchases/${p1_id}"
              payload: {}
              as: MeatManager
              as_user_id: "mgr-01"
              captures: { p1_v2: $.data.version }
            - call: "POST /meat-ops/cutting-tests"
              payload: { primal_purchase_id: "${p1_id}", test_weight_lb: 98.5, expected_primal_purchase_version: "${p1_v2}" }
              as: MeatCutter
              as_user_id: "cutter-01"
              captures: { t2_id: $.data.id }
          assert:
            - "Before the supersede: PrimalPurchase.${p1_id}.allocated_cost_cents == 86000, unallocated_cost_cents == 0, status == CUT_TESTED"
            - "Before the supersede: CuttingTestLine allocations are ${ctl1_id} 78636, ${ctl2_id} 4408, ${ctl3_id} 2956, ${ctl4_id} 0 (sum 86000)"
            - "The supersede request returns 201 and CuttingTest.${t2_id}.status == DRAFT with revision_count == 0"
            - "COMPENSATION: CuttingTest.${t1_id}.status == SUPERSEDED"
            - "COMPENSATION: CuttingTestLine.${ctl1_id}.allocated_cost_cents == 0 and allocated_cost_per_lb_cents == 0; same for ${ctl2_id}, ${ctl3_id} and ${ctl4_id}"
            - "COMPENSATION: PrimalPurchase.${p1_id}.allocated_cost_cents == 0, unallocated_cost_cents == 86000, status == RECEIVED"
            - "INVARIANT before and after: allocated_cost_cents + unallocated_cost_cents == landed_cost_total_cents == 86000"
            - "PrimalPurchase.${p1_id}.version == ${p1_v2} + 1, so a replay of the same payload with ${p1_v2} would now return ERR_STALE_PARENT_VERSION (412)"
