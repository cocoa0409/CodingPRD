            - call: "POST /casting-calls"
              payload: { casting_director_id: "${cd_id}", title: "Lead", media_type: "BROADCAST_TV", usage_term_months: 12, shoot_start_date: "2026-03-15T00:00:00Z", shoot_end_date: "2026-03-15T00:00:00Z", offered_day_rate_cents: 100002 }
              as: CastingDirector
              as_user_id: "${cd_id}"
              captures: { call_id: $.data.id }
            - call: "POST /submissions"
              payload: { casting_call_id: "${call_id}", talent_id: "${talent_id}", comp_card_id: "${cc_id}" }
              as: Agent
              captures: { sub_id: $.data.id }
            - call: "POST /deal-memos"
              payload: { casting_call_id: "${call_id}", talent_id: "${talent_id}", submission_id: "${sub_id}" }
              as: CastingDirector
              as_user_id: "${cd_id}"
              captures: { dm_id: $.data.id }
            - call: "POST /deal-memos/${dm_id}/offer"
              payload: { offer_day_rate_cents: 100002, offer_usage_term_months: 12 }
              as: CastingDirector
              as_user_id: "${cd_id}"
            - call: "POST /deal-memos/${dm_id}/accept"
              payload: {}
              as: Talent
              as_user_id: "${talent_id}"
            - call: "POST /availability-holds"
              payload: { talent_id: "${talent_id}", start_date: "2026-03-15T00:00:00Z", end_date: "2026-03-15T00:00:00Z", hold_kind: "CONFIRMED_BOOKING" }
              as: Agent
              captures: { hold_id: $.data.id }
            - call: "GET /talents/${talent_id}"
              payload: {}
              as: Agent
