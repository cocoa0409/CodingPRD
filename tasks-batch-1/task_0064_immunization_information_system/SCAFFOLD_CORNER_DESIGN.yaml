              captures: { lot_id: $.data.id }
            - call: "POST /patients"
              payload: { full_name: "Child Y", date_of_birth: "2024-01-01", state_code: "CA" }
              as: ImmunizationRegistrar
              captures: { pat_id: $.data.id }
            - call: "POST /immunizations"
              payload: { patient_id: "${pat_id}", lot_id: "${lot_id}", provider_id: "${prov_id}", administered_date: "2025-01-01" }
              as: ImmunizationRegistrar
            - call: "POST /patients/${pat_id}/evaluations"
              payload: { as_of_date: "2026-06-01" }
              as: ImmunizationRegistrar
              captures: { eval_id: $.data.id, pv: $.data.version }
            - call: "POST /patients/${pat_id}/certificates"
              payload: { evaluation_id: "${eval_id}", expected_patient_version: "${pv}" }
              as: ImmunizationRegistrar
          trigger:
            - call: "POST /patients/${pat_id}/certificates"
              payload: { evaluation_id: "${eval_id}", expected_patient_version: "${pv}" }
              as: ImmunizationRegistrar
              captures: { err: $.data.error_id }
          assert:
            - "response error_id == ERR_STALE_PATIENT_VERSION"

      - name: derived_schedule_status_reconciled_after_recall
        claim_type: derived_field_reconciliation
        grounds:
          - "entities.Patient.fields.schedule_status"
          - "calculations.compliance_completeness"
        distinguishing_aspect: "After a recall invalidates a patient's only dose, a re-run evaluation recomputes Patient.schedule_status from UP_TO_DATE to BEHIND."
        test_recipe:
          setup: ["Clock 2026-06-01. Patient with one valid C1 dose -> UP_TO_DATE; the dose's lot then recalled."]
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-06-01T00:00:00Z" }
              as: ImmunizationRegistrar
            - call: "POST /products"
              payload: { product_code: "C1", antigen: "C1", doses_in_series: 1, min_age_days: 0, recommended_age_days: 0, min_interval_days: 0 }
              as: ImmunizationRegistrar
              captures: { prod_id: $.data.id }
            - call: "POST /providers"
              payload: { name: "Clinic AK", vfc_pin: "PIN-AK", authorized_product_codes: ["C1"] }
              as: ImmunizationRegistrar
              captures: { prov_id: $.data.id }
            - call: "POST /lots"
              payload: { product_id: "${prod_id}", lot_number: "LAK", received_date: "2024-01-01", expiration_date: "2027-01-01", doses_total: 10 }
              as: ImmunizationRegistrar
              captures: { lot_id: $.data.id }
            - call: "POST /patients"
              payload: { full_name: "Child Z", date_of_birth: "2024-01-01", state_code: "CA" }
              as: ImmunizationRegistrar
              captures: { pat_id: $.data.id }
            - call: "POST /immunizations"
              payload: { patient_id: "${pat_id}", lot_id: "${lot_id}", provider_id: "${prov_id}", administered_date: "2025-01-01" }
              as: ImmunizationRegistrar
            - call: "POST /patients/${pat_id}/evaluations"
              payload: { as_of_date: "2026-06-01" }
              as: ImmunizationRegistrar
            - call: "POST /lots/${lot_id}/recalls"
              payload: { reason: "contamination" }
              as: ImmunizationRegistrar
          trigger:
            - call: "POST /patients/${pat_id}/evaluations"
              payload: { as_of_date: "2026-06-01" }
              as: ImmunizationRegistrar
              captures: { eval_id: $.data.id }
            - call: "GET /patients/${pat_id}"
              payload: {}
              as: ImmunizationRegistrar
          assert:
            - "ScheduleEvaluation.${eval_id}.overall_status == BEHIND"
            - "Patient.${pat_id}.schedule_status == BEHIND"

  # =========================================================================
  - section: consistency_model
    instances:
      - name: recall_cascade_atomic_in_single_response
        claim_type: immediate
        grounds:
          - "endpoints"
          - "state_machines.Immunization.RECORDED_to_INVALIDATED"
        distinguishing_aspect: "Issuing a recall returns a LotRecall whose invalidated_count already reflects every struck dose in the same response (immediate consistency)."
        test_recipe:
          setup: ["Clock 2026-06-01. Two patients each with one recorded dose on the same lot."]
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-06-01T00:00:00Z" }
              as: ImmunizationRegistrar
            - call: "POST /products"
              payload: { product_code: "C1", antigen: "C1", doses_in_series: 1, min_age_days: 0, recommended_age_days: 0, min_interval_days: 0 }
              as: ImmunizationRegistrar
              captures: { prod_id: $.data.id }
            - call: "POST /providers"
              payload: { name: "Clinic AL", vfc_pin: "PIN-AL", authorized_product_codes: ["C1"] }
              as: ImmunizationRegistrar
              captures: { prov_id: $.data.id }
            - call: "POST /lots"
              payload: { product_id: "${prod_id}", lot_number: "LAL", received_date: "2024-01-01", expiration_date: "2027-01-01", doses_total: 10 }
              as: ImmunizationRegistrar
              captures: { lot_id: $.data.id }
            - call: "POST /patients"
              payload: { full_name: "Child AA", date_of_birth: "2024-01-01", state_code: "CA" }
              as: ImmunizationRegistrar
              captures: { pat_a: $.data.id }
            - call: "POST /patients"
              payload: { full_name: "Child BB", date_of_birth: "2024-01-01", state_code: "CA" }
              as: ImmunizationRegistrar
              captures: { pat_b: $.data.id }
            - call: "POST /immunizations"
              payload: { patient_id: "${pat_a}", lot_id: "${lot_id}", provider_id: "${prov_id}", administered_date: "2025-01-01" }
              as: ImmunizationRegistrar
            - call: "POST /immunizations"
              payload: { patient_id: "${pat_b}", lot_id: "${lot_id}", provider_id: "${prov_id}", administered_date: "2025-01-01" }
              as: ImmunizationRegistrar
          trigger:
            - call: "POST /lots/${lot_id}/recalls"
              payload: { reason: "lot-wide" }
              as: ImmunizationRegistrar
              captures: { recall_id: $.data.id }
          assert:
            - "LotRecall.${recall_id}.invalidated_count == 2"

      - name: error_subscription_recall_blocks_record_stub
        claim_type: violation_to_error
        grounds:
          - "errors[ERR_LOT_RECALLED]"
        excluded_because:
          difficulty_instance: cross_entity_state_dependency / immunization_record_blocked_when_lot_recalled
          rationale: "ERR_LOT_RECALLED on record against a recalled lot is asserted by the named §1.8 instance."
