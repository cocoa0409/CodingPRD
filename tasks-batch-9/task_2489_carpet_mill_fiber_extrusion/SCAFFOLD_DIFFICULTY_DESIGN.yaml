            - call: "POST /mill/cut-orders/${co}/allocate"
              payload: {}
              as: MillPlanner
          assert:
            - "RollGood.${rg}.qa_status == HELD and RollGood.${rg}.inventory_status == IN_PROCESS, so the priority-28 candidate set is empty"
            - "the first allocate returns HTTP 422 with data.error_id == ERR_FLAMMABILITY_CERT_REQUIRED"
            - "the first allocate does NOT return data.error_id == ERR_NO_ELIGIBLE_ROLL_GOODS"
